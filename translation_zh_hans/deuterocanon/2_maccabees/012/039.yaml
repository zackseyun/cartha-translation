review_pass:
  verdict: revise
  source_fidelity: “送回亲属那里”在现代汉语中通常表示把遗体交还给仍在世的亲属；这不是希腊文 μετὰ τῶν συγγενῶν 的自然表达，且使其与后面的“安葬在祖坟中”形成不必要的两步动作。原文将遗体安置“与亲属一起／在亲属中间”并归入祖传坟墓的关联应予保留。
  naturalness: “因事情需要，就来收殓”略显生硬，也没有自然表达“当时已到了必须如此办理的时候”。改为“当时需要……，便前来……”较符合现代叙事汉语。
  terminology: “收殓”“阵亡者的遗体”及“祖传的坟墓”均庄重、清楚。以“亲属身边”表达 burial association，避免将 συγγενῶν误作活着的接收者；脚注保留其确切空间关系的句法余地。
  issues:
  - severity: medium
    issue: “把他们送回亲属那里”将亲属理解为遗体的接收者。
    rationale: μετὰ τῶν συγγενῶν 意为“与亲属一起／在亲属中间”，在此安葬语境中更自然指与已葬的亲属同处，而非交给亲属；原译额外引入“送回”和接收动作。
  - severity: low
    issue: “因事情需要，就来”不够自然，且“来”的时机关系表达不清。
    rationale: καθʼ ὃν χρόνον τὸ τῆς χρείας ἐγέγονει 表示此事已成为必要之时；调整语序可更清晰地保留这一时间—必要性关系。
