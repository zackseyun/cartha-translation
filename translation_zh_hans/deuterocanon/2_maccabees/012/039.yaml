base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/039.yaml
  text: On the following day[a], the men with Judas came, when the need had arisen, to gather up the bodies of those who had fallen and to restore them with their relatives to the tombs of their fathers.
translation:
  language: zh_hans
  text: 第二天，当时需要收殓阵亡者的遗体，并把他们安葬在亲属身边、归入祖传的坟墓中，犹大一行人便前来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们与亲属一同归入祖传的坟墓中。”希腊文同时提到“亲属”和“祖传的坟墓”；“与亲属一起”的确切空间关系未明。
    reason: 保留 μετὰ τῶν συγγενῶν 与 εἰς τοὺς πατρῴους τάφους 之间可有不同理解的句法关系，同时避免把亲属说成遗体被交还的对象。
lexical_decisions:
- source_word: τῇ δὲ ἐχομένῃ
  choice: 第二天
  rationale: 这是自然、简洁的现代汉语时间表达，准确传达“次日”。
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: 犹大一行人
  rationale: 该短语指以犹大为中心的同行者或所属群体；“一行人”保留群体含义，又不额外限定为军队。
- source_word: καθʼ ὃν χρόνον τὸ τῆς χρείας ἐγέγονει
  choice: 因事情需要
  rationale: 希腊文表示当时情势已使此事成为必要；此译法符合汉语叙事习惯，并避免过度解释具体原因。
- source_word: τὰ σώματα τῶν προπεπτωκότων
  choice: 阵亡者的遗体
  rationale: 上下文是战事，προπεπτωκότων 指已经倒下的人；“阵亡者”自然明确，“遗体”庄重得体。
- source_word: ἀνακομίσασθαι
  choice: 收殓
  rationale: 在此指收集并运走战场上的遗体；“收殓”在汉语中自然涵盖料理、收取遗体以备安葬的行动。
- source_word: ἀποκαταστῆσαι
  choice: 送回……安葬
  rationale: 该动词有恢复、送回原属之处的含义；结合坟墓语境译为“送回……安葬”，既自然又保留归返安置之意。
- source_word: μετὰ τῶν συγγενῶν
  choice: 亲属那里
  rationale: 保留希腊文明确出现的亲属关系，同时不武断规定是葬在亲属身旁，还是由亲属接收安葬。
- source_word: εἰς τοὺς πατρῴους τάφους
  choice: 在祖坟中
  rationale: πατρῴους τάφους 指承自先祖或属于家族的墓地；“祖坟”是自然而准确的现代汉语表达。
theological_decisions:
- issue: 亲属与祖坟之间的句法及埋葬关系
  choice: 把他们送回亲属那里，安葬在祖坟中
  alternative: 把他们与亲属一同安葬在祖坟中
  rationale: 希腊文同时保留 μετὰ τῶν συγγενῶν（与亲属一起／在亲属中间）和 εἰς τοὺς πατρῴους τάφους（进入祖传坟墓）两个成分，其精确空间关系略有张力。正文保留两者而不认定亲属必然已经葬在墓中；脚注给出另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“收殓”“遗体”“祖坟”符合安葬场景；避免生硬直译“恢复他们”，也不加入经文未明说的宗派性或教义性解释。
