  text: And after taking up a collection man by man[a], he sent two thousand silver drachmas to Jerusalem to provide a sin offering, acting very well and nobly, because he was reasoning about the resurrection.
translation:
  language: zh_hans
  text: 他按人头筹集了一笔款项[a]，共两千枚银德拉克马，便送到耶路撒冷，好献上赎罪祭。他这样做非常好，也很高尚，因为他考虑到复活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“逐人征集”，也可能指“按人员名册摊派”；希腊语κατʼ ἀνδρολόγιον略带技术性，可能指向每个人分别征收的款项。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατʼ ἀνδρολόγιον
  choice: 按人头募集了捐款
  rationale: 保留该技术性短语的逐人、按名额征集之意，同时不武断判定具体行政方式；以脚注说明也可能涉及按名册摊派。
- source_word: ποιησάμενος
  choice: 募集了
  rationale: 分词表示先于差遣发生的行动；结合随后出现的款项，译为“募集了”比直译“作了”自然明确。
- source_word: ἀργυρίου δραχμὰς δισχιλίας
  choice: 两千银德拉克马
  rationale: 同时保留数额、银质及古代币名，不以现代货币单位换算。
- source_word: προσαγαγεῖν
  choice: 供献……之用
  rationale: 犹大送去的是钱，目的是让祭物在耶路撒冷被献上；此译保留其间接使祭得献的含义。
- source_word: περὶ ἁμαρτίας θυσίαν
  choice: 赎罪祭
  rationale: 这是希腊语中指为罪而献之祭的常见祭祀表达；“赎罪祭”在现代中文中简洁且可理解。
- source_word: πάνυ καλῶς καὶ ἀστείως πράττων
  choice: 这样做非常好，也很高尚
  rationale: 明确保留原文强烈的肯定评价；ἀστείως在此指合宜、优美或高尚，而非现代意义的“城市化”。
- source_word: ὑπὲρ ἀναστάσεως διαλογιζόμενος
  choice: 因为他所思量的是复活
  rationale: 将ὑπέρ按语境表达为行动的理由，并以“思量”保留διαλογίζομαι审慎考虑、推想的意味；不擅加“死人”作为ἀνάστασις的限定语。
theological_decisions:
- issue: 作者对犹大为罪献祭之举的评价
  choice: 直译为“这样做非常好，也很高尚”
  alternative: 采用较中性的措辞，淡化作者的赞许
  rationale: πάνυ καλῶς καὶ ἀστείως πράττων明确而强烈地称许这一行动；即使相关实践在不同传统中有争议，也不应在翻译中削弱原文评价。
- issue: ἀνάστασις的所指
  choice: 复活
  alternative: 死人的复活
  rationale: 原文只有名词“复活”，未明说属格限定；上下文虽关乎死者，正文仍不补入原文没有的限定，以保留表达范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“银德拉克马”保留古币名；“供献赎罪祭之用”明确钱款与实际献祭之间的目的关系；正文脚注标记与脚注对应。
