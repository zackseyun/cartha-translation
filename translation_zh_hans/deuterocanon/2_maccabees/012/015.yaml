base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/015.yaml
  text: But those around Judas[a], having called on the great Sovereign of the world—the one who, in the time of Joshua, brought down Jericho without rams or siege engines—assaulted the wall fiercely.
translation:
  language: zh_hans
  text: 犹大一行人呼求统管世界的大主宰，就是那位在约书亚[a]时代，不用攻城锤和攻城器械便使耶利哥倾覆的主；他们如猛兽般冲击城墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文此处的Ἰησοῦ是这个名字的属格形式，按新约惯例也可译作“耶稣”；但因提到耶利哥，所指是约书亚。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: 犹大一行人
  rationale: περὶ加领袖人名可指以该领袖为中心的一群人。“犹大一行人”符合现代汉语习惯，又不把他们的具体身份限定得超过原文。
- source_word: ἐπικαλεσάμενοι
  choice: 呼求
  rationale: 该中间语态分词在此表示向上帝求告、祈求；“呼求”既保留宗教语境，也简明自然。
- source_word: τὸν μέγαν τοῦ κόσμου δυνάστην
  choice: 统管世界的大主宰
  rationale: δυνάστης强调有权能的统治者；“大主宰”保留庄重感，“统管世界”自然表达其权柄范围。
- source_word: τὸν ἄτερ κριῶν καὶ μηχανῶν ὀργανικῶν
  choice: 不用攻城锤和攻城器械
  rationale: κριός在攻城语境中指攻城锤，μηχαναί ὀργανικαί指机械性的攻城装置；此译明确而不过度细化。
- source_word: κατακρημνίσαντα τὴν Ἰερειχὼ
  choice: 使耶利哥倾覆
  rationale: κατακρημνίζω含有使之坠落、倒塌之意；“倾覆”保留强烈的摧毁意象，并符合耶利哥陷落的典故。
- source_word: κατὰ τοὺς Ἰησοῦ χρόνους
  choice: 在约书亚时代
  rationale: Ἰησοῦ在七十士译本中也用于约书亚；耶利哥的典故明确指嫩的儿子约书亚，故采用中文标准人名。
- source_word: ἐνέσεισαν θηριωδῶς τῷ τείχει
  choice: 如猛兽般猛攻城墙
  rationale: ἐνέσεισαν在此描述对城墙施加强烈冲击，θηριωδῶς字面带有野兽般凶猛之意；此译兼顾军事语境与原文的鲜明比喻。
theological_decisions:
- issue: 耶利哥典故中Ἰησοῦ所指的人物
  choice: 约书亚
  alternative: 耶稣（按希腊文名字形式直译）
  rationale: 上下文明确指耶利哥在约书亚时代陷落。译作“约书亚”准确标明历史所指，避免现代读者误解为拿撒勒人耶稣，同时以脚注说明希腊文形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“犹大一行人”自然表达领袖及其同伴；分号划分向上帝呼求的背景与猛攻城墙的主动作。“如猛兽般”保留θηριωδῶς的形象性，避免把原文力度弱化为一般的“猛烈”。
