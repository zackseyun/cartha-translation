lexical_decisions:
- source_word: μεταλαβών
  choice: 得知
  rationale: 此处表示获悉、了解到所发生之事；译作“得知”自然简洁。
- source_word: τὴν γεγονυῖαν ... ὠμότητα
  choice: 所遭受的残暴行径
  rationale: ὠμότης指残酷、凶暴；结合εἰς τοὺς ὁμοεθνεῖς表达针对同胞实施的暴行。“所遭受”在汉语中明确受害关系，同时保留事件已经发生的意味。
- source_word: τοὺς ὁμοεθνεῖς
  choice: 同胞
  rationale: 指与犹大同族、同民族的人；“同胞”符合现代汉语叙事语体。
- source_word: παραγγείλας
  choice: 吩咐
  rationale: 过去分词表示他随后向身边的人下令；“吩咐”自然，并可与下节命令内容衔接。
- source_word: τοῖς περὶ αὐτὸν ἀνδράσιν
  choice: 跟随他的人
  rationale: 字面为“在他周围的人”，语境指随从或部下；“跟随他的人”避免机械直译，且不额外限定其正式军职。
