base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/010.yaml
  text: From there[a], after they had gone nine stadia, while making their march against Timotheus, Arabs fell upon him, no fewer than five thousand, and five hundred horsemen.
translation:
  language: zh_hans
  text: 他们离开那里，走了九斯塔迪昂[a]。他们正向提摩太进军时，阿拉伯人突然袭击了他[b]；来袭的阿拉伯人不少于五千名，另有五百名骑兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “斯塔迪昂”是古代长度单位；九斯塔迪昂约合1.7公里，但实际长度因时代和地区而略有差异。
    reason: ancient_measurement
  - marker: b
    text: 希腊文作单数“他”（αὐτῷ）。有些译法按上下文理解为犹大的部队而译作“他们”，但所据文本的形式是单数。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποστάντες
  choice: 离开那里
  rationale: 该不定过去时分词表示从前一地点离开；结合句首Ἐκεῖθεν，译为“离开那里”自然清楚，不额外强化分离之意。
- source_word: σταδίους ἐννέα
  choice: 九斯塔迪昂
  rationale: 保留原文的古代长度单位，避免把近似的现代换算值写成经文所给的精确数字。
- source_word: ποιουμένων τὴν πορίαν
  choice: 正……进军时
  rationale: 这一属格独立结构描写当时正在进行的行程；军事语境下“进军”比一般性的“赶路”更贴切。
- source_word: ἐπὶ τὸν Τιμόθεον
  choice: 向提摩太进军
  rationale: ἐπί加宾格在此军事语境中表示以提摩太为进军目标；中文“向……进军”既保留方向，也自然带出敌对意味。
- source_word: ἐπέβαλον
  choice: 突然袭击
  rationale: 该动词在这里表示猛然发动敌对攻击；“突然袭击”比泛泛的“攻击”更能传达其突袭色彩。
- source_word: Ἄραβες
  choice: 阿拉伯人
  rationale: 这是Ἄραβες在现代汉语中的直接、通行称呼。
- source_word: αὐτῷ
  choice: 他
  rationale: 所据希腊文本使用阳性单数与格代词；正文保留单数，不按上下文擅自改成复数“他们”。
- source_word: οὐκ ἐλάττους τῶν πεντακισχιλίων
  choice: 不少于五千
  rationale: 准确表达原文所给的最低人数界限，同时符合现代汉语习惯。
- source_word: ἱππεῖς δὲ πεντακόσιοι
  choice: 另有骑兵五百
  rationale: ἱππεῖς指骑马作战的兵员；“另有”自然表达δέ在人数说明中的补充作用，但不把原文改写成更具体的兵种编制。
theological_decisions:
- issue: 单数代词αὐτῷ的所指
  choice: 正文译作“他”，不明说是犹大、提摩太或整支军队
  alternative: 按上下文译作“他们”，指犹大及其部队
  rationale: 原文形式明确为单数，但其具体所指在叙事衔接上并不完全显明；保留“他”可忠实呈现文本形式与指代张力，避免无根据地消除歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以短句理清希腊文较长的分词结构；保留古代距离单位并在脚注解释。正文保留单数“他”，不替读者判定其具体所指。
