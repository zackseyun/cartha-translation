  yaml_path: translation/deuterocanon/2_maccabees/012/037.yaml
  text: Beginning the battle cry in the language of his fathers[a], with hymns[b], he shook those around Gorgias by surprise and put them to flight.
translation:
  language: zh_hans
  text: 他先用先祖的语言[a]，伴着颂歌发出战呼；他出其不意地震撼了哥尔基雅一方的人，使他们溃逃[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用祖传的语言”。希腊语此处最可能指所用的祖传语言；“声音”或“呼声”的意味也可能保留在字面表达中。
    reason: lexical_alternative
  - marker: b
    text: 直译“使他们转向”；在军事语境中指使敌军溃败逃跑。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταρξάμενος
  choice: 发出
  rationale: 该词是表示先行动作的不定过去时中间语态分词；汉语按动作次序自然表达，不必生硬译出分词形式。结合宾语“战呼”，译作“发出”简洁通顺。
- source_word: τῇ πατρίῳ φωνῇ
  choice: 用祖传的语言
  rationale: πατρίῳ意为祖传的、先辈的，φωνῇ可指声音、言语或语言；此处最可能指发出战呼时所用的祖传语言，同时以脚注保留语义幅度。
- source_word: τὴν μεθʼ ὕμνων κραυγήν
  choice: 伴着颂歌发出战呼
  rationale: κραυγή是高声呼喊，在军事语境中可译为“战呼”；μεθʼ ὕμνων表明颂歌相伴，因而同时保留战斗和敬拜两个层面。
- source_word: ἐνσείσας
  choice: 震撼了
  rationale: 原词字面义为“摇动、震动”，在此表示使敌军受到突然而强烈的冲击；“震撼”既保留形象，也符合现代汉语。
- source_word: ἀπροσδοκήτως
  choice: 出其不意地
  rationale: 该副词表示行动超出对方预料；“出其不意地”准确传达这里的突袭意味。
- source_word: τοῖς περὶ τὸν Γοργίαν
  choice: 哥尔基雅周围的人
  rationale: 贴近希腊语“围绕哥尔基雅的人”，所指是哥尔基雅一方的随从或军队，又不额外限定其具体身份。
- source_word: τροπὴν ἐποιήσατο αὐτῶν
  choice: 令他们溃逃
  rationale: τροπή在军事语境中指转身败逃或溃败；译作“令他们溃逃”自然地表达使敌军败退的结果。
theological_decisions:
- issue: 战呼中的宗教成分
  choice: 译为“伴着颂歌发出战呼”
  alternative: “唱着颂歌呐喊”或“发出赞美的呼声”
  rationale: 希腊文将κραυγή（呼喊）与μεθʼ ὕμνων（伴着颂歌）并列结合；译文不把军事行动淡化为单纯赞美，也不省略其明确的宗教表达。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“战呼”“溃逃”契合军事场景，“伴着颂歌”保留宗教色彩；语序依照汉语习惯呈现先发呼喊、后突袭制敌的动作进展。
