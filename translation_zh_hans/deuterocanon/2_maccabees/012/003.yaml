  yaml_path: translation/deuterocanon/2_maccabees/012/003.yaml
  text: 'But the people of Joppa committed such a great act of impiety: they invited the Jews living among them to embark, with their wives and children, in the boats provided by them, as though there were no hostility toward them at all;'
translation:
  language: zh_hans
  text: 约帕人竟犯下了如此严重的不敬之事：他们邀请住在他们中间的犹太人带着妻子儿女，登上他们预备的船只，仿佛对他们毫无敌意似的；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰοππῖται
  choice: 约帕人
  rationale: 这是约帕居民的城邑称谓；“约帕人”简洁自然，并保留其集体含义。
- source_word: τηλικοῦτο
  choice: 如此严重的
  rationale: 该词强调行为程度之大；与负面的“不敬之事”搭配时，“严重”比单纯的“重大”更符合现代汉语习惯。
- source_word: συνετελέσαντο
  choice: 做出了
  rationale: 此处指实施、做成一项恶行；“做出了”与“不敬之事”搭配自然，同时不额外强化为法律意义上的“犯下”。
- source_word: δυσσέβημα
  choice: 不敬之事
  rationale: 该词带有对神圣之事不敬、悖逆虔敬的宗教道德色彩；“不敬之事”保留这一层面，而不泛化为普通“恶行”。
- source_word: παρακαλέσαντες
  choice: 邀请
  rationale: 语境描写以友善姿态诱使犹太人登船；“邀请”能体现表面的礼貌及其背后的欺骗。
- source_word: τοὺς ἐν ἑαυτοῖς οἰκοῦντας Ἰουδαίους
  choice: 住在他们中间的犹太人
  rationale: 准确表达这些犹太人居住于约帕人的社群之中。
- source_word: ἐμβῆναι
  choice: 登上
  rationale: 在船只语境中意为上船；“登上……船只”是自然、清楚的现代汉语。
- source_word: τὰ παρακατασταθέντα ὑπʼ αὐτῶν σκάφη
  choice: 他们预备的船只
  rationale: 分词表示船只由约帕人备妥或安排好；“预备的”既忠实又不对具体安排作过度说明。
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: 带着妻子儿女
  rationale: 汉语自然地表达犹太人与各自家人一同登船；原文未明说所有关系细节，故不扩写。
- source_word: ὡς μηδεμίας ἐνεστώσης πρὸς αὐτοὺς δυσμενείας
  choice: 装作对犹太人毫无敌意
  rationale: ὡς加属格独立结构表达一种假象或托词；结合上下文，“装作”清楚传达其虚假姿态，“毫无”保留μηδεμίας的强调。
theological_decisions:
- issue: δυσσέβημα的宗教道德力度
  choice: 不敬之事
  alternative: 恶行；不虔敬的事
  rationale: “不敬之事”保留原词超越一般作恶的宗教评价，又避免引入特定宗派术语。
- issue: ὡς结构是否明说欺骗意图
  choice: 装作
  alternative: 仿佛；好像
  rationale: ὡς可表达表象；本句先称行为为严重的不敬，且后续事件表明邀请带有恶意，因此“装作”符合叙事语境。不过译文不进一步说明其具体阴谋，以免超出本节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“竟”传达原句转折及强烈谴责语气；以分号保留本节尚未结束、下文将继续交代事件的句法开放性。无脚注标记。
