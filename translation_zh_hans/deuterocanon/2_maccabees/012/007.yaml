  text: But when the place had been closed up[a], he withdrew, intending to come again and root out the entire citizen body of the people of Joppa.
translation:
  language: zh_hans
  text: 但那地方被封锁后，犹大就离去了，准备再回来，将约帕人的整个政治共同体[a]连根拔除。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “政治共同体”也可译作“公民团体”或“全体公民”。希腊语πολίτευμα可指共同体、公民团体或政治共同体。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... χωρίου
  choice: 那地方
  rationale: χωρίον可指地方、区域或地点；此处采用中性的“地方”，不擅自确定为城区、地区或堡垒。
- source_word: συγκλεισθέντος
  choice: 被封锁以后
  rationale: συγκλείω的被动分词表示被合围、封闭或困住；结合军事语境，“被封锁”自然地保留被动与围困意味，同时不细定具体手段。
- source_word: ἀνέλυσεν
  choice: 便撤走了
  rationale: ἀναλύω在叙事中可表示离去或拔营；“撤走”符合军事背景，也与其准备再来的意图相衔接。
- source_word: πάλιν ἥξων
  choice: 打算日后再来
  rationale: 将来分词表达目的或意图；“打算……再来”明确传达这一语法功能，“日后”使现代汉语表达更自然。
- source_word: τὸ σύμπαν ... πολίτευμα
  choice: 整个公民共同体
  rationale: πολίτευμα可指公民团体、政治共同体或共同体建制；“公民共同体”保留其集体和政治性质，不缩窄为政府，也不直接等同于每一个居民。σύμπαν译为“整个”。
- source_word: τῶν Ἰοππιτῶν
  choice: 约帕人的
  rationale: Ἰοππῖται指约帕的居民或公民；“约帕人”简洁自然，并保留群体称谓。
- source_word: ἐκριζῶσαι
  choice: 连根拔除
  rationale: ἐκριζόω本义为拔根，转义为彻底除去；“连根拔除”保留原文的强烈比喻和彻底性。
theological_decisions:
- issue: 犹大计划针对约帕采取行动的严重程度与范围
  choice: 译作“把约帕人的整个公民共同体连根拔除”
  alternative: “消灭约帕所有居民”或“铲除约帕整个政府”
  rationale: 原文核心词πολίτευμα指具有公民—政治性质的集体，并由σύμπαν修饰。译文保留其整体、严厉的军事政治含义，却不把范围武断限定为政府机构，也不扩展为明确杀死每一个居民。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“被封锁”“撤走”体现军事叙事语境；“公民共同体”虽略正式，却能较准确保留πολίτευμα的集体政治内涵。脚注用于说明该词真实存在的词义幅度。
