  text: Then he advanced against Carnion and Atargatis[b][a], and slaughtered twenty-five thousand men.
translation:
  language: zh_hans
  text: 随后，他出兵攻打卡尔尼翁和阿塔伽提翁[a]，屠杀了两万五千人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿塔伽提翁”也可能不是第二个城名，而是指阿塔伽提斯的神庙。
    reason: 保留该希腊专名所指对象的词义歧义。
  - marker: b
    text: 希腊文直译为“身体两万，另加五千”，即共杀了两万五千人。
    reason: 说明原文不寻常的计数方式及σωμάτων（“身体”）的字面意义。
lexical_decisions:
- source_word: Ἐξελθὼν
  choice: 出兵
  rationale: 该分词本义为“出去、出发”；在军事叙事中译作“出兵”，自然地表达采取军事行动，同时不额外限定行军方式。
- source_word: ἐπὶ
  choice: 攻打
  rationale: ἐπί在此表示朝向敌对目标的行动，后文的屠杀表明语境具有攻击性，因此与“出兵”合译为“出兵攻打”。
- source_word: τὸ Κάρνιον
  choice: 卡尔尼翁
  rationale: 按希腊语音形音译这一地名，并保留其专名性质。
- source_word: τὸ Ἀτεργάτιον
  choice: 阿塔伽提翁
  rationale: 按希腊语形式音译，不在正文中武断判定它是另一处城镇还是阿塔伽提斯的神庙；后一可能性以脚注保留。
- source_word: κατέσφαξεν
  choice: 屠杀了
  rationale: 该动词表示猛烈杀戮，语气强于中性的“杀死”；“屠杀”保留原文的严重程度。
- source_word: μυριάδας σωμάτων δύο πεντακισχιλίους
  choice: 两万五千人
  rationale: 原文计数合计二万五千；σωμάτων字面为“身体”，此处用来计算被杀者，正文译作现代汉语自然的“人”，字面表达另见脚注。
