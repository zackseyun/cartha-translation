  text: But after the so-called Pentecost, they moved out against Gorgias, the governor of Idumea.
translation:
  language: zh_hans
  text: 过了那称为五旬节的节期[a]，他们便出兵攻打以土买的统帅[b]哥尔吉亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“那被称为五旬节的”；也可译作“所谓的五旬节”。
    reason: lexical_alternative
  - marker: b
    text: “统帅”所译的希腊词也可指“将军”“指挥官”或兼有军政权力的“总督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ
  choice: 过了……之后
  rationale: 表示时间先后，说明行动发生在该节期结束以后；正文用“过了……”，符合现代汉语叙事习惯。
- source_word: τὴν λεγομένην πεντηκοστήν
  choice: 那称为五旬节的节期
  rationale: λεγομένην直译为“被称为”，并不必然含有质疑意味；中文“称为”比“所谓”更能避免无根据的贬义。πεντηκοστήν采用通行节名“五旬节”，并补出语境隐含的“节期”，使表达自然清楚。
- source_word: ὥρμησαν
  choice: 出兵
  rationale: 该动词可指启程、冲出或奋然行动；在军事语境中，“出兵”既表达军队开始行动，也不刻意强调速度。
- source_word: ἐπὶ Γοργίαν
  choice: 攻打哥尔吉亚
  rationale: ἐπί接宾格并与军事行动动词连用，表示敌对方向；“攻打”清楚传达他们以哥尔吉亚为攻击目标。
- source_word: στρατηγόν
  choice: 统帅
  rationale: στρατηγός可指将领、军事统帅，也可用于兼具行政权的地方长官。此处叙述军事对抗，正文采用“统帅”，同时以脚注保留“总督／长官”的可能。
- source_word: Ἰδουμαίας
  choice: 以土买
  rationale: 采用现代中文圣经传统中对Ἰδουμαία这一地区名称的通行译法。
