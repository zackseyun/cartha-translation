  text: But Dositheus and Sosipater, commanders under Maccabaeus, went out and destroyed those left behind by Timothy in the stronghold, more than ten thousand men.
translation:
  language: zh_hans
  text: 但多西提和索西帕特是马加比手下的指挥官；他们出兵，消灭了提摩太留在堡垒里的那些人，共有一万多人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν περὶ τὸν Μακκαβαῖον ἡγουμένων
  choice: 马加比手下的指挥官
  rationale: ἡγούμενοι 在军事叙事中指领军者；περὶ τὸν Μακκαβαῖον 表明他们与马加比同属一方并受其统领。译作“马加比手下的指挥官”自然、明确，又符合上下文。
- source_word: ἐξοδεύσαντες
  choice: 出兵
  rationale: 该分词可指外出、出发；在军事语境中，“出兵”既简洁自然，也恰当地体现行动性质，不额外限定行军方式。
- source_word: ἀπώλεσαν
  choice: 消灭了
  rationale: ἀπόλλυμι 可表示毁灭或杀死。宾语是一支驻守堡垒的军队，因此“消灭了”保留其军事性及致命结果。
- source_word: τοὺς ὑπὸ Τιμοθέου καταλειφθέντας
  choice: 提摩太留下的那些人
  rationale: ὑπὸ Τιμοθέου 与被动分词 καταλειφθέντας 连读，表示这些人是被提摩太留下的，而不只是泛指“提摩太手下的人”。
- source_word: ἐν τῷ ὀχυρώματι
  choice: 在堡垒里
  rationale: ὀχύρωμα 指设防之地或堡垒；“堡垒”在现代汉语中清楚自然，并保留军事场景。
- source_word: πλείους τῶν μυρίων ἀνδρῶν
  choice: 共有一万多人
  rationale: μύριοι 在此为确数一万，πλείους 表示超过。“共有一万多人”符合现代汉语计数习惯，也清楚表明所消灭者的人数。
