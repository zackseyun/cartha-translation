  yaml_path: translation/deuterocanon/2_maccabees/012/044.yaml
  text: For if he were not expecting those who had fallen to rise again[a], it would be excessive and foolish to pray for the dead.
translation:
  language: zh_hans
  text: 因为他若不期待那些倒下的人[a]复活，为死人祈祷就是多余而愚妄的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些死去的人”；直译“那些倒下的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεπτωκότας
  choice: 那些倒下的人
  rationale: 保留希腊语“倒下”的形象；在本段的战事语境中指已经死去的人，同时不把这一隐喻直接改写为解释性的“阵亡者”。
- source_word: ἀναστῆναι
  choice: 复活
  rationale: 此处指死人再次起来，即复活。“复活”是现代汉语中清楚自然的表达，也没有把希腊语形式强行处理为被动语态。
- source_word: προσεδόκα
  choice: 期待
  rationale: 该动词表示期待、等候；“期待”适合此处的条件论证，也避免用“盼望”额外强化主观情感。
- source_word: περισσὸν
  choice: 多余
  rationale: 表达超过所需、无此必要之意，比“毫无意义”更贴近词义，也较少加入推论。
- source_word: ληρῶδες
  choice: 愚妄
  rationale: 表达愚蠢、不合情理；“愚妄”兼具清楚、庄重和经文语体所需的修辞力度。
- source_word: ὑπὲρ νεκρῶν
  choice: 为死人
  rationale: ὑπέρ加属格在这里表示“为了、代表”；“为死人”自然地表达代求对象，而不扩展其教义含义。
- source_word: εὔχεσθαι
  choice: 祈祷
  rationale: 结合上下文，该中间语态不定式表示祷告；“祈祷”是清楚且自然的现代汉语。
theological_decisions:
- issue: 以复活的期待作为为死人祈祷的理由
  choice: 直接保留条件论证：若不期待倒下的人复活，为死人祈祷便是多余而愚妄的。
  alternative: 可明确译作“身体复活”，或将“为死人祈祷”解释为某种特定的死后洁净教义。
  rationale: 希腊文本只陈述复活期待与为死人祈祷之间的逻辑关系，并未在本句详述复活的性质、死者的中间状态或洁净方式，因此译文不加入后来的教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倒下的人”保留原文的军事性形象，“复活”明确传达本句所指的死人起来；句法保留原文的因果引导和条件结构。
