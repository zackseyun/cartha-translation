  yaml_path: translation/deuterocanon/2_maccabees/012/036.yaml
  text: But those with Esdrin were fighting for a longer time and were exhausted[a], so Judas called on the Lord to appear as an ally and as the leader of the battle.
translation:
  language: zh_hans
  text: 厄斯德林一方的人交战多时，已疲惫不堪；于是犹大呼求主显现为盟友，并显现为战斗的先导[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “先导”也可译作“在战斗中走在前面引领的人”。希腊词προοδηγός着重于走在前面带路。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ περὶ τὸν Ἔσδριν
  choice: 跟随厄斯德林的人
  rationale: περὶ加人名表示与该人同属一群的人；此译自然表达其关联，同时不额外断定厄斯德林的具体军衔。
- source_word: ἐπὶ πλεῖον μαχομένων
  choice: 久战不止
  rationale: 结合战斗语境，ἐπὶ πλεῖον主要表示持续较久；此译保留持续作战的动态意味。
- source_word: κατακόπων ὄντων
  choice: 已经疲惫不堪
  rationale: κατάκοπος表示因劳苦而十分疲惫；此译强度适当，符合长期战斗后的状态。
- source_word: ἐπικαλεσάμενος
  choice: 呼求
  rationale: 在以主为宾语的祈求语境中，该词指向神呼告求助；“呼求”简明而庄重。
- source_word: τὸν κύριον
  choice: 主
  rationale: 本处指犹大在祷告中所呼求的神；“主”符合犹太希腊文宗教语境及现代中文圣经用语。
- source_word: σύμμαχον
  choice: 盟友
  rationale: σύμμαχος特指共同作战者；“盟友”保留其军事色彩，强于泛指的“帮助者”。
- source_word: φανῆναι
  choice: 显现为
  rationale: φαίνω在此表达显明或出现；“显现为”既保留神介入的彰显意味，也不武断规定是否为肉眼可见的显现。原文两次使用φανῆναι，译文相应重复，以保存其句式强调。
- source_word: προοδηγὸν τοῦ πολέμου
  choice: 战斗的先导
  rationale: προοδηγός指走在前面带领的人；“先导”保留前行引领的形象，“战斗”则契合眼前的交战场景。
theological_decisions:
- issue: 祷告语境中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 本节明确描写犹大向神求援；“主”既符合神圣称谓，也避免“主人”在现代汉语中的世俗从属含义。
- issue: φανῆναι所表达的神圣显现
  choice: 显现为盟友，并显现为战斗的先导
  alternative: 表明自己是盟友和战斗中的引路者
  rationale: 原文祈求神φανῆναι，并未说明这是可见的神显还是以援助行动彰显自己；“显现”保留这种神学张力，不把它缩减为纯粹比喻性的帮助。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“久战不止，已经疲惫不堪”使希腊文独立属格结构在汉语中顺畅呈现；分号清楚连接战况与犹大的呼求。人名按希腊文Ἔσδριν音译为“厄斯德林”。
