  yaml_path: translation/deuterocanon/2_maccabees/012/025.yaml
  text: But when he had assured them at length that he would restore these men unharmed[b][a], they released him for the safety of their brothers.
translation:
  language: zh_hans
  text: 但他再三[a]保证会把这些人安然送还；他们为了自己弟兄的安全[b]，就释放了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “再三”直译可作“借着许多话”，也可理解为“详加说明”。
    reason: lexical_alternative
  - marker: b
    text: “安全”也可译作“获救”或“得保全”；这里主要指他们在现实危险中的安全与脱险。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστώσαντος
  choice: 保证
  rationale: 此处为不定过去时分词，表示他作出可信的保证；“保证”既体现使人确信的语义，也符合交涉场景。
- source_word: διὰ πλειόνων
  choice: 再三
  rationale: 该短语可指借着许多话、详加说明或反复申明；“再三”在现代汉语中自然地表达反复、充分保证的意思，同时以脚注保留较直译的可能。
- source_word: τὸν ὁρισμὸν ἀποκαταστῆσαι
  choice: 要按约定……送回来
  rationale: ὁρισμός可指已经确定的安排或约定，ἀποκαθίστημι表示恢复、送还。译文保留“约定”，没有把原文中的名词含义完全隐去，并以自然汉语表达不定式所说明的保证内容。
- source_word: τούτους ἀπημάντους
  choice: 把这些人毫发无损地
  rationale: ἀπήμαντος指未受伤害、安然无恙；“毫发无损”准确而自然，“这些人”保留指示代词及人的所指。
- source_word: ἀπέλυσαν αὐτόν
  choice: 他们……就放了他
  rationale: ἀπολύω在此指释放、放走；“放了他”符合现代叙事语体。
- source_word: ἕνεκα τῆς τῶν ἀδελφῶν σωτηρίας
  choice: 为了保全自己的弟兄
  rationale: σωτηρία在这段军事与人质交涉的语境中主要指脱险、得保全；“保全”保留其拯救意味，又不误导为专指永恒救恩。ἀδελφῶν按阳性复数及亲属语境译为“弟兄”。
theological_decisions:
- issue: 军事叙事中σωτηρία的译法
  choice: 保全
  alternative: 获救；得救；安全
  rationale: 上下文所关注的是被扣押弟兄的人身安危，而不是明确讨论永恒救恩。“保全”适合现实危险中的救助，同时脚注保留“获救”的语义可能。
- issue: ἀδελφῶν的关系含义
  choice: 自己的弟兄
  alternative: 弟兄们；亲族
  rationale: 原文是阳性复数，可指亲兄弟、族人或同胞；当前交涉语境中，“自己的弟兄”自然呈现释放者与被保全者之间的关系，又不把范围限定得比原文更窄。
- issue: ὁρισμός是否在正文中明示
  choice: 按约定
  alternative: 定意；安排
  rationale: 原文明确出现ὁρισμός，不宜仅译成“保证会送回来”而完全省去。译作“按约定”保留既定安排的含义，同时承认该词也可能侧重决定或规定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句中用“但……；他们……就……”保留希腊文分词背景与主句推进的关系；“毫发无损”清晰传达ἀπημάντους，“按约定”则保留ὁρισμός的实质内容。
