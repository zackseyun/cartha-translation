  text: From there they marched seven hundred fifty stadia and came to Charax and to the Jews called Toubianoi[a].
translation:
  language: zh_hans
  text: 他们从那里出发，走了七百五十斯塔迪翁，到了哈拉克斯，也到了那些称为“图比埃诺伊”的犹太人那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些所谓的图比亚犹太人”；“图比埃诺伊”也可按其所指解释为“托比亚人”。
    reason: 希腊语λεγομένους可中性地表示“称为”，在某些语境中也可译作“所谓”；族群名Τουβιηνοί可保留音译，也有解释性译法。
lexical_decisions:
- source_word: ἀποσπάσαντες
  choice: 从那里出发
  rationale: 该分词本义有“抽身、离开”之意；在军事行程叙事中译作“出发”自然，并保留离开前一地点的动作，不额外强化为交战式的“进军”。
- source_word: σταδίους ἑπτακοσίους πεντήκοντα
  choice: 七百五十斯塔迪翁
  rationale: 原文明确使用古代长度单位。正文保留音译，以保存历史语境，避免把可能存在换算差异的现代距离写入正文。
- source_word: διήνυσαν
  choice: 行进了……来到
  rationale: 该动词表示走完或越过一段路程。汉语用“行进了……来到”既表达所经过的距离，也自然引出目的地。
- source_word: εἰς τὸν Χάρακα
  choice: 来到哈拉克斯
  rationale: Χάραξ在此为地名，按希腊语形式音译；“来到”符合有明确目的地的行程叙述。
- source_word: τοὺς λεγομένους Τουβιηνοὺς Ἰουδαίους
  choice: 那些称为“图比埃诺伊”的犹太人
  rationale: λεγομένους本身可中性地表示“称为、名叫”，无需译出可能带贬义色彩的“所谓”。Τουβιηνοί按希腊语形式音译，避免在正文中直接采用带解释性的族群名称。
