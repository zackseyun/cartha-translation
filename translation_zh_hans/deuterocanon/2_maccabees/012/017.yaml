  register: 采用庄重而清楚的现代书面汉语。“斯塔迪翁”保留古代计量单位，“哈拉克斯”和“图比埃诺伊”依希腊文音译；用“也来到……那里”使两个由不同介词引出的目标在汉语中清晰连贯。
