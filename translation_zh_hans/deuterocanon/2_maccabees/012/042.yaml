  yaml_path: translation/deuterocanon/2_maccabees/012/042.yaml
  text: they turned to supplication[a], asking that the sin that had been committed might be completely blotted out. But the noble Judas urged the multitude to keep themselves free from sin, since they had seen before their eyes the things that had happened because of the sin of those who had fallen.
translation:
  language: zh_hans
  text: 他们便转而恳切祈求，求已经犯下的罪被完全涂抹。英勇的犹大则劝众人保守自己不犯罪，因为他们亲眼看见了因那些倒下之人的罪而发生的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἱκεσίαν ἐτράπησαν
  choice: 于是，他们转而恳切祈求
  rationale: 保留“转向、转而”的动态，并以“恳切祈求”体现ἱκεσία的恳求性质和庄重语气。
- source_word: ἀξιώσαντες
  choice: 求
  rationale: 此分词引出祈求的内容；“求”在现代汉语中简洁自然，不额外强化原文语气。
- source_word: τὸ γεγονὸς ἁμάρτημα
  choice: 那已经犯下的罪
  rationale: γεγονός表明罪行已经发生；“已经犯下”自然体现完成状态。
- source_word: τελείως ἐξαλειφθῆναι
  choice: 得以完全涂抹
  rationale: “完全”对应τελείως；“涂抹”保留ἐξαλείφω的具体意象及其经文语感，而不解释其实现方式。
- source_word: ὁ δὲ γενναῖος Ἰούδας
  choice: 英勇的犹大则
  rationale: γενναῖος可指高尚或勇敢；在军事叙事中“英勇”自然体现其褒义和英雄色彩。“则”表达δέ的转折推进。
- source_word: παρεκάλεσε τὸ πλῆθος
  choice: 劝众人
  rationale: 此处παρακαλέω表示劝勉；“众人”比“群众”更符合庄重叙事语体。
- source_word: συντηρεῖν αὐτοὺς ἀναμαρτήτους εἶναι
  choice: 保守自己不犯罪
  rationale: 希腊文结构较紧缩，意为维持自己处于无罪、未犯罪的状态；此译自然表达伦理劝诫，同时避免暗示绝对无罪的教义命题。
- source_word: ὑπʼ ὄψιν ἑωρακότας
  choice: 已经亲眼看见
  rationale: 准确传达直接目睹的强调，现代汉语自然凝练。
- source_word: τὰ γεγονότα
  choice: 造成了怎样的后果
  rationale: 原文实质化分词指已经发生的事；结合διὰ的因果关系，以“后果”自然表达众人亲眼所见的事件，同时不具体补入原文未明说的内容。
- source_word: διὰ τὴν τῶν προπεπτωκότων ἁμαρτίαν
  choice: 那些阵亡者的罪造成了
  rationale: προπεπτωκότων在上下文中指战斗中倒下、死亡的人；“阵亡者”消除被误读为仅仅道德跌倒的风险，并保留罪与所发生之事的因果联系。
theological_decisions:
- issue: ἀναμαρτήτους的道德状态用语
  choice: 保守自己不犯罪
  alternative: 保守自己无罪／成为无罪的人
  rationale: 上下文是劝活着的人避免导致阵亡者遭遇后果的罪。“不犯罪”表达当下的伦理警戒，不把经文扩大为绝对无罪或无罪完全的教义主张。
- issue: 罪被ἐξαλειφθῆναι的含义
  choice: 完全涂抹
  alternative: 完全除去／彻底赦免
  rationale: 保留原文“擦除、涂抹”的比喻，不把它直接解释为某一特定的赦罪机制，从而保存经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。“恳切祈求”“完全涂抹”保留原文的祈愿力度和经文意象；“阵亡者”依据军事上下文明确所指；全句避免古奥欧化表达，也不引入宗派性解释。
