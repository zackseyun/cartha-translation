  naturalness: 原译庄重通顺。修订后以“因……的罪而发生的事”直接对应原文，仍符合现代汉语叙事语体；“那些倒下之人”保留原文用语的指称弹性。
  terminology: “恳切祈求”“完全涂抹”“英勇的犹大”“保守自己不犯罪”均可接受。“阵亡者”虽合上下文，却比προπεπτωκότων本身更明确；改为“倒下之人”可保留原文措辞及其在上下文中的战死含义。
