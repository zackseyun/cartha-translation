base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/018.yaml
  text: Yet when Nicanor heard of the valor that those around Judas had[a], and of their courage in the struggles for their fatherland, he was reluctant to settle the matter by bloodshed.
translation:
  language: zh_hans
  text: 然而，尼加挪听说犹大及其同伴的勇武，并知道他们在为祖国而进行的斗争中所表现的勇气，就不愿以流血的方式作出裁断。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“通过流血来决定此事”或“以流血的方式执行审判。”希腊语短语τὴν κρίσιν διʼ αἵματος ποιήσασθαι较为习惯化；其中“裁断”也可指决定、审判或对事情的处置。
    reason: 保留κρίσις的词义幅度，并说明该短语可作较形式化的翻译。
lexical_decisions:
- source_word: ὅμως δὲ
  choice: 然而
  rationale: 承接上文形成让步转折，简洁保留“尽管如此”的语气。
- source_word: ἀκούων
  choice: 听说
  rationale: 将分词按时间或缘由背景自然表达；这里指尼加挪获悉对方的声名与表现。
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: 犹大一方的人
  rationale: 该希腊习语指与犹大同属一方、跟随他的人；此译自然且不过度限定为某一种关系。
- source_word: ἀνδραγαθίαν
  choice: 英勇善战
  rationale: 表达战斗情境中的勇武和杰出表现，避免按词源生硬译作带明显性别色彩的说法。
- source_word: ἐν τοῖς περὶ τῆς πατρίδος ἀγῶσιν
  choice: 在保卫祖国的斗争中
  rationale: πατρίς为祖国、故土，ἀγῶνες在本语境指为之进行的争战；加入“保卫”明示目的，符合上下文而不缩窄为单场战役。
- source_word: εὐψυχίαν
  choice: 勇气非凡
  rationale: 体现坚毅、勇敢和高昂精神，并与前面的勇武品质形成自然对应。
- source_word: ὑπευλαβεῖτο
  choice: 不愿
  rationale: 传达谨慎退缩、不情愿采取某种行动的含义，不夸大为恐惧。
- source_word: τὴν κρίσιν διʼ αἵματος ποιήσασθαι
  choice: 以流血来解决争端
  rationale: 按希腊语习语表达通过流血作出裁断或解决事件；“争端”依据军事冲突语境补明 κρίσις 所涉及的事情。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“英勇善战”与“勇气非凡”分别呈现 ἀνδραγαθία 和 εὐψυχία 的相近而不完全相同的含义；脚注标记已置于正文相关句末。
