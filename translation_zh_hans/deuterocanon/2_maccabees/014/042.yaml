    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενῶς
  choice: 体面地
  rationale: 表示以符合高贵品格或身份的方式行事；“体面地”在现代汉语中自然，并与后文“尊贵身份”形成语义呼应。
- source_word: θέλων
  choice: 宁愿
  rationale: 该分词在ἤπερ所引出的比较结构中表达意愿和取舍；“宁愿……也不愿……”自然呈现其决意。
- source_word: ἀποθανεῖν
  choice: 死去
  rationale: 按其基本义直译，简明庄重。
- source_word: ἤπερ
  choice: 也不愿
  rationale: 与前面的“宁愿”配合，清楚表达两种选择之间的强烈对比。
- source_word: ἀλιτηρίοις
  choice: 那些恶徒
  rationale: 原词是对邪恶之人的强烈贬称；“恶徒”兼具道德谴责和敌对色彩，又不把含义限定为已受法律定罪的罪犯。
- source_word: ὑποχείριος γενέσθαι
  choice: 落在……手中
  rationale: 这一惯用语表示落入他人权下或受其控制；汉语“落在……手中”自然地传达敌对处境中的被捕和受制。
- source_word: τῆς ἰδίας εὐγενείας
  choice: 自己尊贵的身份
  rationale: εὐγένεια可指高贵出身、身份或高尚品格；结合叙事人物及“有辱”的搭配，“尊贵的身份”自然，同时没有完全排除人格尊严的意味。
- source_word: ἀναξίως
  choice: 有辱
  rationale: 表达所受对待与其尊贵身份不相称；“有辱……身份”是简洁自然的现代汉语表达。
- source_word: ὑβρισθῆναι
  choice: 遭受……凌辱
  rationale: 被动式可涵盖傲慢的羞辱、虐待乃至暴力侵害；“凌辱”保留羞辱性伤害的广度，不限于言语侮辱。
