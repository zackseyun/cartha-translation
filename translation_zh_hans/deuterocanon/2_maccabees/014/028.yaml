revisions:
- from: 这些人俯伏在尼迦挪面前[a]后，他心里十分困惑；那人并没有做过任何不义之事，他想到自己竟要废弃先前议定的条款[b]，就深感为难。
  to: 这些人俯伏在尼迦挪面前[a]时，他心烦意乱；那人并没有做过任何不义之事，对于自己竟可能废除先前议定的条款[b]，他深感不安。
  rationale: 修订仅收束两处轻微的解释性扩展：以“深感不安”保留 δυσφόρως ἔφερεν 的痛苦、难以接受之意，而不指定为两难；以“竟可能废除”对应 εἰ 与未来动词所表达的设想性。其余措辞、专名和脚注锚点均予保留。
