base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/028.yaml
  text: But when these men fell before Nikanor[a], he was thrown into confusion and took it badly that he should set aside the agreed terms[b], though the man had done no wrong.
translation:
  language: zh_hans
  text: 这些人俯伏在尼迦挪面前[a]时，他心烦意乱；那人并没有做过任何不义之事，对于自己竟可能废除先前议定的条款[b]，他深感不安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“俯伏在尼迦挪脚前”，表示恳求。
    reason: lexical_alternative
  - marker: b
    text: 或译：“先前作出的安排”或“先前的协议”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπεσόντων
  choice: 俯伏在……面前
  rationale: 该词可描写人在某人面前俯身或伏地，语境中带有恳求意味；此译保留身体动作，不把隐含的求情明说进正文。
- source_word: συνεκέχυτο
  choice: 心里十分困惑
  rationale: 该动词表示内心陷入混乱、慌乱或困扰；此译自然地表达尼迦挪的内在失措。
- source_word: δυσφόρως ἔφερεν
  choice: 深感为难
  rationale: 这一习语表示难以承受、感到苦恼或不悦。结合他面对命令与既有协议之间的冲突，译作“深感为难”既通顺，也不过度限定为愤怒或怨恨。
- source_word: τὰ διεσταλμένα
  choice: 先前议定的条款
  rationale: 该完成时分词的中性复数实体用法指先前已经规定、安排或商定之事；外交语境下“议定的条款”准确且自然。
- source_word: ἀθετήσει
  choice: 废弃
  rationale: 该词有取消、否定、弃置或不履行之意；“废弃”保留正式取消与实际背弃之间一定的语义空间。
- source_word: μηδὲν τἀνδρὸς ἠδικηκότος
  choice: 那人并没有做过任何不义之事
  rationale: 属格独立结构说明该男子未曾行不义；译文保留其道德和法律色彩，同时不把判断扩大到本节所说范围之外。
- source_word: Νικάνορι
  choice: 尼迦挪
  rationale: 按希腊语 Νικάνωρ 音译为现代中文人名，保持同一卷书中的专名一致性。
theological_decisions:
- issue: μηδὲν τἀνδρὸς ἠδικηκότος 对该男子的道德评价范围
  choice: 译为“那人并没有做过任何不义之事”，作为与当前事件有关的有限断言
  alternative: “那人没有得罪任何人”或“那人是无辜的”
  rationale: 原文断言他没有行不义，却未明确说受害对象，也没有展开为对其整个人生的绝对无罪判断；因此既保留道德—法律力度，又避免扩大原文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他想到自己竟要……”把 εἰ 引出的令人不安之设想自然呈现为中文，同时保留尼迦挪尚未实际废约的语气。正文中的两个脚注标记均与脚注对应。
