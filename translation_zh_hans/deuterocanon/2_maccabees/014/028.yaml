  naturalness: 原文中文流畅、庄重，脚注也自然。修订后以“对于自己竟可能废除……，深感不安”更符合现代汉语，并保留原文尚属可能或设想的语气。
  terminology: “尼迦挪”“俯伏”“先前议定的条款”“不义之事”均合适，且专名音译与项目取向一致。
