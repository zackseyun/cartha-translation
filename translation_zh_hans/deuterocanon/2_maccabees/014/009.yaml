base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/009.yaml
  text: Since you know each of these things[a], O king, take thought for the country and for our nation that is being hard pressed[b], according to the gracious goodwill you have toward all.
translation:
  language: zh_hans
  text: 王啊，既然你已清楚知道这一切，就请顾念这片国土和我们这个正陷于困境的民族[a]，按着你对众人所怀、随时显出的仁慈[b]行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正陷于困境”也可译作“正被围困”“正遭逼迫”或“正受压力”。希腊语分词可表示被包围、受困，或受各种患难逼迫的处境。
    reason: lexical_alternative
  - marker: b
    text: “随时显出的仁慈”所译的希腊语表达十分少见，可指容易向人显出的仁慈、随时愿意施恩的态度，或亲和宽厚的善意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστα ... τούτων
  choice: 这一切
  rationale: ἕκαστα带有逐项、各件之意；现代汉语用“这一切”自然概括前文所述各事，而“清楚知道”补足其明确知悉的语气。
- source_word: ἐπεγνωκώς
  choice: 既然你已清楚知道
  rationale: 完成时分词表示已经认识、明白；“已清楚知道”保留既成且充分知悉的意味，并以“既然”表达其与主句的逻辑关系。
- source_word: προσνοήθητι
  choice: 请顾念
  rationale: 该命令式要求君王为有关对象加以考虑和关照；“顾念”兼有留意与关怀之意，也符合臣下向君王陈情的语体。
- source_word: τῆς χώρας
  choice: 这片国土
  rationale: χώρα在此指有关的疆土或地方；“国土”契合政治陈情的语境，“这片”使现代汉语表达自然。
- source_word: τοῦ περιισταμένου γένους ἡμῶν
  choice: 我们这个正受困迫的民族
  rationale: γένος在此指共同体或民族；περιισταμένου可表示被围住、受困或遭逼迫。“正受困迫”保留持续处境，又不把含义限定为空间上的包围。
- source_word: καθ᾽ ἣν ἔχεις ... φιλανθρωπίαν
  choice: 照着你对众人所怀……的仁厚行事
  rationale: κατά表示作为行动的准则；φιλανθρωπία指对人的仁慈、宽厚或善意。“仁厚”庄重而易懂，补出“行事”使汉语句子完整。
- source_word: εὐαπάντητον
  choice: 乐于施予的
  rationale: 这个罕见形容词修饰φιλανθρωπία，可能强调这种仁厚容易显出、随时可得或待人亲和。“乐于施予”表达仁厚 readily forthcoming 的核心意味，同时在脚注保留其他可能。
- source_word: πρὸς ἅπαντας
  choice: 对众人
  rationale: πρός加宾格表示态度所指向的对象；“对众人”准确保留其普遍范围。
