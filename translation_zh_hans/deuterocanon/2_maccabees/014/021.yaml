    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάξαντο
  choice: 约定了
  rationale: 中间语态在此表示共同商定或安排日期；“约定”自然体现双方协商定下时间。
- source_word: ἡμέραν
  choice: 一个日子
  rationale: 原文名词无冠词，指双方定下某一具体日期；“一个日子”不作过度限定。
- source_word: κατʼ ἰδίαν
  choice: 私下
  rationale: 表示避开公众、单独进行；“私下”是现代汉语中自然、准确的表达。
- source_word: ἥξουσιν εἰς τὸ αὐτό
  choice: 会面
  rationale: 字面为“来到同一处”，在此语境中即双方到一处相会；“会面”简洁而不增添目的或结果。
- source_word: παρʼ ἑκάστου
  choice: 双方各自
  rationale: ἑκάστου按上下文指参与会面的两个阵营各方，而非现场每一个人。
- source_word: δίφραξ
  choice: 肩舆
  rationale: 此词罕见，似指可抬行的座具或轿舆；“肩舆”比“轿子”略宽泛且符合叙事的庄重语域，具体形制仍以脚注保留不确定性。
- source_word: προῆλθε
  choice: 带来
  rationale: 原文为单数“出来/上前”，与παρʼ ἑκάστου连用时描述双方各有一件座具被带到场；汉语用“带来”较自然，也避免强行赋予被动态。
- source_word: ἔθεσαν δίφρους
  choice: 摆好了座位
  rationale: δίφρος可指椅、凳或座位，形制不确定；“座位”保留概括性，“摆好了”表达为会面作出的布置。
