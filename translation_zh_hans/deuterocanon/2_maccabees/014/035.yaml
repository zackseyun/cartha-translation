base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/035.yaml
  text: You[a], O Lord, though needing nothing from anyone[b], were pleased for a temple of your dwelling to come into being among us.
translation:
  language: zh_hans
  text: 主啊，你虽不需要万有[b]，却乐意让一座作为你居所的圣殿在我们中间[a]存在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在我们里面”。希腊语ἐν ἡμῖν可有这两种意思；在这里的圣殿语境中，“在我们中间”较可能指群体当中的居所。
    reason: lexical_alternative
  - marker: b
    text: 直译“对万有都无所需”，意思是他不需要、也不依赖任何人或任何事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπροσδεὴς τῶν ὅλων
  choice: 不需要万有中的任何事物
  rationale: ἀπροσδεής表示“毫无所需、不依赖”，τῶν ὅλων字面涉及“万有”。此译法比只说“不需要任何人”更完整地保留希腊语范围，也以现代汉语表达上帝不依赖受造万有。
- source_word: ηὐδόκησας
  choice: 乐意
  rationale: 该动词兼有喜悦与肯定意愿的含义；“乐意”自然地保留主动选择和喜悦之意。
- source_word: ναὸν
  choice: 圣殿
  rationale: 在耶路撒冷敬拜语境中，ναός指作为上帝居所的殿宇；“圣殿”是清楚、通行且庄重的译法。
- source_word: τῆς σῆς σκηνώσεως
  choice: 供你居住的
  rationale: σκηνώσις表示居住、驻留；此处属格说明圣殿与上帝居住的关系。“供你居住的”符合自然汉语，又不额外引入后期神学术语。
- source_word: ἐν ἡμῖν
  choice: 在我们中间
  rationale: ἐν加复数代词可指“在我们中间”或“在我们里面”。圣殿语境更支持群体和地域意义，另一可能保留于脚注。
- source_word: γενέσθαι
  choice: 建立起来
  rationale: γίνομαι字面为“成为、产生”。用于圣殿时，“建立起来”比“产生”自然，同时避免像“建造”那样过分限定具体施工动作。
theological_decisions:
- issue: 上帝的自足与其选择居于圣殿之间的张力
  choice: 你不需要万有中的任何事物，却乐意
  alternative: 你虽一无所缺，却乐意
  rationale: 希腊文先陈明主不依赖万有，继而说他乐意让圣殿存在。用“却”明确呈现这种让步张力，而不暗示上帝因自身需要才有圣殿。
- issue: ἐν ἡμῖν的群体性或内在性
  choice: 在我们中间
  alternative: 在我们里面
  rationale: 所指对象是圣殿，较可能表达圣殿设立在群体当中，而非个体内在的灵性居住；但原文形式允许另一理解，故以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。以“主啊”自然呈现呼语；不使用较晦涩的“无所需求”“帐幕化”等措辞。脚注标记均置于其所解释的短语之后。
