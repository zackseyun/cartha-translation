  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ μεθʼ ὅρκων φασκόντων
  choice: 他们却发誓说
  rationale: 这是属格独立结构，引出伴随或时间性的情形。μεθʼ ὅρκων直译为“带着誓言”，与φασκόντων合起来用现代汉语自然地译作“发誓说”，既保留陈述行为，也传达誓言的郑重意味。δέ按语篇关系译为“却”。
- source_word: μὴ γινώσκειν
  choice: 不知道
  rationale: 不定式表达他们声称的内容；汉语用“说，不知道”自然呈现间接引语，无须机械保留不定式形式。
- source_word: ποῦ ποτʼ ἐστίν
  choice: 究竟在哪里
  rationale: ποῦ表示“在哪里”，ποτʼ在此增添不确定或强调意味；“究竟”自然传达这一语气。希腊文用现在时ἐστίν，汉语不强制时态回移，因此保留为不带过去时标记的“在哪里”。
- source_word: ὁ ζητούμενος
  choice: 被寻找的那人
  rationale: 这是带冠词的被动现在分词，实体化后意为“正在被寻找的那一位”。“被寻找的那人”清楚保留其人物指称和被动含义，又避免“通缉犯”等现代司法色彩。
