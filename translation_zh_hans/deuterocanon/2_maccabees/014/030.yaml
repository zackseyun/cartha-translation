base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/030.yaml
  text: But Maccabaeus[a], perceiving from Nicanor’s actions toward him that he had assumed a harsher than usual manner, and understanding that this severity did not come from the better course, gathered not a few of his men and kept himself hidden from Nicanor.
translation:
  language: zh_hans
  text: 但马加比从尼加挪对待他的举动中看出，尼加挪在惯常会面时的态度变得比往常更为严厉；他意识到这种严厉并非出于最好的用意[a]，就召集身边不少人，避开尼加挪而隐藏起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他意识到这种严厉并非上策。”希腊语 οὐκ ἀπὸ τοῦ βελτίστου 是习语，也可指这种严厉并非出于较好的方针或考量。
    reason: 保留该短语可指动机或方针的歧义，避免正文将其限定为道德意义上的“善意”。
lexical_decisions:
- source_word: ὁ Μακκαβαῖος
  choice: 马加比
  rationale: 采用此书人物称谓的通行音译；定冠词不必在中文中另行表达。
- source_word: αἰσθητήριον διεξαγαγόντος συνιδὼν τὸν Νικάνορα τὰ πρὸς αὐτόν
  choice: 察觉尼加挪对他的举动有异
  rationale: 这一组合表达较为艰涩，语境指马加比从尼加挪对待他的外在表现中有所察觉；译文保留观察行为并作出判断的意味，而不把 αἰσθητήριον 硬译成抽象的“感官”。
- source_word: τὴν ἠθισμένην ἀπάντησιν ἀγριωτέρως ἐσχηκότα
  choice: 平日相见时的态度也变得更为粗暴
  rationale: ἀπάντησις 指相见或会面，ἠθισμένην 指惯常情形；比较级 ἀγριωτέρως 表明尼加挪的态度较以往更粗暴。
- source_word: νοήσας
  choice: 明白
  rationale: 表示马加比根据尼加挪行为作出的判断，不只是视觉上的看见。
- source_word: οὐκ ἀπὸ τοῦ βελτίστου τὴν αὐστηρίαν εἶναι
  choice: 这种严厉并非出于善意
  rationale: 该习语可指动机不善，也可指这种做法并非上策；正文采用自然且贴合上下文的动机性表达，并以脚注保留另一种理解。
- source_word: συστρέψας οὐκ ὀλίγους τῶν περὶ αὐτὸν
  choice: 召集了身边不少人
  rationale: “不少”保留 οὐκ ὀλίγους 的曲言表达；“身边人”符合 τῶν περὶ αὐτόν，且召集具有策略性含义。
- source_word: συνεκρύπτετο τὸν Νικάνορα
  choice: 躲起来避开尼加挪
  rationale: 未完成时态呈现持续隐匿的状态；中文以“躲起来避开”自然表达不让尼加挪找到或接触自己的意思。
theological_decisions:
- issue: οὐκ ἀπὸ τοῦ βελτίστου 所指是动机还是策略
  choice: 正文译作“并非出于善意”
  alternative: “这样严厉并非上策”或“这种严厉不会带来好结果”
  rationale: 希腊语表达具有习语性，既可能评论尼加挪的动机，也可能评论其行动方针。上下文中马加比从对方态度变化判断危险，动机义较顺畅，但不能排除策略或结果义，故以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而自然的叙事体。“粗暴”体现比较级所指的态度恶化；“不少人”保留原文曲言法。脚注标记已在正文对应位置出现。
