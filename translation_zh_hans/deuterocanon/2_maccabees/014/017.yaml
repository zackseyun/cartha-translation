base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/017.yaml
  text: But Simon[a], the brother of Judas, had come to terms with Nicanor[c][b], though reluctantly, having stumbled because of the sudden speechlessness of his opponents.
translation:
  language: zh_hans
  text: 犹大的兄弟西门曾与尼加挪交锋[a]，却因敌方突然失语而行动迟缓，因而受挫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交锋”也可指“相遇”或“接触”。此处动词可用于双方相遇或交战；结合本段的军事叙事，正文译作“交锋”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语后半句难解。βραδέως直译为“缓慢地、迟缓地”，ἐπταικώς本义为“绊倒”，可引申为“失误、受挫”；ἀφασία指“失语、不能说话”。原文未明确说明敌方突然失语与西门受挫之间的具体关系。
    reason: textual_difficulty
lexical_decisions:
- source_word: συμβεβληκὼς ἦν τῷ Νικάνορι
  choice: 曾与尼加挪交锋
  rationale: συμβάλλω接与格可表示与人相遇、交锋，也可表示商谈或达成协议。结合本段军事语境，译作“交锋”较为合适；迂回完成时表达此前发生并形成当前局面的行动，用“曾”体现。
- source_word: βραδέως
  choice: 反应迟缓
  rationale: 本义为“缓慢地”。其位置更自然地修饰后面的ἐπταικώς，而非前面的“交锋”，故不译作“不情愿地”；在这一难解句中，“反应迟缓”保留速度或迟滞之意。
- source_word: ἐπταικώς
  choice: 遭遇了挫折
  rationale: πταίω本义为“绊倒”，引申为失误、失败或受挫。此处是军事叙事，并无道德犯罪之意，因此采用自然且不夸大的“遭遇了挫折”。
- source_word: ἀφασίαν
  choice: 哑口无言
  rationale: ἀφασία可指失语、无言，也可引申为茫然或惊愕。正文保留其直接而反常的“无言”意象，不把难解表达静默改写为明确的心理状态。
- source_word: ἐφνίδιον
  choice: 突然
  rationale: 表示突如其来、出乎意料；“突然”是简洁直接的对应。
- source_word: τῶν ἀντιπάλων
  choice: 敌方
  rationale: ἀντίπαλοι指对手或敌手。军事语境中“敌方”自然，并避免擅自明确所属关系。
