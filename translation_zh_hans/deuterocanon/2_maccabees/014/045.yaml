translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文连续分词所形成的紧迫动作感，并以分号和“尽管……仍……”理清汉语句法。经核对希腊文，脚注[a]置于“鲜血喷涌而出”之后，因为其解释的是κρουνηδόν，而不是“怒火中烧”。末尾逗号予以保留，以反映本节在原文中句意尚未完结。
