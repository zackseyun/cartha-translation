  yaml_path: translation/deuterocanon/2_maccabees/014/045.yaml
  text: Yet still breathing and burning with rage[a], he rose up, though his blood was pouring out in streams and his wounds were severe, and running through the crowds, he stood upon a steep rock[b],
translation:
  language: zh_hans
  text: 然而，他仍有气息，怒火中烧，便站起身来；尽管鲜血喷涌而出[a]，伤势严重，他仍跑着穿过人群，站在一块陡峭的岩石上[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“鲜血如泉水般涌出”；κρουνηδόν描绘泉涌或喷流般的流动。
    reason: lexical_alternative
  - marker: b
    text: 或译“突出的峭岩”或“陡直的岩壁”；ἀπορρώγος可指岩石陡峭或向外突出。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ ἔμπνους ὑπάρχων
  choice: 然而，他仍有气息
  rationale: ἔμπνους直指尚有气息、仍然活着；译作“仍有气息”保留具体而鲜明的身体状态，δὲ按叙事转折译作“然而”。
- source_word: πεπυρωμένος τοῖς θυμοῖς
  choice: 怒火中烧
  rationale: πεπυρωμένος意为被点燃、燃烧，τοῖς θυμοῖς在此指强烈愤怒；“怒火中烧”是自然庄重的现代汉语，也保留原文的火焰隐喻。
- source_word: ἐξαναστὰς
  choice: 便站起身来
  rationale: 该不定过去时分词表示在负伤后起身；“站起身来”准确自然，不额外加入“挣扎”或“猛然”等原文未明说的细节。
- source_word: φερομένων κρουνηδὸν τῶν αἱμάτων
  choice: 鲜血喷涌而出
  rationale: κρουνηδόν描绘血如泉水般成股涌出；“喷涌而出”在现代汉语中清楚传达大量、急速流出的动态意象。
- source_word: δυσχερῶν τῶν τραυμάτων ὄντων
  choice: 伤势严重
  rationale: δυσχερής在此表示创伤严重、难以承受；“伤势严重”简洁自然，并保留伤情的严峻程度。
- source_word: δρόμῳ τοὺς ὄχλους διελθών
  choice: 跑着穿过人群
  rationale: δρόμῳ表示以奔跑的方式，τοὺς ὄχλους为复数，但汉语集合名词“人群”更自然；译文保留其急速穿行的动作。
- source_word: στὰς ἐπί τινος πέτρας ἀπορρώγος
  choice: 站在一块陡峭的岩石上
  rationale: πέτρα指岩石或岩壁，ἀπορρώγος可形容陡峭、突出或断裂外伸；正文采用易懂的“陡峭的岩石”，脚注保留其地形意象的其他可能。
