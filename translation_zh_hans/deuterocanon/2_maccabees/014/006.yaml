lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: 他对此
  rationale: 这是承接上文、引出回应的惯用表达；译作“对此”自然简洁，并保留其话语衔接作用。
- source_word: ἔφη
  choice: 说
  rationale: 采用普通叙事用语，不额外加入原文没有明确表达的语气。
- source_word: Οἱ λεγόμενοι
  choice: 那些被称为……的
  rationale: λεγόμενοι既可中性地表示“被称为”，也可能略带疏离或轻蔑意味；正文采用中性译法，另一可能以脚注保留。
- source_word: Ἀσιδαῖοι
  choice: 哈西典人
  rationale: 这是特定犹太群体的名称，音译比意译为“虔诚人”更能避免加入褒义判断，也符合现代中文历史名称的表达方式。
- source_word: ὧν ἀφηγεῖται
  choice: 由……率领
  rationale: ἀφηγέομαι在此表示居首、带领；转换为中文被动领属结构，清楚表达犹大与该群体的关系。
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: 犹大·马加比
  rationale: 采用中文中通行、易懂的人名与称号音译。
- source_word: πολεμοτροφοῦσιν
  choice: 不断助长战火
  rationale: 原词有“滋养、喂养战争”的鲜明构词意象；“助长战火”在现代中文中自然，并保留使战争持续扩大的含义。
- source_word: στασιάζουσιν
  choice: 煽动叛乱
  rationale: 该词涉及结党、内乱或反叛；此处译法表达主动制造政治动乱的指控，同时不把含义收窄为单纯的派系争执。
- source_word: οὐκ ἐῶντες
  choice: 不容许
  rationale: 忠实保留“不给予许可、不让”的未完成表达；因希腊文在本节末尚未出现其宾语，中文也不擅自补足。
theological_decisions:
- issue: 群体名称Ἀσιδαῖοι的处理
  choice: 哈西典人
  alternative: 虔诚人；阿西典人
  rationale: 该词在此作为历史群体名称使用。采用音译可保存历史特指性，避免把该群体直接评价为“虔诚”，从而不在译文中预先肯定其宗教身份。
- issue: Οἱ λεγόμενοι是否含贬抑语气
  choice: 那些被称为……的
  alternative: 所谓的……
  rationale: 上下文可能使该表达带有疏离甚至贬抑意味，但λεγόμενοι本身也可作中性称名用。正文不强行确定语气，脚注注明另一可能。
- issue: 保留跨节未完句
  choice: 以“不容许”结束本节，不补宾语
  alternative: 从下一节补入“不容许”的内容
  rationale: 希腊句法延续至下一节；按本节边界翻译时保留悬而未完的结构，避免将下一节的内容提前并入。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“助长战火”保留原文关于滋养战争的意象而避免生硬直译；结尾刻意保留未完句，以对应希腊文本节边界。
