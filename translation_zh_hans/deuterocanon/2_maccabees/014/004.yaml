  text: he came to King Demetrius in the one hundred fifty-first year, bringing him a gold crown and a palm branch, and besides these the customary offerings from the temple foliage; and on that day he kept quiet.
translation:
  language: zh_hans
  text: 第一百五十一年，阿尔基慕来到德米特里王面前，带给他一顶金冠和一根棕榈枝，此外还有按惯例献上的圣殿青枝[a]。那一天，他保持缄默[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“此外还有照例呈献的东西，就是圣殿的青枝。”希腊原文的表达十分紧缩，并有所省略。
    reason: lexical_alternative
  - marker: b
    text: 直译“保持安静”。在上下文中，可能指他那天没有进一步行动或提出控告。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς τὸν βασιλέα Δημήτριον
  choice: 阿尔基慕来到德米特里王那里
  rationale: πρός加宾格表示朝向某人而去。希腊文动词未明说主语，但承接上文应为阿尔基慕，中文补出姓名可避免代词指向不明。
- source_word: ὡς πρώτῳ καὶ ἑκατοστῷ καὶ πεντηκοστῷ ἔτει
  choice: 第一百五十一年
  rationale: 这是希腊化时代史书常见的纪年表达；ὡς在此不必机械译作“大约”。
- source_word: προσάγων αὐτῷ
  choice: 带给他
  rationale: 分词表示他前去见王时携带这些物品；译为“带给”自然，并保留其呈献意味。
- source_word: στέφανον χρυσοῦν
  choice: 一顶金冠
  rationale: στέφανος可指花冠或冠冕；在向君王赠礼的语境中，“金冠”准确而自然。
- source_word: φοίνικα
  choice: 一根棕榈枝
  rationale: φοῖνιξ在此指礼仪性使用的棕榈枝，而非棕榈树；量词“一根”符合现代汉语。
- source_word: τοῖς νομιζομένοις θαλλῶν τοῦ ἱεροῦ
  choice: 按惯例献上的圣殿青枝
  rationale: 原文结构压缩且略有省略。νομιζομένοις表达惯常或公认的做法，θαλλῶν指新鲜枝条、嫩枝；此译保留其礼仪性与植物意象，同时避免含混的“圣殿枝叶的惯例物品”。
- source_word: ἡσυχίαν ἔσχεν
  choice: 没有采取行动
  rationale: 该习语直义为“保持安静”，在叙事语境中更可能表示当日暂不采取进一步行动，而不只是没有说话。
