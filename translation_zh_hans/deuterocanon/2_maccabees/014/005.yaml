base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/005.yaml
  text: That day was quiet. But when he found an opportunity suitable for his own folly[a], and had been summoned by Demetrius to the council and asked in what disposition and purpose the Jews stood,
translation:
  language: zh_hans
  text: 那一天，他安然无事。但他抓住一个可助长自己愚妄图谋的时机[a]，被德米特里召到议事会，并被问及犹太人目前抱着什么态度、有什么打算，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“抓住一个作自己愚妄之事帮手的时机”。希腊文表达凝练，意思是他抓住了一个有助于推行其愚妄图谋的机会。
    reason: 说明原文拟人化而压缩的表达，并保留较直译的可能。
lexical_decisions:
- source_word: τὴν ἡμέραν ἐκείνην ἡσυχίαν ἔσχεν
  choice: 那一天平静无事
  rationale: 希腊文直译近于“那一天有平静”。译作“平静无事”既符合现代汉语叙事，也保留当天没有发生骚乱的客观意味。
- source_word: καιρὸν δὲ λαβών
  choice: 但他一找到……时机
  rationale: καιρός 指适当或有利的时机；分词在此引出随后行动的背景。“一找到”自然表达他抓住机会的意味。
- source_word: τῆς ἰδίας ἀνοίας συνεργόν
  choice: 可助长自己愚妄的
  rationale: 原文结构凝练，字面意为“作他自己愚妄之事的同工／帮手”。“可助长自己愚妄的时机”保留拟人意味，并说明该机会为其愚妄企图效力；ἀνοία 译为“愚妄”比“疯狂”更能保留道德与政治判断而不作医学化理解。
- source_word: προσκληθεὶς εἰς συνέδριον ὑπὸ τοῦ Δημητρίου
  choice: 又蒙德米特里召入议事会
  rationale: συνέδριον 是商议事务的会议或议事机构。“议事会”清楚体现正式政治场合；被动形式译为“蒙……召入”，语体庄重而自然。
- source_word: ἐπερωτηθείς
  choice: 被问到
  rationale: 该词可指询问或盘问；本处是正式会议中的问询，译作“被问到”不额外增添敌意。
- source_word: ἐν τίνι διαθέσει καὶ βουλῇ καθεστήκασιν
  choice: 目前抱着什么态度、有什么打算
  rationale: διάθεσις 与 βουλή 分别侧重现有态度／立场及意图／谋划；καθεστήκασιν 表示处于某种状态。“目前抱着……、有……”在现代汉语中自然，并保留两个不同层面。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 在《马加比二书》的语境中，这是民族、宗教兼具的群体称谓，并非仅指犹太地区居民，因此译作通行的“犹太人”。
theological_decisions:
- issue: οἱ Ἰουδαῖοι 的群体范围
  choice: 犹太人
  alternative: 犹太地区的人
  rationale: 本处讨论的是马加比叙事中的民族政治群体；“犹太人”既不把范围局限于地域，也符合全书语境。
- issue: ἀνοία 的评价色彩
  choice: 愚妄
  alternative: 疯狂
  rationale: 原词可涵盖无知、愚昧或失去理智，但上下文主要谴责其鲁莽而错误的谋划。“愚妄”保留道德评价及一定语义张力，避免将其明确解释为精神失常。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。本节希腊文句子尚未结束，因此正文以逗号收束，与下一节连续。专名 Δημήτριος 依较贴近希腊语的形式译作“德米特里”。
