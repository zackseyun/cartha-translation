  naturalness: “点着各门，把门烧起来”略显别扭，且前后“各门／门”不一致。改为“点燃各门，焚烧各门”，虽保留原文有意重复的近义燃烧动词，句法更整齐自然。
  terminology: “众人”“攻占塔楼”“院门”“团团围住”均恰当、现代而庄重。“把剑抵向自己”谨慎保留原文未明说的具体动作；脚注应以更自然的“伏剑自尽”说明“fell upon his sword”这一解释性译法。
