revisions:
- from: 众人眼看就要攻占塔楼，又强攻院门，并命人拿火来点着各门，把门烧起来；他见自己已被团团围住，就把剑抵向自己[a]。
  to: 众人眼看就要攻占塔楼，正在强攻院门，又命人拿火来，点燃各门，焚烧各门；他被团团围住，就把剑抵向自己[a]。
  rationale: 修订仅消除原文未明示的主观“见自己”，并调整纵火短语的汉语表达以保留希腊文连续使用两个燃烧动词及重复“门”的修辞。自伤动作及其脚注继续避免断定具体机制。
