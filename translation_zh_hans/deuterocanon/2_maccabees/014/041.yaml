base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/041.yaml
  text: But when the crowds were about to seize the tower[a], and were forcing the courtyard gate, and were ordering that fire be brought and the doors set on fire, he, completely surrounded, put the sword to himself;
translation:
  language: zh_hans
  text: 众人眼看就要攻占塔楼，正在强攻院门，又命人拿火来，点燃各门，焚烧各门；他被团团围住，就把剑抵向自己[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“伏剑自尽”或“把剑刺入自己身体”。希腊文直译是“把剑放到自己身上”。
    reason: 原文措辞没有明确交代剑与身体接触的具体方式；脚注保留可能的较明确理解，同时说明直译措辞。
lexical_decisions:
- source_word: τῶν ... πληθῶν
  choice: 众人
  rationale: πλῆθος指聚集的大群人；“众人”自然中性，不额外加入“暴民”的贬义。
- source_word: μελλόντων
  choice: 眼看就要
  rationale: 表达动作迫在眉睫，保留尚未完成而即将发生的意味。
- source_word: τὸν πύργον καταλαβέσθαι
  choice: 攻占塔楼
  rationale: καταλαμβάνω在围攻语境中指夺取、占领；“攻占”兼顾行动方式与占有结果。
- source_word: τὴν αὐλαίαν θύραν
  choice: 院门
  rationale: αὐλαία修饰与院落相关的门；“院门”符合现代汉语建筑表达，也不武断扩展为外门。
- source_word: βιαζομένων
  choice: 强攻
  rationale: 保留βιάζω所含以强力冲击、破门而入的意味。
- source_word: κελευόντων πῦρ προσάγειν
  choice: 命人拿火来
  rationale: 明确保留κελεύω的命令意味和πῦρ προσάγειν把火带到门前的动作。
- source_word: τὰς θύρας ὑφάπτειν καὶ τὰς θύρας φλέγειν
  choice: 点着各门，把门烧起来
  rationale: 原文连续使用ὑφάπτω与φλέγω两个近义燃烧动词，并重复“门”；译文保留其递进和修辞叠加，而不虚构两个彼此分离的事件。
- source_word: περικάλυπτος γενόμενος
  choice: 见自己已被团团围住
  rationale: 按叙事情境表达被完全包围、无路可退；加入“见”使希腊分词结构在汉语中衔接自然，但不改变其处境。
- source_word: ὑπέθηκεν ἑαυτῷ τὸ ξίφος
  choice: 把剑抵向自己
  rationale: 尽量贴近“把剑置于／对着自己”的表述，不擅自限定为伏剑或明确描述刺入的具体动作。
theological_decisions:
- issue: 拉齐斯自杀动作的表述
  choice: 把剑抵向自己
  alternative: 伏在剑上／把剑刺入自己身体
  rationale: 此处在伦理和叙事上较为敏感。译文不淡化自杀行为，也不超出希腊文而断定具体动作方式；脚注列出语境允许的较明确理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“眼看就要”“团团围住”便于普通读者理解，又保持围攻场面的紧迫感；分号呈现前后行动的转折。脚注标记紧随其实际说明的自杀动作，而非置于“塔楼”之后。
