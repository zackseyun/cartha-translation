  terminology: 人名“尼加诺”、地名“安提阿”和“玛加伯”可保留。将πανπονήρου译为“极其邪恶”直接保留原文强烈道德判断，避免成语附带的罪行累积含义。将δέσμιον译为“作为囚犯”保留其拘禁身份，而不将拘束手段确定为锁链。
