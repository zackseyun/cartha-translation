base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/027.yaml
  text: But the king became enraged[a], and, provoked by the slanders of that utterly wicked man, wrote to Nikanor[b], saying that he took the treaty very badly and ordering him to send Maccabeus to Antioch as a prisoner at once.
translation:
  language: zh_hans
  text: 王却勃然大怒，受到那个极其邪恶之人的诽谤煽动，便写信给尼加诺，说自己对这些协议深感不满[a]，并命令他立刻把玛加伯作为囚犯送到安提阿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “协议”也可译作“约定”“条约”或“和约条款”。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“把玛加伯作为被捆绑的人送去”；也可译作“作为囚犯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυμος γενόμενος
  choice: 勃然大怒
  rationale: 表达君王骤然发怒、情绪激烈的转变，既保留原文力度，也符合现代汉语习惯。
- source_word: πανπονήρου
  choice: 恶贯满盈
  rationale: 该复合形容词强烈凸显此人的邪恶；此译保留鲜明的道德谴责，并自然地修饰所指之人。
- source_word: διαβολαῖς
  choice: 诬告
  rationale: 在此指怀有恶意的诋毁和控告；“诬告”兼顾其指控性质与负面含义。
- source_word: ἐρεθισθεὶς
  choice: 受了……煽动
  rationale: 分词表示君王因这些诬告而受刺激、被激起敌意；“煽动”清楚呈现其因果作用。
- source_word: συνθηκῶν
  choice: 协议
  rationale: 复数形式可泛指双方议定的条款或约定；“协议”适合政治军事语境，又不强行限定为单一正式条约。
- source_word: φάσκων βαρέως φέρειν
  choice: 说自己对那份协议极为不满
  rationale: 保留φάσκων的转述语气，并以自然汉语表达βαρέως φέρειν所含的强烈不悦或难以接受。
- source_word: δέσμιον
  choice: 作为囚犯押送
  rationale: δέσμιον意为被拘禁者或囚犯，未必明确指戴着锁链；结合ἐξαποστέλλειν译作“作为囚犯押送”，准确表达受拘押送往异地。
- source_word: ἐξαποστέλλειν
  choice: 押送
  rationale: 在要求将囚犯送往安提阿的语境中，“押送”比普通的“送”更自然，并体现受监管的移送。
- source_word: ταχέως
  choice: 立刻
  rationale: 体现王命要求迅速执行的紧迫性。
theological_decisions:
- issue: πανπονήρου的强烈道德定性
  choice: 那个恶贯满盈之人
  alternative: 那个极其邪恶的人
  rationale: 强烈谴责来自希腊文本本身，应予保留；“恶贯满盈”用现代读者熟悉的成语传达强化语气，而不另加教派性解释。
- issue: συνθηκῶν的范围
  choice: 协议
  alternative: 条约；和约条款
  rationale: 原词为复数，可指协议、约定或议定条款。正文采用较宽泛的“协议”，避免擅自判定其具体法律形式，并以脚注保留其他可能。
- issue: δέσμιον是否明确指锁链
  choice: 作为囚犯押送
  alternative: 捆绑着押送；戴着锁链押送
  rationale: 原词明确表示被拘禁或受捆绑的身份，但不必然具体说明锁链；正文不把具体拘束方式说死，脚注保留较直译的可能。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“勃然大怒”“极为不满”“立刻”保留王命场景的强烈情绪和紧迫感；人名按次经常见现代汉语音译处理。脚注标记均置于正文相应处。
