  source_fidelity: 草稿总体准确地呈现了王因恶人诽谤而被激怒、致信尼加诺，并要求迅速将玛加伯以囚犯身份送往安提阿的事件链。不过，“恶贯满盈”带有其恶行累积至极、罪状昭彰的附加意涵，较πανπονήρου（“极其邪恶的”）更具体；“诬告”也较διαβολαῖς（诽谤、毁谤、恶意中伤）更限定为正式或虚假的控告。συνθηκῶν为复数，宜避免正文单数“那份协议”。
