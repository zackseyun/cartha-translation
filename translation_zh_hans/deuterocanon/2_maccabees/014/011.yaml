  yaml_path: translation/deuterocanon/2_maccabees/014/011.yaml
  text: When this man had said such things[a], the rest of the Friends, being quickly ill-disposed toward Judas[b], further incited Demetrius.
translation:
  language: zh_hans
  text: 这人说了这番话以后，其余的“王友”[a]对犹大怀有几分敌意，便立即进一步煽动德米特里敌视犹大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王友”很可能是宫廷称号，指国王的亲信或廷臣，并非普通意义上的朋友。
    reason: cultural_note
  - marker: b
    text: 这里的希腊语动词十分罕见，也可理解为“使德米特里对犹大更有成见”或“使他更加恼恨犹大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτων δὲ ῥηθέντων ὑπὸ τούτου
  choice: 这人说了这番话以后
  rationale: 将属格独立结构自然译为时间从句；“这人”保留τούτου略带指示和疏离的语气，并指向上文说话者。
- source_word: θᾶττον
  choice: 立即
  rationale: 此处表示反应迅速；译作“立即”符合现代汉语叙事习惯，也不强行体现可能已弱化的比较级形式。
- source_word: οἱ λοιποὶ φίλοι
  choice: 其余的“王友”
  rationale: 在塞琉古宫廷语境中，φίλοι很可能是君王亲信或廷臣的称号；用引号标示其专门含义，避免误解为普通朋友。
- source_word: δυσμενῶς ἔχοντες τι πρὸς τὸν Ἰούδαν
  choice: 对犹大怀有几分敌意
  rationale: 保留τι所表达的不定、缓和意味，并把希腊语表示敌对态度的习语译成自然汉语。
- source_word: προετετύρωμαν
  choice: 进一步煽动
  rationale: 该罕见动词在此表示使德米特里对犹大的敌意加深或受挑动；“进一步煽动”兼顾其加强意味和使役色彩，同时不把具体心理效果定得过死。
- source_word: τὸν Δημήτριον
  choice: 德米特里
  rationale: 采用该希腊人名在本书中的常用现代汉语音译。
