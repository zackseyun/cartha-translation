base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/043.yaml
  text: But since he had not succeeded in the blow because of the urgency of the struggle[a], and the crowds were rushing in within the gates[b], he ran up bravely onto the wall and hurled himself manfully down into the crowds.
translation:
  language: zh_hans
  text: 但由于搏斗中情势紧迫，他那一击未能达到目的[a]；这时人群正涌入门内，他便英勇地跑上城墙，以男子汉的气概[b]纵身投下，落入人群中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他那一击没有奏效。”希腊文表示他自伤的那一击没有达到预期结果。
    reason: 说明κατευκτήσας与πληγή组合的语义，并保留“未达到目的”与“没有奏效”两种自然表达。
  - marker: b
    text: 或译：“勇敢地。”原文所用的词特指带有男子气概的勇武表现。
    reason: 交代ἀνδρωδῶς的性别色彩，并提供较中性的通顺译法。
lexical_decisions:
- source_word: τῇ ... πληγῇ μὴ κατευκτήσας
  choice: 他那一击未能达到目的
  rationale: πληγή在此结合上下文指他自伤的一击，而非单指伤口；κατευκτήσας表示达成意图。译文既说明这一击没有产生预期结果，又不擅自补明具体伤势。
- source_word: διὰ τὴν τοῦ ἀγῶνος σπουδήν
  choice: 由于搏斗中情势紧迫
  rationale: ἀγών在此是暴力冲突或搏斗，σπουδή表示仓促、紧迫；此译法自然地交代他未能得手的原因。
- source_word: τῶν ὄχλων ἔσω τῶν θυρωμάτων εἰσβαλλόντων
  choice: 这时人群正涌入门内
  rationale: 分词结构表示同时发生的背景动作；εἰσβαλλόντων带有冲入之意，ἔσω τῶν θυρωμάτων表示进入门口以内。
- source_word: ἀναδραμὼν γενναίως ἐπὶ τὸ τεῖχος
  choice: 英勇地跑上城墙
  rationale: ἀναδραμών表示迅速向上跑，γενναίως表示勇敢、英勇，τεῖχος指防御性的墙体，此处译作“城墙”符合场景。
- source_word: ἀπεκρήμνισεν ἑαυτὸν
  choice: 纵身投下，落入人群中
  rationale: 该动词表示从高处把自己抛下。“纵身投下”保留主动、猛烈及由高处下坠的意味；补出“落入”使现代汉语表达完整，并对应εἰς τοὺς ὄχλους。
- source_word: ἀνδρωδῶς
  choice: 以男子汉的气概
  rationale: 该副词明确带有男性勇武色彩；译文保留这一源语特征，而不直接淡化为一般的“勇敢地”。
theological_decisions:
- issue: ἀνδρωδῶς所含的男性勇武色彩
  choice: 以男子汉的气概
  alternative: 勇敢地；无畏地
  rationale: 原文并非仅使用一般性的勇敢用语，而是以男性气概描写其举动。保留该色彩忠于文本，但不把它扩展为关于性别或德性的教义判断。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“搏斗中情势紧迫”“正涌入门内”使句法符合现代汉语；“以男子汉的气概”有意保留原文的男性勇武色彩。全句维持原文紧迫、连续的动作节奏，未对自杀行为作额外的赞许或谴责。
