  text: He urged him to marry and have children; he married[a], settled down, and shared in common life.
translation:
  language: zh_hans
  text: 他劝他娶妻生子；他就结了婚，安定下来，过起了寻常生活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有分于生活”或“与人共同生活”。希腊语ἐκοινώνησεν βίου略带习语色彩，含义不完全确定，可能是指进入通常的家庭和社会生活。
    reason: 保留原文习语的词义歧义，并说明正文所采用的语境性理解。
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: 劝
  rationale: 此处表示恳切劝说，而不只是一般请求；“劝”符合现代汉语叙事表达。
- source_word: γῆμαι
  choice: 娶妻
  rationale: 在此男性主语的语境中，γαμέω指结婚；“娶妻”自然准确，也与下文“结了婚”相呼应。
- source_word: παιδοποιήσασθαι
  choice: 生子
  rationale: 该词指生育后代；“生子”简洁自然，不采用较古雅的“生儿育女”或较狭窄的“传宗接代”。
- source_word: ἐγάμησεν
  choice: 结了婚
  rationale: 直译叙事性不定过去时，同时避免连续使用“娶妻”造成表达生硬。
- source_word: εὐστάθησεν
  choice: 安定下来
  rationale: 该动词有变得稳固、安顿下来的意思；在婚姻与日常生活的语境中，“安定下来”最贴切。
- source_word: ἐκοινώνησεν βίου
  choice: 过起了寻常生活
  rationale: 这是略带习语色彩且含义不完全确定的表达，可能指参与通常的家庭和社会生活；正文采用自然汉语，脚注保留更贴近字面的其他理解。
