  text: 使王国得以安定。因此，既除去了祖传的……[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的现存希腊文在此残缺，并在“祖传的……”之后于句中中断。本译文只翻译此见证实际保存的文字，不推补缺失的名词或后文。
