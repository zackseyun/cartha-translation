lexical_decisions:
- source_word: βασιλείαν
  choice: 国度
  rationale: 该词为τυχεῖν所支配的宾语；“国度”既可指国家领域，也可涵盖王权治理，不必过度限定为“王位”。
- source_word: εὐσταθείας
  choice: 安定
  rationale: 此名词表示稳固、稳定的状态；在政治语境中，“安定”自然地表达国度稳固而有秩序的状态。
- source_word: τυχεῖν
  choice: 得以
  rationale: 该不定式有“获得、达到”之意；与“安定”搭配译作“得以安定”，符合现代汉语表达，同时保留达成所求状态的含义。
- source_word: ὅθεν
  choice: 因此
  rationale: 这里承接上文并引出结果或推论；“因此”准确传达其因果承接作用。
- source_word: ἀφελόμενος
  choice: 他夺去了
  rationale: 该分词表示拿走、除去；“夺去了”保留其主动取走的力度。汉语需补出隐含的第三人称主语，但不指明其身份。
- source_word: προγονικήν
  choice: 祖传的
  rationale: 该形容词指属于祖先或由先人传下来的事物；由于现存文本在此中断，使用“祖传的”而不补出被修饰的名词。
