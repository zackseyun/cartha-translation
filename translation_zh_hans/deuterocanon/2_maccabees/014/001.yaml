base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/001.yaml
  text: But after three years[a], word came to those around Judas that Demetrius son of Seleucus had sailed into the harbor at Tripolis with a strong force and a fleet,
translation:
  language: zh_hans
  text: 过了三年，消息传到犹大一行人那里[a]：塞琉古之子德米特里率领一支强大的军队和一支舰队，经由特里波利的港口驶入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译作“（消息）临到犹大一行人”；这里的动词按语境指消息传到他们那里。
    reason: 说明προσέπεσεν的字面意象及其在本句中的惯用含义；括号中的“消息”是按上下文补足。
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: 过了三年
  rationale: μετά接宾格表示一段时间之后；此处用简洁自然的汉语叙事表达。δέ是轻微的承接或转折，汉语无需生硬地逐字译出。
- source_word: προσέπεσεν τοῖς περὶ τὸν Ἰούδαν
  choice: 消息传到犹大和跟随他的人那里
  rationale: προσπίπτω本义为“落到、临到”，此处按语境表示消息传至。τοῖς περὶ τὸν Ἰούδαν指犹大及其身边或所属的一群人，译作“犹大和跟随他的人”清楚自然。
- source_word: Δημήτριον τὸν τοῦ Σελεύκου
  choice: 塞琉古的儿子德米特里
  rationale: 冠词加属格构成父子关系说明；按现代汉语习惯明确译出“儿子”。
- source_word: διὰ τοῦ κατὰ Τρίπολιν λιμένος εἰσπλεύσαντα
  choice: 从特里波利的港口驶入
  rationale: εἰσπλέω表示乘船驶入；διά带属格表示经过或取道，κατὰ Τρίπολιν说明该港口位于特里波利一带。译文保留驶入方向，但不补出原文未明说的目的地。
- source_word: μετὰ πλήθους ἰσχυροῦ καὶ στόλου
  choice: 率领一支强大的军队和一支舰队
  rationale: πλῆθος在军事语境中指大批人马或军队，ἰσχυρός表示强大有力；στόλος明确指舰队。用“率领”自然表达德米特里与这两支力量同行。
