  yaml_path: translation/deuterocanon/2_maccabees/014/029.yaml
  text: But since it was not possible to oppose the king[a], he kept watching for an opportunity to accomplish it by a stratagem.
translation:
  language: zh_hans
  text: 但既然无法反对王，他就一直伺机用计把事情办成。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就一直等待合适的时机，用计达成目的。”希腊文没有明说所要办成的是什么。
    reason: 保留εὔκαιρον的较形式对应译法，并说明ἐπιτελέσαι的宾语在原文中省略。
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: 可是，既然
  rationale: 兼顾转折性的连接语气与原因关系，符合现代汉语叙事表达。
- source_word: τῷ βασιλεῖ ἀντιπρᾶξαι
  choice: 反对王
  rationale: ἀντιπράσσω表示采取对抗行动或反对；与格指出行动所针对的对象。原文没有相当于“公开”的词，因此不增译。
- source_word: οὐκ ἦν
  choice: 无法
  rationale: 以自然简洁的汉语表达希腊文非人称结构所表示的不可能或无能为力。
- source_word: εὔκαιρον ἐτήρει
  choice: 一直伺机
  rationale: εὔκαιρον指合宜的时机，未完成过去时ἐτήρει表示持续留意或等待；“一直伺机”凝练地保留两者。
- source_word: στρατηγήματι
  choice: 用计
  rationale: 表示借助谋略、计策而行；“用计”自然，并保留策略性而不过度强调军事色彩或道德评价。
- source_word: τοῦ ἐπιτελέσαι
  choice: 把事情办成
  rationale: 表达目的性的动词不定式及“完成、办成”之意，同时用泛指的“事情”避免擅自确定希腊文省略的宾语。
