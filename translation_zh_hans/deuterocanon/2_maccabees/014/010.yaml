  text: For as long as Judas remains[a], it is impossible for affairs to attain peace.
translation:
  language: zh_hans
  text: 因为犹大只要还在[a]，局势就不可能达到和平。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本在本句开头的措辞难解；本句大意是，犹大继续存在，就不可能实现和平。
    reason: textual_variant
lexical_decisions:
- source_word: ἰσχρὰ
  choice: 因为……只要
  rationale: 传世希腊文本在此处难解，可能有讹误或省略；结合 περιὼν，译文保留因果关系，同时表达犹大持续存在期间和平不可能实现的时间含义。
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用中文圣经传统中对该人名的通行译法。
- source_word: περιὼν
  choice: 还在
  rationale: περίειμι 在此可指仍然活着或继续存在；“还在”自然简洁，也保留是指生存还是政治上的持续存在这一语义宽度。
- source_word: ἀδύνατον
  choice: 不可能
  rationale: 对应希腊文的非人称谓语，现代汉语表达直接自然。
- source_word: εἰρήνης
  choice: 和平
  rationale: 采用该词的基本义，不擅自限定为正式和约。
- source_word: τυχεῖν
  choice: 恢复
  rationale: 与“和平”搭配自然，表达局势达到或获得和平状态；上下文隐含此前和平已经破坏。
- source_word: τὰ πράγματα
  choice: 局势
  rationale: 这里指公共或政治事务的整体状况；“局势”比“事情”更符合外交政治语境。
