base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/038.yaml
  text: For in earlier times[a], when separation was being judged, he had come under accusation for Judaism[b], and had risked both body and soul for Judaism with all earnestness.
translation:
  language: zh_hans
  text: 因为早先，在有关保持分别的案件受审时[a]，他曾因犹太教[b]受到控告，并且以十足的热忱，为犹太教冒身体和性命的危险。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“早先，在有关不相混杂或不交往的案件受审时。”希腊原文表达紧缩，可能指司法审理；“保持分别”不限定其具体对象。
    reason: lexical_alternative
  - marker: b
    text: 这里的“犹太教”并非仅指抽象的宗教，也可包括犹太人所持守的祖传身份、礼俗和生活实践。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: 早先
  rationale: 自然简洁地表达回顾从前的时间意义。
- source_word: τῆς ἀμιξίας κρίσις
  choice: 在不与异族交往一事受审时
  rationale: ἀμιξία指不混合、不交往；结合κρίσις及后面的法律语境，译出案件受审之意。上下文涉及犹太人与外族习俗保持分别，故补出“异族”以使现代中文清楚，同时以脚注保留原文压缩表达的不确定性。
- source_word: εἰσενηνεγμένος
  choice: 被控告
  rationale: 该完成时分词与κρίσις相连，可能指被带入司法审理或遭到指控；“被控告”在中文中自然地传达这里的法律语境。
- source_word: Ἰουδαισμοῦ / ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: 坚守犹太信仰和生活方式／为此
  rationale: Ἰουδαϊσμός在此不仅指抽象宗教，也包含祖传身份、礼俗和生活实践；展开翻译可避免现代“犹太教”一词过度窄化。第二处以“为此”避免中文重复，却保持同一所指。
- source_word: σῶμα καὶ ψυχὴν
  choice: 自己的身体和性命
  rationale: ψυχή在冒险语境中可指生命；与σῶμα并列，强调他整个人都置于危险之中。“性命”比“灵魂”更自然地表达此处受险的含义。
- source_word: παραβεβλημένος
  choice: 不惜
  rationale: 该词表示使自己暴露于危险、甘冒风险；“不惜身体和性命”是自然且有力度的现代中文表达。
- source_word: μετὰ πάσης ἐκτενίας
  choice: 全心竭力
  rationale: 表达完全的热切、专注与尽力，既保留强度，也符合庄重自然的中文语体。
theological_decisions:
- issue: Ἰουδαϊσμός在第二圣殿时期历史语境中的范围
  choice: 犹太信仰和生活方式
  alternative: 犹太教
  rationale: 原词涵盖受压迫时所持守的祖传信仰、身份和实践，不宜仅理解为现代意义上的制度化宗教；展开译法保留其历史广度。
- issue: σῶμα καὶ ψυχή是否应译为“身体和灵魂”
  choice: 身体和性命
  alternative: 身体和灵魂
  rationale: 此处与παραβάλλομαι所表达的冒险相连，重点是将整个生命置于危险中，并非对身体与灵魂关系作教义性陈述；“性命”更符合汉语语境。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不与异族交往”交代ἀμιξία在上下文中的社会含义；以脚注保留该短语可能泛指“保持分别”的歧义。主句避免机械重复Ἰουδαϊσμός，并用“全心竭力，不惜……”再现原文的强烈投入。
