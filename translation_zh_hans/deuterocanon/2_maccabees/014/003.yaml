base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/003.yaml
  text: But a certain Alcimus[a], who had formerly become high priest and had willingly defiled himself in the times of separation, realized that in no way was there safety for him, nor any longer access to the holy altar,
translation:
  language: zh_hans
  text: 有一个名叫阿尔基慕的人，先前曾作过大祭司；在隔绝时期[a]，他曾甘愿玷污自己。他想到自己无论如何都无法自保，也再不能接近圣坛，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隔绝时期”也可理解为“背教时期”。希腊文直译为“不相混合或隔离的时期”，可能指宗教污秽和疏离的那段时期。
    reason: 保留ἀμιξία的词义歧义及其历史—宗教含义。
lexical_decisions:
- source_word: Ἄλκιμος
  choice: 阿尔基慕
  rationale: 按希腊文人名音译，采用现代汉语中清楚、自然的形式。
- source_word: προγεγονὼς ἀρχιερεύς
  choice: 先前曾作过大祭司
  rationale: 保留分词所表达的先前身份及其动词意味，不简化为单纯的“大祭司”。
- source_word: ἑκουσίως
  choice: 甘愿
  rationale: 表达行为出于自愿和主观意愿；比“故意”少一层推断性的恶意色彩。
- source_word: μεμολυσμένος
  choice: 曾……玷污自己
  rationale: 反映完成时分词所指已经发生并造成持续污秽状态的行为，同时兼顾礼仪与道德含义。
- source_word: ἐν τοῖς τῆς ἀμιξίας χρόνοις
  choice: 在隔绝时期
  rationale: ἀμιξία本义为不相混合、隔离或隔绝；正文保留这种较直译而仍可理解的表述，不直接定为“背教”。
- source_word: συννοήσας
  choice: 他想到
  rationale: 表示经过思量而认识到自己的处境；“想到”自然承接后面的判断，也保留分词的因由背景。
- source_word: καθʼ ὁντιναοῦν τρόπον οὐκ ἔστιν αὐτῷ σωτηρία
  choice: 自己无论如何都不可能保全性命
  rationale: 此处σωτηρία在叙事语境中主要指现实的安全、存全或脱险；译为“保全性命”避免不必要地限定为神学意义上的“救恩”。
- source_word: πρὸς τὸ ἅγιον θυσιαστήριον ἔτι πρόσοδος
  choice: 也再不能到圣坛前
  rationale: πρόσοδος表示接近、进入或到达的机会与资格；这一译法自然表达他已失去亲近圣坛的可能。
theological_decisions:
- issue: ἀμιξία在历史—宗教语境中的具体所指
  choice: 隔绝时期
  alternative: 背教时期；分离时期；禁绝交往时期
  rationale: 该词字面指不相混合或隔离，具体可能涉及宗教上的疏离、污秽或背教。正文不将含义收窄为“背教”，以保存原文的歧义，并用脚注说明可能的语境含义。
- issue: σωτηρία是现实安全还是神学救恩
  choice: 保全性命
  alternative: 安全；得救；脱险
  rationale: 上下文描述阿尔基慕的现实处境，并与不能再接近圣坛并列，因此首先理解为存全、脱险或安全，而非明确的末世性救恩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原句未完的延续结构，以逗号收束，因为本节希腊文在此处仍与下文相连。
