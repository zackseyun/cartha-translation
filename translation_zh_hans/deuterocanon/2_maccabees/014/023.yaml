  text: Nicanor stayed on in Jerusalem and did nothing out of place[a]; and he dismissed the gathered crowds.
translation:
  language: zh_hans
  text: 尼加挪尔留在耶路撒冷，丝毫没有做出不当的事；他还遣散了聚集起来的乌合之众[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“聚集起来的人群”；较直译为“像兽群般的群众”。希腊语形容词带有贬义，形容人们像无序的群体一样行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβεν
  choice: 留在
  rationale: 未完成时表示他在一段时间内持续留居耶路撒冷；“留在”自然简洁，并保留延续意味。
- source_word: ἔπραττεν οὐδὲν ἄτοπον
  choice: 丝毫没有做出不当的事
  rationale: ἄτοπος可指不合宜、失当或反常；这里不把含义收窄为某一种具体罪行。“丝毫没有”自然表达οὐδὲν的全然否定。
- source_word: συναχθέντας
  choice: 聚集起来的
  rationale: 直接表达分词“被聚集、已经聚集”的意义，同时符合现代汉语叙事习惯。
- source_word: ἀγελαίους ὄχλους
  choice: 乌合之众
  rationale: ἀγελαῖος本有成群如牲畜之意，用于人群时带贬义；“乌合之众”能自然传达这种把人视为无序群体的语气，而不采用生硬的“兽群般的群众”。
- source_word: ἀπέλυσεν
  choice: 遣散
  rationale: 此处所指是让已聚集的人群散去，并非释放囚犯；“遣散”准确贴合场景。
