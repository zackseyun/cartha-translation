base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/033.yaml
  text: 'Stretching out his right hand toward the temple[a], he swore this: “If you do not hand Judas over to me as a prisoner, I will make this sanctuary of God a plain, tear down the altar, and raise up here a splendid temple to Dionysus.”'
translation:
  language: zh_hans
  text: 他向圣殿伸出右手，起誓说：“你们若不把犹大作为囚犯交给我，我就要使这座上帝的圣所变成一片平地，拆毁祭坛，并在这里为狄俄尼索斯建起一座宏伟的神庙。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείνας τὴν δεξιὰν ἐπὶ τὸν νεών
  choice: 向圣殿伸出右手
  rationale: 保留伴随起誓的具体动作；ἐπί在动作语境中按方向理解为“向”，νεών指圣殿建筑本身。
- source_word: δέσμιον μοι τὸν Ἰούδαν παραδῶτε
  choice: 把犹大作为囚犯交给我
  rationale: 保留δέσμιον的表语作用，不额外断定犹大已被锁链捆绑；“交给”自然表达敌对情境中的移交。
- source_word: τόνδε τὸν τοῦ θεοῦ σηκὸν
  choice: 这座上帝的圣所
  rationale: σηκός在这里指神圣建筑或内殿；译作“圣所”既符合语境，也与前面的νεών“圣殿”有所区别。
- source_word: εἰς πεδίον ποιήσω
  choice: 使……变成一片平地
  rationale: 直接保留希腊文“使之成为平地”的毁灭性威胁，而不只概括为“夷平”。
- source_word: τὸ θυσιαστήριον κατασκάψω
  choice: 拆毁祭坛
  rationale: θυσιαστήριον是献祭用的祭坛；κατασκάπτω在此表示拆除、摧毁。
- source_word: ἱερὸν ... τῷ Διονύσῳ ἐπιφανὲς ἀναστήσω
  choice: 为狄俄尼索斯建起一座宏伟的神庙
  rationale: ἀναστήσω表示兴建；ἐπιφανές形容建筑显著、壮观，译作“宏伟”符合威胁中夸耀性的语气。
theological_decisions:
- issue: 耶路撒冷圣域与异教神庙相关词语的区分
  choice: 将νεών译为“圣殿”，σηκός译为“上帝的圣所”，θυσιαστήριον译为“祭坛”，ἱερόν译为狄俄尼索斯的“神庙”
  alternative: 把νεών、σηκός和ἱερόν一律译为“圣殿”或“神庙”
  rationale: 原文刻意使用多个敬拜空间词语。适度区分可保留其修辞层次，并清楚呈现犹太圣所与拟建异教神庙之间的对照，而不附加宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；誓言中的条件句与连续三个威胁保持紧凑有力。专名Διόνυσος按现代汉语常用形式译作“狄俄尼索斯”。
