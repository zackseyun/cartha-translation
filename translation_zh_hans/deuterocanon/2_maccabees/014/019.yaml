  text: Therefore he sent Posidonius and Theodotus and Mattathias to give and receive pledges[a].
translation:
  language: zh_hans
  text: 因此，他派波西多尼乌斯、提奥多特和玛他提亚前去，彼此握右手[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指双方以握右手作为诚信或达成协议的保证。
    reason: cultural_note
lexical_decisions:
- source_word: διόπερ
  choice: 因此
  rationale: 承接上文并表达由前情得出的结果，符合该推论连词的语气。
- source_word: ἔπεμψεν
  choice: 他派……前去
  rationale: 自然表达 πέμπω 的简单过去时含义，并使后接目的不定式在汉语中顺畅。
- source_word: Ποσίδωνιον καὶ Θεόδοτον καὶ Ματταθίαν
  choice: 波西多尼、提奥多托和玛 Mattathias
  rationale: 人名按希腊语形式音译；三人并列用现代汉语标点和“和”连接。
- source_word: δοῦναι καὶ λαβεῖν
  choice: 彼此……伸出
  rationale: 希腊文直译为“给予并接受”，与“右手”连用表示双方以握右手互作保证；“彼此伸出右手”保留具体动作，也避免生硬的“给予并接受右手”。
- source_word: δεξιάς
  choice: 右手
  rationale: 保留该词的具体身体意象；其作为信约或协议保证的文化含义由脚注说明。
