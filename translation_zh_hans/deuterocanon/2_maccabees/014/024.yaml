  text: And he kept Judas continually before him[b][a]; he was inwardly drawn to the man.
translation:
  language: zh_hans
  text: 他一直把犹大留在自己身边[a]；他内心倾向于这个人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他始终让犹大在自己面前。”这个希腊语表达既可指让某人常在身旁，也可指始终把他放在自己的关注之中。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他内心亲近这个人”或“他对这个人深有好感。”这里的副词和动词合在一起，表示一种内在而持久的倾向或好感。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχεν ... ἐν προσώπῳ
  choice: 让……留在自己身边
  rationale: 这个习语字面涉及“在面前／面前的所在”，在此既可指让犹大常在身旁，也可指始终关注他。正文采用自然的关系与空间表达，歧义则在脚注中保留。
- source_word: διὰ παντός
  choice: 常
  rationale: 表示持续或经常如此；“常”符合现代汉语叙事语体，同时不把频率机械地绝对化。
- source_word: ψυχικῶς
  choice: 从心里
  rationale: 该副词源于 ψυχή，强调内在的情感或意向。“从心里”既保留内在色彩，也比直译为“在魂里”自然。
- source_word: προσεκέκλιτο
  choice: 亲近
  rationale: 完成时形式表达已经形成并持续的倾向或好感。“亲近”能传达个人情感上的靠拢，又不把它夸大为正式结盟。
- source_word: τῷ ἀνδρί
  choice: 这个人
  rationale: 保留希腊文对犹大的明确个人指称及轻微强调，而不简单化为代词“他”。
