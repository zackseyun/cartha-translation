  text: And he immediately selected Nikanor[a], who had become commander of the elephants, and appointed him general over Judea, and sent him out.
translation:
  language: zh_hans
  text: 他立刻选定了曾任战象统领的尼迦挪，任命他为犹太地的将军[a]，派他前去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地的总督”或“犹太地的军政长官”。希腊语στρατηγός既可指军事统帅，也可指治理一个地区的官员；这里的职权很可能兼有两者。
    reason: lexical_alternative
lexical_decisions:
- source_word: προχειρισάμενος
  choice: 选定
  rationale: 该分词表示为某项任务拣选或指定某人；译作“选定”既贴合语义，也避免与下文明确表示任命的ἀναδείξας重复。
- source_word: εὐθέως
  choice: 立刻
  rationale: 表示行动迅速、毫不拖延；“立刻”是自然清楚的现代汉语。
- source_word: τὸν γενόμενον ἐλεφαντάρχην
  choice: 那曾任战象队统领的
  rationale: ἐλεφαντάρχης指掌管战象或战象部队的军官；“战象队统领”明确表达古代军事职务，而γενόμενον在此适合译作“曾任”。
- source_word: στρατηγὸν
  choice: 将军
  rationale: στρατηγός通常指军事统帅；与τῆς Ἰουδαίας连用时，也可能包含对该地区的军事行政管辖，因此正文采用直接的“将军”，并以脚注保留“总督／军政长官”的可能性。
- source_word: ἀναδείξας
  choice: 委任
  rationale: 该词指正式指定或任命某人担任职务；“委任”符合官职语境，并与前面的“选定”形成自然区分。
- source_word: ἐξαπέστειλεν
  choice: 差派他出去
  rationale: 该复合动词表示派出；“差派他出去”保留ἐξ-所带的向外派遣意味，也符合庄重叙事语体。
