base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/026.yaml
  text: But Alcimus[a], perceiving the goodwill toward one another and learning of the agreements that had been made, came to Demetrius and said that Nicanor was favoring interests contrary to the state; for he had appointed Judas, the plotter against his kingdom[b], as successor.
translation:
  language: zh_hans
  text: 可是，阿尔基慕看出双方之间的善意，又得知他们所订立的协议[a]，便去见德米特里，说尼加诺在国事上怀有异心[b]，因为他竟把那图谋反对德米特里王国的犹大立为继任者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “协议”也可译作“条约”或“约定”。“得知”所译的希腊语字面为“取得、收到”，也可能表示阿尔基慕拿到了已经订立的协议文本。
    reason: 保留 συνθήκας 与 λαβών 的词义范围和句法歧义。
  - marker: b
    text: 或译：“尼加诺心向与国事相悖之事。”这句希腊语较为凝练，表达他在政治立场上背离国家事务或王国利益的指控。
    reason: 说明政治习语 ἀλλότρια φρονεῖν τῶν πραγμάτων 的较直译形式及含义。
lexical_decisions:
- source_word: συνιδὼν
  choice: 看出
  rationale: 此分词不只是肉眼看见，也表示察觉、认识到；“看出”在叙事中自然，并保留其认知意味。
- source_word: τὴν πρὸς ἀλλήλους εὔνοιαν
  choice: 双方彼此怀有善意
  rationale: εὔνοια 指友善、好意或善意；πρὸς ἀλλήλους 表明这是双方相互的态度。
- source_word: τὰς γενομένας συνθήκας λαβὼν
  choice: 得知他们所订立的协议
  rationale: λαβών 字面为“取得、收到”，这里与已经订立的 συνθῆκαι 连用，可理解为获知或收到有关协议的消息；“得知”符合汉语表达，同时用脚注保留“取得文本”的可能。
- source_word: ἀλλότρια φρονεῖν τῶν πραγμάτων
  choice: 所想的有违国事
  rationale: 译文保留 φρονεῖν 的“思想、意向”意味，也表达 ἀλλότρια 与公共事务或国家事务不相合的政治指控，避免把它直接改写为已经付诸实行的行为。
- source_word: ἐπίβουλον τῆς βασιλείας αὐτοῦ
  choice: 那图谋反对德米特里王国的
  rationale: ἐπίβουλος 指暗中谋害或策划反对者；αὐτοῦ 在对德米特里说话的语境中指他的王国。重复人名可避免汉语代词指向含混。
- source_word: διάδοχον ἀπέδειξεν
  choice: 立为继任者
  rationale: ἀποδείκνυμι 在此有指定、任命之意，διάδοχος 为继任者；不译作“王位继承人”，以免加入希腊文未明说的世袭或王位含义。
theological_decisions:
- issue: 尼加诺所受指控的政治含义
  choice: 译作“所想的有违国事”
  alternative: “行事有损国家利益”或“心向与国事相悖之事”
  rationale: 原文的 φρονεῖν 首先涉及思想、意向或立场，而 τὰ πράγματα 在这里很可能指公共或国家事务。正文既传达政治不忠的指控，又不把思想直接强化为行动。
- issue: 犹大被指定为何种“继任者”
  choice: 只译“继任者”
  alternative: “接班人”“王位继承人”或“继承人”
  rationale: διάδοχος 本身没有明说继任何人或继承何种职位。保留较宽泛的“继任者”，不擅自补足王位或世袭关系。
translation_notes:
  register: 采用庄重而现代的叙事汉语。“可是……便……”清楚呈现转折和行动顺序；“有违国事”保留原文政治指控的凝练感。“阿尔基慕、德米特里、尼加诺”依现代汉语常见音译形式处理。
