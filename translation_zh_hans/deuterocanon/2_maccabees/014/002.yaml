translation:
  language: zh_hans
  text: 在除掉安条克及其监护人[a]吕西亚之后，已经控制了该国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “监护人”或译“摄政者”。希腊语ἐπίτροπος也可指受托管理者；在这里可指吕西亚作为安条克的监护者及代行统治者的身份。
    reason: 保留ἐπίτροπος在个人监护与政治摄政之间的词义幅度。
lexical_decisions:
- source_word: κεκρατηκέναι
  choice: 已经控制了
  rationale: κρατέω的完成时不定式表示取得并掌握统治权；“已经控制了”自然传达既成的政治、军事控制，同时不暗示这种统治必然长久。
- source_word: τῆς χώρας
  choice: 这片国土
  rationale: χώρα在此指争夺中的疆域或国家领土；“这片国土”比单说“土地”更符合政治语境。
- source_word: ἐπανελόμενον
  choice: 并除掉了
  rationale: ἐπαναιρέω的分词在此表示排除或铲除政治对手。“除掉”保留其结果性和一定的强制意味，却不擅自断定具体方式或是否亲手杀害。
- source_word: Ἀντίοχον
  choice: 安条克
  rationale: 按现代汉语常用圣经人名译法音译。
- source_word: ἐπίτροπον
  choice: 监护人
  rationale: ἐπίτροπος可指监护人、受托管理者或摄政者。原词首先体现里息雅对安条克的监护、代管身份；政治上的“摄政”含义在脚注中保留。
- source_word: Λυσίαν
  choice: 里息雅
  rationale: 采用现代汉语圣经传统中常见的音译形式。
