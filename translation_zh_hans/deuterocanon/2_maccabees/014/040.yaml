  text: For he thought that by arresting him he would bring disaster on these people[a].
translation:
  language: zh_hans
  text: 因为他认为，拘捕那个人会给这些人带来灾祸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“因为他认为，拘捕那个人，就会使这些人遭受灾祸。”
    reason: 保留 συλλαβών（“拘捕”）与 ἐνεργάσασθαι συμφοράν（“使……遭受灾祸”）的较形式对应，并呈现分词行动与不定式所表达的因果关系。
lexical_decisions:
- source_word: ἔδοξεν
  choice: 他认为
  rationale: 此处表示主体的判断或盘算；“他认为”自然地承接后面的不定式结构，同时不把语气强化为已经作出的决定。
- source_word: συλλαβών
  choice: 抓住
  rationale: 分词表示拘捕或擒获某人；“抓住”在叙事中自然，并保留动作本身，脚注补充较明确的司法性译法。
- source_word: ἐκεῖνον
  choice: 那个人
  rationale: 保留指示代词的指向性，比单用“他”更贴近希腊文。
- source_word: τούτοις
  choice: 这些人
  rationale: 与原文指示代词相应，也避免把阳性复数不必要地限定为成年男性。
- source_word: ἐνεργάσασθαι
  choice: 使……遭受
  rationale: 此处具有造成、促成之意；与“灾祸”搭配，译为“使这些人遭受灾祸”符合现代汉语表达。
- source_word: συμφοράν
  choice: 灾祸
  rationale: 表达严重的不幸或灾难，语体庄重，也符合上下文的危害程度。
