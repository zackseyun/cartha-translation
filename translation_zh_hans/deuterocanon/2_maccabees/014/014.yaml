  source_fidelity: 译文准确保留了πεφυγαδευκότες的使动意义（把犹大赶走），并将ἐπὶ τῆς Ἰουδαίας自然理解为限定这些人的“在犹太地”。“成群结队地”恰当表达ἀγεληδόν；“不幸和灾祸”保留ἀτυχίας与συμφοράς的并列累加；“以为……会成为”也正确反映δοκοῦντες加将来不定式的预期。对于ἔθνη、συνέμιγνυν及τῷ Νικάνορι的压缩构造，正文采用一种可成立的理解，脚注明确保留另一种理解，未将争议句法定为唯一含义。
  naturalness: 现代汉语通顺，叙事语体庄重而不生硬。“在犹太地那些把犹大赶走的人”虽带有原文前置限定的结构，仍清晰自然；“成群结队地与尼加诺和外族人联合”与后文的动机说明衔接良好。
  terminology: 人名“尼加诺”和“犹大”一致、自然。“外族人”在此历史语境中可传达ἔθνη所指的非犹太族群，且脚注避免把它狭义教义化为“外邦人”。“福运”能表达εὐημερία与犹太人遭难形成的反讽性对照。
