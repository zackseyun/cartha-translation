base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/014.yaml
  text: But those in Judea who had driven Judas out kept flocking in droves to Nicanor from among the nations[a], thinking that the misfortunes and disasters of the Jews would become their own prosperity.
translation:
  language: zh_hans
  text: 可是，在犹太地那些把犹大赶走的人，却成群结队地与尼加诺和外族人联合[a]，以为犹太人的不幸和灾祸会成为他们自己的福运。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成群结队地归附尼加诺，混在外族人中”；希腊原文此处结构简略，可有不同理解。
    reason: 保留ἔθνη与συνέμιγνυν、τῷ Νικάνορι之间真实存在的句法歧义。
lexical_decisions:
- source_word: οἱ δὲ ἐπὶ τῆς Ἰουδαίας πεφυγαδευκότες τὸν Ἰούδαν
  choice: 可是，在犹太地那些把犹大赶走的人
  rationale: πεφυγαδευκότες是φυγαδεύω的完成时主动分词，表示使人逃亡、把人赶走；ἐπὶ τῆς Ἰουδαίας较自然地修饰这些身在犹太地的人。译文保留其使动含义，并避免把地点短语武断地改作犹大被逐出的起点。
- source_word: ἔθνη
  choice: 外族人
  rationale: 在犹太历史语境中，ἔθνη常指犹太民族以外的人；“外族人”比“列国”更适合此处指人的句法，同时不额外赋予宗教含义。
- source_word: συνέμιγνυν
  choice: 联合
  rationale: 该未完成时动词本义为混合、结交或联合；此处描述政治军事上的归附，译作“联合”自然，并保留持续聚集的语境。
- source_word: ἀγεληδόν
  choice: 成群结队地
  rationale: 该副词意为像牲群一样、成群地；“成群结队地”既传达大批聚拢的画面，也符合现代汉语表达。
- source_word: τῷ Νικάνορι
  choice: 与尼加诺
  rationale: 与συνέμιγνυν连用的与格自然表示联合的对象，译作“与尼加诺”贴近希腊语结构。
- source_word: ἀτυχίας καὶ συμφοράς
  choice: 不幸和灾祸
  rationale: 分别保留ἀτυχία所指的不顺、厄运，以及συμφορά所指的严重灾难，避免将两个近义词合并。
- source_word: ἰδίας εὐημερίας
  choice: 他们自己的福运
  rationale: εὐημερία可指兴旺、顺遂或福祉；这里与犹太人的“不幸和灾祸”形成反讽性对照，“福运”能兼顾境遇顺遂与自身得利。
- source_word: δοκοῦντες ἔσεσθαι
  choice: 以为……会成为
  rationale: 分词加将来不定式表达他们对未来结果的主观判断或期待；此译保留其预期意味。
theological_decisions:
- issue: ἔθνη在犹太历史语境中的译法及其与συνέμιγνυν的压缩句法
  choice: 正文译为“与尼加诺和外族人联合”，并用脚注保留另一种句法理解
  alternative: “归附尼加诺，混在外族人中”或“与外族人一同归附尼加诺”
  rationale: 希腊文ἔθνη没有明显格变化标志，和συνέμιγνυν、τῷ Νικάνορι构成压缩且可有多种分析的结构。正文采用将尼加诺和外族人并列为联合对象的理解，但不把这种分析表述为唯一可能；脚注保留归附尼加诺并与外族人混合的读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“可是”承接转折；“成群结队”保留原文带有贬意的群聚形象。人名依现代常见音译作“尼加诺”，犹大马加比简称“犹大”。
