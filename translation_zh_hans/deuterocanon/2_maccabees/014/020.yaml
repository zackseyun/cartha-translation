  yaml_path: translation/deuterocanon/2_maccabees/014/020.yaml
  text: But after fuller consideration of these matters[a], and when the leader had communicated it to the crowds, and unanimous agreement had become evident[b], they assented to the terms.
translation:
  language: zh_hans
  text: 在对这些事作了更充分的审议[a]之后，领袖将此事告知众人；一致的赞同显明出来[b]，于是他们同意了这些条件。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在对这些事作了更仔细的考察之后。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“一致的赞同显明出来”；希腊文强调众人同心一致的意见已经清楚显现。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονος δὲ γενομένης περὶ τούτων ἐπισκέψεως
  choice: 这些事经过更充分的审议
  rationale: 以时间性分句表达属格独立结构；“更充分”保留πλείονος的比较意味，“审议”兼顾考察与商议的语境。
- source_word: τοῦ ἡγουμένου
  choice: 领袖
  rationale: 原词指带领者，未明确限定为某一官职；“领袖”避免擅自具体化为总督或统治者。
- source_word: τοῖς πλήθεσιν
  choice: 众人
  rationale: 表达复数πλήθεσιν所指聚集的人群，在现代汉语中比“群众们”自然。
- source_word: ἀνακοινωσαμένου
  choice: 把有关情况告知
  rationale: 体现分享、通报之意，又不强化为正式宣告；“有关情况”自然承接前述事项。
- source_word: φανείσης ὁμοψήφου συγγνώμης
  choice: 众人显然一致赞同
  rationale: “一致”传达ὁμόψηφος的同票、全体一致意味；“赞同”按语境处理συγγνώμη的同意义，而非宽恕义；“显然”保留φανείσης。
- source_word: ἔνευσαν
  choice: 接受了
  rationale: 该动词可指点头表示同意或正式赞同；与条件搭配时，“接受”是自然庄重的汉语表达。
- source_word: ταῖς συνθήκαις
  choice: 所议定的条件
  rationale: συνθῆκαι可指协议或约定的条件；此处采用“所议定的条件”，既体现协定背景，又不武断限定为条约。
