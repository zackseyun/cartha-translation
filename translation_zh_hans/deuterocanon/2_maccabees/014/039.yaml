  yaml_path: translation/deuterocanon/2_maccabees/014/039.yaml
  text: But Nikanor[a], wanting to make plain the hostility he had toward the Jews, sent more than five hundred soldiers to arrest him.
translation:
  language: zh_hans
  text: 尼加挪想要显明他对犹太人的敌意，就派了五百多名[a]士兵去逮捕他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“超过那五百名”。
    reason: 说明原文表示人数超过五百，并保留其较为特别的字面表达。
lexical_decisions:
- source_word: βουλόμενος
  choice: 想要
  rationale: 表达分词所带出的意愿和目的，并自然地引出后面的主要行动。
- source_word: πρόδηλον ποιῆσαι
  choice: 显明
  rationale: 保留“使……明显、公开可见”的使动含义，中文简洁庄重。
- source_word: δυσμένειαν
  choice: 敌意
  rationale: 指敌对的态度或恶意；既符合政治军事语境，也不将其收窄为纯粹的情绪性“仇恨”。
- source_word: ἀπέστειλεν
  choice: 派了
  rationale: 在差遣士兵的语境中，“派了”比一般的“送去”更自然准确。
- source_word: στρατιώτας
  choice: 士兵
  rationale: 直接指个别军事人员，现代汉语清楚自然。
- source_word: ὑπὲρ τοὺς πεντακοσίους
  choice: 五百多名
  rationale: ὑπέρ加宾格在此表示数量超过五百；“五百多名”符合现代汉语习惯。
- source_word: συλλαβεῖν
  choice: 去逮捕
  rationale: 此处指派兵将人拘捕；“逮捕”比宽泛的“抓住”或“捉拿”更准确。
- source_word: αὐτόν
  choice: 他
  rationale: 代词承接上文所提到的拉齐斯；正文保留原文的代词表达。
