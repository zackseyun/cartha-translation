base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/008.yaml
  text: 'I have now come a second time concerning the high priesthood: first[a], because I sincerely have in mind the interests of the king, and second, because I am also considering those of my own fellow citizens; for by the folly of the men mentioned before'
translation:
  language: zh_hans
  text: “至于大祭司的职分，我如今第二次前来：第一，是因为我真诚地关心王的利益；第二，也是为我自己的同胞着想；其一，是由于上述那些人的愚妄[a]……”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的句子延续到下一节；这里所提供的希腊文节录在从句中间中断。“其一”对应原文的对举标记，另一项在下一节出现，因此译文保留未完的语气。
    reason: textual_variant
lexical_decisions:
- source_word: τὴν ἀρχιερωσύνην
  choice: 至于大祭司的职分
  rationale: ἀρχιερωσύνη指大祭司的职位或职分；译为“大祭司的职分”既准确，又避免让人误解为仅指某位大祭司本人。
- source_word: δεύτερον νῦν ἐλήλυθα
  choice: 我如今第二次前来
  rationale: 保留νῦν的“如今”和δεύτερον的“第二次”，同时符合现代汉语表达。
- source_word: ὑπὲρ τῶν ἀνηκόντων τῷ βασιλεῖ
  choice: 关心王的利益
  rationale: τὰ ἀνήκοντα τῷ βασιλεῖ指与王有关、属于王之权益的事；在政治陈情的语境中，“王的利益”自然且贴切。
- source_word: γνησίως φρονῶν
  choice: 真诚地关心
  rationale: γνησίως表达真挚、诚恳，φρονῶν表达心里顾念或关切；合译为“真诚地关心”可保留其自称忠诚的语气。
- source_word: τῶν ἰδίων πολιτῶν
  choice: 自己的同胞
  rationale: πολῖται本义为同城邦的公民，ἰδίων强调自己一方的人；“自己的同胞”在现代汉语中自然，也不额外限定族裔身份。
- source_word: στοχαζόμενος
  choice: 为……着想
  rationale: 此处表示顾念、考虑其利益，与前面的φρονῶν形成平行；“为……着想”比直译“推测”更合语境。
- source_word: τῇ μὲν γὰρ τῶν προειρημένων
  choice: 因为上述那些人的愚妄
  rationale: 所给希腊文在此中断，句法显然延续至下一节；依据句首的因果结构作谨慎表达，并以省略号显示本句未完。
