translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“王”保留希腊文政治称谓的简洁形式；冒号和分号呈现原文“第一……第二……”的论述层次。末尾用省略号并加注，避免把残缺从句误作完整句。
