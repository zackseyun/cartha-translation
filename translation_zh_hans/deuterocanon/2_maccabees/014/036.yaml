  text: And now, O Lord, holy in every holiness, keep this house, recently purified, undefiled forever.
translation:
  language: zh_hans
  text: 如今，至圣的主啊[a]，求你保守这座新近洁净的殿宇[b]，永远不受玷污。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “至圣的”译自一个少见而浓缩的希腊语称呼，字面含有“圣洁”与“一切成圣（或圣洁）”的表达；也可理解为“在一切圣洁中为圣的”或类似的强化说法。
    reason: lexical_alternative
  - marker: b
    text: 希腊语直译为“这座房屋”；“房屋”是圣经中称上帝圣所或圣殿的常见说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγιε παντὸς ἁγιασμοῦ
  choice: 具有一切圣洁的
  rationale: 希腊语是少见而浓缩的称呼。此译尽量保留“圣”与“一切圣洁”的重复和强化作用，同时不把它解释为原文未明说的“一切圣洁之源”。
- source_word: κύριε
  choice: 主啊
  rationale: κύριος在这里是对上帝的直接呼告；“主啊”符合现代汉语圣经语体，也保留呼格语气。
- source_word: διατήρησον
  choice: 求你保守
  rationale: 该命令式用于祈求，意思是使某种状态持续下去；“求你保守”自然表达祷告语气和持续维护之意。
- source_word: εἰς αἰῶνα
  choice: 永远
  rationale: 准确而自然地表达持续无尽的时间含义。
- source_word: ἀμίαντον
  choice: 不受玷污
  rationale: 此处涉及圣殿的礼仪洁净；“不受玷污”既保留礼仪层面的含义，也符合现代汉语。
- source_word: τόνδε τὸν ... οἶκον
  choice: 这座……殿宇
  rationale: οἶκος字面为“房屋、家”，在本语境中指圣所。汉语用“殿宇”可明确所指，又保留庄重语体；字面表达另见脚注。
- source_word: προσφάτως κεκαθερισμένον
  choice: 近日才得洁净的
  rationale: προσφάτως表示不久前，完成时分词κεκαθερισμένον表示已经被洁净；此译同时保留时间强调和被动结果。
theological_decisions:
- issue: 如何翻译对上帝的特殊称呼ἄγιε παντὸς ἁγιασμοῦ κύριε
  choice: 具有一切圣洁的主啊
  alternative: 至圣的主啊；超乎一切圣别的圣主啊
  rationale: 原文结构异常而带有强化意味，但没有明确说上帝是“圣洁的源头”。正文保留其张力，脚注列出可能的理解，不将其归入某一特定教义体系。
- issue: οἶκος在圣殿祷告中的所指
  choice: 殿宇
  alternative: 殿；这座房屋
  rationale: 该词字面是“房屋”，却是圣经中称圣所的常见用法。“殿宇”让普通读者清楚其所指，脚注则保存字面措辞及其经文习惯。
- issue: ἀμίαντον所表达的洁净性质
  choice: 不受玷污
  alternative: 没有污秽；保持洁净
  rationale: 上下文首先涉及圣殿的礼仪洁净，但该词也可带有更广泛的无玷污意味，因此不把它缩限为单一的道德或礼仪范畴。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”自然呈现希腊语命令式在祈祷中的功能；“使它永远不受玷污”将希腊语的宾语与谓语性形容词关系清楚地转化为汉语，同时保持原意。
