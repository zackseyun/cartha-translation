  text: But when they quickly drew back[a], and a space opened up, he came into the middle of the courtyard.
translation:
  language: zh_hans
  text: 众人迅速退开，腾出一片空地；他便落到露天庭院[a]的中央。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “露天庭院”或译“露天院落”。希腊词指露天的庭院或开放的院落空间。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναποδισάντων
  choice: 后退
  rationale: 该分词表示周围的人向后退开；“后退”自然、准确，也不带“撤退”可能含有的军事意味。
- source_word: ταχέως
  choice: 迅速
  rationale: 直接表达动作之快，并保留场面的突然性。
- source_word: γενομένου διαστήματος
  choice: 空出一块地方
  rationale: 该独立属格结构表示众人退开后形成了空隙；此译法清楚呈现动作所造成的空间。
- source_word: ἦλθεν κατὰ μέσον
  choice: 落在……中央
  rationale: ἦλθεν本义为“来到”，但结合上一节从墙上纵身跳下的动作，此处自然表示他落到所指空间的中央；“落在”使现代汉语连贯，同时不改变运动终点。
- source_word: κενεῶνα
  choice: 院子
  rationale: 该词可指露天的院落或庭院空间；“院子”是普通现代读者容易理解且符合场景的表达。
