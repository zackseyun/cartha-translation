base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/031.yaml
  text: But when the other man realized that he had been outmaneuvered by the man’s boldness[a], he came to the greatest and holy temple, while the priests were offering the customary sacrifices, and ordered them to hand over the man.
translation:
  language: zh_hans
  text: 但对方察觉自己已被那人以英勇果敢的谋略挫败，就来到那至大而圣洁的圣殿[a]；当祭司们正在献上规定的祭物时，他命令他们把那人交出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那伟大而圣洁的圣殿”。希腊文采用最高级“至大（最大）”，这里也可能是对圣殿表示尊崇的强调说法。
    reason: 说明 μέγιστον 既可按形式译为最高级，也可能具有强调、尊崇的习惯用法。
lexical_decisions:
- source_word: Συγνοὺς
  choice: 发觉
  rationale: 以叙事中的先行动作表达不定过去时分词，简洁自然地传达“察觉、明白”。
- source_word: ὁ ἕτερος
  choice: 对方
  rationale: 指上下文中的另一方敌对人物；“对方”比直译“另一个人”更符合现代汉语叙事。
- source_word: γενναίως
  choice: 英勇地
  rationale: 保留该副词“勇敢、高尚地”的核心意义，不将它改释为单纯的“巧妙地”。
- source_word: ὑπὸ τοῦ ἀνδρὸς ἐστρατήγηται
  choice: 在谋略上被那人……胜过了
  rationale: 保留完成时被动结构及 στρατηγέω 的军事谋略色彩；避免把它弱化为一般的“欺骗”。
- source_word: παραγενόμενος
  choice: 就来到
  rationale: 将表示随后抵达的不定过去时分词转为自然的汉语顺承叙事。
- source_word: ἐπὶ τὸ μέγιστον καὶ ἅγιον ἱερόν
  choice: 来到那至大而圣洁的圣殿
  rationale: “至大”保留 μέγιστον 的最高级形式；“圣殿”自然表达耶路撒冷圣所建筑群。
- source_word: τὰς καθηκούσας θυσίας
  choice: 规定的祭物
  rationale: καθηκούσας 指合宜、应当或按规例献上的；“规定的”比“惯常的”更能保留其应尽或指定之意。
- source_word: προσαγόντων
  choice: 正在献上
  rationale: 在献祭语境中，“献上”准确而自然地表达把祭物带到神前奉献。
- source_word: ἐκέλευσεν παραδοῦναι
  choice: 命令他们把……交出来
  rationale: 表达有权势者强制要求移交某人的语气，并按希腊语境补出宾语所指的祭司们。
- source_word: τὸν ἄνδρα
  choice: 那人
  rationale: 保留希腊文对 ἀνήρ 的重复指称，而不简化为代词。
theological_decisions:
- issue: ἱερόν 所指的耶路撒冷圣所范围
  choice: 圣殿
  alternative: 圣所；圣殿院区
  rationale: ἱερόν 可广指整个圣殿范围；“圣殿”在现代汉语中最自然，也不武断限定为内殿。
- issue: μέγιστον 的最高级语气
  choice: 至大
  alternative: 伟大；最大
  rationale: “至大”保留希腊文最高级的尊崇语气，同时脚注说明它也可能是强调性的习惯表达，避免过度确定其比较含义。
- issue: γενναίως 与 ἐστρατήγηται 的关系
  choice: 在谋略上被那人英勇地胜过
  alternative: 被那人巧妙地智取；被那人的勇气挫败
  rationale: 让副词修饰“胜过”这一动作，既保留“英勇”的意义，也保留 στρατηγέω 的谋略色彩；不把副词名词化为“勇气”，也不无依据地改成“巧妙”。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“在谋略上……胜过”略带正式色彩，用来保存原文的军事策略意味；分句处理希腊文较长的句法，使普通读者易于理解。
