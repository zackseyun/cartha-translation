base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/037.yaml
  text: A certain Razis[a], one of the elders from Jerusalem, was reported to Nicanor—a man devoted to his city and very highly regarded[b], and because of his goodwill called the father of the Jews.
translation:
  language: zh_hans
  text: 有一位耶路撒冷的长老，名叫拉齐斯；有人把他的事报告给尼加诺尔[a]。他热爱自己的城[b]，极受敬重，又因他的善意被称为“犹太人的父亲”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把他的事报告给尼加诺尔”或译“向尼加诺尔告发他”。这个希腊语动词可以泛指传达有关某人的消息；在这里的敌对语境中，也可能含有告发之意。
    reason: lexical_alternative
  - marker: b
    text: 直译“爱城的人”，指关心并忠于自己城市及其居民的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαζεὶς
  choice: 拉齐斯
  rationale: 按希腊语形式音译人名，不赋予额外含义。
- source_word: πρεσβυτέρων
  choice: 长老
  rationale: 此处最自然地指耶路撒冷受承认的年长领袖或社群领袖，而不只是年纪较大的人。
- source_word: ἐμηνύθη
  choice: 有人……告发了他
  rationale: 该被动动词表示有人把有关拉齐斯的消息通报给尼加诺尔；鉴于上下文带有敌意并引发缉拿行动，“告发”比中性的“报告”更贴合语境，同时以脚注保留较中性的可能。
- source_word: φιλοπολίτης
  choice: 热爱本城
  rationale: 该复合词直指对自己城邦或城市的热爱与忠诚；此译法自然地保留其公共和乡土意味，避免现代民族主义色彩。
- source_word: σφόδρα καλῶς ἀκούων
  choice: 声望极高
  rationale: 这是表示享有良好名声、广受称誉的希腊语习语；“声望极高”简洁而庄重。
- source_word: εὔνοιαν
  choice: 仁厚
  rationale: 该词表示善意、善待他人的心意；在解释其为何被尊称为父亲的语境中，“仁厚”比抽象的“善意”更自然。
- source_word: πατὴρ τῶν Ἰουδαίων
  choice: 犹太人的父亲
  rationale: 保留原文的尊称，表达关爱和庇护群体的人，并不将其解释为生理父亲。
- source_word: προσαγορευόμενος
  choice: 被称为
  rationale: 准确表达他人惯常以该称号称呼拉齐斯。
theological_decisions:
- issue: 对拉齐斯的荣誉性描述
  choice: 直接保留他热爱本城、声望极高、仁厚并被称为“犹太人的父亲”的正面描写
  alternative: 采用“爱国者”“民族恩人”等解释性更强的称谓
  rationale: 原文明确以高度赞许的语气描写拉齐斯；译文既不削弱这种赞誉，也不加入原文没有的现代政治或宗派含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。把较长的希腊语句分为三句，使人物身份、告发事件和荣誉性描述层次清楚；脚注标记均放在所解释词语之后。
