translation:
  language: zh_hans
  text: 带着书信前往犹太地，命他擒获犹大本人，驱散与他在一起的人，并立阿尔基慕为那座至大圣殿的大祭司。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰούδᾳ
  choice: 犹太地
  rationale: 此处与后文人物Ἰούδαν（犹大）有别，指犹太地区；补出“地”可避免中文读者误认作人名。
- source_word: ἐπανελέσθαι
  choice: 除掉
  rationale: 该动词用于人时可表示除去、消灭或杀死；“除掉”既符合敌对命令的语境，也保留其措辞幅度。
- source_word: τοὺς σὺν αὐτῷ
  choice: 跟随犹大的人
  rationale: 直译为“与他在一起的人”；按军事语境自然表达为其追随者，同时不擅自限定为正规军队。
- source_word: σκορπίσαι
  choice: 驱散
  rationale: 准确传达使聚集者四散之意。
- source_word: τοῦ μεγίστου ἱεροῦ
  choice: 那座至大的圣殿
  rationale: 保留最高级μεγίστου，不弱化为一般的“大圣殿”；定指表达也符合这里所指的耶路撒冷圣殿。
theological_decisions:
- issue: 阿尔基慕与圣殿大祭司职位的表述
  choice: 立阿尔基慕为那座至大圣殿的大祭司
  alternative: 任命阿尔基慕作大祭司
  rationale: 保留原文对“至大圣殿”的明确修饰，不对其任职合法性作神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。本节在现存输入中承接上一节，开头保留其句法上的延续感；中文补出“命他”以清楚连接后三个不定式命令。
