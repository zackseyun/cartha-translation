  register: 采用现代、庄重而易懂的军事叙事语体。“拔营”“统帅”“交战”准确而不古奥；句法依照希腊文的时间推进，先写命令，再写立即拔营和接战。脚注标在存在词义与地点关系歧义的整段之后。
