base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/016.yaml
  text: But when the commander gave the order[a], he broke camp from there at once and joined battle with them near the village of Lessaou.
translation:
  language: zh_hans
  text: 统帅下令后，他立即从那里拔营，在莱绍村附近与他们交战。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在莱绍村附近与他们交战”也可译作“到莱绍村与他们交锋”。希腊文介词短语既可表示朝向该村，也可表示在该村一带；译作“交战”的动词字面意为“混在一起”，在军事语境中指接战。
    reason: 保留 συνμίσγει 和 ἐπὶ κώμην 在军事意义及地点、方向关系上的词义弹性。
lexical_decisions:
- source_word: προστάξαντος
  choice: 下令后
  rationale: 该词为不定过去时分词，与属格主语构成背景分句，表示统帅所下的命令触发了随后行动；“下令后”简洁自然，并保留先后关系。
- source_word: τοῦ ἡγουμένου
  choice: 统帅
  rationale: ἡγούμενος 泛指带领者；本节处于军事叙事中，“统帅”既体现军事身份，又不把它具体化为文职官衔。
- source_word: ἀναζεύξας
  choice: 拔营
  rationale: 该军事用语指收营启程；“拔营”比一般的“出发”更具体地呈现军队行动。
- source_word: εὐθέως
  choice: 立即
  rationale: 准确表达动作紧接命令发生，也符合现代汉语叙事习惯。
- source_word: συνμίσγει αὐτοῖς
  choice: 与他们交战
  rationale: συνμίσγω 字面有“混合、会合”之意，在军事语境中表示与敌军接战；“与他们交战”清楚传达语境中的行动，而不过度增添战况细节。
- source_word: ἐπὶ κώμην
  choice: 在……村附近
  rationale: ἐπί 加宾格在此可表示朝向该村或在与该村相关的地点发生行动；正文采用“附近”作为审慎而自然的地点表达，并以脚注保留“在村中/村边”或“向村而去”的可能性。
- source_word: Λεσσαού
  choice: 莱绍
  rationale: 依希腊文专名 Λεσσαού 音译，采用简洁、适合现代普通话的汉字形式。
theological_decisions: []
