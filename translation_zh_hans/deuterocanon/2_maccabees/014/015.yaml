base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/015.yaml
  text: But when they heard of Nikanor’s advance and the attack of the Gentiles[a], they sprinkled dust upon themselves and implored the one who had established his people forever[c][b], and who always comes to the aid of his own portion with manifestation.
translation:
  language: zh_hans
  text: 他们听说尼加挪尔进军，又听说外族人[a]来袭，就把尘土撒在自己身上，恳求那位使自己的子民立定直到永远的上帝；他总是以显现[b]扶助自己的产业[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族人”也可译作“列国”或“外邦人”。希腊词可泛指各民族；在这里指与犹太人为敌的非犹太人。
    reason: lexical_alternative
  - marker: b
    text: “以显现”也可译作“以可见的介入”或“显明地”；原文可表示上帝的扶助伴随着明显可见的显现或行动。
    reason: alternative_reading
  - marker: c
    text: “产业”直译为“份”或“所得的份”，在这里指上帝视为归自己所有的子民。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: 他们听说……又听说
  rationale: 不定过去时分词交代主句行动发生的背景；用“听说……又听说”自然承接两个并列宾语。
- source_word: ἔφοδον
  choice: 进军
  rationale: 表示敌对的军事推进；与随后表示直接袭击的 ἐπίθεσιν 区分。
- source_word: ἐπίθεσιν
  choice: 来袭
  rationale: 表达攻击、袭击之意，并与“进军”形成自然的军事语义搭配。
- source_word: τῶν ἐθνῶν
  choice: 外族人
  rationale: 本处指与犹太人相对的非犹太民族；“外族人”在现代汉语中清楚自然，又不把该词固定为后世技术性宗教术语。
- source_word: καταπασάμενοι γῆν
  choice: 把尘土撒在自己身上
  rationale: 贴近“将土撒在自己身上”的动作，也传达哀恸、危难中恳求的姿态。
- source_word: ἐλιτάνευσαν
  choice: 恳求
  rationale: 准确表达迫切祈求，语言庄重而通俗。
- source_word: τὸν ἄχρι αἰῶνος συστήσαντα τὸν αὐτοῦ λαόν
  choice: 那位永远坚立自己子民的上帝
  rationale: συστήσαντα 可指建立、使之稳立；“坚立”兼顾其建立和维系的含义。希腊文以描述性分词指上帝，汉语补出“上帝”使指称清楚。
- source_word: ἀεὶ δὲ ... ἀντιλαμβανόμενον
  choice: 他总……扶助
  rationale: 现在时分词描述上帝一贯的作为；“扶助”保留帮助、支持的意味。
- source_word: μετʼ ἐπιφανείας
  choice: 以显明的作为
  rationale: ἐπιφάνεια 可指显现或明显可见的介入；此译保持其可见、彰显的色彩，又避免采用过于专门化的术语。
- source_word: τῆς ἑαυτοῦ μερίδος
  choice: 自己的产业
  rationale: μερίς 本义为所分得的份，语境中指上帝视为自己所有的子民；“产业”保留盟约性归属含义。
theological_decisions:
- issue: τῶν ἐθνῶν 在犹太历史语境中的所指
  choice: 外族人
  alternative: 列国；外邦人
  rationale: 该词本可泛指各民族，但这里具体指敌对犹太人的非犹太群体。“外族人”保留语境中的族群对比，脚注则说明其他可能译法。
- issue: μετʼ ἐπιφανείας 所表达的神圣介入方式
  choice: 以显明的作为
  alternative: 显现着；公开地；以可见的介入
  rationale: 原文可能侧重神的显现，也可能强调其援助明显可见。正文不把它限定为某种特定显现形式，并用脚注保存歧义。
- issue: μερίς 用于上帝子民的盟约性意象
  choice: 自己的产业
  alternative: 自己的份；自己所得的份
  rationale: “产业”能传达上帝子民归属于他的传统意象，但不将其解释为物质财产；脚注保留更字面的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“尼加挪尔”按希腊文 Νικάνωρ 音译；“上帝”虽为语法上补出，但所指由上下文明确。分号保持原句中两个描述上帝的分词结构，同时避免汉语长句失衡。
