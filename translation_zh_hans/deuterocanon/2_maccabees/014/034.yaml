base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/034.yaml
  text: 'After saying these things[a], he went away. But the priests, stretching out their hands toward heaven, were calling on the one who is always the champion of our nation, saying these things:'
translation:
  language: zh_hans
  text: 他讲完这番话，就离去了。祭司们却向天伸出双手，呼求那位始终捍卫我们民族的那一位[a]，这样说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那位始终为我们民族争战的”。希腊语词ὑπέρμαχος可指为人作战的冠军或捍卫者。
    reason: 保留ὑπέρμαχος所含的战斗性与保护、捍卫的词义范围。
lexical_decisions:
- source_word: τοσαῦτα δὲ εἰπὼν
  choice: 他讲完这番话
  rationale: 将分词结构按时间先后自然译出；“这番话”回指上文的言语，也符合现代汉语叙事表达。
- source_word: ἀπῆλθεν
  choice: 就离去了
  rationale: 准确表达离开的动作；“就”衔接前面的完成动作，体现叙事顺序。
- source_word: οἱ δὲ ἱερεῖς
  choice: 祭司们却
  rationale: “祭司们”准确表达复数名词；“却”体现 δέ 在此处由尼加诺尔离去转向祭司反应的对照和转折。
- source_word: προτείναντες τὰς χεῖρας εἰς τὸν οὐρανὸν
  choice: 向天伸出双手
  rationale: 保留祷告时伸手向天的具体姿态；汉语以“向天”自然表达动作方向。
- source_word: ἐπεκαλοῦντο
  choice: 呼求
  rationale: 此动词在祷告语境中表示向神呼吁、求告；“呼求”庄重而通俗。希腊语未完成时所含的持续意味可由祷告场景自然体现，不必用生硬的进行体。
- source_word: τὸν διὰ παντὸς ὑπέρμαχον τοῦ ἔθνους ἡμῶν
  choice: 那位始终为我们民族争战的护卫者
  rationale: “始终”表达 διὰ παντός 的持续性；“为……争战的护卫者”同时保留 ὑπέρμαχος 的军事和保护含义；“民族”保留 ἔθνος 所指共同体的民族性。
- source_word: ταῦτα λέγοντες
  choice: 说道
  rationale: 此短语引出下一节祷告的内容；汉语用“说道：”比逐字重复“说这些话”更自然，冒号清楚表明后文是直接内容。
theological_decisions:
- issue: 如何翻译对神的称谓 τὸν διὰ παντὸς ὑπέρμαχον τοῦ ἔθνους ἡμῶν
  choice: 那位始终为我们民族争战的护卫者
  alternative: 那位一直保护我们民族的；那位永远为我们民族争战的
  rationale: 原文以带冠词的名词性短语称呼神，却没有明说 θεός（神）或 κύριος（主），因此不在正文擅加称号。“护卫者”保留保护功能，“为……争战”则避免抹去 ὑπέρμαχος 的战斗色彩，同时不把这一描述扩展为额外的神学命题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“离去了”“呼求”“护卫者”适合经文语体但不过分古雅；不添加原文没有明说的“神”或“主”。
