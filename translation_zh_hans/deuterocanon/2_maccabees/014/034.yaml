revisions:
- from: 他讲完这番话，就离去了。祭司们却向天伸出双手，呼求那位始终为我们民族争战的护卫者[a]，说道：
  to: 他讲完这番话，就离去了。祭司们却向天伸出双手，呼求那位始终捍卫我们民族的那一位[a]，这样说：
  rationale: 修订仅改善汉语称谓的凝练度和句法衔接。“始终捍卫我们民族的那一位”保留διὰ παντός的持续性、ὑπέρμαχος的捍卫含义及原文以定冠词名词短语间接指称神的表达；脚注保留“为……争战”的词汇可能性。
