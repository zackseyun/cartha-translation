base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/022.yaml
  text: Judas stationed armed men[a], ready in strategic places, lest some treachery from the enemies should suddenly arise; and they held the fitting conference.
translation:
  language: zh_hans
  text: 犹大把武装人员部署在各处要地，准备就绪，防备敌人突然使诈；他们进行了合宜的会谈。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们作了适当的共同商议。”希腊语“τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν”是较具习语色彩的说法，指适合当时情势的共同讨论或会谈。
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  choice: 部署
  rationale: 在武装人员和地点短语所构成的军事语境中，表示安排、布置人员就位，而不只是下达命令。
- source_word: ἐνόπλους
  choice: 武装人员
  rationale: 原词指携带武器的人，并未明确限定其正式军人身份；此译既准确又自然。
- source_word: ἑτοίμους
  choice: 严阵以待
  rationale: 表示这些人已经准备好采取行动；结合军事警戒语境，译为“严阵以待”比单纯“准备好”更自然。
- source_word: ἐν τοῖς ἐπικαίροις τόποις
  choice: 在各处要地
  rationale: ἐπικαίροις在此指战术上关键、有利或适当的位置；“要地”简洁传达其军事含义。
- source_word: μή ποτε
  choice: 防备
  rationale: 引出预防某事发生的目的；现代汉语用“防备”可自然表达“免得、惟恐”的含义。
- source_word: ἐκ τῶν πολεμίων
  choice: 敌人
  rationale: 标明所防范恶行的来源；汉语以施事表达更为自然。
- source_word: ἐφνιδίως
  choice: 突然
  rationale: 保留事件猝然、出其不意发生的含义。
- source_word: κακουργία
  choice: 使诈
  rationale: 该词可指恶行、加害或奸诈行为；在敌对双方会谈并设防的语境中，“使诈”自然表达所防范的阴谋性恶行，同时不具体限定其手段。
- source_word: γένηται
  choice: 使诈
  rationale: 该动词表示事情发生；汉语将其与κακουργία合译为动词性短语“使诈”，避免生硬的“恶行发生”。
- source_word: τὴν ἁρμόζουσαν
  choice: 合宜的
  rationale: 保留该次商谈适合当时情势、得体恰当的评价色彩。
- source_word: ἐποίησαν κοινολογίαν
  choice: 进行了会谈
  rationale: κοινολογία表示共同参与的交谈或商议；“进行了会谈”符合外交场景，也保留双方互相讨论的含义。
