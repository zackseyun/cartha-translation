base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/009.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chislev[a], we thought it necessary to make this clear to you, so that you also may celebrate the festival of booths and of the fire, when Nehemiah, who built the temple and the altar[c][b], offered sacrifices.
translation:
  language: zh_hans
  text: 我们即将在基斯流月二十五日[a]举行圣殿洁净礼，因此认为有必要向你们说明清楚，好让你们也庆祝住棚节[b]和火的节日[c]，即尼希米建造[d]圣殿和祭坛、献上祭物时的节日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “基斯流月”是犹太历的一个月份，大致相当于公历十一月至十二月。
    reason: cultural_note
  - marker: b
    text: “住棚节”直译与搭建棚舍有关；传统上也有译作“帐棚节”的。
    reason: lexical_alternative
  - marker: c
    text: 希腊文简略地说“和火的”，可理解为与“住棚节”并列的另一节日名称；随后以“当尼希米……献上祭物时”把它与该历史时刻相连。原文没有在本句说明火如何出现或该节日如何举行。
    reason: textual_ambiguity
  - marker: d
    text: 希腊文作“建造”。按历史背景也可理解为“重建”，但原词没有明确写出“重新”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: 我们即将……庆祝
  rationale: ἄγω以节庆为宾语时表示“庆祝、守节”，μέλλοντες表示事情临近，译作“即将”自然且准确。
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: 在基斯流月二十五日
  rationale: 按希腊文保留犹太历月份名称及日期，采用现代汉语常见语序。
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: 圣殿的洁净礼
  rationale: καθαρισμός指洁净或洁净行动；结合此处节庆语境，“洁净礼”既保留含义，也比单纯“洁净”更自然。ἱερόν译为“圣殿”。
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: 认为有必要向你们说明清楚
  rationale: 保留“认为有必要”的判断意味，并以“说明清楚”表达διασαφῆσαι的明确解释之意。
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: 好让你们也庆祝
  rationale: ἵνα表达目的，καὶ αὐτοί强调收信人也参与庆祝；译文采用流畅的现代汉语表达。
- source_word: σκηνοπηγίας
  choice: 住棚节
  rationale: 该词指搭棚居住的节期；“住棚节”是准确、通行且容易理解的中文名称。
- source_word: καὶ τοῦ πυρός
  choice: 和火的节日
  rationale: 希腊文只写“和火的”，结构简略；中文补出与“节”相应的中心语，但不进一步断定该节庆的性质。
- source_word: ὅτε Νεεμίας
  choice: 那火是在尼希米……时出现的
  rationale: ὅτε直译为“当……时”。为使中文句法完整，并联系后续上下文所叙之火，译文将其理解为对“火”的时间性说明；此处理解仍在脚注中提示原文的压缩结构。
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: 建造圣殿和祭坛
  rationale: οἰκοδομέω本义为“建造”。尽管历史背景可能使人理解为“重建”，原词本身没有显明的“重新”成分。
- source_word: ἀνήνεγκεν θυσίας
  choice: 献上祭物
  rationale: ἀναφέρω在祭祀语境中表示献上；θυσίαι可指所献的祭物或祭祀，译作“献上祭物”符合中文圣经语体。
theological_decisions:
- issue: σκηνοπηγίας的节期名称
  choice: 住棚节
  alternative: 搭棚节；帐棚节
  rationale: “住棚节”直接传达该节期的核心意象，也是现代中文中最通行的称呼，不依赖特定宗派解释。
- issue: καὶ τοῦ πυρός的省略结构
  choice: 和火的节日
  alternative: 和火；火节
  rationale: 原文表达简略，并未明确说明“火”的庆典究竟如何命名或举行。正文只补出汉语所需的“节日”，脚注保留其含混性，不把后文故事的细节强加进正文。
- issue: ὅτε从句与“火”的关系
  choice: 将其表达为火出现的历史时刻
  alternative: 直译为“当尼希米……献祭时”而不补明主语关系
  rationale: 希腊文从句紧接“火”，后续语境也讲述尼希米献祭时的火。中文需要较明确的衔接，但脚注说明原文只是简略地说“当……时”，避免把推断伪装成完全明说。
- issue: 尼希米“建造”或“重建”圣殿和祭坛
  choice: 建造
  alternative: 重建
  rationale: 历史背景可能支持“重建”的理解，但οἰκοδομήσας形式本身只说“建造”；正文保留源文措辞，并在脚注交代可能理解。
translation_notes:
  register: 采用现代、庄重而通俗的普通话书面语。“洁净礼”“献上祭物”保留经文的礼仪语境，但避免过度古雅。原文“和火的”及其后ὅτε从句结构紧缩，正文作最低限度的汉语补足，并用脚注明确保留歧义。所给希腊文内容与通常编号的《马加比二书》1:18相符，而非2:9；本稿严格翻译所提供的希腊文，未擅自改换为另一节经文。
