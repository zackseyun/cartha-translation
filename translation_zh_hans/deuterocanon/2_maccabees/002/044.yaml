base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/044.yaml
  text: But God[a], who saved all his people and gave his inheritance to all, and the kingship, and the priesthood, and the sanctification[c][b],
translation:
  language: zh_hans
  text: 但上帝拯救了他的全体子民，又把他的产业赐给[a]众人，也赐下王权[b]、祭司职分和圣洁[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赐给”也可译作“归还给”或“恢复给”；原词可含把原有之物交还、恢复的意思。
    reason: lexical_alternative
  - marker: b
    text: “王权”也可译作“王国”；原词可指君王的权柄、王室尊荣或国度。
    reason: lexical_alternative
  - marker: c
    text: “圣洁”也可译作“成圣”或“分别为圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ θεός
  choice: 但上帝
  rationale: δέ承接上文，同时可带轻微转折；“但上帝”在本句未完的上下文中自然保留这一连接作用。
- source_word: ὁ σώσας τὸν πάντα λαὸν αὐτοῦ
  choice: 拯救了他的全体子民
  rationale: 不定过去时分词表示已经成就的拯救行动；“全体子民”体现τὸν πάντα λαόν的整体性。
- source_word: ἀποδοὺς
  choice: 赐给
  rationale: ἀποδίδωμι既可指给予，也可指归还、恢复；正文采用较宽泛自然的“赐给”，另以脚注保留恢复之意。
- source_word: τὴν κληρονομίαν αὐτοῦ
  choice: 他的产业
  rationale: 保留希腊文单数属格代词最直接的形式，让“他的”首先回指上帝，而不改写为解释性的“他们的产业”。
- source_word: πᾶσιν
  choice: 给众人
  rationale: 保留与格复数的分配意义，所指自然承接“他的全体子民”。
- source_word: τὸ βασίλειον
  choice: 王权
  rationale: 在与祭司职分和圣洁并列的清单中，抽象的王权或王室权柄比领土意义的“王国”更贴合，同时以脚注保留另一可能。
- source_word: τὸ ἱεράτευμα
  choice: 祭司职分
  rationale: 表达制度性或职务性的祭司身份，在现代汉语中比单说“祭司”更准确。
- source_word: τὸν ἁγιασμόν
  choice: 圣洁
  rationale: ἁγιασμός可指圣洁、成圣或分别为圣；在这一恩赐清单中，“圣洁”自然庄重，并避免把原词限定为过程。
theological_decisions:
- issue: “他的产业”中物主代词的指向
  choice: 保留“他的产业”，让“他的”在语法上回指上帝
  alternative: 按上下文解释为“他们的产业”
  rationale: αὐτοῦ为单数，最直接的先行词是θεός。直译保留产业属于上帝而由他赐予子民的张力，不替读者消解其可能含义。
- issue: βασίλειον的含义
  choice: 王权
  alternative: 王国
  rationale: 该词可表示王权、王室尊荣或王国；与“祭司职分”和“圣洁”并列时，“王权”较能保持制度性和抽象性，但“王国”仍属可能译法。
- issue: ἁγιασμός的含义
  choice: 圣洁
  alternative: 成圣；分别为圣
  rationale: 原词可强调圣洁状态、成为圣洁的过程或奉献归圣。正文不把它限定为某一种系统神学含义，并在脚注列出其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“上帝”“子民”“产业”“祭司职分”等词保持经文语域。原文在此以逗号延续下一节，译文也保留未完句式。所有脚注标记均紧随其所说明的词语。
