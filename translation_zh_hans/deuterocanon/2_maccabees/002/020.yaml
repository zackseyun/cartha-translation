translation:
  language: zh_hans
  text: 求你把你的子民栽植在你圣洁之处[a][b]，正如摩西所说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文似乎与《马加比二书》2:20通常所处的语境不符；因此，本译文直接依照现存的希腊文措辞翻译，并未按预期语境重构经文。
    reason: textual_variant
  - marker: b
    text: “栽植”也可译作“安置”或“使……扎根”。希腊语动词采用栽种的比喻，也可含有使之稳固安顿的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταφύτευσον
  choice: 栽植
  rationale: 这是καταφυτεύω的简单过去时命令式，含有“栽种、使扎根”的意象。“栽植”既保留比喻，也能表达使子民安顿稳固之意；句首加“求你”使祈求语气在现代汉语中自然明确。
- source_word: τὸν λαόν σου
  choice: 你的子民
  rationale: λαός指一个群体或民族，在此具有归属于受呼求者的意味。“你的子民”自然保留这种关系，又不把词义限定为现代政治意义上的“国家”。
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: 在你的圣洁之地
  rationale: τόπος是“地方、所在”，ἅγιος说明其为圣。“圣洁之地”保留地点及神圣属性，同时避免用“圣所”将其过度限定为建筑或圣殿，也不擅自译成“圣地／圣地国土”。介词εἰς与“栽植”连用，在汉语中自然译作“在”。
- source_word: καθὼς εἶπεν
  choice: 正如……所说的
  rationale: 保留καθώς的比较关系和λέγω的普通陈述义；这一表达符合现代庄重汉语。
- source_word: Μωσῆς
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 所提供希腊文本与《马加比二书》2:20通常语境明显不符
  choice: 直接翻译所提供的现存希腊语句，将其呈现为独立的祈求，不依据预期上下文补写或改构文本。
  alternative: 根据其他版本或通常的章节内容重构《马加比二书》2:20。
  rationale: 原文证据优先于英语咨询层及预期语境。鉴于资料明确标注重大不匹配，正文忠实反映所给希腊文，并以脚注公开说明问题，而不暗中消除文本张力。
- issue: καταφύτευσον的比喻是否保留
  choice: 保留“栽植”的种植意象。
  alternative: 译为“安置”或“使……安居”。
  rationale: 原词既可表达栽种，也可引申为稳固安置。正文保留鲜明意象，脚注提供自然的引申理解，不将潜在神学意涵单一化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“求你”呈现祈求式命令的语用效果；“栽植”有意保留原文比喻。“圣洁之地”避免将τόπος具体化为圣殿建筑或整片圣地。正文中的[a]、[b]与脚注逐一对应。
