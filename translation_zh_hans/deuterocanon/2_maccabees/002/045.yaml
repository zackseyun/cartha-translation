base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/045.yaml
  text: just as he promised through the law[a]. For we hope in God that he will soon have mercy on us and gather us from under heaven into the holy place[c][b]; for he rescued us from great evils and cleansed the place.
translation:
  language: zh_hans
  text: 正如他借着律法所应许的。因为我们盼望上帝会很快怜悯我们，把我们从普天之下[a]招聚到圣地[b]；他已经把我们从极大的灾祸[c]中救出来，并洁净了那地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “普天之下”也可译作“天底下各处”；这里指流散各地。
    reason: lexical_alternative
  - marker: b
    text: 即耶路撒冷的神圣地点；按上下文，所指是圣殿区域。
    reason: cultural_note
  - marker: c
    text: “极大的灾祸”也可译作“重重灾祸”“极大的患难”或“种种恶事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἐπηγγείλατο διὰ τοῦ νόμου
  choice: 正如他借着律法所应许的
  rationale: καθώς保留“正如”的比较意味；διά加属格表示应许借律法传达，故译“借着律法”。
- source_word: ἐλπίζομεν γὰρ ἐπὶ τῷ θεῷ
  choice: 因为我们仰望上帝，相信
  rationale: 该结构表示把盼望寄托于上帝；汉语用“仰望上帝，相信……”可自然引出后面的ὅτι从句，并保留信赖意味。
- source_word: ταχέως ἡμᾶς ἐλεήσει
  choice: 他很快就会怜悯我们
  rationale: ταχέως在未来语境中指不久、很快；ἐλεέω直译为“怜悯”。
- source_word: ἐπισυνάξει
  choice: 招聚
  rationale: 此词表示聚集到一处，并带有流散者重新归聚的意味；“招聚”兼顾行动主体与复归语境。
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν
  choice: 从普天之下
  rationale: 原文表达略有省略，指从天底下各处、即流散之地而来；“普天之下”保留原有天地意象，又符合现代汉语。
- source_word: εἰς τὸν ἅγιον τόπον
  choice: 到圣地
  rationale: τόπος是“地方、地点”，ἅγιος表明其神圣性质；“圣地”避免在正文中直接增译为“圣殿”，同时自然表达归回的目的地。
- source_word: ἐξείλατο
  choice: 已经救……脱离
  rationale: 中动态常指从危险或困境中拯救、解救；不定过去时在此回顾已完成的拯救。
- source_word: ἐκ μεγάλων κακῶν
  choice: 脱离了重重灾祸
  rationale: κακά可指恶事、患难或灾祸；本语境侧重群体经历的严重苦难，“重重灾祸”自然且不把它限于道德之恶。
- source_word: τὸν τόπον ἐκαθάρισεν
  choice: 洁净了那地方
  rationale: καθαρίζω意为洁净；τόπος仍译“地方”，不用更具体的“圣殿”，以保持原文措辞。
theological_decisions:
- issue: “圣地”及“那地方”所指为何
  choice: 正文按τόπος译作“圣地／那地方”，不直接解释为“圣殿”
  alternative: 圣所；圣殿；圣殿区域
  rationale: 上下文很可能指耶路撒冷的神圣地点、尤其圣殿区域，但希腊文使用较宽泛的τόπος。正文保留其词义范围，脚注说明具体语境。
- issue: 未来的招聚与过去的拯救之间的时态张力
  choice: 分别译为“会……招聚”和“已经救……并洁净”
  alternative: 把全句统一处理为未来行动或一般性陈述
  rationale: 原文先用未来时表达所盼望的怜悯与招聚，随后用不定过去时陈述已经发生的拯救与洁净；译文保留这种时间层次，不将两者调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仰望上帝”“怜悯”“招聚”“洁净”保留经文的信仰语域，但避免古奥表达。脚注标记依其实际所释词组排列为[a]、[b]、[c]。
