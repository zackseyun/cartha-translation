base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/054.yaml
  text: For just as it is not easy for one who prepares a banquet[a], or even seeks the benefit of others, yet for the gratitude of the many we will gladly endure the hardship[b];
translation:
  language: zh_hans
  text: 正如无论是预备筵席[a]，还是谋求他人的益处，都不是容易的事；不过，为了许多人的感激[b]，我们仍甘愿承受这辛劳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盛宴”；该希腊词可指宴席或饮宴聚会。
    reason: lexical_alternative
  - marker: b
    text: “许多人的感激”指许多读者的感谢或感激，并非专门的圣礼术语。
    reason: cultural_note
lexical_decisions:
- source_word: καθάπερ
  choice: 正如
  rationale: 保留比较和承接上文的作用，符合现代汉语表达。
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: 预备筵席
  rationale: 以自然简洁的汉语表达为宴饮聚会作准备；συμπόσιον在此适合译作“筵席”，不过度突出饮酒。
- source_word: ἢ καὶ ζητοῦντι τὴν ἑτέρων ὠφέλειαν
  choice: 甚至谋求使别人得益
  rationale: ἢ καὶ在此加强并扩展类比，译作“甚至”；ὠφέλεια表达益处、裨益。
- source_word: οὐκ εὐχερές
  choice: 都不是容易的事
  rationale: 按汉语句法补出判断结构，准确表达事情并不轻省。
- source_word: ὅμως
  choice: 不过
  rationale: 清楚标示困难与甘愿承担之间的让步转折。
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: 为了众人的感谢
  rationale: 保留διά在此可表达的缘由或所着眼的结果，并将εὐχαριστία理解为许多读者的感谢，而非礼仪术语。
- source_word: ἡδέως
  choice: 甘愿
  rationale: 既表达乐意，也与“承受辛劳”自然搭配。
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: 我们仍甘愿承受这番辛劳
  rationale: ὑποίσομεν表示将要承担，κακοπάθεια在写作语境中指艰苦劳作；“这番辛劳”避免误解为逼迫或灾难。
theological_decisions:
- issue: εὐχαριστία的含义
  choice: 一般意义上的感谢、感激
  alternative: 礼仪或圣礼意义上的“感恩”
  rationale: 本段是作者谈论编写工作及读者反应的序言语境，没有证据表明这里采用后来的专门礼仪含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留原文的类比、转折和复数第一人称，也保留“为了众人的感谢”中缘由与所期待结果之间的轻微张力。
