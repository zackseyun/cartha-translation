base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/024.yaml
  text: But when the matter became known[a], and it was reported to the king of the Persians that in the place where the priests who had been taken away had hidden the fire, water appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: zh_hans
  text: 但这件事传开后，有人禀报波斯王说：在那些被带走的祭司[a]藏火之处，水出现了；尼希米和他的同伴[c]也取那水[b]洁净了祭物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被带走”也可译作“被迁走”“被掳走”或“流亡的”；原文只明确表示这些祭司被移离原处。
    reason: lexical_alternative
  - marker: b
    text: “取那水”原文直译为“从那水”；这里既可着重表示水的来源，也可按语意理解为“用那水”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“尼希米周围的人”，是指与尼希米有关联的一群人；中文译作“尼希米和他的同伴”使其符合汉语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: 这件事传开以后
  rationale: 表达事情从隐而显、为人所知的结果；现代汉语自然，也符合后文消息被禀报的叙事语境。
- source_word: διηγήθη τῷ βασιλεῖ τῶν Περσῶν
  choice: 有人禀报波斯王说
  rationale: 希腊文为被动式，未说明报告者；汉语用不定主语“有人”避免误指，同时“禀报”适合向君王正式陈述的语境。
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: 那些被迁走的祭司
  rationale: μεταχθέντες 表示被移离原处；“被迁走”保留被动与迁离之意，却不把原因明确限定为流放或强制遣送。
- source_word: τὸ ὕδωρ ἐφάνη
  choice: 出现了水
  rationale: 贴近“水显现、出现”的原文，不改译为“发现了水”。
- source_word: ἀφʼ οὗ
  choice: 取那水
  rationale: 在汉语中自然表达水作为洁净行为的来源或所用之物；脚注保留介词短语在来源与工具之间的细微开放性。
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: 尼希米和他的同伴
  rationale: 这是以领袖为中心指其所属群体的希腊语惯用语；此译比直译“尼希米周围的人”自然，且不额外限定成员身份。
- source_word: ἥγνισαν τὰς θυσίας
  choice: 洁净了祭物
  rationale: 保留 ἁγνίζω 的礼仪性洁净含义；“祭物”准确对应 θυσίαι 在此处的献祭供物。
theological_decisions:
- issue: 水与洁净祭物之间的关系
  choice: 正文译作“取那水洁净了祭物”，并以脚注说明原文的来源式表达
  alternative: “从那水中洁净了祭物”或“用那水洁净了祭物”
  rationale: ἀφʼ οὗ 字面是“从那水”，上下文可理解为水的来源，也可在实际动作上具有工具意味；正文采用自然汉语，脚注避免把语义过度锁定。
- issue: ἥγνισαν 对祭物所表示的礼仪行动
  choice: 洁净了祭物
  alternative: 使祭物成圣；洁净了献祭礼仪
  rationale: 原文直接以“祭物”为宾语，并使用礼仪洁净动词；不将其改释为成圣，也不把宾语扩大为整个献祭仪式。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“禀报”体现向君王报告的正式场景；“洁净”“祭物”保留礼仪语域。所有脚注标记均置于相关句末。
