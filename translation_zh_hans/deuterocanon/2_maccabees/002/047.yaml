lexical_decisions:
- source_word: ἔτι τε
  choice: 以及
  rationale: 承接上文列举，表达继续增列一项；“以及”在现代汉语中简洁自然。
- source_word: τοὺς ... πολέμους
  choice: 战争
  rationale: πολέμους广指战争或军事冲突；“战争”最直接，也符合此处概述事件的语体。
- source_word: πρὸς
  choice: 与……之间的
  rationale: 与πολέμους连用时表示敌对冲突的对象；汉语用“与……之间的战争”自然表达双方交战，同时不额外指定主动方。
- source_word: Ἀντίοχον τὸν Ἐπιφανῆ
  choice: 安条克·以比法尼
  rationale: 按历史人物通行音译处理君王姓名及称号，不把Ἐπιφανῆ解释性译为“显赫者”等。
- source_word: τὸν τούτου υἱὸν Εὐπάτορα
  choice: 他儿子欧帕托
  rationale: τούτου回指安条克，保留明确的父子关系；此处无须添加同位语逗号。
