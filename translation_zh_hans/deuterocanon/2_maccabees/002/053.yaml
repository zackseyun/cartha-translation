  yaml_path: translation/deuterocanon/2_maccabees/002/053.yaml
  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but one of sweat and sleeplessness;
translation:
  language: zh_hans
  text: 至于我们这些为编写这部节本而辛劳[a]的人，这项工作并不容易，而是需要汗水和不眠；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“显示出编写这部节本之辛劳的人”。希腊文此处的表达带有习语性；按上下文，是指承担并经受编写节本所需的劳苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν μὲν τοῖς
  choice: 至于我们这些……的人
  rationale: 以话题结构表达与格所指的作者群体，并保留 μέν 所带出的对照铺垫。
- source_word: τὴν κακοπάθειαν ἐπιδεδειγμένοις
  choice: 承担了……之辛劳
  rationale: ἐπιδεδειγμένοις 字面可指“显明、表现”，与 κακοπάθεια 连用时在此语境中指投入并承受艰苦；译文采用自然汉语表达，同时不把它具体化为受迫害。
- source_word: τῆς ἐπιτομῆς
  choice: 编写这部节本
  rationale: ἐπιτομή 指将较长著作删节编成的作品；“节本”简洁准确，“编写”点明此处谈的是制作节本的劳动。
- source_word: οὐ ῥᾴδιον
  choice: 并不容易
  rationale: 直接保留原文对工作难度的判断，符合现代汉语表达。
- source_word: ἱδρῶτος δὲ καὶ ἀγρυπνίας
  choice: 而是要流汗、熬夜的
  rationale: 保留“汗”和“不眠”的具体意象；“熬夜”较自然地表达因工作而保持清醒、不得睡眠。
- source_word: τὸ πρᾶγμα
  choice: 这项工作
  rationale: πρᾶγμα 在上下文中指编写节本这一事务，“工作”自然且明确。
