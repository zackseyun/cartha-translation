    reason: lexical_alternative
  - marker: c
    text: 本节所给希腊语原文被标注为与经文位置存在重大不匹配；本译文直接依据所提供的希腊语措辞翻译，仍应与校勘本核对。
    reason: textual_variant
  revision_rationale: 修订使两个希腊语分词（“围住”及“考察／检验此事”）共同作为主要动作“建造一座圣所”的先行动作，并将ἱερὸν ἐποίησεν按其直接宾语结构译出。保留“那里”以承接原文未明说而须由上下文确定的受围地点；“考察过这事”保留δοκιμάζω可指考察、检验而不必然表示批准的语义。
