lexical_decisions:
- source_word: περιφράξας
  choice: 把那里围起来
  rationale: 该不定过去时分词表示围住或圈护。译文保留先围起、后设为圣所的动作次序，同时不具体断定所用的是围栏、城墙还是防御工事。
- source_word: ἱερὸν
  choice: 一处圣所
  rationale: ἱερόν可泛指神圣场所、圣域或庙宇；“一处圣所”符合无冠词形式，也避免无根据地把它限定为某一特定圣殿。
- source_word: ἐποίησεν
  choice: 使它成为
  rationale: ποιέω语义宽泛；这里可表示建造、设立或指定为圣所。“使它成为”保留这种开放性，并自然表达宾语补足关系。
- source_word: δοκιμάσας
  choice: 已经检验过
  rationale: δοκιμάζω可指试验、考察或经检验后认可。“检验过”明确保留考验过程，却不强行加入原文未明说的批准结果。
- source_word: τὸ πρᾶγμα
  choice: 这事
  rationale: πρᾶγμα在此含义宽泛，可指事情、情况或事项。“这事”符合现代汉语表达，并保留指称的不确定性。
