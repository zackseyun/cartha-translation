translation:
  language: zh_hans
  text: 古利奈人雅松在五卷书中所陈述的内容，我们将尝试把它缩编[a]成一卷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “缩编”也可译作“节编”或“浓缩”。希腊文动词指把篇幅较大的著作编成较短的版本。
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλωθέντα
  choice: 所叙述的事
  rationale: 该分词在这里指雅松著作中陈述、呈现的内容；“所叙述的事”符合历史著作的语境，也比直译为“所说明的”更自然。
- source_word: διὰ πέντε βιβλίων
  choice: 在五卷书中
  rationale: διά加属格在此表示作品借以呈现的文学载体或篇幅；“在五卷书中”准确而自然。
- source_word: πειρασόμεθα
  choice: 我们要尝试
  rationale: 保留将来时所表达的写作计划，也传达作者自谦、谨慎的语气。
- source_word: διʼ ἑνὸς συντάγματος
  choice: 为一卷
  rationale: σύνταγμα指编排成篇的书面作品；结合与“五卷书”的对照，译作“一卷”最简洁自然。
- source_word: ἐπιτεμεῖν
  choice: 删节
  rationale: 该动词指把篇幅较大的作品缩短、节编；“删节”准确体现制作简本的文学行为。
- source_word: ὑπὸ Ἰάσονος τοῦ Κυρηναίου
  choice: 古利奈人雅松
  rationale: 保留人物名及其地域称谓；“古利奈人雅松”是自然、简洁的现代汉语表达。
