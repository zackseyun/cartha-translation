  yaml_path: translation/deuterocanon/2_maccabees/002/036.yaml
  text: And it was also made clear that[a], as one having wisdom[b], he offered a sacrifice for the dedication and completion of the sanctuary.
translation:
  language: zh_hans
  text: 又清楚地说明了：他作为有智慧的人，为圣所的奉献[a]和完成[b]献上了祭物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“重新奉献”；历史背景可能指圣所得到重新奉献，但希腊原文只说“奉献”。
    reason: lexical_alternative
  - marker: b
    text: 或译“祝圣”；原词也可带有礼仪含义，指使圣所达到完整的神圣状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσαφείτο
  choice: 清楚说明了
  rationale: 该未完成时被动形式表示事情得到清楚阐明；汉语用“清楚说明了”既自然，也保留原词的解释意味。
- source_word: ὡς σοφίαν ἔχων
  choice: 他如何凭着智慧
  rationale: ὡς在此可承接“说明”，引出“如何”；σοφίαν ἔχων直译为“具有智慧”，译作“凭着智慧”更符合现代汉语，同时不把其作用限定为严格的因果关系。
- source_word: ἀνήνεγκεν
  choice: 献上
  rationale: ἀναφέρω在祭祀语境中通常指献上祭物。
- source_word: θυσίαν
  choice: 祭物
  rationale: θυσία可指祭或所献的祭物；与“献上”搭配时，“祭物”在汉语中清楚自然。
- source_word: ἐγκαινισμοῦ
  choice: 奉献
  rationale: 该词指启用或奉献礼。历史背景可能是重新奉献，但原词本身未明确表达“重新”，故正文保留较宽泛的“奉献”。
- source_word: τελειώσεως
  choice: 完工
  rationale: 该词的基本含义是完成、达到完整状态；在圣所语境中也可能带有礼仪性的祝圣含义，正文采用“完工”，另以脚注保留该可能性。
- source_word: τοῦ ἱεροῦ
  choice: 圣所
  rationale: ἱερόν指神圣场所或圣殿范围；“圣所”保留其神圣空间的含义，又不将范围过度限定。
theological_decisions:
- issue: τελειώσεως是否具有礼仪性的祝圣含义
  choice: 完工
  alternative: 圣所的祝圣
  rationale: 正文保留“完成”的基本词义，不将礼仪技术含义定为唯一解释；脚注说明其可能指使圣所达到完整的神圣状态。
- issue: ἐγκαινισμοῦ是否明确指重新奉献
  choice: 奉献
  alternative: 重新奉献
  rationale: 马加比时期的历史背景支持“重新奉献”，但希腊词在本句中只明确表达“奉献”，因此不在正文中加入“重新”。
- issue: ὡς σοφίαν ἔχων的句法关系
  choice: 他如何凭着智慧
  alternative: 因为他有智慧；作为有智慧的人
  rationale: ὡς可与前面的“说明”结合，引出“如何”；分词短语表达伴随方式。此译法避免把它过早限定为因果或身份比较。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“献上祭物”保留祭祀语境；两处脚注分别紧随其所解释的“奉献”和“完工”，避免标记错位。
