  rationale: 修订使ὡς σοφίαν ἔχων作为对献祭者的限定语得到直接呈现，避免把原文未明说的“如何”加入句中，也避免将其固定为单纯工具性关系。“完成”保留τελείωσις的基本意义及其可能的礼仪性涵义；两处脚注仍紧随所释词语，且不将历史上的重新奉献读入正文。
