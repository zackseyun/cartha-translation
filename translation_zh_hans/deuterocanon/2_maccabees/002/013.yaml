base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/013.yaml
  text: But when it happened that time had passed and the sun shone out[a], though it had been overcast, a great fire was kindled, so that everyone marveled.
translation:
  language: zh_hans
  text: 后来，过了一段时间，太阳虽被云遮蔽，却发出光来[a]，一团大火便燃了起来，众人无不惊叹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“太阳在云层密布时发出光来。”希腊语直译为“太阳发出光来，是有云的／被云遮蔽的”。
    reason: 保留ἐπινεφὴς ὤν可理解为同时状态、而非明确让步关系的可能。
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο καὶ χρόνος διῆλθεν
  choice: 后来，过了一段时间
  rationale: 以自然的现代汉语表达叙事转折和时间的推移；不逐字重复希腊语中较为迂回的“事情发生、时间过去”结构。
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: 太阳……发出光来
  rationale: ἀναλάμπω表示发亮、放射光芒；“发出光来”既准确，又符合乌云背景下阳光显现的语境。
- source_word: ἐπινεφὴς ὤν
  choice: 虽被云遮蔽
  rationale: 该短语直指有云、阴云笼罩的状态。正文采用合乎语境的让步表达，同时用脚注保留其也可按同时状态理解的语法可能。
- source_word: ἀνήφθη πυρὰ μεγάλη
  choice: 一团大火便燃了起来
  rationale: 保留被点燃、燃起之意；“一团大火”是自然、庄重的汉语，不把正文具体化为祭火。
- source_word: ὥστε θαυμάσαι πάντας
  choice: 众人无不惊叹
  rationale: 表达ὥστε所引出的结果以及πάντας的全称范围，语气简洁而有叙事力度。
theological_decisions:
- issue: πυρά是否应明确为祭祀用火
  choice: 正文只译作“大火”
  alternative: “祭火”或“献祭的火”
  rationale: 上下文或与献祭有关，但本句希腊文仅用πυρά，并未明确加上“祭祀”限定；因此不在正文中加入解释性神学信息。
- issue: ἐπινεφὴς ὤν与“太阳发光”的逻辑关系
  choice: 正文采用让步关系：“虽被云遮蔽，却发出光来”
  alternative: 按同时状态较直译为“太阳在云层密布时发出光来”
  rationale: 分词结构本身未明示“虽然”，但让步理解符合叙事情境；脚注保留较直译的同时性读法，避免消除原文的语法张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事体。“无不惊叹”传达全体在场者的反应；避免古奥措辞，也不将“大火”解释性扩写为“祭火”。
