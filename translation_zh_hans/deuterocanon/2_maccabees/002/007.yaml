  text: After opening the secret door in the ceiling[a], they threw stones and struck down the leader, and after cutting them into pieces[c][b], they threw the heads to those outside.
translation:
  language: zh_hans
  text: 他们打开天花板上的暗门[a]，投掷石块，砸死了那首领[b]；随后将他肢解，并把那些头颅[c]扔给外面的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“天花板”的希腊词（φατίνωμα）十分罕见，含义不能完全确定；也可能指镶板顶棚或屋顶层的空间。
    reason: lexical_alternative
  - marker: b
    text: 译作“砸死”的动词语气异常强烈，带有如遭雷霆猛击或击碎的形象。
    reason: lexical_alternative
  - marker: c
    text: 希腊原文在这里说的是复数“头颅”，但前文只提到一位首领，衔接显得突兀，可能反映文本或叙事上的不规则；正文保留了原文的复数。
    reason: textual_variant
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: 打开……后／打开
  rationale: 不定过去时分词表示先于主要动作发生；汉语以顺承句式“打开……，……”自然表达其先后关系。
- source_word: κρυπτὴν θύραν
  choice: 暗门
  rationale: κρυπτήν意为隐藏、隐蔽；“暗门”在现代汉语中简洁自然，也符合建筑场景。
- source_word: τοῦ φατινώματος
  choice: 天花板上的
  rationale: φατίνωμα一词罕见，可能指镶板天花板或屋顶层空间；正文采用较符合此处从上方投石场景的“天花板”，并以脚注保留不确定性。
- source_word: βάλλοντες πέτρους
  choice: 投掷石块
  rationale: 分词说明攻击方式；“投掷石块”忠实而自然，不额外断定投掷方向。
- source_word: συνεκεραύνωσαν
  choice: 砸死了
  rationale: 该罕见动词带有如雷霆击打、猛烈击碎的强烈意味；结合投石及随后肢解的叙事，“砸死了”比泛泛的“击倒”更能传达动作结果与力度。
- source_word: τὸν ἡγεμόνα
  choice: 那首领
  rationale: ἡγεμών可指首领、统治者、长官或总督；上下文未明确具体官职，因此采用范围较宽的“首领”。
- source_word: μέλη ποιήσαντες
  choice: 随后又加以肢解
  rationale: 字面为“做成肢体／碎块”，在此是肢解之意。希腊文省略受事对象，汉语用“加以”避免明确补成单数或复数。
- source_word: τὰς κεφαλάς
  choice: 那些头颅
  rationale: 原文明确使用复数“头颅”；尽管与前文单数“首领”衔接突兀，正文仍保留复数，不擅自改成“他的头”。
- source_word: τοῖς ἔξω
  choice: 给外面的人
  rationale: 带冠词的与格形式指在外面的人，而不仅是方位“外面”；“扔给外面的人”保留其受事关系。
