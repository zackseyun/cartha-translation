translation_notes:
  register: 采用现代、庄重而直接的叙事语言。“暗门”“投掷石块”“肢解”“头颅”均易于普通读者理解，同时保留原文暴力场面的力度。通过“加以肢解”避免替原文补明被肢解者的数目，并用脚注交代罕见建筑词和复数“头颅”的疑难。
