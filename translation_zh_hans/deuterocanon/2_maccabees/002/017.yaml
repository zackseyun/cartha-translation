  yaml_path: translation/deuterocanon/2_maccabees/002/017.yaml
  text: Accept the sacrifice for all your people Israel[b][a], and preserve your portion and sanctify it.
translation:
  language: zh_hans
  text: 求你悦纳为你全体子民以色列所献的祭[a]，保守你的分，并使其成圣。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你收纳为你全体子民以色列所献的供物。”
    reason: πρόσδεξαι 可译“收纳”，θυσία 也可译“供物”；正文采用较具祭祀色彩的“悦纳……祭”。
  - marker: b
    text: “你的分”很可能指属于上帝的以色列民；也可理解为“你的产业”。原文“使其成圣”没有明说宾语，此处承接“你的分”。
    reason: 说明 μερίδα 的隐喻性所指及 καθαγίασον 隐含宾语的语法关系，而不在正文中消除歧义。
lexical_decisions:
- source_word: πρόσδεξαι
  choice: 悦纳
  rationale: 该词在祷告和献祭语境中指求上帝有恩地接受；“悦纳”既自然，也保留礼仪性的正面含义。
- source_word: θυσίαν
  choice: 所献的祭
  rationale: θυσία 指祭物或献祭；译作“所献的祭”明确其祭祀性质，并与前面的“悦纳”自然搭配。
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: 为你全体子民以色列
  rationale: ὑπέρ 加属格在此表达代表或为了其益处；“为”保留这种关系，“全体”准确反映 παντός 的集合意义。
- source_word: διαφύλαξον
  choice: 保守
  rationale: 该动词意为护卫、保存，使之安全；“保守”符合向上帝祈求的庄重语体。
- source_word: τὴν μερίδα σου
  choice: 你的分
  rationale: μερίς 的基本意义是所分得的一份。“你的分”保留原文隐喻，不直接把它解释为“产业”或“子民”。
- source_word: καθαγίασον
  choice: 使其成圣
  rationale: 该动词意为使成为圣洁或分别为圣；“使其成圣”保留神圣语域。代词“其”承接单数的“你的分”。
theological_decisions:
- issue: “你的分”（τὴν μερίδα σου）的所指
  choice: 正文保留“你的分”这一隐喻，语境上可指属于上帝的以色列民。
  alternative: 你的产业；归你为业的子民
  rationale: 希腊文没有明说“产业”或“子民”。保留“分”可避免在正文中消除原有隐喻及其盟约含义，同时由脚注说明可能所指。
- issue: καθαγίασον 的隐含宾语
  choice: 译为“使其成圣”，让“其”承接前面的“你的分”。
  alternative: 使他们成圣；使它分别为圣
  rationale: 希腊文省略宾语，最自然的语法承接是前面的单数“分”；但若“分”实指以色列民，意义上也包含使子民成圣。译文维持语法形式与所指之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“悦纳”“保守”“成圣”保留经文的礼仪和神圣语域；“你的分”刻意保持原文简洁且略带陌生感的隐喻。
