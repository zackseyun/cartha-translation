base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/058.yaml
  text: But the pursuit of brevity in expression[a], and the refusal of an elaborate treatment of the subject, should be allowed to one who is making an abridgment.
translation:
  language: zh_hans
  text: 至于力求措辞简洁、避免对内容作详尽铺陈，应当允许编写节本的人这样做[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “编写节本的人”：原文也可译作“从事翻译的人”，因为μετάφρασις较常见的意思是“翻译”；但这里的上下文更支持“缩编”或“编写节本”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντομον
  choice: 简洁
  rationale: 此处带冠词的形容词作名词性用法，指文字表达简明扼要；“简洁”符合现代汉语的文学语境。
- source_word: λέξεως
  choice: 措辞
  rationale: λέξις在这里不是指单个词，而是指用语和表达方式；“措辞”准确传达其文体含义。
- source_word: μεταδιώκειν
  choice: 追求
  rationale: 该不定式表示编写者所力求达到的目标；“追求”保留其主动寻求之意。
- source_word: ἐξεργαστικὸν
  choice: 详尽铺陈
  rationale: 该词表示把内容充分展开、细致处理；“详尽铺陈”与前面的“措辞简洁”形成自然对照。
- source_word: πραγματίας
  choice: 题材
  rationale: 这里指作者正在处理的材料或内容；“题材”比“事务”更契合序言中的著述语境。
- source_word: παραιτεῖσθαι
  choice: 不……作
  rationale: 该中动态不定式表示谢绝、避开或放弃；在汉语中用“不对题材作详尽铺陈”自然表达有意省略详述。
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: 编写节本的人
  rationale: 结合上下文，本书序言所说的是把较长著作缩编成较短文本，而非跨语言翻译；“编写节本”清楚体现这种工作。
- source_word: συγχωρητέον
  choice: 应当准许
  rationale: 该动词性形容词表达应予认可或容许的义务色彩；“应当准许”保留其非人称、规范性的语气。
theological_decisions:
- issue: μετάφρασις在本节中的含义
  choice: 节本、缩编
  alternative: 翻译
  rationale: 虽然μετάφρασις可指翻译，但《马加比二书》序言的上下文明确谈论将古利奈人雅松的长篇著作压缩重编，因此正文采用“节本”；脚注保留常见词义“翻译”，不把词义上的真实可能性完全隐去。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“措辞简洁”与“详尽铺陈”保持原文的文体对照；“至于……这一点”承接上下文，并呈现希腊文句子的论述语气。
