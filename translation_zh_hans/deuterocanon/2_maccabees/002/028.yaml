translation:
  language: zh_hans
  text: 我们把每一事项详加处理的工作留给作者；自己则勉力[a]按照这部节本的纲要编写。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己则费力地沿着这部节本勾勒出的线索编写。”希腊原文措辞紧凑；ἀτονοῦντες含有艰难用力、劳力的意味，ὑπογραμμοῖς可指纲要或勾勒出的线条。
    reason: 保留ἀτονοῦντες所表达的劳力意味，以及ὑπογραμμοῖς的“纲要／勾勒线条”双重形象。
lexical_decisions:
- source_word: διακριβοῦν περὶ ἑκάστων
  choice: 逐项详加考订
  rationale: διακριβόω兼有精确查考和细致处理之意；“逐项详加考订”既保留准确、详尽的意味，也符合历史著述的语境。
- source_word: τῷ συγγραφεῖ παραχωρήσαντες
  choice: 留给原著者
  rationale: παραχωρέω表示把某项工作留归他人，συγγραφεύς指这部节本所依据之较长著作的作者；“原著者”可清楚区别于缩编者。
- source_word: ἐπιπορεύεσθαι
  choice: 依循……行文
  rationale: 该词本指沿着某物前行，与ὑπογραμμοῖς连用形成比喻；“依循……行文”自然表达按既定线索推进缩编工作的意思。
- source_word: τοῖς ὑπογραμμοῖς
  choice: 框架
  rationale: ὑπογραμμός可指勾勒出的线条、轮廓或供人依循的范式；在节编语境中，“框架”比直译“勾勒线”自然，同时保留只循主要脉络而不尽录细节之意。
- source_word: τῆς ἐπιτομῆς
  choice: 这部节本
  rationale: ἐπιτομή是由较长著作缩编而成的作品。“节本”保留其文学技术含义，也比“概要”更能表明这是经过删节编成的文本。
- source_word: ἀτονοῦντες
  choice: 勉力
  rationale: ἀτονέω通常涉及乏力、疲惫或力有不逮；此处压缩的表达着重缩编者为依循节本框架而付出的艰苦努力。“勉力”既传达用力而为，也不把词义过度确定为单纯的“谨慎”。
