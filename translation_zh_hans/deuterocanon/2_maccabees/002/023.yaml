  yaml_path: translation/deuterocanon/2_maccabees/002/023.yaml
  text: And when this happened[a], a flame was kindled; but when the light from the altar shone forth, it was consumed.
translation:
  language: zh_hans
  text: 当这事发生时，火焰燃了起来；但祭坛发出的光照耀时，便被耗尽了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句没有明说“被耗尽”的是什么；可能指火焰，也可能指祭物、被焚烧的物质或上文提到的液体。“照耀”所译的词也可含有“回照”或“相应发光”的意思。
    reason: 保留末尾被动动词主语及ἀντιλάμπω具体含义的不确定性。
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: 这事发生时
  rationale: 将时间性的属格独立结构自然译出；“发生”准确表达事件的出现，不使用古奥措辞。
- source_word: φλὸξ ἀνήφθη
  choice: 火焰燃了起来
  rationale: φλόξ是单数“火焰”，ἀνήφθη为被动，表示被点燃或燃起；汉语用“燃了起来”自然地保留起火之意。
- source_word: ἀπὸ τοῦ θυσιαστηρίου
  choice: 祭坛发出的
  rationale: 该介词短语修饰“光”，表示光来自祭坛；“祭坛”足以表达θυσιαστήριον，无须增添解释性限定。
- source_word: ἀντιλάμψαντος φωτός
  choice: 光一照耀
  rationale: ἀντιλάμπω可含相对、回应或反照的意味，但此处具体图景不明；正文采用自然的“照耀”，不武断指定为反射或回照。
- source_word: ἐδαπανήθη
  choice: 火焰就熄灭了
  rationale: 该被动动词意为被耗尽、消耗殆尽。依据最近的显性单数名词φλόξ，正文以“火焰”为省略主语，并按汉语火焰语境译作“熄灭”；原文主语未明的情况在脚注说明。
theological_decisions:
- issue: 末尾被动动词ἐδαπανήθη的所指
  choice: 正文以“火焰”为其省略主语
  alternative: 也可能指被焚烧的物质、祭物，或上文所述的液体
  rationale: 希腊文没有明说主语；从本节句法看，最近的单数名词φλόξ是最简约的所指，但不能据此排除上下文中的其他对象，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号保留原文两阶段事件的对照；避免用“反射”“回闪”等词过度限定光的性质。
