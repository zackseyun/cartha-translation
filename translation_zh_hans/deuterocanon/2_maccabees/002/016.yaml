  yaml_path: translation/deuterocanon/2_maccabees/002/016.yaml
  text: the only provider, the only righteous one and almighty and eternal, the one who rescues Israel from every evil, who made the fathers chosen and sanctified them;
translation:
  language: zh_hans
  text: 你是唯一的赐予者[a]，唯一公义、全能、永恒的那一位；你救以色列脱离一切祸患[b]，拣选了列祖，又使他们分别为圣[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赐予者”也可译作“供给者”或“施惠者”。
    reason: lexical_alternative
  - marker: b
    text: “一切祸患”也可译作“一切邪恶”或“一切灾难”。
    reason: lexical_alternative
  - marker: c
    text: “使他们分别为圣”也可译作“使他们成为圣洁”或“使他们成圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μόνος χορηγός
  choice: 唯一的供应者
  rationale: χορηγός指供应、赐予所需之物者；“供应者”既保留称号形式，也不把含义收窄为现代社会关系中的“赞助人”。
- source_word: ὁ μόνος δίκαιος
  choice: 唯一公义的那一位
  rationale: δίκαιος在此作为指称上帝的实体性形容词；“公义”兼顾道德正直与施行正义的含义。
- source_word: παντοκράτωρ
  choice: 全能
  rationale: 这是庄严而通行的神圣称号，简洁表达掌管万有、拥有完全权能的含义。
- source_word: αἰώνιος
  choice: 永恒
  rationale: 在神圣属性的并列结构中，“永恒”自然且准确，保留不受时间限制的含义。
- source_word: ὁ διασώζων
  choice: 你救……脱离
  rationale: διασώζω强调使人安全脱离危险；结合末尾第二人称动词ἡγίασας，译成直接向上帝陈述的“你救……脱离”，使中文连贯，同时保留拯救行动的具体感。
- source_word: ἐκ παντὸς κακοῦ
  choice: 脱离一切祸患
  rationale: κακόν可指邪恶、伤害或灾祸；“祸患”适合“救……脱离”的语境，同时以脚注保留较具道德含义的译法。
- source_word: ὁ ποιήσας τοὺς πατέρας ἐκλεκτούς
  choice: 使列祖成为蒙拣选的人
  rationale: 保留ποιέω加宾语补语的“使……成为”结构，也用“蒙拣选”表达列祖是上帝拣选行动的承受者。
- source_word: ἡγίασας αὐτούς
  choice: 又使他们成为圣洁
  rationale: ἁγιάζω可指使之圣洁或分别为圣；此译法现代易懂，并避免仅用术语“圣化”。原文动词为第二人称单数，故译作直接称呼的“你……”。
theological_decisions:
- issue: 神圣称号串列与第二人称动词之间的人称转换
  choice: 把整句译成对上帝的直接称呼：“你是……；你救……又使……”。
  alternative: 严格保留名词性串列，并在末尾突然转为第二人称：“唯一的供应者……拣选列祖的那一位，你又使他们成为圣洁。”
  rationale: 原文前半由带冠词的称号和分词构成，末尾ἡγίασας明确是第二人称单数。中文若照搬会显得断裂；统一采用直接称呼既承认末尾的人称证据，也保留祷告式庄严语气，不改变各项神圣属性。
- issue: ἐκ παντὸς κακοῦ的范围
  choice: 一切祸患
  alternative: 一切邪恶；一切灾难
  rationale: κακόν兼有道德之恶与造成伤害的祸患等含义。正文采用与“救……脱离”自然搭配的广义“祸患”，脚注说明其他可能，避免将其限定为单一类别。
- issue: ἁγιάζω的表达
  choice: 使他们成为圣洁
  alternative: 使他们分别为圣；使他们成圣
  rationale: “成为圣洁”保留上帝使列祖归于圣洁的神学分量，又比术语化的“成圣”更便于普通现代读者理解；“分别为圣”的礼仪性含义列入脚注。
translation_notes:
  register: 采用现代、庄严而可理解的祷告语言。“你”比“祢”更符合现代标准简体中文的一般用字，同时不减损敬意。原文所给希腊文与常见的《马加比二书》2:16内容似有经节对应差异；本稿严格依照所提供的希腊文翻译。
