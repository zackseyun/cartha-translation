base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/034.yaml
  text: But when Jeremiah learned of it[a], he reproved them and said, “The place will remain unknown until God gathers his people together and shows mercy.”
translation:
  language: zh_hans
  text: 耶利米知道这事后，就责备他们说：“这地方必无人知晓，直到上帝把他的子民聚集起来，施下怜悯。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为：“直到上帝聚集百姓的聚集，怜悯也出现。”这里用同根词重复“聚集”，末句则以“怜悯”为语法主语。
    reason: 说明原文特殊句法，并保留末句有关施动者的含混。
lexical_decisions:
- source_word: ὡς δὲ
  choice: ……后，就
  rationale: 在叙事中兼有承接和时间意味；现代汉语用“……后，就”自然表达事件推进，不必生硬译出转折词。
- source_word: ὁ Ἰερεμίας ἔγνων
  choice: 耶利米知道这事
  rationale: 按上下文，所指是耶利米得知前述众人的行动。所给希腊文本中ἔγνων的形式与第三人称主语不协调，但句意明确，因此依叙事句法译为“耶利米知道”。
- source_word: μεμψάμενος αὐτοῖς
  choice: 责备他们
  rationale: 分词表示针对他们的责难或斥责；“责备”保留负面评断，又符合庄重而通顺的现代汉语。
- source_word: ἄγνωστος ὁ τόπος ἔσται
  choice: 这地方必无人知晓
  rationale: 直译为“这地方将是未知的”。“必无人知晓”自然表达其未来持续不为人知的状态，同时不把ἄγνωστος强化为“隐藏”。
- source_word: ἕως ἂν συνάγῃ ὁ θεὸς ἐπισυναγωγὴν τοῦ λαοῦ
  choice: 直到上帝把他的子民聚集起来
  rationale: 希腊文以动词“聚集”和同根名词“聚集”并用，汉语若逐字重复会显得累赘；改用单一动词结构表达其基本意义。“他的”由上帝与“子民”的语境关系补出。
- source_word: ἔλεος γένηται
  choice: 施下怜悯
  rationale: 字面为“怜悯发生／成为”。“施下怜悯”在现代汉语中自然地表达怜悯得以显现，同时由上下文承接上帝的行动。
theological_decisions:
- issue: 末句“怜悯”的施动者
  choice: 以上帝为语境中的施动者，译作“施下怜悯”
  alternative: “怜悯出现”或“怜悯临到”
  rationale: ἔλεος在语法上是γένηται的主语，原文并未直接说“上帝施怜悯”；但前句以上帝为主语，语境自然容许把末句理解为他的行动。脚注保留原文较非人格化的表达，以免掩盖句法张力。
- issue: “百姓／子民”与上帝的关系
  choice: 他的子民
  alternative: 百姓／那人民
  rationale: 希腊文只有定冠词“这／那百姓”，没有所有格；在上帝聚集以色列民的经文语境中，“他的子民”是自然的汉语表达，但所补关系并非原文显式所有格。
translation_notes:
  register: 采用现代、庄重、易懂的书面普通话。“上帝”用于ὁ θεός；“责备”较“斥责”平实而仍保留μεμψάμενος的责难力度。正文适度顺畅化同根词重复，脚注交代希腊文形式和神学上不宜抹平的句法张力。
