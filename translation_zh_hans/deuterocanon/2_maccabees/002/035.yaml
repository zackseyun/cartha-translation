  to: 那时，主必显明这些事[a]；主的荣耀和那云彩[b]也必显现，正如在摩西的事上所显明的那样[c]；也正如所罗门曾祈求使那地方大大成圣[d]。
  rationale: 修订仅纠正“摩西时期”对原文介词短语的时间化限缩，并使所罗门祈求与其目的从句的中文关系更清楚。其余关键术语及特指云彩的表达均予保留。
