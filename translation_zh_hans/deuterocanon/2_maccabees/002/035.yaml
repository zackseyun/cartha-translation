base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/035.yaml
  text: And then the Lord will reveal these things[a], and the glory of the Lord and the cloud will appear, as it was shown in the case of Moses, and as Solomon also asked[d][c][b], that the place might be greatly sanctified.
translation:
  language: zh_hans
  text: 那时，主必显明这些事[a]；主的荣耀和那云彩[b]也必显现，正如在摩西的事上所显明的那样[c]；也正如所罗门曾祈求使那地方大大成圣[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显明”也可译作“揭示”或“显露出来”。
    reason: lexical_alternative
  - marker: b
    text: “那云彩”指与摩西和圣所传统中神圣临在相关、为读者所熟知的云彩。
    reason: cross_reference
  - marker: c
    text: 也可译作“正如向摩西所显明的那样”或“正如在摩西的事上所显明的那样”；此处把将来的显现与摩西相关的先例相比。
    reason: lexical_alternative
  - marker: d
    text: “祈求”也可译作“请求”；“成圣”也可译作“奉献为圣”或“使其圣洁”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναδείξει
  choice: 显明
  rationale: 该动词可指揭示、展示或使隐藏之物显露；“显明”既保留启示意味，也与下文可见的神圣显现相呼应。
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留希腊文指示代词的开放指向，让上下文说明它所指的隐藏圣物及相关事项。
- source_word: ὀφθήσεται
  choice: 必显现
  rationale: 该被动形式在此自然表达“出现、变得可见”，适合神显语境。
- source_word: δόξα
  choice: 荣耀
  rationale: 这是圣经神显语境中 δόξα 的惯常译法，并保留与相关传统的互文联系。
- source_word: νεφέλη
  choice: 那云彩
  rationale: 定冠词表明这是读者可以辨认的特定云彩，即与神临在相关的云彩；“那云彩”在中文中保留这种特指。
- source_word: ἐπὶ Μωσῇ
  choice: 摩西时期
  rationale: ἐπί 加与格在这里指向摩西这一先例；正文采用自然中文表达，同时以脚注注明也可理解为“在摩西的事上”。
- source_word: ἐδηλοῦτο
  choice: 所显明的
  rationale: 未完成时被动态回指过去曾有的显现；“所显明的”保持被动含义，又避免生硬。
- source_word: ἠξίωσεν
  choice: 祈求
  rationale: 语境是所罗门为圣所成圣而提出请求；“祈求”符合语境，但因动词本身也可较宽泛地译作“请求”，故以脚注保留另一译法。
- source_word: ὁ τόπος
  choice: 那地方
  rationale: 直译为“那地方”，不在正文中把它明确扩展为圣殿或圣所，让上下文界定所指。
- source_word: καταγιασθῇ
  choice: 成圣
  rationale: 该动词表示成为圣洁或被奉献为圣；“成圣”保留圣经语体及其较宽的神学含义。
- source_word: μεγάλως
  choice: 大大
  rationale: 直截了当地保留副词的加强作用，不将其限缩为礼仪性的“隆重地”。
theological_decisions:
- issue: 申命经典希腊文本神显语境中 κύριος 的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文直接写 κύριος；译作“主”忠于现存源文本，也不反向补入未出现的希伯来神名形式。
- issue: 摩西、所罗门与未来神显之间的关系
  choice: 保留经文所作的历史类比，不作教义扩展
  alternative: 把云彩或荣耀明确解释为某一后期神学概念
  rationale: 原文把未来的显明与摩西和所罗门相关的先例相连；译文保留这种联系，却不进一步界定神临在的性质。
- issue: 所罗门的 ἠξίωσεν 是否明确表示祷告
  choice: 正文译作“祈求”，脚注保留“请求”
  alternative: 仅译作“请求”
  rationale: 上下文支持祷告场景，但动词自身并不必然专指祷告，因此不应让语境性译法掩盖词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“显明、荣耀、成圣”保留必要的圣经语体；句中以分号梳理较长的希腊并列结构。对“摩西时期”作适度自然化，并借脚注保留原介词短语的表达空间。
