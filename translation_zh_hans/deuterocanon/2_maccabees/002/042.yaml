  text: Therefore[a], if you have need, send those who will bring them to you.
translation:
  language: zh_hans
  text: 所以[a]，你们若有需要，就派人来把这些带回去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里重复了“若”（ἐὰν … ἐὰν），可能是抄写时的重出；正文按其显然的意思翻译。
    reason: textual_variant
lexical_decisions:
- source_word: οὖν
  choice: 所以
  rationale: 在书信语境中自然表达推论或承接关系，同时保留原文的连接作用。
- source_word: ἐὰν ... χρείαν ἔχητε
  choice: 你们若有需要
  rationale: χρείαν ἔχειν是“有需要、需要”的惯用语；此译法既贴近希腊语结构，也符合现代汉语表达。
- source_word: τοὺς ἀποκομιούντας
  choice: 人来把这些带回去
  rationale: ἀποκομίζω表示把物品从一处运送到另一处；结合受信人要派人前来取走前文所提文献的语境，“带回去”比单纯“带给你们”更清楚地传达移动方向。“这些”补明希腊文省略的宾语，所指由上下文确定。
- source_word: ὑμῖν
  choice: 回去（隐含‘给你们／到你们那里’）
  rationale: 与ἀποκομίζω及受信人的视角结合，用“带回去”自然包含运送到受信人处的意思，避免生硬直译。
- source_word: ἀποστείλατε
  choice: 派人来
  rationale: 不定过去时命令语气要求采取明确行动；因宾语是执行运送的人，“派人来”在现代汉语中简洁自然。
- source_word: ἐὰν οὖν ἐὰν
  choice: 所以……若
  rationale: 传世文本重复ἐὰν；正文按显然的条件句意思只译一次，并以脚注说明文本异常。
