  text: To go into detail and to make a circuit with the discourse[a], and to be overly busy with the particulars, belongs to the originator of the history;
translation:
  language: zh_hans
  text: 至于深入探讨，在论述中广泛铺陈，并逐一细究各项细节，本是原史作者的事；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβατεύειν
  choice: 深入探究
  rationale: 此处与“广泛展开论述”和“详加考察各项细节”并列，指深入处理题材，而非实际进入某处。
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: 用论述广泛展开
  rationale: 原文直译近于“让论述巡行”，是形容论述广泛铺陈的隐喻；正文采用自然汉语，脚注保留其修辞意象。
- source_word: πολυπραγμονεῖν
  choice: 详加考察
  rationale: 在本语境中指费心查考、处理繁多材料，不宜译成涉及他人事务的“多管闲事”。
- source_word: ἐν τοῖς κατὰ μέρος
  choice: 对各项细节
  rationale: 表示逐项的具体事项或细节，与“详加考察”自然搭配。
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: 原历史作者
  rationale: ἀρχηγενέτης强调最初创作这部历史的人；“原历史作者”既保留“原初”含义，也符合本段区分原作者与摘要者的语境。
- source_word: καθήκει
  choice: 这是……的职责
  rationale: 表达某事适合或应归于某人承担；“职责”在汉语中清楚呈现这种分工意味。
