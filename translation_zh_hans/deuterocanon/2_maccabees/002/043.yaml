  text: Since we are about to celebrate the purification[a], we have written to you. Therefore you will do well to observe the days.
translation:
  language: zh_hans
  text: 既然我们将要举行洁净礼，就写信给你们。你们守这些日子，做得就好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守这些日子”也可译作“庆祝这些日子”或“守这些日子”。原文这里所用的动词，与本节前面译作“举行”洁净礼的动词相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες
  choice: 我们将要
  rationale: 保留分词所表达的临近、预期意义；结合上下文用完整分句表达，符合现代汉语习惯。
- source_word: ἄγειν
  choice: 举行／守
  rationale: 该动词在本节出现两次，节期语境中可指举行、庆祝或遵守。因宾语不同，汉语分别译作“举行洁净礼”和“守这些日子”，使表达自然，同时以脚注说明原文用词相同。
- source_word: τὸν καθαρισμόν
  choice: 洁净礼
  rationale: καθαρισμός本义为“洁净、洁净礼”；此处指纪念圣殿得洁净的礼仪或节期。“洁净礼”既保留原词含义，也自然体现其礼仪语境，而不直接扩译为特定节名。
- source_word: ἐγράψαμεν
  choice: 便写信给你们
  rationale: 希腊文不定过去时在书信语境中指本信的书写；现代汉语用“写信给你们”清楚自然。
- source_word: καλῶς ... ποιήσετε
  choice: 就是做得好
  rationale: 这是表示赞许和劝勉的惯用语；用条件式“若……就是做得好”自然传达原文劝勉语气。
- source_word: τὰς ἡμέρας
  choice: 这些日子
  rationale: 原文直译为“这些日子／那些日子”，语境指前述洁净礼的节期日子；不在正文中增添“节期”一词，以免过度解释。
