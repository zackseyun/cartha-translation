  text: And Moses said[a], “Because it was not eaten, the sin offering was consumed.”
translation:
  language: zh_hans
  text: 摩西说：“因为赎罪祭[a]没有被吃掉，它就被耗尽了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“关于罪的东西”；这是希腊文圣经中指“赎罪祭”的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν Μωυσῆς
  choice: 摩西说
  rationale: 用简洁自然的叙事引语表达；καί在此仅作承接，汉语中不必机械译出。
- source_word: Διὰ τὸ μὴ βεβρῶσθαι
  choice: 因为……没有被吃掉
  rationale: διά加带冠词的不定式表示原因；βεβρῶσθαι是完成时被动不定式，译文保留其被动意义及原因关系。
- source_word: τὸ περὶ τῆς ἁμαρτίας
  choice: 赎罪祭
  rationale: 这是希腊文圣经中的祭祀惯用语，所指为赎罪祭；直译会使现代读者难以辨明其礼仪含义。
- source_word: ἀνηλώθη
  choice: 被毁掉了
  rationale: ἀναλίσκω的被动式可表示被耗尽、毁掉或消耗。此处不明说以何种方式毁掉，避免把焚烧等细节加入正文。
theological_decisions:
- issue: τὸ περὶ τῆς ἁμαρτίας的祭祀含义
  choice: 赎罪祭
  alternative: 关于罪的东西／为罪而设之物
  rationale: 该短语是七十士译本中的祭祀用语；译作“赎罪祭”能准确传达所指，同时以脚注保留原文较迂回的表达。
- issue: ἀνηλώθη是否明确表示焚烧
  choice: 被毁掉了
  alternative: 被焚毁了／被消耗了
  rationale: 希腊词本身没有明确指出焚烧这一方式，因此正文不把上下文可能暗示的具体方式写死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文明确的因果关系；祭祀术语用通行译法，并以脚注说明其字面形式。
