base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/048.yaml
  text: and the appearances from heaven that came to those who fought bravely with zeal for Judaism[a], so that, though they were few, they plundered the whole country and drove off the barbarian hordes[c][b],
translation:
  language: zh_hans
  text: 以及那些为犹太信仰[a]满怀热忱、英勇奋战之人所经历的来自天上的显现[b]，使他们虽然人数很少，却能劫掠全境，并追赶那些蛮族的大批人马[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犹太信仰”在这里指他们所捍卫的犹太宗教和生活传统。
    reason: cultural_note
  - marker: b
    text: “显现”也可译作“彰显”或“天上的显现”。
    reason: lexical_alternative
  - marker: c
    text: “蛮族”是原文带有族群文化色彩的称呼；也可译作“外族的大批人马”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείας
  choice: 显现的异象
  rationale: 该词指可见的显现或彰显；结合“从天上”译为“显现的异象”，既保留事件的可见性，也避免采用带有后世专门神学含义的术语。
- source_word: τὰς ἐξ οὐρανοῦ γενομένας
  choice: 从天上……显现的
  rationale: 保留其来自天上的源头以及 γενομένας 所表达的发生、出现之意。
- source_word: τοῖς ... φιλοτίμως ἀνδραγαθήσασιν
  choice: 向那些……满怀热忱、英勇奋战的人
  rationale: ἀνδραγαθέω 在军事语境中表示英勇作为，φιλοτίμως 表示热忱、积极投入；分译二者可保留原文的双重意味。
- source_word: ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: 为犹太信仰
  rationale: 此处指在外来压力下所捍卫的犹太宗教及生活传统；“犹太信仰”在现代汉语中自然，同时脚注补明其范围不限于内在信念。
- source_word: ὡς
  choice: 使
  rationale: 在此引出天上显现所带来的结果；“使”简洁表达结果关系。
- source_word: τὴν ὅλην χώραν
  choice: 全境
  rationale: χώρα 在军事地理语境中指一整片国土或地区；“全境”准确而凝练。
- source_word: ὀλίγους ὄντας
  choice: 虽然人数很少
  rationale: 将分词短语理解为让步，突出少数人取得巨大军事成果的反差。
- source_word: λεηλατεῖν
  choice: 劫掠
  rationale: 直译其夺取财物、掠夺之意，不弱化原文对军事行动的描述。
- source_word: τὰ βάρβαρα πλήθη
  choice: 那些蛮族大军
  rationale: 保留 βάρβαρα 在原文中的族群文化标签和贬抑色彩；“大军”结合 πλήθη 的众多含义及军事语境。
- source_word: διώκειν
  choice: 追赶
  rationale: 保留 διώκω 最直接的“追逐、追赶”含义，不把敌军最终被赶走或溃败的结果强加给原文。
theological_decisions:
- issue: Ἰουδαϊσμός 在本书历史语境中的含义
  choice: 犹太信仰
  alternative: 犹太教；犹太人的生活方式
  rationale: 原词指与希腊化压力相对的犹太宗教文化身份。“犹太信仰”较自然，但以脚注说明它也包括相应的生活传统，避免把含义缩窄为私人信念。
- issue: 天上显现与军事成果之间的关系
  choice: 以“使”保留结果关系
  alternative: 以“以致”表达较弱的结果关系
  rationale: ὡς 在此最可能引出结果，但本节属于更长句的一部分；译文不进一步断言显现的具体行动方式，以保留叙述的含蓄性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。本节在希腊文中是未完长句的一部分，因此末尾保留逗号。把 φιλοτίμως 与 ἀνδραγαθήσασιν 分别译作“满怀热忱”和“英勇奋战”，并将 διώκειν 直译为“追赶”，以免过度解释为已经赶走或击溃。
