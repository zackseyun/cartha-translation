  yaml_path: translation/deuterocanon/2_maccabees/002/049.yaml
  text: and to recover the sanctuary renowned throughout the whole inhabited world[a], and to free the city, and to restore the laws that were about to be abolished, since the Lord was showing them mercy with all forbearance[b],
translation:
  language: zh_hans
  text: 并收复那闻名全天下的圣所[a]，解放那座城，恢复那些即将被废除的律法；因为主以全然的宽容怜悯他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全天下”直译为“整个有人居住的世界”，也可译作“全世界”。
    reason: lexical_alternative
  - marker: b
    text: “以全然的宽容”也可译作“以完全的温和”“以极大的宽仁”或“以各种恩慈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβόητον
  choice: 闻名
  rationale: 指广为人知、众所称道；“闻名”自然清楚，也保留圣所声名远播之意。
- source_word: καθʼ ὅλην τὴν οἰκουμένην
  choice: 全天下
  rationale: οἰκουμένη字面指“有人居住的世界”，在希腊化语境中常泛指当时所知的世界；正文用自然的汉语表达，并以脚注保留字面含义。
- source_word: ἱερόν
  choice: 圣所
  rationale: 此处指耶路撒冷圣殿这一神圣场所；“圣所”保留该词强调神圣空间的意味。
- source_word: ἀνακομίσασθαι
  choice: 收复
  rationale: 该中动态不定式在此语境表示重新取回、夺回；“收复圣所”符合战争与复兴的上下文。
- source_word: ἐλευθερῶσαι
  choice: 解放
  rationale: 表示使之脱离辖制而获得自由；“解放那城”保留其政治含义。
- source_word: τοὺς μέλλοντας καταλύεσθαι νόμους
  choice: 那些即将被废除的律法
  rationale: μέλλοντας加被动不定式表达迫近的行动，καταλύεσθαι在此指被取消或废止。
- source_word: ἐπανορθῶσαι
  choice: 恢复
  rationale: 本义为重新扶正、重建；用于律法时，“恢复”简洁而贴合制度语境。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 此处指向施怜悯的上帝，译作“主”符合神圣称谓及上下文。
- source_word: μετὰ πάσης ἐπιεικείας
  choice: 以极大的宽仁
  rationale: ἐπιείκεια可指宽厚、宽容、温和或仁慈；“宽仁”兼顾宽容与仁厚，且适合描述主施怜悯的方式。
- source_word: ἐλεημονοῦντος αὐτοῖς
  choice: 怜悯他们
  rationale: 分词表达主向他们持续施行怜悯；汉语在原因分句中无需机械标出持续体。
theological_decisions:
- issue: κύριος的所指与译法
  choice: 主
  alternative: 主人
  rationale: 句中施怜悯者是上帝，因此采用神圣称谓“主”；“主人”不合此处语境。
- issue: ἐπιείκεια所表达的神圣行动特质
  choice: 宽仁
  alternative: 宽容；温和；恩慈
  rationale: 原词语义范围较广，不应将其限缩为某一教义属性；“宽仁”在汉语中可同时表达宽厚、克制与仁慈，脚注列出其他可能译法。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。以“收复—解放—恢复”形成协调的并列结构；保留原文因果分词结构的意义，以“因为”引出主的怜悯。
