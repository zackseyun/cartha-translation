  yaml_path: translation/deuterocanon/2_maccabees/002/040.yaml
  text: The same things were also related in the records and in the memoirs concerning Nehemiah[a], and how, in founding a library, he gathered together the books about the kings and prophets, and the writings of David[b], and letters of kings concerning votive offerings.
translation:
  language: zh_hans
  text: 同样的事也记载在有关尼希米的档案和回忆录中；其中还记述了尼希米如何在建立一座藏书库[a]时，收集有关君王和先知的书卷、大卫的著作，以及君王们关于奉献之物的书信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “建立一座藏书库”也可译作“着手设立一座藏书库”。原文分词含有奠基、创设或设置的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξηγοῦντο
  choice: 记载
  rationale: 此处指档案和回忆性文献叙述这些事；“记载”符合文献语境，也不把词义过度限定为“解释”。
- source_word: ἀναγραφαῖς
  choice: 档案
  rationale: 指书面记录或登记文献；与“回忆录”并列时，“档案”自然且能体现文献性质。
- source_word: ὑπομνηματισμοῖς
  choice: 回忆录
  rationale: 在有关尼希米的语境中，较可能指纪事或回忆性著述，而非正式注释。
- source_word: τοῖς κατὰ τὸν Νεεμίαν
  choice: 有关尼希米的
  rationale: 保留该短语表示“与尼希米有关”的宽泛关系，不贸然断定作者身份。
- source_word: καταβαλλόμενος
  choice: 建立
  rationale: 与“藏书库”连用时表示奠基、创设；“建立”比直译为“奠基”更符合现代汉语。
- source_word: βιβλιοθήκην
  choice: 藏书库
  rationale: 此处指集中收藏书卷之处或书籍收藏；“藏书库”既清楚，又较适合古代历史语境。
- source_word: ἐπισυνήγαγεν
  choice: 收集起来
  rationale: 体现把分散材料汇集到一处的动作。
- source_word: τὰ περὶ τῶν βασιλέων καὶ προφητῶν βιβλία
  choice: 有关君王和先知的书卷
  rationale: περί最自然地表示“关于、有关”，不应改成可能暗示作者身份的“君王和先知所写的书”。“书卷”也符合古代文献语境。
- source_word: τὰ τοῦ Δαυείδ
  choice: 大卫的著作
  rationale: 原文为省略结构，泛指与大卫相关或归于大卫的作品；“著作”使汉语完整，同时不具体限定为诗篇。
- source_word: ἐπιστολὰς βασιλέων
  choice: 君王们……的书信
  rationale: 保留复数和属格关系，可理解为君王所发的书信。
- source_word: περὶ ἀναθεμάτων
  choice: 论到奉献之物
  rationale: ἀνάθημα在圣殿背景下指献给神、分别出来的物品；此译避免后期“咒诅”义造成误解，也保留对象范围的宽泛性。
theological_decisions:
- issue: ἀναθεμάτων的宗教含义
  choice: 奉献之物
  alternative: 还愿祭物／献给神的礼物
  rationale: 原词在此历史与圣殿语境中指献给神的物品，不是后期教会用语中的“咒诅”。“奉献之物”既准确，又不把它缩窄为仅用于还愿的礼物。
- issue: τὰ τοῦ Δαυείδ与大卫的关系
  choice: 大卫的著作
  alternative: 与大卫有关的作品
  rationale: 属格可表示作者、归属或关联。正文采用自然简洁的表达，但不进一步具体化为“诗篇”，从而保留原文未明说的范围。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“档案”“回忆录”“藏书库”“书卷”体现古代文献语境；用冒号自然引出所记之事。脚注标记[a]已在正文对应位置出现。
