  text: we have taken care that for those who wish to read there may be enjoyment, for those who are inclined to commit it to memory ease, and for all who encounter it benefit.
translation:
  language: zh_hans
  text: 我们特意顾及：使愿意阅读的人得到乐趣，使有意牢记的人能够轻松记住，也使所有遇到本书的人都能受益。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφροντίσαμεν
  choice: 我们已经用心
  rationale: 表达作者为编写和节略此书所付的审慎心力；比机械译作“我们已经关心”更符合现代汉语。
- source_word: εὐχαγωγίαν
  choice: 得到乐趣
  rationale: 此词指阅读时的愉悦或引人入胜之感，译作“得到乐趣”自然且不夸大。
- source_word: φιλοφρονοῦσιν
  choice: 有意
  rationale: 在此表示愿意、倾向于从事下文所说之事；保留意愿色彩，不赋予额外的虔敬含义。
- source_word: εἰς τὸ διαμνήμης ἀναλαβεῖν
  choice: 记住内容
  rationale: 指将所读内容收入并保存于记忆中；汉语无需生硬直译为“承担到记忆里”。
- source_word: ἐντυγχάνουσιν
  choice: 接触本书
  rationale: 该词在此可指读到、遇到或接触文本的人；用“接触本书”保留比单纯“阅读”更宽的范围。
- source_word: ὠφέλειαν
  choice: 受益
  rationale: 准确表达益处、裨益，并与整句三个目的形成自然对应。
