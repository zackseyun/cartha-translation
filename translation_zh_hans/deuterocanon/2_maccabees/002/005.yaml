  text: For as Antiochus and his friends were accompanying her to the place[a], they were bringing him there to gain control of the money[b], under the pretext of inspection.
translation:
  language: zh_hans
  text: 因为安提阿古和随行的朋友陪着她前往那地方[a]，为要以查验为名，取得对那笔较大款项的支配权[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这节经文的传抄文本句法艰涩，主语、宾语以及代词所指都有不确定之处。
    reason: textual_variant
  - marker: b
    text: 或译：“以查验为由，取得那笔较大款项。”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: 陪着她
  rationale: συνοικέω通常可指“同住”，但本句涉及前往某地，且传抄文本句法明显不稳；结合移动语境译为“陪着她”，同时保留阴性代词“她”，不擅自改正其所指。
- source_word: παρῆγεν εἰς τὸν τόπον
  choice: 前往那地方
  rationale: παράγω可表示带领、带往或经过。原文没有明说被带领的宾语，故不在正文中补入“他”，以免在主宾关系不明时作出过度判断。
- source_word: οἱ σὺν αὐτῷ φίλοι
  choice: 随行的朋友
  rationale: 自然表达这些人与安提阿古同行并属于他的友伴群体。
- source_word: κύριον τὸ λαβεῖν
  choice: 取得支配……的权力
  rationale: κύριος与不定式结构在此可表达获得权柄或控制权，不只是把财物拿走。
- source_word: τὰ χρήματα πλείονα
  choice: 那笔较大款项
  rationale: 保留πλείονα所表达的较大数量或金额；χρήματα在此按财务语境译为“款项”。
- source_word: εἰς ἐφορῆς λόγον
  choice: 以查验为名
  rationale: λόγος在此表示所提出的理由或名目，ἐφορή涉及查看、查验或监督；该表达自然传达以查验作为名义或托词。
