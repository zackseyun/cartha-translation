base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/037.yaml
  text: Just as Moses prayed to the Lord[a], and fire came down from heaven and consumed the things of the sacrifice, so also Solomon prayed to the Lord[b], and the fire came down and consumed the whole burnt offerings.
translation:
  language: zh_hans
  text: 正如摩西向主祷告，火从天降下，烧尽了祭物[a]；所罗门也照样向主祷告，火降下，烧尽了全燔祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“献祭的那些东西”，可指献祭所用的物品或祭物。
    reason: lexical_alternative
  - marker: b
    text: 或译“燔祭”。原词特指全部焚烧的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσηύξατο πρὸς Κύριον
  choice: 向主祷告
  rationale: 自然、准确地表达向主祈祷；Κύριον译为“主”，不把希腊文本未明载的四字神名格式引入译文。
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: 有火从天降下
  rationale: 保留火从天而降的叙事画面和语序，符合现代汉语表达。
- source_word: τὰ τῆς θυσίας
  choice: 祭物
  rationale: 该短语直指与献祭有关的事物或供物；“祭物”简明自然，同时以脚注说明原文较宽泛。
- source_word: ἐδαπάνησεν / ἀνήλωσεν
  choice: 烧尽了
  rationale: 两个动词在祭坛之火的语境中都表示完全耗尽；统一译法既自然，也保留上下两句的平行。
- source_word: οὕτως ... καὶ
  choice: 也照样
  rationale: 清楚标明摩西与所罗门两件事之间的比较和平行。
- source_word: καταβῆναι τὸ πῦρ
  choice: 火就降下
  rationale: 传世希腊语句法较为压缩；按上下文译成直接的连续动作，既保持原有次序，也避免生硬。
- source_word: ὁλοκαυτώματα
  choice: 全燔祭
  rationale: 该词专指全部焚烧的祭物；“全燔祭”保留其礼仪上的特定含义，并与一般“燔祭”区别。
theological_decisions:
- issue: 向以色列的上帝祷告时Κύριον的译法
  choice: 主
  alternative: 耶和华
  rationale: 希腊文本写的是Κύριον，而非希伯来文四字神名；“主”最直接对应现有原文证据。
- issue: ὁλοκαυτώματα的礼仪特指性
  choice: 全燔祭
  alternative: 燔祭
  rationale: 原词强调祭物全部焚烧；译作“全燔祭”可保留这一特定含义，而不把它泛化。
- issue: 第二个火降下短语的压缩句法
  choice: 火就降下，烧尽了
  alternative: 降下的火烧尽了
  rationale: 原文καταβῆναι的形式使句法显得压缩或不规则；采用上下文所要求的连续叙事，但不添加火的来源等原文此处未重复的信息。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“正如……也照样……”保留原文的平行结构；分号使两个对应事件的关系更清晰。所有脚注标记均置于正文相关词语之后。
