translation:
  language: zh_hans
  text: 祭祀所用的东西用完后[a]，尼希米吩咐人把剩下的水浇在较大的石头上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祭祀所用的东西”原文直译为“祭祀的东西”，所指并未具体说明。
    reason: lexical_alternative
  - marker: b
