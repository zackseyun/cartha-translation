    reason: textual_variant
lexical_decisions:
- source_word: ἀνηλώθη
  choice: 烧尽
  rationale: 该被动动词表示耗尽、用尽；在祭祀语境中译作“烧尽”自然，但不额外说明具体是哪些物品被火焚尽。
- source_word: τὰ τῆς θυσίας
  choice: 祭祀所用的东西
  rationale: 这是中性复数加属格构成的省略表达；保留“东西”的宽泛性，避免擅自限定为祭物、木柴或其他材料。
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: 剩下的水
  rationale: 准确而自然地表达分词短语“余下的水”。
- source_word: ὁ Νεεμίας
  choice: 尼希米
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐκέλευσεν
  choice: 吩咐人
  rationale: 表达权威性的命令；希腊文未明说受命者，中文补出泛指的“人”以使句法自然，不指认具体对象。
- source_word: λίθους μείζονας
  choice: 较大的石头
  rationale: 保留 μείζονας 的比较级含义；原文无定冠词，因此不强化为特指的一组石头。
- source_word: καταχεῖν
  choice: 浇在……上
  rationale: 该复合动词表示从上面倾倒、浇在其上，符合水与石头的搭配。
