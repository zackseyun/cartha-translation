base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/010.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests secretly took some of the fire from the altar and hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: zh_hans
  text: 原来，我们的祖先被押往波斯的时候，那些虔诚的祭司暗中从祭坛的火中取了一些，藏在一口无水井的凹穴里[a]，又把它妥善安置好，使所有人都不知道那个地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“藏在一个无水的井（或坑）的凹穴里。”这里的希腊文表达紧缩而略显生硬，同时使用了表示“凹穴、空腔”和“无水的井或坑”的词。
    reason: 原文对藏匿地点的描述存在词汇与句法上的多种自然理解，需保留其不确定性。
lexical_decisions:
- source_word: ἤγοντο
  choice: 被押往
  rationale: 未完成时被动语态在此语境中表示被带走或被掳迁；“被押往”自然体现非自愿迁移，又不额外说明具体押送方式。
- source_word: εἰς τὴν Περσικὴν
  choice: 往波斯
  rationale: 该表达指波斯之地；与表示移动的动词搭配时，“往波斯”是自然、简洁的现代汉语。
- source_word: εὐσεβεῖς
  choice: 虔诚的
  rationale: 保留祭司敬虔、尊崇上帝的宗教意味，同时符合现代汉语表达。
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: 从祭坛的火中取了一些
  rationale: 表达从祭坛之火取出一部分，而不是把整团火全部取走；汉语中“取了一些”也自然承接“火”。
- source_word: λαθραίως
  choice: 暗中
  rationale: 准确传达行动隐秘、不让人察觉的意味，且比“偷偷地”更符合庄重叙事语体。
- source_word: κατέκρυφαν
  choice: 藏
  rationale: 直接表达隐藏、隐匿；不采用“埋”，以免加入原文没有明确说明的动作方式。
- source_word: ἐν κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: 在一口无水井的凹穴里
  rationale: 兼顾 κοιλώμα（凹穴、空腔）、φρέαρ（井或坑）和 ἀνύδρου（无水）；原文结构紧缩而略显生硬，正文采用可懂的汉语，脚注保留“无水井坑”的可能理解。
- source_word: κατησφαλίσαντο
  choice: 妥善保护起来
  rationale: 中间语态表示使所藏之物安全稳妥；此译法不武断限定为封住、盖住或其他具体手段。
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: 使所有人都不知道那个地方
  rationale: 自然表达结果或目的，同时贴近“那个地方对所有人都是未知的”这一希腊文结构。
theological_decisions:
- issue: 祭司保存祭坛之火这一行动的意义
  choice: 仅叙述虔诚的祭司在被掳迁时秘密保存祭坛之火
  alternative: 可理解为维系日后敬拜的延续，或单纯出于对圣物的敬重而保存
  rationale: 本节没有解释这一行动的礼仪或神学含义，因此译文不加入后来的教义或礼仪推论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“原来”承接 καὶ γάρ 的解释语气；“那些虔诚的祭司”保留冠词与形容词所指的特定群体。脚注标记置于其实际说明的藏匿地点之后，而非置于“波斯”之后。
