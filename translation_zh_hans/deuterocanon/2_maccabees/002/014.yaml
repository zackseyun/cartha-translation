  yaml_path: translation/deuterocanon/2_maccabees/002/014.yaml
  text: And the priests made prayer when the sacrifice had been consumed[a], both the priests and all the others, with Jonathan beginning and the rest responding[b], as in Nehemiah.
translation:
  language: zh_hans
  text: 祭物正被焚烧时，祭司祷告；祭司和众人都参与祷告[a]。约拿单带头，其余的人应和，如同尼希米那样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先说“祭司祷告”，随后又说“祭司和众人”，措辞有所重复，可能是要强调全体都参与了祷告。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译近于“如尼希米”，是一个省略式说法；可能指“像尼希米所做的那样”，也可能指“如同尼希米的祷告”。
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν δὲ ἐποιήσαντο
  choice: 献上祷告
  rationale: 这是“作祷告”的惯用结构；译作“献上祷告”既符合现代汉语，也保留其郑重、礼仪性的语境。
- source_word: δαπανωμένης τῆς θυσίας
  choice: 祭物正焚烧殆尽时
  rationale: δαπανωμένης在此为现在分词，表示祭物正在被耗尽；结合献祭语境，所指最可能是祭物被火焚尽，因此用进行性表达，而不译成已经完成。
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: 祭司和众人全都参加
  rationale: 原文在先说“祭司”之后又重复“祭司和所有人”，措辞略显重复，旨在表明全体共同参与；译文保留祭司与众人的并列，并用“全都参加”表达其包举意味。
- source_word: καταρχομένου Ἰωνάθον
  choice: 约拿单起头
  rationale: κατάρχομαι在此表示开始或带头。译作“起头”保留他首先发声的意思，同时不武断限定为领唱或领祷。
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: 其余的人应声
  rationale: ἐπιφωνέω表示发声、呼应或高声回应；“应声”自然地传达众人对约拿单的口头回应，同时保留具体形式的不确定性。
- source_word: ὡς Νεεμίου
  choice: 正如尼希米那次一样
  rationale: 原文是省略式短语，直译近于“如尼希米”；补入“那次”使汉语通顺，却不在正文中断定究竟是指尼希米的行为、祷告还是当时的礼仪做法。
theological_decisions:
- issue: 结尾省略语ὡς Νεεμίου的所指
  choice: 正如尼希米那次一样
  alternative: 像尼希米所做的那样；如同尼希米的祷告
  rationale: 希腊文没有明说比较的是尼希米的行动、祷告或相关仪式。正文采用较开放的表达，脚注列出主要理解，以保留原文的解释张力。
- issue: 祭司与众人参与祷告的关系
  choice: 祭司献上祷告——祭司和众人全都参加
  alternative: 祭司和众人献上祷告
  rationale: 原文先以祭司为祷告的主语，随后又重复说祭司和所有人；译文不把两层表述完全合并，以免抹去原文可能强调全体参与的重复。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙事语体。“焚烧殆尽”对应献祭过程中祭物被耗尽的情景；“起头／应声”保留可能存在的轮流诵祷形式，但不把它明确规定为领唱或固定应答礼。另据所提供的希腊文本内容，其与所标参考经节可能存在编号或来源错配；本稿严格按给定希腊文翻译。
