  yaml_path: translation/deuterocanon/2_maccabees/002/032.yaml
  text: So then[a], let us begin the narrative from this point, adding only this much to what has been said before; for it is foolish to be excessive before the history and to abridge the history itself.
translation:
  language: zh_hans
  text: 所以，让我们从此开始叙述；在前面所说的之外，只再补充这一点：在历史记述[a]之前说得过多，却把历史记述本身加以删节，是愚蠢的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“记述”。这里的希腊词可指考察、记载或历史叙事，并不只指现代学科意义上的“历史”。本节两处同。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: 所以……从这里
  rationale: 兼顾 οὖν 的承接、推论作用和 Ἐντεῦθεν 的篇章转换意义；“从这里”自然地指向正文叙述的起点。
- source_word: ἀρξώμεθα τῆς διηγήσεως
  choice: 就让我们……开始叙述
  rationale: 保留第一人称劝勉虚拟式的邀请语气；“叙述”适合作者即将展开书面记述的语境。
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: 只在前面所说的之外再补充这一点
  rationale: 表达在此前言论之后仅附加少量内容的意思，并以现代汉语自然呈现分词结构。
- source_word: εὔηθες
  choice: 愚蠢
  rationale: 此处批评一种失当的写作安排；“愚蠢”保留原文鲜明的负面判断。
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: 在历史记述之前说得过多
  rationale: πλεονάζειν 在此指前言铺陈超过适当限度；译文既明确此义，也保留与后半句的对照。
- source_word: ἱστορία / ἱστορίαν
  choice: 历史记述
  rationale: 所指是作者要讲述的历史性记载，而非现代学科意义上的“历史学”；“历史记述”兼顾历史性质和文本体裁。
- source_word: ἐπιτέμνειν
  choice: 加以删节
  rationale: 表达将正文缩短、削减的意思，并与“说得过多”形成清楚对照。
