translation:
  language: zh_hans
  text: 至于逐项详尽论述，我们把这项工作留给作者[a]；我们自己则力求遵循这部节本的纲要来写。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至于逐项精确考察，我们留给作者；我们则力求沿着这部节本的纲要前行。”希腊文使用文学写作方面的词语，说明完整著作与其节本之间的区别。
    reason: 词义与文学术语的译法可有不同理解
lexical_decisions:
- source_word: διακριβοῦν
  choice: 详尽论述
  rationale: 此处带冠词的不定式作名词性成分，指在完整著作中精确、细致地处理各项内容；“详尽论述”兼顾准确性和文学写作语境。
- source_word: περὶ ἑκάστων
  choice: 逐项
  rationale: 保留ἑκάστων的逐一、分项之意，同时使现代汉语表达简洁自然。
- source_word: τῷ συγγραφεῖ
  choice: 原作者
  rationale: 指较完整历史著作的撰写者；加“原”可清楚区别于当前摘要的编写者，而不额外限定其为历史学家。
- source_word: παραχωρήσαντες
  choice: 把这任务留给
  rationale: 表达将详述各项内容的工作让给原作者处理，符合分词在句中的让渡意味。
- source_word: ἐπιπορεύεσθαι
  choice: 依循……来写
  rationale: 原词有沿着既定路线前行之意；结合文学语境，译作“依循……来写”自然呈现摘要编写者的工作。
- source_word: ὑπογραμμοῖς
  choice: 轮廓
  rationale: 该词可指勾勒出的线条、草图或纲要；“轮廓”保留形象性，也适合描述摘要的框架。
- source_word: ἐπιτομῆς
  choice: 摘要
  rationale: ἐπιτομή是由较长著作删节、浓缩而成的文本；“摘要”通俗自然，并能表达此处的文学体裁。
- source_word: σπουδάζοντες
  choice: 力求
  rationale: 体现认真努力、尽力而为，不仅是愿望或意向。
