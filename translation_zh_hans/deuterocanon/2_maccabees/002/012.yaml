base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/012.yaml
  text: As they explained to us that they had found not fire but thick water[a], he ordered them, after drawing some out, to bring it. Then when the things for the sacrifices had been brought forward[c][b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid upon it.
translation:
  language: zh_hans
  text: 他们向我们说明，他们找到的不是火，而是浓稠的水[a]。尼希米就吩咐他们舀出一些[b]带来。祭祀所需之物呈上来以后，尼希米吩咐祭司把那水洒在木柴和放在上面的东西上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“稠密的水”或“浓稠的液体”。希腊文的说法不寻常，可能有意突出这种物质的奇异。
    reason: lexical_alternative
  - marker: b
    text: 译作“舀出一些”的希腊词词形罕见，含义也有困难；上下文大意是要他们取出一些液体带来。
    reason: textual_difficulty
  - marker: c
    text: “洒在”也可译作“浇在”。
    reason: alternative_reading
lexical_decisions:
- source_word: διεσάφησαν
  choice: 向我们说明
  rationale: 该动词表示把事情讲明、说明清楚；译文既保留信息传达的明确性，也符合现代汉语表达。
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: 他们找到的不是火，而是浓稠的水
  rationale: 保留“不是火，而是水”的鲜明对比，并直译παχύ所表达的稠密性质，不把这异常物质解释成某种特定液体。
- source_word: ἀποβλίψαντας
  choice: 舀出一些
  rationale: 该词形罕见且语义有困难；从上下文看，是要从所发现的液体中取出一部分带来。“舀出一些”自然地表达这一动作，同时避免断定具体器具或方式。
- source_word: φέρειν
  choice: 带来
  rationale: 作为ἐκέλευσεν之后的命令不定式，表示把所取出的液体带到尼希米那里；“带来”简洁自然。
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: 祭祀所需之物呈上来以后
  rationale: 原文为概括而略带省略的表达，可能包括祭物或其他祭祀用品；“祭祀所需之物”保留其范围，不擅自缩窄为祭牲。
- source_word: ἐπιρᾶναι
  choice: 洒在
  rationale: 此动词表示把液体施加于物体之上，在祭祀语境中可译作“洒在”；脚注保留“浇在”的可能，以反映动作方式并不完全确定。
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: 木柴和放在上面的东西
  rationale: 译出ξύλα的“木柴”及ἐπικείμενα的空间关系，同时保留后者宽泛的指称，不明确增添“祭牲”等原文未明说的内容。
- source_word: Νεεμίας
  choice: 尼希米
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 把液体施加在祭坛材料上的动作方式
  choice: 把那水洒在木柴和放在上面的东西上
  alternative: 把那水浇在木柴和放在上面的东西上
  rationale: 希腊动词可泛指将液体加在其上。“洒在”符合祭祀场景，但不应排除较大量倾倒或浇灌的理解，因此在脚注中保留另一译法。
- issue: 异常物质ὕδωρ παχύ的表述
  choice: 浓稠的水
  alternative: 稠密的水；浓稠的液体
  rationale: 原文明确使用“水”并以“浓稠”修饰。保留这种不寻常的搭配，可维持叙事中的惊异感，避免把它解释为某种已知物质。
- issue: τὰ τῶν θυσιῶν所指的范围
  choice: 祭祀所需之物
  alternative: 祭物；献祭用品
  rationale: 原文表达宽泛而省略，未明确只指祭牲或供物；译文保留其概括性，不据后文作神学或礼仪上的过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式按叙事顺序展开；保留“浓稠的水”和“放在上面的东西”等原文中有意或实际存在的异常与宽泛之处，不作教派性解释。
