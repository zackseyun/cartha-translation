  text: Just as it is not easy for one who prepares a banquet and seeks the advantage of others[a], yet for the gratitude of the many we will gladly endure the hardship;
translation:
  language: zh_hans
  text: 正如为人预备宴席、谋求他人益处，并不是一件容易的事；然而，我们因着众人的感激，乐意承受这辛劳。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ
  choice: 正如
  rationale: 保留原文引出类比的作用，并自然承接上文。
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: 预备宴席的人
  rationale: συμπόσιον指设宴聚餐；“宴席”庄重而符合现代汉语习惯。
- source_word: ζητοῦντι τὴν ἑτέρων λυσιτέλειαν
  choice: 并谋求别人益处
  rationale: 保留ζητέω所表达的主动追求，以及λυσιτέλεια“益处、利益”的含义，不额外推断其动机。
- source_word: οὐκ εὐχερές
  choice: 并不轻松
  rationale: 表达此事不容易，同时比生硬的“并非容易之事”更符合现代汉语。
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: 为了众人的感激
  rationale: διὰ加宾格在此表达目的或缘故；εὐχαριστία按普通希腊语义译为“感激”，不采用后世礼仪术语。
- source_word: ἡδέως
  choice: 甘愿
  rationale: 体现乐意承担的态度；与“承受辛劳”搭配自然。
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: 承受这番辛劳
  rationale: κακοπάθεια在本段指编纂工作的艰辛；“辛劳”比“苦难”更贴合语境，ὑποίσομεν的将来意向由“甘愿承受”自然表达。
theological_decisions:
- issue: εὐχαριστία的含义
  choice: 感激
  alternative: 圣餐／感恩祭
  rationale: 在本书的希腊化犹太语境中，该词是“感激、感谢”的普通名词，并非后世基督教圣礼的专门称谓；采用礼仪译名会把文本没有表达的后起神学含义带入经文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正如……仍……”保留原文的类比与转折关系；“这番辛劳”结合上下文，指作者缩编和写作所付出的劳苦。
