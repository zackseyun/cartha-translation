revisions:
- from: 正如预备宴席并谋求别人益处的人并不轻松，我们为了众人的感激[a]，仍甘愿承受这番辛劳。
  to: 正如为人预备宴席、谋求他人益处，并不是一件容易的事；然而，我们因着众人的感激，乐意承受这辛劳。
  rationale: 修订将διὰ的因果／动因关系明确译为“因着”，以免“为了”造成目的性的误解；以“然而”对应ὅμως；并调整“不轻松”和“甘愿”为更自然、贴近原文的现代汉语表达。脚注内容保留其必要的词义澄清，仅作文字润色。
