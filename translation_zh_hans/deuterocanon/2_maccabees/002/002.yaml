  text: Having been saved by God from great dangers[a], we give him great thanks, as if arrayed against a king.
translation:
  language: zh_hans
  text: 我们蒙上帝从重重危险中拯救出来，就大大感谢他，仿佛列阵对抗一位王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛列阵迎战一位王。”希腊文末尾的比较语简练；其军事图像可指向列阵对敌，措辞上也可有略微不同的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: 从重重危险中
  rationale: 保留ἐκ所表达的“从……中脱离”和κινδύνων的复数含义；“重重危险”自然体现μεγάλων的强度。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 蒙上帝
  rationale: ὑπό加属格标明施事者；汉语用“蒙上帝……拯救”自然表达被动关系。
- source_word: σεσωσμένοι
  choice: 拯救出来
  rationale: 完成时被动分词表示已经成就且结果仍存的拯救；结合“蒙”及“出来”传达这一状态。
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: 就大大感谢他
  rationale: “大大”保留μεγάλως对感谢程度的强调，“他”对应αὐτῷ。
- source_word: ὡς ἂν
  choice: 仿佛
  rationale: 该组合引出带有假设色彩的比较；“仿佛”在现代汉语中简洁自然，也不把比较改写为事实陈述。
- source_word: πρὸς βασιλέα παρατασσόμενοι
  choice: 列阵与一位王交战
  rationale: παρατάσσομαι具有列成战阵之意，πρός在此军事语境中最自然地表示敌对方向；“交战”使压缩的军事意象在汉语中清楚，但不将其解释为实际战斗。
theological_decisions:
- issue: 末句军事性比喻的指向
  choice: 仿佛列阵与一位王交战
  alternative: 仿佛在一位王面前列阵；仿佛列阵迎战一位王
  rationale: παρατασσόμενοι与πρός的组合最可能表示列阵对敌，因此正文保留与王对阵的张力；但原文表达压缩，其他空间或军事措辞仍有可能，故以脚注说明。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“重重危险”“大大感谢”保留原文两处强烈语气；末句维持其突兀、压缩的军事比喻，不作神学性弱化。
