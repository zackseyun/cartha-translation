  text: 祭司们则在吟唱赞美诗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文动词采用未完成时，表示当时正在持续进行的动作；也可译作“唱着赞美诗”。
