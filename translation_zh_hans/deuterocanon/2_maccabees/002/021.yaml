lexical_decisions:
- source_word: Οἱ δὲ
  choice: 则
  rationale: δέ在这里是轻微的叙事连接词；“则”承接前文并略作场景转换，不把它强化为明显转折。
- source_word: ἱερεῖς
  choice: 祭司们
  rationale: 准确表达带定冠词的复数名词，指场景中已可识别的祭司群体；现代汉语用“们”自然体现复数。
- source_word: ἐπέαλλον
  choice: 在吟唱
  rationale: 该未完成时动词描写当时持续进行的赞美歌唱；“在吟唱”既保留进行状态，也带有合宜的礼仪色彩。
- source_word: τοὺς ὕμνους
  choice: 赞美诗
  rationale: ὕμνοι指用于颂赞的诗歌；汉语不必机械表达希腊语定冠词，“赞美诗”简洁自然并符合礼仪语境。
