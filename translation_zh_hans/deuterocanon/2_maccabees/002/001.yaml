base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/001.yaml
  text: 'And those in Judea[a], and the council of elders, and Judas, to Aristobulus, teacher of King Ptolemy, who is also of the family of the anointed priests, and to the Jews in Egypt: greetings and good health.'
translation:
  language: zh_hans
  text: 在犹太地的人、长老议会和犹大，向国王托勒密的老师亚里斯多布——他出身于受膏祭司的家族[a]——以及住在埃及的犹太人致意，祝你们安康。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受膏祭司的家族”也可译作“受膏祭司的世系”。希腊文的“受膏”在这里是普通意义，并不是把这些祭司称为“基督”。
    reason: 说明词义与译法选择，避免将 χριστῶν 误解为基督论称号，并保留 γένους 的“家族／世系”幅度。
lexical_decisions:
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: 在犹太地区的人
  rationale: 原文泛指“在犹太地区的人”，没有明说“犹太人”；译文不补入原文未明言的身份，保留其范围上的含蓄。
- source_word: γερουσία
  choice: 长老议会
  rationale: 该词指由长老组成的正式议事机构；“长老议会”既表达其制度性质，也便于现代读者理解。
- source_word: διδασκάλῳ Πτολεμαίου τοῦ βασιλέως
  choice: 国王托勒密的老师
  rationale: 按与格收信人结构及属格关系直译，清楚表达亚里斯多布与托勒密王的关系；“老师”自然且不把职责过度限定为私人导师。
- source_word: ὄντι δὲ ἀπὸ τοῦ τῶν χριστῶν ἱερέων γένους
  choice: 他出身于受膏祭司的家族
  rationale: χριστῶν 在这里是“受膏的”，修饰复数“祭司”，并非基督论称号；γένους 表示家族、族系或世系，正文采用自然的“家族”。
- source_word: χαίρειν καὶ ὑγιαίνειν
  choice: 致意，祝你们安康
  rationale: 这是书信开头的惯用问候语；按汉语书信表达译出问候与祝愿健康之意，而不机械译为“欢喜和健康”。
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用现代中文圣经语境中该犹太人名的常用译法，并与地名“犹太地区”区分。
theological_decisions:
- issue: τῶν χριστῶν ἱερέων 中 χριστῶν 的含义
  choice: 受膏祭司
  alternative: 被分别为圣的祭司
  rationale: 希腊词在此取普通词义“受膏的”，描述祭司，与“基督”这一称号无关。“受膏”也比“分别为圣”更直接保留原词所表达的膏立意象。
- issue: γένους 所表达的亲属或世系关系
  choice: 家族
  alternative: 世系
  rationale: “家族”符合现代汉语并保留出身关系；脚注提示“世系”这一更强调血统延续的可能表达，不把原文精确程度说得过满。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以破折号标出插入的身世说明，使较长的书信抬头关系清楚。保留首个群体“在犹太地区的人”的宽泛说法，不擅自补成“犹太人”；结尾按汉语习惯译为“致意，祝你们安康”。
