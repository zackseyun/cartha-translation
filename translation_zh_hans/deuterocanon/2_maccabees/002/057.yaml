  yaml_path: translation/deuterocanon/2_maccabees/002/057.yaml
  text: But to go into detail[a], and to make a discourse into a full walk-through, and to be overly occupied with the particulars, belongs to the originator of the history;
translation:
  language: zh_hans
  text: 至于深入探讨[a]，用言辞作一番铺陈，并过多地钻研各项细节，那是原史书的作者的职责；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“深入其中，并在言辞中作一番漫游”。希腊原文用“踏入”和“漫步”的生动比喻，描写更深入、更铺展的论述。
    reason: 保留原文修辞比喻及可行的较直译表达。
lexical_decisions:
- source_word: ἐμβατείνειν
  choice: 深入探讨
  rationale: 该词本有“踏入、深入”之意；在这里指对题材作更深入、更详尽的论述。“深入探讨”既保留进入深处的意象，也符合现代汉语表达。
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: 用言辞作一番铺陈
  rationale: 原文直译近于“在言辞中走一程”，是描写展开篇幅、从容详述的鲜明比喻。“作一番铺陈”自然地表达扩展论述之意，同时略微保留展开行进的动态感。
- source_word: πολυπραγμονεῖν
  choice: 详加考究
  rationale: 该动词可指过多地忙于某事，语境中是逐项细究。译作“详加考究”表达繁细用功的意味，又避免误解为干涉他人事务；其略带过度的色彩由并列语境体现。
- source_word: ἐν τοῖς κατὰ μέρος
  choice: 对各项细节
  rationale: κατὰ μέρος 指逐项、个别的事项；“各项细节”准确体现原文对一项项具体内容的关注。
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: 原史作者
  rationale: 罕见词 ἀρχηγενέτης 指最初创作或发起者。此处与节录者相对，所指是原本历史著作的作者；“原史作者”简洁保留这一分别。
- source_word: καθῆκε
  choice: 是……的本分
  rationale: 该动词表示某事适合某人、归某人承担。“本分”在此表达这类详尽写作是原史作者应当承担的工作。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代书面汉语。句中保留原文三个并列不定式结构的层层推进，并以“本分”清楚表达 καθῆκε 的职责意味；分号承接上下文尚未完结的对比结构。
