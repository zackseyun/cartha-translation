  yaml_path: translation/deuterocanon/2_maccabees/002/026.yaml
  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but a matter of sweat and sleeplessness;
translation:
  language: zh_hans
  text: 至于我们这些承担编写缩编本之劳苦的人，这项工作并不容易；它需要汗水和不眠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμῖν μὲν τοῖς
  choice: 至于我们这些……的人
  rationale: 用“至于……来说”的汉语结构表达与格所标示的承受者，并保留作者以复数自称的语气；“μὲν”在上下文中引出一面的陈述。
- source_word: τὴν κακοπάθειαν ἐπιδεδιγμένοις
  choice: 承担……之苦
  rationale: ἐπιδεδιγμένοις为完成时中间语态分词，表示已经把艰苦工作承接下来且其影响仍在；“承担……之苦”同时保留主动委身与艰辛之意。
- source_word: τῆς ἐπιτομῆς
  choice: 缩编
  rationale: ἐπιτομή在此指把较长著作删削浓缩的工作，也可兼指其成果；“缩编”在现代汉语中清楚表达此处的编辑行为。
- source_word: οὐ ῥᾴδιον
  choice: 这项工作并不容易
  rationale: 原文省略了汉语所需的主语；依下句τὸ πρᾶγμα补作“这项工作”，自然表达其不易。
- source_word: ἱδρῶτος δὲ καὶ ἀγρυπνίας
  choice: 而是要流汗、熬夜的
  rationale: 保留“汗水”和“不眠”的具体形象，同时用现代汉语“流汗、熬夜”传达劳苦和夜间不睡的实际代价。
- source_word: τὸ πρᾶγμα
  choice: 这项工作
  rationale: πρᾶγμα指眼前所说的缩编事务；译作“工作”比泛泛的“事情”更切合编纂语境。
