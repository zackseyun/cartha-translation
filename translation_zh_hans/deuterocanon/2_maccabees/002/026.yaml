  rationale: 修订将“缩编”明确为“编写缩编本”，以对应ἐπιτομή在此处所涉及的编纂工作；并以分号后的“它需要”表达原文对该工作的补充说明，保留“汗水”和“不眠”的具体劳苦意象。脚注保留词汇替代信息，并调整为与正文“缩编本”的用法一致。
