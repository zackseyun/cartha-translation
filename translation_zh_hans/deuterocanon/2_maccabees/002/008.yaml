  choice: 按照所提供的希腊文，译成一则简短的颂赞语，并以把不敬者“交了出去”结束；用脚注说明源数据所标示的重大不吻合。
  alternative: 依据其他版本或抄本重构可能更长、与上下文更连贯的经文。
  rationale: 现有希腊文见证很短，放在《马加比二书》2:8的上下文中显得突兀。为坚持原文证据优先，不以其他版本补写所提供文本中没有的内容，并公开保留文本不确定性。
- issue: ἔδωκεν所指交付对象或结果未明
  choice: 译作“交了出去”，不补出交给谁、交于何种刑罚。
  alternative: 译作“交给敌人”“交付惩罚”或其他带明确结果的表述。
  rationale: 所提供的短句没有间接宾语或结果补语；保留其语义张力可避免将上下文推测写入正文。
