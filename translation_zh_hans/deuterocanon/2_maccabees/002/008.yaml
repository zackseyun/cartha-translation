lexical_decisions:
- source_word: κατὰ πάντα
  choice: 在一切事上都
  rationale: 表达全面、无所不包的强调，同时保持现代汉语的自然庄重；与后面的“当受颂赞”连用，避免生硬直译。
- source_word: εὐλογητὸς
  choice: 当受颂赞
  rationale: 在颂赞语境中既保留“称颂、祝颂”的礼仪色彩，也比容易产生“蒙福”歧义的“有福”更清楚地指向人对上帝的颂赞。
- source_word: ὁ θεός
  choice: 上帝
  rationale: 按现代标准汉语采用常见、庄重的神称；定冠词无需单独译出。
- source_word: ἔδωκεν
  choice: 交了出去
  rationale: 原词本义为“给、交出”；因宾语是人，译为“交了出去”比单说“给了”自然，同时不擅自补明交给谁或交付的具体结果。
- source_word: τοὺς ἀσεβήσαντας
  choice: 那些行了不敬之事的人
  rationale: 保留不定过去时分词的行为性，并体现ἀσεβέω所含对神圣之事不敬、行事不虔的意味；不将其静态化为“恶人”，也不把语义收窄为“亵渎圣物”。
theological_decisions:
