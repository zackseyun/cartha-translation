  yaml_path: translation/deuterocanon/2_maccabees/002/015.yaml
  text: 'And the prayer had this form: “Lord God[a], creator of all things, the fearful and mighty and righteous and merciful one[c][b], the only king and good one,”'
translation:
  language: zh_hans
  text: 这祷告是这样的：“主上帝啊，万物的创造者，可畏[a]、大能、公义[b]、怜悯的那一位，独一的君王、良善[c]的那一位，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可畏”也可译作“令人敬畏”，原词可指使人惧怕或肃然敬畏。
    reason: lexical_alternative
  - marker: b
    text: “公义”也可译作“公正”。
    reason: lexical_alternative
  - marker: c
    text: “良善”也可译作“仁厚”或“慈善”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: 这祷告是这样的
  rationale: 这是引出祷告正文的惯用表达；译文自然简洁，同时保留“如下、这样”的结构。
- source_word: Κύριε ὁ θεός
  choice: 主上帝啊
  rationale: 表示直接呼告；“啊”自然体现希腊语呼格语气，“主”保留 κύριος 的神圣称号。
- source_word: ὁ πάντων κτίστης
  choice: 万物的创造者
  rationale: κτίστης 指创造者或建立者，πάντων 在此概括一切受造之物。
- source_word: ὁ φοβερὸς
  choice: 可畏
  rationale: 该词指使人产生敬畏或惧怕者；“可畏”兼顾神圣威严和令人畏惧的语义。
- source_word: ὁ ἰσχυρὸς
  choice: 大能
  rationale: 在描述上帝属性的语境中，“大能”自然、庄重，并准确表达强有力。
- source_word: δίκαιος
  choice: 公义
  rationale: 既表达道德正直，也可涵盖公正施断的意义，适合神性属性的表述。
- source_word: ἐλεήμων
  choice: 怜悯人
  rationale: 明确表达主动向人施怜悯的属性，比单用名词式“怜悯”更符合现代汉语。
- source_word: ὁ μόνος βασιλεὺς
  choice: 唯一的君王
  rationale: μόνος 强调独一性；“君王”保留 βασιλεύς 的王权称号。
- source_word: χρηστός
  choice: 仁善
  rationale: χρηστός 可表示良善、仁慈、厚道；“仁善”在此兼具良善与待人慈厚之意。
theological_decisions:
- issue: 神圣呼告中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: 此处是对上帝的称呼，“主”保留其神圣称号性质；“主人”会使语域偏向一般人际关系。
- issue: δίκαιος 作为上帝属性的译法
  choice: 公义
  alternative: 公正
  rationale: “公义”可同时保留道德正直与秉公判断两层意味；脚注保留偏司法性的“公正”。
- issue: 连续定冠词及形容词实体化的表达
  choice: 可畏、大能、公义、怜悯人的那一位；仁善的那一位
  alternative: 可畏、大能、公义、怜悯；仁善
  rationale: 用“那一位”适度反映希腊语冠词使形容词实体化的结构，避免把原文仅处理为松散的属性清单。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主上帝啊”体现直接呼告；属性列举保留原文的节奏和实体化表达。本节在所给希腊文本中句意尚未完结，因此末尾保留逗号，不擅自补成完整句。
