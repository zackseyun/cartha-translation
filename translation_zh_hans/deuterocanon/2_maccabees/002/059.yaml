base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/059.yaml
  text: Therefore let us begin the narrative from this point[a], adding only this much to what has been said before; for it is foolish to be excessive before the history[b], but to abridge the history itself.
translation:
  language: zh_hans
  text: 所以，我们就从这里开始叙述吧，只在前面所说的话之后再加上这一点：在历史正文之前说得过多，却把历史本身缩短，实在是愚蠢的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: 所以……从这里
  rationale: 兼顾 οὖν 的承接、推论作用和 Ἐντεῦθεν 从前言转入正文的篇章指向，符合现代汉语表达。
- source_word: ἀρξώμεθα τῆς διηγήσεως
  choice: 我们就……开始叙述吧
  rationale: ἀρξώμεθα 是第一人称复数劝勉虚拟式；“开始……吧”保留作者邀请读者一同转入叙事的语气。διήγησις 在此作叙述行为理解。
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: 只在前面所说的话之后再加上这一点
  rationale: ἐπιζεύξαντες 表示把补充话语接续在前文之后；τοσοῦτον 限定所加内容仅为这一点。
- source_word: εὔηθες
  choice: 愚蠢
  rationale: 这里是对不当写作安排的负面评价，意为欠缺判断、并不明智；“愚蠢”保留原文鲜明的修辞力度。
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: 在历史正文之前说得过多
  rationale: πλεονάζειν 在语境中指前置材料过多；补出“说得”使汉语自然，“历史正文”明确 ἱστορία 指主体历史记述。
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: 却把历史本身缩短
  rationale: ἐπιτέμνειν 指截短或压缩，与前文“说得过多”形成刻意对照；“本身”突出前言和主体记述之间的反差。
