  terminology: 建议将Ναναίου统一译作“纳奈亚”，并以脚注说明“娜奈娅”为另一种音译。τέμενος译“圣域”，περίβολος译“围院”，ἱερόν译“神庙”，可保留原文的空间及用词区分。安条克保留通行译名。
