  text: And when the priests of Nanea had set them out[a], and he had come with a few men into the enclosure of the sanctuary, they shut the temple as soon as Antiochus entered[c][b],
translation:
  language: zh_hans
  text: 纳奈亚[a]的祭司把那些东西陈列出来[b]；他带着几个人进入圣域的围院。安条克一进入神庙，他们就把神庙关了起来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “纳奈亚”译自希腊文Ναναίου（Nanea）；也可音译为“娜奈娅”。
    reason: lexical_alternative
  - marker: b
    text: “那些东西”在本节希腊文中没有明确说明所指，可能承接原叙事前文提到的物品。
    reason: cross_reference
  - marker: c
    text: 本节似乎属于安条克与纳奈亚神庙的叙事（参《马加比二书》1:13–15），与本章上下文表面上并不衔接；这里仍按所给希腊文见证译出。
    reason: textual_variant
lexical_decisions:
- source_word: προθεμένων αὐτά
  choice: 把那些东西摆出来
  rationale: προτίθημι表示把物品放置、陈列出来；αὐτά没有明说所指，译作“那些东西”既自然，也保留原文指代上的含混。
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: 娜娜雅的祭司
  rationale: 按希腊文属格结构直译。Ναναίου在此指神名，采用现代汉语中较易读、也能反映希腊语形式的音译“娜娜雅”。
- source_word: κἀκεῖνον προσελθόντος μετʼ ὀλίγων
  choice: 他也带着几个人来到
  rationale: κἀκεῖνον保留为“他”，不擅自补明身份；μετʼ ὀλίγων按语境补出“几个人”，而不加入“仅仅”等原文未明示的强调。
- source_word: εἰς τὸν περίβολον τοῦ τεμένους
  choice: 圣所的围院内
  rationale: περίβολος指围起来的区域，τέμενος指划归神明的圣域；“圣所的围院”兼顾空间关系与通俗可懂性。
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: 把殿门关上了
  rationale: συγκλείω意为关闭、封闭；汉语说“把殿门关上”较自然。原文宾语是ἱερόν（殿或神庙），译文以转喻表达关闭建筑入口，不推断为“锁上”。
- source_word: ὡς εἰσῆλθεν Ἀντίοχος
  choice: 安条克一进去
  rationale: ὡς加简单过去时在此表示紧接发生的时间关系；“一……就……”传达行动的即时性。Ἀντίοχος按常见汉译作“安条克”。
