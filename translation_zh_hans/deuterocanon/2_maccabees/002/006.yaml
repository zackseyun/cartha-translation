revisions:
- from: 娜娜雅的祭司把那些东西摆出来[a]，他也带着几个人来到圣所的围院内；安条克一进去，他们就把殿门关上了[b]。
  to: 纳奈亚[a]的祭司把那些东西陈列出来[b]；他带着几个人进入圣域的围院。安条克一进入神庙，他们就把神庙关了起来[c]。
  rationale: 修订保留αὐτά及前置“他”的指代含混，并保留ὡς εἰσῆλθεν所表示的紧接时间关系；同时移除无根据的“也”，避免将神庙具体化为殿门，并以更稳妥的神名音译及独立脚注完整呈现审校记录中的词汇与文本问题。
