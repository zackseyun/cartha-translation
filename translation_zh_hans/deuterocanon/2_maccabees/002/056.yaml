base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/056.yaml
  text: For just as[a], in the case of a new house, the architect must take thought for the whole foundation, but the one undertaking to decorate and paint it must examine the things suitable for adornment, so also, I think, it is with us.
translation:
  language: zh_hans
  text: 正如建造一所新房时，建筑师必须顾及整个根基，而着手布置并绘饰房屋的人必须考察哪些东西适合用来美化；我想，就我们而言也是这样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: 正如
  rationale: 引出比喻；中文以“正如”自然承接上下文，γάρ的解释性语气由整体句势体现。
- source_word: τῆς καινῆς οἰκίας
  choice: 建造新房时
  rationale: οἰκία取具体的“房”；增补“建造……时”以自然表达建筑语境，不改变原意。
- source_word: ἀρχιτέκτονι
  choice: 建筑师
  rationale: 指统筹设计和建造的负责人；“建筑师”简明保留其专业角色。
- source_word: τῆς ὅλης καταβολῆς
  choice: 整个根基
  rationale: καταβολή在此指奠基或基础工程；保留其基础性意象，并以“整个”对应ὅλης。
- source_word: φροντιστέον
  choice: 必须顾全
  rationale: 希腊文动词形容词表达必要性；“顾全”兼顾周密考虑和统筹整体的含义。
- source_word: ἐγκαινίζειν
  choice: 装饰
  rationale: 在与“绘画”和“美化”并列的房屋语境中，指整治、装设或装饰，而非礼仪性的奉献。
- source_word: ζωγραφεῖν
  choice: 绘画
  rationale: 保留在房屋上作画或彩绘的具体动作。
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν
  choice: 哪些东西适合用来美化
  rationale: 保持对象的开放性，不把τὰ ἐπιτήδεια限定为材料；“适合用来美化”自然表达用途和合宜性。
- source_word: ἐξεταστέον
  choice: 必须考察
  rationale: 既表达必要性，也保留审查、仔细衡量的力度。
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: 我想，我们的工作也是这样
  rationale: 保留δοκῶ的谦抑插语，并按上下文将“在我们身上/我们的情形”自然表达为“我们的工作”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留建筑与修饰工作的对比，以及作者“我想”的谦抑语气；分号使较长的类比句层次清楚。
