review_pass:
  verdict: revise
  source_fidelity: 译文总体保留了建筑师须顾及整体基础、负责后续修饰者须审察适宜之物的对比。不过，ἐπὶ ἡμῶν仅指“就我们而言／在我们的情形中”，并未明说“我们的工作”；原译增入“工作”而缩窄了指涉。
  naturalness: “着手装饰和绘画的人”略显生硬，且“绘画的人”在现代汉语中容易理解为泛指画画者。改作“着手布置并绘饰房屋的人”更清楚地呈现同一人所承担的房屋修饰工作。
  terminology: “建筑师”“整个根基”“必须考察”均可。以“布置”译ἐγκαινίζειν并在脚注保留“装饰／装设”的可能性，可避免将该词的含义固定为单纯装饰。
  issues:
  - severity: medium
    issue: “我们的工作也是这样”超出了ἐπὶ ἡμῶν的明示范围。
    rationale: 原文只说“在我们这方面／就我们而言也是如此”，没有明确限定为“工作”。应保留较宽的指涉。
  - severity: low
    issue: “着手装饰和绘画的人”搭配不够自然，且可能弱化房屋对象。
    rationale: ἐγκαινίζειν与ζωγραφεῖν共同描述对房屋的布置、绘饰；明确“房屋”并使用“绘饰”更合现代书面汉语。
  revised_text: 正如建造一所新房时，建筑师必须顾及整个根基，而着手布置并绘饰房屋的人必须考察哪些东西适合用来美化；我想，就我们而言也是这样。
  revised_footnotes:
