- from: 正如建造新房时，建筑师必须顾全整个根基，而着手装饰[a]和绘画的人必须考察哪些东西适合用来美化；我想，我们的工作也是这样。
  to: 正如建造一所新房时，建筑师必须顾及整个根基，而着手布置并绘饰房屋的人必须考察哪些东西适合用来美化；我想，就我们而言也是这样。
  rationale: 将末句改为“就我们而言也是这样”，以忠实保留原文未限定的ἐπὶ ἡμῶν；调整后半句的表达，使房屋布置与绘饰的关系在中文中更明确自然。脚注锚点[a]应置于“布置”之后。
