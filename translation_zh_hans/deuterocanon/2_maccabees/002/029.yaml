base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/029.yaml
  text: For just as the architect of a new house must take thought for the whole structure[a], but the one undertaking to decorate it with painted ornament must consider the things suitable for adornment, so also, I think, it is with us.
translation:
  language: zh_hans
  text: 因为，正如建造新房的建筑师必须为整个奠基工程费心，而着手装点[a]并彩绘房屋的人必须考察哪些东西适合用来美化；我想，我们的情形也是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “装点”也可较广义地理解为使房屋完工或加以布置。
    reason: ἐγκαινίζειν在此与“彩绘”和“美化”相连，宜译出装点之意；但其具体范围并不完全确定，故保留较宽的词义可能。
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: 因为，正如
  rationale: 既保留γὰρ承接上文的解释作用，也自然引出καθάπερ所带领的比喻。
- source_word: ἀρχιτέκτονι
  choice: 总建筑师
  rationale: 指统筹设计和施工的首要建造者；“总建筑师”比单纯“建筑师”更能体现其主管全局的角色。
- source_word: τῆς ὅλης καταβολῆς
  choice: 整个奠基工程
  rationale: καταβολή在房屋语境中首先涉及奠基或基础的铺设；译作“奠基工程”既保留其具体意象，又能涵盖过程，而不泛化成整座建筑。
- source_word: φροντιστέον
  choice: 必须顾全
  rationale: 这个动词性形容词表达必要性；“必须顾全”兼顾义务语气和对整体周密筹划的含义。
- source_word: ἐγκαινίζειν
  choice: 装饰
  rationale: 该词可有启用、更新、完工或装点等含义；与ζωγραφεῖν及διακόσμησιν并列时，建筑装饰最合语境，但不加入原文没有明确表达的奉献礼含义。
- source_word: ζωγραφεῖν
  choice: 绘画
  rationale: 保留一般的绘画、彩绘含义，不把技法过度限定为蜡画等特定形式。
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν
  choice: 哪些东西适合用来美化
  rationale: 保留τὰ ἐπιτήδεια的宽泛性，可指合宜之物、材料或手段；现代中文表达自然。
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: 我想，我们的情形也是这样
  rationale: 保留δοκῶ的审慎自陈语气，以及类比落实到作者自身工作的结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留希腊文“正如……也是这样”的完整类比结构；不依英语审校层把καταβολή泛化为“整个结构”，也不把ζωγραφεῖν技术化为特定画法。
