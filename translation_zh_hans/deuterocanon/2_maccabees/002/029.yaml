  to: 因为，正如建造新房的建筑师必须为整个奠基工程费心，而着手装点[a]并彩绘房屋的人必须考察哪些东西适合用来美化；我想，我们的情形也是这样。
  rationale: 修订使建筑师与装饰者的职责对照更贴近希腊文，并明确装点和彩绘的对象。将“顾全”改为“为……费心”，更准确表达φροντιστέον所要求的周密关切；脚注保留ἐγκαινίζειν的合理词义弹性。
