base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/011.yaml
  text: And after many years had passed[a], when it pleased God, Nehemiah, having been sent by the king of Persia, sent the descendants of the priests who had hidden it to get the fire.
translation:
  language: zh_hans
  text: 许多年过去后，到了上帝认为合宜的时候[a]，尼希米奉波斯王差遣，便派那些曾把火藏起来的祭司的后代去取火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到了上帝看为好的时候”或“到了上帝所喜悦的时候”。
    reason: 说明 ἔδοξεν τῷ θεῷ 可按希腊语惯用表达作不同但相近的翻译。
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: 许多年过去后
  rationale: 这是属格独立结构，表示经过了一段时间；ἱκανῶν 在此指“许多、相当多”，译文以自然的汉语时间短语表达。
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: 到了上帝认为合宜的时候
  rationale: ἔδοξεν 加与格表示“在……看来是好的、……认为合宜”；这样既保留上帝所定时机的含义，也不把措辞强化为原文没有明说的神学主张。
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: 尼希米奉波斯王差遣
  rationale: 不定过去时被动分词表示尼希米先受王差遣；ἀπό 在这里标明差遣者。汉语用“奉……差遣”简洁而准确。
- source_word: τοὺς ἐκγόνους τῶν ἱερέων τῶν ἀποκρυψάντων
  choice: 那些曾把火藏起来的祭司的后代
  rationale: ἐκγόνους 泛指后代，不限于儿子；第二个属格复数关系分词修饰祭司。原文未明说“藏”的宾语，但上下文表明所藏的是火，汉语须补出。
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: 派……去取火
  rationale: πέμπω 与 ἐπί 加宾格在此表示为了寻找或取回某物而差派；“去取火”符合叙事语境和现代汉语习惯。
theological_decisions:
- issue: ὅτε ἔδοξεν τῷ θεῷ 所表达的上帝旨意与时机
  choice: 到了上帝认为合宜的时候
  alternative: 到了上帝所喜悦的时候
  rationale: 所选译法贴近“在上帝看来是好的”这一希腊语惯用表达，承认时机出于上帝的判断，同时避免将其无必要地解释为情感意义上的“喜悦”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“奉波斯王差遣”压缩分词结构，“祭司的后代”保留世代范围，不窄化为“儿子”。脚注标记紧接其所说明的神圣时机短语。
