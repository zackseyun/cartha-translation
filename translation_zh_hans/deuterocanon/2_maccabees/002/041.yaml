  yaml_path: translation/deuterocanon/2_maccabees/002/041.yaml
  text: Likewise also Judas gathered together for us all the things that had been scattered because of the war that had occurred[b][a], and they are with us.
translation:
  language: zh_hans
  text: 同样，犹大也为我们把因那场战争而分散的一切都收集起来了；这些如今都在我们这里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直译：“它在我们这里。”希腊语以中性复数作主语时，谓语动词常用单数；这里所指仍是前面的“一切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως δὲ καὶ
  choice: 同样……也
  rationale: 承接上文并表达类比与递进；采用现代汉语自然语序，避免生硬叠译连接词。
- source_word: Ἰούδας
  choice: 犹大
  rationale: 采用中文圣经传统中该人名的通行译法，指犹大·马加比。
- source_word: τὰ διεσπεπτωκότα
  choice: 散失的一切
  rationale: 完成时分词表示已经散落、分散而处于该状态的事物；原文未明确限定为何物，因此不在正文中擅加“文献”或“书卷”。
- source_word: διὰ τὸν γεγονότα πόλεμον
  choice: 因那场战争
  rationale: 保留原因关系；指示性的“那场”自然体现这是一场已经发生、为读者所知的战争，无须在中文中冗赘译出“发生过的”。
- source_word: ἡμῖν
  choice: 为我们
  rationale: 将与格理解为受益与格，表示犹大为说话者所代表的群体收集这些事物。
- source_word: ἐπισυνήγαγεν πάντα
  choice: 把……一切都……收集起来了
  rationale: “收集起来”体现复合动词汇聚到一处的含义，“一切都”保留 πάντα 所强调的完整性。
- source_word: καὶ ἔστιν παρʼ ἡμῖν
  choice: 如今都在我们这里
  rationale: παρά 加与格表示在某人身边或掌握之中；“如今”自然表达当前仍在的结果状态，“都”按中性复数所指译为复数含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“散失”既涵盖因战争而散落、失散的状态，又不武断认定所指必为文献；句末用“都在我们这里”传达现有、可掌握之意。
