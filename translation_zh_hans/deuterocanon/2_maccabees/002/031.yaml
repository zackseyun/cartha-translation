  text: But one should allow the one producing the epitome to aim at brevity of expression and to forgo the elaborate treatment of the subject matter[a].
translation:
  language: zh_hans
  text: 至于编写节本的人追求言辞简练，并省去对所论题材的详尽铺陈，这应当准许。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύντομον τῆς λέξεως
  choice: 言辞简练
  rationale: σύντομον作名词性用法，表示简短、精练；λέξις在此指措辞或表达方式，而非单个词语。
- source_word: μεταδιώκειν
  choice: 追求
  rationale: 保留该动词努力寻求、以之为目标的动态意味，现代汉语也自然。
- source_word: τὸ ἐξεργαστικὸν τῆς πραγματίας
  choice: 把所论之事详尽展开
  rationale: ἐξεργαστικόν指充分加工、细致铺陈；πραγματεία在此是所处理的题材或内容。译文以动词结构表达希腊文抽象名词结构，更符合现代汉语。
- source_word: παραιτεῖσθαι
  choice: 不求
  rationale: 在此表示放弃、免去或不承担详尽铺陈；“不求”既体现主动舍弃，也与前句“追求”形成自然对照。
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: 编写节本的人
  rationale: μετάφρασις虽可指翻译，但本书序言的语境是将古利奈人雅松的五卷著作编成节本，因此按上下文译为“节本”，并以脚注保留词义歧义。
- source_word: συγχωρητέον
  choice: 应当准许
  rationale: 该动词性形容词表达应予容许、应予体谅的义务或适宜性，译文保留其非人称规范语气。
theological_decisions:
- issue: μετάφρασις在本节中的含义
  choice: 节本／删节编写
  alternative: 翻译
  rationale: 《马加比二书》序言明确说明作者在缩编一部五卷著作，因此此处语境支持“编写节本”。不过该希腊词确实也可表示“翻译”，故以脚注明示，不把词汇歧义完全隐藏。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“言辞简练”与“详尽展开”形成清楚对照；调整希腊文抽象名词结构为汉语动词结构，以兼顾原意和可读性。
