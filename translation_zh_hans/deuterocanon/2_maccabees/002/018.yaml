base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/018.yaml
  text: Gather our dispersion, free those who are enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: zh_hans
  text: 求你聚集我们流散的人[a]，释放那些在列国中为奴的人；求你垂顾那些受人轻视、遭人厌弃的人[b]，使列国知道你是我们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译作“聚集我们的流散”，以“流散”这一抽象名词指流散在各处的群体。
    reason: lexical_alternative
  - marker: b
    text: “垂顾”也可译作“留意”或“眷顾”；原文是求上帝转眼关注这些受轻视、遭厌弃的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: 求你聚集
  rationale: 这是祈求中的不定过去时命令式；“求你聚集”既保留命令式的迫切，也符合现代汉语祷告语体。
- source_word: τὴν διασπορὰν ἡμῶν
  choice: 我们流散的人
  rationale: διασπορά形式上是“流散”这一抽象名词，此处以抽象名词指流散的群体。正文采用自然的集合性表达，脚注保留原文形式。
- source_word: ἐλευθέρωσον
  choice: 释放
  rationale: 该词明确表示使人获得自由；“释放”保留解除奴役的含义。
- source_word: τοὺς δουλεύοντας
  choice: 为奴的人
  rationale: δουλεύω在列国压迫的语境中强调受奴役的处境，并非一般性的服事。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 在列国中
  rationale: ἔθνη指以色列民流散其间的各民族；“列国”简洁、庄重，也避免把它预先限定为宗教意义上的“外邦人”。
- source_word: τοὺς ἐξουθενημένους
  choice: 受人轻视的人
  rationale: 完成时被动分词表示被视为无足轻重、遭受蔑视的人。
- source_word: καὶ βδελυκτοὺς
  choice: 遭人厌弃的人
  rationale: βδελυκτός表达成为憎恶、嫌弃对象的状态；结合上下文用被动式汉语呈现。
- source_word: ἔφιδε
  choice: 求你垂顾
  rationale: 该命令式要求上帝转眼关注他们；“垂顾”保留祷告语体，同时不把隐含的怜悯过度明说。
- source_word: καὶ γνώτωσαν τὰ ἔθνη
  choice: 使列国知道
  rationale: 第三人称命令式在汉语祈求句中自然表达为“使……知道”，呈现愿列国得知的诉求。
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: 你是我们的上帝
  rationale: 直接保留原文的关系性与盟约性宣认，并突出第二人称主语。
theological_decisions:
- issue: δουλεύοντας在列国压迫语境中的含义
  choice: 为奴的人
  alternative: 服事的人／受辖制的人
  rationale: 上下文祈求“释放”，表明所指是非自愿的奴役状态；译作“为奴”既准确又不淡化压迫。
- issue: διασπορά应按抽象名词直译还是按群体意义表达
  choice: 我们流散的人
  alternative: 我们的流散／我们分散在各处的人
  rationale: 原文以抽象名词代指流散共同体。正文采用现代汉语可理解的集合表达，脚注说明字面形式，从而兼顾自然度与原文意象。
- issue: ἔφιδε是否明确译出怜悯
  choice: 垂顾
  alternative: 怜悯／眷顾／看顾
  rationale: 原词首先表示注视、留意；怜悯可由祷告语境推知，但不宜在正文中把它明定为词义。
translation_notes:
  register: 采用自然、庄重的现代汉语祷告语体。用重复的“求你”理清并列祈求；分号区分解救流散者的请求与愿列国认识上帝的结果性请求。所有脚注标记均已置于正文相应位置。
