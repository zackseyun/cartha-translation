  yaml_path: translation/deuterocanon/2_maccabees/002/033.yaml
  text: And some of those who had followed came near to mark the way[a], but they were not able to find it.
translation:
  language: zh_hans
  text: 跟随他们的人中有几个人上前，想要标明那条路[a]，却没有找到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那条路”也可译作“道路”、“路径”或“路线”。希腊语 ὁδός 可按语境指道路、路径或行进路线。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: 上前
  rationale: 该词是 προσέρχομαι 的不定过去时分词，表示向有关地点走近；“上前”自然保留其趋近之意，同时不擅自补明趋近的具体对象。
- source_word: τινὲς τῶν συνακολουθούντων
  choice: 有几个跟随的人
  rationale: 保留 τινὲς τῶν 的部分结构和 συνακολουθέω 所表达的随同行动，不将他们解释性地称为“同伴”。
- source_word: ὥστε ἐπισημήνασθαι τὴν ὁδόν
  choice: 想要把路线标记下来
  rationale: 此处 ὥστε 加不定式表达所求目的；ἐπισημαίνομαι 表示作出标记，τὴν ὁδόν 在语境中可指道路、路径或行进路线。“路线”较自然地涵盖其语境功能。
- source_word: οὐκ ἠδυνήθησαν
  choice: 却没能
  rationale: 明确表达能力或结果上的不能；“却”自然呈现企图与失败之间的转折。
- source_word: εὑρεῖν
  choice: 找到
  rationale: 该不定式受 ἠδυνήθησαν 支配。希腊文未明说宾语，中文也可不补代词，从而保留所寻找者究竟是路线还是相关地点的语境含混。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“把路线标记下来”符合当代汉语表达；末句不补“它”，以免消除希腊文中宾语未明说所留下的含混。
