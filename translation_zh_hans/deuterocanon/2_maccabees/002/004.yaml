    rationale: κατεκόπησαν为复数，叙述对象是首领及其随从军队；草案在插入“这支军队”后使用省略主语的“被砍杀了”，容易让读者理解为仅军队被杀。
  revised_text: 首领和随同他的军队来到后，这支军队虽然看来无人能挡[a]，他们却在娜娜娅的神庙中被砍杀；因为侍奉娜娜娅的祭司施了诡计。
