base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/004.yaml
  text: For when the leader and the force around him[a], which seemed invincible, had arrived, they were cut down in the temple of Nanaia, because the priests attending Nanaia had used deceit.
translation:
  language: zh_hans
  text: 因为那首领和随同他的军队来到时，这支军队看似无人能挡[a]，却在娜娜娅的神庙里被砍杀了；原来，侍奉娜娜娅的祭司施了诡计。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“似乎不可抗拒”。这里的希腊语表达较难确定，意思是这支军队看来无法抵挡。
    reason: 词义备选
lexical_decisions:
- source_word: γενόμενος
  choice: 来到时
  rationale: 此处分词结合叙事语境，最自然地表示“来到、抵达”，而非“成为”。希腊文在数的一致上较为突兀，中文以时间从句顺畅表达先后关系。
- source_word: ἡγεμών
  choice: 首领
  rationale: 保留泛指的领导、统率者含义，不把其职分过度限定为总督或将领。
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  choice: 随同他的军队
  rationale: δύναμις在军事叙事中指军队或兵力；περὶ αὐτόν指围绕并随同他的人。
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: 看似无人能挡
  rationale: 在军事语境中指这支军队似乎无法抵挡；此译保留“看似”的表象意味，并用脚注提示可替代表达。
- source_word: κατεκόπησαν
  choice: 被砍杀了
  rationale: 被动形式描写暴力杀戮；“砍杀”保留动词的鲜明力度，又符合现代汉语。
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: 在娜娜娅的神庙里
  rationale: ἱερόν可指庙宇或圣所；因对象是异教女神，现代中文用“神庙”清楚自然。
- source_word: παραλογισμῷ χρησαμένων
  choice: 施了诡计
  rationale: 属格独立结构说明事件的手段或原因；παραλογισμός在这里指欺骗、计谋。
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: 侍奉娜娜娅的祭司
  rationale: περὶ加宾格表示与娜娜娅相关、供职于其神庙的祭司；“侍奉”比字面的“围绕”更符合中文。
theological_decisions:
- issue: 女神名Ναναία的译写
  choice: 娜娜娅
  alternative: 娜纳亚／娜奈娅
  rationale: 按希腊文音译专名而不翻译；“娜娜娅”贴近Ναναία的读音，也便于现代中文读者辨读。
- issue: ἀνυπόστατος的军事含义
  choice: 无人能挡
  alternative: 不可抗拒／无法抵挡
  rationale: 该词在此搭配军队，最可能表示无法与之对抗，而不是“没有实体”；保留“看似”以免把叙述中的表象绝对化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“却”凸显看似无敌与遭到砍杀之间的反差；分号后的“原来”自然引出祭司施诡计这一原因。所有脚注标记均已在正文中出现。
