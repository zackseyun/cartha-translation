    reason: lexical_alternative
lexical_decisions:
- source_word: συνορῶντες
  choice: 我们看到
  rationale: 该分词引出作者采取缩写工作的理由；“看到”简洁自然，并保留原文的认知意味。
- source_word: τὸ χῦμα τῶν ἀριθμῶν
  choice: 数字如洪流般繁多
  rationale: χῦμα描绘大量事物倾泻、堆积的鲜明意象；译文保留“洪流”的比喻，同时不把ἀριθμῶν擅自解释成“细节”或“事项”。
- source_word: τὴν οὖσαν δυσχέρειαν
  choice: 面临困难
  rationale: 表达确实存在的阅读或钻研障碍；结合中文句法处理为“使……面临困难”，自然地呈现与格所指的人。
- source_word: τοῖς θέλουσιν εἰσκυκλεῖσθαι
  choice: 那些想要深入……的人
  rationale: 罕见动词εἰσκυκλεῖσθαι含有进入其中、置身其中或逐步钻研的意味；“深入”在现代汉语中自然，又不过度限定其具体方式。
- source_word: τοῖς τῆς ἱστορίας διηγήμασιν
  choice: 这些历史叙事
  rationale: 既保留διηγήματα作为叙述、记述的意义，也用现代汉语简洁表达其与ἱστορία的关系。
- source_word: διὰ τὸ πλῆθος τῆς ὕλης
  choice: 材料浩繁
  rationale: ὕλη在此指写作所处理的材料或题材，而非本义的木材；“浩繁”准确传达πλῆθος所表示的庞大数量及由此造成的困难。
