  text: For[a], seeing the flood of numbers and the difficulty for those who wish to enter into the narratives of the history because of the abundance of material[b],
translation:
  language: zh_hans
  text: 因为我们看到数字如洪流般繁多[a]，又看到因材料浩繁，想要深入[b]这些历史叙事的人所面临的困难，
  philosophy: optimal-equivalence
  footnotes:
