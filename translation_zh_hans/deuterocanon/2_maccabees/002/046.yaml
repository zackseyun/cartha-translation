base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/046.yaml
  text: The matters concerning Judas Maccabeus and his brothers[a], and the purification of the greatest sanctuary, and the dedication of the altar,
translation:
  language: zh_hans
  text: 关于犹大·马加比和他兄弟们的事，以及至大的圣殿的洁净和祭坛的奉献礼[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祭坛的重新奉献礼”。希腊原文作“奉献礼”，但历史背景是祭坛受玷污后的恢复。
    reason: 保留ἐγκαινισμός的字面意义及历史语境所支持的另一译法。
lexical_decisions:
- source_word: Τὰ ... κατὰ τὸν Ἰούδαν
  choice: 关于犹大……的事
  rationale: 中性复数冠词与κατά加宾格引出与犹大有关的事项；此译法保留范围的宽泛性，不将其限定为“事迹”或“历史”。
- source_word: Ἰούδαν τὸν Μακκαβαῖον
  choice: 犹大·马加比
  rationale: 采用现代中文中清楚易认的专名与称号译法。
- source_word: τοὺς τούτου ἀδελφούς
  choice: 他的兄弟们
  rationale: 此处指犹大的亲生兄弟，故不用泛指同道或同胞的表达。
- source_word: τοῦ ἱεροῦ τοῦ μεγίστου
  choice: 至大圣殿
  rationale: ἱερόν在此指耶路撒冷圣殿；“至大”保留μεγίστου不寻常的最高级措辞，避免改释为原文没有的“至圣”。
- source_word: καθαρισμόν
  choice: 洁净
  rationale: 既自然简洁，又能表达圣殿受玷污后礼仪性的清洁与恢复。
- source_word: βωμοῦ
  choice: 祭坛
  rationale: 符合献祭语境中βωμός的标准中文表达。
- source_word: ἐγκαινισμόν
  choice: 奉献礼
  rationale: 该词表示启用、奉献；原文本身没有明确表达“再次”，故正文不直接译作“重新奉献”。
theological_decisions:
- issue: ἱερόν在犹太圣殿礼仪语境中的译法
  choice: 圣殿
  alternative: 圣所
  rationale: 这里所指的是耶路撒冷圣殿整体；“圣殿”在现代中文中更具体自然，而“圣所”可能被理解为殿内较狭窄的区域。
- issue: 祭坛奉献是否明确译为重新奉献
  choice: 正文作“奉献礼”
  alternative: 重新奉献礼
  rationale: 历史背景确为祭坛受玷污后的恢复，但ἐγκαινισμός本身没有明确的“重新”成分，因此正文保持原文张力，并在脚注交代语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。本句在希腊文中是未完的并列结构，末尾保留逗号，以衔接后文；不添加原文没有的“现在”等话语标记。
