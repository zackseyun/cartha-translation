base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/015.yaml
  text: But the priests[a], having thrown themselves down before the altar in their priestly robes, were calling out to heaven to the one who had given the law concerning deposits[b], that he should keep these things safe for those who had deposited them.
translation:
  language: zh_hans
  text: 祭司们身穿祭服，扑倒在祭坛前，向上天[a]呼求那位曾就受托保管之物颁布律法的，求他为交托这些财物的人妥善保全这些财物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上天”是对上帝的敬畏性称呼；原文也可直译为“向天呼求”。
    reason: 说明原文以“天”迂回指称上帝的用法。
  - marker: b
    text: 指交托圣殿代为保管的财物。
    reason: 交代“受托保管之物”在本段历史文化语境中的含义。
lexical_decisions:
- source_word: ῥίψαντες ἑαυτούς
  choice: 扑倒
  rationale: 保留ῥίπτω所表达的强烈、具体动作，比单用“俯伏”更能呈现祭司们在危急中把自己投伏于地的情景，同时符合现代汉语表达。
- source_word: ἐν ταῖς ἱερατικαῖς στολαῖς
  choice: 身穿祭服
  rationale: 简明呈现祭司所穿的礼仪服装，庄重而不使用生僻的宗教术语。
- source_word: ἐπεκαλοῦντο εἰς οὐρανόν
  choice: 向上天呼求
  rationale: 以“呼求”表达未完成时所体现的持续、迫切祷告，并保留原文以“上天”敬称上帝的委婉说法。
- source_word: τὸν περὶ παρακαταθήκης νομοθετήσαντα
  choice: 那位为寄存财物立法的
  rationale: “立法”保留νομοθετέω的法律意味；“寄存财物”说明παρακαταθήκη是交托他人保管的财物。
- source_word: τοῖς παρακαταθεμένοις
  choice: 为寄存者
  rationale: 指把财物交付保管的人；“寄存者”与前面的“寄存财物”保持同源词语之间的关联。
- source_word: ταῦτα σῶα διαφυλάξαι
  choice: 妥善保全这些财物
  rationale: “保全”表达使财物不受损失、完整留存的意思，“妥善”加强σῶα与διαφυλάξαι合用所含的安全守护意味。
theological_decisions:
- issue: 祷告中以“上天”作为敬称
  choice: 向上天呼求那位……
  alternative: 向上帝呼求／向天上的主呼求
  rationale: 希腊文明确使用εἰς οὐρανόν（向上天），随后以“那位……”指称上帝。译文保留这种敬畏性的委婉称呼，不把原文未明说的神名直接补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“扑倒”保留原文动作的力度；“寄存财物—寄存者”尽量重现希腊文名词与动词的词根联系。
