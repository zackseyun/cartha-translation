  source_fidelity: 译文总体准确保留了祭司身着祭服、在祭坛前投身俯伏、向“上天”呼求，以及求立下有关受托保管之物律法者保全财物的内容。“为寄存财物立法的”在汉语中结构悬置，容易被理解为祭司为财物立法；应明确其为“曾就受托保管之物颁布律法的那一位”。原文的 παρακαταθήκη 和 παρακαταθεμένοις 指受托保管的财物及交托者，译作“寄存”大体可通，但“交托保管”更符合古代法律及本段语境。
