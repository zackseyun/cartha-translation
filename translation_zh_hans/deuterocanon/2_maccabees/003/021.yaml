lexical_decisions:
- source_word: ἐλεεινή
  choice: 实在令人怜悯
  rationale: 该形容词表示“可怜、悲惨、令人哀怜”。译为自然的现代汉语判断语，保留原文强烈的感情色彩。
- source_word: τοῦ πλήθους
  choice: 众人
  rationale: πλῆθος在此指聚集的人群；“众人”简洁自然，也符合公共场景。
- source_word: παμμιγῆ
  choice: 全都一同
  rationale: 该词在这里强调全体混在一起、无一例外地作出同一反应；“全都一同”兼顾整体性和共同参与的意味。
- source_word: πρόπτωσιν
  choice: 俯伏在地
  rationale: πρόπτωσις基本意象是向前倒下或俯伏。此译保留可见的身体动作，不把它单纯解释为情绪崩溃。
- source_word: τοῦ μεγάλως ἀγωνιῶντος ἀρχιερέως
  choice: 大祭司又在极度焦灼中
  rationale: ἀγωνιάω表示强烈的焦虑、痛苦或挣扎，μεγάλως进一步加强程度；“极度焦灼”既有力度，又符合现代汉语表达。
- source_word: προσδο-
  choice: 等待着
  rationale: 所给希腊文在προσδο-处截断，很可能是表示期待、等候的词形开头；“等待着”保持语义保守，并以脚注说明不确定性。
