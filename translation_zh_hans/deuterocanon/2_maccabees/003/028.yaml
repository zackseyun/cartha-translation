base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/028.yaml
  text: The man who had just entered the treasury with much rushing about and all his guard[a], they carried out helpless, being completely incapacitated[c][b], having plainly recognized the sovereign power.
translation:
  language: zh_hans
  text: 刚才带着全体护卫、在一片奔走喧闹中进入上述宝库的那个人，如今被人无助地抬了出来；他已完全失去行动能力，显然认识到了那权能。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全失去行动能力”所译的希腊语短语较难确定，直译近于“在一切方面处于某种状态”；此处表明他已彻底被制服、无力自救。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτι ... εἰσελθόντα
  choice: 刚才还……闯进……的那个人
  rationale: 带冠词的分词作名词用，指赫利奥多罗；ἄρτι表示“刚才”。结合其强势进入宝库的语境，用“闯进”自然传达动作及叙事张力。
- source_word: μετὰ πολλῆς παραδρομῆς
  choice: 声势浩大地
  rationale: παραδρομή可指奔走、忙乱或带有炫示意味的阵势；此处不宜生硬直译为“许多奔跑”，以“声势浩大”保留其喧闹、张扬的入场情形。
- source_word: πάσης δορυφορίας
  choice: 带着大队卫兵
  rationale: δορυφορία指持矛护卫队或武装随从；“大队卫兵”在现代汉语中自然，并体现πάσης所表达的全副阵容。
- source_word: τὸ προειρημένον ... γαζοφυλάκιον
  choice: 上述宝库
  rationale: γαζοφυλάκιον指宝库或库房，προειρημένον明确表示前面已经提到，故保留为“上述”。
- source_word: ἔφερον
  choice: 被人抬了出来
  rationale: 未完成过去时描写当时的搬运动作；希腊文未明说“出来”，但上下文是将他从宝库中抬走，汉语补出“出来”使空间关系清楚。
- source_word: ἀβοήθητον
  choice: 毫无还手之力
  rationale: 该词本义为无人援助、无助；在此描写他遭击倒后的无能为力。“毫无还手之力”比单说“无助”更自然地表现其处境，同时与此前护卫簇拥形成反差。
- source_word: τοῖς ὅλοις καθεστῶτα
  choice: 整个人完全瘫倒了
  rationale: 这是较难确定的惯用表达，强调他已落入彻底失能的状态；译文保留“完全”的总体程度，不将其细化为原文未明说的具体伤病。
- source_word: φανερῶς
  choice: 显然
  rationale: 表示其认识是明显可见或无可置疑的。
- source_word: τὴν δυναστείαν
  choice: 那至高的权能
  rationale: δυναστεία兼有权势、统治力和威能之意；“权能”适合神圣语境，而“那”保持原文定冠词的指称。加入“至高”表达其压倒性的主权意味，但不在正文直接补出“上帝的”。
- source_word: ἐπεγνωκότα
  choice: 已经认识到
  rationale: ἐπιγινώσκω在此表示经亲身遭遇而充分认清；“已经认识到”自然体现完成后的结果状态。
theological_decisions:
- issue: “τὴν δυναστείαν”所指的权能归属
  choice: 译作“那至高的权能”，由上下文表明是神圣权能
  alternative: 明确译作“上帝的权能”
  rationale: 上下文清楚指向保护圣殿的神圣力量，但本节只使用抽象名词，并未直接说“上帝”；因此不在正文补足其归属，以保留原文措辞和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。用“刚才还……如今却……”凸显原句从威势入场到无助被抬出的强烈反差；不把“权能”明确增译为“上帝的权能”，以忠实保留本节的抽象表达。
