lexical_decisions:
- source_word: Ταξάμενος ἡμέραν
  choice: 定下一个日期后
  rationale: 保留不定冠词所体现的非特指意味，并用“……后”自然表达不定过去时中动分词的先行动作。这里指指定办理此事的日期。
- source_word: εἰσῄει
  choice: 便进去
  rationale: 保留动词所含的进入、向内而去之意；在连续叙事中，以“便”自然承接前一动作。
- source_word: τὴν περὶ τούτων ἐπίσκεψιν
  choice: 查验这些事
  rationale: ἐπίσκεψις在本段语境中指正式的查看、核查或调查。“查验”兼顾行政性与实际检查之意，又不把含义过度限定为司法调查。
- source_word: οἰκονομήσων
  choice: 安排
  rationale: 未来分词在此表示目的；“安排”表达他进去是为筹办、处理这次查验，而不额外断定具体执行方式。
- source_word: οὐ μικρὰ
  choice: 不小的
  rationale: 保留希腊文以否定反说加强语气的修辞，不直接平化为“极大的”。
- source_word: καθʼ ὅλην τὴν πόλιν
  choice: 全城上下都
  rationale: 表达κατά加宾格的遍及、分布之意，也保留ὅλην对整座城的强调。
- source_word: ἀγωνία
  choice: 忧惧
  rationale: 此词表示面对迫近危机时强烈的焦虑、惶恐；“忧惧”适合全城共同不安的语境，语体庄重而易懂。
