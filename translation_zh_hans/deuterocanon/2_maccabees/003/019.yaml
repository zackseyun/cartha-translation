  text: And the women[a], with sackcloth bound under their breasts, were crowding the streets; and the virgins who were shut in, some were running together to the gates, others to the walls[c][b], and some were peering out through the windows.
translation:
  language: zh_hans
  text: 妇女们把麻衣[a]束在胸下，挤满了街道[b]；那些闭居内室的童女，有的奔集到城门，有的奔向城墙，还有的从窗口探头张望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “麻衣”指哀悼时所穿的粗布衣；这里描写妇女把它束在胸部下方。
    reason: cultural_note
  - marker: b
    text: “挤满了街道”所译的希腊语，字面意思是“沿着街道增多”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεζωσμέναι
  choice: 束在胸下
  rationale: 该分词表示从下方束紧；与“麻衣”和“胸部”连用时，是指把麻衣束在胸部下方。此译既贴近原文，又符合现代汉语表达。
- source_word: σάκκους
  choice: 麻衣
  rationale: 此处不是普通口袋，而是以粗布制成、用于哀悼或悔罪的衣物；“麻衣”简洁地保留其文化含义。
- source_word: κατὰ τὰς ὁδοὺς ἐπλήθυνον
  choice: 挤满了街道
  rationale: 字面意为“沿街增多”；上下文描绘许多妇女涌上街头，“挤满了街道”自然传达人数众多的景象。
- source_word: κατάκλειστοι
  choice: 闭居内室
  rationale: 原词指被关闭、留在里面；“闭居内室”保留与外界隔绝的状态，同时避免现代汉语中“被关押”的误解。
- source_word: παρθένων
  choice: 童女
  rationale: 原词明确指处女或未婚少女；“童女”在庄重经文语体中准确而简明，不将其泛化为普通年轻女子。
- source_word: συνέτρεχον
  choice: 奔集
  rationale: 该复合动词兼有奔跑和聚集之意；“奔集”保留她们急切地汇聚前往某处的动态。
- source_word: πυλῶνας
  choice: 城门
  rationale: 该词可指大门或门楼；结合城墙场景，“城门”最清楚自然。
- source_word: διεκύπτον
  choice: 探头张望
  rationale: 该未完成时动词描写从里面向外探看这一持续动作；“探头张望”比单纯“观看”更能表现动作和焦急气氛。
- source_word: θυρίδων
  choice: 窗口
  rationale: 该词指窗户或较小的窗洞；“窗口”既自然，也不对建筑形制过度具体化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以“闭居内室”表达当时童女与外界隔绝的处境，不额外断定这是强制拘禁；用“奔集”保留原文兼具奔跑与汇聚的动作感。
