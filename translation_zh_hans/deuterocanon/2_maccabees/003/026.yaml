base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/026.yaml
  text: But two other young men appeared to him[a], outstanding in strength, most handsome in appearance, and splendid in clothing; and standing on either side of him, they kept scourging him without stopping, landing many blows on him.
translation:
  language: zh_hans
  text: 另外两个青年向他显现；他们体魄出众，仪表极其俊美[a]，衣着华贵。他们分立在他两旁，不断地鞭打他，一再加给他许多鞭打。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“风采极其俊美”。这里的希腊语把“美”与可见的荣彩、外观或仪表联系起来。
    reason: 保留δόξα在“荣彩、外观、风采”之间的词义幅度。
lexical_decisions:
- source_word: ἕτεροι δὲ δύο
  choice: 另外又有两个
  rationale: ἕτεροι与δύο表明这是前述骑马者之外另有的两位人物；用“另外又有”自然呈现新增人物及叙事转折。
- source_word: ἐφάνησαν αὐτῷ
  choice: 向他显现
  rationale: φαίνω的这个不及物用法意为“显现、出现”；“向他”保留αὐτῷ，并符合异象式叙事语境而不额外判定人物身份。
- source_word: νεανίαι
  choice: 青年
  rationale: 原词指年轻男子；“青年”简洁自然，也不加入原文没有明说的战士或天使含义。
- source_word: τῇ ῥώμῃ μὲν ἐκπρεπεῖς
  choice: 体魄出众
  rationale: ῥώμη指力量、强健，ἐκπρεπής指卓越醒目；“体魄出众”兼顾身体力量与外在非凡。
- source_word: κάλλιστοι δὲ τὴν δόξαν
  choice: 仪表极其俊美
  rationale: κάλλιστοι是最高级；δόξα在这里可指可见的荣彩、外观或风采。“仪表极其俊美”适合人物外貌描写，同时以脚注保留词义张力。
- source_word: διαπρεπεῖς δὲ τὴν περιβολήν
  choice: 衣着华贵
  rationale: περιβολή指衣着、服饰，διαπρεπής表示显赫、华美；“衣着华贵”自然而庄重。
- source_word: οἵ καὶ παραστάντες ἐξ ἑκατέρου μέρους
  choice: 他们分立在他两旁
  rationale: παραστάντες表示站到近旁，ἐξ ἑκατέρου μέρους意为各在一边；“分立在他两旁”准确而凝练。
- source_word: ἐμαστίγουν αὐτὸν ἀδιαλείπτως
  choice: 不住地鞭打他
  rationale: 未完成时ἐμαστίγουν表达持续动作，ἀδιαλείπτως意为不间断；“不住地鞭打”保留动作强度和延续性。
- source_word: πολλὰς ἐπιρριπτοῦντες αὐτῷ πληγάς
  choice: 在他身上抽了许多下
  rationale: 分词短语进一步说明鞭打的方式和次数；πληγάς指击打、鞭痕或抽打，“抽了许多下”在中文中具体自然。
theological_decisions:
- issue: 两位显现者的身份
  choice: 译作“两个青年”，不在正文中称他们为天使
  alternative: 两个天使；两个天上的使者
  rationale: 本节希腊文只称他们为νεανίαι，并描写其力量、俊美和衣着，没有明确称其为天使。按原文描述翻译，可避免提前消解叙事中的神学含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“体魄出众—仪表俊美—衣着华贵”保留原文三项并列描写；后半句用“不住地”体现持续动作，不使用过度古雅或宗派化措辞。
