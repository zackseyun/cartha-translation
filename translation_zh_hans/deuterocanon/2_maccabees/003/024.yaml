base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/024.yaml
  text: But when he had already arrived there with the guards at the treasury[a], the Sovereign of spirits and of all authority made a great manifestation, so that all who had dared to come in, struck with awe at the power of God[c][b], were turned to weakness and fear.
translation:
  language: zh_hans
  text: 可是，当他和卫士[a]已经到了宝库那里时，诸灵和一切权柄的主宰作了极大的显现[b]，使所有胆敢进来的人[c]因上帝的大能而惊骇，陷入软弱和胆怯之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卫士”原文直译为“持矛者”，也可指贴身护卫。
    reason: lexical_alternative
  - marker: b
    text: 原文也可直译为“施行了一次伟大的显现”，强调震撼人心的神圣显现。
    reason: lexical_alternative
  - marker: c
    text: “进来”也可译为“聚集而来”；结合上下文，这里较可能是指进入宝库区域。
    reason: alternative_reading
lexical_decisions:
- source_word: δορυφόροις
  choice: 卫士
  rationale: 该词字面指“持矛者”，在这里表示随行的武装护卫；“卫士”自然地传达其职能，并在脚注保留字面含义。
- source_word: γαζοφυλάκιον
  choice: 库房
  rationale: 指存放财物的库房或宝库；结合圣殿语境译作“库房”，简洁而不额外添加原文未明说的信息。
- source_word: ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: 那统管诸灵和一切权柄的主宰
  rationale: δυνάστης是掌权者、主宰，并非通常译作“主”的κύριος；此译保留上帝统管诸灵及一切权柄的双重范围。
- source_word: ἐπιφάνειαν μεγάλην ἐποίησεν
  choice: 大大显现出来
  rationale: 以自然现代汉语表达一次强烈、非凡的神圣显现，同时避免加入“荣光”等原文没有的具体意象。
- source_word: κατατολμήσαντας συνελθεῖν
  choice: 胆敢进来的人
  rationale: κατατολμάω含冒险或胆敢之意；συνέρχομαι本可指聚集或来到一起，但上下文指向进入库房区域，故正文采用“进来”，脚注保留较宽泛的可能。
- source_word: καταπλαγέντας τὴν τοῦ θεοῦ δύναμιν
  choice: 因上帝的大能而惊骇
  rationale: 表达他们面对上帝能力时受到强烈震撼和惊吓；“惊骇”兼具震惊与惧怕。
- source_word: εἰς ἔκλυσιν καὶ δειλίαν τραπῆναι
  choice: 陷入瘫软和恐惧之中
  rationale: ἔκλυσις表示力气消失、衰弱或瘫软，δειλία表示畏惧、胆怯；此译保留两个结果状态，并符合叙事场景。
theological_decisions:
- issue: 神圣称号ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης的译法
  choice: 那统管诸灵和一切权柄的主宰
  alternative: 诸灵和一切能力的主
  rationale: “主宰”准确反映δυνάστης所强调的统治权，而不把它混同于κύριος；ἐξουσία译作“权柄”，保留权威、管辖权的含义，不仅理解为力量。
- issue: ἐπιφάνεια是否采用后期神学术语
  choice: 大大显现出来
  alternative: 施行了一次伟大的显现
  rationale: 正文保留神主动、非凡地显现这一含义，但避免使用可能显得技术化或生硬的固定神学表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“主宰”“权柄”“大能”维持经文的崇高语域；“瘫软和恐惧”则具体呈现人物反应。句法适度重组，使长句在中文中顺畅，同时保留原文的因果推进与神学张力。
