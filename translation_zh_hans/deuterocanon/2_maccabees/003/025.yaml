base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/025.yaml
  text: For a horse appeared to them with a fearsome rider[a], adorned with a most beautiful saddlecloth; and rushing headlong, it struck Heliodorus with its front hoofs[b], while the one seated on it appeared to be wearing golden armor.
translation:
  language: zh_hans
  text: 因为有一匹马出现在他们面前，骑手令人畏惧，马身装饰着极其华美的马具[a]；它猛然冲上前，用前蹄重击[b]赫利奥多罗斯。骑在马上的那位看起来身披金色铠甲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“披着极其华美的马饰”；原词指马匹所用的装备或装饰物。
    reason: lexical_alternative
  - marker: b
    text: “重击”原文也可直译为“摇动”或“震动”；在这里可表达以前蹄猛烈踢打、冲击。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: 出现在他们面前
  rationale: 该词是ὁράω的不定过去时被动式，在此表示“被看见、显现、出现”。译作“出现在他们面前”自然地表达突然而可见的出现，同时不预先判定这是实体事件还是异象。
- source_word: τις ἵππος
  choice: 有一匹马
  rationale: τις在这里是不定代词，不强调“某一匹”的特指意义；现代汉语用“有一匹马”最符合叙事表达。
- source_word: φοβερὸν ἔχων τὸν ἐπιβάτην
  choice: 骑手令人畏惧
  rationale: φοβερός表示能使人惧怕。此处保留分词结构所描写的特征，也清楚表明可怕的是骑手，而非马。
- source_word: καλλίστῃ σαγῇ διακεκοσμημένος
  choice: 马身装饰着极其华美的马具
  rationale: σαγή在此指马匹所用的装备或装饰，而不宜限缩为某一种特定物件；καλλίστῃ是最高级，以“极其华美”体现其语气。
- source_word: φερόμενος δὲ ῥύδην
  choice: 它猛然冲上前
  rationale: 该短语表达迅疾而猛烈的向前运动。“猛然冲上前”在现代汉语中自然，并保留动作的速度和冲击感。
- source_word: ἔσεισεν
  choice: 重击
  rationale: σείω本义可指“摇动、震动”；结合前蹄和受击者的语境，这里表示猛烈踢打或冲击。正文采用自然明确的“重击”，脚注保留字面可能性。
- source_word: τὰς ἐμπροσθίους ὁπλάς
  choice: 前蹄
  rationale: ὁπλή明确指蹄，ἐμπροσθίους指前面的；“前蹄”简洁准确。
- source_word: ὁ δὲ ἐπικαθήμενος
  choice: 骑在马上的那位
  rationale: 保留希腊文以名词化分词再次描写骑手的方式，而不直接简化为“骑手”。
- source_word: χρυσῆν πανοπλίαν
  choice: 金色铠甲
  rationale: πανοπλία指全套武装或全副铠甲；汉语“身披金色铠甲”已自然传达全身武装的形象，且避免生硬重复“全副”。
theological_decisions:
- issue: 圣殿审判场景中显现之事的性质
  choice: 按希腊文直接叙述一匹可见的马及其骑手出现并发动攻击，不额外添加“异象”“幻影”或象征性解释。
  alternative: 明确译成异象中的显现，或将马和骑手解释为象征。
  rationale: 原文以具体的出现、冲击和铠甲等措辞叙述此事，却没有界定这显现究竟是物质性的还是异象性的；译文应保留这种叙事力度和解释空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“出现在他们面前”保留显现事件的客观叙述，以“马具”避免把σαγή过度限定为鞍布；分成两句，使迅猛攻击与骑手金甲的描写清楚易读。所有脚注标记均置于正文对应词语之后。
