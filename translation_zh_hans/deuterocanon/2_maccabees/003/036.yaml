  text: And he testified to everyone about the works of the greatest God that he had seen with his own eyes[a].
translation:
  language: zh_hans
  text: 他向众人作见证，述说自己亲眼看见的至大上帝的作为。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较传统的译法作“至高上帝”。这里的希腊文用的是“至大”（μεγίστου），不是通常表示“至高”的那个词。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεμαρτύρει
  choice: 作见证
  rationale: 未完成时表示持续或反复作证；“作见证”保留公开陈述亲身经历的语气。
- source_word: πᾶσιν
  choice: 向众人
  rationale: 与格表示见证所面对的对象；“向众人”自然地保留其范围。
- source_word: ἅπερ
  choice: 述说……的作为
  rationale: 按现代汉语重组关系结构，使所见之事明确成为见证的内容，又不改变原意。
- source_word: ὑπʼ ὄψιν
  choice: 亲眼
  rationale: 该短语强调直接目睹；“亲眼”准确传达目击者意味。
- source_word: τεθεαμένος
  choice: 看见
  rationale: 完成时中间语态分词指他本人已经目睹、其影响仍在；汉语用“自己亲眼看见”自然表达。
- source_word: ἔργα
  choice: 作为
  rationale: 此处指上帝所施行的事；“作为”既庄重又符合现代汉语宗教语境。
- source_word: τοῦ μεγίστου θεοῦ
  choice: 至大上帝
  rationale: μεγίστου 是“最大、至大”的最高级，并非通常表示“至高”的 ὑψίστου；“至大上帝”保留原词区别，同时语言庄重自然。
theological_decisions:
- issue: 神圣称谓 μεγίστου θεοῦ 的译法
  choice: 至大上帝
  alternative: 至高上帝
  rationale: 原文形容词是 μέγιστος（最大、至大），不是惯常译作“至高”的 ὕψιστος。正文保留这一词义差别，脚注注明传统译法，避免把熟悉的神圣称号直接代入原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“作见证”保留公开证言色彩；“述说”使句法符合自然汉语。“至大上帝”较不常见，但准确保存原文与“至高”常用词之间的词汇差异。
