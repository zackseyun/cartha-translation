base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/039.yaml
  text: For he himself[a], who has his dwelling in heaven, is the overseer and helper of that place[b], and he strikes and destroys those who come to do harm.
translation:
  language: zh_hans
  text: 因为那位以天为居所的，亲自看顾并帮助那地方[a]；凡来加害的人，他都击打并毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即圣殿；希腊原文直译为“那地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ τὴν κατοικίαν ἐπουράνιον ἔχων
  choice: 因为那位以天为居所的，亲自
  rationale: 保留αὐτός的强调语气，并将“拥有天上的居所”自然译为“以天为居所”，不直接增补“上帝”，由上下文确定所指。
- source_word: ἐπόπτης
  choice: 看顾
  rationale: 表达监察、照管之意；比“守护者”少一层解释性，也能与下文“帮助”保持区别。
- source_word: βοηθός
  choice: 帮助
  rationale: 保留“施以援助”的基本意义，避免提前赋予过强的军事色彩。
- source_word: ἐκείνου τοῦ τόπου
  choice: 那地方
  rationale: 按原文保留较宽泛的“地方”，不在正文中直接具体化为圣殿。
- source_word: τοὺς παραγινομένους ἐπὶ κακώσει
  choice: 凡来加害的人
  rationale: 简明表达前来造成伤害的目的意味。
- source_word: τύπτων ἀπόλλυσι
  choice: 击打并毁灭
  rationale: 保留原文强烈的惩罚性动作，也反映分词与主要动词相连的表达。
theological_decisions:
- issue: αὐτός所指为何
  choice: 不在正文中补出“上帝”，以“那位……的”承接上下文
  alternative: 明确译作“上帝自己”
  rationale: 语境表明所指是居于天上并保护圣殿的上帝，但希腊文此处没有明说θεός；不增补可兼顾清楚与形式上的克制。
- issue: “那地方”的具体所指
  choice: 正文保留“那地方”，脚注说明指圣殿
  alternative: 正文直接译为“那圣殿”或“那圣所”
  rationale: 上下文所指清楚，但原文使用τόπος而非ναός或ἱερόν，故不在正文中收窄词义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以天为居所”保留原文天上居所的意象；“亲自”体现αὐτός的强调。“看顾并帮助”以动词表达希腊文两个名词性称谓，使中文流畅，同时保留二者的区别。
