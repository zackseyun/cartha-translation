  yaml_path: translation/deuterocanon/2_maccabees/003/002.yaml
  text: Because of the piety and hatred of wickedness there, it came about that even the kings themselves honored the place and glorified the sanctuary with the finest gifts sent.
translation:
  language: zh_hans
  text: 由于这里的虔敬和对邪恶的憎恨，甚至连君王们自己也尊崇这地方，并以送来的最上等礼物[a]使圣所增光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以送来的最上等供物”。希腊词ἀποστολαῖς可指作为馈赠而送来的物品；其在这里究竟偏向“礼物”还是“供物”，需结合语境判断。
    reason: 词义存在语境相关的译法差异。
lexical_decisions:
- source_word: εὐσέβειαν
  choice: 虔敬
  rationale: 表达对上帝的敬畏及由此体现的敬虔行为，符合圣殿语境，也自然庄重。
- source_word: μισοπονηρίαν
  choice: 对邪恶的憎恨
  rationale: 保留复合词“憎恨”与“邪恶”的直接道德力度，不弱化为一般的不赞同。
- source_word: συνέβαινεν
  choice: （句式表达为）甚至……也……
  rationale: 该未完成时在这里引出一种由前述情形造成的结果；中文以结果句自然表达，无须生硬译作“事情就这样发生了”。
- source_word: τιμᾶν
  choice: 尊崇
  rationale: 表示公开给予尊重和尊荣；“尊崇”也适合君王对圣殿所在地所持的态度。
- source_word: τὸν τόπον
  choice: 这地方
  rationale: 保留原文以“地方”敬称圣殿所在之处的表达，并根据中文上下文采用指示词使语句自然。
- source_word: τὸ ἱερὸν
  choice: 圣所
  rationale: 既表达其神圣性质，也可涵盖圣殿或神圣区域，并与前面的“这地方”形成区别。
- source_word: ἀποστολαῖς
  choice: 送来的……礼物
  rationale: 该词基本含义与“差送、送出之物”有关；在此语境中指送给圣所的馈赠。正文保留“送来”的成分，脚注注明“供物”的可能译法。
- source_word: ταῖς κρατίσταις
  choice: 最贵重
  rationale: 以最高级表达这些馈赠极其优厚、上等；与“礼物”搭配时，“贵重”比直译“最强”自然。
- source_word: δοξάζειν
  choice: 使……增光
  rationale: 在此指借贵重馈赠使圣所更显荣耀；如此也避免与 τιμᾶν 使用同一个“尊崇”而抹平两词差异。
theological_decisions:
- issue: 虔敬和憎恨邪恶的归属
  choice: 译作“这里的虔敬和对邪恶的憎恨”，不明确指定个人主体
  alternative: 明确归于大祭司、城中居民或圣殿管理者
  rationale: 本节希腊文没有明说这些品德属于哪一个人；保持宽泛指向，既符合以圣殿为中心的上下文，也不替原文消除歧义。
- issue: 道德状况与君王尊崇之间的关系
  choice: 用“因着……甚至……也……”保留因果结果关系
  alternative: 仅把两者并列，弱化为时间或背景关系
  rationale: συνέβαινεν 引出的情形在句法上是前述虔敬与嫉恶所带来的结果，因此应保留其因果意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“尊崇这地方”“使圣所增光”保留原文两个不同动词的层次；整体按中文习惯重组结果句，同时保持原文的因果关系和主语指向上的含混。
