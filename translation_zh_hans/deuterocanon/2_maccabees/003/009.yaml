base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/009.yaml
  text: And when he arrived in Jerusalem and was courteously received by the high priest of the city[a], he reported the manifestation that had taken place, explained for what reason he was present, and inquired whether these things were truly so.
translation:
  language: zh_hans
  text: 他到了耶路撒冷，受到本城的大祭司友善地接待后，便禀报那已经披露出来的事[a]，说明自己为何而来，并询问这些事是否确实如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经发生的显明”或“已经发生的披露”。希腊词可指使某事为人所知、披露或显露出来；此处不必理解为超自然的显现。
    reason: 保留ἐμφανισμός在“披露、显明、显露”之间的词义幅度，且不补入未明说的告知者。
lexical_decisions:
- source_word: παραγενηθεὶς
  choice: 到了
  rationale: 不定过去时分词表示抵达；用“到了”自然地交代先后背景。
- source_word: φιλοφρόνως ὑπὸ τοῦ ἀρχιερέως τῆς πόλεως ἀποδεχθεὶς
  choice: 受到城中大祭司的礼貌接待
  rationale: φιλοφρόνως表示友善、殷勤或礼貌的态度；ἀποδεχθείς为被动，指受到接待。“城中大祭司”保留τῆς πόλεως与ἀρχιερέως的关系，同时符合现代汉语表达。
- source_word: ἀνέθετο
  choice: 陈述出来
  rationale: 此处指把有关情况向大祭司提出、讲明；“陈述出来”保留正式叙事语气，又不过度限定为官方报告。
- source_word: περὶ τοῦ γεγονότος ἐμφανισμοῦ
  choice: 先前有人告知的事
  rationale: ἐμφανισμός可指显明、披露或告知；结合上文关于库房消息被通报的语境，译作“有人告知的事”较为清楚，并以脚注保留词义幅度。γεγονότος表明此事先前已经发生。
- source_word: καί τινος ἕνεκεν πάρεστι
  choice: 说明自己为何而来
  rationale: πάρεστι直指“在场”，但在此叙事中所问是他此来的缘由；这样翻译自然且保存目的含义。
- source_word: διεσάφησεν
  choice: 说明
  rationale: 该词意为使清楚、解释明白；“说明”简洁而准确。
- source_word: ἐπυνθάνετο
  choice: 询问
  rationale: 未完成时中间语态表达打听、求证；“询问”适合正式叙事。
- source_word: εἰ ταῖς ἀληθείαις ταῦτα οὕτως ἔχοντα τυγχάνει
  choice: 实情是否果真如此
  rationale: ταῖς ἀληθείαις作副词性用法，强调事实真实性；整句是在核实先前所闻是否属实。“果真如此”准确而自然。
theological_decisions:
- issue: ἐμφανισμός是否含超自然显现之意
  choice: 正文译为“有人告知的事”，不赋予超自然含义
  alternative: 所发生的显现／显明
  rationale: 本节近距语境指有关圣殿库房的消息被披露，并无足够依据把该词专门理解为神迹性显现；脚注仍保留“显明、披露”的词义可能，避免抹平原文弹性。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“礼貌接待”“陈述”“询问”保持正式语体；避免把ἐμφανισμός神学化，也避免逐字硬译造成歧义。
