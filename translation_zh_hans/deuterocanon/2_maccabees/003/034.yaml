  yaml_path: translation/deuterocanon/2_maccabees/003/034.yaml
  text: But you[a], having been scourged from heaven, proclaim to all the majestic power of God. And when they had said these things[b], they became invisible.
translation:
  language: zh_hans
  text: “至于你，既受了从天而来的鞭打，就要向众人宣扬上帝伟大的权能。[a]”他们说完这些话，就变得看不见了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝威严的大能。”希腊文同时使用表示伟大或威严、以及能力或威力的词。
    reason: lexical_alternative
  - marker: b
    text: 或译：“消失了”或“从眼前消失了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμαστιγωμένος
  choice: 受了……鞭打
  rationale: 该完成时被动分词表示已经遭受严厉的身体击打；“受了鞭打”既保留其具体力度，也符合现代汉语表达。
- source_word: ἐξ οὐρανοῦ
  choice: 从天上来的
  rationale: 保留原文所说的来源，不扩写为“被上帝鞭打”，从而既暗示属天的施行者，又不超出希腊文。
- source_word: διάγγελλε
  choice: 宣扬
  rationale: 该命令式要求把信息公开传告出去；“宣扬”体现公开、广泛传播的语气。
- source_word: πᾶσι
  choice: 向众人
  rationale: 与动词搭配，明确宣告的对象是所有人；“众人”自然且庄重。
- source_word: τὸ μεγαλεῖον … κράτος
  choice: 威严的大能
  rationale: μεγαλεῖον 表达伟大、威严，κράτος 表达能力、威力；合译为“威严的大能”，保留两个概念的叠加强调。
- source_word: ἀφανεῖς ἐγένοντο
  choice: 隐去了
  rationale: 原义是“成为不可见的”；“隐去了”在现代汉语中自然，并保留人物从视线中消失的超自然色彩。
theological_decisions:
- issue: 赫利奥多鲁所受鞭打的施行者
  choice: 受了从天上来的鞭打
  alternative: 被上帝从天上鞭打
  rationale: 原文只明确说鞭打“从天上”而来；不补出“上帝”作直接施行者，以保留原文措辞及其含蓄性。
- issue: 属天人物离去的方式
  choice: 隐去了
  alternative: 消失了／变得看不见了
  rationale: 译文保留“从人眼前不再可见”的超自然叙事意味，同时避免把原文具体化为普通的离开。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“至于你……就要……”体现原文代词前置和命令语气；引号用于清楚标示属天人物的话。
