  text: For a certain dread and bodily trembling had come over the man[a], by which the pain present in his heart was becoming evident to those who were watching.
translation:
  language: zh_hans
  text: 因为这个人被一种恐惧和身体的战栗笼罩；他内心正承受的痛苦，也由此清楚显露在旁观者面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内心正承受的痛苦”也可译作“心中的悲苦”；希腊语既可指内在的情绪苦楚，也可泛指痛苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: περικεχύτο
  choice: 被……笼罩
  rationale: 该完成时形式在这里以情绪环绕、袭身为喻；“被……笼罩”既保留其被动和包围感，也符合现代汉语表达。
- source_word: δέος τι
  choice: 一种恐惧
  rationale: δέος表示强烈而肃然的惧怕；τι带有不确指意味，译作“一种”自然保留这一语气。
- source_word: φρικασμὸς σώματος
  choice: 身体的战栗
  rationale: 明确表达身体上的颤抖、寒栗；“战栗”比一般的“发抖”更贴近原词所含的惊惧感。
- source_word: διʼ ὧν
  choice: 也由此
  rationale: 指前述恐惧和身体战栗是内在痛苦显露出来的媒介；中文以单数概括性的“由此”衔接更自然。
- source_word: πρόδηλον ἐγίνετο
  choice: 清楚显露
  rationale: ἐγίνετο具有持续显现的未完成体意味；“显露”在上下文中可表达内情经由外在反应逐渐变得明显。
- source_word: τοῖς θεωροῦσιν
  choice: 在旁观者面前
  rationale: 指现场观看、观察的人；“旁观者”简洁自然，并保留可见于观察者的含义。
- source_word: τὸ κατὰ καρδίαν ἐνεστὸς ἄλγος
  choice: 他内心正承受的痛苦
  rationale: κατὰ καρδίαν指内在心境，ἐνεστὸς表示当下存在或压迫，ἄλγος可指痛苦或悲苦；此译保留当下持续的内在煎熬，而不限定为身体疼痛。
