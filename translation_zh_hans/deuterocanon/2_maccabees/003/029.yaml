  yaml_path: translation/deuterocanon/2_maccabees/003/029.yaml
  text: And he[a], because of the divine power, lay speechless and deprived of all hope and salvation;
translation:
  language: zh_hans
  text: 他因神的能力，倒卧着，不能说话，毫无希望，也无法获救[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “获救”也可译作“蒙拯救”或“脱险”。希腊语σωτηρία可按上下文指搭救、拯救或救恩。
    reason: 保留σωτηρία在具体脱险与较广义拯救之间的词义范围。
lexical_decisions:
- source_word: θείαν ἐνέργειαν
  choice: 神力的作用
  rationale: ἐνέργεια指实际发挥效力的力量或作用；结合θείαν，此处译作“神力的作用”，既表达来自神的超自然力量，也保留其正在施展功效的意味。
- source_word: ἄφωνος
  choice: 不能说话
  rationale: ἄφωνος意为无声或不能发声；“不能说话”在现代汉语中自然清楚，并符合人物受击后的状态。
- source_word: πάσης ἐστερημένος ἐλπίδος καὶ σωτηρίας
  choice: 毫无希望，也无法获救
  rationale: ἐστερημένος表示被剥夺、完全失去；σωτηρία在本段具体危急处境中主要指获救或脱险。此译法自然呈现绝望和无从获救的双重状态。
- source_word: ἔρριπτο
  choice: 倒卧在那里
  rationale: 该未完成时形式描写他被击倒后持续躺着的状态；“倒卧在那里”兼顾被抛倒的结果和当时的静态情景。
theological_decisions:
- issue: 叙事性审判场景中σωτηρία的译法
  choice: 获救
  alternative: 拯救；救恩；脱险
  rationale: 上下文指赫利奥多洛斯遭受神力打击后的生命危境，因此“获救”首先表达现实处境中的搭救，同时不排除该词较广的拯救含义。脚注保留其词义幅度，避免把这里限定为系统神学意义上的“救恩”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“神力的作用”避免过度技术化；“倒卧在那里，不能说话”以清楚的叙事语言呈现原文状态。句末保留分号，以反映本节与后文在句法和叙事上的延续。
