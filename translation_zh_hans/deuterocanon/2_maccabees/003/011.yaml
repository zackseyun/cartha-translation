  yaml_path: translation/deuterocanon/2_maccabees/003/011.yaml
  text: and some also belonging to Hyrcanus son of Tobias[a], a man of very high position. The ungodly Simon was not slandering to that extent. Altogether there were four hundred talents of silver and two hundred of gold.
translation:
  language: zh_hans
  text: 还有一些款项是托比亚的儿子希尔卡诺的；他是一位地位极高的人。实际情况并不像不敬虔的西门所诬告的那样。这些款项总计银子四百他连得，金子二百[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“金子二百”；“他连得”承接前一句，原文在这里省略。
    reason: 说明原文的单位省略，避免读者误以为数目缺少计量单位。
lexical_decisions:
- source_word: τινὰ δὲ καὶ Ὑρκανοῦ τοῦ Τωβίου
  choice: 还有一些是托比亚的儿子许尔卡诺的
  rationale: τινά指前文所说存放款项中的一部分；两个属格表达这部分属于许尔卡诺，而τοῦ Τωβίου作为父称译为“托比亚的儿子”。
- source_word: σφόδρα ἀνδρὸς ἐν ὑπεροχῇ κειμένου
  choice: 他是一位地位极高的人
  rationale: ἐν ὑπεροχῇ κειμένου是描述社会地位显赫的惯用表达；“地位极高”也保留σφόδρα的强化作用。
- source_word: οὐχ οὕτως διαβάλλων ὁ δυσσεβὴς Σίμων
  choice: 实际情况并不像不敬虔的西门所诬告的那样
  rationale: οὐχ οὕτως保留“并非如同那样”的比较意味；διαβάλλων含恶意歪曲、诬告之意。原句高度依赖上下文，译文不进一步断定西门具体夸大了什么。
- source_word: τὰ δὲ πάντα
  choice: 总数是
  rationale: 引出全部款项的合计，现代汉语用“总数是”清楚自然。
- source_word: ἀργυρίου τετρακόσια τάλαντα, χρυσίου δὲ διακόσια
  choice: 银子四百他连得，金子二百
  rationale: 前半明确有τάλαντα；后半省略该单位，中文保留这种可自然理解的省略，并以脚注说明。
theological_decisions:
- issue: 对西门的道德—宗教评价（δυσσεβής）
  choice: 不敬虔的西门
  alternative: 邪恶的西门；亵渎神的西门
  rationale: “不敬虔”保留该词对宗教敬畏缺失的评价，又不把语义扩大为更笼统的“邪恶”或更具体的“亵渎神”。
- issue: οὐχ οὕτως διαβάλλων所表达的否定范围
  choice: 实际情况并不像……所诬告的那样
  alternative: 西门的诬告并非全然不实；西门并没有诬告到那种程度
  rationale: 希腊文措辞简略且与上下文紧密相连。所选译法保留比较和否定，不替原文判定诬告究竟有多少真实成分。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他连得”作为古代重量兼货币单位的音译，适合圣经历史叙事。人名按希腊文音译为“许尔卡诺”和“托比亚”。脚注标记置于真正对应的“金子二百”之后。
