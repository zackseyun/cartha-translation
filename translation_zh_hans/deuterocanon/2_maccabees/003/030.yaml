base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/030.yaml
  text: And they were blessing the Lord[a], who was glorifying his own place; and the temple, which a little earlier had been full of fear and turmoil, was filled with joy and gladness when the Almighty Lord appeared.
translation:
  language: zh_hans
  text: 他们颂赞那使自己的地方得荣耀的主；全能的主显现[a]时，那不久前还充满恐惧和纷乱的圣殿，就充满了喜乐和欢欣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显现”或译“彰显自己”。希腊语所用的词常与神圣显现有关。
    reason: 说明 ἐπιφανέντος 的可选译法及其神显语义。
lexical_decisions:
- source_word: εὐλόγουν
  choice: 都颂赞
  rationale: 未完成时表示当时持续进行的行动；“颂赞”自然表达众人对主的称颂，“都”也承接复数主语。
- source_word: παραδοξάζοντα
  choice: 使……得荣耀
  rationale: 保留该分词所表达的主动作用：主借着这次非凡的干预，使自己的地方得着荣耀；不把它过度具体化为某一种方式。
- source_word: τὸν ἑαυτοῦ τόπον
  choice: 自己的地方
  rationale: 按 τόπος 的基本义译为“地方”，保留原文较宽泛的说法；下文的“圣殿”已清楚说明所指。
- source_word: δέους καὶ ταραχῆς
  choice: 恐惧和骚乱
  rationale: “恐惧”表达 δέος 在此处的畏惧感，“骚乱”表达 ταραχή 所指的扰动和混乱，并保持两个并列名词。
- source_word: ἱερόν
  choice: 圣殿
  rationale: 此词在上下文中指圣殿建筑群；“圣殿”是现代中文圣经语体中清楚而庄重的对应词。
- source_word: τοῦ παντοκράτορος ... κυρίου
  choice: 全能的主
  rationale: 同时保留 παντοκράτωρ 与 κύριος 两个称号，中文表达自然，并明确这是对上帝的称呼。
- source_word: ἐπιφανέντος
  choice: 显现
  rationale: 该词表示显露、出现，并带有神圣显现的语义色彩；“显现”既保留叙事中的真实神圣介入，也不增添显现方式。
- source_word: χαρᾶς καὶ εὐφροσύνης ἐπληροῦτο
  choice: 充满了喜乐和欢欣
  rationale: 保留两个喜悦类名词的并列，也以“充满”对应被动式 ἐπληροῦτο；“喜乐和欢欣”庄重且易懂。
theological_decisions:
- issue: παραδοξάζοντα τὸν ἑαυτοῦ τόπον 中主对圣殿的作为
  choice: 主使自己的地方得荣耀
  alternative: 主使自己的地方显得奇妙／彰显自己地方的荣耀
  rationale: 译文保留主主动尊荣、显扬其地方的意思，却不进一步断定这种荣耀具体如何实现。
- issue: ἐπιφανέντος κυρίου 所表达的神圣显现
  choice: 全能的主显现时
  alternative: 全能的主彰显自己时
  rationale: “显现”直接保留原文的神显语言，不将事件弱化为一般性的护理，也不说明原文没有说明的可见形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自己的地方”刻意保留原文 τόπος 的宽泛表达，由紧接着的“圣殿”明确其所指；以“不久前……如今……”自然呈现前后状态的鲜明转变。
