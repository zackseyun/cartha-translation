  terminology: “主”“全能的主”“圣殿”“显现”“喜乐和欢欣”均合乎现代中文圣经语体，并忠实对应 κύριος、παντοκράτωρ、ἱερόν、ἐπιφανέντος 和 χαρᾶς καὶ εὐφροσύνης。“自己的地方”保留 τόπος 的宽泛措辞，虽略带字面色彩，仍可接受，且由后文“圣殿”明确其所指。
