  to: 他们颂赞那使自己的地方得荣耀的主；全能的主显现[a]时，那不久前还充满恐惧和纷乱的圣殿，就充满了喜乐和欢欣。
  rationale: 仅作两项轻微修订：删去原文未明说的“如今”，以“就”自然表达显现所带来的状态转变；将“骚乱”调整为“纷乱”，以更宽泛、贴合上下文的中文表达对应 ταραχή。其余措辞保持原译的源语对应与庄重语体。
