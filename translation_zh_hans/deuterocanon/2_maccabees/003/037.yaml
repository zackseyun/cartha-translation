lexical_decisions:
- source_word: ἐπερωτήσαντος
  choice: 问
  rationale: 该词在属格独立结构中交代背景动作；“问”自然简洁，准确表达王向赫利奥多罗提出问题。
- source_word: ποῖός τις εἴη
  choice: 还有谁
  rationale: 原短语兼有询问何人及其是否合适的意味；结合后面的“适合”，“还有谁”用现代汉语自然保留间接问句的语气。
- source_word: ἐπιτήδειος
  choice: 适合
  rationale: 表示某人适宜承担某项差事；“适合”通俗、准确，不额外引入资格或能力方面的限定。
- source_word: ἔτι ἅπαξ
  choice: 再……一次
  rationale: 既表达重复，也保留ἅπαξ所强调的单次性，比单说“再”更完整。
- source_word: διαπεμφθῆναι
  choice: 派往
  rationale: 被动不定式指某人被差派执行任务；汉语用“适合派往”可自然表达被派遣之意，无须机械保留被动形式。
- source_word: εἰς Ἱεροσόλυμα
  choice: 往耶路撒冷
  rationale: 与差派动词连用时，“往耶路撒冷”自然表达目的地。
- source_word: ἔφησεν
  choice: 他说
  rationale: 原词是中性的言说动词；“他说”不预先强化为“回答”或“宣告”，并为下一节的直接引语作引入。
