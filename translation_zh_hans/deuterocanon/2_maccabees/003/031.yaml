  text: But quickly some of Heliodorus's companions were urging Onias to call upon the Most High and grant life to the one who was lying at his last breath[a][b].
translation:
  language: zh_hans
  text: 于是，赫利奥多鲁的一些同伴很快恳求敖尼雅呼求至高者[a]，赐生命给那躺卧着、已奄奄一息的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求告至高者”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“给那躺卧在最后一息中的人”；指已处于死亡边缘的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταχὺ
  choice: 立刻
  rationale: 表示行动紧迫迅速；“立刻”在现代汉语叙事中自然有力，又没有超出原文语义。
- source_word: τινες τῶν τῷ Ἡλιοδώρῳ συνηθῶν
  choice: 跟随赫利奥多罗的几个人
  rationale: 该短语指与赫利奥多罗关系密切、随同他的人；此处译为“跟随……的人”既符合场景，也比生硬直译更自然。
- source_word: ἠξίουν
  choice: 恳求
  rationale: 未完成时态可表示持续或反复请求；结合赫利奥多罗濒死的情境，“恳求”体现请求的迫切程度。
- source_word: ἐπικαλέσασθαι τὸν ὕψιστον
  choice: 呼求至高者
  rationale: ἐπικαλέομαι在宗教语境中指呼求或祈求；“至高者”保留原文作为上帝称号的形式。
- source_word: τὸ ζῆν χαρίσασθαι
  choice: 赐生命
  rationale: χαρίζομαι含恩赐、施予之意；“赐生命”简洁地保留生命作为恩赐的意味。
- source_word: τῷ παντελῶς ἐν ἐσχάτῃ πνοῇ κειμένῳ
  choice: 给那个已经躺卧、只剩最后一口气的人
  rationale: 保留κειμένῳ的躺卧状态，并以“只剩最后一口气”自然传达παντελῶς与ἐν ἐσχάτῃ πνοῇ所描写的濒死情形。
theological_decisions:
- issue: 神圣称号τὸν ὕψιστον的译法
  choice: 至高者
  alternative: 至高的上帝
  rationale: 原文使用名词化称号而未明说θεός；“至高者”保留这一称号形式，不增添原文没有的词。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。人名按通行的次经汉译形式处理；正文保留原文关于呼求对象及赐生命之请求的句法关系，不把“赐生命”的主体另行解释出来。
