base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/016.yaml
  text: To see the appearance of the high priest was enough to wound the mind[b][a]; for his face and altered color made visible the agony in his soul.
translation:
  language: zh_hans
  text: 看见大祭司的神色，足以使人心神受创[a]；因为他的面容和变了的气色，显出了他心灵里的极度痛苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心神受创”直译为“心思受伤”；希腊文以身体受伤的动词，比喻目睹此景的人心里受到强烈冲击。
    reason: lexical_alternative
  - marker: b
    text: “心灵里的极度痛苦”也可译作“灵魂里的苦痛”或“内心的焦灼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ὁρῶντα
  choice: 看见……足以使人
  rationale: 原文是带有省略意味的非人称结构，着重说明大祭司的外貌对任何看见之人的影响；此译法保留这种普遍含义，同时符合现代汉语表达。
- source_word: τὴν τοῦ ἀρχιερέως ἰδέαν
  choice: 大祭司的神色
  rationale: ἰδέα在此指可见的外在样貌、神态；结合下文的面容与气色，译作“神色”比抽象的“形象”更自然，也不局限于五官。
- source_word: τιτρώσκεσθαι τὴν διάνοιαν
  choice: 使人心神受创
  rationale: τιτρώσκω本义为“使受伤”，此处用于比喻目睹者在思想和情感上所受的冲击；“心神受创”既保留伤害意象，也清楚表明不是身体受伤。
- source_word: ἡ ὄψις
  choice: 他的面容
  rationale: ὄψις可指所见的外貌；与气色并列时，具体译作“面容”最贴合语境。
- source_word: τῆς χρόας παρηλλαγμένον
  choice: 变了的气色
  rationale: χρόα指皮肤颜色或面色，παρηλλαγμένον表示发生变化；“变了的气色”自然地表达面色异常，又不擅自说明究竟是苍白还是其他变化。
- source_word: ἐνέφαινεν
  choice: 显出了
  rationale: 该动词表示使某事显明、从外在迹象表现出来；“显出了”准确连接外在神色与内在痛苦。
- source_word: τὴν κατὰ ψυχὴν ἀγωνίαν
  choice: 他心灵里的极度痛苦
  rationale: ἀγωνία表示强烈的焦灼、挣扎或痛苦，κατὰ ψυχήν表明这是人里面的经历；“心灵里的极度痛苦”保留内在性和强烈程度，不把该词组解释成一项关于人构成的技术性教义。
theological_decisions:
- issue: ψυχή所表达的人论含义
  choice: 心灵
  alternative: 灵魂；内心
  rationale: 这里的ψυχή指大祭司内在生命所承受的痛苦。“心灵”保留该词超越单纯情绪的分量，同时在现代汉语中自然易懂；语境并不要求把它处理为关于身体与灵魂关系的技术性陈述。
- issue: 痛苦对目睹者造成的影响
  choice: 心神受创
  alternative: 心里刺痛；心中悲痛
  rationale: 原文以“受伤”的动词描写目睹者的διάνοια，保留这一强烈比喻可呈现事件的震撼力，而不将其弱化为一般同情。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大祭司”“心灵”等词保留经文语域；避免古奥句式。前半句保留原文中伤害目睹者心神的强烈比喻，后半句则以外在面容和气色显露内在痛苦的结构对应希腊文。
