  yaml_path: translation/deuterocanon/2_maccabees/003/032.yaml
  text: But the high priest[a], becoming suspicious that the king might perhaps suppose that some wrongdoing against Heliodorus had been carried out by the Jews, offered a sacrifice for the man's recovery.
translation:
  language: zh_hans
  text: '大祭司却担心王或许会认为，犹太人对赫利奥多罗做了某种恶行，就为这人的康复[a]献了祭。


    [a] “康复”也可译作“获救”“保全”或“拯救”。希腊语 σωτηρία 可指获救、保全或拯救；这里很可能是指赫利奥多罗身体的康复。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “康复”也可译作“获救”“保全”或“拯救”。希腊语 σωτηρία 可指获救、保全或拯救；这里很可能是指赫利奥多罗身体的康复。
    reason: 说明 σωτηρία 的词义范围，并交代正文按叙事语境选用“康复”。
lexical_decisions:
- source_word: ὕποπτος ... γενόμενος
  choice: 担心
  rationale: 这里不是说大祭司本人受到怀疑，而是说他警觉并忧虑王可能作出的推断。“担心”能以自然现代汉语表达这一带有戒惧的语气。
- source_word: μή ποτε
  choice: 也许会
  rationale: 该短语引出令人忧虑的可能性；“也许会”同时保留不确定性和担忧语气。
- source_word: διάλημψιν
  choice: 以为
  rationale: 这里指王可能形成某种看法或判断。“以为”简洁自然，又不把语气强化为已有明确指控。
- source_word: κακουργίαν τινά
  choice: 什么坏事
  rationale: κακουργία 指恶行或不法行为，τινά 表示不确指。“什么坏事”在现代汉语中自然地保留这种不确定性。
- source_word: περὶ τὸν Ἡλιόδωρον
  choice: 对赫利奥多罗
  rationale: 与“坏事”和“做了”连用时，表示行为针对赫利奥多罗；“对”准确而自然。
- source_word: συντετελέσθαι
  choice: 做了
  rationale: 完成时不定式表示所设想的行为已经实施；汉语“做了”以体标记“了”表达完成，避免生硬直译。
- source_word: προσήγαγε θυσίαν
  choice: 献了祭
  rationale: 这是标准的献祭用语；“献了祭”庄重、清楚，也符合现代中文宗教叙事习惯。
- source_word: ὑπὲρ τῆς ... σωτηρίας
  choice: 为……康复
  rationale: σωτηρία 语义可涵盖获救、保全和拯救；本段语境涉及赫利奥多罗身体受击倒后恢复，因此正文用“康复”，并在脚注保留更宽的词义。
- source_word: τοῦ ἀνδρός
  choice: 这人
  rationale: 该名词回指赫利奥多罗。“这人”保留了希腊文显式名词的表达，而不是简化为代词。
theological_decisions:
- issue: 叙事性医治／恢复语境中 σωτηρία 的含义
  choice: 正文译作身体“康复”，脚注保留获救、保全和拯救等含义
  alternative: 正文译作“拯救”或“获救”
  rationale: 直接上下文关注赫利奥多罗身体受击倒及其恢复。“康复”最贴合叙事情境，同时脚注保留原词较宽的救援与拯救语义，避免不必要地加入专门的救恩论含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“可是”承接前文转折；“担心王也许会以为”保留原文所表达的忧虑和推测，没有把王的判断说成既定事实。脚注标记置于其实际说明的“康复”之后。
