  text: And the matter concerning Heliodorus and the safeguarding of the treasury proceeded in this way[a].
translation:
  language: zh_hans
  text: 关于赫利奥多罗斯的事，以及对圣库的守护，就这样发展了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“关于赫利奥多罗斯的事和圣库的守护，事情就这样结束了。”
    reason: 词义选择：ἐχώρησεν可指事情如此发展、进行或结局如此；τήρησις可译为“守护”“保护”或“保全”。
lexical_decisions:
- source_word: τὰ ... καθʼ Ἡλιόδωρον
  choice: 关于赫利奥多罗斯的事
  rationale: 中性复数与 κατά 连用，概括与赫利奥多罗斯有关的整件事；此译法自然，并保留本节总结前文的语气。
- source_word: γαζοφυλακίου
  choice: 圣库
  rationale: 本词指库房、财库；上下文特指圣殿的财库，用“圣库”简洁明确，也避免误解为一般国库。
- source_word: τήρησιν
  choice: 得以保全
  rationale: τήρησις 表示看守、保护或保存；结合本章事件，表达圣库未遭侵夺而受到保护的结果。
- source_word: οὕτως
  choice: 就是这样
  rationale: 指向刚刚叙述的经过，作为全段收束，现代汉语表达自然。
- source_word: ἐχώρησεν
  choice: 结束了
  rationale: χωρέω 在这里概括事情如何发展、告终；“结束了”符合章末总结功能，同时脚注保留“如此发展”的过程性理解。
