  text: So Heliodorus immediately set out on the journey[a], outwardly as though to inspect the cities of Coele-Syria and Phoenicia, but in reality to carry out the king’s purpose.
translation:
  language: zh_hans
  text: 于是，赫利奥多罗斯立即启程[a]，表面上像是要巡视柯勒叙利亚和腓尼基各城，实际上却是要实现国王的意图。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据原文在“国王”（βασιλέως）之前出现一个异常的“A”，很可能是版本或转录中的伪迹，并非句意的一部分。因此正文按上下文明确的意思译作“国王的意图”。
    reason: textual_variant
lexical_decisions:
- source_word: εὐθέως
  choice: 立即
  rationale: 准确表达行动迅速，符合现代汉语叙事风格。
- source_word: ἐποιεῖτο τὴν πορίαν
  choice: 启程
  rationale: 以自然简洁的汉语表达开始行程的语意。
- source_word: τῇ μὲν ἐμφάσει
  choice: 表面上
  rationale: 与后文“实际上”形成外观与实情的明确对照，同时不额外强化为蓄意欺骗。
- source_word: ὡς ... ἐφοδεῦσαι
  choice: 像是要巡视
  rationale: ὡς加不定式表示表面或宣称的目的；“巡视”体现ἐφοδεύω逐处走访察看的含义。
- source_word: τὰς κατὰ Κοίλην Συρίαν καὶ Φοινίκην πόλεις
  choice: 柯勒叙利亚和腓尼基各城
  rationale: 保留历史地名，并用“各城”自然表达复数及地域范围。
- source_word: τῷ πράγματι δέ
  choice: 实际上却
  rationale: 鲜明保留与“表面上”的转折对照。
- source_word: τὴν ... πρόθεσιν ἐπιτελεῖν
  choice: 执行……的意图
  rationale: “意图”保留πρόθεσις可指意向或计划的语义宽度，“执行”对应ἐπιτελεῖν。
- source_word: τοῦ A βασιλέως
  choice: 国王的
  rationale: 所给文本中βασιλέως前的“A”显属版本或转录异常；正文按上下文清楚可辨的意义翻译，并以脚注说明。
