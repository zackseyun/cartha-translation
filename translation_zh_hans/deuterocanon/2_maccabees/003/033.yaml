base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/033.yaml
  text: And while the high priest was making atonement[a], the same young men appeared again to Heliodorus, clothed in the same garments, and standing there they said, “Give many thanks to Onias the high priest, for because of him the Lord has graciously granted you your life.”
translation:
  language: zh_hans
  text: 大祭司正在行赎罪礼[a]的时候，那两位青年又向赫利奥多罗斯显现；他们仍穿着同样的衣服，站在那里说：“你要多多感谢大祭司敖尼雅，因为主因他的缘故，已施恩赐你活命。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪礼”也可译作“除罪礼”；较技术性的译法是“行挽回之礼”。
    reason: 说明ἱλασμός同时具有除罪与挽回的祭仪语义，避免正文锁定单一理论。
lexical_decisions:
- source_word: ποιουμένου ... τὸν ἱλασμόν
  choice: 正在行赎罪礼
  rationale: 该属格独立结构表示大祭司正在施行具有赎罪、除罪性质的礼仪。“行赎罪礼”既保留祭仪含义，也比技术性较强的术语更便于现代读者理解。
- source_word: οἱ αὐτοὶ νεανίαι
  choice: 那两位青年
  rationale: αὐτοὶ 指明他们就是上文出现过的人；结合前文所述人数，用“那两位”自然承接叙事。νεανίαι 译作“青年”，保留男性青年之意。
- source_word: ἐν ταῖς αὐταῖς ἐσθήσεσιν ἐστολισμένοι
  choice: 仍穿着同样的衣服
  rationale: 表达他们的装束与先前显现时相同；“仍穿着”自然传达视觉上的连续性，不过度强化“盛装”含义。
- source_word: στάντες
  choice: 站在那里
  rationale: 分词只说明他们站定后说话，并未明确说站在赫利奥多罗斯身旁；“站在那里”避免加入原文没有的空间关系。
- source_word: Πολλὰ Ὀνία τῷ ἀρχιερεῖ χάριτας ἔχε
  choice: 你要多多感谢大祭司敖尼雅
  rationale: πολλὰ 强调感谢的程度；中文“多多感谢”自然保留这一强调。人名按通行中文音译处理。
- source_word: διὰ γὰρ αὐτὸν
  choice: 因为主是因他的缘故
  rationale: διά 加宾格在此表示原因。“因他的缘故”保留因果关系，不将其改释为中介意义。
- source_word: σοὶ κεχάρισται τὸ ζῆν
  choice: 才施恩让你活下来
  rationale: κεχάρισται 含有出于恩惠而赐予之意，“施恩”保留其恩惠色彩；“让你活下来”自然表达 τὸ ζῆν 在上下文中的保全性命。
- source_word: Κύριος
  choice: 主
  rationale: 在此作为对上帝的称谓，译作现代中文圣经语体中自然庄重的“主”。
theological_decisions:
- issue: 圣殿祭仪语境中的 ἱλασμός
  choice: 赎罪礼
  alternative: 除罪礼；挽回祭仪
  rationale: 此处指大祭司所施行的赎罪性礼仪。“赎罪礼”保留祭祀和神学分量，却不把词义限定为某一种关于挽回或除罪的理论；其他可能含义以脚注说明。
- issue: κεχάρισται 的恩惠意味
  choice: 施恩让你活下来
  alternative: 准你活下来；赐你性命
  rationale: 原动词不只是许可，也含白白施惠、恩赐之意。“施恩”明确保留这一层次，同时不进一步断定恩典运作的方式。
- issue: διὰ αὐτόν 所表达的因由
  choice: 因他的缘故
  alternative: 借着他
  rationale: διά 加宾格通常表达原因，此处将赫利奥多罗斯获准存活与敖尼雅的赎罪行动联系起来。译文保留这种神学张力，不把它改写成较弱的时间关联或较强的中介教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“正在……的时候”呈现属格独立结构的同时性；直接引语保持郑重命令口吻。正文避免生硬的神学术语，以脚注保留 ἱλασμός 的词义范围。
