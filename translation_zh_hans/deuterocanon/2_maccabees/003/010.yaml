lexical_decisions:
- source_word: τοῦ δὲ ἀρχιερέως
  choice: 但大祭司
  rationale: 这是属格独立结构，δέ表示叙事转折；用“但”保留轻微的对比意味，时间或情境关系则由汉语句式自然表达。
- source_word: ὑποδείξαντος
  choice: 说明
  rationale: ὑποδείκνυμι在此指指出、表明实情；“说明”自然庄重，也符合大祭司对财物性质作解释的语境。
- source_word: παρακαταθήκας
  choice: 寄存的财物
  rationale: 该词指交由他人保管的钱财或财物。“寄存的财物”既表达受托保管之意，又避免套用现代法律术语。
- source_word: εἶναι
  choice: 这些是
  rationale: 不定式用于间接引语；汉语以完整判断句“这些是”表达最为自然。
- source_word: χηρῶν τε καὶ ὀρφανῶν
  choice: 寡妇和孤儿寄存的
  rationale: 两个属格最自然地表示寄存者或所有者；此译法保留语法上的可能范围，并清楚表明财物与寡妇、孤儿的归属关系。
