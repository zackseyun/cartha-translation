base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/038.yaml
  text: If you have any enemy or one plotting against your affairs[a], send him there[b], and you will receive him back flogged—if indeed he even survives—because there truly is some power of God about the place.
translation:
  language: zh_hans
  text: 你若有什么仇敌，或有人图谋损害你的事务[a]，就把他送到那里去；等你接回他时，他必已受过鞭打——前提是他竟能活着回来[b]——因为那地方周围确实有某种属上帝的力量[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “图谋损害你的事务”也可译作“谋害你的利益”。原文所说的“事务”含义宽泛。
    reason: lexical_alternative
  - marker: b
    text: “活着回来”直译可作“安然脱险”或“得以保全”。这里强调遭遇那地方的神圣力量极其危险。
    reason: lexical_alternative
  - marker: c
    text: “某种属上帝的力量”也可译作“来自上帝的某种力量”。原文的表达既肯定其真实，又没有进一步界定这种力量。
    reason: theological_ambiguity
lexical_decisions:
- source_word: πολέμιον
  choice: 仇敌
  rationale: 指与人敌对的对手；“仇敌”自然、庄重，也保留了明确的个人敌对关系。
- source_word: πραγμάτων ἐπίβουλον
  choice: 图谋损害你的事务
  rationale: ἐπίβουλος 表示暗中谋害或图谋不利，πράγματα 泛指当事人的事务、事情或利益；此译保留其宽泛性，不限定为财产或政治事务。
- source_word: πέμψον αὐτὸν ἐκεῖ
  choice: 把他送到那里去
  rationale: 直接表达命令语气，现代汉语自然清楚。
- source_word: μεμαστιγωμένον
  choice: 已受过鞭打
  rationale: 完成时被动分词强调鞭打已经发生；“鞭打”清楚传达其严厉程度。
- source_word: προσδέξῃ
  choice: 等你接回他时
  rationale: 结合上下文表达把被送去的人重新接回来；“等……时”使希腊文分词与动词间的时间关系在汉语中自然呈现。
- source_word: ἐάνπερ καὶ διασωθῇ
  choice: 前提是他竟能活着回来
  rationale: διασῴζω 在此表示脱险、幸存；ἐάνπερ καί 加强条件的不确定和反讽意味，“竟能”保留其险恶语气。
- source_word: περὶ τὸν τόπον
  choice: 那地方周围
  rationale: περί 加宾格在这里具有空间意味；“周围”比笼统的“在那地方”更贴近原文。
- source_word: ἀληθῶς
  choice: 确实
  rationale: 强调这种力量真实存在；“确实”符合现代庄重叙述语体。
- source_word: τινα θεοῦ δύναμιν
  choice: 某种属上帝的力量
  rationale: τινα 保留不确定而真实的表达，θεοῦ 的属格不被过度解释为来源、所有或具体临在方式；“力量”自然表达 δύναμις。
theological_decisions:
- issue: 圣殿语境中 θεοῦ δύναμιν 所指的神圣力量
  choice: 某种属上帝的力量
  alternative: 来自上帝的某种力量；上帝的大能
  rationale: 原文以 τινα 作不定限定，只断言有一种真实而属神的力量，并未将其定义为某种特定教义意义上的临在。“属上帝的”也避免把属格关系单一解释为来源。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“前提是他竟能活着回来”保留原句带有警告和冷峻反讽的插入语效果；全句不把 θεοῦ δύναμις 扩展为超出原文的特定临在教义。
