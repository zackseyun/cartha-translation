  text: And those from the houses were rushing out in groups for a public supplication[a], because the place was about to come into contempt.
translation:
  language: zh_hans
  text: 人们从各家成群地涌出来，参加全体民众的祈求，因为那地方[a]眼看就要遭人轻视了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 指圣殿区域；希腊原文只说“那地方”。
    reason: 说明语境中的所指，同时保留原文较宽泛的用词。
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῶν οἰκιῶν
  choice: 住在各家里的人也
  rationale: 这句话统称从各家出来的居民。译文没有给“家”添加原文未明说的领属关系，并用“也”承接上文。
- source_word: ἀγεληδὸν
  choice: 成群地
  rationale: 该副词本有像群体一同移动的形象；“成群地”既保留集体行动的意味，又避免不必要的贬抑语气。
- source_word: ἐξεπήδων
  choice: 涌出来
  rationale: 该动词描写迅疾地跃出或冲出，未完成时态又呈现接连发生的场面；“涌出来”自然地表达众人急切而不断从家中出来。
- source_word: ἐπὶ πανδήμῳ ἱκετείᾳ
  choice: 一同举行全民的恳求
  rationale: ἱκετεία 指处于迫切情势中的恳求，πανδήμῳ 表明全体民众共同参与。“全民的恳求”兼顾其公开、共同和庄重迫切的性质。
- source_word: διὰ τὸ μὴ μέλλειν
  choice: 因为……眼看就要
  rationale: 按语境将这一结构理解为迫在眉睫的事态；“眼看就要”比机械直译更自然，并突出危机的临近。
- source_word: εἰς καταφρόνησιν ἔρχεσθαι
  choice: 受人蔑视
  rationale: 原文直译近于“落入蔑视之中”，在这里表示该处将遭轻慢、不受尊重；采用自然的汉语被动表达。
- source_word: τὸν τόπον
  choice: 那地方
  rationale: 原文只用一般名词“地方”，虽由上下文可知所指是圣殿区域，正文仍保留其概括表达，并以脚注说明。
theological_decisions:
- issue: τὸν τόπον 所指为何
  choice: 正文译作“那地方”，由上下文理解为圣殿区域
  alternative: 直接译作“圣殿”或“圣所”
  rationale: 上下文明确涉及耶路撒冷圣殿及其可能受到的亵慢，但希腊文在本节采用 τόπος，而非明确表示圣殿或圣所的词。保留“那地方”可避免把语境所指直接替换成原文没有使用的专称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“涌出来”和“眼看就要”传达原文的动态与迫切感；“恳求”保留集体哀告的肃穆色彩。脚注标记紧接其实际说明的“那地方”，避免误附在“恳求”之后。
