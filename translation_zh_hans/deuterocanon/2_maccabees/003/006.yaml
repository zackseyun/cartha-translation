base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/006.yaml
  text: And he reported that the treasury in Jerusalem was full of immense sums of money[a], so that the quantity of the separate funds was beyond counting, and that they were not connected with the account of the sacrifices[c][b], but that it was possible for these things to fall under the king’s authority.
translation:
  language: zh_hans
  text: 他禀报说，耶路撒冷的库房里充满了巨额钱财，以致各种款项[a]的数目多得无法计数；这些钱不属于献祭的账项[b]，却有可能落在王的权力之下[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各种款项”也可理解为“各笔存款”，可能指托存在库房里的不同款项。
    reason: lexical_alternative
  - marker: b
    text: 即这些钱不归入日常献祭所用的账目或开支；原文并未因此说明它们全无神圣用途。
    reason: lexical_alternative
  - marker: c
    text: 或译“受王控制”。这里说的是落入王的权力范围，并未明确说归王所有。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήγγειλεν
  choice: 禀报说
  rationale: 表示向掌权者报告消息；“禀报”符合叙事中的上下级语境，又保持庄重。
- source_word: χρημάτων ἀμυθήτων
  choice: 巨额钱财
  rationale: χρήματα在此指钱财，ἀμύθητος强调数额大到难以述说或计算；“巨额钱财”自然传达其规模。
- source_word: γαζοφυλάκιον
  choice: 库房
  rationale: 指存放钱财贵重物的 treasury；在圣殿语境中“库房”简洁自然，且不把它误解为现代财政机构。
- source_word: τὸ πλῆθος τῶν διαφόρων
  choice: 各类款项多得
  rationale: διάφορα在财务语境中可指各项钱款，也可能特指托存的各笔款项；正文采用较宽泛的“各类款项”，并以脚注保留后一可能。
- source_word: ἀναρίθμητον
  choice: 无法计数
  rationale: 直接表达“不可数、数不胜数”的夸张力度，符合现代汉语。
- source_word: μὴ προσήκειν αὐτὰ πρὸς τὸν τῶν θυσιῶν λόγον
  choice: 这些钱不属于献祭的账项
  rationale: προσήκειν表示归属或关涉，λόγος在此可指账目、账项或事务；此译文只说明这些钱不归入献祭账项，不进一步断定其是否具有神圣性质。
- source_word: ὑπὸ τὴν τοῦ βασιλέως ἐξουσίαν πεσεῖν
  choice: 落入王的权下
  rationale: 保留πεσεῖν ὑπό“落入……之下”的表达，并用“权下”涵盖权柄、管辖或控制，避免把原文具体化为合法没收。
- source_word: ταῦτα
  choice: 这些钱
  rationale: 代词回指前述钱财；汉语明确说“这些钱”比直译“这些东西”更清楚。
theological_decisions:
- issue: 这些圣殿库款与献祭的关系
  choice: 译为“不属于献祭的账项”
  alternative: 译为“完全是世俗私人存款”或“因不供献祭使用而可被合法收归王有”
  rationale: 希腊文只将这些钱与“献祭的账项”区分开，并未明确否定其一切神圣关联，也未判断王取得这些钱是否合法，因此不补入这些结论。
- issue: 王对钱款可能拥有的权力性质
  choice: 译为“有可能落入王的权下”
  alternative: 译为“可以归王所有”
  rationale: ἐξουσία主要表示权力、权限或控制范围，不必然等同所有权；采用较开放的表达以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“禀报”“库房”“献祭的账项”“王的权下”保持历史语境；句子以分号划分报告内容，避免希腊长句在汉语中显得拖沓。
