base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/027.yaml
  text: But he suddenly fell to the ground and was enveloped in deep darkness[a]; and they picked him up and put him on a stretcher,
translation:
  language: zh_hans
  text: 可是，他忽然倒在地上，被浓重的黑暗笼罩[a]；他们便把他抬起来，放在担架上，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特版希腊文把 γῆν（“地”）连续写了三次，形成“倒向地、地、地”的异常重复；这几乎可以确定是抄写或转录造成的重复，并非作者有意表达。译文依照该短语清楚的意义译作“倒在地上”。
    reason: textual_variant
lexical_decisions:
- source_word: αἴφνω
  choice: 忽然
  rationale: 表达事情出乎意料、顷刻发生；“忽然”自然简洁，也保留了原文的突发感。
- source_word: πεσόντα
  choice: 倒在
  rationale: πίπτω 的不定过去时分词，指他身体倒下；“倒在地上”比带有额外医学含义的“昏倒”更贴近原文。
- source_word: πρὸς τὴν γῆν
  choice: 在地上
  rationale: 此处表示向下倒地的结果，现代汉语自然说“倒在地上”。
- source_word: πολλῷ σκότει
  choice: 浓重的黑暗
  rationale: πολλῷ 修饰“黑暗”，表示强烈、深沉的程度；“浓重的黑暗”庄重自然，又不把它解释成某种特定生理状态。
- source_word: περιχυθέντα
  choice: 被……笼罩
  rationale: 该被动分词有倾注在周围、覆盖之意；“被黑暗笼罩”既保留形象，也符合现代汉语表达。
- source_word: συναρπάσαντες
  choice: 把他抬起来
  rationale: 原词表示迅速抓住、带起；在随即放上担架的语境中，“抬起来”清楚呈现实际动作，而不误导为敌意的“抓走”。
- source_word: φορεῖον
  choice: 担架
  rationale: 指运送失去行动能力之人的承载器具；“担架”是当代读者最容易理解的对应词，也避免“灵柩架”一类丧葬联想。
- source_word: ἐνθέντες
  choice: 放在……上
  rationale: ἐντίθημι 在此指把人安置到承载器具上；“放在担架上”简明自然。
theological_decisions:
- issue: “黑暗”究竟是外在异象、主观失去意识，还是兼含二者
  choice: 按原文保留为“被浓重的黑暗笼罩”
  alternative: 解释为“眼前一黑”或“失去了知觉”
  rationale: 希腊文使用形象性的“黑暗”而未明说其性质；译文不把这一含混意象缩减为单一的生理或超自然解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“可是”承接前文的转折；将连续的希腊语分词结构化为汉语并列动作。“众人”使分词所含的复数行动者在汉语中明确，但不进一步指认其身份。句末保留逗号，以对应本节在原文中尚未完结的句法延续。
