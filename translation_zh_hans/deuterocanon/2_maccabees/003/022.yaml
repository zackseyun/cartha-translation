  yaml_path: translation/deuterocanon/2_maccabees/003/022.yaml
  text: So then they were calling on the all-powerful Lord to keep what had been entrusted to those who had made the deposit safe with all security[a].
translation:
  language: zh_hans
  text: 于是，众人不断呼求全能的主，求他为那些托付财物的人[a]妥善保全受托之物，使其安然无损，万无一失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “托付财物的人”指把财物交付保管的人。
    reason: 说明希腊语主动分词所指的对象，避免误解为受托保管财物的人。
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: 不断呼求
  rationale: 未完成时表示当时持续进行的祈求；“呼求”自然保留向上帝祷告求助的宗教含义。
- source_word: παγκρατῆ
  choice: 全能的
  rationale: 表示拥有统管一切的能力；“全能的”是现代汉语中清楚、庄重而不晦涩的表达。
- source_word: κύριον
  choice: 主
  rationale: 此处是对上帝的敬称，译作“主”符合其通常宗教用法。
- source_word: τὰ πεπιστευμένα
  choice: 受托之物
  rationale: 将完成时被动分词的名词性用法译出，指已经交付保管的财物；“受托之物”简洁且保留被动关系。
- source_word: τοῖς πεπιστευκόσιν
  choice: 为那些托付财物的人
  rationale: 完成时主动分词指将自己的财物托付保管的人；加入“财物”使汉语关系明确，又不把他们技术化地称为“存款人”。
- source_word: σῶα
  choice: 安然无损
  rationale: 作宾语补足语，表示受托之物保持完好、安全；“安然无损”兼顾安全与完整。
- source_word: διαφυλάσσειν
  choice: 妥善保全
  rationale: 该动词含谨慎守护并保存之意；“妥善保全”比单说“保留”更能体现保护意味。
- source_word: μετὰ πάσης ἀσφαλείας
  choice: 万无一失
  rationale: 表达完全稳妥、安全无虞的强调语气；用自然汉语再现希腊语的强化作用。
theological_decisions:
- issue: 神圣称号 κύριον 的译法
  choice: 主
  alternative: 主人
  rationale: 上下文明确指上帝，并带敬虔呼求的意味；“主”既忠实又符合现代汉语宗教语域，无须采用一般人际称谓“主人”。
- issue: παγκρατῆ 所表达的神之能力
  choice: 全能的
  alternative: 掌管万有的
  rationale: “全能的”直接表达对一切拥有能力，并保留原文简洁的形容词形式；“掌管万有的”会较明显地偏向主权层面的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不断呼求”体现未完成时的持续性；“妥善保全……安然无损，万无一失”保留原文对守护、安全与完整的层层强调。源文本开头的“κίαν.”显然是上一节残留的断片，与本节句法不相连，故未纳入正文。
