revisions:
- from: 而且，要亏负那些信赖这地方的神圣，以及这座在全世界备受尊崇的圣殿所具有的庄严和不可侵犯性[a]的人，是绝对办不到的。
  to: 而且，要不公正地对待那些信赖这地方的神圣性，以及这座在全世界备受尊崇的圣殿的庄严和不可侵犯性[a]的人，是完全不可能的。
  rationale: 修订以“不公正地对待”准确表达 ἀδικήσαί，避免“亏负”的现代语义歧义；以“完全不可能”对应原文强化的不可能性。其余句法保留原文的修饰关系：全世界所尊崇的是圣殿，而信赖的对象是该地的神圣性及圣殿的庄严和不可侵犯性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T09:02:40Z'
