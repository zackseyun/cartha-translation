base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/012.yaml
  text: and that to wrong those who had trusted in the holiness of the place[a], and in the majesty and inviolability of the temple honored throughout the whole world, was utterly impossible.
translation:
  language: zh_hans
  text: 而且，要不公正地对待那些信赖这地方的神圣性，以及这座在全世界备受尊崇的圣殿的庄严和不可侵犯性[a]的人，是完全不可能的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“庇护权”或“享有庇护权的地位”；指圣殿因其神圣地位而享有免受侵犯的保护。
    reason: 说明 ἀσυλίᾳ 可泛指不可侵犯的受保护地位，也可特指圣所的庇护权。
lexical_decisions:
- source_word: ἀδίκησαί
  choice: 亏负
  rationale: 表示以不公正的方式对待、损害他人的权益；“亏负”在本句中自然地保留了道德与法律层面的意味，又不局限于身体伤害。
- source_word: τοὺς πεπιστευκότας
  choice: 那些信赖……的人
  rationale: 完成时分词表达已经形成并持续的信赖；“信赖”适合其后所接的与格对象，也避免赋予此处专指教义信仰的含义。
- source_word: ἁγιωσύνῃ
  choice: 神圣
  rationale: 指该地方的圣洁或神圣性质；现代汉语中“这地方的神圣”简洁而庄重。
- source_word: σεμνότητι
  choice: 庄严
  rationale: 表达圣殿令人敬畏、值得尊崇的崇高品格；“庄严”比抽象的“尊贵性”更自然。
- source_word: ἀσυλίᾳ
  choice: 不可侵犯性
  rationale: 该词表示免遭侵占、劫掠或侵犯的受保护地位，并可含有圣所庇护权的专门意味；正文采用较宽泛的“不​​可侵犯性”，具体语义见脚注。
- source_word: τετιμημένου
  choice: 备受尊崇
  rationale: 完成时被动分词表示圣殿已经获得并持续享有公认的尊荣；“备受尊崇”体现这一状态。
- source_word: κατὰ τὸν σύμπαντα κόσμον
  choice: 在全世界
  rationale: 保留原文扩张而带修辞色彩的普世范围，同时符合现代汉语表达。
- source_word: παντελῶς ἀμήχανον εἶναι
  choice: 是绝对办不到的
  rationale: “绝对”对应 παντελῶς 的强化作用，“办不到”自然传达 ἀμήχανον 的完全不可能。
theological_decisions:
- issue: 是否把 ἀσυλίᾳ 明译为圣所的庇护权
  choice: 不可侵犯性
  alternative: 庇护权；享有庇护权的地位
  rationale: 该词可特指圣所提供庇护的法律特权，但在本句中与“庄严”等抽象性质并列。“不可侵犯性”保留法律与宗教双重保护的较宽含义，不贸然缩窄；脚注说明其庇护权意涵。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这地方”与“这座……圣殿”保留原文由 τόπος 转向 ἱερόν 的表达；句末“不可能”的判断不补入原文未明说的主语或动机。
