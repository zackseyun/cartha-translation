base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/004.yaml
  text: But a certain Simon[a], of the tribe of Benjamin, having been appointed overseer of the temple, was at odds with the high priest about the administration of the market in the city.
translation:
  language: zh_hans
  text: 但有一个便雅悯支派的人，名叫西门，被任命为圣殿的主管；他就城中的市场管理[a]一事，与大祭司发生了争执。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“市场监管”。希腊词指与市场有关的公共监督和管理。
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάτης
  choice: 主管
  rationale: 该词表示受命负责监督、管理或维护某事物的人；“主管”自然体现正式的管理职责，同时不暗示祭司身份。
- source_word: τοῦ ἱεροῦ
  choice: 圣殿
  rationale: ἱερόν在此通常指整个圣殿范围，而不只是内部圣所；“圣殿”符合中文圣经语体，也清楚易懂。
- source_word: καθεσταμένος
  choice: 被任命为
  rationale: 该分词表示西门被正式设立在这一职位上；“被任命为”准确表达其受命履职的性质。
- source_word: διηχθῆναι
  choice: 发生了争执
  rationale: 上下文所表达的是与大祭司意见不合、产生冲突；“发生了争执”保留冲突意味，却不夸大为公开敌对。
- source_word: ἀρχιερεῖ
  choice: 大祭司
  rationale: 这是犹太教该职分在现代中文圣经中的标准译法。
- source_word: ἀγορανομίας
  choice: 市场管理
  rationale: 该词指与市场有关的公共监督、秩序维护或行政管理；“市场管理”简明自然，并以脚注保留“市场监管”等可能范围。
- source_word: κατὰ τὴν πόλιν
  choice: 城里的
  rationale: 该短语限定市场管理所在或施行的领域；“城里的”自然保留其地点意义。
theological_decisions:
- issue: 西门在圣殿中的职分性质
  choice: 正式受任的圣殿主管，不视为祭司职衔
  alternative: 把他译作圣殿的“保护人”或具有更广泛庇护身份的人
  rationale: προστάτης与καθεσταμένος合在一起强调受任的监督管理角色；经文本身没有说西门是祭司，因此译文不添加这种身份。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“有一个……名叫……”比直译“某个西门”更符合自然汉语；分号呈现其职务背景与争执主线。
