  yaml_path: translation/deuterocanon/2_maccabees/003/035.yaml
  text: But Heliodorus[a], after offering a sacrifice to God and making very great vows to the one who had preserved his life, and after taking leave of Onias[c][b], returned to the king.
translation:
  language: zh_hans
  text: 赫利奥多罗向上帝献祭，又向那位保全他性命的上帝许下极大的愿[a]；他向敖尼雅告别[b]后，便拔营回到王那里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作了极其热切的祷告。”希腊语εὐχή既可指祷告，也可指所许的愿；这里的献祭语境较支持“愿”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“接待了敖尼雅。”这里的希腊语动词可指接待、欢迎，也可指辞别；下文说他随即离去，因此正文译作“告别”。
    reason: lexical_alternative
  - marker: c
    text: “拔营回到”所译的希腊语动词带有军事色彩，可指撤营、移营或回师。
    reason: cultural_note
lexical_decisions:
- source_word: θυσίαν ἀνενέγκων τῷ θεῷ
  choice: 向上帝献了祭
  rationale: ἀναφέρω与θυσία连用，指献上祭物；与格τῷ θεῷ标明承受者。译文自然体现动作及其对象。
- source_word: εὐχὰς μεγίστας εὐξάμενος
  choice: 许下极重的愿
  rationale: εὐχή可指祷告或誓愿；在献祭语境中，“许愿”较为贴切。μεγίστας为最高级形式，这里以“极重”表达其强烈程度，同时保留另解于脚注。
- source_word: τῷ τὸ ζῆν περιποιήσαντι
  choice: 向那位保全他性命的上帝
  rationale: 冠词化分词指前述上帝；περιποιέω在此表示使其得以继续活着。“保全他性命”符合赫利奥多罗死里逃生的上下文。复现“上帝”使中文所指清楚。
- source_word: τὸν Ὀνίαν ἀποδεξάμενος
  choice: 向敖尼雅辞别
  rationale: ἀποδέχομαι可指接待、欢迎，也可在离行情境中表示辞别；此处随后启程返回王那里，故正文采用“辞别”，并在脚注保留词义歧义。
- source_word: ἀνεστρατοπέδευσεν
  choice: 拔营返回
  rationale: 该动词带军事色彩，可表示撤营、移营或回师；“拔营返回”既保留军旅行动的形象，又符合现代汉语叙事。
- source_word: πρὸς τὸν βασιλέα
  choice: 王那里
  rationale: πρός加宾格表示朝向某人移动；结合“返回”，译作“返回王那里”自然准确。
theological_decisions:
- issue: “那位保全他性命的”所指为何
  choice: 明确指上帝
  alternative: 较笼统地译为“那位赐他生命的”
  rationale: 语法上该与格短语与前面的“上帝”连续，叙事背景又是赫利奥多罗从濒死中获救，因此指上帝保全他的性命；这无需引入额外教义。
- issue: εὐχὰς理解为祷告还是誓愿
  choice: 正文采用“愿”
  alternative: 译为“极其恳切的祷告”
  rationale: 该名词确有“祷告”和“誓愿”两义；献祭语境略偏向誓愿，但并非绝对，故用脚注保存真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“赫利奥多罗”“敖尼雅”依常见次经人名译法；以“拔营返回”保留原文军事语感。所有脚注标记均置于相应正文之后。
