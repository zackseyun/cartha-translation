lexical_decisions:
- source_word: ὁ δ᾽ ἕτερος
  choice: 可是，另一方
  rationale: δέ表示转折，ἕτερος指与前文一方相对的另一方；译作“另一方”既保留对比，也不擅自补入原文没有的身份称谓。
- source_word: δι᾽ ἃς εἶχεν βασιλικὰς ἐντολάς
  choice: 因持有王命
  rationale: διά在此说明其坚持的缘由；βασιλικὰς ἐντολάς指来自君王的命令。“持有王命”简洁、自然，并符合奉命行事的语境。
- source_word: πάντως ἔλεγεν
  choice: 仍坚持说
  rationale: πάντως加强语气，未完成时ἔλεγεν带有持续或反复之意；“仍坚持说”兼顾上下文中的对峙、强调和持续性。
- source_word: εἰς τὸ βασιλικὸν
  choice: 收归王室国库
  rationale: 在查收财物的语境中，中性名词化的βασιλικόν很可能指王室财政机构或国库；“王室国库”清楚表达这一制度性含义，同时以脚注保留另一种自然表述。
- source_word: ἀναλημπτέα
  choice: 必须收归
  rationale: 动词形容词表示必要或义务；“必须”传达其强制意味，“收归”则自然呈现财物被纳入王室所有或国库的方向。
- source_word: ταῦτα
  choice: 这些财物
  rationale: ταῦτα为复数指示词，指向上下文所谈的财物；补出“财物”能使中文独立成句时含义清楚，且未超出语境。
