  text: And all of them[a], stretching out their hands toward heaven[b], were making supplication.
translation:
  language: zh_hans
  text: 她们全都向天伸出双手，恳切祈求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳切祈求”所译的希腊语指迫切的祈求，不一定是后来教会礼仪意义上的固定“连祷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαι
  choice: 她们全都
  rationale: 阴性复数形式承接上文所说的妇女；用“她们”既自然，也保留明确的阴性指向。
- source_word: προτείνουσαι τὰς χεῖρας
  choice: 伸出双手
  rationale: 分词表示把手向前或向外伸展；汉语用“伸出双手”自然地表达祈祷姿势。
- source_word: εἰς τὸν οὐρανόν
  choice: 向天
  rationale: εἰς 表示动作方向；在祈祷语境中，“天”既自然，也指向神圣领域，而不只是物理天空。
- source_word: ἐποιοῦντο
  choice: 恳切祈求
  rationale: 未完成时表示当时持续进行的动作；现代汉语无需机械译出“正在作”，语境中的持续性可由整句叙事体现。
- source_word: τὴν λιτανείαν
  choice: 恳切祈求
  rationale: λιτανεία 指迫切的祈求或恳求；译作“恳切祈求”可避免现代“连祷”所暗示的固定礼仪形式。
theological_decisions:
- issue: 祈祷姿势中的 οὐρανός 如何翻译
  choice: 天
  alternative: 天空
  rationale: 此处描写向上举手祈求的动作，“天”符合祈祷语境，同时没有额外加入经文未明说的教义内容。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“她们全都”明确承接上文妇女；“向天伸出双手”保持原文动作次序；以“恳切祈求”传达 λιτανεία 的迫切含义。
