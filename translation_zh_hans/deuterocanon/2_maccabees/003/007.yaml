base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/007.yaml
  text: After conferring with the king[a], Apollonius informed him about the money that had been reported to him. Then the king appointed Heliodorus, who was over the affairs of state[c][b], and sent him with orders to carry out the removal of the aforementioned money.
translation:
  language: zh_hans
  text: 亚波罗尼与王会面[a]后，便向王禀报了那笔有人向他报告的钱财。王于是选派掌管政务的赫利奥多罗斯[b]，命他把上述钱财运走[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与王商议后”。原文可指与王相见，也可能包含正式交谈或商议。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“主管事务的人”，是掌管国家政务的高级官员职衔。
    reason: cultural_note
  - marker: c
    text: 或译“把上述钱财搬走”。原文强调将钱财从存放之处移出并带走。
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμίξας
  choice: 与王会面
  rationale: 该分词表示与王相见并有所交谈；“会面”自然保留正式接触的含义，又不把语义限定为一定进行了商议。
- source_word: ἐνεφάνισεν
  choice: 禀告了王
  rationale: 此处指亚波罗尼把有关钱财的消息正式呈报君王；“禀告”符合王室行政语境，也清楚易懂。
- source_word: μηνυθέντων
  choice: 有人向他报告的
  rationale: 被动分词表明这笔钱先前已被人告知亚波罗尼；加入“有人”使汉语被动关系清晰，同时避免采用带控告意味的更强译法。
- source_word: χρημάτων
  choice: 钱／钱财
  rationale: 语境指具体的一笔财物；前句用“那笔钱”符合现代汉语，后句用“上述钱财”保持正式公文语气。
- source_word: προχειρισάμενος
  choice: 选派
  rationale: 该词表示为特定任务挑选并委派某人；“选派”同时体现选择和差遣，比单纯“任命”更贴合本句任务性语境。
- source_word: τὸν ἐπὶ τῶν πραγμάτων
  choice: 掌管政务的
  rationale: 这是高级行政职衔，字面为“主管事务者”；“掌管政务”说明其国家行政职责而不过度确定具体官名。
- source_word: ἐκκομιδὴν ποιήσασθαι
  choice: 把……运走
  rationale: 该组合表示实施从存放地点移出、带走钱财；“运走”简洁自然，并保留行动重点在将其移离原处。
- source_word: προειρημένων
  choice: 上述
  rationale: 回指此前提到的钱财；“上述”准确保留正式行政文体。
