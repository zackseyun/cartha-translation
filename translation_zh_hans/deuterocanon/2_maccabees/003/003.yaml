  text: so that even Seleucus[a], the king of Asia[b], used to provide from his own revenues all the expenses that fell due for the services of the sacrifices.
translation:
  language: zh_hans
  text: 以致连亚细亚[a]的王塞琉古，也常从自己的岁入中拨付献祭礼仪所应付的一切费用。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“亚细亚”是希腊化时代对塞琉古王朝亚洲领土的称呼，并非指现代意义上的整个亚洲大陆。
    reason: cultural_note
  - marker: b
    text: “献祭礼仪所应付的一切费用”也可译作“献祭礼仪所需的一切费用”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε καὶ
  choice: 因此，甚至
  rationale: 承接上文所述圣殿秩序与声望所产生的结果，并保留καί的强调意味。
- source_word: χορηγεῖν
  choice: 支付
  rationale: 此处指从君王自己的收入中承担并供给费用；现代汉语以“支付”表达财政资助最自然。
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: 从自己的收入中
  rationale: πρόσοδοι指收入、岁入；译文保留资金来源的财政含义。
- source_word: λειτουργίας τῶν θυσιῶν
  choice: 献祭礼仪
  rationale: 在圣殿语境中指与献祭有关的礼仪性服事；合译为“献祭礼仪”简洁自然，也避免套用后世教会术语。
- source_word: ἐπιβάλλοντα δαπανήματα
  choice: 所需的一切费用
  rationale: ἐπιβάλλοντα表示应当承担、规定需付的费用；“所需”在现代汉语中自然传达必要与责任含义。
- source_word: τὸν τῆς Ἀσίας βασιλέα
  choice: 亚细亚王
  rationale: 保留希腊化时代的历史称号；脚注说明其地理范围，避免读者按现代亚洲全境理解。
theological_decisions:
- issue: 次经历史叙事中的祭祀术语
  choice: 以“献祭礼仪”直述圣殿祭祀活动
  alternative: 献祭的职事／祭祀服事
  rationale: 原文是在叙述君王资助圣殿祭祀，不要求引入后世教会制度或宗派术语；“献祭礼仪”兼顾礼仪语境与现代可读性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“亚细亚”保留历史地名色彩；“也常”表达χορηγεῖν在此处的持续或惯常背景意义。
