  source_fidelity: 译文基本准确传达了王室从自身岁入承担祭祀相关经费的意思。但ὥστε是承接上文的结果，宜译为“以致”；χορηγεῖν不仅是一般“支付”，更是供应、拨付费用。
  naturalness: “亚细亚王塞琉古”虽可理解，但“亚细亚的王塞琉古”在现代标准汉语中更清楚自然。“从自己的收入中，支付”中的逗号不必要。
  terminology: “献祭礼仪”可恰当对应λειτουργίας τῶν θυσιῶν，既保留礼仪/祭祀语境，也不引入后世教会职分含义。“所应付的一切费用”较准确表达ἐπιβάλλοντα δαπανήματα，即须承担或到期应付的开支。
  issues:
