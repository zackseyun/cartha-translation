    rationale: 该词指由资助者提供、供给所需经费；“拨付”在财政语境中更为贴切。
  - severity: medium
    issue: 脚注b的替代译文“献祭礼仪应当承担的一切开支”使礼仪成为承担费用的主体。
    rationale: 原文是费用为献祭礼仪所需或应付，不是礼仪本身承担开支；应改为“为献祭礼仪所应付的一切费用”。
