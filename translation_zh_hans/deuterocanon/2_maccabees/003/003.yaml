revisions:
- from: 因此，甚至亚细亚[a]王塞琉古也常从自己的收入中，支付献祭礼仪所需的一切费用。[b]
  to: 以致连亚细亚[a]的王塞琉古，也常从自己的岁入中拨付献祭礼仪所应付的一切费用。[b]
  rationale: 将结果连词调整为“以致”，以对应ὥστε；以“拨付”表达χορηγεῖν的资助和供应性质；将“收入”具体为财政语境更强的“岁入”；并修正脚注替代译文的施事关系。其余历史称号和祭祀术语均予保留。
