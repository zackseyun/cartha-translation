  text: While the holy city was inhabited in complete peace[a], and the laws were being observed in the best way because of Onias the high priest,
translation:
  language: zh_hans
  text: 3:1 那时，圣城居民安享太平，法律也因大祭司敖尼雅而得到极其妥善的遵守[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “极其妥善地”或译“以最好的方式”。
    reason: κάλλιστα既可表达“非常好”，也可保留最高级意义译作“以最好的方式”。
lexical_decisions:
- source_word: Τῆς ἁγίας πόλεως
  choice: 圣城
  rationale: “圣城”是现代汉语中自然、庄重的对应表达，保留ἁγίας的宗教含义。
- source_word: κατοικουμένης μετὰ πάσης εἰρήνης
  choice: 居民安享太平
  rationale: 原文以属格独立结构描述圣城有人居住且处于全面和平的状态；译文采用自然汉语表达其安定生活的情形。
- source_word: τῶν νόμων
  choice: 法律
  rationale: 保留复数所指的各项律法和条例之集合含义；汉语“法律”本身可作集合名词，无须机械添加复数形式。
- source_word: ὅτι κάλλιστα
  choice: 极其妥善地
  rationale: κάλλιστα是最高级副词，也可加强为“非常好”；“极其妥善地”兼顾其强调语气和现代汉语的自然度。
- source_word: συντηρουμένων
  choice: 得到……遵守
  rationale: 用于法律语境时，“遵守”比“保存”或“维持”更符合汉语习惯，并保留被动含义。
- source_word: διὰ τὴν Ὀνίου τοῦ ἀρχιερέως
  choice: 因大祭司敖尼雅而
  rationale: διά接宾格通常表示原因；“因……而”保留因果关系。Ὀνίας按人名音译为“敖尼雅”。
theological_decisions:
- issue: διά与大祭司敖尼雅之间的因果关系
  choice: 译作“因大祭司敖尼雅而”，将守法状况归因于他的影响
  alternative: 译作“借着大祭司敖尼雅”
  rationale: 原文διά接宾格最自然地表示原因；此译法仅反映叙事对敖尼雅的肯定，不额外引入教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“安享太平”自然传达μετὰ πάσης εἰρήνης的全面安定；句末保留逗号，因为所给希腊文本及本节内容在此处仍是从属结构，语意尚待下文完成。
