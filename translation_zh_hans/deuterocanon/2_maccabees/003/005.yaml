base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/005.yaml
  text: And since he was unable to overcome Onias[a], he went to Apollonius son of Thrasaeus[b], who at that time was governor of Coele-Syria and Phoenicia.
translation:
  language: zh_hans
  text: 他无法胜过奥尼亚，就去见特拉塞乌斯的儿子亚波罗尼乌斯[a]；亚波罗尼乌斯当时任科埃勒叙利亚和腓尼基的总督[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“亚波罗尼乌斯·特拉塞乌斯”中的属格可理解为父名称谓，正文据此译作“特拉塞乌斯的儿子亚波罗尼乌斯”；也可能将其理解为附加名号。
    reason: lexical_alternative
  - marker: b
    text: 希腊文 στρατηγός 既可指“将军”，也可指“总督”。这里因其管辖科埃勒叙利亚和腓尼基，正文译作“总督”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νικήσαι
  choice: 胜过
  rationale: 此处指在冲突或对抗中压倒奥尼亚、占得上风；“胜过”不把语义限于军事击败。
- source_word: μὴ δυνάμενος
  choice: 无法
  rationale: 分词结构说明随后行动的原因或处境；“无法……就……”以自然汉语表达这一因果关系。
- source_word: ἦλθεν πρὸς
  choice: 去见
  rationale: 按叙事视角表示前往某人那里；“去见”既表达移动，也符合求见官员的语境。
- source_word: Ἀπολλώνιον Θρασαίου
  choice: 特拉塞乌斯的儿子亚波罗尼乌斯
  rationale: 属格 Θρασαίου 在此最自然地作父名称谓理解；正文明确译出亲子关系，同时用脚注保留其可能作为附加名号理解的余地。
- source_word: τὸν ... στρατηγόν
  choice: 总督
  rationale: στρατηγός 可指将军，也可指治理地区的行政长官；这里紧接所辖地域，故“总督”更贴合语境。
- source_word: κατʼ ἐκεῖνον τὸν καιρόν
  choice: 当时
  rationale: 简明自然地交代亚波罗尼乌斯任职的时间背景。
- source_word: Κοίλης Συρίας καὶ Φοινίκης
  choice: 科埃勒叙利亚和腓尼基
  rationale: 采用历史地区名称的音译，避免直译为“低洼叙利亚”等而使专名难以辨认。
