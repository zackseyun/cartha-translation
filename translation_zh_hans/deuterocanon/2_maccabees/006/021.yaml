base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/021.yaml
  text: But those who had been appointed over the unlawful meal[a], because of their long-standing acquaintance with the man, took him aside privately and urged him to bring meat that it was proper for him to use, prepared by himself, and to pretend that he was eating the meats from the sacrifice that had been ordered by the king[b],
translation:
  language: zh_hans
  text: 可是，那些受命负责这违法之事的人，因同这人是多年的旧识，便对他心生怜悯[a]。他们私下把他叫到一旁，劝他带些由他自己预备、可供他食用的肉来，然后假装吃王命令他吃的祭肉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “违法之事”直译为“违法的事物”；原文在此没有具体说明，按上下文是指强迫他参与、食用祭肉的事。原文也明确有“怜悯”一词；它与“多年的旧识”在句中的具体修饰关系略有歧义。
    reason: 说明τὰ παράνομα的省略性所指，并保留σπλαγχνισμοῦ与长期旧识短语之间的句法歧义。
  - marker: b
    text: “祭肉”指祭祀供物中的肉，即王命令他吃的肉。
    reason: 说明ἀπὸ τῆς θυσίας κρεῶν的祭祀背景，并澄清王命令的是食用而非献祭。
lexical_decisions:
- source_word: οἱ ... τεταγμένοι
  choice: 那些受命操办……的人
  rationale: 完成时被动分词表示这些人先前已受指派，现正承担相关职责；“受命操办”自然表达其受任负责之意。
- source_word: πρὸς τὰ παράνομα
  choice: 操办违法筵席
  rationale: 原文直译为“为着违法之事”，所指略有省略；上下文明确涉及强迫人吃禁食的祭肉，因此译为“违法筵席”，同时在脚注说明原文的概括性。
- source_word: σπλαγχνισμοῦ
  choice: 动了怜悯之心
  rationale: 该词明确表达怜悯或同情，不应只隐含在旧交关系中；此译保留原文的情感动机。
- source_word: διὰ τὴν ἐκ τῶν παλαιῶν χρόνων πρὸς τὸν ἄνδρα γνῶσιν
  choice: 因与这人相识多年
  rationale: γνῶσις在这里指人与人之间的认识、交情；“相识多年”简明自然地表达长期旧识。
- source_word: ἀπολαμβάνοντες αὐτὸν κατʼ ἰδίαν ἐκάλουν
  choice: 私下把他拉到一旁，劝他
  rationale: ἀπολαμβάνοντες与κατʼ ἰδίαν表示将他从众人中带开；ἐκάλουν在语境中引出劝说或提议。
- source_word: ἐνέγκοντα κρέα
  choice: 带些……肉来
  rationale: 保留“带来”的动作，并以“些肉”符合现代汉语对集合名词的表达。
- source_word: οἷς καθῆκον αὐτῷ χρᾶσθαι
  choice: 合乎规矩可供他食用的
  rationale: καθῆκον表示合宜、合乎本分；χρᾶσθαι本义较宽，但在肉食语境中自然指食用。“合乎规矩”保留其宗教与伦理上的合宜性，而不过度解释为某一具体律例。
- source_word: διʼ αὐτοῦ παρασκευασθέντα
  choice: 由自己预备
  rationale: 表示这些肉由他本人预备或在其掌控下备妥，以区别于王所指定的祭肉。
- source_word: ὑποκρῖναι
  choice: 假装
  rationale: 此处意为装作正在做某事，而非“回答”或“扮演”。
- source_word: τὰ ὑπὸ τοῦ βασιλέως τεταγμένα
  choice: 王所命令的
  rationale: 表示王所规定、命令人食用的，汉语用“所命令的”保留权力与强制意味。
- source_word: τῶν ἀπὸ τῆς θυσίας κρεῶν
  choice: 祭肉
  rationale: 原文指来自祭祀的肉；“祭肉”简洁自然，脚注交代这是异教祭品中的肉。
theological_decisions:
- issue: πρὸς τὰ παράνομα所指的性质
  choice: 按上下文译作“违法筵席”
  alternative: 违法之事；违法仪式
  rationale: 原文表达概括且有所省略，而眼前情节集中在被禁止的食物与强迫进食。正文采用具体而易懂的表达，脚注保留其字面范围与句法上的含混。
- issue: σπλαγχνισμοῦ是否应明确译出
  choice: 明确译为“动了怜悯之心”
  alternative: 只译“因与这人相识多年”，将怜悯隐含在整句中
  rationale: 希腊文明确出现表示怜悯的名词。将其明译可避免遗漏原文动机，同时不对这些人的行为作额外道德判断。
- issue: καθῆκον的规范性含义
  choice: 合乎规矩
  alternative: 合法；适合
  rationale: “合法”可能把宗教礼法窄化为现代法律概念，“适合”又可能削弱伦理与礼仪含义；“合乎规矩”较好保留其开放性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“违法筵席”承接上下文但以脚注保留原文“违法之事”的概括性；“动了怜悯之心”明确呈现希腊文的情感用语；句式保持叙事流畅，不加入宗派性解释。
