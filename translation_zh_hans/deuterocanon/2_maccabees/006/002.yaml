base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/002.yaml
  text: and also to defile the temple in Jerusalem and to name it for Olympian Zeus[a], and the one on Gerizim, as those who inhabited the place happened to do[b], for Zeus the protector of strangers.
translation:
  language: zh_hans
  text: 又要玷污耶路撒冷的圣殿，把它称为“奥林匹斯宙斯”[a]；又要把基利心的圣殿称为“宙斯·护佑异乡人者”[b]，这与住在那地方的人当时的情形相应。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把它改称为奥林匹斯宙斯的殿。”希腊语动词可指另加名称或改用新的称号。
    reason: lexical_alternative
  - marker: b
    text: 希腊语为“宙斯·克塞尼奥斯”，即宙斯作为宾客、异乡人和待客之道的护佑者。原文关于当地居民的短语十分简略，也可理解为这称号与他们当时的身份或处境相应。
    reason: lexical_alternative
lexical_decisions:
- source_word: μολῦναι
  choice: 玷污
  rationale: 这个不定式指使圣所沾染礼仪和道德上的污秽；“玷污”既保留宗教语境中的力度，也符合现代汉语表达。
- source_word: νεὼ
  choice: 圣殿
  rationale: νεώς在这里指宗教建筑；谈及耶路撒冷及基利心山上的敬拜场所时，“圣殿”自然且能体现其神圣用途。
- source_word: προσονομάσαι
  choice: 把它称为
  rationale: 该动词可指加上一个名称或另作称号。“把它称为”保留了命名或改称的可能性，不武断限定具体程序。
- source_word: Διὸς Ὀλυμπίου
  choice: 奥林匹斯宙斯
  rationale: 将宙斯的希腊称号译出，使普通读者能看出圣殿被强行归于希腊神祇，同时保留专名“宙斯”。
- source_word: Γαριζείν
  choice: 基利心山
  rationale: 采用现代中文圣经中较为熟悉的地名形式；原文虽只写地名，此处所指是该山上的圣殿，加“山”有助于自然辨识地点。
- source_word: καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: 按照当地居民当时的情形
  rationale: 希腊语表达简略，可能指命名与当地居民既有的身份、处境或惯例相应。此译保留其周境性和含混性，不擅自解释为居民主动请求或特定风俗。
- source_word: Διὸς ξενίου
  choice: 护佑异乡人的宙斯
  rationale: ξένιος是宙斯与宾客、异乡人及待客之道有关的称号；正文用解释性称号表达核心含义，脚注补充其语义范围。
theological_decisions:
- issue: 犹太圣所遭亵渎的叙事中如何翻译异教神祇称号
  choice: 将称号意译为“奥林匹斯宙斯”和“护佑异乡人的宙斯”
  alternative: 音译为“宙斯·奥林匹奥斯”和“宙斯·克塞尼奥斯”
  rationale: 意译能让现代读者明白强行改称圣殿所带来的宗教性亵渎，同时没有把叙事扩展成额外的神学判断。
- issue: καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες的含义
  choice: 译作周境性的“按照当地居民当时的情形”
  alternative: 译为“照当地居民所行的”或更明确地解释为“应当地居民的请求”
  rationale: 原文压缩且含义不完全确定；采用较开放的表达，避免断言居民主动参与、提出请求或具有某种固定风俗。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“又要”承接上文命令或措施；分号呈现两个圣所之间的平行关系。正文保留当地居民短语的含混性，并在脚注说明其可能范围。
