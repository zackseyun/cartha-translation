  yaml_path: translation/deuterocanon/2_maccabees/006/019.yaml
  text: But he[a], choosing death with honor rather than life with defilement, went to the rack of his own accord,
translation:
  language: zh_hans
  text: 但他宁可光荣地死，也不愿在污秽中活着，于是自愿走向刑具[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“鼓”，这里指一种刑具；其确切形制不能确定，也有译作“刑架”或“刑轮”的。
    reason: 说明词义转用及古代刑具具体形制的不确定性。
lexical_decisions:
- source_word: μετʼ εὐκλείας θάνατον
  choice: 光荣地死
  rationale: εὐκλεία表示美名、荣誉或光荣；译作“光荣地死”自然凝练，并与下文在污秽中活着形成鲜明对照。
- source_word: μᾶλλον ἢ
  choice: 宁可……也不愿……
  rationale: 准确表达希腊文的比较取舍关系，也符合现代汉语习惯。
- source_word: μετὰ μύσους βίον
  choice: 在污秽中活着
  rationale: μύσος可指道德或礼仪上的污秽；“污秽”保留其强烈含义，又不把它窄化为某一种具体的礼仪范畴。
- source_word: ἀναδεξάμενος
  choice: 宁可……死
  rationale: 该分词表示主动接受或选取；结合比较结构，以“宁可”体现他有意识地接受光荣之死。
- source_word: αὐθαιρέτως
  choice: 自愿
  rationale: 突出行动出于本人意愿，而非被动押解。
- source_word: ἐπὶ τὸ τύμπανον
  choice: 走向刑具[a]
  rationale: τύμπανον在此指施刑器具，而非普通乐器；“刑具”传达其功能，同时避免武断确定具体形制。
- source_word: προσῆγεν
  choice: 走向
  rationale: 与“自愿”相配，表达他主动上前，而非被人带去。
theological_decisions:
- issue: 殉道语境中μύσος的含义
  choice: 污秽
  alternative: 耻辱；玷污
  rationale: 上下文涉及在威逼下违背律法；“污秽”保留道德与礼仪两方面的张力，不将其仅仅解释为社会性的丢脸。
- issue: τύμπανον所指的刑具
  choice: 刑具
  alternative: 鼓；刑架；刑轮
  rationale: 原词字面可指“鼓”，但本节语境明确涉及酷刑。由于器具的确切构造不能确定，正文采用功能性而不过度具体的“刑具”，脚注说明字面意义及不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的表达。“宁可……也不愿……”清楚呈现人物主动取舍；“光荣地死”与“在污秽中活着”保持原文的平行对照。
