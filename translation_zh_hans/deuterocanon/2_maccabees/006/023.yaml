base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/023.yaml
  text: But he[a], adopting a noble resolve worthy of his age and of the dignity of old age, and of the distinction of his acquired and honored way of life, and of the finest conduct from childhood—rather, in keeping with the holy and God-given law—declared himself plainly, saying that they should send him quickly to Hades.
translation:
  language: zh_hans
  text: 但他作出了一个高尚的决定；这决定配得上他的年岁、老年的尊严、他后天养成并受人敬重的生活方式，以及他自幼以来极其美好的品行——更确切地说，是按照那神圣、由上帝设立的律法作出的。他明确表明自己的立场，说要他们赶快送他到阴间去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”也可译作“死者之境”。希腊文作“哈得斯”。
    reason: 说明ᾅδης指死者所在之境，并非专指最终刑罚之地；保留音译及语义替代。
lexical_decisions:
- source_word: λογισμὸν ἀστεῖον
  choice: 一个高尚的决定
  rationale: λόγισμος在此指经过思量的决定，ἀστεῖος在道德语境中表示高尚、可嘉；此译自然地保留其审慎与崇高意味。
- source_word: ἀναλαβὼν
  choice: 作出了
  rationale: 该分词表示接受、采取这一决定；中文用“作出了一个……决定”最自然，也保留主动决断之意。
- source_word: ἄξιον τῆς ἡλικίας
  choice: 配得上他的年岁
  rationale: 保留ἄξιος的价值判断，并以现代中文表达其与年岁相称、相配的意思。
- source_word: τῆς τοῦ γήρους ὑπεροχῆς
  choice: 老年的尊严
  rationale: ὑπεροχή可指卓越、显赫或尊贵；此处强调高龄所带来的可敬地位，译作“尊严”庄重而易懂。
- source_word: τῆς ἐπικτήτου καὶ ἐπιφανοῦς πολιτείας
  choice: 他后天养成并受人敬重的生活方式
  rationale: πολιτεία在此更可能指生活方式或为人处世，而非政治公民身份；ἐπίκτητος表示后来获得或养成，ἐπιφανής表示显著、享有声望。
- source_word: τῆς ἐκ παιδὸς καλλίστης ἀναστροφῆς
  choice: 他自幼以来极其美好的品行
  rationale: ἀναστροφή指行为、品行或生活表现；“自幼以来”准确体现ἐκ παιδός，“极其美好”传达最高级καλλίστης。
- source_word: μᾶλλον δὲ
  choice: 更确切地说
  rationale: 该短语对前述理由作递进兼修正，将律法置于更根本的位置；“更确切地说”能体现这一修辞转折。
- source_word: τῆς ἁγίας καὶ θεοκτίστου νομοθεσίας
  choice: 那神圣、由上帝设立的律法
  rationale: θεόκτιστος字面强调由上帝建立或设立；νομοθεσία可指立法、律法制度。此译保留神圣性与神圣来源，而不把它仅弱化为一般的“赐予”。
- source_word: ἀκολούθως
  choice: 符合
  rationale: 该副词表达依循、与之相符；“符合……律法”在中文中清楚自然。
- source_word: ἀπεφήνατο
  choice: 明确表明自己的立场
  rationale: 中间语态在此表达他公开、明确地宣示自己的决定；此译兼顾清楚宣告与主体自身立场。
- source_word: ταχέως λέγων προπέμπειν εἰς τὸν ᾅδην
  choice: 说要他们赶快送他到阴间去
  rationale: ταχέως修饰送走的急迫性；ᾅδης指死者所在之境，并非专指最终刑罚之地。“阴间”是简体中文圣经语域中既简洁又不等同于“地狱”的对应词。
theological_decisions:
- issue: ᾅδης的译法
  choice: 阴间
  alternative: 死者之境；冥府
  rationale: 原词指死者所在之境，不应译成带有最终惩罚含义的“地狱”。“阴间”保留其古代观念与神学张力，并以脚注说明。
- issue: θεοκτίστου νομοθεσίας的译法
  choice: 那神圣、由上帝设立的律法
  alternative: 那神圣、上帝所赐的律法
  rationale: θεόκτιστος更直接表示由上帝建立、创设；选择“设立”既贴近构词，也不额外界定律法传递的具体方式。
- issue: μᾶλλον δὲ的逻辑关系
  choice: 更确切地说
  alternative: 不如说；更重要的是
  rationale: 该表达既可能修正、也可能加强此前理由。译文保留修辞上的自我校正，不把前述人生品格与律法依据割裂或对立。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。原文层层累加的长句以分号和破折号梳理，但保留其递进结构；“更确切地说”维持从年龄、声望和品行转向神圣律法这一修辞重心。
