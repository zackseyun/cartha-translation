  yaml_path: translation/deuterocanon/2_maccabees/006/024.yaml
  text: For it is not worthy of our age to pretend[a], so that many of the young, supposing that Eleazar at ninety years of age has changed over to foreign ways,
translation:
  language: zh_hans
  text: 因为装假不合我们这把年纪的身份，免得许多年轻人以为九十岁的以利亚撒已经转而接受异族的生活方式，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: 因为……不
  rationale: γάρ承接上文，为以利亚撒的决定说明理由；“因为”自然保留解释关系。
- source_word: τῆς ἡμετέρας ἡλικίας ἄξιόν ἐστιν
  choice: 不配我们这把年纪
  rationale: ἡλικία在此指人生阶段，尤指高龄；ἄξιος带有与身份、年岁相称的道德分量。“我们这把年纪”既保留庄重的自称，也符合现代汉语。
- source_word: ὑποκριθῆναι
  choice: 装假
  rationale: 此处指以表演或伪装造成虚假印象，即假装遵从命令；“装假”简明地表达欺瞒性的外在行为。
- source_word: ἵνα
  choice: 免得
  rationale: 该从句表达以利亚撒所要避免的后果；汉语用“免得”比机械的“以致”更准确地呈现语境中的负面目的。
- source_word: πολλοὶ τῶν νέων
  choice: 许多年轻人
  rationale: νέοι可泛指年轻群体；不必限缩为男性。
- source_word: ὑπολαβόντες
  choice: 以为
  rationale: 表达年轻人根据他的外在举动所得出的错误判断。
- source_word: Ἐλεάζαρον τὸν ἐνενηκονταετῆ
  choice: 九十岁的以利亚撒
  rationale: 直接保留年龄信息，并突出一位高龄长者貌似改弦易辙会造成的影响。
- source_word: μεταβεβληκέναι
  choice: 已经转而接受
  rationale: 完成时不定式表示在旁观者看来已经发生并形成结果的转变；“已经转而”保留这一完成与转向之意。
- source_word: εἰς ἀλλοφυλισμόν
  choice: 异族的生活方式
  rationale: ἀλλοφυλισμός指转向异族、非犹太人的身份习俗或生活实践。“异族的生活方式”保留其社会与宗教文化含义，又不加入“异教”等较强的后世术语。
theological_decisions:
- issue: 犹太殉道语境中ἀλλοφυλισμός的译法
  choice: 异族的生活方式
  alternative: 异族习俗；异族化；异教生活
  rationale: 原词涉及离弃祖传犹太生活、转从外族实践的表象。“异族的生活方式”既体现群体与盟约身份层面的张力，也避免用“异教”预先强化纯宗教教义色彩。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“我们这把年纪”保留原文第一人称复数式的尊严语气；全句在本节末仍未完结，因此以逗号收束，与下节衔接。
