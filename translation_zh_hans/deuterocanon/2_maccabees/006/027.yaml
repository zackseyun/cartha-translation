  text: Therefore, by now bravely giving up my life, I will show myself worthy of my old age,
translation:
  language: zh_hans
  text: 因此，我如今勇敢地舍弃生命，就会显明自己无愧于我的高龄，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: 所以
  rationale: 表达由前文推出结论的强因果关系，符合现代汉语自然衔接。
- source_word: ἀνδρείως
  choice: 勇敢地
  rationale: 保留副词对面对死亡时英勇态度的强调。
- source_word: νῦν
  choice: 现在
  rationale: 保留行动发生于当前时刻的时间意味，不将其弱化或移位。
- source_word: ἀλλάξας τὸν βίον
  choice: 舍弃生命
  rationale: 该短语字面近于“改变生命/生活”，在此语境中是死亡的委婉说法；译作“舍弃生命”既传达赴死，也保留主动承担的语气。
- source_word: τοῦ μὲν γήρως ἄξιος φανήσομαι
  choice: 就会显明自己配得上这把年纪
  rationale: φανήσομαι译为“显明自己”，保留公开表现、证明之意；“这把年纪”自然表达γήρως所指的高龄，并维持其尊严感。
theological_decisions:
- issue: 主动赴死措辞可能引发对自杀或殉道性质的过度判定
  choice: 舍弃生命
  alternative: 结束生命／离开人世
  rationale: 原文在受迫害与忠贞处境中以委婉语描述接受死亡；译文不额外加入“殉道”等解释性神学标签，也避免“自杀”式的现代联想。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“这把年纪”较口语化但不轻佻，能自然传达老人以其高龄所应有的尊严自许。句末逗号保留原文未完句结构，以衔接下一节内容。
