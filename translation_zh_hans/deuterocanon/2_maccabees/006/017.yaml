  text: But let this be said by way of reminder for us; now we must proceed with the narrative in a few words.
translation:
  language: zh_hans
  text: 不过，这些话就说到这里，作为对我们的提醒；现在必须用简短的话继续叙述。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: 不过
  rationale: 标示转折并收束前面的劝诫，符合此处篇章过渡的作用。
- source_word: ἕως ὑπομνήσεως
  choice: 说到这里，作为……提醒
  rationale: ἕως在这里表示限度；ὑπόμνησις指提醒或唤起记忆。此译既保留限度意味，也使现代汉语自然。
- source_word: ἡμῖν
  choice: 对我们
  rationale: 明确保留希腊文第一人称复数与格，不将其省略或泛化。
- source_word: διʼ ὀλίγων
  choice: 用简短的话
  rationale: 按习语表达‘简略地、寥寥数语’，修饰接下来的叙述方式。
- source_word: ἐλευστέον
  choice: 必须……继续
  rationale: 保留动词形容词的必要性语气；结合ἐπὶ τὴν διήγησιν，表达转入并推进叙事。
- source_word: διήγησιν
  choice: 叙述
  rationale: 指作者正在展开的叙事内容，译为‘叙述’庄重而易懂。
