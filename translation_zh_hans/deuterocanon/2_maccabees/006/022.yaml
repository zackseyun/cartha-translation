  text: so that[a], after doing this, he might be released from death[b], and because of their long-standing friendship with him might receive kindness.
translation:
  language: zh_hans
  text: 好叫他做了这事后得以免于一死[a]，并因他和他们长久的交情而得到宽待[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“脱离死亡”，即免受处决。
    reason: lexical_alternative
  - marker: b
    text: 或译：“得到善待”或“得到人道的待遇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 这样……就可以
  rationale: 引出目的或预期结果；按现代汉语用“这样……就可以”自然表达其目的意味，并与上文所提办法衔接。
- source_word: τοῦτο πράξας
  choice: 他做了这事
  rationale: 不定过去时分词所指行动先于主要动词；汉语按顺序表述为“做了这事”，既清楚又不显生硬。
- source_word: ἀπολυθῇ τοῦ θανάτου
  choice: 可以免于一死
  rationale: ἀπολύω在这里表示释放、使脱离；结合处刑语境，“免于一死”准确表达逃过死刑，而不引入关于永生或救赎的神学含义。
- source_word: διὰ τὴν ἀρχαίαν πρὸς αὐτοὺς φιλίαν
  choice: 又因他同他们多年的交情
  rationale: ἀρχαία φιλία指由来已久的友好关系；πρὸς αὐτούς较自然地理解为他与“他们”的交情。译文不把关系方向倒置为仅是他们对他的友情。
- source_word: τύχοι φιλανθρωπίας
  choice: 可以得到宽待
  rationale: τυγχάνω接属格表示得到、获得；φιλανθρωπία在此指仁厚、善意或人道待遇。“宽待”符合处刑背景，也保留他因私交而获从宽对待的意味。
theological_decisions:
- issue: “脱离死亡”的所指及性质
  choice: 理解为免受处决，译作“免于一死”
  alternative: “从死亡中获释”或“脱离死亡”
  rationale: 本句处于具体的叙事与刑罚语境，并非论述死后生命或属灵救恩；采用“免于一死”可避免无根据的教义化理解。
- issue: “交情”的关系方向
  choice: 译为“他同他们多年的交情”
  alternative: “他们同他多年的交情”
  rationale: 希腊文πρὸς αὐτούς直接以“他们”为关系所向，而φιλία本身又是相互关系。译文用中性的“同……交情”，既贴近语法，也不把本来可含互惠意味的关系单向化。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。全句承接上文所提出的做法，以“这样……就可以”表达目的；“免于一死”“多年的交情”“得到宽待”均为普通读者易懂的现代表达，同时保留原文的法律处境与人情关系。
