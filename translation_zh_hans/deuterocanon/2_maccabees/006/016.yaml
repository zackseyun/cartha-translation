  yaml_path: translation/deuterocanon/2_maccabees/006/016.yaml
  text: Therefore he never withdraws his mercy from us; but while disciplining with calamity, he does not abandon his own people.
translation:
  language: zh_hans
  text: 因此，他绝不会从我们收回怜悯；他在灾祸中管教时，也不会离弃自己的子民。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: 因此
  rationale: 承接上文并引出结论，保留原文明确的推论关系。
- source_word: οὐδέποτε
  choice: 绝不会
  rationale: 表达“任何时候都不”的强烈否定；现代汉语自然，同时保留原文力度。
- source_word: τὸν ἔλεον
  choice: 怜悯
  rationale: ἔλεος指怜悯、慈悲；此处采用“怜悯”，既准确又符合现代圣经语体。汉语中施予者可由主语自然推知，无须另加“他的”。
- source_word: ἀφʼ ἡμῶν ἀφίστησιν
  choice: 从我们收回
  rationale: 准确表达使怜悯离开我们的意思；“收回”比逐字译作“使离开”更自然。
- source_word: παιδεύων
  choice: 管教
  rationale: 在苦难语境中指带有纠正、教导目的的纪律行动；“管教”兼具教育与惩戒含义，不将其窄化为纯粹刑罚。
- source_word: μετὰ συμφορᾶς
  choice: 以灾祸
  rationale: συμφορά表示灾祸、不幸；“以”在此自然体现灾祸与管教之间的手段或伴随关系。
- source_word: οὐκ ἐγκαταλείπει
  choice: 不会离弃
  rationale: ἐγκαταλείπω意为撇下、遗弃；“离弃”庄重清楚，也保留关系层面的含义。
- source_word: τὸν ἑαυτοῦ λαόν
  choice: 自己的子民
  rationale: “自己的”保留反身代词ἑαυτοῦ所强调的归属；“子民”自然表达属于上帝的群体。
theological_decisions:
- issue: 如何表达παιδεύων所描述的上帝行动
  choice: 管教
  alternative: 惩罚；教导
  rationale: 原文将灾祸中的管教与不离弃并置，呈现纠正性的苦难而非弃绝。“管教”保留教育和惩戒两面，不把含义限定为报应或一般教学。
- issue: 是否在τὸν ἔλεον前明说“他的”
  choice: 不另加所有格，译作“怜悯”
  alternative: 他的怜悯
  rationale: 希腊文使用定冠词而没有明示所有格；中文由“他……从我们收回”已可清楚判断怜悯出自主语。这样既自然，也避免不必要地显化原文隐含关系。
- issue: μετὰ συμφορᾶς表示手段还是伴随情况
  choice: 以灾祸
  alternative: 在灾祸中；伴着灾祸
  rationale: μετά加属格通常表达伴随，但此处灾祸与管教紧密相连，也可呈现手段色彩。“以灾祸”符合语境，同时不进一步断言灾祸的具体因果机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绝不会……也不会……”保留两重否定的强调；“即使”自然呈现管教与不离弃之间的张力。全节无需脚注。
