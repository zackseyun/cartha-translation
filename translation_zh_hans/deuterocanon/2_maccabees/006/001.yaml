  text: But after not much time[a], the king sent an aged Athenian to compel the Jews to depart from the laws of their fathers and not to live by the laws of God[b],
translation:
  language: zh_hans
  text: 不久以后，王派了一名年迈的雅典人，要强迫犹太人背弃祖传的律法，不按上帝的律法生活。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετʼ οὐ πολὺν ... χρόνον
  choice: 不久以后
  rationale: 希腊语直译为“过了不多时间”；“不久以后”自然、准确地表达时间短暂。
- source_word: ἐξαπέστειλεν
  choice: 派了
  rationale: 该动词意为派出、差遣；此处由王派人执行强制任务，“派了”简洁自然。
- source_word: γέροντι Ἀθηναῖον
  choice: 一位年老的雅典人
  rationale: γέροντι在这里最自然地表示年龄，而非正式职衔；此译避免误解为宗教或政治职位“长老”。
- source_word: ἀναγκάζειν
  choice: 去强迫
  rationale: 不定式说明王派遣此人的目的；“强迫”清楚表达胁迫之意。
- source_word: μεταβαίνειν ἀπὸ τῶν πατρίων νόμων
  choice: 背弃祖传的律法
  rationale: μεταβαίνειν ἀπό表示离开、转离；在受迫改变宗教生活方式的语境中，“背弃”准确而自然。“祖传”保留πατρίων所指的先辈传承。
- source_word: τοῖς τοῦ θεοῦ νόμοις μὴ πολιτεύεσθαι
  choice: 不再遵照上帝的律法生活
  rationale: πολιτεύεσθαι可指作为公民行事或度一种生活；这里是以律法规范生活。“遵照……生活”兼顾行为和群体生活的意味，又不过度限定为政治活动。
theological_decisions:
- issue: πατρίων的家族传承措辞
  choice: 祖传的律法
  alternative: 父辈的律法
  rationale: πατρίων含“祖先所传、父辈所传”之意。现代汉语“祖传”能自然保留代际承传的含义；译成“父辈的”较生硬，并可能被误解为仅指上一代。
- issue: πολιτεύεσθαι与上帝律法的关系
  choice: 遵照上帝的律法生活
  alternative: 按照上帝的律法治理公共生活
  rationale: 该动词可能带有公民或共同体生活的色彩，但此处并未把意义局限于正式政治领域；所选译法保留整体生活受神律法规范的宽广含义。
- issue: 两组律法的关系
  choice: 保留“祖传的律法”与“上帝的律法”两个并列称谓
  alternative: 将二者合并解释为“祖传的上帝律法”
  rationale: 原文以两个短语并列表述，彼此相关却未在句法上明确等同；译文不擅自消除这种表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“年老的雅典人”保持描述性，不暗示“长老”职衔；句末用句号，使该节作为中文经文独立可读。
