translation:
  language: zh_hans
  text: 免得我们的罪恶达到满额[a]之后，他才向我们施行报应[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“达到尽头”或“达到极限”。希腊文直译为“来到尽头”；这里很可能指罪恶达到其限度或满额。
    reason: lexical_alternative
  - marker: b
    text: 希腊文没有明说施行报应的主语；根据紧接的上文，这里的“他”指主。
    reason: implicit_subject
lexical_decisions:
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 以自然的现代汉语表达带否定意义的目的从句，并与上文所述没有立即惩罚的目的相衔接。
- source_word: πρὸς τέλος ἀφικομένων
  choice: 达到尽头
  rationale: 保留希腊文“来到终点、限度”的意象及其一定程度的歧义；在本语境中可理解为罪恶达到满额或极限。
- source_word: ἡμῶν τῶν ἁμαρτιῶν
  choice: 我们的罪恶
  rationale: 自然表达所有关系；“罪恶”在此适合表示累积并达到限度的诸罪。
- source_word: ὕστερον
  choice: 之后……才
  rationale: 清楚表现延后的时间关系，也与前文的即时管教形成对照。
- source_word: ἐκδικά
  choice: 向我们施行报应
  rationale: 保留该词执行公义、惩治和报复性的司法含义，比泛化为“惩罚”更贴近原文，同时避免汉语中“报仇”可能产生的私人怨恨色彩。
theological_decisions:
- issue: 本分句的施事者在希腊文中省略
  choice: 他才向我们施行报应
  alternative: 主才向我们施行报应
  rationale: 上文语境表明施事者是主，但本句没有明说；译作“他”既满足汉语句法，又保留原文简约，不把语境所指直接写入正文。
- issue: 罪恶“达到尽头”的含义
  choice: 保留“达到尽头”并用脚注解释
  alternative: 达到满额／达到极限
  rationale: 直译保留这一表达究竟侧重终点、限度还是满额的张力；脚注说明语境中的可能含义，而不在正文中单一化处理。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“免得……之后，他才……”准确传达否定目的和延后行动的关系；“施行报应”保留司法性与报偿性，又避免过度口语化。
