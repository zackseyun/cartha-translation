  yaml_path: translation/deuterocanon/2_maccabees/006/029.yaml
  text: Those who were leading him changed the goodwill they had shown him a little earlier into hostility because of the words just spoken[a], since they regarded them, as they supposed, as madness.
translation:
  language: zh_hans
  text: 押送他的人因他刚才所说的那些话，就把不久前对他的善意变成了敌意；他们认为那些话是疯狂之言[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “疯狂之言”也可译作“愚妄之言”、“失去理智的话”或“不顾一切的话”。这里表达的是押送者对他所说之话的看法，不一定是叙述者本人的判断。
    reason: 保留ἀπόνοια的词义范围，并说明原文中的视角归属。
lexical_decisions:
- source_word: τῶνδε ἀγόντων πρὸς αὐτόν
  choice: 押送他的人
  rationale: 此处属格独立结构指带着以利亚撒前往受刑的人；“押送”自然表达其受拘押并被带走的语境。
- source_word: τὴν μικρῷ πρότερον εὐμένειαν
  choice: 不久前对他的善意
  rationale: εὐμένεια表示善意、好感或优待，μικρῷ πρότερον表示不久以前；译文保留时间上的鲜明转折。
- source_word: δυσμένειαν
  choice: 敌意
  rationale: 该词与εὐμένεια形成直接反义对照，“敌意”准确传达态度由善转恶。
- source_word: διὰ τὴν τῶν προειρημένων λόγων
  choice: 因为他刚才所说的那些话
  rationale: 原文短语略显压缩，结合上下文指先前所说的话；“刚才所说”在现代汉语中清楚自然。
- source_word: ὡς αὐτοὶ ὑπελάμβανον
  choice: 在他们看来
  rationale: 明确把后面的评价归于押送者，而非叙述者，同时避免把原文读成客观判定。
- source_word: ἀπόνοιαν
  choice: 疯狂
  rationale: ἀπόνοια可指失去理智、愚妄或不顾后果的绝望举动；此处“疯狂”较能体现押送者对其言辞的强烈负面判断，同时以脚注保留其他可能。
theological_decisions:
- issue: 叙述者与押送者判断之间的距离
  choice: 用“在他们看来”把“疯狂”的评价明确归于押送者
  alternative: 直接说“因为刚才那些疯狂的话”
  rationale: ὡς αὐτοὶ ὑπελάμβανον明确标示这是他们的看法。译文不把他们的判断变成叙述者对以利亚撒言辞的定论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“善意”与“敌意”形成清楚对照；分号使态度转变与押送者的主观判断层次分明。
