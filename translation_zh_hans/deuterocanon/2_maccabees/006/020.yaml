  naturalness: “但他把肉吐了出来”及“走上前去”自然庄重。修订后将长定语拆分为两句，使“即使为了保全性命”明确限定“不可品尝”，并避免中文中“即使出于……也应当这样做”的轻微逻辑歧义。
  terminology: “不可品尝”恰当保留了οὐ θέμις的宗教—伦理限制及γεύσασθαι“尝”的具体性。“保全性命”是对πρὸς ζῆν的自然表达，不引入额外教义判断；脚注保留ὑπομένοντας ἀμύνασθαι的句法及语义压缩。
