- from: 但他把肉吐了出来，便以应有的方式走上前去；凡决意抗拒那些不可品尝之物的人，即使出于对生命的眷恋，也应当这样做。[a]
  to: 但他把肉吐出来后，便走上前去；这正是那些决意抗拒即使为了保全性命也不可品尝之物的人所应有的做法。[a]
  rationale: 修订保留“肉”这一根据上下文作出的明确补足，并将原文的“他以……所应有的方式走上前去”在现代汉语中清楚呈现。末语改为“即使为了保全性命也不可品尝”，使求生动机与禁令的关系明确，同时保留原文强调：对生命的自然眷恋不能使此类品尝成为合法之事。
