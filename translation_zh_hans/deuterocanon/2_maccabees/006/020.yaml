  yaml_path: translation/deuterocanon/2_maccabees/006/020.yaml
  text: But after spitting it out[a], he came forward in the manner required for those who choose to resist things that it is not lawful to taste, even for the sake of one’s attachment to life.
translation:
  language: zh_hans
  text: 但他把肉吐出来后，便走上前去；这正是那些决意抗拒即使为了保全性命也不可品尝之物的人所应有的做法。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些坚持抵抗不可品尝之物的人。”希腊原文在这个简短结构中把“坚忍、坚持”和“抵抗”的意思压缩在一起，句法较难确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: προπτύσας
  choice: 把肉吐了出来
  rationale: 该不定过去时分词表示把已经入口之物吐出；结合以利亚撒拒吃违禁之肉的上下文，补出“肉”能使现代汉语清楚自然。
- source_word: καθʼ ὃν ἔδει τρόπον προσέρχεσθαι
  choice: 便以应有的方式走上前去
  rationale: 保留ἔδει所表达的伦理必要性，并以“走上前去”自然呈现προσέρχεσθαι所指向受刑处或考验的行动。
- source_word: τοὺς ὑπομένοντας ἀμύνασθαι
  choice: 凡决意抗拒……的人
  rationale: ὑπομένω含有在考验中坚持、忍受之意，ἀμύνασθαι则表示抵挡或避开；“决意抗拒”兼顾坚忍与主动抵制，但不把二者强行拆成两个动作。
- source_word: ὧν οὐ θέμις γεύσασθαι
  choice: 那些不可品尝之物
  rationale: “不可”保留θέμις所含宗教和道德许可的力量，“品尝”对应γεύσασθαι，避免笼统改写为“吃”。
- source_word: διὰ τὴν πρὸς ζῆν φιλοστοργίαν
  choice: 即使出于对生命的眷恋
  rationale: φιλοστοργία表示深切而自然的依恋；“对生命的眷恋”保留这种情感色彩，“即使”则按语境显明求生之情仍不足以使禁食成为可行。
theological_decisions:
- issue: οὐ θέμις在犹太殉道语境中的伦理和宗教力度
  choice: 不可品尝
  alternative: 禁止品尝／不准品尝
  rationale: “不可”表达客观的道德—宗教界限，而不将其弱化为个人顾忌，也不引入后世宗派术语。
- issue: 如何处理τοὺς ὑπομένοντας ἀμύνασθαι的压缩结构
  choice: 凡决意抗拒……的人
  alternative: 凡忍耐着抵抗……的人／凡坚持避开……的人
  rationale: 原文把坚忍和抵抗紧密压缩在一起；正文采用自然中文，脚注保留其可能更强调忍耐、坚持的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“眷恋生命”避免“贪生”的贬义；分号帮助读者理解原文较为紧缩的伦理说明。
