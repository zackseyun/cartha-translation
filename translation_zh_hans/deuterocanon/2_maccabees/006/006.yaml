base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/006.yaml
  text: And it was permitted neither to keep the Sabbath[a], nor to observe the ancestral festivals, nor even simply to acknowledge being a Jew.
translation:
  language: zh_hans
  text: 既不许守安息日，也不许遵守祖传的节期，甚至连承认自己是犹太人[a]也不许。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太地人”，若侧重其地域—族群含义；但本节禁止守安息日和过节期的语境，更支持译作“犹太人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: 不许
  rationale: 此处与三个不定式及重复否定词连用，表达当时不容许这些行为的处境；汉语用“不许”自然明确。
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: 既不……也不……甚至不……
  rationale: 保留三项并列的否定结构，并以“甚至”体现末项递进加强的语气。
- source_word: σαββατίζειν
  choice: 守安息日
  rationale: 准确表达遵守安息日这一犹太宗教实践，也是现代汉语中通行自然的说法。
- source_word: πατρίους ἑορτάς
  choice: 祖传的节期
  rationale: “祖传”保留由先祖承传之意；“节期”适合指宗教历法中的节庆日。
- source_word: διαφυλάττειν
  choice: 遵守
  rationale: 在节期语境中指持续谨守、奉行；译作“遵守”自然且不削弱其守护传统的意味。
- source_word: ἁπλῶς
  choice: 甚至
  rationale: 此处着重说明连最基本的身份承认也被禁止；汉语借“甚至”自然传达递进强调，具体的“只是/单单”不必机械重复。
- source_word: Ἰουδαῖον
  choice: 犹太人
  rationale: 上下文涉及安息日、祖传节期及受压制的宗教—族群身份，“犹太人”比纯地域性的“犹太地人”更贴切。
- source_word: ὁμολογεῖν εἶναι
  choice: 公开承认自己是
  rationale: ὁμολογεῖν 在此表示明言或承认身份；“公开承认自己是”既传达身份表白，也避免引入后期专门的教义性“认信”含义。
theological_decisions:
- issue: Ἰουδαῖον 所指的是宗教—族群身份还是地域身份
  choice: 犹太人
  alternative: 犹太地人
  rationale: 本节所列禁令针对安息日、祖传节期和身份表明，重点是犹太宗教—族群身份，而不只是来自犹太地区。脚注保留地域—族群读法的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“既不……也不……甚至不……”呈现希腊文三重否定及末项递进；“守安息日”“祖传的节期”保留犹太实践的历史宗教特征。
