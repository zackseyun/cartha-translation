base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/004.yaml
  text: For the sanctuary was filled by the Gentiles with debauchery and revelry, boldly carousing with prostitutes, approaching women in the sacred precincts, and even bringing inside things that were not proper.
translation:
  language: zh_hans
  text: 因为外邦人使圣殿充斥着放荡和狂欢；他们肆无忌惮地与妓女[a]纵乐，又在圣所中亲近妇女[b]，甚至把不合宜的东西带进殿内。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妓女”也可译作“娼妓”；希腊语ἑταίρων可指以性陪伴为业或受供养的女子。
    reason: lexical_alternative
  - marker: b
    text: “亲近妇女”在这里很可能暗指不正当的性行为，但希腊语的措辞没有“与妇女发生关系”那么直白。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: 圣殿
  rationale: 此处具体指耶路撒冷圣殿及其神圣空间；“圣殿”在现代汉语中明确、自然，并与下文的院落和殿内相呼应。
- source_word: ἀσωτίας καὶ κώμων
  choice: 放荡和狂欢
  rationale: 前者指无节制的道德败坏，后者指喧闹纵乐的宴饮庆欢；这一组合简洁保留两者的区别。
- source_word: ἐθνῶν
  choice: 外族人
  rationale: 在犹太圣殿的语境中指非犹太人；“外族人”保留族群与宗教背景上的对比，又不额外加入“异教徒”的贬义判断。
- source_word: θρασυνόντων
  choice: 肆无忌惮地
  rationale: 该分词强调厚颜、放肆和公然妄为；这一表达自然地修饰随后的寻欢行为。
- source_word: μεθʼ ἑταίρων
  choice: 与妓女寻欢
  rationale: ἑταίρα在希腊化时期常指以性陪伴为业的女子；结合放荡和亵渎圣殿的语境，译作“妓女”最为合适。“寻欢”传达其放纵行为，但不把细节说得过满。
- source_word: ἐν τοῖς ἱεροῖς … γυναιξὶ πλησιαζόντων
  choice: 在圣殿的神圣院落里亲近妇女
  rationale: πλησιάζω字面是靠近、亲近，语境暗示不正当性行为，却并非直言性交；“亲近”保留原文的含蓄。地点按圣殿范围内的神圣院落理解，不限定为某一特定建筑部分。
- source_word: τὰ μὴ καθήκοντα
  choice: 不合宜的东西
  rationale: 原文故意宽泛，只说不适合或不应当之物；不收窄为特定违法物品或礼仪禁物。
- source_word: ἔνδον εἰσφερόντων
  choice: 带进殿内
  rationale: 突出他们把不合宜之物带入内部神圣空间；补出“殿”使现代汉语指向清楚。
theological_decisions:
- issue: ἐθνῶν在犹太圣殿受亵渎语境中的译法
  choice: 外族人
  alternative: 列国的人；异教徒
  rationale: “外族人”准确呈现非犹太人的身份对比，同时避免用“异教徒”加入原词本身未必具有的宗教性贬义。
- issue: 是否明说πλησιαζόντων所暗示的性行为
  choice: 亲近妇女
  alternative: 与妇女发生关系；与妇女厮混
  rationale: 上下文强烈暗示性方面的不当行为，但动词本身只是“接近、亲近”；正文保留这种含蓄，以免替原文消除其措辞上的张力。
- issue: τὰ μὴ καθήκοντα是否具体化为礼仪上不洁或违法之物
  choice: 不合宜的东西
  alternative: 不洁之物；违禁之物
  rationale: 希腊语没有明确说明这些东西为何不合宜，因此不把宽泛表达收窄为某一礼仪或法律类别。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“圣殿”“神圣院落”“殿内”形成清楚的空间递进；“肆无忌惮地与妓女寻欢”传达公然放纵的语气，而“亲近妇女”刻意保留原文对性行为的含蓄表达。所有脚注标记均置于相应正文词语之后。
