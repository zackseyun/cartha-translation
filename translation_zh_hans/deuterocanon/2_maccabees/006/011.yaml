base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/011.yaml
  text: But others[a], having gathered nearby in the caves to observe the week in secret, were informed against to Philip and were burned together, because they scrupled to defend themselves out of regard for the honor of that most holy day.
translation:
  language: zh_hans
  text: 另有一些人聚集到附近的洞穴里，暗中守这一周[a]；有人向腓力告发了他们，他们便一同被焚烧，因为他们为顾及那极其庄严之日的尊荣，出于虔敬而不愿自卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“暗中守安息日。”希腊文直译为“暗中守这一周”，但按上下文，这里很可能是指守安息日。
    reason: 保留 τὴν ἑβδομάδα 的字面含义，同时交代其在叙事语境中的可能所指。
lexical_decisions:
- source_word: ἕτεροι
  choice: 另有一些人
  rationale: 表达与上文人群之间不定的对比，比“其余的人”更不易误示全部余众。
- source_word: πλησίον συνδρομόντες εἰς τὰ σπήλαια
  choice: 聚集到附近的洞穴里
  rationale: 保留 συνδρομόντες 的共同聚集之意及 εἰς 的方向性，同时采用自然的现代汉语表达。
- source_word: λεληθότως ἄγειν τὴν ἑβδομάδα
  choice: 暗中守这一周
  rationale: λεληθότως 表示秘密、不为人知；ἄγειν 与时间词连用可指度过或遵守；τὴν ἑβδομάδα 字面为“这一周”。正文保留原文措辞，安息日这一语境性理解置于脚注。
- source_word: μηνυθέντες τῷ Φιλίππῳ
  choice: 有人向腓力告发了他们
  rationale: 用主动式无定主语自然表达希腊文被动结构，并保留 μηνύω 在此处带有敌意的揭发含义。
- source_word: συνεφλογίσθησαν
  choice: 一同被火烧死
  rationale: 保留复合动词“一同焚烧”的群体意义；按叙事情境译出致死结果，但不添加原文未明说的“活活”。
- source_word: διὰ τὸ εὐλαβῶς ἔχειν βοηθῆσαι αὐτοῖς
  choice: 因为他们……不敢自卫
  rationale: βοηθῆσαι αὐτοῖς 在语境中自然指帮助自己、即自卫；εὐλαβῶς ἔχειν 表示出于敬畏而有所顾忌，“不敢”传达这种宗教性的谨慎，并由后文说明敬畏对象。
- source_word: κατὰ δόξαν τῆς σεμνοτάτης ἡμέρας
  choice: 敬畏那至为神圣之日的尊荣
  rationale: δόξα 在此取尊荣、尊严之义；σεμνοτάτης 表达最高程度的庄严神圣。此译法保留原文对该日尊荣的强调。
theological_decisions:
- issue: τὴν ἑβδομάδα 在受迫害语境中的含义
  choice: 正文译作“这一周”，脚注说明很可能指守安息日
  alternative: 正文直接译作“安息日”或“安息日的礼规”
  rationale: 希腊文实际使用“周”而非通常直指安息日的 σάββατον。为保留原文的真实措辞与歧义，正文从字面，脚注交代最可能的语境含义。
- issue: 受害者为何没有采取行动
  choice: 他们出于对神圣之日的敬畏而不敢自卫
  alternative: 他们拒绝彼此帮助；或因虔敬而完全不采取任何行动
  rationale: βοηθῆσαι αὐτοῖς 最自然地指帮助自己，即自卫；这也符合紧邻语境，又不额外引入关于安息日行为的教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“守这一周”有意保留原文略显特殊的说法，并以脚注避免读者误解；句末调整语序，使敬畏的宗教动机与“不敢自卫”在中文中清楚相连。
