base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/014.yaml
  text: 'For he did not decide to deal with us as he does with the other nations: he waits patiently with them until they have reached the full measure of their sins[a], and then punishes them.'
translation:
  language: zh_hans
  text: 因为主宰[a]没有决定像对待其他民族那样对待我们：对于他们，他耐心等候，直到他们的罪恶满盈，才加以惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主宰”或可译作“主人”“统治者”；希腊文为 δεσπότης，此处指上帝。
    reason: 保留原词所强调的权柄意味，并提示它不是通常译作“主”的 κύριος。
lexical_decisions:
- source_word: ἀναμένει
  choice: 等候
  rationale: 该动词表示等到某一时点；这里指上帝暂缓审判其他民族，直到他们的罪恶达到满盈。
- source_word: μακροθυμῶν
  choice: 耐心
  rationale: 分词表达忍耐、宽容，与“等候”相连；译作副词性的“耐心”，既自然又保留上帝暂缓惩罚的含义。
- source_word: ὁ δεσπότης
  choice: 主宰
  rationale: δεσπότης 表示拥有权柄的主人或统治者，此处指上帝。“主宰”既保留其权柄意味，也避免与通常对应 κύριος 的“主”完全混同。
- source_word: μέχρι τοῦ ... κολάσῃ
  choice: 直到……才加以惩罚
  rationale: 这一结构标明耐心等候的终点；“直到……才……”清楚呈现罪恶满盈之后惩罚才临到的先后关系。
- source_word: καταντήσαντας αὐτοὺς πρὸς ἐκπλήρωσιν ἁμαρτιῶν
  choice: 他们的罪恶满盈
  rationale: 原文指他们达到罪恶完全、满额的地步。“罪恶满盈”是简洁庄重的现代汉语表达，并保留罪恶达到限度的意象。
- source_word: κολάσῃ
  choice: 加以惩罚
  rationale: 该动词表示施行惩罚；此译直接、清楚，不额外限定惩罚的性质。
- source_word: οὕτως καὶ ἐφʼ ἡμῶν ἔκρινεν εἶναι
  choice: 没有决定像……那样对待我们
  rationale: 希腊文以 οὐ ... καθάπερ ... οὕτως 构成压缩的否定比较，意思是上帝没有决定把对其他民族的同一处理方式用于“我们”；汉语中将这一隐含比较明确表达，以免句意晦涩。
theological_decisions:
- issue: 上帝对其他民族的忍耐与对“我们”的不同处置
  choice: 译文明确对比：上帝容忍其他民族直到罪恶满盈，却没有决定以同样方式对待“我们”。
  alternative: 可更贴近希腊语序译为“他没有判定在我们身上也要如此”，但现代汉语中所指较含混。
  rationale: 原文的否定比较清楚建立两种处置之间的张力；译文只将语法上隐含的比较关系说清楚，不说明上帝为何提前处置“我们”，也不引入任何特定教义解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“罪恶满盈”保留原文“达到罪的完全程度”的意象；冒号帮助读者辨明后半句是在说明上帝怎样对待其他民族。
