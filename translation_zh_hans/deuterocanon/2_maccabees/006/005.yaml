translation:
  language: zh_hans
  text: 但祭坛被那些背离律法的人堆满了违禁之物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可憎之物”或“禁物”。希腊文指不合法或不被准许之物；在这里的语境中，涉及祭祀上的污秽。
    reason: lexical_alternative
lexical_decisions:
- source_word: θυσιαστήριον
  choice: 祭坛
  rationale: 这是该词在献祭语境中的标准译法；无需扩译为“献祭的祭坛”。
- source_word: ἀποδιεσταλμένοις
  choice: 那些背离……的人
  rationale: 分词表达与律法分离、疏远的状态；“背离”自然地传达这一含义，同时避免在正文中加入“叛教者”等解释性较强的称谓。
- source_word: νόμων
  choice: 律法
  rationale: 希腊文使用复数，指相关的犹太律例；现代汉语通常以集合名词“律法”自然表达这一整体概念，不另加原文未明说的“祖传”。
- source_word: ἀθεμίτοις
  choice: 不合律法之物
  rationale: 该词指不被准许、违法禁忌之物，且原文省略了所修饰的名词；补出“之物”以使中文完整，并保留其法律—宗教含义而不强化为“可憎之物”。
- source_word: ἐπεπλήρωτο
  choice: 被……填满了
  rationale: 过去完成时被动态描写已造成的结果状态；此译既呈现被动关系，也自然表达祭坛已经处于填满的状态。
theological_decisions:
- issue: 是否用更强烈的祭祀污秽用语翻译 ἀθεμίτοις
  choice: 不合律法之物
  alternative: 可憎之物；禁物
  rationale: 上下文确实涉及圣殿和祭坛遭亵渎，但该希腊词本身主要表示不被准许或违反禁忌。正文采用较克制的译法，以免把上下文的神学评价过度注入词义；脚注保留较强的可能译法。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“但”承接前文转折；保留祭坛受玷污的强烈画面，同时不将 ἀθεμίτοις 过度神学化。
