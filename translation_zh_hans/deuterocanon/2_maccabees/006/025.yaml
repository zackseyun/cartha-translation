  yaml_path: translation/deuterocanon/2_maccabees/006/025.yaml
  text: and they too[a], because of my hypocrisy and because of this brief and momentary life, might be led astray because of me[c][b], and I would acquire hatred and a stain upon my old age.
translation:
  language: zh_hans
  text: 他们也会因我为求保全这短暂、转瞬即逝的生命而作的伪装[a][b]，受我误导而走入歧途；这样，我就会给自己的晚年招来厌弃[c]和污点。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伪装”也可译作“假装”或“虚假做作”。希腊语指故意装出某种行为，从而误导旁观者。
    reason: lexical_alternative
  - marker: b
    text: 直译为“因这短暂而转瞬即逝的活着”；这里指为保全所剩不多的一段生命。
    reason: lexical_alternative
  - marker: c
    text: “厌弃”所译的希腊语也可译作“憎恶”“可憎”或“污秽”；这里指他会因自己的行为而受人厌弃。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόκρισιν
  choice: 伪装
  rationale: 该词在这里指刻意装出并非真实的行为，以假象误导旁观者。“伪装”比现代汉语中常指人格两面性的“虚伪”更直接对应此处的假装顺从。
- source_word: μικρὸν καὶ ἀκαριαῖον ζῆν
  choice: 这短暂、转瞬即逝的余生
  rationale: ζῆν在此实质指以妥协换取的一小段存活时间；结合以利亚撒年老的语境，用“余生”自然表达剩余的生命，同时保留“小”与“顷刻即逝”的双重强调。
- source_word: πλανηθῶσιν
  choice: 被……引入歧途
  rationale: 保留不定过去时被动虚拟式所表达的可能结果，也兼顾受欺骗和在道德、信仰上走偏两层含义。
- source_word: μύσος
  choice: 可憎之名
  rationale: μύσος可指污秽、可憎之物，并可引申为令人厌恶的名声。此处与晚年声誉受玷污并列，“可憎之名”较自然地呈现公众厌弃的意味，同时不与后面的“污点”完全重复。
- source_word: κηλῖδα
  choice: 污点
  rationale: 保留原文具体的污斑隐喻，在现代汉语中也自然表示名誉上的耻辱。
- source_word: κατακτήσωμαι
  choice: 给自己……招来
  rationale: 中间语态表示为自己取得或招致某种结果；“给自己招来”清楚表达耻辱是由本人妥协所造成的。
theological_decisions:
- issue: 殉道语境中ὑπόκρισις的道德分量
  choice: 译作“伪装”，并在脚注说明其欺骗性质
  alternative: 虚伪；假装
  rationale: 原词首先描写假装出来的行为，而上下文又赋予它严重的道德后果。“伪装”既不淡化欺骗，也避免把现代汉语“虚伪”的全部人格判断强加给原文。
- issue: 短暂存活与误导他人的因果关系
  choice: 译作“因我贪图……余生，而被我引入歧途”
  alternative: 因为这短暂、转瞬即逝的生命而因我迷失
  rationale: 原文两个διά短语的关系略显压缩。译文使现代读者能看出，他若为短暂存活而伪装，就会误导别人；但不增添任何特定教派的殉道观。
- issue: 末句的自招耻辱
  choice: 译作“给自己的晚年招来可憎之名和污点”
  alternative: 使自己的晚年蒙受污秽和污点；给晚年招来厌恶和耻辱
  rationale: 保留中间语态所表达的自招后果，并维持μύσος与κηλίς之间“可憎/污秽”和“斑点”的并列张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“贪图”显明此处διά所表达的为短暂存活而作出伪装的动机；“转瞬即逝”传达ἀκαριαῖον的极短暂意味。句中保留“他们也”与上文的衔接，并用分号清楚区分误导他人的后果和玷污自己晚年的后果。
