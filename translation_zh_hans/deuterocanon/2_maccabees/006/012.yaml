  yaml_path: translation/deuterocanon/2_maccabees/006/012.yaml
  text: Therefore I urge those who read this book not to be disheartened because of these calamities[a], but to consider that these punishments are not for destruction[c][b], but for the discipline of our people.
translation:
  language: zh_hans
  text: 所以，我劝读到这卷书的人，不要因这些灾祸而心灰意冷，却要想到，这些惩罚不是为了毁灭，而是为了管教我们的同胞。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“教导”或“纠正”；原文包含借责罚来塑造、训练的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 我劝
  rationale: 表达叙述者恳切劝勉读者的语气，现代、自然，又不过分弱化原文力度。
- source_word: τοὺς ἐντυγχάνοντας τῇδε τῇ βίβλῳ
  choice: 读到这卷书的人
  rationale: ἐντυγχάνω用于书卷时可指接触或阅读；“读到”既保留“遇见、接触”的意味，也符合现代汉语表达。
- source_word: μὴ συντελεσθαι
  choice: 不要……心灰意冷
  rationale: 原词在此不是单纯指外在终结，而是指人在灾祸下被压垮、丧失勇气；该译法自然传达其语境义。
- source_word: διὰ τὰς συμφορὰς
  choice: 因这些灾祸
  rationale: συμφοραί指严重的不幸或灾难；结合上下文，译作“灾祸”庄重且贴切。“这些”承接眼前所述苦难。
- source_word: λογίζεσθαι
  choice: 要明白
  rationale: 表示经过思量而作出判断；“明白”在劝诫语境中流畅，并保留认定、看待之意。
- source_word: τὰς τιμωρίας
  choice: 这些惩罚
  rationale: τιμωρία通常指惩罚或刑罚；“这些”自然回指前述灾祸，但不额外界定施行者。
- source_word: μὴ πρὸς ὄλεθρον
  choice: 不是为了毁灭
  rationale: 保留πρός所表达的目的或趋向，以及ὄλεθρος的毁灭、败亡含义。
- source_word: ἀλλὰ πρὸς παιδείαν
  choice: 而是为了管教
  rationale: παιδεία兼含管教、纠正和塑造性训练；“管教”在受罚语境中最能保留其纠正与培育双重含义。
- source_word: τοῦ γένους ἡμῶν
  choice: 我们本族的人
  rationale: γένος在此指作者与读者所属的犹太族群；“本族的人”保留共同血缘与群体身份，避免现代“种族”一词可能产生的误导。
theological_decisions:
- issue: 苦难是毁灭性的惩罚，还是纠正性的管教
  choice: 将这些惩罚表述为不是为了毁灭，而是为了管教本族的人
  alternative: 将其泛化为一般性的教育，或仅解释为政治后果
  rationale: 原文以μὴ πρὸς ὄλεθρον, ἀλλὰ πρὸς παιδείαν构成明确目的对比。译文保留惩罚与管教之间的神学张力，但不擅自补明施罚者或扩展为完整的天意论。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“这卷书”符合古代书卷语境；句式保留原文“不是……而是……”的鲜明对照。脚注仅用于说明παιδεία的复合语义，避免正文过度解释。
