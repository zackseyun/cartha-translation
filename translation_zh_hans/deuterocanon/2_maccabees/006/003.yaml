  text: And the pressure of this evil was harsh and grievous for everyone[a].
translation:
  language: zh_hans
  text: 这种恶事被强加于众人，实在严酷，令人难以承受[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这恶事的临到，对众人而言既严酷又难以承受。”希腊文ἐπίστασις可侧重临到、施加或压迫性的强加。
    reason: 保留ἐπίστασις在此处“临到”与“强加”的语义可能，并说明主文采用的表达。
lexical_decisions:
- source_word: χαλεπὴ
  choice: 严酷
  rationale: 表达处境的严厉和痛苦，并与表示“难以承受”的 δυσχερής 区分开来。
- source_word: δυσχερὴς
  choice: 难以承受
  rationale: 突出这场压迫令人难受、难以忍耐的性质，符合现代汉语表达。
- source_word: τοῖς ὅλοις
  choice: 对所有人来说
  rationale: 自然表达其普遍范围，指所有受到波及的人。
- source_word: ἡ ἐπίστασις
  choice: 压迫
  rationale: 结合上下文，指恶事加在人身上、形成重压；避免按较常见但不合此处语境的“知识”义理解。
- source_word: τῆς κακίας
  choice: 这恶事的
  rationale: κακία 在此具体指前文所述的邪恶措施和迫害；“这恶事”既承接上下文，又不将所指过度具体化。
theological_decisions:
- issue: κακία 在上下文中的所指
  choice: 指前文所述的具体恶事和迫害
  alternative: 泛指抽象的邪恶，或指个人的恶意
  rationale: 本段叙述强制亵渎和迫害，因此具体理解更贴合语境，同时不额外加入经文未明说的施行者或政策名称。
- issue: ἐπίστασις 的语义
  choice: 压迫，即这恶事加于众人的重压
  alternative: 临到、强加或施行
  rationale: 该词在这里有临到或施加之意；译作“压迫”能够呈现其持续加在人身上的重担，但脚注保留“强加”这一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“严酷”与“难以承受”保留希腊文两个形容词的并列力度；“所有人”清楚传达普遍范围。
