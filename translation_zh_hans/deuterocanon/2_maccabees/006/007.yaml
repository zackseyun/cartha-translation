base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/007.yaml
  text: And they were being led[a], under bitter compulsion, to the king’s monthly birthday observance for the sacrificial meal; and when a festival of Dionysus came, they were being forced, wearing ivy wreaths[b], to join the procession in honor of Dionysus.
translation:
  language: zh_hans
  text: 他们在严酷的强迫之下，每月都被带去参加王的诞辰庆典，吃祭牲的内脏[a]；到了狄俄尼索斯节，他们又被迫戴着常春藤花冠[b]，列队游行敬奉狄俄尼索斯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“吃内脏”。这里指吃献祭所得的内脏或祭牲部分，因而参与献祭仪式。
    reason: lexical_alternative
  - marker: b
    text: 常春藤与狄俄尼索斯崇拜有关。希腊文直译为“带有常春藤”，在这种游行中很可能是指戴着常春藤编成的花冠。
    reason: cultural_note
lexical_decisions:
- source_word: ἤγον
  choice: 被带去
  rationale: 未完成时在语境中表示反复发生的受迫行动；中文被动式保留他们受人控制、被带往仪式的含义。
- source_word: μετὰ πικρᾶς ἀνάγκης
  choice: 在严酷的强迫之下
  rationale: πικρός在此突出强迫带来的痛苦与严酷；“强迫”清楚表达ἀνάγκη的强制意味。
- source_word: εἰς τὴν κατὰ μῆνα τοῦ βασιλέως γενέθλιον ἡμέραν
  choice: 每月都……参加王的诞辰庆典
  rationale: κατὰ μῆνα表明每月举行；“诞辰庆典”自然表达γενέθλιος ἡμέρα在礼仪性场合中的含义，同时不将其误解为每月一次实际生日。
- source_word: ἐπὶ σπλαγχνισμόν
  choice: 吃祭牲的内脏
  rationale: σπλαγχνισμός在献祭语境中指食用祭牲内脏或祭肉的仪式行为。正文采用较直接的译法，以保留希腊词的具体性；脚注说明其礼仪含义。
- source_word: Διονυσίων ἑορτῆς
  choice: 狄俄尼索斯节
  rationale: 简洁表达献给狄俄尼索斯的节庆，不武断锁定为某一更具体的历史节期名称。
- source_word: κισσοὺς ἔχοντες
  choice: 戴着常春藤花冠
  rationale: 字面为“带有常春藤”；在狄俄尼索斯仪式语境中，最可能指佩戴常春藤编成的花冠。脚注保留这一文化背景和字面范围。
- source_word: πομπεύειν
  choice: 列队游行
  rationale: 该动词指参加礼仪性 procession；“列队游行”既自然，又保留公开仪式行动的意味。
- source_word: τῷ Διονύσῳ
  choice: 敬奉狄俄尼索斯
  rationale: 与格在祭仪语境中表示游行所敬奉的对象；“敬奉”明确其宗教指向，又不额外规定具体祭礼形式。
theological_decisions:
- issue: 如何表达ἐπὶ σπλαγχνισμόν所涉及的异教祭仪强迫
  choice: 正文译作“吃祭牲的内脏”
  alternative: 参加祭宴；吃献祭的部分
  rationale: 原文具体指向食用祭牲内脏或祭牲部分。直译能显明被迫参与祭仪的性质；脚注则避免读者误以为这里只强调饮食本身。
- issue: 如何处理τῷ Διονύσῳ的宗教指向
  choice: 译作“敬奉狄俄尼索斯”
  alternative: 为狄俄尼索斯；向狄俄尼索斯
  rationale: “敬奉”自然呈现游行的祭祀性和宗教对象，但不进一步解释参与者是否在内心认同该敬拜，从而保留受迫参与与个人意愿之间的张力。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话。“严酷的强迫”“祭牲”“敬奉”等词保持礼仪语境与叙事的沉重感；句中两次使用“被迫/强迫”，对应原文连续强调的 coercion。所有脚注标记均已置于正文。
