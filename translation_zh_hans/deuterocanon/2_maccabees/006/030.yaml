revisions:
- from: 但他将要在殴打之下死去时，呻吟着说：“主拥有神圣的知识；他清楚知道，我本来可以免于一死[a]，如今却在鞭打之下，身体忍受着剧烈的疼痛；但在心灵里，我因敬畏他[b]，甘愿承受这一切。”
  to: 但他将要在击打中死去时，呻吟着说：“主啊，你拥有神圣的知识，清楚知道，我本可免于死亡[a]，却在受鞭打时身体忍受剧烈的痛苦；但我的灵魂因敬畏你[b]，甘愿承受这一切。”
  rationale: 修订主要解决引语中“主”与“他”的不连贯，并使“拥有神圣知识的主”自然地成为说话对象。其余调整维持原文的时间性、受鞭打的身体痛苦、身体与灵魂的对照，以及 φόβος 所含的敬畏／惧怕张力。
