  naturalness: “他清楚知道”在“主拥有神圣的知识”之后略有说明文式重复，且“将要在殴打之下死去时”稍显生硬。采用“将要在击打中死去时”及“主啊，你拥有神圣的知识，清楚知道”更符合现代庄重汉语。
  terminology: “主”“神圣的知识”“身体”“灵魂”“敬畏”均能恰当对应 κύριος、ἁγία γνῶσις、σῶμα、ψυχή、φόβος。将“心灵”改为“灵魂”能更明确保留原文与“身体”的术语性对照；“敬畏”保留正文，脚注说明“惧怕”的较直译可能，未消解词义张力。
