base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/030.yaml
  text: But as he was about to die under the blows[a], he groaned and said, “To the Lord, who has the holy knowledge, it is clear that, though I could have been released from death, I am enduring cruel pains in my body while being scourged[b]; but in my soul I gladly suffer these things because of fear of him.”
translation:
  language: zh_hans
  text: 但他将要在击打中死去时，呻吟着说：“主啊，你拥有神圣的知识，清楚知道，我本可免于死亡[a]，却在受鞭打时身体忍受剧烈的痛苦；但我的灵魂因敬畏你[b]，甘愿承受这一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “免于死亡”指他本可借着顺从命令而避免被处死。
    reason: 解释“从死亡中获释”这一希腊语表达在上下文中的含义。
  - marker: b
    text: 或译“因惧怕你”。希腊语直译为“惧怕”；用于上帝时也可包含尊崇、敬畏之意。
    reason: 保留 φόβος 在畏惧与敬畏之间的词义张力，并使代词与正文向主的直接称呼一致。
lexical_decisions:
- source_word: μέλλων ... τελευτᾷν
  choice: 将要……死去时
  rationale: 表达死亡迫近，符合希腊语 μέλλων 加不定式所表示的即将发生。
- source_word: ταῖς πληγαῖς
  choice: 在殴打之下
  rationale: 保留死亡发生于连续击打中的情境，也不把与格的工具或处境意味限定得过死。
- source_word: ἀναστενάξας
  choice: 呻吟着
  rationale: 传达因痛苦而发出的深沉叹息或呻吟，并自然衔接后面的说话。
- source_word: τῷ κυρίῳ τῷ τὴν ἁγίαν γνῶσιν ἔχοντι
  choice: 主拥有神圣的知识
  rationale: 按原文保留“主”和“知识”，不扩译为“真理”或全知教义；中文以独立分句自然表达修饰关系。
- source_word: φανερὸν ἐστὶν
  choice: 他清楚知道
  rationale: 原文是“这是显明的”；结合前面的与格“对主而言”，中文用“他清楚知道”传达同一命题而更自然。
- source_word: δυνάμενος ἀπολυθῆναι τοῦ θανάτου
  choice: 我本来可以免于一死
  rationale: 表达他原有避免被处死的可能，同时避免生硬直译“从死亡中被释放”。
- source_word: σκληρὰς ... ἀλγηδόνας
  choice: 剧烈的疼痛
  rationale: σκληρός 在此强化身体痛楚；“剧烈”自然、庄重，不额外赋予施刑者主观残酷之意。
- source_word: κατὰ σῶμα ... κατὰ ψυχὴν
  choice: 身体……心灵
  rationale: 保留外在身体痛苦与内在甘愿承受之间的对照；此处“心灵”比现代汉语的“灵魂里”更自然，同时未简化为情绪。
- source_word: μαστιγούμενος
  choice: 在鞭打之下
  rationale: 明确痛苦来自鞭打，保留被动受刑的处境。
- source_word: ἡδέως
  choice: 甘愿
  rationale: 在受苦语境中表达欣然、乐意承受；“甘愿”较“高兴地”更符合现代汉语庄重语体。
- source_word: διὰ τὸν αὐτοῦ φόβον
  choice: 因敬畏他
  rationale: φόβος 指向对上帝的畏惧并含尊崇意味；正文采用汉语圣经语境中兼具二者的“敬畏”，脚注保留较直译的可能。
theological_decisions:
- issue: φόβος 指向主时的含义
  choice: 敬畏他
  alternative: 惧怕他／因对他的畏惧
  rationale: “敬畏”在现代汉语中仍包含畏惧与尊崇，适合对上帝的 φόβος；脚注说明原词可直译为“惧怕”，避免完全消解其较强语气。
- issue: ψυχή 与 σῶμα 的对照
  choice: 心灵与身体
  alternative: 灵魂与身体／内心与身体
  rationale: 原文明确形成身体与 ψυχή 的对照。“心灵”既保留内在生命层面，又比“灵魂里”自然；不采用“精神”，以免与 πνεῦμα 混同。
- issue: 主所拥有的“神圣知识”
  choice: 保留“神圣的知识”
  alternative: 神圣的洞察／知道神圣真理
  rationale: 原文 γνῶσις 是知识，并未明说全知或真理内容，因此不作教义性扩展。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句中保留“身体—心灵”的平衡对照；以分号呈现肉身痛苦与内在甘愿之间的张力。脚注标记均置于正文对应短语之后。
