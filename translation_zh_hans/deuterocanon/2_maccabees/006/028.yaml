  text: thus leaving to the young a noble example of dying willingly and bravely for the revered and holy laws. And after saying these things[a], he immediately went to the rack,
translation:
  language: zh_hans
  text: 这样，他就给年轻人留下了一个崇高的榜样：甘心而勇敢地为庄严神圣的律法舍命。他说完这些话，便立刻走向刑架[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文τύμπανον字面意为“鼓”，这里指一种施行拷打或处刑的器具；具体形制可能类似刑架或轮刑具。
    reason: 说明词语的字面意义及刑具形制上的不确定性。
lexical_decisions:
- source_word: τοῖς δὲ νέοις
  choice: 给年轻人
  rationale: 与格表示对象或受益者；νέοις在此泛指年轻人，不限定为男性。
- source_word: ὑπόδειγμα γενναῖον
  choice: 一个崇高的榜样
  rationale: ὑπόδειγμα意为榜样、典范；γενναῖον兼有高尚与勇毅之意。“崇高的榜样”自然地传达其道德尊严，并避免与下文“勇敢地”机械重复。
- source_word: καταλελοιπὼς
  choice: 留下了
  rationale: 完成时分词强调所留下的榜样具有持续影响；“留下了”在现代汉语中简洁自然。
- source_word: εἰς τὸ ... ἀπευθανατίζειν
  choice: 舍命
  rationale: εἰς τό加不定式表达榜样所指向的行动；ἀπευθανατίζειν是加强语气的死亡用语。“舍命”保留主动面对死亡的意味，又不额外渲染。
- source_word: προθύμως
  choice: 甘心
  rationale: 表示乐意、情愿或欣然准备好；“甘心”符合殉道语境，又不暗示对死亡本身的不当狂热。
- source_word: γενναίως
  choice: 勇敢地
  rationale: 直接表达面对死亡时的勇毅方式。
- source_word: ὑπὲρ τῶν σεμνῶν καὶ ἁγίων νόμων
  choice: 为庄严神圣的律法
  rationale: ὑπέρ表示“为了、为……而”；σεμνῶν兼具庄重、可敬之意，ἁγίων为神圣。“庄严神圣”保留原文对律法的价值判断。希腊文虽用复数，汉语“律法”可作集合名词，读来更自然。
- source_word: τοσαῦτα δὲ εἰπών
  choice: 他说完这些话
  rationale: 自然表达分词所标明的先行动作，并保留“这些话”的指代。
- source_word: ἐπὶ τὸ τύμπανον
  choice: 走向刑架[a]
  rationale: τύμπανον字面为“鼓”，在本段指用于拷打或处刑的器具。“刑架”传达其语境功能，同时以脚注保留字面形象和器具形制的不确定性。
- source_word: εὐθέως ἦλθεν
  choice: 便立刻走向
  rationale: εὐθέως强调即时性；ἦλθεν在语境中表示朝刑具移动。“走向”符合现代汉语叙事。
theological_decisions:
- issue: 殉道行为及律法的褒义描述
  choice: 保留“崇高的榜样”“甘心而勇敢地”以及“庄严神圣的律法”等明确褒义表达
  alternative: 弱化为“一个榜样”“坚决地死去”或“受尊重的律法”
  rationale: 原文直接赞许以利亚撒的死亡，并以σεμνῶν καὶ ἁγίων评价律法。译文应保留这种神学与道德张力，不将其价值判断中性化。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“舍命”比直译“死去”更能体现主动面对死亡的语势；句式保持叙事紧凑。脚注标记置于“刑架”之后，与所注词直接对应。
