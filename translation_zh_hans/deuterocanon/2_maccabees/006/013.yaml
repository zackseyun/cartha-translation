  yaml_path: translation/deuterocanon/2_maccabees/006/013.yaml
  text: For indeed[a], not allowing those who act impiously to go on for a long time, but immediately bringing punishments upon them, is a sign of great kindness.
translation:
  language: zh_hans
  text: 因为，不让那些行不敬虔之事的人长期如此下去，反而使他们立即遭受惩罚，是极大恩惠的标志。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μὴ πολὺν χρόνον ἐᾶσθαι
  choice: 不让……长久这样下去
  rationale: 将带冠词的不定式结构作为全句主语处理；ἐᾶσθαι在此指容许或任凭，译文表达不容其长期继续而不受制止。
- source_word: τοὺς δυσσεβοῦντας
  choice: 那些行不敬虔之事的人
  rationale: 保留现在分词所强调的行为性，不把它静态化为“恶人”或“不敬虔的人”；“不敬虔”也保留了该词针对神圣之事的含义。
- source_word: ἀλλʼ εὐθέως
  choice: 而……立即
  rationale: 突出与“长久”相对的迅速性；汉语以“而”自然连接正反两面。
- source_word: περιπίπτειν τοῖς ἐπιτιμίοις
  choice: 遭受惩罚
  rationale: περιπίπτειν表示落入、遭逢，ἐπιτίμια指惩罚或刑罚；“遭受惩罚”既自然，也保留受罚的力度，未弱化为单纯“管教”。
- source_word: μεγάλης εὐεργεσίας
  choice: 极大恩惠
  rationale: εὐεργεσία指善行、恩惠或有益的善待；“恩惠”保留施益含义，同时不预先限定为更具特定神学色彩的“怜悯”。
- source_word: σημεῖόν ἐστιν
  choice: 正是……的标志
  rationale: 直译其表明或显示某事的证据性含义；“正是”使现代汉语判断句自然，并凸显本节的论点。
theological_decisions:
- issue: 如何表达迅速惩罚本身是恩惠这一神学张力
  choice: 直陈“不容其长期继续、使其立即受罚”是“极大恩惠的标志”
  alternative: 将“惩罚”译为“管教”，或将“恩惠”译为“怜悯”
  rationale: 希腊文本有意并置惩罚与施益。译文不软化惩罚，也不把εὐεργεσία窄化为特定的神学术语，从而保留原文的张力及上下文中及时审判具有益处的论证。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“行不敬虔之事”保留行为性，“长久这样下去”使省略的持续状态在汉语中自然显明；全句避免古奥表达和宗派性术语。
