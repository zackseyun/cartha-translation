base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/026.yaml
  text: For even if for the present I escape the punishment from men[b][a], yet I will escape neither alive nor dead from the hands of the Almighty.
translation:
  language: zh_hans
  text: 因为即使我眼下逃过人所施的刑罚[a]，无论活着还是死了，我都逃不出全能者的手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“来自人的刑罚”，即人所施加的刑罚。
    reason: lexical_alternative
  - marker: b
    text: 意思是：无论在生时，还是借死亡，都不能逃脱全能者的权能与审判。
    reason: theological_clarification
lexical_decisions:
- source_word: εἰ γὰρ καὶ
  choice: 因为即使
  rationale: 保留γάρ承接上文的解释语气，以及εἰ…καί所表达的让步关系，同时符合现代汉语表达。
- source_word: ἐπὶ τοῦ παρόντος
  choice: 眼下
  rationale: 准确表达暂时、目前的时间限制，语言自然简洁。
- source_word: ἐξελοῦμαι
  choice: 我……逃过
  rationale: 此处中动形式在语境中表示摆脱或逃脱刑罚；“逃过”与汉语中“刑罚”的搭配自然。
- source_word: τὴν ἐξ ἀνθρώπων τιμωρίαν
  choice: 人所施的刑罚
  rationale: 明确ἐξ ἀνθρώπων表示刑罚来自人、由人施加，并与下句全能者的手形成对照。
- source_word: ἀλλὰ
  choice: （由后句转折语势体现）
  rationale: 汉语的“即使……都……”结构已清楚表达强烈转折；不另加“但是”，可避免句式累赘。
- source_word: τὰς τοῦ παντοκράτορος χεῖρας
  choice: 全能者的手
  rationale: “全能者”准确传达παντοκράτωρ，且不添加原文未明说的“上帝”；保留“手”的圣经意象。
- source_word: οὔτε ζῶν οὔτε ἀποθανών
  choice: 无论活着还是死了
  rationale: 自然地保留生与死的两极对举，表明死亡也不能使人脱离全能者的权能范围。
- source_word: ἐκφεύξομαι
  choice: 我都逃不出
  rationale: 表达将来意义及由οὔτε…οὔτε构成的全面否定；“逃不出……的手”在汉语中形象而自然。
theological_decisions:
- issue: παντοκράτωρ的称号
  choice: 全能者
  alternative: 全能的上帝
  rationale: “全能者”既准确又为现代读者所熟悉，也避免加入希腊文此处没有明说的“上帝”。
- issue: οὔτε ζῶν οὔτε ἀποθανών所含的死后问责意涵
  choice: 无论活着还是死了
  alternative: 活着或死后
  rationale: 直陈生死都不能使说话者逃离全能者的手，保留原文的神学张力，不扩展为更完整的来世教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“眼下”清楚表达暂时性；“逃过……刑罚”与“逃不出……的手”既避免机械重复，又保留希腊文两个逃脱动词及鲜明对照。所有脚注标记均置于正文相应位置。
