  yaml_path: translation/deuterocanon/2_maccabees/006/031.yaml
  text: So then[a], in this way he passed away, leaving behind his own death as an example of courage and a memorial of virtue[c][b], not only for the young but also for most of the nation.
translation:
  language: zh_hans
  text: 所以，他就这样离世了[a]，以自己的死为年轻人，也为本民族的大多数人留下勇气的典范和美德的纪念[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“死了。”原文采用的是比普通“死”字更委婉、庄重的表达。
    reason: lexical_alternative
  - marker: b
    text: “勇气”也可译作“英勇”或“高尚品格”；“美德”也可译作“品德上的卓越”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετήλλαξεν
  choice: 离世了
  rationale: 原词在此委婉而庄重地指死亡；“离世”既清楚，又保留高雅叙事语气。
- source_word: τοῦτον τὸν τρόπον
  choice: 就这样
  rationale: 自然、简洁地表达方式，与上下文总结语气相合。
- source_word: ὑπόδειγμα
  choice: 榜样
  rationale: 表示可供后人效法的范例；“榜样”符合现代汉语习惯。
- source_word: γενναιότητος
  choice: 勇气
  rationale: 此处描述以死亡显出的刚毅勇敢；“勇气”比“高贵”更直接切合殉难语境，同时不排除高尚品格的意味。
- source_word: μνημόσυνον
  choice: 纪念
  rationale: 指使某种品德长久被记念之事；“纪念”保留原文庄重的纪念性。
- source_word: ἀρετῆς
  choice: 美德
  rationale: 在此具有伦理上的优良品格之意；“美德”明确而不引入后来的教义范畴。
- source_word: τοῖς νέοις
  choice: 给年轻人
  rationale: 将与格表达为受益或面对的群体；不额外限定性别。
- source_word: τοῖς πλείστοις τοῦ ἔθνους
  choice: 给本民族的大多数人
  rationale: ἔθνος在此指以色列／犹太民族；“本民族”保留集体民族含义，而不在正文中补出原文未明说的专名。
- source_word: καταλιπών
  choice: 留下
  rationale: 兼具身后留下和遗产般传承的含义，汉语简洁自然。
theological_decisions:
- issue: 次经殉难叙事中的伦理用语
  choice: 将γενναιότης译为“勇气”，ἀρετή译为“美德”
  alternative: 将前者译为“高尚品格”或“英勇”，后者译为“卓越”
  rationale: 这组译法保留原文对以利亚撒之死的伦理赞许和示范意义，同时避免套入后世特定宗派的功德或圣徒教义。
- issue: 死亡的委婉表达
  choice: 译为“离世了”
  alternative: 直译为“死了”
  rationale: 原文没有使用普通的死亡动词，而采用较庄重的委婉说法；“离世”能在保持清楚的同时传达这一语域。
- issue: 死亡作为榜样和纪念的句法关系
  choice: 保留“自己的死”同时支配“勇气的榜样”和“美德的纪念”
  alternative: 意译为“以自己的死树立勇气的榜样，并留下美德的纪念”
  rationale: 原文把“自己的死”直接作为所留下的榜样和纪念；正文尽量保留这一凝练而富张力的表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句序保留原文先叙离世、后说明其身后影响的结构；“本民族”明确语境所指而不增添专名。
