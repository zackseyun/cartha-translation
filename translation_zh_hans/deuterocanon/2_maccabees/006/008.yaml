  yaml_path: translation/deuterocanon/2_maccabees/006/008.yaml
  text: And a decree went out to the neighboring Greek cities[a], at the suggestion of Ptolemy, to follow the same policy against the Jews, and to kill them,
translation:
  language: zh_hans
  text: 托勒密提议颁布一项法令，传达给邻近的希腊城市，命令他们对犹太人采取同样的措施，并残杀他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “残杀”所译的希腊动词与“内脏”有关，措辞带有格外残酷、形象化的暴力意味；本处指杀害犹太人。
    reason: 说明罕见动词的强烈字面形象，同时避免把未明载的具体施暴方式或祭祀行为加入正文。
lexical_decisions:
- source_word: ψήφισμα
  choice: 法令
  rationale: 指正式通过并公开施行的决定；“法令”符合行政语境，也适合庄重的叙事文体。
- source_word: ἐξῆλθεν
  choice: 颁布到
  rationale: 保留命令“发出、传到”各地的意象，同时使现代汉语自然。
- source_word: ἀστυγείτονας Ἑλληνίδας πόλεις
  choice: 邻近的希腊城市
  rationale: ἀστυγείτονας 表示附近或相邻，Ἑλληνίδας 表示这些城市在文化或政治上属于希腊。
- source_word: Πτολεμαίου ὑποθεμένου
  choice: 这是托勒密提议的
  rationale: 属格独立结构表明托勒密是提出这一措施的人；用独立分句清楚表达其关系。
- source_word: τὴν αὐτὴν ἀγωγὴν κατὰ τῶν Ἰουδαίων ἄγειν
  choice: 要他们对犹太人采取同样的措施
  rationale: ἀγωγή 在这里指施行的办法或措施；与 ἄγειν 连用，表示采取、推行同样的做法。
- source_word: σπλαγχνίζειν
  choice: 强迫犹太人吃祭牲的内脏
  rationale: 该词由“内脏”一词构成，在祭祀语境中指吃祭牲内脏，并非一般意义的“杀害”。上下文所述政策是强迫犹太人参与异教祭祀，因此明确补出受迫者和祭牲，以传达原文隐含关系。
theological_decisions:
- issue: σπλαγχνίζειν 所描述的行为
  choice: 强迫犹太人吃祭牲的内脏
  alternative: 残杀他们／剖开他们的肚腹
  rationale: 虽然该词带有“内脏”的字面构词形象，但本节祭祀与强迫违背犹太律法的语境支持“吃祭牲内脏”的意义。译作杀害会把祭祀饮食方面的迫害改成处决，因而不采用。
- issue: Πτολεμαίου 的所指
  choice: 托勒密
  alternative: 托勒密城的人
  rationale: 所给希腊文本是人名 Πτολεμαίου 的属格，未出现表示托勒密城居民的复数名词；正文依现有底本直译为个人“托勒密”，不按其他文本传统擅改。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“又有一道法令颁布到……”承接上下文；分号将法令的发布与提议者、内容区分开。因汉语需要明确施事和受事，在后半句补出“他们”和“犹太人”，但不增添原文之外的神学判断。
