base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/018.yaml
  text: A certain Eleazar[a], one of the leading scribes, a man already advanced in age and most handsome in appearance, was being forced, with his mouth pried open, to eat pork.
translation:
  language: zh_hans
  text: 有一位以利亚撒，是显要的经学家之一。他年事已高，相貌十分端正；人把他的嘴强行撬开，逼他吃猪肉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεάζαρός τις
  choice: 有一位以利亚撒
  rationale: τις在叙事中引出人物；现代汉语用“有一位”自然表达其不定意味。专名按通行圣经译名音译为“以利亚撒”。
- source_word: τῶν πρωτευόντων γραμματέων
  choice: 显要的经学家之一
  rationale: πρωτευόντων表示居首、显要；γραμματεύς在此犹太背景中指熟悉经书与律法的经学家。“经学家”比泛称“文士”更便于现代读者理解，同时不进一步解释为律师或教师。
- source_word: ἤδη προβεβηκὼς τὴν ἡλικίαν
  choice: 年事已高
  rationale: 准确而自然地表达已经进入高龄，语体庄重简洁。
- source_word: τὴν πρόσοψιν τοῦ προσώπου κάλλιστος
  choice: 相貌十分端正
  rationale: 该短语明确描述脸面与外在观感；κάλλιστος是最高级。汉语“十分端正”保留强度和尊严感，又不把外貌擅自解释为道德上的高尚。
- source_word: ἀναχαινόμενον
  choice: 人把他的嘴强行撬开
  rationale: 该被动分词描写嘴被外力撑开或撬开。“强行撬开”鲜明传达身体强制，不弱化为仅仅“张大嘴”。
- source_word: ἠναγκάζετο φαγεῖν
  choice: 逼他吃
  rationale: 未完成时被动式表示当时持续受到强迫；汉语“逼他吃”自然、直接，并保留受迫性。
- source_word: ὕειον κρέας
  choice: 猪肉
  rationale: 字面指猪的肉；现代汉语“猪肉”准确、自然，无须使用古雅表达。
theological_decisions:
- issue: 殉道叙事中不洁食物的表达
  choice: 猪肉
  alternative: 猪的肉；豕肉
  rationale: 希腊文只明说猪肉，违反犹太饮食律法的神学意义由上下文呈现，不在正文中额外增添解释。
- issue: 外貌描写是否解释为人格高贵
  choice: 相貌十分端正
  alternative: 仪表极其高贵
  rationale: 原文聚焦可见的脸面和外貌；避免把审美描述直接神学化或道德化为“高贵”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号连接外貌背景与随后遭受的强迫，使长句层次清楚；保留原文中身体暴力的鲜明程度。
