  text: But those who did not choose to adopt the Greek ways were to be slaughtered[a]. Thus one could see the present misery.
translation:
  language: zh_hans
  text: 但凡不肯改从希腊习俗的，都要被屠杀[a]。因此，人们就能看见眼前的苦难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“转到希腊人的事物一边”。这里泛指改从希腊化的习俗和生活方式。
    reason: 说明ἐπὶ τὰ Ἑλληνικά的字面宽泛表达及其在本处所指的文化生活实践。
lexical_decisions:
- source_word: μὴ προαιρουμένους
  choice: 不愿
  rationale: προαιρέομαι含有出于意志作出选择的意味；在否定结构中译作“不愿”自然地保留其主动选择和拒绝之意。
- source_word: μεταβαίνειν ἐπὶ τὰ Ἑλληνικά
  choice: 转而接受希腊习俗
  rationale: μεταβαίνειν本义为“转过去、转向”，ἐπὶ τὰ Ἑλληνικά泛指希腊化的生活方式和实践；合译既保留转变阵营或生活方式的动态，也避免误解为只学习希腊语或改变族裔身份。
- source_word: κατασφάζειν
  choice: 都要被屠杀
  rationale: 该动词强于一般的“杀死”，突出残酷杀戮；结合上下文的命令语气，用“要被屠杀”表达规定的后果。
- source_word: παρῆν οὖν ὁρᾶν
  choice: 因此……清楚可见
  rationale: 这一非人称表达意为当时可以看见、眼前可见；译法符合现代汉语，同时保留观察性的陈述。
- source_word: τὴν ἐνεστῶσαν ταλαιπωρίαν
  choice: 当时的苦难
  rationale: ἐνεστῶσαν表示正在发生、当前存在；“当时的苦难”准确表达眼前现实，不额外加入苦难“已经来到”的动态含义。
theological_decisions:
- issue: ἐπὶ τὰ Ἑλληνικά所指的范围
  choice: 希腊化习俗和生活实践
  alternative: 仅指希腊语言，或指族裔上成为希腊人
  rationale: 本段语境涉及强迫遵从希腊化的文化和宗教实践。译文用“希腊习俗”保持其广泛含义，但不擅自把它限定为正式背教。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“屠杀”保留原文的暴力强度；“清楚可见”使希腊语非人称观察结构在汉语中自然。脚注标记已在正文对应位置列出。
