  yaml_path: translation/deuterocanon/2_maccabees/009/020.yaml
  text: Farewell[a], and your children. And your own affairs—your own affairs—your own affairs will be according to your judgment. Having my hope in heaven,
translation:
  language: zh_hans
  text: 愿你们和你们的儿女安好；你们自己的事务——你们自己的事务——你们自己的事务，都必照你们的判断而定。[a]我把盼望寄托在天上，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里采用的希腊文本将“你们自己的事务”重复了三次。这可能是有意的强调，也可能是传抄过程中意外造成的重复。
    reason: textual_variant
lexical_decisions:
- source_word: ἐρρῶσθε
  choice: 愿你们……安好
  rationale: 此词在书信中是祝愿收信人安好的惯用语，不宜直译为命令式的“要刚强”；中文以“愿……安好”既自然又保留书信语气。
- source_word: τὰ τέκνα
  choice: 你们的儿女
  rationale: 定冠词在直接面向收信人的语境中自然带有领属意味；“儿女”涵盖子女，不限于儿子。
- source_word: τὰ ἴδια
  choice: 你们自己的事务
  rationale: 中性复数在这里指收信人自己的事情或切身事务；“事务”比“东西”更符合语境，并保留三次重复。
- source_word: κατὰ γνώμην ὑμῶν
  choice: 照你们的判断而定
  rationale: γνώμη可指判断、意见或意向；此译保留其审慎判断之意，并以“而定”自然连接未来式。
- source_word: ἔσται
  choice: 都必……而定
  rationale: 对应εἰμί的将来时，表达这些事务将依收信人的判断而有相应结果，不额外补入具体内容。
- source_word: εἰς οὐρανὸν τὴν ἐλπίδα ἔχων
  choice: 我把盼望寄托在天上
  rationale: 原文分词短语简练且略带压缩感；此译自然表达盼望指向天上，同时不具体解释“天上”所指。
theological_decisions:
- issue: 源文本将τὰ ἴδια连续写了三次
  choice: 正文保留三次重复，并用破折号呈现强调或突兀感
  alternative: 视为传抄中的意外重写，只译一次“你们自己的事务”
  rationale: 所给希腊见证明确有三次重复，且来源验证为可靠，不应在正文中无声删改。重复究竟是有意强调还是传抄增复，无法确定，因此保留原貌，并以脚注交代文本问题。
- issue: εἰς οὐρανὸν的指向
  choice: 译为“在天上”
  alternative: 具体化为“寄托在天上的上帝身上”
  rationale: 原文只说盼望指向天上，并未明说对象；不补出“上帝”，以保存原文的简约与潜在歧义。
translation_notes:
  register: 采用庄重而现代的书信语体。“愿你们和你们的儿女安好”符合现代汉语祝愿表达；三次重复原样保留，以破折号帮助读者辨认其刻意或文本异常的效果。末尾保留逗号，因为本节以分词短语结束，语意可能接续下文。
