base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/012.yaml
  text: 'As his pains intensified from moment to moment[a], and he was not even able to endure his own stench, he said this: “It is right to submit to God[c][b], and for one who is mortal not to think proudly.”'
translation:
  language: zh_hans
  text: 他的疼痛一刻比一刻加剧[a]，甚至连自己的恶臭也无法忍受。他说：“人理当[b]顺服上帝；既是必死的人，就不该心存傲慢[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一刻一刻地”或“不断地”。
    reason: lexical_alternative
  - marker: b
    text: “理当”也可译作“是正当的”或“是合宜的”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“既是必死的，就不要心存傲慢”；这里表达的是关于必死之人的一般原则。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ στιγμὴν
  choice: 一刻比一刻
  rationale: 表达疼痛随时间逐步加剧，符合现代汉语习惯；脚注保留“时时刻刻／不断”的可能理解。
- source_word: ἐπιτεινόμενος ταῖς ἀλγηδόσιν
  choice: 他的疼痛……加剧
  rationale: 按上下文将结构自然转换为疼痛不断加重，不夸大为“折磨”或“剧痛”。
- source_word: μηδὲ τῆς ὀσμῆς αὐτοῦ ἀνέχεσθαι δυνάμενος
  choice: 甚至连自己的恶臭也无法忍受
  rationale: ὀσμή本可泛指气味，但疾病叙事和“无法忍受”表明此处是难闻的臭味；“恶臭”准确而简洁。
- source_word: Δίκαιον
  choice: 理当
  rationale: 此处为无人称用法，兼有“正当”与“合宜”的意味；“理当”自然凝练。
- source_word: ὑποτάσσεσθαι τῷ θεῷ
  choice: 顺服上帝
  rationale: 表达将自己置于上帝权柄之下；“顺服”在现代中文中清楚、庄重。
- source_word: μὴ θνητὸν ὄντα
  choice: 既是必死的人，就不该
  rationale: 保留人的必死性所构成的理由，并用泛指“人”体现原文的一般性原则。
- source_word: ὑπερήφανα φρονεῖν
  choice: 心存傲慢
  rationale: 保留φρονεῖν所指的思想和心态层面，比单说“不可傲慢”更贴近原文。
theological_decisions:
- issue: μὴ θνητὸν ὄντα是泛指人类必死性，还是只指说话者本人
  choice: 既是必死的人，就不该心存傲慢
  alternative: 我既是必死的人，就不该心存傲慢
  rationale: 希腊文没有明示第一人称，句法呈现可普遍适用于凡人的原则；译文保留这一普遍性，不把它收窄为个人自述。
- issue: Δίκαιον的道德与合宜性含义
  choice: 理当顺服上帝
  alternative: 顺服上帝是公义的／合宜的
  rationale: “理当”兼顾正当与合宜，不将本句限定为某种专门的称义或司法含义。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语体。“一刻比一刻加剧”传达持续恶化；引语使用“理当”“顺服”“心存傲慢”，既自然又保留伦理与神学张力。所有脚注标记均在正文对应位置出现。
