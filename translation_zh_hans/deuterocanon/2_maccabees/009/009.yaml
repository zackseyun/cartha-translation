base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/009.yaml
  text: so that worms even swarmed from the body of the ungodly man[a], and while he was still alive, in pains and agonies, his flesh fell away[b], and because of his stench the whole camp was burdened by the rottenness.
translation:
  language: zh_hans
  text: 以至于，甚至有蛆虫从这个不敬神之人的身体里涌出来[a]；他还活着，在剧痛和折磨中，身上的肉不断脱落[b]；整个军营都被他身上腐败的恶臭压得不堪重负。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “涌出来”所译的希腊语动词，较直译可作“沸腾起来”或“翻涌而出”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“他的肉不断脱落”；这是在他仍然活着的时候发生的。
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσσεβοῦς
  choice: 不敬神之人
  rationale: 保留该词指向对神不敬、悖逆的宗教道德意味，又不把它泛化为一般的“恶人”。
- source_word: σκώληκας ἀναζεῖν
  choice: 蛆虫……涌出来
  rationale: σκώληξ在腐败尸肉语境中自然指蛆虫；ἀναζέω本义有“沸腾、翻涌而上”之感，“涌出来”既保留强烈画面，也符合现代汉语表达。
- source_word: ζῶντος
  choice: 他还活着
  rationale: 明确表现肉体腐烂脱落发生在死亡以前，保留希腊文分词结构的时间强调。
- source_word: ἐν ὀδύναις καὶ ἀλγηδόσιν
  choice: 在剧痛和折磨中
  rationale: 两个近义名词叠加强调严重的身体痛苦；译文保留双重表达而避免生硬重复。
- source_word: τὰς σάρκας αὐτοῦ διαπίπτειν
  choice: 身上的肉不断脱落
  rationale: σάρκες在此指实际的肉体；διαπίπτειν含掉落、散落之意，未额外解释为单纯腐烂；未完成体意味以“不断”体现。
- source_word: ὑπὸ δὲ τῆς ὀσμῆς αὐτοῦ
  choice: 他的恶臭
  rationale: ὀσμή本可泛指气味，但腐败语境清楚表明是令人厌恶的臭味。
- source_word: πᾶν τὸ στρατόπεδον
  choice: 全营的人
  rationale: στρατόπεδον字面为整个军营；结合βαρύνεσθαι所表达的承受感，汉语以营中众人为实际受影响者，表达更自然。
- source_word: βαρύνεσθαι τὴν σαπρίαν
  choice: 恶臭和腐烂之气使……都不堪忍受
  rationale: 希腊文末句结构凝缩而不寻常，表达整个军营受其腐败恶臭压迫。“不堪忍受”传达βαρύνεσθαι的沉重、受压感，“腐烂之气”保留σαπρία的腐败含义。
theological_decisions:
- issue: δυσσεβοῦς对安条克的宗教道德定性
  choice: 不敬神之人
  alternative: 恶人；不虔敬的人
  rationale: “不敬神”明确保留该词朝向神的悖逆含义，但不加入经文未明说的教派性或系统神学判断。
- issue: 肉体败坏与其不敬神之间的叙事张力
  choice: 按原文并列呈现，不增添因果解释
  alternative: 明确译作这是神对他的惩罚
  rationale: 本节用“不敬神之人”刻画他，并描写其惨状，但本句没有明说完整的神学因果命题，因此不在译文中补入。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文骇人的身体败坏图景，并用分号呈现三个连续结果。“蛆虫”比泛称“虫子”更符合腐肉语境；末句因希腊文句法凝缩，采用自然汉语表达其恶臭与腐败使全营难以承受。
