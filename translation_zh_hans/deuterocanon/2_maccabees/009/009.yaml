  source_fidelity: 译文总体准确呈现了蛆虫从身体涌出、人在活着时肉体脱落及其恶臭影响军营的骇人描写。“不敬神之人”准确保留了 δυσσεβής 的宗教—道德含义；“蛆虫……涌出来”和“不断脱落”也恰当反映原文的形象和未完成动作。末句却把“整个军营”改成“全营的人”，并将“臭味”与“腐败／腐烂”合并扩展为“恶臭和腐烂之气”，略改变了原文所说军营本身受腐败恶臭压迫的表达。
