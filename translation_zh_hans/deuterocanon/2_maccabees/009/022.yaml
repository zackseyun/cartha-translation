translation:
  language: zh_hans
  text: 我并不对自己的处境绝望，反而大有希望，能摆脱这场疾病。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀπογινώσκων
  choice: 并不……绝望
  rationale: ἀπογινώσκω在此表示失去希望、陷入绝望；译文保留否定形式，也自然表达说话者并未放弃希望。
- source_word: τὰ κατʼ ἐμαυτόν
  choice: 自己的处境
  rationale: 这一习语泛指与自己有关的情况；上下文涉及患病，译作“自己的处境”既涵盖病情，也不把原文的范围收窄为纯粹的身体状况。
- source_word: ἀλλὰ
  choice: 反而
  rationale: 此处引出与“不绝望”相对且更积极的陈述；“反而”清楚呈现转折与递进语气。
- source_word: ἔχων πολλὴν ἐλπίδα
  choice: 大有希望
  rationale: 保留πολλήν所表达的强度，同时采用自然、庄重的现代汉语说法。
- source_word: ἐκφεύξεσθαι
  choice: 能摆脱
  rationale: 未来中间态不定式表达所盼望的结果，即从疾病中脱身；“能摆脱”在汉语中自然承接“希望”，且不额外加入治疗或痊愈机制。
- source_word: τὴν ἀσθένειαν
  choice: 这场疾病
  rationale: ἀσθένεια可指软弱或疾病；本处语境明确指身体患病。“这场疾病”具体、自然，并与“摆脱”搭配顺畅。
