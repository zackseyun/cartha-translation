revisions:
- from: 至于犹太人，他曾断定他们连安葬都不配，还要把他们连同婴孩一起抛出去，任飞鸟吞吃，丢给野兽；如今他却要使他们全都与雅典人同等。[a]
  to: 至于犹太人，他曾认定他们连安葬也不配，反要把他们连同婴孩一起弃置，任飞鸟和野兽吞吃；他却要使他们全都与雅典人同等。[a]
  rationale: 删去无原文对应的“如今”，保留“却”以自然呈现本节中先前残酷意图与随后承诺之间的反差；并将飞鸟和野兽并列表述为吞食者，以更完整、自然地传达原文的弃尸图像。其余关键措辞及脚注均可保留。
