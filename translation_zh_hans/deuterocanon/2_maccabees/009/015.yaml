base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/015.yaml
  text: But the Jews[a], whom he had determined not even to count worthy of burial, but to cast out with their infants for the birds to devour and for the wild beasts—he would make them all equal to the Athenians.
translation:
  language: zh_hans
  text: 至于犹太人，他曾认定他们连安葬也不配，反要把他们连同婴孩一起弃置，任飞鸟和野兽吞吃；他却要使他们全都与雅典人同等。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“使他们享有与雅典人同等的地位”；这在历史语境中很可能指同等的公民待遇或法律地位，而不只是社会声望相同。
    reason: 说明ἴσους Ἀθηναίοις在历史语境中可能具有政治或法律含义，同时不把这一较具体的解释写入正文。
lexical_decisions:
- source_word: διέγνωκε
  choice: 曾断定
  rationale: 表达在此承诺之前已经形成的坚定决定，同时用自然的现代汉语保留其既定、决断的意味。
- source_word: μηδὲ ταφῆς ἀξιῶσαι
  choice: 连安葬都不配
  rationale: 保留ἀξιόω所含“视为配得”的评价意味，而不将其弱化为单纯的“不准安葬”。
- source_word: οἰωνοβρώτους
  choice: 任飞鸟吞吃
  rationale: 该词意为尸身被鸟类啄食；汉语采用展开表达，以清楚呈现弃尸不葬的惨烈图景。
- source_word: σὺν τοῖς νηπίοις
  choice: 连同婴孩一起
  rationale: νήπιοι指年幼、尚不能自理或说话的孩子；“婴孩”简洁地传达其年幼程度。
- source_word: ἐκρίψαι
  choice: 抛出去
  rationale: 保留该动词“扔出、弃置”的强烈动作感，并符合尸身遭弃置的语境。
- source_word: θηρίοις
  choice: 丢给野兽
  rationale: 以汉语自然表达与ἐκρίψαι相连的与格关系，呈现被弃给野兽的意思，不额外限定野兽是否实际吞吃。
- source_word: πάντας αὐτοὺς ἴσους Ἀθηναίοις ποιήσειν
  choice: 要使他们全都与雅典人同等
  rationale: 贴近原文保留“使……同等”的表述，不在正文中擅自明确为公民权、法律地位或社会声望。
theological_decisions:
- issue: “与雅典人同等”的政治和文化含义
  choice: 正文保留直译性的“使他们全都与雅典人同等”
  alternative: 使他们享有与雅典人同等的公民身份或权利
  rationale: 原文只说明“使他们与雅典人同等”，并未明说实现这种同等的法律机制。正文保留其开放性，脚注说明很可能涉及公民待遇或法律地位。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“至于……；如今却……”清楚呈现先前残酷决定与当前承诺之间的强烈反差；正文避免古奥词汇，也不把含混的政治地位具体化。
