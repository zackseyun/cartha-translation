base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/021.yaml
  text: I remembered your honor and goodwill with affection[a]; after returning from the regions of Persia and falling into an illness that has become severe, I considered it necessary to take thought for the common safety of all of you[c][b];
translation:
  language: zh_hans
  text: 我满怀亲爱之情，常常记念你们的敬意和善意[a]；我从波斯各地回来后，患上疾病，病情严重[b]，便认为有必要为你们众人的共同安全[c]筹划。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “善意”或译“恩惠”或“好感”；希腊语 εὔνοια 可表示善意、好感或恩惠。
    reason: lexical_alternative
  - marker: b
    text: 直译为“陷入一场有艰难情形的疾病”。这表达指疾病的状况严重、棘手或难以忍受。
    reason: lexical_alternative
  - marker: c
    text: “共同安全”或译“你们众人的共同安危”或“公共安全”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: 尊重
  rationale: 该词可指尊荣、敬意或尊重。在王室书信语境中译作“尊重”，既自然，也保留收信人对写信者所持敬意的关系意味。
- source_word: εὔνοια
  choice: 善意
  rationale: 该词表示善意、好感或恩惠；“善意”与“尊重”并列自然，并适合此处兼具人际与政治色彩的语境。
- source_word: ἐμνημόνευον
  choice: 一直……记着
  rationale: 未完成时可表达持续记念；“一直记着”在现代汉语中自然地传达这一延续意味。
- source_word: φιλοστόργως
  choice: 深情地
  rationale: 该副词表示温厚亲爱的情感，常带家人般的亲爱意味；“深情地”保留温暖语气而不把亲属意味说得过实。
- source_word: ἐπαναγαγών
  choice: 返回后
  rationale: 结合上下文按不及物意义理解，指写信者从波斯地区回来；“返回后”清楚表达分词的时间关系。
- source_word: ἐκ τῶν κατὰ τὴν Περσίδα τόπων
  choice: 从波斯一带
  rationale: 该短语泛指波斯境内的各处或地区；“波斯一带”简洁自然，又不把范围限定得过窄。
- source_word: περιπεσών
  choice: 染上
  rationale: 与“疾病”连用时表示陷入患病状态；“染上疾病”是现代汉语描述发病的自然说法。
- source_word: ἀσθενείᾳ
  choice: 疾病
  rationale: 该词虽也可指软弱，但此处明确指身体患病，译作“疾病”准确清楚。
- source_word: δυσχερίαν ἔχουσῃ
  choice: 病情严重
  rationale: 这一表达说明疾病处于艰难、棘手或难以忍受的状态；“病情严重”自然传达其实际含义，同时由脚注保留字面层面的张力。
- source_word: ἀναγκαῖον ἡγησάμην
  choice: 认为有必要
  rationale: 这是表达判断与决定的常见结构；“认为有必要”准确而符合现代正式书面语。
- source_word: φροντίσαι
  choice: 作打算
  rationale: 该动词表示关切、筹划或顾念；在政治行政语境中，“作打算”保留审慎筹谋的意味。
- source_word: κοινῆς πάντων ὑμῶν ἀσφαλείας
  choice: 你们大家共同的安危
  rationale: ἀσφάλεια表示安全、安稳，κοινῆς强调共同共有；“共同的安危”是庄重自然的汉语，也能体现公共安全与整体福祉的语境。
