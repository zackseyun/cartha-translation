  register: 采用现代、庄重而易懂的书信语体。“一直深情地记着”保留未完成时的持续意味和 φιλοστόργως 的温情；后半句以顺畅的汉语分句呈现一连串希腊语分词，并保留原句尚未结束的句法流向。
