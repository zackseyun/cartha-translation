  text: But while he was at Ecbatana[b][a], news came to him of what had happened to Nicanor and those with Timothy.
translation:
  language: zh_hans
  text: 他在厄克巴塔纳一带[a]时，有关尼加诺和提摩太一行人所发生之事的消息传到了他那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在厄克巴塔纳一带”也可译作“在厄克巴塔纳”。希腊语可指该城或其附近地区。
    reason: lexical_alternative
  - marker: b
    text: 直译：“有关尼加诺和提摩太一行人已经发生的事临到了他。”这里是指有关这些事件的消息传到他那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντι δὲ αὐτῷ
  choice: 他……时
  rationale: 以时间从句表达属格独立结构，符合现代汉语习惯，同时保留当时情境。δέ在本句主要承接并转折上下文，不必机械译出“但是”。
- source_word: κατʼ Ἐκβάτανα
  choice: 在厄克巴塔纳一带
  rationale: κατά加地名可表示位于该城或其附近地区；“一带”保留地点范围上的弹性，不强定为城内。
- source_word: προσεπέσε
  choice: 传到了他那里
  rationale: 本义为“临到、落到”，在这里以已经发生的事情为主语，语境所指是有关事件的消息传到他那里；译文自然表达这一含义。
- source_word: τὰ κατὰ Νικάνορα ... γεγονότα
  choice: 尼加诺……所发生的事
  rationale: τὰ κατά某人表示“有关某人的事”，γεγονότα表示已经发生的事件；采用“所发生的事”避免擅自断定这些事必定是直接发生在尼加诺身上。
- source_word: τοὺς περὶ Τιμόθεον
  choice: 提摩太一伙
  rationale: οἱ περὶ加人名通常指该人及其同伴或所属群体；“一伙”简明表达群体含义，但不额外限定为军队。
