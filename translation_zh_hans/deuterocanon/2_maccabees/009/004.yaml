base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/004.yaml
  text: But in his rage he thought to vent on the Jews the malice of those who had put him to flight. Therefore he ordered the charioteer[a], driving without stopping, to press on with the journey, while the judgment from heaven was accompanying him. For in his arrogance he had said, “When I arrive there, I will make Jerusalem a burial place of Jews.”
translation:
  language: zh_hans
  text: 他怒火中烧，竟想把那些迫使他逃走之人的恶意发泄在犹太人身上。因此，他命令战车御者不停赶车，尽快赶完行程；而那从天而来的审判正与他同行。因为他曾狂妄地说：“等我到了那里，我要使耶路撒冷成为埋葬许多犹太人的地方[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹太人的集体墓地”。希腊语 Πολυάνδριον 指埋葬许多死者的地方。
    reason: 说明该词含有多人合葬或众多死者葬身之处的意思；“集体墓地”更凝练，但比正文略为具体。
lexical_decisions:
- source_word: ἐπαρθεὶς δὲ τῷ θυμῷ
  choice: 他怒火中烧
  rationale: 该短语描写人被怒气激起、支配；“怒火中烧”是自然有力的现代汉语表达，也保留了情绪强度。
- source_word: ᾤετο
  choice: 竟想
  rationale: 表达安条克心中的盘算而非既成事实；“竟”同时传达叙事者对其迁怒意图的负面评价，但不把动词强化为确定实施。
- source_word: τῶν πεφυγαδευκότων αὐτὸν κακίαν
  choice: 那些迫使他逃走之人的恶意
  rationale: πεφυγαδευκότων表示使人逃走或驱逐；κακία在此可指敌意、恶意。译文保留原句把他所受敌意转嫁给犹太人的结构。
- source_word: ἐναπερείσασθαι
  choice: 发泄在……身上
  rationale: 该词有把某物压到、加到他人身上的意味；按语境译为“发泄在……身上”，自然呈现迁怒和转嫁敌意。
- source_word: συνέταξεν τὸν ἁρματηλάτην
  choice: 他命令车夫
  rationale: ἁρματηλάτης特指驾车者；“车夫”在现代汉语中准确易懂，并避免过度古雅。
- source_word: ἀδιαλείπτως ἐλαύνοντα
  choice: 不停赶车
  rationale: 保留“不间断”的副词意义，并明确动作是持续驱车。
- source_word: καταλύειν τὴν πορείαν
  choice: 催紧行程
  rationale: 该短语字面可指使旅程结束、抵达终点；结合持续赶车的语境，“催紧行程”表达急于尽快走完全程，同时避免生硬的“结束行程”。
- source_word: τῆς ἐξ οὐρανοῦ τῆς κρίσεως συνοδούσης αὐτῷ
  choice: 而那从天而来的审判正与他同行
  rationale: 保留属格独立结构所表达的同时发生，也保留κρίσις的司法性和神学意味；“与他同行”直接对应συνοδούσης的伴随意象。
- source_word: ὑπερηφάνως
  choice: 狂妄地
  rationale: 传达傲慢、自高且带冒犯性的语气，符合叙事对其威胁的道德评价。
- source_word: Πολυάνδριον
  choice: 埋葬许多犹太人的地方
  rationale: 该名词指埋葬许多死者之处。正文明确保留“许多”的构词含义，却不把它过度限定为某种具体墓葬形式。
theological_decisions:
- issue: 安条克所受惩罚的神圣来源与司法性质
  choice: 从天而来的审判正与他同行
  alternative: 从天而来的惩罚正跟随着他
  rationale: κρίσις首先具有审判、判决的意味，而不只是泛指痛苦；原文明确说其来源是天。译作“审判”既保留神圣来源和司法意味，也不进一步解释审判实施的具体方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。叙事句保持紧迫感，直接引语保留安条克狂妄、残酷的威胁。脚注标记置于其实际所解释的“埋葬许多犹太人的地方”之后。
