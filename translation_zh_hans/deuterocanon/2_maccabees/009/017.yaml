  yaml_path: translation/deuterocanon/2_maccabees/009/017.yaml
  text: And besides these things[a], he would also become a Jew and would visit every inhabited place[b], proclaiming the power of God.
translation:
  language: zh_hans
  text: 此外，他还许诺要成为犹太人，并要到访每一处有人居住的地方，宣扬上帝的大能[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的大能”也可译作“上帝的威能”或“上帝的统治”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: 此外
  rationale: 保留承接上文并增添一项许诺的语气，现代汉语简洁自然。
- source_word: Ἰουδαῖος ἔσεσθαι
  choice: 要成为犹太人
  rationale: 未来式配合“犹太人”在本语境中表示其许诺接受犹太人的身份或归属；不将其弱化为仅仅善待犹太人。
- source_word: πάντα τόπον οἰκητὴν
  choice: 每一个有人居住的地方
  rationale: 按上下文将形态较特殊的 οἰκητὴν 理解为“有人居住的”，并保留 πάντα τόπον 的周遍意味。
- source_word: ἐπελεύσεσθαι
  choice: 要走遍
  rationale: 表达前往各处的行动；“走遍”与“每一个……地方”搭配自然，也符合为宣告而四处行走的语境。
- source_word: καταγγέλλοντα
  choice: 宣扬
  rationale: 体现公开宣告、广为传述的含义，同时符合现代中文的庄重叙事语体。
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: 上帝的大能
  rationale: κράτος 可指力量、威势或统治权；“大能”在此清楚表达上帝压倒性的能力，同时以脚注保留“权能／统治权”的可能语义。
theological_decisions:
- issue: 安提奥古所许诺的 Ἰουδαῖος ἔσεσθαι 的含义
  choice: 他许诺要成为犹太人，即接受犹太人的身份或归属
  alternative: 他只是要亲近或善待犹太人；或仅按犹太人的方式生活
  rationale: 希腊文措辞强于一般的友好态度。译文保留其许诺的强烈程度，但不引入后世制度化“改宗”的技术含义。
- issue: κράτος 的语义范围
  choice: 大能
  alternative: 权能；威势；统治权
  rationale: 上下文强调上帝对王显出的压倒性能力，但该词也可含统治、主权意味，因此不在正文中扩展解释，并在脚注中保留其张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“许诺”补明这些不定式承接上文所述王的承诺，避免中文成为无主的零散短语。“走遍”使行旅与“每一个有人居住的地方”的周遍范围自然衔接。
