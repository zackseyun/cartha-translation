base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/016.yaml
  text: And the holy temple[a], which he had formerly plundered, he would adorn with the finest votive offerings, and he would restore all the sacred vessels many times over, and from his own revenues he would provide the expenses required for the sacrifices[b];
translation:
  language: zh_hans
  text: 他还许诺，要用最精美的奉献礼物[a]装饰那座他从前劫掠过的圣殿，把所有圣器按数倍偿还[b]，并从自己的收入中支付献祭所需的费用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奉献礼物”指献给圣殿并陈设其中的礼物。
    reason: 说明ἀναθήματα在圣所语境中的专门含义。
  - marker: b
    text: “按数倍偿还”原文指以多倍偿还，并非只是照原数补还；具体倍数未说明。
    reason: 保留πολυπλάσια所表达的多倍补偿，避免将倍数限定为两倍。
lexical_decisions:
- source_word: ἐσκύλευεν
  choice: 从前劫掠过
  rationale: 未完成时态回顾他先前对圣殿的劫掠行为；“从前……过”在中文中自然呈现与当前许诺的对比。
- source_word: ἅγιον ναὸν
  choice: 圣殿
  rationale: 在耶路撒冷敬拜语境中，“圣殿”简洁、庄重，并保留其神圣空间的含义。
- source_word: καλλίστοις ἀναθήμασιν
  choice: 极其精美的奉献礼物
  rationale: καλλίστοις表达最高程度的精美，ἀναθήματα特指奉献后陈设于圣所的礼物；此译既准确又便于现代读者理解。
- source_word: κοσμήσειν
  choice: 装饰
  rationale: 表达用奉献礼物美化、装点圣殿的意思。
- source_word: τὰ ἱερὰ σκεύη
  choice: 所有圣器
  rationale: “圣器”是简明而庄重的礼仪用语，指圣殿敬拜所用的器具。
- source_word: πολυπλάσια πάντα ἀποδώσειν
  choice: 把所有圣器加倍偿还
  rationale: πολυπλάσια表示按复数倍补偿，而非仅仅原物归还；“加倍”在此作宽泛的倍数性表达。
- source_word: τὰς ἐπιβαλλούσας πρὸς τὰς θυσίας συντάξεις
  choice: 献祭所需的费用
  rationale: 该短语指献祭方面应当承担或到期支出的款项；中文译为“所需的费用”清楚自然。
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: 从自己的收入中
  rationale: πρόσοδοι指收入或财政收益；此处强调由他自己的收入承担。
- source_word: χορηγήσειν
  choice: 供给
  rationale: 该词含有出资供应、负担所需之意，“供给……费用”保留了财政支持的含义。
theological_decisions:
- issue: 圣殿礼仪用语
  choice: 采用“圣殿、奉献礼物、圣器、献祭”等明确的礼仪词汇
  alternative: 采用“神庙、礼物、宗教用品、祭祀”等较泛化词汇
  rationale: 经文具体涉及耶路撒冷圣殿及其献祭制度；明确的礼仪词汇保留历史与宗教语境，同时不引入后期宗派解释。
- issue: πολυπλάσια的补偿幅度
  choice: 正文译作“加倍偿还”，脚注说明为数倍补偿
  alternative: 译作“多倍偿还”或“许多倍地偿还”
  rationale: 原词强调超过原数的倍数性补偿，但不限定确切倍数；正文取自然中文，脚注保留其范围开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他还许诺”补足本节在上下文中由一连串不定式承接的许诺语气。句末用句号，使中文作为独立经节自然完整。
