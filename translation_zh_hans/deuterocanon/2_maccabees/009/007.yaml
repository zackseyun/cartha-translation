base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/007.yaml
  text: But he in no way ceased from his arrogance[a]; rather, he was filled even more with pride, breathing fire in his rage against the Jews and ordering the journey to be hastened. Then it happened that he fell from the chariot as it was rushing along, and in the hard fall[b] all the limbs of his body were wrenched out of joint.
translation:
  language: zh_hans
  text: 但他丝毫没有收敛自己的狂傲，反而更加满心骄傲，向犹太人喷吐怒火，并命令加快行程[a]。这时，他从疾驰的战车上坠落；这一跤摔得很重，他全身的肢体都脱了臼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行程”也可译作“行军”。希腊语πορία可按语境指旅行、行程或行军。
    reason: lexical_alternative
  - marker: b
    text: “全身的肢体都脱了臼”也可译作“全身的肢体都被猛烈扯松”。这里所用的希腊语动词十分罕见，可能是说他的肢体因重摔而脱离关节。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδαμῶς ... ἔληγεν
  choice: 丝毫没有收敛
  rationale: οὐδαμῶς加强否定，ἔληγεν表示停止或收敛；此译在现代汉语中自然地保留强调语气。
- source_word: ἀγερωχίας
  choice: 狂傲
  rationale: 该词指盛气凌人、目中无人的傲慢；“狂傲”既简明，又符合本段的道德评述。
- source_word: ὑπερηφανίας ἐπεπλήρωτο
  choice: 越发满心骄傲
  rationale: 保留“充满”的意象，并以“越发”传达ἔτι δὲ καί所体现的递进；同时与前面的“狂傲”有所区分。
- source_word: πῦρ πνέων τοῖς θυμοῖς ἐπὶ τοὺς Ἰουδαίους
  choice: 向犹太人喷吐怒火
  rationale: 保留“喷火”的鲜明隐喻，并自然表达怒气针对犹太人的敌意。
- source_word: κελεύων ἐποξύνειν τὴν πορίαν
  choice: 命令加快行程
  rationale: πορία可指行程、赶路或行军；ἐποξύνειν在此指催促加速。“加快行程”简洁且适合上下文。
- source_word: ἀπὸ τοῦ ἅρματος φερομένου ῥοίζῳ
  choice: 飞驰的战车把他摔了下来
  rationale: ῥοίζῳ含快速并可能伴随呼啸声的运动意味；“飞驰”突出速度，同时以自然汉语表达从车上坠落。
- source_word: δυσχερεῖ πτώματι περιπεσόντα
  choice: 这一跤摔得很重
  rationale: δυσχερής在这里表示严重、猛烈；该译自然呈现坠落的惨重程度。
- source_word: πάντα τὰ μέλη τοῦ σώματος ἀποσφύζειν
  choice: 全身的肢体都脱了臼
  rationale: 罕见动词ἀποσφύζω在此似指肢体被猛烈扯松或脱离关节；“脱了臼”清楚表达可能的身体损伤，同时在脚注保留词义的不确定性。
theological_decisions:
- issue: 作者以两个近义的骄傲词语刻画安条克的道德状态
  choice: 分别译作“狂傲”和“骄傲”
  alternative: 两处都译作“傲慢”
  rationale: 希腊文使用ἀγερωχία与ὑπερηφανία两个相关但不同的名词，并形成递进。分别翻译可避免抹平修辞层次，也不额外引入教派性解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“喷吐怒火”保留原文生动的喷火意象；末句避免生硬照搬希腊语句法，以清晰的因果顺序呈现坠车、重摔和肢体受伤。脚注标记均置于相应词语之后。
