base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/005.yaml
  text: But the all-seeing Lord, the God of Israel, struck him with an incurable and unseen blow; and just as he finished speaking, an unrelenting pain in his bowels seized him, with bitter torments in his inner parts,
translation:
  language: zh_hans
  text: 但那洞察一切的主、以色列的上帝，以一种无法医治、肉眼看不见的灾祸击打他。[a]他刚说完话，一阵无法医治的内脏剧痛就袭上他身，体内有惨烈的折磨。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“打击、创伤”或“灾病”；希腊文 πληγή 可涵盖这些意思。
    reason: lexical_alternative
  - marker: b
    text: 较直译：“一种无法医治的内脏疼痛抓住了他，体内有惨烈的折磨。”
    reason: lexical_alternative
lexical_decisions:
- source_word: παντεπόπτης
  choice: 洞察一切的
  rationale: 该复合词指看见万有者。“洞察一切”既保留无所不见的含义，也以庄重自然的现代汉语修饰“主”。
- source_word: κύριος
  choice: 主
  rationale: 此处是神圣称号，并与“以色列的上帝”同位；译作“主”符合上下文及通行圣经用语。
- source_word: ἐπάταξεν
  choice: 击打
  rationale: 直接保留动词“击打”的力度和上帝主动施行审判的语法关系，不弱化为“容许患病”。
- source_word: ἀνιάτῳ
  choice: 无法医治的
  rationale: 准确表达不能治愈、无药可医的意思，且现代汉语清楚自然。
- source_word: ἀοράτῳ
  choice: 肉眼看不见的
  rationale: 表达该灾祸本身不可见，而其后果显现于身体；“肉眼看不见”比单说“无形”更明确。
- source_word: πληγῇ
  choice: 灾
  rationale: 该词可指击打、创伤或灾患。与“击打”搭配时译作“灾”，避免“用一击击打”的生硬重复，同时保留灾病式打击的开放性，并以脚注说明词义范围。
- source_word: ἄρτι ... καταλήξαντος τὸν λόγον
  choice: 他刚说完
  rationale: 简洁表达独立属格所标示的紧接时序：话才结束，痛苦便临到。
- source_word: ἔλαβεν αὐτόν
  choice: 突然……剧痛
  rationale: 原文意为疼痛抓住或袭取他；汉语以“突然剧痛”自然体现骤然发作，脚注保留“抓住他”的直译信息。
- source_word: ἀνήκεστος
  choice: 无法医治
  rationale: 基本意义是不可治愈、无法补救。虽与前面的ἀνιάτῳ形成重复，仍保留原文刻意重复，避免改成较弱的“持续不退”。
- source_word: τῶν σπλάγχνων ἀλγηδών
  choice: 腹中……剧痛
  rationale: σπλάγχνα指内脏、脏腑；此处译作“腹中”符合现代汉语身体表述，“剧痛”传达ἀλγηδών在语境中的强烈疼痛。
- source_word: πικραὶ τῶν ἔνδον βάσανοι
  choice: 体内也受到惨烈的折磨
  rationale: 保留“里面/体内”的身体指向，并以“惨烈”传达πικραί所形容的严酷痛苦。
theological_decisions:
- issue: 上帝在安条克所受灾病中的作用
  choice: 明确以上帝为“击打”他的直接主语
  alternative: 弱化为上帝容许他受灾或他自行患病
  rationale: 希腊文明确以“洞察一切的主、以色列的上帝”为ἐπάταξεν的主语，因此译文保留直接的神圣施动关系和审判张力。
- issue: παντεπόπτης所表达的神圣属性
  choice: 译作“洞察一切的”
  alternative: 译作“全知的”
  rationale: 原词直接强调“看见一切”，并非抽象陈述全部知识；译文保留视觉意象，不将其系统化为更宽泛的教义术语。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“洞察一切的主、以色列的上帝”保留原文同位结构；“腹中”“体内”避免过度医学化。“无法医治”在本节重复两次，是为对应希腊文两个近义形容词，并保留原文强调。
