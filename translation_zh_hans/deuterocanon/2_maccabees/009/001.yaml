  text: About that time Antiochus happened to be returning in disgrace from the regions around Persia[a].
translation:
  language: zh_hans
  text: 大约就在那时，安条克碰巧从波斯一带狼狈地返回[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“毫无秩序地返回”或“不体面地返回”；希腊文副词既可表示混乱，也可含受辱或失体面的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν ἐκεῖνον
  choice: 大约就在那时
  rationale: περὶ加时间宾格表示约略时间；δέ承接叙事。“大约就在那时”既保留近似意味，也自然体现叙事过渡。
- source_word: ἐτύγχανεν
  choice: 碰巧
  rationale: 保留动词所表达的偶合、附带情境意味，而不简化为单纯的“正在”。
- source_word: Ἀντίοχος
  choice: 安条克
  rationale: 采用现代中文圣经及历史文献中通行的人名译法。
- source_word: ἀναλελυκὼς
  choice: 返回
  rationale: 此处完成分词按上下文指安条克从波斯地区回来；“返回”简洁自然，并保留行程方向。
- source_word: ἀκόσμως
  choice: 狼狈地
  rationale: 该副词可指无秩序、不体面或可耻的方式；“狼狈地”在中文中能兼顾混乱与受辱的语感，同时以脚注保留其他可能。
- source_word: ἐκ τῶν περὶ τὴν Περσίδα τόπων
  choice: 从波斯一带
  rationale: 原文直指“波斯周围的各处”；“波斯一带”自然地保留了地域范围宽泛、不精确的特点。
