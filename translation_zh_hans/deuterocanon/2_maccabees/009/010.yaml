revisions:
- from: 那不久前还仿佛能触及天上众星的人[a]，如今因恶臭重得令人无法忍受，竟没有人能抬他。
  to: 那不久前还似乎能触及天上众星的人[a]，因那恶臭所带来的难以忍受的重负，谁也无法抬着他走。
  rationale: 修改臭气短语，使其符合现代汉语并保留 βάρος 的比喻性“重负”；删去未由原文明确表达的“如今”“竟”。其余关键意象、时序、人物指涉及 δοκοῦντα 的歧义处理均予保留。
