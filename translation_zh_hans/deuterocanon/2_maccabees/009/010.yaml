base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/010.yaml
  text: And no one was able to carry the man who a little earlier had seemed to touch the stars of heaven[a], because of the unbearable burden of the stench.
translation:
  language: zh_hans
  text: 那不久前还似乎能触及天上众星的人[a]，因那恶臭所带来的难以忍受的重负，谁也无法抬着他走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“还自以为能触及天上众星。”希腊文既可表示他看似高高在上，也可表示他狂妄地自视甚高。
    reason: 保留 δοκοῦντα 在外在观感与主观自负之间的词义可能。
lexical_decisions:
- source_word: τὸν ... δοκοῦντα
  choice: 那……还仿佛……的人
  rationale: 带冠词的分词在此作名词用，指安提阿古；“仿佛”保留 δοκέω 可表示外在观感或主观自负的含混性。
- source_word: μικρῷ πρότερον
  choice: 不久前
  rationale: 自然表达较近的过去时间，也保留原文前后处境骤变的反差。
- source_word: τῶν οὐρανίων ἄστρων
  choice: 天上众星
  rationale: 忠实呈现天体意象，措辞自然而庄重。
- source_word: ἅπτεσθαι
  choice: 触及
  rationale: 保留“触碰、够到”的本义及夸张意象；“触及”比“触摸”更适合此处高远的修辞语境。
- source_word: παρακομίζειν
  choice: 抬他
  rationale: 该动词表示把人带运、抬送到别处；结合病人无法自行行动的语境，“抬”比泛泛的“运送”更具体自然。
- source_word: διὰ τὸ τῆς ὀσμῆς ἀφόρητον βάρος
  choice: 因恶臭重得令人无法忍受
  rationale: 以汉语可理解的拟重表达保留 βάρος“重量、重压”的比喻，而不将其完全弱化为“恶臭令人无法忍受”。
theological_decisions:
- issue: 对安提阿古先前狂妄高升的夸张描述
  choice: 还仿佛能触及天上众星
  alternative: 还自以为能触及天上众星
  rationale: δοκοῦντα 加不定式既可指在旁人看来仿佛如此，也可含本人自以为如此；正文不把这一张力限定为纯粹的主观狂妄，脚注说明另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“如今”虽为语篇补足，并不增加新事件，用来清楚呈现“不久前”与当前惨状之间的讽刺性反差；句末“竟”也强化原文语境中的骤降反差。
