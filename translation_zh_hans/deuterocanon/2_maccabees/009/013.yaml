base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/013.yaml
  text: 'But the polluted man kept praying to the Master who would no longer have mercy on him[b][a], saying this:'
translation:
  language: zh_hans
  text: 可是，这个污秽的人[a]仍不断地向那位不再怜悯他的主宰[b]祷告，这样说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这个被玷污的人”。希腊语形容词含有强烈的道德或礼仪性污秽之意。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文为δεσπότης，强调绝对权柄；这里译作“主宰”，不同于通常译作“主”的κύριος。
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὔχετο
  choice: 仍不断……祈求
  rationale: 未完成时表达持续或反复进行的动作；“仍不断”也贴合上下文中他在苦难中继续祈求的语气。
- source_word: ὁ μιερὸς
  choice: 这个污秽的人
  rationale: 形容词作名词使用，指此人受到强烈的道德或礼仪性污秽；“污秽的人”保留其贬斥力度，避免弱化为泛泛的“可怜人”。
- source_word: δεσπότην
  choice: 主宰
  rationale: δεσπότης强调绝对权柄和支配地位，有别于通常译作“主”的κύριος；“主宰”在现代汉语中庄重自然，并保留这一词义区别。
- source_word: οὐκέτι
  choice: 不再
  rationale: 准确表达时间性的否定，即怜悯不会再临到他。
- source_word: ἐλεήσοντα
  choice: 怜悯
  rationale: 未来主动分词修饰“主宰”，与οὐκέτι合译为“不再怜悯他的”，保留叙述者对未来行动的表述。
- source_word: οὕτως λέγων
  choice: 这样说
  rationale: 自然引出下一节的直接引语，同时保留οὕτως“如此、这样”的明示语气。
theological_decisions:
- issue: 称呼上帝的δεσπότης如何译出
  choice: 主宰
  alternative: 主；统治者
  rationale: 原文特意使用δεσπότης而非κύριος，重点在绝对权柄。译作“主宰”既适合指上帝，也不抹去两个希腊称号之间的词义差异。
- issue: “不再怜悯他”是叙述判断还是祈祷者的认识
  choice: 保留为修饰“主宰”的叙述性陈述
  alternative: 译成“他以为还会怜悯他的主宰”或其他主观化表达
  rationale: 希腊文直接称主宰为οὐκέτι αὐτὸν ἐλεήσοντα，即“将不再怜悯他的那一位”，没有把这一判断限定为安条克的主观想法；因此不应替原文缓和或改写其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“可是”承接前文转折；“仍不断……祈求”呈现未完成时的持续性。“污秽的人”保留原文强烈的道德—礼仪贬义，“主宰”则凸显δεσπότης的权柄色彩。
