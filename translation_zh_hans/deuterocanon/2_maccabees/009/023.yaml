  yaml_path: translation/deuterocanon/2_maccabees/009/023.yaml
  text: And seeing that my father[a], whenever he campaigned in the upper regions, appointed the one who would succeed him,
translation:
  language: zh_hans
  text: 我考虑到，我父亲每逢前往上方地区出征[a]，都会指定他的继任者，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出征”或译“驻扎”。希腊词较直译为“安营”，在这里也可泛指进行军事行动。
    reason: 保留ἐστρατοπέδευσεν在具体驻营与较广军事行动之间的词义幅度。
lexical_decisions:
- source_word: θεωρῶν
  choice: 想到
  rationale: 该分词引出说话者作出安排的依据；“想到”在现代汉语中自然地表达“鉴于、考虑到”的因果意味。
- source_word: ὁ πατήρ
  choice: 我父亲
  rationale: 定冠词在此结合上下文表达所属关系，所指是说话者的亲生父亲；补出“我”可使汉语指代清楚。
- source_word: καθʼ οὓς καιρούς
  choice: 每逢
  rationale: 原短语可表示在若干相应时机发生的情况；“每逢”简洁保留其反复、分配意味。
- source_word: εἰς τοὺς ἄνω τόπους
  choice: 到上方地区
  rationale: 保留ἄνω的相对空间表达，不武断限定为内陆、高地或某个特定地理区域。
- source_word: ἐστρατοπέδευσεν
  choice: 出征
  rationale: 该动词本义可指安营驻扎，但在君王前往外地开展军事行动的语境中，“出征”更自然，也保留较广的军事含义。
- source_word: ἀνέδειξεν
  choice: 指定
  rationale: 这里指正式选定或宣布继任者；“指定”准确而不过度强化其法律或礼仪形式。
- source_word: τὸν διαδεξάμενον
  choice: 接替他的人
  rationale: 以动词性表达保留分词“随后接任”的含义，并明确接替对象是父亲。
