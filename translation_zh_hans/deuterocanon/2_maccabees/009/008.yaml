  - severity: low
    issue: 脚注对πίστις的释义次序及确定性可更审慎。
    rationale: 现存文本确有重复，但πίστις在此不能可靠地确定为‘信实’或‘信心’。脚注应先如实呈现重复，并说明其可能为抄写重复或文本讹误。
