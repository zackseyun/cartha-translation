base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/008.yaml
  text: But the one who had thought[a], in his arrogance over men, to command even the waves of the sea, and imagined that he could weigh out the heights of the mountains on a scale, was brought down to the ground and carried in a litter[b], plainly showing to all the power of God.
translation:
  language: zh_hans
  text: 可是，这人因狂妄自大，以为自己高过世人，竟敢与海浪抗衡，又以为能用天平衡量群山的高度；到头来，他却落到地上，被人用担架抬着，向所有人清楚显明了上帝的大能。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本在“大能”之前重复出现“信心（或：信实）”一词，直译近似“上帝的信心（或信实）、信心（或信实）、大能”。这可能是抄写重复或文本讹误；正文依本句清楚可辨的意思译出。
    reason: textual_variant
lexical_decisions:
- source_word: ἀντιδοκῶν τοῖς τῆς θαλάσσης κύμασιν
  choice: 竟敢与海浪抗衡
  rationale: ἀντιδοκῶν含有自以为能够对抗或匹敌之意；与海浪搭配时，“与海浪抗衡”既保留其狂妄的自我估量，也比直接译作“命令海浪”更贴近希腊文本。
- source_word: διὰ τὴν ὑπὲρ ἀνθρώπων ὑπερηφανίαν
  choice: 因狂妄自大，以为自己高过世人
  rationale: 将διὰ表达为原因，并保留ὑπὲρ ἀνθρώπων所含自居于众人之上的意味；“世人”在现代汉语中自然地泛指人类。
- source_word: πλάστιγγι τῶν ὀρέων οἰόμενος ὕψη στήσειν
  choice: 以为能用天平衡量群山的高度
  rationale: πλάστιγγι指天平或秤；στήσειν在称量语境中表示确定、衡量。译文保留以天平量山之高的夸张意象。
- source_word: κατὰ γῆν γενόμενος
  choice: 到头来，他却倒在地上
  rationale: 此语既描写身体落到地上的卑微处境，也与前文自命高大的姿态形成反讽。“到头来……却”明确呈现上下文中的转折，而不把它处理成单纯的空间描述。
- source_word: ἐν φορίᾳ παρεκομίζετο
  choice: 被人用担架抬着
  rationale: φορία是用来抬送病弱者的承载器具。“担架”是普通现代读者最容易理解的对应词，也保留了他已无力自行行动的含义。
- source_word: φανερὰν τοῦ θεοῦ ... τὴν δύναμιν ἐνδεικνύμενος
  choice: 向所有人清楚显明了上帝的大能
  rationale: 保留公开显明和“所有人”的范围；“上帝的大能”传达该句在现存文本异常之外仍清晰可辨的核心意思。
theological_decisions:
- issue: 如何处理ὑπὲρ ἀνθρώπων所指的对象
  choice: 以为自己高过世人
  alternative: 对人狂妄／高过男人
  rationale: ἀνθρώπων在这里泛指人类，并非只指男性；译作“世人”既准确表达其普遍范围，也保留安提阿古自居于全人类之上的傲慢。
- issue: 如何处理末句重复的τὴν πίστιν τὴν πίστιν
  choice: 正文按清楚可辨的句意译作“上帝的大能”，并用脚注记录文本异常
  alternative: 在正文中译入“信实、信实”或“信心、信心”
  rationale: 所给希腊文本在δύναμιν之前异常地重复πίστιν，句法和语义均不顺，可能是抄写重复或文本讹误。若强行译入正文，会制造来源不明的神学断言；脚注则能如实保留文本证据和不确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“狂妄自大”“与海浪抗衡”“用天平衡量群山的高度”保留原文的夸张和反讽；“担架”虽较现代，却比“肩舆”等词更易懂，也符合病弱者被抬送的语境。
