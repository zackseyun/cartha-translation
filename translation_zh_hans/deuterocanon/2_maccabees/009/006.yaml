  text: very justly[b][a], he who had tortured the inward parts of others with many and foreign afflictions.
translation:
  language: zh_hans
  text: 这实在是公正的：他曾以许多异乎寻常的苦难[b]折磨别人的内脏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内脏”也可译作“脏腑”或“内部器官”。希腊原文具体指身体内部，并非仅指情感或内心。
    reason: lexical_alternative
  - marker: b
    text: “异乎寻常的苦难”也可译作“奇异的灾祸”。相应的希腊词可表示陌生、奇特或异常。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: 这实在是公正的
  rationale: πάνυ加强δικαίως的语气；“实在”保留强调，“公正”明确表达原文对所受报应的道德判断，同时不另加解释。
- source_word: σπλάγχνα
  choice: 内脏
  rationale: 该词在此具体指身体内部的器官或脏腑；酷刑语境要求保留其身体性，不宜弱化为“内心”或“感受”。
- source_word: βασανίσαντα
  choice: 曾……折磨
  rationale: 该分词表示严酷的折磨或拷打；“曾”体现其相对于当前报应的先行性，“折磨”在现代汉语中自然且力度恰当。
- source_word: πολλαῖς καὶ ξενίζουσαις συμφοραῖς
  choice: 用种种异乎寻常的苦难
  rationale: πολλαῖς表示众多，译作“种种”；συμφοραῖς在此指加诸人的痛苦或灾难；ξενίζουσαις带有陌生、奇特、异常之意，“异乎寻常”既保留语义幅度，也避免“外国的”在汉语中的误解。
- source_word: τὸν ... βασανίσαντα
  choice: 他曾……折磨
  rationale: 带冠词的分词短语指“那个曾折磨……的人”，并与上文所指对象同位。汉语改用分句承接，使残句独立可读而不改变指称。
theological_decisions:
- issue: 安条克所受痛苦的道德评价
  choice: “这实在是公正的”明确保留原文将其遭遇视为公正报应的判断。
  alternative: 可译为“这完全是他应得的”，但会更直接地解释报应关系。
  rationale: 希腊文πάνυ δικαίως明确作出公正性的评价；正文应保留这一神学与道德张力，却不进一步说明惩罚机制或施罚者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“内脏”刻意保留原文具体而强烈的身体意象；用冒号连接公正评价与其缘由，使希腊文的同位分词结构在汉语中清楚自然。脚注标记均紧随对应词语。
