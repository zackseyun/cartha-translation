  yaml_path: translation/deuterocanon/2_maccabees/009/011.yaml
  text: Then the great extent of his arrogance began to come to an end[a], shattered, and to come to recognition under a divine scourge[b],
translation:
  language: zh_hans
  text: 于是，他被击垮后，他那极大的狂傲开始止息[a]，也开始在上帝的鞭笞下有所认识[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他那大部分的狂傲开始止息。”希腊语短语可指狂傲的巨大程度，也可指其大部分。
    reason: lexical_alternative
  - marker: b
    text: 或译：“开始有所认识”或“开始明白过来”。希腊语本身并不一定表示更强意义上的“悔改”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνταῦθα οὖν
  choice: 这时
  rationale: 标明叙事的转折点，并以自然的现代汉语兼顾顺承和推论语气。
- source_word: ἤρξατο
  choice: 开始
  rationale: 保留起始体意义，并使其自然地支配“消退”和“有所醒悟”两个进程。
- source_word: τὸ πολὺ τῆς ὑπερηφανίας
  choice: 满腔的狂傲
  rationale: τὸ πολὺ 表示程度、分量或大量；“满腔”以简洁自然的汉语表达其强烈程度，而“狂傲”符合上下文中目中无人、敌挡上帝的意味。
- source_word: λήγειν
  choice: 消退
  rationale: 表达停止、告终的渐进过程，也与“开始”搭配自然。
- source_word: τεθραυσμένος
  choice: 被击垮了
  rationale: 保留完成被动分词所表达的受创后状态，并兼容上下文中的身体与精神崩溃。
- source_word: εἰς ἐπίγνωσιν ἔρχεσθαι
  choice: 开始有所醒悟
  rationale: 表达逐渐获得认识或明白过来，但不直接译作“悔改”，以免超出希腊文所明确陈述的范围。
- source_word: θείᾳ μάστιγι
  choice: 在上帝的鞭打下
  rationale: 保留 μάστιξ 的鞭打意象和神圣审判的力度，不将其直接解释为某一种具体病痛或刑罚。
theological_decisions:
- issue: 本节是否表明安提阿古已经真诚悔改
  choice: 译为“有所醒悟”，仅说明他在审判下开始有了认识
  alternative: 译为“悔改”或“获得完全的属灵认识”
  rationale: εἰς ἐπίγνωσιν ἔρχεσθαι 本身表示进入认识、领悟或确认，并不必然等同于悔改；译文保留他究竟是真诚回转还是被迫承认现实的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“满腔的狂傲”传达原文较为特殊的程度表达；“上帝的鞭打”保留审判隐喻；两个脚注标记均已置入正文。
