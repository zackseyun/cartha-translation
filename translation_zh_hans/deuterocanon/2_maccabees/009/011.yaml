  rationale: 修订使“被击垮”的既成状态与后面两个由“开始”统摄的过程相连，并将原文的并列关系清楚表达出来。脚注a改为明确说明τὸ πολὺ的两种可行理解；脚注b保留原有的神学克制，不把认识等同于悔改。
