  text: For I am convinced that[a], if he is guided by my purpose with fairness and humanity, he will deal with you accordingly.
translation:
  language: zh_hans
  text: 因为我深信，他既已以宽厚仁慈的态度认同我的意愿[a]，也会以同样的态度对待你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“认同我的意愿”的希腊语分词较为简略，也可理解为“受我的意愿引导”或“形成与我的意愿一致的态度”。原文没有明说这种关系是条件、原因还是既成状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: 我深信
  rationale: 该词为完成时中间／被动形态，表达已经形成并持续的坚定确信；“我深信”自然地传达这种确定语气。
- source_word: ἐπιεικῶς
  choice: 以宽厚……的态度
  rationale: 该副词包含通情达理、公允、宽容温和等意味；“宽厚”在现代汉语中既自然，也不把词义限缩为单纯的柔和。
- source_word: φιλανθρώπως
  choice: 以……仁慈的态度
  rationale: 该副词表示以善意、人道而亲切的方式待人；“仁慈”与“宽厚”并列顺畅，保留其关怀人的伦理色彩。
- source_word: συνσταθέντα
  choice: 相合
  rationale: 该分词结构紧缩，结合与格短语可表示被置于一致状态、形成相应态度或受到引导；正文用“相合”保留与说话者意愿一致的核心关系，并以脚注说明其他可能理解。
- source_word: τῇ ἐμῇ προαιρέσει
  choice: 与我的意愿
  rationale: προαίρεσις指经过选择而形成的意向、目的或方针；“意愿”适合书信中的个人表述，同时避免过度制度化为“政策”。
- source_word: συνπεριενεχθήσεσθαι
  choice: 也会照样对待你们
  rationale: 该将来时复合动词指以相应方式对某人行事；“照样对待你们”表达其关系指向，并以“也”体现复合词所含的相应、共同意味。
