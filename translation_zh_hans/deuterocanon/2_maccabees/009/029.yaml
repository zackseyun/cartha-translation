  text: But Philip[a], his companion, was carrying the body; and, because he feared Antiochus’s son[b], he went over to Ptolemy Philometor in Egypt.
translation:
  language: zh_hans
  text: 但腓力，他的同伴[a]，正运送遗体；他因惧怕安条克的儿子，便转往[b]埃及，到托勒密·非罗米托那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “同伴”也可指与他一同长大的人，即亲近的宫廷伙伴或自幼相伴者。
    reason: lexical_alternative
  - marker: b
    text: 或较形式地译作：“被送到埃及的托勒密·非罗米托那里。”希腊语动词 διεκομίσθη 在形式上是被动语态，可理解为被转移或被送往。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκομίζετο
  choice: 将……运走
  rationale: 该未完成时形式描写运送遗体这一持续进行的行动；“运走”自然简明，也不增添原文没有明说的目的地。
- source_word: τὸ σῶμα
  choice: 遗体
  rationale: 原文直译为“身体”，语境明确指已死之王的身体；现代汉语用“遗体”庄重自然，又不带“尸体”可能具有的生硬色彩。
- source_word: σύντροφος
  choice: 同伴
  rationale: 此词可泛指相伴之人，也可能特指自幼一同长大的亲近宫廷伙伴；正文采用较宽泛的“同伴”，以免过度确定其身份，并用脚注保留较具体的可能含义。
- source_word: εὐλαβηθεὶς
  choice: 因惧怕
  rationale: 分词在句中说明腓力转往埃及的动机，可表达害怕或戒惧；“因惧怕”清楚保留其因果作用。
- source_word: τὸν υἱὸν Ἀντιόχου
  choice: 安条克的儿子
  rationale: 依原文直译亲属关系，不把他解释为“继承人”或加入姓名。
- source_word: πρὸς Πτολεμαῖον τὸν Φιλομήτορα
  choice: 投奔托勒密·非罗米托
  rationale: πρός在移动语境中表示前往此人那里；“投奔”结合因惧怕而转移的上下文，表达进入其庇护或势力范围，但不进一步说明政治安排。
- source_word: διεκομίσθη
  choice: 转往
  rationale: 该词形式上是被动，核心含义是被转移、被送往；“转往”在汉语中自然表达地点转移，同时以脚注保留形式上的被动读法。
