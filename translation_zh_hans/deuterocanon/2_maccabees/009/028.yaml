base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/028.yaml
  text: So then the murderer and blasphemer[a], after suffering the worst things, just as he had treated others, came to a most pitiable end in a foreign land among the mountains.
translation:
  language: zh_hans
  text: 这样，这个杀人者和亵渎者遭受了最惨重的苦难，正如他从前怎样对待别人一样；最后，他在异乡的群山中落得一个极其可悲的下场。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文见证在换行处截于 κατέ-；句意显然在下文接续，表示他来到结局或死亡。本译文据此译出完整句意。
    reason: textual_variant
lexical_decisions:
- source_word: ἀνδροφόνος
  choice: 杀人者
  rationale: 该复合词指杀害人的人；“杀人者”既保留强烈的道德谴责，也比带有特定现代法律含义的用语更贴近原文。
- source_word: βλάσφημος
  choice: 亵渎者
  rationale: 上下文涉及安提阿古对上帝的不敬言行，“亵渎者”保留了该词在此处的宗教意味。
- source_word: τὰ χείριστα παθών
  choice: 在遭受了最惨重的苦难之后
  rationale: “最惨重”体现 χείριστα 的最高级力度，同时用自然的汉语表达分词短语的先时关系。
- source_word: ὡς ἑτέρους διέθηκεν
  choice: 正如他从前怎样对待别人一样
  rationale: 保留原文报应相称的比较关系；“对待”不额外限定他加害别人的具体方式。
- source_word: ἐπὶ ξένης
  choice: 在异乡
  rationale: 简洁表达身处本国之外、客死他乡的意味，并保留原文的悲剧色彩。
- source_word: ἐν τοῖς ὄρεσιν
  choice: 在……群山中
  rationale: 准确表达 ἐν 加与格的地点含义；“群山中”是自然、庄重的现代汉语。
- source_word: οἰκτίστῳ μόρῳ
  choice: 以最可悲的结局
  rationale: οἰκτίστῳ 是最高级，μόρος 可指厄运、死亡或结局；此译保留“令人怜悯”的评价和死亡结局，而不将其缩减为单纯的“死”。
- source_word: κατέ-
  choice: 结束了生命
  rationale: 所给见证在换行处截于 κατέ-；结合句法与已知续文，该动词短语表示结束生命。译文表达连续文本的明确语意，并用脚注说明所给引文的截断情况。
theological_decisions:
- issue: 安提阿古之死的报应性表述
  choice: 明确保留“正如他从前怎样对待别人一样”的对应关系
  alternative: 只叙述他遭受苦难并死亡，不强调与他加害别人的方式相称
  rationale: ὡς ἑτέρους διέθηκεν 明确把他的苦难与他从前对待别人的方式相比较；保留这一张力，既不削弱原文的审判意味，也不添加原文没有说明的神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“杀人者和亵渎者”保留原文并列的强烈定性；破折号使报应性的插入比较在汉语中层次清楚。脚注标记置于相关整句末尾。
