base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/002.yaml
  text: For he had entered the so-called Persepolis and attempted to rob the temple and seize control of the city[a]; therefore, when the crowds rushed to arms, they turned him back, and it happened that Antiochus, put to flight by the local inhabitants[b], made a shameful retreat.
translation:
  language: zh_hans
  text: 因为他先前进入了那座称为波斯波利斯的城，企图劫掠圣所并控制那城；于是民众冲上前去，拿起武器抵抗。安条克被当地居民击退，蒙羞撤军。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσεληλύθει
  choice: 先前进了
  rationale: 该词为过去完成时，表示此事发生在随后企图劫掠和控制城市之前；“先前”自然体现这一先行动作。
- source_word: τὴν λεγομένην Περσέπολιν
  choice: 那称为波斯波利斯的城
  rationale: 保留 λεγομένην“称为”的明示成分，同时避免现代汉语“所谓”可能带出的质疑或贬义。
- source_word: ἐπεχείρησεν
  choice: 企图
  rationale: 清楚表明行动只是尝试，不暗示已经得逞。
- source_word: ἱεροσυλεῖν
  choice: 劫掠圣所
  rationale: 该动词特指劫掠神圣场所；“圣所”保留对象的神圣性质，“劫掠”也符合军事语境。
- source_word: συνέχειν
  choice: 控制全城
  rationale: 在此军事政治语境中表示取得并维持对城市的控制；“全城”自然呈现冠词所指的这座城。
- source_word: τῶν πληθῶν ὁρμησάντων
  choice: 民众冲上前去
  rationale: 以时间关系处理属格独立结构，并保留 ὁρμάω 所表达的迅猛行动。
- source_word: ἐπὶ τὴν τῶν ὅπλων βοήθειαν ἐτράπησαν
  choice: 拿起武器抵抗
  rationale: 原文较直译为“转而求助于武器”；此译以自然汉语表达民众诉诸武装防卫，且不把 ἐτράπησαν 误解为他们被击退。
- source_word: τροπωθέντα
  choice: 被……击退
  rationale: 这是军事上的败退或溃退；“击退”与上下文的武装抵抗和撤军衔接自然。
- source_word: τῶν ἐγχωρίων
  choice: 当地居民
  rationale: 准确指当地人，并避免“土著”等词在现代语境中的额外含义。
- source_word: αἰσχύμονα τὴν ἀναζυγὴν ποιήσασθαι
  choice: 只得蒙羞撤军
  rationale: 兼顾撤离军队的行动和耻辱意味；“只得”自然传达战败后被迫撤退的语境结果。
