base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/026.yaml
  text: Therefore I urge you and ask you, remembering the benefits shown both publicly and privately, each of you to maintain the goodwill that now exists toward me and my son.
translation:
  language: zh_hans
  text: 所以，我劝告并请求你们：要记念那些无论公开还是私下所施的恩惠，并且各人都维持你们现今对我和我儿子的善意。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλῶ ... καὶ ἀξιῶ
  choice: 我劝勉并恳请你们
  rationale: 保留两个并列动词的郑重语气；“恳请”体现ἀξιῶ在此处提出郑重请求的用法，而不生硬译作“认为配得”。
- source_word: τῶν εὐεργεσιῶν
  choice: 所施的恩惠
  rationale: 指已经给予的好处或善待；结合书信说话者，用“我向……所施”补出汉语中自然需要的施予者。
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: 向大家和各人
  rationale: 分别表达公共层面与私人、个别层面，简洁保留两者的对举。
- source_word: συντηρεῖν
  choice: 继续保持
  rationale: 表达维持、保存既有状态之意，并与后面的“目前”相呼应。
- source_word: τὴν οὖσαν εὔνοιαν
  choice: 目前……的善意
  rationale: οὖσαν表示现有、当前存在；εὔνοια译为“善意”，不强化为政治性的“忠诚”。
