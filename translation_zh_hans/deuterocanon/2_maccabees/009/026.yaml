- from: 所以，我劝勉并恳请你们：要记得我向大家和各人所施的恩惠，每个人都要继续保持目前对我和我儿子的善意。
  to: 所以，我劝告并请求你们：要记念那些无论公开还是私下所施的恩惠，并且各人都维持你们现今对我和我儿子的善意。
