base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/025.yaml
  text: Moreover[a], considering the rulers nearby and those bordering the kingdom, who are watching for opportunities and awaiting what will happen, I have appointed my son Antiochus as king, whom, when I repeatedly went up to the upper satrapies, I often entrusted and commended to most of you[b]. And I have written to him the things written below.
translation:
  language: zh_hans
  text: 此外，我考虑到那些邻近并与王国接壤的统治者[a]，正在伺机，等着看事态将如何发展，便已立我儿安条克为王。我屡次前往上部总督辖区[b]时，常把他托付给你们中大多数人，并向你们举荐他。我也写信给他，内容如下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“邻近的统治者，以及与王国接壤的人”。希腊文连续使用两个意思相近的地缘描述，着重强调王国周围的势力。
    reason: lexical_alternative
  - marker: b
    text: “总督辖区”原文使用波斯行政建制的名称；“上部”可能泛指内陆或东部地区，并非泛指一般的“行省”。
    reason: cultural_note
lexical_decisions:
- source_word: κατανοῶν
  choice: 考虑到
  rationale: 该分词说明安条克采取继承安排的理由；“考虑到”既表达审慎评估，也自然引出后文。
- source_word: τοὺς παρακειμένους δυνάστας καὶ γειτνιῶντας τῆς βασιλείας
  choice: 那些邻近并与王国接壤的统治者
  rationale: δυνάστας指实际掌权的政治统治者；两个空间性表达叠加，强调王国周边势力，译文保留这种重复强化。
- source_word: τοῖς καιροῖς ἐπέχοντας
  choice: 正在伺机
  rationale: καιρός可指适当或有利的时机，ἐπέχω在这里表示密切留意、等待时机；“伺机”简洁传达政治上的警觉与机会意识，又未明说他们必然采取何种行动。
- source_word: προσδοκῶντας τὸ ἀποβησόμενον
  choice: 等着看事态将如何发展
  rationale: 保留对未来结果的开放期待，不预先界定具体结局。
- source_word: ἀναδέδειχα
  choice: 已立
  rationale: 在王位继承语境中表示正式指定为王；“立……为王”符合现代汉语的庄重政治语体。
- source_word: ἀνατρέχων εἰς τὰς ἄνω σατραπίας
  choice: 我屡次前往上部总督辖区时
  rationale: “屡次”体现动作的反复性；“总督辖区”保留σατραπία所指的波斯行政建制，而“上部”直译ἄνω。
- source_word: παρεκατετίθεμην καὶ συνίστων
  choice: 曾把他托付给……并向……举荐他
  rationale: 分别表达交托照管与正式推荐，避免把两个并列动词合并为同一意思。
- source_word: τὰ ὑπογεγραμμένα
  choice: 以下这些话
  rationale: 自然表达文书中紧接在下的内容，同时保留其指向下文的功能。
