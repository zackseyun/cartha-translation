  text: so that[a], if anything unexpected should happen and some difficulty should arise, those in the country, knowing to whom the affairs have been entrusted, may not be thrown into confusion;
translation:
  language: zh_hans
  text: 好叫境内的人在发生任何意外、出现什么难处时，因知道政务已交给谁，就不致陷入混乱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: 这样……就
  rationale: 引出目的；用现代汉语的“这样……就”自然表达其目的关系，并承接上文。
- source_word: ἐάν τι παράδοξον ἀποβῇ
  choice: 一旦发生什么意外
  rationale: παράδοξον 指出乎预料之事；ἀποβῇ 在此宜按事件发生来表达。“一旦”保留不确定条件，又符合诏书语境。
- source_word: προσπέλθῃ τι δυσχερές
  choice: 遇到什么难处
  rationale: δυσχερές 可指困难、棘手或令人苦恼之事；此译自然，并与前一条件短语形成并列。
- source_word: εἰδότες
  choice: 知道
  rationale: 保留分词所表达的伴随或原因关系，同时避免生硬的汉语分词结构。
- source_word: οἱ κατὰ τὴν χώραν
  choice: 境内的人
  rationale: χώρα 在此泛指所辖疆域；“境内的人”比“省内的人”宽泛，也适合政治语境。
- source_word: ᾧ καταλέλειπται τὰ πράγματα
  choice: 政务已交给谁
  rationale: τὰ πράγματα 在王位安排的语境中指国家事务或政务；καταλέλειπται 的完成时被动态表示这些事务已经留交某人，但“交给”本身不强行判定是普通留置还是正式委托。
- source_word: μὴ ἐπιταράσσωνται
  choice: 不至于陷入混乱
  rationale: ἐπιταράσσω 表示受到强烈扰乱；“陷入混乱”兼顾民众不安与政治秩序受扰的含义。
