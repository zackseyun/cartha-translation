review_pass:
  verdict: revise
  source_fidelity: 草稿整体准确传达了目的、意外与困难的条件、境内之人的知情，以及避免混乱的结果。但“ 一旦”在现代汉语中较易表示事件一经发生即必然进入后果，弱化了ἐάν加虚拟式所表达的开放条件；并且“发生什么意外，遇到什么难处”使第二项看似由“境内的人”作主语，原文则并列说某种困难临到／出现。
  naturalness: 原译总体通顺，且有适合诏书语境的庄重感。改为“在……时”可清楚限定条件适用于“境内的人”，以“出现什么难处”保持与“发生任何意外”的并列，也更自然。
  terminology: “境内的人”“政务”“陷入混乱”均适切。“已交给谁”忠实保留了完成时被动语态及受托者未指明的表达；脚注也恰当地说明“留下”与“正式托付”两种可保留的词义侧面。
