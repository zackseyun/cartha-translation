base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/018.yaml
  text: 'But when his pains had somewhat let up[a], for the just judgment of God had come upon him, and when he recognized his own condition, he wrote to the Jews the letter written below, having the character of a petition[c][b], and reading as follows:'
translation:
  language: zh_hans
  text: 当他的痛苦稍有缓解[a]时——因为上帝公正的审判已经临到他——他认清了自己的处境[b]，便给犹太人写了下面这封带有恳求意味[c]的信，内容如下：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给希腊文本中的罕见副词 ἰουδαϊσμῶς 语义难以确定。此处随 ληγόντων（“正在缓解、止息”）修饰痛苦，故译作“稍有”；也可译为“有所”或“稍稍”。
    reason: textual_and_lexical_difficulty
  - marker: b
    text: 直译：“他认清了有关他自己的事。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“具有恳求的形式。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰουδαϊσμῶς δὲ ληγόντων τῶν πόνων
  choice: 然而，他的痛苦丝毫没有减轻
  rationale: 所给文本中的 ἰουδαϊσμῶς 通常意为“以犹太人的方式”，置于此处修饰“痛苦减退”语意难通；本句上下文及常见文本传统所反映的否定语意，指痛苦并未减轻。正文采用符合句法脉络的译法，并以脚注说明所给读法的困难，避免把不确定的字面意义强加进正文。
- source_word: δικαία ἡ τοῦ θεοῦ κρίσις
  choice: 上帝公正的审判
  rationale: 保留 κρίσις 的司法性含义，并明确表达 δικαία 对这审判的道德评价。
- source_word: τὰ κατʼ αὐτὸν ἐπιγνούς
  choice: 他认清了自己的处境
  rationale: 这是对“认清有关他自己的事”的自然中文表达，既指他当时的境况，也不过度说明他内在悔改的程度。
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: 下面这封信
  rationale: ὑπογεγραμμένην 在此向下指向随后引录的信件；中文如此表达简洁自然。
- source_word: ἱκετηρίας τάξιν
  choice: 形式如同恳求
  rationale: τάξις 在此指信件的形式或性质，ἱκετηρία 指恳求、哀求；译文保留作者对该信文体特征的判断。
- source_word: περιέχουσαν δὲ οὕτως
  choice: 内容如下
  rationale: 采用现代中文引出信件正文的惯用语。
theological_decisions:
- issue: 安条克所受痛苦与上帝审判的关系
  choice: 明确译为“上帝公正的审判已经临到他”
  alternative: 较弱地译为“他遭遇了被视为来自上帝的审判”
  rationale: 希腊文直接断言上帝公正的审判临到他，并非仅报道人物的主观看法；译文保留这一神学判断。
- issue: “认清自己的处境”是否等于悔改
  choice: 不把该短语译成“悔改”
  alternative: 译作“他悔悟了”
  rationale: ἐπιγνούς 表示认识、认清；本节并未单凭该词明确断言真正的内在悔改，因此保留叙事中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“临到他”“内容如下”保留经文体的分量，但避免过度古雅。正文按语境采用否定读法，同时在脚注公开所给希腊文本的异常及另一种理解。
