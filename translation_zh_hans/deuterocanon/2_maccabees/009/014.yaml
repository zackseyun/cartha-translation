  source_fidelity: 整体忠实呈现了圣城、他急切赶赴并意图夷平且建为多尸墓地，以及日后宣布其自由地位的对照。惟“埋葬众人的墓地”在现代汉语中容易理解为供所有人埋葬的普通墓地，未充分限定 πολυάνδριον 所指“许多死者的合葬墓地”。
  naturalness: 原译庄重流畅。“原本急赶着前去”可理解，但“先前正急着赶去”更自然地对应未完成体背景；补出“把它”也使“建成”所转换的对象更清楚。
  terminology: “圣城”与“自由城”均恰当。“自由城”保留城市自由地位的政治语义，而未擅自界定具体宪制。“夷为平地”准确。“埋葬许多死者的墓地”比“埋葬众人的墓地”更准确传达 πολυάνδριον。
