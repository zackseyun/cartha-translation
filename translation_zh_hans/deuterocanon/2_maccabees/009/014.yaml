  yaml_path: translation/deuterocanon/2_maccabees/009/014.yaml
  text: As for the holy city[a], which he had been hurrying to make level with the ground and to build into a mass grave, he will declare it free.
translation:
  language: zh_hans
  text: 至于圣城，他先前正急着赶去，要把它夷为平地，并把它建成一处埋葬许多死者的墓地[a]，却要宣布它为自由城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“合葬墓”或“多人共葬的墓地”。希腊词指安葬许多死者的坟墓或墓地。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἁγίαν πόλιν
  choice: 圣城
  rationale: ἁγίαν 表示“圣洁的、神圣的”；“圣城”是现代汉语中自然、庄重且符合经文语境的表达，所指为耶路撒冷。
- source_word: σπεύδων παρεγίνετο
  choice: 原本急赶着前去
  rationale: σπεύδων 表达急切、赶赴之意，παρεγίνετο 保留前去或来到的动态；合译可自然呈现他当时急速前往并怀有下述目的。
- source_word: ἰσόπεδον ποιῆσαι
  choice: 把它夷为平地
  rationale: 该短语意为使之与地面齐平、彻底铲平；“夷为平地”准确传达毁灭性的力度。
- source_word: πολυάνδριον
  choice: 埋葬众人的墓地
  rationale: 该词指安葬许多死者的坟墓或墓地。此译避免把“万人冢”误解为确指一万人，同时保留大规模死亡的阴惨意味。
- source_word: οἰκοδομῆσαι
  choice: 建成
  rationale: οἰκοδομέω 本义为建造；这里表示将被毁的城市建成或变作埋葬众人的墓地，译作“建成”保留了原文的建造用语。
- source_word: ἐλευθέραν ἀναδείξει
  choice: 将宣布它为自由城
  rationale: ἀναδείκνυμι 可表示公开宣布、确立某种身份或地位；“宣布……为”兼顾其公开宣告意味，且不把 ἐλευθέραν 过度具体化为某种后世政治制度。
theological_decisions:
- issue: 安条克对圣城之自由地位的承诺性质
  choice: 将宣布它为自由城
  alternative: 将使它获得自由；将宣布它自治
  rationale: 原文强调将来对圣城地位所作的公开宣告。“宣布”为 ἀναδείξει 保留宣告与确立之间的张力；“自由城”表达 ἐλευθέραν，却不擅自规定其具体宪制含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“原本……却将……”呈现他先前毁城的急切意图与后来承诺之间的强烈反转；不加入原文未明说的悔改动机或政治制度细节。
