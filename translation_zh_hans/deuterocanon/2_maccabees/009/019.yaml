  yaml_path: translation/deuterocanon/2_maccabees/009/019.yaml
  text: 'King Antiochus and general[a], to the good Jewish citizens: many greetings, and health[b], and prosperity.'
translation:
  language: zh_hans
  text: 安条克王和将军[a]，致善良的犹太公民：致以多多问候，并祝健康、顺遂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文把发信人的姓名和头衔放在问候语之后，按其语序可译为：“致善良的犹太公民……安条克王和将军。”这里按现代汉语书信习惯将其前置。
    reason: cultural_note
  - marker: b
    text: “顺遂”也可译作“安好”或“诸事顺利”；希腊语εὖ πράττειν意为“过得好”或“诸事顺利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς χρηστοῖς
  choice: 良善的
  rationale: χρηστός可指良善、仁厚或可敬；在正式称呼中译作“良善的”，既保留褒扬语气，也避免把含义限定为“仁慈”或“尊贵”。
- source_word: Ἰουδαίοις
  choice: 犹太
  rationale: 此处指犹太群体的民族—宗教身份，不宜仅按地域译为“犹太地的”。
- source_word: τοῖς πολίταις
  choice: 公民
  rationale: πολίτης的基本义为“公民”；这里是书信中对收信人的正式称谓。
- source_word: πολλὰ χαίρειν
  choice: 多多问候
  rationale: 这是希腊书信的惯用问候语；“多多问候”自然地体现πολλά的加强意味。
- source_word: ὑγιαίνειν
  choice: 祝你们健康
  rationale: 不定式在问候套语中表达祝愿；补出“祝你们”符合现代汉语书信表达。
- source_word: εὖ πράττειν
  choice: 顺遂
  rationale: 该短语本义为“过得好、诸事顺利”；“顺遂”兼顾生活安好与处境顺利，且不把含义过度收窄为物质繁荣。
- source_word: βασιλεὺς Ἀντίοχος καὶ στρατηγὸς
  choice: 国王安条克兼统帅
  rationale: 保留βασιλεύς与στρατηγός两个头衔，并用“兼”自然表达同一人物兼具两种身份；原文把署名与头衔置于问候语末，中文则前置以清楚呈现书信格式。
