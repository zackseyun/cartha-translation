base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/031.yaml
  text: After carefully stripping them of their arms[a], they put everything in the proper places, but they carried the rest of the spoils to Jerusalem.
translation:
  language: zh_hans
  text: 他们仔细收取了那些人的兵器[a]，把这一切都安放在合适的地方；其余的战利品则带到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从他们身上卸下兵器。”希腊语分词既可侧重从败者身上解除兵器，也可侧重把他们的兵器收集起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁπλολογήσαντες δὲ αὐτοὺς
  choice: 他们仔细收取了那些人的兵器
  rationale: 该分词由“兵器”一词构成，可指从败者身上取下或收集兵器；结合宾语 αὐτούς，译文保留“从那些人取得兵器”的具体关系，又不武断判定他们当时是否仍活着。
- source_word: ἐπιμελῶς
  choice: 仔细
  rationale: 表达留心、审慎地行动；“仔细”符合现代汉语习惯。
- source_word: πάντα συνέθηκαν
  choice: 把这一切都安放
  rationale: συντίθημι 在这里表示把所得之物放置起来；“安放”既比单纯“集合”贴合语境，也避免过度明确为长期储存。
- source_word: εἰς τοὺς ἐπικαίρους τόπους
  choice: 在合适的地方
  rationale: ἐπίκαιρος 可指合宜、适当或有利；上下文不足以确定是“战略要地”，故采用较宽而自然的“合适的地方”。
- source_word: τὰ δὲ λοιπὰ τῶν σκύλων
  choice: 其余的战利品则
  rationale: σκῦλα 是战争中夺得的物品，“战利品”准确且庄重；λοιπά 表示在已安放之物以外剩余的部分。
- source_word: ἤνεγκαν εἰς Ἰεροσόλυμα
  choice: 带到耶路撒冷
  rationale: 不定过去时 ἤνεγκαν 表示搬运或携带至某地；“带到”是自然、明确的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“那些人”承接前文所指的败军；“收取”保留原文在解除兵器与收集兵器之间的语义张力，并以脚注说明。
