base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/004.yaml
  text: and also to remember the lawless destruction of the innocent infants[a], and the blasphemies committed against his name[b], and to hate evil.
translation:
  language: zh_hans
  text: 也求他记念无辜婴孩所遭的不法残害[a]，以及针对他名的种种亵渎，并恨恶邪恶[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无罪的婴孩。”希腊语形容词字面意为“没有罪的”，此处很可能强调他们作为受害者是无辜的。
    reason: lexical_alternative
  - marker: b
    text: 或译：“痛恨恶事。”这里的希腊语动词十分少见，表达对邪恶的强烈憎恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: 记念
  rationale: 此处是不定式，与上下文的祈求事项相承；“记念”既自然庄重，也保留求上帝顾念并采取行动的经文语感。
- source_word: ἀναμαρτήτων
  choice: 无辜
  rationale: 字面义为“无罪的”，但在婴孩遭杀害的语境中，重点是他们作为受害者并无罪责；“无辜”避免把叙事修辞扩大为关于绝对无罪的教义断言。
- source_word: νηπίων
  choice: 婴孩
  rationale: 该词指年幼的孩子；“婴孩”比宽泛的“孩子”更贴近原词，也保留原文的悲怆力度。
- source_word: παρανόμου ἀπωλίας
  choice: 不法残害
  rationale: παράνομος强调违背律法与公义，ἀπώλεια在此指造成死亡的毁灭。“不法残害”在现代汉语中自然，并同时表达行为的非法与致命性质。
- source_word: βλασφημιῶν
  choice: 种种亵渎
  rationale: 因对象是上帝的名，此词宜取宗教意义的“亵渎”；复数用“种种”体现。
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: 针对他名的
  rationale: εἰς在敌对语境中表示言行所指向的对象；“针对他名”清楚表达亵渎是冲着他的名而来。
- source_word: μισοπνηρῆσαι
  choice: 恨恶邪恶
  rationale: 这个罕见动词表示对恶或邪恶怀有强烈憎恨；“恨恶邪恶”简洁、庄重，不额外加入原文未明说的起始或结果含义。
theological_decisions:
- issue: ἀναμαρτήτων是否译为绝对意义的“无罪”
  choice: 无辜婴孩
  alternative: 无罪的婴孩
  rationale: 原词字面可作“无罪”，但本句是在控诉婴孩作为受害者遭到不法毁灭。“无辜”保留其道德与司法语境中的无罪责，同时不替文本引入关于婴孩绝对无罪的系统教义结论。
- issue: “记念”的主语及其行动含义
  choice: 保留“求他记念”的祈求表达
  alternative: 扩展为“求他记住并为此施行报应”
  rationale: 希腊文只明说“记念”；虽在祈祷语境中可能含有求上帝采取行动之意，译文不把隐含结果写入正文。
- issue: μισοπνηρῆσαι的主语与语义方向
  choice: 并恨恶邪恶
  alternative: 并因此惩罚恶人
  rationale: 原词直接表达恨恶邪恶，并未明确说“惩罚恶人”。译文保留这一措辞及其可能的神学张力，不把态度解释成特定行动。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“所遭的不法残害”避免生硬直译为“不法的毁灭”；“种种亵渎”体现复数；全句保留与上文祈求结构相接的片段性质。
