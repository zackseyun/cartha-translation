  yaml_path: translation/deuterocanon/2_maccabees/008/006.yaml
  text: And coming upon cities and countryside unexpectedly[a], he would set them on fire; and by seizing strategic places, he put not a few of the enemies to flight,
translation:
  language: zh_hans
  text: 他出其不意地来到各城和乡间，便放火焚烧；又占据有利地点[a]，使不少敌人溃逃，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有利地点”或译“战略要地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλεις
  choice: 各城
  rationale: 指城市或城镇聚落；用“各城”既简洁，也符合古代叙事语境。
- source_word: χώρας
  choice: 乡间
  rationale: 这里与“各城”相对，主要指城外的乡村地区，而非现代政治意义上的国家。
- source_word: ἀπροσδοκήτως
  choice: 出其不意地
  rationale: 表达在对方未曾料到时来到，保留突袭般的意外性，又不把原文具体化为某种战术行动。
- source_word: ἐρχόμενος
  choice: 来到
  rationale: 忠实表达分词“前来、到达”的基本意义，并与后续动作自然衔接。
- source_word: ἐνεπίμπρα
  choice: 放火焚烧
  rationale: 该动词表示点火烧毁；这一译法清楚传达其使役、及物意味，同时不擅自补出原文省略的具体宾语。
- source_word: ἐπικαίρους τόπους
  choice: 有利地点
  rationale: ἐπικαίρους 在军事语境中指适时、有利或具有战术价值的地点；“有利地点”保留其较宽泛的含义。
- source_word: ἀπολαμβάνων
  choice: 占据
  rationale: 在地点作宾语时表示取得并控制，用“占据”符合军事语境。
- source_word: οὐκ ὀλίγους
  choice: 不少
  rationale: 保留原文“不少”的曲言表达，不直接改写为“许多”。
- source_word: τῶν πολεμίων
  choice: 敌人
  rationale: 现代汉语中“敌人”本身可作复数理解，无须另加生硬的复数标记。
- source_word: τροπούμενος
  choice: 使……溃逃
  rationale: 表达使敌军转身逃跑、败退的军事含义，比泛称“击败”更贴近原文。
