  yaml_path: translation/deuterocanon/2_maccabees/008/025.yaml
  text: But they took the money of those who had come to buy them. And after pursuing them for a considerable distance, they turned back from the region, being hemmed in,
translation:
  language: zh_hans
  text: 他们拿走了那些前来购买他们的人所带的钱。追赶他们相当远之后[a]，他们因受约束[b]，便从那地区撤回；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“追赶了相当长的一段时间”；希腊语短语既可表示较长的距离，也可表示较长的时间。
    reason: lexical_alternative
  - marker: b
    text: 这个分词也可译作“被困住”或“受到逼迫”。它可能说明他们为何撤回，但原文没有交代这种约束来自敌军、时间、地形，还是其他处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρήματα
  choice: 钱
  rationale: 这里指买奴者为购买预期俘虏所带来的款项；译作“钱”具体、自然。
- source_word: τῶν παραγενομένων ἐπὶ τὸν ἀγορασμὸν αὐτῶν
  choice: 那些前来购买他们之人的
  rationale: παραγενομένων表示“前来、到达”，ἀγορασμόν表示“购买”；αὐτῶν在上下文中指原被设想为俘虏出售的犹太人。
- source_word: συνδιώξαντες
  choice: 追赶敌人……之后
  rationale: 以时间性分词结构处理，表示他们继续或一同参与追击；补出“敌人”使汉语指代清楚。
- source_word: ἐφʼ ἱκανόν
  choice: 相当远
  rationale: 该短语表示达到相当的程度；在追赶和移动的语境中，空间义较合适，但也可能指相当长的时间。
- source_word: ἀνέλυον
  choice: 折返
  rationale: 在行军语境中可指离去、返回或停止前进；“折返”简洁表达追击后回转。
- source_word: ἀπὸ τῆς χώρας
  choice: 从那一带
  rationale: χώρα泛指一片地域；“那一带”符合现代汉语，也不额外设定政治疆域。
- source_word: συγκλειόμενοι
  choice: 因受到限制
  rationale: 该分词可表示被围困、受压迫或受制约；原文未说明限制的具体来源，采用较宽泛的表达以保留歧义。
