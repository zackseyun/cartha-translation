base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/029.yaml
  text: After doing these things[a], and making a common prayer of supplication[b], they begged the merciful Lord to be fully reconciled to his servants.
translation:
  language: zh_hans
  text: 他们完成这些事后，一同献上恳求的祷告，祈求仁慈的主与他的仆人完全和好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完全和好”也可译作“彻底和好”或“最终和好”；原文短语既可强调和好的完全，也可表示和好最终实现。
    reason: alternative_reading
lexical_decisions:
- source_word: διαπραξάμενοι
  choice: 办完这些事
  rationale: 该分词概括前述行动，并带有完成意味；“办完这些事”自然表达行动已告一段落而不额外限定结果。
- source_word: κοινὴν
  choice: 一同
  rationale: 修饰祈求，表示众人共同参与；汉语用“一同献上”比直译“共同的”更自然。
- source_word: ἱκετίαν
  choice: 恳求的祷告
  rationale: 该词指迫切的恳求；因对象是主，明确译作祷告符合语境。
- source_word: ἐλεήμονα
  choice: 仁慈的
  rationale: 表达乐于施怜悯的品格；“仁慈”庄重而通俗。
- source_word: κύριον
  choice: 主
  rationale: 此处是对上帝的称谓，译作“主”。
- source_word: ἠξίουν
  choice: 祈求
  rationale: 这里表示恳切请求；“祈求”既体现强度，也符合向上帝祷告的语境。
- source_word: εἰς τέλος
  choice: 完全
  rationale: 与“和好”连用时较自然地表示和好达到完全；其也可能带有“到底、最终”的意味，故以脚注保留歧义。
- source_word: καταλλαγῆναι
  choice: 和好
  rationale: 保留关系恢复的核心含义，避免仅译为平息怒气。
- source_word: δούλοις
  choice: 仆人
  rationale: 在人与上帝的关系中，“仆人”既表达归属与服从，也比“奴隶”更符合现代汉语宗教语境；希腊词本身可具有更强的隶属意味。
theological_decisions:
- issue: 上帝与其 δοῦλοις 的关系
  choice: 他的仆人
  alternative: 他的奴仆／奴隶
  rationale: “仆人”在中文圣经语体中自然表达对主的归属和服从，同时不把现代奴隶制度的社会联想强加于此；“奴仆”可更突出隶属意味。
- issue: εἰς τέλος καταλλαγῆναι 的力度
  choice: 完全和好
  alternative: 最终和好／和好到底
  rationale: 正文将 εἰς τέλος 理解为强化和好的完整程度，但该短语也可能表示终局或持续到底，因此在脚注中保留另一可能。
- issue: 主作为被动式 καταλλαγῆναι 的主语
  choice: 主与他的仆人和好
  alternative: 主重新恩待他的仆人／主向他的仆人息怒
  rationale: 直译保留希腊文将“主”置于和好关系中的张力，不擅自把它完全解释成息怒或恢复恩宠。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“一同献上恳求的祷告”体现集体祈求；避免过度古雅。脚注标记置于相关句末。
