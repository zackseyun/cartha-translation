base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/028.yaml
  text: But after the Sabbath[a], having distributed some of the spoils to those who had been oppressed, and to the widows and the orphans[b], they divided the rest among themselves and their children.
translation:
  language: zh_hans
  text: 安息日过后，他们从战利品中分出一部分，给那些受苦受害的人、寡妇和孤儿；剩下的，他们就在自己和孩子们中间分了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ τὸ σάββατον
  choice: 安息日过后
  rationale: μετά加宾格表示某事之后；δέ在此主要承接叙事，现代汉语无需生硬译出“但”或“于是”。
- source_word: τοῖς ἠκισμένοις
  choice: 那些受过苦害的人
  rationale: ἠκισμένοις为完成时被动分词，泛指曾遭受苛待、伤害或苦难的人。“受过苦害”保留其宽泛含义，不把他们限定为某一特定社会类别。
- source_word: ταῖς χήραις καὶ τοῖς ὀρφανοῖς
  choice: 寡妇和孤儿
  rationale: 直接保留原文明确列出的两个弱势群体，表达自然且符合现代汉语圣经语体。
- source_word: μερίσαντες ἀπὸ τῶν σκύλων
  choice: 从战利品中分出一部分
  rationale: σκῦλα在军事语境中指战利品；μερίσαντες与ἀπό表明从中划出一份。“一部分”由后文“剩下的”自然支持。
- source_word: τὰ λοιπὰ
  choice: 剩下的
  rationale: 指先行分给弱势群体之后余下的战利品。
- source_word: αὐτοὶ καὶ τὰ παιδία
  choice: 自己和孩子们
  rationale: αὐτοί指参与作战的人，τὰ παιδία指孩子们；汉语“自己和孩子们”自然表达受分配者，同时不强行把定冠词解释为明确的所属代词。
- source_word: διεμερίσαντο
  choice: 就在……中间分了
  rationale: 中间语态在此表示把余物在所列受益者之间分配；此译简明并体现分配范围。
theological_decisions:
- issue: 战利品分配所呈现的社会伦理次序
  choice: 明确译出先从战利品中分给受苦害者、寡妇和孤儿，再由他们自己和孩子们分取余下部分。
  alternative: 较形式化地译为“从战利品中分给……”，不明说所分的是一部分。
  rationale: ἀπό与后续τὰ λοιπά共同显示，先从战利品中划出一份给这些群体，之后才分配余下部分；这是语法和上下文所体现的次序，并非外加的道德解释。
- issue: τὰ παιδία的所属关系
  choice: 译作“孩子们”，不明说“他们的孩子”。
  alternative: 译作“他们的孩子”。
  rationale: 上下文很可能指作战者的孩子，但希腊文只有定冠词而无明确的所属代词。正文保留这一轻微开放性，同时现代汉语仍可自然理解其所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“战利品”准确传达军事语境；“受过苦害的人”兼顾遭苛待、受伤害和经历困苦等可能含义。原文没有必须另列脚注才能保存的重大异文或歧义，因此不设脚注。
