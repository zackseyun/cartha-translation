base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/020.yaml
  text: 'And the engagement in Babylonia against the Galatians had gone this way: when all who came to the need were eight thousand[a], together with four thousand Macedonians, and the Macedonians were at a loss, the six thousand destroyed the one hundred twenty thousand because of the help coming to them from heaven, and they received great advantage.'
translation:
  language: zh_hans
  text: 还有在巴比伦尼亚与加拉太人[a]交战的事，经过是这样的：当时前来应急的总共八千人，另有四千马其顿人；马其顿人陷入困境时，那六千人因有从天而来的援助，歼灭了十二万人，并且大有收获。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“高卢人”。希腊语族名既可指小亚细亚的加拉太人，也可按其更广泛的凯尔特身份译作高卢人。
    reason: alternative_reading
lexical_decisions:
- source_word: παράταξιν
  choice: 交战
  rationale: 该词可指列阵或战斗；此处指一次军事交锋。“交战”自然简洁，又不把它扩大为长期战役。
- source_word: Γαλάτας
  choice: 加拉太人
  rationale: 按希腊族名作直接、通行的音译；其也可泛指高卢人，故在脚注保留另一译法。
- source_word: ἐπὶ τὴν χρείαν ἦλθον
  choice: 前来应急
  rationale: χρεία在此是需要或危急情势；“前来应急”既保留来应付紧急需要之意，也符合现代汉语。
- source_word: ἀπορουμένων
  choice: 陷入困境
  rationale: 该词表示无计可施、缺乏出路或资源；“陷入困境”保留实际处境与进退失据的含义，不特定为纯心理困惑。
- source_word: ἀπώλεσαν
  choice: 歼灭了
  rationale: 在战斗语境中表示使敌方灭亡。“歼灭”体现强烈军事含义，同时未额外说明具体方式。
- source_word: δώδεκα μυριάδας
  choice: 十二万人
  rationale: 将“十二个万”按现代汉语数字习惯表达为“十二万人”，完整保留原文数目。
- source_word: διὰ τὴν γινομένην αὐτοῖς ἀπʼ οὐρανοῦ βοήθειαν
  choice: 因有从天而来的援助
  rationale: 保留“从天而来”的敬虔迂称，不直接将其改写为“上帝的援助”，也清楚表达胜利的原因。
- source_word: ὠφέλειαν πολλὴν ἔλαβον
  choice: 大有收获
  rationale: ὠφέλεια可指益处、利益或优势；“大有收获”在军事叙事中自然，并保留可能涵盖战利品或其他利益的宽泛性。
theological_decisions:
- issue: “从天而来的援助”所指为何
  choice: 保留“从天而来”的间接表述
  alternative: 明确译作“上帝所赐的援助”或理解为一般性的幸运
  rationale: 犹太希腊语中的“从天而来”通常敬虔地暗指上帝的介入，但原文没有直接称名。译文保留其神学含义与措辞上的克制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。原句数字关系表面上包含八千、四千与六千三组数目，译文不擅自协调或解释，以保留原文的张力与可能的文本难点。
