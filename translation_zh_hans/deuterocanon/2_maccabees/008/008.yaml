base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/008.yaml
  text: But when Philip saw that the man was gradually making progress and advancing all the more often in successes, he wrote to Ptolemy, the governor of Coele-Syria and Phoenicia, to come to the aid of the king’s cause.
translation:
  language: zh_hans
  text: 腓力看见那人[a]渐渐取得进展，并且越来越频繁地获得成功，就写信给高利叙利亚和腓尼基的总督托勒密，请他前来援助王的事业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那人”指上下文所说的犹大·马加比。
    reason: cross_reference
  - marker: b
    text: “王的事业”也可译作“王的利益”或“王的事务”；希腊文所指可比某一次军事行动更广。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδὼν
  choice: 见
  rationale: 该分词表示腓力察觉到局势发展，并由此采取行动；“见”简洁自然，也保留“看出、觉察”的语义范围。
- source_word: κατὰ μικρόν
  choice: 渐渐
  rationale: 表达逐步、逐渐发展的过程，符合现代汉语习惯。
- source_word: εἰς προκοπὴν ἐρχόμενον
  choice: 取得进展
  rationale: 指逐步进入进展、壮大的状态；此译法不把含义过度限定为财富增长或单次军事胜利。
- source_word: τὸν ἄνδρα
  choice: 那人
  rationale: 保留希腊文对上下文人物的指称方式，不在正文中直接补明为犹大；脚注交代所指。
- source_word: πυκνότερον
  choice: 越来越盛
  rationale: 该比较级副词在这里可表示发展得更为频繁、密集或强劲；结合“成功”与“势头”，用“越来越盛”自然呈现不断增强的态势，同时避免生硬限定为次数。
- source_word: ἐν ταῖς εὐημερίαις
  choice: 成功的势头
  rationale: 复数形式指一连串有利结果、顺境或成功；与后面的“越来越盛”合译为自然汉语，符合军事政治语境。
- source_word: προβαίνοντα
  choice: 势头……越来越盛
  rationale: 原意为向前迈进、继续发展；汉语以“势头越来越盛”表达持续推进和增强。
- source_word: στρατηγὸν
  choice: 总督
  rationale: 此处指托勒密对高利叙利亚和腓尼基所负的区域行政及军事职权；“总督”比单纯的“将军”更贴合其官职。
- source_word: ἐπιβοηθεῖν
  choice: 前来援助
  rationale: 保留复合动词中赶来支援的方向性和紧迫感。
- source_word: τοῖς τοῦ βασιλέως πράγματι
  choice: 王的事业
  rationale: 该短语可泛指王的事务、利益或阵营；“王的事业”适合政治军事语境，同时脚注保留其他可能理解。
