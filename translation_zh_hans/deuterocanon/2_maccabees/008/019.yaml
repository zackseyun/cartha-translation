  yaml_path: translation/deuterocanon/2_maccabees/008/019.yaml
  text: And he also recounted to them the help that had come to their forefathers[a], and the one against Sennacherib[b], how a hundred eighty-five thousand were destroyed.
translation:
  language: zh_hans
  text: 他又向他们讲述祖先曾蒙受的种种援助[a]，以及在西拿基立的事上那一次援助：十八万五千人怎样灭亡[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“种种拯救”；希腊词可指帮助、援助或救援的行动。
    reason: lexical_alternative
  - marker: b
    text: 这里指希西家在位时西拿基立的军队遭毁灭一事；参见《列王纪下》19:35及《以赛亚书》37:36。
    reason: cross_reference
lexical_decisions:
- source_word: προσαναλεξάμενος
  choice: 又向他们讲述
  rationale: 该分词表示犹大进一步向众人述说、重温往昔之事；“又向他们讲述”既承接上文，也符合现代汉语叙事习惯。
- source_word: ἀντιλήμψεις
  choice: 种种援助
  rationale: 该复数名词指危难中所获的帮助或救援。“种种援助”保留较宽泛的语义，不把原文未明说的施助者直接补作“上帝”。
- source_word: ἐπὶ τῶν προγόνων γενομένας
  choice: 祖先曾蒙受的
  rationale: 此短语说明这些援助发生在祖先身上或祖先的时代；“曾蒙受的”自然表达祖先经历了这些援助，同时不明说援助者。
- source_word: τὴν ἐπὶ Σεναχηρεὶμ
  choice: 在对抗西拿基立时的那一次
  rationale: 希腊文以阴性冠词省略并回指前面的“援助”；译文用“那一次”保留这种回指，并把 ἐπί 在敌对语境中的意义表达为“对抗”。
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδες
  choice: 十八万五千人
  rationale: 准确表达数目；原文虽省略人数所指的名词，但历史与军事语境清楚指向军队中的人，汉语需补“人”才自然。
- source_word: ὡς ἀπώλοντο
  choice: 怎样灭亡
  rationale: ὡς 引出所讲述事件的内容或情形；“怎样灭亡”保留其表达方式，也避免明加原文此处未出现的施动者。
theological_decisions:
- issue: 祖先所得援助及西拿基立军队灭亡背后的神圣施动者
  choice: 正文不明加“上帝”，让历史典故及上下文传达神圣拯救的含义。
  alternative: 译作“上帝赐给祖先的援助”或“上帝怎样消灭十八万五千人”。
  rationale: 相关传统明确把拯救归于上帝，但本节这一分句没有直接说出上帝。保留原文的隐含施动者，可避免把解释写入正文。
- issue: ἀντιλήμψεις 的神学力度
  choice: 译作较宽泛的“援助”，并在脚注列出“拯救”这一可能译法。
  alternative: 正文直接译作“种种拯救”。
  rationale: 该词可指帮助、扶助或救援；“拯救”更突出解救结果，却也比原词在此处的基本意义略具体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“西拿基立”沿用通行的中文圣经人名译法。用“那一次”自然呈现希腊文省略“援助”一词的回指结构；数字按现代汉语写作“十八万五千”。
