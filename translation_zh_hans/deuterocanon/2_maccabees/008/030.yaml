base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/030.yaml
  text: And after crushing the forces around Timothy and Bacchides[a], they killed more than twenty thousand of them, gained firm control of very high strongholds, and divided the plentiful plunder, making themselves equal sharers with the oppressed and orphans and widows, and even with the elderly.
translation:
  language: zh_hans
  text: 他们击溃了提摩太和巴基德一方的人马，杀了他们二万多人，又牢牢占据了高耸的堡垒。他们分配了大量战利品，使自己与受欺压的人、孤儿、寡妇，甚至老年人同得相等的份额。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使受欺压的人、孤儿、寡妇，甚至老年人与他们同得相等的份额。”希腊文代词的所指可有不同理解；正文将其理解为士兵使自己与这些弱势群体平分。
    reason: 保留αὐτούς所指的句法歧义，并使替代译法明确表达弱势群体与作战者同得等额份额。
lexical_decisions:
- source_word: συνερείσαντες
  choice: 击溃了
  rationale: 该分词表示以强力压倒、摧毁；在军事叙事中译作“击溃”自然有力，并与后面的杀敌和夺取堡垒相称。
- source_word: τοὺς περὶ Τιμόθεον καὶ Βακχίδην
  choice: 提摩太和巴基德所率的人
  rationale: οἱ περὶ加人名指围绕、跟随或受该人领导的一群人；这里是军事语境，译文不把行动仅限于二人本人。
- source_word: ὑπὲρ τοὺς δισμυρίους
  choice: 二万多人
  rationale: δισμύριοι是二万，ὑπέρ接宾格表示超过；“二万多人”符合现代汉语表达。
- source_word: ἀνεῖλον
  choice: 杀了
  rationale: ἀναιρέω在战争叙事中通常指杀死；直译为“杀了”清楚而不弱化暴力。
- source_word: ὀχυρωμάτων ὑψηλῶν εὖ μάλα ἐγκρατεῖς ἐγένοντο
  choice: 牢牢占据了极高的堡垒
  rationale: ἐγκρατεῖς ἐγένοντο表示取得并保持控制，εὖ μάλα强化ὑψηλῶν；“牢牢占据”兼顾取得控制与稳固掌握。
- source_word: λάφυρα πλείονος
  choice: 大量战利品
  rationale: 该短语表示数量很多的掳获物；“大量战利品”在现代军事叙事中自然明确。
- source_word: ἐμερίσαντο
  choice: 分了
  rationale: 该动词表示分割、分配；与战利品搭配时“分了”简洁自然。
- source_word: ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: 使自己……同得相等的份额
  rationale: 主文把αὐτούς理解为回指行动者，即他们没有为自己保留更大的份额，而是与弱势群体平分；代词所指仍有另一种可能，故加注说明。
- source_word: τοῖς ἠκισμένοις
  choice: 受欺压的人
  rationale: 该词指遭受伤害、虐待或压迫的人；“受欺压的人”与孤儿、寡妇等社会弱势群体并列最为贴切。
- source_word: πρεσβυτέροις
  choice: 老年人
  rationale: 这里列举接受分配的弱势人群，并非正式职分；“老年人”避免误解为宗教或社群领袖。
theological_decisions:
- issue: ἰσομοίρους αὐτοὺς ... ποιήσαντες中αὐτούς的所指
  choice: 作战者使自己与受欺压的人、孤儿、寡妇和老年人同得相等份额
  alternative: 他们使这些弱势群体与自己同得相等份额
  rationale: αὐτούς可作近似反身用法，回指句中行动者，因此主文采用“使自己”；但语法上也可能指受益群体。两种理解在实际分配结果上接近，却对句法重心的表达不同，故在脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“击溃”“牢牢占据”“战利品”保留军事背景；“受欺压的人”“老年人”避免古奥或职分化表达。脚注标记置于整句末尾，说明与整处分配语句相关的歧义。
