base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/035.yaml
  text: Having been humbled by those who were thought to be the least among his own[a], and by the Lord’s help having laid aside his splendid robe, he made himself like a fugitive, traveling through the inland country in isolation and came to Antioch[c][b], having prospered beyond all expectation in the destruction of his army.
translation:
  language: zh_hans
  text: 在主的帮助下，他被自己一方那些被认为最微不足道的人击败；脱下华贵的袍服后，他孤身穿过内陆，像逃亡者一样来到安提阿，竟因军队覆灭而格外“顺遂”。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文把“顺遂”与军队的覆灭并列，语带反讽：他所谓的“顺遂”，恰与军队覆灭相联系。
    reason: 说明原文有意保留的反讽，避免读者把“顺遂”理解为真正成功，同时不增添“全军”或“军事行动”等原文未明说的内容。
lexical_decisions:
- source_word: ταπεινωθεὶς
  choice: 被……挫败了
  rationale: 保留不定过去时被动分词的被动意义，并在军事叙事中自然表达“被压低、受挫”的含义；较“受辱”更少加入主观羞耻感。
- source_word: ὑπὸ τῶν καθʼ αὑτὸν νομιζομένων ἐλαχίστων εἶναι
  choice: 被自己一方那些被认为最微不足道的人
  rationale: 保留νομιζομένων的被动含混，不擅自指定究竟是谁如此认为；καθʼ αὑτόν按其阵营或身边的人理解，译为“自己一方”。
- source_word: τῇ τοῦ κυρίου βοηθείᾳ
  choice: 在主的帮助下
  rationale: 将工具与方式的与格自然译出，并按词序主要连接前面的“被挫败”，避免误成主帮助尼迦挪脱去袍服。
- source_word: τὴν δοξικὴν ἀποθέμενος ἐσθῆτα
  choice: 脱下华贵的袍服
  rationale: ἀποθέμενος是“脱下、除去”；δοξικήν表示显赫华美，结合身份服饰译作“华贵的袍服”。
- source_word: διὰ τῆς μεσογείου
  choice: 穿过内陆
  rationale: μεσόγειος在此指内地、内陆地区，并非地中海。
- source_word: δραπέτου τρόπον
  choice: 像逃亡者一样
  rationale: 表达“以逃跑者的方式”；不把δραπέτης可能具有的“逃奴”色彩强行具体化。
- source_word: ἔρημον ἑαυτὸν ποιήσας
  choice: 孤身
  rationale: 原意为使自己孤单、无人相伴；“孤身”简洁保留其独自逃亡的景象。
- source_word: ἧκεν εἰς Ἀντιόχειαν
  choice: 来到安提阿
  rationale: 直接、自然地表达抵达该城。
- source_word: ὑπὲρ ἅπαν εὐημερηκὼς
  choice: 竟“顺遂”到了极点
  rationale: ὑπὲρ ἅπαν是强烈的极量表达，未明说“超乎预期”；εὐημερέω本指顺遂、兴旺，此处明显反讽，以引号和“竟”保留张力。
- source_word: ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ
  choice: 在军队覆灭这件事上
  rationale: ἐπί加与格在此表示所涉及的事情；διαφθορά指毁灭、覆亡。希腊文只说“这支军队”，不在正文额外补出“他的”。
theological_decisions:
- issue: κύριος所指
  choice: 主
  alternative: 主人／那位主
  rationale: 叙事语境指以色列的上帝；“主”既符合现代中文圣经称谓，也不扩展希腊文的陈述。
- issue: τῇ τοῦ κυρίου βοηθείᾳ的句法连接
  choice: 把“在主的帮助下”主要理解为尼迦挪被挫败的方式或背景
  alternative: 把它连接于“脱下华贵的袍服”，仿佛主帮助尼迦挪逃走
  rationale: 词序、标点和上下文更支持前者：主的援助使被轻视的一方得胜。译文不进一步说明主具体帮助了谁，以保留原文压缩的句法。
- issue: εὐημερηκὼς与军队覆灭之间的反讽
  choice: 竟“顺遂”到了极点
  alternative: 惨遭军队覆灭／彻底失败
  rationale: 不把反讽改写成直陈失败，而保留“顺遂”与“覆灭”并置所产生的神学及文学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“微不足道”“华贵的袍服”“孤身穿过内陆”兼顾可读性与原文意象；末句刻意保留反常搭配，并用一则脚注说明反讽。
