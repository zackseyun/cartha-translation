  terminology: “马加比”为恰当的传统中文音译。Ἰουδαϊσμός正文改译为“犹太教”较为直接，并以脚注说明此处包括犹太人的宗教身份和生活实践；这样既不把词义限缩为单纯内在信念，也不将脚注中的解释置入正文。
