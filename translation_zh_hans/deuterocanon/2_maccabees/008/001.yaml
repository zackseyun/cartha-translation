base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/001.yaml
  text: But Judas[a], who was also called Maccabeus, and those with him, slipping in secretly into the villages, were calling together their relatives; and taking in those who had remained in Judaism, they gathered about six thousand.
translation:
  language: zh_hans
  text: 但又称马加比的犹大和同他在一起的人暗中潜入各村，召集亲属，又接纳那些仍坚守犹太教的人[a]；他们聚集了约六千人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些仍忠于犹太人的生活方式的人。”这里的希腊语“犹太教”指犹太人的宗教身份和生活实践，与当时的希腊化压力相对。
    reason: 说明Ἰουδαϊσμός在本处的广义用法，并保留带有“忠于”意味的可选译法。
lexical_decisions:
- source_word: παρεισπορευόμενοι λεληθότως
  choice: 暗中潜入
  rationale: 两个词共同强调行动隐秘、未被察觉，并带有进入各村的动态含义；“暗中潜入”在现代汉语中简洁自然，也保留了原文的秘密行动色彩。
- source_word: προσεκαλοῦντο
  choice: 召集
  rationale: 中动态形式表示把人招到自己一方；“召集”符合此处组织支持者的语境，又不必然暗示正式征兵。
- source_word: τοὺς συγγενεῖς
  choice: 自己的亲族
  rationale: “亲族”可涵盖广义的亲属和同族亲人，语体庄重且不限定性别。
- source_word: τοὺς μεμενηκότας ἐν τῷ Ἰουδαϊσμῷ
  choice: 那些仍持守犹太信仰的人
  rationale: 原文直指仍留在“犹太教／犹太生活方式”中的人。“持守犹太信仰”以自然汉语表达其在希腊化压力下没有离弃犹太宗教身份与实践的含义；脚注说明原词范围。
- source_word: προσλαμβανόμενοι
  choice: 接纳
  rationale: 表示把这些人接受进自己的群体；“接纳”既保留接受、加入之意，也避免过早把他们明确解释为受征召的士兵。
- source_word: συνῆγον εἰς ἑξακισχιλίους
  choice: 聚集起来的约有六千人
  rationale: συνάγω表示聚集成群，εἰς加数目表示所得总数；“约有六千人”符合叙事中此类人数表达，同时保留其约数性质。
- source_word: ὁ καὶ Μακκαβαῖος
  choice: 又称马加比的
  rationale: 该结构给出犹大的另一个称号；“又称马加比”清楚、简洁，并不额外判断这是姓氏、绰号还是头衔。
theological_decisions:
- issue: Ἰουδαϊσμός的译法
  choice: 犹太信仰
  alternative: 犹太教；犹太人的生活方式
  rationale: 此词在《马加比二书》中兼有宗教、群体身份及生活实践的含义，并与希腊化和背教压力相对。“犹太信仰”在正文中较自然，也不把含义缩减为现代制度化宗教；脚注保留更广的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“马加比”依中文传统音译；句子保留原文连续动作的推进：秘密进入、召集亲族、接纳持守者，最后交代人数。脚注标记置于实际涉及Ἰουδαϊσμός的短语之后。
