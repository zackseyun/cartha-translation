base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/011.yaml
  text: So he immediately sent to the cities along the coast[a], inviting them to buy Jewish bodies, promising to hand over ninety bodies for a talent[b]; but he did not expect the punishment from the Almighty that was about to come upon him.
translation:
  language: zh_hans
  text: 于是，他立即派人到沿海各城，招揽人购买犹太人的身体[a]，并许诺以一他连得的价钱交出九十具身体；可是，他没有料到全能者的惩罚[b]即将临到他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“犹太人的身体”，指被当作商品出售的犹太俘虏；也可译作“犹太人”，或按语境译作“犹太奴隶”。
    reason: lexical_alternative
  - marker: b
    text: “惩罚”也可译作“公义的裁决”；原词既可指施行的公义，也可指由此而来的惩罚。
    reason: alternative_reading
lexical_decisions:
- source_word: παραθαλασσίους πόλεις
  choice: 沿海各城
  rationale: 准确表达“位于海边、沿海”的意思，简洁而符合现代汉语。
- source_word: προκαλούμενος ἐπʼ ἀγορασμόν
  choice: 招揽人来购买
  rationale: 语境是向潜在买主发出商业邀约；“招揽”保留主动兜售、征求买家的意味。
- source_word: Ἰουδαίων σωμάτων
  choice: 犹太人的身体
  rationale: 原文直译为“犹太人的身体”，将俘虏物化为商品。保留这一刺目的措辞，不淡化为“人”，也不把隐含意思直接解释成“奴隶”。
- source_word: ἐνενήκοντα σώματα ταλάντου παραχωρήσειν
  choice: 一个他连得可交付九十具身体
  rationale: 将压缩的希腊语理解为交易比率，即每一他连得九十名俘虏；“交付”体现交易语境，“具”刻意呼应其物化措辞。
- source_word: οὐ προσδεχόμενος
  choice: 没有料到
  rationale: 表达他未曾预料、未把即将发生之事计算在内，汉语自然清楚。
- source_word: δίκην
  choice: 惩罚
  rationale: 在神圣报应的上下文中，“惩罚”最直接；但该词也可指施行的公义，故以脚注保留歧义。
- source_word: τοῦ παντοκράτορος
  choice: 全能者
  rationale: 这是对上帝的称号，强调其统御万有的大能；“全能者”庄重、通行且不额外添加教义解释。
- source_word: μέλλουσαν παρακολουθήσειν αὐτῷ
  choice: 即将临到他
  rationale: 原表达有紧随、追上的意味；正文采用自然汉语“临到”，不改变迫近的语义。
theological_decisions:
- issue: 神圣称号 παντοκράτωρ
  choice: 全能者
  alternative: 统管万有者
  rationale: “全能者”是现代中文中自然而庄重的神圣称号，体现主权和能力，又不过度释义。
- issue: 是否将 σώματα 淡化为“人”或明说为“奴隶”
  choice: 犹太人的身体／九十具身体
  alternative: 犹太人／九十名奴隶
  rationale: 原文用“身体”把将被出售的犹太人当作货品。保留这一用词可呈现叙事的道德冲击；译作“奴隶”虽符合语境，却会把隐含信息写入正文。
- issue: δίκη 是“公义”还是“惩罚”
  choice: 惩罚
  alternative: 公义的裁决
  rationale: 此处指全能者即将施于尼加挪的报应，正文用“惩罚”较清楚；脚注说明原词也可指施行出来的公义，以保存神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“招揽人来购买”呈现商业兜售语境；正文两次保留“身体”，并以“具”呼应原文刻意的物化效果。句末用“可是”表现叙事反转。
