  yaml_path: translation/deuterocanon/2_maccabees/008/015.yaml
  text: and not because of them[a], but because of the covenants made with their fathers[b], and because of the invocation of his majestic and magnificent name over them.
translation:
  language: zh_hans
  text: 即便不是因为他们[a]，而是因为他与他们祖先所立的约，并因为他那庄严宏伟的名被称在他们身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“即便不是为了他们的缘故。”
    reason: lexical_alternative
  - marker: b
    text: “名被称在他们身上”是圣经中的表达，指神的名被称呼在他们之上，表示他们归属于神、是属神的子民。
    reason: cultural_note
lexical_decisions:
- source_word: εἰ μὴ διʼ αὐτούς
  choice: 即使不是因他们自己
  rationale: εἰ μή承接上文祈求，可自然译作“即使不是……也……”；διʼ αὐτούς表示所依据的缘故。加“自己”明确是指他们本身，却不引入功德论解释。
- source_word: διὰ τὰς πρὸς τοὺς πατέρας αὐτῶν διαθήκας
  choice: 因他与他们祖先所立的约
  rationale: διαθήκη在犹太经文语境中译为“约”；πρὸς τοὺς πατέρας表达约与祖先的关系，汉语以“与……所立的约”自然传达。
- source_word: ἕνεκα
  choice: 并因
  rationale: 表示另一项原因，与前面的διὰ构成并列；“并因”保留两个理由的平行结构。
- source_word: τῆς ἐπʼ αὐτοὺς ἐπικλήσεως
  choice: 已称在他们身上
  rationale: 这里的ἐπίκλησις指名被称在某群体身上。译文保留ἐπί“在……身上”的意象，并用汉语经文语体的表达避免误解为他们呼求神名。
- source_word: τοῦ σεμνοῦ καὶ μεγαλοπρεποῦς ὀνόματος αὐτοῦ
  choice: 他那庄严宏伟的名
  rationale: σεμνός含庄重、尊贵之意，μεγαλοπρεπής含宏伟、威严之意；“庄严宏伟”保留两个并列的尊称，也符合现代庄重汉语。
theological_decisions:
- issue: 神施恩的立约依据
  choice: 保留“不是因他们自己”与两个正面依据：同祖先所立的约，以及神的名称在他们身上。
  alternative: 可意译为神只因祖先所得的应许或只为维护自己的名而施恩。
  rationale: 希腊文明确列出两个并列理由，并将二者与“不是因他们”形成张力；译文不把其中一项吞并进另一项，也不进一步界定人的功德、拣选或神的名誉。
- issue: 神名“称在”百姓身上的含义
  choice: 保留神的名“称在他们身上”的关系性意象。
  alternative: 解释性译作“因为他们是属他名下的子民”。
  rationale: 意译虽易懂，却会把原文的ἐπίκλησις及ἐπί意象直接解释为归属关系；正文保留原有表达，以脚注说明其惯用含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“庄严宏伟”保留原文双重尊称；“名已称在他们身上”略带经文语体，以保存原文意象，并由脚注帮助普通读者理解。
