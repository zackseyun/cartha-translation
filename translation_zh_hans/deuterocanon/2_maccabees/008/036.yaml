base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/036.yaml
  text: And the one who had undertaken to pay tribute to the Romans from the capture of those in Jerusalem kept proclaiming that the Jews had as their defender one who fought for them[a], and that for this reason the Jews were invulnerable[b], because they followed the laws that had been commanded to them.
translation:
  language: zh_hans
  text: 那曾答应要把俘掳耶路撒冷居民所得的收益[a]用来缴足给罗马人的贡款的人，不断宣称：犹太人有一位为他们争战的护卫者[b]；犹太人也因此不会受伤害，因为他们遵行了颁定给他们的律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着俘掳耶路撒冷居民”。希腊语表达指预期从俘掳耶路撒冷居民一事中取得的收益。
    reason: lexical_alternative
  - marker: b
    text: 这里没有明确说出这位护卫者是谁；上下文暗示是上帝在为犹太人争战。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ἀναδεξάμενος
  choice: 那曾承诺……的人
  rationale: 该带冠词的中间语态分词指前文的尼加诺；“承诺”表达他承担了义务，又不把表达过度限定为商业合同。
- source_word: φόρον
  choice: 贡款
  rationale: 这里指向罗马这一帝国权力缴纳的款项；“贡款”比泛称的“税款”更能保留政治意味。
- source_word: ἀπὸ τῆς τῶν ἐν Ἱεροσολύμοις αἰχμαλωσίας
  choice: 靠俘掳耶路撒冷居民所得的收益
  rationale: αἰχμαλωσία可指俘掳或被掳状态；语境所说的是尼加诺打算以俘掳居民带来的收益作为贡款来源。“所得的收益”属语境中隐含的信息，脚注保留较贴近字面的表达。
- source_word: κατορθώσασθαι
  choice: 筹足
  rationale: 该词本义为成就、办妥；在此财务语境中指设法兑现或筹足所承诺的贡款，比单说“缴纳”更能表现资金来源的计划。
- source_word: κατήγγελλεν
  choice: 不断宣称
  rationale: 未完成时表示持续或反复的动作；“不断”体现这一体貌。
- source_word: ὑπέρμαχον ἔχειν
  choice: 有一位为他们争战的护卫者
  rationale: ὑπέρμαχος不只是被动保护者，也有为他人出战之意；扩展表达同时保留护卫与争战两层含义。
- source_word: ἀτρώτους
  choice: 不受伤害
  rationale: 该词表示不被刺伤、不会受到创伤；此译自然，并保留军事语境中的保护意味。
- source_word: διὰ τὸ ἀκολουθεῖν
  choice: 因为他们遵行
  rationale: 介词加不定式表达原因；“因为”清楚保留其因果关系。
- source_word: τοῖς ἑαυτῶν προστεταγμένοις νόμοις
  choice: 给他们颁定的律法
  rationale: 完成时被动分词表明这些律法已权威地规定给他们；“颁定”保留被动和权威意味。
theological_decisions:
- issue: ὑπέρμαχον ἔχειν中护卫者的身份
  choice: 保留为未具名的“一位……护卫者”
  alternative: 直接译作“上帝为他们争战”
  rationale: 上下文暗示这位护卫者是上帝，但本句希腊文没有明确说出其名；译文保留所指的含蓄性，脚注说明语境暗示，避免把推论写进正文。
- issue: 犹太人不受伤害与遵行律法之间的关系
  choice: 保留原文明确陈述的因果关系
  alternative: 弱化为仅仅同时发生或一般性的蒙福
  rationale: 两个διά结构明确把他们的行事方式、尤其遵行所颁律法，作为不受伤害的原因；译文不额外建立超出本节的系统神学结论。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“贡款”“颁定的律法”保留历史政治与权威语气；以分号梳理原文较长的并列结构。脚注标记按其实际说明对象放置：[a]置于收益来源之后，[b]置于未具名的护卫者之后。
