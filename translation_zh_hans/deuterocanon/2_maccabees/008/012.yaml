  yaml_path: translation/deuterocanon/2_maccabees/008/012.yaml
  text: But news of Nicanor’s advance came to Judas[a]; and when he had shared with those with him the presence of the army camp[b],
translation:
  language: zh_hans
  text: 但有尼加诺进军的消息传到犹大那里[a]；他把军队到来的消息告诉了与他在一起的人[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尼加诺前来袭击的消息传到了犹大那里。”希腊语“ἐφόδος”可指进军、袭击或攻击。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他把军营就在附近的事告诉了与他在一起的人。”希腊语原文的表达较为凝练，其中“παρουσία”可指“来到”或“在场”，“στρατόπεδον”可指“军营”或“军队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέπεσεν
  choice: 得知
  rationale: 这里的 προσπίπτω 与 περὶ 加属格构成传来消息的表达；汉语用“得知”自然传达消息临到犹大的含义，而不按字面译作“落到”。
- source_word: περὶ τῆς τοῦ Νικάνορος ἐφόδου
  choice: 尼加诺正在进军
  rationale: ἐφόδος 可指进军、袭击或攻击；上下文尚未叙述交战已经开始，因此用“正在进军”保留敌对逼近之意而不过早断定攻击已发动。
- source_word: μεταδόντος
  choice: 把……消息告诉了
  rationale: μεταδίδω 本义为分给、传达；在此宾语是敌军来到这一情报，译作“把……消息告诉了”符合现代汉语，也保留信息传递的动作。
- source_word: τοῖς σὺν αὐτῷ
  choice: 跟随他的人
  rationale: 该短语直指与犹大同在的人；“跟随他的人”在军事叙事中自然，同时没有进一步限定其身份。
- source_word: τὴν παρουσίαν τοῦ στρατοπέδου
  choice: 敌军已经来到的消息
  rationale: παρουσία 可指到来或在场，στρατόπεδον 可指军营或军队。结合语境，将这一压缩表达译为敌军已经来到；“敌”由尼加诺进军的语境明确，“消息”则由 μεταδόντος 的信息传递含义补出。脚注保留“军营就在附近”的另一可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而顺畅的叙事语体。本节原文以逗号结束，句法延续至下一节，因此中文也保留末尾逗号。正文避免生硬直译“军营的临在”，并用脚注保存原文在“敌军到来”与“军营在附近”之间的歧义。
