  source_fidelity: 草稿准确传达了犹大借先前的话鼓舞众人、使他们愿意为律法和祖国而死，并将军队分为四部分的内容。然“准备为……而死”在句法上较易被读作众人自行作出的后续行动，未明确体现παραστήσας与ἑτοίμους所表达的“使他们准备好”。“四队”虽通顺，但比τετραμερές所说的“四部分”更具体，可能暗示未见于原文的固定军事编制。
