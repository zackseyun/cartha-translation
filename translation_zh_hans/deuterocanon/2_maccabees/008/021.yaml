base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/021.yaml
  text: With these words he encouraged them and made them ready to die for the laws and the fatherland[a], and he formed the army into four parts.
translation:
  language: zh_hans
  text: 他用这些话鼓舞众人，使他们准备好为律法和祖国而死；又把军队分成四部分。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: 他用这些话
  rationale: 承接上文的劝勉，保留该短语的凭借、手段意味；现代汉语自然表达为“用这些话”。
- source_word: εὐθαρσεῖς αὐτοὺς παραστήσας
  choice: 使众人鼓起勇气
  rationale: εὐθαρσεῖς 表示勇敢、有信心，παραστήσας 在此有使他们进入某种状态之意；合译既体现使动关系，也符合现代汉语习惯。
- source_word: ἑτοίμους ... ἀποθνήσκειν
  choice: 准备……而死
  rationale: 直译其“准备好去死”的明确含义，不将死亡弱化为仅仅面对危险。
- source_word: ὑπὲρ τῶν νόμων καὶ τῆς πατρίδος
  choice: 为律法和祖国
  rationale: ὑπέρ 表示为了或捍卫；νόμων 虽为复数，但在犹太语境中汉语惯用集合性的“律法”，而“祖国”保留 πατρίς 的祖先之地与国家归属感。
- source_word: τετραμερές τι ἐποίησεν τὸ στράτευμα
  choice: 把军队分成四队
  rationale: τετραμερές 表示分为四部分；结合军队语境译作“四队”，比“四部分”更自然，同时不额外规定具体编制。
theological_decisions:
- issue: 律法与故土忠诚并列时 πατρίς 的表达
  choice: 祖国
  alternative: 故土／家园
  rationale: “祖国”保留经文中对祖先之地的群体归属和强烈修辞色彩，但不额外加入后世民族国家观念。
- issue: νόμων 的复数形式
  choice: 律法
  alternative: 诸条律法／法律
  rationale: 希腊文形式为复数，可指祖传的各项律例；现代中文圣经语境用集合名词“律法”最自然，也能涵盖多项法令，不将其窄化为单一条文。
translation_notes:
  register: 采用庄重而明白的现代标准普通话。句子保留先鼓舞、后整军的行动次序；“四队”是军事语境下对“四部分”的自然表达。英文材料所附脚注把“四队”误挂在“祖国”之后，且其内容只是同一句末尾短语的译法替换，故不沿用该脚注。
