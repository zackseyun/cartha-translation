  terminology: “律法”适合在犹太语境中概括复数νόμων；“祖国”可自然表达πατρίς在此的祖传故土／共同体归属，虽带现代色彩，但未扭曲原义。无需沿用英文审计材料中误挂于“fatherland”的脚注；该脚注仅提供句末军事短语的英语替代表述，且中文修订已直接采用较中性的“四部分”。
