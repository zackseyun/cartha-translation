  yaml_path: translation/deuterocanon/2_maccabees/008/003.yaml
  text: and to have mercy also on the city that was being destroyed and was about to be leveled to the ground[a], and to hear the blood crying out to him[b];
translation:
  language: zh_hans
  text: 也求他怜悯那座正遭毁坏、即将被夷为平地的城，并垂听向他呼号的血[a][b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为复数的“众血”；这种复数形式可能强调多人的流血、反复发生的血案或所招致的血债。
    reason: lexical_alternative
  - marker: b
    text: “血向他呼号”很可能呼应圣经中无辜人的血向上帝呼求的主题。
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: 怜悯
  rationale: 不定式承接上文祈求的内容；“怜悯”自然、庄重，也保留了施恩与体恤的含义。
- source_word: καταφθειρομένην
  choice: 正遭毁坏
  rationale: 现在分词表达正在持续的受毁过程；“正遭毁坏”既体现进行性，也不额外限定毁坏的方式。
- source_word: πόλιν
  choice: 城
  rationale: 原文使用普通名词而非专名；译作“城”保留这一表达，语境中所指为耶路撒冷。
- source_word: μέλλουσαν ἰσόπεδον γίνεσθαι
  choice: 即将被夷为平地
  rationale: μέλλουσαν表示事情迫近，ἰσόπεδον γίνεσθαι指变得与地面齐平；“被夷为平地”是现代汉语中清楚自然的对应说法。
- source_word: τῶν ... αἱμάτων
  choice: 血
  rationale: 希腊文使用复数“血”，可能突出多人的流血或累累血债；汉语在这一拟人化意象中通常用单数“血”，并以脚注保留原文形式。
- source_word: καταβοώντων πρὸς αὐτόν
  choice: 向他呼号的
  rationale: 保留“血”向上帝发声呼求的具体意象；“呼号”体现强烈的呼喊，却不擅自增添“伸冤”或“报仇”等目的。
- source_word: εἰσακοῦσαι
  choice: 垂听
  rationale: 该词在祈祷语境中可含听取、应允之意；“垂听”符合庄重的现代宗教语体，同时没有明确断定回应的具体方式。
theological_decisions:
- issue: “血向他呼号”可能包含的经文互文
  choice: 正文保留“向他呼号的血”这一具体拟人意象，不说明呼号是为了报仇或伸冤。
  alternative: 译作“向他呼求伸冤的被杀者之血”或较抽象的“向他呼求的流血冤情”。
  rationale: 原文只描绘血向上帝呼号，并未在本句明说死者身份或呼求目的；保留意象可维持其经文共鸣与神学张力，避免解释性扩写。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正遭毁坏”与“即将”分别体现当前持续的灾难和迫近的彻底毁灭；“垂听”“呼号”保持祈祷语境及原文的强烈意象。分号保留本节作为上文祈求清单一部分的未完句性质。
