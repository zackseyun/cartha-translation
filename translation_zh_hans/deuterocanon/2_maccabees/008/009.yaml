base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/009.yaml
  text: But he quickly selected Nicanor son of Patroclus[a], one of his chief Friends, and sent him, having assigned to him no fewer than twenty thousand from the nations of every tribe to wipe out the whole Jewish people. They also appointed with him Gorgias, a military man experienced in matters of war[c][b],
translation:
  language: zh_hans
  text: 他便迅速选派帕特罗克洛斯的儿子尼卡诺尔——首席“朋友”之一[a]——前去，又把来自各族、不少于两万名的人交由他统辖[b]，要把犹太全族彻底铲除[c]。他们还安排高尔吉亚与他一同任职；此人是一位将领，富有作战经验。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首席朋友”很可能是希腊化王廷中高级王室亲信的头衔，不只是私人朋友。
    reason: lexical_alternative
  - marker: b
    text: “来自各族”的希腊文表达较为少见，也可理解为由各种族属的人组成，或来自各类民族。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“要把犹太地的整个民族连根除掉”。
    reason: alternative_reading
lexical_decisions:
- source_word: προχειρισάμενος
  choice: 选派
  rationale: 该分词表示为某项任务拣选或任命某人；“选派”同时体现选择与差遣，符合此处军事使命的语境。
- source_word: τῶν πρώτων φίλων
  choice: 王室首席“朋友”之一
  rationale: “朋友”在希腊化宫廷中可作君王高级亲信的称号；加引号并补出“王室”，可避免读者误解为普通私人朋友，同时保留“首席”的等级意味。
- source_word: ὑποτάξας
  choice: 交给他统辖
  rationale: 本词表示置于某人之下；此处所交付的是大批兵力，译为“交给他统辖”能清楚表达军事隶属关系。
- source_word: παμφύλων ἔθνη
  choice: 来自各族……的军队
  rationale: παμφύλων 强调各种族属或各类来源，ἔθνη 指各民族、外邦人或由他们组成的兵力；结合两万人的军事语境，译文补出“军队”，并以脚注保留短语本身的不寻常和多义性。
- source_word: οὐκ ἐλάττους τῶν δισμυρίων
  choice: 不少于两万人
  rationale: 准确传达比较结构和二万这一数量，且符合现代汉语表达。
- source_word: τὸ πᾶν τῆς Ἰουδαίας ἐξᾶραι γένος
  choice: 把犹太全族彻底铲除
  rationale: ἐξᾶραι 在此表示连根除去、彻底消灭；γένος 是整体族群。“犹太全族”保留民族共同体含义，又避免现代“种族”一词可能带来的生物学限定。
- source_word: συνέστησαν δὲ αὐτῷ καὶ Γοργίαν
  choice: 他们还给他配了高尔吉亚
  rationale: συνίστημι 在此有安排某人与另一人共事、配属给他的意思；“配了”自然地表达共同执行军事任务的关系，同时保留希腊文复数主语“他们”。
- source_word: ἄνδρα στρατηγὸν καὶ εὖ πολεμικαῖς χρείαις ἔχοντα πεῖραν
  choice: 此人是一位将领，深谙战事
  rationale: στρατηγός 明确指军事将领，后半句强调实际战争事务方面的丰富经验；译文简洁而完整地保留两层描述。
theological_decisions:
- issue: γένος 在民族灭绝语境中的译法
  choice: 犹太全族
  alternative: 犹太地的整个民族；犹太整个族类
  rationale: 上下文指要消灭犹太人这一整体群体。“全族”保留集体、族属含义，不把 γένος 收窄为现代生物学意义的“种族”，也不削弱原文所表达的彻底灭绝意图。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。人名按希腊文音译；宫廷称号以引号提示其专门用法。军事数量与灭绝性命令直译其力度，同时通过脚注保留 παμφύλων ἔθνη 和 τῆς Ἰουδαίας γένος 的真实歧义。
