  yaml_path: translation/deuterocanon/2_maccabees/008/013.yaml
  text: But those who had become cowardly and distrusted the justice of God kept slipping away and going into exile[a].
translation:
  language: zh_hans
  text: 但那些胆怯、不相信上帝会施行审判的人，却不断逃走，离开本地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝会施行审判”直译为“上帝的审判”；也可理解为“上帝的公义”；按上下文，或指“上帝的报应”。
    reason: 说明δίκη可指上帝的司法审判、公义或报应性行动，保留其语义张力。
lexical_decisions:
- source_word: δειλανδροῦντες
  choice: 胆怯
  rationale: 该分词指失去勇气、表现怯懦；“胆怯”简洁自然，也保留原文略带责备的语气。
- source_word: ἀπιστοῦντες
  choice: 不信靠
  rationale: 此词带宾语“上帝的公义审判”，重点不是泛指不信，而是不相信、不倚赖上帝会施行公正的审判。
- source_word: τὴν τοῦ θεοῦ δίκην
  choice: 上帝公义的审判
  rationale: δίκη可指公义、公正的裁决或报应性的审判。“公义的审判”既表达上帝的公正，也保留其在历史中采取司法行动的含义，不把它限定为报仇或惩罚。
- source_word: διεδίδρασκον ἑαυτούς
  choice: 纷纷逃走
  rationale: 未完成时态表示持续或反复发生，反身结构强调使自己逃脱；“纷纷逃走”自然传达多人陆续逃离的动态。
- source_word: ἐξετόπιζον
  choice: 离乡避难
  rationale: 该动词表示离开原居地、流落外地。“离乡避难”符合上下文，又避免“被放逐”可能暗示的正式强制流放。
theological_decisions:
- issue: τὴν τοῦ θεοῦ δίκην的含义
  choice: 上帝公义的审判
  alternative: 上帝的公义；上帝的报应
  rationale: 原短语既可着重上帝公义这一属性，也可指上帝在具体事件中施行裁决乃至报应。“公义的审判”保留两者之间的张力，脚注则说明其他可能译法。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“纷纷逃走，离乡避难”读来流畅，并体现两个希腊动词所描写的持续逃离和离开故土。
