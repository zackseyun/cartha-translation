base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/018.yaml
  text: For they[a], he said, have put their confidence in weapons and boldness, but we have put our confidence in Almighty God, who is able with a single nod to bring down both those coming against us and the whole world.
translation:
  language: zh_hans
  text: 他说：“因为他们倚仗武器和胆量，我们却倚仗全能的上帝；他只要一个点头[a]，就能击倒那些前来攻击我们的人和整个世界。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个示意”或“一个信号”。希腊文原指“点头”或表示意旨的动作，强调上帝能毫不费力地击倒来犯者和整个世界。
    reason: 保留νεῦμα可指点头、示意或信号的词义范围，同时正文采用其具体而自然的主要意象。
lexical_decisions:
- source_word: ὅπλοις
  choice: 武器
  rationale: 此处指战争中使用的器械；“武器”现代、清楚，符合军事语境。
- source_word: τόλμαις
  choice: 胆量
  rationale: 该词表示作战时的勇气或大胆；“胆量”自然易懂，又不擅自加入“鲁莽”的贬义。
- source_word: πεποίθασιν / πεποίθαμεν
  choice: 所倚仗的是／所倚仗的却是
  rationale: 完成时表达已经确立并持续存在的信赖；重复“所倚仗”保留两句之间鲜明的平行和对比。
- source_word: ἐπὶ τῷ παντοκράτορι θεῷ
  choice: 全能的上帝
  rationale: ἐπί加与格在这里表示信心所依托的对象；结合“倚仗”，译文自然表达“倚仗全能的上帝”。
- source_word: παντοκράτορι
  choice: 全能的
  rationale: 作为上帝的称号，该词强调其统御一切的能力；“全能的”是庄重且通行的现代汉语表达。
- source_word: δυναμένῳ
  choice: 能
  rationale: 该分词修饰上帝，说明信赖他的根据；汉语用“能”简洁自然。
- source_word: τοὺς ἐρχομένους ἐφʼ ἡμᾶς
  choice: 那些前来攻击我们的人
  rationale: 原文直指向他们而来的人，并由语境表明敌对意图；“前来攻击我们”兼顾移动和敌意。
- source_word: τὸν ὅλον κόσμον
  choice: 整个世界
  rationale: κόσμος可指世界或宇宙；此处“整个世界”保留原句宏大的范围，同时不把含义限定为物质宇宙。
- source_word: ἑνὶ νεύματι
  choice: 只需一个示意
  rationale: νεῦμα指点头、示意或信号；“只需一个示意”自然地传达上帝毫不费力便能成事的意象，同时脚注保留更具体的词义。
- source_word: καταβαλεῖν
  choice: 击倒
  rationale: 该动词意为使之倒下或推翻；“击倒”既适用于来犯者，也保留原文将其延伸到整个世界的强烈修辞。
theological_decisions:
- issue: 神圣称号 παντοκράτωρ 的译法
  choice: 全能的上帝
  alternative: 掌管万有的上帝
  rationale: “全能的上帝”是现代汉语中庄重而通行的称号，保留上帝无上能力这一信心根据；不把称号缩减为一般性的“强大”。
- issue: κόσμος 在上帝能力陈述中的范围
  choice: 整个世界
  alternative: 整个宇宙
  rationale: 原句用广阔的修辞强调上帝绝对的能力；“世界”保留 κόσμος 常见而开放的语义，不强行限定其宇宙论范围。
- issue: καταβαλεῖν 同时支配敌人和整个世界
  choice: 保留同一个动词“击倒”统摄两者
  alternative: 分别译为“击倒敌人、颠覆世界”
  rationale: 原文让同一不定式同时作用于来犯者和整个世界，形成强烈甚至带张力的修辞；译文不将其拆解或弱化。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。把“他说”置于引语之前，使汉语自然；以分号保持敌我所倚仗对象的对照。“甚至”显明“那些来犯者”和“整个世界”之间递进式的广度，同时不消解原文的夸张张力。
