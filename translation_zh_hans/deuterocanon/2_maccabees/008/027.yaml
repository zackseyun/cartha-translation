base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/027.yaml
  text: After they had collected their weapons and stripped the spoils from the enemies[a], they devoted themselves to the Sabbath, abundantly blessing and giving thanks to the Lord who had preserved them to this day[b], having appointed for them the beginning of mercy.
translation:
  language: zh_hans
  text: 他们收集了兵器，又剥取敌人的战利品后，便转而遵守安息日[a]，格外称颂并感谢那位保全他们直到这一天的主；他已为他们定下怜悯的开端[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文表达较为含蓄，也可译作“他们开始专注于安息日”。这可能是指安息日临近或来到时，他们转而遵守安息日。
    reason: lexical_alternative
  - marker: b
    text: “怜悯的开端”也可理解为“开始施予怜悯”或“怜悯初现的记号”。原文可表示这次保全是神向他们施怜悯的开始。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁπλολογήσαντες
  choice: 收集了兵器
  rationale: 该分词在战后语境中指收拢兵器；原文没有明确说明兵器原属哪一方，因此中文也不增补归属。
- source_word: τὰ σκῦλα ἐκδύσαντες τῶν πολεμίων
  choice: 从敌人身上取下战利品
  rationale: ἐκδύω带有从人身上剥取之意，这一译法保留其具体动作，也自然表达夺取败敌战利品的意思。
- source_word: περὶ τὸ σάββατον ἐγίνοντο
  choice: 就转而守安息日
  rationale: 这是较为含蓄的希腊语习语，表示他们把注意力转向安息日及其遵守；译文不擅自添加具体仪式。
- source_word: περισσῶς
  choice: 热切地
  rationale: 该副词加强随后称颂和感谢的程度；“热切地”在现代汉语敬拜语境中自然，同时传达强烈、充沛之意。
- source_word: εὐλογοῦντες καὶ ἐξομολογούμενοι
  choice: 称颂并感谢
  rationale: 前者在以主为对象时宜译作“称颂”，后者在蒙拯救后的敬拜语境中表示公开承认恩惠并献上感谢。
- source_word: τῷ κυρίῳ τῷ διασώζοντι εἰς τὴν ἡμέραν ταύτην
  choice: 主保全他们直到这一天
  rationale: διασώζω表示使人安全度过危难；“保全……直到这一天”忠实保留持续至当日的时间意味。
- source_word: ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: 并为他们定下了怜悯的开端
  rationale: τάσσω有安排、指定、定下之意；直译“怜悯的开端”保留这是神恩初始而非全部实现的张力。
theological_decisions:
- issue: ἀρχὴν ἐλέους τάξαντος αὐτοῖς所描述的神圣行动
  choice: 这次保全是主为百姓定下的“怜悯的开端”
  alternative: 主赐给他们初次的怜悯／这是怜悯开始的记号
  rationale: 原文将此次拯救描述为怜悯的起始，却没有说完全复兴已经实现；保留“开端”可避免把经文扩解为全面复兴或特定的圣约更新。
- issue: 分词τάξαντος的主语关系
  choice: 明确承接“主”，译为“主……并为他们定下”
  alternative: 保持悬垂结构：“为他们定下了怜悯的开端”
  rationale: 希腊语属格分词在句法上指向主；中文明确主语可避免误读为百姓自己定下怜悯，同时不改变原文神学内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“称颂并感谢”保留两个并列敬拜动作；“怜悯的开端”刻意保留原文略显凝练的神学表达。所有脚注标记均置于正文相应位置。
