base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/014.yaml
  text: But they were selling all that remained[a], and at the same time were imploring the Lord to rescue those who had been sold by the ungodly Nikanor before he encountered them.
translation:
  language: zh_hans
  text: 他们却变卖所有剩下的东西，同时恳求主在不敬神的尼加挪遇上那些已被他卖掉的人以前，解救他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按上下文，也可更明确地译作“被卖为奴的人”。希腊文只说“被卖掉的人”。
    reason: 说明上下文隐含但原文未明说的奴隶买卖含义。
lexical_decisions:
- source_word: τὰ περιλελειμμένα πάντα
  choice: 一切剩下的东西
  rationale: 完整表达πάντα的全面含义，并以“剩下的东西”自然呈现完成时分词所指的剩余财物，不擅自限定具体种类。
- source_word: ἐπώλουν
  choice: 变卖
  rationale: 未完成时表示当时正在进行的行动；“变卖”在财物语境中自然，也与后文卖人的“卖掉”有所区分。
- source_word: ὁμοῦ δὲ
  choice: 同时
  rationale: 明确表达两项行动同时进行。
- source_word: τὸν κύριον
  choice: 主
  rationale: 此处是向神祈求，译作“主”符合语境和项目惯例。
- source_word: ἠξίουν
  choice: 恳求
  rationale: 传达危难中向神迫切请求的语气，而不使用过于古雅的措辞。
- source_word: ῥύσασθαι
  choice: 解救
  rationale: 对应从现实危险和奴役处境中救出的含义，不额外引入更广泛的救恩术语。
- source_word: τοὺς ... πεπραμένους
  choice: 那些……已经被他卖掉的人
  rationale: 保留完成时分词所表达的先前已完成且结果持续的行动；正文不添加希腊文未明说的“为奴”。
- source_word: ὑπὸ τοῦ δυσσεβοῦς Νικάνορος
  choice: 被不敬神的尼加挪……被他
  rationale: “不敬神”保留该词的宗教和道德贬义；“尼加挪”按希腊语人名音译，并用“他”使较长句式清楚自然。
- source_word: πρὶν συντυχεῖν
  choice: 还在……遇上他们以前
  rationale: 保留“在相遇之前”的时间关系，不把相遇进一步限定为战斗或交锋；不定式的隐含主语按最近的“尼加挪”理解。
theological_decisions:
- issue: 祷告中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 祈求的对象是神，因此“主”最符合语境；“主人”会造成不必要的世俗含义。
- issue: 是否明说这些人被卖为奴
  choice: 正文只说“被他卖掉的人”
  alternative: “被他卖作奴隶的人”
  rationale: 上下文强烈暗示贩卖为奴，但πεπραμένους本身只明说“被卖”；正文保留原文措辞，脚注交代语境含义。
- issue: πρὶν συντυχεῖν中省略成分的处理
  choice: 译为尼加挪“遇上他们以前”
  alternative: “与他们交锋以前”
  rationale: 军事语境可以支持“交锋”，但原词本身可泛指相遇；选用较宽的“遇上”以保存原文的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“变卖”描述处置剩余财物，用“卖掉”描述卖人，既自然又避免中文重复造成的歧义；保留原文长句中的同时性和先后关系。
