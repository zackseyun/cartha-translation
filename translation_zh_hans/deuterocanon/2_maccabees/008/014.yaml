  source_fidelity: 译文准确传达了变卖余物、同时祈求主解救被尼加挪卖掉者的主要内容，也没有在正文中把“被卖”擅自限定为“卖为奴”。但原句把“还在……以前，就已经被他卖掉”嵌入关系从句，使“以前”看似修饰“被卖掉”，没有清楚表达πρὶν συντυχεῖν所限定的是祈求解救的时限，即在尼加挪遇上那些被卖者之前。
  naturalness: “那些还在不敬神的尼加挪遇上他们以前，就已经被他卖掉的人”句法负担过重，“还在……以前，就已经……”也不自然。重组时间状语后，现代书面普通话会更清晰流畅。
  terminology: “主”“恳求”“解救”“不敬神的尼加挪”均恰当。“变卖所有剩下的东西”保留原文未具体说明的对象，避免过度限定为财物。
