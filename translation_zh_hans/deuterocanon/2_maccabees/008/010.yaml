base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/010.yaml
  text: But Nikanor undertook to pay to the king the tribute owed to the Romans[a], amounting to two thousand talents[b], from the captivity of the Jews.
translation:
  language: zh_hans
  text: 尼迦挪却承诺，要用俘获犹太人所得的钱，替王缴清欠罗马人的贡款[a]，共计二千他连得[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文表达很紧凑，较直译可作：“给王、为罗马人的贡款。”这里很可能是说，尼迦挪打算替王履行向罗马缴纳贡款的义务。
    reason: alternative_reading
  - marker: b
    text: “他连得”是古代重量兼货币计算单位。这里的意思是，尼迦挪企图通过俘获犹太人，并从出售俘虏或索取赎金等方式获利，筹足这笔款项；但经文本身没有明说具体获利方式。
    reason: cultural_note
lexical_decisions:
- source_word: ἰδιωτεύσατο
  choice: 承诺
  rationale: 此处表示尼迦挪亲自承担并许诺履行一项财务责任；“承诺”自然明白，也不把具体行政方式说得过死。
- source_word: φόρον
  choice: 贡款
  rationale: φόρος在此指向强权缴纳的贡赋；“贡款”比泛称“税款”更符合王国向罗马付款的政治背景。
- source_word: τῷ βασιλεῖ
  choice: 替王
  rationale: 与后面的罗马关系合看，此与格表示尼迦挪为王承担这笔付款；译作“替王”使现代汉语关系清楚。
- source_word: τοῖς ις Ῥωμαίοις
  choice: 欠罗马人的
  rationale: 所给文本中的“ις”疑为版面或转录杂质；核心短语τοῖς Ῥωμαίοις为“给罗马人”。结合上下文，指王所欠罗马的贡款；脚注保留希腊文压缩表达的另一种直译方式。
- source_word: ὄντα τάλαντων δισχιλίων
  choice: 共计二千他连得
  rationale: 准确表达分词所连接的金额总数，并保留古代重量兼货币单位，不作不可靠的现代币值换算。
- source_word: ἐκ τῆς τῶν Ἰουδαίων αἰχμαλωσίας
  choice: 用俘获犹太人所得的钱
  rationale: 直译为“从犹太人的被俘”；语境表明款项将从抓捕犹太人并由此获利而来。补出“所得的钱”使筹款关系符合现代汉语，同时不限定获利必然只来自出售或赎金。
- source_word: ἐκπληρώσειν
  choice: 缴清
  rationale: 该动词在财务语境中指履行、补足或清偿义务；“缴清”兼顾付款及足额履行的含义。
theological_decisions:
- issue: τῷ βασιλεῖ τοῖς Ῥωμαίοις的紧缩关系
  choice: 理解为尼迦挪替王缴纳王欠罗马人的贡款
  alternative: 较形式地译为“给王、为罗马人的贡款”或“给王的贡款，给罗马人”
  rationale: 希腊文句法紧缩，单靠形式可产生歧义；上下文所指最可能是王对罗马的财务义务。正文采用通顺的主读法，脚注明示较直译的结构，避免把歧义完全隐藏。
- issue: ἐκ τῆς τῶν Ἰουδαίων αἰχμαλωσίας所指的获利方式
  choice: 概括为从俘获犹太人所得的钱
  alternative: 明确译为出售犹太俘虏或收取赎金所得
  rationale: 经文本身只说“从犹太人的被俘”，没有明说出售或赎金；因此正文保留概括表达，脚注说明可能的实际方式而不将其写成经文明言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“尼迦挪”沿用常见次经人名译法；“他连得”保留传统且可识别的古代单位名称。正文重组语序以清楚呈现资金来源、代王付款及收款对象，同时用脚注保存原文紧缩句法的歧义。
