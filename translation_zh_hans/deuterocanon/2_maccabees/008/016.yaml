base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/016.yaml
  text: Then Maccabeus[a], after gathering those with him, about six thousand in number, urged them not to be terrified by the enemy, nor to fear the great multitude of the nations that had come against them unjustly, but to fight bravely,
translation:
  language: zh_hans
  text: 马加比召集了身边的人，共六千人，就勉励他们不要被囚犯[a]吓倒，也不要惧怕那些无理前来攻击他们的列国的众多军兵，反要英勇作战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文通常指“囚犯”、“俘虏”或“被捆绑的人”。此处措辞难解，因为上下文所述的是来攻的敌对势力；有些译法按语境译作“敌人”，但现存词形本身并不通常具有此义。
    reason: 保留δεσμίοις的通常词义，并说明它与上下文之间的语义困难；不将推测性的语境解释直接写入正文。
lexical_decisions:
- source_word: Συναγαγὼν
  choice: 召集了
  rationale: 不定过去时分词表示先于主句动作发生；汉语以“召集了……便”自然呈现先后关系。
- source_word: ὁ Μακκαβαῖος
  choice: 马加比
  rationale: 按人物称号音译，保持与本书通行称呼一致。
- source_word: τοὺς περὶ αὐτὸν ὄντας
  choice: 跟随他的人
  rationale: 原义为“在他周围的人”；此处指与他同行并受其带领的一群人，避免过度具体化为“士兵”。
- source_word: ἀριθμὸν ἑξακισχιλίους
  choice: 共六千人
  rationale: 希腊文明确给出六千之数，并无表达“大约”的独立词语；因此不添加“约”。
- source_word: παρεκάλει
  choice: 勉励
  rationale: 在战前讲话的语境中，兼具鼓舞与劝促之意，语体庄重而自然。
- source_word: μὴ καταπλαγῆναι
  choice: 不要……惊恐
  rationale: 表达因威势而陷入强烈恐惧，保留被震慑、惊慌的力度。
- source_word: τοῖς δεσμίοις
  choice: 那些被捆绑的人
  rationale: δεσμίοις通常意为“被捆绑者、囚犯”；原文此处含义困难，不在正文中无依据地改作“敌人”，并以脚注说明语境问题。
- source_word: μηδὲ εὐλαβεῖσθαι
  choice: 也不要惧怕
  rationale: 此处表示畏惧、戒惧，与前一否定不定式形成平行。
- source_word: τὴν τῶν ... ἐθνῶν πολυπληθείαν
  choice: 那些……列国人多势众
  rationale: 将抽象名词“众多”自然转化为现代汉语“人多势众”，同时保留ἐθνῶν的民族—政治含义。
- source_word: ἀδίκως παραγενομένων ἐπʼ αὐτοὺς
  choice: 无理前来攻打他们的
  rationale: ἀδίκως表示不义、不公或无理；ἐπʼ αὐτούς在军事语境中表示针对他们而来，译作“攻打”使关系清楚。
- source_word: ἀγωνίσασθαι γενναίως
  choice: 英勇作战
  rationale: ἀγωνίζομαι在此为军事争战，γενναίως表示勇敢、刚毅；合译简洁有力。
theological_decisions:
- issue: ἐθνῶν在犹太军事叙事中的译法
  choice: 列国
  alternative: 外邦人；各民族
  rationale: 此词指敌对的非犹太各族或各国势力。“列国”保留其群体及政治色彩，又避免把后期神学术语强加于文本。
- issue: 困难词τοῖς δεσμίοις的处理
  choice: 正文直译为“那些被捆绑的人”，脚注交代语境疑难
  alternative: 敌人；俘虏；囚犯
  rationale: 现有希腊文本的通常词义确为“被捆绑的人、囚犯”，但与上下文的敌军场景衔接困难。为保存真实的文本张力，不在正文中静默校正为“敌人”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式以“不要……也不要……反要……”重现原文劝勉结构；对δεσμίοις保留歧义并加注。
