base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/005.yaml
  text: But when Maccabaeus had formed a band[a], he had by then become irresistible to the nations, because the wrath of the Lord had turned to mercy.
translation:
  language: zh_hans
  text: 马加比有了一支队伍后[a]，列国[b]已经无法抵挡他，因为主的烈怒已经转为怜悯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“马加比加入一个有组织的团体后”或“马加比组织起一支队伍后”。原文仅说他处在一个有组织的群体中，未明确他是加入该团体还是亲自组织它，也未说明其规模。
    reason: 保留γενόμενος ἐν συστήματι关于马加比与该有组织群体之关系的表达幅度。
  - marker: b
    text: 直译“列国”；这里可指犹太地周围的非犹太民族或势力。
    reason: 说明ἔθνη可泛指列国，也可在本段语境中指周边的非犹太群体。
lexical_decisions:
- source_word: γενόμενος ... ἐν συστήματι
  choice: 结成一支队伍后
  rationale: 原文表达马加比进入一个有组织的集体或队伍之中。此译简明自然，也符合上下文的武装行动场景，但不具体限定队伍规模。
- source_word: ἀνυπόστατος
  choice: 无法抵挡
  rationale: 该词表示不能与之对抗或抗拒；译为“无法抵挡”既传达其强烈程度，也符合现代汉语的军事语境。
- source_word: τοῖς ἔθνεσιν
  choice: 各外族
  rationale: 此处指犹太地周边的非犹太民族或势力。“各外族”比泛称“列国”更清楚地呈现语境，同时脚注保留“列国”的形式对应。
- source_word: τῆς ὀργῆς
  choice: 烈怒
  rationale: “烈怒”保留神圣震怒的分量和经文庄重语气，比一般的“愤怒”更有力度。
- source_word: τοῦ κυρίου
  choice: 主
  rationale: 此处κύριος指以色列的上帝，按称号译为“主”。
- source_word: εἰς ἔλεον τραπείσης
  choice: 已经转为怜悯
  rationale: 保留从烈怒转为怜悯的变化意象；“怜悯”准确表达ἔλεος，也符合现代中文宗教叙事语体。
theological_decisions:
- issue: 末尾独立属格结构的逻辑关系与神的态度变化
  choice: 因为主的烈怒已经转为怜悯
  alternative: 主的烈怒既已转为怜悯
  rationale: 上下文中该结构最自然地说明马加比之所以无人能挡的原因。译文明确其因果作用，同时保留“烈怒转为怜悯”本身的神学张力，不另行解释变化机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“结成一支队伍”避免使用过于现代的军制术语；“无法抵挡他”自然呈现原文的强烈军事含义；因果句保留经文将胜利归因于主由怒转怜悯的表述。
