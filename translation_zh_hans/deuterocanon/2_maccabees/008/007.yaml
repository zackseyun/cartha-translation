  text: He especially took the nights as allies for such attacks[b][a], and the report of his valor spread everywhere.
translation:
  language: zh_hans
  text: 他尤其把黑夜当作这类袭击的盟友[a]；他的勇武之名[b]传遍各处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“把黑夜当作这类袭击的协助者”，将黑夜描写成他行动中的盟友。
    reason: lexical_alternative
  - marker: b
    text: 这里的希腊文表达（ἡ ἁλὴ τῆς εὐανδρείας αὐτοῦ）较为罕见，按上下文似指他勇武的声名或相关传闻广为传开。
    reason: textual_difficulty
lexical_decisions:
- source_word: μάλιστα
  choice: 尤其
  rationale: 保留副词的强调作用，表明他特别善于借助夜间行动。
- source_word: τὰς νύκτας … συνεργοὺς ἐλάμβανεν
  choice: 把黑夜当作……的盟友
  rationale: 保留希腊文把“黑夜”人格化为协助者的军事性比喻，同时符合现代汉语表达。
- source_word: πρὸς τὰς τοιαύτας ἐπιβολὰς
  choice: 这类袭击
  rationale: ἐπιβολή在此指敌对的突袭或进攻行动；“袭击”简明，也切合上下文。
- source_word: ἡ ἁλὴ τῆς εὐανδρείας αὐτοῦ
  choice: 他英勇善战的名声
  rationale: 原文措辞罕见，但语境指其战场勇武所带来的声名；“英勇善战”自然传达εὐανδρεία在军事语境中的勇武含义。
- source_word: διηχεῖτο πανταχῇ
  choice: 传遍各处
  rationale: 该动词含声音传开、消息广为人知之意；此译兼顾传播意象与自然汉语。
