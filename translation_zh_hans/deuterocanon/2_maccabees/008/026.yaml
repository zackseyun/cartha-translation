  yaml_path: translation/deuterocanon/2_maccabees/008/026.yaml
  text: For it was the day before the Sabbath[a], and for that reason they did not continue pursuing them for long.
translation:
  language: zh_hans
  text: 因为那天是安息日的前一天[a]，他们没有长时间追赶敌人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特版希腊文本在这里的措辞“ἡ πρὸ τοῦ σαββάτου δίκη”在文本和词义上都较为费解；其中δίκη通常意为“公正、刑罚、诉讼”。本译文按照上下文所显示的明确意思处理为安息日临近，因此他们没有继续追赶太久。
    reason: textual_variant
lexical_decisions:
- source_word: ἦν γὰρ
  choice: 因为那天是
  rationale: γάρ承接上文说明原因；汉语用“因为”自然呈现因果关系，并以“那天”补足时间语境。
- source_word: ἡ πρὸ τοῦ σαββάτου δίκη
  choice: 安息日前一天
  rationale: 斯威特文本中的δίκη在此处词义突兀；结合πρὸ τοῦ σαββάτου及下句停止追赶的语境，译出明确的时间意义，同时用脚注保留原文疑难。
- source_word: διʼ ἣν αἰτίαν
  choice: 所以
  rationale: 该短语意为“因此、为此缘故”；“所以”与前面的“因为”构成现代汉语中清楚自然的因果结构。
- source_word: οὐκ ἐμακροτόνησαν
  choice: 没有长时间
  rationale: 动词表示不把行动延长；与分词“追赶”结合，意为没有持续追赶很久。
- source_word: κατατρέχοντες αὐτούς
  choice: 追赶敌人
  rationale: κατατρέχω在军事语境中指追赶、追击；αὐτούς所指为敌方人员，译作“敌人”比孤立的“他们”更清楚。
