base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/033.yaml
  text: And while they were celebrating the victory in their homeland[a], they burned those who had set fire to the sacred gates, including Kallisthenes, who had fled into a certain house for shelter; and he received the reward worthy of his ungodliness.
translation:
  language: zh_hans
  text: 他们在故乡庆祝胜利时，用火烧了那些曾放火焚烧神圣门楼的人，又烧了逃进一所住处避难的卡利斯提尼[a]；他得到了与其不虔敬相称的报应。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逃进一处住所以求避难。”这里译作“住处”的希腊语ἐνοίκιον用法罕见，所指地点的确切性质不能确定。
    reason: 词义存在不确定性，需保留原文对卡利斯提尼藏身地点的含混。
lexical_decisions:
- source_word: ἐπινίκια ... ἄγοντες
  choice: 庆祝胜利
  rationale: 这一习语指战后的胜利庆典；译文自然保留庆祝之意。
- source_word: ἐν τῇ πατρίδι
  choice: 在故乡
  rationale: πατρίς指本乡、本国或故土；“故乡”简洁自然，也未过度限定政治疆域。
- source_word: τοὺς ἐμπρήσαντας τοὺς ἱεροὺς πυλῶνας
  choice: 那些曾放火焚烧圣门的人
  rationale: ἐμπρήσαντας表示放火焚烧；ἱεροὺς赋予门楼宗教性的神圣含义。“圣门”保留礼仪与圣所语境，而不擅自补明具体建筑位置。
- source_word: Καλλισθένην
  choice: 加利斯提尼
  rationale: 按希腊人名Καλλισθένης音译，并采用现代汉语中清楚易读的形式。
- source_word: ὑφήψαν
  choice: 烧死了
  rationale: 该动词有从下点燃、纵火焚烧之意；此处以人为宾语，语境表明是致死性的焚烧，故译为“烧死了”。
- source_word: εἰς ἐνοίκιον πεφευγότα
  choice: 逃进一处住所藏身
  rationale: πεφευγότα明确表达逃入避难；ἐνοίκιον用法罕见，似指居所或住处。“一处住所”保留地点性质，同时不武断确定其建筑类型。
- source_word: τὸν ἄξιον τῆς δυσσεβείας ... μισθόν
  choice: 得到了与其不敬虔相称的报应
  rationale: μισθός本指工价、酬报，在审判语境中带有应得报偿的反讽意味；“报应”在现代汉语中准确表达负面的应得结果。
- source_word: δυσσεβείας
  choice: 不敬虔
  rationale: 该词表示对神圣之事的不敬与邪恶，兼有宗教和伦理判断；“不敬虔”清楚保留这层意义。
theological_decisions:
- issue: ἱεροὺς πυλῶνας的圣所含义
  choice: 圣门
  alternative: 圣所的门楼；神圣的门
  rationale: 原文说明这些门属于神圣领域，却没有明确给出更具体的建筑名称；“圣门”既保留宗教含义，也避免过度具体化。
- issue: δυσσεβείας的宗教伦理判断
  choice: 不敬虔
  alternative: 亵渎；不虔敬
  rationale: “不敬虔”保留原词针对神圣之事的负面评价，又不把含义缩窄为某一种具体的亵渎行为。
- issue: μισθόν在惩罚语境中的反讽
  choice: 报应
  alternative: 应得的报偿；工价
  rationale: 原文以“酬报、工价”表达罪行所得的惩罚；“报应”能让现代读者直接理解其负面和应得性质，同时不加入特定教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“烧死了”明确呈现上下文中的致死结果；“报应”传达μισθός在此处的反讽和审判意味。脚注标记置于存在词义疑难的“住所藏身”之后。
