lexical_decisions:
- source_word: τάξας
  choice: 委派
  rationale: 该不定过去时分词表示犹大在交战前所作的军事部署；“委派”自然表达指定人员承担统领职责的意思。
- source_word: ἀδελφοὺς αὐτοῦ
  choice: 自己的兄弟
  rationale: 按通常亲属义翻译为“兄弟”，不无根据地弱化为“亲属”或“同胞”。
- source_word: προηγουμένους
  choice: 率领
  rationale: 本义为“走在前面”，在军事语境中指居前带领、担任首领；“率领”兼顾其形象与实际职能。
- source_word: ἑκάτερας τάξεως
  choice: 各率领一队
  rationale: τάξις在此指编排成形的军事队伍；结合三位具名统领，采用分配性的“各……一队”，比生硬的“每一个阵列”更符合现代汉语。
- source_word: ὑποτάξας ἑκάστῳ
  choice: 给每人配属
  rationale: 原文意为把兵员置于每位统领之下；“配属”是清楚而不过度现代化的军事表达。
- source_word: χιλίους πρὸς τοῖς πεντακοσίοις
  choice: 一千人，另加五百人
  rationale: 保留希腊文“一千，外加五百”的累加结构；补出量词“人”，明确所数的是兵员。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“配属”准确表达军队被置于各统领麾下的关系；保留原文数字的累加说法，并以脚注说明总数。原文由两个分词结构构成并承接上下文，中文为本节独立可读而用完整陈述句表达。
