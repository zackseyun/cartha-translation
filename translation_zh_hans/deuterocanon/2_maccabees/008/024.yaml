base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/024.yaml
  text: But with the Almighty as their ally, they slaughtered more than nine thousand of the enemy, and they wounded and maimed most of Nicanor’s army, and forced them all to flee.
translation:
  language: zh_hans
  text: 有全能者作他们的盟友，他们就杀了敌军九千多人；又使尼加挪军队的大部分人受伤、肢体残废，并迫使他们全都逃跑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ παντοκράτορος
  choice: 全能者
  rationale: 这是用于上帝的称号，表达掌管一切、拥有全能；“全能者”在现代汉语中庄重、自然，也不增添原文以外的解释。
- source_word: συμμάχου
  choice: 盟友
  rationale: 该词指并肩作战者；“盟友”保留明确的军事语义，比泛指的“帮助者”更贴近原文。
- source_word: κατέσφαξαν
  choice: 杀了
  rationale: 原词语气强烈，指在战斗中大量杀戮；汉语“杀了敌军九千多人”自然直接，而“屠杀”在现代语境中可能额外暗示杀害无抵抗者。
- source_word: ὑπὲρ τοὺς ἐννακισχιλίους
  choice: 九千多人
  rationale: ὑπέρ加宾格在此表示数量超过九千；“九千多人”是简明自然的现代汉语表达。
- source_word: τραυματίας
  choice: 受伤
  rationale: 此处指战斗中成为伤员的人；“受伤”清楚保留军事语境。
- source_word: τοῖς μέλεσιν ἀπηρεῖς
  choice: 肢体残废
  rationale: 该短语直指肢体受到严重损伤而失去正常功能；“肢体残废”保留身体部位与永久性损害的含义。
- source_word: τὸ πλεῖον μέρος τῆς τοῦ Νικάνορος στρατειᾶς
  choice: 尼加挪军队的大部分人
  rationale: 原文指尼加挪所率部队中的大多数；补出“人”可使“受伤、肢体残废”的搭配在汉语中更清晰。
- source_word: πάντας δὲ φεύγειν ἠνάγκασαν
  choice: 并迫使所有人逃跑
  rationale: 保留ἠνάγκασαν的强制使动含义和πάντας的全称范围；“逃跑”符合自然现代汉语。
theological_decisions:
- issue: 军事拯救语境中神圣称号παντοκράτωρ的译法
  choice: 全能者
  alternative: 统管万有者
  rationale: “全能者”忠实表达上帝至高的能力，又是现代汉语中成熟、庄重的神圣称号；不把称号扩展成超出本节措辞的教义说明。
translation_notes:
  register: 采用现代、庄重而直接的叙事语体。句式保留原文从上帝成为盟友，到杀敌、重创大部分军队并迫使全军逃跑的行动推进。无脚注。
