base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/002.yaml
  text: And they were calling on the Lord to look upon the people trampled down by all[a], and also to have mercy on the temple that had been defiled by ungodly men;
translation:
  language: zh_hans
  text: 他们不断呼求主，求他垂顾那受众人践踏的百姓，也怜悯那已被不敬神之人亵渎的圣殿[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“玷污”或“使成为俗物”。希腊文强调，这座神圣的殿被不敬神的人当作凡俗之物对待。
    reason: 说明 βεβηλόω 的圣俗含义，并保留“玷污”这一可能译法。
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: 不断呼求
  rationale: 未完成时表示持续或反复的祈求；“呼求”自然保留向神恳切求告的宗教语境。
- source_word: τὸν κύριον
  choice: 主
  rationale: 此处是向以色列的神祷告；“主”是现代汉语中庄重、自然的神圣称谓，又不额外明说原文未出现的神名。
- source_word: ἐφιδεῖν
  choice: 垂顾
  rationale: 该词在祈祷中不只是视觉上的“看见”，而是求神留意并眷顾；“垂顾”简洁、庄重，并含有恳求意味。
- source_word: τὸν ... λαόν
  choice: 百姓
  rationale: 指作为整体的以色列民；“百姓”比泛泛的“人们”更符合历史和群体语境。
- source_word: ὑπὸ πάντων καταπατούμενον
  choice: 受众人践踏的
  rationale: 保留“践踏”的鲜明暴力与羞辱意象，也忠实保留 πάντων 所表达的广泛范围，不擅自限定施事者。
- source_word: οἰκτεῖραι
  choice: 怜悯
  rationale: 表达因苦难而生的慈怜，适合向神祈求的语境，也比单纯“可怜”更庄重。
- source_word: τὸν ναὸν
  choice: 圣殿
  rationale: 所指是耶路撒冷圣殿；现代中文圣经语体通常以“圣殿”明确其神圣用途。
- source_word: βεβηλωθέντα
  choice: 已被……亵渎
  rationale: 完成时被动分词表示亵渎已经发生并留下现存后果；“亵渎”准确表达将神圣之物当作俗物对待。
- source_word: ὑπὸ τῶν ἀσεβῶν ἀνθρώπων
  choice: 被不敬神之人
  rationale: ἀσεβής 特指对神缺乏敬畏或虔诚，不只是一般的邪恶；“不敬神之人”清楚保留其宗教含义，而“之人”也适合此处概括施事者。
theological_decisions:
- issue: 祷告中 κύριος 的译法
  choice: 主
  alternative: 主人
  rationale: “主”能表达对神的尊崇，并符合中文祷告语言；“主人”会使现代读者误解为一般人际主从关系。
- issue: ἀσεβῶν ἀνθρώπων 的性别表达
  choice: 不敬神之人
  alternative: 不敬神的男人
  rationale: ἄνθρωπος 在复数中可泛指人类成员，此处重点是亵渎圣殿者的不虔敬性质，原文并未以 ἀνήρ 特别强调男性；因此不额外强化生理性别。
- issue: βεβηλωθέντα 所表达的圣俗张力
  choice: 亵渎
  alternative: 玷污
  rationale: “亵渎”保留神圣之物被当作凡俗之物对待的含义；脚注列出较偏向污染意象的译法，以保存词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的祷告叙事语体。“不断呼求”体现未完成时的持续性；“垂顾”“怜悯”“圣殿”保持经文应有的肃穆感。句末分号保留本节与后续祈求在句法上的连续性。
