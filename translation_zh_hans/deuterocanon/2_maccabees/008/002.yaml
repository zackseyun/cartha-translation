  source_fidelity: 译文准确反映希腊文的祈祷性未完成时（“不断呼求”）、两个并列不定式祈求（“求他垂顾……也怜悯……”），以及百姓受践踏、圣殿已遭亵渎的意象。“受众人践踏”恰当保留ὑπὸ πάντων的宽泛表达，未擅自界定施事者；“已被……亵渎”也妥当表达完成被动分词所指已经发生的亵渎及其相关状态。
