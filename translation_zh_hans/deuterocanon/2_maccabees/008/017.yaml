  text: having set before their eyes the lawless outrage committed by them against the holy place, and the abuse of the city that had been mocked, and also the overthrow of the ancestral way of life.
translation:
  language: zh_hans
  text: 他们把这些事摆在眼前：那些人对圣所所犯的无法无天的暴行，对那座受人嘲弄的城所施的凌辱，以及对祖传生活秩序的毁坏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生活秩序”也可译作“生活方式”或“政制”。原文所指范围较广，包括由祖传律法塑造的共同体生活、规范和秩序。
    reason: 说明πολιτεία的语义宽度，避免将其限定为现代政治制度或仅指私人生活方式。
lexical_decisions:
- source_word: πρὸ ὀφθαλμῶν λαβόντας
  choice: 把这些事摆在眼前
  rationale: 保留“置于眼前、牢记并正视”的具体意象，也用“这些事”自然引出后列三项。
- source_word: ἀνόμως … ὕβριν
  choice: 肆意妄为，亵渎
  rationale: ἀνόμως表示违法、悖逆正道，ὕβρις表示傲慢暴行或凌辱；结合圣所这一受事对象，译作“肆意妄为，亵渎”兼顾行为的无法无天与宗教性冒犯。
- source_word: τὸν ἅγιον τόπον
  choice: 圣所
  rationale: 此处指神圣地点，即圣殿范围；“圣所”简洁并保留原文措辞。
- source_word: τὴν τῆς ἐμπεπαιγμένης πόλεως αἰκισμόν
  choice: 凌辱了那座受尽嘲弄的城
  rationale: αἰκισμός含虐待、侮辱、蹂躏之意；ἐμπεπαιγμένης为完成时被动分词，强调城已经成为嘲弄对象。
- source_word: προγονικῆς πολιτείας
  choice: 祖先传下来的生活制度
  rationale: πολιτεία在此不只指抽象“生活方式”，也可涵盖共同体按祖传律法形成的制度与秩序；此译保留其社会性宽度。
- source_word: κατάλυσιν
  choice: 废除
  rationale: 表达拆毁、瓦解既有秩序；与“生活制度”搭配时，“废除”自然且有力度。
theological_decisions:
- issue: “圣所”所受冒犯的表达
  choice: 亵渎了圣所
  alternative: 对圣所施行无法无天的暴行
  rationale: 原文以ὕβρις表达凌辱性暴行，并由ἀνόμως修饰；“亵渎”符合圣所语境，但同时以“肆意妄为”保留ἀνόμως所含的违法悖逆意味，不把事件仅缩减为礼仪上的污秽。
- issue: προγονικῆς πολιτείας的范围
  choice: 祖先传下来的生活制度
  alternative: 祖传的生活方式／祖传政制
  rationale: 该词可能兼指祖传律法、社会秩序和生活方式；避免单译为现代意义上的“政体”，也避免只作私人习俗，从而保留其宽泛含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原句在上下文中是承接前文的分词结构；中文以“他们要……”表达劝勉语气，并用冒号和分号清楚呈现三项并列内容。
