base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/023.yaml
  text: He also brought Eleazar[a], and after bringing forward the holy book and giving the watchword[b], “God’s Help,” he himself led the first company and engaged Nicanor.
translation:
  language: zh_hans
  text: 他又委派以利亚撒[a]。他带出圣书，并定下“上帝的帮助”为口令[b]；亲自率领第一队[c]，与尼迦挪交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文简略作“此外还有以利亚撒”，动词承接上文；这里按上下文补作“委派”。
    reason: ellipsis_clarification
  - marker: b
    text: 也可理解为“来自上帝的帮助”或“上帝是帮助”。原文措辞简短，可以有不止一种理解。
    reason: lexical_alternative
  - marker: c
    text: “队”原文是军事单位名称，也可译作“分队”或“大队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ καὶ Ἐλεάζαρον
  choice: 他还安排了以利亚撒
  rationale: 原文是省略结构，直译为“此外还有以利亚撒”；结合上文分派人员统领队伍的语境，补出“安排了”，使现代中文完整自然，同时用脚注说明原文的简略形式，不把补足内容伪装成明说。
- source_word: παραγαγὼν τὴν ἱερὰν βίβλον
  choice: 他把圣书拿到众人面前
  rationale: παράγω在这里表示带出、拿到面前；τὴν ἱερὰν βίβλον是其宾语。译文不采用部分传统译本的“诵读圣书”，因为所给希腊文本本身没有“读”的动词。
- source_word: σύνθημα
  choice: 口令
  rationale: 该词在军事语境中指事先约定、用于识别或行动的信号或口令；“口令”既自然，又能清楚体现军事场景。
- source_word: θεοῦ Βοηθείας
  choice: 上帝的帮助
  rationale: 这一压缩的属格表达作为口令内容，可自然理解为“上帝的帮助”；脚注保留“上帝是帮助”等其他可能理解。
- source_word: τῆς πρώτης σπείρης
  choice: 第一队
  rationale: σπεῖρα指一支军事分队。“第一队”简明自然，也避免用“步兵大队”等词过度指定为罗马军制单位。
- source_word: αὐτὸς προηγούμενος
  choice: 亲自率领
  rationale: 既表达αὐτός的强调，也传达προηγέομαι走在前面、带头领导的含义。
- source_word: συνέβαλε τῷ Νικάνορι
  choice: 与尼迦挪交战
  rationale: συμβάλλω与与格连用，在军事叙事中表示同对方接战；“交战”保留双方投入战斗的含义，不单方面解释为“攻击”。
theological_decisions:
- issue: 省略结构中以利亚撒与后续动作的关系
  choice: 把Ἐλεάζαρον视为承接上文“安排、分派”动作的宾语；后面的分词和主句仍以犹大为隐含主语
  alternative: 把以利亚撒理解为后续拿出圣书、给出口令或率队交战的人
  rationale: Ἐλεάζαρον是宾格，而παραγαγών、δούς、προηγούμενος和συνέβαλε在语法上自然延续上下文中的叙事主语犹大。原文在Ἐλεάζαρον之后有明显停顿，且“圣书”是παραγαγών的明示宾语。因此不将后续行动改归以利亚撒。
- issue: 口令θεοῦ Βοηθείας的句法含义
  choice: 译作名词性口令“上帝的帮助”
  alternative: 译作“来自上帝的帮助”或命题式“上帝是帮助”
  rationale: 希腊语表达高度压缩，名词性译法最贴近表面结构，也适合作为军事口令；脚注保留其他合理分析，避免把神学含义收窄为单一解释。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“圣书”“口令”“第一队”“交战”均为普通读者容易理解的表达。人名采用常见现代汉语圣经音译“以利亚撒”“尼迦挪”。
