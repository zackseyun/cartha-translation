  text: But they killed the commander among those with Timothy, a thoroughly worthless man who had caused the Jews much distress.
translation:
  language: zh_hans
  text: 他们杀了提摩太一方的人中那位部族首领；他是个极其卑劣的人，曾使犹太人饱受许多痛苦。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάρχην
  choice: 部族首领
  rationale: φυλάρχης通常指部族或族群的首领；译作“部族首领”比泛化为“指挥官”更贴近希腊词义，同时不臆定其具体军阶。
- source_word: τῶν περὶ Τιμόθεον
  choice: 提摩太手下的
  rationale: 该结构指以提摩太为中心的一群人；结合叙事中的武装阵营，用自然汉语表达其归属关系，但不把φυλάρχης改译为特定军职。
- source_word: ἀνυπόστατον
  choice: 卑劣透顶
  rationale: 此处用于强烈贬斥此人的品性或价值；该译法保留强度，并与后述其迫害犹太人的行为相衔接。
- source_word: πολλὰ τοὺς Ἰουδαίους ἐπιλελυπηκότα
  choice: 曾使犹太人饱受痛苦
  rationale: πολλά强化所造成的忧苦，完成时分词表示此前造成且影响深重的伤害；译文简洁呈现这一点。
