  yaml_path: translation/deuterocanon/2_maccabees/008/034.yaml
  text: But Nikanor[a], that utterly defiled man, who had brought three thousand merchants for the sale of the Jews,
translation:
  language: zh_hans
  text: 可是，那个万分可憎的尼加挪[a]，曾带来三千名商人，为要出售犹太人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那个三重受咒诅的人”或“那个三重不幸的人”。原文形容词十分罕见，带有强烈贬义；其中“三重”这一成分用来加强语气。
    reason: 说明罕见词 τρισαλιτήριος 的词义范围及其含有“三重”强化成分，保留字面而较生硬的译法作为替代。
lexical_decisions:
- source_word: τρισαλιτήριος
  choice: 罪恶至极的人
  rationale: 这个罕见的复合形容词带有强烈的贬斥意味；前缀 τρις- 在这里强化程度。译作“罪恶至极”既保留道德和宗教层面的谴责，也符合现代汉语表达。
- source_word: Νικάνωρ
  choice: 尼加挪
  rationale: 按希腊语 Νικάνωρ 音译，并采用现代简体中文圣经人名的自然形式。
- source_word: τρισχιλίους ἐμπόρους
  choice: 三千名商人
  rationale: 直译数词和名词；ἐμπόρους 指从事交易的商人，在语境中是为购买被卖者而来。
- source_word: ἐπὶ τὴν πρᾶσιν τῶν Ἰουδαίων
  choice: 要把犹太人卖给他们
  rationale: ἐπί 加宾格表达目的，πρᾶσις 指售卖。补出“给他们”说明商人与售卖的关系，是汉语中自然且由语境明确支持的表达。
- source_word: ἀγαγών
  choice: 曾带来
  rationale: 不定过去时分词修饰尼加挪，交代先于后续主句行动发生的背景；“曾带来”简洁地体现这一层次。
theological_decisions:
- issue: 罕见贬称 τρισαλιτήριος 的译法
  choice: 罪恶至极的人
  alternative: 三重受咒诅的人；极其可憎的人；极其不幸的人
  rationale: 该词兼有罪恶、可憎或受咒诅等语义可能，且 τρις- 主要起强意作用。正文采用自然而有力度的“罪恶至极”，脚注保留“受咒诅”等可能性，不把其宗教性谴责简化为一般辱骂。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留原文未完句式，以逗号收尾，与所给经文片段一致；“罪恶至极”传达强烈谴责而不过度古雅。
