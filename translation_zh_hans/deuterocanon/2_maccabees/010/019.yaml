  text: If[a], then, you maintain your goodwill toward these matters[b], I will also try from now on to be the cause of good things.
translation:
  language: zh_hans
  text: 你们若继续保持对这些事[a]的善意，那么我今后也会努力促成美好的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对这些事”也可译作“对这些事务”或“为了这些事”；希腊语所指范围较宽，可指所论及的事项或整体事务。
    reason: lexical_alternative
  - marker: b
    text: 直译为“成为美好事物的成因”。也可译作“带来益处”；原文强调主动促成好事的作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: συντηρήσητε
  choice: 继续
  rationale: 该动词表示持续保持或保存；与“善意”搭配时，用“继续”自然表达这种维持不变的含义。
- source_word: εἰς τὰ πράγματα
  choice: 对待这些事
  rationale: 该短语广泛指所谈论的事务、事项或整体工作；“这些事”保留其宽泛性，不作过度限定。
- source_word: εὔνοιαν
  choice: 善意
  rationale: εὔνοια表示友善、有利的态度或好意；“善意”符合现代汉语，也保留原文正式语气。
- source_word: εἰς τὸ λοιπόν
  choice: 今后
  rationale: 该短语指从现在起的未来时段；“今后”简洁、自然。
- source_word: πειράσομαι
  choice: 会努力
  rationale: 该将来时形式表达尝试、尽力或力求；“会努力”比单纯“会做”更准确保留尝试之意。
- source_word: αἰτιαῖος ἀγαθῶν γίνεσθαι
  choice: 促成美好的结果
  rationale: 原短语直指“成为好事的成因”；“促成美好的结果”在自然汉语中保留主体产生良好结果的能动性，同时避免生硬的“成为好事的原因”。
