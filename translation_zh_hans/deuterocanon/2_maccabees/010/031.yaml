  source_fidelity: 译文总体准确地保留了诏令所含的许可、既有惯例、以及禁止侵扰的两个并列内容。“资财”和“律法”的处理可接受。不过，περὶ τῶν ἠγνοημένων宜避免在正文中过度固定为“因无知而做的事”；该完成时被动分词可笼统指未被知晓、忽略的事，而上下文亦可作出于无知所作之事理解。修订以较宽的中文保留这一范围，并使“以任何方式”明确修饰侵扰。
