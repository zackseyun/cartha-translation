base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/031.yaml
  text: that the Jews should make use of their own resources and laws as before[a], and that none of them should in any way be harassed concerning the things done in ignorance.
translation:
  language: zh_hans
  text: 犹太人可以照旧使用自己的资财[a]，并遵行自己的律法；他们中任何一人都不得因那些出于无知或未被知晓的事[b]而受到任何骚扰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “资财”或译“经费”“给养”；希腊语可指支出，也可指供维持之用的物质资源。
    reason: lexical_alternative
  - marker: b
    text: 希腊语可指“出于无知所作的事”，也可较笼统地指“未被知晓或被忽略的事”。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: χρῆσθαι
  choice: 可以……使用……遵行
  rationale: 该不定式表达准许或命令的内容，基本义为“使用”。与“资财”搭配译作“使用”，与“律法”搭配则按现代汉语习惯译作“遵行”，而不改变二者同受该动词支配的结构关系。
- source_word: τοῖς ἑαυτῶν δαπανήμασιν
  choice: 自己的资财
  rationale: δαπάνη及其相关名词可指花费、经费或供维持之用的物质资源。“资财”既能涵盖资金和物质资源，也比“自己的开支”更适合与“使用”搭配；原词的范围以脚注说明。
- source_word: νόμοις
  choice: 自己的律法
  rationale: νόμος的直接含义是“律法、法律”；此处涉及犹太人获准恢复原有生活秩序，译作“律法”比“习俗”更贴近原词，并避免缩窄其范围。
- source_word: καθὰ καὶ τὸ πρότερον
  choice: 像从前一样
  rationale: 忠实表达恢复先前做法之意，且符合现代汉语表达。
- source_word: παρενοχληθήσεται
  choice: 受到骚扰
  rationale: 该将来时被动形式表示遭受烦扰、干涉或刁难。“受到骚扰”能自然传达官方或社会层面的侵扰，又不额外限定施事者。
- source_word: περὶ τῶν ἠγνοημένων
  choice: 因无知而做的事
  rationale: 将περί按此处关联或缘由的语境译作“因”，并把ἀγνοέω的完成时被动分词理解为出于不知情而发生的事。由于该形式也可理解为“未被察知的事”，脚注保留此歧义。
