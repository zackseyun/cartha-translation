  text: 愿你们安好[a]。但愿如我们所愿[b]；我们自己也安好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译含有健康用语，可译作“你们要健壮（或安好）”；在书信结尾，这是惯用的祝安语。
    reason: lexical_alternative
  - marker: b
    text: 本节的措辞像书信结尾套语，与许多现代版本分节中前后叙事并不连贯；这里按所提供的希腊文本翻译。
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: 愿你们安好
  rationale: 这是ῥώννυμι的复数命令式，在书信结尾可作祝安语。译作“愿你们安好”既保留原文的健康用语，也符合现代汉语书信语气。
- source_word: εἴη ἂν
  choice: 但愿
  rationale: 愿望式与ἄν结合，在这里表达愿望；“但愿”自然传达其语气，不把愿望误作命令或断言。
- source_word: ὡς βούλομεθα
  choice: 如我们所愿
  rationale: βούλομαι表示愿意、希望或意欲；此译保留原文所指事项未明的特点。
- source_word: ὑγιαίνομεν
  choice: 也安好
  rationale: 该动词本义为健康、健全。此处处于书信问安语境，“安好”自然简洁，并与前句形成呼应。
- source_word: καὶ αὐτοὶ δὲ
  choice: 我们自己也
  rationale: 保留αὐτοὶ对主语的轻微强调和καὶ所表达的“也”；δὲ在汉语中不必机械译出转折词，以免加重原文语气。
