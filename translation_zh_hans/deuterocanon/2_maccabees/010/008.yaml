base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/008.yaml
  text: And while they were there near Jerusalem[a], a horseman appeared, going before them[b], clothed in white and brandishing golden armor.
translation:
  language: zh_hans
  text: 他们当时正在耶路撒冷附近，有一位骑马者[b]显现出来，走在他们前面[a]；他身穿白衣，挥舞着金色的全套军械。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他们前面行进”。原文可只表示他位于众人前方，也可能在上下文中含有引导之意。
    reason: lexical_alternative
  - marker: b
    text: 原文没有明说这位骑马者是谁；这番描写可能暗示他是天上的存在或天使，但经文本身并未指明。
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτόθι δὲ πρὸς τοῖς Ἱεροσολύμοις ὄντων
  choice: 他们当时正在耶路撒冷附近
  rationale: 把地点副词、表示邻近的介词短语和属格独立结构合并为自然的现代汉语背景句，既保留“当时在那里”的情境，也明确地点在耶路撒冷附近，而非必然在城内。
- source_word: ἐφάνη
  choice: 显现出来
  rationale: 保留突然进入视野、带有异象色彩的意味，同时不预先断定显现者的身份或本质。
- source_word: προηγούμενος αὐτῶν
  choice: 走在他们前面
  rationale: 准确表达位于众人前方行进的意思，又不把该分词过度解释为正式“带领”或“指挥”。
- source_word: ἔφιππος
  choice: 一位骑马者
  rationale: 原词本为“骑在马上、乘马的”，汉语用名词性表达较自然，并且不额外称其为天使或天上使者。
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: 身穿白衣
  rationale: 简洁保留衣着的颜色和视觉重点，不擅自限定具体服装样式。
- source_word: πανοπλίαν χρυσῆν
  choice: 金色的全副武装
  rationale: πανοπλία可指全套铠甲或整套武装；“全副武装”较能保留其整体装备之义，也避免无根据地缩窄为某一种兵器。
- source_word: κραδαίνων
  choice: 挥舞着
  rationale: 表现原词所含用力挥动、展示的动态军事意象；虽与“全副武装”的搭配略显奇特，却忠实保留希腊文自身的形象。
theological_decisions:
- issue: 显现者的身份
  choice: 仅译作“一位骑马者”，不指明其身份
  alternative: 天使骑士；天上的骑士
  rationale: 希腊文只描写一个骑马、穿白衣并持有金色武装的形象，并未明说他是天使或其他天上存在。译文保留超自然暗示，但不替叙事作神学定论。
- issue: 走在前面的作用
  choice: 译作“走在他们前面”
  alternative: 带领他们
  rationale: 上下文可能使人理解为引导，但原分词本身也可仅表示在前方行进，因此不在正文中把引导作用绝对化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“显现出来”保留异象式的叙事色彩；“全副武装”保留πανοπλία在“全套铠甲”与“整套武备”之间的语义幅度。脚注标记均放在其实际说明的词语之后，并纠正咨询层中脚注标记与内容错位的问题。
