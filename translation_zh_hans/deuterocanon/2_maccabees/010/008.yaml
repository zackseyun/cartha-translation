  to: 他们当时正在耶路撒冷附近，有一位骑马者[b]显现出来，走在他们前面[a]；他身穿白衣，挥舞着金色的全套军械。
  rationale: 仅作必要的汉语语义搭配修订：以“全套军械”替代状态性、不可直接受“挥舞”支配的“全副武装”。此译法保留πανοπλία所指的整套军事装备及κραδαίνων的挥动动作，不化解原文意象本有的特殊性。脚注b略作措辞调整，使“天上或天使般的形象”的中文表达更自然，且不增加身份断言。
