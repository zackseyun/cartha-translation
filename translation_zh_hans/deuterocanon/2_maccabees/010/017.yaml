  naturalness: “你们派来的约翰和押沙龙”自然。“呈交了所附的书面公函，并询问其中所说明的事项”在现代正式书面汉语中顺畅，且清楚标示动作先后。
  terminology: 人名“约翰”“押沙龙”采用通行译名，可保留。χρηματισμός宜保持为正式书面通信，不应定为“法令”；“书面公函”合乎本句文书语境。
