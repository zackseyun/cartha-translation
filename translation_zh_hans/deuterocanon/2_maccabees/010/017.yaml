  yaml_path: translation/deuterocanon/2_maccabees/010/017.yaml
  text: John and Absalom[a], who were sent from you, after delivering the written document, asked about the matters indicated by it.
translation:
  language: zh_hans
  text: 你们派来的约翰和押沙龙呈交了所附的书面公函[a]，并询问其中所说明的事项。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所附的书面公函”也可译作“书面正式函件”或“书面指示”。希腊文可指写下或附载的正式通信；其确切文书类别及版面位置并不确定。
    reason: 说明χρηματισμός可指正式通信或指示，并避免将ὑπογεγραμμένον限定为“下列”。
lexical_decisions:
- source_word: Ἰωάνης
  choice: 约翰
  rationale: 采用现代中文圣经中这一人名的通行译名。
- source_word: Ἀβεσσαλώμ
  choice: 押沙龙
  rationale: 采用现代中文圣经中这一人名的通行译名。
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: 你们派来的
  rationale: 将被动分词短语自然转为中文关系性修饰语；παρά加属格在此表示差派的来源，也可理解为施事者。
- source_word: ἐπιδόντες
  choice: 呈交了
  rationale: 该不定过去分词表示先于主要动作发生的行为；“呈交”符合递送正式文件的语境。
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: 下列公文
  rationale: ὑπογεγραμμένον在书信格式中可指“写在下面的”，故译作“下列”；χρηματισμός可指正式函件、文告或指示，“公文”保留其正式书面性质而不武断限定为法令。
- source_word: ἠξίουν
  choice: 提出请求
  rationale: 未完成过去时描写他们当时所提出的请求；译文不补出原文未明确说明的具体请求内容。
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: 就其中所陈述的事项
  rationale: διʼ αὐτοῦ回指该公文，σημαινομένων指经由公文表明、陈述的事；“事项”保留中性和概括性。
