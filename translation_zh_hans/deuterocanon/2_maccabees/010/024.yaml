base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/024.yaml
  text: having heard that the Jews did not approve of their father's change to Greek ways[a], but were choosing their own way of life and requesting that their own laws be permitted to them[b],
translation:
  language: zh_hans
  text: 他们听说，犹太人不赞同其父转向希腊风俗[a]，反而选择自己的生活方式，并请求准许他们遵行自己的律例[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其父转而采用希腊式的习俗”或“其父转而希腊化”。原文措辞简练，所指是转向希腊式的文化习俗，并非仅指改用希腊语。
    reason: 保留 εἰς τὰ Ἑλληνικά 的文化习俗范围，以及 τοῦ πατρός 所构成的压缩表达。
  - marker: b
    text: “律例”也可译作“法定习俗”或“本族的律法”；原词兼有律法、规例和既定习俗的含义。
    reason: 说明 τὰ νόμιμα 在犹太语境中兼具法律与习俗色彩，避免把它限缩为成文法。
lexical_decisions:
- source_word: ἀκηκοότες
  choice: 他们听说
  rationale: 以现代汉语自然表达完成时分词所表示的先行动作，并保留它与上下文主句的衔接；本节希腊文本身未明说“他们”所指何人。
- source_word: μὴ συνεὐδοκοῦντας
  choice: 不赞同
  rationale: 表达 συνευδοκέω 在此处“赞同、认可”的含义，不强化为正式批准或明确反抗。
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: 其父转而采用希腊人的生活方式
  rationale: μετάθεσις 表示转变，εἰς τὰ Ἑλληνικά 指向希腊式文化习俗，不宜仅理解为改用希腊语言；“其父”保留 πατρός 的单数及原文指称上的压缩性。
- source_word: τὴν ἑαυτῶν ἀγωγὴν αἱρετίζοντας
  choice: 反倒选择自己的生活方式
  rationale: ἀγωγή 在这里指生活方式、行为规范；αἱρετίζω 表示选择或偏爱。“反倒”体现 ἀλλά 的转折。
- source_word: ἀξιοῦν
  choice: 请求
  rationale: 在要求获得许可的语境中，ἀξιόω 表示提出请求；“请求”保持正式语体而不强化为“要求”或“索取”。
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: 请求准许他们遵守本有的律例
  rationale: συγχωρέω 的被动式表示获准或蒙许可；τὰ νόμιμα 涵盖依法或按惯例确立的规条。“遵守”是汉语为说明准许对象而作的轻度明示，“本有的律例”兼顾法律与习俗层面。
theological_decisions:
- issue: 如何译出 εἰς τὰ Ἑλληνικά 所含的文化—宗教范围
  choice: 希腊人的生活方式
  alternative: 希腊风俗；希腊化
  rationale: 该短语所指不只是语言，而是希腊式的文化生活和习俗。“生活方式”与后文 ἀγωγή 形成原文已有的观念对照，同时避免用较学术化的“希腊化”替原文作更精细的历史分类。
- issue: 如何处理 τὰ νόμιμα 的法律与习俗双重含义
  choice: 本有的律例
  alternative: 本族的律法；祖传习俗；法定习俗
  rationale: “律例”保留规范和惯例两方面，“本有的”说明这些是他们所持守的既有规条，却不把原文未明说的“祖传”或“本族”直接写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。译文保留原句作为上下文从属结构的感觉，但为中文可读性补出“他们”。“其父”照录希腊文单数，不擅自判定其具体所指；两处“生活方式”的重复有意保留原文在希腊式生活与犹太人自身生活规范之间的对照。
