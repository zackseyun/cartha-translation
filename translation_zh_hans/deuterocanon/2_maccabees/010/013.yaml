  yaml_path: translation/deuterocanon/2_maccabees/010/013.yaml
  text: But since he was not foolish[a], but was considering within himself the defeat that had happened to him, and had realized that the Hebrews were unconquerable because the mighty God was fighting alongside them[b], he sent ahead
translation:
  language: zh_hans
  text: 但他并不愚昧；他在心里衡量自己所遭受的挫败，又想到希伯来人之所以不可战胜，是因为那位有能力的上帝与他们并肩作战，于是预先派人去……
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: 但他并不愚昧
  rationale: 保留希腊文以否定表达肯定意味的委婉说法，同时采用自然、庄重的现代汉语。
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: 他在心里衡量
  rationale: 表达反身性的内心思量，并保留ἀντιβάλλω所含的权衡、对照意味。
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: 自己所遭受的挫败
  rationale: ἐλάττωμα可指损失、劣势或失败；“挫败”适合军事语境，又不把含义限定为一次彻底败北。
- source_word: συννοήσας
  choice: 又想到
  rationale: 在叙事中自然表达经过思量而认识到的意思，不额外强化为突然顿悟。
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: 希伯来人……不可战胜
  rationale: 直译Ἑβραίους为“希伯来人”，并以“不可战胜”保留ἀνίκητος的强烈语气。
- source_word: τοῦ δυναμένου θεοῦ
  choice: 那位有能力的上帝
  rationale: 尽量保留希腊文分词结构“有能力的”，不将其完全释义为一般性的“大能”。
- source_word: συμμαχοῦντος αὐτοῖς
  choice: 与他们并肩作战
  rationale: 明确呈现συμμαχέω在军事语境中的结盟并共同作战之意。
- source_word: προαποστείλας
  choice: 于是预先派人去
  rationale: 保留“事先差派”的时间关系；本节希腊文止于分词，句意延续至下一节，故以省略号提示未完。
theological_decisions:
- issue: Ἑβραίους的译法
  choice: 希伯来人
  alternative: 犹太人
  rationale: 原文明确使用“希伯来人”，故不按上下文改换成较常见的“犹太人”。
- issue: 上帝在争战中的帮助
  choice: 那位有能力的上帝与他们并肩作战
  alternative: 大能的上帝帮助他们
  rationale: 保留原文把上帝描写为共同作战者的军事意象，也保留τοῦ δυναμένου对上帝能力的强调。
- issue: 不可战胜的原因关系
  choice: 希伯来人之所以不可战胜，是因为……
  alternative: 想到希伯来人不可战胜，有上帝与他们并肩作战
  rationale: 希腊文属格绝对结构在语境中说明其不可战胜的依据；用“是因为”清楚表达这一关系，而不削弱神圣援助的陈述。
