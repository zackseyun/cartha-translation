  yaml_path: translation/deuterocanon/2_maccabees/010/005.yaml
  text: But when he entered Judea and came near Bethsura[a], a fortified place about five schoeni from Jerusalem[b], he was pressing it hard.
translation:
  language: zh_hans
  text: 他进入犹太，来到贝特族尔附近。这地方地势坚固，离耶路撒冷约五舍诺斯[a]；他正紧逼那里[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舍诺斯”是古代长度单位，其实际长度因时代和地区而异，无法准确换算成现代单位。
    reason: cultural_note
  - marker: b
    text: 或译：“他正在围攻那里。”希腊文直译为“他正压迫（或挤压）那里”，在此军事语境中可指对坚固据点施加强大压力。
    reason: lexical_alternative
  - marker: c
    text: 所提供的希腊文在《马加比二书》的通行编排中并非10:5的内容，而见于11:5；10:5叙述的是圣殿洁净的日期。正式排版前应核对经文编号。
    reason: reference_mismatch
lexical_decisions:
- source_word: εἰσελθὼν ... εἰς τὴν Ἰουδαίαν
  choice: 他进入犹太
  rationale: 以顺畅的汉语叙事表达不定过去时分词的先行动作；“犹太”保留地名含义。
- source_word: συνεγγίσας Βεθσουρῶν
  choice: 来到贝特族尔附近
  rationale: συνεγγίζω表示接近、来到近处；“贝特族尔”按希腊文地名音译。
- source_word: ὄντι μὲν ἐρυμνῷ χωρίῳ
  choice: 这地方地势坚固
  rationale: ἐρυμνός可指坚固、易守或设防；此译保留“地点本身易守”与“已有防御工事”之间的余地，避免擅自具体化为城堡。
- source_word: Ἱεροσολύμων δὲ ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: 离耶路撒冷约五舍诺斯
  rationale: ὡσεὶ明确表示约数；σχοῖνος的实际长度因时代和地区而异，因此音译古代单位，不作貌似精确的现代换算。
- source_word: τοῦτο ἔθλιβε
  choice: 他正紧逼那里
  rationale: θλίβω本义为挤压、压迫；未完成时表示持续动作。军事语境中可指猛烈施压，甚至围攻，但原文没有采用明确的技术性“围城”用语，故正文保留其张力。
