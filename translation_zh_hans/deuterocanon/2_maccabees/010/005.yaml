translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“地势坚固”避免把ἐρυμνός过度限定为人工设防；“正紧逼”兼顾未完成时的持续性及θλίβω的字面意象。地名采用便于普通读者朗读的音译。鉴于输入已标注major_mismatch，正文附参考编号核对注；不应在未核对前以2 Maccabees 10:5正式出版。
