  yaml_path: translation/deuterocanon/2_maccabees/010/038.yaml
  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
translation:
  language: zh_hans
  text: 愿你们安康[a]。第一百四十八年，散提古月[b]十五日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“你们要安好”或“你们要健康”，这里是书信结尾的惯用祝安语。
    reason: lexical_alternative
  - marker: b
    text: “散提古月”是希腊化时代纪年公式中使用的马其顿月份名称。
    reason: cultural_note
lexical_decisions:
- source_word: ὑγιαίνετε
  choice: 愿你们安康
  rationale: 该词字面意为“健康、安好”，在书信结尾用作祝安语。译作“愿你们安康”既保留其字面意象，也符合现代汉语庄重自然的书信收束表达；复数“你们”对应希腊语复数形式。
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: 第一百四十八年
  rationale: 这是纪年公式中的序数表达；按现代汉语日期习惯译为“第一百四十八年”。
- source_word: Ξανθικοῦ
  choice: 散提古月
  rationale: 这是希腊化时代马其顿历的月份专名，采用音译并补出“月”，使日期结构清楚。
- source_word: πεντεκαιδεκάτῃ
  choice: 十五日
  rationale: 该阴性与格序数用于日期公式，所修饰的“日”在希腊文中省略；汉语自然补出“日”。
