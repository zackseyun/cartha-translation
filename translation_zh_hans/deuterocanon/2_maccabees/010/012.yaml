  text: But most of them escaped wounded and naked[a]; and Lysias himself also escaped by fleeing shamefully.
translation:
  language: zh_hans
  text: 但他们中大多数人受了伤，赤身露体地逃脱了[a]；吕西亚本人也可耻地逃走而脱身了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赤身露体”也可译作“被剥去衣物”或“被剥得精光”；在战斗语境中，可能指他们逃跑时失去了装备或外衣。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πλείονες
  choice: 他们大多数人
  rationale: 该比较级作名词用，指其中人数较多的一方，即“大多数人”；此译自然并保留数量含义。
- source_word: τραυματίαι
  choice: 带着伤
  rationale: 该词指受伤者；结合谓语译为“带着伤……逃脱”，符合现代汉语叙事表达。
- source_word: γυμνοὶ
  choice: 赤身露体
  rationale: 原词可指赤裸或被剥去衣物、装备；正文采用直接而不弱化的译法，并以脚注保留战场语境中的另一理解。
- source_word: διεσώθησαν
  choice: 逃脱了
  rationale: 该动词表示安然脱险或获救；军事败退语境中，“逃脱”最贴合叙事含义。
- source_word: αἰσχρῶς
  choice: 可耻地
  rationale: 保留原文对吕西亚逃亡方式所作的羞耻、丢脸评价。
- source_word: φεύγων
  choice: 逃跑，才
  rationale: 现在分词与主要动作同时发生，也可带方式或手段意味；“逃跑，才得以脱身”自然传达他借逃跑脱险。
- source_word: διεσώθη
  choice: 得以脱身
  rationale: 与前句“逃脱”同义，但使用“得以脱身”使中文避免生硬重复，同时保留从败局中逃生的含义。
