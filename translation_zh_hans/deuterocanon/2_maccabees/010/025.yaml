base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/025.yaml
  text: Therefore[a], since we choose that this nation also should be free from disturbance, we judge that the sanctuary should be restored to them[c][b], and that they should live according to the customs of their ancestors.
translation:
  language: zh_hans
  text: 因此，既然我们也愿这民族免受动乱，就裁定[a]将圣所[b]归还给他们，并让他们按照祖先时代的习俗生活[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “裁定”也可译作“决定”或“颁令”；希腊语 κρίνομεν 在这里是正式行政用语。
    reason: lexical_alternative
  - marker: b
    text: “圣所”也可译作“圣殿”；希腊语 τὸ ἱερὸν 可指神圣之所或圣殿建筑群。
    reason: lexical_alternative
  - marker: c
    text: “生活”所译的希腊语 πολιτεύεσθαι 也可表达依某种制度治理或组织共同体、公民生活，并不只指个人生活方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρούμενοι
  choice: 既决定
  rationale: 该分词说明下述正式裁定的依据；“既决定”保留主动选择、作出决定的意味，也符合中文行政文体。
- source_word: ἔθνος
  choice: 民族
  rationale: 这里指作为独特群体的犹太人民；“民族”保留其集体及政治层面的含义，又不把意思缩窄为现代民族国家。
- source_word: ἐκτὸς ταραχῆς εἶναι
  choice: 免受动乱
  rationale: ταραχή在此侧重公共秩序上的骚乱或动荡；“免受动乱”简明自然。
- source_word: κρίνομεν
  choice: 裁定
  rationale: 在王室行政语境中，该词表示正式作出的决定；“裁定”比普通的“认为”更能体现公文语气，但不必强化为特定形式的法令。
- source_word: τὸ ἱερὸν
  choice: 圣所
  rationale: 该词可指神圣之所或整个圣殿区域；“圣所”保留范围上的弹性，并以脚注提示“圣殿”这一译法。
- source_word: ἀποκατασταθῆναι αὐτοῖς
  choice: 把圣所恢复给他们
  rationale: 保留动词“恢复到先前状态或地位”的含义及间接受益者“给他们”，避免擅自限定究竟是修复建筑、恢复使用权，还是恢复管辖地位。
- source_word: πολιτεύεσθαι
  choice: 安排共同生活
  rationale: 该词不只表示个人怎样生活，也可涉及群体或公民生活的组织；此译法兼顾可读性与其共同体层面的意味。
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: 按照祖先时代的习俗
  rationale: 原文不仅提到祖传习俗，也带有“在祖先时代实行”的时间意味；此译法保留两层信息。
