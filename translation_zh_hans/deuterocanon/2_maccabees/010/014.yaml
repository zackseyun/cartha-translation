  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king[b], compelling him to become their friend.
translation:
  language: zh_hans
  text: 他劝服对方按一切公正的条件达成和解[a]，并表示[b]自己也会劝服王，迫使王成为他们的朋友。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “达成和解”所译的希腊语动词在这个文本见证中较为罕见，文本与词义也有困难；这里似乎是指按公正的条件达成协议或恢复和好。
    reason: textual_variant
  - marker: b
    text: “并表示”也可译作“因为”，即：“因为他也会劝服王，迫使王成为他们的朋友。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεισεν
  choice: 劝服
  rationale: 这是πείθω的不定过去时，表示成功说服；译作“劝服”既自然，也保留了与后文πείσει（“会劝服”）的词语呼应。原文未明说宾语，汉语补作泛指的“对方”，避免擅自确定人物。
- source_word: συλλύεσθαι
  choice: 达成和解
  rationale: 该词在此见证中词义及文本均有困难；结合外交谈判语境，较可能指消除冲突、达成协议。“达成和解”保留关系修复与议定条件两方面的含义。
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: 按一切公正的条件
  rationale: δικαίοις可作名词性用法，指谈判中公正、合理之事；“公正的条件”符合汉语外交语境，但不把它限定为单方面的要求。
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: 并表示自己也会劝服王
  rationale: διότι既可能表示原因，也可能引出劝说内容；正文按后者处理，以“并表示”自然衔接，同时在脚注交代另一种可能。πείσει的将来意义译为“会劝服”。
- source_word: φίλον αὐτοῖς
  choice: 成为他们的朋友
  rationale: 直译φίλον与αὐτοῖς的关系，保留政治上转为友好的意味，而不额外解释为私人亲密关系。
- source_word: ἀναγκάζων γενέσθαι
  choice: 迫使王成为
  rationale: ἀναγκάζω表示强制或施加强大压力；译作“迫使”保留原文力度。汉语重复“王”，以明确分词结构中被迫成为朋友的是王。
