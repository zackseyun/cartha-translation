translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。原文主语和宾语承接上文，本节所给希腊文未明确说出；正文以“他”和泛指的“对方”维持这种未指明性。对有重大校勘疑点的συλλύεσθαι不作过度确定的法律化解释，并通过脚注保留διότι的句法歧义。
