base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/006.yaml
  text: But when those around Makkabaios[a], while besieging it, gained possession of the strongholds, with lamentations and tears they, together with the crowds[b], pleaded with the Lord to send a good angel for the salvation of Israel.
translation:
  language: zh_hans
  text: 马加比一行人在他围攻那地方[a]时，占领了各处堡垒；他们与众人一同哀号流泪，恳求主差遣一位良善的天使[b]来拯救以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作“在他围攻他时”，代词所指并未在本句中明说；按上下文，这里很可能指被围攻的地方，也可能被理解为某个人。
    reason: alternative_reading
  - marker: b
    text: 或译“一位施恩的天使”。希腊文作“良善的天使”，既可描述天使的品格，也可侧重其带来益处的使命。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: 马加比一行人
  rationale: 这是希腊语中表示某人及其同伴、随从的习语；译作“一行人”自然简洁，又不额外限定其军职或人数。
- source_word: μετέλαβον
  choice: 占领了
  rationale: 该动词可指取得、据有；在攻城和堡垒的军事语境中，“占领”准确而自然。
- source_word: τὰ ὀχυρώματα
  choice: 各处堡垒
  rationale: 该词指设防之处或坚固据点；“各处堡垒”既传达复数，也符合现代汉语军事语境。
- source_word: πολιορκοῦντα αὐτόν
  choice: 在他围攻那地方时
  rationale: 分词为阳性单数，最自然地与“马加比”呼应；代词的先行词在所给句中并不明示，因此正文用“那地方”，并以脚注保留句法含混。
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: 哀号流泪
  rationale: 以自然汉语保留哀恸与眼泪两层强烈情感，避免生硬直译为名词并列。
- source_word: ἱκέτευον
  choice: 恳求
  rationale: 该动词表示迫切祈求，语气强于普通的“请求”。
- source_word: τὸν κύριον
  choice: 主
  rationale: 在犹太经文语境中，这一称谓敬指上帝；“主”是庄重而通行的译法。
- source_word: ἀγαθὸν ἄγγελον
  choice: 一位良善的天使
  rationale: “良善”直接对应ἀγαθός，不擅自说明天使身份，也不把该词仅限于其行动有益。
- source_word: ἀποστεῖλαι πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: 差遣……来拯救以色列
  rationale: 用现代汉语动词结构表达“为以色列的拯救”，保持目的关系并避免名词化表达的生硬。
theological_decisions:
- issue: “良善的天使”的含义
  choice: 按原文译作“一位良善的天使”，不进一步确认其身份或类别。
  alternative: 一位施恩的天使；一位前来相助的天使
  rationale: 原文只称这位天使为“良善”，并说其受差遣来拯救以色列；不宜加入原文未明说的天使论解释。
- issue: σωτηρία在此处的语义
  choice: 译作“拯救”，体现危难中的实际救援。
  alternative: 救恩；解救
  rationale: 军事围攻语境倾向于实际的搭救，但“拯救”仍保留经文用语可能具有的较宽神学意涵。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“马加比一行人”处理希腊语习语；“哀号流泪，恳求”保留原文迫切、悲痛的语气。所给希腊文内容与通常编号的《马加比二书》10:6明显不符；本稿严格翻译所提供的希腊文，正式排版前应核对经节编号和底本定位。
