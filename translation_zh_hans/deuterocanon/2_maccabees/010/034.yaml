  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews[b], greetings.”'
translation:
  language: zh_hans
  text: 罗马人也给他们送了一封信，内容如下：“罗马人的长老[a]昆图斯·梅米乌斯和提图斯·马尼乌斯，向犹太民众[b]问安。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长老”也可能在这里特指罗马的使节或元老，但希腊词本身只说“长老”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“犹太人的民众”，指作为一个公共共同体的犹太人民；也可译作“犹太人民”。
    reason: lexical_alternative
  - marker: c
    text: 所提供的希腊文实际对应《马加比二书》11:34，而不是10:34；经文编号与原文证据存在重大错配。
    reason: source_reference_mismatch
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι πρὸς αὐτοὺς ἐπιστολήν
  choice: 罗马人也给他们送了一封信
  rationale: 保留οἱ Ῥωμαῖοι的集体称谓，不擅自具体化为“罗马当局”；δὲ καὶ在上下文中自然译作“也”。
- source_word: ἔχουσαν οὕτως
  choice: 内容如下
  rationale: 这是引出书信正文的惯用表达；“内容如下”符合现代汉语公函语体，也准确表达该分词结构的功能。
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: 昆图斯·梅米乌斯和提图斯·马尼乌斯
  rationale: 按希腊文人名音译；汉语列举两人时补出“和”，使表达自然清楚。
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: 罗马人的长老
  rationale: πρεσβυταί字面义为“长老”；译文不将其未经明示地限定为“元老”或“使节”，并以脚注说明可能的职务含义。
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: 向犹太民众
  rationale: δῆμος指作为公共或政治共同体的人民；“犹太民众”在现代汉语中自然，同时保留其群体性含义。
- source_word: χαίρειν
  choice: 问安
  rationale: 这里是不定式形式的希腊书信问候套语，不按字面译作“喜乐”，而用庄重自然的汉语书信表达。
