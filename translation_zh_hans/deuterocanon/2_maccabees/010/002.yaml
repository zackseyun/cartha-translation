  text: After gathering about eighty thousand men and all the cavalry[a], he came against the Jews, thinking to make the city a dwelling place for Greeks[b],
translation:
  language: zh_hans
  text: 他召集了约八万人[a]和全部骑兵，前来攻打犹太人，盘算着要把这城变成希腊人的居所[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文按“万”为计数单位，作“约八个万”，即约八万人。
    reason: lexical_alternative
  - marker: b
    text: 这句话延续到下一节；本节的“这城”所引出的计划，要到下一节的对举内容中才完整。
    reason: cross_reference
lexical_decisions:
- source_word: συναθροίσας
  choice: 召集了……之后（在汉语句法中以“他召集了……，前来”表达）
  rationale: 不定过去时分词表示先于主要动词发生的行动；用连续谓语自然呈现先召集军队、继而进攻的次序。
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: 约八万人
  rationale: μυριάς是一万，八个“一万”为八万；περί用于数词时表示约数。原文未明说“人”，但军事语境中的计数对象显然是兵员，汉语补出“人”较自然。
- source_word: τὴν ἵππον ἅπασαν
  choice: 全部骑兵
  rationale: ἵππος在军事语境中可集合性地指骑兵，ἅπασαν强调全体。
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: 前来攻打犹太人
  rationale: παραγίνομαι与ἐπί加宾格在军事语境中表示向敌对目标进军；“攻打”比单纯的“来到”更准确传达敌对行动。
- source_word: λογιζόμενος
  choice: 盘算着
  rationale: 该分词兼有思量、谋划之意；“盘算着”保留其心中筹划的意味，又不把意图强化为已经颁定的命令。
- source_word: τὴν μὲν πόλιν
  choice: 这城
  rationale: 所指为上下文中的特定城市；汉语“这城”自然承接语境。μέν预示后文的对应项，但本节截断于此，不宜另加原文没有的完整对举。
- source_word: Ἕλλησιν
  choice: 希腊人的
  rationale: 与οἰκητήριον和ποιήσειν合用，表示要使城市成为供希腊人居住之处；属格式汉语表达简洁自然。
- source_word: οἰκητήριον ποιήσειν
  choice: 要把……变成……居所
  rationale: 准确表达将城市改造为某类人居住地的意图，并保持现代汉语的自然句式。
