  text: But after a very short time[a], Lysias, the king’s guardian and kinsman and the one over affairs, taking the events very hard[c][b],
translation:
  language: zh_hans
  text: 但仅仅过了很短的一段时间[a]，国王的监护人[b]、宗亲和政务主管[c]吕西阿，对所发生的事深感恼怒[d]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“但不久之后”；希腊文以叠加的表达强调间隔极短。
    reason: lexical_alternative
  - marker: b
    text: “监护人”也可译作“摄政”或“受托管理者”；希腊文指受托替国王照管或管理的人。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“掌管事务者”，可能指主管国政的高级官员，但没有明确给出具体官衔。
    reason: lexical_alternative
  - marker: d
    text: 或译“对所发生的事深感不安”；原文既可表示痛苦、懊恼，也可表示愤慨。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετʼ ὀλίγον δὲ παντελῶς χρονίσκον
  choice: 但仅仅过了很短的一段时间
  rationale: 把表示短暂间隔的整个短语合并为自然汉语；“仅仅”和“很短”传达 παντελῶς 与指小形式 χρονίσκον 所形成的强化语气。
- source_word: ἐπίτροπος τοῦ βασιλέως
  choice: 国王的监护人
  rationale: ἐπίτροπος 指受托照管或代为管理的人；结合“国王”可译为“监护人”，同时不把其政治职权过度限定为正式的摄政职位。
- source_word: συγγενὴς
  choice: 宗亲
  rationale: 此处指与国王有亲属关系的人；“宗亲”适合王室语境，也保持庄重的历史叙事语体。
- source_word: ἐπὶ τῶν πραγμάτων
  choice: 政务主管
  rationale: 希腊文直译为“掌管事务者”。在王室行政语境中，“政务主管”清楚自然，但不武断指定某个现代官衔。
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: 对所发生的事深感恼怒
  rationale: βαρέως φέρειν 表示对事情难以承受、深感不快或愤慨；结合叙事语境译为“深感恼怒”，并以脚注保留较宽的情绪范围。
