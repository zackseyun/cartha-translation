  terminology: “国王的监护人”“掌管政务者”均可保留原文职称的不确定性。“亲属”比“宗亲”更忠实于 συγγενής。“心情沉重”不预断该情绪必是愤怒，并较好对应 λίαν βαρέως φέρων。
