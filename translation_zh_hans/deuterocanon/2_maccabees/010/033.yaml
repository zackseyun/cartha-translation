  yaml_path: translation/deuterocanon/2_maccabees/010/033.yaml
  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
translation:
  language: zh_hans
  text: 祝你们安好[a]。第一百四十八年，散提古月十五日[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语ἔρρωσθε字面可译作“要刚强”或“要健康”，在书信结尾则是惯用的祝安语。
    reason: lexical_alternative
  - marker: b
    text: 散提古月是希腊化时期纪年所用的马其顿月份名称。
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: 祝你们安好
  rationale: 这是ῥώννυμι的第二人称复数完成时命令式，字面可指“要刚强”或“要健康”，但在书信结尾用作祝安语。“祝你们安好”既体现复数受信者，也符合现代汉语书信收尾表达。
- source_word: ἔτους
  choice: 年
  rationale: 属格用于纪年公式，汉语按日期习惯直接译作“年”。
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: 第一百四十八
  rationale: 保留原文的序数纪年，不补入原文未明说的纪年体系。
- source_word: Ξανθικοῦ
  choice: 散提古月
  rationale: 这是希腊化时期使用的马其顿月份名称；采用音译并加“月”，使其在中文日期中清楚自然。
- source_word: πεντεκαιδεκάτῃ
  choice: 十五日
  rationale: 与格在日期公式中表示月份中的具体日子，中文自然表达为“十五日”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“祝你们安好”传达书信结语的功能，同时用脚注保留其字面含义；日期依中文次序表达，不擅自说明具体纪年体系。
