    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... τοῦ βασιλέως ἐπιστολή
  choice: 王的信
  rationale: ἐπιστολή指书信；属格τοῦ βασιλέως表明这是王的信。“王的信”简洁自然，也保留原文的所属关系。
- source_word: περιεῖχεν οὕτως
  choice: 内容如下
  rationale: περιεῖχεν本义为“包含、载有”，οὕτως在此引出信件正文。汉语书信引语中用“内容如下”既贴近原义，又比生硬的“如此包含”自然。
- source_word: Βασιλεὺς Ἀντίοχος
  choice: 安条克王
  rationale: Βασιλεύς在信首作为君王头衔；现代汉语通常将头衔置于姓名之后，因此译作“安条克王”。
- source_word: τῷ ἀδελφῷ Λυσίᾳ
  choice: 致兄弟吕西亚
  rationale: 与格标明收信人。ἀδελφός直译为“兄弟”，可能指实际亲属，也可能是王室或宫廷中的称谓；正文不替原文判定其具体含义。Λυσίᾳ按通行方式音译为“吕西亚”。
- source_word: χαίρειν
  choice: 问安
  rationale: χαίρειν在希腊书信开头是惯用问候语，并非在此命令对方“喜乐”。“问安”符合庄重、自然的汉语书信语体。
