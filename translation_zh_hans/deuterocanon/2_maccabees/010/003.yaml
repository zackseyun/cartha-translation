  text: and to make the sanctuary taxable[a], like the other shrines of the nations, and to make the high priesthood sold each year[c][b];
translation:
  language: zh_hans
  text: 把圣所定为像列国其他的庙宇一样须缴纳贡税[a]，又使大祭司的职位每年都拿来出售[b][c]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“须缴纳税款。”希腊词 ἀργυρολόγητον 表示被征收钱财或贡税。
    reason: lexical_alternative
  - marker: b
    text: 或译：“又使大祭司的职位每年供出售。”希腊词 πρατήν 强调这一职位成为出售的对象。
    reason: lexical_alternative
  - marker: c
    text: 现存希腊文在这里句法简略；本译文依照所述政策的含义补足为自然的汉语表达。
    reason: textual_variant
lexical_decisions:
- source_word: ἱερόν
  choice: 圣所
  rationale: 这里指耶路撒冷圣殿及其神圣范围；“圣所”保留其神圣含义，也避免把所指过度限于一座建筑。
- source_word: ἀργυρολόγητον
  choice: 须缴纳贡税
  rationale: 此形容词表示被征收钱财或贡税；译为“须缴纳贡税”既符合语境，也比生硬的“可课税”更自然。
- source_word: τεμένη
  choice: 庙宇
  rationale: 该词可指划作宗教用途的圣域或庙宇；此处指列国的宗教场所，用“庙宇”与耶路撒冷的“圣所”形成符合原文用词差异的对照。
- source_word: ἐθνῶν
  choice: 列国
  rationale: 直译为“各国、列国”，在本语境中指非犹太民族；“列国”保留原文表达而不额外加入贬义。
- source_word: πρατήν
  choice: 拿来出售
  rationale: 该形容词强调大祭司职位成为可出售之物；汉语以动词结构表达，清楚传达这一职位被商品化的政策。
- source_word: ἀρχιερωσύνην
  choice: 大祭司的职位
  rationale: 该词指大祭司的职分或职位；“大祭司的职位”比抽象的“大祭司职”更便于普通读者理解。
- source_word: ποιήσειν
  choice: 使
  rationale: 不定式表达要实行的措施；两次用“使”对应希腊文以同一动词统摄两个宾语的结构。
theological_decisions:
- issue: 耶路撒冷神圣场所与列国宗教场所的术语区分
  choice: 将 ἱερόν 译为“圣所”，将 τεμένη 译为“庙宇”
  alternative: 两者都译为“圣殿”或“圣所”
  rationale: 原文使用两个不同词语。分别译出既保留词汇区别，也让读者看出这项政策把耶路撒冷圣所当作列国一般庙宇对待，却不在译文中加入原文没有明说的神学评断。
- issue: 大祭司职位被出售的语气
  choice: 译为“每年都拿来出售”
  alternative: 译为“每年都可出售”或“每年卖掉”
  rationale: “拿来出售”保留 πρατήν 所强调的挂牌出售、商品化之意，同时不武断判定每一年是否必然完成交易。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“须缴纳贡税”表达行政性措施，“拿来出售”保留原文对大祭司职位商品化的冲击力。全句仍以分号收束，以反映其在上下文中属于尚未完结的政策清单。
