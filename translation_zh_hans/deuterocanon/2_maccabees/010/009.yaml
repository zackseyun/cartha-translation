base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/009.yaml
  text: And all together they blessed the merciful God and were strengthened in their souls[b][a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: zh_hans
  text: 众人一同称颂那满有怜悯的上帝，心灵也得以刚强[a]，已经准备好去击伤不但人，也击伤最凶猛的野兽和铁墙。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“他们的心灵得以刚强”；也可意译为“他们鼓起勇气”。
    reason: lexical_alternative
  - marker: b
    text: “击伤……铁墙”是强烈的夸张说法，形容他们作战时勇气非凡。
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: 众人一同
  rationale: 同时保留 πάντες 的全体范围和 ὁμοῦ 的共同、同时之意；中文语序自然。
- source_word: εὐλόγησαν
  choice: 称颂
  rationale: 用于人对上帝时，εὐλογέω 表示祝颂、赞美；“称颂”既符合圣经语体，也比“祝福上帝”更符合现代汉语习惯。
- source_word: τὸν ἐλεήμονα θεόν
  choice: 满有怜悯的上帝
  rationale: 直接表达 ἐλεήμων 所指的怜悯属性，同时保持庄重而通顺的现代汉语。
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: 心里也刚强起来
  rationale: 表达内在力量和勇气得到增强，不把 ψυχαῖς 技术化为特定灵魂论；被动含义在“刚强起来”中仍可感知。
- source_word: οὐ μόνον ἀνθρώπους θῆρας δὲ τοὺς ἀγριωτάτους καὶ σιδηρᾶ τείχη
  choice: 不仅击伤人，甚至连最凶猛的野兽和铁墙也要击伤
  rationale: 保留从人到凶猛野兽再到铁墙的递进和夸张；“甚至连……也”自然呈现希腊文的加强语势。
- source_word: τιτρώσκειν
  choice: 击伤
  rationale: 保留“使受伤、创伤”的基本意义，并让同一动词统摄人、野兽和铁墙，以免抹去原文刻意而强烈的夸张。
- source_word: ὄντες ἕτοιμοι
  choice: 准备好
  rationale: 保留他们内心刚强之后随即具备行动准备的分词关系。
theological_decisions:
- issue: ψυχαῖς 的人论含义
  choice: 心里也刚强起来
  alternative: 灵里得着力量；鼓起勇气
  rationale: 上下文着重内在勇气和决心，而非对“魂”或“灵”作技术性区分；译文不引入特定的人论体系，同时脚注保留较贴近字面的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称颂”和“满有怜悯”保持经文语体；“心里也刚强起来”避免生硬的灵魂术语。末句有意保留原文把“铁墙”列为“击伤”对象的不寻常表达，并以脚注说明其夸张修辞。
