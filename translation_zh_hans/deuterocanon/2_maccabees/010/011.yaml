  yaml_path: translation/deuterocanon/2_maccabees/010/011.yaml
  text: But springing at the enemies like lions[a], they laid low eleven thousand of them, and one thousand six hundred cavalry; and they forced them all to flee.
translation:
  language: zh_hans
  text: 他们像狮子一样猛扑敌军，击倒了其中一万一千人，又击倒一千六百名骑兵[a]，并迫使他们全都逃跑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“一千加在一万之上……六百加在一千之上”。
    reason: 说明原文两个数目的加法式表达；正文为便于阅读而直接译出合计数。
lexical_decisions:
- source_word: λεόντινων
  choice: 像狮子一样
  rationale: 这是罕见的副词性比较表达，描绘进攻时如狮子般勇猛凶烈；译文保留明喻，避免生硬的“狮子般地”。
- source_word: ἐντινάξαντες
  choice: 猛扑
  rationale: 分词表示突然、猛烈地冲向敌人；“猛扑”既传达动作力度，也与狮子的意象自然衔接。
- source_word: κατέστρωσαν
  choice: 击倒
  rationale: 此词在战斗语境中指把敌人打倒、杀倒；“击倒”保留其强烈含义，同时不把词义绝对限定为明确死亡。
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: 一万一千人
  rationale: 希腊文以“一千加在一万之上”的加法结构表示总数；正文直接合计，符合现代汉语习惯。
- source_word: ἱππεῖς
  choice: 骑兵
  rationale: 指作为军事力量的骑马作战人员；“骑兵”简洁、准确，适合战事叙述。
- source_word: ἑξακοσίους πρὸς χιλίοις
  choice: 一千六百名
  rationale: 希腊文以“六百加在一千之上”的结构表示总数；正文采用现代汉语通常的合计表达。
- source_word: ἠνάγκασαν φεύγειν
  choice: 迫使他们全都逃跑
  rationale: 保留使役结构和 πάντας 的全称语气，直接表达敌军被迫溃逃。
