  yaml_path: translation/deuterocanon/2_maccabees/010/020.yaml
  text: But concerning these matters in detail[b][a], I have instructed both these men and those from me to speak with you.
translation:
  language: zh_hans
  text: 至于这些事的细节[a]，我已经吩咐这几个人和我这里的人[b]与你们商谈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细节”也可译作“逐项”或“具体事项”。
    reason: lexical_alternative
  - marker: b
    text: 直译“来自我这里的人”；可能指写信者所派的人或其代表。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: 至于这些事
  rationale: ὑπέρ与属格τούτων在此引出所谈事项，译为“至于这些事”自然地保留书信语气；δέ体现话题转折。
- source_word: κατὰ μέρος
  choice: 细节
  rationale: 该短语表示逐项、具体或详细地处理事情；“这些事的细节”符合现代汉语表达，同时以脚注保留“逐项”的可能性。
- source_word: ἐντέταλμαι
  choice: 我已经吩咐
  rationale: ἐντέλλομαι的完成时中间/被动形式表示先前已作出、现仍有效的指示。“已经吩咐”既体现完成时效力，也符合外交书信语域。
- source_word: τούτους
  choice: 这几个人
  rationale: 指在场或收信人已知的一组人；“这几个人”比生硬的“这些人”更自然，并未额外指定其职务。
- source_word: τοὺς παρʼ ἐμοῦ
  choice: 我这里的人
  rationale: 字面为“来自我这里的人”。“我这里的人”保留其关系性和一定歧义，不擅自确定他们是使者、代表或另行派出的人。
- source_word: διαλεχθῆναι ὑμῖν
  choice: 与你们商谈
  rationale: διαλέγομαι在此指交谈、讨论或协商；“商谈”符合正式外交语境，并保留双向沟通之意。
