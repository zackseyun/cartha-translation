  yaml_path: translation/deuterocanon/2_maccabees/010/023.yaml
  text: since our father has departed to the gods[a], and since we desire that those in the kingdom, being free from disturbance, should give attention to the affairs of the Jews,
translation:
  language: zh_hans
  text: 既然我们的父王已经归到众神那里[a]，我们希望国中的人安定无扰，能够关注并处理犹太人的事务，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文作“归到众神那里”，这是希腊化时代王室从宫廷立场对死亡所用的委婉说法。
    reason: 说明“归到众神那里”保留了原文的多神论宫廷措辞，并解释其作为死亡委婉语的文化功能。
lexical_decisions:
- source_word: ἐπὶ τοῦ πατρὸς ἡμῶν
  choice: 自从我们的父王
  rationale: ἐπί与属格分词结构兼有时间和缘由色彩；“自从”自然传达这一背景。结合王室诏书语境，将πατήρ译作“父王”，比单说“父亲”更清楚，也未改变亲属关系。
- source_word: εἰς θεοὺς μεταστάντος
  choice: 归到众神那里
  rationale: 保留原文明确的复数θεούς及希腊化宫廷对君王死亡的委婉说法，不将其淡化为单纯的“去世”。“归到……那里”既自然又保留了“转往、离去”的意象。
- source_word: βουλόμενοι
  choice: 我们希望
  rationale: 该分词表达诏书发布者的意愿；“我们希望”符合王室复数口吻，庄重而自然。
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: 国中的人
  rationale: 按其阳性复数形式理解为王国内的人或臣民；“国中的人”避免将范围不必要地限定为官员。
- source_word: ἀπερισπάστως ὄντας
  choice: 不受纷扰
  rationale: ἀπερισπάστως表示不被牵扯、分心或搅扰；在行政政治语境中，“不受纷扰”兼顾外在安定与不受牵制之意。
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: 能够专心处理犹太人的事务
  rationale: 该结构指向对犹太人相关事务的关注、照管或行政处置。“处理……事务”保留行政语境；“专心”与前面的ἀπερισπάστως衔接，使压缩的希腊句法在中文中清楚可读。
theological_decisions:
- issue: εἰς θεοὺς μεταστάντος中的希腊化王室死亡用语
  choice: 归到众神那里
  alternative: 去世了／死了
  rationale: 原文采用明确的多神论宫廷措辞。译文将其作为塞琉古王室说话者的观点如实保留，并以脚注说明其文化功能，既不替文本背书，也不以中性死亡用语抹去原有张力。
- issue: ἐπιμέλεια所表达的关照性质
  choice: 处理犹太人的事务
  alternative: 照顾犹太人
  rationale: ἐπιμέλεια可指关心、照管或行政管理；上下文是王室政务语言，因此不将其单向解释为仁慈或慈善性的“照顾”。
translation_notes:
  register: 采用现代、庄重而易懂的诏书语体。保留句末逗号，因为本节原文是后续王室陈述的一部分。用“父王”明确王室语境；用“众神”保存原文复数和叙述视角，不把异教宫廷语言改写为译者立场。
