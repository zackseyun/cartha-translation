base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/007.yaml
  text: But Maccabeus himself was the first to take up arms[a], and he urged the others, by risking danger together with him, to come to the aid of their brothers[b]; and together they also charged out eagerly.
translation:
  language: zh_hans
  text: 马加比本人首先拿起武器，劝勉其他人与他一同冒险，前去援助他们的弟兄[a]；众人就一起奋勇冲了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里也可指“同胞”，即他们的犹太同族人。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: 率先
  rationale: 此处为表语用法，强调马加比在众人之前带头行动；“率先”简洁自然。
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: 拿起武器
  rationale: 既保留“拿起”的动作，也在军事语境中自然表达武装起来之意。
- source_word: προετρέψατο
  choice: 劝勉
  rationale: 表达鼓励并敦促他人采取行动，语体庄重而不生硬。
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: 和他一同冒险
  rationale: 分词短语修饰被劝勉的“其他人”，表示他们与马加比共同承担危险；避免误作手段状语。
- source_word: ἐπιβοηθεῖν
  choice: 前去援助
  rationale: 该复合动词含赶赴支援之意，“前去援助”比单纯“帮助”更符合紧迫的军事场景。
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: 他们的弟兄
  rationale: 直译亲属称谓，同时保留其可指同胞或同族人的语境含义，并以脚注说明。
- source_word: ὁμοῦ
  choice: 一起
  rationale: 明确众人的集体行动。
- source_word: προθύμως
  choice: 奋勇
  rationale: 在军事语境中兼顾甘愿、热切和积极投入的意味。
- source_word: ἐξώρμησαν
  choice: 冲了出去
  rationale: 保留动词所含向外迅猛出动的力度，符合战斗场景。
theological_decisions:
- issue: ἀδελφοῖς在民族与军事共同体语境中的所指
  choice: 他们的弟兄
  alternative: 他们的同胞
  rationale: 原文使用阳性复数“弟兄”，语境中可能泛指犹太同胞。正文保留原有亲属隐喻，不将其含义单一化；脚注交代可能的语境义。
- issue: ἅμα αὐτῷ διακινδυνεύοντας与主句的关系
  choice: 劝勉其他人和他一同冒险，前去援助
  alternative: 借着和他一同冒险，劝他们前去援助
  rationale: 该宾格分词与“其他人”一致，最自然地说明他们受劝后将与他共同涉险；译文保留行动关系，不赋予额外神学解释。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“率先”“奋勇冲了出去”传达原文紧凑有力的军事行动感；避免照搬英语层的句法，并依据希腊文将共同冒险明确归于受劝勉的其他人。
