  text: 我也派了墨涅拉俄去劝勉你们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劝勉”也可译作“敦促”或“恳劝”。
    reason: 希腊词παρακαλέω语义较宽，单凭本句难以确定语气强弱，脚注保留原文的歧义。
lexical_decisions:
- source_word: πέπομφα
  choice: 我……派了
  rationale: 该词是πέμπω的完成时，表示已经差派；汉语用“派了”自然表达已完成的行动。
- source_word: δὲ καὶ
  choice: 也
  rationale: 在此承接上下文并表达附加意义；简洁译作“也”，避免生硬叠加“而且”。
- source_word: τὸν Μενέλαον
  choice: 墨涅拉俄
  rationale: 按希腊人名Μενέλαος音译，并依据宾格形式还原其词典形。
- source_word: παρακαλέσοντα ὑμᾶς
  choice: 去劝勉你们
  rationale: 未来主动分词说明差派他的目的；παρακαλέω可表示劝勉、敦促或恳劝，此处以语义范围较宽且自然的“劝勉”保留其语气弹性。
