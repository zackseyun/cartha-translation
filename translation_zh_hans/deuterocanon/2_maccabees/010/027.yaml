base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/027.yaml
  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
translation:
  language: zh_hans
  text: 王写给犹太民族的信如下：“安条克王向犹太人的长老议会[a]和其他犹太人[b]问安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长老议会”指由长老组成的正式议事机构。
    reason: cultural_note
  - marker: b
    text: “其他犹太人”也可译作“其余的犹太人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: 王写给犹太民族的
  rationale: 结合上下文将定冠词单数ἔθνος明确为犹太民族；用“写给”自然表达Πρὸς所标明的收信对象，并保留其群体、民族性的含义。
- source_word: ἡ τοῦ βασιλέως ἐπιστολή
  choice: 王……的信
  rationale: ἐπιστολή是普通的书信称谓；“信”比“书函”更符合现代汉语，同时王的身份仍保留正式语气。
- source_word: τοιαύδε ἦν
  choice: 如下
  rationale: 这是引出后文信件内容的惯用表达，简洁呈现希腊文的指示作用。
- source_word: Βασιλεὺς Ἀντίοχος
  choice: 安条克王
  rationale: 采用现代汉语中自然的君王名号次序，并保留正式署名的意味。
- source_word: γερουσίᾳ
  choice: 长老议会
  rationale: 该词指由长老组成的正式议事机构；“长老议会”既体现成员身份，也体现机构性质，避免“元老院”可能带来的罗马制度联想。
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: 其他犹太人
  rationale: ἄλλοις把长老议会之外的广大犹太人区分出来；“其他”直译而自然，“其余”也是可行译法。
- source_word: χαίρειν
  choice: 问安
  rationale: 在书信开头，χαίρειν是固定问候语，不宜按字面译作“喜乐”；“问安”符合中文正式书信语体。
