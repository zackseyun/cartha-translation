  text: As before[a], being in battle array and having the ally from heaven[b], because the Lord had shown them mercy.
translation:
  language: zh_hans
  text: 他们照先前一样列阵备战[a]，有来自天上的盟友相助，因为主曾怜悯他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照先前一样，装备妥当”。这里的希腊词既可泛指准备或装备，也可特指军事部署。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文在此较为简略：直译可作“有来自天上的盟友，主怜悯了他们”。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: 像先前一样
  rationale: 这一带冠词的副词性表达指向先前的情形或行动，译为“像先前一样”比单纯的“从前”更能体现比较意味。
- source_word: ἐν διασκευῇ
  choice: 列阵备战
  rationale: διασκευή可泛指装备或准备；在军事语境中，“列阵备战”自然地表达处于战斗部署和戒备状态，同时以脚注保留较宽泛的可能。
- source_word: τὸν ἀπʼ οὐρανοῦ σύμμαχον
  choice: 那位从天上来的盟友
  rationale: σύμμαχος本指并肩作战者。“盟友”保留军事隐喻；“从天上来的”贴近希腊语，又不越过原文明确指认其所指。
- source_word: ἔχοντες
  choice: 有……与他们同在
  rationale: 直译为“有”在现代汉语中略显生硬；加入“与他们同在”明确表达拥有盟助的关系，不改变分词的基本含义。
- source_word: ἐλεήσαντος αὐτοὺς τοῦ κυρίου
  choice: 因为主怜悯了他们
  rationale: 属格独立结构说明他们得到天上盟友的背景或原因；“怜悯”保留ἐλεέω的核心意义，“主”符合犹太希腊文语境中对上帝的敬称。
theological_decisions:
- issue: “从天上来的盟友”的所指及神学力度
  choice: 保留“那位从天上来的盟友”的军事隐喻，不直接将其改写为“上帝”
  alternative: 译作“上帝这位从天上来的盟友”或较宽泛的“天上的帮助者”
  rationale: 原文明言援助来自天上，并将此与主的怜悯相连，却没有在名词短语中直接说明盟友的身份。保留原有表达可避免增加原文未明说的认同，同时维持神圣援助的军事意象。
- issue: 主的怜悯与天上援助之间的关系
  choice: 用“因为”表达解释性或原因性的联系
  alternative: 仅作伴随背景：“主怜悯了他们”
  rationale: 属格独立结构在此最自然地解释他们为何有天上的盟友；但希腊语句法较压缩，因此脚注同时给出较贴近形式的表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“列阵备战”凸显上下文的军事场景；“盟友”保留σύμμαχος的并肩作战色彩。正文以完整汉语句式表达压缩的希腊分词结构，并用脚注保存其形式上的含混。
