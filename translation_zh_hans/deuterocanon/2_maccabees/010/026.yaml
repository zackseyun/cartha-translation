base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention[c][b], they may be encouraged and may live gladly with support for their own interests.
translation:
  language: zh_hans
  text: 所以，你这样做就妥当：派人到他们那里，向他们作出诚信的保证[a]，使他们知道我们的意向后，可以振作起来[b]，并在自己的事务得到扶助时愉快度日[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“给予右手”，是表示和平、诚信或作出保证的希腊语习惯说法。
    reason: lexical_alternative
  - marker: b
    text: “振作起来”也可译作“心情舒畅”或“鼓起勇气”。
    reason: lexical_alternative
  - marker: c
    text: 本句末尾也可较窄地理解为“他们自己的利益得到扶助”，或“他们自己的财物得到保护”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: 所以……就是做得妥当
  rationale: 保留希腊语以将来时表达劝告和肯定的语气；现代汉语用“就是做得妥当”自然传达“你这样做是好的”。
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: 派人到他们那里
  rationale: διαπέμπω在此涉及向对方派遣人员或传达信息；“派人”符合外交语境，又不具体限定为使者团。
- source_word: δοὺς δεξιάς
  choice: 向他们作出友好保证
  rationale: 字面为“交出右手”，是表示和平、信实或保证的习语；正文译出实际含义，脚注保留字面形象。
- source_word: προαίρεσιν
  choice: 意向
  rationale: 该词指经过考虑的意图、目的或取向；“意向”适合正式的外交语境，也不额外解释其内容。
- source_word: εὔθυμοί
  choice: 振作起来
  rationale: 该词表示心情舒畅、鼓起勇气或精神振奋；“振作起来”既自然，也保留因获知对方意向而受到鼓舞的动态。
- source_word: ἡδέως διαγίνωνται
  choice: 安心度日
  rationale: 该短语指愉快、舒心地生活或度过时日；“安心度日”与上下文中的保证和扶助相合，同时保持庄重自然。
- source_word: πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: 在自己的事务得到扶助的情况下
  rationale: ἀντίληψις可指帮助、扶持或照应，τῶν ἰδίων可指他们自己的事务、利益或所有物；正文采用较宽泛的“事务”，避免无根据地局限为财产。
