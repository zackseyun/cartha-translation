    reason: textual_variant
lexical_decisions:
- source_word: ἐνεφάνισεν
  choice: 向我们说明
  rationale: 此动词表示使某事显明、报告或告知；“向我们说明”自然地表达了信息传达给“我们”，同时避免补出原文未明说的宾语内容。
- source_word: βουλόμενος
  choice: 他希望
  rationale: 分词表达米乃劳的愿望或意向；汉语改用分句，可清楚保留其主语及语义关系。
- source_word: κατελθόντας
  choice: 你们下来以后
  rationale: 不定过去时分词通常表示先于不定式动作发生的行动；“下来以后”既保留方向意义，也自然体现动作次序。
- source_word: γίνεσθαι πρὸς τοὺς ἰδίους
  choice: 回到自己人那里
  rationale: 希腊语直译近于“到／与自己人一起”；“回到自己人那里”在现代汉语中通顺，并保留归向本方群体的关系性含义，而不像“恢复”那样增添原文未明说的复归状态。
- source_word: τοὺς ἰδίους
  choice: 自己人
  rationale: 此处为省略表达，指属于你们本方的人、同胞或己方群体；“自己人”简明自然，并保留究竟指亲族、同胞还是阵营的语境歧义。
