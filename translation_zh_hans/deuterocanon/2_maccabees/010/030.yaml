  yaml_path: translation/deuterocanon/2_maccabees/010/030.yaml
  text: Therefore[a], for those going down until the thirtieth of Xanthicus, there will be a right hand given with safe-conduct[c][b],
translation:
  language: zh_hans
  text: 因此，凡下行至散提古月三十日为止的人，都将获准通行；人必向他们伸出右手。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸出右手”直译为“将有右手”。在当时的外交或和解语境中，右手可表示承诺、保证或友好的表示；“获准通行”对应原文“带着许可”，也可理解为准许离去而不受阻拦。
    reason: lexical_alternative
  - marker: b
    text: “散提古月”是希腊化时期所用的马其顿历月份。“下行”也可理解为“离去”或“启程”；本节希腊文十分简略，似乎承接一个更长的句子。
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: 因此
  rationale: 表达承接上文所得出的结果，保持原文的推论语气。
- source_word: καταπορευομένοις
  choice: 下行的人
  rationale: 保留动词所含的向下移动意象；在此语境中也可能泛指离去或启程，故以脚注说明其歧义。
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: 在散提古月三十日以前
  rationale: 将时间界限自然地译入现代汉语，并保留希腊化时期的马其顿月份名称。
- source_word: ὑπάρξει δεξιὰ
  choice: 都将得到右手之约
  rationale: δεξιὰ字面为“右手”，在外交和军事语境中可指以握右手表示的承诺或保证；译文兼顾原有形象与实际含义。
- source_word: μετὰ τῆς ἀδείας
  choice: 和通行许可
  rationale: ἀδεία可指许可、自由或免受干扰；此处与“右手之约”并列，较可能表示获准离去或安全通行。
