translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“下行”和“右手”的原文意象，同时用“之约”和“通行许可”使军事外交语境中的含义清楚；句末保留逗号式未完感并不适合独立中文经节，故用句号收束，但脚注注明原文似属更长句的一部分。
