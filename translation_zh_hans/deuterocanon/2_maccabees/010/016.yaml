  yaml_path: translation/deuterocanon/2_maccabees/010/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
translation:
  language: zh_hans
  text: 因为已有吕西阿写给犹太人的书信，其措辞如下[a]：“吕西阿向犹太民众[b]问安。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“格式如下”“内容如下”。希腊语τὸν τρόπον τοῦτον在这里可指信件的形式或具体措辞。
    reason: lexical_alternative
  - marker: b
    text: “犹太民众”也可译作“犹太人全体”或“犹太人的群体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: 因为已有信写给
  rationale: 用“已有……写给”自然表达迂回构成的过去完成时被动含义，并以“因为”保留γάρ的解释作用。
- source_word: ἐπιστολαὶ
  choice: 信
  rationale: 在公函语境中，“信”是现代汉语最自然、清楚的对应词。
- source_word: τοῖς Ἰουδαίοις
  choice: 给犹太人
  rationale: 将与格理解为书信的收信人。
- source_word: παρὰ μὲν Λυσίου
  choice: 其中一封来自吕西阿
  rationale: παρά加属格表示来源；μὲν暗示后文还会列出其他来信，因此用“其中一封”在汉语中体现其衔接作用。
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: 措辞如下
  rationale: 以自然的公文引述语表达书信含有下列形式或文字，同时不把τρόπος过度限定为纯粹版式。
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: 向犹太民众
  rationale: πλῆθος指作为整体的一大群人；“民众”保留集合性，又不擅自认定这是正式议会。
- source_word: χαίρειν
  choice: 问安
  rationale: 按希腊书信开头的惯用格式翻译，而非按字面译作“喜乐”。
