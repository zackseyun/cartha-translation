revisions:
- from: 玛加比为众人的益处着想，便同意了吕西阿所劝的一切；因为玛加比把有关犹太人的各项要求写下来交给吕西阿，书记都批准了。
  to: 玛加比顾及有益的事，便同意了吕西阿所劝的一切；因为玛加比把有关犹太人的一切事项以书面形式交给吕西阿，书记都同意了。[a]
  rationale: 修订收回两处无原文依据的具体化：不把“有益的事”限定为“众人的益处”，也不把书面提交的事项限定为“要求”。其余维持原有句法推进、正式语体和人名处理。脚注仅说明所给希腊文本中“书记”的读法，不介入文本重建或教义性解释。
