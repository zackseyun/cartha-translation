  - severity: medium
    issue: “各项要求”过度解释ὅσα……ἔδωκεν……διὰ γραπτῶν。
    rationale: 原文只说玛加比以书面形式交给吕西阿的“凡事／所有事项”；这些事项可以是建议、条款或要求，但经文本身没有限定为“要求”。
  - severity: low
