  yaml_path: translation/deuterocanon/2_maccabees/010/015.yaml
  text: But Maccabeus agreed to everything that Lysias urged, being concerned for the common good; for whatever Maccabeus submitted in writing to Lysias concerning the Jews, the secretary approved.
translation:
  language: zh_hans
  text: 玛加比顾及有益的事，便同意了吕西阿所劝的一切；因为玛加比把有关犹太人的一切事项以书面形式交给吕西阿，书记都同意了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书记”：希腊文作“书记”或“文书官”。此处按所给希腊文本翻译，未将其改为吕西阿或其他人物。
    reason: ὁ γραμματεύς在叙事语境中可能令人意外，但Swete文本的读法明确；脚注说明译法所据，保留文本张力。
lexical_decisions:
- source_word: ἐπένευσε
  choice: 同意了
  rationale: 此词表示以点头等方式表示赞同、应允；在谈判语境中译作“同意了”自然准确。
- source_word: παρεκάλει
  choice: 所劝的
  rationale: παρακαλέω在此可指劝说、敦促或请求；“所劝的”保留其劝请意味，不强化为命令。
- source_word: τοῦ συμφέροντος
  choice: 众人的益处
  rationale: 名词化中性分词指有益、合宜之事；结合谈判语境，可自然表达为“众人的益处”，同时不额外限定具体群体。
- source_word: ἔδωκεν … διὰ γραπτῶν
  choice: 把……各项要求写下来交给
  rationale: 直译为“藉着书面材料交给”；中文以“写下来交给”表达书面提交。宾语ὅσα在上下文中指所提交的各项条件或要求。
- source_word: ὁ γραμματεύς
  choice: 书记
  rationale: 按现存希腊文本直译为“书记/文书官”，不依英语咨询层将其擅自替换为其他人物。
- source_word: συνεχώρησεν
  choice: 批准了
  rationale: 在政治协商语境中表示同意、准许；“批准”与书记对书面事项的认可相称。
theological_decisions:
- issue: τοῦ συμφέροντος是否限定为“共同利益”
  choice: 众人的益处
  alternative: 共同利益／有利的事
  rationale: 希腊文没有明确出现“共同”一词；本译既传达公共取向，又避免把隐含对象解释得过于确定。
- issue: 末句主语ὁ γραμματεύς的文本异常
  choice: 书记
  alternative: 王／吕西阿
  rationale: 所给Swete文本明确读作“书记”。虽然叙事与其他文本传统可能引发疑问，但应忠实保留该读法及其张力，不静默校正。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“玛加比”“吕西阿”沿用常见次经人名音译。分号保留原句的因果推进；不添加原文没有的身份说明或神学解释。
