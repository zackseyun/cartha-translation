lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: 至于……那些事
  rationale: ὑπέρ与关系代词ὧν在此引出所谈事项；这一表达既保留复数含义，也符合现代汉语公函语气。
- source_word: Λυσίας
  choice: 吕西阿
  rationale: 按通行圣经人名译法音译希腊人名Λυσίας。
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: 王的亲属
  rationale: συγγενής基本义为有亲缘关系的人；译作“亲属”保留其家族关系含义，同时不额外断定具体亲等或官衔。
- source_word: συνεχώρησεν ὑμῖν
  choice: 准许你们
  rationale: συγχωρέω在外交文书语境中可指准予、让步或许可；“准许”自然地表达对收信人所作的许可，又不把内容具体化。
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: 我们也表示赞同
  rationale: συνευδοκέω表示一同认可、赞同或同意；“也表示赞同”保留说话者对吕西阿决定的共同认可。
