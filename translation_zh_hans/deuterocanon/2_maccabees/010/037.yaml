lexical_decisions:
- source_word: διὸ
  choice: 所以
  rationale: 表示由前文得出的推论；“所以”在现代汉语中自然、清楚地保留了衔接关系。
- source_word: σπεύσατε
  choice: 请赶快
  rationale: 不定过去时命令语气要求立即行动；“赶快”传达紧迫性而不显古奥。
- source_word: πέμψατέ τινας
  choice: 派几个人来
  rationale: τινας是不定复数，指若干人；结合使者或代表前来传达意见的语境，译作“派几个人来”简洁自然。“来”是汉语中按说话者视角补出的趋向表达。
- source_word: ὅπως
  choice: 好让
  rationale: 引出目的；“好让”准确表达目的关系，符合现代汉语习惯。
- source_word: καὶ ἡμεῖς
  choice: 我们也
  rationale: καί强调说话一方同样能够得知；“我们也”保留其附加和强调意味。
- source_word: ἐπιγνῶμεν
  choice: 知道
  rationale: 该不定过去时虚拟式在此指经由来人而确知或弄清；“知道”自然明白，且不夸大复合动词的力度。
- source_word: ὁποῖοί ἐστε γνώμης
  choice: 你们究竟持什么态度
  rationale: 希腊语习语直指对方所持的心意、看法、意向或立场。“持什么态度”保留一定语义宽度，不把它狭窄限定为具体计划；“究竟”体现ὁποῖοι所询问的性质。
