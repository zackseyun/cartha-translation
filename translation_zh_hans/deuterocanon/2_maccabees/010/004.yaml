  yaml_path: translation/deuterocanon/2_maccabees/010/004.yaml
  text: not at all taking into account the might of God[a], but puffed up by the tens of thousands of foot soldiers, the thousands of horsemen, and the eighty elephants.
translation:
  language: zh_hans
  text: 他丝毫不把上帝的大能计算在内[a]，反而仗着数万步兵、数千骑兵和八十头战象，骄傲自大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“丝毫不考虑上帝的能力。”
    reason: ἐπιλογίζομαι可侧重考虑，也可指在盘算中把某事计算在内；κράτος亦可译作“能力”。
lexical_decisions:
- source_word: οὐδάμως
  choice: 丝毫不
  rationale: 表达完全否定的强调语气，现代汉语自然简洁。
- source_word: ἐπιλογιζόμενος
  choice: 计算在内
  rationale: 保留在军事形势中衡量、盘算某项力量的意味，比单纯“想到”更贴近原文。
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: 上帝的大能
  rationale: κράτος在此主要指强大力量，与下文列举的军事力量形成鲜明对照。
- source_word: πεφρονηματισμένος
  choice: 骄傲自大
  rationale: 传达完成时分词所表示的既成、持续的高傲状态；“仗着”补明其骄傲所依恃的军力。
- source_word: μυριάσιν τῶν πεζῶν
  choice: 数万步兵
  rationale: 既保留μυριάς以万为单位的表达，也不武断限定为某个精确总数。
- source_word: χιλιάσι τῶν ἱππέων
  choice: 数千骑兵
  rationale: 复数χιλιάσιν表示若干个千；“骑兵”符合现代军事语境。
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: 八十头战象
  rationale: 准确保留数目；上下文列举军力，因此用“战象”自然显明这些象的军事用途。
theological_decisions:
- issue: 如何翻译用于上帝的κράτος
  choice: 上帝的大能
  alternative: 上帝的能力；上帝的权能
  rationale: 本句着重把上帝的力量与庞大军力相对照；“大能”保留宗教语境中的庄重感，又不把词义扩展为抽象的统治权或主权。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“计算在内”呼应军事盘算，“仗着……骄傲自大”自然呈现希腊语分词与所依恃军力之间的关系。所提供的希腊文内容似与标注的《马加比二书》10:4不相符；本稿严格依据所提供的希腊文翻译，未自行改换源文。
