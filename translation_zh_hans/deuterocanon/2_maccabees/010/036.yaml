base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/036.yaml
  text: But if there are matters that should be brought before the king[a], send someone at once to look into these things, so that we may act as is fitting for us; for we are going on to Antioch.
translation:
  language: zh_hans
  text: 至于已经裁定要呈报给王的事[a]，你们要立刻派一个人调查这些事，好让我们能按合宜的方式处理；因为我们正向安提阿进发。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至于他裁定要呈报给王的事。”希腊文的动词是第三人称单数，但没有明说主语；也可能按非人称的意思理解为“已经裁定的事”。
    reason: 保留原文在 ἔκρινεν 主语及句法理解上的歧义。
lexical_decisions:
- source_word: ἃ δὲ ἔκρινεν
  choice: 至于已经裁定……的事
  rationale: 希腊文表达简练，ἃ 指相关事项，ἔκρινεν 为第三人称单数，主语并未明说。正文采用不指明裁定者的汉语被动式，既自然，也不擅自补出主语。
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: 要呈报给王
  rationale: 该不定式表示把事项提交到更高权威面前；“呈报给王”保留正式语气，又不限定为口头还是书面报告。
- source_word: πέμψατέ τινα παραχρῆμα
  choice: 你们要立刻派一个人
  rationale: πέμψατε 是复数命令式，τινα 指某个人，παραχρῆμα 强调立即行动；此译法准确而符合现代汉语。
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: 来查明这些事
  rationale: ἐπισκέπτομαι 在此有察看、调查之意；“查明”比逐字译作“察看有关这些事”自然，并体现实际核查的目的。
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: 好让我们能按合宜的方式处理
  rationale: 若直译“使我们可以有，如同对我们合宜的”，汉语语意残缺；结合 καθήκει 所表达的适当、本分之意，译出隐含的“处理”，同时避免过度具体化行动内容。
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: 因为我们正向安提阿进发
  rationale: 现在时表示正在进行或即将继续的行程；“向……进发”保留 πρὸς 的方向性，并符合叙事语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的公文叙事语体。“呈报给王”“立刻派一个人”“向安提阿进发”体现正式交涉和行军背景。正文不补出希腊文未明说的裁定者，并以脚注保存另一种较直译的理解。
