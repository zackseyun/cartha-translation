  text: Farewell[a]. In the one hundred forty-eighth year[b], on the twenty-fourth day of Dioscorinthius.
translation:
  language: zh_hans
  text: 愿你们安康。第一百四十八年，迪奥斯科林提乌斯月[a]二十四日[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迪奥斯科林提乌斯”是马其顿历的月份名称，原文作 Διὸς Κορινθίου。
    reason: cultural_note
  - marker: b
    text: 希腊文直译为“第四和第二十”，即二十四日。
    reason: lexical_alternative
  - marker: c
    text: 所提供的希腊文是一封信的结语和日期，与通常编为《马加比二书》10:21的内容不符；在常见章节编排中，这段文字见于11:21。此处按所提供的希腊文翻译。
    reason: source_reference_mismatch
lexical_decisions:
- source_word: ἔρρωσθε
  choice: 愿你们安康
  rationale: 这是书信末尾惯用的祝安语，语法上为复数；译作“愿你们安康”既保留祝愿意味，也符合现代中文书信语感。
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: 第一百四十八年
  rationale: 这是纪年日期格式，指塞琉古纪年第一百四十八年；正文保留原文纪年，不另行换算。
- source_word: Διὸς Κορινθίου
  choice: 迪奥斯科林提乌斯月
  rationale: 该词组是马其顿历的月份名称。采用音译，并补出中文日期表达所需的“月”，避免误读为人名。
- source_word: τετράδι καὶ εἰκάδι
  choice: 二十四日
  rationale: 希腊文直译为“第四和第二十”，是表示二十四日的惯用日期说法；按现代汉语自然译作“二十四日”。
