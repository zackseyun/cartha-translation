  text: All the days I was appearing to you[a], but I neither ate nor drank; rather, you were seeing a vision.
translation:
  language: zh_hans
  text: 在这些日子里，我一直向你们显现[a]，却既没有吃，也没有喝；而是你们所看见的是异象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这些日子里，我向你们显现……而你们所看见的是异象。”希腊文“显现”和“看见”均为未完成过去时，既可突出持续进行，也可在汉语中简译为过去发生的事。
    reason: 说明希腊文两个未完成过去时在汉语中的两种合理表达，并保留其体貌上的歧义。
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: 在所有这些日子里
  rationale: 保留原文涵盖整个时段的意思，同时符合现代汉语的时间表达习惯。
- source_word: ὠπτανόμην
  choice: 我一直向你们显现
  rationale: 该动词表示显现或被看见；未完成过去时在这里适合表达贯穿那段时期的持续状态。“一直……显现”既体现体貌，也避免暗示普通肉身活动。
- source_word: ὑμῖν
  choice: 向你们
  rationale: 直接表达与格所表示的对象关系，与“显现”搭配自然。
- source_word: οὐκ ἔφαγον οὐδὲ ἔπιον
  choice: 却既没有吃，也没有喝
  rationale: 保留原文成对否定及平衡结构；“却”承接显现与实际未进食之间的反差。
- source_word: ἀλλὰ
  choice: 其实
  rationale: 在汉语中体现纠正说明的语气：他们所感知的并非普通的饮食行为，而属于异象。
- source_word: ὅρασιν
  choice: 异象
  rationale: ὅρασις可指视觉景象或超常显现；本段语境涉及天使的可见显现，“异象”能保留其超自然意味，又不进一步界定其本体性质。
- source_word: ὑμεῖς ἐθεωρεῖτε
  choice: 你们一直看见的是
  rationale: “你们”保留原文显式主语的强调，“一直看见”体现未完成过去时所表达的持续观察。
theological_decisions:
- issue: 拉斐尔可见的临在及其行动的性质
  choice: 译文表明拉斐尔在那段时期向他们显现，却没有实际吃喝；他们持续看见的是异象。
  alternative: 可译成“这一切只是看起来如此”，或理解为他们误认了普通事件。
  rationale: 原文明确把“显现”以及“没有吃喝”同他们所见的“异象”相对照。译文保留这种超自然张力，不额外规定天使显现的具体机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“既没有吃，也没有喝”保持原文节奏；“异象”符合经文语域，但整句结构仍便于普通读者理解。
