base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/001.yaml
  text: Then Tobit called Tobias his son and said to him[a], “See, child, wages must be given to the man who went with you, and more must be added for him.”
translation:
  language: zh_hans
  text: 托比特叫来他的儿子多比亚，对他说：“你看，孩子，要给那位与你同行的人报酬，还必须多给他一些。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: 叫来
  rationale: 表示把人叫到跟前；“叫来”符合现代汉语叙事，也保留了原文动作。
- source_word: Ὅρα
  choice: 你要
  rationale: 此处命令式用于促使对方留意并履行后面的事；若直译“看哪”在现代汉语中显得生硬，因此将其劝令语气自然融入“你要”。
- source_word: τέκνον
  choice: 孩子
  rationale: 原文是亲昵的称呼“孩子”，并非专指性别的“儿子”；上文已明确多比亚是他的儿子。
- source_word: μισθὸν
  choice: 报酬
  rationale: 指因同行和服务而应付的酬劳；“报酬”比“工资”更适合这类一次性的旅伴服务。
- source_word: τῷ ἀνθρώπῳ
  choice: 那位……的人
  rationale: 所指为特定的男性同行者；汉语关系结构已自然、明确地指向该人，无须另译为“男人”。
- source_word: τῷ συνελθόντι σοι
  choice: 那位与你同行的人
  rationale: 贴近“与你一同前往的人”，同时保持自然、庄重的现代汉语。
- source_word: προσθεῖναι αὐτῷ δεῖ
  choice: 还应当另外加给他一些
  rationale: 保留 δεῖ 的必要语气和 προσθεῖναι 的追加含义；“一些”自然表达原文未明说追加数额的开放性。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事口吻。人名依《多俾亚传》常见音译体系区分父亲“托比特”和儿子“多比亚”。不设脚注：希腊文 τέκνον 直接译作“孩子”，亲属关系已由正文“他的儿子”交代；所给间接希伯来材料的“我儿”不作为古代底本证据，也无需据此改写主文本。
