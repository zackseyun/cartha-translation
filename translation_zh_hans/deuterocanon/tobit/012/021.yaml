  text: And they stood up[a], and they did not see him.
translation:
  language: zh_hans
  text: 他们站起来，没有看见他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们起身，再也看不见他。”希腊文直译为“他们没有看见他”；这可能暗示他从他们眼前消失，但原文没有直接说明。
    reason: 词义及语境上的另一种译法
lexical_decisions:
- source_word: ἀνέστησαν
  choice: 站起来
  rationale: 这是ἀνίστημι的简单过去时，在叙事中表示起身的动作；“站起来”自然、清楚，也不作过度解释。
- source_word: οὐκ εἶδον
  choice: 看不见……了
  rationale: 希腊文直译为“没有看见”，但在这一连续动作的语境中，现代汉语用“看不见……了”自然表达他们起身后已不再见到他的结果，同时不明说消失的方式。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性单数宾格代词，按上下文指拉斐尔；译作“他”直接明确。
theological_decisions:
- issue: 是否明确说这是一次神迹性的消失
  choice: 从人物观察的角度译作“却看不见他了”
  alternative: 他从他们眼前消失了
  rationale: 原文只陈述他们没有看见他，并未直接说明他如何离去；译文保留这种克制，不把语境中的暗示改写成明说。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“却”自然标示起身寻找与未见其人的转折；句末“了”表达状态变化。
