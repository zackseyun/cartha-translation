  text: And the two were shaken, and they fell facedown, because they were afraid.
translation:
  language: zh_hans
  text: 两人都惊慌不安，俯伏在地，因为他们害怕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: 惊慌不安
  rationale: 该动词的被动形式表示内心受到搅扰、陷入慌乱；“惊慌不安”既体现突然而强烈的情绪震动，又不把它与后句明确说出的“害怕”完全等同。
- source_word: οἱ δύο
  choice: 两人都
  rationale: 实词化数词指前文中的多比和多俾亚二人；“两人都”符合现代汉语表达，并保留二人共同反应的含义。
- source_word: ἔπεσον ἐπὶ πρόσωπον
  choice: 俯伏在地
  rationale: 这一表达描写面朝地倒下或伏地的姿势。“俯伏在地”自然、庄重，也呈现身体伏地的动作，但不额外断定这是敬拜。
- source_word: ἐφοβήθησαν
  choice: 他们害怕
  rationale: φοβέομαι在此直接表达惧怕；“害怕”是清楚、自然的现代汉语对应词。
- source_word: ὅτι
  choice: 因为
  rationale: ὅτι在这里引出俯伏在地的原因，用“因为”明确保留因果关系。
theological_decisions:
- issue: 拉斐尔显露身份后两人的反应性质
  choice: 译文描写他们因害怕而俯伏在地，不加入敬拜用语。
  alternative: 可把俯伏理解为在天使面前表达敬畏或尊崇。
  rationale: 希腊文明确把俯伏与害怕联系起来，却没有使用敬拜一词；译文因此保留动作及其明说的原因，不进一步界定其神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“惊慌不安”与“害怕”形成先受震动、后说明原因的层次；“俯伏在地”保留原文姿态，同时避免生硬直译“倒在脸上”。
