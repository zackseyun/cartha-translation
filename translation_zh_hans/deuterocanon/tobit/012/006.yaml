base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/006.yaml
  text: And calling the two of them privately[a], he said to them, “Bless God and give thanks to him; give him greatness, and give thanks to him before all the living for what he has done with you. It is good to bless God and to exalt his name, showing forth with honor the words of the works of God[c][b]; and do not be reluctant
translation:
  language: zh_hans
  text: 他私下叫了那两个人来，对他们说：“你们要称颂上帝，向他称谢；要将伟大归给他，并要在一切活人面前，为他与你们一同所做的事[a]向他称谢。称颂上帝、高举他的名，并恭敬地讲述上帝作为的事迹，是美好的；不要……[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他与你们一同所做的事”也可理解为“他为你们所做的事”。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希腊文本在“不要”之后中断；这项禁令的内容接续在下一节。
    reason: textual_variant
lexical_decisions:
- source_word: καλέσας τοὺς δύο κρυπτῶς
  choice: 私下叫来他们二人
  rationale: 以自然的汉语叙事表达分词结构，并将 κρυπτῶς 译为“私下”，表明避开众人交谈，不额外加入诡秘色彩。
- source_word: Εὐλογεῖτε τὸν θεόν
  choice: 称颂上帝
  rationale: 中文对上帝使用“称颂”既保留 εὐλογεῖν 的祝颂语感，也比字面“祝福上帝”更符合现代汉语习惯。
- source_word: ἐξομολογεῖσθε
  choice: 称谢
  rationale: 本段语境是公开承认并感谢上帝的作为，而非认罪；“称谢”兼有感谢与公开颂扬之意，并保留庄重经文语体。
- source_word: μεγαλωσύνην δίδοτε αὐτῷ
  choice: 要将伟大归给他
  rationale: 保留“把伟大给予他”的源语意象，同时用“归给”明确这是承认、宣告上帝的伟大，并非使上帝变得伟大。
- source_word: ἐνώπιον πάντων τῶν ζώντων
  choice: 在一切活人面前
  rationale: 较贴近原文的广泛公开范围，也保留其庄重而略带圣经色彩的表达。
- source_word: περὶ ὧν ἐποίησεν μεθʼ ὑμῶν
  choice: 为他与你们一同所做的事
  rationale: 保留 μετά 的“与你们同在／一同”关系，不直接消解为“为你们”；因汉语可能略显特殊，脚注列出符合语境的另一理解。
- source_word: ὑψοῦν τὸ ὄνομα αὐτοῦ
  choice: 高举他的名
  rationale: “高举……的名”是准确、清楚且通行的中文圣经表达，传达公开尊崇之意。
- source_word: τοὺς λόγους τῶν ἔργων τοῦ θεοῦ
  choice: 上帝作为的事迹
  rationale: 原文结构压缩，字面近于“上帝诸作为的话语”；中文以“作为的事迹”表达有关这些作为的叙述，避免生硬而不增添具体内容。
- source_word: ἐντίμως ὑποδεικνύντες
  choice: 恭敬地宣扬
  rationale: “恭敬地”保留 ἐντίμως 的尊荣意味，“宣扬”体现 ὑποδεικνύντες 将事情展示、说明出来的公开性质。
- source_word: καὶ μὴ
  choice: 不要……
  rationale: 所给希腊文本到否定语开头即中断；用省略号忠实标示句意未完，不凭后文补足。
theological_decisions:
- issue: 对上帝使用 εὐλογεῖν 的译法
  choice: 称颂上帝
  alternative: 祝福上帝；赞美上帝
  rationale: “称颂”既保留祝颂类动词的神学语感，又符合现代汉语对上帝的自然表达；单译“赞美”会弱化原词的祝颂措辞。
- issue: ἐξομολογεῖσθε 在此处的含义
  choice: 向他称谢
  alternative: 向他认罪；赞美他
  rationale: 上下文要求公开述说上帝的作为，因此这里指感恩、承认和颂扬，而不是承认罪过。
- issue: μεθʼ ὑμῶν 所表达的上帝作为与人的关系
  choice: 他与你们一同所做的事
  alternative: 他为你们所做的事
  rationale: 正文保留介词“与”的真实歧义和关系性表达，不把它无声地解释为单向施惠；脚注说明“为你们”这一合乎语境的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“称颂”“称谢”“高举他的名”保留经文语体，但避免过度古雅。正文保留原文关于“与你们一同／为你们”的歧义，并以省略号明确反映底本文句在此处未完。
