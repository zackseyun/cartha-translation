base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/007.yaml
  text: Do not hesitate to acknowledge him[a]. It is good to conceal a king’s secret, but to reveal the works of God gloriously. Do what is good[b], and evil will not find you.
translation:
  language: zh_hans
  text: 不要迟疑，要公开颂谢他[a]。君王的秘密，隐藏起来是好的；上帝的作为，却要光荣地宣扬[b]。你们要行善，恶就不会找上你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“公开承认他”、“向他称谢”或“公开赞美他”。这个希腊动词随语境可表达公开承认、称谢、赞美，也可表示认罪。
    reason: lexical_alternative
  - marker: b
    text: 或译“尊荣地”或“以应有的尊荣”。这个希腊副词可能说明人应以合宜、尊荣的方式述说上帝的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκνεῖτε
  choice: 不要迟疑
  rationale: 该动词可表示畏缩、迟疑或拖延；这里用否定命令语气，译作“不要迟疑”自然地保留劝勉力度。
- source_word: ἐξομολογεῖσθαι αὐτῷ
  choice: 公开颂谢他
  rationale: ἐξομολογεῖσθαι 可指公开承认、称谢或赞颂；上下文紧接着谈到宣扬上帝的作为，因此“公开颂谢”较贴合此处的公开赞美与感谢之意，同时以脚注保留其他可能。
- source_word: μυστήριον βασιλέως
  choice: 君王的秘密
  rationale: μυστήριον 在这里指应当保密的事情，而非神学意义上的“奥秘”；“君王的秘密”清楚而合乎汉语习惯。
- source_word: καλὸν κρύψαι
  choice: 隐藏起来是好的
  rationale: 保留希腊文格言式的不定式结构及其道德评价，并与下句“宣扬”形成鲜明对照。
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: 上帝的作为
  rationale: ἔργα 可指工作或事迹；“上帝的作为”是现代汉语中透明、庄重且涵盖面适当的表达。
- source_word: ἀνακαλύπτειν
  choice: 宣扬
  rationale: 该词本义是揭开、披露或使人知道。此处所涉及的是上帝的作为，译作“宣扬”能自然表达把这些作为公开传开，同时与“隐藏”构成对照。
- source_word: ἐνδόξως
  choice: 光荣地
  rationale: 该副词说明宣扬上帝作为的方式，可含荣耀、尊荣或合宜体面的意味；正文采用“光荣地”，脚注保留“以应有的尊荣”等可能。
- source_word: ἀγαθὸν ποιήσατε
  choice: 你们要行善
  rationale: 简洁地表达复数命令语气以及“做善事、行美善”的伦理要求。
- source_word: κακὸν οὐχ εὑρήσει ὑμᾶς
  choice: 恶就不会找上你们
  rationale: 保留原文“恶不会找到你们”的拟人化意象，不把 κακόν 过早限定为灾祸、伤害或道德邪恶中的某一种。
theological_decisions:
- issue: ἐξομολογεῖσθαι αὐτῷ 的含义
  choice: 公开颂谢他
  alternative: 公开承认他／向他认罪／公开赞美他
  rationale: 上下文将隐藏君王的秘密与宣扬上帝的作为相对照，较支持公开称谢、赞颂的意思，而不像是专指认罪；脚注保存该动词真实的词义宽度。
- issue: ἐνδόξως 的语气
  choice: 光荣地
  alternative: 尊荣地／以应有的尊荣
  rationale: 该词用于宣扬上帝的作为时可能带有荣耀上帝的颂赞色彩，也可较一般地表示以尊荣、合宜的方式；正文与脚注共同保留这种张力。
- issue: κακόν 的范围
  choice: 恶
  alternative: 灾祸／伤害
  rationale: 希腊词既可指道德上的恶，也可指临到人的祸患或伤害；正文不将其窄化，以保留格言的宽广含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“君王的秘密”与“上帝的作为”保持格言式对偶；末句保留“恶找上人”的拟人表达。脚注标记均置于其实际解释的词语之后，尤其将[b]附在“光荣地宣扬”之后。
