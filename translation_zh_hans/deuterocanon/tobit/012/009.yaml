base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/009.yaml
  text: Almsgiving rescues from death[a], and it will cleanse away every sin. Those who do acts of almsgiving and righteousness will be filled with life.
translation:
  language: zh_hans
  text: 施舍能救人脱离死亡，也必除净一切罪。行施舍和公义之事的人，必得享生命的丰盛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必得享生命的满足。”
    reason: 希腊文 πλησθήσονται 配属格可表示“被……充满”，也可表示“充分得享、满足于……”。
lexical_decisions:
- source_word: ἐλεημοσύνη / ἐλεημοσύνας
  choice: 施舍
  rationale: 该词在这里指向有需要的人具体施予财物的怜悯行动；“施舍”比宽泛的“慈善”更准确，也能以单数集合名词自然涵盖希腊文复数所指的多次行动。
- source_word: ῥύεται
  choice: 救人脱离
  rationale: 该动词表示从危险中解救；补出受惠者“人”，使现代汉语自然，同时保留“从死亡中解救”的直接含义，避免额外引入系统性的救恩术语。
- source_word: ἐκ θανάτου
  choice: 脱离死亡
  rationale: 忠实表达介词ἐκ所表示的“从……出来、脱离”以及θάνατος的通常意义。
- source_word: ἀποκαθαριεῖ
  choice: 必洗净
  rationale: 复合动词具有彻底洁净、除去污秽的意味；“洗净”简明地兼顾洁净与除去罪的意象。
- source_word: πᾶσαν ἁμαρτίαν
  choice: 一切罪
  rationale: 保留πᾶσαν的全面涵盖力；现代汉语用“一切罪”比逐项式的“每一项罪”更自然。
- source_word: ποιοῦντες
  choice: 行……之事
  rationale: 分词表示持续实行或实践；“行……之事”既体现行动性，也能自然统摄后面的两个复数名词。
- source_word: δικαιοσύνας
  choice: 公义之事
  rationale: 希腊文复数及其与“施舍”并列的结构指向具体的正直行为；“公义之事”保留“公义”这一圣经核心用语，同时显明其实践层面。
- source_word: πλησθήσονται ζωῆς
  choice: 必充满生命
  rationale: 贴近未来被动式及其“被充满”的鲜明意象，不预先限定“生命”究竟指长寿、活力还是更丰盛的福分。
theological_decisions:
- issue: 施舍与脱离死亡、洁净罪之间的关系
  choice: 按原文直陈：施舍能使人脱离死亡，并必洗净一切罪。
  alternative: 将其弱化为慷慨通常带来实际益处的智慧格言，或加上悔改、圣约等原文未明说的限定。
  rationale: 希腊文直接作出这一宣告；译文保留其神学张力，不将其淡化，也不以任何后起教义体系替原文加以解释。
- issue: δικαιοσύνας在犹太智慧文学语境中的含义
  choice: 译作“公义之事”。
  alternative: 译作“正义”或仅作抽象的“公义”。
  rationale: 复数形式以及与“施舍”并列的关系表明这里侧重具体的正直行为；加入“之事”可表达这一点，同时保留“公义”的圣经用语。
- issue: πλησθήσονται ζωῆς所指生命的范围
  choice: 保留为“必充满生命”。
  alternative: 明确解释为长寿、今生福乐或永生。
  rationale: 原文没有限定“生命”的具体范围；直译其意象可保留这种真实的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“施舍”保留具体济助穷乏者的含义；“公义之事”兼顾传统圣经词汇与原文复数所体现的实践性。脚注置于其实际对应的末句，而非“死亡”之后。
