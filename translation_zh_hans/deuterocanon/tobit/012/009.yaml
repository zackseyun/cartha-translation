  to: 施舍能救人脱离死亡，也必除净一切罪。行施舍和公义之事的人，必得享生命的丰盛[a]。
  rationale: 仅作必要的汉语表达修订：末句以“得享生命的丰盛”自然传达“被生命充满／得享生命”的意象，并以脚注保留“满足”的可行表达；“除净”更清楚体现复合动词的除去、洁净之义。译文仍保留原文关于施舍、死亡和罪的直接神学张力，未加入解释性限定。
