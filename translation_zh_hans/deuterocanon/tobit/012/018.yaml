  text: For it was not by my own favor[a], but by the will of your God. Therefore bless him forever.
translation:
  language: zh_hans
  text: 因为这不是出于我自己的恩惠[a]，而是出于你们上帝的旨意。因此，你们要永远称颂他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我自己的恩典”。希腊语χάρις可指“恩典”或“恩惠”；这里可能指拉斐尔自己的好意或施惠，而非出于上帝的旨意。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: 恩惠
  rationale: χάρις可指恩典、恩惠或善意。此处拉斐尔否认自己的行动出于个人施惠或主动意愿；“恩惠”既保留原词的施恩意味，也避免把叙事语境过度教义化。
- source_word: θελήσει
  choice: 旨意
  rationale: θέλημα在此表示意愿、决定或意图；“旨意”与“上帝”搭配自然，且准确表达行动依照上帝的意愿。
- source_word: τοῦ θεοῦ ὑμῶν
  choice: 你们上帝的
  rationale: 保留复数第二人称的关系性属格，表明拉斐尔向多位听者说话。
- source_word: ὅθεν
  choice: 因此
  rationale: ὅθεν在此引出基于前句的结论和劝告；“因此”清楚保留逻辑关系。
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: εὐλογέω用于人对上帝时有颂赞、赞美之意；“称颂”比直译“祝福”更符合现代汉语中人向上帝发出的赞颂，同时保持庄重的圣经语体。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该固定表达在此指持续到永恒；“永远”自然、简明。
- source_word: ἐμαυτοῦ
  choice: 自己的
  rationale: 反身代词具有强调作用，突出不是出于拉斐尔本人；“自己的”自然体现这一强调。
theological_decisions:
- issue: 拉斐尔否认行动根据时χάρις的含义
  choice: 译作“自己的恩惠”，表达此事并非出于拉斐尔个人的施惠或主动意愿。
  alternative: 译作“自己的恩典”，更直接保留χάρις的传统神学用语。
  rationale: 叙事重点是拉斐尔受上帝差遣、按上帝旨意行事，而非阐述“恩典”教义；正文用“恩惠”保留语义张力，脚注说明“恩典”这一可能译法。
- issue: εὐλογεῖτε用于人对上帝时的表达
  choice: 译作“称颂他”。
  alternative: 译作“祝福他”。
  rationale: 希腊词本身是“祝福／称颂”，但现代汉语“祝福上帝”容易被理解为人向上帝赐福；“称颂”准确传达此处对上帝的颂赞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我这样做”补出希腊文依上下文省略的行动指向，使中文句子完整；“你们”保留原文复数。“称颂”保持敬拜语境的庄严感，同时避免“祝福上帝”在现代汉语中的歧义。
