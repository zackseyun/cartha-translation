  yaml_path: translation/deuterocanon/tobit/012/002.yaml
  text: And he said[a], “Father[b], I lose nothing by giving him half of what I have brought back.”
translation:
  language: zh_hans
  text: 他说：“父亲，我把带回来的东西[a]的一半给他，也不会吃亏[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“我所带来的东西”；结合托比亚从旅程返回的语境，这里译作“带回来的东西”。后期从亚兰文手稿回译而成的希伯来文平行材料也提到“从那里带来的钱”，可作为语境上的参照，但不是古代希伯来文见证。
    reason: cross_reference
  - marker: b
    text: 希腊文直译为“我不受损害”；这里是说，把带回之物的一半给向导作酬劳，并不会使托比亚蒙受损失。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ
  choice: 父亲
  rationale: 这是对父亲的直接称呼；简洁地译作“父亲”，既贴近希腊文，也符合庄重自然的现代汉语。
- source_word: οὐ βλάπτομαι
  choice: 我也不会吃亏
  rationale: 此处表示托比亚不会因这笔酬报而蒙受损失；“不会吃亏”比直译“不会受伤害”更符合财物分配的语境。
- source_word: δοὺς αὐτῷ
  choice: 把……给他
  rationale: 分词字面可作“已经给了他”，但在语境中表达设想或愿意采取的行动；用“就是把……给他”保留其与主句相伴的关系，又不武断限定为已经发生。
- source_word: τὸ ἥμυσυ
  choice: 分一半
  rationale: 自然表达“把所带之物的一半给他”，准确传达半数的含义。
- source_word: ὧν ἐνήνοχα
  choice: 带回来的东西
  rationale: 完成时表示已经带来且结果仍然相关；结合旅行归来的语境，译作“带回来的东西”自然，并得到闪语平行材料所反映的“从那里带来”之意支持。
