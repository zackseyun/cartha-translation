base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/008.yaml
  text: Prayer with fasting[a], almsgiving, and righteousness is good; a little with righteousness is better than much with unrighteousness[b]. It is good to do almsgiving rather than to store up gold.
translation:
  language: zh_hans
  text: 祷告伴随着禁食、施舍和正义，是好的；少有而行正义，胜过多有而行不义。[a]施舍比积存金子更好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正义”和“不义”也可译作“公义”和“不公义”；这里的词既可指公正的行为，也可指合乎正道的生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὸν
  choice: 是好的／胜过
  rationale: 首句直译为“是好的”；第二处虽仍是原级形容词，但与ἢ构成比较，汉语自然表达为“胜过”。
- source_word: προσευχὴ μετὰ νηστείας
  choice: 祷告若伴着禁食
  rationale: μετά表示相伴关系，不明确说明手段或条件；“伴着”保留这一开放性。加入“若”使汉语判断句自然，但不将其强化为严格条件。
- source_word: ἐλεημοσύνης / ποιῆσαι ἐλεημοσύνην
  choice: 施舍／施舍
  rationale: 在犹太希腊语语境中指向有需要的人给予财物；“施舍”简明自然，并在本节前后保持词汇呼应。
- source_word: δικαιοσύνης
  choice: 正义
  rationale: 此处与财物多少及不义行为相对，侧重公正、正直的伦理实践；“正义”也保留δικαιοσύνη在本节中的道德分量。
- source_word: τὸ ὀλίγον / πολὺ
  choice: 拥有不多／拥有很多
  rationale: 原文仅说“少量／很多”，未明说所指；结合积存金子的下句，汉语补出中性的“拥有”，同时不限定为收入或财富。
- source_word: ἀδικίας
  choice: 不义
  rationale: 与“正义”形成清楚对照，并保留道德及社会伦理层面的含义。
- source_word: καλὸν
  choice: 胜过
  rationale: 在ἢ引出的比较结构中译为“胜过”，自然表达两种行为之间的价值判断；καλόν本有美好、可嘉之意。
- source_word: θησαυρίσαι χρυσίον
  choice: 积存金子
  rationale: 准确表达积聚、储存黄金；不采用带有额外贬义的“囤积”。
theological_decisions:
- issue: δικαιοσύνη / ἀδικία在智慧文学伦理语境中的译法
  choice: 正义／不义
  alternative: 公义／不公；正直／邪恶
  rationale: 本节将少与多、施舍与积金并置，社会伦理意味突出，因此采用现代汉语自然的“正义／不义”。不过该词也可包含人在上帝面前的正直或公义，脚注说明此层含义，避免将语义限于司法公正。
- issue: 施舍与积存金子的比较是否暗示绝对禁令
  choice: 保留为价值比较“胜过”
  alternative: 译成命令或绝对禁止积存财富
  rationale: 原文是评价性的比较句，并非显式命令；不把它扩展成对一切储蓄或财富的绝对禁令。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“施舍”比“周济”更直接对应ἐλεημοσύνη，并与后半句形成紧密呼应；句式保留原文三项并列和两重比较的箴言风格。
