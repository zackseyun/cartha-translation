base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/003.yaml
  text: because he brought me back to you healthy, and he healed my wife and brought back my money, and he likewise healed you.
translation:
  language: zh_hans
  text: 因为他把我安然无恙地带回到你身边，医治了我的妻子，带回了我的银子，也同样医治了你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑγιῆ
  choice: 健健康康地
  rationale: 保留该词“健康、完好”的核心含义，同时以自然汉语表达他被健康地带回，而不只泛指旅途平安。
- source_word: ἐθεράπευσεν
  choice: 医治了
  rationale: 准确表达使人痊愈、恢复健康的动作；两次出现采用相同译法，以保留原文的呼应。
- source_word: ἀργύριόν
  choice: 银子
  rationale: 原词可指银或钱财；本处指取回的那笔银钱，译作“银子”既贴近原词，也符合叙事背景。
- source_word: ὁμοίως
  choice: 也同样
  rationale: 明确保留拉斐尔医治妻子与医治父亲之间的对应关系。
theological_decisions:
- issue: 医治行动的施事者
  choice: 各项行动均以“他”为主语
  alternative: 改写为上帝借着他施行这些事
  rationale: 本节语法直接述说同行者所做的事；不在译文中加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“健健康康地”自然传达ὑγιῆ的状态意义；全句保留原文连续列举恩惠的节奏。
