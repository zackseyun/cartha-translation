  text: I will certainly not hide any word from you[a]. I have indeed said, ‘It is good to hide a king’s secret[b], but to reveal the works of God gloriously.’
translation:
  language: zh_hans
  text: 我绝不向你们隐瞒任何事。我确实说过：“保守君王的秘密是好的；却荣耀地揭示上帝的作为。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣耀地”也可译作“以尊荣的方式”或“体面地”；这个副词可能强调，应当用与上帝相称的尊荣来揭示他的作为。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ κρύψω ἀφʼ ὑμῶν πᾶν ῥῆμα
  choice: 我绝不向你们隐瞒任何事
  rationale: οὐ μή带将来意味的强烈否定，以“绝不”体现强调；πᾶν ῥῆμα在此指将要披露的一切内容，译作“任何事”比逐字的“任何话”更符合现代汉语。
- source_word: εἴρηκα δὴ
  choice: 我确实说过
  rationale: 以“说过”表达完成时所指的既成言说，以“确实”体现δή的强调作用。
- source_word: μυστήριον βασιλέως
  choice: 君王的秘密
  rationale: 此处μυστήριον指应当保密的君王事务，并不必然具有后世神学术语“奥秘”的含义；“君王的秘密”自然且保留其保密性质。
- source_word: κρύψαι καλόν
  choice: 保守……是好的
  rationale: 该结构表达一般性箴言；汉语谈论秘密时用“保守秘密”比“隐藏秘密”自然，同时保留καλόν的价值判断。
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: 上帝的作为
  rationale: ἔργα指上帝所行之事；“作为”兼具庄重和广泛意义，适合经文语体。
- source_word: ἀνακαλύπτειν
  choice: 宣扬出来
  rationale: 本义为揭开、使人知道；与上帝的作为搭配时，“宣扬出来”自然呈现公开披露之意，也与前句“保守”形成对照。
- source_word: ἐνδόξως
  choice: 光荣地
  rationale: 该副词可指荣耀地、体面地或以尊荣的方式；正文采用较贴近字形与传统语义的“光荣地”，并以脚注保留“尊荣地”的可能。
theological_decisions:
- issue: 智慧文学语境中μυστήριον的含义
  choice: 秘密
  alternative: 奥秘
  rationale: 上下文论及君王应受保密的事务，而非特定的启示性或教义性奥秘；译作“秘密”可避免加入原文并不要求的神学含义。
- issue: ἐνδόξως所修饰的披露方式
  choice: 光荣地宣扬出来
  alternative: 以尊荣的方式揭示出来
  rationale: 保留副词对公开上帝作为之方式的限定，不把它改释成上帝作为本身“荣耀”；同时脚注呈现其荣誉、体面的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“绝不”保留强烈否定；引语保持箴言式的平衡结构。脚注标记置于整段引语之后，明确对应其中“光荣地”的译法。
