  text: And he said to them[a], “Do not be afraid; peace be with you. But bless God forever.”
translation:
  language: zh_hans
  text: 他对他们说：“不要害怕，你们必有平安；但要永远称颂上帝。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: 不要害怕
  rationale: 以现代汉语自然的禁止式表达 φοβέομαι 的命令语气，语意直接而庄重。
- source_word: εἰρήνη ὑμῖν ἔσται
  choice: 你们必有平安
  rationale: ἔσται 是将来时，ὑμῖν 是与格；此译保留“平安将归于你们／你们将有平安”的未来保证，也符合现代汉语习惯。
- source_word: τὸν δὲ θεὸν
  choice: 但要……上帝
  rationale: δέ 在这里表示温和的转折或话题推进；“但要”体现从惧怕转向称颂上帝的劝告。
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: εὐλογέω 以人为主语、以上帝为宾语时，意为祝颂、赞美；“称颂”既保持圣经语体，也避免现代汉语“祝福上帝”可能产生的误解。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是表示持续至永远的惯用语；“永远”简洁、自然并准确传意。
theological_decisions:
- issue: 平安宣告的语气
  choice: 译作未来保证：“你们必有平安”
  alternative: 祝愿或问安：“愿你们平安／愿平安与你们同在”
  rationale: 希腊文明确使用将来时 ἔσται，紧接“不要害怕”，较自然地构成安慰性的应许；不把它改写为单纯的问安或祈愿。
- issue: εὐλογεῖτε 用于上帝时的含义
  choice: 称颂上帝
  alternative: 祝福上帝／赞美上帝
  rationale: “称颂”保留“祝颂”的词义范围和经文语体，同时在现代汉语中清楚表达向上帝献上赞美，而不是人向上帝赐福。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“必有平安”保留希腊文将来时的保证意味；“称颂上帝”兼顾源词对应和现代汉语清晰度。
