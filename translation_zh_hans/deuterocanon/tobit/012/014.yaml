  text: And now God has sent me to heal you and Sarah your bride[a].
translation:
  language: zh_hans
  text: 如今，上帝差我来医治你和你的儿媳撒拉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的新娘撒拉。”希腊语νύμφη可指“新娘、年轻的妻子”，也可指“儿媳”；这里说话的对象是多比特。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: 现在
  rationale: 承接拉斐尔前文的说明，并引出当前结论；现代汉语中省去生硬的“而”，行文更自然。
- source_word: ἀπέστειλέν με ὁ θεὸς
  choice: 上帝差我来
  rationale: 准确表达上帝差遣说话者前来的意思；“差……来”也自然体现此项差遣与眼前使命的关联。
- source_word: ἰάσασθαί σε
  choice: 医治你
  rationale: ἰάομαι表示医治、使痊愈；“医治”既适用于多比特的眼疾，也不把医治方式说得过细。
- source_word: τὴν νύμφην σου Σάρραν
  choice: 你的儿媳撒拉
  rationale: 说话对象是多比特，撒拉是他儿子多比亚的妻子，因此“儿媳”最自然地表达人物关系。νύμφη也可指新娘或年轻妻子，故在脚注保留该词的婚嫁含义。
theological_decisions:
- issue: νύμφη所表达的撒拉与多比特之间的关系
  choice: 你的儿媳撒拉
  alternative: 撒拉，就是那位新娘
  rationale: 希腊词νύμφη可表示“新娘、年轻的妻子”，也可表示“儿媳”。鉴于本句对多比特说话，正文采用符合亲属关系的“儿媳”；同时以脚注保留婚礼语境中的另一种词义，不消除原词的多义性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝差我来医治”简洁自然；人名依本书常用译法作“撒拉”。脚注标记[a]已置于正文相应位置。
