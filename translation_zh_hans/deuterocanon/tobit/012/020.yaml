  text: And now give thanks to God[a], because I am ascending to the one who sent me; and write all that has been accomplished in a book.
translation:
  language: zh_hans
  text: 现在，你们要感谢上帝[a]，因为我要升到差遣我来的那一位那里；你们要把已经成就的一切写在一本书中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“承认上帝”或“赞美上帝”；希腊语动词可指以感谢或赞美来承认上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: 感谢
  rationale: 在希腊化时期的犹太文献中，此动词以“上帝”为间接对象时，常指以感谢或赞美来公开承认上帝；本节语境并非认罪。“感谢”最自然，其他可能义保留在脚注中。
- source_word: ἀναβαίνω
  choice: 我要升到
  rationale: 现在时在此表示即将发生的行动；“升到”保留向上的空间意象及其属天含义，同时不擅自改译为“回去”。
- source_word: τὸν ἀποστείλαντά με
  choice: 差我来的那一位
  rationale: 用现代汉语关系结构自然表达分词短语，并依原文不在此处再次明说差遣者是上帝。
- source_word: γράψατε
  choice: 你们要……写
  rationale: 直接表达复数命令语气；“写”比“记载”更贴近基本词义。
- source_word: πάντα τὰ συντελεσθέντα
  choice: 已经成就的一切
  rationale: 保留完成时被动分词所表达的完成状态；“成就”也避免将其淡化为单纯“发生”的事件，但不明说行动者。
- source_word: εἰς βιβλίον
  choice: 写在书上
  rationale: 符合现代汉语表达，指把事情形成书面记录；βιβλίον 本身不要求具体译作“书卷”。
theological_decisions:
- issue: 拉斐尔升到差遣者那里所表达的含义
  choice: 直译为“升到差我来的那一位那里去”
  alternative: 译作“回到上帝那里去”
  rationale: 原文带有向上升去及受差遣的属天含义，但后半句没有再次明确称差遣者为上帝；译文保留这种指向，不扩充天使论，也不把“升”弱化为“回”。
- issue: ἐξομολογεῖσθε 是否指认罪
  choice: 正文译作“感谢上帝”
  alternative: “向上帝承认”或“赞美上帝”
  rationale: 与上帝连用且处于拉斐尔离别的语境中，较可能指以感谢和赞美承认上帝，而非承认罪；脚注保留原词的语义幅度。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“那一位”保留指称的郑重感；分成两句以清楚呈现两个并列命令，同时不改变原文逻辑。
