  yaml_path: translation/deuterocanon/tobit/012/013.yaml
  text: And when you did not hesitate to rise and leave your meal so that you might go and wrap the dead man[a], your doing good did not escape me[b], but I was with you.
translation:
  language: zh_hans
  text: 当你毫不迟疑地起身，撇下饭食[a]，为要去收殓那死者[b]时，你行善时，并没有逃过我的注意；我当时与你同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饭食”所译的希腊词可指一天中的正餐，古典用法中常指早饭或午间的一餐；这里没有明确说明用餐时刻。
    reason: cultural_note
  - marker: b
    text: “收殓”所译的希腊动词可指包裹尸体，或以其他方式整理尸体、为安葬作准备。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ὤκνησας
  choice: 毫不迟疑
  rationale: ὀκνέω可表示迟疑、畏缩或耽搁；此处是否定形式，用“毫不迟疑”自然地表现他及时行善。
- source_word: ἀναστῆναι
  choice: 起身
  rationale: 该不定式本义为“起来”，语境中指从饭席起身；“起身”准确且符合现代汉语表达。
- source_word: καταλιπεῖν τὸ ἄριστόν σου
  choice: 撇下饭食
  rationale: καταλείπω表示留下、撇下；ἄριστον指一顿饭，常可指早饭或午间正餐，但本节未明确时刻，因此不具体译作“早饭”或“午饭”。
- source_word: ὅπως ἀπελθὼν
  choice: 为要去
  rationale: ὅπως在此引出目的，ἀπελθών表示前去；合译为“为要去”，清楚保留目的关系。
- source_word: περιστείλῃς τὸν νεκρόν
  choice: 收殓那死人
  rationale: περιστέλλω用于尸体时可指包裹、整理或为安葬作准备。“收殓”在现代汉语中能简洁表达这一范围，又不把动作扩大为实际埋葬。
- source_word: οὐκ ἔλαθές με ἀγαθοποιῶν
  choice: 你行善并未被我忽略
  rationale: λανθάνω的否定结构表示行动没有不为说话者所知；ἀγαθοποιῶν保留“行善”的动态含义。“并未被我忽略”自然表达拉斐尔确实留意到此事，同时避免暗示全知。
- source_word: ἀλλὰ σὺν σοὶ ἤμην
  choice: 我反而与你同在
  rationale: 直译连接词ἀλλά及“我与你同在”的陈述，不把这种在场扩展为本节没有明说的守护或中保教义。
theological_decisions:
- issue: 拉斐尔所说的察知与同在具有何种性质
  choice: 仅陈述拉斐尔没有忽略多俾亚的善行，并且当时与他同在。
  alternative: 译文也可加以解释，暗示天使持续守护、中保或具有超越现场的认知能力。
  rationale: 希腊文只明确述说这件善行没有避开拉斐尔的注意，并且他与多俾亚同在；译文保留叙事中的直接陈述，不引入经文本身未说明的教义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“撇下饭食”保留他中断用餐、立即行善的具体画面；“收殓”较“包裹尸体”自然，也没有像“埋葬”那样超出该动词在本句所直接表达的动作。脚注标记依其实际说明对象分别置于“饭食”和“收殓那死人”之后。
