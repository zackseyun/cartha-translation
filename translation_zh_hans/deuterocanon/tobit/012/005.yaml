lexical_decisions:
- source_word: ἐκάλεσεν
  choice: 叫来
  rationale: 此处 καλέω 的不定过去时表示把对方叫来；“叫来”符合现代汉语叙事，也比“召见”少一层正式色彩。
- source_word: τὸν ἄγγελον
  choice: 那位天使
  rationale: ἄγγελος 可指使者或天使，但《多俾亚传》第12章明确将此人物呈现为天上的存在；汉语用“那位天使”也自然承接前文已知人物。
- source_word: εἶπεν αὐτῷ
  choice: 对他说
  rationale: 按希腊语关系直译，并采用现代汉语最自然的引语引入方式。
- source_word: Λάβε
  choice: 请收下
  rationale: λαμβάνω 的命令式在这里涉及给予报酬；“收下”比“拿走”更符合汉语礼貌邀领财物的语境，补入“请”传达自然语用而不改变命令内容。
- source_word: τὸ ἥμισυ πάντων
  choice: 一切……的一半
  rationale: τὸ ἥμισυ 表示“一半”，πάντων 是广义属格“一切的”；因后接关系从句而源文截断，以省略号标明“一切”仍有未完的限定。
- source_word: ὧν
  choice: ……
  rationale: ὧν 引出修饰 πάντων 的关系从句，但所给希腊文恰在此处中断。现代汉语无法自然地以孤立的关系代词悬置句子，因此用省略号保留未完状态，不补写缺失内容。
