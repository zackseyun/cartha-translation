base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/015.yaml
  text: I am Raphael[a], one of the seven holy angels who present the prayers of the holy ones and enter before the glory of the Holy One.
translation:
  language: zh_hans
  text: “我是拉斐尔，是那七位将圣民[a]的祷告呈上、并进入圣者的荣耀面前的圣天使之一。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译作“圣徒”或“圣洁之人”。希腊语原词直译为“圣洁者”。
    reason: 保留 τῶν ἁγίων 的词义范围，并避免把它限定为后期教会语境中的“圣徒”；同时避免与本节末尾单数、指上帝的“圣者”混淆。
lexical_decisions:
- source_word: Ῥαφαήλ
  choice: 拉斐尔
  rationale: 采用现代中文圣经传统中通行的音译，保留专名而不翻译其词源含义。
- source_word: εἷς ἐκ τῶν ἑπτὰ ἁγίων ἀγγέλων
  choice: 七位圣天使之一
  rationale: 简洁自然地保留部分关系、明确数目和“圣”的修饰。
- source_word: προσαναφέρουσιν
  choice: 呈上
  rationale: 表达把祷告带到上帝面前的动作，又不额外引入献祭含义。
- source_word: τὰς προσευχὰς τῶν ἁγίων
  choice: 圣民的祷告
  rationale: “祷告”直接对应 προσευχάς；“圣民”以现代中文表达属上帝的圣洁之人，同时用脚注保留“圣者”等可能译法。
- source_word: εἰσπορεύονται ἐνώπιον
  choice: 进到……面前
  rationale: 兼顾进入的动态含义与“在……面前”的临在关系，中文亦较自然。
- source_word: τῆς δόξης τοῦ ἁγίου
  choice: 圣者的荣耀
  rationale: 保留“荣耀”这一名词，并将带冠词的单数 ἁγίου 作为指向上帝的尊称“圣者”，不把它改写成较宽泛的“神圣临在”。
theological_decisions:
- issue: 句末 τοῦ ἁγίου 的所指
  choice: 译作指上帝的尊称“圣者”
  alternative: 将其理解为对“荣耀”的隐含修饰，或笼统译作上帝的临在
  rationale: 天上宫廷的语境表明，这里最自然地指上帝；译文仍保留“圣者的荣耀”这一原文结构，不进一步解释其性质。
- issue: τῶν ἁγίων 所指及译法
  choice: 圣民
  alternative: 圣者；圣徒
  rationale: 原词可泛指“圣洁的人”。“圣民”在现代中文中较易理解，也避免“圣徒”可能带来的后期教会封圣联想；脚注保留词义上的开放性。
- issue: 天使呈上祷告的动作
  choice: 按原文译为“将……祷告呈上”
  alternative: 献上祷告；转达祷告
  rationale: “呈上”保留天上宫廷图景，但不把动作明确解释为祭献，也不扩展为某种完整的中保教义。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“七位圣天使之一”和“进到……面前”贴近希腊语结构；“圣民”照顾普通读者的理解，歧义则由脚注保留。
