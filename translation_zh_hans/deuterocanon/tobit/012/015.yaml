  rationale: 修订仅调整中文句法和脚注措辞：把修饰“七位圣天使”的两个动作置入定语结构，忠实反映希腊语关系从句；保留“圣民”作为上下文中自然的主文译法，并以更不易混淆的脚注说明其替代译法。未改变原文的神学表述或歧义边界。
