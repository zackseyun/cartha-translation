  text: But those who sin are enemies of their own life[a].
translation:
  language: zh_hans
  text: 但犯罪的人，是自己生命的仇敌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己性命的仇敌。”
    reason: ζωή在此可按语境译为“生命”或“性命”；正文采用较宽泛且直接的“生命”。
lexical_decisions:
- source_word: οἱ ... ἁμαρτάνοντες
  choice: 犯罪的人
  rationale: 带冠词的现在时分词作名词用，指实施犯罪行为的人；“犯罪的人”保留动词意味，也比“罪人”更贴近原文表达。
- source_word: δὲ
  choice: 但
  rationale: δέ在上下文中表示轻微转折；“但”自然地显明与前文的对照。
- source_word: πολέμιοί
  choice: 仇敌
  rationale: 该词表示敌对者或仇敌；“仇敌”直接而庄重，并能与“自己生命的”自然搭配。
- source_word: τῆς ἑαυτῶν ζωῆς
  choice: 自己生命的
  rationale: ἑαυτῶν明确表示反身关系，ζωῆς通常指生命；此译保留原文单数形式，并表达犯罪者所敌对的是自己的生命。
theological_decisions:
- issue: 智慧伦理语境中ζωή的含义
  choice: 生命
  alternative: 灵魂
  rationale: 希腊文ζωή通常意为“生命”。这里侧重人自身的生命或福祉，并未明确提出关于灵魂的人论命题；译作“生命”可避免加入原文没有明说的教义范畴。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“是自己生命的仇敌”保留希腊文的判断句结构及反身意味；脚注仅注明汉语中可行的词义变体，不引入“灵魂”这一不够直接的解释。
