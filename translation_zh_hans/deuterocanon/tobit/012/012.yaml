base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/012.yaml
  text: And now[a], when you and your bride Sarah were praying, I brought the memorial of your prayer before the Holy One. And when you were burying the dead[c][b], I likewise was with you.
translation:
  language: zh_hans
  text: 如今，你和你的新婚妻子撒拉祷告时，我将你们祷告的记念[a]呈到至圣者[b]面前；你埋葬死者时，我也同样与你同在。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记念”也可译作“记念之物”；此词在宗教语境中可能带有类似把纪念祭呈到上帝面前的意味，但原文没有明确说是祭物。
    reason: lexical_alternative
  - marker: b
    text: “至圣者”在本句语境中指上帝。
    reason: referent_clarification
  - marker: c
    text: “与你同在”也可译作“在你身边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: 现在
  rationale: 保留时间副词及其承接上文的作用，表达简明自然。
- source_word: προσηύξω
  choice: 祷告时
  rationale: 不把不定过去时机械处理为持续体；结合ὅτε，以自然汉语指明祷告发生之际。
- source_word: νύμφη
  choice: 新婚妻子
  rationale: νύμφη可指新娘或年轻妻子；“新婚妻子”兼顾婚姻关系与新婚语境，又比单说“新娘”更适合叙事中的已婚状态。
- source_word: προσήγαγον
  choice: 呈到
  rationale: 表达带到某位面前、加以呈上的含义，同时避免擅自增添“献祭”。
- source_word: μνημόσυνον
  choice: 纪念
  rationale: 保留“纪念、记念物”的核心语义及可能的礼仪性回响，不直接把它解释成经文未明说的“纪念祭”。
- source_word: τῆς προσευχῆς ὑμῶν
  choice: 你们祷告的
  rationale: 保留希腊文复数领属代词“你们”和单数名词“祷告”。
- source_word: ἐνώπιον τοῦ ἁγίου
  choice: 那圣者面前
  rationale: 以称号“那圣者”对应带冠词的形容词实体化用法，既保留原文措辞，也不在正文中把称号直接改写成“上帝”。
- source_word: ἐθάπτες
  choice: 你埋葬……时
  rationale: 汉语时间从句可自然涵盖当时进行或反复发生的行动；不强加一次性完成的意味。
- source_word: τοὺς νεκρούς
  choice: 死者
  rationale: 现代汉语中庄重自然，准确指已经死去的人。
- source_word: ὡσαύτως
  choice: 也同样
  rationale: 明确表达与前述情形相对应，同时在汉语中保持顺畅。
- source_word: συμπαρήμην σοι
  choice: 与你同在
  rationale: 保留共同在场、陪伴在旁的意思，不额外加入“帮助”或“保护”等未明说的含义。
theological_decisions:
- issue: ἐνώπιον τοῦ ἁγίου中“圣者”的所指
  choice: 正文保留“那圣者”，脚注说明按语境指上帝
  alternative: 直接译作“上帝面前”，或理解为某位天上的圣者
  rationale: 原文以“圣者”这一称号表达；语境支持其指上帝，但正文保留称号可避免抹平原文措辞及其庄严色彩。
- issue: μνημόσυνον是否明确指礼仪性的纪念祭
  choice: 译作“纪念”，脚注交代可能具有礼仪意味
  alternative: 译作“纪念祭”或“蒙记念之物”
  rationale: 该词可有祭仪背景，但本句没有明说祭物；避免把可能的暗示升级为确定陈述。
- issue: 拉斐尔呈递祷告的角色
  choice: 按原文译为“我把……呈到……面前”
  alternative: 弱化为“我让上帝记念你们的祷告”，或强化为“我替你们献上祷告”
  rationale: 保留天使作为呈递者的叙述，同时不扩展为更具体的代求或祭司性教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“新婚妻子”自然呈现νύμφη兼具“新娘”和“年轻妻子”的含义，未另设脚注；脚注集中处理μνημόσυνον的多义性、“那圣者”的语境所指，以及共同在场这一表达的译法。
