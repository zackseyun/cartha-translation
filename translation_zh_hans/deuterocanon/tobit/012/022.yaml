  text: And they acknowledged his great and wondrous works[b][a], because an angel of the Lord had appeared to them.
translation:
  language: zh_hans
  text: 他们称颂他伟大而奇妙的作为[a]，因为一位主的天使向他们显现了[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称颂”所译的希腊语动词也可表示“公开承认、述说”或“感谢”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“一位主的天使”；也可理解为“主的天使”。
    reason: alternative_reading
  - marker: c
    text: “因为”所译的希腊语也可理解为“如何”；按此理解，句子可译作“他们称颂他伟大而奇妙的作为，述说一位主的天使如何向他们显现”。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐξωμολογοῦντο
  choice: 称颂
  rationale: 该动词可表示公开承认、宣告、感谢或赞美。这里以神伟大奇妙的作为为宾语，“称颂”既符合上下文，也保留感谢与公开赞美的意味。
- source_word: τὰ ἔργα τὰ μεγάλα καὶ θαυμαστὰ αὐτοῦ
  choice: 他伟大而奇妙的作为
  rationale: “作为”自然对应 ἔργα，用于神的行动庄重而通顺；“伟大而奇妙”直接反映 μεγάλα καὶ θαυμαστά。
- source_word: ὡς
  choice: 因为
  rationale: 此处可理解为说明称颂的缘由，即天使向他们显现；不过该词也可能引出所述内容，意为“如何”或“这件事：”，故以脚注保留歧义。
- source_word: ὤφθη
  choice: 显现了
  rationale: 该被动形式在显现叙事中惯常表达“出现、显现”，中文主动式“向他们显现”自然准确。
- source_word: ἄγγελος Κυρίου
  choice: 主的一位天使
  rationale: ἄγγελος 前没有冠词；译作“一位天使”避免擅自将其确定为某一特定的“主的使者”，同时保留其属主的含义。
theological_decisions:
- issue: ἄγγελος Κυρίου 应作确定还是不确定表达
  choice: 主的一位天使
  alternative: 主的天使
  rationale: 希腊文 ἄγγελος 没有冠词，因此正文采用不确定表达，避免加入原文并未要求的特定身份；但无冠词结构并不绝对排除确定理解，故在脚注说明。
- issue: ἐξωμολογοῦντο 在此是承认、感谢还是赞美
  choice: 称颂
  alternative: 公开述说／颂谢
  rationale: 以神的作为为宾语时，“称颂”最自然，也能涵盖公开宣认与赞美；脚注保留该词较宽的语义范围，不将其限定为单一礼仪或教义用语。
- issue: ὡς 表示原因还是所述内容
  choice: 因为
  alternative: 述说……如何／这件事：
  rationale: 因果理解符合事件顺序和现代汉语表达，但希腊语本身容许内容性理解，因此不应默默消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“称颂”“作为”“显现”适合经文语域，但不显古奥；语序保持自然汉语，同时以脚注保存原文在动词语义、ὡς 的句法功能及天使称谓确定性上的歧义。
