  text: And the elder said, “It is justified for him.”
translation:
  language: zh_hans
  text: 年长者说：“这对他是合宜的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρεσβύτης
  choice: 老人
  rationale: 保留定冠词所指的年长者身份；此处叙事中所指明确，无须补入原文未明说的姓名或亲属称谓。
- source_word: Δικαιοῦται αὐτῷ
  choice: 给他是理所应当的
  rationale: δικαιοῦται 为现在时被动形式，在这里表达某事被认为正当、合理；αὐτῷ 为与格“对他／给他”。结合上下文涉及给予报酬，以无人称式译法保留原句未明说主语的特点，也避免误译成“他被称义”。
theological_decisions:
- issue: δικαιοῦται 是否采用神学术语“称义”
  choice: 译为“是理所应当的”
  alternative: “他被称义”或“这对他是正当的”
  rationale: 本节语境是对某人应得之物的判断，并非讨论人在上帝面前称义；采用日常的正当性表达可避免把后期神学术语强加于文本，同时保留其判断为“合理／正当”的语义。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。引语保持原文的短促和省略，不擅自补出具体应给予的对象。
