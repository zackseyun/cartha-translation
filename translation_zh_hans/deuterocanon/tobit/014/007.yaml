  text: καὶ εὐλογήσουσιν πάντα τὰ ἔθνη Κύριον. καὶ ὁ λαὸς αὐτοῦ ἐξομολογήσεται τῷ θεῷ, καὶ ὑψώσει Κύριος τὸν λαὸν αὐτοῦ· καὶ χαρήσονται πάντες οἱ ἀγαπῶντες Κύριον τὸν θεὸν ἐν ἀληθείᾳ καὶ δικαιοσύνῃ, ποιοῦντες ἔλεος τοῖς ἀδελφοῖς ἡμῶν.
