base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/007.yaml
  text: And all the nations will bless the Lord[a]. And his people will give thanks to God, and the Lord will exalt his people; and all who love the Lord God in truth and righteousness will rejoice[c][b], showing mercy to our brothers.
translation:
  language: zh_hans
  text: 列国都要称颂主[a]。他的子民要感谢上帝[b]，主必高举他的子民；凡在真理和公义[c]中爱主上帝的人，都要欢喜，并向我们的弟兄施行怜悯[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称颂”也可译作“祝福”或“赞美”；这里是列国向主发出的尊崇之言。
    reason: lexical_alternative
  - marker: b
    text: “感谢”也可译作“赞美”或“称谢”；该希腊词在不同语境中也可表示“承认”或“认罪”，此处敬拜语境较适合“感谢”。
    reason: lexical_alternative
  - marker: c
    text: “公义”也可译作“正义”；这里可能侧重爱上帝时所表现的正直与合宜行为。
    reason: lexical_alternative
  - marker: d
    text: 原文作“我们的弟兄”；在此类共同体用语中，也可能泛指同族或群体中的成员。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσουσιν
  choice: 要称颂
  rationale: εὐλογέω以主为宾语时，表示称颂、赞美；“称颂”既保留“说美言”的基本意象，也符合现代中文的敬拜语境。
- source_word: πάντα τὰ ἔθνη
  choice: 列国都
  rationale: 保留ἔθνη的“各国、列国”含义和πάντα的普遍范围，不预先限定为“外邦人”。
- source_word: ἐξομολογήσεται
  choice: 要感谢
  rationale: 该动词在七十士译本的敬拜语境中可指感谢或赞美；此处以τῷ θεῷ为间接宾语，“感谢上帝”自然且不引入认罪意味。
- source_word: ὑψώσει
  choice: 必高举
  rationale: ὑψόω兼有抬高和使尊荣之意；“高举”保留其空间隐喻与尊荣含义。
- source_word: ἐν ἀληθείᾳ καὶ δικαιοσύνῃ
  choice: 在真理和公义中
  rationale: 直译介词结构，保留它可能描述爱上帝的方式、品格或生活领域的开放性；δικαιοσύνη译为“公义”，适合此处敬虔与行为并重的语境。
- source_word: ποιοῦντες ἔλεος
  choice: 施怜悯
  rationale: 这是带闪语色彩的表达，意为以怜悯待人；“施怜悯”庄重自然，并保留实际行动的意味。
- source_word: τοῖς ἀδελφοῖς ἡμῶν
  choice: 向我们的弟兄
  rationale: 保留希腊文第一人称复数“我们的”和阳性复数亲属称谓“弟兄”，不擅自消除原文从“他的子民”转为“我们的弟兄”的人称变化。
theological_decisions:
- issue: Κύριος的译法
  choice: 主
  alternative: 上主
  rationale: “主”直接对应Κύριος，符合现代中文圣经语体；原文形态本身不足以在正文中进一步确定是否应以特殊字形标示神名。
- issue: δικαιοσύνη的语义
  choice: 公义
  alternative: 正义
  rationale: 上下文着重真实地爱上帝并怜悯弟兄，兼具敬虔与正直生活的含义；“公义”比偏向社会或司法公平的“正义”涵盖面更合适。
- issue: ἀδελφοῖς的性别与范围
  choice: 弟兄
  alternative: 弟兄姊妹／同胞
  rationale: 正文保留原文阳性复数形式；脚注说明它在共同体语境中可能具有代表性，以免将其范围不必要地缩窄或扩大。
- issue: ποιοῦντες与主句的关系
  choice: 并向我们的弟兄施怜悯
  alternative: 他们向我们的弟兄施怜悯
  rationale: 分词在语法上描述那些爱主上帝并欢喜的人；用“并”保留其伴随或关联关系，而不把它明确改写为原因、条件或结果。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“列国都要”“必高举”保持预言性未来语气；以两个句号和一个逗号组织较长的希腊语并列结构。正文保留“他的子民”与“我们的弟兄”之间原有的人称转换，也不把“在真理和公义中”过度解释为单一的工具、方式或生活领域。
