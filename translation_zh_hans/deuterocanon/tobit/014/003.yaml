base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/003.yaml
  text: He had grown very old[a]; and he called his son and his grandsons, and said to him, “Child, take your sons. Look, I have grown old[b], and I am about to depart from life.”
translation:
  language: zh_hans
  text: 他已经十分年迈，就叫来儿子和孙子们[a]，对儿子说：“孩子，带上你的儿子们。你看，我已经老了，也快要离开人世了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他的儿子和他的儿子们”；后一个说法在这里指他儿子的儿子们，也就是他的孙子们。
    reason: lexical_alternative
  - marker: b
    text: 希腊文较直译为“我正要从活着中离去”，是表示死亡临近的委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλως δὲ ἐγήρασεν
  choice: 他已经十分年迈
  rationale: μεγάλως加强ἐγήρασεν所表达的衰老程度；“十分年迈”自然、庄重，并传达年事甚高的状态。δὲ在此只作轻微承接，不另加原文没有的明确时间词。
- source_word: τὸν υἱὸν αὐτοῦ καὶ τοὺς υἱοὺς αὐτοῦ
  choice: 儿子和孙子们[a]
  rationale: 后一个“他的儿子们”在上下文中最自然地指前述儿子的儿子，即主人公的孙子们；正文明确亲属关系，脚注保留希腊文的字面形式。
- source_word: Τέκνον
  choice: 孩子
  rationale: τέκνον是父亲对儿女亲切而庄重的称呼；“孩子”既保留字面意义，也不过度改成专指男性的“儿子”。
- source_word: λάβε τοὺς υἱούς σου
  choice: 带上你的儿子们
  rationale: λάβε基本义为“带、领、接纳”；此处“带上”在现代汉语中自然，同时不额外断定行动的具体目的。
- source_word: ἰδοὺ
  choice: 你看
  rationale: 用现代而不失郑重的提示语引起听者注意，避免“看哪”可能带来的过强古雅色彩。
- source_word: γεγήρακα
  choice: 我已经老了
  rationale: 用“已经”表达完成时所突出的现今结果状态。
- source_word: πρὸς τὸ ἀποτρέχειν ἐκ τοῦ ζῇν εἰμί
  choice: 我也快要离开人世了[b]
  rationale: 该表达字面较特殊，意为即将从活着的状态离去；“快要离开人世”保留委婉说死亡的语气，也符合现代汉语。
theological_decisions:
- issue: 如何表达临近死亡的委婉说法
  choice: 快要离开人世了
  alternative: 快要死了
  rationale: 希腊文没有直接使用“死”这个动词，而以“从活着中离去”委婉表达死亡临近；译文保留这种语气，不对死亡作额外的神学解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“十分年迈”“离开人世”保持叙事的肃穆感；亲属称谓在正文中清楚表达，同时以脚注呈现原文措辞。
