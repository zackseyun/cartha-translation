base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/005.yaml
  text: And God will again have mercy on them and bring them back to the land[a], and they will build the house, though not like the former one, until the times of the age are fulfilled. And after these things they will return from the captivities and build Jerusalem honorably, and the house of God in her will be built gloriously[c][b], just as the prophets spoke concerning her.
translation:
  language: zh_hans
  text: 上帝必再次怜悯他们，使他们返回那地；他们要建造那殿，却不像先前的殿，直到那时代的各个时期满了。[a] 此后，他们要从各处被掳之地归回，[b]庄严地重建耶路撒冷；上帝的殿要在其中荣美地建成，正如众先知论到耶路撒冷所说的。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那时代的各个时期”也可译作“那世代的时期”。原文的表达带有时代性／末世性的意味，但没有明确说明这些时期具体指什么。
    reason: lexical_alternative
  - marker: b
    text: “各处被掳之地”：希腊文“被掳”用复数，可能指多处流亡之地或多次被掳。
    reason: lexical_alternative
  - marker: c
    text: 希腊文用阴性代词指耶路撒冷，直译为“在她里面”和“论到她”。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστρέψει αὐτοὺς εἰς τὴν γῆν
  choice: 使他们返回那地
  rationale: 保留使役含义和定冠词所指的“那地”，不擅自增添“他们的”。
- source_word: οἰκοδομήσουσιν τὸν οἶκον
  choice: 他们要建造那殿
  rationale: οἶκος直译为“房屋”，但在本节明确指上帝的殿；中文以“殿”既保留圣殿语境，也避免“房屋”的误解。
- source_word: ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος
  choice: 直到这世代的时期满了
  rationale: 保留καιροί的时间阶段含义及αἰών的开放性，不将其限定为某一种末世时间表。
- source_word: ἐκ τῶν αἰχμαλωσιῶν
  choice: 从各处被掳之地
  rationale: 用“各处”呈现希腊文复数，表达多处流亡或被掳状态，同时符合现代汉语。
- source_word: ἐντίμως
  choice: 庄严地
  rationale: 表达有尊荣、有体面的建造方式；在城市重建语境中比“可敬地”自然。
- source_word: ἐνδόξως
  choice: 荣美地
  rationale: 兼顾δόξα所含的荣耀与壮美，不将其仅化约为建筑上的华丽。
- source_word: ἐν αὐτῇ / περὶ αὐτῆς
  choice: 在其中 / 论到耶路撒冷
  rationale: 现代汉语不用语法阴性代词指城市；以“其中”及重述专名保持指代清楚，并用脚注说明希腊文的拟人表达。
theological_decisions:
- issue: καιροὶ τοῦ αἰῶνος的时间含义
  choice: 这世代的时期
  alternative: 指定的时期；永世的时期
  rationale: 原文具有时代性和末世性的暗示，却没有明确界定；正文保留这种张力，脚注提示也可理解为“时代的各时期”。
- issue: οἶκος的所指
  choice: 殿
  alternative: 房屋；圣殿
  rationale: 上下文明确是上帝的殿。“殿”在中文中自然且保留原文未使用专门词ναός/ἱερόν这一点，避免过度具体化。
- issue: 耶路撒冷的阴性拟人
  choice: 正文采用自然汉语指代，脚注说明拟人
  alternative: 在她里面／论到她
  rationale: 希腊文阴性形式既受语法性影响，也能形成城市拟人；直译“她”在现代中文会显得突兀，因此不抹去该特征，而移入脚注交代。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“庄严地建造”和“荣美地建成”分别呈现ἐντίμως与ἐνδόξως的区别；标点和分句顺应中文阅读习惯。
