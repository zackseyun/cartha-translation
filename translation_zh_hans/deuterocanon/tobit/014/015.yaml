  yaml_path: translation/deuterocanon/tobit/014/015.yaml
  text: And before he died[a], he heard of the destruction of Nineveh, which Nebuchadnezzar and Ahasuerus had taken captive; before dying, he rejoiced over Nineveh. Amen.
translation:
  language: zh_hans
  text: 他去世以前，听说尼尼微的毁灭——这城曾被尼布甲尼撒和亚哈随鲁掳掠[a]。他去世以前，为尼尼微而欢喜。阿们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本直陈尼尼微是“曾被尼布甲尼撒和亚哈随鲁掳掠的”。这里依照原文保留这两个名字；这些君王与尼尼微陷落之间的历史关系，历来有不同解释。
    reason: 说明原文措辞及其历史辨认上的争议，避免在正文中静默调和。
lexical_decisions:
- source_word: ἤκουσεν
  choice: 听说
  rationale: 既保留“听见、听闻”的基本含义，又自然引出所获知的事件。
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: 他去世以前
  rationale: 准确表达时间先后，符合现代汉语庄重而自然的叙述方式。
- source_word: ἀπωλίαν
  choice: 毁灭
  rationale: 在尼尼微倾覆的历史语境中，明确表达彻底败亡或毁坏。
- source_word: ᾐχμαλώτισεν
  choice: 所掳掠的
  rationale: 保留动词与俘虏、掳获相关的核心含义；以城代指城中居民或全城遭遇，在汉语中可自然理解。
- source_word: Ναβουχοδονοσὸρ
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἀσύηρος
  choice: 亚哈随鲁
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ἐχάρη
  choice: 欢喜
  rationale: 准确表达因某事而喜悦，语体庄重且易懂。
- source_word: ἐπὶ Νινευή
  choice: 因尼尼微而
  rationale: ἐπί在此可表示喜悦所关乎的对象或缘由；此译法保留其含混性，不擅自补成“因尼尼微的毁灭”。
- source_word: ἀμήν
  choice: 阿们
  rationale: 原文明确保留结束语ἀμήν，中文采用通行音译。
theological_decisions:
- issue: 希腊文本所列攻取尼尼微者的历史身份
  choice: 正文照录“尼布甲尼撒和亚哈随鲁”，不按外部历史重构加以更正或调和。
  alternative: 将名字视为历史混淆，或改用其他与尼尼微陷落相关的君王名称。
  rationale: 译文应忠实呈现现存希腊见证；历史上的张力应留给注释和解释处理。
- issue: ἐπὶ Νινευή所指的喜乐缘由
  choice: 译作“因尼尼微而欢喜”，保留对象或缘由上的简略与含混。
  alternative: 明确译作“因尼尼微的毁灭而欢喜”。
  rationale: 上下文虽强烈暗示其欢喜与尼尼微倾覆有关，但原文没有在此重复“毁灭”，不宜在正文中把暗示扩写为明说。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的简体中文。“那城”补明关系从句所指，使长句自然，但不增加新的历史判断；末句保留原文对“去世以前”的重复和“因尼尼微而欢喜”的含混表达。
