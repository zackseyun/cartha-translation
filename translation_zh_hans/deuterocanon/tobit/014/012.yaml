  yaml_path: translation/deuterocanon/tobit/014/012.yaml
  text: And when Hanna died[a], he buried her with his father. Then Tobias went away with his wife and his sons to Ecbatana, to Raguel his father-in-law.
translation:
  language: zh_hans
  text: 哈拿死后，他把她和自己的父亲葬在一起。[a] 随后，多比亚带着妻子和儿子们前往厄克巴坦，到他的岳父拉古耳那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“他把她和自己的父亲葬在一起”这一分句中没有明说主语；下一分句则明确写出“多比亚”。
    reason: 保留原文主语指代上的含混，避免在正文中作未经明说的身份判定。
lexical_decisions:
- source_word: ἀπέθανεν
  choice: 死后
  rationale: 直译其死亡含义，并以现代汉语自然的时间从句衔接后文，不使用委婉语。
- source_word: ἔθαψεν
  choice: 葬
  rationale: 直接表达θάπτω的埋葬之义，简洁而符合叙事语体。
- source_word: μετὰ τοῦ πατρὸς αὐτοῦ
  choice: 和自己的父亲葬在一起
  rationale: 保留μετά加属格的“与……一起”含义；不具体断定是葬在旁边、同一墓穴还是同一墓地。
- source_word: ἀπῆλθεν
  choice: 前往
  rationale: 结合后接目的地和人物的结构，自然表达离开原处、去往厄克巴坦的动作。
- source_word: γυναικὸς αὐτοῦ
  choice: 妻子
  rationale: 在家庭关系语境中，γυνή明确指妻子。
- source_word: τῶν υἱῶν αὐτοῦ
  choice: 儿子们
  rationale: 忠实保留υἱοί明确的阳性复数，不泛化为“孩子们”。
- source_word: Ἐκβάτανα
  choice: 厄克巴坦
  rationale: 采用清楚简练的现代汉语音译来表示该古代城市。
- source_word: πρὸς Ῥαγουὴλ τὸν πενθερὸν αὐτοῦ
  choice: 投奔他的岳父拉古耳
  rationale: πρός加人物表示前往那人处；“投奔”自然表达去到亲属那里，但不增添永久迁居等未明说的信息。πενθερός译为“岳父”。
theological_decisions:
- issue: 安葬句中未明说的主语
  choice: 正文保留“他”，不补出姓名；下一句按希腊文明确写出“多比亚”
  alternative: 把首句主语直接明确为多比亚，或依据上下文明确为另一人物
  rationale: ἔθαψεν的主语仅由动词形态暗含，并未写出姓名；下一分句才明确出现Τωβίας。保留代词可避免替原文消除指代上的含混。
- issue: 与父亲合葬的空间关系
  choice: 葬在一起
  alternative: 葬在父亲旁边
  rationale: μετά加属格只明确“与父亲一起”，未具体说明紧邻、同穴或仅在同一墓地，因此不采用更具体的空间表述。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“哈拿”“多比亚”“厄克巴坦”“拉古耳”按希腊文专名音译；叙事简洁，不加入原文没有的礼仪、墓制或迁居细节。
