base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/010.yaml
  text: And bury me properly[a], and your mother with me, and do not stay any longer in Nineveh. Child, see what Nadab did to Ahikar, who had reared him—how he brought him from the light into the darkness, and all that he repaid him. But Ahikar was saved, while that man received the repayment, and he himself went down into the darkness. Manasseh did acts of mercy, and he was saved from the deadly snare that Nadab had set for him[b]; but Nadab fell into the trap and perished.
translation:
  language: zh_hans
  text: 要好好安葬我，也要把你母亲与我合葬；你们不要再留在尼尼微。孩子，你看拿答[a]怎样对待养育他的亚希加：他怎样使亚希加从光明进入黑暗，以及他怎样回报他的一切。然而，亚希加得救了，那人却受到了报应，自己下到黑暗中。玛拿西行施舍[b]，并从拿答为他设下的致命圈套中得救；拿答却落入那圈套，灭亡了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本此处作“亚当”（Ἀδὰμ），是《亚希加故事》中那位背信者的名字，并非始祖亚当；这里按该人物在故事传统中的名字译作“拿答”。
    reason: alternative_reading
  - marker: b
    text: “行施舍”也可按较宽的意义译作“行怜悯的善事”；这个希腊词在《多俾亚传》中常特指向有需要的人施舍财物。
    reason: lexical_alternative
lexical_decisions:
- source_word: θάψον με καλῶς
  choice: 要好好安葬我
  rationale: θάψον是明确的安葬命令；καλῶς表示妥善、合宜地办理，译作“好好”自然庄重，又不额外加入“隆重”等原文没有的含义。
- source_word: μηκέτι αὐλισθῆτε εἰς Νινευή
  choice: 你们不要再留在尼尼微
  rationale: αὐλίζομαι本指住宿、过夜，在此语境中延伸为继续居留；“不要再留在”符合现代汉语，也保留复数命令的对象。
- source_word: τέκνον
  choice: 孩子
  rationale: 保留亲昵的家人称呼，不因上下文而把该词本身明确化为“儿子”，也不添加原文未明说的“我的”。
- source_word: Ἀδὰμ
  choice: 拿答
  rationale: 此处是《亚希加故事》中背信的朝臣，并非始祖亚当。采用该人物通常所对应的“拿答”，避免误认；希腊文本的字面音译另见脚注。
- source_word: Ἀχιαχάρῳ
  choice: 亚希加
  rationale: 采用该古代智慧故事人物在现代中文中清晰可读的音译，并与其传统身份相符。
- source_word: τῷ θρέψαντι αὐτόν
  choice: 养育他的
  rationale: τρέφω在这里涉及抚养成人，不只是供给食物；“养育”简洁地表达监护和抚育关系。
- source_word: ἐκ τοῦ φωτὸς ... εἰς τὸ σκότος
  choice: 从光明落入黑暗
  rationale: 保留光明与黑暗的鲜明比喻；补用“落入”使中文自然，并传达境遇急转直下。
- source_word: ἀνταπέδωκεν / ἀνταπόδομα ἀπεδόθη
  choice: 回报 / 受到了报应
  rationale: 原文反复使用同一词根，兼有回报与报偿之意。中文用相近词义形成因果呼应，同时“报应”贴合恶行反归自身的语境。
- source_word: ἔσωσεν / ἐσώθη
  choice: 得救
  rationale: 保留σῴζω的直接对应及经文关键词的一致性；在本叙事中具体指从阴谋和死亡危险中获救，但不在正文中把词义窄化。
- source_word: ἐλεημοσύνην
  choice: 施行怜悯
  rationale: 该词在《多俾亚传》中常具体涉及施舍，也可较广地指慈悲善行。“施行怜悯”保留较宽语义，具体的“施舍”可能性列入脚注。
- source_word: παγίδος θανάτου
  choice: 致命圈套
  rationale: 字面为“死亡的圈套”；译作“致命圈套”在现代汉语中顺畅，并明确这是足以致死的谋害。
theological_decisions:
- issue: 亚希加和玛拿西“得救”的含义
  choice: 正文保留“得救”
  alternative: 译作“获救”或“被救出”以明确仅指今世脱险
  rationale: 上下文直接讲的是从谋害和死亡圈套中蒙拯救；但σῴζω也是具有更广神学用法的词。保留“得救”既忠于词汇，也不在翻译中消除其可能产生的神学回响。
- issue: ἐλεημοσύνην的范围
  choice: 施行怜悯
  alternative: 施舍
  rationale: 《多俾亚传》中该词常指向穷人施舍，但词义也容纳慈悲行动。正文采用较宽而自然的表达，脚注保存较具体的词义选择，避免把行善的形式无根据地限定为钱财施舍。
- issue: 恶行与报偿的关系
  choice: 以“回报／报应”保留叙事中的报偿语言
  alternative: 解释为上帝直接审判或单纯的自然后果
  rationale: 本节陈述背信者受到相应报偿，却没有在这些分句中明确说明施行报偿的主体或机制，因此不额外指定为神直接执行，也不将其降格为纯自然因果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。保留“光明／黑暗”“圈套”“得救”等原文意象和关键词；人物名采用简明中文音译。正文所有脚注标记均已对应列出。
