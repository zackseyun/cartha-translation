lexical_decisions:
- source_word: ἐπαύσατο
  choice: 结束了
  rationale: 这是παύω的不定过去时中间语态，在此表示某项言语行动告一段落。“结束了”既体现完成意味，也比“停止了”更自然地衔接前文的颂赞。
- source_word: ἐξομολογούμενος
  choice: 称谢
  rationale: ἐξομολογέομαι可指承认、认罪，也可在敬拜语境中指称颂或感谢。前文是托比特的祝颂，因此正文采用兼具赞美和感谢色彩的“称谢”，同时以脚注保留另一词义。
- source_word: Τωβείτ
  choice: 托比特
  rationale: 按现代普通话音译此人名，并采用便于读者辨认、也能与书名对应的形式。
theological_decisions:
- issue: ἐξομολογούμενος在敬拜语境中的含义
  choice: 称谢，即赞美、感谢
  alternative: 承认或认罪
  rationale: 本句结束托比特此前的祝颂，语境更支持赞美或感谢；但该希腊词确有承认、认罪之义，故不在脚注中抹去这一真实的词义张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“结束了称谢”适合作为前一段祝颂的收束语；避免使用较生硬的“停止称颂”。
