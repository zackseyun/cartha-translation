  text: And all the nations will truly turn to fear the Lord God[a]; they will bury their idols.
translation:
  language: zh_hans
  text: 所有列国都必真诚地转而敬畏主上帝[a]；他们必埋葬自己的偶像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所有列国都必真诚地回转，敬畏主上帝。”希腊语动词既可表示“转向”，也可表示“回转”；此处描写列国真诚地转而敬畏主上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔθνη
  choice: 列国都
  rationale: 表达世上所有民族的普遍范围；“列国”保留经文语体，又为现代读者所熟悉。
- source_word: ἐπιστρέψουσιν
  choice: 必转向
  rationale: 保留“转向／回转”的动作隐喻，不采用带有后期技术色彩的“皈依”。与后接不定式连用时，译成“转向……，敬畏他”自然清楚。
- source_word: ἀληθινῶς
  choice: 真诚地
  rationale: 此处强调列国转向并敬畏上帝是真实、诚挚的；“真诚地”比单独的“真正”更自然地修饰人的归向。
- source_word: φοβεῖσθαι
  choice: 敬畏
  rationale: 既保留“畏惧”的语义分量，也符合现代汉语中关于人面对上帝时敬重、顺服的经文用语，不把它泛化为“敬拜”。
- source_word: Κύριον τὸν θεόν
  choice: 主上帝
  rationale: 希腊文没有物主代词，故不增译“他们的”；“主上帝”直接对应这一称谓。
- source_word: κατορύξουσιν
  choice: 必埋葬
  rationale: 保留动词“挖下去、埋入地下”的具体形象，生动表达对偶像的弃绝。
- source_word: τὰ εἴδωλα αὐτῶν
  choice: 自己的偶像
  rationale: “偶像”准确体现宗教语境；反身性的“自己的”自然表达 αὐτῶν 回指列国。
theological_decisions:
- issue: φοβεῖσθαι 应译作单纯的“害怕”，还是“敬畏”
  choice: 敬畏
  alternative: 惧怕
  rationale: “敬畏”仍含“畏”的成分，并保留圣经中人在上帝面前敬重、降服的神学张力；“惧怕”在现代汉语里容易被理解为仅仅恐慌。
- issue: ἐπιστρέψουσιν 是否采用正式的归信术语
  choice: 必真诚地转向主上帝，敬畏他
  alternative: 必真正皈依，敬畏主上帝
  rationale: 原文使用“转向／回转”的常见隐喻，并非后期技术术语；保留该隐喻更贴近希腊文，也避免加入特定宗派色彩。
- issue: ἐπιστρέψουσιν 的方向是“转向”还是“回转”
  choice: 正文采用“转向”，脚注保留“回转”
  alternative: 必真诚地回转，敬畏主上帝
  rationale: 该动词本身可指转向或返回；上下文没有充分理由断定列国先前已敬畏主上帝，因此正文用较中性的“转向”，并以脚注保存真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”“敬畏”“偶像”保留合宜的经文语感；句法简洁，并用“他”明确敬畏的对象。脚注标记[a]已置于相关分句之后。
