  yaml_path: translation/deuterocanon/tobit/014/009.yaml
  text: But you, keep the law and the commandments, and become merciful and righteous, so that it may go well with you.
translation:
  language: zh_hans
  text: 但你要遵守律法和诫命，并要成为一个富有怜悯、行事正直的人，好使你得福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τήρησον
  choice: 遵守
  rationale: 准确表达持续谨守、遵行的命令语气，符合现代汉语经文表达。
- source_word: τὸν νόμον καὶ τὰ προστάγματα
  choice: 律法和诫命
  rationale: 保留两个并列概念；προστάγματα指权威颁布的命令或规定，译作“诫命”自然且庄重。
- source_word: γενοῦ
  choice: 要成为
  rationale: 保留希腊文所表达的‘成为、变成’，不弱化为静态的‘要有’或‘要作’。
- source_word: φιλελεήμων
  choice: 怜悯人
  rationale: 该词表达乐于施怜悯、富有慈悲；以“怜悯人”自然呈现其对人的主动取向。
- source_word: δίκαιος
  choice: 行事正直的人
  rationale: δίκαιος可指公义、正直或合乎正道；此处用伦理性的“行事正直”避免过度导入后期教义术语。
- source_word: ἵνα σοι καλῶς ἦν
  choice: 好使你凡事顺利
  rationale: 自然表达目的或结果关系以及‘对你而言情况良好’之意；“凡事”是汉语习惯性的概括，并非逐项绝对承诺。
theological_decisions:
- issue: 遵守诫命与顺利之间的关系
  choice: 保留原文的目的／结果结构：“好使你凡事顺利”
  alternative: 译成必然的因果保证，如“这样你就一定蒙福”
  rationale: ἵνα结构将正直怜悯的生活与福祉联系起来，但原文没有使用“蒙福”或明确宣告无条件、机械性的保证，因此不作教义性强化。
- issue: δίκαιος的神学色彩
  choice: 译为“行事正直的人”
  alternative: 译为“义人”或“称义的人”
  rationale: 上下文是伦理劝勉；采用行为层面的表达，既保留公义含义，也避免把后期关于称义的特定神学框架带入文本。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“但你”承接上下文的转折与直接称呼；全句保留命令、品格转变及目的／结果三个层次。
