- source_word: ἐν Ἐκβατάνοις
  choice: 在厄克巴特纳
  rationale: 介词ἐν表示所在地点；“厄克巴特纳”按希腊语地名音译。
- source_word: τῆς Μηδείας
  choice: 米底亚的
  rationale: 属格限定厄克巴特纳，表明该城位于或属于米底亚；译作“米底亚的”既保留原文结构，也能辨明地点。
