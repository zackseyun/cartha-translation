  text: And he grew old honorably[a], and he buried his parents-in-law with honor, and he inherited their property and that of Tobit his father.
translation:
  language: zh_hans
  text: 他在尊荣中渐渐老去，又隆重地[a]安葬了岳父岳母，并继承了他们的财产和他父亲多比特的财产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隆重地”或可译作“荣耀地”或“显赫地”；在安葬的语境中，这里理解为以尊荣相待、隆重安葬，而不一定侧重排场。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγήρασεν
  choice: 渐渐老去
  rationale: 该动词表示进入老年、年岁渐长；译作“渐渐老去”保留动态含义，也符合现代汉语表达。
- source_word: ἐντίμως
  choice: 在尊荣中
  rationale: 该副词表示受敬重、体面而有尊荣；“在尊荣中”既自然，也保留其社会评价色彩。
- source_word: ἔθαψεν
  choice: 安葬
  rationale: 原词直指埋葬；中文丧葬语境中“安葬”庄重自然，并未改变其基本含义。
- source_word: τοὺς πενθεροὺς αὐτοῦ
  choice: 岳父岳母
  rationale: 复数在此指妻子的父母；因主语为男性，“岳父岳母”比含义较宽的“姻亲”更明确自然。
- source_word: ἐνδόξως
  choice: 隆重地
  rationale: 该副词可表示荣耀、显赫或盛大；在安葬语境中，“隆重地”自然表达以尊荣相待的葬礼，同时与前句的ἐντίμως有所区分。
- source_word: ἐκληρονόμησεν
  choice: 继承
  rationale: 准确表达依法或按亲属关系取得遗产的含义，简洁明了。
- source_word: τὴν οὐσίαν αὐτῶν
  choice: 他们的产业
  rationale: οὐσία在此指财产、家产；“产业”庄重而不显得过度法律化。
- source_word: καὶ Τωβεὶτ τοῦ πατρὸς αὐτοῦ
  choice: 和他父亲多比特的产业
  rationale: 希腊文省略了第二个“产业”，中文补出后关系清楚，并保留多比特是其父亲这一同位说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“在尊荣中渐渐老去”与“隆重地安葬”分别反映ἐντίμως和ἐνδόξως，避免把两个副词完全合并；末句重复“产业”，使两个继承来源在中文中清楚明确。
