revisions:
- from: 如今，孩子们，你们要看看施舍能成就什么，也要看看正义[a]怎样救人。他说这些话的时候，生命就在床上终结了[b]。他享年一百五十八岁，死后得到隆重安葬[c]。
  to: 如今，孩子们，你们要看看施舍有什么功效，也要看看正直[a]如何带来拯救。他还在说这些话时，就在床上断了气[b]。他享年一百五十八岁；他的儿子庄重地安葬了他[c]。
  rationale: 修订消除了死亡句的中文歧义和不必要强调，将δικαιοσύνη译作较符合此处道德语境的“正直”，同时在脚注保留“正义／公义”的词义范围。末句依据段落上下文将希腊文隐含的单数主语表达为“他的儿子”，并以脚注说明原句本身未明说其姓名；这比被动式更忠实于动词的数，也避免“他安葬了他”的中文指代混乱。
