  yaml_path: translation/deuterocanon/tobit/014/011.yaml
  text: And now, children, see what almsgiving does, and how righteousness delivers. And while he was saying these things, his life came to an end on the bed. He was a hundred fifty-eight years old, and he buried him honorably.
translation:
  language: zh_hans
  text: 如今，孩子们，你们要看看施舍有什么功效，也要看看正直[a]如何带来拯救。他还在说这些话时，就在床上断了气[b]。他享年一百五十八岁；他的儿子庄重地安葬了他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正直”也可译作“正义”或“公义”。希腊文 δικαιοσύνη 在这里可指正直、合宜的品行，也可具有正义的含义。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译近于“他的魂（或生命）衰竭了／离开了他”，是表示死亡的习语。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“他有尊荣地安葬了他”，动词为单数。安葬者在本句中未明说；按上下文，指多俾亚，即死者的儿子。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: παιδία
  choice: 孩子们
  rationale: 这是呼格复数，用于亲切地称呼后辈或年轻听众；“孩子们”自然保留了家族式称呼，又不额外限定性别。
- source_word: ἐλεημοσύνη
  choice: 施舍
  rationale: 在《多俾亚传》中常指向穷人提供实际帮助和财物，不只是抽象的怜悯；“施舍”准确而易懂。
- source_word: ποιεῖ
  choice: 能成就什么
  rationale: 原文直译为“做什么”；汉语用“能成就什么”更自然，同时保留开放式表达，不具体限定施舍产生的效果。
- source_word: δικαιοσύνη
  choice: 正义
  rationale: 该词可指正义、公义或正直的行为；此处与施舍并列，强调合宜正直的行事。“正义”是现代汉语中较通行的表达，其他可能含义列于脚注。
- source_word: ῥύεται
  choice: 救人
  rationale: 该动词表示搭救、解救；“救人”简洁自然，且不把这里的拯救限定为肉身、社会处境或末世意义。
- source_word: ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: 生命……终结了
  rationale: 这是表示死亡的希腊语说法；正文清楚传达死亡事件，脚注保留其中“魂/生命离去或衰竭”的字面形象，避免过度规定死亡时灵魂的状态。
- source_word: κλίνη
  choice: 床
  rationale: 在临终叙事中指所躺的床，现代汉语直接译作“床”最自然。
- source_word: ἐτῶν ἑκατὸν πεντήκοντα ὀκτώ
  choice: 享年一百五十八岁
  rationale: 自然、庄重地表达死者年龄，并符合现代汉语讣叙语境。
- source_word: ἔθαψεν αὐτὸν ἐνδόξως
  choice: 死后得到隆重安葬
  rationale: “隆重安葬”传达ἐνδόξως所指的体面、尊荣。正文采用自然的被动表达，避免生硬的“他安葬了他”；脚注明示希腊文动词为单数，保留其句法特点。
theological_decisions:
- issue: δικαιοσύνη的意义范围
  choice: 正义
  alternative: 公义；正直
  rationale: 此词兼有正义、合宜和正直行事等意义。正文不把它窄化为司法公正，也不专门赋予某一宗派的神学术语色彩；脚注保留可译作“公义”的可能。
- issue: ἐξέλιπεν αὐτοῦ ἡ ψυχὴ所表达的死亡观
  choice: 生命就在床上终结了
  alternative: 他的魂在床上离去了；他在床上断了气
  rationale: 原句明确叙述死亡，却未系统说明灵魂与身体分离的机制。正文传达事件，脚注呈现字面表达，以保存其人论上的张力。
- issue: 末句单数动词的隐含主语
  choice: 死后得到隆重安葬
  alternative: 他隆重地安葬了他；他们隆重地安葬了他
  rationale: 所据希腊文本使用第三人称单数动词，但本节内没有明说主语。正文不擅自改成复数，也避免用两个“他”造成难解；脚注保留单数句法及其歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“施舍”“救人”“隆重安葬”贴近日常标准汉语；通过脚注保留δικαιοσύνη的词义幅度、死亡习语的字面形象，以及末句单数动词的主语歧义。
