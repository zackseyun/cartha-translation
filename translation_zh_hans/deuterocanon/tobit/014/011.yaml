    issue: 死亡句的汉语主语和语序不自然。
    rationale: “生命就在床上终结了”未明示“他的生命”，且“就在”添加强调；希腊文只是说他在床上死亡。
  - severity: medium
    issue: 末句被动表达未在正文中保留单数行动者。
    rationale: 所据希腊文为单数主动动词。结合本段叙事，安葬者为其儿子；以“他的儿子”表达既自然，也不改成无根据的复数。
  - severity: low
    issue: “正义怎样救人”略将抽象名词拟人化，并把未明示的受事固定为“人”。
    rationale: “正直如何带来拯救”在汉语中更顺畅，也保留原文动词未说明具体受事或拯救范围的开放性。
