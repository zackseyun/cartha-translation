  source_fidelity: 正文大体准确传达了劝勉、死亡、年龄和安葬的内容，但“生命就在床上终结了”在汉语中主语不明且“就在”无原文根据；末句的被动式虽自然，却抹去了希腊文单数主动动词所指向的、由上下文可辨认的安葬者。修订以自然中文表达死亡习语，并在不把原文句法歧义误作复数的前提下保留单数行动者。
  naturalness: “正义怎样救人”和“生命就在床上终结了”略显生硬，后者尤其容易读成抽象的“生命”在床上终结。改为“正直如何带来拯救”和“他在床上断了气”，更符合现代标准汉语的庄重叙事。
  terminology: ἐλεημοσύνη译为“施舍”恰当，保留其向贫困者实际施予的含义。δικαιοσύνη在此为与施舍相关的道德正直；正文采用“正直”，脚注保留“正义／公义”的可能。ἐνδόξως译为“庄重地”或“以礼”比“隆重”更贴近“有尊荣地、体面地”的安葬。
  issues:
