  text: And he was fifty-eight years old when he lost his sight[a], and after eight years he regained it; and he did acts of mercy[c][b], and he continued to fear God.
translation:
  language: zh_hans
  text: 他五十八岁时失明，八年后又恢复了视力。他常行怜悯之事[a]，并继续敬畏[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“常常施舍”。原词既可特指赈济穷人的施舍，也可泛指怜悯的善行。
    reason: lexical_alternative
  - marker: b
    text: 原文只说“敬畏”，没有明说敬畏的对象；按这里的虔敬语境，可理解为敬畏上帝。
    reason: source_ambiguity
lexical_decisions:
- source_word: ἦν ἐτῶν πεντήκοντα ὀκτὼ
  choice: 他五十八岁时
  rationale: 这是希腊语表达年龄的惯用结构；译为现代汉语自然的“五十八岁时”.
- source_word: ἀπώλεσεν τὰς ὄψεις
  choice: 失明
  rationale: 原文直译近于“失去了视力”；“失明”简洁自然，并准确表达其结果。
- source_word: μετὰ ἔτη ὀκτὼ ἀνέβλεψεν
  choice: 八年后又恢复了视力
  rationale: ἀναβλέπω在医治或失明语境中指重新看见、恢复视力；“又”体现恢复之意。
- source_word: ἐποίει ἐλεημοσύνας
  choice: 常行怜悯之事
  rationale: 未完成时ἐποίει表示持续或惯常的行动；ἐλεημοσύνη既可特指施舍，也可泛指怜悯善行，正文保留较宽的语义。
- source_word: προσεθέτο φοβεῖσθαι
  choice: 继续敬畏
  rationale: προστίθημι接不定式可表示继续做某事。原文没有明说敬畏的对象，因此正文不擅自补出“上帝”。
theological_decisions:
- issue: φοβεῖσθαι所敬畏的对象未明说
  choice: 正文译作“继续敬畏”，不补宾语
  alternative: 继续敬畏上帝
  rationale: 虔敬语境很可能暗指上帝，但希腊文本本身没有宾语。现代汉语可以让“敬畏”独立使用，故保留原文的省略，并在脚注说明。
- issue: ἐλεημοσύνας的范围
  choice: 怜悯之事
  alternative: 施舍
  rationale: 该词在本书语境中常可指周济穷人的施舍，但词义也容许较广泛的怜悯善行；正文避免无必要地缩窄范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“常行”体现未完成时所表达的惯常行动；末句保留原文未明说敬畏对象的特点，避免把语境推断直接写入正文。
