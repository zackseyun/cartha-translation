  to: “孩子，你要到米底亚去[a]，因为我确信，先知约拿论到尼尼微所说的必会实现：尼尼微必被倾覆。不过，米底亚会较为安宁一段时期。我们的弟兄将从那美地被驱散；耶路撒冷将要荒凉，其中上帝的殿[b]必被焚毁，这殿将荒废一段时期。”
