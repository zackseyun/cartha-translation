  text: ἄπελθε εἰς τὴν Μηδείαν, τέκνον, ὅτι πέπεισμαι ὅσα ἐλάλησεν Ἰωνᾶς ὁ προφήτης περὶ Νινευὴ ὅτι καταστραφήσεται, ἐν δὲ τῇ Μηδείᾳ ἔσται εἰρήνη μᾶλλον ἕως καιροῦ· καὶ ὅτι οἱ ἀδελφοὶ ἡμῶν ἐν τῇ γῇ σκορπισθήσονται ἀπὸ τῆς ἀγαθῆς γῆς, καὶ Ἰεροσόλυμα ἔσται ἔρημος καὶ ὁ οἶκος τοῦ θεοῦ ἐν αὐτῇ κατακαήσεται, καὶ ἔρημος ἔσται μέχρι χρόνου.
