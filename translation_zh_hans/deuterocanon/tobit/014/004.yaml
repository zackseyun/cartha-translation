base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/004.yaml
  text: 'Go to Media[a], my child, because I am convinced that what Jonah the prophet spoke concerning Nineveh will happen: it will be overthrown. But in Media there will be peace for a while. And our brothers will be scattered from the good land, and Jerusalem will be desolate, and the house of God in it will be burned down[b], and it will be desolate until a time.'
translation:
  language: zh_hans
  text: “孩子，你要到米底亚去[a]，因为我确信，先知约拿论到尼尼微所说的必会实现：尼尼微必被倾覆。不过，米底亚会较为安宁一段时期。我们的弟兄将从那美地被驱散；耶路撒冷将要荒凉，其中上帝的殿[b]必被焚毁，这殿将荒废一段时期。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文含有比较词，也可理解为米底亚会“较为安宁一段时期”。这可能是指米底亚相对更安全，并非绝对太平。
    reason: 保留μᾶλλον的比较意味，并以自然汉语表达ἕως καιροῦ所指未定而有限的时段。
  - marker: b
    text: “上帝的殿”指耶路撒冷的圣殿。
    reason: 说明语境中的具体所指。
lexical_decisions:
- source_word: ἄπελθε εἰς τὴν Μηδείαν
  choice: 你要到米底亚去
  rationale: 以自然的现代汉语表达不定过去时命令语气和目的地；“米底亚”采用通行地名译法。
- source_word: τέκνον
  choice: 孩子
  rationale: 保留呼格所表达的亲情，不因上下文而把词义限定为“儿子”。
- source_word: πέπεισμαι
  choice: 我确信
  rationale: 表达完成时所强调的已形成并持续存在的坚定确信。
- source_word: ὅσα ἐλάλησεν Ἰωνᾶς ὁ προφήτης περὶ Νινευὴ ὅτι καταστραφήσεται
  choice: 先知约拿论到尼尼微所说的必会实现：尼尼微必被倾覆
  rationale: 清楚呈现确信的内容及其预言性指向；“倾覆”对应 καταστρέφω 的审判与毁灭色彩。
- source_word: ἐν δὲ τῇ Μηδείᾳ ἔσται εἰρήνη μᾶλλον ἕως καιροῦ
  choice: 不过，米底亚会相对安宁，直到一个时期
  rationale: 保留 μᾶλλον 的比较意味，表示米底亚相对更安全而非绝对太平；ἕως καιροῦ 的期限保持不确定。
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: 我们的弟兄
  rationale: 忠实保留阳性复数形式，同时在语境中可自然指共同体中的以色列同胞。
- source_word: σκορπισθήσονται ἀπὸ τῆς ἀγαθῆς γῆς
  choice: 将从那美地被驱散
  rationale: 被动表达流散；“美地”既简洁又保留 ἀγαθῆς γῆς 的圣经性共鸣。
- source_word: Ἰεροσόλυμα ἔσται ἔρημος
  choice: 耶路撒冷将要荒凉
  rationale: 此处 ἔρημος 表示遭毁后的荒废状态，而非字面上的旷野。
- source_word: ὁ οἶκος τοῦ θεοῦ
  choice: 上帝的殿
  rationale: “殿”在耶路撒冷语境中自然指圣殿，也保留其作为上帝之家的含义。
- source_word: μέχρι χρόνου
  choice: 一段时期
  rationale: 保留 χρονός 所指的不确定时段，不把它解释为明确日期或特定末世期限。
theological_decisions:
- issue: 约拿关于尼尼微之言与其应验的句法关系
  choice: 所说的必会实现：尼尼微必被倾覆
  alternative: 我确信先知约拿论到尼尼微所说的话，就是尼尼微必被倾覆
  rationale: 希腊文可以较生硬地处理为“确信……所说的”，正文以汉语明确呈现预言内容会实现，但不添加实现方式或神学解释。
- issue: 米底亚的平安是否为绝对平安
  choice: 相对安宁
  alternative: 会有安宁
  rationale: 保留 μᾶλλον 的比较张力，避免把相对安全翻成无条件、绝对的平安。
- issue: “上帝的家”的所指
  choice: 上帝的殿，并以脚注说明是耶路撒冷的圣殿
  alternative: 上帝的家
  rationale: 上下文明确位于耶路撒冷且将被焚毁，汉语“殿”自然准确；脚注说明所指而不引入宗派性解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。预言段落使用“必”“将要”保持宣告语气；不把两个不确定的时间表达解释成具体期限，并通过正文与脚注保留“相对安宁”的比较意味。
