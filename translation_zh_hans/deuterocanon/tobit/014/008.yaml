  text: And now[a], child, depart from Nineveh, because what the prophet Jonah spoke will surely happen.
translation:
  language: zh_hans
  text: 现在，孩子，你要离开尼尼微，因为先知约拿所说的必定会发生。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: 现在
  rationale: 在此承接上文并转入当前的劝告；现代汉语用“现在”自然表达，无须机械译出 καί。
- source_word: τέκνον
  choice: 孩子
  rationale: 这是父辈对后辈的亲属称呼；“孩子”保留亲昵而庄重的语气，也不比希腊文更具体地限定为“儿子”。
- source_word: ἄπελθε ἀπὸ Νινευή
  choice: 你要离开尼尼微
  rationale: 不定过去时命令式表达明确的离去指令；“离开尼尼微”准确传达 ἀπό 所表示的分离。补出“你”符合现代汉语直接嘱咐的表达。
- source_word: πάντως
  choice: 必定
  rationale: 表达预言实现的强烈确定性，语气明确而不增添时间或方式上的解释。
- source_word: ἔσται
  choice: 会发生
  rationale: 在预言语境中指所说之事成为事实；“会发生”是自然、清楚的现代汉语。
- source_word: ἃ ἐλάλησεν
  choice: 所说的
  rationale: 关系代词指约拿宣告的内容；汉语以“所说的”简洁保留其开放指称。
- source_word: ὁ προφήτης Ἰωνᾶς
  choice: 先知约拿
  rationale: 采用现代汉语中自然的头衔加人名结构，准确保留其先知身份。
theological_decisions:
- issue: 关于尼尼微之预言的确定性
  choice: “先知约拿所说的必定会发生”
  alternative: “先知约拿所说的一切都必定应验”
  rationale: “必定”保留 πάντως 的强调；“会发生”紧贴 ἔσται，并避免用“应验”额外强化技术性的神学表达，也不说明预言实现的时间或机制。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“孩子”保留亲属称呼的温度而不擅自限定性别；全句保持临终嘱咐式的郑重与直接。
