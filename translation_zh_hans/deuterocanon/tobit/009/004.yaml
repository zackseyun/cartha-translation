  text: And my father is counting the days, and if I delay long, he will be greatly distressed.
translation:
  language: zh_hans
  text: 我父亲正在数着日子；如果我耽搁太久，他会非常忧伤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀριθμεῖ
  choice: 正数着
  rationale: 现在时表示持续进行的动作；“正数着”自然传达父亲等待期间不断计算日子的情形。
- source_word: τὰς ἡμέρας
  choice: 日子
  rationale: 直接表达其宾语意义；“数着日子”在现代汉语中也能自然传达等待时的挂念。
- source_word: χρονίσω
  choice: 我耽搁
  rationale: ἐὰν 后的虚拟式表达将来的可能情况；“我耽搁”保留第一人称，也不额外暗示耽搁是由外力造成的。
- source_word: μέγα
  choice: 太久
  rationale: μέγα 在此作副词修饰 χρονίσω，表示长时间；结合语境译作“太久”符合现代汉语，并显出说话者所担心的过长延误。
- source_word: ὀδυνηθήσεται
  choice: 他一定会忧伤
  rationale: 该词表示强烈的内心痛苦或悲伤；“忧伤”庄重而通俗，适合父亲因迟归而痛苦的语境。
- source_word: λίαν
  choice: 非常
  rationale: λίαν 强化忧伤的程度；“非常”清楚、自然地保留这一强调。
