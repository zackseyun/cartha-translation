  text: And they rose early together and came to the wedding[a], and Tobias blessed his wife.
translation:
  language: zh_hans
  text: 他们一同早起，来到婚礼现场[a]；多比亚祝福了他的妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“婚宴”。希腊语γάμος可指婚姻、婚礼或婚礼庆宴。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρευσαν
  choice: 早起
  rationale: 该动词指清早或黎明时起身；“早起”自然保留了时间含义，又不额外断定他们当时已经启程。
- source_word: κοινῶς
  choice: 一同
  rationale: 该副词表示共同采取行动；“一同”可自然地关联早起及随后前往婚礼的动作。
- source_word: ἦλθοσαν
  choice: 来到
  rationale: 原文直译为“来到”；此处保留叙事视角，不改作“前往”或“抵达”。
- source_word: γάμον
  choice: 婚礼
  rationale: γάμος既可指婚姻或婚礼，也可指婚宴；正文采用涵盖面较广且自然的“婚礼”，并以脚注保留“婚宴”的可能。
- source_word: εὐλόγησεν
  choice: 祝福了
  rationale: 该词通常表示“祝福”。原文没有交代祝福的形式或内容，因此不扩译为某种礼仪性的祝祷。
- source_word: Τωβείας
  choice: 多比亚
  rationale: 按本书希腊语人名Τωβείας采用清楚、常见的现代汉语音译。
- source_word: γυναῖκα αὐτοῦ
  choice: 自己的妻子
  rationale: 在婚姻语境中γυνή明确指“妻子”；“自己的”清楚表达αὐτοῦ与主语多比亚的所属关系。
theological_decisions:
- issue: εὐλόγησεν ... τὴν γυναῖκα αὐτοῦ所描述的祝福性质
  choice: 多比亚祝福了自己的妻子
  alternative: 多比亚为自己的妻子祝祷
  rationale: 经文只陈述多比亚祝福妻子，并未说明具体言辞、仪式或礼仪形式；因此正文保留简单直接的动作，不引入后来的礼仪设定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“来到婚礼上”符合现代汉语习惯；分号呈现两个紧密相连但各自完整的动作。
