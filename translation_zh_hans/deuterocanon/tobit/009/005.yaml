  yaml_path: translation/deuterocanon/tobit/009/005.yaml
  text: So Raphael went and lodged with Gabael[a], and he gave him the written note[b]; then Gabael brought out the money bags with the seals and gave them to him.
translation:
  language: zh_hans
  text: 于是拉斐尔去了，在迦巴勒家投宿，并把字据[a]交给他；迦巴勒便拿出封印仍完好的钱袋[b]，交给了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“债券”或“借据”。希腊语χειρόγραφον可指确认某项财务债权的书面凭据。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在封印中的袋子”，意思是钱袋的封印仍然完好。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: 去了
  rationale: 这是叙事中的简单过去时动作；“去了”自然、简洁，不额外加入“启程”或长途旅行的含义。
- source_word: ηὐλίσθη παρὰ Γαβαήλ
  choice: 投宿在迦巴勒那里
  rationale: αὐλίζομαι可指住宿或过夜；“投宿”保留旅行语境，也自然表达παρά加人名所指的“住在某人那里”。
- source_word: τὸ χειρόγραφον
  choice: 字据
  rationale: χειρόγραφον指亲笔写成、承认某项债务或财务权利的文书；“字据”简洁自然，并保留其具体法律性质可有不同理解的余地。
- source_word: προήνεγκεν
  choice: 拿出
  rationale: 该动词在这里表示把所存放的物件取出并拿来；“拿出”符合具体动作和现代汉语叙事。
- source_word: τὰ θυλάκια
  choice: 钱袋
  rationale: θυλάκιον是小袋或囊；上下文明确涉及寄存的钱财，因此译作“钱袋”既清楚又不过度扩写。
- source_word: ἐν ταῖς σφραγῖσιν
  choice: 仍封着印
  rationale: 希腊语字面为“在封印中”，语境表明钱袋的封印仍在；此译保留封印的具体形象，并以自然汉语传达其未被开启。
- source_word: ἔδωκεν αὐτῷ
  choice: 交给了他
  rationale: 原文末句省略直接宾语，由前文的钱袋补足；汉语可自然沿用省略，以避免不必要的重复。
