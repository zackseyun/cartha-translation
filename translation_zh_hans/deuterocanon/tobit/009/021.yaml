lexical_decisions:
- source_word: ἐλογίζετο
  choice: 在数着
  rationale: 未完成时表示持续或反复进行的动作；结合上下文，托比特是在数算儿子离家和归来的日子。现代汉语用“在数着”自然传达这一持续状态。
- source_word: ἑκάστης ἡμέρας
  choice: 每天
  rationale: 该短语表达逐日反复发生，译作“每天”简洁自然，并保留分配性的含义。
- source_word: Τωβεὶθ ὁ πατὴρ αὐτοῦ
  choice: 他的父亲托比特
  rationale: 原文先提托比特，再以同位语说明他是“他的父亲”；汉语调整语序，以“他的父亲托比特”清楚、自然地保留人物关系。
