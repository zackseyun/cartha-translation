  text: For Raguel has sworn not to let me leave[a].
translation:
  language: zh_hans
  text: 因为拉古耳已经起誓，不让我离开[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“不让我出去”；按上下文，指不让他离开拉古耳的家。
    reason: 说明“离开”所译希腊语的字面意思是“出去”，并交代其语境含义。
lexical_decisions:
- source_word: διότι
  choice: 因为
  rationale: 引出前述行动的原因，保留原文的因果关系，也符合现代汉语叙事表达。
- source_word: ὠμόμοκεν
  choice: 已经起誓
  rationale: 该词为完成时，表示起誓这一行动已经完成，其效力仍延续到当前；“已经起誓”自然地体现这一点。
- source_word: ὁ Ῥαγουὴλ
  choice: 拉古耳
  rationale: 按希腊文人名 Ῥαγουήλ 音译，采用简明、易读的现代汉语形式。
- source_word: μὴ ἐξελθεῖν με
  choice: 不让我离开
  rationale: 原文直译近于“不让我出去”。结合此处旅行和离开拉古耳家的语境，“不让我离开”更自然，并保留拉古耳以誓言阻止说话者离去的含义。
