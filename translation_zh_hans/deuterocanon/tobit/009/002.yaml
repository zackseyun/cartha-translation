base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/002.yaml
  text: Take with yourself a servant and two camels, and go to Rages of Media, to Gabael, and bring me the money, and bring him with you to the wedding.
translation:
  language: zh_hans
  text: 你要带上一名仆人和两匹骆驼，到米底亚的拉吉斯去找加贝尔，把那笔钱[a]给我取回来，也把他带来参加婚礼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“银子”；这里指托付给加贝尔的那笔钱。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“参加婚宴”。希腊词既可指婚礼，也可指庆祝婚姻的宴席。
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβε μετὰ σεαυτοῦ
  choice: 你要带上
  rationale: 用现代汉语自然表达“随身带着、带同”的意思；不机械译出反身代词，但保留同行之意。
- source_word: παῖδα
  choice: 一名仆人
  rationale: παῖς可指孩子、少年或仆役；旅行语境支持“仆人”，而原句并未着重其奴隶身份。
- source_word: δύο καμήλους
  choice: 两峰骆驼
  rationale: 按现代汉语量词习惯表达原文的数词和名词。
- source_word: πορεύθητι ἐν Ῥάγοις τῆς Μηδείας
  choice: 到米底亚的拉吉斯去
  rationale: 运动动词与上下文表明地点是目的地；采用常见中文地名音译，并保留所属地区。
- source_word: παρὰ Γαβαήλ
  choice: 去找加贝尔
  rationale: παρά接人名在此表示到某人那里；“去找”比生硬的“到加贝尔那里”更符合自然汉语，又不增添“家中”等原文没有的信息。
- source_word: κόμισαί μοι τὸ ἀργύριον
  choice: 把那笔钱给我取回来
  rationale: ἀργύριον字面是“银子”，此处指托付给加贝尔的款项；κόμισαι含取回并带来的意思。
- source_word: καὶ αὐτὸν ἄγε μοι
  choice: 也把他带来
  rationale: αὐτόν回指加贝尔；ἄγε在此表示带领或带来。中文省去重复的“给我”，仍清楚保留说话者为目的方。
- source_word: εἰς τὸν γάμον
  choice: 参加婚礼
  rationale: γάμος可指婚礼、婚姻或婚宴；叙事中是邀请加贝尔前来庆贺，正文采用宽泛自然的“婚礼”，脚注保留“婚宴”的可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。用“带上”“去找”“取回来”形成自然连贯的差遣语气；专名译作“拉吉斯”“加贝尔”。未把较晚的闪语平行传统所增添的随从人数、加贝尔住所及后续情节写入正文，因为本节以所给希腊文本为主要依据。
