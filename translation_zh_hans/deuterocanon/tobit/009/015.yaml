lexical_decisions:
- source_word: ηυλογησεν
  choice: 祝福
  rationale: εὐλογέω在这一叙事语境中表示向人祝福；译作“赞美”会改变受词和语义。
- source_word: τους αιωνας
  choice: 直到永远
  rationale: “到诸世代”的惯用表达在祝福语中表示无尽的延续；“直到永远”既自然又保留其时间指向。
theological_decisions:
- issue: 祝福短语的文本形态
  choice: 正文采用简短读法：“他祝福他们，直到永远。”
  alternative: 部分旁注见证增添“纯洁而神圣的祝福”；另有见证在“众人”和“世代”前增词。
  rationale: 所给希腊文证据属于校勘栏式材料，简短正文可确定的核心是祝福及其永久性。较长的修饰语不宜无声纳入正文，故以脚注保存。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“直到永远”避免把一次施行的祝福误解为持续不断的动作，同时传达祝福长存的含义。
