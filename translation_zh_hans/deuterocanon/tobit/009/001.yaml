lexical_decisions:
- source_word: ἐκάλεσεν
  choice: 叫来
  rationale: καλέω在此引出直接引语；“叫来”自然表达召来对方说话的意思，又不像“召见”那样正式或强化语气。
- source_word: Τωβίας
  choice: 托比亚
  rationale: 按希腊文音译，并采用现代汉语中清楚、自然的人名形式。
- source_word: Ῥαφαήλ
  choice: 拉斐尔
  rationale: 采用该人名通行且易辨识的汉语音译。
- source_word: Ἀζαρία
  choice: 亚撒利雅
  rationale: 原文明确记载托比亚以同行时所用的名字称呼拉斐尔，因此保留这一称呼，不将两个人名合并或改写。
- source_word: ἀδελφέ
  choice: 我的弟兄
  rationale: 保留呼格“弟兄”的亲近称呼；加入“我的”使现代汉语呼语更自然，同时不把它解释成普通的“朋友”，也不武断断定为血缘兄弟。
