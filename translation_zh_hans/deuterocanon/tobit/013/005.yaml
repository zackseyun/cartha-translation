base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/005.yaml
  text: And he will scourge us for our injustices[a], and again he will show mercy and gather us from all the nations among which you were scattered.
translation:
  language: zh_hans
  text: 他必因我们的不义鞭打我们，又必怜悯我们，把我们从万国中聚集回来——无论你们分散在那些国中何处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在本句前半使用“我们／我们的”，到末句则转为“你们被分散”。有些译本将人称统一为“我们被分散”，本译文保留原文的人称转换。
    reason: 说明原文的人称转换及常见的协调译法。
lexical_decisions:
- source_word: μαστιγώσει
  choice: 必……鞭打
  rationale: 该动词本义为鞭打、鞭笞，此处指上帝严厉的惩治；译作“鞭打”既保留原文力度，也不将其淡化为一般性的“惩罚”。
- source_word: ἐν ταῖς ἀδικίαις ἡμῶν
  choice: 因我们的不义
  rationale: ἐν在此按语境表达原因；ἀδικίαις为复数，涵盖不义和恶行。汉语“不义”可自然用作集合概念，无须生硬译成复数。
- source_word: πάλιν
  choice: 之后又
  rationale: 既表达“又、再次”，也清楚呈现惩治之后转而施怜悯的次序。
- source_word: ἐλεήσει
  choice: 必施怜悯
  rationale: 保留动词所表达的主动怜悯行动，且符合庄重、自然的现代汉语。
- source_word: συνάξει
  choice: 必……聚集起来
  rationale: 直接保留离散者重新被聚集的复归意象。
- source_word: ἐξ πάντων τῶν ἐθνῶν
  choice: 从……各民族中
  rationale: 这里指以色列人流散其间的众民族，不宜特意译成带有神学分类色彩的“外邦人”。
- source_word: οὗ ἐὰν σκορπισθῆτε ἐν αὐτοῖς
  choice: 你们被分散到的各民族中
  rationale: ἐὰν加虚拟式带有不定意味，可理解为“无论被分散到哪里”；结合前面的“各民族”，此译自然表达其所散居的范围，同时保留第二人称复数。
theological_decisions:
- issue: 末句由第一人称复数转为第二人称复数
  choice: 保留“我们……你们”的人称转换
  alternative: 统一译为“我们被分散到的各民族中”
  rationale: 希腊文先用ἡμᾶς／ἡμῶν（我们／我们的），末句却用σκορπισθῆτε（你们被分散）。译文不默默协调这一转换，而以脚注说明。
- issue: 惩治与怜悯的并置
  choice: 保留“鞭打”与“施怜悯”之间鲜明而未加解释的张力
  alternative: 将“鞭打”弱化为“管教”或补入神学解释
  rationale: 原文直接并置上帝的严厉惩治和随后的怜悯、聚集；译文不额外界定惩治的性质或目的。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“鞭打”保留原文强烈意象；“施怜悯”“聚集起来”自然呈现惩治、怜悯与复归的推进。脚注标记[a]已置于正文相关句末。
