  naturalness: 原译总体庄重自然。“之后又必”略显重复；以“又必”即可自然表达πάλιν所标示的再次施恩，并让句子更顺畅。将末句处理为插入性的“无论你们分散在那些国中何处”，可在汉语中清楚保留原文的人称突变。
