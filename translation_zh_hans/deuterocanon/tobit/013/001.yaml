base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/001.yaml
  text: Then Tobit wrote a prayer of rejoicing and said[a], “Blessed is the living God forever, and his kingdom.”
translation:
  language: zh_hans
  text: 于是，托比特写下一篇欢庆的祷告，说：“永活的上帝当受称颂，直到永远；以及他的国度。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本以“以及他的国度”突兀收尾，没有明说谓语。有些译本补作“他的国度也当受称颂”，或把这句话与“直到永远”相连。这里保留原文的简略表达，不补入原文没有明说的内容。
    reason: 原文省略谓语，存在多种可能的理解。
lexical_decisions:
- source_word: ἔγραφεν
  choice: 写了
  rationale: 直接表达写下祷告这一动作；不译作“创作”，以免加入原文未必具有的文学意味。
- source_word: προσευχὴν εἰς ἀγαλλίασιν
  choice: 一篇欢庆的祷告
  rationale: “欢庆”传达ἀγαλλίασις所含的喜乐、欢腾之意，同时保持表达自然庄重。
- source_word: Εὐλογητὸς
  choice: 当受称颂
  rationale: 符合颂赞语境，也比单用“有福”更自然地表达对上帝的祝颂。
- source_word: ὁ θεὸς ὁ ζῶν
  choice: 永活的上帝
  rationale: 保留圣经中“活着的上帝”这一称号的含义；“永活”在现代中文中简洁庄重，并与下文永恒性相呼应。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 自然表达该希腊惯用语所指的无尽久远。
- source_word: βασιλεία
  choice: 国度
  rationale: 保留名词形式及圣经语体；“统治”虽可取，但会偏向抽象的施政或掌权含义。
theological_decisions:
- issue: 如何处理无显式谓语的末尾短语καὶ ἡ βασιλεία αὐτοῦ
  choice: 译为略显突兀的“还有他的国度”，并以脚注说明
  alternative: 他的国度也当受称颂／他的国度永远长存／他的国度也永存
  rationale: 所据希腊文本在此没有为“他的国度”明说谓语。正文不补入“当受称颂”或“永存”，以免消除原文的省略和歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“还有他的国度”有意保留希腊原文末句的突兀和省略；脚注标记[a]置于正文“说”之后。
