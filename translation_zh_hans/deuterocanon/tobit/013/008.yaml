  text: Let them all speak and give thanks to him in Jerusalem[a].
translation:
  language: zh_hans
  text: 愿众人都在耶路撒冷述说，并向他献上感谢[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向他认罪”或“称颂他”；这个希腊语动词在不同语境中可表达这些与敬拜有关的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγέτωσαν
  choice: 愿……述说
  rationale: 这是 λέγω 的第三人称复数命令式。用“愿……述说”表达劝勉语气，同时不把所述内容限定为“宣告”。
- source_word: πάντες
  choice: 众人都
  rationale: πάντες 在此作名词用，表示所有人；“众人都”自然地保留其普遍范围。
- source_word: ἐξομολογείσθωσαν
  choice: 献上感谢
  rationale: 该动词在圣经希腊语的敬拜语境中可表示承认、称颂或感谢。此处属于赞美诗体，“献上感谢”最贴合上下文，同时以脚注保留其他真实可能。
- source_word: αὐτῷ
  choice: 向他
  rationale: 与格代词指向上帝；“向他”清楚表达动作的对象。
- source_word: ἐν Ἱεροσολύμοις
  choice: 在耶路撒冷
  rationale: ἐν 加地名与格表示地点，现代汉语自然译为“在耶路撒冷”。
theological_decisions:
- issue: 敬拜语境中 ἐξομολογείσθωσαν 的含义
  choice: 献上感谢
  alternative: 向他认罪；称颂他
  rationale: 该词具有认罪、承认、称颂和感谢等相关义项。多比传第13章是颂赞性的诗歌，因此正文采用“献上感谢”，但不排除“认罪”或“称颂”的理解，并在脚注中保存这种语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……述说，并……”保留两个并列的第三人称命令式；“献上感谢”符合诗歌敬拜语境，也比单说“感谢”更具礼仪色彩。
