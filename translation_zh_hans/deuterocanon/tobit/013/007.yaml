base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/007.yaml
  text: I exalt my God[a], and my soul rejoices in the King of heaven, and it will exult in his greatness.
translation:
  language: zh_hans
  text: 我必尊崇我的上帝；我的心因天上的君王而欢喜[a]，并将因他的伟大而欢腾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这一分句是省略句，直译近于“我的心向着（或归于）天上的君王”，没有明说谓语。这里按赞美诗的上下文补译“欢喜”；该省略结构也可有“归向”或“属于”天上的君王一类的理解。
    reason: 说明原文省略结构及其真实的多种理解。
lexical_decisions:
- source_word: ὑψῶ
  choice: 我要尊崇
  rationale: 该形式可作第一人称单数将来时，也可能在形态上与虚拟式相同；在本句独立陈述及后文将来时动词的语境中，译作“我要尊崇”较为自然，并保留“高举、尊崇”的赞美含义。
- source_word: ψυχή
  choice: 我的心
  rationale: ψυχή在此指人的内在生命与全人投入的赞美。“我的心”是现代汉语诗歌与敬拜语境中自然、庄重的表达，比“我的灵魂”更通顺，同时没有简化为单纯的“我”。
- source_word: βασιλεῖ τοῦ οὐρανοῦ
  choice: 天上的君王
  rationale: 保留“君王”这一神圣称号和“天”的属格关系；“天上的君王”在现代汉语中清楚自然。
- source_word: ἀγαλλιάσεται
  choice: 将……欢腾
  rationale: 该将来时中间语态动词表达强烈、洋溢的喜乐。“欢腾”既体现强度，也保留赞歌的庄重色彩。
- source_word: μεγαλοσύνην
  choice: 伟大
  rationale: 该名词泛指伟大、尊荣或威荣。“伟大”最直接宽广，不把含义过度限定为外显的“威严”。
- source_word: καὶ ἡ ψυχή μου τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: 我的心要因天上的君王而欢喜
  rationale: 传世希腊文本此分句没有明说谓语，且“君王”为与格。根据全节赞美与欢腾的语境，补出“欢喜”并以“因”表达其所指；脚注同时说明原文的省略，避免把这一补译说成唯一可能。
theological_decisions:
- issue: 中间分句缺少明确谓语
  choice: 按诗歌省略句理解，补译为“我的心要因天上的君王而欢喜”
  alternative: 直译为“我的心归向天上的君王”，或理解为“我的心属于天上的君王”
  rationale: 上下文是赞美之歌，后句又明确使用表示欢腾的动词，因此补出喜乐之意最连贯；但希腊文本本身并未写出谓语，故以脚注保留语法和意义上的真实歧义。
- issue: ὑψῶ的时态与语气
  choice: 依上下文译作将来陈述“我要尊崇”
  alternative: 按虚拟式可能性理解为“愿我尊崇”
  rationale: 该形式在形态上可能有歧义，但作为独立句并与后面的将来时ἀγαλλιάσεται并列，将来陈述更符合现有句法；此选择属于语法判断，不涉及教义性限定。
translation_notes:
  register: 采用现代、庄重而易懂的赞歌语体。“尊崇—欢喜—欢腾”形成递进，并用分号呈现原文并列而富节奏的结构；不使用带特定宗派色彩的术语。
