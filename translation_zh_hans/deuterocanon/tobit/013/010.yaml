revisions:
- from: 你要好好称谢主，颂赞万世之王，使他的帐幕可以欢欢喜喜地在你那里重新建造；使他可以使被掳的人在你里面欢喜，并在你里面爱那些困苦的人，直到永世的万代。
  to: 你要好好地称谢主，颂赞万世之王，好使他的帐幕再次为你在欢欣中重建；又使他在你中间使被掳的人欢喜，在你中间爱那些困苦的人，直到永世的一切世代。
  rationale: 修正σοι的与格功能为“为你”，并重组目的/愿望从句，使其在现代庄重汉语中可朗读，同时保留原文帐幕、空间重复、神对被掳者与困苦者的行动及双重时间语的含义。
