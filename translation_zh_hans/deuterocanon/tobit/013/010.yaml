base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/010.yaml
  text: Give thanks well to the Lord, and bless the King of the ages, so that his tent may again be built for you with joy; and so that he may gladden within you the captives and love within you the afflicted for all the generations of the age.
translation:
  language: zh_hans
  text: 你要好好地称谢主，颂赞万世之王，好使他的帐幕再次为你在欢欣中重建；又使他在你中间使被掳的人欢喜，在你中间爱那些困苦的人，直到永世的一切世代。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολόγου
  choice: 称谢
  rationale: 此处与颂赞相并，采用敬拜语境中自然的“称谢”，兼顾公开承认和感谢的含义。
- source_word: ἀγαθῶς
  choice: 好好
  rationale: 保留副词“良好地、恰当地”的明确修饰作用，同时使用现代汉语中自然的劝勉表达。
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: 万世之王
  rationale: 既保留复数“诸世代/诸时代”的广阔时间含义，也符合庄重而易懂的汉语表达。
- source_word: ἡ σκηνὴ αὐτοῦ
  choice: 他的帐幕
  rationale: 直译“帐幕”，不擅自具体化为圣殿或居所，以保留原文意象。
- source_word: ἐν σοὶ
  choice: 在你里面
  rationale: 两次照应单数受话者，保留原文空间表达及其可能具有的城市人格化意味。
- source_word: τοὺς ταλαιπώρους
  choice: 那些困苦的人
  rationale: 涵盖受苦、受压和处境悲惨之意，不把含义缩限为单一类别。
- source_word: εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος
  choice: 直到永世的万代
  rationale: 尽量保留“永世”与“万代”两个层面的原文表达，而不简单压缩成“永远”。
theological_decisions:
- issue: “帐幕”的所指
  choice: 保留“他的帐幕”
  alternative: 译作“他的圣殿”或“他的居所”
  rationale: 原文使用σκηνή，具有帐幕和神同住的意象；不应在翻译中把它限定为某一具体建筑。
- issue: 末句中神对困苦者的行动
  choice: 直译为“爱那些困苦的人”
  alternative: 弱化为“眷顾”或改作其他对象
  rationale: 原文明确使用ἀγαπάω，应保留“爱”，不因措辞不寻常而淡化其神学力度。
- issue: ἵνα之后并列结构的表达
  choice: 将建造、使欢喜和爱都译作祈愿/目的性的“使……可以”
  alternative: 把后两项改译为独立命令或陈述
  rationale: 希腊文后两项使用不定式，句法略显不规则，但语义上延续ἵνα所引出的愿望或目的；汉语据此连贯表达，同时不额外补入不同主体。
translation_notes:
  register: 采用现代、庄重而可朗读的劝勉语体。保留第二人称单数和“在你里面”的反复，不擅自将受话者明说为耶路撒冷；保留“帐幕”“万世之王”“永世的万代”等原文意象与时间张力。
