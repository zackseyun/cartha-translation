  text: 你要称颂上帝——伟大的君王，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλόγει
  choice: 要颂赞
  rationale: 这是 εὐλογέω 的第二人称单数现在时命令式。在以上帝为宾语时，意为称颂、赞美；“颂赞”既保留说美言、称颂的经文语感，也符合现代汉语表达。
- source_word: τὸν θεὸν
  choice: 上帝
  rationale: 带冠词的直接宾语，指上帝；汉语无需另译希腊语冠词。
- source_word: τὸν βασιλέα
  choice: 君王
  rationale: 与“上帝”同格，作为尊称说明他的王权；“君王”比一般的“王”更庄重自然。
- source_word: τὸν μέγαν
  choice: 伟大的
  rationale: μέγας 基本义为“伟大”；不译作“全能”或“大能”，以免把较宽泛的伟大缩限为能力。
theological_decisions:
- issue: 上帝的君王称号及其同格关系
  choice: 上帝，就是那位伟大的君王
  alternative: 伟大的君王上帝
  rationale: 原文三个带冠词的宾格短语构成同格关系：“上帝—君王—伟大的那位”。加入“就是那位”使现代汉语清楚呈现同格辨认关系，同时不增加原文之外的神学内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“要颂赞”表达单数命令语气；“就是那位”明确原文的同格结构。原文以逗号收尾，显示本句可能与后文相连，因此译文也保留逗号。
