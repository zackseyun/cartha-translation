base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/011.yaml
  text: Many nations will come from far away to the name of the Lord God[a], carrying gifts in their hands, gifts for the King of heaven; generations of generations will give you exultation.
translation:
  language: zh_hans
  text: 许多列国必从远方前来，归向主上帝的名，手中带着礼物，也带着献给天上君王的礼物；世世代代都要把欢欣带给你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译作“世代的世代都要把欢欣给你”；也可译作“代代都要使你欢欣”。
    reason: 说明γενεαὶ γενεῶν的重复强化结构，并保留δώσουσίν σοι ἀγαλλίαμα较自然的另一种理解。
lexical_decisions:
- source_word: ἔθνη πολλὰ
  choice: 许多国民
  rationale: ἔθνη可指“列国、各族、国民”。这里采用“许多国民”，既保留国际性的范围，也避免把后期“犹太人／外邦人”的对立过度带入经文。
- source_word: μακρόθεν
  choice: 从远方
  rationale: 准确表达遥远的出发地，也符合现代汉语的庄重诗歌语体。
- source_word: ἥξει
  choice: 必……来到
  rationale: 这是ἥκω的将来时，表示将要来到；“必”自然体现预告语气，“来到”适合朝圣场景。
- source_word: πρὸς τὸ ὄνομα Κυρίου τοῦ θεοῦ
  choice: 来到主上帝的名下
  rationale: 保留原文朝向“主上帝的名”而来的圣经意象，不直接缩窄为“敬拜”或“因主的名声而来”。“名下”在中文中可表达归向并聚集于其名，同时仍保留原文独特措辞。
- source_word: δῶρα ἐν χερσὶν ἔχοντες
  choice: 手里带着礼物
  rationale: 自然而具体地再现“手中有礼物”的伴随动作。
- source_word: καὶ δῶρα τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: 就是献给天上君王的礼物
  rationale: 保留δῶρα的重复强调；“献给”清楚表达与格所指的接受者，并符合礼物作为供献的语境。
- source_word: γενεαὶ γενεῶν
  choice: 世世代代
  rationale: 这是希腊文带有闪语色彩的重叠强化结构；“世世代代”在现代中文中自然、庄重，并传达延续多代的含义。
- source_word: δώσουσίν σοι ἀγαλλίαμα
  choice: 都要把欢欣带给你
  rationale: ἀγαλλίαμα表示欢欣、欢腾。“把欢欣带给你”既保留给予某人的结构，又比生硬的“给你欢欣”更符合现代汉语；“你”继续保持对耶路撒冷的诗性直接称呼，不在正文中明说其所指。
theological_decisions:
- issue: 第二人称代词σοι的所指
  choice: 保留为“你”，按上下文指向拟人化的耶路撒冷／锡安
  alternative: 直接译成“耶路撒冷”或泛指“以色列”
  rationale: 上下文直接向耶路撒冷说话。保留“你”维持诗歌中的直接称呼，也不把解释写入正文。
- issue: “来到主上帝的名”所表达的意义
  choice: 保留朝向上帝之名而来的圣经意象
  alternative: 意译为“来敬拜主上帝”或“因主上帝的名声而来”
  rationale: 原文可能蕴含敬拜、归向和尊崇，但只明说来到“名”那里；保留这一表达可避免把丰富含义限缩为单一解释。
- issue: 末句“给予欢欣”的关系
  choice: 译为“把欢欣带给你”，保留各世代使受话者欢欣的基本图景
  alternative: 译为“向你献上欢呼”或“使你欢欣”
  rationale: 原文的给予结构容许理解为带来欢欣，也可能带有献上欢腾的色彩；所选译法不把它完全限定为赞美行为或单纯的使役关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保持赞歌式节奏。以分号分开朝圣献礼与历代欢欣两个意群；“天上君王”保留神圣称号的尊严。“主上帝”对应Κύριος ὁ θεός，不额外加入宗派性称谓。
