revisions:
- from: 啊，爱你的人有福了！他们必因你的平安而欢喜。凡因你所受的苦难[a]而忧伤的人都有福了，因为他们看见你全部的荣耀时，必因你而欢喜；我的心灵也必永远欢欣。
  to: 啊，爱你的人有福了！他们必因你的平安而欢喜。凡因你所受的苦难[a]而忧伤的人都有福了，因为他们看见你一切的荣耀时，就必因你而欢喜；我的心灵也必永远欢欣。
  rationale: 仅作两项安全的文体与句法修订：以“你一切的荣耀”替代较生硬的“你全部的荣耀”，并把“因为……时”调整为“因为……时，就……”，使理由从句及时间性分词在中文中的关系清楚自然。正文含义、称呼对象的保留方式、神学中立性和脚注锚点均不变。
