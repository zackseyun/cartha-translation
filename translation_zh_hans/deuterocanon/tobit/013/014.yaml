base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/014.yaml
  text: Oh[a], blessed are those who love you; they will rejoice over your peace. Blessed are all who were grieved over your afflictions, because they will rejoice over you when they see all your glory; and my soul will rejoice forever.
translation:
  language: zh_hans
  text: 啊，爱你的人有福了！他们必因你的平安而欢喜。凡因你所受的苦难[a]而忧伤的人都有福了，因为他们看见你一切的荣耀时，就必因你而欢喜；我的心灵也必永远欢欣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦难”或译“鞭打”“灾祸”或“惩治”。希腊语 μάστιξ 本指鞭子或鞭打，也可比喻苦难的打击。
    reason: 说明原词的具体形象和语义范围，避免正文的概括译法掩盖其多义性。
lexical_decisions:
- source_word: μακάριοι
  choice: 有福了
  rationale: 保留祝福宣告的庄重宗教意味，并以现代汉语常见的经文表达呈现。
- source_word: οἱ ἀγαπῶντές σε
  choice: 爱你的人
  rationale: 自然表达名词化的现在分词，并保留持续关系的意味。
- source_word: χάρησονται / χαρήσονται
  choice: 必……欢喜
  rationale: 两处采用相同核心措辞，以显出原文同一动词的呼应；“必”体现将来语气。
- source_word: ἐπὶ τῇ εἰρήνῃ σου
  choice: 因你的平安而欢喜
  rationale: ἐπί加与格在此表示欢喜的缘由或所依，译法自然，也指向受称呼者恢复的安宁。
- source_word: ὅσοι ἐλυπήθησαν
  choice: 凡……而忧伤的人
  rationale: 表达不定关系词ὅσοι的周全范围及不定过去时被动形式所指的悲痛经历。
- source_word: μάστιξίν
  choice: 所受的苦难
  rationale: μάστιξ可指鞭打、灾祸或惩治；正文用较宽泛的“苦难”，既符合受苦语境，也避免擅自限定其性质。
- source_word: θεασάμενοι
  choice: 看见……时
  rationale: 将分词按语境译为时间关系，表明欢喜发生在目睹荣耀之际。
- source_word: πᾶσαν τὴν δόξαν σου
  choice: 你全部的荣耀
  rationale: 保留πᾶσαν的完整、周全之意及δόξα的荣耀含义。
- source_word: εὐφρανθήσεται
  choice: 必……欢欣
  rationale: 以“欢欣”区别于前面的χαίρω，同时保留强烈喜乐及将来语气。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 是现代汉语表达持久无尽时间的自然译法。
- source_word: ἡ ψυχή μου
  choice: 我的心灵
  rationale: 保留ψυχή所表达的内在自我和敬虔语域，同时比单译“我”更贴近原文意象。
theological_decisions:
- issue: 第二人称阴性单数代词的所指
  choice: 正文继续使用“你／你的”，由上下文指向人格化的耶路撒冷／锡安
  alternative: 在正文中直接写明“耶路撒冷”或泛指“上帝的子民”
  rationale: 上下文将耶路撒冷作为受称呼者，谈及她的平安、苦难和荣耀；不在本节增补专名，可保留原文直接称呼及其文学效果。
- issue: μάστιξ是否含有神圣惩治的明确神学判断
  choice: 正文译为中性的“苦难”，脚注列出更具体可能
  alternative: 译为“惩罚”“管教”或“灾祸”
  rationale: 该词本身涵盖鞭打及比喻性的痛苦打击；本节未明说施加者或目的，不宜在正文中把苦难明确解释为惩罚或管教。
translation_notes:
  register: 采用现代、庄重而易懂的颂歌语体。“啊”保留开头ὦ的感叹色彩；两句“有福了”维持祝福宣告的平行结构。“欢喜／欢欣”既呈现原文相关而不同的喜乐动词，也避免行文机械重复。
