base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/004.yaml
  text: There declare his greatness[a], and exalt him before every living being; for he is our Lord[c][b], and he is our God and our Father forever.
translation:
  language: zh_hans
  text: 你们要在那里宣扬他的伟大[a]，在一切活物面前[b]高举他；因为他永远是我们的主、我们的上帝、我们的父[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“显明他的威严”。希腊文动词可指“展示”或“使人知道”，名词也可译作“威严”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“在每一个活着的〔者〕面前”。措辞范围较广，不过按上下文，最自然是指所有活着的人。
    reason: lexical_alternative
  - marker: c
    text: 希腊文直译为“直到万世万代”。此表达强调无穷无尽的延续；此处修饰整组称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接保留地点副词，并承接上一节所述的列国及流亡处境，不额外限定具体地点。
- source_word: ὑποδείξατε
  choice: 彰显
  rationale: 该复数命令式可指“展示、指明、使人知道”；在公开颂赞的语境中，“彰显”既自然，也兼顾展示与宣告之意。
- source_word: τὴν μεγαλοσύνην αὐτοῦ
  choice: 他的伟大
  rationale: μεγαλοσύνη可指伟大、威严；“伟大”清楚宽泛，并保留神崇高卓绝的含义。
- source_word: ὑψοῦτε αὐτόν
  choice: 高举他
  rationale: 保留ὑψόω“举高”的意象，同时符合颂赞语境中尊崇上帝的现代汉语表达。
- source_word: ἐνώπιον παντὸς ζῶντος
  choice: 在一切活着的面前
  rationale: 尽量保留原文“在每一个活着的〔存在者〕面前”的宽泛措辞，不在正文中把所指径直限定为人。
- source_word: καθότι
  choice: 因为
  rationale: 自然明确地引出前述命令的理由。
- source_word: κύριος
  choice: 主
  rationale: 符合犹太希腊文敬称用法及本句的信仰告白语气。
- source_word: θεὸς
  choice: 上帝
  rationale: 采用现代标准汉语中清楚、庄重的常用对应词。
- source_word: πατὴρ ἡμῶν
  choice: 我们的父
  rationale: 保留原文的亲属称谓及其神学含义，不作解释性扩充。
- source_word: εἰς πάντας τοὺς αἰῶνας
  choice: 直到永远
  rationale: 以自然汉语表达“直到所有世代”的无尽延续含义。
theological_decisions:
- issue: “我们的主”“我们的上帝”“我们的父”三个称谓之间的关系
  choice: 将三个称谓都直接用于同一位上帝：“他是我们的主，是我们的上帝，也是我们的父”。
  alternative: “他是我们的主；他是上帝，是我们永远的父”或“他是我们的主和上帝，是我们的父”。
  rationale: 原文重复αὐτός，并累加κύριος、θεός、πατήρ等称谓。译文保留这种告白式累加，又用“也是”避免把“上帝”和“父”误读为两个不同对象。
- issue: “一切活着的”所指范围
  choice: 正文保留宽泛表达，并以脚注说明语境中主要指所有活人。
  alternative: 直接译作“在所有人面前”。
  rationale: ζῶντος本身没有明说“人”；不应在正文中消除其字面广度，但上下文确实以人类听众为主。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。以“彰显”“高举”维持赞歌体的力度；“一切活着的”略带源文痕迹，借脚注说明其语境所指，以保留原文的开放性。
