  text: And all her streets will say[a], ‘Hallelujah and praise!’ saying, ‘Blessed is God, who has exalted all the ages.’
translation:
  language: zh_hans
  text: 她的一切街巷都要高呼：“哈利路亚！颂赞！”说：“上帝是当受称颂的；他高举了万世[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“高举了所有的世代”，这种表达较为少见。也可按较顺畅的意思理解为“在万世中受尊崇”或“永远受尊崇”。
    reason: 保留原文罕见的及物表达，同时说明可能的惯用性理解，而不在正文中预先化解其张力。
lexical_decisions:
- source_word: ῥῦμαι
  choice: 街巷
  rationale: 该词指城中的街道或巷道；“街巷”自然涵盖其语义范围，也保留城市被拟人化、各处共同发声的意象。
- source_word: ἀλληλουιά
  choice: 哈利路亚
  rationale: 希腊文保留了希伯来礼仪用语的音译，因此中文也采用通行的礼仪音译，而不直接意译为“赞美主”。
- source_word: αἴνεσιν
  choice: 颂赞
  rationale: 该名词表示赞美；“颂赞”符合庄重的敬拜语域，并与“哈利路亚”并列为街巷所发出的欢呼。
- source_word: Εὐλογητός
  choice: 当受称颂的
  rationale: 用于对上帝的颂赞宣告时，这一译法既表达“可称颂、受赞美”，又避免把句子误作祈愿。
- source_word: ὕψωσεν
  choice: 高举了
  rationale: 保留及物动词“使升高、高举”的基本意义及完成性，不将其改写成被动或纯时间表达。
- source_word: πάντας τοὺς αἰῶνας
  choice: 万世
  rationale: αἰῶνες直指诸世代或诸时代；“万世”简洁而庄重，并保留“高举万世”这一原文中不寻常、具有张力的说法。
theological_decisions:
- issue: 末句“πάντας τοὺς αἰῶνας”的含义
  choice: 高举了万世
  alternative: 历世历代受尊崇；永远受尊崇
  rationale: 希腊文在语法和词汇层面直译为上帝“高举了所有的世代”。正文保留这一不寻常的及物结构，不擅自将其化解为上帝“永远受尊崇”；较顺畅的时间性理解列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语体。“她”承接被拟人化的城；两个简短感叹句保留原文欢呼式节奏。脚注标记置于相关的“万世”之后。
