- from: 她所有的街巷都要说：“哈利路亚！颂赞！”并说：“那高举了万世[a]的上帝是当受称颂的。”
  to: 她的一切街巷都要高呼：“哈利路亚！颂赞！”说：“上帝是当受称颂的；他高举了万世[a]。”
  rationale: 修订仅改善汉语句法和脚注表述：以“高呼……说”自然呈现原文的主要动词及其后续宣告；将末句拆为两个分句，以保留“上帝是当受称颂的”这一颂赞性断言和“他高举了万世”这一主动完成式。未将“高举了万世”改写为永恒受尊崇；该可能理解仍仅置于脚注。
