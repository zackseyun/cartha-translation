  source_fidelity: 译文总体准确保留了拟人化的城、街巷的发声、礼仪性“哈利路亚”、以及ὕψωσεν的主动完成式“高举了”。不过，“都要说……并说……”在现代汉语中重复生硬；改作“要高呼……说”能保留原文由主要动词和λέγοντες引出的第二层宣告。
  naturalness: “她所有的街巷”可理解，但“她的一切街巷”更自然、也更贴近πᾶσαι αἱ ῥῦμαι αὐτῆς。“上帝是当受称颂的；他高举了万世”在庄重现代汉语中比定语很长的“那高举了万世的上帝是当受称颂的”更顺畅，同时不改变断言性质。
  terminology: “街巷”“哈利路亚”“颂赞”“上帝”“当受称颂”均适切。“万世”可保留αἰῶνας的复数、时代性和原文的不寻常张力。脚注中的惯用性替代解释应明确为上帝“在万世中／永远受尊崇”，避免无介词的“历世历代受尊崇”造成轻微歧义。
