  yaml_path: translation/deuterocanon/tobit/013/013.yaml
  text: Rejoice and exult over the sons of the righteous[a], because they will be gathered together and will bless the Lord of the righteous.
translation:
  language: zh_hans
  text: 你要因义人的儿子们[a]而欢喜雀跃，因为他们必被聚集在一起，并称颂义人的主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“义人的儿女”。希腊文直译为“儿子们”，这里也可能泛指后代。
    reason: 说明原文阳性复数用语及其可能具有较广的后代含义。
lexical_decisions:
- source_word: χάρηθι
  choice: 欢喜
  rationale: 该命令式在此表达主动意义；“欢喜”自然直接，也保留经文庄重的劝勉语气。
- source_word: ἀγαλλίασαι
  choice: 雀跃
  rationale: 此词比一般的喜乐语气更强；与“欢喜”并列，可传达加深的欣喜与庆贺之意。
- source_word: ἐπὶ
  choice: 因
  rationale: ἐπί加与格在此表示喜乐所缘由的人或事；“因”符合现代汉语表达。
- source_word: τοῖς υἱοῖς τῶν δικαίων
  choice: 义人之子
  rationale: 保留υἱοί明确的阳性复数含义，同时采用简洁庄重的集合性表达；其可能泛指儿女或后代的含义留在脚注中。
- source_word: συναχθήσονται
  choice: 必聚集在一起
  rationale: 保留将来被动形式及共同聚集的含义；“必”体现此处将来陈述的确定语气，而不另行说明聚集者。
- source_word: εὐλογήσουσιν
  choice: 要称颂
  rationale: 在以人为主语、上帝为宾语的敬拜语境中，“称颂”比直译“祝福”更符合现代汉语，同时保留εὐλογέω的圣经语体。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此为指称上帝的尊称，译作“主”准确而符合中文圣经传统。
- source_word: τῶν δικαίων
  choice: 义人之
  rationale: 按最直接的属格关系译为“义人之主”，不将其改释为“公义的主”或“主，就是那义者”。
theological_decisions:
- issue: τοῖς υἱοῖς τῶν δικαίων中的性别与后代含义
  choice: 义人之子
  alternative: 义人的儿女；义人的后代
  rationale: 原文使用阳性复数υἱοί，应在正文保留“子”；但该词在群体性语境中可能广指儿女或后代，因此在脚注中说明。
- issue: τὸν κύριον τῶν δικαίων的属格关系
  choice: 义人之主
  alternative: 公义的主；主，就是那义者
  rationale: 原文最自然地把τῶν δικαίων理解为修饰“主”的复数属格，即与义人相关联的主。其他译法需改变句法理解，故不在正文中采用。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“欢喜雀跃”保留两个相邻命令式的递进力度；“义人之子”和“义人之主”略带经文语体，以忠实呈现原文重复的属格结构。
