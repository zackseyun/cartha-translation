  yaml_path: translation/deuterocanon/tobit/013/016.yaml
  text: For Jerusalem will be built with sapphire and emerald[a], and your walls with precious stones, and the towers and battlements with pure gold[c][b],
translation:
  language: zh_hans
  text: 因为耶路撒冷必用蓝宝石和绿宝石建成[a]；你的城墙[b]必用宝石建成；城楼和防御工事[c]必用纯金建成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“重建”。希腊文直说“建造”，但复兴的上下文可使人理解为重建。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在这里直接称呼耶路撒冷，说“你的城墙”。
    reason: cultural_note
  - marker: c
    text: “防御工事”所译的词指用于城防的设施，也可译作“堡垒”或“壁垒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθήσεται
  choice: 必……建造
  rationale: 这是 οἰκοδομέω 的将来时被动语态，直译为“将被建造”。汉语用“必……建造”既自然，也保留应许语气；上下文虽可指重建，希腊文本身却未明确表达“再、重”的意思。
- source_word: σαπφείρῳ καὶ σμαράγδῳ
  choice: 用蓝宝石和绿宝石
  rationale: 两个与格在这里表示建造所用的材料。“蓝宝石”和“绿宝石”是现代汉语中清楚、通行的宝石名称。
- source_word: λίθῳ ἐντίμῳ
  choice: 用宝石
  rationale: λίθος ἐντίμος 字面为“贵重的石头”，单数在此可作集合或材料用法；译作“宝石”自然简洁，也传达其珍贵性质。
- source_word: τὰ τείχη σου
  choice: 你的城墙
  rationale: σου 明确是第二人称所有格，诗歌在句中转为直接称呼耶路撒冷，因此保留“你的”，不改成“它的”。
- source_word: οἱ πύργοι
  choice: 城楼
  rationale: 在城墙语境中，πύργοι 指防御性的塔楼；“城楼”比泛称“塔”更贴合古城设防的图景。
- source_word: οἱ προμαχῶνες
  choice: 防御工事
  rationale: 该词指城防体系中的前沿防御设施或堡垒。“防御工事”覆盖原词范围，同时比生僻或过度具体的术语更易理解。
- source_word: χρυσίῳ καθαρῷ
  choice: 用纯金
  rationale: 与格表示材料，καθαρός 表示纯净、无杂质；“纯金”准确而自然地保留华美的建造意象。
theological_decisions:
- issue: 耶路撒冷未来荣耀的复兴意象
  choice: 保留以宝石和纯金建城的诗性图景，不判定其为字面建筑说明还是象征性描写。
  alternative: 明确译成末世圣城的字面建筑，或明确解释为恢复荣耀的象征。
  rationale: 希腊文陈述华美的建造景象，却没有在本节界定其字面或象征性质；译文应保留这种开放性。
- issue: 建造与重建
  choice: 正文译为“建造”，脚注说明复兴语境下也可理解为“重建”。
  alternative: 正文直接译为“重建”。
  rationale: 上下文可能指耶路撒冷复兴，但 οἰκοδομηθήσεται 本身没有明确的“重新”成分，因此不在正文中替原文消除这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用分号呈现原句并列结构，并在后两项补出汉语所需的“建造”；保留从第三人称提及耶路撒冷转为第二人称直接称呼的诗歌转换。
