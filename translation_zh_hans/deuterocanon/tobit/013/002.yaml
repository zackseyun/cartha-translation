base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/002.yaml
  text: For he afflicts and shows mercy; he brings down to Hades and brings up[a], and there is no one who will escape his hand.
translation:
  language: zh_hans
  text: 因为他责罚人，也怜悯人；他使人下到阴间，又把人带上来[a]；没有人能逃脱他的手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”也可译作“坟墓”或“死者的领域”。希腊文作“哈得斯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖ
  choice: 责罚人
  rationale: 该词本义为鞭打、鞭笞，在这里概括上帝使人受苦或施行管教、审判的作为。“责罚”保留其严厉性，同时避免把诗性陈述局限为实际的肉体鞭打。
- source_word: ἐλεᾷ
  choice: 怜悯人
  rationale: 表达施怜悯、怀慈悲，与前面的“责罚人”构成鲜明而自然的对举。
- source_word: κατάγει
  choice: 使人下到
  rationale: 保留向下带领的使役动作，并与ἀνάγει的“把人带上来”形成方向相反的平行结构。
- source_word: εἰς ᾅδην
  choice: 到阴间
  rationale: ᾅδης指死者所在之境。“阴间”是现代中文圣经语体中自然且较直接的对应，不把它缩减为实体坟墓，也不等同于最终刑罚之地。
- source_word: ἀνάγει
  choice: 把人带上来
  rationale: 与“使人下到”保持动作和方向上的对称；措辞不预先判定这是脱离死亡危险还是从死者之境复起。
- source_word: οὐκ ἔστιν ὃς ἐκφεύξεται
  choice: 没有人能逃脱
  rationale: 以自然现代汉语表达无人可以逃脱的断言；“能”清楚传达此处所强调的不可逃避性。
- source_word: τὴν χεῖρα αὐτοῦ
  choice: 他的手
  rationale: 保留原文具体的圣经意象，以“手”表达权能和掌管，而不直接改写为抽象的“权势”。
theological_decisions:
- issue: 下到阴间又被带上来的含义
  choice: 保留为上帝对死亡和死者之境拥有主权的一般陈述，不明确限定为复活教义
  alternative: 可理解为使人濒临死亡后恢复生命，或更明确地指从阴间复起
  rationale: “下到”与“带上来”的对举显明上帝掌管生死，但原文不足以迫使译者在脱离致命危险与更强的复起含义之间作出单一裁定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“责罚人，也怜悯人”保留诗句的神学张力；分号呈现三个紧密相连的平行分句。脚注标记[a]已置于相关短语之后。
