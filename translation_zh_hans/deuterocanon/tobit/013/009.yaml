base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/009.yaml
  text: 'Jerusalem[a], city of the Holy One: he will scourge you for the works of your children[b], and again he will show mercy to the children of the righteous.'
translation:
  language: zh_hans
  text: 耶路撒冷，圣者之城[a]！他必因你儿女[b]的行为鞭打你，又必怜悯义人的儿女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣者”也可较泛地理解为“一位圣洁者”；希腊语原文没有冠词，但按上下文，这里最可能指神。
    reason: lexical_alternative
  - marker: b
    text: 希腊语两处均为“儿子”；这里译作“儿女”，因为所指是集体性的。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱεροσόλυμα
  choice: 耶路撒冷
  rationale: 采用现代汉语中通行的地名译法。
- source_word: πόλις ἁγίου
  choice: 圣者之城
  rationale: πόλις意为“城”，ἁγίου是单数属格，最自然地表示“圣者的”；结合上下文，“圣者”最可能指神，同时保留原文没有冠词所带来的一定含混性。
- source_word: μαστιγώσει
  choice: 必……鞭打
  rationale: 保留动词本有的“以鞭责打”这一鲜明意象，也能表达比一般“惩罚”更强烈的管教和刑罚意味。
- source_word: ἐπὶ τὰ ἔργα
  choice: 因……的行为
  rationale: 此处ἐπί加宾格表示原因或依据；“因……的行为”符合现代汉语表达，并准确呈现因果关系。
- source_word: τῶν υἱῶν σου
  choice: 你儿女
  rationale: υἱοί字面为“儿子们”，但在把耶路撒冷人格化为母城的诗歌语境中，泛指其居民或子民，故译为“儿女”。
- source_word: πάλιν
  choice: 又
  rationale: 表示审判之后的转折与再次施怜悯；“又”简洁自然，并保留前后行动的承接。
- source_word: ἐλεήσει
  choice: 必怜悯
  rationale: 直接表达主动施予怜悯的含义，是ἐλεέω在此处自然且庄重的汉语对应。
- source_word: τοὺς υἱοὺς τῶν δικαίων
  choice: 义人的儿女
  rationale: 将δικαίων作为实词化复数译为“义人”，并把集体意义的υἱούς译作“儿女”，不将所指不必要地限制为男性。
theological_decisions:
- issue: “必鞭打”和“必怜悯”的隐含主语
  choice: 在正文中补出“他”，指前句“圣者”，即神。
  alternative: 不明说主语，或把耶路撒冷仅作为全句语法焦点。
  rationale: 希腊文两个将来时动词都没有明示主语，但上下文所说的审判与怜悯是神的行动，“圣者之城”也为此提供了直接线索。现代汉语补出“他”可避免语意断裂，同时不增加具体的宗派解释。
- issue: 阳性亲属词υἱοί的译法
  choice: 两处均按集体所指译为“儿女”。
  alternative: 直译为“儿子”或“众子”。
  rationale: 这里论及耶路撒冷的居民、子民以及义人的后裔，语义并不限于男性；“儿女”准确表达集体范围，同时在脚注中保留希腊文字面形式。
- issue: πόλις ἁγίου中ἁγίου的所指
  choice: 译为“圣者之城”，正文语境上指向神。
  alternative: 理解为泛称某位圣洁者，或把圣洁直接归于城而译作“圣城”。
  rationale: 属格结构首先表达城属于“圣者”，而不是直接称城为圣；上下文最可能以“圣者”指神，但脚注保留较泛理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌式经文语体。“圣者之城”保留属格结构；“鞭打”保留原文强烈意象；两个“必”体现将来行动的确定语气。
