  text: And the streets of Jerusalem will be paved with beryl and carbuncle and stones from Suphir[a].
translation:
  language: zh_hans
  text: 耶路撒冷的街道必用绿柱石、红色宝石和来自苏斐尔的石头铺成。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苏斐尔”也可作“俄斐”；若将希腊文Σουφείρ理解为地名“俄斐”，可译作“来自俄斐的石头”。
    reason: alternative_reading
lexical_decisions:
- source_word: πλατεῖαι
  choice: 街道
  rationale: 该词可指宽阔的街道或城市中的开阔处；此处描写城市的华美，以“街道”最自然，也不额外加入原文未必强调的“宽阔”。
- source_word: βηρύλλῳ
  choice: 绿柱石
  rationale: 这是宝石名称，通常对应绿柱石；保留具体石名，以呈现原文珠宝般的意象，同时不进一步限定其现代矿物品种。
- source_word: ἄνθρακι
  choice: 红玉石
  rationale: ἄνθραξ本义可指炭，但在宝石语境中指火红发亮的贵重石头，传统上称carbuncle；“红玉石”既符合建筑材料的华美语境，也避免误解为普通煤炭。
- source_word: λίθῳ ἐκ Σουφεὶρ
  choice: 来自苏斐尔的石头
  rationale: 按本希腊见证的地名形式Σουφείρ音译为“苏斐尔”，不在正文中直接改作较熟悉但并非字面相同的“俄斐”；“石头”在汉语中可自然表达材料类别。
- source_word: ψηφολογηθήσονται
  choice: 铺成
  rationale: 该动词与铺设小石、石子或镶嵌铺面有关；在城市建筑语境中，“铺成”清楚自然，并保留可指铺石或镶嵌的基本建筑含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“必……铺成”传达将来被动语气；宝石名称保持具体，但不对难以确定的古代矿物作过度精确的现代鉴定。
