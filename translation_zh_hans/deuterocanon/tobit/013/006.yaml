base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/006.yaml
  text: If you turn to him with all your heart and with all your soul[a], to do what is true before him, then he will turn to you and will certainly not hide his face from you. See what he will do with you, and give thanks to him with your whole being; bless the Lord of righteousness[d][c][b], and exalt the King of the ages.
translation:
  language: zh_hans
  text: '如果你们全心全意[a]归向他，在他面前行真实的事[b]，他就会转向你们，绝不会向你们掩面。你们要看看他会怎样待你们，并要以全身[c]感谢他；要称颂公义之主[d]，尊崇万世之王[e]。


    我在被掳之地感谢他，也向有罪的各族宣扬他的能力和伟大。罪人哪，你们要回转，在他面前行公义。谁知道他是否会喜爱你们[f]，怜悯你们呢？'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以你们全部的心和全部的魂”。
    reason: 保留原文由“心”和“魂”构成的完整委身表达。
  - marker: b
    text: 直译“在他面前行真实”；也可译作“在他面前忠信行事”。
    reason: ποιεῖν ἀλήθειαν 是带有闪语色彩的表达，可侧重真实正直，也可侧重忠信。
  - marker: c
    text: 或译“全人”。希腊文直译为“以你们整个身体”，在这里可能强调全身心、以整个生命感谢上帝。
    reason: 正文保留身体意象，脚注说明其整体性含义。
  - marker: d
    text: 或译“正义之主”。
    reason: δικαιοσύνη 可表示公义、正义或公正。
  - marker: e
    text: 或译“永恒之王”。
    reason: “万世之王”直译复数 αἰώνων；该称号也可用时间性质表达为“永恒之王”。
  - marker: f
    text: “喜爱你们”也可理解为“愿意接纳你们”或“眷顾你们”；希腊文直译近于“愿意要你们”。
    reason: θελήσει ὑμᾶς 的措辞简略而不寻常，应保留其语义开放性。
lexical_decisions:
- source_word: ἐὰν ἐπιστρέψητε ... τότε ἐπιστρέψει
  choice: 如果你们……归向他……他就会转向你们
  rationale: 以“归向／转向”保留同一动词所形成的人归向上帝、上帝转向人的呼应，同时使现代汉语自然。
- source_word: ἐν ὅλῃ καρδίᾳ ὑμῶν καὶ ἐν ὅλῃ τῇ ψυχῇ
  choice: 全心全意
  rationale: 这是表达完全委身的成语化组合；“全心全意”简洁自然，并在脚注保留“全心、全魂”的形式对应。
- source_word: ποιῆσαι ἐνώπιον αὐτοῦ ἀλήθειαν
  choice: 在他面前行真实的事
  rationale: 保留“行／做”与“真实”的罕见搭配及其闪语色彩，同时比直译“行真实”更符合现代汉语；“忠信行事”列作脚注备选。
- source_word: οὐ μὴ κρύψῃ τὸ πρόσωπον αὐτοῦ ἀφʼ ὑμῶν
  choice: 绝不会向你们掩面
  rationale: “绝不会”体现 οὐ μή 的强烈否定，“掩面”保留原文的圣经意象。
- source_word: θεάσασθε ἃ ποιήσει μεθʼ ὑμῶν
  choice: 你们要看看他会怎样待你们
  rationale: 将命令语气和 μεθʼ ὑμῶν 的关系性表达译成自然汉语，不预先限定其作为的具体性质。
- source_word: ἐξομολογήσασθε / ἐξομολογοῦμαι
  choice: 感谢
  rationale: 在颂赞语境中，该词指公开感谢或赞美，而非认罪；“感谢”最贴合上下文。
- source_word: ἐν ὅλῳ τῷ σώματι ὑμῶν
  choice: 全身
  rationale: 直接保留 σώμα“身体”的具体用词；脚注说明也可按整体性表达理解为“全人”。
- source_word: τὸν κύριον τῆς δικαιοσύνης
  choice: 公义之主
  rationale: δικαιοσύνη 在神圣称号中具有道德正直与公正的宽广含义；“公义”保持传统而不缩减为司法意义。
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: 万世之王
  rationale: 保留 αἰώνων 的复数和庄严的颂赞语体，且符合汉语圣经文体。
- source_word: ἐν τῇ γῇ τῆς αἰχμαλωσίας μου
  choice: 在被掳之地
  rationale: 简洁保留身处流徙、被掳境地的含义。
- source_word: ἔθνεσιν ἁμαρτωλῶν
  choice: 向有罪的各族
  rationale: 译出 ἔθνεσιν 的群体复数和 ἁμαρτωλῶν 的罪性描述，同时避免把短语不必要地限定为政治国家。
- source_word: ἐπιστρέψατε, ἁμαρτωλοί
  choice: 罪人哪，你们要回转
  rationale: 保留直接呼告和悔改性的“回转”含义，并与本节开头的 ἐπιστρέφω 呼应。
- source_word: τίς γινώσκει εἰ θελήσει ὑμᾶς
  choice: 谁知道他是否会喜爱你们
  rationale: θελήσει ὑμᾶς 字面为“愿意／要你们”，语境可能表示悦纳或眷顾；正文用“喜爱”保持关系性，脚注保留其他可能。
- source_word: ποιήσει ἐλεημοσύνην ὑμῖν
  choice: 怜悯你们
  rationale: 这是闪语式“向你们施行怜悯”；汉语以动词“怜悯”表达最自然。
theological_decisions:
- issue: δικαιοσύνη 用于上帝称号时的译法
  choice: 公义
  alternative: 正义／公正
  rationale: “公义”兼顾道德正直和施行公平的广度，不把称号局限于司法层面。
- issue: 人的回转与上帝转向之间的条件式表达
  choice: 保留“如果……就……”以及同源动词的呼应
  alternative: 将上帝的回应解释为赦免或复兴
  rationale: 原文明确采用条件句和重复的 ἐπιστρέφω，但没有具体说明上帝“转向”的全部内容，因此不作教义性补足。
- issue: θελήσει ὑμᾶς 所表达的上帝态度
  choice: 喜爱你们，并以脚注保留“愿意接纳／眷顾”
  alternative: 悦纳你们
  rationale: 原文措辞不寻常，既可指意愿，也可在语境中指恩待或悦纳；正文不将其固定为某一专门神学术语。
- issue: ἐλεημοσύνη 在此处的意义
  choice: 怜悯
  alternative: 施恩／施舍
  rationale: 对象是上帝对罪人的行动，因此这里应取“怜悯、慈悲”义，而非人向穷人施舍的意义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“掩面”“被掳”“公义之主”“万世之王”等保留经文的诗性和颂赞色彩；其余句法尽量自然。依据所给希腊原文完整译出本节，包括英语咨询层未收入的后半段。所有脚注标记均按正文出现顺序设置。
