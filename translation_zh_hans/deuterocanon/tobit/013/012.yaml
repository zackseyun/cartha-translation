  yaml_path: translation/deuterocanon/tobit/013/012.yaml
  text: All who hate you are accursed; all who love you will be blessed forever.
translation:
  language: zh_hans
  text: 凡恨你的，都受咒诅；凡爱你的，都必永远蒙福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικατάρατοι
  choice: 受咒诅
  rationale: 该词表示处于咒诅之下。“受咒诅”保留庄重、宣告性的力度，也比单说“被诅咒”更符合现代中文圣经语体。
- source_word: μισοῦντές
  choice: 恨你的
  rationale: 分词在此作名词性用法，指“那些恨你的人”；“恨”直接呈现其基本词义，并与后文“爱”形成鲜明对照。
- source_word: εὐλογημένοι
  choice: 蒙福
  rationale: 此处指领受祝福，而非仅仅受到称赞。“蒙福”自然表达被动含义，并保留其神学分量。
- source_word: ἀγαπῶντές
  choice: 爱你的
  rationale: 分词在此作名词性用法，指“那些爱你的人”；译作“爱”与前句的“恨”保持直接而对称的对照。
- source_word: ἔσονται
  choice: 都必……蒙福
  rationale: 希腊文明确使用将来时；“必”既体现将来指向，也保留宣告的确定语气。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该惯用语表达持续无尽的时间；“永远”是现代中文中清楚、自然且庄重的对应表达。
theological_decisions:
- issue: 对所称呼之城的爱与恨所对应的祝福和咒诅之力度
  choice: 直译为真实的“受咒诅”与“蒙福”，不弱化其盟约式宣告
  alternative: 弱化为受到非议或赞许等社会性评价
  rationale: 希腊文使用明确而强烈的咒诅与祝福用语；译文应保留这种神学分量，不将其化约为人的好恶或社会评价。
- issue: 两句在时态和句法上的不完全对称
  choice: 第一句按无系词的现状宣告译为“都受咒诅”，第二句按明确的将来时译为“都必永远蒙福”
  alternative: 为追求形式对称，把两句都译成现在时或都译成将来时
  rationale: 原文第一句为无系词的形容词断言，第二句则有明确的将来时ἔσονται；保留这一差异能更忠实地呈现原文，而不人为抹平张力。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“凡……的，都……”准确处理两个名词性分词，并保持诗句平衡；分号呈现两句鲜明的爱恨、咒福对照。代词“你”依上下文继续指受称呼的耶路撒冷/锡安，不在本节中擅自补明。
