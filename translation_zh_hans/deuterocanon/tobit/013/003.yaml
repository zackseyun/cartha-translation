base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/003.yaml
  text: Give thanks to him[a], O sons of Israel, before the nations, because he himself has scattered us among them.
translation:
  language: zh_hans
  text: 以色列的子孙啊，你们要在列国面前向他称谢[a]，因为正是他把我们分散在他们中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称谢”也可译作“承认”或“赞美”；希腊文动词可包含公开承认、感谢和颂赞等意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: 称谢
  rationale: 该动词在《七十士译本》的敬拜语境中可表达承认、称谢或赞美。此处是呼吁以色列人在列国面前公开宣告上帝的作为，“称谢”既自然，又保留感恩与颂赞的意味；脚注交代其语义幅度。
- source_word: αὐτῷ
  choice: 他
  rationale: 与动词搭配，指向上帝；汉语“称谢他”直接保留宾语关系。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列的子孙啊
  rationale: 保留希腊文“儿子、子孙”的男性复数表达及呼语语气，同时采用现代中文圣经语体中清楚而庄重的说法。
- source_word: ἐνώπιον τῶν ἐθνῶν
  choice: 在列国面前
  rationale: 准确体现“在……面前／当着……”的公开见证场景，并与下文“在他们中间”区分。
- source_word: ὅτι
  choice: 因为
  rationale: 按上下文理解为引出劝勉的原因，以现代汉语明确表达因果关系。
- source_word: αὐτὸς
  choice: 正是他
  rationale: 保留独立人称代词所带的强调，同时不增添“唯独”等排他含义。
- source_word: διέσπειρεν
  choice: 把……分散
  rationale: 表达上帝使以色列散居列国的行动；“分散”自然清楚，也保留原文明确归因于上帝的陈述。
- source_word: ἡμᾶς
  choice: 我们
  rationale: 直接保留第一人称复数宾语，使说话者与以色列群体的认同清楚。
- source_word: ἐν αὐτοῖς
  choice: 在他们中间
  rationale: 代词回指“列国”；对人群而言，“在他们中间”比直译“在他们里面”自然。
theological_decisions:
- issue: 如何表达以色列的分散是上帝的作为
  choice: 因为正是他把我们分散在他们中间
  alternative: 因为他把我们分散在列国中
  rationale: 希腊文明确把分散以色列的行动归于上帝，并用 αὐτός 加以强调。译文不淡化这一神学张力，也不补入惩罚、管教或拯救等原文未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国面前”保留公开宣告的场景；“正是他”传达原文强调；“以色列的子孙啊”保留呼语及原文性别表达。脚注标记已在正文中以[a]出现。
