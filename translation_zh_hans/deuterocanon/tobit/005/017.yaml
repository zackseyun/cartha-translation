  yaml_path: translation/deuterocanon/tobit/005/017.yaml
  text: They agreed to this[a]. Then he said to Tobiah, “Get ready for the journey, and may your journey be prosperous.” So his son prepared what was needed for the journey. Then his father said to him, “Go with the man, and may God, who dwells in heaven, make your journey prosper, and may his angel go with you.” So both went out to depart[b], and the boy’s dog went with them.
translation:
  language: zh_hans
  text: 他们同意这样做。于是他对多比雅说：“准备上路吧，愿你们一路顺利。”多比雅便预备了旅途所需的东西。他父亲对他说：“跟这个人去吧。愿那住在天上的上帝使你们一路顺利，也愿他的天使[a]与你们同行。”于是两人出去启程，那少年的狗也跟着他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天使”一词也可泛指“使者”；在《多比传》的叙事情境中，这里最可能指天上的使者。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐδόκησαν οὕτως
  choice: 他们同意这样做
  rationale: 在上下文中表示接受先前商定的安排；“同意这样做”既自然，也比单纯译作“感到满意”更符合叙事功能。
- source_word: Ἔτοιμος γίνου πρὸς τὴν ὁδόν
  choice: 准备上路吧
  rationale: 保留命令语气，并将“为道路作好准备”自然表达为现代汉语。
- source_word: εὐοδωθεῖητε
  choice: 愿你们一路顺利
  rationale: 这是表示愿望的祈愿式，且希腊文为复数；译文保留对旅途顺遂的祝愿。
- source_word: τὰ πρὸς τὴν ὁδόν
  choice: 路上所需的东西
  rationale: 该短语泛指旅行所需的物品或准备，不具体限定为食物或行李。
- source_word: ὁ ἐν τῷ οὐρανῷ οἰκῶν θεός
  choice: 那住在天上的上帝
  rationale: 贴近希腊文的修饰结构，同时保持庄重而清楚的表达。
- source_word: εὐοδώσει τὴν ὁδὸν ὑμῶν
  choice: 使你们一路顺利
  rationale: 按汉语习惯表达“使你们的道路亨通”，保留旅程蒙赐成功、顺遂的含义。
- source_word: ὁ ἄγγελος αὐτοῦ συμπορευθήτω ὑμῖν
  choice: 愿他的天使与你们同行
  rationale: 在《多比传》的叙事情境中，ἄγγελος指天上使者；“同行”准确传达共同上路之意。
- source_word: ἐξῆλθαν ἀμφότεροι ἀπελθεῖν
  choice: 于是两人出发上路
  rationale: 希腊文连用“出去”和“离去”，汉语合并表达以避免生硬重复，同时保留启程的叙事动作。
- source_word: ὁ κύων τοῦ παιδαρίου
  choice: 少年的狗
  rationale: παιδάριον在此指年轻的多比雅；“少年”比“男孩”更符合本段庄重叙事语体。
theological_decisions:
- issue: ἄγγελος的含义
  choice: 天使
  alternative: 使者
  rationale: ἄγγελος本身可泛指“使者”，但本书叙事明确以天上使者陪伴和引导为重要主题，因此正文译作“天使”，并以脚注保留词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“一路顺利”自然传达εὐοδόω所表达的旅途顺遂；依原文复数形式译作“你们”。避免逐字保留希腊文在“出去离去”上的重复。
