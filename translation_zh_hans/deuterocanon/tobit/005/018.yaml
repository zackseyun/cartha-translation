  yaml_path: translation/deuterocanon/tobit/005/018.yaml
  text: But Anna his mother wept and said to Tobit[a], “Why did you send our child away? Is he not the staff of our hand as he goes in and goes out before us?”
translation:
  language: zh_hans
  text: 他母亲亚拿却哭了，对托比特说：“你为什么把我们的孩子送走？他在我们面前出出进进，岂不就是我们手中的杖[a]吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或意译作“我们的倚靠”。正文保留希腊文“杖”的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔκλαυσεν
  choice: 哭了
  rationale: 不定过去时描写亚拿当时哭泣的动作；“哭了”自然简洁，也保留悲痛的情感。
- source_word: ἐξαπέστειλας
  choice: 送走
  rationale: 该复合动词有从自己身边打发出去、送行离开的意味；“送走”贴合母亲因孩子离家而哀伤的语境。
- source_word: τὸ παιδίον ἡμῶν
  choice: 我们的孩子
  rationale: παιδίον可指孩子或男孩；“我们的孩子”保留母亲亲昵的口吻，也不把词义限定为“儿子”。
- source_word: ῥάβδος τῆς χειρὸς ἡμῶν
  choice: 我们手中的杖
  rationale: 保留希腊文中“杖”的支撑性隐喻，同时用现代汉语自然可懂的领属表达；其引申义是倚靠、扶持。
- source_word: ἐν τῷ εἰσπορεύεσθαι αὐτὸν καὶ ἐκπορεύεσθαι
  choice: 他……出出进进
  rationale: 此结构表示惯常的进出活动；“出出进进”既保留重复节奏，也比机械直译“进去和出来”自然。
- source_word: ἐνώπιον ἡμῶν
  choice: 在我们面前
  rationale: 直接对应原文，表达孩子平日生活在父母眼前、陪伴他们。
