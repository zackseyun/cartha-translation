translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“那人”承接上下文中的男性对象，避免中文单说“他对他说”造成指代含混。问句分为两句，以符合现代汉语节奏，并忠实保留原文的两个询问。
