base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/005.yaml
  text: And he said to him[a], “Can I travel with you to Rages of Media[b], and are you familiar with the places?”
translation:
  language: zh_hans
  text: 他对那人说：“我能和你一起到米底亚的拉格斯去吗[a]？你熟悉那一带的地方吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“在米底亚的拉格斯”，但在这一出行语境中，很可能是指目的地，所以译作“到米底亚的拉格斯去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθῆναι μετὰ σοῦ
  choice: 和你一起……去
  rationale: πορεύομαι表示前往或旅行，μετὰ σοῦ表示陪同；合译为现代汉语自然的“和你一起……去”，既保留同行之意，也符合远行语境。
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: 到米底亚的拉格斯去
  rationale: ἐν通常表示“在”，但此处与移动动词连用，语境所指很可能是目的地；间接的闪语平行材料也支持这一理解。中文用“到……去”清楚表达目的地。
- source_word: Ῥάγοις
  choice: 拉格斯
  rationale: 按希腊语地名Ῥάγοις的词形音译；避免沿用英语传统拼法所带来的额外形式。
- source_word: ἔμπειρος
  choice: 熟悉
  rationale: ἔμπειρος表示对某事有经验、了解或熟知；在询问旅途向导是否了解当地的语境中，“熟悉”自然准确。
- source_word: τῶν τόπων
  choice: 那一带的地方
  rationale: τόποι为复数，字面是“地方”；中文补出“那一带”以明确所指为沿途或当地各处，同时保留复数范围感。
