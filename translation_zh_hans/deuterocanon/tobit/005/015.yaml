  yaml_path: translation/deuterocanon/tobit/005/015.yaml
  text: But tell me, what wages shall I give you? A drachma a day, and your necessities, as for my own son?
translation:
  language: zh_hans
  text: 但请告诉我，我该给你多少工钱？每天一德拉克马，并供给你所需的一切，像供给我儿子一样？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可理解为陈述所提的待遇：“每天一德拉克马，并供给你所需的一切，像供给我儿子一样。”希腊文在此没有明示第二句究竟是继续询问，还是提出具体条件。
    reason: 保留原文在标点和语气上的歧义
lexical_decisions:
- source_word: τίνα σοὶ ἔσομαι μισθὸν διδόναι
  choice: 我该给你多少工钱
  rationale: 以现代汉语自然表达“应当给付何种报酬”的直接问句；“工钱”准确体现 μισθός 在受雇服务语境中的含义。
- source_word: δραχμὴν τῆς ἡμέρας
  choice: 每天一德拉克马
  rationale: 保留古代币名，并把属格所表达的按日计酬关系清楚译出。
- source_word: τὰ δέοντά σοι
  choice: 供给你所需的一切
  rationale: 表达旅途中所需的供给或开销，同时不把希腊文具体化为某一种物资。
- source_word: ὡς καὶ τῷ υἱῷ μου
  choice: 像供给我儿子一样
  rationale: 保留比较关系，表明多比特会照顾受雇者的需要，如同照顾自己的儿子。
