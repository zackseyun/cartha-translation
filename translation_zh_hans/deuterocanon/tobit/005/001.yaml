  text: And Tobiah answered him[a], “Father, I will do everything that you have commanded me.”
translation:
  language: zh_hans
  text: 多比亚回答他[a]，说：“父亲，你吩咐我的一切，我都会照办。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行的闪语形式旁证明确作：“多比亚回答他的父亲……父亲，你吩咐我的一切，我都会照办。”希腊文主要见证则较简略，只说“回答他”，并用呼语“父亲”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 回答……说
  rationale: 这是叙事中引出直接引语的常用分词结构；汉语用“回答……说”自然地保留其应答功能。
- source_word: Τωβίας
  choice: 多比亚
  rationale: 采用现代中文圣经人名的常见音译，并与其父多比的名字有所区分。
- source_word: αὐτῷ
  choice: 他
  rationale: 希腊文仅用代词，没有明说“他的父亲”；正文保留这一表达，而下文呼语“父亲”已使所指清楚。
- source_word: Πάτερ
  choice: 父亲
  rationale: 直接对应希腊文呼格，保持庄重而自然；不把旁证中的“我的”加入以希腊文为锚点的正文。
- source_word: ποιήσω
  choice: 我都会照办
  rationale: 未来时在这里表达履行吩咐的意愿；“照办”比生硬的“做”更符合现代汉语语境。
- source_word: πάντα ὅσα
  choice: 一切
  rationale: 该组合表示毫无遗漏的全部内容；“你吩咐我的一切”简洁自然。
- source_word: ἐντέταλσαί μοι
  choice: 你吩咐我的
  rationale: “吩咐”准确表达家庭语境中的命令或嘱咐；这一结构也自然体现已作出的吩咐对当前行动仍然有效。
