  yaml_path: translation/deuterocanon/tobit/005/013.yaml
  text: to learn your family line and your name. But he said[a], “I am Azarias, son of the great Ananias, of your brothers.”
translation:
  language: zh_hans
  text: 以便知道你的家世和名字。他回答说：“我是亚撒利雅，是伟大的亚拿尼亚[a]的儿子，也是你弟兄中的一员[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伟大的”直译希腊文；这称呼也可能具有尊称意味，或用于区别同名人物。
    reason: 保留 τοῦ μεγάλου 的字面称誉义及其可能的身份区别功能，不将其武断限定为年龄或正式头衔。
  - marker: b
    text: “弟兄”在这里可能泛指亲属或同族人，不一定指亲兄弟。
    reason: 说明 ἀδελφῶν 在此家族与群体语境中可有较广的亲属含义。
lexical_decisions:
- source_word: ἐπιγνῶναι
  choice: 好知道
  rationale: 不定式承接上文所表达的目的，指取得并确认对方的身份资料；“好知道”在现代汉语中自然地保留这一目的关系。
- source_word: γένος
  choice: 家世
  rationale: 此处指家族出身或血统，而非抽象的“种类”或现代意义上的“种族”；“家世”简洁地表达谱系背景。
- source_word: ὄνομα
  choice: 名字
  rationale: 按其通常的身份识别含义直译。
- source_word: Ἐγὼ Ἀζαρίας
  choice: 我是亚撒利雅
  rationale: 采用现代中文圣经语境中较易辨认的希腊式人名音译，并保留自我介绍的直接语气。
- source_word: Ἀνανίου
  choice: 亚拿尼亚的儿子
  rationale: 希腊语属格在此构成父名表达；汉语自然地补出“儿子”，不改变其身份识别功能。
- source_word: τοῦ μεγάλου
  choice: 大亚拿尼亚
  rationale: 保留 μέγας 的字面“伟大／大”含义，同时避免未经文本充分支持便限定为“年长者”或某种正式头衔。因中文表达仍有解释空间，附注说明。
- source_word: τῶν ἀδελφῶν σου
  choice: 你弟兄中的一员
  rationale: 属格复数在此说明亚拿尼亚属于对方的弟兄群体；汉语补出“中的一员”以使句法完整，同时保留“弟兄”这一原文亲属称谓。
theological_decisions:
- issue: ἀδελφῶν 是否专指亲兄弟
  choice: 弟兄
  alternative: 族人；亲属；同胞
  rationale: 上下文涉及家世，因此该词可能泛指同族或亲属，并不必然指同父母的兄弟。正文保留原词的男性亲属意象，脚注提示其较广的亲族含义，避免把范围定死。
- issue: τοῦ μεγάλου 的称誉或年龄含义
  choice: 大亚拿尼亚
  alternative: 伟大的亚拿尼亚；年长的亚拿尼亚；显赫的亚拿尼亚
  rationale: 原文只用 μέγας，既可能是称誉，也可能用于区别人物；正文采取较形式对应的表达，脚注保留其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文是承接上文的句子片段，因此开头保留“好知道”的目的结构；人名采用读者较易识别的中文圣经式音译。
