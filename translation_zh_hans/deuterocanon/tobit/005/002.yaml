  yaml_path: translation/deuterocanon/tobit/005/002.yaml
  text: But how will I be able to get the money[b][a], since I do not know him?
translation:
  language: zh_hans
  text: 可是，我不认识他，又怎么能取回那笔钱[a]呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“那银子”；这里指交给人保管的钱，因此译作“那笔钱”。
    reason: lexical_alternative
  - marker: b
    text: 平行的闪语传统把意思说得更完整：“我怎么能从加拜耳手中取回那笔钱呢？他不认识我，我也不认识他……”明确指出双方彼此不认识。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: 可是
  rationale: 引出对前文吩咐的实际疑问；“可是”自然地保留转折语气。
- source_word: πῶς δυνησομαι
  choice: 又怎么能
  rationale: δύναμαι的将来时表达将来能否办到；汉语反问式“又怎么能”既自然，也保留对能力的质疑。
- source_word: λαβεῖν
  choice: 取回
  rationale: 本义可指“拿、领取、收取”；按上下文，这笔钱先前交由他人保管，如今要领回，因此“取回”最准确。
- source_word: τὸ ἀργύριον
  choice: 那笔钱
  rationale: ἀργύριον既可指“银子”，也可指“钱财”；此处指寄存的款项，用“那笔钱”清楚而自然。
- source_word: καὶ οὐ γινώσκω αὐτόν
  choice: 我不认识他
  rationale: καί形式上是“并且”，在此说明无法取钱的缘由。为符合现代汉语，将原因置于反问之前，同时保留“不认识他”的基本含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语自然的叙事语言。“我不认识他，又怎么能……”符合汉语表达习惯；虽调整了希腊语分句顺序，却保留了原文的转折、实际困难和反问语气。
