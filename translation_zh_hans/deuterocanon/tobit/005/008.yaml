lexical_decisions:
- source_word: Πορεύου
  choice: 去吧
  rationale: πορεύομαι的不定过去时命令式在这里是简明的出发命令。“去吧”自然、庄重，并保持原文的简洁。
- source_word: μὴ χρονίσῃς
  choice: 不要耽搁
  rationale: χρονίζω可指拖延、迟延或逗留过久。“不要耽搁”准确表达禁止延误的意思，且符合现代汉语习惯。
- source_word: καὶ
  choice: （不单独译出）
  rationale: 句首καὶ承接前文；现代汉语叙事中若直译为“并且”会显得生硬，因此通过句序自然体现其连接作用。命令之间的καὶ则以逗号连接，保留并列关系。
- source_word: εἶπεν αὐτῷ
  choice: 他对他说
  rationale: 按希腊文保留标准叙事表达及代词所具有的语境依赖性，不擅自补明人物身份。
