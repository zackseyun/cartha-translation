  text: And Tobit said to her[a], “Do not worry, sister; he will return safe and sound, and your eyes will see him.”
translation:
  language: zh_hans
  text: 托比特对她说：“别担心，姊妹[a]；他必平安归来，你的眼睛必看见他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “姊妹”是希腊文的字面称呼。这里托比特是在对妻子说话；这个词是亲属式或配偶间的称呼，并非指二人有生物学意义上的兄妹关系。
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ λόγον ἔχε
  choice: 别担心
  rationale: 该表达字面涉及“有话／有事”，在语境中是对忧虑者的安慰；“别担心”符合现代汉语习惯，又不过度释义。
- source_word: ἀδελφή
  choice: 姊妹
  rationale: 希腊文直译为“姊妹”，这里是托比特对妻子的亲属式或配偶间称呼；正文保留原文称谓，并用脚注说明，以免改写成解释性的“妻子”。
- source_word: ὑγιαίνων
  choice: 平安
  rationale: 该分词表示健康、安好；在旅途归来的语境中，“平安归来”自然表达安然无恙的含义。
- source_word: ἐλεύσεται
  choice: 归来
  rationale: 动词本义是“来”，但此处所说的人正在离家旅行，方向意义自然是返回家中，故译为“归来”。
- source_word: οἱ ὀφθαλμοί σου ὄψονται αὐτόν
  choice: 你的眼睛必看见他
  rationale: 保留原文明确提到“你的眼睛”的形象表达和安慰力度，在现代汉语中也清楚可懂。
