  yaml_path: translation/deuterocanon/tobit/005/010.yaml
  text: And he called him[a], and he went in, and they greeted one another.
translation:
  language: zh_hans
  text: 他就叫了那人[a]；那人进来，两人彼此问候。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文本很简短：“他就叫了那人；那人进来，两人彼此问候。”《多俾亚传》的闪语形式文本传统在这段叙事中保存了较完整的对话，但正文依照本译本所采用的现存希腊文本。
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: 叫了
  rationale: καλέω在此指叫人过来；“叫了”自然简洁，也不带“召见”的正式或强制意味。
- source_word: αὐτόν
  choice: 那人
  rationale: 希腊文是阳性单数宾语代词。中文若直译为“他”，会与主语形成指代混淆，因此按上下文译作“那人”，但不进一步点明身份。
- source_word: εἰσῆλθεν
  choice: 进来
  rationale: εἰσέρχομαι表示进入；在叫人进入的叙事场景中，“进来”比“进入”更自然。
- source_word: ἠσπάσαντο
  choice: 问候
  rationale: ἀσπάζομαι通常表示问候或致意；“问候”不额外加入拥抱等希腊文未明确说明的身体动作。
- source_word: ἀλλήλους
  choice: 彼此
  rationale: 互指代词在现代汉语中自然译为“彼此”；配合“两人”可清楚表达相互问候。
