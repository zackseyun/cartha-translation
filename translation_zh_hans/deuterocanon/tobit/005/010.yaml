  source_fidelity: 译文准确对应希腊文三个连续动作：ἐκάλεσεν αὐτόν译为“叫了那人”，εἰσῆλθεν译为“进来”，ἠσπάσαντο ἀλλήλους译为“两人彼此问候”。“那人”是为避免汉语中连续“他”造成指代混淆而作的适度显明化，未添加人物身份或额外情节；“就”在叙事连接中可接受，不改变原文意义。
