  text: And I will add more to your wages[a], if you return in good health.
translation:
  language: zh_hans
  text: 如果你们健康地回来，我还要在工钱之外多给你一些。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“如果你们健康地回来”。“健康”特别指身体健康；在旅途语境中也含有安然无恙的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι προσθήσω
  choice: 还要……多给……一些
  rationale: ἔτι与未来时 προσθήσω 合用，表示在已经议定的报酬之外再增加；这样表达既保留“追加”的意思，也符合现代汉语习惯。
- source_word: σοι ἐπὶ τὸν μισθόν
  choice: 在工钱之外多给你
  rationale: σοι指受款者“你”，ἐπὶ τὸν μισθόν表示加在原定报酬之上；“工钱”切合雇用旅伴的语境。
- source_word: ἐὰν
  choice: 如果
  rationale: 如实表达条件关系，不把条件强化为保证或要求。
- source_word: ὑγιαίνοντες
  choice: 平安健康地
  rationale: 该分词本义是处于健康、完好的状态；正文以“平安健康”传达旅途中身体无恙的语境，但脚注说明其直译，避免将其单纯解释为一般性的安全。
- source_word: ἐπιστρέψητε
  choice: 你们……回来
  rationale: 在旅行语境中表示返回；动词为第二人称复数，因此译作“你们”。
