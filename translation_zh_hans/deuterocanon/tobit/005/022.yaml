  text: For a good angel will go with him, and his journey will be successful, and he will return in good health.
translation:
  language: zh_hans
  text: 因为一位良善的天使必与他同行；他的旅程必顺利，他也必健康归来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: 天使
  rationale: 结合《多俾亚传》的叙事语境，此处所指是天上的使者，而非普通的人间信使；“天使”准确且自然。
- source_word: ἀγαθὸς
  choice: 良善的
  rationale: 直接修饰天使，表达其良善的性质或有益的作用；“良善”保留原文的简洁，也符合庄重语体。
- source_word: συνπορεύσεται
  choice: 与他同行
  rationale: 该复合动词表示与某人一同前行；“与他同行”既保留行旅意象，又是自然的现代汉语。
- source_word: εὐοδωθήσεται
  choice: 必顺利
  rationale: 此处指旅程进展顺遂、获得良好结果；“顺利”比“成功”更贴合汉语对旅途的通常表达。
- source_word: ἡ ὁδὸς αὐτοῦ
  choice: 他的旅程
  rationale: 字面为“他的道路”，但在出行语境中指整个行程；译作“旅程”清楚而不失原意。
- source_word: ὑποστρέψει
  choice: 必……归来
  rationale: 动词表示返回；“归来”简洁、庄重，并明确回到出发之处的含义。
- source_word: ὑγιαίνων
  choice: 健康
  rationale: 现在分词表示处于健康、安好的状态；“健康归来”保留身体康健的重点，不扩大为泛指安全无恙。
theological_decisions:
- issue: ἄγγελος在本节中的性质
  choice: 天上的天使
  alternative: 泛指使者
  rationale: 在本书叙事中，与多俾亚同行者实际具有天使身份；译作“天使”反映该词在此处最可能的所指，同时不增添更多教义性说明。
- issue: 关于旅程顺利的表达方式
  choice: 以确定语气译作“必顺利”
  alternative: 弱化为愿望或可能性，如“愿旅程顺利”或“旅程或会顺利”
  rationale: 希腊文使用将来时陈述，语气是确信的预告，并非祈愿或可能性判断。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“因为”承接上文理由；两个“必”传达希腊文将来时的确定陈述。分号使三项预告层次清楚，同时保持单节经文的流畅。
