revisions:
- from: 他对他说：“弟兄，愿你平安归来。[a]不要因我想查明你的支派和宗族而生我的气。原来你也是我的弟兄，出身于优良正直的家系。我从前认识大示每的儿子亚拿尼雅和雅探；我们曾一同前往耶路撒冷敬拜，带上头生的和出产的十分之一。他们没有随我们弟兄们一同陷入迷误。[b]弟兄，你出自好根。”
  to: 他对他说：“弟兄，愿你平安来到。[a]不要因我想查明你的支派和宗族而向我生气。你正是我的弟兄，出身于美好而良善的家系。因为我从前认识大示每的儿子亚拿尼雅和雅探；我们曾一同前往耶路撒冷敬拜，带着头生之物和出产的十分之一；他们没有在我们弟兄们的迷误中迷失。[b]弟兄，你是出于美好之根。”
  rationale: 修正“归来”所增添的方向意义，并重译有关“迷误”的分句，以恢复原文所表达的：亚拿尼雅和雅探没有落入其同族人的迷误。其余修改旨在使家系褒义、头生献纳物和“根”的谱系比喻更贴近希腊文且更自然。
