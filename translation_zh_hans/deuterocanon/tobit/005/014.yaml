  yaml_path: translation/deuterocanon/tobit/005/014.yaml
  text: And he said to him[a], “May you come in health, brother; and do not be angry with me because I sought to learn your tribe and your family. And you indeed turn out to be my brother, from a good and noble lineage. For I knew Ananias and Jathan, the sons of Shemaiah the great, as we used to go together to Jerusalem to worship, bringing the firstborn and the tithes of the produce; and they were not led astray in the error of our brothers. You are from a good root[b], brother.”
translation:
  language: zh_hans
  text: 他对他说：“弟兄，愿你平安来到。[a]不要因我想查明你的支派和宗族而向我生气。你正是我的弟兄，出身于美好而良善的家系。因为我从前认识大示每的儿子亚拿尼雅和雅探；我们曾一同前往耶路撒冷敬拜，带着头生之物和出产的十分之一；他们没有在我们弟兄们的迷误中迷失。[b]弟兄，你是出于美好之根。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“愿你健康地来”，是祝愿对方安康无恙的话；也可理解为“愿你一路平安”。
    reason: 说明惯用祝愿语及方向表达的可能理解。
  - marker: b
    text: 这里的“弟兄们”可泛指同族的以色列人，不一定只是男性亲兄弟。
    reason: 澄清亲族词在群体语境中的较广含义。
lexical_decisions:
- source_word: Ὑγιαίνων ἔλθοις
  choice: 愿你平安归来
  rationale: 保留ἔλθοις“愿你来/归来”的方向和祝愿语气；“平安”自然表达ὑγιαίνων所指的安康无恙。
- source_word: φυλήν
  choice: 支派
  rationale: 在以色列谱系语境中，φυλή指支派归属；“支派”准确保留其社会与宗教身份含义。
- source_word: πατριάν
  choice: 宗族
  rationale: πατριά指父系家族或祖族；“宗族”比一般的“家庭”更能体现谱系范围。
- source_word: τυγχάνεις ἀδελφός μου
  choice: 原来你也是我的弟兄
  rationale: “原来”表达τυγχάνεις在查明之后所得出的发现；“弟兄”保留ἀδελφός的亲族性和亲切语气。
- source_word: ἐκ τῆς καλῆς καὶ ἀγαθῆς γενεᾶς
  choice: 出身于优良正直的家系
  rationale: γενεά在此指血统家系；καλή与ἀγαθή并列，分别用“优良”和“正直”表达其正面品格而不合并。
- source_word: Σεμείου τοῦ μεγάλου
  choice: 大示每
  rationale: 保留τοῦ μεγάλου的称号性表达；“大示每”简洁对应“伟大的/大示每”，不擅自解释其具体所指。
- source_word: κοινῶς
  choice: 一同
  rationale: 自然表达共同结伴前往的含义。
- source_word: προσκυνεῖν
  choice: 敬拜
  rationale: 前往耶路撒冷的朝圣语境表明此词指宗教敬拜。
- source_word: τὰ πρωτότοκα
  choice: 头生的
  rationale: 保留原文未明确补出牲畜或祭物的概括表达，也符合献纳语境。
- source_word: τὰς δεκάτας τῶν γενημάτων
  choice: 出产的十分之一
  rationale: 准确表达农业出产及其十分之一份额；比音译式宗教术语更易为普通读者理解。
- source_word: οὐκ ἐπλανήθησαν ἐν τῇ πλάνῃ
  choice: 没有……陷入迷误
  rationale: 保留动词与同源名词构成的强调，同时以自然中文避免生硬重复。
- source_word: ἐκ ῥίζης καλῆς
  choice: 出自好根
  rationale: 保留原文“根”的谱系隐喻，不将其完全释义为“好家庭”。
theological_decisions:
- issue: 亲族与谱系语言
  choice: 保留“弟兄、支派、宗族、家系、根”等具体谱系词语
  alternative: 统一意译为“族人、家族、良好家庭”
  rationale: 经文把身份、祖源与敬拜忠诚联系起来；保留多层次亲族词汇可显明其以色列群体语境，而不把它泛化为普通社交关系。
- issue: “我们弟兄们”的所指
  choice: 正文直译为“我们弟兄们”，脚注说明可泛指同族以色列人
  alternative: 正文直接译为“我们的同族人”
  rationale: ἀδελφῶν保有亲族修辞和群体张力；脚注可防止现代读者误解为仅指男性亲兄弟。
- issue: “迷误”的性质
  choice: 保留概括性的“迷误”
  alternative: 具体解释为背教、偶像崇拜或某一历史宗派的错误
  rationale: 原文没有在本句明确界定πλάνη的具体内容，故不以教派性或历史性解释消除其开放性。
translation_notes:
  register: 采用庄重而现代的叙事口吻。谱系与礼仪词汇使用“支派、宗族、头生的、十分之一”等普通读者能够理解且具经文质感的表达；姓名按常见圣经汉译音形处理。
