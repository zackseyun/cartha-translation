  naturalness: “不要拿银钱跟银钱计较”可懂，但重复的“银钱”在现代汉语中略显生硬；“不要为银钱斤斤计较”更自然，也不缩窄原文的习语含义。将后半句明确为“与我们孩子相比毫无价值的废物”，汉语顺畅并能重现其强烈贬抑。
  terminology: “银钱”适当保留ἀργύριον的“银／钱财”双关范围；“废物”可表达περίψημα的“渣滓、弃物”意象。原脚注把περίψημα释作“擦除物（或：污秽）”不够准确、也不自然，宜改为“擦拭下来的污物、渣滓／弃物”。
