  yaml_path: translation/deuterocanon/tobit/005/019.yaml
  text: Do not value silver against silver[a], but let it become refuse for our child.
translation:
  language: zh_hans
  text: 不要为银钱斤斤计较[a]，宁可把它看作与我们孩子相比毫无价值的废物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近似：“不要让银钱赶在银钱前面，却愿它成为我们孩子的渣滓。”其中“赶在……前面”和“我们孩子的渣滓”都是压缩而难解的表达；后者的“渣滓”原指擦拭或刮除下来的污物、弃物。全句大意是：与孩子相比，钱财不值得计较，应视为毫无价值。
    reason: 说明φθάσαι与περίψημα的字面意象及全句的习语性质，同时保留原文简略属格关系所带来的不确定性。
lexical_decisions:
- source_word: ἀργύριον / τῷ ἀργυρίῳ
  choice: 银钱跟银钱
  rationale: ἀργύριον本指“银”，也可指钱财。这里重复使用，形成简短而难解的习语；译作“银钱跟银钱”既保留具体意象和重复，也让现代读者明白所指是钱财。
- source_word: μὴ φθάσαι
  choice: 不要……计较
  rationale: φθάνω通常有“先到、赶在前面”之意，但在此压缩结构中不宜机械直译。“计较”传达不要让钱财得失成为首要考量，同时以脚注保留字面形式及其不确定性。
- source_word: ἀλλά
  choice: 宁可
  rationale: 此处不只是一般转折，也引出与前句相反的取舍；“宁可”自然地表达这种价值上的转向。
- source_word: περίψημα
  choice: 废物
  rationale: 该词指擦除物、污秽或被丢弃之物。“废物”在现代汉语中清楚有力，保留钱财相较于孩子而被贬为毫无价值之物的语气。
- source_word: τοῦ παιδίου ἡμῶν
  choice: 为了我们的孩子
  rationale: 属格关系简略，可能表示“属于、关乎或为了我们的孩子”。正文采用自然且符合语境的目的性表达，同时不加入“安全”或“性命”等原文未明说的内容。
- source_word: γένοιτο
  choice: 让它……成为
  rationale: 不定过去时愿望式表达愿望或决然的取舍；“让它成为”保留其动词意义和劝愿语气。
theological_decisions:
- issue: 钱财与孩子之间相对价值的压缩习语
  choice: 将此句表达为：不要计较钱财，为了孩子宁可让钱财成为废物。
  alternative: 不要让银子赶在银子前面，却愿它成为我们孩子的污秽。
  rationale: 希腊文的表达简略且带习语性，并非明确的教义争议。译文传达钱财相较于孩子微不足道这一核心意思，但不擅自补入孩子的“安全”“性命”或具体经济行为；脚注则保留字面结构的陌生感与解释空间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“银钱”较“银子”更能同时涵盖贵金属和钱财；“跟……计较”口吻自然但不轻佻。“宁可”体现说话者强烈的价值取舍。脚注标记[a]已在正文中出现。
