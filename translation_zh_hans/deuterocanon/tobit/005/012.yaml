    reason: lexical_alternative
  - marker: c
    text: 本节所据希腊文本的转录资料有轻微不一致，但整体文意清楚。
    reason: textual_variant
lexical_decisions:
- source_word: Φυλὴν
  choice: 支派
  rationale: φυλή指以血缘和共同祖先相联的较大群体；“支派”符合圣经时代的社会语境，也能与下文“家族”形成层级上的搭配。
- source_word: πατριὰν
  choice: 家族
  rationale: πατριά指家系、宗族或出身家族；现代汉语“家族”自然易懂，并保留其谱系身份含义。
- source_word: μίσθιον
  choice: 一个受雇……的人
  rationale: μίσθιος指领报酬受雇的人；此译法中性、自然，不加入“雇工”有时可能带出的固定职业意味。
- source_word: συμπορεύσεται
  choice: 陪……同行
  rationale: 该动词意为与某人一同上路；“陪……同行”既表达共同旅行，也切合受雇护送的上下文。
- source_word: Βούλομαι
  choice: 我想知道
  rationale: 希腊文本直译仅为“我想／我愿意”，宾语省略；根据前一句问话补出“知道”，使现代汉语完整，同时以脚注说明原文的省略。
- source_word: ἀδελφέ
  choice: 弟兄
  rationale: 字面义为“兄弟”，在此作礼貌称呼。“弟兄”保留原有亲属称谓色彩，而不直接改释为“朋友”。
