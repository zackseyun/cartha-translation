revisions:
- from: 他就去找一个人，找到了拉斐尔。拉斐尔原是天使，他却不知道。
  to: 他去找一个人，找到了拉斐尔；拉斐尔是一位天使，但多比亚并不知道。
  rationale: 修订只消除中文代词歧义，并以更中性的“是一位天使”对应ἦν ἄγγελος；行动、身份揭示及多比亚不知情的原文信息均予保留，未增添解释性内容。
