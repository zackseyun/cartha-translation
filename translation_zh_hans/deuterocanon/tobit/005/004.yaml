base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/004.yaml
  text: And he went to look for a man[a], and he found Raphael, who was an angel, but he did not know it.
translation:
  language: zh_hans
  text: 他去找一个人，找到了拉斐尔；拉斐尔是一位天使，但多比亚并不知道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: 他就去
  rationale: πορεύομαι在叙事中表示“去、前往”；“就”自然承接上文行动，但不增添新的因果含义。
- source_word: ζητῆσαι ἄνθρωπον
  choice: 找一个人
  rationale: 目的不定式ζητῆσαι表示“寻找”，ἄνθρωπον是不定的单数“人”；这里不把它误释为“使者”。
- source_word: εὗρεν Ῥαφαήλ
  choice: 找到了拉斐尔
  rationale: εὗρεν直接表示“找到”；Ῥαφαήλ按现代普通话常见形式音译为“拉斐尔”。
- source_word: ὃς ἦν ἄγγελος
  choice: 拉斐尔原是天使
  rationale: 关系代词ὃς指拉斐尔；ἄγγελος在本书情境中指天上的使者，因此译为“天使”。“原是”体现叙述者揭示其真实身份，而非身份后来发生改变。
- source_word: οὐκ ᾔδει
  choice: 他却不知道
  rationale: 希腊文省略了所不知道之事的宾语，语境明确指拉斐尔的天使身份；中文保留这种省略也自然。“却”呈现叙述者所知与人物所不知之间的反差。
theological_decisions:
- issue: 拉斐尔作为ἄγγελος的身份
  choice: 正文译作“天使”
  alternative: 使者
  rationale: ἄγγελος本可泛指“使者”，但本书叙事明确把拉斐尔描写为天上的存在；译作“天使”符合本节的上下文，同时保留人物尚不知情的戏剧张力。
- issue: 人物对拉斐尔身份的无知
  choice: 译作“他却不知道”
  alternative: 他不知道这件事
  rationale: 原文没有明说宾语。中文不补出“这件事”，可更贴近原文形式；前句已经使所指清楚。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。以两个短句清楚呈现行动与叙述者插入的信息，并保留“叙述者知道、人物不知道”的张力。希腊文ἄνθρωπον只表示“一个人”，不支持英语咨询层脚注所说的“使者”这一词义，因此不设置该脚注。
