base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/009.yaml
  text: And he went in and said to his father[a], “Look, I have found someone who will travel with me.” And he said, “Call him to me, so that I may learn what tribe he is from[c][b], and whether he is trustworthy to go with you.”
translation:
  language: zh_hans
  text: 他进去后，对父亲说：“你看，我已经找到一个会与我同行的人。”父亲说：“叫他到我这里来，好让我查明他属于哪个支派[a]，以及他是否可信赖、适合与你同行[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “支派”指以色列人的支派归属。
    reason: cultural_note
  - marker: b
    text: “可信赖”也可译作“可靠”或“忠信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: 他进去
  rationale: 不定过去时分词表示进入后接着说话；汉语用连动式简洁呈现动作次序，不必增添“之后”。
- source_word: Ἰδοὺ
  choice: 你看
  rationale: 保留引人注意和当下发现的语气，同时符合现代汉语口吻。
- source_word: εὕρηκα
  choice: 我已经找到
  rationale: 完成时强调寻找已有结果，“已经找到”自然体现其当前结果。
- source_word: ὃς συμπορεύσεταί μοι
  choice: 一个会与我同行的人
  rationale: 准确表达此人将作为旅伴一同上路；“同行”简洁、庄重，也不显生硬。
- source_word: Φώνησον αὐτὸν πρὸς μέ
  choice: 叫他到我这里来
  rationale: 保留“呼叫、召来”的基本意义，比“把他带来”更贴近希腊文。
- source_word: ἐπιγνῶ
  choice: 让我查明
  rationale: 语境是父亲要确切弄清旅伴的身份和可靠程度；“查明”体现确认之意。
- source_word: ποίας φυλῆς ἐστίν
  choice: 他属于哪个支派
  rationale: φυλή在以色列背景中通常指支派；直译保留叙事对祖先与群体身份的关注。
- source_word: πιστὸς
  choice: 可信赖
  rationale: 这里关乎此人作为旅伴是否值得信任，并非关于信仰教义的抽象陈述。
- source_word: τοῦ πορευθῆναι μετὰ σοῦ
  choice: 能与你同去
  rationale: 表达他在同行这件事上是否可信赖；“同去”避免与前句“同行”机械重复。
theological_decisions:
- issue: φυλή所指的社会身份
  choice: 支派
  alternative: 家族；宗族
  rationale: 希腊文明确使用φυλή，在《多俾亚传》的以色列语境中最自然地指以色列支派；泛化为“家族”会削弱原文的祖属身份色彩。
- issue: πιστός的品格含义
  choice: 可信赖
  alternative: 忠信；可靠
  rationale: 上下文是在评估向导能否受托与儿子同行。“可信赖”兼顾品格与实际可靠性，又不将本节处理成关于信仰的教义表述。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“你看”保留现场感；“支派”保留以色列文化背景；句式尽量贴近希腊文，同时避免生硬的欧化结构。
