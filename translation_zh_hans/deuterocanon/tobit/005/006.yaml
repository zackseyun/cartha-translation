base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/006.yaml
  text: And the angel said to him[a], “I will go with you, and I am familiar with the way, and I have lodged with Gabael our brother.”
translation:
  language: zh_hans
  text: 天使对他说：“我会与你同行；这条路我很熟悉[a]，我也曾在我们的弟兄加巴厄尔那里投宿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我对这段路程很有经验”，意思是“我很熟悉这条路线”。闪语平行材料也将此意展开为熟悉各条道路。
    reason: 说明 τῆς ὁδοῦ ἐμπειρῶ 的直译和语境含义，并保留其“有实际经验”的语感。
lexical_decisions:
- source_word: Πορεύσομαι μετὰ σοῦ
  choice: 我愿与你同行
  rationale: 将将来时的同行承诺译成自然而庄重的现代汉语；“同行”准确表达 μετά 加属格所表示的陪伴。
- source_word: τῆς ὁδοῦ ἐμπειρῶ
  choice: 这条路我很熟悉
  rationale: ἐμπειρῶ 表示对某事有经验、熟悉；此处指实际熟悉行程或路线。这样的译法既传达希腊语压缩表达的含义，又不把它扩充为原文没有明说的“所有道路”。
- source_word: ὁδοῦ
  choice: 这条路
  rationale: ὁδός 可指道路、路程或路线；上下文谈的是前往目的地的行程，“这条路”符合现代汉语旅行语境。
- source_word: παρὰ Γαβαὴλ
  choice: 在加巴厄尔那里
  rationale: παρά 加人名在 ηὐλίσθην 的语境中表示住在某人那里，而不只是空间上的“在旁边”。
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: 我们的弟兄
  rationale: 保留 ἀδελφός 的亲属称谓及其可能指同族之人的开放性，不擅自限定为亲生兄弟。
- source_word: ηὐλίσθην
  choice: 曾……住过
  rationale: αὐλίζομαι 指投宿、留宿或过夜；“曾住过”在现代汉语中自然，并保留以往住宿经历这一信息。
- source_word: ὁ ἄγγελος
  choice: 天使
  rationale: 在《多俾亚传》的叙事语境中，该词指天使性存在；“天使”比一般性的“使者”更合适。
theological_decisions:
- issue: ὁ ἄγγελος 的身份表达
  choice: 天使
  alternative: 使者
  rationale: 希腊词 ἄγγελος 本可泛指使者，但本书上下文明确把此人物呈现为天使；采用“天使”不额外引入宗派解释。
- issue: “弟兄”的关系范围
  choice: 保留“我们的弟兄”
  alternative: 我们的族人
  rationale: 原文可用亲属语言表达同族关系，也可能被直读为兄弟；保留“弟兄”可维持这种语义张力，不替文本作过度判定。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“我愿与你同行”略带正式色彩，适合经文对话；“在……那里住过”则避免生硬的书面词“投宿过”。人名按希腊文 Γαβαήλ 音译为“加巴厄尔”。
