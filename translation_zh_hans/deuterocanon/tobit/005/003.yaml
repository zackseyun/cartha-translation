    rationale: συμπορεύσεταί σοι是“（那人）将与你一同前行”，并非要求多比亚使该人同行。
  - severity: low
    issue: “取回来”添加方向性。
    rationale: λάβε πορευθεὶς意为“前去取得／领取”，没有明确“带回”的前缀意义。
  - severity: low
    issue: “凭据”略预设文书的证明功能。
    rationale: χειρόγραφον首先是手写文书；其确切法律或识别功能在希腊文本中未明说，宜在脚注说明而不作为正文唯一限定。
