  source_fidelity: 译文总体忠实于希腊文的命令、同行、报酬、存款文书及银款等要素。但“让他与你同行”将原文描述该人将会同行的未来陈述轻微改成对多比亚的使令；“取回来”额外带入“带回”的方向性，原文只说前去取得银子。
  naturalness: 原译自然庄重。改为“找一个会与你同行的人”更准确顺畅；“去取那银子”保留原文动作而不附加未明示的返还方向。
  terminology: “手写的凭据”可用，但“手写文书”较贴近χειρόγραφον的具体文书意义，也较少预断其法律性质。脚注保留其可能为凭据及文书类别未定的说明。“工钱”和“银子”均恰当。
  issues:
