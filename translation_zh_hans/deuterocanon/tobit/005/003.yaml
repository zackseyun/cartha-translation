base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/003.yaml
  text: And he gave him the written note and said to him[a], “Find for yourself a man who will go with you, and I will give him wages while I live[b]; then go and get the silver.”
translation:
  language: zh_hans
  text: 他把那份手写文书[a]交给他，对他说：“你要为自己找一个会与你同行的人；我还活着的时候，我会付给他工钱。你去取那银子[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “手写文书”也可译作“手写的凭据”。这里指与所寄存款项有关的文书；希腊文本身没有明确说明它究竟是收据、契据还是其他文书。
    reason: lexical_alternative
  - marker: b
    text: “银子”在这里指寄存的款项，也可译作“钱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: χειρόγραφον
  choice: 手写的凭据
  rationale: 该词本指亲手写成的文书；在这里是与寄存款项有关、交给多比亚使用的凭证。“凭据”既体现其用途，又不把具体法律性质限定为借据或收据。
- source_word: Ζήτησον σεαυτῷ ἄνθρωπον
  choice: 你要为自己找一个人
  rationale: 保留原文的单数“人”和反身意味；现代汉语中“一个人”自然通顺，也不额外断定此人是向导还是雇工。
- source_word: συμπορεύσεταί σοι
  choice: 让他与你同行
  rationale: 明确表达共同上路、同行的动态含义，并与前面的“找一个人”自然衔接。
- source_word: μισθὸν
  choice: 工钱
  rationale: 指为同行服务而付的报酬；“工钱”比泛称“钱”更清楚地保留受雇报偿之意。
- source_word: ἕως ζῶ
  choice: 只要我还活着
  rationale: 贴近希腊文“直到／只要我活着”的表达，同时保留这句话在语境中略显特殊的时间范围，不擅自改成一次性付款承诺。
- source_word: λάβε πορευθεὶς τὸ ἀργύριον
  choice: 你去把银子取回来
  rationale: 将分词结构转成自然的现代汉语连续动作；结合前文寄存款项的背景，“取回来”准确表达前去领取之意。“银子”保留原词的字面形象。
