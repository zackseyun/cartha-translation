  text: For as it has been given to us by the Lord to live, this is enough for us.
translation:
  language: zh_hans
  text: 因为主既赐给我们活着，这对我们就够了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς γὰρ
  choice: 因为
  rationale: γάρ说明前述话语的理由；ὡς在此引出作为依据的情形。汉语用“因为”自然地表达整体的解释关系，避免生硬直译为“因为正如”。
- source_word: δέδοται
  choice: 既赐给
  rationale: 完成时被动态表示已经赐下且结果延续至今；“既赐给”兼顾既成事实与当前状态。
- source_word: ἡμῖν
  choice: 我们
  rationale: 作接受者的与格；在“赐给我们”中明确保留其语法关系。
- source_word: ζῇν
  choice: 活着
  rationale: 保留不定式的动态意义，所赐的是继续活着，而不只是抽象的“生命”。
- source_word: παρὰ τοῦ κυρίου
  choice: 主
  rationale: παρά加属格表示来源，在“主赐给”这一主动化表达中仍清楚表明赐予者和来源。
- source_word: τοῦτο
  choice: 这
  rationale: 回指主所赐予的活着这一事实，不添加原文没有明说的内容。
- source_word: ἱκανὸν
  choice: 够了
  rationale: 表达满足需要、已经充足之意；“够了”是自然清楚的现代汉语。
- source_word: ὑπάρχει
  choice: 就……了
  rationale: 与ἱκανόν构成“是足够的”之意；汉语以“这对我们就够了”自然呈现其系词功能。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 上下文把活着视为来自上帝的恩赐；“主”既符合敬虔语境，也不额外限定所指或引入宗派解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主既赐给我们活着”保留生命为所赐之事及完成时的持续结果；后半句以“这对我们就够了”清楚传达知足之意。
