  yaml_path: translation/deuterocanon/tobit/005/011.yaml
  text: And Tobit said to him, “Brother, from what tribe and from what homeland are you? Show me.”
translation:
  language: zh_hans
  text: 多比特对他说：“弟兄，你出自哪个支派、哪个家乡？请告诉我。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφέ
  choice: 弟兄
  rationale: 保留直接称呼及其礼貌、亲近的语气；此处不必理解为亲生兄弟。
- source_word: φυλῆς
  choice: 支派
  rationale: 在以色列族属语境中，“支派”比一般性的“部族”更准确。
- source_word: πατρίδος
  choice: 家乡
  rationale: 自然表达出身地或故乡，避免生硬译作“祖国”。
- source_word: ὑπόδειξόν μοι
  choice: 请告诉我
  rationale: 该动词本义可指“指明、说明”；在询问身份的语境中，现代汉语以“请告诉我”最自然，同时保留请求对方说明的功能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。两个ἐκ ποίας问句在中文中分别译为“属于哪个支派”和“家乡在哪里”，避免机械重复；称呼“弟兄”保留古代礼貌用语。
