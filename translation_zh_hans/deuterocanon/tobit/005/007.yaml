  text: And Tobiah said to him[a], “Wait for me, and I will tell my father.”
translation:
  language: zh_hans
  text: 多比雅对他说[a]：“请等我，我去告诉我父亲。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本较简短：“多比雅对他说：‘请等我，我去告诉我父亲。’”一个平行的闪语形式文本把情节写得更详细，说多比雅去把自己找到那人的事告诉父亲，随后又出去叫那人。正文依从希腊文本，较完整的异文情节记在这里。
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπόμεινόν με
  choice: 请在这里等我
  rationale: ὑπομένω的简单过去时命令式在此是请那人暂且留下等候；“在这里等我”符合现代汉语习惯，也切合多比雅要去告知父亲的场景。“请”自然表达请求语气，并未改变命令式的基本作用。
- source_word: ἐρῶ
  choice: 我去告诉
  rationale: ἐρῶ是λέγω的将来时。结合上下文，意思是多比雅将去把此事告诉父亲；汉语用“我去告诉”比直译为“我将对……说”更自然，并清楚表达紧接着要采取的行动。
- source_word: τῷ πατρί
  choice: 我父亲
  rationale: 希腊文直译为“父亲”，定冠词按亲属称谓的惯用法指多比雅自己的父亲；现代汉语补出“我”可准确、自然地传达所指。
- source_word: Τωβίας
  choice: 多比雅
  rationale: 采用贴近该名字闪语形式的常用中文音译，并与其父多比的名字相区别。
