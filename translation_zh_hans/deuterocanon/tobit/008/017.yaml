base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/017.yaml
  text: Blessed are you[a], because you have made me rejoice, and it has not happened to me as I suspected; rather, according to your abundant mercy, you have acted with us. Blessed are you, because you have shown mercy to two only children. Show them mercy, Master[c][b]; bring their life to completion in health with gladness and mercy.
translation:
  language: zh_hans
  text: “你是当受称颂的，因为你使我欢喜；事情并没有像我所猜想的那样发生[a]，反而照着你丰盛的怜悯与我们这样行事。你是当受称颂的，因为你怜悯了两个独生子女[b]。主宰啊，求你怜悯他们，使他们在健康、欢喜和怜悯中圆满度过一生[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “猜想”也可译作“料想”。这个希腊词既可表示推想，也可带有怀疑意味；这里的语境显示，这是一种忧虑中的预期。
    reason: lexical_alternative
  - marker: b
    text: “两个独生子女”是说这对夫妻各自都是自己父母唯一的孩子。
    reason: cultural_note
  - marker: c
    text: “使他们……圆满度过一生”也可译作“使他们的生命达到圆满”。希腊文的“生命”用单数，具有集合意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: 当受称颂的
  rationale: 这是对上帝使用的祝颂句式；“当受称颂”保留礼仪色彩，也比单纯的“受赞美”更贴近谓语形容词的形式。
- source_word: ηὔφρανάς
  choice: 使我欢喜
  rationale: 保留 εὐφραίνω 明确的使动意义，同时符合现代汉语表达。
- source_word: ὑπενόουν
  choice: 我所猜想的
  rationale: 该词可指猜想或怀疑；此处带有忧虑的预期，但正文不径直强化为“害怕”，以保留原文范围。
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: 照着你丰盛的怜悯
  rationale: “照着”表达 κατὰ 所指的准则或尺度，“丰盛”体现 πολὺ 对怜悯之大的强调。
- source_word: ἐποίησας μεθʼ ἡμῶν
  choice: 恩待了我们
  rationale: 希腊语字面为“与我们行事”；在怜悯这一直接语境中，“恩待”是自然的汉语表达，同时不把具体行动说得过细。
- source_word: ἠλέησας
  choice: 怜悯了
  rationale: 直接保留 ἐλεέω 的核心含义，并与本节反复出现的 ἔλεος/怜悯形成词义呼应。
- source_word: δύο μονογενεῖς
  choice: 两个独生子女
  rationale: 这里指夫妻二人各自都是父母唯一的孩子；“独生子女”准确表达家庭身份，不引入基督论意义。
- source_word: δέσποτα
  choice: 主宰
  rationale: “主宰”体现 δέσποτα 的权柄和统治含义，也能与通常译作“主”的 κύριος 保持词汇区别。
- source_word: συντέλεσον τὴν ζωὴν αὐτῶν
  choice: 使他们一生……圆满走完
  rationale: 表达使生命历程达到终点、得以完整度过的祈求；“一生”自然承接希腊文集合性单数“生命”。
- source_word: ἐν ὑγείᾳ
  choice: 健康
  rationale: 简明表达身体健全、安康的意义。
- source_word: μετὰ εὐφροσύνης καὶ ἐλέους
  choice: 在欢喜和怜悯中
  rationale: 保留“欢喜”与“怜悯”的并列，也延续全节的怜悯主题。
theological_decisions:
- issue: 对上帝的称呼 δέσποτα
  choice: 主宰
  alternative: 主；主人
  rationale: “主宰”既适合直接称呼上帝，又保留 δέσποτα 所强调的至高权柄，避免与 κύριος 的常规译法完全合并。
- issue: μονογενεῖς 的语境意义
  choice: 两个独生子女
  alternative: 两个独一者；两个独生的孩子
  rationale: 叙事语境谈的是这对夫妻各自在原生家庭中的身份，并非本体或基督论意义。
- issue: τὴν ζωὴν 的集合性单数
  choice: 他们一生
  alternative: 他们的生命；他们各自的一生
  rationale: 保留共同祈求的整体感，又用自然汉语避免误解为二人共享同一个生命。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。祝颂句保留祷告和礼仪语气；“主宰”用于区分 δέσποτα 与 κύριος；全节重复使用“怜悯”，以再现希腊文的主题性复现。
