base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/006.yaml
  text: You made Adam[a], and you gave him Eve as a helper and support, his wife; from these came the seed of mankind. You said, ‘It is not good for the man to be alone[b]; let us make for him a helper like himself.’
translation:
  language: zh_hans
  text: 你造了亚当，又赐给他夏娃作帮手和扶持，就是他的妻子；人类的后裔[a]由他们而生。你曾说：‘那人独居不好[b]；让我们为他造一个与他相似的帮手。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“人类的种裔”。希腊文用“种子、后裔”一词，保留了生育和血脉延续的意象。
    reason: lexical_alternative
  - marker: b
    text: 这句话呼应《创世记》2:18。
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησας
  choice: 你造了
  rationale: 直译 ποιέω，并以自然庄重的现代汉语表达；不特意采用带有更强术语色彩的“创造”。
- source_word: Ἀδάμ
  choice: 亚当
  rationale: 按现代中文圣经传统音译人名，同时保留此处将其作为具体人物的读法。
- source_word: ἔδωκας
  choice: 赐给
  rationale: δίδωμι 本义为“给”；祷告中以“赐给”表达上帝的给予，庄重而自然。
- source_word: βοηθὸν
  choice: 帮手
  rationale: 保留“帮助者”的明确含义，也使创世记2:18的互文容易辨认；不改写为较弱的“伴侣”。
- source_word: στήριγμα
  choice: 扶持
  rationale: σَτήριγμα 指支撑、依靠；“扶持”能自然表达夏娃作为支持者的意义，并与“帮手”并列。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 就是他的妻子
  rationale: γυνή 可指女人或妻子；婚姻语境支持“妻子”。“就是”显明该短语与前面的夏娃同位，避免误解为“他妻子的扶持”。
- source_word: ἐκ τούτων
  choice: 由他们
  rationale: 指刚提到的亚当和夏娃二人；中文用人称代词比“由这些”自然，同时保留复数所指。
- source_word: τὸ ἀνθρώπων σπέρμα
  choice: 人类的后裔
  rationale: σπέρμα 在此指由始祖繁衍的种裔、后代；“后裔”保留血缘繁衍的意象，又比直译“人类的种子”自然。
- source_word: Οὐ καλὸν εἶναι τὸν ἄνθρωπον μόνον
  choice: 那人独自一人不好
  rationale: 紧贴希腊文，并保留对创世记2:18的明显呼应；定冠词在此以“那人”呈现，指向亚当。
- source_word: ποιήσωμεν
  choice: 我们要……造
  rationale: 以“我们要”表达第一人称复数劝勉虚拟式；保留原文复数，不对其神学含义作额外解释。
- source_word: ὅμοιον αὐτῷ
  choice: 与他相似
  rationale: 直接表达 ὅμοιος 的“相似、像”之义；不从希伯来语背景引入“与他相配”等超出本希腊文本明说范围的解释。
theological_decisions:
- issue: 亚当的称谓与人类始祖身份
  choice: 正文译作专名“亚当”
  alternative: 译作“人”或“人类”
  rationale: 本句希腊文 Ἀδάμ 明确以亚当为名，且紧接着提到夏娃；因此正文保留专名，不将二者混同为抽象的人类概念。
- issue: 创世记2:18的互文
  choice: 保留“帮手”“那人独自一人不好”“我们要……造”等接近原句的表达
  alternative: 改写为更流畅的“人为伴、彼此相配”等意译
  rationale: 祷告在有意复述创造叙事；保留关键词有助于读者听出经文呼应，同时不加入原文没有的婚姻角色解释。
- issue: ποιήσωμεν 的复数表达
  choice: 译作“我们要……造”
  alternative: 单数化为“我要……造”
  rationale: 希腊文明确使用第一人称复数。译文保留这一形式及其张力，不替读者断定复数所指。
- issue: 人类繁衍的表述
  choice: “人类的后裔由他们而生”
  alternative: “全人类都从他们而来”
  rationale: “后裔”保留 σπέρμα 的生育和谱系意象；不把具体意象完全抽象化为“全人类”。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“赐给”体现向上帝祷告的语境；分号划分创造夫妇与人类繁衍两个紧密相关的分句。引语保留创世记式措辞，但避免生硬仿古。所有脚注标记均已置于正文对应位置。
