  yaml_path: translation/deuterocanon/tobit/008/007.yaml
  text: And now[a], Lord, I am not taking this my sister because of sexual immorality, but in truth[b]. Command that I may find mercy and that I and she may grow old together.
translation:
  language: zh_hans
  text: “主啊，如今我娶我这位姐妹[a]，不是为了淫乱，而是出于真诚。求你命定，让我蒙怜悯，也让她与我一同白头到老[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “姐妹”是本书对女性近亲的称呼；她同时也是合法的婚配对象。也可译作“我这位女亲属”。
    reason: cultural_note
  - marker: b
    text: 希腊文将“怜悯我”和“她与我一同白头到老”并列为同一祈求中的两个不定式；“她”紧邻并自然作“共同白头到老”的逻辑主语。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: κύριε
  choice: 主啊
  rationale: 这是向上帝的直接呼求；“主啊”符合现代汉语祷告语体，也准确传达称谓。
- source_word: πορνείαν
  choice: 淫乱
  rationale: 该词泛指不正当的性行为；“淫乱”保留其道德分量及较宽泛的含义，避免把原文缩窄为单纯的“情欲”。
- source_word: λαμβάνω
  choice: 娶
  rationale: λαμβάνω字面为“取、领受”，在这里明确处于婚姻语境；译作“娶”在现代汉语中自然清楚。
- source_word: τὴν ἀδελφήν μου ταύτην
  choice: 我这位姐妹
  rationale: 保留ἀδελφή的亲属称谓和叙事世界中的文化表达，同时用脚注说明她是可合法婚配的近亲。
- source_word: ἐπʼ ἀληθείας
  choice: 出于真诚
  rationale: 此短语与“为了淫乱”形成动机上的对比；“出于真诚”既自然，又保留真实、诚正之意。
- source_word: ἐπίταξον
  choice: 求你下令
  rationale: ἐπίταξον具有“命令、下令”的明确力度；加入“求你”使其符合汉语祷告语气，而不把动词弱化为一般的“赐予”。
- source_word: ἐλεῆσαί με
  choice: 使我蒙怜悯
  rationale: 用被动表达保留“怜悯我”的核心意思，也避免在正文中武断指定下令之后的施怜悯者。
- source_word: αὐτὴν συγκαταγηρᾶσαι
  choice: 使她与我一同白头到老
  rationale: 复合动词表达共同渐老；“白头到老”是现代汉语中自然、庄重的婚姻表达，“与我”由共同动作及上下文补明。
theological_decisions:
- issue: 婚姻祷告中称妻子为“姐妹”
  choice: 正文保留“姐妹”，脚注说明这是近亲称谓。
  alternative: 译作“女亲属”或“族妹”。
  rationale: 希腊文明确使用ἀδελφή。保留字面称谓可呈现《多俾亚传》的亲属语言，又不暗示现代汉语通常所理解的亲生姐妹关系。
- issue: 末句中“怜悯”与“共同老去”的句法关系
  choice: 译为两个相连的祈求：“使我蒙怜悯，也使她与我一同白头到老”。
  alternative: 译为“求你怜悯我和她，使我们一同白头到老”。
  rationale: 希腊文以两个不定式连接，με较自然地作“怜悯”的宾语，αὐτήν较自然地作“共同老去”的逻辑主语；但结构紧凑，另一种把“我和她”都视为怜悯对象的理解仍有可能，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“娶”使婚姻语境清楚；“姐妹”保留原文的亲属语言，以脚注防止误解；“白头到老”自然传达共同渐老的愿望。
