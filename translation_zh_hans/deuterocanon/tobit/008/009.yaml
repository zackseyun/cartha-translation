lexical_decisions:
- source_word: ἐκοιμήθησαν
  choice: 睡了
  rationale: 该词在此指睡眠，不是“死亡”的委婉说法；“睡了”简洁自然，也不额外断定是刚躺下还是已经入睡。
- source_word: ἀμφότεροι
  choice: 两人
  rationale: 明确保留原文所指双方共同的双数含义；现代汉语中“两人”比“双方都”更简洁自然。
- source_word: τὴν νύκτα
  choice: 一夜
  rationale: 宾格在这里表示时间延续，汉语“一夜”自然表达整段夜间时长，同时保留原文简练措辞。
