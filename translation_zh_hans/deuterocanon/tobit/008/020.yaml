  yaml_path: translation/deuterocanon/tobit/008/020.yaml
  text: And Raguel said to him under oath[a], before the days of the wedding were completed, that he should not leave unless the fourteen days of the wedding were fulfilled,
translation:
  language: zh_hans
  text: 拉贵耳郑重地向他起誓，要他在婚礼的日子结束以前不可离开，除非婚礼的十四天期满。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὶν ἢ συντελεσθῆναι τὰς ἡμέρας τοῦ γάμου
  choice: 婚礼的日子还没有结束
  rationale: 表达在婚庆时段结束之前这一时间关系；用“还没有结束”自然地传达不定过去被动式 συντελεσθῆναι 的完成含义。
- source_word: ἐνόρκως
  choice: 郑重起誓
  rationale: 该副词表明拉贵耳以誓言约束所说的话；“郑重起誓”在现代汉语中清楚而庄重，并以脚注保留较贴近形式的译法。
- source_word: μὴ ἐξελθεῖν αὐτόν
  choice: 他就不可离开
  rationale: 不定式从句承载拉贵耳誓言中要求的内容；“不可离开”比字面的“不可出去”更符合此处不得启程离去的语境。
- source_word: ἐὰν μὴ πληρωθῶσιν
  choice: 若还未满
  rationale: 保留 ἐὰν μή 的条件表达和 πληρόω 所含的达到规定期限之意，不将原文的条件句静默改写为单纯的“直到”。
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: 十四天的婚期
  rationale: 明确保留十四天这一时长；“婚期”在此指婚礼庆祝的规定日数，较重复说“婚礼的十四天”更自然。
