  yaml_path: translation/deuterocanon/tobit/008/021.yaml
  text: and then[a], after taking half of his possessions, to go in good health to your father[b]; and the rest when I and my wife die.
translation:
  language: zh_hans
  text: 随后，他带着其中一半财产，平安地到你父亲那里去[a]；其余的，要等我和我妻子都去世以后再说[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“到父亲那里去”；根据直接对话的语境，这里指“到你父亲那里去”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文末句十分简略，直译为“其余的，在我和我妻子去世时”。一个“去世”的动词同时关联“我”和“我妻子”；上下文通常理解为要等夫妻二人都去世以后。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντα
  choice: 拿着
  rationale: 不定过去时分词表示先于“去”的动作；汉语用“拿着”自然地衔接随身带走财产这一动作。
- source_word: τὸ ἥμισυ τῶν ὑπαρχόντων αὐτοῦ
  choice: 自己财产的一半
  rationale: ὑπάρχοντα指所有物、财产；αὐτοῦ为第三人称所有格，在本句所述同一人物的连续动作中，汉语以反身代词“自己”表达最自然，同时不改成原文没有的“我的”。
- source_word: πορεύεσθαι
  choice: 去
  rationale: 保留一般性的移动含义，不额外限定为启程或返程。
- source_word: μετὰ ὑγείας
  choice: 安然
  rationale: 该短语字面涉及健康、完好无恙；“安然”在现代汉语中兼顾身体无恙和平安成行的语境。
- source_word: πρὸς τὸν πατέρα
  choice: 到你父亲那里去
  rationale: 希腊文只有定冠词而无明示的所有格；直接对话语境表明是受话者的父亲，因此正文采用自然的“你父亲”，并以脚注保留原文字面形式。
- source_word: τὰ λοιπά
  choice: 其余的
  rationale: 承接前述财产的一半，简洁表达余下的部分。
- source_word: ὅταν ἀποθάνω καὶ ἡ γυνή μου
  choice: 要等我和我妻子死后
  rationale: 原句高度省略；此译保留其简短结构，并明确时间须在夫妻二人死后，而不在正文擅自补出受赠人或法律动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“安然”避免把μετὰ ὑγείας仅窄化为身体健康，也不完全泛化成旅途安全。末句保留原文的省略感，并用脚注说明其含义。
