base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/005.yaml
  text: And Tobiah began to say[a], “Blessed are you, O God of our fathers, and blessed is your holy and glorious name forever; may the heavens and all your creation bless you.”
translation:
  language: zh_hans
  text: 多比雅开始说：“我们列祖的上帝啊，你当受颂赞；你那圣洁而荣耀的名也永远当受颂赞。愿诸天和你所造的一切[a]都颂赞你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你一切的受造物”。希腊语在这里可广指上帝所创造的万有，不只指有生命的受造者。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο ... λέγειν
  choice: 开口说
  rationale: 这是表示开始说话的常见结构；汉语用“开口说”自然地标明祷告的开始，又避免生硬直译为“开始说”。
- source_word: Εὐλογητὸς
  choice: 当受颂赞
  rationale: 在向上帝直接祷告的颂赞公式中，这一译法既传达“称颂、赞美”的含义，也保持庄重的礼仪语气。
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 我们的列祖所敬奉的上帝
  rationale: πατέρων明确指先祖中的父辈；“列祖”保留其传统和盟约语境，“所敬奉的”则使汉语呼语关系清楚，而不把它误解为上帝源自列祖。
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔνδοξον
  choice: 你圣洁荣耀的名
  rationale: 保留“圣洁”和“荣耀”两个修饰语，以简洁、自然的汉语表达原文的并列属性。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是该希腊习语在祷告语境中的自然现代汉语表达，传达持续无尽之意。
- source_word: εὐλογησάτωσάν σε
  choice: 愿……都颂赞你
  rationale: 以“愿”表达祈愿式、呼吁式的命令语气，适合汉语祷告文体。
- source_word: οἱ οὐρανοὶ
  choice: 诸天
  rationale: 保留希腊文复数及其庄重的宇宙性意象。
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: 你所造的一切
  rationale: κτίσεις在此可广指上帝创造的万有；这一译法保留其范围上的开放性，不限于有生命的受造者。
theological_decisions:
- issue: 祖先称谓中的性别指向
  choice: 列祖
  alternative: 祖先
  rationale: 希腊文πατέρων为阳性且属于传统祷告公式；“列祖”既准确保留父辈指向，也符合庄重而易懂的现代汉语。
- issue: 宇宙颂赞中κτίσεις的范围
  choice: 你所造的一切
  alternative: 你一切的受造物
  rationale: 原词可指受造者、受造物或整个受造秩序；正文采用较宽泛的表达，以免将其无根据地限定为能主动赞美的有生命者，并以脚注说明另一种可能。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告语体。“上帝”“列祖”“诸天”“颂赞”等词保留经文的礼仪色彩，同时避免过度古雅。
