revisions:
- from: 但那鬼魔一闻到这气味，就逃到埃及最上面的地区[a]；天使把它捆绑起来。
  to: 但鬼魔闻到那气味，就逃到埃及最远的地区[a]；天使把它捆绑起来。
  rationale: 修订仅改善汉语自然度，并避免将具多重可能的ἀνώτατα在正文中处理为不够自然的地形描述。译文保留鬼魔、气味、逃离、埃及和天使捆绑等全部叙事要素；脚注锚点仍紧随相关地理短语。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:17:35Z'
