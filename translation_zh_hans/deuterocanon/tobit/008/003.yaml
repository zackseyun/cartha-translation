  source_fidelity: 原文准确表达鬼魔嗅到某种气味后逃往埃及的ἀνώτατα，随后天使将其捆绑。草案的主要意义完整。不过，“最上面的地区”在现代汉语中容易理解为地形海拔最高的区域，且与埃及常规地图方位不够自然；“埃及最远的地区”更顺畅，并可由脚注保留“上埃及”的地理可能性。
  naturalness: “那鬼魔”不合现代标准汉语中此类叙事的自然搭配；“鬼魔”本身已可定指上下文已知对象，译为“鬼魔”更简洁庄重。“一闻到”略偏口语且“闻”可能有听闻义；“闻到……的气味”清楚自然。
  terminology: δαιμόνιον宜译“鬼魔”或“邪灵”；“鬼魔”可接受，且与天使的超自然叙事语境相称。δέω译“捆绑”忠实。ὁ ἄγγελος不补出“拉斐尔”，保留原文称谓。
