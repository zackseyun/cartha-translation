    rationale: 中文不必用“那”机械对应希腊文定冠词；“鬼魔闻到那气味”更自然，也仍保留上下文定指。
  revised_text: 但鬼魔闻到那气味，就逃到埃及最远的地区[a]；天使把它捆绑起来。
