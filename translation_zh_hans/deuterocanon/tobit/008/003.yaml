base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/003.yaml
  text: But when the demon smelled the odor[a], it fled to the remotest parts of Egypt, and the angel bound it.
translation:
  language: zh_hans
  text: 但鬼魔闻到那气味，就逃到埃及最远的地区[a]；天使把它捆绑起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“埃及最上面的地区”；按地理方位，也可能指“上埃及”。
    reason: 原文ἀνώτατα字面有“最上面、最高处”之意；此处亦可理解为最偏远的地区，或具有“上埃及”的地理含义。
lexical_decisions:
- source_word: ὠσφράνθη
  choice: 闻到
  rationale: 该动词虽为不定过去时被动/异相形式，在此具有主动意义，表示凭嗅觉察觉；“闻到”自然简洁。
- source_word: τὸ δαιμόνιον
  choice: 那鬼魔
  rationale: 叙事将其描写为能闻、能逃并被天使捆绑的敌对灵体；“鬼魔”明确保留其有位格的超自然性质，定指词“那”对应希腊文冠词及上下文中的已知对象。
- source_word: τῆς ὀσμῆς
  choice: 这气味
  rationale: ὀσμή泛指气味；上下文所指是焚烧鱼内脏所产生的气味。“气味”不预设其香臭，“这”使中文衔接自然。
- source_word: ἔφυγεν
  choice: 逃到
  rationale: φεύγω表示因躲避而逃离；与目的地连用时译作“逃到”简洁有力。
- source_word: εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: 到埃及最上面的地区
  rationale: ἀνώτατα是表示“最高、最上”的最高级形式。此译保留原文空间意象及其可能的地理含义，不径自定为专名“上埃及”；相关可能性收入脚注。
- source_word: ἔδησεν
  choice: 捆绑起来
  rationale: δέω的基本义是捆绑、缚住；“捆绑起来”在现代汉语中自然，并保留具体动作。
- source_word: ὁ ἄγγελος
  choice: 天使
  rationale: 原文为定冠词单数，按上下文指那位天使；本句未直呼拉斐尔之名，译文也不补名。
theological_decisions:
- issue: δαιμόνιον所指对象的性质
  choice: 译为有位格的敌对灵体“鬼魔”
  alternative: 邪灵
  rationale: 该对象在叙事中闻到气味、逃走并被天使捆绑，文本把它呈现为具有行动能力的超自然存在；不将其弱化为疾病或抽象恶力。
- issue: εἰς τὰ ἀνώτατα Αἰγύπτου的地理含义
  choice: 正文保留“埃及最上面的地区”这一相对直译
  alternative: 埃及最远的地方；上埃及
  rationale: 希腊文可表达最上方或最偏远的区域，也可能在地理上指上埃及。正文不把这种开放性强行限定为正式地名，脚注说明主要理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“一……就……”自然呈现两个不定过去时动作的紧密先后关系；分号区分鬼魔逃走与天使捆绑两个事件。脚注标记已置于相关地理短语之后。
