  text: And she went out and reported to them that he was alive[a][b].
translation:
  language: zh_hans
  text: 她出去，告诉他们他活着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他活着”；动词本身未明说主语，按上下文指托比亚。
    reason: 说明ζῇ的直译及其隐含主语。
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: 出去
  rationale: 这是ἐξέρχομαι的简单过去时分词，表示从所在的房间或屋内向外走；汉语用连动结构“出去”自然表达先行动、后报告的次序。
- source_word: ἀπήγγειλεν
  choice: 告诉
  rationale: ἀπαγγέλλω表示把消息报告或告知他人；此处是简短的叙事语境，“告诉”比“报告”更符合现代汉语，同时保留传达消息的含义。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 阳性复数与格代词，在汉语中作为“告诉”的间接宾语自然译为“他们”。
- source_word: ὅτι
  choice: （引出“他还活着”）
  rationale: ὅτι引出所传消息的内容；现代汉语在“告诉他们”之后无需机械译出“说”或“即”，可直接接内容分句。
- source_word: ζῇ
  choice: 他还活着
  rationale: ζάω现在时第三人称单数，直义为“活着／仍活着”。主语未明说，依上下文补作“他”；“还”自然传达众人所关切的存活状态，但不改变基本语义。
theological_decisions:
- issue: ζῇ中未明说的主语
  choice: 正文补出“他”，不点名
  alternative: 译作“托比亚还活着”
  rationale: 希腊语动词只标示第三人称单数，具体所指由上下文确定。补“他”是汉语语法所需，也避免在本节中加入原文未明说的名字。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“她出去告诉他们”保留希腊文动作先后；“他还活着”符合汉语叙事习惯。脚注标记已在正文中出现。
