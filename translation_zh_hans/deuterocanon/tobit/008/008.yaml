  text: And she said with him[a], “Amen.”
translation:
  language: zh_hans
  text: 她也跟他一起说[a]：“阿们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她也与他一同说：‘阿们。’”希腊语短语表明，她加入他，一同作出这个回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 也
  rationale: 在此承接前文，并表明她加入他的回应；现代汉语用“也”比机械译作“并且”更自然。
- source_word: εἶπεν
  choice: 说
  rationale: λέγω 的简单过去叙事用法，直译为“说”准确自然；希腊语动词为单数，主语依据上下文补为“她”。
- source_word: μετʼ αὐτοῦ
  choice: 跟他一起
  rationale: μετά 加属格表示伴随或共同参与；这里指她与他共同作出“阿们”的回应。“跟他一起”既明确又符合现代普通话。
- source_word: Ἀμήν
  choice: 阿们
  rationale: 保留源自闪语的固定礼仪回应，采用现代中文圣经传统中通行的音译“阿们”。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准普通话。“跟他一起”清楚传达共同回应的动作，同时以脚注保留较为正式的“与他一同”这一译法。
