lexical_decisions:
- source_word: ἐκέλευσεν
  choice: 吩咐
  rationale: 该词表示发出命令或指示；“吩咐”在现代汉语叙事中自然，也保留了主人对仆人发令的权威意味。
- source_word: τοῖς οἰκέταις
  choice: 仆人
  rationale: οἰκέτης指家中的仆役，也可能含奴仆身份；此处用“仆人”简洁自然，不在正文中过度限定其法律或社会身份。
- source_word: χῶσαι
  choice: 填上
  rationale: χόω在此表示用土覆盖、填平；对象是预先挖好的坟坑，并非此刻埋葬尸体，所以译作“填上”准确而具体。
- source_word: τὸν τάφον
  choice: 坟坑
  rationale: τάφος可指坟墓或墓穴；上下文所指是预备埋人、后来又要填上的坑，因此“坟坑”比可能让人想到完整墓葬建筑的“坟墓”更贴合场景。
