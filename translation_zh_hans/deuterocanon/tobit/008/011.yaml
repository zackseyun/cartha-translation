    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 便
  rationale: 承接前文并推进叙事，保持希腊文并列连接的简洁语流；现代汉语不宜机械译作“和”。
- source_word: ἦλθεν
  choice: 来到
  rationale: ἔρχομαι 的不定过去时，表示来到某处；不译作“回到”，以免加入原文未明说的返回含义，也不单独译作“进入”，因为方向已由 εἰς 表达。
- source_word: Ῥαγουὴλ
  choice: 拉贵耳
  rationale: 依希腊文 Ῥαγουήλ 音译人名，采用清楚且适合现代普通话的形式。
- source_word: εἰς τὴν οἰκίαν
  choice: 来到……家中
  rationale: εἰς 加宾格表示向内进入的方向；“家中”自然表达进入住所内部，比单说“到家”更贴近该空间含义。
- source_word: ἑαυτοῦ
  choice: 自己
  rationale: 反身属格回指拉贵耳；“自己家中”明确保留反身关系，同时不额外强化为带对比意味的“他自己的”。
