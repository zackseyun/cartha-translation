lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 承接前文并推进叙事；在现代汉语中用“就”自然表达动作相继发生。
- source_word: εἰσῆλθεν
  choice: 进去了
  rationale: 该不定过去时动词表示进入某处；“进去了”符合汉语叙事语境，并保留移动进入的含义。
- source_word: ἡ παιδίσκη
  choice: 女仆
  rationale: παιδίσκη指女性仆役，也可能带有年轻或奴仆身份的意味；“女仆”简洁、自然，并明确其性别和服役身份。
- source_word: ἀνοίξασα
  choice: 打开
  rationale: 不定过去时分词通常表示先于主要动词发生的动作；汉语按“打开门—进去”的自然次序即可清楚呈现。
- source_word: τὴν θύραν
  choice: 门
  rationale: θύρα在此家庭场景中通常指门，而非大门或城门。
