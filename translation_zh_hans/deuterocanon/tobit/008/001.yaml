base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/001.yaml
  text: And when they had finished dining[b][a], they brought Tobiah in to her.
translation:
  language: zh_hans
  text: 他们吃完饭后，就把多比雅领到她那里。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“把多比雅领到她那里”。闪语平行传统对这一场景有较长叙述，包括预备房间、二人进入房内以及关门等细节。
    reason: alternative_reading
  - marker: b
    text: “多比雅”是按闪语形式所作的音译；一些传统译本采用源自希腊文或拉丁文形式的其他译名。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: ……后，就
  rationale: 既表达ὅτε的时间关系，也以“就”自然承接叙事中的下一件事；不机械译出δέ。
- source_word: συνετέλεσαν δειπνοῦντες
  choice: 吃完饭
  rationale: συνετέλεσαν表示完成，δειπνοῦντες指用餐；合译为现代汉语自然简洁的“吃完饭”，不强行限定为晚饭。
- source_word: εἰσήγαγον
  choice: 领到
  rationale: 原词意为领入、带入。上下文未在本句明说进入何处，故用“领到她那里”，既保留动作含义，也避免补出房间等信息。
- source_word: Τωβείαν
  choice: 多比雅
  rationale: 采用接近闪语形式的现代汉语音译，并与多比传相关人名的区分相协调；传统译名也有不同形式。
- source_word: πρὸς αὐτήν
  choice: 到她那里
  rationale: 忠实表达πρός加宾格的趋向意义；不增译为“与她同房”等较强的语境解释。
theological_decisions:
- issue: Τωβείαν的人名形式
  choice: 多比雅
  alternative: 多俾亚／多俾亚斯等传统音译
  rationale: 人名按其闪语背景作音译，而不以希腊—拉丁传统形式为唯一依据；这不涉及教义判断。
- issue: πρὸς αὐτήν在婚房语境中的含义
  choice: 到她那里
  alternative: 进去与她同在
  rationale: 保留希腊文简洁而开放的趋向表达，不把上下文暗示具体化为本句未明说的婚房或夫妻行为。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“吃完饭”避免不必要地限定具体餐次；“领到她那里”保留原文的简洁和语义张力。脚注标记均置于正文相关句末。
