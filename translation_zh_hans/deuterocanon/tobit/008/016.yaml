base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/016.yaml
  text: And Raguel blessed God[a], saying, “Blessed are you, O God, with every blessing; and may your holy ones bless you, and all your creatures[c][b]; may all your angels and your chosen ones bless you forever.”
translation:
  language: zh_hans
  text: 辣古耳就称颂上帝，说：“上帝啊，你当受一切颂赞！愿你的圣者和你所造的万物[a]都称颂你；愿你的众天使和你所拣选者[b]永远称颂你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你所造的万物”也可译作“你一切的受造物”。
    reason: lexical_alternative
  - marker: b
    text: “你所拣选者”也可译作“你的蒙选者”；其所指并未明确。
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: εὐλόγησεν / Εὐλογητὸς / εὐλογείτωσάν
  choice: 称颂／当受颂赞／愿……称颂
  rationale: 按各处句法分别表达同一词根：叙事中的过去时译为“称颂”，对上帝的祝颂公式译为自然庄重的“当受颂赞”，祈愿式则译为“愿……称颂”。
- source_word: ἐν πάσῃ εὐλογίᾳ
  choice: 受一切颂赞
  rationale: 保留πάσῃ的周全意义，并以现代汉语较自然的搭配表达希腊语中略带习语性的介词短语。
- source_word: οἱ ἅγιοί σου
  choice: 你的圣者
  rationale: “圣者”保留其宽泛所指，不限定为人间信徒、天上存在或二者兼有，也避免“圣徒”可能带入的后期教会术语色彩。
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: 你所造的万物
  rationale: 准确传达复数κτίσεις及πᾶσαι的整体范围；“万物”比“所有受造物”更自然而庄重。
- source_word: πάντες οἱ ἄγγελοί σου
  choice: 你的众天使
  rationale: “众”明确表达πάντες，同时符合现代汉语宗教语体。
- source_word: οἱ ἐκλεκτοί σου
  choice: 你所拣选的人
  rationale: 直接表达ἐκλεκτοί的核心意义，不采用可能被系统神学术语化的“选民”；“人”属汉语表达所需，但以脚注保留所指未明。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 在颂赞语境中自然表达持续无尽的意义。
theological_decisions:
- issue: “你的圣者”与“你所拣选的人”的所指
  choice: 正文采用宽泛称谓，不判定这些群体究竟是义人、天上存在，还是兼指二者。
  alternative: 将二者明确解释为天使，或明确解释为上帝忠信的子民。
  rationale: 原文没有界定所指，而且另行提到“天使”；译文应保留这种开放性，不替原文消除神学张力。
translation_notes:
  register: 采用现代、庄重且适合诵读的简体中文。“称颂／颂赞”贯穿同一希腊词根的反复，又按汉语句法作必要变化。专名采用通行天主教次经译名“辣古耳”；如项目全书另有统一专名表，应依其规范调整。
