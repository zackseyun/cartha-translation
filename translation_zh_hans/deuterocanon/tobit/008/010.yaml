  text: And Raguel got up[a], went and dug a grave, saying, “Perhaps he too may die.”
translation:
  language: zh_hans
  text: 拉古耳起身，去挖了一个坟墓，说：“恐怕他也会死。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较直译为：“唯恐这人也会死。”希腊文表达拉古耳的担心：他也可能像先前的新郎一样死去。
    reason: 说明μή καί与虚拟语气所表达的忧惧语气，并保留“也”的比较含义。
lexical_decisions:
- source_word: ἀναστὰς
  choice: 起来
  rationale: 不定过去时分词在这里承接叙事，表示拉古耳起身后采取下一步行动；“起来”自然、简明。
- source_word: ἐπορεύθη
  choice: 去
  rationale: 原词表示前往或离去；希腊文没有明确表达“出去”，因此不作添加。
- source_word: ὤρυξεν
  choice: 挖了
  rationale: 按上下文指实际挖掘，与后面的“坟”自然搭配。
- source_word: τάφον
  choice: 一座坟
  rationale: 该词可指坟墓或墓穴；因其是被“挖”的，此处译作“坟”最贴合情境。
- source_word: Μὴ καὶ
  choice: 恐怕……也……
  rationale: μή加虚拟语气在直接引语中表达忧虑和担心的可能性；“恐怕”准确保留拉古耳的不安语气。
- source_word: οὗτος
  choice: 他
  rationale: 指多俾亚；与καί合译为“他也”，自然表达他可能像先前的人一样遭遇死亡。
- source_word: ἀποθάνῃ
  choice: 会死
  rationale: 不定过去时虚拟语气表达所担忧但尚未确定的结果；“会死”在“恐怕”之后保留这种不确定性。
