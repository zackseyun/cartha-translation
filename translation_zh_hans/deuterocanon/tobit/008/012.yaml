  yaml_path: translation/deuterocanon/tobit/008/012.yaml
  text: And Edna said to his wife, “Send one of the servant girls, and let them see whether he is alive; but if not, so that we may bury him and no one may know.”
translation:
  language: zh_hans
  text: 埃德纳对妻子说：“派一个婢女去，让她们[a]看看他是否还活着；若不然，我们好把他埋葬，不让任何人知道。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“让她们看看”，动词是复数，尽管前面刚说“一个婢女”。译文保留这一不一致，没有改成单数。
    reason: textual_variant
lexical_decisions:
- source_word: Ἔδνα
  choice: 埃德纳
  rationale: 按希腊文人名音译，并保留原文在此处将其写作有妻子的人物这一表述，不依据上下文擅自更换姓名或性别关系。
- source_word: Ἀπόστειλον μίαν τῶν παιδισκῶν
  choice: 派一个婢女去
  rationale: ἀποστέλλω表示差派；παιδίσκη指女性仆役，也可能含奴仆身份。“婢女”简明保留其性别与较低的家内服役身份。
- source_word: ἰδέτωσαν
  choice: 让她们看看
  rationale: 希腊文是第三人称复数命令式。尽管前文只提到“一个婢女”，译文仍保留复数，不擅自改成单数。
- source_word: εἰ ζῇ
  choice: 是否还活着
  rationale: 按察看婚夜之后此人状况的语境，用现代汉语自然表达“是否活着”；“还”体现所关切的是他有没有继续存活。
- source_word: ἵνα θάψωμεν αὐτὸν
  choice: 我们好把他埋葬
  rationale: “好”承载ἵνα加虚拟式所表达的目的意味，同时保持中文顺畅。
- source_word: μηδεὶς γνῷ
  choice: 不让任何人知道
  rationale: 保留隐瞒此事的目的性，避免译成单纯将来陈述。
