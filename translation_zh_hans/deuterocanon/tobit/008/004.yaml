base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/004.yaml
  text: And when the two of them had been shut in together[a], Tobiah rose from the bed and said, “Get up, sister[b], and let us pray that the Lord may show us mercy.”
translation:
  language: zh_hans
  text: 两人被关在一处以后[a]，多比亚从床上起来，说：“起来，姊妹[b]，让我们祷告，求主怜悯我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“二人被关在一起”或“二人被关在同一处”。语境表明他们被关在同一处；原文没有明说具体地点。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在这里直称“姊妹”；这是本叙事中多比亚对新娘使用的亲属式称呼。
    reason: cultural_note
lexical_decisions:
- source_word: συνεκλείσθησαν
  choice: 一同被关在房里
  rationale: 保留复合动词的被动语态及“一同”的含义；“在房里”依据新房语境明确中文表达，但不把动作弱化为“二人独处”。
- source_word: ἀμφότεροι
  choice: 两人
  rationale: 简明表达双方，并与“一同”配合，保留原文对二人的强调。
- source_word: ἀνέστη ... ἀπὸ τῆς κλίνης
  choice: 从床上起来
  rationale: 符合现代汉语叙事习惯，也准确表达从床上起身的动作。
- source_word: Ἀνάστηθι
  choice: 起来
  rationale: 直接保留命令语气，并与多比亚自己起身的动作形成呼应。
- source_word: ἀδελφή
  choice: 姊妹
  rationale: 按希腊文直译这一称呼，不改写成“妻子”或其他解释性称谓；脚注说明其叙事语境。
- source_word: προσευξώμεθα
  choice: 让我们祷告
  rationale: 自然表达第一人称复数劝勉式的共同提议。
- source_word: ἵνα ἡμᾶς ἐλεήσῃ ὁ κύριος
  choice: 求主怜悯我们
  rationale: 以自然庄重的中文表达祷告目的，保留“主”为施怜悯者及“我们”为受益者。
theological_decisions:
- issue: 多比亚称新娘为ἀδελφή
  choice: 正文译作“姊妹”
  alternative: 意译为“亲爱的妻子”，或省略这一亲属式称呼
  rationale: 原文明确使用“姊妹”，此处应保存亲属式语言所带来的文化与叙事张力，而不在正文中以婚姻称谓替代；用脚注防止读者误以为这否定二人的婚姻关系。
- issue: 祷告目的从句ἵνα的表达
  choice: 译作“求主怜悯我们”
  alternative: 译作“好让主怜悯我们”
  rationale: 在“让我们祷告”之后，“求主……”是现代汉语最自然的祷告目的表达，同时不把主的怜悯表述为祷告所机械导致的结果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“姊妹”比口语化的“姐姐/妹妹”更适合作为不明确长幼次序的直接称呼，也保留经文的亲属式语感。所有脚注标记均已置于正文相应位置。
