base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/002.yaml
  text: As he went in[a], he remembered the words of Raphael, and he took the ashes of the incense and placed the fish’s heart and liver on them, and made them smoke.
translation:
  language: zh_hans
  text: 他进去时[a]，想起了拉斐尔的话，就取了香灰，把鱼心和鱼肝放在上面，使它们冒出烟来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他正走时”。希腊文分词本身可泛指正在行走；这里按紧接的婚房场景理解为进去。
    reason: 保留πορευόμενος较宽泛的词义，并说明正文所采用的语境化译法。
lexical_decisions:
- source_word: πορευόμενος
  choice: 进去时
  rationale: 该现在分词表示行动过程；结合新婚之夜的房内场景，可自然理解为进入房间，同时以脚注保留较宽泛的“走着时”。
- source_word: ἐμνήσθη
  choice: 想起了
  rationale: 准确表达叙事中的回想动作，并与拉斐尔先前的吩咐相连。
- source_word: λόγων
  choice: 话
  rationale: 保留希腊文的一般词义，不直接收窄为“吩咐”，尽管上下文表明这些话具有指示性质。
- source_word: τέφραν τῶν θυμιαμάτων
  choice: 香料的灰
  rationale: τέφρα指燃烧后的灰；θυμίαμα在此指焚烧而发香的物料。“香料”比可能令人联想到成品线香的“香”更具体自然。
- source_word: ἐπέθηκεν
  choice: 放在灰上
  rationale: 明确表达“放置于……之上”的空间关系；“灰上”由前文宾语自然补明。
- source_word: καρδίαν τοῦ ἰχθύος καὶ τὸ ἧπαρ
  choice: 鱼心和鱼肝
  rationale: 以简洁、自然的现代汉语保留两个具体器官。
- source_word: ἐκάπνισεν
  choice: 使它们冒出烟来
  rationale: 该动词表示使之生烟或熏烟；此译法保留物理动作，不额外赋予技术性或宗教仪式含义。
theological_decisions:
- issue: 本节希腊短文本与较长闪语传统之间的关系
  choice: 按所给希腊文翻译具体动作，仅借上下文将πορευόμενος表达为“进去时”。
  alternative: 译作更宽泛的“走着时”，或把较长传统中的祷告情节扩写进本节。
  rationale: 希腊文是本节的首要翻译依据；平行传统可帮助确认婚房语境，却不应作为底本来增补希腊文没有的祷告内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“拉斐尔”沿用常见圣经人名译法；句式保持动作顺序清楚，不增添原文未明说的仪式解释。
