  text: And he held a wedding feast for them for fourteen days[a].
translation:
  language: zh_hans
  text: 他为他们举行了十四天的婚宴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他为他们举行了十四天的婚礼庆典。”希腊语γάμος既可指婚礼本身，也可指婚宴或婚庆活动。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: 举行了
  rationale: ποιέω与γάμον搭配时是“举行、操办”的惯用表达；“举行了”符合现代汉语，也保留原文行动的概括性。
- source_word: αὐτοῖς
  choice: 为他们
  rationale: 与格表示受益者；直译为“为他们”，上下文可明确所指是新婚夫妇。
- source_word: γάμον
  choice: 婚宴
  rationale: γάμος既可指婚礼，也可指婚筵或婚庆；因持续十四天，此处以“婚宴”最自然，但在脚注中保留“婚礼庆典”的可能。
- source_word: ἡμερῶν δέκα τεσσάρων
  choice: 十四天
  rationale: 时间属格表示持续时长；汉语在“举行了十四天”中可自然表达历时十四天。
