  naturalness: “他对他说”及“高尚善良之人的儿子”自然、庄重。“失去了双眼”在现代汉语中不够自然且可能误导；“双目失明了”清楚、符合叙事语体。“很悲伤，哭了起来”可简化为“十分伤心，便哭了”，更贴近两个并列过去动词，且不额外强调哭泣的起始。
