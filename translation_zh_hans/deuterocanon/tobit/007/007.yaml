base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/007.yaml
  text: And he said to him[a], “He is the son of a noble and good man.” And when he heard that Tobit had lost his eyes[b], he was grieved and wept.
translation:
  language: zh_hans
  text: 他对他说[a]：“他是那位高尚善良之人的儿子。”他听说托比特双目失明了[b]，就十分伤心，便哭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里有所省略，直译近于“那位高尚善良之人的”；正文按上下文补出“儿子”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“失去了视力”。希腊文更直白地说“失去了自己的双眼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου
  choice: 他是那位高尚善良之人的儿子
  rationale: 希腊文为省略式属格结构，没有明说“儿子”；结合上下文，这是身份和亲属关系的说明。正文补出“儿子”以使现代汉语清楚自然，并以脚注保留原文的省略现象。
- source_word: καλοῦ καὶ ἀγαθοῦ
  choice: 高尚善良
  rationale: 两个形容词均带褒义；“高尚”表达 καλός 在此处偏向品格可敬的含义，“善良”表达 ἀγαθός 的道德赞许，同时避免重复译作两个“好”。
- source_word: ἀκούσας
  choice: 听说
  rationale: 将希腊文过去时主动分词按时间关系译为自然的汉语承接句；此处所听见的是关于托比特的消息，“听说”贴合语境。
- source_word: ἀπώλεσεν τοὺς ὀφθαλμοὺς ἑαυτοῦ
  choice: 失去了双眼
  rationale: 保留原文具体的“眼睛”意象，而不在正文中直接解释为“失明”；脚注说明其自然语义也可表达为“失去了视力”。
- source_word: ἐλυπήθη καὶ ἔκλαυσεν
  choice: 很悲伤，哭了起来
  rationale: 分别表达悲痛和哭泣两个连续反应；措辞庄重而符合现代汉语叙事习惯。
theological_decisions:
- issue: 开头身份说明中的希腊文省略
  choice: 在正文补出“儿子”，并加脚注说明
  alternative: 直译为“那位高尚善良之人的”
  rationale: 原文有真实的句法省略，直译在现代汉语中残缺难懂。补出亲属称谓符合上下文，但不应把这一补足伪装成明文所有，因此用脚注公开说明。
- issue: 托比特眼疾的具体说法
  choice: 正文译为“失去了双眼”
  alternative: 译为“失去了视力”或“失明了”
  rationale: 正文保留希腊文具体措辞及其叙事质感；脚注给出较自然的意义表达，不进一步判定这是器官损失还是视觉功能丧失。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“高尚善良”保留两个褒义形容词的差别；“哭了起来”比单独的“哭了”更自然地承接其悲伤反应。所有补足和语义替代均以脚注标明。
