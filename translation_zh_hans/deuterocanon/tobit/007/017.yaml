  yaml_path: translation/deuterocanon/tobit/007/017.yaml
  text: Take courage[a], child; may the Lord of heaven and earth grant you favor instead of this sorrow of yours. Take courage, daughter.
translation:
  language: zh_hans
  text: “孩子，鼓起勇气！愿天地的主赐你恩惠[a]，来取代你这忧伤。女儿，鼓起勇气！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩惠”或译“恩典”；希腊语 χάρις 在这里可表达这两种意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρσει
  choice: 鼓起勇气来
  rationale: 这是 θαρσέω 的命令式，在忧伤中直接给予鼓励；此译自然、明确，并保留首尾重复。
- source_word: τέκνον
  choice: 孩子
  rationale: 这是亲昵而不特指性别的称呼；不添加原文没有的“我的”。
- source_word: ὁ κύριος
  choice: 主
  rationale: 在犹太祈愿语境中，κύριος 是对上帝的称号，译作“主”。
- source_word: τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: 天地的
  rationale: “天与地”是表示全部受造界的固定组合；汉语凝练表达为“天地的主”。
- source_word: δῴη
  choice: 愿……赐
  rationale: 希腊语祈愿式表达愿望或祝祷；“愿……赐”准确保留其语气。
- source_word: σοι χάριν
  choice: 赐恩惠给你
  rationale: χάρις 在此指上帝所赐的眷顾或恩惠；“恩惠”既保留宗教语境，也避免过度技术化。
- source_word: ἀντὶ τῆς λύπης σου ταύτης
  choice: 取代你如今的忧伤
  rationale: ἀντί 表示替代或交换；“如今”自然体现指示词 ταύτης 所指的当前忧伤。
- source_word: θύγατερ
  choice: 女儿
  rationale: 明确保留结尾由一般称呼“孩子”转为女性称呼“女儿”的变化，不添加原文没有的所有格。
theological_decisions:
- issue: 祈愿中 χάρις 的译法
  choice: 恩惠
  alternative: 恩典；眷顾
  rationale: 上下文是对忧伤新娘的祝福，而不是教义论述。“恩惠”可表达上帝慈惠的赐予，同时不把该词限定为后世神学术语；“恩典”仍是可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。保留原文首尾两次劝勉及“孩子／女儿”的称呼转换；用“取代”呈现 ἀντί 的替代含义。
