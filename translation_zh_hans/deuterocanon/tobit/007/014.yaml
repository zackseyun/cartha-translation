  text: And he called Edna his wife, and taking a document, he wrote out a marriage contract[a], and they sealed it.
translation:
  language: zh_hans
  text: 他叫来他的妻子厄德娜；取来一份文书，写了一份婚姻契约[a]；他们就把它封印了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书面协议”或“契约”；希腊语指正式的书面法律文书。这里按婚姻安排的上下文译作“婚姻契约”。
    reason: 保留 συγγραφήν 的一般法律含义，并说明本处采用较具体译法的语境依据。
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: 叫来
  rationale: 表示把人叫到跟前；现代汉语中“叫来”比单说“叫”更清楚，也不过度强调正式召见。
- source_word: Ἔδναν
  choice: 厄德娜
  rationale: 按现代汉语圣经人名音译习惯处理该希腊人名。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 妻子
  rationale: 在所属关系和家庭语境中，γυνή明确指“妻子”，不宜泛译为“女人”。
- source_word: λαβὼν βιβλίον
  choice: 拿过一份文书
  rationale: βιβλίον可指书卷或文书；此处用于书写并加印的法律安排，译作“文书”最贴合功能，同时不武断限定其物质形态。
- source_word: ἔγραψεν
  choice: 写下
  rationale: 忠实表达“写”，且自然呈现把约定写在文书上的动作。
- source_word: συγγραφήν
  choice: 婚约
  rationale: 该词指正式的书面协议或契约；上下文是婚姻安排，因此“婚约”自然准确，但脚注保留较宽泛的词义。
- source_word: ἐσφραγίσαντο
  choice: 他们便盖印确认
  rationale: 该动词为第三人称复数，须保留复数主语；“盖印”呈现具体动作，“确认”说明印记在契约中的作用，但不抽象改译为“批准”。
