  yaml_path: translation/deuterocanon/tobit/007/008.yaml
  text: And Edna his wife and Sarah his daughter wept[a], and they welcomed them eagerly.
translation:
  language: zh_hans
  text: 他的妻子厄德娜和女儿撒拉哭了，又热诚地接待了他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “热诚地”也可译作“欣然”或“热情地”；希腊文强调他们甘心乐意、全心接待客人。
    reason: 说明προθύμως所包含的主动、乐意和热情款待等语义，并保留可接受的译法差异。
lexical_decisions:
- source_word: Ἔδνα
  choice: 厄德娜
  rationale: 按希腊文人名音译，采用适合现代普通话的女性人名形式。
- source_word: ἡ γυνὴ αὐτοῦ
  choice: 他的妻子
  rationale: γυνή在这里明确表示婚姻关系，译作“妻子”自然准确。
- source_word: Σάρρα
  choice: 撒拉
  rationale: 采用该圣经人名在现代汉语中的通行译名。
- source_word: ἡ θυγάτηρ αὐτοῦ
  choice: 女儿
  rationale: 与前面的“他的妻子”并列时，汉语不必重复“他的”，所属关系仍然清楚。
- source_word: ἔκλαυσαν
  choice: 哭了
  rationale: 简洁表达不定过去时所述的哭泣事件，不额外加入“开始”等原文未明说的体貌含义。
- source_word: ὑπεδέξαντο
  choice: 接待了
  rationale: 该动词在款待来客的语境中指接纳、接待；“接待”比单纯“接受”更符合现代汉语习惯。
- source_word: αὐτούς
  choice: 他们
  rationale: 保留希腊文复数宾格代词，指来访的两人。
- source_word: προθύμως
  choice: 热诚地
  rationale: 兼顾主动乐意、全心投入和热情款待的意味；比单纯“热情地”更能体现甘心乐意的语义。
