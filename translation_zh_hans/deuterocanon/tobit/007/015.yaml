  text: And they began to eat[a]. Then Raguel called Edna his wife and said to her, “Sister[b], prepare the other room and bring her in.”
translation:
  language: zh_hans
  text: 他们就开始吃饭。拉古耳把妻子厄得纳叫来，对她说：“姊妹[a]，把另一间房[b]预备好，带她进去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “姊妹”直译希腊文对妻子的亲属式称呼；在这里是夫妻之间亲近的家庭称谓。
    reason: cultural_note
  - marker: b
    text: 或译“另一间内室”。希腊文ταμεῖον可指房间、内室或内间。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ἐσθίειν
  choice: 开始吃饭
  rationale: 保留“开始＋不定式”的起始体意义；“吃饭”比“进餐”更符合现代汉语的日常叙事语体。
- source_word: ἐκάλεσεν
  choice: 叫来
  rationale: 在家庭场景中表示把人叫到跟前；比“召来”自然，也不额外增加正式或权威色彩。
- source_word: Ἀδελφή
  choice: 姊妹
  rationale: 保留希腊文的亲属称谓及其闪语式夫妻间称呼的特点，不以现代夫妻称谓代替。
- source_word: ἑτοίμασον
  choice: 收拾好
  rationale: 就预备房间这一具体语境而言，自然表达“预备妥当”的命令语气。
- source_word: τὸ ἕτερον ταμεῖον
  choice: 另一间房
  rationale: ταμεῖον可指内室、房间或储藏室；婚礼夜晚的语境中，“房”清楚自然，同时保留ἕτερον“另一”的含义。
- source_word: εἴσαγε αὐτήν
  choice: 带她进去
  rationale: 准确表达将女性对象领入或带入室内；“她”按上下文指撒拉，但原文此处只用代词，因此正文不补出姓名。
theological_decisions: []
