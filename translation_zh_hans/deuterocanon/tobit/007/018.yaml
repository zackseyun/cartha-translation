base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/018.yaml
  text: And Raguel called Edna his wife and said to her[a], “Sister[b], prepare the other chamber and bring her in there.”
translation:
  language: zh_hans
  text: 拉古耳叫来妻子厄德娜，对她说：“姊妹[a]，把另一间内室[b]收拾好，带她进去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “姊妹”是拉古耳对妻子的称呼，并不是说二人有血缘关系。
    reason: cultural_note
  - marker: b
    text: “内室”所译的希腊语也可指“房间”或“储藏室”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφή
  choice: 姊妹
  rationale: 保留对妻子的字面称呼；这是古代带有亲属色彩的夫妻称谓，并非说明二人有血缘关系。
- source_word: ἑτοίμασον
  choice: 收拾好
  rationale: 此处命令式表示把房间预备妥当；“收拾好”符合现代汉语在预备房间这一语境中的自然表达。
- source_word: τὸ ἕτερον ταμεῖον
  choice: 另一间内室
  rationale: ἕτερον 表示“另一”，ταμεῖον 可指屋内较隐蔽的房间、内室或储藏室；婚礼叙事中译作“内室”既清楚又保留其空间含义。
- source_word: εἴσαγε αὐτήν
  choice: 带她进去
  rationale: 保留将撒拉领入该房间的方向意义，同时使用自然简洁的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“叫来”体现召唤之意；人名按希腊文音译。保留古代夫妻间“姊妹”的称呼，并以脚注避免现代读者误解。
