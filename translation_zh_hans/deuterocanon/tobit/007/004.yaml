base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/004.yaml
  text: And he said to them[a], “Do you know Tobit our brother?”
translation:
  language: zh_hans
  text: 他对他们说：“你们认识我们的弟兄[a]托比特吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“亲族”或“亲戚”；这里很可能是亲属称谓，并非指亲兄弟。
    reason: 说明希腊语 ἀδελφός 在此处可能具有较广的亲属含义。
lexical_decisions:
- source_word: Γινώσκετε
  choice: 认识
  rationale: 此处问的是对方是否与托比特相识；“认识”在现代汉语中自然地表达个人之间的相识关系，也保留了希腊语在此处的疑问语气。
- source_word: Τωβεὶτ
  choice: 托比特
  rationale: 按希腊文人名 Τωβεὶτ 音译，并采用现代汉语中清楚、易辨认的译名。
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: 我们的弟兄
  rationale: ἀδελφός 字面为“弟兄”，也可泛指亲族或同族人。正文保留原文的亲属称谓及其表达色彩，不在正文中把含义限定为某一种亲属关系。
theological_decisions:
- issue: “弟兄”是亲兄弟还是较广义的亲属称谓
  choice: 我们的弟兄
  alternative: 我们的亲族／我们的亲戚
  rationale: 上下文显示这很可能不是指同父母的亲兄弟，而是亲族或同族关系；但希腊文明确使用“弟兄”，因此正文保留这一称谓，并用脚注说明可能的较广义含义，以保存原文的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“他对他们说”贴近希腊文叙述句式；问句则按现代汉语习惯表达。
