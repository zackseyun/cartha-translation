base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/002.yaml
  text: And Edna said to his wife[b][a], “How much the young man Tobit resembles my nephew!”
translation:
  language: zh_hans
  text: 埃德娜对他的妻子说[a]：“这个年轻人多么像我的侄子[b]托比特啊！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“埃德娜对他的妻子说”；闪语平行文本则作拉古埃尔对他的妻子埃德娜说。结合上下文看，这里可能存在文本或传抄上的错乱。
    reason: textual_variant
  - marker: b
    text: 或译“男性近亲”。这里的希腊词也可指堂兄弟、表兄弟等男性亲属。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν
  choice: 说
  rationale: 按现代汉语叙事习惯省去句首连接词“καί”的机械对应，以自然的过去叙事表达承接上下文。
- source_word: Ἔδνα
  choice: 埃德娜
  rationale: 按希腊文人名音译，并采用现代汉语易读的形式。
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: 对他的妻子
  rationale: γυνή在此明确指妻子；保留αὐτοῦ的第三人称阳性领属关系，不因上下文困难而擅自改作“对她的丈夫”或“对埃德娜”。
- source_word: Ὡς ὅμοιος
  choice: 多么像……啊
  rationale: ὡς在此引出感叹，ὅμοιος表达相似；汉语感叹结构自然传达原文语气。
- source_word: ὁ νεανίσκος
  choice: 这个年轻人
  rationale: νεανίσκος指年轻男子；“这个”在当面对其外貌作评论的语境中自然呈现希腊语定冠词的指示语用。
- source_word: Τωβεὶτ
  choice: 托比特
  rationale: 将希腊文专名音译；其与带定冠词的τῷ ἀνεψιῷ μου构成同位关系，即“我的外甥托比特”。
- source_word: τῷ ἀνεψιῷ μου
  choice: 我的外甥
  rationale: ἀνεψιός可指外甥、侄子或堂表兄弟等男性近亲；正文采用较具体且符合希腊词常见意义的“外甥”，并在脚注保留较宽泛的可能。
theological_decisions:
- issue: 说话者与领属代词之间的文本困难
  choice: 依现存希腊文译为“埃德娜对他的妻子说”
  alternative: “拉古埃尔对他的妻子埃德娜说”
  rationale: 希腊文明确以Ἔδνα为主语，同时写τῇ γυναικὶ αὐτοῦ“对他的妻子”，在语境中显得反常；间接希伯来平行材料则是拉古埃尔对妻子埃德娜说。正文不静默修订主要希腊文本，而以脚注说明异文及传抄问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。正文严格保留希腊文本中说话者与“他的妻子”之间的不协调，并用脚注交代闪语平行文本；感叹句使用自然汉语“多么像……啊”。
