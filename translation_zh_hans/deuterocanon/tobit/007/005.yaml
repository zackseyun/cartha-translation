  yaml_path: translation/deuterocanon/tobit/007/005.yaml
  text: They said[a], “He is alive and well.” And Tobiah said[b], “He is my father.”
translation:
  language: zh_hans
  text: 他们回答说[a]：“他还活着，身体也很好。”多比雅说[b]：“他是我父亲。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“他活着，并且健康。”
    reason: 保留原文两个并列动词的形式，说明正文采用了自然的汉语表达。
  - marker: b
    text: “多比雅”也有传统译名“多俾亚”；英语传统形式常作Tobias。
    reason: 说明人名的传统异译，并与英文审校记录一致。
lexical_decisions:
- source_word: ζῇ
  choice: 还活着
  rationale: 此处回答关于多比特近况的询问；“还活着”自然表达希腊语现在时所指的存活状态。
- source_word: ὑγιαίνει
  choice: 身体也很好
  rationale: ὑγιαίνω指健康、安好；与“还活着”并列时，这一译法符合现代汉语对近况的自然表述。
- source_word: Πατήρ μου
  choice: 我父亲
  rationale: 直接表达第一人称所属关系，现代汉语在系词句中用“我父亲”自然且庄重。
- source_word: Τωβίας
  choice: 多比雅
  rationale: 采用贴近其闪语背景的常用中文音译，并与多比特这一父名作出区分。
- source_word: οἱ δὲ εἶπαν
  choice: 他们回答说
  rationale: 字面为“他们说”；上下文中这是对询问的回应，译为“回答说”使汉语衔接自然而不增添实质内容。
theological_decisions:
- issue: Τωβίας的人名形式
  choice: 多比雅
  alternative: 多俾亚／托比亚斯
  rationale: 人名形式不涉及教义判断；“多比雅”较能反映希腊形式背后的闪语名字，也可清楚区别于其父多比特。
translation_notes:
  register: 采用现代、自然而庄重的叙事口吻。“还活着，身体也很好”符合普通话问候近况的表达，同时保留ζῇ与ὑγιαίνει的并列意义。
