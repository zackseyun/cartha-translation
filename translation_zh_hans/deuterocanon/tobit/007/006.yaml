    reason: textual_variant
lexical_decisions:
- source_word: ἀνεπήδησεν
  choice: 一跃而起
  rationale: 该动词表示突然、急切地跃起或起身；“一跃而起”既保留动作的迅速和情感张力，也符合现代汉语叙事表达。
- source_word: κατεφίλησεν
  choice: 热切地亲吻他
  rationale: 这一复合动词比普通的“亲吻”语气更强，可表示深情或反复亲吻；“热切地亲吻”传达其加强意味，同时不增添原文未明说的拥抱动作。
- source_word: ἔκλαυσε
  choice: 哭了起来
  rationale: 该词指流泪哭泣；“哭了起来”自然地表现叙事中动作的发生，并与重逢场景相称。
- source_word: Ῥαγουὴλ
  choice: 拉贵耳
  rationale: 按希腊文人名形式音译，并采用现代中文中《多俾亚传》相关人名的通行形式。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性单数代词在上下文中指多俾亚；中文直译为“他”。
