  text: 拉贵耳一跃而起，亲吻他[a]，哭了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文中“亲吻”一词的语气强于一般的“亲吻”，可含深情或反复亲吻之意。
    reason: lexical_alternative
  - marker: b
