  text: And he conveyed the matter to Raguel. And Raguel said to Tobiah, “Eat, drink, and be glad, for it is fitting for you to take my child; but I will explain the truth.”
translation:
  language: zh_hans
  text: 他把这事告诉了拉古耳。拉古耳对多比雅说：“吃吧，喝吧，欢喜快乐吧，因为你娶我的女儿是合宜的；不过，我要把实情告诉你。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετέδωκεν τὸν λόγον
  choice: 把这事告诉了
  rationale: μεταδίδωμι在此表示把所谈之事传达给对方；“这事”自然承接上下文，比直译“传递话语”更符合现代汉语。
- source_word: ἡδέως γίνου
  choice: 欢欢喜喜的
  rationale: 该表达劝人放宽心、愉快用餐；保留喜乐之意，同时采用饭桌场景中自然的汉语措辞。
- source_word: καθήκει
  choice: 是合宜的
  rationale: 保留“适合、应当”的语义，不加强为法律权利或绝对命定。
- source_word: τὸ παιδίον μου λαβεῖν
  choice: 娶我的女儿
  rationale: λαμβάνω在婚姻语境中指娶妻；παιδίον字面为“孩子”，但此处明确指拉古耳的女儿，因此按汉语习惯明说“女儿”。
- source_word: ὑποδείξω τὴν ἀλήθειαν
  choice: 把实情告诉你
  rationale: ὑποδείκνυμι在此有说明、告知之意，ἀλήθεια指即将披露的真实情况；“实情”符合语境。
theological_decisions:
- issue: “你娶我的女儿是合宜的”是否表达婚姻权利或神圣命定
  choice: 保留为一般性的“合宜”判断
  alternative: 译作“只有你有权娶我的女儿”或“你命中注定要娶我的女儿”
  rationale: 原文καθήκει本身没有明确说“唯一权利”或“命定”，不应把后文或特定婚姻制度解释预先写入正文。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。人物名按《多俾亚传》希腊名形式音译为“拉古耳”“多比雅”；直接引语保留劝饮食、喜乐以及随后转折披露实情的节奏。
