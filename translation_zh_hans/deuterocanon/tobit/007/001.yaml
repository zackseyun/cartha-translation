base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/001.yaml
  text: And he came to Ecbatana and arrived at the house of Raguel[a], and Sarah also met him. She greeted him, and he greeted them[b], and he brought them into the house.
translation:
  language: zh_hans
  text: 他到了厄克巴坦，来到了拉古耳的家。撒拉也迎接了他。她向他问安，他也向他们问安；他领他们进了屋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希腊文先说撒拉向“他”（单数）问安，随后说“他”向“他们”（复数）问安。末句“领他们进了屋”的主语也是未明说的单数；正文依原文保留为“他”，但原文没有指出此人是谁。平行的闪语传统同样记述众人来到拉古耳家并彼此问安，不过措辞和细节有所不同。
    reason: alternative_reading
lexical_decisions:
- source_word: ἦλθεν
  choice: 到了
  rationale: 表示来到厄克巴坦这一城市；用“到了”自然呈现叙事中的抵达动作。
- source_word: παρεγένετο
  choice: 来到
  rationale: 在前一个动作之后进一步说明抵达具体地点，即拉古耳的家，同时避免两个动词完全合并。
- source_word: οἰκίαν
  choice: 家／屋
  rationale: 首次指拉古耳的住所时译“家”，末句强调进入建筑内部时译“屋”，符合现代汉语表达而不改变所指。
- source_word: ὑπήντησεν
  choice: 出来迎接
  rationale: 该词表示前去与来者相遇；“出来迎接”既传达主动相迎，也与后面的问安动作保持区别。
- source_word: ἐχαιρέτισεν
  choice: 向……问安
  rationale: 准确表达礼貌问候，在庄重而自然的现代汉语中比“致意”更具叙事感。
- source_word: αὐτὸς αὐτούς
  choice: 他也向他们问安
  rationale: 保留希腊文由单数男性主语转向复数宾语的代词形式，不擅自补出未明说的人名或群体。
- source_word: εἰσήγαγεν
  choice: 领……进了
  rationale: 表达带领人进入屋内的动作，语气自然，也保留单数隐含主语。
- source_word: Ἐκβάτανα
  choice: 厄克巴坦
  rationale: 依希腊文地名音译，并采用适合现代汉语的形式。
- source_word: Ῥαγουήλ
  choice: 拉古耳
  rationale: 按希腊文人名音译，保持本书人名形式的可辨识度。
- source_word: Σάρρα
  choice: 撒拉
  rationale: 采用该名字在中文圣经传统中通行且易懂的译名。
theological_decisions:
- issue: 末句隐含主语的身份
  choice: 保留为“他”
  alternative: 明确译作“拉古耳领他们进了屋”或改作“撒拉领他们进了屋”
  rationale: 希腊文 εἰσήγαγεν 是第三人称单数，却没有明说主语。就语法衔接而言，可承接前句的男性单数 αὐτός，故正文保留“他”，但不以专名消除原文的含混。
- issue: 问安句中的单复数转换
  choice: 译作“她向他问安，他也向他们问安”
  alternative: 将宾语统一为单数或复数
  rationale: 原文先用单数 αὐτόν，随后用复数 αὐτούς。虽然所指略显突兀，仍保留这一变化，以免替原文整理人物关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“问安”保留古代待客场景的礼貌色彩；代词的单复数变化及末句主语的不确定性均予以保留，并通过脚注说明。
