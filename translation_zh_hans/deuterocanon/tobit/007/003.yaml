  yaml_path: translation/deuterocanon/tobit/007/003.yaml
  text: And Raguel asked them[a], “Where are you from, brothers?” And they said to him, “We are from the sons of Naphtali[b], the captives from Nineveh.”
translation:
  language: zh_hans
  text: 拉古耳问他们：“弟兄们，你们是哪里人？”他们回答：“我们是拿弗他利的子孙[a]，是从尼尼微来的被掳之人[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“拿弗他利的众子”；这里也可译作“拿弗他利的后裔”或“拿弗他利支派的人”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“从尼尼微来的流亡者”。原文称他们为“被掳之人”，着重表明他们遭强制迁徙的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησεν
  choice: 问
  rationale: 这是叙事中表示提出问题的常用动词；“问”自然、准确，不必译得过于正式。
- source_word: Πόθεν ἐστέ
  choice: 你们是哪里人
  rationale: 以现代汉语自然地询问籍贯或来处，准确传达希腊语关于来源的问句。
- source_word: ἀδελφοί
  choice: 弟兄们
  rationale: 保留原文阳性复数称呼及其亲切语气；“弟兄们”在庄重叙事中自然可懂。
- source_word: Ἐκ τῶν υἱῶν Νεφθαλεὶ
  choice: 是拿弗他利的子孙
  rationale: υἱοί字面为“儿子们”，在这里指拿弗他利的后裔或支派成员；“子孙”既保留族裔意味，也符合现代汉语表达。
- source_word: τῶν αἰχμαλώτων
  choice: 被掳之人
  rationale: 保留该词所强调的强制迁徙和被俘身份；相比单纯的“流亡者”，没有淡化被掳的意味。
- source_word: ἐκ Νινευή
  choice: 从尼尼微来的
  rationale: 直接体现介词ἐκ的来源义，同时在汉语中清楚表示说话者从尼尼微而来，避免误解为他们是在尼尼微本地被俘。
