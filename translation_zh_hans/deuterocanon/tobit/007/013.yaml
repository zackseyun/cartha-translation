  yaml_path: translation/deuterocanon/tobit/007/013.yaml
  text: And he called Sarah his daughter[a], and taking her by the hand he gave her to Tobiah as a wife, and he said, “See, according to the law of Moses, take her and bring her to your father.” And he blessed them.
translation:
  language: zh_hans
  text: 他叫来自己的女儿撒拉，拉着她的手，把她交给多比雅为妻，说：“看哪，你就按照摩西的律法接她[a]，带她到你父亲那里去。”他祝福了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带上她”。这里的希腊语可指接收、取得或带上；下一句已明确表达带领她到父亲那里去。
    reason: 保留κομίζου在此处“接收”与“带上”之间的词义幅度，并说明其与后续命令的关系。
lexical_decisions:
- source_word: ἐκάλεσεν Σάρραν τὴν θυγατέρα αὐτοῦ
  choice: 他叫来自己的女儿撒拉
  rationale: ἐκάλεσεν在此表示叫人前来；“叫来”比单说“叫”更清楚地呈现叙事动作。“自己的”明确αὐτοῦ的所属关系，又符合现代汉语表达。
- source_word: λαβὼν τῆς χειρὸς αὐτῆς
  choice: 拉着她的手
  rationale: 保留父亲牵住女儿之手的具体动作，同时采用自然的现代汉语，而不把分词结构译得生硬。
- source_word: παρέδωκεν αὐτὴν Τωβείᾳ γυναῖκα
  choice: 把她交给多比雅为妻
  rationale: παρέδωκεν在此指婚姻中的交付，并无“出卖”或敌意含义；“为妻”准确表达γυναῖκα的表语功能。
- source_word: Ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的语气及叙事庄重感；“看哪”虽略带书面色彩，但在经文语体中自然且易懂。
- source_word: κατὰ τὸν νόμον Μωυσέως
  choice: 按照摩西的律法
  rationale: 直译法律依据，并明确保留原文对摩西的点名，不弱化为泛称的“律法”。
- source_word: κομίζου αὐτὴν
  choice: 你接过她
  rationale: κομίζου可表示取得、接收或带上；婚嫁交付的场景中“接过她”自然地承接前句，也与下一命令所表达的带领行动有所区分。
- source_word: ἄπαγε πρὸς τὸν πατέρα σου
  choice: 领她到你父亲那里去
  rationale: ἄπαγε表达带领离开并前往指定地点；“领她……去”保留行动方向，也符合说话者所在位置。
- source_word: εὐλόγησεν αὐτούς
  choice: 他就为他们祝福
  rationale: 直接呈现祝福行为；“他们”保留复数宾语，指新婚二人。连接词译作“就”，使汉语叙事连贯。
theological_decisions:
- issue: 次经叙事中对摩西律法的明确援引
  choice: 保留“按照摩西的律法”
  alternative: 按照律法；按照我们的律法
  rationale: 希腊文明确写出摩西之名。译文只呈现叙事本身的法律依据，不加入对本书历史性或正典地位的后设判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。人名译作“撒拉”“多比雅”。婚姻交付场景以“交给……为妻”表达，忠实保留古代叙事动作而不作现代化解释。脚注标记置于实际存在词义选择的“接过她”之后。
