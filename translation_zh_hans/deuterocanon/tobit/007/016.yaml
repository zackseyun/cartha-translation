  yaml_path: translation/deuterocanon/tobit/007/016.yaml
  text: And he did as he said and brought her in there[a], and she wept. Then he received the tears of his daughter and said to her,
translation:
  language: zh_hans
  text: 于是，她照他所说的做了，把她领到那里去；她便哭了。随后，他接纳了女儿的泪水[a]，对她说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译作“她女儿的泪水”，其中所有格代词为阴性；但上下文显示，接纳泪水并接着说话的是拉古耳，而这女儿是撒拉。动词“接纳”也可译为“接受”或“领受”；原文并没有“擦去”的意思。
    reason: 说明希腊文所有格代词形式与叙事情境之间的不协调，并保留ἀπεδέξατο与“泪水”搭配的词义张力。
lexical_decisions:
- source_word: ἐποίησεν ὡς εἶπεν
  choice: 她照他所说的做了
  rationale: 保留“照……所说的做”这一简明结构。希腊文动词未明示主语，但结合上文吩咐那女子带女儿进去的情境，译作“她”；“他”指发出吩咐的人。
- source_word: εἰσήγαγεν αὐτὴν ἐκεῖ
  choice: 把她领到那里
  rationale: εἰσάγω表示领入或带入；“领到那里”自然保留ἐκεῖ，并不暗示强迫。
- source_word: ἔκλαυσεν
  choice: 便哭了
  rationale: κλαίω表示哭泣；沿用前句隐含的女性主语最符合叙事连贯性，同时不额外说明哭泣方式。
- source_word: ἀπεδέξατο
  choice: 接纳了
  rationale: ἀποδέχομαι可指接受、接纳或欣然领受。与“泪水”搭配带有比喻色彩；译作“接纳”保留原文不寻常的表达，避免擅自改成“擦去”或“安慰”。
- source_word: τὰ δάκρυα τῆς θυγατρὸς αὐτῆς
  choice: 女儿的泪水
  rationale: αὐτῆς为阴性，按希腊文和上下文应理解为这女子自己的女儿；现代汉语中不必重复“她的”，以免累赘。
- source_word: εἶπεν αὐτῇ
  choice: 对她说
  rationale: 采用现代汉语中自然、庄重的引语引介方式，并以冒号表明话语在下一节继续。
theological_decisions:
- issue: 叙事中未明示主语的辨认
  choice: 将ἐποίησεν、εἰσήγαγεν、ἔκλαυσεν和ἀπεδέξατο的主语理解为上文受托带女儿进去的女子
  alternative: 把这些动作的主语理解为发出吩咐的男子，或把ἔκλαυσεν单独理解为被领进去的女儿
  rationale: 希腊文第三人称单数动词本身不标示性别，但τῆς θυγατρὸς αὐτῆς中的阴性代词以及连续叙事更支持女性照吩咐行事、领女儿进去并回应女儿的眼泪。此判断属于语法和语境辨认，不涉及教义立场。
- issue: ἀπεδέξατο与“泪水”的不寻常搭配
  choice: 保留为“接纳了女儿的泪水”
  alternative: 释义为“擦去女儿的眼泪”或“安慰哭泣的女儿”
  rationale: 现有希腊文本使用ἀποδέχομαι，而不是通常表示“擦去”的动词。为尊重原文证据，正文保留其接受、接纳的比喻张力，并用脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。因希腊文隐含主语，中文必须补出代词；据上下文使用女性“她”。不沿用英语咨询层把行动者改作男性的处理，因为这与希腊文阴性αὐτῆς及叙事脉络不合。
