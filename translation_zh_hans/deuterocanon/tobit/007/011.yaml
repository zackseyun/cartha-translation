  yaml_path: translation/deuterocanon/tobit/007/011.yaml
  text: I gave my child to seven men[a], and whenever they went in to her, they died during the night. But for now, be cheerful. And Tobiah said[b], “I will taste nothing here until you settle and conclude the matter with me.”
translation:
  language: zh_hans
  text: “我曾把我的孩子许配给七个男人[a]；每逢他们与她同房，就在夜里死去。不过现在，你要宽心。”多比雅说[b]：“在你们把这件事定下来、同我达成协议以前，我在这里什么也不吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“七个男人”；按上下文，他们是与她婚配的男子，所以也可译作“七个丈夫”。
    reason: lexical_alternative
  - marker: b
    text: 这里希腊文最后一句的措辞和确切含义较难确定。正文按上下文理解为：多比雅拒绝吃东西，直到婚事定下来，并同他达成协议。
    reason: textual_variant
lexical_decisions:
- source_word: τὸ παιδίον μου
  choice: 我的孩子
  rationale: παιδίον直译为“孩子、幼小者”；上下文明确指拉贵耳的女儿撒拉，但保留父亲带感情色彩的称呼，不在正文中改作“女儿”。
- source_word: ἑπτὰ ἀνδράσιν
  choice: 七个男人
  rationale: ἀνήρ既可指“男人”，也可指“丈夫”。这里婚配含义由语境提供，正文保留较宽泛的词义，并以“许配给”使句意自然；脚注说明“丈夫”的可能译法。
- source_word: ὁπότε ἐὰν εἰσεπορεύοντο πρὸς αὐτήν
  choice: 每逢他们与她同房
  rationale: 该表达在婚姻语境中是性关系的委婉说法；“与她同房”是现代汉语中自然、庄重且同样委婉的对应表达。
- source_word: ἀπέθνησκον ὑπὸ νύκτα
  choice: 就在夜里死去
  rationale: ὑπὸ νύκτα表示夜间发生；未完成时在此描述每次重复出现的结果，“就……死去”自然传达这一关系。
- source_word: ἀλλὰ τὸ νῦν ἔχων ἡδέως γίνου
  choice: 不过现在，你要宽心
  rationale: 传世希腊文措辞略显生硬，整体是劝对方安心、振作；“宽心”比“高兴”更符合此处沉重语境，也保持现代庄重语体。
- source_word: Οὐ γεύομαι οὐδὲν ὧδε
  choice: 我在这里什么也不吃
  rationale: γεύομαι本义为“尝”，也可泛指进食。汉语用“什么也不吃”自然表达拒绝用餐，避免“什么也不尝”的生硬感。
- source_word: ἕως ἂν στήσητε καὶ σταθῆτε πρὸς μέ
  choice: 在你们把事情议定、与我立约以前
  rationale: 原文双重动词的句法和确切含义困难。结合婚约语境，此译保留“确立并正式承诺”的两层动作，同时以脚注承认原文的不确定性。
