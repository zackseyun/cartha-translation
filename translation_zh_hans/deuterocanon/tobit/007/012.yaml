  yaml_path: translation/deuterocanon/tobit/007/012.yaml
  text: And Raguel said[a], “Take her from now on according to the judgment. You are her brother, and she is yours[c][b]. And may the merciful God prosper what is best for you.”
translation:
  language: zh_hans
  text: 拉古耳说：“从现在起，你要按照裁决接纳她[a]。你是她的弟兄[b]，她也是你的。愿怜悯人的上帝使你们得享最美好的事[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按照裁决”也可译作“按照判定”或“按照法定的决定”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”是亲族称谓，指按家族习俗有资格娶她的近亲，并不是说他是她的同胞兄弟。
    reason: cultural_note
  - marker: c
    text: 这句话也可较直译为：“怜悯人的上帝必使最美好的事为你们顺遂。”希腊文使用将来时；在这里也可理解为祝福或祈愿。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κομίζου αὐτὴν
  choice: 接纳她
  rationale: κομίζω的中间语态命令式在此婚姻语境中表示将撒拉接过来、接纳为妻。“接纳她”既保留命令的直接性，也比单说“带走她”更自然，并避免把原文没有明说的“为妻”直接加进正文。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从现在起
  rationale: 直接表达新关系从此刻开始，符合现代汉语。
- source_word: κατὰ τὴν κρίσιν
  choice: 按照裁决
  rationale: κρίσις可指判断、判决或具有约束力的决定。“裁决”保留正式和法律性的色彩，同时不具体断定作出裁决的机制。
- source_word: ἀδελφὸς
  choice: 弟兄
  rationale: 原文直称“弟兄”，但在此处是较宽泛的亲族称谓。正文保留原词的亲属语言，以脚注说明并非指同胞兄弟。
- source_word: ἐλεήμων
  choice: 怜悯人的
  rationale: 准确传达主动施怜悯的含义；比单说“慈爱”更贴近ἐλεήμων。
- source_word: εὐοδώσει
  choice: 使……顺利成就
  rationale: εὐοδόω有使顺利、使成功之义。此译保留使役和兴盛、顺遂的语义，又适合汉语祝福语境。
- source_word: τὰ κάλλιστα
  choice: 最美好的事
  rationale: 保留中性复数最高级的开放含义，不把它具体化为财富、福分或婚姻幸福。
theological_decisions:
- issue: 婚姻语境中的亲属称谓
  choice: 正文保留“弟兄”，脚注说明是近亲称谓
  alternative: 正文直接译作“亲属”或“族亲”
  rationale: 希腊文本明确使用ἀδελφός。保留该词可呈现原文的亲族语言，又不在正文中替原文消除其张力。
- issue: 祝福语中的将来时直陈语气
  choice: 按祝愿语气译作“愿……使……”
  alternative: 按预测或保证译作“……必使……”
  rationale: 希腊文形式上是将来时直陈语气，但在这一祝福场景中可具有祈愿功能。正文采用自然的汉语祝福表达，脚注保留直译为将来陈述的可能。
- issue: τὰ κάλλιστα所指为何
  choice: 保持为未具体限定的“最美好的事”
  alternative: 具体译为“最好的福分”或“凡事顺遂”
  rationale: 原文没有限定这些“最美好的事”具体是什么，不应加入物质兴盛或特定婚姻结果等解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与祝福语体。“接纳她”避免生硬的“带走她”，同时不把“娶她为妻”这一语境信息擅自扩写进正文；“她也是你的”保留原文简洁而带法律确认意味的表达。
