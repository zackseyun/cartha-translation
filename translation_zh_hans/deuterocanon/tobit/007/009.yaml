  text: And they slaughtered a ram from the flock and set out many dishes. Then Tobiah said to Raphael, “Azariah, brother, speak about the matter you were talking about on the journey, and let the matter be brought to completion.”
translation:
  language: zh_hans
  text: 他们从羊群中宰了一只公绵羊，又摆上许多菜肴。多比雅对拉斐尔说：“亚撒利雅弟兄，请谈谈你在路上所说的那件事，让这件事办成吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθυσαν
  choice: 宰了
  rationale: 此处语境是预备宴席，译作“宰了”自然准确；不以“献祭”引入原文未明确表达的礼仪含义。
- source_word: κριὸν προβάτων
  choice: 一只公绵羊
  rationale: κριός指公羊，προβάτων表明它取自羊群；正文以自然汉语表达其核心所指。
- source_word: ὄψα πλείονα
  choice: 许多菜肴
  rationale: ὄψα在宴席语境中指佐餐食物或菜肴，πλείονα表示数量丰富。
- source_word: ἀδελφέ
  choice: 弟兄
  rationale: 保留亲切称呼及古代称谓色彩，同时符合庄重、易懂的现代汉语。
- source_word: λάλησον ὑπὲρ ὧν ἔλεγες
  choice: 把你在路上所说的那件事提出来
  rationale: 结合后文单数τὸ πρᾶγμα，所指是旅途中谈及的婚事；译文保留含蓄指称，不提前明说具体内容。
- source_word: τελεσθήτω τὸ πρᾶγμα
  choice: 让这事办成吧
  rationale: τελεσθήτω表达事情得到完成、落实；“办成”符合请求对方促成此事的语境。
theological_decisions:
- issue: ἔθυσαν是否带有献祭含义
  choice: 按宴席语境译为“宰了”
  alternative: “献祭了一只公绵羊”
  rationale: 紧接着摆设菜肴，文本未交代祭坛、献给神或礼仪行动，因此不强化为宗教献祭。
- issue: 是否明说所谈之事是婚事
  choice: 保留为“那件事／这事”
  alternative: “提说婚事，让婚事办成”
  rationale: 原文以关系代词和泛称名词含蓄表达，应保留叙事中的指代方式，避免解释性增译。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事体。“亚撒利雅弟兄”保留直接称呼，“请……让……吧”传达命令式在亲近关系中的请求语气。
