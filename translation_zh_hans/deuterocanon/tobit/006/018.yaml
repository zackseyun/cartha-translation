base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/018.yaml
  text: Then the demon will smell it and flee[a], and it will never return forever. But when you go in to her, rise, both of you, and cry out to the merciful God, and he will save you and have mercy on you. Do not fear, because she had been prepared for you from eternity, and you will save her, and she will go with you, and I suppose that you will have children by her. And when Tobias heard these things, he kissed her[d][c][b], and his soul was bound to her very strongly.
translation:
  language: zh_hans
  text: 那鬼魔闻到这气味，就会逃跑，并且永永远远不再回来。[a] 但你到她那里去的时候[b]，你们两人要起来，向慈悲的上帝呼求；他必拯救你们，怜悯你们。不要害怕，因为她从亘古就已经为你预备好了[c]。你会救她，她也会跟你走。我想，你会从她得着儿女。”多比亚听见这些话，就亲吻了她；他的心灵与她深深相连。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“直到永永远远都不再回来”。希腊语采用强调性的习语，表示它永久不再返回。
    reason: lexical_alternative
  - marker: b
    text: “到她那里去”在这里是婚姻语境中的含蓄说法，指多比亚以丈夫的身份亲近撒拉。
    reason: cultural_note
  - marker: c
    text: “从亘古”也可理解为“从古时”或“从很久以前”。希腊语既可表示遥远的古时，也可能指向永恒的时间范围。
    reason: alternative_reading
  - marker: d
    text: “心灵与她深深相连”直译近于“他的魂紧紧黏附于她”，生动表达深切而牢固的依恋，并非一时的好感。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσφρανθήσεται
  choice: 闻到这气味
  rationale: 保留动词具体的嗅觉含义，并按上下文补出“这气味”，使现代汉语表达完整自然。
- source_word: τὸ δαιμόνιον
  choice: 那鬼魔
  rationale: 该词明确指邪灵；“鬼魔”既准确，又符合庄重的经文语体。“那”承接上下文所说的特定鬼魔。
- source_word: οὐκ ἐπανελεύσεται τὸν αἰῶνα τοῦ αἰῶνος
  choice: 永永远远不再回来
  rationale: 以汉语常用的强调式表达永久不再返回，保留希腊语“直到世世代代”式习语的强烈语气。
- source_word: προσπορεύῃ αὐτῇ
  choice: 到她那里去
  rationale: 正文采用含蓄自然的表达，不把语义缩窄为一般的“靠近”；脚注说明其婚姻语境中的夫妻含义。
- source_word: ἐγέρθητε ἀμφότεροι
  choice: 你们两人要起来
  rationale: 直接保留复数命令和“两人都”的信息，语气清楚而庄重。
- source_word: βοήσατε πρὸς τὸν ἐλεήμονα θεόν
  choice: 向慈悲的上帝呼求
  rationale: “呼求”保留βοάω急切呼喊求助的力度；“慈悲”准确传达ἐλεήμων。
- source_word: σώσει ὑμᾶς καὶ ἐλεήσει
  choice: 他必拯救你们，怜悯你们
  rationale: 并列保留“拯救”与“怜悯”两个动作，不将二者合并或淡化。
- source_word: ἡτοίμασμένη ἦν ἀπὸ τοῦ αἰῶνος
  choice: 从亘古就已经为你预备好了
  rationale: “亘古”保留该时间表达可能具有的强烈、久远意味；被动式不擅自明说预备者。脚注保留“很久以前”的可能。
- source_word: σὺ αὐτὴν σώσεις
  choice: 你会救她
  rationale: 与前面的σώσει同译为“拯救／救”，同时在此采用自然简洁的“救她”；上下文指从鬼魔带来的致命威胁中获救。
- source_word: πορεύσεται μετὰ σοῦ
  choice: 她也会跟你走
  rationale: 直接呈现同行的普通含义，不额外限定为某种特定旅程。
- source_word: ὑπολαμβάνω
  choice: 我想
  rationale: 保留说话者推想或预期的语气，不强化为确定的启示性宣告。
- source_word: ἐξ αὐτῆς παιδία
  choice: 从她得着儿女
  rationale: 自然表达由这婚姻生育儿女，同时贴近介词ἐξ的来源含义。
- source_word: ἡ ψυχὴ αὐτοῦ ἐκολλήθη αὐτῇ σφόδρα
  choice: 他的心灵与她深深相连
  rationale: 保留ψυχή和“黏合、联结”的生动意象，并以现代汉语可理解的方式表达深厚依恋。
theological_decisions:
- issue: ἀπὸ τοῦ αἰῶνος描述撒拉为多比亚预备时的时间力度
  choice: 从亘古
  alternative: 从很久以前
  rationale: 原文可指遥远的古时，也可能具有自永恒以来的视野。“从亘古”保留较强的神学张力，但脚注明示较弱的时间理解，避免把歧义静默消除。
- issue: “你会救她”的含义
  choice: 保留“救”，按叙事直接理解为脱离鬼魔造成的致命威胁
  alternative: 保护她；在广义属灵意义上拯救她
  rationale: 上下文集中于鬼魔逃离和撒拉免遭死亡；正文保留σῴζω的用词力度，却不导入原文未明说的后期救恩论含义。
- issue: 撒拉被“预备”的施事者
  choice: 保持被动，不在正文补出“上帝”
  alternative: 上帝从亘古为你预备了她
  rationale: 语境容易让人理解为上帝的安排，但希腊文本采用被动表达；保留被动可避免把隐含施事者变成明说的命题。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“鬼魔”“呼求”“亘古”等词保留经文语体的分量，但避免生僻古奥；婚姻用语保持含蓄，并以脚注澄清。各脚注标记均放在正文所解释的相应语句之后。
