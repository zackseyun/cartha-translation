  text: But the angel said to him, “Grab the fish.” So the boy seized the fish and threw it up onto the land.
translation:
  language: zh_hans
  text: 天使对他说：“抓住那条鱼！”于是少年抓住鱼，把它扔到岸上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιλαβοῦ τοῦ ἰχθύος
  choice: 抓住那条鱼
  rationale: ἐπιλαμβάνομαι在此是实际抓住、擒住之意；“抓住”自然有力，也符合紧急命令的语气。
- source_word: τὸ παιδάριον
  choice: 少年
  rationale: παιδάριον指年轻男孩或少年；此处用“少年”既符合叙事身份，又比“小孩子”更适合多比雅的角色。
- source_word: ἀνέβαλεν αὐτὸν ἐπὶ τὴν γῆν
  choice: 把它扔到岸上
  rationale: ἀναβάλλω在此表示把鱼向上抛到陆地；河边语境下将γῆ具体表达为“岸上”，是自然且不改变场景的中文。
theological_decisions: []
