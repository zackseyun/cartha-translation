base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/002.yaml
  text: As they were traveling on the road[a], they came by evening to the Tigris River, and they camped there.
translation:
  language: zh_hans
  text: 他们一路前行，傍晚来到底格里斯河边，就在那里过夜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文短本只说他们傍晚抵达底格里斯河，并在那里过夜。较长的闪语传统（长本传统）则在此处随即扩展接下来的鱼的情节。
    reason: textual_variant
lexical_decisions:
- source_word: πορευόμενοι τὴν ὁδόν
  choice: 一路前行
  rationale: 这一表达描写他们在路上持续行进。“一路前行”既保留分词所呈现的行程过程，也符合现代汉语习惯。
- source_word: ἦλθον ἑσπέρας
  choice: 傍晚来到
  rationale: 该短语交代抵达的时间；“傍晚来到”简洁自然，不额外断定是傍晚之前还是傍晚之时。
- source_word: ἐπὶ τὸν Τίγριν ποταμόν
  choice: 来到底格里斯河边
  rationale: ἐπί与趋向语境表示到达河流所在之处；汉语以“河边”自然表达抵达河岸，而不是进入河中。
- source_word: ηὐλίζοντο
  choice: 过夜
  rationale: 此动词指旅途中投宿或留宿一夜。“过夜”忠实保留核心意义，同时避免“宿营”可能暗示帐篷等原文未明说的细节。
- source_word: ἐκεῖ
  choice: 在那里
  rationale: 直接对应地点副词，清楚指向底格里斯河边。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“一路前行”体现行程的持续性；“过夜”比“宿营”更严格地避免加入原文未说明的装备或住宿方式。
