base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/006.yaml
  text: And the young man did as the angel told him. Then they roasted the fish and ate it[a], and both of them traveled on until they came near Ecbatana.
translation:
  language: zh_hans
  text: 少年就照天使对他所说的去做了。他们把鱼烤熟，吃了，然后两人继续赶路，直到临近埃克巴坦那。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文表示他们“临近”埃克巴坦那，不一定已经进入或抵达城中。
    reason: 说明ἕως ἤγγισαν的接近含义，避免将其误解为已经完全抵达。
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: 少年
  rationale: 此词可指孩子或少年；但多比亚在上下文中已到了适婚年龄，又是出行者，因此译作“少年”既保留其年轻身份，也避免让人误以为他是幼童。
- source_word: ἐποίησεν
  choice: 照……做了
  rationale: 与ὡς εἶπεν构成自然的汉语表达，清楚传达他依照天使所说而行。
- source_word: ὡς εἶπεν αὐτῷ ὁ ἄγγελος
  choice: 照天使对他说的
  rationale: 贴近原文“天使对他说”，不额外强化为正式命令或训令。
- source_word: τὸν δὲ ἰχθὺν ὀπτήσαντες
  choice: 他们把鱼烤熟
  rationale: ὀπτάω指用火烤；将分词结构转成顺承动作，符合现代汉语叙事习惯。“烤熟”也自然衔接随后进食。
- source_word: ἔφαγον
  choice: 吃了
  rationale: 宾语“鱼”已在前句明确，汉语无需重复代词。
- source_word: ὥδευον
  choice: 继续赶路
  rationale: 未完成时表示持续行进；“继续赶路”自然传达旅程仍在进行。
- source_word: ἀμφότεροι
  choice: 两人
  rationale: 明确保留多比亚与天使一同前行的含义。
- source_word: ἕως ἤγγισαν
  choice: 直到临近
  rationale: ἤγγισαν表示走近、接近，不必然表示已经进入或抵达城内。
- source_word: ἐν Ἐκβατάνοις
  choice: 埃克巴坦
  rationale: 采用该古城名的现代汉语音译；与“临近”搭配，表达原文整体所指的接近该城。
