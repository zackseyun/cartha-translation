  yaml_path: translation/deuterocanon/tobit/006/016.yaml
  text: But the angel said to him[a], “Do you not remember the words that your father commanded you about taking a wife from your own kin? And now listen to me, brother, because she will be your wife, and pay no attention to the demon, for tonight she will be given to you as a wife.”
translation:
  language: zh_hans
  text: 天使对他说：“你难道不记得你父亲吩咐你从自己的亲族中娶妻的那些话吗？现在你要听我说，弟兄；因为她必成为你的妻子。不要把那鬼魔放在心上[a]，因为今夜她必被交给你作妻子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要理会那鬼魔。”希腊文直译近于“不要对那鬼魔有任何话（或计较）”。
    reason: 保留希腊习语 τοῦ δαιμονίου μηδένα λόγον ἔχε 的词义范围和表达上的含混。
lexical_decisions:
- source_word: μέμνησαι
  choice: 你不记得……吗
  rationale: 该完成时中间形式在此有现在的效力；用现代汉语反问句自然表达提醒之意。
- source_word: λόγων ὧν ἐνετείλατό σοι ὁ πατήρ σου
  choice: 你父亲吩咐你的话
  rationale: 保留 λόγων 的“话”和 ἐνετείλατο 所含权威性较强的“吩咐”，同时使句子自然。
- source_word: ὑπὲρ τοῦ λαβεῖν σε γυναῖκα
  choice: 他要你……娶妻
  rationale: λαβεῖν γυναῖκα 是婚姻习语；译作“娶妻”比直译“取一个女人”准确自然。补出“他要”承接前面的吩咐内容。
- source_word: ἐκ τοῦ γένους σου
  choice: 从自己的亲族中
  rationale: γένος 在此指血缘亲属群体或家族谱系；“亲族”保留范围上的弹性，不限定为民族或支派。
- source_word: ἄκουσόν μου
  choice: 听我说
  rationale: 既表达直接的听取，也可在语境中自然带出“听从、留心”的含义，而不将其明确收窄为“服从”。
- source_word: ἀδελφέ
  choice: 弟兄
  rationale: 保留阳性单数呼语的字面亲切称呼；“弟兄”符合庄重的经文语体。
- source_word: σοὶ ἔσται εἰς γυναῖκα
  choice: 她必成为你的妻子
  rationale: 将希腊语表示婚姻身份与结果的习语译成自然汉语，并保留将来语气。
- source_word: τοῦ δαιμονίου μηδένα λόγον ἔχε
  choice: 不要把那鬼魔放在心上
  rationale: 原文直译近于“不要对那鬼魔有任何话/计较”，是较含混的习语；“不要放在心上”可表达不要顾虑或理会，同时以脚注保留其他理解。
- source_word: δαιμονίου
  choice: 鬼魔
  rationale: 该词明确指超自然的邪恶存在；“鬼魔”在现代中文圣经语体中清楚、庄重，且不弱化为泛称“邪灵”。
- source_word: τὴν νύκτα ταύτην
  choice: 就在今夜
  rationale: 自然表达“这一夜”，加入“就在”体现 ταύτην 的指示强调。
- source_word: δοθήσεταί σοι αὕτη εἰς γυναῖκα
  choice: 她必被交给你作妻子
  rationale: 保留原文明确的被动形式和婚姻安排框架；“交给”比单纯“成为”更能反映 δοθήσεται 的“被给予”。
theological_decisions:
- issue: 婚姻习语与亲族义务
  choice: 明确译出“从自己的亲族中娶妻”“成为你的妻子”“被交给你作妻子”。
  alternative: 全都简化为“与亲属结婚”或泛称“成婚”。
  rationale: 原文反复使用 γυνή 及婚姻身份公式，并以被动式描述女子被交付。保留这些措辞可呈现其家庭与社会背景，而不额外评价该制度。
- issue: 超自然威胁的称谓
  choice: 将 δαιμόνιον 译为“鬼魔”。
  alternative: 译为较宽泛的“邪灵”。
  rationale: 原词直接指鬼魔；明确翻译可保存其神学和叙事上的具体性。
- issue: μηδένα λόγον ἔχε 的含义
  choice: 正文采用“不要把那鬼魔放在心上”，脚注说明也可理解为“不要理会那鬼魔”。
  alternative: 仅译作“不要理会”或“不要担心”，不加说明。
  rationale: 该希腊习语的字面结构不寻常，可涵盖不理会、不顾虑等语气；正文采用自然而较宽的表达，并在脚注中保存语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“娶妻”“亲族”“弟兄”“鬼魔”“今夜”等词保留经文语体，但避免过度古雅。以短句拆分原文长句，使天使的提醒、劝告和保证层次清楚；不消解婚姻安排的被动表达，也不对其作现代价值判断。
