  text: Then the young man went down to wash himself[a], and a fish leaped up from the river and tried to swallow the young man.
translation:
  language: zh_hans
  text: 少年下到河边洗澡，一条鱼从河里蹿了出来，想要吞下少年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: 少年
  rationale: 该词可指孩子、男孩或年轻随从；这里的多比亚已能远行并独立行动，因此译作“少年”既符合年龄与叙事情境，也保留原词所含的年轻意味。两次出现均一致译出。
- source_word: κατέβη
  choice: 下到河边
  rationale: 原义是“下去”；结合随后鱼从河中跃出的场景，中文补出目的地“河边”，自然呈现向水边移动的动作，而不暗示他已经进入河中。
- source_word: περικλύσασθαι
  choice: 洗澡
  rationale: 中动态不定式表示清洗自己。现代汉语中“洗澡”自然简明；此处不必将动作限定为完全浸入水中。
- source_word: ἀνεπήδησεν
  choice: 蹿了出来
  rationale: 该动词描写突然向上跃起；“蹿了出来”在中文中生动地表现鱼突然从河水中跃出的动作。
- source_word: ἰχθύς
  choice: 一条鱼
  rationale: 希腊文首次提及此鱼且无冠词；汉语用量词结构“一条鱼”最自然。
- source_word: ἀπὸ τοῦ ποταμοῦ
  choice: 从河里
  rationale: 直译为“从河中/从河里”；“从河里”符合现代汉语叙事表达。
- source_word: ἐβουλήθη
  choice: 想要
  rationale: 该动词首先表达意愿、意图或愿望。译作“想要”保留其真实的意向含义，不把它强化为希腊文未明确表达的实际尝试。
- source_word: καταπεῖν
  choice: 吞下
  rationale: 该复合动词意为“吞下、咽下”；“吞下”直接而不过度渲染，不采用语气更强的“吞吃”或“吞噬”。
