  yaml_path: translation/deuterocanon/tobit/006/014.yaml
  text: Then the young man said to the angel[a], “Azariah, brother, I have heard that the girl has been given to seven men[b], and that all of them were hindered in the bridal chamber.”
translation:
  language: zh_hans
  text: 那少年对天使说：“亚撒利雅弟兄，我听说这姑娘曾嫁给过七个男人[a]，而他们全都在洞房里受了阻拦[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“七个丈夫”。希腊文直译为“七个男人”，但婚姻语境也支持较具体的“丈夫”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“他们全都在洞房里被阻止了（或受了阻拦）”。按上下文，这是指先前的新郎都未能圆房，因为他们死在了那里。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: 那少年
  rationale: παιδάριον可指男孩或少年；多比亚已到适婚年龄，译作“少年”既符合叙事情境，也不过度强调年幼。
- source_word: τῷ ἀγγέλῳ
  choice: 对天使
  rationale: 在《多比传》的语境中，此人物确是天使；这里采用该词通常的超自然含义，而非泛称“使者”。
- source_word: ἀδελφέ
  choice: 弟兄
  rationale: 保留原文直接称呼的形式；此处可表达亲近，并不必然指亲生兄弟。
- source_word: ἀκήκοα
  choice: 我听说
  rationale: 希腊文完成时表示先前听闻而如今仍知道此事；现代汉语“我听说”自然地传达这一结果状态。
- source_word: τὸ κοράσιον
  choice: 这姑娘
  rationale: κοράσιον指女孩或年轻女子；“姑娘”符合适婚女子的语境，现代而不失庄重。
- source_word: δεδόσθαι
  choice: 曾被许配给
  rationale: δίδωμι在婚姻语境中指女子被给人作妻；“被许配给”比机械的“被给了”自然，同时保留被动含义。
- source_word: ἑπτὰ ἀνδράσιν
  choice: 七个男人
  rationale: ἀνήρ既可指“男人”，也可指“丈夫”。正文采用较宽泛的“男人”，不把婚姻语境所暗示的特定义项直接写死。
- source_word: πάντας
  choice: 他们全都
  rationale: 清楚回指前述七人，并完整表达“所有人”的范围。
- source_word: ἐν τῷ νυμφῶνι
  choice: 在洞房里
  rationale: νυμφών指新婚夫妇的房间；“洞房”是现代汉语中简洁自然的对应表达。
- source_word: ἀποκωλῦσαι
  choice: 受了阻拦
  rationale: 该动词表达阻止、拦阻，原句语法较为压缩；此译法保留其含蓄性，不在正文中径直改译为“被杀”。
theological_decisions:
- issue: 是否在正文中明确说明撒拉先前七名婚配对象的死亡
  choice: 按ἀποκωλῦσαι译为“受了阻拦”，不在正文中明说死亡
  alternative: 译作“被杀了”或“死去了”
  rationale: 本句所用动词本义是阻止或拦阻，并非直接表示杀害。上下文虽说明他们死亡，正文仍应保留本句的压缩与含蓄，相关背景置于脚注。
- issue: ἑπτὰ ἀνδράσιν应译为“七个男人”还是“七个丈夫”
  choice: 正文译“七个男人”
  alternative: 译“七个丈夫”
  rationale: ἀνήρ两义皆可；婚姻语境支持“丈夫”，但词面仍是较宽的“男人”。正文保留这一语义空间，并在脚注说明。
translation_notes:
  register: 采用现代、庄重而通顺的叙事汉语。“亚撒利雅弟兄”保留原文称呼方式；“洞房”简洁传达婚房含义。脚注标记均紧随其所说明的词句，避免英文咨询层中标记与注释内容错位的问题。
