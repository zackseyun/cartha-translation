base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/012.yaml
  text: I will speak about her[a], so that she may be given to you as a wife, because her inheritance falls to you, and you alone are from her family[b]; and the young woman is beautiful and sensible.
translation:
  language: zh_hans
  text: “我要谈谈她[a]，好把她嫁给你为妻，因为她的产业应当归你，而且在她的亲族中只有你一人；这姑娘既美丽又明理。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要为她说话。”原文直接表示谈论她；在上下文中也可能含有代她出面商谈婚事的意思。
    reason: 保留 περὶ αὐτῆς 在“谈及她”与语境所暗示的“为她出面”之间的含义幅度。
lexical_decisions:
- source_word: λαλήσω περὶ αὐτῆς
  choice: 我要谈谈她的事
  rationale: λαλέω 与 περὶ 加属格表示谈论、提及某人；此处没有明说“替她说情”或“为她提亲”，因此保留较宽的表达。
- source_word: τοῦ δοθῆναί σοι αὐτὴν εἰς γυναῖκα
  choice: 好让人把她给你作妻子
  rationale: τοῦ 加不定式在此表达目的；被动式未说明施事者，汉语用泛指的“人”自然保留这一点。“给你作妻子”直接表达婚姻关系而不增加订婚等细节。
- source_word: σοὶ ἐπιβάλλει ἡ κληρονομία αὐτῆς
  choice: 她的产业应当归你
  rationale: ἐπιβάλλει 在本段亲族与婚姻的法律语境中表示某项产业或继承权益依法落到某人名下。“应当归你”兼顾归属与法律义务色彩，避免把它弱化为普通所有关系。
- source_word: σὺ μόνος εἶ ἐκ τοῦ γένους αὐτῆς
  choice: 你是她亲族中唯一的人
  rationale: γένος 可指家族、宗族或亲族；“亲族”适合此处婚姻和产业承继的语境，也保留“唯一”这一强调。
- source_word: τὸ κοράσιον
  choice: 这姑娘
  rationale: κοράσιον 指女孩或年轻女子；在适婚语境中，“姑娘”自然且不会使人误以为是年幼儿童。
- source_word: καλὸν
  choice: 美丽
  rationale: 在介绍未来妻子的语境中，καλός 描写外貌姣好；“美丽”清楚而庄重。
- source_word: φρόνιμόν
  choice: 明理
  rationale: φρόνιμος 指有判断力、谨慎明智。“明理”是自然现代汉语，表达实际智慧而不夸大为抽象或哲学意义上的智慧。
theological_decisions:
- issue: 亲族婚姻与产业承继之间的法律关系
  choice: 她的产业应当归你，而且你是她亲族中唯一的人
  alternative: 你有权承受她／作为她的亲属，这产业落在你身上
  rationale: 原文以产业和亲族身份说明这桩婚姻的社会法律依据，但没有完整解释具体制度。正文保留这种关联，不把女子本人说成可被继承的对象，也不引入后世宗派性的婚姻法规解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谈谈她的事”避免过度解释为正式提亲；“产业应当归你”保留法律归属感；“姑娘既美丽又明理”简洁自然，适合叙事文体。
