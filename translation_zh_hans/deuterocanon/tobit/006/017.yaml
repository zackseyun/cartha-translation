  text: And when you enter into the bridal chamber[a], take some of the incense ashes and place on them some of the fish’s heart and liver, and make smoke with them[b],
translation:
  language: zh_hans
  text: 你进了洞房以后，要取一些熏香的灰烬，从鱼的心和肝各取一点，放在灰烬上，使这些东西生出烟来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使这些东西生出烟来”也可译作“用这些东西熏烟”；原文所用动词比一般的“焚烧”更具体，着重于产生烟。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυμφῶνα
  choice: 洞房
  rationale: 指婚礼后安置婚床、夫妻同房的房间；“洞房”是现代汉语中自然、明确而庄重的对应表达。
- source_word: λήμψῃ
  choice: 取
  rationale: 在连续的操作指示中表示拿取某物以供使用；“取”简洁自然。
- source_word: τέφραν θυμιαμάτων
  choice: 熏香的灰烬
  rationale: τέφρα意为“灰烬”，θυμιαμάτων指熏香或焚烧的芳香物；此译既保留属格关系，也避免把它过度限定为香炉中的灰。
- source_word: ἐπιθήσεις
  choice: 放在灰烬上
  rationale: 该动词表示放置于某物之上；汉语补出所指的“灰烬”，使动作关系清楚。
- source_word: ἀπὸ τῆς καρδίας καὶ τοῦ ἥπατος τοῦ ἰχθύος
  choice: 把鱼心和鱼肝各取一点
  rationale: ἀπό在这里表达从鱼心和鱼肝中取出一部分；“各取一点”自然呈现其部分含义。
- source_word: καπνίσεις
  choice: 使它们冒出烟来
  rationale: 该词具体表示使之生烟或用烟熏，而不只是笼统地“焚烧”；此译保留了经文所描述的物理动作。
theological_decisions:
- issue: καπνίσεις所描述的仪式性或药用性动作
  choice: 具体译为使材料冒烟
  alternative: 把它们烧作祭物；用烟熏房间；借此驱魔
  rationale: 本节希腊文只描述产生烟的动作，其作用由后文说明；译文不在此处预先加入献祭、熏房或驱魔等解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事指令语体。“洞房”明确保留婚姻场景；“熏香的灰烬”避免含混的“香灰”可能带来的特定民俗联想。句末保留逗号式延续感所表达的未完指示，但中文独立节文以句号收束。
