  yaml_path: translation/deuterocanon/tobit/006/011.yaml
  text: The angel said to the young man, “Brother, today we will lodge with Raguel. He is your relative, and he has a daughter named Sarah.”
translation:
  language: zh_hans
  text: 天使对那青年说：“弟兄，今天我们要投宿在拉古耳家。他是你的亲属，有一个女儿，名叫撒辣。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδαρίῳ
  choice: 青年
  rationale: 该词可指男孩或年轻人；按上下文，多俾亚已经能够远行并谈婚事，译作“青年”既符合身份，也避免显得年幼。
- source_word: Ἀδελφέ
  choice: 弟兄
  rationale: 保留希腊文直接称呼中的亲密、如手足般的语气，不淡化为泛称“朋友”。
- source_word: σήμερον
  choice: 今天
  rationale: 这是该时间副词自然、准确的现代汉语对应词。
- source_word: αὐλισθησόμεθα
  choice: 要投宿
  rationale: 该动词指旅途中停留过夜；“投宿”符合到某人家中住宿的语境，又不额外指定露营。
- source_word: παρὰ Ῥαγουήλῳ
  choice: 在拉古耳家
  rationale: παρά加与格在这里表示在拉古耳那里、其家中住宿；现代汉语以“在……家”表达最自然。
- source_word: συγγενής
  choice: 亲属
  rationale: 准确表达亲缘关系，同时不擅自限定具体亲属类别或父系、母系关系。
- source_word: θυγάτηρ
  choice: 女儿
  rationale: 直接对应明确的亲属称谓。
- source_word: ὄνομα Σάρρα
  choice: 名叫撒辣
  rationale: 以自然汉语表达“名字是撒辣”的希腊文结构，意义不变。
