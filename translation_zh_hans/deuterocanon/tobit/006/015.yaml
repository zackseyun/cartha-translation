base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/015.yaml
  text: And now I am my father's only one[a], and I am afraid that if I go in, I will die, just as the former ones did, because a demon loves her, and it harms no one except those who approach her. And now I am afraid that I may die and bring down the life of my father and my mother in grief because of me to their grave[c][b]; and they have no other son who will bury them.
translation:
  language: zh_hans
  text: “如今，我是父亲唯一的儿子[a]。我怕进去以后会像先前那些人一样死去，因为有一个恶魔爱着她[b]；它不加害任何人，只加害那些到她那里去的人。如今，我怕自己会死，使我父亲和母亲的生命因我而在悲痛中降到他们的坟墓[c]；他们又没有别的儿子可以安葬他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我是父亲唯一的一个”；本节末尾说明他是父母唯一的儿子。
    reason: lexical_alternative
  - marker: b
    text: 原文说“一个恶魔爱着她”，表达恶魔对撒拉带有占有性的依恋。
    reason: lexical_alternative
  - marker: c
    text: “使……生命……降到他们的坟墓”是形象化的说法，意思是他的死会使父母因悲痛而死。
    reason: cultural_note
lexical_decisions:
- source_word: μόνος ... τῷ πατρί
  choice: 父亲唯一的儿子
  rationale: μόνος表示“唯一的一个”；结合本节末尾“没有别的儿子”，汉语明确译作“唯一的儿子”最自然，也符合语境。
- source_word: φοβοῦμαι μὴ εἰσελθὼν ἀποθάνω
  choice: 我怕进去以后会……死去
  rationale: 保留“进去”的含蓄表达，不擅自补明婚房或夫妻关系，同时以现代汉语表达φοβοῦμαι μή所含的忧惧。
- source_word: οἱ πρότεροι
  choice: 先前那些人
  rationale: 原文没有在此明说其身份；上下文指撒拉先前的丈夫，因此正文保留概括说法。
- source_word: δαιμόνιον
  choice: 鬼魔
  rationale: 指叙事中具有行动和意志的邪恶灵体；“鬼魔”直接传达原词，而不弱化为泛称的“邪灵”。
- source_word: φιλεῖ αὐτήν
  choice: 爱着她
  rationale: 直译φιλέω的通常含义，保留这种令人不安且带占有性的“爱”，不替原文解释为欲望或依附。
- source_word: ἀδικεῖ
  choice: 加害
  rationale: 本语境涉及使人死亡，“加害”既保留作恶、伤害之意，又适合庄重叙事语体。
- source_word: τῶν προσαγόντων αὐτῇ
  choice: 那些到她那里去的人
  rationale: 保留接近或来到她跟前的宽泛表达，不在正文中限定为成婚、求婚或发生性关系。
- source_word: κατάξω τὴν ζωὴν ... εἰς τὸν τάφον αὐτῶν
  choice: 使我父母……生命随之下到坟墓
  rationale: 保留原文“把生命带下坟墓”的形象，同时调整语序，使现代汉语清楚可读。
- source_word: μετʼ ὀδύνης ἐπʼ ἐμοί
  choice: 因我而悲痛
  rationale: ὀδύνη表示深切的痛苦或悲伤；“因我而悲痛”准确交代悲痛的缘由。
- source_word: υἱὸς ἕτερος οὐχ ὑπάρχει αὐτοῖς ὃς θάψει αὐτούς
  choice: 他们又没有别的儿子可以安葬他们
  rationale: 用自然汉语表达存在句，并保留儿子承担安葬父母责任的语义。
theological_decisions:
- issue: δαιμόνιον的性质
  choice: 译为具有位格和行动能力的“鬼魔”
  alternative: 泛译为“邪灵”
  rationale: 本段说它“爱”撒拉并选择性加害接近她的人，叙事明确将其描写为有意志的敌对灵体。
- issue: φιλεῖ αὐτήν所表达的关系
  choice: 保留“爱着她”
  alternative: 解释为“迷恋她”或“占有她”
  rationale: 原词确实是“爱”，但上下文使这种爱带有邪恶、占有性的张力；正文不应替原文消解这种反常表达。
- issue: “进去”的具体含义
  choice: 正文保留含蓄的“进去”
  alternative: 明确译为“进入洞房”或“与她同房”
  rationale: 上下文可使读者理解其婚姻场景，但希腊文本身只说“进去”；保留含蓄说法可避免过度释义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留“进去”“爱着她”“生命下到坟墓”等原文意象与含蓄表达；标点按中文引语习惯处理。
