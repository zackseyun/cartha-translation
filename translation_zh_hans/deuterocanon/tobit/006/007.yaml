  yaml_path: translation/deuterocanon/tobit/006/007.yaml
  text: And the young man said to the angel[a], “Azariah, brother, what are the liver and the heart and the gall of the fish for?”
translation:
  language: zh_hans
  text: 年轻人对天使说：“亚撒利雅弟兄，这条鱼的肝、心和胆汁有什么用呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: 年轻人
  rationale: 该词可指孩子、少年或年轻随从；上下文中的多比亚已能远行并独立行动，因此译作“年轻人”既保留其年轻身份，也避免显得年幼。
- source_word: τῷ ἀγγέλῳ
  choice: 对天使
  rationale: ἄγγελος可指“使者”，但在《多比传》的叙事中，这位同行者确为天使；此处直译“天使”最符合语境。
- source_word: Ἀζαρία
  choice: 亚撒利雅
  rationale: 按现代中文圣经人名的常用音译处理，呼格语气由直接引语表达。
- source_word: ἀδελφέ
  choice: 弟兄
  rationale: 原文直义为“兄弟”，此处是亲近而尊重的称呼，并非宣称血缘关系；“弟兄”能较好保留原词及其称呼语气。
- source_word: τί ἐστιν
  choice: 有什么用呢
  rationale: 字面为“是什么”，但结合下一节解释这些部位用途的语境，此处自然是在询问功用；译作“有什么用呢”符合现代汉语。
- source_word: τὸ ἧπαρ
  choice: 肝
  rationale: 采用标准解剖学名称。
- source_word: ἡ καρδία
  choice: 心
  rationale: 采用自然、常用的器官名称；在此语境中明确指鱼的心脏。
- source_word: ἡ χολή
  choice: 胆汁
  rationale: χολή指胆汁或胆液；现代汉语以“胆汁”最准确、清楚，也比单说“胆”更能避免被理解为胆囊。
- source_word: τοῦ ἰχθύος
  choice: 这条鱼的
  rationale: 属格表明这些部位属于先前所提到的鱼；加入量词“条”及指示词“这”使现代汉语自然，并保持上下文指涉。
theological_decisions:
- issue: 对天使同伴使用ἀδελφέ这一称呼
  choice: 直译为“弟兄”
  alternative: 译作“朋友”或省略称呼
  rationale: 这只是当时亲近、尊重的称呼，并不主张人与天使有字面上的血缘关系。保留“弟兄”可维持原文措辞及其可能引发的张力，而不在译文中替作者解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“亚撒利雅弟兄”保留呼语结构；“有什么用呢”传达上下文中的用途询问。中文正文选用明确的“胆汁”，故无需再以脚注重复同义词。
