  text: And she stopped weeping[a].
translation:
  language: zh_hans
  text: 她就不再哭泣了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所依据的希腊文本非常简短：“她就不再哭泣了。”与闪语传统有关的一个较长文本则在本节接着叙述旅程（“少年继续上路……”），但这里翻译的主要希腊文本没有这些内容。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: 就
  rationale: 此处连接上文并表示叙事承接；现代汉语用“就”比句首直译为“并且”更自然，同时不额外强化因果关系。
- source_word: ἐπαύσατο
  choice: 不再……了
  rationale: 该词是παύω的不定过去时中间语态，表示正在进行的动作停止；“不再……了”自然、简洁地传达动作终止。
- source_word: κλαίουσα
  choice: 哭泣
  rationale: κλαίω的现在分词表示持续哭泣；“哭泣”比“哭”更庄重，也符合此处叙事语体。
