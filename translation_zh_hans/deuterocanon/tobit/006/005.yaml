base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/005.yaml
  text: And the angel said to him, “Cut open the fish, and after taking the heart and the liver and the gall, put them away safely.”
translation:
  language: zh_hans
  text: 天使对他说：“把鱼剖开，取出心、肝和胆汁[a]，妥善收好。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胆汁”：希腊文χολή也可译作“胆液”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάτεμε
  choice: 剖开
  rationale: 该命令式表示把鱼切开，以便取出内脏。“剖开”在现代汉语中具体自然，又不显得过于技术化。
- source_word: τὸν ἰχθύν
  choice: 鱼
  rationale: 定冠词所指的鱼在上下文中明确；汉语无需另译定冠词。
- source_word: λαβὼν
  choice: 取出
  rationale: 不定过去时分词表示相对于“收好”在先的动作；汉语用连续动词自然呈现先取出、后收好的顺序。
- source_word: τὴν καρδίαν
  choice: 心
  rationale: 采用直接、常用的解剖学名称。
- source_word: τὸ ἧπαρ
  choice: 肝
  rationale: 采用直接、常用的解剖学名称。
- source_word: τὴν χολὴν
  choice: 胆汁
  rationale: χολή可指胆汁或胆液；“胆汁”是现代汉语清楚自然的对应词，同时不把它具体化为原文未明说的“胆囊”。
- source_word: θὲς
  choice: 收好
  rationale: 该命令式意为放置、存放；结合ἀσφαλῶς，“收好”自然表达留存供后用之意。
- source_word: ἀσφαλῶς
  choice: 妥善
  rationale: 表达稳妥、安全地保存，与“收好”搭配自然，并不过度引申保存方式。
theological_decisions:
- issue: ὁ ἄγγελος的身份表达
  choice: 天使
  alternative: 使者
  rationale: ἄγγελος本可泛指使者，但《多俾亚传》的叙事明确把此人物描写为天使；译作“天使”符合故事语境，不额外加入教义判断。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“剖开—取出—收好”保留原文动作次序；器官名称使用普通读者易懂的简洁形式。
