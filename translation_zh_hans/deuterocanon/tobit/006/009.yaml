  language: zh_hans
  text: 至于鱼胆，要涂在眼中有白膜的人的眼睛上，他就会痊愈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χολή
  choice: 鱼胆
  rationale: 本句承接上文所取的鱼胆；补出“鱼”使现代汉语指代清楚，同时不改变所指。
- source_word: ἐγχρῖσαι
  choice: 把它涂在……眼上
  rationale: 该动词表示涂抹、敷用；结合眼部病症，译为“涂在……眼上”自然明确。
- source_word: λευκώματα
  choice: 白膜
  rationale: 保留希腊文对眼中白色膜状病变的直观描述，不强行等同于某一种现代医学诊断。
- source_word: ἰαθήσεται
  choice: 会痊愈
  rationale: 准确表达将来时被动形式所指的康复结果，中文无需生硬保留被动句式。
