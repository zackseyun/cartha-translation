revisions:
- from: 他对他说：“至于心和肝，若有邪魔或恶灵搅扰某人，就要在那男人或女人面前把这两样烧得冒烟[a]，他或她便不再受搅扰。”
  to: 他对他说：“至于心和肝，若有男人或女人受邪魔或恶灵搅扰，就在那人面前把这两样焚烧，使之冒烟[a]；那人便不再受搅扰。”
  rationale: The revision removes the added definite reference and makes the man-or-woman phrase directly identify the person troubled and the person before whom the organs are burned, as the sentence's sense requires. It also replaces the less idiomatic "他或她" with "那人," while retaining the Greek's explicit "男人或女人" and all substantive elements of the draft.
