base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/008.yaml
  text: And he said to him[a], “The heart and the liver—if a demon or an evil spirit troubles anyone, burn these as smoke before a man or a woman, and he or she will no longer be troubled.”
translation:
  language: zh_hans
  text: 他对他说：“至于心和肝，若有男人或女人受邪魔或恶灵搅扰，就在那人面前把这两样焚烧，使之冒烟[a]；那人便不再受搅扰。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把这两样焚烧。”希腊文动词指借着焚烧使这些器官冒烟。
    reason: 说明καπνίσαι所指的焚烧发烟动作，并保留较简洁的译法作为选择。
lexical_decisions:
- source_word: καρδία
  choice: 心
  rationale: 这里与“肝”并列，指鱼的实际器官，而非思想或情感的中心。
- source_word: ἧπαρ
  choice: 肝
  rationale: 采用明确、自然的现代汉语解剖名称，保留原文的字面意义。
- source_word: ἐάν τινα ὀχλῇ
  choice: 若……搅扰某人
  rationale: ὀχλέω表示造成困扰或侵扰；“搅扰”既自然，也适合本节邪灵侵扰的语境，同时避免过度具体化。
- source_word: δαιμόνιον
  choice: 邪魔
  rationale: 与“恶灵”并列翻译，以保留原文δαιμόνιον和πνεῦμα πονηρόν两个不同表达，而不把二者合并。
- source_word: πνεῦμα πονηρόν
  choice: 恶灵
  rationale: 直接表达“邪恶的灵”，并保留其与“邪魔”的平行和区别。
- source_word: ταῦτα δὲ καπνίσαι
  choice: 把这两样烧得冒烟
  rationale: καπνίσαι在此指借焚烧使器官发烟；译文同时表达焚烧的动作及冒烟的结果。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 准确、自然地表达在有关之人面前进行这一动作。
- source_word: ἀνθρώπου ἢ γυναικός
  choice: 那男人或女人
  rationale: 原文在此明确并列男性与女性；译文予以保留，而不笼统化为“人”。定冠式“那”指受搅扰的有关对象。
- source_word: οὐ μηκέτι ὀχληθῇ
  choice: 便不再受搅扰
  rationale: 保留强烈的将来否定，并以同一词根对应前面的“搅扰”，呈现原文的重复。
theological_decisions:
- issue: 经文对邪灵侵扰及焚烧器官之作用的陈述
  choice: 按叙事中的指示直接翻译，保留超自然用语及所述处理方式
  alternative: 将其淡化为纯粹的民俗、象征或医疗描述
  rationale: 希腊文明确说邪魔或恶灵搅扰人，并指示焚烧这些器官使之冒烟。翻译应呈现文本自身的陈述，不加入现代怀疑立场，也不附加教派性解释。
- issue: ἀνθρώπου ἢ γυναικός的性别表达
  choice: 译为“男人或女人”
  alternative: 概括译为“任何人”
  rationale: 原文明确列出男性与女性，保留这一表达更贴近源文本。
- issue: δαιμόνιον与πνεῦμα πονηρόν的关系
  choice: 分别译为“邪魔”和“恶灵”
  alternative: 将两者都译作“邪灵”
  rationale: 原文用两个表达并以“或”连接；译文保留其并列关系，不武断断定二者完全同义或本质不同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“至于心和肝”承接上下文并凸显本句主题；“他或她”明确回指前面的“男人或女人”，避免汉语代词造成性别指向含混。脚注标记置于其实际解释的“烧得冒烟”之后。
