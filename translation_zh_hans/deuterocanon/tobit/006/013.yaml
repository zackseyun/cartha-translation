- from: 现在你要听我的。我会去和她父亲谈；等我们从拉杰斯回来，就为你们办婚事。我知道，拉贵耳绝不会违背摩西律法，把她给另一个男人[a]；不然，他就要担负死罪[b]。因为你比任何别的男人都更有权承受这份产业[c]。
  to: 现在，你听我说。我会同她父亲谈谈；等我们从拉杰斯回来，就办婚事。我知道，拉贵耳绝不会把她许配给别的男人而违背摩西的律法；否则，他就要承担死刑之责。因为这份产业理当由你承受，而不是由任何别的男人承受。
