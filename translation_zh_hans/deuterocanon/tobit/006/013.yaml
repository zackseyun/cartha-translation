base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/013.yaml
  text: And now listen to me[a], and I will speak to her father; and when we return from Rages, we will arrange the marriage. For I know that Raguel will certainly not give her to another man contrary to the law of Moses, or he will incur death[b], because it is fitting for you to receive the inheritance rather than any other man.
translation:
  language: zh_hans
  text: 现在，你听我说。我会同她父亲谈谈；等我们从拉杰斯回来，就办婚事。我知道，拉贵耳绝不会把她许配给别的男人而违背摩西的律法；否则，他就要承担死刑之责。因为这份产业理当由你承受，而不是由任何别的男人承受。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄκουσόν μου
  choice: 你要听我的
  rationale: 命令语气要求多比亚留心听从，而不只是听见；现代汉语“听我的”自然地表达劝告与指引。
- source_word: λαλήσω τῷ πατρὶ αὐτῆς
  choice: 我会去和她父亲谈
  rationale: 保留“说话、交谈”的宽泛含义；加“去”使汉语衔接自然，却不限定谈话的具体内容。
- source_word: ὅταν ὑποστρέψωμεν ἐκ Ῥάγων
  choice: 等我们从拉杰斯回来
  rationale: ὅταν加虚拟语气指将来发生时；“等……回来”符合自然汉语。地名Ῥάγων依原文音译为“拉杰斯”。
- source_word: ποιήσωμεν τὸν γάμον
  choice: 就为你们办婚事
  rationale: 该短语直译为“举行／办理婚姻”，在语境中包含筹办并完成婚礼；“办婚事”通俗、庄重，也不把意思局限于庆宴。
- source_word: οὐ μὴ δῷ
  choice: 绝不会……把她给
  rationale: οὐ μή加虚拟语气是强烈否定，“绝不会”保留其强调力度。
- source_word: ἀνδρὶ ἑτέρῳ
  choice: 另一个男人
  rationale: ἀνήρ可指男人或丈夫；此人尚未成为丈夫，因此采用较少预设的“男人”，婚配含义由上下文说明。
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: 违背摩西律法
  rationale: κατά字面常为“按照”，但在强烈否定及随后死罪后果的句法中，整体意思是拉贵耳不会以违反摩西律法的方式把她另嫁；正文采用自然汉语显明这一关系，并以脚注保存字面结构。
- source_word: ὀφειλέσει θάνατον
  choice: 要担负死罪
  rationale: 字面为“将欠下死亡”，是表示承担死亡刑责的习语；“担负死罪”兼顾法律责任与死亡后果。
- source_word: τὴν κληρονομίαν
  choice: 这份产业
  rationale: κληρονομία指可继承的财产或产业；原文没有明说“她的”，故不补入所有格，以“这份”承接上下文。
- source_word: σοὶ καθήκει λαβεῖν
  choice: 你……更有权承受
  rationale: καθήκει兼有合宜、应当和归属权利之意；在继承语境中“有权承受”比单说“适合领取”更自然，但仍不将其处理成特定法律术语。
- source_word: ἢ πάντα ἄνθρωπον
  choice: 比任何别的男人
  rationale: 传世希腊文直译为“比每一个人”，措辞略显生硬；比较语境表达多比亚相对于所有其他男人拥有优先资格。
theological_decisions:
- issue: 拉贵耳在摩西律法下的义务及死刑责任
  choice: 他若把撒拉给别的男人，就是违背摩西律法，并要承担死罪。
  alternative: 按字面语序译为“他绝不会按照摩西律法把她给另一个男人，否则将欠下死亡”。
  rationale: κατὰ τὸν νόμον在否定句中的修饰关系存在表面歧义；但紧接的死亡责任显示，重点是违反律法所带来的后果。正文使逻辑关系清楚，脚注保留原文较字面的形式。
- issue: 多比亚对产业的资格
  choice: 多比亚比任何其他男人更有权承受产业。
  alternative: 只是说由多比亚承受产业“更合宜”，不强调优先权。
  rationale: καθήκει可指合宜或应有的资格；与ἢ πάντα ἄνθρωπον的比较结构合看，原文表达的是相对于其他人的优先权，但没有进一步界定其法理性质。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“听我的”“办婚事”便于普通读者理解；“摩西律法”“担负死罪”“承受产业”保留经文的法律与继承语域。人名和地名按希腊文本音译，未引入宗派性解释。
