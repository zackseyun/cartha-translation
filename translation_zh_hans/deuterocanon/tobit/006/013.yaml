  naturalness: 原文整体通顺、庄重，但“担负死罪”搭配不够自然，“你比任何别的男人都更有权承受”则比原文“合宜／理当”的表达略强。修订后以现代汉语保留法律和继承语域，同时避免不必要的法律技术化。
  terminology: “摩西的律法”“婚事”“产业”均适合本段语境。保留既有的“拉杰斯”“拉贵耳”译名以维持本译稿的人名、地名一致性；不在此节擅自引入特定传统的异译名。
