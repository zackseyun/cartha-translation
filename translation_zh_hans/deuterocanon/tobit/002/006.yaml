base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/006.yaml
  text: And I remembered the prophecy of Amos[a], as he said, “Your festivals will be turned into mourning, and all your rejoicing into lamentation.” And I wept.
translation:
  language: zh_hans
  text: 我想起了阿摩司的预言[a]，正如他所说：“你们的节期必变为哀恸，你们一切的欢乐必变为哀歌。”于是我哭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所引的话呼应《阿摩司书》8:10的《七十士译本》传统。
    reason: cross_reference
lexical_decisions:
- source_word: ἐμνήσθην
  choice: 我想起了
  rationale: 该不定过去时形式在此具有主动意义；“想起了”自然、直接，并切合叙事中先回忆、后哭泣的次序。
- source_word: προφητείας
  choice: 预言
  rationale: 指阿摩司所说的先知性话语；“预言”清楚易懂，也保留经文语体。
- source_word: Στραφήσονται
  choice: 必变为
  rationale: 表达将来的彻底转变；中文无需机械保留被动形式，“必变为”既自然，又保留预言的确定语气，而不明说施事者。
- source_word: ἑορταὶ
  choice: 节期
  rationale: 这里指群体性的宗教节庆；“节期”比单指宴席的“筵席”更准确，也符合圣经语境。
- source_word: πένθος
  choice: 哀恸
  rationale: 该词在先知性语境中指哀悼状态，不只是内心忧伤；“哀恸”庄重且能体现节庆被逆转的强烈反差。
- source_word: εὐφροσύναι
  choice: 欢乐
  rationale: 复数可涵盖欢乐的场合与表现；汉语以集合性表达“一切的欢乐”最自然，并保留其广泛含义。
- source_word: θρῆνον
  choice: 哀歌
  rationale: 该词可指正式的挽歌或哀悼之歌；“哀歌”比泛指悲伤的词更能保留其仪式性和先知性语气。
- source_word: ἔκλαυσα
  choice: 我哭了
  rationale: 简洁呈现叙事中的实际哭泣；语气自然而庄重，不额外强化为号哭或痛哭。
theological_decisions:
- issue: 如何呈现嵌入的阿摩司预言
  choice: 保留为直接引语，并以复数“你们”呈现受话者：“你们的节期……你们一切的欢乐……”。
  alternative: 将引语意译成间接叙述，或把复数受话者模糊化为泛指。
  rationale: 希腊文明确先说想起阿摩司的预言，继而直接引用。保留直接引语和复数人称，能维持《多俾亚传》与先知警告之间的互文关系，不额外解释这警告如何应用于当前处境。
- issue: 预言中转变的施事者是否明说
  choice: 译作“必变为”，不补出“被上帝变为”。
  alternative: 译作“上帝必使……变为……”。
  rationale: 希腊文使用将来被动式，却没有明说施事者。译文保留这一含蓄性，避免将可能隐含的神圣施事者直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“节期—哀恸”和“欢乐—哀歌”形成平衡对照，以保留原文的先知性节奏；末句用简洁的“于是我哭了”承接回忆所引发的反应。
