base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/014.yaml
  text: But she said[a], “It was given to me as a gift in addition to my wages.” But I did not believe her, and I told her to give it back to its owners; and I was embarrassed before her. Then she answered and said to me, “Where are your acts of mercy and your righteous deeds? Behold[d][c][b], everything about you is known.”
translation:
  language: zh_hans
  text: 她却说：“这是除工钱以外送给我的礼物。[a]”可是我不相信她，还叫她把它还给主人；我在她面前羞愧得脸红。她回答我说：“你的施舍和义行在哪里？看哪，你的一切都显明了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是连同工钱一起给我的礼物”，也可能是“这是作为工钱的一部分给我的”。希腊文表示这礼物与她的工钱有关；按上下文，她是在辩称这并非偷来的。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δῶρον
  choice: 礼物
  rationale: 该词指赠礼；“礼物”在现代汉语中自然，并符合家庭生活场景。
- source_word: ἐπὶ τῷ μισθῷ
  choice: 除工钱以外
  rationale: 此短语表示这件东西与报酬相关；上下文中安娜是在说明它是工资之外所得的赠礼，而非偷来之物。原文也容许“连同工钱”或“作为工钱的一部分”，故加脚注保留歧义。
- source_word: οὐκ ἐπίστευον αὐτῇ
  choice: 我不相信她
  rationale: 忠实表达未完成时叙事中的不信任，且现代汉语清楚自然。
- source_word: ἀποδιδόναι αὐτὸ τοῖς κυρίοις
  choice: 把它还给主人
  rationale: ἀποδιδόναι意为归还；κύριοι在这里指对该物拥有权利的人。“主人”既贴近希腊文，又符合山羊归属争议的语境。
- source_word: ἠρυθρίων πρὸς αὐτήν
  choice: 我在她面前羞愧得脸红
  rationale: 动词字面涉及变红、脸红，同时传达羞愧。“羞愧得脸红”保留身体意象和情感含义，不把二者择一。
- source_word: ἐλεημοσύναι
  choice: 施舍
  rationale: 在本书的敬虔行为语境中，该复数主要指向对贫困者的周济；“施舍”比泛化的“怜悯行为”更具体。
- source_word: δικαιοσύναι
  choice: 义行
  rationale: 复数指具体的正义或公义行为，而非抽象地位；“义行”简洁、庄重。
- source_word: ἰδοὺ γνωστὰ πάντα μετὰ σοῦ
  choice: 看哪，你的一切都显明了
  rationale: 原句压缩且含义略有开放性。此译保留责问的力度，却不擅自规定是向谁显明，也不把它限定为神的审判或公众的看法。
theological_decisions:
- issue: δικαιοσύναι在复数伦理语境中的含义
  choice: 义行
  alternative: 公义；正义的行为
  rationale: 这里与“施舍”并列，指具体行为；译作“义行”避免把它误解为抽象的称义身份。
- issue: 安娜末句责备的指向
  choice: 看哪，你的一切都显明了
  alternative: 看哪，你的实情全都清楚了；看哪，与你有关的一切都是明白的
  rationale: γνωστὰ πάντα μετὰ σοῦ语义紧缩，可能指多比的真实景况、其敬虔的结果或众所周知的事实。译文保留这种张力，不补出原文没有明说的观察者或神学结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留ἰδού的郑重责问语气；“羞愧得脸红”兼顾希腊文的字面形象与语境意义。脚注标记[a]已置于对应短语之后。
