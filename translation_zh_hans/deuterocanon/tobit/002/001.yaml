base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/001.yaml
  text: When I had come down to my house[a], and Anna my wife and Tobiah my son were restored to me, on the feast of Pentecost, which is the holy feast of seven weeks, a fine meal was prepared for me[c][b], and I reclined to eat.
translation:
  language: zh_hans
  text: 我回到自己家里后，妻子安娜和儿子多比雅又回到我身边。到了五旬节，就是神圣的七七节[a]，为我预备了一顿丰盛的饭菜；我便斜倚席上用饭[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “七七节”即七周节。希腊文称“五旬节”，随后解释为由七个星期构成的神圣节期。
    reason: alternative_reading
  - marker: b
    text: “斜倚席上”反映古代人在席间斜倚进食的习俗。
    reason: cultural_note
  - marker: c
    text: 与本节平行的闪语传统篇幅更长，还记载多比雅奉命去邀请一位贫穷的同族来一同吃饭；这里所译的较短希腊文本没有这段内容。
    reason: textual_variant
lexical_decisions:
- source_word: κατῆλθον εἰς τὸν οἶκόν μου
  choice: 我回到自己家里
  rationale: κατέρχομαι字面有“下来”之意，但这里在叙事中表示回家；现代汉语若直译“下到家里”不自然，因此以“回到”传达语境功能，οἶκος译为“家里”。
- source_word: ἀπεδόθη μοι
  choice: 也回到了我身边
  rationale: ἀποδίδωμι的被动式表示“被归还、回到某人那里”。“回到了我身边”自然表达一家人在分离后重聚，同时不额外说明是谁使他们回来。
- source_word: Ἄννα … Τωβίας
  choice: 安娜……多比雅
  rationale: 安娜按希腊名形式音译；Τωβίας采用更能反映其闪语名称的“多比雅”，而不采用受拉丁语影响的形式。
- source_word: ἐν τῇ πεντηκοστῇ ἑορτῇ
  choice: 到了五旬节
  rationale: 保留希腊文πεντηκοστή的传统名称“五旬节”；下文随即以“七七圣节”说明其犹太节期身份。
- source_word: ᾗ ἐστιν ἁγία ἑπτὰ ἑβδομάδων
  choice: 就是七七圣节
  rationale: 原文较凝缩，直指由七个七日构成的神圣节期。中文“七七圣节”既保留数字结构，又自然说明五旬节即七七节。
- source_word: ἐγενήθη ἄριστον καλὸν μοι
  choice: 有人为我备好了一顿丰盛的饭菜
  rationale: 字面为“有一顿美好的午餐为我而成”。用不定施事“有人”表达希腊语事件性说法，避免误以为饭菜自行出现；“丰盛的饭菜”自然传达ἄριστον καλόν。
- source_word: ἀνέπεσα τοῦ φαγεῖν
  choice: 我便斜倚席上用饭
  rationale: ἀναπίπτω指古代筵席中斜倚进食，不宜泛化为“坐下”；目的不定式以“用饭”自然表达。
theological_decisions:
- issue: 申命记传统中的犹太节期πεντηκοστή应如何称呼
  choice: 五旬节，就是七七圣节
  alternative: 七七节（或七周节）
  rationale: 保留希腊文本身的“五旬节”称谓，同时依据紧随其后的解释明确这是犹太人的七七节，避免只产生后世基督教节期的联想。
- issue: 家人“归还”给多比特的施事是否应明确
  choice: 妻子和儿子也回到了我身边
  alternative: 妻子和儿子被交还给我
  rationale: 希腊文采用神学上可能开放的被动表达，并未点明施事；中文不补出“上帝”，以保留原文的含蓄与张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以短句理顺希腊文较长的句法；保留“五旬节”并用“七七圣节”即时解释。家人重聚处不补明神圣施事，筵席姿势则以“斜倚席上”保存古代文化细节。
