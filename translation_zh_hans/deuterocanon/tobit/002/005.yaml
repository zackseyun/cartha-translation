base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/005.yaml
  text: And when I returned[b][a], I washed myself and ate my bread in sorrow.
translation:
  language: zh_hans
  text: 我回来后，就洗了澡[a]，忧伤地吃自己的饭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“洗了自己”。按上下文，这很可能是接触尸体后所行的洗浴；平行的闪语传统更明确地提到洁净的背景。
    reason: cultural_note
  - marker: b
    text: 或译“吃自己的饼”。希腊文直译为“我的饼”；“饼”也可泛指食物或一餐。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψας
  choice: 回来后
  rationale: 不定过去时分词表示先于主要动作发生的事；“回来后”自然、清楚地呈现叙事次序。
- source_word: ἐλουσάμην
  choice: 洗了澡
  rationale: 中间语态表明主体为自己洗浴。“洗了澡”符合现代汉语，也不在正文中额外断定这是礼仪性的洁净行动。
- source_word: ἤσθιον
  choice: 吃
  rationale: 未完成过去时在此叙事序列中可自然译作过去发生的动作；汉语借“了”及上下文表达其已发生。
- source_word: τὸν ἄρτον μου
  choice: 自己的饭
  rationale: ἄρτος字面为“饼”，也可转指食物或一餐。“自己的饭”在现代汉语中自然，并保留第一人称所有关系；字面意义在脚注中说明。
- source_word: ἐν λύπῃ
  choice: 忧伤地
  rationale: λύπη可指忧伤、悲痛或愁苦；“忧伤地”自然表达进食时的情绪，同时不把其具体原因解释得过满。
theological_decisions:
- issue: 是否在正文中明确说明洗浴与礼仪洁净有关
  choice: 仅译为“洗了澡”
  alternative: “洁净了自己”或“为洁净自己而沐浴”
  rationale: 上下文及平行的闪语传统支持尸体不洁的背景，但希腊文本本身只明确说洗浴。正文保留这一限度，脚注补充文化背景，以免把推断写成明文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“洗了澡”避免生硬的“洗了自己”；“自己的饭”体现ἄρτος在此可泛指食物或一餐。句法保持简洁的先后顺序，并以“忧伤地”保留ἐν λύπῃ的情感状态。
