  yaml_path: translation/deuterocanon/tobit/002/010.yaml
  text: And I did not know that sparrows were in the wall[a]; and while my eyes were open, the sparrows dropped warm dung into my eyes, and white films formed on my eyes. Then I went to physicians, but they did not help me[b]. But Achiacharus supported me until I went to Elymais.
translation:
  language: zh_hans
  text: 我不知道墙里有麻雀[a]。当时我的眼睛正睁着，麻雀将温热的粪便排在我眼中，于是我的眼睛上生了白膜[b]。我去找医生，他们却没有使我好转。后来，亚希阿卡一直供养我，直到我前往以吕迈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “麻雀”也可译作“小鸟”；希腊词可泛指小型鸟类，但这里最可能是麻雀。
    reason: lexical_alternative
  - marker: b
    text: 原文指眼睛上形成白色的膜状物或白色混浊物，常被理解为类似白内障的病症，但原文并未给出明确的医学诊断。
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: 麻雀
  rationale: 该词常指麻雀，也可泛指小鸟；正文采用最可能且自然的“麻雀”，脚注保留较宽泛的可能。
- source_word: ἐν τῷ τοίχῳ
  choice: 墙里
  rationale: 贴近希腊文“在墙中”，可自然理解为鸟栖息在墙洞或缝隙内，不改译为屋顶。
- source_word: ἀφώδευσαν ... θερμὰ
  choice: 把热粪落进
  rationale: 保留原文排泄物及其温热状态的具体、直白表达，同时用现代汉语自然叙述。
- source_word: λευκώματα
  choice: 白膜
  rationale: 描述眼睛上形成的白色不透明物，不贸然诊断为现代医学所说的白内障。
- source_word: ἰατρούς
  choice: 医生
  rationale: 准确而符合现代普通读者的用语。
- source_word: οὐκ ὠφέλησάν με
  choice: 没能治好我
  rationale: 在求医语境中表达医生未使其病况得到改善；比字面的“没有帮助我”更自然，但不暗示其治疗手段。
- source_word: ἔτρεφέν με
  choice: 供养我
  rationale: τρέφω可指喂养，也可指维持生活；此处指失明期间持续提供生活所需，“供养”兼顾两者。
- source_word: Ἐλυμαΐδα
  choice: 以吕迈
  rationale: 按希腊地名Ἐλυμαΐς采用简洁的现代汉语音译。
theological_decisions:
- issue: 多比眼疾的医学性质
  choice: 以“白膜”作描述性翻译
  alternative: 白内障；白斑；眼睛混浊
  rationale: 原文只说眼睛上形成λευκώματα，并未给出精确的现代医学诊断；保留描述可避免增加文本没有的确定性。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“热粪”保留原文的直白具体；“供养”体现主人公失明后受人维持生活的语境。所有脚注标记均置于相应正文词语之后。
