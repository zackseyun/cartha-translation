base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/002.yaml
  text: And I saw much food[a], and I said to my son, “Go and bring whichever one of our brothers you may find in need, who remembers the Lord; and behold[c][b], I am waiting for you.”
translation:
  language: zh_hans
  text: 我看见许多食物[a]，就对我儿子说：“去吧，无论你在我们的弟兄[b]中找到哪个有需要、记念主的人，就把他带来。看哪，我在这里等你[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”也可译作“许多菜肴”或“许多肉食”；希腊词可指一餐中预备好、配饼食用的食物。
    reason: lexical_alternative
  - marker: b
    text: 这里的“弟兄”指多比同族或同一群体中的人，不仅指亲兄弟。
    reason: cultural_note
  - marker: c
    text: 这句话在希腊文传本中较为生硬；大意是多比留在原处，等儿子回来。
    reason: textual_variant
lexical_decisions:
- source_word: ἐθεασάμην
  choice: 我看见
  rationale: 此处是叙事中的感知动词，用现代汉语“看见”自然准确，无须采用古雅的“观看”或“ behold”式表达。
- source_word: ὄψα πολλά
  choice: 许多食物
  rationale: ὄψα可指配饼食用的熟食、菜肴或肉食；“许多食物”保留其宽泛含义，不限定具体菜色。
- source_word: Βάδισον καὶ ἄγαγε
  choice: 去吧……把他带来
  rationale: 两个命令分别表达出去寻找和带人回来；这样译符合自然汉语，也保留动作次序。
- source_word: ὃν ἐὰν εὕρῃς
  choice: 无论找到谁
  rationale: 关系代词与ἐάν表达不确定、开放的对象；“无论找到谁”在汉语中清楚保留这一点。
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: 我们的弟兄
  rationale: 保留原文男性亲属称谓，同时以脚注说明这里指同族或同一群体成员，并非仅指亲兄弟。
- source_word: ἐνδεής
  choice: 生活困苦
  rationale: 该词表示有所缺乏、处于需要之中；“生活困苦”在本段宴席与施济语境中自然，也不把含义严格缩限为无钱。
- source_word: ὃς μέμνηται τοῦ κυρίου
  choice: 又记念主
  rationale: 直译μέμνηται的“记念”保留其敬虔意味，而不进一步解释为敬畏、信奉或遵守。
- source_word: ἰδοὺ μένω σε
  choice: 看哪，我在这里等你
  rationale: 希腊语传本文句略显生硬；“看哪”对应ἰδού，“我在这里等你”表达父亲留下等待儿子返回的语境意义，同时以脚注提示原文的困难。
theological_decisions:
- issue: κύριος在敬虔用语中的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 希腊文本作κύριος，而非直接保存希伯来神名；译作“主”最贴近现有原文，也避免加入原文未明说的形式。
- issue: “我们的弟兄”的群体范围
  choice: 正文保留“我们的弟兄”
  alternative: 我们的同胞；我们的族人
  rationale: 原文使用男性亲属词ἀδελφοί，但语境很可能指多比所属群体中的成员。正文保留比喻性的亲属称谓，脚注交代其较广范围，避免静默消解原文表达。
- issue: “记念主”的含义
  choice: 保留“记念主”
  alternative: 敬畏主；心里有主
  rationale: 原文的“记念”可能包含持续以主为念的敬虔意涵，但不宜在正文中将其具体化为另一种神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。对话中的“去吧”“把他带来”自然直接；“看哪”略带经文庄重感，用来对应ἰδού。所有脚注标记均置于相关正文词句之后。
