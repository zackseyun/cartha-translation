base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/004.yaml
  text: And I, before I had tasted anything, sprang up and removed him into a room until the sun set.
translation:
  language: zh_hans
  text: 我还没有吃任何东西，就猛地站起来，把他搬进一间屋子里，直到太阳落山。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὶν ἢ γεύσασθαί με
  choice: 我还没有吃任何东西
  rationale: γεύομαι本义为“尝”，在进食语境中自然表达为“吃”；保留“尚未进食便行动”的时间关系。
- source_word: ἀναπηδήσας
  choice: 就跳起来
  rationale: 准确传达突然迅速起身的动作，较“站起来”更能保留原文力度。
- source_word: ἀνειλόμην αὐτὸν
  choice: 把他搬进
  rationale: 此处指收起并转移死者；“搬进”符合尸体被移到屋内的具体情境，也不额外引入埋葬等动作。
- source_word: εἰς τι οἴκημα
  choice: 一间屋里
  rationale: τι使地点不特指；οἴκημα可指房间或屋舍，译作“一间屋里”自然且保留不确定性。
- source_word: ἕως οὗ ἔδυ ὁ ἥλιος
  choice: 等到太阳落山
  rationale: 直译其时间终点，表达把死者暂置屋内直至日落。
theological_decisions:
- issue: 是否根据间接希伯来平行材料明说日落后埋葬
  choice: 不增译埋葬行为
  alternative: 译入“日落后去埋葬他”
  rationale: 本节主要锚点希腊文只陈述将死者移入屋内并等到日落；间接希伯来材料不是古代希伯来底本，且内容扩展不可覆盖希腊文本。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体；句式紧凑，保留原文动作的急迫感及“一间屋”的非特指性。
