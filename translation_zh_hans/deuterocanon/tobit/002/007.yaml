  text: And I wept. And when the sun had set[a], I went and dug and buried him.
translation:
  language: zh_hans
  text: 我哭了。太阳落山后，我就去挖土[a]，把他埋葬了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“挖掘了以后”；没有明说所挖的是什么，埋葬的语境暗示是在掘土预备墓穴。
    reason: 说明原文省略宾语，并交代中文为自然表达而采用“挖土”。
lexical_decisions:
- source_word: ἔκλαυσα
  choice: 我哭了
  rationale: κλαίω的不定过去时表示哭泣；译作“我哭了”简洁自然，保留情感力度，又不把它限定为正式举哀。
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: 太阳落山后
  rationale: 原文表示太阳落下之时，并在叙事次序上先于随后行动；“太阳落山后”符合现代汉语表达。
- source_word: ᾠχόμην
  choice: 我就去
  rationale: 该动词表示离去或前往；此处用“去”最自然，“就”衔接前述时间并呈现连续行动。
- source_word: ὀρύξας
  choice: 挖土
  rationale: 该分词字面义为“挖掘”，原文未明说宾语。汉语单说“挖”不够自然，译作“挖土”既清楚，也不把隐含内容进一步具体化为“坟墓”。
- source_word: ἔθαψα αὐτόν
  choice: 把他埋葬了
  rationale: θάπτω通常指埋葬死者；“把他埋葬了”清楚、庄重，并准确保留阳性单数代词所指的人。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。保留原文两个短句及动作次序；不将“哭”扩大解释为礼仪性的哀悼，也不把“挖掘”明确补成“挖坟墓”。
