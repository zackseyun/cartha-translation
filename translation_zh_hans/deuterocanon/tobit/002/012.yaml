  text: And she would send it to the owners[a], and they also paid her wages, adding a young goat.
translation:
  language: zh_hans
  text: 她常把做好的活送给雇主[a]；他们也付给她工钱，另外还送了一只小山羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主人”。希腊语κυρίοις在这里指她为之工作的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστελλεν
  choice: 常把……送回
  rationale: 未完成时在叙事中表示惯常、反复的动作；结合工作语境，用“常把做好的活送回”自然表达持续习惯，也补出原文语境所隐含的工作成果。
- source_word: τοῖς κυρίοις
  choice: 雇主那里
  rationale: κύριοι在此为复数，指安排并支付她工作的那些人，并非神学称号。“雇主”符合现代汉语劳动语境；“主人”仍是可能的直译，故列入脚注。
- source_word: ἀπέδωκαν
  choice: 付给
  rationale: ἀποδίδωμι本可表示归还、偿还，但与μισθός连用时明确指支付报酬，译为“付给”最自然。
- source_word: τὸν μισθόν
  choice: 工钱
  rationale: μισθός指劳动所得的报酬；“工钱”通俗、明确，也适合此处家庭手工业的叙事情境。
- source_word: προσδόντες
  choice: 另外还送了
  rationale: 分词表示在工钱之外又额外给予某物；“另外还”保留附加之意。
- source_word: ἔριφον
  choice: 一只小山羊
  rationale: ἔριφος指幼小的山羊；“小山羊”在现代汉语中比“小羊羔”更准确，后者通常让人想到绵羊。
theological_decisions:
- issue: 非神学语境中κυρίοις的译法
  choice: 雇主
  alternative: 主人
  rationale: 这里的复数κύριοι指她为之工作、并向她支付工钱的人，不是对上帝或基督的称号。译作“雇主”可避免不必要的神学联想，同时脚注保留较字面的“主人”。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“常……；……也……”保留原文两个未完成时所呈现的惯常情形；“做好的活”是依据上下文补明的隐含宾语，不增添新的事件内容。
