base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/008.yaml
  text: And the neighbors were mocking[a], saying, “He is no longer afraid of being put to death over this matter; he ran away, and look, he is burying the dead again.”
translation:
  language: zh_hans
  text: 邻人讥笑说[a]：“他已经不怕因这事被杀了；他逃走了，看，他又在埋葬死人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 《托比传》的其他文本传统在这里有很大差异。间接的希伯来语回译文本没有记载邻人因托比特埋葬死人而讥笑他，而是记载哈拿说：托比特所行的慈爱和公义，在他遭受困苦和羞辱时并没有帮助他。
    reason: textual_variant
lexical_decisions:
- source_word: οἱ πλησίον
  choice: 邻人们
  rationale: 该复数名词化形容词指住在附近的人；“邻人们”自然、庄重，也不把范围过度限定为紧邻住户。
- source_word: ἐνέγελων
  choice: 都讥笑说
  rationale: 未完成时表达持续或反复的嘲弄；“讥笑”兼顾言语奚落与嘲笑之意，“说”承接后面的直接引语。
- source_word: Οὐκέτι φοβεῖται
  choice: 已经不怕
  rationale: 保留οὐκέτι“不再”的时间转变含义，并以现代汉语自然表达其嘲讽语气。
- source_word: φονευθῆναι
  choice: 被处死
  rationale: 被动不定式表示遭杀害；结合此前因埋葬死人而面临的官方惩罚，“被处死”贴合语境，但不进一步规定处刑方式。
- source_word: περὶ τοῦ πράγματος τούτου
  choice: 因这事
  rationale: 此处περί带出相关缘由，πρᾶγμα指事情或事件；“因这事”简洁地保留因果关联。
- source_word: ἀπέδρα
  choice: 曾经逃走
  rationale: 不定过去时回指他先前的逃亡；“曾经”清楚标示该动作发生在当前埋葬行动之前。
- source_word: καὶ ἰδοὺ
  choice: 看哪，现在
  rationale: ἰδού是引人注意的语气词；“看哪”保留原文突显眼前情形的力度，“现在”使汉语衔接自然。
- source_word: πάλιν
  choice: 又
  rationale: 直接表达动作再次发生。
- source_word: θάπτει τοὺς νεκρούς
  choice: 埋葬死人
  rationale: 现在时描写眼前正在进行的行为；“埋葬死人”准确而通俗，并保留复数集合意义。
theological_decisions:
- issue: 希腊文本与闪语平行传统的取舍
  choice: 正文依照希腊文本，记述邻人讥笑托比特再次埋葬死人。
  alternative: 间接的希伯来语回译本在此写哈拿责问托比特：他的慈爱和义行在困苦、羞辱中并未帮助他。
  rationale: 指定的主要原文依据是Swete所刊希腊文本；所列希伯来语材料是十九世纪依据一份亚兰语抄本所作的回译，并非古代希伯来语底本，不能取代希腊正文，但应以脚注说明显著的文本传统差异。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“看哪”略带经文语体，用来保留ἰδού引人注意的修辞作用；其余措辞避免古奥。
