base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/003.yaml
  text: And he came and said[a], “Father, one of our own people has been strangled and thrown down in the marketplace.”
translation:
  language: zh_hans
  text: 他来后说：“父亲，我们本族[a]中有一个人被勒死了，尸体被扔在集市上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “本族”或译“亲族”。希腊语 γένος 可指家族、亲族或同族之人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: 回来后
  rationale: 这是先于主要动词“说”发生的简单过去分词；结合叙事语境，译作“回来后”比生硬直译“来到后”更符合现代汉语。
- source_word: Πάτερ
  choice: 父亲
  rationale: 保留直接称呼，不增添希腊文未明说的物主成分。
- source_word: εἷς ἐκ τοῦ γένους ἡμῶν
  choice: 我们本族中有一个人
  rationale: γένος 可指家族、亲族或同族群体；“本族”保留范围上的弹性，并适合这里共同体成员的语境。
- source_word: ἐστραγγαλωμένος
  choice: 被勒死了
  rationale: 准确表达被动及死亡结果，又避免用“吊死”擅自限定具体方式。
- source_word: ἔρριπται
  choice: 尸体被扔在
  rationale: 完成时被动态表明此人被抛下后仍躺在那里；补出“尸体”使现代汉语清楚自然，但不改变所指。
- source_word: ἐν τῇ ἀγορᾷ
  choice: 在集市上
  rationale: ἀγορά 指公共市场或广场；“集市”自然简明，同时保留公共场所的含义。
theological_decisions:
- issue: γένος ἡμῶν 的范围
  choice: 本族中的人
  alternative: 我们的亲族／我们家族中的人
  rationale: 上下文表明死者属于托比特的共同体，却不能确定是近亲。“本族”既不把关系限缩为直系或近亲，也保留共同血缘、族群归属的意味。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被勒死了，尸体被扔在集市上”清楚呈现两个完成时被动形式所表达的死亡及弃尸后的现状。
