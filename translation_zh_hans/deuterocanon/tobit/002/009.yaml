  yaml_path: translation/deuterocanon/tobit/002/009.yaml
  text: And on that very night[a], after I had gone out and buried him, I lay down to sleep in a defiled state beside the wall of the courtyard, and my face was uncovered.
translation:
  language: zh_hans
  text: 就在那天夜里，我安葬了他回来后，因处于礼仪性不洁[a]的状态，便躺在院子的墙边睡觉；我的脸没有遮盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼仪性不洁”也可译作“受了玷污”或“不洁”。这里指安葬死者后所处的礼仪性不洁状态，并非道德上的污秽。“回来”所译的希腊词也可理解为“离开”；原文的方向含义有讨论。
    reason: 说明μεμιαμμένος的礼仪性含义，并保留ἀνέλυσα方向含义的文本歧义。
lexical_decisions:
- source_word: ἐν αὐτῇ τῇ νυκτί
  choice: 就在那天夜里
  rationale: 保留指示语与强调语序所表达的紧接性，同时符合现代汉语叙事习惯。
- source_word: ἀνέλυσα θάψας
  choice: 我埋葬了他回来后
  rationale: θάψας表示先行的埋葬行动，宾语“他”由上文补足；ἀνέλυσα在此按返回理解，使动作次序自然，但该动词也可能表示离去。
- source_word: ἐκοιμήθην
  choice: 便睡在
  rationale: 结合地点短语，简洁表达躺下睡觉的叙事动作。
- source_word: μεμιαμμένος
  choice: 因礼仪上不洁
  rationale: 完成时分词表示埋葬死者后处于沾染状态；加入“礼仪上”以避免误解为道德污秽。
- source_word: παρὰ τὸν τοῖχον τῆς αὐλῆς
  choice: 在院墙旁
  rationale: 准确而自然地表达庭院墙边的空间位置。
- source_word: τὸ πρόσωπόν μου ἀκάλυπτον ἦν
  choice: 脸没有遮盖
  rationale: 严格保留πρόσωπον的“脸”而非“头”，并以现代汉语表达其暴露状态。
theological_decisions:
- issue: 埋葬死者后所涉及的污秽
  choice: 因礼仪上不洁
  alternative: 受了玷污／不洁净
  rationale: 这里描述的是接触安葬事务后形成的礼仪性状态，并非道德罪责；译文明确这一点，同时用脚注保留较简短的替代译法。
- issue: ἀνέλυσα的方向含义
  choice: 回来后
  alternative: 离开后
  rationale: 该动词在上下文中可理解为返回或离去；正文采用较连贯的“回来”，脚注说明原词存在另一种可能，避免掩盖文本歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“就在那天夜里”保留强调；“院墙旁”“脸没有遮盖”简明具体。脚注兼顾礼仪语义与动词方向的文本歧义。
