- source_word: ἐν τοῖς γυναικείοις
  choice: 妇女通常做的活儿
  rationale: 此短语较可能指当时通常由妇女从事的工作领域，而非单纯指妇女居住的地方；加入“通常”避免暗示这些工作在本质上只属于妇女。
