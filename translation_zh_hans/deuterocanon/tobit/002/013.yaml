  yaml_path: translation/deuterocanon/tobit/002/013.yaml
  text: But when she came to me[a], she began to cry out, and I said to her, “Where is the young goat from? Is it stolen? Give it back to its owners, for it is not lawful to eat what is stolen.”
translation:
  language: zh_hans
  text: 可是她来到我这里时，便开始大声喊叫。我对她说：“这只小山羊[a]是从哪里来的？莫非是偷来的？把它还给原主，因为吃偷来的东西是不可以的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小山羊”也可译作“山羊羔”。
    reason: 说明ἔριφον的自然汉语对应词。
lexical_decisions:
- source_word: ἤρξατο κράζειν
  choice: 便大声叫了起来
  rationale: κράζειν表示高声喊叫；译文保留声音的强度，却不擅自断定这是愤怒、悲伤还是抗议。
- source_word: Πόθεν τὸ ἔριφον;
  choice: 这只小山羊是从哪里来的？
  rationale: πόθεν询问来源，ἔριφον指幼小的山羊；这一译法符合现代汉语表达。
- source_word: ἔριφον
  choice: 小山羊
  rationale: 清楚指明动物及其幼小，普通读者容易理解；“山羊羔”亦可。
- source_word: μὴ κλεμμάιον ἐστίν;
  choice: 莫非是偷来的？
  rationale: μή引导的问题带有怀疑或担心；“莫非”自然传达这种倾向，同时仍保留问句而不把怀疑变成断言。
- source_word: ἀπόδος αὐτὸ τοῖς κυρίοις
  choice: 把它还给原主
  rationale: ἀπόδος要求归还，κυρίοις在这里指物主；“原主”简洁自然，也避免神学意义上的“主”。
- source_word: θεμιτὸν
  choice: 可以
  rationale: 在否定结构“不可以”中表达道德与规范上的不许可，比现代法律术语“不合法”自然，也不特指某一套成文法。
- source_word: φαγεῖν κλεψιμαῖον
  choice: 偷来的东西是不可以吃的
  rationale: 保留原文较宽泛的“偷来之物”，同时用现代汉语可理解的句式表达不可食用之意。
theological_decisions:
- issue: θεμιτὸν所表达的道德—规范力度
  choice: 因为偷来的东西是不可以吃的
  alternative: 因为吃偷来的东西是不合法的
  rationale: “不可以”保留规范性和道德约束力，却避免让现代读者误以为这里专指当代民事或刑事法律。
- issue: ἤρξατο κράζειν的隐含主语
  choice: 按连续叙事理解为来到多比身边的女子，并译作“便大声叫了起来”
  alternative: 理解为小山羊开始鸣叫
  rationale: 所给希腊文本没有在该分句明说主语；依语法与叙事的自然连续性，并参考随后αὐτῇ“问她”，采用女子为主语的读法，但不加入“抗议”等进一步解释。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。“莫非”体现带有怀疑的问法；“原主”避免“主人”可能造成的歧义。脚注标记置于其实际解释的“小山羊”之后。
