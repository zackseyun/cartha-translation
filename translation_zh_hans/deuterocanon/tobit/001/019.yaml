  yaml_path: translation/deuterocanon/tobit/001/019.yaml
  text: But one of the men in Nineveh went and informed the king about me[a], that I was burying them; and I hid myself. Then, realizing that I was being sought to be put to death[b], I withdrew in fear.
translation:
  language: zh_hans
  text: 可是，尼尼微人中有一个前去向王禀报，说我在埋葬他们；我便藏了起来。后来我得知自己正遭追捕，要被处死[b]，便因害怕而离开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希腊文以被动式和不定式作压缩表达，近字面可作：“我正被追寻而死。”也可译作：“他们正搜捕我，要杀我。”
    reason: 说明ζητοῦμαι ἀποθανεῖν保留了“我正被追寻”的被动形式，并表达死亡的结果或目的；正文采用自然汉语，未暗示已经判刑。
lexical_decisions:
- source_word: πορευθεὶς
  choice: 去
  rationale: 不定过去时分词在此表示先于主要动词发生的动作；汉语用“去向王告发”自然呈现动作次序。
- source_word: εἷς τῶν ἐν Νινευὴ
  choice: 尼尼微城里的人中有一个
  rationale: 原文直译为“在尼尼微的那些人中有一个”。译文补出“人”，既说明省略成分，又不限定其身份。
- source_word: ὑπέδειξε
  choice: 告发
  rationale: 这里指向王提供有关多俾亚的不利消息；“告发”比泛泛的“告诉”更切合当时受追究的语境。
- source_word: περὶ ἐμοῦ
  choice: 我
  rationale: 与“告发”搭配时，汉语直接说“告发我”，自然表达“有关我”的含义。
- source_word: ὅτι θάπτω αὐτούς
  choice: 说我埋葬他们
  rationale: 保留θάπτω的现在时形态所表达的行为，不擅自限定为一次完成的行动；“他们”照应上文所述死者。
- source_word: ἐκρύβην
  choice: 我就躲藏起来
  rationale: 该被动形态在语境中具有不及物或反身意义；“躲藏起来”符合现代汉语叙事表达。
- source_word: ἐπιγνοὺς
  choice: 我得知
  rationale: 表示确认、获知正在发生的危险；“得知”兼顾认知结果和叙事顺序。
- source_word: ζητοῦμαι ἀποθανεῖν
  choice: 他们正在搜捕我，要置我于死地
  rationale: 原文结构压缩，直译近于“我正被寻找，为要死”；正文改用自然的汉语主动句，同时用脚注保留其被动形式。
- source_word: φοβηθεὶς
  choice: 因害怕
  rationale: 分词可表达伴随情状或原因；在此危险语境中，“因害怕”自然说明离开的动因。
- source_word: ἀνεχώρησα
  choice: 离开了
  rationale: ἀναχωρέω表示退去或离开；“离开”不将其强化为仓皇“逃跑”，保留原词力度。
theological_decisions:
- issue: 多俾亚面对处死威胁时的反应
  choice: 译为“因害怕而离开了”
  alternative: 因害怕而逃走了
  rationale: 原文既明确提到恐惧，也只用ἀναχωρέω表示离去或退避，并不必然具有“逃窜”的强烈色彩；译文避免强化人物评价或戏剧性。
- issue: 搜捕与处死之间的关系
  choice: 译为“他们正在搜捕我，要置我于死地”
  alternative: 我正被搜捕，要被处死
  rationale: 原文保留搜捕和死亡目的之间的张力。正文采用现代汉语较自然的主动表达，但不把它解释成已经判刑或必然处决。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。叙事连接词“可是”“后来”“便”使动作顺序清楚；避免古奥措辞，也不将“离开”强化为“逃跑”。
