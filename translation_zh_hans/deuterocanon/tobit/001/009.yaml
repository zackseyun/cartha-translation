base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/009.yaml
  text: And when I became a man[a], I took Anna as my wife from the seed of our ancestral family[b], and by her I fathered Tobiah.
translation:
  language: zh_hans
  text: 我成年后，娶了安娜为妻；她出自我们父系家族的血脉，我和她生了多比雅。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγενόμην ἀνήρ
  choice: 长大成人
  rationale: 这是达到成年男子阶段的惯用表达；“长大成人”在现代汉语中自然，也保留人生阶段的含义。
- source_word: ἔλαβον Ἄνναν γυναῖκα
  choice: 娶了安娜为妻
  rationale: 准确传达希腊语“取……为妻”的婚姻习语，同时符合现代汉语表达。
- source_word: ἐκ τοῦ σπέρματος τῆς πατριᾶς ἡμῶν
  choice: 我们父系家族的后裔
  rationale: σπέρμα在此指后裔或血脉，πατριά指按父系追溯的家族群体；此译法保留父系血缘含义，又避免“种子”等生硬直译。
- source_word: ἐγέννησα ἐξ αὐτῆς
  choice: 她为我生了
  rationale: 希腊语以男性叙述者为主语，直义近于“我从她生了”；汉语用“她为我生了”自然清楚，并保留明确的母亲指涉。
- source_word: Τωβίαν
  choice: 多比雅
  rationale: 采用较直接反映希腊语Τωβίας及其闪语背景的中文音译，并与父亲多比的名字有所区分。
theological_decisions:
- issue: 男性成年阶段的表述
  choice: 长大成人
  alternative: 成为男子；成年以后
  rationale: 上下文明确是男性自述，但现代汉语“长大成人”已自然表达其达到婚龄和成年阶段，无须加入超出原文的法律或宗教含义。
- issue: 父系亲族内婚的强调
  choice: 我们父系家族的后裔
  alternative: 我们家族血脉中的女子；我们宗族的人
  rationale: 原文强调安娜来自叙述者所属的父系家族，但没有在本节中进一步说明法规或教义，因此只呈现亲缘关系本身。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“父系家族的后裔”略带正式色彩，以保留原文的血缘与宗族表达；分号使婚姻与生子两个叙事动作层次清楚。
