revisions:
- from: 我长大成人后，就娶了我们父系家族的后裔安娜为妻；她为我生了多比雅。
  to: 我成年后，娶了安娜为妻；她出自我们父系家族的血脉，我和她生了多比雅。
  rationale: 修正亲族谱系短语的中文句法和语义关系，并使生子句在自然汉语中较贴近希腊文的第一人称叙述与对安娜的明确指涉。未增添有关亲族婚姻法规或教义的解释。
