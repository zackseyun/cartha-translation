  to: 还不到五十天，他的两个儿子就杀了他，逃往亚拉腊群山。随后，他的儿子撒刻尔多诺斯[a]接替他作王，并任命亚希阿卡罗斯[b]——就是我兄弟的儿子亚纳埃尔的儿子——主管王国的一切账务和全部政务。
