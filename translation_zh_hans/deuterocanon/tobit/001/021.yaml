  yaml_path: translation/deuterocanon/tobit/001/021.yaml
  text: And before fifty days had passed[a], his two sons killed him and fled to the mountains of Ararat. And Sacherdonos his son reigned in his place, and he appointed Achiacharos, the son of Anael, my brother's son[b], over all the accounts of his kingdom and over the whole administration.
translation:
  language: zh_hans
  text: 还不到五十天，他的两个儿子就杀了他，逃往亚拉腊群山。随后，他的儿子撒刻尔多诺斯[a]接替他作王，并任命亚希阿卡罗斯[b]——就是我兄弟的儿子亚纳埃尔的儿子——主管王国的一切账务和全部政务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撒刻尔多诺斯”是亚述王名的希腊语形式，通常也译作“以撒哈顿”。
    reason: 说明源自希腊底本的音译与较常见历史译名之间的对应关系。
  - marker: b
    text: “亚希阿卡罗斯”是这个名字的希腊语形式，通常也译作“阿希卡尔”。
    reason: 说明源自希腊底本的音译与较常见译名之间的对应关系。
lexical_decisions:
- source_word: οὐ διῆλθον ἡμέραι πεντήκοντα ἕως οὗ
  choice: 还不到五十天……就
  rationale: 以自然的现代汉语表达原文“未过五十天便……”的短暂间隔和时间强调。
- source_word: ἀπέκτειναν
  choice: 杀了
  rationale: 直接、中性地表达杀死，不额外加入“谋杀”所带的法律或道德定性。
- source_word: ἔφυγον εἰς τὰ ὄρη Ἀραράθ
  choice: 逃往亚拉腊群山
  rationale: “逃往”保留行刺之后逃离的语义；ὄρη为复数，译作“群山”。
- source_word: ἐβασίλευσεν ... ἀντʼ αὐτοῦ
  choice: 接替他作王
  rationale: 兼顾继位和作王两层含义，符合现代汉语叙事习惯。
- source_word: ἔταξεν
  choice: 任命
  rationale: 行政语境中表示正式委派职务。
- source_word: ἐπὶ πᾶσαν τὴν ἐκλογιστείαν
  choice: 主管王国的一切账务
  rationale: ἐκλογιστεία涉及核算、账目管理；“账务”既简洁又能体现行政财会职能。
- source_word: ἐπὶ πᾶσαν τὴν διοίκησιν
  choice: 主管……全部政务
  rationale: διοίκησις在此指更广泛的行政管理，与前面的账务形成由专门到整体的并列。
- source_word: Σαχερδονός / Ἀχιάχαρος / Ἀναήλ
  choice: 撒刻尔多诺斯 / 亚希阿卡罗斯 / 亚纳埃尔
  rationale: 依照所译希腊文本音译人名，不在正文中改用依据其他语言或历史传统形成的名称。
theological_decisions:
- issue: 其他圣经或历史传统中另有通行形式的人名
  choice: 正文采用反映希腊底本的音译
  alternative: 采用以撒哈顿、阿希卡尔等较通行的历史名称
  rationale: 这不是教义取舍，而是底本与译名政策问题；为忠实反映本节的希腊见证，正文保留希腊形式，并以脚注说明常见对应名称。
- issue: 亚希阿卡罗斯与叙述者的亲属关系
  choice: 译为“他兄弟的儿子亚纳埃尔的儿子”
  alternative: 译为“亚纳埃尔的儿子、我的侄子”或仅作含混的同位结构
  rationale: 按希腊语短语的层级，亚纳埃尔是叙述者兄弟的儿子，亚希阿卡罗斯则是亚纳埃尔的儿子；明确表达可避免把亚纳埃尔误作叙述者的兄弟。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“还不到五十天……就”使时间关系自然明晰；“接替他作王”“账务”“政务”保持历史叙事与宫廷行政语境。破折号用于清楚标示较复杂的亲属同位说明。
