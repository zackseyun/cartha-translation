base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/005.yaml
  text: and all the tribes that had apostatized were sacrificing to Baal the heifer[a], including the house of my father[b], Naphtali.
translation:
  language: zh_hans
  text: 所有背离信仰的支派都向小母牛巴力[a]献祭，连我父亲所属的拿弗他利家[b]也包括在内。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“牛犊巴力”。希腊语所用的词指小母牛或未产母牛；这个称呼可能与北国以色列崇拜中的牛形神像有关。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾的希腊语结构很简略，直译近似“以及我父亲的拿弗他利家”。其具体属格关系并不完全明确；这里按上下文理解为多比父亲所属、也即多比自己所属的拿弗他利家也参与其中。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσαι αἱ φυλαί
  choice: 所有……支派
  rationale: 这里指以色列各支派；“支派”比“宗族”更符合历史民族语境。
- source_word: αἱ συναποστᾶσαι
  choice: 一同背弃信仰的
  rationale: 复合分词含有共同参与背离之意；下文说向巴力献祭，因此这里的背离主要是宗教性的。“背弃信仰”自然易懂，也避免用较生僻的“叛教”。
- source_word: ἔθυον
  choice: 献祭
  rationale: 希腊语未完成时表示过去持续或惯常的行为；汉语在此无需另加进行标记，语境可承载这种持续性。
- source_word: τῇ Βάαλ
  choice: 向……巴力
  rationale: 与θύω连用的与格表示接受祭物的神祇，译为“向……巴力献祭”。
- source_word: τῇ δαμάλει
  choice: 母牛
  rationale: δαμάλις通常指年轻母牛；直译“母牛”保留其性别含义，同时在脚注说明也可理解为“牛犊”。
- source_word: ὁ οἶκος Νεφθαλεὶμ τοῦ πατρός μου
  choice: 其中也包括我父系的拿弗他利家族
  rationale: 句末希腊语结构压缩，意在把多比自己的祖族包括在前述参与者中。“父系的拿弗他利家族”在现代汉语中表达这种祖族关系，同时不把拿弗他利误解为多比的直接父亲。
theological_decisions:
- issue: συναποστᾶσαι所表达的背离性质
  choice: 背弃信仰
  alternative: 一同反叛／一同背离
  rationale: 向巴力献祭的紧接语境表明这是宗教和盟约层面的背离，而不只是政治叛乱。
- issue: τῇ Βάαλ τῇ δαμάλει的关系
  choice: 母牛巴力
  alternative: 牛犊巴力／与母牛神像相关的巴力
  rationale: 两个与格短语在希腊文中形成紧密的同位关系。正文直译以保留其不寻常表达，不擅自判定究竟是神名、称号还是神像关联；脚注交代词义和可能的崇拜背景。
- issue: 拿弗他利家族与说话者的关系
  choice: 我父系的拿弗他利家族
  alternative: 我父亲拿弗他利的家／我祖先拿弗他利的家族
  rationale: 希腊句法简略；结合以色列支派语境，理解为多比所属的父系祖族较自然，但以脚注保留原文结构的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“背弃信仰”明确宗教语境但不过度术语化；“母牛巴力”刻意保留原文不寻常且可能含混的同位表达，并用脚注辅助理解。
