  yaml_path: translation/deuterocanon/tobit/001/018.yaml
  text: And if Sennacherib the king killed any when he came fleeing from Judea[a], I buried them secretly; for in his anger he killed many, and the bodies were sought by the king, but they were not found.
translation:
  language: zh_hans
  text: 阿赫雷勒王[a]从犹太地区逃来时，若杀了什么人，我就暗中把他们埋葬。因为他盛怒之下杀了许多人；王搜寻那些尸体，却没有找到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“阿赫雷勒王”（Ἀχρειλ ὁ βασιλεύς）；按本书上下文，这是指西拿基立王。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ εἴ τινα
  choice: 若杀了什么人
  rationale: 保留条件式和不定指称；后文复数代词表明这是概括多次发生的情形。
- source_word: Ἀχρειλ ὁ βασιλεύς
  choice: 王阿赫雷勒
  rationale: 按所指定的 Swete 希腊文本音译专名，不在正文中静默改成上下文所指的标准历史名称；以脚注说明其身份。
- source_word: ὅτε ἦλθεν φεύγων ἐκ τῆς Ἰουδαίας
  choice: 从犹太地区逃回来时
  rationale: 结合叙事视角表达“逃离犹太地区而来”，既保留逃亡含义，也用自然现代汉语交代移动方向。
- source_word: ἔθαψα αὐτοὺς κλέπτων
  choice: 我就偷偷把他们埋葬
  rationale: κλέπτων 在此表示暗中、秘密行事，并非偷窃；“偷偷”自然传达其方式。
- source_word: ἐν τῷ θυμῷ αὐτοῦ
  choice: 他盛怒之下
  rationale: 表达 θυμός 的强烈愤怒色彩，又不增添超出原文的神学含义。
- source_word: ἐξητήθη ὑπὸ τοῦ βασιλέως τὰ σώματα
  choice: 王派人搜寻那些尸体
  rationale: 希腊文被动式表示尸体受到王权方面的搜寻；汉语用使动式自然说明行动由王发起，同时不暗示王亲自搜查。
- source_word: οὐχ εὑρέθη
  choice: 却没有找到
  rationale: 希腊文中性复数主语可配单数动词；汉语依语境理解为那些尸体均未被找到。
theological_decisions:
- issue: 亚述王专名的文本形式
  choice: 正文保留希腊抄本形式“阿赫雷勒”，脚注指出上下文所指为西拿基立。
  alternative: 正文直接作“西拿基立王”。
  rationale: 指定原文明确读作 Ἀχρειλ；虽然叙事上下文指向西拿基立，但把标准名直接放入正文会掩盖现存文本形式。脚注兼顾原文透明度和读者理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“犹太地区”明确地理含义；“尸体”比“身体”更符合死亡语境。正文保留原文专名的真实异文，并以脚注解释。
