base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/002.yaml
  text: who was taken captive in the days of Enemessaros king of the Assyrians[a], from Thisbe, which is to the south of Kedesh of Naphtali in Galilee[b], above Asher.
translation:
  language: zh_hans
  text: 他在亚述王埃内梅萨罗斯的日子，从提斯比被掳去；提斯比位于加利利拿弗他利的居迪奥斯右侧[a]，在亚设上方[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “右侧”直译希腊语；在地理描述中可能表示某一方位，但具体朝向并不确定。“居迪奥斯”这一地名也难以确定；有人将其辨认为拿弗他利的基低斯。
    reason: cultural_note
  - marker: b
    text: “上方”保留希腊语的空间说法；这里可能指地势较高，也可能指地图上的方位。希腊文本所写王名为“埃内梅萨罗斯”；有人认为这是亚述王撒缦以色。
    reason: alternative_reading
lexical_decisions:
- source_word: ᾐχμαλωτεύθη
  choice: 被掳
  rationale: 该被动动词表示被强行掳去作俘虏；“被掳”简洁自然，并保留强制意味。
- source_word: ἐν ἡμέραις
  choice: 在……的日子
  rationale: 贴近希腊语的惯用时间表达，同时在经文体中文中清楚庄重。
- source_word: Ἐνεμεσσαάρου
  choice: 埃内梅撒
  rationale: 按希腊文本所见音译，不直接与较熟悉的亚述王名“撒缦以色”合并。
- source_word: ἐκ Θίσβης
  choice: 从提斯比被带走
  rationale: ἐκ表示来源地；补出“被带走”使中文句法完整，并与“被掳”自然衔接。
- source_word: ἐκ δεξιῶν
  choice: 右边
  rationale: 保留希腊语字面的空间关系，不确定地理朝向时不径直解释为“南边”。
- source_word: Κυδίως
  choice: 居迪奥斯
  rationale: 该地名难以确定，依所见希腊形式音译，不在正文中改作可能的鉴定名“基低斯”。
- source_word: τῆς Νεφθαλεὶμ
  choice: 拿弗他利的
  rationale: 保留属格关系，表示居迪奥斯属于或位于拿弗他利地区。
- source_word: ἐν τῇ Γαλειλαίᾳ
  choice: 在加利利
  rationale: 采用现代中文通行地名译法。
- source_word: ὑπεράνω Ἀσήρ
  choice: 亚设上方
  rationale: 直译空间词ὑπεράνω，以保留可能表示地势或地图方位的含混性，不武断改成“亚设以北”。
