  text: But I kept watch over myself so as not to eat[b][a],
translation:
  language: zh_hans
  text: 我却谨慎自守，不吃[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“我守护我的灵魂，不吃”。这里“我的灵魂”是指“我自己”的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: 现存希腊文在这里很简短，似乎还要接入下一个分句；其要点是多比特有意不吃。
    reason: textual_variant
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: 我却
  rationale: δέ在上下文中表示轻微转折，突出多比特与他人行为的对比；“却”自然保留这一语气。
- source_word: συνετήρησα
  choice: 谨慎自守
  rationale: 该复合动词含谨慎看守、保守之意；结合反身性的“我的性命”和后接否定不定式，表达有意识的自我约束。“谨慎自守”既保留守护意味，也符合现代汉语表达。
- source_word: τὴν ψυχήν μου
  choice: 自守
  rationale: 字面为“我的性命／灵魂”，但此处用作反身表达，指说话者保守自己，并非在陈述灵魂与身体的教义性区分。汉语以“自守”自然传达此意，字面形式收入脚注。
- source_word: μὴ φαγεῖν
  choice: 不吃
  rationale: 否定不定式说明自守所达到或意在达到的行为结果。原文未在本句现存片段中明说吃什么，因此不补出宾语，以保留简短和未完接续的特点。
theological_decisions:
- issue: τὴν ψυχήν μου中ψυχή的人论含义
  choice: 按反身惯用语处理为“自守”
  alternative: 直译为“保守我的灵魂”或“保全我的性命”
  rationale: 上下文谈的是对饮食的自我约束，不是在建立身体与灵魂二分的教义。采用反身表达可避免把原文没有强调的神学含义带入译文，同时由脚注保存字面措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“谨慎自守”保留原文的守护意象，又避免生硬的“看守自己”；不补出食物种类，以免越过本节希腊文证据。
