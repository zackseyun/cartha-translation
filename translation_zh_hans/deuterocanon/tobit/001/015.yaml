  yaml_path: translation/deuterocanon/tobit/001/015.yaml
  text: And when Enemessar died[a], Achreil his son became king in his place, and his roads became unsafe[b], and I was no longer able to go into Media.
translation:
  language: zh_hans
  text: 埃内梅撒尔死后，他的儿子阿赫雷尔接替他作王[a]。他境内的道路变得不安全[b]，我再也无法前往米底亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所依据的希腊文本把两位君王的名字写作“埃内梅撒尔”和“阿赫雷尔”；《多俾亚传》的其他文本传统有不同的拼法，有时也记作不同的名字。
    reason: textual_variant
  - marker: b
    text: 译作“变得不安全”的希腊语动词词形罕见，含义不易确定。根据旅行的上下文，可能指道路陷入混乱、不安定或危险的状态，因此多俾亚不能再前往米底亚。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: 死后
  rationale: 以简明、自然的叙事用语表达死亡，并与后面的王位继承紧密衔接。
- source_word: ἐβασίλευσεν
  choice: 作王
  rationale: 此处的不定过去时指前王去世后继位；结合“接替他”，清楚表达登基继承。
- source_word: ἀντʼ αὐτοῦ
  choice: 接替他
  rationale: 这是王位继承语境中的替代关系；现代汉语用“接替他”比直译“代替他”更自然。
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: 他境内的道路
  rationale: ὁδοί在前往米底亚的旅行语境中指实际道路；属格关系可能指新王管辖范围内的道路，译文保留这一合理但并非绝对确定的关系。
- source_word: ἠκαταστάτησαν
  choice: 变得不安全
  rationale: 该词形罕见且难解；上下文表明道路陷入不安定或危险状态，以致无法继续旅行。“不安全”表达实际后果，又不武断地说道路完全不能通行。
- source_word: οὐκέτι ἠδυνάσθην
  choice: 我再也无法
  rationale: 准确表达能力或条件受到限制，并保留οὐκέτι所表示的“不再”。
- source_word: πορευθῆναι εἰς τὴν Μηδείαν
  choice: 前往米底亚
  rationale: 自然表达πορεύομαι的行旅意义及εἰς的方向性。
