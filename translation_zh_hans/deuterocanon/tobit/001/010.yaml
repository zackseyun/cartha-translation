base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/010.yaml
  text: And when we were taken captive to Nineveh[a], all my brothers and those of my kindred ate from the bread of the Gentiles;
translation:
  language: zh_hans
  text: 我们被掳到尼尼微的时候，我的弟兄和亲族都吃外邦人的食物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“外邦人的饼”（“饼”为复数）；这里的“饼”可泛指食物或口粮。
    reason: 说明ἄρτων的字面形式及其在本句中的惯用含义。
lexical_decisions:
- source_word: ᾐχμαλωτίσθημεν
  choice: 我们被掳
  rationale: 希腊语不定过去时被动语态表明他们被强行掳走；“被掳”简洁自然，也保留了被动和强制意味。
- source_word: εἰς Νινευή
  choice: 到尼尼微
  rationale: εἰς与移动动词连用，表示目的地；汉语译作“到尼尼微”自然准确。
- source_word: πάντες οἱ ἀδελφοί μου
  choice: 我所有的弟兄
  rationale: ἀδελφοί在此最自然地指叙事者的男性弟兄或同胞；“弟兄”保留原文的男性形式，并适合庄重叙事语体。
- source_word: οἱ ἐκ τοῦ γένους
  choice: 同族的人
  rationale: γένος表示出身、家族或宗族群体；“同族的人”与前面的“弟兄”有所区分，同时避免现代“种族”一词可能造成的误解。
- source_word: ἤσθιον
  choice: 都吃
  rationale: 未完成过去时可表示当时持续或惯常的行为；中文在此用“吃”即可自然容纳这种叙事含义。
- source_word: ἐκ τῶν ἄρτων τῶν ἐθνῶν
  choice: 吃外族人的食物
  rationale: ἄρτοι字面为“饼”，但这里是食物供应的惯用表达；译作“食物”符合现代汉语。ἐθνῶν在犹太流亡语境中指以色列以外的人，因此译作“外族人”。
theological_decisions:
- issue: ἐθνῶν的族群与宗教含义
  choice: 外族人
  alternative: 列国的人／外邦人
  rationale: 本节对比以色列人与非以色列人，并暗含饮食方面的身份张力。“外族人”在现代普通话中清楚自然，又不额外加入宗派化色彩。
- issue: 是否在正文中明说食物“不洁净”
  choice: 不添加“不洁净”
  alternative: 外族人的不洁净食物
  rationale: 本句希腊文没有“不洁净”一词。即使上下文可能涉及饮食洁净问题，也不应把这一推论直接写入正文。
- issue: ἄρτων是直译为“饼”还是按惯用义译为“食物”
  choice: 正文译作“食物”，脚注保留字面信息
  alternative: 外族人的饼
  rationale: “饼”虽贴近字面，却容易使现代读者误以为只涉及一种食品；“食物”更准确传达该惯用语的语境含义，脚注则保留原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“被掳”保留流亡的强制性质；“弟兄”和“同族的人”分别对应原文两个有重叠却不完全相同的亲族称谓。
