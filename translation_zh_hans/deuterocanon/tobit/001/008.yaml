base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/008.yaml
  text: And the third I would give to those to whom it was due[a], just as Deborah, my father's mother, commanded[c][b], because I was left an orphan by my father.
translation:
  language: zh_hans
  text: 我一向把第三份[a]给应得的人，正如我父亲的母亲底波拉所吩咐我的[b]；因为我失去了父亲，成了孤儿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“第三”，所指的“份”或“部分”由上下文补足。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我父亲的母亲”，即我的祖母。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“我被父亲留下，成了孤儿”。此处表达他失去了父亲；原文没有在本句直接说明父亲如何离去。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν τρίτην
  choice: 第三份
  rationale: 原文用带冠词的阴性序数词作名词，所指的“份”由上下文补足。译作“第三份”既保留省略，又符合现代汉语表达。
- source_word: ἐδίδουν
  choice: 我总是给
  rationale: 未完成时在这里表示过去惯常、反复的行动；“总是给”自然地传达这一语气。
- source_word: οἷς καθήκει
  choice: 给那些理当得到的人
  rationale: καθήκει可指合宜、本分或应得；此处不进一步限定受惠者身份，以保留原文概括性。
- source_word: καθὼς ἐνετείλατο
  choice: 照……所吩咐的
  rationale: ἐνετείλατο表示郑重嘱咐或命令；“吩咐”在亲属关系语境中既有分量，也较自然。
- source_word: Δεββώρα
  choice: 底波拉
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: ἡ μήτηρ τοῦ πατρός μου
  choice: 我父亲的母亲
  rationale: 依照希腊文的具体亲属表达，不在正文中直接简化为“祖母”。
- source_word: διότι
  choice: 因为
  rationale: 直接表达底波拉承担教导角色的原因。
- source_word: ὀρφανὸς κατελείφθην ὑπὸ τοῦ πατρός μου
  choice: 父亲去世后，我成了孤儿
  rationale: 希腊文直译近于“我被父亲撇下，成了孤儿”，语境所指是丧父；正文用现代汉语清楚表达其实际含义，并以脚注保留原文字面形式。
