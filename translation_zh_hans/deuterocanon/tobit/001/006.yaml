  source_fidelity: 译文准确传达了多比独自、经常前往耶路撒冷守节，并携带初熟之物、出产的十分之一及首次剪取之物的基本意思。惟“照着为全以色列写下的永远条例”在汉语中修饰关系不够清晰，容易读成“为全以色列写下”直接修饰动作或使“条例”与“写下”的关系含混；宜明确这是为全以色列所写、规定持续有效的条例。
  naturalness: “只有我常常到耶路撒冷去过节”自然，但“但只有我”略显口语性和连接词堆叠。用“可是，唯有我常常前往耶路撒冷守节”更庄重顺畅，也更适合叙事和礼仪语境。“带着”比“带上”更贴合分词所表达的伴随情状。
