base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/006.yaml
  text: But I alone would often go to Jerusalem for the feasts[a], as it is written for all Israel in an everlasting ordinance[b], bringing the firstfruits and the tithes of the produce and the first shearings.
translation:
  language: zh_hans
  text: 可是，唯有我常常前往耶路撒冷守节[a]，正如为全以色列所写的永远条例所规定的那样，带着初熟之物、出产的十分之一和初剪的羊毛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“在耶路撒冷守节”；希腊文虽用“在耶路撒冷”，却与表示行程的动词连用，本文按语境译作“前往耶路撒冷守节”。
    reason: 说明原文介词与移动动词的搭配，并交代译文以目的地表达其语义。
  - marker: b
    text: “初剪的羊毛”所对应的希腊词十分罕见，可能指牲畜首次剪下并献上的部分；也有人较笼统地理解为畜牧出产中的初献之物。
    reason: 保留罕见词 προκουρίας 的词义不确定性，避免将其含义过度限定。
lexical_decisions:
- source_word: μόνος
  choice: 只有我
  rationale: 突出多比在众人之中独自持守这些礼仪义务，与上下文中的对比相符；现代汉语自然且保留强调。
- source_word: ἐπορευόμην πλεονάκις
  choice: 常常……去
  rationale: 未完成时配合 πλεονάκις 表示过去反复、惯常的行动。
- source_word: ἐν Ἱεροσολύμοις
  choice: 到耶路撒冷
  rationale: 原文介词形式直译可作“在耶路撒冷”，但与表示行程的动词连用时，语境所表达的是目的地；汉语用“到”更自然。
- source_word: ταῖς ἑορταῖς
  choice: 去过节
  rationale: 指以色列的节期；结合前面的行程，以“去过节”表达前往耶路撒冷守节的意思，不额外限定具体节期。
- source_word: καθὼς γέγραπται
  choice: 照着……写下的
  rationale: 保留援引成文律例的公式性表达，并以现代汉语顺畅呈现。
- source_word: ἐν προστάγματι αἰωνίῳ
  choice: 永远条例
  rationale: πρόσταγμα 是具有约束力的命令或条例；αἰώνιος 在律法语境中强调持续有效，以“永远条例”保留其庄重的圣经用语色彩。
- source_word: ἀπαρχάς
  choice: 初熟之物
  rationale: 这是献给上帝的初产、初熟部分，采用汉语圣经传统中清楚而准确的礼仪术语。
- source_word: δεκάτας τῶν γενημάτων
  choice: 出产的……十分之一
  rationale: γενήματα 泛指出产，δεκάται 指献上的十分之一；此译法避免把范围缩窄为某一种庄稼。
- source_word: προκουρίας
  choice: 初剪的羊毛
  rationale: 此词罕见，在祭献清单中很可能指牲畜首次剪下之物；译作“初剪的羊毛”在汉语中具体易懂，同时以脚注保留词义的不确定性。
- source_word: ἔχων
  choice: 带上
  rationale: 分词说明多比前往时随身带着这些奉献之物；“带上”符合汉语叙事习惯。
theological_decisions:
- issue: 多比遵守节期与奉献条例的性质
  choice: 译文将其呈现为亲自前往耶路撒冷守节，并携带条例规定的奉献之物。
  alternative: 仅笼统表达多比的虔诚，而不突出具体律法实践。
  rationale: 经文明言这是为全以色列写下的条例，又逐项列举所带之物，重点是具体遵行，而非泛泛的敬虔。
- issue: αἰώνιος 在律例公式中的含义
  choice: 永远
  alternative: 永久；长久有效
  rationale: “永远”保留原文在盟约和律法语境中的强度与庄重感，同时不在译文中进一步界定其神学范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“只有我”保留原文的强烈对比，“常常……去”体现过去惯常行动；礼仪术语使用“初熟之物”“十分之一”，既准确又便于普通读者理解。脚注标记均置于所解释的词语之后。
