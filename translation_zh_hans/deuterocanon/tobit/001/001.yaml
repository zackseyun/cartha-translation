base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/001.yaml
  text: The book of the words of Tobit son of Tobiel[a], son of Ananiel, son of Aduel, son of Gabael, from the seed of Asiel, from the tribe of Naphtali[b],
translation:
  language: zh_hans
  text: 托比特言语之书[a]：托比特，托比业之子，亚拿业之孙，亚杜业之曾孙，迦巴业[b]之玄孙；出自亚薛的家系，属拿弗他利支派。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“托比特言语之书”，是正式的标题式表达；也可译作“托比特的记录”或“托比特的叙事”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文此处的人名形式较难确定；有些文本见证和后来的传本所反映的形式接近“迦比业”或“巴迦巴业”。
    reason: alternative_reading
lexical_decisions:
- source_word: ΒΙΒΛΟΣ λόγων
  choice: 言语录
  rationale: 这是带有闪语色彩的标题式表达，直义近于“言语之书”。译作“言语录”既保留 λόγων 的“言语”含义，也较符合现代汉语书面表达；脚注说明其他可能译法。
- source_word: Τωβείτ
  choice: 托比特
  rationale: 按希腊文音译，并采用现代中文中较易辨认的《多俾亚传》人物名称形式。
- source_word: τοῦ Τωβιὴλ / τοῦ Ἀνανιὴλ / τοῦ Ἀδουὴλ
  choice: 托比业的儿子／亚拿业的儿子／亚杜业的儿子
  rationale: 希腊文连续属格在家谱中表示父子关系；中文将隐含关系明确译出，以免谱系含混。
- source_word: τοῦ ΒαΓαβαήλ
  choice: 迦巴业
  rationale: 底本此名的希腊文形式较难确定；正文采用可据相关见证规范化的“迦巴业”，脚注保留异名信息。
- source_word: ἐκ τοῦ σπέρματος Ἀσιήλ
  choice: 出自亚薛的后裔
  rationale: σπέρμα 字面为“种子”，在谱系语境指血统或后裔。现代汉语用“后裔”自然清楚，同时保存家系意义。
- source_word: ἐκ τῆς φυλῆς Νεφθαλείμ
  choice: 属于拿弗他利支派
  rationale: φυλή 指以色列的支派；“拿弗他利”采用现代中文圣经中通行的支派名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事书面语。家谱以重复的“是……的儿子”展开，清楚呈现希腊文连续属格；保留标题表达的古雅色彩，但避免生硬直译。所有脚注标记均置于相关正文位置。
