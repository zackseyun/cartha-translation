revisions:
- from: 这是托比特的言语录。他是托比业的儿子，托比业是亚拿业的儿子，亚拿业是亚杜业的儿子，亚杜业是迦巴业[a]的儿子；他出自亚薛的后裔，属于拿弗他利支派[b]。
  to: 托比特言语之书[a]：托比特，托比业之子，亚拿业之孙，亚杜业之曾孙，迦巴业[b]之玄孙；出自亚薛的家系，属拿弗他利支派。
  rationale: 修正脚注锚点错置这一结构性问题，并以更符合现代汉语书面语的方式呈现标题和家谱。家谱中的“子、孙、曾孙、玄孙”准确表达连续父系关系，未改变原文的谱系信息。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:17:09Z'
