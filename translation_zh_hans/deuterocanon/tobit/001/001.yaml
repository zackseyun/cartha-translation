  source_fidelity: 正文准确保留希腊文标题式开头、托比特的父系谱系，以及“出自亚薛的家系、属拿弗他利支派”的双重来源说明。将谱系改为中文常用的同位语式排列，不增添原文没有的叙述信息。
  naturalness: “言语录”在现代汉语中不够自然，且容易被理解为零散语录；“托比特言语之书”较贴近原文的正式标题格式。以“某某之子”连续排列家谱，比反复使用完整判断句更凝练、庄重，也更适合经文书面语体。
  terminology: 保留“托比特、托比业、亚拿业、亚杜业、迦巴业、亚薛、拿弗他利”等既定音译。迦巴业的正文形式可接受，但其异文说明必须锚定该姓名；标题表达的词义说明必须锚定标题，而不是“拿弗他利支派”。
