  text: And the Most High gave me favor and good standing before Enemessar[b][a], and I was his buyer.
translation:
  language: zh_hans
  text: 至高者使我在埃内梅撒面前蒙恩，并有美好的仪表[a]；我作了他的采购员[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美好的仪表”或译“好形象”“体面”。希腊词μορφή可指外在形态或容貌；在这里是否也含有宫廷中的良好形象或地位，不能完全确定。
    reason: lexical_alternative
  - marker: b
    text: “采购员”直译为“购买者”，这里很可能指负责为君王采办物品的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: 至高者
  rationale: 保留这个指称上帝的称号及其头衔意味，不将其泛化为“上帝”。
- source_word: χάριν
  choice: 蒙恩
  rationale: 此处指在君王面前受到优待和悦纳；“蒙恩”自然地表达这种关系性的恩宠，同时避免过度抽象化。
- source_word: μορφήν
  choice: 美好的仪表
  rationale: μορφή的基本语义涉及外在形态或容貌；在宫廷语境中，“美好的仪表”既保留外观义，也不武断地改译为纯粹的地位或声望。其语境中的确切侧重点以脚注说明。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 直接表达身处君王面前以及受其看待的关系，符合现代汉语圣经文体。
- source_word: Ἐνεμεσσάρου
  choice: 埃内梅撒
  rationale: 按本希腊见证的专名形式音译，不与较熟悉的历史姓名“撒缦以色”强行协调。
- source_word: ἀγοραστής
  choice: 采购员
  rationale: 该词字面指购买者；在宫廷语境中很可能是负责采办的职务。“采购员”比单说“买主”更能传达其职务性质，又不扩展为证据不足的高级官衔。
theological_decisions:
- issue: 神圣称号ὁ ὕψιστος的译法
  choice: 至高者
  alternative: 上帝／最高者
  rationale: “至高者”保留原文作为上帝称号的功能和庄重感，不把这一特定称号消解为泛称。
- issue: μορφήν在宫廷语境中的含义
  choice: 美好的仪表
  alternative: 好形象／体面／良好地位
  rationale: 原词首先可指外形、样貌或仪表，但此处也可能延伸到在宫廷中的形象或体面。正文保留较直接的外观义，脚注呈现语境上的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“蒙恩”符合圣经汉语习惯；“采购员”清楚表达宫廷采办职能。专名“埃内梅撒”依希腊文本音译。所有脚注标记均置于相应词语之后。
