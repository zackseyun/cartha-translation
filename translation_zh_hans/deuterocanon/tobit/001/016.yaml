lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις
  choice: 在……的日子里
  rationale: 保留希腊文常见的时间表达，同时在现代汉语中清楚自然；不擅自将其解释为“在位期间”。
- source_word: Ἐνεμεσσάρου
  choice: 埃内梅撒
  rationale: 按希腊文属格形式还原人名词干并音译，不翻译其含义。
- source_word: ἐλεημοσύνας πολλὰς
  choice: 常常……施行怜悯
  rationale: ἐλεημοσύνας可指怜悯的具体行动，尤其是周济穷人；用“施行怜悯”保留较宽泛的意义。“常常”自然表达复数πολλὰς与未完成时ἐποίουν所呈现的反复、多次行动。
- source_word: ἐποίουν
  choice: 我常常……施行
  rationale: 未完成时表示过去持续或反复发生的行为；汉语以“常常”呈现这一体貌，并与“施行怜悯”自然搭配。
- source_word: τοῖς ἀδελφοῖς μου
  choice: 向我的弟兄们
  rationale: 保留ἀδελφοῖς的直译及其可能兼具亲属和同族群体的含义；与施惠行为搭配时，间接受词用“向”自然。
theological_decisions:
- issue: τοῖς ἀδελφοῖς μου所指的范围
  choice: 我的弟兄们
  alternative: 我的亲族／我的以色列同胞
  rationale: 希腊文直称“我的弟兄们”，可能不只指亲生兄弟，也可泛指亲族或以色列同胞。正文保留原文的亲属称谓，不把范围单一化，脚注说明其广义可能。
- issue: ἐλεημοσύνας的行为范围
  choice: 施行怜悯
  alternative: 施舍／行善举
  rationale: 该词在此很可能包含向贫困者施舍，但语义也可涵盖更广的慈惠行为。正文不将其限缩为金钱施舍，脚注保留具体解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“埃内梅撒”按希腊文音译；“施行怜悯”保留经文语体，但以“常常”清楚表达过去反复行善的意味。脚注标记依其说明顺序排列为[a][b]。
