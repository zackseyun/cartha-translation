  verdict: revise
  source_fidelity: 草稿总体把握了叙述、拿弗他利支派的背离、耶路撒冷的拣选及献祭目的。但“至高者居住的圣殿”将“ναὸς τῆς κατασκηνώσεως τοῦ ὑψίστου”的属格关系处理为“至高者住在圣殿中”，不如“至高者居所的圣殿”贴近原文。另“已经”赋予完成时色彩，希腊文两个不定过去时宜以普通被动叙述呈现。
  naturalness: 原译大致通顺，但“这殿宇是从……蒙拣选的地方”混合了建筑物与地点两个表述，略显生硬。修订后通过破折号插入关系从句，维持庄重、现代的书面普通话，也更清晰。
  terminology: “背离”“蒙拣选”“献祭”“至高者”“分别为圣”均适切。保留“殿宇”对应οἶκος、以“圣殿”对应ναός；将κατασκήνωσις译为“居所”，不将其武断限定为“会幕”。脚注c恢复为英语审校记录中关于昆兰材料与较长希腊传统的交叉参考，避免把该脚注的性质改成未经原审校支持的词汇说明。
