  rationale: 修订保持希腊文本的句法层次和两个“殿”类词的区别：前者为“耶路撒冷的殿宇”（οἶκος），后者为“至高者居所的圣殿”（ναὸς τῆς κατασκηνώσεως τοῦ ὑψίστου）。对末尾残缺的εἰς πάσας仍以“为世世代代”作有注释的补足，未将其当作无争议的完整原文。
