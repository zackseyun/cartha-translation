revisions:
- from: 我还年轻、住在自己的家乡[a]以色列地时，我父亲拿弗他利的整个支派都背离了耶路撒冷的殿宇；这殿宇是从以色列所有支派中蒙拣选的地方，为要让各支派都在那里献祭。至高者居住的圣殿[c]已经分别为圣，并为世世代代建造。[b]
