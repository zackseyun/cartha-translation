base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/004.yaml
  text: And when I was in my own country[a], in the land of Israel, while I was still young, the whole tribe of my father Naphtali fell away from the house of Jerusalem, which had been chosen from all the tribes of Israel for all the tribes to sacrifice there; and the temple, the dwelling place of the Most High[c][b], was consecrated and built for all generations.
translation:
  language: zh_hans
  text: 我还年轻、住在自己的家乡[a]以色列地时，我父亲拿弗他利的整个支派都背离了耶路撒冷的殿宇；这殿宇是从以色列所有支派中蒙拣选出来的，供所有支派在那里献祭。至高者居所的圣殿[c]被分别为圣，又为世世代代而建造。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在本节先说“我的家乡”，随后以“以色列地”进一步说明。
    reason: lexical_alternative
  - marker: b
    text: 现存希腊文本的末语直译为“为所有……”，句子并不完整。本译文依上下文及较长的《多俾亚传》文本传统补作“为世世代代”。
    reason: textual_variant
  - marker: c
    text: 昆兰《多俾亚传》残片在本书中较常与较长的希腊文本传统相合；但本节仍依据斯威特版希腊文本翻译。
    reason: cross_reference
lexical_decisions:
- source_word: χώρα
  choice: 家乡
  rationale: 在“我的家乡”这一所有格结构中，χώρα指本土或故乡；下文“以色列地”进一步说明其所在。
- source_word: νεωτέρου μου ὄντος
  choice: 我还年轻时
  rationale: 自然表达属格独立结构的时间意义，并保留“年轻”的状态。
- source_word: ἀπέστη
  choice: 背离了
  rationale: 既保留离开、脱离的基本意义，也传达此处离弃耶路撒冷敬拜的宗教严重性，而不采用过强的后世术语。
- source_word: οἶκος Ἱεροσολύμων
  choice: 耶路撒冷的殿宇
  rationale: 原文直译近于“耶路撒冷的房宇”；译作“殿宇”可指耶路撒冷圣所，同时尽量与下文更明确的ναός“圣殿”保持措辞区别。
- source_word: ἐκλεγείσης
  choice: 蒙拣选
  rationale: 保留神圣被动及作为敬拜地点被选定的含义。
- source_word: εἰς τὸ θυσιάζειν
  choice: 为要……在那里献祭
  rationale: 明确表达目的，并把语境隐含的地点关系自然地呈现出来。
- source_word: ναός
  choice: 圣殿
  rationale: 在耶路撒冷敬拜语境中是清楚、自然的对应词。
- source_word: κατασκήνωσις
  choice: 居住
  rationale: 短语按“至高者居住的圣殿”处理，保留神居所的观念，避免误使读者以为此处必指会幕。
- source_word: ὑψίστου
  choice: 至高者
  rationale: 这是该神圣称号在现代中文圣经语体中的自然译法。
- source_word: ἡγιάσθη
  choice: 已经分别为圣
  rationale: 表达被划归为圣、奉献作神圣用途的被动意义。
- source_word: ᾠκοδομήθη
  choice: 建造
  rationale: 保留动词直接的建筑含义。
- source_word: εἰς πάσας
  choice: 为世世代代
  rationale: 传本希腊文在此以阴性复数“为所有……”突兀结束；依据句意及较长文本传统补出世代概念，并以脚注明示。
theological_decisions:
- issue: 拿弗他利支派离开耶路撒冷敬拜的性质
  choice: 背离了
  alternative: 离开了／叛离了／背道了
  rationale: “背离”既呈现宗教及盟约层面的严重性，又不把后世更技术性的“背道”概念强加于经文。
- issue: 耶路撒冷作为献祭中心的蒙选地位
  choice: 这殿宇是从以色列所有支派中蒙拣选的地方，为要让各支派都在那里献祭
  alternative: 它从以色列众支派中被选出来，供众支派献祭
  rationale: 保留原文关于蒙拣选及全体支派献祭的主张，不进一步解释其历史或教派意义。
- issue: 至高者与圣殿的关系
  choice: 至高者居住的圣殿
  alternative: 至高者的居所之殿／至高者会幕的殿
  rationale: 保留神居所这一神学意象，同时避免将κατασκήνωσις过度限定为物质性的会幕。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“殿宇”与“圣殿”分别对应οἶκος与ναός，以保留原文措辞差异。所有补足及有歧义之处均在脚注中说明；未把间接的近代希伯来回译视为古代底本。
