  text: And all my possessions were plundered[a], and nothing was left to me except Anna my wife and Tobit my son.
translation:
  language: zh_hans
  text: 我的一切财物都被掠夺了；除了我的妻子安娜和我的儿子托比特以外，没有给我留下任何东西。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节是说，托比特的财物被夺走以后，妻子和儿子仍留给他；并不是把妻子和儿子当作他的财物。
    reason: 澄清原文“除了……以外”的例外结构在中文中可能引起的误解。
lexical_decisions:
- source_word: διηρπάγη
  choice: 被抢走了
  rationale: 该被动动词表示财物遭他人强行夺取；“被抢走了”自然清楚，也保留了掠夺的意味。
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: 我所有的财物
  rationale: πάντα 表示全数，τὰ ὑπάρχοντα 指一个人所拥有的物质财产；“所有的财物”准确且符合现代汉语。
- source_word: οὐ κατελείφθη μοι οὐδέν
  choice: 我一无所有
  rationale: 以自然的汉语表达原文“没有任何东西给我留下”的强调性否定，并与前半句的财物损失相呼应。
- source_word: πλὴν
  choice: 除了……以外
  rationale: 清楚表达例外关系，同时不将妻子和儿子归入前述“财物”。
- source_word: Ἄννας
  choice: 安娜
  rationale: 按希腊文人名 Ἄννα 音译，采用现代中文通行形式。
- source_word: Τωβεὶτ
  choice: 托比特
  rationale: 按本处希腊文 Τωβεὶτ 音译，并与书名所用人名保持一致。
theological_decisions:
- issue: 妻子和儿子是否被语法上视为财物
  choice: 正文保留“除了……以外”的原文结构，并用脚注说明其语境所指
  alternative: 改写为“财物全被抢走，身边只剩妻子和儿子”
  rationale: 原文确实以 πλὴν 引出妻子和儿子作为劫掠后仍与叙述者同在的人，但语义并不要求把他们视为财产；保留结构并加注可避免误解，也不替原文消除其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“抢走”比“掳掠”更通俗，又保留强行夺取之意；分号呈现原文两个并列分句。脚注标记置于正文相关句末。
