base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/022.yaml
  text: And Ahiacharus interceded for me[a], and I came to Nineveh. Now Ahiacharus was the cupbearer, keeper of the signet ring, administrator, and accountant, and Sacherdonos appointed him second in rank. He was my cousin.
translation:
  language: zh_hans
  text: 亚希亚卡为我求情，我便来到尼尼微。亚希亚卡是司酒官，又掌管印戒，并任总管和会计；撒刻尔多诺斯任命他居第二位。[a]他是我的堂表亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“任命他为第二位的儿子”；这个表达既像习语，文本形式也较生硬。通常理解为亚希亚卡的地位仅次于王，或居第二位。
    reason: textual_variant
lexical_decisions:
- source_word: ἠξίωσεν ... περὶ ἐμοῦ
  choice: 为我求情
  rationale: 在叙事语境中，这一表达指亚希亚卡为托比特出面请求或斡旋；“求情”自然简洁，同时不过度限定具体程序。
- source_word: ἦλθον εἰς Νινευήν
  choice: 我就来到尼尼微
  rationale: 依照希腊文直译为“来到”，不擅自补入“返回”；“就”体现前后事件的承接。
- source_word: οἰνοχόος
  choice: 司酒官
  rationale: 这是宫廷中负责为君王奉酒的官职；“司酒官”比现代日常职业称谓更符合古代宫廷语境。
- source_word: ἐπὶ τοῦ δακτυλίου
  choice: 掌管印戒
  rationale: 原文直译为“在印戒之上”，在王室行政语境中指掌管具有授权作用的印戒。
- source_word: διοικητής
  choice: 总管
  rationale: 该词指管理、统筹事务的人；“总管”符合宫廷官职语境，又不狭义化为地方长官。
- source_word: ἐκλογιστής
  choice: 会计
  rationale: 该词与核算、账目有关；“会计”清楚表达其负责财务计算或账目的职能。
- source_word: κατέστησεν αὐτὸν
  choice: 立他为
  rationale: καθίστημι用于授予职位时有任命、设立之意；“立他为”庄重且符合叙事文体。
- source_word: υἱὸς ἐκ δευτέρας
  choice: 位居第二的人
  rationale: 现存希腊文表达生硬，字面近于“第二位的儿子”；结合宫廷官职语境，正文采用通常所理解的等级含义，并以脚注保留字面困难。
- source_word: ἐξάδελφός μου
  choice: 我的表兄弟
  rationale: ἐξάδελφος明确指堂表亲一类的同辈亲属；中文无法仅凭该词判断父系或母系，故采用较通俗的“表兄弟”，但此表达仍有亲属类别上的局限。
