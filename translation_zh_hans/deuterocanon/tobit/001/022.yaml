translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。宫廷职衔分别译作“司酒官”“掌管印戒”“总管”和“会计”，既保留职能差异，也避免过度现代化。“位居第二的人”按语境传达可能含义，并用脚注保存原文的含混与文本困难。
