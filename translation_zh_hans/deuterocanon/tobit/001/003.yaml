base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/003.yaml
  text: I[a], Tobit, walked in the ways of truth and righteousness all the days of my life[b], and I did many acts of mercy for my brothers and for my people who went with me into the land of the Assyrians, to Nineveh.
translation:
  language: zh_hans
  text: 我托比特一生都行在真理和公义的道路上；我又向那些同我一同前往亚述人的国土、到尼尼微去的弟兄和同胞，行了许多怜悯的事[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“多多施舍”或“多行周济”。希腊文可特指赒济穷人的施舍，也可泛指怜悯善行。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”在这里很可能广指托比特的以色列同胞或亲族，并非只指亲生兄弟。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοῖς ἀληθείας ἐπορευόμην
  choice: 行在真实……的道路上
  rationale: 保留希腊文以“道路”表达生活方式的伦理隐喻；“真实”既可指诚实，也保留“真理”的意味，不将词义过早收窄。
- source_word: δικαιοσύνῃ
  choice: 正义
  rationale: 此处指托比特一生正直、合乎义的行为。“正义”在现代汉语中自然庄重，并保留δικαιοσύνη可涵盖公义与正直的幅度。
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς μου
  choice: 一生都
  rationale: 以自然简洁的现代汉语表达“我生命中的所有日子”，意义完整。
- source_word: ἐλεημοσύνας πολλὰς ἐποίησα
  choice: 多多周济
  rationale: ἐλεημοσύνη可特指施舍，也可泛指怜悯善行；“周济”切合向族人提供实际帮助的语境，同时以脚注保留较广的可能。
- source_word: τοῖς ἀδελφοῖς μου
  choice: 我的弟兄
  rationale: 保留希腊文阳性复数的直观表达；语境很可能广指同族或亲族，故加脚注说明。
- source_word: τῷ ἔθνει
  choice: 我的同胞
  rationale: 比直译“民族”更符合第一人称叙事，也自然表达共同族属。
- source_word: τοῖς προπορευθεῖσιν μετʼ ἐμοῦ
  choice: 那些同我前往……的人
  rationale: 希腊文分词含“走在前面、先行”的形式意味，但与μετʼ ἐμοῦ连用在此主要指一同迁往亚述的人；正文采用自然表达，不擅自加入“被掳”。
- source_word: εἰς χώραν Ἀσσυρίων εἰς Νινευή
  choice: 前往亚述人的国土、到尼尼微去
  rationale: 保留两个方向短语，并反映“亚述人的国土”这一属格结构。
theological_decisions:
- issue: δικαιοσύνη在伦理性自述中的译法
  choice: 正义
  alternative: 公义；正直
  rationale: “正义”可同时承载行为正当与道德端正的含义，且不把本句限定为司法语境；“公义”较具宗教文体色彩，“正直”则可能削弱原词的广度。
- issue: ἐλεημοσύνη是特指施舍还是泛指怜悯善行
  choice: 正文译“周济”，脚注保留“施舍或怜悯善行”
  alternative: 施舍；行许多怜悯的事
  rationale: 语境涉及对弟兄和同胞的实际扶助。“周济”自然且具体，但原词范围有歧义，故不在正文中绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“道路”这一圣经伦理隐喻；用“同胞”自然表达族群关系。正文不补入希腊文未明说的“被掳”，并借脚注保存ἐλεημοσύνη与ἀδελφοί的语义幅度。
