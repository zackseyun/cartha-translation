  naturalness: “行在……道路上”适合庄重的圣经叙事语体。“真理和公义的道路”比“真实和正义的道路”更合乎现代汉语的固定宗教伦理表达；将“那些同我前往……”前置，可避免其似乎只修饰“同胞”的歧义。
