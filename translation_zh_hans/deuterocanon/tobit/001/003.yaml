  rationale: 修订以“真理和公义”更贴切地传达ἀλήθεια与δικαιοσύνη在本句中的庄重伦理语义；以“行了许多怜悯的事”保留ἐλεημοσύνη可指施舍或更广义怜悯行为的开放性，并通过脚注说明。重组末尾定语，使其自然地关联“弟兄和同胞”，同时不擅自补入“被掳”等原文未明说的信息。
