translation:
  language: zh_hans
  text: 因为我全心[a]记念上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以我的全副心灵”。
    reason: 保留ἐν ὅλῃ τῇ ψυχῇ μου较形式对应的表达及ψυχή的人论色彩。
lexical_decisions:
- source_word: καθότι
  choice: 因为
  rationale: 引出前文所述结果或恩惠的原因，保留明确的因果关系。
- source_word: ἐμεμνήμην
  choice: 记念
  rationale: 既表达把上帝牢记在心、持续以他为念，也符合庄重而自然的现代圣经汉语；不额外强化希腊语完成时所含的持续结果意味。
- source_word: τοῦ θεοῦ
  choice: 上帝
  rationale: 该属格是动词的宾语；汉语直接置于“记念”之后，无须形式对应属格。
- source_word: ἐν ὅλῃ τῇ ψυχῇ μου
  choice: 全心
  rationale: 自然表达毫无保留、整个内在生命都投入其中的意思；脚注保留ψυχή较直接的“心灵”表达，避免正文生硬。
theological_decisions:
- issue: ψυχή的人论含义
  choice: 正文译“全心”，脚注注明直译“用我的整个心灵”
  alternative: 用我的整个心灵
  rationale: 此处是表达全然委身的惯用语。“全心”符合现代汉语，又不把ψυχή限定为某种技术性的人体构成理论；脚注则保留原词的人论色彩。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。“记念”比日常的“想起”更能表达持续以神为念；句式简洁，并与原文因果从句的性质一致。
