  text: I used to go to Media[a], and I deposited ten talents of silver with Gabael, the brother of Gabri[c][b], in Rages of Media.
translation:
  language: zh_hans
  text: 我常去米底亚[a]，并曾在米底亚的拉革斯，把十他连得[c]银子交给加布里的兄弟加贝尔保管[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我去了米底亚。”希腊语未完成过去时既可叙述过去进行中的行动，也可表示反复或惯常的行动。
    reason: 保留动词体貌可能具有的歧义。
  - marker: b
    text: “交给……保管”也可译作“存放在……那里”。原文动词指把东西交托给别人，此处用于银子。
    reason: 说明该词在此处的托付和财物保管含义。
  - marker: c
    text: “他连得”是古代的大重量单位；这里指按重量计量的银子。
    reason: 帮助现代读者理解古代度量衡，而不作有争议的现代币值换算。
lexical_decisions:
- source_word: ἐπορευόμην
  choice: 我常去
  rationale: 未完成过去时可表达过去反复或惯常的行动；“我常去”自然保留这一体貌，同时不把它限定为一次旅程。
- source_word: παρεθέμην
  choice: 交给……保管
  rationale: 该动词表示把某物交托在别人手中；此处宾语是银子，译作“交给……保管”既体现托付关系，也不强行套用现代银行制度中的“存款”概念。
- source_word: ἀργυρίου
  choice: 银子
  rationale: 原文明确指银；“银子”符合古代以贵金属计值的语境，也比泛译为“钱”更贴近原文。
- source_word: τάλαντα δέκα
  choice: 十他连得
  rationale: τάλαντον是古代的大重量单位，也用于衡量贵金属价值；保留传统音译，避免换算成不确定的现代币值。
- source_word: Γαβηλῷ
  choice: 加贝尔
  rationale: 按希腊语人名Γαβηλ作适合现代普通话的音译。
- source_word: τῷ ἀδελφῷ Γαβρίᾳ
  choice: 加布里的兄弟
  rationale: 保留ἀδελφός通常的亲属义“兄弟”，属格Γαβρίᾳ说明加贝尔是谁的兄弟。
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: 在米底亚的拉革斯
  rationale: 按希腊语结构标明拉革斯位于米底亚；地名采用清楚、可读的中文音译。
