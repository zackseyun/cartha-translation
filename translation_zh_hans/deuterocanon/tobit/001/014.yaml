translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我常去”表达希腊语未完成过去时的惯常意味；“交给……保管”避免把古代私人托付制度现代化为银行存款。人名、地名使用简体中文环境中易读的音译，句序略作调整，使地点、物品与受托人的关系清楚。
