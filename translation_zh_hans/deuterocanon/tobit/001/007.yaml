revisions:
- from: 我总把这些交给亚伦子孙中的祭司，作为从出产中献在祭坛上的礼物；又把十分之一交给在耶路撒冷供职的利未子孙。我把第二份十分之一[a]卖掉[b]，每年都前往耶路撒冷，在那里花用所得的钱。
  to: 我常把这些交给亚伦子孙中的祭司，供祭坛使用；我又常把出产的十分之一交给在耶路撒冷供职的利未子孙，并把第二份十分之一[a]卖掉[b]，前往耶路撒冷，每年在那里花用所得的钱。
  rationale: 修订将“出产的”直接连接到“十分之一”，更清楚地反映希腊文在祭坛用途之后转入十分之一的句法与列举结构，同时不强行消除原文的紧凑性。其余调整限于使惯常动作和礼仪术语在现代汉语中更自然、明确。
