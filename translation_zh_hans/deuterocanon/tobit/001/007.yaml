base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/007.yaml
  text: And I would give them to the priests[a], the sons of Aaron, for the altar, from the produce; I would give the tenth to the sons of Levi who minister in Jerusalem[b], and I would sell the second tenth and go and spend it in Jerusalem each year.
translation:
  language: zh_hans
  text: 我常把这些交给亚伦子孙中的祭司，供祭坛使用；我又常把出产的十分之一交给在耶路撒冷供职的利未子孙，并把第二份十分之一[a]卖掉[b]，前往耶路撒冷，每年在那里花用所得的钱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十分之一”和“第二份十分之一”也可译作“什一奉献”和“第二份什一奉献”。希腊文直译为“第十份”和“第二个第十份”。
    reason: 说明礼仪术语及其较字面的希腊文表达。
  - marker: b
    text: 这里的“卖掉”也可理解为“折成钱”，即在前往耶路撒冷之前将第二份十分之一变为可携带、可花用的钱款。
    reason: 保留该动词在此语境中可指变卖并换成钱款的理解。
lexical_decisions:
- source_word: ἐδίδουν
  choice: 我总把……交给
  rationale: 未完成时在上下文中表示过去反复进行的惯常行为；“总”自然地传达这一含义。
- source_word: τοῖς ἱερεῦσιν τοῖς υἱοῖς Ἀαρών
  choice: 亚伦子孙中的祭司
  rationale: 保留祭司身份及亚伦谱系，同时用现代汉语自然表达希腊文的同位关系。
- source_word: πρὸς τὸ θυσιαστήριον τῶν γενημάτων
  choice: 作为从出产中献在祭坛上的礼物
  rationale: 希腊文表达较为紧缩；此译既表明礼物来自农产，也保留其与祭坛用途的关系。
- source_word: τὴν δεκάτην
  choice: 十分之一
  rationale: 直接对应希腊文“第十份”，在汉语中也能让读者理解其数量含义，且不必在正文中先行解释制度。
- source_word: τοῖς υἱοῖς Λευεὶ τοῖς θεραπεύουσιν εἰς Ἱερουσαλήμ
  choice: 在耶路撒冷供职的利未子孙
  rationale: 保留“利未子孙”的明说形式；“供职”适合圣所礼仪服务的语境，又不过度限定具体职务。
- source_word: τὴν δευτέραν δεκάτην
  choice: 第二份十分之一
  rationale: 贴近希腊文的字面结构，并保留它与前一份十分之一有别这一信息。
- source_word: ἀπεπρατιζόμην
  choice: 卖掉
  rationale: 该动词表示售卖；下文前往耶路撒冷花用所得，与变卖后携带钱款的情形相符。
- source_word: ἐδαπάνων αὐτὰ
  choice: 在那里花用所得的钱
  rationale: 希腊文代词承接变卖后的价值或所得；汉语明说“所得的钱”可使动作关系清楚，同时不改变实质意义。
- source_word: καθʼ ἕκαστον ἐνιαυτόν
  choice: 每年
  rationale: 简洁、自然地表达逐年如此的惯常行为。
theological_decisions:
- issue: 多重十一奉献相关术语的表达
  choice: 正文采用“十分之一”和“第二份十分之一”。
  alternative: 译作“十一奉献”和“第二份十一奉献”。
  rationale: 希腊文直说“第十份”及“第二个第十份”。保留数量形式既忠于原文，也避免在正文中把相关律法制度解释得超出本节所说。
- issue: 第二份十分之一如何处理
  choice: 译作“卖掉”，并以“所得的钱”承接后文。
  alternative: 译作“兑换成钱”或“折成现款”。
  rationale: ἀπεπρατιζόμην本身可指售卖，而上下文表明所得随后在耶路撒冷花用；正文保留“卖”的直接含义，脚注说明其实际效果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我总把”“每年都”共同传达原文未完成时的惯常性；祭司、利未子孙、祭坛等礼仪词汇保持明确，但不加入宗派性解释。
