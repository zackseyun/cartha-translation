  yaml_path: translation/deuterocanon/tobit/001/017.yaml
  text: I gave my bread to the hungry and clothing to the naked[a], and if I saw any of my kin dead and thrown behind the wall of Nineveh, I buried him.
translation:
  language: zh_hans
  text: 我常把自己的饼分给饥饿的人，把衣服给赤身露体的人；若看见我的族人中有人死了，被扔在尼尼微城墙后面[a]，我就把他埋葬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“尼尼微城墙外”。希腊文直译为“尼尼微城墙后面”，在这里可能是指被抛到城墙外的尸体。
    reason: 说明空间短语ὀπίσω τοῦ τείχους的字面意义及语境中的可能解释。
lexical_decisions:
- source_word: τοὺς ἄρτους μου
  choice: 自己的饼
  rationale: ἄρτους虽为复数，汉语在施舍食物的语境中用集合性的“饼”更自然；“自己的”保留了原文的所有关系。
- source_word: ἐδίδουν
  choice: 分给／送给
  rationale: 未完成时在此表示惯常、反复的行为；汉语以叙述句配合后文“如果……就……”自然传达这一点。针对饼用“分给”、衣服用“送给”，符合现代汉语搭配。
- source_word: τοῖς πεινῶσιν
  choice: 饥饿的人
  rationale: 准确表达名词化分词，清楚而自然。
- source_word: ἱμάτια
  choice: 衣服
  rationale: 现代汉语常用且范围适当，比“衣裳”更中性，比“衣袍”更少限定。
- source_word: τοῖς γυμνοῖς
  choice: 赤身的人
  rationale: 保留γυμνός的直接力度，同时在救济语境中可自然理解为无衣蔽体的人，不擅自弱化为“衣不蔽体”或“缺少衣服”。
- source_word: ἐκ τοῦ γένους μου
  choice: 我的族人中
  rationale: γένος可指亲族或较广的族群。“族人”比“家人”范围更宽，又不必限定为整个民族；“中”对应ἐκ的范围表达。
- source_word: ἐθεώρουν
  choice: 看见
  rationale: 简明自然；与条件句共同表现反复发生的情形。
- source_word: τεθνηκότα
  choice: 死了
  rationale: 直接描述该人的死亡状态，不将其非人格化为“尸体”。
- source_word: ἐρριμμένον
  choice: 被扔
  rationale: 保留完成被动分词所含的遭人抛弃并留置之意，也传达行为的粗暴与侮辱。
- source_word: ὀπίσω τοῦ τείχους Νινευή
  choice: 尼尼微城墙后面
  rationale: 按ὀπίσω加属格直译为“后面”，保留空间表达的歧义，不在正文中径自确定为城外。
- source_word: ἔθαπτον αὐτόν
  choice: 我就把他埋葬
  rationale: 未完成时表示托比特惯常如此行；“如果……就……”在现代汉语中自然呈现这种反复习惯。“他”保留原文对死者的人格指称。
theological_decisions:
- issue: γένος μου所指的群体范围
  choice: 译作“我的族人中”
  alternative: 我的家人中／我的同胞中
  rationale: 原词可涵盖血亲、宗族或更广的共同族属。“族人”保留一定范围弹性，避免把对象缩窄为直系或近亲，也避免明确扩大为全体同胞。
- issue: 施舍与埋葬行为的时态性质
  choice: 以“如果……就……”表达惯常行为
  alternative: 全部按单次过去事件叙述
  rationale: 三个主要动词均为未完成时，语境更适合反复、惯常的善行；汉语条件结构能够清楚传达这一性质，而不额外赋予功德论或其他教义含义。
- issue: 城墙方位的解释
  choice: 正文保留“城墙后面”，脚注说明可能指城外
  alternative: 正文直接译作“尼尼微城墙外”
  rationale: ὀπίσω字面是“后面”，具体视角可能使其指城外。保留正文的空间歧义，避免把语境推断提升为确定含义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“把……分给／送给……”形成平行结构；“如果……就……”体现原文未完成时所表达的惯常行动。正文保留“城墙后面”的歧义，并以脚注交代“城墙外”的可能解释。
