base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/001.yaml
  text: And Tobit his father counted each day[a]; and when the days of the journey were completed and they were not coming back[b],
translation:
  language: zh_hans
  text: 他的父亲多比特逐日计算日子。行程所需的日子满了以后，他们却还没有回来[a][b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们却还没有来。”希腊语未完成时可表示：预计的行程时间过去以后，他们仍未抵达；按本段语境，这意味着他们没有如期回家。
    reason: lexical_alternative
  - marker: b
    text: 闪语平行传统一处较长的文本还提到父母计算昼夜，并描写他们的忧伤；正文依照作为主要依据的希腊语较短文本。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλογίζετο
  choice: 计算着
  rationale: 这里与“天天”及行程期限相连，指计算、估量过去的日子；用进行性的“计算着”也保留希腊语未完成时所表达的持续状态。
- source_word: ἑκάστης ἡμέρας
  choice: 天天
  rationale: 自然表达逐日、每天如此的分配意义，简洁而符合现代汉语叙事。
- source_word: ἐπληρώθησαν
  choice: 已经满了
  rationale: 用于日数时表示期限已满、时间已经过去；避免“应验”可能带来的神学色彩。
- source_word: αἱ ἡμέραι τῆς πορείας
  choice: 行程所需的日子
  rationale: 属格结构在语境中指这趟行程预计需要的时间；此译比字面的“行程的日子”更清楚自然。
- source_word: οὐκ ἤρχοντο
  choice: 他们却还没有回来
  rationale: 未完成时呈现预期持续落空：到了预计日期，他们仍未抵达。多比特是在家等候，因此“回来”自然表达朝向等候者的方向，但由脚注保留较形式对应的译法。
- source_word: Καὶ
  choice: 承接前文，不另译为连接词
  rationale: 汉语以连续叙述和句序即可自然表达希腊语简单连接词的承接作用，硬译“而且”或“于是”会增加原文没有的逻辑色彩。
- source_word: Τωβεὶτ ὁ πατὴρ αὐτοῦ
  choice: 他的父亲多比特
  rationale: 准确表达同位关系，并采用现代汉语最自然的称谓次序。
