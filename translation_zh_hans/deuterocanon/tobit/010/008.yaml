  text: Then Tobias said to Raguel[a], “Send me away, because my father and my mother no longer expect to see me.”
translation:
  language: zh_hans
  text: 于是，多比亚对拉古耳说：“请让我走吧，因为我父亲和母亲已经不再盼望见到我了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不再期待见到我。”希腊文动词既可表示盼望，也可表示期待。
    reason: 保留ἐλπίζουσιν在“盼望”与“期待”之间的词义幅度。
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: 于是……说
  rationale: δέ在这里是轻微的叙事连接词；“于是”自然承接前文，又不过分强调转折。
- source_word: Τωβείας
  choice: 多比亚
  rationale: 按希腊文人名Τωβείας音译，并采用现代中文圣经读者较易识别的形式。
- source_word: τῷ Ῥαγουὴλ
  choice: 对拉古耳
  rationale: 将与格间接受词按现代汉语习惯译出；Ῥαγουὴλ采用音译。
- source_word: Ἐξαπόστειλόν με
  choice: 请让我走吧
  rationale: 该不定过去时命令式要求拉古耳准许并促成他离开；此译保留请求的直接性，也避免“打发我走”在现代汉语中的负面意味。原文没有明说目的地，因此不增译“回去”。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出请求离开的原因，符合现代汉语表达。
- source_word: ὁ πατήρ μου καὶ ἡ μήτηρ μου
  choice: 我父亲和母亲
  rationale: 原文分别点明父亲和母亲，故不压缩为“我父母”。
- source_word: οὐκέτι
  choice: 已经不再
  rationale: 表达某种期待或盼望如今已经停止；“已经”使汉语时态关系更自然。
- source_word: ἐλπίζουσιν
  choice: 指望
  rationale: ἐλπίζω既可侧重“期待”，也可侧重“盼望”。“指望”在本句中较自然，并能在一定程度上保留现实预期与内心希望之间的语义张力。
- source_word: ὄψεσθαί με
  choice: 还能见到我
  rationale: 将未来不定式按现代汉语自然译成“还能见到我”；“还”体现再次相见这一语境含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。对离开的请求使用“请让我走吧”，避免生硬直译；对ἐλπίζουσιν使用“指望”并以脚注注明另一可行译法。
