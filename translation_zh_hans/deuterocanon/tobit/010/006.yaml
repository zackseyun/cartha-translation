  text: And Tobit said to her[a], “Be quiet; do not be anxious. Be well.”
translation:
  language: zh_hans
  text: 多比特对她说：“安静吧，不要挂心[a]。你要好好的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近似“不要有话／事情”；这里按语境译作“不要挂心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  choice: 安静吧
  rationale: 这是简短的命令语，在这里用于制止并安抚对方。“安静吧”既保留直接语气，也比“闭嘴”温和庄重。
- source_word: μὴ λόγον ἔχε
  choice: 不要挂心
  rationale: 原文直译近似“不要有话／事情”，作为习语在本语境中表示不要为此忧心。“不要挂心”自然、简洁，也保留劝慰语气。
- source_word: ὑγίαινε
  choice: 你要好好的
  rationale: ὑγιαίνω与健康、安好有关，此处是对对方的劝慰或祝愿。“你要好好的”在现代汉语中自然，并保留安康之意，避免将其过度解释为单纯的“放心”。
- source_word: λέγει αὐτῇ
  choice: 对她说
  rationale: 希腊文采用叙事性现在时；现代汉语叙事中用“对她说”即可自然表达，不必显明时态转换。
- source_word: Τωβείτ
  choice: 多比特
  rationale: 按本书人名的现代汉语通行音译处理。
