    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 说
  rationale: 希腊文使用叙事性现在时，直译为“说”；现代汉语叙事中的“说”本身不标示时态，既自然，也无需改写为带明确过去标记的形式。
- source_word: Ἐξαπόστειλόν με
  choice: 请让我……去
  rationale: 该命令式有“把我遣送出去、准我离去”的意思。按此处归返父亲身边的语境译作“请让我……去”，比生硬的“差遣我离开”自然，同时保留请求获准动身的含义；“请”体现汉语直接请求的得体表达。
- source_word: πρὸς τὸν πατέρα μου
  choice: 回到我父亲那里
  rationale: πρός加宾格表示朝向某人。直译是“到我父亲那里”；结合多比亚要返回父亲身边的语境，以“回到”自然表达其归返方向，但不增添原文没有的“家”。
- source_word: Τωβείας
  choice: 多比亚
  rationale: 按现代中文《多俾亚传》人名音译习惯处理该希腊人名，并与其父亲多俾亚相区分。
