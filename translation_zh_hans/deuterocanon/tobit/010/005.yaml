  language: zh_hans
  text: 难道我会不挂念吗，孩子？我让你离去了，你是我眼中的光！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“孩子，我既已让你离开——你是我眼中的光——这件事难道不使我挂心吗？”希腊文以反问表达深切的个人忧苦。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλει μοι
  choice: 难道我会不挂念吗
  rationale: μέλει μοι表示某人所关切、挂念的事。用反问句保留希腊文的形式与深切忧苦的语气；“挂念”也自然体现亲人离别后的牵挂。
- source_word: τέκνον
  choice: 孩子
  rationale: τέκνον是亲昵的家庭称呼；译作“孩子”保留柔情，又不单凭该名词增添性别信息。
- source_word: ἀφῆκά σε
  choice: 我既让你离去
  rationale: ἀφίημι在此指让某人离开。“让你离去”贴合不舍而仍准许其动身的语境；“既”表达已经发生的离别及其当前影响。
- source_word: τὸ φῶς τῶν ὀφθαλμῶν μου
  choice: 你是我眼中的光
  rationale: 较直接地保留原文“我眼睛的光”这一亲爱隐喻，同时调整为自然、清楚的现代汉语表达。
