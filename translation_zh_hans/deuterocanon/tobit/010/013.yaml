base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/013.yaml
  text: After these things Tobiah also went on his way[a], blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: zh_hans
  text: 此后，多比雅继续前行，一面称颂上帝，因为上帝使他的旅程顺利[a]；他也不断祝福辣古耳和辣古耳的妻子厄得娜。他一路前行，直到他们临近尼尼微[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“使他的道路亨通”，是指上帝使他的旅程顺利、成功。
    reason: lexical_alternative
  - marker: b
    text: 此处希腊文句法不规则：动词“临近”是复数，旁边却有一个单数代词。译文依叙事情境理解为同行的人临近尼尼微。
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 此后
  rationale: 自然表达叙事中的时间推进；希腊文虽为复数“这些事以后”，现代汉语用“此后”更流畅，意义不减。
- source_word: ἐπορεύετο
  choice: 继续前行／一路前行
  rationale: 未完成时表示持续行进；两处略作变化，以符合现代汉语表达，同时保留动作延续性。
- source_word: εὐλογῶν τὸν θεόν
  choice: 称颂上帝
  rationale: εὐλογέω用于人对上帝时可指称颂、赞美；“称颂”既庄重自然，也避免现代汉语中“祝福上帝”可能造成的误解。
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: 因为上帝使他的旅程顺利
  rationale: εὐοδόω与ὁδός构成使道路或旅程成功、顺利的表达；译出上帝为施事者，并以自然汉语传达该习语。
- source_word: κατευλόγει
  choice: 不断祝福
  rationale: 未完成时体现持续或反复的动作；κατευλογέω在此表示为人祝福，故与前面的“称颂上帝”按对象不同作自然区分。
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: 辣古耳和辣古耳的妻子厄得娜
  rationale: 明确αὐτοῦ所表达的夫妻关系，避免汉语代词指向含混，同时忠实保留两个人名。
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: 直到他们临近尼尼微
  rationale: 保留复数动词ἤγγισαν所指的同行者，并按叙事意义理解为他们接近尼尼微；原文单数宾格αὐτόν造成的句法困难交由脚注说明。
theological_decisions:
- issue: 旅程顺利的施事者
  choice: 明确由上帝使多比雅的旅程顺利
  alternative: 按字面译为“使他的道路亨通”，或泛指使整个行动成功
  rationale: ὅτι从句的主语承接“上帝”，将旅途的顺利归于上帝；译文保留这一护理性的归因，不作额外神学扩展。
- issue: 对上帝与对人的εὐλογέω词族表达
  choice: 对上帝译为“称颂”，对辣古耳夫妇译为“祝福”
  alternative: 两处均译为“祝福”
  rationale: 希腊文有意重复同一词族，但现代汉语按受词不同通常分别说“称颂上帝”和“祝福人”；这样既传达语义，也不引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。人名使用《多俾亚传》汉语传统中较常见的天主教音译形式“多比雅、辣古耳、厄得娜、尼尼微”；神名译作“上帝”。以“一面”和“不断”体现希腊文分词及未完成时的持续性。所有脚注标记均置于正文相关位置。
