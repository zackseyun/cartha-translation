base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/011.yaml
  text: Then Raguel rose and gave him Sarah his wife[a], and half of his possessions—servants and livestock and silver—and after blessing them he sent them away, saying, “May the God of heaven prosper you, children[b], before I die.”
translation:
  language: zh_hans
  text: 拉古耳就起身，把他的妻子撒辣交给他，又把自己一半的财产，就是奴仆[a]、牲畜和银子，也给了他。拉古耳为他们祝福后，便送他们上路，说：“孩子们，愿天上的上帝使你们凡事顺利[b]，在我死以前。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“身体”；在这份财产清单中，指被当作财产的人，也可译作“奴隶”。
    reason: 说明罕见用词的字面意义及其社会语境。
  - marker: b
    text: 也可译作：“天上的上帝必使你们凡事顺利。”希腊文使用将来时，在这里也可起祝福的作用。
    reason: 保留将来时究竟表达祝愿还是预告的歧义。
lexical_decisions:
- source_word: ἀναστὰς
  choice: 起身
  rationale: 这是叙事中常见的惯用分词，表示起身采取行动；“起身”自然且简洁。
- source_word: ἔδωκεν αὐτῷ Σάρραν τὴν γυναῖκα αὐτοῦ
  choice: 把他的妻子撒辣交给他
  rationale: 保留撒辣已是他妻子的表述，同时用“交给”体现父亲将女儿托付给丈夫的家庭与法律语境，避免中文“把妻子给他”可能产生的生硬或物化感。
- source_word: τὰ ἥμισυ τῶν ὑπαρχόντων
  choice: 自己一半的财产
  rationale: ὑπάρχοντα泛指所有物或财产，后面的项目具体说明其内容。
- source_word: σώματα
  choice: 奴仆
  rationale: 该词字面为“身体”，在财产清单中指被视为财产的人；“奴仆”在现代中文中既能表达其受役使和依附身份，也比泛化为“仆人”更诚实地保留原文所反映的社会现实。字面形式另见脚注。
- source_word: κτήνη
  choice: 牲畜
  rationale: 泛指作为财产饲养的家畜；“牲畜”是准确而自然的现代汉语。
- source_word: ἀργύριον
  choice: 银子
  rationale: 保留原文具体的“银”，同时“银子”在此可自然表示贵金属或钱财。
- source_word: εὐλογήσας αὐτοὺς
  choice: 为他们祝福后
  rationale: 不定过去时分词表示祝福先于或伴随送行发生；此译法自然地呈现动作次序。
- source_word: ἐξαπέστειλεν
  choice: 送他们上路
  rationale: 该复合动词表示打发离去或送出；在返程语境中，“送他们上路”比“把他们送走”更自然，也避免负面语气。
- source_word: Εὐοδώσει ὑμᾶς
  choice: 愿……使你们凡事顺利
  rationale: 动词虽为将来时，但在送行祝福中可表达祝愿。“凡事顺利”保留广义的兴盛、成功，也不把含义局限为旅途平安。将来陈述的可能性保留在脚注中。
- source_word: τέκνα
  choice: 孩子们
  rationale: 这是带亲爱意味的复数呼格；原文没有明确的第一人称物主词，因此不增译“我的”。
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: 天上的上帝
  rationale: 自然表达这一敬称，并保留其指向天上之上帝的神学意涵。
- source_word: πρὸ τοῦ μὲ ἀποθανεῖν
  choice: 趁我还没有死
  rationale: 字面为“在我死以前”。置于祝福末尾时，“趁我还没有死”较自然地保留时间限制及说话者对自己临终前景的意识，而不擅自补足未明说的目的或结果。
theological_decisions:
- issue: 祝福语中将来时Εὐοδώσει的语气
  choice: 按祝愿译为“愿天上的上帝使你们凡事顺利”
  alternative: 按预告译为“天上的上帝必使你们凡事顺利”
  rationale: 这句话出现在父亲祝福并送别儿女的直接引语中，祝愿语气最符合言语行为；但希腊文形式上是将来时，故在脚注保留预告式理解，避免消除真实歧义。
- issue: 财产清单中σώματα所指的人群
  choice: 正文译作“奴仆”，脚注说明字面为“身体”
  alternative: 仆人；家中人口
  rationale: 原文将这些人列在财产、牲畜和银子之中，显示受占有和役使的身份。译作“奴仆”不粉饰这一社会现实，同时又不把并未出现的专门词δοῦλοι机械等同进来。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“拉古耳”“撒辣”按《多俾亚传》常见天主教译名处理；“上帝”则采用面向普通现代读者的通行称谓。正文避免欧化长句，把财产清单以同位说明展开。两个脚注标记均紧跟其所解释的词句。
