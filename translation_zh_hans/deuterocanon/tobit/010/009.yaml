  text: Then his father-in-law said to him[a], “Stay with me, and I will send word to your father, and they will make known to him the things concerning you.”
translation:
  language: zh_hans
  text: 岳父对他说：“你就留在我这里吧；我会派人到你父亲那里去，他们会把你的情况告诉他。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译：“他们会把有关你的事告诉他。”“他们”在原文中没有明说所指，可能泛指被派去的人。
    reason: 说明复数动词的未明主语，并给出τὰ κατὰ σέ较为形式对应的译法。
lexical_decisions:
- source_word: ὁ πενθερός
  choice: 岳父
  rationale: πενθερός指因婚姻而有的父亲关系；在本段中说话者是拉贵耳，对多比亚说话，译作“岳父”准确自然。
- source_word: Μεῖνον
  choice: 你就留在
  rationale: μένω的不定过去时命令式，表达直接的挽留；“你就留在”符合现代汉语口吻，也不增加原文没有的时间限定。
- source_word: παρʼ ἐμοί
  choice: 我这里
  rationale: 表示留在说话者身边或住处；结合“留在”，译作“我这里”比直译“与我同在”自然。
- source_word: κἀγὼ ἐξαποστελῶ
  choice: 我会派人
  rationale: ἐξαποστέλλω本义为“派出、差遣”；原文未明说宾语，但下文复数动词暗示被派的人，因此译出“人”可清楚传达句法关系。
- source_word: πρὸς τὸν πατέρα σου
  choice: 到你父亲那里去
  rationale: 保留πρός所表达的趋向和对象，现代汉语自然。
- source_word: δηλώσουσιν
  choice: 他们会……告诉他
  rationale: δηλόω意为“使知道、说明”；复数主语未明说，最可能指所派的人。正文保留“他们”以反映希腊文的复数形式。
- source_word: τὰ κατὰ σέ
  choice: 你的情况
  rationale: 这是指与对方有关之事的习语；“你的情况”简洁自然，并保留其概括性。
