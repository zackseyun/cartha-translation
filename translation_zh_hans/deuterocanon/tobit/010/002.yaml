base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/002.yaml
  text: he said[a], “Could it be that he has been delayed? Or could it be that Gabael has died, and no one is giving him the money?”
translation:
  language: zh_hans
  text: 他说：“莫非他蒙羞了[a]？还是迦巴耳已经死了，没有人把钱交给他？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“被置于羞耻中”。这可能指他遭遇了某种令人难堪的挫折或办事未成，但原文没有说明具体情况。
    reason: 说明原词的字面意义及语境中的不确定性，避免把它单一解释为“耽搁”。
lexical_decisions:
- source_word: Μή ποτε
  choice: 莫非
  rationale: 用于带有忧虑的揣测性问句，自然表达说话人的不安与不确定，并不把猜测说成事实。
- source_word: κατῄσχυνται
  choice: 蒙羞了
  rationale: 保留 καταισχύνω 的核心意义“使蒙羞、使受辱”以及完成时被动语态的结果意味，不按上下文擅自具体化为“耽搁了”。其具体所指仍不明确，故加注说明。
- source_word: ἀπέθανεν
  choice: 已经死了
  rationale: 准确表达死亡这一动作，并用“已经”体现该事件对当前处境造成的结果。
- source_word: Γαβαήλ
  choice: 迦巴耳
  rationale: 按希腊文人名音译，并避免误作另一个较熟悉的人名“加百列”。
- source_word: δίδωσιν αὐτῷ τὸ ἀργύριον
  choice: 没有人把钱交给他
  rationale: ἀργύριον 在本叙事中指款项，译作“钱”比“银子”更符合现代汉语；“交给”贴近 δίδωσιν，又不额外断定这是偿还或取回存款。代词“他”保留原文指向上的含蓄。
