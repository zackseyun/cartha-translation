revisions:
- from: 他对自己的女儿说：“要敬重你的公婆；他们如今就是你的父母。愿我听到关于你的好消息。”说完，他亲吻了她。厄德纳对多比雅说：“亲爱的弟兄，愿天上的主使你复原[a]；愿他让我看见你和我女儿撒拉所生的孩子，好让我在主面前欢喜。看哪，我把女儿当作托付之物交给你[b]；不要使她忧伤。”
  to: 他对女儿说：“要敬重你的公婆；他们如今就是你的父母。愿我听到有关你的好消息。”说完，他亲吻了她。厄德纳对多比雅说：“亲爱的弟兄，愿天上的主使你安然归来[a]；愿他让我看见你和我女儿撒拉所生的孩子，好让我在主面前欢喜。看哪，我把女儿当作托付之物交给你[b]；不要使她忧伤。”
  rationale: 仅将“使你复原”改为“使你安然归来”，以避免现代汉语中偏向病后康复的误解，并以脚注保留原动词较宽的语义范围。其余正文和脚注锚点维持不变。
