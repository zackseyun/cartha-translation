  text: And he said to his daughter[a], “Honor your parents-in-law; they are now your parents. May I hear a good report about you.” And he kissed her. And Edna said to Tobiah, “Beloved brother, may the Lord of heaven restore you, and may he grant me to see children from you and from Sarah my daughter, so that I may rejoice before the Lord. And look, I entrust my daughter to you as a deposit[b]; do not grieve her.”
translation:
  language: zh_hans
  text: 他对女儿说：“要敬重你的公婆；他们如今就是你的父母。愿我听到有关你的好消息。”说完，他亲吻了她。厄德纳对多比雅说：“亲爱的弟兄，愿天上的主使你安然归来[a]；愿他让我看见你和我女儿撒拉所生的孩子，好让我在主面前欢喜。看哪，我把女儿当作托付之物交给你[b]；不要使她忧伤。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使你安然归来”也可理解为“使你复原”或“使你恢复”。
    reason: 希腊动词可表示恢复或带回；本节的离别和旅途语境支持“安然归来”的含义，同时保留较宽的复原之意。
  - marker: b
    text: 也可译作“我把女儿交托给你保管”；希腊文直译为“我把女儿作为一件托付之物交给你”。
    reason: 原文采用受托保管之物的比喻，强调多比雅对撒拉负有珍重照料的责任。
lexical_decisions:
- source_word: Τίμα
  choice: 敬重
  rationale: 既表达应有的尊敬，也保留家庭伦理上的分量；比单纯的“尊重”更庄重自然。
- source_word: τοὺς πενθερούς σου
  choice: 你的公婆
  rationale: 说话对象是女儿，故用现代汉语中专指丈夫父母的“公婆”，准确而自然。
- source_word: γονεῖς
  choice: 父母
  rationale: 直接对应希腊语集合性复数，清楚简洁。
- source_word: ἀκούσαιμί σου ἀκοὴν καλήν
  choice: 愿我听到关于你的好消息
  rationale: 按希腊语习语表达愿望，可指听见她的好名声或近况良好；“好消息”保留这种一定程度的开放性。
- source_word: ἀδελφὲ ἀγαπητέ
  choice: 亲爱的弟兄
  rationale: 保留亲属式称呼及温暖亲切的语气，在庄重叙事中仍属自然。
- source_word: ἀποκαταστήσει σε
  choice: 使你复原
  rationale: 保留“恢复、复归”的基本意义，不在正文中单方面限定为身体康复或旅途平安归来。
- source_word: ὁ κύριος τοῦ οὐρανοῦ
  choice: 天上的主
  rationale: 自然表达属天的神圣称号，并按项目惯例将 κύριος 译为“主”。
- source_word: δῴη μοι ἰδεῖν σου παιδία ἐκ Σάρρας τῆς θυγατρός μου
  choice: 愿他让我看见你和我女儿撒拉所生的孩子
  rationale: 以自然汉语说明孩子出自多比雅与撒拉，同时保留双方亲子关系。
- source_word: ἵνα εὐφρανθῶ ἐνώπιον τοῦ κυρίου
  choice: 好让我在主面前欢喜
  rationale: 忠实保留喜乐及“在主面前”的敬虔指向。
- source_word: παρατίθεμαί σοι … ἐν παρακαταθήκῃ
  choice: 我把女儿当作托付之物交给你
  rationale: 同时呈现“交托”动作与 παρακαταθήκη 所含的保管、受托责任比喻，避免过度金融化的“押金”。
- source_word: μὴ λυπήσῃς αὐτήν
  choice: 不要使她忧伤
  rationale: 清楚表达使役意义，涵盖令她悲伤、痛苦或烦恼。
theological_decisions:
- issue: 次经希腊文本中神圣称号 κύριος 的译法
  choice: 主
  alternative: 上主；主宰
  rationale: “主”既忠实对应 κύριος，又符合现代中文圣经语体；不以特殊字形或宗派性称谓增加原文没有的限定。
- issue: ἀποκαταστήσει 在祝福语中的含义
  choice: 使你复原
  alternative: 使你安然归来
  rationale: 上下文中的旅程使“平安带回”很可能包含在内，但该动词本身也可表示恢复、复原；正文保留较宽含义，并用脚注说明旅途语境下的可能理解。
translation_notes:
  register: 采用现代、庄重且普通读者易懂的叙事语体。人物名按《多俾亚传》常见现代音译处理为“厄德纳、多比雅、撒拉”。正文保留原文的祝愿语气、亲属式称呼及受托保管的比喻；对可能涉及“复原／归来”的歧义不作武断消解。
