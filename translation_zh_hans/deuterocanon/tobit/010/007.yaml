base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/007.yaml
  text: And she said to him[a], “Be quiet; do not mislead me. My child has perished.” And every day she would go out to the road by which he had departed, and by day she would eat no bread, and at night she did not cease mourning for Tobias her son, until the fourteen days of the wedding feast were completed[b], which Raguel had sworn that he should spend there.
translation:
  language: zh_hans
  text: 他对她说[a]：“别说了，不要欺哄我；我的孩子已经不在了[b]。”她每天都到外面去，走到他离去的那条路上；白天不吃饼，夜里也不停地为她儿子多比亚哀哭，直到婚宴的十四天[c]结束，就是拉贵耳起誓要他留在那里度过的那些日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所给希腊文本直译作“他对她说”；但本句内容和下文的阴性主语使说话者身份显得不协调，另有文本传统及上下文支持“她对他说”。
    reason: textual_variant
  - marker: b
    text: “不在了”所译的希腊词既可表示“失落了”，也可表示“丧亡了”；这里表达说话者恐惧中的判断，并非叙述者确认孩子已经死亡。
    reason: lexical_alternative
  - marker: c
    text: 直译为“婚姻（或婚礼）的十四天”，按上下文是指婚礼庆宴持续的时期。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: 他对她说
  rationale: 所给希腊文本的 αὐτῇ 是阴性第三人称单数间接受格，直译为“对她”；动词本身未明示主语，但按当前句法承接作“他”。因上下文及其他传本可能支持相反的说话关系，另加脚注说明，不在正文中静默改写。
- source_word: Σίγα
  choice: 别说了
  rationale: 保留命令停止说话的突兀语气，同时采用自然的现代汉语。
- source_word: μὴ πλάνα με
  choice: 不要欺哄我
  rationale: πλανάω 可表示使人迷误或受骗；“欺哄”适合拒绝安慰的语境，又比“欺骗”稍少强调蓄意诈骗。
- source_word: ἀπώλετο
  choice: 已经不在了
  rationale: 原词既可指失落，也可指丧亡；此处是母亲或父亲因忧惧而作的结论。“不在了”在语境中传达死亡之忧，又不把叙述者未确认的死亡写成客观事实。
- source_word: τὸ παιδίον μου
  choice: 我的孩子
  rationale: 保留亲昵、痛惜的称呼，并与后文明确的“她儿子”有所区分。
- source_word: καθʼ ἡμέραν
  choice: 每天
  rationale: 清楚自然地表达反复发生的动作。
- source_word: εἰς τὴν ὁδὸν ἔξω οἵας ἀπῆλθεν
  choice: 到外面、走上他离去时所走的那条路
  rationale: 呈现她每日外出到儿子离去路线守望的画面；希腊语关系结构略不规则，译文保留其核心空间意义。
- source_word: ἡμέρας τε ἄρτον οὐκ ἤσθιεν
  choice: 白天不吃饼
  rationale: 保留具体的“饼／食物”意象，不泛化为“不吃东西”。
- source_word: τὰς δὲ νύκτας οὐ διέλιμπανεν θρηνοῦσα
  choice: 夜里也不停地……哀哭
  rationale: 未完成时与分词共同表达持续不断的哀悼。
- source_word: Τωβείαν τὸν υἱὸν αὐτῆς
  choice: 她儿子多比亚
  rationale: 按希腊文明确表达亲属关系，并采用常见人名译法。
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: 婚宴的十四天
  rationale: 此处 γάμος 按上下文指婚礼庆宴期；正文采用合乎叙事场景的表达，脚注保留字面可能。
- source_word: ἃς ὤμοσεν Ῥαγουὴλ ποιῆσαι αὐτὸν ἐκεῖ
  choice: 就是拉贵耳起誓要他留在那里度过的那些日子
  rationale: 希腊语表达较压缩；译文明确十四天是拉贵耳起誓要他在那里度过的期限，而不额外推断誓言细节。
theological_decisions:
- issue: “孩子已经不在了”是否由叙述者确认死亡
  choice: 把这句话保留为引语中人物因忧惧所下的结论
  alternative: 直译为“我的孩子已经死了”，使死亡判断更确定
  rationale: ἀπώλετο 的语义容许“失落／丧亡”，而故事叙述并未在此确认多比亚死亡；不应把人物的恐惧提升为叙述事实。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语；保留“饼”“哀哭”等具体而有经文质感的措辞。对所给希腊文本中“他对她说”与上下文的张力不作无声校正，而以正文直译并用脚注交代。
