  text: Then his wife said to him[a], “The child has perished, because he has been delayed.” And she began to mourn for him and said,
translation:
  language: zh_hans
  text: 他的妻子对他说：“孩子已经死了，因为他耽搁太久了。”于是她开始为他哀哭[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里重复“他”（直译“为他、他”），可能是为了强调，也可能是抄写时的重复；正文按自然汉语译作“为他”。
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπώλετο
  choice: 已经死了
  rationale: 此处是不定过去时中间／被动形式；结合母亲随即为儿子哀哭的语境，表达她认定孩子已经丧命。“死了”在现代汉语中自然、沉重，同时不具体说明死因。
- source_word: τὸ παιδίον
  choice: 孩子
  rationale: παιδίον可指孩子或男孩；这里虽特指她的儿子，但“孩子”既贴近希腊语，也符合母亲焦急悲痛的口吻。
- source_word: κεχρόνικεν
  choice: 耽搁太久了
  rationale: χρονίζω的完成时表示延宕已久。“耽搁太久了”自然地传达长时间未归，并保留διότι所引出的因果关系；不把它误解为明确的外力被动。
- source_word: ἤρξατο θρηνεῖν
  choice: 开始……哀哭
  rationale: 该结构表示哀悼行为的开始。中文“哀哭”兼顾为 presumed death 哀悼与出声悲叹的语义。
- source_word: αὐτὸν αὐτὸν
  choice: 为他
  rationale: 传抄文本连续两次出现αὐτόν。正文按自然汉语以一次“为他”表达宾语关系，重复情况在脚注中交代。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“孩子已经死了”呈现母亲因儿子久未归来而作出的悲痛判断；“耽搁太久了”保留延迟已持续一段时间的完成时意味。句末用冒号承接下一节她所说的话。
