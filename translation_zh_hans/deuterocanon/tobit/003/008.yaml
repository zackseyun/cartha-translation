base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/008.yaml
  text: because she had been given to seven husbands[a], and Asmodeus, the evil demon, killed them before they could be with her as with wives. And they said to her, “Do you not understand that you are choking your husbands? Already you have had seven, and you have not benefited from even one of them.”
translation:
  language: zh_hans
  text: 因为她曾被嫁给七个丈夫；恶魔阿斯摩代在他们尚未来得及与她行夫妻之事以前，就杀了他们[a]。她们对她说：“你还不明白吗？你是在使自己的丈夫窒息吗？你已经有过七个丈夫，却连一个也没有使你得益。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们尚未来得及与她同房以前。”希腊文以委婉说法指夫妻结合。
    reason: 说明πρὶν ἢ γενέσθαι αὐτοὺς μετʼ αὐτῆς ὡς ἐν γυναιξίν所指的夫妻性结合，并保留正文较克制的措辞。
lexical_decisions:
- source_word: δεδομένη ἀνδράσιν ἑπτά
  choice: 曾被嫁给七个丈夫
  rationale: 保留完成时被动语态所突出的婚配安排，同时用现代汉语可理解的表达明确ἀνδράσιν在此指丈夫。
- source_word: Ἀσμοδαῖος τὸ πονηρὸν δαιμόνιον
  choice: 恶魔阿斯摩代
  rationale: 将专名按希腊语音译为“阿斯摩代”，并以“恶魔”直接表达πονηρόν与δαιμόνιον的合意，避免弱化其邪恶属性。
- source_word: ἀπέκτεινεν
  choice: 杀了
  rationale: 采用直接、自然的叙事用语，不增添杀害方式。
- source_word: πρὶν ἢ γενέσθαι αὐτοὺς μετʼ αὐτῆς ὡς ἐν γυναιξίν
  choice: 使他们还没能像丈夫与妻子那样与她结合
  rationale: 以含蓄而可懂的方式表达婚姻中的性结合，保留原文委婉语气；“像丈夫与妻子那样”自然传达关系性质。
- source_word: Οὐ συνιεῖς
  choice: 你还不明白吗
  rationale: 保留反问和侍女们嘲弄、责难的口吻。
- source_word: ἀποπνίγουσά σου τοὺς ἄνδρας
  choice: 是你把自己的丈夫一个个掐死了
  rationale: “掐死”保留ἀποπνίγω所描绘的窒息性暴力；“一个个”由七位丈夫的语境自然引出，传达持续反复的恶毒指控。
- source_word: ἤδη ἑπτὰ ἔσχες
  choice: 你已经有过七个丈夫
  rationale: 补出汉语所需的中心词“丈夫”，同时保留“已经”和数字七。
- source_word: ἑνὸς αὐτῶν οὐκ ὠνάσθης
  choice: 却连一个也没有使你得益
  rationale: 保留ὠνάσθης“得到益处、好处”的宽泛含义，不擅自说明婚姻本应带来的具体利益。
theological_decisions:
- issue: 婚姻结合的委婉表达
  choice: 像丈夫与妻子那样与她结合
  alternative: 与她同房；与她发生关系
  rationale: 原文以“与她在一起，如同对待妻子”一类措辞委婉指向夫妻性关系。正文保留克制，并用脚注说明含义，不将其改成露骨的性行为术语。
- issue: 阿斯摩代的身份称谓
  choice: 恶魔
  alternative: 邪灵
  rationale: δαιμόνιον在此明确指敌对的超自然存在，“恶魔”比范围较宽的“邪灵”更直接，同时不加入经文未明说的系统性魔鬼论解释。
- issue: 侍女指控撒拉杀夫的性质
  choice: 按原文直译为恶毒指控，不暗示该指控属实
  alternative: 改写为“你的丈夫都因你而死”
  rationale: 叙述已明确真正的杀害者是阿斯摩代；引语仍应保留侍女们“是你掐死”的残酷诬蔑及原文张力，而不由译者在引语中纠正她们。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。叙述部分简洁，直接点明真正的杀害者；引语则保留侍女们尖刻而残酷的责骂。“被嫁给”刻意保留原文被动结构所显示的婚配安排。
