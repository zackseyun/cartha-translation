  to: 因为她曾被嫁给七个丈夫；恶魔阿斯摩代在他们尚未来得及与她行夫妻之事以前，就杀了他们[a]。她们对她说：“你还不明白吗？你是在使自己的丈夫窒息吗？你已经有过七个丈夫，却连一个也没有使你得益。”
  rationale: 修订恢复“在……以前”的时间关系，采用自然、克制而明确的汉语表达夫妻结合；并将“一个个掐死”改为“使……窒息”，避免无根据地限定手段或添加重复意味。其余叙事与引语的尖刻语气均予保留。
