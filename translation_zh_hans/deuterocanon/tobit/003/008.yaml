  source_fidelity: 首句的因果关系、七位丈夫、阿斯摩代作为杀害者，以及侍女的恶意指控均与希腊文相符。但“杀了他们，使他们还没能……”弱化并改写了πρὶν ἤ（“在……以前”）的时间结构；“像丈夫与妻子那样与她结合”在汉语中关系指向不够清楚。将ἀποπνίγουσα译作“一个个掐死”还具体化为徒手掐杀，并加入原文没有的“一个个”。
