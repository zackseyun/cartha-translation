  yaml_path: translation/deuterocanon/tobit/003/017.yaml
  text: 'of the great Raphael. And he was sent to heal the two: to remove the white films from Tobit''s eyes[a], and to give Sarah daughter of Raguel to Tobiah son of Tobit as a wife, and to bind Asmodeus, the evil demon, because Tobiah was entitled to inherit her. At that same time Tobit returned and entered into his house, and Sarah daughter of Raguel came down from her upper room.'
translation:
  language: zh_hans
  text: （……）伟大的拉斐尔的。他奉差遣去医治他们二人：剥去托比特眼中的白膜，把拉古埃尔的女儿撒拉给托比特的儿子托比亚为妻，并捆绑邪灵阿斯莫代，因为托比亚有权承受她[a]。就在那时，托比特返回，进了自己的家里；拉古埃尔的女儿撒拉也从自己楼上的房间下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较通顺地译作“因为托比亚有权娶她”。希腊文直说“承受她”，反映了故事中的家族法律框架。
    reason: 说明继承用语在婚姻语境中的含义，同时保留原文重要而不寻常的措辞。
lexical_decisions:
- source_word: τοῦ μεγάλου Ῥαφαήλ
  choice: 伟大的拉斐尔的
  rationale: 保留原文属格片语及其与上文相连的断句形态，不擅自补出本节未明说的中心词。人名按现代汉语音译。
- source_word: ἀπεστάλη
  choice: 他奉差遣
  rationale: 保留被动含义和受差派的意味，同时不补明原文省略的差遣者。
- source_word: ἰάσασθαι τοὺς δύο
  choice: 医治他们二人
  rationale: 让“医治”统摄随后针对托比特和撒拉的一系列行动，保持原文将身体痊愈与脱离邪灵都纳入医治使命的表达。
- source_word: λεπίσαι τὰ λευκώματα
  choice: 剥去托比特眼中的白膜
  rationale: “剥去”体现λεπίσαι的剥落、除去之意；“白膜”表达眼部白色混浊，却不武断地采用现代诊断名“白内障”。
- source_word: δοῦναι ... γυναῖκα
  choice: 把……给……为妻
  rationale: 贴近希腊文的给予和婚姻表达，在现代汉语中仍自然清楚。
- source_word: δῆσαι Ἀσμοδαῖον τὸ πονηρὸν δαιμόνιον
  choice: 捆绑邪灵阿斯莫代
  rationale: “捆绑”直接对应δῆσαι；将形容语自然并入“邪灵”，同时保留阿斯莫代的专名。
- source_word: ἐπιβάλλει κληρονομῆσαι αὐτήν
  choice: 托比亚有权承受她为产业
  rationale: “有权”表达ἐπιβάλλει所含的合法资格或优先权；“承受……为产业”保留κληρονομῆσαι的继承语言及故事中的家族法律框架，不将其平滑改写为单纯的婚恋说法。
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: 就在那时
  rationale: 自然表达原文强调的同一时刻和两地事件的同步发生。
- source_word: ἐπιστρέψας ... εἰσῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: 转身回到自己家里
  rationale: 兼顾ἐπιστρέψας的转回动作和进入家中的结果，避免生硬重复“返回并进入”。
- source_word: ὑπερῴου
  choice: 楼上房间
  rationale: 指房屋上层的房间；此译法比单说“楼上”更具体，又不额外推定其用途。
theological_decisions:
- issue: 拉斐尔使命中“医治”的范围
  choice: 把医治理解为统摄托比特眼睛得愈和撒拉脱离邪灵、进入婚姻的一系列行动。
  alternative: 仅把“医治”限定为托比特身体上的痊愈，另将撒拉的解救视作无关的任务。
  rationale: 不定式ἰάσασθαι以“他们二人”为宾语，并引出涉及两人的全部任务；译文因此保留医治与拯救交叠的广义表达。
- issue: κληρονομῆσαι αὐτήν对撒拉的法律婚姻表述
  choice: 正文译作“有权承受她为产业”，保留继承用语，并用脚注解释其婚姻语境。
  alternative: 直接译作“有权娶她”或“轮到他娶她”。
  rationale: 希腊文刻意使用“继承”语言。正文不消除这种令人不适却具有叙事法律意义的张力；脚注则帮助现代读者理解其实际所指。
- issue: 差遣拉斐尔者的身份
  choice: 采用“奉差遣”的被动表达，不在本节补出差遣者。
  alternative: 明译为“上帝差遣他”。
  rationale: 语境可以暗示神圣差遣，但本节的被动句没有明说施事者；译文避免把推论直接写入正文。
translation_notes:
  register: 采用庄重而现代的标准普通话，句式清楚，避免古奥教会术语。人物名统一采用便于普通读者识别的现代音译：拉斐尔、托比特、托比亚、撒拉、拉古埃尔、阿斯莫代。开头保留原文跨节延续的属格残句，因此有意呈现为“伟大的拉斐尔的”，不擅自补足前文成分。
