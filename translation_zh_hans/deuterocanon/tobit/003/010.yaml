revisions:
- from: 她听见这些话，就悲痛万分，甚至想要上吊自尽。但她说：“父亲只有我这一个孩子；如果我这样做，他必蒙受羞辱，我也会使他在悲痛中衰老而下到阴间[a]。”
  to: 她听见这些话，就悲痛万分，甚至想要上吊自尽。但她说：“我是父亲唯一的孩子；如果我这样做，他必蒙受羞辱，我也会使父亲在悲痛中结束晚年，落入阴间[a]。”
  rationale: 将“父亲只有我这一个孩子”调整为“我是父亲唯一的孩子”，使引语的第一人称自述更直接。末句改为“使父亲在悲痛中结束晚年，落入阴间”，以自然汉语表达“把他的晚年带着悲痛带下到阴间”的希腊语成语：她担忧自己的行为会使年迈父亲悲痛至死。保留“阴间”及其脚注，不将ᾅδης解释为地狱。
