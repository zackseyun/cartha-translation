base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/010.yaml
  text: When she heard these things[a], she was deeply grieved, so that she wanted to hang herself. But she said, “I am my father’s only child. If I do this, it will be a disgrace to him, and I will bring his old age down with sorrow to Hades.”
translation:
  language: zh_hans
  text: 她听见这些话，就悲痛万分，甚至想要上吊自尽。但她说：“我是父亲唯一的孩子；如果我这样做，他必蒙受羞辱，我也会使父亲在悲痛中结束晚年，落入阴间[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“死人的国度”或“坟墓”。希腊文作ᾅδης（哈得斯）。“阴间”在这里不特指刑罚之地。
    reason: 保留ᾅδης的词汇范围，并避免读者将“阴间”直接等同于“地狱”。
lexical_decisions:
- source_word: ταῦτα ἀκούσασα
  choice: 她听见这些话
  rationale: 以自然的汉语时间表达处理分词结构，并保留ταῦτα“这些”的指示意义，不擅自说明所听见的具体内容。
- source_word: ἐλυπήθη σφόδρα
  choice: 就悲痛万分
  rationale: λυπέω表示忧伤、痛苦，σφόδρα加强程度；“悲痛万分”既传达强烈情绪，也符合庄重而通顺的现代汉语。
- source_word: ὥστε ἀπάγξασθαι
  choice: 甚至想要上吊自尽
  rationale: ἀπάγχομαι明确指以悬吊方式自尽；结合下文她因顾念父亲而没有实行，“想要”保留了所念及而未付诸行动的语境，不把它说成已经完成的决定。
- source_word: Μία μέν εἰμι τῷ πατρί μου
  choice: 父亲只有我这一个孩子
  rationale: μία在此表示她对父亲而言是唯一的一个；译作“唯一的孩子”比限定为“独生女”更严格保留原文未重复说明性别或亲属称谓的表达。
- source_word: ὄνειδος αὐτῷ ἔσται
  choice: 他必蒙受羞辱
  rationale: ὄνειδος可指羞辱、耻辱或责难；此处强调她的行为会使父亲在社会上蒙羞，采用自然的汉语动宾表达。
- source_word: τὸ γῆρας αὐτοῦ κατάξω
  choice: 我也会使他……衰老而下到
  rationale: 保留κατάγω“带下去、使下去”的方向性，并把τὸ γῆρας αὐτοῦ所表达的“他的晚年/老年”化为符合汉语习惯的“使他衰老而下到”，避免生硬的“把他的老年带下去”。
- source_word: μετʼ ὀδύνης
  choice: 在悲痛中
  rationale: ὀδύνη既可指疼痛，也可指深切忧伤；在女儿设想父亲因她的死而受苦的语境中，“悲痛”最为贴切。
- source_word: εἰς ᾅδου
  choice: 下到阴间
  rationale: ᾅδης在此指死者所在之处。“阴间”是现代汉语圣经语境中较易懂且不等同于刑罚之地“地狱”的表达；脚注同时交代希腊词及其他可能译法。
theological_decisions:
- issue: 次经希腊文本中ᾅδης的译法
  choice: 阴间
  alternative: 死人之境；坟墓；哈得斯
  rationale: 原文明确使用ᾅδης。正文采用“阴间”，以表达死者所在之境，同时避免误译为带有永刑含义的“地狱”；脚注保留词形和其他理解，不把其精确性质作教义化限定。
- issue: ὥστε ἀπάγξασθαι所表达的行动程度
  choice: 甚至想要上吊自尽
  alternative: 以至于上吊自尽；甚至决定上吊自尽
  rationale: 下文显示她随即因顾念父亲而制止自己。译作“想要”既传达自尽念头的严重性，也不把结果结构过度解释为已经实行或作出不可更改的决定。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“悲痛万分”“蒙受羞辱”保持叙事的严肃语气；“上吊自尽”直陈原文内容而不过度委婉。脚注标记置于实际涉及词汇选择的“阴间”之后。
