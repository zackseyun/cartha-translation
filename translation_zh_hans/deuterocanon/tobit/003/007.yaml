  yaml_path: translation/deuterocanon/tobit/003/007.yaml
  text: On that same day it happened to Sarah, the daughter of Raguel, in Ecbatana of Media, that she too was reproached by her father's maidservants,
translation:
  language: zh_hans
  text: 同一天，拉古耳的女儿撒拉在米底亚的埃克巴坦，也遭到她父亲的婢女们辱骂，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“责难”或“嘲弄”；希腊文动词指以侮辱性的言语责备或羞辱。
    reason: 词义有一定幅度；正文“辱骂”不应排除责难或嘲弄的含义，也不应断言此处必指公开发生的责备。
lexical_decisions:
- source_word: Ἐν τῇ αὐτῇ ἡμέρᾳ
  choice: 同一天
  rationale: 自然地表达时间，并保留与前文同日发生的叙事联系。
- source_word: συνέβη
  choice: 遭到
  rationale: 希腊文以非人称结构引出撒拉的遭遇；汉语结合后面的被动事件译为“遭到”，比直译“发生在……身上”更自然。
- source_word: τῇ θυγατρὶ Ῥαγουὴλ Σάρρᾳ
  choice: 拉古耳的女儿撒拉
  rationale: 按现代汉语语序清楚保留姓名及父女关系。
- source_word: ἐν Ἐκβατάνοις τῆς Μηδείας
  choice: 在米底亚的埃克巴坦
  rationale: 保留城名和所属地区，不额外补入原文没有的“城”等说明。
- source_word: καὶ ταύτην
  choice: 也
  rationale: “也”保留撒拉的遭遇与前文平行的附加意味，同时不强行限定 καί 究竟修饰人物还是整件事。
- source_word: ὀνειδισθῆναι
  choice: 辱骂
  rationale: 表达因责难性、羞辱性言语而受辱的含义；脚注列出较宽的可能译法。
- source_word: ὑπὸ παιδισκῶν πατρὸς αὐτῆς
  choice: 遭到她父亲的婢女们
  rationale: 保留施事者、从属关系、女性身份和复数形式；“婢女”也反映其仆役身份。
