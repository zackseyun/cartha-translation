base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/002.yaml
  text: You are righteous[a], Lord, and all your works and all your ways are mercy and truth, and you judge true and righteous judgment forever.
translation:
  language: zh_hans
  text: 主啊，你是公义的；你一切的作为和一切的道路，都是怜悯与信实[a]；你永远施行真实而公正的审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信实”也可译作“真实”。希腊语“怜悯”采用复数形式，也可理解为“种种怜悯的行动”。
    reason: 保留ἀλήθεια的“真实/信实”语义幅度，并说明ἐλεημοσύναι的复数及行动性。
lexical_decisions:
- source_word: Δίκαιος
  choice: 公义的
  rationale: 作表语描述上帝的品格；“公义”兼具道德正直和施行公正的含义，也符合庄重的圣经语体。
- source_word: Κύριε
  choice: 主啊
  rationale: 这是对上帝的直接呼告；以“主啊”自然表达希腊语呼格。
- source_word: ἔργα
  choice: 作为
  rationale: 涵盖上帝所做的一切，较“行为”更适合用于上帝，也不把含义限于个别行动。
- source_word: ὁδοί
  choice: 道路
  rationale: 保留圣经中以“道路”指行事方式和治理作为的惯用隐喻。
- source_word: ἐλεημοσύναι
  choice: 怜悯
  rationale: 该词虽可指施舍或怜悯的行动，但此处用来概括上帝的一切道路；“怜悯”避免误解为狭义的周济，同时保留核心语义。
- source_word: ἀλήθεια
  choice: 信实
  rationale: 在与“怜悯”并列并描述上帝道路的语境中，“信实”比抽象的“真理”更自然地表达可靠、真实不欺；“真实”作为直接词义保留在脚注中。
- source_word: κρίσιν ἀληθινὴν καὶ δικαίαν
  choice: 真实而公正的审判
  rationale: 保留两个并列形容词；“真实”对应ἀληθινήν，“公正”对应δικαίαν，并避免与前句“公义的”机械重复。
- source_word: κρίνεις
  choice: 你所施的审判
  rationale: 以中文自然的名词化结构表达“你审判”，同时保留上帝主动施行审判的意思。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 自然表达持续无尽的时间，并按希腊语句法修饰上帝施行审判这一恒久事实。
theological_decisions:
- issue: ἀλήθεια在“怜悯—ἀλήθεια”组合中应译为“信实”还是“真实/真理”
  choice: 信实
  alternative: 真实（或真理）
  rationale: 希腊词本身可表示真实、真理或信实。此处谓述上帝的一切道路，与“怜悯”并列，“信实”在现代汉语中更能表达上帝行事可靠不变的含义；脚注保留“真实”这一较直接的词义，避免消除原文的语义张力。
- issue: εἰς τὸν αἰῶνα修饰审判行为还是审判的性质
  choice: 按其最自然的句法关系，表达上帝永远施行真实而公正的审判
  alternative: 把“永远”理解为审判结果或公正性质永久有效
  rationale: 该短语位于κρίνεις之后，最自然地修饰“审判”这一动词；译文不进一步界定其神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。用分号呈现原句三个紧密相连的陈述层次；避免生硬直译“一切道路都是施舍”，也不引入特定宗派术语。脚注标记[a]已置于相关词语之后。
