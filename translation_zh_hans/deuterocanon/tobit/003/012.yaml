  text: And now[a], Lord, I have set my eyes and my face toward you.
translation:
  language: zh_hans
  text: 如今，主啊，我已将我的眼睛和脸转向你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“我已把我的眼睛和脸给了你。”希腊文很可能以身体语言表示人在祷告中转向上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: 现在
  rationale: 作为祷告中的转折语，表示祈祷者此刻转而面向主；现代汉语中省去句首“而”更自然。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος 的呼格，直接称呼上帝；“主啊”自然表达现代汉语祷告中的呼语和敬意。
- source_word: τοὺς ὀφθαλμούς μου
  choice: 我的双眼
  rationale: 保留原文具体的身体意象；复数 ὀφθαλμούς 译作“双眼”符合汉语习惯。
- source_word: τὸ πρόσωπόν μου
  choice: 脸
  rationale: 与“双眼”并列，应按 πρόσωπον 的具体本义理解，保留身体转向上帝的图像。
- source_word: εἰς σὲ
  choice: 转向你
  rationale: εἰς 表示朝向；与 δέδωκα 构成此处的方向性表达，汉语以“转向你”自然传达其含义。
- source_word: δέδωκα
  choice: 把……转向
  rationale: δέδωκα 是 δίδωμι 的完成时，字面为“已经给了”；与“双眼和脸”连用时，是把它们朝向上帝的身体化表达。“把……转向”既自然，又体现已经作出的有意行动。
theological_decisions:
- issue: 祷告中 κύριος 的译法
  choice: 主啊
  alternative: 上主啊
  rationale: 原文仅有 κύριος 的呼格，没有要求另加专名性质的标记；“主啊”忠实而自然，也不引入特定宗派用语。
- issue: 双眼和脸朝向上帝的表达
  choice: 按身体动作的祷告意象译为“把我的双眼和脸转向你”
  alternative: 按字面译为“把我的双眼和脸给了你”
  rationale: 原文保留具体身体语言，但 δίδωμι 在此不能机械理解为转让所有权；译文表达祷告者全身心转向上帝，同时由脚注交代字面形式，避免过度解释其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主啊”保留直接呼告；“双眼和脸”保留原文成对的身体意象，不改写为较抽象的“目光”或“心”。脚注标记置于整句之后，对应整项惯用表达。
