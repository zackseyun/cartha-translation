review_pass:
  verdict: revise
  source_fidelity: 草案准确保留了“他们”不听从与“我们”承受后果的代词差异，也保留了上帝主动“交给”的审判语气，以及在列国中流散的完成结果。不过，θάνατον 的基本义是“死亡”，正文的“杀害”把名词具体化为外力施杀，超出了原文；“给人掳掠、囚禁、杀害”的动词化串列也较原文的灾祸名词串列增添了施事和方式。
  naturalness: 修订后仍采用自然、庄重的现代汉语祷告体。“在我们被分散到其中的万国中”明确对应 ἐν οἷς（在这些列国中），避免“被分散到的列国”可能产生的修饰歧义。“受辱的话柄”既符合汉语搭配，也较“受辱的笑柄”更贴近“proverb/byword of reproach”的语义。
  terminology: “诫命”“万国”“受辱的话柄”适合本段庄重的经文语域。保留“囚禁”可表达 αἰχμαλωσία 的被俘拘禁状态；“死亡”应按 θάνατος 的普通名词义直译。脚注须避免“羞辱人的俗语”，因为该说法可理解为羞辱他人的俗语，而原文是指该群体成为蒙羞、受讥讽的话柄。
  issues:
  - severity: medium
    issue: “杀害”将 θάνατον（死亡）具体化为杀人行为。
    rationale: 希腊文为“死亡”，没有明示施害者或杀害动作；译作“死亡”可保留原文概括性。
  - severity: low
    issue: “给人掳掠、囚禁、杀害”增添了“人”及连续动作式表达。
    rationale: 原文以 εἰς 引出“掠夺、囚禁／被掳、死亡”等灾祸名词；修订为名词性并列，较少补入未明说的施事。
  - severity: medium
    issue: 脚注中的“羞辱人的俗语”具有方向歧义。
    rationale: 它可能表示“用来羞辱别人的俗语”，但 παραβολὴν ὀνειδισμοῦ 是该群体成为受羞辱、受讥讽的俗语或话柄。
  revised_text: 因为他们不听从你的诫命；你把我们交给抢掠、囚禁和死亡，使我们在我们被分散到其中的万国中成为受辱的话柄。[a]
