- from: 因为他们不听从你的诫命；你就把我们交给人掳掠、囚禁、杀害，又使我们在被分散到的列国中成为受辱的笑柄。[a]
  to: 因为他们不听从你的诫命；你把我们交给抢掠、囚禁和死亡，使我们在我们被分散到其中的万国中成为受辱的话柄。[a]
  rationale: 修订仅校正原文未明示的“杀害”及相应的动作化表达，并澄清脚注的语义方向；其余保留草案对人称、神圣审判主动性、流散背景和公开羞辱意象的恰当处理。
