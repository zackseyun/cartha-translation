base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/004.yaml
  text: For they disobeyed your commandments, and you gave us over to plunder and captivity and death, and to become a proverb of reproach among all the nations where we have been scattered.
translation:
  language: zh_hans
  text: 因为他们不听从你的诫命；你把我们交给抢掠、囚禁和死亡，使我们在我们被分散到其中的万国中成为受辱的话柄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“受辱的话柄”或“蒙羞的俗语”，指成为万国用来讥讽的对象。
    reason: 说明παραβολὴν ὀνειδισμοῦ兼有“话柄／俗语”与“羞辱”的复合含义，并避免“羞辱人的”可能造成的方向歧义。
lexical_decisions:
- source_word: παρήκουσαν
  choice: 他们不听从
  rationale: 保留动词“未曾听从、拒不遵从”的听觉意象，同时在现代汉语中清楚表达悖逆之意。
- source_word: τῶν ἐντολῶν σου
  choice: 你的诫命
  rationale: “诫命”保留祷告语境中的圣约和宗教分量，比一般的“命令”更贴切。
- source_word: ἔδωκας ἡμᾶς εἰς
  choice: 你就把我们交给
  rationale: 直接保留上帝施行审判的主动作用，不改写为弱化施事者的被动句。
- source_word: διαρπαγήν
  choice: 给人掳掠
  rationale: 该词指遭抢夺、成为掠物；加“给人”使汉语搭配自然，并与后面的灾祸并列。
- source_word: αἰχμαλωσίαν
  choice: 囚禁
  rationale: 直接表达被俘后处于拘禁中的状态，避免扩大为较宽泛的“流亡”。
- source_word: θάνατον
  choice: 杀害
  rationale: 源词本义为“死亡”；在“交给……”的汉语结构中用“杀害”更自然，并保留因暴力而死的灾难含义。
- source_word: παραβολὴν ὀνειδισμοῦ
  choice: 受辱的笑柄
  rationale: παραβολή在此指流传于人口中的话柄或笑柄，ὀνειδισμός表示羞辱、辱骂；该译法既自然，又保留公开蒙羞的意象。
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: 列国中
  rationale: “列国”适合流散背景，且不引入后期色彩较强的“外邦人”称谓。
- source_word: ἐν οἷς ἐσκορπίσμεθα
  choice: 在被分散到的
  rationale: 保留被动语态和流散的结果；“分散到列国中”在现代汉语中清楚自然。
theological_decisions:
- issue: 群体认罪与上帝在审判中的主动作用
  choice: 保留“他们不听从”与“你就把我们交给”之间人称和施事的差异。
  alternative: 改成“我们不听从”，或弱化为“我们被交给”。
  rationale: 希腊文以第三人称复数指犯罪者，却以第一人称复数指承受后果的群体，并明确以上帝为交付者；译文不消解这种跨世代的群体连带和神圣审判之间的张力。
- issue: 公开羞辱的惯用表达
  choice: 正文译为“受辱的笑柄”，脚注保留更贴近构词的表达。
  alternative: “受辱的譬喻”或“羞辱的俗语”。
  rationale: 逐词硬译在现代汉语中容易令人误解为修辞性譬喻；“笑柄”传达成为众国谈资并蒙羞的语境含义，而脚注说明原文意象。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语祷告体。“因为……你就……”明确因果关系；灾祸以并列动词呈现，避免生硬的抽象名词串列。脚注标记已在正文对应出现。
