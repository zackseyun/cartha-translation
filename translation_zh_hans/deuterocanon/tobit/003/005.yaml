  yaml_path: translation/deuterocanon/tobit/003/005.yaml
  text: And now your judgments are many and true in dealing with me concerning my sins and the sins of my fathers[a], because we did not keep your commandments[b]; for we did not walk in truth before you.
translation:
  language: zh_hans
  text: 现在，你因我的罪和我祖先的罪向我施行的审判既多且真实[a]；因为我们没有遵行你的诫命，也没有在你面前按真理而行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真实的”在这里也含有正确、公正的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译“在真理中行走”，指在上帝面前以真实、忠信的方式生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσεις
  choice: 审判
  rationale: 在这一认罪祷告的语境中，指上帝针对罪所作的司法性裁断及处置；“审判”保留原词的正式意味。
- source_word: ἀληθιναί
  choice: 真实的
  rationale: 直接对应希腊语“真实的”；在语境中也含有上帝审判正确、公正的意味，但正文不将其窄化为单纯“公正”。
- source_word: ἐξ ἐμοῦ ποιῆσαι
  choice: 向我施行
  rationale: 该希腊语结构较为生硬；“向我施行”自然表达上帝对多比所采取的行动，又不额外强化为“攻击我”。
- source_word: περὶ τῶν ἁμαρτιῶν μου καὶ τῶν πατέρων μου
  choice: 因我的罪和我祖先的罪
  rationale: περί在此表示所针对的事项或缘由；补出第二个“罪”，使汉语清楚自然。
- source_word: ἐντολάς
  choice: 诫命
  rationale: 这是现代汉语圣经语体中自然、庄重的表达，并保留其盟约和道德分量。
- source_word: ἐπορεύθημεν ἐν ἀληθείᾳ
  choice: 按真理行事
  rationale: 将“行走”的行为隐喻转换为自然汉语“行事”，同时保留ἀλήθεια所含“真理、真实、忠信”的开放幅度。
- source_word: ἐνώπιόν σου
  choice: 在你面前
  rationale: 简洁自然，兼有活在上帝鉴察之下及与上帝相对的关系意味。
theological_decisions:
- issue: 是否将上帝的审判明确译为“公正”而非“真实”
  choice: 真实的
  alternative: 公正的
  rationale: 希腊语为ἀληθιναί，正文保留其直接词义；审判的正当性可由语境体现，不在正文中提前消解其词义张力。
- issue: 祖先的罪是否表示后代继承了祖先的罪责
  choice: 我的罪和我祖先的罪
  alternative: 我们祖先的罪／祖传的罪责
  rationale: 原文并列说“我的罪”和“我祖先的罪”，属于共同体和家族性的认罪表达；译文不额外断定罪责如何继承。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“现在”承接祷告语境；分号呈现上帝审判与人不顺服之间的因果推进。避免生硬照搬希腊语句法，同时保留“真实”与“真理”的词义呼应。
