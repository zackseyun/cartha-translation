base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/003.yaml
  text: Remember me and look upon me[a]; do not punish me for my sins and my errors done in ignorance, and for those of my fathers[c][b], which they committed before you.
translation:
  language: zh_hans
  text: 求你记念我，垂顾我；不要因我的罪、我无知中所犯的过错[a]，以及我祖先[b]在你面前所犯的罪而惩罚我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无知中所犯的过错”指人在不知情、未察觉或没有充分认识的情况下所犯的错，并非仅指普通的疏忽。
    reason: lexical_alternative
  - marker: b
    text: “祖先”原文直译为“父辈”或“列祖”。末句最自然地指祖先所犯的罪；也有人把它较宽泛地理解为概括前面提到的一切罪。
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: “惩罚”所译的希腊词也可表达“追讨”或“按罪施行报应”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητί μου
  choice: 求你记念我
  rationale: 祷告语境中的“记念”不只是回想，也含有求上帝眷念、施恩的意味；这一译法直接、庄重，并保留圣经祷告用语的色彩。
- source_word: ἐπίβλεψον ἐπʼ ἐμέ
  choice: 垂顾我
  rationale: 原文是恳求上帝注目于祈求者。“垂顾”在现代中文中庄重而易懂，也比单纯的“看我”更能表达恳求眷顾之意。
- source_word: μὴ ἐκδίκῃς
  choice: 不要……惩罚我
  rationale: ἐκδικέω可指报复、伸冤或施行惩罚；这里以罪为追讨对象，语境是求上帝不要按罪施罚，因此正文译作“惩罚”，并在脚注保留“追讨”的可能表达。
- source_word: τὰς ἁμαρτίας μου
  choice: 我的罪
  rationale: “罪”准确保留ἁμαρτία的道德和神学分量，也是现代汉语圣经语体中自然的对应词。
- source_word: τοῖς ἀγνοήμασίν μου
  choice: 我无知中所犯的过错
  rationale: ἀγνόημα指因无知、未察觉或并非完全明知而犯的错。“无知中所犯的过错”既呈现非故意或不知情的意味，又不把它弱化为一般失误。
- source_word: τῶν πατέρων μου
  choice: 我祖先
  rationale: πατέρες在这里指历代先人，而非仅指亲生父亲；“祖先”符合现代普通话，并保留群体和世代层面的含义。
- source_word: ἃ ἥμαρτον ἐνώπιόν σου
  choice: 在你面前所犯的罪
  rationale: 将关系从句自然嵌入“我祖先……所犯的罪”，并以“在你面前”保留ἐνώπιόν σου所表达的在上帝鉴察和审判之下犯罪的意味。
theological_decisions:
- issue: 关系从句ἃ ἥμαρτον ἐνώπιόν σου的指涉范围
  choice: 按最自然的句法，将其具体联系于“我祖先”的罪，译为“我祖先在你面前所犯的罪”。
  alternative: 也可较宽泛地理解为概括前面提到的一切罪和无知之过。
  rationale: 复数动词ἥμαρτον最自然地以最近的复数人物“祖先”为主语，而中性复数关系代词ἃ可指省略的“罪”。此译法区分个人之罪与祖先之罪，但脚注说明较宽的概括性理解仍有可能。
- issue: ἐκδικέω在祷告中的司法与报应含义
  choice: 正文译作“惩罚”，表达上帝因罪施行刑罚。
  alternative: 可译作“追讨”或“因……施行报应”。
  rationale: “惩罚”最便于现代读者理解，却不应抹去原词含有追究、公正报偿的语义，因此以脚注保留该层意思，避免把它狭隘地理解为出于私愤的报复。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你记念我，垂顾我”保留原文两个并列祈使句的恳求力度；后半句按自然汉语调整词序，把祖先所犯之罪及其“在你面前”的关系清楚表达出来。
