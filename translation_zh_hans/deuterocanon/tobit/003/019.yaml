base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, as he wills. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: zh_hans
  text: 你要时时称颂主上帝，并向他祈求，使你的道路变得平直[a]，使你一切的路径和谋划都顺利。因为任何民族都没有谋略[b]；惟有主亲自赐下一切美善之物，并照自己的意思，使他所愿意的人降卑。现在，孩子，要记住我的吩咐，不可让它们从你心中被抹去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你的道路成为平直。”希腊文既可侧重道路达到平直的状态，也可按语境理解为道路被修直。
    reason: lexical_alternative
  - marker: b
    text: “任何民族都没有谋略”在希腊文中十分简短，也可能是说，没有任何民族能凭自己拥有可靠的谋略；下文则与此相对，指出主赐下一切美善之物。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: 时时
  rationale: 保留“在一切时候”的持续、周遍意味，同时符合现代汉语表达。
- source_word: εὐλόγει
  choice: 称颂
  rationale: 在以上帝为宾语时，εὐλογέω 表示颂赞、祝颂；“称颂”既贴近圣经语体，也避免现代汉语中“祝福上帝”可能造成的误解。
- source_word: Κύριον τὸν Θεόν
  choice: 主上帝
  rationale: 自然保留两个神圣称号，并以“主”对应 κύριος。
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: 向他祈求
  rationale: 保留祈求的对象和宗教语境；中文无需机械译出“从他那里”。
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: 使你的道路成为平直
  rationale: 保留 γένωνται 的“成为”意味及道路意象，不把其明确解释为外在引导或道德正直。
- source_word: τρίβοι
  choice: 路径
  rationale: 与 ὁδοί“道路”形成近义平行，同时保留两个不同的希腊词。
- source_word: βουλαὶ
  choice: 谋划
  rationale: 此处指人的计划、筹划；“谋划”与后文单数 βουλή 的“谋略”保持词义关联。
- source_word: εὐοδωθῶσιν
  choice: 都顺利
  rationale: 表达事情进展顺遂、取得良好结果的含义，符合中文祈愿语气。
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: 任何民族都没有谋略
  rationale: 紧贴原文简短而突兀的全称否定，不擅自补入“可靠的”或“出于自己”等解释。
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: 赐下一切美善之物
  rationale: 保留主作为赐予者的主动性及 τὰ ἀγαθά 的宽泛范围。
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: 使他所愿意的人降卑
  rationale: 按语境采用人物指向，同时保留“降卑”既可指处境降低、也可含谦卑化的张力。
- source_word: παιδίον
  choice: 孩子
  rationale: 是长辈亲切而郑重的称呼，现代中文自然可懂。
- source_word: τῶν ἐντολῶν μου
  choice: 我的吩咐
  rationale: 此处是父亲对孩子的训诫；“吩咐”保留权威性，又不将其直接等同于神的诫命。
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: 不可让它们从你心里被抹去
  rationale: 保留被动表达和“抹去”的鲜明意象。
theological_decisions:
- issue: 在次经智慧训诫语境中翻译 κύριος
  choice: 主
  alternative: 主人
  rationale: 这里 κύριος 是对上帝的敬称；“主”符合中文圣经传统和现代基督教通行用语。
- issue: 主赐美善并使其所愿意的人降卑的主权表述
  choice: 惟有主亲自赐下一切美善之物，并照自己的意思，使他所愿意的人降卑
  alternative: 主赐一切美善，并使任何他愿意的事物卑微
  rationale: 保留神自由赐予和降卑的并置，不弱化或体系化这一神学张力；同时依上下文将关系代词理解为指人。
- issue: “任何民族都没有谋略”的绝对性
  choice: 保留原文的简短全称否定，并用脚注说明语境可能含义
  alternative: 没有一个民族凭自己能有可靠的谋略
  rationale: 原文表达突兀，补入“凭自己”或“可靠”虽可使逻辑更明确，却会消除真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的训诫语体。“你要”“不可”体现父亲劝诫孩子的口吻；保留“道路—路径”“谋划—谋略”等原文平行与词义呼应。脚注标记均置于所说明的短语之后。
