  text: Seek counsel from every wise person[a], and do not despise any useful counsel.
translation:
  language: zh_hans
  text: 要向每一个明智的人寻求劝告；不要轻视[a]任何有益的劝告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要忽视任何有益的劝告。”
    reason: καταφρονέω可在语境中表示不把某事放在心上或不予理会；“忽视”是较弱的可选译法。
lexical_decisions:
- source_word: συμβουλίαν / συμβουλίας
  choice: 劝告
  rationale: 该名词指为作决定而提出的意见或建议。两处均译作“劝告”，既自然，也保留原文的词语呼应。
- source_word: παρὰ παντὸς φρονίμου
  choice: 向每一个明智的人
  rationale: παρά加属格表示来源；φρόνιμος为名词化形容词，泛指明智、审慎或有见识的人，并不限定为男性。现代汉语用“向……人”与“寻求劝告”搭配自然。
- source_word: ζήτησον
  choice: 寻求
  rationale: 不定过去时命令式表达主动求取；“寻求”准确传达这种积极行动。
- source_word: μὴ καταφρονήσῃς
  choice: 不要轻视
  rationale: καταφρονέω含有蔑视、看不起之意；“轻视”保留了其较强的态度色彩，而不只表示未予理会。
- source_word: χρησίμης
  choice: 有益的
  rationale: 该词在此描述劝告具有益处或实际帮助；“有益的”比单纯“有用的”更符合劝告语境。
theological_decisions:
- issue: φρονίμου所指对象的性别范围
  choice: 明智的人
  alternative: 明智的男人
  rationale: 希腊文使用名词化形容词，语法上泛指具备明智或审慎品质的人，没有使用明确指男性的名词，因此不加入男性限定。
- issue: καταφρονήσῃς的语气强度
  choice: 不要轻视
  alternative: 不要忽视
  rationale: 原词通常包含蔑视或不屑的意味；正文保留这一较强语气，同时在脚注列出较弱但可能的语境表达。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。分号呈现两个并列命令；“每一个”与“任何”分别保留παντός和πάσης的周遍、分配意味。
