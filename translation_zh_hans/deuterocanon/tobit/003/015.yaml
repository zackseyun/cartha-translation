base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/015.yaml
  text: And I have not defiled my name[a], nor the name of my father, in the land of my captivity. I am my father’s only child, and he has no child who will inherit him, nor a near brother, nor does he have a son so that I might keep myself for him as a wife. Already seven have perished from me; why should I live? But if it does not seem good to you to put me to death, command that you look upon me and have mercy on me[c][b], and that I no longer hear reproach.
translation:
  language: zh_hans
  text: 我在被掳之地，没有玷污自己的名，也没有玷污父亲的名。我是父亲唯一的孩子；他再没有孩子可以继承他，也没有近亲弟兄[a]，也没有儿子，好让我为他守身，作他的妻子。[b]我已经失去了七个[c]；我为什么还要活着呢？如果你不以处死我为好，就请下令眷顾我、怜悯我，使我不再听见辱骂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “近亲弟兄”也可理解为“近亲”或“男性近亲”。希腊文直译为“近的弟兄”，这里可能泛指家族中的近亲男子。
    reason: lexical_alternative
  - marker: b
    text: 本句有关“近亲弟兄”“儿子”以及“为他守身作妻子”的希腊文句法较难确定；这里尽量贴近原文，没有断定具体的亲属和婚姻关系。
    reason: textual_difficulty
  - marker: c
    text: 按本书上文，“七个”指她的七个丈夫；本节希腊文只说“七个”。
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐμόλυνα
  choice: 玷污
  rationale: 既保留道德上使名誉受污的分量，也不把含义限定为礼仪性不洁。
- source_word: ὄνομα
  choice: 名
  rationale: 原文两次直说“名”；中文“玷污……的名”也能自然传达本人及家族名誉受损之意。
- source_word: γῇ τῆς αἰχμαλωσίας μου
  choice: 我被掳之地
  rationale: 贴近原文，同时比“我被囚禁的土地”更符合圣经流散处境中的自然中文。
- source_word: μονογενής
  choice: 唯一的孩子
  rationale: 表示父亲唯一的后代；不擅自改成原文未明说的“独生女”。
- source_word: κληρονομήσει αὐτόν
  choice: 继承他
  rationale: 保留原文以“他”为直接宾语的继承表达，不把含义缩窄为只继承财产。
- source_word: ἀδελφὸς ἐγγύς
  choice: 近亲弟兄
  rationale: 兼顾 ἀδελφός 的字面亲属称谓和 ἐγγύς 所表达的近亲关系，并以脚注说明可能的较广含义。
- source_word: συντηρήσω ἐμαυτὴν αὐτῷ γυναῖκα
  choice: 好让我为他守身，作他的妻子
  rationale: “守身”表达为某人保留自己之意；保留“为他……作妻子”的结构，不武断厘清这段困难句法中的确切亲属法律关系。
- source_word: ἀπώλοντό μοι ἑπτά
  choice: 我已经失去了七个
  rationale: 以自然中文表达与格所含的切身丧失感，同时不在正文补入原节未明说的“丈夫”。
- source_word: δοκεῖ σοι
  choice: 你不以……为好
  rationale: 保留“在你看来合宜/美好”的语气，适合向上帝祈祷的庄重语域。
- source_word: ἐπίταξον ἐπιβλέψαι ἐπʼ ἐμὲ καὶ ἐλεῆσαί με
  choice: 请吩咐垂顾我，怜悯我
  rationale: 保留 ἐπίταξον 的“吩咐”及祷告中求神眷顾的传统表达，同时使中文可读。
- source_word: ὀνειδισμόν
  choice: 羞辱的话
  rationale: 在“听见”的搭配中补出“话”，自然表达所听见的辱骂与责难。
theological_decisions:
- issue: 是否在正文明确“七个”是七个丈夫
  choice: 正文只译“七个”，脚注按叙事语境说明是丈夫
  alternative: 我已经失去了七个丈夫
  rationale: 上下文清楚指出所指，但本节希腊文只说“七个”；正文保留原文简略，脚注帮助读者理解。
- issue: 如何处理近亲与婚姻从句的困难句法
  choice: 较贴近地译作“也没有近亲弟兄，也没有儿子，好让我为他守身，作他的妻子”并加注
  alternative: 也没有任何可让我守身嫁给他的男性近亲
  rationale: 希腊文的亲属所指及代词关系不够清楚；不将其改写成单一、确定的婚姻法规，以保留文本真实的张力和歧义。
- issue: “名”是否意译为“名誉”
  choice: 保留“名”
  alternative: 名誉
  rationale: 原文重复 ὄνομα；“名”既保留经文措辞，也能在中文语境中承载个人和家族荣誉之意。
translation_notes:
  register: 采用现代、庄重而可懂的祷告语体。“被掳之地”“垂顾”“怜悯”保留经文庄严感；其余句式尽量使用当代普通读者易懂的表达。脚注标记均置于相关正文之后。
