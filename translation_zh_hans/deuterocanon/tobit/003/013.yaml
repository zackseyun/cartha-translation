  naturalness: 建议以“求你下令，让我脱离尘世”表达祷告中的恳求和原文含蓄的死亡意象。“尘世”是汉语中与“脱离”自然搭配的庄重说法；脚注说明其对应原文“从地上”。“不再听见责难”自然保留ὀνειδισμός所指的非难、羞辱性言语。
  terminology: “下令”在此是对εἰπόν后接不定式这一祈求结构的自然处理，并不把它限定为世俗行政命令。“脱离尘世”保留委婉表达，不直译为“死去”。“责难”比“羞辱”更适合“听见”的搭配，同时涵盖责骂、讥讽和非难。
