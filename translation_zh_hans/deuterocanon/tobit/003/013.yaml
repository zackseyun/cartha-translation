  text: Tell me to release me from the earth[a], so that I may no longer hear reproach.
translation:
  language: zh_hans
  text: 求你下令，让我脱离尘世[a]，不再听见责难。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使我从地上得释放”。或译“使我脱离大地”或“使我离开地上”。这里是含蓄地请求结束地上的生命。
    reason: 说明“尘世”对希腊文“从地上”的惯用表达，并保留原文对死亡的委婉说法及可选译法。
lexical_decisions:
- source_word: εἰπὸν
  choice: 求你发话
  rationale: 这是 λέγω 的不定过去时命令式，向上帝直接祈求。译作“求你发话”既保留“说出命令”的意味，也使现代汉语自然；单译“说”不够完整，译作“命令”则稍显过度明确。
- source_word: ἀπολῦσαί με
  choice: 使我……得释放
  rationale: ἀπολύω 可指释放、使离去或解脱。此处是求死祷告中的委婉表达；“使我得释放”保留其意象，而不直接把原文改写为“使我死去”。
- source_word: ἀπὸ τῆς γῆς
  choice: 从地上
  rationale: γῆ 可指地、土地或大地。这里指离开地上的生命；“从地上”贴近希腊文，并保留其庄重而含蓄的说法。
- source_word: καὶ μὴ ἀκοῦσαί με μηκέτι
  choice: 不再听见
  rationale: μηκέτι 表示从此不再；第二个不定式与前一个并列，表达请求释放后的结果。汉语省去重复主语，意思清楚自然。
- source_word: ὀνειδισμόν
  choice: 羞辱
  rationale: ὀνειδισμός 涵盖责骂、讥讽以及由此带来的羞耻。“羞辱”在“听见”的语境中可指羞辱人的言语，同时保留比“辱骂”更宽的含义。
theological_decisions:
- issue: 祷告中委婉表达死亡的请求
  choice: 使我从地上得释放
  alternative: 使我离开人世／使我死去
  rationale: 希腊文直陈“从地上释放我”，很可能是含蓄地求上帝结束其地上生命。正文保留这个隐喻及其神学张力，不把它改写成更明确的死亡陈述。
- issue: “发话”与“释放”之间的关系
  choice: 发话，使我……得释放
  alternative: 命令释放我
  rationale: εἰπὸν 后接不定式，表达求上帝以话语促成释放。译文既体现神圣话语的施行作用，也不把 λέγω 的语义过度收窄为正式命令。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你发话”传达向上帝恳求的命令式语气；“得释放”与“从地上”保留原文意象，不以宗派性术语解释死亡。脚注标记已在正文中对应出现。
