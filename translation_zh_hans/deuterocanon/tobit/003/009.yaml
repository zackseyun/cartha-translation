base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/009.yaml
  text: Why do you flog us? If they have died[a], go with them! May we never see a son or daughter from you forever.
translation:
  language: zh_hans
  text: “你为什么这样鞭打我们？如果他们死了[a]，你就跟他们去吧！愿我们永远看不到你生儿育女。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你就跟他们去吧”按语境暗指“你也跟他们一起去死吧”。希腊文只说“跟他们去”，所指的是她那些已经死去的丈夫。
    reason: 解释原文含蓄表达中由上下文产生的死亡含义，同时避免在正文中增添“死”字。
lexical_decisions:
- source_word: μαστιγοῖς
  choice: 鞭打
  rationale: 该动词本指用鞭抽打、严厉责打；“鞭打”保留了侮辱性言辞的强烈力度，也紧贴希腊文意象。
- source_word: βάδιζε μετʼ αὐτῶν
  choice: 你就跟他们去吧
  rationale: βάδιζε是表示行走、前去的命令式。上下文暗示要撒拉随已死的丈夫而死，但正文保留原文只说“跟他们去”的含蓄表达。
- source_word: μὴ ἴδωμέν
  choice: 愿我们……看不到
  rationale: μή加不定过去时虚拟式在此表达强烈的负面愿望或咒诅；“愿我们……看不到”自然传达这一语气。
- source_word: σου υἱὸν ἢ θυγατέρα
  choice: 你生儿育女
  rationale: 直译为“你的儿子或女儿”，但语境所指是撒拉所生的后代；“你生儿育女”在现代汉语中自然、明确，同时涵盖儿子和女儿。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该短语表示永久、永不；与否定愿望结合时，“永远看不到”既自然，也保留原文末尾的持续性强调。
- source_word: εἰ ἀπέθαναν
  choice: 他们既然死了
  rationale: εἰ通常可译“如果”；这里丈夫们已经死亡是已知背景，条件句带有以事实为前提的语用色彩，因此译为“既然”更符合汉语表达。
theological_decisions:
- issue: “跟他们去”是否明说为一同去死
  choice: 正文保留“你就跟他们去吧”
  alternative: “你就跟他们一起去死吧”
  rationale: 希腊文仅说“跟他们去”，死亡含义由已死丈夫的语境产生。正文不添加“死”，以保留原文的含蓄性；脚注说明其隐含意义。
- issue: εἰ条件句的语气
  choice: “他们既然死了”
  alternative: “如果他们死了”
  rationale: 上下文将丈夫们的死亡视为已知事实，“既然”表达基于既成事实的讥讽。原文形式上的条件结构仍由脚注所附短语及上下文关系得到体现，无需将其理解为对死亡事实的怀疑。
translation_notes:
  register: 采用现代、庄重而直接的口语化叙事语言。“鞭打”保留责骂的强度；“你生儿育女”比生硬的“看见你的儿子或女儿”更符合普通现代汉语，并准确体现这句恶毒嘲讽针对撒拉没有后代。正文脚注标记[a]已与脚注对应。
