  text: You know, Lord, that I am pure from every sin and from a man,
translation:
  language: zh_hans
  text: 你知道，主啊，我未受任何罪恶玷污，也未曾与男人同房。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译大意为“我是洁净的，远离一切罪恶和男人”。“男人”为单数，原文没有明说具体关系；结合语境，本译文理解为未曾与男人同房，但该简略措辞也可有较宽的“未受男人玷污”之意。
    reason: 说明καθαρά εἰμι ἀπό与ἀνδρός的压缩、不寻常结构，保留其解释空间，并避免“有染”所附带的不正当关系含义。
lexical_decisions:
- source_word: καθαρά εἰμι ἀπό
  choice: 我没有沾染
  rationale: 这一结构表示处于洁净、不受玷污的状态；译为“没有沾染”既保留洁净意象，也符合现代汉语表达。
- source_word: πάσης ἁμαρτίας
  choice: 任何罪
  rationale: πάσης在否定含义的表达中涵盖所有罪，译作“任何罪”自然且完整。
- source_word: ἀνδρός
  choice: 与男人有染
  rationale: ἀνήρ的属格单数可泛指男人；在καθαρά与ἀπό的语境中，重点很可能是未受男性或性关系玷污。此译法使汉语可懂，同时用脚注保留原文异常简略的措辞。
theological_decisions:
- issue: “洁净”是否表示绝对无罪
  choice: 保留说话者“没有沾染任何罪”的自我陈述
  alternative: 弱化为“在这件事上没有犯罪”
  rationale: 希腊文确实说πάσης ἁμαρτίας（任何／一切罪），未限定为某一事件；不应为消除神学张力而擅自缩小范围。
- issue: ἀνδρός所指的关系
  choice: 正文按贞洁语境译为“与男人有染”
  alternative: 直译为“远离男人”或“没有沾染男人”
  rationale: 原文搭配高度压缩，可能涉及与男性的性接触；正文采用自然汉语，但脚注说明直译，以免把潜在歧义完全抹去。
translation_notes:
  register: 采用庄重而自然的祷告语气。“主啊”符合现代汉语呼告习惯；正文避免生硬照搬希腊语结构，脚注则交代其直译和不确定性。
