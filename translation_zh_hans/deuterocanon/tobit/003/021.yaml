review_pass:
  verdict: revise
  source_fidelity: 译文准确对应所给希腊文开头的完整句子，而非题注所称的《多俾亚传》3:21或英文审校轨迹中的句子。条件结构、对上帝的敬畏、离弃罪恶和行蒙悦纳之事均得到保留。惟“你仍有丰盛”把原文不带明确宾语的πολλά处理得稍显抽象且在汉语中不够贴切；改为“你仍拥有许多”更直接保留其开放性。
  naturalness: 整体庄重自然。“不要害怕，我们已经穷了”以逗号分隔原因分句更合现代汉语节奏；“只要”可带有条件充分性或宽松承诺的语感，原文仅为“若／如果”，宜改为“如果”。“他眼中所喜悦的事”比“他眼中喜悦的事”更顺畅。
  terminology: “上帝”“敬畏”“罪恶”及“做他眼中所喜悦的事”均适合现代汉语圣经语域，且不引入教派性释义。
  issues:
  - severity: medium
    issue: 条件连词“只要”强于原文的ἐάν（若、如果）。
    rationale: 原文表达条件，未特别强调“只要满足此一条件即可”。改用“如果”可更中性、准确地保留句法关系。
  - severity: low
    issue: “你仍有丰盛”对ὑπάρχει σοι πολλὰ的表达略抽象。
    rationale: πολλά意为“许多事物／许多”，未指明是财富或属灵福分。“你仍拥有许多”既符合现代汉语，也不擅自补足所指。
  - severity: low
    issue: “他眼中喜悦的事”缺少结构助词，略不自然。
    rationale: “他眼中所喜悦的事”在现代书面普通话中更通顺，并完整传达τὸ ἀρεστόν ἐνώπιον αὐτοῦ。
  revised_text: 孩子，不要害怕，我们已经穷了；如果你敬畏上帝，远离一切罪恶，做他眼中所喜悦的事，你仍拥有许多。[a]
  revised_footnotes:
  - marker: a
    text: 所提供的希腊文开头与题注“Tobit 3:21”及所附英文句子并不对应；本译文依据所提供希腊文的首个完整句子翻译，该句在通行编节中通常列为《多俾亚传》4:21。
    reason: 标明原文、题注与英文审校轨迹之间的实质错位，并说明本译文的实际依据，避免将不相干的英文句子视为本节内容。
  revision_rationale: 保留草稿正确识别出的文本错位及相应脚注。正文仅作三项安全修订：以“如果”准确反映条件句；以“仍拥有许多”保留原文未明说的“许多”而不限定为物质或属灵财富；补入“所”以改善现代汉语表达。
