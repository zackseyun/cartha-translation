  text: And she was utterly grieved, so that she wept.
translation:
  language: zh_hans
  text: 孩子，不要害怕我们已经穷了；只要你敬畏上帝，远离一切罪恶，做他眼中喜悦的事，你仍有丰盛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文开头与题注“Tobit 3:21”及所附英文句子并不对应；本译文依据所提供希腊文的首个完整句子翻译，该句在通行编节中通常列为《多俾亚传》4:21。
    reason: 标明来源与经节编号及英文咨询层之间的实质错位，避免把不相干的英文句子置于希腊文之上。
lexical_decisions:
- source_word: παιδίον
  choice: 孩子
  rationale: 保留亲切的长辈对晚辈称呼，现代汉语自然且不额外限定年龄。
- source_word: ἐπτωχεύσαμεν
  choice: 我们已经穷了
  rationale: 准确表达完成时所呈现的落入贫穷状态。
- source_word: ὑπάρχει σοι πολλὰ
  choice: 你仍有丰盛
  rationale: 保留“有许多、并不匮乏”的开放含义，不擅自限定为物质财富。
- source_word: φοβηθῇς τὸν θεόν
  choice: 敬畏上帝
  rationale: “敬畏”同时涵盖畏惧、尊崇与忠诚，是该宗教语境中自然而稳妥的表达。
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
  choice: 远离一切罪恶
  rationale: 体现主动离开各种罪的含义。
- source_word: ποιήσῃς τὸ ἀρεστὸν ἐνώπιον αὐτοῦ
  choice: 做他眼中喜悦的事
  rationale: 贴近“在他面前做蒙悦纳之事”的原文意象，同时保持现代汉语清晰。
theological_decisions:
- issue: “有许多”所指为何
  choice: 保留为“你仍有丰盛”
  alternative: 译为“你会有许多财富”或“你就十分富足”
  rationale: 希腊文没有明确宾语，不应将其单独收窄为金钱，也不应把条件句改写为必然的物质兴旺应许。
- issue: 敬畏、离罪与行善之间的关系
  choice: 按原文保留条件结构
  alternative: 解释为赚取神的赐福，或弱化为一般性劝勉
  rationale: 原句确有ἐάν引出的条件，但并未说明功德、救恩或因果机制，因此不作教派性扩展。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；句式保留父亲劝勉孩子的温和语气。因原始材料包含多个后续段落且题注失配，本稿仅翻译所给希腊文开头的首个完整句子，并以脚注透明说明。
