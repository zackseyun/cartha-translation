  naturalness: “孩子，不要害怕我们已经穷了”缺少必要停顿，现代汉语中容易误读为“不要害怕已经穷了”。调整语序和标点后，长辈劝勉的语气更自然清楚。
  terminology: “敬畏上帝”“罪恶”及“做他眼中喜悦的事”均符合宗教语境、现代标准汉语和原文措辞，无须改动。
