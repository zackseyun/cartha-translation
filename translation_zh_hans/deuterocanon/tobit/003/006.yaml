base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/006.yaml
  text: And now deal with me according to what is pleasing to you[a]. Command that my spirit be taken up, so that I may be released and become dust. For it is better for me to die than to live, because I have heard false reproaches, and there is great grief within me. Command that I be released now from this distress into the everlasting place[b], and do not turn your face away from me.
translation:
  language: zh_hans
  text: 如今，求你照你所喜悦的待我；下令把我的灵接去，使我得以释放，化为尘土[a]。因为对我来说，死胜于生；我听见了虚假的羞辱，心中满是悲痛。求你下令，使我现在脱离这苦难，进入那永远的所在[b]；不要转脸离开我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“成为土地（大地）”；这里是死亡用语，正文译作“化为尘土”。
    reason: lexical_alternative
  - marker: b
    text: “永远的所在”是对死者所在之处的概括说法；希腊文在这里没有使用更具体的神学术语。
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸ ἀρεστόν σου
  choice: 照你所喜悦的
  rationale: 表达行事符合上帝所喜悦之事或他的旨意；措辞自然，同时保留祷告直接朝向上帝的语气。
- source_word: ἐπίταξον
  choice: 下令
  rationale: 该命令式请求上帝发出具有权柄的命令；“下令”保留原文的直接和庄重。
- source_word: ἀναλαβεῖν τὸ πνεῦμά μου
  choice: 把我的灵接去
  rationale: ἀναλαμβάνω有接上去、带走之意，πνεῦμα直译为“灵”。“接去”在中文死亡语境中自然，也不把“灵”简化为“生命”，或加入原文未明说的完整来世观。
- source_word: ἀπολυθῶ
  choice: 使我得以释放
  rationale: 该词本义为获释或被遣离，在这里委婉指死亡；“释放”保留其隐喻，并与后文同词根的表达相呼应。
- source_word: γένωμαι γῆ
  choice: 化为尘土
  rationale: γῆ字面为“土地、大地”；死亡语境中，“化为尘土”以现代中文自然表达归回物质尘土之意。脚注保留字面译法。
- source_word: λυσιτελεῖ μοι
  choice: 对我来说，死胜于生
  rationale: 该表达意为对某人更有益或更好；结合后面的比较结构，译为“死胜于生”简洁而清楚。
- source_word: ὀνειδισμοὺς ψευδεῖς
  choice: 虚假的辱骂
  rationale: ὀνειδισμός指责辱、辱骂或羞辱，ψευδεῖς说明其虚假；译文保留两个语义要素，不把它解释为更具体的诬告形式。
- source_word: λύπη ἐστὶν πολλὴ ἐν ἐμοί
  choice: 心中满是悲痛
  rationale: 以自然中文表达原文“我里面有极大的忧愁”的内在状态和强烈程度。
- source_word: τῆς ἀνάγκης
  choice: 这苦难
  rationale: ἀνάγκη可指必然、逼迫、困境或患难；本段哀求语境侧重压迫性的痛苦，“苦难”最为贴切。
- source_word: εἰς τὸν αἰώνιον τόπον
  choice: 进入那永远的所在
  rationale: 透明保留“永远的地方”这一宽泛表达，不擅自改成阴间、坟墓或天堂等更具体的神学术语。
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπʼ ἐμοῦ
  choice: 不要转脸离开我
  rationale: 直接保留圣经中“转脸离开”的形象，表达撤回眷顾或不再垂听，却不将比喻改写为解释。
theological_decisions:
- issue: 求死祷告中的人观用语
  choice: 把我的灵接去
  alternative: 取走我的生命；接纳我的灵
  rationale: 原文明确使用πνεῦμα，因此保留“灵”，但“接去”不进一步界定灵在死亡后的状态或去向。
- issue: 死后的目的地
  choice: 那永远的所在
  alternative: 永恒的家；坟墓；阴间
  rationale: 希腊文只说“永远的所在”，并未指明阴间、天堂或其他特定概念；译文保留这种概括性和神学张力。
- issue: “释放”与死亡的关系
  choice: 使我得以释放
  alternative: 使我死去；使我离世
  rationale: 原文以“释放”委婉表达死亡。保留该隐喻，既呈现苦难中的解脱愿望，也不把表达压缩成单纯的死亡陈述。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”补足中文祈求语气；分号保留原文层层推进的哀求结构。用“灵”“释放”“转脸”等词保存原文意象，同时避免过度古雅或宗派化措辞。
