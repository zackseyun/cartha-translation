  yaml_path: translation/deuterocanon/tobit/003/011.yaml
  text: And she prayed by the window and said[a], “Blessed are you, Lord my God, and blessed is your holy and honored name forever; let all your works bless you forever.”
translation:
  language: zh_hans
  text: 她在窗前祈祷说：“主，我的上帝，你是当受称颂的！你圣洁而尊贵的名永远当受称颂；愿你所有的作为都永远称颂你。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称颂你”也可译作“赞美你”。希腊文在本节前后使用同一“称颂”词族。
    reason: 保留词汇呼应，同时说明符合语境的自然译法。
lexical_decisions:
- source_word: ἐδεήθη
  choice: 祈祷
  rationale: 该动词表示向神恳切祈求；在此祷告场景中，“祈祷”自然清楚，也不额外强化绝望语气。
- source_word: πρὸς τῇ θυρίδι
  choice: 在窗边
  rationale: θυρίς指窗户或开口；此处介词结构最自然地表示所在位置或邻近关系。
- source_word: Εὐλογητός / εὐλογητόν / εὐλογησάτωσαν
  choice: 当受称颂／称颂
  rationale: 统一采用“称颂”保留希腊文前后同一词族的呼应：神及其名当受称颂，神的一切作为也称颂他。
- source_word: Κύριε ὁ θεός μου
  choice: 主，我的上帝
  rationale: 这是对神的直接呼语；“主”符合κύριος的祷告语境，“我的上帝”准确表达所属关系。
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔντιμον
  choice: 你圣洁而尊贵的名
  rationale: ἔντιμος可表示受尊重、尊贵或珍贵；“尊贵”与“圣洁”搭配自然，并保留名字所具有的尊荣。
- source_word: εἰς τοὺς αἰῶνας / εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 两处惯用语都表示持续无尽的时间；同译为“永远”可保留祷文的平行结构。
- source_word: πάντα τὰ ἔργα σου
  choice: 你一切的作为
  rationale: ἔργα的范围可包括神的行动、工作或所造之物；“作为”保持原文的宽泛含义，不将其限定为受造物。
theological_decisions:
- issue: 对神使用的κύριος
  choice: 主
  alternative: 主人
  rationale: 本句是直接向神献上的祷告；“主”是现代汉语圣经语体中自然且准确的称呼，也不引入额外解释。
- issue: 受造界对神的εὐλογεῖν
  choice: 愿你一切的作为永远称颂你
  alternative: 愿你一切的作为永远赞美你
  rationale: “称颂”保留本节祝颂词族的词汇连贯；“赞美”更直白地表达此处神的作为对神所作之事，故列作脚注译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“当受称颂”保留赞美诗式语气；句法略作汉语化，使呼语与平行分句清晰。所给希腊文本在Εὐλογητὸς εἶ之后重复εἶ，判断为机械性重字，正文不重复翻译。
