  to: 现在，我向你说明[b]那十他连得的银子[a]；我把它存放在玛代的拉吉，交由加布里亚斯的儿子加巴埃勒保管。
  rationale: 修订以“向你说明”在现代汉语中自然地表达ἐπιδεικνύω的语义范围，同时借脚注保留“展示/指出”的开放性；恢复父名的较准确音译；并重组句子，使“存放于拉吉”及“交加巴埃勒保管”这两项原文信息清晰相连。
