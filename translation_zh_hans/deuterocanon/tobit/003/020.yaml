  yaml_path: translation/deuterocanon/tobit/003/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a][b].
translation:
  language: zh_hans
  text: 现在，我向你说明[b]那十他连得的银子[a]；我把它存放在玛代的拉吉，交由加布里亚斯的儿子加巴埃勒保管。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代的重量兼货币单位；其具体重量因时代和地区而异。
    reason: historical_measure
  - marker: b
    text: “向你说明”也可译作“向你指出”或“给你看”。希腊文动词可表示实际展示，也可表示使人注意或知道某事。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: 把……的事告诉你
  rationale: 该动词可指“展示、指出、使人知道”。这里所说的银子远存于玛代，不大可能是当面出示，故按语境译为“把……的事告诉你”，同时以脚注保留“给你看／向你指出”的可能性。
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: 那十他连得银子
  rationale: 保留古代重量兼货币单位“他连得”，不换算为现代单位，以免制造并不存在的精确对应。
- source_word: παρεθέμην
  choice: 存放……交给……保管
  rationale: 中间语态在此表示把财物托付给别人保管；这一译法既表达存放行为，也明确其保管性质。
- source_word: Γαβαήλῳ
  choice: 加巴埃勒
  rationale: 按希腊文人名音译，并采用适合现代汉语读者辨读的形式。
- source_word: τῷ τοῦ Γαβρεία
  choice: 加巴利的儿子
  rationale: 定冠词加属格人名在此是父名结构，按自然汉语明译为“……的儿子”。
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: 在玛代的拉吉
  rationale: 将古代地名分别音译为“玛代”和“拉吉”，并自然表达拉吉位于玛代的地域关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。句式略作调整，以“那是……”清楚连接银子、存放地点与受托保管人；保留古代计量单位和专名，不作现代化换算。
