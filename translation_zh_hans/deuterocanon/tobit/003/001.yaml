base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/001.yaml
  text: And being grieved[a], I wept, and I prayed in anguish, saying,
translation:
  language: zh_hans
  text: 我悲伤[a]，便哭泣，并在痛苦中祷告说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本此处较简短：“我悲伤，便哭泣，并在痛苦中祷告说。”一种较长的闪语形式传统在随后几行中大幅扩展了这段哀诉；这一开头在希腊文本中有明确依据。
    reason: textual_variant
lexical_decisions:
- source_word: λυπηθεὶς
  choice: 我心里悲伤
  rationale: 该不定过去时被动分词表示陷入悲伤、痛苦的状态；译作“我心里悲伤”既贴近原意，也符合现代汉语叙事表达，并与下文的哭泣自然衔接。
- source_word: ἔκλαυσα
  choice: 就哭了
  rationale: κλαίω明确指哭泣；“就”自然呈现分词所述状态与主要动作之间的承接关系，不额外加入“痛哭”等原文没有明说的强度。
- source_word: προσηυξάμην
  choice: 祷告
  rationale: προσεύχομαι通常直接译作“祷告”；不另加“恳切”等强化词，因为强烈情绪已由μετʼ ὀδύνης表达。
- source_word: μετʼ ὀδύνης
  choice: 在痛苦中
  rationale: ὀδύνη表示深切的痛苦或悲苦。“在痛苦中”自然、庄重，并保留其较强的情绪力度，且不与前面的“悲伤”完全重复。
- source_word: λέγων
  choice: 说
  rationale: 该分词引出祷告内容；汉语以“祷告说”简洁自然地表达这一功能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我心里悲伤，就哭了”避免生硬直译希腊语分词，同时保留悲伤先于并引发哭泣的关系；句末用冒号引出下一节的祷告内容。
