  text: And the prayer of both was heard before the Glory[a].
translation:
  language: zh_hans
  text: 两人的祷告在那荣耀面前蒙垂听了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在那荣耀面前”也可译为“在上帝的荣耀面前”或“在那荣耀的临在中”。希腊原文此处没有明确提到上帝。
    reason: 说明 δόξης 的敬虔用法，并保留原文没有明说“上帝”所产生的翻译张力。
lexical_decisions:
- source_word: εἰσηκούσθη
  choice: 蒙了垂听
  rationale: 该动词的被动形式用于祷告时，常指祷告受到有利的听取。“蒙了垂听”符合现代汉语的敬虔语体，同时没有像“得了应允”那样明确加入已经获得答复的较强含义。
- source_word: προσευχὴ
  choice: 祷告
  rationale: 这是该词在本句中最直接、自然的意思；不必缩窄为“祈求”。
- source_word: ἀμφοτέρων
  choice: 两人的
  rationale: 该属格指上下文中的两个人。“两人的”简洁自然，也保留原文将二人的祷告合称为单数“祷告”的表达。
- source_word: ἐνώπιον
  choice: 在……面前
  rationale: 该介词表示处于某者面前或临在之中；“在……面前”贴近原文且符合汉语表达。
- source_word: τῆς δόξης
  choice: 荣耀
  rationale: 原文有定冠词，并以敬畏而含蓄的方式指向上帝荣耀的临在。译作“荣耀”保留原文措辞和神学意蕴，不在正文中补出原文未明说的“上帝”。
theological_decisions:
- issue: 是否把 δόξης 明译为上帝的荣耀或上帝荣耀的临在
  choice: 荣耀
  alternative: 上帝的荣耀；上帝荣耀的临在
  rationale: 上下文清楚表明所指与上帝有关，但希腊原文在本分句中并未明确写出“上帝”。正文保留“荣耀”，以维持原文敬虔的间接表达；脚注说明可能的理解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“蒙了垂听”适合祷告语境；“荣耀面前”有意保留原文简洁而敬畏的间接称谓。
