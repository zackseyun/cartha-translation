  yaml_path: translation/deuterocanon/tobit/004/008.yaml
  text: As much as you have[a], according to your abundance, give alms from it; and if you have little, do not be afraid to give alms according to that little.
translation:
  language: zh_hans
  text: 你有多少财物，就要按多少从中施舍；你若财物不多，也不要怕照着这不多的施舍。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς σοι ὑπάρχει
  choice: 你有多少
  rationale: 该短语以受话者实际拥有的财物为衡量基础；“你有多少”简洁自然，也保留原文与个人所有相对应的意思。
- source_word: κατὰ τὸ πλῆθος
  choice: 按你所有的丰厚程度
  rationale: κατά加宾格在此表示比例，πλῆθος指财物数量多、较为丰厚；此译法明确表达按富足程度施舍，而不把它绝对化为固定数额。
- source_word: ποίησον ἐξ αὐτῶν ἐλεημοσύνην
  choice: 从中施舍
  rationale: ἐλεημοσύνη在《多俾亚传》的犹太希腊语语境中具体指向穷乏者施舍；ἐξ αὐτῶν表示从所拥有的财物中拿出一部分。
- source_word: ἐὰν ὀλίγον σοι ὑπάρχῃ
  choice: 你若所有不多
  rationale: 保留与前半节财物丰厚的对照，同时用现代汉语表达财力有限。
- source_word: κατὰ τὸ ὀλίγον
  choice: 按这不多的
  rationale: 再次保留κατά所表达的比例意义，并以“这不多的”呼应前句“所有不多”。
- source_word: μὴ φοβοῦ ποιεῖν ἐλεημοσύνην
  choice: 也不要怕……施舍
  rationale: φοβοῦ本义为“怕”，在此劝人即使财物不多也不要因顾虑而退缩；译文保留其直接语气，没有改释为单纯的“不要犹豫”。
theological_decisions:
- issue: ἐλεημοσύνη的具体含义
  choice: 施舍
  alternative: 行善；怜悯人
  rationale: 本书中该词是重要伦理用语，具体指以财物周济穷乏者，而非泛指一切善行或内在怜悯；“施舍”既准确又符合现代汉语。
- issue: 施舍数额的衡量方式
  choice: 按个人实际所有的丰厚或有限程度
  alternative: 规定固定数额，或要求交出全部所有
  rationale: 两次κατά都表达比例关系，原文把丰厚与缺乏并列，强调按所有而行；译文不额外引入固定比例或全数舍弃的教义性解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“施舍”作为全节关键词重复出现，以保持原文ἐλεημοσύνη的呼应；“不要怕”保留劝诫语气和φοβοῦ的字面力度。
