  text: Seek counsel from every wise man, and do not despise any useful advice.
translation:
  language: zh_hans
  text: 要向每一位有智慧的人寻求劝告，也不要轻看任何有益的劝告[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“每一个有益的劝告。”希腊原文在本节两处使用同一个表示“劝告、意见”的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβουλίαν
  choice: 求教
  rationale: 该名词指所寻求的劝告或指点；结合 ζήτησον，在现代汉语中译作“求教”自然、简洁，并保留主动寻求指导的意思。
- source_word: παρὰ παντὸς φρονίμου
  choice: 向每一个有智慧的人
  rationale: παρά 加属格表示来源；φρόνιμος 指明智、审慎的人。译文保留 παντός 的逐一涵盖意味，同时用现代汉语自然表达其泛指作用。
- source_word: ζήτησον
  choice: 要……求教
  rationale: 命令式要求主动寻求；“要……求教”既传达劝诫语气，也比单纯“询问”更能表现寻求明智意见。
- source_word: μὴ καταφρονήσῃς
  choice: 不要轻看
  rationale: καταφρονέω 可指轻视、藐视；“轻看”保留其负面评价力度，又适合劝告这一宾语。
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  choice: 任何有益的劝告
  rationale: χρήσιμος 表示有用、有益；在否定命令中，“任何”自然传达 πάσης 的周遍意义。再次译作“劝告”，体现原文重复 συμβουλία 词族的特点。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧训诲语体。“每一个有智慧的人”保留原文单数泛指和 παντός 的涵盖意味；全句以“要……也不要……”呈现并列劝诫。
