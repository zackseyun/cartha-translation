base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/005.yaml
  text: All the days[a], child, remember the Lord our God. Do not desire to transgress his commandments. Practice righteousness all the days of your life, and do not walk in the ways of unrighteousness.
translation:
  language: zh_hans
  text: 孩子，你一生的每一天都要记念主——我们的上帝；不要存心违背他的诫命。你一生的每一天都要行义[a]，不可走不义的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行义”也可译作“行公义”或“实行正义”；相应地，“不义的道路”也可理解为“不公的道路”。希腊词既可指个人道德，也可包含社会伦理层面的正义与不义。
    reason: 保留 δικαιοσύνη／ἀδικία 在个人道德与社会公正之间的语义幅度。
lexical_decisions:
- source_word: μνημόνευε
  choice: 记念
  rationale: 现在时命令语气表示持续不断地记得并以此为念；“记念”自然庄重，也保留其宗教和伦理意味。
- source_word: παιδίον
  choice: 孩子
  rationale: 保留呼格中亲切的称呼，不添加希腊文未明说的“我的”，也不把性别限定为“儿子”。
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: 主我们的上帝
  rationale: 贴近希腊文的称号结构，并以现代中文可理解的方式保留“主”与“我们的上帝”。
- source_word: μὴ θελήσῃς παραβῆναι
  choice: 不要存心违背
  rationale: “存心”保留 θελήσῃς 的意愿成分，“违背”表达 παραβῆναι，避免弱化为单纯禁止行为。
- source_word: ἐντολάς
  choice: 诫命
  rationale: 符合宗教伦理语境，也是现代中文圣经语体中清楚而庄重的表达。
- source_word: δικαιοσύνην ποίει
  choice: 行正义
  rationale: “行”保留 ποιεῖν 的实践性；“正义”可涵盖个人正直与社会公义，并与“不义”构成清晰对应。
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: 你一生的日子都
  rationale: 保留原文“所有日子”的重复强调，比单说“一生”更贴近原文形式。
- source_word: μὴ πορευθῇς
  choice: 不可走
  rationale: 保留“行走”的行为隐喻，并与后面的“道路”自然搭配。
- source_word: ταῖς ὁδοῖς τῆς ἀδικίας
  choice: 不义的道路
  rationale: 保留复数道路意象，并使 δικαιοσύνη／ἀδικία 的词义对立在中文中可见。
theological_decisions:
- issue: δικαιοσύνη／ἀδικία这一伦理词对的译法
  choice: 正义／不义
  alternative: 公义／不义；正直／邪恶
  rationale: 希腊词兼有个人道德和社会伦理层面。“正义／不义”较自然地保留宽广含义；脚注说明也可理解为“行公义”，避免把词义限定于某一层面。
- issue: μὴ θελήσῃς所表达的意愿因素
  choice: 不要存心违背
  alternative: 不要违背
  rationale: 原文不只禁止违背诫命的行为，也明确触及人的意愿；译出“存心”可保留这一伦理张力，而不将其扩展为特定教义主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“记念”“诫命”“道路”保留适度的经文语体；句法力求自然，同时保留原文两次“所有日子”的强调及“走道路”的隐喻。
