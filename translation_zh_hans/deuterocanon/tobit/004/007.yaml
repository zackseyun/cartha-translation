base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/007.yaml
  text: From what you have[a], give alms, and do not let your eye be grudging when you give alms. Do not turn your face away from any poor person[c][b], and the face of God will not be turned away from you.
translation:
  language: zh_hans
  text: 你要从自己所有的财物中拿出来施舍；施舍时，不要让你的眼目显出吝惜。不要转脸避开任何穷人；上帝的脸也绝不会向你转开[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的脸”也可理解为“上帝的同在”或“上帝的眷顾”；希腊文直译为“上帝的脸”，与前一句“你的脸”彼此呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν ὑπαρχόντων σοι
  choice: 从自己所有的拿出来
  rationale: 指从自己现有的财物或能力中拿出一部分；此译自然，也保留“从……中”的结构。
- source_word: ποίει ἐλεημοσύνην
  choice: 施舍
  rationale: 此处指向有需要的人作实际的慈善周济，而不只是内心怜悯。
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: 不要让你的眼吝惜
  rationale: 保留希腊文“眼”的身体意象，同时用“吝惜”表达施舍时不舍、悭吝的态度。
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: 施舍时
  rationale: 该不定式结构在此具有时间意义，译法简洁自然。
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου
  choice: 不要转脸避开
  rationale: 保留“脸”的明确意象，并与下句“上帝的脸”形成修辞呼应。
- source_word: ἀπὸ παντὸς πτωχοῦ
  choice: 任何穷人
  rationale: 希腊文为阳性单数，但在此具有逐一概括的泛指作用；现代汉语“任何穷人”准确而自然，并不限定性别。
- source_word: οὐ μὴ ἀποστραφῇ
  choice: 也绝不会转离
  rationale: 用“绝不会”体现 οὐ μή 的加强否定，并保留与前句“转脸”的对应。
- source_word: τὸ πρόσωπον τοῦ θεοῦ
  choice: 上帝的脸
  rationale: 按字面保留神人同用“脸”的平行表达，不解释性地改成“同在”或“眷顾”。
theological_decisions:
- issue: 末句对上帝使用拟人化的“脸”
  choice: 上帝的脸
  alternative: 上帝的同在／眷顾
  rationale: 原文前后均用 πρόσωπον；保留“脸”可维持刻意的对称和神学张力，避免提前解释其含义。
- issue: καί 所连接的末句关系
  choice: 这样，上帝的脸也绝不会转离你
  alternative: 并且，上帝的脸绝不会转离你
  rationale: 上下句呈现行为与结果或对应关系；“这样”在汉语中自然传达这种关联，但不把它扩展成完整的功德论陈述。
- issue: πτωχοῦ 的语法性别与泛指范围
  choice: 任何穷人
  alternative: 任何贫穷的男子
  rationale: 阳性单数在该结构中具有泛指、分配性作用；汉语“穷人”既忠实于语义，也不加入原文并未明确要求的男性限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“施舍”准确表达具体周济行为；保留“眼”“脸”的原文意象与前后呼应。脚注仅说明“上帝的脸”可能包含的意义，不在正文中消解其拟人表达。
