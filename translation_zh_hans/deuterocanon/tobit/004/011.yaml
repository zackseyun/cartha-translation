  yaml_path: translation/deuterocanon/tobit/004/011.yaml
  text: For almsgiving is a good gift for all who do it before the Most High[a].
translation:
  language: zh_hans
  text: 因为，施舍对于所有在至高者面前施舍的人，都是一份美好的礼物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“美好的供物”；希腊语 δῶρον 通常可指礼物，在某些语境中也可指供物。
    reason: 词义存在真实的翻译选择，正文的“礼物”不应掩盖“供物”这一可能含义。
lexical_decisions:
- source_word: δῶρον
  choice: 礼物
  rationale: 该词通常指“礼物”，也可在某些语境中指献给神的“供物”。正文采用“礼物”，既保留宽泛含义，也避免擅自加入祭祀色彩。
- source_word: ἐλεημοσύνη
  choice: 施舍
  rationale: 这里特指向贫困者给予财物的善行；“施舍”在现代汉语中简洁、具体，比宽泛的“慈善”或“怜悯行为”更贴近原意。
- source_word: πᾶσι τοῖς ποιοῦσιν αὐτήν
  choice: 对于所有……这样行的人
  rationale: 直译原文“所有做这事的人”，并以“这样行”自然指回“施舍”，保留实际践行的含义。
- source_word: ἐνώπιον τοῦ ὑψίστου
  choice: 在至高者面前
  rationale: 保留原文空间—关系性的表达，可表示处于至高者面前或在他鉴察之下，而不把含义缩窄为单纯的内心动机。
- source_word: τοῦ ὑψίστου
  choice: 至高者
  rationale: 这是犹太希腊文中常见的神圣称号；“至高者”庄重自然，并保留称号形式。
theological_decisions:
- issue: 如何理解施舍是“美好的礼物”
  choice: 直接肯定施舍对践行者而言是一份美好的礼物，不进一步说明其功效。
  alternative: 将“礼物”明确解释为属天奖赏、救恩功德或献给神的祭物。
  rationale: 希腊文只陈述施舍是美好的δῶρον；译文应保留这一积极的道德与神学评价，同时避免加入经文本身没有明说的功德论、救恩论或祭祀含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“对于所有……的人，都是……”使受益关系清楚；“在至高者面前”紧接践行者，贴近希腊语结构。
