base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/003.yaml
  text: And calling him[a], he said, “Child, if I die, bury me, and do not neglect your mother; honor her all the days of your life,”
translation:
  language: zh_hans
  text: 他把儿子叫来，对他说：“孩子，我若死了，你要埋葬我；不要忽视你的母亲[a]，在你一生的日子里，都要尊敬她。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忽视”也可译作“不顾”或“不理会”。平行的闪族文本传统语气更强，近于“不要离弃她”。
    reason: 说明 μὴ ὑπερίδῃς 的词义范围，并区分希腊正文与平行传统的较强措辞。
lexical_decisions:
- source_word: καλέσας αὐτὸν
  choice: 他把儿子叫来
  rationale: 分词结构引出多比的嘱咐。代词所指从上下文可知是他的儿子；译出“儿子”使现代汉语叙事自然，同时没有把称呼 Παιδίον 窄化。
- source_word: Παιδίον
  choice: 孩子
  rationale: 这是带亲情色彩的呼格。“孩子”保留其亲昵和家庭语境，也不增添希腊文没有明说的“我的”。
- source_word: ἐὰν ἀποθάνω
  choice: 我若死了
  rationale: ἐάν 加虚拟式表达条件；“若”保留“如果”而非“到了……时候”的条件意味，并符合庄重的临终嘱咐语体。
- source_word: θάψον με
  choice: 你要埋葬我
  rationale: 直接传达命令式的普通含义；补出“你要”使汉语中的嘱咐语气清楚。
- source_word: μὴ ὑπερίδῃς
  choice: 不要忽视
  rationale: ὑπεροράω 可指不予理会、轻忽或不顾。“忽视”保留希腊词的语义范围，不在正文中强化为平行闪族传统的“遗弃”。
- source_word: τίμα αὐτήν
  choice: 要尊敬她
  rationale: “尊敬”自然表达持续看重并恭敬对待母亲的伦理要求，也与现代汉语中孝敬父母的用语相近而不额外扩充含义。
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: 你一生的日子都
  rationale: 较贴近原文“你生命中的所有日子”，保留其庄重和全面性，同时在现代汉语中通顺。
theological_decisions:
- issue: 较长的平行闪族传统是否应扩充希腊正文
  choice: 正文只翻译所给 Swete 希腊文本，平行传统仅用于印证伦理语气。
  alternative: 加入平行传统中“不要离弃她”等较完整的嘱咐，或将 μὴ ὑπερίδῃς 直接译为“不要遗弃”。
  rationale: 本节的首要文本依据是希腊文；所提供的希伯来文是从亚兰文手稿回译的近代间接见证，不能作为希腊正文的底本来补入其中没有的内容。
- issue: 死亡条件句的确定程度
  choice: 译为“我若死了”，保留形式上的条件性。
  alternative: 译为“我死后”或“我死的时候”，将其理解为确定将发生的临终安排。
  rationale: 原文 ἐὰν ἀποθάνω 在语法上是条件表达；即使语境近似临终嘱托，也不宜在翻译中消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的家庭嘱咐语体。正文保持短句和命令语气；“孩子”体现亲情，“我若死了”保留希腊文的条件形式。脚注标记 [a] 已置于相关短语之后。
