base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, just as he pleases. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: zh_hans
  text: 你要时时称颂主上帝，并向他祈求，使你所走的道路正直，使你一切的路径和谋划都顺利。[a] 因为没有一个民族拥有谋略；主亲自赐下一切美善。他愿意使谁降卑，就使谁降卑，正如他所愿。[b] 现在，孩子，要牢记我的吩咐，不要让它们从你心中被抹去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谋划”也可译作“计策”或“谋略”。希腊词 βουλαί 可指计划、意图或商议所得的计策。
    reason: lexical_alternative
  - marker: b
    text: “没有一个民族拥有谋略”在希腊原文中语意突兀；它可能是说，没有任何民族自身拥有终极的谋略，与下文主赐美善并按己意使人降卑形成对照。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: 时时
  rationale: 自然表达在任何时候、始终如此的全面时间含义。
- source_word: εὐλόγει
  choice: 称颂
  rationale: 保留对上帝说好话、颂赞他的圣经语义；比单用“祝福”更符合现代汉语中人对上帝的表达。
- source_word: Κύριον τὸν Θεόν
  choice: 主上帝
  rationale: 忠实呈现原文并列的两个称号，不增添原文没有的“你的”。
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: 向他祈求
  rationale: 清楚表达祈求的对象以及人对上帝的倚赖，符合语境和现代汉语习惯。
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: 使你的道路正直
  rationale: 保留“道路正直”的比喻，不将其解释性改写为抽象的“行为端正”或“得到引导”。
- source_word: τρίβοι
  choice: 路径
  rationale: 与“道路”形成原文所有的近义平行，并保留道路意象。
- source_word: βουλαὶ
  choice: 谋划
  rationale: 在第一处指实际的打算或筹划；“谋划”兼具清晰度与庄重感。
- source_word: εὐοδωθῶσιν
  choice: 都顺利
  rationale: 自然传达进展顺遂、获得成功的含义，并与路径和谋划都能搭配。
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: 没有一个民族拥有谋略
  rationale: 保留原文突兀而绝对的措辞，不擅自弱化为“人的谋略并不可靠”。
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: 赐下一切美善
  rationale: “赐下”体现上帝是给予者，“一切美善”既可涵盖美好的事物，也保留较概括的表达。
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: 他愿意使谁降卑，就使谁降卑
  rationale: 按上下文将关系表达理解为指人，清楚保留主按己意使人降卑的强烈陈述。
- source_word: παιδίον
  choice: 孩子
  rationale: 保留亲昵的称呼，不添加原文未明说的“我的”，也不限定为“儿子”。
- source_word: τῶν ἐντολῶν μου
  choice: 我的吩咐
  rationale: 此处是父亲对孩子的训诲；“吩咐”准确而自然，也避免让读者误以为说话者把自己的话等同于上帝的诫命。
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: 不要让它们从你心中被抹去
  rationale: 保留“从心中抹去”的鲜明意象及原文的被动形式。
theological_decisions:
- issue: κύριος作为上帝称号的译法
  choice: 主
  alternative: 主人
  rationale: 此处明确指上帝；“主”是准确、庄重且通行的圣经称号。
- issue: 民族没有谋略与主权能之间的强烈对照
  choice: 保留“没有一个民族拥有谋略”的绝对说法，并以“主却亲自”呈现对照
  alternative: 解释为“没有一个民族凭自己拥有终极谋略”或弱化为“人的谋略并不可靠”
  rationale: 原文陈述突兀而强烈，译文不应为消除神学张力而补入限定语或削弱其力度。
- issue: 主按己意使人降卑
  choice: 他愿意使谁降卑，就照自己的意思使谁降卑
  alternative: 上帝有时使人谦卑
  rationale: 保留θέλῃ与βούλεται对上帝意愿的重复强调，不将其软化为一般性的劝诫或品格塑造。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“道路—路径”保留原文的平行意象；“谋略—谋划”适度复现同根词义而避免中文机械重复。经文保留上帝主权与人的谋略之间未获解释的张力。
