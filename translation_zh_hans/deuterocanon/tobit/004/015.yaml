base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/015.yaml
  text: And what you hate[a], do to no one. Do not drink wine to drunkenness, and do not let drunkenness go with you on your way.
translation:
  language: zh_hans
  text: 你所憎恶的事[a]，不要加在任何人身上。不要喝酒至醉；在你所走的路上，也不要让醉酒与你同行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对你可憎的事，不要加在任何人身上。”
    reason: 保留 ὃ μισεῖς 可按主动的“你所憎恶的”或较状态性的“对你可憎的”理解的表达差异。
lexical_decisions:
- source_word: ὃ μισεῖς
  choice: 你所憎恶的事
  rationale: 关系从句本身宽泛而具箴言色彩；“你所憎恶的事”保留第二人称单数和直接的情感动词，不把对象过度抽象化。
- source_word: μηδενὶ ποίησης
  choice: 不要对任何人做
  rationale: μηδενὶ 表示普遍否定的对象，ποίησης 用日常而有伦理力度的“做”来表达；中文改用“不要……任何人”自然呈现原文禁令。
- source_word: οἶνον εἰς μέθην μὴ πίῃς
  choice: 不要喝酒以致醉倒
  rationale: εἰς μέθην 表示结果或程度；“以致醉倒”明确保留醉酒这一焦点，同时比生硬的“喝到醉酒”更符合现代汉语。
- source_word: μὴ πορευθήτω μετὰ σοῦ μέθη
  choice: 不要让醉意与你同行
  rationale: 保留原文将 μέθη 人格化、视为同行者的意象；“醉意”在中文中比重复“醉酒”更适合充当同行的拟人主体。
- source_word: ἐν τῇ ὁδῷ σου
  choice: 在你所走的路上
  rationale: 兼顾实际行路和人生道路的可能含义，不将原文隐喻单一化为“生活中”。
theological_decisions:
- issue: 消极互惠伦理格言的措辞
  choice: 你所憎恶的事，不要对任何人做。
  alternative: 你认为可憎的事，不要加在任何人身上。
  rationale: 所选译法紧贴 ὃ μισεῖς 的关系从句结构，并保留格言的广泛适用性；备选译法能凸显“令人厌恶”的性质及施加于人的意味，故收入脚注而不在正文中替原文作进一步解释。
- issue: 醉酒同行的拟人意象
  choice: 不要让醉意与你同行
  alternative: 不要一路沉醉而行
  rationale: 原文用第三人称命令式使“醉酒”成为与人同行的主体；正文保留这一拟人化张力，避免仅将其解释为一般性的节制劝告。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。首句简洁如箴言；后半保留“路”与“同行”的连续意象。正文脚注标记置于首句之后。
