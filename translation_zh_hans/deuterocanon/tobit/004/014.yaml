base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/014.yaml
  text: Do not let the wages of any man who works for you stay overnight with you, but pay him at once. If you serve God, it will be repaid to you. Watch yourself, child, in all your works, and be disciplined in all your conduct.
translation:
  language: zh_hans
  text: 凡为你做工的人，不可让他的工钱在你那里留到过夜，却要立即付给他。你若服侍上帝，就必得到报偿。孩子，你在一切所做的事上都要留心自己；在你一切的行事为人上，都要受过教导。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθὸς παντὸς ἀνθρώπου ὃς ἐὰν ἐργάσηται παρὰ σοὶ
  choice: 凡为你做工的人……他的工钱
  rationale: παντὸς ἀνθρώπου在这里泛指任何受雇做工的人；用“凡……的人”自然表达全称，不必限定为男性。παρὰ σοὶ按语境译为“为你”。
- source_word: μὴ αὐλισθήτω
  choice: 不可……留到过夜
  rationale: αὐλίζομαι本义涉及留宿、过夜；此处主语是工钱，意为不可拖欠至次日。
- source_word: ἀπόδος αὐτῷ παραυτίκα
  choice: 要立即付给他
  rationale: ἀπόδος表示付还应得之物，παραυτίκα强调当下、立即。
- source_word: ἐὰν δουλεύσῃς τῷ θεῷ
  choice: 你若服侍上帝
  rationale: δουλεύω带有作为仆人事奉、服侍之意；保留条件句，不将其解释为特定礼仪或宗派概念。
- source_word: ἀποδοθήσεταί σοι
  choice: 就必得到报偿
  rationale: 希腊文为无主语的被动表达，未明说报偿者及具体所报之物；译文保留这种开放性。
- source_word: πρόσεχε σεαυτῷ
  choice: 要谨慎自守
  rationale: 表达留意自己、警醒约束自己的含义，较单纯“当心”更适合伦理劝诫语境。
- source_word: ἴσθι πεπαιδευμένος
  choice: 要有教养
  rationale: πεπαιδευμένος可指受过管教、训练而有修养；“有教养”保留其品格养成含义，同时符合现代汉语。
- source_word: ἐν πάσῃ ἀναστροφῇ σου
  choice: 在你一切的行为上
  rationale: ἀναστροφή指生活方式、行事为人；此处用“行为”简明涵盖日常品行。
theological_decisions:
- issue: 报偿的施予者和性质
  choice: 采用“就必得到报偿”，不补出施予者或报偿内容
  alternative: “上帝就必报偿你”或“你就必从上帝得到报偿”
  rationale: 原文ἀποδοθήσεταί σοι是神学被动式的可能性很高，但语法上没有明说主语；不补足可保存原文的含蓄与张力。
- issue: 服侍上帝与报偿之间的关系
  choice: 保留“若……就……”的条件结构
  alternative: 改写为因果保证或功德交换
  rationale: 原文明确使用ἐάν条件句；不把它扩展为关于功德、称义或盟约报偿的系统教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“孩子”保留父亲对受教者的亲密称呼；“却要”呈现原文ἀλλά的鲜明转折。全节不设脚注，因为主要语义可在正文中清楚而不过度解释地表达。
