base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/004.yaml
  text: And do what is pleasing to her[a], and do not grieve her. Remember, child, that she faced many dangers because of you while you were in the womb; when she dies[b], bury her beside me in one grave.
translation:
  language: zh_hans
  text: 你要做她所喜悦的事，不要使她忧伤。孩子，你要记住：她怀着你时，曾因你经历许多危险[a]。她死后，要把她葬在我身旁，在同一个墓穴里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“她因你而见过许多危险，在母腹中”。这里是指她怀着你时所经历的危险。
    reason: 说明“见过许多危险”的惯用表达，并保留“因你”和母腹语境。
  - marker: b
    text: 也可译作“在一个坟墓里”。
    reason: 保留τάφος可指“墓穴”或“坟墓”的词义范围。
lexical_decisions:
- source_word: ποίει τὸ ἀρεστὸν αὐτῇ
  choice: 做她所喜悦的事
  rationale: ἀρεστός表示“令人喜悦、蒙悦纳”；与格αὐτῇ表明母亲是感到喜悦的一方。此译贴近原文，也符合现代汉语表达。
- source_word: μὴ λυπήσῃς αὐτήν
  choice: 不要使她忧伤
  rationale: λυπέω指使人悲伤、忧愁或痛苦。“使她忧伤”保留了劝诫的感情色彩。
- source_word: μνήσθητι, παιδίον
  choice: 孩子，你要记住
  rationale: παιδίον是带有亲昵意味的称呼，原文未明说“我的”，词本身也不必限定为“儿子”；“孩子”既自然又不过度增添信息。
- source_word: πολλοὺς κινδύνους ἑόρακεν
  choice: 曾……经历许多危险
  rationale: 字面为“见过许多危险”，在此是亲身遭遇危险的惯用表达。“经历”在中文中清楚传达其实际承受的风险。
- source_word: ἐπὶ σοὶ ἐν τῇ κοιλίᾳ
  choice: 怀着你时，曾因你
  rationale: ἐπὶ σοὶ在这里具有原因意味，即“因你、为了你的缘故”；ἐν τῇ κοιλίᾳ按语境指母腹中、怀孕期间。调整语序可使中文自然，并明确危险发生于怀孕及生产相关处境。
- source_word: ὅταν ἀποθάνῃ
  choice: 她死后
  rationale: ὅταν加虚拟式表达将来会发生的情形。中文用“她死后”简洁自然，不把它误解为反复发生的事件。
- source_word: θάψον αὐτὴν παρʼ ἐμοὶ
  choice: 把她葬在我身旁
  rationale: παρά加与格在此表示邻近；在安葬语境中，“葬在我身旁”准确而自然。
- source_word: ἐν ἑνὶ τάφῳ
  choice: 与我同在一个墓穴里
  rationale: ἑνί意为“一个”，τάφος可指坟墓或墓穴。结合“在我身旁”，此处强调二人安葬于同一墓穴；译文保留“一”的明确表达。
theological_decisions:
- issue: 亲属称呼παιδίον的表达
  choice: 孩子
  alternative: 我的孩子；儿子
  rationale: 原词含亲昵意味，但这里没有明示所属代词，也不要求男性性别。采用“孩子”可保留温情，又不加入原文没有明说的信息。
- issue: “见过许多危险”的惯用含义
  choice: 经历许多危险
  alternative: 见过许多危险
  rationale: 直译“见过”在现代汉语中可能被理解为旁观；上下文说的是母亲怀孕及生产时亲身承受的危险，因此用“经历”传达惯用含义，同时在脚注保留字面形式。
- issue: 母亲所受危险与孩子的关系
  choice: 怀着你时，曾因你经历
  alternative: 在腹中为你的缘故见过
  rationale: 原文同时保留原因关系ἐπὶ σοὶ和母腹语境ἐν τῇ κοιλίᾳ。译文不淡化母亲承担的风险，也不额外引申道德责任。
- issue: 共同安葬的表达
  choice: 葬在我身旁，与我同在一个墓穴里
  alternative: 葬在我旁边，在一个坟墓里
  rationale: 原文兼有邻近关系παρʼ ἐμοὶ与“一个墓穴”ἐν ἑνὶ τάφῳ。译文保留两层意思，不进一步规定墓葬的具体结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。劝诫句用“你要……不要……”保持父亲训诲的语气；“孩子”保留亲昵感而不擅加性别或所属；对希腊文惯用语作适度意译，并以脚注交代字面形式。
