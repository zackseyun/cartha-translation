  yaml_path: translation/deuterocanon/tobit/004/012.yaml
  text: Guard yourself[a], child, from all sexual immorality, and first take a wife from the offspring of your fathers. Do not take a foreign woman who is not from the tribe of your father, because we are sons of the prophets. Remember, child, Noah, Abraham, Isaac, and Jacob, our fathers from of old, that they all took wives from among their brothers, and they were blessed in their children[b], and their offspring will inherit the land.
translation:
  language: zh_hans
  text: 孩子，你要谨慎自守，远离一切淫乱；首先要从你祖先的后裔中娶妻。不要娶外族女子，就是不属于你父亲支派的女子，因为我们是先知之子[a]。孩子，你要记得挪亚、亚伯拉罕、以撒和雅各，就是我们古时的祖先；他们都从自己的亲族中娶妻[b]，在自己的儿女身上蒙了福；他们的后裔必承受土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们是先知的后裔”。希腊文直译为“先知之子”。
    reason: 保留原文独特措辞，同时说明其可能表达的谱系含义。
  - marker: b
    text: 希腊文直译为“从他们的弟兄中”；这里在婚姻和氏族语境中指近亲或同族成员，并非字面意义上的弟兄。
    reason: 说明ἀδελφοί的字面措辞及其在本语境中的亲属含义。
lexical_decisions:
- source_word: πρόσεχε σεαυτῷ
  choice: 你要谨慎自守
  rationale: 该反身表达要求人警醒地约束、看守自己。“谨慎自守”自然庄重，并保留反身意味。
- source_word: παιδίον
  choice: 孩子
  rationale: 这是对托比亚的亲昵称呼；“孩子”保留温情，也不在原文没有物主词之处增添“我的”。
- source_word: πορνείας
  choice: 淫乱
  rationale: πορνεία泛指不合正当婚姻伦理的性行为；“淫乱”在现代中文圣经语体中简洁、清楚且有道德分量。
- source_word: γυναῖκα πρῶτον λάβε
  choice: 首先要……娶妻
  rationale: 保留πρῶτον所表达的优先次序，也明确λαμβάνειν γυναῖκα在此是娶妻。
- source_word: ἀπὸ τοῦ σπέρματος τῶν πατέρων σου
  choice: 从你祖先的后裔中
  rationale: σπέρμα在这里指血统和后裔；这样译比“种子”自然，同时保留谱系含义。
- source_word: γυναῖκα ἀλλοτρίαν
  choice: 外族女子
  rationale: 上下文以父亲的支派和祖先的血统为对照；“外族”在此表达亲族、支派之外的人，并非专指现代国籍。
- source_word: φυλῆς τοῦ πατρός σου
  choice: 你父亲的支派
  rationale: 准确表达按父系归属的支派身份，中文也清楚自然。
- source_word: υἱοὶ προφητῶν ἐσμεν
  choice: 我们是先知之子
  rationale: 保留希腊文独特而可能有多重含义的字面措辞；“先知的后裔”这一可能含义放入脚注。
- source_word: ἀπὸ τοῦ αἰῶνος
  choice: 古时
  rationale: 此语修饰祖先，表示他们属于久远的年代；“古时”简明而庄重。
- source_word: ἐκ τῶν ἀδελφῶν αὐτῶν
  choice: 从自己的弟兄中
  rationale: 正文保留ἀδελφοί的阳性亲属称谓；婚姻语境所指的近亲或同族成员以脚注说明。
- source_word: εὐλογήθησαν ἐν τοῖς τέκνοις αὐτῶν
  choice: 在自己的儿女身上蒙了福
  rationale: 保留ἐν的表达，不把它单方面限定为“因儿女”或“得儿女”，使福分如何落实于儿女仍有余地。
- source_word: κληρονομήσει γῆν
  choice: 必承受那地
  rationale: 祖先叙事的语境表明γῆ最自然是指应许之地；“承受那地”保留继承产业的含义。
theological_decisions:
- issue: “我们是先知之子”在族长名单语境中的含义
  choice: 正文保留“先知之子”
  alternative: 我们是先知的后裔
  rationale: 希腊文措辞独特，而随后所列人物是族长，不宜在正文中直接消解这一张力；脚注提供可能的谱系含义。
- issue: 婚姻训诫中的亲属称谓
  choice: 正文保留“弟兄”并加脚注
  alternative: 亲族；同族的人
  rationale: 原文使用阳性亲属词ἀδελφοί，但此处显然不是说娶字面意义上的男性兄弟；正文保留形式，脚注交代语境中的氏族含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“谨慎自守”“蒙了福”“承受那地”保持经文语体，但避免过度文言化。脚注标记分别置于其实际解释的“先知之子”和“弟兄”之后。
