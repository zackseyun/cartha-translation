base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/006.yaml
  text: For if you practice the truth[a], your works will prosper[b], and so will all who practice righteousness.
translation:
  language: zh_hans
  text: 因为你若行事诚实[a]，你所做的事就会顺利[b]；凡行义的人也都必如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“实行真理”。这里的“真理”主要指按真实、诚实和信实而行。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文的表达较为紧凑，直译可作“在你所做的事上将有顺利”。这里不一定专指物质上的兴旺。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιοῦντός σου
  choice: 你若实行
  rationale: 原文为带有压缩感的属格独立结构；在劝诫语境中译为条件句自然，并保留持续践行的含义。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: ἀλήθεια在这里具有伦理意味，指真实、诚实而忠信的生活；“实行真理”既贴近原文，也能涵盖这种行为层面的意思。
- source_word: εὐοδίαιι ἔσονται
  choice: 就会顺利
  rationale: 原文表达进展顺遂、结果良好；“顺利”避免将其收窄为物质上的兴旺。
- source_word: ἐν τοῖς ἔργοις σου
  choice: 你所做的事
  rationale: ἔργα指行为、工作或所做之事；此译法符合现代汉语，并保留范围上的宽泛性。
- source_word: πᾶσι τοῖς ποιοῦσι
  choice: 所有……的人
  rationale: 分词结构描述以这种行为为特征的人；汉语以“所有……的人”自然表达其普遍范围。
- source_word: τὴν δικαιοσύνην
  choice: 行义
  rationale: δικαιοσύνη在此主要指正直、公义的实践；“行义”既简洁，又与前面的“实行真理”形成伦理行为上的呼应。
theological_decisions:
- issue: δικαιοσύνη的译法
  choice: 行义
  alternative: 秉公行事
  rationale: 此处的词义可涵盖广义的正直、公义，也可侧重人际与司法层面的公平。“行义”保留较宽的伦理和神学含义，不将其限定为司法公正；另一可能在脚注中说明。
- issue: 正直行为与顺利结果之间的关系
  choice: 保留原文的陈述，不增添必然物质繁荣的解释
  alternative: 译成“必兴旺”
  rationale: εὐοδίαι表达事情进展顺遂。译作“会顺利”保留智慧劝诫中的因果张力，同时避免擅自把经文解释为财富保证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“实行真理”保留原文的措辞和伦理广度；“你所做的事就会顺利”将压缩的希腊语结构自然化。“也必如此”承接前句谓语，避免汉语重复，同时保持原文的并列关系。
