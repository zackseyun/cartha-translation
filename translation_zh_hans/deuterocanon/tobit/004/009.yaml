  text: For you are storing up a good treasure for yourself for a day of need[a].
translation:
  language: zh_hans
  text: 因为你是在为自己积存美好的财宝，以备急难之日[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “急难之日”也可译作“有需要之日”、“困苦之时”或“患难之日”。希腊语所指较广，可表示迫切需要或艰难困境。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέμα
  choice: 财宝
  rationale: 该名词指存放、积存起来的东西；结合后面的 θησαυρίζεις，用“财宝”保留积存财宝的意象，也比“存款”更少金融色彩。
- source_word: γὰρ
  choice: 因为
  rationale: 表达本句对上文劝勉的解释或理由，符合现代汉语的论述衔接。
- source_word: ἀγαθὸν
  choice: 美好的
  rationale: 直接修饰所积存的财宝；“美好的”既保留其正面价值，也不把含义局限为金钱上的“贵重”。
- source_word: θησαυρίζεις
  choice: 你是在……积存
  rationale: 保留现在时所表达的持续行为，并维持积聚财宝的比喻。“是在”也凸显本句对前文行为之意义的解释。
- source_word: σεαυτῷ
  choice: 为自己
  rationale: 体现反身与受益关系，不额外说明这种益处以何种方式实现。
- source_word: εἰς ἡμέραν ἀνάγκης
  choice: 以备急难之日
  rationale: “以备”自然表达面向将来某一日的用途；“急难”兼顾 ἀνάγκη 所含的迫切需要、困境或患难，不将其窄化为贫穷或某一种灾祸。
theological_decisions:
- issue: 借施舍积存财宝这一比喻的神学含义
  choice: 保留“为自己积存美好的财宝”的比喻，不说明其具体运作机制。
  alternative: 明确译成赚取天上赏赐，或解释为给将来的现实困境预备物资。
  rationale: 希腊文本只说积存财宝以备急难之日，并未明说这种财宝是功德、天上赏赐还是现实保障；译文因此保留原文的神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“积存美好的财宝”保留原文意象；“以备急难之日”使目的关系符合汉语习惯，同时避免过度解释。
