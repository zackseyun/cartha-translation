base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/002.yaml
  text: And he said within himself[a], “I have asked for death; why should I not call Tobiah my son, so that I may instruct him before I die?”
translation:
  language: zh_hans
  text: 他心里说[a]：“我曾求死，为什么不把我儿子多比雅叫来，好在我死以前嘱咐他呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 平行的闪语传统扩展了这里的意思：多比叫多比雅来，是要在自己死前把存放在加拜耳那里的钱的事告诉他。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: 心里说
  rationale: 直译为“在自己里面说”。“心里说”是现代汉语中自然、庄重的表达，也保留了内在自语的意味，不简单弱化为“想”。
- source_word: ᾐτησάμην θάνατον
  choice: 已经求过死了
  rationale: 动词表示请求，过去时态回指多比先前求死之事。“求过死”保留“请求死亡”的含义；不译作“祈求死亡”，以免把动词本身没有明说的祷告性质写入正文。
- source_word: τί οὐ καλῶ
  choice: 为什么不……叫来
  rationale: 这里是内心斟酌并促使自己采取行动的反问。汉语“为什么不……”自然传达“何不”的决意语气，而不是单纯询问信息。
- source_word: Τωβείαν τὸν υἱόν μου
  choice: 我儿子多比雅
  rationale: 按闪语名字的常见形式音译为“多比雅”，并依现代汉语习惯调整同位语次序。
- source_word: ὑποδείξω
  choice: 嘱咐
  rationale: 该词可指指示、说明或教导。此处是父亲临死前召儿子给予指示；“嘱咐”既符合临终语境，也保留指导和交代的含义，而不把平行传统所说的钱款内容直接写入正文。
- source_word: πρὶν ἀποθανεῖν με
  choice: 在我死以前
  rationale: 直接、清楚地表达时间关系，语体自然庄重，不采用带委婉色彩的“离世”。
theological_decisions:
- issue: 平行闪语传统是否应决定ὑποδείξω的具体内容
  choice: 正文笼统译为“嘱咐他”，不加入存放在加拜耳处的钱款。
  alternative: 译为“把那笔钱的事告诉他”。
  rationale: 希腊文主要见证只说明多比要指示或嘱咐儿子，并未交代具体内容。后来的希伯来语回译反映较详尽的闪语传统，可用脚注说明，却不应覆盖希腊文本的措辞。
translation_notes:
  register: 采用现代标准普通话，语气自然而庄重。“心里说”保留内在自语，“嘱咐”适合父亲临死前向儿子交代事情的场景。正文紧扣希腊文，平行传统的增补仅列入脚注。
