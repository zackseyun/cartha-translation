  text: For almsgiving rescues from death and will not allow one to enter into the darkness[a][b].
translation:
  language: zh_hans
  text: 因为施舍[a]救人脱离死亡，也不让人进入那黑暗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“周济穷人”或“怜悯人的善行”；希腊文在这里特指向穷乏者施予财物。
    reason: lexical_alternative
  - marker: b
    text: “那黑暗”很可能使人联想到死亡的领域或深沉的幽暗；希腊文的意象简洁，具体所指仍有一定开放性。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: 施舍
  rationale: 在希腊化时期的犹太语境中，这个名词通常特指向穷乏者给予财物；“施舍”保留了具体行动的含义，而不只表示抽象的怜悯。
- source_word: ἐκ θανάτου
  choice: 脱离死亡
  rationale: ἐκ表示从死亡中被解救出来；“脱离死亡”符合现代汉语表达，也保留原文的方向性。
- source_word: ῥύεται
  choice: 能救人
  rationale: 该动词表示从危险中解救。补出隐含的受事“人”，使汉语自然；“救”表达解救之意，而“能”在此表示施舍所具有的功效，并非将原文的断言弱化为不确定的可能。
- source_word: οὐκ ἐάσει
  choice: 不会让
  rationale: ἐάω的将来时否定式表示将不容许某事发生；“不会让”自然地体现将来含义和阻止之意。
- source_word: εἰσελθεῖν
  choice: 进入
  rationale: 直接表达进入某一领域或境地，简洁并贴合原文。
- source_word: εἰς τὸ σκότος
  choice: 进入那黑暗
  rationale: “那黑暗”保留希腊文定冠词所指示的特定形象，同时不擅自把它明确解释为阴间、死亡领域或末世刑罚。
theological_decisions:
- issue: 本节是否应译成施舍赚取救恩的系统性教义命题
  choice: 照原文保留“施舍能救人脱离死亡”的直接断言，不加以淡化，也不扩展成系统教义。
  alternative: 把“死亡”限定为今世危险，或译成“或许能救人脱离死亡”。
  rationale: 希腊文直接陈述施舍具有救人脱离死亡的功效。译文应保留这一张力，不用后来的教义框架改写，也不把明确陈述降为可能性。
- issue: “黑暗”具体指什么
  choice: 保留简洁而开放的意象“那黑暗”。
  alternative: 明确译为“阴间”“死亡之地”或“末世的幽暗”。
  rationale: 原文没有进一步界定σκότος；上下文可能使人联想到死亡领域或深沉幽暗，但翻译不应替原文消除这种开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“施舍”准确传达具体的济贫行为；“那黑暗”略带经文语体色彩，用以保留原文定冠词及其含蓄意象。两个脚注标记均置于相关句末，正文与脚注对应完整。
