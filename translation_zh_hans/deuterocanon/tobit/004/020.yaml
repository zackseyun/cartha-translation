  yaml_path: translation/deuterocanon/tobit/004/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a].
translation:
  language: zh_hans
  text: 现在，我要让你知道：我把那十他连得银子交给住在米底亚拉吉的加巴利亚之子加拜耳保管。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: 把……的事告诉你
  rationale: 该动词可表示“指给看、指出、告知”。这里不是把银子实物展示出来，而是向多比亚说明这笔存款，因此采用自然的现代汉语表达，同时以脚注保留“指给你看”的可能性。
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: 那十他连得银子
  rationale: 保留古代重量兼货币单位“他连得”，不折算成现代金额；“银子”准确传达ἀργύριον在此处的财物含义。
- source_word: παρεθέμην
  choice: 存放
  rationale: 该中间语态在此表示把钱交给某人保管；“存放在……那里”既符合财务语境，也不把古代安排过度现代化为正式银行存款。
- source_word: Γαβαήλῳ
  choice: 加拜耳
  rationale: 按本节希腊文本的人名形式音译，并与其父名作清楚区分。
- source_word: τῷ τοῦ Γαβρεία
  choice: 加巴利亚的儿子
  rationale: 希腊文以冠词加属格标明父系身份，汉语需补出“儿子”；父名按希腊形式音译。
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: 在米底亚的拉吉
  rationale: 保留属格所表达的地理归属，用现代汉语自然表达为“米底亚的拉吉”；地名按希腊形式音译。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“那十他连得银子的事”避免让“把银子告诉你”显得生硬；分号帮助读者辨明所告知的内容与存放地点、保管人的关系。
