revisions:
- from: 现在，我把那十他连得银子的事告诉你；那是我存放在米底亚的拉吉、加巴利亚的儿子加拜耳那里的。[a]
  to: 现在，我要让你知道：我把那十他连得银子交给住在米底亚拉吉的加巴利亚之子加拜耳保管。
  rationale: 将主句改为“我要让你知道”，保留ἐπιδεικνύω的告知／指出语义及现在时语境；以冒号直接引出所告知的内容。将παρεθέμην译为“交给……保管”，明确这是把银子托付给加拜耳，同时以“住在米底亚拉吉的”自然表达该人的所在地。
