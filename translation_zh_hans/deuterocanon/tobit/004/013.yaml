base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/013.yaml
  text: And now[a], child, love your brothers, and do not become proud in your heart over your brothers and the sons and daughters of your people, so as to take a wife for yourself from among them. For in pride there is ruin and much disorder, and in uselessness there is decline and great want[b]; for uselessness is the mother of famine.
translation:
  language: zh_hans
  text: 现在，孩子，要爱你的弟兄；不要心里高傲，凌驾于你的弟兄和你本族的儿女之上，从他们中为自己娶妻。[a] 因为骄傲会带来败亡和大量的混乱；懒惰会导致衰败和极度匮乏。[b] 懒惰是饥荒之母。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的希腊文句法较紧缩，也可理解为：“从他们中为自己娶妻时，不要对你的弟兄和你本族的儿女心存高傲。”因此，禁止高傲与娶妻从句之间的确切关系并不完全确定。
    reason: alternative_reading
  - marker: b
    text: “懒惰”也可译作“懒散”“无所事事”，较不可能译作“无用”。上下文所说的衰败、匮乏和饥荒，更支持不劳作或不事生产的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: 孩子
  rationale: 保留亲切的家庭称呼和指小形式的语气，不增添原文没有的“我的”，也不把性别进一步限定为“儿子”。
- source_word: ἀγάπα
  choice: 要爱
  rationale: 直接表达命令语气，朴素而自然。
- source_word: ἀδελφούς
  choice: 弟兄
  rationale: 保留希腊文阳性复数的形式；后文另明确提到本族的“儿女”，因此不在此处扩写为“弟兄姊妹”。
- source_word: ὑπερηφάνευε τῇ καρδίᾳ σου
  choice: 不要心里高傲
  rationale: 保留“心”所表达的内在态度，并用现代汉语自然表达骄傲自大的禁令。
- source_word: ἀπὸ τῶν ἀδελφῶν σου καὶ τῶν υἱῶν καὶ θυγατέρων τοῦ λαοῦ σου
  choice: 凌驾于你的弟兄和你本族的儿女之上
  rationale: 在表示高傲的语境中，ἀπό可表达自视高于或疏离这些人；“凌驾于……之上”清楚传达自我抬高的意味。
- source_word: λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα
  choice: 以便从他们中为自己娶妻
  rationale: 保留不定式与前面警告之间可能具有的目的或结果关系，同时忠实表达“从他们中”娶妻。
- source_word: ἀπώλεια
  choice: 毁灭
  rationale: 表达骄傲所导致的灾难性结局；本节没有必要赋予该词末世论含义。
- source_word: ἀκαταστασία πολλή
  choice: 许多混乱
  rationale: 保留该词涵盖失序、动荡和不安定的宽泛意义。
- source_word: ἀχρειότης
  choice: 懒惰
  rationale: 该词也可表示无用或无所作为，但下文的衰败、匮乏和饥荒支持不劳作、懒散的语境义。
- source_word: ἐλάττωσις
  choice: 衰败
  rationale: 表达减少、衰微或境况下降，符合经济和生活后果的语境。
- source_word: ἔνδεια μεγάλη
  choice: 极度匮乏
  rationale: 准确表达严重缺乏和贫困，且符合现代汉语表达。
- source_word: μήτηρ ἐστὶν τοῦ λιμοῦ
  choice: 是饥荒之母
  rationale: 保留原文鲜明的箴言式比喻。
theological_decisions:
- issue: 婚姻从句与禁止高傲之间的关系
  choice: 正文用“以便”把娶妻从句与前面的禁令相连，同时以脚注说明句法有歧义。
  alternative: 也可把整句理解为：从本族中娶妻时，不可对弟兄和本族儿女心存高傲；或将重点理解为应从本族中娶妻。
  rationale: 希腊文句法紧缩，不足以确定婚姻从句究竟主要表达目的、结果，还是娶妻时应有的态度。译文不把本节扩展为更广泛的婚姻教义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“孩子”保持父亲劝诫的亲切口吻；后半句保留箴言式的平行结构和“饥荒之母”的比喻。以脚注保留婚姻从句的句法歧义及ἀχρειότης的词义范围。
