  terminology: ἐλεημοσύνη宜统一译为“施舍”，既保留具体的救济、馈赠含义，也不在正文增添“穷人”这一未明说的对象。γυμνοῖς译作“没有衣服穿的人”恰当地保留其可指赤身或衣着不足的宽度。
