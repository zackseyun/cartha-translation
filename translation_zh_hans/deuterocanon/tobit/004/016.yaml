base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/016.yaml
  text: Give from your bread to the hungry[a], and from your clothing to the naked. Whatever may abound to you, do as almsgiving[b], and do not let your eye be envious when you do almsgiving.
translation:
  language: zh_hans
  text: 要把你的食物分给饥饿的人，把你的衣服分给没有衣服穿的人。凡你有余的，都要用来施舍；施舍时不可吝惜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你施舍时，不可让你的眼吝惜。”这里“眼吝惜”是指施舍时舍不得给、心存吝啬。
    reason: 说明原文保留的“眼”之习语及其在施舍语境中的含义。
lexical_decisions:
- source_word: ἐκ τοῦ ἄρτου σου δίδου
  choice: 要把你的食物分给
  rationale: ἄρτος本义为“饼、面包”，也可泛指食物；此处谈救济饥饿者，译作“食物”更符合现代汉语，同时“分给”体现ἐκ的取出分享之意。
- source_word: πεινῶντι
  choice: 饥饿的人
  rationale: 现在分词作名词使用，泛指处于饥饿中的人。
- source_word: ἐκ τῶν ἱματίων σου τοῖς γυμνοῖς
  choice: 把你的衣服分给没有衣服穿的人
  rationale: ἱμάτια指衣服；γυμνοῖς既可指赤身者，也可指衣不蔽体者。此译自然明白，并保留实际缺衣的核心意义。
- source_word: πᾶν ὃ ἐὰν περισσεύσῃ σοι
  choice: 凡你有余的
  rationale: περισσεύω表示有余、富余；简洁表达一切超出自身所需之物，同时不限定具体财物。
- source_word: ποίει ἐλεημοσύνην
  choice: 都要拿来周济穷人
  rationale: ἐλεημοσύνη在本处具体指向穷人施舍、赈济；“周济穷人”比“行施舍”更自然，也保留受助对象与慈善行动的实际含义。
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: 眼里不可流露吝惜
  rationale: 保留原文“眼”的鲜明意象；φθονέω在施舍语境中表示舍不得、吝惜，而不主要表示嫉妒。
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: 周济时
  rationale: ἐν加冠词化不定式表示时间或伴随情形；译作“周济时”自然简练，并与前句衔接。
theological_decisions:
- issue: ἐλεημοσύνη的具体含义
  choice: 周济穷人
  alternative: 施舍；行怜悯
  rationale: 在本节列举给饥者食物、给缺衣者衣服的语境中，该词特指物质救济，而非抽象的怜悯态度；译文不引入有关功德或救恩效果的额外解释。
- issue: “眼”的习语是否保留
  choice: 保留为“眼里不可流露吝惜”
  alternative: 不可舍不得；不要吝啬
  rationale: 原文以“眼”表达施予时的内在吝惜。保留意象能维持经文的修辞质感，同时用“流露吝惜”使现代读者易懂。
- issue: γυμνοῖς所指的衣着状态
  choice: 没有衣服穿的人
  alternative: 赤身的人；衣不蔽体的人
  rationale: 原词可能涵盖完全赤身或衣着严重不足者；正文采用宽泛而自然的表达，不武断限定其程度。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“要……”“不可……”保留父亲训诲式语气；避免生硬的“行施舍”，并以“周济穷人”明确本节所说的实际救济。
