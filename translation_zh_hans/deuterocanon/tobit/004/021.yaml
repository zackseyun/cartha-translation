  yaml_path: translation/deuterocanon/tobit/004/021.yaml
  text: And do not be afraid[a], child, because we have become poor; you have much, if you fear God and turn away from every sin and do what is pleasing before him.
translation:
  language: zh_hans
  text: 孩子，不要害怕，因为我们已经陷入贫穷；如果你敬畏上帝，远离一切罪恶，并做他眼中所喜悦的事，你就拥有许多[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有许多可供你使用的。”希腊语这一表达既可指人所拥有的，也可指可供人使用的。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβοῦ
  choice: 不要……害怕
  rationale: 以自然的现代汉语表达现在时命令式禁令，并与后面的原因从句合并为“不要因为……而害怕”。
- source_word: παιδίον
  choice: 孩子
  rationale: 保留呼格中亲切的家庭称呼，不增添希腊原文没有明说的“我的”。
- source_word: ἐπτωχεύσαμεν
  choice: 我们已经变得贫穷
  rationale: “变得贫穷”体现不定过去时可能含有的进入贫穷状态之意，不仅静态地说“我们很穷”。
- source_word: ὑπάρχει σοι πολλὰ
  choice: 你拥有的就很多
  rationale: 兼顾该结构所表达的拥有或可供使用之物，同时不限定这些“许多”必然是物质财富或纯属属灵财富。
- source_word: ἐὰν φοβηθῇς τὸν θεὸν
  choice: 只要你敬畏上帝
  rationale: “敬畏上帝”是庄重而通行的圣经用语；“只要”自然表达ἐὰν引出的条件，但不将条件解释为物质兴盛的保证。
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
  choice: 远离一切罪恶
  rationale: 表达从所有罪中退开、与罪分离的主动伦理含义；“一切”保留πάσης的全面性。
- source_word: ποιήσῃς τὸ ἀρεστὸν
  choice: 做……所喜悦的事
  rationale: 将名词化的形容词自然译作“所喜悦的事”，清楚表达行为符合上帝的喜悦。
- source_word: ἐνώπιον αὐτοῦ
  choice: 他眼中
  rationale: 自然表达“在他面前／在他看来”的神圣鉴察与评价意味。
theological_decisions:
- issue: 在贫穷语境中“你拥有的就很多”的含义
  choice: 保留“很多”的宽泛含义，指敬畏上帝、离罪并行他所喜悦之事时所拥有或可得的丰富，却不具体限定其性质。
  alternative: 将其明确解释为顺服后所得的物质丰盛，或明确解释为道德、属灵财富。
  rationale: 希腊文没有说明这些“许多”具体为何物。宽泛翻译既避免引入物质繁荣的保证，也避免把文本过度属灵化，从而保存原文的神学张力。
- issue: 条件句与“拥有很多”的关系
  choice: 用“只要……就……”呈现敬畏上帝、离罪和行他所喜悦之事作为同一条件整体。
  alternative: 把这些行为译成获得财富的因果公式，或弱化为与前句无关的附带劝勉。
  rationale: ἐὰν统摄连续的三个虚拟式动词；译文保留其条件关系，但不额外界定回报的性质或机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“已经变得贫穷”保留状态转变，“敬畏上帝”保留传统神学分量；调整语序，将条件句置于结论之前，使汉语自然，同时不改变逻辑关系。脚注标记置于其实际说明的“你拥有的就很多”之后。
