  text: On that day Tobit remembered the silver that he had deposited with Gabael in Rages of Media[a][b].
translation:
  language: zh_hans
  text: 那一天，托比特想起了他在米底亚的拉格斯交给加巴埃尔保管的银子[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银子”也可译作“钱”；希腊文可指银制货币或按重量计量的银。
    reason: lexical_alternative
  - marker: b
    text: “拉格斯”在英语中也常拼作“Rhages”。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 那一天
  rationale: 自然、直接地表达确定的时间指称，贴合希腊文。
- source_word: ἐμνήσθη
  choice: 想起了
  rationale: 准确表达不定过去时中‘记起、忆起’之意，也符合现代汉语叙事习惯。
- source_word: περὶ τοῦ ἀργυρίου
  choice: 银子
  rationale: 既保留ἀργύριον的字面所指，又能在中文中自然表示作为钱财使用的银。
- source_word: ὃ παρέθετο Γαβαήλῳ
  choice: 交给加巴埃尔保管的
  rationale: παρατίθημι在此表示将财物托付给某人保管；此译法比单说‘存放’更清楚地呈现接受保管者。
- source_word: Γαβαήλῳ
  choice: 加巴埃尔
  rationale: 按希腊文Γαβαήλ的读音音译人名。
- source_word: ἐν Ῥάγοις
  choice: 在……拉格斯
  rationale: 按希腊文Ῥάγοις音译地名，并用‘在’表达地点。
- source_word: τῆς Μηδίας
  choice: 米底亚的
  rationale: 将属格理解为说明拉格斯所属的较大地区，以自然汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免‘存放在某地、交给某人’造成结构含混，将地点置于保管人短语之前，同时完整保留原文中的时间、财物、受托人和地区信息。
