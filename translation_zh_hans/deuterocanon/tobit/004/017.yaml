  text: Pour out your bread on the grave of the righteous[a], and give none to sinners.
translation:
  language: zh_hans
  text: 要把你的饼倾倒在义人的坟墓上[a]，不要给罪人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在义人的墓旁。”这句话可能指丧葬或纪念场合的慈善行为；正文保留希腊文的字面表达。
    reason: 说明介词短语的译法及其未确定的文化背景。
lexical_decisions:
- source_word: ἔκχεον
  choice: 倾倒
  rationale: 该命令式的基本义是“倒出、倾倒”。保留这一具体而不寻常的意象，不将其解释性改写为“慷慨施舍”或“分发”。
- source_word: τοὺς ἄρτους σου
  choice: 你的饼
  rationale: ἄρτους为复数，可指饼或食物；现代汉语用“饼”即可自然表达这类食物，也保留原文的具体性。
- source_word: ἐπὶ τὸν τάφον τῶν δικαίων
  choice: 在义人的坟墓上
  rationale: ἐπί加宾格在此保留“在……上”的空间图景；τάφος译为“坟墓”，不在正文中将其确定解释为葬礼或纪念性的施舍。
- source_word: τῶν δικαίων
  choice: 义人
  rationale: “义人”是圣经语境中δικαίων自然且简明的对应词，兼具道德和宗教含义。
- source_word: καὶ μὴ δῷς
  choice: 不要给
  rationale: 直译否定命令。第二分句的宾语在希腊文中省略，中文也不补出“饼”或“任何东西”，以保留原文的简洁及范围上的张力。
- source_word: τοῖς ἁμαρτωλοῖς
  choice: 罪人
  rationale: 这是ἁμαρτωλοῖς在圣经语境中的标准而透明的译法。
theological_decisions:
- issue: 丧葬指令的具体含义
  choice: 正文保留“把饼倾倒在义人的坟墓上”这一字面而具体的图景。
  alternative: 在义人的墓旁分送你的饼；在义人安葬时施舍食物。
  rationale: 这句话可能涉及丧葬或纪念场合的慈善行为，但确切习俗并不明确；不应在正文中消除原文的含混。
- issue: 不给罪人的禁令范围
  choice: 译作“不要给罪人”，不补明所给之物。
  alternative: 不要把饼给罪人；不要让罪人参与这种丧葬施舍。
  rationale: 希腊文第二分句没有明说宾语。保留省略可避免把禁令的范围解释得过窄或过宽。
- issue: καί的分句关系
  choice: 以逗号并列两项命令，不另加“却”或“而”。
  alternative: 却不要给罪人。
  rationale: καί通常表示并列；上下句虽有语义对照，但原文没有必须强化为转折的标记。
translation_notes:
  register: 采用现代、庄重而简明的普通话。“倾倒”刻意保留原文异常而具体的表达；“坟墓”通俗明确。正文中的[a]与脚注标记一致。
