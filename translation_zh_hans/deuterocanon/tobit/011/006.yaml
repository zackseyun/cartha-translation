  text: And she noticed him coming and said to his father[a], “Look, my son is coming, and the man who went with him.”
translation:
  language: zh_hans
  text: 她发现[a]他正走来，就对他父亲说：“看，我儿子正走过来，和他一同去的那个人也正走过来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发现”所译的希腊语也可译作“察觉到”或“认出”；这里指她看见他正在走来，但原词是否特别强调认出，并不完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: προενόησεν
  choice: 发现
  rationale: 该动词在这里描写她察觉到来人；“发现”自然表达从远处看见或辨认出来，同时不像“认出”那样把辨认之意完全确定下来。
- source_word: ἐρχόμενον
  choice: 正走来
  rationale: 现在分词表示朝说话者所在之处而来；“正走来”保留进行中的动作。
- source_word: Ἰδοὺ
  choice: 看
  rationale: 这是引人注意的指示性呼语；“看”简洁、自然，并保留现场感。
- source_word: ὁ υἱός μου
  choice: 我儿子
  rationale: 直接保留第一人称所属关系，符合现代汉语表达。
- source_word: ὁ ἄνθρωπος
  choice: 那个人
  rationale: 原文明确使用“人”，并未改称“同伴”；“那个人”在此语境中自然，也保留原文措辞。
- source_word: ὁ πορευθεὶς μετʼ αὐτοῦ
  choice: 和他一同去的
  rationale: 忠实表达过去曾与他同行出发的人；用定语结构衔接“那个人”，自然清楚。
