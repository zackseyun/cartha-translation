  text: And Anna ran up and fell on the neck of her son[a], and said to him, “I have seen you, child.”
translation:
  language: zh_hans
  text: 安娜跑上前去，扑到儿子的颈项上[a]，对他说：“我见到你了，孩子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“扑到儿子的颈项上”，是形容激动拥抱的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμοῦσα
  choice: 跑上前去
  rationale: 该分词表示朝着某人跑去；“跑上前去”自然地保留了动作的迅速与鲜明。
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον
  choice: 伏在……的颈项上
  rationale: 原文直译为“落在……的颈项上”，是表达激动拥抱的惯用说法。“伏在”既保留原文身体动作的意象，也比生硬的“落在”更符合现代汉语。
- source_word: τοῦ υἱοῦ αὐτῆς
  choice: 儿子的
  rationale: υἱός明确指“儿子”，保留亲属关系的具体性；上下文已明确是安娜的儿子，无须重复“她的”。
- source_word: Εἶδόν σε
  choice: 我终于见到你了
  rationale: 不定过去时在重逢语境中表达见到儿子这一事件已经实现，并带有当下的欣慰。“终于”将语境所含的久候后重逢之意自然传达出来。
- source_word: παιδίον
  choice: 孩子
  rationale: 这是带亲昵色彩的称呼；即使儿子已经成年，母亲称他为“孩子”在现代汉语中仍自然，并且不额外加入原文没有的“我的”或“亲爱的”。
