  yaml_path: translation/deuterocanon/tobit/011/005.yaml
  text: And Anna sat watching the road for her son,[a]
translation:
  language: zh_hans
  text: 安娜坐着，朝着道路张望，等候她的儿子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译近于“朝着道路张望，她的儿子”，是压缩的表达，意思是她朝着道路张望，等候儿子回来。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: 坐着
  rationale: 未完成时态描写持续中的姿态；“坐着”既自然，也保留她一直守候的画面。
- source_word: περιβλεπομένη
  choice: 望着
  rationale: 该分词表示留心察看、搜寻般地张望；结合后面的道路，用“望着”简洁自然，又不把动作夸大为四处巡视。
- source_word: εἰς τὴν ὁδόν
  choice: 路上
  rationale: ὁδός在此指儿子归来所经过的道路。“望着路上”符合现代汉语叙事，也保留视线所向。
- source_word: τὸν παῖδα αὐτῆς
  choice: 等候她的儿子
  rationale: παῖς依语境指安娜的儿子多比亚。原文结构压缩，在汉语中补出“等候”可自然表达她望路盼儿归来的含义，同时以脚注说明原文形式。
