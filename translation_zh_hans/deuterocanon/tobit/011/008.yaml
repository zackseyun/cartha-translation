base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/008.yaml
  text: You shall anoint his eyes with the gall[a], and when it stings, he will rub them, and the white films will come away[c][b], and he will see you.
translation:
  language: zh_hans
  text: 你要把胆汁[a]涂在他的眼睛上；胆汁刺痛他时，他就会揉眼睛，把那些白膜[c]除去，随后便会看见你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胆液”。希腊词指胆汁；这里是作为药用物质使用。
    reason: lexical_alternative
  - marker: c
    text: 也可译“白斑”或“白色斑块”，指眼睛上发白的浑浊物，不一定等同于现代医学所说的白内障。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγχρισον
  choice: 涂在
  rationale: 这是ἐγχρίω的单数命令式，指把某种物质涂抹在身体部位上；“涂在”自然清楚，也保留了直接吩咐的语气。
- source_word: χολὴν
  choice: 胆汁
  rationale: χολή指胆汁或胆液；“胆汁”是现代汉语中准确而通行的说法，并符合此处作为药用物质的语境。
- source_word: δηχθεὶς
  choice: 他感到刺痛时
  rationale: 该分词本有“被咬、被刺痛”的鲜明身体感受；在眼睛受到胆汁刺激的语境中，“感到刺痛”自然表达其效果，同时不误译为真的遭到咬噬。
- source_word: διατρίψει
  choice: 就会揉眼睛
  rationale: 此动词表示反复摩擦或揉搓；宾语在希腊文中省略，中文依上文补出“眼睛”，使指代清楚。
- source_word: ἀποβαλεῖται
  choice: 便会脱落
  rationale: 中间语态在此表达白色覆盖物因揉擦而除去；中文改以“白膜”为主语，说“脱落”更自然，并保留去除的结果。
- source_word: τὰ λευκώματα
  choice: 那些白膜
  rationale: 该词指眼睛上的白色斑块或浑浊覆盖物；“白膜”形象易懂，又避免用现代医学术语“白内障”作过度诊断。
- source_word: ὄψεταί σε
  choice: 他也会看见你
  rationale: 希腊文直说“他会看见你”；译文不额外补入“恢复视力”，以保留原文的简洁表达。
