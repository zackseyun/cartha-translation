  yaml_path: translation/deuterocanon/tobit/011/002.yaml
  text: And Raphael said to Tobiah[a], “Do you not know, brother, how you left your father?”
translation:
  language: zh_hans
  text: 拉斐尔对多比雅说：“弟兄，你不知道[a]你离开父亲时，他是什么状况吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“弟兄，你不记得离开父亲时，他是什么状况吗？”闪语平行传统明确提到父亲失明，希腊文则表达得较简略。
    reason: 说明Οὐ γινώσκεις可带有“记得”的语意，并交代希腊文与闪语平行传统在详略上的差异。
lexical_decisions:
- source_word: Οὐ γινώσκεις
  choice: 你不知道……吗
  rationale: γινώσκω的基本义是“知道、认识”；在此反问中也带有提醒对方想起或意识到某事的意味。译作“你不知道……吗”最贴近希腊文，同时保留语境中的提醒语气。
- source_word: ἀδελφέ
  choice: 弟兄
  rationale: 这是字面意义为“弟兄”的呼格，也可作亲切称呼；“弟兄”既保留原词的亲近感，又不把它改释为普通的“朋友”。
- source_word: πῶς ἀφῆκες τὸν πατέρα σου
  choice: 你离开父亲时，他是什么状况
  rationale: πῶς在这里很可能指离开父亲时父亲的情形；ἀφῆκες意为“离开、留下”。此译使现代汉语自然明白，却不把希腊文未明说的失明直接补入正文。
- source_word: τὸν πατέρα σου
  choice: 父亲
  rationale: 按汉语领属关系，在“你离开父亲时”中无需重复译出“你的”，所指仍清楚明确。
theological_decisions:
- issue: 是否依据闪语平行传统明说父亲失明
  choice: 正文保留希腊文简短而含蓄的问法，只译为“他是什么状况”。
  alternative: “你知道你父亲失明……”或“你不记得离开父亲时他双目失明吗？”
  rationale: 主要翻译依据是Swete所载希腊文本；间接希伯来文所代表的闪语平行传统有助于说明πῶς暗指父亲的失明状况，却不应取代希腊文较简短的措辞。这样也保留了原文的含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弟兄”保留原文称呼的亲切和古典庄重感；将πῶς按语境展开为“他是什么状况”，避免生硬的“你怎样离开了父亲”，同时不擅自补出“失明”。
