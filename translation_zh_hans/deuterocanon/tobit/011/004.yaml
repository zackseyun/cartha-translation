  text: But take the fish’s gall in your hand. And they went on, and the dog came along behind them.
translation:
  language: zh_hans
  text: 你要把鱼胆拿在手里[a]。随后，他们继续前行，那条狗跟在他们后面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鱼胆”也可译作“鱼的胆汁”。希腊文 χολή 可指胆或胆汁。
    reason: lexical_alternative
  - marker: b
    text: 这一场景的平行闪米特语传统篇幅长得多，重点叙述多比雅把鱼胆敷在父亲眼睛上；正文依从此处较短的希腊文本。
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε
  choice: 拿
  rationale: 这是 λαμβάνω 的简单过去时命令式；“拿”自然、直接，符合具体行动指示。
- source_word: παρὰ χεῖρα
  choice: 拿在手里
  rationale: 此处结合宾语“鱼胆”，表示把东西带在手边或持于手中，而不是牵着手；译作“拿在手里”最符合语境。
- source_word: χολὴν τοῦ ἰχθύος
  choice: 鱼胆
  rationale: χολή 可指胆或胆汁；“鱼胆”在中文叙事中简洁自然，也保留传统表达。
- source_word: ἐπορεύθησαν
  choice: 继续前行
  rationale: 这是一般的叙事行进动词；结合上下文，译作“继续前行”自然表达旅程的延续。
- source_word: συνῆλθεν
  choice: 也跟在
  rationale: συνέρχομαι 基本义为一同前来或同行；与 ὀπίσωθεν αὐτῶν 连用时，指狗在他们后面伴随前行。“也跟在”自然表达这种同行关系。
- source_word: ὁ κύων
  choice: 那条狗
  rationale: 定冠词表明这是叙事中已知的狗；中文用“那条狗”可明确其已知所指。
- source_word: ὀπίσωθεν αὐτῶν
  choice: 他们后面
  rationale: 这是空间方位短语，表示位于他们身后。
