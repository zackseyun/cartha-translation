lexical_decisions:
- source_word: Θάρσει
  choice: 鼓起勇气来吧
  rationale: 这是 θαρσέω 的命令式，用来鼓励、安慰对方；译文保留“勇气”的核心含义，同时符合现代汉语表达。
- source_word: πάτερ
  choice: 父亲
  rationale: 原文是直接称呼的呼格，没有明说“我的”；“父亲”庄重自然，也不增添原文没有的所有格。
- source_word: ὡς δὲ
  choice: ……后
  rationale: 此处承接叙事并带有时间关系；以“后”表达前后次序，避免生硬直译连接词。
- source_word: συνεδήχθησαν
  choice: 他们相聚
  rationale: 按所给希腊文本及叙事情境，保留“来到一起、相会”的宽泛含义，不限定相聚的具体方式。
- source_word: διέτριψε
  choice: 揉
  rationale: 该动词的基本意思是摩擦、揉；这里不加入本分句没有明说的治疗细节。
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: 父亲的眼睛
  rationale: 希腊文直译为“他的眼睛”，上下文所指是父亲托比特；汉语若连续使用“他……他的”容易误解为施事者自己的眼睛，因此明示所指。
