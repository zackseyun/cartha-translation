base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/001.yaml
  text: After these things[a], Tobiah also went on his way, blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: zh_hans
  text: 这些事以后，多比雅继续前行，一路称颂上帝，因为上帝使他的旅程顺利[a]；他也不断祝福拉古耳和他的妻子厄得娜。他继续前行，直到他们临近尼尼微[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“因为他使他的道路亨通”，是说上帝使他的旅程顺利成功。
    reason: lexical_alternative
  - marker: b
    text: 这一分句的希腊文句法不顺。原文先说“他继续前行”，随后却用复数动词“他们临近”；也有人将后半句理解为“直到他临近尼尼微”。
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: 这些事以后
  rationale: 保留复数指示语“这些事”的意味，同时作为自然的叙事过渡。
- source_word: ἐπορεύετο
  choice: 继续前行
  rationale: 未完成时表示持续进行的行动；“继续前行”既体现过程性，也符合现代汉语叙事。
- source_word: εὐλογῶν τὸν θεόν
  choice: 一路称颂上帝
  rationale: εὐλογέω用于人对上帝时可指称颂、赞美；“称颂”保留其圣经语体，“一路”体现分词与主要动词同时进行。
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: 因为上帝使他的旅程顺利
  rationale: 原文直译近于“使他的道路亨通”，是指上帝使旅程成功顺遂；译文传达该习语并保留上帝为行动者。
- source_word: κατευλόγει
  choice: 不断祝福
  rationale: 未完成时带有持续或反复意味；“不断”体现这一体貌，且“祝福”保留原词措辞，不改释为单纯感谢。
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: 辣古耳和他的妻子厄得娜
  rationale: 按希腊语最自然的关系理解，厄得娜是辣古耳的妻子；汉语调整词序以求清楚自然。
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: 直到他们临近尼尼微
  rationale: 传世希腊文句法别扭，但复数动词ἤγγισαν支持“他们临近”；结合行程语境，目的地应为尼尼微。译文表达最可能的叙事意义，并以脚注保留不确定性。
theological_decisions:
- issue: θεός的译法
  choice: 上帝
  alternative: 神
  rationale: 叙事中普通地指以色列的上帝；“上帝”是现代标准汉语中清楚、庄重且无须附加宗派解释的译法。
- issue: 难句ἤγγισαν αὐτὸν εἰς Νινευή的理解
  choice: 他继续前行，直到他们临近尼尼微
  alternative: 他继续前行，直到他临近尼尼微；或：他们在尼尼微附近走近他
  rationale: 前一动词ἐπορεύετο是单数，后一动词ἤγγισαν是复数，原文还带有难以自然解释的αὐτόν。正文保留这种主语数目的转换，并按上下文表达接近尼尼微的行程意义；脚注明确交代原文的不顺和另一种可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“称颂上帝”保留圣经语体；“使他的旅程顺利”自然传达希腊语道路习语。人名依希腊文音译，并在全节保持一致。
