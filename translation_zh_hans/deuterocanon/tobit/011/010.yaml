  yaml_path: translation/deuterocanon/tobit/011/010.yaml
  text: “From now on I can die.” And both of them wept. Then Tobit went out toward the door and stumbled[a], but his son ran to him,
translation:
  language: zh_hans
  text: “从今以后，我死也无憾了[a]。”两个人都哭了。托比特朝门口走去，脚下磕磕绊绊；他的儿子便跑到他跟前，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“从今以后，我将要死。”这是心愿已经实现、如今死也无憾的感叹。
    reason: 说明正文采用语境化的习语译法，并保留希腊文未来时的字面意思。
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 保留这个时间短语“从此刻起、从现在起”的方向感，也符合说话者重逢后的感叹语气。
- source_word: ἀποθανοῦμαι
  choice: 我死也无憾了
  rationale: 该词在形式上是“我将死”，但此处结合重逢语境，是心愿已偿、如今可以安然死去的感叹。“死也无憾”以自然汉语传达这一语用含义，同时用脚注保留字面译法。
- source_word: ἔκλαυσαν
  choice: 哭了
  rationale: κλαίω在此表示因强烈情感而流泪；“哭了”简洁自然，不限定是悲哭还是喜极而泣。
- source_word: ἀμφότεροι
  choice: 两个人都
  rationale: 明确保留“双方、二人”的含义。
- source_word: ἐξήρχετο
  choice: 朝……走去
  rationale: 未完成过去时描写正在进行的外出动作；结合πρὸς τὴν θύραν，译为“朝门口走去”自然且保留方向。
- source_word: πρὸς τὴν θύραν
  choice: 朝门口
  rationale: 保留πρός加宾格所表达的趋向，而不强说已经到了门口。
- source_word: προσεκόπτεν
  choice: 脚下磕磕绊绊
  rationale: προσκόπτω表示碰撞或绊跌，未完成过去时可呈现持续或反复的行动；此译比单次的“绊了一下”更贴近形态，同时没有增添他摸索等原文未明说的动作。
- source_word: προσέδραμεν αὐτῷ
  choice: 跑到他跟前
  rationale: 直接表达迅速朝他而去的动作，并自然对应与格αὐτῷ。
theological_decisions:
- issue: ἀποθανοῦμαι在重逢场景中的情感习语
  choice: 译作“我死也无憾了”
  alternative: 直译“我从今以后将要死”或“现在我可以死了”
  rationale: 上下文指向心愿得到满足后的感叹，并非预告即将死亡。正文采用现代汉语中意义相当的表达，脚注则保留其字面形式，避免把解释伪装成唯一词义。
- issue: 叙事主语的连续性
  choice: 按所给希腊文本，以托比特为朝门口走去并绊跌的人
  alternative: 其他较长文本传统在相邻叙事细节上有所不同
  rationale: 本节以指定的Swete希腊文本为主要底本，不据其他文本传统改换主语或补充情节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“死也无憾”自然传达重逢后的满足感；“脚下磕磕绊绊”保留未完成过去时的过程性。句末逗号依原文保留，表明句子在下一节继续。
