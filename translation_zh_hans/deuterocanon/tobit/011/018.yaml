    rationale: 希腊文末尾是“καὶ Νασβὰς ὁ ἐξάδελφος αὐτοῦ,”，即“和他的表兄弟拿斯巴，”，并没有“也来了”；该动词是译文为使汉语完整而补出的并列谓语。
