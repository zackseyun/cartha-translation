lexical_decisions:
- source_word: ἐγένετο χαρὰ
  choice: 都欢喜
  rationale: 以自然的现代汉语表达“有了欢喜／喜乐临到”的结果状态，保留群体共同欢喜的意思。
- source_word: πᾶσι τοῖς ἐν Νινευὴ
  choice: 在尼尼微的所有
  rationale: 保留 πᾶσι 的完整范围和地点短语的修饰关系。
- source_word: ἀδελφοῖς αὐτοῦ
  choice: 他的弟兄
  rationale: 按希腊文直译亲属称谓；该词在叙事语境中也可能泛指亲属或同族人，因此在脚注说明。
- source_word: παρεγένετο
  choice: 来了
  rationale: 简洁自然地表达抵达或到场，符合连续叙事。
- source_word: Ἀχιάχαρος
  choice: 亚希加
  rationale: 依希腊文专名作适合现代汉语的音译。
- source_word: Νασβὰς
  choice: 拿斯巴
  rationale: 依所据希腊文本的名称形式音译，不以其他见证中的异名替换。
- source_word: ὁ ἐξάδελφος αὐτοῦ
  choice: 他的堂表兄弟
  rationale: ἐξάδελφος 特指男性同辈旁系亲属；“堂表兄弟”既表明男性，也不擅自判定父系或母系关系。
theological_decisions:
- issue: ἀδελφοῖς αὐτοῦ 的范围
  choice: 正文译作“他的弟兄”
  alternative: 他的亲属；他的同族人
  rationale: 希腊文形式明确是“弟兄”，但可有较广的亲属或群体含义；正文保留字面称谓，脚注保存语义范围，避免无依据地收窄或扩大。
translation_notes:
