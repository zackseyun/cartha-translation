revisions:
- from: 因为你责打了我[a]，又怜悯了我。看哪，我看见我儿子托比亚了！他的儿子欢欢喜喜地进来，把自己在米底所经历的一切大事都告诉了父亲。
  to: 因为你责打了我[a]，又怜悯了我。看哪，我看见我儿子托比亚了！托比亚欢欢喜喜地进来，把在米底发生在自己身上的大事告诉了父亲。
  rationale: 修订仅除去原文未表达的“一切……都”，并以“托比亚”替代可能含混的“他的儿子”。“发生在自己身上的大事”对应τὰ μεγάλα τὰ γενόμενα αὐτῷ，保留“大事”的开放性，且不将其限定为神迹或特定作为。
