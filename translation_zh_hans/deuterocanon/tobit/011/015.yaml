  yaml_path: translation/deuterocanon/tobit/011/015.yaml
  text: because you afflicted me and had mercy on me. Behold[a], I see Tobiah my son. And his son entered rejoicing, and reported to his father the great things that had happened to him in Media.
translation:
  language: zh_hans
  text: 因为你责打了我[a]，又怜悯了我。看哪，我看见我儿子托比亚了！托比亚欢欢喜喜地进来，把在米底发生在自己身上的大事告诉了父亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “责打”也可译作“鞭打”或“使……受苦”；希腊词可指严厉击打、鞭笞或惩戒。
    reason: 说明 ἐμαστίγωσας 的词义范围，并保留字面与引申理解的可能。
lexical_decisions:
- source_word: ἐμαστίγωσας
  choice: 责打了我
  rationale: 该词本义可指鞭打，也可引申为严厉击打或管教。“责打”保留强烈的受击与惩戒意味，同时不把上下文限定为字面的鞭刑。
- source_word: ἠλέησάς με
  choice: 怜悯了我
  rationale: 忠实表达 ἐλεέω 的常用含义，并与前面的“责打”形成原文刻意保留的张力。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意的感叹语气，符合庄重而可懂的现代中文经文语体。
- source_word: βλέπω
  choice: 我看见……了
  rationale: 既直接表达“看见”，句末“了”也自然体现视力恢复后眼前所见的即时事实。
- source_word: χαίρων
  choice: 欢欢喜喜地
  rationale: 自然表达分词所指的喜乐状态，并保持叙事的鲜明情绪。
- source_word: ἀπήγγειλεν
  choice: 告诉了
  rationale: 在父子叙事中比“报告”更自然，同时保留将经历完整讲述出来的意思。
- source_word: τὰ μεγάλα
  choice: 一切大事
  rationale: 保留“大”的开放含义，不擅自限定为神迹、恩典或上帝的作为。
- source_word: τὰ γενόμενα αὐτῷ
  choice: 自己所经历的
  rationale: 自然传达发生在托比亚身上的事，同时避免中文“发生给他”的生硬表达。
- source_word: ἐν τῇ Μηδείᾳ
  choice: 在米底
  rationale: 将 Μηδεία 作为地区名称译为通行的“米底”。
theological_decisions:
- issue: 苦难与怜悯中的神圣行动
  choice: 保留对上帝的直接称呼：“你责打了我，又怜悯了我。”
  alternative: “你使我受苦，又向我施怜悯。”
  rationale: 希腊文把严厉击打与怜悯都直接归于同一位受称呼者；译文不将前者改为无人称遭遇，也不消解两者之间的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留经文感叹语气；“欢欢喜喜地进来”和“告诉了父亲”使中文自然流畅。感叹号体现看见儿子时的即时喜悦，但不增加原文没有的解释。
