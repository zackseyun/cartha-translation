  yaml_path: translation/deuterocanon/tobit/011/003.yaml
  text: Let us run on ahead of your wife and prepare the house[a].
translation:
  language: zh_hans
  text: “我们先跑到你妻子前面去，预备好房子[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“你妻子”。从故事上下文来看，有些读者可能会认为这里本应指另一位家人；但现存希腊文本在此确实作“你妻子”，本译文据此翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: προδράμωμεν
  choice: 我们先跑……去
  rationale: 不定过去时虚拟语气在此表示劝勉：“让我们跑在前面”。“先跑……去”既保留动作的生动感，也符合现代汉语表达。
- source_word: ἔμπροσθεν
  choice: 到……前面
  rationale: 与表示奔跑的动词连用，表明走在某人前头；译作“到……前面去”自然清楚。
- source_word: τῆς γυναικός σου
  choice: 你妻子
  rationale: γυνή结合第二人称所有格，在此通常表示配偶关系，直译为“你妻子”，不因上下文疑点而改换所指。
- source_word: ἑτοιμάσωμεν
  choice: 预备好
  rationale: 同样是劝勉性虚拟语气，与前一动词并列。“预备好”准确表达使住处为迎接来人而就绪。
- source_word: τὴν οἰκίαν
  choice: 房子
  rationale: οἰκία可指房屋或家户；在先行抵达并作准备的语境中，实体住处最为合适。
