  source_fidelity: 正文准确呈现希腊文两个劝勉式虚拟语气：“我们……去，……预备好……”。“先跑到你妻子前面去”忠实表达 προδράμωμεν ἔμπροσθεν τῆς γυναικός σου 的先行、在前之意；“预备好房子”对应 ἑτοιμάσωμεν τὴν οἰκίαν。没有把希腊文中虽显突兀但明确的“你妻子”擅自改为其他家人。
  naturalness: 译文是自然、简洁的现代标准汉语。“我们先跑到你妻子前面去，预备好房子”在叙事对话中通顺；“预备好房子”也恰当地表达先到住处为随后到达者作准备。
