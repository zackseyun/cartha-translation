  language: zh_hans
  text: 他拉住父亲，把胆汁涂在父亲的眼睛上，说：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句在“说”之后接续下一节的话。
    reason: 提示读者，希腊文以分词λέγων引出后续直接引语，因此本节句子尚未完整结束。
lexical_decisions:
- source_word: ἐπελάβετο
  choice: 扶住
  rationale: 该中间态动词表示抓住、扶持。这里多比亚正要为失明的父亲敷药，“扶住”既保留身体接触的具体动作，也符合现代汉语语境，而不过度解释为拥抱。
- source_word: προσέπασεν
  choice: 涂在……上
  rationale: 该动词表示把某物敷、抹到表面；“涂在……上”自然明确，适合此处施用药物的动作。
- source_word: χολήν
  choice: 胆汁
  rationale: χολή指胆汁；现代汉语以“胆汁”最准确清楚，也与本叙事中的鱼胆疗法相符。
- source_word: ὀφθαλμούς
  choice: 眼睛
  rationale: ὀφθαλμοί的常用自然译法，无须采用过于解剖学化的表达。
- source_word: λέγων
  choice: 说
  rationale: 现在分词引出下一节的直接引语。“说”保留句子向后承接、尚未结束的结构。
