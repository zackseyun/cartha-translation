base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/017.yaml
  text: And Tobit gave thanks before them that God had shown them mercy. And when Tobit came near to Sarah his daughter-in-law[a], he blessed her, saying, “May you come in good health, daughter. Blessed is God, who has brought you to us, and your father and your mother.”
translation:
  language: zh_hans
  text: 多比在他们面前称谢上帝，因为上帝怜悯了他们。多比走近儿媳撒拉时，就祝福她说：“女儿，愿你平安而来！把你带到我们这里来的上帝是当受称颂的，还有你的父亲和母亲。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊文本以“还有你的父亲和母亲”突然结束。有些读者理解为省略了下文，意思可能是“你的父亲和母亲也是当受称颂的”，但这个文本并没有明说相应的谓语。
    reason: 说明原文句末的省略与可能理解，同时不在正文中补入未见于该见证的词语。
lexical_decisions:
- source_word: ἐξωμολογεῖτο
  choice: 称谢上帝
  rationale: 此处所称述的是上帝施怜悯的作为，语境表示公开感谢、颂赞，而非认罪。“称谢上帝”自然表达了动词的对象与功能；原文虽未在动词后明说“上帝”，但由后接内容可以明确得知。
- source_word: ἐνώπιον αὐτῶν
  choice: 在众人面前
  rationale: 表达多比公开称谢的场景；“他们”在汉语中指代略显生硬，按语境译为“众人”更自然。
- source_word: ἠλέησεν αὐτοὺς ὁ θεός
  choice: 上帝怜悯了他们
  rationale: 保留ἐλεέω的神学分量和简洁的主动句式；不把一次已经发生的施怜悯行为扩展解释。
- source_word: καὶ ὡς ἤγγισεν
  choice: 走近……时
  rationale: ὡς在这里自然表示时间关系；ἤγγισεν指多比接近撒拉。
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: 儿媳
  rationale: νύμφη可指新娘或儿媳；此处从多比与儿子之妻撒拉的亲属关系看，“儿媳”最准确。
- source_word: κατευλόγησεν
  choice: 祝福
  rationale: 直接传达向撒拉说祝福话的行为，不把复合动词的加强意味过度译出。
- source_word: Ἔλθοις ὑγιαίνουσα
  choice: 愿你安康而来
  rationale: 用“愿”体现ἔλθοις的祈愿语气，同时保留“来”的动作和ὑγιαίνουσα所表达的健康、安好。
- source_word: θύγατερ
  choice: 女儿
  rationale: 保留多比对儿媳温暖的家庭称呼；原文没有物主词，故不增译“我的”。
- source_word: εὐλογητὸς ὁ θεός
  choice: 上帝是当受称颂的
  rationale: 符合希腊文祝颂公式，也以庄重而现代的汉语明确表示上帝配受称颂。
- source_word: ὃς ἤγαγέν σε πρὸς ἡμᾶς
  choice: 把你带到我们这里来的
  rationale: 保留上帝为行动主体，以及撒拉如今已经来到这一家的结果。
- source_word: καὶ ὁ πατήρ σου καὶ ἡ μήτηρ σου
  choice: 还有你的父亲和母亲
  rationale: 按此希腊文本保留句末附加短语，不擅自补入原文未明说的谓语。
theological_decisions:
- issue: ἐξωμολογεῖτο在此处表示认罪还是公开称谢
  choice: 公开称谢上帝
  alternative: 承认或 confess
  rationale: ὅτι引出的内容是上帝怜悯了他们，表明多比是在感恩地宣认上帝的作为，而不是承认自己的罪。
- issue: 句末“还有你的父亲和母亲”的语法关系
  choice: 在正文中保留无明确谓语的附加结构
  alternative: 补译为“你的父亲和母亲也是当受祝福的”
  rationale: 现有希腊文本在该短语前没有重复“当受称颂”或其他谓语；保留突兀结构并用脚注说明，可避免替原文消除真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称谢”“怜悯”“当受称颂”保留经文语体的肃穆感；其余句法尽量自然。末句刻意保留原文的突兀感，并以脚注交代。
