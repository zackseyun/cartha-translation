  text: 多比雅的婚礼欢欢喜喜地举行了七天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: 举行了
  rationale: ἄγω的简单过去时被动形式在此是举办、举行庆典的习惯用法；汉语用“举行了”自然表达事件实际进行，也避免生硬直译为“被带领”。
- source_word: ὁ γάμος
  choice: 婚礼
  rationale: γάμος既可指婚姻，也可指婚礼或婚宴；与“欢喜”和持续“七天”连用，语境显然侧重婚礼庆典。
- source_word: Τωβεία
  choice: 多比雅的
  rationale: 属格专名表示所属关系；采用“多比雅”作为 Τωβείας 的现代汉语音译，并以“的”标明这是他的婚礼。
- source_word: μετʼ εὐφροσύνης
  choice: 欢欢喜喜地
  rationale: 该介词短语表示婚礼伴随着喜乐；叠词形式符合现代汉语庆典语境，保留热烈、欢庆的意味。
- source_word: ἑπτὰ ἡμέρας
  choice: 七天
  rationale: 宾格表示延续时间；置于“举行了”之后即可自然表达婚礼庆典持续七天，无须另加“为期”。
