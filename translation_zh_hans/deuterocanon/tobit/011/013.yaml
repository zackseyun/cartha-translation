lexical_decisions:
- source_word: ἐλεπίσθη
  choice: 剥落了
  rationale: 该动词带有像薄片或鳞片一样脱落、剥离的形象；“剥落了”自然地保留这一具体意象，也符合被动语义。
- source_word: κανθῶν τῶν ὀφθαλμῶν
  choice: 眼角
  rationale: κανθός在眼部解剖语境中指眼睛的角部；现代汉语以“眼角”表达最自然。
- source_word: λευκώματα
  choice: 白膜
  rationale: 该复数名词指眼中发白的斑块或浑浊物；结合“剥落”的动作，“白膜”既易懂，也保留可见覆盖层的形象，不采用较临床化的术语。
- source_word: ἰδών
  choice: 一看见
  rationale: 将不定过去时分词按语境译为时间性表达；“一看见”还自然呈现看见儿子后立即发生的动作。
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: 就伏在儿子的颈项上
  rationale: 较贴近原文“落在/扑在他的颈项上”的传统拥抱表达，同时用“儿子的”消除汉语代词指向不清的问题；脚注说明其惯用含义。
