  yaml_path: translation/deuterocanon/tobit/011/014.yaml
  text: And she wept and said[a], “Blessed are you, O God, and blessed is your name forever, and blessed are all your holy angels,”
translation:
  language: zh_hans
  text: 她哭了，说：“神啊，你是当受称颂的；你的名永远[a]当受称颂；你所有的圣天使也都当受称颂。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“直到万世”；这个惯用语的意思是“永远”。
    reason: 说明原文惯用语的字面形式和正文所采用的自然中文表达。
lexical_decisions:
- source_word: ἔκλαυσεν
  choice: 她哭了
  rationale: 动词意为“哭、流泪”，其希腊语形式本身不标明性别；按本段叙事中的指代对象译为“她”，既符合语境，也避免现代汉语中主语含混。
- source_word: Εὐλογητὸς εἶ
  choice: 你是当受称颂的
  rationale: 保留第二人称直接向神发出的祝颂格式，并以现代中文自然表达其礼仪性和宣告语气；不简化为仅表示人的行为的“赞美你”。
- source_word: ὁ θεός
  choice: 神啊
  rationale: 此处为直接呼告；“神啊”清楚、庄重地传达祷告语气。
- source_word: τὸ ὄνομά σου
  choice: 你的名
  rationale: 直译这一常见的圣经表达，不把神的名所包含的身份、尊荣等意义解释性展开。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表示持续无尽的惯用语；“永远”是现代汉语最自然、准确的对应表达，并以脚注保留其字面形式。
- source_word: εὐλογημένοι
  choice: 当受称颂
  rationale: 延续前面的宣告式祝颂，使三个分句的重复结构清楚可见；这里不译成愿望式的“愿……蒙福”。
- source_word: πάντες
  choice: 所有……也都
  rationale: 完整传达其无一例外的总括意义，同时使中文句式流畅。
- source_word: οἱ ἅγιοι ἄγγελοί σου
  choice: 你所有的圣天使
  rationale: ἅγιοι直接修饰ἄγγελοι，故译为“圣天使”，不把它拆解为“圣徒，即天使”。
theological_decisions:
- issue: 向神发出的祝颂格式
  choice: 保留“你是当受称颂的”以及后续重复的“当受称颂”
  alternative: 译作“你当受赞美”或“愿你蒙福”
  rationale: 原文反复使用εὐλογητ-词族，形成宣告式的祝颂。所选译法既保留其神学和礼仪分量，也不把它改成纯粹赞美行为或祈愿语气。
translation_notes:
  register: 采用现代、庄重而易懂的祷告与颂赞语体。三个并列分句重复“当受称颂”，以保留希腊文的修辞结构。脚注标记置于“永远”之后，与所解释的短语直接对应。
