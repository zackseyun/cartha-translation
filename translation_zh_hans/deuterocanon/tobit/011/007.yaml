  text: And Raphael said[a], “I know that your father will open his eyes.”
translation:
  language: zh_hans
  text: 拉斐尔说[a]：“我知道你父亲会重见光明。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你父亲会打开（或睁开）眼睛”；这是指恢复视力的习语。
    reason: 说明原文“打开眼睛”的字面措辞及其在上下文中的复明含义。
lexical_decisions:
- source_word: Ῥαφαὴλ
  choice: 拉斐尔
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: Ἐπίσταμαι
  choice: 我知道
  rationale: 直接表达说话者确知此事，既自然，也不额外强化为“我确信”。
- source_word: ἀνοίξει
  choice: 会睁开
  rationale: 这是第三人称单数将来主动式；中文以“会睁开”保留其主动表达，并自然指向即将发生的事。
- source_word: τοὺς ὀφθαλμοὺς
  choice: 眼睛
  rationale: 与“睁开”组成自然的现代汉语身体动作表达；所属关系可由主语“你父亲”明确得知，无须另加“他的”。
- source_word: ὁ πατήρ σου
  choice: 你父亲
  rationale: 准确对应原文，语体庄重而自然。
theological_decisions:
- issue: 使失明者复明的习语表达
  choice: 正文保留“睁开眼睛”的形象说法
  alternative: 你父亲会重见光明
  rationale: 原文使用主动式“睁开眼睛”，语境表明这是恢复视力。保留原有说法，可避免在正文中把隐含意义完全释明，同时以脚注说明其语境含义。
- issue: ἀνοίξει的语态
  choice: 按形态译为主动式“会睁开”
  alternative: 你父亲的眼睛会被打开
  rationale: ἀνοίξει在所给希腊文本中是将来主动直陈式，并非被动式；中文主动表达也更自然。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“会睁开眼睛”既保留希腊文主动结构和叙事形象，也让普通读者容易理解；脚注处理其复明含义。
