  yaml_path: translation/deuterocanon/tobit/011/016.yaml
  text: And Tobit went out to meet his daughter-in-law[a], rejoicing and blessing God, at the gate of Nineveh. And those who saw him walking were amazed[b], because he could see.
translation:
  language: zh_hans
  text: 多比特满心欢喜，称颂上帝，出去到尼尼微城门迎接他的儿媳[a]。看见他行走的人都很惊讶[b]，因为他能看见了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文“νύμφη”既可指“新娘”，也可指“儿媳”；这里指多比特的儿媳撒辣。
    reason: lexical_alternative
  - marker: b
    text: 希腊文此处的名字形式是“多比亚”，但从下文众人因他能看见而惊讶来看，所指是父亲多比特。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 出去
  rationale: 直译叙事不定过去时所表达的外出动作；结合迎接来客的场景，现代汉语自然清楚。
- source_word: Τωβείας
  choice: 多比特
  rationale: 希腊文此处的名字形式通常可音译为“多比亚”，但下文说众人因他能看见而惊讶，叙事所指显然是刚恢复视力的父亲多比特。正文按人物所指译名，并以脚注保留文本形式上的张力。
- source_word: εἰς συνάντησιν
  choice: 迎接
  rationale: 该短语表示出去与来者相会；在家人归来这一语境中，“迎接”比单纯“见”更准确自然。
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: 他的儿媳
  rationale: νύμφη可指“新娘”或“儿媳”；此处撒辣是多比特儿子的妻子，因此正文采用合乎语境的“儿媳”，脚注注明词义范围。
- source_word: χαίρων
  choice: 满心欢喜
  rationale: 表达主语外出迎接时持续的喜悦状态，语言自然且保留分词的伴随意味。
- source_word: εὐλογῶν τὸν θεόν
  choice: 称颂上帝
  rationale: εὐλογέω用于人以上帝为对象时表示称颂、赞美；“称颂上帝”既贴近原词，也符合现代庄重汉语。
- source_word: πρὸς τῇ πύλῃ Νινευή
  choice: 来到尼尼微城门
  rationale: 该短语把行动定位在尼尼微城门旁或城门处；调整至句首并补出汉语所需的方位关系，使叙事顺畅而不改变地点信息。
- source_word: ἐθαύμαζον
  choice: 都很惊讶
  rationale: 未完成过去时描写旁观者持续的惊异反应；汉语以“都很惊讶”自然表达。
- source_word: οἱ θεωροῦντες αὐτὸν πορευόμενον
  choice: 看见他走路的人
  rationale: 保留旁观者看见他行走的具体画面，不将 πορευόμενον 弱化为泛指的“他出去”。
- source_word: ὅτι ἔβλεψεν
  choice: 因为他能看见了
  rationale: 贴近字面“因为他看见/能看见”，并用句末“了”表示与先前失明状态相比的变化，同时避免把“恢复视力”作为明说内容加入正文。
theological_decisions:
- issue: Τωβείας所指人物的身份
  choice: 正文译作父亲“多比特”
  alternative: 按希腊文名字形式译作“多比亚”，理解为儿子
  rationale: 紧接的原因从句说众人因他能看见而惊讶，这只与刚获医治的父亲多比特相合。为避免正文误导读者，按叙事所指译名；同时以脚注说明希腊文形式，保留原文证据。
- issue: ὅτι ἔβλεψεν是否明确表述视力恢复
  choice: 译作“因为他能看见了”
  alternative: 译作“因为他恢复了视力”或“因为他看见了”
  rationale: 上下文确实涉及视力恢复，但希腊文此处只直接说“他能看见/看见了”。所选译法以“了”提示状态变化，又不把上下文推论完全写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“称颂上帝”保留经文语域；句序按现代汉语调整，把地点提前，使多个伴随成分不显拖沓。正文中的[a]、[b]均与脚注对应。
