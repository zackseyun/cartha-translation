base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/009.yaml
  text: Then[a], after being conveyed to Jerusalem, and after sacrificing to the faithful God and offering thanks, and after doing something further for the place, indeed, when he came to the place and was struck with awe by its dignity and piety[c][b],
translation:
  language: zh_hans
  text: 后来，他被送到耶路撒冷，向信实的上帝献祭并献上感谢，还为那地方做了些别的事；后来到了那地方，他因那里的庄严和虔敬而深受震撼。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “还为那地方做了些别的事”：希腊文没有说明他具体做了什么。
    reason: lexical_alternative
  - marker: b
    text: “那地方”指耶路撒冷的圣地，很可能是圣殿区域；希腊文只说“地方”。
    reason: cultural_note
lexical_decisions:
- source_word: διακομισθεὶς
  choice: 被送到
  rationale: 保留分词的被动移送含义，不将其弱化为单纯“到达”，也不臆定具体交通方式。
- source_word: τῷ πιστῷ θεῷ
  choice: 向信实的上帝
  rationale: πιστός用于上帝时可指信实、可信赖；“信实”直接而庄重，并避免解释成原文未明说的“真神”。
- source_word: θύσας
  choice: 献祭
  rationale: 准确表达宗教礼仪中的祭献行动，且符合现代汉语习惯。
- source_word: χάριτας ἀποδιδοὺς
  choice: 献上感谢
  rationale: 表达“回报、呈上感谢”的惯用含义，也与献祭场景协调。
- source_word: τῶν ἑξῆς τι τῷ τόπῳ ποιήσας
  choice: 又为那地方做了某件别的事
  rationale: 保留τι所表达的不确定性以及行为惠及或关乎该地的与格关系，不猜测具体举动。[a]
- source_word: τὸν τόπον
  choice: 那地方
  rationale: 原文仅用τόπος；虽由语境可知指耶路撒冷的圣地，很可能是圣殿区域，正文仍保留其笼统措辞。[b]
- source_word: τῇ σπουδαιότητι
  choice: 庄严
  rationale: 在圣所语境中表达该地肃穆、郑重而可敬的特质，比“宏伟”更少偏向建筑外观。
- source_word: εὐσεβείᾳ
  choice: 虔敬
  rationale: 既可体现宗教敬虔，也可描述该处所呈现的敬神氛围，同时保留其所指略有开放的特点。
- source_word: καταπληγείς
  choice: 深感震撼
  rationale: 传达因强烈印象而惊叹、敬畏的意味，但不把情感范围收窄为单一的“敬畏”。
theological_decisions:
- issue: πιστός用于上帝时的译法
  choice: 信实的上帝
  alternative: 可信赖的上帝；真神
  rationale: “信实”贴近该形容词的通常语义；不采用“真神”，以免加入原文未明确表达的真假对比。
- issue: “那地方”的具体所指
  choice: 正文保留“那地方”
  alternative: 圣殿；圣所
  rationale: 上下文很可能指耶路撒冷圣殿区域，但原文使用宽泛的τόπος，因此不在正文中消除这一词汇层面的含混。
- issue: σπουδαιότης与εὐσέβεια所修饰或体现的范围
  choice: 译作“那里的庄严和虔敬”
  alternative: 它的庄严和虔敬；那里庄严虔敬的景象
  rationale: 希腊文以两个抽象名词说明使他震撼的因素，未明言究竟专指建筑、礼仪、人员还是整体氛围；“那里”保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以分号梳理希腊文连续分词结构，避免中文句子过度拖沓；同时保留“某件别的事”和“那地方”的原文含混。所有脚注标记均已置于正文。
