  yaml_path: translation/deuterocanon/3_maccabees/001/015.yaml
  text: For your dwelling place is the heaven of heaven[b][a], unreachable by men.
translation:
  language: zh_hans
  text: 因为，你的居所是世人无法企及的天上之天[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“天之天”，是闪语式的最高级表达，可理解为“至高之天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  choice: 居所
  rationale: 指居住之处；“居所”简洁、庄重，并保留具体的处所含义。
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: 天上之天
  rationale: 保留原文闪语式最高级表达的形态与庄重感，同时比生硬的“天之天”更符合现代汉语；其含义可理解为至高之天。
- source_word: ἀνέφικτος
  choice: 无法企及
  rationale: 表达不可达到、不可接近之意；“企及”既涵盖抵达也体现超越人类能力的语气。
- source_word: ἀνθρώποις
  choice: 世人
  rationale: 原词泛指人类而非特指男性；“世人”自然、庄重，准确保留其普遍范围。
- source_word: γὰρ
  choice: 因为
  rationale: 明确保留原文与上文之间的解释或论证关系。
theological_decisions:
- issue: οὐρανὸς τοῦ οὐρανοῦ的闪语式最高级表达
  choice: 天上之天
  alternative: 至高之天
  rationale: 正文保留原文独特意象，不将其完全解释化；脚注说明它通常表达最高层的天。
- issue: ἀνέφικτος ἀνθρώποις所表达的神圣超越性
  choice: 世人无法企及
  alternative: 人无法到达
  rationale: 不把原文扩展为关于神本体不可知的系统教义，只忠实表达神居所非人力所能达到。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“天上之天”保留原文的传统意象；“世人”避免把泛指人类误解为仅指男性。
