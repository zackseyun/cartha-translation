  to: 犹太人从长老议会[a]和众长老中派人到他那里，向他致意，送上宾礼[b]，并因所发生的事而欢喜；这使他更加急于尽快到他们那里去。
  rationale: 修订仅澄清ξένια的文化语义，并以更自然、较少强化因果的汉语衔接表达συνέβη所引出的结果。其余措辞保留原译对原文句法、群体区分和叙事庄重语体的忠实处理。
