base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/008.yaml
  text: But when the Jews had sent to him[a], from the council of elders and the elders, men to greet him, bring gifts of hospitality, and rejoice over what had happened[b], it happened that he became all the more eager to come to them as quickly as possible.
translation:
  language: zh_hans
  text: 犹太人从长老议会[a]和众长老中派人到他那里，向他致意，送上宾礼[b]，并因所发生的事而欢喜；这使他更加急于尽快到他们那里去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长老议会”也可译作“元老院”；希腊词γερουσία指由长老组成的制度性机构。
    reason: lexical_alternative
  - marker: b
    text: “宾礼”所译的希腊词ξένια，指与接待宾客或宾主礼谊有关的礼物。
    reason: cultural_note
lexical_decisions:
- source_word: διαπεμψαμένων
  choice: 派人到他那里
  rationale: 该分词属格独立结构，表示犹太人先行差派代表；“派人到他那里”在现代汉语中自然，也不额外限定使者身份。
- source_word: γερουσίας
  choice: 长老议会
  rationale: 指由长老组成的制度性议事机构；此译既传达机构性质，也避免“元老院”可能带来的罗马政治联想。
- source_word: πρεσβυτέρων
  choice: 众长老
  rationale: 原文将其与γερουσία并列，译文保留两者的区别，不将制度性议会与长老群体合并。
- source_word: τοὺς ἀσπασομένους αὐτόν
  choice: 向他问安
  rationale: ἀσπάζομαι在此表示使者前往致意；“问安”庄重自然，并保留礼节性意味。
- source_word: ξένια
  choice: 款待宾客的礼物
  rationale: 该词指与待客或宾主礼谊相关的礼物；此译比泛称“礼物”更能体现其文化含义。
- source_word: κομιοῦντας
  choice: 送上
  rationale: 语境是使者把礼物带给对方；“送上”兼顾携带和呈献之意，符合汉语表达。
- source_word: ἐπὶ τοῖς συμβεβηκόσιν
  choice: 为所发生的事
  rationale: 原文笼统指此前发生的事件，译文不擅自说明具体事件或原因。
- source_word: χαρησομένους
  choice: 欢喜
  rationale: 未来分词表达使者此行的目的或预期行动；“欢喜”保留其积极情感而不过度解释为祝贺。
- source_word: συνέβη
  choice: 于是
  rationale: 该非人称动词引出由此产生的结果；汉语用“于是”自然衔接前因与后果，避免生硬直译“事情发生了”。
- source_word: μᾶλλον ... προθυμηθῆναι
  choice: 越发急切，想要
  rationale: “越发”体现比较和加强语气，“急切，想要”传达προθυμέομαι所含的热切意愿。
- source_word: ὡς τάχιστα
  choice: 尽快
  rationale: 准确表达以最快速度或尽早行动的惯用含义，简洁自然。
- source_word: πρὸς αὐτοὺς παραγενέσθαι
  choice: 到他们那里去
  rationale: 表示来到或抵达他们所在之处；此译保留指向性，且符合现代汉语习惯。
