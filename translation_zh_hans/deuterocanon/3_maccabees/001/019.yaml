  text: We trampled the house of holiness[b][a], as the houses of abominations are trampled.
translation:
  language: zh_hans
  text: 我们践踏了那座奉献为圣的殿宇[a]，如同人们践踏可憎之物[b]的屋宇一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“成圣／奉献为圣之房屋”，也可译作“圣洁之殿”或“圣所”。这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: “可憎之物”所译的希腊词十分罕见，也可能指“当毁灭之物”，或较广义的“受咒诅、令人厌恶之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν
  choice: 我们践踏了
  rationale: 保留动词“践踏”的具体而强烈的形象；亵渎是其结果，但不是在译文中直接替代原有动作。
- source_word: τὸν οἶκον τοῦ ἁγιασμοῦ
  choice: 那分别为圣的殿
  rationale: οἶκος 在语境中指圣殿；译作“殿”比直译“房屋”自然，同时“分别为圣”保留 ἁγιασμός 所表达的奉献、成圣或圣洁含义。
- source_word: ὡς
  choice: 如同……一样
  rationale: 明确表达原文引出的比较关系，符合现代汉语习惯。
- source_word: καταπατοῦνται
  choice: 被人践踏
  rationale: 保留现在时被动语态所表达的一般性情形；汉语补入泛指施事“人”，使句子自然，不限定具体行动者。
- source_word: τῶν προσολοθρευμάτων
  choice: 可憎之物的
  rationale: 该罕见词可能指可憎、受咒诅或注定毁灭之物；正文采用较宽泛且符合贬斥语气的“可憎之物”，并以脚注保留词义的不确定性。
theological_decisions:
- issue: 如何指称神圣建筑
  choice: 那分别为圣的殿
  alternative: 圣所；圣洁之殿；分别为圣的房屋
  rationale: 原文并非仅用通常的“圣殿”称谓，而是“分别为圣之房屋”这一描述性短语。译文既明确语境中的建筑，又保留其被分别为圣的修辞重点。
- issue: 如何翻译罕见且带贬义的 προσολοθρευμάτων
  choice: 可憎之物
  alternative: 当毁灭之物；受咒诅之物；污秽之物
  rationale: 原词确切含义不易断定。“可憎之物”传达其宗教和道德上的厌恶色彩，而不把词义限定为某一技术性的毁灭概念；其他可能性见脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“践踏”在前后两处保持一致，以保存原文鲜明的对照；“殿”和“庙宇”分别表现神圣建筑与可憎对象所属建筑之间的反差，同时避免将罕见词的含义解释得过窄。
