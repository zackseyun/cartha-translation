base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/020.yaml
  text: And the mothers and nurses besides these[a], leaving behind the newborn children, some in their houses and others in the streets[b], kept gathering without turning back to the all-supreme sanctuary.
translation:
  language: zh_hans
  text: 此外，母亲和乳母[a]把刚出生的孩子留了下来，有的留在家中，有的留在街上；她们头也不回地纷纷聚集到至高无上的圣所[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乳母”也可译作“哺乳婴儿的妇人”；希腊语此词常特指给婴儿喂奶并照料婴儿的妇女。
    reason: lexical_alternative
  - marker: b
    text: “至高无上的圣所”也可译作“极其崇高的圣殿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νεογνὰ τῶν τέκνων
  choice: 刚出生的孩子
  rationale: νεογνά指初生者；结合τῶν τέκνων，以现代汉语“刚出生的孩子”表达，清楚而保留原文的悲怆感。
- source_word: τιθηνοί
  choice: 乳母
  rationale: 该词指照料婴儿的妇女，常特指哺乳婴儿的乳母；“乳母”比泛称“保姆”更贴近希腊语。
- source_word: παραλείπουσαι
  choice: 留了下来
  rationale: 分词表示将孩子留在原处，不必然包含道德谴责；避免用“遗弃”擅自强化语气。
- source_word: ἄλλως καὶ ἄλλως, αἱ μὲν…αἱ δὲ…
  choice: 有的留在家中，有的留在街上
  rationale: 后续的对应分句具体说明“分别、各自”的情形，汉语用“有的……有的……”自然呈现其分配结构。
- source_word: ἀγυιάς
  choice: 街上
  rationale: 指城中的街道或巷道；“街上”是清楚自然的现代汉语。
- source_word: ἀνεπιστρέπτως
  choice: 毫不回头
  rationale: 保留“不转回去”的具体意象，也表达她们径直前往圣所的坚决行动。
- source_word: ἠθροίζοντο
  choice: 不断聚集到
  rationale: 未完成时态呈现持续进行的聚集；“不断”传达其延续性。
- source_word: πανυπέρτατον ἱερόν
  choice: 至高无上的圣所
  rationale: πανυπέρτατον是强化的最高级，ἱερόν可指圣所或圣殿范围；此译保留隆重语气，同时不把它误作直接用于上帝的固定称号。
theological_decisions:
- issue: πανυπέρτατον ἱερόν的崇高措辞
  choice: 至高无上的圣所
  alternative: 极其崇高的圣殿
  rationale: 原文以强化最高级修饰圣所，宜保留其修辞力度；“至高无上的”在此修饰圣所，不将其处理为上帝的专名或神学称号。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“毫不回头”保留原文动作意象；分号用于区分留下孩子的情形与随后持续聚集的主要行动。
