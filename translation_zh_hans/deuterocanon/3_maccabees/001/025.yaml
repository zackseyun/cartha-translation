  text: And the multitude, as before, kept on with these men, pleading; but the elders around the king were trying in many ways to turn his arrogant mind away from the plot he had conceived.
translation:
  language: zh_hans
  text: 众人仍像先前一样，同这些人一道恳求；但王身边的长老们以各种方式试图使他那骄横的心意转离他所构想的阴谋。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πλῆθος
  choice: 众人
  rationale: 指聚集的人群；用“众人”比“群众”更符合庄重叙事语体。
- source_word: ὡς ἔμπροσθεν
  choice: 仍像先前一样
  rationale: 保留与此前行动的连续性。
- source_word: τούτοις ἀνεστρέφετο δεόμενον
  choice: 跟着这些人恳求
  rationale: ἀναστρέφω 在此表示与这些人一同持续活动；结合 δεόμενον，译出众人跟随他们继续恳求的意思，同时保留 τούτοις 的明确指向。
- source_word: οἱ ... πρεσβύτεροι
  choice: 长老们
  rationale: πρεσβύτεροι 可指年长而有地位的人；“长老”保留其身份含义，不额外指定官职。
- source_word: πολλαχῶς ἐπειρῶντο
  choice: 千方百计地劝
  rationale: 表达他们以多种方式反复尝试；结合后接不定式，用自然汉语译为极力劝阻。
- source_word: τὸν ἀγέρωχον αὐτοῦ νοῦν
  choice: 他那傲慢的心
  rationale: ἀγέρωχος 在此为贬义的高傲、骄横；νοῦς 指意念或心思，译作“心”较自然。
- source_word: τῆς ἐντεθυμημένης ἐπιβουλῆς
  choice: 心中所图谋的恶计
  rationale: ἐπιβουλή 指蓄意谋害或阴谋；ἐνθυμέομαι 表明这计划已在心中形成。
