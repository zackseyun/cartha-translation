base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/011.yaml
  text: But when some said that this ought not to be done[a], because not even the Gentiles enter, nor all the priests, but only the high priest who is over all—and he only once a year—he would not be persuaded at all.
translation:
  language: zh_hans
  text: 但有人说，这事不应当做[a]，因为连外邦人也不得进入，众祭司也不得进入，只有统管众人的大祭司可以进入，而且他一年也只能进去一次；王却无论如何也不肯被说服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“做这事并不合宜。”希腊文着重表达是否合宜、适当。
    reason: 保留καθήκειν所含“合宜、适当”的词义层次。
lexical_decisions:
- source_word: μὴ καθήκειν γίνεσθαι τοῦτο
  choice: 这事不应当做
  rationale: καθήκειν强调合宜、适当或应当；结合γίνεσθαι τοῦτο和具体行动语境，译为“这事不应当做”自然且保留规范性含义。
- source_word: τοῖς ἔθνεσιν
  choice: 外族人
  rationale: 圣殿准入语境中的ἔθνη指非犹太人；“外族人”在现代汉语中清楚自然，又不把词义抽象化为“列国”。
- source_word: εἰσιέναι
  choice: 进去
  rationale: 该动词表示进入某处；“进去”贴合上下文，并以“不能”表达后文所说明的准入限制。
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: 众祭司也不能
  rationale: 原文否定的范围涉及全体祭司，与随后“只有……大祭司”形成递进对比；汉语补出“不能”使省略结构清晰。
- source_word: μόνῳ τῷ προηγουμένῳ πάντων ἀρχιερεῖ
  choice: 只有统管众人的大祭司
  rationale: προηγουμένῳ πάντων指居首并领导众人的那一位；“统管众人的大祭司”简洁保留其职分与位阶。
- source_word: κατ᾽ ἐνιαυτὸν ἅπαξ
  choice: 每年也只能进去一次
  rationale: 基本意义为“每年一次”；结合排他性限制补出“只能进去”，使汉语关系明确而不改变原意。
- source_word: οὐδαμῶς ἐπείθετο
  choice: 怎么也不肯听从
  rationale: οὐδαμῶς加强否定，ἐπείθετο表示受劝服或听从；“怎么也不肯听从”自然表达持续而强烈的不受劝服。
theological_decisions:
- issue: 圣所准入限制的层级
  choice: 保留从外族人、众祭司到大祭司每年一次的递进限制
  alternative: 笼统译为这事不合法，而不逐层呈现圣所准入规定
  rationale: 原文以进入圣所的身份和次数限制作为反对理由；逐层保留可呈现其礼仪背景，同时不引入经文以外的教义说明。
- issue: ἐπείθετο的主语指代
  choice: 在中文正文中依上下文明确为“王”
  alternative: 保留代词“他”
  rationale: 本节希腊文只有阳性单数代词性动词形式，具体所指来自上下文；中文以“王”避免孤立经节中的指代含混，但不增加其行为的神学评价。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“外族人”避免生硬术语，“大祭司”沿用通行宗教称谓；分号保留反对理由与王之回应之间的转折。
