  yaml_path: translation/deuterocanon/3_maccabees/001/033.yaml
  text: They had been instructed to obtain support[a], and they loathed those who withdrew from them, judging them as enemies of the nation[b], and depriving them of common association and serviceability.
translation:
  language: zh_hans
  text: 他们早已为获得援助[a]而受过训练；他们厌恶那些离开他们的人，把这些人视为本民族的仇敌，并剥夺他们正常交往和发挥实际作用的机会[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “援助”也可译作“帮助”或“扶助”。
    reason: lexical_alternative
  - marker: b
    text: “正常交往和发挥实际作用”指被排除在通常的社会往来及共同体生活中的有益参与之外；原文后一个词也可指“实际益处”或“有用性”。
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: ἐνπαιδεῖς τε καθηστήκεισαν
  choice: 素来受过教导
  rationale: 合并表达形容词与过去完成时所指的既成、持续状态；“受过教导”自然且保留教育、训导之意。
- source_word: ἀντιλήψεως τεύξεσθαι
  choice: 要得到援助
  rationale: τεύγχανω接属格表示得到、获得；ἀντίληψις泛指援助或扶助，不限定为物质救济。
- source_word: ἀποχωροῦντας ἐξ αὐτῶν
  choice: 那些离开他们的人
  rationale: 保留从群体中退出、疏离的关系含义，同时避免擅自断定退出的具体方式。
- source_word: ἐβδελύσσοντο
  choice: 厌恶
  rationale: 表达强烈憎恶和排斥；现代汉语庄重而易懂。
- source_word: ὡς πολεμίους τοῦ ἔθνους ἔκρινον
  choice: 把这些人视为本民族的仇敌
  rationale: ἔθνος在此指其共同族群；“本民族”明确其内部共同体视角，而“仇敌”保留强烈的敌对判断。
- source_word: τῆς κοινῆς συναναστροφῆς καὶ εὐχρηστίας ἐστέροῦν
  choice: 剥夺他们参与日常交往、互相效力的机会
  rationale: συναναστροφή指共同或日常社会交往；εὐχρηστία语义较压缩，可指有用、效用或有益参与。“互相效力”保留群体生活中的实际助益，又以脚注说明其不确定性。
theological_decisions:
- issue: ἔθνος所表达的共同体身份
  choice: 本民族
  alternative: 本族人民
  rationale: 经文描述犹太共同体内部的团结与排斥；“本民族”保留集体身份和政治社会色彩，但不引入现代民族主义观念。
- issue: κοινῆς συναναστροφῆς καὶ εὐχρηστίας所指的社会排斥
  choice: 参与日常交往、互相效力的机会
  alternative: 共同交往和实际益处
  rationale: 原文既涉及正常社会关系，也涉及共同体生活中的有益作用；译文避免使用可能带有后世宗教制度色彩的“团契”，并用脚注保留εὐχρηστία的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“素来受过教导”表达既成状态；末句适度意译，使社会排斥的含义清楚，同时以脚注保留εὐχρηστία的语义不确定性。
