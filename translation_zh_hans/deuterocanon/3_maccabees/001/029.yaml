  yaml_path: translation/deuterocanon/3_maccabees/001/029.yaml
  text: For it seemed that not only the people[a], but even the walls and the whole ground, were resounding[c][b], since then all things were being changed to death instead of the profanation of the place.
translation:
  language: zh_hans
  text: 因为仿佛不只是人群，连城墙和整个地面也都在回响；那时一切[a]都在转变为死亡，以代替那地方[b]遭受亵渎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切”译自希腊语的宽泛说法；按上下文也可理解为“所有人”，但原文并未明确限于人。
    reason: lexical_alternative
  - marker: b
    text: “那地方”在上下文中指神圣区域，很可能是圣殿范围；希腊原文并未在此直接使用“圣殿”一词。
    reason: cross_reference
lexical_decisions:
- source_word: δοκεῖν γὰρ ἦν
  choice: 因为听起来，仿佛
  rationale: 这是无人称表达，描述叙述者的感受。结合下文的声音意象，译作“听起来，仿佛”比生硬的“似乎”更自然，同时保留感知性的语气。
- source_word: τοὺς ἀνθρώπους
  choice: 人群
  rationale: 原词泛指人；本段语境是众人的声音，因此用集合性的“人群”最贴切。
- source_word: τὰ τείχη καὶ τὸ πᾶν ἔδαφος
  choice: 城墙和整个地面
  rationale: 按原文保留具体的建筑与地面意象；τείχη为城墙或围墙，ἔδαφος为地面。
- source_word: ἠχεῖν
  choice: 在回响
  rationale: 该动词表示发声、鸣响或回荡；“回响”能表现声音仿佛从人群、城墙和地面一同传出的夸张描写。
- source_word: τῶν πάντων
  choice: 众人
  rationale: 形式上可泛指“一切”或“所有人”；结合宁死也不容圣地受辱的语境，以“众人”作主体在汉语中最通顺，但以脚注保留语法上的广义可能。
- source_word: τότε θάνατον ἀλλασσομένων ἀντὶ τῆς τοῦ τόπου βεβηλώσεως
  choice: 那时，众人宁愿以死亡代替让那地方遭受亵渎
  rationale: ἀλλάσσω与ἀντί构成不寻常而鲜明的替换意象。此译保留“以死亡代替”的表达，并用“宁愿……代替……”传达众人选择死亡而不接受圣地被亵渎的对比。
- source_word: βεβηλώσεως
  choice: 亵渎
  rationale: 该词指使神圣之物沦为凡俗或遭到污辱；“亵渎”庄重且符合宗教语境。
- source_word: τοῦ τόπου
  choice: 那地方
  rationale: 严格保留原文较宽泛的“地方”，不直接增译为“圣殿”或“圣所”。
theological_decisions:
- issue: τοῦ τόπου所指为何
  choice: 那地方
  alternative: 圣殿；圣所
  rationale: 上下文很可能指神圣区域或圣殿范围，但希腊文只说“那地方”。正文保留源文的宽泛说法，以脚注交代语境，避免将推定的具体所指写入正文。
- issue: τῶν πάντων是“众人”还是“一切”
  choice: 众人
  alternative: 一切；所有的人和事物
  rationale: 希腊文形式本身较宽泛，但分词所表达的意志性选择更自然地以人作主体。正文采用“众人”，脚注保存源文的广义可能，不将修辞张力完全抹平。
- issue: 死亡与亵渎之间的关系
  choice: 宁愿以死亡代替让那地方遭受亵渎
  alternative: 一切都变成死亡，而不是那地方受亵渎；众人被交给死亡
  rationale: 原句的ἀλλάσσω搭配θάνατον和ἀντί较为罕见，核心是以死亡取代亵渎。正文用可理解的汉语呈现这种选择关系，同时不把它扩展成特定的殉道教义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“因为听起来，仿佛”衔接前文原因并引出声音意象；分号保留原句前半的夸张描写与后半解释之间的关系。正文避免生硬直译“众人把死亡换作亵渎”，但以“以死亡代替”保存原文罕见的替换隐喻。
