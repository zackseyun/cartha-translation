base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/027.yaml
  text: Therefore[a], when those around him saw these things[b], they turned to join our people in calling on the one who has all power to help in the present circumstances and not overlook the lawless and arrogant deed.
translation:
  language: zh_hans
  text: 因此，他身边的人看见这些事，也转而同我们的人[a]一起呼求那位拥有一切权能的那一位，求他援助眼下的危局[b]，不要坐视这无法无天、狂妄自大的行径。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“同我们这边的（人）一起”，所指对象没有明说。
    reason: lexical_alternative
  - marker: b
    text: 或译：“援助在场的人。”希腊文也可指当前的事情或处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: 这些事
  rationale: 保留复数指示语，承接前文众人亲眼目睹的事件。
- source_word: οἱ περὶ αὐτὸν ὄντες
  choice: 他身边的人
  rationale: 贴近“在他周围的人”的字面意思，同时不把这些人的身份过度限定为侍从或官员。
- source_word: θεωροῦντες
  choice: 看见
  rationale: 在此表示亲眼看见、目睹；译作“看见”自然明晰。
- source_word: ἐτράπησαν εἰς τὸ ... ἐπικελεῦσθαι
  choice: 转而……呼求
  rationale: 既保留行动方向发生转变的意味，也表达向上帝祈求援助的语境。
- source_word: σὺν τοῖς ἡμετέροις
  choice: 同我们的人一起
  rationale: 希腊文直译为“同我们这边的人”，所指对象未明说；正文按叙述者所属群体译为“我们的人”，并以脚注保留含混性。
- source_word: τὸν πὰν κράτος ἔχοντα
  choice: 那位拥有一切权能者
  rationale: 按描述性短语直译，不将其替换为原文未明确使用的固定神学称号。
- source_word: τοῖς παροῦσιν ἐπαμῦναι
  choice: 援助眼下的危局
  rationale: 将中性复数理解为当前所面临的情势，并用自然汉语表达“为眼前之事施以援助”；另一种可能是指援助在场的人。
- source_word: μὴ περιιδεῖν
  choice: 不要坐视
  rationale: 原词可指看着而不加干预；“不要坐视”比单纯的“不要忽略”更能体现祈求上帝不可任其发生的语气。
- source_word: τὴν ἄνομον καὶ ὑπερήφανον πρᾶξιν
  choice: 这无法无天、狂妄自大的行径
  rationale: 分别传达ἄνομος的违法悖逆和ὑπερήφανος的傲慢狂妄；“行径”符合此处强烈的负面评价。
theological_decisions:
- issue: 神的描述τὸν πὰν κράτος ἔχοντα
  choice: 那位拥有一切权能者
  alternative: 全能者；掌管一切权柄的那一位
  rationale: 原文以属性描述神，并未使用固定专名；正文保留这一描述方式，避免额外引入后期定型称号。
- issue: σὺν τοῖς ἡμετέροις所指的群体
  choice: 同我们的人一起
  alternative: 同我们这边的人一起；同属于我们的人一起
  rationale: 第一人称复数大概指叙述者认同的犹太群体，但希腊文省略了中心名词，因此以脚注提示其指代并非明说。
- issue: τοῖς παροῦσιν的所指
  choice: 眼下的危局
  alternative: 在场的人
  rationale: 该短语既可指当前的事情或处境，也可能指在场的人；正文采用较符合祷告语境的处境义，同时以脚注保存另一种语法可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“转而……呼求”保留叙事中的态度转变；“坐视”传达看见恶行却任其继续的意味。所有真实的指代和语法歧义均在脚注中保留。
