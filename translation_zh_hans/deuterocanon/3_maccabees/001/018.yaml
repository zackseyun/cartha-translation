lexical_decisions:
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 以自然、凝练的现代汉语表达带否定的目的或防止结果之意，同时保留本句承接上文的从属结构。
- source_word: καυχήσωνται
  choice: 自夸
  rationale: 表达带有得意和自我抬高意味的夸耀，语气庄重而不古奥。
- source_word: οἱ παράνομοι
  choice: 不法之人
  rationale: 保留 παράνομος 与法律、法度相悖的具体含义，不泛化为一般性的“恶人”。
- source_word: ἐν θυμῷ αὐτῶν
  choice: 在盛怒中
  rationale: θυμός 可指怒气、愤怒或暴烈激情；“盛怒”传达此处较强的情绪力度，同时保留介词短语的表达。
- source_word: μηδὲ
  choice: 也不
  rationale: 自然连接第二个否定并列成分，与前面的“免得……自夸”相呼应。
- source_word: ἀγαλλιάσωνται
  choice: 欢欣
  rationale: 表达强烈的喜悦或得意，较普通的“高兴”更符合原文较高的语体，又不预先解释为军事性的“庆胜”。
- source_word: ἐν ὑπερηφανίᾳ γλώσσης αὐτῶν
  choice: 因自己舌头的狂傲
  rationale: “狂傲”体现 ὑπερηφανία 所含的傲慢、凌人意味；保留“舌头”的原文意象，同时以“因”表达此处可理解为欢欣所凭借或所表现的方面。
- source_word: λέγοντες
  choice: 说道：
  rationale: 该分词引出下一节的直接引语；用冒号清楚表示话语尚待下文接续。
