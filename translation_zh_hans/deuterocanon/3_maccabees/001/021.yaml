base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/021.yaml
  text: And varied was the plea of those who had gathered for this[b][a], concerning those who were being impiously handed over by him.
translation:
  language: zh_hans
  text: 为此聚集的人，为那些正遭他以亵渎神圣的方式加害[b]的人，发出各式各样的恳求[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求”也可译作“祈求”或“哀求”。
    reason: lexical_alternative
  - marker: b
    text: “以亵渎神圣的方式”也可译作“不敬神地”或“邪恶地”；原词兼有违背神圣与道德秩序的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποικίλη
  choice: 各式各样
  rationale: 该形容词作表语，表示众人的恳求形式多样；译文调整语序，使现代汉语自然流畅。
- source_word: δέησις
  choice: 恳求
  rationale: 指迫切的请求或祈求；“恳求”保留其强烈语气，又不武断限定为直接向上帝祷告。
- source_word: συλλεγέντων
  choice: 聚集的人
  rationale: 保留不定过去时被动分词的聚集含义；汉语未明说召集者，因为希腊文也未交代施事者。
- source_word: εἰς τοῦτο
  choice: 为此
  rationale: 简洁保留原文的目的表达，不额外说明上下文所指的具体目的。
- source_word: ἐπὶ τοῖς ... κατεγχειρουμένοις
  choice: 为那些……遭……加害的人
  rationale: ἐπί加与格表示恳求所关切的对象；κατεγχειρουμένοις含落入某人手中、受其制伏或侵害之意，“遭……加害”在本处较自然，同时避免把动作过窄地限定为移交。
- source_word: ἀνοσίως
  choice: 以亵圣方式
  rationale: 该副词表示违背神圣、宗教义务或正当秩序；结合圣殿语境，“亵圣”比泛泛的“邪恶”更能保留其宗教和道德色彩。
- source_word: ὑπʼ ἐκείνου
  choice: 遭他
  rationale: 指回上文的男性人物；用“他”符合现代汉语指代习惯，不增添原文没有的称谓。
theological_decisions:
- issue: δέησις是否明确译作向上帝的祷告
  choice: 恳求
  alternative: 祈祷
  rationale: 原词可用于祈求或请愿，但本句本身没有明示受词；采用“恳求”以保留这种开放性。
- issue: ἀνοσίως的宗教与道德色彩
  choice: 以亵圣方式
  alternative: 邪恶地／不敬神地
  rationale: 本段涉及对圣殿及相关人员的侵犯，译为“亵圣”保留神圣秩序遭冒犯的意味，但脚注列出较宽泛的可能译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免希腊语名词化结构造成生硬，改用“发出了……恳求”的汉语句式；“为……的人”表达其关切对象，不把动作误限为法律意义上的“移交”。
