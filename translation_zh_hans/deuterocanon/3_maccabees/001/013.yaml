  text: And he inquired for what reason no one among those present had prevented him from entering any sanctuary[a].
translation:
  language: zh_hans
  text: 他询问，在场的人为什么没有一个拦阻他进入任何一处圣域[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“每一处神圣区域”。希腊语 τέμενος 泛指划作神圣用途的场所或区域，不一定专指圣殿建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπυνθάνετο
  choice: 询问
  rationale: 该词表示打听、询问信息；“询问”既保留较庄重的语气，也符合现代汉语表达。未将未完成时机械译出，以免凭上下文不足而加入“不断”等持续意味。
- source_word: διὰ τίνα αἰτίαν
  choice: 为什么
  rationale: 原短语直指原因；现代汉语用“为什么”自然明确，与较生硬的“出于什么缘故”意义相当。
- source_word: αὐτὸν εἰσερχόμενον
  choice: 他进入……时
  rationale: 现在分词与宾格代词相连，描写他进入时无人加以阻止；此译保留时间情境，并与后面的“阻拦他”自然衔接。
- source_word: πᾶν τέμενος
  choice: 任何一处圣域
  rationale: 无冠词的 πᾶν 在否定语境中可自然表达“任何一处”；τέμενος泛指划作神圣用途的区域或圣所，不必限定为某座圣殿建筑。“圣域”兼顾其空间范围和宗教性质。
- source_word: οὐθεὶς ἐκώλυσεν
  choice: 竟没有一个阻拦
  rationale: κωλύω意为阻止、拦阻；“没有一个”清楚保留绝对否定，“竟”传达问话中对无人阻止这一事实的诧异，但不改变命题内容。
- source_word: τῶν παρόντων
  choice: 在场的人
  rationale: 该部分属格表示无人采取行动的群体范围；汉语用“在场的人……没有一个”自然体现其部分属格关系。
