  text: 他做完这事，又把礼物分赠给众圣所，使受他统治的人都受到鼓舞。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας δὲ τοῦτο
  choice: 他做完这事
  rationale: 不定过去时分词表示先于主句动作发生；“做完这事”自然呈现动作次序，并保留 τοῦτο 对上文的回指。δέ 在此主要承接叙事，不必机械译出。
- source_word: τοῖς τεμένεσι
  choice: 给各处圣所
  rationale: τέμενος 指划归神圣用途的场所或境域；“圣所”既自然庄重，也避免把它过窄地限定为某种具体建筑。“各处”体现复数。
- source_word: δωρεὰς
  choice: 礼物
  rationale: δωρεά 表示礼物或恩赠；此处是君王赠予圣所的财物，“礼物”不额外强化原文未明说的祭祀含义。
- source_word: ἀπονείμας
  choice: 分赠
  rationale: 该词含分配、划给或授予之意；“分赠”同时表达向多个圣所分配并赠予礼物。
- source_word: εὐθαρσεῖς
  choice: 振作起来
  rationale: εὐθαρσής 表示有勇气、安心或精神振奋；结合使役结构，用“振作起来”自然表达其所达到的良好精神状态，同时不把意义过度收窄为理性的“自信”。
- source_word: τοὺς ὑποτεταγμένους
  choice: 归他统治的人
  rationale: 完成时被动分词指已处于其权柄之下的人；此译准确表达政治隶属关系，又比“臣民”略少制度性限定。
- source_word: κατέστησεν
  choice: 使……起来
  rationale: καθίστημι 在此为使役用法，意为使人进入某种状态；中文以“使……振作起来”自然对应。
