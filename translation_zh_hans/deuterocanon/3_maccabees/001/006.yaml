  text: But after gaining control of the plot[b][a], he decided to visit the neighboring cities and encourage them.
translation:
  language: zh_hans
  text: 但他控制住那场阴谋后[a]，便决定前往邻近各城，劝勉当地的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “控制住那场阴谋”也可译作“制伏了那场阴谋”或“挫败了那场阴谋”。希腊语可指对敌对的谋划取得优势。
    reason: lexical_alternative
  - marker: b
    text: “劝勉”也可译作“鼓励”或“呼吁”。希腊语动词的含义较宽；“当地的人”是按中文表达补出的隐含对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρατήσας
  choice: 制伏了……之后
  rationale: 该不定过去时分词表示先于主句的行动；κατακρατέω在此支配属格，含取得优势、控制或压制之意。“制伏”自然表达胜过敌对图谋，同时不具体断言所用手段。
- source_word: ἐπιβουλῆς
  choice: 那场阴谋
  rationale: ἐπιβουλή指敌意的谋划或图谋。“阴谋”符合上下文，也保留其敌对性质；“那场”使中文表达自然。
- source_word: ἔκρινεν
  choice: 决定
  rationale: κρίνω与不定式连用时可表示作出决定，而非司法意义上的审判。
- source_word: τὰς πλησίον πόλεις
  choice: 邻近的各城
  rationale: πλησίον在此表空间上的接近；“邻近的各城”简洁、庄重，也保留复数。
- source_word: ἐπελθὼν
  choice: 前往
  rationale: 该分词表示到那些城去，与παρακαλέσαι构成相伴行动。“前往”保留移动含义，不额外赋予正式访问的意味。
- source_word: παρακαλέσαι
  choice: 劝勉那里的人
  rationale: παρακαλέω语义范围包括劝勉、鼓励、呼吁等。原文语法上以各城为所到之处，受劝者由语境隐含；中文补出“那里的人”以避免把城市本身拟人化，同时用脚注保留动词的广泛语义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文先制伏阴谋、后作决定并前往各城的行动次序；避免把“前往”强化为官方访问，也不把παρακαλέω限定为单一政治或军事行动。
