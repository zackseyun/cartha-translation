revisions:
- from: 但有些人轻率地鄙弃维系城中虔敬的支柱[a]，欣然委身投靠，以为自己会因将来与王交往[b]而分享某种莫大的声望。
  to: 但有些人轻率地鄙弃维系这城虔敬的支柱[a]，轻易地把自己交付出去，以为日后与王交往[b]，自己便可有份于莫大的声望。
  rationale: 修订避免把“轻易地交出自己”解释为欣喜而忠贞地投靠某一方，同时保留原文未明说的交付对象。句末改用“有份于”自然表达对声望的预期参与；脚注收窄为原词可支持的社交关系范围。
