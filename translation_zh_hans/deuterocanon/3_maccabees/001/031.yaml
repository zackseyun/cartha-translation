base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/031.yaml
  text: But some, lightly despising the supports of the city's piety, readily gave themselves over, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: zh_hans
  text: 但有些人轻率地鄙弃维系这城虔敬的支柱[a]，轻易地把自己交付出去，以为日后与王交往[b]，自己便可有份于莫大的声望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这城虔敬的根基”。希腊语采用支承结构的比喻。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因日后与王往来”。这里的希腊语可指交往、往来或社交关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: 有些人
  rationale: 表示群体中的一部分人，以现代汉语自然呈现其不定复数含义。
- source_word: ἐπιπολαίως
  choice: 轻率地
  rationale: 表达态度浮浅、欠思量或草率；比“轻轻地”自然，也不把动机过度解释为蓄意。
- source_word: στυγοῦντες
  choice: 鄙弃
  rationale: 保留厌恶、憎弃的强烈贬义，同时与ἐπιπολαίως搭配，呈现轻率而蔑视地拒弃。
- source_word: τὰς τῆς πόλεως εὐσεβείας ἐπιβάθρας
  choice: 维系城中虔敬的支柱
  rationale: ἐπιβάθρας是支承结构的隐喻；“支柱”保留形象，“维系”说明其功能而不限定具体所指。
- source_word: εὐσεβείας
  choice: 虔敬
  rationale: 在希腊化犹太语境中指敬神、敬虔的宗教态度；“虔敬”既庄重又避免套入后期特定宗派用语。
- source_word: εὐχερῶς
  choice: 欣然
  rationale: 兼顾容易、乐意和毫不迟疑之意，突出其主动性。
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: 委身投靠
  rationale: 保留反身且自愿交出自己的含义；按上下文，“投靠”自然表达他们归附王方，但不具体化其形式。
- source_word: ὡς
  choice: 以为
  rationale: 标明下文是这些人的主观期待，并非叙述者确认的事实。
- source_word: μεγάλης τινὸς ... εὐκλείας
  choice: 某种莫大的声望
  rationale: εὐκλεία指美名、声誉；“声望”符合社会荣誉语境，τινός以“某种”保留其不定色彩。
- source_word: κοινωνήσοντες
  choice: 分享
  rationale: 准确表达参与、有份于所期待声望的含义。
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: 因将来与王交往
  rationale: συναναστροφή可指交往、往来或陪伴；“交往”保持范围宽泛，“将来”反映ἐσομένης，介词ἀπό按因由关系译作“因”。
theological_decisions:
- issue: 希腊化犹太城市宗教语境中εὐσέβεια的表达
  choice: 虔敬
  alternative: 敬神／宗教信仰
  rationale: “虔敬”兼具宗教敬畏和公共生活中的实践意味，不将其狭化为制度意义的“宗教”，也不引入后期基督教专门术语。
- issue: 是否明确“城中虔敬的支柱”具体指律法、圣殿或制度
  choice: 保留隐喻，不指明具体对象
  alternative: 译成“城中宗教制度的根基”
  rationale: 原文只使用支承结构的隐喻，没有明确列举其所指；保留开放性可避免加入经文未明说的神学或历史判断。
translation_notes:
  register: 采用现代、庄重而可读的书面普通话。“支柱”保留原文隐喻；“欣然委身投靠”呈现其主动归附；句末保留他们主观求取声望的讽刺张力。
