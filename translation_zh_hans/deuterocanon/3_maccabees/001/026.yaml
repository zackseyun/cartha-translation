  text: But after becoming emboldened and having by now sent everyone away, he was already making his approach, thinking to bring the matter spoken of before to completion.
translation:
  language: zh_hans
  text: 但他变得胆大起来，已经把众人都遣开，正向前逼近，以为要把先前所说的事办成。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρασυνθεὶς
  choice: 越发胆大
  rationale: 该不定过去时被动分词表示变得大胆、无所顾忌；结合语境略含冒进意味，但不强化为“狂妄”。
- source_word: πάντας παραπέμψας
  choice: 把所有人都遣开
  rationale: πάντας作宾语，语境指将随从等人全部打发离开；“遣开”简洁而庄重。
- source_word: πρόσβασιν ἐποιεῖτο
  choice: 开始向前逼近
  rationale: πρόσβασις可指接近、进前或进入，配合未完成时ἐποιεῖτο，描写正在展开的趋近行动；中文用“开始……逼近”传达其进程。
- source_word: τέλος ἐπιθήσειν
  choice: 进行到底
  rationale: 此习语表示完成、贯彻到底，并非使某事停止；“进行到底”自然保留其意图性。
- source_word: τῷ προειρημένῳ
  choice: 先前所说的事
  rationale: 将实体化的完成时被动分词直译为泛指事项，不擅自补成“计划”或其他更具体名词。
