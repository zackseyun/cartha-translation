  language: zh_hans
  text: 有人不假思索地说，正是这件事正被不当地渲染为怪诞之事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正是这件事正被说成骇人的怪事”，或“正是这件事正被大肆渲染”。希腊语动词可指把某事当作奇事、异兆或怪诞之物来讲述或处理。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρονοήτως
  choice: 不假思索地
  rationale: 表示说话时未加预先思量；这一表达自然、庄重，也保留了轻率之意，而不过度强化道德谴责。
- source_word: ἔφη
  choice: 说
  rationale: 原词只是一般性的言说动词，无须译成语气更强的“断言”或更正式的“宣称”。
- source_word: κακῶς
  choice: 恶意
  rationale: 该副词在此修饰 τερατεύεσθαι，带有负面评价。“恶意渲染”比生硬的“糟糕地”自然，同时避免仅凭该词译成过强的“邪恶地”。
- source_word: αὐτὸ τοῦτο
  choice: 正是这件事
  rationale: 保留原文强调语气，在现代汉语中也自然清楚。
- source_word: τερατεύεσθαι
  choice: 被渲染成了怪异的征兆
  rationale: 该词涉及把某事当作奇事、异兆或怪诞之物来讲述或处理；此译保留其被动意义和“征兆／怪异”这一词义张力，而不单纯化为“歪曲”或“炒作”。
