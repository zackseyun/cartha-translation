base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/012.yaml
  text: And even when the law had been read out[a], he still did not stop insisting that he ought to enter, saying, “Even if they have been deprived of this honor, I ought not to be.”
translation:
  language: zh_hans
  text: 即使已经把律法向他宣读了，他仍不住地坚持说自己理当进去。他说：“即便他们被剥夺了这份尊荣，我却不该如此。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我却不该被剥夺这份尊荣。”希腊文此处是省略句，直译为“至于我，却不该如此”。
    reason: 保留原文末句的省略，并说明可按上文补足的意思。
lexical_decisions:
- source_word: τοῦ ... νόμου
  choice: 律法
  rationale: 此处指刚向他援引、限制进入的犹太律法或规条；“律法”既保留正式效力，也符合上下文。
- source_word: παραναγνωσθέντος
  choice: 已经向他宣读
  rationale: 该词表示在某人面前读出；补出“向他”使汉语自然，并呈现律法被当面告知的语境。
- source_word: οὐδ᾽ ὣς ἀπέλειπεν
  choice: 仍不住地
  rationale: οὐδ᾽ ὣς 表示尽管如此仍然如此，未完成过去时 ἀπέλειπεν 则突出持续不止。
- source_word: προφερόμενος
  choice: 坚持说
  rationale: 在这里指不断提出并坚持自己的主张；“坚持说”兼顾言说动作与执意的语气。
- source_word: ἑαυτὸν δεῖν εἰσελθεῖν
  choice: 自己理当进去
  rationale: δεῖ 表达必要或应当；“理当”自然传达其自认拥有进入资格的主张，又不误作外在强迫。
- source_word: ἐστέρηνται
  choice: 被剥夺了
  rationale: 保留完成时被动态所表达的既成处境，也传达他们失去该项待遇。
- source_word: ταύτης τῆς τιμῆς
  choice: 这份尊荣
  rationale: τιμή 此处指进入所代表的荣誉、地位或礼遇；“尊荣”比单纯“荣誉”更适合庄重叙事语体。
- source_word: ἐμὲ δὲ οὐ δεῖ
  choice: 我却不该如此
  rationale: 原文省略了与前句相应的谓语；此译保留省略感和转折，不在正文中过度补明为“被剥夺”。
