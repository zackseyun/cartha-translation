lexical_decisions:
- source_word: ἀποτραπέντες
  choice: 转回去后
  rationale: 该不定过去时中被动形分词在此可按中间意义理解，表示转身、折返或转离；“转回去后”自然保留了先发生的动作，又不明确指定外在施事者。
- source_word: παρῆσαν
  choice: 又回到
  rationale: 结合ἐπὶ加宾格以及前面的转向动作，此处不宜仅译作“在场”，而表示来到或重新处于先前的位置、状态；“又回到”传达恢复原状的语意。
- source_word: στάσιν
  choice: 姿态
  rationale: στάσις既可指身体的站姿、位置，也可泛指状态。这里受“恳求”限定，“姿态”保留身体动作与处境状态两方面的可能。
- source_word: δεήσεως
  choice: 恳求
  rationale: δέησις指迫切的祈求、求告，比一般的“祷告”更突出请求的意味；“恳求”符合本句的强度。
- source_word: ἐπὶ τὴν αὐτὴν τῆς δεήσεως ... στάσιν
  choice: 回到同样的恳求姿态
  rationale: 该结构表示重新来到先前的姿态或状态；此译保持“同样”的照应，也避免把它限定为某一种具体祷告姿势。
