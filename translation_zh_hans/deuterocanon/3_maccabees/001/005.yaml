  text: And so it happened that the opponents were destroyed in hand-to-hand combat[a], and many were also captured as prisoners of war.
translation:
  language: zh_hans
  text: 结果，敌对者在近身搏斗中被歼灭，许多人也被俘，成了战俘。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “战俘”原文直译带有“由长矛所俘获的人”的意象，是指在战争中被擒的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβη
  choice: 于是
  rationale: 这是叙事中说明结果的非人称表达；译作“于是”自然简洁，也承接前文并引出战局结果。
- source_word: ἀντιπάλους
  choice: 敌对的一方
  rationale: 该词指冲突中与另一方对立的人；此译法保留其群体性和相对性，不把原文过度限定为单数集合名词“敌人”。
- source_word: ἐν χειρονομίαις
  choice: 在近身搏斗中
  rationale: 此处是军事语境，指近距离、徒手或持械交锋；“近身搏斗”符合现代汉语习惯，避免照字面误译为“手势”或“手的动作”。
- source_word: διαφθαρῆναι
  choice: 被歼灭
  rationale: 在战斗语境中表示遭到毁灭；“被歼灭”保留被动结构和军事色彩，并传达严重毁灭的结果。
- source_word: πολλούς
  choice: 许多人
  rationale: 直接表达数量众多，符合现代汉语叙事习惯。
- source_word: δοριαλώτους
  choice: 战俘
  rationale: 该军事用语字面含有“被矛俘获”之意，实际指战争中被擒的人；正文采用自然明确的“战俘”，字面意象置于脚注。
- source_word: συλλημφθῆναι
  choice: 被俘
  rationale: 被动不定式与前面的“被歼灭”平行；“被俘”准确表达战争中被抓获。
