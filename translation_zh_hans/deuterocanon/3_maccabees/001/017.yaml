  text: Those left behind in the city were thrown into confusion and rushed out[a], being uncertain about what was happening.
translation:
  language: zh_hans
  text: 留在城里的人陷入慌乱，冲了出去，不清楚正在发生什么事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“把正在发生的事看作不清楚。”即认为当时的事态不明朗。
    reason: 保留ἄδηλον τιθέμενοι τὸ γινόμενον的字面结构及其较为客观的“不明确”语气。
lexical_decisions:
- source_word: οἱ κατὰ τὴν πόλιν ἀπολειπόμενοι
  choice: 留在城里的人
  rationale: ἀπολειπόμενοι 是被动分词，可指被留在或仍留在某处的人；“留在城里的人”在现代汉语中自然，也不强行断定他们是被别人留下的。
- source_word: ταραχθέντες
  choice: 惊慌起来
  rationale: 该被动分词表示人因事态而受到搅扰、陷入慌乱；“惊慌起来”保留突发反应，又符合自然汉语。
- source_word: ἐξεπήδησαν
  choice: 纷纷冲了出来
  rationale: 此动词表示突然向外跃出或冲出；“冲了出来”体现动作的迅疾，“纷纷”则自然表达复数人群的集体反应。
- source_word: ἄδηλον τιθέμενοι τὸ γινόμενον
  choice: 不清楚究竟发生了什么
  rationale: 原短语较直译为“认为正在发生的事不明”；此译保留他们对事态不能确定的含义，同时使用普通现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“惊慌起来，纷纷冲了出来”传达原文连续而突然的群体反应；末句不补入原文未明说的原因或对象。
