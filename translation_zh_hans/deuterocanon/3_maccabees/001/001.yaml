base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/001.yaml
  text: Philopator[a], having learned from those who had returned of the seizure by Antiochus of the regions under his rule, gave orders to all his infantry and cavalry forces, took along his sister Arsinoe, and set out as far as the region of Raphia, where those with Antiochus had encamped.
translation:
  language: zh_hans
  text: 非罗帕托从归来的人那里得知，安条克正在夺取他统治下的各地；于是他向所有步兵和骑兵部队下令，带着他的姊妹阿尔西诺伊，启程前往拉斐亚一带。安条克一方的人[a]已经在那里扎营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“安条克周围的人”，是指安条克一方或他的军队，也可能包括安条克本人。
    reason: 保留希腊语习语的指涉范围，避免将其过早限定为只有军队或只有随从。
lexical_decisions:
- source_word: Ο ΔΕ
  choice: 于是
  rationale: δέ承接叙事，并无明确的“现在”之意；中文以“于是”连接得知军情与随后行动，自然而不过分强调转折。
- source_word: Φιλοπάτωρ
  choice: 非罗帕托
  rationale: 按希腊语音译这一称号或名字，不将其意译为带解释性的称谓。
- source_word: παρὰ τῶν ἀνακομισθέντων
  choice: 从回来的人那里
  rationale: 原文只说明这些人已经返回，并未明确称他们为使者或报信者。
- source_word: τὴν γινομένην ... ἀφαίρεσιν ὑπὸ Ἀντιόχου
  choice: 安条克正在夺取
  rationale: 以自然的中文动词结构表达“正在发生的夺取”，保留γινομένην所示的进行意味及安条克的施事身份。
- source_word: τῶν ἐπ᾽ αὐτοῦ κρατουμένων τόπων
  choice: 他统治下的各地
  rationale: 表达这些地区由非罗帕托掌控；“各地”也保留τόπων的复数意味。
- source_word: παραγγείλας ταῖς πάσαις δυνάμεσιν πεζικαῖς καὶ ἱππικαῖς
  choice: 命令所有步兵和骑兵部队出动
  rationale: παραγγείλας表示向军队下令；中文补出“出动”使军事语境完整，但不增添具体作战方式。
- source_word: τὴν ἀδελφὴν Ἀρσινόην συνπαραλαβών
  choice: 又带上他的姐姐阿尔西诺伊
  rationale: συνπαραλαβών指随同带上；ἀδελφή在此译作“姐姐”，符合人物关系的通常历史理解。
- source_word: ἐξώρμησεν μέχρι τῶν κατὰ Ῥαφίαν τόπων
  choice: 启程前往拉斐亚一带
  rationale: ἐξώρμησεν表示出发，κατὰ Ῥαφίαν τόπων指拉斐亚附近地区；译文保持地理范围而不缩成单一地点。
- source_word: οἱ περὶ Ἀντίοχον
  choice: 安条克一方的人
  rationale: περὶ某人的惯用语可指其随从、党羽或军队，也可能包括该人本人；正文采用较宽泛的表达，并以脚注说明。
- source_word: παρεμβεβλήκεισαν
  choice: 已经在那里扎营
  rationale: 过去完成时表示在非罗帕托抵达或出发所指的叙事节点以前，驻营已经完成。
