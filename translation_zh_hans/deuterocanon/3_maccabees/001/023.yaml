  yaml_path: translation/deuterocanon/3_maccabees/001/023.yaml
  text: But when they cried out to make a rush for the weapons, and to die courageously under the ancestral law, they caused considerable turmoil in the place, and only with difficulty by the old men and the elders
translation:
  language: zh_hans
  text: 但他们高声呼喊，要冲向兵器[a]，并为祖传的律法[b]勇敢赴死；他们在当地引起了相当大的骚乱。后来，年长者和众长老费了好大的劲，才……[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“冲到兵器那里”，意指冲过去夺取兵器。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在祖传律法之下”或“因祖传的律法”；这里的希腊语可理解为他们因忠于承袭的律法而赴死。
    reason: lexical_alternative
  - marker: c
    text: 本节所提供的希腊语见证在“由年长者和众长老”之后中断，句子并未结束。因此正文以“才……”保留未完成的句意，不补入现有文本没有的内容。
    reason: textual_variant
lexical_decisions:
- source_word: φωνήσαντες
  choice: 高声呼喊
  rationale: 该不定过去时分词引出导致骚乱的行动；“高声呼喊”既保留声音响亮、情势紧迫的意味，也符合现代汉语叙事表达。
- source_word: τὴν ὁρμὴν ... ποιήσασθαι
  choice: 要冲向
  rationale: ὁρμή表示猛然冲出或冲上前去；结合ἐπί所指的目标，译作“冲向”自然明白，又不把行动过度解释为正式进攻。
- source_word: ἐπὶ τὰ ὅπλα
  choice: 兵器
  rationale: ἐπί与ὁρμή连用，表示朝某一目标冲去；τὰ ὅπλα在此指可供夺取或使用的武器。“兵器”庄重且易懂。
- source_word: θαρραλέως
  choice: 勇敢
  rationale: 该副词表达面对死亡时的勇气和决绝；“勇敢”直接而庄重。
- source_word: ὑπὸ τοῦ πατρῴου νόμου
  choice: 为祖传的律法
  rationale: ὑπό在这里用法凝缩，可表达因律法、为了忠于律法而死。“为祖传的律法”较自然地传达效忠 inherited law 而赴死的语境，同时在脚注保留其他可能理解。
- source_word: τελευτᾷν
  choice: 赴死
  rationale: 该不定式意为死亡、走到生命终点；“赴死”与前文主动决意的语境相称，又没有增添死亡方式。
- source_word: ἱκανὴν ... τραχύτητα
  choice: 一场相当严重的骚乱
  rationale: τραχύτης本义带有粗暴、严峻之感，在此叙事场景中指由激烈行动造成的扰乱；此译兼顾程度和事件性质。
- source_word: μόλις
  choice: 好不容易才
  rationale: μόλις表示后续事情勉强或艰难地实现；由于所给希腊文本在此处中断，这一译法有意保留未完成结构。
- source_word: γεραιῶν
  choice: 年长者
  rationale: 该词着重年高，与随后可能具有群体职分意味的πρεσβύτεροι区分开来。
- source_word: πρεσβυτέρων
  choice: 众长老
  rationale: 此词可指群体中受承认的资深领袖；“众长老”保留这种可能的身份含义，并与单纯按年龄描述的“年长者”有别。
theological_decisions:
- issue: πατρῷος νόμος的译法
  choice: 祖传的律法
  alternative: 祖宗的律法／先祖传下的律法
  rationale: 该短语指犹太群体承袭的律法及其身份传统。“祖传的律法”准确、简洁，也不加入原文未明说的后期教义术语。
- issue: ὑπὸ τοῦ πατρῴου νόμου所表达的关系
  choice: 为祖传的律法勇敢赴死
  alternative: 在祖传律法之下勇敢赴死／因祖传的律法勇敢赴死
  rationale: 介词短语具有压缩性，可理解为在律法约束之下，也可指因忠于律法而死。正文采用更符合此处决死语境的“为”，脚注明示其他可能，避免把原文张力完全消除。
- issue: 所提供希腊见证末尾不完整
  choice: 保留未完成句意，并以省略号和脚注说明
  alternative: 根据其他版本或译本补出谓语和结果
  rationale: 现有原文止于“由年长者和众长老”，句法明显尚未完成。为忠于所提供见证，不凭推测补入后续动作。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“高声呼喊”“冲向”“赴死”传达现场的紧迫与决绝；“年长者”和“众长老”刻意区分两个希腊词。末尾以省略号直观标示原文摘录中断，而非暗示普通的修辞停顿。
