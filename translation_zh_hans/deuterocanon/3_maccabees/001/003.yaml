revisions:
- from: 这个多西提乌[a]，就是那位被称为德里米鲁之子的，按出身是犹太人，后来却改变了本族的规例，与祖传的信仰疏远了。他让一个无名小卒[b]躺在帐篷里，顶替自己；结果，那人受了本该落在他身上的惩罚。[c]
  to: 多西提乌[a]——人称德里米鲁之子，按出身是犹太人，后来改变了传统的习俗[b]，又与祖先传下的信念疏离——带着此人时，把一个无名之人[c]安置在帐篷里；结果，这人承受了那个人的惩罚。
  rationale: 修订补回原文的“带着此人”这一动作，同时避免将帐篷中的人确定为“顶替自己”。末句保留“这人／那个人”的对照，以呈现ὃν与ἐκείνου的原有指称关系，而不以解释性措辞预先判定“那个人”的身份。
  reviewer_model: gpt-5.6-terra
