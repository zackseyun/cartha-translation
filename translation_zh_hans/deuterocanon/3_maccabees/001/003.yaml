base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/003.yaml
  text: Dositheus[a], the one called son of Drimylus, a Jew by birth, but later having changed his customs and become estranged from the ancestral beliefs, lodged some obscure man in the tent in his place[c][b]; and it happened that this man received that one's punishment.
translation:
  language: zh_hans
  text: 多西提乌[a]——人称德里米鲁之子，按出身是犹太人，后来改变了传统的习俗[b]，又与祖先传下的信念疏离——带着此人时，把一个无名之人[c]安置在帐篷里；结果，这人承受了那个人的惩罚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人称德里米鲁之子”很可能是以父名标明其身份；也可译作“被称为德里米鲁之子”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“改变了习俗／规例，并与祖先的信念（或教导）疏离。”
    reason: source_literal
  - marker: c
    text: “无名之人”也可译作“不显要的人”或“不知名的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δωσίθεος ὁ Δριμύλου λεγόμενος
  choice: 多西提乌，就是那位被称为德里米鲁之子的
  rationale: 将属格 Δριμύλου 理解为父名标识；译文保留“被称为”的表达，以免把这种关系说得比希腊文更确定。
- source_word: τὸ γένος Ἰουδαῖος
  choice: 按出身是犹太人
  rationale: γένος 指血统、族裔或出身，而非他当时对犹太信仰的忠诚程度。
- source_word: μεταβαλὼν τὰ νόμιμα
  choice: 改变了本族的规例
  rationale: νόμιμα 在这里涵盖传统律例与宗教生活惯例；“规例”兼顾律法性和实践性。
- source_word: τῶν πατρίων δογμάτων ἀπηλλοτριωμένος
  choice: 与祖传的信仰疏远了
  rationale: 既保留 ἀπαλλοτριόω 的疏离意味，也用现代汉语表达 πατρίων δογμάτων 所指的祖传信念。
- source_word: ἄσημόν τινα
  choice: 一个无名小卒
  rationale: ἄσημος 可指无名、无地位或不显眼的人；正文采用自然且带有社会卑微意味的说法，同时用脚注保留其他可能。
- source_word: κατέκλινεν ἐν τῇ σκηνῇ
  choice: 让……躺在帐篷里，顶替自己
  rationale: κατακλίνω 的直接意义是使人躺下；“顶替自己”由叙事情境和后句的代受惩罚关系明确，补出可使中文连贯。
- source_word: ὃν συνέβη κομίсασθαι τὴν ἐκείνου κόλασιν
  choice: 结果，那人受了本该落在他身上的惩罚
  rationale: συνέβη 表示结果发生，κομίζομαι 在此为承受、领受；ἐκείνου 所指对象在中文中可能产生代词歧义，因此以“本该落在他身上”表达代受关系。
theological_decisions:
- issue: 多西提乌背离犹太祖传生活与信仰的描述
  choice: 改变了本族的规例，与祖传的信仰疏远了
  alternative: 改变了律法，与祖先的教义隔绝了
  rationale: 正文保留原文对其背离的负面评价，却不把 νόμιμα 和 δόγματα 限定为后世特定宗派意义上的“律法”或“教义”。
- issue: 替身所受惩罚的归属
  choice: 本该落在他身上的惩罚
  alternative: 他的惩罚／属于那人的惩罚
  rationale: 叙事明显呈现代受惩罚，但 ἐκείνου 本身只是属格关系；脚注说明直译，以保留原文措辞的简约性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人名按希腊语形式音译。正文用“规例”兼顾 νόμιμα 的律例与习俗含义，并以脚注保留 ἄσημος 和末句属格结构的语义余地。
