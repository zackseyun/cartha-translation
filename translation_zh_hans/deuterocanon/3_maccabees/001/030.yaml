base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/030.yaml
  text: 'But so that he might not become hateful to everyone by being hostile[a], he issued a written order: “But if any of them choose to conduct themselves among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: zh_hans
  text: 但为了不因与所有人为敌而被所有人厌恶，他便颁布书面命令：“但他们中若有人愿意与那些受过仪式性入门礼的人交往，他就使这些人与亚历山大城人享有同等的公民权。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα δὲ μὴ τοῖς πᾶσιν ἐχθόμενος ἐχθαίνηται
  choice: 但为了不因与所有人为敌而被所有人厌恶
  rationale: 保留ἵνα的目的意味、τοῖς πᾶσιν的普遍范围，以及ἐχθόμενος与ἐχθαίνηται之间“为敌／被厌恶”的同根修辞关系；中文采用自然的因果表达。
- source_word: ὑπέγραψεν
  choice: 写下命令
  rationale: 该动词在此引出正式书面命令的内容；“写下命令”既保留书写动作，也体现行政语境。
- source_word: Ἐὰν δέ τινες ἐξ αὐτῶν προαιρῶνται
  choice: 但他们中若有人愿意
  rationale: 表达条件句以及προαιρῶνται所含的自主选择、意愿之意，并保留句首δέ的转折语气。
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις ἀναστρέφεσθαι
  choice: 与那些按礼仪受过入教礼的人来往
  rationale: μεμυημένοις指经仪式加入者，τελεταί指宗教礼仪；ἀναστρέφεσθαι在此兼有交往及生活于其中的意味。“来往”避免武断限定为单纯居住或彻底改变生活方式。
- source_word: τούτους ἰσοπολίτας Ἀλεξανδρεῦσι ποιεῖ
  choice: 他就使这些人与亚历山大城人享有同等的公民权
  rationale: 以现代汉语明确表达ἰσοπολίτας的法律与公民身份含义；保留ποιεῖ的第三人称主语及敕令式现在时效果。
theological_decisions:
- issue: τελεταί与μεμυημένοις所指的宗教加入仪式
  choice: 按礼仪受过入教礼的人
  alternative: 在奥秘仪式中受过秘传礼的人
  rationale: 希腊语明确采用宗教仪式及加入仪式的术语，但未指明某一具体神秘宗教；正文保留祭仪性质，同时避免引入后世宗派性的“入教”制度解释或将其过度技术化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“为敌／被……厌恶”尽量再现原文同根词的呼应；命令引文中的“但”保留希腊语δέ略显突兀的转折。
