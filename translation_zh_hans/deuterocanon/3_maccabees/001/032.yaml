base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/032.yaml
  text: But most of them[a] took courage with a noble spirit, did not depart from piety[c][b], exchanging even their possessions for life, and boldly sought to rescue themselves from the registrations.
translation:
  language: zh_hans
  text: 但他们中大多数人都怀着高尚的勇气振作起来，没有离弃对上帝的虔敬[a]；他们甚至拿财产换取活命，并勇敢地设法使自己摆脱登记[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虔敬”也可译作“敬虔”或“敬畏上帝”。希腊语εὐσέβεια可指对上帝的敬畏、忠诚和虔诚实践。
    reason: lexical_alternative
  - marker: b
    text: “设法使自己摆脱”所对应的希腊语句在现存文本中较难解释，尤其是动词ἐτιμῶντο。这里按上下文译出他们积极谋求脱离登记的意思；也可能理解为他们“认为这样做值得”。
    reason: textual_difficulty
  - marker: c
    text: “登记”指当局强加给他们的官方登记或造册程序，不一定是现代意义上的人口普查。希腊语原文在此使用复数。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: 但他们中大多数人
  rationale: οἱ πλεῖστοι表示“大多数人”；δέ承接上文并构成对比，因此译作“但”。补出“他们中”以符合现代汉语表达。
- source_word: γενναίᾳ ψυχῇ
  choice: 怀着高尚的勇气
  rationale: 该与格短语表示方式或内在态度。γενναῖος兼有高尚、勇敢之意，ψυχή在此指内在心志；译文兼顾品格与勇气，避免技术性地译作“灵魂”。
- source_word: ἐνίσχυσαν
  choice: 振作起来
  rationale: 该动词可指变得刚强、得到力量。此处描述他们在压力下坚定起来，“振作起来”自然表达其语境意义，同时不指定力量来自何方。
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: 没有离弃对上帝的虔敬
  rationale: διίστημι接属格可表示离开或背离；εὐσέβεια在犹太宗教语境中指向对上帝的敬畏与忠诚。补出“对上帝的”以明确汉语中的关系，而不加入特定宗派含义。
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: 甚至拿财产换取活命
  rationale: χρήματα指钱财或财产；περὶ τοῦ ζῇν表示为了活着、保全性命；τε在此保留为“甚至”。该译法简明表现他们为求生而舍弃财物。
- source_word: ἀδέως
  choice: 勇敢地
  rationale: ἀδέως表示无所畏惧、放胆行事；“勇敢地”在现代汉语中自然，并与前文的勇气相呼应。
- source_word: ἐτιμῶντο
  choice: 设法
  rationale: 传抄文本中的该词在此语境较难解释。按τιμάω/τιμῶμαι本可表示看重、认为值得；与不定式连用时可理解为以某事为目标并付诸努力。“设法”传达实际趋向，但不声称疑难词形具有完全确定的含义。
- source_word: ἑαυτοὺς ῥύσασθαι
  choice: 使自己摆脱
  rationale: ῥύομαι意为救出、解救，ἑαυτούς明确表示反身对象。因其后接“登记”，汉语用“使自己摆脱”比“救自己脱离”更自然。
- source_word: ἐκ τῶν ἀπογραφῶν
  choice: 摆脱登记
  rationale: ἀπογραφή可指官方登记、造册或名册。希腊文为复数，但在汉语中“登记”可作集合性过程名词，既涵盖多项登记或名册，也避免误解为现代人口普查。
theological_decisions:
- issue: 犹太受迫害语境中εὐσέβεια的译法
  choice: 对上帝的虔敬
  alternative: 敬虔；敬畏；虔诚
  rationale: 此词兼指对上帝的敬畏、忠诚及相应的生活实践。“对上帝的虔敬”明确其对象，同时不把它缩减为内心情感或引入后期教义术语。
- issue: 疑难词形ἐτιμῶντο及整句行动力度
  choice: 勇敢地设法使自己摆脱登记
  alternative: 勇敢地考虑使自己摆脱登记；认为使自己摆脱登记是值得的
  rationale: 现存希腊文本的措辞生硬，无法毫无疑问地确定该词在此处的精确语气。正文采用符合上下文的行动性表达，脚注则公开保留文本和解释上的不确定性。
- issue: 为保全性命而交出财产与坚守虔敬之间的关系
  choice: 并列保留两方面：没有离弃虔敬，却以财产换取活命
  alternative: 将求生解释为妥协，或将舍财解释为殉道行为
  rationale: 原文既肯定他们没有背离虔敬，也记述他们舍财求生；译文不把二者人为调和，也不作道德或教义上的额外评判。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“高尚的勇气”“振作起来”保留原文对内在品格和刚强行动的双重描写；分号梳理较长的希腊语句法。“活命”比“为了生存”更具叙事力度，“登记”则保持行政背景而避免过度现代化。疑难词形的解释不在正文中强行定论，相关不确定性由脚注明示。
