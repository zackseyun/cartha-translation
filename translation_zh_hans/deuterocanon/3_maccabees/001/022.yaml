  text: Along with these[a], those who had become emboldened concerning the citizens could no longer endure it when he pressed the matter completely and intended to carry out his purpose.
translation:
  language: zh_hans
  text: 此外，那些在公民的事上胆壮起来的人[a]，见他一再紧逼，又打算实现自己的意图，也再无法忍受。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些为公民胆壮起来的人。”希腊语“在公民的事上”既可指他们胆壮起来所涉及的事，也可表示他们为公民出头。
    reason: 保留 περὶ τῶν πολιτῶν 在所涉事项与支持对象之间的词义歧义。
lexical_decisions:
- source_word: σύν τε τούτοις
  choice: 与此同时
  rationale: 保留添加另一群人或因素的衔接作用，同时避免把 τούτοις 过早限定为“这些人”或“这些事”。
- source_word: οἱ περὶ τῶν πολιτῶν θρασυνθέντες
  choice: 那些在公民一事上壮起胆来的人
  rationale: θρασυνθέντες 表示变得大胆、壮起胆来；“在公民一事上”保留 περὶ 所指关系的含混，既可能指与公民有关的事，也可能含有为公民出头之意。
- source_word: οὐκ ἠνείχοντο
  choice: 再也无法忍受
  rationale: 体现未完成时所表达的持续状态，并用自然汉语传达不能继续容忍之意。
- source_word: τέλεον
  choice: 一味
  rationale: 在此作副词强化 ἐπικειμένου，表示紧逼达到彻底、毫不收敛的程度；“一味紧逼”在现代汉语中自然且有持续加强之感。
- source_word: αὐτοῦ ἐπικειμένου
  choice: 见他一味紧逼
  rationale: 将属格独立结构按情境译为“见……”，ἐπίκειμαι 保留逼迫、施压的意味，不补出希腊文未明说的宾语。
- source_word: τὸ τῆς προθέσεως ἐκπληροῦν
  choice: 将自己的意图付诸实行
  rationale: πρόθεσις 在此指既定意图或打算；“付诸实行”准确表达 ἐκπληροῦν 的落实、完成之意。
- source_word: διανοουμένου
  choice: 打算
  rationale: 表达经过思量后的明确意向，与后接的不定式自然衔接。
