  text: Θεόδοτος δέ τις ἐκπληρῶσαι τὴν ἐπιβουλὴν διανοηθείς, παραλαβὼν τῶν προυποτεταγμένων αὐτῷ ὅπλων Πτολεμαικῶν τὰ κράτιστα, διεκομίσθη νύκτωρ ἐπὶ τὴν τοῦ Πτολεμαίου σκηνήν, ὡς μόνος κτεῖναι αὐτόν, καὶ ἐν τούτῳ διαλῦσαι τὸν πόλεμον.
