base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/002.yaml
  text: But a certain Theodotus[a], having planned to carry out the plot, took the best of the Ptolemaic weapons that had been assigned to him and was conveyed by night to Ptolemy’s tent, to kill him himself and in this way bring the war to an end.
translation:
  language: zh_hans
  text: 有一个名叫狄奥多托的人，决意实施这项阴谋。他从预先配给他的托勒密军械中取了最精良的，夜间被带到托勒密的营帐，要亲手杀死他[a]，借此结束战争。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“独自杀死他”。希腊文μόνος既可能强调狄奥多托要亲自动手，也可理解为他要独力完成刺杀。
    reason: 保留μόνος在修饰执行者时“亲自”与“独自”之间的语义幅度。
lexical_decisions:
- source_word: ἐκπληρῶσαι τὴν ἐπιβουλήν
  choice: 实施这项阴谋
  rationale: ἐκπληρόω在此指把敌对图谋付诸实行；“实施”自然准确，而“阴谋”保留ἐπιβουλή的恶意谋害色彩。
- source_word: διανοηθείς
  choice: 决意
  rationale: 该分词表示经过思量而形成明确意图；“决意”比单纯“计划”更凝练，也符合刺杀行动的蓄意性质。
- source_word: τῶν προυποτεταγμένων αὐτῷ ὅπλων Πτολεμαικῶν τὰ κράτιστα
  choice: 从预先配给他的托勒密军械中挑选了最精良的
  rationale: 保留武器已预先拨给他的含义，并将属格整体自然处理为取出范围；Πτολεμαικῶν理解为托勒密一方的军械。
- source_word: διεκομίσθη
  choice: 被送到
  rationale: 保留希腊文被动态，表明他由他人运送或带到目的地，而非自行前往。
- source_word: νύκτωρ
  choice: 夜间
  rationale: 简洁表达“在夜里”，符合现代汉语叙事。
- source_word: σκηνήν
  choice: 营帐
  rationale: 军事背景下比泛称“帐篷”更贴切，同时仍是普通读者熟悉的词。
- source_word: ὡς μόνος κτεῖναι αὐτόν
  choice: 要亲手杀死他
  rationale: ὡς加不定式表达目的或意图；“亲手”自然体现μόνος很可能强调狄奥多托本人执行刺杀。
- source_word: ἐν τούτῳ διαλῦσαι τὸν πόλεμον
  choice: 借此结束战争
  rationale: 清楚表达以刺杀托勒密为手段终止战争的意图，简洁而不增添结果已实现的含义。
