  text: And when he had marveled also at the good order of the sanctuary[a], he considered making plans to enter the temple.
translation:
  language: zh_hans
  text: 他又惊叹圣殿区域井然有序[a]，便盘算着进入殿宇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里使用了两个不同的词：ἱερόν指整个圣殿区域或神圣建筑群，ναός则指圣殿建筑本身，即较狭义的圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμάσας
  choice: 惊叹
  rationale: 不定过去时分词表示先于主句动作发生的反应；“惊叹”保留赞叹、惊异之意，又不过度强化为震惊。
- source_word: εὐταξίαν
  choice: 秩序井然
  rationale: 该词指良好的秩序或妥善的安排；此译自然地保留其正面评价。
- source_word: ἱεροῦ
  choice: 圣殿区域
  rationale: ἱερόν在此泛指整个神圣建筑群或圣殿范围，并与后文较狭义的ναός形成区别。
- source_word: ἐνεθυμήθη
  choice: 在心里盘算
  rationale: 该动词表达内心思量；此译保留审慎考虑的意味，未将其强化为已经下定决心。
- source_word: βουλεύσασθαι
  choice: 要筹划
  rationale: 该不定式带有商议、谋划的意味；与“在心里盘算”并列虽保留一定语义叠加，却忠实反映原文连续使用两个思虑性动词。
- source_word: ναὸν
  choice: 殿宇
  rationale: ναός通常指圣殿主体建筑或内层圣所；用“殿宇”与前文泛指整体范围的“圣殿区域”相区别。
- source_word: εἰσελθεῖν
  choice: 进入
  rationale: 直接、自然地表达进入某处的动作。
theological_decisions:
- issue: 同一节中ἱερόν与ναός的区别
  choice: 将ἱερόν译为“圣殿区域”，将ναός译为“殿宇”
  alternative: 两者均译为“圣殿”
  rationale: 原文在近距离内使用两个不同的神圣空间词语。保留区别可显明叙事进展：他先赞叹整个圣殿区域的秩序，继而筹划进入圣殿主体建筑；同时不把ναός过度限定为某一具体内室。
- issue: ἐνεθυμήθη与βουλεύσασθαι的双重思虑表达
  choice: 译为“在心里盘算，要筹划”
  alternative: 简化为“打算进入”或“考虑进入”
  rationale: 原文同时使用表示内心思量与谋划的两个动词。保留两层表达，可避免把尚在考虑、筹划中的意向误译为既定决心。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“圣殿区域”与“殿宇”保留原文空间用词的区别；“在心里盘算，要筹划”刻意保留原文双重思虑的表达，而不将其简化成已经决定采取行动。
