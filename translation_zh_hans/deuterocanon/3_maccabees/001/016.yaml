revisions:
- from: 但你既乐意使你的荣耀临在于你的子民以色列中，就使这地方成为圣洁。
  to: 但既然你乐意使你的荣耀在你的子民以色列中彰显，就使这地方为圣。
  rationale: 修订保留ἀλλ᾽的转折和ἐπεὶ的因果根据；以“乐意”表达εὐδόκησας。将“临在”改为“彰显”，避免添加原文没有明说的临在概念，同时让“荣耀在……中”的汉语表达完整自然。“使这地方为圣”对应ἡγίασας，保留其圣洁和分别的语义，不具体化为圣所或圣殿。
