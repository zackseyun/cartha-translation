  text: But since you were pleased to set your glory among your people Israel, you sanctified this place.
translation:
  language: zh_hans
  text: 但既然你乐意使你的荣耀在你的子民以色列中彰显，就使这地方为圣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ᾽
  choice: 但
  rationale: 承接上文形成转折，现代汉语中“但”简洁自然。
- source_word: ἐπεὶ
  choice: 既
  rationale: 此处主要说明原因或根据；“既……就……”既保留因果意味，也使句式符合现代汉语习惯。
- source_word: εὐδόκησας
  choice: 你乐意
  rationale: 表达εὐδοκέω所含的喜悦与主动意愿，不将其弱化为单纯许可。
- source_word: τὴν δόξαν σου
  choice: 你的荣耀
  rationale: 在神圣语境中，δόξα指上帝彰显的荣耀；“荣耀”准确且为普通读者熟悉。
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  choice: 临在于你的子民以色列中
  rationale: ἐν直译为“在……中”；结合“荣耀”补出汉语自然搭配所需的“临在”，表达荣耀置于并显现在以色列民中，未将“以色列”误解为地点。
- source_word: ἡγίασας
  choice: 使……成为圣洁
  rationale: 保留ἁγιάζω明确的圣洁含义；相较“圣化”，此译更符合现代普通读者的语言习惯。
- source_word: τὸν τόπον τοῦτον
  choice: 这地方
  rationale: 忠实保留τόπος的一般含义，不擅自具体化为“圣所”或“圣殿”。
theological_decisions:
- issue: 如何表达上帝荣耀与以色列民的关系
  choice: 使你的荣耀临在于你的子民以色列中
  alternative: 把你的荣耀安置在你的子民以色列中
  rationale: 原文只有εὐδοκέω、δόξα与ἐν的组合，并无明确表示“安置”的动词。“临在”使汉语句子完整，同时避免过度强调空间性的放置。
- issue: 如何翻译圣殿语境中的ἁγιάζω
  choice: 使这地方成为圣洁
  alternative: 将这地方分别为圣／使这地方成圣
  rationale: “成为圣洁”直接保留圣洁范畴，又不把含义收窄为礼仪上的奉献或分别；原文没有说明具体成圣方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“既……就……”清楚呈现转折之后的因果结构；避免较生硬的“圣化”，也不把“这地方”具体化为原文未明说的“圣殿”或“圣所”。
