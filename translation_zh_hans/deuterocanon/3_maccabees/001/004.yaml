base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/004.yaml
  text: And when the battle had become fierce and affairs were turning more strongly in Antiochus’s favor[a], Arsinoe went repeatedly among the troops and earnestly urged them, with pity and tears, her hair let down, to help themselves and their children and wives courageously, promising to give two minas of gold to each man if they won.
translation:
  language: zh_hans
  text: 当战斗激烈、形势更有利于安条克时，阿尔西诺厄披散着头发，带着哀怜，流着泪，在军中走动，恳切劝勉他们要勇敢地救助他们自己、儿女和妻子；她许诺，如果他们获胜，就给每人两弥那[a]的黄金。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弥那”是古代的重量和货币单位；这里许诺获胜后给每名士兵两弥那的黄金。
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης δὲ καρτερᾶς μάχης
  choice: 战斗越发激烈
  rationale: 属格独立结构交代背景；καρτερά在这里表示战斗的强烈、艰苦，用“越发激烈”符合现代汉语战事语境。
- source_word: τῶν πραγμάτων μᾶλλον ἐρρωμένων τῷ Ἀντιόχῳ
  choice: 战局也越来越有利于安条克
  rationale: πράγματα在此泛指局势，ἐρρωμένων表示局势增强、稳固；结合与格τῷ Ἀντιόχῳ，意为形势愈发偏向安条克。“越来越”保留μᾶλλον的递进意味。
- source_word: ἱκανῶς ... παρεκάλει
  choice: 恳切劝勉
  rationale: ἱκανῶς在语境中强化阿尔西诺厄的行动或劝勉；“恳切”自然承接后文含泪的迫切呼吁，同时避免机械译作“充分地”。
- source_word: ἐπιπορευσαμένη τὰς δυνάμεις
  choice: 走在军队中
  rationale: 表示她走入并穿行于军队之中。原文并不明确要求反复多次，因此不增译“反复”。
- source_word: μετὰ οἴκτου καὶ δακρύων
  choice: 悲切流泪
  rationale: οἶκτος可指怜悯、悲情或引人怜悯的哀求；“悲切”保留其情感强度，又不武断限定为她对士兵的怜悯。
- source_word: τοὺς πλοκάμους λελυμένη
  choice: 披散着头发
  rationale: 直译其头发、发绺已经解开，简明呈现古代悲痛或恳求姿态，不另加文化解释。
- source_word: βοηθεῖν ἑαυτοῖς τε καὶ τοῖς τέκνοις καὶ ταῖς γυναιξὶν θαρραλέως
  choice: 要勇敢地救助自己和自己的儿女、妻子
  rationale: βοηθεῖν基本义为帮助、援救；虽处战斗语境，仍用“救助”以免把含义收窄为“保卫”。“勇敢地”对应θαρραλέως。
- source_word: ἐπαγγελλομένη δώσειν νικήσασιν
  choice: 她许诺，如果他们获胜，就给
  rationale: 获胜分词在这里表达奖赏得以兑现的条件；用“如果……就……”使现代汉语清楚流畅。
- source_word: ἑκάστῳ δύο μνᾶς χρυσίου
  choice: 给每人两弥那黄金
  rationale: ἑκάστῳ为逐一分配的“每一个人”；μνᾶ采用音译并加脚注，不推算成不确定的现代币值或重量。
