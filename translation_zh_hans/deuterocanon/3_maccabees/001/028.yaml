  text: And from the very dense and strenuous cry being raised by the crowds[a], there was an indescribable outcry.
translation:
  language: zh_hans
  text: 群众竭力发出的、极其密集的呐喊汇聚起来，形成一阵难以形容的喧嚷。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυκνοτάτης
  choice: 密集
  rationale: 这是 πυκνός 的最高级形式；在此形容众人汇聚而成的呐喊。“密集”保留声音由人群密集叠加的意象，中文也较自然。
- source_word: ἐμπόνου
  choice: 竭尽气力
  rationale: 该词含劳苦、费力和用力之意；用于人群的呐喊，表示喊声是奋力发出的。“竭尽气力”比直译为“劳苦”更符合现代汉语搭配。
- source_word: τῶν ὄχλων
  choice: 群众
  rationale: 复数 ὄχλοι 指众多聚集的人群；“群众”简洁自然，并能表达集体场景。
- source_word: συναγομένης
  choice: 汇聚起来
  rationale: 分词本义为“被聚集、聚合”；这里修饰呐喊，表示许多人的声音合聚并增强，故译为“汇聚起来”。
- source_word: κραυγῆς
  choice: 呐喊
  rationale: κραυγή 指大声呼喊；“呐喊”保留其强烈而公开的声音色彩。
- source_word: ἀνείκαστός
  choice: 难以形容
  rationale: 该词表示无法比拟、想象或描绘；在声音场景中，“难以形容”最自然地传达其超出描述的程度。
- source_word: βοή
  choice: 喧嚷
  rationale: βοή 可指喊声、喧声或骚动；译作“喧嚷”可与前面的“呐喊”区分，同时保留嘈杂响亮的群体声响。
- source_word: τις
  choice: 一片
  rationale: τις 带有不定语气；结合中文声音量词译为“一片”，自然地表达某种席卷现场的喧嚷，而不生硬直译为“某种”。
