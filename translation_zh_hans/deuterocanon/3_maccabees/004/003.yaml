  yaml_path: translation/deuterocanon/3_maccabees/004/003.yaml
  text: What district[a], or city, or indeed what inhabited place at all, or what streets[b], were not filled with mourning and lamentation over them?
translation:
  language: zh_hans
  text: 哪一个行政区、哪一座城，甚至任何有人居住的地方[a]，或哪些街道，没有因他们而充满捶胸哀悼和悲号呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有人居住的”所译的希腊语形容词在这个抄本中很不寻常；按上下文，似乎泛指任何有人定居生活的地方。
    reason: textual_variant
lexical_decisions:
- source_word: νομός
  choice: 行政区
  rationale: 在希腊化时期常指行政区域；“行政区”既保留制度含义，也适合由较大地域到城市、街道的列举。
- source_word: πόλις
  choice: 城
  rationale: 这是通常的城邑用语；“城”简洁庄重，并与上下文自然衔接。
- source_word: τὸ σύνολον
  choice: 甚至哪一个
  rationale: 此处用来扩大反问的范围；汉语以“甚至”传达递进和无一例外的修辞力量，避免生硬直译。
- source_word: οἰκτιστὸς τόπος
  choice: 有人居住的地方
  rationale: 传本中的形容词较罕见，语境显然泛指人所居住或定居之处；采用释义式译法，同时以脚注保留文本上的不寻常之处。
- source_word: ἀγυιαί
  choice: 街道
  rationale: 指有人居住地区内的公共街道；“街道”符合本段公共哀哭的场景。
- source_word: κοπετοῦ
  choice: 捶胸哀悼
  rationale: 该词不只是一般悲伤，也可具体指伴随捶胸动作的礼俗性哀悼；明译这一形象可与 γόων 区分。
- source_word: γόων
  choice: 悲号
  rationale: 该词着重可听见的哀哭声；“悲号”与“捶胸哀悼”并列，保留动作与声音的双重描写。
- source_word: ἐπʼ αὐτοῖς
  choice: 因他们
  rationale: 介词短语表示哀悼的缘由或对象；“因他们”保留原文可能兼具“为他们”和“由于他们所遭遇之事”的张力。
- source_word: οὐκ ἐνεπιπλῶντο
  choice: 不……充满
  rationale: 未完成时被动式描写各处不断被哀悼和悲号充满；汉语反问句以“不……呢”自然表达无处不是如此。
