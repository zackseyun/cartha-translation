base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/001.yaml
  text: And everywhere this decree arrived[a], a public celebration was organized among the nations with shouting and joy[b], as though the hatred long before dancing in their minds against them were now being openly displayed with boldness.
translation:
  language: zh_hans
  text: 这诏令所到的各处，外族民众都举办了公费庆宴[a]，伴随着欢呼和喜乐；仿佛他们心思中早已跃动的、对犹太人的仇恨[b]，如今正大胆地公开显露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公费庆宴”也可译作“公共庆宴”；原文可强调庆宴由公共经费负担，也可较宽泛地表示全体民众的庆宴。
    reason: lexical_alternative
  - marker: b
    text: “早已跃动”直译原文一个较难确定的生动说法，描绘仇恨早就在他们的心思中跳动、蠢动。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντῃ δὲ ὅπου προσέπιπτεν
  choice: 这诏令所到的各处
  rationale: 按希腊语习惯表达诏令抵达各地；中文用“所到的各处”自然保留其周遍范围。
- source_word: πρόσταγμα
  choice: 诏令
  rationale: 指君王颁布的正式命令；“诏令”符合叙事时代背景，也为现代读者所能理解。
- source_word: δημοτελὴς … εὐωχία
  choice: 公费宴会
  rationale: δημοτελής可指由公共经费负担，εὐωχία侧重宴饮欢庆；此译比笼统的“公开庆祝”更具体地保存原文含义，同时以脚注说明另一可能。
- source_word: τοῖς ἔθνεσιν
  choice: 外族人中
  rationale: 在本书犹太人与周围群体的对照中，指非犹太民众；“外族人”既保留族群对照，也避免将其抽象化为政治意义上的“列国”。
- source_word: ἀλαλαγμῶν καὶ χαρᾶς
  choice: 欢呼和喜乐
  rationale: ἀλαλαγμός表示响亮的呼喊；上下文是欢庆，因此译作“欢呼”，并保留与“喜乐”的并列。
- source_word: προκατεσκιρωμένης … κατὰ διάνοιαν
  choice: 心中早已跃动的
  rationale: 保留疑难分词中“跳跃、跃动”的鲜明比喻，不将其平化为单纯的“潜藏”或“滋长”。
- source_word: μετὰ παρρησίας νῦν ἐκφαινομένης
  choice: 如今终于可以肆无忌惮地公开流露出来
  rationale: ἐκφαίνω表达原本内在之物显露于外，παρρησία在此带有毫无顾忌、公开表达的意味；“终于可以”体现诏令为其提供公开发泄机会的语境。
theological_decisions:
- issue: τοῖς ἔθνεσιν所指群体
  choice: 外族人中
  alternative: 列国中／非犹太人中
  rationale: 本段叙事语境是外族民众对犹太人的敌意，而不是泛指所有国家；“外族人”保存犹太叙事视角，又不额外引入教派术语。
- issue: 仇恨的对象
  choice: 明确为“对犹太人的仇恨”
  alternative: 按代词直译为“对他们的仇恨”
  rationale: 希腊文αὐτοῖς的指称由上下文明确定为受诏令迫害的犹太人；中文若只说“他们”容易与本句中的外族人混淆，因此显明指称而不改变内容。
translation_notes:
  register: 采用现代、庄重而清楚的叙事文体。“诏令”“外族人”“肆无忌惮”符合正式历史叙事，同时避免生硬逐词对应。正文中的[a]、[b]均与脚注相配。
