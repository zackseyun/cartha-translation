  yaml_path: translation/deuterocanon/3_maccabees/004/013.yaml
  text: Enraged[a], he ordered that these men too be treated in exactly the same way as those others, carefully, falling short in no way of their punishment.
translation:
  language: zh_hans
  text: 他勃然大怒，下令也要仔细地照同样的方式处置这些人，如同处置先前那些人一样；在任何方面都不可少于他们所受的惩罚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他勃然大怒，下令也要仔细地用对待先前那些人的同样方式处置这些人。”原文含 τρόπων 的短语在形式上略显生硬，但意思是要让这一群人受到与前一群人相同的惩罚。“在任何方面都不可少于”也可译为“不可在任何方面逊于”。
    reason: 词义及句法的另一种译法
lexical_decisions:
- source_word: διοργισθείς
  choice: 勃然大怒
  rationale: 该词表示强烈发怒；“勃然大怒”简洁自然，保留了原文的强烈程度及叙事语气。
- source_word: προσέταξεν
  choice: 下令
  rationale: 准确表达发出权威命令的通常含义，也符合现代汉语叙事文体。
- source_word: καὶ τούτοις ὁμοῦ
  choice: 也要……这些人
  rationale: “也”保留添加意味；“这些人”根据上下文补出人的所指，使汉语表达自然。
- source_word: τὸν αὐτὸν τρόπων
  choice: 照同样的方式
  rationale: 希腊语形式略显生硬，但语意指采用相同的方式；此译法保留其含义而不复制原文的语法别扭。
- source_word: ἐπιμελῶς
  choice: 一丝不苟地
  rationale: 表达认真、周密执行之意；在惩罚语境中也传达彻底落实命令的意味。
- source_word: ὡς ἐκείνοις ποιῆσαι
  choice: 处置这些人……先前那些人
  rationale: ποιέω在此结合比较结构，指对本组采取与前一组相同的处置；“处置”适合本段惩罚语境。
- source_word: μὴ λειπομένους κατὰ μηδένα τρόπον
  choice: 丝毫不轻于
  rationale: 该组合强调在任何方面都不可有所欠缺；汉语以“丝毫不轻于”自然表达惩罚程度不得低于前一组。
- source_word: τῆς ἐκείνων τιμωρίας
  choice: 先前那些人所受的惩罚
  rationale: 明确ἐκείνων回指前述群体；τιμωρία在此指惩罚性处置。
