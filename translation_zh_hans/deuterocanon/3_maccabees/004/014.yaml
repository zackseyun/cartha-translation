  yaml_path: translation/deuterocanon/3_maccabees/004/014.yaml
  text: and that the whole nation should be registered by name[a], not for the previously indicated brief service according to their work, but, by being tortured with the ordered cruelties[b], to be utterly destroyed in the course of a single day.
translation:
  language: zh_hans
  text: 又下令把全体族人逐一按名登记[a]，并不是为了先前所说的、按工作安排的短期服役，而是要用奉命施行的酷刑折磨他们[b]，在一天之内将他们彻底消灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个名字一个名字地登记”，强调逐个造册。
    reason: lexical_alternative
  - marker: b
    text: 这里有关先前目的的希腊文较难理解，可能是说，当局先前宣称登记是为了安排短期劳役，以此为借口；实际计划却是使他们遭受酷刑，并在一天之内将他们消灭。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπογραφῆναι
  choice: 登记
  rationale: 表示官方造册、登记；符合本段行政命令的语境。
- source_word: πᾶν τὸ φῦλον
  choice: 全族的人
  rationale: 这里统指整个犹太族群；此译既表达群体整体，也避免现代国家概念。
- source_word: ἐξ ὀνόματος
  choice: 逐一按名
  rationale: 明确表达按姓名逐个登记的个体化、分配性含义。
- source_word: οὐκ εἰς τὴν ἔμπροσθεν βραχεῖ προδεδηλωμένην τῶν ἔργων κατὰ τρόπον λατρείαν
  choice: 并不是为了先前所说的、让他们按所派的工作短期服役
  rationale: 原文结构艰涩；译文保留“先前说明”“短期”“按工作服役”等要素，并使目的对比在现代汉语中清楚。
- source_word: στρεβλούμεντας
  choice: 折磨他们
  rationale: 该词可指以扭曲肢体等方式施加酷刑；正文采用自然的上位表达，不武断指定刑具。
- source_word: παρηγγελμέναις αἰκίαις
  choice: 用奉命施行的酷刑
  rationale: 兼顾这些暴行是奉命执行的，以及其残酷、折磨性质。
- source_word: τὸ τέλος ἀφανίσαι
  choice: 将他们彻底消灭
  rationale: ἀφανίσαι表示使之消失或毁灭，τὸ τέλος加强彻底、最终的意味。
- source_word: μιᾶς ὑπὸ καιρὸν ἡμέρας
  choice: 在一天之内
  rationale: 自然传达毁灭被限定在单独一天的时段内；不把较含混的介词短语过度解释为特定日期。
