translation:
  language: zh_hans
  text: 他们声称，并拿出证据表明，连他们一直使用的纸莎草纸和书写用的芦苇笔[a]也已经耗尽了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书写用的芦苇”。希腊文直译为“书写用的芦苇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγόντων
  choice: 说
  rationale: 这是属格复数现在分词，延续上下文中的叙事陈述；汉语用“说”自然，并由“拿出证据”体现其正式申明的意味。
- source_word: μετὰ ἀποδείξεως
  choice: 拿出证据
  rationale: ἀπόδειξις指证明、证据；“拿出证据”既传达所言有凭据，也符合现代汉语表达。
- source_word: τὴν χαρτηρίαν
  choice: 蒲草纸
  rationale: 此词指古代以纸莎草制成的书写材料；“蒲草纸”比泛称“纸张”更能保留历史语境。
- source_word: τοὺς γραφικοὺς καλάμους
  choice: 书写用的芦管
  rationale: 直译为“书写的芦管”；正文保留原文的具体意象，脚注补充其作为笔的功能。
- source_word: ἐν οἷς ἐχρῶντο
  choice: 他们一直使用的
  rationale: 未完成时ἐχρῶντο表达过去持续的使用状态；“一直使用的”在汉语中清楚传达这一点。
- source_word: ἐκλελοιπέναι
  choice: 已经用完了
  rationale: ἐκλείπω的完成时不定式表示到当时已耗尽；“已经用完了”自然地体现完成状态。
