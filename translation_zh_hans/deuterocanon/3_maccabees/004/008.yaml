    issue: “因为已经看见”添加因果连接。
    rationale: 原文ὁρῶντες为伴随状态分词（“已经看见……”），并未以ὅτι、γάρ等明确说明哀哭的原因。中文宜保留其并列/伴随的开放关系。
  - severity: low
    issue: “把绞索缠在颈项上”可能暗示主动动作。
    rationale: περιπεπλεγμένοι主要呈现绞索已缠绕脖颈的状态；以“颈上缠着绞索”较少引入施事。
  - severity: low
    issue: “婚礼余下的日子”对多日庆典的含义不够明确。
    rationale: τὰς ἐπιλοίπους τῶν γάμων ἡμέρας指婚礼/婚庆活动余下的日子；补出“庆典”可避免理解为婚姻本身。
