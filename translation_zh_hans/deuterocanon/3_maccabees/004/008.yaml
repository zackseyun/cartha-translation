base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/008.yaml
  text: And their relatives[a], with nooses wrapped around their necks instead of garlands, though in the full bloom of youth, spent the remaining days of their weddings in mourning instead of feasting and youthful ease, already seeing Hades lying at their feet.
translation:
  language: zh_hans
  text: 这些人的亲属正当青春盛年，颈上缠着绞索，仿佛以此代替花冠；他们不再宴饮，享受青春的闲适，反倒在哀哭中度过婚礼庆典余下的日子，已经看见阴间[a]横在脚前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”也可理解为“死亡”或“坟墓”。希腊文为Ἅιδης，保留死者之境或死亡权势的意象，并非特指最终受罚之地。
    reason: 说明Ἅιδης的词义范围，避免将“阴间”误解为特定的终末刑罚概念。
lexical_decisions:
- source_word: συγγενεῖς
  choice: 亲属
  rationale: 泛指有亲缘关系的人，不限定性别；“亲属”在现代汉语中自然且范围恰当。
- source_word: βρόχους
  choice: 绞索
  rationale: 该词指可套住、捆缚或勒死人的索套；“绞索”保留其致命意象，并与婚礼花冠形成强烈反差。
- source_word: ὡς ἀντὶ στεφέων
  choice: 仿佛以此代替花冠
  rationale: 保留ὡς的比拟色彩，也呈现婚庆装饰被绞索取代的讽刺性逆转。
- source_word: τοὺς αὐχένας περιπεπλεγμένοι
  choice: 把绞索缠在颈项上
  rationale: 明确表达绞索环绕颈部的身体意象；“颈项”庄重而仍为现代读者熟悉。
- source_word: μετὰ ἀκμαίας νεανικῆς ἡλικίας
  choice: 正值青春盛年
  rationale: 兼顾ἀκμαίας所表达的旺盛、巅峰状态与νεανικῆς ἡλικίας的青年年龄。
- source_word: εὐωχίας
  choice: 宴饮享乐
  rationale: 婚礼语境中指筵宴与欢庆；此译既表达宴席，也传达节庆欢乐。
- source_word: νεωτερικῆς ῥᾳθυμίας
  choice: 尽享青春的悠闲
  rationale: ῥᾳθυμία在此主要指年轻人的安逸、无忧和闲适，不宜擅自加上道德谴责。
- source_word: τὰς ἐπιλοίπους τῶν γάμων ἡμέρας
  choice: 婚礼余下的日子
  rationale: γάμων在上下文中指持续数日的婚礼庆典；此译简洁自然，并保留“余下”的时间范围。
- source_word: ἐν θρήνοις διῆγον
  choice: 在哀哭中度过
  rationale: θρῆνοι指哀歌、悲叹或哭号；“哀哭”比笼统的“哀伤”更具体地保留外显的悲悼。
- source_word: παρὰ πόδας ἤδη τὸν ἅδην ὁρῶντες κείμενον
  choice: 已经看见阴间就横在脚前
  rationale: “阴间”是Ἅιδης在汉语圣经语域中较自然的对应，指死者所在之境或死亡权势，不等同于最终刑罚；“横在脚前”保留迫近而具象化的图景。
theological_decisions:
- issue: ἅδην的译法
  choice: 阴间
  alternative: 死亡；坟墓；哈得斯
  rationale: 原文使用Ἅιδης，呈现死者之境或死亡权势的意象。译作“阴间”既保留这一意象，又避免将其具体化为最终惩罚之地；脚注列出语境上的其他理解。
translation_notes:
  register: 采用现代、庄重且可朗读的书面普通话。句式重组以避免希腊语长句在中文中生硬，同时保留三重反差：绞索与花冠、哀哭与婚宴享乐、青春盛年与迫近的阴间。
