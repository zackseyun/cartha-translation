revisions:
- from: 上面还铺设了严密的木板，使他们的双眼四面受蔽，在整个航程中都像谋逆者一样被押送。[a]
  to: 上方还安置了密实的木板结构，为要使他们从四面都不见光，在整个航程中受到如同阴谋者一般的押送。[a]
  rationale: 修订消除了对“谋逆”的无根据限定，并以更自然的现代汉语表达上方密实木板造成四面遮光的目的。译文仍保留原文对ἀγωγὴν ἐπιβόλων所含“押送／按阴谋者待遇对待”的句法和词义歧义。
