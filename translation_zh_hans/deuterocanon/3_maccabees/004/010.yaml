  yaml_path: translation/deuterocanon/3_maccabees/004/010.yaml
  text: and with the dense planking above arranged so that[a], their eyes being darkened on every side, they might receive a transport fit for plotters throughout the whole voyage.
translation:
  language: zh_hans
  text: 上方还安置了密实的木板结构，为要使他们从四面都不见光，在整个航程中受到如同阴谋者一般的押送。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受到如同阴谋者一般的押送”也可译作“在整个航程中受到如同对待阴谋者般的待遇”。希腊语ἐπιβόλων带有贬义，可指图谋者、阴谋者，或较广义的危险人物。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθύπερθε
  choice: 上面
  rationale: 表示木板位于被押送者的上方；译作“上面”简洁自然，不额外限定船体结构。
- source_word: πυκνῷ σανιδώματι
  choice: 严密的木板
  rationale: σανίδωμα指木板铺成或搭成的结构，πυκνός强调铺设紧密；“严密的木板”传达遮光所需的密闭感。
- source_word: διακειμένῳ
  choice: 铺设了
  rationale: 分词描述木板被安置后的状态，并由后面的目的从句表明这种铺设是有意安排的。
- source_word: ὅπως πάντοθεν ἐσκοτισμένοι τοὺς ὀφθαλμούς
  choice: 使他们的双眼四面受蔽
  rationale: ὅπως表达目的，πάντοθεν强调来自各个方向；“受蔽”兼顾失去光线和视线受阻，而不把动作过度具体化。
- source_word: ἀγωγήν
  choice: 被押送
  rationale: 此处指囚犯被运送的方式；结合语境，以被动的“押送”自然表达强制运载。
- source_word: ἐπιβόλων
  choice: 像谋逆者一样
  rationale: ἐπίβολος带贬义，可指图谋者、阴谋者或危险人物；“谋逆者”保留其涉嫌策谋和被视作威胁的语气，但不泛化成普通罪犯。
- source_word: ἐν παντὶ τῷ κατάπλῳ
  choice: 在整个航程中
  rationale: κατάπλους指海上航行；上下文已属船运场景，“整个航程”自然保留其持续范围。
