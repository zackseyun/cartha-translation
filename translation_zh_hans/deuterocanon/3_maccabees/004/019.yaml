  to: 但他们以更严厉的态度采信了针对他们的指控[a]，认定他们是为了策划逃脱而被人用贿赂收买的；结果显然是，他对此深信不疑。
  rationale: 修订恢复 δεδωροκημένοις 的被动意义，避免将“被收买”误译为主动“收受贿赂”。同时调整首句和末句，使现代汉语较通顺，并仍保留原文未说明说服者、复数主语忽转单数“他”以及末句句法压缩所造成的歧义。
