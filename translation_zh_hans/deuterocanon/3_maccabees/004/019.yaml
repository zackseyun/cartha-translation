translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听信了对他们不利的话”补出汉语所需的宾语，但不点明原文未说明的说服者；末句保留原文由复数主语转为单数“他”的突兀变化，不擅自确定其身份。
