  yaml_path: translation/deuterocanon/3_maccabees/004/019.yaml
  text: But they were persuaded against them all the more harshly[a], on the ground that they had been bribed as part of a scheme for escape, and it clearly happened that he was convinced of this.
translation:
  language: zh_hans
  text: 但他们以更严厉的态度采信了针对他们的指控[a]，认定他们是为了策划逃脱而被人用贿赂收买的；结果显然是，他对此深信不疑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希腊文句法紧缩，略显生硬；末句也可译作：“而且很明显，他也相信了这件事。”
    reason: 保留原文句法及末句结构的另一种合理理解。
lexical_decisions:
- source_word: ἐπείσθησαν
  choice: 听信了
  rationale: 该词是 πείθω 的不定过去时被动式；结合 αὐτοῖς 的语境，用“听信了对他们不利的话”自然表达众人接受了不利于犹太人的说法，同时保留说服者未明的特点。
- source_word: αὐτοῖς
  choice: 对他们不利
  rationale: 这里的与格与 πείθομαι 连用，语境所指不是被他们说服，而是采信了针对他们的指控；译作“对他们不利”可传达司法或政治上的敌对意味。
- source_word: σκληρότερον
  choice: 更加严厉地
  rationale: 这是 σκληρός 的比较级副词形式，表示态度或处置更为严酷；“更加严厉地”保留其比较意味。
- source_word: δεδωροκημένοις
  choice: 收受了贿赂
  rationale: 完成时被动分词表示被财物买通；现代汉语以主动式“收受了贿赂”更自然，也准确呈现指控内容。
- source_word: εἰς μηχανὴν τῆς ἐκφυγῆς
  choice: 要设法逃走
  rationale: μηχανή 指计谋、办法或安排，ἐκφυγή 指逃脱；“设法逃走”简洁自然，并保留其被指为策划逃亡的语气。
- source_word: συνεβῆ σαφῶς
  choice: 事情清楚表明
  rationale: συμβαίνω 可指事情发生或结果显明，σαφῶς 表示清楚、明显；此译在现代汉语中通顺，同时反映原文结果性表达。
- source_word: πιστωθῆναι
  choice: 深信不疑
  rationale: πιστόω 的不定过去时被动不定式在此表示被使确信、认定为真；“深信不疑”自然传达他确信该项指控。
