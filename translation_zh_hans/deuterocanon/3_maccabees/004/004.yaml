  to: 因为各城的将领都同心一致，怀着刻毒无情的心，把他们押送出去[a]；除了那些骇人听闻的刑罚以外，甚至他们的一些仇敌，也把人所共有的怜悯之心看在眼里，又想到他们生命那未可知的结局，便为他们悲惨地被押送而流泪。
