  source_fidelity: 草稿准确传达了强制遣送、施行者的无情、受害者前途未明以及仇敌也为之落泪的主旨。但ἐπὶ ταῖς ἐξάλλοις τιμωρίαις在此应保留“除/加上那些异常严酷的刑罚以外”的附加关系；草稿改为“刑罚如此骇人，以致”而把它处理为结果原因，弱化了原文的结构关系。
  naturalness: 整体庄重通顺；但“亲眼看见人所共有的怜悯之情”在汉语中略显抽象且搭配生硬。改作“把人所共有的怜悯之心看在眼里”可保留“置于眼前”的形象，同时更合现代汉语。
  terminology: “长官”虽可涵盖地方官员，但στρατηγῶν的基本军事称谓应优先译为“将领”；“各城的将领”既保留原文直义，也不排除其在城内执行公权的角色。“押送出去”及其脚注恰当地表达ἐξαπεστέλλοντο的字面“送出”与上下文所显示的强制迁移。
