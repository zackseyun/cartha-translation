  yaml_path: translation/deuterocanon/3_maccabees/004/004.yaml
  text: For with the bitter cruelty of a merciless spirit they were being sent out together by the generals in each city[a], so that, beyond the outrageous punishments, even some of their enemies, seeing the common pity before their eyes and considering the uncertain ruin of their life[b], were weeping over their wretched deportation.
translation:
  language: zh_hans
  text: 因为各城的将领都同心一致，怀着刻毒无情的心，把他们押送出去[a]；除了那些骇人听闻的刑罚以外，甚至他们的一些仇敌，也把人所共有的怜悯之心看在眼里，又想到他们生命那未可知的结局，便为他们悲惨地被押送而流泪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “押送出去”直译为“送出去”；这里的语境表明，这是强制性的驱逐或迁送。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πικρίας ἀνοίκτου ψυχῆς
  choice: 怀着刻毒无情的心
  rationale: 将属格短语理解为施行押送者内在的冷酷心态；“刻毒无情”兼顾 πικρίας 的严酷意味与 ἀνοίκτου 的毫无怜悯。
- source_word: τῶν κατὰ πόλιν στρατηγῶν
  choice: 各城的长官
  rationale: στρατηγός 可指军事统帅或地方行政官；此处重在各城执行命令的官员身份，用“长官”保留其职能范围，避免过度限定为纯军事将领。
- source_word: ὁμοθυμαδόν
  choice: 同心一致
  rationale: 表达各地官员行动上的一致与协同，比单说“一起”更充分体现该副词的一致性。
- source_word: ἐξαπεστέλλοντο
  choice: 被押送出去
  rationale: 原义为“被送出去”，上下文显示并非自愿离去；“押送”自然传达强制迁移，同时脚注保留较直译的可能。
- source_word: ἐπὶ ταῖς ἐξάλλοις τιμωρίαις
  choice: 所受的刑罚如此骇人
  rationale: 结合后接 ὥστε 的结果结构，将 ἐπί 短语作为造成敌人落泪的背景；ἐξάλλοις 指异乎寻常、极端的刑罚。“如此骇人”在中文中自然衔接结果句，同时不把 ἐπί 的细微关系定死为单纯附加。
- source_word: τὸν κοινὸν ἔλεον
  choice: 人所共有的怜悯之情
  rationale: κοινός 表明这是人类通常共有的同情心；如此翻译比“共同的怜悯”更清楚，并保留原文对普遍人性的诉求。
- source_word: τὴν ἄδηλον τοῦ βίου καταστροφήν
  choice: 他们此生结局未卜
  rationale: ἄδηλος 表示不可知或不确定，καταστροφή 可指终局、毁灭或覆亡；“结局未卜”保留结局不明且凶险的张力，不武断指定为死亡。
- source_word: τὴν δυσάθλιον ἐξαποστολήν
  choice: 他们悲惨地被押送
  rationale: 以中文动词结构表达名词 ἐξαποστολή，并与前面的 ἐξαπεστέλλοντο 保持词根呼应；“悲惨”传达 δυσάθλιον 所强调的极度可怜。
