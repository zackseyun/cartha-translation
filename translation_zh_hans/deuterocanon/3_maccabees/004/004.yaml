  - severity: low
    issue: “亲眼看见人所共有的怜悯之情”搭配不够自然。
    rationale: “怜悯之情”是内在情感，不宜直说为可亲眼看见的对象；“看在眼里”较自然地传达πρὸ τῶν ὀφθαλμῶν的“置于眼前”表达。
  - severity: low
