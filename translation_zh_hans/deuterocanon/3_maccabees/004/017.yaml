base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/017.yaml
  text: But after the previously mentioned interval of time[a], the scribes reported to the king that it was no longer possible to carry out the registration of the Jews because of their countless multitude.
translation:
  language: zh_hans
  text: 过了前面所说的那段时间，书记官向王禀报说，由于犹太人人数多得无法计量，已经不能再为他们办理登记了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “办理登记”也可译作“进行人口登记”或“造册”。希腊语ἀπογραφή可指登记、编录或人口统计。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: 过了……
  rationale: μετά加宾格表示时间上的“在……之后”；δέ在此主要承接并推进叙事，现代汉语不必生硬译出转折词。
- source_word: τὸ προειρημένον τοῦ χρόνου διάστημα
  choice: 前面所说的那段时间
  rationale: προειρημένον明确回指前文，διάστημα指一段时间；此译既保留回指，也符合现代汉语表达。
- source_word: προσηγγέλλον
  choice: 向王禀报说
  rationale: 该未完成时可呈现当时报告这一过程；“禀报”适合下属官员向君王作正式报告的语境，又不额外强调反复发生。
- source_word: οἱ γραμματεῖς
  choice: 书记官
  rationale: γραμματεῖς在这里是负责文书和名册的官员；“书记官”比宗教语境中常见的“文士”更准确地体现行政职能。
- source_word: μηκέτι ἰσχύειν
  choice: 已经不能再
  rationale: μηκέτι表示“不再”，ἰσχύειν在此表示能力或实际可行性；译文保留其无法继续办理的含义。
- source_word: τὴν τῶν Ἰουδαίων ἀπογραφὴν ποιεῖσθαι
  choice: 为他们办理登记
  rationale: ἀπογραφή可指登记、造册或人口统计；“办理登记”保留较宽泛的行政含义，代词“他们”自然回指犹太人。
- source_word: διὰ τὴν ἀμέτρητον αὐτῶν πληθύν
  choice: 由于犹太人人数多得无法计量
  rationale: διά加宾格表示原因；ἀμέτρητον πληθύν带有“数量不可计量”的强烈、可能夸张的表达，此译保留该力度，同时使原因指向清楚。
