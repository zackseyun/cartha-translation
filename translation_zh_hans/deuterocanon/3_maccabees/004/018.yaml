  yaml_path: translation/deuterocanon/3_maccabees/004/018.yaml
  text: even though most were still in the country—some still assembled in their houses[b][a], and others also in the place—since the situation had become impossible for all the generals over Egypt.
translation:
  language: zh_hans
  text: 尽管大多数人仍在境内[a]——有些人还聚集在各家中，另一些人也在那地方[b]——因为对所有管辖埃及的将领来说，局面已经到了无法应付的地步。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大多数人仍散布在全境。”
    reason: κατὰ τὴν χώραν 既可理解为“在境内”，也可能强调遍布全境。
  - marker: b
    text: “另一些人也在那地方”在希腊文中是省略说法，可能指另一些人聚集在某一地点或公共场所。
    reason: 原文省略谓语，且没有具体说明 τόπος 所指何处。
lexical_decisions:
- source_word: καίπερ
  choice: 尽管
  rationale: 引出让步情形，保留其与上下文主要叙述之间的张力。
- source_word: ὄντων ἔτι κατὰ τὴν χώραν τῶν πλειόνων
  choice: 大多数人仍在境内
  rationale: 将属格独立结构自然转为汉语分句；τῶν πλειόνων 指大多数人，χώρα 在埃及语境中可指境内或国土。
- source_word: τῶν μὲν κατὰ τὰς οἰκίας ἔτι συνεστηκότων
  choice: 有些人还聚集在各家中
  rationale: 保留 μὲν…δὲ 的分组对举；συνεστηκότων 表示聚集或结成群体，κατὰ τὰς οἰκίας 带有分散在各家的意味。
- source_word: τῶν δὲ καὶ κατὰ τὸν τόπον
  choice: 另一些人也在那地方
  rationale: 原文省略了与前句相应的动词，且 τόπος 所指不明；译文保留这种简略和地点上的含混，不擅自指定为公共场所。
- source_word: ὡς ἀδυνάτου καθεστῶτος
  choice: 因为……局面已经到了无法应付的地步
  rationale: ὡς 在此可表原因，καθεστῶτος 描写已经形成的状态；用“局面”补出汉语所需的主语，同时避免指定原文未明说的具体任务。
- source_word: πᾶσιν τοῖς ἐπ᾽ Αἴγυπτον στρατηγοῖς
  choice: 对所有管辖埃及的将领来说
  rationale: ἐπ᾽ Αἴγυπτον 表示对埃及的管辖或受命范围；“将领”保留 στρατηγοῖς 的军政官员色彩。
