  yaml_path: translation/deuterocanon/3_maccabees/004/009.yaml
  text: 'And they were brought down, driven like beasts by the compulsion of iron chains: some with their necks fastened to the yokes of the ships, and others with their feet secured in unbreakable fetters,'
translation:
  language: zh_hans
  text: 他们被带下去，在铁制束缚的强迫下，像野兽一样被驱赶：[a]有些人的脖子被牢牢固定[c]在船上的轭木上[b]，另一些人的双脚则用牢不可破的脚镣锁紧，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被驱赶”也可译作“被带着走”；希腊语分词本身可以较中性，但上下文的野兽比喻和强制处境支持这里的译法。
    reason: lexical_alternative
  - marker: b
    text: “船上的轭木”可能指船上用来固定囚犯的横木或杆件；希腊原文仍保留牲畜负轭的意象。
    reason: cultural_note
  - marker: c
    text: “固定”若按这个动词最强的含义，也可译作“钉住”；但紧接的语境并不要求把意思限定为真的用钉子钉住。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήχθησαν
  choice: 被押解下去
  rationale: 保留 κατάγω 的向下方向，同时以“押解”体现被动且受拘束的处境，不擅自说明目的地。
- source_word: θηρίων τρόπον
  choice: 像野兽一样
  rationale: 自然、直接地保留比较所带出的非人化形象。
- source_word: ἀγόμενοι
  choice: 被驱赶
  rationale: 该分词本可较中性地表示“被带领”，但野兽比喻和强制拘禁的语境支持“被驱赶”。
- source_word: σιδηροδέσμοις ἀνάγκαις
  choice: 在铁制枷锁的强制下
  rationale: 这一紧缩短语兼有铁制束缚和强迫之意；此译法保留两层含义，同时避免把 δεσμός 过窄地限定为链条。
- source_word: τοῖς ζυγοῖς τῶν πλοίων
  choice: 船上的轭木
  rationale: ζυγός 可指轭，也可延伸指横木或杆件；“轭木”既保留动物负轭的意象，也提示其可能是船上用于固定人的木构件。
- source_word: προσηλωμένοι
  choice: 被牢牢固定
  rationale: 该词可强至“钉住”，但此处未必要求实指用钉，故采用较宽而仍有力度的表达。
- source_word: τοὺς τραχήλους
  choice: 脖子
  rationale: 按现代汉语习惯补出领属关系为“人的脖子”。
- source_word: ἀρρήκτοις
  choice: 牢不可破的
  rationale: 直接表达不可被折断或挣断的性质，并保持原文的绝对力度。
- source_word: κατησφαλισμένοι
  choice: 锁紧
  rationale: 表达牢固扣住、使其无法脱开的意思，与脚镣搭配自然。
- source_word: πέδαις
  choice: 脚镣
  rationale: 准确体现专用于双脚的束具，比泛称“锁链”更具体。
