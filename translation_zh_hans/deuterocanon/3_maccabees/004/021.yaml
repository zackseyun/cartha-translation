  text: But this was the invincible working of the providence from heaven of the one helping the Jews[a].
translation:
  language: zh_hans
  text: 但这乃是那位从天上帮助犹太人者的眷顾所发挥的、不可战胜的功效。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “功效”也可译为“运行”或“运作”。原文中“不可战胜的”的句法位置略不规则，可理解为强调这眷顾所发挥的整个运作。
    reason: 保留ἐνέργεια的词汇替代方案，并提示ἀνίκητον在原文中不规则而未完全消除的修饰范围。
lexical_decisions:
- source_word: ἐνέργεια
  choice: 所施行的
  rationale: 该词表示实际发挥作用的行动或效力。译作“所施行的”能以自然汉语表达其动态意义，又不预先将其限定为神迹。
- source_word: προνοίας
  choice: 眷顾
  rationale: 本处指来自天上的看顾与护佑。“眷顾”既保留神学语境中的护理意味，也比抽象的“安排”更贴合上下文。
- source_word: τοῦ βοηθοῦντος
  choice: 那位……帮助……的主
  rationale: 希腊文为带冠词的实体化现在分词，意为“那位正在帮助者”。正文用“那位……的主”使现代汉语自然并表明尊称，但不直接补出“上帝”这一名称。
- source_word: τοῖς Ἰουδαίοις
  choice: 犹太人
  rationale: 这里指在埃及的犹太民族与信仰群体，并非只指犹大地区居民。
- source_word: ἐξ οὐρανοῦ
  choice: 从天上
  rationale: 直译其来源性短语，保留帮助来自天上、因而具有神圣来源的含义。
- source_word: ἀνίκητον
  choice: 不可战胜的
  rationale: 该形容词强调这种眷顾所产生的行动无法被击败或克服；“不可战胜的”准确保留其力度。
theological_decisions:
- issue: “那位从天上帮助犹太人的”所指为何
  choice: 以“那位……的主”间接指向上帝，不直接补出“上帝”之名
  alternative: 译成“从天上帮助犹太人的上帝”或完全直译为“那位从天上帮助犹太人的”
  rationale: 原文没有明确写出 θεός，而以带冠词的分词间接指称。译文应让神圣所指清楚，同时避免把原文含蓄的表达完全明说。
- issue: ἀνίκητον所修饰的对象
  choice: 按最自然的句法理解为修饰“眷顾”，并在汉语中置于“眷顾”之前
  alternative: 将其理解为整个“施行/运作”的结果不可战胜
  rationale: 希腊文中该形容词为阴性宾格单数，与 προνοίας 的属格形式并不一致，句法略显不规则；语义上既可突出眷顾本身，也可笼罩其有效运作。正文采用自然汉语表达，脚注提示更贴近原语结构的译法。
translation_notes:
  register: 采用庄重而现代的书面汉语。“主”作为尊称使句子顺畅，但不直接补写原文未出现的“上帝”；“眷顾”兼顾可懂性与神学语境。脚注标记已在正文中以[a]出现。
