  yaml_path: translation/deuterocanon/3_maccabees/004/006.yaml
  text: And the young women who had just entered the bridal chamber for the sharing of life in marriage[a], taking up lamentation instead of joy, and with their perfume-drenched hair smeared with dust, were being led away unveiled, and with one accord raised a dirge instead of wedding songs[c][b], as though torn apart by abuse from foreigners.
translation:
  language: zh_hans
  text: 那些刚刚为了共度婚姻生活而进入婚房的年轻女子[a]，以哀哭代替了欢乐；她们原先涂满香膏的头发沾满尘土，无遮盖地被带走[b]。她们同声发出哀歌，代替婚礼歌曲，仿佛被异族的虐待撕裂一般[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “婚房”也可译作“婚床”（γαμικὸν ... παστόν）。
    reason: lexical_alternative
  - marker: b
    text: 直译为“无遮盖地”或“头无遮盖地”；在此语境中，这是公开受辱的标志。
    reason: cultural_note
  - marker: c
    text: “异族的虐待”也可理解为“由异族人施加的虐待”；希腊文将“异族的”与“虐待”相连。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτι
  choice: 刚刚
  rationale: 表达动作发生不久，与分词所指进入婚姻生活的时间关系自然衔接。
- source_word: πρὸς βίου κοινωνίαν
  choice: 为共同生活
  rationale: 保留 κοινωνία 所含共同参与、共享生活之意，并由婚姻语境界定其关系。
- source_word: γαμικὸν ... παστὸν
  choice: 步入婚房
  rationale: παστός 可指婚房或婚床；正文采用较宽泛且符合场景的“婚房”，脚注保留另一可能。
- source_word: νεάνιδες
  choice: 年轻女子
  rationale: 直接表达年龄与性别，不把语境中的新娘身份过度写入词义。
- source_word: ἀντὶ τέρψεως μεταλαβοῦσαι γόους
  choice: 所得的不是喜乐，而是哀哭
  rationale: 自然呈现 ἀντί 所强调的悲喜替换，也保留 γόοι 的哀悼意味。
- source_word: μυροβρεχῆ ... κόμην
  choice: 浸透香膏的头发
  rationale: 该复合词指被芳香膏油润湿的头发；“香膏”既具体又不限定为没药。
- source_word: πεφυρμέναι
  choice: 把尘土抹在……头发上
  rationale: 传达尘土沾污原本精心涂香之头发的鲜明反差。
- source_word: ἀκαλύπτως
  choice: 不蒙头地
  rationale: 保留“无遮盖、头部未蒙”的字面文化标记，并用脚注说明其羞辱含义。
- source_word: ἀγόμεναι
  choice: 被人……押走
  rationale: 被动结构表明非自愿移动；“押走”在此处自然体现强制性，而不额外加入具体暴力动作。
- source_word: θρῆνον
  choice: 哀歌
  rationale: 指正式的哀悼歌曲，与婚礼颂歌构成清晰对照。
- source_word: ὑμεναίων
  choice: 婚礼的颂歌
  rationale: 指婚礼或新婚所唱的歌曲；“颂歌”保留较庄重的文学语体。
- source_word: ὁμοθυμαδόν
  choice: 同声
  rationale: 简洁表达众人一致发声和共同悲痛。
- source_word: αἰκίαις ἀλλοεθνεῖσιν
  choice: 异族人的凌虐
  rationale: ἀλλοεθνής 可与施行凌虐的人或凌虐本身关联；正文采用自然的施事理解，脚注保留语法上的另一种可能。
