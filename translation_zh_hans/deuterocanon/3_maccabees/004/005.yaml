  yaml_path: translation/deuterocanon/3_maccabees/004/005.yaml
  text: For an old man was being led along[a], full of gray hair, bent over by the weakness in his feet that comes with age, driven by the violent force of being thrown down[c][b], making use of a swift march without any regard for all dignity.
translation:
  language: zh_hans
  text: 因为一位白发苍苍的老人正被押着前行；他双脚因年老而迟缓，弯腰佝偻，在一股猛烈、几使他倾倒的冲力催逼下[a]，不顾体面地被迫以急促的步伐赶路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在一股猛烈、几使他倾倒的冲力催逼下”所对应的希腊语结构简练而难解，兼有猛烈冲力与倾倒、跌倒的意象；也可理解为“被猛烈地推倒”或“受一股使人倾倒的猛力驱赶”。
    reason: lexical_alternative
  - marker: b
    text: “被迫以急促的步伐赶路”也可译作“以急促的步伐行进”。原文强调这位年迈、脚步迟缓者采用了与其身体状况不相称的快速步态；强制意味由上下文支持。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγετο
  choice: 正被押着前行
  rationale: 未完成时被动语态描写当时持续进行的动作；“押着”体现上下文中的强制意味，又不具体断定施力方式。
- source_word: γέρων πλήρης πολιᾶς πεπυκασμένος
  choice: 一位白发苍苍的老人
  rationale: 该词组突出老人满头白发的外貌；采用自然凝练的现代汉语保留这一鲜明形象。
- source_word: τὴν ἐκ τοῦ γήρως νωθρίτητα ποδῶν
  choice: 因年老双脚迟钝
  rationale: νωθρίτης可指迟缓、无力；这里描述衰老导致的行动不便，“迟钝”兼顾脚步迟缓与身体衰弱。
- source_word: ἐπικύφων
  choice: 弯腰佝偻
  rationale: 该分词描写向前弯曲、驼背的姿态；叠用“弯腰佝偻”在现代汉语中形象而庄重。
- source_word: ἀνατροπῆς ὁρμῇ βιαίας
  choice: 在猛烈的推搡下踉跄欲倒
  rationale: 原短语高度压缩，兼有猛烈冲力与倾覆、跌倒之意；此译保留受暴力驱迫、脚步不稳的画面，同时以脚注说明歧义。
- source_word: ἁπάσης αἰδοῦς ἄνευ
  choice: 全然不顾体面
  rationale: αἰδώς可指羞耻、敬重或合宜体面；“全然”对应ἁπάσης的彻底性，“不顾体面”保留主客体均可能涉及的含义。
- source_word: πρὸς ὀξεῖαν καταχρώμενος πορείαν
  choice: 被迫快步赶路
  rationale: 原文表现这位行动迟缓的老人不得不采用急速步态；按上下文把隐含的强迫关系自然表达出来，但在脚注保留较形式化的另一理解。
