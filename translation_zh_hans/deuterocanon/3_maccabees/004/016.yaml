base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/016.yaml
  text: And the king[a], greatly and continually filled with joy, was arranging banquets before all the idols, with a mind far removed from the truth and with a profane mouth, praising deaf things that were unable to speak or help them[b], but speaking improper things against God.
translation:
  language: zh_hans
  text: 王极其而不断地满心喜乐，在所有偶像面前设宴[a]，心思远离真理，口出亵渎之言，赞美那些既聋又不能说话、也不能帮助人的东西，却说不当的话攻击上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在所有偶像面前”也可译作“为尊崇所有偶像”。
    reason: lexical_alternative
  - marker: b
    text: 所据希腊文版本将“上帝”一词置于方括号内，表示该处文本存有疑问；按上下文，这句话是说王以不当的话攻击上帝。
    reason: textual_variant
lexical_decisions:
- source_word: Μεγάλως δὲ καὶ διηνεκῶς ... χαρᾷ πεπληρωμένος
  choice: 一直欣喜若狂
  rationale: 表达“极其、持续地被喜乐充满”的状态；用现代汉语自然传达强度和延续性，不暗示这种喜乐正当。
- source_word: συμπόσια
  choice: 设宴
  rationale: 指宴饮聚会；“设宴”适合王室及祭偶像的场景，也比“饮酒会”庄重。
- source_word: ἐπὶ πάντων τῶν εἰδώλων
  choice: 在所有偶像面前
  rationale: 贴近ἐπί加属格在此处的空间或礼仪场景含义，并保留可能是“为尊崇所有偶像”的语义余地。
- source_word: πεπληρωμένῃ πόρρω τῆς ἀληθείας φρενί
  choice: 他的心远离真理
  rationale: φρήν在这里指思想、心智或内在意识；“心”在汉语中可自然涵盖这些层面。“远离真理”准确传达πόρρω τῆς ἀληθείας。
- source_word: βεβήλῳ στόματι
  choice: 口出亵渎之言
  rationale: βεβήλος表示不敬神圣、亵渎；这一汉语表达自然地把工具格短语化为言语特征。
- source_word: κωφὰ
  choice: 耳聋……的东西
  rationale: 保留希腊文中性复数且省略名词的贬抑修辞，不直接补成“耳聋的偶像”。
- source_word: μὴ δυνάμενα αὐτοῖς λαλεῖν ἢ ἀρήγειν
  choice: 不能向人说话也不能帮助人的
  rationale: 清楚表达偶像既不能回应，也不能施助；αὐτοῖς所指是相关的人或崇拜者，以泛称“人”避免汉语代词指向不清。
- source_word: ἐπαινῶν
  choice: 赞美
  rationale: 直接表达称颂、赞扬，与王攻击上帝的言语形成对照。
- source_word: εἰς δὲ [τὸν θεὸν]
  choice: 却……攻击上帝
  rationale: 在敌对语境中，εἰς与说话动词可表示言语所针对的对象；“攻击”传达逆向、敌对意味，同时将方括号所示文本问题置于脚注。
- source_word: τὶ μὴ καθήκοντα
  choice: 说不当的话
  rationale: 自然表达“不合宜、不应当”的话，保留道德与宗教上的不当性而不增添具体内容。
theological_decisions:
- issue: 王对上帝所说之话的方向和性质
  choice: 却说不当的话攻击上帝
  alternative: 却对上帝说不合宜的话；却谈论上帝而说不当的话
  rationale: 上下文把赞美无能的偶像与冒犯上帝相对照，εἰς在此可有敌对指向。译作“攻击上帝”保留该对比；脚注同时说明“上帝”在所据版本中带方括号，避免掩盖文本不确定性。
- issue: 是否把κωφὰ直接解释为偶像
  choice: 那些耳聋……的东西
  alternative: 那些耳聋的偶像
  rationale: 希腊文以中性形容词实体化表达，虽明显指偶像，却刻意称其为无能的“东西”；保留这一修辞，不把隐含名词明说出来。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“欣喜若狂”传达强烈且持续的喜悦；以分号和转折词呈现原文长句中赞美偶像与攻击上帝的鲜明对照。所有脚注标记均已置于正文相应位置。
