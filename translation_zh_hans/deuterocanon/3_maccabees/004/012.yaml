lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: 这事发生以后
  rationale: ὡς加不定过去时在此引出时间背景；δέ仅作叙事衔接，不强化为转折。
- source_word: ἀκούσας
  choice: 他听说
  rationale: 以汉语顺承分句表达不定过去时分词；主语原文依上下文省略，译文用“他”使句法自然。
- source_word: τοὺς ἐκ τῆς πόλεως ὁμοεθνεῖς
  choice: 城里的同胞
  rationale: ὁμοεθνεῖς指同族或同国之人；“同胞”简洁保留民族共同体含义。ἐκ τῆς πόλεως按语境译为“城里的”。
- source_word: κρυβῇ ἐκπορευομένους
  choice: 正暗中出城
  rationale: κρυβῇ为“暗中、秘密地”，ἐκπορεύομαι表示出去；结合ἐκ τῆς πόλεως，以“出城”自然呈现。
- source_word: πυκνότερον
  choice: 越来越频繁地
  rationale: 比较级副词在此最自然地表示行动发生得更频繁，而非空间上更密集。
- source_word: ὑποδιδράσκειν
  choice: 偷偷离去
  rationale: 该词带有暗中脱身、悄然逃离的意味；译法保留隐秘性而不武断强调成功逃脱。
- source_word: τὴν ἰχθεῖ τῶν ἀδελφῶν ταλαιπωρίαν
  choice: 因为他们的弟兄遭受苦难
  rationale: 传世文本中的ἰχθεῖ在此难解；依据整句可辨认的语境，以原因从句传达弟兄受苦促使他们离去这一表层意义，同时用脚注说明文本困难。
- source_word: τῶν ἀδελφῶν
  choice: 他们的弟兄
  rationale: 保留ἀδελφῶν的亲属及群体团结意象，不直接释义为“犹太同胞”。
