base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/011.yaml
  text: When they had been brought down to the place called Schedia[a], and the voyage had been completed, as had been decreed by the king, he ordered them to encamp in the hippodrome before the city, an open area excellently suited for making an example of them, lying in full view of all who were traveling down into the city and of those being sent out from there into the country on a journey[b], so that they might neither associate with his forces nor, in general, be deemed worthy of an enclosure.
translation:
  language: zh_hans
  text: 他们被带到名叫斯刻狄亚的地方[a]，航程也照王所颁布的谕令完成后，王便命令他们在城前的赛马场安营。那地方四周开阔，极适合把他们示众；凡下到城里的人，以及从那里被派往乡间出行的人，都能看见他们。为的是使他们既不能同王的军队接触，也完全不配享有围护之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赛马场”指城外供赛马使用的场地，也可译作“跑马场”。
    reason: 说明ἱπποδρόμιον所指的古代场所及可行译法。
  - marker: b
    text: 末句的希腊文较为凝缩，可能是说他们甚至不被认为配住在有围护的场所，也可能强调他们不得享有围护或保护。
    reason: 保留περίβολος在此处所指及整句关系上的真实歧义。
lexical_decisions:
- source_word: Πότιον δὲ ... ἀχθέντων
  choice: 他们被带到……以后
  rationale: 开头词形含义难定，结合属格独立结构按叙事中的时间衔接处理，不强加更具体而不确定的语气。
- source_word: τὴν λεγομένην Σχεδίαν
  choice: 所谓的斯刻狄亚
  rationale: 保留λεγομένην“所谓的／称为”的表达，并按地名音译Σχεδία。
- source_word: τὸ παράπλου περαθέντος
  choice: 航程也……走完以后
  rationale: παράπλους指水路航行或航程，περαίνω的被动形式表示完成；译文以自然汉语表达航程终结。
- source_word: δεδογματισμένον
  choice: 所颁的谕令
  rationale: 该完成时被动形式表示已经正式议定或颁定的王命；“谕令”保留官方性质。
- source_word: ἱπποδρόμῳ
  choice: 赛马场
  rationale: 该词特指供赛马使用的场地；现代汉语“赛马场”比音译术语更清楚。
- source_word: παρεμβαλεῖν
  choice: 安营
  rationale: 动词可指扎营或驻扎，此处是把大批人安置在场地内，故译“安营”。
- source_word: ἁπλατῷ καθεστῶτι περιμέτρῳ
  choice: 那里四周敞露
  rationale: 原短语表述生硬，整体指场地外围缺少遮蔽或围护；译文保留其暴露状态，并与末句的“围墙圈护”形成呼应。
- source_word: πρὸς παραδειγματισμὸν
  choice: 把他们示众
  rationale: παραδειγματισμός含公开展示、使之成为反面例子并加以羞辱之意；“示众”简洁保留公开羞辱色彩。
- source_word: ἄγαν εὐκαιροτάτῳ
  choice: 极适合
  rationale: 兼顾ἄγαν的强烈程度和εὐκαιρότατος的最高级意味。
- source_word: καταπορευομένοις εἰς τὴν πόλιν
  choice: 下到城里的人
  rationale: 保留κατα-所表达的向下行进方向，而不将其泛化为单纯“进城”。
- source_word: στελλομένοις πρὸς ἐκδημίαν
  choice: 被派往乡间出行的人
  rationale: 保留被动的“被派遣”和ἐκδημία离家出行的含义；“乡间”承接原文χώρα。
- source_word: τὸ σύνολον καταξιῶσαι περιβόλῳ
  choice: 也根本不会被认为配有围墙圈护的地方
  rationale: τὸ σύνολον作强调语，译作“根本”；καταξιόω保留“被认为配得”的贬抑判断，περίβολος按围墙围护之处理解，同时在脚注提示句法歧义。
