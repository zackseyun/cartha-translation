  text: And as prisoners they were dragged by force in public until their embarkation onto the ship[a].
translation:
  language: zh_hans
  text: 他们身为囚犯，被当众强行拖走，直到被押上船[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到被推进船里。”希腊语原文可指把人放进或推入船中。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιοι
  choice: 作为囚犯
  rationale: 该词指被捆绑或监禁的人；在句首具有表语性的修饰作用，译为“作为囚犯”既保留句法功能，也清楚表达其受拘禁的身份。
- source_word: δημοσίᾳ
  choice: 当众
  rationale: 此处最自然地表示公开地、在众人面前；“当众”符合现代汉语表达，并与被强行拖走的羞辱性场景相称。
- source_word: μέχρι τῆς εἰς τὸ πλοῖον ἐμβολῆς
  choice: 直到被押上船
  rationale: ἐμβολή本有放入、投入之意，此处指把他们弄进船里。“被押上船”自然承接囚犯受强制移动的语境，同时不把动作弱化为自愿登船。
- source_word: εἵλκοντο
  choice: 被……拖走
  rationale: 该未完成时被动形式描写持续遭人拖拉的动作；“拖走”保留其被动性和粗暴程度。
- source_word: μετὰ βίας
  choice: 强行
  rationale: 该短语表示凭借暴力或强制。“强行”简洁自然，明确体现非自愿和胁迫。
