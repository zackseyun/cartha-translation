base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/015.yaml
  text: So the registration of these people was carried out with bitter urgency and zealous exertion[a], from the rising of the sun to its setting[c][b], reaching no completion for forty days.
translation:
  language: zh_hans
  text: 于是，对这些人的登记以苦涩的急迫和热切的加倍努力进行着，从日出到日落，四十天仍未完成[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “登记”也可译作“造册”或“户籍登记”；原文指官方编录名单的行政程序。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从太阳升起直到落下”，意思是每天从早到晚不停办理。
    reason: cultural_note
  - marker: c
    text: 原文强调：这项工作持续了四十天，仍没有办完。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογραφὴ
  choice: 登记工作
  rationale: 指官方编录或登记程序；“登记工作”既符合行政语境，又不把含义限定为全面的人口普查。
- source_word: πικρᾶς σπουδῆς
  choice: 严酷的催逼
  rationale: σπουδή兼有急迫、勤奋之意，πικρά在此带出这项行动严苛而令人痛苦的性质；结合上下文，以“严酷的催逼”表达强制性的急迫。
- source_word: φιλοτίμου προσθεσίας
  choice: 热切的投入
  rationale: φιλοτίμου含热心争先、重视荣誉的意味，προσθεσίας表示额外施加的努力；“热切的投入”保留积极用力的强度，同时避免无根据地断定官员的内在动机。
- source_word: ἀπὸ ἀνατολῶν ἡλίου μέχρι δυσμῶν
  choice: 从日出直到日落
  rationale: 这是表示整日劳作的时间性表达；采用自然现代汉语，同时保留原文的日出、日落意象。
- source_word: ἀνήνυτον λαμβάνουσα τὸ τέλος
  choice: 仍未完成
  rationale: 该短语表示没有达到终点、未能办完；汉语以“仍未完成”清楚传达结果未达成。
- source_word: ἐπὶ ἡμέρας τεσσεράκοντα
  choice: 持续四十天
  rationale: 表示延续的时段，并与未完成的状态相连。
theological_decisions: []
