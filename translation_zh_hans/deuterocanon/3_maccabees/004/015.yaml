  register: 采用庄重而自然的现代标准汉语。“严酷的催逼”体现压迫性语境，“热切的投入”则保留φιλοτίμου προσθεσίας所含的强烈用力，而不擅自加入贬义动机。句末调整为汉语自然语序，明确“四十天”修饰持续未完成的过程。
