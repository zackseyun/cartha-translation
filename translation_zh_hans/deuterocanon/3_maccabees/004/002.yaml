revisions:
- from: 犹太人却悲痛得难以言表，含泪发出一片哀号[a]；他们的心因声声呻吟而处处如火焚烧，为那突然裁定要他们遭受、全然出乎意料的毁灭悲哭。
  to: 犹太人却陷入难以言表的悲痛，发出充满哀恸、带着泪水的呼号[a]；他们的心在呻吟中仿佛从四面受到火烧，为那出乎意料、骤然判定在他们身上的毁灭而悲哭。
  rationale: 修订保留原文层叠的悲痛语气和“心被火烧”的比喻，将πάντοθεν明确为“从四面”，而不把与格στεναγμοῖς限定为单纯因果。末句以“出乎意料、骤然判定在他们身上的毁灭”重组，保留ἀπροσδόκητον、ἐξαίφνης与ἐπικριθεῖσαν的三重信息，且不指定判定者。
