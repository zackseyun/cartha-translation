  yaml_path: translation/deuterocanon/3_maccabees/004/002.yaml
  text: But for the Jews there was unspeakable grief and an all-lamenting cry with tears, while their heart, burning on every side with groanings, bewailed the destruction unexpectedly and suddenly decreed against them.
translation:
  language: zh_hans
  text: 犹太人却陷入难以言表的悲痛，发出充满哀恸、带着泪水的呼号[a]；他们的心在呻吟中仿佛从四面受到火烧，为那出乎意料、骤然判定在他们身上的毁灭而悲哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“含泪发出一声完全哀恸的呼号。”πανόδυρτος是罕见的强化复合词；希腊原文修辞浓烈，句式高度凝练。
    reason: 说明πανόδυρτος的强化语气及该短语的另一种较贴近原文字面结构的译法。
lexical_decisions:
- source_word: ἄλεκτον πένθος
  choice: 悲痛得难以言表
  rationale: ἄλεκτον指无法说出或无法充分表达，πένθος指深切的悲痛或哀伤；此译既保留强度，也符合现代汉语表达。
- source_word: πανόδυρτος μετὰ δακρύων βοή
  choice: 含泪发出一片哀号
  rationale: πανόδυρτος是罕见的强化复合词，形容充满哀恸的呼声；“一片哀号”自然传达集体而彻底的悲号，μετὰ δακρύων则译作“含泪”。
- source_word: στεναγμοῖς
  choice: 因声声呻吟
  rationale: 该与格可表示手段或伴随；此处译作原因性的“因”，表现呻吟使内心如火焚烧，同时以“声声”传达持续的痛苦。
- source_word: πεπυρωμένης πάντοθεν ... τῆς καρδίας
  choice: 他们的心……处处如火焚烧
  rationale: πεπυρωμένης保留火烧的比喻，πάντοθεν表示从各处、四面或全然；“处处如火焚烧”保留原文强烈而略显压缩的修辞。
- source_word: ὀλοφυρομένων
  choice: 悲哭
  rationale: 该分词指为灾祸哀恸、哭号；“悲哭”既有动作性，也保持庄重语体。
- source_word: ἀπροσδόκητον ἐξαίφνης
  choice: 突然……全然出乎意料
  rationale: 原文并列“出乎意料”与“突然”两个概念；译文分别保留，不将其合并。
- source_word: ἐπικριθεῖσαν
  choice: 裁定要他们遭受
  rationale: 该被动分词带有司法或官方决定的意味；此译明确灾祸是被裁定加在他们身上的，又不额外指明裁定者。
- source_word: ὀλεθρίαν
  choice: 毁灭
  rationale: 此词在上下文中表示致命的毁灭性灾祸；“毁灭”直接保留其严重程度。
