base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/030.yaml
  text: Then the king[a], after summoning to the city the one in charge of the revenues, ordered that wine and the other provisions suitable for feasting be supplied to the Jews for seven days, deciding that in the very place where they had expected to meet destruction, in that place they should celebrate their deliverance with all rejoicing.
translation:
  language: zh_hans
  text: 随后，王把主管财政收入的官员召到城里，命令他连续七天向犹太人供应酒和其他适合宴饮的供应品。王并决定，他们要在原以为会遭受毁灭的地方，满怀喜乐地庆祝他们所蒙的拯救[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“庆祝救恩”。希腊词可指拯救、救恩；这里具体指他们从毁灭中获救。
    reason: 说明 σωτήρια 的词义范围，并保留“救恩”这一较宽译法。
lexical_decisions:
- source_word: ὁ ἐπὶ τῶν προσόδων
  choice: 主管财政收入的官员
  rationale: 该短语指负责各项收入的行政人员；译作“主管财政收入的官员”既保留职掌范围，也不擅自确定为某一特定官衔。
- source_word: προσκαλεσάμενος
  choice: 召到城里
  rationale: 分词所述动作先于主句的命令；结合 εἰς τὴν πόλιν，译文自然表达为王先把官员召入城中。
- source_word: οἴνους
  choice: 酒
  rationale: 希腊文虽用复数，现代汉语在此通常以“酒”作集合性表达，无须机械译成“各种酒”。
- source_word: τὰ λοιπὰ πρὸς εὐωχίαν ἐπιτήδεια
  choice: 其他适合宴饮的物品
  rationale: ἐπιτήδεια 指所需物资，πρὸς εὐωχίαν 表明其用途是欢宴；此译兼顾物资与庆宴语境。
- source_word: χορηγεῖν
  choice: 供应
  rationale: 该不定式从属于王的命令，表示由官府供给宴饮所需；“供应”简洁自然。
- source_word: κρίνας
  choice: 决定
  rationale: 这里表达王经过考虑所作的安排，并非司法审判，因此译作“决定”。
- source_word: ἔδοξαν
  choice: 原以为
  rationale: 在语境中指犹太人此前认为自己将遭毁灭；“原以为”清楚表达过去的预期。
- source_word: τὸν ὄλεθρον ἀναλαμβάνειν
  choice: 会遭受毁灭
  rationale: ἀναλαμβάνειν 与 ὄλεθρον 连用若直译为“接受毁灭”不合现代汉语；“遭受毁灭”准确传达面临灭亡的含义。
- source_word: σωτήρια ἀγαγεῖν
  choice: 庆祝自己得蒙拯救
  rationale: 该短语表示为获救而举行庆祝；“得蒙拯救”保留 σωτήρια 的拯救含义，同时符合本段脱离死亡威胁的具体语境。
- source_word: ἐν εὐφροσύνῃ πάσῃ
  choice: 满怀喜乐地
  rationale: 此表达强调庆祝时充盈的欢乐；“满怀喜乐地”自然体现 πάσῃ 的强化作用。
theological_decisions:
- issue: 次经叙事语境中 σωτήρια 的译法
  choice: 得蒙拯救
  alternative: 救恩；获救
  rationale: 上下文直接指从毁灭威胁中获救并为此庆祝。“得蒙拯救”既贴合具体事件，也保留该词较宽的救助、拯救意味；脚注说明“救恩”这一可能译法，以免消除原词的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将希腊文长句适度拆为两句，保持事件顺序与“同一地方”所形成的毁灭—喜乐反差；不使用过于古雅的官衔或宴祭术语。
