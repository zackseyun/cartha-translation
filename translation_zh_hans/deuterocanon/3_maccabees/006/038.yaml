base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/038.yaml
  text: Copies were made for them from the twenty-fifth of Pachon until the fourth of Epiphi[a], over forty days; and they appointed their destruction from the fifth of Epiphi until the seventh[b], in three days.
translation:
  language: zh_hans
  text: 从帕雄月二十五日到厄彼非月四日[a]，历时四十天，一直为他们抄录[b]；他们又定在厄彼非月五日至七日这三天毁灭他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 帕雄和厄彼非是本叙事行政纪年所采用的埃及月份名称。
    reason: cultural_note
  - marker: b
    text: 此处译作“抄录”的希腊词可指抄写副本，或制作、办理官方文书；原文没有说明所抄录或制作的具体对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντιγράφονται
  choice: 有人为他们缮写文书
  rationale: 该词是现在时被动态，具有文书抄写、制作副本或备办公文的含义；原文没有明说所缮写的具体对象。中文以泛指施事“有人”和概括性的“文书”表达行政文书语境，同时在脚注保留“副本/登记”的词义空间。
- source_word: αὐτοῖς
  choice: 为他们
  rationale: 保留与格的简洁表达，所指由上下文确定，不在本节擅自补出名词。
- source_word: ἀπὸ πέμπτης τοῦ Παχὼν καὶ εἰκάδος
  choice: 从帕雄月二十五日
  rationale: πέμπτης…καὶ εἰκάδος是“第二十五日”的希腊语日期表达；月份按埃及历音译。
- source_word: ἕως τῆς τετάρτης τοῦ Ἐπιφὶ
  choice: 到厄彼非月四日
  rationale: 直接表达日期范围，并保留埃及月份名称。
- source_word: ἐπʼ ἡμέρας τεσσαράκοντα
  choice: 整整四十天
  rationale: 该短语表示持续四十天；“整整”自然传达明确的时段，不把它误解为超过四十天。
- source_word: συνίστανται
  choice: 他们又定下
  rationale: 在行政安排的语境中，该动词表示确定、安排或设定；“定下”兼具正式性与现代汉语的自然度。
- source_word: τὴν ἀπώλειαν
  choice: 将他们灭尽
  rationale: 此处ἀπώλεια指计划中的彻底毁灭，而非一般损失；动词化处理使中文通顺，并保留其强烈程度。
- source_word: ἀπὸ πέμπτης τοῦ Ἐπιφὶ ἕως ἑβδόμης
  choice: 从厄彼非月五日到七日
  rationale: 按原文顺序清楚表达起止日期。
- source_word: ἡμέραις τρισίν
  choice: 用三天
  rationale: 与前面的日期范围相配，表达执行所定毁灭计划的三日期限。
