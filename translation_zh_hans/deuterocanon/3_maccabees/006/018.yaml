revisions:
- from: 那时，那位大有荣耀、全能而真实的上帝显露他的圣面[a]，打开天上的门；有两位满有荣光、形貌可畏的天使从门中降下。除了犹太人以外，众人都清楚看见了他们。
  to: 那时，那位大有荣耀、全能、真正的上帝，显露了他的圣面[a]，打开了天上的门；两位满有荣光、形貌可畏的天使从门中降下，向所有人显现，唯独犹太人看不见他们。
  rationale: 修订仅改善现代汉语的自然度，并使“显现／可见”的叙述重心及脚注的所属关系更贴近希腊文；不改变原文关于犹太人未见天使的明确陈述，也不对其原因作出解释。
