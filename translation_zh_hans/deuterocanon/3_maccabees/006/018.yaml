  terminology: “上帝”“全能”“圣面”“荣光”“形貌可畏”均与庄重的经文语体相称。“满有荣光”可自然表达δεδοξασμένοι所呈现的荣耀状态。脚注的替代说法应保留“他的”这一所属关系。
