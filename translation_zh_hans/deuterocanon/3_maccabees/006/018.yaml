  yaml_path: translation/deuterocanon/3_maccabees/006/018.yaml
  text: Then the greatly glorious, almighty, and true God, revealing his holy face, opened the gates of heaven, from which two glorious angels of fearful appearance came down, visible to everyone except the Jews,
translation:
  language: zh_hans
  text: 那时，那位大有荣耀、全能、真正的上帝，显露了他的圣面[a]，打开了天上的门；两位满有荣光、形貌可畏的天使从门中降下，向所有人显现，唯独犹太人看不见他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣面”也可理解为“他的神圣临在”或“圣容”。
    reason: πρόσωπον本义为“面”，在此也可能借“面”表达上帝的临在。
lexical_decisions:
- source_word: μεγαλοδόξος
  choice: 大有荣耀
  rationale: 保留复合形容词对上帝荣耀的强化，同时采用自然、庄重的现代汉语表达。
- source_word: παντοκράτωρ
  choice: 全能
  rationale: 在指称上帝时，这是自然且通行的对应词，也保留其掌管一切、能力无所不及的含义。
- source_word: ἀληθινὸς θεός
  choice: 真实的上帝
  rationale: ἀληθινός在此具有“真实、真正”的对比意味；“真实的上帝”既贴近原文，也避免把它处理成固定神学称号。
- source_word: ἐπιφάνας
  choice: 显露
  rationale: 分词与“他的圣面”直接搭配，表示使之显明；“显露”保留主动彰显的意象。
- source_word: τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: 他的圣面
  rationale: πρόσωπον的具体本义是“面、脸”。“圣面”保留原文拟人化意象及庄重语体，不在正文中释为较抽象的“临在”。
- source_word: ἠνέῳξε τὰς οὐρανίους πύλας
  choice: 打开天上的门
  rationale: οὐρανίους修饰“门”，可指属天或天上的门；此译法在汉语中自然，并保留空间意象。
- source_word: δεδοξασμένοι
  choice: 满有荣光
  rationale: 该完成时被动分词可指得了荣耀或处于荣光之中。“满有荣光”保留结果状态，也比“得荣耀的天使”更符合此处显现景象。
- source_word: φοβεροειδεῖς
  choice: 形貌可畏
  rationale: 该复合词描述其外观令人畏惧；此译法兼顾外貌含义与庄重语体。
- source_word: φανεροὶ πᾶσιν πλὴν τοῖς Ἰουδαίοις
  choice: 除了犹太人以外，众人都清楚看见了他们
  rationale: φανεροί在叙事中表示可被察见；译文明确保留“所有人、唯独犹太人除外”的范围，不解释或弱化这一陈述。
theological_decisions:
- issue: 上帝的拟人化表述 τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: 他的圣面
  alternative: 他的神圣临在；他的圣容
  rationale: 原文采用具体的“面”这一意象。正文保留其神学张力，不把它静默抽象化；脚注提示可表达“临在”的语义可能。
- issue: 天使的 δεδοξασμένοι 所表达的状态
  choice: 满有荣光
  alternative: 得了荣耀；荣耀的
  rationale: 保留完成时被动分词可能含有的“被赋予荣耀并处于荣耀中”的状态，同时避免断定其荣耀形成过程的具体神学含义。
- issue: 犹太人被排除在可见者之外
  choice: 除了犹太人以外，众人都清楚看见了他们
  alternative: 他们向所有人显现，唯独犹太人看不见
  rationale: 原文明确排除犹太人；译文照实保留，不补充原因，也不缓和其叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文保留原文的神显意象及句末可见性对比；为避免汉语长句尾部悬置，将最后的可见性分句独立成句。
