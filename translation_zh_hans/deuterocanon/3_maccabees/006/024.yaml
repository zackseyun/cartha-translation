base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/024.yaml
  text: You have exceeded kings and surpassed tyrants in cruelty; and you are now even attempting to remove me myself[a], your benefactor, from power and from life, secretly plotting what is not advantageous to the kingdom.
translation:
  language: zh_hans
  text: 你们超过了君王，在残暴上胜过了暴君；如今竟企图使我本人——你们的施恩者——失去王权和性命[a]，暗中图谋不利于王国的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灵”或“气息”。希腊语“πνεῦμα”可指“灵”“气息”，也可引申指“生命”。
    reason: 保留πνεῦμα的词义歧义；正文依上下文译为“性命”。
lexical_decisions:
- source_word: Παραβεβασιλεύετε
  choice: 你们的所作所为越过了君王的本分
  rationale: 该完成时形式表达越过正当王权行为的界限。这样译既保留针对君王身份的尖锐指控，也避免生硬地直译为“超过君王”。
- source_word: τυράννους ὑπερβεβήκατε ὠμότητι
  choice: 在残暴上胜过了暴君
  rationale: 保留比较结构；ὠμότης在此指残酷、凶暴，“残暴”符合政治谴责的语境。
- source_word: ἐμὲ αὐτόν
  choice: 我本人
  rationale: 保留反身强调，突出说话者对受恩者竟谋害自己的震怒。
- source_word: τὸν ὑμῶν εὐεργέτην
  choice: 你们的恩主
  rationale: εὐεργέτης在希腊化政治语境中指施恩者；“恩主”简洁、庄重，并能体现双方身份关系。
- source_word: τῆς ἀρχῆς
  choice: 从王位上
  rationale: ἀρχή在此指统治权或统治地位；结合君王说话的语境，“王位”比泛称“权力”更自然具体。
- source_word: τοῦ πνεύματος
  choice: 性命
  rationale: πνεῦμα本义范围包括气息、灵和生命；与剥夺统治权并列且处于秘密谋害语境中，“性命”最自然地表达夺命之意，同时以脚注保留原词歧义。
- source_word: μεθιστᾶν
  choice: 赶下来，并夺去
  rationale: 该动词统摄ἀρχή与πνεῦμα，意为使离开或除去。中文分别搭配“王位”和“性命”，可自然表达同一动词的双重宾语。
- source_word: λάθρα μηχανώμενοι
  choice: 暗中图谋
  rationale: 准确表达秘密策划及其敌对意图，语言简洁庄重。
- source_word: τὰ μὴ συμφέροντα τῇ βασιλείᾳ
  choice: 不利于王国的事
  rationale: 忠实表达与王国利益不相合的事；中文自然，且不把原文较含蓄的否定强化为明确的毁灭性危害。
theological_decisions:
- issue: πνεῦμα在本节中的含义
  choice: 正文译作“性命”
  alternative: “灵”或“气息”
  rationale: 政治夺权和秘密谋害的上下文表明，这里最可能指维系生命的气息，即性命。不过πνεῦμα本身具有“灵、气息、生命”等义项，因此用脚注保留词义张力，不将其处理为有关人论的教义判断。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“竟”传达καὶ在此累加语境中的震惊和强调；破折号自然标明“你们的恩主”是对“我本人”的同位说明。
