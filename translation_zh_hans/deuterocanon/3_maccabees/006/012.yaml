base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/012.yaml
  text: But you[a], who possess all might and dominion, unceasing One, eternal One, look now; have mercy on us[c][b], who through the insolent violence of lawless men are being irrationally removed from life in the manner of plotters.
translation:
  language: zh_hans
  text: 但你拥有一切力量和权柄，永不止息者[a]、永恒者啊，如今请垂看；求你怜悯我们——我们正因不法之人的狂妄暴行，毫无道理地被夺去生命[b]，如同阴谋者一样[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永不止息者”或译“永不疲倦者”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“被从活着之中移走”；这里的意思是被置于死地。
    reason: lexical_alternative
  - marker: c
    text: “阴谋者”也可译“图谋者”；或译“以阴谋者的方式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλκήν
  choice: 力量
  rationale: 指力量、勇力；与“权柄”并列，既保持区别，也符合现代汉语祷告语体。
- source_word: δυναστείαν
  choice: 权柄
  rationale: 侧重统治、支配的权能，不仅是体力或能力，因此译作“权柄”。
- source_word: ἀπάναυε
  choice: 永不止息者
  rationale: 此处为呼格神圣称号，与后面的 αἰώνιε 并列；译成名词性称谓，以保留原文的直接呼告。
- source_word: αἰώνιε
  choice: 永恒者
  rationale: 呼格形式，与“永不止息者”平行，保持庄严而不擅自补入“上帝”。
- source_word: ἐπίδε
  choice: 如今请垂看
  rationale: 命令式表达紧迫的祈求；“垂看”自然体现向上帝求告的语气。
- source_word: καθʼ ὕβριν
  choice: 因……狂妄暴行
  rationale: ὕβρις 不只是骄傲，也包含傲慢、凌辱和暴力；“狂妄暴行”兼顾其道德与行动层面。
- source_word: ἀνόμων
  choice: 不法之人
  rationale: 保留“违背律法、无法无天”的含义，同时不在中文中额外限定性别。
- source_word: ἀλόγιστον
  choice: 毫无道理地
  rationale: 传达行为不合理、无理而荒谬的性质，比“非理性地”更符合现代汉语。
- source_word: ἐκ τοῦ ζῆν μεθισταμένους
  choice: 被夺去生命
  rationale: 原文直陈从活着的状态中被移走；上下文所指为遭到处死，正文采用自然表达，并以脚注保留字面意象。
- source_word: ἐν ἐπιβούλων τρόπῳ
  choice: 像图谋害人者一样
  rationale: ἐπίβουλος 指暗中图谋或谋害者；此译保留受害者仿佛被当作这类人的意味，并以脚注提示原文结构的歧义。
theological_decisions:
- issue: 神圣呼格 ἀπάναυε 与 αἰώνιε 的处理
  choice: 分别译为“永不止息者、永恒者”，作为两个并列的直接称号。
  alternative: 将 ἀπάναυε 理解为修饰“垂看”的副词，或合并译成“永不疲倦、永恒的上帝”。
  rationale: 希腊文连续使用两个呼格形式。分别保留称号，既呈现祷告的庄严节奏，也避免补入原文未明说的“上帝”。
- issue: ἐκ τοῦ ζῆν μεθισταμένους 所指
  choice: 正文译为“被夺去生命”，理解为面临死亡。
  alternative: 直译为“被从活着之中移走”，或理解为生活方式遭到剥夺。
  rationale: 原文字面是离开活着的状态；在处决威胁的叙事背景中主要指被杀，但脚注保留其字面图像。
- issue: ἐν ἐπιβούλων τρόπῳ 的关系
  choice: 译为“像图谋害人者一样”，不进一步说明是被视为、被处置为还是以某种方式行事。
  alternative: 译为“仿佛我们是同谋”或“以谋害者的方式”。
  rationale: 希腊语介词短语本身可描述方式或身份类比。正文保留这种张力，避免擅自补足法律定罪或具体处置方式。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“垂看”“怜悯”“权柄”保持经文应有的尊严；其余措辞避免生硬直译。标点突出呼告与紧迫祈求，同时保留原文后半句在受害方式与身份类比上的歧义。
