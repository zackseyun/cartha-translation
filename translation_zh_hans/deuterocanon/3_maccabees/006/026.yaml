base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/026.yaml
  text: Who has so lawlessly surrounded with cruelties those who from the beginning have surpassed all nations in goodwill toward us in every respect, and who have repeatedly shown themselves to face the worst dangers among men?
translation:
  language: zh_hans
  text: 究竟是谁如此无法无天，使这些从起初就对我们怀有善意、并在各方面都胜过所有民族[a]，又屡次在最严重的人间危险中显明自己[b]的人，饱受种种凌辱呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胜过”也可译作“有别于”；希腊语动词既可表示“不同”，也可在此比较语境中表示“胜过、出众”。
    reason: lexical_alternative
  - marker: b
    text: “最严重的人间危险”中“人间”的原文关系含混，也可理解为“世人所遭遇的最严重危险”。“饱受种种凌辱”直译近于“被种种残酷凌辱包围”。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: 究竟是谁
  rationale: 引出带有强烈责问意味的修辞问句；“究竟”自然传达其语气。
- source_word: τοὺς ἐξ ἀρχῆς
  choice: 这些从起初就……的人
  rationale: 保留时间起点及定冠词短语所指的群体。
- source_word: εὐνοίᾳ πρὸς ἡμᾶς
  choice: 在对我们的善意上
  rationale: εὔνοια指善意、友好或好感；此译法保留与后面比较表达的联系。
- source_word: κατὰ πάντα διαφέροντας πάντων ἐθνῶν
  choice: 处处胜过各民族
  rationale: 在比较结构中将διαφέρω理解为“胜过、优于”，同时以“处处”表达κατὰ πάντα；脚注保留“有别于”的词义可能。
- source_word: τοὺς ... ἐπιδειγμένους
  choice: 显明自己的人
  rationale: 保留ἐπιδείκνυμι中间语态所带的自我显明意味，不额外指定其所显明的具体品格。
- source_word: πλεονάκις
  choice: 屡次
  rationale: 简洁传达多次、反复发生。
- source_word: χειρίστους ... κινδύνους
  choice: 极大危险
  rationale: 以自然汉语表达最高级所指的最严重、最险恶之危险。
- source_word: ἀνθρώπων
  choice: 世人所遭遇的
  rationale: 该属格与“危险”的关系含混；正文采用符合汉语的宽泛理解，脚注说明其他可能。
- source_word: οὕτως ἀθέσμως
  choice: 如此无法无天
  rationale: 传达违反法律、规矩与正义的强烈道德—法律色彩。
- source_word: περιέβαλεν αἰκίαις
  choice: 使……饱受凌辱
  rationale: 原文直译近于“以凌辱包围”；汉语用“饱受凌辱”自然表达遭受多重虐待和侮辱的状态，脚注保留其形象。
