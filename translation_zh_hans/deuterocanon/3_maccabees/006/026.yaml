  rationale: 修订明确表达原文最高级“最严重”，避免把困难属格关系过度释义为“世人所遭遇的”，并改善脚注锚点。保留“显明自己”，以免添加原文未明确的“勇气”“忠诚”等具体内容；“饱受种种凌辱”则自然传达“以残酷行为包围”的被动遭遇及复数力度。
