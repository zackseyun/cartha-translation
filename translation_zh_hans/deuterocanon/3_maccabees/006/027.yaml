  text: Release[a], release the unjust bonds; send them away to their own homes in peace[b], setting aside what has been ordered.
translation:
  language: zh_hans
  text: “解开，彻底解除不义的束缚；把他们平安地送回自己的家[a]，并放弃先前所下的命令[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“送回他们自己的地方”。希腊语可较广泛地指属于他们自己的地方、家室或产业。
    reason: lexical_alternative
  - marker: b
    text: 或译“不再执行先前所下的命令”。原文分词表示放弃或不再坚持已经颁下的命令。
    reason: lexical_alternative
lexical_decisions:
- source_word: λύσατε
  choice: 解开
  rationale: 复数命令式；与“束缚”搭配自然，保留解除捆绑的具体意象和命令语气。
- source_word: ἐκλύσατε
  choice: 解除
  rationale: 第二个命令式加强前一命令。用近义词承接，既体现希腊文的重复强调，又避免现代汉语中机械复述。
- source_word: ἄδικα δεσμά
  choice: 不义的束缚
  rationale: ἄδικα 指道德和司法上的不公；δεσμά 可指实际的镣铐，也可泛指拘束。“束缚”保留两方面的可能。
- source_word: εἰς τὰ ἴδια
  choice: 回自己的家
  rationale: 该短语指回到属于他们自己的地方、家中或家人那里；按释放被拘者的语境译作“回自己的家”最自然，同时以脚注保留较宽泛的含义。
- source_word: μετʼ εἰρήνης
  choice: 平安
  rationale: 以现代汉语常用的状语表达“在平安中”，语气庄重简洁。
- source_word: ἐξαποστείλατε
  choice: 送回
  rationale: 复数命令式，意为遣送、送走；结合 εἰς τὰ ἴδια，以“送回”清楚表达目的地和获释后的归返。
- source_word: τὰ προστεταγμένα
  choice: 先前所下的命令
  rationale: 中性复数完成时被动分词作名词用，指已经吩咐或颁下的事项；不明确命令发布者。
- source_word: παραιτησάμενοι
  choice: 撤销
  rationale: 不定过去时中间语态分词在此表示放弃、不再执行已经颁下的命令。“撤销”符合政令语境，也清楚传达使其不再生效。
