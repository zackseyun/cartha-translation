  yaml_path: translation/deuterocanon/3_maccabees/006/016.yaml
  text: But just as Eleazar was finishing his prayer[a], the king came along by the hippodrome with the beasts and all the tumult of his forces.
translation:
  language: zh_hans
  text: 以利亚撒的祷告刚到尾声，王就带着那些猛兽和全军的嚣张声势，沿着赛马场前行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“全军的喧闹威吓。”希腊语此处的词语带有咆哮、喧闹或狂傲炫示的生动意象，描写王的军力所造成的威吓性声势。
    reason: lexical_alternative
lexical_decisions:
- source_word: λήγοντος ἄρτι
  choice: 刚要结束……时
  rationale: 属格独立结构配合ἄρτι，表示祷告正在结束之际；此译保留两个动作几乎同时发生的紧迫感。
- source_word: προσευχῆς
  choice: 祷告
  rationale: 这是该语境中προσευχή自然、准确的现代汉语对应词。
- source_word: παρῆγεν
  choice: 过来了
  rationale: παράγω在这里表示沿某处行进或经过；“过来了”既自然，也保留队伍逼近现场的动态。
- source_word: κατὰ τὸν ἱππόδρομον
  choice: 沿着赛马场
  rationale: κατά加宾格在此表达行进所循的地点或路线。“沿着”保留空间关系，同时不强行断定是在场内还是场边。
- source_word: θηρίοις
  choice: 猛兽
  rationale: θηρίον在本叙事中指用于行刑的危险兽类；“猛兽”比笼统的“动物”更能传达原文的威胁意味。
- source_word: παντὶ τῷ τῆς δυνάμεως φρύαγματι
  choice: 军队的一片咆哮喧嚣
  rationale: φρύαγμα可指鼻息喷张、咆哮、狂傲叫嚣所形成的声势，δυνάμεως在此指军事力量。“咆哮喧嚣”保留其生动、威吓性的听觉形象，又避免把隐喻限定为单一含义。
