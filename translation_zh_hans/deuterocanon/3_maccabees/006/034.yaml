base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/034.yaml
  text: And those who had previously been reckoning them for destruction and to be devoured by birds[a], and had registered them with joy, groaned deeply, clothing themselves with shame[b], and their fire-breathing boldness was vigorously quenched.
translation:
  language: zh_hans
  text: 那些先前认定他们必遭毁灭、被飞鸟吞食的人[a]，又曾欢欢喜喜地把他们登记在册，如今却深深哀叹，把羞耻披在自己身上[b]；他们那如同喷火的狂妄胆量，也被有力地扑灭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“认定”的希腊语分词，在斯威特所据文本中词形和句法都较难确定。整句的意思清楚表明：这些人先前认定犹太人注定遭毁灭，尸身将被飞鸟吞食。
    reason: textual_variant
  - marker: b
    text: “如同喷火的狂妄胆量”也可译作“火一般的狂妄”。原文使用强烈的比喻，在本段语境中明显含贬义。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε πρὶν
  choice: 那些先前……的人
  rationale: 自然表达此前的行为，并承接叙事中的局势逆转。
- source_word: εἰς ὄλεθρον
  choice: 必遭毁灭
  rationale: 保留ὄλεθρος的毁灭、灭亡之意，并与“认定”构成自然汉语。
- source_word: οἰωνόβρωτους
  choice: 被飞鸟吞食
  rationale: 这一罕见复合词指尸身被鸟啄食；用清楚的现代汉语保留其惨烈图景。
- source_word: ἐξεσθιέμενοι
  choice: 认定他们
  rationale: Swete所据文本在词形与句法上均有困难；结合上下文，谨慎表达这些人先前对犹太人结局的敌意判断，而不擅自重构原文。
- source_word: ἀπογραφάμενοι
  choice: 把他们登记在册
  rationale: 保留该词登记、造册的行政色彩，也符合本段处置犹太人的叙事背景。
- source_word: μετὰ χαρᾶς
  choice: 欢欢喜喜地
  rationale: 以自然汉语传达他们当时带着喜悦行事，反衬如今的羞耻。
- source_word: κατεστέναξαν
  choice: 深深哀叹
  rationale: 复合动词带有加强语气，译文保留沉重叹息之感。
- source_word: αἰσχύνην ἐφʼ ἑαυτοῖς περιβαλόμενοι
  choice: 满身披上羞耻
  rationale: 保留把羞耻如衣披在身上的鲜明隐喻，同时使中文流畅。
- source_word: πυρόπνουν τόλμαν
  choice: 喷火般的狂胆
  rationale: 保留“喷火”的强烈比喻；“狂胆”在语境中传达τόλμα所带的负面、骄横意味。
- source_word: ἀκμαίως ἐσβεσμένοι
  choice: 被强力扑灭了
  rationale: “扑灭”延续前面的火焰意象；“强力”表达ἀκμαίως的有力、猛烈，而不误译为“彻底”。
