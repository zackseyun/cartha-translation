  text: And even the king’s body became seized with shuddering[b][a], and his heavy-hearted boldness was overcome by forgetfulness.
translation:
  language: zh_hans
  text: 王的身体也战栗起来；遗忘攫住了他那阴沉的狂妄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遗忘攫住了他那阴沉的狂妄”也可理解为：他忽然陷入茫然，以致失去了那阴沉的狂妄。希腊文直译为“遗忘攫住了他的狂妄”；这里的“遗忘”可能描写突如其来的意识混乱，使他的决意瓦解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόφρικον
  choice: 不住战栗
  rationale: 此词描述因恐惧而发抖、战栗的身体状态；这样译既保留强烈的生理反应，也比笼统的“害怕”更贴近希腊文。
- source_word: σῶμα
  choice: 身体
  rationale: 按希腊文明译，突出王所受的是可见的身体震颤，而不只是一种内心感受。
- source_word: λήθη
  choice: 遗忘
  rationale: 保留该名词“遗忘、忘却”的基本义；但此处也可能指突发的神志迷乱或意志瓦解，因此另加脚注说明。
- source_word: θράσος
  choice: 狂妄
  rationale: 此词可指胆量，也常含放肆、僭妄的贬义；上下文中的王带着傲慢的敌意行事，故译“狂妄”比中性的“勇气”更合适。
- source_word: βαρύθυμον
  choice: 阴沉的
  rationale: 该复合形容词描写沉重、阴郁或严酷的心性；“阴沉的”在现代汉语中自然，并避免将其误解为悲伤意义的“心情沉重”。
- source_word: ἔλαβεν
  choice: 攫住了
  rationale: 原文以“遗忘”为主语，动词基本义为“抓住、取得”；“攫住了”保留这一主动结构及突然控制住王之狂妄的力度。
