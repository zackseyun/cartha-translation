base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/032.yaml
  text: And when they had ended their utterly mournful song of lamentation[a], they took up the song of their fathers, praising God, the savior of Israel and worker of wonders; and having cast off every cry of grief and wailing[b], they formed dances as a sign of peaceful rejoicing.
translation:
  language: zh_hans
  text: 他们结束了那哀恸至极的挽歌，便唱起祖传的歌[a]，赞美那位拯救以色列、施行奇事的神；他们抛开一切悲号哀哭，组成舞队[b]，作为平安喜乐的标志。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祖传的歌”也可译作“先祖的歌”；原文形容词指属于先祖或祖传传统的事物。
    reason: lexical_alternative
  - marker: b
    text: “舞队”也可译作“合唱队”；原文词语可指跳舞或歌唱的群体，本句语境较倾向舞队。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: καταλήξαντες
  choice: 结束了
  rationale: 不定过去时分词表示先于主句动作发生；“结束了……便……”自然地呈现动作次序。
- source_word: θρήνων πανόδυρτον μέλος
  choice: 哀恸至极的挽歌
  rationale: μέλος是歌曲、曲调，θρήνων限定为哀悼之歌，πανόδυρτον加强悲恸程度；“挽歌”保留音乐意象，“至极”传达强化语气。
- source_word: ἀνέλαβον
  choice: 唱起
  rationale: 此处宾语为“歌”，该动词表示开始或接续唱诵；“唱起”符合现代汉语表达。
- source_word: ᾠδὴν πάτριον
  choice: 祖传的歌
  rationale: πάτριον指属于先祖或祖传传统；“祖传”兼顾家族历史和传统含义。
- source_word: τὸν Ἰσραὴλ σωτῆρα
  choice: 那位拯救以色列……的神
  rationale: σωτήρ可指救主或拯救者；采用动词性定语，使汉语自然，并清楚保留神是以色列拯救者的含义。
- source_word: τερατοποιὸν
  choice: 施行奇事
  rationale: 该复合词指施行神迹奇事者；译作动词性定语，准确而不生硬。
- source_word: οἰμωγὴν ... καὶ κωκυτὸν
  choice: 一切悲号哀哭
  rationale: 两个词都指发声的悲痛表现；“悲号哀哭”保留并列和强烈情感。
- source_word: ἀπωσάμενοι
  choice: 抛开
  rationale: 中间语态分词表达主动排除、摒弃悲哀；“抛开”体现其坚决性。
- source_word: χοροὺς συνίσταντο
  choice: 组成歌舞队
  rationale: χορός可指合唱队、舞队或歌舞群体，συνίστημι表示组织、组成；正文用“歌舞队”保留其语义宽度。
- source_word: εὐφροσύνης εἰρηνικῆς σημεῖον
  choice: 作为平安喜乐的标志
  rationale: σημεῖον为标志，εὐφροσύνη为欢喜快乐，εἰρηνικός表示和平、安宁；“平安喜乐”简洁保留两层意义。
theological_decisions:
- issue: “拯救以色列、施行奇事者”的所指
  choice: 将两个称号都直接用于神
  alternative: 将其扩展为带有特定教义含义的神学称号
  rationale: 希腊文中相关成分均与θεόν构成同位关系，明确赞美神是拯救以色列并施行奇事的那一位；不作超出经文的教义发挥。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“哀恸至极的挽歌”与“平安喜乐”形成经文原有的强烈转折；分号保留长句的推进关系。所有脚注标记均置于相应词语之后。
