  text: And they approached the king[a], asking for their release to their own homes.
translation:
  language: zh_hans
  text: 他们便求见国王，请求准许他们离开，返回自己的家园[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“返回自己的地方。”希腊语“自己的”可较广泛地指属于他们的地方或事物；这里很可能是指回家。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέτυχον
  choice: 求见
  rationale: 此动词可指会见、接近或向某人陈情；“求见”既保留直接面见国王的情景，也不把行动限定为正式的法律请愿。
- source_word: τῷ βασιλεῖ
  choice: 国王
  rationale: 如实表达带冠词的与格对象，原文在此没有额外的称号含义。
- source_word: τὴν ἀπόλυσιν αὐτῶν
  choice: 准许他们离开
  rationale: ἀπόλυσις可指释放、遣散或准许离去；结合返回家园的目的，“准许他们离开”自然表达此处所求，并避免误解为更广泛的法律性解放。
- source_word: εἰς τὰ ἴδια
  choice: 返回自己的家园
  rationale: 该希腊语习语可泛指回到属于自己的地方或事物；在此语境中最可能指回到自己的住处或故土。“家园”保留一定范围，不局限于具体房屋。
- source_word: αἰτούμενοι
  choice: 请求
  rationale: 现在分词说明他们求见国王时所提出的要求；“请求”准确而自然。
