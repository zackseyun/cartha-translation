  yaml_path: translation/deuterocanon/3_maccabees/006/011.yaml
  text: Let not the empty-headed bless the empty things over the destruction of those beloved by you[a], saying[c][b], “Not even their God rescued them.”
translation:
  language: zh_hans
  text: 不要让心思虚妄的人因你所爱之人的灭亡而向虚妄之物称颂，说：“连他们的神也没有救[a]他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救”也可译作“搭救”或“解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... εὐλογησάτωσαν
  choice: 不要让……称颂
  rationale: μή加第三人称命令式表达祈求式禁止；译为“不要让”保留说话者向神发出的恳求，而不是改成直接斥责敌人。
- source_word: τοῖς ματαίοις
  choice: 向虚妄之物
  rationale: μάταιος的中性复数可指虚妄、无价值之物；此译保留泛指和贬斥意味，不径自限定为“偶像”，并与“心思虚妄的人”形成词语呼应。
- source_word: οἱ ματαιόφρονες
  choice: 心思虚妄的人
  rationale: 该复合词指思想虚妄、徒然的人；这一表达庄重自然，也保留与ματάιοις共享的“虚妄”词根效果。
- source_word: ἐπὶ τῇ τῶν ἠγαπημένων σου ἀπωλείᾳ
  choice: 因你所爱之人的灭亡
  rationale: ἐπί加与格在此表示称颂的缘由或场合；“因……灭亡”清楚表达他们以这场毁灭为由称颂。ἠγαπημένων为完成时被动分词，译作“你所爱之人”。
- source_word: Οὐδὲ ὁ θεὸς αὐτῶν ἐρύσατο αὐτούς
  choice: 连他们的神也没能救他们
  rationale: οὐδέ突出“连……也不”；ἐρύσατο指从危难中救出。“没能救”在中文引语中自然地传达敌人的讥讽，但不表示神在本体上无能。
theological_decisions:
- issue: τοῖς ματαίοις是否应明确译作偶像
  choice: 采用较宽泛的“虚妄之物”
  alternative: “偶像”或“虚无的神明”
  rationale: 犹太论战语境中该词可能暗指偶像，但本句没有明确使用“偶像”一词；保留宽泛措辞可维持原文的含混和论战色彩。
- issue: “连他们的神也没能救他们”是否是叙述者的神学断言
  choice: 保留为敌人口中的讥讽引语
  alternative: 改写为较弱的“他们的神也没有救他们”
  rationale: λέγοντες明确引出虚妄之人的话；译文用引号保留话语层次，避免把其中的讥讽当成叙述者的判断。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“心思虚妄的人／虚妄之物”有意重现原文的词根呼应；不用较口语且偏侮辱性的“没脑子的人”。脚注标记紧接引语提示词，说明引语中“救”的词义选择。
