review_pass:
  verdict: revise
  source_fidelity: 草稿将κρατήσαντας明确解作“为我们守住……要塞的人”，并将ἡμῶν解作“为我们”，这一处理在艰涩的希腊语构句中虽可设想，却过度确定，且“替王国守卫”并非原文所明说。英文审校轨迹较谨慎地将重点放在人被从其国土和家宅的安全处所带走。中文宜避免把对象限定为守卫要塞者，同时保留“ἐν πίστει”及相关分词结构的歧义。
  naturalness: 原译句通顺、庄重，但“那些忠心为我们守住国中要塞的人离开家园”使“家园”成为守卫者离开的地点，语义比原文及英文审校轨迹更狭窄。改译以“我们这些人”承接被带走、被聚集的对象，更符合上下文的受害者视角，也更自然。
  terminology: “国中要塞”可用，但在此高度不确定的组合中，“国土和家宅的坚固处所”较少预设其为军事守卫任务。ἐν πίστει正文译为“在信实中”，以保留与“信心／信靠／忠信”有关的开放性；脚注说明其不寻常用法。
  issues:
  - severity: high
    issue: 将“为我们守住国中要塞的人”作为确定主旨
    rationale: 原文的τοὺς κρατήσαντας ἡμῶν ἐν πίστει与后续宾格、属格短语关系艰涩；该译法把ἡμῶν确定为“为我们”，并补出“替王国守卫”的角色，超过文本可安全表达的程度。
  - severity: medium
    issue: “离开家园”弱化了被从安全处所带走的表达
    rationale: ἀποστήσας表达使人离开／带离；结合英文审校轨迹及句中“坚固处所”，宜明确保留“从……带离”的方向性。
  - severity: medium
    issue: 脚注b的说明与正文分析不够中性
    rationale: 脚注先把“守卫要塞”的解释作为正文事实，再列出其他分析，未充分反映原句构造存在实质不确定性。应改为直接说明正文采取的保守概括，并列出主要替代分析。
  revised_text: 是谁把我们这些曾在信实中守住我们国土和家宅的坚固处所的人，一个个从那里带离，又毫无缘由地聚集到这里来呢？[a]
  revised_footnotes:
  - marker: a
    text: 本句希腊语句法艰涩，尤其是“曾在信实中守住”（τοὺς κρατήσαντας ἡμῶν ἐν πίστει）与“我们国土和家宅的坚固处所”之间的关系不易确定。“在信实中”（ἐν πίστει）也可译为“在信心中”“凭信靠”或“忠信地”。另一种理解是：人们被从本国和家宅的安全处所带走；也有人将相关分词理解为“那些掌控我们的人”。
    reason: textual_difficulty
  revision_rationale: 修订删除“为我们／替王国守卫”的无据补足，改以“我们这些……的人”保留原文分词所指的人员与“一个个”之间的联系，并将ἀποστήσας明确译为“从那里带离”。“在信实中”不把πίστις狭义定为政治忠诚或教义性信心；脚注完整保留词义和句法歧义。
