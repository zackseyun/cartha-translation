base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/025.yaml
  text: Who was it that removed each one from the secure strongholds of our homeland and household[a], where they had held us in faith[b], and gathered them here without reason?
translation:
  language: zh_hans
  text: 是谁使那些忠心[a]为我们守住国中要塞的人离开家园，又毫无道理地把他们一个个聚集到这里来呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忠心”所译的希腊语ἐν πίστει也可理解为“在信靠中”“受信任地”或“凭信实”；本句中的用法不寻常。
    reason: lexical_alternative
  - marker: b
    text: 本句希腊语句法艰涩。正文把意思理解为：有人使那些忠心替王国守卫要塞的人离开家园，并无理地把他们召集到这里。另一种分析可能把相关短语理解为“那些掌控我们的人”，或指人们被从本国和家宅的安全之处带走。
    reason: textual_difficulty
lexical_decisions:
- source_word: τίς
  choice: 是谁
  rationale: 疑问代词引出带有责问意味的修辞问句；“是谁”在现代汉语中自然且保留原文语气。
- source_word: τοὺς κρατήσαντας ἡμῶν
  choice: 那些……为我们守住……的人
  rationale: 将τοὺς κρατήσαντας理解为后续τὰ…ὀχυρώματα的主事者，ἡμῶν则表示“为我们／替我们”。这种分析使κρατέω与其宾语“要塞”相连，但原句句法艰涩，脚注保留其他可能。
- source_word: ἐν πίστει
  choice: 忠心
  rationale: 此处πίστις处于非教义性、政治忠诚的语境；“忠心”可表达忠诚、可信赖地履行守卫职责，同时以脚注注明“信靠／受信任”的可能含义。
- source_word: τὰ τῆς χώρας ὀχυρώματα
  choice: 国中要塞
  rationale: ὀχυρώματα指坚固防御之处或堡垒，χώρα指国土、疆域；“国中要塞”简洁保留军事意象。
- source_word: τῆς οἰκίας
  choice: 离开家园
  rationale: οἰκία可指房屋、家或家族；与表示离开的ἀποστήσας相连时，“离开家园”符合语境，也不把范围限于一栋房屋。
- source_word: ἀποστήσας
  choice: 使……离开
  rationale: 该分词表达使人离开或使人与原处分离；“使……离开”不额外强化为暴力驱逐。
- source_word: ἕκαστον
  choice: 把他们一个个
  rationale: 保留分配性的单数含义，突出每个人都被召集。
- source_word: ἀλόγως
  choice: 毫无道理地
  rationale: 该副词可指不合理、无正当理由或愚妄；“毫无道理地”兼顾责难语气和语义宽度。
- source_word: ἤθροισεν ἐνθάδε
  choice: 聚集到这里来
  rationale: ἀθροίζω表示聚集、召集，ἐνθάδε明确指“这里”；此译符合现代汉语表达。
theological_decisions:
- issue: πίστις在非教义语境中的译法
  choice: 忠心
  alternative: 在信靠中；受信任地；凭信实
  rationale: 本节所述是守卫国中要塞的人，语境较可能指忠诚可靠，而非专门论述信仰；因此正文采用自然的“忠心”，并用脚注保存词义上的张力。
- issue: 艰涩希腊语句法的处理
  choice: 把κρατήσαντας与“守住要塞”相连，并把ἡμῶν译作“为我们”
  alternative: 把κρατήσαντας ἡμῶν理解为“那些掌控／拘束我们的人”，或把相关短语理解为人原先被安置在本国和家宅的安全之处
  rationale: κρατέω可直接支配随后出现的宾格τὰ…ὀχυρώματα，因此“守住要塞”在语法和上下文中较连贯；不过抄本所见语序仍然困难，故不把该分析说成唯一可能，并在脚注中说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“国中要塞”“离开家园”保持历史叙事的正式感；“毫无道理地”“一个个”则让责问语气清楚易懂。正文优先依据希腊语中κρατέω与宾格“要塞”的可能搭配，不照搬英语咨询层对句法的重组，同时以脚注诚实保留歧义。
