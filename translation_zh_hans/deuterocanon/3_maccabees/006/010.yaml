base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/010.yaml
  text: But if our way of life in the place of our exile has been caught up in ungodliness[a], then, after rescuing us from the hand of our enemies, destroy us by whatever death you choose[b], Master.
translation:
  language: zh_hans
  text: 但如果我们在流亡之地[a]的生活已经陷入不敬虔，那么，主宰[b]啊，求你先救我们脱离仇敌的手，再按你所选择的死法使我们灭亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流亡之地”也可译作“侨居地”或“移居地”；希腊词可指殖民地或聚居地，此处很可能是指这群人在异乡流亡的生活处境。
    reason: lexical_alternative
  - marker: b
    text: “主宰”也可译作“主人”；这里的希腊语是δέσποτα，强调拥有绝对权柄者，并非通常译作“主”的κύριος。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβείας
  choice: 不敬虔
  rationale: 表达对上帝缺乏敬畏的宗教与道德含义，比泛指的“邪恶”更贴近原词。
- source_word: κατὰ τὴν ἀποικίαν
  choice: 在流亡之地
  rationale: ἀποικία可指殖民地或移居地；在本段犹太群体的祷告语境中，译作“流亡之地”既体现远离故土的处境，也避免现代“殖民地”一词造成误解。
- source_word: ὁ βίος ἡμῶν
  choice: 我们的生活
  rationale: 这里的βίος侧重生活方式和行为表现；中文“生活”在句中自然，并可涵盖这一伦理意味。
- source_word: ἐνέσχηκται
  choice: 已经陷入
  rationale: 完成时形式表示已卷入并处于某种状态；“已经陷入”保留这种持续结果，又不额外界定成因。
- source_word: ῥυσάμενος
  choice: 先救我们脱离
  rationale: 不定过去时分词在此表示相对于主命令的先行动作；用“先……再……”清楚传达先蒙拯救、后被处死的次序。
- source_word: ἀπὸ ἐχθρῶν χειρός
  choice: 脱离仇敌的手
  rationale: 保留圣经中“手”表示权势或控制的惯用意象，现代读者也易于理解。
- source_word: ᾧ προαιρῇ
  choice: 照你所选择的死法
  rationale: 与μόρῳ合起来表示由上帝选择死亡的方式；此译法在中文中明确而不增添具体细节。
- source_word: δέσποτα
  choice: 主宰啊
  rationale: δέσποτα强调拥有绝对权柄者，不是κύριος；“主宰”在祷告中庄重自然，也保留两词的词汇区别。
- source_word: ἀπόλεσον ἡμᾶς μόρῳ
  choice: 毁灭我们
  rationale: ἀπόλεσον语气强烈，μόρῳ明确涉及死亡；前面的“死法”已点明死亡方式，因此“毁灭我们”保留原文力度而避免重复。
theological_decisions:
- issue: δέσποτα作为对上帝的称呼
  choice: 主宰啊
  alternative: 主人啊；主啊
  rationale: 采用“主宰”以体现绝对权柄，并避免将δέσποτα无差别地等同于κύριος；同时保持祷告语体的庄重。
- issue: ἀποικία在散居祷告语境中的含义
  choice: 流亡之地
  alternative: 侨居地；殖民地；移居地
  rationale: 原词本身可指移居建立的聚落，但此处重点是群体远离故土、处于外邦权势下的生活；“流亡之地”自然呈现这一语境，同时以脚注保留词义范围。
- issue: 先获救、后由上帝处死的张力
  choice: 求你先救我们……再……毁灭我们
  alternative: 救我们……并毁灭我们
  rationale: 严格保留ῥυσάμενος相对于ἀπόλεσον的先后关系，不淡化祈求者宁愿由上帝处置、也不愿落在仇敌手中的神学张力。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“先……再……”明确原文分词与命令式的时间关系；“毁灭我们”有意保留原文强烈措辞及其令人不安的张力。脚注标记均置于相关表达之后。
