base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/017.yaml
  text: And when the Jews saw it[a], they cried out loudly to heaven, so that even the neighboring courtyards, echoing with them[b], produced uncontrollable terror throughout the whole camp.
translation:
  language: zh_hans
  text: 犹太人看见这一幕[a]，就向天大声呼喊，以致连附近的院落也随之回响[b]，在全营造成无法遏制的惊恐[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“看见后”，没有明说他们看见的是什么；“这一幕”承接上文。
    reason: implicit_object
  - marker: b
    text: 或译：“连邻近的围场也一同回荡。”这里的词可指院落、庭院或有围墙的场地。
    reason: lexical_alternative
  - marker: c
    text: “惊恐”也可译作“恐慌”；原词可表示惊惧、恐怖或慌乱。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρήσαντες
  choice: 看见这一幕
  rationale: 该不定过去时分词交代主句发生的情境；希腊文未明说所见对象，中文以“这一幕”自然承接上文，同时用脚注保留其省略性。
- source_word: μέγα
  choice: 大声
  rationale: 此处作副词修饰“呼喊”，译作“大声”符合现代汉语表达，并保留声音强烈的意味。
- source_word: εἰς οὐρανόν
  choice: 向天
  rationale: 保留呼喊的方向；上下文可能含有向上帝求告之意，但原文说的是“天”，不直接增译为“上帝”。
- source_word: ἀνέκραξαν
  choice: 呼喊
  rationale: 表达强烈地发声呼求；“呼喊”既自然庄重，也不额外限定为愤怒或混乱的叫喊。
- source_word: ὥστε
  choice: 以致
  rationale: 清楚表达后接结果从句的语法关系。
- source_word: τοὺς παρακειμένους αὐλῶνας
  choice: 附近的院落
  rationale: παρακείμενος表示邻近，αὐλών可指院子、庭院或围起来的场地；“附近的院落”兼顾场景与可读性。
- source_word: συνηχήσαντας
  choice: 随之回响
  rationale: 该词表示一同发声或共鸣回荡；“随之回响”自然呈现周围院落因呼声而产生回声的画面。
- source_word: ἀκατάσχετον πτοήν
  choice: 无法遏制的惊恐
  rationale: ἀκατάσχετος意为不能制止或约束，πτοή可指惊惧、恐慌；此译保留强烈程度及其不可控制性。
- source_word: ποιῆσαι
  choice: 造成
  rationale: 在ὥστε引出的结果结构中表达引发、产生某种结果。
- source_word: παντὶ τῷ στρατοπέδῳ
  choice: 在全营
  rationale: στρατόπεδον指军营或营地；“在全营”简洁表达惊恐遍及整个营地。
theological_decisions:
- issue: “向天”所含的宗教指向
  choice: 保留“向天”，不明说“向上帝”
  alternative: 向上帝呼喊
  rationale: 语境很可能指向上帝求告，但希腊文直接说的是“天”。译文保留原有措辞，避免把隐含意义改成明说。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“就……以致……”清楚呈现分词所交代的情境及结果关系；“随之回响”保持声音在邻近空间共鸣的生动画面，不把隐含的求告对象明文化。
