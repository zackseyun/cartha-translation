base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/031.yaml
  text: Then those who had formerly been disgraced and were near Hades—or rather[a], had already stepped onto it—in place of a bitter and hard-to-drink fate, prepared a saving drinking-bout, divided up as dining-couches, full of joy[c][b], the place prepared for them for downfall and a grave.
translation:
  language: zh_hans
  text: 那时，那些先前受辱、临近阴间[a]的人——不如说，已经踏在阴间之上[b]——以一场带来拯救的饮宴[c]取代了苦涩难饮的厄运。他们满心欢喜，把那为使他们倾覆、作他们坟墓而预备的地方，分成一席席斜卧宴饮的席位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”也可按此处的习语理解为“死亡”或“坟墓”；希腊原文直译为“靠近阴间”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文直译为“已经踏在阴间之上”，形象地表示他们已形同死人。
    reason: cultural_note
  - marker: c
    text: 译作“饮宴”的词也可指饮酒聚会，或与饮酒有关的宴席。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπονείδιστοι
  choice: 受尽羞辱
  rationale: 表达遭受公开羞辱、处于可耻境地的含义；“受尽”自然传达先前持续承受的处境。
- source_word: πλησίον τοῦ ᾅδου
  choice: 临近阴间
  rationale: 保留ᾅδης所指死者领域的意象，同时采用现代中文圣经语体中易懂的“阴间”，不简化为“死亡”。
- source_word: ἐπʼ αὐτῷ βεβηκότες
  choice: 已经踏在阴间之上
  rationale: 保留完成时分词的状态意味和“踏上”的鲜明图像，表示他们已形同死人。
- source_word: μόρου
  choice: 厄运
  rationale: μόρος可指命定的灾祸或死亡结局；“厄运”既保留命运意味，也符合此处几乎遭杀害的语境。
- source_word: πικροῦ καὶ δυσαπότικου
  choice: 苦涩难饮的
  rationale: 直保留饮用隐喻，与下文κῶθων的饮宴形成刻意对照。
- source_word: κῶθωνα
  choice: 饮宴
  rationale: 结合设宴动作及随后宴席躺卧处的描写，此处更可能指聚饮宴会，而不是单一酒杯；“饮宴”庄重且易懂。
- source_word: σωτήριον
  choice: 带来拯救的
  rationale: 保留形容词对饮宴的修饰，说明这场庆宴以获救为特征，而不赋予额外教义含义。
- source_word: συστησάμενοι
  choice: 设下
  rationale: 自然表达中间语态所含为自己安排、组织宴饮的意思。
- source_word: εἰς πτῶσιν αὐτοῖς καὶ τάφον ἡτοιμασμένον
  choice: 原为他们的毁灭和坟墓预备的
  rationale: 保留πτῶσις与τάφος的双重表达及场地原本用于杀害、埋葬他们的反转。
- source_word: κλισίας κατεμέρισαν
  choice: 分作一席席宴饮躺卧之处
  rationale: κλισία在宴饮语境中指斜躺用餐的席位；译文保留古代躺卧赴宴的文化图景，并使καταμερίζω的分配意味清楚。
- source_word: πλήρεις χαρμονῆς
  choice: 满心欢喜
  rationale: 以自然现代汉语表达“充满喜乐”，同时凸显从死亡威胁到欢宴的情绪反转。
theological_decisions:
- issue: ᾅδης的译法
  choice: 阴间
  alternative: 死亡／坟墓／哈得斯
  rationale: 原文明确使用ᾅδης，指向死者所在之境；“阴间”保留这一意象，又比音译“哈得斯”更符合普通现代中文读者的理解。脚注说明它在本句中也可按习语理解为临近死亡或坟墓，避免将其限定为特定教义体系。
- issue: σωτήριον的救赎语义范围
  choice: 带来拯救的
  alternative: 救恩的／庆祝获救的
  rationale: 此处首先描述他们从迫近的死亡中获救；采用宽泛的“拯救”既保留词义，也不把具体历史性解救自动扩展为系统神学意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句法分为两句，以减轻希腊语长句在中文中的负担；同时保留“苦涩难饮”与“饮宴”的词语呼应、踏在阴间之上的强烈意象，以及刑场变宴席的反转。所有脚注标记均置于相关词语之后。
