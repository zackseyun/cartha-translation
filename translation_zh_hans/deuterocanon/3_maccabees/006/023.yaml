  naturalness: 原句整体庄重流畅。“愤怒地流着泪，并威吓……”更清楚地呈现希腊文分词和介词短语所构成的伴随状态；“俯伏在地”是现代标准汉语中自然且准确的姿态描写。
  terminology: 将 φίλοι 译为“亲信”可接受，且脚注适当保留其字面义及王廷制度性含义。为避免将其限定为私人友人，保留脚注锚点。[a]位置仍应紧随“亲信”。
