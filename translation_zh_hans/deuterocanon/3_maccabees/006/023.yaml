  yaml_path: translation/deuterocanon/3_maccabees/006/023.yaml
  text: For when he heard the outcry[a], and saw all of them prostrate for destruction, he wept in anger and threatened his friends, saying,
translation:
  language: zh_hans
  text: 因为他听见那喊声，又看见众人全都俯伏在地，面临毁灭，便愤怒地流着泪，威吓他的亲信[a]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲信”希腊原文直译为“朋友”；在王廷语境中，也可指君王身边的近臣或朝臣。
    reason: cultural_note
lexical_decisions:
- source_word: ἀκούσας
  choice: 听见
  rationale: 不定过去时分词交代主句行动发生的情境；与“因为”配合，既保留因由关系，也符合现代汉语叙事。
- source_word: κραυγῆς
  choice: 那喊声
  rationale: κραυγή指高声呼喊或呼号；“喊声”自然清楚，并以“那”承接上下文中的特定呼声。
- source_word: συνιδὼν
  choice: 看见
  rationale: 该复合动词可含观察到、意识到之意；此处后续画面已传达其认知内容，译作“看见”最为直接。
- source_word: πρηνεῖς
  choice: 面伏于地
  rationale: πρηνής表示俯卧、脸朝下；“面伏于地”准确而庄重，也比音译式或过度书面的表达更直观。
- source_word: ἅπαντας
  choice: 众人都
  rationale: 强调在场整个群体，无一例外；“众人都”在汉语中自然体现全称意味。
- source_word: εἰς τὴν ἀπώλειαν
  choice: 眼看就要遭受毁灭
  rationale: εἰς在此表示朝向或面临的结局。“眼看就要”把临近毁灭的趋向自然表达出来，同时不把面伏误解为主动求死。
- source_word: δακρύσας
  choice: 含泪
  rationale: δακρύω表示流泪。此分词与发怒、威吓同时构成复杂情绪，“含泪”凝练地保留这一动作。
- source_word: μετʼ ὀργῆς
  choice: 发怒
  rationale: 表达伴随的愤怒情绪；与“含泪”并列，保留原文泪水与怒气并存的张力。
- source_word: τοῖς φίλοις
  choice: 他的亲信
  rationale: φίλοι基本义为朋友，但在希腊化王廷语境中常指君王身边的近臣、亲信；正文用“亲信”较能传达此处制度性语境，脚注保留其字面义与范围。
- source_word: διηπείλει
  choice: 威吓
  rationale: 未完成时可表示持续或反复发出威胁；“威吓”在此自然表达对亲信严厉施压，未强行增添重复副词。
- source_word: λέγων
  choice: 说
  rationale: 分词引出下一节的直接引语；汉语以“说：”自然衔接。
