  yaml_path: translation/deuterocanon/3_maccabees/006/001.yaml
  text: 'A certain Eleazar, a distinguished man among the Jews of the country, already advanced in age and adorned with every virtue in life, quieted the elders around him to call upon the holy God, and prayed as follows:'
translation:
  language: zh_hans
  text: 有一位名叫以利亚撒的人，是该地的犹太人中的杰出人物。他已经年迈，一生具备各种美德。他让身边的长老安静下来，好呼求圣洁的上帝[a]，随后祷告说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “好呼求圣洁的上帝”也可理解为：他让身边的长老安静下来，然后自己呼求圣洁的上帝；或他使长老安静下来，要他们呼求圣洁的上帝。希腊文在这里没有明说“呼求”的主语。
    reason: 原文不定式 ἐπικαλεῖσθαι 的主语及其句法关系存在真实歧义，需避免在正文中武断消解。
lexical_decisions:
- source_word: Ἐλεάζαρος
  choice: 以利亚撒
  rationale: 采用现代中文圣经传统中常见的人名音译。
- source_word: ἐπίσημος
  choice: 杰出人物
  rationale: 表达此人在群体中显著、受人敬重的地位，不额外引入官职含义。
- source_word: τῶν ἀπὸ τῆς χώρας Ἰουδαίων
  choice: 本地犹太人中
  rationale: 忠实保留“来自该地／该地区的犹太人”这一范围表达，同时使中文简洁自然。
- source_word: ἐν πρεσβείῳ τὴν ἡλικίαν ἤδη λελογχώς
  choice: 已经年迈
  rationale: 该短语表示已经进入老年；以现代中文自然表达其年龄阶段。
- source_word: πάσῃ τῇ κατὰ τὸν βίον ἀρετῇ κεκοσμημένος
  choice: 一生具备各种美德
  rationale: 保留“以美德为装饰”的赞誉意义，避免生硬直译，同时不把 ἀρετή 限定为某一种德行。
- source_word: καταστείλας
  choice: 让……安静下来
  rationale: 该词在此表示使人平静或停止喧声；译文未强化为压制或强行制止。
- source_word: τὸν ἅγιον θεόν
  choice: 圣洁的上帝
  rationale: 直接表达定冠词、形容词与 θεός 的组合，不添加原文没有的专名。
- source_word: προσηύξατο τάδε
  choice: 随后祷告说
  rationale: 自然引出下文祷词，并保留叙事动作的先后关系。
theological_decisions:
- issue: ἐπικαλεῖσθαι 的隐含主语及其与 καταστείλας 的关系
  choice: 让身边的长老安静下来，好呼求圣洁的上帝
  alternative: 让身边的长老安静下来，并呼求圣洁的上帝
  rationale: 希腊文不明确说明“呼求”的执行者究竟是以利亚撒，还是受到引导的长老。正文用不明示主语的目的结构保留这一张力，并以脚注交代两种理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将较长的希腊文句子分为三句，便于普通读者理解，同时保留人物身份、年岁、美德、安静众人、呼求上帝及开始祷告的完整推进。
