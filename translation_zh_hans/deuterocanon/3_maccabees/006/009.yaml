base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/009.yaml
  text: And now[a], hater of insolence, abundant in mercy, judge of all, quickly appear to the holy ones of Israel’s race, who are being mistreated by the abominable[c][b], lawless nations.
translation:
  language: zh_hans
  text: 现在，憎恶傲慢暴行、满有怜悯、审判万有的主啊，求你快快向以色列族的圣民显现[a]；他们正受可憎而不法的列国[b]凌辱[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显现”也可译作“彰显你自己”，强调上帝以可见的方式介入，而不只是来到。
    reason: lexical_alternative
  - marker: b
    text: “列国”在这里指以色列以外的各民族，也可按语境译作“外邦民族”或“外族”。
    reason: lexical_alternative
  - marker: c
    text: “凌辱”所译的希腊语可指带着傲慢和羞辱的虐待、侵害，不只是言语侮辱。
    reason: lexical_alternative
lexical_decisions:
- source_word: μισόβρι
  choice: 憎恨强暴者
  rationale: 此罕见呼格复合词指憎恨ὕβρις（傲慢、暴行、凌辱）者。结合本节末尾同词根动词所指的压迫行为，“强暴”既保留傲慢施暴的力度，也比抽象的“傲慢”更贴合语境。
- source_word: πολυέλεε
  choice: 满有怜悯者
  rationale: 保留复合词所表达的丰盛怜悯，并以现代汉语祷告语体自然呈现。
- source_word: τῶν ὅλων δίκαστα
  choice: 审判万有的主
  rationale: τὰ ὅλα表示一切、万有；δίκαστα为呼格。“审判万有的主”在汉语中明确其呼求对象，并保留普世审判的范围。
- source_word: τάχος
  choice: 快快
  rationale: 作副词催促立即介入；“快快”符合恳切祷告的自然汉语。
- source_word: ἐπιφάνηθι
  choice: 显现
  rationale: 此不定过去时命令式在祷告中请求上帝显明自己并施行干预；“显现”保留可见临在的意味，而不把具体行动说得过满。
- source_word: τοῖς ἁγίοις
  choice: 圣民
  rationale: 实词化形容词指归属于上帝、被分别为圣的人群。汉语“圣民”既自然，又避免“圣徒”可能带入的后期教会称谓。
- source_word: Ἰσραὴλ γένους
  choice: 以色列族中的
  rationale: γένος具有血缘、族属和群体意味；与τοῖς ἁγίοις合译为“以色列族中的圣民”，保留族群限定，同时避免现代汉语“种族”可能造成的误读。
- source_word: ὑπὸ ἐβδελυγμένων ἀνόμων ἐθνῶν
  choice: 受可憎而不法的列国
  rationale: 两个分词性修饰语均保留强烈谴责语气；ἔθνη在此指以色列以外的各民族或国家，“列国”符合经文语境且不预先限定为政治国家。
- source_word: ὑβριζομένοις
  choice: 凌辱
  rationale: 该动词含傲慢、羞辱性的虐待或侵害，不仅是一般受苦。“凌辱”简洁保留其羞辱和暴虐色彩。
theological_decisions:
- issue: τοῖς ἁγίοις对以色列群体的称谓
  choice: 圣民
  alternative: 圣者；你的圣民；圣徒
  rationale: 原文称被分别为圣的一群人，且由“以色列族”限定。译作“圣民”保留群体和盟约语境，不把所指泛化，也避免引入后期特定教会术语。
- issue: γένος的族属含义
  choice: 以色列族中的
  alternative: 以色列种族的；以色列后裔中的；以色列民族中的
  rationale: 此词确有出身、血缘和族群含义。“以色列族”保存该力度，而“中的”自然连接“圣民”，不将圣民与整个族群机械等同。
- issue: ἐπιφάνηθι所含的神圣介入
  choice: 显现
  alternative: 彰显你自己；现身施救
  rationale: 原文请求上帝显现，语境暗示拯救性的介入，但动词本身未明说“施救”。因此正文保留“显现”，不把暗示扩写为明确行动。
translation_notes:
  register: 采用庄重而通顺的现代汉语祷告语体。以“主啊，求你”使连续呼格在汉语中清楚自然；保留原文强烈的道德谴责和“显现”的开放性，不额外规定上帝介入的具体方式。所有脚注标记均置于对应词语之后。
