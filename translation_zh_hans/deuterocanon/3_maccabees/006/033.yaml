  yaml_path: translation/deuterocanon/3_maccabees/006/033.yaml
  text: Likewise, the king also, holding a great banquet because of these things, was continually offering exalted thanksgiving to heaven for their astonishing deliverance that had taken place.
translation:
  language: zh_hans
  text: 同样，王也为这些事举办盛大的宴席[a]，并为他们已经发生的奇异拯救[b]，不断向天大大称谢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“沉重的宴席”，这里是指盛大或丰盛的宴席；也可译作“设下丰盛的宴席”。
    reason: lexical_alternative
  - marker: b
    text: “拯救”也可译作“解救”或“救恩”；本节语境着重于他们实际脱险。“已经发生的”译出希腊文所指这次已经实现的拯救。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: 同样
  rationale: 承接上文并引出平行的行动，简洁保留比较和衔接作用。
- source_word: περὶ τούτων
  choice: 为这些事
  rationale: 在设宴的语境中，介词短语自然表示设宴的缘由，而不只是谈论的主题。
- source_word: συμπόσιον βαρὺ
  choice: 大摆盛宴
  rationale: συμπόσιον指宴席；βαρύ字面为“沉重的”，此处则形容宴席盛大、丰盛。用“大摆盛宴”既自然，又传达其规模。
- source_word: ἀδιαλείπτως
  choice: 不断
  rationale: 表达持续或反复进行的动作，并与未完成时相配。
- source_word: εἰς οὐρανόν
  choice: 向天
  rationale: 保留原文所说的“天”及其方向性，不径自改译为“向上帝”。
- source_word: ἀνθωμολογεῖτο
  choice: 称谢
  rationale: 此处指因获救而表达感激和颂谢，不是认罪；“称谢”也保留庄重语体。
- source_word: μεγαλομερῶς
  choice: 大大
  rationale: 该副词强化称谢的程度或方式；“大大称谢”自然、庄重，也避免加入原文没有的具体礼仪含义。
- source_word: παραδόξῳ
  choice: 非凡
  rationale: 表示出乎意料、不同寻常而令人惊叹；“非凡”兼顾庄重和可读性。
- source_word: γενηθείσῃ αὐτῶν σωτηρίᾳ
  choice: 他们竟蒙了……拯救
  rationale: σωτηρία在此首先指叙事中的实际脱险；γενηθείσῃ表明这拯救已经发生。“竟蒙了”也传达事件出人意料的色彩，但不取代παραδόξῳ本身的修饰作用。
theological_decisions:
- issue: 叙事语境中σωτηρία的译法
  choice: 拯救
  alternative: 救恩；解救
  rationale: 本节庆贺的是具体发生的脱险。“拯救”既符合眼前叙事，也不排除其更广的神学回响；“救恩”在现代中文中较易被理解为专门的教义术语。
- issue: εἰς οὐρανόν所指
  choice: 向天
  alternative: 向上帝；朝着天
  rationale: 原文明确说“天”，可能以敬称方式指向上帝，却没有直接使用“上帝”一词，因此保留原文的含蓄表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大摆盛宴”自然传达宴席的规模；“向天大大称谢”保留原文的敬虔含蓄和强化语气。分号用来理清设宴与称谢这两个相连的行动。
