  text: And the beasts turned against the armed forces following them[a], and they trampled them and destroyed them.
translation:
  language: zh_hans
  text: 那些兽转而冲向跟随它们的武装部队[a]，不断践踏他们，并毁灭他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与它们一同随行的武装部队。”希腊语分词既可表示“跟随”，也可表示“一同随行”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: 转身冲向
  rationale: 主动复数动词以“那些兽”为主语，表示它们改变方向扑向新的目标；结合后文的践踏与毁灭，“冲向”自然传达敌对行动。
- source_word: τὰ θηρία
  choice: 那些兽
  rationale: θηρία指兽类或野兽；本段语境是用于行刑的大象。“那些兽”既承接上下文，又保留其危险、凶猛的叙事色彩。
- source_word: ἐπὶ
  choice: 冲向
  rationale: ἐπί与运动动词连用可表示“向着、扑向”；后续攻击行为表明这里含有敌对方向，因此融入“冲向”表达。
- source_word: τὰς συνεπομένας ἔνοπλους δυνάμεις
  choice: 跟随它们的武装部队
  rationale: συνεπομένας可指一同随行或跟随，ἔνοπλους δυνάμεις指武装力量。译文保留“跟随”的关系，不进一步限定其具体队列位置。
- source_word: κατεπάτουν
  choice: 践踏
  rationale: 未完成过去时描绘持续发生的动作；“践踏”简洁而形象地表达踩踏、踏压。
- source_word: ὠλέθρευον
  choice: 毁灭
  rationale: 该动词表示毁坏、消灭或使之灭亡；“毁灭”保留原词的强烈程度，同时不把含义缩窄为单纯“杀死”。
