base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/006.yaml
  text: You rescued the three companions in Babylonia[a], who had willingly given up their lives to the fire so as not to worship empty things; after cooling the blazing furnace, you delivered them all unharmed[b], and sent a flame upon all their adversaries.
translation:
  language: zh_hans
  text: 你曾拯救在巴比伦尼亚的三个同伴：他们宁愿把自己的性命交给烈火，也不敬拜那些虚空之物[a]。你使熊熊燃烧的火窑变得清凉，救他们众人毫发无损[b]，又向所有与他们为敌的人降下火焰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚空之物”指虚假的敬拜对象；也可译作“虚妄之物”，按所指解释则是“偶像”。
    reason: 保留τοῖς κενοῖς的字面意象，并说明其语境所指。
  - marker: b
    text: “毫发无损”直译为“直到每一根头发”，意思是连一根头发也没有损失。
    reason: 说明μέχρι τριχός的原文字面表达及其完全保全之意。
lexical_decisions:
- source_word: ἑταίρους
  choice: 同伴
  rationale: 此词指伙伴、同伴；采用“同伴”既自然，也不越过希腊文本补入三人的名字或特定身份称谓。
- source_word: πυρὶ τὴν ψυχὴν αὐθαιρέτως δεδωκότας
  choice: 宁愿把自己的性命交给烈火
  rationale: ψυχή在这里指生命，αὐθαιρέτως强调出于自愿；“宁愿……也不……”自然表达其甘愿冒死而拒绝敬拜的取舍。
- source_word: τοῖς κενοῖς
  choice: 那些虚空之物
  rationale: 保留 substantivized adjective 的直译及其贬抑意味，不直接改成较解释性的“偶像”；“那些”表明所指为敬拜对象。
- source_word: διάπυρον ... κάμινον
  choice: 熊熊燃烧的火窑
  rationale: διάπυρος强调烧得炽烈；“熊熊燃烧”在现代汉语中清楚而有画面感。
- source_word: δροσίσας
  choice: 使……变得清凉
  rationale: 该词有使凉爽、如露水般降温之意；此译保留神使烈焰中的火窑转为清凉的反差。
- source_word: ἐρρύσω μέχρι τριχὸς ἁπάντων
  choice: 救他们众人毫发无损
  rationale: μέχρι τριχός字面涉及“一根头发”，是完全保全的表达；“毫发无损”既自然又保留原文意象。
- source_word: φλόγα πᾶσιν ἐπιπέμψας τοῖς ὑπεναντίοις
  choice: 又降下火焰，烧灭所有与他们为敌的人
  rationale: ἐπιπέμπω表示使火焰临到对敌者；结合火窑故事的语境，“烧灭”明确表达火焰临到仇敌所造成的结果，同时保留“火焰”意象。
- source_word: κατὰ τὴν Βαβυλωνίαν
  choice: 在巴比伦尼亚
  rationale: 按地理位置理解，译为“在巴比伦尼亚”简明准确。
theological_decisions:
- issue: 对火窑中三人的经文典故
  choice: 保留“三个同伴”的含蓄指称，不补入姓名
  alternative: 译作“三个青年”，或明确补出哈拿尼雅、米沙利、亚撒利雅的名字
  rationale: 希腊文本只称他们为“三个同伴”，假定读者熟悉该故事；译文不应以其他传统文本扩写本节。
- issue: τοῖς κενοῖς所指的敬拜对象
  choice: 译作“那些虚空之物”
  alternative: 译作“偶像”或“虚妄的偶像”
  rationale: “偶像”符合所指，却会把原文的评价性隐喻直接解释掉；“虚空之物”保留其神学讽刺，同时由“敬拜”一词使含义可懂。
- issue: 神对三人和敌人的相反行动
  choice: 并列保留使火窑清凉、完全救护三人以及降火于敌人的张力
  alternative: 弱化对敌人的审判，笼统译作“使火焰临到敌人”
  rationale: 原文同时陈述拯救与审判，不宜为消解张力而省略或淡化其中一面。
translation_notes:
  register: 采用现代、庄重而易懂的叙事祷告语体。以“你曾”承接对上帝既往作为的呼求；句式保持紧凑，并用冒号呈现三个同伴的自愿受难背景。脚注标记均置于对应正文词句之后。
