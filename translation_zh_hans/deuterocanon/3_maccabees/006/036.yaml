  naturalness: 原译整体庄重通顺。“他们整个侨居群体”略显生硬；“他们全体侨居社群”在现代书面汉语中更自然。调整后的句法也更清楚地呈现条例的内容及庆日的理由。
  terminology: “条例”适当地表达θεσμός的正式、共同性质；“侨居社群”保留παροικία所含寄居异地的群体身份；“拯救”合乎此处从危难中获救的语境。正文保留“众神”，不以语境擅改希腊文本的复数。
