- from: 他们就这些事共同制定了一项规章，要他们整个侨居群体世世代代遵守；并决定把前面所说的那些日子当作欢庆的日子来守，不是为了饮酒和贪食，而是为了纪念那临到他们、借众神[a]而成的拯救。
