base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/036.yaml
  text: And having established a common ordinance concerning these things for all their community throughout their generations[a], they decreed that the previously mentioned days should be observed as days of rejoicing, not for the sake of drinking and gluttony, but because of the deliverance that had come to them through God.
translation:
  language: zh_hans
  text: 他们就这些事制定了一项共同的条例，规定他们全体侨居社群要世世代代守前面所说的那些日子，以欢庆度过；这不是为了饮酒和贪食，而是因为他们借众神[a]所得到的拯救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“借众神”（διὰ θεῶν）。这一复数说法在本书的犹太信仰语境中显得异常；有些译法按语境理解为“借上帝”，但此处保留现存希腊文本的复数形式。
    reason: textual_variant
lexical_decisions:
- source_word: κοινὸν ὁρισάμενοι ... θεσμὸν
  choice: 共同制定了一项规章
  rationale: 体现该规章由全体共同确立，并保留θεσμός的正式、制度性含义。
- source_word: ἐπὶ πᾶσαν τὴν παροικίαν αὐτῶν εἰς γενεάς
  choice: 要他们整个侨居群体世世代代遵守
  rationale: παροικία指寄居异地的群体；“侨居群体”既保留寄居背景，也符合现代汉语。εἰς γενεάς译作“世世代代”，表达持续传承。
- source_word: τὰς προειρημένας ἡμέρας ἄγειν ἐστήσαν εὐφροσύνους
  choice: 决定把前面所说的那些日子当作欢庆的日子来守
  rationale: ἄγειν用于节日可指守节、庆祝；“当作欢庆的日子来守”兼顾遵守和庆贺。ἐστήσαν在此表达正式作出的决定。
- source_word: πότου ... καὶ λιχνείας
  choice: 饮酒和贪食
  rationale: πότος直指饮酒或酒宴，λιχνεία指贪嘴、纵食；译文保留原文对享乐性过度饮食的批评。
- source_word: σωτηρίας
  choice: 拯救
  rationale: 此处指他们从现实危难中获救；“拯救”既适合历史性解救，也保留宗教意味。
- source_word: τῆς διὰ θεῶν γενομένης αὐτοῖς
  choice: 那临到他们、借众神而成的拯救
  rationale: 严格保留Swete所载θεῶν的复数形式，并以脚注说明其与犹太叙事语境之间的张力，不在正文中擅自改为单数。
theological_decisions:
- issue: διὰ θεῶν中的θεῶν为复数，而叙事处于犹太信仰语境
  choice: 正文译作“借众神”，并加脚注
  alternative: 按语境译作“借上帝”
  rationale: 现有希腊文本明确为复数θεῶν。原文优先且应保存真实的文本与神学张力，因此不凭语境静默改成单数；脚注同时提示其在犹太叙事中的异常。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“侨居群体”保留παροικία所含的异地寄居身份；分号理清制定规章与决定守节之间的结构。“为了纪念”使中文的庆日动机自然明确，虽原文仅以属格说明原因，其含义仍为因所得拯救而欢庆。
