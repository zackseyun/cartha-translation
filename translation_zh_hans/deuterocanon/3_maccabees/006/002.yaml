  yaml_path: translation/deuterocanon/3_maccabees/006/002.yaml
  text: O King[a], mighty in power, Most High, almighty God, governing all creation with mercies[b],
translation:
  language: zh_hans
  text: 君王啊，大有权能者，至高者，全能的上帝，你以诸般怜悯[a]治理整个受造界，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诸般怜悯”也可译作“丰富的怜悯”或“满怀怜悯”；希腊文使用复数名词，可强调上帝多方的怜悯行动或丰盛的慈悲。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦ
  choice: 君王啊
  rationale: 这是祷告开头的呼格称谓；“啊”明确表达直接呼求，并保持庄重语气。
- source_word: μεγαλοκράτωρ
  choice: 大有权能者
  rationale: 这个复合词强调强大的权能或统治力量；译作“大有权能者”既保留独立称号，也避免与后面的“全能”完全重合。
- source_word: ὕψιστε
  choice: 至高者
  rationale: 保留神圣称号的最高级含义，也是现代中文圣经语体中清楚而庄重的表达。
- source_word: παντοκράτωρ
  choice: 全能的
  rationale: 作为神的称号，此处译作“全能的”简洁自然，并与“上帝”连用，保留其神学分量。
- source_word: δέε
  choice: 上帝
  rationale: 上下文和所提供的校勘理解均将此呼格作为对上帝的直接称呼；中文与“全能的”相连，形成自然的称谓。
- source_word: τὴν πᾶσαν ... κτίσιν
  choice: 一切受造之物
  rationale: κτίσις在这里指整个受造界；“一切受造之物”忠实表达整体范围，且普通读者容易理解。
- source_word: διακυβερνῶν
  choice: 治理
  rationale: 该词可带有掌舵、引导之意；在宇宙性和君王性的语境中，“治理”最自然地表达持续掌管。
- source_word: ἐν οἰκτιρμοῖς
  choice: 以诸般怜悯
  rationale: 保留希腊文复数名词所体现的丰富怜悯或多方怜悯之举，同时使中文祷告语句自然庄重。
theological_decisions:
- issue: 连续并列的神圣称号
  choice: 逐一保留“君王”“大有权能者”“至高者”“全能的上帝”
  alternative: 将若干称号合并为“大能至高的全能上帝”
  rationale: 原文刻意叠加称号，形成祷告中的赞颂力度；逐一保留可呈现神的王权、权能、至高和全能，而不把这些层面压缩为一个泛称。
- issue: παντοκράτωρ的表达
  choice: 全能的
  alternative: 统管万有的
  rationale: “统管万有的”可以体现词源上的统治意味，但原句随后已说到治理整个受造界；“全能的”保留传统而清楚的神圣称号，也避免不必要的重复。
- issue: οἰκτιρμοί的复数意味
  choice: 诸般怜悯
  alternative: 怜悯地
  rationale: 采用名词性表达，以免把复数所暗示的丰盛怜悯或具体怜悯行动完全化为一般方式副词；不进一步限定它究竟侧重情感、属性还是行动。
translation_notes:
  register: 采用现代、庄重的祷告语体。保留原文连续呼告的节奏，以逗号排列各项神圣称号；“受造之物”“诸般怜悯”具有适度的经文色彩，但含义对现代普通读者仍清楚。
