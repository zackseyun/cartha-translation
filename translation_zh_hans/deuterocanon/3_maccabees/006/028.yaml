base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/028.yaml
  text: Release the sons of the almighty[a], heavenly, living God[b], who from the time of our ancestors until now has brought unimpeded stability with glory to our affairs.
translation:
  language: zh_hans
  text: 要释放全能、属天、永活的上帝的众子[a]；他从我们祖先的时代直到如今，一直使我们的事务享有毫无阻碍、满有荣耀的安定[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“众子”；也可译作“儿女”。
    reason: 说明希腊文阳性亲属称谓及中文可能的顺畅译法。
  - marker: b
    text: “毫无阻碍、满有荣耀的安定”也可译作“畅行无阻而有荣耀的安稳”；原文强调这些事务持续稳固、不受阻挠。
    reason: 保留ἀπαραπόδιστον εὐστάθειαν μετὰ δόξης的语义张力及译法空间，避免将πράγμασιν限定为国家事务。
lexical_decisions:
- source_word: ἀπολύσατε
  choice: 要释放
  rationale: 复数命令式，表达立即释放的命令；“要释放”庄重而自然。
- source_word: τοὺς υἱοὺς
  choice: 众子
  rationale: 原文明确使用阳性复数“儿子”；保留其性别和亲属称谓，同时以“众子”配合庄重语体。
- source_word: τοῦ παντοκράτορος ἐπουρανίου θεοῦ ζῶντος
  choice: 全能的、属天的永生上帝
  rationale: 保留原文层叠的三个神圣称号；“属天的”贴近形容词ἐπουρανίου，“永生上帝”在中文圣经语体中自然地表达“活着的上帝”。
- source_word: ἀφʼ ἡμετέρων μέχρι τοῦ νῦν προγόνων
  choice: 从我们祖先的时代直到如今
  rationale: 原文语序紧缩，表达从祖先之时延续至今；译文明确其时间跨度而不增添特定解释。
- source_word: ἀπαραπόδιστον εὐστάθειαν
  choice: 毫无阻碍……的安定
  rationale: ἀπαραπόδιστον强调不受阻碍，εὐστάθεια核心义为稳固、安定；避免将其窄化为物质繁荣。
- source_word: μετὰ δόξης
  choice: 满有荣耀
  rationale: 保留δόξα的“荣耀”含义，并使其与“安定”自然衔接。
- source_word: προφέρει
  choice: 一直使……享有
  rationale: 结合“直到如今”的持续时间，表达上帝使这种安定延续并临到国事；不把动词过度限定为单次赐予。
- source_word: τοῖς ἡμετέροις πράγμασιν
  choice: 我们的国事
  rationale: πράγματα在君王谕令语境中指公共事务或国家事务；“国事”比泛泛的“事情”更符合上下文，但不直接改译为“王国”。
theological_decisions:
- issue: παντοκράτορος ἐπουρανίου θεοῦ ζῶντος的层叠称号
  choice: 全能的、属天的永生上帝
  alternative: 全能者、天上的永生上帝
  rationale: 选择保留各修饰语共同限定“上帝”的希腊结构，不将παντοκράτωρ独立名词化，也不把ἐπουράνιος改写成地点短语。
- issue: υἱοὺς的性别表达
  choice: 众子
  alternative: 众儿女／子民
  rationale: 原文明确为阳性复数“儿子”，故不作性别中和；脚注提示现代中文可采用较宽泛的表达。
- issue: εὐστάθεια所指的福祉
  choice: 安定
  alternative: 安稳／繁荣
  rationale: 保留其稳固、安定的核心义，不将政治与社会福祉单方面解释为物质繁荣。
translation_notes:
  register: 采用现代、庄重而可读的谕令语体。“要释放”体现命令；后半句用“从……直到如今”“一直”呈现持续性。“国事”依据政治行政语境，但脚注与正文均避免把宽泛的πράγματα过度解释为特定政体。
