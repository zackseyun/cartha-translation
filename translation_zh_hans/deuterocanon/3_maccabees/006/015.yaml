base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/015.yaml
  text: Let it be shown to all the nations that you are with us[a], Lord, and that you have not turned your face away from us; but just as you said, ‘Not even when they were in the land of their enemies did I disregard them,’ so accomplish it[b], Lord.
translation:
  language: zh_hans
  text: 愿这事向万国显明：你与我们同在[a]，主啊；你并没有转脸离开我们。正如你所说：“就是当他们身在仇敌之地时，我也没有置他们于不顾。”主啊，求你照样成就[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的话带有盟约语言的色彩：即使百姓身在仇敌之地，神也没有弃绝他们。
    reason: cross_reference
  - marker: b
    text: “成就”也可译作“完成”或“使之实现”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δειχθήτω
  choice: 愿……都看见
  rationale: 该词为不定过去时被动命令式，在祷告中表达祈愿。“愿……都看见”以自然汉语保留其请求语气；虽将希腊语被动形式转为汉语主动感知表达，但未改变“使此事向万国显明”的意义。
- source_word: πᾶσιν ἔθνεσιν
  choice: 万国
  rationale: ἔθνη在这里广指众国或众民；“万国”简洁庄重，也保留圣经语体，不必强化为“外邦人”。
- source_word: μεθʼ ἡμῶν εἶ
  choice: 你与我们同在
  rationale: 直接呈现神同在的语言及其盟约意味，符合现代汉语宗教语境。
- source_word: οὐκ ἀπέστρεψας τὸ πρόσωπόν σου ἀφʼ ἡμῶν
  choice: 你并没有转脸离开我们
  rationale: 保留原文明确出现的“脸”这一意象，传达神并未撤回眷顾；不简化为“没有离弃我们”，以免丢失互文色彩。
- source_word: ὑπεριδον
  choice: 置……于不顾
  rationale: 此处表示不忽视、不撇下身在敌国的百姓。“置于不顾”自然地承载该意义，又避免“藐视”所带来的较强贬抑色彩。
- source_word: ἐπίτελεσον
  choice: 成全
  rationale: 该命令式要求主使先前所说的话实现、完成。“成全”简洁地保留完成和实现之意；“完成这事”也是可能译法。
- source_word: καθὼς εἶπας
  choice: 照你所说的
  rationale: 自然引出随后的直接引语，并保留καθώς的比较、对应意味。
theological_decisions:
- issue: κύριε的译法
  choice: 主啊
  alternative: 主人啊
  rationale: 此处处于向神祷告的语境，κύριος作为神圣称号译为“主”；加语气词“啊”符合汉语呼告表达。
- issue: 流亡之地应许的引语形式
  choice: 保留为神的直接话语：“即使他们身在仇敌之地，我也没有置他们于不顾。”
  alternative: 改写为间接引语
  rationale: εἶπας直接引出所说的话；保留直接引语能显明祈祷者诉诸神先前的应许，同时不额外界定其范围。
- issue: οὕτως ἐπίτελεσον所指
  choice: 求你就这样成全
  alternative: 求你成全这事／求你使这话实现
  rationale: 原文宾语未明说。“就这样”保留οὕτως与前述神言之间的对应关系，同时避免擅自补明究竟是“这事”还是“这话”。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告语体。“万国”“与我们同在”“转脸”等表达保留原文的圣经意象；引语使用现代汉语句式，避免过度古雅。
