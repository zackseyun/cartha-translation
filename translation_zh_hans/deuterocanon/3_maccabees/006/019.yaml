  text: And they rose up[a], and filled the force of their adversaries with confusion and cowardice[b], and bound them with immovable fetters.
translation:
  language: zh_hans
  text: 他们起来抵抗[a]，使敌军充满混乱和怯懦，并用牢不可动的脚镣把他们捆住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们站出来抵抗”。希腊文动词可表示抵抗，也可表示站起来与对方抗衡。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: 起来抵抗
  rationale: 该动词意为站出来反抗、抵挡；“起来抵抗”既保留行动的鲜明感，也明确其针对敌对者的含义。
- source_word: δύναμιν τῶν ὑπεναντίων
  choice: 敌军
  rationale: δύναμις在此语境中指敌对者的军事力量，即军队，而非抽象的“能力”或“权能”；“敌军”简洁自然。
- source_word: ταραχῆς καὶ δειλίας
  choice: 混乱和怯懦
  rationale: 分别对应骚乱、慌乱与胆怯、懦弱，保留希腊文并列结构及其对敌军心理状态的负面刻画。
- source_word: ἀκινήτοις ... πέδαις
  choice: 无法挣脱的脚镣
  rationale: πέδαις特指束缚脚部的镣铐；ἀκινήτοις强调其牢不可动、不能摆脱。“无法挣脱”比直译“不能移动的”更自然地传达此处意象。
- source_word: ἔδησαν
  choice: 锁住
  rationale: 该词意为捆绑、束缚；与“脚镣”搭配时，“锁住”符合现代汉语表达。
