base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/029.yaml
  text: So he said these things[a]; but they, having been released in a moment, blessed their holy Savior God[b], having just escaped death.
translation:
  language: zh_hans
  text: 于是，他说了这些话；他们则转瞬之间[a]得了释放，刚刚逃过死亡，便称颂他们那位圣洁的救主上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“立刻”或“片刻之内”。希腊语习语表示极短的时间。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们的圣洁上帝和救主”。希腊语也可理解为一组紧密相连、共同指向上帝的称谓。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλεξεν
  choice: 说了
  rationale: 此处指把前述话语说出来；译作“说了”自然简明，也符合叙事语境。
- source_word: ἐν ἀμερεῖ χρόνῳ
  choice: 转瞬之间
  rationale: 该希腊语习语表示极短的时间；“转瞬之间”既传达迅速获释，也保持庄重而自然的现代汉语。
- source_word: λυθέντες
  choice: 得了释放
  rationale: 被动分词表示他们被解除拘束、获得自由；“得了释放”保留被动含义并适合上下文。
- source_word: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν
  choice: 他们那位圣洁的救主上帝
  rationale: 将ἅγιον、σωτῆρα与θεόν作为紧密相连的称谓来表达，同时用“他们那位”自然呈现αὐτῶν，且不排除其他句法理解。
- source_word: ηὐλόγουν
  choice: 称颂
  rationale: 该词在敬拜语境中指祝颂、赞美上帝；“称颂”保留圣经语体，又比直译“祝福上帝”更符合现代汉语习惯。
- source_word: ἄρτι
  choice: 刚刚
  rationale: 突出他们才从死亡威胁中脱身的即时性。
- source_word: τὸν θάνατον ἐκπεφυγότες
  choice: 逃过死亡
  rationale: 完成时分词表达已经成功脱离死亡且结果仍然有效；“逃过死亡”在现代汉语中准确自然。
theological_decisions:
- issue: 在次经叙事中如何翻译用于上帝的σωτήρ
  choice: 救主
  alternative: 拯救者
  rationale: “救主”保留该词作为神圣称谓的分量，也符合本节上帝实施拯救的语境；同时不额外引入超出原文的教义限定。
- issue: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν中称谓之间的关系
  choice: 他们那位圣洁的救主上帝
  alternative: 他们的圣洁上帝和救主
  rationale: 原文几个名词和修饰语紧密排列，句法关系存在一定弹性；正文采用紧凑的单一称谓，脚注保留可将“上帝”和“救主”并列理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“称颂”维持敬拜语境；“转瞬之间”传达原文习语的速度感。脚注标记紧随各自所解释的词组，避免英文咨询层中标记位置可能造成的歧义。
