base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/004.yaml
  text: Father[a], you who destroyed Pharaoh—the former ruler of this Egypt—when he was exalted with lawless arrogance and boastful speech, increasing in reckless acts, together with his proud army, drowning them in the sea, and who shone forth the light of mercy upon the people of Israel[c][b],
translation:
  language: zh_hans
  text: 父啊，你曾毁灭法老——这埃及从前的统治者；他以不法的狂妄和夸口的言辞自高，不断增添狂妄之举[a]；你使他和他骄傲的军队被大海吞没[b]，又使怜悯之光照耀以色列民[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不断增添狂妄之举”所对应的希腊语短语含义艰涩，也可译作“不断增添冒失的行为”或“多行狂妄之举”。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“你毁灭了那些被海吞没的”；形象地描写法老和他的军队被大海吞噬。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“使怜悯之光照耀以色列民”，明确保留“光”的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: 父啊
  rationale: 祷告中的直接呼格；“父啊”自然、庄重，也保留亲密而肃穆的称呼。
- source_word: τὸν πρὶν Αἰγύπτου ταύτης δυνάστην
  choice: 这埃及从前的统治者
  rationale: 保留πρὶν“从前”和ταύτης“这”的指示意味；δυνάστης译作中性的“统治者”，不额外强化为“暴君”。
- source_word: πληθύνοντα θράμασιν
  choice: 肆行狂妄之事
  rationale: 原短语艰涩，所表达的是狂妄、冒失行为不断加增；正文采用自然而仍较贴近字面的概括，并以脚注注明歧义。
- source_word: ἐπαρθέντα ἀνόμῳ θράσει
  choice: 因不法的狂妄……而高抬自己
  rationale: 保留ἐπαίρω“抬高”的形象及其在语境中的自高意味；ἀνόμῳ θράσει译作“不法的狂妄”。
- source_word: γλώσσῃ μεγαληγόμονι
  choice: 夸大的言辞
  rationale: 表达说大话、夸口的舌头；中文以“夸大的言辞”保持庄重且易懂。
- source_word: σὺν τῇ ὑπερηφάνῳ στρατιᾷ
  choice: 连同他骄傲的军队
  rationale: 准确保留“与……一同”及ὑπερήφανος的骄傲、自高含义；“他”由上下文补出。
- source_word: ποντοβρόχους ἀπώλεσας
  choice: 你使他连同……都被大海吞没
  rationale: ποντοβρόχος是“被海吞没”的鲜明复合形象；用“大海吞没”比单说“淹死”更贴近原文。
- source_word: φέγγος ἐπιφάνας ἐλέους
  choice: 使怜悯之光照耀
  rationale: 保留φέγγος的“光”及ἐπιφαίνω的照耀意象，不将其弱化为仅仅“施怜悯”。
- source_word: Ἰσραὴλ γένει
  choice: 以色列民
  rationale: γένος在此指以色列群体；“以色列民”符合现代中文圣经语体，并避免现代种族含义。
theological_decisions:
- issue: 同一祷告呼语中并置上帝对法老的审判和对以色列的怜悯
  choice: 保留“毁灭／大海吞没”与“怜悯之光照耀”的双重意象，并置于一个连贯句子中
  alternative: 拆成互不相连的短句，或将光的意象简化为“怜悯以色列”
  rationale: 原文借审判与怜悯的强烈对照构成祷告修辞；保留二者可避免消解其神学张力。
- issue: 法老自高与其不法狂妄、夸口言辞之间的关系
  choice: 译为“因不法的狂妄和夸大的言辞而高抬自己”
  alternative: 译为被动的“被高举”或直接改写为“变得傲慢”
  rationale: 语境明确指法老自我抬高；此译既保存“抬高”的隐喻，也不误解为上帝高举他。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“父啊”保留呼格；以分号梳理希腊文较长的修饰结构，同时维持审判与怜悯在同一句中的修辞对照。所有脚注标记均置于相应正文之后。
