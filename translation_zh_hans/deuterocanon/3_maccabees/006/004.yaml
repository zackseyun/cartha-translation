  to: 父啊，你曾毁灭法老——这埃及从前的统治者；他以不法的狂妄和夸口的言辞自高，不断增添狂妄之举[a]；你使他和他骄傲的军队被大海吞没[b]，又使怜悯之光照耀以色列民[c]。
  rationale: 修订仅处理可安全判定的词义与汉语搭配：以“不断增添”补出πληθύνοντα的增多义；以“自高”保存ἐπαρθέντα的抬高意象；以“夸口的言辞”更贴近μεγαληγόμονι。保留原文的长句祷告结构、法老与军队一同被海吞没的画面，以及向以色列照耀怜悯之光的隐喻。
