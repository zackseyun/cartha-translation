base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/040.yaml
  text: And they all feasted[a], being supplied by the king, until the fourteenth day, on which they also made their petition concerning their release.
translation:
  language: zh_hans
  text: 他们众人都欢宴；王供给他们所需的一切，直到第十四日。就在那一天，他们也请求准许他们离去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “请求准许他们离去”也可译为“为他们的释放提出请愿”或“陈情”。希腊语ἐντυχία可指向上位者正式求见、陈情或提出请愿。
    reason: 保留ἐντυχία所含正式求见、陈情和请愿的词义幅度，且不把具体程序规定得过于明确。
lexical_decisions:
- source_word: Εὐωχοῦντο
  choice: 欢宴
  rationale: 该动词指享用丰盛宴席、欢庆饮宴；“欢宴”兼顾具体的宴饮活动和喜庆意味。
- source_word: πάνθʼ ὑπὸ τοῦ βασιλέως χορηγούμενοι
  choice: 所需的一切都由王供给
  rationale: πάνθʼ最自然地可理解为πάντα，作χορηγούμενοι所涉及的供应内容，即“一切所需”；此译保留王承担供应的意思，也避免把它未经必要地解释为“他们所有人”。
- source_word: μέχρι τῆς τεσσαρεσκαιδεκάτης
  choice: 直到第十四日
  rationale: 阴性序数词按上下文省略了“日”；中文补出“日”，使时间所指清楚。
- source_word: τὴν ἐντυχίαν ἐποιήσαντο
  choice: 提出请求
  rationale: ἐντυχία可指向权势者进言、求见或请愿；结合下文所述获准离去之事，“提出请求”自然表达正式陈情，同时不把具体程序说得过死。
- source_word: περὶ τῆς ἀπολύσεως αὐτῶν
  choice: 为获准离去
  rationale: ἀπόλυσις可指释放或准予离开；这里译作“获准离去”，既符合他们请求离开的语境，也避免“获释”可能过强地暗示正式监禁。
