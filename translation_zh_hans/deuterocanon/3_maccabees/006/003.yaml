base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/003.yaml
  text: Look upon the offspring of Abraham[a], the children of Jacob who has been sanctified, your sanctified allotted people, perishing unjustly as strangers in a foreign land.
translation:
  language: zh_hans
  text: 求你垂顾亚伯拉罕的后裔，就是那已被分别为圣的雅各的子孙[a]，你那分别为圣、归你为产业的子民；他们在异乡寄居，却正遭受不义的毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅各那些已被分别为圣的子孙。”希腊语在这里十分简略，“已被分别为圣的”既可理解为修饰“雅各”，也可理解为修饰“子孙”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπιδε
  choice: 求你垂顾
  rationale: 这是祷告中的命令式恳求；“垂顾”既表达求上帝察看并眷念，也保持庄重而自然的祈祷语气。
- source_word: σπέρμα
  choice: 后裔
  rationale: 准确表达集合性的血统与子孙之意，较字面的“种子”更符合现代汉语。
- source_word: ἡγιασμένου
  choice: 已被分别为圣的
  rationale: 保留完成时被动分词所表达的既成状态，并在正文中依较自然的句法使其修饰“雅各”；另一种可能见脚注。
- source_word: τέκνα Ἰακώβ
  choice: 雅各的子孙
  rationale: τέκνα在此指雅各的后代，并不限于男性；“子孙”比“儿女”更自然地表达民族后裔。
- source_word: μερίδος ἡγιασμένης σου λαὸν
  choice: 你那分别为圣、归你为分的子民
  rationale: 将μερίς理解为上帝所属的份，保留“分别为圣”和归属关系，同时用汉语可理解的结构表达压缩的希腊语同位关系。
- source_word: ἐν ξένῃ γῇ ξένως
  choice: 寄居异乡
  rationale: 将“在异地”和“以外来者身份”合并为自然简洁的汉语，仍保留身处外国、作为寄居者的双重意味。
- source_word: ἀδίκως ἀπολλύμενον
  choice: 正遭受不义的毁灭
  rationale: “正遭受”体现现在分词的持续过程和被动处境；“不义的毁灭”明确指出其遭遇是不公正的。
theological_decisions:
- issue: ἡγιασμένου在ἐφ’ ἡγιασμένου τέκνα Ἰακώβ中的修饰对象
  choice: 理解为修饰雅各：“那已被分别为圣的雅各的子孙”
  alternative: 理解为修饰子孙：“雅各那些已被分别为圣的子孙”
  rationale: 希腊语表达高度压缩，修饰关系确有歧义。正文依词序和英语审校层采用修饰雅各的读法，同时以脚注保留另一种语法上可行的理解，避免消除经文本身的张力。
- issue: μερίδος ἡγιασμένης σου λαόν所表达的归属关系
  choice: 你那分别为圣、归你为分的子民
  alternative: 你的子民，你那分别为圣的份
  rationale: μερίς可指属于上帝的一份或产业。正文将同位关系融入“子民”的描述中，以清楚表达这群人既被分别为圣，又归属于上帝，但不进一步引入特定宗派的盟约解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你垂顾”保留呼求语气；“分别为圣”保留ἁγιάζω词族在本节中的重复，不简化为一般性的“圣洁”；末句避免生硬重复“异地、异乡人”，以“寄居异乡”自然承载两层含义。
