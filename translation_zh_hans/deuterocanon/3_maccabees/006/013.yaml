base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/013.yaml
  text: But let the nations cower today before your invincible power[a], O honored one, having power for the salvation of the race of Jacob.
translation:
  language: zh_hans
  text: 愿列国今日在你不可战胜的大能面前畏惧退缩，尊贵者啊；你有大能拯救雅各的后裔[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅各的后裔”也可译作“雅各的子民”；希腊语 γένος 可指血统、家族世系，或同一祖先所出的群体。
    reason: 词义有多种可能，需保留“世系／后裔群体”与“子民”之间的翻译选择。
lexical_decisions:
- source_word: πτηξάτω
  choice: 但愿……畏惧退缩
  rationale: 该不定过去时命令式表达因恐惧而蜷缩、退却；“畏惧退缩”兼顾恐惧与向后退避的含义，也符合祷告中的祈愿语气。
- source_word: ἔθνη
  choice: 列国
  rationale: 这里统称周围各民族，并非着重犹太人与外邦人的神学对举；“列国”简洁庄重。
- source_word: σὴν δύναμιν ἀνίκητον
  choice: 你不可战胜的大能
  rationale: δύναμις 指能力、威力，ἀνίκητος 指不能被击败；“不可战胜的大能”准确保留原文力度，并适合向上帝祷告的语域。
- source_word: σήμερον
  choice: 今日
  rationale: 直接表达时间副词“今天”；“今日”在庄重而现代的祷告语言中自然。
- source_word: ἔντιμε
  choice: 尊贵者啊
  rationale: 保留形容词作呼语这一不寻常形式，不将其归一化为原文没有的“主”等神圣称号。
- source_word: δυνάμεις ἔχων
  choice: 你拥有……的能力
  rationale: 将分词结构表达为并列说明，保留“拥有能力”的意义，不擅自强化为明确的因果关系。原文使用复数 δυνάμεις，汉语“能力”可自然涵盖其整体含义。
- source_word: ἐπὶ σωτηρίαν
  choice: 拯救
  rationale: 介词短语指向救援、解救的目的；汉语用动词“拯救”比“为了……的救恩”更自然，同时保留实际施行拯救的含义。
- source_word: Ἰακὼβ γένους
  choice: 雅各族类
  rationale: γένος 可指血统、家族世系或共同祖先的后裔群体；“雅各族类”保留集体后裔及世系色彩。
theological_decisions:
- issue: 如何翻译对上帝的呼语 ἔντιμε
  choice: 尊贵者啊
  alternative: 可尊崇者啊／尊荣者啊
  rationale: 原文以表示受尊重、尊贵的形容词直接称呼上帝，并非惯常神名。“尊贵者啊”保留这一特殊措辞，又不加入“主”等原文没有的称号。
- issue: δυνάμεις ἔχων 与前句祈求的逻辑关系
  choice: 用分号连接为“你拥有……”
  alternative: “因为你有能力……”
  rationale: 分词可能带有解释或背景意味，但原文没有明示因果连词；译文避免把它限定为“因为”，从而保留句法关系的开放性。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。“但愿”呈现第三人称命令式的祈愿功能；“畏惧退缩”避免生硬直译，同时保留恐惧与退避两层意味。正文脚注标记置于其实际所说明的“雅各族类”之后。
