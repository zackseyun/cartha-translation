base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/005.yaml
  text: You shattered Sennacherib[a], the mighty king of the Assyrians, who had become arrogant because of his innumerable forces, who had already brought the whole land under his hand by the spear, and who had exalted himself against your holy city, speaking grievous things with boasting and insolence—you, Master[c][b], making your power plain to many nations.
translation:
  language: zh_hans
  text: 主宰啊[c]，你曾击碎西拿基立——这位强大的[a]亚述王；他因自己数不清的军队而狂傲，早已用长矛把全地置于手下[b]，又向着你的圣城自高自大，说出狂妄放肆的话，带着夸耀和傲慢；你向许多民族显明了你的权能。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “强大的”所译的希腊词也可指“严酷的”“可怕的”或“令人难以承受的”。
    reason: 保留βαρύν在此语境中关于这位亚述王的词义范围，避免将其限定为“残暴”。
  - marker: b
    text: 直译：“早已用长矛把全地取来，置于手下。”
    reason: 说明原文兼有“长矛”和“手下”两个具体意象。
  - marker: c
    text: 这里称神为“主宰”，原文是despotēs，不是通常译作“主”的kyrios。
    reason: 保留两个希腊神圣称号之间的词汇区别。
lexical_decisions:
- source_word: ἀναριθμήτοις δυνάμεσιν
  choice: 数不清的军队
  rationale: 在军事语境中，δυνάμεις指军队或兵力；“数不清”自然传达ἀναρίθμητος的不可胜数。
- source_word: γαυρωθέντα
  choice: 狂傲
  rationale: 表达因强大军力而生的骄傲自负，简洁且符合祷告中的谴责语气。
- source_word: βαρὺν
  choice: 残暴
  rationale: 此处形容敌对的亚述王，可指令人难以承受、严酷或可怕；“残暴”在现代汉语中较自然，但原词存在歧义，故加注说明。
- source_word: δόρατι τὴν πᾶσαν ὑποχείριον ἤδη λαβόντα γῆν
  choice: 早已用长矛把全地置于手下
  rationale: 保留δόρατι“用长矛”的具体军事意象及ὑποχείριον“在手下”的生动表达。
- source_word: μετεωρισθέντα ἐπὶ τὴν ἁγίαν σου πόλιν
  choice: 自高自大，敌对你的圣城
  rationale: μετεωρίζω兼有抬高、狂妄自大的意味，ἐπί在此显示针对圣城的敌意；分译可同时保留两层含义。
- source_word: βαρέα λαλοῦντα κόμπῳ καὶ θράσει
  choice: 口出狂言，满是夸耀和狂妄
  rationale: 以自然汉语表达其言语的严重、傲慢和放肆，不把内容具体化为原文未明说的“威胁”。
- source_word: ἔθραυσας
  choice: 击碎
  rationale: 保留动词强烈、决定性毁败的力度。
- source_word: ἔκδηλον δεικνὺς ἔθνεσιν πολλοῖς τὸ σὸν κράτος
  choice: 你就这样向许多民族显明了你的权能
  rationale: 将希腊语伴随或结果性的分词结构自然转成汉语完整分句；κράτος在此指公开彰显的强大力量。
- source_word: δέσποτα
  choice: 主宰
  rationale: 区别于通常译作“主”的κύριος；“主宰”既传达绝对权柄，也适合庄重祷告语体。
theological_decisions:
- issue: 神的称号δέσποτα
  choice: 主宰
  alternative: 主；主人
  rationale: 原文不是κύριος。“主宰”能保留词汇区别与绝对权柄的意味，同时避免现代汉语中直接称神为“主人”可能产生的不自然感。
- issue: 西拿基立攻击圣城的历史典故
  choice: 只翻译本节明确陈述的内容
  alternative: 补明耶路撒冷及其获救经过
  rationale: 原文仅说“你的圣城”并强调神向许多民族彰显权能；不从《列王纪》或《以赛亚书》补入本节没有明说的细节。
- issue: 分词δεικνύς与主句的关系
  choice: 译为结果或伴随意义的独立分句“你就这样……显明了”
  alternative: 形式对应地译作“同时显明……”
  rationale: 汉语独立分句更自然，并保留神击碎西拿基立这一行动公开彰显其权能的关系，不强行限定为单一的目的关系。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语言。以破折号展开西拿基立的修饰成分，并在末尾恢复对神的呼告，使希腊语长句在中文中清楚自然。所有脚注标记均置于相关正文位置。
