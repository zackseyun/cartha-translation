  text: The whole multitude of the little children and their parents entreats you with tears.
translation:
  language: zh_hans
  text: 全体幼童和他们的父母都含泪恳求你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκετεύει
  choice: 恳求
  rationale: 表达迫切、谦卑地求告，既保留原文庄重而强烈的语气，也符合现代汉语习惯。
- source_word: τὸ πᾶν πλῆθος
  choice: 所有
  rationale: 突出这一群体无一例外；汉语若直译为“全部群众”较生硬，因此用“所有”自然传达整体性。
- source_word: τῶν νηπίων
  choice: 年幼的孩子
  rationale: νήπιοι可指婴孩或幼童；“年幼的孩子”保留年龄范围的弹性，不把所指限于婴儿。
- source_word: οἱ τούτων γονεῖς
  choice: 他们的父母
  rationale: τούτων回指前面的孩子；此译清楚自然地呈现亲属关系。
- source_word: μετὰ δακρύων
  choice: 含泪
  rationale: 简洁而形象地表达伴随着泪水恳求，符合现代汉语表达，同时保留原文的哀切情感。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“所有……都”再现原文对全体性的强调；将希腊语单数谓语所表达的集合性按汉语习惯处理为复数群体的共同恳求。
