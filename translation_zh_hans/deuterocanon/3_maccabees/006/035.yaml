  yaml_path: translation/deuterocanon/3_maccabees/006/035.yaml
  text: And the Jews[a], as we said before, having formed the previously mentioned chorus, spent their time with feasting, in joyful thanksgivings and psalms[b],
translation:
  language: zh_hans
  text: 犹太人，正如我们先前所说的，组织了前面提到的歌咏队[a]，并在宴饮、欢喜的感恩赞美[b]和诗篇中度过时日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “歌咏队”所译的希腊词可指合唱队，也可指载歌载舞的队伍。
    reason: lexical_alternative
  - marker: b
    text: “感恩赞美”所译的希腊语在这里很可能指向上帝献上感谢或赞美，而不是承认罪过。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε Ἰουδαῖοι
  choice: 犹太人
  rationale: 这里指埃及境内作为族群与信仰共同体的犹太人，并非单指来自犹太地区的人。
- source_word: καθὼς προειρήκαμεν
  choice: 正如我们先前所说
  rationale: 保留叙述者回指前文的功能，表达自然庄重。
- source_word: συστησάμενοι
  choice: 组成了
  rationale: 表示将人召集、组织起来，与其宾语“歌舞队”搭配自然。
- source_word: τὸν προειρημένον χορὸν
  choice: 前面提到的歌舞队
  rationale: χορὸς可指伴随歌唱或舞蹈的队伍；“歌舞队”比单纯“合唱队”更能保留其语义范围。
- source_word: μετʼ εὐωχίας
  choice: 举行宴席
  rationale: εὐωχία指节庆中的宴饮欢聚；此译清楚传达宴席庆祝的场景。
- source_word: ἐν ἐξομολογήσεσιν ἱλαραῖς
  choice: 在欢喜的感恩赞美中
  rationale: 在犹太希腊语敬拜语境中，ἐξομολόγησις常指向上帝感恩或赞美，而不是认罪；合并译为“感恩赞美”可保留两方面含义。
- source_word: καὶ ψαλμοῖς
  choice: 和诗篇歌唱中
  rationale: ψαλμοί直接指诗篇；补出“歌唱”使中文清楚表达这是庆典中的吟唱活动。
- source_word: διῆγον
  choice: 度日
  rationale: 未完成时表示活动持续了一段时间；“度日”简洁体现其延续性。
theological_decisions:
- issue: ἐξομολόγησις在此处是认罪还是感恩赞美
  choice: 感恩赞美
  alternative: 认罪／承认
  rationale: 上下文是蒙拯救后的欢宴、喜乐和诗篇歌唱，因此这里更可能指公开的感恩与赞美；译文不引入认罪含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“歌舞队”保留χορὸς兼具歌唱与舞蹈的可能；“诗篇歌唱”避免把ψαλμοί泛化为普通赞美诗。所有脚注标记均置于相关词语之后。
