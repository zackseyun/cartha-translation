  text: And the king’s anger was turned into grief and tears over those things that had previously been devised before him[a].
translation:
  language: zh_hans
  text: 王的怒气转为怜悯，流下泪来，为先前在他面前所谋划的事而哀伤[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语此处的分词短语也可在语法上指“先前在他面前策划此事的人”；其所指在原文中未明说。
    reason: preserve_grammatical_ambiguity
lexical_decisions:
- source_word: μετεστράφη
  choice: 转为
  rationale: 表达被动式所指的情绪逆转；现代汉语无需机械加入“被”，仍保留从怒气转向另一种情感的意象。
- source_word: ἡ ὀργή
  choice: 怒气
  rationale: 符合叙事语境，较“震怒”或“忿怒”自然，也不额外增添神学色彩。
- source_word: εἰς οἶκτον καὶ δάκρυα
  choice: 转为怜悯和泪水
  rationale: οἶκτος的核心义是怜悯、同情；“泪水”直译δάκρυα，并保留原文把内在情感与外在流泪并列的表达。
- source_word: ὑπὲρ
  choice: 因为
  rationale: 此处引出引发王怜悯流泪的对象或缘由；“因为”在中文中能自然表达这一关系。
- source_word: τῶν ἔμπροσθεν αὐτῷ μεμηχανευμένων
  choice: 先前在他面前所谋划的那些事
  rationale: 将ἔμπροσθεν按时间和场景理解为“先前在他面前”，以“所谋划的那些事”表达完成时中被动分词；同时用脚注保留名词化分词可能指人的语法歧义。
