  yaml_path: translation/deuterocanon/3_maccabees/006/007.yaml
  text: You brought Daniel up into the light unharmed[b][a], when he had been thrown to the lions on the ground as food for the beasts through the slanders of envy.
translation:
  language: zh_hans
  text: 但以理因出于嫉妒的诬告[a]，被扔在地上[b]，交给狮子，作野兽的食物；你却使他毫发无损地重见光明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因嫉妒而生的控告。”希腊文将“诬告／控告”与“嫉妒”连在一起。
    reason: lexical_alternative
  - marker: b
    text: 希腊文这里有一个难解的短语，直译为“在地上”。译文予以保留，没有按照《但以理书》的相关叙事加以协调。
    reason: textual_variant
lexical_decisions:
- source_word: διαβολαῖς φθόνου
  choice: 因出于嫉妒的诬告
  rationale: διαβολαῖς 表示恶意的控告或诬告，φθόνου 指明其根源或性质是嫉妒；此译保留工具性和两词间的修饰关系。
- source_word: λέουσι
  choice: 狮子中
  rationale: 与表示投掷的分词连用时，领受对象在汉语中自然表达为被扔进狮子中间；不增添原文没有明说的“坑”。
- source_word: κατὰ γῆς
  choice: 在地上
  rationale: 直译这一传本文本中较难解释的空间短语，不据《但以理书》的相关叙事擅自改成“坑里”。
- source_word: ῥιφέντα
  choice: 被扔
  rationale: 保留 ῥίπτω 所表达的强制、被动投掷动作。
- source_word: θηρσὶ βορὰν
  choice: 给野兽作食物
  rationale: βορά 是食物或猎物，θηρσί 是野兽；此译清楚表达把但以理交给野兽吞食的意图。
- source_word: εἰς φῶς ἀνήγαγες
  choice: 你却使他……重见光明
  rationale: 既保留从死亡险境被带到光明中的意象，也采用现代汉语表达获救复出的自然说法。
- source_word: ἀσινῆ
  choice: 毫发无损
  rationale: 准确传达“未受伤害、完好无损”，并以凝练、庄重的现代汉语表达。
theological_decisions:
- issue: 对但以理从狮子中获救之事的暗指
  choice: 直接称但以理被扔到狮子中并蒙上帝救出，不补入“狮子坑”等细节。
  alternative: 按照《但以理书》的熟悉叙事扩写为“被扔进狮子坑”。
  rationale: 希腊文明确提到但以理、狮子、作为野兽食物以及毫发无损地被带到光明中，却没有明说“坑”；译文不越过本节措辞。
- issue: 难解短语 κατὰ γῆς 的处理
  choice: 保留为“在地上”，并用脚注说明原文措辞难解。
  alternative: 省略该短语，或按相关叙事协调为“坑里”。
  rationale: 该短语见于指定的希腊文本；在没有充分依据时不静默删改，也不借平行叙事消除文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“你”保持本段祷告中对上帝的直接称呼；用分号突出险境与拯救的对照。脚注标记均已置于正文对应位置。
