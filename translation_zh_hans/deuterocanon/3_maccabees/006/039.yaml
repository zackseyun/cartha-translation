base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/039.yaml
  text: In these things also[a], after gloriously revealing his mercy[c][b], the Sovereign of all rescued them all together without stumbling.
translation:
  language: zh_hans
  text: 在这些事中，万有的统治者荣耀地显明了自己的怜悯，便一同把他们救出，使他们安然无恙。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安然无恙”直译为“不失足”或“不跌倒”。这里很可能是说他们获救时没有受到损害。
    reason: lexical_alternative
  - marker: b
    text: “一同”也可译作“同心合意地”；原词既可强调众人一起，也可强调他们同心一致。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: 在这些事上
  rationale: 关系短语回指前文所述的事件或处境；此译保留衔接而不把所指限定得过细。
- source_word: καὶ
  choice: 也
  rationale: 表示与上文的延续和递进，用“也”符合现代汉语行文。
- source_word: μεγαλοδόξως
  choice: 大有荣耀地
  rationale: 保留副词所表达的宏伟、荣耀色彩，并使其自然修饰“显明”。
- source_word: ἐπιφάνας
  choice: 显明了
  rationale: 该分词与“他的怜悯”搭配，重点在使怜悯彰显出来，而非单纯“出现”。汉语以顺承结构自然表达其与主句动作的关系。
- source_word: τὸ ἔλεος αὐτοῦ
  choice: 自己的怜悯
  rationale: ἔλεος在拯救语境中通常表示怜悯、慈悲；“自己的”清楚回指施行拯救的神。
- source_word: ὁ τῶν πάντων δυνάστης
  choice: 那统管万有的主
  rationale: δυνάστης强调掌权者、统治者；此译保留其统治权含义，同时避免把它等同于παντοκράτωρ这一不同称号。
- source_word: ἐρρύσατο
  choice: 救出
  rationale: 表达从危险中解救出来，适合叙事语境，且不额外加入系统神学含义。
- source_word: ἀπταίστους
  choice: 安然无恙
  rationale: 字面含义是“不失足、不跌倒”；在此作受词补语，语境更可能指被救出时毫发无损，正文采用自然汉语并以脚注保留原有意象。
- source_word: ὁμοθυμαδόν
  choice: 一同
  rationale: 此副词既可表示同心一致，也可表示集体一起；在“救出他们”的语境中，“一同”自然，同时用脚注保存另一可能。
theological_decisions:
- issue: 神的称号ὁ τῶν πάντων δυνάστης如何翻译
  choice: 那统管万有的主
  alternative: 万有的统治者；全能的主宰
  rationale: 原文使用δυνάστης，侧重统治和权柄，并非παντοκράτωρ。译文不将其强化为另一传统神称，以忠实保留原词的区别。
- issue: ἀπταίστους所描述的拯救结果
  choice: 安然无恙
  alternative: 不失足；不跌倒
  rationale: 该词字面保留“跌倒、失足”的意象，但在本句中很可能表示他们获救而未受损害。正文采用语境义，脚注注明字面义，以免消除原文张力。
- issue: ὁμοθυμαδόν是集体行动还是同心一致
  choice: 一同
  alternative: 同心合意地
  rationale: 修饰“救出他们”时，既可能强调众人一起获救，也可能暗含同心一致。正文选较自然且不过度解释的“一同”，脚注保存另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“大有荣耀地显明”保留原文的崇高语调；“统管万有的主”体现神的权柄而不套用与原词不同的固定神学称号。所有脚注标记均置于正文相关内容之后。
