base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/008.yaml
  text: and Jonah[a], who was wasting away in the belly of the sea-fed monster, you brought forth unharmed in abundance to all his own people, Father[b],
translation:
  language: zh_hans
  text: 还有约拿——他曾在深海所养育的巨兽[a]腹中渐渐消瘦；父啊，你慷慨地使他毫发无伤[b]地显现在所有亲近他的人面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巨兽”也可译作“海怪”或“大鱼”。希腊词κῆτος指庞大的海中生物；传统上译作“鲸”虽有可能，却比原词更具体。
    reason: lexical_alternative
  - marker: b
    text: “毫发无伤”所译的希腊词，字面意思是“没有记号”或“未留下伤痕”。“慷慨地”所译的另一个希腊词可表示“丰盛、毫不吝惜”；其与邻近词语的具体句法关系较为压缩，也有人据上下文将其理解为公开显明。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: βυθοτρεφοῦς
  choice: 深海所养的
  rationale: 这个复合词由“深处、深渊”和“喂养、养育”的词义构成，修饰海中巨兽；译文保留“由深海供养”的诗性意象。
- source_word: κήτους
  choice: 巨兽
  rationale: κῆτος泛指庞大的海中生物或海怪，并不明确限定为鲸或普通的鱼；前面的“深海所养”已交代其海洋属性。
- source_word: ἐν γαστρὶ κήτους
  choice: 在……巨兽腹中
  rationale: γαστήρ在这里自然指腹部；“腹中”既贴近希腊文，也符合现代汉语对约拿故事的常见表达。
- source_word: τηκόμενον
  choice: 渐渐消瘦
  rationale: τήκω可表示融化、衰耗或消瘦；“渐渐消瘦”传达约拿在危境中不断衰弱的状态。
- source_word: ἀφθόνῳ
  choice: 丰丰富富地
  rationale: 该词可表达丰盛、毫不吝惜之意，但此处词形与句法关系不寻常；正文保留其丰厚、充足的语义色彩，脚注说明困难。
- source_word: ἀσήμαντον
  choice: 毫发无伤
  rationale: 字面意为“没有记号、未留下伤痕”，在获救语境中指没有受伤；“毫发无伤”自然地保留这一结果。
- source_word: πᾶσιν οἰκείοις
  choice: 在所有亲近他的人面前
  rationale: οἰκεῖοι可指自己人、亲属、家人或亲近者；“亲近他的人”避免把范围过度限定为家庭或民族。
- source_word: ἀναδείξας
  choice: 使他……显现
  rationale: ἀναδείκνυμι可指显明、展示或使之出现；这里同时包含从巨兽腹中获救并公开出现的意味。
- source_word: πάτερ
  choice: 父啊
  rationale: 保留对上帝的直接呼告，并用现代汉语呼格形式表达。
theological_decisions:
- issue: 约拿传统中的海中生物称谓
  choice: 巨兽
  alternative: 大鱼；海怪；鲸
  rationale: κῆτος所指宽于“鱼”，也未具体到“鲸”；译作“巨兽”保留七十士译本式措辞的分量，同时避免用后来的传统称谓限定原文。
- issue: ἀφθόνῳ与相邻词语的句法关系
  choice: 在正文中保留其“丰盛、毫不吝惜”的语义，同时以脚注承认句法不确定
  alternative: 将其理解为“公开地／在众人面前”，或不在正文中单独体现
  rationale: 现存希腊文的形式与搭配较为压缩，不宜无说明地把它确定为单一副词意义；正文尽量保留词义，脚注则呈现真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留祷告中的直接呼告。“深海所养的巨兽”维持原文的诗性复合意象；“亲近他的人”有意不把οἰκεῖοι缩窄为家属或同胞。正文中的破折号和分号帮助普通读者辨认较长的希腊语分词结构。
