  yaml_path: translation/deuterocanon/3_maccabees/006/041.yaml
  text: 'And when the king agreed with them[a], he wrote them the following letter to the generals in each city[b], magnanimously setting out the full account:'
translation:
  language: zh_hans
  text: 王同意了他们的意见，便为他们写下如下致各城将领[b]的信[a]；信中以宽宏的态度作了详尽说明：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“写在下面的信”，也可译作“附在下文的信”。
    reason: lexical_alternative
  - marker: b
    text: “将领”所译的希腊语 στρατηγοί 也可译作“指挥官”；在某些行政语境中还可指“长官”。这里兼有军事和行政背景，故译作“将领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συναινέσας
  choice: 同意了他们的请求
  rationale: 该词表示赞同、应允；结合上文语境补出“请求”，使现代汉语自然，同时不改变其同意对方提议的基本含义。
- source_word: ἔγραψεν αὐτοῖς
  choice: 为他们写了
  rationale: 与格 αὐτοῖς 表明这封信是为他们而写；“为他们写了”也能与后面的收信对象“各城的将领”清楚区分。
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: 以下这封信
  rationale: ὑπογεγραμμένην 字面意为“写在下面的”，在引出随后所载书信时，译作“以下这封信”最自然。
- source_word: πρὸς τοὺς κατὰ πόλιν στρατηγούς
  choice: 发给各城的将领
  rationale: κατὰ πόλιν 具有逐城分布的意思；στρατηγοί 可指军事兼行政官员，此处保留其最直接的称谓“将领”。
- source_word: μεγαλοψύχως
  choice: 宽宏地
  rationale: 该副词表达胸襟宽大、慷慨高尚；“宽宏地”既保留褒义和庄重语气，也适合王命语境。
- source_word: τὴν ἐκτενῆ ἔχουσαν
  choice: 详述了事情的始末
  rationale: 原文是压缩的表达，强调书信内容充分、详尽；此译使汉语清楚，并保留“详细而完整”的意味。
