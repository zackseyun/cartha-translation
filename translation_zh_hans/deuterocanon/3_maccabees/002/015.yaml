  text: But since you were pleased to display your glory among your people Israel[a], you have sanctified this place.
translation:
  language: zh_hans
  text: 但既然你乐意使你的荣耀在你的子民以色列中彰显[a]，你就使这地方分别为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“你以你的荣耀在你的子民以色列中为喜悦。”希腊文的结构较紧凑，也可作较形式的理解；主文按语境译出上帝乐意使其荣耀彰显的意思。
    reason: 保留τὴν δόξαν σου与εὐδόκησας之间紧凑结构所产生的词汇和句法歧义。
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文形成转折；“但”简洁自然。
- source_word: ἐπεὶ
  choice: 既然
  rationale: 此处引出祈求所依据的理由，主要取因果义，而非时间义。
- source_word: εὐδόκησας
  choice: 你乐意
  rationale: 表达 εὐδοκέω 所含的喜悦与意愿，不额外强化为决定或拣选。
- source_word: τὴν δόξαν σου
  choice: 使你的荣耀彰显
  rationale: 保留“你的荣耀”这一名词表达，同时按上下文自然呈现荣耀显明于以色列中的含义。
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  choice: 在你的子民以色列中间
  rationale: 将 ἐν 理解为荣耀彰显的范围；“子民”适合盟约关系语境，“以色列”与之同位。
- source_word: ἡγίασας
  choice: 你就使……成为圣洁
  rationale: 准确表达 ἁγιάζω 将某处分别为圣的结果，又比音译式宗教术语更易为现代读者理解。
- source_word: τὸν τόπον τοῦτον
  choice: 这地方
  rationale: 直接对应原文，保留其对当前圣所地点的指称。
theological_decisions:
- issue: 上帝的荣耀与以色列之间的关系
  choice: 使你的荣耀彰显在你的子民以色列中间
  alternative: 以你的荣耀在你的子民以色列中间为喜悦
  rationale: 原文紧凑，字面结构可理解为“乐意于你的荣耀”；主文采用较自然且很可能符合语境的彰显义，但以脚注保留较形式对应的可能读法，避免消除原文张力。
- issue: ἡγίασας 的圣别含义
  choice: 使这地方成为圣洁
  alternative: 使这地方分别为圣
  rationale: 主文清楚表达该地方被赋予神圣地位；备选译法更突出划归神圣用途的动作，但原文本节并未明说具体仪式。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“既然……就……”明确呈现因果论证；“荣耀”“圣洁”保留经文的重要神学词汇，同时避免生硬的音译式表达。
