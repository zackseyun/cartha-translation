base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/019.yaml
  text: Let your mercies quickly come before us[a]; and put praise in the mouth of those who have fallen and whose souls are crushed[b], having made peace for us.
translation:
  language: zh_hans
  text: 愿你的怜悯快快抢先临到[a]；求你把赞美的话放在那些倒下、心灵破碎的人口中[b]，为我们成就平安[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抢先临到”也可译作“预先来到”或“赶在前面”。这里的希腊动词含有预先、抢先之意；本节所给希腊文本没有明说怜悯临到谁，语境中可理解为临到祈祷者。
    reason: 说明词义范围及原文未明写宾语。
  - marker: b
    text: 较直译：“那些倒下并在心灵上被压碎的人。”
    reason: 保留两个完成时分词及“心灵”作为受影响方面的原文结构。
  - marker: c
    text: “为我们成就平安”也可理解为“使我们得享平安”。原文用不定过去分词，常可带相对先时的意味；但在此祈求中，其与前面命令的确切时间和逻辑关系并未由形式单独完全限定。
    reason: 说明分词的通常语法色彩，同时保留其在本句中的时间和逻辑关系所具有的歧义。
lexical_decisions:
- source_word: προκαταλαβέτωσαν
  choice: 先一步临到
  rationale: 该动词可表示预先来到、抢先临到或赶在前面。译作“先一步临到”既保留其预先性，也适合祷告语境；本节所给希腊文本没有明写宾语，因此正文不擅自补入“我们”。
- source_word: οἰκτιρμοί
  choice: 怜悯
  rationale: 希腊文为复数，可指怜悯的多次彰显；现代汉语通常以集合性名词“怜悯”表达，更自然庄重，不必机械译出复数。
- source_word: αἰνέσεις
  choice: 赞美的话
  rationale: 希腊文为复数。“赞美的话”既保留口中发出具体赞美的意象，又比“赞美们”自然，也不把它限定为歌曲。
- source_word: καταπεπτωκότων
  choice: 倒下的人
  rationale: 完成时分词描写已经倒下并仍处于低落状态的人；“倒下”保留身体倒地与遭难受挫之间的语义空间。
- source_word: συντετριμμένων τὰς ψυχάς
  choice: 心灵破碎的人
  rationale: 原文直陈这些人的ψυχαί遭到压碎。“心灵破碎”是自然汉语，并保留内在生命受重创的意象，不将ψυχή技术化为某种灵魂学概念。
- source_word: ποιήσας ἡμῖν εἰρήνην
  choice: 为我们成就平安
  rationale: ποιέω与εἰρήνη的组合直译为“为我们作成平安”。“成就平安”保留主动施行及结果意味，同时避免把分词的关系过度限定为先时或伴随。
theological_decisions:
- issue: ψυχή的理解
  choice: 心灵
  alternative: 灵魂；生命
  rationale: 这里强调受压碎的内在生命状态。“心灵”在现代汉语中自然且有情感力度，又不强加灵魂与身体二分的专门教义。
- issue: ποιήσας与前面祈求的关系
  choice: 以并列祈求意味译作“为我们成就平安”
  alternative: “既为我们成就了平安”；“使我们得享平安”
  rationale: 希腊语不定过去分词可表达先时、伴随方式或附带行动；上下文不足以确定必须译成已经完成的行动，因此正文不以“既……了”锁定时间关系，也不将“作成”完全改写为“赐予”。
- issue: 怜悯所临到的对象
  choice: 不在正文补出“我们”
  alternative: “愿你的怜悯赶快临到我们”
  rationale: 用户提供的希腊文本在προκαταλαβέτωσαν后没有ἡμᾶς。虽然语境和相关祷告措辞容易使人理解为“临到我们”，翻译仍以现有原文证据为先，并在脚注说明。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告体。“赶快先一步临到”略带原文特有的预先性；“赞美的话放在……口中”保留具体意象；全句避免古奥虚词，也不把“平安”缩窄为政治和平或纯粹内心安宁。
