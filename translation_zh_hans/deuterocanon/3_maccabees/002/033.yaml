  yaml_path: translation/deuterocanon/3_maccabees/002/033.yaml
  text: And they remained hopeful of obtaining help, and they loathed those who were withdrawing from among them, and judged them as enemies of the nation, and deprived them of common association and support.
translation:
  language: zh_hans
  text: 他们仍满怀希望，盼望得到援助；他们憎恶那些离开他们的人，把他们视为本民族的敌人，不让他们享有共同交往和实际帮助[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “实际帮助”所译的希腊词也可指便利、益处或有用的服务。
    reason: εὐχρηστία语义较宽；此译法保留其可指实际支持、便利或有益服务的可能性。
lexical_decisions:
- source_word: εὐέλπιδές τε καθιστήκεισαν
  choice: 仍满怀希望
  rationale: καθιστήκεισαν 表示持续处于某种状态，εὐέλπιδες 表示抱有良好希望；译文兼顾状态的延续和现代汉语的自然表达。
- source_word: ἀντιλήμψεως τεύξασθαι
  choice: 得到援助
  rationale: ἀντίλημψις 在此指帮助、援助，τεύξασθαι 指获得或得到。
- source_word: τοὺς ἀποχωροῦντας ἐξ αὐτῶν
  choice: 那些离开他们的人
  rationale: 直译保留 ἀποχωρέω 的宽泛含义，不擅自限定为背教、叛逃或政治倒戈。
- source_word: ἐβδελύσσοντο
  choice: 憎恶
  rationale: 该动词表达强烈厌恶；“憎恶”庄重而不过度增添礼仪性或宗教性含义。
- source_word: πολεμίους τοῦ ἔθνους
  choice: 本民族的敌人
  rationale: ἔθνος 在本段指他们所属的民族共同体；加入“本”使汉语所指清楚。
- source_word: τῆς κοινῆς συναναστροφῆς καὶ εὐχρηστίας
  choice: 与众人共同交往、彼此扶助
  rationale: συναναστροφή 指共同往来或社会交往；εὐχρηστία 可指实际用处、便利或有益的服务，在此语境中译作群体成员之间的实际扶助。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言；以分号呈现原句由希望转向群体制裁的结构。末句补出“的权利”，使汉语中“剥夺”的宾语自然明确，但不改变被排除于共同生活和实际互助之外的核心含义。
