  yaml_path: translation/deuterocanon/3_maccabees/002/006.yaml
  text: And when he pursued him with chariots and a multitude of people[a], you overwhelmed him in the depths of the sea; but those who had put their trust in you, who rule over all creation[b], you brought safely through.
translation:
  language: zh_hans
  text: 他带着战车和大批人众紧追那人时[a]，你在海的深处淹没了他；但那些信靠你、统管一切受造之物的你的人，你却平安地带领他们通过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节呼应出埃及的事件：埃及的追兵被海水淹没，上帝的子民却平安经过。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιδιώξαντα
  choice: 紧追
  rationale: 该分词表示带有敌意的追赶；“紧追”既体现追击的迫切性，也不在正文中补出希腊文未明说的人名。
- source_word: σὺν ἅρμασιν καὶ ὄχλων πλήθει
  choice: 带着战车和大批人马
  rationale: “战车”直接对应ἅρμασιν；“大批人马”自然表达ὄχλων πλήθει所强调的众多人群，并符合军事追击的语境。
- source_word: ἐπέκλυσας
  choice: 使……淹没
  rationale: 该动词指以水漫过、吞没；这里采用使动表达，清楚保留上帝施行审判的主动性。
- source_word: βάθει θαλάσσης
  choice: 海的深渊
  rationale: 保留“海”与“深处、深渊”的意象，也容纳与动词之间可能兼具处所和凭借意味的关系。
- source_word: ἐμπιστεύσαντας ἐπὶ σοὶ
  choice: 信靠你
  rationale: 简洁自然地表达把信任寄托于某人，保留其人格性含义。
- source_word: τῷ τῆς ἁπάσης κτίσεως δυναστεύοντι
  choice: 你这位统管一切受造之物者
  rationale: 将该同位描述直接连于“你”，保留上帝对全部受造物行使权柄的含义，同时避免额外加入原文没有的神学称号。
- source_word: σώους διεκόμισας
  choice: 把他们平安地带了过去
  rationale: “平安地”表达σώους的安然无恙，“带了过去”表达διακομίζω所含的护送通过或渡过危险之意。
theological_decisions:
- issue: 历史事件所指的人物
  choice: 正文保留“他”和“那人”等代词，不直接补出法老、摩西或以色列人
  alternative: 在正文中明确写出“法老”和“以色列人”
  rationale: 本节显然呼应出埃及过海事件，但希腊文本身只用代词和分词；保留隐含指涉可避免把解释写入正文，脚注则说明典故。
- issue: 上帝统管受造界的表述
  choice: 你这位统管一切受造之物者
  alternative: 掌管整个受造界的主宰
  rationale: 所选译法保留δυναστεύω的统治、行使权柄之意，又不额外引入“主宰”这一名词称号；备选译法在脚注中提供。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“大批人马”自然呈现追兵众多的军事场景；保留原文代词造成的上下文依赖，不在正文中明说人物身份。句末以“平安地带了过去”兼顾获救与经过海中危险两层含义。
