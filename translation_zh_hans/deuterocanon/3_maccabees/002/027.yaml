  yaml_path: translation/deuterocanon/3_maccabees/002/027.yaml
  text: He publicly proposed to spread reproach against the nation; having set up a stele on the tower by the court, he engraved an inscription
translation:
  language: zh_hans
  text: 他打算公开散布对这民族的非难；他在院落[b]旁的塔楼上竖立了一块碑[a]，并在碑上刻了铭文。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碑”也可译作“石柱”或“纪念碑”。希腊词指竖立起来、可供刻字的石质纪念物。
    reason: lexical_alternative
  - marker: b
    text: “院落”所译的希腊词也可指宫廷范围、庭院或围起来的院子；原文并未完全说明这里的具体建筑布局。
    reason: cultural_note
lexical_decisions:
- source_word: προέθετο δημοσίᾳ
  choice: 打算公开
  rationale: προέθετο 表示立意、意图或定意，δημοσίᾳ 表示公开地；此译不将其强化为已经颁布的正式命令。
- source_word: διαδοῦναι ψόγον
  choice: 散布……毁谤
  rationale: διαδοῦναι 指使某事传播开来；ψόγος 是责难、毁誉或使人蒙羞的话。上下文所指是针对一个民族的公开贬损，译作“毁谤”自然且保留敌意。
- source_word: τοῦ ἔθνους
  choice: 这民族
  rationale: ἔθνος 在此把犹太人作为一个群体来指称；“这民族”既保留集合意义，也不额外加入原文未明说的名称。
- source_word: ἐπὶ τοῦ κατὰ τὴν αὐλὴν πύργου
  choice: 在王宫院落旁的塔楼上
  rationale: πύργος 是塔楼，κατὰ τὴν αὐλήν 表示与院落相邻或相应的位置。αὐλή 可指院落，也可在此类语境中指王宫或宫廷范围；正文采用自然的建筑表达，并以脚注保留不确定性。
- source_word: στήλην ἀναστήσας
  choice: 立了一块碑
  rationale: στήλη 是竖立并适于镌刻文字的石碑、石柱或纪念物；中文“碑”准确、通俗，ἀναστήσας 的先行动作由“立了”表达。
- source_word: ἐκόλαψεν γραφήν
  choice: 又在上面刻下文字
  rationale: ἐκόλαψεν 指凿刻、镌刻，γραφή 在碑刻语境中指所刻的文字或铭文。“刻下文字”避免把下文内容未给出时过度术语化；“在上面”是由碑刻语境自然补足的指向。
