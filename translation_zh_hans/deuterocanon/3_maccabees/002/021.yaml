  text: There the God who watches over all[a], the holy forefather among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness[b],
translation:
  language: zh_hans
  text: 在那里，鉴察万有的上帝、在众圣者中[a]为圣的先祖[b]，垂听了合乎律法的祈求，鞭打了那怀着骄横和狂妄而极其自高的人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在众圣者中”也可能译作“在圣所中”或“在圣地中”；此处的希腊语既可能指圣者，也可能指圣地。
    reason: alternative_reading
  - marker: b
    text: “先祖”所译的希腊语是罕见称号 προπάτωρ，也可译作“祖先”或“始祖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνταῦθα
  choice: 就在那时
  rationale: 该词既可指地点，也可承接叙事进程；此处用现代汉语常见的叙事转折表达，不强行指定为某一具体地点。
- source_word: ὁ πάντων ἐπόπτης θεός
  choice: 鉴察万有的上帝
  rationale: ἐπόπτης指观看、监察或看顾者；“鉴察万有”保留上帝洞察并监管一切的称号性质。
- source_word: προπάτωρ
  choice: 先祖
  rationale: 该词通常指先祖或祖先；这里作为上帝的罕见称号，直译以保留原文不寻常的祖源性、群体性意味，避免擅自加入“主宰”等原文没有的限定。
- source_word: ἅγιος ἐν ἁγίοις
  choice: 在众圣者中为圣的
  rationale: ἁγίοις可作阳性或中性复数理解；正文采用“在众圣者中”的人称性解读，同时以脚注保留“在圣所中”的处所性可能。
- source_word: εἰσακούσας
  choice: 垂听了
  rationale: 该不定过去时分词表示上帝听取祈求并作出回应；“垂听”在庄重现代汉语中自然体现有利回应的语气。
- source_word: τῆς ἐνθέσμου λιτανείας
  choice: 合乎律例的恳求
  rationale: λιτανεία是恳求、哀求；ἐνθέσμος表示合乎既定律例、规矩或正当秩序。“合乎律例”保留其规范性而不过度限定为某条成文法律。
- source_word: ἐμάστιξεν
  choice: 鞭打
  rationale: 该动词本义为鞭打、鞭笞；保留原文鲜明的惩罚意象，不以笼统的“惩罚”弱化。
- source_word: τὸν ὕβρει καὶ θράσει μεγάλως ἐπηρμένον
  choice: 那因骄横和狂妄而极其自高的人
  rationale: ὕβρις含骄横、凌人之意，θράσος含放肆无忌的狂妄；ἐπηρμένον具有被抬高、因而自高自大的形象，译文保留其强烈贬义。
theological_decisions:
- issue: 上帝称号 προπάτωρ 的译法
  choice: 先祖
  alternative: 祖先；始祖；至高先祖
  rationale: 原文确实将一个通常表示先祖的罕见称号用于上帝。正文直译为“先祖”，保留其神学张力，不用“始祖”强化创造或生殖含义，也不加入原文没有的“至高”。
- issue: ἅγιος ἐν ἁγίοις 的理解
  choice: 在众圣者中为圣的
  alternative: 在圣所中为圣的；在至圣之处的圣者
  rationale: 希腊语ἁγίοις在形式上既可指圣者，也可指圣物、圣地。称号串联的语境较支持人称性解读，但处所性解读确实可能，故在脚注中保存。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“鉴察万有”“垂听”“律例”等词保持经文语体，但句法力求自然；对两个罕见且有歧义的神圣称号不作教派化解释。
