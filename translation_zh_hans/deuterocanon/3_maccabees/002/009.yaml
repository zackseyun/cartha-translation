  yaml_path: translation/deuterocanon/3_maccabees/002/009.yaml
  text: And because I love the house of Israel[a], I have promised that if a turning away comes upon us and distress overtakes us, and we come to our place and pray[b], I will hear our prayer.
translation:
  language: zh_hans
  text: 你爱以色列家，曾应许：如果我们背离了[a]，困苦临到我们，而我们来到自己的地方祈求，他就会垂听我们的祈求。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背离”也可译作“转离”或“叛离”；希腊词可以指离弃或转向别处，但本句没有进一步说明其具体性质。
    reason: lexical_alternative
  - marker: b
    text: 现存希腊文先说“你曾应许”（第二人称），后说“他就会垂听”（第三人称），人称并不一致。按祷告语境也可能理解为“你就会垂听”，但正文保留原文的人称变化。
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαπῶν
  choice: 爱
  rationale: 现在分词表示与主句同时的状态；汉语用“你爱……”自然地保留其修饰作用，不额外断定因果关系。
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: 以色列家
  rationale: 保留圣经中具有群体和盟约色彩的固定表达，不简化为“以色列人”。
- source_word: ἐπηγγείλω
  choice: 你曾应许
  rationale: 该词形是第二人称单数，表示作出应许；“曾应许”简洁体现先前的承诺。
- source_word: ἀποστροφή
  choice: 背离
  rationale: 此词可指转离、背离或叛离；“背离”保留道德或信仰偏离的可能性，又不采用含义更技术化的“叛教”。
- source_word: καταλάβῃ
  choice: 临到
  rationale: 在此表示困苦追上、攫住或降临；“临到”符合庄重而自然的现代汉语。
- source_word: στενοχωρία
  choice: 困苦
  rationale: 表达受压迫、陷入艰难的处境，不对苦难类型作过度限定。
- source_word: τὸν τόπον ἡμῶν
  choice: 我们自己的地方
  rationale: 原文只说“我们的地方”，没有明确写“圣所”或“圣殿”，因此不在正文中补明。
- source_word: δεηθῶμεν / δεήσεως
  choice: 祈求／祈求
  rationale: 动词和名词均强调带着请求的祷告；重复“祈求”保留原文的词根呼应。
- source_word: εἰσακούσῃ
  choice: 他就会垂听
  rationale: 现存希腊文为第三人称单数形式；“垂听”体现听取并应允祈求的语义，同时保留原文从第二人称“你曾应许”转为第三人称的突兀变化。
theological_decisions:
- issue: 应许者与垂听者的人称变化
  choice: 正文译作“你曾应许……他就会垂听”
  alternative: 按语境顺译为“你曾应许……你就会垂听”
  rationale: ἐπηγγείλω是第二人称单数，而εἰσακούσῃ是第三人称单数。虽然祷告语境很容易促使译者统一为第二人称，但这会改动现存希腊文本；正文保留其人称张力，并以脚注说明。
- issue: ἀποστροφή的性质
  choice: 背离
  alternative: 叛教；转变；败退
  rationale: 该词本身可以表示转离或背叛，但本句未充分界定它是否是技术意义上的叛教，因此不把较强的教义判断写入正文。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“以色列家”“垂听”保留经文语体；句法作适度汉语化处理，但不消除希腊文本中第二人称转第三人称的难点。所有脚注标记均已置于正文。
