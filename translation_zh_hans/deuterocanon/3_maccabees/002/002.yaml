base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/002.yaml
  text: For you are the one who created all things and rules over all; you are a righteous sovereign[a], and you judge those who do anything in insolence and arrogance.
translation:
  language: zh_hans
  text: 因为你是创造万物、掌管一切的那一位；你是公义的主宰[a]，审判凡以狂妄和傲慢行事的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你是公正的统治者。”希腊语δίκαιος既可译为“公义的”，也可译为“公正的”；δυνάστης既可译为“主宰”，也可译为“统治者”。
    reason: 保留δίκαιος与δυνάστης各自合理的词义选择。
lexical_decisions:
- source_word: σὺ γὰρ εἶ
  choice: 因为你是
  rationale: γάρ承接上文，说明祈求所依据的理由，译作“因为”自然清楚；明示的σὺ保留为“你”。
- source_word: ὁ κτίσας τὰ πάντα
  choice: 创造万物的那一位
  rationale: 带冠词的简单过去时分词具有名词性，同时保留创造行动；τὰ πάντα译为涵盖一切受造之物的“万物”。
- source_word: τῶν ὅλων ἐπικρατῶν
  choice: 掌管一切
  rationale: ἐπικρατέω表示对某范围拥有并施行权柄；“掌管”兼顾统治和实际支配之意。
- source_word: δυνάστης
  choice: 主宰
  rationale: 该词指握有权力、实行统治者；“主宰”庄重而通顺，也与前句“掌管一切”相呼应。
- source_word: δίκαιος
  choice: 公义的
  rationale: 此处既涉及上帝的道德属性，也连于随后的审判；“公义”保留较宽的含义，不限于司法公平。
- source_word: τοὺς ὕβρει καὶ ἀγερωχίᾳ τι πράσσοντας
  choice: 凡以狂妄和傲慢行事的人
  rationale: 将分词结构自然译为“行事的人”；τι的非限定意味以“凡”概括，避免生硬的“做任何事”。ὕβρις含狂妄、冒犯之意，ἀγερωχία指高傲自大。
- source_word: κρίνεις
  choice: 审判
  rationale: κρίνω在此为司法性用语，但原文没有明确限定判决结果，因此不强化为“定罪”。
theological_decisions:
- issue: δίκαιος用于描述上帝的统治和审判时如何翻译
  choice: 公义的
  alternative: 公正的
  rationale: “公义”兼顾上帝品格与审判的正直，“公正”则更偏向司法公平。正文采用前者，同时以脚注保留后者。
- issue: κρίνεις是否应译为带有定罪结果的词语
  choice: 审判
  alternative: 定罪
  rationale: 原词本身可涵盖判断和裁决，但本句未明说判决结果；采用“审判”可避免加入原文没有明确表达的结论。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语言。“创造万物、掌管一切”形成平衡句式；“狂妄和傲慢”保留两个相近但不完全相同的希腊词，不将其合并。
