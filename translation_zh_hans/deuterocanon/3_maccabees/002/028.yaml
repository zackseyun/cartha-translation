base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/028.yaml
  text: Let no one who does not sacrifice enter their sanctuaries[a], but let all the Jews be subjected to registration and servant status[c][b], and let those who object be taken by force and put to death.
translation:
  language: zh_hans
  text: 凡不献祭的人，都不得进入他们的圣所[a]；所有犹太人都要被登记在册[b]，并置于奴役地位；凡反对的人，都要被强行带走，处死[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”所译的希腊词也可指圣物或宗教礼仪。
    reason: lexical_alternative
  - marker: b
    text: 这里的“登记”可能特指为国家管控或征税而进行的人口登记。
    reason: cultural_note
  - marker: c
    text: 原文直译为“使之离开活着的状态”，即剥夺生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδένα τῶν μὴ θυόντων
  choice: 凡不献祭的人，都不得
  rationale: 诏令语境中的不定式表达命令；用“凡……都不得”自然传达禁令，并保留现在分词所指的“不参与献祭者”这一类人。
- source_word: ἐπὶ τὰ ἱερὰ αὐτῶν εἰσιέναι
  choice: 进入他们的圣所
  rationale: εἰσιέναι通常表示进入；τὰ ἱερά既可指圣所，也可指圣物或宗教礼仪。此处与“进入”搭配，空间意义较为自然，但以脚注保留词义范围。
- source_word: λαογραφίαν
  choice: 登记在册
  rationale: 指人口登记，可能服务于国家管控或征税；正文采用不作过度限定的通顺表达。
- source_word: οἰκετικὴν διάθεσιν
  choice: 降为奴仆身份
  rationale: 该短语表示被置于家仆或奴役性的社会法律地位；“奴仆身份”既清楚表达压迫性，又不武断限定具体奴隶制度形态。
- source_word: ἀχθῆναι
  choice: 被登记在册，降为
  rationale: ἄγω的被动不定式表示被带入或置于某种状态；汉语分别依搭配译为“被登记”和“降为”，使句意自然。
- source_word: ἀντιλέγοντας
  choice: 反抗的人
  rationale: 该词可指反驳、反对或抵抗；诏令及强制处置语境下，“反抗”比单纯“提出异议”更贴合，同时不限定反抗方式。
- source_word: βίᾳ φερομένους
  choice: 被强行带走
  rationale: 保留βίᾳ的强制、暴力色彩和被动遭带走的意义。
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: 处死
  rationale: 字面为“使离开活着的状态”，是指剥夺生命；正文直译其实际含义，脚注注明原文委婉表达。
theological_decisions:
- issue: οἰκετικὴν διάθεσιν所表达的受奴役地位
  choice: 奴仆身份
  alternative: 奴隶身份；服役地位；家奴处境
  rationale: 原文强调受强制支配、近于家奴的身份，不能弱化为一般“服务”；但其确切制度类别未完全明说，因此采用“奴仆身份”保留社会压迫力度与一定宽度。
- issue: τὰ ἱερά的所指
  choice: 圣所
  alternative: 圣物；宗教礼仪
  rationale: 因与“进入”连用，地点义最自然；然而该希腊词本身也能涵盖圣物或礼仪，故在脚注中保留歧义。
translation_notes:
  register: 采用现代、庄重而清晰的诏令语体。“凡……都不得”“都要……”体现命令的强制性；分号区分禁入、登记降等和处死反抗者三项规定。所有脚注标记均置于相关正文词句之后。
