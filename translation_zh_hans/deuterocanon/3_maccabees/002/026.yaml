- from: 他不但被无耻的放荡行为所侵蚀，而且胆大妄为到了如此地步，以致各处[b]都有人煽动诽谤[a]；他的许多朋友也竭力迎合王的意图，亲自顺从他的意愿。
  to: 他不但被无耻的放荡行为所侵蚀，而且胆大妄为到了如此地步，以致各处[b]都掀起诽谤之词[a]；他的许多朋友竭力顺应王的意图，也随从他的意愿。
