base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/026.yaml
  text: He was not only inflamed with shameless debaucheries[a], but also advanced to such a degree of audacity that slanders were being stirred up in the places, and many of his friends, straining toward the king’s purpose[b], were themselves following his will.
translation:
  language: zh_hans
  text: 他不但被无耻的放荡行为所侵蚀，而且胆大妄为到了如此地步，以致各处[b]都掀起诽谤之词[a]；他的许多朋友竭力顺应王的意图，也随从他的意愿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诽谤之词”也可译作“恶言”或“毁谤”；希腊词可泛指侮辱或败坏名声的言论。
    reason: lexical_alternative
  - marker: b
    text: “各处”也可能指“各地区”或“各地”。原文没有明确限定这些地点的性质或范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηκέσθη
  choice: 被……所侵蚀
  rationale: 该词本义与“咬、啃噬”有关；“侵蚀”保留了恶行不断啃噬、驱使他的形象，同时符合现代汉语表达。
- source_word: ἀναισχύστοις ἀσελγείαις
  choice: 无耻的放荡行为
  rationale: 既保留ἀναισχύστοις“毫无羞耻”的强烈贬义，也用“放荡行为”表达ἀσελγείαις所指不受约束、道德败坏的行为，避免缩窄为某一种具体罪行。
- source_word: ἐπὶ τοσοῦτον θράσους προῆλθεν
  choice: 胆大妄为到了如此地步
  rationale: 保留原文程度递进和走到某一地步的动态表达，并传达θράσος在此处的狂妄、肆无忌惮之意。
- source_word: δυσφημίας
  choice: 诽谤
  rationale: 该词可泛指恶言、毁谤或败坏名声的话；语境中“诽谤”自然且不过度指定为宗教性的亵渎。
- source_word: ἐν τοῖς τόποις
  choice: 各处
  rationale: 以简洁自然的汉语保留地点范围的概括性，不武断限定为行政区、地区或某些特定场所。
- source_word: συνίστασθαι
  choice: 有人煽动
  rationale: 在诽谤活动的语境中，该词表示使某事形成、发动或兴起；“有人煽动诽谤”表达其被蓄意挑起的过程。
- source_word: ἐντείνοντας εἰς τὴν τοῦ βασιλέως πρόθεσιν
  choice: 竭力迎合王的意图
  rationale: “竭力”保留ἐντείνοντας所含用力、趋向之意；“迎合”说明这些朋友主动使自己与王的既定意图一致，同时不把该分词过度解释为他们制定了王的计划。
- source_word: θελήσει
  choice: 意愿
  rationale: 表达某人想要实行之事，与前面的“意图”有所区分，也适合庄重而现代的叙事语体。
theological_decisions:
- issue: 对统治者行为的道德定性
  choice: 采用“无耻的放荡行为”等强烈伦理措辞
  alternative: 较弱的“败坏行为”或更具体的性行为术语
  rationale: 原文的ἀναισχύστοις与ἀσελγείαις语气强烈，应保留其谴责力度，但不应加入原文未明确限定的罪行类别或后期神学术语。
- issue: 末句ἐκείνου所指
  choice: 以“他的意愿”指向同一位王
  alternative: 理解为另一位未明说之人的意愿
  rationale: 最近且最自然的先行对象是王；汉语用“他的”仍保留代词形式，没有加入额外身份说明。
- issue: 朋友与王之意图的关系
  choice: 译为“竭力迎合王的意图”
  alternative: “竭力推动王的意图”或“努力趋向王的意图”
  rationale: 原文既表达他们主动用力，也表达方向朝向王的意图；“迎合”避免断言他们是计划的发起者，同时保留其主动附和的责任。
translation_notes:
  register: 采用现代、庄重且易懂的叙事汉语。主句保留原文“不但……而且……到了如此地步，以致……”的递进结构；分号用于区分诽谤的兴起与朋友的主动附和。脚注标记按实际所释词语放置：[a]接“诽谤”，[b]接“各处”。
