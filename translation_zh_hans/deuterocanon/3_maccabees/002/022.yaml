  text: Therefore his friends and bodyguards[a], seeing the acute distress that had come upon him, hurried to set matters straight[b], fearing that even his life might fail.
translation:
  language: zh_hans
  text: 因此，他的朋友和贴身护卫见他遭受了严厉的惩治[a]，又怕他连性命也保不住，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惩治”也可译作“责罚”。希腊文指临到他的严厉惩处，并未具体说明其表现形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: 因此
  rationale: 表示由前文情形引出的结果；“因此”自然地保留了推论和因果衔接。
- source_word: οἵ τε φίλοι καὶ σωματοφύλακες
  choice: 他的朋友和贴身护卫
  rationale: φίλοι 基本义为“朋友”，在王室语境中也可能指亲信，但不宜径自收窄为“朝臣”；σωματοφύλακες 指负责近身保护的人，译为“贴身护卫”。
- source_word: ὀξεῖαν ... εὔθυναν
  choice: 严厉的惩治
  rationale: εὔθυναν 在此是阴性单数宾格名词，与 ὀξεῖαν 搭配，并由 καταλαβοῦσαν αὐτόν 修饰，不是“纠正、处理”的谓语动词。其义可指惩处、责罚或管教；结合上文临到王的灾祸，译为“严厉的惩治”。
- source_word: καταλαβοῦσαν αὐτόν
  choice: 他遭受了
  rationale: 分词表示这惩治临到、抓住或压倒了他；汉语用“遭受”自然表达被临到的意味。
- source_word: φοβούμενοι
  choice: 又怕
  rationale: 保留分词所表达的伴随心理和行动动机，并用“又”承接前一个分词结构。
- source_word: μὴ καὶ τὸ ζῆν ἐκλείπῃ
  choice: 怕他连性命也保不住
  rationale: 原文近于“恐怕连活着这件事也终止”；此译保留 καί 的递进意味，又以现代汉语自然表达他们担心他会死。
theological_decisions:
- issue: εὔθυνα 所指惩治的性质与施行者
  choice: 译作“惩治”，不明说施行者
  alternative: 译作“上帝的惩罚”或仅作“急性痛苦”
  rationale: 词语本身带有纠正、追责或惩处色彩，但本节没有明说施行者；因此既不淡化为纯粹病症，也不在正文补入“上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。按希腊文句法，本节只有“见”和“怕”两个分词，主句动作在下节继续，因此末尾保留逗号，不擅自补出“赶紧处理”等原文没有的谓语。
