  text: wipe away our sins[a], and scatter our errors[c][b], and let your mercy shine forth at this hour.
translation:
  language: zh_hans
  text: 求你涂抹我们的罪[a]，驱散我们的愚妄[b]，并在此刻彰显你的怜悯[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“抹去我们的罪”。
    reason: lexical_alternative
  - marker: b
    text: “愚妄”所译的希腊词也可指“错误”“愚行”或“过失”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“使你的怜悯显现”，也可理解为“使你的怜悯照耀出来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάλειψον
  choice: 涂抹
  rationale: 该命令式动词有擦去、抹除之意；“涂抹”保留其形象性，也符合庄重祷告语体。
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: 我们的罪
  rationale: ἁμαρτία在认罪祷告中具有明确的道德和宗教含义，译作“罪”准确自然。
- source_word: διασκέδασον
  choice: 驱散
  rationale: 该动词表示使之散开、消散；对抽象宾语“愚妄”而言，“驱散”比字面化的“打散”更自然，同时保留动态意象。
- source_word: τὰς ἀμβλακίας ἡμῶν
  choice: 我们的愚妄
  rationale: ἀμβλακία可指愚昧、愚行或错误。“愚妄”既保留其道德与认知层面的负面意味，又避免把它弱化为纯粹的知识性“错误”。
- source_word: ἐπίφανον
  choice: 彰显
  rationale: 该命令式可指使显现、显明或照耀。“彰显”自然地表达使怜悯显现，同时不强行限定为视觉性的发光。
- source_word: τὸ ἔλεός σου
  choice: 你的怜悯
  rationale: ἔλεος在向上帝祈求宽恕的语境中宜译为“怜悯”，兼具慈悲与施恩之意。
- source_word: κατὰ τὴν ὥραν ταύτην
  choice: 在此刻
  rationale: 该短语指当前这一时刻；“在此刻”比“在这小时”更符合现代汉语，同时保留祷告的紧迫感。
theological_decisions:
- issue: “罪”与ἀμβλακίας之间的关系
  choice: 分别译为“罪”和“愚妄”
  alternative: 将两者都泛译为“罪过”，或把ἀμβλακίας译为“错误”
  rationale: 原文使用两个不同名词形成递进式认罪；区别翻译可保留其修辞层次，又不把二者规定为严格的神学类别。
- issue: ἐπίφανον所含显现或照耀意象
  choice: 译为“彰显”
  alternative: 译为“使……照耀出来”或“显出”
  rationale: “彰显”保留上帝怜悯公开显现的含义，但不排除原词可能具有的照耀色彩；脚注列明其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。三个并列祈使句保持原文节奏；“求你”统摄全句，避免逐项重复。所有脚注标记均置于对应词语之后。
