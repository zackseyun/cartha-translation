  text: They quickly dragged him out[a], struck with overwhelming fear.
translation:
  language: zh_hans
  text: 他们被极度的恐惧所震慑[a]，赶紧把他拖了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“被超乎寻常的恐惧所击中”，意指他们受到极强烈的惊吓。
    reason: 说明ὑπερβάλλοντι与καταπεπληγμένοι组合中的强度和“受击”意象。
lexical_decisions:
- source_word: ταχέως
  choice: 赶紧
  rationale: 表示动作迅速；结合施事者正处于强烈恐惧中的语境，“赶紧”比单纯的“迅速”更自然，也保留了急迫感。
- source_word: αὐτὸν
  choice: 他
  rationale: 阳性单数宾格代词，指向上文所说的男子。
- source_word: ἐξείλκυαν
  choice: 把他拖了出去
  rationale: 该复合动词表示从某处拉出或拖出；“拖了出去”保留动作的方向和带有强制性的力度。
- source_word: ὑπερβάλλοντι
  choice: 极度的
  rationale: 修饰“恐惧”，表示超出通常程度；“极度的”是现代汉语中自然、明确的强度表达。
- source_word: καταπεπληγμένοι
  choice: 被……所震慑
  rationale: 完成时被动分词描述众人已受到强烈冲击并处于其影响之下；“震慑”既保留被击中的意象，也适合与“恐惧”搭配。
- source_word: φόβῳ
  choice: 恐惧
  rationale: 保留该词的基本含义；其强烈程度已由ὑπερβάλλοντι表达，无须改译为更窄的“惊骇”或“恐怖”。
