  text: They too, when they saw the works of your hand, praised you, the Almighty.
translation:
  language: zh_hans
  text: 他们也看见你手所做的事，便赞美你这位全能者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ καὶ
  choice: 他们也
  rationale: 承接上文已经提到的一群人，并保留 καί 的附加意味；现代汉语用“他们也”自然明确。
- source_word: συνιδόντες
  choice: 看见
  rationale: 该不定过去时分词表示察看、看见或认识到；此处用“看见……就……”自然表达其与主句动作的时间关系，同时不额外强化为“清楚认识”。
- source_word: ἔργα
  choice: 所行的事
  rationale: ἔργα 指作为或所做之事；“所行的事”既符合经文语体，也比单独译作“工作”更自然。
- source_word: σῆς χειρός
  choice: 你手所行的
  rationale: 保留“你的手”这一表达神施行作为的拟人性意象，而不将其解释性改译为“你的能力”。
- source_word: ἤνεσάν
  choice: 赞美
  rationale: 准确表达 αἰνέω 的敬拜性含义，简洁而庄重。
- source_word: τὸν παντοκράτορα
  choice: 你这位全能者
  rationale: παντοκράτωρ 是对受称颂者的同位称号；“全能者”保留其称号性质及普遍权能的含义，“你这位”使汉语呼语关系清楚。
theological_decisions:
- issue: 神圣称号 παντοκράτωρ 的译法
  choice: 全能者
  alternative: 统管万有者
  rationale: “全能者”是现代汉语圣经语体中自然、凝练的对应词，表达神无所不及的权能，又不额外限定该词究竟侧重能力还是统治。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看见……就赞美”自然呈现希腊语分词与主句的关系；保留“手”的圣经性意象和“全能者”的称号形式。
