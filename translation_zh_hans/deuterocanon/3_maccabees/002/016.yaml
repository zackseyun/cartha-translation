base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/016.yaml
  text: Do not punish us for their uncleanness[a], nor call us to account for profanation, lest the lawless boast in their wrath and exult in the pride of their tongue, saying[b],
translation:
  language: zh_hans
  text: 不要因这些人的污秽[a]向我们施行报应，也不要因亵渎追究我们，免得那些不法之徒因自己的怒气夸口，又因自己口舌的狂傲而欢欣，说： [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要在这些人的不洁中向我们施行报应。”希腊文动词可指伸张正义、惩罚或报复。
    reason: lexical_alternative
  - marker: b
    text: 原文到“说”尚未结束，所说的内容见下一节。
    reason: continuation
lexical_decisions:
- source_word: ἐκδίκησῃς
  choice: 向我们施行报应
  rationale: 该动词可指伸张正义、惩罚或报复；“施行报应”保留司法与报偿意味，同时避免把上帝的行动表达成出于私愤的报复。
- source_word: ἀκαθαρσίᾳ
  choice: 污秽
  rationale: 该词可涵盖礼仪和道德上的不洁；“污秽”保留宗教语域，也适合此处因他人沾污而受牵连的语境。
- source_word: εὐθύνῃς
  choice: 追究我们
  rationale: 该动词有要求交账、查究责任之意；“追究”自然地传达司法性的问责。
- source_word: βεβηλώσει
  choice: 亵渎之事
  rationale: 该词指把圣物当作凡俗之物，译作“亵渎之事”既保留冒犯神圣的含义，也与前面的“污秽”有所区分。
- source_word: παράνομοι
  choice: 不法之徒
  rationale: 该词直指违背律法的人；“不法之徒”保留其道德与法律色彩。
- source_word: καυχήσωνται
  choice: 夸口
  rationale: 准确表达自夸、自得之意，并与后面的欢欣区分。
- source_word: ἀγαλλιάσωνται
  choice: 欢欣
  rationale: 表达强烈喜悦；在此为敌对者因自认为得胜而欢欣，措辞庄重而自然。
- source_word: θυμῷ αὐτῶν
  choice: 在怒气中
  rationale: θυμός可指怒气、烈怒或激烈情绪；直译为“在怒气中”保留希腊文结构及其一定程度的语义张力。
- source_word: ὑπερηφανίᾳ γλώσσης αὐτῶν
  choice: 因口舌狂傲
  rationale: 保留“舌头/口舌”的形象，并用“狂傲”呈现ὑπερηφανία所含的傲慢意味，中文也较自然。
theological_decisions:
- issue: 祈求者是否请求上帝不要因他人的污秽和亵渎而惩治他们
  choice: 将τούτων理解为“这些人的”，指与“我们”相对的敌对者；祈求者请求不要因这些人的污秽而遭报应。
  alternative: 将τούτων较抽象地理解为“这些事”。
  rationale: 上下文中“我们”与后面的“不法之徒”形成对照，较支持人物指称；译文仍不具体说明这些人是谁，也不补入原文没有的责任机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“施行报应”“追究”“亵渎”维持祷告的司法与宗教语域；两处脚注标记均已置于正文中。
