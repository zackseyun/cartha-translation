base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/031.yaml
  text: But some[a], lightly despising the foundations of the city's piety, readily gave themselves up, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: zh_hans
  text: 然而，有些人轻率地鄙弃这城敬虔生活的根基[a]，毫不迟疑地把自己交了出去，以为自己会因日后与王交往而分得某种莫大的声望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “根基”或译“支柱”“基座”或“台阶”。希腊语采用比喻，本义可指基座、支承物或台阶。
    reason: 保留ἐπιβάθρας的实体意象及其在本句中的词义开放性。
lexical_decisions:
- source_word: Ἐνιοι
  choice: 有些人
  rationale: 表示群体中的一部分人；现代汉语自然，也保留了不特指的复数含义。
- source_word: ἐπιπολαίως
  choice: 轻率地
  rationale: 表达浮浅、草率而不郑重的态度；比“肤浅地”更适合修饰主动鄙弃的行为。
- source_word: στυγοῦντες
  choice: 鄙弃
  rationale: 保留强烈的厌恶与拒斥意味，同时与ἐπιπολαίως所表达的轻率态度搭配自然。
- source_word: ἐπιβάθρας
  choice: 根基
  rationale: 该词本指基座、支承或台阶，此处为比喻；“根基”在中文中自然地表达支撑该城敬虔生活的基础，并以脚注保留其他可能意象。
- source_word: τὰς τῆς πόλεως εὐσεβείας
  choice: 这城敬虔的
  rationale: εὐσέβεια兼有宗教虔敬与敬神实践之意；“敬虔”保留其道德—宗教色彩，不把它缩减为制度性的“宗教”。
- source_word: εὐχερῶς
  choice: 欣然
  rationale: 表达主动、毫不迟疑地接受或顺从；在此比单纯的“容易地”更符合自愿交出自己的语境。
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: 把自己交了出去
  rationale: 保留反身和自愿交付的含义，又避免“献上自己”可能带来的祭献联想。
- source_word: κοινωνήσοντες
  choice: 能分享
  rationale: 表达将来预期参与并获得一份的意思。
- source_word: εὐκλείας
  choice: 声望
  rationale: 指良好名声、显赫声誉；“声望”比带有较强神学色彩的“荣耀”更合适。
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: 日后与王交往
  rationale: συναναστροφή指来往、交际或关联，ἐσομένης表明这是所期待的未来关系；译文不将其强化为亲密友谊。
theological_decisions:
- issue: 在城邦宗教语境中翻译εὐσεβείας
  choice: 敬虔
  alternative: 虔敬活动；宗教传统
  rationale: “敬虔”保留敬神、虔诚及其实践层面的开放性，不把原文限定为宗教制度，也不引入后世宗派性的技术含义。
- issue: 如何理解ἐπιβάθρας的宗教性比喻
  choice: 根基
  alternative: 支柱；基座
  rationale: 原词的实体意象可指基座、支承或台阶；上下文显然为比喻。“根基”中文通顺，但脚注说明其他可能译法，以免将比喻过度固定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“这城”承接具体城市语境；“与王交往”保留社会关联之意，不暗示亲密友谊；“以为”清楚标示这是这些人的主观期待。
