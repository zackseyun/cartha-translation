revisions:
- from: 然而，有些人轻率地鄙弃这城敬虔的根基[a]，欣然把自己交了出去，以为日后与王交往，便能分享某种莫大的声望。
  to: 然而，有些人轻率地鄙弃这城敬虔生活的根基[a]，毫不迟疑地把自己交了出去，以为自己会因日后与王交往而分得某种莫大的声望。
