base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/005.yaml
  text: You made known your power against the bold Pharaoh, when he had enslaved your holy people Israel, testing him with varied and many punishments; by these you made known your great might.
translation:
  language: zh_hans
  text: 你曾用各种各样、众多的刑罚考验那奴役了你圣民以色列的狂妄法老[a]，使人认识你的能力；你也借着这些刑罚，使人认识你伟大的威力。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂妄”也可译作“放肆”或“傲慢”；希腊词含有胆大妄为、目中无人的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“用各种而许多的刑罚考验他”；这种说法可能指上帝借这些审判试验或验证法老。
    reason: lexical_alternative
lexical_decisions:
- source_word: θρασὺν
  choice: 狂妄
  rationale: 该词在此带有负面的胆大、放肆或傲慢意味；“狂妄”自然地表达法老目中无人的气焰，又不过度扩展为更具体的道德判词。
- source_word: καταδουλωσάμενον
  choice: 奴役了
  rationale: 明确保留使以色列人沦为奴隶的含义；分词表示这是法老先前已经实施的行为。
- source_word: λαόν σου τὸν ἅγιον Ἰσραήλ
  choice: 你圣民以色列
  rationale: 同时保留“你的”“圣”“民”和“以色列”，并让“以色列”作为同位语标明这圣民的身份。
- source_word: ποικίλαις καὶ πολλαῖς
  choice: 各种各样、接连不断的
  rationale: 分别传达种类繁多和数量众多；“接连不断”在灾罚语境中自然体现多次临到，同时避免生硬直译为“各种而许多”。
- source_word: δοκιμάσας
  choice: 考验
  rationale: 保留该动词“试验、验证”的基本含义，不直接消解为“惩罚”；受事者按句法和上下文理解为法老。
- source_word: τιμωρίαις
  choice: 刑罚
  rationale: 指上帝施行的惩治行动；“刑罚”庄重、清楚，也符合出埃及灾祸的语境。
- source_word: ἐγνώρισας
  choice: 使人认识
  rationale: 两次均作使役理解并一致翻译，表达上帝借审判公开彰显自己的能力；希腊文没有明说认识者是谁，中文以泛指“人”自然表达。
- source_word: δύναμιν
  choice: 能力
  rationale: 指上帝在行动中显出的有效力量；“能力”是自然且贴近原义的译法。
- source_word: κράτος
  choice: 威力
  rationale: 与前面的 δύναμις 略作区分，同时保留强大力量的语义；“无比”承接 μέγα 的强调。
- source_word: ἐφʼ αἷς
  choice: 借着这些刑罚
  rationale: 关系代词最自然地回指复数的“刑罚”，并说明这些刑罚是彰显上帝威力的途径。
theological_decisions:
- issue: 两处 ἐγνώρισας 的主语、语态意义与重复
  choice: 两处均以上帝为主语，译作“使人认识”，并保留重复结构。
  alternative: 可较自由地译作“彰显”或“显明”，也可能将其中一处弱化为“认识”。
  rationale: 祷告者是在回述上帝借出埃及的审判公开显示自身力量；两次作使役意义既符合上下文，也避免无根据地改变同一动词的含义。
- issue: δοκιμάσας 与刑罚的关系
  choice: 保留“考验”这一试验性用语，而不单译成“惩罚”。
  alternative: 可按事件效果意译为“惩罚他”或“用灾祸打击他”。
  rationale: 原文将“考验”与“刑罚”结合，形成带张力的表达；保留二者可避免把审判兼具试验或验证的意味抹平。
- issue: θρασὺν 的负面色彩
  choice: 译作“狂妄”。
  alternative: 可译作“胆大的”“放肆的”或“傲慢的”。
  rationale: 在法老奴役圣民并受罚的语境中，该词明显具有贬义；“狂妄”兼顾大胆妄为和傲慢，不额外引入宗派性解释。
- issue: μέγα κράτος 的表达
  choice: 译作“无比的威力”。
  alternative: 可较形式对应地译作“伟大的权能”或“强大的威力”。
  rationale: “无比”在现代汉语中自然传达 μέγα 的高度强调，而“威力”与前面的“能力”保持语义联系又不完全重复。
translation_notes:
  register: 采用现代、庄重而易懂的祷告叙事语体。调整希腊文较长的分词结构，使修饰关系在中文中清楚；保留两次“使人认识”的修辞重复，并以分号呈现两层相连的陈述。
