base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/012.yaml
  text: 'But look now, holy King: because of our many and great sins we are being oppressed, and we have been subjected to our enemies, and we are left in weakness.'
translation:
  language: zh_hans
  text: 但如今，圣洁的君王啊，请看：因我们的罪多且重，我们正受压迫，已受制于仇敌，并且陷于软弱无力之中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ δὲ νῦν
  choice: 但如今……请看
  rationale: 保留转折词 δὲ、时间词 νῦν，以及祈祷中 ἰδού 引请神察看的语气；用现代汉语调整语序，使呼语自然。
- source_word: ἅγιε Βασιλεῦ
  choice: 圣洁的君王啊
  rationale: ἅγιε 与 Βασιλεῦ 均为呼格；“圣洁的君王”直接保留神圣属性与君王称号。
- source_word: διὰ τὰς πολλὰς καὶ μεγάλας ἡμῶν ἁμαρτίας
  choice: 因我们许多重大的罪
  rationale: διὰ 加宾格表达原因；“许多重大的罪”保留 πολλὰς καὶ μεγάλας 的并列强调，同时符合现代汉语习惯。
- source_word: καταπονούμεθα
  choice: 我们正受压迫
  rationale: 该动词为现在时被动，表达持续遭受苦待、压迫；“正受压迫”兼顾时态和被动意义。
- source_word: ὑπετάγημεν τοῖς ἐχθροῖς ἡμῶν
  choice: 已被交在仇敌权下
  rationale: ὑποτάσσω 的被动形式表示被置于服从、辖制之下；此译法比单纯“臣服”更清楚呈现被动受制的处境。
- source_word: παρείμεθα ἐν ἀδυναμίαις
  choice: 陷于软弱无力之中
  rationale: παρίημι 的被动在此有衰弱、无力或被撇在无力状态中的含义；介词结构 ἐν ἀδυναμίαις 描绘所处境况，译文保留其状态性，而不武断限定为身体或军事软弱。
theological_decisions:
- issue: 苦难与罪的因果表述
  choice: 因我们许多重大的罪
  alternative: 由于我们的罪，神把我们交给仇敌
  rationale: 原文明确把受压迫与群体的罪联系起来，却没有在本句明说神是施行交付的主语；译文保留因果关系，但不补入原文未明说的神学行动者。
- issue: “圣洁的君王”的指称
  choice: 保留为直接呼语，不增补“神”或“主”
  alternative: 圣洁的君王——神啊
  rationale: 上下文虽显然是向神祷告，本句希腊文只使用称号；不增补名称可更忠实地保留原文表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留祷告式呼语和三重困境的递进结构；避免古奥的“看哪”及过度解释性的神学增补。
