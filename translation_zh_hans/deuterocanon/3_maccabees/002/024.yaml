  yaml_path: translation/deuterocanon/3_maccabees/002/024.yaml
  text: But after some time[a], when he had recovered himself, he in no way came to regret it when he was rebuked; rather, having issued a bitter threat[b], he departed.
translation:
  language: zh_hans
  text: 但过了一段时间，他恢复过来[a]后，虽受责备，仍丝毫没有悔意[b]；反而发出严厉的威胁，便离去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恢复过来”也可译作“镇定下来”或“重新振作”。原文的表达在此很可能指他从先前的失态或不安中恢复镇定。
    reason: lexical_alternative
  - marker: b
    text: “没有悔意”也可理解为“丝毫没有改变心意”。原文可指毫无懊悔，也可指拒绝重新考虑原先的决定。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν χρόνῳ δὲ ὕστερον
  choice: 但过了一段时间
  rationale: 表达叙事中的时间推移，并以“但”保留 δέ 在上下文中轻微的转折意味。
- source_word: ἀναλεξάμενος αὐτόν
  choice: 他恢复过来后
  rationale: 该中动态分词与 αὐτόν 在此很可能具有反身意味，指他从此前的失常或倒下中恢复；译法自然且不过度具体化。
- source_word: οὐδαμῶς εἰς μετάμελον ἦλθεν
  choice: 丝毫没有悔意
  rationale: 保留“完全没有进入悔悟状态”的强烈否定；中文以“丝毫没有悔意”简洁表达懊悔或回心转意的缺失。
- source_word: ἐπιτιμηθείς
  choice: 虽受了责备
  rationale: 被动分词表明责备临到他；结合后文的反应，译作让步关系在现代汉语中较顺畅。
- source_word: μετὰ ἀπειλῆς δὲ πικρᾶς
  choice: 反而撂下严厉的威胁
  rationale: πικρός 在此表示严酷、尖厉；“反而”体现 δέ 与前句无悔之间的对照。
- source_word: θέμενος
  choice: 撂下
  rationale: θέμενος 字面为“放下、作出”；与“威胁”搭配时，“撂下”能自然表达发出威胁，同时保留动作的强硬语气。
- source_word: ἀνέλυσεν
  choice: 便离去了
  rationale: 该动词在叙事语境中表示离开或返回；“离去”庄重简洁，且不擅自指定目的地。
