  rationale: 修订纠正了“名下”和“大得荣耀”的汉语及语义问题，并以“分别为圣”更直接表现成圣动作。原稿脚注b虽内容适当，却没有在正文设置相应锚点；现将[b]置于“显现”后，确保脚注锚点完整对应。对于句法困难的τῷ τῶν ἁπάντων ἀπροσδεεῖ，正文不强加“万有之神”，但脚注明确保留该称号性理解的可能。
