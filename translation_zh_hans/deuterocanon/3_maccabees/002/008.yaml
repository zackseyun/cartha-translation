base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/008.yaml
  text: You[a], O King, having created the boundless and immeasurable earth, chose this city and made this place holy for your name, though you have no need of anything[b], O God of all, and glorified it with majestic manifestation, having established it for the glory of your great and honored name.
translation:
  language: zh_hans
  text: 君王啊，你创造了无边无际、无法测度的大地，又拣选了这城，把这地方分别为圣，为你的名；你本不需任何事物[a]。你以威严的显现使这地方大有荣耀，并使它得以建立，为要彰显你伟大而尊贵的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希腊文的句法紧缩，τῶν ἁπάντων（“万有／一切事物”）可理解为“不需任何事物”的补足语；也可理解为称述上帝是“万有之主”或“万有之神”。正文保留前一种较简约的理解，不在正文中补入原文未明说的称号。
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεῦ
  choice: 君王啊
  rationale: 保留祷告中的呼格和庄重语气；“君王”在现代汉语中自然，也不额外引入专门称号。
- source_word: κτίσας
  choice: 创造了
  rationale: 不拘泥于希腊语分词形式，而以连贯的汉语承接后面的主要动作，同时保留创造先于拣选的关系。
- source_word: τὴν ἀπέρατον καὶ ἀμέτρητον γῆν
  choice: 无边无际、无法测度的大地
  rationale: 分别传达ἀπέρατος的无边界与ἀμέτρητος的不可测量，并按宇宙创造语境将γῆ译为“大地”。
- source_word: ἐξελέξω
  choice: 拣选了
  rationale: 准确表达神主动选择这城的意思，并保留经文语体而不把它处理为后期神学术语。
- source_word: ἡγίασας τὸν τόπον τοῦτον
  choice: 使这地方成为圣地
  rationale: 以现代汉语清楚表达使之分别为圣的动作；“圣地”在这里仍直接对应被分别为圣的地点。
- source_word: εἰς σὸν ὄνομά
  choice: 归于你的名下
  rationale: 表达该处为神的名而分别、奉献的方向，较单说“为了你的名”更符合现代汉语。
- source_word: τῷ τῶν ἁπάντων ἀπροσδεεῖ
  choice: 你本不需要万有
  rationale: 将τῶν ἁπάντων理解为ἀπροσδεεῖ所支配的属格，即“不需要一切/万有”；不补入原文没有的“万有之神”。
- source_word: παρεδόξασας
  choice: 使这地方大得荣耀
  rationale: 保留加强形式所含的显著荣耀之意，并把希腊文语境中省略的宾语“这地方”明确出来。
- source_word: ἐν ἐπιφανείᾳ μεγαλοπρεπεῖ
  choice: 以威严的显现
  rationale: ἐπιφάνεια可指显现，甚至神圣显现；“威严”传达μεγαλοπρεπής的宏伟庄严，且保留方式或凭借关系。
- source_word: σύστασιν ποιησάμενος αὐτοῦ
  choice: 将它建立起来
  rationale: 该压缩结构可表示使其成立、建立或确立；此译法自然且不把所指过度限定为建筑或制度。
- source_word: πρὸς δόξαν τοῦ μεγάλου καὶ ἐντίμου ὀνόματός σου
  choice: 使你伟大而尊贵的名得荣耀
  rationale: 将πρός的目的意义化为自然汉语，同时保留“名”“伟大”“尊贵”和“荣耀”等核心词义。
theological_decisions:
- issue: τῷ τῶν ἁπάντων ἀπροσδεεῖ的句法与神学含义
  choice: 译为插入性称述：“你本不需要万有”
  alternative: 译为“你这万有之神，本不需要什么”，或把τῶν ἁπάντων理解为“不需要万物中的任何一样”
  rationale: 原文没有“神”一词，τῶν ἁπάντων最自然地可与ἀπροσδεεῖ连读，表示神不需要万有。正文保留这种自足性的称述，同时用脚注承认希腊文句法紧缩，避免无提示地解决全部歧义。
- issue: ἐν ἐπιφανείᾳ μεγαλοπρεπεῖ是否特指可见的神显现
  choice: 译为“以威严的显现”
  alternative: 译为“以壮丽的景象”或“借着辉煌的神显”
  rationale: “显现”保留其可能指神圣临现的意味，却不在正文中断定其必为某一次具体可见神显；脚注列出语义范围。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告语体。“君王啊”保留呼告；句中用破折号和分号安置难解的插入性短语，避免误把它与后文并列。正文不补入希腊文没有的“神”字，也不把“显现”强制解释为某一特定神显事件。
