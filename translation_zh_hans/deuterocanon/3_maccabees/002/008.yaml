    rationale: εἰς σὸν ὄνομά表达为神的名而奉献、归圣或以其名为目的，不是现代汉语“名下”所常指的隶属、所有或管辖关系。
  - severity: medium
    issue: “你本不需要万有”
    rationale: 汉语容易理解成神不需要“宇宙整体”，而非“不需任何事物”；同时该句的τῶν ἁπάντων究竟是补足“不需任何事物”，还是构成“万有之主／神”的称号，仍有句法争议，应由脚注保留。
  - severity: medium
    issue: “使这地方大得荣耀”
    rationale: “大得荣耀”不是自然的现代汉语。παρεδόξασας可自然译为“使……大有荣耀”或“使……极其荣耀”。
