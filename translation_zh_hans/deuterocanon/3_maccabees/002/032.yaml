base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/032.yaml
  text: But most of them[a], took courage with a noble spirit, did not abandon their piety by exchanging their possessions for life[b], but boldly counted themselves worthy to escape the registration lists.
translation:
  language: zh_hans
  text: 可是，他们中大多数人都怀着高尚的勇气刚强起来，没有背离虔敬；他们以财物换取活命[a]，并且毫无畏惧地认为自己配得从登记名册中脱身[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按原文分词结构译作：“没有因以财物换取活命而背离虔敬。”这两种译法都表明，他们以财物求取活命，却没有放弃虔敬。
    reason: 句法与词义备选
  - marker: b
    text: “登记名册”指上下文所说的官方登记记录；这些记录显然用于辨认犹太人，以执行国王的压迫措施。
    reason: 历史文化说明
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: 可是，他们中大多数人
  rationale: πλεῖστοι 在这里指这一群体中的绝大部分；δὲ 表示与前述少数人的做法相对照。
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: 怀着高尚的心志刚强起来
  rationale: 以方式状语表达的 γενναίᾳ ψυχῇ 指高尚勇毅的内在心志；ἐνίσχυσαν 表示在压力下变得刚强。
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: 没有背离虔敬
  rationale: διίστημι 与属格连用表示离开或背离；εὐσέβεια 在此犹太受迫害语境中指对上帝的敬虔忠诚。
- source_word: τὰ χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: 拿财物换取生路
  rationale: χρήματα 泛指钱财或产业；ἀντικαταλλάσσομαι 表示以一物换取另一物；περὶ τοῦ ζῇν 在此关乎保全性命。译文以“而是”显明他们舍弃的是财物而非虔敬。
- source_word: ἀδέως
  choice: 无所畏惧
  rationale: 该副词表示不惧怕、放胆行事；“无所畏惧”保留其鲜明力度。
- source_word: ἐτιμῶντο
  choice: 认为自己配得
  rationale: τιμάω 的中间语态在此带有自我评价、视为有价值或配得的意味；保留这种较不寻常的荣誉评价色彩，不简化为“认为能够”。
- source_word: ἑαυτοὺς ῥύσασθαι ἐκ τῶν ἀπογραφῶν
  choice: 使自己摆脱登记名册
  rationale: ῥύομαι 表示救出、解救或使脱离；ἀπογραφαί 是官方登记记录。反身代词表明他们设法使自己脱离这些名册。
theological_decisions:
- issue: 犹太人受逼迫语境中 εὐσέβεια 的译法
  choice: 虔敬
  alternative: 敬神／敬虔
  rationale: “虔敬”自然表达对上帝忠诚敬奉的宗教含义，同时不把本词限定为后期某一教派的专门术语。
- issue: 财物、性命与虔敬之间的关系
  choice: 没有背离虔敬，而是拿财物换取生路
  alternative: 没有因拿财物换取性命而背离虔敬
  rationale: 希腊语分词与前后分句的确切逻辑关系略显紧凑。正文采取符合语境的理解：他们宁可用财物谋求活路，也不以放弃虔敬换取性命；脚注保留另一种句法表达。
- issue: ἐτιμῶντο 的评价意味
  choice: 认为自己配得
  alternative: 认为自己能够／决意
  rationale: 选择保留 τιμάω 所含的尊重、估价意味，即使中文略显庄重；不把它无依据地化约成单纯能力或意志。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“高尚的心志”“刚强起来”“背离虔敬”保留原文的伦理和宗教语气；“拿财物换取生路”比逐字的“以财物交换生命”更自然。“认为自己配得使自己摆脱”刻意保留原文 τιμάω 的评价意味及反身结构，虽略显凝重，却避免消除原文张力。
