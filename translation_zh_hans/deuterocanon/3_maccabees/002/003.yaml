  text: You destroyed those in former times who practiced unrighteousness—among whom were giants[b][a], trusting in their strength and boldness—by bringing immeasurable water upon them.
translation:
  language: zh_hans
  text: 你毁灭了从前那些行不义的人——他们中间有巨人，倚仗自己的力量和胆量[a]——使无法计量的水[b]临到他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胆量”或译“胆大妄为”或“狂妄”；在此语境中，希腊词可能含有鲁莽自恃的贬义。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“无法计量的水”，这里指淹没一切的洪水。
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἔμπροσθεν
  choice: 从前那些人
  rationale: 这里的ἔμπροσθεν表示时间上的“从前”，不是空间上的“在前面”；此译自然地指向远古时代的人。
- source_word: ἀδικίαν ποιήσαντας
  choice: 行不义的人
  rationale: 直译为“做了不义之事的人”；“行不义”既保留道德含义，也符合庄重而通俗的中文表达。
- source_word: γίγαντες
  choice: 巨人
  rationale: 保留该词通常且直接的含义，不弱化为“勇士”，也不引入希腊神话中的“泰坦”。
- source_word: ῥώμῃ
  choice: 力量
  rationale: 准确表达体力、强力或威力，并与“倚仗”自然搭配。
- source_word: θράσει
  choice: 胆量
  rationale: 该词可指勇气、胆量，也可在负面语境中指狂妄或放肆；正文采用较中性的“胆量”以保留词义张力，负面可能性列入脚注。
- source_word: πεποιθότες
  choice: 倚仗
  rationale: 表达一种已经形成并持续的自恃或信赖；在本句负面语境中，“倚仗自己的”比单纯“相信”更自然。
- source_word: διέφθειρας
  choice: 毁灭了
  rationale: 表达上帝所施行的决定性毁灭，直接而庄重。
- source_word: ἐπαγαγὼν αὐτοῖς ἀμέτρητον ὕδωρ
  choice: 使无法计量的水临到他们
  rationale: 保留原文“水”而不直接改写成“洪水”，并以“使……临到”体现该分词短语所说明的毁灭方式。
theological_decisions:
- issue: 受审判者与远古洪水叙事的关系
  choice: 保留“巨人”和“无法计量的水”的原文措辞，仅在脚注指出洪水背景
  alternative: 将“巨人”泛化为“勇士”，或把“无法计量的水”直接译为“洪水”
  rationale: 本节显然唤起远古洪水审判，但希腊文明确说“巨人”和“无法计量的水”。正文不进一步与《创世记》的特定措辞调和，以免消除原文自身的表达特色与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。破折号保留插入说明的句法层次；“行不义”“临到”等表达维持祷告语境的肃穆感，同时避免过度古雅。
