  yaml_path: translation/deuterocanon/3_maccabees/002/029.yaml
  text: and that those who registered should also be branded on the body with the ivy-leaf emblem of Dionysus by fire[c][b][a], and should also be enrolled in his reduced status of authority.
translation:
  language: zh_hans
  text: 那些登记的人[a]，还要用火在身上烙上狄俄尼索斯的常春藤叶徽记[b]；还要把他们预先列入受限制的地位[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正在登记的人”或“被登记入册的人”。
    reason: lexical_alternative
  - marker: b
    text: “常春藤叶”是狄俄尼索斯的标志；这里指烙在身体上、表明与其崇拜相关的识别徽记。
    reason: cultural_note
  - marker: c
    text: 这句希腊文十分凝缩，含义不完全确定；也可理解为“受限制的公民身份”、“被削减的法律地位”或“受限制的权力／权限”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπογραφομένους
  choice: 登记的人
  rationale: 该中间或被动分词可指自行登记的人，也可指被登记、被编入名册的人；正文采用自然的行政用语“登记的人”，并以脚注保留语态上的歧义。
- source_word: χαράσσεσθαι … διὰ πυρὸς εἰς τὸ σῶμα
  choice: 用火在身上烙上
  rationale: χαράσσεσθαι 本可泛指刻印或作记号，但与“用火”及“在身上”连用，明确表示烙印；“烙上”准确而自然。
- source_word: παρασήμῳ Διονύσου κισσοφύλλῳ
  choice: 狄俄尼索斯的常春藤叶徽记
  rationale: παράσημον 表示辨识性的标记、徽号；κισσόφυλλον 是与狄俄尼索斯崇拜相关的常春藤叶。译作“徽记”既保留其识别功能，也传达宗教象征意义。
- source_word: προκαταχωρίσαι
  choice: 预先……列入
  rationale: 该动词表示预先登记、录入或归入某一类别；“预先把他们列入”保留前缀 προ- 的时间或次序意味及行政语境。
- source_word: προσυνεσταλμένην αὐθεντίαν
  choice: 权利受限的身份等级
  rationale: 该短语高度凝缩且语义不确定；συνεσταλμένην 有收缩、削减或限制之意，αὐθεντία 可涉及权力、权利、地位或资格。正文用“权利受限的身份等级”表达其社会法律层面的可能含义，同时由脚注说明其他译法。
theological_decisions:
- issue: 与狄俄尼索斯崇拜相关的强制烙印
  choice: 明确保留“狄俄尼索斯”及“常春藤叶徽记”
  alternative: 概括译为“异教的记号”或“宗教徽号”
  rationale: 希腊文明确点名狄俄尼索斯及其常春藤叶标志；保留这些细节才能准确呈现法令所强加的宗教身份，不应将其泛化。
- issue: προσυνεσταλμένην αὐθεντίαν 的行政法律含义
  choice: 正文译为“权利受限的身份等级”，脚注保留其他可能理解
  alternative: 受限制的公民身份；被削减的法律地位；受限的权力
  rationale: 原文并未清楚界定 αὐθεντία 在此究竟偏向权力、权利还是身份地位，因此不把某一种法律制度解释写死在正文中。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“烙上”直接呈现强制性的身体印记；分号保留原句从身体烙印转向行政归类的结构。所有不确定性均通过正文的克制措辞和脚注保留。
