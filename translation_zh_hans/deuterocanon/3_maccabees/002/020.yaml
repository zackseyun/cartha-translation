  yaml_path: translation/deuterocanon/3_maccabees/002/020.yaml
  text: There the God who watches over all[a], the holy ancestor among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness,
translation:
  language: zh_hans
  text: 在那里，那位监察万有的上帝和先祖——在众圣者中为圣的那一位[a]——垂听了合乎法度的祈求，便鞭打了那个满怀骄横和狂妄、极度自高的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在众圣者中为圣”也可理解为“在圣所中为圣”或“在圣物中为圣”；希腊文在此有歧义，可能含有礼仪性的意味。
    reason: 保留ἅγιος ἐν ἁγίοις在位格性与圣所／圣物性理解之间的真实歧义。
lexical_decisions:
- source_word: Ἐνταῦθα
  choice: 就在这时
  rationale: 该词既可指地点，也可标示叙事节点；结合此处上下文，用“就在这时”自然地表达事件在所述场景中随即发生，同时不把它处理成单纯的逻辑连接词。
- source_word: ἐπόπτης
  choice: 监察
  rationale: 表示察看、监管万有者。“监察万有”保留上帝俯察并看顾一切的含义，也比现代制度性较强的“监督者”更适合庄重叙事。
- source_word: προπάτωρ
  choice: 先祖
  rationale: 原词直指祖先或先祖。保留这一不寻常的称谓，不擅自改写成较熟悉但原文没有的“列祖的上帝”。
- source_word: ἅγιος ἐν ἁγίοις
  choice: 在众圣者中为圣的那一位
  rationale: 按修饰上帝的位格性描述来译，并保留“在……中”的结构；原短语也可能指在圣所或圣物中为圣，故另以脚注说明。
- source_word: εἰσακούσας
  choice: 垂听了
  rationale: 该动词在祷告语境中不只是听见，也含有应允性地听取之意；“垂听”符合现代中文宗教叙事的庄重语体。
- source_word: εὐθέσμου
  choice: 合乎法度的
  rationale: 表达符合律法、规矩或正当秩序，不仅是形式上的“有条理”。
- source_word: λιτανείας
  choice: 祈求
  rationale: 指恳切的祷告或请求；“祈求”通俗自然，也避免引入后世特定礼仪中“连祷”的含义。
- source_word: ἐμάστιξεν
  choice: 鞭打
  rationale: 保留原动词“用鞭抽打、严厉惩治”的鲜明形象，不弱化为笼统的“惩罚”。
- source_word: ὕβρει
  choice: 骄横
  rationale: 兼有傲慢、侮慢和越界欺凌的意味；“骄横”比单纯的“骄傲”更能体现其侵害性。
- source_word: θράσει
  choice: 狂妄
  rationale: 在此为贬义，表示放肆而无所顾忌的胆量；“狂妄”可与“骄横”并列而自然传达其负面色彩。
- source_word: ἐπηρμένον
  choice: 极度自高
  rationale: 原词有被抬高的形象，此处指因骄横狂妄而高抬自己；“极度”对应 μεγάλως。
theological_decisions:
- issue: 上帝的祖先性称谓
  choice: 直译为“上帝和先祖”
  alternative: 列祖的上帝；我们祖先的上帝
  rationale: 希腊文是 θεὸς καὶ προπάτωρ，以并列称谓直接称上帝为“上帝和先祖”，并非“列祖的上帝”这一较熟悉的固定表达。译文保留原文不寻常的神学措辞，避免用传统公式消解其张力。
- issue: ἅγιος ἐν ἁγίοις 的所指
  choice: 在众圣者中为圣的那一位
  alternative: 在圣所中为圣；在圣物中为圣
  rationale: 就近句法可将其理解为对上帝本身的描述，其中复数 ἁγίοις 可指圣者；但该词也可作中性并带有圣所或圣物的礼仪含义，因此不在正文中武断排除另一读法，而以脚注保存歧义。
- issue: 上帝“鞭打”人的描写
  choice: 保留具体形象“鞭打”
  alternative: 击打；惩罚
  rationale: 原文使用 ἐμάστιξεν，具有鲜明的鞭笞意象。即使语境中可能指上帝施加的严厉打击，也不宜将其神学性地淡化为抽象的“惩罚”。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。“垂听”“法度”“先祖”维持祷告叙事所需的尊严感；破折号标明“在众圣者中为圣的那一位”是对前述上帝和先祖的补充描述，避免读者误将其当作另一位并列对象。
