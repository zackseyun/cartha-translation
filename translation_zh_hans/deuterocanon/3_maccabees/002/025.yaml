lexical_decisions:
- source_word: Διακομισθεὶς
  choice: 被转送到埃及以后
  rationale: 保留不定过去时被动分词所表达的转移及先于主句背景的意义；“转送”不限定具体交通方式。
- source_word: τὰ τῆς κακίας ἐπαύξων
  choice: 使自己的恶行变本加厉
  rationale: ἐπαύξων表示持续加增；τὰ τῆς κακίας字面近于“邪恶之事”，译作“恶行”自然，并以“变本加厉”体现进一步加增。
- source_word: προαποδεδειγμένων
  choice: 前面提到的
  rationale: 明确其回指叙事中先前已经指出的那些人，不强加正式任命或指定之意。
- source_word: συνποτῶν
  choice: 酒友
  rationale: 简洁保留“一同饮酒的人”的宴饮含义，也符合此处负面的交游语境。
- source_word: ἑταίρων
  choice: 同党
  rationale: 在宫廷阴谋及道德败坏的语境中，比中性的“朋友”更能表达结伙相从，但不加入具体政治身份。
- source_word: τοῦ παντὸς δικαίου κεχωρισμένων
  choice: 已经与一切正道隔绝
  rationale: 以“已经……隔绝”体现完成时被动分词所表示的既成状态；“一切正道”保留παντὸς δικαίου可指一切正义或一切正确之事的综合性。
