base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/013.yaml
  text: But in our downfall this bold and profane man is attempting to insult the holy place on earth appointed by the name of your glory[a].
translation:
  language: zh_hans
  text: 但在我们败落之际，这个狂妄亵渎之人竟企图凌辱那因你荣耀之名而被指定的地上圣地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因你荣耀之名而被指定”也可译作“由你荣耀之名所显明”或“以你荣耀之名标明”。
    reason: ἀναδεδειγμένον可指“显明、宣示”或“指定”；其与格短语的确切关系可理解为凭借、关联或标记，正文采用“指定”，脚注保留其他可行译法。
lexical_decisions:
- source_word: καταπτώσει
  choice: 败落
  rationale: 该词本指倒下、崩落；此处描述群体陷入困厄、受挫的处境。“败落”保留沉重意味，又不把它过度解释为彻底毁灭。
- source_word: θρασὺς
  choice: 狂妄
  rationale: 该词在此带有放肆、无所顾忌的贬义。“狂妄”比中性的“大胆”更自然地传达其无礼冒犯。
- source_word: βέβηλος
  choice: 亵圣
  rationale: 该词指不敬神圣、践踏圣俗界限；“亵圣”与下文“圣的地方”形成鲜明对照。
- source_word: ἐπιτηδεύει
  choice: 竟企图
  rationale: 该动词与不定式连用，表示刻意从事或设法实施某事。“企图”表达有意行动；“竟”在不增添事实内容的前提下，体现祷告语境中的震惊与谴责。
- source_word: καθυβρίσαι
  choice: 凌辱
  rationale: 该词强化了傲慢侮慢、粗暴羞辱之意。“凌辱”既可用于对圣所的亵渎性侵犯，也比单纯“侮辱”更有力度。
- source_word: ἀναδεδειγμένον
  choice: 被显明为圣
  rationale: ἀναδείκνυμι可指公开显明、宣定或指定。结合ἅγιον及工具性与格短语，此译保留“显明”的公开启示色彩，同时使中文关系清楚；不把含义单独限定为行政性的“指定”。
- source_word: τῷ ὀνόματι τῆς δόξης σου
  choice: 因你荣耀之名
  rationale: 保留“名”与“荣耀”两个名词及原文压缩、庄严的表达；“因”可承载与格所含的凭借或关联意义，而不武断确定唯一语法关系。
- source_word: ἅγιον τόπον
  choice: 圣的地方
  rationale: 直译其一般性圣地称谓，避免用“至圣所”或特定殿室术语缩窄所指；上下文仍指向耶路撒冷圣殿。
theological_decisions:
- issue: 圣地所指的范围
  choice: 译作“地上……圣的地方”，指与上帝荣耀之名相联的耶路撒冷圣殿，但不限定为内殿某一部分
  alternative: 译作“地上的圣所”，或更具体地理解为内层圣所
  rationale: 原文使用一般性的ἅγιον τόπον，并非更专门的殿室术语；保持宽泛措辞可避免添加原文没有的空间限定。
- issue: ἀναδεδειγμένον与神名之间的关系
  choice: 译作“因你荣耀之名而被显明为圣”
  alternative: “由你荣耀之名所指定”或“以你荣耀之名标明”
  rationale: 分词兼有显明与指定的可能，与格也可表达凭借或关联。正文采用自然而较贴近“显明”义的译法，脚注保留“指定/标明”的可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而可读的祷告语体。“败落之际”“狂妄亵圣”“凌辱”保持原句强烈的哀诉与谴责；句法略作中文化重组，将ἅγιον与分词关系明确表达为“被显明为圣”，同时以脚注保存词义和语法歧义。
