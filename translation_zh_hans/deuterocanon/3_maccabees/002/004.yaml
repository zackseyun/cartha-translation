review_pass:
  verdict: revise
  source_fidelity: 译文正确呈现了祷告中对上帝的直接称呼、所多玛人的狂傲与恶行、火和硫磺的毁灭，以及将其作为后来者鉴戒的意义。惟“声名狼藉”将疑难的ἀδήλους明确处理为“恶名昭著”；这与英语审校轨迹所采纳的可能语境义相符，但原词通常的词义并不支持如此确定的表述，须使正文措辞较为中性，并由脚注明确保留传世文本的困难与可能存在的文本问题。
  naturalness: 原译整体庄重、通顺。“行事狂傲”“火和硫磺”“后来之人的鉴戒”均为自然的现代标准汉语。将几个修饰语置于“所多玛人”之前，可更清晰地反映希腊文中它们同作宾语定语的结构。
  terminology: “所多玛人”是恰当的地域居民称谓，不带入后世特定含义；“硫磺”准确对应θείῳ；“鉴戒”在惩罚性范例的语境中准确传达παράδειγμα的警示作用。
  issues:
  - severity: medium
    issue: 疑难词ἀδήλους的正文处理过于确定
    rationale: ἀδήλους通常意为“不显明、不可见、未知”，而上下文及常见译法却倾向要求“显眼、为人所知”的相反意思。原译“声名狼藉”不仅选择后一理解，也强化为固定的负面名声。宜改用较中性的“变得显眼”，并以脚注说明传世读法与语境义之间的张力。
  revised_text: 你用火和硫磺烧灭了那些行事狂傲、因恶行而变得显眼[a]的所多玛人，把他们立为后来之人的鉴戒。
  revised_footnotes:
  - marker: a
    text: 本短语的传世希腊文措辞紧缩且疑难。ἀδήλους通常意为“不显明、不可见的”，按字面可产生“因恶行而变得不显明”一类难解的意思；但在此上下文中，许多译法理解为“因恶行而变得显眼或为人所知”。正文采用后一较可能的语境义，同时保留此处读法的困难。
    reason: textual_and_lexical_difficulty
  revision_rationale: 修订不改变本节关于所多玛受火与硫磺毁灭并成为后人鉴戒的内容；仅将“声名狼藉”改为较中性的“变得显眼”，避免把疑难原文过度具体化，并扩充脚注以如实说明传世希腊文的词义张力。
