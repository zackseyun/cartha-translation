base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/004.yaml
  text: You burned up the Sodomites[a], who practiced arrogance and had become notorious for their evils, with fire and sulfur[b], setting them forth as an example for those who would come afterward.
translation:
  language: zh_hans
  text: 你用火和硫磺烧灭了所多玛人；他们行事狂傲，因种种恶行而声名狼藉[a]。你使他们成为后来之人的鉴戒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本短语的希腊文措辞紧缩而疑难，较直译可作“因恶行而变得明显（或显眼）”；但其中ἀδήλους通常意为“不明显的、不可见的”。正文依据上下文表达其较可能的意思。
    reason: textual_and_lexical_difficulty
lexical_decisions:
- source_word: ὑπερηφανίαν ἐργαζομένους
  choice: 行事狂傲
  rationale: 原文意为“施行／做出狂傲之事”。“行事狂傲”既保留持续行为的意味，也符合现代汉语表达。
- source_word: Σοδομίτας
  choice: 所多玛人
  rationale: 这是指所多玛的居民；译作“所多玛人”直接清楚，并避免引入后世某些语言中该称谓附带的特殊含义。
- source_word: ἀδήλους ταῖς κακίαις γενομένους
  choice: 因种种恶行而声名狼藉
  rationale: 传世希腊文措辞紧缩且疑难。ἀδήλους通常有“不明显、不可见”之意，但此处按上下文较可能描述他们因恶行而显露、为人所知；正文采用自然汉语表达可能的语境意义，并以脚注保留原文疑难。
- source_word: πυρὶ καὶ θείῳ
  choice: 用火和硫磺
  rationale: θείον指硫磺；“火和硫磺”准确、通俗，也保留对所多玛受审判传统的呼应。
- source_word: κατέφλεξας
  choice: 烧灭了
  rationale: 该动词含猛烈焚烧、烧毁之意。“烧灭”简洁地表达焚烧所造成的彻底毁灭。
- source_word: παράδειγμα
  choice: 鉴戒
  rationale: παράδειγμα本义为“例子、范例”，在惩罚语境中带有警示作用；“鉴戒”能自然传达这种负面示范意义。
- source_word: τοῖς ἐπιγινομένοις
  choice: 后来之人
  rationale: 该分词指随后出现或生于后世的人；“后来之人”保留其开放范围，不强行限定为某一代。
theological_decisions:
- issue: 如何表述所多玛受毁灭的原因而不加入后世的教义解释
  choice: 仅按本节明说的内容，描述他们狂傲并有种种恶行
  alternative: 用后世特定的性伦理含义解释“所多玛人”，或具体扩展本节没有列出的罪行
  rationale: 本节明确强调的是狂傲和恶行，并未具体界定那些恶行；译文不加入原文未说出的解释。
- issue: 如何处理火与硫磺的审判意象
  choice: 火和硫磺
  alternative: 采用更具传统宗教色彩的固定套语
  rationale: “火和硫磺”是原词的直接现代汉语对应，既清楚易懂，也不削弱审判意象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“你”延续祷告中对上帝的直接称呼；用“所多玛人”作历史地域称谓，不承载后世附加含义。分号和分句安排使较长的希腊句在中文中清晰易读。
