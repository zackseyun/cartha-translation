  yaml_path: translation/deuterocanon/3_maccabees/002/030.yaml
  text: 'But so that he might not appear hateful to everyone[a], he added in writing: “But if some of them choose to live among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: zh_hans
  text: 但为了免得显得自己为众人所憎恶，他又写明：“他们中若有人选择与那些受过祭仪入门礼的人交往，他就使这些人与亚历山大人享有同等公民权。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受过祭仪入门礼的人”也可译作“受过秘仪入门礼的人”或“秘仪入门者”。希腊文使用宗教祭仪中的入门用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεχθόμενος
  choice: 人人都厌恶他
  rationale: 该中间／被动分词与 φαίνηται 连用，重点是他在众人眼中成为可憎、遭人厌恶的对象；译为“人人都厌恶他”比“显得可恨”更符合现代汉语表达。
- source_word: ὑπέγραψεν
  choice: 又写明
  rationale: 在诏令语境中表示以书面补加条款；“又写明”自然地传达附加书面规定的意思。
- source_word: προαιρῶνται
  choice: 选择
  rationale: 保留该词所表达的主动、审慎选择，不弱化为单纯愿望。
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: 与那些按仪式受过入教礼的人
  rationale: μεμυημένοι 明确是宗教仪式中的入教／入秘语言；“按仪式受过入教礼”保留其祭仪性质，同时避免径直指定某一种秘仪宗教。
- source_word: ἀναστρέφεσθαι
  choice: 来往
  rationale: 在 ἐν 加群体的结构中，可指置身其间、与之交往或按其群体方式生活；“来往”在本句中自然，并保留社会与宗教结交的含义。
- source_word: ἰσοπολίτας
  choice: 享有同等公民权
  rationale: 该词强调法律和政治地位上的平等；汉语用“享有同等公民权”比直译“同等公民”更清楚。
- source_word: Ἀλεξανδρεῦσι
  choice: 亚历山大人
  rationale: 保留地名居民称谓；此处与 ἰσοπολίτας 搭配，表示其公民地位与亚历山大人相等。
- source_word: ποιεῖ
  choice: 使
  rationale: 保留引述诏令中的现在时法律效力，以简洁的“使……享有”表达授予身份。
theological_decisions:
- issue: 希腊化犹太叙事中的祭仪入教语言
  choice: 按仪式受过入教礼
  alternative: 受过秘仪的人／参加仪式的人
  rationale: τελεταί 与 μεμυημένοι 共同构成明确的宗教入教表达。“受过入教礼”保留这一力度，而不把它淡化成仅仅“参加仪式”；加脚注说明也可译作“秘仪”，以保留其可能的技术含义。
- issue: ἀναστρέφεσθαι 所指范围
  choice: 来往
  alternative: 生活在……中间／与……相处
  rationale: 原词可能涵盖交往、生活方式和群体归属；正文采用自然的“来往”，但不把它限定为居住。
translation_notes:
  register: 采用现代、庄重而易懂的诏令叙事语体。引语保留条款式结构；“公民权”明确呈现法律政治含义。脚注标记置于整句引文之后，并在脚注中交代祭仪术语的另一种译法。
