base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/001.yaml
  text: Lord[a], Lord, king of the heavens and master of all creation, holy among the holy ones, sole ruler, Almighty[b], pay attention to us who are being oppressed by an unholy and profane man, swollen with arrogance and strength.
translation:
  language: zh_hans
  text: 主啊，主啊，诸天之王、一切受造之物的主宰，在众圣者中为圣的[a]，独一的统治者，全能者，求你垂顾我们！我们正受一个不虔、亵渎之人[b]的压迫；他恃狂妄和力量而膨胀自大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在众圣者里面为圣的。”希腊语表达简洁而带有礼仪色彩；这里的介词既可自然理解为“在……中”，也可较直译为“在……里面”。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文没有明说“人”，而是以单数形式描述一个不虔、亵渎且膨胀自大的个体；正文补出“人”，使汉语清楚自然。
    reason: supplied_word
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在此为呼格，用作对上帝的称呼；“主啊”既保留神圣称号，也符合现代汉语祷告语体。
- source_word: βασιλεῦ τῶν οὐρανῶν
  choice: 诸天之王
  rationale: 保留希腊文“诸天”的复数，同时用简洁庄重的汉语表达王权称号。
- source_word: δέσποτα πάσης τῆς κτίσεως
  choice: 万有受造物的主宰
  rationale: δέσποτα强调绝对权柄；“主宰”与前面的“主”有所区别。“万有受造物”明确κτίσις在此所指的受造界。
- source_word: ἅγιε ἐν ἁγίοις
  choice: 在众圣者中为圣的
  rationale: ἐν可按群体范围理解为“在……中”；译文保留原语紧凑而礼仪化的称颂，并以脚注注明较直译的可能。
- source_word: μόναρχε
  choice: 独一的统治者
  rationale: 突出μόναρχος所表达的唯一、独有统治权，避免“君主”可能带来的世俗政体联想。
- source_word: παντοκράτωρ
  choice: 全能者
  rationale: 这是庄重、清楚且已有广泛认知的神圣称号，也能传达掌有一切权能之意。
- source_word: πρόσχες ἡμῖν
  choice: 求你垂顾我们
  rationale: πρόσχες是请求留意、关注的命令式；“垂顾”适合向上帝祈求的庄重语体，又不至于古奥。
- source_word: καταπονουμένοις
  choice: 正受……压迫
  rationale: 该分词表示在重压下受苦；上下文涉及敌对迫害，“受压迫”比泛指的“受苦”更具体。
- source_word: ἀνοσίου καὶ βεβήλου
  choice: 不虔不洁
  rationale: 分别表达违背神圣秩序与亵渎、世俗不洁的意味；并列译出，避免把两个形容词合并为一个概念。
- source_word: θράσει καὶ σθένει πεφρυασμένου
  choice: 因狂妄和强力而膨胀自大
  rationale: θράσος在此是负面的狂妄放肆，σθένος是强力；“膨胀自大”保留πεφρυασμένου含有的鼓胀、自高意象和敌对语气。
theological_decisions:
- issue: 连续神圣称号的处理
  choice: 分别译作“主、诸天之王、主宰、在众圣者中为圣的、独一的统治者、全能者”
  alternative: 合并或统一为较少的称号
  rationale: 原文有意层叠不同称号，形成祷告的修辞力度，并从王权、创造主权、圣洁、独一统治和全能等方面称颂上帝；逐项保留可避免抹平这些张力。
- issue: ἅγιε ἐν ἁγίοις中ἐν的关系
  choice: 译为“在众圣者中为圣的”
  alternative: 译为“在众圣者里面为圣的”
  rationale: 前者在现代汉语中自然地表达“在……之中”的范围关系；后者更贴近介词的表层形式，但可能被理解为上帝内住于圣者。原文的紧凑性及可能歧义以脚注保留。
- issue: 敌对者的性别与身份
  choice: 补出“人”，但不补出男性性别
  alternative: 译成“那个不虔不洁者”而不补名词，或译成“男人”
  rationale: 希腊文没有明说“人”，但单数属格形容词和分词指向一个敌对个体；汉语补“人”较清楚。“男人”会加入原文未明示的性别信息。
translation_notes:
  register: 采用现代、庄重的祷告语体。开头重复“主啊”以保留原文呼求的力度；称号逐项展开，不作教派化解释。句末将祈求与受压迫者的描述分开，使长句在现代汉语中清晰，同时保持原文紧迫而崇高的语气。
