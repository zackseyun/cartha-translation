base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/011.yaml
  text: For even when our fathers were often afflicted[b][a], you helped them in their humiliation and rescued them from great evils.
translation:
  language: zh_hans
  text: 因为我们的列祖[a]屡遭苦难时，你曾在他们卑微的处境中帮助他们，救他们脱离大灾祸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我们的祖先”。希腊文直译为“我们的父辈”。
    reason: lexical_alternative
  - marker: b
    text: 或译“大祸患”或“大患难”。这里的希腊词可指严重的灾难与伤害，并非只指道德上的恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: 因为
  rationale: 此处在祷告中引出支持前述祈求的理由；“因为”自然保留其解释性连接作用。
- source_word: πλεονάκις
  choice: 屡次
  rationale: 表达多次、反复发生，语体庄重而不生硬。
- source_word: θλιβέντων
  choice: 受苦
  rationale: 该被动分词表示遭受压力、困苦或患难；“受苦”保持所指宽泛，不限定苦难的具体形式。
- source_word: τῶν πατέρων ἡμῶν
  choice: 我们的列祖
  rationale: 既保留 πατέρων 的男性祖辈表达，又符合现代中文圣经与历史祷告语境中的庄重用法。
- source_word: ἐβοήθησας αὐτοῖς
  choice: 帮助他们
  rationale: 直接表达帮助、援助之意，清楚自然。
- source_word: ἐν τῇ ταπεινώσει
  choice: 在他们受屈辱的境地
  rationale: ταπείνωσις 可指被降卑、受辱或处于卑微境地；此译与前面的“受苦”有所区分，并保留被压低的含义。
- source_word: ἐρρύσω
  choice: 救他们脱离
  rationale: ῥύομαι 表示从危险或困境中搭救、解救；“救……脱离”贴合其与 ἐκ 构成的结构。
- source_word: ἐκ μεγάλων κακῶν
  choice: 脱离大灾祸
  rationale: κακά 在此历史性拯救语境中主要指严重的灾难、祸患，而不只指道德上的恶；“大灾祸”在中文中准确且自然。
theological_decisions:
- issue: 祖辈称谓中的性别表达
  choice: 我们的列祖
  alternative: 我们的祖先
  rationale: 希腊文使用 πατέρων（父辈、列祖），主文保留其男性祖辈措辞；脚注说明可作较中性的理解。
- issue: 历史性拯救语境中 κακῶν 的含义
  choice: 大灾祸
  alternative: 大祸患；大患难；大恶
  rationale: 该词可指恶事、伤害、灾难或祸患；此处描述列祖从严重困境中获救，故不将其狭义化为道德邪恶，同时以脚注保留词义幅度。
- issue: ταπείνωσις 所表达的降卑状态
  choice: 受屈辱的境地
  alternative: 卑微的处境；受压低的时候；苦境
  rationale: 译文保留被降卑、受辱的意味，又避免与 θλιβέντων 的“受苦”完全重合。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“列祖”符合历史回顾的经文语境；“受屈辱的境地”保留原文的降卑意味，并与“受苦”区分。
