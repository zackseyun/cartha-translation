  yaml_path: translation/deuterocanon/3_maccabees/002/017.yaml
  text: We trampled the house of holiness[b][a], just as the houses of the people of Jerusalem are trampled.
translation:
  language: zh_hans
  text: 我们践踏了圣洁之殿[a]，正如耶路撒冷居民[b]的房屋被践踏一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“圣洁之屋”；也可译作“分别为圣的殿”或“奉献为圣的殿”。这里指圣殿。
    reason: 说明οἶκος τοῦ ἁγιασμοῦ的字面结构、语义范围及语境所指。
  - marker: b
    text: 即住在耶路撒冷的人。
    reason: 说明希腊文居民称谓的含义。
lexical_decisions:
- source_word: κατεπατήσαμεν / καταπατοῦνται
  choice: 践踏了 / 遭人践踏
  rationale: 前后采用同一词根“践踏”，保留希腊文主动与被动的对应及其修辞重复；“遭人”自然表达被动语态，却不补出具体施事者。
- source_word: τὸν οἶκον
  choice: 殿
  rationale: οἶκος本义为“房屋”，但此处由“圣洁”限定，所指为圣殿；译作“殿”既符合中文语境，又与后文普通“房屋”保持可辨的对应。
- source_word: τοῦ ἁγιασμοῦ
  choice: 圣洁之
  rationale: ἁγιασμός可指圣洁、分别为圣或奉献为圣。译作“圣洁之”保留抽象名词的色彩，并避免在正文中把意义单一限定为“成圣”过程。
- source_word: ὡς
  choice: 正如……一样
  rationale: 明确呈现比较关系，符合现代汉语习惯。
- source_word: οἱ οἶκοι
  choice: 房屋
  rationale: 按οἶκος复数的通常意义直译，指居民的住宅。
- source_word: τῶν προσολυμίων
  choice: 耶路撒冷居民
  rationale: 该称谓指耶路撒冷的居民，而非城市本身；此译比音译式族称更自然清楚。
theological_decisions:
- issue: 首个οἶκος应直译为“房屋”还是按语境译为圣殿
  choice: 圣洁之殿
  alternative: 圣洁之家；分别为圣的房屋；圣殿
  rationale: 希腊文用“房屋”加属格说明其神圣性质，语境所指显然是圣殿。正文用“殿”使普通读者易懂，脚注保留原文结构及其他可能译法，不额外引入宗派性解释。
- issue: ἁγιασμός在圣殿语境中的含义
  choice: 圣洁
  alternative: 分别为圣；奉献为圣；成圣
  rationale: 该词兼有圣洁状态与分别、奉献为圣的意味。“圣洁”在中文中较自然，同时仍保留神圣属性；脚注说明其较直译的结构与语义范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“圣洁之殿”略带书面色彩，以保留原文不寻常的属格表达；后半句用“遭人践踏”自然呈现被动，并保持前后“践踏”的重复。
