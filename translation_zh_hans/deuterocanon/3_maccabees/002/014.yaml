  text: For your dwelling place is the heaven of heaven, unreachable by men.
translation:
  language: zh_hans
  text: 因为你的居所是人所不能企及的天上之天[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“诸天之天”或“最高的天”。希腊文保留了一种闪语式表达，指至高的天。
    reason: 说明原文习语及可成立的译法。
lexical_decisions:
- source_word: κατοικητήριόν
  choice: 居所
  rationale: 该词指居住之处；“居所”简洁、庄重，并保留具体的地点含义。
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: 天上之天
  rationale: 保留希腊文所反映的闪语式最高级表达及其经文语感；此处单数属格形式不宜在正文中直接解释成“最高的天”。
- source_word: ἀνέφικτος
  choice: 不能企及
  rationale: 表达无法达到、无法触及之意；与“人所”组合自然，并保留上帝居所超越人类可达范围的含义。
- source_word: ἀνθρώποις
  choice: 人
  rationale: 这里泛指全体人类，并非专指男性；现代汉语用“人”准确而自然。
theological_decisions:
- issue: 闪语式最高级 οὐρανὸς τοῦ οὐρανοῦ 的译法
  choice: 天上之天
  alternative: 诸天之天；最高的天
  rationale: “天上之天”既贴近本节希腊文的单数结构，又保留其超越性与经文互文色彩，不在正文中把它完全化解为解释性说法。
- issue: ἀνέφικτος 与 ἀνθρώποις 的关系
  choice: 人所不能企及的
  alternative: 人无法进入的；人不能达到的
  rationale: 希腊文表示该居所对人而言不可达到；所选译法保留空间性，也不额外断定这种不可及性的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“天上之天”略带经文语体，以保留原文习语；全句维持祷告语境中的尊称和超越意味。
