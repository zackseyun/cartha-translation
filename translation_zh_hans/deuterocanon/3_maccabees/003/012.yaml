  yaml_path: translation/deuterocanon/3_maccabees/003/012.yaml
  text: 'King Ptolemy Philopator to the generals and soldiers throughout Egypt and in every place: greetings and good health[a].'
translation:
  language: zh_hans
  text: 托勒密·菲洛帕托王致在埃及和各地的将领及士兵：问安，祝安康[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各地”或可译作“各辖区”或“分处各地”。希腊语 κατὰ τόπον 是较为习惯化的说法，可能指当地驻地，也可能指不同地区。
    reason: 保留该短语在地点分布、军事驻地和行政辖区之间的词义歧义。
lexical_decisions:
- source_word: Βασιλεὺς
  choice: 王
  rationale: 在书信开头作为君王头衔，置于姓名之后符合现代汉语称谓习惯。
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: 托勒密·菲洛帕托
  rationale: 按希腊语人名及称号音译，不把称号解释性翻译，以免加入原文未明说的含义。
- source_word: τοῖς ... στρατηγοῖς
  choice: 将领
  rationale: στρατηγός在此指军事统帅或高级军官；“将领”准确而自然。
- source_word: καὶ στρατιώταις
  choice: 和士兵
  rationale: 保留具体受信对象，不抽象译作“军队”。
- source_word: τοῖς κατʼ Αἴγυπτον
  choice: 遍布埃及
  rationale: κατά与地域名连用在此表达分布范围；“遍布埃及”比单纯“在埃及”更能体现其广泛地域指向。
- source_word: καὶ κατὰ τόπον
  choice: 并驻在各地
  rationale: κατὰ τόπον带有按地点分布的习惯性含义；结合军事受信人译为“驻在各地”自然，但“各辖区”等行政性理解仍具可能，故加脚注保留歧义。
- source_word: χαίρειν
  choice: 向你们问安
  rationale: 这是希腊书信开头的惯用问候语；用现代汉语书信表达其语用功能。
- source_word: καὶ ἐρρῶσθαι
  choice: 愿你们康健
  rationale: 原文是祝愿对方强健安好的书信套语；“愿你们康健”既保留祝愿语气，也自然庄重。
theological_decisions: []
translation_notes:
  register: 采用正式王室公函的语气，同时使用普通现代读者易懂的表达。“向你们问安，愿你们康健”保留了希腊语书信起首中问候与健康祝愿两个并列成分。
