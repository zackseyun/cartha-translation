base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/011.yaml
  text: 'So then[a], puffed up by his present prosperity, and not perceiving the power of the greatest God, but supposing that he would continue forever in the same purpose, he wrote this letter against them:'
translation:
  language: zh_hans
  text: 于是，他因眼前的顺境而骄傲自大，没有察觉至大的上帝[a]的大能，反以为自己会一直坚持同样的意图，便写下了以下这封针对他们的信：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“至高的上帝。”希腊文直译为“至大的上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐημερίᾳ
  choice: 顺境
  rationale: 指当前诸事顺遂、处境有利；“顺境”自然简洁，也不把含义局限于物质富足。
- source_word: γεγαυρωμένος
  choice: 骄傲自大
  rationale: 表达因成功而膨胀、傲慢的状态，以现代汉语传达原词所含的自高意味。
- source_word: οὐ καθορῶν
  choice: 看不见
  rationale: 保留“看”的意象，同时在语境中自然包含未能认识、洞察之意。
- source_word: κράτος
  choice: 权能
  rationale: 兼顾力量与施行统治、彰显威力的意味，适用于此处论及上帝。
- source_word: τοῦ μεγίστου θεοῦ
  choice: 至大的上帝
  rationale: 直接反映 μέγιστος 的最高级含义，而不改写为源文并未使用的固定称号“至高的上帝”。
- source_word: ὑπολαμβάνων
  choice: 以为
  rationale: 自然表达他主观而错误的判断。
- source_word: διηνεκῶς
  choice: 一直
  rationale: 此处表示持续不断、长久维持，并非抽象的永恒；“一直”符合现代汉语。
- source_word: ἐν τῇ αὐτῇ διαμένειν βουλῇ
  choice: 坚持同样的意图
  rationale: βουλή 在此指意图、打算；διαμένειν 表示持续不改，译为“坚持”简洁自然。
- source_word: ἔγραφεν
  choice: 便写了
  rationale: 以汉语叙事中的完成表达引出下文书信内容。
- source_word: κατʼ αὐτῶν
  choice: 来攻击他们
  rationale: 根据敌对语境，将 κατά 加属格的针对、敌对含义明确译出；这里指借书信采取敌对行动。
- source_word: ἐπιστολὴν τήνδε
  choice: 以下这封信
  rationale: 明确体现指向紧随其后的书信正文，符合汉语篇章习惯。
theological_decisions:
- issue: τοῦ μεγίστου θεοῦ 的译法
  choice: 至大的上帝
  alternative: 至高的上帝；至尊的上帝
  rationale: 希腊文直译为“最大的／至大的上帝”。采用“至大的上帝”既保留原文最高级措辞，也避免无依据地与较熟悉的固定称号“至高的上帝”同一化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“骄傲自大”传达因顺境而膨胀的语气；“以下这封信”清楚引出后文。脚注保留“至高的上帝”这一可能的惯用译法，同时正文忠实呈现希腊文 μέγιστος。
