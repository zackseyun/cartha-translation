revisions:
- from: 于是，他因眼前的顺境而骄傲自大，又看不见至大上帝[a]的权能，反以为自己会一直坚持同样的意图，便写了以下这封信来攻击他们：
  to: 于是，他因眼前的顺境而骄傲自大，没有察觉至大的上帝[a]的大能，反以为自己会一直坚持同样的意图，便写下了以下这封针对他们的信：
  rationale: 修订仅收窄“攻击”这一较具体的表达为“针对”，以对应κατʼ αὐτῶν的敌对指向；并以“没有察觉……的大能”更自然地传达οὐ καθορῶν τὸ ... κράτος。其余措辞保留原译的句法推进、庄重语体和对“至大的上帝”的字面忠实。
