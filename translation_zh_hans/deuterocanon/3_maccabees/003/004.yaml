  rationale: 修订以希腊文为准，保留τούτων的复数所属“他们的律法”，不采纳英文审计轨迹中“他的律法”的改写。后半句不将ἔνιοι预先判定为“他们中有些人”或“有些旁人”，并避免补出饮食区隔的对象，从而保留原文在指称和关系上的简略性。
