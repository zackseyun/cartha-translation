  yaml_path: translation/deuterocanon/3_maccabees/003/004.yaml
  text: But because they worshiped God and lived according to his law, they kept themselves separate in matters of food; for this reason some regarded them as hateful.
translation:
  language: zh_hans
  text: 但他们敬奉上帝，按他们的律法生活，并在饮食方面保持分别；因此，有些人显得令人憎恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεβόμενοι
  choice: 敬畏
  rationale: 该词可指敬奉、崇敬；“敬畏上帝”既保留宗教敬虔含义，也符合庄重自然的现代汉语。
- source_word: τῷ τούτων νόμῳ πολιτευόμενοι
  choice: 遵照他们的律法生活
  rationale: πολιτεύομαι在此指按某种规范安排生活、行事；τούτων是复数属格，直译为“他们的”，不改作希腊原文并未明说的“他的”。
- source_word: χωρισμὸν ἐποίουν ἐπὶ τῷ κατὰ τὰς τροφάς
  choice: 在饮食方面与人分别
  rationale: 保留因饮食规定而实行区隔的意思，同时避免笨拙地直译为“制造分别”。
- source_word: ἀπεχθεῖς ἐφαίνοντο
  choice: 显得令人憎恶
  rationale: ἐφαίνοντο表示“显得、看来”，ἀπεχθεῖς表示可憎、招人厌恶；译文保留这是他人观感而非客观定性的语气。
theological_decisions:
- issue: 律法的所属者
  choice: 他们的律法
  alternative: 他的律法／上帝的律法
  rationale: 所给Swete希腊文本作τούτων，为复数“他们的／这些人的”；虽然上下文可将该律法理解为与敬奉上帝相关，但译文不越过原文语法直接改成“上帝的律法”。
- issue: ἔνιοι的句法身份
  choice: 他们中有些人显得令人憎恶
  alternative: 有些人认为他们可憎
  rationale: ἔνιοι是主格，最自然地作ἐφαίνοντο的主语，即“有些人显得”；若译作“有些人认为他们”，需把ἔνιοι当作判断者，但希腊文通常应使用与格表达“在某些人看来”。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体；“与人分别”表达群体在饮食实践上的区隔，不额外加入洁净礼仪或族群动机等原文未明说的信息。
