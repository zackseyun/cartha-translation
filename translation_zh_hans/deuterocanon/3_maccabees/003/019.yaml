  yaml_path: translation/deuterocanon/3_maccabees/003/019.yaml
  text: And by making their hostility toward us plain, they, alone among the nations, act arrogantly toward kings and toward their own benefactors, and are willing to offer nothing sincere.
translation:
  language: zh_hans
  text: 他们这样显明了对我们的敌意：在各民族中，唯独他们傲慢地对待君王和自己的恩人，不愿拿出半点真诚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυσμένειαν
  choice: 敌意
  rationale: 准确表达针对“我们”的敌对态度，符合现代汉语公文式控诉语境。
- source_word: ἔκδηλον καθιστάντες
  choice: 显明了
  rationale: 保留“使之明显、公开显露”的使动含义，同时避免生硬直译。
- source_word: μονώτατοι τῶν ἐθνῶν
  choice: 在各民族中，唯独他们
  rationale: 保留最高程度形式所强调的排他性，即控诉他们是各民族中独有的例外。
- source_word: ὑψαυχνοῦντες
  choice: 傲慢地对待
  rationale: 该词字面带有“昂着颈项”的高傲意象；此处以自然汉语传达其傲慢不逊之意。
- source_word: γνήσιον
  choice: 真诚
  rationale: 在对君王和恩人的态度语境中，指真实无伪的诚意；“真诚”比“正统”或“亲生”更符合此处语义。
- source_word: φέρειν
  choice: 拿出
  rationale: 保留“带来、呈上、付出”的宽泛表达，与“半点真诚”搭配自然，且不将其过度限定为礼物、贡物或具体行为。
