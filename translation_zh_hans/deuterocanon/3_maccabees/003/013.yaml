translation:
  language: zh_hans
  text: 我本人也安好[a]，我们的事务也顺利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我本人安好，我们的情况也很好。”希腊文以表示“安好”的惯用说法，同时描述说话者和“我们的事务”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρρωμαι
  choice: 安好
  rationale: 这是ῥώννυμι的完成时中被动态形式，在书信问候语境中惯用来表示身体或总体状况良好；“安好”自然、庄重，并适合发信者自述近况。
- source_word: δὲ
  choice: （不单独译出）
  rationale: 此处δέ是轻微的承接词，并无明显转折；汉语借句序即可自然表达衔接，若硬译为“但是”会夸大对比。
- source_word: καὶ αὐτὸς ἐγὼ
  choice: 我本人
  rationale: αὐτός与ἐγώ连用带有强调意味；“我本人”保留这种明确的自指强调。καί在结构上也可能表示“也”，相关歧义在脚注中说明。
- source_word: τὰ πράγματα ἡμῶν
  choice: 我们的事务
  rationale: πράγματα可指事务、情势或整体处境；“我们的事务”保留其宽泛含义，避免过度限定为政治、商业或私人事务。
- source_word: ἔρρωμαι（与τὰ πράγματα ἡμῶν的搭配）
  choice: 都顺利
  rationale: 希腊文以同一“良好、强健”观念兼述发信者和其事务；汉语不能自然地说事务“安好”，故按对象转换为“顺利”，同时保留总体情况良好的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书信语体。“安好”适合个人近况，“事务也都顺利”则以自然汉语表达同一谓语观念用于事务时的含义。脚注保留καί可能表示“也”以及πράγματα可译作“情况”的空间。
