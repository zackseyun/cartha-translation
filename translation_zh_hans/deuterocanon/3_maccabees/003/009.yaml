  source_fidelity: 正文准确反映希腊文的主要成分：γάρ译为“因为”；οὕτω τηλικοῦτο表达为“如此庞大”；σύστημα以“群体”处理并通过脚注保留“整体／团体／体系”的可能性；μηδὲν ἠγνοηκός译为“无所不知”，保留“没有任何事不知”的全面知悉含义；μὴ ... παροραθήσεσθαι译为“绝不可被忽视”，保留否定、被动及劝诫性的语气。虽然“庞大”较侧重规模，而τηλικοῦτος也可泛指“如此重大”，但在此处不构成不安全的限义。
