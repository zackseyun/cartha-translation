  text: For so great an organization[a], lacking no knowledge, must not be overlooked.
translation:
  language: zh_hans
  text: 因为，如此庞大而无所不知的群体[a]，绝不可被忽视。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “群体”也可译作“整体”“团体”或“体系”。本句较直译为：“因为，如此庞大的一个整体，没有什么不知道的，不可被忽视。”
    reason: 保留σύστημα的宽泛词义，并显明μηδὲν ἠγνοηκός较直译的表达。
lexical_decisions:
- source_word: μὴ ... παροραθήσεσθαι
  choice: 绝不可被忽视
  rationale: παροράω可指忽略、漠视；未来被动不定式配合μή表达强烈否定。“绝不可被忽视”保留被动形式和修辞力度，也避免与ἠγνοηκός使用同一中文词根。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ承接上文，说明前述论断的理由；“因为”自然保留其解释性连接作用。
- source_word: οὕτω τηλικοῦτο
  choice: 如此庞大
  rationale: οὕτω与τηλικοῦτο合用，加强程度和规模。“如此庞大”既传达强调，也不擅自限定为人数、地理范围或政治重要性。
- source_word: σύστημα
  choice: 群体
  rationale: σύστημα可指结合而成的整体、团体或体系。此处用“群体”可自然指规模庞大的共同体，同时避免现代官僚机构色彩过强的“组织”；其较宽的词义范围在脚注中保留。
- source_word: μηδὲν ἠγνοηκός
  choice: 无所不知
  rationale: ἀγνοέω的完成时主动分词字面表示“没有不知道任何事”。“无所不知”简洁保留其全面知悉之意；不将其改释为“没有疏忽任何事”，以免消除原文在‘不知’与‘遗漏’之间可能存在的语义张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“如此庞大”保留原文的强调；“绝不可”体现μή与未来被动不定式的强烈语气。脚注标记[a]已置于正文对应词后。
