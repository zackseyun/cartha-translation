base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/017.yaml
  text: But although they accepted our presence in word[a], in deed they were false, when we eagerly desired to enter into their temple and honor it with the most splendid and finest offerings[b],
translation:
  language: zh_hans
  text: 可是，他们口头上虽接受我们到访，实际却虚伪行事；当我们热切希望进入他们的圣殿，用华美、至为精美的奉献礼物[b]尊荣它时，
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “奉献礼物”所译的希腊词，也可指献在圣殿中的奉献物或还愿礼物。
    reason: 补充ἀναθήματα在圣殿文化背景中的含义。
lexical_decisions:
- source_word: λόγῳ μὲν ... τῷ δὲ πράγματι
  choice: 口头上……实际所行
  rationale: 保留希腊文言语与实际行为之间鲜明的对照，同时采用现代汉语自然表达。
- source_word: ἀποδεξάμενοι
  choice: 接受
  rationale: 表达接纳君王亲临之意，又不加入“欢迎”可能暗示的热情态度。
- source_word: παρουσίαν
  choice: 亲临
  rationale: 此处指君王本人到场或莅临；“亲临”兼顾身份语境与现代汉语可读性。
- source_word: νόθως
  choice: 是虚假的
  rationale: 保留该词所含的不真、不纯正之强烈意味，不将其弱化为仅仅“不真诚”。
- source_word: προθυμηθέντων ἡμῶν
  choice: 当我们热切想要
  rationale: 体现说话者积极而热切的意愿，并保留属格绝对结构所交代的情境。
- source_word: εἰσελθεῖν εἰς τὸν ναὸν αὐτῶν
  choice: 进入他们的圣殿
  rationale: 准确呈现进入的方向及“他们的”这一局外人视角；ναός在此历史宗教语境中译作“圣殿”。
- source_word: τοῖς ἐκπρεπέσιν καὶ καλλίστοις ἀναθήμασιν
  choice: 用极其辉煌、极其精美的奉献礼物
  rationale: 以两个并列的强化表达对应原文形容词，并将ἀναθήματα明确呈现为献在圣殿中的奉献之物。
- source_word: τιμῆσαι
  choice: 尊荣它
  rationale: 直接表达以奉献礼物向圣殿表示尊荣的目的；“它”承接“圣殿”。
theological_decisions:
- issue: 说话者企图进入圣殿并献礼之陈述应如何呈现
  choice: 按说话者自称的意图直译为进入圣殿、以奉献礼物尊荣它
  alternative: 译作“在他们的圣殿中献上还愿礼，表示敬意”
  rationale: 这是叙事中人物对自身行为的陈述；译文既不认可其行为，也不以解释性措辞淡化其中的宗教张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“亲临”体现君王口吻，“圣殿”符合犹太圣所语境；保留本节作为长句中未完分句的末尾逗号。
