  source_fidelity: 需作小幅修订。“亲临”用于“接受我们亲临”在现代汉语中搭配不自然，且易使动作施事不清；改为“接受我们到访”更准确地表达 παρουσία。ἐκπρεπέσιν 为正级“华美／显赫”，而 καλλίστοις 为最高级；原译将两者都强化为“极其”，未保留这一程度差异。
  naturalness: 原句整体庄重通顺，但“接受我们亲临”略显生硬，“实际所行却是虚假的”也不如副词性的“实际却虚伪行事”自然。保留本节未完句的末尾逗号，以反映其与下文相接的句法。
  terminology: “圣殿”“奉献礼物”“尊荣”均适合本段历史叙事和庄重语域。“奉献礼物”可保留，并以脚注说明其可指圣殿中的奉献物或还愿礼物。
