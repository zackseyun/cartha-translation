  to: 可是，他们口头上虽接受我们到访，实际却虚伪行事；当我们热切希望进入他们的圣殿，用华美、至为精美的奉献礼物[b]尊荣它时，
  rationale: 将“亲临”改为“到访”，使“接受”的宾语搭配自然，并维持原文对统治者来临的指称。将νόθως译为“虚伪行事”，保留其对实际行为的负面描述。又按希腊文正级ἐκπρεπέσιν与最高级καλλίστοις的差异，调整奉献礼物的修饰语。脚注a保留原有锚点，但正文中原有[a]锚点未附着在修订文本中：为解决完整脚注集与文本锚点的一致性，应将[a]置于“到访”之后。
