  text: And by adorning their way of life with the good conduct of the righteous, they had become well regarded by all people.
translation:
  language: zh_hans
  text: 他们以义人的善行妆点自己的生活方式，在众人中早已享有美名。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ... εὐπραξίᾳ
  choice: 以……善行
  rationale: εὐπραξία在这里指良善、正直的行为；“善行”简洁自然，并与属格“义人的”顺畅搭配。
- source_word: τῶν δικαίων
  choice: 义人的
  rationale: δικαίων为形容词名词化的复数属格，指义人；保留其道德与宗教意味，不将所指进一步限定。
- source_word: κοσμοῦντες
  choice: 妆点
  rationale: κοσμέω本义为装饰、使有秩序；此处用于生活行为的隐喻。“妆点”保留原文意象，同时在现代汉语中自然庄重。
- source_word: τὴν συναναστροφήν
  choice: 自己的生活
  rationale: συναναστροφή可指与人交往中的行为或生活方式；“自己的生活”在本句中涵盖其社会伦理层面的生活表现，且避免与“善行”重复。
- source_word: ἅπασιν ἀνθρώποις
  choice: 众人的
  rationale: 该与格表示他们在所有人眼中的评价；“众人的”自然表达普遍的社会认可。
- source_word: εὐδόκιμοι
  choice: 赞誉
  rationale: εὐδόκιμος表示受到认可、享有好名声；结合καθειστήκεισαν译为“赢得了……赞誉”，清楚传达他们已获得良好声望的结果状态。
- source_word: καθειστήκεισαν
  choice: 赢得了
  rationale: καθίστημι的过去完成时表示此前已经形成并持续存在的状态；“赢得了”以自然汉语表达由其生活行为而获得赞誉的结果。
