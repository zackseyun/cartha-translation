base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/010.yaml
  text: And already some neighbors and friends and business associates[a], secretly drawing certain people aside, were giving assurances that they would join in protecting them and would offer every earnest effort toward their support.
translation:
  language: zh_hans
  text: 这时，已经有些邻居、朋友和生意上有来往的人，暗中把一些人拉到一旁[a]，向他们保证，愿意一同保护他们，并竭尽全力给予援助。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“暗中争取一些人”。
    reason: ἐπισπώμενοι既可侧重把人拉到自己一边，也可引申为争取或吸引人；正文保留较具体的动作意味。
lexical_decisions:
- source_word: γείτονές τε καὶ φίλοι καὶ συνπραγματευόμενοι
  choice: 邻居、朋友和生意上有来往的人
  rationale: 依次保留三类社会关系；“生意上有来往的人”自然表达共同办事或交易的关系，又不限定为正式合伙人。
- source_word: μυστικῶς
  choice: 暗中
  rationale: 表达支持者因处境危险而秘密行事，简洁而符合现代汉语。
- source_word: τινας ἐπισπώμενοι
  choice: 把一些人拉到一旁
  rationale: 保留ἐπισπάω“拉向自己、拉到一边”的具体意象，同时不武断判定这些人是被说服、被争取还是仅被私下叫到一旁。
- source_word: πίστεις ἐδίδουν
  choice: 向他们保证
  rationale: 这是作出保证或承诺的惯用表达；中文补出间接宾语，使句意自然。
- source_word: συνασπίζειν
  choice: 一同保护他们
  rationale: 该词源于“盾牌”，含有联合防护之意；译为“一同保护”兼顾共同参与和防卫含义，避免不自然地直译盾牌意象。
- source_word: πᾶν ἐκτενὲς προσιοίσεσθαι πρὸς ἀντίλημψιν
  choice: 竭尽全力给予援助
  rationale: 以自然中文表达全力投入并提供帮助的承诺，涵盖ἐκτενές的强度和ἀντίλημψις的援助含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这时，已经”承接ἤδη δὲ καί的推进语气；避免古奥措辞，也不补入原文未明说的身份或动机。
