  yaml_path: translation/deuterocanon/3_maccabees/003/006.yaml
  text: So then[a], the foreigners did not at all take into account the beneficence for which the nation was spoken of everywhere;
translation:
  language: zh_hans
  text: 因此，外族人丝毫没有把这个民族在众人中广受称道的良好品行考虑在内[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有重视”或“没有顾念”。原文动词本义与数算、列举有关，此处表示不把这事纳入衡量。
    reason: 说明διηριθμήσαντο的字面意象及其在本句中的引申义。
lexical_decisions:
- source_word: τὴν ... εὐπραξίαν
  choice: 良好品行
  rationale: εὐπραξία可指善行、良好作为或顺遂；本句以θρυλουμένην修饰，强调这个民族广受谈论和称道的表现，因此译为“良好品行”，避免误解为单纯的兴盛或专指施惠。
- source_word: περὶ τὸ γένος
  choice: 这个民族
  rationale: γένος在此指犹太人这一族群；“民族”既保留群体身份，也比“种族”更符合现代汉语语境。介词短语按汉语习惯整合为“这个民族……的”。
- source_word: ἐν πᾶσιν
  choice: 在众人中
  rationale: 与θρυλουμένην连用时，表示在众人当中广为传说；“在众人中”比单译“到处”更明确地保留πᾶσιν所指的公众范围。
- source_word: θρυλουμένην
  choice: 广受称道
  rationale: 该词表示被人反复谈论、广泛传说；结合正面的εὐπραξία，译作“广受称道”自然地传达公众间的良好声誉，但不强化为正式赞颂。
- source_word: οἱ ἀλλόφυλοι
  choice: 外族人
  rationale: ἀλλόφυλοι本指属于别族的人；“外族人”保留族群对比，又避免“外邦人”可能带入的后期宗教术语色彩。
- source_word: οὐδαμῶς
  choice: 丝毫没有
  rationale: 保留原文强烈而全面的否定语气。
- source_word: διηριθμήσαντο
  choice: 考虑在内
  rationale: 该动词字面与数算、列举有关，在此为引申义，表示将某事纳入衡量；“考虑在内”符合现代汉语，也保留其核算式意象的一部分。
