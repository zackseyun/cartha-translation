  text: But the Jews were maintaining unwavering goodwill and loyalty toward the kings;
translation:
  language: zh_hans
  text: 但犹太人一直对诸王保持善意和坚定不移的忠诚；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὔνοιαν
  choice: 善意
  rationale: 表示对人友善、亲善的态度；“善意”在现代汉语中自然，也不把它过度解释为政治效忠。
- source_word: πίστιν
  choice: 忠诚
  rationale: 此处对象是“众王”，语境属于政治与社会关系，因此指忠贞、可靠，而不是宗教意义上的“信仰”。
- source_word: ἀδιάστροφον
  choice: 不变的
  rationale: 本词表示不偏离、不转变；“不变的”简明地传达持守如一之意，同时避免加入原文没有的强烈修辞。
- source_word: φυλάσσοντες
  choice: 保持
  rationale: φυλάσσω本义为守住、看守；与“善意和忠诚”这类抽象宾语连用时，“保持”最符合现代汉语习惯。
- source_word: πρὸς τοὺς βασιλεῖς
  choice: 对众王
  rationale: πρός加宾格在此表示关系所指向的对象；“众王”保留了原文明确的复数。
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: 但犹太人
  rationale: δέ在上下文中带有转折作用，“但”予以体现；Ἰουδαῖοι直译为“犹太人”。
theological_decisions:
- issue: 非宗教政治语境中πίστις的译法
  choice: 忠诚
  alternative: 信实；信仰
  rationale: 因为πίστις所指向的对象是“众王”，这里应理解为对统治者的忠贞可靠，而非对上帝的信仰；“忠诚”最清楚地表达这一语境义。
- issue: ἀδιάστροφον所修饰的范围
  choice: 让“不变的”在汉语中自然地统摄“善意和忠诚”
  alternative: 仅明确修饰“忠诚”
  rationale: 希腊语形态上ἀδιάστροφον为阴性单数，与邻近的πίστιν一致，但整组“善意和忠诚”也可作为共同持守的品格来理解。汉语译文不刻意限定其范围，以保留原句可自然感受到的联系。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“始终”体现持续持守的未完成时意味；保留句末分号，以反映原文此句仍与后文相接。
