  rationale: 修改仅为更准确呈现军事性的 συμμαχία 和被动完成式 ἐπὶ τέλος ἀχθείσης。“盟助”在现代汉语中虽较书面，但在此王室军事文体中自然，并保留诸神与说话者一方结盟、提供支持的含义；“按理”对应 κατὰ λόγον，未将其限定为按计划或必然获胜。
