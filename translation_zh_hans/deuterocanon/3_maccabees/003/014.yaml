base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/014.yaml
  text: concerning our campaign into Asia[a], which you yourselves also know, which by the unfailing alliance of the gods was brought, as was fitting, to its conclusion[b],
translation:
  language: zh_hans
  text: 至于我们进军亚细亚的战役[a]，你们自己也知道；这场战役凭着诸神那坚固不移的盟助，按理被带到了终点[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚细亚”指古代的亚细亚地区，并非现代所说的整个亚洲。
    reason: historical_geographical_clarification
  - marker: b
    text: 或译：“被完成了。”希腊文直译为“被带到了终点”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρατείας
  choice: 战役
  rationale: 该词指军事远征或战役；“战役”简洁自然，并保留军事语义。
- source_word: εἰς τὴν Ἀσίαν
  choice: 进军亚细亚
  rationale: εἰς 表示向某地区内部移动；结合军事语境，“进军亚细亚”比单纯“前往亚细亚”更准确。
- source_word: γενομένης ἡμῖν
  choice: 我们……的
  rationale: 此处表达由说话者一方发动或进行的战役，汉语以领属结构自然呈现。
- source_word: ἧς ἴστε καὶ αὐτοί
  choice: 你们自己也知道
  rationale: 保留 καί 的“也”和 αὐτοί 的强调作用。
- source_word: ἀρρωστῷ
  choice: 坚定不移的
  rationale: 该形容词本义为“不软弱、不衰弱”，修饰军事协助时表示坚强、稳固而不失效；“坚定不移”保留这一形象，避免把语义过度强化为“不可战胜”。
- source_word: συμμαχίᾳ
  choice: 协助
  rationale: 该词可指军事联盟或盟助；这里诸神与人并非同等政治实体，用“协助”在现代汉语中更自然，同时保留军事支援意味。
- source_word: τῶν θεῶν
  choice: 诸神
  rationale: 希腊文明确使用复数，且属于异教君王的言语，应保留其多神论措辞。
- source_word: κατὰ λόγον
  choice: 如所应当的
  rationale: 该短语可表示合乎道理、合宜或符合预期；“如所应当的”保留评价意味，而不擅自限定为“按计划”。
- source_word: ἐπὶ τέλος ἀχθείσης
  choice: 得以进行到底
  rationale: 保留“被带到终点”的被动完成意味，同时采用自然的现代汉语表达。
theological_decisions:
- issue: 王室言辞中对异教神祇的称呼
  choice: 诸神
  alternative: 上帝；神明的帮助
  rationale: 原文 τῶν θεῶν 明确为复数。译文保留异教君王的历史宗教视角，不将其改写为一神论措辞。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“进军亚细亚的战役”保留军事与方向含义；分号使较长的希腊文属格绝对结构在汉语中清楚连贯。句末逗号表明本节在原文中仍与后文相接。
