base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/001.yaml
  text: And when the impious man had taken this in[a], he became so enraged that he was angry not only with those in Alexandria, but also opposed those in the countryside more harshly; and after ordering that they quickly gather all together in one place[c][b], he intended to remove them from life by the cruelest fate.
translation:
  language: zh_hans
  text: 这不敬神的人得知此事[a]，便勃然大怒；他不仅向亚历山大城里的人发怒，还以更严厉的态度敌对乡间的人[b]。他下令迅速把所有人聚集到一处，要使他们以最悲惨的结局丧命[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得知”也可译作“领受”或“获悉”。原文可表示接收到信息，也可较宽泛地表示领受某事。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在那地区里的人”。这里与亚历山大城相对，可能特指城外周边乡间各地的人。
    reason: cultural_note
  - marker: c
    text: 原文直译为“使他们脱离活着的状态”，即把他们处死。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβὼν
  choice: 得知此事
  rationale: 此处分词承接上文所传达的情况，可指领受或获知消息；“得知此事”在现代汉语中自然，也不额外断定获知的具体途径。
- source_word: δυσσεβὴς
  choice: 不敬神的人
  rationale: 保留该词所含的宗教性不敬含义，避免弱化为泛指的“恶人”。
- source_word: ἐξεχόλησεν
  choice: 勃然大怒
  rationale: 表达强烈而骤然发作的愤怒，并自然引出后面的结果陈述。
- source_word: τοῖς κατὰ Ἀλεξάνδρειαν
  choice: 亚历山大城里的人
  rationale: 简明表达身处亚历山大者，并以“城里”与后文乡间形成清楚对照。
- source_word: τοῖς ἐν τῇ χώρᾳ
  choice: 乡间的人
  rationale: χώρα 在与亚历山大城对举时最自然地指城外周边地区，而非抽象意义上的整个国土。
- source_word: βαρυτέρως ἐναντιοῦσθαι
  choice: 更加严厉地敌对
  rationale: 保留比较级所表达的加重程度，也保留 ἐναντιόομαι 的敌对、作对含义，而不把它限定为已经施行暴力。
- source_word: προστάξας σπεύδοντας συναγαγεῖν πάντας ἐπὶ τὸ αὐτό
  choice: 下令迅速把众人聚集到一处
  rationale: 以自然汉语传达压缩的希腊语句法，保留命令的紧迫性、对象的全体性及集中于同一地点之意。
- source_word: χειρίστῳ μόρῳ
  choice: 以最惨酷的方式
  rationale: μόρος 可指厄运、死亡或毁灭性的结局；结合下文夺取性命，“最惨酷的方式”既传达极端惨烈，又避免生硬拟人化的“命运”。
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: 夺去他们的性命
  rationale: 这是“使其离开活着状态”的委婉说法，实际指杀死；中文译为“夺去性命”既清楚又保留庄重语体。
