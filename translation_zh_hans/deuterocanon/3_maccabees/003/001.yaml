  to: 这不敬神的人得知此事[a]，便勃然大怒；他不仅向亚历山大城里的人发怒，还以更严厉的态度敌对乡间的人[b]。他下令迅速把所有人聚集到一处，要使他们以最悲惨的结局丧命[c]。
