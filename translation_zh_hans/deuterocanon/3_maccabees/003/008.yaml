base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/008.yaml
  text: But the Greeks in the city[a], having suffered no wrong, seeing the unexpected turmoil concerning the men and the disorderly gatherings that were taking place, were not strong enough to help; for their disposition urged an appeal[b], and some also were in an agitated state and supposed that these things would change.
translation:
  language: zh_hans
  text: 城中的希腊人自己并未受到任何亏待；他们看见有关这些人的意外骚乱，以及正在发生的杂乱聚集，却无力相助，因为他们的心意催促他们发出恳求[a]。其中有些人也处于骚动不安之中[b]，并以为事态会发生转变。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们的心意催促他们劝勉（或安慰）。”原文这一分句句法紧缩；παράκλησις可表示恳求、劝勉或安慰，确切语气难以确定。
    reason: lexical_alternative
  - marker: b
    text: 或译：“其中有些人也被骚动的人群卷了进去。”罕见的συνδρόμως既可指处于骚动不安之中，也可能指随人群一同卷入行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κατὰ τὴν πόλιν Ἕλληνες
  choice: 城里的希腊人
  rationale: κατὰ τὴν πόλιν在此表示位于城中；δὲ所含的轻微转折由上下文和句势体现，不必机械译出。
- source_word: οὐδὲν ἠδικημένοι
  choice: 自己并未受到任何亏待
  rationale: 保留ἀδικέω完成时被动分词所表达的状态：他们本身并没有遭受不公或侵害。
- source_word: ταραχὴν ἀπροσδόκητον περὶ τοὺς ἄνδρας
  choice: 围绕这些人的意外骚乱
  rationale: “围绕”保留περί既可表示相关、也可带有空间意味的宽度；“意外骚乱”对应ταραχὴν ἀπροσδόκητον。
- source_word: συνδρομὰς ἀπροκόπους γινομένας
  choice: 纷乱的人群不断聚集
  rationale: συνδρομή指奔聚、会集或聚集的人群；ἀπρόκοπος含无进展、失序或难以控制之意。“纷乱”避免把它缩减为单纯的“突然”。
- source_word: βοηθεῖν μὲν οὐκ ἔσθενον
  choice: 却无力施以援手
  rationale: 保留ἔσθενον的力量、能力意味，表明他们缺乏相助的力量，而不是不愿相助。
- source_word: παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν
  choice: 因为他们的心意催促他们出面恳求
  rationale: 原文句法紧缩，παράκλησις可指恳求、劝勉或安慰；正文采用在情境中较通顺的“恳求”，并以脚注保留其他可能。
- source_word: οἱ δὲ καὶ συνδρόμως εἶχον
  choice: 其中有些人也陷入骚动
  rationale: 罕见副词συνδρόμως与奔聚、骚乱相关，可描述内在不安，也可能表示被人群骚动卷入；正文不过度具体化。
- source_word: μεταπεσεῖσθαι ταῦτα ὑπελάμβανον
  choice: 并以为事态会发生转变
  rationale: μεταπίπτω表示改变、转向；不说明转好或转坏，以保留原文未交代方向的开放性。
