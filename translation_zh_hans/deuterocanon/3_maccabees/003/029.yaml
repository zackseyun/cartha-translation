base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/029.yaml
  text: But every place where a Jew is discovered while being concealed shall become inaccessible and burned with fire[a], and it shall appear altogether useless to every mortal creature for all time.
translation:
  language: zh_hans
  text: 但凡发现其中有一名被藏匿的犹太人[a]之处，都要成为不得进入、遭火焚烧之地；并且要在永远的岁月中，显为对一切必死的生灵全然无用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被藏匿的犹太人”：原文τὸ σύνολον σκεπαζόμενος的句法关系艰涩。σκεπαζόμενος意为“被遮蔽／被隐藏”；τὸ σύνολον也可能加强隐藏的程度，即“完全被隐藏”。本句大意是：凡发现有犹太人被隐藏在其中的地方，皆受禁入和火焚的判罚。
    reason: 说明原文困难的结构及可行理解，避免将有争议的细节当作确定语义。
lexical_decisions:
- source_word: πᾶς ... τόπος
  choice: 任何地方……都
  rationale: 以现代汉语的周遍结构表达希腊文的分配性范围，保留诏令无一例外的语气。
- source_word: οὗ ἐὰν φωραθῇ
  choice: 若有人发现其中
  rationale: φωράω在此有察觉、查获隐匿之事的含义；用“发现”既自然，也符合查禁语境。
- source_word: τὸ σύνολον σκεπαζόμενος Ἰουδαῖος
  choice: 其中藏匿着一个犹太人
  rationale: 原文句法艰涩；σκεπαζόμενος明确涉及遮蔽或隐藏，而τὸ σύνολον的具体作用不够清楚。正文传达该处窝藏犹太人的基本意思，脚注保留困难与另一种理解。
- source_word: ἄβατος
  choice: 不可进入之地
  rationale: 该词意为不能踏入或禁止进入；此译法清楚保留禁入及荒废的意味。
- source_word: πυριφλεγής
  choice: 被烈火焚烧
  rationale: 该形容词描写被火燃烧、烈焰焚毁的状态；此处与命令式的γινέσθω相连，译出判罚所造成的状态。
- source_word: πάσῃ θνητῇ φύσει
  choice: 对一切有死的生灵
  rationale: 直译接近“一切必死的本性”，范围可能不限于人；“有死的生灵”保留其广度和庄重感。
- source_word: καθʼ ἅπαν ἄχρηστος
  choice: 完全无用
  rationale: 保留加强语气，表示彻底不能使用。
- source_word: φανήσεται
  choice: 都……无用
  rationale: φαίνω的将来中被动态可指显为、证明为；汉语直接作状态陈述更自然，且不额外确定是主观“看来”还是客观“证明”。
- source_word: εἰς τὸν ἀεὶ χρόνον
  choice: 直到永远
  rationale: 准确传达永久持续的时间范围，也符合庄重诏令文体。
theological_decisions:
- issue: Ἰουδαῖος的族群称谓
  choice: 犹太人
  alternative: 犹地人
  rationale: 本段叙述针对作为族群及宗教共同体的犹太人所施加的迫害，并非仅指来自犹地的居民。
- issue: πάσῃ θνητῇ φύσει的范围
  choice: 一切有死的生灵
  alternative: 所有人
  rationale: 原文表述宽泛，不宜将其默默限定为人类；所选译法保留这种范围上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的诏令语体。“都要”体现命令力度；“不可进入之地”“直到永远”保留原文严厉、永久性的措辞。脚注标记[a]已在正文出现。
