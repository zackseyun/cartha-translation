  naturalness: 前半句庄重自然。“他们远不及我们的力量”不够地道，宜明确为“他们的实力远逊于我们”。“而”略加强原文未明说的转折，改为分号并直陈两项自我宣称，较贴近原文的并列结构。
  terminology: “狂妄”“实力”“善意”“所有人”均适合现代标准汉语，并分别妥善对应 τύφοις、ἀλκή、φιλανθρωπία、ἅπαντας ἀνθρώπους。保留“凭着这实力”以呈现 διʼ ἣν 对“实力”的回指，虽带有原文本身的夸饰性逻辑，毋须替其调和。
