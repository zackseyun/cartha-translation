base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/018.yaml
  text: Carried away by ancient conceit[a], they barred us from entry, falling short of our strength, by which we have goodwill toward all people.
translation:
  language: zh_hans
  text: 他们受由来已久的狂妄驱使[a]，禁止我们进入；他们的实力远逊于我们；我们凭着这实力，对所有人都怀有善意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被根深蒂固的傲慢冲昏了头。”希腊语在此可表达一种由来已久、承袭已久的狂妄心态。
    reason: 保留 τύφοις φερόμενοι παλαιοτέροις 的紧凑表达及其“受驱使／被冲昏”和“古已有之／长期存在”等语义层次。
lexical_decisions:
- source_word: τύφοις φερόμενοι παλαιοτέροις
  choice: 受由来已久的狂妄驱使
  rationale: 保留被某种心态推动的被动意味；παλαιοτέροις 在此指长期沿袭、早已存在，而“由来已久”比直译“更古老”自然。τύφοις 的语境义是自负、狂妄。
- source_word: εἶρξαν ἡμᾶς τῆς εἰσόδου
  choice: 不许我们进入
  rationale: εἴργω 加属格表示阻止某人做某事；译文以现代汉语动词结构准确表达。
- source_word: λειπόμενοι τῆς ἡμετέρας ἀλκῆς
  choice: 他们远不及我们的力量
  rationale: λείπομαι 加属格表示不及、逊于；ἀλκή 可指力量、勇力，此处用“力量”保留其较宽泛的含义。
- source_word: διʼ ἣν
  choice: 正是凭这力量
  rationale: 关系代词回指 ἀλκή，διά 表示手段或依据；补出所指并用“正是”使中文衔接清楚，但不改变因果关系。
- source_word: ἔχομεν πρὸς ἅπαντας ἀνθρώπους φιλανθρωπίαν
  choice: 善待所有人
  rationale: φιλανθρωπία 指对人的仁厚、善意；“善待”自然表达 ἔχομεν…φιλανθρωπίαν 的实际态度，也保留 πρὸς 的指向。ἅπαντας ἀνθρώπους 泛指所有人。
theological_decisions:
- issue: 君王自述“力量”与“善待所有人”的关系
  choice: 而我们正是凭这力量善待所有人
  alternative: 因为这力量，我们对所有人怀有善意
  rationale: 保留原文 διʼ ἣν 对 ἀλκή 的回指以及手段或依据上的关联，不替叙述者判断此自我评价是否真实，也不把它改写为神学命题。
- issue: ἅπαντας ἀνθρώπους 的泛指范围
  choice: 所有人
  alternative: 所有世人
  rationale: 原文是普遍且非男性特指的用语；“所有人”在现代汉语中准确、自然。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不许我们进入”避免生硬名词化；后半句适度重组，以明确关系代词所指，同时保留诏令中自负、夸耀的口吻。
