base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/024.yaml
  text: Therefore[a], being well convinced by proofs that these people are in every way ill-disposed toward us, and taking thought lest, if some sudden disturbance should later arise, we should have these ungodly people at our back as traitors and barbarian enemies,
translation:
  language: zh_hans
  text: 因此，我们根据确凿的证据，深信这些人处处对我们心怀恶意；我们也预先考虑到，以防日后突然发生动乱，我们会有这些不敬神之徒在我们背后充当叛徒和野蛮的敌人[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凶蛮的敌人”。这里译作“野蛮的”的希腊语是说话者带有贬义的称呼，未必是精确的族群称谓。
    reason: 说明 βαρβάρους 在本句中的贬斥性及其可能译法，避免读者误以为这是明确的民族分类。
lexical_decisions:
- source_word: διὸ
  choice: 因此
  rationale: 表明本句是根据上文作出的推论；“因此”自然地保留了逻辑承接关系。
- source_word: τεκμηρίοις
  choice: 根据确凿的证据
  rationale: 与格表示凭借或依据；“确凿的证据”传达有证据支持，而非仅凭猜疑。
- source_word: καλῶς πεπεισμένοι
  choice: 深信
  rationale: 完成时分词表达已经形成并持续的确信状态；“深信”简洁自然，也体现 καλῶς 的加强语气。
- source_word: κατὰ πάντα δυσνοεῖν ἡμῖν
  choice: 处处对我们心怀恶意
  rationale: 保留 κατὰ πάντα 的全面范围和 δυσνοεῖν 对某人抱持敌意的含义。
- source_word: προνοούμενοι
  choice: 预先考虑到
  rationale: 表达事先筹思和顾虑，不把原文进一步限定为已经采取具体防范措施。
- source_word: μή ποτε ἐφνιδίου μετέπειτα ταραχῆς ἐνστάσης
  choice: 万一日后突然发生动乱
  rationale: 保留对未来不测事件的担忧；“动乱”维持 ταραχή 的宽泛含义，不强行译成暴乱或叛乱。
- source_word: κατὰ νώτου
  choice: 在我们身后
  rationale: 保留来自后方的军事危险意象，同时符合现代汉语表达。
- source_word: δυσσεβεῖς
  choice: 不敬神的
  rationale: 准确传达该词在宗教与道德层面的贬斥意味，不弱化说话者的指控。
- source_word: προδότας
  choice: 叛徒
  rationale: 符合此处政治、军事语境中背叛者的含义。
- source_word: βαρβάρους πολεμίους
  choice: 野蛮的敌人
  rationale: 保留说话者带有贬斥色彩的修辞；此处未必是精确的族群称谓。
theological_decisions:
- issue: 王室指控中强烈贬斥语的处理
  choice: 保留“不敬神的”“叛徒”和“野蛮的敌人”等措辞，明确呈现说话者的敌对修辞。
  alternative: 弱化为“不忠的”或“怀有敌意的人”。
  rationale: 本节是在转述说话者的指控，并非译文对该群体作出的认定；若予以弱化，会损失原文的政治和宗教修辞力度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文未完句式，以逗号收束，使本节继续连接下文；同时以分号梳理两个并列分词结构，避免汉语长句晦涩。
