  naturalness: 原译庄重流畅。“带着胜利安然渡过”略显搭配生硬；改为“得以胜利地安然渡过”更合现代汉语，同时不指定被动动作的施事者。
  terminology: “愚妄”“仁厚”“各族人民”均适合正式的王室自述语境。“相会时以仁厚相待”同时呈现相遇和友善相待，避免把ἀπαντάω过度具体化为“接待”或“接见”。
