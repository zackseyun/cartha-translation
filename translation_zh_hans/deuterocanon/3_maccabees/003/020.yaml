  rationale: 修订仅校正两处语义重心并改善一处搭配：以“相会时”保留ἀπαντήσαντες，以“做了合宜的事”对应καθὼς ἔπρεπεν，并以“得以胜利地安然渡过”在不明定施事者的前提下表达被动分词所带出的获保全结果。君王关于自身仁厚的自我呈现仍按原文直接保留，未加入褒贬。
