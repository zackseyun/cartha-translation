base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/020.yaml
  text: But we[a], having borne with their folly, and having been carried through with victory, and having met all the nations in Egypt with humanity[b], did what was fitting.
translation:
  language: zh_hans
  text: 但我们容忍了他们的愚妄[a]，得以胜利地安然渡过，又在埃及与各族人民相会时以仁厚相待[b]，做了合宜的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “容忍了他们的愚妄”也可译作“耐心对待他们的无知”或“忍受他们的愚妄”；希腊文分词含有容忍、迁就之意。
    reason: lexical_alternative
  - marker: b
    text: “以仁厚相待”也可译作“以人道相待”或“善待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίᾳ
  choice: 愚妄
  rationale: 既表达缺乏理智，也保留其道德意味；比“疯狂”更不过度，比“愚蠢”更符合庄重文体。
- source_word: συμπεριενεχθέντες
  choice: 宽容了
  rationale: 此处表示对他人的无知采取容忍、迁就的态度；“宽容了”自然传达耐心忍让，不把被动形态生硬复制到中文。
- source_word: μετὰ νίκης
  choice: 带着胜利
  rationale: 贴近希腊文介词短语，保留王者陈述中强调胜利的修辞，而不强化为“凯旋”。
- source_word: διακομισθέντες
  choice: 安然渡过
  rationale: 该词可指被运送过去或安全通过；这里保留“渡过、获保全”的含义，并以“安然”体现被带领通过的结果，避免臆定具体所渡之物。
- source_word: τοῖς πᾶσιν ἔθνεσιν
  choice: 各族人民
  rationale: 在埃及境内的多族群语境中，“各族人民”比“列国”自然，也不引入“外邦人”的宗教内外之分。
- source_word: ἀπαντήσαντες
  choice: 待
  rationale: 基本义为迎见、相遇；与副词φιλανθρώπως结合时，中文以“以仁厚待……”自然表达见面交往中的态度，同时不强化为“欢迎”。
- source_word: φιλανθρώπως
  choice: 以仁厚
  rationale: 表达仁慈、善待人的文明君王姿态；“仁厚”庄重自然，也比现代特定语境中的“人道地”更宽泛。
- source_word: καθὼς ἔπρεπεν
  choice: 尽了应尽之分
  rationale: 表达合宜、得体和符合身份责任之意，适合王室自我辩护的正式口吻。
theological_decisions:
- issue: 君王自称仁厚对待属下各族人民
  choice: 按陈述者的自我表述直接翻译，不另加肯定或讽刺提示
  alternative: 以带有讽刺或宣传意味的措辞揭露其自我辩护
  rationale: 原文保留的是王室文告式的自我呈现；译文应呈现其修辞立场，却不替叙事者判定该主张真伪。
- issue: διακομισθέντες的被动意味与施事者
  choice: 译作“安然渡过”，保留蒙保全的结果，但不明说是上帝使其通过
  alternative: 译作“蒙上帝带领安然渡过”或仅作主动式“胜利通过”
  rationale: 希腊文使用被动分词，却未明示施事者；不宜在译文中补入神学主体，也不宜完全抹去受动和获保全的色彩。
translation_notes:
  register: 采用现代、庄重而可读的官式自述语气。用“我们”保留君王复数自称；三个连续分词结构在中文中适度顺化，同时维持原句逐层铺陈、最后以自我正当化收束的修辞。
