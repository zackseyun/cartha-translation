base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/026.yaml
  text: For if these men are punished all together[a], we will leave for the time that remains with complete confidence that our affairs will be established in stability and in the best condition.
translation:
  language: zh_hans
  text: 因为这些人若一并受罚，我们便会在今后的日子里完全确信：我们的政务将安定稳固，并处于最佳状态。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“我们将留下／留待”和后面的未来不定式之间句法较为紧缩。此处按上下文译为“我们……完全确信：……将……”，表达这些人受罚后，国家政务在未来会安定并处于最佳状态；不宜据此确定“留下”的未明宾语。
    reason: 说明λείψαμεν与未来被动不定式的压缩且略有含混的关系，避免把未明宾语和使役意义加入正文。
lexical_decisions:
- source_word: τούτων
  choice: 这些人
  rationale: 指上下文所谈论的犹太群体；补出“人”符合现代汉语表达，也不超出希腊文指示代词的所指。
- source_word: ὁμοῦ
  choice: 一并
  rationale: 表达共同、同时受处置的集体性，简洁而适合诏令语体。
- source_word: κολαθέντων
  choice: 受到惩罚
  rationale: κολάζω在此为强制性的惩处，并非较轻的管教；“受到惩罚”保留被动意义。
- source_word: λείψαμεν
  choice: 能使……保持
  rationale: 该形式与后接未来被动不定式构成压缩句法，重点是惩罚之后政务在未来所处的稳定状态；据整体句意用使役—持续结构自然表达，同时以脚注交代更贴近字面的译法。
- source_word: εἰς τὸν ἐπίλοιπον χρόνον
  choice: 在今后的岁月中
  rationale: 表示从此以后尚余的时日；“今后的岁月中”自然地传达面向未来的持续范围。
- source_word: τελείως ἡμῖν
  choice: 我们就有十足把握
  rationale: τελείως在压缩结构中强化说话者对预期结果的确信；如此翻译比机械译作“完全地”更符合现代汉语，又保留第一人称复数。
- source_word: τὰ πράγματα
  choice: 我们的政务
  rationale: 在王室行政语境中指国家事务；“政务”比泛称“事情”更准确，同时不过度具体化。
- source_word: ἐν εὐσταθείᾳ
  choice: 保持安定
  rationale: εὐστάθεια表示稳固、安定的状态；动词化处理符合汉语习惯。
- source_word: τῇ βελτίστῃ διαθέσει
  choice: 处于最佳状态
  rationale: διάθεσις在此指事务的情势或状态，而非人的情绪或性情。
- source_word: κατασταθήσεσθαι
  choice: 能使……保持……处于
  rationale: 未来被动不定式表示事务将被置于或确立在某种状态；汉语用结果性表达呈现其意义。
