base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/016.yaml
  text: And after assigning very great revenues to the temples in the cities[a], we also went on and, going up to Jerusalem, to honor the temple of those never-winnowed and never-ceasing in their folly.
translation:
  language: zh_hans
  text: 我们给各城的庙宇拨付了极其丰厚的收入之后，又继续前行，上到耶路撒冷，为要尊崇那些从未簸扬[a]、在愚昧中永不止息之人的圣殿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从未簸扬”所译的希腊语十分罕见，含义也不确定。它可能是带敌意的比喻，把这些人说成未经簸扬、尚未除去杂质；也有人作较正面的理解，因而用贬义较弱的措辞翻译整句。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπονείμαντες
  choice: 拨付了……之后
  rationale: 不定过去时分词表示先于主句发生的行动；“拨付”符合向庙宇划拨收入的行政、财政语境。
- source_word: προσόδους πλείστας
  choice: 极其丰厚的收入
  rationale: πρόσοδοι 指收入、岁入，而非泛称礼物；πλείστας 强调数量或规模之大。
- source_word: προηχθημεν
  choice: 甚至还进一步
  rationale: 该中动/被动形式在此表示继续向前、进而采取下一行动；结合 καί 译为“甚至还”，保留话语中的递进意味。
- source_word: ἀναβάντες
  choice: 上到
  rationale: 保留前往耶路撒冷惯用的“上去”表达，同时符合现代汉语行旅叙述。
- source_word: τιμῆσαι
  choice: 要尊崇
  rationale: 目的不定式说明上耶路撒冷的用意；“尊崇”可表达礼敬圣所，又不额外引入敬拜含义。
- source_word: τὸ ἱερόν
  choice: 圣殿
  rationale: 此处指耶路撒冷的圣殿或圣殿建筑群；“圣殿”是清楚而庄重的汉语对应。
- source_word: ἀλητρίων
  choice: 从未簸净
  rationale: 该词罕见且意义困难，可能借用簸扬谷物、去除杂质的意象作敌意比喻；直译其形象，避免将其泛化成一般道德评价。
- source_word: μηδέποτε ληγόντων τῆς ἀνοίας
  choice: 愚昧又永不止息
  rationale: 保留“从不停止其愚昧”的持续性和论战语气；调整语序使汉语自然。
theological_decisions:
- issue: τῶν ἀλητρίων καὶ μηδέποτε ληγόντων τῆς ἀνοίας 的所指及褒贬色彩
  choice: 理解为修饰与耶路撒冷圣殿相关的人，即“那些从未簸净、愚昧又永不止息之人”。
  alternative: 也有人将其弱化或正面理解为“纯洁并恒常虔诚的人”或“坚定而热心不止的人”。
  rationale: 该属格短语自然依附于 τὸ ἱερόν，以相关群体来指称其圣殿；上下文的敌对叙述口吻支持保留贬义。不过 ἀλητρίων 本身罕见难解，因此以脚注保留其他理解的可能。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。保留原文财政用语、上耶路撒冷的空间表达，以及王令叙述中尖锐而难解的农业比喻；不以较顺滑的释义消除其真实歧义。
