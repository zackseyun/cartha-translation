base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/023.yaml
  text: Not only have they rejected the honorable civic order[a], but they also detest, both in speech and in silence, the few among them who are genuinely well-disposed toward us, and at every opportunity, driven by the most impious pretext[c][b], they rush to bring our affairs to ruin.
translation:
  language: zh_hans
  text: 他们不仅背弃了那备受尊崇的政制[b]，还无论公开表态还是保持沉默[a]，都憎恶他们当中少数真心向着我们的人；他们每逢机会，就以最不敬虔的托词[c]，急忙要使我们的国事倾覆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“以言语和沉默”，可能同时指公开表达和默然表现出的敌意。
    reason: lexical_alternative
  - marker: b
    text: “政制”所译的希腊词也可指公民秩序、共同体制度或生活方式；“备受尊崇”所据的词形也可能理解为“不受尊崇”。
    reason: lexical_ambiguity
  - marker: c
    text: “托词”也可译作“姿态”“表象”或“暗示”；原词在这里的确切含义并不明确。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἀπεστρέψαντο
  choice: 背弃了
  rationale: 中间语态在这里表示主动转离、拒绝某种制度；“背弃”既保留故意拒斥的力度，也符合政治控诉语境。
- source_word: τὴν ἄτιμητον πολιτίαν
  choice: 那备受尊崇的政制
  rationale: πολιτεία在王室政治语境中指政制、公民秩序或共同体安排，不宜仅译作个人的“公民身份”。ἄτιμητον的词形存在“未受尊荣”与“不可估价、极受看重”之间的张力；本句控诉对方拒绝既定秩序，正文依语境取后者，并以脚注保留歧义。
- source_word: βδελύσσονται
  choice: 厌恶
  rationale: 该动词表达强烈憎恶；“厌恶”在现代汉语中自然、庄重，并保留其强烈负面色彩。
- source_word: λόγῳ τε καὶ σιγῇ
  choice: 无论出言还是缄默
  rationale: 较贴近“以言语和沉默”的并列表达，保留公开与默然两种敌意表现，而不把其中含义完全解释化。
- source_word: πρὸς ἡμᾶς γνησίως διακειμένους
  choice: 真心亲近我们的人
  rationale: διακεῖμαι πρός表示对某人的态度或倾向，γνησίως强调真诚；“亲近”避免过度收窄为正式政治效忠。
- source_word: παρʼ ἕκαστα
  choice: 一有机会
  rationale: 按语境作反复出现的场合或机会理解，比逐字译为“在每件事上”更自然。
- source_word: μετὰ τῆς δυσσεβεστάτης ἐμφάσεως
  choice: 怀着最不敬虔的意图
  rationale: ἐμφάσεως可涉及显露、姿态、暗示、托词或意向；这里译作“意图”以衔接敌对行动，但不确定性在脚注中保留。
- source_word: διὰ τάχους
  choice: 急欲
  rationale: 该短语表示迅速、急迫；以“急欲”自然连接后面的不定式目的。
- source_word: ἡμᾶς καταστρέψαι τὰ πράγματα
  choice: 使我们的国事倾覆
  rationale: τὰ πράγματα在政治语境中可指国事、政局或整体事务，καταστρέψαι表示推翻、毁坏；“国事倾覆”保留政治范围而不局限于物质毁灭。
theological_decisions:
- issue: ἄτιμητον修饰πολιτίαν时的价值含义
  choice: 备受尊崇的政制
  alternative: 不受尊崇的政制／受轻蔑的政制
  rationale: 该词形可产生负面理解，但在诏令的控诉逻辑中，说对方背弃一项受珍视的政制更连贯。正文采用正面价值义，同时用脚注明示另一种可能，避免掩盖原文张力。
- issue: μετὰ τῆς δυσσεβεστάτης ἐμφάσεως的具体语义
  choice: 怀着最不敬虔的意图
  alternative: 打着最不敬虔的幌子／摆出最不敬虔的姿态
  rationale: ἐμφάσεως语义范围较宽，无法确定这里只指借口、外在表现还是内在意向；正文选择最顺畅的“意图”，脚注保留其他可行理解。
translation_notes:
  register: 采用现代、庄重而可读的诏令控诉语体。“政制”“国事倾覆”保留政治语境；句中以分号梳理希腊文长句层次。所有脚注标记均置于相应正文词组之后。
