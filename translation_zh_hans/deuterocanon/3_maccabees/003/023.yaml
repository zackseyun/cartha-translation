  to: 他们不仅背弃了那备受尊崇的政制[b]，还无论公开表态还是保持沉默[a]，都憎恶他们当中少数真心向着我们的人；他们每逢机会，就以最不敬虔的托词[c]，急忙要使我们的国事倾覆。
