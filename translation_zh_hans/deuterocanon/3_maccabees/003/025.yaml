review_pass:
  verdict: revise
  source_fidelity: 译文大体传达了诏令、登记者及其家属、铁制束缚和深坑的意象。但“配给仇敌”误解πρέποντα δυσμενέσιν；此处是“适合／与仇敌相称”，并非把深坑分配给仇敌。原译将原文一串修饰“被送来的人”的分词拆成“押送……；要给他们戴上……送入”，虽不致根本改变事件，却削弱了原文作为单一命令的句法关联。
  naturalness: “配给仇敌”在现代汉语中不自然，且语义错误。“无可救治”用于“深坑”略显搭配不当；“无法挽回”更自然，同时保留ἀνήκεστος的不可补救含义。修订后维持庄重、清晰的公文／诏令语体。
  terminology: “登记在册的人”“妻子儿女”“铁镣”均可保留。“凌辱和劫掠”可表达ὕβρις与σκυλμοί；为使受害者关系更清楚，正文采用“遭受凌辱和劫掠”。“恶名昭彰”贴合δυσκλεής，且不把“深坑”解释为纯比喻。
  issues:
  - severity: high
    issue: “配给仇敌”误译πρέποντα δυσμενέσιν。
    rationale: πρέποντα意为“合适、相称”，dysmenesi为“仇敌／敌人”；该短语修饰“深坑”，意思是“适合仇敌的深坑”或“与仇敌相称的深坑”，没有“配给、分配”之意。
  - severity: medium
    issue: “无可救治”与“深坑”搭配生硬。
    rationale: ἀνήκεστος可含不可医治之义，但在此修饰作为毁灭性去处的“深坑”，汉语以“无法挽回”更自然，也不限定为医疗意义。
  - severity: low
    issue: 分号后的“要给他们戴上……送入”把原文同属受令送押方式的修饰语改作另起命令。
    rationale: 希腊文的铁制束缚、四面封闭与最终去处共同说明被送来者的处境；合并表达可更准确保留其句法关系。
