base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/025.yaml
  text: We have ordered that[a], as soon as this letter arrives, those enrolled, together with their wives and children, be sent to us at once in iron bonds, shut in on every side, with abuse and plundering[c][b], for an incurable and disgraceful pit fit for enemies.
translation:
  language: zh_hans
  text: 我们已经下令：这封信一送到，就立即把登记在册的人[a]连同他们的妻子儿女，遭受凌辱和劫掠[b]，戴着铁镣、从四面严密禁锢，押送到我们这里，送入那无法挽回、恶名昭彰、适合仇敌的深坑[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “登记在册的人”也可译作“注册的人”或“被列名的人”；希腊文指正式录入名册的人。
    reason: lexical_alternative
  - marker: b
    text: “凌辱和劫掠”同时表达蛮横羞辱人的虐待，以及剥夺、掠夺或摧残；后一个词的具体侧重点在此并不完全确定。
    reason: lexical_alternative
  - marker: c
    text: “深坑”可以指实际的坑，也可能是毁灭和羞耻之地的强烈形象说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: 我们已经下令
  rationale: 完成时表示命令已经颁布并持续有效；“已经下令”自然保留诏令的权威语气。
- source_word: ἅμα τῷ προσπεσεῖν τὴν ἐπιστολὴν τήνδε
  choice: 这封信一送到
  rationale: ἅμα τῷ加不定式表示某事一发生便立即采取行动；文件在此是送达，而非字面“落下”。
- source_word: αἰθωρεὶ
  choice: 立即
  rationale: 按上下文表达不容延误的执行要求，与前面的送达时间结构共同强化紧迫性。
- source_word: τοὺς ἐννεμομένους
  choice: 登记在册的人
  rationale: 该分词指被正式录入名册者；此译保留行政登记和按名册搜捕的意味，又不把他们的具体身份说得过死。
- source_word: σὺν ταῖς γυναιξὶ καὶ τέκνοις
  choice: 连同他们的妻子儿女
  rationale: γυναιξί在这里按家庭关系最自然地指妻子；τέκνοις涵盖儿女。
- source_word: μετὰ ὕβρεως καὶ σκυλμῶν
  choice: 在凌辱和劫掠之下
  rationale: ὕβρις表示蛮横羞辱和暴虐对待；σκυλμοί带有剥夺、掠夺或摧残之意。正文保留两个并列概念，不将后者淡化为一般性的“虐待”。
- source_word: ἀποστεῖλαι πρὸς ἡμᾶς
  choice: 押送到我们这里
  rationale: 不定式受“下令”支配；鉴于被押者戴着铁制刑具，“押送”比单纯“送来”更符合语境。
- source_word: ἐν δεσμοῖς σιδηροῖς
  choice: 戴上铁镣
  rationale: δεσμοί泛指束缚人的刑具；“铁镣”在现代汉语中自然传达铁制拘束物，而不武断限定为某一种链具。
- source_word: πάντοθεν κατακεκλεισμένους
  choice: 四面严密禁锢
  rationale: πάντοθεν表示从各面，完成时分词强调他们处于彻底封闭、无法逃脱的状态。
- source_word: εἰς ἀνήκεστον καὶ δυσκλεῆ πρέποντα δυσμενέσιν βόθρον
  choice: 送入那无可救治、声名可耻、配给仇敌的深坑
  rationale: βόθρος直指坑穴，也可能形象地指毁灭之地；ἀνήκεστος保留“无法医治、无法挽回”的语义色彩， δυσκλεής表示恶名或羞耻，πρέποντα δυσμενέσιν则说明这样的坑被说成与仇敌相称。
