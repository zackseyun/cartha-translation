  text: But those who expected the opposite, and in their inborn malice pushed away what is good, continually turning aside to what is base,
translation:
  language: zh_hans
  text: 但那些期待相反的事的人，出于与生俱来的恶意，推开美善，不断偏向卑劣之事，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούναντίον
  choice: 相反结果
  rationale: 该词在此与“期待”连用，指他们所期待的是与美好结局相反的结果；补出“结果”使现代汉语自然，同时不限定具体所指。
- source_word: ἐκδεχόμενοι
  choice: 期待
  rationale: 此分词可指等候或预期；语境着重其内在预期，译作“期待”简洁自然。
- source_word: συμφύτῳ
  choice: 与生俱来的
  rationale: 原义为“共同生长的”，在此表示根深于其性情、仿佛生来便有；这一译法通俗且保留先天性的修辞。
- source_word: κακοηθείᾳ
  choice: 恶意
  rationale: 该名词表示恶劣品性、歹毒心肠或恶意；“恶意”既体现敌对的道德倾向，也避免“邪恶”“堕落”等过度强化。
- source_word: τὸ καλόν
  choice: 美善
  rationale: 中性名词化形容词概括道德上美好、良善之事；“美善”同时保留 καλός 所含的美与善，比单译“好事”更庄重。
- source_word: ἀπωσάμενοι
  choice: 推开
  rationale: 该中间语态分词有推拒、排斥之意；“推开”保留具体而有力的动作意象。
- source_word: διηνεκῶς
  choice: 不断
  rationale: 表示持续、经常不止的状态；“不断”符合现代汉语并准确表达其惯常性。
- source_word: φαῦλον
  choice: 卑劣之事
  rationale: 该词可指低劣、卑贱或道德上恶劣之物；“卑劣之事”保留其道德与品质双重色彩，而不把含义窄化为纯粹的“邪恶”。
- source_word: ἐκνεύοντες
  choice: 偏向
  rationale: 原词描绘转离正道、倾斜趋向某处；“偏向”在汉语中自然地呈现持续的道德倾向，并与后面的目标搭配顺畅。
