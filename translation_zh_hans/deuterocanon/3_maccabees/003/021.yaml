base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/021.yaml
  text: And in these matters[a], after making known to all their own countrymen our lack of resentment, and because of the alliance and the countless affairs entrusted to them from the beginning with sincerity, we decided to transform their status and deem them worthy of Alexandrian citizenship[b], and to appoint them as sharers in the things of the sanctuary.
translation:
  language: zh_hans
  text: 在这些事情上，我们已向他们全体同族人表明，我们不怀怨恨[a]；又因他们与我们结盟，并且我们从起初就以诚意把无数事务托付给他们，所以我们决定改变他们的身份，认为他们配得亚历山大公民权，并使他们分享与圣殿有关的事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不记前嫌”或“宽容他们”；希腊词指不记住别人所加的伤害，也不对人怀恨。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“与圣殿有关的事”；可能泛指与圣殿相连的神圣权利或职责，具体范围不明。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμνησικακίαν
  choice: 不记前嫌
  rationale: 该词指不记住别人所加的伤害、不怀怨恨。“不记前嫌”既保留不念旧恶的含义，也符合现代汉语表达。
- source_word: ὁμοφύλους
  choice: 同族人
  rationale: 该词指同一族群或民族的人；“同族人”比“同胞”更明确地保留族属含义，又避免现代种族术语。
- source_word: συμμαχίαν
  choice: 结盟
  rationale: 在王室政治语境中，该词表示联盟关系；译作“结盟”能体现其正式、政治性的色彩。
- source_word: τὰ πεπιστευμένα ... μύρια πράγματα
  choice: 把无数事务托付给他们
  rationale: 完成时被动分词与“无数事务”连用，表示许多已交由他们受托办理的事项；此译保留“托付”的信任意味。
- source_word: μετὰ ἁπλότητος
  choice: 以诚意
  rationale: 此处表示坦诚、真挚或出于善意，而非头脑简单；“以诚意”自然且不额外限定诚信关系的法律性质。
- source_word: ἐξαλλοιῶσαι
  choice: 改变他们的身份
  rationale: 该动词表示彻底改变；后文具体说明公民身份和圣所相关地位，因此补出“身份”能使汉语清楚，同时不把改变解释为民族或宗教同化。
- source_word: πολιτίας ... Ἀλεξανδρέων
  choice: 亚历山大公民权
  rationale: πολιτεία在此指城邦公民身份或权利；“亚历山大公民权”准确而简洁。
- source_word: καταξιῶσαι
  choice: 认为他们配得
  rationale: 该动词含判定或视为配得之意；此译保留其评价意味，胜于仅译作“赐给”。
- source_word: μετόχους
  choice: 参与者
  rationale: 该词指在某事上有份的人；“参与者”是自然的现代用语，不预设具体的宗教职分。
- source_word: τῶν εἰς ἱερὸν
  choice: 圣所相关事务
  rationale: 原文是压缩表达，直指“归于／关乎圣所的事”；此译保留范围的开放性，不擅自缩窄为祭司职务或某一项特权。
- source_word: καταστῆσαι
  choice: 立他们为
  rationale: 该动词表示使人处于某种身份或职位；“立他们为”兼具行政语气和自然汉语表达。
theological_decisions:
- issue: 所授公民身份和圣所相关地位的具体范围
  choice: 译为获得亚历山大公民权，并成为圣所相关事务的参与者，不进一步界定其法律和礼仪范围
  alternative: 理解为完全并入亚历山大公民共同体，或专指参与圣殿职事
  rationale: 原文明确提到亚历山大人的公民权及与圣所有关之事，却没有说明这些权利的完整法律内容，也没有限定为某种圣殿职分；译文因此保留其广度和张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。长句依照原文的王室诏令语气组织，以分号和关联词理清逻辑；避免古奥公文腔，也不把公民权或圣所参与解释为完全同化或特定宗派意义上的职分。
