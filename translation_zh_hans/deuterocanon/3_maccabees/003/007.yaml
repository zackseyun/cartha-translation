base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/007.yaml
  text: But they kept spreading talk about the disagreement over acts of homage and foods[a], saying that these people would not become of one way with either the king or his forces, but were hostile and strongly opposed to the affairs of state[b]; and they attached to them no ordinary fear.
translation:
  language: zh_hans
  text: 但他们不断散布有关敬礼和食物方面分歧的说法[a]，声称这些人不愿与王或王的军队同样行事，反而心怀敌意，强烈反对国家事务；他们还煽起了公众对这些人的极大恐惧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬礼”也可译作“敬拜”“致敬礼”或“俯伏行礼”。希腊词既可指宗教敬拜，也可指向尊位者表示敬意的礼仪；这里同时涉及礼仪与食物方面的不同。
    reason: lexical_alternative
  - marker: b
    text: 原文近于“他们把非同寻常的恐惧系在这些人身上”，意思是他们使公众对这些人产生了严重的恐惧或猜忌。
    reason: lexical_alternative
lexical_decisions:
- source_word: διάστασιν
  choice: 分歧
  rationale: 该词表示分离、差异或冲突；“分歧”既符合这里社会与宗教习俗不一致的语境，也不把指控过度强化为公开叛乱。
- source_word: προσκυνήσεων
  choice: 敬拜礼节
  rationale: 该词可指敬拜、俯伏或向尊位者致敬。“敬拜礼节”保留宗教敬拜与宫廷礼敬之间的张力，并以脚注说明其他译法。
- source_word: τροφῶν
  choice: 食物
  rationale: 原文仅用普通名词“食物”；不在正文中增译为“饮食律法”，以免加入原文未明说的解释。
- source_word: ἐθρύλουν
  choice: 不断散布……说法
  rationale: 未完成时表达持续或反复的动作，动词本身也带有传扬议论或流言的意味。
- source_word: ὁμοτρόπως ... γίνεσθαι
  choice: 同一种行事方式
  rationale: 此语涉及成为同样的方式或生活样式，不仅是思想意见一致；该译法保留对行为与生活方式之顺从的指控。
- source_word: ταῖς δυνάμεσιν
  choice: 王的军队
  rationale: δύναμις 可指力量、权势或军队；此处与王并列，在政治指控的语境下“王的军队”较为自然，同时承认“权势”仍是可能理解。
- source_word: δυσμενεῖς
  choice: 心怀敌意
  rationale: 该词表示敌视或不怀好意，比单纯的疏远更强。
- source_word: μέγα τι τοῖς πράγμασιν ἐναντιουμένους
  choice: 强烈反对国家事务
  rationale: τὰ πράγματα 在这里指公共政治事务或国家秩序；“强烈反对”传达 μέγα τι 所加强的程度。
- source_word: οὐ τῷ τυχόντι ... φόβῳ
  choice: 非同寻常的恐惧
  rationale: 这是表示“绝非轻微、绝非普通”的习语，强调所造成的恐惧甚大。
- source_word: περιήψαντο
  choice: 使人对这些人产生
  rationale: 该动词字面有把某物系上、加在某人身上的意味；中文正文按语境自然表达为使公众把严重恐惧加诸这些人，脚注补明其比喻。
theological_decisions:
- issue: προσκυνήσεων 是专指宗教敬拜，还是也包括宫廷礼敬
  choice: 正文译作“敬拜礼节”，脚注说明也可译“致敬、俯伏行礼”
  alternative: 敬拜；致敬礼；俯伏行礼
  rationale: 犹太人的独特习俗在王权环境中受到指控，该词可能兼有宗教与政治礼仪含义；不将其限定为单纯宗教敬拜或单纯宫廷礼节。
- issue: τοῖς πράγμασιν 的政治含义应表达多明确
  choice: 国家事务
  alternative: 公共事务；现行秩序
  rationale: 上下文把这些人描绘成王及其统治体系的威胁；“国家事务”清楚传达政治指控，又未具体增添叛乱等原文没有的内容。
- issue: ταῖς δυνάμεσιν 指军队还是权势机构
  choice: 王的军队
  alternative: 权势；当权者；王的势力
  rationale: 该词在此政治语境中很可能指王的军事力量，但词义范围较宽；正文采用具体而自然的理解，不据此引申额外的神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不断散布”体现持续造谣式议论；“同一种行事方式”有意保留原文关于生活与行为方式趋同的表达，而不缩减为仅仅“同意”。代词统一明确为“这些人”，避免中文中“他们”指代混淆。
