revisions:
- from: 但无论谁庇护犹太人中的任何一个[a]，从老人到幼儿，甚至还在吃奶的婴孩，都要连同全家遭受最惨酷的刑罚，被殴打致死[b]。
  to: 但无论谁庇护任何一个犹太人[a]，不论是老人、幼儿，甚至尚在哺乳的婴孩，他必与全家一同受最可憎的酷刑，遭殴打致死[b]。
  rationale: 修订只澄清中文主从关系：被庇护者的年龄范围由“不论是……”表达，受刑者则明确为庇护者及其全家。并以“最可憎的酷刑”较准确地呈现原文的强烈贬斥语气与酷刑含义。脚注锚点及其内容均予保留。
