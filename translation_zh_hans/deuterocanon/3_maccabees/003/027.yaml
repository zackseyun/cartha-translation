base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/027.yaml
  text: But whoever shelters any of the Jews[a], from old man to infant, even to those at the breast, will be beaten to death with the most hateful tortures[b], together with his whole household.
translation:
  language: zh_hans
  text: 但无论谁庇护任何一个犹太人[a]，不论是老人、幼儿，甚至尚在哺乳的婴孩，他必与全家一同受最可憎的酷刑，遭殴打致死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“犹太人中的任何一个”。
    reason: 说明原文的不定代词与部分属格结构。
  - marker: b
    text: 这里的希腊语动词指以击打施行的残酷处决；也可译作“用棍棒打死”，有人则理解为“在刑轮上折磨致死”。
    reason: 原词所指的具体古代处刑方式并不完全明确，保留可能的技术性译法。
lexical_decisions:
- source_word: σκεπάσῃ
  choice: 庇护
  rationale: 该词本义为遮盖，也可指隐藏、保护；在这道法令的语境中，指藏匿并庇护被搜捕者。“庇护”自然地兼顾保护与收留之意。
- source_word: τινα τῶν Ἰουδαίων
  choice: 犹太人中的任何一个
  rationale: 保留希腊文不定代词与部分属格的结构，明确表示犹太群体中的任何一人。
- source_word: ἀπὸ γεραιοῦ μέχρι νηπίου
  choice: 从老人到幼儿
  rationale: 按原文表达年龄范围的两个端点；γεραιός指年老者，νήπιος在此指年幼孩童。
- source_word: καὶ μέχρι ὑπομαστιγίων
  choice: 甚至还在吃奶的婴孩
  rationale: 罕见词ὑπομαστιγίων指尚在乳下、仍需哺乳的孩子；译文保留其年龄幼小和哺乳状态，同时符合现代汉语。
- source_word: ἐχθίσταις βασάνοις
  choice: 最惨酷的刑罚
  rationale: βασάνοις指折磨、酷刑；ἐχθίσταις为最高级，带有极其可憎、残酷的强烈色彩。“最惨酷”在庄重的法令语体中传达其力度。
- source_word: ὑποτυμπανισθήσεται
  choice: 被殴打致死
  rationale: 该动词表示以击打施行的残酷处决，具体古代刑具或程序并不完全明确；正文传达确定的核心意义，技术性可能另见脚注。
- source_word: πανοικίᾳ
  choice: 连同全家
  rationale: 该词意为全家或整个家户一同受罚；“全家”简明自然，在此可理解为整个家庭单位。
