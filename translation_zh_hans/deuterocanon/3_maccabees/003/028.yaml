base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/028.yaml
  text: And whoever wishes to inform against them will[a], for this, receive the property of the one who falls under the penalty, and two thousand drachmas from the royal treasury[b], and will be crowned with freedom.
translation:
  language: zh_hans
  text: 凡愿意告发他们的人，都将因此得到那被追究者[a]的财产，并从王室国库领取二千德拉克马，且将以自由为冠冕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被追究者”也可译作“受到司法审查的人”或“被裁定负有责任的人”。希腊语可指接受官方查核或承担法律责任；在本法令中带有惩处意味。
    reason: lexical_alternative
  - marker: b
    text: 直译为“将以自由为冠冕”，可能是说告发者将以获得自由身份作为奖赏。
    reason: cultural_note
lexical_decisions:
- source_word: μηνύειν
  choice: 告发
  rationale: 在法令和司法语境中，指向当局提供针对他人的消息；“告发”保留其控告性质，而非中性的“报告”。
- source_word: τὸν βουλόμενον
  choice: 凡愿意……的人
  rationale: 带冠词的分词泛指任何自愿响应法令者；此译自然表达公开招募告发者的意味。
- source_word: ἐφʼ ᾧ
  choice: 因此
  rationale: 连接告发行为与随后的奖赏，简洁保留因果或条件关系，不把句法解释得过细。
- source_word: οὐσίαν
  choice: 财产
  rationale: 此处指因法令而被没收并转交告发者的物质资产；“财产”符合司法行政语境。
- source_word: τοῦ ἐμπίπτοντος ὑπὸ τὴν εὔθυναν
  choice: 那被追究者的
  rationale: εὔθυνα可指查核、审查或法律责任；“被追究者”保留司法追责的宽度，避免直接断定已经定罪或受刑。
- source_word: ἐκ τοῦ βασιλικοῦ
  choice: 从王库
  rationale: 希腊文以形容词名词化，省略了款项或库藏；“王库”自然补明其所指。
- source_word: δραχμὰς δισχιλίας
  choice: 二千德拉克马
  rationale: 保留古代货币单位及历史背景，不换算成现代币值。
- source_word: τῆς ἐλευθερίας στεφανωθήσεται
  choice: 还将以自由为冠冕
  rationale: 保留στεφανόω的冠冕意象及其荣誉色彩，同时让“自由”可能指获释、解放或法律身份上的自由。
theological_decisions:
- issue: “以自由为冠冕”在王室法令中的含义
  choice: 直译并保留冠冕意象，正文作“以自由为冠冕”
  alternative: 作为奖赏获得自由／被释放为自由人
  rationale: 该表达可能实际指奴隶获释或取得自由身份，也可能带有荣誉性修辞。正文不把这种张力化约为单一法律程序，脚注说明其可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的法令语体。“凡愿意……的人”体现公开招募；“被追究者”保留希腊语司法审查与惩罚责任之间的含混；“以自由为冠冕”保留原文修辞，并以脚注说明可能的法律含义。
