base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/002.yaml
  text: While these matters were being arranged[a], a hostile rumor was spread against the nation among people of like mind for mistreatment, a pretext being given for their purpose[c][b], as though they were being hindered from their customary laws.
translation:
  language: zh_hans
  text: 这些事正在办理的时候，有诋毁这个民族的恶意传闻[a]，在那些一心要加害他们的人中流传；同时也给他们的意图提供了机会[b]，仿佛要阻止这个民族遵守自己的惯例法规[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶意传闻”也可译作“敌意消息”或“不利的传言”。
    reason: lexical_alternative
  - marker: b
    text: “机会”所译的希腊词也可指“由头”“借口”或“着力点”；“意图”也可译作“倾向”或“打算”。
    reason: lexical_alternative
  - marker: c
    text: “惯例法规”也可理解为“既定习俗”“传统律例”或“惯常的法度”。末句的希腊文将“这个民族”置于“阻止”的受事位置，行动者承接前文那些意图加害的人。
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: οἰκονομουμένων
  choice: 正在办理
  rationale: 该分词表示事情正被管理、安排或处置；“正在办理”自然地保留了行政处置的意味，又不擅自指明执行者。
- source_word: φήμη δυσμενὴς
  choice: 恶意传闻
  rationale: φήμη可指传闻或消息，δυσμενής表明敌意；结合煽动加害的语境，“恶意传闻”兼顾传播性与敌对色彩。
- source_word: ἐξέκειτο
  choice: 流传
  rationale: 该词本义有摆出、陈列之意，与φήμη连用时表示消息被散布或传开；“流传”符合现代汉语表达。
- source_word: κατὰ τοῦ γένους
  choice: 诋毁这个民族
  rationale: κατά在此表敌对方向，γένος指犹太人这一族群；“民族”避免现代生物种族含义，“诋毁”使传闻所针对的对象和敌意清楚可见。
- source_word: ἀνθρώποις συμφρονοῦσιν εἰς κακοποίησιν
  choice: 在那些一心要加害他们的人中
  rationale: συμφρονοῦσιν表示心意相同，εἰς κακοποίησιν指向伤害或虐待；此译自然表达这些人共同的敌对意向，而不把伤害限于身体暴力。
- source_word: ἀφόρμης ... διδομένης
  choice: 有了可乘之机
  rationale: ἀφορμή可指机会、由头或借口；“可乘之机”既表达获得行动条件，也保留其可能只是借题发挥的负面意味。
- source_word: διάθεσιν
  choice: 图谋
  rationale: διάθεσις可表示意向、倾向或安排；在共同加害的语境中译作“图谋”较自然，但不具体限定其后采取何种行动。
- source_word: τῶν νομίμων
  choice: 惯例法规
  rationale: τὰ νόμιμα兼有既定习俗、宗教惯例和法规的含义；“惯例法规”保留传统与规范两方面，不额外加入“祖传”的含义。
- source_word: κωλύωνται
  choice: 可以阻止
  rationale: 该形式在这里可作中间语态，配合宾格αὐτούς理解为敌对者阻止犹太民族遵行其法规；ὡς ἂν使这种说法带有假托或设想色彩，故以“仿佛……可以”表达。
theological_decisions:
- issue: γένος在针对犹太群体的敌对政治语境中的所指
  choice: 这个民族
  alternative: 这个族群／这个种族
  rationale: 经文指作为共同体的犹太人。“民族”能表达其群体身份，同时避免“种族”在现代汉语中可能引发的生物学联想。
- issue: ἀφορμή在敌对煽动语境中的语气
  choice: 可乘之机
  alternative: 机会／借口／由头
  rationale: 原词既可指机会，也可指借口或行动的出发点。“可乘之机”保留这种范围，并符合恶意图谋的上下文。
- issue: ὡς ἂν ἀπὸ τῶν νομίμων αὐτοὺς κωλύωνται的主客关系
  choice: 仿佛他们可以阻止这个民族遵守自己的惯例法规
  alternative: 仿佛这个民族受到阻挠，不能遵守自己的惯例法规
  rationale: αὐτούς为宾格，最自然地充当κωλύωνται的宾语，因此主语承接前面的敌对者；不过希腊文句法压缩，受阻的被动理解也曾被提出，故在注释中保留。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“办理”“流传”“图谋”“可乘之机”使复杂的希腊语分词结构易于普通读者理解；脚注保留φήμη、ἀφορμή、νόμιμα的词义范围以及末句压缩句法所产生的主客歧义。
