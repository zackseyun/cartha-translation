revisions:
- from: 这些事正在办理的时候，便有诋毁这个民族的恶意传闻[a]，在那些一心要加害他们的人中流传；这也使他们的图谋有了可乘之机[b]，仿佛他们可以阻止这个民族遵守自己的惯例法规[c]。
  to: 这些事正在办理的时候，有诋毁这个民族的恶意传闻[a]，在那些一心要加害他们的人中流传；同时也给他们的意图提供了机会[b]，仿佛要阻止这个民族遵守自己的惯例法规[c]。
  rationale: 修订保留原译对行政处置、敌意传闻、共同加害意向和既定规范的表达；同时按希腊文格位和中间语态的句法关系，明确末句是敌对者欲阻止该民族遵守其惯例法规。删去会倒置主客关系的脚注替代译法，并以较中性的“意图／机会”避免过度解释ἀφορμή与διάθεσις。
