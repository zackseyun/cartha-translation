base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/015.yaml
  text: We considered that the nations inhabiting Coele-Syria and Phoenicia should be nurtured not by the force of the spear[a], but with gentleness and great kindness[b], having gladly done them good.
translation:
  language: zh_hans
  text: 我们认为，应当不用枪矛的强力[a]，而以宽和与极大的仁厚来抚育住在科埃勒—叙利亚和腓尼基的各族[b]，并欣然施惠于他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“枪矛的强力”；这是以兵器象征军事强制的说法。
    reason: cultural_note
  - marker: b
    text: “抚育”原指乳养或养育孩子；这里用家长式意象描述统治者对属民的对待。也可译作“养育”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγησάμεθα
  choice: 我们认为
  rationale: 该词在这里表达经过考虑而形成的政策判断；“我们认为”自然、庄重，并保留审慎判断的语气。
- source_word: μὴ βίᾳ δόρατος
  choice: 不应凭枪矛之力
  rationale: βία指强力或暴力，δόρυ直指枪矛；译文保留具体的军事意象，不将其泛化为“武力”。
- source_word: ἐπιεικείᾳ
  choice: 以宽和
  rationale: ἐπιείκεια可指温和、宽厚、宽容；王政语境中“宽和”既体现与强制相反的态度，也符合现代汉语的庄重表达。
- source_word: πολλῇ φιλανθρωπίᾳ
  choice: 极大的仁厚
  rationale: φιλανθρωπία指对人的善意、仁慈或厚待；“仁厚”保留其人道和恩慈色彩，又比直译“爱人类”自然。
- source_word: τιθηνήσασθαι
  choice: 抚育他们
  rationale: 该动词本指乳养、养育儿童，此处以家长式比喻描写对属民的治理。“抚育”保留这一不寻常的修辞，而未弱化为“治理”或“对待”。
- source_word: τὰ κατοικοῦντα ... ἔθνη
  choice: 居住在……的各族
  rationale: ἔθνη在此指当地各民族或各族群；“各族”比“列国”更符合其作为区域居民的语境。
- source_word: Κοίλην Συρίαν
  choice: 叙利亚谷地
  rationale: Κοίλη Συρία是希腊化时期的地名，字面含“低洼、谷地”之意；“叙利亚谷地”采用现代中文可理解的地理译名，并避免生硬音译。
- source_word: εὖ ποιήσαντες ἀσμένως
  choice: 我们也乐意使他们得益处
  rationale: εὖ ποιέω表达使人得益、施惠，ἀσμένως表示乐意、欣然。汉语以并列分句重现压缩的分词结构，同时保留施惠者自述的口吻。
theological_decisions:
- issue: τιθηνήσασθαι所含的政治家长主义比喻
  choice: 保留“抚育”这一养育性意象
  alternative: 译作“治理他们”“管理他们”或“善待他们”
  rationale: 原文把统治属民描绘为乳养或养育儿童。改成中性的行政用语会遮蔽作者的政治修辞，因此保留其家长式张力，并用脚注说明。
- issue: εὖ ποιήσαντες与主句的关系
  choice: 以“我们也乐意使他们得益处”作为伴随性的自述
  alternative: 译作“因为我们乐意善待了他们”或“在欣然施惠于他们之后”
  rationale: 希腊语分词与主句的具体逻辑关系较为压缩，可能表达伴随、方式或先行情形。译文避免明确加上因果连接词，以保存这种开放性。
translation_notes:
  register: 采用现代、庄重而可读的书面汉语。“枪矛之力”保留原文鲜明的军事比喻；“宽和”“仁厚”呈现王室诏令式语域而不过度古雅；“抚育”有意保留原文不寻常的家长式政治修辞。
