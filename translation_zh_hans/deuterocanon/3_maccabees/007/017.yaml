base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/017.yaml
  text: When they arrived at Ptolemais[a], which is called Rose-bearing because of the nature of the place, where the fleet waited for them for seven days by their common decision,
translation:
  language: zh_hans
  text: 他们到了多利买，这城因当地的特色被称为“玫瑰城”[a]；船队按他们共同的决定，在那里等候他们七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语ῥοδοφόρον字面可指“带有玫瑰的”，也可指“出产玫瑰的”；这里用作多利买的描述性称号。
    reason: 说明称号的字面意义及可能的词义范围，避免将其限定为“盛产”。
lexical_decisions:
- source_word: Παραγενηθέντες
  choice: 他们来到
  rationale: 不定过去时分词在此表示先发生的时间背景；译为“来到”自然地引出后续事件。
- source_word: Πτολεμαΐδα
  choice: 多利买
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
- source_word: τὴν ὀνομαζομένην
  choice: 这城……被称为
  rationale: 保留原文对多利买的补充说明，同时使中文句式清楚自然。
- source_word: διὰ τὴν τοῦ τόπου ἰδιότητα
  choice: 因当地的特色
  rationale: ἰδιότης指某地独有的性质或特点；“当地的特色”保留其概括性，不擅自限定具体成因。
- source_word: ῥοδοφόρον
  choice: 盛产玫瑰之城
  rationale: 该复合形容词字面义为“带有／出产玫瑰的”；用作城市称号时，“盛产玫瑰之城”较自然，也保留玫瑰与地方特色之间的联系。
- source_word: ἐν ᾗ
  choice: 在那里
  rationale: 关系代词回指多利买，中文以地点指示语承接较为顺畅。
- source_word: προσέμεινεν αὐτοὺς
  choice: 等候他们
  rationale: προσμένω带宾语时在此表示留下等待某人，而非仅仅停留。
- source_word: ὁ στόλος
  choice: 船队
  rationale: στόλος在本语境中指集结的船只；“船队”准确而通俗。
- source_word: κατὰ κοινὴν αὐτῶν βουλήν
  choice: 照着他们共同的决定
  rationale: 既保留βουλή所含的商议、决定之意，也不进一步断定“他们”具体涵盖哪些人。
- source_word: ἡμέρας ἑπτά
  choice: 七天
  rationale: 宾格表示持续时间；中文在“等候”之后直接用“七天”即可清楚表达。
