  yaml_path: translation/deuterocanon/3_maccabees/007/008.yaml
  text: And we have ordered each and every one to return to his own home[a], with absolutely no one in any way harming them[b], nor insulting them over the things that happened contrary to reason.
translation:
  language: zh_hans
  text: 我们也已下令，所有人都要各自返回各自的住处[a]；任何人都绝不可用任何方式伤害他们，也不可因先前那些有悖情理的事[b]而辱骂他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各自返回自己的地方”。希腊语“自己的”（τὰ ἴδια）可指自己的住所、地方或产业。
    reason: lexical_alternative
  - marker: b
    text: 也可译“因先前那些不合情理地发生的事”。希腊语短语 παρὰ λόγον 直译为“有悖理性”或“不合情理”，此处修饰已经发生的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: 我们也已下令
  rationale: 完成时表示命令已经颁布并仍然有效；“下令”保留官方命令的力度，“已”体现完成时语气。
- source_word: ἑκάστῳ πάντας
  choice: 所有人都要各自
  rationale: 兼顾 πάντας 的全体范围和 ἑκάστῳ 的逐一、分配意味；现代汉语用“所有人都要各自”表达自然。
- source_word: εἰς τὰ ἴδια ἐπιστρέφειν
  choice: 返回自己的家园
  rationale: τὰ ἴδια 可指自己所属的地方、住所或产业；本段语境涉及获准返回，译作“家园”自然，同时以脚注保留范围较宽的可能。
- source_word: ἐν παντὶ τρόπῳ
  choice: 用任何方式
  rationale: 在否定结构中译作“任何方式”，清楚表达无论采取何种手段都不得加害。
- source_word: μηθενὸς αὐτοὺς τὸ σύνολον καταβλάπτοντος
  choice: 任何人都绝不可……伤害他们
  rationale: 将属格独立结构所表达的禁令转成自然汉语；“绝不可”传达 τὸ σύνολον 对否定的加强。
- source_word: μήτε ὀνειδίζοντος
  choice: 也不可……辱骂他们
  rationale: ὀνειδίζω 可指责骂、羞辱或讥讽；“辱骂”兼具言语攻击和使人受辱的意味，符合此处社会性凌辱的语境。
- source_word: περὶ τῶν γεγενημένων
  choice: 因先前……的事
  rationale: 分词完成时指已经发生、如今仍被提及的事件；“先前”简洁体现其既成性质。
- source_word: παρὰ λόγον
  choice: 有悖情理
  rationale: 贴近“违背理性、常理”的基本含义，又比生硬的“违反理性”更符合现代汉语；脚注保留其可描述事件发生方式的歧义。
