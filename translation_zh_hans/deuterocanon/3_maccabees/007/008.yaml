translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“所有人都要各自”保留原文全体与逐一并存的分配意味；分号划分返回命令与禁止加害、辱骂的规定。避免把 παρὰ λόγον 的修饰关系和语义范围解释得过窄，正文取“有悖情理”，脚注保留其他可能。
