  text: asserting that our affairs would never be secure because of the hostility these people have toward the nations[a], until this is accomplished.
translation:
  language: zh_hans
  text: 声称：由于这些人对列国[a]怀有敌意，在这事完成以前，我们的事务绝不会安定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各民族”。希腊文 τὰ ἔθνη 可指“列国”或“各民族”；在犹太语境中也可指“外邦人”。
    reason: 保留该词一般的民族／国家含义，以及其在犹太语境中可能具有的特定指称。
lexical_decisions:
- source_word: προφερόμενοι
  choice: 声称
  rationale: 该分词引出他们所提出的主张或论点；“声称”自然地保留了提出说法的语气，而不额外判定其真假。
- source_word: μηδέποτε
  choice: 绝不可能
  rationale: 与不定式 εὐσταθήσειν 连用，表达绝对否定；在汉语中译作“绝不可能安定”比直译“永不安定”更顺畅。
- source_word: εὐσταθήσειν
  choice: 安定
  rationale: 表示稳固、稳定；用于公共事务或国家处境时，“安定”准确而自然，且不引入“繁荣”等原文未明说的含义。
- source_word: τὰ πράγματα ἡμῶν
  choice: 我们的国事
  rationale: πράγματα 在此指共同体的公共事务或国家情势；结合王室政令语境，“国事”比宽泛的“事情”更贴切。
- source_word: διʼ ἣν ἔχουσιν οὗτοι πρὸς τὰ ἔθνη δυσμένειαν
  choice: 由于这些人对列国怀有敌意
  rationale: δυσμένεια 是敌意、仇视；τὰ ἔθνη 可指列国、各族，也可在犹太语境中指外族人，因此正文采用较宽泛的“列国”，并以脚注保留另一可能。
- source_word: μέχρι ἂν συντελεσθῇ τοῦτο
  choice: 直到此事完成为止
  rationale: συντελεσθῇ 表示完成、办成；τοῦτο 所指须由上下文确定，译文保留“此事”的未明指向。
theological_decisions:
- issue: τὰ ἔθνη 的所指范围
  choice: 列国
  alternative: 外族人（或外邦人）
  rationale: 这里是在转述政治指控，而非明确建立神学性的犹太人与外邦人对立。“列国”贴近希腊文并保留较宽范围；脚注说明犹太语境中的另一读法。
- issue: τοῦτο 的具体所指
  choice: 此事
  alternative: 把所指对象在正文中明确补出
  rationale: 本节希腊文本身只用中性指示代词“这事”，不应在缺少本节明示的情况下替读者确定其具体内容。
translation_notes:
  register: 采用现代、庄重而清楚的政令叙事语体。“我们的国事”体现公共政治语境；句法保留原文从“声称”引出的论断结构。
