  source_fidelity: 整体忠实呈现了至死忠于上帝、获得完全拯救、离城庆贺及感谢上帝的主要内容。末尾两个与格称号同指感谢对象，译文的同位处理正确。“他们身上铺满”可传达κατεστρωμένοι的装饰/覆盖意象，但中文宜改为更自然的“身上装饰着”。
  naturalness: “旋律齐备的赞美诗”在现代汉语中生硬，且“齐备”并非对παμμελέτοις音乐性修饰的自然表达；改作“优美的赞美诗”较通顺，并保留该罕见词所表达的充分音乐性/悦耳性而不作过度限定。“欢欣呼喊”可稍加展开，使两个并列名词的关系清晰。
  terminology: “上帝”“拯救”“救主”“列祖”均合乎庄重的现代中文圣经语体。保留“拯救／救恩”及“救主／拯救者”的脚注替代译法，恰当反映σωτηρία和σωτήρ在此处的语义范围。
