base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/016.yaml
  text: But those who had held fast to God even to death[a], having obtained complete deliverance, departed from the city, strewn with all kinds of very fragrant flowers, with rejoicing and shouting, giving thanks with praises and full songs of hymns to God, the holy Savior of Israel[b], the God of their fathers.
translation:
  language: zh_hans
  text: 但那些至死仍持守上帝的人，既已蒙受完全的拯救[a]，便离开了那城。他们身上装饰着各样芬芳无比的鲜花，欢欣鼓舞，放声呼喊，以颂赞和优美的赞美诗感谢他们列祖的上帝——以色列圣洁的救主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救”也可译作“救恩”。这里的希腊词可指眼前的搭救，也可带有更广的救恩含义。
    reason: lexical_alternative
  - marker: b
    text: “救主”也可译作“拯救者”。这里既强调上帝施行搭救，也可作为对上帝的称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέχρι θανάτου τὸν θεὸν ἐσχηκότες
  choice: 至死仍持守上帝的人
  rationale: ἔχω在这里不是“拥有”，而是持续忠于、紧紧持守；μέχρι θανάτου表示忠贞达到死亡的极限，并不暗示这些人实际上已经死去。
- source_word: παντελῆ σωτηρίαν ἀπόλαυσιν ἐσχηκότες
  choice: 既已蒙受完全的拯救
  rationale: σωτηρία在本段叙事中首先指他们脱离毁灭威胁，故译“拯救”；“完全”保留παντελής的加强语气，同时不排除更广的救恩含义。
- source_word: ἀνέζευξαν ἐκ τῆς πόλεως
  choice: 便离开了那城
  rationale: ἀναζεύγνυμι可指拔营、启程；此处重点是从城中出发离去，现代汉语译作“离开”自然且不过度具体化。
- source_word: παντοίοις εὐωδεστάτοις ἄνθεσι κατεστρωμένοι
  choice: 他们身上铺满了各样芬芳无比的鲜花
  rationale: καταστρώννυμι表达铺盖、装饰的景象；εὐωδεστάτοις是最高级，以“芬芳无比”保留其强化色彩。分句明确“他们身上”，避免误解为城市道路铺花。
- source_word: μετʼ εὐφροσύνης καὶ βοῆς
  choice: 欢欣呼喊
  rationale: εὐφροσύνη是节庆性的喜乐，βοή是响亮的呼声；合译为“欢欣呼喊”，简洁保留欢乐与声势。
- source_word: ἐν αἴνοις καὶ παμμελέτοις ὕμνοις
  choice: 以颂赞和旋律齐备的赞美诗
  rationale: αἶνοι译作“颂赞”。罕见词παμμελέτοις含“各种旋律/完整乐调”的加强意味，“旋律齐备”保留音乐性，又不武断限定为齐声或高声歌唱。
- source_word: τῷ θεῷ τῶν πατέρων αὐτῶν
  choice: 他们列祖的上帝
  rationale: 保留祖先—圣约语境中的传统称谓，并采用现代中文圣经语体中庄重而易懂的表达。
- source_word: ἁγίῳ σωτῆρι τοῦ Ἰσραήλ
  choice: 以色列圣洁的救主
  rationale: σωτήρ在眼前事件中可指施行搭救者，也具有神圣称号的庄重色彩；主文用“救主”兼顾两者，脚注列出“拯救者”这一语境性译法。
theological_decisions:
- issue: 叙事性搭救语境中σωτηρία与σωτήρ的译法
  choice: σωτηρία译“拯救”，σωτήρ译“救主”
  alternative: 分别译作“救援/拯救者”，或统一译作“救恩/救主”
  rationale: 经文同时叙述一次具体的历史性脱险，并以颂赞语言称呼上帝。主文以“拯救”呈现事件，以“救主”保留称号的庄重和较宽广的神学回响，不把两层意义强行化约为其中之一。
- issue: 末尾同位关系
  choice: “他们列祖的上帝——以色列圣洁的救主”
  alternative: 将“以色列圣洁的救主”和“他们列祖的上帝”处理为两个并列对象
  rationale: 希腊语的与格短语共同指向感谢的对象；破折号清楚表示“以色列圣洁的救主”是对“他们列祖的上帝”的进一步说明。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。长句依希腊文逻辑分为两句，以免修饰关系含混；保留赞美场面的节庆声势和末尾称号的崇高语气。所有脚注标记均已置于正文相应词语之后。
