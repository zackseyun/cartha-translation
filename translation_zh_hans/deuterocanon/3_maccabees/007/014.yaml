  yaml_path: translation/deuterocanon/3_maccabees/007/014.yaml
  text: They themselves also killed along the road any compatriot of the defiled people who had fallen in with them[a], and they did away with them as examples.
translation:
  language: zh_hans
  text: 他们自己也杀害路上遇到的受玷污者中的本族人，又以示众儆戒的方式将他们处死。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以示众儆戒的方式”或译“以杀一儆百的方式”，也可理解为“使他们公开蒙羞”。希腊语 μετὰ παραδειγματισμῶν 可着重于这种杀害所带来的公开警戒或羞辱作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ τε
  choice: 他们自己也
  rationale: 保留代词的强调作用，也表达 τε 的连接意味，突出他们亲自参与了行动。
- source_word: τὸν ἐμπεσόντα
  choice: 遇见的
  rationale: ἐμπίπτω 在此结合“路上”的语境，指偶然碰见或遭遇；“遇见”自然明白，也不额外断定此人是落入他们手中。
- source_word: τῶν μεμιαμμένων
  choice: 那些受玷污者中的
  rationale: 完成时被动分词表示被视为已经遭玷污的人；属格按部分属格处理。译作“受玷污”保留其可能涉及礼仪或道德污秽的含义，不擅自限定。
- source_word: ὁμοεθνῆ
  choice: 本族人
  rationale: 指同属一个民族或族群的人。“本族人”在现代汉语中简洁自然，并保留族群关系。
- source_word: κατὰ τὴν ὁδὸν
  choice: 路上
  rationale: 交代相遇或行动发生的地点；“路上”符合现代汉语习惯。
- source_word: ἀπέκτεννον
  choice: 杀死
  rationale: 直接表达杀害。希腊语未完成时可含反复发生之意，汉语以“把路上遇见的……杀死”这一泛指结构体现。
- source_word: μετὰ παραδειγματισμῶν
  choice: 示众，以儆效尤
  rationale: 该短语可强调公开羞辱、警戒他人或惩一儆百的作用；正文兼顾公开示范和警戒意味，脚注保留其他可能。
- source_word: ἀνήρουν
  choice: 处死
  rationale: ἀναιρέω 在此指杀死、除掉。译作“处死”与前面的“杀死”形成近义复述，同时保留致死含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“本族人”避免较古雅的“同胞族人”，“受玷污”则保留原文在礼仪与道德层面之间的含混。正文保留两个近义的杀害动词，以反映希腊文 ἀπέκτεννον 与 ἀνήρουν 的并列。
