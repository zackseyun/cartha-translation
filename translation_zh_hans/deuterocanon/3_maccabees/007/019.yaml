  yaml_path: translation/deuterocanon/3_maccabees/007/019.yaml
  text: And after they had been brought down in peace[a], with the fitting thanksgivings[b], there also they resolved to keep these days as joyful ones for the whole time of their sojourning.
translation:
  language: zh_hans
  text: 他们被平安地带到那里后，在合宜的感恩赞美中[a]，也在那里决定：在他们寄居的整个时期[b]，都要把这些日子当作欢乐的日子来守。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “感恩赞美”所译的希腊词也可指“承认”或“宣认”；这里的欢庆语境更支持“感恩、赞美”的意思。
    reason: lexical_alternative
  - marker: b
    text: “寄居”指以外来居民或暂居者的身份生活，不一定表示正式的流亡。
    reason: cultural_note
lexical_decisions:
- source_word: καταχθέντες
  choice: 被带回去后
  rationale: 保留不定过去时被动分词的被动意义。κατάγω可指“带下去”或“带回去”；结合上下文，此处自然理解为平安返回某地，但不增添原文未明说的具体目的地。
- source_word: μετʼ εἰρήνης
  choice: 平安地
  rationale: 表达在安全、和平的状态下返回，符合现代汉语习惯。
- source_word: ἐν ταῖς πρεπούσαις ἐξομολογήσεσιν
  choice: 在合宜的感恩赞美中
  rationale: ἐξομολόγησις可指承认、称谢或赞美；节庆语境偏向向上帝感恩赞美，同时用脚注保留其词义范围。
- source_word: ἔστησαν
  choice: 决定
  rationale: 此处与不定式连用，表示立定主意或作出决定；译作“决定”比逐字译作“站立”自然。
- source_word: ἄγειν τὰς ἡμέρας
  choice: 把这些日子……来守
  rationale: ἄγω与节期或日子连用时可表示遵守、庆祝；“守”简洁地保留礼仪性和持续遵行的含义。
- source_word: ἐπὶ τὸν τῆς παροικίας αὐτῶν χρόνον
  choice: 在他们寄居的整个时期
  rationale: παροικία指作为外来居民的居住或寄居，不必然意味着正式流亡；“寄居”保留这种身份意味。
- source_word: εὐφροσύνους
  choice: 当作欢乐的日子
  rationale: 该形容词修饰“这些日子”，说明这些日子被定为欢乐的日子，而不只说明守节时的主观心情。
