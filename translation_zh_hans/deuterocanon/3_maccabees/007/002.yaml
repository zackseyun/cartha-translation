  source_fidelity: “我们自己和我们的儿女也都安好”准确传达ἐρρώμεθα及强调性的καὶ αὐτοὶ καὶ τὰ τέκνα ἡμῶν。“使各项谕令为我们顺利施行”却将κατευθύνοντος（引导、指引）扩展为“使……顺利施行”，加入原文未明说的顺利、成效意味，也弱化了动词本身的引导义。
  naturalness: 原译整体庄重通顺，但“使各项谕令为我们顺利施行”带有较强的现代行政搭配，且“为我们”所修饰的对象不够清楚。改为“为我们指引这些命令”较贴近原文，现代汉语亦可理解；保留原文略显紧凑、未充分说明的关系。
  terminology: “伟大的上帝”适当保留ὁ μέγας θεός的尊崇语气；“谕令”可译προστάγματα，但“命令”更直接、通用，且不额外强化王室诏令色彩。“所定意的”可成立，不过“所选择的”更直接对应προαιρούμεθα，并与脚注所列替代义保持一致。
