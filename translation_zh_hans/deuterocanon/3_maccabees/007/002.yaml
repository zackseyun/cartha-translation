  yaml_path: translation/deuterocanon/3_maccabees/007/002.yaml
  text: And we ourselves and our children are well[a], as the great God directs his commands for us, just as we choose.
translation:
  language: zh_hans
  text: 我们自己和我们的儿女也都安好；伟大的上帝正如我们所选择的，为我们指引这些命令。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所选择的”也可译作“所定意的”或“所打算的”。
    reason: 原文 προαιρούμεθα 可指选择、偏好或经过考虑而定下的意图。
lexical_decisions:
- source_word: ἐρρώμεθα
  choice: 都安好
  rationale: 该完成时被动形态的动词在书信问安语境中惯指安康、情况良好；“安好”自然庄重，也不把含义局限于身体健康。
- source_word: καὶ αὐτοὶ καὶ τὰ τέκνα ἡμῶν
  choice: 我们自己和我们的儿女也都
  rationale: 保留 αὐτοὶ 的强调意味，并以“儿女”表达 τέκνα，不限于男性后代。
- source_word: κατευθύνοντος
  choice: 使……顺利施行
  rationale: κατευθύνω 有使之正直、引导并使之顺利推进之意；在谕令语境中，“使……顺利施行”比字面的“指引”更符合现代汉语搭配。
- source_word: τοῦ μεγάλου θεοῦ
  choice: 伟大的上帝
  rationale: 直接保留定冠词短语中的尊崇称谓和形容词强调。
- source_word: τὰ προστάγματα
  choice: 各项谕令
  rationale: πρόσταγμα 指命令、法令或训令；本节带有王室公文语体，“谕令”既切合语境，也不擅自添加原文没有明说的所属代词。
- source_word: ἡμῖν
  choice: 为我们
  rationale: 保留与说话者相关或对其有利的与格意义，不把它过度解释成“赐给我们”。
- source_word: καθὼς προαιρούμεθα
  choice: 正如我们所定意的
  rationale: προαιρέομαι 表示经过考虑而选择、打算或立定意向；“定意”兼顾主动选择和既定意图。
theological_decisions:
- issue: 上帝的引导与人的意愿在 κατευθύνοντος…καθὼς προαιρούμεθα 中的关系
  choice: 并列呈现上帝使谕令顺利施行与说话者所定的意向
  alternative: 可译为“伟大的上帝照着我们的选择引导各项命令”，或将人的意愿弱化为单纯计划
  rationale: 希腊文同时陈述上帝的行动与人的 προαίρεσις，却未解释二者的因果或主从关系；译文保留这种张力，不将其系统化为神意决定论或人的自主论。
translation_notes:
  register: 采用现代、庄重且易懂的公文语体。“安好”符合书信问安表达；“谕令”贴合王室诏书场景。分号呈现问安陈述与随后原因或伴随情况之间的联系，同时避免把希腊文分词结构解释得过死。
