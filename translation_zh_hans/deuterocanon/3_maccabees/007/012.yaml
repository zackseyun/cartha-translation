base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/012.yaml
  text: And when he accepted that they were speaking the truth and encouraged them[a], he gave them full permission, so that they might destroy those who had transgressed the law of God throughout every place under his kingdom, with boldness[b], without any royal authority or oversight.
translation:
  language: zh_hans
  text: 他认可他们所说的是实情，又勉励了他们，就给了他们完全的许可，让他们可以在他王国辖下各处，放胆[a]消灭那些违犯了上帝律法的人，无需任何王室方面的授权或查验[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “放胆”也可译作“坦然行事”“公开行动”或“自由行动”。
    reason: παρρησία涵盖勇敢、公开和不受拘束等相近含义；此处具体侧重并不完全确定。
  - marker: b
    text: 此处也可较字面地理解为“没有任何王室权力或监察”。ἐξουσία可指权力、权限或授权，ἐπίσκεψις可指监察、查验或过问；该短语可能强调不需要进一步的王室直接介入或复核。
    reason: 保留ἐξουσία与ἐπίσκεψις的行政语义范围，并避免因本节前文已有国王许可而强行消除末句的语义张力。
lexical_decisions:
- source_word: τἀληθὲς αὐτοὺς λέγειν
  choice: 他们所说的是实情
  rationale: τἀληθές是带冠词的中性形容词，作名词使用；与λέγειν连用，意为“说的是实情／说真话”。此译法在现代汉语中自然，并保留对其陈述真实性的认可。
- source_word: παραδεξάμενος
  choice: 认可
  rationale: 该分词表示接受并承认他们的话为真；“认可”比单纯“听取”更准确地表达此意。
- source_word: παραινέσας
  choice: 勉励他们
  rationale: παραινέω可指劝告、劝勉或鼓励。此处位于认可其陈述与授予许可之间，“勉励”保留积极促进行动的语气，又不过度解释为命令。
- source_word: ἄδειαν πάντων
  choice: 充分的许可
  rationale: ἄδεια表示许可或行动自由，πάντων强化其范围；“充分的许可”简洁地传达全面准许之意。
- source_word: τοὺς παραβεβηκότας τοῦ θεοῦ τὸν νόμον
  choice: 那些违犯了上帝律法的人
  rationale: 完成时分词παραβεβηκότας表示已经违犯、且因而处于违犯者身份的人；“违犯了”保留这一完成性。
- source_word: ἐξολεθρεύσωσιν
  choice: 消灭
  rationale: 该动词语气强烈，表示彻底毁灭。“消灭”没有淡化原文的暴力程度，也未加入原文没有的司法或神学解释。
- source_word: κατὰ πάντα τὸν ὑπὸ τῆς βασιλείας αὐτοῦ τόπον
  choice: 在他王国辖下各处
  rationale: κατὰ πάντα…τόπον表达遍及统治范围内每一处的分布性范围；此译简洁、自然且忠于原文。
- source_word: μετὰ παρρησίας
  choice: 放胆
  rationale: παρρησία可表示坦然、公开或自由无惧地行动。“放胆”保留其勇敢而不受拘束的核心含义，同时以脚注提示其他可能。
- source_word: ἄνευ πάσης βασιλικῆς ἐξουσίας καὶ ἐπισκέψεως
  choice: 不受任何王室权力或监察
  rationale: 直译保留ἐξουσία“权力／授权”与ἐπίσκεψις“监察／查验”的搭配及其语义张力，不擅自断定是没有正式授权，还是没有王室人员直接介入。
theological_decisions:
- issue: 对违犯上帝律法者施行暴力的道德与神学表述
  choice: 直接译为获准“消灭”违犯律法的人，不弱化措辞，也不增添辩护或谴责。
  alternative: 将其缓和译为“惩罚”“清除”，或补充说明其正当性。
  rationale: ἐξολεθρεύσωσιν明确表示毁灭。译文应呈现原文的严厉程度，并让原文自身的神学张力保持可见。
- issue: 王室许可与末句“不受王室权力或监察”之间的张力
  choice: 在正文中保留近乎直译的表达，并在脚注列出“无需王室授权或查验”的可能理解。
  alternative: 明确解释为“国王不直接介入或监督”。
  rationale: 本节先说国王授予许可，末句却使用ἄνευ…βασιλικῆς ἐξουσίας，存在真实的语义张力；不应在正文中强行消解。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“认可”“勉励”“充分的许可”“消灭”保持叙事正式感；对末句采取较贴近希腊文的表达，以保留其行政含义及内在张力。
