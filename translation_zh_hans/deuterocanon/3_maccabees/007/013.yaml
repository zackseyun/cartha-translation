base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/013.yaml
  text: Then the priests of these people and the whole multitude[a], having praised him as was fitting, cried out[b], “Hallelujah!” and departed with joy.
translation:
  language: zh_hans
  text: 那时，这些人的祭司和全体民众以合宜的方式颂赞了他[a]，又高呼：“哈利路亚！”[b]然后欢欢喜喜地离去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”最可能指上帝；希腊文在这里没有再次明说所指的名词。
    reason: alternative_reading
  - marker: b
    text: 也可音译作“阿利路亚”；希腊文保留了源自希伯来语的礼仪欢呼语。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατευφημήσαντες
  choice: 颂赞了
  rationale: 该分词表示公开而热烈地称颂、赞美；“颂赞”既保留庄重的敬拜语气，也不把词义限定为某一种特定礼仪行为。
- source_word: αὐτόν
  choice: 他
  rationale: 原文是阳性单数宾格代词。上下文最可能指上帝，但希腊文没有在本节明说“上帝”，因此正文保留代词。
- source_word: ὡς πρέπει ἦν
  choice: 照着合宜的方式
  rationale: 该短语表示所行之事恰当、相称；此译法自然表达其规范意味，同时不额外说明为何合宜。
- source_word: οἱ τούτων ἱερεῖς
  choice: 这些人的祭司
  rationale: τούτων是指示代词属格复数，直指“这些人”；译文保留这一指示作用，而不笼统改成“他们的祭司”。
- source_word: πᾶν τὸ πλῆθος
  choice: 全体民众
  rationale: πᾶν强调全部，πλῆθος指聚集的大群人；“全体民众”在现代汉语中清楚自然，并保留集合意义。
- source_word: ἐπιφωνήσαντες
  choice: 高呼
  rationale: 该分词描述扬声喊出呼声；“高呼”简洁、庄重，适合随后的礼仪性欢呼。
- source_word: ἀλληλουιά
  choice: 哈利路亚
  rationale: 这是由希伯来语进入希腊文的礼仪欢呼语；采用现代中文读者熟悉的音译，保留其敬拜性质。
- source_word: μετὰ χαρᾶς
  choice: 欢欢喜喜地
  rationale: 该介词短语直指伴随离去的喜乐状态；叠词表达自然鲜明，又不增加原文没有的原因。
- source_word: ἀνέλυσαν
  choice: 离去了
  rationale: 在集会结束的语境中，该动词表示离开或散去；“离去了”能同时适用于祭司和全体民众，且不强行限定为分散行动。
theological_decisions:
- issue: αὐτόν所指的对象
  choice: 正文译作“他”，脚注说明最可能指上帝。
  alternative: 直接译作“上帝”。
  rationale: 上下文强烈支持上帝为所指对象，但本节希腊文只用代词。保留“他”可忠实呈现原文的指代形式和有限歧义，避免在正文中补入未明说的名词。
- issue: ἀλληλουιά的处理
  choice: 音译为“哈利路亚”。
  alternative: “阿利路亚”或意译为“你们要赞美耶和华”。
  rationale: 希腊文本身保留了源自希伯来语的礼仪呼声。音译能保留其固定敬拜用语的性质；脚注列出另一常见音译，不在正文中将其解释性展开。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“颂赞”“高呼”保留公共敬拜场景的肃穆感；“欢欢喜喜地离去了”使结句自然流畅。脚注标记均紧跟所解释的词语，避免英文咨询层中标记位置与注释内容不一致的问题。
