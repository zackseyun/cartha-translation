  yaml_path: translation/deuterocanon/3_maccabees/007/001.yaml
  text: 'King Ptolemy Philopator to the generals in Egypt and to all who are appointed over affairs: greetings and good health[a][b].'
translation:
  language: zh_hans
  text: 托勒密·菲洛帕托尔王致埃及各地的将领和所有受命主管政务的人：愿你们安好康健。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“问安并愿强健”；这是希腊书信中表达问候和祝愿安康的惯用格式。
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεὺς
  choice: 王
  rationale: 此处无冠词，作为书信开头的王室称号；中文置于姓名及称号之后，以“……王”自然表达。
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: 托勒密·菲洛帕托尔
  rationale: 按希腊语音译君王姓名及称号，不把称号另行意译，以避免加入原文未明说的解释。
- source_word: τοῖς κατʼ Αἴγυπτον στρατηγοῖς
  choice: 埃及各地的将领
  rationale: στρατηγοῖς 保留军事兼行政职衔的“将领”；κατʼ Αἴγυπτον 可指分布在埃及境内各处，译作“埃及各地”体现其分布意味。
- source_word: πᾶσιν τοῖς τεταγμένοις ἐπὶ πραγμάτων
  choice: 所有受命主管政务的人
  rationale: τεταγμένοις 表示被委派、任命；ἐπὶ πραγμάτων 表示负责事务，在王室公函语境中以“政务”自然表达行政事务，同时保留“人”而不径直限定为某一种官职。
- source_word: χαίρειν καὶ ἐρρῶσθαι
  choice: 愿你们安好康健
  rationale: 两词共同构成希腊书信的惯用问候公式。中文采用正式而自然的祝愿语；“安好”对应问候功能，“康健”保留 ἐρρῶσθαι 所含强健、健康之意。
