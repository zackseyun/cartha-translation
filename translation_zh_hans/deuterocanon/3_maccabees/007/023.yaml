translation:
  language: zh_hans
  text: 以色列的拯救者永远当受颂赞。阿们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: 当受颂赞
  rationale: 这是祝颂用语，表达该对象配受称颂；比单纯描述“有福”更符合此处对上帝的颂赞语境。
- source_word: ὁ ῥύστης Ἰσραήλ
  choice: 拯救以色列的那一位
  rationale: ῥύστης 指施行解救、救拔者；用“那一位”保留希腊文名词化表达的庄重感，同时不额外补入原文未明说的称谓。
- source_word: εἰς τοὺς ἀεὶ χρόνους
  choice: 永远
  rationale: 该短语直指延续至一切常存的世代或时期，在汉语祝颂中以“永远”自然而准确。
- source_word: ἀμήν
  choice: 阿们
  rationale: 沿用现代汉语圣经传统中的音译，表示确认和诚愿如此。
theological_decisions:
- issue: 是否将“拯救者”明确译作“上帝”或“主”
  choice: 不补出神名或称号，译作“拯救以色列的那一位”
  alternative: 拯救以色列的上帝／主
  rationale: 上下文或可明确所指，但本节希腊文本身只用带冠词的 ῥύστης；不补称号可避免超出原文，同时保留其指称。
- issue: 祝颂语是描述“有福”还是宣告“当受颂赞”
  choice: 当受颂赞
  alternative: 是有福的／是可称颂的
  rationale: 用于神圣拯救者时，Εὐλογητός 通常承担颂赞功能；“当受颂赞”在现代汉语中更清楚地表达这一功能。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。全句保持原文祝颂与结语的凝练形式，不添加脚注。
