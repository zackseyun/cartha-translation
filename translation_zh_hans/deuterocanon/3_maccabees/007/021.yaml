  text: each one to his former place[a], having obtained authority among their enemies with glory and fear[b], their whole body of possessions having been shaken by none.
translation:
  language: zh_hans
  text: 每个人都回到原来的地方[a]；他们在仇敌中拥有权势，带着荣耀和畏惧[b]；他们的一切财物也没有受到任何人的扰动。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里很简略，直译是“到原先的”；也可能指“回到他们从前所有的地方或境况”。
    reason: lexical_alternative
  - marker: b
    text: “畏惧”也可能指他们使仇敌感到惧怕；原文没有明确说明是谁在畏惧。
    reason: ambiguity
  - marker: c
    text: 原文也可译作：“他们全部的财物都没有受到任何人的侵扰。”该动词基本指“摇动、扰乱或搅扰”；本句没有说明具体以何种方式造成损害。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: 各人都
  rationale: 保留分配性的单数意义，同时符合现代汉语表达。
- source_word: εἰς τὴν ἔμπροσθεν
  choice: 回到原来的地方
  rationale: 原文是省略性短语，直指“先前的／原来的”某处或境况；结合复归的语境，以“原来的地方”表达最自然，但用脚注保留其他可能。
- source_word: ἐν τοῖς ἐχθροῖς ἐξουσίαν ἐσχηκότες
  choice: 在仇敌中有了权势
  rationale: 保留ἐν加与格的关系性表达，不武断改成“胜过／辖制仇敌”；完成时分词所表达的既得状态译作“有了”。
- source_word: μετὰ δόξης καὶ φόβου
  choice: 带着荣耀和畏惧
  rationale: 尽量直译两个名词，不预先判定“畏惧”是他们自己的感受，还是他们在别人心中所引起的惧怕。
- source_word: τὸ σύνολον
  choice: 没有一样
  rationale: 在财物的整体范围内作总括表达，使压缩的希腊语在中文中清楚自然。
- source_word: διασεισθέντες
  choice: 受到侵扰
  rationale: 该词可指摇动、搅扰、威吓或勒索；在财物受保全的语境中，“受到侵扰”既通顺，也不过度限定具体损害方式。
- source_word: τῶν ὑπαρχόντων
  choice: 他们的财物
  rationale: 中性复数实体化用法常指所有物、财产；此处译为“财物”简洁清楚。
theological_decisions:
- issue: 荣耀和畏惧的承受者或来源
  choice: 保留“带着荣耀和畏惧”的开放表达
  alternative: “享有荣耀，令人畏惧”或“满有荣耀和敬畏”
  rationale: 希腊语没有明确说明φόβος是他们所怀的畏惧，还是仇敌对他们的惧怕；正文不替原文消除这一张力。
translation_notes:
  register: 采用庄重而现代的叙事语体。“回到原来的地方”“有了权势”“受到侵扰”均为普通读者易懂的表达；对省略结构、介词关系及“畏惧”的指向不作过度解释，并以脚注保存原文歧义。
