  naturalness: “各人都”略显重复，“至于他们的财物，没有一样受到任何人的侵扰”也稍显绕。改为“每个人都……；他们的一切财物也没有受到任何人的扰动”更符合现代汉语叙事，同时保持庄重。
  terminology: “仇敌”“权势”“荣耀”“畏惧”“财物”均合适。“在仇敌中拥有权势”保留ἐν τοῖς ἐχθροῖς的关系性含混，不擅自定为“辖制仇敌”。
