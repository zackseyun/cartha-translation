base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/003.yaml
  text: Some of our friends[a], being more constantly at our side out of malice, persuaded us that the Jews under our rule, after being gathered together in groups[b], should be punished with unusual penalties as rebels.
translation:
  language: zh_hans
  text: 有些朋友[a]出于恶意，比别人更常在我们身边，劝服我们：应以异常的刑罚[c]惩处那些在我们统治下、已结集为各个团体[b]的犹太人，因为他们已经叛离[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朋友”在王室语境中也可指君王的亲信或廷臣。
    reason: lexical_alternative
  - marker: b
    text: “团体”也可译为“组织”或“社团”。原文所用词可指有组织的集体单位，其在此处的确切所指不完全确定。
    reason: lexical_alternative
  - marker: c
    text: “异常的刑罚”也可译为“奇异的惩罚”或“异乎寻常的刑罚”；原词含有陌生、奇异或非常规的意思。
    reason: lexical_alternative
  - marker: d
    text: “叛离”在此较可能指政治性的反叛或脱离统治，而非特指宗教性的“背教”。原文分词与前文的句法关联不完全明确，也可理解为说明施罚的缘由或对受罚者的定性。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: τῶν φίλων τινὲς
  choice: 有些朋友
  rationale: φίλοι在王室语境中也可指君王身边的亲信或廷臣，但原词本义为“朋友”，正文不额外限定其官职，以保留语义范围。
- source_word: κατὰ κακοήθειαν
  choice: 出于恶意
  rationale: 该短语表示由恶劣心性或敌意所驱使；“出于恶意”自然传达其动机。
- source_word: πυκνότερον ἡμῖν παρακείμενοι
  choice: 常常在我们身边怂恿
  rationale: παράκειμαι表示在旁、接近，πυκνότερον强调频繁或紧密；结合συνέπεισαν，汉语以“在身边怂恿”自然表达他们凭借反复亲近而施加影响。
- source_word: συνέπεισαν ἡμᾶς
  choice: 终于说服了我们
  rationale: 动词表示劝服、使人听从；“终于”体现反复进言后成功说服的语境效果，但不改变核心动作。
- source_word: τοὺς ὑπὸ τὴν βασιλείαν Ἰουδαίους
  choice: 我们统治下的犹太人
  rationale: 此处指处于君王治权之下的人；按王者第一人称诏令语境译为“我们统治下”最清楚。
- source_word: συναθροίσαντας τὰ συστήματα
  choice: 按群体聚集起来
  rationale: συναθροίσαντας在句法上形式为宾格阳性复数主动分词，与“犹太人”一致；τὰ συστήματα可表示群体、组织体。原句结构生硬且含混，此译保留“聚集”及集体单位的概念，不武断指定为正式社团。
- source_word: κολάζεσθαι
  choice: 施以……刑罚
  rationale: 该不定式表示使其受惩罚；汉语用被处置含义明确的“施以刑罚”符合诏令体。
- source_word: ξενιζούσαις ... τιμωρίαις
  choice: 罕见的刑罚
  rationale: ξενιζούσαις在此表示令人陌生、异乎寻常；“罕见”保留异常、非常规的意味。
- source_word: ἀποστάντων
  choice: 以叛乱者的罪名
  rationale: ἀφίστημι在政治语境中指背叛、反叛；属格复数分词与前文犹太人的格不直接一致，可能带有给予定性或指控的压缩表达，因此译作被当作叛乱者惩处，避免加入宗教意义的“背教”。
theological_decisions:
- issue: ἀποστάντων是政治反叛还是宗教背教
  choice: 政治性的叛乱者
  alternative: 宗教性的背教者
  rationale: 上下文是君王对治下犹太人采取国家刑罚的诏令语境，政治反叛或脱离统治更合适；译成“背教”会加入原文未必具有的宗教限定。
- issue: τὰ συστήματα的具体所指
  choice: 群体
  alternative: 正式社团、组织或共同体
  rationale: σύστημα可指组成的整体、团体或组织；本节无法确定是否特指正式社团，故正文采用较宽的“群体”，并以脚注保留其他可能。
- issue: ἀποστάντων与刑罚之间的关系
  choice: 作为加于犹太人的叛乱指控
  alternative: 明确陈述他们已经实际叛乱
  rationale: 分词在本句中的格与指代关系不够平顺，且整句出自对先前决策的回顾；“以叛乱者的罪名”既表达惩罚依据，也避免替叙述者断定指控属实。
translation_notes:
  register: 采用现代、庄重而易懂的诏令叙述语体。保留王者复数自称“我们”。正文将希腊文压缩且略显生硬的句法转化为自然汉语，同时以脚注标示“朋友”“群体”和异常刑罚的词义范围；不把政治性的反叛译成宗教性的背教。
