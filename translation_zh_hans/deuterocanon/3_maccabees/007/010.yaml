base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/010.yaml
  text: But when they received this letter[a], they did not immediately hasten about the departure; instead, they urged the king that those from the Jewish race who had willfully transgressed the law of the holy God might, through them[c][b], receive the punishment that was due.
translation:
  language: zh_hans
  text: 他们收到这封信后，并没有立刻赶着启程[a]，反而请求王让犹太人中那些蓄意冒犯圣洁的上帝、并违背上帝律法的人，经由他们受到应得的惩罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “启程”也可译作“返回”；希腊词可从离开当前所在地或回到原处的角度理解。
    reason: lexical_alternative
  - marker: b
    text: “经由他们受到”也可译作“在他们手下受到”。原文没有在本句中进一步说明“他们”所指的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαβόντες δὲ τὴν ἐπιστολὴν ταύτην
  choice: 他们收到这封信后
  rationale: 不定过去时分词表示先于主要动作发生的情境；“收到……后”自然地保留时间关系。δέ在此承接并略带转折，后文用“反而”清楚呈现整体对比，无须机械译出。
- source_word: οὐκ ἐσπούδασαν εὐθέως περὶ τὴν ἄφοδον
  choice: 并没有立刻赶着启程
  rationale: σπουδάζω表达急切、赶紧办理之意；ἄφοδος可指离开，也可从目的地角度指返回。正文按当下行动译作“启程”，并以脚注保留“返回”的可能。
- source_word: προσηξίωσαν τὸν βασιλέα
  choice: 请求王准许
  rationale: 该动词在这里表示向王郑重提出请求。结合后接不定式所表达的请求内容，“请求王准许”比逐字译作“认为王配得”自然，也说明王在司法处置中的授权角色。
- source_word: τοὺς ἐκ τοῦ γένους τῶν Ἰουδαίων
  choice: 那些出自犹太族……的人
  rationale: γένος指血缘—族群共同体；“犹太族”保留原文的族群意味，而“出自”对应ἐκ。
- source_word: τὸν ἅγιον θεὸν ... παραβεβηκότας τοῦ θεοῦ τὸν νόμον
  choice: 冒犯圣洁的上帝并违背上帝律法
  rationale: 希腊文同时出现“圣洁的上帝”和“上帝的律法”，不可像咨询层英文那样合并为“圣洁上帝的律法”。παραβαίνω统摄两个宾语；中文分别搭配“冒犯”和“违背”，以自然表达保留两重对象。
- source_word: αὐθαιρέτως
  choice: 蓄意
  rationale: 该副词强调行为出于自主选择并具有故意性质；“蓄意”简洁传达其可责性。
- source_word: τυχεῖν διʼ αὐτῶν τῆς ὀφειλομένης κολάσεως
  choice: 经由他们受到应得的惩罚
  rationale: τυγχάνω加属格在此为“遭受／得到”；ὀφειλομένης表示理当承受、所欠的。διʼ αὐτῶν具有工具性，可理解为“经由他们”或“在他们手下”，正文保留较开放的表达。
theological_decisions:
- issue: “圣洁的上帝”与“上帝的律法”是否应合并
  choice: 保留为两个并列的受冒犯对象：“冒犯圣洁的上帝并违背上帝律法”
  alternative: “违背圣洁上帝的律法”
  rationale: 原文分别有宾格τὸν ἅγιον θεόν和宾格τὸν νόμον（由τοῦ θεοῦ修饰）。合并会遗漏“圣洁的上帝”这一独立表达，并削弱本节对背道者既冒犯上帝又触犯其律法的表述。
- issue: διʼ αὐτῶν所指及施罚方式
  choice: 译作“经由他们”，不明确锁定代词所指或具体执行方式
  alternative: “由这些忠信的犹太人亲手惩罚”
  rationale: 上下文很可能指提出请求的人作为施罚媒介，但本节本身只用代词，没有明说“忠信”或“亲手”；正文保留原文的指代开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“赶着启程”自然表达原文的急切意味；“蓄意冒犯……并违背……”保留司法与宗教语境。所有脚注标记均置于相关正文之后。
