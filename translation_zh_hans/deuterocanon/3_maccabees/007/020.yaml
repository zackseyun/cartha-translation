base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/020.yaml
  text: After also inscribing these things on a pillar[a], and establishing a place of prayer at the site of the banquet, they departed unharmed, free, and overflowing with joy, being brought safely back by land and sea and rivers, by the king’s command[b],
translation:
  language: zh_hans
  text: 他们又把这些事镌刻在一块石碑上[a]，并在宴席所在之处设立了一处祷告之处。随后，他们安然无恙、获得自由、欢喜异常地启程；按王的命令，经由陆路、海路和河道，被安全地送回[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把这些事献为神圣的纪念，立在碑上。”此处希腊语动词可指奉献、使成圣，也可在与“碑”连用时指公开设立碑铭以作纪念。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在陆路、海路和河道上一路平安蒙保全。”希腊语分词着重旅途中的安全保全；其“送回／返回”的方向意味由上下文支持。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιερώσαντες
  choice: 刻在
  rationale: 该分词本有奉献、立为神圣纪念物等意味；与ἐν στήλῃ连用时，语境指把所述之事公开镌刻并立碑纪念。正文用现代汉语自然的“刻在”，脚注保留“奉献并立在碑上”的可能意味。
- source_word: στήλῃ
  choice: 一块石碑
  rationale: στήλη指竖立的石制碑铭或纪念碑；“石碑”比“柱子”更准确传达其刻文及公开纪念的功能。
- source_word: κατὰ τὸν τῆς συμποσίας τόπον
  choice: 在宴席所在之处
  rationale: κατά在此具有地点意味，所指是先前举行宴席的地点；此译法清楚而不额外解释宴席性质。
- source_word: προσευχῆς ... τόπον
  choice: 一个祷告的地方
  rationale: 属格表明该地点以祷告为用途或特征；“祷告的地方”自然且保留原文较宽泛的表达，不强行译成制度化的“祷告所”。
- source_word: καθιδρύσαντες
  choice: 设立了
  rationale: 该词表示正式安置或建立，含相对持久之意；“设立”符合纪念性场所的语境。
- source_word: ἀνέλυσαν
  choice: 启程
  rationale: 该动词在旅行语境中表示离开、动身；“启程”承接后文陆海河道的行程，又不把其本身过度解释为“返回”。
- source_word: ἀσινεῖς
  choice: 安然无恙
  rationale: 准确表达未受损伤、平安无害的状态，符合现代汉语习惯。
- source_word: ἐλεύθεροι
  choice: 重获自由
  rationale: 原词直指自由；结合此前受拘禁和获释的处境，“重获自由”在汉语中更清楚，但没有增加新的神学主语。
- source_word: ὑπέρχαρεις
  choice: 满心欢喜
  rationale: 复合词带有强烈、格外欢喜的语气；“满心欢喜”自然而庄重。
- source_word: ἀνασωζόμενοι
  choice: 平安返回
  rationale: 该分词表示一路蒙保全并安全抵达，ἀνα-可在语境中带返回意味；正文采用“平安返回”，脚注保留不含明确方向的“沿途平安蒙保全”。
- source_word: διὰ τε γῆς καὶ θαλάσσης καὶ ποταμῶν
  choice: 经由陆地、海上和河道
  rationale: 忠实保留陆地、海洋和众河流三类路线；“河道”比直译“河流”更自然地表达通行路径。
- source_word: τῇ τοῦ βασιλέως ἐπιταγῇ
  choice: 奉王的命令
  rationale: ἐπιταγή指权威性的命令或谕令；“奉王的命令”简洁体现他们的安全通行受到王命保障。
theological_decisions:
- issue: 宴席地点的纪念性宗教行动
  choice: 译作在那里“设立了一个祷告的地方”，并与立碑行动并列。
  alternative: 可理解为临时指定一处祷告地点。
  rationale: καθιδρύσαντες通常暗示正式而较持久的设立，但原文没有说明其建筑形态或后续制度，因此不译成“建造祷告所”或特定宗教设施。
- issue: ἀνασωζόμενοι所表达的保全主体
  choice: 表达他们平安返回，但不在正文中明说是上帝使他们平安。
  alternative: 可较中性地译作“沿途平安蒙保全”，不明确返回方向。
  rationale: 全书语境涉及神的拯救，但本分句在语法上只明确提到王命作为旅途保障；译文保留这一张力，不补入原文未明说的施事者。
- issue: ἐλεύθεροι的语境力度
  choice: 译作“重获自由”。
  alternative: 严格直译为“自由地”或“是自由的”。
  rationale: 该词描述他们离去时不再受拘束的状态；“重获”来自叙事处境而非宗派性解释，并使现代汉语读者理解其与“安然无恙”并列的意义。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。将较长的希腊语句拆为两句，以避免汉语结构拖沓；仍保留立碑、设立祷告地点、三重状态以及陆海河三类路线。脚注标记[a]、[b]均已在正文出现。
