revisions:
- from: 他们又把这些事刻在一块石碑上[a]，并在宴席所在之处设立了一个祷告的地方。随后，他们安然无恙、重获自由、满心欢喜地启程，奉王的命令，经由陆地、海上和河道，平安返回[b]。
  to: 他们又把这些事镌刻在一块石碑上[a]，并在宴席所在之处设立了一处祷告之处。随后，他们安然无恙、获得自由、欢喜异常地启程；按王的命令，经由陆路、海路和河道，被安全地送回[b]。
  rationale: 修订保留原文的立碑、设立祷告地点、安然无恙、自由、极其欢喜，以及陆、海、河三类行程；同时更清楚呈现安全送返是按王命进行。未将本句未明言的神作为施事者，也未将祷告之处具体化为某种制度性建筑。
  reviewer_model: gpt-5.6-terra
