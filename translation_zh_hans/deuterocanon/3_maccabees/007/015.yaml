base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/015.yaml
  text: On that day they killed more than three hundred men[a], and they also made it a joyful celebration[b], having laid hands on the profane.
translation:
  language: zh_hans
  text: 那一天，他们杀了三百多名男子；他们也欢欢喜喜地庆祝这一天，制伏了那些亵圣的人[b][a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“带来／举行欢庆”；这里可能是说他们以欢庆的方式庆祝或度过这一天。
    reason: lexical_alternative
  - marker: b
    text: 这里的希腊文较难确定。“制伏了”也可译作“抓住了”或“使……落在掌握中”；这个分句与庆祝之间可能表示时间、原因或伴随关系。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεῖλον
  choice: 杀了
  rationale: ἀναιρέω的简单过去时在这一叙事语境中指杀死；“杀了”现代、清楚，并保留原文的暴力含义。
- source_word: ὑπὲρ τοὺς τριακοσίους ἄνδρας
  choice: 三百多人
  rationale: ὑπέρ加宾格在此表示数量超过三百；ἄνδρας特指男性，汉语“三百多人”在此语境中自然，而事件对象仍由上下文明确为人。
- source_word: ἤγαγον εὐφροσύνην
  choice: 把这一天作为庆典来过
  rationale: 字面近于“引领／带来欢庆”，在此表达举行庆祝、以节庆方式度过该日；此译法既通顺，也不把它具体化为某种特定宗教节期。
- source_word: μετὰ χαρᾶς
  choice: 欢欢喜喜地
  rationale: 表达“带着喜乐”；叠词形式符合现代汉语叙事语体，并自然修饰庆祝行动。
- source_word: βεβήλους
  choice: 那些亵渎神圣的人
  rationale: βέβηλος表示凡俗、亵渎或不敬虔；在此作名词使用。“亵渎神圣的人”保留叙述者的宗教性负面评价，同时避免引入更具体的教义分类。
- source_word: χειρωσάμενοι
  choice: 制伏了
  rationale: χειρόω可指置于手中、抓获或制伏。“制伏”保留控制、胜过对方的意思，又不武断限定为某一种具体动作。
theological_decisions:
- issue: βεβήλους对这些人的宗教性评价
  choice: 那些亵渎神圣的人
  alternative: 不敬虔的人／亵圣的人
  rationale: 原词从叙述者立场将他们描述为与神圣相对、亵渎神圣者；所选译文保留这一评价，却不扩大成关于其全部信仰或身份的断言。
- issue: 难解分句ἣν καὶ ἤγαγον εὐφροσύνην μετὰ χαρᾶς βεβήλους χειρωσάμενοι的关系
  choice: 制伏了那些亵渎神圣的人以后，他们也欢欢喜喜地把这一天作为庆典来过
  alternative: 他们也欢喜庆祝，因为已经胜过了那些不敬虔的人／他们抓住亵圣者后便举行欢庆
  rationale: 现存希腊文句法生硬，分词与主句之间可理解为时间、原因或伴随关系。正文采用自然的时间关系，但脚注说明其他可能，以免把隐含关系绝对化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“欢欢喜喜地”使μετὰ χαρᾶς自然落入汉语叙事；“作为庆典来过”避免生硬直译。正文略作语序调整，以清楚呈现行动关系；两处脚注保留原文在惯用表达和分句关系上的不确定性。
