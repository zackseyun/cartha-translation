  yaml_path: translation/deuterocanon/3_maccabees/007/018.yaml
  text: There they held a saving banquet[a], since the king had generously supplied each of them with everything for the journey, all the way to his own house.
translation:
  language: zh_hans
  text: 他们在那里举行了为庆祝获救而设的宴席[a]，因为王慷慨地为他们每一个人备办了抵达各自家中所需的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“获救的宴席”、“拯救之宴”。希腊原文明确把这次庆宴与他们获救相连。
    reason: lexical_alternative
lexical_decisions:
- source_word: πότον
  choice: 宴席
  rationale: 该词本义与饮酒有关，但“ἐποίησαν πότον”在这里指庆祝性的饮宴；译作“宴席”既自然，也保留事件性质。
- source_word: σωτήριον
  choice: 庆祝获救的
  rationale: 该形容词把宴席与他们蒙拯救的经历直接联系起来；中文用“庆祝获救的”表达这一关联，同时不额外指定拯救的施行者。
- source_word: χορηγήσαντος
  choice: 供应
  rationale: 该词表示出资提供、备办；与εὐψύχως合译为“慷慨地……供应”，体现王承担费用并充分供给。
- source_word: εὐψύχως
  choice: 慷慨地
  rationale: 该副词含欣然、诚意十足之意；在王提供旅途所需的语境中，“慷慨地”最符合现代汉语表达。
- source_word: τὰ πρὸς τὴν ἄφιξιν πάντα
  choice: 返程所需的一切
  rationale: 直译近于“为抵达所需的一切”；上下文所指是让他们到达各自家中的全程需要，因此译作“返程所需的一切”。
- source_word: ἑκάστῳ
  choice: 每个人
  rationale: 与后面的单数“自己的家”构成逐一分配的表达，强调王对各人的供应。
- source_word: ἕως ἐπὶ τὴν ἰδίαν οἰκίαν
  choice: 直到各人回到自己的家
  rationale: 表示供应一直延续到每个人抵达自己的住所；采用分配性复数，使中文清楚自然。
theological_decisions:
- issue: σωτήριον所表达的拯救关联
  choice: 庆祝获救的宴席
  alternative: 救恩的宴席／带来拯救的宴席
  rationale: 原文明确把宴席与获救相连，却未说明宴席本身带来拯救，也没有在本句明指神学意义上的“救恩”；主文避免将因果或施救者说得过满，并用脚注保留较贴近形式的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“庆祝获救的宴席”避免生硬的“拯救性宴席”，同时借脚注保留σωτήριον在形式和语义上的多种理解。
