  text: declaring that they should never show favor either to those who[a], for the sake of their belly, had transgressed the divine commandments[b], or to the king’s decrees.
translation:
  language: zh_hans
  text: 并公开宣称：他们绝不善待那些为口腹之故[a]而违背神圣诫命的人，也绝不赞同王的谕令[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“为了肚腹”，也可理解为“为了食欲”或“为了食物”，指因身体的欲求而让步。
    reason: lexical_alternative
  - marker: b
    text: 希腊文末句十分紧缩，也可能理解为：他们绝不善待那些依从王的谕令的人。
    reason: alternative_reading
lexical_decisions:
- source_word: προφερόμενοι
  choice: 公开声明
  rationale: 该分词引出他们公开提出的立场；“公开声明”既体现正式语气，也不把动作过度具体化。
- source_word: τοὺς γαστρὸς ἕνεκεν
  choice: 那些为了口腹之欲的人
  rationale: 希腊文直译为“为了肚腹”，指屈从于身体食欲。“口腹之欲”在现代汉语中自然，并保留其具体意象和道德意味。
- source_word: τὰ θεῖα παραβεβηκότας προστάγματα
  choice: 违犯神圣诫命
  rationale: παραβαίνω表示越界、违犯；θεῖα προστάγματα指源于神的命令。“神圣诫命”保持原文庄重而未擅自补出所有格。
- source_word: μηδέποτε εὐνοήσειν
  choice: 绝不表示善意／绝不表示赞同
  rationale: εὐνοέω表示怀有善意、持支持态度。因其两个并列对象的性质不同，译文分别采用自然汉语搭配，同时保留共同的“不予支持”语义。
- source_word: μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν
  choice: 对于王的谕令，也绝不表示赞同
  rationale: 该短语在传世希腊文本中以与格接在 εὐνοήσειν 之后，结构紧缩。“王的谕令”符合君王正式命令的语域；“表示赞同”使汉语搭配自然，但不强化为实际服从。
theological_decisions:
- issue: 末句 μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν 的所指和句法作用
  choice: 把“王的谕令”理解为 εὐνοήσειν 的第二个并列对象，即他们既不善待违犯神命者，也不赞同王的谕令。
  alternative: 将末句理解为“也绝不善待那些依从王谕令的人”。
  rationale: 现存希腊文结构紧缩且语义搭配生硬，但明文出现的是“王的谕令”，没有出现“遵从谕令的人”。正文依照现有句法保留两个并列对象，并用脚注诚实说明另一种可能理解，避免擅自补入人物所指。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“口腹之欲”保留原文“肚腹”的意象；对 εὐνοήσειν 按汉语对象分别译为“表示善意”和“表示赞同”，避免不自然的“善待谕令”。所有不确定性均在脚注中明示。
