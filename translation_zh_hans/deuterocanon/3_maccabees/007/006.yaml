base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/006.yaml
  text: But we[a], after threatening them more harshly on account of these things, in keeping with the clemency we have toward all people, scarcely granted them their lives, and, recognizing that the heavenly God had surely defended the Jews[b],
translation:
  language: zh_hans
  text: 至于我们，因这些事严加威吓他们；本着我们一向对所有人的宽厚，仍勉强饶了他们一命[a]；又认定天上的上帝[b]确实庇护了犹太人，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“勉强准许他们活命”。
    reason: lexical_alternative
  - marker: b
    text: 或译“天之上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτοις
  choice: 因这些事
  rationale: 介词短语在此说明严厉警告的缘由，回指上文所述之事，并非表示比较。
- source_word: σκληρότερον διαπειλησάμενοι
  choice: 更加严厉地警告了他们
  rationale: 保留比较级所表达的加重程度，也体现复合动词所含的强烈威吓语气；现代汉语用“严厉地警告”比直译“威胁”更适合王室诏书语境。
- source_word: ἐπιείκειαν
  choice: 宽厚
  rationale: 该词可指温和、公允或从宽处置；“宽厚”既自然，又适合君王自述对众人的宽仁。
- source_word: μόγις τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: 才勉强饶他们一命
  rationale: μόγις表示勉强、几乎不肯让步；整个短语在汉语中自然表达为“饶他们一命”，同时以“才勉强”保留其勉强准许存活的意味。
- source_word: ἐπουράνιον θεόν
  choice: 天上的上帝
  rationale: 保留ἐπουράνιον的形容词结构和崇高语气，不将其改写成来源或所属关系。
- source_word: ἐγνωκότες
  choice: 认定
  rationale: 完成时分词表示基于已经发生之事而形成的确定认识；“认定”体现这种经过验证后的判断。
- source_word: ἀσφαλῶς
  choice: 确实
  rationale: 此处自然地表示对上帝庇护行动的确定判断；“确实”比空间意义的“稳固地”更符合上下文。
- source_word: ὑπερησπικότα
  choice: 庇护了
  rationale: 该完成时分词含为人抵御、保护之意；“庇护”简洁地表达上帝站在犹太人一方施行保护，并保留行动已经显明的完成意味。
theological_decisions:
- issue: ἐπουράνιον θεόν的表达
  choice: 天上的上帝
  alternative: 天之上帝
  rationale: 正文保留希腊文形容词“属天的／在天上的”结构，同时采用现代普通读者容易理解的说法；脚注列出较凝练的另一种译法，不把短语解释成特定教义称号。
- issue: τὸ ζῆν αὐτοῖς χαρισάμενοι的直译程度
  choice: 饶他们一命
  alternative: 准许他们活命
  rationale: 正文采用自然且准确的现代汉语习语；脚注保留较贴近希腊文“把活命赐给他们”的表达方式，避免掩盖原文措辞。
- issue: ἀσφαλῶς修饰神圣保护时的语义
  choice: 确实庇护了
  alternative: 稳妥地保护了
  rationale: 上下文着重王室对神介入的确认，因此取确定性意义；但不扩展为神学上绝对保障或持续保守的命题。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保持王室诏书自述的正式语气。以分号理清两个并列分词结构；末尾保留逗号，因为本节希腊文句法尚未完结，内容继续到下文。
