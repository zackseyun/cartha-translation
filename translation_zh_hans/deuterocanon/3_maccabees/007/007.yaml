base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/007.yaml
  text: Considering that he has always fought alongside us like a father for his sons[a], and reckoning the firm goodwill they have toward us and our forefathers as that of a friend[b], we have rightly released them in every way from any charge whatever.
translation:
  language: zh_hans
  text: 鉴于他一向如同父亲为儿子们那样相助，又考虑到他们对我们和我们祖先所怀朋友般坚定的善意，我们就正当地使他们完全免于任何指控或追究的缘由[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文结尾以叠加的表达强调解除得全面彻底，意思是：不论以何种方式、基于何种缘由，都完全解除。这里的“缘由”包括任何可能提出指控或追究的依据。
    reason: legal_idiom
lexical_decisions:
- source_word: ὡς πατέρα ὑπὲρ υἱῶν
  choice: 如同父亲为儿子一样
  rationale: ὡς引出比喻，ὑπέρ表示为了、维护或代表某人；译文保留“父亲—儿子”的明确关系，不把比喻改写成泛指的亲情。
- source_word: διὰ παντὸς συμμαχοῦντα
  choice: 始终为他们助战
  rationale: διὰ παντός表示持续不断；συμμαχέω既可指共同作战，也可泛指作为盟友施以援助。“助战”保留军事和结盟色彩，同时不擅自补入原文没有的“与我们并肩”。
- source_word: τήν ... βεβαίαν ... εὔνοιαν
  choice: 坚定的善意
  rationale: εὔνοια指友善、好意或善意，βεβαίαν强调其稳固可靠；“坚定的善意”兼顾两层含义。
- source_word: τοῦ φίλου
  choice: 朋友般
  rationale: 属格以凝练方式说明这种善意具有朋友的性质；“朋友般”在现代汉语中自然，也保留原文的关系性比拟。
- source_word: πρὸς ἡμᾶς καὶ τοὺς προγόνους ἡμῶν
  choice: 对我们和我们的祖先
  rationale: 忠实保留善意所指向的当代君王一方及其先祖。
- source_word: ἀναλογιζόμενοι
  choice: 想到……又考虑到
  rationale: 该分词表示衡量、斟酌并以此作为决定的根据；中文按并列对象展开，使长句清楚自然。
- source_word: δικαίως
  choice: 理所当然地
  rationale: 表达该行动被视为正当、合理；比单纯“正确地”更符合发布法令的语气。
- source_word: ἀπολελύκαμεν
  choice: 使他们……免受……追究
  rationale: 完成时表达已经作出并仍然有效的释放或解除决定；这一译法适合法律语境，又不把词义收窄为某一种具体司法程序。
- source_word: πάσης καθʼ ὁντινοῦν αἰτίας τρόπον
  choice: 彻底免受任何罪名追究
  rationale: 原文以叠加强调的方式表示不论缘由或形式，均完全解除；“彻底”“任何”共同传达这种全面性。
theological_decisions:
- issue: 首句施行助战者的指代及助战对象
  choice: 以“他”承接上文，并把“他们”作为ὑπὲρ υἱῶν所指的受益者
  alternative: 译成“他一直与我们并肩作战”
  rationale: 本节希腊文以阳性单数宾格分词承接前文所指者，本节自身未重述其名；而ὑπὲρ υἱῶν明确是“为儿子们”，原文没有“与我们”这一成分。这样处理避免改变行动的受益对象，也不在本节内擅自重述其身份。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留法令式第一人称复数“我们”。句首以“想到……又考虑到……”呈现希腊文分词结构的决策依据；避免沿用咨询层中原文并不存在的“与我们并肩作战”。
