revisions:
- from: 因为你们要知道：如果我们图谋对这些人做任何恶事，或使他们受到丝毫伤害，那么，为了追究这些事，我们所面对的就不是人，而是统管一切权能的至高上帝；我们必永远无法逃脱。祝你们安好。
  to: 要知道：如果我们图谋对这些人做任何恶事，或在任何方面使他们忧伤，那么，为着报应这些事，与我们作对的就不是人，而是统管一切权能的至高上帝；我们必在任何情况下都无法逃避，并且永远如此。祝你们安好。
  rationale: 修订将ἐπιλυπήσωμεν译为“使他们忧伤”，并以“在任何方面”对应τὸ σύνολον及κατὰ πᾶν；“为着报应这些事”保留ἐπʼ ἐκδίκησιν τῶν πραγμάτων的报应目的，“与我们作对”直接体现ἀντικείμενον。末句以“无法逃避，并且永远如此”保留ἀφεύκτως与διὰ παντός的双重强化。
