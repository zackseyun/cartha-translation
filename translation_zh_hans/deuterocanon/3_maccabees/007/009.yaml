base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/009.yaml
  text: For know that if we devise any evil against these people, or grieve them in any way at all, we will have against us for vengeance in these matters, utterly without escape and forever, not a man but God Most High, the one who rules over all power. Farewell.
translation:
  language: zh_hans
  text: 要知道：如果我们图谋对这些人做任何恶事，或在任何方面使他们忧伤，那么，为着报应这些事，与我们作对的就不是人，而是统管一切权能的至高上帝；我们必在任何情况下都无法逃避，并且永远如此。祝你们安好。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοτεχνήσωμεν πονηρόν
  choice: 图谋……做任何恶事
  rationale: κακοτεχνέω含有精心策划、图谋作恶之意；配合形容词πoνηρόν，以“图谋……做任何恶事”自然表达其蓄意性。
- source_word: ἐπιλυπήσωμεν
  choice: 使……受到……伤害
  rationale: 该动词可指使人忧伤、苦恼或受苦；这里与针对群体的恶谋并列，“伤害”能涵盖更广的侵扰含义，同时不限定为身体伤害。
- source_word: τὸ σύνολον
  choice: 丝毫
  rationale: 此处作强化性的否定范围表达，意为“完全、在任何方面”；结合中文条件句译作“丝毫”，表达任何程度的伤害。
- source_word: πάσης δεσπόζοντα δυνάμεως
  choice: 统管一切权能
  rationale: δεσπόζω表示掌管、支配，δύναμις可指能力、力量或权能；“统管一切权能”保留原文对上帝至高主权的概括表达。
- source_word: ἐπʼ ἐκδίκησιν τῶν πραγμάτων
  choice: 为了追究这些事
  rationale: ἐκδίκησις可指伸冤、报应或惩罚；“追究”既传达因这些行为而施行公正报应，又避免过度具体化其方式。
- source_word: ἐρρῶσθε
  choice: 祝你们安好
  rationale: 书信或诏令结尾的惯用告别语，字面涉及健康、强健；“祝你们安好”符合现代中文正式文书语体。
theological_decisions:
- issue: 上帝作为报应者与敌手的表述
  choice: “我们所面对的就不是人，而是……至高上帝”
  alternative: “与我们为敌的就不是人，而是……至高上帝”
  rationale: ἀντικείμενον意为站在对立面、反对者；“所面对的”保留上帝将亲自追究的严肃张力，同时避免把经文扩展为关于上帝本质上“为敌”的教义断言。
- issue: 惩罚不可逃脱的范围与持续性
  choice: “我们必永远无法逃脱”
  alternative: “我们在任何方面都必永远无法逃脱”
  rationale: κατὰ πᾶν、ἀφεύκτως、διὰ παντός连续强化全面、不可逃避和持续性；中文以“必永远无法逃脱”集中传达，避免生硬堆叠副词。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语，保留诏令式警告及结尾问安语。句法适度重组，使“不是人，而是至高上帝”的对照清楚，并保持原文关于神圣追究和不可逃脱的强烈语气。
