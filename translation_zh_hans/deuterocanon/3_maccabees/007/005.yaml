base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/005.yaml
  text: These men[a], after bringing them down in chains with abuse, as servants—or rather, as conspirators—attempted to destroy them without any hearing or examination[c][b], having clothed themselves in a savagery more brutal than the law of the Scythians.
translation:
  language: zh_hans
  text: 这些人把他们捆绑起来，在百般凌辱[a]中押解下来，把他们当作奴隶——或者更确切地说，当作阴谋者[b]；未经任何审问或查验，就企图杀害他们，因为他们被一种比斯基泰人的律法还野蛮的残酷所驱使[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “百般凌辱”也可译作“虐待”或“肆意侮辱”；希腊语短语指施加在这些被捆绑者身上的苛待和羞辱。
    reason: lexical_alternative
  - marker: b
    text: “奴隶”所译的词也可特别指被掳而沦为奴隶的人。“或者更确切地说”加强前项：他们不只被当作奴隶，也被当作怀有敌意、暗中谋划的人。
    reason: lexical_alternative
  - marker: c
    text: “律法”在这里也可指“习俗”。古代文献常以斯基泰人作为野蛮残酷的代表。末句希腊语的分词措辞较难确定，可能含有“被激起”“被灌注”或“披上”残酷的意象；正文保留其意为他们受这种残酷驱使。
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: δεσμίους καταγαγόντες
  choice: 把他们当作囚犯……押送下来
  rationale: δεσμίους指被捆绑、受拘禁的人；中文以“囚犯”表达其受押状态，καταγαγόντες的向下或押送含义则由“押送下来”保留，同时不擅自指定目的地。
- source_word: μετὰ σκυλμῶν
  choice: 百般折辱
  rationale: σκυλμός在这里指施加于人的虐待、困扰或侮辱；“百般折辱”既自然，又保留其使人受苦并丧失尊严的语气。
- source_word: ὡς ἀνδράποδα
  choice: 当作奴隶
  rationale: ἀνδράποδον尤可指被当作战利品而奴役的人；“奴隶”保留原文贬抑人格、将人视为所有物的强烈意味。
- source_word: μᾶλλον δὲ ὡς ἐπιβούλους
  choice: 不如说，当作图谋不轨的人
  rationale: μᾶλλον δέ对前一说法作加强性的修正；ἐπίβουλος指怀有敌意、暗中谋害或策划的人。“图谋不轨的人”保留指控内容，却不把具体阴谋细节说死。
- source_word: ἄνευ πάσης ἀνακρίσεως καὶ ἐξετάσεως
  choice: 未经任何审讯或查问
  rationale: 两个词都带有司法调查或盘问色彩；“审讯或查问”保留并列结构与程序性意味，又避免引入原文未明确写出的现代法庭制度。
- source_word: ἐπεχείρησαν ἀνελεῖν
  choice: 企图杀掉他们
  rationale: ἐπιχειρέω加不定式表示着手或企图，ἀναιρέω在此语境指杀死；直译为“企图杀掉”比含混的“毁灭”更准确。
- source_word: νόμου Σκυθῶν ἀγριοτέραν
  choice: 比斯基泰人的律法还要野蛮
  rationale: νόμος直译为“律法”，也可能指习俗；正文保留原文措辞和比较的修辞力度，脚注说明其语义范围与文化用法。
- source_word: ἐνπεπηρμένοι ὠμότητα
  choice: 心中充满了……残酷
  rationale: 这一表达的词形和意象较难确定，但整体表示他们被残酷所浸透或支配；“心中充满”在现代中文中自然，并保留状态性的强烈谴责。
theological_decisions:
- issue: ὡς ἀνδράποδα中的非人化奴役用语
  choice: 当作奴隶
  alternative: 当作俘虏／当作可以买卖的人
  rationale: 原词不只表示被俘，也含被降为奴隶、视作人身财产的意味；不宜为了缓和语气而删去这种非人化张力。
- issue: ἐπιβούλους所指控的敌对行为
  choice: 图谋不轨的人
  alternative: 阴谋分子／埋伏害人的仇敌
  rationale: 原词明确带有敌意谋划的含义，但未说明具体阴谋形式；采用较宽而有力的表达，以保留原文可能的范围。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“押送下来”保留κατάγω的方向感；分号呈现原文从虐待押送转向未经程序便企图杀人的推进。末句避免生硬照搬“披上残酷”的隐喻，但以脚注保留该难解表达的形象和不确定性。
