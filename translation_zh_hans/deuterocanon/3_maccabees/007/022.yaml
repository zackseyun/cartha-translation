  yaml_path: translation/deuterocanon/3_maccabees/007/022.yaml
  text: And all of them recovered all their own property from the registration, so that those who had anything gave it back to them with the greatest fear, since the great God had fully accomplished mighty deeds for their deliverance.
translation:
  language: zh_hans
  text: 众人都根据登记记录[a]收回了自己所有的财物；凡持有任何这类财物的人，都怀着极大的惧怕将其归还给他们，因为伟大的上帝已经为拯救他们[b]完全施行了大能的作为。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “登记记录”也可译作“财物清册”或“官方记录”。希腊语ἀπογραφή可指对人员或财物所作的行政登记。
    reason: lexical_alternative
  - marker: b
    text: “拯救”也可译作“救恩”或“解救”。希腊语σωτηρία既可指在具体危难中获救，也可具有更广的救恩含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκομίσαντο
  choice: 收回了
  rationale: 中间语态在这里表示取回原本属于自己的东西；“收回”自然地体现财物失而复得。
- source_word: ἐξ ἀπογραφῆς
  choice: 根据登记记录
  rationale: ἀπογραφή可指官方登记、清册或记录；结合财物归还的语境，“根据登记记录”既保留行政含义，也不把它限定为人口普查。
- source_word: πάντα τὰ ἑαυτῶν
  choice: 自己的一切财物
  rationale: 直译为“自己的一切东西”；上下文涉及他人持有并归还之物，译作“财物”更符合现代汉语，同时保留“全部”的范围。
- source_word: τοὺς ἔχοντάς τι
  choice: 凡持有其中任何东西的人
  rationale: 明确τι所指的是前述属于众人的财物，又保留希腊文概括而不特指的表达。
- source_word: μετὰ φόβου μεγίστου
  choice: 都极其惧怕
  rationale: 保留φόβος的“惧怕”而不弱化为“敬畏”，并以“极其”表达最高程度。
- source_word: ἀποδοῦναι αὐτοῖς
  choice: 把东西归还给他们
  rationale: 准确表达将原属他们的物品交还，现代汉语清楚自然。
- source_word: τὰ μεγαλεῖα
  choice: 大能的作为
  rationale: 指上帝所行的伟大、有能力的行动；此译法庄重自然，也不将其窄化为神迹。
- source_word: ποιήσαντος τελέως
  choice: 已经……成全了
  rationale: “成全”兼顾ποιέω的施行和τελέως所含的完全、彻底之意，并体现该行动已经有效完成。
- source_word: ἐπὶ σωτηρίᾳ αὐτῶν
  choice: 为拯救他们
  rationale: 本叙事语境首先指上帝使他们脱离现实危险；“拯救”同时保留σωτηρία可能具有的较广神学分量。
theological_decisions:
- issue: 叙事性语境中σωτηρία的译法
  choice: 拯救
  alternative: 救恩；解救
  rationale: 本节庆贺上帝在具体历史处境中救拔其百姓，因此“拯救”最贴合眼前语境，又不像“解救”那样减弱潜在的神学含义，也不以“救恩”预先限定为更系统化的教义用语。
- issue: ποιήσαντος τελέως与结果关系的表达
  choice: 因为伟大的上帝已经……成全了
  alternative: 伟大的上帝既已彻底施行了……；由于伟大的上帝已经完成了……
  rationale: 属格独立结构在语境中说明持有者极其惧怕并归还财物的原因；用“因为”清楚呈现关系，而“成全”保留行动完成且奏效的意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号分开财物收回与持有者归还两个紧密相连的分句；保留“伟大的上帝”对μέγας的显明修饰，以及原文关于惧怕和上帝大能作为的力度。
