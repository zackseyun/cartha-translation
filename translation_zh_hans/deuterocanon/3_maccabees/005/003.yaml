  text: So the one who had been given these orders turned to feasting[a], gathering those of his friends and of the army who were most hostile toward the Jews.
translation:
  language: zh_hans
  text: 于是，那领受了这些命令的人转而去宴饮[a]，召集了他的朋友和军队中最敌视犹太人的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“转向宴席。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... προσταχθεὶς
  choice: 那领受了这些命令的人
  rationale: 保留带冠词分词的指称作用和被动含义，并让“τάδε”自然回指上文所下的命令。
- source_word: ἐτρέπετο
  choice: 转去
  rationale: 表达未完成时中转向某项活动的动态，同时保持现代汉语的流畅。
- source_word: τὴν εὐωχίαν
  choice: 赴宴
  rationale: 该词指宴饮欢聚；结合“转去”的搭配，“赴宴”自然简洁，同时保留具体宴席场景。
- source_word: συναγαγὼν
  choice: 召集了
  rationale: 将伴随主动作的分词译为连贯的并列动作，清楚表达他把有关人员聚集起来。
- source_word: τοὺς μάλιστα τῶν φίλων καὶ τῆς στρατιᾶς
  choice: 他的朋友和军队中……最……的人
  rationale: 把该短语理解为从朋友和军队两个群体中选出的一个子集，并使“μάλιστα”与后面的敌对态度相连。
- source_word: ἀπεχθῶς ἔχοντας πρὸς τοὺς Ἰουδαίους
  choice: 对犹太人最怀敌意
  rationale: 准确传达对犹太人的敌视倾向，不把语义强化为具体暴力行为。
