  text: And the crowds throughout the city were gathering for the most pitiful spectacle[a], eagerly awaiting the morning.
translation:
  language: zh_hans
  text: 城中各处的人群都已经聚集起来，准备观看那极其悲惨的景象[a]，急切地等候早晨到来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了观看那极其可悲的景象。”希腊语 θεωρία 既可指观看这一行为，也可指所观看的景象。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πλήθη
  choice: 人群
  rationale: 复数 πλήθη 指大批聚集的人；“人群”是现代汉语中自然、庄重且不过度古雅的表达。
- source_word: κατὰ τὴν πόλιν
  choice: 城里各处
  rationale: κατά 在此表达遍布城中的分布意义；“城里各处”比单说“城里”更充分保留这一含义。
- source_word: συνῄθροιστο
  choice: 都聚集起来
  rationale: 该未完成过去时形式描写聚集的过程或当时形成的状态；“聚集起来”自然体现动态过程。
- source_word: πρὸς τὴν οἰκτρότατην θεωρίαν
  choice: 要观看那极其悲惨的景象
  rationale: θεωρία 既可指观看这一行为，也可指所观看的场面；正文采用自然汉语表达观看目的，同时以脚注保留词义两可。οἰκτρότατην 为最高级，用“极其悲惨”传达强烈哀怜色彩。
- source_word: προσδοκῶντα
  choice: 等候
  rationale: 分词表示对即将到来之事的期待；与时间宾语搭配时，“等候”自然准确。
- source_word: τὴν πρωίαν
  choice: 早晨到来
  rationale: 原词泛指早晨，并不必限定为黎明；补出“到来”使现代汉语搭配顺畅。
- source_word: μετὰ σπουδῆς
  choice: 急切地
  rationale: 该短语可表示热切、认真或急迫；在这一阴惨语境中，“急切地”比带正面色彩的“热切地”更合适。
