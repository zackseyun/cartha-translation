base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/047.yaml
  text: But he[a], filled with heavy wrath and impious in mind, rushed out with all his force along with the beasts[b], wanting with unfeeling heart and with the pupils of his eyes to look upon the painful and miserable destruction of those who had been marked out.
translation:
  language: zh_hans
  text: 可是，他满怀深重的怒气，心怀不敬之心，便带着那些猛兽，使尽全力冲了出去；他怀着一颗不为怜悯所动的心[a]，想要亲眼[b]目睹那些已被标定的人痛苦而凄惨的毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“未被刺透的心”，可能是说他的心丝毫没有被怜悯触动。
    reason: 保留ἀτρώτῳ καρδίᾳ的字面意象及其语境含义。
  - marker: b
    text: 原文直译为“用双眼的瞳孔”，强调他要本人直接观看。
    reason: 说明κόραις ὀφθαλμῶν的强调性表达。
lexical_decisions:
- source_word: ὀργῇ βαρείᾳ γεμίσας δυσσεβῆ φρένα
  choice: 他那不敬虔的心思充满了深重的怒气
  rationale: 按希腊语句法，将“心思”理解为“充满”的对象，将“深重的怒气”理解为所充满的内容；“不敬虔”保留 δυσσεβής 对上帝不敬的宗教意味。
- source_word: παντὶ τῷ βάρει
  choice: 使出全力
  rationale: 此处表示行动时倾注全部力量或声势；译为“使出全力”比直译“带着全部重量”更符合现代汉语，同时保留力度。
- source_word: σὺν τοῖς θηρίοις
  choice: 和那些猛兽一同
  rationale: θηρία 在处刑场景中指具有危险性的兽类；“猛兽”比泛称“动物”更能传达语境中的威胁。
- source_word: ἐξώρμησε
  choice: 冲了出去
  rationale: 该动词表示突然、有力地向外奔出；“冲了出去”自然地保留其迅猛感。
- source_word: ἀτρώτῳ καρδίᾳ
  choice: 怀着一颗不为怜悯所动的心
  rationale: ἀτρώτος 字面意为“未受伤、未被刺透”，在这里描写其内心没有被受害者的苦难触动；正文采用自然汉语，脚注保留原文意象。
- source_word: κόραις ὀφθαλμῶν
  choice: 亲眼
  rationale: 字面为“用双眼的瞳孔”，强调本人直接观看；“亲眼”是现代汉语中自然且准确的对应表达，字面形式列入脚注。
- source_word: θεάσασθαι
  choice: 目睹
  rationale: 该词表示观看、注视；“目睹”与前面的“亲眼”配合，传达他有意直接观看事件发生。
- source_word: τὴν ἐπίπονον καὶ ταλαίπωρον ... καταστροφήν
  choice: 惨痛而悲惨的覆灭
  rationale: 保留两个并列形容词对灾难的叠加强调；“覆灭”传达 καταστροφή 的毁灭、倾覆意味。
- source_word: τῶν προσεσημαμμένων
  choice: 那些已被标定之人
  rationale: 完成时分词表示这些人先前已经被作出标记或指定；“已被标定”保留这一先行、被动的官方处置意味，而不擅自补明标定的具体方式。
theological_decisions:
- issue: δυσσεβῆ 的道德—宗教含义
  choice: 不敬虔
  alternative: 邪恶；不虔诚
  rationale: 该词不只表示一般道德败坏，也包含对神缺乏敬畏的意味；“不敬虔”保留这一宗教维度，又不加入原文没有的教派性解释。
- issue: ἀτρώτῳ καρδίᾳ 的隐喻
  choice: 正文译作“不为怜悯所动的心”，脚注说明字面为“未被刺透的心”
  alternative: 未被刺透的心；无动于衷的心
  rationale: 原文的身体性隐喻具有一定歧义。正文表达语境中明显的冷酷含义，脚注则保存字面图像，避免把隐喻完全消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“深重的怒气”“猛兽”“覆灭”保持叙事的严肃力度；避免生硬照搬希腊语结构。所有脚注标记均放在其实际说明的词组之后。
