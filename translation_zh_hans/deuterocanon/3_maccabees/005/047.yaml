- from: 可是，他那不敬虔的心思充满了深重的怒气，便使出全力，和那些猛兽一同冲了出去。他想怀着一颗不为怜悯所动的心[a]，亲眼[b]目睹那些已被标定之人惨痛而悲惨的覆灭。
  to: 可是，他满怀深重的怒气，心怀不敬之心，便带着那些猛兽，使尽全力冲了出去；他怀着一颗不为怜悯所动的心[a]，想要亲眼[b]目睹那些已被标定的人痛苦而凄惨的毁灭。
  rationale: 修正ὀργῇ βαρείᾳ γεμίσας与δυσσεβῆ φρένα的句法关系，使“满怀深重的怒气”和“心怀不敬之心”都直接描述该人物。其余译法维持原文的强烈叙事语气、对不敬的宗教含义，以及“未被刺透的心”和“瞳孔”两项可由脚注说明的修辞意象。
