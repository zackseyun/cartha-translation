  text: And Hermon[a], the elephant-master[b], carried out the order exactly.
translation:
  language: zh_hans
  text: 赫尔蒙这位掌象官[a]一丝不苟地[b]执行了命令。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“象队统领”或“象官”。
    reason: 原词指主管、统领象只的官员；上下文虽涉及战象，原词本身未明说“战”。
  - marker: b
    text: 也可译“准确无误地”“妥当地”或“切实地”。
    reason: 原副词可指稳妥、严谨或准确地完成；此处修饰执行受命之事。
lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: 掌象官
  rationale: 该复合名词由“象”和“统领、主管”构成，指负责管理并指挥战象的官员。“掌象官”简洁自然，也保留了这一特定职务。
- source_word: τὸ προσταγὲν
  choice: 所下的命令
  rationale: 这个中性分词结构直译为“被命令的事”，在本语境中自然地表达为“所下的命令”。
- source_word: ἀραρότως
  choice: 严格地
  rationale: 该副词可表示牢靠、妥帖或准确无误地完成某事；修饰执行命令时，“严格地”既表达切实遵命，也不过度限定为单纯的逐字精确。
- source_word: συνετέλει
  choice: 执行了
  rationale: 此处表示把受命之事贯彻完成；“执行了”符合行政和军事语境，并与“命令”自然搭配。
- source_word: Ἕρμων
  choice: 赫尔蒙
  rationale: 按现代汉语常用音译方式转写希腊人名，并与中文圣经人名风格协调。
- source_word: δὲ
  choice: 而
  rationale: 保留承接兼轻微转折的语篇关系，使本句与上文衔接自然。
