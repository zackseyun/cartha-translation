  yaml_path: translation/deuterocanon/3_maccabees/005/038.yaml
  text: Arm the elephants even now for tomorrow[b][a], for the destruction of the Jews.
translation:
  language: zh_hans
  text: 你现在就把大象装备齐全，为明天消灭[a]犹太人[b]作准备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“彻底除灭。”希腊词可指彻底毁灭或抹除。
    reason: lexical_alternative
  - marker: b
    text: 或译：“犹大人”，即犹太地的居民；但在这里，更可能是指具有共同族群和宗教身份的犹太人。
    reason: alternative_reading
lexical_decisions:
- source_word: καθόπλισον
  choice: 把……全副武装起来
  rationale: 该命令式动词指为作战而充分装备；此译法既保留军事含义，也体现前缀所加强的充分装备之意。
- source_word: ἔτι καὶ νῦν
  choice: 现在就
  rationale: 这一叠加强调当下行动的紧迫性；“现在就”是自然的现代汉语，同时不把语义过度限定为单纯的“立刻”。
- source_word: εἰς τὴν αὔριον
  choice: 预备明天
  rationale: 介词短语表示以明天为着眼点进行准备；结合“武装起来”，补出“预备”可使汉语关系清楚自然。
- source_word: ἐπὶ τὸν … ἀφανισμόν
  choice: 消灭
  rationale: ἀφανισμός可指毁灭、除灭乃至彻底抹除；“消灭”在此军事语境中直接有力，同时由脚注保留更强的词义可能。
- source_word: τῶν Ἰουδαίων
  choice: 犹太人
  rationale: 本段处于散居的希腊化语境，所指是具有共同族群与宗教身份的犹太群体，而非仅指犹太地居民。
theological_decisions:
- issue: 希腊化散居语境中Ἰουδαῖοι的译法
  choice: 犹太人
  alternative: 犹太地人
  rationale: 上下文所针对的是托勒密统治下按族群和宗教身份识别的犹太群体，并非狭义的犹太地居民；此处保留族群—宗教含义。
- issue: ἀφανισμός所表达的毁灭程度
  choice: 正文译“消灭”
  alternative: 彻底除灭／使其灭绝
  rationale: 原词可带彻底毁灭、抹除之意，但其程度在汉语中不宜未经说明便固定为特定现代术语；正文采用有力而较宽的“消灭”，脚注注明更强译法。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。命令语气以“你……把……”呈现；“现在就”表达紧迫感，“预备明天”使时间目的关系自然明确。脚注标记均置于正文所涉语句之后。
