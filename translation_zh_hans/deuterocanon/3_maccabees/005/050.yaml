  text: Yet nevertheless[a], when they also saw the help from heaven that had come to them before, they all together threw themselves down face-first, and separated the infants from the breasts[b],
translation:
  language: zh_hans
  text: 不过，他们也想到先前从天上临到他们的援助[a]，便一同俯伏在地，又使婴孩离开乳房[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“先前为他们施行的援助”。原文指他们以往所经历的援助或解救。
    reason: lexical_alternative
  - marker: b
    text: 直译：“使婴孩与乳房分开”，即让正在吃奶的婴孩离开乳房。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴν δὲ ἀλλὰ καὶ
  choice: 不过……也
  rationale: 这一连串连接词形成强调性的转折和递进。现代汉语不宜机械堆叠，译作“不过……也”既保留转折，也体现 καί 的附加意味。
- source_word: τὰς ἔμπροσθεν αὐτῶν γεγενημένας ἀντιλήψεις
  choice: 先前……临到他们的援助
  rationale: ἀντιλήψεις 指援助、扶助或解救行动；γεγενημένας 与 ἔμπροσθεν 表明这是他们先前经历过的援助。“临到他们”保留事件性，又不把词义限定为某一种解救。
- source_word: ἐξ οὐρανοῦ
  choice: 从天上
  rationale: 直译为“从天上”，在语境中暗示神圣援助，但不添加原文没有明说的神名。
- source_word: συνιδόντες
  choice: 想到
  rationale: 该分词可指一同看见、觉察或认识到。这里所指是先前发生的援助，因此“想到”自然表达回顾并意识到的含义，同时保留一定感知语义的弹性。
- source_word: πρηνεῖς ὁμοθυμαδὸν ῥίψαντες ἑαυτούς
  choice: 同心俯伏在地
  rationale: πρηνεῖς 表示面朝下、俯伏；ὁμοθυμαδόν 表示一致行动；ῥίψαντες ἑαυτούς 带有猛然把自己投下的力度。汉语“同心俯伏在地”简洁自然，并保留集体俯伏的画面。
- source_word: τὰ νήπια
  choice: 婴孩
  rationale: 随后的哺乳语境表明 νήπια 指尚在吃奶的幼儿，“婴孩”庄重且准确。
- source_word: χωρίσαντες τῶν μαστῶν
  choice: 把婴孩从乳房前移开
  rationale: 原文直陈使婴孩与乳房分开，并未明说“母亲”或使用带强制色彩的动词。“移开”在现代汉语中表达这一动作，同时避免过度增译。
theological_decisions:
- issue: 是否把“从天上”的援助明确译成神的介入
  choice: 从天上
  alternative: 从神而来的／从天上的主而来的
  rationale: 希腊文仅作 ἐξ οὐρανοῦ。语境虽显然指向神圣援助，译文仍保留原文的委婉说法，不补入神名。
- issue: 是否把“援助”限定为“拯救”
  choice: 援助
  alternative: 拯救／解救
  rationale: ἀντίληψις 可涵盖扶助、援助和解救；“援助”保留较宽的语义范围，不预先限定先前事件的具体性质。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“同心俯伏在地”适度凝练原文三个相连的动作修饰语；全节在原文中以逗号延续至下文，因此译文也保留句末逗号。
