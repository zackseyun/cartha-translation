- source_word: ἀσμένως πάντες μετὰ χαρᾶς
  choice: 在场的人都欣然欢喜地
  rationale: 保留ἀσμένως与μετὰ χαρᾶς叠加的欣愿、喜悦语气，同时采用自然庄重的汉语表达。
- source_word: οἱ παρόντες ὁμοῦ συναινέσαντες
  choice: 在场的人……一致赞同
  rationale: οἱ παρόντες指当时在场者；ὁμοῦ与συναινέω共同突出集体一致同意，译为“一致赞同”避免生硬重复。
- source_word: εἰς τὸν ἴδιον οἶκον ἕκαστος ἀνέλυσε
  choice: 随后各自回家去了
  rationale: ἀναλύω在此为离去、返回之意；ἕκαστος和ἴδιον共同强调各归自己的住处，以“各自回家”自然传达。
