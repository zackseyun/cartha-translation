  yaml_path: translation/deuterocanon/3_maccabees/005/045.yaml
  text: But the elephant-master[a], after bringing the beasts almost—as he had said—into a frenzied state by very fragrant drinks, with wine mixed with frankincense, and making them terrifyingly adorned with equipment[c][b],
translation:
  language: zh_hans
  text: 可是，管象人[a]用极其芳香的饮料——即掺了乳香的酒[b]——使这些兽几乎陷入狂乱状态，正如他所说的；又用装具[c]把它们装扮得令人惊恐，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“使……陷入”的希腊词 ἀγιοχὼς，在现存文本中的词形和词义都有困难；本译依据上下文，理解为管象人对这些兽所作的预备性处置。
    reason: textual_variant
  - marker: b
    text: 也可译作“用乳香熏过的酒”或“带有乳香香气的酒”。
    reason: lexical_alternative
  - marker: c
    text: “装具”也可译作“披挂”或“装备”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: 管象的人
  rationale: 指负责管理、驾驭大象的人；此译自然易懂，并保留其职能含义，不额外限定为饲养员或军事统领。
- source_word: τὰ θηρία
  choice: 这些兽
  rationale: 上下文所指是大象；“兽”保留 θηρία 较为庄重且带威慑感的语气。
- source_word: σχεδόν
  choice: 几乎
  rationale: 直接表达“接近但尚未完全达到”的程度。
- source_word: εἰς κατάστεμα μανιῶδες
  choice: 陷入狂乱状态
  rationale: κατάστεμα 表示一种状态或情状，μανιῶδες 表示疯狂、狂乱；译文避免把程度强化为原文未明说的暴烈行为。
- source_word: ἀγιοχὼς
  choice: 使……陷入
  rationale: 传抄形式在词形和词义上均有困难；按句法与上下文，理解为管象者对兽所作的预备性处置，使它们进入所述状态。
- source_word: εὐωδεστάτοις πόμασιν
  choice: 用极其芳香的饮料
  rationale: πόμασιν 是可饮用之物，εὐωδεστάτοις 是最高级形式；“极其芳香”保留强烈的嗅觉描写。
- source_word: οἴνῳ λελιβανωμένῳ
  choice: 掺了乳香的酒
  rationale: λελιβανωμένῳ 表示经 λίβανος（乳香）处理的酒；“掺了乳香”具体易懂，同时在脚注保留“熏香”的可能理解。
- source_word: φοβερῶς κεκοσμημένα
  choice: 把它们装扮得令人惊恐
  rationale: 同时传达 κεκοσμημένα 的装饰、装束含义和 φοβερῶς 所产生的可怖效果。
- source_word: κατασκευαῖς
  choice: 装具
  rationale: 指加在象身上的器具、披挂或装备；“装具”既符合动物披挂的语境，也不过度具体化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“可是”承接前文的转折；保留本节在较大句子中尚未完结的逗号结构。破折号明确说明芳香饮料就是经过乳香处理的酒，避免误读为两种不同饮品。
