  to: 因此，王在各方面都像法拉里斯[a]，满心愚妄，毫不看重自己在查察犹太人的事上内心所发生的转变，反而坚决立下一个绝不可能实现的誓言：要毫不迟延地把这些人送进阴间[b]，让他们的膝和脚被野兽残酷摧残。
