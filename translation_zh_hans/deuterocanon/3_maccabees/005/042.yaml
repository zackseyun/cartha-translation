base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/042.yaml
  text: Therefore the king[a], a Phalaris in every way, filled with irrationality and counting as nothing the changes of soul occurring within him for oversight of the Jews, firmly setting an utterly unfulfillable oath, that he would without delay send these men to Hades, cruelly mangled in the knees and feet by beasts[c][b],
translation:
  language: zh_hans
  text: 因此，王在各方面都像法拉里斯[a]，满心愚妄，毫不看重自己在查察犹太人的事上内心所发生的转变，反而坚决立下一个绝不可能实现的誓言：要毫不迟延地把这些人送进阴间[b]，让他们的膝和脚被野兽残酷摧残。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 法拉里斯是古代以极端残暴闻名的僭主；这里是把王比作他。
    reason: 文化背景说明
  - marker: b
    text: “阴间”指死者之境，不宜在这里直接理解为“地狱”。
    reason: 词义及神学歧义说明
lexical_decisions:
- source_word: Ὅθεν
  choice: 因此
  rationale: 承接上文并引出推论，保留原文的因果衔接。
- source_word: ὁ κατὰ πάντα Φάλαρις βασιλεὺς
  choice: 王在各方面都像法拉里斯
  rationale: 保留法拉里斯这一以残暴闻名的历史典故，同时用“像”清楚表达比较意味。
- source_word: ἐνπληθυνθεὶς ἀλογιστίας
  choice: 心中充满了失去理性的狂妄
  rationale: ἀλογιστία指不受理性约束的愚妄；结合王的暴虐语境，“失去理性的狂妄”比抽象的“非理性”更自然。
- source_word: τὰς γινομένας ... μεταβολὰς τῆς ψυχῆς
  choice: 自己内心……发生的转变
  rationale: ψυχή在此指人的内在心志；译作“内心的转变”既自然，也保留心理变化的含义。
- source_word: πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  choice: 为眷顾犹太人
  rationale: ἐπισκοπή可指察看、关注或眷顾；上下文中的内心变化似对犹太人有利，故采用“眷顾”，但不进一步说明其来源。
- source_word: παρ' οὐδὲν ἡγούμενος
  choice: 全不……当一回事
  rationale: 准确表达“视为无足轻重、毫不在意”的习语意义。
- source_word: ἀτελέστατον ... ὅρκον
  choice: 一个注定无法兑现的誓言
  rationale: ἀτελέστατος在此有不能达成、不能完成之意；“注定无法兑现”保留叙事中的反讽。
- source_word: βεβαίως ... ὁρισάμενος
  choice: 坚决立下
  rationale: 同时表达βέβαιος的坚定和ὁρίζομαι的确定、立定。
- source_word: ἀνυπερθέτως
  choice: 毫不迟延地
  rationale: 直译其“不推迟、不延期”的时间意味。
- source_word: πέμψειν εἰς ἅιδην
  choice: 送进阴间
  rationale: ἅιδης指死者的领域；“阴间”是现代中文圣经语域中自然且不等同于终末刑罚之地的译法。
- source_word: ἐν γόνασιν καὶ ποσὶν θηρίων ἠκισμένους
  choice: 让他们的膝和脚被野兽残酷摧残
  rationale: 保留受伤部位及野兽施虐的被动关系；“摧残”涵盖αἰκίζω的虐待、折磨意味。
theological_decisions:
- issue: ἅιδης的译法
  choice: 阴间
  alternative: 地狱；死者之境
  rationale: “阴间”能表达死者领域而不把ἅιδης直接等同于后世意义上的“地狱”，避免加入原文没有明说的终末刑罚观。
- issue: πρὸς ἐπισκοπὴν τῶν Ἰουδαίων的方向性
  choice: 为眷顾犹太人
  alternative: 关于察看犹太人的事；为监管犹太人
  rationale: ἐπισκοπή存在察看、监管、眷顾等语义可能；结合“内心转变”及叙事情境，采用较正面的“眷顾”，但不将其明确神学化为神的临在或干预。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“全不……当一回事”稍具现代口语感，但能清楚传达希腊习语；整体仍保持叙事的严肃与强烈谴责语气。原句以逗号结束，似延续至下一节；中文为本节独立可读而用句号收束。
