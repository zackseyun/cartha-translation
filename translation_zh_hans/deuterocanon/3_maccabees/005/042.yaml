    rationale: 该词主要指无理性、愚妄或不明智；“狂妄”可用，却带入较明确的自负意味。用“愚妄”更稳妥。
  - severity: low
    issue: “全不把……当一回事”语体稍口语化。
    rationale: 意思准确，但“毫不看重”在现代庄重叙事中更自然。
