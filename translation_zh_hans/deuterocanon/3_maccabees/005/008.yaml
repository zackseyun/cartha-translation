  yaml_path: translation/deuterocanon/3_maccabees/005/008.yaml
  text: to turn back the unholy plan against them[a], and to rescue them with a magnificent manifestation from the death ready at their feet.
translation:
  language: zh_hans
  text: 使那针对他们的不敬虔图谋逆转，并凭着宏伟的显现[a]，把他们从那近在眼前、随时会临到的死亡中救出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以威严的介入”或“以荣耀的出现”。希腊语ἐπιφάνεια可指引人注目的出现或显现；在此语境中，也可指庄严而显著的介入。
    reason: 保留ἐπιφάνεια在“显现”“出现”与显著介入之间的词义幅度，避免预先界定其具体方式。
lexical_decisions:
- source_word: μεταστρέψαι
  choice: 使……逆转
  rationale: 表达使敌对图谋改变方向、不能按原意实现的使役含义；“逆转”简洁而保留原文力度。
- source_word: βουλὴν ἀνοσίαν
  choice: 不敬虔图谋
  rationale: βουλή在此指针对他们所定的计划；ἀνόσιος不仅表示邪恶，也指在上帝面前不虔不圣，故译作“不敬虔”，避免把宗教意味弱化为一般道德评价。
- source_word: ῥύσασθαι
  choice: 救出来
  rationale: 突出他们正面临迫近死亡，需要从危险中被解救；现代汉语自然清楚。
- source_word: μεγαλομεροῦς ἐπιφανείας
  choice: 极其威荣的显现
  rationale: ἐπιφάνεια保留引人注目的出现或彰显之意，语境指向上帝的援助；μεγαλομερής强调其宏伟尊荣。“显现”不预先界定这种介入的具体方式。
- source_word: μόρου
  choice: 死亡
  rationale: μόρος可指厄运、毁灭或死亡；此处是迫在眉睫的致命结局，译作“死亡”最为明确。
- source_word: παρὰ πόδας ἐν ἑτοίμῳ
  choice: 已在脚前等候
  rationale: 兼顾παρὰ πόδας的脚前空间意象和ἐν ἑτοίμῳ的已经预备妥当、随时临到之意；拟人化表达在中文中自然且有张力。
theological_decisions:
- issue: ἐπιφάνεια在本处所指的性质
  choice: 译作“显现”，按语境让读者理解为上帝显著施援，却不说明其具体形态
  alternative: 威严的介入；荣耀的出现
  rationale: 原词可指显著的出现，且本书语境把拯救归于上帝；“显现”既保留神圣援助的意味，也不把它收窄为某一种神迹或后期神学术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，并保留原文作为较长句中不定式分句的延续感。“脚前等候的死亡”保留原文鲜明的临近意象；脚注标在其实际解释的“显现”之后。
