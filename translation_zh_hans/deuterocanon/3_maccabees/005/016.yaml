  text: When the king considered this[a], and turned to drinking, he ordered those who had come to the banquet to recline around him.
translation:
  language: zh_hans
  text: 王思量此事后，便转而饮酒，吩咐前来赴宴的人在他周围斜倚入席[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文末尾这个短语在文本传承和句法上都颇为困难。它是说宾客以斜倚的姿势，在相对于王的某个位置入席；“在他周围”是按语境译出的，也可能译作“在他附近”或“在他席位的上方”。
    reason: textual_variant
lexical_decisions:
- source_word: λογισάμενος
  choice: 把这事想了想
  rationale: 该词是 λογίζομαι 的不定过去时中间语态分词，表示王在采取下一步行动前思量前述之事；此译保留其先后关系，表达也自然。
- source_word: τραπεὶς εἰς τὸν πότον
  choice: 转而饮酒
  rationale: τραπείς 表示“转向”，与 εἰς τὸν πότον 连用，指转入饮酒；不特指葡萄酒，也不额外强化为纵酒狂欢。
- source_word: παραγεγονότας
  choice: 前来……的人
  rationale: 保留完成时分词所含“已经来到、如今在场”的动作意味，而不只译作静态的“在场者”。
- source_word: ἐπὶ τὴν συμποσίαν
  choice: 前来赴宴
  rationale: συμποσία 可指宴饮或饮酒聚会；“赴宴”符合现代汉语语境，同时由上文“饮酒”显明宴饮性质。
- source_word: ὑπὲρ ἀνακλίνα αὐτοῦ
  choice: 在他周围斜倚入席
  rationale: 传世希腊文本在词形和句法上均有困难，但显然涉及宾客相对于王的位置斜倚就席；正文采用符合宴席场景的语境性译法，并以脚注保留不确定性。
