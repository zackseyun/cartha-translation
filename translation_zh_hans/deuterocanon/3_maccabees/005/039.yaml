  text: 'But the relatives who were reclining with him[a], marveling at his unstable state of mind[b], kept saying these things:'
translation:
  language: zh_hans
  text: 但那些与他一同斜卧用餐的亲属[a]，对他那摇摆不定的心思[b]感到惊异，便不断地说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与他一同用餐的”或“与他同席的”；希腊文具体呈现古人席间斜卧用餐的习俗。
    reason: cultural_note
  - marker: b
    text: 直译“他那摇摆不定的心思”；这个短语指他不稳定、游移不定的心思或心境。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνανακείμενοι
  choice: 与他一同席卧的
  rationale: 该分词指古代宴席中与人一同斜卧用餐；“一同席卧”既保留当时的用餐姿势，也由脚注说明其文化背景。
- source_word: συγγενεῖς
  choice: 亲属
  rationale: 准确表达有亲缘关系的人，现代、清楚而不古奥。
- source_word: ἄσταθη
  choice: 摇摆不定的
  rationale: 在此修饰“心思”，表示不稳定、易变或游移不定；这一译法自然，并避免额外作临床或道德判断。
- source_word: διάνοιαν
  choice: 心思
  rationale: 此处指人的思想状态或内在意向；“心思”比单说“思想”更能自然搭配“摇摆不定”。
- source_word: θαυμάζοντες
  choice: 感到惊异
  rationale: 保留因意外而惊讶、诧异的含义，不将其误解为赞叹。
- source_word: προεφέροντο
  choice: 不断说出
  rationale: 用“不停/不断”的表达体现未完成时所含的持续或反复意味，并保留“说出、提出”的语感。
- source_word: τάδε
  choice: 以下的话
  rationale: 这是指向随后引语的惯用表达；译作“以下的话”在现代汉语中比直译“这些事”更清楚。
