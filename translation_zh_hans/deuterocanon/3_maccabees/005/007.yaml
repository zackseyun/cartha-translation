  yaml_path: translation/deuterocanon/3_maccabees/005/007.yaml
  text: They all called upon the almighty Lord[a], the sovereign over every dominion, their merciful God and Father, with tears and with an unceasing cry, begging him,
translation:
  language: zh_hans
  text: 众人都含着泪，不住地呼喊，求告全能的主、统管一切掌权者的主宰[a]、他们那满有怜悯的上帝和父，向他恳求，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“统管一切权势的主宰”。希腊原文连用同源的统治用语，强调上帝超越一切掌权者或权势。
    reason: 保留πάσης δυνάστην δυναστεύοντα在“掌权者”与“权势”之间的词义可能，并说明原文的同源词修辞。
lexical_decisions:
- source_word: παντοκράτορα
  choice: 全能的
  rationale: 这是圣经希腊语中该神圣称号的常见对应，简洁地表达无所不能的含义。
- source_word: κύριον
  choice: 主
  rationale: 保留其作为神圣称号的传统和敬虔语气。
- source_word: πάσης δυνάστην δυναστεύοντα
  choice: 统管一切掌权者的主宰
  rationale: 原文以同源词叠加强调统治权；译文用“掌权者—主宰—统管”尽量保留这种修辞力量，同时保持现代汉语自然。
- source_word: ἐλεήμονα
  choice: 仁慈的
  rationale: 表达怜悯、慈悲的品格，语体庄重而易懂。
- source_word: θεὸν αὐτῶν καὶ πατέρα
  choice: 他们仁慈的上帝和父
  rationale: 让“他们的”在汉语结构中同时修饰“上帝”和“父”，并保留原文明确的父性称谓。
- source_word: δυσκαταπαύστῳ βοῇ
  choice: 不住地呼喊
  rationale: 该形容词指难以止息，译作“不住地”自然传达持续而急切的呼声。
- source_word: πάντες
  choice: 众人都
  rationale: 突出全体共同参与，与原文对“所有人”的强调相应。
- source_word: μετὰ δακρύων
  choice: 含着泪
  rationale: 自然、鲜明地呈现他们祈求时悲痛的状态。
- source_word: ἐπεκαλέσαντο
  choice: 求告
  rationale: “求告”适合向上帝呼求的宗教语境，也保留祷告式呼唤的意味。
- source_word: δεόμενοι
  choice: 向他恳求
  rationale: 表达迫切的祈求；保留分词与后文衔接的未完结构。
theological_decisions:
- issue: 如何呈现连续叠加的神圣称号
  choice: 全能的主、统管一切掌权者的主宰、他们仁慈的上帝和父
  alternative: 全能的主和统管一切权势的那一位、他们仁慈的上帝和父
  rationale: 原文连续堆叠称号与描述，以加强祷告中对上帝至高权能和亲密关系的宣认；译文不把它们压缩为单一称号，并明确保留“父”。
- issue: πάσης δυνάστην δυναστεύοντα所指对象的歧义
  choice: 统管一切掌权者的主宰
  alternative: 统管一切权势的主宰
  rationale: 相关词可侧重掌权的人，也可泛指权力或权势。正文采用较具人格性的“掌权者”，脚注保留抽象理解，避免把原文可能的张力悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝”依项目目标使用；“父”按原文直译。句末逗号保留本节在“恳求”之后继续展开的未完句法。
