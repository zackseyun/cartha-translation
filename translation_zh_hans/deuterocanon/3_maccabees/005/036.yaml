  text: Then the king[a], having arranged the whole banquet according to the same rules, urged them to turn to rejoicing.
translation:
  language: zh_hans
  text: 王按照同样的规程[a]安排好整个宴席后，就劝众人转而欢乐起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “规程”或译“律法”或“惯例”。希腊文νόμοι可指法律、规则或约定俗成的规范；这里因涉及宴席的安排，译作“规程”。
    reason: 保留原词的词义范围，避免把宴席语境过度法律化。
lexical_decisions:
- source_word: Κατὰ δὲ τοὺς αὐτοὺς νόμους
  choice: 则照着同样的规程
  rationale: κατά加宾格表示依照或遵循；νόμοι既可指法律，也可指规则、惯例。宴席语境中译作“规程”较自然，同时用脚注保留“律法”的可能。δὲ译作“则”，承接上下文并带出轻微转折或推进。
- source_word: συστησάμενος
  choice: 安排了
  rationale: 该不定过去时中间语态分词表示王先行筹办、组织或布置宴席；“安排了”简明自然，也保留其先于主要动作发生的关系。
- source_word: πᾶν τὸ συμπόσιον
  choice: 整个宴席
  rationale: συμπόσιον指宴饮、筵席；“宴席”符合现代汉语语域，“整个”对应πᾶν。
- source_word: εἰς εὐφροσύνην τραπῆναι
  choice: 转而欢乐起来
  rationale: τρέπω的被动形式在此可作不及物意义，表示转入另一种状态；εἰς εὐφροσύνην指向欢乐的状态。“转而欢乐起来”保留状态转变的意象。
- source_word: παρεκάλει
  choice: 劝众人
  rationale: παρακαλέω在此表示劝说、鼓励。希腊文未明说宾语，汉语为行文清楚补出由宴席参与者构成的“众人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事汉语。“规程”体现宴席安排的程序性；“劝众人转而欢乐起来”既保留原文的劝勉力度，也保留由先前状态转入欢庆的动态表达。
