  text: 'But he, filled with heavy anger at what had been said, because all his purpose concerning these things had been frustrated by the providence of God, spoke with threats, pressing the matter hard:'
translation:
  language: zh_hans
  text: 但他因所说的话满腔怒气；因上帝的眷顾，他在这些事上的一切图谋都被打乱了，于是他以威胁加紧施压，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλησθεὶς βαρεῖ χόλῳ
  choice: 怒火中烧
  rationale: 表达“被沉重、强烈的怒气充满”的状态，符合现代汉语习惯，也保留原文怒气之强烈。
- source_word: προνοίᾳ θεοῦ
  choice: 由于上帝的眷顾
  rationale: πρόνοια指上帝的照管、护理或眷顾；“眷顾”自然易懂，并明确保留上帝的主动介入。
- source_word: πᾶν αὐτοῦ νόημα
  choice: 他……的一切图谋
  rationale: νόημα在此指心中的意图、谋划；结合敌对语境译为“图谋”，同时以“一切”对应πᾶν。
- source_word: διεσκεδάσθαι
  choice: 都被打乱了
  rationale: 原词有驱散、瓦解之意；用于谋划时，“打乱”自然地表达其意图因神的眷顾而无法整合落实。
- source_word: ἐντείνων μετὰ ἀπειλῆς
  choice: 咄咄逼人地威胁说
  rationale: ἐντείνων含加紧、用力施压之意，μετὰ ἀπειλῆς明确带有威胁；合译既保留逼迫力度，也使汉语叙述流畅。
theological_decisions:
- issue: 上帝的眷顾与人的图谋之间的关系
  choice: 明确说他的图谋“由于上帝的眷顾”而被打乱
  alternative: 弱化为“因故未能实现”
  rationale: 原文直接以προνοίᾳ θεοῦ说明原因，故不应淡化上帝在事件中的护理作用。
- issue: νόημα所指的范围
  choice: 译为“一切图谋”
  alternative: 译为“一切计划”或“一切心思”
  rationale: “图谋”符合人物在上下文中的敌对行动，但不进一步界定其具体内容，保留原文概括性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“怒火中烧”“咄咄逼人”传达原句的强烈情绪和施压力度；句末冒号承接下一节将出现的直接引语。
