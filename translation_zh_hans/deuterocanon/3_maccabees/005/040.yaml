base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/040.yaml
  text: O king[a], how long will you keep testing us, now commanding for the third time that they be destroyed, and then again, in the matter at hand, reversing by a change of mind the decisions you have made?
translation:
  language: zh_hans
  text: 王啊，你还要这样考验我们到什么时候呢？你如今已是第三次下令消灭他们，却又在这件事上因改变心意而推翻自己已作出的决定[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自己所颁的谕令”。希腊语可特指王正式颁布的命令，而不只是个人作出的决定。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπειράζεις
  choice: 这样考验我们
  rationale: 该动词表示试验、探究；现在时与“到什么时候”连用，显出持续的意味。“这样考验我们”既自然，也保留责问的语气。
- source_word: προστάσσων
  choice: 下令
  rationale: 此分词说明王如何考验众人，带有正式命令的权威色彩。
- source_word: ἤδη τρίτον
  choice: 如今已是第三次
  rationale: 同时表达ἤδη所含“已经到了这一步”的意味和τρίτον所指的第三次重复。
- source_word: αὐτοὺς ἀφανίσαι
  choice: 消灭他们
  rationale: ἀφανίζω在此指使人灭亡、被除灭；“消灭他们”准确保留命令的直接对象及其严重程度。
- source_word: ἐπὶ τῶν πραγμάτων
  choice: 在实际执行时
  rationale: 该短语在本语境中指事情落实、付诸实行之际；此译比抽象的“在这些事务上”更符合现代汉语，同时未改变上下文所说的具体情势。
- source_word: ἐκ μεταβολῆς
  choice: 改变心意
  rationale: 字面为“由于改变”，在这里指意向或决定发生转变；“改变心意”清楚传达王反复改弦更张的意思。
- source_word: ἀναλύων
  choice: 撤销
  rationale: 此处指取消、解除先前已经作出的决定；“撤销”适合王命和正式决定的语境。
- source_word: τὰ σοὶ δεδογμένα
  choice: 自己所作的决定
  rationale: δεδογμένα可指已经议定或正式颁定之事。“所作的决定”保留其一般含义；可能更具体地指王所颁谕令，列入脚注。
