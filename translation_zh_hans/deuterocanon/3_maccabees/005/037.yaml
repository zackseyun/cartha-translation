translation_notes:
  register: 采用现代、清楚而有叙事尊严的普通话；直接引语保留君王威吓、恼怒和侮辱性的语气。原文在 Ποσάκις 后及 προστάττειν 前后有重复的 σοι，疑属文本小差异或抄写性重复，译文按正常汉语只表达一次“你”，不另设脚注，因为不影响实质意义。
