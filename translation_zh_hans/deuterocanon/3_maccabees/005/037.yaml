  text: Then, summoning Hermon with a threat, he said, “How many times must I command you about these very matters, you most wretched man?”
translation:
  language: zh_hans
  text: 于是，他带着威吓把赫尔蒙召来，说：“就这些事本身，我还要吩咐你多少遍，最可怜的人？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ... Ἕρμωνα
  choice: 赫尔蒙
  rationale: 按希腊语人名 Ἕρμων 音译，并与常见的 Hermon 区分处理。
- source_word: προσκαλεσάμενος
  choice: 把……召来
  rationale: 表达不定过去时中间语态分词所指的召到自己面前之意，中文自然简洁。
- source_word: μετὰ ἀπειλῆς
  choice: 带着威吓
  rationale: 保留介词短语的具体表达及威胁性的语气，不弱化为一般的严厉态度。
- source_word: Ποσάκις ... δεῖ ... προστάττειν
  choice: 我还得吩咐你多少次
  rationale: 以现代汉语反问句呈现频次、必要性与命令含义；“还得”体现说话者不耐烦的责斥口吻。
- source_word: περὶ τούτων αὐτῶν
  choice: 关于这些事
  rationale: τούτων αὐτῶν 回指正在谈论的同一批事情；汉语语境中“这些事”已能自然承载回指，避免生硬的“这些同样的事”。
- source_word: ἀθλιώτατε
  choice: 可怜透顶的家伙
  rationale: 保留 ἄθλιος 最高级呼格的强烈贬斥；“透顶”传达最高级，“家伙”体现直接辱骂而不过分古雅。
