base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/013.yaml
  text: And the Jews[a], having escaped the appointed hour, again were imploring their holy God to show to the proud nations, in magnificent generosity[c][b], the might of his hand.
translation:
  language: zh_hans
  text: 犹太人逃过了那预先指定的时刻，又恳求他们的圣者，就是那位乐于和解的上帝，以宏伟的方式向狂傲的列国[a]彰显他手中的大能。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国”或译“外邦人”。希腊词既可泛指各国，也可在犹太语境中特指外邦人。
    reason: lexical_alternative
  - marker: b
    text: “乐于和解”也可译作“容易和解”“容易被劝解”或“愿意宽宥”；此处形容上帝。所译“以宏伟的方式”的希腊副词十分罕见，也可理解为“壮伟地”或“高贵不凡地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαφυγόντες
  choice: 逃过了
  rationale: 该分词表示成功脱离或避过已经临到的危险时限；“逃过了”既保留危险感，也符合现代汉语表达。
- source_word: τὴν προσημανθεῖσαν ὥραν
  choice: 预先指定的时刻
  rationale: προσημανθεῖσαν 指事先标明或定下；译文保留“预先”的语义，并用“时刻”对应 ὥραν。
- source_word: τὸν ἅγιον ἤγουν θεὸν αὐτῶν
  choice: 那圣者，也就是他们的上帝
  rationale: 保留 ἤγουν 的解释作用，而不将其淡化为单纯的“圣洁的上帝”；“那圣者”也保留名词化表达的可能性。
- source_word: καὶ πάλιν ἤξιουν
  choice: 就再次恳求
  rationale: “再次”对应 καὶ πάλιν；“恳求”体现 ἤξιουν 在祈求语境中的迫切意味。希腊语未完成时所含的持续意味在汉语中由语境自然承载。
- source_word: τὸν εὐκατάλλακτον
  choice: 那位乐意息怒的上帝
  rationale: 该词形容容易和解、容易被劝解或愿意息怒者。译作“乐意息怒”既保留其关于上帝态度的真实张力，也避免将其误解为反复无常；补出“上帝”使汉语指代清楚。
- source_word: μεγαλοφθενῶς
  choice: 以宏伟不凡的方式
  rationale: 这是罕见副词，表达宏大、壮伟或高贵不凡的方式；该译法使它明确修饰“彰显”，而不与 εὐκατάλλακτον 合并。
- source_word: ἑαυτοῦ χειρὸς κράτος
  choice: 他手中的大能
  rationale: 保留“手”与“能力”的具体圣经意象；“手中的大能”在现代汉语中自然而庄重。
- source_word: ἔθνεσιν ὑπερηφάνοις
  choice: 向狂傲的列国
  rationale: ἔθνεσιν 可指各国、各族，也可在犹太语境中特指外邦人；正文采用较宽泛的“列国”，以脚注保留另一种可能。“狂傲”比一般的“骄傲”更充分表达 ὑπερηφάνοις 的贬义。
theological_decisions:
- issue: εὐκατάλλακτον 对上帝性情的描述
  choice: 乐意息怒
  alternative: 容易和解；容易被劝解；满有恩慈
  rationale: 原词确实带有容易和解或容易平息怒气的意味。译作“乐意息怒”不把这一张力完全抽象化为泛泛的“恩慈”，同时也不暗示上帝可以被机械地安抚。
- issue: τὸν ἅγιον ἤγουν θεὸν αὐτῶν 的解释关系
  choice: 那圣者，也就是他们的上帝
  alternative: 他们圣洁的上帝
  rationale: ἤγουν 明示解释或换言关系。正文保留这个结构，使“那圣者”与“他们的上帝”之间的同位关系可见，而不将其无声压缩为形容词结构。
- issue: 神力彰显的对象 ἔθνεσιν
  choice: 向狂傲的列国
  alternative: 向狂傲的外邦人；对付狂傲的列国
  rationale: 与格本身可表达彰显所面向的对象，未必明确表示敌对行动；因此采用中性的“向”，并避免擅自加入“对付”。“列国/外邦人”的歧义以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“那圣者，也就是……”保留原文解释性结构；破折号标出同位成分，避免长句层次含混。正文不采用教派化术语，并以脚注保存“列国/外邦人”及两个罕见词语的语义余地。
