- source_word: βαρείᾳ
  choice: 沉重的
  rationale: 保留原词关于重量与压迫感的比喻，用来加强怒气的强烈程度。
- source_word: μεμεστωμένος
  choice: 心中充满
  rationale: 完成时分词描写一种已经形成并持续的充满状态；补出“心中”使汉语自然，但不增添实质信息。
- source_word: ὀργῇ
  choice: 怒气
  rationale: 采用常用且较宽泛的愤怒用语，以便与χόλος形成修辞上的并列。
- source_word: καὶ χόλῳ
  choice: 和……忿怒
  rationale: χόλος表示强烈、激烈的怒意；“忿怒”保持庄重语体，并与“怒气”有所区别。
- source_word: κατὰ πᾶν
  choice: 全然
  rationale: 在此作程度强化语，现代汉语用“全然”简明表达“完全、彻底”的意思。
- source_word: ἀμετά-
  choice: 不可平息的
  rationale: 底本页末仅保存断词开头ἀμετά-；结合修饰愤怒的语境，译作“不可平息”表达不被转变或劝止的怒意，同时以脚注说明原文残缺及其他可能。
