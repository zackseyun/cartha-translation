base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/018.yaml
  text: But as the conversation kept dragging on[a], the king summoned Hermon and, with a bitter threat, asked for what reason the Jews had been spared, having survived beyond the appointed day.
translation:
  language: zh_hans
  text: 但谈话越发拖延，王便召来赫尔蒙，带着严厉的威胁追问：犹太人究竟因为什么缘故，在熬过剩下的那一天后仍得以保全？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾的希腊语措辞紧缩且含义不易确定。直译可作：“犹太人活过了剩下（或额外）的那一天后，为什么被医治（或保全）了？”这里的“医治”在上下文中很可能指免遭毁灭、得以存活；“剩下的那一天”也可能指他们已经熬过原定处死期限的那一天。
    reason: 保留 ἰάθησαν、περιοῦσαν ἡμέραν 与 περιβεβιωκότες 的词义歧义及句法困难。
lexical_decisions:
- source_word: ἐπὶ πλεῖον … προσκοπτούσης τῆς ὁμιλίας
  choice: 谈话越发拖延
  rationale: 该结构表示谈话继续延长，并带有受阻、不顺的意味；“越发拖延”既体现时间延续，也保留叙事中的不耐与阻滞感。
- source_word: προσκαλεσάμενος
  choice: 召来
  rationale: 中间语态分词表示王把赫尔蒙叫到自己面前；“召来”自然体现君王的权威。
- source_word: μετὰ πικρίας ἀπειλῆς
  choice: 带着严厉的威胁
  rationale: 保留单数“威胁”及 πικρίας 所表达的尖刻、敌意；现代汉语用“严厉”比直译“苦毒的”更自然。
- source_word: ἐπυνθάνετο τίνος ἕνεκεν αἰτίας
  choice: 追问……究竟因为什么缘故
  rationale: “追问”体现威胁语境，“究竟因为什么缘故”保留希腊语问因结构的强调力度。
- source_word: ἰάθησαν
  choice: 得以保全
  rationale: 该词通常意为“被医治”，但此处并非疾病语境，而是犹太人免遭毁灭、仍然存活；“得以保全”保留被动意味且不过度解释是谁使其存留。
- source_word: τὴν περιοῦσαν ἡμέραν
  choice: 剩下的那一天
  rationale: 短语含义困难，可能指剩余、额外或已经延过的那一天；正文采用较贴近词面的“剩下的那一天”，并在脚注中保留其他可能。
- source_word: περιβεβιωκότες
  choice: 熬过
  rationale: 完成时分词强调他们已经活过某一时间界限；“熬过”符合面临死亡威胁的处境，并表达持续存活。
theological_decisions:
- issue: 犹太人存活的施事者是否应明确为上帝
  choice: 采用被动式“得以保全”，不明说施事者
  alternative: 译为“蒙上帝保全”或“被王饶过”
  rationale: 希腊文本在本句没有明示施事者；不补入上帝或王，可保留原文的叙事与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“王”“召来”“追问”等词保持历史叙事语体；避免生硬直译“苦毒的威胁”和医学化的“被医治”，同时用脚注交代原文形式与歧义。
