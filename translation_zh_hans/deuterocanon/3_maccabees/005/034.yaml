  text: But each of the friends[a], looking grim, dismissed those who had gathered[b], each one to his own occupation.
translation:
  language: zh_hans
  text: 可是，每一个朋友都面色阴沉[a]，把聚集的人逐一遣散，让他们各自去忙自己的事。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊文在“面色阴沉”之后有罕见词形ὑπεκρέων，且所用底本文本校验标为轻微不符。其确切语法和含义不稳；译文依据上下文及明确的动词“遣散”表达整体意思，不另行赋予该词一个不能确定的独立动作含义。
    reason: textual_variant
  - marker: b
    text: “自己的事”也可译作“自己的事务”“自己的工作”或“自己的业务”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθ᾽ εἷς τῶν φίλων
  choice: 王的朋友们个个
  rationale: καθ᾽ εἷς 表示逐个、人人；φίλοι 在本段王室语境中指王身边称为“朋友”的人。补出“王的”以使现代中文指代清楚，同时不进一步限定为官员或廷臣。
- source_word: σκυθρωπῶς
  choice: 面色阴沉
  rationale: 该副词描述阴郁、愁苦或严峻的神情；“面色阴沉”自然传达可见的脸色和情绪。
- source_word: ὑπεκρέων
  choice: 不单独落实为确定动作
  rationale: 此词形罕见且底本校验标为轻微不符，确切解析不稳；译文依句中明确的有限动词 ἀπέλυαν 表达遣散之意，避免把推测性的第二个动作写入正文。
- source_word: τοὺς συνθροισμένους
  choice: 聚集的人
  rationale: 指已经聚集在一起的人群；中文简洁自然。
- source_word: ἀπέλυαν
  choice: 遣散
  rationale: ἀπολύω 在这里表示让聚集者离开、散去；“遣散”契合场景，也保留主动使人离去的含义。
- source_word: ἕκαστον ἐπὶ τὴν ἰδίαν ἀσχολίαν
  choice: 叫他们各自回去料理自己的事务
  rationale: ἕκαστον 强调逐人分散；ἀσχολία 可指事务、业务或日常忙碌。“料理自己的事务”比“职业”涵盖面更宽，也保留原文未明确其具体活动的含混性。
