  yaml_path: translation/deuterocanon/3_maccabees/005/043.yaml
  text: But if he should campaign against Judea[a], he would quickly make it level with fire and spear, and after burning their sanctuary—untrodden by us[b]—with fire, he would put a stop forever to those who perform sacrifice there.
translation:
  language: zh_hans
  text: 但他若出兵攻打犹太地，就会迅速以火和矛将其夷为平地；他还会很快用火焚烧他们那座我们不能踏入[a]的圣所[b]，并在焚烧之后永远制止那些在那里举行祭祀的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不能踏入”所译的希腊语，字面意思是“不可踩踏”或“不可进入”；也可译作“禁止我们进入”。
    reason: lexical_alternative
  - marker: b
    text: 斯威特版所录“焚烧”一词的部分字母略有不确定，但放火烧毁圣所的意思是清楚的。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιστρατεύσαντα
  choice: 出兵攻打
  rationale: 保留该词的军事行动含义，也符合汉语叙述威胁或计划时的自然表达。
- source_word: ἰσόπεδον … στήσεσθαι
  choice: 将其夷为平地
  rationale: 以现代汉语惯用语表达使犹太全境成为平地、彻底毁坏的图景。
- source_word: πυρὶ καὶ δόρατι
  choice: 用火与矛
  rationale: 保留原文并列的两种毁灭手段及其鲜明意象。
- source_word: διὰ τάχους / ἐν τάχει
  choice: 迅速 / 很快
  rationale: 原文两次强调行动迅速，译文分别保留，避免删去重复。
- source_word: ἄβατον ἡμῖν
  choice: 我们不能踏入的
  rationale: 既保留ἄβατον与行走、踏入有关的具体意象，也不武断判定是礼仪禁令还是事实上不可进入。
- source_word: ναόν
  choice: 圣所
  rationale: ναός通常指圣殿内部的圣所，而非整个圣殿区域；此处又有ἄβατον修饰，译作“圣所”更准确。
- source_word: πρήσαντα
  choice: 用火焚烧
  rationale: 尽管抄录字母略有不确定，纵火焚烧之意清楚；译文也保留原文再次出现的“火”。
- source_word: τῶν συντελούντων ἐκεῖ θυσίαν
  choice: 那些在那里举行祭祀的人
  rationale: 贴近“完成、举行祭祀”的措辞，不额外限定这些人必然具有某种特定祭司身份。
- source_word: εἰς τὸν ἅπαντα χρόνον καταστήσειν
  choice: 永远制止
  rationale: 表达永久终止之意，同时没有明确增添杀死祭祀者或单纯废除祭礼的细节。
theological_decisions:
- issue: ἄβατον ἡμῖν所表达的圣所隔绝性质
  choice: 我们不能踏入的圣所
  alternative: 禁止我们进入的圣所；我们从未踏足的圣所
  rationale: “不能踏入”保留外人的第一人称视角和踏入意象，也让禁入与无法进入之间的细微开放性继续存在。
- issue: ναός的范围
  choice: 圣所
  alternative: 圣殿
  rationale: “圣所”较能体现ναός所指的内部神圣建筑，并与“不能踏入”相呼应，但不借此加入额外教义判断。
- issue: 永久终止的直接对象
  choice: 永远制止那些在那里举行祭祀的人
  alternative: 使那里永远不再有人献祭；永远铲除献祭者
  rationale: 原文着眼于举行祭祀的人，但具体是消灭他们还是使其活动停止，并未在本句中完全展开；“制止”避免把暴力结果说得比原文更明确。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“夷为平地”传达战争毁灭的力度；分号保留原文连续威胁中的两个阶段。脚注标记均置于其实际说明的词语之后。
