base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/031.yaml
  text: All the parents who were present[a], and the children with them, have prepared this lavish feast for the wild beasts, instead of the Jews[b], who have been shown to me and to my forefathers to possess complete and steadfast faithfulness beyond reproach.
translation:
  language: zh_hans
  text: 凡在场的父母和他们的儿女[a]，都为野兽备下了这场丰盛的筵席；本来要给野兽作食物的，却是犹太人[b]——他们已经向我和我的祖先证明，自己无可指责，忠诚完全而坚定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“儿女的后裔”，在这个文本见证中措辞生硬，也可能泛指与父母同在的儿女或后代。
    reason: lexical_alternative
  - marker: b
    text: “忠诚”也可译作“信实”或“完全而坚定的信心”；这里大概是指犹太人对君王和王室历来可靠忠贞，而不特指宗教意义上的信心。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅσοι γονεῖς παρῆσαν
  choice: 凡在场的父母
  rationale: 以“凡……的”表达ὅσοι所涵盖的全体，γονεῖς按上下文译作“父母”，παρῆσαν译作“在场”，自然且庄重。
- source_word: ἢ παίδων γόνοι
  choice: 和他们的儿女
  rationale: 该短语在此见证中措辞生硬，字面近于“儿女的后裔”；正文采用可理解的广义表达，并以脚注保留文本上的含混。ἤ在这一困难结构中按并列意义处理。
- source_word: θηρσὶν ἀγρίοις
  choice: 为野兽
  rationale: 与备宴的语义相连，表达承受或用途；“野兽”保留场景的凶险色彩。
- source_word: ἐσκεύασαν δαψιλῆ θοῖναν
  choice: 备下了这场丰盛的筵席
  rationale: ἐσκεύασαν表示预备、置办，δαψιλῆ θοῖναν指丰盛的宴席；译文保留以人为兽宴的冷酷反讽。
- source_word: ἀντὶ τῶν ... Ἰουδαίων
  choice: 本来要给野兽作食物的，却是犹太人
  rationale: ἀντί表示替代。汉语若直译“代替犹太人”容易误解，故明确说明野兽原定吞食的是犹太人，而在场的父母儿女反成了替代者。
- source_word: ἀνεγκλήτων
  choice: 无可指责
  rationale: 保留该词“不受控告、无可归罪”的司法性意味。
- source_word: ἀποδεδειγμένων
  choice: 已经显明自己
  rationale: 完成时分词表示这种表现已得到证实并具有既定效力。
- source_word: ὁλοσχερῆ βεβαίαν πίστιν ἔχων
  choice: 始终完全忠诚
  rationale: 本句是君王评价犹太人对王室一贯可靠的政治语境；用“忠诚”表达πίστις的忠实、可信义，并以“完全”“始终”传达ὁλοσχερῆ与βεβαίαν的完整、坚定意味。
theological_decisions:
- issue: 政治语境中πίστις的译法
  choice: 忠诚
  alternative: 信实；坚定的信心
  rationale: 这里说的是犹太人在君王及其祖先面前已经得到证明的品格，主要指可靠与忠贞，而非专指宗教意义上的信心。正文采用自然的“忠诚”，脚注保留“信实”等语义可能。
- issue: ἀντί所表达的替代关系
  choice: 在场的父母儿女成为替代犹太人的兽食
  alternative: 他们为野兽预备筵席，而不是为犹太人预备
  rationale: 句法和叙事情境表明，这些人自身构成野兽的“筵席”，替代原定受害的犹太人；若理解成宴席的受宴对象，会削弱上下文的残酷反讽。
translation_notes:
  register: 采用现代标准书面汉语，保持叙事的庄重和残酷反讽。“筵席”略带文学色彩但仍为普通读者熟悉；破折号用来清楚连接“犹太人”与其已获证实的无可指责和忠诚。所有脚注标记均已置于正文相应位置。
