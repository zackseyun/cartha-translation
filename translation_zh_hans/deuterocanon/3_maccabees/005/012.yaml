base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/012.yaml
  text: And by the action of the Sovereign he was overcome with a most pleasant and deep stupor[b][a], having been greatly frustrated in his lawless purpose and utterly disappointed in his unchangeable resolve.
translation:
  language: zh_hans
  text: 借着主宰[b]的作为，他被极其香甜而深沉的睡眠[a]所制住；他那无法无天的企图大受挫败，他那不可更改的决意也彻底落空。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明说“睡眠”，而以不寻常的省略性措辞描述他被“极其甘美而深沉”的状态制住。结合上下文，译作“睡眠”最为自然；“甘美而深沉”的意象在原文中仍带有突兀性。
    reason: 说明原文未明说睡眠及其不寻常意象，同时避免把形容词误作修饰“主宰的作为”。
  - marker: b
    text: “主宰”所译的希腊词强调绝对权柄，也可译作“主人”；它不同于通常译作“主”的另一个希腊称号。
    reason: 保留神圣称号δεσπότης的词义特色及其与κύριος的区别。
lexical_decisions:
- source_word: ἥδιστῳ
  choice: 极其酣甜
  rationale: 这是ἡδύς的最高级。结合上下文所描述的睡眠状态，“酣甜”既保留“甘甜、愉悦”的鲜明意味，也符合现代汉语对睡眠的自然描述。
- source_word: βαθεῖ
  choice: 深沉
  rationale: 保留“深”的基本意象；与“沉睡”搭配自然，又不削弱原文强调其程度之深的表达。
- source_word: κατεσχέθη
  choice: 陷入了……沉睡
  rationale: 该被动形式可表示被抓住、控制或制住。这里按叙事语境表达为被一种深沉睡眠所控制，但以脚注说明原文没有明说“沉睡”。
- source_word: ἐνεργείᾳ
  choice: 作用
  rationale: 表示有效的运行、活动或力量；“作用”简洁地传达神所施行之能力及其实际效果。
- source_word: δεσπότου
  choice: 主宰
  rationale: δεσπότης突出绝对权柄，与通常译作“主”的κύριος有所区别；“主宰”在现代汉语中庄重且能体现统治权。
- source_word: ἀθέσμου
  choice: 无法无天的
  rationale: 该词指违背律法、规矩或道德秩序之事；“无法无天”兼具违法与悖逆正道的强烈色彩。
- source_word: προθέσεως
  choice: 企图
  rationale: 指预先设定的意图或目的；因这里所指带有恶意，“企图”比中性的“计划”更合语境。
- source_word: πολὺ διεσφαλμένος
  choice: 大受挫败
  rationale: διασφάλλω可表示使失足、偏离或失败。这里强调他的恶意目的未能实现，“大受挫败”自然传达其结果。
- source_word: ἀμεταθέτου
  choice: 不可更改的
  rationale: 保留“不被改变或挪动”的基本含义，不额外判断这种坚定究竟是客观事实还是人物自己的认定。
- source_word: λογισμοῦ
  choice: 决意
  rationale: 该词可指思量、盘算或谋划；在此与πρόθεσις平行，指已经定下的意念，“决意”能体现其顽固坚定。
- source_word: μεγάλως διεψευσμένος
  choice: 彻底落空
  rationale: διαψεύδω的被动形式可指期望受骗、失望或被事实证明错误；“彻底落空”清楚表达其既定决意被事件挫败。
theological_decisions:
- issue: 如何翻译作为神圣称号的δεσπότου
  choice: 主宰
  alternative: 主人；主
  rationale: 原文使用δεσπότης而非κύριος，重点在绝对权柄。“主宰”保留这一词汇区别，也避免将两种希腊称号无差别地译成“主”。
- issue: 是否在正文补出睡眠状态
  choice: 按上下文译作“沉睡”，并以脚注保留原文表达的不寻常性
  alternative: 直译为“被一种极其甘美而深沉的作用制住”
  rationale: 希腊文的形态与句法意象不寻常，形容词没有清楚修饰一个明说的状态名词；上下文及κατεσχέθη所表达的被控制状态支持理解为沉睡。正文采用自然可懂的表达，脚注同时保留较直译的可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“酣甜而深沉的沉睡”适合普通读者，也保留原文“甘美”与“深”的突兀意象；后半句使用两个并列分句，再现企图受挫与决意落空的对应关系。
