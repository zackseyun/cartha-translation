  yaml_path: translation/deuterocanon/3_maccabees/005/002.yaml
  text: He ordered that[a], by the coming day, all the elephants—five hundred in number—be given drink with generous draughts of frankincense and much unmixed wine, and that, once made savage by the abundant supply of drink, they be brought in for the destruction of the Jews.
translation:
  language: zh_hans
  text: 他下令，到次日，要给所有的大象——共五百头——灌喂大量乳香，并灌以大量未经兑水的酒；待它们在大量饮料的供给下变得凶暴后，就把它们带进去，以毁灭犹太人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“去迎接犹太人的死亡（或厄运）。”希腊文直译为“去与犹太人的死亡/厄运相遇”；在这里指有意借此毁灭犹太人。
    reason: 保留πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων的“相遇”意象及μόρος可指死亡或厄运的词义范围，同时说明上下文中的杀害意图。
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: 他下令
  rationale: 准确表达κελεύω所指的权威命令，简洁自然。
- source_word: ὑπὸ τὴν ἐρχομένην ἡμέραν
  choice: 到第二天时
  rationale: 按语境表达临近、到来之日的时间指向；现代汉语中比逐字翻译更自然。
- source_word: δαψιλέσι δράκεσι λιβανωτοῦ
  choice: 大把的乳香
  rationale: δράξ本义为一把、满手之量，δαψιλέσι强调数量丰厚；译文保留具体的计量意象，而不把它误解为液体的“口”或“杯”。
- source_word: οἴνῳ πλείονι ἀκράτῳ
  choice: 大量不掺水的酒
  rationale: ἀκράτος指未经兑水的酒；“不掺水”清楚保留古代通常兑酒饮用这一背景下的重要细节。
- source_word: ὄντας τὸν ἀριθμὸν πεντακοσίους
  choice: 共五百头
  rationale: 自然、凝练地传达大象的总数。
- source_word: ἀγριωθέντας
  choice: 变得狂暴
  rationale: 保留被动致使含义：大象因所饮之物而被激发至凶猛狂暴。
- source_word: τῇ τοῦ πόματος ἀφθόνῳ χορηγίᾳ
  choice: 充足供应的饮料
  rationale: χορηγία表示供应、供给，ἄφθονος表示充裕；此处指前述给大象灌下的混合饮料。
- source_word: εἰσαγαγεῖν
  choice: 把它们带进去
  rationale: 保留εἰσάγω的进入方向及使役意味，符合驱赶大象入场的情境。
- source_word: πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων
  choice: 用来毁灭犹太人
  rationale: 该压缩短语字面涉及“与犹太人的死亡命运相遇”，语境明确指使大象成为杀害犹太人的工具；正文采用清楚自然的目的表达，脚注保留原文意象与其他可能译法。
theological_decisions:
- issue: μόρος及整个属格短语在集体杀戮语境中的译法
  choice: 用来毁灭犹太人
  alternative: 使犹太人遭遇死亡／去迎向犹太人的厄运
  rationale: μόρος可指死亡、厄运或毁灭；原文结构凝缩，字面意象略显含混，但上下文表明命令的目的在于杀灭犹太人。正文明确实际意图，同时用脚注保存字面表达及词义张力，不赋予额外的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“灌下”切合强制使大象饮用的场景；破折号自然标出数量补充说明。脚注标记已在正文中以[a]出现。
