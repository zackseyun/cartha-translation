  yaml_path: translation/deuterocanon/3_maccabees/005/006.yaml
  text: But the Jews[a], seeming to the nations to be deprived of every protection because of the necessity that surrounded them on every side with chains,
translation:
  language: zh_hans
  text: 然而，犹太人在各族人看来，似乎全然没有庇护[a]，因为那用锁链从四面围困他们的困境，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “庇护”也可译作“遮蔽”或“保护”。
    reason: 保留 σκέπη 可指遮盖、 shelter 与保护的词义范围；正文按此处受困、孤立的语境采用“庇护”。
lexical_decisions:
- source_word: σκέπης
  choice: 庇护
  rationale: 本词可指遮盖、藏身之所或保护；此处描述犹太人在敌对各族眼中的孤立无援，“庇护”既保留形象，也自然表达其引申义。
- source_word: ἔρημοι
  choice: 失去
  rationale: 与属格 πάσης σκέπης 连用，表示缺少、全无或被撇下而没有某物；“失去一切庇护”符合现代汉语表达。
- source_word: δοκοῦντες εἶναι
  choice: 似乎已
  rationale: 保留这只是旁观者所见或所判断的情形，并不把缺乏庇护断言为绝对事实。
- source_word: τοῖς ἔθνεσιν
  choice: 在各族人看来
  rationale: 此处与 δοκοῦντες 搭配，间接宾格表示观察或判断的角度；ἔθνη 泛指周围各族，而不必赋予后期固定的神学含义。
- source_word: ἀνάγκην
  choice: 强制处境
  rationale: ἀνάγκη 可指必要、强迫、约束或困境；结合锁链和四面围困的语境，“强制处境”体现外在压迫，同时不把它弱化为普通困难。
- source_word: πάντοθεν περιέχουσαν αὐτοὺς μετὰ δεσμῶν
  choice: 那带着锁链、从四面困住他们的
  rationale: 保留 πάντοθεν 的四面性、περιέχω 的包围约束意象以及 δεσμοί 的实体锁链画面。
- source_word: δεσμῶν
  choice: 锁链
  rationale: 本词可指捆绑、镣铐或锁链；“锁链”直接清楚地呈现囚禁意象。
