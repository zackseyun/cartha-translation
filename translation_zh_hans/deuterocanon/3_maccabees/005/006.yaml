  source_fidelity: “在各族人看来，似乎”准确保留了 δοκοῦντες εἶναι 与 τοῖς ἔθνεσιν 所表达的、从外部观察者角度作出的判断；“锁链”“从四面困住”也传达了 δεσμῶν、πάντοθεν 与 περιέχουσαν 的意象。不过，“似乎已失去”无必要地加入完成意味；“强制处境”虽试图表达 ἀνάγκη 的压迫性，却不够自然，且“那带着锁链”未清楚表达锁链是围困的手段。
