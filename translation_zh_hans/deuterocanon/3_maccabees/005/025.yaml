  yaml_path: translation/deuterocanon/3_maccabees/005/025.yaml
  text: But the Jews[a], as the indivisible time drew them together in soul, stretched out their hands to heaven and, with mournful songs, offered a tearful plea, begging the greatest God to help them again without delay.
translation:
  language: zh_hans
  text: 但犹太人在那段未曾间断的时间里心灵彼此相通[a]，向天伸出双手，以哀恸的曲调作含泪的恳求，祈求至大的上帝快快再次帮助他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希腊文结构罕见而紧凑，也可译作：“在那段不可分割的时间里，他们在心灵上联合为一。”其中既包含时间连续不断的意思，也包含群体内在合一的意思；两者的具体关系在原文中略有含混。
    reason: 说明 ἀμερῆ 与 ψυχοκοινούμενοι 的组合及其句法关系。
lexical_decisions:
- source_word: ἀμερῆ
  choice: 未曾间断的
  rationale: 该词直指“未被分割的”，在修饰 χρόνον（时间）时表示一段连续、没有中断的时间；此译既保留原文的不寻常表达，也符合现代汉语。
- source_word: ψυχοκοινούμενοι
  choice: 心灵彼此相通
  rationale: 这一罕见复合词表达众人在魂或内在生命层面成为共同一体。“心灵彼此相通”保留内在共同性的意象，又避免生硬直译。
- source_word: πολυδάκρυν ἱκετίαν
  choice: 含泪恳求
  rationale: 原短语指伴随许多泪水的恳求；“含泪恳求”以自然简洁的汉语传达其强烈哀痛。
- source_word: ἐν μέλεσιν γοεροῖς
  choice: 伴着哀恸的曲调
  rationale: μέλη 可指歌、曲调或吟唱的声调，γοερός 表示哀哭、悲恸；该译保留祷告带有哀歌般声调的意味，而不强行断定其为正式歌曲。
- source_word: τείνοντες τὰς χεῖρας εἰς τὸν οὐρανόν
  choice: 向天伸出双手
  rationale: 直接呈现原文所描写的祷告姿势和向上的方向。
- source_word: τοῦ μεγίστου θεοῦ
  choice: 至大的上帝
  rationale: μέγιστος 是“最大、至大”的最高级；“至大的上帝”保留原文描述性称谓，不改译为希腊文此处未直接使用的“至高者”。
- source_word: πάλιν
  choice: 再次
  rationale: 表示他们求上帝重新施以帮助，也暗示此前曾蒙帮助。
- source_word: συντόμως
  choice: 立即
  rationale: 在此祈求语境中表示迅速、毫不迟延地行动；“立即”清楚传达迫切感。
theological_decisions:
- issue: τοῦ μεγίστου θεοῦ 的称谓
  choice: 至大的上帝
  alternative: 至高的上帝；至尊的上帝
  rationale: 原文采用 μέγιστος（至大、最大）的最高级描述，而非通常表示“至高”的 ὕψιστος；因此保留“至大”，避免以熟悉的神学称号取代原词。
- issue: ψυχοκοινούμενοι 所表达的群体合一
  choice: 心灵彼此相通
  alternative: 同心合意；共享一个灵魂
  rationale: 原词含有 ψυχή（魂、生命、心灵）的明确意象。“同心合意”虽流畅，却会削弱该意象；“共享一个灵魂”则过于字面，并可能把修辞性群体合一误读为本体论陈述。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“伴着哀恸的曲调”保留 μέλη 的歌唱或曲调色彩；整体句式适度拆分，以免希腊文长句在中文中显得纠缠。脚注标记已在正文中以 [a] 标出。
