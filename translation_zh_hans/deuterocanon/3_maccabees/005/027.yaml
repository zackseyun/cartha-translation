  yaml_path: translation/deuterocanon/3_maccabees/005/027.yaml
  text: But when he had accepted it and was struck with astonishment at the lawless outcome[a], being in every way overcome by ignorance[b], he kept asking whether what had been decreed had indeed been carried out for him with urgency.
translation:
  language: zh_hans
  text: 他接到消息后，因这不法的结果[a]而大为震惊；他因全然不知情而不知所措，便一再追问：为他所定的事[b]，是否已经火速办妥了？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结果”也可译作“离去”或“出去”；希腊词ἔξοδος可有这些含义，此处所指并不完全明确。
    reason: lexical_alternative
  - marker: b
    text: “所定的事”也可译作“所写下的事”或“所颁布的命令”。“为他”也可能按完成时被动结构理解为“由他”。
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: ἀποδεξαμένου
  choice: 接到消息后
  rationale: 该词为ἀποδέχομαι的不定过去时中动分词，可指领受、接纳。原文宾语省略；结合叙事情境，以“接到消息”自然表达其领受所闻之事，但不赋予“正式批准”的含义。
- source_word: καταπλαγέντος
  choice: 大为震惊
  rationale: 保留该被动分词所表达的强烈惊愕，同时采用现代汉语自然说法。
- source_word: ἀνόμῳ ἐξόδῳ
  choice: 这不法的结果
  rationale: ἄνομος意为不法、违法；ἔξοδος本可指出去、离去、结局或结果。此处“结果”较符合上下文，但以脚注保留“离去/出走”的词义可能。
- source_word: κατὰ πάντα ἀγνωσίᾳ κεκρατημένος
  choice: 他完全被无知所困
  rationale: κρατέω的完成时被动分词表达受辖制、被控制；κατὰ πάντα加强程度。译文保留他因不知情而陷于困惑的状态，不将其弱化为单纯“不了解”。
- source_word: ἐπυνθάνετο
  choice: 便一再追问
  rationale: 未完成过去时可表示持续或反复询问；“一再追问”体现这一体貌。
- source_word: τὸ διαγραμμένον
  choice: 所定的事
  rationale: διαγράφω的完成时被动分词可指写下、规定或颁布之事。正文用较宽泛的“所定的事”保留含义范围，脚注说明可具体理解为书面命令。
- source_word: ἔτι
  choice: 已经
  rationale: 在询问完成与否的语境中，以“是否已经”表达尚待确认的完成状态；该词也可理解为“仍然/还”。
- source_word: μετὰ σπουδῆς
  choice: 火速
  rationale: σπουδή兼有急切、迅速和认真办理之意；在执行命令的行政语境中，“火速”简洁而有力度。
- source_word: τετέλεσται
  choice: 办妥了
  rationale: τελέω的完成时被动形式表示已经完成或执行完毕；“办妥”既自然，也避免“处决”一类歧义。
- source_word: αὐτῷ
  choice: 为他
  rationale: 按与格的受益或关联用法译为“为他”；也可能与完成时被动结构相连，表示“由他”，故在脚注中保留此语法歧义。
