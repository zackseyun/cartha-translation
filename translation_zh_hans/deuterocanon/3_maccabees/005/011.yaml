base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/011.yaml
  text: But the age-old ordinance of time[a], beautifully alternating in night and day by the One who grants sleep to all, to whomever he himself wills, sent a portion of sleep upon the king[b];
translation:
  language: zh_hans
  text: 但那自古以来的时间受造秩序，在那位按自己所愿赐睡眠给众者的安排下，借着黑夜和白昼美好地交替临到，向君王送去了一分睡眠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“把一分睡眠送到君王那里（或送入君王）。”希腊文以“时间的受造物／受造秩序”为主语，作拟人化表述。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... ἀπʼ αἰῶνος κτίσμα χρόνου
  choice: 那自古以来所造的时间秩序
  rationale: κτίσμα本指受造之物或所造之事；与χρόνου连用，并由黑夜和白昼加以描写，在此是诗意地指受造且久已确立的时间秩序。译文保留“所造”的意象，同时用“秩序”使现代汉语自然可懂。ἀπʼ αἰῶνος译作“自古以来”，避免将其强化为形而上的“自永恒”。
- source_word: καλὸν ἐν νυκτὶ καὶ ἡμέρᾳ ἐπιβαλλόμενον
  choice: 在黑夜与白昼中美好地交替运行
  rationale: καλόν保留“美好”的诗性色彩；ἐπιβαλλόμενον在此描绘昼夜相继而至，以“交替运行”表达其循环推进，同时不把它改写成抽象的自然定律。
- source_word: ὑπὸ τοῦ χαριζομένου πᾶσιν
  choice: 那位……赐睡眠给众人的主
  rationale: χαρίζομαι有恩赐、赐予之意；睡眠由后文语境补出。原文以分词含蓄指向上帝，汉语用“那位……的主”使所指清楚，但不添加具体神学称号。
- source_word: οἷς ἂν αὐτὸς θελήσῃ
  choice: 随己意
  rationale: 表达赐予者自主的意愿，并以“己”保留αὐτός的强调意味；汉语中避免重复累赘。
- source_word: ὕπνον μέρος
  choice: 一分睡眠
  rationale: μέρος直译为一部分、一分；“一分睡眠”既保留原文具体而略显奇特的表达，也符合庄重汉语。
- source_word: ἀπέστειλεν εἰς τὸν βασιλέα
  choice: 使君王得了
  rationale: 字面为“把……送到／进入君王”；汉语若说“将睡眠送入君王”过于生硬，故按语义译为“使君王得了”，另以脚注保存字面形式。
theological_decisions:
- issue: τοῦ χαριζομένου πᾶσιν所含的上帝指涉
  choice: 那位随己意赐睡眠给众人的主
  alternative: 那位随己意赐给众人的
  rationale: 上下文表明施予者是上帝，所赐的是睡眠。译文适度明示隐含信息以保证汉语通顺，却不引入原文没有的具体称号或教义表述。
- issue: ἀπʼ αἰῶνος的时间力度
  choice: 自古以来
  alternative: 从永恒中／永恒的
  rationale: 该短语在此强调久远和历来如此；译作“自古以来”可避免把它解释为关于时间秩序绝对永恒性的教义断言。
- issue: 时间秩序与上帝赐睡眠之间的施事关系
  choice: 以分号区分时间秩序的描写与上帝使君王入睡的行动
  alternative: 让“时间秩序”在语法上直接作“使君王得睡眠”的主语
  rationale: 希腊句法诗意浓缩，表面主语为κτίσμα，但ὑπὸ τοῦ χαριζομένου又指出最终施予者。译文保存两层关系，不把自然秩序与神圣行动完全等同，也不割裂二者。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文关于“时间受造秩序”和“一分睡眠”的诗性表达；为避免希腊长句在汉语中造成错误修饰，以分号梳理结构。所有脚注标记均已置于正文。
