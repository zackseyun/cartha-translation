  yaml_path: translation/deuterocanon/3_maccabees/005/017.yaml
  text: And when this had happened, he urged them, having given themselves over to feasting, to devote the present occasion of the banquet, long honored, to gladness.
translation:
  language: zh_hans
  text: 这事发生以后，他劝他们既已投身宴乐，又蒙受格外礼遇，就把眼前宴饮的一部分用于欢乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把眼前宴饮的一部分用于欢乐”直译可作“划出／指定一部分归于欢乐”。原文的“部分”具体指宴饮的哪一方面并未明说；译文不把它限定为一段时间。
    reason: 原文καταθέσθαι μέρος的表达较为压缩；保留μέρος所指未完全明确的特点。
lexical_decisions:
- source_word: ὃ δὲ καὶ γενομένου
  choice: 这事发生以后
  rationale: 按完成性背景分词结构表达先后次序；“这事”保留原文所指的概括性，不额外限定具体事件。
- source_word: παρῄνει
  choice: 他劝他们
  rationale: παραινέω表示劝告、敦促；“劝”自然庄重，又不带讲道式色彩。
- source_word: εἰς εὐωχίαν δόντας ἑαυτούς
  choice: 既已投身宴乐
  rationale: 保留“把自己交付于”的投入意味；“宴乐”兼顾饮宴与欢庆，不擅自加入纵欲或放荡的贬义。
- source_word: τὸ παρὸν τῆς συμποσίας
  choice: 眼前的宴饮
  rationale: τὸ παρόν指当前、眼前的时刻或场合；συμποσία是共同饮宴，“宴饮”比“酒会”更符合古代宫廷语境。
- source_word: ἐπὶ πολὺ γεραιρομένους
  choice: 尽情庆贺
  rationale: γεραιρομένους为阳性复数，语法上描述受劝的人，而非修饰中性的τὸ παρόν；ἐπὶ πολύ可表示达到很大程度，因此译作“尽情”，避免沿用英语层将其误作“长久受尊崇”的宴会。
- source_word: εἰς εὐφροσύνην καταθέσθαι μέρος
  choice: 留出一段时光来欢乐
  rationale: 直译意象为“划出／指定一部分用于欢乐”。结合宴饮的当前时段，用“一段时光”补足汉语表达，同时由脚注保留原文未明说所分之物的压缩性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“宴乐”“宴饮”保持宫廷筵席语境；避免把εὐωχίαν渲染成带道德评判的“狂欢”。按希腊语性数配合处理γεραιρομένους，使其描述参加宴饮的人，而不误修饰宴会场合。
