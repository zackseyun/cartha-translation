  source_fidelity: 原译准确传达了“夜间并不主要用于睡眠，而用于蓄意安排嘲弄”的比较结构，也保留了δοκοῦσιν所标示的观察者视角。不过，“千方百计地谋划各种……戏弄”将παντοίως与“各种”双重铺陈，且“千方百计”较偏向不惜一切达成某一目的；改为“谋划以各种方式戏弄”更清楚地反映其修饰范围。
  naturalness: “他们把夜里的时间与其说用来睡觉，不如说……”语序虽可理解，但略显滞重。调整为“他们与其说把夜里的时间用来睡觉，不如说……”更合现代标准汉语。
  terminology: “戏弄”适合ἐμπαιγμούς，可涵盖嘲弄和侮辱性的愚弄；“看来可怜的人”保留ταλαιπώροις与δοκοῦσιν的评价性及视角性，避免把施害者的看法客观化。脚注以“可悲而受苦的人”为替代译法，较“可怜虫”更符合本段庄重叙述语体，亦避免在正文之外不必要地增强现代汉语辱骂色彩。
