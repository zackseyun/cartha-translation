  yaml_path: translation/deuterocanon/3_maccabees/005/022.yaml
  text: And they did not spend the time of the night so much in sleep as in devising every kind of mockery for those who seemed miserable[a].
translation:
  language: zh_hans
  text: 他们与其说把夜里的时间用来睡觉，不如说用来谋划以各种方式戏弄那些看来可怜的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些可悲而受苦的人。”这里指受害者在施害者眼中显得可怜、困苦，并成为受嘲弄的对象。
    reason: 词义与语气上的另一种译法；说明ταλαιπώροις的困苦、可悲之义，以及δοκοῦσιν所保留的观察者视角。
lexical_decisions:
- source_word: κατεχρίζαντο
  choice: 把……时间用来
  rationale: 此处与“夜里的时间”和“睡觉”连用，表示如何耗用或安排夜间时光；这一译法自然，也不额外加入“浪费”的贬义。
- source_word: οὐχ οὕτως ... ὡς
  choice: 与其说……不如说……
  rationale: 保留希腊文两项活动之间的比较和侧重关系，符合现代汉语表达。
- source_word: εἰς ὕπνον
  choice: 用来睡觉
  rationale: 表达夜间时间被用于睡眠，顺应汉语中“把时间用来……”的结构。
- source_word: παντοίως
  choice: 千方百计地
  rationale: 该副词表示用尽各种办法，直接修饰“谋划”，既保留其广泛、刻意的意味，也避免只把它限定为“各种戏弄”。
- source_word: μηχανᾶσθαι
  choice: 谋划
  rationale: 表示刻意构想、设计；“谋划”体现蓄意性，又不过度强化为政治性或阴谋性的“密谋”。
- source_word: τοῖς ταλαιπώροις
  choice: 针对那些看来可怜之人
  rationale: 与“戏弄”结合时，汉语需要明确敌对指向；“可怜之人”保留其困苦、可悲而又被轻蔑看待的意味。
- source_word: δοκοῦσιν
  choice: 看来
  rationale: 保留“在观察者眼中显得如此”的视角意味，而不把这种评价写成完全客观的事实。
- source_word: ἐμπαιγμούς
  choice: 各种……戏弄
  rationale: 该词可指嘲弄、愚弄或带表演性的侮辱；“戏弄”覆盖面较广，并与“谋划”自然搭配。
