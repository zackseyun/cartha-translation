  yaml_path: translation/deuterocanon/3_maccabees/005/023.yaml
  text: But just then[a], when the rooster had crowed at dawn, Hermon, having armed the beasts, was driving them on in the great colonnade.
translation:
  language: zh_hans
  text: 正在这时，正值黎明，公鸡已经啼叫；赫尔蒙将野兽装备妥当，正在宽大的柱廊庭院[a]里驱赶它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宽大的柱廊”或“宽大的回廊庭院”。希腊语 περιστύλιον 指带有柱廊的建筑空间。
    reason: 词义存在建筑类型上的合理译法差异。
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: 正在这时
  rationale: ἄρτι表示时间上的紧迫与即时性，δὲ在此作轻微转折或叙事推进；“正在这时”自然传达场景突转。
- source_word: ἀλεκτρυὼν ἐκέκραγεν ὄρθρος
  choice: 黎明鸡已啼叫
  rationale: ἀλεκτρυών指公鸡，ἐκέκραγεν表示已经啼叫，ὄρθρος点明黎明时分。此译保留“鸡啼”与“黎明”的紧密关系，也用“已”体现相对于随后动作的先行性。
- source_word: τὰ θηρία
  choice: 野兽
  rationale: θηρία在本段处刑场景中指具有危险性的兽类；“野兽”比泛称“动物”更符合语境，同时不擅自限定具体种类。
- source_word: καθωπλικὼς
  choice: 装备妥当
  rationale: 该分词源自καθοπλίζω，意为武装或充分装备。用于野兽时，直译“武装”在现代汉语中较生硬；“装备妥当”保留其被配备、预备就绪的含义，而不猜测具体装备。
- source_word: διεκίνει
  choice: 正在……驱赶它们
  rationale: διακινέω可表示使之移动、来回调动或驱动。语境中赫尔蒙在操控野兽，“驱赶”自然体现主动使其行动，同时未明确加入攻击目标。
- source_word: ἐν τῷ μεγάλῳ περιστυλίῳ
  choice: 在宽大的柱廊庭院里
  rationale: περιστύλιον指有柱廊环绕的建筑空间，可指柱廊或柱廊庭院。“柱廊庭院”既便于现代读者理解，也保留其建筑特征；μέγας在空间语境中译作“宽大的”。
- source_word: ὁ Ἕρμων
  choice: 赫尔蒙
  rationale: 按希腊语人名Ἕρμων音译，并采用自然的现代汉语形式。
