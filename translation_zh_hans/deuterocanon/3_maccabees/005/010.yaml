  yaml_path: translation/deuterocanon/3_maccabees/005/010.yaml
  text: But Hermon[a], after giving the savage elephants drink, with them filled from the abundant supply of wine and saturated with frankincense[b], came early in the morning to the court to report these things to the king.
translation:
  language: zh_hans
  text: 赫尔蒙让那些凶残的大象喝下大量供应的酒，又使它们饱受乳香[a]；清早，他便来到王宫，向王禀报这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乳香”指一种特定的芳香树脂，并非泛指各种香。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηλεῖς
  choice: 凶残的
  rationale: 该词强调毫无怜悯的凶猛；用于大象时，“凶残”自然传达其危险和残暴，不把抽象的“无怜悯”强加于汉语表达。
- source_word: ποτίσας
  choice: 让……喝足
  rationale: 不定过去主动分词表示赫尔蒙先使大象饮用；结合后文酒量充足的结果，“让……喝足”既自然又保留使役意味。
- source_word: πεπληρωμένους τῆς τοῦ οἴνου πολλῆς χορηγίας
  choice: 使它们灌满了大量供应的酒
  rationale: 明确完成时分词修饰大象而非赫尔蒙；“大量供应的酒”兼顾 πολλῆς 的数量和 χορηγίας 的供给含义。
- source_word: τοῦ λιβάνου μεμεστωμένους
  choice: 又饱受乳香熏染
  rationale: λίβανος特指乳香；μεμεστωμένους表示充满、饱和。按场景用“饱受……熏染”传达浓重充盈之感，同时避免误解为大象吞食乳香。
- source_word: ὄρθριος
  choice: 清早
  rationale: 表示一早、清晨时分；“清早”简洁自然，不把时间过度限定为破晓一刻。
- source_word: αὐλήν
  choice: 王宫
  rationale: 在君王语境中可指宫廷或王宫范围；此处“来到王宫”比现代汉语容易误解为司法机关的“宫廷/法庭”更清楚，也不狭义限定为院落。
- source_word: προσαγγεῖλαι
  choice: 禀报
  rationale: 目的不定式表示前来向王报告；“禀报”符合臣属向君王正式呈报的语境，并保持庄重而易懂。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。通过“使它们”明确两个完成时分词都修饰大象，消除汉语中的指代歧义；分号呈现饮象与入宫禀报之间的时序转折。
