  naturalness: “使它们灌满了……酒”不合现代汉语习惯。“让……喝下大量供应的酒，又使它们饱受乳香”更通顺，并仍保留原文对乳香施用方式未作说明的余地。
  terminology: “赫尔蒙”“凶残的大象”“乳香”“清早”“王宫”“禀报”均可接受。“乳香”应保留脚注，说明其为特定芳香树脂而非泛称的香。
