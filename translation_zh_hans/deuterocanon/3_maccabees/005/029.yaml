  yaml_path: translation/deuterocanon/3_maccabees/005/029.yaml
  text: 'Hermon was showing them the beasts and all the forces: “They are prepared[a], O king[c][b], according to that intention of yours.”'
translation:
  language: zh_hans
  text: 赫尔蒙和所有亲信[a]正在向王展示那些猛兽和兵力，说：“王啊，一切都已照着你当初的那个意向[b]准备妥当。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲信”直译为“朋友”；在希腊化时期的宫廷语境中，也可能指王室近臣或廷臣。
    reason: cultural_note
  - marker: b
    text: “意向”也可译作“计划”或“打算”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδείκνυεν
  choice: 正在向王展示
  rationale: 未完成过去时表示当时正在进行的动作；“展示”自然涵盖指给人看、陈列说明的语义。希腊文未明说间接宾语，但场景和随后的呼语表明对象是王，中文补出“向王”使句意顺畅。
- source_word: ὁ Ἕρμων καὶ πάντες οἱ φίλοι
  choice: 赫尔蒙和所有亲信
  rationale: 尽管动词为单数，后置的并列主语包含赫尔蒙和所有“朋友”；按希腊语就近一致现象，将二者都保留为主语。“亲信”表达希腊化宫廷中 οἱ φίλοι 可能具有的王室随从或近臣含义，并以脚注保留其字面义。
- source_word: τὰ θηρία
  choice: 那些猛兽
  rationale: 上下文所指是用于行刑的危险动物；“猛兽”保留其威胁色彩，比泛称“动物”更贴切。
- source_word: τὰς δυνάμεις
  choice: 兵力
  rationale: δύναμις 复数在此可指军队、部队或军事力量；“兵力”既符合场景，也不限定具体编制。
- source_word: Ἡτοίμασται
  choice: 都已准备妥当
  rationale: 完成时中被动表达准备工作已经完成并形成当前状态；“已准备妥当”兼顾结果与现状，“都”对应前述猛兽和兵力。
- source_word: βασιλεῦ
  choice: 王啊
  rationale: 保留呼格的直接称呼及庄重语气，不扩译为带有特定礼制色彩的“陛下”。
- source_word: κατὰ τὴν σὴν ἐκείνην πρόθεσιν
  choice: 正照着你当初的那个意向
  rationale: κατά 表示依照，ἐκείνην 带有回指先前想法的意味；“意向”保留 πρόθεσις 可指意图、打算或计划的宽度。
