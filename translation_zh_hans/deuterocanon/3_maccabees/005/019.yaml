lexical_decisions:
- source_word: ὑποδείξαντος
  choice: 指出
  rationale: 该分词表示使人知道或加以说明；“指出”保留其指明、陈述的语气，又不把它强化为正式宣告。
- source_word: νυκτός
  choice: 在夜间
  rationale: 这是表示时间的属格；“在夜间”符合现代汉语习惯，也准确表达事情发生于夜间。
- source_word: τὸ προσταγέν
  choice: 命令
  rationale: 这个由 προστάσσω 构成的冠词化分词指所吩咐、所命令的事；结合行政命令的语境，简洁译作“命令”。
- source_word: ἐπὶ τέλος
  choice: 完毕
  rationale: 该短语表达达到终点、彻底完成；与“执行”搭配为“执行完毕”，自然地保留完成之意，不增添“成功”等评价。
- source_word: ἠγοχέναι
  choice: 已经执行
  rationale: Swete 所录词形在文本和形态上均有困难，但与 ἐπὶ τέλος 连用时，整句显然是在说明所命令的事已经付诸实行并完成；“已经执行完毕”符合该行政行动语境。
- source_word: προσμαρτυρησάντων
  choice: 也为此作证
  rationale: 复合动词含有在他人陈述之外加以作证、佐证之意；“也为此作证”既保留见证语义，也表达附加印证的作用。
- source_word: φίλων
  choice: 朋友
  rationale: 采用该词的通常意义“朋友”；虽然宫廷语境中也可能指亲信或臣属，本句本身不足以要求收窄其含义。
