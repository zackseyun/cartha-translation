  yaml_path: translation/deuterocanon/3_maccabees/005/051.yaml
  text: They cried out very loudly[a], imploring the Sovereign of all to have mercy and visibly come to their aid, since they already stood at the gates of Hades.
translation:
  language: zh_hans
  text: 他们放声高呼，恳求那统管万有的主怜悯他们，显现出来施以援手[a]，因为他们已经站在阴间的门口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以显现怜悯他们。”希腊语可指借着显现施行怜悯，也可强调他们所求的怜悯要公开、明显地彰显出来；“施以援手”是按上下文表达所求的救助。
    reason: 保留μετὰ ἐπιφανείας在“显现”与“明显施行”之间的语义幅度，并说明正文的语境性表达。
lexical_decisions:
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ σφόδρα
  choice: 他们放声高呼
  rationale: 动词及其强烈的方式状语共同表达群体极其响亮而迫切的呼喊；“放声高呼”在现代汉语中自然凝练，也保留力度。
- source_word: τὸν τῆς ἁπάσης δυνάστην
  choice: 那统管万有的主
  rationale: δυνάστης指掌权者；“统管万有的主”传达其普遍而至高的权柄，同时保持祷告语境所需的庄重。
- source_word: ἱκετεύοντες
  choice: 恳求
  rationale: 表达迫切、谦卑的祈求，符合危急处境中的集体呼求。
- source_word: οἰκτείραι αὐτούς
  choice: 怜悯他们
  rationale: 直接保留原文以αὐτούς为宾语的结构；“怜悯”兼具同情与采取行动的祷告含义。
- source_word: μετὰ ἐπιφανείας
  choice: 显现出来施以援手
  rationale: 该短语直义为“伴随着显现”；在此祈求神介入的语境中，译文既保留可见显现的概念，也自然表达所求的救援，但以脚注注明较直译的可能。
- source_word: ἤδη πρὸς πύλας ᾅδου καθεστῶτας
  choice: 已经站在阴间的门口
  rationale: 保留“阴间之门”的空间意象及迫近死亡的张力；“站在……门口”自然对应其所处状态。
theological_decisions:
- issue: ᾅδης在犹太—希腊次经语境中的译法
  choice: 阴间
  alternative: 坟墓／死人之境／死亡
  rationale: 原文明确使用ᾅδης。“阴间”在中文圣经语体中可指死人之境，并能保留原文的场所意象，而不把它具体化为后世关于最终刑罚之地的教义。
- issue: μετὰ ἐπιφανείας是否明确指可见的神圣介入
  choice: 正文译为“显现出来施以援手”，并以脚注保留较直译理解
  alternative: 带着显现怜悯他们／公开地怜悯他们
  rationale: ἐπιφάνεια可表示显现或公开呈现；上下文所求显然不止内在同情，而是可察见的救助，但原文没有独立出现“援手”一词，因此用脚注保留形式和语义上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“放声高呼”避免生硬复刻“以极大的声音”；“统管万有的主”保持敬虔语域但不引入特定宗派称谓；“阴间的门口”保留原文鲜明意象。
