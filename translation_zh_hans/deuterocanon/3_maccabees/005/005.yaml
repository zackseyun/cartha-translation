base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/005.yaml
  text: And in addition[a], the attendants, going out at evening, bound the hands of those who were suffering, and contrived the rest of the nighttime security concerning them[b], thinking that they would together bring the race to the end of destruction.
translation:
  language: zh_hans
  text: 此外，那些执行任务的人在傍晚出去，把受苦之人的手捆住，又为他们筹划其余的夜间戒备措施；他们以为，这族群[a]会一同达到毁灭的终局[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这族群”也可译作“这民族”或“这族人”，指犹太人整体。
    reason: lexical_alternative
  - marker: b
    text: “毁灭的终局”直译近于“毁灭的尽头”；也可按语义译为“彻底毁灭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε πρὸς τούτοις λειτουργοὶ
  choice: 此外，负责此事的侍从们
  rationale: λειτουργοί在此指奉命执行任务的人员，并非礼仪职分，故译作“侍从”；πρὸς τούτοις在压缩的希腊语句法中表明他们与此事相关，并带有“此外、又”的承接意味。
- source_word: κατὰ τὴν ἑσπέραν ἐξιόντες
  choice: 在傍晚出去
  rationale: 直接保留时间与动作关系，现代汉语自然明白。
- source_word: τὰς τῶν ταλαιπωρουμένων ... χεῖρας
  choice: 那些受苦之人的手
  rationale: ταλαιπωρουμένων强调身陷苦难、困苦的处境；“受苦之人”简洁而不弱化其遭遇。
- source_word: ἐδέσμευον
  choice: 捆住
  rationale: 准确表达将手绑缚起来的具体动作，比泛称“拘禁”更贴近原文。
- source_word: τὴν τε λοιπὴν ἐμηχανῶντο περὶ αὐτοὺς ἀσφάλειαν ἔννυχον
  choice: 又设法安排其余的夜间防范措施，看守他们
  rationale: 原文结构紧缩，表达针对这些人筹划进一步的夜间安全或警戒措施；“设法安排”保留ἐμηχανῶντο的刻意筹措意味，“看守他们”自然呈现περὶ αὐτούς的指向。
- source_word: δοξαντες
  choice: 他们以为
  rationale: 表示执行者的判断或预期，不把这种预期叙述为既成事实。
- source_word: ὁμοῦ
  choice: 一同
  rationale: 保留群体同时遭遇同一结局的意味；原文也可能带有“一举”的语感。
- source_word: τὸ φύλον
  choice: 全族人
  rationale: 此处指作为一个整体而受针对的犹太族群。“全族人”兼顾集体性和现代汉语可读性，避免现代汉语“种族”一词可能引出的额外概念。
- source_word: λήμψεσθαι ... πέρας τῆς ὀλεθρίας
  choice: 会……走到毁灭的终局
  rationale: λήμψεσθαι与πέρας构成不易直译的表达，指达到、遭逢某一结局；译文保留πέρας“终点、终局”与“毁灭”之间不寻常的原文搭配，而不直接化约为“被彻底消灭”。
theological_decisions:
- issue: τὸ φύλον所指的集体身份
  choice: 全族人
  alternative: 族群；民族；种族
  rationale: 上下文针对犹太人整体，译作“全族人”能体现集体和族属意义，同时不引入现代种族理论或把它缩窄为某一支派。
- issue: πέρας τῆς ὀλεθρίας的毁灭意象
  choice: 毁灭的终局
  alternative: 彻底毁灭；灭亡的尽头
  rationale: 原文以“终点/终局”搭配“毁灭”，语义强烈却略显压缩。正文保留这种张力，脚注说明可采取更顺畅的结果性理解，不把原文预先解释成特定形式的刑罚或审判。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。叙事动作清楚直接；“防范措施”表达原文的夜间警戒安排，“毁灭的终局”则有意保留末句压缩而强烈的措辞。所有脚注标记均置于对应词语之后。
