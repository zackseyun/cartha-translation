    rationale: 原文说上帝将“遗忘”置入那些先前图谋者的心思中；没有说王忘记自己的计划，也没有出现“目的”或“所谋划的事”作为 λήθη 的明示对象。
  - severity: medium
    issue: 现有脚注对 τῶν 的中性分析及全句可能含义作出误导性说明
    rationale: 脚注重复并强化了不可靠的“事情”读法，且“使人忘记这些谋害者”不符合 λήθην 由 ἐντεθεικότος 置入图谋者心思中的结构。应改为仅说明 αὐτῷ 的单数及其语境指称。
