  yaml_path: translation/deuterocanon/3_maccabees/005/028.yaml
  text: But this was the working of God[a], who rules over all, having implanted in the minds of those who had previously plotted against them a forgetfulness of their purpose.
translation:
  language: zh_hans
  text: 然而，这乃是统管万有的上帝所施行的作为：他把遗忘放在那些先前图谋加害他的人的心思中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的”所译希腊文为单数 αὐτῷ，意为“加害他”。其具体所指须由上下文确定；在叙事语境中，也可指作为整体的犹太人，因而有译本译作“他们”。原文并未明说遗忘的具体内容。
    reason: 保留 αὐτῷ 的单数形式及其语境指称空间，并说明 λήθην 未带明示的遗忘对象。
lexical_decisions:
- source_word: ἐνέργεια
  choice: 所施的作为
  rationale: 表示上帝实际发挥作用、产生果效的行动；“所施的作为”既保留主动施行之意，也符合庄重而自然的现代汉语。
- source_word: τοῦ πάντα δεσποτεύοντος θεοῦ
  choice: 统管万有的上帝
  rationale: δεσποτεύω 表示掌权、作主；“统管万有”清楚表达上帝对一切的主权，又避免现代汉语中“专制者”等误导性联想。
- source_word: λήθην κατὰ διάνοιαν ἐντεθεικότος
  choice: 他使王心里忘记了
  rationale: 原文形象地说上帝把“遗忘”放入心思中。“使……心里忘记”保留上帝的直接行动，同时采用自然汉语表达。上下文表明经历遗忘的是王。
- source_word: τῶν πρὶν αὐτῷ μεμηχανημένων
  choice: 王先前所谋划的事
  rationale: 将 τῶν 理解为中性复数“那些事”，并把 αὐτῷ 视为与完成时被动/中动分词连用、指出谋划者的与格，即“由他所谋划的事”。这与本段中王忘记自己先前命令的叙事最吻合；由于句法也容许另一种分析，另加脚注说明。
theological_decisions:
- issue: 上帝是否直接导致王的遗忘
  choice: 译作“他使王心里忘记了”，保留上帝直接施行的因果关系
  alternative: 上帝只是容许王遗忘，或间接造成混乱
  rationale: ἐνέργεια 与 ἐντεθεικότος 明确把这件事归于上帝的作为，并以“放入”心思的形象表达直接行动；译文不将此弱化为单纯许可。
- issue: τῶν πρὶν αὐτῷ μεμηχανημένων 的句法所指
  choice: 理解为王先前所谋划的事情
  alternative: 理解为先前谋害他的人，或先前图谋反对他们的人
  rationale: 冠词 τῶν 可作中性复数，λήθην 后接所遗忘之事十分自然；αὐτῷ 可标示完成时分词的行动者。此读法也最贴合上下文中王忘记自己原先计划的情节，但脚注保留另一种真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“统管万有”保留经文的崇高语气；“使王心里忘记”将希腊语的内在置入意象自然化，同时没有削弱上帝主动施行的意味。以“王”明示上下文指称，避免连续代词造成歧义。
