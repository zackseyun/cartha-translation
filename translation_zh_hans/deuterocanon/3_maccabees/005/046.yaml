  yaml_path: translation/deuterocanon/3_maccabees/005/046.yaml
  text: Around dawn[a], when the city was already filled with innumerable crowds at the hippodrome, he entered the court and urged the king on concerning the matter at hand.
translation:
  language: zh_hans
  text: 黎明前后，城里已有数不清的人群挤满了赛马场一带；他走进宫院[a]，就眼前的事催促国王采取行动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王宫内院”或“庭院”；希腊语αὐλή可指王宫建筑群中的院落区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τὴν ἕω
  choice: 黎明前后
  rationale: περί在时间表达中表示约略时间；“黎明前后”自然保留了临近破晓而非精确时刻的含义。
- source_word: πλήθεσιν ἀναριθμήτοις
  choice: 数不清的人群
  rationale: πλήθη表示成群的大批民众，ἀναρίθμητοι强调多得无法计数；此译保留夸张力度，又符合现代汉语。
- source_word: κατὰ τοῦ ἱπποδρόμου καταμεστωμένης
  choice: 挤满了赛马场一带
  rationale: καταμεστόω表示充塞、挤满；κατά加属格在此具有空间分布意味。“赛马场一带”既传达相关区域，也避免把希腊语过度限定为仅在场内。
- source_word: εἰς τὴν αὐλήν
  choice: 走进宫院
  rationale: αὐλή可指庭院，也可指王宫的院区；上下文涉及面见国王，“宫院”简洁地保留两者之间的语义联系。
- source_word: ἐπὶ τὸ προκείμενον
  choice: 就眼前的事
  rationale: 该表达指当前摆在面前、正待处理的事务；“眼前的事”是自然且不过度具体化的汉语表达。
- source_word: ὤτρυνε
  choice: 催促……采取行动
  rationale: ὀτρύνω表示催促、激励或推动某人行动；补出“采取行动”使汉语完整，并保留其施压推动的力度而不指定行动内容。
