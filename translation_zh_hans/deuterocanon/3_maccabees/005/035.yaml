  naturalness: “统治者之王”虽可理解，但在现代汉语中搭配略显生硬；“掌权者的王”较顺畅，同时保留原文分词“掌权者、统治者”而不直接规范为“万王之王”。以“就是”连接连续的同位称号，也比破折号后的逗号串列更清楚自然。
