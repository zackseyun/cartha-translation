revisions:
- from: 犹太人听见王那里传来的消息后，就赞美那彰显自己的上帝——主、统治者之王[a]，因为他们已经从他得到了这次帮助。
  to: 犹太人听见王那里传来的消息后，就赞美那显现的上帝，就是主、掌权者的王[a]，因为他们已经从他那里得到了这次帮助。
  rationale: 修订仅消除对“显现的”所作的反身性扩展，并改善“掌权者的王”的汉语表达；其余译文保留原稿对消息、时间关系、赞美及已获得帮助的准确处理。
