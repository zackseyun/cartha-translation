base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/035.yaml
  text: And the Jews[a], when they heard what came from the king, were praising the manifest God, the Lord, the King of kings, since they had obtained this help from him.
translation:
  language: zh_hans
  text: 犹太人听见王那里传来的消息后，就赞美那显现的上帝，就是主、掌权者的王[a]，因为他们已经从他那里得到了这次帮助。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万王之王。”希腊文直译为“掌权者的王”，使用的是“掌权者”的分词，而不是“诸王”的名词。
    reason: 说明较惯用的称号译法，同时交代希腊文实际使用分词“掌权者”而非名词“诸王”。
lexical_decisions:
- source_word: τὰ παρὰ τοῦ βασιλέως
  choice: 王那里传来的消息
  rationale: 该中性复数短语泛指来自王的言语或事项；译作“消息”在现代汉语中自然，同时避免将其过度限定为正式诏令。
- source_word: ἀκούσαντες
  choice: 听见……后
  rationale: 以时间性表达处理分词，既保留先听见、后赞美的次序，也符合现代汉语习惯。
- source_word: ἐπιφανῆ
  choice: 彰显自己的
  rationale: 该词在此强调上帝借明显可见的作为显明自己；此译法比单纯“显现的”更自然，又不额外限定其作为的性质。
- source_word: θεὸν Κύριον
  choice: 上帝——主
  rationale: 保留两个并列同位的神圣称谓，并以破折号清楚呈现其称号关系。
- source_word: Βασιλέα τῶν βασιλευόντων
  choice: 统治者之王
  rationale: βασιλευόντων 是“统治、掌权的人”的分词形式，并非名词“诸王”；正文保留这一差异，惯用称号“万王之王”列入脚注。
- source_word: ᾔνουν
  choice: 就赞美
  rationale: 汉语中的“就”自然承接前面的时间分句；“赞美”准确表达动词含义。希腊语未完成时的持续意味在单节叙事中无需用生硬的“正在”强行标出。
- source_word: τῆσδε τῆς βοηθείας
  choice: 这次帮助
  rationale: 直译 βοήθεια 的“帮助”，不加重为“拯救”；“这次”自然指向眼前具体发生的援助。
- source_word: τετευχότες
  choice: 已经……得到了
  rationale: 用“已经”体现完成分词所表达的既成事实及其当前结果。
theological_decisions:
- issue: 神圣称号 κύριος 的译法
  choice: 主
  alternative: 主人；主宰
  rationale: 此处 κύριος 直接用于上帝，并处于一连串尊称之中；“主”是准确、庄重且不带额外解释的标准译法。
- issue: 是否把 Βασιλέα τῶν βασιλευόντων 直接规范化为传统称号
  choice: 正文译作“统治者之王”
  alternative: 万王之王
  rationale: 希腊文使用的是“统治者”的分词，而非“王”的名词。正文保留原文措辞的细微差别，脚注同时给出更惯用的传统表达。
- issue: ἐπιφανῆ 是否表示上帝本体可见或其作为显明
  choice: 彰显自己的
  alternative: 显现的；显赫的
  rationale: 本节语境是上帝施予明显的帮助。此译法不武断断定其显现方式，也保留上帝借行动显明自己的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“王那里传来的消息”保留原文所指可为言语、消息或事项的宽度；以破折号串联“上帝、主、统治者之王”三个同位称谓。脚注标记紧跟其所解释的称号。
