  text: And when it was already nearly the middle of the sixth hour[a], the man appointed over the summonses, seeing those who had been summoned assembled in a mass, came up and signaled to the king.
translation:
  language: zh_hans
  text: 第六时辰已将近过半时[a]，那负责传召的人看见被传召的人聚成一大群，便上前向王示意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“约在第六时辰的中段”。按古代从日出起计算白昼时辰的方式，这大约是正午前后。
    reason: cultural_note
lexical_decisions:
- source_word: μεσούσης δὲ ἤδη ἑκάτης ὥρας σχεδόν
  choice: 到了第六时辰将近过半的时候
  rationale: 保留古代计时方式，并体现 μεσούσης、ἤδη 与 σχεδόν 所表达的“已经接近时辰中段”之意；中文以“到了……的时候”自然衔接叙事。
- source_word: ὁ πρὸς ταῖς κλήσεσιν τεταγμένος
  choice: 那负责传召的人
  rationale: τεταγμένος 表示受指派、负责某项事务；κλήσεις 在此为权威性的召集或传召，不具体化为登记或点名。
- source_word: ἀθρόους
  choice: 成群聚集
  rationale: 表达众人集中成一大群的整体景象，比单说“聚集”更能保留原词的视觉力度。
- source_word: τοὺς κλητούς
  choice: 被召来的人
  rationale: 指奉命被召集者，并非社交意义上的宾客；“被召来”在现代中文中自然且符合行政语境。
- source_word: προσελθὼν
  choice: 上前
  rationale: 简洁表达此人走近王的动作，并保留其先接近、后示意的动作次序。
- source_word: ἔνευσε ... τὸν βασιλέα
  choice: 向王示意
  rationale: ἔνευσε 可指点头或其他姿势所作的信号；“示意”保留具体动作未明的含混性。
