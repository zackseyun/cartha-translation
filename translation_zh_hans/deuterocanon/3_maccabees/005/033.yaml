translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“突如其来而又危险”保留两个希腊文形容词；“神色和面容”刻意保留原文并列结构。脚注说明 συνεστάλη 的多义性，正文不把它限定为纯身体动作或纯心理状态。
