  yaml_path: translation/deuterocanon/3_maccabees/005/033.yaml
  text: Thus Hermon endured an unexpected and dangerous threat[a], and he was shaken in appearance and countenance.
translation:
  language: zh_hans
  text: 这样，赫尔蒙承受了这突如其来而又危险的威胁；他的神色和面容都显出畏缩不安。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的神色和面容都显得局促不安”，又或：“他在外表和面容上都畏缩了。”希腊文动词可以表示可见的收缩、因畏惧而退缩，或情绪受到扰动。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: 这样
  rationale: 承接上文，表达由此前情势导致的结果或当时的情形，简洁自然。
- source_word: ὁ Ἕρμων
  choice: 赫尔蒙
  rationale: 按现代汉语常用音译方式处理人名。
- source_word: ἀπροσδόκητον
  choice: 突如其来
  rationale: 表示未曾预料；此译自然传达威胁突然临到的意味。
- source_word: ἐπικίνδυνον
  choice: 危险
  rationale: 直接保留涉及危险、凶险的语义，不将其弱化为一般的严厉。
- source_word: ὑπήνεγκεν
  choice: 承受了
  rationale: 表达遭受并承担某事，既贴近动词语义，也不额外断定他是否坚忍到底。
- source_word: ἀπειλήν
  choice: 威胁
  rationale: 准确对应威吓、威胁之意。
- source_word: τῇ ὁράσει καὶ τῷ προσώπῳ
  choice: 神色和面容
  rationale: 保留两个并列的可见层面：整体外观、神色与具体面容；避免把二者完全合并。
- source_word: συνεστάλη
  choice: 显出畏缩不安
  rationale: 该词可指收缩、畏缩或受惊扰；结合神色和面容，译文保留身体反应与情绪扰动并存的可能。
