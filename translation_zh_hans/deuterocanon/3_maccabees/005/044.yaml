base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/044.yaml
  text: Then the friends and relatives[a], overjoyed, having regained confidence, stationed the forces in the most suitable places of the city for guard duty.
translation:
  language: zh_hans
  text: 那时，朋友和亲属都欣喜万分。他们散开后，怀着信心[a]，把兵力部署在城中最合适的地点，负责守卫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“带着信心（或信仰）”，也可理解为“忠实地”。这里可能指他们心中有信心，也可能指他们忠实地行事。
    reason: 保留μετὰ πίστεως在信心、信仰与忠实行动方式之间的词义歧义。
lexical_decisions:
- source_word: περιχαρεῖς
  choice: 欣喜万分
  rationale: 该形容词带有强烈的喜悦意味；“欣喜万分”自然地传达了这一加强语气。
- source_word: ἀναλύσαντες
  choice: 散开后
  rationale: 此处可指离开、解散或散开；结合众人随后分赴城中各处部署兵力的情境，“散开后”最为贴切，同时不引入原文没有明确表达的“恢复信心”。
- source_word: οἱ φίλοι καὶ συγγενεῖς
  choice: 朋友和亲属
  rationale: 直接保留原文所列的两类社会关系，语言现代而清楚。
- source_word: μετὰ πίστεως
  choice: 怀着信心
  rationale: πίστις可表示信心、信赖或忠信；叙事情境中“怀着信心”自然，也保留了该词可能具有的信仰意味，其他可能性列于脚注。
- source_word: διέτασσον
  choice: 部署
  rationale: 该动词表示安排、配置；以兵力为宾语时，“部署”准确体现有组织地安置兵力。
- source_word: τὰς δυνάμεις
  choice: 兵力
  rationale: 在守卫城市的军事语境中，该词指军队或武装力量；“兵力”简洁且不过度限定其具体组成。
- source_word: ἐπὶ τοὺς εὐκαιροτάτους τόπους
  choice: 在城中最合适的地点
  rationale: 最高级εὐκαιροτάτους表示最适宜、最有利；“最合适的地点”保留原义，不额外强化为专业性的“战略要地”。
- source_word: πρὸς τὴν τήρησιν
  choice: 负责守卫
  rationale: 该短语说明部署的目的，即看守、防卫；“负责守卫”符合现代汉语表达。
theological_decisions:
- issue: μετὰ πίστεως中πίστις的译法
  choice: 怀着信心
  alternative: 忠实地；凭着信仰
  rationale: 原短语直译为“带着信心／信仰”。在当前叙事中，它可能描述行动者的确信，也可能描述其忠实的行动方式。正文采用自然且保留神学余韵的“怀着信心”，脚注注明其他可能理解，不把歧义强行消除。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“欣喜万分”“部署兵力”“负责守卫”清晰自然；正文不沿用缺乏希腊文直接依据的“恢复了信心”，并以脚注保留πίστις的真实歧义。
