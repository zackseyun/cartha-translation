  text: But the sun’s rays had not yet spread out[a], and while the king was receiving his friends, Hermon came forward and summoned them to the departure[b], pointing out that the king’s eagerness was in readiness.
translation:
  language: zh_hans
  text: 太阳的光线尚未散布开来；正当王接见他的朋友[a]时，赫尔蒙上前，催促众人出发[b]，说明王已急切地准备妥当。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朋友”在希腊化时期的宫廷用语中也可指王身边具有正式身份的亲信或臣僚。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文的意思近于“呼召前往出发”；受召者没有明说，这里很可能是指催促在场的人启程。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω δὲ ἡλίου βολαὶ κατεσπείροντο
  choice: 太阳的光芒还未四散开来
  rationale: 保留“尚未”与未完成时所呈现的清晨叙事背景；κατεσπείροντο本有“撒散”之意，用“四散开来”自然表达阳光逐渐铺散的意象。
- source_word: τοῦ βασιλέως τοὺς φίλους ἐκδεχόμενον
  choice: 正当王接见他的朋友时
  rationale: ἐκδέχομαι可指等候或接待；以τοὺς φίλους为宾语并置于宫廷场景中，“接见”最为贴切，同时保留“朋友”这一原词。
- source_word: ὁ Ἕρμων παραστὰς
  choice: 赫尔蒙上前
  rationale: 人名按希腊语音译；παραστὰς在此表示走到近前，译作“上前”简洁自然。
- source_word: ἐπικαλεῖ πρὸς τὴν ἔξοδον
  choice: 催促众人动身
  rationale: 原文没有明说受召者，但语境表明是催促在场者出发；“动身”自然表达ἔξοδος在此处的出发、外出之意。
- source_word: ὑποδεικνὺς τὸ πρόθυμον τοῦ βασιλέως ἐν ἑτοίμῳ κεῖσθαι
  choice: 说明王已经急切地准备好了
  rationale: ὑποδεικνύω表示指出或说明；τὸ πρόθυμον兼有热切意愿与主动准备之意，ἐν ἑτοίμῳ κεῖσθαι则是“处于准备就绪状态”的习语。此译法保留王的急切与准备就绪两层意思。
