  yaml_path: translation/deuterocanon/3_maccabees/005/041.yaml
  text: For this reason the city is in turmoil because of the expectation[a], and as it grows with crowds[c][b], it is already in danger of being plundered many times.
translation:
  language: zh_hans
  text: 因此，这城因这种期待[a]而陷入骚动；城中聚集的人群日益增多[b]，城也已经面临屡遭劫掠[c]的危险。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因这种预期”“因这种悬念”；希腊词表示处于期待、等候之中的状态。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“这城因成群的聚集而增多／膨胀”；此处也可理解为城中聚集的人群不断增加。
    reason: lexical_syntax
  - marker: c
    text: “屡次”也可译作“常常”；希腊词兼有“多次”和“经常”的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν χάριν
  choice: 因此
  rationale: 这是承接上文、表达因果结果的惯用语；“因此”简洁自然。
- source_word: ἡ πόλις
  choice: 城里／城
  rationale: 前半句用“城里”自然表达城中居民的骚动，后半句保留“城”作为遭劫掠的对象，既符合汉语习惯，也不把所指缩减为居民。
- source_word: διὰ τὴν προσδοκίαν
  choice: 因这种期待
  rationale: προσδοκία表示期待、等候或悬念中的预期状态；“这种期待”直接承接上文，同时保留其宽泛含义。
- source_word: ὀχλεῖ
  choice: 陷入骚动
  rationale: 该动词在此描写城市受到扰动、出现动荡；“陷入骚动”兼顾动态感与现代汉语的可读性。
- source_word: πληθύνουσα συστροφαῖς
  choice: 聚集的人群越来越多
  rationale: 将分词与工具／方面与格合译，表达城市因成群聚集者增加而拥挤、膨胀的景象；不预断这些群体必然是暴民。
- source_word: ἤδη
  choice: 已经
  rationale: 标明危险在当时已现实存在；汉语中融入“已经屡次面临”表达。
- source_word: κινδυνεύει
  choice: 面临……的危险
  rationale: 自然对应“处于危险、冒风险”的意义。
- source_word: πολλάκις
  choice: 屡次
  rationale: 既可表示“多次”，也可表示“常常”；“屡次”简洁保留重复性。
- source_word: διαρπασθῆναι
  choice: 遭到劫掠
  rationale: 准确表达被抢掠、洗劫的被动意义，不额外加入毁城等细节。
