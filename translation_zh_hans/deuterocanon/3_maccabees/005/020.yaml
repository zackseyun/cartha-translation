base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/020.yaml
  text: Having a savagery worse than Phalaris[a], he said that they should be thankful to sleep today; but, once they had been kept alive until the coming day[c][b], prepare the elephants in the same way for the destruction of the lawless Jews.
translation:
  language: zh_hans
  text: 他比法拉里斯[a]更残暴，说：“他们应当为今天得以睡觉而感恩[b]；但既然把他们留到临近的那一天，就要照样预备好大象，用来消灭那些不法的犹太人[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 法拉里斯在希腊传统中以异常残酷著称；这里用他作比较，是为了强化此人的残暴形象。
    reason: cultural_note
  - marker: b
    text: 也可译作“应当把今天得以睡觉看作一种恩惠”。原文习语表示，他们应将当天获准睡觉视为值得感恩的优待。
    reason: lexical_alternative
  - marker: c
    text: “不法的”是说话者所用的敌意称谓；也可译作“违法的”或“不敬虔的”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὠμότητα χείρονα Φαλάριδος
  choice: 残暴甚于法拉里斯
  rationale: ὠμότης表示凶狠、残酷的性情；用“残暴”自然凝练，并保留以法拉里斯为极端残酷之参照的比较结构。
- source_word: τὸ τῆς σήμερον ὕπνῳ χάριν ἔχειν αὐτούς
  choice: 他们应当为今天得以睡觉而感恩
  rationale: χάριν ἔχειν是“感恩、承情”的习语；译文保留其讥讽意味，即他们应把当天获准睡觉视为恩惠。
- source_word: συντηρηθέντας
  choice: 把他们留到
  rationale: 此被动分词在处决语境中指将他们保存、留存至次日；中文以“把他们留到”承接后面的命令，既自然又不必过度明说“留活命”。
- source_word: ὑποτέλλουσαν ἡμέραν
  choice: 即将到来的那一天
  rationale: ὑποτέλλουσαν描写日子渐近、来到；“即将到来的那一天”保留动态及与“今天”的对照。
- source_word: κατὰ τὸ ὅμοιον ἑτοίμασον τοὺς ἐλέφαντας
  choice: 再照样预备好大象
  rationale: 保留单数命令式ἑτοίμασον，并以“照样”回指此前所述的预备方式。
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: 用来消灭
  rationale: ἀφανισμός意为毁灭、除灭；“消灭”准确传达其目的性和暴力强度，同时符合现代汉语叙事。
- source_word: ἀθεμίτων Ἰουδαίων
  choice: 那些无法无天的犹太人
  rationale: ἀθέμιτος可指违法、悖逆礼法或不敬虔；“无法无天”保留说话者带敌意的贬称，不把它当作叙述者的评价。
theological_decisions:
- issue: 迫害者对犹太人的敌意称谓
  choice: 那些无法无天的犹太人
  alternative: 那些不法的犹太人；那些不敬虔的犹太人
  rationale: 原文的贬称属于人物话语，不应淡化，也不应被理解为译者或叙述者认可。所选措辞保留敌意与ἀθέμιτος的违法、悖礼语义范围。
- issue: 获准睡眠作为“恩惠”的讥讽意味
  choice: 应当为今天得以睡觉而感恩
  alternative: 应当把今天这场睡眠看作恩惠
  rationale: 原文有意呈现残暴者把暂缓处决说成值得感恩的恩惠；直译其感恩结构，保留道德张力而不另作解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。主句保留命令语气及残酷的反讽；脚注明确文化典故和敌意称谓的语用归属。所有脚注标记均置于正文对应位置。
