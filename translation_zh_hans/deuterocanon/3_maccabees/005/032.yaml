  text: Yet[a], if it were not for your affection because of the gathering together and the necessity[b], you would have been deprived of life instead of these things.
translation:
  language: zh_hans
  text: 然而，若不是因着你对这聚集的眷恋，以及这份需要，你本会被夺去性命，而非这些。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聚集”所译的希腊词也可指“人群”或“聚在一起”。“这份需要”也可译为“这必要”；原文措辞简略，未说明“这些”具体指什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ εἰ μή
  choice: 不过，若不是
  rationale: καίπερ带有让步意味，与εἰ μή连用时，以“不过，若不是”自然表达转折和反事实条件，同时不把它僵硬地拆成两个结构。
- source_word: διὰ
  choice: 顾念……而且
  rationale: διὰ接宾格表示原因；结合中文语序，将这一因由自然表达为“若不是顾念……而且……”。
- source_word: τὴν τῆς συστροφῆς στοργὴν
  choice: 顾念相处的情分
  rationale: στοργή表示眷爱、亲厚之情；συστροφή既可指聚集，也可指共同相处或交往。此处采用符合人物关系语境的“相处的情分”，并以脚注保留“聚集”这一词义可能。
- source_word: καὶ τῆς χρείας
  choice: 而且还需要你
  rationale: 省略的στοργή或διὰ所形成的希腊语短语较为紧缩。χρεία可表示需要、用处或事务；“还需要你”在现代汉语中清楚保留因实际需要而留其性命的意思，但不进一步限定需要的性质。
- source_word: τὸ ζῆν
  choice: 性命
  rationale: 带冠词的不定式字面为“活着”；在στερέω表示被剥夺的结构中，中文以“性命”最自然庄重。
- source_word: ἀντὶ τούτων
  choice: 而不是这些
  rationale: ἀντί表示替代或交换，“而不是这些”保留原文复数指示词的含混指向，不擅自补明所指。
- source_word: ἐστερήθης
  choice: 你被夺去的就会是
  rationale: 保留στερέω被动态“被剥夺”的严厉语气，并用“就会”表达未实现的反事实结果。
