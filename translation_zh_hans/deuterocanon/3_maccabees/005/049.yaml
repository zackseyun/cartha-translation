base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/049.yaml
  text: Considering that moment to be for them the final turn of life[a], the end of their most miserable expectation, they turned to pity and lamentation and kept kissing one another, embracing their relatives, falling upon their necks—parents upon children and mothers upon young daughters; and others, holding infant babies to their breasts[c][b], were drawing out their last milk.
translation:
  language: zh_hans
  text: 他们以为，那一刻是自己生命的最后关头，是这极其悲惨的等待的尽头[a]；于是转而满怀怜悯，放声哀号，彼此不停地亲吻，紧紧拥抱亲人，扑到对方怀里，抱住对方的颈项[b]——父母扑向儿女，母亲扑向年轻的女儿[c]。另有些妇人把初生的婴孩抱在胸前；婴孩正吸吮最后一次乳汁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等待”也可译作“期待”或“悬候”；希腊语 προσδοκία 可指期待某事，也可指等候即将发生之事。
    reason: lexical_alternative
  - marker: b
    text: “扑到对方怀里，抱住对方的颈项”对应原文“扑在颈项上”的惯用说法，指悲痛或深情中投入对方怀抱、搂颈相抱。
    reason: cultural_note
  - marker: c
    text: “年轻的女儿”原文也可译作“年轻女子”；此处亲属关系的并列使“女儿”较为合适。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστάτην βίου ῥοπὴν
  choice: 生命最后的转折
  rationale: ῥοπή含有转向、倾斜或临界点的意象；译作“转折”既保留比喻，也表达他们以为生命已到最后关头。
- source_word: δόξαντες
  choice: 他们以为
  rationale: 该分词表达众人对眼前处境的判断，并不保证判断客观为真；“以为”自然地保留这一层次。
- source_word: τὸ τέλος τῆς ἀθλιωτάτης προσδοκίας
  choice: 极其悲惨的等待走到尽头
  rationale: προσδοκία兼有期待、悬念和等候即将发生之事的含义；上下文是等候惨死，故正文采用自然的“等待”，脚注保留“期待”的可能。
- source_word: εἰς οἶκτον καὶ γόους τραπέντες
  choice: 便转而哀怜、号哭
  rationale: 保留τραπέντες的“转而”以及οἶκτος与γόοι两个不同层面的情感和举动，不把前者过度限定为自怜或彼此怜悯。
- source_word: κατεφίλουν
  choice: 彼此不停亲吻
  rationale: 未完成时态配合κατα-所带的加强意味，描写持续、反复的告别亲吻。
- source_word: περιπλεκόμενοι τοῖς συγγενέσιν
  choice: 紧抱亲人
  rationale: περιπλέκομαι描写以双臂环抱、紧紧相拥；“亲人”自然涵盖συγγενεῖς所指的亲属。
- source_word: ἐπὶ τοὺς τραχήλους ἐπιπίπτοντες
  choice: 伏在他们颈项上
  rationale: 较贴近原文的身体动作和哀恸画面；脚注说明这是投入对方怀抱的惯用表达。
- source_word: νεάνισιν
  choice: 年轻的女儿
  rationale: 该词本身可指年轻女子；在“父母—儿女、母亲—年轻女子”的亲属并列中，译作“年轻的女儿”较符合语境，同时以脚注保留字面可能。
- source_word: νεογνὰ ... βρέφη
  choice: 初生的婴孩
  rationale: 合并表达两个相互强化、突出幼小脆弱的词语，避免现代汉语中生硬重复。
- source_word: τελευταῖον ἕλκοντα γάλα
  choice: 让他们吸着最后一口奶
  rationale: ἕλκω在此描写婴孩从乳房吸奶；“最后一口”传达众人以为死亡迫近时最后一次哺乳的悲剧意味。
