  yaml_path: translation/deuterocanon/3_maccabees/005/048.yaml
  text: But when the Jews saw the elephants coming out to the gate[a], and the dust from the advancing armed force and from the movement of the crowd, and heard a loud tumult,
translation:
  language: zh_hans
  text: 可是，当大象出来，朝城门而去时，犹太人看见随后的武装部队和人群行进扬起的尘土，又听见沉重的喧响[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沉重的喧响”也可译作“震耳的喧闹”或“低沉的骚动声”。希腊语着重表现声音的厚重或回荡感。
    reason: 说明βαρυχῆ θόρυβον兼有声势强烈与低沉厚重的语义，正文不将其单纯化为音量。
lexical_decisions:
- source_word: ὡς δὲ
  choice: 可是，当……时
  rationale: 兼顾叙事转折和时间从句的作用；本节在句法上承接下文，因此保留未完句式。
- source_word: τῶν ἐλεφάντων ἐξιόντων ἐπὶ πύλην
  choice: 大象出来，朝城门而去
  rationale: ἐξιόντων表示出来、出去，ἐπὶ加宾格表示朝向；此译不强行断定已经抵达城门。
- source_word: τῆς ἑπομένης ἐνόπλου δυνάμεως
  choice: 尾随的武装部队
  rationale: ἑπομένης表明武装力量跟在大象之后；“尾随”保留其空间次序，ἐνόπλου δυνάμεως译为自然的军事用语“武装部队”。
- source_word: τῆς τε τοῦ πλήθους πορείας
  choice: 行进的人群
  rationale: πορεία指行进或行军，πλῆθος指众人；将属格结构自然转化为“行进的人群”，并与武装部队共同修饰扬起的尘土。
- source_word: κονιορτόν
  choice: 扬起的尘土
  rationale: 原词意为尘土；汉语中补出“扬起”可清楚表达尘土由部队和人群行进所激起，没有增加新的事件。
- source_word: βαρυχῆ θόρυβον
  choice: 沉重的喧响
  rationale: βαρυχής强调声音低沉、厚重或有强烈共鸣，θόρυβος指喧声、骚动声；“沉重的喧响”保留原文不寻常的声响质感。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 此处指埃及境内作为族群兼宗教群体的犹太人，并非仅指犹太地居民。
