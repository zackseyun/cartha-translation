lexical_decisions:
- source_word: τούτων
  choice: 他们的
  rationale: 该属格指示代词回指前文所述的人；译作“他们的”符合现代汉语表达。
- source_word: μὲν οὖν
  choice: 于是
  rationale: 这一组合承接上文并推进叙事；“于是”简洁自然，不把语气译得过重。
- source_word: λιτανία
  choice: 恳求
  rationale: 该词指带有祈求性质的迫切请求；“恳求”比宽泛的“祷告”更能保留其哀求、祈请意味。
- source_word: ἐκτενῶς
  choice: 热切地
  rationale: 该副词可表示强度，也可表示延展或持续；正文采用自然的强度义，并在脚注保留持续义的可能。
- source_word: ἀνέβαινεν
  choice: 升到
  rationale: 未完成过去时描写正在持续的上升过程；汉语句中的“热切地升到”结合上下文可自然表达祈求上达天上的动态，不另加体标记以免累赘。
- source_word: εἰς τὸν οὐρανόν
  choice: 到天上
  rationale: 在祈求语境中，οὐρανός指天上而非单纯的天空；“到天上”是现代汉语自然说法。
