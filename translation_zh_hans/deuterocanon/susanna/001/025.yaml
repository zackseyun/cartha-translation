base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/025.yaml
  text: It is preferable for me to fall into your hands without doing it rather than to sin before the Lord[a].
translation:
  language: zh_hans
  text: 我宁可不做这事而落在你们手中，也不愿在主面前犯罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“没有做（这事）。”希腊文没有明说所指的行为，而是承接上文长老的要求。
    reason: 说明原文省略宾语；正文以“这事”作最低限度的指代，不将行为具体化。
lexical_decisions:
- source_word: αἱρετόν μοί ἐστιν
  choice: 我宁可
  rationale: 表达“对我而言更可选择”的比较取舍；现代汉语用“宁可……也不愿……”最自然，并保留她在两种恶果之间所作的选择。
- source_word: μὴ πράξασαν
  choice: 什么也不做
  rationale: 希腊文仅说“没有做／不做”，宾语承接上文而未明说。译文不具体点明长老所要求的行为，以保留原文的含蓄；“什么也不做”使中文语法完整。
- source_word: ἐμπεσεῖν εἰς τὰς χεῖρας ὑμῶν
  choice: 落在你们手里
  rationale: 保留原文“落入某人手中”的权势与受害意象，在现代汉语中也清楚自然。
- source_word: ἢ ἁμαρτεῖν
  choice: 也不愿……犯罪
  rationale: ἢ 在 αἱρετόν 所引出的比较结构中表示两者取舍；“宁可……也不愿……”准确呈现这种对照。ἁμαρτεῖν 直译为“犯罪”。
- source_word: ἐνώπιον Κυρίου
  choice: 在主面前
  rationale: 保留人在上主临在和鉴察之下承担道德责任的含义；Κύριος 按经文语域译作“主”。
theological_decisions:
- issue: 是否明确说出长老所要求的行为
  choice: 正文不将该行为具体化，只译作“什么也不做”
  alternative: 译作“不顺从你们”或“不犯你们所逼迫我犯的罪”
  rationale: 原文 μὴ πράξασαν 没有明说宾语，只凭上文理解。具体化会加入原句未明说的解释，因此保留含蓄，并以脚注说明。
- issue: “落在你们手里”与“在主面前犯罪”的伦理张力
  choice: 保留两种后果的直接比较
  alternative: 解释为宁受诬告或处死也不犯罪
  rationale: 原文没有在本句中列明将遭受的具体惩罚；直译其比较结构，可保留叙事中的威胁与信仰抉择，而不提前解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我宁可……也不愿……”清楚传达原文的比较取舍；“落在你们手里”和“在主面前犯罪”保留经文意象与宗教语域。
