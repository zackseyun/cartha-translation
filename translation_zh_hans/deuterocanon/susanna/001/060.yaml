translation:
  language: zh_hans
  text: 全体会众都高声呼喊，称颂那拯救仰望他之人[a]的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信靠他的人。”这里的希腊语动词更直接表示“盼望”，但在圣经用法中也可包含信赖、倚靠上帝的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: 高声呼喊
  rationale: 该动词表示发出响亮的呼声；“高声呼喊”在现代汉语中自然，并保留原文的强烈语气。
- source_word: πᾶσα ἡ συναγωγή
  choice: 全体会众
  rationale: 此处指聚集起来的整个群体，而非后世作为机构或建筑的“会堂”；“全体会众”既符合叙事场景，也保留整体性。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 这是表示大声发言或呼喊的惯用语；汉语用“高声”可自然传达其具体声量，避免生硬直译为“大声音”。
- source_word: εὐλόγησαν
  choice: 称颂
  rationale: εὐλογέω在此指人向上帝说颂赞的话。“称颂”既保留圣经语体，也比“祝福上帝”更符合现代汉语习惯，同时没有削弱其赞美含义。
- source_word: τῷ θεῷ
  choice: 上帝
  rationale: 作为εὐλόγησαν的对象，指会众所称颂的上帝。
- source_word: τῷ σώζοντι
  choice: 那拯救……的
  rationale: 现在分词修饰“上帝”，表达上帝持续而具有特征性的拯救作为；定语结构贴合希腊文句法且汉语通顺。
- source_word: τοὺς ἐλπίζοντας ἐπ’ αὐτόν
  choice: 仰望他之人
  rationale: ἐλπίζω首先表达盼望，也可含有信赖依靠之意。“仰望他”是自然庄重的圣经汉语，保留盼望指向上帝的含义；“信靠”作为可接受的语义重叠收入脚注。
theological_decisions:
- issue: εὐλόγησαν τῷ θεῷ的表达
  choice: 称颂……上帝
  alternative: 祝福上帝；赞美上帝
  rationale: 原文使用εὐλογέω，但现代汉语中“祝福上帝”容易被理解为人向上帝赐福。“称颂”既传达向上帝说颂赞之言的本义，又避免不必要的误解。
- issue: ἐλπίζοντας应译为“仰望”还是“信靠”
  choice: 仰望他之人
  alternative: 信靠他的人
  rationale: 希腊文明确使用“盼望”词群，而非专门表示相信或信靠的词；正文保留“仰望”的盼望色彩，脚注说明其在圣经语境中也可含信赖依靠之意。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“全体会众都高声呼喊”保留原文的集体性和声音强度；“称颂那拯救……的上帝”维持原文分词修饰“上帝”的关系。脚注标记置于存在词义选择的“仰望他之人”之后。
