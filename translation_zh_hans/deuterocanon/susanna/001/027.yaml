  yaml_path: translation/deuterocanon/susanna/001/027.yaml
  text: But when the elders spoke their words[a], the servants were greatly ashamed, because never had such a thing been said about Susanna.
translation:
  language: zh_hans
  text: 可是，长老们说出他们那番话时，仆人们都深感羞愧，因为从来没有人说过关于苏珊娜的这种话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这种话”也可译作“这样的说法”或“这样的指控”。
    reason: λόγος τοιοῦτος语义较宽；上下文具有指控意味，但希腊文本身只明确表达“这种话／说法”。
lexical_decisions:
- source_word: ἡνίκα δὲ
  choice: 可是……时
  rationale: ἡνίκα引出时间从句，δὲ推动叙事并略带转折；“可是……时”兼顾两者，符合现代汉语叙事习惯。
- source_word: οἱ πρεσβῦται
  choice: 长老们
  rationale: πρεσβῦται在本段不只指年长者，也指具有群体地位和审判职分的人；“长老”能保留这层身份。
- source_word: τοὺς λόγους αὐτῶν
  choice: 他们那番话
  rationale: λόγους泛指他们所说的话；“那番话”自然地指向前文陈述，又不擅自限定为正式证词或指控。
- source_word: κατῃσχύνθησαν οἱ δοῦλοι σφόδρα
  choice: 仆人们都深感羞愧
  rationale: κατῃσχύνθησαν表示感到羞愧或蒙羞，σφόδρα加强程度；δοῦλοι在此为家中服侍人员，译作“仆人们”较合语境。
- source_word: ὅτι πώποτε οὐκ ἐρρέθη
  choice: 因为从来没有人说过
  rationale: ὅτι说明原因，πώποτε与否定词连用表示“从来没有”；汉语主动式泛指“没有人说过”自然表达希腊文无人称被动。
- source_word: λόγος τοιοῦτος περὶ Σουσάννης
  choice: 关于苏珊娜的这种话
  rationale: λόγος本义宽泛，可指话、说法或陈述；περί加属格基本义为“关于”。此译保留原文宽度，不把内容直接定性为指控。
