base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/052.yaml
  text: But when they had been separated[a], one from the other, he called one of them and said to him, “You who have grown old in evil days[b], now the sins that you were doing before have come upon you.”
translation:
  language: zh_hans
  text: 他们彼此分开以后，他叫来其中一人，对他说：“你这在邪恶岁月中衰老的人[a]，如今，你从前[b]所犯的罪已经临到你了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你这在恶中衰老的人。”希腊语称呼十分凝练，也可更直译为“恶日中的衰老者”；“邪恶”究竟侧重此人的生活，还是他所经历的岁月，原文没有完全说明。
    reason: lexical_alternative
  - marker: b
    text: 现存的本节希腊文止于不完整的 τὸ，看来与跨越节界的后续词构成“从前”之意；正文据此补足语意。
    reason: textual_variant
lexical_decisions:
- source_word: διεχωρίσθησαν
  choice: 分开
  rationale: 这是 διαχωρίζω 的不定过去时被动形式，表示两人被隔离开来；中文用“分开”既保留被分隔的结果，也避免生硬的被动句。
- source_word: εἷς ἀπὸ τοῦ ἑνός
  choice: 彼此
  rationale: 该短语按字面是“一人与另一人分开”，语境中指两位长老相互隔离；“彼此分开”是自然、准确的现代汉语表达。
- source_word: ἐκάλεσεν τὸν ἕνα αὐτῶν
  choice: 叫来其中一人
  rationale: ἐκάλεσεν 可指叫或传唤；“叫来”符合审问场景，又不额外强化司法术语。
- source_word: Πεπαιλαιωμένε ἡμερῶν κακῶν
  choice: 你这在邪恶岁月中衰老的人
  rationale: 保留完成时分词“已经衰老”的意味和 ἡμερῶν“日子、岁月”的明确词义，同时维持原文压缩表达所留下的关系含混。
- source_word: νῦν ἥκασιν αἱ ἁμαρτίαι σου
  choice: 如今……你所犯的罪已经临到你了
  rationale: ἥκασιν 表示“已经来到”；“临到你”保留罪行如今追及并面对审判的隐喻，不改写成更口语化的“报应到了”。
- source_word: ἃς ἐποίεις
  choice: 你所犯的
  rationale: ποιέω 与“罪”搭配时，现代汉语自然表达为“犯罪、犯下罪”；关系结构“所犯的”保留其修饰“罪”的句法作用。
- source_word: τὸ
  choice: 从前
  rationale: 现有节文止于冠词 τὸ，显然是不完整结构，最可能与下一节边界后的 πρότερον 构成 τὸ πρότερον，意为“从前”；正文译出可恢复的语意，并以脚注说明。
theological_decisions:
- issue: 但以理对长老称呼的道德谴责力度
  choice: 译作“你这在邪恶岁月中衰老的人”
  alternative: “恶中衰老的老头”或较中性的“经历邪恶岁月的老人”
  rationale: 审判语境表明这不是单纯陈述年长；译文保留责斥语气，却不把“邪恶”明确限定为长老本人或其所处时代，以免消除原文的语法张力。
- issue: 罪“临到”长老的含义
  choice: 保留“已经临到你了”的意象
  alternative: 明确译成“你的罪如今使你受审”或“报应追上你了”
  rationale: 原文只说罪已经来到，并未直接使用“报应”或“受审”等词；保留意象可避免加入特定的报应论解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“彼此分开以后”简洁交代分别审问的安排；直接引语保留司法责斥的力度。“邪恶岁月”有意保存原文紧缩且略带含混的修饰关系，不将其教义化或心理化。
