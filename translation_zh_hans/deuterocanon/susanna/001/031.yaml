translation:
  language: zh_hans
  text: 那女子极其柔美[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“十分柔嫩”、“十分娇柔”或“极为秀雅”。希腊语 τρυφερά 可指柔嫩、娇柔或精致，并不一定含有性格软弱或道德上的贬义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: （以自然语序表达为“……极其……”）
  rationale: δέ在这里是轻微的叙事连接词，并非强烈转折；单节中文若硬译为“而”或“但”会夸大对比，因此不另加连接词。ἦν则由判断句结构自然体现。
- source_word: ἡ γυνή
  choice: 这女子
  rationale: γυνή既可指“女人”，也可指“妻子”；本句着重描写苏撒拿本人，并未突出婚姻关系。“这女子”既承接上下文，也避免无根据地限定为“妻子”。
- source_word: τρυφερά
  choice: 娇嫩
  rationale: τρυφερός可表达柔嫩、娇柔或精致之感。“娇嫩”保留其对外在柔美细致的描写，同时不把它误解为道德软弱或奢靡放纵。
- source_word: σφόδρα
  choice: 极其
  rationale: σφόδρα是强烈程度副词；“极其”准确保留其强化作用，也符合庄重的叙事语体。
