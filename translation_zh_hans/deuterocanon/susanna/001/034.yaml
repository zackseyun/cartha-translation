  language: zh_hans
  text: 于是，长老和审判官都站起来，把手放在她的头上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: 站起来
  rationale: 不定过去时分词在此表示叙事中先于主要动作发生的行动；译为“站起来”自然清楚，并保留其身体动作。
- source_word: οἱ πρεσβύτεροι
  choice: 长老
  rationale: 此处指在群体中具有公认地位和司法职能的人，并非仅指年长男子；“长老”准确保留其社会身份。
- source_word: κριταὶ
  choice: 审判官们
  rationale: 该词指承担审判职责的人；“审判官”比单用“法官”更适合古代司法场景，也能与前面的“长老”构成清晰并列。
- source_word: ἐπέθηκαν τὰς χεῖρας αὐτῶν
  choice: 把手按在
  rationale: ἐπιτίθημι与“手”连用表示将手放到某处；汉语“把手按在”准确呈现实际动作，同时避免“按手”可能引出的后世宗教礼仪联想。
- source_word: ἐπὶ τῆς κεφαλῆς αὐτῆς
  choice: 她头上
  rationale: 直接表达手所放置的位置，符合现代汉语习惯，并忠实保留第三人称阴性所指。
theological_decisions:
- issue: 这一把手放在头上的动作是否应带有礼仪或圣礼意味
  choice: 按字面译作司法程序中的具体动作：“把手按在她头上”
  alternative: “在她头上按手”
  rationale: 希腊文本只陈述审判过程中的身体动作；采用“把手按在”可保留动作本身，而不额外引入后世宗教语境中“按手”的专门含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接上下文并体现δέ的推进作用；保留“长老”和“审判官们”的并列，不将二者合并为同一群体或职衔。
