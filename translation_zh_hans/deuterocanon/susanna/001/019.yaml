  yaml_path: translation/deuterocanon/susanna/001/019.yaml
  text: And she said to the servant girls[a], “Bring me oil and ointments, and shut the doors of the garden, so that I may bathe.”
translation:
  language: zh_hans
  text: 她对侍女们[a]说：“给我拿些油和浴用香膏来，把园门关上，好让我沐浴。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍女们”也可译作“女孩们”或“年轻女子们”。希腊词可指女孩或年轻的女性随从；本处语境更可能指家中的女性侍从。
    reason: lexical_alternative
lexical_decisions:
- source_word: κορασίοις
  choice: 侍女们
  rationale: 该词本义可指女孩或年轻女子；在本叙事中，她们是受苏珊娜差遣的女性随从，因此译作“侍女们”既符合语境，也不必额外强调年龄。
- source_word: Ἐνέγκατε δή μοι
  choice: 给我拿……来
  rationale: 体现不定过去时命令语气及 δή 所带的直接语感，同时符合现代汉语口吻。
- source_word: ἔλαιον
  choice: 油
  rationale: 原文仅说“油”；虽可能指沐浴或涂身所用的橄榄油，但不明说“橄榄”以免增译。
- source_word: σμήγματα
  choice: 浴用香膏
  rationale: 该词指洗浴、擦身或涂抹身体所用的制剂；“浴用香膏”在本处自然，并保留其膏剂及可能带香气的语境含义。
- source_word: θύρας τοῦ παραδείσου
  choice: 园门
  rationale: παράδεισος 在此指围起来的园子，θύρας 指其门；合译为“园门”简洁自然。
- source_word: κλείσατε
  choice: 关上
  rationale: 准确表达关闭之意；不译作“锁上”，因为原文没有明确提到上锁。
- source_word: ὅπως λούσωμαι
  choice: 好让我沐浴
  rationale: 中间语态 λούσωμαι 表示自己洗浴；“沐浴”符合场景，语体庄重而自然。
