base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/028.yaml
  text: But the lawless men turned back[a], threatening among themselves and lying in wait so that they might put her to death. And when they came to the assembly of the city, they did not stay away[b], and all the sons of Israel who were there gathered together.
translation:
  language: zh_hans
  text: 可是，那些不法之徒转身返回[a]，彼此威吓，又暗中伺机，要置她于死地。他们来到城里的集会，并没有缺席[b]；所有当时在场的以色列的众子[c]都聚集起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转身返回”也可译作“转回去”。
    reason: lexical_alternative
  - marker: b
    text: “并没有缺席”所对应的希腊文含义不易确定；按上下文，可能是说他们没有避开城里的集会，而是到场参加。
    reason: textual_difficulty
  - marker: c
    text: 也可译作“以色列人”。希腊文直译为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: παράνομοι ἄνδρες
  choice: 不法之徒
  rationale: 保留 παράνομοι 违反律法、法纪的法律与道德色彩；“之徒”在庄重叙事中也自然表达这些怀有恶意的人。
- source_word: ἀπέστρεψαν
  choice: 转身离去
  rationale: 该动词表示转身或返回；结合叙事动作译为“转身离去”，同时用脚注保留“返回去”的可能。
- source_word: ἀπειλοῦντες ἐν ἑαυτοῖς
  choice: 彼此发出威胁
  rationale: ἐν ἑαυτοῖς 表示行动发生在他们内部或彼此之间；避免把威胁误解为公开对苏撒拿说出。
- source_word: ἐνεδρεύοντες
  choice: 暗中伺机
  rationale: 保留设伏、秘密图谋加害的敌对意味，又比字面“埋伏”更适合此处尚未描述具体伏击地点的语境。
- source_word: ἵνα θανατώσωσιν αὐτήν
  choice: 要置她于死地
  rationale: 表达 ἵνα 引导的目的，并保留司法处死与蓄意杀害之间的语义张力。
- source_word: συναγωγὴν τῆς πόλεως
  choice: 城里的集会
  rationale: 此处指全城共同参与的公民或司法集会，不宜按后期专门意义译成“会堂”。
- source_word: οὐ παρῴκουν
  choice: 并没有缺席
  rationale: 希腊文措辞艰涩；按上下文表达这些人没有避开该城集会、而是到场参与，同时以脚注说明不确定性。
- source_word: συνήδρευσαν
  choice: 聚集起来
  rationale: 表示众人集合并共同开会；“聚集起来”自然且不额外限定会议的正式性质。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列众子
  rationale: 保留希腊文明确的男性亲属式族群称谓，不以较中性的“以色列人”默默消除其形式。
theological_decisions:
- issue: 以男性亲属称谓指称盟约群体
  choice: 以色列众子
  alternative: 以色列人
  rationale: 原文明确使用 οἱ υἱοὶ Ἰσραήλ。正文保留这一传统而具性别标记的表达，脚注提供现代汉语中较自然的族群称谓，避免把语法形式与实际所指范围混为一谈。
- issue: 加害意图兼具秘密谋害与司法处死色彩
  choice: 置她于死地
  alternative: 杀死她
  rationale: θανατόω 可指使人死亡或处死；“置她于死地”既明确其致死目的，也不预先判定他们打算采用私刑还是操纵审判。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“不法之徒”“置她于死地”维持审判场景的法律色彩；对 οὐ παρῴκουν 的艰涩不作过度确定的解释，并在脚注中明示。
