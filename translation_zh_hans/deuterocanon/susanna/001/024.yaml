base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/024.yaml
  text: And Susanna groaned and said[a], “I am hemmed in on every side. For if I do this, it is death for me; but if I do not do it[b], I will not escape your hands.”
translation:
  language: zh_hans
  text: 苏撒拿长叹一声，说：“我四面受困；我若做这事，我就必死；我若不做，也逃不出你们的手。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεστέναξεν
  choice: 叹息着
  rationale: 该动词表示因痛苦而深深叹息或呻吟；“叹息着”自然庄重，也保留她在困境中的沉重情绪。
- source_word: Στενά μοι πάντοθεν
  choice: 我四面受困
  rationale: 此短语表达处处受到挤压、无路可走的困境；“四面受困”简洁自然，并保留空间受逼迫的意象。
- source_word: ἐὰν γὰρ τοῦτο πράξω
  choice: 我若做这事
  rationale: 直译指实行对方所要求之事，不进一步明说其内容，保留原文的指示性和含蓄表达。
- source_word: θάνατός μοί ἐστιν
  choice: 就是死路一条
  rationale: 原文是强烈而简短的名词句，意为这对她就是死亡；此译法在现代汉语中自然，并保留绝境感。
- source_word: ἐὰν μὴ πράξω
  choice: 我若不做
  rationale: 重复“做”以对应原文前后重复的 πράξω，维持两难结构；不译成“拒绝”，以免加入原文未明说的意志色彩。
- source_word: οὐκ ἐκφεύξομαι τὰς χεῖρας ὑμῶν
  choice: 也逃不出你们的手
  rationale: 保留“手”的具体比喻和将来陈述的力度；在汉语中也可自然表达无法摆脱对方控制。
theological_decisions:
- issue: 如何呈现苏撒拿在胁迫下的两难处境
  choice: 保留“做”与“不做”的鲜明对照，以及死亡和落入对方手中的双重威胁
  alternative: 将其解释性地改写为名誉受损、遭到定罪或受到法律惩罚
  rationale: 希腊文直接呈现受胁迫的绝境，却没有在本节具体展开“死”的机制；译文不淡化威胁，也不添加原文没有明说的法律或社会解释。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“四面受困”“死路一条”“逃不出你们的手”均为普通读者易懂的现代汉语，同时保留原文的压迫感、修辞平衡和具体意象。
