  rationale: 承接上文并推进叙事；现代汉语用“就”比逐字译作“并且”更自然。
- source_word: ἐπιθυμήσαντες
  choice: 贪恋
  rationale: 该不定过去时分词在语境中指向不正当的欲念。“贪恋”既保留“渴想、欲求”的核心意义，也传达其道德失序色彩，而不把原词过度限定为单纯的生理冲动。
- source_word: αὐτῆς
  choice: 她
  rationale: 阴性单数属格代词指苏撒拿；与“贪恋”搭配时，现代汉语自然地以“她”作宾语。
