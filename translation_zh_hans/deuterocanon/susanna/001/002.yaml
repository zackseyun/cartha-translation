  text: And he took a wife whose name was Susanna[a], the daughter of Hilkiah, beautiful,
translation:
  language: zh_hans
  text: 他娶了一位名叫苏撒拿[a]的女子为妻；她是希勒家的女儿，容貌美丽，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“他娶了一个妻子，名叫苏撒拿，是希勒家的女儿，容貌美丽。”希腊文的描述在本句末尚未结束，并延续到下一节。
    reason: 说明较贴近希腊文的紧凑表达，并交代为符合汉语习惯而调整的语序及跨节句法延续。
lexical_decisions:
- source_word: ἔλαβε
  choice: 娶了
  rationale: 该动词本义为“取、领受”，与 γυναῖκα 连用时表达娶妻；现代汉语用“娶了”自然且准确。
- source_word: γυναῖκα
  choice: 一个妻子
  rationale: 此处指婚姻关系中的妻子，而非泛指女人；保留名词使原文“娶/取一个妻子”的结构可见。
- source_word: ᾗ ὄνομα Σουσάννα
  choice: 名叫苏撒拿
  rationale: 这是表明姓名的关系结构；译作“名叫”符合现代汉语习惯，也不增加原文没有的信息。
- source_word: θυγάτηρ Χελκίου
  choice: 是希勒家的女儿
  rationale: 直译父女关系；Χελκίου 采用与中文圣经人名传统相符的“希勒家”。
- source_word: καλή
  choice: 容貌美丽
  rationale: καλή 在人物介绍中指外貌美丽；补出“容貌”可避免汉语中把“美丽”误读为泛指品德，同时承接下一节尚未完结的描述。
