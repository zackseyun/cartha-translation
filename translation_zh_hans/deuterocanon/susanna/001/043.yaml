base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/043.yaml
  text: You know that they testified falsely against me; and behold[a], I am dying, having done none of the things that these men wickedly contrived against me.
translation:
  language: zh_hans
  text: 你知道他们作假见证控告我；看哪，我就要死了，却没有做过这些人恶意捏造来控告我的任何一件事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶意捏造来控告我的任何一件事”也可译作“这些人恶意图谋陷害我的任何事”。希腊语动词可强调邪恶的谋划，也可较宽泛地指针对苏撒拿的恶意行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασαι
  choice: 你知道
  rationale: 动词表示确知或知悉；此处直接向上帝陈诉，用“你知道”自然、明确。
- source_word: ψευδῆ μου κατεμαρτύρησαν
  choice: 他们作假见证控告我
  rationale: καταμαρτυρέω具有司法语境，ψευδῆ说明证言虚假；译文兼顾作证与针对性的控告。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留引人注意并凸显眼前危急处境的话语功能，同时维持庄重语体。
- source_word: ἀποθνῄσκω
  choice: 我就要死了
  rationale: 现在时在处境中表达迫近的死亡；“就要死了”比字面“正在死”更符合现代汉语。
- source_word: μὴ ποιήσασα μηδὲν ὧν
  choice: 却没有做过……任何事
  rationale: 否定分词说明苏撒拿并未实施所指的一切行为；“却”自然呈现她无辜而将死的语境反差。
- source_word: ἐπονηρεύσαντο κατ᾽ ἐμοῦ
  choice: 恶意谋划来诬陷我
  rationale: 动词兼有作恶与恶意图谋的色彩，κατ᾽ ἐμοῦ表示行动针对她；结合假见证语境，“诬陷”点明谋划的方向，但以脚注保留较宽泛的译法。
theological_decisions:
- issue: μὴ ποιήσασα分词短语与主句的逻辑关系
  choice: 却没有做过
  alternative: 并没有做过；尽管我没有做过
  rationale: 希腊文形式上是伴随性的否定分词，语境中又形成无辜与死亡的强烈反差。“却”表达该反差，但不把它处理成完整的显式让步从句。
- issue: ἐπονηρεύσαντο所指的恶行性质
  choice: 恶意谋划来诬陷我
  alternative: 恶意谋害我；设计陷害我
  rationale: 上下文涉及捏造证词，故“诬陷”贴合司法场景；但该动词本身可较宽泛地指恶意图谋或作恶，因此脚注保留这一语义范围。
- issue: οὗτοι的指称
  choice: 这些人
  alternative: 他们；这些家伙
  rationale: 指向在场或语境明确的控告者；“这些人”既忠实于指示代词，也避免加入轻蔑色彩。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“作假见证控告我”保留司法语境；“看哪”略带经文庄重感，用来传达ἰδοὺ的强调作用。脚注标记置于相关句末。
