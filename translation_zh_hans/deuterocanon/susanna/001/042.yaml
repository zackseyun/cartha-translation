base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/042.yaml
  text: And Susanna cried out with a loud voice and said, “O eternal God, knower of the hidden things, who knows all things before they come to be,”
translation:
  language: zh_hans
  text: 苏撒拿便高声呼喊，说：“永恒的上帝啊，你洞悉一切隐秘之事[a]；万事尚未成形以前，你已全都知道[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你知道一切隐藏的事”或“你洞悉一切秘密”。
    reason: lexical_alternative
  - marker: b
    text: 或译“万事尚未发生以前”或“万事尚未存在以前”。希腊文可泛指事物产生、形成、存在或发生之前。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεβόησεν
  choice: 呼喊
  rationale: 该动词表示强烈地发声；结合 φωνῇ μεγάλῃ 译为“高声呼喊”，既保留情感力度，也符合祷告语境。
- source_word: φωνῇ μεγάλῃ
  choice: 高声
  rationale: 这是自然的现代汉语表达，准确传达“大声、响亮地”的意思，避免生硬直译为“以大声音”。
- source_word: Ὁ θεὸς ὁ αἰώνιος
  choice: 永恒的上帝啊
  rationale: 希腊文虽用主格形式，在此祷告中具有呼格功能；“啊”清楚表达直接呼求，αἰώνιος 译为“永恒的”。
- source_word: ὁ τῶν κρυπτῶν γνώστης
  choice: 你洞悉一切隐秘
  rationale: κρυπτά 泛指隐藏、隐而未显之事，不仅是人为保守的秘密；“洞悉一切隐秘”在中文中庄重自然，并表达 γνώστης 所强调的知晓。
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: 万事……你就已经知道了
  rationale: 以中文主谓句表达希腊文分词结构；“万事”保留 τὰ πάντα 的广泛涵义，“已经”凸显先于其发生的知晓。
- source_word: πρὶν γενέσεως αὐτῶν
  choice: 尚未发生以前
  rationale: γενέσεως 可指产生、出现或发生；此译适用于“万事”，同时不把含义限缩为实体的受造或存在。
theological_decisions:
- issue: πρὶν γενέσεως αὐτῶν 所表达的神圣预知
  choice: 万事尚未发生以前，你就已经知道了
  alternative: 在万事形成以前，你就知道；在万事存在以前，你就知道
  rationale: 此译肯定上帝在万事发生之前便已知晓，同时保留 γενέσεως 可指产生、形成或发生的宽泛语义，不引入经文本身未展开的预定论体系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“高声呼喊”保留原文的强烈情绪；“永恒的上帝啊”体现呼格功能。句末用分号，表明本节祷告尚未结束。所有脚注标记均置于相应正文之后。
