revisions:
- from: 苏撒拿便高声呼喊说：“永恒的上帝啊，你洞悉一切隐秘[a]，万事尚未发生以前，你就已经知道了[b]；”
  to: 苏撒拿便高声呼喊，说：“永恒的上帝啊，你洞悉一切隐秘之事[a]；万事尚未成形以前，你已全都知道[b]。”
  rationale: 将“发生”改为“成形”，以更准确而不狭窄地表达γενέσεως；并将“隐秘”明确为“隐秘之事”，使之更贴合原文所指的隐藏事物。调整引语内标点，使两个并列的神圣属性／知识陈述在现代汉语中更清晰；本节祷告在后文继续，句末仍可用句号作为中文节句的完整收束，不改变其语篇连续性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:48:05Z'
