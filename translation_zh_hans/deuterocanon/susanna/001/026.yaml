translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“传来的”将听见的声音与其地点“园中”顺畅连接；“要看看”体现不定式所表达的目的。脚注标记置于整句之后，所注释的是句中的“侧门”。
