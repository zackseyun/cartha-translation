  text: But when those from the house heard the outcry in the garden[a], they rushed in through the side door to see what had happened to her.
translation:
  language: zh_hans
  text: 屋里的人听见园中传来的呼喊声，就从侧门[a]冲进去，要看看她出了什么事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侧门”也可译作“侧边的门”或“侧边的出入口”；希腊语可泛指侧面的入口，具体建筑形制并不明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: κραυγή
  choice: 呼喊声
  rationale: 表示响亮而急迫的喊声；“呼喊声”自然传达现场的警报与紧迫感，又不预先限定为求救、哭叫或单纯喊叫。
- source_word: παράδεισος
  choice: 园中
  rationale: 此处指住宅附属的实体园子，不是神学意义上的“乐园”；结合中文语境，以“园中”简洁自然。
- source_word: οἱ ἐκ τῆς οἰκίας
  choice: 屋里的人
  rationale: 原语所指范围较宽，没有明确说明是家人、仆人还是全体家眷；“屋里的人”既符合他们听见声音后出来的场景，也避免增添身份信息。
- source_word: εἰσεπήδησαν
  choice: 冲进去
  rationale: 该动词表达突然、迅速而有力地进入；“冲进去”在现代汉语中自然保留这种紧迫感。
- source_word: πλαγία θύρα
  choice: 侧门
  rationale: πλαγία 表示侧面的，θύρα 可指门或出入口；在住宅与园子的场景中，“侧门”最简明，但具体也可能是侧边的园门。
- source_word: τὸ συμβεβηκὸς αὐτῇ
  choice: 她出了什么事
  rationale: 忠实表达已经发生在她身上的事情；此译法符合现代汉语叙事习惯，并保留事件内容尚未明说的状态。
