base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/012.yaml
  text: And behold[a], she was walking about as usual, and one of the elders had come, and behold, the other arrived, and he questioned the other, saying[b], “Why did you go out so early without taking me along?”
translation:
  language: zh_hans
  text: 看哪[a]，她正照常走动；长老中的一个已经来了。看哪，另一个也到了，就问另一个说[b]：“你为什么这么早就出来，却没有带上我呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两处都有“看哪”这一提示语；也可译作“你看”。
    reason: lexical_alternative
  - marker: b
    text: 本节希腊文在两个长老之间迅速转换，以“一个”和“另一个”相称；问话动词的主语未明说，因此叙述显得突兀。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文两次出现的鲜明提示语，体现叙事中突然引人注意的效果；现代汉语虽略带书面色彩，但在经文语体中自然庄重。
- source_word: κατὰ τὸ εἰωθὸς
  choice: 照常
  rationale: 简洁表达按惯例、依习惯而行的意思。
- source_word: περιεπάτει
  choice: 正……走动
  rationale: 未完成时表示当时持续进行的动作；“走动”也比单纯的“走”更能表现其在一带活动。
- source_word: ὁ εἷς τῶν πρεσβυτέρων
  choice: 长老中的一个
  rationale: 既保留“其中一个”的结构，也以“长老”表达这些人在群体中的身份，而不只强调年长。
- source_word: ἐλληλύθει
  choice: 已经来了
  rationale: 该动词为过去完成时，表示这位长老的来到先于随后另一人的到达。
- source_word: παρεγένετο
  choice: 也到了
  rationale: 清楚表达另一位长老随后到场；“也”顺应两人先后出现的叙事关系。
- source_word: ἀνέκρινε
  choice: 问
  rationale: 此处引出两人之间的直接问话；“问”自然准确，又不把语气过度强化为正式审讯。
- source_word: ὄρθρου
  choice: 这么早
  rationale: 该词指清晨或黎明时分；在直接问句中，“这么早”自然表达时间早及说话人的诧异。
- source_word: οὐ παραλαβὼν με
  choice: 却没有带上我
  rationale: 表达没有把说话人一同带去的意思；“带上我”符合现代汉语口吻。
