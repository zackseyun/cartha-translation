  language: zh_hans
  text: 你们回法庭去，因为这些人作伪证指控她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστρέψατε
  choice: 你们回到……去
  rationale: 该词是复数不定过去时命令式，要求众人返回先前的审判场合；“回到……去”符合现代汉语表达，并保留命令语气。
- source_word: κριτήριον
  choice: 法庭
  rationale: 此处指审判的场所或司法程序；“法庭”简洁清楚，准确呈现上下文中的司法场景。
- source_word: ψευδῆ
  choice: 伪证
  rationale: 该词与作证动词合用，表明证言虚假；译入“伪证”可自然凝练地表达其法律含义。
- source_word: κατεμαρτύρησαν
  choice: 作了伪证陷害
  rationale: 该动词表示作证指控某人，与ψευδῆ合用即指作虚假证言；“作了伪证陷害”兼顾虚假作证及证言针对她的不利方向。
- source_word: αὐτῆς
  choice: 她
  rationale: 属格与καταμαρτυρέω连用，标明遭到不利作证的人；汉语通过“陷害她”自然呈现“针对她”的法律敌对含义。
theological_decisions:
- issue: 虚假证言的司法措辞
  choice: 作了伪证陷害她
  alternative: 作假见证控告她；作了不利于她的虚假证言
  rationale: 原文兼具司法语境、证言虚假以及证言针对她三层含义。所选译法在现代汉语中自然有力，也保留诬告所含的法律与道德分量，而不额外引入教派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的司法用语。句式简洁，保留原文命令与理由之间“因为”的明确逻辑关系。
