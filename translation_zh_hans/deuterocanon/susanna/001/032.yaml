  yaml_path: translation/deuterocanon/susanna/001/032.yaml
  text: And the lawless men ordered her to be uncovered[a], so that they might satisfy their desire for her beauty.
translation:
  language: zh_hans
  text: 那些不法之人下令揭去她的遮盖[a]，好满足他们对她美貌的欲望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把她显露出来。”希腊文只表达揭开或除去遮盖，并未明确说明所除去的是面纱、衣物还是其他遮盖。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξαν
  choice: 下令
  rationale: 该动词表示以权威发出命令；“下令”简洁自然，并保留其强制意味。
- source_word: οἱ παράνομοι
  choice: 那些不法之人
  rationale: παράνομος兼有违法和道德悖逆的意味；“不法之人”保留这种法律与道德的双重谴责，又不把含义泛化为单纯的“恶人”。
- source_word: ἀποκαλύψαι αὐτήν
  choice: 揭去她的遮盖
  rationale: ἀποκαλύπτω基本义为揭开、除去遮盖。此处采用不明确具体遮盖物的表达，避免超出希腊文本断定是面纱、衣物或其他覆盖。
- source_word: ἵνα ἐμπλησθῶσιν
  choice: 好让自己尽情满足
  rationale: ἐμπίμπλημι在这里带有“充满、得以餍足”的意味；“尽情满足”以自然汉语传达其企图得到充分满足的语气。
- source_word: τοῦ κάλλους
  choice: 她美貌
  rationale: κάλλος指美丽、美貌；结合后面的αὐτῆς，译作“她美貌”直接而自然。
- source_word: ἐπιθυμίας αὐτῆς
  choice: 对她美貌的欲望
  rationale: ἐπιθυμία可指欲望、贪欲或情欲；上下文显明其淫邪性质，但正文用“欲望”保留该词本身的语义幅度，并把属格关系自然地表达为对她美貌的欲望。
theological_decisions:
- issue: οἱ παράνομοι的道德与法律定性
  choice: 那些不法之人
  alternative: 那些恶人；那些违法的人
  rationale: “不法”同时保存违反律法与道德悖逆的色彩，不把原文缩减为一般性的邪恶或仅限于法律违规。
- issue: ἐπιθυμία在语境中的强度
  choice: 欲望
  alternative: 淫欲；贪恋
  rationale: 语境清楚表明这是淫邪的欲念，但希腊词本身有较宽的语义范围；正文保留“欲望”，不以解释性较强的词替代原文张力。
- issue: ἀποκαλύψαι所指遮盖的具体程度
  choice: 揭去她的遮盖
  alternative: 揭开她的面纱；使她裸露
  rationale: 原文只说将她揭开或除去遮盖，未明确指定面纱，也未明说完全裸露，因此采用较克制的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那些不法之人”延续叙事中的谴责语气；“揭去她的遮盖”刻意保留原文在遮盖物及暴露程度上的含混；“尽情满足”传达“被充满、得到餍足”的形象，同时避免生硬直译。
