  yaml_path: translation/deuterocanon/susanna/001/020.yaml
  text: And they did as she said[a], and they shut the doors of the garden and went out by the side doors to bring what had been ordered for them, and they did not see the elders, because they were hidden.
translation:
  language: zh_hans
  text: 她们就照她所说的做了，关上花园[a]的门，从侧门出去，去取她们奉命要取的东西。她们没有看见那两位长老，因为他们正藏在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊语 παράδεισος 指有围界的花园或园苑，并非后世神学意义上的“乐园”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν καθὼς εἶπεν
  choice: 她们就照她所说的做了
  rationale: 按叙事语境直译其依照苏撒拿吩咐行事的意思；“就”自然承接前文行动。
- source_word: ἀπέκλεισαν τὰς θύρας τοῦ παραδείσου
  choice: 关上花园的门
  rationale: ἀποκλείω表示关上或封闭，并未明确说上锁；παράδεισος在此指有围界的花园，不取后世神学意义上的“乐园”。
- source_word: κατὰ τὰς πλαγίας θύρας
  choice: 从侧门出去
  rationale: κατά加宾格在此表示所经路径；πλάγιος指侧面的，中文用“侧门”简洁自然。
- source_word: ἐνέγκαι τὰ προστεταγμένα αὐταῖς
  choice: 把吩咐她们拿的东西带来
  rationale: 目的不定式ἐνέγκαι表明她们出去是为了带来先前受命取拿之物；此译保留受吩咐的被动含义，并使中文清楚。
- source_word: οὐκ εἴδοσαν τοὺς πρεσβυτέρους
  choice: 她们没有看见那两位长老
  rationale: εἴδοσαν按其基本义译为“看见”；πρεσβύτεροι在本故事中是有身份的长老。定冠词结合上下文所指的两人，译作“那两位长老”以符合现代汉语指称。
- source_word: ἦσαν κεκρυμμένοι
  choice: 他们藏了起来
  rationale: 完成时被动分词表达他们已处于隐蔽状态；中文“藏了起来”自然传达这一既成状态。
