  text: But he stood in their midst and said[a], “Are you such fools, sons of Israel? Without examining the matter or even learning the facts clearly[b], have you condemned a daughter of Israel?”
translation:
  language: zh_hans
  text: 但他站在他们中间，说：“以色列的儿子们啊，你们竟如此愚昧吗？未经审查，也没有查明事实，就给以色列的一个女儿定罪吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: 站
  rationale: 这是ἵστημι的不定过去时分词，表示他在发言前采取的具体动作；汉语用连动式“站……说”自然地保留其动作次序。
- source_word: ἐν μέσῳ αὐτῶν
  choice: 在他们中间
  rationale: 贴近希腊语空间表达，也保留他在众人当中公开斥责的场景感。
- source_word: Οὕτως μωροί
  choice: 你们竟这样愚昧吗
  rationale: 将省略系词、带强烈责问语气的表达译成自然的汉语反问；“愚昧”保留μωροί的严厉斥责，同时适合庄重叙事语体。
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: 以色列的众子
  rationale: 保留明确的阳性复数和盟约群体称谓，并与下文“以色列女儿”形成刻意的修辞对照；加“众”使现代汉语呼语更清楚。
- source_word: ἀνακρίναντες
  choice: 审查
  rationale: 该词具有司法调查、审讯或查验的色彩；“审查”简洁地传达他们本应先查明案件。
- source_word: τὸ σαφὲς ἐπιγνόντες
  choice: 弄清实情
  rationale: 兼顾σαφές所含的明确性与ἐπιγινώσκω所含的确知、查明之意；不把短语僵硬译成“知道那清楚的事”。
- source_word: κατεκρίνατε
  choice: 定了……的罪
  rationale: 准确体现司法性的“判罪、定罪”；用完成体“定了”突出判决已经作出。
- source_word: θυγατέρα Ἰσραήλ
  choice: 一个以色列女儿
  rationale: 保留无冠词单数的个体指向及“女儿”的性别称谓，并与“以色列的众子”相呼应。
theological_decisions:
- issue: 带性别的盟约群体称谓
  choice: 以色列的众子／一个以色列女儿
  alternative: 以色列人／一个以色列女子
  rationale: 原文有意以阳性复数“众子”对照阴性单数“女儿”。保留这一张力可显出责备的锋芒：以色列的男子竟未经查验便给本族的一位女儿定罪，而不将两处称谓中性化。
translation_notes:
  register: 采用现代、庄重而易懂的司法叙事语体。“审查—弄清实情—定罪”保留原文的审判语域；反问句维持但以理责备众人的强烈语气。无需脚注即可自然表达原文；译文未添加脚注标记。
