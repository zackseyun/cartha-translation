review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了但以理站在众人中间、严厉反问，以及“未查验／未查明—定罪”的司法性逻辑。可是“一个以色列女儿”不符合现代汉语的自然搭配；调整语序后可在不损失“女儿”这一性别明确称谓及其与“儿子们”对照的前提下，更忠实自然地表达原文。
  naturalness: “以色列的众子”和“一个以色列女儿”均略显生硬，尤其后者不合汉语常用定语语序。改为“以色列的儿子们啊”及“以色列的一个女儿”较自然，仍保持庄重的经文语体和直接呼语。
  terminology: “定罪”准确呈现κατακρίνω的司法判罪含义。“审查”可用于司法语境，但配合“查明事实”时，以“未经审查”表达分词性前提自然且不增添原文未明说的程序细节。保留“以色列的儿子们／以色列的一个女儿”，以维持原文阳性复数与阴性单数的修辞对照。
  issues:
