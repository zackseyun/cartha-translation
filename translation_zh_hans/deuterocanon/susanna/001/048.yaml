  to: 但他站在他们中间，说：“以色列的儿子们啊，你们竟如此愚昧吗？未经审查，也没有查明事实，就给以色列的一个女儿定罪吗？”
  rationale: 修订仅改善现代汉语的搭配和语序。“以色列的儿子们”与“以色列的一个女儿”继续对应原文οἱ υἱοὶ Ἰσραήλ与θυγατέρα Ἰσραήλ；“未经审查，也没有查明事实”保留两个并列的否定分词及其司法语气；“给……定罪”保留已作出的判罪行动。无需脚注。
