  yaml_path: translation/deuterocanon/susanna/001/063.yaml
  text: And Hilkiah and his wife praised their daughter[a], along with Joakim her husband and all their relatives, because no shameful deed was found in her.
translation:
  language: zh_hans
  text: 希勒家和他的妻子，连同他们女儿的丈夫约雅敬以及所有亲属，都因他们的女儿而献上赞美，因为在她身上没有发现可耻的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χελκίας
  choice: 希勒家
  rationale: 采用现代中文圣经中对希伯来人名希勒家的常见译名，对应希腊文Χελκίας。
- source_word: ᾔνεσαν
  choice: 赞美上帝
  rationale: 动词本身意为“赞美”，希腊文未明说宾语；上下文很可能以上帝为隐含对象。正文补出“上帝”以使现代中文自然，并以脚注说明原文的省略。
- source_word: περὶ τῆς θυγατρὸς αὐτῶν
  choice: 为他们的女儿
  rationale: περί加属格可表示“关于、为着”；这里译作“为他们的女儿”，自然表达因女儿获证清白而赞美，同时避免把女儿本身当作受赞美的对象。
- source_word: μετὰ Ἰωακεὶμ τοῦ ἀνδρὸς αὐτῆς
  choice: 连同女儿的丈夫约雅敬
  rationale: μετά表示陪同、共同参与；补明“女儿的”以避免中文代词指向含混。
- source_word: τῶν συγγενῶν πάντων
  choice: 所有亲属
  rationale: συγγενεῖς指亲属或族亲；“所有亲属”简洁、现代且不限定父系或母系。
- source_word: οὐχ εὑρέθη ἐν αὐτῇ
  choice: 在她身上没有发现
  rationale: 保留被动式“被发现”的司法查明意味，并较贴近ἐν αὐτῇ的字面结构。
- source_word: αἰσχρὸν πρᾶγμα
  choice: 可耻的事
  rationale: αἰσχρός表示可耻、羞辱，πρᾶγμα可指事情或行为；“可耻的事”兼顾道德与案情语境，且不把含义过度收窄为某一种具体行为。
theological_decisions:
- issue: ᾔνεσαν所省略的赞美对象
  choice: 正文译作“赞美上帝”，并加脚注说明“上帝”为按语境补出
  alternative: 只译“赞美”，或理解为“称赞他们的女儿”
  rationale: 希腊文仅写“赞美”，没有明示宾语，因此必须保留这一文本事实；但在本段敬虔叙事中，上帝最可能是隐含的受赞美者。正文补出可使中文语义完整，脚注则保留原文的真实含混，避免把补译误当成明文。
- issue: περὶ τῆς θυγατρὸς αὐτῶν与赞美的关系
  choice: 译作“为他们的女儿”
  alternative: “关于他们的女儿”或“称赞他们的女儿”
  rationale: περί加属格表达赞美所关涉的对象或缘由，不足以确定女儿就是直接受赞美者。“为”在中文中能表达因她获平反而向上帝赞美，同时不消除介词结构的弹性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“在她身上没有发现可耻的事”有意保留原文的司法和道德双重色彩。人名采用常见中文圣经形式“希勒家”“约雅敬”。
