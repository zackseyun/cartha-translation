  yaml_path: translation/deuterocanon/susanna/001/029.yaml
  text: And it happened on the next day[a], when the people had gathered to her husband Joakim, that the two elders came, full of their lawless intent against Susanna to put her to death, and they said before the people, “Send for Susanna daughter of Hilkiah, who is the wife of Joakim.”
translation:
  language: zh_hans
  text: 第二天，民众聚集到苏撒拿的丈夫约雅敬那里时，那两个长老来了，心中满怀针对苏撒拿的违法图谋[a]，要把她处死。他们当着民众的面说：“派人去把希勒家的女儿、约雅敬的妻子苏撒拿叫来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “违法图谋”也可译作“违背律法的意图”或“非法的谋算”。希腊文强调内心形成的意念或计划，并指出这计划违反律法。
    reason: 说明ἀνόμου ἐννοίας所含的内在谋划和违反律法的意味，并保留自然的汉语替代译法。
lexical_decisions:
- source_word: τῇ ἐπαύριον
  choice: 第二天
  rationale: 自然、简洁地交代叙事中的次日，避免文言化的“翌日”。
- source_word: συνῆλθεν ὁ λαὸς πρὸς τὸν ἄνδρα αὐτῆς Ἰωακείμ
  choice: 民众聚集到苏撒拿的丈夫约雅敬那里
  rationale: 保留 πρός 所表达的趋向或聚集地点；补出“苏撒拿”可避免汉语中“她”指代含混。
- source_word: οἱ δύο πρεσβῦται
  choice: 那两个长老
  rationale: 上下文显示二人具有群体和司法权威，因此译作“长老”，而不只译作“两个老人”。
- source_word: πλήρεις τῆς ἀνόμου ἐννοίας
  choice: 心里充满了……违法图谋
  rationale: ἐννοία 指内在的思想、意图或谋划，ἄνομος 强调其违反律法；“违法图谋”兼顾内在谋划与司法语境。
- source_word: κατὰ Σουσάννης
  choice: 敌对苏撒拿的
  rationale: κατά 加属格在此具有敌对意味，明确图谋所针对的人，同时不将其悄然并入后面的目的短语。
- source_word: τοῦ θανατῶσαι αὐτήν
  choice: 要把她处死
  rationale: 不定式表达目的；“处死”贴合本段公开控告和司法行动的语境。
- source_word: Ἀποστείλατε ἐπὶ Σουσάνναν
  choice: 派人去把……苏撒拿叫来
  rationale: 准确表达差人前去召来她的意思，比直译为“差遣到苏撒拿那里”更符合现代汉语。
- source_word: θυγατέρα Χελκίου
  choice: 希勒家的女儿
  rationale: 采用现代汉语圣经人名“希勒家”，并保留父系身份说明。
- source_word: ἥ ἐστιν γυνὴ Ἰωακείμ
  choice: 约雅敬的妻子
  rationale: γυνή 在此明确指妻子；将身份短语置于姓名之前，使公开传召的措辞在汉语中自然而庄重。
theological_decisions:
- issue: πρεσβῦται 在司法叙事中的身份含义
  choice: 长老
  alternative: 老人
  rationale: 叙事中的二人是得到承认、能在民众面前采取司法行动的权威人物；“长老”保留其社会和司法职分，同时没有添加宗派性含义。
- issue: ἀνόμου ἐννοίας 的道德与法律色彩
  choice: 违法图谋
  alternative: 邪恶念头
  rationale: “违法”保留 ἄνομος 的律法维度，“图谋”表达 ἐννοία 的蓄意性质；脚注同时说明可作较宽泛的道德性理解，以保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名使用常见的简体中文圣经译名“苏撒拿、约雅敬、希勒家”。将较长的希腊语主句拆成三个汉语句子，以保持清晰度，同时保留“敌对苏撒拿”与“要把她处死”之间的区别。脚注标记置于其实际解释的“违法图谋”之后。
