base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/054.yaml
  text: 'Now then[a], if you saw this woman, tell us: under what tree did you see them talking with each other? And he said, “Under a mastic tree.”'
translation:
  language: zh_hans
  text: 那么现在，若你确实看见了这女人，就说：你是在什么树下看见他们彼此交谈的？”他回答说：“在乳香黄连木下。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语“σχῖνος”指乳香黄连木（mastic或lentisk tree）；这个具体树名与下文的希腊语双关有关。
    reason: 说明较生僻的具体树种名称，并提示其在相邻叙事中的文字关联，避免以可能混淆的异名替代。
lexical_decisions:
- source_word: νῦν οὖν
  choice: 于是
  rationale: 表示承接前文并推进质问；“于是”在现代汉语叙事中自然，也保留推论性的转折推进。
- source_word: ταύτην
  choice: 她
  rationale: 原文直译为“这一位”，语境明确指苏撒拿；汉语用“她”自然且不增添信息。
- source_word: εἴπερ εἶδες
  choice: 既然你看见了
  rationale: εἴπερ可表示带强调的条件或对所声称事实的挑战。这里按质询语境译为“既然”，使盘问的反诘压力清楚，同时不表示叙述者认可证词为真。
- source_word: εἰπὸν
  choice: 就说吧
  rationale: 保留第二人称单数命令语气；不补出原文没有的“告诉我们”。
- source_word: Ὑπὸ τί δένδρον
  choice: 在什么树下
  rationale: 直接、自然地表达方位疑问。
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: 彼此交谈
  rationale: ὁμιλέω表示交谈或相互往来，ἀλλήλοις明确表达相互关系；“彼此交谈”简洁而庄重。
- source_word: σχῖνον
  choice: 乳香黄连木
  rationale: σχῖνος指Pistacia lentiscus，即mastic/lentisk tree；“乳香黄连木”是较准确的现代汉语植物名称，也保留后文双关所需的具体树种。
