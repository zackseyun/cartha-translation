  yaml_path: translation/deuterocanon/susanna/001/040.yaml
  text: After seizing her[a], we questioned her, ‘Who was the man?’ But she did not tell us who he was. These things we testify.
translation:
  language: zh_hans
  text: 我们抓住她后，就问她：“那个男人是谁？”她却没有告诉我们他是谁。我们为这些事作证。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些事就是我们所作的见证。”
    reason: 原文末句可译成较贴近汉语名词表达的证词表述，但正文保留μαρτυροῦμεν的动词形式和司法语气。
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: 抓住她后
  rationale: 该词为ἐπιλαμβάνομαι的不定过去时中动分词，在此表示实际抓住、控制住她；“抓住”既保留动作力度，也符合现代汉语叙事。
- source_word: ἐπηρώτωμεν
  choice: 就问她
  rationale: 未完成过去时表示当时进行的询问；“问”准确而自然，又不像“审讯”或“盘问”那样额外强化正式强制意味。
- source_word: Τίς ὁ ἄνθρωπος;
  choice: 那个男人是谁？
  rationale: ὁ ἄνθρωπος在语境中指控方所说与她在一起的特定男子；“那个男人”自然体现定冠词的指称作用。
- source_word: οὐκ ἀπήγγειλεν ἡμῖν
  choice: 她却没有告诉我们
  rationale: ἀπαγγέλλω在此指把身份说出来；“告诉”保持原意，且比“报告”更符合直接问答的语境。δέ所带的转折由“却”表达。
- source_word: τίς ἦν
  choice: 他是谁
  rationale: 此处询问的是男子的身份，而非其品格或类别；汉语用“他是谁”清楚自然。
- source_word: ταῦτα μαρτυροῦμεν
  choice: 我们为这些事作证
  rationale: μαρτυρέω具有法庭作证的色彩；译文保留“作证”，并以“为这些事”明确其见证内容。
theological_decisions:
- issue: 长老指控中的司法见证语体
  choice: 末句明确译作“我们为这些事作证”
  alternative: 译作较流畅但法律色彩较弱的“这就是我们的证词”
  rationale: 本节属于司法指控场景；保留动词性的“作证”，可显出说话者正在以证人身份提出指控，同时不替叙事判断其证词真伪。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。直接引语保持简洁；末句略带法庭语体，以符合长老作证控告的场景。
