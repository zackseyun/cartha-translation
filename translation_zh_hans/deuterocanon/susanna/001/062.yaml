  text: to the neighbor[a], to do according to the law of Moses; and they put them to death. And innocent blood was spared on that day.
translation:
  language: zh_hans
  text: 把他们企图加在邻舍身上的事，照摩西的律法加在他们身上；众人便把他们处死。那一天，无辜人的血得以保全。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ πλησίον
  choice: 对邻舍
  rationale: 与上一节的句法相连，指那两名长老企图加害的同胞。译作“对邻舍”既贴近希腊语与格结构，也保留本节开头承接上文的不完整感。
- source_word: ποιῆσαι κατὰ τὸν νόμον Μωϋσῆ
  choice: 照摩西的律法行
  rationale: 保留“行”和法律准则之间的直接关系；“照……律法”是自然、庄重的现代汉语法律表达。
- source_word: ἀπέκτειναν αὐτούς
  choice: 众人便把他们处死
  rationale: αὐτούς指上下文中的两名长老；ἀπέκτειναν在司法语境中译作“处死”，比“杀死”更能体现依法判决的背景，又不额外限定具体刑罚方式。希腊语省略的主语依上下文补为“众人”，使汉语句子清楚。
- source_word: ἐσώθη αἷμα ἀναίτιον
  choice: 无辜人的血得以保全
  rationale: “无辜人的血”保留圣经中关于无罪者遭流血的凝练表达；“得以保全”传达不义流血被阻止，而非把“血”理解为字面上获救。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: 在那一天
  rationale: 准确对应标准时间短语，并符合现代汉语叙事表达。
theological_decisions:
- issue: 司法语境中ἀπέκτειναν的力度
  choice: 把他们处死
  alternative: 杀死他们
  rationale: 上下文明确涉及依摩西律法作出的判决。“处死”体现司法性质，但不像“执行死刑”那样引入更现代、更技术化的措辞。
- issue: ἐσώθη αἷμα ἀναίτιον的圣经性意象
  choice: 无辜人的血得以保全
  alternative: 无辜人的性命得救了
  rationale: 保留“无辜人的血”这一重要的圣经意象及其对不义流血的道德谴责，同时用“得以保全”使汉语读者明白这里指无辜流血受到制止。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。本节希腊文开头本是上一节句子的延续，正文刻意保留其承接性，并以脚注说明完整句意；“邻舍”“摩西的律法”“无辜人的血”等表达保留经文语域，但避免古奥措辞。
