  yaml_path: translation/deuterocanon/susanna/001/035.yaml
  text: But she, weeping, looked up to heaven, because her heart had trusted in the Lord.
translation:
  language: zh_hans
  text: 她却流着泪，抬头望向天上，因为她的心信靠主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίουσα
  choice: 流着泪
  rationale: 现在分词描写她当时持续的状态；“流着泪”自然简洁，也保留与主要动作同时发生的意味。
- source_word: ἀνέβλεψεν
  choice: 抬头望
  rationale: 该动词与“向天”连用，表示向上观看；“抬头望天”符合现代汉语习惯。
- source_word: οὐρανόν
  choice: 天
  rationale: 在祈祷与信靠主的语境中指向上天；汉语“望天”自然，并能保留宗教语境，不必窄化为物理性的“天空”。
- source_word: καρδία
  choice: 心
  rationale: 指人的内在生命、意志与信靠，译作“心”准确而自然。
- source_word: πεποιθυῖα
  choice: 信靠
  rationale: 完成时分词表达由先前信赖形成并持续的稳固状态；汉语“信靠”本身可表达持续而坚定的倚赖，避免生硬地标示时态。
- source_word: ἐπὶ Κυρίῳ
  choice: 信靠主
  rationale: ἐπί与该完成时分词表示信赖所依靠的对象；现代汉语以“信靠主”最自然。
theological_decisions:
- issue: 在次经希腊叙事的宗教信靠语境中如何翻译 Κυρίῳ
  choice: 主
  alternative: 上主；耶和华
  rationale: 直接依据现存希腊文本译 κύριος 为“主”；上下文没有出现可据以明确还原的希伯来神名，因此不译作“耶和华”，也不额外引入宗派性称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“她却流着泪，抬头望天”保持希腊语的转折、伴随状态和动作顺序；“因为她的心信靠主”保留因果关系及内在信靠的持续状态。无脚注。
