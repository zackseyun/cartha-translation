  text: And as she was being led away to be put to death, God stirred up the holy spirit of a younger boy whose name was Daniel.
translation:
  language: zh_hans
  text: 她正被带去处死的时候，上帝激发了一个较年轻的少年的圣灵；这少年名叫但以理。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαγομένης αὐτῆς ἀπολέσθαι
  choice: 她正被带去处死的时候
  rationale: 保留被动进行的场景，并将目的不定式ἀπολέσθαι自然译为“处死”。
- source_word: ἐξήγειρεν
  choice: 激发了
  rationale: 表达上帝使其内在的灵兴起、行动之意，同时避免把动作过度具体化为“唤醒”。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 心中的圣灵
  rationale: “圣灵”直接对应带定冠词的希腊语短语；补出“心中的”使“激发……圣灵”的汉语关系清楚，但不判定这里是在指圣灵的位格，还是受神感动的圣洁之灵。
- source_word: παιδαρίου νεωτέρου
  choice: 一个较年轻的少年
  rationale: παιδάριον指少年；比较级νεώτερος保留为“较年轻”，不简化成普通的“年轻”。
- source_word: ᾧ ὄνομα Δανιήλ
  choice: 他名叫但以理
  rationale: 采用自然、庄重的现代汉语表达。
theological_decisions:
- issue: τὸ πνεῦμα τὸ ἅγιον的所指
  choice: 译作“圣灵”，并以“心中的”呈现其与但以理的关系
  alternative: 译作“圣洁的灵”或“圣洁心灵”
  rationale: 原文可被理解为上帝的圣灵，也可按叙事表达理解为少年里面受神激发的圣洁之灵。正文保留传统而直接的词汇，不在翻译中进一步界定其位格含义。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语体；保留“较年轻”这一比较意味，并用分号清楚衔接但以理的姓名说明。
