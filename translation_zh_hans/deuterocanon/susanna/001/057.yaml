  yaml_path: translation/deuterocanon/susanna/001/057.yaml
  text: This is how you acted toward the daughters of Israel[a], and they, out of fear, associated with you; but a daughter of Judah did not endure your lawlessness.
translation:
  language: zh_hans
  text: 你们向来就是这样对待以色列的女子；她们因为害怕，便同你们来往[a]。但犹大的一个女子却没有忍受你们的不法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“同你们交往”。希腊文说那些女子因害怕而同这些长老来往；胁迫的语境表明这里不只是普通社交，但原文用词并未像直接表示性行为的动词那样明确。
    reason: 说明词义范围及胁迫语境，同时保留原文的含蓄性。
lexical_decisions:
- source_word: οὕτως ἐποιεῖτε
  choice: 你们向来就是这样对待
  rationale: 未完成时表示以往反复或惯常的行为；“向来”体现这一持续、重复意味，“这样对待”自然承接受事者。
- source_word: θυγατράσιν Ἰσραήλ
  choice: 以色列的女子
  rationale: 既保留“以色列之女”的群体身份含义，也采用现代汉语较自然的表达，并与后文“犹大的一个女子”形成修辞对照。
- source_word: φοβούμεναι
  choice: 因为害怕
  rationale: 分词在此说明随后行为的原因；因果表达清楚呈现她们是在恐惧驱使下行事。
- source_word: ὡμίλουν ὑμῖν
  choice: 同你们来往
  rationale: ὁμιλέω可指交往、来往。上下文带有胁迫和性侵害意味，但该动词本身没有直接明说性行为，因此正文保留含蓄和歧义。
- source_word: ἀλλ᾽ οὐ θυγάτηρ Ἰούδα
  choice: 但犹大的一个女子没有
  rationale: 保留希腊文的单数和不定表达，使苏撒拿作为犹大女子中的一人出现，不扩大为“犹大的女子都没有”。
- source_word: ὑπέμεινεν
  choice: 忍受
  rationale: 保留ὑπομένω“承受、忍耐、留在其下”的基本语义；在语境中也自然含有她拒绝屈从之意。
- source_word: τὴν ἀνομίαν ὑμῶν
  choice: 你们的不法行为
  rationale: “不法”保留ἀνομία兼具法律与道德的分量，“行为”使现代汉语表达完整，同时不把罪行窄化为单一类别。
theological_decisions:
- issue: “犹大的女子”的代表性单数
  choice: 犹大的一个女子
  alternative: 没有一个犹大的女子；犹大的众女子
  rationale: 希腊文使用单数，正文据此保留苏撒拿作为一名犹大女子的表达，并维持与复数“以色列的女子”之间的修辞张力。
- issue: ἀνομία的法律与道德含义
  choice: 不法行为
  alternative: 邪恶；不义；违法之事
  rationale: “不法行为”同时保留对律法的违背和道德上的恶，不将含义仅限于司法不公或一般邪恶。
- issue: 受恐惧支配的“来往”是否明说性关系
  choice: 正文采用“同你们来往”，脚注说明胁迫语境
  alternative: 顺从你们；与你们发生关系
  rationale: 上下文强烈暗示长老借恐惧逼迫女子，但ὡμίλουν本身比直接表示性行为的词含蓄；译文不把语境暗示升级为词面明说。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“向来”体现未完成时所含的惯常行为；分号和句号呈现指控中的对照。“来往”有意保留原文在一般交往与语境所暗示之受胁迫关系之间的张力。
