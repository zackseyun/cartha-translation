  text: And when we came near, we saw her; but the young man fled, being covered.
translation:
  language: zh_hans
  text: 我们走近时，认出了她；那个年轻男子却在被遮掩的状态下逃走了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在被遮掩的状态下”直译为“被遮盖着”；原文没有说明遮盖的是脸、身体还是别的部位。
    reason: 保留συγκεκαλυμμένος的被动语态及其所指部位未明的歧义，不在正文中具体化为“蒙着脸”。
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: 认出了
  rationale: ἐπιγινώσκω在这里不只是一般性的“看见”，而是走近之后辨认出女子身份；译作“认出了”较准确，也符合证人陈述的语境。
- source_word: νεανίσκος
  choice: 年轻人
  rationale: 指年轻男子；现代汉语用“年轻人”自然简明，语境已足以表明其为男性。
- source_word: συγκεκαλυμμένος
  choice: 蒙着脸
  rationale: 该完成时被动分词字面表示“被遮盖着、蒙着”；在逃逸及身份辨认的语境中，汉语译作“蒙着脸”最自然，但原文未明说所遮盖的具体部位，因此加脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的证词叙述语体。“却”呈现ὁ δέ的转折；将分词顺译为“蒙着脸逃走了”，符合现代汉语表达。
