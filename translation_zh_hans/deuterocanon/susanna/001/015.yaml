  language: zh_hans
  text: 他们出去以后[a]，便彼此分开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们出去时，就彼此分开了。”希腊语分词可表达略有不同的时间关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: 出去以后
  rationale: 这是ἐξέρχομαι的简单过去时分词，通常表示动作先于主句动作发生；译作“出去以后”自然清楚地呈现先后关系。
- source_word: διεχωρίσθησαν
  choice: 分开了
  rationale: 此处虽为被动／中动形态，但按语境作不及物或相互意义理解，表示两人各自离开、彼此分开；“分开了”符合现代汉语叙事习惯。
- source_word: ἀπ᾿ ἀλλήλων
  choice: 彼此
  rationale: 这是相互代词结构，说明分开是双方相对于对方而言；“彼此”简洁而准确。
