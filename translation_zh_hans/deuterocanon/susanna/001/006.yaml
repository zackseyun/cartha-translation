  text: and legal cases came to them from other cities[a].
translation:
  language: zh_hans
  text: 也不断有来自别的城的案件送到他们那里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不断有来自别的城的判决送到他们那里。”希腊语“κρίσεις”既可指判决，也可指交付审理的案件；这里按司法语境译作“案件”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο
  choice: 不断有……送到
  rationale: 该未完成过去时表示过去持续或反复发生的情形；结合案件交由人审理的语境，用“不断有……送到”既保留延续性，也符合现代汉语表达。
- source_word: κρίσεις
  choice: 案件
  rationale: 此处指从别城交来、由这些长老审理的司法事项。“案件”能清楚表达司法语境，同时避免把词义局限为已经作出的判决。
- source_word: ἐξ ἄλλων πόλεων
  choice: 别的城
  rationale: 忠实表达来源；现代汉语中“别的城”自然简洁。
- source_word: πρὸς αὐτούς
  choice: 到他们那里
  rationale: 保留πρός加宾格所表达的趋向，说明案件被送交这些人；不额外明说原文未明言的审判程序。
