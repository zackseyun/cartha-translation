base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/010.yaml
  text: And both of them were inflamed with desire for her[a], and neither one disclosed to the other the wicked passion that held them concerning her[b], nor did the woman know this matter.
translation:
  language: zh_hans
  text: 两人都因她而欲念炽盛[a]；谁也没有向对方吐露那因她而起、缠住他们的邪恶欲念[b]；那女人也不知道这件事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“因她被刺痛”；这里是指他们因她而陷入强烈的情欲。
    reason: lexical_alternative
  - marker: b
    text: 或译“那缠住他们、与她有关的恶事”。原文将这邪恶的欲念描写为缠住或控制他们的力量。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμφότεροι
  choice: 两人都
  rationale: 明确承接上文所说的两位长老，简洁保留二者并举的含义。
- source_word: κατανενυγμένοι
  choice: 心神刺痛，欲火中烧
  rationale: 该完成时被动分词本义有“被刺、被扎”之意，此处语境指对她产生强烈情欲；正文兼顾原有刺痛意象和现代汉语的可理解性。
- source_word: περὶ αὐτῆς
  choice: 为她
  rationale: 在表达情感迷恋的结构中，“为她”自然地表明这种状态以她为对象。
- source_word: ἕτερος τῷ ἑτέρῳ οὐ προσεποιεῖτο
  choice: 谁也没有向对方透露
  rationale: 按否定结构自然表达“一个不向另一个表明”；προσποιέομαι在此语境中取表明、吐露之义。
- source_word: τὸ κακὸν
  choice: 恶念
  rationale: 既保留κακόν的道德判断，也结合上下文指出这是内心邪恶的欲念，而不笼统译作“恶”。
- source_word: τὸ ἔχον αὐτοὺς
  choice: 那缠住他们
  rationale: 保留该恶念控制、攫住二人的拟人化力量，同时符合现代汉语表达。
- source_word: περὶ αὐτῆς
  choice: 针对她的
  rationale: 此处修饰恶念，说明恶念以她为对象；“针对她”也保留原文较宽泛的关联表达。
- source_word: ἡ γυνή
  choice: 那女人
  rationale: 依原文的外部叙述视角译为“那女人”，指苏撒拿，不擅自改作姓名或“妻子”。
- source_word: ἔγνω
  choice: 知道
  rationale: 自然对应简单的认知动词，表达她对此事毫不知情。
- source_word: τὸ πρᾶγμα τοῦτο
  choice: 这件事
  rationale: 保持措辞宽泛，不提前具体化为阴谋或计划。
theological_decisions:
- issue: 如何呈现两位长老隐秘欲念的道德性质
  choice: 将τὸ κακὸν译为“恶念”
  alternative: “那恶事”或“邪恶的欲望”
  rationale: 原文本身把支配二人的内在欲念判定为恶；“恶念”清楚而不额外引入某种罪论体系。
- issue: κατανενυγμένοι在情欲语境中的形象与含义
  choice: 译作“心神刺痛，欲火中烧”
  alternative: “为她所刺透”或“深深迷恋她”
  rationale: 单译“刺透”在现代汉语中含义晦涩，单译“欲火中烧”又会丢失原词的刺痛形象；并列表达兼顾形式与语境意义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号呈现原句三层递进：二人的情欲、彼此隐瞒、女子不知情。脚注标记[a]、[b]均已置于正文相应位置。
