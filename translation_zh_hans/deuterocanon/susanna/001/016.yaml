base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/016.yaml
  text: And after turning back[a], they came to the same place, and when they questioned one another about the reason, they confessed their desire[b]; then together they arranged a time when they would be able to find her alone.
translation:
  language: zh_hans
  text: 他们折返后，来到同一处[a]；彼此追问缘由时，就承认了他们的欲望[b]。于是，他们一同定下一个时机，以便能找到独自一人的她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们聚到一起”；希腊语此短语有时着重表示聚集在一起，而不一定明确指回到同一个地点。
    reason: lexical_alternative
  - marker: b
    text: 这里的“欲望”在上下文中指不正当的性欲；也可更明确地译作“淫欲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακάμψαντες
  choice: 转身回来
  rationale: 该分词表示转身折返或回来；译文保留动作的转折及与后续事件的先后关系。
- source_word: ἐπὶ τὸ αὐτό
  choice: 到了同一个地方
  rationale: 在此叙事语境中，最自然地指二人折返后到了同一地点；这一表达也可能着重二人聚到一起，故加注说明。
- source_word: ἀνετάζοντες ἀλλήλους
  choice: 彼此追问
  rationale: 动词可指查问、盘问；这里是二人互相探究折返的缘由，“彼此追问”既自然，又保留较普通“询问”更强的语气。
- source_word: τὴν αἰτίαν
  choice: 缘由
  rationale: 指他们行为背后的原因；“缘由”简洁、自然，并与“追问”搭配得当。
- source_word: ὡμολόγησαν
  choice: 承认了
  rationale: 表示公开承认或坦白；“承认”保留其披露事实的含义，又不额外加入宗教性认罪色彩。
- source_word: τὴν ἐπιθυμίαν αὐτῶν
  choice: 各自的欲望
  rationale: ἐπιθυμία本身可泛指欲望，但本段语境明确带有不正当的性意味；正文保留较宽的词义，脚注说明其语境含义。“各自”对应复数所有格所指的二人。
- source_word: κοινῇ
  choice: 一同
  rationale: 强调二人共同采取行动，也传达他们合谋的意味。
- source_word: συνετάξαντο
  choice: 约定了
  rationale: 中间语态动词表示二人为自己共同安排、议定某事；与时间搭配时，“约定”比“安排”更符合现代汉语。
- source_word: καιρόν
  choice: 一个时机
  rationale: καιρός既可指时间，也可指合适的机会；这里二人筹划趁她独处，译作“时机”能自然保留机会性的含义。
- source_word: ὅτε αὐτὴν δυνήσονται εὑρεῖν μόνην
  choice: 好能找到她独自一人的时候
  rationale: 保留δύναμαι所表达的能力或可能条件，并以自然汉语呈现“找到她处于独自状态”的意思。
