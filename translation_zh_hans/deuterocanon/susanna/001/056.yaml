  yaml_path: translation/deuterocanon/susanna/001/056.yaml
  text: And after removing him[a], he ordered the other one to be brought forward. And he said to him, “Offspring of Canaan and not Judah, beauty has deceived you[b], and desire has corrupted your heart.”
translation:
  language: zh_hans
  text: 他把那人带开后，吩咐把另一个带到面前来，便对他说：“迦南的后裔，并非犹大的后裔！美貌欺骗了你，欲望扭曲了你的心。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扭曲了你的心”也可译作“败坏了你的心”。
    reason: 保留διαστρέφω“使扭曲、使偏邪”的形象，同时注明合乎道德语境的自然译法。
lexical_decisions:
- source_word: μεταστήσας
  choice: 把那人带开后
  rationale: 此处指把先受审的长老移开，使他与另一人分开；“带开”自然地保留了审讯程序中的隔离意味，又不增添具体地点。
- source_word: ἐκέλευσεν προσαγαγεῖν τὸν ἕτερον
  choice: 吩咐把另一个带上来
  rationale: 准确表达命令他人将两人中的另一位带到审讯者面前；“带上来”符合现代汉语的审讯场景。
- source_word: Σπέρμα Χανάαν καὶ οὐκ Ἰούδα
  choice: 迦南的后裔，并非犹大的后裔
  rationale: σπέρμα在这里是谱系性的斥责。“后裔”比直译“种子”自然，同时保留迦南与犹大之间尖锐的身份对照；后半补出“后裔”是汉语所需的省略复现。
- source_word: τὸ κάλλος ἐξηπάτησέν σε
  choice: 美色欺骗了你
  rationale: κάλλος指外在美貌，在此具有性诱惑的语境；“美色”简洁自然。ἐξαπατάω译作“欺骗”保留其使人受蒙蔽的含义。
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 该词本义范围比“淫欲”更广，虽在上下文中明确为不正当的性欲，正文仍以“欲望”保留原词的宽度。
- source_word: διέστρεψεν τὴν καρδίαν σου
  choice: 败坏了你的心
  rationale: διαστρέφω表示扭曲、使偏邪；在道德语境中“败坏了你的心”既自然又传达内在腐化，同时脚注保留更具形象性的译法。
theological_decisions:
- issue: “迦南的后裔，并非犹大的后裔”的谱系性斥责
  choice: 按谱系语言直译，保留迦南与犹大的对照
  alternative: 你行事像迦南人，不像犹大人
  rationale: 原文直接使用“后裔／种子”的身份语言，而非仅评论行为；保留这一表达可呈现其修辞与盟约历史背景，不将其化约为一般性的道德评语。
- issue: ἐπιθυμία的道德语气
  choice: 正文译作“欲望”
  alternative: 淫欲
  rationale: 上下文已清楚表明这是邪恶的性欲，但希腊词本身可以泛指欲望；采用较宽的词可避免把语义范围缩窄，同时不削弱本句的谴责。
- issue: διαστρέφω的形象与道德含义
  choice: 正文译作“败坏”并以脚注注明“扭曲”
  alternative: 扭曲了你的心
  rationale: “败坏”在现代汉语中更自然地表达此处的道德腐化；脚注则保存原动词“使扭曲”的形象，使两层含义都可见。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与审讯用语。“迦南的后裔，并非犹大的后裔”刻意保留原文突兀而尖锐的谱系斥责；不改写为单纯的行为类比。
