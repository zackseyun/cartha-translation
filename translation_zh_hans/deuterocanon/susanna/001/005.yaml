base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/005.yaml
  text: 'And in that year two elders from the people were appointed as judges[a], concerning whom the Master had spoken: “Lawlessness came out from Babylon, from elders who were judges[b], who seemed to govern the people.”'
translation:
  language: zh_hans
  text: 那一年，民中有两位长老被任命为审判官。主宰曾论到他们说：“不法之事出自巴比伦，出自那些担任审判官、看似在治理百姓的长老[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看似在治理百姓”也可译作“被认为在治理百姓”。本节末尾的希腊文句式较为紧凑。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεδείχθησαν
  choice: 被任命为
  rationale: 与表语“审判官”连用时，指被指定或任命担任公职，而非仅仅“被显明”。
- source_word: πρεσβύτεροι
  choice: 长老
  rationale: 上下文涉及民间领袖和司法职务，所指更可能是群体中的长老，而不只是年长男子。
- source_word: κριταὶ
  choice: 审判官
  rationale: 明确表达其司法职能，也与现代汉语中泛指评判者的“法官”有所区别。
- source_word: δεσπότης
  choice: 主宰
  rationale: 保留该词所含的权柄和统治意味，并与常译为“主”的 κύριος 保持词汇区别；此处所指为神。
- source_word: ἀνομία
  choice: 不法之事
  rationale: 贴近“不守律法、违背法度”的基本意义，也适合本节司法腐败的语境。
- source_word: ἐξῆλθεν
  choice: 出来
  rationale: 保留恶事从巴比伦发出的空间意象，在汉语中也自然。
- source_word: ἐκ Βαβυλῶνος
  choice: 从巴比伦
  rationale: 按介词和地名作直接、标准的翻译。
- source_word: οἱ ἐδόκουν κυβερνᾷν τὸν λαόν
  choice: 他们看似在治理百姓
  rationale: “看似”保留 ἐδόκουν 可表示表象与实情有距离的意味，同时不排除“被认为”的理解。
theological_decisions:
- issue: 神圣称谓 δεσπότης 的译法
  choice: 主宰
  alternative: 主；主人
  rationale: 原文用 δεσπότης 而非较常见的 κύριος。“主宰”既可自然指神，也保留绝对权柄的语义差别，不将两个希腊称谓一律译成“主”。
- issue: ἐδόκουν 所表达的评价角度
  choice: 看似在治理百姓
  alternative: 被认为在治理百姓
  rationale: 主动意义“看似”更能呈现对这些腐败长老的反讽距离，但希腊语也可指公众对他们的看法，因此以脚注保留另一理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“审判官”凸显公职身份；引语中重复“出来”以保存原文“从巴比伦……从长老”的来源链条。“主宰”用于保留 δεσπότης 与 κύριος 的区别。
