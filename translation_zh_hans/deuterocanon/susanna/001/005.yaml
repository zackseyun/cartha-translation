revisions:
- from: 那一年，民中有两位长老被任命为审判官。主宰曾论到他们说：“不法之事从巴比伦出来，是从作审判官的长老中出来的；他们看似在治理百姓。”[a]
  to: 那一年，民中有两位长老被任命为审判官。主宰曾论到他们说：“不法之事出自巴比伦，出自那些担任审判官、看似在治理百姓的长老[a]。”
