base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/023.yaml
  text: But if not[a], we will testify against you that a young man was with you[b], and for this reason you sent the servant girls away from you.
translation:
  language: zh_hans
  text: 不然，我们就会指证你，说有一个年轻男子和你在一起；正因如此，你把侍女们从你身边遣走了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: 不然
  rationale: 承接上一节隐含的要求，简洁保留威胁中突兀而强迫的条件语气；较“但如果不”更符合现代汉语。
- source_word: καταμαρτυρήσομέν σου
  choice: 我们就要作证指控你
  rationale: 该复合动词具有敌对、司法性的作证含义。“作证指控”既保留法庭语域，也避免仅译作“控告”而丢失见证这一语义成分。
- source_word: ὅτι ἦν μετὰ σοῦ νεανίσκος
  choice: 说有一个年轻男子和你在一起
  rationale: “年轻男子”自然对应 νεανίσκος；“说”引出他们将要提供的虚假证词内容。
- source_word: διὰ τοῦτο
  choice: 正因如此
  rationale: 明确保留原文的因果联系，并体现捏造指控中的推论：所谓年轻男子在场，便是她遣开侍女的原因。
- source_word: ἐξαπέστειλας
  choice: 支开
  rationale: 在此语境中指有意让随侍者离开；“支开”比一般的“派走”更自然地表达使人离开现场，同时仍保留动作的主动性。
- source_word: τὰ κοράσια
  choice: 侍女们
  rationale: 该词本可指“女孩们”，但上下文表明她们是陪侍苏撒拿的女性随从；“侍女们”以自然现代汉语交代其语境身份。
- source_word: ἀπὸ σοῦ
  choice: 从身边
  rationale: 与“支开”搭配，清楚表达这些侍女被遣离她身边；主语已经明确，汉语无需重复“你”。
theological_decisions:
- issue: 长老言语的性质
  choice: 译为带有司法色彩的虚假作证威胁，不加弱化
  alternative: 笼统译作“我们就控告你”
  rationale: καταμαρτυρέω 表明针对某人作不利见证，叙事背景又具有审判性质；保留“作证”有助于呈现他们滥用证词构陷苏撒拿的道德与叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“作证指控”保持司法语气；“支开侍女们”符合当代汉语，也清楚呈现长老们捏造的因果链。原文没有需要以脚注保存的实质歧义，因此不加脚注。
