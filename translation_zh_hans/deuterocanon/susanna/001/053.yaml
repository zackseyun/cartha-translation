  text: formerly[a], while you were rendering unjust judgments and condemning the innocent, but releasing the guilty, though the Lord says[b], ‘You shall not put to death the innocent and righteous.’
translation:
  language: zh_hans
  text: 从前[a]，你作出不公正的判决，定无辜者有罪，却释放有罪者，尽管主说[b]：“不可处死无辜而公义的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“审判不公正的判决”；希腊语用同源词重复，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: 末尾的引语呼应希腊文传统中《出埃及记》23:7的法律用语：“不可处死无辜而公义的人。”
    reason: cross_reference
lexical_decisions:
- source_word: πρότερον
  choice: 从前
  rationale: 表示这位长老以往的行为；“从前”简洁自然，并保留回顾意味。
- source_word: κρίνων κρίσεις ἀδίκους
  choice: 你断了不公正的案
  rationale: 按司法语境译出“审断案件”的含义；汉语不机械重复同源词，以免形成不自然的“审判不公的审判”，其希腊语强调形式在脚注中说明。
- source_word: τοὺς μὲν ἀθῴους κατακρίνων
  choice: 定无辜的人有罪
  rationale: 明确呈现法庭语境中将无罪者判为有罪的行为，也与下文释放有罪者形成鲜明对照。
- source_word: ἀπολύων δὲ τοὺς αἰτίους
  choice: 却释放有罪的人
  rationale: ἀπολύω可指释放或宣告无罪；采用较宽泛的“释放”，避免把正式无罪判决说得过实，αἴτιος则按语境译为“有罪”。
- source_word: λέγοντος τοῦ κυρίου
  choice: 尽管主说过
  rationale: 属格独立结构在此引出与长老行为相冲突的神圣命令；“尽管”自然表达语境中的让步、反衬关系。
- source_word: Ἀθῷον καὶ δίκαιον
  choice: 无辜和公义的人
  rationale: 分别保留ἀθῷον与δίκαιον的法律及道德含义，不将两者合并为单一概念。
- source_word: οὐκ ἀποκτενεῖς
  choice: 不可处死
  rationale: 在司法语境中，ἀποκτείνω所指是将人置于死地；“处死”比泛称“杀害”更贴合法律命令。
theological_decisions:
- issue: 经文引语中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 希腊文本写作κύριος；直接按希腊来源译为“主”，不反向补入原文未明写的神名。
- issue: λέγοντος τοῦ κυρίου的语义关系
  choice: 尽管主说过
  alternative: 正如主所说
  rationale: 上下文重在指出长老先前的司法行为违背了主的命令；“尽管”表达这种反衬，但不改变引语本身的内容。
translation_notes:
  register: 采用现代、庄重而清楚的司法用语。“断案”“定……有罪”“释放”“处死”构成连贯的法庭语域；正文适度顺应现代汉语表达，脚注保留希腊语同源词重复的信息。
