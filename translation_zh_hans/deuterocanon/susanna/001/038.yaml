  yaml_path: translation/deuterocanon/susanna/001/038.yaml
  text: And they did not know that we were standing there. Then we rushed together[a], saying, 'Let us find out who these men are.'
translation:
  language: zh_hans
  text: 他们并不知道我们早已站在那里。于是，我们一同冲上前去[a]，说：“让我们查明这些人是谁。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的表达较为特殊，字面包含“一同冲上前去”和表示相互关系的“彼此”；这里究竟强调一同采取行动，还是另有具体的相互指向，并不完全明确。
    reason: 保留συνεπιτάμεθα ἀλλήλοις的语义和句法歧义，避免在正文中误译为他们彼此攻击或擅自补出动作对象。
lexical_decisions:
- source_word: οὐκ ᾔδεισαν
  choice: 他们不知道
  rationale: 按叙事语境直译为过去时的“不知道”，自然且清楚。
- source_word: εἰστήκειμεν
  choice: 我们正站在那里
  rationale: 该过去完成时表示此前已经处于站立状态；汉语用“正站在那里”自然保留姿态与在场含义。
- source_word: συνεπιτάμεθα ἀλλήλοις
  choice: 我们一同冲上去
  rationale: 动词表达突然的共同趋前动作；与格复数代词ἀλλήλοις在此句中的具体指向和关系较难确定，不宜译成彼此攻击，因此正文采用自然而不过度限定对象的表达，并以脚注说明原文形式。
- source_word: Μάθωμεν
  choice: 让我们查明
  rationale: 不定过去时虚拟语气具有劝勉语气；“让我们查明”符合此处调查身份的意思。
- source_word: τίνες εἰσὶν οὗτοι
  choice: 这些人是谁
  rationale: 希腊文直译为“这些是谁”；根据阳性复数指称及近邻语境，汉语自然补出“人”。
