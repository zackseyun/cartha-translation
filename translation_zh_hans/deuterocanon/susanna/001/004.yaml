  yaml_path: translation/deuterocanon/susanna/001/004.yaml
  text: And Joakim was exceedingly rich[a], and he had a garden adjoining his house[c][b]; and the Jews would come to him because he was more esteemed than all of them.
translation:
  language: zh_hans
  text: 约雅敬非常富有，并且有一座园子紧挨着他的住宅；犹太人常到他那里去，因为他比所有人都更受敬重。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωακείμ
  choice: 约雅敬
  rationale: 采用现代中文圣经传统中对应此名的常见译名，既便于辨认，也与希腊形式所代表的希伯来名字相符。
- source_word: πλούσιος σφόδρα
  choice: 非常富有
  rationale: πλούσιος表示富有，σφόδρα作强烈程度修饰；“非常富有”准确、自然，并保留强调语气。
- source_word: παράδεισος
  choice: 园子
  rationale: 此处指富有人家宅旁的栽培园地或有围界的园苑，并非神学意义上的“乐园”；“园子”在叙事中自然且不过度限定其具体用途。
- source_word: γειτνιῶν τῷ οἴκῳ αὐτοῦ
  choice: 紧挨着他的宅院
  rationale: 分词表达相邻、毗连；“紧挨着”清楚传达空间上的邻接，“宅院”适合富户住宅的叙事场景。
- source_word: πρὸς αὐτὸν προσήγοντο
  choice: 常到他那里去
  rationale: 未完成时在语境中表示反复或惯常发生的行动；中被动形式宜按不及物趋近义理解，不译成被人带去。
- source_word: οἱ Ἰουδαῖοι
  choice: 犹太人
  rationale: 本叙事中主要指犹太群体，而非特别强调地理上的犹太地居民。
- source_word: ἐνδοξότερον πάντων
  choice: 比众人更受敬重
  rationale: 比较级在此说明其社会声望和地位；“受敬重”避免误解为属灵或道德上优越，也自然表达被动的公众评价。
theological_decisions:
- issue: ἐνδοξότερον πάντων所表达的约雅敬之地位
  choice: 译为社会层面的“比众人更受敬重”
  alternative: 比众人更有荣耀／比所有人都显赫
  rationale: 本句用他的公众地位解释犹太人为何常到他那里，并未宣称他在道德或属灵方面胜过众人；译文不加入此类神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“非常富有”“园子”“常到他那里去”自然清晰；“宅院”略带正式色彩，与富户场景相称。原文在本节没有必须以脚注保留的重大歧义，因此正文不设脚注。
