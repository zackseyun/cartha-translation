base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/059.yaml
  text: Then Daniel said to him[a], “You also have lied rightly against your own head; for the angel of God stands by, holding the sword to split you in two, so that he may destroy you.”
translation:
  language: zh_hans
  text: 但以理对他说：“你也撒得正好，这祸归到你自己头上；因为上帝的天使手持利剑站在那里，要把你从中间锯成两半，好除灭你们[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们”在希腊原文中是复数，表明这里所宣告的除灭临到两名长老，不只临到当前受问的这一人。
    reason: 说明原文由单数称呼转为复数所表达的审判范围。
lexical_decisions:
- source_word: Ὀρθῶς ἔψευσαι
  choice: 你也撒了谎，正好……
  rationale: Ὀρθῶς带有尖锐的反讽意味：这人的谎言恰恰招致了对自己的审判。“正好”在现代汉语中保留这种反讽，又不把它误解为对撒谎的肯定。
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: 使这谎落在自己头上
  rationale: 保留“头”的具体意象，并以自然汉语表达谎言及其罪责、后果反归说谎者自身。
- source_word: μένει
  choice: 正……等着
  rationale: μένω在这里表示停留并准备采取行动；结合后面的持剑与不定式，“等着”自然传达审判即将执行。
- source_word: ὁ ἄγγελος τοῦ θεοῦ
  choice: 上帝的天使
  rationale: 直接、庄重地表达属格结构，不额外界定这位天使的身份。
- source_word: τὴν ῥομφαίαν ἔχων
  choice: 正手持利剑
  rationale: ῥομφαία指大型刀剑类兵器；“利剑”保持庄重而鲜明的审判图景，“手持”自然表达ἔχων。
- source_word: πρίσαι σε μέσον
  choice: 把你从中间锯成两半
  rationale: πρίζω的具体意思是“锯开”，μέσον说明从中间分开；译文保留原文强烈而具体的刑罚意象。
- source_word: ἐξολεθρεύσῃ
  choice: 除灭
  rationale: 该动词表达彻底毁灭；“除灭”庄重有力，适合审判语境。
- source_word: ὑμᾶς
  choice: 你们
  rationale: 原文是第二人称复数，明确把最后的毁灭扩展到不止眼前受话的一人；中文可自然显明单复数转换。
theological_decisions:
- issue: 末尾复数代词ὑμᾶς的范围
  choice: 正文译作“你们”，并以脚注说明是复数
  alternative: 译作单数“你”，仅在脚注指出复数含义
  rationale: 前文以单数指向当前受审问的长老，末尾却有意改用复数，将除灭的宣告扩及两名长老。现代汉语能清楚而自然地保留这一语法转变，不应在正文中抹平。
- issue: Ὀρθῶς的反讽张力
  choice: 译作“正好”，使其与自招审判的后果相连
  alternative: 译作“正确地”或“果真”
  rationale: 原文并非从道德上称撒谎为正确，而是讽刺这谎言准确地招祸于说谎者本人；译文保留这种张力而不将其解释成教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与司法宣告语体。“落在自己头上”保留原文意象；“锯成两半”直译刑罚动作，避免减弱其力度。
