revisions:
- from: 他们窥察着，要等一个合适的日子。后来有一天，她像昨天和前天一样，只带着两个年轻侍女进了园子；因为天气炎热，她想在园中沐浴。[a]
  to: 正当他们窥伺着、等候一个合适的日子时，有一天，她像昨天和前天一样，只带着两名年轻侍女进了园子；因为天气炎热，她想在园中沐浴。[a]
  rationale: 将首句恢复为与原文一致的“正当……时”叙事结构，并以“窥伺着、等候”更清楚而克制地表达二人暗中观察、伺机等待的状态。其余措辞及脚注所处理的时间表达均可保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:47:52Z'
review_pass:
  verdict: revise
  source_fidelity: 译文保留了两人暗中观察并等待时机、苏撒拿某日仅与两名年轻侍女入园、因炎热而欲沐浴等核心信息。“昨天和前天”可恰当地表达原文较特殊的时间比较，且以脚注保留其字面计日的说明。惟首句断开为“他们窥察着，要等……”弱化了原文“正当他们……时，发生了……”的叙事连接；“窥伺、等候”也更准确体现 παρατηρεῖν 与 ἡμέραν εὔθετον 的语境。
  naturalness: 原译整体庄重通顺。“窥察着，要等一个合适的日子”稍显生硬，且“要等”容易被理解为单纯等待，不够明确地传达伺机而动。改为“正当他们窥伺着、等候一个合适的日子时”更合现代汉语叙事，也更贴合原句结构。
  terminology: “年轻侍女”“园子／园中”“沐浴”均符合本段家庭园圃与侍从的语境；不涉及需要调整的专门神学术语。
  issues:
