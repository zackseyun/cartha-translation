    issue: 首句未充分呈现原文的时间从属关系。
    rationale: καὶ ἐγένετο ἐν τῷ παρατηρεῖν…将事件置于二人持续窥伺、等候适当时机的背景中。将其改为“正当……时，有一天……”可保留这一关系。
  - severity: low
    issue: “窥察着，要等”对伺机意味的表达略弱。
    rationale: παρατηρεῖν 在此不仅是一般观察，语境显示暗中密切监视；“窥伺着、等候”自然传达此意，同时不额外具体化他们的图谋。
  revised_text: 正当他们窥伺着、等候一个合适的日子时，有一天，她像昨天和前天一样，只带着两名年轻侍女进了园子；因为天气炎热，她想在园中沐浴。[a]
  revised_footnotes:
