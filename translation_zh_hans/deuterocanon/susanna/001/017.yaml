base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/017.yaml
  text: And it happened[a], while they were watching for an opportune day, that she once entered, as yesterday and the third day before, with only two young maids, and desired to bathe in the garden, because it was hot.
translation:
  language: zh_hans
  text: 正当他们窥伺着、等候一个合适的日子时，有一天，她像昨天和前天一样，只带着两名年轻侍女进了园子；因为天气炎热，她想在园中沐浴。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像昨天和前天一样”：原文以较特殊的计日表达指向此前两日；也可较概括地译作“像前几天一样”。
    reason: 保留原文较特殊的时间比较，并说明较自然的概括译法。
lexical_decisions:
- source_word: ἐγένετο
  choice: 后来有一天
  rationale: 这是叙事承接公式；结合 ποτε 译为自然的现代汉语，既推进情节，也标明某次具体场合。
- source_word: παρατηρεῖν
  choice: 窥察着
  rationale: 该词可指密切观察，并可带恶意监视的意味；上下文中二人暗中留意苏撒拿的行踪，“窥察”保留了这种不怀好意的色彩。
- source_word: ἡμέραν εὔθετον
  choice: 一个合适的日子
  rationale: 指适合他们图谋、便于下手的时机；“合适的日子”贴近原文而不过度明说其计划。
- source_word: ποτε
  choice: 有一天
  rationale: 标出叙事中的某一次具体事件；与 ἐγένετο 合译，符合现代汉语表达。
- source_word: καθὼς ἐχθὲς καὶ τρίτης ἡμέρας
  choice: 像昨天和前天一样
  rationale: 保留原文对先前两日的明确比较。τρίτης ἡμέρας 在这种计日方式中指包括当天在内的第三日，即前天。
- source_word: μετὰ δύο μόνων κορασίων
  choice: 只带着两个年轻侍女
  rationale: κοράσιον 可指少女，也可指年轻女仆；富裕家庭中随侍的语境支持“年轻侍女”，而 μόνος 的限制意味以“只”表达。
- source_word: ἐπεθύμησε
  choice: 想
  rationale: 此处表达愿望或意向，并非强烈贪欲；“想”自然、克制，符合语境。
- source_word: λούσασθαι
  choice: 沐浴
  rationale: 中间语态表示她自己洗浴；“沐浴”庄重自然，也区别于普通洗手洗脸。
- source_word: ἐν τῷ παραδείσῳ
  choice: 在园中
  rationale: παράδεισος 在此指住宅附属的园子，不是神学意义上的“乐园”。
- source_word: καῦμα
  choice: 天气炎热
  rationale: 该名词指炎热；转为现代汉语的状态表达，可清楚说明她想沐浴的原因。
