  text: 主听见了她的声音。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: 听见了
  rationale: εἰσακούω可指听见、垂听，常含有应允恳求的意味；此处译作“听见了”，既符合自然汉语，也不提前明说回应的方式。
- source_word: Κύριος
  choice: 主
  rationale: 希腊文本使用神圣称号Κύριος；译作“主”准确而庄重，也避免采用暗示直接对应希伯来神名的特殊形式。
- source_word: φωνῆς αὐτῆς
  choice: 她的声音
  rationale: φωνή的基本义是“声音”；保留这一明确措辞，不根据上下文扩译为“呼求”或“祷告”而缩小其语义范围。
theological_decisions:
- issue: 是否明确说神应允了苏撒拿的祷告
  choice: 译为“主听见了她的声音”
  alternative: 主垂听了她的呼求／主应允了她的祷告
  rationale: 动词在祈求语境中可能含有有利垂听的意味，但本句只明确陈述主听见她的声音；保留简洁表述，可避免提前说明神回应的具体方式。
- issue: 如何处理希腊语神圣称号Κύριος
  choice: 主
  alternative: 上主／耶和华
  rationale: 底本是希腊语且写作Κύριος。“主”直接对应该称号；“耶和华”会引入本见证没有明示的希伯来神名对应关系。
translation_notes:
  register: 采用简洁、庄重、自然的现代标准汉语。“听见了”保留叙事的朴素力度，并让上下文呈现其中可能含有的垂听意味。
