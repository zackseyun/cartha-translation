  text: And he cried out with a loud voice[a], “I am innocent of this woman’s blood.”
translation:
  language: zh_hans
  text: 他就大声喊道：“这女子的血与我无关。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我在这女子的血上是无罪的。”这里的“血”是血债用语，表示他宣告自己不必为她的死承担责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: 喊道
  rationale: 该动词表示高声呼喊；与“φωνῇ μεγάλῃ”合译为“大声喊道”，自然且保留原文力度。
- source_word: φωνῇ μεγάλῃ
  choice: 大声
  rationale: 这是表达发声方式的与格结构；“大声”符合现代汉语习惯，避免生硬直译为“用大声音”。
- source_word: Ἀθῷος
  choice: 与我无关
  rationale: 该形容词表示无罪、无须承担责任；放在血债语境中，“与我无关”传达说话者否认对她之死负有责任的意思。
- source_word: ἀπὸ τοῦ αἵματος ταύτης
  choice: 这女子的血
  rationale: 保留αἷμα的“血”以及阴性指示词ταύτης所指的“这女子”，延续圣经中以“血”表达流血责任的说法。
theological_decisions:
- issue: 血债惯用语
  choice: 这女子的血与我无关
  alternative: 我在这女子的血上是无罪的
  rationale: 原文宣告说话者不对这女子的流血死亡负责，而非仅指礼仪上的洁净。正文采用自然的现代汉语，同时以脚注说明其中的血债含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大声喊道”简洁传达重复强化的呼喊表达；引语保留“血”的圣经式责任语言，并用脚注解释其含义。
