  yaml_path: translation/deuterocanon/susanna/001/055.yaml
  text: Then Daniel said[a], “You have lied rightly against your own head; for already an angel of God, having received a sentence from God[b], will split you in two.”
translation:
  language: zh_hans
  text: 但以理说：“你这谎撒得倒正好[a]，正落在你自己头上！因为上帝的一位天使已经从上帝领受了判决[b]，要把你劈成两半。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正好”也可译作“正确地”或“恰当地”。原文很可能带有反讽：他的假见证使审判反过来落到他本人身上。
    reason: lexical_alternative
  - marker: b
    text: “判决”也可译作“裁定”或“命令”。原词可指说出的话、宣告或司法裁决；这里的审判语境支持“判决”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀρθῶς
  choice: 真准
  rationale: 此副词在这里带有尖锐的反讽意味：长老的证词虽是谎言，却恰好使刑罚落回自己头上。“真准”既自然，又保留“正确、恰当”的双关张力。
- source_word: ἔψευσαι
  choice: 你这谎话说得
  rationale: 直接表达对方已经撒谎，并与前面的反讽副词组成自然的现代汉语。
- source_word: εἰς τὴν σεαυτοῦ κεφαλήν
  choice: 正落在你自己头上
  rationale: 保留“头”的具体意象，同时用“落在……头上”这一自然汉语习语表达罪责和后果归到本人。
- source_word: ἤδη
  choice: 已经
  rationale: 表明判决的执行已经启动，突出审判迫在眉睫。
- source_word: ἄγγελος τοῦ θεοῦ
  choice: 上帝的一位天使
  rationale: 希腊文中ἄγγελος无冠词；“一位天使”恰当地保留其不定性。
- source_word: λαβὼν φάσιν
  choice: 领受了判决
  rationale: φάσις可指言语、宣告或司法裁决；本段是审判场景，因此“判决”最符合语境，同时脚注保留其他可能。
- source_word: παρὰ τοῦ θεοῦ
  choice: 从上帝
  rationale: παρά加属格表示来源；译文明确判决来自上帝。
- source_word: σχίσει σε μέσον
  choice: 要把你从中劈开
  rationale: σχίζω表示撕裂、劈开，μέσον强调从中间；此译法保留原文严厉而具体的刑罚图景。
theological_decisions:
- issue: 天使行动的性质
  choice: 上帝的一位天使领受并执行来自上帝的判决
  alternative: 将这句话泛化为上帝施行审判，而不具体描述天使的执行行动
  rationale: 希腊文明确提到“上帝的一位天使”，又说他从上帝领受了φάσις；因此应保留天使作为神圣审判执行者的具体形象，不把它淡化为抽象的审判宣告。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“真准”传达Ὀρθῶς的反讽，随后的“正落在你自己头上”使这种反讽在中文中清楚可辨；“从中劈开”保留原文鲜明而严厉的审判语言。
