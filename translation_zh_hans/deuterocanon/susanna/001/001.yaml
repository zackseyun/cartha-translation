lexical_decisions:
- source_word: Καὶ
  choice: （不单独译出）
  rationale: 句首连词承接叙事；本节作为独立起句时，现代汉语无需机械译作“于是”或“而且”。
- source_word: ἦν ἀνὴρ
  choice: 有一个人
  rationale: 这是引入叙事人物的存在句；“有一个人”自然体现希腊语的呈现功能。
- source_word: οἰκῶν ἐν Βαβυλῶνι
  choice: 住在巴比伦
  rationale: 现在分词表示居住状态；“住在”比“居住于”更自然，同时保持庄重清晰。
- source_word: ὄνομα αὐτῷ
  choice: 名叫
  rationale: 希腊语惯用的命名表达；现代汉语用“名叫”简洁自然。
- source_word: Ἰωακείμ
  choice: 约雅敬
  rationale: 采用现代中文圣经语境中对相应希伯来人名的通行形式，便于辨识，并与希腊语音形所代表的名字相符。
theological_decisions:
- issue: 人名采用音译字形还是中文传统形式
  choice: 约雅敬
  alternative: 约阿金
  rationale: Ἰωακείμ可按希腊语音形译作“约阿金”，也对应中文读者熟悉的圣经人名“约雅敬”。正文采用后者以维持人物名称的可辨识性；这不涉及教义判断。
