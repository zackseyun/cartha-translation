  text: And as we were going around the enclosed garden, we saw this woman lying with a man, and standing there we watched them talking with one another,
translation:
  language: zh_hans
  text: 我们绕着园子走时，看见这女子正和一个男人躺在一起；我们便站在那里，看着他们彼此交谈。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυκλοῦντες τὸ στάδιον
  choice: 绕着园子走
  rationale: κυκλοῦντες 表示“绕行”；本句语境中的 στάδιον 指所环绕的园地或场地。译作“园子”符合《苏撒拿传》的叙事场景，同时避免把它误解为现代“体育场”。
- source_word: ἀναπαυομένην μετὰ ἀνδρός
  choice: 正和一个男人躺在一起
  rationale: ἀναπαύομαι 可指休息、安歇或躺卧；“躺在一起”保留控告者刻意制造的暧昧和暗示，却不额外明说发生了性行为。
- source_word: ἐθεωροῦμεν
  choice: 看着
  rationale: 该词表示持续、仔细观看；“看着”配合上下文，传达他们声称停下来观察的持续动作。
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: 彼此交谈
  rationale: ὁμιλέω 在此指交谈、来往；上下文直接宾语结构支持“彼此交谈”，不强化为亲密或性行为。
theological_decisions:
- issue: 是否把长老的指控译成已经证实的奸淫行为
  choice: 保留“躺在一起”和“彼此交谈”的陈述，不增译性行为
  alternative: 译作“与一个男人同寝”或“私通”
  rationale: 希腊文本本身只陈述他们所声称看见的姿态和交谈；叙事中的诬告性质要求译文不可替控告者补足文本未明说的结论。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“这女子”保留控告口吻；用分号连接看见与停步观看两个连续动作。
