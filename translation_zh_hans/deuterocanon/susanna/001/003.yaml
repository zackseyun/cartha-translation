  yaml_path: translation/deuterocanon/susanna/001/003.yaml
  text: greatly[a], and fearing the Lord; and her parents were righteous, and they taught their daughter according to the law of Moses.
translation:
  language: zh_hans
  text: 非常[a]，又敬畏主；她的父母都是义人，并且按照摩西的律法教导自己的女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“非常，又敬畏主”；“非常”承接上文对苏撒拿的描述。
    reason: 说明本节开头的程度副词在句法上承接前文，避免读者误以为经文残缺或将它直接理解为修饰“敬畏主”。
lexical_decisions:
- source_word: σφόδρα
  choice: 非常
  rationale: 这是程度副词，修饰上文对苏撒拿的描述。译作“非常”保留其承接性质，不擅自补出原文在本节中没有重复的形容词。
- source_word: φοβουμένη
  choice: 敬畏
  rationale: φοβέομαι以“主”为宾语时表示对上帝怀有虔敬的畏惧；“敬畏”既保留“畏”的词义，也自然表达宗教语境中的尊崇。
- source_word: τὸν κύριον
  choice: 主
  rationale: 希腊文用κύριος指以色列的上帝；“主”直接对应原文，又符合现代中文圣经语体。
- source_word: γονεῖς
  choice: 父母
  rationale: 该复数名词统指双亲；“父母”准确、自然。
- source_word: δίκαιοι
  choice: 义人
  rationale: δίκαιος在圣经语境中兼具道德和信仰层面的正直含义；“义人”比单纯的“正直的人”更能保留其经文色彩。
- source_word: ἐδίδαξαν
  choice: 教导
  rationale: 表示父母给予女儿教训和教育；“教导”庄重而通顺。
- source_word: τὴν θυγατέρα αὐτῶν
  choice: 自己的女儿
  rationale: 明确保留亲属关系及物主含义，同时符合现代汉语表达。
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: 按照摩西的律法
  rationale: κατά加宾格在此表示遵循某一准则；“按照”准确表达这种依循关系。
theological_decisions:
- issue: κύριος指上帝时的译法
  choice: 主
  alternative: 上主
  rationale: 原文为希腊文κύριος，并未直接出现希伯来文神名；译作“主”既忠于希腊文，也避免额外引入特定传统的称谓。
- issue: δίκαιοι对父母品格的描述
  choice: 义人
  alternative: 正直的人
  rationale: “义人”保留该词在圣经中的伦理与信仰张力，而不把意义缩减为一般性的为人正直。
- issue: σφόδρα与上下文的句法关系
  choice: 保留为承接上文的“非常”并加注
  alternative: 补译为“非常美丽”或并入“非常敬畏主”
  rationale: 本节所给希腊文只出现程度副词，所修饰的性质隐含在前文。正文不补出具体形容词，可避免越过本节文本，也不把该副词误接到“敬畏主”上。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“非常”刻意保留原文跨节承接造成的片段感，并以脚注说明；分号反映前后分句在同一句中的连接。“义人”“敬畏主”“摩西的律法”保留圣经语汇，但不采用生僻或宗派化表达。
