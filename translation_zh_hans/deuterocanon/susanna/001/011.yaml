  yaml_path: translation/deuterocanon/susanna/001/011.yaml
  text: And when dawn came[a], they would come, stealing away from one another in haste, to see which of them would appear to her first and speak with her.
translation:
  language: zh_hans
  text: 每当天亮，他们便各自瞒着对方，急忙赶来，争着看谁先出现在她面前，跟她说话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文直译为“他们彼此偷窃”。这里可能是说他们各自避开对方的耳目，偷偷前来，都想抢在对方之前见到苏撒拿。
    reason: 说明ἔκλεπτον ἀλλήλους这一罕见且含义不完全确定的表达，保留其字面意义和语境中的可能解释。
lexical_decisions:
- source_word: ὡς ἐγίνετο ὄρθρος
  choice: 每当天亮
  rationale: ὄρθρος指黎明、清晨；未完成时态结合上下文表示反复发生的情形，因此用“每当”自然传达惯常性。
- source_word: ἐρχόμενοι
  choice: 赶来
  rationale: 分词表示他们前来的动作；与σπεύδοντες合译为“赶来”，简洁传达前来时的急切。
- source_word: ἔκλεπτον ἀλλήλους
  choice: 彼此瞒着对方
  rationale: κλέπτω本义与偷窃有关，但此处宾语为ἀλλήλους，语境并非彼此偷取财物，而是各自避开对方耳目、暗中行动。译文保留互相隐瞒的意味，并以脚注说明原文的特殊表达。
- source_word: σπεύδοντες
  choice: 争着
  rationale: σπεύδω可表示赶紧或急切；后文说明二人都想抢先，故“争着”体现其急切和竞争意味。
- source_word: τίς φανήσεται αὐτῇ πρότερος
  choice: 谁能先出现在她面前
  rationale: φανήσεται在此为不及物意义“出现、显现”；πρότερος表示谁在另一人之前。
- source_word: λαλήσει πρὸς αὐτήν
  choice: 跟她说话
  rationale: λαλέω与πρός搭配表示向某人说话；现代汉语“跟她说话”自然，也不额外规定谈话内容或回应方式。
