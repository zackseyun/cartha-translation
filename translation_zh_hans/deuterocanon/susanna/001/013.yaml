  rationale: 保留“二人中的每一个”这一分配性含义。
- source_word: τὴν ὀδύνην αὐτοῦ
  choice: 自己的苦恼
  rationale: ὀδύνη在此结合上下文指欲念造成的内心痛苦或煎熬；“苦恼”自然且不额外强化具体成因，αὐτοῦ译作“自己的”以保留各有所苦。
