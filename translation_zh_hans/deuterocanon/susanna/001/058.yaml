lexical_decisions:
- source_word: νῦν οὖν
  choice: 现在
  rationale: 承接上文并推进当下的盘问；现代汉语用“现在”即可自然表达即时转折，逻辑承接由语境体现。
- source_word: λέγε μοι
  choice: 你告诉我
  rationale: 以自然汉语表达要求对方直接作答的命令语气。
- source_word: Ὑπὸ τί δένδρον
  choice: 在什么树下
  rationale: 直接保留所询问的具体地点和树木类别。
- source_word: κατέλαβες
  choice: 你撞见
  rationale: 此处指当场发现所指控之事，而非单纯看见或以武力捉拿；“撞见”符合司法盘问的语境。
- source_word: ὁμιλοῦντας ἀλλήλοις
  choice: 他们彼此交谈
  rationale: 保留分词所表达的交谈、相互来往之义，不额外强化为亲密或性行为，以保存原文措辞的张力。
- source_word: πρῖνον
  choice: 冬青栎
  rationale: 该词指一种特定的栎树，通常认作冬青栎；故事的盘问取决于树种名称，因此正文采用较精确的译名。
