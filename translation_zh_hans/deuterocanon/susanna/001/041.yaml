  yaml_path: translation/deuterocanon/susanna/001/041.yaml
  text: And the whole assembly believed them[a], since they were elders and judges of the people.
translation:
  language: zh_hans
  text: 全体会众都相信了他们，因为他们是民众的长老和审判官。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστευσεν αὐτοῖς
  choice: 相信了他们
  rationale: πιστεύω后接与格，在此表示把两位长老的话当真、接受其证词；“相信了他们”自然直接，也保留了相信其人的表达。
- source_word: ἡ συναγωγὴ πᾶσα
  choice: 全体会众
  rationale: συναγωγή在此指聚集起来的共同体，而非会堂建筑或后来的制度名称；“全体会众”准确表达整个聚集群体。
- source_word: ὡς
  choice: 因为
  rationale: 此处引出会众相信他们的理由，即他们所具有的长老和司法身份；“因为”在现代汉语中清楚自然。
- source_word: πρεσβυτέρων
  choice: 长老
  rationale: 这里指共同体中具有公认地位的领袖，并非仅指年长男子；“长老”保留其社会职分。
- source_word: κριτῶν
  choice: 审判官
  rationale: κριτής指在民众中行使司法权的人；“审判官”比单独的“法官”更适合古代叙事语境，同时明确其司法职能。
- source_word: τοῦ λαοῦ
  choice: 民众的
  rationale: λαός在此指共同体中的人民；“民众的”与“长老和审判官”自然衔接，表达他们在人民中所担任的职分。
theological_decisions:
- issue: 前基督教犹太叙事中συναγωγή的译法
  choice: 会众
  alternative: 集会；会堂
  rationale: 原词在这里指聚集的共同体。译作“会众”既避免把它误解为建筑，也不强加后世制度含义，并保留群体性的宗教社会语境。
- issue: ὡς所表达的理由及叙述视角
  choice: 因为他们是民众的长老和审判官
  alternative: 因他们被视为民众的长老和审判官
  rationale: 希腊文直接陈述其身份，并以此说明会众为何相信他们。译文不额外加入“被视为”，以免把客观身份改写成纯粹主观判断；同时上下文本身仍可显明他们滥用了权威。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语言。“全体会众”对应整个聚集群体；句式紧凑，保留原文先陈述相信、后说明原因的结构。本节无需脚注。
