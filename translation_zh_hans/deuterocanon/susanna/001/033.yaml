  text: And all those with her were weeping[a], and all who knew her were weeping.
translation:
  language: zh_hans
  text: 凡陪在她身边的人，以及所有认识她的人，都在哭泣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαιον
  choice: 都在哭泣
  rationale: 未完成时态描写当时持续进行的哀哭；“在哭泣”既自然，也保留延续意味。
- source_word: οἱ παρ᾽ αὐτῆς πάντες
  choice: 凡陪在她身边的人
  rationale: παρά与属格在这里指与她同在、陪伴她的人；译文不把范围过度限定为侍从或家人。
- source_word: ὅσοι αὐτὴν ᾔδεισαν πάντες
  choice: 所有认识她的人
  rationale: ὅσοι与ᾔδεισαν泛指一切认识她的人；“认识她”简明自然，并保留关系范围的宽泛性。
- source_word: πάντες ... πάντες
  choice: 凡……的人，以及所有……的人
  rationale: 希腊文两次强调“所有”；汉语用“凡”和“所有”分别涵盖两个群体，既保留全面性，又避免生硬重复。
