  yaml_path: translation/deuterocanon/susanna/001/061.yaml
  text: And they rose up against the two elders, because Daniel had convicted them from their own mouth of being false witnesses, and they did to them as they had maliciously planned to do.
translation:
  language: zh_hans
  text: 众人起来对付那两个长老，因为但以理根据他们亲口所说的话，证实了他们是假见证人[a]。众人就照他们恶意图谋的那样惩治了他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但以理凭他们自己的供词揭露了他们是假见证人。”
    reason: lexical_alternative
  - marker: b
    text: 末句表达对等的司法惩罚：两位长老受到他们曾恶意图谋加给苏撒拿的刑罚。
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέστησαν ἐπὶ
  choice: 起来对付
  rationale: 该短语在这里表示采取敌对行动，而不只是站起来；“起来对付”既保留动作感，也符合公开审判逆转的语境。
- source_word: πρεσβύτας
  choice: 长老
  rationale: 二人不仅年老，也在群体中拥有审判权威；“长老”能表达其社会身份。
- source_word: συνέστησεν
  choice: 证实
  rationale: 此处指但以理借二人互相矛盾的供词确立其假见证身份。“证实”保留法律语境，同时避免把动词过度限定为已经正式定罪。
- source_word: ἐκ τοῦ στόματος αὐτῶν
  choice: 根据他们亲口所说的话
  rationale: 传达其自己的口供反过来证明其罪责这一生动含义，也符合现代汉语表达。
- source_word: ψευδομάρτυρας ὄντας
  choice: 是作假见证的人
  rationale: ψευδομάρτυρας 是司法用语，所指不是一般说谎，而是在案件中作假见证。
- source_word: ἐποίησαν αὐτοὶ οὗν τὸν τρόπον ἐπονηρεύσαντο
  choice: 众人就照他们恶意图谋要加害别人的方式惩治了他们
  rationale: 原句末尾略有省略，结合司法语境表达以其所图谋的方式回报他们；“惩治”使汉语宾语关系清楚，而“别人”不擅自在正文补入原文未明说的苏撒拿。
theological_decisions:
- issue: 惩罚中的司法对等原则
  choice: 译文表明长老受到与其恶意图谋相对应的惩治
  alternative: 更直译为“众人就照他们作恶的方式对待他们”
  rationale: 上下文体现假见证者承受其企图加给无辜者的刑罚这一司法原则；译文呈现这种对应关系，但不在正文中加入本节未明说的律法引文或受害者姓名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作假见证的人”保留法庭语境；正文以两句呈现，使较长的希腊句在汉语中清楚易读。所有脚注标记均置于相关正文之后。
