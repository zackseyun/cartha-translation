  yaml_path: translation/deuterocanon/susanna/001/050.yaml
  text: And all the people returned with haste. And the elders said to him[a], “Come, sit in our midst and tell us, for God has given you eldership.”
translation:
  language: zh_hans
  text: 众人都急忙返回。长老们对他说：“来，坐在我们中间，告诉我们吧，因为上帝已赐给你长老的尊位[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长老的尊位”也可译作“长老职分”“尊荣”或“长者的地位”。希腊语 τὸ πρεσβεῖον 可指资望、尊贵地位或长老所享有的身份；这里强调受认可的权威，而不是实际年龄。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: 返回
  rationale: 此处指众人改变行进方向而回来；“返回”自然保留其方向意义。
- source_word: μετὰ σπουδῆς
  choice: 急忙
  rationale: σπουδή可指急切、热切或殷勤；此处描述立即返回的行动，“急忙”最符合叙事语境，同时不额外推断其动机。
- source_word: οἱ πρεσβύτεροι
  choice: 长老们
  rationale: 在这一审判和群体场景中，所指是获公认的领袖，而非仅仅年长的男性。
- source_word: Δεῦρο
  choice: 来
  rationale: 保留简洁直接的召唤语气。
- source_word: ἐν μέσῳ ἡμῶν
  choice: 在我们中间
  rationale: 兼顾空间位置与在会众中的社会位置，且符合现代汉语表达。
- source_word: ἀνάγγειλον ἡμῖν
  choice: 告诉我们吧
  rationale: 该动词有宣告、报告之意；在直接引语中，“告诉我们吧”自然清楚，并以语气助词体现邀请兼要求的口吻。
- source_word: τὸ πρεσβεῖον
  choice: 长老的尊位
  rationale: 该词可表示年长者的身份、资望、尊荣或高级地位。这里但以理尚年轻，因此译文既保留与“长老”的词义联系，又用“尊位”表明所赐的是受尊崇的权威地位，并非实际年龄。
theological_decisions:
- issue: 上帝赐给但以理 τὸ πρεσβεῖον 的含义
  choice: 上帝赐予他如长老一般受尊崇、获认可的权威地位
  alternative: 上帝赐给你长老职分；上帝赐给你尊荣；上帝赐给你长者的身份
  rationale: 故事中的但以理是年轻人，却蒙上帝赐下智慧和权威。“长老的尊位”保留原文年轻人与长者身份之间的张力，同时避免把它解释成实际年老，也不将其过度制度化为特定宗教职分。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众人都急忙返回”简洁传达动作；直接引语保留集会和审判场景的正式感。“上帝”用于 ὁ θεός。“长老的尊位”有意保留原词的多义性及但以理年轻却获长者权威的张力。
