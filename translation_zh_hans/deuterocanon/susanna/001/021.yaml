  yaml_path: translation/deuterocanon/susanna/001/021.yaml
  text: And it happened[a], when the maids had gone out, that the two elders rose up and rushed at her.
translation:
  language: zh_hans
  text: 侍女们[a]出去后，两个长老便站起身来，冲向她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侍女们”也可译为“女孩们”或“年轻女子们”。希腊语此词可泛指年轻女性；按本段家庭场景，译作“侍女们”较为合适。
    reason: 词义替代：τὰ κοράσια可指年轻女性，语境上可能指随侍苏撒拿的女仆。
lexical_decisions:
- source_word: ἐγένετο
  choice: 不单独译出
  rationale: 这是希腊叙事中常见的过渡套语；现代汉语以“……后……便……”自然表达事件发生和叙事推进，若直译为“事情发生了”反显累赘。
- source_word: ὡς
  choice: ……后
  rationale: 此处引出主句动作发生的时间背景，并表明侍女出去在先；“……后”简洁自然。
- source_word: ἐξήλθοσαν
  choice: 出去
  rationale: 准确表达离开当时所在之处；与“后”组合即可清楚呈现动作先后，无须另加完成体标记。
- source_word: τὰ κοράσια
  choice: 侍女们
  rationale: κοράσια本可泛指女孩或年轻女子，但本段家庭场景显示她们是随侍苏撒拿的女子；“侍女们”既符合语境，也保持简洁。
- source_word: ἀνέστησαν
  choice: 站起身来
  rationale: 保留从原先姿态起身并立即行动的动态感，比单说“站着”准确。
- source_word: οἱ δύο πρεσβῦται
  choice: 两个长老
  rationale: πρεσβῦται在叙事中不只表示年长，也指具有公认身份和权柄的人；“长老”保留其社会角色。
- source_word: ἐπέδραμον
  choice: 向她猛扑过去
  rationale: 该动词表示突然且带有威胁性的冲向某人；“猛扑过去”传达迅疾和攻击性，同时不提前说明随后具体发生的行为。
- source_word: αὐτῇ
  choice: 向她
  rationale: 以介词结构自然表达希腊语与ἐπέδραμον搭配的与格目标。
