  text: And no one was there except the two elders[a], hidden and watching her.
translation:
  language: zh_hans
  text: 那里没有别人，只有那两个长老[a]藏在那里，窥视着她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “窥视着她”也可译作“密切观察她”或“注视着她”。希腊语动词指密切地留意或观察；在二人藏匿的语境中，可带有窥伺、监视的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν οὐδεὶς
  choice: 一个人也没有
  rationale: 希腊语以双重否定强调无人存在；此译法符合现代汉语习惯，也保留强调意味。
- source_word: πλὴν
  choice: 只有
  rationale: 此处引出唯一的例外；“只有”在本句中比“除了”更自然，并准确表达例外关系。
- source_word: οἱ δύο πρεσβύτεροι
  choice: 那两个长老
  rationale: πρεσβύτεροι在本叙事中指具有公认身份的长老，而不只是年长男子；“长老”保留其社会角色和叙事意义。
- source_word: κεκρυμμένοι
  choice: 藏在暗处
  rationale: 完成时分词表示他们已藏好并处于隐蔽状态；“藏在暗处”自然地传达这一持续状态。
- source_word: παρατηροῦντες
  choice: 窥视着她
  rationale: 该动词表示密切留意，在此语境中含隐秘监视的意味；“窥视”兼顾动作本身与叙事中的隐蔽性，但不进一步添加目的。
