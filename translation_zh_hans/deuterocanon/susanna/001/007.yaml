base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/007.yaml
  text: These men saw a woman beautiful in appearance[a], a wife of one of their brothers from the sons of Israel, whose name was Susanna, daughter of Hilkiah, wife of Joakim, walking in her husband's garden in the evening.
translation:
  language: zh_hans
  text: 这两个人看见一个容貌美丽的女子；她是他们一位弟兄[a]的妻子；那弟兄出自以色列子孙。她名叫苏撒拿，是希勒家的女儿、约雅敬的妻子。傍晚，她正在丈夫的园子里散步。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于：“他们弟兄的妻子，出自以色列子孙。”原句结构生硬；“出自以色列子孙”可能修饰“弟兄”，也可能概括说明她作为以色列群体中的已婚女子的身份。
    reason: 说明传世原文中亲属关系与族群短语的句法歧义。
lexical_decisions:
- source_word: οὗτοι
  choice: 这两个人
  rationale: 指上文所说的两位长老或审判官；补出“人”符合现代汉语，也不增加上下文以外的信息。
- source_word: ἰδόντες
  choice: 看见
  rationale: 以叙事性的限定动词表达希腊语分词在句中的作用，简洁自然。
- source_word: γυναῖκα ἀστεῖαν τῷ εἴδει
  choice: 一个容貌美丽的女子
  rationale: ἀστεῖαν 与 τῷ εἴδει 合用，明确描写外貌；“容貌美丽”庄重而符合现代汉语。
- source_word: γυναῖκα ἀδελφοῦ αὐτῶν
  choice: 他们一位弟兄的妻子
  rationale: 保留原文的“弟兄”措辞，同时用“一位”避免使人误以为两人共有一位亲生兄弟。
- source_word: ἐκ τῶν υἱῶν Ἰσραήλ
  choice: 属于以色列子孙
  rationale: 保留原文带有族群及圣约色彩的“以色列子孙”，并以“属于”连接前面的难解结构。
- source_word: ὄνομα Σουσάνναν
  choice: 名叫苏撒拿
  rationale: 自然表达希腊语的命名格式。
- source_word: θυγατέρα Χελκίου
  choice: 希勒家的女儿
  rationale: 按希腊文人名 Χελκίου 音译，并保留家谱关系。
- source_word: γυναῖκα Ἰωακείμ
  choice: 约雅敬的妻子
  rationale: 直接表达所属关系；采用现代中文圣经读者较熟悉的人名形式。
- source_word: περιπατοῦσαν
  choice: 正在……散步
  rationale: 表达未完成式场景中的行走活动；“散步”切合园中行走的语境。
- source_word: ἐν τῷ παραδείσῳ τοῦ ἀνδρὸς αὐτῆς
  choice: 在丈夫的园子里
  rationale: 此处 παράδεισος 指园子或园圃，不取神学意义上的“乐园”。
- source_word: τὸ δειλινόν
  choice: 傍晚
  rationale: 准确表达晚间时段，简明自然。
theological_decisions:
- issue: γυναῖκα ἀδελφοῦ αὐτῶν ἐκ τῶν υἱῶν Ἰσραήλ 的亲属及族群关系
  choice: 她是他们一位弟兄的妻子，属于以色列子孙
  alternative: 她是一个以色列人的妻子，也就是他们同胞的妻子
  rationale: 传世希腊文句法生硬。正文保留“弟兄”和“以色列子孙”两层措辞，不将“弟兄”直接解释为普通同胞，也避免断言是两位长老的亲生兄弟，从而保存原文的歧义和群体关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。为避免中文长串同位语晦涩，将原文单句分为两句，但保留人物身份信息的次序。人名采用简体中文圣经语境中较自然的形式；不把 παράδεισος 神学化为“乐园”。
