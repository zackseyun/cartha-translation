lexical_decisions:
- source_word: Πορευθῶμεν δὴ εἰς οἶκον
  choice: 我们现在回家吧
  rationale: Πορευθῶμεν是劝勉式“让我们去”，δὴ在这里加强当下行动的语气，εἰς οἶκον是惯用表达“回家”；合译自然且忠实。
- source_word: ἀρίστου
  choice: 午饭
  rationale: ἄριστον可指白天较早时段的正餐；在本句语境中译作现代汉语常用的“午饭”，比生硬的“日间餐”更清楚自然。
- source_word: ἕτερος τῷ ἑτέρῳ
  choice: 一个对另一个说
  rationale: 原文直译为“一个对另一个”，引语动词省略；汉语为明确引出直接引语，补出语义上隐含的“说”，不增加实质内容。
