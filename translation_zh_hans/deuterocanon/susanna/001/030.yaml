  text: So they sent for her, and she came with her parents and her children and all her relatives.
translation:
  language: zh_hans
  text: 于是，他们派人去叫她。她就来了，同来的还有她的父母、儿女和所有亲属。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: 于是，他们
  rationale: δέ在这里承接叙事进程，并非表示强烈转折；“于是”自然连接上文行动。
- source_word: ἀπέστειλαν
  choice: 派人去叫她
  rationale: 该动词在此语境中指派人召苏撒拿前来；这样译比单独的“派遣”更完整地表达汉语中的惯用含义，同时不增添正式传唤等色彩。
- source_word: ἦλθεν
  choice: 她就来了
  rationale: 简单过去时叙事动作，直译为“来了”自然清楚；补出主语“她”符合现代汉语表达。
- source_word: γονεῖς
  choice: 父母
  rationale: 准确对应复数名词，既不扩写，也不缩窄。
- source_word: τέκνα
  choice: 儿女
  rationale: 在家庭成员的列举中，“儿女”自然且不限定性别，对应广义的“孩子、后代”。
- source_word: πάντες οἱ συγγενεῖς
  choice: 所有亲属
  rationale: 保留πάντες的全称范围，并以现代通行的“亲属”表达广义血亲或家族关系。
- source_word: καὶ ... καὶ ... καὶ
  choice: 同来的还有……、……和……
  rationale: 希腊文重复καί串联同行者；汉语以列举结构自然呈现，同时保留这些人都与她一同前来的关系。
