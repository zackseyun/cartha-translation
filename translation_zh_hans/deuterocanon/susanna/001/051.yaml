  text: And Daniel said to them[a], “Separate them far from one another, and I will examine them.”
translation:
  language: zh_hans
  text: 但以理对他们说：“把他们两人远远分开，我要审问他们[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要查问他们。”希腊语动词可指司法性的审查或讯问。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαχωρίσατε
  choice: 分开
  rationale: 这是复数命令式，要求人把两名长老隔离开来；“分开”在现代汉语中直接自然，并保留现场处置的含义。
- source_word: ἀπ᾽ ἀλλήλων
  choice: 把他们两人……分开
  rationale: 该相互关系表达指二人彼此隔离；中文结合宾语“他们两人”和动词“分开”自然传达此义。
- source_word: μακράν
  choice: 远远
  rationale: 副词强调隔离距离之远；“远远分开”既贴近原文，也清楚表明二人不可彼此接近。
- source_word: ἀνακρινῶ
  choice: 我要审问
  rationale: 该词在此司法语境中指查问、讯问或审查；“审问”简洁地保留正式的司法色彩，而不预先断定审问结果。
- source_word: Δανιήλ
  choice: 但以理
  rationale: 采用现代简体中文圣经传统中通行的人名译法。
