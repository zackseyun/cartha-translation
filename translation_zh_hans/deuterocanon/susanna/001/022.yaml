base_translation:
  language: en
  yaml_path: translation/deuterocanon/susanna/001/022.yaml
  text: And they said[a], “Look, the doors of the garden are shut, and no one sees us, and we are filled with desire for you. Therefore consent to us, and be with us.”
translation:
  language: zh_hans
  text: 他们说：“看，花园[a]的门都关着，没有人看见我们。我们对你满怀欲望；所以，答应我们，跟我们在一起吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语 παράδεισος 在这里指有围护的花园或园林，不是后世神学意义上的“乐园”。
    reason: 说明该词在本处的具体叙事含义，防止读者误解为神学术语。
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 看
  rationale: 这是引起注意的指示语；“看”简洁自然，也保留了原文直接迫人的语气。
- source_word: αἱ θύραι τοῦ παραδείσου
  choice: 花园的门
  rationale: παράδεισος 在本叙事中指有围墙或门户的园子，并非后世神学意义上的“乐园”；θύραι 为复数，结合汉语习惯译作“门”。
- source_word: κέκλεινται
  choice: 都关着
  rationale: 完成时被动态强调关闭后持续至今的状态；“关着”自然表达这一结果状态，“都”照应复数门户。
- source_word: θεωρεῖ
  choice: 看见
  rationale: 此处指有人目睹或察看他们；“看见”直接清楚，不额外引入“监视”的含义。
- source_word: ἐν ἐπιθυμίᾳ σού ἐσμεν
  choice: 我们对你满怀欲望
  rationale: 原文表达对苏撒拿的强烈欲望，在语境中带有性意味；“满怀欲望”保留其强度与恶意，又不把原文扩写成更强烈的比喻。
- source_word: διὸ
  choice: 所以
  rationale: 清楚呈现从无人看见及他们的欲望，推向随后胁迫要求的推论关系。
- source_word: συγκατάθου ἡμῖν
  choice: 答应我们
  rationale: 该中动态命令式要求对方同意、应允；“答应我们”贴近原义，同时由上下文显出这并非自由平等的请求。
- source_word: γενοῦ μεθ᾿ ἡμῶν
  choice: 跟我们在一起吧
  rationale: 贴近“与我们同在”的措辞，并让叙事语境显明其性要求，避免擅自译成更具体的行为。
theological_decisions:
- issue: παράδεισος 在非末世叙事语境中的含义
  choice: 花园
  alternative: 乐园
  rationale: 本节所说的是苏撒拿沐浴所在、有门可关闭的园子。译作“乐园”会引入原叙事并无的末世或神学联想。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。引语保留两个长老步步逼迫的直接语气；不淡化“欲望”的性意味，也不把“跟我们在一起”解释性扩写为原文未明说的具体行为。脚注标记紧随其所解释的“花园”。
