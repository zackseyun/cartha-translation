lexical_decisions:
- source_word: οἱ δὲ δύο πρεσβύτεροι
  choice: 那两个长老却
  rationale: “长老”保留了πρεσβύτεροι在本叙事中兼具年长者与群体权威人物的含义；δέ译作“却”，标明叙事转折及他们开始陈述证词。
- source_word: εἶπαν
  choice: 说
  rationale: 采用自然、庄重而不过度解释的引语引入语。
- source_word: Ἡμεῖς
  choice: 我们
  rationale: 保留明示代词；汉语直接引语中的“我们”足以传达其自我指称，无须另加“我们自己”。
- source_word: περιεπατοῦμεν
  choice: 当时正在……走着
  rationale: 用“当时正在……走着”表达未完成过去时所呈现的持续动作，不增添“闲逛”等原文没有的意味。
- source_word: ἐν τῷ παραδείσῳ
  choice: 在……园子里
  rationale: παράδεισος在此指富有人家所属的园圃或有围界的园地；“园子”在现代汉语中自然，也不致误解为神学意义上的“乐园”。
- source_word: τοῦ ἀνδρὸς αὐτῆς
  choice: 她丈夫的
  rationale: 此处ἀνήρ依关系和所有格结构明确指“丈夫”；这一表达简洁地保留所属关系。
