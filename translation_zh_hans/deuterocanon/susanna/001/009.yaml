  text: They twisted their minds and turned away their eyes so as not to look to heaven or remember righteous judgments[a][b].
translation:
  language: zh_hans
  text: 他们扭曲了自己的心思，转开了眼睛，为的是不望向天上，也不记念公正的判决[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扭曲”也可译作“败坏”或“歪曲”。希腊语动词既可表示使之偏离、变形，也可含道德败坏之意。
    reason: lexical_alternative
  - marker: b
    text: “公正的判决”也可译作“正义的审判”或“公义的裁断”。这里很可能指神公正的作为或准则，但希腊原文没有明说“神的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διέστρεψαν
  choice: 扭曲了
  rationale: 该动词表示使某物偏离正道，也可含道德败坏之意；“扭曲”既保留内在心思被弄歪的形象，又符合现代汉语表达。
- source_word: τὸν νοῦν αὐτῶν
  choice: 自己的心思
  rationale: νοῦς在此指思想、理解及道德判断的内在官能；“心思”比单纯“思想”更能涵盖意念与道德取向。
- source_word: ἐξέκλιναν τοὺς ὀφθαλμοὺς αὐτῶν
  choice: 转开双眼
  rationale: 直译其主动把眼睛转向一旁的具体动作，体现刻意回避。
- source_word: τοῦ μὴ βλέπειν εἰς τὸν οὐρανὸν
  choice: 为的是不仰望上天
  rationale: 带μή的冠词化不定式在此表达目的；“仰望上天”自然保留向天观看的方向性，也不把“上天”直接改写为“神”。
- source_word: μηδὲ μνημονεύειν
  choice: 也不记念
  rationale: “记念”兼具回想和放在心上的意味，适合经文语体而不显生僻。
- source_word: κριμάτων δικαίων
  choice: 公正的判决
  rationale: κρίματα可指审判、裁决或判决，δίκαια表示正直、公正；“公正的判决”保留司法语义，同时不擅自补出所有者。
theological_decisions:
- issue: “上天”与“公正的判决”的所指
  choice: 保留“上天”和无所有格的“公正的判决”
  alternative: 译作“仰望神，并记念神公义的判决”
  rationale: 上下文很可能指向神及其公正裁断，但希腊文本没有明说“神”，也没有显式所有格；正文不补足这一神学所指，以保存原文的含蓄性。
- issue: κριμάτων的语义范围
  choice: 判决
  alternative: 审判；律例
  rationale: 该词可涵盖审判行为、裁决结果或法令；本句没有充分依据将其限定为律例，“判决”较好保留司法与结果两方面的可能性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“心思”“仰望”“记念”保留经文语感，但整体句法清楚易懂；以“为的是”明确表达希腊语目的结构。
