  text: Then all the people turned to him and said[a], “What is this word that you have spoken?”
translation:
  language: zh_hans
  text: 于是，众人都转向他，说：“你所说的这是什么话？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 转向
  rationale: 与πρὸς αὐτόν连用，表示众人把身体或注意力转向他；“转向”自然准确，也不额外暗示他们先前曾离开。
- source_word: πᾶς ὁ λαός
  choice: 众人都
  rationale: 指在场的全体民众；“众人都”符合现代汉语表达，并保留πᾶς的周全意味。
- source_word: πρὸς αὐτόν
  choice: 向他
  rationale: 表示转动的方向，合入“转向他”最符合汉语习惯。
- source_word: Τίς ὁ λόγος οὗτος ὃν σὺ λελάληκας
  choice: 你刚才说的这话是什么意思
  rationale: 此处τίς在语境中询问所说之话的含义或用意，而非辨认其名称；λόγος译作“话”，自然涵盖言语、说法或陈述。λελάληκας为完成时，所说内容仍与当前情形相关，以“刚才说的”自然体现。
