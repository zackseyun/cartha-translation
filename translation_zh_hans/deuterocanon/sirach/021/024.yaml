  text: It is a man's lack of discipline to listen at a door[a], but a prudent man will be burdened by disgrace.
translation:
  language: zh_hans
  text: 人在门边听[a]，是没有教养的表现；明智的人却会因耻辱而感到沉重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在门边听”；这个说法暗示偷听，但正文保留了原文较含蓄的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαιδευσία
  choice: 没有教养
  rationale: 该词指缺少应有的教育、训练或规矩，并可表示由此产生的失礼行为。“没有教养”自然地保留了其道德和社会层面的贬义。
- source_word: ἀνθρώπου
  choice: 人的／人
  rationale: 这是依附于ἀπαιδευσία的属格，泛指人的无教养；汉语以“是没有教养的表现”自然传达，不必显明语法性别。
- source_word: ἀκροᾶσθαι
  choice: 听
  rationale: 原词本义是“听、聆听”。结合“在门边”可暗示偷听，但正文不把暗示直接改写成“偷听”。
- source_word: παρὰ θύραν
  choice: 在门边
  rationale: παρά加宾格在此描写靠近门的位置；“在门边”既保留原文意象，也符合现代汉语。
- source_word: φρόνιμος
  choice: 明智人
  rationale: 该词强调实际判断力和审慎；“明智人”简洁自然，并与前句无教养的行为形成对照。
- source_word: βαρυνθήσεται
  choice: 深感难受
  rationale: 该将来时被动态字面有“变沉重、受重压”之意；此处用“深感难受”自然表达因不光彩而承受的沉重感，同时避免生硬直译。
- source_word: ἀτιμίᾳ
  choice: 因不光彩
  rationale: 与格可表示原因或凭借，词义涵盖羞辱、失去体面或不光彩。“不光彩”保留社会道德意味，也不强行判定是本人受辱还是对失礼之事感到羞耻。
