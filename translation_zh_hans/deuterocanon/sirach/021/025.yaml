  yaml_path: translation/deuterocanon/sirach/021/025.yaml
  text: The lips of strangers will be weighed down by these things[b][a], but the words of the wise will be set on a balance.
translation:
  language: zh_hans
  text: 外人的嘴唇会被这些事压得沉重[a]；明智人的话却会被放在天平上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被这些事”也可译作“在这些事上”。希腊语短语可作较直接的空间性表达；在这里也可能表示这些事使外人的嘴唇变得沉重。
    reason: lexical_alternative
  - marker: b
    text: “被放在天平上”描绘称量的画面，表示明智人的话是有分量、经得起衡量的。
    reason: cultural_note
lexical_decisions:
- source_word: χείλη
  choice: 嘴唇
  rationale: 保留原文以“嘴唇”代指言语的具体意象，也与后半句的“话”形成对应。
- source_word: ἀλλοτρίων
  choice: 外人
  rationale: 此词指不属于相关群体的人；“外人”保留社会距离感，又不把含义过度限定为异族或外国人。
- source_word: ἐν τούτοις
  choice: 因这些事
  rationale: 该短语回指上文所谈的事；结合“变得沉重”的比喻，译作“因这些事”自然地表达可能的原因或凭借关系，同时以脚注保留较直译的空间义。
- source_word: βαρυνθήσεται
  choice: 会……变得沉重
  rationale: 对应将来被动形式，保留“被加重、受重压”的比喻，并与后半句天平的称量意象相呼应。
- source_word: λόγοι
  choice: 话
  rationale: 简洁自然，符合箴言体，也准确表达人在口中所说的话语。
- source_word: φρονίμων
  choice: 明智人
  rationale: 该形容词作名词用，指有见识、审慎的人；“明智人”既保留智慧文学色彩，也不把词义过度强化。
- source_word: ἐν ζυγῷ
  choice: 在天平上
  rationale: ζυγός在称量语境中指天平或秤杆；此处不是“轭”，而是衡量分寸的意象。
- source_word: σταθήσονται
  choice: 要放在
  rationale: 结合“天平”，表达话语被置于其上接受衡量的画面；中文比直译“站立”自然，同时保留原文将来被动的意味。
