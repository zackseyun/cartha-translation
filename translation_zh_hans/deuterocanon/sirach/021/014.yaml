  text: The inward parts of a fool are like a broken vessel[a], and they will not hold any knowledge.
translation:
  language: zh_hans
  text: 愚人的内里如同破碎的器皿[a]，容不下任何知识。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“破裂的罐子”或“打碎的陶器”。希腊文描绘的是一个已经破碎、无法留住所盛之物的容器。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγκατα
  choice: 内里
  rationale: 该词本指内脏、内在部分；此处既可指人的内在，也与下文容器的具体比喻相呼应。“内里”保留这种双重意味，而不径直解释为“心”或“头脑”。
- source_word: μωροῦ
  choice: 愚人的
  rationale: 在智慧文学语境中，μωρός兼具智识和道德上的愚昧含义；“愚人”简洁自然，并保留箴言式语气。
- source_word: ὡς ἄγγιον συντετριμμένον
  choice: 如同破碎的器皿
  rationale: ἄγγιον泛指盛装物品的容器，未限定材质或具体器型；συντετριμμένον表示被打破、破碎。“破碎的器皿”既忠实于形象，也为后句“容不下”提供自然衔接。
- source_word: πᾶσαν γνῶσιν
  choice: 任何知识
  rationale: πᾶσαν在否定结构οὐ κρατήσει中自然表达为“任何”，说明知识无从留存；“知识”直接对应γνῶσις，避免扩大为较宽泛的“智慧”。
- source_word: οὐ κρατήσει
  choice: 容不下
  rationale: κρατέω可指抓住、持守或留存。结合破碎容器的比喻，“容不下”自然表达无法保存知识，并让语法上的单数动词与作为整体的“内里”相协调。
