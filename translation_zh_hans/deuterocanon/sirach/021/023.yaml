translation:
  language: zh_hans
  text: 愚昧人从门口窥看屋内；体面的人[a]却站在外面说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“尊荣归于那站在外面说话的人”，表达较为凝练；希腊文作“有教养的人却站在外面”。
    reason: alternative_reading
  - marker: b
    text: 希腊文到“站在外面”为止，没有希伯来文所见的“说话”。本译文依从希伯来文。
    reason: textual_variant
lexical_decisions:
- source_word: אֱוִיל
  choice: 愚昧人
  rationale: 这是希伯来智慧文学中常见的道德与处世范畴，并非单指智力不足；“愚昧人”保留了箴言式语气。
- source_word: מִפֶּתַח
  choice: 从门口
  rationale: 介词 מִן 与 פֶּתַח 结合，表示从入口处向内看；“从门口”准确而自然。
- source_word: יַבִּיט אֶל בָּיִת
  choice: 窥看屋内
  rationale: הביט אל 表示朝向或向内看；结合语境中的失礼行为及希腊文 παρακύπτει 所含探身窥视之意，“窥看”恰当地传达了冒昧窥探的色彩。
- source_word: וְכָבוֹד לְאִישׁ
  choice: 体面人
  rationale: 希伯来文直译近于“尊荣归于一个人”，句法凝练；这里指人的端庄、得体。“体面人”既保留 כָבוֹד 的尊重与体面意味，也适合现代汉语。脚注说明了原文的压缩表达及希腊文异读。
- source_word: בַּחוּץ יַעֲמוֹד
  choice: 站在外面
  rationale: 直接对应希伯来文，也与希腊文 ἔξω στήσεται 一致；在格言中用一般现在式自然表达惯常行为。
- source_word: וִידַבֵּר
  choice: 说话
  rationale: 希伯来文明确保留了这个动词，可能表示来客在外面出声招呼，而不擅自窥探或闯入；译文不补出原文未明说的“招呼”。
