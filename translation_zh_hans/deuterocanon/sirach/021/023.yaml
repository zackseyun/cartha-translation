translation_notes:
  register: 采用简洁、庄重的现代汉语格言体。“窥看”体现不合礼数的探视，“体面人”与之形成社会行为上的对照；不把“说话”具体化为“敲门”“招呼”或“请求进入”，以免加入原文没有明说的情节。
