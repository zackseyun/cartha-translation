  text: Flee from sin as from the face of a snake[a]; for if you come near it, it will bite you.[b]
translation:
  language: zh_hans
  text: 要逃避罪，如同躲避蛇一样[a]；因为你若靠近它，它就会咬你。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“要逃避罪，如同从蛇的面前逃开”。“面前”也可指其临在；正文采用自然的汉语表达。
    reason: lexical_alternative
  - marker: b
    text: 所提供的开罗藏经库希伯来文本与本节的希腊文内容不相符，看来是文本位置错配；因此本节正文依据希腊文见证翻译。
    reason: textual_variant
lexical_decisions:
- source_word: φεῦγε
  choice: 要躲避
  rationale: 希腊文命令式表示迅速逃离、避开；“要躲避”在现代汉语中自然有力，并保留劝诫语气。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 这是该词在道德与神学语境中的标准译法，保留原文的分量。
- source_word: ὡς ἀπὸ προσώπου ὄφεως
  choice: 如同躲避迎面而来的蛇
  rationale: 原文直译近于“从蛇的面前逃开”。“迎面而来的蛇”以自然汉语保留近距离遭遇的具体、危险意象。
- source_word: ἐὰν ... προσέλθῃς
  choice: 你若靠近它
  rationale: 准确表达“走近、接近”的条件语义，也与蛇的比喻衔接自然。
- source_word: δήξεταί σε
  choice: 它就会咬你
  rationale: 该动词明确指咬；直译可保留比喻的具体后果。
theological_decisions:
- issue: 现存希伯来文本与本节希腊见证明显不对应
  choice: 正文依据希腊平行文本翻译
  alternative: 按所提供的卡哈纳希伯来文本译为关于统治者、宴饮之所和城中高处座位的句子
  rationale: 所给希伯来行文与《德训篇》21:2的希腊内容完全不符，且资料已标注为位置轻微错配。为避免把错置文本当成本节正文，采用对应本节且语义完整的希腊见证，同时用脚注公开说明文本问题。
translation_notes:
  register: 采用简洁、庄重而口语可懂的现代标准汉语。“要躲避”传达命令的急迫感；“迎面而来的蛇”避免生硬的“蛇的面前”，同时不削弱原文意象。
