  yaml_path: translation/deuterocanon/sirach/021/016.yaml
  text: A fool’s explanation is like a burden on the road[a], but grace will be found on the lips of the prudent.
translation:
  language: zh_hans
  text: 愚人的解说，如同路上的重担；明智人的嘴唇上却可见恩惠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“温雅”或“恩宠”。希腊文χάρις可指恩惠、恩宠、温雅，或使人喜悦的特质。
    reason: 保留χάρις在此处的多重可能含义，不将其限定为单一的言语特质或神学含义。
lexical_decisions:
- source_word: ἐξήγησις
  choice: 解说
  rationale: 该词指解释、说明或陈述。“解说”保留其基本含义，也能自然地指愚人说出的一番话。
- source_word: μωροῦ
  choice: 愚人的
  rationale: 采用智慧文学中常见的“愚人”，既表达缺乏判断力，也避免把它弱化为单纯的智力不足。
- source_word: ὡς ἐν ὁδῷ φορτίον
  choice: 好像路上的重担
  rationale: φορτίον是负载或重担，ἐν ὁδῷ直指路上或途中；译文保留旅途中累赘沉重的具体比喻，不擅自解释其所造成的是阻碍还是劳累。
- source_word: χείλους
  choice: 嘴唇上
  rationale: 直译这一智慧文学常用的言语意象，而不抽象化为“言谈”。
- source_word: συνετοῦ
  choice: 明智人的
  rationale: συνετός指有理解力、判断审慎的人；“明智人”与“愚人”形成自然而清楚的对照。
- source_word: εὑρεθήσεται χάρις
  choice: 必显出温雅
  rationale: 被动式εὑρεθήσεται在汉语中以“必显出”自然表达“将被发现／可见”；此处χάρις位于人的嘴唇上，主要描写其言语温厚悦人的特质，故译为“温雅”，并以脚注保留其他可能含义。
theological_decisions:
- issue: χάρις在本节是否指神学意义上的“恩典”
  choice: 正文译为“温雅”
  alternative: 恩惠；恩宠；恩慈
  rationale: 句中χάρις出现在“明智人的嘴唇上”，语境首先指言语所呈现的温厚、悦人或赢得好感的品质。译作“温雅”避免无根据地限定为神所赐的救恩性恩典，同时脚注保留该词较宽的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达；以分号凸显愚人与明智人的对照。保留“路上的重担”和“嘴唇上”的具体意象，不把比喻或转喻过度释义。
