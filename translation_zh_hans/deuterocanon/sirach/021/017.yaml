  yaml_path: translation/deuterocanon/sirach/021/017.yaml
  text: The mouth of a wise man will be sought in the assembly[b][a], and they will ponder his words in their hearts.
translation:
  language: zh_hans
  text: 智者的口在集会中必受寻求[a]；他的话，人也会在心里思量[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在集会中必受寻求”也可译作“在会众中必为人所求”。
    reason: 保留ζητηθήσεται及ἐκκλησίᾳ的自然译法差异。
  - marker: b
    text: 希腊文直译为“会在心里思量”，动词是单数，主语没有明说。
    reason: 说明原文隐含主语的语法含混，避免把英文咨询层的复数“他们”误当作希腊文明文。
lexical_decisions:
- source_word: στόμα φρονίμου
  choice: 智者的口
  rationale: 直译“智者的口”，保留希腊文以“口”指其发言的具体意象；不提前化解为“言论”或“话语”。φρονίμου虽为阳性单数，但汉语“智者”既能对应单数实体，也无需额外加入原文没有的性别词。
- source_word: ζητηθήσεται
  choice: 必受寻求
  rationale: 保留将来被动语态和“寻求”的基本意义；“必”在此表达预期将发生之事，而非另加神学上的必然性。
- source_word: ἐν ἐκκλησίᾳ
  choice: 在集会中
  rationale: 此处指聚集起来的群体或场合；“集会”自然且不引入后世制度化的“教会”含义。“会众中”亦为可能译法。
- source_word: τοὺς λόγους αὐτοῦ
  choice: 他的话
  rationale: λόγους用日常而宽泛的“话”表达，αὐτοῦ则按其阳性单数先行词译为“他”。
- source_word: διανοηθήσεται
  choice: 人也会……思量
  rationale: 该动词为第三人称单数，主语未明说。以泛指的“人”补出隐含主语，既合现代汉语，又避免依照英文层擅改为复数“他们”。“思量”体现内在、反复考虑的意味。
- source_word: ἐν καρδίᾳ
  choice: 在心里
  rationale: 保留“心”的圣经式内在反思意象；希腊文无物主代词，汉语“在心里”也无需补出“他们的”。
theological_decisions:
- issue: φρονίμου的性别表达
  choice: 智者
  alternative: 有智慧的男人
  rationale: 希腊文形式为阳性单数，但在此作为“有智慧者”的实体用法。现代汉语“智者”准确保留单数人物指称，不必加入可能过度强调生理性别的“男人”。
- issue: ἐκκλησία的语境含义
  choice: 集会
  alternative: 会众；教会
  rationale: 智慧文学语境强调共同体的聚集，而非后世基督教制度意义上的“教会”；因此采用中性的“集会”。
- issue: διανοηθήσεται的隐含主语
  choice: 泛指单数“人”
  alternative: “他们”；承接“智者”作主语
  rationale: 希腊文动词为第三人称单数，且未明说主语。“人”保留其泛指与一定程度的含混性；译作“他们”会引入原文没有的复数，承接“智者”则会产生智者思量自己言语的可疑意义。
translation_notes:
  register: 采用现代、庄重而可读的智慧文学语体。前半句保留“口”这一具体而略带陌生感的原文意象；后半句用泛指“人”使汉语通顺，同时保留希腊文未明说主语的特点。分号呈现两个并列而相互解释的分句。
