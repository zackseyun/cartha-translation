  text: He who builds his house with another’s money is like one gathering his stones for winter[a][b].
translation:
  language: zh_hans
  text: 用他人的钱财建造自己房屋的人，就像是在为冬天收集自己的石头。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他人的钱财”也可译作“别人的财富”或“别人的财物”。希腊文所指的是属于他人的资源。
    reason: lexical_alternative
  - marker: b
    text: “冬天”也可理解为“风暴季节”；这个形象可能强调到了恶劣季节才收集建材，为时已晚，所做的工徒劳无益。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οἰκοδομῶν
  choice: 建造……的人
  rationale: 带冠词的现在分词构成泛指性的箴言表达；汉语用“……的人”自然传达持续行为及一般原则。
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: 自己的房屋
  rationale: 在“建造”和“石头”的语境中，οἰκία主要指实际房屋，而非抽象的家室或家庭。
- source_word: ἐν χρήμασιν ἀλλοτρίοις
  choice: 用他人的钱财
  rationale: χρήματα可指钱、财富或财物，ἀλλότριος指属于别人的；“钱财”既自然，又比单说“钱”略能保留词义范围。
- source_word: ὡς συνάγων
  choice: 就像……收集……的人
  rationale: ὡς加分词引出明喻；译文明确保留比较关系。
- source_word: αὐτοῦ τοὺς λίθους
  choice: 自己的石头
  rationale: 按传世希腊文本保留αὐτοῦ的所有关系，不擅自改释为“房屋所需的石头”。
- source_word: εἰς χειμῶνα
  choice: 为冬天
  rationale: χειμών可指冬天，也可指风暴多发的恶劣季节；正文采用简洁的基本义，并在脚注保留另一可能。
