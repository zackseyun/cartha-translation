  text: He who is not shrewd will not be instructed;[a]
translation:
  language: zh_hans
  text: 不机敏的人不会受教。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “机敏”也可译作“聪明”或“精明”；这个希腊词在其他语境中也可带有“狡猾”的贬义。
    reason: 词义存在语境性的褒贬差异，正文无法同时呈现。
lexical_decisions:
- source_word: οὐ παιδευθήσεται
  choice: 不会受教
  rationale: παιδεύω的将来时被动形式可指受教导、训练或管教。这里采用“受教”，既符合智慧文学语境，也不把含义限缩为惩罚性的“受管教”或学校教育。
- source_word: ὃς οὐκ ἔστιν
  choice: 不……的人
  rationale: 关系代词引出泛指的人；现代汉语以“不……的人”表达自然，并无须机械保留希腊语的阳性单数形式。
- source_word: πανοῦργος
  choice: 机敏
  rationale: πανοῦργος可表示聪敏、精明或机警，也可在其他语境带有狡猾的贬义。此处它与受教相连，“机敏”保留实践判断力和头脑敏锐之意，又不把词义过度道德化。
theological_decisions:
- issue: πανοῦργος在智慧箴言中的褒贬色彩
  choice: 采用较中性而略带肯定意味的“机敏”
  alternative: “狡猾”或“精明”
  rationale: 本句把这种素质视为受教所需的条件；译作“狡猾”会使经文仿佛主张人必须奸诈才能受教。采用“机敏”较符合上下文，同时脚注保留原词可能具有的负面色彩。
translation_notes:
  register: 采用简洁、凝练的智慧文学句式。“不会受教”是现代读者可懂且庄重的表达，并保留原文对教导、训练和纠正的宽泛含义。
