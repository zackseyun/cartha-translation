  text: One who hates reproof walks in the track of a sinner, but one who fears the Lord will turn back in his heart.
translation:
  language: zh_hans
  text: 憎恨责备的人，循着罪人的足迹而行[a]；而敬畏主的人，必在心里回转。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“在罪人的足迹中”；希腊文此处省略了“行走”一类的动词。
    reason: 说明原文的省略结构以及正文为使汉语通顺而补出的动作。
lexical_decisions:
- source_word: μισῶν
  choice: 憎恨……的人
  rationale: 现在分词作名词用，描写一类持续拒斥责备的人；此译法自然并保留其特征性含义。
- source_word: ἐλεγμὸν
  choice: 责备
  rationale: 在智慧文学语境中指揭明过错并加以规劝；“责备”比“定罪”宽和，也不把含义限于惩戒。
- source_word: ἐν ἴχνει
  choice: 循着……足迹而行
  rationale: ἴχνος意为脚印、足迹或踪迹。原句省略限定动词，汉语补出“循着……而行”，以自然表达路径意象，同时用脚注说明原文的简略结构。
- source_word: ἁμαρτωλοῦ
  choice: 罪人的
  rationale: 单数属格作泛指，描写罪人所走的道路，并不限定某个具体人物。
- source_word: ὁ φοβούμενος Κύριον
  choice: 敬畏主的人
  rationale: 分词短语作名词用；“敬畏”保留对上帝兼具尊崇与畏惧的智慧文学用语，“主”则是κύριος在此处的合宜称呼。
- source_word: ἐπιστρέψει
  choice: 必……回转
  rationale: 将来时表示此人的回应或结果。“回转”保留方向改变的基本含义，避免直接译作神学意味更明确的“悔改”。
- source_word: ἐν καρδίᾳ
  choice: 在心里
  rationale: 保留原文的内在空间意象，指人的思想、意志与内在取向；不扩译为“全心全意”或“真诚地”。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 这里所指是上帝，且处于敬畏上帝的智慧传统中；“主”既符合经文惯用称谓，也不引入额外的专名判断。
- issue: 首句省略动词的处理
  choice: 补出“循着……而行”并加脚注
  alternative: 直译为“在罪人的足迹中”
  rationale: 希腊文首句结构简略，没有明写“行走”一类的限定动词。正文补词使现代汉语完整，并顺应“足迹”的路径意象；脚注保留原文歧义，避免把补出的动作误当成明文。
- issue: ἐπιστρέψει的神学力度
  choice: 回转
  alternative: 悔改
  rationale: 原词可描述转回或改变方向；译作“悔改”会提前确定其神学含义。“回转”既能容纳道德转向，也保留较宽的词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的智慧箴言体。两类人物以“……的人”平行呈现；“循着……足迹而行”保留具象路径比喻，“在心里回转”保留内在转向的张力。
