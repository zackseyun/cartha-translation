  text: The whisperer defiles his own soul[a], and in the place where he lives he will be hated.
translation:
  language: zh_hans
  text: 暗中搬弄是非的人玷污自己的灵魂，也必在所居之地[a]遭人憎恨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在与他同住的人中”，或“在他的邻里中”。希腊语可指一个人居住的地方，也可侧重其所处的居民群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: μολύνει
  choice: 玷污
  rationale: 表达使之不洁或在道德上受到污损的含义，兼顾洁净与伦理色彩。
- source_word: τὴν ἑαυτοῦ ψυχὴν
  choice: 自己的灵魂
  rationale: 保留ψυχή及反身结构所强调的内在、自招的道德损害，不简化为“自己”。
- source_word: ὁ ψιθυρίζων
  choice: 暗中搬弄是非的人
  rationale: 该分词在此指暗地低语、背后传话的人；此译保留隐秘言语及离间中伤的语用色彩，又不收窄为必然虚假的“诽谤者”。
- source_word: ἐν παροικήσει
  choice: 在所居之地
  rationale: παροίκησις可指寄居、居住之处或居住者所在的社群；正文采用简洁且不额外具体化的地点表达，其他可能含义收入脚注。
- source_word: μισηθήσεται
  choice: 必遭人憎恨
  rationale: 直接体现将来时被动语态，并以“遭人”自然标示施事来自其周围的人。
theological_decisions: []
