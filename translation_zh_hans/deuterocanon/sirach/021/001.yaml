translation:
  language: zh_hans
  text: 孩子，你犯过罪吗？不要再犯；要为从前所犯的罪祈祷。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希伯来文本与本节不相符，原句是：“三件事是我所恨的，四件事是我不喜爱的。”因此，本节正文依据所提供的希腊文本翻译。
    reason: textual_variant
lexical_decisions:
- source_word: Τέκνον
  choice: 孩子
  rationale: 保留不限定性别的直接称呼；不增添原文没有的“我的”。
- source_word: ἥμαρτες
  choice: 你犯了罪吗
  rationale: 将不定过去时疑问句译为自然的现代汉语，并保留其道德与宗教含义。
- source_word: μὴ προσθῇς μηκέτι
  choice: 不要再犯
  rationale: 原文直译近于“不要再加上”，在语境中指不可再次犯罪；此译简明自然。
- source_word: περὶ τῶν προτέρων σου
  choice: 为你从前的罪
  rationale: 原文直译为“关于你从前的事”；承接前面的“犯罪”，所省略的是先前所犯的罪。
- source_word: δεήθητι
  choice: 祈求
  rationale: 保留向上帝恳求的祷告意味，同时采用普通读者易懂的庄重用语。
theological_decisions:
- issue: 所提供的希伯来文本与《便西拉智训》21:1不对应
  choice: 以所提供的希腊平行文本为本节正文依据，并用脚注说明文本错位
  alternative: 照所附希伯来文本译作“三件事是我所恨的，四件事是我不喜爱的”
  rationale: 所附希伯来句与本节编号及内容不符，而希腊见证保存了与《便西拉智训》21:1相符的完整句子。采用希腊文本可忠实呈现本节，同时不掩盖希伯来材料的错位。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“孩子”保留智慧文学中师长劝诫晚辈的语气；两个短句直接有力，并保留先停止犯罪、再为以往罪行祈求的结构。
