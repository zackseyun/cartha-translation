  yaml_path: translation/deuterocanon/sirach/021/026.yaml
  text: In the mouth of fools is their heart[a], but the heart of the wise is their mouth.
translation:
  language: zh_hans
  text: 愚人的心在嘴里[a]，智慧人的心却是他们的嘴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可按含义译作：“智慧人的嘴却在心里”，意思是智慧人先在心里约束、衡量自己的话。希腊原文措辞凝练，前后形成倒置对照；这种译法把隐含的意思明说出来。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν στόματι
  choice: 在嘴里
  rationale: 保留介词与具体意象，表达愚人心里所想立即从口中流露。
- source_word: μωρῶν
  choice: 愚人
  rationale: 以现代汉语智慧文学中自然、凝练的名词形式表达复数类称。
- source_word: καρδία
  choice: 心
  rationale: 保留圣经语境中“内在之人”的宽广含义，包括思想、意向和品格，而不局限于情感。
- source_word: σοφῶν
  choice: 智慧人
  rationale: 作为类称，既对应原文复数，又保持箴言体的庄重和简洁。
- source_word: καρδία δὲ σοφῶν στόμα αὐτῶν
  choice: 智慧人的心却是他们的嘴
  rationale: 原文后半句省略系词，措辞凝练且与前半句形成倒置式对照；直译保留其真实的含混和修辞张力，不擅自补入方位关系。
theological_decisions:
- issue: 后半句中“心”与“嘴”的关系
  choice: 保留“智慧人的心却是他们的嘴”这一凝练而含混的倒置表达
  alternative: 智慧人的嘴却在心里
  rationale: 传世希腊文本字面次序为“智慧人的心〔是〕他们的嘴”，没有第二个介词“在”；正文因此不把一种解释直接写入原文，脚注则说明常见的解释性理解。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“嘴”比“口”更贴近日常现代汉语，也能清楚保留原文的身体意象；后半句刻意保留希腊文的简练与歧义，并以脚注提供解释性译法。
