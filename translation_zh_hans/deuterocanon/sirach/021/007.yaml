  yaml_path: translation/deuterocanon/sirach/021/007.yaml
  text: A man mighty in tongue is known from afar[b][a], but one with understanding knows when he slips.
translation:
  language: zh_hans
  text: 言辞有力的人，远远就能被认出来[a]；明达的人却知道他何时失足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在远处就为人所知。”希腊语既可能指其言谈格外显眼，也可能指其名声早已传开。
    reason: lexical_alternative
  - marker: b
    text: “失足”也可译作“滑倒”或“犯错”；原文意象既可指实际滑倒，也可比喻言行有误。“他”指前一句言辞有力的人。
    reason: lexical_and_referential_clarification
lexical_decisions:
- source_word: γνωστὸς μακρόθεν
  choice: 远远就能被认出来
  rationale: 保留“从远处便可辨认”的紧凑意象，同时不限定究竟是因言谈显眼，还是因名声远播。
- source_word: ὁ δυνατὸς ἐν γλώσσῃ
  choice: 善于言辞的人
  rationale: δυνατός 表示有能力、有力量，ἐν γλώσσῃ 指言语方面；译文以现代汉语自然表达其“言辞有力、擅长说话”的含义，避免把“舌头”直译得生硬。
- source_word: ὁ δὲ νοήμων
  choice: 明达的人却
  rationale: νοήμων 指有理解力、辨识力的人；“明达”兼顾理解与洞察，并用“却”呈现 δέ 的对比。
- source_word: οἶδεν
  choice: 知道
  rationale: 采用该常用动词的基本义，不额外强化为“察觉”或“辨认”。
- source_word: ἐν τῷ ὀλισθάνειν αὐτόν
  choice: 他何时失足
  rationale: ἐν 加冠词不定式在此具有时间意味；ὀλισθάνειν 的滑倒意象可兼指实际绊跌与言行犯错，“失足”保留这种双关空间。
theological_decisions:
- issue: 两个阳性单数称谓及代词的代表性表达
  choice: 善于言辞的人……明达的人……他
  alternative: 善于言辞者……明达者……自己
  rationale: 希腊文两处均为阳性单数称谓，末尾 αὐτόν 也明确回指男性单数。译为“人”使汉语自然，而保留“他”则不抹去原文的语法性别；本节不存在需要借此解决的教义问题。
- issue: 失足者的指代
  choice: “他”按最近且语法一致的先行词，指明达的人
  alternative: 将“他”理解为善于言辞的人，即明达者知道前者何时失足
  rationale: αὐτόν 与主语 ὁ νοήμων 同为阳性单数，希腊语允许反身意义用普通人称代词表达；因此“明达的人知道自己何时失足”较顺。不过句法也容许回指前一人，正文保留代词，不增译“自己”，以保存原文可能的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“善于言辞”比直译“舌头有能力”自然；“明达”具有智慧文学的凝练语体。正文保留平行对比及“失足”的形象，并以脚注说明声名/显眼、字面/比喻及代词指向的歧义。
