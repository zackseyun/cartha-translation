  text: Instruction is shackles on the feet of the senseless[a], and like handcuffs on the right hand.
translation:
  language: zh_hans
  text: 对无知的人，教导如同脚上的镣铐，又如同右手上的手铐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“管教对愚昧人来说，如同脚上的镣铐，又如同右手上的手铐。”
    reason: 词义备选：παιδεία可译为“管教”，ἀνοήτοις可译为“愚昧人”；πέδαι指脚部的拘束器具。
lexical_decisions:
- source_word: πέδαι
  choice: 镣铐
  rationale: 指用于双脚的拘束物；“镣铐”在现代汉语中清楚保留了具体的束缚意象。
- source_word: ἐν ποσὶν
  choice: 脚上的
  rationale: 与“镣铐”搭配，表达戴在脚上的拘束，符合现代汉语习惯。
- source_word: ἀνοήτοις
  choice: 无知的人
  rationale: 表示缺乏理解或悟性的人；“无知的人”保留智慧文学对认知缺失的强调，又避免使用过于固定或带辱骂色彩的称谓。
- source_word: παιδεία
  choice: 管教
  rationale: 该词可涵盖教导、训练和规训；此处以镣铐和手铐作比，“管教”既保留教育意义，也体现受教者感受到的约束。
- source_word: χειροπέδαι
  choice: 手铐
  rationale: 指用于手的拘束物；“手铐”是现代汉语中最自然、易懂的对应词。
- source_word: ἐπὶ χειρὸς δεξιᾶς
  choice: 右手上的
  rationale: 忠实保留原文单数的“右手”，不将其泛化为双手或手臂。
