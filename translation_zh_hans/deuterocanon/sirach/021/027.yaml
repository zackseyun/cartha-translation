  text: When the ungodly curses the Adversary[a], he curses his own soul.
translation:
  language: zh_hans
  text: 不敬虔的人咒诅敌对者[a]时，就是咒诅自己的灵魂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“撒但”。希腊文σατανᾶ（satanas）是一个音译词，意为“敌对者”。
    reason: 保留σατανᾶ作为专名或称谓的两种可能理解。
lexical_decisions:
- source_word: ἐν τῷ καταρᾶσθαι
  choice: ……咒诅……时
  rationale: ἐν 加冠词不定式在此表示时间情境；用“……时”符合现代汉语表达。
- source_word: ἀσεβῆ
  choice: 不敬虔的人
  rationale: 保留 ἀσεβής 所含宗教与道德层面的不敬虔之意，并体现单数泛指。
- source_word: τὸν σατανᾶ
  choice: 那敌对者
  rationale: σατανᾶς 源于闪语，意为“敌对者、控告者”；译出词义可保留本句中普通称谓与专名两种理解的张力，指示词“那”也使人格化所指在汉语中更自然。
- source_word: αὐτὸς
  choice: 他自己
  rationale: 既承接不定式的主语，也体现 αὐτός 的轻微强调。
- source_word: καταρᾶται
  choice: 咒诅
  rationale: 前后两处同源动词均译作“咒诅”，保留原文的反复与警句式对应。
- source_word: τὴν ἑαυτοῦ ψυχήν
  choice: 自己的灵魂
  rationale: ψυχή 在此也可指生命或自身，但“灵魂”较能保留该警句的道德和属灵分量；“自己的”明确表达反身代词 ἑαυτοῦ。
theological_decisions:
- issue: σατανᾶ 应译作称谓“敌对者”，还是音译为专名“撒但”
  choice: 那敌对者
  alternative: 撒但
  rationale: 希腊词是闪语词的音译，其本义为“敌对者”。本句的智慧文学语境容许称谓性理解，因此正文译出词义，避免过早锁定为后期已固定化的专名；同时以脚注保留传统且同样可能的“撒但”。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体；以“他自己就是在……”传达原文的强调和反讽效果。脚注标记已置于正文对应词后。
