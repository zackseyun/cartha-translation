  text: Like one who grasps a woman’s private parts and urinates[b][a], so is one who suddenly enters his neighbor’s house.
translation:
  language: zh_hans
  text: 手握阴茎小便的人，正如突然进入邻舍家的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴茎”一词也可指“前臂”或“肘尺”；但在“手握……小便”的语境中，指男性生殖器最为自然。希伯来原文只是把“手握……小便的人”和“突然进入……的人”并列；译文按格言的比较关系译作“正如”。
    reason: 词义及句法说明
  - marker: b
    text: 希腊文本在这里是另一句话：“她的牙齿是狮子的牙齿，夺去人的性命。”这反映了差异很大的文本形态。
    reason: 文本异文
lexical_decisions:
- source_word: הָאוֹחֵז
  choice: 手握
  rationale: אחז表示抓住、握住；“手握”具体而直接，符合这句格言刻意使用的身体意象。
- source_word: בָּאַמָה
  choice: 阴茎
  rationale: אַמָּה通常可指前臂或肘尺，但在“握住……小便”的语境中，是对男性生殖器的委婉称法；现代中文用医学性、非俚俗的“阴茎”最为清楚。希伯来文并未出现“女人”或物主成分，因此不译作“女人的私处”。
- source_word: וּמַשְׁתִּין מָיִם
  choice: 小便
  rationale: 这一短语直译为“排出水”，是表示排尿的惯用说法；“小便”自然、明确，也保留身体行为的直白感而不流于粗俗。
- source_word: וְהַנִּכְנָס
  choice: 就如……闯进
  rationale: 原文以וְ连接两个分词结构，字面是“握住……的人，和进入……的人”。结合格言体，正文以“就如”显明两种行为之间的类比；“闯进”自然表达未经示警而突然进入的冒犯性。
- source_word: לְבֵית חֲבֵרוֹ
  choice: 邻舍家中
  rationale: חָבֵר可指同伴、朋友或社会关系亲近的人；“邻舍”适合智慧文学语域，又不必预设亲密友谊。
- source_word: פִּתְאוֹם
  choice: 突然
  rationale: פִּתְאוֹם表示突然、出其不意；“突然”简洁准确，其未经预告的意味与“闯进”相互配合。
- source_word: ὀδόντες λέοντος οἱ ὀδόντες αὐτῆς, ἀναιροῦντες ψυχὰς ἀνθρώπων
  choice: 仅作为异文收入脚注
  rationale: 希腊文本与现存希伯来文在内容上完全不同。既有可信度高的希伯来见证，正文依希伯来文翻译，希腊异文则完整说明于脚注。
theological_decisions:
- issue: 本节希伯来文本与希腊文本严重分歧时正文所据的文本
  choice: 正文采用现存希伯来格言，脚注保留希腊异文
  alternative: 正文采用希腊文“她的牙齿是狮子的牙齿，夺去人的性命”，或将两种文本调和
  rationale: 此处并非轻微措辞差异，而是两个内容不同的文本形态。现存希伯来文见证可信度高，应据此翻译；调和两者会制造任何单一见证都没有的经文。
- issue: 两个分词短语之间的逻辑关系
  choice: 按格言的类比关系译作“就如”
  alternative: 严格保留并列结构，译作“手握……的人，和突然进入……的人”
  rationale: 希伯来文表面以וְ并列两个“……的人”，未明说比较词；但孤立照译在现代中文中会成为缺少谓语的残句。译作“就如”与格言结构及所提供的审校层一致，同时在脚注注明原文形式，避免掩盖句法上的含混。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“阴茎”虽直白，却属中性医学用语，既不以含混措辞掩盖希伯来文的身体意象，也避免俚俗表达。“闯进”传达突然进入他人住宅所造成的冒犯。
