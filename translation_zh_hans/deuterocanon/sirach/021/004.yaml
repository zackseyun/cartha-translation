  text: All lawlessness is like a two-edged sword; for its wound there is no healing.
translation:
  language: zh_hans
  text: 一切不法之事都像一把双刃剑；它造成的创伤无法医治。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: 像
  rationale: 引出明喻；“像”是自然、直接的现代汉语表达。
- source_word: ῥομφαία δίστομος
  choice: 一把双刃剑
  rationale: δίστομος字面有“双口”之意，在此指剑有两面刃；“双刃剑”既准确又保留鲜明意象。
- source_word: πᾶσα ἀνομία
  choice: 一切不法之事
  rationale: ἀνομία表示违背律法或正当秩序；“不法之事”比泛称“恶事”更能保留这一层含义，同时比抽象的“不法”更符合现代汉语习惯。
- source_word: τῇ πληγῇ αὐτῆς
  choice: 它造成的创伤
  rationale: πληγή可指打击或伤口；因下文提到医治，这里译作“创伤”最合语境。属格αὐτῆς可能指其创伤或其造成的创伤，汉语采用自然表达，但不额外界定具体受伤者。
- source_word: οὐκ ἔστιν ἴασις
  choice: 无法医治
  rationale: 保留“没有医治”的绝对、警句式力度，同时使现代汉语流畅。
theological_decisions:
- issue: ἀνομία的道德与律法含义
  choice: 不法之事
  alternative: 罪孽；恶行；无法无天
  rationale: “不法之事”保留违反律法与秩序的语义，又不把本句限定为某一特定法律体系或宗派性概念。
- issue: 伤口与不法之间的关系
  choice: 它造成的创伤
  alternative: 它的创伤；它的打击
  rationale: 剑的比喻和ἴασις共同支持“创伤”。此表达呈现不法带来的伤害，却不进一步断定伤害对象或排除神学意义上的赦免；本句警告的是其伤害无可医治的严重性。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式语言。分号保留希腊文前后比喻与结论的紧密关系；无须脚注。
