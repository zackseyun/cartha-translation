  text: Whoever keeps the law controls his understanding[b][a], and the fulfillment of the fear of the Lord is wisdom.
translation:
  language: zh_hans
  text: 遵守律法的人掌控自己的心思[a]；敬畏主达到圆满，就是智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“牢牢持守自己的意念”“驾驭自己的思想”，或“保全自己的理解力”。希腊语表达十分紧凑；ἐννόημα可指思想、意念、意图或理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φυλάσσων νόμον
  choice: 遵守律法的人
  rationale: 带冠词的现在分词表示泛指且持续的行为；“遵守律法的人”符合现代汉语表达，也保留 φυλάσσω 在此处“持守、遵行”的含义。
- source_word: κατακρατεῖ
  choice: 能掌控
  rationale: 该动词可指牢牢把持、控制或取得支配；与属格宾语搭配时，“掌控”较能传达对内在思想的驾驭，同时“能”使汉语句法自然，并非另加能力条件。
- source_word: τοῦ ἐννοήματος αὐτοῦ
  choice: 自己的心思
  rationale: ἐννόημα 可指思想、意念、意图或理解；“心思”保留其语义宽度，避免把紧凑的希腊语片语限缩为单一认知官能。
- source_word: συντέλεια
  choice: 圆满
  rationale: 该词指达到终点、完成或充分实现；“圆满”既自然庄重，又保留事物达到完全程度的意象，不引入末世论含义。
- source_word: τοῦ φόβου Κυρίου
  choice: 敬畏主的
  rationale: 这是智慧文学中的固定观念；中文以“敬畏主”自然表达对主所怀的敬畏，κύριος 译作“主”。
- source_word: σοφία
  choice: 智慧
  rationale: 智慧文学中的标准用语，语境没有要求采用其他译法。
theological_decisions:
- issue: 遵守律法与人的内在思想在 κατακρατεῖ τοῦ ἐννοήματος αὐτοῦ 中的关系
  choice: 遵守律法的人能掌控自己的心思
  alternative: 遵守律法的人持守自己的意念；遵守律法的人保全自己的理解力
  rationale: 希腊语结构紧凑，既可能表示驾驭思想，也可能表示持守意图或保存理解力。正文采用较符合智慧文学伦理语境的“掌控自己的心思”，但用脚注保留真实的词义歧义。
- issue: 敬畏主与智慧在 συντέλεια τοῦ φόβου Κυρίου σοφία 中的关系
  choice: 敬畏主的圆满，就是智慧
  alternative: 敬畏主的成全，就是智慧；敬畏主的终极结果是智慧
  rationale: 无系词名词句容许对两者关系作简洁断定；“圆满”保留 συντέλεια 的完成、达到充分程度之义，而不把关系解释为纯粹时间结果或因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“心思”比“理解”更能容纳原词在思想、意图和理解之间的歧义；分号呈现两句并列的智慧格言。
