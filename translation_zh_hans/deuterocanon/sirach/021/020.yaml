  text: A fool raises his voice in laughter[a], but a shrewd man will scarcely smile quietly.
translation:
  language: zh_hans
  text: 愚人笑时提高嗓门，精明人却只静静地略微一笑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“精明人却几乎不出声地微笑。”希腊原文把“仅仅／勉强”、“安静”和“微笑”紧密连在一起，描写一种克制的笑；其程度限制的具体修饰范围可有不同理解。
    reason: 保留μόλις ἡσυχῇ μειδιάσει在程度与修饰关系上的紧凑性和歧义。
lexical_decisions:
- source_word: μωρός
  choice: 愚人
  rationale: 智慧文学中的常用称谓，兼具道德与处世上的愚昧含义，也保留箴言式语气。
- source_word: ἐν γέλωτι
  choice: 一笑
  rationale: 结合汉语表达，将介词短语自然处理为笑的时候；与后半句的“微微一笑”形成对照。
- source_word: ἀνυψοῖ φωνὴν αὐτοῦ
  choice: 提高嗓门
  rationale: 直陈其提高声音；“嗓门”自然表现笑声响亮，又不把动作误解为一般说话。
- source_word: ἀνὴρ πανοῦργος
  choice: 精明人
  rationale: πανοῦργος在此与愚人相对，强调敏锐、自制和懂得分寸；“精明人”保留其机敏色彩，而不强加贬义。
- source_word: μόλις
  choice: 只是……微微
  rationale: 该词有“仅仅、勉强、几乎不”的范围；这里用程度受限的表达呈现克制，同时以脚注保留更强的“几乎不”读法。
- source_word: ἡσυχῇ
  choice: 静静地
  rationale: 按副词性与格理解，表示安静、不出声，与前句提高嗓门相对。
- source_word: μειδιάσει
  choice: 微微一笑
  rationale: μειδιάω表示微笑而非放声大笑；该译法自然呈现轻微、克制的笑。
