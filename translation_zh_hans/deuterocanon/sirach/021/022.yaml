  text: A fool’s foot hurries to a house[a], but a man of schemes bows low before the great.
translation:
  language: zh_hans
  text: 愚人的脚急忙踏进一户人家[a]，有谋划的人却在众人面前俯首。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本的后半句作：“阅历极其丰富的人会在人面前羞愧。”希伯来文与希腊文在这一句差异显著。希伯来文末尾的“众人”也可理解为“大人物”或“权贵”。
    reason: 说明希伯来文与希腊文第二分句的重要异文，并保留לָרַבִּים可指“众人”或“伟大者／权贵”的歧义。
lexical_decisions:
- source_word: רֶגֶל נָבָל
  choice: 愚人的脚
  rationale: 保留希伯来文单数“脚”的具体意象和箴言式表达；“愚人”符合智慧文学中的伦理与智识含义。
- source_word: מִהֲרָה אֶל בָּיִת
  choice: 急着进人家
  rationale: מִהֲרָה表达仓促冒进；אֶל בָּיִת在此指进入别人家中。“进人家”比直译“到一所房子”更符合现代汉语，也契合本节关于不懂礼数的语境。
- source_word: אִישׁ מְזִימוֹת
  choice: 善于谋划的人
  rationale: מְזִימוֹת本义涉及谋划、筹算，褒贬可随语境变化；此译保留其谋划能力而不强定为奸诈，亦与前句的愚人形成对照。
- source_word: יַכְנִיעַ
  choice: 谦卑自己
  rationale: 使役词干可表示使低下、降服；在这里用反身表达，呈现主动收敛、降低自己的姿态，而不额外加入纯属外在礼仪的含义。
- source_word: לָרַבִּים
  choice: 在众人面前
  rationale: רַבִּים最直接可指“许多人、众人”，也可能指有地位的“大人物”。正文采用较少解释性的“众人”，将另一可能保留在注释中。
theological_decisions:
- issue: 希伯来文与希腊文第二分句显著不同
  choice: 正文以现存希伯来文为准，译为“善于谋划的人却在众人面前谦卑自己”
  alternative: 希腊文可译作“阅历丰富的人会在人面前感到羞愧（或有所顾忌）”
  rationale: 现存希伯来文本是正文翻译的首要依据；希腊文在第二分句的主语特征、谓语及末尾表达上均明显不同，不能无声调和，因此以脚注如实保留异文。
- issue: לָרַבִּים的指称
  choice: 众人
  alternative: 大人物／权贵
  rationale: 该词既可表示“许多人”，也可表示“伟大者”。正文采用词义较直接且保持开放性的“众人”，不把社会地位含义写死。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留智慧文学的对偶和具体意象。“进人家”表达未经审慎便闯入别人家中的失礼感；第二分句避免把מְזִימוֹת固定解释成邪恶诡计，并通过脚注诚实呈现文本差异。
