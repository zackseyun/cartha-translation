  text: Instruction is like a golden ornament to a prudent man[a], and like a bracelet on his right arm.
translation:
  language: zh_hans
  text: 教诲对于明智人，如同金饰；又如戴在右臂上的臂环。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教诲”也可译作“管教”或“训练”；希腊词 παιδεία 不仅指传授知识，也可包括道德上的塑造。
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: 饰物
  rationale: 此处指用于装饰之物，并非“世界”或“秩序”；与黄金及臂环的比喻相呼应。正文用“金饰”自然凝练。
- source_word: χρυσοῦς
  choice: 金
  rationale: 形容饰物由黄金制成或具有黄金的贵重；“金饰”兼顾材质与价值。
- source_word: φρονίμῳ
  choice: 对于明智人
  rationale: φρόνιμος表示明智、审慎、具有实际判断力的人；与格在这里标明教诲对何人如同饰物。
- source_word: παιδεία
  choice: 教诲
  rationale: 该词兼有教导、管教、训练和品格塑造之意；“教诲”适合智慧文学语境，同时不把含义限于惩戒。
- source_word: χλιδών
  choice: 臂环
  rationale: 结合“在右臂上”，此词最自然地指佩戴于手臂的装饰环；“臂环”比现代通常戴在手腕的“手镯”更准确。
- source_word: βραχίονι δεξιῷ
  choice: 戴在右臂上
  rationale: βραχίων指手臂，δεξιός指右侧；加入“戴”使中文自然，并明确饰物与手臂的关系。
theological_decisions:
- issue: φρονίμῳ的阳性单数表达
  choice: 明智人
  alternative: 明智的人；智者
  rationale: 希腊文为阳性单数，但在箴言式格言中可指典型个体。中文“明智人”既不刻意扩大或限缩所指，也避免添加原文没有的性别词“男人”。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。保留两个并列明喻；以“臂环”呈现古代佩于手臂的饰物。脚注标记置于整节末尾，所释词为正文中的“教诲”。
