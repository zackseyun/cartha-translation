  yaml_path: translation/deuterocanon/sirach/021/018.yaml
  text: Wisdom to a fool is like a ruined house, and the knowledge of one without understanding is words that cannot be examined.
translation:
  language: zh_hans
  text: 智慧对于愚人，就像一座毁坏的房屋[a]；不明事理之人的知识，就是无法查究的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁坏的房屋”或译“被除灭的房屋”；这个希腊语分词也可表示某物被抹去或消失。
    reason: lexical_alternative
  - marker: b
    text: “无法查究的话”或译“无法理解的话”；希腊语既可侧重这些话无法加以查考，也可侧重其难以理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶκος ἠφανισμένος
  choice: 一座毁坏的房屋
  rationale: ἠφανισμένος源自ἀφανίζω，可表示使之不见、除灭或毁坏。这里用“毁坏的房屋”自然保留比喻，也传达残破失用之意。
- source_word: μωρῷ
  choice: 对于愚人
  rationale: 与格表示关联；“对于愚人”既符合现代汉语，也保留智慧与愚人之间的关系。
- source_word: σοφία
  choice: 智慧
  rationale: 采用该词在智慧文学中的常规译法。
- source_word: γνῶσις
  choice: 知识
  rationale: 与σοφία“智慧”区分，以保留原文两个分句的对应关系。
- source_word: ἀσυνέτου
  choice: 不明事理之人
  rationale: ἀσύνετος指缺乏理解力或辨识力的人；此译法清楚自然，并避免与前句的μωρός都译成同一个“愚人”。
- source_word: ἀδιεξέταστοι λόγοι
  choice: 无法查究的话
  rationale: ἀδιεξέταστοι可指不能加以考察、追究到底，因而也可能含有难以理解之意；“无法查究的话”贴近原文有关查考探究的表达，同时保留其语义张力。
theological_decisions: []
