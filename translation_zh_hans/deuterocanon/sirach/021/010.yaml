translation:
  language: zh_hans
  text: 罪人的道路用石头铺得平坦[a]；到了尽头，便是阴间的坑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用石头铺得平整。”希腊文着重道路被修整得平坦；结合“石头”一词，也可理解为用石头铺设路面。
    reason: lexical_alternative
  - marker: b
    text: “阴间”指死者所在之境；也可译作“冥府”。此处的用语不等同于后期观念中意义更特定的“地狱”。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁδὸς
  choice: 道路
  rationale: 既保留具体道路的画面，也能自然表达人的生活道路或行为方式。
- source_word: ἁμαρτωλῶν
  choice: 罪人的
  rationale: 直接保留属格的归属或描述关系，也不淡化原文的道德称谓。
- source_word: ὡμαλισμένη
  choice: 铺得平坦
  rationale: 该词表示使之平整、平坦；结合“用石头”，这里描绘的是以石料铺平的道路。
- source_word: ἐκ λίθων
  choice: 用石头
  rationale: 以现代汉语自然表达铺路所用的材料，同时保留ἐκ的材料含义。
- source_word: ἐπʼ ἐσχάτῳ αὐτῆς
  choice: 到了尽头
  rationale: 保留道路终点的具体意象，也让其结局或归宿的隐喻自然呈现。
- source_word: βόθρος
  choice: 坑
  rationale: 保留原词所指的坑穴及其危险、毁灭性的意象，不额外加入“深”等原文没有明说的修饰。
- source_word: ᾅδου
  choice: 阴间的
  rationale: “阴间”在现代汉语圣经语境中可指死者所在之境，较准确地传达ᾅδης，又避免误译为后来神学意义更特定的“地狱”。
theological_decisions:
- issue: 智慧文学意象中ᾅδου的译法
  choice: 阴间
  alternative: 坟墓；冥府
  rationale: 原文明确使用ᾅδης，指死者之境，并非普通的坟墓用语。“阴间”既保留七十士译本的观念背景，也避免把经文直接解释为后期意义上的地狱刑罚。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“铺得平坦”保留道路看似平顺易行的画面；分号呈现两分句之间由道路现状转向最终归宿的强烈对照，但不把希腊文καί明译为带解释性的“然而”。
