  yaml_path: translation/deuterocanon/sirach/021/005.yaml
  text: The prayer of a poor man goes from his mouth to his ears[b][a], and his judgment comes quickly.
translation:
  language: zh_hans
  text: 穷人的祈求从他口中达到上帝耳中[a]；上帝的裁决很快来到[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“从口到他的耳朵”。希腊文没有明说“上帝”，但这里的“他的”在语境中最自然是指上帝。
    reason: 说明原文代词的字面形式，并交代正文为避免现代汉语指代歧义而明示的最自然所指。
  - marker: b
    text: “裁决”也可译为“判决”；希腊文可指为穷人所作的司法决定，也可涉及他的案件或为他伸张的公正。
    reason: 保留κρίμα可指司法决定、案件或公正审断的语义范围。
lexical_decisions:
- source_word: δέησις
  choice: 祈求
  rationale: 该词指迫切的请求或恳求。“祈求”既自然地表达向上帝发出的祷告，也保留恳切求助的意味。
- source_word: πτωχοῦ
  choice: 穷人
  rationale: 希腊文为阳性单数属格，指一个贫穷的人。现代汉语“穷人”自然、准确，本身不必显明语法性别。
- source_word: ἐκ στόματος ἕως ὠτίων αὐτοῦ
  choice: 从口中直达他的耳中
  rationale: 尽量保留“从口到他的耳朵”的原文意象。“直达”自然传达祈求抵达听者的含义；“他的”保留代词指向上的张力，不在正文中擅自补出“上帝”。
- source_word: κρίμα
  choice: 裁决
  rationale: κρίμα可指司法裁断、判决，也可能侧重穷人的案件所得的公正处理。“裁决”保留司法语域，同时不过早限定为定罪或惩罚。
- source_word: κατὰ σπουδήν
  choice: 迅速
  rationale: 该短语表示急速、及时或毫不迟延；“迅速”简洁自然，并保留原文的紧迫感。
- source_word: ἔρχεται
  choice: 而来
  rationale: 对应现在时动词“来到”。这里是格言式陈述，“而来”与“裁决”搭配庄重，并保留原文动态意象。
theological_decisions:
- issue: αὐτοῦ在“他的耳中”里的所指
  choice: 正文保留“他的”，脚注说明最自然的理解是指上帝。
  alternative: 直接译作“上帝的耳中”；或把代词理解为回指穷人。
  rationale: 从语法表面看，最近的明示先行词是“穷人”；但从这则智慧格言的意义和下句迅速来到的裁决看，隐含的听者和审判者最自然是上帝。正文保留代词，避免把仍存在的形式歧义完全消除。
- issue: αὐτοῦ在“他的裁决”里的关系及κρίμα的范围
  choice: 译作“他的裁决”，并以脚注保留“他的案件”或“为他伸张公正”的可能。
  alternative: 译作“他的案件”或“为他伸张的公正”。
  rationale: κρίμα既可指所作出的裁决，也可在语境中涉及案件或公正的审断。原文没有明说该裁决是针对穷人还是为穷人作出，因此正文不把这一关系完全解释化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祈求”“裁决”保留祷告与司法两个语义场；分号呈现两分句之间紧密的因果呼应。正文有意保留两个“他的”，并借脚注说明其指向与关系，避免过度释义。
