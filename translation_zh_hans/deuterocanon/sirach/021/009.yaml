  text: An assembly of the lawless is like a bundle of tow[a], and their end is a flame of fire.
translation:
  language: zh_hans
  text: 不守律法者的聚集，如同聚拢的麻絮[a]；他们的结局是火焰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“聚拢的麻絮——不守律法者的聚集。”希腊原文将这两个名词短语并置，形成凝练的比喻；“聚拢的”对应“被聚集在一起”。
    reason: 说明原文名词短语并置形成的压缩比喻，并保留συνηγμένον较形式对应的译法。
lexical_decisions:
- source_word: στιππύον
  choice: 麻屑
  rationale: 指易燃的纤维废料，尤指亚麻加工后留下的粗短纤维；“麻屑”在现代汉语中比音译或生僻术语更易懂，同时保留引火物的具体形象。
- source_word: συνηγμένον
  choice: 扎成一束
  rationale: 该完成时被动分词本义为“被聚拢在一起”；结合易燃麻屑的意象，译作“扎成一束”自然地呈现聚集状态，但不把燃烧这一结果提前写入。
- source_word: συναγωγὴ ἀνόμων
  choice: 不守律法者的聚集
  rationale: συναγωγή表示聚集、会众；ἄνομος侧重无视或违反律法。“不守律法者”保留其法律—伦理色彩，避免泛化为一般的“恶人”。
- source_word: συντέλεια
  choice: 结局
  rationale: 此处表示最终的结果或归宿。“结局”符合现代汉语智慧文学语体，也保留终局性的意味。
- source_word: φλὸξ πυρός
  choice: 烈火的火焰
  rationale: 原文直译为“火的火焰”。“烈火的火焰”保留强调性的重复和诗性力度，虽略显凝练，却比单译“火焰”更贴近原文。
theological_decisions:
- issue: 是否把ἀνόμων弱化为一般道德词
  choice: 不守律法者
  alternative: 恶人；不敬虔的人
  rationale: 希腊词明确带有不服从、违反律法或秩序的含义；保留这一法律—伦理维度，而不引入特定宗派对“律法”的体系化解释。
- issue: 如何处理原文省略系词的压缩比喻
  choice: 补出“如同”，译为“不守律法者的聚集，如同扎成一束的麻屑”
  alternative: 直译为“扎成一束的麻屑，就是不守律法者的聚集”
  rationale: 希腊文是名词短语并置，既可感为隐喻，也可按比较关系理解。正文补出“如同”使现代汉语清楚自然；脚注保留更贴近原文结构的译法及其压缩感。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“麻屑”具体呈现易燃纤维材料；正文以“扎成一束”帮助普通读者看见聚拢待燃的意象。分号保留上下两幅图像之间从群体状态转向最终结局的推进。
