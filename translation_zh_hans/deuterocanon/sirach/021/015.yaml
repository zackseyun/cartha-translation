base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/015.yaml
  text: If an intelligent man hears a wise word[a], he will praise it and add to it; a wasteful man heard it and rejected it[c][b], and he cast it behind his back.
translation:
  language: zh_hans
  text: 明达的人若听见一句智慧的话[a]，就会称赞它，并加以补充[b]；放纵的人听见了，却不喜欢它[c]，还把它抛在背后。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一句智慧的话”也可译作“智慧的言语”或“一句智言”。希腊文所指不限于单个词。
    reason: lexical_alternative
  - marker: b
    text: “加以补充”可能指以进一步的领悟来发挥或补充这句智慧的话。
    reason: lexical_alternative
  - marker: c
    text: 此处希腊文措辞较难；也可理解为“就厌弃它”或“就拒绝它”。上下文明确表示他对所听见的话作出负面反应。
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον σοφόν
  choice: 一句智慧的话
  rationale: λόγος在这里指所听见的言语或箴言，不只是单个词；译作“一句智慧的话”既保留单数，也符合现代汉语。
- source_word: ἐπιστήμων
  choice: 明达的人
  rationale: 该词指有知识、理解力或判断力的人；“明达”适合智慧文学语境，并与下半句形成对照。
- source_word: αἰνέσει αὐτόν
  choice: 会称赞它
  rationale: 直译其肯定、赞许智慧之言的意思；代词所指为前面的“智慧的话”。
- source_word: ἐπʼ αὐτὸν προσθήσει
  choice: 在其上有所增益
  rationale: 保留“在它之上添加”的意象，同时以自然汉语表达继续发挥、补充见解的可能含义，而不将其限定为某一种解释。
- source_word: ὁ σπαταλῶν
  choice: 放纵的人
  rationale: 现在分词可指生活奢纵、挥霍或耽于享乐的人；“放纵的人”保留较宽的道德语义，不局限于金钱浪费。
- source_word: ἀπῄρεσεν αὐτῷ
  choice: 却不以为悦
  rationale: 此处形式和句法较难，按其与间接受词αὐτῷ的关系理解为所听见的话使那人不悦；译文保留负面反应，而不径直强化为明确的理性“拒绝”。
- source_word: ἀπέστρεψεν αὐτοῦ ὀπίσω τοῦ νώτου αὐτοῦ
  choice: 还把它丢在自己背后
  rationale: 用现代汉语保留原文鲜明的背弃动作，表达对所听智慧之言的轻蔑和弃置。
theological_decisions:
- issue: 智慧箴言中的阳性单数代表形式
  choice: 译为“明达的人……放纵的人”
  alternative: 译为“明达的男子……放纵的男子”
  rationale: 希腊文使用阳性单数作箴言式代表表达；现代汉语“人”本身没有语法性别，能自然承载这种泛指。强加“男子”会使普通读者误以为经文特意排除女性，超过原文在此处所强调的内容。
- issue: ἀπῄρεσεν αὐτῷ所表达的负面反应
  choice: 不以为悦
  alternative: 拒绝了它
  rationale: 原文措辞困难，可能强调听者感到不悦，而后面的“丢在背后”才具体表现弃绝。译文不把两个动作合并，以保留其语义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“明达”“不以为悦”保留智慧文学的凝练感，但整体句法保持普通读者易懂。分号呈现两类听者的鲜明对照；“还”表达第二个动作对前一负面反应的推进。所有脚注标记均置于相关短语之后。
