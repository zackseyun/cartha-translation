  yaml_path: translation/deuterocanon/sirach/021/013.yaml
  text: The knowledge of a wise man will increase like a flood[b][a], and his counsel is like a spring of life.
translation:
  language: zh_hans
  text: 智慧人的知识必如洪水般增多，他的劝导如同生命的泉源。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνῶσις
  choice: 知识
  rationale: 该词直接指“知识”；在本句中与“增多”的意象自然衔接，无须扩大为“悟性”或“辨识力”。
- source_word: σοφοῦ
  choice: 智慧人的
  rationale: 希腊文为阳性单数属格，指一个有智慧的人作为典型人物；中文“智慧人”保留单数及智慧文学的庄重语体。
- source_word: ὡς κατακλυσμός
  choice: 如洪水般
  rationale: κατακλυσμός 指泛滥的洪水；“如洪水般”清楚保留其浩大、涌增的比喻。
- source_word: πληθυνθήσεται
  choice: 必……增多
  rationale: 该未来时形式表达数量或丰盛程度的增长；“必……增多”既体现未来含义，也符合现代汉语。
- source_word: βουλή
  choice: 劝导
  rationale: 在智慧文学语境中，此词可指给予他人的明智意见；“劝导”比“谋略”更能表达造益他人的实际教诲，同时保留其指导意味。
- source_word: πηγὴ ζωῆς
  choice: 生命的泉源
  rationale: πηγή 指泉、泉源；“生命的泉源”保留原有隐喻，并采用自然、庄重且易懂的中文表达。
theological_decisions:
- issue: σοφοῦ 的性别与数
  choice: 智慧人（单数）
  alternative: 有智慧的人；智慧者；智慧人们
  rationale: 原文是阳性单数，用一位智慧人作代表。中文“智慧人”不改成复数，也不额外强化自然性别，既贴近语法形式，又不超出原文所能确定的范围。
- issue: βουλή 的语义取向
  choice: 劝导
  alternative: 谋略；意见；旨意
  rationale: 上下文将其比作赐予生命的泉源，较适合指智慧人给人的有益指导；但不把它神学化为“旨意”，也不限定为政治或军事“谋略”。
translation_notes:
  register: 采用现代、庄重、易懂的智慧文学语体。“必如洪水般增多”保留原文的强烈增长意象；“生命的泉源”维持传统而自然的圣经汉语表达。原文无须借脚注说明的重大文本或语义歧义，因此不设脚注。
