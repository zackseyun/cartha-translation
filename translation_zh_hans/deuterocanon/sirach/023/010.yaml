base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/010.yaml
  text: For just as a servant being constantly examined will not be spared bruises[a], so also one who swears and names the Name continually will never be cleansed from sin.
translation:
  language: zh_hans
  text: 因为，奴仆若不断受查验，就免不了有瘀伤；照样，常常起誓、不断称名[a]的人，也绝不能从罪中得洁净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不断呼求（那）名。”这里很可能是指人在起誓或不敬的言语中反复使用神的名；正文保留原文没有明说“神”的含蓄。
    reason: 说明ὀνομάζων在誓言语境中很可能指援引神名，同时保留其省略的宾语。
lexical_decisions:
- source_word: οἰκέτης
  choice: 仆人
  rationale: 该词指家内受主人支配的仆役，也可涉及奴仆身份；“仆人”在现代中文中自然，并保留其从属处境，而不把具体法律身份说得过死。
- source_word: ἐξεταζόμενος ἐνδελεχῶς
  choice: 不断受审问
  rationale: ἐξετάζω在此可指查问、审察，ἐνδελεχῶς强调持续反复；译文保留被动和延续意味。
- source_word: ἀπὸ μώλωπος οὐκ ἐλαττωθήσεται
  choice: 免不了受鞭打留下的伤痕
  rationale: μώλωψ指击打造成的青肿、伤痕；希腊语表达的意思是不能免受这种伤害。补出“受鞭打留下的”使比喻在中文中清楚，但不改变其受罚意象。
- source_word: ὁ ὀμνύων
  choice: 那常常起誓……的人
  rationale: 现在分词配合διὰ παντός表达惯常、反复的行为；“起誓”准确而通俗。
- source_word: καὶ ὀνομάζων διὰ παντός
  choice: 常常……称说那名
  rationale: ὀνομάζω本义为称名、提名，在起誓语境中很可能指称说或援引神的名；“那名”保留原文的含蓄，不直接补入“神”。
- source_word: ἀπὸ ἁμαρτίας οὐ μὴ καθαρισθῇ
  choice: 也绝不能从罪中得洁净
  rationale: οὐ μή构成强烈否定；καθαρίζω带有道德与宗教上的洁净含义，因此不用仅指法律判定的“脱罪”。
theological_decisions:
- issue: “称说那名”所指为何
  choice: 正文译作“称说那名”，暗示在起誓中反复提及神名，同时保留希腊文未明说“神”的含蓄。
  alternative: 可理解为一般的提名，或译成更明确的“呼求神的名”。
  rationale: 上下文谈论誓言，神名最可能是所指，但原文只用ὀνομάζων，故不在正文中明确增补“神”，以免消除其语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“不断受审问”与“常常起誓”形成反复行为的对应；“绝不能”体现希腊语的强调否定。
