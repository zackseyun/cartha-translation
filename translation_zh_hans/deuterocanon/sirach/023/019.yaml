  text: 人的眼睛，是他的惧怕，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这一分句异常简略，文本或有不确定之处。“他的惧怕”与“人的眼睛”之间的关系未明；也可理解为：“人的眼中有对他的惧怕。”
