lexical_decisions:
- source_word: ὀφθαλμοὶ
  choice: 眼睛
  rationale: 按字面译为“眼睛”，保留希腊文具体意象，不抽象化为“目光”或“注视”。
- source_word: ἀνθρώπων
  choice: 人的
  rationale: 属格复数泛指人类；现代汉语以“人的”自然表达，不额外限定为男性。
- source_word: ὁ φόβος
  choice: 所惧怕的
  rationale: φόβος通常指“惧怕、恐惧”。因本句为高度压缩的无动词结构，此处用“是他所惧怕的”使汉语成句，同时尽量保留其可能表示“所怕之物”的关系。
- source_word: αὐτοῦ
  choice: 他所
  rationale: 以“他所惧怕的”表达属格代词与φόβος之间可能的主观属格关系，但不在正文中进一步说明“他”所指何人。
theological_decisions:
- issue: 如何处理高度压缩、语境突兀且可能存在文本问题的希腊文分句
  choice: 人的眼睛是他所惧怕的
  alternative: 人眼中有对他的惧怕
  rationale: 希腊词序直译近于“人的眼睛——他的惧怕”，没有明示系词，语法关系存在歧义。正文采用与所传希腊文词序及较自然语义相符的理解，但借脚注保留另一种语法分析，不依据后期译本或神学推断消除不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“人的眼睛”保留原文的具体表达；“所惧怕的”使省略系词的希腊语在汉语中自然成句。
