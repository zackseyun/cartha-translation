base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/021.yaml
  text: This man will be punished in the streets of the city[a], and where he did not suspect it[b], he will be caught.
translation:
  language: zh_hans
  text: 这人必在城里的大街上受惩罚[a]；在他未曾料到的地方[b]，他必被抓住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在城里的广场上”；希腊文直指城中宽阔、开敞之处，强调他会公开受惩罚。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在他没有料到的地方”或“在他未曾想到的地方”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: 这人
  rationale: 指回上文所说的行淫男子；“这人”既保留指示语气，也自然体现阳性所指。
- source_word: ἐν πλατείαις πόλεως
  choice: 在城里的大街上
  rationale: πλατεῖαι指宽阔的街道或公共空地；译作“大街上”符合现代汉语，并保留公开受辱、受审判的场景。
- source_word: ἐκδικηθήσεται
  choice: 必受惩罚
  rationale: 此处被动式表达惩治或报应，而非私人复仇；“受惩罚”清楚而不过度限定施行者。
- source_word: οὗ οὐχ ὑπενόησεν
  choice: 在他意想不到的地方
  rationale: οὗ表示地点，ὑπονοέω可指猜想、料想或怀疑；此译自然表达他未曾预料被捕之处。
- source_word: πιασθήσεται
  choice: 必被捉住
  rationale: 未来被动式表示被捕获、抓住；“被捉住”保留突遭擒获的意味。
theological_decisions:
- issue: 阳性指示代词及动词所指
  choice: 明确译为“这人”，指上文的行淫男子。
  alternative: 译为不标明性别的“这个人”或仅用“他”。
  rationale: 希腊文采用阳性形式，且上下文所指具体；保留男性所指比泛化表达更准确。
- issue: ἐκδικηθήσεται的语力
  choice: 译为公开受到惩罚。
  alternative: 译为“必遭报复”或“必有人为他伸冤”。
  rationale: 上下文着重惩治与报应；译文不把它收窄为私人复仇，也不额外指明惩罚的执行者。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“必……；……必……”保留警告与断言的力度；正文使用“大街上”以求自然，脚注补充“广场”等词义可能。
