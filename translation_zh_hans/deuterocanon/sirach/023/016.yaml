  text: Two kinds multiply sins[a], and the third will bring wrath.
translation:
  language: zh_hans
  text: 有两类事会使罪恶增多，第三类会招来忿怒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忿怒”也可译作“怒气”；原文没有说明是谁的忿怒。原文“第三个”后省略名词，译作“第三类”是承接前面的“两类”。
    reason: 说明“忿怒”的词义选择及其主体未明，并交代“第三类”对原文省略名词的承接，避免将补足误作原文明确措辞。
lexical_decisions:
- source_word: Δύο εἴδη
  choice: 两类事
  rationale: εἴδη表示类别；补出“事”使现代汉语自然，同时不具体限定所指内容。
- source_word: πληθύνουσιν
  choice: 使……增多
  rationale: 保留该动词“增加、增多”的使动含义，也准确表达这些事会导致罪恶数目增多。
- source_word: ἁμαρτίας
  choice: 罪恶
  rationale: 希腊文为复数；汉语“罪恶”可作集合性表达，与“增多”搭配自然，又不削弱多项过犯的含义。
- source_word: τὸ τρίτον
  choice: 第三类
  rationale: 希腊文以中性单数“第三个”省略中心词；依照前文εἴδη，在汉语中承接为“第三类”，但不另行说明其具体所指。
- source_word: ἐπάξει
  choice: 会招来
  rationale: ἐπάγω在此表示带来或引来某种后果；“招来”体现负面后果意味，并自然表达将来指向。
- source_word: ὀργήν
  choice: 忿怒
  rationale: ὀργή可指怒气，也常带严厉、审判性的色彩；“忿怒”保持经文语体的庄重感，却不擅自补明忿怒的主体。
theological_decisions:
- issue: “忿怒”的主体与性质
  choice: 正文只译“忿怒”，不注明是谁的忿怒
  alternative: 上帝的忿怒；惩罚；怒气
  rationale: 原文仅有ὀργήν，没有明说上帝，也没有直接将其等同于惩罚。保留未说明的主体，可避免把可能的神学含义写成原文明确陈述。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“两类事……第三类……”保留智慧文学的列举句式；“招来忿怒”简洁有力，不额外补入神学主体。
