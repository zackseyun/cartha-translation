  yaml_path: translation/deuterocanon/sirach/023/001.yaml
  text: Lord, Father and Master of my life, do not abandon me to their counsel; do not let me fall by them.
translation:
  language: zh_hans
  text: 主啊，我生命的父和主宰，求你不要在他们的谋划中弃我不顾；不要让我在他们中间跌倒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他们中间”也可按语境理解为“因他们而”或“借着他们”；原文的介词短语含义未完全限定。
    reason: 保留 ἐν αὐτοῖς 可具位置性以及可能的原因性或工具性理解，避免将其限定为单一关系。
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: 保留呼格语气，以现代汉语祷告用语自然表达。
- source_word: πάτερ καὶ δέσποτα ζωῆς μου
  choice: 我生命的父与主宰
  rationale: 按希腊语并列结构，将“父”与“主宰”都理解为对同一位主的称呼；“主宰”体现 δεσπότης 所含的权柄。
- source_word: βουλῇ αὐτῶν
  choice: 他们的谋算
  rationale: βουλή 可指主意、谋划或计谋；语境带有求保护的意味，故用“谋算”，同时不具体指明代词所指。
- source_word: μὴ ἀφῇς με πεσεῖν
  choice: 不要任凭我……跌倒
  rationale: ἀφίημι 在此表示容许、任由；“跌倒”保留 πεσεῖν 可兼具实际与道德失败含义的张力。
- source_word: ἐν αὐτοῖς
  choice: 因他们而
  rationale: 介词短语可表达处于其中，也可带工具或原因色彩；正文采用较通顺且符合上下文的“因他们而”，并以脚注保留另一种理解。
theological_decisions:
- issue: “父”与“主宰”的关系
  choice: 二者并列修饰“主”
  alternative: 把“主”与“父”理解为不同对象
  rationale: 希腊语三个呼格形式自然构成对同一对象的连续称呼，不需引入额外的位格区分。
- issue: “跌倒”的性质
  choice: 保留未限定的“跌倒”
  alternative: 明确译成“犯罪”或“灭亡”
  rationale: 原文未限定跌倒是道德、言语还是处境上的失败，故不作神学性窄化。
translation_notes:
  register: 采用庄重而自然的现代祷告语体。“父”比“父亲”更适合作为直接称呼，并与“主宰”保持简洁、对称；不补明“他们”所指，以免越过本节希腊文本提供的信息。
