base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/027.yaml
  text: And those who are left behind will know that nothing is better than the fear of the Lord, and nothing is sweeter than paying attention to the commandments of the Lord.
translation:
  language: zh_hans
  text: 那些被留下的人[a]必会知道：没有什么比敬畏主更好，也没有什么比听从主的诫命[b]更甘甜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那些留下来的人”，也可理解为“幸存者”。希腊文直译为“那些被留下的人”。
    reason: lexical_alternative
  - marker: b
    text: “听从”也可译作“留心遵从”。原文动词含有专心留意并作出响应的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώσονται
  choice: 必会知道
  rationale: 将来时表示他们终将认识到这一事实；“知道”自然简洁，“必会”体现此处确定的将来意义。
- source_word: οἱ καταλειφθέντες
  choice: 那些被留下的人
  rationale: 保留希腊文被动分词“被留下”的字面意义，不擅自限定为灾后幸存者或神学意义上的余民。
- source_word: οὐδὲν κρεῖττον
  choice: 没有什么……更好
  rationale: 准确保留绝对比较结构，符合现代汉语表达。
- source_word: φόβου Κυρίου
  choice: 敬畏主
  rationale: “敬畏主”是智慧文学中的核心表达，兼含畏惧、尊崇和顺服，不宜缩减为单纯的“尊敬”。
- source_word: γλυκύτερον
  choice: 更甘甜
  rationale: 保留“甜”的比喻及格言的诗性；“甘甜”在庄重而自然的圣经汉语中清楚可懂。
- source_word: τοῦ προσέχειν
  choice: 听从
  rationale: προσέχειν 表示留意、专心听取并作出响应；与“诫命”搭配时，“听从”比仅仅“注意”更自然，也保留响应性的含义。
- source_word: ἐντολαῖς Κυρίου
  choice: 主的诫命
  rationale: “诫命”准确表达 ἐντολαί，并保持适度的经文语体。
theological_decisions:
- issue: 智慧文学中“敬畏主”的含义
  choice: 保留“敬畏主”这一传统核心用语
  alternative: 尊崇主；对主心存敬畏
  rationale: 原文 φόβος 的语义张力包括畏惧、敬重、敬虔与顺服；固定表达“敬畏主”能够保留其丰富性，避免解释性窄化。
- issue: “被留下的人”的身份
  choice: 不明确解释其为“幸存者”或“余民”
  alternative: 幸存者；余民
  rationale: 原文只明确说“被留下的人”，具体身份须由上下文判断；译文保留这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“敬畏主”和“诫命”保留智慧文学的传统术语；全句保持原文两个“没有什么”的平行格言结构。
