base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/011.yaml
  text: A man who swears many oaths will be filled with lawlessness[a], and the whip will not depart from his house. If he stumbles, his sin is upon him; and if he disregards it, he has sinned doubly. And if he swore in vain, he will not be justified[d][c][b], for his house will be filled with afflictions.
translation:
  language: zh_hans
  text: 惯于多发誓的人，必充满不法；刑鞭[a]必不离开他的家。他若犯了过错，罪就在他身上；若又不把这罪当回事，他就是犯了双重的罪[b]。他若发了空誓[c]，必不能被判为义；因为他的家必充满灾祸[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刑鞭”也可译作“灾殃”或“惩罚”。希腊词 μάστιξ 本指鞭子，也可比喻惩罚性的灾祸。
    reason: lexical_alternative
  - marker: b
    text: 或译：“若又忽视这罪，他就是犯了两次罪。”这里表示轻看原先的过错，会使罪责加重。
    reason: lexical_alternative
  - marker: c
    text: “空誓”直译为“借着空虚而起的誓”；也可能指“徒然起誓”或“发假誓”。
    reason: lexical_alternative
  - marker: d
    text: 译作“灾祸”的希腊词较难确定具体含义，可指临到或被施加的患难、惩罚。
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνὴρ πολύορκος
  choice: 惯于多发誓的人
  rationale: πολύορκος描述一个以频繁起誓为特征的人；译作“惯于多发誓”比生硬的“多誓的人”自然，同时保留其习惯性。
- source_word: πλησθήσεται ἀνομίας
  choice: 必充满不法
  rationale: ἀνομία指违背律法或道德秩序，不只是一般错误；“不法”保留其力度。
- source_word: μάστιξ
  choice: 刑鞭
  rationale: 该词本义为鞭子，也可喻指惩罚或灾殃；“刑鞭”既保留具体意象，也显明惩戒语境。
- source_word: πλημμελήσῃ
  choice: 犯了过错
  rationale: 该动词可指失误、犯错或犯罪，但原文没有明确表达“无意”；“犯了过错”保留道德责任而不作过度限定。
- source_word: ἁμαρτία αὐτοῦ ἐπʼ αὐτῷ
  choice: 罪就在他身上
  rationale: 保留希腊文具体的责任归属表达，表示此人亲自承担其罪责。
- source_word: ὑπερίδῃ
  choice: 不把这罪当回事
  rationale: 该词在此表示忽视、轻看前述过错；此译自然表达轻忽罪责的含义。
- source_word: ἥμαρτεν δισσῶς
  choice: 犯了双重的罪
  rationale: δισσῶς表示罪责因轻忽原先的过错而加重或叠加；“双重的罪”保留其明确结构。
- source_word: διὰ κενῆς ὤμοσεν
  choice: 发了空誓
  rationale: 希腊文直译涉及“空虚、无实”；“空誓”保留原有意象，不武断地缩窄为伪誓或假誓。
- source_word: οὐ δικαιωθήσεται
  choice: 必不能被判为义
  rationale: 保留δικαιόω的司法与道德判定色彩，又不把它在智慧文学中的用法直接等同于后来的教义术语。
- source_word: ἐπαγωγῶν
  choice: 灾祸
  rationale: 该词在这里指临到或被施加的患难、惩罚，具体所指不完全确定；“灾祸”自然且不过度限定。
theological_decisions:
- issue: δικαιωθήσεται在智慧文学中的含义
  choice: 必不能被判为义
  alternative: 必不能获判无罪／必不能被开脱
  rationale: 上下文涉及起誓所招致的罪责和惩罚，因此保留司法与道德判定的意味，同时避免引入后期有关“称义”的特定宗派解释。
- issue: 轻忽过错与“双重犯罪”的关系
  choice: 若又不把这罪当回事，他就是犯了双重的罪
  alternative: 若他忽略此事，他就是犯了两次罪
  rationale: 原文没有详解“双重”的机制；译文只呈现轻忽使罪责叠加这一关系，不进一步规定其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留智慧文学的因果与警戒节奏；“刑鞭”“罪就在他身上”“被判为义”等表达适度保留原文意象和司法色彩，疑难词义则用脚注呈现，不在正文中强行消解。
