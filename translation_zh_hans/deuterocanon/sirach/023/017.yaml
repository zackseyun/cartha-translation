  yaml_path: translation/deuterocanon/sirach/023/017.yaml
  text: To a promiscuous man every bread is sweet[b][a]; he will not stop until he comes to his end.
translation:
  language: zh_hans
  text: 淫乱的人觉得什么饼都香甜[a]；他绝不会停下来，直到走到尽头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各种饼都香甜。”这里的饼很可能比喻不加选择的欲求，并非只是在谈食物。
    reason: lexical_alternative
  - marker: b
    text: 或译：“直到他死去。”希腊语动词可特指死亡，也可表示走到终点。
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνῳ
  choice: 淫乱的人
  rationale: 指惯常从事不正当性行为的人；“淫乱”在现代汉语中自然、庄重，也不把含义限于卖淫。
- source_word: πᾶς ἄρτος
  choice: 什么饼都
  rationale: 保留原文“饼”的具体意象，同时用“什么……都”的汉语结构表达 πᾶς 的概括性，暗示不加选择的欲求而不明说其所指。
- source_word: ἡδύς
  choice: 香甜
  rationale: 既符合饼的味觉意象，也传达“甘美、可喜悦”的含义，并保留箴言中的反讽。
- source_word: οὐ μὴ κοπάσῃ
  choice: 他绝不会停下来
  rationale: οὐ μή 加虚拟式构成强烈否定；“绝不会停下来”以自然汉语体现其强调语气和持续不止之意。
- source_word: ἕως ἂν τελευτήσῃ
  choice: 直到走到生命的尽头
  rationale: τελευτάω 可指终结，也常指死亡；此译法保留“尽头”的宽度，同时让死亡含义在汉语中清楚可感。
theological_decisions:
- issue: 是否在正文中把“饼”的比喻直接解释为性对象或性欲
  choice: 保留“饼”的意象，不在正文中明说其喻指
  alternative: 译为“什么人都想要”或“任何女人都觉得可爱”
  rationale: 希腊文本本身使用饼的意象，上下文已表明淫乱主题；直接点明具体性对象会缩窄并过度解释原文。
- issue: τελευτήσῃ 应专指死亡还是保留较宽的终局含义
  choice: 译作“走到生命的尽头”
  alternative: 译作“直到他死去”或“直到走到尽头”
  rationale: 该动词可明确指死亡，也可表达达到终点；所选译法不把它泛化为纯粹的败亡，同时保留“尽头”的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“淫乱的人”概括人物的惯常行为；“什么饼都香甜”保留原文鲜明意象；“绝不会”传达希腊语强烈否定。正文脚注按出现顺序标为[a]、[b]。
