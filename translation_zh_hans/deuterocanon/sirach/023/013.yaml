  text: Do not accustom your mouth to crude ignorance, for in it there is a word of sin.
translation:
  language: zh_hans
  text: 不要让你的口习惯说粗野无知的言谈，因为其中有罪恶的话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαιδευσίαν ἀσυρῆ
  choice: 粗野无知的话
  rationale: ἀπαιδευσία表示缺乏教养、无知或粗鄙，ἀσυρῆ进一步强化其粗野不当的性质；结合“让你的口习惯”这一搭配，汉语补出“话”，使所指自然清楚，同时保留原文对粗俗无知言语的谴责。
- source_word: μὴ συνεθίσῃς τὸ στόμα σου
  choice: 不要让你的口习惯
  rationale: 贴近原文使役性表达，保留“口”这一身体意象，而不改写成单纯的“不要说”。
- source_word: λόγος ἁμαρτίας
  choice: 犯罪的言语
  rationale: 保留λόγος的“言语”含义，并将属格ἁμαρτίας自然表达为带有罪性的、构成犯罪的言语；不额外限定为某一种具体罪。
theological_decisions:
- issue: λόγος ἁμαρτίας所表达的是“罪性言语”还是“导致犯罪的言语”
  choice: 犯罪的言语
  alternative: 使人犯罪的话
  rationale: 原文属格关系可容纳性质或关联等理解；“犯罪的言语”较少预断因果关系，保留其简洁和一定程度的张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“让你的口习惯”保留原文意象；“粗野无知的话”避免生硬地把抽象名词直接作为“口所习惯”的宾语。
