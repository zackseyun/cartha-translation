  yaml_path: translation/deuterocanon/sirach/023/020.yaml
  text: Before all things were created[a], it was known to him; so also after they are completed.
translation:
  language: zh_hans
  text: 万物在受造以前，就已为他所知[a]；在完成以后，也同样如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万物在受造以前，他就已经知道；在完成以后，也是如此。”希腊语ἔγνωσται也可用主动句表达，但原文形式着重于“已经为他所知”的状态。
    reason: 保留ἔγνωσται在语态和汉语表达上的译法选择。
lexical_decisions:
- source_word: πρὶν ἢ
  choice: 在……以前
  rationale: 清楚表达时间上的先于关系，也符合现代汉语习惯。
- source_word: κτισθῆναι
  choice: 受造
  rationale: 保留κτίζω不定过去时被动不定式的被动意义；“受造”简洁而庄重。
- source_word: τὰ πάντα
  choice: 万物
  rationale: 概括一切受造之物，既自然又保留原文全面涵盖的范围。
- source_word: ἔγνωσται
  choice: 就已为……所知
  rationale: 保留完成时所表达的既成、持续状态，也尽量反映原文被动形式，而不直接改写为主动句。
- source_word: αὐτῷ
  choice: 为他所知
  rationale: 以“他”保留原文代词，不在正文中增补“上帝”；所指由上下文确定。
- source_word: οὕτως καὶ
  choice: 也同样如此
  rationale: 明确呈现前后两个时点之间的对应关系。
- source_word: μετὰ τὸ συντελεσθῆναι
  choice: 在完成以后
  rationale: 保留原文名词化不定式的概括性，不强行说明究竟是万物、创造过程或一切事情的完成。
theological_decisions:
- issue: αὐτῷ所指对象
  choice: 正文译作“他”，由上下文指向上帝
  alternative: 直接译作“上帝”
  rationale: 原文只用代词；保留代词可避免把上下文信息直接加入本节。
- issue: ἔγνωσται的语态与主语关系
  choice: 译作被动状态“已为他所知”
  alternative: 译作主动句“他就已经知道万物”
  rationale: 希腊语形式容许不同表达；采用被动句更贴近原文形态，并保留其表述上的含混，同时脚注列出自然的主动译法。
- issue: 完成以后所完成的对象
  choice: 只译“在完成以后”
  alternative: 译作“万物完成以后”或“一切终结以后”
  rationale: 原文没有明说该不定式的主语；概括表达可避免把它限定为创造完成或末世终结。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“受造”“万物”符合智慧文学语境；后半句维持原文的简练和指涉开放性。
