  text: She will be brought out before the assembly[a], and there will be an inspection concerning her children.
translation:
  language: zh_hans
  text: 这女人必被带到会众面前，她的儿女也必受到查验[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “查验”也可译为“将有临到她儿女身上的察访”；这可能含有司法追究或惩处的意味，而不只是审查。
    reason: 保留ἐπισκοπή及ἐπί结构在审察与可能带惩罚性的“临到”之间的语义张力，并使替代译法完整自然。
lexical_decisions:
- source_word: αὕτη
  choice: 这女人
  rationale: 阴性指示代词承接上文所说的淫妇；译作“这女人”在本节中指代清楚，也保留指示语气。
- source_word: ἐκκλησίαν
  choice: 会众
  rationale: 这里指聚集的共同体，而非后世制度化意义上的“教会”；“会众”自然地表达公开、群体性的场合。
- source_word: ἐξαχθήσεται
  choice: 必被带到……面前
  rationale: 保留将来被动语态，并传达被公开带出、呈到群体面前的意味。
- source_word: ἐπὶ τὰ τέκνα αὐτῆς
  choice: 她的儿女也必受到
  rationale: ἐπί在此可表示查验所临到或针对的对象；汉语以受事结构表达，同时不在正文中断定其必为惩罚。
- source_word: ἐπισκοπὴ
  choice: 查验
  rationale: 此词可指察看、查验或临到性的处置，并可能带司法意味；正文用“查验”保留正式审察的语气，较强的惩处可能性置于脚注。
- source_word: ἔσται
  choice: 必
  rationale: 配合“受到查验”自然表达将来发生之事，简洁地对应希腊文将来时。
theological_decisions:
- issue: ἐκκλησία是否采用后世教会术语
  choice: 会众
  alternative: 教会；集会
  rationale: 本节是智慧文学中共同体公开审断的场景，并非特指后世基督教制度；“会众”既准确又不引入时代错置。
- issue: ἐπισκοπή应译得多具惩罚性
  choice: 正文作“查验”
  alternative: 临到；追究；惩罚
  rationale: 该词既可表示审查，也可能表示带审判或惩处意味的临到。正文不把歧义单方面解释为惩罚，脚注则保存较强的司法含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这女人”承接上下文，“会众”避免误读为后世制度化的教会；全句保持公开审断场景的严肃语气。
