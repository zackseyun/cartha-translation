  text: and turn desire away from me;[a]
translation:
  language: zh_hans
  text: 也求你使欲望远离我；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“情欲”或“强烈的欲求”。希腊语这个词可指带有负面道德含义的强烈欲望。
    reason: 词义备选
lexical_decisions:
- source_word: καὶ
  choice: 也求你
  rationale: καί承接前文祷告；汉语补出“求你”，使所承接的祈求关系自然清楚，并与命令式动词的祷告语气相合。
- source_word: ἐπιθυμίαν
  choice: 欲望
  rationale: 该词可泛指强烈欲求，并常在具体语境中带负面道德色彩；“欲望”保留其较宽的词义范围，不把它限定为性方面的“情欲”。
- source_word: ἀπόστρεψον
  choice: 使……远离
  rationale: 该不定过去时命令式请求采取明确行动；“使……远离”保留使某物转离说话者的意象，也符合现代汉语表达。
- source_word: ἀπʼ ἐμοῦ
  choice: 远离我
  rationale: 介词短语表达与说话者分离；译作“远离我”准确自然，且不额外解释为“从我里面”。
theological_decisions:
- issue: ἐπιθυμία的道德含义与范围
  choice: 译作范围较广的“欲望”
  alternative: “情欲”“贪欲”“邪欲”
  rationale: 原文在此没有明确把欲求限定为性欲、贪婪或某一特定罪性冲动。采用“欲望”保存词义张力，由上下文显明其负面含义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“也”体现本句对前文的承接；句末分号保留来源文本所显示的未完祷告结构。
