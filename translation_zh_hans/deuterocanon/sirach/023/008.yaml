    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τοῖς χείλεσιν αὐτοῦ
  choice: 因自己的嘴唇
  rationale: ἐν 在此可表凭借或工具；译作“因自己的嘴唇”既保留“嘴唇”的具体意象，也自然表达一个人因自己的言语而遭祸。
- source_word: καταλειφθήσεται
  choice: 必……被困住
  rationale: 该动词通常意为“被留下”或“被撇弃”，但在这里与后句“绊倒”平行，语境很可能指罪人被自己的言语困住或败坏。正文采用合乎汉语语境的“被困住”，并以脚注保留较直译的可能。
- source_word: ἁμαρτωλός
  choice: 罪人
  rationale: 单数名词在智慧文学格言中泛指具有这一特征的人；“罪人”简洁而自然。
- source_word: λοίδορος
  choice: 辱骂人的
  rationale: 指惯于辱骂、恶言攻击别人的人。“辱骂人的”比生硬的名词化表达更符合现代汉语，同时保留言语伦理的重点。
- source_word: ὑπερήφανος
  choice: 骄傲的人
  rationale: 表达傲慢、自高之人；“骄傲的人”通俗、庄重，不额外引入宗派性含义。
- source_word: σκανδαλισθήσονται
  choice: 必……绊倒
  rationale: 保留原文跌绊、失足以致败落的比喻，不将其解释为后期神学术语。
- source_word: ἐν αὐτοῖς
  choice: 因这些嘴唇
  rationale: αὐτοῖς 最自然地回指复数的“嘴唇”。明译为“这些嘴唇”可避免汉语代词所指含混，并与首句形成平行。
