  text: She will leave her memory for a curse, and her disgrace will not be wiped away.
translation:
  language: zh_hans
  text: 她留下的名声必成为咒诅，她的耻辱也不会被抹去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλείψει
  choice: 留下
  rationale: 这是καταλείπω的将来时；此处指她身后留下的后果，而不是抛弃某人。“留下”自然地表达这一含义。
- source_word: εἰς κατάραν
  choice: 必成为咒诅
  rationale: εἰς加宾格在此表示结果。“成为咒诅”清楚表达她被人记起时将与咒诅相连，也保留原文强烈的负面意味。
- source_word: τὸ μνημόσυνον αὐτῆς
  choice: 她留下的名声
  rationale: μνημόσυνον可指纪念、记忆或后世对某人的记述；这里不是实体纪念物，而是她身后留在人们中间的记忆和声名。“名声”在中文语境中较自然，并与后句的公开耻辱相呼应。
- source_word: τὸ ὄνειδος αὐτῆς
  choice: 她的耻辱
  rationale: ὄνειδος指羞辱、耻辱或受人非议，兼有社会性的公开羞耻。“耻辱”准确而庄重。
- source_word: οὐκ ἐξαλειφθήσεται
  choice: 不会被抹去
  rationale: 这是ἐξαλείφω的将来被动式，字面意象是擦掉或涂抹掉。“不会被抹去”保留原文比喻，也符合现代汉语。
theological_decisions:
- issue: 上下文对行淫妇人所受道德后果的严厉表述
  choice: 保留她身后名声成为咒诅、耻辱无法抹去的鲜明警告，不作弱化或扩充。
  alternative: 可泛化为坏名声长存，或增译为明确的上帝审判。
  rationale: 希腊文明确提到记念、咒诅和耻辱，却没有在本句进一步说明施行审判者或其机制。译文保留智慧文学警告的严厉程度，同时不加入原文未明说的教义解释。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“她留下的名声”比直译“她的记念”更易为普通读者理解；两个分句以“必……也不会……”呈现将来的确定后果。
