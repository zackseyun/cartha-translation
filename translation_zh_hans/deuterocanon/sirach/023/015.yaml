  text: A man accustomed to words of reproach will never be disciplined all his days[a][b].
translation:
  language: zh_hans
  text: 惯于说侮辱人的话的人，一生绝不会受管教。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侮辱人的话”也可译作“辱骂人的话”或“羞辱人的话”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文采用加强否定，直译为“绝不会受管教”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: 人
  rationale: 这里是泛指单个的人；现代汉语用“人”自然涵盖此义，无须硬译出希腊语的语法性别。
- source_word: συνεθιζόμενος
  choice: 惯于
  rationale: 表达因反复而养成习惯的状态，简洁自然，并保留其习惯性含义。
- source_word: λόγοις ὀνειδισμοῦ
  choice: 说辱骂话
  rationale: ὀνειδισμός可指责骂、羞辱或辱骂；结合“话语”，译作“说辱骂话”符合现代汉语习惯，同时保留言语伤害的力度。
- source_word: ἐν πάσαις ταῖς ἡμέραις αὐτοῦ
  choice: 一生
  rationale: 直译为“在他所有的日子里”，是指其全部人生；“一生”是自然凝练的对应表达。
- source_word: οὐ μὴ παιδευθῇ
  choice: 都不会受管教
  rationale: οὐ μή加强否定，表示断然不会；παιδεύω兼有教育、训练、纠正和管教之意，此处采用“受管教”以保留智慧文学中的道德塑造意味。
theological_decisions:
- issue: παιδευθῇ所指的教育或惩戒范围
  choice: 受管教
  alternative: 受教导／被纠正
  rationale: 原词兼具教育、训练与纠正的张力。“受管教”较能兼顾训诲和规正，而不把含义缩限为知识传授或单纯惩罚。
translation_notes:
  register: 采用现代、庄重而通俗的智慧文学语体。主句简洁有力；“惯于说……”呈现长期形成的言语习惯，“一生都不会”传达原文加强否定的力度。
