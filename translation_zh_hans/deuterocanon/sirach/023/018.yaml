  text: A man transgressing from his bed says in his soul[a], “Who sees me?”
translation:
  language: zh_hans
  text: 一个离弃自己床榻而越轨的男人，心里说：“谁看得见我？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος
  choice: 一个……的男人
  rationale: 原词为单数，在此指一名具有代表性的男性；上下文涉及男人所犯的隐秘性罪，因此保留性别信息。
- source_word: παραβαίνων
  choice: 背离
  rationale: 该分词含越界、违犯或偏离之意。“背离”既保留道德过犯的意味，也能与“床榻”构成含蓄表达，而不直接增译为“通奸”。
- source_word: ἀπὸ τῆς κλίνης αὐτοῦ
  choice: 自己床榻
  rationale: κλίνη可指床或卧榻；“床榻”在现代中文中庄重且可懂，并保留原文借床榻暗示婚姻与性关系的委婉说法。
- source_word: λέγων ἐν τῇ ψυχῇ αὐτοῦ
  choice: 心里说
  rationale: 这是表示内心自语的惯用结构。“心里说”自然传达其意义；若直译为“在自己的魂里说”，现代中文会显得生硬，并可能造成原文没有的身心区分。
- source_word: Τίς με ὁρᾷ;
  choice: 谁看得见我？
  rationale: 准确表达现在时疑问及说话者自以为无人察觉的心理；“看得见”比“看见”更自然地呈现其对隐蔽性的确信。
theological_decisions:
- issue: 是否在正文中明说通奸或离开婚床
  choice: 保留“背离自己床榻”的委婉表达
  alternative: 一个离开婚床的男人；一个犯奸淫的男人
  rationale: 本节上下文强烈指向隐秘的性罪，但本句没有直接使用“通奸”一词。正文保留原文的含蓄和道德张力，脚注说明其语境含义，避免把推论写成明说。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“背离……床榻”有意保留原文略显含蓄的表达；“心里说”则按现代汉语习惯处理内心自语。
