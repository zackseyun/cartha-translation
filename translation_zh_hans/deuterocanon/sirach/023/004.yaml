  text: Lord[a], Father and God of my life, do not give me haughty eyes,
translation:
  language: zh_hans
  text: 主啊，我生命的父和上帝，不要让我有高傲的眼目[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“抬高的眼目”或“傲慢的眼目”；这个希腊短语也可较直译为“眼目的浮动不定”或“眼目的不安”。
    reason: 保留μετεωρισμὸν ὀφθαλμῶν可指高傲、抬高，也可较字面地指浮动不定或不安的词义幅度。
lexical_decisions:
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος在此为呼格，用来称呼上帝；“主啊”符合现代汉语祷告语体，也保留原文的直接呼求。
- source_word: πάτερ
  choice: 我的父
  rationale: πάτερ是直接称呼上帝的呼格。“我的”由祷告者与受称呼者的关系自然引出，使汉语表达清楚流畅，并与后面的“我生命的上帝”协调。
- source_word: θεὲ ζωῆς μου
  choice: 我生命的上帝
  rationale: 保留属格结构的简洁和一定开放性，不具体解释为“赐我生命的上帝”，以免把原文可能包含的统管、维系或赐予生命之意限定为一种。
- source_word: μετεωρισμὸν ὀφθαλμῶν
  choice: 眼目高傲
  rationale: 该短语在此智慧祷文的伦理语境中，最自然地指由眼神显出的自高或傲慢；同时以脚注保留“眼目浮动不定”等较贴近字面的可能理解。
- source_word: μὴ δῷς μοι
  choice: 不要使我
  rationale: 字面可译“不要给我”，但与“眼目高傲”搭配时，“不要使我”是更自然的现代汉语祈求表达，且不改变否定祈使的力量。
theological_decisions:
- issue: μετεωρισμὸν ὀφθαλμῶν的道德含义
  choice: 理解为眼目高傲，即傲慢从目光中流露
  alternative: 眼目浮动不定、眼目游移或不安
  rationale: 上下文是求上帝保守祷告者远离恶习，“高傲的眼目”符合圣经智慧传统中的道德意象；但该希腊词也可涉及抬高、浮动或不安，因此不把其他理解从注释中删去。
- issue: θεὲ ζωῆς μου中属格的关系
  choice: 保留为“我生命的上帝”
  alternative: 赐我生命的上帝
  rationale: 原文没有明确限定属格是来源、所属还是统管关系；较形式化的表达可保存这种神学张力，避免加入单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主啊，我的父，我生命的上帝”依次呈现三个呼格成分；正文选择自然的道德性表达“眼目高傲”，脚注则保存希腊语短语的词义歧义。
