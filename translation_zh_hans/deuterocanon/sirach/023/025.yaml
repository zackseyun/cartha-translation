  text: Her children will not take root[a], and her branches will not bear fruit;
translation:
  language: zh_hans
  text: 她的儿女必不能扎根，她的枝条也必不结果子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ διαδώσουσιν τὰ τέκνα αὐτῆς εἰς ῥίζαν
  choice: 她的儿女必不能扎根
  rationale: διαδώσουσιν本有“伸展、扩展”之意，与εἰς ῥίζαν构成较压缩的植物意象。汉语译作“扎根”自然清楚，也保留后文“枝条、果子”所延续的植物比喻；主语仍直译为“她的儿女”，不改成解释性的“后代”。
- source_word: οἱ κλάδοι αὐτῆς
  choice: 她的枝条
  rationale: κλάδοι指枝条或树枝；“枝条”既符合现代汉语，又与扎根、结果子的连续植物意象协调。
- source_word: οὐ δώσουσιν καρπόν
  choice: 也必不结果子
  rationale: δώσουσιν καρπόν字面为“给出果子”，汉语植物语境通常说“结果子”。“也”自然表达希腊语καί在并列否定句中的连接作用。
theological_decisions:
- issue: 上下文中对那女子及其儿女的审判所采用的家族与植物双重意象
  choice: 保留“儿女—扎根”和“枝条—结果子”的比喻，不进一步说明审判的具体社会或永恒后果。
  alternative: 译成“她的后代不能立足，也不会繁衍”，直接解释比喻。
  rationale: 希腊文本以植物意象陈述后果，却没有在本节内明确解释其范围。保留意象可避免把“不能扎根”和“不结果子”收窄为某一种教义性或社会性结局。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“必不能……也必不……”传达两个将来否定陈述的确定语气；全句保持简洁，并保留原文的平行结构与植物意象。
