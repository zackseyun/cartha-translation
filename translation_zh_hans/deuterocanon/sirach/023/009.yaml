  yaml_path: translation/deuterocanon/sirach/023/009.yaml
  text: Do not accustom your mouth to an oath[a], and do not become accustomed to invoking the Holy One by name.
translation:
  language: zh_hans
  text: 不要使你的口习惯于起誓，也不要习惯于呼求圣者的名[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼求圣者的名”也可译作“称念圣者”或“提及圣名”。希腊语原词可指称名、提名或借某名呼求；在本节关于起誓的语境中，可能带有不可轻率、惯常使用神圣名号的含义。
    reason: 保留ὀνομασίᾳ τοῦ ἁγίου在“称念圣者”与“使用圣名”之间的词义和句法歧义。
lexical_decisions:
- source_word: ὅρκῳ
  choice: 起誓
  rationale: 与ἐθίζω搭配，表示使口养成起誓的习惯；中文用动宾结构比直译为“誓言”自然，同时保留对惯常起誓的警戒。
- source_word: μὴ ἐθίσῃς
  choice: 不要让……习惯
  rationale: 保留ἐθίζω使役性的“使……养成习惯”，并以“你的口”为宾语。
- source_word: τὸ στόμα σου
  choice: 你的口
  rationale: 保留原文具体的身体意象，也符合智慧文学关于言语伦理的表达。
- source_word: ὀνομασίᾳ
  choice: 呼求……的名
  rationale: 该词可指称名、提名或藉名呼求；在起誓语境中，“呼求……的名”自然地传达援引神名之意，同时用脚注保留其他理解。
- source_word: τοῦ ἁγίου
  choice: 圣者
  rationale: 将带冠词的形容词理解为对上帝的敬称，但不扩写成原文未明说的专名或教义称号。
- source_word: μὴ συνεθισθῇς
  choice: 不要惯于
  rationale: 传达被动或渐成意义，即不要形成根深蒂固的习惯；简洁自然，并与前句“让……习惯”略作区分。
theological_decisions:
- issue: τοῦ ἁγίου的所指
  choice: 理解为对上帝的敬称“圣者”
  alternative: 理解为“圣名”，或较泛化的“神圣之物”
  rationale: 上下文涉及起誓及神圣称名，“圣者”最可能指上帝；这样既保留所指，也不把“圣名”的转喻性理解直接写入正文。
- issue: 禁令的伦理范围
  choice: 警戒养成惯常起誓及惯常援引神名的习惯
  alternative: 理解为禁止一切形式的起誓
  rationale: 两句均以“习惯、惯于”的词汇为重点，原文直接针对习以为常的行为；不宜据此替文本裁定所有庄严誓言是否绝对受禁。
- issue: ὀνομασίᾳ τοῦ ἁγίου的句法与意义
  choice: 正文译为“呼求圣者的名”
  alternative: 译为“提说圣者”或“提说圣名”
  rationale: 该短语容许“称名、援名”的解释；正文选取符合誓言语境的自然中文，脚注明确保留真实的词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你的口”保留原文意象；“让……习惯／惯于”再现两处习惯性动词的呼应，避免把经文扩大为对一切誓言的无条件裁断。
