base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/023.yaml
  text: For first[a], she disobeyed the law of the Most High; and second, she committed an offense against her husband; and third, in sexual immorality she committed adultery and presented children from another man.
translation:
  language: zh_hans
  text: 因为：第一，她违背了至高者的律法；第二，她得罪了自己的丈夫；第三，她在淫乱中犯了奸淫，并生下了别的男人所生的孩子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “生下了”所译的希腊词较直译可作“带出”或“呈现”；这里按语境指她生下了由别的男人所生的孩子。
    reason: 说明 παρίστημι 的较字面含义及其在此处与“孩子”及“从别的男人而来”连用时的语境化译法。
lexical_decisions:
- source_word: πρῶτον μὲν ... καὶ δεύτερον ... καὶ τὸ τρίτον
  choice: 第一……第二……第三
  rationale: 保留希腊文清楚的三重列举；以“因为”表达解释性的 γάρ，使汉语衔接自然。
- source_word: ἐν νόμῳ Ὑψίστου ἠπείθησεν
  choice: 违背了至高者的律法
  rationale: “违背……律法”自然表达 ἀπειθέω 在律法规范方面的不顺从；“至高者”保留神圣称号而不增添原文未明说的“上帝”。
- source_word: εἰς ἄνδρα ἑαυτῆς ἐπλημμέλησεν
  choice: 得罪了自己的丈夫
  rationale: ἐπλημμέλησεν 指犯错或冒犯；“得罪”既自然，也不提前把第二项完全等同于第三项明说的奸淫。
- source_word: ἐν πορνείᾳ ἐμοιχεύθη
  choice: 在淫乱中犯了奸淫
  rationale: 同时保留 πορνεία 的广义性不道德和 μοιχάομαι 的婚姻不忠含义，并反映原文两词并用。
- source_word: ἐξ ἀλλοτρίου ἀνδρὸς τέκνα παρέστησεν
  choice: 生下了别的男人的孩子
  rationale: 此处 παρίστημι 结合“孩子从别的男人而来”的语境，指使这些孩子出现、带到世上；汉语用“生下”最清楚自然。脚注补充其较字面的表达。
theological_decisions:
- issue: 三项指控之间的层次
  choice: 分别译出违背神的律法、得罪丈夫、在淫乱中犯奸淫并生下他人之子
  alternative: 把第二、第三项合并为一次婚姻不忠的指控
  rationale: 原文刻意按第一、第二、第三列举；分别呈现可保留其修辞推进，也避免消除第二项较宽泛的措辞。
- issue: Ὑψίστου 的神圣称号
  choice: 至高者
  alternative: 至高的上帝
  rationale: “至高者”在现代汉语中可作为神圣称号，并避免加入希腊文此处未明说的 θεός。
- issue: ἐμοιχεύθη 的语态表达
  choice: 犯了奸淫
  alternative: 被奸淫
  rationale: 该形式虽在形态上为被动式，但上下文将此行为列为她本人的过犯；汉语主动表达传达语境中的实际意义，同时不引申额外的受害含义。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“第一……第二……第三”保留原文的法庭式列举；“淫乱”和“奸淫”虽语义相关，但有意并列，以保存原文 πορνεία 与 μοιχεία 之间的张力。
