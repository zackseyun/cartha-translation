base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/014.yaml
  text: Remember your father and your mother[a], for you sit in the midst of great men; lest you be forgotten before them, and by your habit become foolish, and wish that you had not been born[b], and curse the day of your birth.
translation:
  language: zh_hans
  text: 要记得你的父亲和母亲，因为你坐在权贵[b]中间；免得你在他们面前失了分寸[a]，因自己的习性而显得愚蠢，以致宁愿自己从未出生，并咒诅自己出生的那一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得你在他们面前被遗忘（或被忽视）。”这里的希腊语形式可有不止一种理解；按上下文，也可指人在他们面前忘记自己、失去应有的分寸。
    reason: 保留ἐπιλαθῇ ἐνώπιον αὐτῶν的语法和语境歧义。
  - marker: b
    text: “权贵”原文为阳性词，指有权势或地位显赫的男人；也可译作“显要人物”或“贵族”。
    reason: 说明原词的性别形式及可选词义。
lexical_decisions:
- source_word: μνήσθητι
  choice: 要记得
  rationale: 不定过去时命令语气发出直接劝诫；“要记得”自然、明确，也保留主动留心的意味。
- source_word: πατρὸς καὶ μητρός σου
  choice: 你的父亲和母亲
  rationale: 原文分别点出父亲和母亲，因此不合并为较概括的“父母”。
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: 在权贵中间
  rationale: ἀνὰ μέσον表示“在……中间”；μεγιστάνων指有权势或地位崇高的人，“权贵”比字面的“伟人”更准确地传达社会身份。
- source_word: συνεδρεύει
  choice: 正坐
  rationale: 该动词指与人同坐，常带议事或正式聚集的语境；“正坐”简洁保留画面，而不额外断定是在议会中。
- source_word: ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: 在他们面前忘乎所以
  rationale: 此处希腊语形式和语境可表达在权贵面前忘记自己应有的分寸；“忘乎所以”以自然汉语传达失去自制或礼数，同时用脚注保留被动式理解。
- source_word: τῷ ἐθισμῷ σου
  choice: 因自己的习性
  rationale: ἐθισμός指习惯或惯常行为，所用与格表示原因或手段；“习性”较自然，并未擅自加入“恶习”。
- source_word: μωρανθῇς
  choice: 变得愚蠢
  rationale: 保留该动词的结果意味，即因惯常表现而陷入或显出愚蠢。
- source_word: θελήσεις εἰ μὴ ἐγεννήθης
  choice: 巴不得自己从未出生
  rationale: 这是表达深切懊悔的希腊语结构；“巴不得……从未……”是清楚而有力度的现代汉语。
- source_word: τὴν ἡμέραν τοῦ τοκετοῦ σου
  choice: 自己出生的那一天
  rationale: τοκετός在此指生产、出生；此译具体自然，也保持原文所指的那一日。
- source_word: μὴ καταράσῃ
  choice: 又咒诅
  rationale: μή延续前面μή ποτε所引出的警戒后果，并非禁止咒诅的独立命令；“又”使它与“巴不得”同属所警告的后果。
theological_decisions:
- issue: ἐπιλαθῇ ἐνώπιον αὐτῶν的歧义
  choice: 在他们面前忘乎所以
  alternative: 在他们面前被遗忘／被他们忽视
  rationale: 上下文谈人在权贵中间因习性而显得愚蠢，反身意义“忘记自己、失去分寸”较连贯；但希腊语形式也容许被动式理解，故在脚注中保留，不将歧义悄然消除。
- issue: μεγιστάνων的性别与社会身份
  choice: 权贵
  alternative: 有权势的男人／显要人物／贵族
  rationale: 该阳性复数词在古代语境中指地位显赫、有权势者。“权贵”准确传达社会身份；脚注说明原词为阳性，以免中文无标记形式掩盖这一点。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“权贵中间”保留正式社交场景；“忘乎所以”和“巴不得”虽为现代惯用语，但语气有力且不俚俗。分号维持原句从劝诫转入警告的结构，末尾各后果依次推进。
