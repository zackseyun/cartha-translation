  text: So also a woman who leaves her husband and presents an heir by another man;[a]
translation:
  language: zh_hans
  text: 同样，一个女人离开自己的丈夫，又带来一个父亲是别的男人的继承人；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别的男人”直译可作“外人”或“另一个人的”。希腊语ἐξ ἀλλοτρίου在此指婚姻关系以外、并非其丈夫的男子。
    reason: 说明ἀλλότριος的字面义及其在婚姻语境中的所指。
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同样
  rationale: 承接上文的比较或例证，简洁保留“照样、也是如此”的衔接作用。
- source_word: γυνὴ
  choice: 一个女人
  rationale: γυνή可指“女人”或“妻子”；下文已用“自己的丈夫”明确婚姻关系，因此正文译作“一个女人”自然且不重复。
- source_word: καταλιποῦσα
  choice: 离开
  rationale: 该不定过去时分词陈述她离开丈夫的行为；“离开”不额外加入“遗弃”等更强烈的道德色彩。
- source_word: τὸν ἄνδρα
  choice: 自己的丈夫
  rationale: 在此婚姻语境中，ἀνήρ明确指她的丈夫；加入“自己的”符合现代汉语表达。
- source_word: παριστῶσα
  choice: 让……成为
  rationale: παρίστημι有使之呈现、提出之意；与“继承人”搭配时，译为“让……成为”能自然表达将某人置于继承人身份上的法律和家庭含义，同时避免误译为单纯“生下”。
- source_word: κληρονόμον
  choice: 继承人
  rationale: 标准对应“承受产业者、继承人”，保留家庭与法律层面的含义。
- source_word: ἐξ ἀλλοτρίου
  choice: 另一个男人所生的人
  rationale: ἐκ表示来源，ἀλλότριος指不属于丈夫一方的外人；此处即孩子出自婚姻之外的另一个男人。该译法在汉语中明确亲子来源，又保留“另一个/外人”的核心语义。
theological_decisions:
- issue: 本句对婚外关系及继承问题的道德—法律含义
  choice: 直接描述女人离开丈夫，并让另一个男人所生的人成为继承人，不在正文中另加“淫妇”“私生子”等标签。
  alternative: 同样，一个妻子遗弃丈夫，给外人生下一个继承人。
  rationale: 希腊文陈述行为及其继承后果，并未在本句直接使用道德身份称谓。所选译文保留上下文中的谴责张力，却不超出原文措辞。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“却”显出两个分词行为之间在语境中的反常张力，但不额外添加明确的道德标签。句末保留分号，以反映本节可能与下文持续相连。
