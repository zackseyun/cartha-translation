base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/002.yaml
  text: Who will set whips over my thoughts[a], and the discipline of wisdom over my heart, so that they may not spare me for my ignorances, and may not overlook their sins?
translation:
  language: zh_hans
  text: 谁能在我的心思上置下鞭子，在我的心上施行智慧的管教，使这些不因我无知所犯的过错而宽待我，也绝不略过他们的罪[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“他们的罪”。这句话接在“我无知所犯的过错”之后，代词所指不明；有些人按上下文理解为“我的罪”，或认为这里的代词有文本上的不规则现象。
    reason: 保留原文中难解的第三人称复数代词，并说明较顺畅的理解。
lexical_decisions:
- source_word: τίς ἐπιστήσει
  choice: 谁能……设下
  rationale: τίς引出修辞性的恳求；ἐπιστήσει有“安置、设立在……之上”之意。“谁能……设下”在现代汉语中自然，同时保留施加约束的图景。
- source_word: ἐπὶ τοῦ διανοήματός μου μάστιγας
  choice: 在我的意念上设下鞭子
  rationale: διανόημα可指思想、意念或心中的谋划；μάστιγας是具体的“鞭子”。译文保留严厉责罚的比喻，不弱化为一般性的提醒或引导。
- source_word: ἐπὶ τῆς καρδίας μου παιδείαν σοφίας
  choice: 把智慧的管教加在我的心上
  rationale: καρδία保留圣经中作为思想与意志中心的“心”；παιδεία兼有教导、训练和管教之意，此处与鞭子的意象并列，故采用“管教”。σοφίας译作“智慧的”，不限定为来源、内容或性质中的某一种关系。
- source_word: ἐπὶ τοῖς ἀγνοήμασίν μου
  choice: 因我无知所犯的过错
  rationale: ἀγνόημα指由于无知、不知情而犯的错误或过犯。此译法比直译“我的无知”更符合现代汉语，也保留它与随后ἁμαρτήματα“罪”的用词区别。
- source_word: μὴ φείσωνται
  choice: 不……宽待我
  rationale: φείδομαι意为宽免、顾惜或不予施罚；“我”是按语境补出的受事者。复数动词与前述鞭子和管教相呼应，因此译作“使它们……”。
- source_word: οὐ μὴ παρῇ
  choice: 也绝不放过
  rationale: οὐ μή构成强烈否定；παρέρχομαι在此有让某事过去、不予追究之意。“绝不放过”既体现强调语气，也符合现代汉语表达。
- source_word: τὰ ἁμαρτήματά αὐτῶν
  choice: 他们的罪
  rationale: 所据希腊文本明确使用αὐτῶν“他们的”。尽管上下文难解，正文不擅自改为“我的罪”，而以脚注说明。
theological_decisions:
- issue: 智慧管教的严厉责罚意象
  choice: 保留“鞭子”和“管教”的具体意象
  alternative: 弱化为“约束”“引导”或“劝诫”
  rationale: 经文祈求对内在思想与心施加严厉的道德训练。保留具体意象，才能呈现智慧传统中管教的严肃性。
- issue: “他们的罪”中的代词疑难
  choice: 正文保留“他们的罪”，并加脚注
  alternative: 按上下文顺译或校改为“我的罪”
  rationale: 希腊文本为αὐτῶν“他们的”，与前文第一人称表达衔接困难。为保存真实的文本张力，不在正文中默改代词。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“意念”“心”“管教”保持圣经智慧文学的语域；“设下鞭子”刻意保留原文鲜明而严厉的比喻。正文中的“他们的罪”虽不够顺畅，却忠实呈现所据希腊文本，并以脚注交代疑难。
