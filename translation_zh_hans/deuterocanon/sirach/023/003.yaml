  yaml_path: translation/deuterocanon/sirach/023/003.yaml
  text: so that my ignorances may not multiply[a], and my sins may not increase, and I may fall before my adversaries[b], and my enemy may rejoice over me.
translation:
  language: zh_hans
  text: 免得我的无知之过增多[a]，我的罪加增，我在敌对者面前跌倒，我的仇敌因我而欢喜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无知之过”也可译作“无知”或“因无知而犯的过错”。希腊文在这里所用的词与下一句的“罪”不同。
    reason: lexical_alternative
  - marker: b
    text: “因我而欢喜”在这里含有恶意得胜的意味，也可译作“因我而幸灾乐祸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως μὴ
  choice: 免得
  rationale: 引出承接上文祈求的目的或所要避免的结果；“免得”自然地统摄本节各个负面后果。
- source_word: αἱ ἄγνοιαι μου
  choice: 我的无知之过
  rationale: ἄγνοια可指无知，也可指由无知产生的错误。“无知之过”既保留无知这一语义成分，也与下一分句的“罪恶”有所区别。
- source_word: μὴ πληθύνωσιν
  choice: 增多
  rationale: 表达“变多、增加”的意思，与复数主语相合；否定意义由前面的“免得”统摄。
- source_word: αἱ ἁμαρτίαι μου
  choice: 我的罪恶
  rationale: ἁμαρτία在这里具有明确的道德含义；“罪恶”是现代汉语中庄重而清楚的对应表达，并保留它与ἄγνοιαι的区别。
- source_word: πλεονάσωσιν
  choice: 加增
  rationale: 表示增加、增多；采用“加增”与前面的“增多”略作变化，同时保持经文庄重的语体。
- source_word: πεσοῦμαι
  choice: 我倒在
  rationale: 直译其“倒下、跌落”之义，不具体限定为战败、蒙羞或道德跌倒，从而保留原文宽泛的意象。
- source_word: ἔναντι τῶν ὑπεναντίων
  choice: 在敌对我的人面前
  rationale: ἔναντι表示“在……面前”，ὑπεναντίων指与说话者作对的人；此译法保留复数，也避免与后一句单数的“仇敌”混同。
- source_word: ἐπιχαρεῖταί μοι
  choice: 因我而欢喜
  rationale: 贴近“因某人遭遇而欢喜”的表达；敌意和恶意得胜的意味由“我的仇敌”这一语境显明，脚注另列更强的译法。
- source_word: ὁ ἐχθρός μου
  choice: 我的仇敌
  rationale: 保留原文单数，与上一分句复数的敌对者形成原有的数目转换。
theological_decisions:
- issue: ἄγνοιαι与ἁμαρτίαι的区别
  choice: 分别译为“无知之过”和“罪恶”
  alternative: 把前者仅译为“过错”，或明确译成“无意中所犯的罪”
  rationale: 原文并列两个不同词语，似乎区分源于无知的过失与罪恶，但没有把前者明确界定为一种技术意义上的“无心之罪”。因此正文保留区别而不作更具体的神学归类。
- issue: ἐπιχαρεῖταί μοι所含的敌意
  choice: 正文译为“因我而欢喜”
  alternative: 译为“因我而幸灾乐祸”或“向我夸胜”
  rationale: 上下文中的“仇敌”已经使这种欢喜带有恶意；较贴近字面的译法避免在正文中过度强化，脚注则说明其敌意色彩。
- issue: “免得”的辖域
  choice: 让“免得”统摄本节四个并列后果
  alternative: 在后两项前补出“以致”或重复“免得”
  rationale: 希腊文以ὅπως μὴ引出整个连续结构。中文用一个“免得”统摄各项，既忠于句法关系，也保留这些后果之间可能存在的递进关联，而不把递进解释写死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无知之过”略带凝练的书面色彩，用来兼顾希腊文的“无知”含义及其复数的过失语境；全句保留祈祷文承接上文的从属句形式。
