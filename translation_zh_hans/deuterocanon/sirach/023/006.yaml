base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/006.yaml
  text: Do not let the appetite of the belly and sexual intercourse overtake me[b][a], and do not give me over to a shameless soul.
translation:
  language: zh_hans
  text: 不要让口腹之欲和性欲[b]制伏我，也不要把我交给无耻的心灵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无耻的心灵”直译为“无耻的灵魂”，也可理解为“无耻的自我”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文可指“性结合”或“性交”。本节是在祈求不受欲望支配的语境中，因此正文译为“性欲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κοιλίας ὄρεξις
  choice: 口腹之欲
  rationale: κοιλία在此指腹腹及其食欲，ὄρεξις指欲望；“口腹之欲”是现代汉语中自然、庄重的说法，准确表达身体对饮食的欲求。
- source_word: συνουσιασμός
  choice: 淫欲
  rationale: 该词可指性结合或性交；在这篇求免受恶欲支配的祷告中带有负面伦理色彩。“淫欲”表达不当的性欲，同时避免把一切性关系本身说成罪恶。
- source_word: μὴ καταλαβέτωσάν με
  choice: 不要让……制伏我
  rationale: καταλαμβάνω可表示抓住、赶上或控制；复数主语是前述两种欲望。“制伏我”自然地传达被欲望掌控的意思。
- source_word: ψυχὴ ἀναιδεῖ
  choice: 无耻的心灵
  rationale: ψυχή可指灵魂、生命或内在自我，ἀναιδής指无羞耻、厚颜。“心灵”保留内在人格层面的含义，也比直译“灵魂”更符合本句汉语表达。
- source_word: μὴ παραδῷς με
  choice: 不要把我交给
  rationale: παραδίδωμι表示交出、交付，使人落入某种权势之下；“把我交给”保留原文直接祈求的语气。
theological_decisions:
- issue: συνουσιασμός在恶欲语境中的伦理色彩
  choice: 译作“淫欲”
  alternative: 性交；性关系
  rationale: 原词本身可较中性地指性结合，但本节将它与口腹之欲并列，并祈求不被其制伏，因此需要适度呈现负面伦理语境；“淫欲”针对失序的性欲，不把婚姻中的性结合一概定罪。
- issue: ψυχή应保留实体化的“灵魂”，还是按内在人格理解
  choice: 正文采用“心灵”
  alternative: 无耻的灵魂；无耻的自我
  rationale: 这里的ψυχή可指人的内在自我。译作“心灵”既保留人论色彩，又不武断地把“无耻的灵魂”解释成一个外在存在。脚注注明较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“口腹之欲”与“制伏”保持智慧文学祷告的凝练语气；脚注明示ψυχή的字面表达，以保留原文可能的理解空间。
