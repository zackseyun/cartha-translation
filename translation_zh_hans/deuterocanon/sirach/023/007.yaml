  text: Hear instruction of the mouth[a], children[b], and the one who keeps it will certainly not be caught.
translation:
  language: zh_hans
  text: 孩子们，要听有关言语的训诲[a]；谨守这训诲的人，绝不会被捉住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有关言语的训诲”直译为“口的训诲”，也可译作“对口舌的管教”。希腊文表达简洁，既可指关于说话的教导，也带有操练和约束之意。
    reason: lexical_alternative
  - marker: b
    text: “绝不会”体现希腊文的强烈否定；“被捉住”也可译作“被捕获”或“被拿住”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδείαν
  choice: 训诲
  rationale: 该词兼有教导、管教和训练之意；智慧文学语境中的“训诲”既庄重自然，也保留塑造品格的意味。
- source_word: στόματος
  choice: 有关言语的
  rationale: 字面为“口的”，在这里指对口舌或说话的教导；译作“有关言语的”符合现代汉语，又不把范围窄化为某一种言语过犯。
- source_word: ἀκούσατε
  choice: 要听
  rationale: 这是复数命令式，要求听众留心领受；“要听”保留命令语气，同时不额外加入“遵从”的含义。
- source_word: τέκνα
  choice: 孩子们
  rationale: τέκνα是复数呼格，性别包容；原文没有“我的”，故不增译所属关系。
- source_word: ὁ φυλάσσων
  choice: 谨守……的人
  rationale: φυλάσσω可指看守、持守或遵守；“谨守”体现认真遵行，宾语按上文训诲补明。
- source_word: οὐ μὴ
  choice: 绝不会
  rationale: οὐ μή构成强烈否定；“绝不会”在现代汉语中清楚传达其强调力度。
- source_word: ἁλῷ
  choice: 陷入网罗
  rationale: ἁλίσκομαι本义为被捉住、被捕获。结合言语伦理，“陷入网罗”保留被言语过失缠住或招致后果的宽泛意象，避免限定为法律上的定罪。
theological_decisions:
- issue: “谨守”的隐含宾语
  choice: 补作“这训诲”，回指前面的言语训诲。
  alternative: 保持宾语隐含，译作“谨守的人”。
  rationale: 希腊文以语境补足宾语；现代汉语补出“这训诲”可明确指代而不引入新概念。
- issue: 末句所指的后果
  choice: 宽泛地译为“陷入网罗”，表示因言语过失而被捉住或陷入后果。
  alternative: 译作“被抓住”或较司法化的“被定罪”。
  rationale: 原词具有被捕获之义，但本节并未明确限定司法场景；保留宽泛意象可避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学劝诫语体。以分号呈现劝告与结果之间的关系；避免生硬的“口的训诲”，但在脚注保留其字面结构。
