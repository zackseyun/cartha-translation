  yaml_path: translation/deuterocanon/sirach/023/012.yaml
  text: There is a word wrapped in death; may it not be found in the inheritance of Jacob. For all these things will depart from the godly, and they will not wallow in sins.
translation:
  language: zh_hans
  text: 有一种话语被死亡包裹[a]；愿它不出现在雅各的产业中。因为这一切都必远离敬虔的人，他们也不会在罪恶中打滚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“披着死亡”或“被死亡环绕”。希腊文描绘某种言语被死亡裹住的形象。
    reason: 说明ἀντιπεριβεβλημένη的意象及可行译法，避免把隐喻限于单一中文措辞。
lexical_decisions:
- source_word: λέξις
  choice: 一种话
  rationale: 这里指某一种言语或说法；译作“一种话”既保留单数焦点，也符合现代汉语表达。
- source_word: ἀντιπεριβεβλημένη
  choice: 被……包裹
  rationale: 该分词描绘被某物环绕、裹住的形象；“被死亡包裹”保留鲜明隐喻，并避免直接把它解释成一般性的“致命”。
- source_word: θανάτῳ
  choice: 死亡
  rationale: 按与分词搭配的与格直译，保留这种言语被死亡笼罩的意象。
- source_word: μὴ εὑρεθήτω
  choice: 愿它不出现在
  rationale: 以“愿……不……”表达第三人称命令式的祈愿或劝诫语气；“出现在”比字面的“被发现于”更合乎现代汉语。
- source_word: ἐν κληρονομίᾳ Ἰακώβ
  choice: 在雅各的产业中
  rationale: 保留“产业”所含的承受之业及群体意味，也不把“雅各”进一步释义为某一特定范围。
- source_word: εὐσεβῶν
  choice: 敬虔的人
  rationale: 表达对神怀有敬畏并忠诚信奉的人，庄重而易懂。
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 自然地统摄上下文所说的各类不当言语，同时保留复数所指的广度。
- source_word: ἀποστήσεται
  choice: 都必远离
  rationale: 保留将来时和分离、离开的含义，并按希腊文句法让“这一切”作主语。
- source_word: ἐγκυλισθήσονται
  choice: 不至……打滚
  rationale: 保留动词“滚入、沉溺其中”的强烈形象，表现纵情陷在罪中的状态。
- source_word: ἐν ἁμαρτίαις
  choice: 在罪恶中
  rationale: “罪恶”在汉语中可涵盖多种具体罪行和罪中状态，配合“打滚”的意象较自然。
theological_decisions:
- issue: “雅各的产业”的身份与范围
  choice: 保留“雅各的产业”这一盟约群体称谓
  alternative: 明确解释为仅指民族以色列，或泛指一切义人
  rationale: 原文没有在本句中界定其后续神学范围，因此沿用原有称谓，不引入后来的神学结论。
- issue: 罪恶之事与敬虔者远离的主语关系
  choice: 让“这一切”作“远离”的主语
  alternative: 译为“敬虔的人必远离这一切”
  rationale: 希腊文的单数动词与中性复数主语搭配，句法上更直接地表示“这一切必远离敬虔的人”；保留这种表达，不将关系倒转为人的主动行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“被死亡包裹”与“在罪恶中打滚”保留原文的两个强烈具体意象；“雅各的产业”则维持其盟约性和群体性的含混，不作教派化解释。
