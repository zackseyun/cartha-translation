base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/017.yaml
  text: The holy ones of God have not been sufficient to recount the wonders of the Lord[b][a]. God has strengthened his hosts to be strong before his glory.
translation:
  language: zh_hans
  text: 上帝的圣者未能尽述主的奇妙作为。[a] 上帝使他的众军刚强，好在他的荣耀面前站立得稳。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马萨达抄本似作“未能明白”；开罗藏经库文本作“未能胜任／不足以（尽述）”，希腊文也支持“未能尽述”的意思。
    reason: textual_variant
  - marker: b
    text: 本句在古代文本中有显著差异。开罗藏经库希伯来文本作“上帝使他的众军刚强”；马萨达抄本似作“主使他的众光体坚固”；希腊文作“主全能者所坚立的一切，为要使万有在他的荣耀中稳固”。
    reason: textual_variant
lexical_decisions:
- source_word: לא הספיקו
  choice: 未能尽述
  rationale: 该短语表示能力不足、未能充分完成；与后接“述说”结合，译为“未能尽述”既自然，也表达并非完全没有述说，而是无法述说周全。马萨达抄本可能作“不明白”，故以脚注保留异文。
- source_word: קדושי אל
  choice: 上帝的圣者
  rationale: 直译所有关系并保留所指的开放性，既可能指属上帝的圣洁者，也不限定为某一类人或天上存在。
- source_word: לספר נפלאות ה׳
  choice: 尽述主的奇妙作为
  rationale: לספר意为述说、 recount；נפלאות既可指奇事，也可指奇妙作为。结合能力不足的语境，用“尽述”传达述说不尽。
- source_word: אמץ אלהים
  choice: 上帝使……刚强
  rationale: אמץ表达使强壮、坚固；主语按主要希伯来文本译作“上帝”，不按希腊文统一成“主”。
- source_word: צבאיו
  choice: 他的众军
  rationale: צבאיו字面为“他的军队/众军”，可能涵盖天军；“众军”保留集合性及宇宙性的可能含义，不明确增添“天”。
- source_word: להתחזק לפני כבודו
  choice: 好在他的荣耀面前站立得稳
  rationale: התפעל形式可表示使自己刚强、保持坚立；“站立得稳”自然表达在荣耀面前得以坚固、承受而不动摇的含义。
theological_decisions:
- issue: 圣者的身份
  choice: 上帝的圣者
  alternative: 上帝的圣民；上帝的圣天使
  rationale: 原文没有明确这些圣者是人、天使，还是广义的圣洁存在，因此不作神学上的具体限定。
- issue: 两分句中的神圣称谓
  choice: 第一分句用“主”，第二分句用“上帝”
  alternative: 两处均用“主”
  rationale: 主要希伯来文本第一处为四字神名的缩写，第二处为אלהים；照其差别翻译，同时以脚注说明第二分句的见证差异。
- issue: 众军与荣耀的关系
  choice: 上帝使众军刚强，使其在他的荣耀面前站稳
  alternative: 主全能者坚立万有，使一切在他的荣耀中稳固
  rationale: 正文优先依据所给希伯来文本，不以较扩展的希腊文重构其神学图景；希腊文的显著差异列入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“未能尽述”避免生硬的“未能足以述说”；“圣者”和“众军”保留原文所指的宽度。脚注标记依内容落在相应分句之后。
