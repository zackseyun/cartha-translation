  yaml_path: translation/deuterocanon/sirach/042/012.yaml
  text: Do not display your beauty to any man[b][a], and do not sit among women in the house.
translation:
  language: zh_hans
  text: 不要向任何男子显露你的美貌[a]，也不要在妇女的屋里与她们同坐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“不要把形貌／美貌给任何男性”。希腊文平行文本则作“不要因美貌而注视任何人／男子”，反映了对本句不同的理解。
    reason: alternative_reading
  - marker: b
    text: 开罗藏经库希伯来抄本末尾的动词形式和含义不确定。希腊文平行文本支持“不要在妇女中间同坐／结伴”的意思；据报道，马萨达抄本也反映了相关的社交往来之意，但措辞并不完全相同。
    reason: textual_variant
lexical_decisions:
- source_word: לכל זכר
  choice: 向任何男子
  rationale: 希伯来文直译为“向每一个男性”。“任何男子”既保留明确的性别所指，也比“任何男性”更符合现代汉语劝诫语境。
- source_word: אל תתן תאר
  choice: 不要显露你的美貌
  rationale: תאר可指形貌、姿容或美貌；在本句中，“显露你的美貌”自然表达“使自己的美貌呈现在他人眼前”的含义。希腊文ἐν κάλλει也支持“美貌”这一理解。
- source_word: ובית נשים
  choice: 在妇女的屋里
  rationale: 希伯来文含有“妇女的屋舍／住处”这一地点成分。译文保留“屋里”，避免把它具体化为某种未经文本明确说明的制度性“女眷区”。
- source_word: אל תסתויד
  choice: 不要……与她们同坐
  rationale: 抄本中的动词形式和确切含义不明；希腊文συνέδρευε表示同坐或结伴相处，因此采用具体而审慎的“同坐”。
theological_decisions:
- issue: 智慧劝诫中的性别特指
  choice: 保留“男子”和“妇女”的性别指向
  alternative: 用“人”或“众人”等中性表达
  rationale: 希伯来文זכר和נשים均明确标示性别；中性化会抹去原文在此处的具体社会关系。
- issue: 残存希伯来文与希腊文平行文本的协调
  choice: 以希伯来文为主，并用希腊文澄清末尾不确定的动词
  alternative: 完全照不明确的希伯来动词硬译，或整句改从希腊文
  rationale: 希伯来文本保留了“妇女的屋里”等细节，应作为主要依据；但末尾动词难解，希腊平行文本所见“同坐／结伴”可提供谨慎的释义依据，同时不掩盖文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“显露你的美貌”比逐字的“给予形貌”自然；“在妇女的屋里与她们同坐”同时保留希伯来文的地点成分和希腊文所支持的社交动作。
