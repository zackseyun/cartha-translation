  text: For a bad wife[a], a seal is good; and where hands are slack[c][b], open it.
translation:
  language: zh_hans
  text: 对于恶妻，加封为好；多人经手[a]之处，要锁起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “多人经手”：现存希伯来文本作“手松弛（或软弱）”；希腊平行文本作“许多手”。正文采用后者所表达的意思。
    reason: textual_variant
  - marker: b
    text: “要锁起来”：现存希伯来文本似作“要打开”，希腊平行文本则作“要关上（或锁上）”。正文采用与本句警戒语境相合的希腊读法。
    reason: textual_variant
lexical_decisions:
- source_word: אשה רעה
  choice: 恶妻
  rationale: אשה可指“女人”或“妻子”；本节处于持家和财物监管的语境，译作“妻”较贴切。רעה译作“恶”，保留原文严厉的评价而不扩展为泛指所有女性。
- source_word: חותם חסם
  choice: 封缄为好
  rationale: 希伯来语短促且可能有文本问题；חותם指印记或封缄，希腊平行文本καλὸν σφραγίς明确支持“封缄为好”。“封缄”也兼顾封住和加印防拆的含义。
- source_word: ומקום
  choice: ……之处
  rationale: 表示地点转换，与希腊语ὅπου“哪里、凡……之处”相合。
- source_word: ידים רפות
  choice: 多人经手
  rationale: 现存希伯来语字面为“松弛／软弱的手”，但在此不易形成清楚的警句；希腊平行文本χεῖρες πολλαί为“许多手”。正文采用与财物安全语境连贯的“多人经手”，并以脚注保留希伯来文本的读法。
- source_word: תפתח
  choice: 要锁起来
  rationale: 现存希伯来形式通常读作“你要打开”，与防范财物的上下文相冲突；希腊平行文本κλεῖσον明确为“关上／锁上”。正文依上下文及希腊见证译作“要锁起来”，脚注说明异文。
theological_decisions:
- issue: אשה应译“妻子”还是“女人”
  choice: 恶妻
  alternative: 恶女人
  rationale: 希伯来语אשה和希腊语γυνή均可有两义。家庭管理语境较支持“妻子”；这样也避免把原文针对特定家庭关系的严厉话语扩大为对女性整体的断言。
- issue: 是否按现存希伯来语逐字译出第二分句
  choice: 依希腊平行文本和语境译为“多人经手之处，要锁起来”
  alternative: “手松懈之处，要打开”
  rationale: 希伯来读法虽可按字面分析，却造成语义反常；希腊文本提供了连贯的警句，也很可能反映较可靠的底本。脚注公开文本差异，不把不确定性隐藏起来。
translation_notes:
  register: 采用简洁、庄重的现代汉语警句体。“封缄”略带书面色彩，但能准确表达加封防拆；“多人经手”比直译“许多手”更自然。所有关键文本异读均以脚注呈现。
