base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/014.yaml
  text: Better a man's wickedness than a woman's goodness[a], and a woman who brings shame becomes a reproach.
translation:
  language: zh_hans
  text: 男人的恶，胜过女人的善；使人蒙羞的女人，会成为耻辱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句较难理解，尤其是译作“会成为”的词。希腊文平行文本较为清楚，意为“使人蒙羞的女人导致耻辱”，支持正文所表达的大意。
    reason: 说明文本及词义的不确定性，并交代希腊文平行文本如何辅助理解。
lexical_decisions:
- source_word: מטוב רוע איש מטוב אשה
  choice: 男人的恶，胜过女人的善
  rationale: 两个“מטוב”构成比较，希腊文κρείσσων…ἢ也印证“胜过”的读法。保留“男人／女人”以及“恶／善”的直接对照，不把原文尖锐且令人不适的格言改写得较温和。
- source_word: רוע
  choice: 恶
  rationale: רוע指道德意义上的恶或邪恶；“恶”简洁地保留其道德分量，并与下文“善”形成对偶。
- source_word: איש
  choice: 男人
  rationale: 此处与אשה形成明确的性别对照；“男人”比泛化为“人”更忠实。上下文没有充分理由限定为“丈夫”。
- source_word: אשה
  choice: 女人
  rationale: 按其通常意义译为“女人”，与איש相对；原文并不要求译作“妻子”。
- source_word: מטוב אשה
  choice: 女人的善
  rationale: 希伯来文比较的是“男人的恶”与“女人的善”。“女人的善”保留名词性表达，避免依希腊文将其顺译成“行善的女人”。
- source_word: מחרפת
  choice: 使人蒙羞的
  rationale: 该分词带有造成羞耻、使人受辱的主动意味；采用定语结构，使中文自然，并与希腊文καταισχύνουσα相合。
- source_word: תביע
  choice: 会成为
  rationale: 此词在现存希伯来文句中难解。结合希腊文所表达的结果意义，以“会成为”审慎呈现其结果，不声称已确定该词的精确词义。
- source_word: חרפת
  choice: 耻辱
  rationale: חרפה可指羞辱、耻辱或受人责难之物；“成为耻辱”保留名词性结果，也符合本句格言式语气。
theological_decisions:
- issue: 经文以性别作出在道德上令人不适的比较
  choice: 保留“男人的恶／女人的善”的性别对照
  alternative: 将其泛化为“人的恶”，或改写以缓和对女性的贬抑
  rationale: 原文明说איש与אשה。翻译的职责是透明呈现《便西拉智训》的格言，而不是暗中纠正、普遍化或为其辩护。
- issue: 希伯来文末句含混，希腊文平行文本较清楚
  choice: 以希伯来文为主，并借希腊文确认“使人蒙羞”及结果为“耻辱”的大意
  alternative: 直译含混的希伯来文字形，或完全采用希腊文重构句法
  rationale: 现存希伯来文末句尤其在תביע及其句法关系上不确定；希腊文支持“使人蒙羞的女人”与“耻辱”之间的结果关系。正文保留这种意义，同时以脚注公开文本困难。
translation_notes:
  register: 采用简洁、庄重而现代的格言体。“胜过”比“宁可……也不要……”更贴近比较结构；分号呈现两个并列分句。正文不弱化原文的性别张力，也不额外加上解释或道德评断。
