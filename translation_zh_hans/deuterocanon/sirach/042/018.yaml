  text: He searches out the deep and the heart[b][a], and he understands all their secrets.
translation:
  language: zh_hans
  text: 他探究深渊和人心[b]，洞察其中一切赤露显明之事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他察明其中的一切计谋（或：狡猾行为）。”希伯来文直译为“他们一切赤露之处”，可能指在他面前完全显露、毫无遮蔽的一切。
    reason: alternative_reading
  - marker: b
    text: 马萨大抄本保存了较短的希伯来文开头：“深渊和人心，他探究了”；开罗藏经库的希伯来文文本还接有关于“他们一切赤露之处”的分句。
    reason: textual_variant
lexical_decisions:
- source_word: תהום
  choice: 深渊
  rationale: תהום指深处、深渊，也可带有宇宙深水的意象；“深渊”简洁自然，并与希腊文ἄβυσσον的语义范围相合。
- source_word: לב
  choice: 人心
  rationale: לב在此指人的内在，包括思想和意念。“人心”既保留“心”的希伯来表达，又避免把它误解为单指生理器官。
- source_word: חקר
  choice: 探究
  rationale: 该动词表示彻底查考、探察。“探究”传达深入查明之意；中文不强行标明时态，适合表达关于上帝恒常知识的陈述。
- source_word: מערומיהם
  choice: 它们一切赤露之处
  rationale: 希伯来文形式直指“赤裸、显露之处”，措辞异常但意象鲜明；译作“赤露之处”既保留原文比喻，也使现代中文读者能理解为毫无遮蔽的一切。希腊文所反映的“计谋/狡猾行为”另列脚注。
- source_word: יתבונן
  choice: 洞察
  rationale: hitbonen形式表示专注辨察、深入理解，而不只是观看；“洞察”兼顾观察与理解的认知力度。
theological_decisions:
- issue: 希伯来文此句的施事者未明说
  choice: 正文使用“他”，由上下文指向上帝
  alternative: 直接补作“主”或“上帝”
  rationale: 本句希伯来文本没有明说神名；虽然上下文及希腊文后续都清楚表明所指是主，正文仍不补入原句没有的称谓，以保存原文表达。
- issue: מערומיהם究竟指赤露之处、隐秘之事，还是计谋
  choice: 正文保留希伯来文的“赤露”意象
  alternative: 译为“隐秘”或依希腊文译为“计谋”
  rationale: 以高可信度的希伯来文为主要依据，不把较顺畅的解释直接取代其少见措辞；希腊文的不同传统在脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“探究—洞察”形成自然平行；“赤露之处”刻意保留希伯来文不寻常的显露意象，同时借脚注说明其可能含义及希腊文异读。
