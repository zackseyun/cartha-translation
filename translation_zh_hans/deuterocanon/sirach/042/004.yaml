translation:
  language: zh_hans
  text: 论天平和秤上的弄虚作假[a]，论伊法和石制砝码的计量[b][c]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本更接近“论天平和砝码的准确性”，而不是“在天平和秤上弄虚作假”。这里的希伯来文本较难解释，与希腊文也不能完全对应。
    reason: alternative_reading
  - marker: b
    text: 希腊文后半句差异很大，可译作“论获得多与少”，也可能理解为“论数量的多与少”；希伯来文则提到伊法和石制砝码。
    reason: textual_variant
  - marker: c
    text: “伊法”是古代的干量单位；“石制砝码”是交易中用作重量标准的石块。
    reason: cultural_note
lexical_decisions:
- source_word: שחק
  choice: 弄虚作假
  rationale: 传世希伯来文本此词较难解释；结合天平和秤的商业语境，译为“弄虚作假”能表达操弄衡器的不诚实行为，同时不把具体手段说得过死。希腊平行文本则指向“准确”，故在脚注保留异文。
- source_word: מאזנים
  choice: 天平
  rationale: 这是希伯来语中表示称重器具的常用词；“天平”自然、明确，也适合古代交易语境。
- source_word: פלס
  choice: 秤
  rationale: 此处与 מאזנים 并列，指称量或平衡器具；“秤”既保留并列关系，也避免过度限定其构造。
- source_word: תמחות
  choice: 度量
  rationale: 该词形在文本上疑难，但与“伊法”和“石制砝码”相连，显然涉及计量标准；“度量”保留其宽泛含义，不强行采用某一重构。
- source_word: איפה
  choice: 伊法
  rationale: 指古代特定的干量单位。采用传统音译，并在脚注解释，既保留源语文化特征，也方便现代读者理解。
- source_word: אבן
  choice: 石制砝码
  rationale: אבן 本义为“石头”，在交易和称量语境中可指用作标准重量的石块；译作“石制砝码”可明确其实际功能。
- source_word: περὶ ἀκριβείας ζυγοῦ καὶ σταθμίων
  choice: 关于天平和砝码的准确性（脚注异文）
  rationale: 希腊文本强调称量的精确或准确，与现存希伯来文本所可能表达的操弄或欺诈并不完全一致，因此不纳入正文而在脚注中保留。
- source_word: περὶ κτήσεως πολλῶν καὶ ὀλίγων
  choice: 关于获得多与少（脚注异文）
  rationale: 希腊文本后半句与希伯来文本所说的“伊法和石制砝码”差异显著；正文优先依从现存希伯来见证，脚注注明希腊异文。
