  text: All things are in pairs[a], one opposite the other, and he has made nothing lacking.
translation:
  language: zh_hans
  text: 万物都是成双的，彼此相对；他所造的，没有一样欠缺。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本段的希伯来文马萨达抄本也支持“所造的没有一样欠缺”这一含义；不过，这几行现存的希伯来文文本残缺，编排也与希腊文有所不同。
    reason: textual_variant
lexical_decisions:
- source_word: πάντα
  choice: 万物
  rationale: 中性复数涵盖一切受造之物；“万物”既简洁庄重，也保留原文的广泛范围。
- source_word: δισσὰ
  choice: 成双的
  rationale: 该词表示成对、成双，而非单纯重复；“成双的”自然承接下文彼此相对的关系。
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: 彼此相对
  rationale: 该短语描写成对之物互相对置或对应。“彼此相对”保留了既可指对立、也可指对应的语义张力，避免把它限定为敌对关系。
- source_word: οὐκ ἐποίησεν
  choice: 他所造的
  rationale: 动词的隐含主语依上下文指上帝；采用关系分句，使现代汉语表达自然，并保留创造行动的含义。
- source_word: οὐδὲν ἐκλιπόν
  choice: 没有一样欠缺
  rationale: ἐκλιπόν可表示缺少、不足或遗漏。“没有一样欠缺”简洁保留其范围与含混性，不额外断定欠缺的具体性质。
theological_decisions:
- issue: ἐποίησεν的隐含主语
  choice: 以“他”指上帝
  alternative: 采用无主句，如“没有一样被造得不完整”
  rationale: 希腊文未明说主语，但上下文论及上帝有秩序的创造；译出“他”有助于汉语连贯，并未加入上下文以外的神学主张。
- issue: 受造万物“成双”与“彼此相对”的关系
  choice: 保留为概括性的智慧观察
  alternative: 解释为所有事物必然构成绝对的二元对立
  rationale: 原文以概括方式陈述配对和相对关系，但没有建立形而上学的绝对二元论；译文不作超出原文的教义化推论。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“万物”“彼此相对”“没有一样欠缺”保持格言式的凝练，并尽量贴近希腊文的句法关系。
