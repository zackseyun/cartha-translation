  text: Do not be ashamed of these things, and do not show partiality and sin.
translation:
  language: zh_hans
  text: 但对于这些事[a]，不要羞愧；也不要徇情[b]而犯罪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 七十士译本的希腊文在这里有显著不同且较长的措辞，列出若干涉及羞耻和谨慎的具体事项。正文采用开罗藏经库所保存的希伯来文。
    reason: textual_variant
  - marker: b
    text: “徇情”所译的希伯来惯用语，字面意思是“抬起脸”，也可译作“偏袒”或“看情面”。
    reason: lexical_alternative
  - marker: c
    text: 末句原文简作“而犯罪”，也可译为“并且犯罪”或“免得犯罪”。
    reason: alternative_reading
lexical_decisions:
- source_word: אך על אלה
  choice: 但论到这些事
  rationale: אך带有限定或转折色彩，על אלה指出羞愧所涉及的事项；译文既保留承接语气，也自然引出下文。
- source_word: אל תבוש
  choice: 不要羞愧
  rationale: בוש指羞耻、蒙羞，不只是一般的尴尬；“不要羞愧”简洁并保留其道德与社会层面的分量。
- source_word: ואל תשא פנים
  choice: 也不要徇情
  rationale: נשא פנים字面为“抬起脸”，是偏袒、看情面的惯用语。“徇情”在现代汉语中简洁表达因情面而偏私的伦理含义。
- source_word: וחטא
  choice: 以致犯罪
  rationale: 希伯来文仅作“而犯罪”，句法压缩；在汉语中以“以致”连接，表达偏私与犯罪的结果关系，同时脚注保留其他可能理解。
theological_decisions:
- issue: “犯罪”与“不要徇情”的句法关系
  choice: 正文译作结果关系：“以致犯罪”
  alternative: 可直译为“并且犯罪”，或理解为警戒：“免得犯罪”
  rationale: 连续的否定命令与 וחטא 在语境中自然形成警戒性的结果关系；但原文十分简约，故不把这一关系视为唯一可能，并在脚注中注明。
translation_notes:
  register: 采用简洁、庄重而现代的劝诫语体。“论到这些事”承接上文；分号呈现两个相连的禁令。所有文本异读和句法歧义均以脚注明示。
