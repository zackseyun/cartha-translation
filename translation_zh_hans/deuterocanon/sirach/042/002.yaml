translation:
  language: zh_hans
  text: 论至高者的律法和律例[a]，也论判恶人为义的裁决[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“律例”；希腊平行文本作“约”。
    reason: alternative_reading
  - marker: b
    text: 或译“判恶人为义的人”。希伯来文本措辞简略，可指作出这种判决的人；希腊平行文本则明确作“判恶人为义的裁决”。“判……为义”在这里是法庭用语。
    reason: lexical_and_textual_alternative
lexical_decisions:
- source_word: תורת עליון
  choice: 至高者的律法
  rationale: תורה兼有“教导”和“律法”之义；此处与法律用语חוק并列，采用“律法”更能保留司法语境。עליון直译为“至高者”。
- source_word: חוק
  choice: 律例
  rationale: חוק指固定的法令或规定。“律例”保持法律语域，又与“律法”有所区别。
- source_word: מצדיק / להצדיק
  choice: 判……为义
  rationale: צדק的使役形式在此具有法庭宣判意味。“判……为义”保留其司法性质，并避免把后期神学含义直接带入本节。
- source_word: רשע
  choice: 恶人
  rationale: רשע指邪恶或有罪的人；“恶人”简明自然，也符合智慧文学常用语。
- source_word: ועל
  choice: 也论
  rationale: 重复的介词引出并列事项；“也论”既承接上文，又保留清单式结构。
theological_decisions:
- issue: צדק/δικαιόω一类词在本节中的法庭含义
  choice: 判恶人为义
  alternative: 使恶人称义；宣告恶人为义；为恶人辩白
  rationale: 上下文谈的是裁决，希腊平行文本δικαιῶσαι也支持司法含义。“判……为义”保留原文张力，同时避免将其限定为后期教义术语。
- issue: מצדיק的句法所指
  choice: 判恶人为义的裁决
  alternative: 判恶人为义的人
  rationale: 希伯来文本措辞简略，מצדיק表面上可理解为施行判决者；希腊平行文本明确有κρίματος（裁决、判决）。正文依平行见证采用抽象的“裁决”，脚注保留按希伯来表层句法理解为人的可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。因本节承接上一节的事项清单，以“论……也论……”保留片段式并列结构，不擅自补入“不可羞愧”等上文成分。
