base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/011.yaml
  text: Keep a strict watch over your virgin daughter[a], lest she make you a byword of disgrace, a gossip of the city and a curse of the people[c][b], and seat you in the assembly at the gate.
translation:
  language: zh_hans
  text: 你要严密看守你尚未出嫁的女儿[a]，免得她使你落得恶名，成为城中的流言、百姓咒诅的对象[c]，又使你坐在城门口聚集的人群中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尚未出嫁的女儿”：希伯来文直译为“你的处女（或少女）女儿”，这个词着重指她为处女或少女，并含有尚未进入婚姻的语境。
    reason: lexical_alternative
  - marker: b
    text: 本句末尾的希伯来文较难确定，直译近于“使你坐在城门的聚集人群中”。城门口是公众聚集、议事和审判的地方；希腊平行文本则表达在许多人面前蒙羞。
    reason: cultural_note
  - marker: c
    text: 马萨达抄本在此保存较短的措辞，大意为：“要看守女儿；城中的流言和百姓的集会……”；开罗藏经库希伯来文本的表述较完整。
    reason: textual_variant
lexical_decisions:
- source_word: בני על בתולתך החזק משמר
  choice: 你要严密看守未出嫁的女儿
  rationale: 该句式表达设立并加强防范，不宜逐字译作“建造看守”。“严密看守”保留命令的强化语气；בתולה兼有“处女、少女”的含义，在此亲属与婚姻语境中译作“未出嫁的女儿”，正文较自然，具体词义另见脚注。
- source_word: פן תעשה לך שם סרה
  choice: 免得她使你声名败坏
  rationale: שם סרה指恶名、羞耻的名声或败坏的声誉。“使你声名败坏”自然表达女儿给父亲带来公开恶名的含义，又不额外引入希腊文本的“仇敌取笑”。
- source_word: דבת עיר
  choice: 成为城中的流言
  rationale: דבה可指恶讯、毁谤或流言；此处与公共羞辱的语境相合。“城中的流言”保留名词结构，也避免较轻佻的口语表达。
- source_word: וקללת עם
  choice: 百姓咒骂的对象
  rationale: 直译近于“百姓的咒诅”。译为“咒骂的对象”明确表达她使父亲成为群体斥责对象的语义关系。
- source_word: והושיבתך בעדר שער
  choice: 又使你坐在城门口聚集的人群中
  rationale: והושיבתך是使役形式，故保留“使你坐”。עדר שער含义困难；结合城门作为公共聚集、议事和审判之处的文化背景，译作“城门口聚集的人群”，但不在正文中把含义确定为正式审判或明确补出“受辱”。
theological_decisions:
- issue: 希伯来文本与希腊平行文本的取舍
  choice: 以现存希伯来文为正文依据，仅用希腊平行文本确认末句属于公开蒙羞的语境。
  alternative: 依希腊文扩译为“使你成为仇敌的笑柄，并在许多人面前使你蒙羞”。
  rationale: 希伯来文本在本节尚存，应居首要地位。希腊文的“仇敌”和“许多人”有助于理解语境，却不是现存希伯来措辞，不宜直接并入正文。
- issue: 末句难解结构
  choice: 保留“使你坐在城门口聚集的人群中”的具体意象及一定歧义。
  alternative: 解释性译作“使你在公众大会上蒙羞”或“使你坐在城门口受审”。
  rationale: 原文没有明说“受审”，而“蒙羞”虽符合上下文，仍属解释。正文保留城门和聚集人群的意象，脚注说明其公共文化背景。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“未出嫁的女儿”避免生硬的“处女女儿”；“城门口聚集的人群”刻意保留原文末句的具体形象和不确定性。
