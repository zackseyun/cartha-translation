  text: For whatever place you appoint[a], keep count by your hand; and every giving and receiving should be in writing.
translation:
  language: zh_hans
  text: 凡你所交托的[a]，都要亲手点清；一切交付和收取，都要记录在案。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希伯来语措辞十分凝缩，直译近似“对于地方（或所在），你要委派”。希腊语平行文本作：“凡你交付的，都要按数目和重量；一切交付和收取，都要写下来。”这支持本节是在劝人对受托或交付之物仔细清点并留下书面记录。
    reason: 原文含义不确定，并有希腊语平行异文可帮助说明
lexical_decisions:
- source_word: על מקום תפקד
  choice: 凡你所交托的
  rationale: 希伯来语原句高度凝缩，逐字近似“对于地方/所在，你要委派（或托付）”。מקום通常指“地方、所在”，但在此交易与保管的语境中不宜机械译出；פקד可表示委派、托付或清点。希腊平行文本ὃ ἐὰν παραδιδῷς（“凡你交出去/交托的”）支持按托付之物理解，同时以脚注保留原文的不确定性。
- source_word: יד תספור
  choice: 都要亲手点清
  rationale: 直译为“你的手要数点”。“亲手点清”保留“手”的具体意象，也自然表达本人仔细核数、负责查点之意。
- source_word: ומתת ולקח
  choice: 一切交付和收取
  rationale: 这对词字面涉及“给予”和“拿取”，在上下文中泛指双向交易或物品出入；“交付和收取”庄重自然，且不把范围缩窄为金钱收支。
- source_word: הכל בכתב
  choice: 都要记录在案
  rationale: 字面为“全都以书面（形式）”。“记录在案”清楚传达所有相关往来均须留下书面记录的要求。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的劝诫语体。“亲手点清”保留希伯来语“手要数点”的形象；“记录在案”符合现代汉语习惯。脚注明确交代希伯来语的凝缩与希腊平行文本，避免把有争议的 על מקום 静默定解。
