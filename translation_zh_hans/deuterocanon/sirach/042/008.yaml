base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/008.yaml
  text: 'Concerning the discipline of a simpleton and a fool[a], and an old man who turns back and takes counsel in sexual immorality: be truly careful[b], and a modest man before every living being.'
translation:
  language: zh_hans
  text: 论管教愚蒙人和愚昧人[a]，也论一个回头、在淫乱之事上听取劝告的老人：你要确实谨慎[b]，在一切活物面前作个端庄的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“论无知者和愚昧人的教导，也论一个受审时与年轻人相对的极老之人。”后半句与希伯来文“一个回头、在淫乱之事上听取劝告的老人”差异显著。
    reason: alternative_reading
  - marker: b
    text: 若较贴近希腊文平行文本，也可译作：“你就会真正受到教导，并在所有活人面前蒙认可。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוסר
  choice: 管教
  rationale: 兼具教导、纠正和道德训练之意；“管教”保留智慧文学中的规训意味。
- source_word: פותה
  choice: 愚蒙人
  rationale: 指易受诱骗、缺乏判断力的人；“愚蒙人”是中文智慧文学中自然且较准确的表达。
- source_word: כסיל
  choice: 愚昧人
  rationale: 这是智慧传统中带有道德意味的常用称谓，不只表示智力不足。
- source_word: ושב
  choice: 故态复萌
  rationale: 表达返回旧有行为的意味；结合后文的淫乱语境，比单纯“回转”更自然，但仍不具体断定其行为形式。
- source_word: ישיש
  choice: 老人
  rationale: 直接表达年事已高的人，语言简明自然。
- source_word: נוטל עצה
  choice: 听取计谋
  rationale: 原意为“取谋、接受计议”；“听取计谋”保留其可能是听从他人筹划的含义，避免解释成单纯寻求忠告。
- source_word: בזנות
  choice: 在淫乱之事上
  rationale: זנות可泛指不正当的性行为，不限于卖淫；此译保留其宽泛的伦理范围。
- source_word: זהיר
  choice: 谨慎
  rationale: 表达警醒、小心自守的劝诫语气。
- source_word: באמת
  choice: 真诚
  rationale: 可表示真实、确实或忠实；与“谨慎”连用时，“真诚”保留其品格层面的意味，希腊文则支持另一种理解，收入脚注。
- source_word: צנוע
  choice: 端庄
  rationale: 可涵盖谦逊、克制、含蓄和举止得体；“端庄”适合此处公开生活中的伦理要求。
- source_word: לפני כל חי
  choice: 在一切有生命的面前
  rationale: 较贴近希伯来文的普遍范围，也保留“在……面前”的公开、可见意味。
theological_decisions:
- issue: 希伯来文与希腊文在老人一语上的显著差异
  choice: 正文依现存希伯来文，译作老人故态复萌并在淫乱之事上听取计谋。
  alternative: 依希腊文可译为“一个受审时与年轻人相对的极老之人”。
  rationale: 《便西拉智训》有可靠现存希伯来文时以希伯来文为主要见证；但希腊平行文本差异重大，故不予消解，而在脚注中完整说明。
- issue: 末句是谨慎端庄的命令，还是受教并蒙认可的结果
  choice: 正文依希伯来文，保留劝诫式的“真诚谨慎……作端庄的人”。
  alternative: 依希腊文可译为“你就会真正受到教导，并在所有活人面前蒙认可”。
  rationale: 希伯来文זהיר与צנוע支持谨慎、端庄的品格劝诫；希腊文的分词则呈现受教和经验证可取的意义，因此作为重要异文列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愚蒙人／愚昧人”保留智慧文学语体；“故态复萌”自然呈现ושב的回返意味。正文以希伯来文为主，两个脚注明确保存希腊文本的重大差异，不将其悄然调和。
