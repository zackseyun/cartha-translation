base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/021.yaml
  text: He has set in order the mighty works of his wisdom[a], and he alone is from everlasting. He neither gains increase nor diminishes[d][c][b], and he has no need of any counselor.
translation:
  language: zh_hans
  text: 他安排了他智慧的大能作为；他独一无二，自亘古就存在。[a] 没有什么能加给他，也没有什么能从他取去；[b] 他不需要任何明哲之士作参谋。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他独一无二”原文直译为“他是一／他为一”；“自亘古”也可译作“自古以来”。希腊平行文本作“在世代以前，并直到永远”。
    reason: lexical_alternative
  - marker: b
    text: “从他取去”所据的希伯来词在此含义困难；按上下句的对应关系，意思似乎是：没有什么能加给他，也没有什么能使他有所减损。
    reason: alternative_reading
  - marker: c
    text: “明哲之士作参谋”原文较直译为“任何明白的人”或“任何有悟性的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורת חכמתו
  choice: 自己智慧的大能作为
  rationale: 该组合较为凝缩。גבורת 可指“大能、伟力”，希腊平行文本 τὰ μεγαλεῖα 则偏向“伟大的作为”；译作“大能作为”兼顾希伯来文的能力内涵和希腊文所见的彰显。
- source_word: תכן
  choice: 安排了
  rationale: 此动词可表示衡量、规定、确立或安排；希腊文 ἐκόσμησεν 支持“整理、安排”的语义。
- source_word: אחד הוא
  choice: 他独一无二
  rationale: 直译为“他是一个／他为一”，在此强调上帝的唯一和无可比拟；“独一无二”在现代汉语中自然，同时保留该神学张力。
- source_word: מעולם
  choice: 自亘古便存在
  rationale: 希伯来文可指“自古以来”，希腊平行文本则将时间延伸至世代之前及永远；此译既表达先存，也不把希伯来文直接扩写成完整的永恒公式。
- source_word: לא נוסף
  choice: 没有什么能加添给他
  rationale: 保留希伯来文近似被动的加添概念，并以自然汉语表达上帝不受增益。
- source_word: ולא נאצל
  choice: 也没有什么能从他夺去
  rationale: נאצל 在此词义或文本形态困难；结合与“不被加添”的对句关系，译作“从他夺去”，表达不能有所减损，同时以脚注说明不确定性。
- source_word: ולא צריך
  choice: 他不需要
  rationale: 直接、自然地表达“不需要”。
- source_word: לכל מבין
  choice: 任何明哲之士为他参谋
  rationale: 字面为“任何明白／有悟性的人”；在语境中指能向他提供见识者。正文用功能性表达，并在脚注保留字面范围。
theological_decisions:
- issue: אחד הוא 所表达的独一性
  choice: 他独一无二
  alternative: 他是一位／他是独一的
  rationale: 原文可作简洁的“他是一”，既可能陈述一，也可能突出唯一性。结合语境采用自然的唯一性表达，但不扩展为特定宗派的形上定义。
- issue: מעולם 的时间范围
  choice: 自亘古便存在
  alternative: 自古以来／从永恒直到永恒
  rationale: 希伯来文自身容许“自古”，希腊平行文本则支持更强的超越世代之意。正文采取兼顾二者的表达，脚注交代希腊见证。
- issue: 上帝不可增减的表述
  choice: 没有什么能加添给他，也没有什么能从他夺去
  alternative: 他不增加，也不减少
  rationale: 被动式汉语更贴近 לא נוסף，并使平行句表达没有外物能够增益或减损他；由于第二个希伯来词困难，不将其确定为抽象的“不变性公式”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“大能作为”保留原文凝缩表达中的能力与彰显两面；分号呈现诗性并列。所有文本不确定处均以脚注标明，避免把困难读法或希腊扩展静默定论化。
