  text: about livestock[a], whether much or little, and about the price of merchandise for sale;
translation:
  language: zh_hans
  text: 对于牲畜[a]，无论多寡；对于商人所售货物的价格；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本在这里有明显差异，较笼统地提到买卖和商人。本译以希伯来语见证为主，希腊语文本仅用于印证这里的商业语境。
    reason: textual_variant
lexical_decisions:
- source_word: על מקנה
  choice: 对于牲畜
  rationale: על在上下文中引出应当认真核查而不必羞于过问的事项；מקנה在此最自然地指所拥有的牲畜，而非泛指财产。
- source_word: בין רב למעט
  choice: 无论多寡
  rationale: 这是数量上的对举；“无论多寡”简洁自然，并保留希伯来语不论数量多少的含义。
- source_word: ממחיר ממכר תגר
  choice: 对于商人所售货物的价格
  rationale: 希伯来语结构较为压缩。ממחיר指价格或估价，ממכר可指所售之物或出售，תגר指商人；此译保留商业语境，也避免生硬复制介词结构。
