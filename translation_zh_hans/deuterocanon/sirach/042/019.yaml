  text: He declares the changes that are coming[b][a], and reveals the search of hidden things.
translation:
  language: zh_hans
  text: 他宣明正在发生的变迁[a][b]，揭示隐秘之事的探究。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“他宣告已经过去和将要发生的事，并揭示隐秘之事的踪迹。”这一文本比现存希伯来文有更完整的时间性展开。
    reason: alternative_reading
  - marker: b
    text: 本段的马萨达卷轴残缺，未能充分保存本节，因而不足以取代这里所采用的开罗藏经库希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: מחוה
  choice: 宣明
  rationale: 此词表示使人知道、报告或宣告；“宣明”既保留智慧文学的庄重语气，也清楚表达公开说明之意，并与希腊文 ἀπαγγέλλων 相合。
- source_word: חליפות
  choice: 变迁
  rationale: 该复数名词可指变化、交替或相继的发展。“变迁”自然涵盖事态的更替过程，又不把它限缩为具体的交换。
- source_word: נהיות
  choice: 正在发生的
  rationale: 该形式源于 היה，表示成为、发生或出现。译作“正在发生的”保留其生成、发生的动态含义，而不擅自加入希伯来文未明确表达的过去与未来二分。
- source_word: ומגלה
  choice: 揭开
  rationale: גלה 在此表示揭露、显明。“揭开”与后面的“究竟”搭配自然，并保留把隐藏之事显露出来的意象。
- source_word: חקר
  choice: 究竟
  rationale: 该词可指探究、查考，也可指经探究而触及的深处或底蕴。直译为“隐秘之事的探究”在现代汉语中生硬；“究竟”保留追索到底、洞悉深处的含义，同时使句子自然。
- source_word: נסתרות
  choice: 隐秘之事
  rationale: 该阴性复数形式指被隐藏或隐而未显的事物。“隐秘之事”范围宽泛，不额外限定为某一种秘密。
theological_decisions:
- issue: 希伯来文本与较完整的希腊文平行文本之间的关系
  choice: 正文以现存希伯来文为准，将 חליפות נהיות 译为“正在发生的变迁”，不把希腊文明确的“过去和将来”扩展写入正文。
  alternative: 他宣告已经过去和将要发生的事，并揭示隐秘之事的踪迹。
  rationale: 本节希伯来文尚存，应居首要地位。希腊文可印证该短语涉及时间中的事件更替，却比现存希伯来文表达得更完整；因此将其保留在脚注中，避免消除文本之间真实存在的差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宣明”保持智慧文学语体；“变迁”表达相继发生的变化；“揭开……的究竟”以自然汉语传达 חקר 兼有探究与深处的语义张力。正文中的脚注标记按内容关系置于相关短语之后。
