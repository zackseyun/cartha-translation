  text: All these live and endure forever; in every need, all obey.[a][b]
translation:
  language: zh_hans
  text: 这一切都活着，永远长存；无论有何需要，万物都顺从。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开罗藏经库希伯来文本在这里所载的是另一句话，大意为：“谁能看够穹苍高处纯净的荣美？”较早的马萨达证据和希腊传统支持正文的意思；这句希伯来文似乎是从邻近的上下文错置到这里的。
    reason: textual_variant
  - marker: b
    text: “无论有何需要”也可译作“为着各种用途”或“在一切必需之事上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα / הכל
  choice: 这一切
  rationale: 保留希腊文指示语气，承接上文所述的一切受造之物。
- source_word: ζῇ
  choice: 活着
  rationale: 直接表达持续的生命状态，语言自然明白。
- source_word: μένει εἰς τὸν αἰῶνα
  choice: 永远长存
  rationale: 兼顾 μένει 的持续、存留之意与 εἰς τὸν αἰῶνα 的永久性。
- source_word: ἐν πάσαις χρείαις
  choice: 无论有何需要
  rationale: χρεία 可指需要、用途或目的；此译保留其宽泛含义，不将其限定为单一用途。
- source_word: ὑπακούει
  choice: 服从
  rationale: 表达受造万物依令而行、顺从秩序的含义；中文庄重而自然。
- source_word: ומי ישבע להביט תואר תואר מרום רקיע על טוהר
  choice: 谁能看够？穹苍高处纯净的荣美
  rationale: 此为开罗藏经库希伯来文本所见的不同句子，正文不采用，但在注脚中如实呈现其大意。重复的 תואר 可能反映文本传抄问题，故不在概译中机械重复。
theological_decisions:
- issue: 现存希伯来行与上下文及希腊平行文本不一致
  choice: 正文采用希腊传统所保存、且有马萨达较早证据支持的连贯读法
  alternative: 按开罗藏经库希伯来文译作：‘谁能看够？穹苍高处纯净的荣美。’
  rationale: 所给希伯来行很可能从邻近经文错置于此；希腊文在上下文中连贯，并获较早的马萨达材料支持。正文据此翻译，同时以注脚公开文本差异，避免掩盖证据上的张力。
translation_notes:
  register: 采用现代标准普通话，语体庄重而通俗。“这一切”承接上文；分号保留原句两部分的平衡。所有注脚标记均已置于正文。
