base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/009.yaml
  text: 'A daughter is a hidden cause of deceit to her father[a], and anxiety over her drives away his sleep: in her youth, lest she remain unmarried, and in her virginity[b], lest she not be married.'
translation:
  language: zh_hans
  text: 女儿对父亲而言，是隐藏的虚假[a]；为她忧虑，使他无法安睡：她年轻时，怕她年华渐逝[b]；她仍是处女时，怕她嫁不出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“隐藏的虚假”，含义不明；希腊文平行本作“隐藏的失眠”，可能是指女儿使父亲暗自忧虑。
    reason: alternative_reading
  - marker: b
    text: 这里的希伯来文含义不确定；希腊文平行本指青春渐逝，可能是说错过当时社会所认定的适婚年华。
    reason: textual_variant
lexical_decisions:
- source_word: בת לאב
  choice: 女儿对父亲
  rationale: 保留希伯来语简洁的父女关系表达；“对父亲”自然传达关系与影响所指向的对象。
- source_word: מטמנת שקר
  choice: 是隐藏的虚假
  rationale: 此短语文本和语义均艰深。“隐藏的虚假”尽量贴近现存希伯来语，不以希腊文较顺畅的“隐藏的失眠”取代它，并用脚注交代异读。
- source_word: דאגה תפריע שנתו
  choice: 为她忧虑，使他无法安睡
  rationale: “忧虑”表达持续挂心；“无法安睡”自然呈现忧虑扰乱、赶走睡眠的语义，也与希腊文平行本相符。
- source_word: בנעוריה פן תגור
  choice: 她年轻时，怕她错过青春年华
  rationale: 希伯来语动词的含义不确定；希腊文 παρακμάσῃ 指向青春衰退或错过适婚年华。正文采用可读但不过度具体化的表达，并以脚注保留不确定性。
- source_word: ובתוליה פן לא תנשא
  choice: 她仍是处女时，怕她嫁不出去
  rationale: 保留“处女”这一明确的社会文化类别；“嫁不出去”自然表达 תנשא 的被动婚嫁含义。
theological_decisions:
- issue: 如何处理 מטמנת שקר 与希腊文 ἀπόκρυφος ἀγρυπνία 的差异
  choice: 正文依现存希伯来文译为“隐藏的虚假”，脚注说明希腊文“隐藏的失眠”
  alternative: 正文译作“隐藏的忧虑”或“暗中的失眠”
  rationale: 希伯来文证据应居首位，但本句确有文本困难；保留其突兀与含混，同时让希腊文平行本帮助读者看见句子所描写的父亲隐忧，不擅自消除张力。
- issue: פן תגור 的不确定含义
  choice: 译作“怕她错过青春年华”并加脚注
  alternative: 怕她一直未婚；怕她年华衰退
  rationale: 希腊文支持年华渐逝的理解，而希伯来文形式仍不够确定；正文采用涵盖性较强的表达，脚注公开文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留希伯来文的艰深处，不将古代父权社会中的忧虑改写为现代价值判断；分号呈现原句两组平行的担忧。
