  text: No understanding is lacking to him, and no word has escaped him.
translation:
  language: zh_hans
  text: 没有任何理解是他所缺少的；也没有一句话从他那里漏过。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כל שכל
  choice: 任何意念
  rationale: שכל在此可指思想、理解或意念；结合希腊平行文本πᾶν διανόημα，译作“任何意念”较自然，也保留认知层面的广度。
- source_word: לא נעדר ממנו
  choice: 是他所不知道的
  rationale: 字面为“没有从他那里缺少”；在全知语境中用“没有……是他所不知道的”传达没有任何意念不在其知识之内。
- source_word: כל דבר
  choice: 一句话
  rationale: דבר既可指“话”也可指“事”；希腊平行文本λόγος以及经审核的英文层明确支持“话”，故取“一句话”。
- source_word: לא חלפו
  choice: 能逃过他的察知
  rationale: חלף有经过、越过之意；此处表达没有话语从他的认知中漏过。“逃过他的察知”符合现代汉语，同时保持全知主题。
theological_decisions:
- issue: 经文对上帝知识范围的表达
  choice: 用两个全称否定句表达，没有意念不为他所知，也没有一句话逃过其察知
  alternative: 将שכל译为“智慧”，将דבר译为“事情”
  rationale: 所选译法紧贴希伯来文，并以希腊平行文本校验；不额外界定神学体系，也不把“话”泛化成“事情”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“察知”略带书面色彩，但普通读者易懂，并能避免第二分句仅重复“知道”。
