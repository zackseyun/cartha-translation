  text: He lives and stands forever[b][a]; his goodness passes from one thing to another.
translation:
  language: zh_hans
  text: 他永远活着、屹立不移[a]；他的美善从这一物传到另一物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文措辞简短，且略有不确定。希腊文平行文本保存了一个不同而较完整的版本：“既没有增添，也没有减少；他也不需要任何谋士。他的一切作为多么可爱，观看时犹如火花。”
    reason: textual_variant
  - marker: b
    text: 也可译作“他的美善临到每一物”或“他的美善从一个传到另一个”。希伯来语“这个在这个之上”十分凝练，其确切关系并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוא
  choice: 他
  rationale: 上下文所指为上帝，因此采用人格代词“他”，不译作无生命的“它”。
- source_word: חי
  choice: 活着
  rationale: 保留希伯来语所表达的持续生命状态；“活着”自然、清楚。
- source_word: ועומד
  choice: 屹立不移
  rationale: 原义为“站立”；译作“屹立不移”既保留具体意象，也在现代汉语中传达长存、坚定之意。
- source_word: לעד
  choice: 永远
  rationale: 直接表达无尽的持续时间，符合现代标准汉语。
- source_word: זה על זה
  choice: 从这一物……到另一物
  rationale: 原文是压缩的“这个在这个之上”，确切关系不明；此译表达事物之间的递传或相继，同时避免规定得过细。
- source_word: חלף
  choice: 传到
  rationale: 该动词可指经过、越过或更替；“传到”保留动态关系，并与“从……到……”自然搭配。
- source_word: טובו
  choice: 他的美善
  rationale: טוב可指善、美好或恩惠；“美善”较“良善”更能保留此处可能兼含善与美好的语义，也与希腊平行文本对受造之工可悦目的描述相呼应，而不将其限定为物质恩惠。
theological_decisions:
- issue: 希伯来文本与较完整希腊平行文本的关系
  choice: 正文翻译现存希伯来文，希腊异文列入脚注。
  alternative: 以希腊文较完整的措辞取代希伯来文，或将二者调和为一个扩充正文。
  rationale: 现存希伯来文在本项目中应居首要地位；希腊文本似保存不同或扩充的文本形态，应作为重要异文呈现，而不应悄然取代希伯来正文。
- issue: טובו的语义范围
  choice: 译作“他的美善”。
  alternative: 译作“他的良善”“他的恩惠”或“他的美丽”。
  rationale: “美善”保留词语在善、美好和惠泽之间的开放性，避免把含义收窄为道德属性、物质赐予或视觉美感之一。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“屹立不移”保留原文“站立”的意象；“美善”保留טוב在善、美好与惠泽之间的语义张力。脚注标记均已置于正文对应位置。
