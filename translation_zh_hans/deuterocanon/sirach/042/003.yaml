translation:
  language: zh_hans
  text: 关于承租人、主人和客人的账目[a]，以及遗产和财产[b]的分配。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作“关于同伴的事务和旅人，关于同伴遗产的给予”，显示其所依据的底本在数处与现存希伯来文本不同。正文依从现存希伯来文本。
    reason: alternative_reading
  - marker: b
    text: 希伯来文最后一词十分简略，其在这里的确切含义略有不确定；根据本节的法律与经济语境，译作“财产”。
    reason: lexical_alternative
lexical_decisions:
- source_word: על
  choice: 关于
  rationale: 重复出现的介词用于引出所谈论的事项；“关于”自然地保留其主题标示作用。
- source_word: חשבון
  choice: 账目
  rationale: 此词在这里指财务上的核算或账目，符合本节的法律与经济语境。
- source_word: חוכר
  choice: 承租人
  rationale: 指租赁土地或其他产业的人；“承租人”比“佃户”涵盖面更广，也较准确地表达契约关系。
- source_word: אדון
  choice: 主人
  rationale: 在社会及经济关系中指拥有权柄的一方；“主人”保留原词的宽泛含义，不擅自限定为产业所有人。
- source_word: אורח
  choice: 客人
  rationale: 希伯来词通常可指客人或旅客；正文优先依从现存希伯来文本，译作“客人”，而希腊平行文本的不同读法另以脚注说明。
- source_word: מחלקות
  choice: 分配
  rationale: 表示划分、分派或配给；与遗产和财产搭配时，“分配”是自然清楚的现代汉语。
- source_word: נחלה
  choice: 遗产
  rationale: 这是家族及法律语境中表示承受产业的常用词；“遗产”最切合本节语境。
- source_word: ויש
  choice: 和财产
  rationale: 末词יש在此处简略且语义不甚确定；结合上下文，将其理解为所有之物或资财，译作“财产”，同时以脚注保留不确定性。
