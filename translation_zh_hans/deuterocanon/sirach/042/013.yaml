translation:
  language: zh_hans
  text: 因为衣蛾出自衣服，女人的恶也出自女人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“因为衣蛾从衣服中出来，女人的恶从女人中出来。”希伯来文措辞简短，带有格言色彩；后半句在原文中省略了动词。希腊文也保留了相同的简省结构：“从女人，女人的恶。”
    reason: 说明原文简省的平行结构及较直译的表达。
lexical_decisions:
- source_word: בגד
  choice: 衣服
  rationale: 该词泛指衣物；“衣服”自然、通俗，也与希腊文 ἱμάτιον 相符。
- source_word: יצא
  choice: 出自
  rationale: 原义为“出来、出发”；“出自”既保留来源关系，又使这句格言在现代汉语中自然顺畅。
- source_word: עש
  choice: 衣蛾
  rationale: 此处指蛀蚀衣物的蛾类；“衣蛾”比笼统的“蛀虫”更准确地对应原文名词。
- source_word: אשה
  choice: 女人
  rationale: 该词可指“女人”或“妻子”；本节是泛指性的格言，希腊文 γυνή 也支持较宽泛的“女人”。
- source_word: רעת אשה
  choice: 女人的恶
  rationale: 希伯来文是简短的属格结构，直指“女人的恶”；此译保留其尖锐、含混而不加以淡化或扩展。
theological_decisions:
- issue: 格言中可能被视为贬抑女性的措辞
  choice: 保留“女人的恶也出自女人”的直接表述
  alternative: 改作泛化的“恶来自人”或限定为“妻子的恶”
  rationale: 希伯来文和希腊文都明确以“女人”为中心，译文不应因现代读者可能感到不适而弱化或泛化原文，也不应将其扩大为本节未明说的普遍教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出自……也出自……”重现两分句的来源关系与平行结构；正文保留原文对女性的尖锐措辞，脚注说明其简省句法，不替原文消解张力。
