base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/010.yaml
  text: In her virginity[a], lest she be seduced, and in her husband’s house, lest she go astray; in her father’s house, lest she become pregnant, and in her husband’s house[b], lest she be barren.
translation:
  language: zh_hans
  text: 她还是处女时[a]，要防她受人诱惑；在丈夫家中，要防她走入歧途；在父亲家中，要防她怀孕；在丈夫家中[b]，要防她不孕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“要防她被玷污”；希伯来文本作“要防她受人诱惑”。希腊文本使这里的性含义更加明确。
    reason: alternative_reading
  - marker: b
    text: 末句按希伯来文字面也可理解为“要防她受阻”；在此生育语境中，希腊文本明确作“要防她不孕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בבתוליה
  choice: 她还是处女时
  rationale: 该词指处女身份或未婚少女时期；此译自然清楚，也保留希伯来文所说的具体状态，并与希腊文“在处女时期”相符。
- source_word: פן תפתה
  choice: 要防她受人诱惑
  rationale: 希伯来文在此带有被动意味，语境指婚前受到性方面的引诱；“受人诱惑”既表达这一含义，又不把经文未明说的具体情节写死。
- source_word: ובבית בעלה
  choice: 到了丈夫家中
  rationale: 直译为“在她丈夫的家中”；中文用“到了……家中”自然地表达婚后所处的家庭环境。
- source_word: לא תשטה
  choice: 要防她误入歧途
  rationale: 该动词可指偏离正道或犯错；此译保留道德与性行为方面的含混性，不径直限定为通奸。
- source_word: בבית אביה
  choice: 在父亲家中
  rationale: 直接表达女子婚前所在的家庭环境，与希腊文平行材料一致。
- source_word: פן תהרה
  choice: 要防她怀孕
  rationale: 该动词意为怀孕或受孕；“怀孕”是现代中文中清楚自然的表达。
- source_word: בבית אישה
  choice: 到了丈夫家中
  rationale: איש字面可作“男人”，但此处婚姻语境明确指丈夫；与前一处婚后家庭表述保持一致。
- source_word: פן תעצר
  choice: 要防她不能生育
  rationale: 希伯来词字面涉及“受阻、被遏止”，在生育语境中应指不能生育；希腊文στειρώσῃ（不育）有力支持这一理解。
theological_decisions:
- issue: 希伯来文与希腊文在句序和措辞上的细微差异
  choice: 以现存开罗藏经库希伯来文的句序为正文，并在语义较简略处参考希腊文确认其性与生育语境。
  alternative: 按希腊文重排为：处女时恐被玷污、在父家恐怀孕；有丈夫时恐越轨、同居后恐不育。
  rationale: 希伯来文本在此基本完整可解，应作为正文依据；希腊文则用于核对“受诱惑”和“不能生育”等语义，不应据此无声重排希伯来文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“要防”承接本段劝诫父亲谨慎看顾女儿的语境；“误入歧途”有意保留希伯来动词在一般道德偏离与婚姻不贞之间的语义张力。所有脚注标记均置于对应正文短语之后。
