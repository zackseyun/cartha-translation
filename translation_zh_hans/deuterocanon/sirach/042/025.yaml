  yaml_path: translation/deuterocanon/sirach/042/025.yaml
  text: One thing complements another's good things[b][a], and who can have enough of seeing his glory?
translation:
  language: zh_hans
  text: 一物使另一物的美好得以稳固[a]；谁能看够他的荣耀呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一物补足另一物的美好。”希腊语动词本义为“使坚固、加强”；此处也可表达受造之物彼此配合、相得益彰。
    reason: lexical_alternative
  - marker: b
    text: “他的”最可能指上帝；也可理解为受造界所显出的荣耀。
    reason: alternative_reading
lexical_decisions:
- source_word: ἓν τοῦ ἑνὸς
  choice: 一事物……另一事物的
  rationale: 希腊语表达简省，按上下文指受造事物彼此关联；补出“事物”使现代汉语清楚自然，同时不把关系具体限定为“相对”或“互补”。
- source_word: ἐστερέωσεν
  choice: 使……更加坚固
  rationale: 保留动词“使坚固、巩固”的基本意义；“更加”在汉语中表达一物对另一物之美善的加强作用，而不把经文的关系性含义改写为较强解释性的“补足”。
- source_word: τὰ ἀγαθά
  choice: 美善
  rationale: 带冠词的中性复数形容词作名词用，可指美好之物、美好特质或益处；“美善”在此兼顾其宽泛范围及颂赞创造的语境。
- source_word: τίς πλησθήσεται
  choice: 谁能……看够呢
  rationale: 字面为“谁将被充满”，在观看的语境中表示满足、看得够；用反问式“谁能看够”符合现代汉语，并保留不可穷尽之意。
- source_word: ὁρῶν
  choice: 看
  rationale: 现在分词表示持续观看；汉语与“看够”组合即可自然传达持续观赏的意味。
- source_word: δόξαν αὐτοῦ
  choice: 他的荣耀
  rationale: δόξα译为“荣耀”，αὐτοῦ依上下文最自然地指上帝；但其指向在语法上并非绝对明确，故以脚注保留另一理解。
theological_decisions:
- issue: αὐτοῦ所指为何
  choice: “他的”指上帝
  alternative: 也可理解为受造界所显出的荣美
  rationale: 上下文借有秩序的创造颂赞创造主，因此“他的荣耀”最自然地指上帝彰显于创造中的荣耀；同时保留代词可能指向受造之物或其荣美的张力。
- issue: 受造事物之间关系的表达
  choice: 使另一事物的美善更加坚固
  alternative: 补足另一事物的美善
  rationale: 正文优先保留ἐστερέωσεν“使坚固、加强”的词义，不将互相配合的含义完全解释为“补足”；脚注说明该句也可理解为受造之物彼此配合、相得益彰。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一事物”略带书面色彩，但能准确承接希腊语简省结构；分号保留两小句之间由创造秩序转向赞叹荣耀的紧密联系。
