  text: The sun rises and shines on everything revealed[b][a], and the glory of the Lord is over all his works.
translation:
  language: zh_hans
  text: 太阳升起，照耀一切显露之物[b][a]；主的荣耀在他一切的作为之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作“一切显露（或可见）之物”；希腊文平行文本较接近：“太阳发光，察看一切。”
    reason: alternative_reading
  - marker: b
    text: 较早的马萨达希伯来文本见证在本句似乎保存了不同于正文所据开罗藏经库文本的措辞。
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: 太阳
  rationale: 直接指天体“太阳”，现代汉语无需添加冠词。
- source_word: זורחת
  choice: 升起，照耀
  rationale: זרח可表达太阳升起并发光；用两个相连的动词保留希伯来语意象所含的晨升与照明两层意味，希腊语φωτίζων也支持照耀之意。
- source_word: על כל
  choice: 一切／遍及一切
  rationale: 两处都表达无所不包的范围；第一分句按太阳照耀的自然搭配译为“一切”，第二分句用“遍及……一切”自然表达荣耀临到全部作为。
- source_word: נגלתה
  choice: 显露之物
  rationale: 保留该词“被揭开、显现、可见”的被动或结果意味，不把它限定为单纯的视觉对象。
- source_word: כבוד
  choice: 荣耀
  rationale: 这是כבוד用于上帝时庄重且通行的对应词，兼具尊荣、威严与彰显之意。
- source_word: ה׳
  choice: 主
  rationale: 希伯来抄本以缩写形式书写神圣称号或名字；“主”符合《便西拉智训》的中文语体，也不强行确定缩写背后的完整形式。
- source_word: מעשיו
  choice: 他的作为
  rationale: “作为”可涵盖上帝所做之事及其创造之工，并保持诗句的概括性。
theological_decisions:
- issue: ה׳的神圣称号或名字如何翻译
  choice: 主
  alternative: 耶和华／上主
  rationale: 原文仅存缩写ה׳，其展开方式存在一定不确定性；“主”既保留神圣称谓，也避免由译者擅自补定完整形式。
- issue: 首句希伯来文本与希腊平行文本的差异
  choice: 太阳升起，照耀一切显露之物
  alternative: 太阳发光，察看一切／太阳照耀万物
  rationale: 正文以希伯来语为主，保留זרח的升起意象和נגלתה“显露”的措辞；同时以希腊语的“发光”佐证“照耀”这一语义。文本差异另以脚注透明说明。
- issue: 主的荣耀与其作为之间על的关系
  choice: 主的荣耀遍及他一切的作为
  alternative: 主的荣耀在他一切的作为之上
  rationale: “遍及”保留על在此可表示覆盖、临及的关系，也符合创造之工彰显神荣耀的诗意；不进一步说明荣耀究竟是内在充满还是居于其上。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两分句以分号维持智慧文学的平行结构；“显露之物”略带诗性，以保存希伯来文的真实含混。脚注标记依所给英文审定层的次序置于相关短语之后。
