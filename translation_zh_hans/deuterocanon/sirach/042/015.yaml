base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/015.yaml
  text: I will remember the works of God[a], and what I have seen I will recount. At the word of God is his will, and his work accomplishes his pleasure.
translation:
  language: zh_hans
  text: 我要记念上帝的作为[a]，并述说我所看见的。上帝一发话，他的旨意便显明；他的作为成就他所喜悦的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“我要记念主的作为，并述说我所看见的；主的话语中有他的作为。”希伯来文末句艰涩，正文译出其可能的意思，并非严格逐字翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: אזכור נא
  choice: 我要述说
  rationale: זכר可指记念、提说或宣扬；在接续“讲出来”的赞歌语境中，“述说”比生硬的“记念”更自然，也不把נא误译成明确的时间副词“现在”。
- source_word: מעשי אל
  choice: 上帝的作为
  rationale: מעשים表示行为、事迹或作为；“作为”适合颂赞上帝创造与行动的庄重语境，并依希伯来文本将אל译为“上帝”。
- source_word: וזה חזיתי ואספרה
  choice: 把我所看见的讲出来
  rationale: 希伯来语表达简缩；结合希腊平行文本的关系结构，按“我所看见的”理解，并以自然汉语表达אספרה的叙述义。
- source_word: באומר אלהים רצונו
  choice: 上帝一发话，他的旨意就立定
  rationale: 传世希伯来文本较难。“一发话”保留באומר与神言说的关联；“旨意就立定”表达可能的句意，同时不把它等同于后句的成就。
- source_word: ופועל רצונו לקחו
  choice: 他的作为成就他所喜悦的
  rationale: 此分句文本艰涩。译文保留“作为”与רצון可含“喜悦、意愿”的语义，并表达上帝的行动实现其所愿这一可能意义；不声称逐字对应毫无疑义。
theological_decisions:
- issue: אל与希腊平行文本Κυρίου的神圣称谓差异
  choice: 正文按希伯来文译作“上帝”
  alternative: “主”
  rationale: 现存希伯来主见证读אל，应作为正文依据；希腊文本的“主”作为异文信息收入脚注。
- issue: 末句希伯来文本艰涩且见证不同
  choice: 正文表达“上帝发话，其旨意立定；其作为成就所喜悦的”这一可能意义
  alternative: 依希腊文译作“主的话语中有他的作为”
  rationale: 以希伯来见证为先，同时用脚注明示希腊平行文本及正文解释性翻译的性质，避免把不确定的句法伪装成确定结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一发话……就……”使神言说与旨意的关系清楚自然；脚注保留希腊见证和希伯来末句的不确定性。
