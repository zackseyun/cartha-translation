  text: Then Yahweh heard my voice[a], and listened to my supplications.
translation:
  language: zh_hans
  text: 那时，雅威听见了我的声音[a]，垂听了我的恳求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“我的声音”；在这里也可按惯用语理解为“我的呼求”。
    reason: 保留 קוֹלִי 在祷告语境中的字面义与惯用义。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 这是时间副词，承接前文的赞美与祷告，引出雅威的回应；“那时”简洁自然。
- source_word: שָׁמַע
  choice: 听见了
  rationale: 保留其基本义，并与后面的 וַיַּאֲזִין（“垂听”）形成递进。
- source_word: קוֹלִי
  choice: 我的声音
  rationale: 按希伯来文直译为“我的声音”；祷告语境中也可惯用地理解为“我的呼求”，故以脚注保留这一可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: וַיַּאֲזִין
  choice: 垂听了
  rationale: 该词表达侧耳、留心听取；“垂听”既符合祷告语境，也保留了相对于“听见”的专注和回应意味。
- source_word: תַּחֲנוּנָי
  choice: 我的恳求
  rationale: 指求取恩惠或怜悯的迫切祈求；“恳求”在现代汉语中自然、庄重，并保留祷告语域。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；采用较贴近学界通常重构读音的现代汉语音译“雅威”，避免以“主”等称号替换专名。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“听见了……垂听了……”保留希伯来文两个听觉动词的平行与递进；脚注标记已置于正文相应词语之后。
