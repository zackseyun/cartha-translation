  text: Many heard my instruction in my youth[b][a], and they acquired silver and gold by me.
translation:
  language: zh_hans
  text: 我年轻时，许多人听了我的教导，并借着我获得了金银。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“要用许多银子领受训诲，并借此获得许多金子。”这里的希伯来文则是陈述句，不是命令句。
    reason: alternative_reading
  - marker: b
    text: “借着我”也可译作“在我里面”“由我”或“因我”。希伯来语表达十分简约，可能指众人借着说话者或他的教导而有所获得。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: 许多人
  rationale: 准确表达数量众多，符合现代汉语习惯。
- source_word: שָׁמְעוּ
  choice: 听了
  rationale: 保留动词“听”的基本义，不擅自强化为“听从”或“顺服”。
- source_word: לִמּוּדִי
  choice: 我的教导
  rationale: 表达智慧文学中的训诲含义，庄重而易懂。
- source_word: בִּנְעֻרוֹתָי
  choice: 在我年轻时
  rationale: 自然表达复数抽象名词所指的青年时期。
- source_word: וְכֶסֶף וְזָהָב
  choice: 金银
  rationale: 忠实保留两种贵金属的具体意象，并采用自然的汉语词序。
- source_word: תִּקְנוּ
  choice: 得了
  rationale: קנה在此表示取得、获得；“得了”比“买了”更符合以金银为宾语的语境。
- source_word: בִּי
  choice: 借着我
  rationale: 紧凑的介词短语可表示凭借或中介；此译法既通顺，也保留财富是借讲者或其教导而得的含义。
theological_decisions:
- issue: 希伯来文本的陈述句与希腊平行文本的祈使句之间的差异
  choice: 正文依高可信度希伯来见证译为陈述：许多人听了教导并得了金银。
  alternative: 依希腊文译为命令：“要用许多银子领受训诲，并借此获得许多金子。”
  rationale: 现存希伯来文明确采用完成式动词，形成陈述，故正文以希伯来文为主；希腊文的重要异读则收入脚注，不将两者强行调和。
- issue: בִּי所表示的关系
  choice: 借着我
  alternative: 在我里面／因我／由我
  rationale: 该短语本身简约且具有歧义。“借着我”保留工具或中介含义，也与希腊平行文本“借着它（训诲）”相呼应，但不把“我”直接改成“训诲”。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“金银”符合汉语常用搭配；脚注标记置于整节相关陈述之后，正文中的[a]、[b]均有对应脚注。
