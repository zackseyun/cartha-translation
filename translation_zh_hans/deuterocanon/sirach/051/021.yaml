  text: My inward parts burned like an oven as I looked toward her[a]; therefore I will not forsake her.
translation:
  language: zh_hans
  text: 我瞻望她时，五内如火炉般灼热；因此，我必不离弃她[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“我的腹中激动，要寻求她；因此，我获得了美好的所得。”
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: 我五内
  rationale: מֵעֶה本指内脏，也可比喻人内心深处的情感。“五内”保留身体意象，同时在现代中文中具有庄重的诗性；不直接译作“心”，以免抹去原文意象。
- source_word: יֵחַמּוּ כַּתַּנּוּר
  choice: 如火炉般发热
  rationale: 动词表达变热或灼热，תנור是烤炉、火炉。“如火炉般发热”贴近希伯来文本的明喻，不强化为“熔炉”。
- source_word: לְהַבִּיט בָּהּ
  choice: 渴望瞻望她
  rationale: 字面是“瞻望她／看向她”。此处不定式与前句热切的身体意象相连；“渴望”在中文中使目的或动因关系自然可解，但“瞻望她”仍保留原动词及介词的方向感。
- source_word: בַּעֲבוּר כֵּן
  choice: 因此
  rationale: 该短语表示由前文引出的结果，“因此”简洁自然。
- source_word: לֹא אֶעֶזְבֶנָּה
  choice: 我必不离弃她
  rationale: עזב可指离开、撇弃。“离弃”兼顾庄重语体和持续忠于智慧的含义；“必不”自然表达此处未完成式所承载的坚定意向。
theological_decisions:
- issue: 希伯来文本与希腊文本后半节存在重大差异
  choice: 正文依现存希伯来文本译作“因此，我必不离弃她”。
  alternative: 希腊文本作：“我的腹中激动，要寻求她；因此，我获得了一份美好的产业。”
  rationale: 现存希伯来见证可信度高，应作为正文依据；希腊平行文本的差异牵涉整句含义，故在脚注中完整保留，不将两种读法混合。
translation_notes:
  register: 采用现代、庄重而可读的智慧诗歌语体。“五内”“瞻望”“离弃”保留原文的身体意象与诗性；脚注明示希腊平行文本的重大异文。
