base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/008.yaml
  text: And I remembered the mercies of Yahweh[a], and his acts of covenant faithfulness from of old, who delivers those who take refuge in him[b], and redeems them from every evil.
translation:
  language: zh_hans
  text: 我想起耶和华的怜悯，以及他自古以来所施的慈爱；他搭救投靠他的人[a]，救赎他们脱离一切祸患[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“主啊，我想起你的怜悯和你自古以来的作为，因为你搭救等候你的人，救他们脱离列国之手。”希伯来文本则作“投靠他的人”和“脱离一切祸患”。
    reason: alternative_reading
  - marker: b
    text: 希伯来语“恶”（רָע）可指祸患、伤害或邪恶；此处按搭救与救赎的语境译为“祸患”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶזְכְּרָה
  choice: 我便想起
  rationale: זכר表示想起、记起；“我便想起”自然承接叙事，也保留第一人称动作。
- source_word: רַחֲמֵי
  choice: 怜悯
  rationale: 复数形式可指多次或多方面的怜悯表现；汉语集合名词“怜悯”无需生硬复数化。
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 直接标示希伯来文本中的神名，符合现代中文圣经语域。
- source_word: וַחֲסָדָיו
  choice: 他的慈爱作为
  rationale: חסד兼有慈爱、忠贞与信实之意；加“作为”使希伯来语复数所指的具体施恩行动可闻，同时不把盟约含义说得过满。
- source_word: אֲשֶׁר מֵעוֹלָם
  choice: 自古以来
  rationale: 既可表达久远的历史延续，也不强行限定为形而上的永恒。
- source_word: הַמַּצִּיל
  choice: 他搭救
  rationale: 分词描述耶和华恒常的行动；汉语用独立分句自然表达，不强加因果连接词。
- source_word: חוֹסֵי בוֹ
  choice: 投靠他的人
  rationale: 保留חסה ב所含寻求庇护、以其为避难所的具体意象，而非泛化为“相信”。
- source_word: וַיִּגְאָלֵם
  choice: 救赎他们
  rationale: גאל不只是一般救助，也有赎回、施行救赎之意；“救赎”保留其较强语义。
- source_word: מִכָּל רָע
  choice: 脱离一切祸患
  rationale: רָע在此可涵盖恶事、灾祸和伤害；“祸患”与拯救语境自然相合，同时脚注说明更直译的可能。
theological_decisions:
- issue: חסד在上帝救赎行动语境中的表达
  choice: 慈爱作为
  alternative: 忠贞之爱；信实的慈爱；慈爱
  rationale: 本节以搭救和救赎说明上帝长久的חסד。“慈爱作为”兼顾其具体施恩行动和忠贞内涵，却不额外加入原文未明说的盟约术语。
- issue: מֵעוֹלָם的时间范围
  choice: 自古以来
  alternative: 从亘古；直到永远
  rationale: 该短语既可能强调远古以来，也可能带有恒久意味。“自古以来”保留历史深度，而不排除持续性的理解。
- issue: רָע的语义范围
  choice: 祸患
  alternative: 邪恶；一切恶事
  rationale: 在搭救与救赎的语境中，“祸患”较自然，但רָע也可能包含道德之恶，因此用脚注保留其宽广语义。
- issue: הַמַּצִּיל与前句的句法关系
  choice: 以分号后独立描述句表达：“他搭救……”
  alternative: “因为他搭救……”；“那位搭救……的”
  rationale: 希伯来语分词可作对耶和华的同位描述，也可在语义上支持前述回想。译文避免明确加入“因为”，从而保留句法张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华”“救赎”维持经文语体；“慈爱作为”呈现חסד复数所指的施恩行动。正文中的[a]与脚注对应。
