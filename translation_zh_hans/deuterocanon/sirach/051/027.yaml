  text: See with your own eyes that I was young[b][a], and I stood by her and found her.
translation:
  language: zh_hans
  text: 你们亲眼看：我原本是渺小的，却坚守于她[a]，也寻见了她。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两处都用阴性后缀，很可能指人格化的智慧；也可按中文习惯译作“它”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作：“你们亲眼看，我劳苦不多，并为自己找到了许多安息。”这反映了一个明显不同的文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ בְעֵינֵיכֶם
  choice: 你们亲眼看看
  rationale: 复数命令式配合“你们的眼睛”，表达亲自察看、验证；译文自然保留了直接呼吁的语气。
- source_word: כִּי קָטֹן הָיִיתִי
  choice: 我原是微小的
  rationale: קטן可指年幼、微小或卑微。这里保留较宽泛的“微小”，避免把含义限定为年龄，同时表达说话者起初微不足道的状态。
- source_word: וְעָמַדְתִּי בָהּ
  choice: 却持守于她
  rationale: עמד与介词ב及阴性后缀连用，可表达站立、坚持或恒心依附。中文“持守于她”传达持续不离的意味，并保留所指对象的阴性人格化。连接词字面为“和”，但上下文从“微小”转向坚持，中文用“却”自然呈现隐含的转折。
- source_word: וּמְצָאתִיהָ
  choice: 也寻见了她
  rationale: מצא加阴性宾语后缀，直指“寻见她”。“寻见”既保留“找到”的基本意义，也适合寻求智慧的语境。
theological_decisions:
- issue: בָהּ与מְצָאתִיהָ的阴性后缀所指及智慧的人格化
  choice: 正文译作“她”，保留希伯来文的阴性指称，并让上下文中的智慧人格化保持可见。
  alternative: 译作“它”，将所指理解为非人格化的智慧或训诲。
  rationale: 希伯来文两处都明确使用阴性后缀，且《便西拉智训》常将智慧人格化。译作“她”最直接反映语法，但不进一步界定其神学身份。
- issue: 希伯来文与希腊文平行文本的显著差异
  choice: 以现存希伯来文为正文依据，并用脚注列出希腊文异读。
  alternative: 采用希腊文“我劳苦不多，却为自己找到许多安息”的文本形态。
  rationale: 本节希伯来文本可信度高，项目原则要求现存希伯来文优先；希腊文所反映的文本形态差异较大，不能静默合并，故透明注明。
- issue: וְ在“微小”与“持守”之间的关系
  choice: 译作“却”，表达语境中隐含的反差。
  alternative: 直译为“并且”。
  rationale: 希伯来文连接词本身宽泛，可承载顺接或转折。此处“原是微小的”与仍然坚持并寻见智慧形成自然反差；中文用“却”更清楚，但不改变事件内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亲眼看看”自然传达直接验证；“微小”有意保留年龄、地位或能力上的多义性；“持守于她”略带经文语体，以兼顾希伯来文结构和智慧的人格化。
