translation:
  language: zh_hans
  text: 我称谢你的名，因为你成了我的庇护者和帮助者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολογοῦμαι
  choice: 称谢
  rationale: 此处用于向上帝的名表达感恩和颂赞；“称谢”既保留敬拜语境，也比单纯“感谢”更庄重。
- source_word: τῷ ὀνόματί σου
  choice: 你的名
  rationale: 直译希腊文，保留圣经中“名”所承载的身份、声誉与临在等丰富含义，不改写为“你”。
- source_word: σκεπαστής
  choice: 庇护者
  rationale: 该词指提供遮蔽和保护的人；“庇护者”自然地表达其人格性和保护作用。
- source_word: βοηθός
  choice: 帮助者
  rationale: 保留原文与“庇护者”并列的称谓结构，不弱化为抽象的“帮助”。
- source_word: ἐγένου μοι
  choice: 你成了我的
  rationale: 保留原文动态而具关系性的表达，体现说话者在患难中亲历上帝成为其庇护与帮助。
theological_decisions:
- issue: “你的名”是否意译为“你”
  choice: 保留“你的名”
  alternative: 称谢你
  rationale: 原文明确提到上帝的“名”；保留这一表达可避免抹平其神学和诗歌内涵。
- issue: σκεπαστής与βοηθός是否合并为一般性的“保护和帮助”
  choice: 译为两个并列的人格称谓“庇护者和帮助者”
  alternative: 我的保护和帮助
  rationale: 希腊文使用两个行动者名词，原句强调上帝亲自成为说话者的庇护者和帮助者，应保留这一关系性陈述。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜语体。所给希伯来文内容明显对应更长的异文或不同节号，与本节希腊平行文本及经审核的英文咨询层严重不符；因此本稿依据明确标为《便西拉智训》51:2的希腊文本翻译，不把所给希伯来段落强行并入本节。
