  text: In her I made progress, and I will give glory to the one who gives me wisdom[b][a].
translation:
  language: zh_hans
  text: 我在她里面有了长进；我要把荣耀归给那赐我智慧的。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文见证此处难解，并与希腊文有显著差异。开罗藏经库希伯来文本大致可译为：“她的轭成了我的荣耀（或：这对我是一种尊荣）；我要向我的老师（们）献上感谢。”希腊文则是：“我在她里面有了长进；我要把荣耀归给那赐我智慧的。”
    reason: textual_variant
  - marker: b
    text: 若较贴近希伯来文，末句也可译作：“我要感谢我的老师（们）。”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκοπὴ ἐγένετό μοι ἐν αὐτῇ
  choice: 我在她里面有了长进
  rationale: 希腊平行文本意为“在她里面，我有了进展”。鉴于希伯来文本此处难解且与希腊文有重大差异，正文采用语意较清楚的希腊见证；“她”保留智慧人格化的阴性指称，“在……里面”也保留ἐν可能具有的空间或凭借层面的含混。
- source_word: עֻלָּהּ הָיָה לִי לְכָבוֹד
  choice: 正文不直译；异文收入注释
  rationale: 现存希伯来措辞可近似理解为“她的轭成了我的荣耀”或“这对我是一种尊荣”，但עֻלָּהּ及整句关系并不稳定。为避免把疑难读法武断固定，正文依希腊文，希伯来读法在注释中完整保留。
- source_word: τῷ διδόντι μοι σοφίαν
  choice: 那赐我智慧的
  rationale: 直译希腊文的单数分词结构，不明确补出“上帝”，从而既允许其指向智慧的神圣赐予者，也不在译文中消除与希伯来文“我的老师（们）”之间的张力。
- source_word: δόξαν / הוֹדָאָה
  choice: 荣耀
  rationale: 正文依希腊文δόξαν译为“荣耀”；希伯来文הוֹדָאָה更接近“感谢、称谢”，故作为重要异文收入注释。
theological_decisions:
- issue: “那赐我智慧的”所指是谁
  choice: 保留为未明说身份的单数称谓
  alternative: 明确译作“上帝”，或依希伯来文译作“我的老师（们）”
  rationale: 希腊文很可能指上帝，但本节没有明说；希伯来见证则可能指人间教师。正文不补明身份，以保存文本的神学张力。
- issue: 智慧的人格化性别
  choice: 用“她”指智慧
  alternative: 用中性的“它”或改写以回避代词
  rationale: 希腊文阴性代词承接上下文人格化的智慧；中文用“她”能显出这种修辞，但不因此断定其本体身份。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“有了长进”比生硬的“进展临到我”更符合中文表达；分号对应原文两个并列分句。正文依较完整清楚的希腊平行文本，但以双重注释明确保存希伯来见证及其不确定性。
