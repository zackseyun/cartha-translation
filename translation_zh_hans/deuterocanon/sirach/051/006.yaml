  text: My soul came near to death[b][a], and my life to the depths of Sheol.
translation:
  language: zh_hans
  text: 我的性命临近[a]死亡；我的生命临近阴间[b]的深处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临近”直译可作“触及”或“达到”；希腊平行文本作“临近死亡”。
    reason: lexical_alternative
  - marker: b
    text: “阴间”是希伯来文对死者所在之境的称呼；希腊平行文本作“下方的冥府”。
    reason: source_term_clarification
lexical_decisions:
- source_word: וַתִּגַּע
  choice: 临近
  rationale: נגע本义为“触及、达到”；与“死亡”连用时表达逼近死亡。希腊平行文本ἤγγισεν（临近）支持这一语境义。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפש在此可指人的生命、自己或魂。译作“性命”既自然表达濒死处境，也与下句“我的生命”保持近义而不完全重复的诗歌平行。
- source_word: חַיָּתִי
  choice: 我的生命
  rationale: 该词指说话者的生命或生命力；“生命”清楚自然，并与希腊文ἡ ζωή μου相符。
- source_word: לִשְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל指死者所在之境；现代中文圣经语体通常以“阴间”表达，较“坟墓”宽泛，也不引入希腊神话色彩。
- source_word: תַּחְתִּיּוֹת
  choice: 深处
  rationale: 复数形式表示最低、极深之处；“阴间的深处”自然保留其加强意味，也与希腊平行文本κάτω（下方）相合。
theological_decisions:
- issue: שְׁאוֹל所指死者之境应如何表达
  choice: 阴间
  alternative: 坟墓；冥府；音译“示阿勒”
  rationale: 以现存希伯来文本为首要依据。“阴间”保留死者之境的宽泛含义，不把它缩窄为实体坟墓，也不对来世状态作超出原文的教义性界定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两分句保留希伯来诗歌的平行结构；“性命／生命”体现נפשי与חייתי的近义对应。“临近”在第二分句补出，使中文句法完整，并忠实呈现原文省略谓语的平行关系。
