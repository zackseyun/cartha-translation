base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/001.yaml
  text: I will praise you[a], God of my salvation; I will give thanks to you, God of my father. I will declare your name, the stronghold of my life[c][b], for you have redeemed my soul from death.
translation:
  language: zh_hans
  text: '我要赞美你，拯救我的上帝[a]；

    我要感谢你，我父亲的上帝。


    我要述说你的名——我生命的堡垒[b]，

    因为你已救赎我的性命脱离死亡[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行本的开头略有不同：“主、君王啊，我要感谢你；我的救主上帝啊，我要赞美你。”
    reason: textual_variant
  - marker: b
    text: 希伯来文也可补出语意，译作“我要述说你的名是我生命的堡垒”。
    reason: lexical_alternative
  - marker: c
    text: “性命”所译的希伯来词也可指“生命”、“我本人”或“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלֶךָּ
  choice: 我要赞美你
  rationale: הלל的加强词干在此表示赞美；“赞美”自然、庄重，也与下一分句的“感谢”保持语义区别。
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: 我救恩的上帝
  rationale: 保留希伯来文“上帝＋我的救恩”的属格结构及其诗歌色彩，不直接改写为“我的救主”。
- source_word: אוֹדְךָ
  choice: 我要感谢你
  rationale: ידה的使役词干可表示称谢、颂赞或宣认；与前面的“赞美”并列时，“感谢”最能体现两个动词的差别。
- source_word: אֱלֹהֵי אָבִי
  choice: 我父亲的上帝
  rationale: אָבִי明确为单数“我的父亲”，不泛化为“祖先”或复数“列祖”。
- source_word: אֲסַפְּרָה
  choice: 我要述说
  rationale: ספר在此指讲述、宣告；“述说”适合公开赞颂的诗歌语境。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译“你的名”，保留圣经语言中名字所承载的身份、品格与声誉意涵。
- source_word: מָעוֹז חַיַּי
  choice: 我生命的堡垒
  rationale: מָעוֹז指坚固之处、堡垒或避难所；“堡垒”保留具体的保护性意象，并可自然地与“你的名”构成同位关系。
- source_word: פָדִיתָ
  choice: 你已……救赎
  rationale: פדה含赎回、赎救之意；“救赎”保留其分量，同时不把经文限定为后期的某一教义表述。
- source_word: נַפְשִׁי
  choice: 我的性命
  rationale: נפש在“脱离死亡”的语境中主要指人的生命或本人；“性命”比“灵魂”更自然地表达从死亡中获救，同时以脚注保留其他可能译法。
theological_decisions:
- issue: פָדִיתָ在感谢拯救的语境中如何表达
  choice: 救赎
  alternative: 搭救；赎回
  rationale: “救赎”既表达实际从死亡中获救，也保留פדה所含的赎回意味，但不额外说明赎价或救赎机制。
- issue: שִׁמְךָ מָעוֹז חַיַּי的句法关系
  choice: 将“我生命的堡垒”作为“你的名”的同位语
  alternative: 补出系词，译作“你的名是我生命的堡垒”
  rationale: 希伯来文未明示系词，可作同位结构，也可理解为隐含判断句；正文保留紧凑的同位表达，脚注说明另一读法。
- issue: נַפְשִׁי是否译作“灵魂”
  choice: 性命
  alternative: 灵魂；生命；我本人
  rationale: 此处与“死亡”直接相对，更可能指整个人的性命，而非特别区分身体与非物质灵魂；脚注保留该词的语义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。保留“我救恩的上帝”这一略带圣经语感的属格结构；以“堡垒”维持原文的具体隐喻，并用破折号呈现紧凑的同位关系。各行依照希伯来文的平行结构分行。
