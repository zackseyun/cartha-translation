  text: from a choking fire all around[a], and from the midst of a fire that I did not kindle.
translation:
  language: zh_hans
  text: 脱离四面包围、令人窒息的烈火[a]，又脱离我未曾点燃的火焰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节现存的希伯来文很难理解，并且与希腊文有显著差异。后半句若较贴近现存希伯来文，可译成类似“从深渊的腹中，到我母亲”，但在此语境中意思不明。
    reason: textual_variant
lexical_decisions:
- source_word: מְכַבּוֹת אֵשׁ / πνιγμοῦ πυρᾶς
  choice: 令人窒息的烈火
  rationale: 现存希伯来文“מְכַבּוֹת אֵשׁ”语义难解；希腊文“πνιγμοῦ πυρᾶς”清楚表达令人窒息或闷住人的火。译文采用希腊文所保存的连贯意思，同时保留希伯来文明确共有的“火”意象。
- source_word: לְאֵין פֶּחָה / κυκλόθεν
  choice: 四面包围
  rationale: 希伯来语短语在此语境中难以确定，可按字面牵强理解为“没有吹气”或“没有风箱”；希腊文“κυκλόθεν”明确意为“四面、周围”，也与受火围困的语境相合。
- source_word: ἐκ μέσου πυρός
  choice: 脱离……火焰
  rationale: 该短语直指从火的中间出来。中文以“脱离……火焰”自然表达获救之意，并与本节作为前文句法延续的形式相称。
- source_word: οὗ οὐκ ἐξέκαυσα
  choice: 我未曾点燃的
  rationale: “ἐξέκαυσα”是第一人称主动形式，通常意为“我点燃、使燃烧”；因此译作“我未曾点燃”，不改成被动的“没有烧伤我”。
- source_word: מֵרֶחֶם תְּהוֹם לְאִמִּי
  choice: （异文见脚注）
  rationale: 现存希伯来文大致呈现“从深渊的腹中，到我母亲”之类措辞，在上下文中意义晦涩，并与希腊文严重分歧，故不强行纳入正文，而在脚注中如实披露。
theological_decisions:
- issue: 现存希伯来文严重晦涩时是否采用希腊文平行见证
  choice: 正文采用希腊文所保存的连贯读法，同时保留希伯来文与希腊文共有的火焰意象，并以脚注说明分歧。
  alternative: 按现存希伯来文字面译成类似“从不吹动的灭火之物，从深渊的腹中，到我母亲”，但其句意难以成立。
  rationale: 《便西拉智训》的希伯来文见证通常应居优先地位，但本节被标为重大不一致，且后半句在现存形式中无法产生可靠的上下文意义。采用希腊文并公开注明希伯来文异况，既避免制造虚假的确定性，也不掩盖文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“四面包围、令人窒息”自然传达希腊文的围困与窒息感；“未曾”略带庄重色彩，但仍属现代常用表达。正文保持片语式结构，以便承接上下文连续列举的“脱离……”对象。
