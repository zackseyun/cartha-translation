  text: My soul clung to her, and I did not turn my face away from her.
translation:
  language: zh_hans
  text: 我的心依恋她；我没有转脸离开她。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַשְׁקָה נַפְשִׁי
  choice: 我的心依恋
  rationale: חָשַׁק 表示强烈地爱慕、眷恋或紧紧依附；“依恋”既保留情感强度，也符合现代汉语表达。נֶפֶשׁ 在此指人的内在生命与意愿，译作“心”比直译“灵魂”更自然。
- source_word: בָּהּ
  choice: 她
  rationale: 阴性代词回指上下文中的智慧；保留拟人化的阴性指称。
- source_word: וּפָנַי לֹא אַהֲפֹך מִמֶּנָּה
  choice: 我的脸也没有转离她
  rationale: 贴近希伯来语的身体意象，表达没有背离或停止专注；“也”自然承接前一分句。
theological_decisions:
- issue: 智慧的拟人化
  choice: 以“她”指称智慧
  alternative: 改为无性别的“它”或直接重复“智慧”
  rationale: 希伯来语代词为阴性，且经文将智慧人格化；保留“她”可呈现原文修辞，而不进一步断定其本体身份。
- issue: חָשַׁק 的情感与依附含义
  choice: 依恋
  alternative: 渴慕／紧紧依附
  rationale: “依恋”兼顾爱慕与不离弃的意味，并与下句“不转离”形成自然呼应，不把语义限缩为单纯欲望或肢体动作。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；保留“转脸离开”的希伯来语意象，但调整为汉语可读的“脸转离”。
