base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/026.yaml
  text: Bring your neck under her yoke[a], and let your soul bear her burden. She is near to those who seek her, and the one who gives himself finds her.
translation:
  language: zh_hans
  text: 把你们的颈项置于她的轭下[a]，让你们自己承担她的重担。她离寻求她的人很近；献上自己的人找到她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“让你们自己领受教诲。”希伯来文本则作：“让你们自己承担她的重担。”
    reason: 保存希伯来正文与希腊平行传统之间的重要异文／诠释差异。
lexical_decisions:
- source_word: וְצַוְּארֵיכֶם
  choice: 你们的颈项
  rationale: 原文为复数，并以身体意象表达顺服；“颈项”庄重而清楚，也与“轭”的比喻自然搭配。
- source_word: בְּעֻלָּהּ הָבִיאוּ
  choice: 置于她的轭下
  rationale: 希伯来文本此处措辞略显困难，但希腊平行文本明确保留“轭”的意象；译文以自然汉语表达主动接受智慧约束之意。
- source_word: וּמַשָּׂאָהּ
  choice: 她的重担
  rationale: מַשָּׂא指所负之物或担子；“重担”与前句的“轭”共同维持负重的比喻。
- source_word: תִּשָּׂא נַפְשְׁכֶם
  choice: 让你们的心灵担起
  rationale: 依现存希伯来文本保留“心灵承担”的表达，不以希腊文本的“领受教诲”取代正文。
- source_word: קְרוּבָה הִיא לִמְבַקְשֶׁיהָ
  choice: 她离寻求她的人很近
  rationale: 保留智慧的阴性人格化，也忠实表达她与寻求者相近的关系。
- source_word: וְנוֹתֵן נַפְשׁוֹ
  choice: 献上自己的人
  rationale: 字面涉及“交出自己的生命／心灵”，语境强调为寻求智慧而全然投入；“献上自己”既保留自我奉献的力度，又避免误解为单指死亡。
- source_word: מוֹצֵא אֹתָהּ
  choice: 必寻见她
  rationale: “寻见”与上句“寻求”形成自然呼应；“必”在汉语中体现分词陈述所表达的规律性结果。
theological_decisions:
- issue: 智慧的人格化
  choice: 全节以阴性“她”指智慧
  alternative: 把智慧当作抽象事物，以“它”指称
  rationale: 希伯来语以阴性形式指智慧，本段也将智慧塑造成可亲近、可寻求的人格化形象，因此保留“她”。
- issue: 希伯来文本与希腊平行文本第二分句的差异
  choice: 正文采用希伯来文本“担起她的重担”
  alternative: 依希腊文本译为“让你们的心灵领受教诲”
  rationale: 现存希伯来文本在此完整且语意连贯，应作为正文依据；希腊传统的重要差异则收入脚注。
- issue: “献上自己”的含义
  choice: 保留全然委身的开放表达
  alternative: 明确释为“专心致志”或“舍命”
  rationale: 原文 נוֹתֵן נַפְשׁוֹ 可表达献出自身、生命或心力；译文不把它收窄为心理专注，也不武断限定为殉身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“颈项—轭—重担”保留原文连续比喻；“心灵”延续 נֶפֶשׁ 的人性用语而不将其扁平化为“自己”。脚注标记[a]已置于正文相应位置。
