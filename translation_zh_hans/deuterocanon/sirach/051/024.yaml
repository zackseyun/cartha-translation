  text: How long will you lack these things[a], while your soul is very thirsty?
translation:
  language: zh_hans
  text: 你们在这些事上还要有所缺乏到几时呢[a]？你们的心灵必极其干渴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近似：“你们在这些和那些事上有所缺乏，要到几时呢？你们的心灵必极其干渴。”其中“这些和那些”的措辞在孤立处较生硬。希腊文平行文本近似：“而且你们说自己在这些事上有所欠缺，你们的心灵极其干渴。”正文以希伯来文为主，并参考希腊文将“这些和那些”译为“这些事”。
    reason: 说明希伯来文较生硬的措辞，并交代希腊文平行文本在句法和时态上的差异。
lexical_decisions:
- source_word: עַד מָתַי
  choice: 到几时呢
  rationale: 这是带有劝诫意味的时间问句；“到几时呢”自然、庄重，也保留了原文的责问语气。
- source_word: תַחְסְרוּן
  choice: 你们还要缺少
  rationale: חסר表示“缺少、欠缺”；未完成体在问句中可表达持续的状态，“还要”体现这种延续意味，同时保留对复数听众的称呼。
- source_word: מִן אֵלּוּ וְאֵלּוּ
  choice: 这些事物
  rationale: 希伯来语直译近似“从这些和这些”，措辞较为生硬；结合上文所论之事以及希腊文ἐν τούτοις，“这些事物”清楚表达所指而不作过度限定。
- source_word: וְנַפְשְׁכֶם
  choice: 你们的心灵
  rationale: נפש可指生命、自身或内在的人；在“干渴”的比喻中，“心灵”既保留智慧文学中内在渴求的意味，也不预设某种技术性的灵魂论。
- source_word: צְמֵאָה מְאֹד תִּהְיֶה
  choice: 必极其干渴
  rationale: 按希伯来语保留“将要／必会”的形式，并以“极其”对应מְאֹד的强烈程度；“干渴”兼具身体与内在渴求的意象。
theological_decisions:
- issue: 智慧劝诫中נפש的人论含义
  choice: 你们的心灵
  alternative: 你们的生命；你们自己
  rationale: 此处描述因欠缺智慧教导而产生的深切渴求。“心灵”保留原文的存在性和属灵共鸣，但不把נפש限定为与身体分离的实体。
- issue: 时态所呈现的是当前状态还是将来结果
  choice: 必极其干渴
  alternative: 正极其干渴
  rationale: 希伯来文使用תִּהְיֶה“将会／必会”，希腊文平行文本则使用现在时“正渴着”。正文优先遵循希伯来文，不以希腊文消解其时态张力，并在脚注中交代差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“到几时呢”保留智慧教师劝诫式的语气；“心灵”“极其干渴”维持诗性意象。正文中的复数“你们”准确反映希伯来语动词和人称后缀，虽“心灵”在原文为集合性单数，中文仍可自然理解为众人的内在生命。
