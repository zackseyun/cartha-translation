  text: Turn to me[a], you who are simple[b], and lodge in the house of my instruction.
translation:
  language: zh_hans
  text: 你们这些未受教的人哪，到我这里来[a]；在我教诲的屋舍中留宿吧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“转向我”或“亲近我”。希腊文平行经文作“未受教的人哪，到我这里来；在教诲的屋舍中留宿吧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: 你们要转向我
  rationale: פנה 的命令式本义是“转向、面向”。译作“转向我”紧贴希伯来文；希腊文平行经文的“到我这里来／亲近我”也表明这是邀请性的呼召。
- source_word: סְכָלִים
  choice: 未受教的人
  rationale: 此词可指愚昧、缺少知识或未经训导的人。鉴于本节处于智慧教导的语境，且希腊文 ἀπαίδευτοι 明指“未受教育、未经训练的人”，正文采用“未受教的人”，同时以脚注保留“愚蒙人、愚人”等较强译法。
- source_word: וְלִינוּ
  choice: 住下
  rationale: לין 常指投宿、过夜或留住；希腊文 αὐλίσθητε 也有住宿之意。“住下”在现代汉语中自然，并保留进入某处持续停留的意象。
- source_word: בְּבֵית מִדְרָשִׁי
  choice: 在我讲学的屋里
  rationale: בֵּית 是“屋、房舍”，מִדְרָשׁ 在此指研习、讲授或教导之所。“我讲学的屋”既保留房屋意象，也避免把该词过早技术化为后世制度性的“经学院”。
theological_decisions:
- issue: סְכָלִים 应译为道德责斥性的“愚人”，还是教育意义上的“未受教者”
  choice: 未受教的人
  alternative: 愚蒙人；愚人；无知的人
  rationale: 希伯来词本身容许较强的负面意味，但本节是智慧教师发出的求学邀请，希腊文平行经文又明确偏向缺少教育或训练的含义。因此正文采用教育性的表达，并在脚注中保留希伯来文可能具有的较强语气，避免消除原文张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“未受教的人哪”保留智慧文学中教师公开呼唤听众的语气；“在我讲学的屋里住下”保留房舍、讲学与住宿三重意象，不使用可能带有后世制度色彩的专门术语。
