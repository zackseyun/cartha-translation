  text: I prayed for her in my youth[a], and I found much knowledge.
translation:
  language: zh_hans
  text: 我年轻时祷告，并得到了许多知识。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“我在圣殿前为她祈求，并要寻求她直到终了。”这里的“她”指智慧。希伯来文本则作：“我年轻时祷告，并得到了许多知识。”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל תְּפִלָּה
  choice: 祷告
  rationale: 原文以同源宾语构成“祷告一个祷告”的强调表达；现代汉语用“祷告”即可自然传达其动作含义，避免生硬重复。
- source_word: בִּנְעֻרוֹתָי
  choice: 我年轻时
  rationale: 该复数抽象形式指人生的青年时期；“我年轻时”自然、清楚，并保留时间含义。
- source_word: וְהַרְבֵּה
  choice: 丰富的
  rationale: 此处表达数量丰盛，与“知识”搭配时译作“丰富的”比“许多”更符合现代汉语习惯，同时不改变程度。
- source_word: מָצָאתִי
  choice: 获得了
  rationale: 基本义为“找到”，但在求取知识的语境中表示有所收获；“获得了”在汉语中自然地保留达到、取得之意。
- source_word: דֵעָה
  choice: 知识
  rationale: 该词意为知识或认识；“知识”最贴近词义，也避免直接译成另一智慧术语“智慧”。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在求智慧语境中的差异
  choice: 正文依照高可信度希伯来文本，不补出希伯来文没有明说的阴性宾语“她”，并将希腊异文完整保留在脚注中。
  alternative: “我年轻时为她祷告，便获得了丰富的知识”；或依希腊文译为“我在圣殿前为她祈求，并要寻求她直到终了”。
  rationale: 希伯来见证清楚陈述年轻时祷告并获得知识；希腊文本则提到在圣殿前为“她”祈求，并持续寻求她。两者差异较大，若把希腊文的“她”补入希伯来正文，容易造成一个并不存在于任一完整见证中的合成句。因此以希伯来文为正文，借脚注保存希腊传统及其所指向的智慧语境。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“祷告”符合经书语体而不过分古雅；“获得了丰富的知识”流畅表达求知所得。脚注标记置于正文相应句末。
