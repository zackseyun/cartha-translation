base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/013.yaml
  text: I was young[a], and I loved wisdom; I desired her and sought her out. In faithfulness my foot walked; from my youth, O Lord[b], I learned wisdom.
translation:
  language: zh_hans
  text: 我年少时就爱智慧[a]；我渴慕她，也寻求她。我的脚步循着她的真理而行[b]；主啊，我从年少时就学习智慧。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “爱智慧”在卡哈纳汇编的希伯来文本中置于方括号内，表示这几个字的文本见证或复原具有一定不确定性。
    reason: textual_uncertainty
  - marker: b
    text: “真理”所译的希伯来词也可译作“真实”或“信实”；原文直译近于“我的脚行在她的真实（或信实）中”。
    reason: lexical_alternative
  - marker: c
    text: 希腊文平行文本有显著不同：“我还年轻、尚未迷失以前，就在我的祷告中公开寻求智慧。”正文依照现存的希伯来文本。
    reason: alternative_reading
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: 我年少时
  rationale: 直接表达说话者当时年轻，不额外限定性别；加“时”使现代汉语自然。
- source_word: וָאוֹהַב חָכְמָה
  choice: 就爱智慧
  rationale: 按现存希伯来文本括注中的字句翻译；“就”与年少时期相连，体现早年已经爱慕智慧，但不改写为希腊文本的内容。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是《便西拉智训》中该词的标准译法；下文以阴性代词指代，保留智慧的拟人化。
- source_word: וְחָפַצְתִּי בָהּ
  choice: 我渴慕她
  rationale: חפץ兼有喜爱、渴望之意；“渴慕”在此能自然表达对拟人化智慧的强烈向往。
- source_word: וּבִקַּשְׁתִיהָ
  choice: 也寻求她
  rationale: 忠实表达בקש所含主动寻找、追求之意，并与前句的拟人化一致。
- source_word: בַּאֲמִתָּהּ
  choice: 在她的信实中
  rationale: 保留希伯来语阴性后缀“她的”，使其指向智慧；אמת可指真实、信实或可靠，此处不把多义性暗中消解。
- source_word: דָּרְכָה רַגְלִי
  choice: 我的脚步行
  rationale: 保留希伯来语以“脚”描写行走的具体意象，同时用“脚步”使中文自然。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 按呼语处理；“主啊”是现代中文中自然、庄重的直接称呼，不加入原文没有的物主成分。
- source_word: מִנְּעוּרַי
  choice: 从年少时
  rationale: 表达学习智慧始于青年时期，并保留持续性可能。
- source_word: לָמַדְתִּי
  choice: 学习
  rationale: 采用主动语态，既可涵盖学习的过程，也不收窄为正规的学术研习或被动受教。
theological_decisions:
- issue: 希伯来文本与希腊平行文本的显著差异
  choice: 正文以现存希伯来见证为主，译出爱慕、渴慕并寻求智慧，以及从年少学习智慧。
  alternative: 依希腊文译作：“我还年轻、尚未迷失以前，就在祷告中公开寻求智慧。”
  rationale: 本节有希伯来文本可据，应以希伯来见证为正文基础；希腊文虽主题相近，措辞和内容却明显不同，不宜将二者调和成一个正文，故在脚注中完整保留重要异文。
- issue: בַּאֲמִתָּהּ中אמת的语义
  choice: 信实
  alternative: 真实；真理；可靠
  rationale: 该词可描述真实、忠诚或可靠性；正文取“信实”，同时保留“她的”这一指向智慧的后缀，并在脚注交代其他可行理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“她”用于延续希伯来语中智慧的阴性拟人化；“我的脚步行在她的信实中”略带诗性，以保存原文具体意象和语义张力。
