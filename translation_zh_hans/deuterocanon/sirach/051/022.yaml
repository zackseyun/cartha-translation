  text: Yahweh has given me the reward of my lips[b][a]; therefore I acquired her as a good possession.
translation:
  language: zh_hans
  text: 耶和华把我嘴唇的报偿赐给我[a]；因此，我得着了她这美好的产业[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“主赐给我舌头作为我的报偿；我要用它赞美他。”
    reason: alternative_reading
  - marker: b
    text: “她”在上下文中指智慧。
    reason: cross_reference
lexical_decisions:
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 直接对应希伯来文神名，在现代简体中文圣经语体中清楚、庄重，也不把专名泛化为称号。
- source_word: שְׂכַר שִׂפְתוֹתָי
  choice: 我嘴唇的报偿
  rationale: 保留“嘴唇”这一具体意象，也保留属格关系可能涵盖言语、颂赞及其所得回报的张力，不在正文中擅自解释。
- source_word: בַּעֲבוּר כֵּן
  choice: 因此
  rationale: 自然、简洁地表达该短语的因果或结果意味。
- source_word: קְנִיתִיהָ
  choice: 我得着她
  rationale: קנה可指取得、获得或购得；“得着”保留较宽泛的取得义，避免无根据地强化商业购买意味。阴性代词“她”保留下来，并由脚注说明其所指。
- source_word: קִנְיָן טוֹב
  choice: 美好的产业
  rationale: “产业”表达可拥有的珍贵所得，并与“得着”形成语义呼应；“美好”直接对应טוֹב，不额外强化为“无价”或“珍贵”。
- source_word: αἰνέσω αὐτόν
  choice: 不纳入正文
  rationale: 希腊文在此作“我要用它赞美他”，与现存希伯来文显著不同。既然希伯来文本存且可信度高，正文从希伯来文，希腊异文则完整列入脚注。
theological_decisions:
- issue: 希伯来文与希腊文分歧时的正文选择
  choice: 正文采用现存希伯来文：耶和华赐下嘴唇的报偿，诗人因此得着智慧为美好的产业。
  alternative: 希腊文作：“主赐给我舌头作为我的报偿；我要用它赞美他。”
  rationale: 本节有可信度较高的希伯来文见证，应优先据其翻译；希腊文代表实质性的古代异读，不应混入正文，也不应省略，故收入脚注。
- issue: 阴性代词的所指
  choice: 保留“她”，并在脚注指出上下文所指为智慧。
  alternative: 在正文直接译为“智慧”。
  rationale: 希伯来文使用阴性后缀而未在本句重述名词；保留代词更忠实于原句衔接，脚注则帮助现代读者理解其上下文指向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“嘴唇的报偿”略带诗性，以保留希伯来文意象和结构；分号呈现前后因果关系。“得着……以她为……”避免过强的商业色彩，同时保留“取得—产业”的词义呼应。
