  text: For he redeemed me from every evil[a], and delivered me in the day of trouble.
translation:
  language: zh_hans
  text: 因为他救赎我，使我脱离一切凶恶[a]；在患难之日搭救了我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“因为你救我脱离毁灭，又救我脱离凶险的时日。”希伯来文则作“脱离一切凶恶”和“在患难之日”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְדֵּנִי
  choice: 救赎我
  rationale: פדה表示付出代价使人得释放，也可泛指解救；“救赎”保留了希伯来文较强的释放意味，并与下句“搭救”有所区别。
- source_word: מִכָּל רָע
  choice: 脱离一切祸患
  rationale: רָע可指邪恶、伤害或灾祸；这里与“患难之日”平行，“祸患”较自然地表达处境中的灾害，同时“一切”保留原文的广度。
- source_word: וַיְמַלְּטֵנִי
  choice: 搭救了我
  rationale: מלט在此表示使人脱险、得安全；“搭救”符合现代汉语习惯，也保留与“救赎”的用词差异。
- source_word: בְּיוֹם צָרָה
  choice: 在患难之日
  rationale: 直译保留希伯来文具体的“日”这一意象；该短语惯指遭遇困苦危急的时候。
theological_decisions:
- issue: 希伯来文与希腊文平行文本之间的差异
  choice: 正文以现存希伯来文为主，译作“脱离一切祸患”和“在患难之日”。
  alternative: 按希腊文可译为：“因为你救我脱离毁灭，又救我脱离险恶的时刻。”
  rationale: 本节希伯来文完整且语意连贯，应作为正文依据；希腊文在主语人称和两个短语上均有实质差异，因此以脚注保存，不将差异暗中调和。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“救赎”保留 פדה 的较强语义，“祸患”避免把 רָע 仅限于道德意义的“邪恶”；句式保留希伯来诗歌的平行结构。
