base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/010.yaml
  text: 'And I will exalt you: O Yahweh[a], you are my Father, for you are the mighty one of my salvation. Do not let me grow weak in the day of distress[b], in the day of ruin and desolation.'
translation:
  language: zh_hans
  text: 我要尊崇你：耶和华[a]啊，你是我的父亲，因为你是我救恩的大能者。在患难之日[b]，在毁灭与荒凉之日，不要任我软弱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“我呼求主，我主的父亲。”希伯来文作：“耶和华啊，你是我的父亲。”
    reason: alternative_reading
  - marker: b
    text: 希腊文作“不要在患难的日子离弃我”；希伯来文更直译为“不要使我松弛”或“不要任我软弱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוֹמֵם
  choice: 我要尊崇你
  rationale: רומם意为“高举、尊崇、颂扬”。此处将带ו的未完成式理解为面向前方的第一人称宣告；宾语虽未明说，却可由祷告语境明确补出。
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的形式音译神名，并用脚注交代希伯来文与希腊文在整句话上的差异。
- source_word: אָבִי
  choice: 我的父亲
  rationale: 现存希伯来文明确作“我的父亲”；希腊文“我主的父”反映另一读法，收入脚注而不并入正文。
- source_word: גִּבּוֹר יִשְׁעִי
  choice: 拯救我的大能者
  rationale: גִּבּוֹר在此作名词，表示“大能者”；יִשְׁעִי表示“我的拯救／救恩”。译文保留大能与拯救的关联，同时避免生硬的“我救恩的大能者”。
- source_word: אַל תַּרְפֵּנִי
  choice: 不要任我软弱
  rationale: רפה含有松弛、衰弱、无力之意。此译保留希伯来文的软弱意象，同时符合现代汉语表达；不按希腊文改译为“不要离弃我”。
- source_word: בְּיוֹם צָרָה
  choice: 在患难之日
  rationale: צָרָה指困苦、患难或危急；“患难之日”庄重自然，也保留原文的时间表达。
- source_word: שׁוֹאָה וּמְשׁוֹאָה
  choice: 毁灭与荒凉
  rationale: 两个近义灾难词形成加强性的并列表达。分别译作“毁灭”与“荒凉”，不将原文的双重措辞合并。
theological_decisions:
- issue: 希伯来文与希腊文对神的称呼不同
  choice: 正文采用希伯来文“耶和华啊，你是我的父亲”
  alternative: 希腊文：“我呼求主，我主的父”
  rationale: 现存希伯来文在此完整而通顺，故依希伯来文本译正文；希腊文可能反映不同底本，其重要差异在脚注中保留。
- issue: אַל תַּרְפֵּנִי所表达的是软弱还是被离弃
  choice: 按希伯来文译为“不要任我软弱”
  alternative: 按希腊文译为“不要离弃我”
  rationale: 希伯来语רפה的核心意象是松弛、衰弱，希腊语ἐγκαταλιπεῖν则是离弃。正文遵从现存希伯来文，不将两者静默调和；希腊读法列入脚注。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“尊崇”“大能者”“患难之日”保持祷告诗歌的较高语体；“不要任我软弱”则兼顾希伯来文意象与普通读者的可理解性。两个脚注标记均置于正文相关差异处。
