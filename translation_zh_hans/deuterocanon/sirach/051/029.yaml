  text: May my soul rejoice in my old age[a], and may you not be put to shame by my song.
translation:
  language: zh_hans
  text: 愿我的心在我年老时欢喜[a]；愿你们不在我的歌中蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行经文作：“愿你们的心因他的怜悯而欢喜；愿你们在赞美他时不致蒙羞。”希伯来文则作“我的心”、“在我年老时”和“我的歌”。
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׂמַח
  choice: 愿……欢喜
  rationale: 该未完成式在此具有祈愿语气；译作“愿……欢喜”既体现希伯来文的意愿色彩，也与希腊文平行经文的祈愿式相符。
- source_word: נַפְשִׁי
  choice: 我的心灵
  rationale: 保留 נֶפֶשׁ 所表达的内在自我与生命主体，不简化为单纯的“我”；“心灵”在现代汉语中自然且庄重。
- source_word: בְּשֵׂיבָתִי
  choice: 在年老时
  rationale: שֵׂיבָה 字面涉及白发，惯用义为年老、晚年；“在年老时”自然表达其时间意义，同时不额外引申。
- source_word: וְלֹא תֵבוֹשוּ
  choice: 愿你们不……蒙羞
  rationale: 动词为第二人称阳性复数，故明确译出“你们”；“蒙羞”保留 בוש 的羞辱或陷入羞愧之意，并以“愿”延续祈愿语气。
- source_word: בְּשִׁירָתִי
  choice: 因我的歌
  rationale: שִׁירָה 指歌或歌唱；介词 בְּ 在此自然译为原因或关联关系“因”，使“蒙羞”的汉语表达顺畅，同时保留希伯来文“我的歌”。
theological_decisions:
- issue: 希伯来文与希腊文平行经文在人称及内容上的显著差异
  choice: 正文依现存希伯来文，采用“我的心灵……年老时……我的歌”。
  alternative: 希腊文作“愿你们的心灵因他的怜悯而欢喜；愿你们在赞美他时不致蒙羞”。
  rationale: 本节希伯来文证据现存且可信度高，因此作为正文依据；希腊文仍可印证祈愿语气和第二分句的复数受话者，但其“他的怜悯／赞美他”反映了不同文本传统，故在脚注中完整保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……；愿……”保留诗句的祈愿语气和平行结构；“你们”明确呈现原文复数。
