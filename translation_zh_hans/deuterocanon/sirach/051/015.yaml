  yaml_path: translation/deuterocanon/sirach/051/015.yaml
  text: From her blossom, like a ripening cluster of grapes, my heart rejoiced in her; my foot walked in uprightness; from my youth I tracked her down.
translation:
  language: zh_hans
  text: 她的花朵仿佛一串渐熟的葡萄；我的心因她而欢喜；我的脚踏上正直之路[b]；我从年轻时起就一直追寻她[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“我的脚在正直中迈步”，或“我的脚走在直路上”；希腊语兼有道路笔直和品行正直的含义。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我追踪她”或“我寻求她”；希腊语动词原有循着足迹追寻的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἄνθους
  choice: 她开花时
  rationale: ἄνθος意为“花、花朵”，ἐξ在此引出由开花而至结果成熟的意象；译成“她开花时”既保留智慧的女性人格化，也使现代汉语自然。
- source_word: ὡς περκάζουσης σταφυλῆς
  choice: 像一串渐渐成熟的葡萄
  rationale: σταφυλή指一串葡萄；περκάζουσα描写葡萄开始着色、趋于成熟。“渐渐成熟”保留生长过程，又避免用生僻的颜色词限定可能含义。
- source_word: εὐφράνθη ἡ καρδία μου ἐν αὐτῇ
  choice: 我的心因她而欢喜
  rationale: εὐφράνθη表达内心喜乐；ἐν αὐτῇ直译可作“在她里面”，但此处汉语以“因她”更自然地表达喜乐所关涉的对象，同时保留女性人格化。
- source_word: ἐπέβη ὁ πούς μου ἐν εὐθύτητι
  choice: 我的脚踏上正直的路
  rationale: ἐπέβη有踏上、迈步之意；εὐθύτης兼有笔直与正直的含义。此译保留脚步和道路意象，同时传达伦理上的正直。
- source_word: ἐκ νεότητός μου ἴχνευον αὐτήν
  choice: 我从年轻时就追寻她的踪迹
  rationale: ἴχνευον本有循足迹追踪、探寻之意；“追寻她的踪迹”比单译“寻求她”更完整地保留原文与前句脚步相连的形象。
theological_decisions:
- issue: αὐτῇ／αὐτήν所指及其人格化
  choice: 用“她”指人格化的智慧
  alternative: 用“它”将智慧作为抽象事物处理
  rationale: 上下文把智慧人格化，希腊语代词也是阴性；用“她”既符合语境，也不把这一文学及神学张力抽象化。
- issue: ἐν εὐθύτητι的道路与伦理双重含义
  choice: 译作“正直的路”
  alternative: 译作“正直中”或“笔直地”
  rationale: “正直的路”同时保留行路画面和道德含义，不把原文缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“她”延续智慧的人格化；用“开花—葡萄成熟”的连贯意象表达首句，并用“脚—路—踪迹”维持原文连续的行走与追寻画面。未设置[a]脚注，因为“渐渐成熟”已在正文中容纳葡萄着色成熟的语义，无须另列才可理解。
