  text: I turned around[a], and there was no one to help me; I looked for support, and there was none.
translation:
  language: zh_hans
  text: 我四下环顾[a]，却没有人帮助我；我寻求扶持，却没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他们从四面包围我，却没有人帮助我；我望向人的援助，却没有。”本译文依照现存希伯来文；两种文本对首句的表述不同，希腊文也把后半句明确说为寻求人的援助。
    reason: textual_variant
lexical_decisions:
- source_word: וָאֶפְנֶה סָבִיב
  choice: 我环顾四周
  rationale: פנה意为“转向”，סביב意为“四周、各处”；合起来描写说话者转向各方寻找援助。译作“环顾四周”符合现代汉语习惯，也保留了四下寻找的画面。
- source_word: עוֹזֵר
  choice: 帮助我的人
  rationale: 该分词指实际施助者；放在“没有人”之后译为“没有人帮助我”，自然地保留其施事含义。
- source_word: וַאֲצַפֶּה
  choice: 我期待
  rationale: צפה可表示观看、守望或等候。这里与“扶持者”连用，兼有向援助张望和等候援助之意；“期待”避免把含义限缩为单纯的视觉动作。
- source_word: סוֹמֵךְ
  choice: 有人扶持
  rationale: סמך的分词可指扶持、支撑的人。译成“有人扶持”既保留人的施助角色，也使汉语表达流畅。
- source_word: וְאָיִן
  choice: 却一个也没有
  rationale: 简短的存在否定强调完全无人可助；“一个也没有”承接前面的扶持者，保留原文收束有力的语气。
