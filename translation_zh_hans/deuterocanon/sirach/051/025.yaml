  text: 'I opened my mouth and spoke of her: acquire wisdom for yourselves without silver[a].'
translation:
  language: zh_hans
  text: 我开口谈论她[a]：你们要为自己取得智慧，不花银子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的阴性单数后缀最可能指被拟人化的“智慧”；也可较抽象地理解为“谈论它”，泛指所谈的内容。
    reason: 说明阴性后缀的可能所指，并保留文本容许的较抽象理解。
lexical_decisions:
- source_word: פִּי פָתַחְתִּי
  choice: 我张开口
  rationale: 保留希伯来语“张开我的口”这一开始说话的生动惯用语，也与希腊语平行文本相符；现代汉语中简化为“我张开口”较自然。
- source_word: וְדִבַּרְתִּי בָהּ
  choice: 讲论她
  rationale: 介词所带的阴性单数后缀最自然地回指智慧。译作“她”保留智慧被拟人化的文学表达，而“讲论”准确表达以她为言说对象。
- source_word: קְנוּ לָכֶם
  choice: 你们要为自己取得
  rationale: קנה既可指购买，也可泛指取得。下文“无需银子”使买卖意象仍然可见，但“取得”在汉语中更适合与“智慧”搭配，并保留获得智慧的实际含义。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是该词的直接含义，并与前句阴性代词所体现的智慧拟人化保持连贯。
- source_word: בְּלֹא כָסֶף
  choice: 无需银子
  rationale: 原文直译为“没有／不用银子”，希腊语平行文本也使用“银子”。保留“银子”而不泛化为“钱”，可保存具体的交易意象。
theological_decisions:
- issue: “讲论她”中阴性代词的所指
  choice: 把阴性后缀理解为回指拟人化的智慧，并译作“她”。
  alternative: 较抽象地译作“讲论它／这事”，泛指教诲或所谈的内容。
  rationale: 紧接着的命令明确提到“智慧”，而《便西拉智训》常将智慧人格化，因此回指智慧最合乎上下文。译文只保留原文的语法和文学形象，不进一步赋予其后来的教义身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我张开口”保留原文意象；“讲论她”略带文学色彩，用以呈现智慧的拟人化；“无需银子”简洁自然，同时保留原文具体的经济意象。
