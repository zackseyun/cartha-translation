  text: And I raised my voice from the earth[b][a], and from the gates of Sheol I cried out.
translation:
  language: zh_hans
  text: 我从大地[a]扬声；从阴间的门口[b]呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“从大地（或土地）”；希腊文平行文本则作“在地上”，反映抄本或诠释上的轻微差异。
    reason: textual_variant
  - marker: b
    text: “阴间”译自希伯来文“舍奥勒”，指死者所在之域；也可译作“死者之境”或“坟墓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָרִים
  choice: 扬声
  rationale: רום在此以“我的声音”为宾语，表示举起、提高；现代汉语“扬声”既自然，又保留原文的具体意象。
- source_word: מֵאֶרֶץ
  choice: 从大地
  rationale: 希伯来文介词מִן通常表示“从”，אֶרֶץ可指“大地”或“土地”；“从大地”保留其诗性与方向感，不按希腊文改作“在地上”。
- source_word: קוֹלִי
  choice: 声
  rationale: קוֹלִי直译为“我的声音”。中文“我……扬声”已自然包含第一人称所属关系，避免生硬的“扬起我的声音”。
- source_word: וּמִּשַּׁעֲרֵי
  choice: 从……的门前
  rationale: שַׁעֲרֵי字面为“……的众门”。中文以“门前”表达身临阴间门槛、濒临死亡的空间意象，同时不把它抽象化为“死亡边缘”。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: “阴间”是现代中文圣经语境中对希伯来文שְׁאוֹל较为通行且易懂的表达，指死者所在之域；脚注说明原词，以免将其等同于坟墓或后来的特定地狱观。
- source_word: שִׁוַּעְתִּי
  choice: 呼求
  rationale: שוע表示在危难中呼喊、求助。“呼求”保留求援意味，也未添加原文没有明说的受求对象。
theological_decisions:
- issue: שְׁאוֹל的表达
  choice: 阴间
  alternative: 坟墓；死者之境；音译“舍奥勒”
  rationale: “阴间”能自然表达死者所在之域，又不把经文限定为实体坟墓；脚注明确其希伯来背景，以避免导入后期有关地狱的特定教义。
translation_notes:
  register: 采用简洁、庄重而可诵读的现代标准汉语。两分句保留原文平行结构与由“大地”至“阴间门前”的诗性空间意象；不依希腊文将“声音”解释性改写为“祈求”。
