  naturalness: “你们行事要秉持公义”庄重且通顺；但“按其时候”不合现代标准汉语的常用搭配，读者不易自然理解为“在适当／指定的时候”。改为“在其适当的时候”既较自然，也保留“其”所指可关联报偿或上帝的空间。末句调整语序后更流畅。
