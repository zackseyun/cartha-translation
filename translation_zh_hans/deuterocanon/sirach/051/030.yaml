base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/030.yaml
  text: Do your work in righteousness[a], and he will give you your reward in its time. Blessed is Yahweh forever, and praised is his name from generation to generation.
translation:
  language: zh_hans
  text: 你们行事要秉持公义，他必在其适当的时候[a]赐给你们奖赏。雅威永远当受称颂；他的名当世世代代受赞美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在其适当的时候”也可译作“在他的时间”。希伯来语 בְּעִתּוֹ 和希腊语 ἐν καιρῷ αὐτοῦ 中的代词，既可理解为指奖赏应当来到的时候，也可理解为指上帝所定的时间。
    reason: 保留原文代词所指及时间表达的歧义。
lexical_decisions:
- source_word: מַעֲשֵׂיכֶם עֲשׂוּ
  choice: 你们行事
  rationale: 原文以“你们的行为／工作”与“做”构成同源式表达；译作“你们行事”既保留命令语气，也避免现代汉语中生硬的重复。
- source_word: בִצְדָקָה
  choice: 要秉持公义
  rationale: 介词 בְּ 在此表示行事的方式；“秉持公义”自然地表达按正直、公正的原则而行，同时保留智慧文学中的伦理—神学用语。
- source_word: וְהוּא
  choice: 他
  rationale: 原文只用第三人称代词，语境暗指上帝；译文不直接补出“上帝”，以免过度明确化。
- source_word: נוֹתֵן לָכֶם שְׂכַרְכֶם
  choice: 必……赐给你们报偿
  rationale: שְׂכַר 可指工价、酬劳或报偿；“报偿”适合上帝按人的行为回报这一智慧文学语境，又不把关系局限为商业雇佣。希伯来语分词在此具有应许意味，故用“必”。
- source_word: בְּעִתּוֹ
  choice: 按其时候
  rationale: 第三人称阳性单数后缀可能指阳性名词“报偿”，也可能被理解为指上帝。“其”有意保留所指的含混，脚注列出较明确的译法。
- source_word: בָּרוּךְ יְהֹוָה לְעוֹלָם
  choice: 雅威永远当受称颂
  rationale: 保留希伯来语颂赞句的庄重节奏，并将四字神名直接音译为“雅威”。
- source_word: וּמְשֻׁבָּח שְׁמוֹ לְדֹר וָדֹר
  choice: 他的名世世代代当受赞美
  rationale: “世世代代”自然对应 לְדֹר וָדֹר，并与前句构成平行的颂赞结构。
theological_decisions:
- issue: 神名 יְהֹוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近现代学界对其古代读音的通行重构，也不以称号代替专名。
- issue: צְדָקָה 的伦理—神学色彩
  choice: 公义
  alternative: 正直；正义
  rationale: “公义”保留该词在智慧传统中兼具正直、公正与合乎上帝旨意的内涵；不将其缩减为单一的司法意义。
- issue: 颂赞句是陈述还是祈愿
  choice: 当受称颂／当受赞美
  alternative: 是可称颂的／他的名受赞美
  rationale: 希伯来语无系词名词句既可理解为宣告，也具有颂赞、祈愿语气；“当受”符合汉语颂赞体，同时不引入额外教义判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你们行事要秉持公义”避免直译造成的同词重复；末句使用对称的颂赞句式，以体现希伯来诗性节奏。脚注标记置于真正存在词义歧义的时间短语之后。
