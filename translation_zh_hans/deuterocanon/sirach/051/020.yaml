base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/020.yaml
  text: I gave my soul after her, and for everlasting ages I will not turn away from her. In purity I found her, and from the beginning I acquired a heart for her.
translation:
  language: zh_hans
  text: 我把自己的心魂交托给她，追随她；直到永永远远，我也不偏离她。我在纯洁中找到了她；从起初，我就得着一颗归向她的心。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי נָתַתִּי אַחֲרֶיהָ
  choice: 我一心追求她
  rationale: 字面为“我把我的生命／心魂放在她后面”；此处表达全心投入并追随智慧，译作“一心追求”既自然，也保留委身之意。
- source_word: לְנֵצַח נְצָחִים
  choice: 直到永永远远
  rationale: 保留希伯来语加强式的久远、永久含义。
- source_word: לֹא אַטֶּה מִמֶּנָּה
  choice: 也不偏离她
  rationale: 动词 נטה 可指转向或偏离；与 מִמֶּנָּה 连用表示不从她那里转开。
- source_word: וּבְטָהֳרָה מְצָאתִיהָ
  choice: 我在纯洁中找到了她
  rationale: 保留 בְּ 的方式或处境含义，不将“纯洁”具体化为礼仪洁净或道德无罪。
- source_word: וְלֵב קָנִיתִי לָהּ
  choice: 得着了一颗向着她的心
  rationale: קנה 表示取得、获得；לָהּ 表示对她、向着她。此译保留原文较不寻常但可理解的表达。
- source_word: מִתְּחִלָּתָהּ
  choice: 从起初
  rationale: 按希伯来文本直译时间起点；不采用希腊文较难理解的“从起初与他们”。
theological_decisions:
- issue: “她”所指的智慧是否明说
  choice: 沿用阴性代词“她”，不在本节增补“智慧”
  alternative: 将每处“她”明确译为“智慧”
  rationale: 原文使用阴性代词，指代由上下文确定；保留代词可避免向本节添加原文没有重复出现的名词。
- issue: “纯洁”的性质
  choice: 保留概括性的“纯洁”
  alternative: 译为“洁净礼仪”或“心灵纯洁”
  rationale: 希伯来语本身未限定为礼仪或内在道德范畴，应保留其开放性。
- issue: 希伯来文与希腊文结句差异
  choice: 以高置信度希伯来来源为正文依据
  alternative: 采用希腊文“因此我必不被撇弃”
  rationale: 所给希伯来文本有完整而连贯的结句；希腊平行文本反映明显不同的文本传统，不宜混入正文。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“一心追求”传达 נַפְשִׁי נָתַתִּי 的全人投入；末句略保留原文陌生感，以免过度解释为“聪明”或“悟性”。
