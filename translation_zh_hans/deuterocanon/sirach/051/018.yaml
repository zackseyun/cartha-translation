  text: I planned to improve my way[a], and I will not turn back, for I will find it.
translation:
  language: zh_hans
  text: 我立志改善自己的道路[a]；我决不回头，因为我必寻得它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“因为我决意实行它，又热切追求美善，我必不至蒙羞。”这与现存希伯来文属于差异显著的文本形态。
    reason: textual_variant
lexical_decisions:
- source_word: חָשַׁבְתִּי
  choice: 我立志
  rationale: 该动词本义涉及思想、筹划；在这里表达有意识的道德决心。“立志”比“我想过”更能体现 deliberate intention，又不过度加强为誓言。
- source_word: לְהִיטֶיב
  choice: 改善
  rationale: יטב 的使役式可指行善或使之变好；与“自己的道路”连用时，指改善生活道路或品行。
- source_word: דַּרְכִּי
  choice: 自己的道路
  rationale: 保留希伯来语“道路”的生命历程和行为方式隐喻；“自己的”在现代汉语中自然地对应第一人称所有关系。
- source_word: וְלֹא אַהֲפֹךְ
  choice: 我决不回头
  rationale: הפך 在此处文本和语义略显困难，按现存希伯来文可理解为不逆转已选择的方向。“回头”保留道路意象；“决不”传达否定式中的坚定语气。
- source_word: כִּי אֶמְצָאֶנּוּ
  choice: 因为我必寻得它
  rationale: מצא 可指找到或达到；用“寻得”兼顾追寻智慧的语境与最终获得之意。“它”保留阳性单数后缀所指对象未明的含混性，不擅自明确为智慧、善或道路。
theological_decisions:
- issue: 希伯来文与希腊文结尾存在重大差异
  choice: 正文依现存希伯来文译作“我决不回头，因为我必寻得它”
  alternative: 希腊文作：“因为我决意实行它，又热切追求美善，我必不至蒙羞。”
  rationale: 《便西拉智训》有可靠希伯来文见证之处以希伯来文为主要依据。本节希腊传统代表实质不同的文本形态，故不将其混入正文，而以脚注完整保存。
- issue: “它”的所指
  choice: 保留代词，不明确指定其所指
  alternative: 解释为智慧、美善或所选择的道路
  rationale: 希伯来文的代词虽为阳性单数，其先行对象在本句中并不清楚；上下文可能使读者联想到智慧或所追求的善，但正文不应消除这种真实的歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“改善自己的道路”保留希伯来语的道路隐喻，同时可让普通读者理解为端正生活与行为；分号体现两部分之间紧密的决心—理由关系。
