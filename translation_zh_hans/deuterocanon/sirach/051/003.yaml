base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/003.yaml
  text: from the snare of those watching for my stumbling[a], and from the hand of those seeking my life. You saved me from many troubles[b], and from the distress of a flame all around.
translation:
  language: zh_hans
  text: 脱离窥伺我失足之人的网罗[a]，脱离寻索我性命之人的手；你曾救我脱离许多患难，也脱离四围火焰的困厄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “窥伺我失足”也可译作“窥伺我跌倒”或“盯着我踉跄”。希伯来语这一表达带有惯用语色彩，具体含义略有不确定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本作“四围火焰的困厄”。希腊语平行文本在这里差异很大，扩展描述了蒙救援的情形，并未保留这一确切措辞。
    reason: textual_variant
lexical_decisions:
- source_word: מִמּוֹקֵשׁ
  choice: 脱离……的网罗
  rationale: מוֹקֵשׁ指捕捉猎物的网罗或陷阱；“网罗”既保留具体意象，也符合庄重的诗歌语体。
- source_word: צוֹפֵי צַלְעִי
  choice: 那些窥伺我失足之人
  rationale: צוֹפֵי表示注视、窥伺的人；צַלְעִי可指跛行、踉跄或跌倒。上下文带有敌意监视的意味，“窥伺我失足”自然地保留了这一惯用表达的不确定性。
- source_word: וּמִּיַד
  choice: 脱离……的手
  rationale: “手”在希伯来语中常表示权势或控制；保留此意象也维持了两句之间的诗体平行。
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: 那些索要我性命之人
  rationale: 在仇敌加害的语境中，נפשׁ指人的性命，而非对灵魂本体作出陈述；“索要我性命”兼顾原文表达和现代汉语的自然度。
- source_word: מֵרַבּוֹת צָרוֹת
  choice: 许多患难
  rationale: רַבּוֹת可表示数量多，也可能含程度大的意味；“许多患难”优先反映其复数形式，同时不缩窄苦难的范围。
- source_word: הוֹשַׁעְתָּנִי
  choice: 你救我脱离
  rationale: ישׁע意为拯救、搭救；译文保留对上帝的第二人称直接称呼，并用“救我脱离”明确与后接介词短语的关系。
- source_word: וּמִמְּצוּקוֹת
  choice: 也救我脱离……所带来的困厄
  rationale: מְצוּקוֹת表示困境、压迫或极度窘迫。此处与“火焰”构成较难的属格关系，用“所带来的困厄”使现代汉语通顺，又不把火焰确定为纯粹字面或比喻。
- source_word: שַׁלְהֶבֶת
  choice: 火焰
  rationale: שַׁלְהֶבֶת指火焰或烈焰；采用“火焰”保留具体而可能兼具比喻性的意象。
- source_word: מִסָּבִיב
  choice: 四面
  rationale: 该副词表达环绕、包围；“四面火焰”简洁地呈现危险从周围逼近的画面。
theological_decisions:
- issue: נפשי应译作“我的灵魂”还是“我的性命”
  choice: 我的性命
  alternative: 我的灵魂
  rationale: 网罗、仇敌与蒙救援的语境表明，“寻索某人的נפשׁ”是企图夺取其性命的惯用说法，不宜借译文引入有关灵魂本体的教义判断。
- issue: 末句的火焰是实火还是患难的比喻
  choice: 保留“四面火焰”这一具体意象，不判定其性质
  alternative: 四面如火的患难
  rationale: 希伯来文本容许字面与比喻两种理解。译文不把意象解释成单一含义；希腊平行文本在此差异很大，故以现存希伯来见证为主，并在脚注说明异文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以希伯来文本为主，保留“网罗”“手”“火焰”等诗性意象；通过脚注交代关键词义的不确定性及希腊平行文本的重大差异。
