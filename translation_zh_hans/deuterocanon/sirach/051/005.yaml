  text: from lips of wickedness and from those who smear lies[a], and from the arrows of a deceitful tongue.
translation:
  language: zh_hans
  text: 脱离邪恶的嘴唇和捏造谎言的人，也脱离诡诈之舌的利箭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“从不洁的舌头和虚假的言语中”，不同于希伯来文的“邪恶的嘴唇……诡诈之舌的利箭”。本节有现存希伯来文本，因此正文采用希伯来文；因两者差异显著，特将希腊文异文列在这里。
    reason: alternative_reading
lexical_decisions:
- source_word: מִשִׂפְתֵי זִמָּה
  choice: 脱离邪恶的嘴唇
  rationale: מִן 表示所脱离的来源；“嘴唇”保留具体的身体意象，并与后文“舌”构成诗歌呼应。זִמָּה 在此与谎言、诡诈的言语并列，宜取较宽泛的道德含义“邪恶”，不限定为淫乱。
- source_word: וְטֹפְלֵי שֶׁקֶר
  choice: 和捏造谎言的人
  rationale: טפל 本有涂抹、敷抹之意，引申为把虚假之事加在人身上或编造虚假；分词形式指惯于这样做的人。“捏造谎言的人”在现代汉语中自然，也保留制造虚假的核心含义。
- source_word: וְחִצֵּי
  choice: 也脱离……的利箭
  rationale: 希伯来文本此处没有重复介词，但句首的 מִן 可自然统摄并列项。译文补出“脱离”，使汉语关系清楚；“利箭”保留伤人言语的强烈比喻。
- source_word: לְשוֹן מִרְמָה
  choice: 诡诈之舌
  rationale: “舌”保留原文意象，并与“嘴唇”呼应。מִרְמָה 表示欺骗、诡诈；采用凝练庄重的“诡诈之舌”，不把它释义成较抽象的“欺骗性言语”。
- source_word: ἀπὸ γλώσσης ἀκαθάρτου καὶ λόγου ψευδοῦς
  choice: 未用于正文
  rationale: 希腊平行文本作“从不洁的舌头和虚假的言语中”，与现存希伯来文差异明显。因本节有高可信度的希伯来文本，正文以希伯来文为据，希腊异文收入脚注。
