  yaml_path: translation/deuterocanon/sirach/030/010.yaml
  text: Do not laugh with him[a], lest you share his pain, and in the end you will gnash your teeth.
translation:
  language: zh_hans
  text: 不要和他一起嬉笑[a]，免得你与他一同受苦；到头来，你必咬牙切齿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要跟他一同发笑。”原文动词强调加入对方的笑闹。
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγελάσῃς
  choice: 和他一起嬉笑
  rationale: 该复合动词表示与某人一同发笑、参与其笑闹；“和他一起嬉笑”既保留共同参与之意，也符合本节劝诫的语境。
- source_word: συνοδυνηθῇς
  choice: 与他一同受苦
  rationale: 该复合动词表示共同感受痛苦或一同受苦；此译法保留原文的共同性，不限定痛苦的具体性质。
- source_word: ἐπʼ ἐσχάτῳ
  choice: 到头来
  rationale: 该短语指最终的结果；“到头来”自然地表达从眼前纵容转向后来苦果的时间与结果关系。
- source_word: γομφιάσεις
  choice: 咬牙切齿
  rationale: 此动词与“牙齿”连用，表示磨牙或咬牙；汉语成语“咬牙切齿”能自然传达痛苦、懊悔或愤恨中的磨牙动作，同时不强行限定具体情绪。
- source_word: τοὺς ὀδόντας σου
  choice: （含于）咬牙切齿
  rationale: “你的牙齿”作为γομφιάσεις的宾语，在汉语惯用语“你必咬牙切齿”中已明确体现，无须机械重复。
