  text: For it is better that your children should beg from you than that you look to the hands of your sons[a].
translation:
  language: zh_hans
  text: 因为你的孩子向你求助，总比你仰赖你儿子手中的供给好[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“望着你儿子的手”；此处指仰赖儿子供养。
    reason: 说明“望向……手”的具体意象及其在家庭供养语境中的含义。
lexical_decisions:
- source_word: κρεῖσσον
  choice: 总比……好
  rationale: 自然表达比较结构，准确传达“更好、较可取”。
- source_word: τὰ τέκνα δεηθῆναί σου
  choice: 让你的孩子向你求助
  rationale: δέομαι可指请求、恳求或因缺乏而求助；此处涉及家人供养关系。“向你求助”保留需要与请求之意，同时避免把语气过度强化为沿街乞讨。τέκνα译为不限定性别的“孩子”。
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: 指望……手中的供给
  rationale: 原文直译为“看着/望向……的手”，在语境中表达仰赖对方施予。正文保留“手”的具体意象，并补出隐含的供给含义，使现代汉语清楚自然。
- source_word: υἱῶν σου
  choice: 你儿子
  rationale: υἱῶν明确指“儿子”，与前句较宽泛的τέκνα“孩子”有意区别，故不泛化为“子女”。汉语在泛指复数时可用无标记的“儿子”。
theological_decisions:
- issue: 后半句性别明确的亲属称谓
  choice: 你儿子
  alternative: 你的孩子／子女
  rationale: 希腊文先用τέκνα，后用υἱῶν；保留“孩子／儿子”的区别，不把原文的性别限定中性化。
- issue: 经济依赖的手部意象
  choice: 指望你儿子手中的供给
  alternative: 仰赖你儿子供养／望着你儿子的手
  rationale: 纯直译“望着手”在现代汉语中不易显出依赖之义，完全意译又会丢失原文意象；正文兼顾二者，脚注说明字面表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。比较句用“总比……好”；避免将δεηθῆναί狭义化为“乞讨”，也不把后句完全抽象化，以兼顾原文措辞和普通读者的理解。
