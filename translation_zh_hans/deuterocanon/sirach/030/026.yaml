  text: For anger has killed many[b][a], and there is no benefit in wrath.
translation:
  language: zh_hans
  text: 因为怒气[b]杀死了许多人，暴怒毫无益处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文平行文本是另一句话：“要知道，我劳苦不只是为自己，也是为所有寻求教导的人。”这表明此处可能存在节号错位或不同的文本传统。正文依据现存的希伯来文本翻译。
    reason: textual_variant
  - marker: b
    text: 前半句译作“怒气”的希伯来词，其词形和确切含义略有疑问；这里根据上下文，以及它与后半句“暴怒”的平行关系来翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: 因为
  rationale: 在上下文中引出劝诫的理由；“因为”自然、简洁，并保留希伯来语的因果连接。
- source_word: רבים
  choice: 许多人
  rationale: 直接表达数量众多，并保持格言面向普遍人群的意味。
- source_word: הרג
  choice: 杀死了
  rationale: 该动词明确表示杀害或致死；中文用“杀死了”既直白又保留完成性的格言陈述。
- source_word: דין
  choice: 怒气
  rationale: 此词形和词义存在一定疑问；依据语境及其与后半句“暴怒”的平行关系，译为情绪性的“怒气”，而不取司法意义的“审判”。
- source_word: ואין
  choice: 毫无
  rationale: 将希伯来语并列结构中的存在否定自然地表达为中文“毫无”，语义仍是“没有”。
- source_word: תעלה
  choice: 益处
  rationale: 该名词表示利益、好处或收益；“益处”适合庄重而通俗的智慧文学语体。
- source_word: בקצפון
  choice: 暴怒
  rationale: קצפון表示强烈的愤怒；“暴怒”与前半句“怒气”形成近义平行，也自然涵盖介词所表达的处于这种情绪之中。
theological_decisions:
- issue: 现存希伯来文本与所列希腊平行文本内容严重不一致
  choice: 正文依据现存希伯来见证翻译，并以脚注说明希腊文本反映不同的节号对应或文本传统。
  alternative: 依据所列希腊文译作：“要知道，我劳苦不只是为自己，也是为所有寻求教导的人。”
  rationale: 本节有可理解且连贯的希伯来文本，故应以它为主要来源；希腊平行句内容完全不同，不能用来改写希伯来正文，但其差异须公开注明。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。保留两个分句的近义平行，并用“怒气／暴怒”体现词义强度上的细微区别。脚注标记均置于正文相关位置：词汇疑问紧随“许多人”，文本异文置于全句末尾。
