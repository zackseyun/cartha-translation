  source_fidelity: 译文准确保留了两组因果／结果式平行，以及“马”“儿子”的单数和性别指向。但“任性妄为”通常含有恣意作恶、行为不端的较强意味，较原文罕见词προαλής在此所指的任性、刚愎或冒进更为具体且更重，宜收敛为“任性”。
  naturalness: “顽梗”虽可理解，但在当代普通话中较书面且不如“倔强”自然。“未经驯服的马……放任不管的儿子……”保持了庄重、简明的格言体。
  terminology: “未经驯服的”恰当传达ἀδάμαστος的驯马意象；“放任不管的”可传达ἀνειμένος的“被放开、不受管束”。将σκληρός译为“倔强”、προαλής译为“任性”，能保留二者相关而不完全相同的性情描写。
  issues:
