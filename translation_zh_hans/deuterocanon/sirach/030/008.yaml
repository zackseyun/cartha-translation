  text: An unbroken horse turns out stubborn[b][a], and a son left unchecked turns out headstrong.
translation:
  language: zh_hans
  text: 未经驯服的马[a]会变得倔强，放任不管的儿子会变得任性[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未经驯服的”也可译作“未被制伏的”或“未驯服的”。希腊词ἀδάμαστος在这里描绘一匹尚未受过驯练的马。
    reason: lexical_alternative
  - marker: b
    text: 译作“任性”的希腊词προαλής较为罕见；也可理解为“刚愎自用”或“狂妄冒进”。此处采用较概括的译法，以保留原词语义上的不确定性。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: 马
  rationale: 采用普通、直接的对应词；上下文没有理由使用更华饰的称谓。
- source_word: ἀδάμαστος
  choice: 未经驯服的
  rationale: 在马的语境中，指尚未受过驯练、未被制伏；此译自然呈现驯马意象。
- source_word: ἀποβαίνει
  choice: 会变得
  rationale: 表达某种先前状态所导致的结果，也符合汉语格言的自然说法。
- source_word: σκληρός
  choice: 顽梗
  rationale: 此处主要不是指身体坚硬，而是指难以驾驭、抗拒约束的性情。
- source_word: υἱός
  choice: 儿子
  rationale: 希腊文为阳性单数，明确指儿子，不泛化为“孩子”。
- source_word: ἀνειμένος
  choice: 放任不管的
  rationale: 原词含被放开、不受约束之意；此译既传达缺乏管束，又避免把含义限缩为某种具体教育方式。
- source_word: ἐκβαίνει
  choice: 会变得
  rationale: 与前半句的ἀποβαίνει形成结果性的平行表达，中文中重复“会变得”可保留原句结构。
- source_word: προαλής
  choice: 任性妄为
  rationale: 该词罕见，语境指不受控制、由着自己向前闯的性情；“任性妄为”保留其自作主张和越轨冒进的意味。
