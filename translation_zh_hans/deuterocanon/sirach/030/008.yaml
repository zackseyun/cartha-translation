    rationale: “妄为”在现代汉语中往往暗示不正当或任意胡为；原词虽有前冲、自作主张和不受约束之意，其确切语义仍有不确定性。译为“任性”较能保留原文的概括性，并避免加入明确的道德行为判断。
  - severity: low
    issue: “顽梗”在现代普通话中略显生硬。
    rationale: “倔强”更符合现代汉语常用语，同时表达σκληρός在此的抗拒、固执，而非物理上的坚硬。
