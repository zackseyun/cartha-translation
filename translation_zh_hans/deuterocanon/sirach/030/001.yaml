  text: He who loves his son will continue the lash for him[b][a], so that he may rejoice in his final days.
translation:
  language: zh_hans
  text: 爱自己儿子的，必常常以鞭子责打他，使他在晚年得享喜乐[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常常以鞭子责打他”也可译为“必坚持用鞭子对待他”。希腊文动词含有持续、勤勉或反复行动的意思；名词为复数，可指“鞭子”“鞭打”或“责打”。
    reason: lexical_alternative
  - marker: b
    text: “在晚年”字面近于“在他的末后之事上”。这短语可指后来的结果、晚年或最终结局。连续的“他／他的”在语法上有一定含混；按箴言语境，通常理解为父亲因自己的晚年或末后光景而喜乐，但也不排除与儿子后来的结果相关的理解。
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: Ὁ ἀγαπῶν τὸν υἱὸν αὐτοῦ
  choice: 爱自己儿子的
  rationale: 带冠词的分词构成泛指性的箴言表达；υἱός明确指“儿子”，故不泛化为“孩子”。
- source_word: ἐνδελεχήσει
  choice: 必不断
  rationale: 该动词表达持续、勤勉或反复的行动；“不断”保留其持续性，同时不额外规定管教的具体频率。
- source_word: μάστιγας αὐτῷ
  choice: 用鞭子管教他
  rationale: μάστιγας为复数，可指鞭子、鞭打或责打；译文保留具体而严厉的鞭打意象，并以“管教”说明其在箴言中的功能。
- source_word: ἵνα εὐφρανθῇ
  choice: 好使他……喜乐
  rationale: ἵνα引出目的或预期结果；εὐφρανθῇ可表达欢喜、得喜乐。保留“他”而不在正文中完全消除其指代张力。
- source_word: ἐπʼ ἐσχάτων αὐτοῦ
  choice: 在儿子最终的结局上
  rationale: 字面近于“在他的末后之事上”，可涉及后来的结果、晚年或最终结局；“最终的结局”保留箴言的庄重感，而脚注交代其语义范围。
theological_decisions:
- issue: 是否淡化体罚意象
  choice: 保留“鞭子”的具体意象
  alternative: 仅译为“管教”或“纠正”
  rationale: 原文明确使用μάστιγας。抽象化会掩盖经文的严厉性及其伦理张力；译文忠实呈现，并不等于替这种做法作额外背书。
- issue: 喜乐者及末后所指对象的指代
  choice: 正文按箴言逻辑将喜乐者理解为父亲，并将末后关联于儿子的结局，同时用脚注保留语法上的可能范围
  alternative: 理解为儿子在自己晚年喜乐，或父亲在自己的晚年喜乐
  rationale: 上下文最自然的因果关系是父亲因儿子后来的结果而喜乐；但希腊文连续使用第三人称形式，不能仅凭形态彻底排除其他指代，因此不把备选理解静默抹去。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。保留“儿子”和“鞭子”的具体措辞，不以中性亲属词或抽象纪律用语弱化原文；通过脚注呈现末句的词义和指代含混。
