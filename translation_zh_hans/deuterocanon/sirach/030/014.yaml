revisions:
- from: 一个贫穷却自身康健的人，胜过一个富有却肉身患病的人。[a]
  to: 一个人虽贫穷、身体却安好，胜过一个富有、肉身受害的人。[a]
  rationale: 修订以希伯来文本为正文依据。“身体安好”自然表达“自身活着”在此身体状况语境中的含义，但不加入希腊文本“强壮”的扩展；“肉身受害”保留原文所述肉身遭受苦害的宽泛性，避免将其定为疾病或直接等同于希腊文本的鞭打。脚注相应准确说明两种文本的措辞差异。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:35:21Z'
review_pass:
  verdict: revise
  source_fidelity: 正文正确保留比较格言的结构，也没有将希腊文本的“健康、强壮”及“受鞭打”无标记地扩充进正文。不过，“患病”把希伯来语“受击／受害于肉身”的较宽泛表述限定为疾病，范围过窄；该词也可指身体所受的击打或其他苦害。
  naturalness: “一个贫穷却自身康健的人”可以理解，但“贫穷却康健”中的“却”容易被读作贫穷与健康本身构成转折。用“虽贫穷、身体却安好”能更清楚地呈现格言的让步与对比，且保持现代庄重语体。
  terminology: “肉身”妥当地保留了 בשר 的具体性。“身体安好”以自然汉语表达 חי בעצמו 所指的自身状态，同时不采用希腊文本额外的“强壮”。将“患病”改为“肉身受害”可避免把 נגע 限缩为疾病，并保留身体受苦害的含义。
  issues:
  - severity: medium
    issue: “患病”过度限定 ונגע 的语义。
    rationale: 原文表示肉身受到击打、侵害或苦害，未明确指定为疾病；希腊平行文本的“受鞭打”也显示其并非只能理解为患病。
  - severity: low
    issue: 正文首分句的“贫穷却自身康健”对比关系略不清晰。
    rationale: “却”紧接“贫穷”会使两种状态看似直接相反；改为“虽贫穷、身体却安好”更符合汉语让步比较句的习惯。
  - severity: low
    issue: 脚注“肉身受灾”不够贴合且不够自然。
    rationale: “受灾”通常指遭逢灾害，未明确体现原文针对肉身的受击／受害；“肉身受害”较准确自然。
