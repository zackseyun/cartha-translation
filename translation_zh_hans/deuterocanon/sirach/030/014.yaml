  text: Better is a poor man who is alive in himself than a rich man stricken in his flesh[a].
translation:
  language: zh_hans
  text: 一个人虽贫穷、身体却安好，胜过一个富有、肉身受害的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“一个贫穷却健康、体格强壮的人，胜过一个富有却身体受鞭打的人。”希伯来文本较短，直译为“自身活着”和“肉身受害”。
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: 胜过
  rationale: 这是希伯来智慧文学常见的比较句式；希腊语 κρείσσων 也明确支持比较义。汉语用“胜过”简洁自然。
- source_word: מסכן
  choice: 一个贫穷……的人
  rationale: 指贫穷或困乏者。现代汉语以“贫穷的人”表达自然，也保留单数人物之间的对比。
- source_word: וחי בעצמו
  choice: 却自身康健
  rationale: 希伯来语直译为“在自身里面活着”，指此人自身有生命、状况良好；若逐字译为“活在自己里面”会误导为内在生活。译作“自身康健”结合上下文传达身体安好之意，同时脚注保留原文的特殊措辞。
- source_word: מעשיר
  choice: 一个富有……的人
  rationale: 与贫穷者构成比较。介词 מ־ 在此表达“胜过”的比较关系。
- source_word: ונגע
  choice: 却……患病
  rationale: נגע 可表达遭灾、受击或染上病患；在“肉身”这一语境中，“患病”自然体现身体受苦，同时不采用希腊平行文本更强烈的“受鞭打”。
- source_word: בבשרו
  choice: 肉身
  rationale: בשר 的具体义是“肉、血肉之躯”。“肉身”既保留原文的具体身体用语，也比单译“身体”更贴近希伯来措辞。
theological_decisions:
- issue: 身体状况与财富的对比
  choice: 保留“肉身”的具体表达，并将 חי בעצמו 译为“自身康健”
  alternative: “自己里面活着……肉身受击”或“身体健康……身体患病”
  rationale: 本节是智慧格言，重点在贫穷而身体安好胜过富有而身体受苦。译文不把“肉身”抽象化为一般“健康”，也避免把不自然的希伯来反身习语逐字搬入汉语。
- issue: 希伯来文本与希腊平行文本的差异
  choice: 正文以较短的希伯来文本为准，希腊扩展措辞列入脚注
  alternative: 按希腊文在正文译作“健康、体格强壮……身体受鞭打”
  rationale: 所给希伯来见证可信度高，故正文应以其为首要依据；希腊文本有助于说明身体健康的语境，但不应无标记地扩充正文。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学格言语体。“却……胜过……却……”清楚呈现对照；“自身康健”避免生硬直译，同时由脚注交代希伯来原句及希腊平行文本。
