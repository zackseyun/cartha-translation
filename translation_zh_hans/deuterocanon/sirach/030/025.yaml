  text: Give rest to your soul[a], and gladden your heart; and keep anger far from you.
translation:
  language: zh_hans
  text: 让你的心灵得安歇[a]，使你的心欢喜；要让怒气远离你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文本较难理解；现存的希腊平行文本措辞和内容也大不相同。本译文依从现存希伯来见证，其中“使你的心欢喜”是根据上下文对一个疑难动词所作的理解。
    reason: textual_variant
lexical_decisions:
- source_word: פוג
  choice: 让……得安歇
  rationale: 此祈使动词可表达松弛、舒缓或使之平息。译作“让……得安歇”既保留对内在生命的主动劝勉，也符合本节安抚、恢复的语境。
- source_word: נפשך
  choice: 你的心灵
  rationale: נפש在智慧文学中常指人的生命或内在自我。“心灵”在现代汉语中自然庄重，并保留其内在生命的分量，同时不强加严格的身心二元论。
- source_word: ופיג
  choice: 使……欢喜
  rationale: 该词形和含义较难确定；结合宾语“心”和下句远离怒气的劝勉，此处取恢复、振奋内在之意。“使……欢喜”保留上下句的积极平行关系，但其不确定性在脚注中说明。
- source_word: לבך
  choice: 你的心
  rationale: לב在此指思想与情感的内在中心。“心”是汉语智慧文学语境中自然且清楚的对应词。
- source_word: וקצפון
  choice: 怒气
  rationale: 该名词表示愤怒或烈怒。“怒气”符合现代汉语的伦理劝诫语体，也不额外强化为特定程度的震怒。
- source_word: הרחק ממך
  choice: 让……远离你
  rationale: 祈使语气要求听者主动使怒气与自己拉开距离。此译法自然地保留了原文“远离”的空间比喻和劝诫力度。
theological_decisions:
- issue: נפש所表达的人观含义
  choice: 你的心灵
  alternative: 你的生命；你自己
  rationale: 本节以智慧文学的方式劝勉人的内在生命。“心灵”保留原词的深度，却不把经文限定为严格的灵魂—身体二分说。
- issue: 希伯来文本困难且希腊平行文本内容严重不一致
  choice: 以现存希伯来文本为主，译为使内在得安歇、欢喜的劝勉，并用脚注公开说明不确定性
  alternative: 把困难动词直译为“松弛”或“衰弱”；或采用内容完全不同的现存希腊平行文本
  rationale: 所给希腊文与希伯来文并非细节差异，而是整句内容不同。既然此处有高可信度的希伯来见证，就不以希腊文强行协调；但第二个动词的解释和文本分歧会实质影响读者判断，因此必须注明。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“得安歇—欢喜—远离”保持原句由内在恢复转向排除怒气的结构；分号呈现最后一项劝勉的转折和推进。
