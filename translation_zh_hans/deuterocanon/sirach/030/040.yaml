  yaml_path: translation/deuterocanon/sirach/030/040.yaml
  text: If you mistreat him and send him away[a], he will run off; on what road will you look for him?
translation:
  language: zh_hans
  text: 你若苦待他，又把他赶走，他就会逃走；你要到哪条路上去寻找他呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“你要在哪一条路上寻找他？”这里以具体的道路构成反问，强调一个人一旦被赶走，就很难再找回来。
    reason: 保留具体意象并说明反问的表达作用。
lexical_decisions:
- source_word: ἐὰν
  choice: 若
  rationale: 引出开放性的条件句，简洁保留“如果”的语气。
- source_word: κακώσῃς
  choice: 苦待
  rationale: 该动词可指伤害、虐待或使人受苦；“苦待”适合人际语境，也不把含义局限于身体伤害。
- source_word: ἀπάρᾳς
  choice: 把他赶走
  rationale: 在此与随后“逃走”相连，表示使对方离开；“赶走”保留了驱离的力度。
- source_word: ἀποδρᾷ
  choice: 他就会逃走
  rationale: 表达跑掉、逃离之意；“逃走”自然呈现被驱离后离去的具体动作。
- source_word: ἐν ποίᾳ ὁδῷ
  choice: 到哪条路上
  rationale: 保留希腊文具体的“道路”意象，不将反问弱化为笼统的“到哪里”。
- source_word: ζητήσεις
  choice: 你要……寻找他
  rationale: 以将来语气构成反问；“寻找”准确而自然地表达搜寻失去之人的意思。
