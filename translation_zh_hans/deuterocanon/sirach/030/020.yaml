  text: So it is with one who has wealth and does not enjoy it[a].
translation:
  language: zh_hans
  text: 拥有财富却不能享用的人，也是如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本以鲜明的比喻扩展了这一思想：“眼看着而叹息，好像太监拥抱一位处女而叹息。”这支持本句所表达的意思：拥有财富，却不能实际享用。
    reason: alternative_reading
lexical_decisions:
- source_word: כן
  choice: 也是如此
  rationale: 承接上下文中的类比，以现代汉语自然表达希伯来语的比较和总结作用。
- source_word: מי
  choice: ……的人
  rationale: 表达不定关系意义，不额外限定性别。
- source_word: יש לו עושר
  choice: 有财富
  rationale: 将希伯来语表示领有的惯用结构译为自然汉语；“财富”准确指物质资财。
- source_word: ואין נהנה ממנו
  choice: 却不能从中享受
  rationale: נהנה兼有享用、得益之意；此处重在虽拥有财富却未能实际享受。“不能”也与希腊平行文本所凸显的无力享用相符，同时不具体断定原因。
