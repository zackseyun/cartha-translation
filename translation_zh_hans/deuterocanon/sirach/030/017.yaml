base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/017.yaml
  text: Death is better than a life of emptiness[b][a], and eternal rest than unrelenting pain.
translation:
  language: zh_hans
  text: 死胜过虚空的一生[a]；永远安息胜过持久的痛苦[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“死胜过苦涩的一生。”希伯来文作“虚空的一生”。
    reason: alternative_reading
  - marker: b
    text: 希腊文平行文本在此作“持久的疾病（或患难）”；希伯来文直说“痛苦”，并用一个表示牢固、持续的词加以修饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב למות
  choice: 死胜过
  rationale: טוב ל־在这里构成比较，意为“……更好”；将不定式 למות 名词化译作“死”，简洁保留格言体。希腊文 κρείσσων θάνατος 也印证这一比较结构。
- source_word: מחיי שוא
  choice: 胜过虚空的一生
  rationale: שוא 可指虚空、虚妄或徒然。“虚空的一生”贴近希伯来文，又保留其可能兼有空洞与徒然的语义；希腊平行文本作“痛苦的一生”，作为异文收入脚注。
- source_word: ונוחת עולם
  choice: 永远安息
  rationale: נוחת 表示安息、歇息，עולם 表示长久、永久。“永远安息”自然庄重，并避免把本句明确限定为某一套来世教义。
- source_word: מכאב נאמן
  choice: 胜过持久的痛苦
  rationale: כאב 是痛苦、疼痛；נאמן 本义有牢固、可靠之意，在此修饰痛苦，表示持续不去。“持久的痛苦”保留持续性而不过度强化为绝不缓解。
theological_decisions:
- issue: 希伯来文与希腊文对第一项比较的不同表述
  choice: 正文采用希伯来文“虚空的一生”
  alternative: 希腊文：“痛苦的一生”
  rationale: 现存希伯来文本在此置信度高，应作为正文依据；希腊文本确认比较结构，但词义有别，故在脚注中透明呈现。
- issue: עולם 在智慧格言中的时长含义
  choice: 译为“永远”
  alternative: “长久”或“永久”
  rationale: 该词可表示久远乃至永恒；“永远安息”保留原文分量与神学张力，同时不额外说明安息的具体性质。
- issue: 经文对死亡与受苦人生的比较
  choice: 按格言式比较直译，不附加伦理或教义解释
  alternative: 将其弱化为仅指病痛处境，或解释为对死亡行为的规范性认可
  rationale: 原文陈述的是比较性智慧格言；译文应保留其尖锐张力，不将它扩展为文本未明说的伦理裁决。
translation_notes:
  register: 采用现代、庄重而易懂的格言体；以两个平行分句呈现原文的比较结构。“虚空”保留智慧文学语感，“持久的痛苦”则使用当代读者容易理解的表达。
