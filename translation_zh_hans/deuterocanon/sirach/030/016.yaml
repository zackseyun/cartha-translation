  text: There is no wealth greater than a sound body[b][a], and there is no good greater than a glad heart.
translation:
  language: zh_hans
  text: 没有什么财富胜过身体康健[a]，也没有什么福分胜过一颗喜乐的心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语原文凝练，可理解为“身体健全”；希腊语平行文本作“身体健康”。
    reason: 说明原文措辞及平行文本的支持。
  - marker: b
    text: 希伯来语字面为“心的美好（或良好）”；希腊语平行文本作“心中的喜乐”。
    reason: 保留希伯来语与希腊语见证之间的措辞差异。
lexical_decisions:
- source_word: אין עושר על עושר
  choice: 没有什么财富胜过
  rationale: “אין…על…”在这里表达比较和超越；译为“没有什么……胜过”既保留比较结构，也符合现代汉语表达。
- source_word: שר עצם
  choice: 身体康健
  rationale: 希伯来语短语凝练且略显晦涩；希腊语平行文本的“身体的健康”（ὑγείας σώματος）支持将其理解为身体健全、健康，而非逐字处理。
- source_word: אין טובה על
  choice: 没有什么福分胜过
  rationale: 与前半句形成平行的比较结构。将名词 טובה 译作“福分”，可自然表达一种可贵的好处或福祉，而不把它狭义化为道德上的“善”。
- source_word: טוב לבב
  choice: 一颗喜乐的心
  rationale: 希伯来语字面为“心的美好／良好”，在本语境中可指内在安适愉悦；希腊语平行文本“心中的喜乐”（χαρὰν καρδίας）支持情感层面的理解。“喜乐的心”同时保留“心”的意象。
