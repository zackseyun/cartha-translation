translation:
  language: zh_hans
  text: 管教自己儿子的人，必从儿子得益；也必在熟人中因儿子而夸耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παιδεύων
  choice: 管教……的
  rationale: παιδεύω在教养语境中兼有教育、训练和纠正之意。“管教”自然凝练，并保留塑造与纠正的双重意味，不限于惩罚。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: 自己的儿子
  rationale: 原文明确为阳性单数“儿子”，故不泛化为“孩子”；“自己的”也清楚表达αὐτοῦ的所属关系。
- source_word: ὀνήσεται ἐπʼ αὐτῷ
  choice: 必从他得益
  rationale: ὀνήσεται表示获得益处，ἐπʼ αὐτῷ在此指出益处的来源。“从他得益”符合现代汉语，也保留父亲因儿子而受益的含义。
- source_word: ἀνὰ μέσον γνωρίμων
  choice: 在熟人中
  rationale: γνωρίμων指认识的人或熟识者，未必是亲密朋友；“熟人”可避免将关系强化为“朋友”。
- source_word: καυχήσεται ἐπʼ αὐτῷ
  choice: 必因他夸耀
  rationale: καυχήσεται直指夸耀或自豪，ἐπʼ αὐτῷ说明夸耀的缘由。“因他夸耀”保留原文社会荣誉语境及其未加评断的语气。
theological_decisions:
- issue: 父母夸耀的道德色彩
  choice: 译作“夸耀”，不将其弱化为“感到自豪”。
  alternative: 可译作“以他为荣”或“因他自豪”。
  rationale: 原文描述父亲因受管教的儿子而在熟人中获得可夸之处，并未明确评判这种夸耀是善是恶。直译“夸耀”可保存这种道德张力，避免替文本作出判断。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。两个分句以“必”对应希腊语将来时，呈现格言所表达的预期结果；不添加原文没有的条件或道德评价。
