  yaml_path: translation/deuterocanon/sirach/030/019.yaml
  text: What value is there in the idols of the nations[a], which neither eat nor smell?
translation:
  language: zh_hans
  text: 列国的偶像有什么价值呢？它们既不能吃，也不能闻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在此另有：“被主赶逐的人也是如此。”
    reason: 希腊平行文本含有现存希伯来文本所无的续句。
lexical_decisions:
- source_word: מה יעריכו
  choice: 有什么价值呢
  rationale: 该希伯来语表达提出关于价值或用处的反问；希腊平行文本 τί συμφέρει 也支持“有什么益处/价值”的理解。此译法自然地保留反问语气。
- source_word: לאלילי הגוים
  choice: 列国的偶像
  rationale: אלילי הגוים 指列国所拥有或敬奉的偶像。“列国”比带有特定宗教语境色彩的“外邦人”更贴近此处希伯来语，也较为中性。
- source_word: אשר לא יאכלון
  choice: 它们既不能吃
  rationale: 直译偶像不具备进食能力；“既……也……”呈现后续成对否定，并以“不能”自然表达偶像的无能。
- source_word: ולא יריחון
  choice: 也不能闻
  rationale: ריח 的基本义是“闻、嗅”。不补出“香气”或“祭物”，以免将上下文隐含内容写入正文。
theological_decisions:
- issue: 是否把现存希伯来文本所无的希腊语续句纳入正文
  choice: 正文只翻译希伯来语句，希腊语增文列入脚注
  alternative: 在正文加入“被主赶逐的人也是如此”
  rationale: 此处希伯来文本完整可用，故按希伯来语为正文依据。希腊平行文本含有重要续句，应诚实保留为异文脚注，而不混入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”保留智慧文学中的民族称谓；反问句简洁有力。脚注标记置于完整希伯来正文之后。
