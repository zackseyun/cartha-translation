  text: Years of a glad heart are better than delicacies[b][a], and his food will agree with him.
translation:
  language: zh_hans
  text: 心中喜乐的岁月胜过美味佳肴[a][b]；他所吃的也会让他受用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为：“好心的岁月代替美味佳肴，他的食物必上到他身上。”后半句可能指心中喜乐的人即使吃普通食物，也吃得舒服、容易消化或从中受益。
    reason: lexical_alternative
  - marker: b
    text: 斯威特本希腊文在此节另载一则不同的教训，内容是人在世时不可让儿子、妻子、兄弟或朋友支配自己，也不可把财物交给别人，免得日后反悔而向他们求讨。因此，此处希伯来文见证代表一种显著不同的文本传统。
    reason: textual_variant
lexical_decisions:
- source_word: שנות
  choice: 岁月
  rationale: 保留希伯来文复数所呈现的时间延续感，不将其过度归纳为“一生”。
- source_word: לב טוב
  choice: 心中喜乐
  rationale: 智慧文学语境中的“好心”主要指内在愉悦、舒畅，并非只指道德上的善良；“心中喜乐”在现代汉语中自然且庄重。
- source_word: תחת
  choice: 胜过
  rationale: 字面可作“代替、在……的位置”，此处构成价值比较；“胜过”自然表达喜乐岁月比佳肴更可贵的含义。
- source_word: מטעמים
  choice: 美味佳肴
  rationale: 指可口、上好的食物；该表达既准确又符合现代汉语习惯。
- source_word: ומאכלו
  choice: 他所吃的
  rationale: 后缀为阳性单数，最自然地回指心中喜乐的人；采用动态表达，避免“他的食物”在汉语中的生硬感。
- source_word: יעלה עליו
  choice: 会让他受用
  rationale: 字面为“上到他身上”，语境中表示食物对人有益、吃了舒服或容易消化；“受用”保留健康、有益的宽泛含义，而不武断限定为单一生理过程。
