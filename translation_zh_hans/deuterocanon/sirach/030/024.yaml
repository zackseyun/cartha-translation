  text: A joyful heart is a man's life[a], and a person's gladness prolongs his life.
translation:
  language: zh_hans
  text: 心中的喜乐是人的生命；人的欢欣使人延年[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来传本文末几个字较难理解，按字面近似“延长了他的鼻子／怒气”。希腊平行文本说嫉妒和愤怒“使日子减少”，为这里所涉年日或寿命的含义提供旁证；正文据此按可能的原意译作“使人延年”。
    reason: textual_variant
lexical_decisions:
- source_word: שמחת לב
  choice: 心中的喜乐
  rationale: 直译为“心的喜乐”，指内在的欢喜；“心中的喜乐”既贴近希伯来语结构，也符合现代汉语表达。
- source_word: חיי איש
  choice: 是男子的生命
  rationale: חיי 在此整体表示“生命”，איש 通常指男子。保留系词式箴言表达，也保留 איש 与下句泛指 אדם 的区别。
- source_word: וגיל אדם
  choice: 人的欢欣
  rationale: גיל 表示欢喜、欢欣；אדם 在此为泛指人类，译作“人”自然且不限定性别。
- source_word: האריך אפו
  choice: 使他延年
  rationale: 传抄的希伯来文按字面近似“延长他的鼻子／怒气”，在语境中难解。结合希腊平行文本有关“日子减少”的说法，正文采用很可能原指延长年日的含义；“延年”简洁自然，并与生命主题呼应。
theological_decisions:
- issue: איש 与 אדם 的性别及泛指范围
  choice: 将 איש 译为“男子”，将 אדם 译为泛指的“人”
  alternative: 两者都译为“人”，或两者都译为“男子”
  rationale: 原文有意使用两个不同的人称名词；如此翻译既不抹平差异，也不把本来泛指的 אדם 限定为男性。
- issue: 末句希伯来文本的疑难读法
  choice: 正文按语境译为“使他延年”，并以脚注说明文本问题
  alternative: 按现存辅音文本直译为“延长他的鼻子／怒气”
  rationale: 字面读法在本句中语义不通；希腊平行文本虽采用反向表述，却显示这一语境所谈的是情绪使寿命缩短或延长。正文采用可理解的可能原意，同时不隐瞒传本文本。
translation_notes:
  register: 采用简洁、对称的箴言体。“心中的喜乐”“人的欢欣”庄重而易懂；分号体现两个平行分句。
