base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/009.yaml
  text: Discipline your son[a], lest you be put to shame; but if you play with him, he will humiliate you.
translation:
  language: zh_hans
  text: 要管教你的儿子[a]，免得你蒙羞；你若和他玩耍，他必使你受辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“娇养孩子，他会使你惊愕；和他玩耍，他会使你忧伤。”希伯来文本则作“管教你的儿子……他必使你受辱”。
    reason: alternative_reading
lexical_decisions:
- source_word: יסר
  choice: 管教
  rationale: 该词指带有纠正意味的教导或惩戒；“管教”既保留父母纠正儿子的语境，也符合现代汉语的自然表达。
- source_word: בנך
  choice: 你的儿子
  rationale: 希伯来文为明确的阳性单数，直译为“你的儿子”，不泛化为“孩子”。
- source_word: לבל תבוש
  choice: 免得你蒙羞
  rationale: לבל 表示防止某种结果；“蒙羞”兼顾个人羞耻与社会荣辱层面的含义。
- source_word: תשחק עמו
  choice: 和他玩耍
  rationale: שׂחק 的直接意义是“玩耍、嬉戏”，希腊文 σύνπαιξον 也支持这一具体表达；不在正文中进一步解释为“纵容”。
- source_word: יכלימך
  choice: 他必使你受辱
  rationale: כלם 在此有使人羞愧、受辱之意；“使你受辱”保留主动致辱的力度，并避免与前句“蒙羞”完全重复。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在本节的措辞和语义上存在差异
  choice: 正文以现存且可信度高的希伯来文为准，译作管教儿子、免得蒙羞，以及玩耍后使父亲受辱。
  alternative: 按希腊文译为：“娇养孩子，他会使你惊愕；和他玩耍，他会使你忧伤。”
  rationale: 《便西拉智训》的希伯来文在此保存完整、语意连贯，应作为主要依据；希腊文虽可印证第二分句“和他玩耍”，却在首个动词和末项结果上反映不同读法，因此以脚注保留，不以其取代正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“管教”“蒙羞”“受辱”准确传达智慧训诲的语气；保留“和他玩耍”的具体说法，不将其解释性改写为“纵容他”。
