  text: Jealousy and anger shorten days[b][a], and anxiety brings old age before its time.
translation:
  language: zh_hans
  text: 嫉妒和愤怒[a]会缩短人的寿命，忧虑使人过早衰老。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愤怒”所译的希伯来语 דין 在这里含义难定，也可能指“争讼”“纷争”，或按其常见义理解为“审判”。本译文依照上下文，将它理解为一种损害人的敌对情绪。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希腊语平行文本与本节内容并不对应，看来属于另一处经文，因此本译文以希伯来语见证为准。
    reason: textual_variant
lexical_decisions:
- source_word: קנאה
  choice: 嫉妒
  rationale: 在这则智慧箴言中，此词指损害人的嫉妒之心，而不是正面的热忱；“嫉妒”符合上下文，也与后面的有害情绪相称。
- source_word: דין
  choice: 愤怒
  rationale: 此词通常与审判、争讼有关，但在这里与“嫉妒”并列，较可能指敌对、易怒的心态。“愤怒”在现代汉语中清楚自然；原文的词义疑难则保留在脚注中。
- source_word: יקצרו ימים
  choice: 会缩短人的寿命
  rationale: 希伯来语直译为“缩短日子”，是寿命缩短、早逝的表达。译为“缩短人的寿命”既传达原意，也符合现代汉语习惯。
- source_word: ובלא עת
  choice: 过早
  rationale: 字面意思是“未到时候”，表示某事提前发生；“过早”简洁地保留了时间上的含义。
- source_word: תזקין
  choice: 使人……衰老
  rationale: 该动词意为变老或衰老；此处以“忧虑”为主语，译作使役结构更符合汉语表达。
- source_word: דאגה
  choice: 忧虑
  rationale: 此词表示使人不安、耗损心力的挂虑。“忧虑”庄重自然，并能准确表达这里持续性的内在愁烦。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的箴言体。“缩短人的寿命”明示希伯来语“缩短日子”的习用含义；“使人过早衰老”保留忧虑导致未到时候便衰老的因果关系。
