  yaml_path: translation/deuterocanon/sirach/030/039.yaml
  text: If you have a servant, let him be like yourself, because you acquired him with blood; if you have a servant, lead him as yourself, because you need him as your own life.
translation:
  language: zh_hans
  text: 你若有仆人，就要让他像你自己一样，因为你是用血换来他的；你若有仆人，就要带领他，如同带领你自己一样，因为你将像需要自己的性命一样需要他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用血换来”直译现存希腊文本；这一说法的确切含义不明确。末句的希腊文构造略不寻常，也可理解为：“因为你需要他，如同需要自己的性命一样。”
    reason: 说明“血”这一异常而意义未明的措辞，并保留末句中比较语与宾语关系可能不同的句法分析。
lexical_decisions:
- source_word: οἰκέτης
  choice: 仆人
  rationale: 该词指家中的仆役，也可能具有奴隶身份；“仆人”在现代汉语中自然，并保留其从属身份而不把具体法律地位说得过死。
- source_word: ἐν αἵματι ἐκτήσω αὐτόν
  choice: 你是用血换来他的
  rationale: 依照现存希腊文本直译“在／用血中取得他”；不擅自改作某些传统译本所采用的“付代价买来”。
- source_word: ἄγε
  choice: 带领
  rationale: 保留动词“引领、带领”的基本意义，避免未经文本支持而弱化为泛指的“对待”。
- source_word: ἐπιδέησις
  choice: 你会需要
  rationale: 体现希腊语将来时形式，并自然表达将来的需要。
- source_word: ὡς ἡ ψυχή σου
  choice: 像需要自己的性命一样
  rationale: ψυχή在这里可指生命、性命；结合“需要”补出汉语比较结构，同时保留其强烈程度。
theological_decisions:
- issue: 仆人的身份与伦理要求
  choice: 保留“仆人”及两次“像你自己一样”的直接劝告
  alternative: 将οἰκέτης明确译为“奴隶”，或把劝告扩释为“把他当弟兄”
  rationale: 希腊词可涵盖家仆与奴仆，而本节本身没有“弟兄”一词；译文既不掩盖从属关系，也不添加文本未明说的身份或教义解释。
- issue: “用血换来”的含义
  choice: 正文保留希腊文本的“血”意象，并以脚注说明措辞异常
  alternative: 按传统解释译成“付了代价买来”
  rationale: 源文本明确含αἷμα“血”；其确切所指并不清楚，故不在正文中消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“像带领自己一样带领他”刻意保留原文略显突兀的表达，以免把ἄγε泛化为“对待”；脚注仅处理真实的文本与句法歧义。
