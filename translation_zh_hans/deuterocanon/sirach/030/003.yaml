  text: He who instructs his son will provoke the enemy to jealousy[a], and in the presence of friends he will rejoice over him.
translation:
  language: zh_hans
  text: 教导儿子的人，必激起仇敌的嫉妒[a]；他也必在朋友面前因儿子而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必使仇敌羡慕。”希腊语动词可指激起嫉妒，也可指使人羡慕。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ διδάσκων
  choice: 教导……的
  rationale: 现在时分词作名词性用法，表示持续承担教导责任的人；“教导”自然庄重，也适合亲子培育的语境。
- source_word: τὸν υἱὸν αὐτοῦ
  choice: 自己的儿子
  rationale: 原文明确为阳性单数“儿子”；加“自己”清楚表达反身所属关系。
- source_word: παραζηλώσει
  choice: 必使……嫉妒
  rationale: 该动词可表示激起嫉妒或羡慕；这里以“仇敌”为宾语，“使仇敌嫉妒”符合现代汉语表达，同时在脚注保留“眼红”这一语用近义可能。
- source_word: τὸν ἐχθρόν
  choice: 仇敌
  rationale: 保留带冠词的单数集合性/代表性表达；“仇敌”较“敌人”更庄重，并符合智慧文学语体。
- source_word: ἔναντι φίλων
  choice: 在朋友面前
  rationale: 直接表达“在……面前、当着……的面”的公开社交场景，准确而自然。
- source_word: ἐπʼ αὐτῷ
  choice: 因儿子
  rationale: 与“欢喜”连用时最自然地表示欢喜的缘由或对象；明说“儿子”可避免中文代词指向不清。
- source_word: ἀγαλλιάσεται
  choice: 必……欢喜
  rationale: 表达强烈喜悦；“欢喜”通俗、庄重，未来意义由“必”体现。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的智慧文学语体。两个未来时均以“必”表达；后半句重复“儿子”，避免“他……因他”造成指代含混。
