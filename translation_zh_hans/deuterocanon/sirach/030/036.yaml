  text: Put him to work[a], so that he may not be idle,
translation:
  language: zh_hans
  text: 要让他做工[a]，免得他闲着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“使他投入劳作。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμβαλε
  choice: 要让
  rationale: 这是ἐμβάλλω的简单过去时命令式；在此不是字面的“投入、扔进”，而是使某人进入某种活动。“要让”以自然的现代汉语表达命令语气。
- source_word: αὐτὸν
  choice: 他
  rationale: 阳性单数宾格代词，在语境中指男性人物；汉语用“他”承接。
- source_word: εἰς ἐργασίαν
  choice: 做工
  rationale: εἰς与ἐργασίαν合用，表示使人进入劳作或工作的状态。“做工”简洁自然，也保留实际从事劳动的含义。
- source_word: ἵνα μὴ ἀργῇ
  choice: 免得他闲着
  rationale: ἵνα加虚拟式在这里表达目的，μὴ是否定，ἀργῇ指无事可做或不劳作。“免得他闲着”保留目的含义，且没有强化为带道德评判的“懒惰”。
theological_decisions: []
translation_notes:
  register: 采用自然、简洁而端庄的现代标准汉语。主句保留命令意味；“闲着”对应ἀργῇ的无所事事之意，避免擅自译成较强的道德判断“懒惰”。
