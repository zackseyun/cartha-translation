  text: Discipline your son and make his yoke heavy[a], lest in his foolishness he consume you.
translation:
  language: zh_hans
  text: 要管教你的儿子，加重他的轭[a]，免得他因愚昧而吞噬你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“要管教你的儿子，在他身上下功夫，免得他因你的羞耻而失足。”希伯来文则作：“免得他因愚昧而吞噬你。”
    reason: textual_variant
lexical_decisions:
- source_word: יסר
  choice: 管教
  rationale: 该词兼有纠正、训诲和塑造之意；“管教”在现代汉语中自然地保留了对子女施行纠正性教导的含义，也与希腊文 παιδεύσον 相应。
- source_word: והכבד עולו
  choice: 使他的轭沉重
  rationale: 直译为“使他的轭沉重”。保留“轭”的具体比喻，不将其弱化为一般的“负担”；希腊文异文则表达“在他身上下功夫”。
- source_word: עולו
  choice: 他的轭
  rationale: עול 的本义是“轭”。这一译法保留智慧文学中以轭象征约束和训练的意象。
- source_word: פן
  choice: 免得
  rationale: 引出应当避免的不良后果；“免得”简洁自然，适合箴言式警告。
- source_word: באולתו
  choice: 因愚昧
  rationale: אולת 指愚昧、愚妄。介词 ב 在此可表达处境或原因；“因愚昧”在汉语中自然地传达其因果意味，同时不额外解释愚昧的具体表现。
- source_word: יבלע בך
  choice: 吞噬你
  rationale: בלע 本义为“吞下、吞噬”，此处比喻儿子的愚昧反过来毁害父亲。“吞噬你”保留原文强烈而鲜明的意象。
theological_decisions:
- issue: 希伯来文本与希腊文平行文本在后半句存在差异
  choice: 以现存且可信度高的希伯来文为正文：“免得他因愚昧而吞噬你”
  alternative: 依希腊文译作：“免得他因你的羞耻而失足”
  rationale: 现存希伯来文是本节的首要来源，且该读法已获高可信度验证；希腊文的显著差异不应混入正文，但应在脚注中完整说明，以保留文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“使他的轭沉重”刻意保留希伯来文略显尖锐的比喻；“吞噬你”保留原文的强烈警戒语气。脚注标记 [a] 已置于相关正文之后。
