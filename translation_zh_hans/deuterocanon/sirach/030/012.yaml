base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/012.yaml
  text: Bend his neck in his youth[a], and break his loins while he is still small[b], lest he become stubborn and bring you bitterness of soul.
translation:
  language: zh_hans
  text: 趁他年幼，使他的头低下；趁他还小，劈开他的腰[a]，免得他变得刚硬、违抗你[b]，使你心中痛苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “劈开他的腰”：希伯来文直译如此；“腰”与希腊文平行文本的“两胁／肋旁”不同。希腊文作“压碎他的两胁”。
    reason: textual_variant
  - marker: b
    text: “变得刚硬、违抗你”：此处开头的希伯来文读法困难；希腊文清楚作“免得他变得刚硬而不服从你”。希伯来文也含有“反抗你”以及由此产生“心中痛苦”的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: כוף ראשו
  choice: 压服他的头
  rationale: כוף是使弯下、使屈服的命令式，ראשו直译“他的头”。译文保留身体意象及管束、制伏之义，不把“头”改成原文没有的“颈项”。
- source_word: בנערותו
  choice: 他年幼时
  rationale: 自然表达行动应从年少时开始。
- source_word: ובקע מתניו
  choice: 击打他的腰肋
  rationale: בקע本义强烈，可指劈开、击裂；מתנים指腰、腰胁。中文若直译“劈开他的腰”容易被误解为致命伤，故以“击打”呈现惩戒动作，并用“腰肋”兼顾希伯来文的腰胁与希腊文πλευράς“肋旁、两胁”。
- source_word: כשהוא קטן
  choice: 他还小
  rationale: 保留“幼小”的具体含义，中文简洁自然。
- source_word: למה ישקה
  choice: 免得他变得刚硬
  rationale: 现存希伯来文读法困难；希腊文μὴ ποτε σκληρυνθείς明确支持“免得变硬、顽梗”的意义。
- source_word: ומרה בך / ἀπειθήσῃ σοι
  choice: 违抗你
  rationale: 希伯来文可理解为“反抗你”，希腊文明确作“不服从你”；“违抗”自然地保留两者共同的忤逆含义。
- source_word: ונולד ממנו מפח נפש
  choice: 使你心中痛苦
  rationale: מפח נפש表示内心的挫败、痛苦或失望。因希伯来文本句法有困难，译文按上下文表达由孩子的刚硬违抗给管教者造成的深切痛苦。
theological_decisions:
- issue: 智慧训诲中严厉的体罚意象
  choice: 保留具体而严厉的身体管教意象
  alternative: 概括译为“要严加管教他”
  rationale: 希伯来文和希腊文均采用鲜明的身体意象；译文不以现代伦理判断淡化正文，也不额外把它解释为某种教派性的管教规范。
- issue: 困难希伯来文与希腊平行文本的关系
  choice: 正文以现存希伯来文为主，并在难解处借希腊文确定基本语义
  alternative: 完全依照希腊文，删去希伯来文独有的“心中痛苦”
  rationale: 希伯来文为主要底本，但למה ישקה一段文本困难；希腊文支持“变得刚硬，违抗你”。希伯来文末尾的מפח נפש仍予保留，以免抹去见证差异。
translation_notes:
  register: 采用现代、庄重而直接的普通话。正文保留古代智慧文学严峻的管教语气，同时避免生硬到让普通读者误读为致命暴力的中文措辞；所有文本困难与希腊平行读法均置于脚注说明。
