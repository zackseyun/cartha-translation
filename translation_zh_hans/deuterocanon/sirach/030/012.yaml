    issue: “击打他的腰肋”软化并混合了两种文本读法。
    rationale: 希伯来文ובקע意为劈开、击裂，מתניו为“他的腰／腰部”；希腊文才作“两胁／肋旁”。正文应以希伯来文的强烈身体意象为主，脚注再列希腊文平行读法。
  - severity: low
    issue: “压服他的头”不够自然。
    rationale: 汉语通常不说“压服头”。“使他的头低下”更自然，并保留命令其俯首、受制的具体意象。
  - severity: low
    issue: 脚注a对希腊文θλάσον的说明不够准确。
    rationale: 该词在此更接近“压碎／击碎”，不只是一般性的“击伤”。
