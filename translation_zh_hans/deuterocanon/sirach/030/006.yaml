  yaml_path: translation/deuterocanon/sirach/030/006.yaml
  text: Before enemies he left behind an avenger[a], and for friends one who repays kindness.
translation:
  language: zh_hans
  text: 他在仇敌面前留下了一位申冤者[a]，也为朋友留下了一位报答恩情的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“报仇者”“维护公道的人”；希腊词可指替别人讨回公道或施行报应的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναντίον ἐχθρῶν
  choice: 在仇敌面前
  rationale: ἐναντίον与属格连用可表达“在……面前”或面对某方的情境；此处既保留公开面对仇敌的意味，也不把介词本身过度强化为直接攻击。
- source_word: κατέλιπεν
  choice: 留下了
  rationale: 动词表示身后留下某人；上下文所指为存留的儿子。“留下了”自然简洁，并保留承继意味。
- source_word: ἔκδικον
  choice: 申冤者
  rationale: 该词可指为别人讨回公道、施行报应或复仇的人。“申冤者”保留代父追讨公道的力度，同时以脚注交代“报仇者”等可能译法。
- source_word: τοῖς φίλοις
  choice: 为朋友
  rationale: 与前半句“仇敌”形成关系上的对照；“为朋友”自然表达此人会向朋友作出相应回报。
- source_word: ἀνταποδιδόντα χάριν
  choice: 报答恩情的人
  rationale: ἀνταποδίδω强调相应回报，χάρις在此为人际间所受的恩惠或善意；“报答恩情”符合现代汉语习惯，也避免把χάρις误作专门的神学术语。
theological_decisions:
- issue: ἔκδικον在智慧文学和家族荣誉语境中的道德色彩
  choice: 申冤者
  alternative: 报仇者；辩护者；维护公道的人
  rationale: 原文描绘儿子在父亲身后面对仇敌、替他讨回公道，并未明确评断这种行动。“申冤者”不将其弱化为单纯保护，也不把含义完全限定为私人复仇；脚注保留原词可能具有的报仇力度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两半句都补出“留下”，使省略结构在中文中清楚，并保留仇敌与朋友、申冤与报恩之间的平行对照。
