  text: He will bind up his wounds over the souls of his sons, and at every cry his inward parts will be troubled.
translation:
  language: zh_hans
  text: 论到儿子们的性命[a]，他会包扎他的伤口；每逢一声呼喊，他的五内都会不安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所据希腊文本开头直译为“关于（或：论到）儿子们的生命（或：灵魂）”。这一前置短语与后文的句法关系不甚明确，现有文本也不十分顺畅；因此译文不补入原文没有明说的主语身份、因果关系或目的。
    reason: 说明περὶ ψυχῶν υἱῶν的语义和句法含混，并避免“为了”所引入的目的关系。
lexical_decisions:
- source_word: περὶ ψυχῶν υἱῶν
  choice: 为了儿子们的性命
  rationale: περί在此可表示关涉或缘由；ψυχαί既可指“灵魂”，也可指“生命、性命”。译作“为了……的性命”较符合现代汉语，同时保留原文所表达的切身牵挂。
- source_word: καταδεσμεύσει τραύματα αὐτοῦ
  choice: 他会包扎自己的伤口
  rationale: καταδεσμεύω表示捆扎、包扎，τραύματα指伤口；αὐτοῦ直译为“他的”，依本句主语自然译作“自己的”。
- source_word: ἐπὶ πάσῃ βοῇ
  choice: 每一声呼喊
  rationale: βοή可指呼喊、喊声；πάσῃ在分配意义上译为“每一声”。原文未说明是谁发出的呼喊，译文不加限定。
- source_word: ταραχθήσεται σπλάγχνα αὐτοῦ
  choice: 都会使他五内不安
  rationale: σπλάγχνα字面指内脏，也常表示人的内心深处；“五内不安”既保留身体内部的意象，又自然表达强烈不安。希腊文以复数“内脏”为主语，汉语转换为使动结构。
theological_decisions:
- issue: ψυχαί应译作“灵魂”还是“性命”
  choice: 性命
  alternative: 灵魂
  rationale: 此处语境重在父亲因儿子们所受威胁或呼喊而焦虑，并非明确论述灵魂的本体，因此采用ψυχή常见的“生命、性命”义，避免加入身心二分的神学预设。
- issue: 呼喊者的身份
  choice: 不明确指出
  alternative: 译成“儿子每次呼喊”
  rationale: 原文只说“每一声呼喊”，没有明说呼喊来自儿子；保留这一含混，不作补足。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“五内不安”略带书面色彩，但仍通俗可懂，并能传达σπλάγχνα的身体意象。全句不擅自补出前文可能暗示的父亲身份，也不明确呼喊者是谁。
