  text: In his lifetime he saw and rejoiced[a], and at his end he was not grieved.
translation:
  language: zh_hans
  text: 他有生之年看见了，并且欢喜；到临终时[a]，没有忧伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他生命的终点”，也可理解为“在他最后的日子里”。希腊语短语指生命接近终点的时候。
    reason: 说明该省略式时间短语可作较明确或较宽泛的时间表达。
lexical_decisions:
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: 他有生之年
  rationale: 自然表达事情发生在他一生之内，同时保留原文的时间范围。
- source_word: εἶδεν
  choice: 看见了
  rationale: 原文没有明说所看见的对象，因此不补入“儿子的成就”等上下文推断，保留原句的省略。
- source_word: εὐφράνθη
  choice: 就欢喜
  rationale: 表达该动词强烈而正面的喜乐反应；“就”自然连接看见与欢喜，但不额外限定所见内容。
- source_word: ἐν τῇ τελευταῖ αὐτοῦ
  choice: 临终时
  rationale: 该省略式短语指向生命的末尾；“临终时”在现代汉语中简洁自然，也符合语境。
- source_word: οὐκ ἐλυπήθη
  choice: 也没有忧伤
  rationale: 保留否定的情感状态；“忧伤”符合智慧文学的庄重语体，“也”体现两分句之间的并列照应。
