  text: For idleness has taught much evil[a].
translation:
  language: zh_hans
  text: 因为懒惰使人学会了许多恶事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“极大的恶”；希腊语既可强调恶事之多，也可强调恶的深重。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὴν
  choice: 许多
  rationale: 修饰单数名词 κακίαν，可表示恶的数量或程度；正文用“许多恶事”自然表达其广泛后果，同时在脚注保留“极大的恶”这一可能。
- source_word: γὰρ
  choice: 因为
  rationale: 保留该词与上文的解释性联系；现代汉语中“因为”比单用“因”更清楚自然。
- source_word: κακίαν
  choice: 恶事
  rationale: κακία 指邪恶、恶行或道德上的败坏。“恶事”在此与“许多”搭配自然，并保留宽泛的道德含义。
- source_word: ἐδίδαξεν
  choice: 教会了
  rationale: 保留希腊文“教导”的拟人化意象；汉语用“教会了”可自然表达经验性、箴言式的陈述。
- source_word: ἡ ἀργία
  choice: 闲懒
  rationale: ἀργία 表示无所事事、懒散或不劳作。“闲懒”兼顾闲置与懒惰之意，又不引入特定神学分类。
