  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: zh_hans
  text: 轭和皮带会使颈项弯曲；作恶的奴仆[a]有刑架和酷刑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴仆”或译“家仆”。希腊语οἰκέτης可指家内的仆役，也可指家内奴隶。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγὸς
  choice: 轭
  rationale: 此处与“颈项”构成具体意象，指套在颈上的轭，并非衡器。
- source_word: ἱμὰς
  choice: 皮带
  rationale: 指皮制的带子或束带；“皮带”自然清楚，也与“轭”并列为约束之物。
- source_word: κάμψουσιν
  choice: 会使……弯下
  rationale: 保留使役性的身体动作和将来式所表达的一般结果，不额外强化为“强迫屈服”。
- source_word: τράχηλον
  choice: 颈项
  rationale: 准确保留身体部位的意象；“颈项”庄重而易懂，适合智慧文学的格言语体。
- source_word: οἰκέτῃ
  choice: 奴仆
  rationale: 该词可指家仆或家内奴隶；本节涉及强制约束和严酷刑罚，“奴仆”既不淡化其受支配地位，也保留其家内仆役色彩。
- source_word: κακούργῳ
  choice: 作恶的
  rationale: 表达道德上的作恶性质，避免把词义收窄为已经法律定罪的“罪犯”。
- source_word: στρέβλαι
  choice: 刑架
  rationale: 该词指扭绞身体的刑具；“刑架”以简洁的现代汉语呈现具体刑具，同时避免误解为绞刑架。
- source_word: βάσανοι
  choice: 酷刑
  rationale: 该词在此指严厉的拷打和折磨；“酷刑”保留原文的强烈程度，并与“刑架”自然搭配。
theological_decisions:
- issue: 智慧文学语境中受奴役身份用语的译法
  choice: 奴仆
  alternative: 家仆／仆役
  rationale: οἰκέτης本身可涵盖家内仆役与奴隶身份，不能机械等同于普通雇工；本节的刑罚和强制语境凸显其受支配地位，故正文译“奴仆”，并以脚注保存“家仆”这一可能译法。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留原文前后两分句的格言式对举。“会使……弯下”呈现前句的一般规律；后句按希腊语省略系词的结构，以“要受”补足自然汉语所需的谓语关系。
