translation:
  language: zh_hans
  text: 心中的喜乐是人的生命；人的欢欣使人延年益寿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存的希伯来文见证难以理解，并且与希腊文传统差异很大。本节正文采用意义清楚的希腊文：“心中的喜乐是人的生命；人的欢欣使人延年益寿。”
    reason: textual_variant
lexical_decisions:
- source_word: εὐφροσύνη καρδίας
  choice: 内心喜乐
  rationale: 希腊文意为“心中的喜乐、欢畅”；译作“内心喜乐”自然清楚，也保留“心”作为内在生命与情感中心的含义。
- source_word: ζωὴ ἀνθρώπου
  choice: 就是人的生命
  rationale: 直译希腊文的系表结构，并以“人”表达单数名词在此处的泛指作用。
- source_word: ἀγαλλίαμα ἀνδρός
  choice: 人的欢欣
  rationale: “欢欣”保留该词较为外显、昂扬的喜悦意味；“人”在现代汉语中自然表达此处的泛指。
- source_word: μακροημέρευσις
  choice: 使他的日子长久
  rationale: 按希腊文所表达的长寿含义译成自然的圣经式汉语，同时保留“日子长久”的意象。
theological_decisions:
- issue: 现存希伯来文见证与希腊文平行传统严重分歧
  choice: 正文依照意义清楚且完整的希腊文平行传统翻译，并用脚注说明文本差异。
  alternative: 按现存希伯来文译为大意类似“如同忠信者与童女同宿，凭强力施行审判的也是如此，耶和华必向他追讨”，但开头及全句关系不确定。
  rationale: 所给希伯来文本与希腊文在内容上完全不同，且希伯来文表述难解，可能属于讹误、错置或不同文本传统。正文若勉强采用希伯来文，会造成虚假的确定性；依照清楚的希腊文翻译并公开注明差异，更能忠实呈现现有证据。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“内心喜乐”与“人的欢欣”避免生硬重复；“使他的日子长久”保留经文语感。正文中的[a]与脚注标记对应。
