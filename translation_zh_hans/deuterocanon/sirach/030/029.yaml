  text: As long as you still live and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: zh_hans
  text: 只要你还活着，气息尚在你里面，就不要把自己交给任何血肉之人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译作“任何血肉”；这里的“血肉”很可能指必死的人，即“任何人”或“任何世人”。
    reason: 说明σάρξ的字面意象及其语境含义，避免读者把它误解为肉体本身或专门的罪性术语。
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: 只要你还活着
  rationale: 以自然的现代汉语表达持续的时间关系，并保留ἔτι所强调的“还、仍然”。
- source_word: πνοὴ ἐν σοί
  choice: 气息尚在你里面
  rationale: 保留希腊文以气息描写生命的具象表达；“尚”也与前句的“还”共同传达生命仍在延续。
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: 不要把自己交给
  rationale: ἀλλάσσω通常可指“改变、交换”，但此处反身宾语加与格更可能表示把自己转交或置于他人的权下。直译为“不要改变自己给……”在汉语中难以理解，因此采用符合语境而不过度具体化的“把自己交给”。
- source_word: πάσῃ σαρκί
  choice: 任何血肉之人
  rationale: πᾶς在单数中作分指用，译为“任何”；σάρξ字面是“肉、血肉”，此处指有死的人类。“血肉之人”既保留原文意象，也比“任何血肉”更符合现代汉语。
theological_decisions:
- issue: 智慧文学语境中σάρξ的含义
  choice: 血肉之人
  alternative: 任何人／任何世人／任何血肉
  rationale: 此处没有充分依据把σάρξ解释为专门的“罪性”概念；它更可能强调人的血肉性与必死性。正文保留“血肉”意象，同时用“之人”明确其所指。
- issue: ἀλλάξῃς在反身结构中的语义
  choice: 把自己交给
  alternative: 交换自己／改变自己／使自己屈从于
  rationale: 原动词本身具有“改变、交换”的语义范围，但在此结构和劝诫语境中，很可能指将自己转归他人、受他人支配。“把自己交给”保留这种关系性含义，又不额外指定法律上的所有权或绝对服从。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“气息尚在你里面”有意保留原文具象的生命语言；“血肉之人”保留智慧文学中的人类必死性意象。脚注标记置于其实际解释的“血肉之人”之后。
