  text: Do not give your soul over to grief[b][a], and do not stumble in your iniquity.
translation:
  language: zh_hans
  text: 不要让你的生命陷入忧愁[a][b]，也不要因自己的罪孽而跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧愁”：希伯来语לדין含义难定。若仅按其辅音形式，也可能理解为“审判”；希腊平行文本支持“忧愁、悲伤”的意思。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本在这里明显较长：“要爱惜自己的生命，安慰自己的心，使忧愁远离你；因为忧愁害死了许多人，其中毫无益处。”现存希伯来文本则较短。
    reason: alternative_reading
lexical_decisions:
- source_word: אל תתן
  choice: 不要让……陷入
  rationale: נתן在此与介词补语连用，有“交付、任凭”的意思。中文用“让……陷入”自然地表达向某种有害状态屈服，同时不过度增译。
- source_word: לדין
  choice: 陷入忧愁
  rationale: 此词在现存希伯来文本中难解；若仅按辅音可联想到“审判”，但希腊平行文本反复使用λύπη（忧愁、悲伤），强力支持“忧愁”的语义。
- source_word: נפשך
  choice: 你的生命
  rationale: נפש可指生命、自身或心灵。这里译作“生命”既保留希伯来语整体人格与生命的含义，也符合现代汉语表达；希腊平行文本的ψυχή同样支持这一理解。
- source_word: ואל תכשל
  choice: 也不要……跌倒
  rationale: כשל本义为绊倒、跌倒，也可比喻道德上的失足。“跌倒”保留原文意象，在现代中文中清楚自然。
- source_word: בעונך
  choice: 因自己的罪孽
  rationale: עון可指罪孽、罪责或罪所带来的后果。介词ב在此可表达原因或处境；译作“因自己的罪孽”较自然，同时保留其道德分量。
theological_decisions:
- issue: 采用较短的希伯来文本，还是采用较完整的希腊平行文本
  choice: 正文忠实翻译现存的简短希伯来文本，仅以希腊文本帮助判定疑难词לדין的含义。
  alternative: 依希腊文本扩译为：“要爱惜自己的生命，安慰自己的心，使忧愁远离你；因为忧愁害死了许多人，其中毫无益处。”
  rationale: 《便西拉智训》有希伯来文本存世之处以希伯来文为主要依据；希腊见证在此较长，不宜无标示地并入正文，但可作为解决希伯来疑难词的重要证据。
- issue: לדין应理解为“忧愁”还是“审判”
  choice: 正文译为“忧愁”。
  alternative: 译为“审判”。
  rationale: 希伯来辅音形式本身存在困难，必须保留这一不确定性；然而希腊平行文本两次出现λύπη，使“忧愁、悲伤”成为更有文本证据支持的语境读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“生命”避免把נפש局限为可与身体分离的“灵魂”；“跌倒”保留原文的道德失足隐喻。脚注标记依其在正文中所说明内容的先后排列。
