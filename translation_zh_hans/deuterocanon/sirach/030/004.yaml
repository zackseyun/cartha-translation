base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/004.yaml
  text: His father has died[a], yet it is as though he had not died, for he has left behind one like himself after him.
translation:
  language: zh_hans
  text: 他的父亲死了，却仿佛没有死，因为父亲身后留下了一个像他的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他在自己之后留下了一个像自己的人。”这里“在自己之后”指他身后、在他去世以后。按上下文，这指仍存世的后代，很可能是儿子。
    reason: 说明κατέλιπεν μετʼ αὐτόν和ὅμοιον的原文措辞及其上下文所指；正文不补入原文未明说的“儿子”。
lexical_decisions:
- source_word: ἐτελεύτησεν
  choice: 死了
  rationale: 该动词本义为“到了终点”，在这里明确指死亡；“死了”直接、自然，也准确表达已经发生的事。
- source_word: ὁ πατήρ
  choice: 他的父亲
  rationale: 结合αὐτοῦ，应理解为所属关系；现代汉语用“他的父亲”清楚自然。
- source_word: ὡς οὐκ ἀπέθανεν
  choice: 却仿佛没有死
  rationale: ὡς表示比拟，并非否认死亡事实；“仿佛没有死”保留这种反事实式比较。“却”自然呈现前后反差。
- source_word: ὅμοιον
  choice: 一个像自己的人
  rationale: 该中性单数形容词在此作名词用，隐含所指为人或后代；此译法保留相似之意，又不在正文中补入原文未明说的“儿子”。
- source_word: κατέλιπεν
  choice: 留下了
  rationale: 此处指父亲去世后仍有后代存留；“留下了”简洁自然，并与“身后”共同表达存留含义。
- source_word: μετʼ αὐτόν
  choice: 身后
  rationale: 该短语表示时间或承继上的“在他之后”；汉语“身后”在死亡语境中凝练自然，同时不把含义过度限定为正式继承。
theological_decisions:
- issue: 是否在正文中把所留下的后代明确译为“儿子”
  choice: 一个像自己的人
  alternative: 一个像自己的儿子
  rationale: 上下文谈论儿子，所指很可能是存世的儿子；但本句希腊文只有名词化的ὅμοιον，没有明说“儿子”。正文因此保留原文的含蓄，脚注再交代语境。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“他的父亲死了”保持原文直陈死亡的语气；“他却仿佛没有死”保留父亲因相似后代而仿佛延续的修辞张力。
