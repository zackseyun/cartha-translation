  text: On the day your life's days are completed, and at the time of your death, distribute your inheritance.
translation:
  language: zh_hans
  text: 在你一生的日子终结之时，并在你死亡之时，要分配你的产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你一生的日子达到终点之日，并在你死亡之时，要分配你的产业。”希腊文以两个并列的时间短语表达，措辞较为紧凑。
    reason: 说明原文两个并列时间短语的较字面表达，并保留“生命的日子终结”与“死亡之时”的重复性。
lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου
  choice: 在你一生的日子满了之时
  rationale: 保留原文“你生命的日子达到终结”这一紧凑表达的意象，同时用现代汉语可自然理解的“日子满了”表达生命走到尽头。
- source_word: καὶ ἐν καιρῷ τελευτῆς
  choice: 也就是你临终的时候
  rationale: τελευτή在此可指终结或死亡；结合分配产业的语境，译作“临终”最为明确。“也就是”将两个相近的时间短语自然衔接，但不改变其共同指向生命终点的意义。
- source_word: διάδος
  choice: 要分配
  rationale: 该词为不定过去时命令式，要求作出一次明确的处置；“分配”符合产业在继承人之间予以安排的语境。
- source_word: κληρονομίαν
  choice: 你的产业
  rationale: κληρονομία可指产业、遗产或继承之物。原文未明说受领者，且是命令听者处置自己所拥有的财产，因此“你的产业”自然清楚，又避免“遗产”可能暗示必须死后才分配的时间矛盾。
theological_decisions:
- issue: 关于产业之命令的伦理范围
  choice: 将其译为人在生命终点处分自己产业的实用智慧劝告
  alternative: 扩展为临死前普遍施舍或慷慨行善的劝告
  rationale: 原文明确使用生命终结、死亡和产业的措辞，重点是安排财产，不宜加入更广泛的施舍神学。
- issue: 两个时间短语之间的关系
  choice: 用“也就是”表达二者在语义上相互说明
  alternative: 用“并且”将二者译成两个并列而彼此独立的时间点
  rationale: “一生的日子满了”与“临终的时候”在此都指生命末期；现代汉语若直译为两个并列时间点会显得重复甚至可能造成误解。脚注保留更贴近形式的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一生的日子满了”略带智慧文学色彩，但普通读者容易理解；“产业”比“遗产”更适合临终前主动分配的语境。主文脚注标记置于整句之后。
