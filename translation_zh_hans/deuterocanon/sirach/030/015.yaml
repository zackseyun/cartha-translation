  text: Life for the poor is better than refined gold[a], and a good spirit than pearls.
translation:
  language: zh_hans
  text: 穷人的生命胜过精金[a]，美好的心灵胜过珍珠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“健康与安适胜过一切黄金，强健的身体胜过无量的财富。”希伯来文本与希腊文本在这里差异很大，可能反映了不同的文本传统，也可能是现存希伯来文本发生了讹误。
    reason: textual_variant
lexical_decisions:
- source_word: חיי
  choice: 生命
  rationale: 该词是“生命”的复数形态，在此用于格言式表达；译作“生命”简洁自然，并与下半句形成平行。
- source_word: שר
  choice: 穷人
  rationale: 现存希伯来文本在此读作 שר，结合语境可理解为贫穷、缺乏的人。希腊文本则作“健康”，反映了文本传统的不一致，因此正文依希伯来文本，异文见注。
- source_word: איביתי
  choice: 胜过
  rationale: 希伯来词形和读法较为困难；上下两句的比较结构，以及希腊文本的比较级表达，都支持“更好、胜过”的含义。
- source_word: מפז
  choice: 精金
  rationale: פז 指品质上乘、炼净的黄金。“精金”是现代中文圣经语体中简洁而庄重的对应词。
- source_word: ורוח טובה
  choice: 美好的心灵
  rationale: רוּחַ 可指人的灵、心志、精神状态或内在活力。“美好的心灵”保留其较宽泛的人论含义，不把它仅限于愉快的情绪。
- source_word: מפנינים
  choice: 胜过珍珠
  rationale: פנינים 通常指珍珠，也可能泛指珊瑚或贵重宝石；“珍珠”是现代中文中最熟悉且较可能的具体译法。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本显著不同
  choice: 正文依现存希伯来文本，译作“穷人的生命……美好的心灵……”
  alternative: 希腊文本意为：“健康与安适胜过一切黄金，强健的身体胜过无量的财富。”
  rationale: 本项目在《便西拉智训》的希伯来文本存留时优先从希伯来文翻译，同时把希腊文作为重要的平行见证。本节两者差异显著，可能源于不同的底本传统，也可能与现存希伯来文本的讹误有关；故正文保留希伯来读法，脚注完整交代希腊异文，不替读者消解文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。“精金”保持智慧文学的凝练感；“美好的心灵”避免把 רוח טובה 过度收窄为单纯的好心情。脚注标记 [a] 已在正文对应位置出现。
