revisions:
- from: 要照着适合他的，把他安排去做工；他若不服从，就加重他的脚镣。但对任何血肉之躯[a]都不可做得过分；凡事都不要不经判断就去做。
  to: 要按适合他的方式，派他做工；他若不服从，就加重他的脚镣。但对任何人[a]都不可过分；任何事都不可不经判断就去做。
  rationale: 修订仅处理汉语句法、自然度和量词焦点：以“按适合他的方式”自然表达καθὼς πρέπει αὐτῷ；以“任何人”在正文中传达σάρξ的泛指用法，并由脚注保留“血肉”意象；以“任何事都不可”直接反映μηδέν。历史语境中的严厉脚镣意象仍按原文保留，未加弱化或辩护。
