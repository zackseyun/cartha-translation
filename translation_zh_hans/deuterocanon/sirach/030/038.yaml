  - severity: low
    issue: 末句的量词表达可更贴近原文
    rationale: μηδέν是“没有任何事”，用“任何事都不可”比“凡事都不要”更直接，也避免语义焦点落在“凡事”上。
  - severity: low
    issue: 正文中的“血肉之躯”不够自然
    rationale: 此处σάρξ是泛指人类的闪语式表达。正文用“任何人”更合乎现代汉语，脚注保留字面语汇及其意象即可。
