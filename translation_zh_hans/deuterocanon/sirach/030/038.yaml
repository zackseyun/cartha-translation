base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/038.yaml
  text: Put him to work as is fitting for him[a], and if he does not obey, make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: zh_hans
  text: 要按适合他的方式，派他做工；他若不服从，就加重他的脚镣。但对任何人[a]都不可过分；任何事都不可不经判断就去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译作“所有血肉”。这是泛指人的闪语式表达，意即“任何人”。
    reason: 说明ἐν πάσῃ σαρκί的字面表达及其泛指人的通常含义，同时避免将其误解为特定的神学术语。
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: 把他安排去做工
  rationale: καθίστημι在此具有使役、安置之意，εἰς ἔργα指向劳作或任务；此译自然地保留命令语气和劳动语境。
- source_word: καθὼς πρέπει αὐτῷ
  choice: 照着适合他的
  rationale: πρέπει表示合宜、适当；译文不进一步限定是按能力、身份还是处境，保留原文的概括性。
- source_word: κἂν μὴ πειθαρχῇ
  choice: 他若不服从
  rationale: πειθαρχέω指服从权威或规训；原文没有独立的“管教”一词，因此不在正文中补入宾语。
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: 加重他的脚镣
  rationale: βάρυνον直指使之沉重，πέδαι是束缚双脚的镣铐；采用具体而贴近原文的表达，不改译为原文未明说的“收紧”。
- source_word: μὴ περισσεύσῃς
  choice: 不可做得过分
  rationale: 此处动词表达过度、越过限度；中文用“做得过分”既清楚又保持劝诫意味。
- source_word: ἐν πάσῃ σαρκί
  choice: 对任何血肉之躯
  rationale: 保留σάρξ的身体意象，同时用“之躯”表明这里泛指人，而非指抽象的罪性或肉体欲望。
- source_word: ἄνευ κρίσεως
  choice: 不经判断
  rationale: κρίσις可指判断、裁断或辨别；“判断”保留其语义宽度，没有将其限定为司法审判或内在辨识。
- source_word: μὴ ποιήσῃς μηδέν
  choice: 凡事都不要……去做
  rationale: 用全称表达再现μηδέν的全面否定，并使现代汉语句式自然。
theological_decisions:
- issue: 智慧文学语境中σάρξ的译法
  choice: 血肉之躯
  alternative: 任何人
  rationale: 这里的σάρξ以闪语式表达泛指人，并带有人作为血肉生命的脆弱意象；正文保留该意象，脚注说明其通常所指，避免误读为保罗书信中的特定神学用法。
- issue: κρίσις在末句中的范围
  choice: 判断
  alternative: 辨别；审慎考虑
  rationale: 原词可涵盖判断、裁断与辨识。采用较宽的“判断”，不把箴言限制为某一种决策程序。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。前半句保留劳作与脚镣的强硬意象，后半句则保留原文对过度行为的限制，以呈现经文自身的张力，不加以弱化或辩护。
