review_pass:
  verdict: revise
  source_fidelity: 译文总体准确传达了命令、条件句、加重脚镣、禁止过度以及不经判断不可行事等要点。惟首句“照着适合他的”在汉语中缺少明确的中心词，未能自然承载καθὼς πρέπει αὐτῷ的“按对他合宜的方式／程度”之意。末句的“凡事都不要不经判断就去做”容易读成对“凡事”的笼统限制；改为“任何事都不可……”可更直接对应μηδέν。
  naturalness: “把他安排去做工”可理解，但“要照着适合他的”句法生硬。改为“要按适合他的方式，派他做工”符合现代标准汉语，也不擅自界定“合宜”所依据的是能力、身份或处境。“对任何血肉之躯都不可做得过分”略显拗口；以“对任何人都不可过分”作正文，并在脚注保留原文“血肉”的表达，较为自然。
  terminology: “脚镣”准确对应πέδαι；“判断”可对应κρίσις，且不预设其为司法裁判或特定属灵辨识。“任何人”在此准确表达ἐν πάσῃ σαρκί的泛指对象；脚注应说明其字面“所有血肉”，避免丢失原文的修辞形象或导入保罗式的“肉体”神学含义。
