  text: In all your works be outstanding[b][a]; do not give a blemish to your honor.
translation:
  language: zh_hans
  text: 你无论做什么，都要出类拔萃[a]；不要使自己的声誉蒙上污点[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“超越众人”或“表现卓越”。
    reason: lexical_alternative
  - marker: b
    text: “声誉”也可译作“荣誉”或“荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: 你无论做什么
  rationale: 准确表达 πᾶσι 的周全范围和 ἔργοις 的行为含义，比直译“在你一切的工作中”更符合现代汉语。
- source_word: γίνου
  choice: 要
  rationale: γίνου 是现在时命令式，在这里是对行事方式的劝勉；汉语用“要”自然表达持续性的命令或劝告。
- source_word: ὑπεράγων
  choice: 出类拔萃
  rationale: 该词表达超越、卓越之意；“出类拔萃”既自然庄重，又保留其比较性的卓越色彩。
- source_word: μὴ δῷς
  choice: 不要使……蒙上
  rationale: δίδωμι 字面为“给”，但此处与 μῶμον 构成使名誉受到玷污的表达；按汉语习惯译为“使……蒙上”，同时保留造成污损的意象。
- source_word: μῶμον
  choice: 污点
  rationale: μῶμον 可指瑕疵、污点或可责之处；“污点”能自然地与声誉搭配，并保存玷污的比喻。
- source_word: ἐν τῇ δόξῃ σου
  choice: 自己的声誉
  rationale: δόξα 在此智慧劝诫的语境中较可能指社会评价、名望或荣誉；“声誉”比“荣耀”更能避免不必要的神学化，同时保留语义空间。
