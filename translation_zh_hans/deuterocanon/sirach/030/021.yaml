  text: Do not look with your eyes and groan[a], like a eunuch embracing a young woman.
translation:
  language: zh_hans
  text: 不要看着而叹息[a]，如同太监拥抱年轻女子一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要让你的心陷入忧愁，也不要因自己的谋算折磨自己。”这里的希伯来文本以受阻愿望的鲜明画面表达其意，希腊文本则更直接地劝人不要使自己忧伤。希伯来文首句的形式也可理解为第三人称陈述：“他用眼看着，便叹息。”
    reason: alternative_reading
lexical_decisions:
- source_word: ראה בעיניו
  choice: 眼看着
  rationale: 保留希伯来文“看”与“眼睛”的视觉意味；中文“眼看着”自然凝练。结合上下文及希腊平行文本，将其按劝诫性的禁止语气处理。
- source_word: ומתאנח
  choice: 而叹息
  rationale: 该词表示因痛苦而叹气、呻吟；“叹息”既有哀苦意味，也符合庄重的现代汉语表达。
- source_word: כאשר
  choice: 就像
  rationale: 自然引出后面的明喻。
- source_word: סריס
  choice: 太监
  rationale: 此处比喻依赖其性能力受损或被剥夺的处境，不宜弱化为“宫廷官员”。
- source_word: יחבק
  choice: 搂抱
  rationale: 准确表达身体上的亲近，比“拥抱”略能体现持续抱住的画面，同时保持通俗。
- source_word: נערה
  choice: 年轻女子
  rationale: 表达成年或近成年女性的通常含义，避免“女孩”可能造成的幼龄联想，也不采用古雅的“少女”。
theological_decisions:
- issue: 希伯来文本与希腊平行文本的关系
  choice: 正文以现存希伯来文的鲜明比喻为主，并根据希腊文本和训诲语境采用第二人称禁止语气。
  alternative: 按希伯来文表面形式译作第三人称陈述：“他亲眼看见便叹息……”；或完全依据希腊文译作：“不要让你的心陷入忧愁，也不要因自己的谋算折磨自己。”
  rationale: 现存希伯来文应居首位，但其形式可理解为描述句；希腊平行文本明确呈现劝诫性的否定命令。正文保留希伯来文中“太监搂抱年轻女子”这一受阻欲望的张力，并用脚注公开两种文本形态的差异，不把差异暗中消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眼看着而叹息”保留原文略显突兀的张力；脚注说明希伯来文的人称和语气歧义，以及希腊平行文本的显著差异。
