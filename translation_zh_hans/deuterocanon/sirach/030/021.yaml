  naturalness: “不要看着而叹息，如同……一样”庄重、清楚，也比“不要眼看着而叹息”自然。将“搂抱”改为“拥抱”更符合现代书面语及原文较中性的“抱”之意。
  terminology: “太监”是现代中文圣经中通行且读者易懂的“宦官／被阉者”用语；此处保留其比喻所依赖的处境，不改作泛指的宫廷官员。“年轻女子”适切对应נערה。
