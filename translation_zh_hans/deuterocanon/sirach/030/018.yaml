  text: Delicacies poured out before a shut mouth are like an offering set before an idol[a][b].
translation:
  language: zh_hans
  text: 倾倒在紧闭的嘴前的佳肴，如同陈列在偶像前的供物。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处译作“偶像”的词带有轻蔑意味，也可译作“粪偶像”或“污秽的偶像”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本作“食物摆在坟墓旁”，不同于希伯来文的“供物陈列在偶像前”；两个文本都表达所摆之物无人享用的徒然。
    reason: textual_variant
lexical_decisions:
- source_word: טובה
  choice: 佳肴
  rationale: 结合上下文及希腊平行文本的食物意象，这里指可享用的美好食物，而非抽象的“好处”；“佳肴”自然且保留其诱人、贵重之感。
- source_word: שפוכה
  choice: 摆在
  rationale: 字面为“倾倒、倒出”，但用于食物与嘴的关系时，现代汉语译作“摆在”更自然，也清楚表达食物虽已陈设却无法享用的图景。
- source_word: על פה סתום
  choice: 在紧闭的嘴前
  rationale: “紧闭的嘴”贴近希伯来文结构，并保留不能或不肯进食的含混性；“前”使中文关系清楚自然。
- source_word: תנופה
  choice: 供物
  rationale: 该词可专指礼仪中的“摇祭”，但本句重点是献上有价值之物却不能被领受；“供物”保留祭祀背景而不过度限定具体礼仪。
- source_word: מצגת
  choice: 放在
  rationale: 表达被安置、陈列在某对象面前的状态，符合现代汉语习惯。
- source_word: לפני גלול
  choice: 在偶像前
  rationale: גלול是对偶像的蔑称；正文用清楚自然的“偶像”，其贬义色彩在脚注中说明。
theological_decisions:
- issue: 智慧比喻中的礼仪术语 תנופה
  choice: 译作较宽泛的“供物”
  alternative: 摇祭
  rationale: 本节强调徒然无效，而不是辨明某一种献祭礼仪；“供物”既保留宗教语境，也避免无根据地缩窄含义。
- issue: 带蔑义的偶像称谓 גלול
  choice: 正文译作“偶像”
  alternative: 粪偶像；污秽的偶像
  rationale: “偶像”准确标明所指，较适合庄重流畅的正文；原词刻意贬斥的语气通过脚注透明呈现。
- issue: 希伯来文与希腊文第二个比喻的差异
  choice: 正文依高可信度希伯来文，译为供物放在偶像前
  alternative: 食物摆在坟墓旁
  rationale: 指定的希伯来文为首要源文；希腊平行文本保存显著异文，宜在脚注中列明，而不在正文中调和两者。
translation_notes:
  register: 采用现代、庄重而通俗的箴言式表达。“把……摆在……前，就像……”使两幅徒然的图景清楚对应；不把“紧闭的嘴”解释为特定的身体状况，以保留原文张力。
