  yaml_path: translation/deuterocanon/sirach/030/034.yaml
  text: Put him to work while he is a child[a], and you will find rest; let his hands go idle[b], and he will seek freedom.
translation:
  language: zh_hans
  text: 趁他年幼，让他劳作，你就会得享安歇；若任由他双手闲着[a]，他就会寻求自由[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“松开他的双手”，即放松对他劳作或活动的管束。
    reason: lexical_alternative
  - marker: b
    text: 这里的“自由”指摆脱约束或管教，并非政治意义上的自由。
    reason: cultural_note
lexical_decisions:
- source_word: ἔργασαι
  choice: 要让他劳作
  rationale: 该词是ἐργάζομαι的不定过去时中间语态命令式；结合管教孩子的语境，表达使孩子参与劳动或受约束的活动。“让他劳作”既自然，也保留劝诫语气，避免“强迫他干活”所带来的过强色彩。
- source_word: ἐν παιδί
  choice: 趁他年幼
  rationale: 此处短语较为省略；结合后续阳性单数代词，最自然地表示时间，即在他还是孩子的时候。“趁他年幼”简洁地传达这一时间含义。
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: 你就会得到安歇
  rationale: ἀνάπαυσις可指安歇、休息或宽慰。“得到安歇”贴近希腊文，也保留智慧格言中前因后果的表达。
- source_word: ἄνες
  choice: 任……闲着
  rationale: ἄνες来自ἀνίημι，可表示松开、放松或听任。这里与“他的双手”连用，并处于劳动与管教的语境中，“任……闲着”传达放松约束、停止使其劳作的实际含义；脚注保留更贴近字面的译法。
- source_word: χεῖρας αὐτῷ
  choice: 他的双手
  rationale: 保留希腊文复数“手”，同时汉语中“双手”可自然地转指人的劳动和活动。
- source_word: ζητήσει ἐλευθερίαν
  choice: 他就会寻求自由
  rationale: ἐλευθερία的基本义是自由。直译可保留原文措辞及其可能张力；脚注说明此处语境所指并非政治自由，而是摆脱约束或管教。
theological_decisions:
- issue: 智慧教导中παιδί及阳性单数指代的伦理表述
  choice: 保留阳性单数，译作“他”
  alternative: 泛指为“孩子”并避免性别指代
  rationale: 希腊文以单数παιδί配合阳性单数αὐτῷ，后一句的隐含主语也是单数。译文保留原文的单数阳性表达，不将其擅自中性化。
- issue: ἐλευθερίαν在管教语境中的含义
  choice: 正文保留“自由”，以脚注说明其语境含义
  alternative: 意译为“摆脱管束”或“任性妄为”
  rationale: “自由”是该希腊词的直接含义；正文保留这一用词，可避免把语境含义过度解释为道德定性，同时通过脚注帮助读者理解这里谈的是挣脱约束。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“趁他年幼……若……”保持格言式的平衡结构；“劳作”“安歇”略带典雅色彩，但普通读者能够理解。脚注标记均置于对应词语之后，并纠正咨询层中脚注内容与标记位置不相符的问题。
