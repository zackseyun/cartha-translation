base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/011.yaml
  text: Do not give him free rein in his youth, and do not overlook his destructive behavior.
translation:
  language: zh_hans
  text: 不要让他在年少时任意作主[a]，也不要姑息他的败坏行为[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要让他在年少时掌权。”希伯来语动词可指使人掌权或把权柄交给人；希腊文平行文本作“不要在他年少时给他权柄”。
    reason: lexical_alternative
  - marker: b
    text: “败坏行为”也可译作“败坏”“过错”或“有害的行为”。所译为“姑息”的希伯来语动词也可指容忍或放过；这里指不应对他的过错置之不理。
    reason: lexical_alternative
lexical_decisions:
- source_word: תמשילהו
  choice: 让他……任意作主
  rationale: 该词是 משל 的使役形，可指“使其掌权”或“把权柄交给他”。结合父母管教年少者的语境，“任意作主”自然表达不让他拥有不受约束的自主权；希腊文 ἐξουσίαν（权柄、权限）也支持这一理解。
- source_word: בנעוריו
  choice: 年少时
  rationale: 直接表达“在他的青年时期”，简洁而符合现代汉语习惯。
- source_word: תשא
  choice: 姑息
  rationale: נשא 的基本义包括“举起、承担”，也可引申为容忍、放过或赦免。此处以过失或败坏行为为宾语，在管教语境中译作“姑息”较为贴切，同时避免使用带有较强神学色彩的“赦免”。
- source_word: לשחיתותיו
  choice: 他的败坏行为
  rationale: שחיתות 可涉及败坏、毁坏或有害的行为。这里指年少者应受纠正的恶劣言行；“败坏行为”既保留道德与破坏性的含义，也比单译“过错”更充分。
theological_decisions:
- issue: תשא 是否译为“赦免”
  choice: 姑息
  alternative: 赦免、容忍、放过
  rationale: 原词具有多重含义，但上下文谈的是对年少者的管教，而非神学意义上的罪得赦免；因此采用“姑息”，并在注释中保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“任意作主”传达不受约束的自主权，“姑息”符合家庭管教的语境。两个脚注分别保留“掌权／权柄”以及“败坏／过错、容忍／赦免”的词义张力。
