  text: Fodder and a rod and burdens are for a donkey[c][b][a]; bread and discipline and work are for a servant.
translation:
  language: zh_hans
  text: 饲料、杖和重担[a]是给驴的；饼、管教[b]和劳作是给家奴[c]的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “重担”也可译作“驮载的货物”。
    reason: lexical_alternative
  - marker: b
    text: “管教”也可理解为“训练”或“纠正”。
    reason: lexical_alternative
  - marker: c
    text: “家奴”也可译作“仆人”或“家仆”；希腊语 οἰκέτης 常指家中的奴仆。
    reason: alternative_reading
lexical_decisions:
- source_word: χορτάσματα
  choice: 饲料
  rationale: 指供牲畜食用、使其吃饱的草料或饲料；“饲料”是现代汉语中自然且具体的表达。
- source_word: ῥάβδος
  choice: 杖
  rationale: 此处指用于驱策或惩戒的棍杖。“杖”简洁地保留了箴言中的管束意象。
- source_word: φορτία
  choice: 重担
  rationale: 该词指所搬运、承载之物；“重担”既表达驴所驮的载荷，也保留原文的沉重感。
- source_word: ὄνῳ
  choice: 驴
  rationale: 准确、通行的现代汉语名称。
- source_word: ἄρτος
  choice: 饼
  rationale: 原词具体指饼或面包；在古代语境中“饼”比泛化为“食物”更贴近原文，也更自然。
- source_word: παιδεία
  choice: 管教
  rationale: 该词可涵盖教养、训练、纠正和惩戒；本节与劳作并列，语境突出对从属者的约束，因此译作“管教”，同时以脚注保留较宽含义。
- source_word: ἔργον
  choice: 劳作
  rationale: 表示工作或劳动；“劳作”符合被要求从事劳动的语境，并保持箴言的凝练节奏。
- source_word: οἰκέτῃ
  choice: 家奴
  rationale: οἰκέτης通常指家中的仆役，且往往具有受奴役的身份。本节的管教与强制劳作使这种从属地位较为突出；“家奴”比“仆人”更透明地反映历史社会现实。
theological_decisions:
- issue: οἰκέτῃ所表示的家庭从属身份
  choice: 家奴
  alternative: 仆人；家仆
  rationale: 原词既可泛指家庭仆役，也常指家内奴隶。这里与饼、管教和劳作并列，受支配的身份较为显著，因此正文采用“家奴”，脚注保留较柔和但可能较宽泛的译法。
- issue: παιδεία在本节中的意义范围
  choice: 管教
  alternative: 训练；教导；纠正
  rationale: 原词兼有教育、训练和纠正的意义。上下文偏向约束和纠正，但不宜把它缩窄为单纯惩罚，因此用“管教”并以脚注说明其他可能含义。
translation_notes:
  register: 采用简洁、对称的箴言体，保留原文两个三项并列结构。“饼”体现古代基本口粮，“家奴”明确历史身份而不作现代伦理上的淡化或辩护。
