base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/015.yaml
  text: By the faithfulness of his mouth he was sought out as a seer[c][b][a], and also by his word he was found faithful as a shepherd.
translation:
  language: zh_hans
  text: 因他口中所言的信实[a]，人们求问他这位先见[b]；他也凭自己的话，被认定为忠信的牧人。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因他口中的信心”；但希伯来语在这里更自然地指他言语的信实或可靠。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本作“先知”；希伯来文本作“先见”。
    reason: alternative_reading
  - marker: c
    text: 希伯来语第二句十分简练，也可理解为：他作为牧人，因自己的话显为忠信。
    reason: textual_ambiguity
lexical_decisions:
- source_word: באמונת פיו
  choice: 因他口中的信实
  rationale: אֱמוּנָה在这里与“他的口”连用，主要指言语的可靠、忠实，而非内在信念；保留“口”的希伯来语意象。介词ב可按语境表达为“因”或“凭”。
- source_word: דרוש
  choice: 人们求问他
  rationale: דרש在此具有“寻求、求问、请教”的意思。希伯来语形式简练，以不定主语“人们”将其自然地译成现代汉语，同时保留他作为受求问者的含义。
- source_word: חזה
  choice: 先见
  rationale: 该词指见异象者、先见；比“先知”更贴近现存希伯来文本的具体称谓。
- source_word: וגם בדברו
  choice: 他也凭自己的话
  rationale: 保留וגם的递进附加意味，并使“话”与前句的“口”形成平行。בדברו也可理解为“在他的话语上”。
- source_word: נאמן
  choice: 被认定为忠信的
  rationale: נאמן意为忠信、可靠。补出“被认定为”以表达压缩句法，也与希腊语“被知道是忠信的”相呼应，但不把这一补足视为唯一可能。
- source_word: רועה
  choice: 牧人
  rationale: 保留希伯来语的牧人意象，不直接释为领袖。
theological_decisions:
- issue: אמונה在“他的口”这一搭配中的含义
  choice: 信实
  alternative: 信心；可靠
  rationale: 上下文称赞撒母耳言语可信，因此“信实”较符合希伯来语搭配；脚注保留“信心”这一形式上可能的理解。
- issue: חזה与希腊语προφήτης的差异
  choice: 先见
  alternative: 先知
  rationale: 以现存希伯来文本为主，保留其较具体的称谓；希腊语异读在脚注中说明。
- issue: 第二分句的压缩句法
  choice: 他被认定为忠信的牧人
  alternative: 牧人在他的话语上忠信；他作为牧人是忠信的
  rationale: 希伯来语省略了明确的系词和认定动词。正文采用顺畅且有希腊语平行支持的理解，脚注明确句法并不完全确定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“先见”保留古代职分的专门色彩，“牧人”保留原文隐喻。通过“人们求问他”和“被认定为”补足汉语所需句法，同时用脚注明示原文的压缩与歧义。
