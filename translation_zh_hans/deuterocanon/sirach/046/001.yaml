base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/001.yaml
  text: Joshua son of Nun was a mighty warrior[a], Moses’ attendant in prophecy[b]; he was appointed in his days to be a great salvation for his chosen ones.
translation:
  language: zh_hans
  text: 嫩的儿子约书亚是英勇的战士，在预言方面作摩西的侍从[a]；他在自己的时代被造就，要成为给他所拣选之人的极大拯救[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作“摩西在预言之事上的继承人”，比现存希伯来语更明确地表达承继关系。
    reason: alternative_reading
  - marker: b
    text: “拯救”也可译作“解救”或“大胜”；希伯来语 תשועה 和希腊语 σωτηρία 既可用于军事得胜，也可表达更广泛的救助。
    reason: lexical_alternative
lexical_decisions:
- source_word: גבור בן חיל
  choice: 英勇的战士
  rationale: 这是强调勇力与战斗能力的希伯来语叠合表达；希腊语平行文本“在战争中强大”也支持军事含义。
- source_word: משרת משה
  choice: 摩西……的侍从
  rationale: משרת指以正式身份服侍、协助他人的人；“侍从”自然地表达约书亚对摩西的辅助角色，又避免后世宗教职衔的联想。
- source_word: בנבואה
  choice: 在预言之事上
  rationale: 原文短促且含义不完全明确，可能指预言的领域、职分或承继关系；此译保留其开放性。
- source_word: אשר נוצר
  choice: 他被塑造成
  rationale: 紧随希伯来语被动形式“被形成、被塑造”，并容许其中含有为特定使命而受预备的意味，而不直接改译为“被任命”。
- source_word: להיות בימיו
  choice: 在自己的时代……带来
  rationale: 以自然汉语表达时间范围及其使命；“自己的”依语境指约书亚的时代。
- source_word: תשועה גדולה
  choice: 极大的拯救
  rationale: תשועה兼有拯救、解救和得胜之义；“拯救”保留较广的语义范围，脚注说明军事语境中的其他可能。
- source_word: לבחיריו
  choice: 为上帝所拣选的人
  rationale: 代词后缀直译为“他所拣选的人”，所指很可能是上帝；汉语若直译容易误解为约书亚所拣选的人，因此正文按最可能的指向明示上帝，同时承认原文语法上只写“他的”。
theological_decisions:
- issue: 约书亚与摩西在“预言”方面的关系
  choice: 保留“摩西在预言之事上的侍从”这一紧凑且略带张力的表述
  alternative: 摩西在预言职分上的继承人
  rationale: 希腊语平行文本明确说“继承人”，但现存希伯来语是“摩西的侍从”；正文以希伯来语为先，不把承继关系强化为唯一解释。
- issue: תשועה的范围
  choice: 译作“拯救”
  alternative: 解救；大胜
  rationale: 本节背景具有军事色彩，但希伯来词及希腊语σωτηρία都不只限于战场胜利；“拯救”兼顾历史性解救和较宽广的救助含义。
- issue: לבחיריו中代词所指
  choice: 正文译为“上帝所拣选的人”
  alternative: 他所拣选的人
  rationale: 最自然的神学与上下文指向是上帝的选民；然而希伯来语仅有第三人称后缀，故在说明中保留形式上的歧义。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“嫩的儿子约书亚”沿用现代中文圣经读者熟悉的人名表达；句式保留原文赞颂人物的凝练风格。所有脚注标记均置于相关正文之后。
