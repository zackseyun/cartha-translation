base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/011.yaml
  text: And the judges, each by his own name—everyone whose heart was not led astray and who did not turn away from God—may their memory be for blessing.
translation:
  language: zh_hans
  text: 至于众士师，各按其名；凡心不曾走迷[a]、也不曾背离上帝[b]的，愿他们的记念蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“凡没有举起自己的心”，可能指心里自高；希腊文平行本作“其心没有行淫”，即没有不忠而走迷。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“没有背离主”；现存希伯来文作“没有背离上帝”。
    reason: alternative_reading
lexical_decisions:
- source_word: והשופטים
  choice: 至于众士师
  rationale: שופטים在本段历史语境中指以色列士师时期的领袖；译作“士师”既准确，也与希腊文οἱ κριταί相符。“至于”自然承接人物颂赞的列举。
- source_word: איש בשמו
  choice: 要一一提起他们的名字
  rationale: 原文直译近于“各按自己的名字”，意思是逐一具名纪念这些士师；此译保留个别记念的重点，同时符合现代汉语表达。
- source_word: כל אשר לא נשא לבו
  choice: 凡心没有偏离
  rationale: 现存希伯来文直译为“凡没有举起自己的心”，语义简约而可能涉及高傲；希腊文平行本则作“其心没有行淫／背离”，在下句“没有转身离开上帝”的平行关系中，较可能表达内心没有偏离盟约忠诚。正文采用较中性的“偏离”，不把希腊文隐喻过度明说，并以脚注保留希伯来文字面措辞。
- source_word: ולא נסוג מאחרי אל
  choice: 也没有转身离开上帝
  rationale: נסוג מאחרי表示从跟随某位者的道路上退后或转离。希伯来文读אל“上帝”，故正文依主要见证翻译；希腊文的“主”列入脚注。
- source_word: יהי זכרם לברכה
  choice: 愿他们的名声蒙人祝福
  rationale: 此处זכרם是他们留下、受人记念的名声；לברכה是“成为／归于祝福”。译文以自然汉语表达愿后人以祝福称颂他们的祈愿，同时避免把“记忆”误解为人的心理能力。
theological_decisions:
- issue: “心”这一分句的含义
  choice: 凡心没有偏离
  alternative: 凡没有举起自己的心／凡心没有骄傲；凡心没有行淫背离
  rationale: 希伯来文本身保留“举心”的含混性，希腊文却明确指向属灵背离。结合下一平行分句，正文采用涵盖性较强的“偏离”，但不抹去文本差异，故在脚注中交代两种见证。
- issue: “没有转身离开……”中的神圣称谓
  choice: 上帝
  alternative: 主
  rationale: 主要希伯来文见证作אל“上帝”，希腊文平行本作Κυρίου“主”。正文遵从现存希伯来文，脚注保留希腊文异读。
- issue: 末句祝愿的对象与含义
  choice: 愿他们的名声蒙人祝福
  alternative: 愿对他们的记念成为祝福／愿他们的记念蒙福
  rationale: 希伯来习语可理解为愿他们被人以祝福记念。所选译法保持祈愿语气，并明确指向他们身后的声誉，而不引入有关死后状态的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“士师”保留本段历史称谓；以冒号组织希伯来文的列举和祝愿关系。脚注标记[a][b]置于整句相关内容之后，正文中的两个标记均与脚注对应。
