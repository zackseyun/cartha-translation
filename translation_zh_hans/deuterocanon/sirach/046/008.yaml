base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/008.yaml
  text: Therefore those two also were spared[a], out of six hundred thousand foot soldiers, to bring them into an inheritance[b], into a land flowing with milk and honey.
translation:
  language: zh_hans
  text: 因此，这两个人也从六十万步兵中存留下来[a]，得以进入承受之地，就是流奶与蜜之地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “存留下来”：希伯来文原句含义困难，直译近于“在年岁中得以保全”，可能指他们历经多年仍蒙保全，或活到年老。希腊文则较简明地作：“他们两个人得救了。”
    reason: textual_variant
  - marker: b
    text: “得以进入承受之地，就是流奶与蜜之地”见于希腊文平行文本；现存希伯来文本在此较短。
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: 因此
  rationale: 承接上文他们平息烈怒、止住恶言之事，清楚保留因果关系。
- source_word: גם הם
  choice: 这两个人也
  rationale: 所指是前文的约书亚和迦勒；希腊文 καὶ αὐτοὶ δύο 也明确说是“两个人”。
- source_word: בשנים נאצלו
  choice: 存留下来
  rationale: 希伯来语 בשנים 含义困难，可能指历经多年或存留至年老；正文用“存留下来”表达免于灭亡，同时不武断限定其时间含义，并以脚注说明疑义。
- source_word: משש מאות אלף רגלי
  choice: 从六十万步兵中
  rationale: רגלי 指徒步者，在此人口及军事语境中译作“步兵”自然明确；希腊文 πεζῶν 亦支持这一理解。
- source_word: εἰσαγαγεῖν αὐτοὺς εἰς κληρονομίαν
  choice: 好带他们进入产业
  rationale: 此句见于希腊文平行文本，补足现存希伯来文本较短的句意；“产业”保留应许之地作为承受之业的圣经语义。
- source_word: εἰς γῆν ῥέουσαν γάλα καὶ μέλι
  choice: 进入流奶与蜜之地
  rationale: 忠实保留希腊文以及圣经中对那应许之地的固定意象。
theological_decisions:
- issue: 是否用希腊文平行文本补足较短且有疑难的希伯来文本
  choice: 以现存希伯来文为主体，并纳入希腊文所保存的后半句“好带他们进入产业，进入流奶与蜜之地”。
  alternative: 只译现存希伯来文：“因此，这两个人也从六十万步兵中存留下来。”
  rationale: 希伯来文在本节仍是首要依据，但其文本较短，且 בשנים 难解；希腊文的续句符合约书亚和迦勒存活并进入应许之地的上下文，同时脚注明示其文本来源，避免掩盖见证差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“存留下来”避免生硬照搬疑难希伯来语，同时保留“蒙保全、未与众人一同灭亡”的意义；“产业”和“流奶与蜜之地”维持圣经语域。
