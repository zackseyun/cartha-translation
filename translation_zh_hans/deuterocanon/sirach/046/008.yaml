  source_fidelity: “因此，这两个人也从六十万步兵中存留下来”准确反映希伯来文的因果、两人和从六十万徒步军士中得以保全；对难解的“在年岁中”以脚注保留说明也可接受。可是，希腊文补足部分的“带他们进入”在中文中容易使“两个人”成为带领以色列人进入土地的施事，而希腊文此处所表达的是这两人得以进入承受之地。
  naturalness: 正文整体庄重自然。“进入产业”在现代汉语中略显生硬，且“产业”通常指财产或产业；在此上下文译为“承受之地”更自然，也清楚指向下句的土地。
  terminology: “流奶与蜜之地”是恰当且通行的圣经表达。“承受之地”保留 κληρονομία 的承受/产业意涵，并避免把这两人误译为带领者。
