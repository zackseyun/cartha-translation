- from: 因此，这两个人也从六十万步兵中存留下来[a]，好带他们进入产业[b]，进入流奶与蜜之地。
  to: 因此，这两个人也从六十万步兵中存留下来[a]，得以进入承受之地，就是流奶与蜜之地[b]。
  rationale: 将希腊文补足句改为“得以进入承受之地”，消除“两个人带领他们”的中文歧义，并以“就是”表明承受之地与流奶与蜜之地的同位关系。其余译文及脚注 a 均可保留，既遵循希伯来文主文本，也明示希腊文所保存的续句。
