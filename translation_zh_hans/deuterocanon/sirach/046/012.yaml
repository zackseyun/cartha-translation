  yaml_path: translation/deuterocanon/sirach/046/012.yaml
  text: May their bones blossom like a lily[c][b][a], and may their name be renewed in their sons.
translation:
  language: zh_hans
  text: 愿他们的骸骨如百合花般绽放[a][b]；愿他们的名在他们的儿子中得以更新[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“如百合花般”；这个花名也有译作“玫瑰”的，但“百合花”较为可能。
    reason: lexical_alternative
  - marker: b
    text: 希腊语平行文本在“他们的骸骨绽放”之后另有“从他们所在之处”；现存希伯来文本没有这几个字。
    reason: alternative_reading
  - marker: c
    text: 或译：“愿他们的名由他们的儿子承续。”原文动词可含更新、更替或承续之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: תפרחנה
  choice: 绽放
  rationale: 该词源自 פרח，表示发芽、开花；“绽放”保留了原文鲜明的花卉意象，也自然表达此处的祈愿语气。
- source_word: עצמותם
  choice: 他们的骸骨
  rationale: 原文直译为“他们的骨头”；“骸骨”既保留具体所指，又符合中文庄重的纪念语境，并与希腊语平行文本 τὰ ὀστᾶ αὐτῶν 一致。
- source_word: כשושנה
  choice: 如百合花般
  rationale: שושנה 较可能指百合花；虽有译作“玫瑰”的传统，但“百合花”更符合该词在圣经及后期希伯来语中的通常含义。
- source_word: ושמם
  choice: 他们的名
  rationale: 保留原文“名”的圣经惯用表达，使其同时包含姓名、声名和纪念的意味，而不将含义限缩为“名声”。
- source_word: תחליף
  choice: 得以更新
  rationale: חלף 可表示更新、更替或承续；“得以更新”保留其语义张力，表达他们的名在下一代中继续存留，又不把它单纯解释为替代。
- source_word: לבניהם
  choice: 在儿子们身上
  rationale: 原文明确使用阳性复数“儿子”；此译法保留性别所指，并自然表达名字在后代身上的承续。
theological_decisions:
- issue: 后代称谓的性别特指
  choice: 儿子们
  alternative: 儿女；后代
  rationale: 希伯来文 בניהם 明确意为“他们的儿子”。保留这一特指，避免在没有文本依据时将其扩展为所有子女或后代。
- issue: 骸骨开花的纪念与复兴意象
  choice: 按希伯来文本译为“骸骨如百合花般绽放”
  alternative: 加入希腊语平行文本的“从他们所在之处”
  rationale: 希伯来文本本身呈现花朵绽放的意象，却没有“从他们所在之处”。正文不补入希腊语成分，以免把平行文本的阐释写进主文；同时也不把这一诗意意象限定为某种特定的复活教义。
- issue: 名字在儿子身上的延续方式
  choice: 得以更新
  alternative: 传给儿子们；由儿子们承续
  rationale: 原动词兼有更新、更替和承续的可能。“得以更新”保存这种含混性，不把经文完全化约为家族姓名的传递。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“骸骨”“绽放”保留诗歌的具体意象；分号呈现两个平行祈愿句。正文以希伯来文本为首要依据，希腊语差异仅置于脚注。
