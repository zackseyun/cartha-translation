  text: so that all the offspring of Jacob may know that it is good to fully follow Yahweh[a][b].
translation:
  language: zh_hans
  text: 好叫雅各的一切后裔都知道，全然跟从耶和华是美好的[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作“以色列众子”，而不是“雅各的一切后裔”。
    reason: alternative_reading
  - marker: b
    text: 这里译作“全然跟从”的希伯来语措辞较为少见；希腊语平行文本支持“跟在主后面行走”的意思。
    reason: textual_variant
lexical_decisions:
- source_word: למען דעת
  choice: 好叫……都知道
  rationale: למען引出目的或结果，דעת在此依句法表达“知道”；“好叫”自然保留目的意味。
- source_word: כל זרע יעקב
  choice: 雅各所有的后裔
  rationale: זרע本义为“种子”，用于家族群体时指后裔；译作“后裔”既清楚又保留其集体含义，并按主要希伯来文本保留“雅各”。
- source_word: כי טוב
  choice: 是美好的
  rationale: כי在这里引出所知道的内容，טוב作评价；“是美好的”比单说“是好的”更庄重自然。
- source_word: למלא אחרי
  choice: 专心跟从
  rationale: 该希伯来措辞较不寻常；מלא带有充分、完全之意，而אחרי表达“在……之后”。“专心跟从”兼顾全然投入和跟随的意象，不把它简化成抽象的“顺服”。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名表达四字神名，避免与普通称谓“主”混同。
theological_decisions:
- issue: 后裔称谓采用希伯来文本的“雅各”还是希腊平行文本的“以色列”
  choice: 雅各所有的后裔
  alternative: 以色列众子
  rationale: 现存希伯来文本是此处的主要依据，读作“雅各所有的后裔”；希腊平行文本的差异具有文本意义，故列入脚注而不在正文中调和。
- issue: 如何表达למלא אחרי所指的跟随与忠诚
  choice: 专心跟从耶和华
  alternative: 跟在主后面行走／全然顺服耶和华
  rationale: 希伯来语短语在此不寻常，希腊语πορεύεσθαι ὀπίσω支持“行在……之后、跟从”的方向性意象；“专心”体现מלא的充分意味，同时避免将其过度解释为纯粹抽象的顺服。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“好叫”保留目的从句的经文语体；“专心跟从”兼顾希伯来语的充分意味和希腊平行文本所保存的跟随意象。
