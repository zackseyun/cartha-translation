  source_fidelity: 正文忠实呈现了现存希伯来文的主要内容，也恰当地以脚注说明其压缩且略不确定的措辞。不过，按本段既定的英文本审计处理与项目所述的希伯来文—希腊文并用原则，希腊平行文本所保存的两个目的分句应当透明地纳入正文；现稿仅置于脚注，未能反映该已采纳的文本处理。
  naturalness: “全心跟随上帝”“显出忠诚”“挺身而立”均属自然、庄重的现代标准汉语。“在会众背叛时”可理解，但若采用希腊文所见的对抗性动作，改作“抵制会众的叛乱”可更清楚地表达“挺身而立”的方向性。
  terminology: “上帝”“摩西”“迦勒”“耶孚尼”及“忠诚”的选择一致且合宜。“阻止百姓犯罪”“平息邪恶的怨言”能分别清楚传达希腊文的目的分句及其负面评价；“怨言”符合旷野叛逆语境，且不额外施加教派性解释。
  issues:
