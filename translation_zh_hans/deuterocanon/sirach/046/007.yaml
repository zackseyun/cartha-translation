revisions:
- from: 他也因全心跟随上帝，在摩西的日子显出忠诚——他和耶孚尼的儿子迦勒——在会众背叛时挺身而立[a]。
  to: 他又因全心跟随上帝，在摩西的日子显出忠诚；他和耶孚尼的儿子迦勒一同，挺身抵制会众的叛乱，阻止百姓犯罪，并平息邪恶的怨言[a]。
  rationale: 修订保留现稿对希伯来文核心措辞的自然译法，并按照既定审计轨迹，将希腊平行文本中可能保存较完整内容的两个目的分句纳入正文。脚注明确说明：希伯来文没有明说“敌人”，且其措辞压缩；因此正文未把“敌人”直接并入，而以“会众的叛乱”表达希伯来文所见的语境，同时让读者知悉希腊文异读。
