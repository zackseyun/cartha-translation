base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/007.yaml
  text: Also[a], because he fully followed God, and in the days of Moses showed loyalty—he and Caleb son of Jephunneh—by standing firm against the assembly's rebellion, to keep the people from sin and to silence wicked grumbling.
translation:
  language: zh_hans
  text: 他又因全心跟随上帝，在摩西的日子显出忠诚；他和耶孚尼的儿子迦勒一同，挺身抵制会众的叛乱，阻止百姓犯罪，并平息邪恶的怨言[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于：“他和耶孚尼的儿子迦勒，在会众放纵（或背叛）时挺身而立。”这句话措辞简略，含义略有不确定。希腊文较长，作：“起来抵挡敌人，阻止百姓犯罪，并平息邪恶的怨言。”正文以希伯来文的“会众”及其叛乱意象为主，并采用希腊文所保存的两个目的分句。
    reason: 说明压缩的希伯来文与较长的希腊平行文本之间的差异，并透明标示正文对希腊文目的分句的采用。
lexical_decisions:
- source_word: מלא אחרי אל
  choice: 全心跟随上帝
  rationale: 这是表示完全、专一跟随的希伯来语习语；译作“全心跟随”既自然，也保留其忠贞投入的含义。
- source_word: עשה חסד
  choice: 显出忠诚
  rationale: חסד 可指怜悯、慈爱或忠诚；这里叙述约书亚与迦勒在摩西时代忠贞行事，语境较支持“忠诚”。
- source_word: להתיצב
  choice: 挺身而立
  rationale: 兼顾其字面上的站立与面对群体叛乱时坚定抗衡的行动意味。
- source_word: בפרע קהל
  choice: 在会众背叛时
  rationale: 原文措辞压缩且文本对应不完全明确；此译尽量贴近现存希伯来文，不把希腊文的“敌人”直接写入正文。
- source_word: Χαλέβ υἱὸς Ἰεφοννή / כלב בן יפנה
  choice: 耶孚尼的儿子迦勒
  rationale: 采用现代中文圣经读者较熟悉的人名形式，并保留父名关系。
theological_decisions:
- issue: 是否把希腊文所独有的两个目的从句补入正文
  choice: 正文依现存希伯来文止于“挺身而立”，以脚注交代希腊文较长读法
  alternative: 在正文补入“阻止百姓犯罪，并平息邪恶的怨言”
  rationale: 希伯来文在此虽压缩且有轻微文本不合，却并非完全缺失。为避免把希腊文扩展无标记地并入正文，正文以希伯来文为主，并在脚注透明保存希腊平行文本的证据。
- issue: חסד / ἔλεος 的语义
  choice: 忠诚
  alternative: 怜悯
  rationale: 两个词都容许“怜悯”义，但本节重在约书亚和迦勒面对背叛仍忠心，故正文用“忠诚”，同时不否认其词义范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“挺身而立”保留行动感；破折号呈现原句插入“他和迦勒”的结构。正文中的脚注标记与脚注完全对应。
