  text: Was it not by his hand that the sun stood still[b][a], and one day was like two?
translation:
  language: zh_hans
  text: 太阳岂不是在他手中停住了[a]，一日如同两日[b]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里影射约书亚得胜时太阳停住的传统；参《约书亚记》10:12–14。
    reason: cross_reference
  - marker: b
    text: 希伯来文末句直译为“一日如同两个”，其中末尾的“日”由上下文补足。
    reason: lexical_alternative
lexical_decisions:
- source_word: הלא
  choice: 岂不是……吗
  rationale: 表达期待肯定回答的反问语气，既保留强调意味，也符合现代汉语习惯。
- source_word: בידו
  choice: 借着他的手
  rationale: 保留希伯来语“手”的具体意象，同时清楚表达凭借他而成就的施事含义。
- source_word: עמד
  choice: 停住了
  rationale: 该动词本义为“站立、停住”；用于太阳并结合上下文，指其运行停止。希腊语平行文本也支持“受阻、停住”的意思。
- source_word: השמש
  choice: 太阳
  rationale: 直接对应原文。
- source_word: יום אחד
  choice: 一日
  rationale: 直接而凝练地对应原文“一日”，并保持颂赞诗体的庄重语域。
- source_word: כשנים היה
  choice: 如同两日
  rationale: 原文直译为“像两个”，其中“日”由上文省略而可明确补出；用“如同两日”在汉语中自然，并保留一天延长得仿佛两天的表达。
theological_decisions:
- issue: 约书亚与太阳停住的神迹语言
  choice: 按经文的正面陈述翻译为太阳停住、一日如同两日，不将其自然化解释。
  alternative: 将其理解并译作军事胜利或日照延长的诗意夸张。
  rationale: 希伯来文本与希腊语平行文本都直接描述太阳停止或受阻。译文应保留颂诗本身的主张及其神学张力，而不在翻译中把它改释为比喻。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“岂不是……吗”保留原文反问句式；“借着他的手”兼顾希伯来语意象与汉语可读性。
