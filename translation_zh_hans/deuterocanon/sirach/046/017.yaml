base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/017.yaml
  text: In a mighty crash his voice was heard[a], and the leaders of the foe were subdued[c][b], and all the rulers of the Philistines perished.
translation:
  language: zh_hans
  text: 在一阵震天巨响中，听见了他的声音[a]；敌方的首领[b]被制伏，非利士人的所有统治者[c]都灭亡了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“在一阵大响中”；希腊语平行文本说得更明确：“上主从天上打雷，以巨大的声响使他的声音被听见。”
    reason: alternative_reading
  - marker: b
    text: “首领”也可译作“驻军将领”或“敌方的驻防据点”，因为希伯来语 נציב 既可指官长，也可指驻守者或驻防设施。
    reason: lexical_alternative
  - marker: c
    text: 这里的希伯来语称号 סרנים 是非利士统治者的专称，也可译作“非利士众首领”。
    reason: cross_reference
lexical_decisions:
- source_word: בפרע אדיר
  choice: 一声震天巨响中
  rationale: 希伯来语短语的词形和确切含义较难确定，但结合上下文及希腊语平行文本，所指是一种强烈而宏大的声响。“震天巨响”保留其力度，又不把希伯来语直接限定为“雷鸣”。
- source_word: נשמע קולו
  choice: 他的声音传来
  rationale: 以现代汉语自然表达“他的声音被听见”，保留声音可闻的重点；代词所指依上下文理解为上主。
- source_word: ויכנע
  choice: 被制伏
  rationale: 该动词可表达降卑、屈服或制伏；军事语境中“被制伏”自然，也不必在汉语正文中补出未明说的施事者。
- source_word: נציבי צר
  choice: 敌方的首领
  rationale: נציב 可指官长、首领，也可指驻军或据点。与下句非利士统治者构成诗体平行时，取人物意义较合适；צר 按集合意义译作“敌方”。
- source_word: ויאבד
  choice: 都灭亡了
  rationale: 采用不及物表达，突出非利士统治者的结局，同时避免强行补出施事者。
- source_word: סרני פלשתים
  choice: 非利士所有的统治者
  rationale: סרנים 是《撒母耳记》中非利士城邦领袖的专称；“统治者”在现代汉语中清楚庄重，也避免“主”可能造成的神学歧义。
theological_decisions:
- issue: “他的声音”所指为何
  choice: 依上下文指上帝的声音，但正文保留希伯来语的代词表达
  alternative: 可较间接地理解为借着撒母耳的祷告或行动发出的声音
  rationale: 希腊语平行文本明确说上主从天上打雷，使自己的声音被听见；本节上下文也记述撒母耳呼求上主攻击仇敌。不过希伯来语正文只用代词，因此译文不直接增补“上主”。
- issue: 制伏与灭亡的施事者
  choice: 用“被制伏”和“灭亡了”，不明说施事者
  alternative: 译作“他制伏了……又消灭了……”
  rationale: 无元音希伯来文本的动词形态容许不同分析；采用不补施事者的汉语表达，可保留原文的简洁和一定程度的语法张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号呈现希伯来诗句的并列推进；“震天巨响”传达强烈声势，但脚注保留希伯来语难词及希腊语平行文本更明确的“打雷”读法。
