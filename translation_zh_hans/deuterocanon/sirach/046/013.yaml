base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/013.yaml
  text: Beloved by his people and pleasing to his Maker[a], asked for from his mother's womb, Samuel, a Nazirite of the Lord in prophecy, judged and served as priest; by the word of God he established the kingdom, and anointed rulers over his people.
translation:
  language: zh_hans
  text: 撒母耳深受本族人民爱戴，为造他的主所喜悦；他自母腹中便是被求得的。[a] 他在预言中作雅威的拿细耳人，又作审判官，又担任祭司。他凭上帝的话建立王国，膏立领袖治理百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“撒母耳蒙他的主所爱，是主的先知；他建立了王国，膏立领袖治理他的百姓。”希伯来文则说他“在预言中作雅威的拿细耳人”，并补充他“作审判官，又担任祭司”。
    reason: 说明希伯来文本与希腊文平行见证在开头称誉、先知身份及审判和祭司职能上的异文；希腊文亦明确作“他的百姓”，而希伯来文此处未带该代词。
lexical_decisions:
- source_word: אוהב עמו ורצוי עושהו
  choice: 深受本族人民爱戴，蒙造他的主喜悦
  rationale: אוהב在此按受爱戴的意义理解；עושהו直译为“造他的那一位”，用“造他的主”既保留创造者之意，也使现代汉语自然庄重。
- source_word: המשואל מבטן אמו
  choice: 他从母腹中就是求来的
  rationale: 保留שאל“求、求得”与“撒母耳”名字叙事之间的呼应；“从母腹中”忠实呈现原文的时间性表达，而不额外解释哈拿许愿的背景。
- source_word: נזיר יהוה
  choice: 雅威的拿细耳人
  rationale: נזיר在撒母耳的语境中带有终身分别归神的专门宗教含义；采用“拿细耳人”比泛化为“奉献者”更能保留这一礼仪与神学色彩。יהוה译作“雅威”。
- source_word: בנבואה
  choice: 在预言中
  rationale: 原文介词ב与“预言”构成简洁而略含歧义的表达；直译“在预言中”保留这种张力，避免径自改写成确定的职衔“先知”。
- source_word: שופט ומכהן
  choice: 又作审判官，又担任祭司
  rationale: שופט可指执行审判并治理的人；כהן在动词形态下表示履行祭司职务，因此译作“担任祭司”，不只陈述身份。
- source_word: בדבר אל
  choice: 凭上帝的话
  rationale: 介词ב可表达凭借或依据；此译保留撒母耳建立王国乃出于神话语的授权与施行。
- source_word: הכין ממלכת
  choice: 建立王国
  rationale: הכין有设立、使稳固之意；“建立王国”符合撒母耳促成君主制度的语境，也与希腊文平行文本相合。
- source_word: וימשח נגידים על עם
  choice: 膏立领袖治理他的百姓
  rationale: נגידים是领袖或统治者；“膏立”保留君王受膏的动作。“治理”使על所表达的居上掌权关系在汉语中清楚；“他的”由希腊文平行文本明确支持。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 主／耶和华
  rationale: 原文直接使用四字神名；“雅威”按其常见学术重构音译，保留这是神在盟约中启示的专名，而不以称号代替。
- issue: 撒母耳是否明确称为先知
  choice: 在预言中作雅威的拿细耳人
  alternative: 雅威的先知
  rationale: 希伯来文本为בנבואה，结构紧凑且并非通常的“先知”名词；希腊文则明确作“主的先知”。正文优先保存希伯来见证的措辞，脚注列出希腊异文。
- issue: 撒母耳的祭司职能
  choice: 担任祭司
  alternative: 省略此句
  rationale: 希伯来见证明确含有ומכהן，故正文保留；希腊平行文本没有这一内容，差异在脚注中说明。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。保留“拿细耳人”“膏立”等具有明确圣经文化含义的术语；对希伯来文בנבואה不作过度顺译，以保存原文的简约和歧义。
