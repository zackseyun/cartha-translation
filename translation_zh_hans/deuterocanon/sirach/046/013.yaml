  to: 撒母耳深受本族人民爱戴，为造他的主所喜悦；他自母腹中便是被求得的。[a] 他在预言中作雅威的拿细耳人，又作审判官，又担任祭司。他凭上帝的话建立王国，膏立领袖治理百姓。
  rationale: 修订仅处理三项可安全校正之处：使“造他的主”结构更合现代汉语；明确“被求得”的被动意义；删除希伯来正文未明载、仅由希腊平行本支持的“他的”，以维持以希伯来见证为正文基础的翻译原则。其余关键术语与原有的异文脚注均予保留。
