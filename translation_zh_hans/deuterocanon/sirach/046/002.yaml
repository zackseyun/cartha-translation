  text: How glorious he was when he stretched out his hand[a], when he brandished a spear against a city.
translation:
  language: zh_hans
  text: 他伸出手[a]、向一座城挥舞长矛时，是何等威严！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“他举起双手、挥剑攻打众城时，他是何等荣耀！”希伯来文作“伸出手……挥舞长矛……向一座城”。
    reason: alternative_reading
lexical_decisions:
- source_word: מה נהדר
  choice: 是何等威武
  rationale: 这是感叹式赞语；结合约书亚作战的语境，“威武”自然传达 נהדר 所含的荣耀、壮美和威严，又不额外引入神学含义。
- source_word: בנטותו יד
  choice: 他伸出手
  rationale: 保留希伯来文“伸展手”的身体动作及时间情境，不把这一军事姿态具体解释为某种命令或神迹。
- source_word: בהניפו כידון
  choice: 挥舞长矛
  rationale: הניף 表示举起、挥动或挥舞；כידון 指矛或标枪一类兵器。“挥舞长矛”在现代汉语中生动自然，同时避免过度限定兵器类型。
- source_word: על עיר
  choice: 向一座城
  rationale: על 在作战语境中表示敌对行动所指向的目标；“向一座城”既保留方向感，也让敌对含义由上下文自然显出，并保存希伯来文单数。
theological_decisions:
- issue: 希伯来文与希腊文在兵器及数目上的异文
  choice: 正文依高可信度希伯来文译作“长矛”和“一座城”
  alternative: 希腊文作“剑”和“众城”
  rationale: 现存希伯来文在此清楚连贯，应作为正文依据；希腊文的真实差异则以脚注保存，不将两种读法混合。
- issue: 赞叹语 מה נהדר 的语气
  choice: 译作“是何等威武”
  alternative: “是何等荣耀”或“是何等威严”
  rationale: “威武”符合眼前的军事场景，也保持赞叹力度；它没有把对人物英勇表现的称赞扩展为超出原文的神学断言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以一句感叹句重现希伯来文的赞美语气。所给希伯来材料开头“为要向仇敌报仇，并使以色列承受产业”位于抄本的（二）节标记之前，故本节正文从“何等威武”开始。
