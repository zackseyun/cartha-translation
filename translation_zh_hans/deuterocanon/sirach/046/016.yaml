base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/016.yaml
  text: He too called upon God when his enemies hemmed him in all around[a]; when he offered a milk-fed lamb[b], Yahweh thundered from heaven.
translation:
  language: zh_hans
  text: 在仇敌从四面围困他时[a]，他也呼求上帝；当他献上一只吃奶的羔羊[b]时，雅威从天上发出雷声。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“当他的仇敌……四面”，但现存文本的具体词形难以确定；希腊文平行文本支持“当仇敌从四面逼迫或围困他”的意思。
    reason: textual_variant
  - marker: b
    text: 或译：“一只哺乳的羔羊。”
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל אל
  choice: 呼求上帝
  rationale: “קרא אל”在困境语境中表示向某人呼喊求助或祷告；“呼求”既自然，也保留了恳求、祈祷的意味。
- source_word: כאפכה לו אויביו מסביב
  choice: 当仇敌从四面围困他时
  rationale: 现存希伯来文的具体词形较难确定；希腊文ἐν τῷ θλίψαι ἐχθροὺς αὐτοῦ κυκλόθεν支持“仇敌从四面施压、围困”的意思。译文保留包围与压迫感，不按可疑词形作生硬直译。
- source_word: בעלתו
  choice: 他献上
  rationale: 希伯来文形式略显困难，希腊文ἐν προσφορᾷ明确指向祭物或献祭。“献上”自然地连接后面的羔羊，并保留礼仪语境。
- source_word: טלה חלב
  choice: 一只吃奶的羔羊
  rationale: 该短语指仍以奶为食的幼羊。“吃奶的羔羊”具体易懂，也保留年龄和喂养状态；“乳羊”虽简练，却不如前者通俗清楚。
- source_word: וירעם משמים יהוה
  choice: 雅威便从天上发出雷声
  rationale: רעם在此指雷鸣；译作“发出雷声”符合现代汉语，并保留上帝从天回应的强烈意象。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。采用“雅威”作为该名字的音译，以区别于通称“上帝”，并保留本节由“上帝”转为专名的措辞变化。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“呼求”“献上”保留祷告与献祭语境；分号呈现呼求与困境之间的紧密关系，后半句用“便”自然表达献祭之后从天而来的回应。
