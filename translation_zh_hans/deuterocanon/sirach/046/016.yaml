  source_fidelity: 译文准确传达了呼求上帝、仇敌四面围困、献上乳羊，以及雅威从天发雷的基本内容，也恰当地以脚注标示围困一语所据希伯来文本的困难。可是现有标点和句法把“当仇敌从四面围困他时”接到“他献上”而非“他也呼求上帝”，削弱并改变了原文及希腊文平行本所显示的呼求发生于受敌压迫之时这一关系。
  naturalness: “呼求上帝”“从四面围困”“献上一只吃奶的羔羊”“从天上发出雷声”均为自然、庄重的现代汉语。调整分句次序后，时间关系会更清楚，叙述也更流畅。
  terminology: “上帝”对应通称的 אל，“雅威”对应随后出现的 יהוה，保留了原文从通称转为神名的措辞变化；“吃奶的羔羊”恰当表达 טלה חלב。脚注的“乳羊”不够明确，宜改作“哺乳的羔羊”或“吃奶的羔羊”。
