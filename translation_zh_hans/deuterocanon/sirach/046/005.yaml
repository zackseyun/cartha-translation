base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/005.yaml
  text: For he called on God Most High when his enemies pressed him from all around[a], and God Most High answered him with hailstones and ice-stones.
translation:
  language: zh_hans
  text: 因为仇敌从四面压迫他时，他呼求至高的上帝；至高的上帝便用雹石和冰石回应他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“大能的主在大有威力的雹石中垂听了他们（或：他）。”此处正文以希伯来文为主；希腊文则呈现了较为扩展的风暴显现措辞。
    reason: alternative_reading
lexical_decisions:
- source_word: קרא אל
  choice: 呼求
  rationale: 该短语在这里表示向上帝求助、呼告；“呼求”既自然，也保留祷告求援的意味，并与希腊文ἐπεκαλέσατο相符。
- source_word: אל עליון
  choice: 至高的上帝
  rationale: 保留“上帝”与“至高”构成的神圣称号，也在两处一致重复，以呈现希伯来文的强调。
- source_word: כאכפה לו אויביו מסביב
  choice: 仇敌从四面压迫他时
  rationale: 希伯来文动词形式较罕见、含义略有不确定；希腊文θλίψαι及κυκλόθεν支持“压迫”与“四面围困”的语义。“从四面压迫”兼顾敌对压力和包围之意。
- source_word: ויענהו
  choice: 回应他
  rationale: ענה在此表示上帝对呼求作出答复；“回应”保留希伯来文的直接表述，同时不把回应方式过度解释。
- source_word: באבני ברד
  choice: 用雹石
  rationale: 介词ב在此可表工具或手段，指上帝借风暴中的冰雹施行回应；“用雹石”简洁地表达这一点。
- source_word: וא לגביש / ואלגביש
  choice: 和冰石
  rationale: גביש是罕见的风暴相关词，可能指冰块或特殊的雹石。因前文已有ברד，“冰石”保留两项并列，而不将二者合并；希腊文的不同扩展措辞另见脚注。
theological_decisions:
- issue: 神圣称号的重复
  choice: 两处都译作“至高的上帝”
  alternative: 第二处简称“至高者”
  rationale: 希伯来文两次使用אל עליון。保留重复可突出受呼求并作回应的是同一位上帝，不因中文行文习惯而削弱原文的诗性强调。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“呼求—回应”保留原文两句之间的对应关系；“雹石和冰石”有意保留希伯来文两个近义而不完全相同的风暴用词及其不确定性。
