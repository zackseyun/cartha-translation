base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/009.yaml
  text: And he gave Caleb strength, and it remained with him until old age, so that he went up into the highlands of the land, and his offspring took possession of an inheritance.
translation:
  language: zh_hans
  text: 他赐给迦勒力量；这力量伴随他直到年老，使他得以登上那地的高地；他的后裔取得了产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本在“直到年老”处结束；本节后半句依据希腊文本补入。希腊文本开头明确作“主赐给迦勒力量”。
    reason: 说明希伯来复合文本与完整希腊平行文本之间的范围及主语差异。
lexical_decisions:
- source_word: ויתן לכלב עצמה
  choice: 他赐给迦勒力量
  rationale: 紧贴希伯来文“给迦勒力量”；主语在所给希伯来片段中未明说，因此不擅自补成“主”。
- source_word: ועד שיבה עמדה עמו
  choice: 这力量伴随他直到年老
  rationale: 将阴性动词“עמדה”理解为回指“力量”，并以自然汉语表达其持续与迦勒同在。
- source_word: ἐπιβῆναι αὐτὸν ἐπὶ ὕψος τῆς γῆς
  choice: 使他登上那地的高处
  rationale: 此内容见完整的希腊平行文本，可补足当前希伯来节文的缺失部分；“高处”保留地形表述，不具体化为某一地区。
- source_word: τὸ σπέρμα αὐτοῦ κατέσχεν κληρονομίαν
  choice: 他的后裔也取得了产业
  rationale: σπέρμα在此指后代；κατέσχεν表达占有、取得，κληρονομία指作为承受之分的产业。
theological_decisions:
- issue: 赐力量者的身份
  choice: 沿用片段语境中的代词“他”
  alternative: 按希腊文明确译作“主赐给迦勒力量”
  rationale: 现有希伯来正文写作“他赐给”，而希腊文明确为“主”；正文优先反映高置信度希伯来来源，并在脚注交代异文。
- issue: 希伯来片段与完整希腊节文的范围差异
  choice: 正文收入希腊平行文本所保存的后半节
  alternative: 只译希伯来所见的前半节
  rationale: 用户所给资料标注希伯来验证存在轻微不匹配，而完整希腊见证与审定英文层均含后半节；收入正文可保存本节完整内容，同时以脚注透明说明来源差异。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“伴随他直到年老”避免生硬直译“与他一同站立”；分号清楚呈现赐力与其结果之间的关系。
