  text: At the command of Yahweh he commanded the assembly[b][a], and the God of Jacob visited him.
translation:
  language: zh_hans
  text: 他奉耶和华之命，吩咐会众[a]；雅各的上帝眷顾了他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“吩咐会众”；希腊文本作“审判会众”。
    reason: alternative_reading
  - marker: b
    text: “他”是按上下文补出的，指撒母耳。希伯来原文没有明说宾语；希腊文本则作“主眷顾雅各”。“眷顾”所译的希伯来动词也可表示察看、关注或介入。
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: במצות יהוה
  choice: 奉耶和华之命
  rationale: 介词 ב 在这里表示行动所依据的命令；“奉……之命”自然、庄重，并保留行动出于耶和华指示的含义。
- source_word: צוה
  choice: 发号施令
  rationale: 现存希伯来文本通常意为“吩咐、命令”。用“向会众发号施令”使汉语通顺，同时不以希腊文本的“审判”取代高可信度的希伯来读法。
- source_word: עדה
  choice: 会众
  rationale: עֵדָה 指聚集的共同体；“会众”是简洁而通行的现代汉语表达。
- source_word: ויפקד
  choice: 眷顾了
  rationale: פקד 可指察看、关注、临到或介入；本节褒扬撒母耳的语境偏向正面，因此译作“眷顾”，但在脚注中保留宾语与语义范围的不确定性。
- source_word: אלהי יעקב
  choice: 雅各的上帝
  rationale: 直译这一固定的神圣称号，并与前句的神名“耶和华”保持区别。
theological_decisions:
- issue: 希伯来文本 צוה（“命令”）与希腊平行文本 ἔκρινεν（“审判”）不一致
  choice: 正文依现存希伯来文本译为“向会众发号施令”
  alternative: “审判会众”或“治理会众”
  rationale: 希伯来文本在此完整且可信度高，应作为正文的首要依据；希腊读法与撒母耳的士师身份和上下文吻合，可能反映不同底本，故在脚注中明确列出，而不暗中消除文本张力。
- issue: ויפקד אלהי יעקב 的宾语及指向
  choice: 将“雅各的上帝”视为主语，并按上下文补出“他”，指撒母耳
  alternative: “主眷顾雅各”，或不补明宾语
  rationale: 希伯来语没有明说宾语，紧接着的主语“雅各的上帝”可自然理解为眷顾撒母耳；希腊文本则明确以“雅各”为宾语。正文采用上下文较顺的理解，脚注保留另一读法及原文省略。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“奉……之命”和“发号施令”保留希伯来句式的命令意味；分号呈现两个并列分句。所有文本差异和补出成分均以脚注公开说明。
