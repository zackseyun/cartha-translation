  text: Who could stand before him? For he fought the wars of Yahweh[a].
translation:
  language: zh_hans
  text: 谁能在他面前站立得住？因为他打的是耶和华的战争。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本有异文，大意为：“在他以前，谁曾这样站立？因为主亲自引来了敌人。”正文依据希伯来文。
    reason: 记录重要的文本异读；希腊文在问题的时间指向及后半句内容上均与希伯来文不同。
lexical_decisions:
- source_word: מי הוא לפניו יתיצב
  choice: 谁能在他面前站立得住
  rationale: 将反问句按现代汉语自然表达；“站立得住”保留在某人面前抵挡、抗衡的语义，不将其弱化为单纯站立。
- source_word: כי
  choice: 因为
  rationale: 引出前一反问的理由，清楚保留希伯来语的因果关系。
- source_word: מלחמות
  choice: 战争
  rationale: 保留复数集合意义和较广的军事范围；不窄化为个别“战役”。
- source_word: יהוה
  choice: 耶和华
  rationale: 原文直接使用四字神名；采用现代中文圣经读者熟悉的专名译法，而不以泛称“主”取代。
- source_word: נלחם
  choice: 他打的是
  rationale: 用强调结构自然表达“他所进行的是耶和华的战争”，同时保留主语指向上下文中的人物。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 保留原文所用的专有神名，并采用普通现代中文读者最熟悉的形式；脚注不必借此解决其历史发音问题。
- issue: “耶和华的战争”中人的行动与神的战争之间的关系
  choice: 他打的是耶和华的战争
  alternative: 耶和华为他争战
  rationale: 希伯来文以该人物为 נלחם 的主语，战争则由属格短语归属于耶和华；译文不倒转施事关系，也不额外解释其神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“站立得住”传达抵挡之意；“他打的是……”避免生硬的“争战耶和华的战争”，又保留原文的强调和神学张力。脚注标记已在正文中出现。
