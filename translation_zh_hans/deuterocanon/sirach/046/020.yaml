  text: In the sight of every living thing—and even after his death he was sought out.[a]
translation:
  language: zh_hans
  text: 在所有活着的人面前，人都来求问他；甚至在他死后，人仍来求问他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本有较长的表述：“他安睡以后说了预言，向王指明王的结局，又从地上发出声音说预言，要除去百姓的不法。”这很可能说明，希伯来文所说“人仍来求问他”，是指撒母耳死后仍有人向他求问。
    reason: alternative_reading
lexical_decisions:
- source_word: ובעיני
  choice: 在……眼中
  rationale: 保留希伯来语 בעיני 的惯用表达，表示在众人看来或众人所见；本节承接上文，因此保留其片段式衔接。
- source_word: כל חי
  choice: 所有活人
  rationale: 直译其广泛范围，同时按语境理解为所有在世的人；比“所有生物”更符合此处谈论撒母耳声望的语境。
- source_word: וגם
  choice: 甚至
  rationale: 此处不仅是并列，也把叙述推进到死后这一出人意料的情形；“甚至”能自然体现其递进强调。
- source_word: אחרי מותו
  choice: 在他死后
  rationale: 简明、自然地保留原文的时间关系。
- source_word: נדרש
  choice: 人仍来求问他
  rationale: דרש 的尼法勒式可表示“被寻找”或“被求问、被咨询”。结合撒母耳死后被求问的叙事背景与希腊语平行文本，“求问”比单纯“寻找”更准确；补出泛指主语“人”，使现代汉语通顺，但不进一步明定求问者。
theological_decisions:
- issue: 是否在正文中明确描述撒母耳死后的预言活动
  choice: 以现存希伯来文的简短说法为正文：“人仍来求问他”，并在脚注中列出希腊语的扩展文本。
  alternative: 按希腊语正文详译为：“他安睡以后仍说了预言，向王指明他的结局，又从地里发声预言，要除掉百姓的不法。”
  rationale: 现存希伯来文在此完整而简短，应享有正文优先地位。希腊语保存的扩展传统有助于说明“被求问”的含义，却不宜无标记地加入希伯来正文。这样也不对撒母耳死后显现这一叙事的神学性质作超出文本的判断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“所有活人”保留原文范围，“人仍来求问他”则以自然汉语呈现 נדרש 的被动含义。分号反映本节开头可能承接上文，同时突出“死后”的递进转折。
