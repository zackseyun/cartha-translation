- from: 在所有活人眼中；甚至在他死后，人仍来求问他。[a]
  to: 在所有活着的人面前，人都来求问他；甚至在他死后，人仍来求问他。[a]
  rationale: 修订只解决正文句法和脚注指代问题，不改变希伯来文本的简短表达，也不在正文中采用希腊语所保存的扩展叙述。
