base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/018.yaml
  text: And at the time of his resting on his bed[b][a], he testified before Yahweh and his anointed one.
translation:
  language: zh_hans
  text: 他在床上安歇的时候[b]，在耶和华和他的受膏者[a]面前作证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受膏者”与“弥赛亚”源自同一希伯来词根；这里可能特指撒母耳时代耶和华所膏立的统治者。
    reason: lexical_alternative
  - marker: b
    text: 本节的希腊文本与希伯来文本差异很大，希腊文本作：“他摧毁了推罗的首领和非利士人的所有统治者。”
    reason: textual_variant
lexical_decisions:
- source_word: ועת
  choice: ……的时候
  rationale: 连接词加时间名词引出时间情境；汉语用“……的时候”自然表达，同时保留其时间关系。
- source_word: נוחו
  choice: 他安歇
  rationale: נוח在此与躺卧之处相连，表示歇息、安歇；译文不直接解释为死亡，以保留原文含蓄。
- source_word: על משכבו
  choice: 在床上
  rationale: משכב本义为躺卧之处，即床榻；“在床上”是朴素直译，“临终床上”则会加入原文未明说的解释。
- source_word: העיד
  choice: 作了见证
  rationale: עוד的使役形可表示作证、告诫或郑重见证。依当前句法裁定，译作“在……面前作了见证”，既直接又保留见证对象或见证场合的潜在张力。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式呈现四字神名。
- source_word: ומשיחו
  choice: 和他的受膏者
  rationale: משיחו直指“他的受膏者”。保留称号而不替换为人名，也不以“弥赛亚”引入后期专名化含义。
theological_decisions:
- issue: משיחו的表达
  choice: 他的受膏者
  alternative: 他的弥赛亚；他的君王
  rationale: 原文使用“受膏者”这一称号，历史语境可能指撒母耳时代耶和华所膏立的统治者，但经文本身没有点名。译作“受膏者”可保存词义及指称上的开放性。
- issue: העיד与耶和华及受膏者的句法关系
  choice: 在耶和华和他的受膏者面前作了见证
  alternative: 请耶和华和他的受膏者作证
  rationale: 该动词可容许“作证”或“请……作证”等理解。正文采用与所给修订层一致的“在……面前作见证”，不在译文中强行解决句法歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“安歇在床上”保留可能涉及临终或死亡的含蓄表达；脚注标记均置于正文相应位置。
