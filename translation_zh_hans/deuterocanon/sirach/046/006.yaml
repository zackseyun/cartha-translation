base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/006.yaml
  text: He hurled destruction on an enemy nation[a], and as they fled he wiped them all out, so that every nation might know their ban[b], for Yahweh watches over their battle.
translation:
  language: zh_hans
  text: 他向敌国发起猛攻；他们逃跑时，他把他们全都消灭了，为要使各国都认识这当灭之禁令，因为耶和华注视着他们的争战。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “当灭之禁令”所译的希伯来词（חרם）可指献归于神、因而被交付毁灭的人或物，也可指这种交付毁灭的禁令。本句希伯来文十分简略；也可按上下文理解为“使各国知道这当灭之事”。
    reason: 说明חרם的术语含义及压缩句法所留下的所指歧义。
  - marker: b
    text: 希腊文平行文本差异较大，作：“他向一国发动战争，在败退中消灭了抵抗者，使列国认识他们的全副军装，因为他的战争是在主面前；他也跟随在大能者之后。”
    reason: 保存与希伯来正文显著不同的古代平行见证；“败退中”对应希腊文的下落／败退语境，避免把该词限定为地形上的下坡。
lexical_decisions:
- source_word: השליך על גוי אויב
  choice: 他向敌国猛力出击
  rationale: השליך本义是“投、掷”，但此处宾语省略，置于战争语境中表示猛烈施加攻击。译为“猛力出击”既保留动作的力度，也避免凭空补出过于具体的武器或灾祸。
- source_word: ובנוסם
  choice: 他们逃跑时
  rationale: ב加上动词形式表达伴随或时间情境；此译自然地呈现追击中的场面。
- source_word: האביד כולם
  choice: 他把他们全都消灭了
  rationale: אבד的使役式表示“使灭亡、消灭”，כולם强调无一遗漏；采用庄重而直接的军事用语。
- source_word: למען דעת כל גוי
  choice: 为要使各国都认识
  rationale: 保留למען所表达的目的关系；כל גוי是分配性的集合表达，译作“各国都”。
- source_word: חרם
  choice: 那当灭的禁令
  rationale: חרם是圣约战争语汇，可指被分别出来、交付毁灭的人或物，也可指毁灭性的禁令。正文以“当灭的禁令”保留术语的法律—审判色彩，并用脚注说明原文的压缩和歧义。
- source_word: כי צופה
  choice: 因为……鉴察
  rationale: צפה可表示观看、守望或察看；“鉴察”保留耶和华主动关注战事的含义，又不把这种关注过度解释为某一种具体干预。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名形式音译四字神名。
- source_word: מלחמתם
  choice: 他们的争战
  rationale: 名词可指战争、战斗或争战，复数后缀直译为“他们的”；“争战”适合本节庄重的军事语域。
theological_decisions:
- issue: 压缩短语כל גוי חרם中חרם的所指
  choice: 正文译作“使各国都认识那当灭的禁令”，不擅自补入原文没有的领属代词。
  alternative: 使各国都知道他们必被灭绝；使各国都认识当灭之物；使各国都知道他们所受的禁令
  rationale: 希伯来文没有“他们的”这一后缀，且句法简短艰涩。חרם兼有奉献归神与交付毁灭的神学张力，因此正文保留术语性表达，脚注列出可能含义，而不把它简化成一般性的“毁灭”。
- issue: 希伯来文本与希腊平行文本的显著差异
  choice: 正文以现存希伯来文为主，脚注记录希腊文异读。
  alternative: 按希腊文译为“他向一国发动战争，消灭了抵抗者；使列国认识他们的全副武装，因为他的战争是在主面前；他也跟随了大能者”。
  rationale: 本节有可用的高可信度希伯来见证，应以其为主要翻译依据；希腊文本在“战争”“抵抗者”及末句等处显著不同，属于有意义的平行见证，故不混入正文而在脚注中保存。
- issue: 耶和华“鉴察”争战的神学力度
  choice: 保留为“鉴察他们的争战”。
  alternative: 看顾他们的争战；监督他们的战争；观看他们的战斗
  rationale: צופה本身可表示守望、观看或察看，未明确说明结果或干预方式。“鉴察”既体现神的关注，又不把经文进一步解释成保证胜利或单纯旁观。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“猛力出击”传达战场动作的力度；“消灭”避免口语化；对חרם不用单纯的“毁灭”，以保留其奉献归神与审判毁灭并存的术语色彩。脚注标记均在正文相应位置出现。
