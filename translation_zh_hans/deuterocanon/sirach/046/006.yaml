revisions:
- from: 他向敌国猛力出击；他们逃跑时，他把他们全都消灭了，为要使各国都认识那当灭的禁令[a]，因为耶和华鉴察他们的争战。[b]
  to: 他向敌国发起猛攻；他们逃跑时，他把他们全都消灭了，为要使各国都认识这当灭之禁令，因为耶和华注视着他们的争战。[a][b]
  rationale: 修订不改变以希伯来文为正文依据的取向。首句仍须对希伯来文中省略的受事作最低限度的军事语境补足，故用“发起猛攻”；删除“鉴察”的评断色彩，改以“注视”对应צופה。对חרם保留“当灭”的术语性，并在脚注交代其献归与毁灭的关联以及原文句法的简略。希腊文异读继续只置于脚注，不混入正文。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:48:06Z'
review_pass:
  verdict: revise
  source_fidelity: 正文总体依希伯来文而译，并保留了其战争语境与“全都消灭”的总括意义。但“鉴察”较容易带入审判性评断，未能最直接对应צופה的“注视、守望”；“猛力出击”也略弱化了 השליך 的突发、施加之力。修订以“发起猛攻”表达省略宾语的军事动作，并以“注视”保留动词本身的开放性。
  naturalness: “那当灭的禁令”可理解，但“这当灭之禁令”在庄重现代汉语中更紧凑；将脚注标记置于句末标点之前也更符合中文排版习惯。
  terminology: “当灭”可作为 חרם 的术语性简译，脚注应说明其“献归／交付毁灭”的双重语义，而不将其限定为单纯法律命令。“耶和华”适合本译稿既定的中文神名惯例。
  issues:
  - severity: medium
    issue: “鉴察他们的争战”对 צופה 的译法偏向评断。
    rationale: צופה主要是“观看、守望、注视”；经文本身没有明确说耶和华在审判或查究这场争战。译为“注视”能保留原文的语义范围。
  - severity: low
    issue: “那当灭的禁令”的指示词和结构略显生硬。
    rationale: 希伯来文是高度压缩的 כל גוי חרם，并无明确指示词；“这当灭之禁令”既保留术语性，也较合中文庄重叙事语体。
  - severity: low
    issue: 脚注a的“当灭的毁灭”不够自然，且对替代理解说明不够清晰。
    rationale: 应以较通顺的中文说明该短语也可按上下文理解为各国知道某一“当灭／被交付毁灭”的事实，同时明确这只是对简略句法的解释。
