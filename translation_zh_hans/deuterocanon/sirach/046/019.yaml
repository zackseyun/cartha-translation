base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/019.yaml
  text: 'Even up to the time of his end[1], he was found faithful in the eyes of Yahweh: “I have taken a ransom and hidden it—from whom have I taken anything? And no man answered against him.”'
translation:
  language: zh_hans
  text: “我从谁那里收过赎金而有所隐瞒呢？”没有人指控他。[a]直到他生命终结之时，他在雅威眼中仍被视为忠信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文十分简略，且其句序与经节划分可能有差异。这里译作“收过赎金而有所隐瞒”，但“赎金”（כפר）在此司法和清廉的语境中也可能指“贿赂”或不正当款项；“没有人指控他”直译近于“没有任何人回答反对他”。希腊文平行见证较明确地说：“我没有从任何人收取钱财，连鞋子也没有；也没有人控告他。”
    reason: 说明希伯来文的简略和歧义，保留“赎金／贿赂”及“回答反对／控告”的替代理解，并提供希腊文平行见证而不以之改写正文。
lexical_decisions:
- source_word: כפר
  choice: 赎金
  rationale: 保留该词较直接的词义“赎金、补偿款”；但在撒母耳自证清廉的语境中，也可能指“贿赂”，故在脚注说明。
- source_word: ונעלם
  choice: 又把它隐瞒
  rationale: 按其“隐藏、遮掩”的含义翻译，并保留原文所设想的收取款项后加以掩盖之意。
- source_word: ממי לקחתי
  choice: 我从谁手里拿过什么
  rationale: 希伯来文承接上句有所省略；补出“什么”使中文完整，同时保留反问语气。
- source_word: וכל אדם לא ענה בו
  choice: 没有一个人能指控他
  rationale: ענה ב可表示作证反对或提出控告；希腊文平行见证也明确支持司法性的“控告”。“能”体现无人对其质问作出不利答复的语境，但不扩大为绝对无罪论断。
- source_word: וגם עד עת קצו
  choice: 直到他生命终结的时候
  rationale: 依希伯来文直译“直到他终结之时”；加入“生命”使现代中文自然，并避免采用希腊文较扩展的“永眠以前”。
- source_word: נכון נמצא
  choice: 仍被看为忠信
  rationale: נכון含坚定、可靠、确立之意；在品格评价语境中，“忠信”兼顾可靠和坚定，且“被看为”保留נמצא的被动表达。
- source_word: בעיני יהוה
  choice: 在雅威眼中
  rationale: 保留希伯来语习语“在……眼中”，并将四字神名יהוה音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译“雅威”可体现其作为专名的性质，而不以称号替代。
- issue: 撒母耳自证与品格评价的关系
  choice: 将无人指控的陈述作为其忠信的证据，不作进一步教义化解释
  alternative: 明确解释为司法上的完全自证清白，或完全按希腊文改写成未收取任何钱财
  rationale: 原文赞扬撒母耳至终忠信，并保存他对不义取利的否认；译文不将这一具体见证扩张为文本未明说的教义结论。
- issue: 希伯来文本句序与经节划分
  choice: 按所给希伯来文本顺序，先译否认与无人指控，再译“直到他终结”
  alternative: 依英语咨询层和通常经节呈现，将“直到他终结”置于前面
  rationale: 给定希伯来证据中“他否认……没有人……”位于经节号标记之前，可能涉及抄本或编排错位；既以原文证据为先，正文依所给顺序，并在脚注提示文本差异。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。引语使用自然反问；叙述部分保留希伯来语的被动评价和“在……眼中”这一意象。脚注标记[a]已置于正文相关句后。
