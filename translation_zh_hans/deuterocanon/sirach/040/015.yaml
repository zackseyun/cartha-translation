base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/015.yaml
  text: The offspring of violence will not go unpunished[b][a], for the root of the godless is on a jagged crag.
translation:
  language: zh_hans
  text: 强暴所生的，必不能免受惩罚[a]；因为不敬神之人的根，扎在嶙峋的峭岩上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不敬神之人的后代不会多生枝条；不洁的根长在陡削的岩石上。”这同样呈现败坏生长的意象，但与现存希伯来文的措辞不同。
    reason: alternative_reading
  - marker: b
    text: 本句末尾的希伯来文较难确定；其中“牙齿”可比喻尖锐突出的岩石，即陡峭嶙峋的岩峰或峭壁。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוצר
  choice: 所生的
  rationale: 此处宜理解为“产生之物、所生者”；希腊平行文本的ἔκγονα（后代、所生者）支持这一理解。中文用“所生的”既可指后代，也保留“强暴结出的产物”这一可能含义。
- source_word: מחמס
  choice: 强暴
  rationale: חמס常指暴力、强暴或不义侵害。“强暴”简洁地保留其尖锐的道德含义。
- source_word: לא ינקה
  choice: 必不能免受惩罚
  rationale: נקה的否定式常有“不被判为无罪、不免受惩罚”之意；此译清楚传达司法性的后果。
- source_word: שרש
  choice: 根
  rationale: 依希伯来文保留单数，并维持植物生长的比喻。
- source_word: חנף
  choice: 不敬神之人
  rationale: חנף在此带有不虔敬、亵渎神圣的宗教道德意味；“不敬神之人”比“假冒为善者”更符合本句及希腊平行文本所反映的语境。
- source_word: על שן תלע
  choice: 扎在嶙峋的峭岩上
  rationale: 该短语疑难；שן本义为“牙齿”，可喻尖锐突出的岩石，תלע似指陡峭或崎岖的岩体。希腊文ἐπ’ ἀκροτόμου πέτρας也指陡削的岩石。“嶙峋的峭岩”保留鲜明而险峻的意象；“扎在”则使“根”的关系在现代汉语中自然明确。
theological_decisions:
- issue: 希伯来文与希腊文首句强调不同
  choice: 正文依现存希伯来文译为“强暴所生的，必不能免受惩罚”
  alternative: “不敬神之人的后代不会枝繁叶茂”
  rationale: 现存希伯来文是正文翻译的首要依据；希腊平行文本虽改以枝条繁衍的比喻表达，却可作为腐败生长与不稳根基这一整体意象的旁证，故列入脚注而不取代正文。
- issue: “强暴所生的”的指涉范围
  choice: 保留为可指后代或强暴产物的表达
  alternative: 明确限定为“强暴者的后代”
  rationale: 希伯来语措辞可容许“所生者／产物”的宽泛理解；不在正文中把它收窄为某一类人的血缘后代，以免消除原文的含混与伦理张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“强暴所生的”刻意保留后代与行为产物之间的语义开放性；“嶙峋的峭岩”传达希伯来文疑难短语及希腊平行文本共同指向的险峻岩石意象。所有脚注标记均已置于正文。
