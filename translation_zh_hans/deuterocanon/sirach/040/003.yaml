  text: from one seated on a lofty throne[a], to one returning to dust and ashes.
translation:
  language: zh_hans
  text: 从坐在高高的宝座上的人[a]，到归回尘土和灰烬的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“从在荣耀中坐在宝座上的人，到在地上和灰烬中被降卑的人。”希腊文本明确说出“荣耀”和“降卑”，而希伯来文本的表达更简练。
    reason: alternative_reading
lexical_decisions:
- source_word: מיושב
  choice: 从坐在……上的人
  rationale: 前缀 מ־表示范围的起点“从”，יושב为分词，指“坐着的人”；这样既贴合希伯来语结构，也符合现代汉语表达。
- source_word: כסא
  choice: 宝座
  rationale: כסא在尊贵、统治的语境中通常指王者的座位；希腊语平行文本的 θρόνος 也支持“宝座”。
- source_word: לגבה
  choice: 高高
  rationale: 该词组表达高度或崇高地位。译作“高高宝座”保留空间高度与身份尊崇的双重意味，同时不把希腊文本所明说的“荣耀”加入正文。
- source_word: עד
  choice: 到
  rationale: 这里与前面的 מ־构成“从……到……”的范围结构，并非主要表示时间上的“直到”。
- source_word: לשוב
  choice: 归回
  rationale: 保留“返回”的动作含义，并呼应人归回尘土的圣经惯用意象。
- source_word: עפר ואפר
  choice: 尘土和灰烬
  rationale: 准确保留这一表达人必死、卑微与脆弱的固定词组，也维持两个并列名词的形式。
theological_decisions:
- issue: 本节应以希伯来文本的简洁对照为正文，还是把希腊平行文本中的解释性内容纳入正文
  choice: 正文依希伯来文译为“从坐在高高宝座上的人，到归回尘土和灰烬的人”
  alternative: “从荣耀中坐在宝座上的人，到在尘土和灰烬中降卑的人”
  rationale: 现存希伯来文直接呈现最高地位与人最终归于尘土之间的跨度；希腊文明确加入“荣耀”和“降卑”，可帮助解释，却不宜取代或扩充希伯来正文。脚注保留这一重要异文信息。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“高高宝座”有意保留希伯来文兼具高度与尊位的含义；“归回尘土和灰烬”保持传统圣经意象而不显陈旧。
