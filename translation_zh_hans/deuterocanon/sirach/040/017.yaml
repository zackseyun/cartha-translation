    reason: textual_variant
lexical_decisions:
- source_word: וחסד
  choice: 仁慈
  rationale: חסד可指仁爱、怜悯、恩惠或忠贞之爱。本节没有明确的盟约语境，因此用现代汉语中自然而庄重的“仁慈”表达这种伦理美德，同时不把词义限缩为施舍。
- source_word: לעולם לא ימוט
  choice: 永不动摇
  rationale: ימוט描写摇动、倾覆或失去稳固；“永不动摇”保留稳定持久的意象，也符合现代汉语表达。
- source_word: וצדקה
  choice: 正义
  rationale: צדקה可指公义、正直，也可在后期用法中涉及周济。此处以现存希伯来文为主，译作“正义”；希腊文所见“施舍”的异文传统收入脚注。
- source_word: לעד תכון
  choice: 必永远坚立
  rationale: תכון源于כון，表示被确立、稳固存在或站立得住。“必永远坚立”既与上句的“不动摇”形成平行，也保留其持久稳固之意。
theological_decisions:
- issue: 开罗藏经库希伯来文本与希腊平行文本的差异
  choice: 正文依希伯来文译为“正义必永远坚立”
  alternative: 希腊传统作“施舍永远长存”，且前半句作“恩惠如同充满福分的乐园”
  rationale: 本项目在可靠的希伯来文本存世时以其为首要依据。希腊文在两分句均呈现显著差异，故不混入正文，而以脚注保存其见证和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“仁慈”避免过强的宗派性或盟约性限定；“正义”紧贴希伯来文，同时通过脚注交代希腊传统的“施舍”。脚注标记按所提供英文审校层的次序保留为[b][a]。
