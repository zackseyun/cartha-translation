  text: Wine and strong drink gladden the heart, but better than both is the love of lovers.
translation:
  language: zh_hans
  text: 酒和烈酒使人心欢喜，恋人之爱却胜过二者。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יין ושכר
  choice: 酒和烈酒
  rationale: יין泛指酒，שכר指更易使人醉的酒类；译作“烈酒”可自然保留两者的区别。
- source_word: יעליצו לב
  choice: 使人心欢喜
  rationale: 保留使役含义以及“心”作为情感中心的希伯来表达，同时符合现代汉语。
- source_word: אהבת דודים
  choice: 恋人之爱
  rationale: דודים在此可指恋人或情爱；“恋人之爱”保留希伯来文本的人际、爱情意味，不按希腊平行文本改作“爱智慧”。
- source_word: ומשניהם
  choice: 却胜过二者
  rationale: 按比较结构理解为“比这两样更好/更胜一筹”；“却”清楚呈现后半句的对比。
theological_decisions:
- issue: 希伯来文本“恋人之爱”与希腊文本“爱智慧”的差异
  choice: 采用希伯来文本的“恋人之爱”
  alternative: 爱智慧
  rationale: 指定的高可信度原文来源是希伯来文，且其读法清楚；希腊平行文本反映另一种文本传统，不应无声取代希伯来读法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；两分句保持智慧文学格言的平衡与对照。
