base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/026.yaml
  text: Wealth and strength lift up the heart[a], and the fear of God is beyond both. In the fear of God there is no lack[b], and there is no need to seek support along with it.
translation:
  language: zh_hans
  text: 财富和力量使人心高昂[a]，敬畏上帝胜过这两样[b]。在敬畏上帝中，没有缺乏；也不必另求倚靠[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心高昂”也可译作“心振奋”或“心高傲”；原文保留了自信与骄傲之间的含混。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“敬畏上帝在这两样之上”；意思是敬畏上帝胜过财富和力量。
    reason: lexical_alternative
  - marker: c
    text: 或译：“不必在它之外再寻求帮助。”原文强调敬畏上帝无需另加支撑。
    reason: lexical_alternative
lexical_decisions:
- source_word: חיל
  choice: 财富
  rationale: 在与“力量”（כח）并列时，此词最自然地指物质资财；希腊文χρήματα也支持这一含义。
- source_word: כח
  choice: 力量
  rationale: 直接对应希伯来文，含义宽广，可指个人的能力、实力或强健，也与希腊文ἰσχύς相符。
- source_word: יגדלו לב
  choice: 使人心高昂
  rationale: 保留“心被抬高”的比喻，并不武断限定为正面的振奋或负面的骄傲。补出“人”使现代汉语自然，但未改变泛指意义。
- source_word: ומשניהם
  choice: 却胜过这两样
  rationale: 介词 מן 在上下文中表达比较，意为敬畏上帝超过财富和力量；“却”自然显明对照，虽不机械对应连接词 ו。
- source_word: יראת אלהים
  choice: 敬畏上帝
  rationale: 保留智慧文学中兼有畏惧、崇敬与顺服意味的核心表达；原文是“上帝”（אלהים），并非神圣四字名。
- source_word: מחסור
  choice: 缺乏
  rationale: 准确表达不足、欠缺的状态，也与希腊文ἐλάττωσις所指的亏缺相合。
- source_word: ואין לבקש עמה משען
  choice: 有了它，也不必另求倚靠
  rationale: “另求”体现 עמה 所表达的“在它之外再加上”的意思；“倚靠”保留 משען 作为支撑、依凭的形象。
theological_decisions:
- issue: 如何表达 יראת אלהים
  choice: 敬畏上帝
  alternative: 尊崇上帝
  rationale: “敬畏”保留该智慧传统用语中敬重、惧怕和顺服并存的张力；仅译作“尊崇”会削弱原文的“畏”。
- issue: 敬畏上帝与财富、力量的关系
  choice: 敬畏上帝却胜过这两样
  alternative: 敬畏上帝来自这两样
  rationale: 上下文与希腊文“在二者之上”均支持比较义，但不进一步说明敬畏上帝如何胜过它们，以免加入原文未说的教义解释。
- issue: “没有缺乏”的范围
  choice: 敬畏上帝，就没有缺乏
  alternative: 敬畏上帝本身毫无欠缺
  rationale: 保留原文可理解为敬畏者不缺乏，也可理解为敬畏上帝本身足够的张力；下一分句则进一步表达无需另加倚靠。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“心高昂”保留希伯来文的身体性比喻；“另求倚靠”既自然，又呼应原文“支撑物”的意象。标点将两组平行分句清楚区分。
