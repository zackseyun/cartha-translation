  text: from the day he comes out from his mother's womb until the day he returns to the mother of all the living[a].
translation:
  language: zh_hans
  text: 从他出母腹之日起，直到他归回众生之母的那一天[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“归回众生之母”。这可能是指大地；人死后归回大地，如同归回一切生灵共同的母亲。希腊文平行文本则明确说“死亡之日”。
    reason: 说明希伯来文的诗性隐喻，并列出希腊文平行文本的明确表述。
lexical_decisions:
- source_word: מיום
  choice: 从……之日起
  rationale: 介词 מן 与“日”连用，标明一段时期的起点；“从……之日起”既清楚又自然。
- source_word: צאתו מרחם אמו
  choice: 他出母腹
  rationale: צאתו 源于“出去、出来”，与“母腹”合用指人的出生。译作“出母腹”保留希伯来文具体的出生图景，没有抽象化为“出生”。
- source_word: עד יום
  choice: 直到……的那一天
  rationale: 标明这段人生时期的终点，并与前面的“之日”形成对应。
- source_word: שובו
  choice: 他归回
  rationale: שוב 的基本义是“返回、归回”。“归回”保留从出生到死亡的方向性，也与诗意语体相称。
- source_word: אל אם כל חי
  choice: 归回众生之母
  rationale: 直译为“到一切活物／生者之母那里”。“众生之母”简洁保留原文的母性隐喻及其范围，不在正文中直接改释为“大地”或“死亡”。
theological_decisions:
- issue: “众生之母”所表达的死亡意象
  choice: 在正文中保留希伯来文的母性隐喻
  alternative: 译为“归回大地”或“归入坟墓”
  rationale: 希伯来文以“众生之母”诗意表达人生的终点，较可能指人死后归回的大地；希腊文平行文本明确提到“死亡之日”，支持这一语境，却不足以取代希伯来文正文的独特隐喻。脚注说明其可能所指，同时不排除读者留意该措辞与其他圣经母题的呼应。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“出母腹”保留原文具体意象；“众生之母”保留诗性和解释空间。脚注标记已在正文中以[a]标出。
