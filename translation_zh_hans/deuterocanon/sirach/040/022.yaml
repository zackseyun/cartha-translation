  text: Grace and beauty delight the eye[b][a], and better than both is the vegetation of the field.
translation:
  language: zh_hans
  text: 美丽和姿容悦人眼目[a]；田野的青绿植物胜过二者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “姿容”所译的希伯来语也可指“外貌”或“形态”；希腊语平行文本作“优雅和美丽”。因此本句也可译为：“美丽和外貌悦人眼目。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“田野的萌生之物／植物”；希腊语平行文本作“种子（或作物）的青翠嫩苗”，所指是田间鲜绿生长的植物，而非收割后的出产。
    reason: alternative_reading
lexical_decisions:
- source_word: יפי
  choice: 美貌
  rationale: 该词表示美丽、秀美；这里与“仪表”并列，用“美貌”自然地指可悦人眼目的外在之美。
- source_word: ותאר
  choice: 仪表
  rationale: 希伯来语 תאר 可指形态、外貌或仪容。“仪表”既保留外在形貌之意，又避免与“美貌”完全重复；希腊语平行文本则以“优雅／恩雅”与“美丽”配对，故在脚注说明。
- source_word: יחמידו עין
  choice: 令人赏心悦目
  rationale: חמד 可表示渴望、喜爱或以之为乐。原文以“眼”为感受主体；汉语成语“赏心悦目”自然传达视觉上的喜悦，而不把语义强化为贪恋。
- source_word: ומשניהם
  choice: 但……胜过二者
  rationale: 希伯来语表达简略，字面近于“而从／在二者之上”；希腊语 ὑπὲρ ἀμφότερα 明确支持比较义。“胜过二者”使中文关系清楚，“但”体现转折。
- source_word: צמחי שדה
  choice: 田野的青翠草木
  rationale: צמחי 指萌生之物、植物或生长物，שדה 指田野。结合希腊语 χλόην σπόρου 所呈现的新鲜绿色生长景象，用“青翠草木”避免误解为已收割的农产品，同时不把范围限死为某一种作物。
theological_decisions: []
translation_notes:
  register: 采用现代、端庄而易懂的智慧文学语体。“赏心悦目”保留原文关于眼目喜悦的意象；分号凸显后半句出人意料的比较。脚注保留希伯来语“仪表／外貌”与希腊语“恩雅”之间的真实差异，也说明末语所描绘的是田间鲜活的生长物。
