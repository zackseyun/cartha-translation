  text: For the wicked[a], evil was created, and because of them destruction will cease only when it is complete.
translation:
  language: zh_hans
  text: 灾祸是为恶人造的；因他们的缘故，灾祸要到彻底完成才会止息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“这一切都是为不法之人造的；因他们的缘故，洪水发生了。”其末句与现存希伯来文有重大差异。
    reason: alternative_reading
lexical_decisions:
- source_word: על רשע
  choice: 为恶人
  rationale: על可表示“为、临到、针对”；这里采用“为”，不把其含义限定为惩罚性的“攻击”。רשע虽为单数，也可泛指或集合性地指恶人。
- source_word: נבראה רעה
  choice: 灾祸是……造的
  rationale: רעה既可指道德上的恶，也可指祸患、灾难；本节处于论述世间苦难与审判的语境，“灾祸”在现代汉语中较自然，也避免误读为上帝创造道德邪恶，但不削弱其负面和惩治意味。
- source_word: ובעשור
  choice: 因他们的缘故
  rationale: בעבור通常表示“因为、由于”。希伯来语现存措辞简省；结合上下文及希腊文δι’ αὐτούς，补出复数所指“他们”，即恶人。
- source_word: תמוש כלה
  choice: 它要到彻底完成才会止息
  rationale: מוש可表示离去、止息；כלה可指完成、终结或彻底毁灭。希伯来语措辞凝练且含义不完全确定，此译法保留“止息”与“彻底完成”之间的张力，不采用希腊平行文本所明确说的“洪水”。
theological_decisions:
- issue: רעה应译为道德性的“恶”，还是惩罚性的“灾祸”
  choice: 灾祸
  alternative: 恶事／恶
  rationale: 该词本身语义宽广；上下文侧重临到人的苦难和审判，因此“灾祸”更符合现代汉语表达，也不暗示上帝创造道德邪恶。此选择仍保留其作为负面之事的广义。
- issue: 如何处理希伯来文末句与希腊文“洪水因他们而发生”的重大差异
  choice: 正文依据现存希伯来文，希腊异文列入脚注
  alternative: 因他们的缘故，洪水发生了
  rationale: 现存希伯来文罕见而凝练，但来源可信度高；按照原文优先原则保留其读法，同时以脚注呈现希腊传统，避免悄然调和两个不同文本。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“造的”保留ברא的创造用语；末句有意维持希伯来文的凝练和一定歧义。
