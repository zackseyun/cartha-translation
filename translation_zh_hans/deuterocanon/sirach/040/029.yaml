  source_fidelity: 首句宜保留“注视/望着别人的桌子”的意象，不应将语气强化为带明显口语贬义和乞求意味的“眼巴巴望着”。“生命算不得生命”较准确保留希伯来文中“生命”重复的强调。第二分句的希伯来文艰涩，希腊文支持“以别人的食物玷污自己”；据此译为“以别人的美食玷污自己”比“玷污自己的食欲”更贴近平行文本，也更合乎汉语。末句希伯来文的“内脏/内里之奥秘”不可安全地直接定为“克制内在欲望”；应保留其含混性，并在注中说明希腊文的解释性译法。
  naturalness: “眼巴巴望着”过于口语化，且加重了原文未明确表达的哀求或艳羡意味；“他的日子算不得生活”也不如“他的生命算不得生命”凝练自然。“拿别人的美食玷污自己的食欲”搭配不够自然；“以别人的美食玷污自己”较顺畅。末句“明白内在奥秘的人会自守”保持庄重，并让正文可读，具体难点交由脚注说明。
  terminology: “餐桌”准确对应桌子及其供食的语境；“美食”可对应艰涩的希伯来词并与希腊文ἐδέσματα相合。“自守”对应希腊文“守护自己/谨慎防备”，同时不把模糊的希伯来短语教义化为特定的“欲望克制”。
