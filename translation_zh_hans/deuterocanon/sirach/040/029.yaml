  register: 采用庄重而通顺的现代标准汉语。“眼巴巴望着”具有鲜明的生活画面，符合依赖别人饭桌的羞辱感；其余措辞保持智慧文学的凝练。正文的[a]、[b]与脚注标记完全对应。
