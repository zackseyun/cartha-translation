base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/029.yaml
  text: A man who watches another’s table—his life is not to be counted as life[a]; he defiles his appetite with another man’s delicacies[b], but a man who knows inward restraint will beware.
translation:
  language: zh_hans
  text: 一个注视着别人餐桌的人，他的生命算不得生命[a]；他以别人的美食玷污自己[b]；但明白内在奥秘的人会自守。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “别人的餐桌”也可译作“陌生人的餐桌”。这里着重指仰赖别人的供给，并非特指外族人的餐桌。
    reason: lexical_alternative
  - marker: b
    text: 本节后两分句的希伯来文颇为艰涩。第二分句可直译为近似“他以其美味玷污性命/自己”；末句直译近似“知道内里奥秘的人”。希腊文本则作：“他以别人的食物玷污自己；但有见识、受过教导的人会自守。”正文参考此译法，同时保留末句原文的含混性。
    reason: alternative_reading
lexical_decisions:
- source_word: איש משגיח
  choice: 一个眼巴巴望着……的人
  rationale: 分词 משגיח 表示注视、望着；“眼巴巴望着”自然传达持续盯望以及仰赖别人供给的语境含义，但没有把“依赖”直接写进正文。
- source_word: שלחן זר
  choice: 别人的饭桌
  rationale: זר 在此可指陌生的、外来的或属于别人的；希腊文 ἀλλοτρίαν τράπεζαν 也支持“属于别人的饭桌”，重点不是异族身份。
- source_word: אין חייו למנות חיים
  choice: 他的日子算不得生活
  rationale: 保留原文“生命／生活”重复所形成的强调，同时用现代汉语表达这种日子不配称为真正生活的意思。
- source_word: מעוג לנפש מטעמו
  choice: 他拿别人的美食玷污自己的食欲
  rationale: 希伯来文残句艰涩；结合希腊文“以别人的食物玷污自己的 ψυχή”，将 נפש 按饮食语境译作“食欲”，מטעמו 译作“美食”，同时在脚注说明不确定性。
- source_word: לאיש יודע סוד מעים
  choice: 懂得克制内在欲望的人
  rationale: 直译近似“知道内脏隐秘的人”，现代汉语难以明白。译文保留身体内部与自制的意象，并参考希腊文把此人解释为有见识、受过教导而会自守的人。
- source_word: φυλάξεται
  choice: 必会谨慎
  rationale: 希腊文表示防备、守护自己；“必会谨慎”符合智慧文学的劝诫语气，也避免补入原文未明说的具体对象。
