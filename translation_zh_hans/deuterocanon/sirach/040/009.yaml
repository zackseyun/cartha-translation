  text: Pestilence and bloodshed, strife and the sword, devastation and ruin, calamity and death.
translation:
  language: zh_hans
  text: 瘟疫与流血，争斗[a]与刀剑，蹂躏与毁灭，灾祸与死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争斗”：希伯来词含义不完全确定；希腊文本作“争斗”。
    reason: 标明罕见希伯来词的词义不确定性及古代平行文本的支持，避免把有争议的释义说成绝对确定。
lexical_decisions:
- source_word: דבר
  choice: 瘟疫
  rationale: 希伯来语在此指致命疫病；与本节列举人类苦难的语境相符。
- source_word: דם
  choice: 流血
  rationale: 字面为“血”，在灾难清单中以“流血”自然表达暴力杀戮。
- source_word: חרחר
  choice: 争斗
  rationale: 该词形罕见且含义不完全确定；希腊平行文本ἔρις明确支持“争斗、纷争”，也与后面的“刀剑”构成自然搭配。
- source_word: חרב
  choice: 刀剑
  rationale: 保留古代兵器意象，并传达战争和暴力。
- source_word: שד
  choice: 蹂躏
  rationale: 表达掠夺或毁坏所造成的灾难，避免与下一词“毁灭”完全重叠。
- source_word: שבר
  choice: 毁灭
  rationale: 该词可指破碎、崩溃或毁坏；在灾祸清单中译为“毁灭”简明有力。
- source_word: רעה
  choice: 灾祸
  rationale: 此处语境偏向临到人的祸患，而非抽象的道德之恶。
- source_word: מות
  choice: 死亡
  rationale: 直接对应“死亡”，并保持清单末尾的庄重收束。
