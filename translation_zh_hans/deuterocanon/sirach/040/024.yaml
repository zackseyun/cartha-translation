  text: A brother and a companion are for a time of trouble[a], but righteousness delivers more than both.
translation:
  language: zh_hans
  text: 兄弟和伙伴能在患难时相助，但公义[a]比二者更能救人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“施舍（或怜悯）比二者更能救人。”此处希伯来语见证作“公义”。
    reason: 保留希伯来语与希腊语之间影响伦理重点的异文。
lexical_decisions:
- source_word: אח
  choice: 兄弟
  rationale: 保留希伯来语具体的亲属称谓；虽然该词有时可泛指亲友，但此处与“伙伴”并列，直译更能呈现原句层次。
- source_word: ושותף
  choice: 和伙伴
  rationale: שותף指共同参与、彼此有份的人。“伙伴”既自然，又保留实际互助和共同承担的意味。
- source_word: לעת צרה
  choice: 在患难时
  rationale: 简洁表达危急、困苦之时，符合现代汉语智慧文学的语体。
- source_word: ומשניהם
  choice: 但……比二者更
  rationale: 原文表达后者胜过前述两者；汉语加“但”清楚呈现对比关系，而不改变比较内容。
- source_word: צדק
  choice: 公义
  rationale: 现存希伯来语见证作צדק，通常意为公义或正直。此处谈广义的道德品格，并非特指司法公正，因此采用“公义”；希腊语异文另见脚注。
- source_word: מצלת
  choice: 救人
  rationale: 该动词表示解救、搭救。原文未明说宾语，汉语用泛指的“人”使句子自然，同时避免赋予特定的救恩论含义。
theological_decisions:
- issue: 高潮比较中希伯来语צדק与希腊语ἐλεημοσύνη的差异
  choice: 正文依现存希伯来语译作“公义”，并在脚注保留希腊语“施舍／怜悯”的异文。
  alternative: 施舍（或怜悯）比二者更能救人。
  rationale: 此处有可靠的希伯来语见证，故正文以其为先；但希腊语的差异会明显改变格言的伦理重点，可能反映不同底本或解释性翻译，因此不应隐去。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“能在患难时相助”将原文简略的名词句转化为合乎汉语习惯的表达；“比二者更能救人”保留原句的比较力度。
