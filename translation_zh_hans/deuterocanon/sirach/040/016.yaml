translation:
  language: zh_hans
  text: 如同溪畔种植地上的灌木[a][b]，在每场雨来到以前就枯萎了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“כקרדמות”的词义不确定；希腊语平行文本描写一种长在水边、却很快被拔除的植物。这里译作“灌木”，旨在表达脆弱的低矮植物，并非确定其具体品种。
    reason: lexical_alternative
  - marker: b
    text: 较古老的马萨达抄本在此似乎保存了明显不同的读法。由于本译文以开罗藏经库希伯来语文本为主要依据，而现有材料中的马萨达残片并不完整，正文仍按开罗文本翻译，并在此注明文本差异。
    reason: textual_variant
lexical_decisions:
- source_word: כקרדמות
  choice: 如同……灌木
  rationale: 该词形罕见且词义不确定；希腊平行文本呈现水边生长却很快被拔除的植物。译作“灌木”保留低矮、脆弱植物的意象，同时不武断认定具体植物种类。
- source_word: על מטעי נחל
  choice: 溪边栽种之地
  rationale: מטעי 指栽种之物或种植地，נחל 指溪流、河谷水道；此译既保留种植意象，也用现代汉语自然表达水道旁的地点。
- source_word: מפני כל מטר
  choice: 每逢降雨
  rationale: מפני 可表示“在……面前”或“由于”；结合植物意象，此处表达雨一来便发生后述结果。“每逢降雨”保留每次降雨的概括意义，并避免生硬直译。
- source_word: נדעכו
  choice: 便枯萎了
  rationale: 该动词可指熄灭、衰退或消逝；用于植物时，“枯萎”自然传达生命力衰败、消失的意象，但不引入希腊文本较明确的“拔除”。
