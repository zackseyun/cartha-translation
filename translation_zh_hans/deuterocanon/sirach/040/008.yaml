  text: And with all flesh their anxiety is with them[a], and their wealth drives away their sleep.
translation:
  language: zh_hans
  text: 一切有血肉的生灵，他们的忧虑都与他们相伴[a]；他们的财富使他们无法安睡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“与一切有血肉的生灵同在，从人到牲畜；临到罪人的，是这些的七倍。”现存希伯来文的这一行没有这段较完整的措辞。
    reason: alternative_reading
lexical_decisions:
- source_word: ועם כל בשר
  choice: 一切有血肉的
  rationale: בשר在这里是集合用法，指有血肉的生命；保留希伯来文的广泛表达，也与希腊文“从人到牲畜”的范围相符。
- source_word: דאגתם עמם
  choice: 都有忧虑相伴
  rationale: דאגתם表示“他们的忧虑”，עמם直译为“与他们同在”。译作“忧虑相伴”保留忧虑如影随形的意象，同时符合现代汉语。
- source_word: ועשרם
  choice: 他们的财富
  rationale: עשרם指“他们的财富、财物”；“财富”准确直接，也能清楚呈现财物本身带来不安的反讽。
- source_word: מניד שנתם
  choice: 使他们无法安睡
  rationale: 该短语表达使睡眠动摇、离去或受到扰乱；“无法安睡”自然传达财富驱走安稳睡眠的结果，而不把语义收窄为完全不能入睡。
- source_word: ἐπὶ ἁμαρτωλῶν ἑπταπλάσια πρὸς ταῦτα
  choice: 不纳入正文
  rationale: 希腊文有“临到罪人的更是这些的七倍”这一附加分句，但现存希伯来文没有；按希伯来文本立正文，并在脚注保留重要异文。
theological_decisions:
- issue: 现存希伯来文本与较完整希腊平行文本的取舍
  choice: 正文依据现存希伯来文，希腊文扩展内容列入脚注
  alternative: 将“从人到牲畜；临到罪人的更是这些的七倍”纳入正文
  rationale: 本节有高可信度的希伯来文见证，应以其为正文基础；希腊文是重要的平行见证，但其较长措辞不应无说明地补入希伯来文正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一切有血肉的”保留原文的圣经式集合表达；后半句用“无法安睡”自然呈现睡眠被财富扰乱、驱散的意象。
