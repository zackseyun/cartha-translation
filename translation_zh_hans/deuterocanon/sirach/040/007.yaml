  text: Again he prepares for battle[a], and he wakes up, and there is no terror; then he finds rest.
translation:
  language: zh_hans
  text: 他又布置战阵[a]；醒来时，毫无恐惧，便得到安歇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“他又布置战阵，醒来时，毫无恐惧，便得到安歇。”希腊文平行文本有明显差异，较接近：“在他得救的时候，他被唤醒，惊奇地发现毫无恐惧。”《便西拉智训》凡有存世希伯来文之处，正文以希伯来文见证为主要依据。
    reason: alternative_reading
lexical_decisions:
- source_word: עוד
  choice: 又
  rationale: 表示前述困苦经历再次出现；“又”自然传达重复之意。
- source_word: עורך מלחמה
  choice: 准备迎战
  rationale: ערך本义为“排列、布置”，常用于布置战阵；此处“准备迎战”既保留军事场景，也符合现代汉语表达。
- source_word: והקיץ
  choice: 醒来后
  rationale: קיץ指从睡眠中醒来；用“醒来后”清楚表达本节从梦中争战转到苏醒的先后关系。
- source_word: ואימה אין
  choice: 恐惧便消失了
  rationale: 希伯来文是简短的无动词句，直义为“没有恐惧”；此译自然表现醒来时先前的惊恐已不复存在。
- source_word: ומצא מנוח
  choice: 于是得了安息
  rationale: מנוח意为安息、歇息；“得了安息”保留“找到安息”的结果含义，并以“于是”表达语序所体现的进展。
