  text: Children and the building of a city establish a name[b][a], but better than both is a blameless wife.
translation:
  language: zh_hans
  text: 儿女和建造城邑能建立人的声名[b][a]，但无可指责的妻子胜过二者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开罗藏经库的希伯来文本大致作“从二者而来的是智慧”；希腊语平行文本则作“但无可指责的妻子胜过二者”。这半句的希伯来文本可能有讹乱，因此正文采用较清楚、且有希腊文本支持的读法。
    reason: alternative_reading
  - marker: b
    text: 较早的马萨达卷轴在这里残缺，所保存的文字不足以确定本句最后的措辞。
    reason: textual_variant
lexical_decisions:
- source_word: ילד / τέκνα
  choice: 儿女
  rationale: 希伯来语在此作集合用法，希腊语复数也支持这一理解；“儿女”自然、庄重，并能涵盖子女。
- source_word: ועיר יעמידו שם / οἰκοδομὴ πόλεως στηρίζουσιν ὄνομα
  choice: 建造城邑都能使人的名得以长存
  rationale: 传世希伯来文本句法较难，希腊语明确指“城的建造”；“使人的名得以长存”既保留“名”的意象，也表达建立并延续声名的含义。
- source_word: ומשניהם / ὑπὲρ ἀμφότερα
  choice: 胜过二者
  rationale: 希腊语明确表达比较关系；此译简洁地保留格言式结构。
- source_word: γυνὴ ἄμωμος
  choice: 无可指责的妻子
  rationale: ἄμωμος表示品行无可责难，并非宣称绝对无罪；“妻子”符合本节比较的家庭语境。
theological_decisions:
- issue: 希伯来残篇与希腊平行文本在末句上的差异
  choice: 正文采用希腊语所保存的“无可指责的妻子胜过二者”
  alternative: 按开罗藏经库希伯来文本译作“从二者而来的是智慧”或“寻得智慧胜过二者”
  rationale: 希伯来语末句在此疑有文本错乱，且与上下对偶结构不易协调；希腊语读法语义完整，并形成清楚的比较格言。脚注保留希伯来异文，避免掩盖真实的文本问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“城邑”略带经文体色彩，但现代读者仍易理解；“名得以长存”比直译“立定一个名”自然，同时保留希伯来语“名”所承载的声名与传世含义。脚注标记依英文审校层顺序置于相关分句后。
