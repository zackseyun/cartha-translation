  text: Every gift and injustice will be wiped away[b][a], but faith will stand forever.
translation:
  language: zh_hans
  text: 一切礼物[b]和不义之事都必被抹去，信[a]却要永远屹立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“信实却要永远屹立。”希腊词πίστις既可指“信”，也可指“信实”。
    reason: alternative_reading
  - marker: b
    text: 较古老的马萨达希伯来文见证在此似乎反映了与“借贷”有关的读法，而希腊文本作“礼物”。正文依照希腊文本，但希伯来文证据表明底本可能存在古老异文。
    reason: textual_variant
lexical_decisions:
- source_word: πᾶν
  choice: 一切
  rationale: 表达涵盖全部的意思，并自然地修饰后面的名词性并列结构。
- source_word: δῶρον
  choice: 礼物
  rationale: δῶρον通常指“礼物、赠礼”；希腊文本本身没有充分依据将其具体化为“贿赂”。
- source_word: ἀδικία
  choice: 不义之事
  rationale: 既保留ἀδικία的道德及社会层面含义，也比单独使用抽象名词“不义”更符合现代汉语表达。
- source_word: ἐξαλειφθήσεται
  choice: 必被抹去
  rationale: 保留原词“擦除、涂抹掉”的形象，并以“必”表达将来陈述。
- source_word: πίστις
  choice: 信
  rationale: 保留πίστις作为“信”的基本译法；本节语境也可能指“信实”，故在脚注注明。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 这是该希腊惯用语在此处最自然清楚的现代汉语表达。
- source_word: στήσεται
  choice: 要……屹立
  rationale: “屹立”保留στήσεται的站立意象，同时传达坚定长存，与前句“被抹去”形成鲜明对照。
theological_decisions:
- issue: πίστις的译法
  choice: 信
  alternative: 信实；信靠
  rationale: πίστις本身可指信、信靠或信实；正文采用“信”，但不排除本节强调持久“信实”的可能，因此以脚注保存这一歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“抹去”与“屹立”保留原文一消一立的具体意象；“不义之事”使抽象伦理概念在汉语中更自然。所有脚注标记均置于其所说明的词语之后。
