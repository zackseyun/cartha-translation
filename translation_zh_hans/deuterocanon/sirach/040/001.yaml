base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/001.yaml
  text: Great toil is allotted[c][b][a], and a heavy burden upon the children of man—from the day they come forth from their mother’s womb until the day they return to the mother of all.
translation:
  language: zh_hans
  text: 繁重的劳碌分给了世人，沉重的担子压在亚当的子孙身上[a]——从他们出母腹之日，直到他们被葬入万物之母的那一天[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“沉重的轭压在亚当的子孙身上”。现存希伯来文较为省略；正文以“沉重的担子”表达其含义。
    reason: lexical_alternative
  - marker: b
    text: 现存希伯来文在此较短。希腊平行文本另有：“从他们出母腹之日，直到他们被葬入万物之母的那一天。”
    reason: alternative_reading
  - marker: c
    text: “万物之母”是对大地的拟人说法；所有人死后都葬入其中。
    reason: cultural_note
lexical_decisions:
- source_word: עסק גדול
  choice: 繁重的劳碌
  rationale: עסק在此指使人劳碌、困扰的事务，不只是中性的“工作”或“忙碌”；“繁重的劳碌”自然传达其令人疲惫的分量，也与希腊文Ἀσχολία μεγάλη相符。
- source_word: חלק אל
  choice: 分给了世人
  rationale: 现存希伯来文措辞压缩且不易确定。חלק含有分配、所得之分的意思；希腊平行文本说这一处境是为“每一个人”设立的。采用被动表达，既保留“分配”的概念，也不强行判定希伯来文是否明确以神为施事者。
- source_word: ועל כבד
  choice: 沉重的担子压在……身上
  rationale: 希伯来文是省略式表达；希腊文ζυγὸς βαρύς直译为“沉重的轭”。正文用现代汉语常见的“沉重的担子”，并以脚注保留“轭”的异文形象。
- source_word: על בני אדם
  choice: 压在亚当的子孙身上
  rationale: בני אדם既可泛指人类，也保留“亚当之子孙”的语源与人类共同处境的意味；希腊文υἱοὺς Ἀδάμ进一步支持显出“亚当”。“子孙”在汉语中可涵盖男女后代。
- source_word: ἀφʼ ἡμέρας ἐξόδου ἐκ γαστρὸς μητρὸς αὐτῶν
  choice: 从他们出母腹之日
  rationale: 简洁保留希腊文从母腹出来的具体图景，比单译“出生之日”更贴近原文。
- source_word: ἕως ἡμέρας ἐπὶ ταφῇ εἰς μητέρα πάντων
  choice: 直到他们葬入众生之母的那一天
  rationale: 希腊文明确含有安葬之意，并以“众生之母”指大地。译作“葬入”而非“归回”，避免加入原句没有明说的动作，同时保留其形象。
theological_decisions:
- issue: 较短的希伯来见证与较完整的希腊平行文本
  choice: 以希伯来文前半句为基础，并收入希腊文保存的从出生到安葬的时间范围，同时用脚注说明见证差异。
  alternative: 只译现存希伯来文的短句，删去从出母腹到安葬的扩展部分。
  rationale: 《便西拉智训》应以存世希伯来文为首要依据，但希腊平行文本也是实际的源文证据。本节希腊文的扩展与希伯来文所述人类共同重担连贯一致；脚注明示差异，可避免把扩展误说成现存希伯来文内容。
- issue: בני אדם／υἱοὺς Ἀδάμ的人类学表达
  choice: 亚当的子孙
  alternative: 世人／人类
  rationale: 此译法既包括全人类，又保留原文与亚当有关的表达，不将其抽象化，也不据此引申任何宗派性的教义结论。
- issue: “众生之母”的所指
  choice: 正文保留大地母亲的比喻，脚注说明其指埋葬死者的大地。
  alternative: 正文直接译为“大地”或“坟墓”。
  rationale: 保留原文诗性意象及其开放张力，同时为普通读者说明文化语境。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“繁重的劳碌”“沉重的担子”形成平行节奏；“亚当的子孙”保留源文的人类学色彩；破折号自然引出希腊文本所保存的生命全程。脚注标记均已在正文中出现。
