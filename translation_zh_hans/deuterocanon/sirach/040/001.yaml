  naturalness: “繁重的劳碌”“沉重的担子压在……身上”庄重、清楚，符合现代书面普通话。为使埋葬动作明确且自然，将“他们葬入”改为“他们被葬入”。
  terminology: “亚当的子孙”在此可保留 בני אדם／υἱοὺς Ἀδάμ 的亚当性措辞，同时指全人类；不需改为抽象的“人类”。“万物之母”比“众生之母”更准确对应“母亲（一切的）”这一指大地的诗性比喻，且避免“众生”可能带出的特定宗教语感。
