  text: Everything from the earth returns to the earth[a], and what is from above to what is above.
translation:
  language: zh_hans
  text: 凡从地而来的，都归回地[a]；从高处而来的，也归回高处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“从水归回海。”
    reason: alternative_reading
lexical_decisions:
- source_word: כל
  choice: 凡……的，都
  rationale: 希伯来语表示无所限定的总体；用“凡……的，都”既保留概括性，也不把所指缩窄为人。
- source_word: מארץ אל ארץ
  choice: 出于地的，都归回地
  rationale: 原文以“地”同时表示来源与归宿；中文重复“地”，保留原句的回环结构和意象。
- source_word: ישוב
  choice: 归回
  rationale: שוב的基本义是返回、回转；“归回”在此简洁自然，并凸显回到原处之意。
- source_word: ואשר
  choice: 出于……的，也
  rationale: 关系表达在此宜作非人格化理解；“也”清楚连接两个平行分句，而不额外限定所指。
- source_word: ממרום אל מרום
  choice: 出于高处的，也归回高处
  rationale: מרום可指高处、至高之处。译作“高处”保留原文重复和垂直意象，不武断明确为“天”或其他特定领域。
theological_decisions:
- issue: 希伯来文本第二分句与希腊文本的差异
  choice: 正文依现存希伯来文译为“出于高处的，也归回高处”
  alternative: 希腊文作“从水而来的，归回海里”
  rationale: 此处希伯来文完整且可信，应作为正文依据；其含义虽简约而略显含混，仍不应借希腊异文加以消解。希腊传统的重要差异收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归回”略带书面色彩，适合智慧文学语体；全句保留希伯来文两分句的平行、重复及第二分句的含混性。
