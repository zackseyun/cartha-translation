base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/013.yaml
  text: From force to force[a], like a perennial wadi, and from a mighty channel[c][b], with a crash of sounds.
translation:
  language: zh_hans
  text: 从力量到力量[a]，如长流不息的溪谷[b]；从雄伟的河道[c]，传来轰然巨响。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本的形式明显不同，作：“不义之人的财富必像河流干涸，又必像雨中的巨雷轰鸣。”
    reason: alternative_reading
  - marker: b
    text: “溪谷”也可译作“长流不息的溪流”。希伯来语 נחל 常指溪谷、急流或其河床，איתן 则有持久、稳定之意。
    reason: lexical_alternative
  - marker: c
    text: 本行希伯来文本难解；马萨达残片在本节保存得过于残缺，无法确定原文。译文依照开罗藏经库的希伯来文本，同时参照希腊文本。
    reason: textual_variant
lexical_decisions:
- source_word: מחיל אל חיל
  choice: 从一股力量到另一股力量
  rationale: חיל 可指力量、势力、财富或军队。现存希伯来文本简略难解；结合后面的水流意象，此处保留“力量”及其接连涌动的意味，不把希腊文本“恶人的财富”直接移入正文。
- source_word: כנחל איתן
  choice: 如长流不息的溪谷
  rationale: נחל 常指季节性河谷、溪谷或其中的水流，איתן 表示持久、稳定或强劲。“长流不息的溪谷”既保留近东地貌意象，也表达持续有水的含义。
- source_word: ומאפיק אדיר
  choice: 又从一道汹涌的河槽
  rationale: אפיק 指水道、河槽或沟谷，אדיר 指强大、雄浑；译作“汹涌的河槽”，使地貌意象与水势在现代汉语中自然结合。
- source_word: בחזיז קולות
  choice: 发出轰然巨响
  rationale: 这是罕见且困难的短语；קולות 可指声音、响声或雷声。译文表达强烈的听觉效果，但不武断限定为雷鸣。
