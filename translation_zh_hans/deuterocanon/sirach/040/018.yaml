  text: Wine and strong drink sweeten life[a], but better than both is finding a treasure.
translation:
  language: zh_hans
  text: 酒和烈酒使生活甘甜[a]，但胜过二者的，是寻得珍宝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作：“酒和烈酒使生活甘甜，而超过二者的是寻得珍宝。”希腊文平行文本也支持比较的意思，即“胜过二者”。
    reason: 说明ומשניהם的字面结构及希腊平行文本所支持的比较义。
lexical_decisions:
- source_word: חיי
  choice: 生活
  rationale: 该形式与下文连用，表达酒和烈酒使人的生活变得甘甜；译作“生活”既保留名词意义，也符合现代汉语。
- source_word: יין
  choice: 酒
  rationale: 通常指葡萄酒；此处用通顺而不过度具体化的“酒”，并与“烈酒”形成区别。
- source_word: ושכר
  choice: 和烈酒
  rationale: שכר泛指葡萄酒以外能使人醉的酒类；“烈酒”是简洁、易懂的对应表达，但不限定具体品种。
- source_word: ימתקו
  choice: 使……甘甜
  rationale: 源自动词מתק，意为“成为甘甜”或“使之甘甜”；结合“生活”译作“使生活甘甜”，保留原文意象。
- source_word: ומשניהם
  choice: 但胜过二者
  rationale: 希伯来语字面可理解为“从／超过二者”；希腊平行文本ὑπὲρ ἀμφότερα明确支持比较义。以“但胜过二者”自然呈现转折和比较，同时在脚注保留字面歧义。
- source_word: מוצא
  choice: 寻得
  rationale: 该分词或名词性形式可指“寻得”或“寻得的人”；此处译作动词性表达，简洁自然，希腊语ὁ εὑρίσκων也证实“寻找并发现”的意义。
- source_word: אוצר
  choice: 珍宝
  rationale: 上下文指有价值的宝物，而不是储藏室；希腊语θησαυρόν亦支持此义。“珍宝”较“宝藏”更适合与“寻得”搭配，并不限定其具体性质。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使生活甘甜”保留希伯来文的味觉隐喻；后半句用“但胜过二者的，是……”清楚表达比较关系，同时不把“珍宝”具体解释为财富、智慧或其他神学概念。
