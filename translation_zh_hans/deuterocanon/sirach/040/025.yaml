  text: Gold and silver make the foot stand firm[a], but better than both is sound counsel.
translation:
  language: zh_hans
  text: 金银使人站稳脚跟[a]，但良策胜过二者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“金银使脚站立，而在二者之上的是良策。”希腊文平行文本也有相近表述：“金银使脚站稳，而谋略在二者之上受到推崇。”
    reason: 说明原文保留“脚”的具体意象，以及后半句简练而略有歧义的比较结构。
lexical_decisions:
- source_word: זהב וכסף
  choice: 金银
  rationale: 保留希伯来文中“金与银”的固定并列；现代汉语用“金银”自然地统指财富，同时与希腊文平行文本一致。
- source_word: יעמידו רגל
  choice: 使人立足稳固
  rationale: 原文直译为“使脚站立”，表达使人获得稳固立足之处。译作“使人立足稳固”既保留“足/站立”的具体意象，也符合现代汉语表达。
- source_word: ומשניהם
  choice: 但……胜过二者
  rationale: 字面含义是“并且在二者之外／之上”；语境具有比较意味，希腊文ὑπὲρ ἀμφότερα也支持“胜过二者”。“但”自然呈现金银与良策之间的价值转折。
- source_word: עצה טובה
  choice: 良策
  rationale: עצה意为谋略、劝告或计策，טובה意为好的。“良策”简洁保留“好的谋略”之义，并符合箴言式语体；不额外加入“智慧”等原文没有的限定。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留智慧文学的对偶和箴言感。“立足稳固”兼顾希伯来文意象与汉语可懂度；“良策”紧贴עצה טובה，避免过度释义。
