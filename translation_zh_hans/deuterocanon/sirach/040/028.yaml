  text: My child[a], do not live the life of a beggar[b]; it is better to die than to beg.
translation:
  language: zh_hans
  text: 孩子[a]，不要靠乞讨度日；宁可死去[b]，也不要行乞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孩子”见于希腊语平行文本；现存希伯来语本行没有这一称呼。
    reason: textual_variant
  - marker: b
    text: 希伯来语“被收聚”是指死亡的委婉说法，故译为“死去”。本节有关靠乞求施舍生活及“行乞”的希伯来语措辞含义晦涩；希腊语平行文本明确支持此义。
    reason: lexical_alternative
lexical_decisions:
- source_word: חיי
  choice: ……度日的生活
  rationale: 这是“生命／生活”的构造形式，在本句中表示一种生活方式；译成“……度日的生活”符合现代汉语表达。
- source_word: מכי מתן
  choice: 乞讨度日
  rationale: 希伯来语表达含义难定；希腊语对应词 ἐπαιτήσεως 明确指靠乞求或施舍生活，因此采用自然且不过度具体化的“乞讨度日”。
- source_word: אל תחי
  choice: 不要过……生活
  rationale: 源自 חיה 的否定命令式；结合前面的 חיי，汉语以“不要过……生活”最为顺畅。
- source_word: טוב
  choice: 宁可
  rationale: 本句用于比较，希腊语 κρεῖσσον 也支持“更好”；汉语用“宁可……也不要……”自然传达这种强烈比较。
- source_word: נאסף
  choice: 死去
  rationale: 字面为“被收聚”，是指死亡的希伯来语委婉表达；希腊语 ἀποθανεῖν 明说“死”，故正文译出其实际含义。
- source_word: כמסתולל
  choice: 行乞
  rationale: 希伯来语词形晦涩，希腊语 ἐπαιτεῖν 强力支持“乞讨、行乞”的含义。
- source_word: τέκνον
  choice: 孩子
  rationale: 现存希伯来语本行没有这一称呼，但希腊语平行文本有呼格 τέκνον；将其纳入正文，同时用脚注说明文本差异。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语气。“宁可……也不要……”保留原文尖锐的比较和张力，不加以缓和。方括号附加的三组格言在所给底本中标为附文，内容也不属于希腊语所对应的本节，故未纳入本节正文。
