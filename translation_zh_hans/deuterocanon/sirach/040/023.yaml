  text: A companion and a friend conduct themselves for a time, but better than both is an intelligent wife.
translation:
  language: zh_hans
  text: 同伴和朋友相伴一时[a]，但胜过二者的，是明智的妻子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一时”也可译作“在适当时机”。希伯来文和希腊文都含有“时间／时机”的意思，既可能强调相伴有时限，也可能强调适时相助。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“女人”，也可指“妻子”；希腊文平行文本更明确地指向婚姻中的妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: עמית
  choice: 同伴
  rationale: 指关系密切的伙伴或同道；“同伴”自然保留其人际关系含义，并与下文“朋友”有所区别。
- source_word: רע
  choice: 朋友
  rationale: 在与עמית并列时译作“朋友”，既符合该词的常见含义，也保留两种相近而不完全相同的关系。
- source_word: לעת
  choice: 一时
  rationale: 可表示“一段时间”或“在适当的时候”；正文采用简洁的“一时”，主要呈现关系有时限的理解，同时以脚注保留时机层面的歧义。
- source_word: ינהגו
  choice: 能相伴
  rationale: נהג在这里的确切语气不易用单一汉语动词复现；结合两种人际关系作主语，译作“能相伴”比直译“行事”更自然，也不过度引入“有用”等原文未明说的观念。
- source_word: ומשניהם
  choice: 但胜过二者的
  rationale: 希伯来文形式本身较简略，但诗句的比较结构以及希腊文ὑπὲρ ἀμφότερα都支持“胜过二者”的意思；加“但”明确汉语中的转折比较。
- source_word: אשה
  choice: 妻子
  rationale: 希伯来文既可指“女人”，也可指“妻子”；希腊文平行文本γυνὴ μετὰ ἀνδρός明确带有婚姻配偶语境，因此正文采用“妻子”，脚注保留较宽泛的词义。
- source_word: משכלת
  choice: 明智的
  rationale: 该词表达有悟性、判断力和实际智慧；“明智的”是自然、庄重且适合智慧文学语境的现代汉语。
theological_decisions:
- issue: אשה应泛指“女人”还是具体指“妻子”
  choice: 妻子
  alternative: 女人
  rationale: 希伯来文本身容许两种理解；希腊文平行文本“与男人／丈夫相配的女人”更具体地指向婚姻关系。正文据此译作“妻子”，但用脚注保留希伯来文的词义宽度。这是文本和语境判断，并非教义性限定。
- issue: לעת强调持续时间有限，还是适时出现或发挥作用
  choice: 相伴一时
  alternative: 在适当的时候相伴／适时相助
  rationale: 希伯来文לעת和希腊文εἰς καιρόν都带有“时间／时机”含义。上下文可理解为关系只能维持一段时间，也可能强调朋友在合宜时机出现；正文采用较顺畅的时限理解，脚注明确保留另一可能。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“能相伴一时”避免生硬直译“行事一时”，也不擅自加入“有用”的功利含义；比较句用“但胜过二者的，是……”呈现原文凝练的格言结构。
