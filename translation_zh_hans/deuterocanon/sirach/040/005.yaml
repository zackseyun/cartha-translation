base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/005.yaml
  text: Yet envy[a], anxiety, and fear, and the dread of death, bring contention in abundance; and at the time of his rest upon his bed[b], the sleep of night changes his misery.
translation:
  language: zh_hans
  text: 然而，嫉妒、忧虑、惧怕和对死亡的恐惧，引起许多争竞[a]；当他躺在床上休息时，夜间的睡眠改变他的苦境[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “引起许多争竞”所译的希伯来语十分凝缩，含义略有不确定。希腊语平行文本列得更详细，还提到愤怒、动荡和争斗。
    reason: alternative_reading
  - marker: b
    text: “苦境”也可译作“困苦”或“患难”。这里大概指受苦的处境，并非道德意义上的“恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קנאה
  choice: 嫉妒
  rationale: 在忧虑、惧怕等折磨人的情绪之列，取负面的“嫉妒”，而非正面的“热心”。
- source_word: דאגה
  choice: 忧虑
  rationale: 表达令人不安、牵挂的心理状态，符合现代汉语习惯。
- source_word: פחד
  choice: 惧怕
  rationale: 直接对应一般意义的恐惧，同时不与后面力度更强的“对死亡的恐惧”混同。
- source_word: אימת מות
  choice: 对死亡的恐惧
  rationale: 保留“死亡”与强烈畏惧之意，措辞自然庄重。
- source_word: תחרה ורב
  choice: 引起许多争竞
  rationale: 原文高度凝缩且解释不确定；此译法表达大量纷扰、争斗的可能含义，同时不按希腊文本扩充项目。
- source_word: ועת נוחו על משכבו
  choice: 当他躺在床上休息时
  rationale: 自然呈现时间关系，并完整保留“休息”和“床榻”的意象。
- source_word: שינת לילה
  choice: 夜间的睡眠
  rationale: 保留希伯来语属格结构的基本意义，又符合现代汉语表达。
- source_word: תשנה
  choice: 改变
  rationale: 直接对应“改变、变更”；希腊语平行文本也支持这一基本义。
- source_word: רעתו
  choice: 他的苦境
  rationale: 此处指受苦者困苦、受折磨的处境，而非道德意义上的邪恶。
theological_decisions:
- issue: 在希伯来文本完整但措辞凝缩处如何使用希腊语平行文本
  choice: 以现存希伯来文为主，将 תחרה ורב 译为“引起许多争竞”，并用脚注说明其不确定性
  alternative: 依希腊语平行文本在正文中明确增列愤怒、动荡和争斗
  rationale: 希伯来文是此处的主要见证；希腊文可帮助确认纷扰、争竞的语义范围，却不足以让正文直接扩写希伯来文没有逐项列出的内容。
- issue: רעתו 是道德之恶还是受苦状态
  choice: 译作“他的苦境”
  alternative: 译作“他的恶”或“他的灾祸”
  rationale: 上下文论及人所承受的忧惧和夜间不安，指向困苦处境，而非道德罪恶。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文两部分的诗性推进；对不确定的凝缩短语不作过度展开，并以脚注交代希腊语平行文本及词义选择。
