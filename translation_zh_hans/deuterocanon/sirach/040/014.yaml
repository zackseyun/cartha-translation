  text: At the opening of his hands they will rejoice[b][a], but the transgressors will suddenly come to an end forever.
translation:
  language: zh_hans
  text: 他一张开双手，众人就欢喜[a][b]；但违犯者将突然地永远消失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的上半句十分艰涩，可能另有一种涉及“民众”和“抢夺”的读法；希腊文作：“他张开双手时，众人就欢喜。”
    reason: alternative_reading
  - marker: b
    text: 马萨达抄本在此仅保存残片；开罗藏经库希伯来文本与希腊文本在上半句有显著差异。
    reason: textual_variant
lexical_decisions:
- source_word: שאתו כפים / ἐν τῷ ἀνοῖξαι αὐτὸν χεῖρας
  choice: 他一张开双手
  rationale: 现存希伯来文此处艰涩，希腊文则清楚表达“他张开双手时”。译文采用自然的现代汉语时间结构，同时在脚注中说明异文。
- source_word: עם עם / εὐφρανθήσεται
  choice: 众人就欢喜
  rationale: 希伯来文读法不明，可能涉及“民众”与“抢夺”；希腊文作“欢喜”。正文依较完整清楚的希腊平行文本，并保留群体性主语。
- source_word: פתאם
  choice: 突然
  rationale: 直接保留希伯来文所表达的突发性和警告力度。
- source_word: לנצח
  choice: 永远
  rationale: 保留希伯来文表示永久、最终结局的含义，不弱化为“彻底”。
- source_word: יתם / ἐκλείψουσιν
  choice: 消亡
  rationale: 希伯来文和希腊文均可指终止、消失；“消亡”简洁庄重，又不额外限定为暴力毁灭。
- source_word: οἱ παραβαίνοντες
  choice: 违犯诫命的人
  rationale: 希腊文明确指越界、违犯者。“违犯诫命的人”比单说“罪人”更贴近行为含义，也避免指定某一套成文法律。
theological_decisions:
- issue: 希伯来文首分句困难时是否采用希腊平行文本
  choice: 正文依希腊文译作“他一张开双手，众人就欢喜”
  alternative: 按现存希伯来文字面勉强理解为涉及“民众”与“抢夺”的一句话
  rationale: 希伯来文首分句很可能传抄不稳，语义难以确定；希腊文保存了连贯读法。正文采用希腊见证，但以脚注公开希伯来异文，不把文本张力隐去。
- issue: 末句与首句的逻辑关系
  choice: 用“但”表达对照
  alternative: 用“所以”表达结果或类比
  rationale: 两类人的结局形成明显反差；原文连接关系并不完全明确，因此采用较自然且不过度建立因果关系的“但”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一……就……”自然表达时间上的紧接；“违犯诫命的人”保持经训语境的分量。脚注标记全部置于相关上半句之后。
