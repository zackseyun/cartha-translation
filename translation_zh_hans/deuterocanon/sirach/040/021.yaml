  text: Flute and harp make song sweet[a], but better than both is a pure tongue.
translation:
  language: zh_hans
  text: 笛和琴使歌声悦耳；胜过二者的，是纯洁的言语。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“胜过二者的，是甜美的舌头”，即“悦人的言语”。
    reason: alternative_reading
lexical_decisions:
- source_word: חליל
  choice: 笛
  rationale: 指管乐器；“笛”是现代中文中简明自然的对应，也与希腊文αὐλός所指的管乐器相符。
- source_word: נבל
  choice: 琴
  rationale: 指拨弦乐器，具体形制难以确定；“琴”既自然庄重，又避免过度限定为现代竖琴或里拉琴。
- source_word: יעריבו
  choice: 使……悦耳
  rationale: 源自动词ערב，表达使之甘美、悦人的意思；用于歌声时译作“使……悦耳”符合现代汉语习惯，并保留使动含义。
- source_word: שיר
  choice: 歌声
  rationale: 可指歌、歌唱；在乐器使其悦耳的语境中，“歌声”比抽象的“音乐”更贴近原词。
- source_word: ומשניהם
  choice: 胜过二者的
  rationale: 字面为“在二者之上／超过二者”；译文保留明确的比较关系，也与希腊文ὑπὲρ ἀμφότερα一致。
- source_word: לשון
  choice: 言语
  rationale: 字面是“舌头”，此处借指人所说的话；“言语”在中文中自然清楚，避免“纯洁的舌头”可能造成的生理性误解。
- source_word: ברה
  choice: 纯洁的
  rationale: 希伯来文最自然地表示纯净、洁净；“纯洁的”保留其可能具有的伦理含义，不按希腊文直接改作“悦人的”。
theological_decisions:
- issue: 末句希伯来文与希腊文的语义差异
  choice: 纯洁的言语
  alternative: 甜美的舌头／悦人的言语
  rationale: 现存希伯来文לשון ברה以“纯洁的言语”为较自然的理解，可能强调言语的纯正或洁净；希腊文γλῶσσα ἡδεῖα则强调甜美、悦人。正文以希伯来文为主，同时用脚注保存希腊平行文本的异读，不消除两者之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“笛和琴”简洁地呈现两类乐器；末句用“言语”表达“舌头”的转喻意义。脚注标记置于整节末尾，明确对应希腊文异读。
