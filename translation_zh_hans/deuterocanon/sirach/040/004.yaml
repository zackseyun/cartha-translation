translation:
  language: zh_hans
  text: 从缠戴头巾和冠饰的人，直到身披皮衣的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“从穿蓝紫色衣服、戴冠冕的人，直到穿粗亚麻布衣的人。”希伯来文与希腊文所用的服饰意象不同，但都表达同一社会范围。
    reason: textual_variant
lexical_decisions:
- source_word: מעוטה
  choice: 小
  rationale: 按形容词理解，与“头巾”连用，表达较小或简朴的头巾；不借希腊文本进一步推定其颜色或社会身份。
- source_word: צניף
  choice: 头巾
  rationale: 指缠裹式头饰；“头巾”是现代汉语中自然、简明且不过度限定样式的对应。
- source_word: וציץ
  choice: 戴花冠
  rationale: ציץ既可指花朵，也可引申为额饰或冠冕；“花冠”保留希伯来文的花卉意象，也与希腊文στέφανον所指的冠饰相呼应。
- source_word: ועד
  choice: 直到
  rationale: 标示范围的另一端，与“从……直到……”构成自然的汉语范围表达。
- source_word: עוטה
  choice: 身披
  rationale: 该分词有覆盖、裹身之意；“身披”既形象，又适合与衣物搭配。
- source_word: שמלת עור
  choice: 兽皮衣
  rationale: 原文直译为“皮制的衣服”；“兽皮衣”简洁保留材质意象，同时避免武断判定是熟皮、粗皮还是生皮。
