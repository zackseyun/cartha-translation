  naturalness: “从头缠小头巾、戴花冠的”在现代汉语中搭配生硬，且“的”后省略“人”使与后半的范围结构略显不匀称。改为“从缠戴头巾和冠饰的人，直到身披皮衣的人”自然、庄重，并保留原文的范围句式。
  terminology: “头巾”可对应צניף；“冠饰”比“花冠”更稳妥地保留ציץ可指花饰、额饰或冠冕的语义余地。“皮衣”直译שמלת עור，不预断其为兽皮、熟皮或生皮。希腊文ὠμόλινον宜译为“粗亚麻布衣”，不宜译作“粗麻衣”，以免将亚麻误限为麻类。
