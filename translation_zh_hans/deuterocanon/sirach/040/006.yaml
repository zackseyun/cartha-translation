  yaml_path: translation/deuterocanon/sirach/040/006.yaml
  text: For a little while[a], like a moment, he is quiet in vain; then, from the terrors of his heart[b], he is shaken—like one fleeing from before a pursuer.
translation:
  language: zh_hans
  text: 他片刻安静，仿佛只是一瞬，却是徒然[a]；他因心中的惊恐[b]而战栗，像在追赶者面前逃跑的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半的希伯来文本较难。开罗藏经库抄本把睡眠中的人比作在追赶者面前逃跑的人；希腊文平行文本也作“像从战争面前逃脱的人”。
    reason: textual_variant
  - marker: b
    text: 现存希伯来文本在某些分行中还保留关于“他心灵的异象”的附加字句；希腊文平行文本则扩展为“在梦中，如同白日站岗时”。正文采用各文本最清楚的共同意思：安歇十分短暂，内心的惊恐随即回来。
    reason: alternative_reading
lexical_decisions:
- source_word: מעט
  choice: 片刻
  rationale: 此处作时间副词，强调安歇极其短暂；“片刻”简洁自然，也与下文“一瞬”形成呼应。
- source_word: לריק
  choice: 却是徒然
  rationale: 该词通常表示“徒然、毫无成效”。这里说明短暂的安静并未真正解除人的困苦；加“却是”清楚呈现语义转折。
- source_word: כרגע
  choice: 仿佛仅仅一瞬
  rationale: 保留比较词כ所表达的比拟，并以“一瞬”传达רגע的短促意味。
- source_word: ישקוט
  choice: 他安静
  rationale: 该动词可指安静、止息或安歇。“安静”贴近原文，又不预先把它限定为睡眠。
- source_word: ומבין
  choice: 随后，他因
  rationale: 此处希伯来文本较难。结合后面的“他心中的惊恐”，译文表达内在惊恐引起震动这一清楚的基本意思，同时用脚注提示文本问题。
- source_word: בהלות לבו
  choice: 心中的惊恐
  rationale: בהלות可指突发的恐惧、惊慌；“心中的惊恐”保留其内在心理来源，也与希腊文“心中的异象”相呼应。
- source_word: נרעש
  choice: 战栗
  rationale: 该词表示受震动、骚动或颤抖。“战栗”兼具身体与情绪受到惊动的意味。
- source_word: כשריד בורח מפני רודף
  choice: 像逃避追赶者的人
  rationale: 这组词的具体构词关系存在文本困难，但核心图像清楚：有人在追赶者面前仓皇逃命。此译保留比喻而不对כשריד的疑难含义作过度确定。
