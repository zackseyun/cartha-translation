  text: The fear of God is like a garden of blessing[b][a], and it shelters more than any glory.
translation:
  language: zh_hans
  text: 敬畏上帝，如同蒙福的伊甸园[a]；它庇护人，胜过一切荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文可译作“如同祝福的伊甸”；希腊平行文本作“如同祝福的乐园”。这里译作“蒙福的伊甸园”，以保留伊甸的园囿意象。
    reason: lexical_alternative
  - marker: b
    text: 末句的希伯来文十分简略。希腊平行文本作“它遮盖他，胜过一切荣耀”，支持这里“庇护”的遮盖、保护之意；正文的“人”作泛指，不限定为特定男性。
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת אֱלֹהִים
  choice: 敬畏上帝
  rationale: 希伯来文本直译为“对上帝的敬畏”。保留“敬畏”这一圣经惯用语，兼含畏惧与崇敬之意；神称采用希伯来文的“上帝”，而不依希腊平行文本改作“主”。
- source_word: כְּעֵדֶן בְּרָכָה
  choice: 如同蒙福的伊甸园
  rationale: עֵדֶן直接唤起伊甸园的意象，希腊文παράδεισος也印证园囿、乐园之义。“蒙福的伊甸园”既保留专名与意象，也以自然汉语表达“祝福之伊甸”的修饰关系。
- source_word: וְעַל כָּל כָּבוֹד
  choice: 胜过一切荣耀
  rationale: 结合希腊文ὑπὲρ πᾶσαν δόξαν，这里的עַל宜作比较义。“胜过一切荣耀”在现代汉语中简洁自然，并保留原文比较关系。
- source_word: חָפְתָה
  choice: 它的荫庇
  rationale: 该词表达遮盖并由此带出的保护意义；希腊平行文本ἐκάλυψαν αὐτόν同样支持“遮盖”。译作“荫庇”保留覆盖与保护的双重意象，又避免擅自补出希伯来短句中没有明说的受词。
theological_decisions:
- issue: 正文中的神称
  choice: 上帝
  alternative: 主
  rationale: 现存希伯来见证作אֱלֹהִים（上帝），应优先采用；希腊平行文本虽作Κυρίου（主），但不足以取代此处清楚的希伯来读法。
- issue: 末句所指的保护对象
  choice: 不明说受保护者，以“它的荫庇”保留省略
  alternative: 它遮盖他／它庇护人
  rationale: 希伯来短句没有明确写出受词，希腊文则有阳性单数受词αὐτόν。正文不强行确定为“他”或泛指“人”，以保存文本的简约与歧义；脚注交代希腊见证。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“敬畏上帝”保留传统圣经语汇；“蒙福的伊甸园”让普通读者直接把握意象；末句以名词性结构“它的荫庇”避免生硬补足受词，同时维持诗句的凝练和平行感。
