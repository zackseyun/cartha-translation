  text: For a shameless man, begging is sweet, but within him it burns like fire.
translation:
  language: zh_hans
  text: 乞讨对厚颜之人虽是甘甜的[a]，却在他内里如火焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面近于“对有强悍心性的人，求取使之甘甜”，但短语及句法含义不完全明确；希腊语平行文本作“在无耻之人的口中，乞讨变得甘甜”，支持正文“厚颜之人”的理解。שאלה 也可译作“求取”或“请求”。
    reason: 保留难解希伯来短语及动词搭配的字面可能，并说明希腊平行文本所支持的语境义。
lexical_decisions:
- source_word: לאיש עוז נפש
  choice: 厚颜之人
  rationale: 希伯来语字面近于“有强悍心性的人”，含义较难确定；结合希腊平行文本 ἀναιδοῦς（无耻、厚颜），此处更可能指厚颜无耻的人，而非值得称赞的刚强者。
- source_word: תמתיק שאלה
  choice: 觉得乞讨甘甜
  rationale: שאלה 可指询问、请求；希腊平行文本 ἐπαίτησις 更明确指乞讨。译作“觉得乞讨甘甜”保留甜味比喻，也符合本节谈论行乞的语境。
- source_word: ובקרבו
  choice: 但这事在他里面
  rationale: קרב 指内部、内里；这里用自然汉语表达内在感受。“但”呈现前后甘甜与焚烧之间的语义转折。
- source_word: תבער כמו אש
  choice: 如火焚烧
  rationale: 保留原文鲜明的火焰明喻；以“这事”承接乞讨这一行为或处境，不额外限定它究竟指羞耻、痛苦还是其他内在煎熬。
theological_decisions:
- issue: 难解短语 לאיש עוז נפש 的解释
  choice: 正文采用表示负面厚颜的“厚颜之人”
  alternative: 刚强的人；心性强悍的人
  rationale: 希伯来语表面可作“有强悍心性的人”，但希腊平行文本明确支持“无耻、厚颜”的理解。正文按语境及古代平行见证表达其负面含义，同时用脚注保留希伯来语的字面可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“厚颜之人”比“无耻之人”略贴近智慧文学的凝练语气；“乞讨甘甜／如火焚烧”保留原文对照鲜明的比喻。
