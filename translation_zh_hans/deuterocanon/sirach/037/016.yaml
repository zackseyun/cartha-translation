  text: A vain laborer for his work[a], a vain guard for one who brings forth evil.
translation:
  language: zh_hans
  text: 做工的人在自己的工作上徒劳；守卫看守那带出恶事的人，也徒劳。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在此另作：“在这一切事上，你要向至高者祈求，使他按真理引导你的道路。”希伯来文与希腊文在这里有重大差异。
    reason: textual_variant
lexical_decisions:
- source_word: פועל
  choice: 做工者
  rationale: 指从事工作的人；“做工者”简洁自然，并与后半句的“守卫”形成具体人物的平行。
- source_word: שוא
  choice: 徒然
  rationale: 此词可表示虚空、无益或徒劳。译作“徒然”保留两小句中重复出现的简练箴言语气，不把含义过度限定为虚假或邪恶。
- source_word: מלאכתו
  choice: 自己的工作
  rationale: 指此人的工作、事务或职分。“自己的工作”准确表达所属关系，也符合现代汉语习惯。
- source_word: שומר
  choice: 守卫
  rationale: 该词表示看守或守护的人。“守卫”既保留人物名词的形式，也与前句“做工者”平行。
- source_word: מוציא רע
  choice: 生出恶事之人
  rationale: 原文直译近于“使恶出来的人”。因具体所指不明确，采用较贴近字面的表达，避免擅自解释为“作恶者”或“说坏话的人”。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本存在重大差异
  choice: 正文依据现存希伯来文翻译，并在脚注列出希腊文的完整不同读法。
  alternative: “在这一切事上，你要向至高者祈求，使他按真理引导你的道路。”
  rationale: 此处希伯来文完整可据，但希腊文并非细微异文，而是内容完全不同的一句。以希伯来文为正文，同时明确保存希腊见证，既不混合两个文本，也不掩盖传本的不稳定性。
translation_notes:
  register: 采用简洁、庄重而可懂的现代标准汉语。保留原文两小句的平行结构和“徒然”的重复；由于希伯来文本身语法简省且含义艰涩，中文仅补入必要的停顿与“也”，不擅自补出因果或条件关系。
