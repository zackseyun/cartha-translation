  text: There is also a wise man whose own understanding is trustworthy to him[a][b].
translation:
  language: zh_hans
  text: 还有一个明辨的人；有谁会比他更信赖自己内心的谋议呢？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“明辨者内心的谋议；有谁会比他更信赖你呢？”后半句的第二人称形式、代词指向和比较结构都较难确定。正文按上下文将其理解为：明辨的人最信赖自己内心的审议。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本差异很大：“有一个精明人，教导许多人，对自己的灵魂却毫无用处。”这很可能反映了不同的希伯来文底本或显著分化的文本传统。
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: 也要
  rationale: 承接上下文，增添另一项劝告；中文以“也要”自然表达连接词与随后祈使语气的结合。
- source_word: עצת לבב
  choice: 内心的谋断
  rationale: 直译近于“心中的谋议”。这里指人在内心所作的思量、判断和决断；“谋断”既保留智慧文学的庄重语气，也不把它简化成纯粹的知识性“理解”。
- source_word: הבין
  choice: 辨明
  rationale: 按祈使语气理解，意为要理解、分辨或留意；“辨明”保留认知和鉴别两方面的含义。
- source_word: מי יאמן לך
  choice: 有谁……更值得你信赖呢
  rationale: 保留希伯来文第二人称和反问结构；אמן在此表达可靠、可信。比较意义与句末ממנו合并在中文中自然呈现。
- source_word: אמן ממנו
  choice: 比自己的心更值得你信赖
  rationale: 将困难而省略的比较结构理解为“比它更可信”。ממנו为阳性，较可能回指阳性的“心”（לבב），因此中文明确为“自己的心”，但以脚注说明句法上的含混。
theological_decisions:
- issue: 内心判断的可靠性是否被表述为绝对原则
  choice: 保留智慧格言的反问式肯定，不增添限制语
  alternative: 译成“自己的心总是最可靠的”或加入关于神引导的解释
  rationale: 原文在当前语境中以比较反问强调内在谋断的可靠性，但并未作“总是”之类的绝对化陈述，也未在本节明说其神学依据；译文不替作者化解这种张力。
- issue: 希伯来文本与所给希腊平行文本显著分歧
  choice: 正文依现存希伯来文翻译，希腊异文置于脚注
  alternative: 采用希腊文“有一个精明人，教导许多人，对自己的灵魂却毫无用处”作为正文
  rationale: 现存希伯来文证据置信度高，且项目要求原文优先；希腊文本反映明显不同的文本传统，应公开保留而不取代希伯来文正文。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“辨明”“谋断”保留原文的劝诫和内在审议意象；反问句保留第二人称及文本本身的张力。
