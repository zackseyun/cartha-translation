translation:
  language: zh_hans
  text: 一切工作的开端是言语；一切行动之前有筹议。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文本在此处的读法很不相同，大意为：“但有一个人总是惧怕；你所知道的、守诫命的人。”这处希伯来文见证似有文本紊乱；正文采用意义连贯的希腊文平行文本。
    reason: textual_variant
lexical_decisions:
- source_word: ἀρχὴ παντὸς ἔργου
  choice: 一切工作的开端
  rationale: 希腊文读法完整连贯；ἀρχή表示“开端”，ἔργον表示工作、事务或所做之事。此处采用简洁的箴言式表达。
- source_word: λόγος
  choice: 言语
  rationale: λόγος语义宽广，在此可指说出的话、商议或经言语形成的想法。“言语”贴近原词，并保留其究竟指发言还是商议的开放性。
- source_word: πρὸ πάσης πράξεως
  choice: 一切行动之前
  rationale: πρό表示时间上的先于，πρᾶξις指行动或行为；“行动”自然清楚，也避免与前句的“工作”完全合并。
- source_word: βουλή
  choice: 谋划
  rationale: βουλή可指商议、筹划、计策或劝告。这里与行动前的审慎思考相配，“谋划”兼顾过程与所得方案。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本严重不符
  choice: 正文采用句法完整、意义连贯的希腊文读法，并以脚注交代希伯来文异读
  alternative: “但有一个人总是惧怕，就是你所知道的那位遵守诫命的人。”
  rationale: 所给希伯来文本虽抄录可信度高，却被标明为重大不符，而且本句疑有文本紊乱；希腊文则形成完整而合乎智慧文学语境的格言。为避免把不稳固的希伯来读法强行解释成确定正文，采用希腊文作正文，同时透明保留希伯来见证。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体中文。分号呈现两个平行分句；“须有”使后半句在汉语中完整自然，但不把βουλή限定为外来的劝告或个人内心的计划。
