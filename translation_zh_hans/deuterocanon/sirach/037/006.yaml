  text: Do not forget a friend in your heart[b][a], and do not neglect him when you have wealth.
translation:
  language: zh_hans
  text: 不要在心里[a]忘记朋友；在你富足时，也不要忽略他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本可读作“在战斗中”；希腊文平行文本作“在你的心里（或心中）”。
    reason: textual_variant
  - marker: b
    text: 现存希伯来文本此处较难：可读作“不要在你的战利品中撇下他们”，其宾语后缀与前文“朋友”不一致。希腊文平行文本作“在你的财物中，也不要不顾念他”。
    reason: textual_variant
lexical_decisions:
- source_word: אל תשכח
  choice: 不要忘记
  rationale: 否定词加未完成式在此表达禁令；“不要忘记”准确、自然。
- source_word: חבר
  choice: 朋友
  rationale: חבר可指朋友、同伴；本节的忠诚伦理语境以“朋友”最贴切。
- source_word: בקרב
  choice: 战斗中
  rationale: 按现存希伯来文本的辅音形式，בקרב可读作“在战斗中”。希腊平行文本所反映的底本或理解则是“在你心里／心中”，故以脚注保留异文。
- source_word: ואל תעזבהן
  choice: 也不要撇下他
  rationale: עזב意为离弃、撇下。传抄形式中的宾语后缀与前文单数阳性“朋友”不一致，可能存在文本讹误；正文依语境以单数“他”表达，但不掩盖问题。
- source_word: בשללך
  choice: 分取战利品时
  rationale: שלל通常指掳物、战利品；介词结构在此可表达处境。结合上句的战斗场景，译为“分取战利品时”较符合希伯来文本的连贯意义。
