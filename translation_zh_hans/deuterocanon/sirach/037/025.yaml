  text: There is a wise man who is wise for many[b][a], but for himself he is worthless.
translation:
  language: zh_hans
  text: 有的智者，对许多人显得有智慧[a]，对自己却毫无用处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “对许多人显得有智慧”也可理解为“为许多人有智慧”“对许多人有智慧”或“在许多人中显得有智慧”。希伯来文此处的关系及动词语态未完全明确。
    reason: lexical_alternative
  - marker: b
    text: “毫无用处”所译的希伯来词 גוֹאָל 词形和词义都较难确定；它也可能含有“污秽”“受玷污”“可厌”等意思。“毫无用处”是依据本句对照所作的概括性翻译。希腊文本在此处则有另一句格言：“人的生命以日数计算，以色列的年日却不可胜数。”因此，希伯来文本与希腊文本在这里差异很大。
    reason: textual_variant_and_lexical_uncertainty
lexical_decisions:
- source_word: יֵשׁ חָכָם
  choice: 有一种智慧人
  rationale: יֵשׁ引出一般性的存在判断；חָכָם为阳性单数，描写一种具有代表性的人。“有一种智慧人”既保留原文形式，也符合汉语箴言式表达。
- source_word: לְרַבִּים הוּא נֶחְכָּם
  choice: 能为许多人显出智慧
  rationale: לְרַבִּים可表示“对许多人”或“为许多人”；נֶחְכָּם为尼法勒式，其语义可介于“有智慧”“成为有智慧”和“显出智慧”之间。译作“显出智慧”避免强行解释为逐渐变得智慧，同时表达其智慧在众人面前或为众人所用。
- source_word: וּלְנַפְשׁוֹ
  choice: 对自己却
  rationale: נֶפֶשׁ在此主要作反身意义，指本人，而非专指形而上的“灵魂”；“却”明确呈现两分句的反差。
- source_word: גֹוֹאָל
  choice: 毫无用处
  rationale: 此词形和词义均较难确定，可能含有污秽、受玷污、可厌或无价值之意。上下文把惠及众人的智慧与本人所得形成反差，因此正文用自然而不过度具体的“毫无用处”，并以脚注保留词义的不确定性。
