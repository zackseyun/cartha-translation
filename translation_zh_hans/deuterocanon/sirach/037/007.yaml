  text: Every counselor waves his hand[b][a], but there is a counselor whose advice is for himself.
translation:
  language: zh_hans
  text: 凡作谋士的，都会提出主张[a]；但也有人献策，是为自己谋利[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“挥动（或举起）手”，此处的确切习语意义不完全明确；希腊文平行文本作“推举／提出意见”，故正文如此译。
    reason: lexical_alternative
  - marker: b
    text: 所给希伯来文本的句末艰涩，字面似为“道路向着嘲弄者”，意义不明。希腊文平行文本作“为他自己献策”；正文据此译为“为自己谋利”。
    reason: textual_variant
lexical_decisions:
- source_word: כל יועץ
  choice: 凡出主意的
  rationale: כל在箴言式概括中具有周遍、逐一的意味；יועץ指提出谋略或劝告的人。译作“凡出主意的”比名词“谋士”更适合此处泛指任何提供意见的人。
- source_word: יניף יד
  choice: 都挥手示意
  rationale: 按希伯来文本保留“举起／挥动手”的具体形象，同时用“示意”让现代读者理解这是摆出姿态、准备发表意见；希腊文“提出意见”也支持其语用含义。
- source_word: אך יש יועץ
  choice: 但有人出主意
  rationale: אך标示转折；יש在这里引出某一类人的存在。这样既保持对比，也使中文句式自然。
- source_word: דרך אל לץ
  choice: 是为自己打算
  rationale: 所给希伯来文本末尾艰涩，字面形式无法在上下文中形成确定而通顺的意义；希腊平行文本εἰς αὐτόν明确指向“为他自己”。因此正文采用“为自己打算”，并以脚注说明文本问题，不把推定伪装成无歧义的希伯来读法。
