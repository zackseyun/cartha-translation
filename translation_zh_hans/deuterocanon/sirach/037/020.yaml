  text: A man's heart tells of his thoughts[b][a], more than seven watchmen on a lookout.
translation:
  language: zh_hans
  text: 人的心比瞭望处的七个守望者更能道出自己的忧虑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “忧虑”所对应的希伯来词词义不确定，也可能指“困扰”“内心所想”或“所关切的事”。本节的希腊文本与此差异很大，意为：“有人言辞机巧，却招人憎恨；这样的人将得不到任何食物。”
    reason: 说明希伯来词的词义不确定，并保留希腊平行文本的重大异文。
lexical_decisions:
- source_word: לב אנוש
  choice: 人的心
  rationale: לב 指人的内在，包括思想、感受和判断；“心”保留希伯来文的人观意象。אנוש 在此泛指人，译作“人”自然且不额外强化性别。
- source_word: יגיד
  choice: 说出
  rationale: נגד 的使役词干有告知、表明之意；“说出”既保留拟人化表达，也适合内心显露内在忧虑的语境。
- source_word: שעיותיו
  choice: 他的忧虑
  rationale: 此词词义不确定，可能指忧虑、困扰、内心所思或所关切之事；“忧虑”在中文中自然，并与守望者察觉危险的比喻相合，但以脚注保留不确定性。
- source_word: משבעה
  choice: 比……七个……更
  rationale: מן 在此作比较用法；中文调整语序，以“比……更”清楚表达比较关系。
- source_word: צופים על מצפה
  choice: 瞭望台上的七个守望者
  rationale: צופים 是守望的人，מצפה 是瞭望处或岗哨；“瞭望台”形象自然，但不必严格理解为特定建筑形式。
