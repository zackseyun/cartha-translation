  text: Every friend says[a], “I love him,” but there is a friend who is a friend in name only.
translation:
  language: zh_hans
  text: 每个朋友都说：“我爱他。”但有的朋友只是名义上的朋友[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语末句十分精简，近似“有朋友——名为朋友”；希腊语平行文本明确作“只是名义上的朋友”。
    reason: 说明原文的压缩表达及希腊平行文本所支持的译法。
lexical_decisions:
- source_word: כל אוהב
  choice: 每个朋友
  rationale: אוהב可指“爱人者”或“朋友”；希腊平行文本Πᾶς φίλος明确支持此处取社交关系意义“朋友”。
- source_word: אומר
  choice: 都说
  rationale: 采用普通、直接的言说动词，保留箴言简洁的语气；“都”在汉语中自然呼应“每个”。
- source_word: אהבתי
  choice: 我也爱他
  rationale: 希伯来语形式简略，希腊平行文本补明“他”和“也”（Ἐφίλιασα αὐτῷ κἀγώ）；现代汉语直引中用“我也爱他”自然地表达其关系宣称，同时不强行凸显完成时态。
- source_word: אך
  choice: 但
  rationale: 简洁表达前后之间的转折：口头声称友爱，不等于真实的友情。
- source_word: יש
  choice: 有的
  rationale: 将存在句按现代汉语习惯译为“有的朋友”，简明自然。
- source_word: אהב שם אהב
  choice: 只是名义上的朋友
  rationale: 希伯来语表达高度压缩，字面包含“名”与“朋友”；希腊平行文本ὀνόματι μόνον φίλος清楚支持“只是名义上的朋友”。
