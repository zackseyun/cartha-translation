revisions:
- from: 也有智慧人，他的智慧使自己得益[a]；他知识的果实落在自己身上[b]。
  to: 也有智慧人，他为自己行事明智[a]；他知识所结的果实归到他自己身上[b]。
  rationale: 修订避免把原文介词“在……上／归于”译成“落在”的动态动作，并收敛前半句的因果性释义。“为自己行事明智”以自然现代汉语表达智慧者的智慧关乎并惠及自己；“归到他自己身上”保留后半句成果归于本人的比喻，同时由脚注交代“身体”的词义与歧义范围。
