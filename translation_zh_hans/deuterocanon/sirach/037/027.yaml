base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/027.yaml
  text: And there is a wise man who is wise for himself[b][a]; the fruit of his understanding is upon his own body.
translation:
  language: zh_hans
  text: 也有智慧人，他为自己行事明智[a]；他知识所结的果实归到他自己身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为自己”原文直译为“为他的生命（或性命）”；这里按反身意义，指他自己从智慧中受益。
    reason: lexical_alternative
  - marker: b
    text: “自己身上”原文为“他的身体”；该词在别处有时可指“尸体”，但这里指活着的本人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: 也有
  rationale: 保留希伯来文的存在句式；“也”自然承接上下文所列举的另一类智慧人。
- source_word: חָכָם ... יֶחְכָּם
  choice: 智慧人，他的智慧使……得益
  rationale: 原文以同一词根的名词和动词形成呼应。中文无法完全复制该构词效果，故重复“智慧”，既保留修辞联系，也表达这种智慧实际作用于本人。
- source_word: לְנַפְשׁוֹ
  choice: 使自己得益
  rationale: נֶפֶשׁ 字面可指“生命”或“性命”，此处带介词 לְ，表示智慧作用于本人、使本人受益；译作“自己”避免引入灵魂与身体二分的技术性含义。
- source_word: פְּרִי
  choice: 果实
  rationale: 保留原文具体的果实意象，同时现代汉语也可自然地用“果实”表示成果或结果。
- source_word: דַעְתּוֹ
  choice: 他的知识
  rationale: דַּעַת 的基本义是“知识、认识”；在智慧文学中可包含实践性的明辨，但此处译作“知识”最直接，也不排除较丰富的含义。
- source_word: עַל
  choice: 落在
  rationale: 原义为“在……之上”。结合“果实”的意象，译作“落在”形成自然中文画面，同时保留成果归于本人之意。
- source_word: גְוִיָּתוֹ
  choice: 自己身上
  rationale: גְּוִיָּה 可指身体，在某些语境中也可指尸体；这里显然指活着并从知识中受益的本人。中文“自己身上”兼顾身体意象和归于本人的惯用表达。
theological_decisions:
- issue: נֶפֶשׁ 的人论含义
  choice: 按反身、关乎本人的意思译为“使自己得益”
  alternative: “为自己的灵魂有智慧”或“为自己的性命有智慧”
  rationale: 本节重点在智慧的成果由谁承受，并非界定“灵魂”为与身体分离的实体；反身译法既符合语境，也避免强加二元人论。
- issue: גְוִיָּה 指活人的身体还是尸体
  choice: 译为“自己身上”，指活着的本人
  alternative: “自己的尸体上”
  rationale: 后半句说明知识的成果归到本人；若译为“尸体”，会造成语境不支持的死亡含义。
- issue: 智慧是自利还是惠及自己
  choice: 表述为“使自己得益”，不加入道德评判
  alternative: “只顾自己”或“自私地运用智慧”
  rationale: 原文说明智慧的受益对象，却没有明确谴责其动机；因此不擅自加入“自私”或“只顾自己”等负面判断。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体中文。前半句以“智慧人／智慧”保留希伯来文 חכם 词根的呼应；后半句保留“知识的果实”这一具体意象。分号对应原文两个彼此解释的分句。
