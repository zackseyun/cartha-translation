review_pass:
  verdict: revise
  source_fidelity: 前半句将“为自己有智慧”释为“他的智慧使自己得益”，基本把握了 לְנַפְשׁוֹ 的反身、受益含义，但将动词的“有智慧／行事明智”明确改写成因果性的“使……得益”，略有扩展。后半句“落在”给 עַל 加入了原文没有的下落动作；原文只说果实“在／归于”他的身体（即他自身）。
  naturalness: 原译整体流畅，适合现代箴言体。“他知识的果实”可理解，但“他的知识所结的果实”在中文中更自然，也更清楚地表达属格关系。以“归到他自己身上”替换“落在自己身上”，既保留成果归于本人的意思，也避免不必要的动态画面。
  terminology: “智慧人”“知识”“果实”均可用。“自己身上”可在语境中指本人，并可由脚注说明希伯来文的“身体”。不应以“尸体”译入正文。
  issues:
  - severity: medium
    issue: “落在自己身上”把 עַל（在……上／归于）具体化为下落动作。
    rationale: 希伯来文没有“落下”的动词；该译法虽通顺，却会使“果实”的比喻呈现为偶然落到人身上的画面，而非智慧成果归于智慧者。
  - severity: low
    issue: “他的智慧使自己得益”比原文的“为自己有智慧”更明确地表达因果结果。
    rationale: 该解释符合上下文，但正文可略收敛为“为自己行事明智”，使反身方向和智慧行为都得到保留。
  - severity: low
