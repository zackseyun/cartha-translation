  yaml_path: translation/deuterocanon/sirach/037/031.yaml
  text: A wise man among his people will inherit honor, and his name will endure for everlasting life.
translation:
  language: zh_hans
  text: 智慧人在民中必承受尊荣；他的名必在永恒生命中长存。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的名必永远长存。”希伯来文直译为“他的名存立在永恒的生命中”；这可能指长久被人记念，也可能含有永恒生命的意味。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本在这里有显著差异：“许多人因贪婪而死，谨慎的人却必增添生命。”正文依据现存希伯来文，另将希腊文作为平行见证列出。
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  choice: 智慧人
  rationale: 指有智慧的人；“智慧人”自然、庄重，也保留希伯来文阳性单数的表达。
- source_word: עם
  choice: 本族中
  rationale: 这里表达智慧人与其所属群体的关系；“本族中”简洁地传达“在自己的人民中”。
- source_word: ינחל
  choice: 必承受
  rationale: 保留 נחל 所含“继承、得为产业”的具体意象，不仅表达一般的获得。
- source_word: כבוד
  choice: 尊荣
  rationale: 在智慧文学语境中指社会性的敬重与声望；“尊荣”比“荣耀”更贴切。
- source_word: שמו
  choice: 他的名
  rationale: 直译原文，并保留“名”可能兼指名声和身后记念的含义。
- source_word: עומד
  choice: 必存留
  rationale: 字面为“站立”，用于“名”时表示持续存在；“存留”符合现代汉语习惯。
- source_word: בחיי עולם
  choice: 直到永恒的生命
  rationale: 保留原文“生命”与“永恒”的措辞，同时不把它完全简化为“永远”，使持久记念与永恒生命之间的张力得以保留。
theological_decisions:
- issue: בחיי עולם 的含义
  choice: 直到永恒的生命
  alternative: 永远；直到万代；在永生中
  rationale: 这句话既可能是表示永久存留的惯用语，也可能带有永恒生命的意味。正文保留生命语言，不将其限定为单纯的身后名声，也不强行引入完整的来世教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“本族中的智慧人”保持格言体的凝练；末句略带原文异质感，以保存其真实歧义。
