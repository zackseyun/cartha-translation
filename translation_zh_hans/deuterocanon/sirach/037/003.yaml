  text: Alas for an evil thought—why were you created, to fill the face of the world with deceit?
translation:
  language: zh_hans
  text: 哀哉，邪恶的意念！你为何被造出来，为要使全世界充满诡诈？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“邪恶的意念啊，你从哪里滚来，要以诡诈遮盖旱地？”它支持把此处难解的希伯来语理解为“意念／计谋”；希腊语作“遮盖”，希伯来语则作“充满”。
    reason: 说明疑难原文及希腊平行文本的异读。
lexical_decisions:
- source_word: הוי
  choice: 哀哉
  rationale: 这是表达悲叹兼斥责的感叹词；“哀哉”庄重凝练，也符合智慧文学的语气。
- source_word: רע יאמר
  choice: 邪恶的意念
  rationale: 现存希伯来语在此难解；若按通常的 אמר 理解，会近于“说话／言语”。希腊平行文本的 ἐνθύμημα 明确指“意念、计谋”，为可能受损或混淆的希伯来语读法提供了重要校正，因此正文采用“意念”。
- source_word: מדוע כן נוצרתי
  choice: 你为何被造出来
  rationale: 按上下文把被人格化的邪恶意念作为受话者。希伯来语所传形式本身有语法人称上的困难，希腊平行文本同样直接向它发问，支持第二人称表达。
- source_word: למלא
  choice: 为要使……充满
  rationale: 忠实表达希伯来语“充满”的不定式及其目的色彩；不以希腊语“遮盖”替换正文。
- source_word: פני תבל
  choice: 全世界
  rationale: 希伯来语字面为“世界的表面”。现代汉语用“全世界”自然表达其范围；相关字面意象及希腊异文在注释中说明。
- source_word: תרמית
  choice: 诡诈
  rationale: 该词指欺骗、奸诈；“诡诈”兼具道德分量和庄重语体，也与希腊语 ἐν δολιότητι 相符。
theological_decisions:
- issue: 希伯来语主要见证与希腊平行文本对疑难词的共同使用
  choice: 把本节理解为对“邪恶的意念”的人格化斥责
  alternative: “邪恶的言语”或“邪恶的同伴”
  rationale: 希伯来语 רע יאמר 按现存形式难以顺畅解释，而希腊文本明确作“邪恶的意念／计谋”。正文让希腊文本澄清疑难名词，同时仍以希伯来语的“充满”等措辞为主，避免把整句改写成希腊版本。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“哀哉”保留智慧文学中悲叹与斥责并存的语气；正文句法力求自然，同时不消除“为何被造、为要……”所包含的修辞张力。
