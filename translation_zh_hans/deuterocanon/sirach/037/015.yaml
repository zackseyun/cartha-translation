  text: And more than all this, pray to the Most High that he may direct your way in truth.
translation:
  language: zh_hans
  text: 在这一切之上，还要向至高者祷告，求他按真理指引你的道路。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的文本见证有错位。开罗藏经库现存希伯来文大意是：“同恶人谈报答恩惠，同残忍的人谈肉身的好处”，在这里与上下文难以衔接；本条所附的希腊平行文本则说，人的心有时比七个高处守望者更能告知他，也与正文内容不符。正文采用本节通行希腊文本所保存的祈祷与引导之意。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐπὶ πᾶσι τούτοις
  choice: 在这一切之上，还要
  rationale: 表达递进和强调，既保留“在这一切之上”的结构，也以“还要”自然承接上下文的劝诫。
- source_word: δεήθητι ὑψίστου
  choice: 向至高者祷告
  rationale: “至高者”保留犹太智慧文学中的神圣称号；“祷告”自然表达向神祈求的动作。
- source_word: κατευθύνῃ
  choice: 指引
  rationale: 兼有使道路正直、引导方向之意；“指引”在现代汉语中清楚自然，又不把结果解释得过于具体。
- source_word: ὁδόν σου
  choice: 你的道路
  rationale: 保留智慧文学中“道路”兼具人生行程、行为方向和道德道路的意蕴。
- source_word: ἐν ἀληθείᾳ
  choice: 按真理
  rationale: 保留“真理”与“真实、正直”之间的语义张力；“按”表达引导所遵循的准则，不强行限定为单纯的方式状语。
theological_decisions:
- issue: 现存希伯来文本、所附希腊平行文本与本节传统内容彼此错位
  choice: 正文采用本节通行希腊文本所保存的祈祷与引导之意，并明确加注文本问题
  alternative: 直译现存希伯来文：“同恶人谈报答恩惠，同残忍的人谈肉身的好处”；或直译所附希腊平行：“人的心有时惯于告诉他，比坐在高处瞭望的七个守望者更可靠。”
  rationale: 所给希伯来文在本节位置语境不连贯，而所附希腊句本身也不是“向至高者祷告”的内容，显然存在节次或材料错位。正文采用由审校资料中的希腊词项及通行文本支持、且与上下文连贯的读法，同时在脚注中如实保留见证冲突，不把任何一种错位材料悄然当作无争议原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至高者”“道路”“真理”保留智慧文学的传统意象和神学张力；句式简洁，适合普通读者朗读。
