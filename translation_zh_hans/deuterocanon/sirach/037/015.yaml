    reason: textual_variant
  revision_rationale: 保留草稿所采取的、与本节传统希腊读法及上下文相符的正文；微调汉语表达，并重写脚注以明确区分“所附但错位的希腊平行句”和“作为正文依据的本节传统希腊读法”。这既不把损坏或错位的希伯来文强行译入正文，也不错误声称所附希腊句支持正文。
