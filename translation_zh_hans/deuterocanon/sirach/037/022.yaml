  text: The beginning of every deed is a word[c][b][a], and the beginning of every work is a thought.
translation:
  language: zh_hans
  text: 每一件事的开端是一句话[b]；每一项工作的开端是一个想法[c]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证在此作另一句格言：“有人为自己有智慧；他悟性的果实在他口中是可信的。”
    reason: alternative_reading
  - marker: b
    text: “一句话”所译的希伯来词也可指“事情”或“事物”。
    reason: lexical_alternative
  - marker: c
    text: “一个想法”也可译作“计划”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש
  choice: 开端
  rationale: 此处表示先于行动或工作、处在起始位置的事物；“开端”自然庄重，并能保留两分句的平行结构。
- source_word: כל
  choice: 每一
  rationale: 采用分配义，表达格言对各种行为与工作的普遍概括。
- source_word: מעשה
  choice: 事
  rationale: 指所做之事或行动；译作“事”简洁自然，同时与下句“工作”略作区分。
- source_word: דבר
  choice: 言语
  rationale: דבר 可指“话、言语”，也可指“事情、事物”。在这里取“言语”，使外在言说与内在思想形成对应，但以脚注保留另一可能。
- source_word: פועל
  choice: 工作
  rationale: 可指工作、劳作或作为；“工作”符合现代汉语，并与 מעשה 的“事”保持近义而不完全重合。
- source_word: היא
  choice: 是
  rationale: 阴性代词与 מחשבת 呼应，在句中起系词作用；汉语用“是”清楚表达判断关系。
- source_word: מחשבת
  choice: 思想
  rationale: 该词可表示思想、意念、谋划或计划；“思想”保留较宽泛的意义，避免把格言限缩为具体规划。
theological_decisions:
- issue: 现存希伯来文与希腊文平行见证明显不同
  choice: 正文依照现存希伯来文翻译，并在脚注中完整说明希腊文的异读。
  alternative: 按希腊文译作：“有人只对自己有智慧，他悟性的果实在他口中是可信的。”
  rationale: 本节希伯来文本身完整且可信度高，故应作为正文依据。希腊文保存的是另一句格言，不能与希伯来文静默调和；脚注可透明保留其见证。
translation_notes:
  register: 采用简洁、对称的格言体，以两个“每一……的开端是……”保留希伯来文平行结构。用“言语”和“思想”呈现外在表达与内在思虑的张力，同时通过脚注保留词义歧义和希腊文异读。
