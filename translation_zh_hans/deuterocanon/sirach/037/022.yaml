  naturalness: 原文简洁且平行，但“言语”“思想”均为抽象名词，读起来略显生硬。“一句话”与“一个想法”在现代标准汉语中更自然，也更清楚地呈现“话语／内在思虑”的对应。希腊文脚注中“只对自己有智慧”容易误导为“智慧只限于自己”，应改为较中性的“为自己有智慧”。
