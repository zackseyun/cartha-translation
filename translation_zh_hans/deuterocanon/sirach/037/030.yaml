  naturalness: “智慧人自己必饱享喜乐”略显生硬；“智者必饱享欢愉”更合现代庄重书面汉语。“欢愉”比“喜乐”更贴近תענוג所指的愉悦、享受，且避免将其窄化为偏宗教或情绪性的“喜乐”。
  terminology: 将“智慧人”改为常用的箴言体称谓“智者”。“有福”恰当对应“称为幸福／有福”，不应改为“祝福”。希腊文χολέρα在古代语境主要指胆汁性病症；直接以现代医学意义的“霍乱”作首选会造成时代错置，宜以“胆汁性疾病”为主，并说明传统译法。
