  yaml_path: translation/deuterocanon/sirach/037/030.yaml
  text: A wise man for himself will be filled with delight[b][a], and all who see him will call him happy.
translation:
  language: zh_hans
  text: 智者必饱享欢愉[b]；凡看见他的人都称他有福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“凡看见他的人”；末词的传抄形式在拼写上似不规则，但从上下文可清楚理解其含义。
    reason: textual_variant
  - marker: b
    text: 希腊文在这里有显著不同的一句：“因为食物繁多，必有痛苦；贪食会使人濒临胆汁性疾病。”其中末词传统上也译作“霍乱”。主文采用开罗藏经库抄本所保存的希伯来文；在希伯来文尚存之处，本译本以它为主要文本依据。
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  choice: 智慧人
  rationale: 该词为阳性单数，指有智慧的人；译作“智慧人”既保留原文形式，也符合箴言式表达。
- source_word: לנפשו
  choice: 自己
  rationale: נפש在这里指自身、本人，并非专指非物质的“灵魂”；“自己”自然地保留了反身含义。
- source_word: ישבע
  choice: 必饱享
  rationale: שבע表示饱足、满足；与“喜乐”搭配译作“饱享”，既传达充分享有之意，也保留该词隐含的饱足意象。
- source_word: תענוג
  choice: 喜乐
  rationale: 该名词可指愉悦、享受；“喜乐”庄重自然，并适合本句所说的满足状态。
- source_word: ויאשרוהו
  choice: 都称他有福
  rationale: אשר在此表示称某人为有福、幸运，并非施予盟约意义上的祝福；“称他有福”准确保留公开认可之意。
- source_word: כל רואינו
  choice: 凡看见他的人
  rationale: 传抄形式的末词拼写似不规则，但从平行结构和语境可清楚理解为“所有看见他的人”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“必饱享喜乐”保留希伯来文的饱足意象；分号呈现两分句之间由个人所得喜乐转向众人认可的平行关系。脚注标记按其所说明的词句分别置于“喜乐”和全句末尾。
