  text: Good and evil[a], life and death—over them all the tongue rules.
translation:
  language: zh_hans
  text: 善与恶[a]，生与死——舌头统管这一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行经文作：“智慧人必充满福分，凡看见他的人都要称他有福。”这里的希腊文与现存希伯来文差异显著。
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: 善
  rationale: 与רעה构成鲜明的反义配对；“善”保留其宽广的道德与经验含义，不限于物质上的福祉。
- source_word: רעה
  choice: 恶
  rationale: 在“善与恶”的固定对举中，“恶”最能保留希伯来文的强烈两极性；虽也可能涉及祸患或灾难，但与“生与死”并列时宜取概括性表达。
- source_word: חיים
  choice: 生
  rationale: 与מות组成惯常的两极统称；用“生与死”简洁自然，也符合本节格言式节奏。
- source_word: מות
  choice: 死
  rationale: 与חיים直接相对；“生与死”是现代汉语中自然、庄重的固定搭配。
- source_word: ומושלת
  choice: 统管
  rationale: 源自动词משל，表示掌权、管辖。“统管”既传达支配范围与力度，又保持简洁。
- source_word: בם כליל
  choice: 这一切
  rationale: 表达舌头的管辖遍及前述善恶、生死全部领域；结合“统管”即可自然传达“在它们所有之上”的全面范围。
- source_word: לשון
  choice: 舌头
  rationale: 保留希伯来文的具体意象，以“舌头”借指言语，符合智慧文学常见的格言表达。
theological_decisions:
- issue: 现存希伯来文与差异显著的希腊文平行经文之间的关系
  choice: 正文以现存希伯来文为准：“善与恶，生与死——舌头统管这一切。”
  alternative: 希腊文作：“智慧人必充满福分，凡看见他的人都要称他有福。”
  rationale: 本节有可信度高的现存希伯来文，故以其为正文。希腊见证并非近似的逐词对应，而是内容显著不同的异文，可能反映不同的文本阶段或经文位置；为保持文本透明度，将其列入脚注而不取代希伯来正文。
translation_notes:
  register: 采用现代、凝练、庄重的智慧文学格言体。“善与恶，生与死”保留两组对举；破折号突出结论。“舌头”保留原文隐喻，不解释性改写为“言语”。
