base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/010.yaml
  text: 'For he too will think for himself: “Why should this fall to him?”[a][b]'
translation:
  language: zh_hans
  text: 因为他也会为自己盘算：“这事为什么该落到他身上呢？”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文简短而较难理解。希腊文平行文本作：“不要同斜眼看你的人商议；要向嫉妒你的人隐瞒你的计划。”这支持了如下理解：对方是出于私利或恶意盘算。
    reason: alternative_reading
  - marker: b
    text: 或译：“因为他也会想到自己：‘这事为什么会临到他呢？’”希伯来文容许不同理解：末尾的代词可能指那位出主意的人，也可能指另一个人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: 因为
  rationale: 承接上下文，说明不可向这种人求教的缘由；“因为”在现代汉语中自然清楚。
- source_word: גם הוא
  choice: 他也
  rationale: 保留希伯来语的附加语气，指出此人同样会从自身角度考虑。
- source_word: לנפשך
  choice: 为自己
  rationale: 传抄文本字面近于“为你的性命/自己”，语义较难；结合上下文及希腊文平行文本所反映的敌意或嫉妒，以“为自己”表达自利的盘算，同时在脚注中保留不确定性。
- source_word: יחשב
  choice: 盘算
  rationale: 该词可指思想、估量或谋划；“盘算”既符合智慧文学语境，也传达出基于个人利害的考虑。
- source_word: למה זה
  choice: 这事为什么
  rationale: 自然表达希伯来语的疑问短语，并保留其反问色彩。
- source_word: אליו יפול
  choice: 该落到他身上
  rationale: 保留“落到”这一原文意象；“该”使汉语反问更自然，但不限定究竟是得到某事还是遭遇某事。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的智慧文学语体。“盘算”比单纯的“想”更能体现上下文中的自利考量；正文保留“落到他身上”的隐喻和指代含混，并以脚注交代希伯来文本身的困难及希腊文平行读法。
