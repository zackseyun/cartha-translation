base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/011.yaml
  text: He will speak to you of the good of your way[a], and then stand opposite to watch your downfall.
translation:
  language: zh_hans
  text: 他会对你说，你所走的路很好[a]，然后站在对面，看着你的困境。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处简略，含义略有不确定。末句也可译作“看着你的不幸”或“看着你的贫穷”。本节的希腊文平行文本则保存了一段更长的警告，列举了不应倚赖其意见的各类人。
    reason: 说明疑难词的其他译法，以及希伯来文与希腊文平行文本的显著差异。
lexical_decisions:
- source_word: ואמר לך
  choice: 他会对你说
  rationale: אמר是普通的“说、告诉”；此处保留直接对话和将来或习惯性语气。
- source_word: מטוב דרכך
  choice: 你所走的路很好
  rationale: 希伯来语表达紧缩，מן与טוב的关系并不完全明确；译文按语境理解为对对方所选择的道路表示赞许，同时保留“路”的智慧文学意象。
- source_word: דרכך
  choice: 你所走的路
  rationale: דרך可指实际道路，也常比喻人的行事方向；此译法自然且保留原文比喻。
- source_word: וקם מנגד
  choice: 然后站在对面
  rationale: וקם直译为“起来/站立”，מנגד表示“在对面、相对而立”；不额外加入原文未明说的转折或敌对含义。
- source_word: להביט
  choice: 看着
  rationale: הביט指专注观看；“看着”简洁自然，并传达袖手旁观的语境效果。
- source_word: רישך
  choice: 你陷入困境
  rationale: 此词形困难，可能与贫穷、缺乏或灾祸有关。“陷入困境”以自然中文表达负面处境，同时不把词义过度限定为经济贫困或彻底败亡。
theological_decisions:
- issue: 希伯来文与希腊文平行文本在本节内容上不一致
  choice: 正文以现存希伯来文为主，希腊文仅用于语境核对
  alternative: 按照希腊文译出一整列不宜向其求教的人
  rationale: 现存希伯来文虽简短且末词有疑难，但证据置信度高；因此不以内容更完整的希腊平行文本取代它，而在脚注中如实说明差异。
- issue: 末词רישך的语义范围
  choice: 译作“你陷入困境”
  alternative: “你的贫穷”“你的不幸”“你的败落”
  rationale: 该词可能涉及贫乏、困顿或灾祸。正文采用范围较宽的表达，以保留真实的不确定性，避免将其教义化或过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你所走的路”保留智慧文学中的道路意象；“站在对面”保留空间隐喻；未擅自添加“却”等强转折词。
