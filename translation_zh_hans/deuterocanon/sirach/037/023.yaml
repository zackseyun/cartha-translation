  text: A wise man instructs his own people, and the fruits of his understanding are trustworthy.[a][b]
translation:
  language: zh_hans
  text: 智慧人教导自己的百姓；他的悟性所结的果实是可靠的。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本在此处十分难解，与希腊文本差异显著。正文采用较清楚的希腊见证：“智慧人教导自己的百姓；他的悟性所结的果实是可靠的。”
    reason: textual_variant
  - marker: b
    text: 希伯来见证按字面大致保存为：“心中谋略的拔除（或根、冠冕）；四个肩膀（？）将开花。”但原文含义不确定，很可能已有讹误或保存不全。
    reason: alternative_reading
lexical_decisions:
- source_word: עקרת תחבולות לבב
  choice: '[正文未采用]'
  rationale: 现存希伯来文本语意极其晦涩，且很可能有讹误或保存不全；若强行直译，无法形成可靠而自然的经文。正文因此依照清楚的希腊平行文本，并在脚注中保留希伯来异文。
- source_word: ἀνὴρ σοφός
  choice: 智慧人
  rationale: 保留阳性单数所表达的智慧者形象；“智慧人”符合中文智慧文学的庄重语体，也不额外限定年龄。
- source_word: τὸν ἑαυτοῦ λαόν
  choice: 自己的百姓
  rationale: “百姓”自然对应 λαός，“自己的”明确保留 ἑαυτοῦ 的反身强调。
- source_word: παιδεύσει
  choice: 教导
  rationale: 此词可指教育、训练或管教；在本节智慧教诲的语境中，“教导”最自然。希腊文虽为将来时，格言式陈述在现代汉语中用一般陈述更为流畅。
- source_word: οἱ καρποὶ
  choice: 所结的果子
  rationale: 保留希腊文复数“果子”的比喻，同时用“所结的”使它与“悟性”的关系在中文中自然清楚。
- source_word: τῆς συνέσεως αὐτοῦ
  choice: 他悟性
  rationale: σύνεσις 指理解力、洞察或明辨；“悟性”简洁而适合智慧文学语境。
- source_word: πιστοί
  choice: 可靠
  rationale: 此处说明这些果子或成果值得信赖、经得起验证；“可靠”比“忠信”更符合非人格性主语。
theological_decisions:
- issue: 希伯来见证与希腊见证之间的显著差异
  choice: 正文采用语意清楚的希腊平行文本，并以脚注公开说明希伯来异文
  alternative: 按现存希伯来文字面勉强译作“心中谋略的根（或冠冕）；四个肩膀（？）必开花”之类
  rationale: 希伯来文本难以得到连贯、可信的意义，而希腊文本完整清楚。采用希腊见证可避免把推测写入正文，同时脚注保留真实的文本张力，不掩盖异文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话，保持智慧文学的格言感。分号呈现两个彼此关联的分句；正文不强行解释晦涩的希伯来文，而通过双脚注如实呈现文本问题。
