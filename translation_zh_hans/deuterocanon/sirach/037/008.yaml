translation:
  language: zh_hans
  text: 每个谋士都说：“看！”[a]但也有谋士践踏他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看”所译的希伯来文含义不确定，可能是简短地声称自己有洞见，或向人指示方向。希腊文平行文本则较长，警告人要提防谋士，因为谋士也会为自己谋算。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“在他身上践踏”，可能表示伤害他或利用他。
    reason: lexical_alternative
lexical_decisions:
- source_word: כל יועץ
  choice: 每个谋士
  rationale: 将 כל 按箴言式的逐一概括理解为“每个”；“谋士”保留 יועץ 在智慧文学中出谋献策者的含义及本节的重复。
- source_word: אומר
  choice: 都说
  rationale: 用一般现在式表达格言性的陈述；“都”使汉语中的全称关系自然清楚。
- source_word: חזה
  choice: 看哪！
  rationale: 原词简短且意义不确定，可能是自信的指点或声称有洞见；“看哪”保留其突兀的命令语气，不在正文中消除歧义。
- source_word: אך
  choice: 但
  rationale: 明确呈现概括陈述与随后警告之间的转折。
- source_word: דורך עליו
  choice: 践踏他
  rationale: דורך 的字面意象是踩踏、践踏，עליו 是“在他之上／对他”；此处或暗示损害、利用，正文保留具体意象，脚注说明可能的惯用含义。
theological_decisions:
- issue: 希伯来文本简晦，而希腊平行文本较完整
  choice: 正文以现存希伯来文为准，保留“看哪”和“践踏他”的简晦表达
  alternative: 依希腊文译作：“要提防谋士，先弄清他有什么需要；因为他也会为自己谋算，免得他抽签害你。”
  rationale: 现存希伯来文在本项目中具有优先地位；希腊文显示本节涉及自利且可能伤人的劝谋，但其措辞明显更长，因此不以希腊文补写正文，只在脚注中交代文本差异。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“谋士”略具古典色彩，但在此处比“顾问”更符合格言和劝诫语境。脚注标记均置于相关正文之后。
