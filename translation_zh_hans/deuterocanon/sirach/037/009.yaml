  text: Guard yourself from a counselor[a], and know beforehand what his need is.
translation:
  language: zh_hans
  text: 你要提防谋士，并预先知道他的需要是什么。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “需要”也可译作“所求”或“切身利益”；希伯来文除严格意义上的需要外，也可指一个人所关切的利益或驱使他的动机。希腊文平行文本则以不同方式扩展这层意思：“他会站在对面，看你将遭遇什么。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מיועץ
  choice: 给你出主意的人
  rationale: יועץ指提供谋略或建议的人；结合介词מן与“提防”，译文表达“对这类人保持警惕”的意思。此处不宜笼统理解为所有谋士，而是承接上下文，警戒可能怀有自身动机的献策者。
- source_word: שמור נפשך
  choice: 要提防
  rationale: 字面为“保护你的性命／自己”。在此语境中是劝人谨慎防备，现代汉语用“要提防”自然地传达反身警戒的语气，而不局限于保护肉身生命。
- source_word: ודע לפנים
  choice: 也要事先弄清
  rationale: לפנים在此作时间副词，表示“预先、事先”；“弄清”比单纯“知道”更符合审察献策者动机的语境。
- source_word: מה צרכו
  choice: 他有什么需求
  rationale: צרך可指需要、所求，也可延伸为切身利益或动机。正文保留较贴近希伯来文的“需求”，不把潜在含义直接限定为“私心”或“企图”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的劝诫语体。“给你出主意的人”比“谋士”更易为普通读者理解；“需求”保留原文在需要、利益与动机之间的语义张力，并借脚注说明希腊平行文本的差异。
