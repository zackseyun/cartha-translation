  terminology: “智慧人”可保留，符合庄重的经文语体。“美味的食物”恰当传达 מַאֲכָל תַּעֲנוּג。脚注中将“本族”改为“自己的民”，避免将 λαῷ αὐτοῦ 不必要地限缩为族裔，并将“承受信任”调整为自然的“获得信任”。
