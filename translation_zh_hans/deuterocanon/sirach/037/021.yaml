  text: And with all these things[a], pray earnestly to God, who will truly direct your steps.
translation:
  language: zh_hans
  text: 并且，在这一切事上[a]，要恳切地向上帝祷告；他必确实使你的脚步稳固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“因为主没有赐给他恩惠，因为他被剥夺了一切智慧。”本节希伯来文本与希腊文本差异很大；正文依照现存希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: ועם כל אלה
  choice: 除了这一切，还要
  rationale: 保留ועם的附加和承接作用，表明祷告是在前述各项劝告之外仍须做的事；现代汉语中“除了这一切，还要”自然清楚。
- source_word: עתר
  choice: 恳切地……祷告
  rationale: 该动词含恳求、切求之意；“恳切地祷告”兼顾祷告对象与语气强度。
- source_word: אל אל
  choice: 向上帝
  rationale: 前一אל是介词“向”，后一אל是神的称谓；译作“向上帝”符合汉语表达，也不引入原文没有的圣约名称。
- source_word: אשר
  choice: 他
  rationale: 关系词指向上帝；分句后用“他”较现代、自然，同时明确神是行动主体。
- source_word: יכין
  choice: 使……稳固
  rationale: כון的使役式可指建立、坚立或使稳固；与“脚步”搭配时既可涵盖引导人生道路，也保留原文“坚立”的具体意象，避免只译成“指引”而缩窄词义。
- source_word: באמת
  choice: 按真理
  rationale: 该词可表示“真实地、确实地、忠信地”或“在真理中”。“按真理”保留其名词意象及真实、可靠的语义张力，不将其单一定为方式副词“确实”。
- source_word: צעדיך
  choice: 你的脚步
  rationale: 直译并保留希伯来文以脚步喻人生道路和行动方向的表达；现代汉语也能自然理解。
theological_decisions:
- issue: 希伯来文本与希腊文本的关系
  choice: 正文采用现存希伯来文关于恳切祷告和上帝坚立脚步的劝告。
  alternative: 希腊见证：“因为主没有赐给他恩典，因为他被剥夺了一切智慧。”
  rationale: 本节希伯来文保存完整且来源可信，应作为正文依据；希腊文反映的是内容显著不同的异文，不能无声地取代希伯来文，因此在脚注中完整保留。
- issue: יכין באמת的神学与语义张力
  choice: 译作“按真理使你的脚步稳固”。
  alternative: “确实指引你的脚步”或“忠信地坚立你的脚步”。
  rationale: 原文既可能强调上帝行动的真实性、可靠性，也可能强调按真理而行；同时יכין兼有坚立与引导的含义。正文保留这种开放度，不把它限定为单纯的方向指引或确定性保证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恳切地向上帝祷告”表达切求的力度；“脚步稳固”保留圣经式人生道路隐喻而不过度古雅。脚注标记置于引出异文差异的承接语之后。
