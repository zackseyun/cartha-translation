  text: For not everything is beneficial for everyone, and not every person delights in every kind of thing.[a]
translation:
  language: zh_hans
  text: 因为并非一切事物都对人人有益，也不是每个人都喜爱每一种事物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库的希伯来文在本节较难理解，与希腊文也不甚相符。直译为：“有一位智者，为自己的民众行事明智；他知识的果实在他们的身体中。”鉴于两种见证的差异，正文采用希腊文，并在此保留希伯来文读法。
    reason: textual_variant
lexical_decisions:
- source_word: οὐ γὰρ πάντα πᾶσιν συμφέρει
  choice: 因为并非一切事物都对人人有益
  rationale: 现存希伯来文与希腊文在本节明显不相符；希腊文构成语意连贯的平行见证。συμφέρει 表示“有益、有利”，οὐ γάρ 自然译为带解释意味的“因为并非”。
- source_word: πᾶσιν
  choice: 对人人
  rationale: 保留原文所表达的普遍范围，同时用现代汉语简洁表达。
- source_word: οὐ πᾶσα ψυχὴ
  choice: 也不是每个人
  rationale: ψυχή 在这里指具体的人，而非专门讨论“灵魂”；译作“每个人”可避免加入原文没有的人论含义。
- source_word: ἐν παντὶ εὐδοκεῖ
  choice: 都喜爱每一种事物
  rationale: εὐδοκεῖ 在此表示喜欢、乐于或满意；“喜爱”自然庄重，“每一种事物”保留 ἐν παντί 的宽泛所指。
- source_word: וְיֵשׁ חָכָם לְעַמּוֹ יֶחְכָּם, פְּרִי דַעְתּוֹ בִּגְוִיָתָם
  choice: 见脚注所列希伯来文异读
  rationale: 这句现存希伯来文直译与希腊文差异很大，且本节文本存在错置或传抄不稳定的可能；不把两种读法强行揉合，而将希伯来见证完整保留在脚注中。
theological_decisions:
- issue: 现存希伯来文与希腊文见证不一致
  choice: 正文依从语意连贯的希腊文见证，并在脚注注明希伯来文读法
  alternative: 正文直译现存希伯来文：“又有一位智慧人，为他的人民显出智慧；他知识的果实在他们身体之中。”
  rationale: 现存开罗藏经库希伯来文在此难解，且与希腊文并不密切对应。采用希腊文正文能保留上下文中关于事物并非适合所有人的劝诫，同时脚注不掩盖高置信度但存在轻微错配标记的希伯来见证。此决定属于文本批判取舍，不作教派性解释。
translation_notes:
  register: 采用现代、清楚而庄重的智慧文学语体。“人人／每个人／每一种”保留原文反复出现的普遍性表达；脚注明确呈现文本差异，不将两种不同读法合并或默默消解。
