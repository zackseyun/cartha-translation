  text: But with one whose heart is like your heart[a], if you stumble[b], he will be affected also.
translation:
  language: zh_hans
  text: 但对于那心与你相同的人，你若跌倒，这事也会波及他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句很简约，直译近于：“你若跌倒，它会到达他。”这里“它”所指未明，可能指你的跌倒、困境或其后果；“波及他”保留这一含糊性。希腊文现存本节的内容与这句希伯来文显著不同。
    reason: textual_and_ambiguity_note
lexical_decisions:
- source_word: אך
  choice: 但要
  rationale: 承接上文形成转折或限制；结合本句关于选择商议对象的语境，用“但要”自然引出正面的例外。
- source_word: עם לבבו כלבבך
  choice: 与那和你同心的人商议
  rationale: 希伯来文直译近于“与那心如你心的人”。“同心”保留“心”的意象，并自然表达内在意向相契；“商议”依据上下文补出，使中文句子完整。
- source_word: אם תכשל
  choice: 你若跌倒
  rationale: 保留 כשל 的跌倒隐喻，不限定为道德失败、判断失误或实际遭难。
- source_word: יגיע אליו
  choice: 祸患也会临到他
  rationale: 原文直译为“它会到达他”，主语未明。“祸患”根据“跌倒”所带来的不利后果作最低限度补足，而“临到”保留“到达”的动态意象。
theological_decisions:
- issue: לבב 所指的内在人
  choice: 同心
  alternative: 他的心和你的心一样
  rationale: “同心”既保留希伯来文“心”的圣经人观，也比逐字表达更符合现代汉语；此处不仅指情感，也包括意向和判断。
- issue: יגיע אליו 的隐含主语
  choice: 祸患也会临到他
  alternative: 这也会波及他／他也会受影响
  rationale: 希伯来文没有明说“到达他”的是什么。正文为可读性补出“祸患”，脚注注明原文的简约和歧义，避免断言他本人也必然跌倒。
- issue: 与希腊平行文本的明显差异
  choice: 以现存希伯来文为正文依据
  alternative: 按希腊文译为心的变化、善恶、生死和舌头
  rationale: 所给希伯来文与希腊文在本节内容上并不对应。因希伯来来源置信度高，正文忠实翻译希伯来文，并以脚注提示文本传统差异，不把希腊内容混入正文。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“同心”“跌倒”“临到”保留希伯来文的核心意象；正文适度补足上下文所隐含的“商议”和后果性的主语，并用脚注公开说明。
