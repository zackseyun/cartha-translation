  yaml_path: translation/deuterocanon/sirach/037/029.yaml
  text: A man's life is a numbered span of days, but the life of the people of Israel is days without number.
translation:
  language: zh_hans
  text: 人的一生，日子有数；但以色列民的生命，日子无数。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而以色列民的生命，日子无数。”希伯来文的连接词也可直译为“而／和”，但这里的上下句具有对照意味。
    reason: 保留连接词וְ兼具并列和语境性转折的歧义。
lexical_decisions:
- source_word: חַיֵּי אִישׁ
  choice: 人的一生
  rationale: 直译为“一个人的生命／一生”；“人的一生”在现代汉语中自然，也保留个体生命的泛指意义。
- source_word: מִסְפַּר יָמִים
  choice: 日子有数
  rationale: 保留“数目”与“日子”的具体意象，简洁表达个体寿命有限，并与下句“日子无数”形成鲜明对照。
- source_word: וְחַיֵּי עַם יִשְׂרָאֵל
  choice: 但以色列民的生命
  rationale: 连接词וְ本义可作“而且／和”，但平行结构呈现明显转折，因此正文译作“但”；同时以脚注保留较直译的可能。
- source_word: עַם יִשְׂרָאֵל
  choice: 以色列民
  rationale: 准确保留“以色列的人民”这一集体含义，比单译“以色列”更能显明经文所对照的是个人与民族共同体。
- source_word: יְמֵי אֵין מִסְפָּר
  choice: 日子无数
  rationale: 贴近希伯来文“没有数目的日子”，并与上句“日子有数”对应，保留其修辞力度和潜在的神学张力。
theological_decisions:
- issue: 个人有限的寿命与以色列民集体延续之间的对照
  choice: 译文直接对照“日子有数”与“日子无数”，表达个人生命有限而以色列民延续不绝。
  alternative: 可较弱地理解为以色列民历史极其长久，而非严格意义上的永无终止。
  rationale: 希伯来文的平行结构形成强烈对比，但经文本身没有进一步界定“无数”是修辞性的长久，还是更强的持续性宣告，因此不在译文中加以限定。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。以“日子有数／日子无数”的对称句式再现希伯来文的平行结构；“生命”用于集体性的以色列民，虽略带诗性，却能避免将原文扩释为“历史”或“存续”。
