  text: Is there not grief that reaches to death[a], when a companion as your own soul turns into an enemy?
translation:
  language: zh_hans
  text: 与你亲如性命的朋友变成仇敌，岂不是会令人悲痛至死吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“岂不是悲痛达到死亡吗？一个如同你自己生命般亲近的朋友变成仇敌。”希腊文平行文本作“同伴和朋友转变为仇怨”。
    reason: 保留希伯来文“达到死亡”及“如同你自己生命”的具体意象，并说明希腊文平行文本在亲密关系与结语措辞上的表达。
lexical_decisions:
- source_word: הלא
  choice: 岂不是……吗
  rationale: 引出期待肯定回答的反问，与希腊文 οὐχί 一致；现代汉语自然有力。
- source_word: דין
  choice: 令人悲痛
  rationale: 上下文及希腊文 λύπη 都表明这里指哀痛、悲伤，而不是法律意义上的“审判”。
- source_word: מגיע אל מות
  choice: 悲痛欲绝
  rationale: 希伯来文直译为“达到死亡”；“悲痛欲绝”自然传达悲痛强烈至极的意思，字面意象另见脚注。
- source_word: רע כנפשך
  choice: 挚友
  rationale: רע 指朋友或同伴，כנפשך 直译“如同你自己的生命/自己”，强调极亲密的关系；合译为“挚友”符合现代汉语表达，同时在脚注保留其字面意味及希腊文异文。
- source_word: נהפך לצר
  choice: 竟变成仇敌
  rationale: “变成”保留 נהפך 所强调的关系逆转，“仇敌”准确表达 צר；“竟”传达这种背叛所带来的突兀与痛苦，但不增添新的命题内容。
