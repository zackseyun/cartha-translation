  text: Consult with a woman about her rival, and with a coward about his warfare;[a]
translation:
  language: zh_hans
  text: 不要同女人商议她的对头，也不要同临阵退缩的人商议他的战事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文本难解，并与希腊文本显著不同。希腊文大意是：“那在心灵上与你同心的人；你若失足，他也会与你一同忧伤。”也就是一位与你心意相通、分担你痛苦的朋友。这里译作“临阵退缩的人”的希伯来词并不确定，也可理解为“反叛者”或“逃兵”。
    reason: textual_variant
lexical_decisions:
- source_word: עִם
  choice: 同……商议
  rationale: 原文只有介词“同／与”，但本节处于一连串不可向某类人求教的警告中；补出“商议”可自然表达语境隐含的动作。
- source_word: אִשָּׁה
  choice: 女人
  rationale: 该词可指“女人”或“妻子”，原文没有所属标记；译作“女人”较少加入推断。
- source_word: צָרָהּ
  choice: 她的对头
  rationale: 此词在这里可指女性对手、情敌或共妻；“对头”保留较宽泛的敌对关系，不限定为婚姻关系。
- source_word: מָרֵד
  choice: 临阵退缩的人
  rationale: 希伯来文本用词和读法不确定，可能理解为反叛者、逃兵或畏缩者。结合“他的战事”，采用描述性译法，表达此人在战事上不可靠，同时避免过度确定为单纯“懦夫”。
- source_word: מִלְחַמְתּוֹ
  choice: 他的战事
  rationale: 保留第三人称所属含义，也以自然中文表达战争、作战或战斗之事。
theological_decisions:
- issue: 现存希伯来文本与希腊文本显著不同
  choice: 正文以现存希伯来文本为主，并在脚注中完整提示希腊异文的大意。
  alternative: 按希腊文译为：“那在心灵上与你同心的人；你若失足，他也会与你一同忧伤。”
  rationale: 希伯来文在此尚存，故正文优先依据希伯来见证；但两种文本并非细微差别，必须明确保留希腊传统所见的另一整句，以免掩盖文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不要……也不要……”将上下文所隐含的劝诫形式明示出来；“对头”比“情敌”或“共妻”更能保留原词范围。脚注明示重大文本差异与词义不确定性。
