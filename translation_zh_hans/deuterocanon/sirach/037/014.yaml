  text: Do not bargain with a merchant[a], nor over buying and selling.
translation:
  language: zh_hans
  text: 不要跟商人讨价还价[a]，也不要为买卖争执。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“要坚定你心中的谋略，因为没有什么比它对你更忠实。”这里现存的希伯来文与希腊传统差异显著。
    reason: alternative_reading
lexical_decisions:
- source_word: עם סוחר
  choice: 跟商人
  rationale: עם表示交往或对向关系；סוחר指以交易为业的人，译作“商人”自然明确。
- source_word: אל תתגר
  choice: 不要……讨价还价
  rationale: 该动词可泛指争竞或争执，但与“商人”及下半句的交易用语相连，语境更可能指议价、讲价；“讨价还价”保留其中可能带有争执色彩的商业行为。
- source_word: וממקנה על ממכר
  choice: 也不要为买卖争执
  rationale: מקנה与ממכר分别涉及购得和售卖，合译为“买卖”；希伯来语短语高度凝练，中文补出前句所含的争竞之意，使并列禁令通顺，同时不把交易双方或具体争端说得过细。
- source_word: ו־
  choice: 也不要
  rationale: 承接前句禁令，在中文中明确延续否定语气。
- source_word: καὶ βουλὴν καρδίας στήσον
  choice: 仅作为差异显著的希腊异文收入脚注
  rationale: 现存希伯来文完整可译，因此正文据希伯来文；希腊传统内容完全不同，需在脚注中透明保留。
theological_decisions:
- issue: 现存希伯来文与希腊平行文本差异显著
  choice: 正文采用希伯来文关于商人和买卖的劝诫。
  alternative: 希腊文作：“要坚定你心中的谋略，因为没有什么比它对你更忠实。”
  rationale: 此处有高可信度的希伯来文本，故以其为正文依据；希腊文并非细微措辞差异，而代表另一条明显不同的传承，不宜混入正文或暗自调和，应列入脚注。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“讨价还价”是普通读者熟悉的交易用语；第二分句用“为买卖争执”避免机械重复，又保留希伯来文中争竞与商业交易的联系。
