translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“外人”比“外国人”更能保留 זר 的广义；“面对众城”刻意保留希伯来文本的困难读法，并通过脚注呈现希腊异文，避免无声地消解文本张力。
