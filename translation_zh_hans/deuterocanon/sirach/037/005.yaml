  text: A friend fights with a stranger over a good thing[b][a], and against cities he will take up a shield.
translation:
  language: zh_hans
  text: '喜爱美善[a]的人会与外人争斗；面对众城，他会握住盾牌。[b]


    [a] “美善”所译的希伯来语也可指“好处”或“利益”。


    [b] 希腊文本作：“同伴为果腹而与朋友一同受苦；面对战争，他会举起盾牌。”希伯来文本与希腊文本在前半句以及“众城”与“战争”两处有显著差异；正文依现存希伯来文本。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美善”所译的希伯来语也可指“好处”或“利益”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本作：“同伴为果腹而与朋友一同受苦；面对战争，他会举起盾牌。”希伯来文本与希腊文本在前半句以及“众城”与“战争”两处有显著差异；正文依现存希伯来文本。
    reason: alternative_reading
lexical_decisions:
- source_word: אוהב
  choice: 朋友
  rationale: 该词字面指“爱的人”或“施爱者”，在智慧文学语境中可作名词，表示朋友或同伴；希腊平行文本的 ἑταῖρος φίλῳ 也支持朋友关系这一理解。
- source_word: טוב
  choice: 好处
  rationale: 此词可泛指“好、美善”，也可表示实际的利益或益处。“好处”在现代汉语中自然，并保留争斗所涉及之利益的可能含义；其较宽泛的语义另以脚注说明。
- source_word: נלחם עם זר
  choice: 与外人争斗
  rationale: עם 在这里可带共同或对抗意味；结合 נלחם，译为“与……争斗”最自然。זר 指圈子以外的人，“外人”避免将其过度限定为异国人。
- source_word: נגד ערים
  choice: 面对众城
  rationale: נגד 有“在……对面、面对、抵挡”之意。希伯来读本的“众城”较费解，故以“面对”保留空间与对抗两重色彩，不按希腊文本的“战争”改写。
- source_word: יחזיק צנה
  choice: 他会举起盾牌
  rationale: 字面为抓住或持住盾牌；“举起盾牌”是自然的现代汉语军事表达，也保留武装迎敌的形象。
- source_word: צנה
  choice: 盾牌
  rationale: 该词指盾牌，往往可能是大型盾牌；正文用通行的“盾牌”，不加入原文未明确要求的尺寸限定。
