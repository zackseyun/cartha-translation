  text: Do not consult with your father-in-law[a], and conceal a secret from one who is jealous.
translation:
  language: zh_hans
  text: 不要同你的岳父[a]商议；要向嫉妒的人隐瞒秘密。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特所收的希腊文平行文本在这里有很大差异，意思是：“却要常与敬虔的人相处，就是你所知道那遵守诫命的人。”本译文所依据的希伯来文本则劝人不要同岳父商议，也不要把秘密告诉嫉妒的人。
    reason: textual_variant
lexical_decisions:
- source_word: אל תועץ
  choice: 不要……商议
  rationale: 否定词加 יעץ 的反身/求取意见用法，表示不要找某人商量或听取其意见；“商议”自然地保留了劝告语境。
- source_word: חמיך
  choice: 你的岳父
  rationale: 希伯来词在此特指妻子的父亲，故不用范围更广的“姻亲”。
- source_word: וממקנא
  choice: 向嫉妒的人
  rationale: מן 与后面的“隐瞒”连用，指出秘密应当对谁保密；מקנא 可指嫉妒或眼红的人，此处译作“嫉妒的人”以贴近原文。
- source_word: העלים סוד
  choice: 隐瞒秘密
  rationale: 该词组意为把秘密藏起、不向人透露；汉语“向……隐瞒秘密”清楚表达其命令语气和对象关系。
theological_decisions:
- issue: 希伯来文本与希腊平行文本存在重大差异
  choice: 按现存希伯来文本翻译，并在脚注说明异文
  alternative: 依希腊文译为要常与一位敬虔、遵守诫命的人相处
  rationale: 现存希伯来文完整且明确，按项目原则应作为主要文本；希腊文反映的是实质不同的读法，不应在正文中与希伯来文调和或取代它。脚注保留这一重要文本差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要……；要……”保留希伯来文先禁止、后命令的结构；分号使两个相联的劝诫清楚分开。
