translation:
  language: zh_hans
  text: 坏朋友看着饭桌[a]，患难时却站在对面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“看向桌子”；这可能暗示他只在意同席吃喝或交往所得的好处。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“站在对面”；希腊文也作“在对面”。这可能指他在患难中疏远而不相助，甚至转而与你为敌。
    reason: alternative_reading
lexical_decisions:
- source_word: מרע אוהב
  choice: 坏朋友
  rationale: 按上下文理解为品行不良、靠不住的朋友；既保留道德评价，也自然体现朋友关系。
- source_word: מביט אל שלחן
  choice: 只盯着饭桌
  rationale: 保留“看向桌子”的具体意象，并以“盯着”自然传达他在意宴席或所得好处；“只”凸显上下两句的反差，但不把桌子直接释为利益。
- source_word: בעת מצוקה
  choice: 患难时
  rationale: מצוקה指困窘、患难或危急；“患难时”简洁、庄重，也与饭桌所代表的顺境形成鲜明对照。
- source_word: מנגד יעמד
  choice: 会站到对面
  rationale: 较贴近希伯来文“站在对面”，也得到希腊文ἀπέναντι的印证；保留其可能指疏远不助，也可能指转而敌对的歧义。
theological_decisions:
- issue: 朋友在患难中的立场究竟是疏远还是敌对
  choice: 站到对面
  alternative: 远远站着／站出来反对你
  rationale: 原文可表示处于对面或相对的位置，语义可能从袖手旁观延伸到敌对；正文不替原文消除这种张力，脚注加以说明。
translation_notes:
  register: 采用简洁凝练、适合智慧文学格言的现代标准汉语。“饭桌”比单用“桌子”更清楚地保留宴饮语境；正文保持原文后半句的空间意象与语义歧义。
