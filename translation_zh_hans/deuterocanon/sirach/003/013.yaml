  text: Even if a man lacks understanding[a], be patient with him[b], and do not shame him all the days of his life.
translation:
  language: zh_hans
  text: 即使一个人的悟性减退，也要体谅他[a]；在他有生之年[b]，不要羞辱他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要宽待他”或“要容忍他”。希伯来文可直译为“任凭他”或“放过他”；希腊文平行文本表明，这里是宽容、体谅之意。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作：“也不要尽你一切力量羞辱他。”希伯来文作：“在他有生之年。”正文依从本节的希伯来文主要见证；希腊文可能反映不同的底本或解释性译法。
    reason: textual_variant
lexical_decisions:
- source_word: וְגַם אִישׁ יֶחְסַר מַדָּעוֹ
  choice: 即使人的悟性衰退了
  rationale: וְגַם 在上下文中有让步意味，希腊文 κἂν 也支持“即使”。אִישׁ 在此泛指人；结合本段论年老父亲的语境，יֶחְסַר מַדָּעוֹ 译为“悟性衰退”，既表达理解能力有所缺失，也避免武断地限定为某种具体病症。
- source_word: עֲזָב לוֹ
  choice: 要宽容他
  rationale: 希伯来语字面可指“任凭他、放过他”；希腊文 συγγνώμην ἔχε 表明这里是体谅、包容之意。“宽容他”简洁自然，并保留劝人容忍对方衰退的伦理要求。
- source_word: וְאַל תַּכְלִים אוֹתוֹ
  choice: 不要羞辱他
  rationale: תכלים 表示使人蒙羞、受辱；“羞辱”直接传达主动令对方难堪的含义。
- source_word: כָּל יְמֵי חַיָיו
  choice: 他一生之中
  rationale: 忠实表达希伯来文“他一生所有的日子”，同时符合现代汉语习惯。
