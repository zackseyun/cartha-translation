base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/002.yaml
  text: For Yahweh honored the father above the children[b][a], and he established the mother's authority over her children.
translation:
  language: zh_hans
  text: 因为耶和华使父亲在儿女面前受尊荣[a]，又确立了母亲对儿女的权威[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在儿女面前”也可译作“在儿女之上”。希伯来文介词字面意为“在……面前”；结合希腊文平行文本，这里可能指父亲相对于儿女所享有的尊荣地位。
    reason: lexical_alternative
  - marker: b
    text: “权威”所译的希伯来词也可指“判决”“公正”或合法的“权利、主张”；这里很可能指母亲在家庭中应有的权利和权威。
    reason: lexical_alternative
  - marker: c
    text: 希腊文平行文本在本句末作“儿子”，现存希伯来文则作“她的儿女”；正文从希伯来文。
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名译出四字神名，既区别于通称“主”，也与希伯来文本相符。
- source_word: כִּבֵּד
  choice: 使……享有尊荣
  rationale: כבד 的加强词干表示尊崇、赋予尊荣；此译自然表达上帝使父亲获得受儿女尊重的地位。
- source_word: לִפְנֵי הַבָּנִים
  choice: 在儿女中
  rationale: לִפְנֵי 字面为“在……面前”，在此描述父亲相对于儿女的尊荣地位；“在儿女中”避免把空间意象误解为单纯站立位置，同时以脚注保留字面可能。
- source_word: וּמִשְׁפַּט הָאֵם
  choice: 母亲……的权威
  rationale: מִשְׁפָּט 可指判决、公正、权利或合法主张；家庭语境中指母亲正当而受确认的权威。脚注说明“权利”这一较法律化的可能译法。
- source_word: קִיֵּם
  choice: 确立
  rationale: 该动词表示使之坚立、确认或维持；“确立”准确传达上帝确认母亲地位的动作。
- source_word: עַל יְלָדֶיהָ
  choice: 对儿女
  rationale: עַל 在这里表达关系所及的对象；יְלָדֶיהָ 明确是“她的儿女”，中文在“母亲对儿女”中无需重复所属代词。
theological_decisions:
- issue: 父亲与母亲的平行地位如何表达
  choice: 保留“父亲”与“母亲”的分别，并分别译作尊荣与权威
  alternative: 概括为“父母”或“父母的权威”
  rationale: 原文有意分别陈述父亲和母亲；合并会抹平其平行结构，并削弱母亲的独立法律—家庭地位。
- issue: מִשְׁפַּט הָאֵם 的社会法律含义
  choice: 母亲对儿女的权威
  alternative: 母亲对儿女的权利／母亲的判决
  rationale: “权威”最自然地表达儿女对母亲所负的关系义务，同时不把词义限定为具体司法判决；以脚注保留“权利”的词汇可能。
- issue: 父亲的尊荣是否译成高于儿女的等级
  choice: 在儿女中享有尊荣
  alternative: 被置于儿女之上
  rationale: 希伯来介词可表示“在……面前”，希腊平行文本则显示相对于儿女的地位；正文不把这种关系强化为绝对等级，以免超出文本。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“使……享有尊荣”与“确立……权威”形成清晰平行，又避免生硬照搬希伯来语序。正文保留父亲、母亲和儿女的具体称谓，不作性别中和；三处脚注分别交代介词歧义、מִשְׁפָּט 的语义范围及希腊文异文。
