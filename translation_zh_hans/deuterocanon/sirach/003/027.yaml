  text: Without the pupil[a], light is lacking; and without knowledge, wisdom is lacking.
translation:
  language: zh_hans
  text: 若无瞳孔[a]，便无光明；若无知识，便无智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本在这里作另一则格言：“刚硬的心必被痛苦压垮；罪人必罪上加罪。”
    reason: textual_variant
lexical_decisions:
- source_word: בְּאֵין
  choice: 没有
  rationale: 表示缺乏或不存在；译为“没有”简洁自然，并保留格言的平行结构。
- source_word: אִישׁוֹן
  choice: 瞳孔
  rationale: 结合“光”的语境，此词指眼睛的瞳孔；现代汉语用“瞳孔”准确而清楚。
- source_word: יֶחְסַר / תֶּחְסַר
  choice: 缺少
  rationale: חסר表示欠缺、不足；两处一致译为“缺少”，保留原文的重复和均衡句式。
- source_word: אוֹר
  choice: 光
  rationale: 采用该词的基本意义，也与瞳孔及视觉意象自然相连。
- source_word: דַעַת
  choice: 知识
  rationale: 采用常见词义“知识”，并使其与“智慧”保持词义上的区别。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是智慧文学语境中的标准含义，现代汉语也自然庄重。
theological_decisions:
- issue: 现存希伯来文本与希腊文本在《便西拉智训》3:27存在显著差异
  choice: 正文依据现存希伯来文本翻译，并在脚注中注明希腊文本保存了另一则格言。
  alternative: 希腊文本：“刚硬的心必被痛苦压垮；罪人必罪上加罪。”
  rationale: 本节有可靠的希伯来见证，应以希伯来文本为正文依据；希腊文本并非细微异文，而是内容不同的格言，因此须用脚注如实保留这一重要文本差异。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语。以两个“没有……就缺少……”构成对称句式，尽量再现希伯来格言的重复与平衡。
