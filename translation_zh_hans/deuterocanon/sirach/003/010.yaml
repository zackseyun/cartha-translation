  text: Do not glorify yourself in your father's disgrace[a], for it is no honor to you.
translation:
  language: zh_hans
  text: 不要借你父亲的耻辱抬高自己[a]，因为这对你并无尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要在你父亲受辱的处境中抬高自己。”希伯来语介词既可表示“借着、凭借”，也可表示“在……之中”；反身动词则含有为自己求取尊荣的意思。希腊语平行文本同样使用“荣耀／尊荣”一类的词。
    reason: 保留介词关系及反身动词含义上的真实歧义。
lexical_decisions:
- source_word: אַל תִּתְכַּבֵּד
  choice: 不要……抬高自己
  rationale: אַל引出否定命令；כבד的Hitpael形式带反身意味，指为自己求取尊荣或使自己显得尊贵。“抬高自己”既保留反身作用，也比“荣耀自己”更符合现代汉语。
- source_word: בְּקְלוֹן
  choice: 拿……的耻辱来
  rationale: קָלוֹן表示耻辱、羞耻或不光彩；介词בְּ可表示所处情境，也可表示凭借或手段。正文采用自然的工具性表达，脚注保留情境性理解。
- source_word: אָבִיךָ
  choice: 你父亲
  rationale: 保留原文第二人称单数所属关系及“父亲”的单数形式。
- source_word: כִּי
  choice: 因为
  rationale: 引出前一禁令的理由，符合智慧文学简洁的论理语气。
- source_word: לֹא כָבוֹד הוּא לָךְ
  choice: 这并不是你的荣耀
  rationale: כָבוֹד在此指荣耀、尊荣或声誉；保留原文名词判断句，也与前句“抬高自己”的求荣意味相呼应。
