base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/028.yaml
  text: Do not hurry to heal the wound of a scoffer[a], for there is no healing for it, for they were planted from an evil planting.
translation:
  language: zh_hans
  text: 不要急着医治讥诮者的创伤，因为这创伤无药可治；他们[a]是由邪恶的栽种栽下的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“因为邪恶的植物已经在他里面扎根。”希伯来文末句在文本上较为生硬，并采用复数形式。
    reason: 记录希伯来文末句的复数被动读法，以及希腊文平行文本所见单数、在其里面扎根的替代读法。
lexical_decisions:
- source_word: אַל תָּרוּץ
  choice: 不要急着
  rationale: רוץ本义为“奔跑”，在此否定命令中表示仓促行事；“不要急着”既自然，又保留劝阻急切行动的语气。
- source_word: לְרַפְּאוֹת
  choice: 医治
  rationale: רפא指医治、使痊愈；“医治”与后文רְפוּאָה构成连贯的医疗意象。
- source_word: מַכַּת
  choice: 创伤
  rationale: מכה可指击打、伤处或灾害；与“医治”搭配时，“创伤”最符合上下文，也可保留其比喻意味。
- source_word: לֵץ
  choice: 讥诮者
  rationale: לץ在智慧文学中指傲慢、轻蔑并抗拒训诲的人；“讥诮者”比一般的“嘲笑人的人”更凝练庄重。
- source_word: אֵין לָהּ רְפוּאָה
  choice: 这创伤无药可治
  rationale: 原文直译为“它没有医治”；补明“这创伤”以消除汉语代词歧义，“无药可治”自然表达其不可医治性。
- source_word: מִנֶּטַע רַע
  choice: 从邪恶的栽种
  rationale: נטע可指栽种之物或栽种本身；此译保留植物与来源的双重意象，不把它过度具体化为某一种植物。
- source_word: נִטְעוֹ
  choice: 他们……栽下的
  rationale: 按所传希伯来文本保留复数形式，虽与前文单数“讥诮者”衔接不整齐；不在正文中擅自改成希腊文的单数内在扎根意象。
theological_decisions:
- issue: 末句希伯来文与希腊文平行文本的数与意象不一致
  choice: 正文依希伯来文本保留复数“他们”，并保留“栽种—栽下”的表达
  alternative: “因为邪恶的苗已经在他里面扎根。”
  rationale: 现存希伯来文应居优先地位，但其末句语法衔接生硬，且复数与前文单数不一致。希腊文提供较通顺的单数读法，故列入脚注，而不静默取代希伯来文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“讥诮者”保持智慧文学的道德语气；末句有意保留原文的生硬与数不一致，并用脚注说明异读。
