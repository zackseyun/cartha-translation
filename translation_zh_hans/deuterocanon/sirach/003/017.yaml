  text: My son[a], in your prosperity walk in humility, and you will be loved more than one who gives gifts.
translation:
  language: zh_hans
  text: 我儿[a]，你富足时要谦卑度日；这样，你会比送礼物的人更受人喜爱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“孩子，你要以温柔行事，就会受到蒙悦纳之人的喜爱。”希伯来文本则作：“我儿，你富足时要谦卑度日；这样，你会比送礼物的人更受人喜爱。”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 希伯来语为阳性单数名词并带第一人称后缀，直译为“我儿”；保留智慧文学中长者对儿子的直接称呼。
- source_word: בְּעָשְׁרְךָ
  choice: 你富足时
  rationale: 源于“财富、富足”，表示处于富足境况；此译自然明确，同时不将含义扩大为一般性的顺境。
- source_word: הִתְהַלֵּךְ בַּעֲנָוָה
  choice: 要谦卑度日
  rationale: התהלך是表示生活方式的命令式，“度日”自然传达其惯常行事的含义；בענוה译作“谦卑”，符合伦理劝诫语境。
- source_word: וְתֵאָהֵב
  choice: 这样，你会……更受人爱戴
  rationale: 保留被动意义及劝诫之后的结果关系；“受人爱戴”较“被爱”更符合现代汉语格调。
- source_word: מִנּוֹתֵן מַתָּנוֹת
  choice: 比赠送礼物的人更
  rationale: מן在此作比较，“赠送礼物的人”直接表达分词结构，避免把它限定为某种固定身份。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本存在显著差异
  choice: 正文依据希伯来文，采用“富足时”“谦卑度日”以及“比赠送礼物的人更受人爱戴”
  alternative: 希腊文可译为：“孩子，你要以温柔行事，就会得到蒙悦纳之人的爱。”
  rationale: 此处希伯来文本现存且可信度高，因此作为正文依据；希腊平行文本反映明显不同的读法，故在脚注中完整保留，不把两种文本调和。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学劝诫语体。“我儿”保留原文亲切而具教导性的称呼；分号呈现劝诫与结果之间的结构关系。
