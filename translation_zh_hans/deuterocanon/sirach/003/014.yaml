  text: A father's righteousness will not be wiped away[a], and in place of sins it will be planted.
translation:
  language: zh_hans
  text: 父亲的义行不会被抹去[a]；它将被栽种，代替罪过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“因为父亲的施舍不会被遗忘，并且要代替罪过为你建立起来。”希腊文的措辞有所不同，尤其是“施舍”“被遗忘”“建立起来”和“为你”。
    reason: alternative_reading
lexical_decisions:
- source_word: צִדְקַת אָב
  choice: 父亲的义行
  rationale: 希伯来语直译为“父亲的义”，既可让人理解为父亲的义行，也可能在上下文中涉及向父亲所尽的义务。“义行”在现代汉语中自然，并保留其较宽的道德含义，不把它限缩为“施舍”。
- source_word: לֹא תִּמָּחֶה
  choice: 不会被抹去
  rationale: מחה 的尼法勒形表达被擦去、涂抹或除去；“不会被抹去”既保留记录被消除的意象，也符合现代汉语表达。
- source_word: וּתְמוּר חַטָּאת
  choice: 代替罪过
  rationale: תמור 表示交换、替代；译作“代替”保留原文强烈而未加解释的替代关系。“罪过”在此指道德过犯，而非礼仪性的赎罪祭。
- source_word: הִיא תְּנַתֵּעַ
  choice: 它要栽种起来
  rationale: 动词来自 נטע“栽种”，阴性代词回指前面的“义行”。译文保留栽种的具体意象，不依希腊文改作“建立”，也不添加希伯来文中没有的“为你”。
theological_decisions:
- issue: 义行是否被表述为抵消或赎去罪过的功德
  choice: 保留“代替罪过”的替代性措辞，不说明其教义机制
  alternative: 可解释为义行蒙记念、补偿罪过，或带来罪后的恢复
  rationale: 本节使用智慧文学中强烈的道德报偿语言。译文不将其弱化为单纯的“被记念”，也不将其扩展成后世完整的赎罪或功德理论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“父亲的义行”略带经文体色彩，以尽量保留希伯来语属格关系及其可能的歧义；后半句保留原文“栽种”的突兀意象，而不作神学性释义。
