  text: For a man's honor is the honor of his father, and one who dishonors his mother multiplies sin.
translation:
  language: zh_hans
  text: 一个人的尊荣，就是他父亲的尊荣；轻慢母亲[a]的人，使罪增多。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“咒骂母亲的，就是使罪增多。”希伯来语动词可特指“咒骂”，但本节荣辱相对的结构以及希腊语平行文本都支持较广的“轻慢”之意。
    reason: lexical_alternative
  - marker: b
    text: 希腊语平行文本作：“因为人的荣耀来自他父亲所受的尊敬；母亲受辱，是儿女的羞耻。”其第二句与现存希伯来文本有所不同。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד אִישׁ
  choice: 人的尊荣
  rationale: כְּבוֹד在此指社会与家庭伦理层面的尊荣、名誉，而非可见的荣耀；אִישׁ虽为阳性单数，但汉语“人”可自然保留箴言式的代表性用法。
- source_word: כִּבּוּד אָבִיו
  choice: 在于他父亲的尊荣
  rationale: 希伯来文本简练，近似同位或等同关系；“在于”使现代汉语通顺，同时不把希腊文本所见较明确的来源关系强加给希伯来文。
- source_word: וּמַרְבֶּה
  choice: 就是使……增多
  rationale: Hiphil词形表达使某物增加的主动结果；“使……增多”直接保留其使役意义。
- source_word: חֵטְא
  choice: 罪
  rationale: 该词在伦理劝诫中直接指罪或过犯；“罪”简洁且保留其道德与神学分量。
- source_word: מְקַלֵּל אִמּוֹ
  choice: 轻慢母亲的
  rationale: קלל的Piel词形可专指咒骂，也可表示轻蔑、贬损。上下句的尊荣对比以及希腊平行文本的受辱措辞支持较宽泛的“轻慢”，而不把含义局限于口头咒骂。
theological_decisions:
- issue: 箴言中阳性单数אִישׁ的表达
  choice: 人的尊荣
  alternative: 男人的尊荣
  rationale: 原文使用阳性单数，但在此具有泛指、代表性作用。现代汉语“人”既自然又不改变命题的普遍适用性；这不是抹去父母称谓中的性别区别。
- issue: 亲子伦理语境中מְקַלֵּל的含义
  choice: 轻慢母亲
  alternative: 咒骂母亲
  rationale: 选择可涵盖言语咒骂及更广泛蔑视行为的表达，以保留荣辱平行；较窄的词义另收入脚注，避免消除原文的词汇张力。
- issue: 希伯来文本与希腊平行文本第二句的差异
  choice: 正文依高可信度希伯来文本译为行为者使罪增多
  alternative: 母亲受辱，是儿女的羞耻
  rationale: 以所给希伯来原文为正文依据；希腊文本反映不同的第二分句，不应混入正文，但应以异文脚注完整呈现。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“尊荣”呼应全句的家庭荣辱主题；“轻慢”比“羞辱”更能兼容希伯来动词既可指咒骂、又可指轻蔑贬损的语义范围。分号呈现希伯来诗句的两分结构，脚注标记均置于正文末尾。
