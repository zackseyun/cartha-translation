translation:
  language: zh_hans
  text: 你当思量所吩咐给你的事[a]；隐秘的事，你不必过问。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“你获准（或获授权）的事”；希腊语平行文本作“所吩咐给你的事”。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּמֶּה שֶׁהוּרְשֵׁיתָ
  choice: 所吩咐你的事
  rationale: 希伯来语可直译为“你获准或获授权的事”，希腊语平行文本则明确作“所吩咐你的事”。正文采用希腊语支持的义务性表达，并以脚注保留希伯来语的差异。
- source_word: הִתְבּוֹנֵן
  choice: 思想
  rationale: 该动词表示用心思考、审慎揣摩；“思想”简洁庄重，也符合智慧文学的语境。
- source_word: וְאֵין לְךָ עֵסֶק
  choice: 你无须过问
  rationale: 希伯来语习语表示某事不属于听者应当涉入或处理的范围；“无须过问”自然地保留劝诫意味，而不把它弱化为单纯的“没有需要”。
- source_word: בְּנִסְתָּרוֹת
  choice: 隐秘的事
  rationale: 指向人所不能知或不当探究的隐藏之事；避免译作“奥秘”，以免带入原文未必具有的后期神学含义。
theological_decisions:
- issue: 希伯来语 הוּרְשֵׁיתָ 与希腊语 προσετάγη 的差异
  choice: 正文译作“所吩咐你的事”
  alternative: “你获准的事”或“交付给你的事”
  rationale: 希伯来语侧重获准、获授权，希腊语则明确表示受命。鉴于希伯来文本校勘注明存在轻微差异，正文采用希腊语支持的“吩咐”，同时在脚注中如实保留希伯来语读法，不消除文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无须过问”保留原文对越界探究隐秘之事的劝诫力度；分号呈现两句之间的对照。
