  yaml_path: translation/deuterocanon/sirach/003/020.yaml
  text: For the mercies of God are many[b][a], and to the humble he reveals his secret.
translation:
  language: zh_hans
  text: 因为上帝的怜悯很多，他向谦卑的人显明自己的奥秘。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“因为主的权能广大，他从谦卑的人得荣耀。”这里的希伯来文本与希腊文本有显著差异。
    reason: alternative_reading
  - marker: b
    text: “奥秘”也可译作“秘密”或“旨意”；原词可指在亲密信任中分享的隐秘筹议，而不只是隐藏的信息。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים רַחֲמֵי אֱלֹהִים
  choice: 上帝的怜悯丰富无比
  rationale: 希伯来文直译为“上帝的怜悯很多”。现代汉语不自然地将“怜悯”计数，因此以“丰富无比”表达复数 רַחֲמֵי 所含反复、丰盛的施怜悯之意，同时保留 רַבִּים 的数量强度。
- source_word: וְלַעֲנָוִים
  choice: 向谦卑的人
  rationale: “谦卑的人”自然传达智慧文学中 ענוים 的伦理与处境含义，也避免“温柔的人”可能造成的窄化。
- source_word: יְגַלֶּה
  choice: 显明
  rationale: גלה 在以 סוד 为宾语时表示揭开、使人知道；“显明”庄重自然，并保留主动启示的语气。
- source_word: סוֹדוֹ
  choice: 自己的奥秘
  rationale: סוד 可指隐秘之事，也可指亲密圈子中分享的密议或谋略。“奥秘”适合神圣语境，但其“密议”义另以脚注保留。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本显著不同
  choice: 正文依据希伯来文：“因为上帝的怜悯丰富无比，他向谦卑的人显明自己的奥秘。”
  alternative: 希腊文：“因为主的权能广大，他从谦卑的人得荣耀。”
  rationale: 现存希伯来见证可信度高，故正文以其为准；希腊传统改变了全节的主旨和谓语关系，不能静默合并，须在脚注中完整保留。
- issue: סוד 的语义范围
  choice: 奥秘
  alternative: 密议；谋略
  rationale: 正文采用最直接且符合神圣语境的表达，但不把该词限于隐藏的信息；脚注注明它也可表示在亲密关系中分享的密议或谋略。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“丰富无比”避免生硬的“怜悯很多”；“显明自己的奥秘”保留希伯来文的神学张力。脚注标记依正文对应次序列为[a][b]。
