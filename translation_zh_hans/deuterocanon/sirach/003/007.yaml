translation:
  language: zh_hans
  text: 并且，他必把生育他的人当作主人来服侍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“主上”。希腊语此词指拥有充分权柄、可支配他人的人；这里用作强烈的比较，说明人当以尊重和服侍的态度对待父母，并非指父母实际拥有子女。
    reason: 说明δεσπότης的词义范围及本处强烈的比较性用法。
lexical_decisions:
- source_word: δεσπόταις
  choice: 主人
  rationale: δεσπότης指拥有充分权柄、可支配他人的人。“主人”保留了这里刻意加强的权威与从属意味，同时比“所有者”自然，也避免“主”可能引出的宗教专称含义。
- source_word: δουλεύσει
  choice: 来服侍
  rationale: δουλεύω表示以从属身份服事。译作“服侍”符合现代汉语表达；与“当作主人”连用，已能传达原文强烈的从属色彩，无须生硬地译成“作奴仆”。
- source_word: ἐν τοῖς γεννήσασιν αὐτόν
  choice: 生养他的人
  rationale: γεννάω可指生育、使人出生；分词复数在此泛指父母。“生养他的人”既保留原文以生育关系来称呼父母的表达，又比直接解释为“父母”更贴近措辞。介词ἐν在此结构中不宜机械译出。
- source_word: καί
  choice: 并且
  rationale: 保留本句与上文的并列衔接；句首加逗号，使现代汉语朗读自然。
theological_decisions:
- issue: 孝亲义务比喻的强度
  choice: 保留“把生养他的人当作主人来服侍”的强烈从属比喻
  alternative: 孝敬父母／尽心照料父母
  rationale: 原文同时使用δεσπόταις与δουλεύσει，明确把侍奉父母比作仆人侍奉主人。若仅译成“孝敬”或“照料”，会削弱原文的伦理力度。
- issue: “生养他的人”的所指
  choice: 保留描述性称呼，不直接改写为“父母”
  alternative: 服侍他的父母
  rationale: 原文用“生了他的人”强调亲子义务以生育关系为根基；保留这一表达可避免把原文的修辞关系静默抹平。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“生养他的人”比“生他的人”更符合汉语习惯，也能兼顾父母双方；“当作主人来服侍”清楚保留原文的比较和从属意味。
