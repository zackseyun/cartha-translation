  text: Water extinguishes a blazing fire[b][a]; so almsgiving makes atonement for sin.
translation:
  language: zh_hans
  text: 水能熄灭熊熊烈火；照样，施舍[a]能赎罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“义行”；希伯来语“ צדקה ”也可指“正义、公义”，但希腊语平行文本作“施舍”（ἐλεημοσύνη），很可能反映此处本意。
    reason: lexical_alternative
  - marker: b
    text: 希腊语作“罪”（复数）；希伯来语的单数“罪”可作泛指理解。
    reason: alternative_reading
lexical_decisions:
- source_word: אש לוהטת
  choice: 熊熊烈火
  rationale: 希伯来语指猛烈燃烧的火；“熊熊烈火”自然、凝练，并与希腊语 φλογιζόμενον 所表达的炽烈燃烧相符。
- source_word: יכבו מים
  choice: 水能熄灭
  rationale: 希伯来语采用复数动词与“水”搭配，表达水将火扑灭的普遍事实；现代汉语用集合名词“水”和“熄灭”最自然。
- source_word: כן
  choice: 照样
  rationale: 明确标示上下两句的类比关系，同时保持箴言式的简洁语气。
- source_word: צדקה
  choice: 施舍
  rationale: 该词也可指“正义、义行”，但本节语境及希腊语对应词 ἐλεημοσύνη 均支持向贫困者施予财物的具体含义；“施舍”在现代汉语中准确而易懂。
- source_word: תכפר
  choice: 能为……赎罪
  rationale: כפר 的 piel 形在此表达赎罪、除罪的作用；“赎罪”保留原文的神学力度，不弱化为“弥补”。
- source_word: חטאת
  choice: 罪
  rationale: 这里指罪或罪责，而非赎罪祭；希伯来语单数可作集合或泛指用法，汉语“罪”同样能够表达这一点。
theological_decisions:
- issue: צדקה 与赎罪语言的关系
  choice: 译作“施舍能为罪赎罪”
  alternative: “正义能为罪赎罪”或“义行能为罪赎罪”
  rationale: צדקה 的词义范围包括正义、义行和施舍，但希腊语平行文本明确使用“施舍、周济”之意的 ἐλεημοσύνη，因此正文采用具体的“施舍”。同时保留“赎罪”，不回避或调和原文关于施舍与罪之间关系的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。分号和“照样”清楚呈现两句之间的类比；“熊熊烈火”保留鲜明意象，“为罪赎罪”则忠实保留原文的神学张力。
