  text: For many are the speculations of the sons of man[b][a], and evil imaginings lead astray.
translation:
  language: zh_hans
  text: 因为世人[b]有许多臆测[a]，邪恶的幻想会把人引入歧途。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “臆测”所译的希伯来词较为罕见，也可理解为“思想”“推论”“看法”或“设想”。希腊文平行文本作“看法、推想”，支持这里指人自行形成的观念。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“人的众子”，是泛指人类的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: 许多
  rationale: 表达数量众多，与希伯来文复数结构相符，现代汉语自然简明。
- source_word: עֶשְׁתּוֹנֵי
  choice: 臆测
  rationale: 该词罕见且含义不完全确定；结合希腊文 ὑπόλημψις，所指较可能是人自行形成、未必可靠的推想或判断。“臆测”既保留警戒意味，也不把它缩窄为普通的“思想”。
- source_word: בְּנֵי אָדָם
  choice: 世人
  rationale: 这是泛指人类的希伯来语习语；“世人”在现代汉语中自然、庄重，并保留其普遍的人类指向。
- source_word: דִמְיוֹנוֹת
  choice: 幻想
  rationale: 指心中构想出来的观念；在“邪恶的”修饰下，“幻想”能自然表达不实且有误导性的心念。
- source_word: רָעוֹת
  choice: 邪恶的
  rationale: 保留希伯来文及希腊文平行文本中的道德分量，不弱化为仅表示质量不佳的“坏”。
- source_word: מַתְעוֹת
  choice: 会把人引入歧途
  rationale: 体现使役性的“使走迷、误导”。希伯来文未明说受事者，汉语补出泛指的“人”，使句意完整而不限定具体对象。
theological_decisions:
- issue: בְּנֵי אָדָם 的人类学表达
  choice: 世人
  alternative: 人的众子／人类
  rationale: 此处不是弥赛亚称号，而是泛指全体人类。“世人”比逐字译作“人的众子”更符合现代汉语，同时不改变其普遍范围。
- issue: 人之推想与受迷惑之间的关系
  choice: 保留两个并列陈述，不说明所有臆测本身都必然邪恶
  alternative: 把“臆测”直接解释为邪恶并必然误导人的思想
  rationale: 原文先说世人的臆测众多，再说邪恶的幻想会误导；译文保留这种张力，不额外建立二者完全等同的神学判断。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“臆测”保留原词的不确定性和警戒语气；“世人”自然传达希伯来习语的泛指意义。句末以“引入歧途”再现使人偏离正路的意象。
