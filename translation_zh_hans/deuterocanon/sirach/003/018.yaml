translation:
  language: zh_hans
  text: 你越尊贵，越要谦卑自己；在上帝面前，你必蒙怜悯。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的表达较凝缩，直译可作“在一切尊大中使自己变小”；希腊文平行文本明示为：“你越尊大，就越要谦卑自己；你必在主面前蒙恩惠。”
    reason: 说明希伯来文凝缩的自抑表达与希腊文明确的递进比较结构，并保留“怜悯”与“恩惠”的文本差异。
lexical_decisions:
- source_word: מַעֵט נַפְשְךָ
  choice: 谦抑自己
  rationale: 字面为“使自己变小／减少自己”，在本句伦理语境中指主动放低自己；“谦抑自己”既保留主动性，也比单说“谦卑”更贴近希伯来文措辞。
- source_word: מִכָּל גְּדוּלָה
  choice: 无论多么尊大
  rationale: 希伯来文可直译为“从一切尊大中”，表达方式较凝缩；结合希腊平行文本“你越大”，译为让步结构，使现代中文自然，并保留身份或地位越高越当自抑之意。
- source_word: לִפְנֵי אֵל
  choice: 在上帝面前
  rationale: 忠实对应“在神面前”；采用现代中文庄重而通行的“上帝”，不引入特定宗派称谓。
- source_word: תִּמְצָא רַחֲמִים
  choice: 必……蒙怜悯
  rationale: 字面为“你将找到怜悯”；中文“蒙怜悯”自然表达从上帝领受怜悯，同时不把“怜悯”改释为功德性的奖赏。
theological_decisions:
- issue: 谦卑与蒙怜悯之间的关系
  choice: 用“这样”承接，但保留智慧文学的劝勉语气
  alternative: 译成严格条件句“只要……就……”或功利性的因果承诺
  rationale: 原文以并列连词连接命令与结果；译文呈现其关联，却不把上帝的怜悯解释为靠谦卑赚取的报偿。
- issue: “怜悯”与希腊平行文本“恩惠”的差异
  choice: 正文依高可信度希伯来文译作“怜悯”
  alternative: 依希腊文译作“恩惠／恩宠”
  rationale: 指定的希伯来文为主要源证据，רַחֲמִים 明确指怜悯；希腊 χάριν 作为平行见证记录于脚注，不取代希伯来正文。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“尊大”兼顾人的地位、声望或重要性；“谦抑自己”保留原文“使自己变小”的主动意味。标点将两分句连为一体，呈现智慧训诲的紧凑节奏。
