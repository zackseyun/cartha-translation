base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/031.yaml
  text: One who does good will be called blessed for his ways[a], and at the time of his stumbling he will find support.
translation:
  language: zh_hans
  text: 善行会在他的道路上遇见他[a]；在他跌倒的时候，他会找到支撑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“报答恩惠的人，会记念日后的事。”希腊文的上半句与现存希伯来文差异很大；两者的下半句都说，人在跌倒的时候会找到支撑。
    reason: alternative_reading
lexical_decisions:
- source_word: פועל טוב
  choice: 行善的人
  rationale: 直译为“行善者”。希伯来语虽为阳性单数，但在智慧格言中具有泛指作用；现代汉语用“行善的人”自然地保留单数泛指，不额外限定为男性。
- source_word: יקראנו
  choice: 会……被称为有福
  rationale: 该形式字面可理解为“会称他”；结合“因他的所行”，语境带有称许、宣告其有福之意。采用汉语被动表达，以保留原文未明说称呼者的特点。
- source_word: בדרכיו
  choice: 因他的所行
  rationale: 字面为“在／因他的道路”。“道路”在智慧文学中常指人的行为与生活方式；“所行”在现代汉语中清楚而庄重，并表达此处的因由关系。
- source_word: בעת מוטו
  choice: 在他失足的时候
  rationale: מוט可指摇动、滑跌或倾覆；“失足”保留跌倒的比喻，也不像“败亡”那样把程度解释得过重。希腊文“跌倒的时候”支持这一语义。
- source_word: ימצא משען
  choice: 必找到倚靠
  rationale: משען指可供倚赖、支撑之物；“倚靠”既可表达实际支撑，也可表达困境中的帮助，与希腊文στήριγμα相合。
theological_decisions:
- issue: 智慧格言中阳性单数的泛指表达
  choice: 行善的人
  alternative: 行善的男子
  rationale: 原文阳性单数在此具有代表性、泛指功能。汉语不必添加原文并未着重表达的男性限定；“行善的人”仍保留单数人物形象。
- issue: 首句应依据希伯来文还是与希腊文趋同
  choice: 正文依据现存希伯来文，希腊异文列入脚注
  alternative: 施恩图报的人，会为将来着想
  rationale: 此处希伯来文保存且可信度高，应作为正文主要依据。希腊文首句差异显著，不宜无声调和；两者在次句关于跌倒时得到支撑的意思上则基本一致。
- issue: יקראנו是否补明为“有福”
  choice: 被称为有福
  alternative: 人必称赞他
  rationale: 动词本身字面是“称他”，称呼内容未明说；上下文显示是因其行为而受到正面宣告。“有福”表达智慧文学中的称许意味，但属于语境补足，因此保留脚注提示主要异文，而不把希腊首句混入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行善的人”自然表达格言式泛指；“所行”“有福”“倚靠”保留智慧文学语感，同时避免生硬古奥。正文中的[a]与脚注对应。
