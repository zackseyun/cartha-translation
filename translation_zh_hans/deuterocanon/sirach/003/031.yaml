  to: 善行会在他的道路上遇见他[a]；在他跌倒的时候，他会找到支撑。
  rationale: 正文按现存希伯来文的句法重译：以“善行”为主语，“他”为带后缀的宾语，并将“道路”意象保留在译文中。“遇见”表达此处动词可指临到、遭遇的用法；不将原文未明示的褒赞语“有福”加入正文。次句保留原有的格言式将来表达，并以“支撑”准确表达“משען”。脚注保留并更贴近地翻译希腊文首行的实质性异文。
