base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/005.yaml
  text: Whoever honors his father will rejoice in his children[b][a], and his prayer will be heard and answered.
translation:
  language: zh_hans
  text: 尊敬父亲的人，必因自己的儿子而欢喜[a]；他的祷告必蒙垂听，并得应允[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“因儿女而欢喜”，用复数；随后还多出一句：“尊荣母亲的，好像积蓄财宝的人。”
    reason: alternative_reading
  - marker: b
    text: 希腊文本在句末只有“必蒙垂听”；希伯来文本还加上“并得应允”。
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: 尊敬
  rationale: 该词在此表示给予父亲应有的分量和尊荣；“尊敬”在现代汉语中自然，也保留伦理行为的力度。
- source_word: אָבִיו
  choice: 父亲
  rationale: 希伯来文明确指“他的父亲”，不泛化为“父母”；汉语主语结构中无须重复所属代词。
- source_word: יִשְׂמַח
  choice: 必……欢喜
  rationale: 准确表达喜乐之意；“必”符合智慧文学中陈述后果或应许的语气。
- source_word: בִּבְנוֹ
  choice: 因自己的儿子
  rationale: 希伯来文为单数“在／因他的儿子”；“因自己的儿子而欢喜”比直译“在儿子里欢喜”自然，并保留单数读法。
- source_word: וּתְפִלָתוֹ
  choice: 他的祷告
  rationale: תְּפִלָּה是通常表示祷告的词；此处保留所属关系。
- source_word: יִשְׁמַע וְיַעֲנֶה
  choice: 必蒙垂听，并得应允
  rationale: 以自然的汉语被动表达祷告被听见、被回应；两个动词均予保留，同时不在正文中明说施事者。
theological_decisions:
- issue: 尊敬父亲所带来的后果或应许
  choice: 按智慧文学的应许式语气翻译，不把陈述改写为绝对机械的因果公式。
  alternative: 将其弱化为一般可能性或经验观察。
  rationale: 希伯来文使用未完成式表达预期结果；“必”保留原文有力的格言语气，但不额外界定应许实现的方式。
- issue: 谁垂听并应允祷告
  choice: 采用不明说施事者的被动表达。
  alternative: 明确译为“上帝必垂听并应允他的祷告”。
  rationale: 上下文强烈暗示神圣施事者，但希伯来文本句并未明说；译文保留原文的含蓄程度。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“尊敬父亲的人”保持格言体；“因自己的儿子而欢喜”避免生硬直译介词，同时忠实保留希伯来文单数。“蒙垂听，并得应允”具有适度经文语体，但普通读者仍易理解。
