base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/021.yaml
  text: Do not seek what is too wondrous for you[a], and do not search out what is hidden from you.
translation:
  language: zh_hans
  text: 不要探求对你而言过于奇妙的事[a]，也不要查究对你隐藏的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或依希腊文平行文本更贴近地译作：“不要寻求超乎你能力的难事，也不要查考强过你的事。”希伯来文强调过于奇妙和隐藏的事；希腊文则强调超出个人能力的事。
    reason: alternative_reading
lexical_decisions:
- source_word: פְּלָאוֹת
  choice: 过于奇妙的事
  rationale: 该词是פלא的复数，指非凡、奇妙之事；结合מִמְּךָ及希腊文平行文本，语境强调这些事超出人的能力或适当范围，而不只是“神迹”。
- source_word: מִמְּךָ
  choice: 对你来说
  rationale: 字面有“从你”之意，此处与前词连用，表示相对于当事人而言超出其范围或能力；译作“对你来说”符合现代汉语，也保留这种相对关系。
- source_word: אַל תִּדְרוֹשׁ
  choice: 不要探求
  rationale: דרש可指寻求、询问或探究。“探求”简洁地表达主动追索之意，同时不把探究方式限定得过窄。
- source_word: וּמְכֻסֶּה
  choice: 向你隐藏的事
  rationale: 源自כסה，意为遮盖、隐藏。译文保留“隐藏”的意象，并以“事”与上半句构成自然平行。
- source_word: אַל תַּחְקוֹר
  choice: 不要查究
  rationale: חקר含彻底搜寻、查考或深究之意。“查究”比“探求”更突出深入调查的语气，体现两个动词的细微递进。
- source_word: χαλεπότερά σου / ἰσχυρότερά σου
  choice: 作为“过于奇妙”之事超出个人能力的语义佐证
  rationale: 希腊文平行文本说“比你更难的／比你更强的”，虽不与希伯来文逐字对应，却印证本节是在警告人不要追索超出自身能力或范围的事。
theological_decisions:
- issue: 本节是禁止一切对神圣奥秘的探究，还是警告人不要追索超出自身能力的事
  choice: 将其译为智慧传统中对越界探求的警戒
  alternative: 理解为对神学探究的一概禁止，或仅仅针对骄傲的臆测
  rationale: 希伯来文的“过于奇妙”“向你隐藏”与希腊文的“更难”“更强”都强调相对于个人能力和所得启示的界限。译文保留这种张力，劝人谦卑，却不额外断言所有探究都受禁止。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“探求／查究”保留希伯来文两个动词之间由寻求到深入查考的差别；脚注标记[a]已置于正文对应位置。
