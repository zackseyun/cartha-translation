  text: Whoever honors his father will have long days[a], and whoever honors his mother repays God.
translation:
  language: zh_hans
  text: 尊敬父亲的，必享长寿；尊敬母亲的，是在报答上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“听从主的，必使他的母亲得安歇。”希伯来文与希腊文的第二分句差异很大。
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: 尊敬
  rationale: כבד在亲子伦理语境中指给予父母应有的尊荣。“尊敬”是现代汉语中自然、庄重且易懂的表达。
- source_word: אָבִיו / אִמּוֹ
  choice: 父亲 / 母亲
  rationale: 分别对应带第三人称阳性单数后缀的“他的父亲／他的母亲”。汉语泛指结构“尊敬父亲的／尊敬母亲的”无需重复“他的”，仍保留原文的个体性。
- source_word: יִרְבּוּ יָמָיו
  choice: 必得长寿
  rationale: 原义为“他的日子必增多”。“必得长寿”自然传达寿命延长之意，同时保留应许式语气。
- source_word: וּגְמוּל אֱלֹהִים עַל מְכַבֵּד אִמּוֹ
  choice: 尊敬母亲的，就是报答上帝
  rationale: 传世希伯来文措辞凝缩，较自然的理解是：尊敬母亲被视为向上帝作出报答。“就是”呈现其判断关系，不把它改解为“得到上帝的赏报”。
theological_decisions:
- issue: 希伯来文与希腊文第二分句存在重大差异
  choice: 正文以现存希伯来文为准，译为尊敬母亲就是报答上帝。
  alternative: 依希腊文译为：“听从主的，必使他的母亲得安慰。”
  rationale: 本节有可信度高的希伯来文见证，故正文优先据此翻译；但希腊平行文本表达了明显不同的内容，因此用脚注完整保留异文，不将两者调和。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。以分号呈现两句平行结构；“必得长寿”比直译“日子必增多”更符合现代汉语，同时保留原文含义。
