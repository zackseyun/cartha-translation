base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/015.yaml
  text: In the day of distress it will be remembered for your benefit; like heat upon frost[a], your sins will be blotted out.
translation:
  language: zh_hans
  text: 在患难之日，这事必为你的益处被记念；如同热临到霜上[a]，你的罪孽也必被除去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文较接近：“如同晴朗天气临到霜上，你的罪也必融化消散。”希伯来文作“热临到霜上”，希腊文作“晴朗天气临到霜上”；两者都描绘霜消退的景象。
    reason: 交代希伯来文本与希腊平行文本的措辞差异，并说明共同意象。
lexical_decisions:
- source_word: בְּיוֹם צָרָה
  choice: 在患难之日
  rationale: צָרָה表示患难、困苦或苦难；“患难之日”既保留希伯来文的庄重表达，也符合现代汉语经文语体。
- source_word: תִּזָּכֵר לָךְ
  choice: 这事必为你的益处而被记念
  rationale: 阴性单数动词可能回指上文所说的孝敬父母之举；לָךְ按受益与格处理。“这事”补明汉语主语，但不武断限定具体行为。
- source_word: כְּחֹם עַל כְּפוֹר
  choice: 如同热气临到霜上
  rationale: 以希伯来文为首要依据：חֹם是热、热气，כְּפוֹר是霜。“临到霜上”保留原文介词意象，并自然引出霜消退的画面。
- source_word: לְהַשְׁבִּית עֲוֹנֶיךָ
  choice: 你的罪孽也必消除
  rationale: לְהַשְׁבִּית意为使停止、除去；עָוֹן兼有罪孽与罪责的语义。“消除”准确表达使其不复存在，又不把原文限定为某一种系统神学机制。
theological_decisions:
- issue: 孝敬父母之举被记念与罪孽消除之间的关系
  choice: 保留“为你的益处而被记念”与“罪孽也必消除”两项陈述，不解释其具体机制
  alternative: 译成孝敬父母直接赎罪，或弱化为人在患难中仅蒙眷顾
  rationale: 原文把行为蒙记念和罪孽被除去并列相联，却没有说明其教义机制；译文应保存这种智慧文学中的神学张力。
- issue: 末句是否沿用融霜意象译作“融化”
  choice: 译作“消除”
  alternative: 你的罪孽也必融化消散
  rationale: 希伯来文 לְהַשְׁבִּית 本义侧重使停止、除去；希腊文则明确使用“溶解”。正文优先反映希伯来文，脚注交代希腊平行文本所强化的融化意象。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“患难之日”“被记念”“罪孽”保留智慧文学的经文语感；句法经过汉语化处理，并以“这事”承接上文，避免晦涩。
