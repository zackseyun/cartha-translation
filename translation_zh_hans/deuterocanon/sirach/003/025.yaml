  yaml_path: translation/deuterocanon/sirach/003/025.yaml
  text: A heavy heart will come to ruin in the end[b][a], and one who loves good things will be led by them.
translation:
  language: zh_hans
  text: 沉重的心，最终必归于败坏[a][b]；喜爱美好事物的人，必受它们引导。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “败坏”所译的希伯来语动词，字面意思是“发臭”或“腐坏”；在这里表示末后结局不祥，也可译作“终必腐坏”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本可译作：“刚硬的心到末后必遭祸患。”希伯来文直译则是：“沉重的心，它的结局必发臭。”
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: 沉重的心
  rationale: 依照希伯来文直译“沉重的心”，不以希腊文平行文本的“刚硬的心”取代主文本。此处可能指道德或属灵上迟钝、失序的内心，不宜只理解为悲伤。
- source_word: תִּבְאַשׁ
  choice: 必败坏
  rationale: 该动词本义为“发臭、腐坏”；与“结局”连用时表达灾难性的结果。“败坏”既保留腐坏的意象，又能自然传达走向毁灭的警告。
- source_word: אַחֲרִיתוֹ
  choice: 结局
  rationale: 该词指末后、终局或结果。“结局”在现代汉语中简洁自然，也不强行判定代词所指是“心”还是泛指那人的终局。
- source_word: וְאֹוהֵב טוֹבוֹת
  choice: 喜爱美好事物的人
  rationale: טוֹבוֹת 含义宽泛，可指美好的事物、益处或福乐；采用“美好事物”以保留这种开放性。
- source_word: יִנְהַג בָּהֶם
  choice: 必受它们引导
  rationale: נהג 常有带领、引导之意；此处表达一个人的行程或行为受其所爱的美好事物导向。“受它们引导”保留原句的引导意象及所指的复数关系。
theological_decisions:
- issue: 希伯来文“沉重的心”与希腊文平行文本“刚硬的心”的差异
  choice: 正文采用希伯来文“沉重的心”
  alternative: 刚硬的心
  rationale: 现存希伯来文在此为主要见证；希腊文可能反映异文底本或解释性译法。将希腊文读法列入脚注，可保留有关这种内心状态的真实文本张力。
- issue: 箴言式泛指主体
  choice: 译作“……的人”
  alternative: 译作带男性色彩的“他”
  rationale: 原文表达普遍适用的箴言，并非专指男性；现代汉语用“……的人”能自然保留其泛指作用。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。正文以分号呈现两个并列分句；保留“沉重的心”和“美好事物”的语义宽度，不把前者窄化为忧伤，也不把后者限定为福分、享乐或财物。
