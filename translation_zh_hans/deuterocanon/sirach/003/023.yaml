base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/023.yaml
  text: Do not probe into what is beyond you[b][a], for what is too great for you has been shown to you.
translation:
  language: zh_hans
  text: 不要探究超出你能力的事[a]，因为远超过你的事已经向你显明了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要查究比你更高深的事。”希伯来语动词的含义较难确定；希腊语平行文本作：“不要在你众多的事务上过分好奇。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语也可读作：“因为你已经看见许多超出你能力的事”；希腊语平行文本则支持“远超过你的事已经向你显明了”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹתֵר מִמְּךָ
  choice: 超出你能力的事
  rationale: 该短语指超越一个人限度、范围或能力的事。这样表达在现代汉语中自然，也保留了希伯来语的比较含义；希腊语 τοῖς περισσοῖς 同样指向逾越适当界限之事。
- source_word: אַל תַּמֵּר
  choice: 不要探究
  rationale: 该动词形式较难确定；结合上下文及希腊语 μὴ περιεργάζου，可见这是告诫人不要出于过度好奇而查究超越自身范围的事。“探究”既体现主动查考，又不过度强化为负面的“干涉”。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述禁令的理由，符合现代汉语简洁自然的因果表达。
- source_word: רַב מִמְּךָ
  choice: 过于高深的事
  rationale: 该短语表示超过人的尺度或理解能力之事。“过于高深”保留其超越性，并与前句“超出你能力”形成自然呼应。
- source_word: הָרְאֵיתָ
  choice: 已经向你显明了
  rationale: 希伯来语形式可理解为“你已经看见”，但希腊语 ὑπεδείχθη σοι 明确支持被动含义“已向你显示”。“显明”适合智慧文学的庄重语体，同时不明确指定施事者。
theological_decisions:
- issue: הָרְאֵיתָ 的语态及其与希腊语平行文本的关系
  choice: 采用被动含义：“已经向你显明了”
  alternative: 采用主动含义：“你已经看见了许多超出你能力的事”
  rationale: 现存希伯来语形式容许主动理解，但希腊语平行文本清楚表达“已向你显示”。采用被动读法使劝诫连贯：人不应越界窥探，因为超越其能力的事已经有所显明。译文保留未说明的施事者，不将其扩展为特定的后期教义主张。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“探究”准确传达智慧文学所警戒的越界查考；“显明”保留被动语态和未明说的施事者。脚注标记按正文出现顺序排列。
