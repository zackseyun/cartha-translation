base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/016.yaml
  text: For one who despises his father is insolent[b][a], and one who provokes his mother is cursed by his Creator.
translation:
  language: zh_hans
  text: 因为藐视父亲的，是狂妄之人[a]；咒骂母亲的，惹怒自己的创造主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狂妄之人”也可译作“妄自行事的人”。希腊文平行文本作“亵渎者”。
    reason: 说明希伯来词的语义范围，并保留希腊文较强的表达。
  - marker: b
    text: 希腊文平行文本作：“惹怒自己母亲的人，受主的咒诅。”
    reason: 希腊文与希伯来文在第二分句的施事者、受事者及对神的称呼上均有显著差异，需向读者说明。
lexical_decisions:
- source_word: מֵזִיד
  choice: 狂妄的人
  rationale: 该词源于 זיד，表示傲慢、妄自尊大或擅自行事。这里作谓语，刻画藐视父亲之人的品性；“狂妄的人”既保留强烈的道德谴责，也不把希伯来文具体化为“亵渎者”这一较窄含义。
- source_word: בּוֹזֶה
  choice: 藐视
  rationale: בזה 指轻看、鄙视或以蔑视相待。“藐视”简洁而庄重，符合孝敬父母的语境。
- source_word: וּמַכְעִיס
  choice: 惹怒
  rationale: 这是 כעס 的使役分词，意思是使人发怒、激怒。按希伯来文词序和句法，它与“他的创造主”相连，构成“惹怒他的创造主”。
- source_word: בּוֹרְאוֹ
  choice: 他的创造主
  rationale: 字面义为“创造他的那一位／他的创造者”。“创造主”自然表达其对上帝的指称，并保留第三人称后缀。
- source_word: מְקַלֵּל
  choice: 咒骂
  rationale: קלל 的强化词干分词通常表示咒诅、咒骂。此处以“咒骂母亲的”作为第二分句的主语，与“惹怒他的创造主”搭配；无需依照希腊文改作被动的“受咒诅”。
- source_word: אִמּוֹ
  choice: 母亲
  rationale: 原文带第三人称后缀；汉语在“咒骂母亲的”这一泛指结构中省略“他的”更自然，所指关系仍然明确。
theological_decisions:
- issue: 第二分句应理解为“惹怒母亲的人受创造主咒诅”，还是“咒骂母亲的人惹怒创造主”
  choice: 咒骂母亲的，惹怒他的创造主
  alternative: 惹怒母亲的，受主咒诅
  rationale: 现存希伯来文的词语关系自然读作 וּמַכְעִיס בּוֹרְאוֹ（惹怒他的创造主）和 מְקַלֵּל אִמּוֹ（咒骂他的母亲）。希腊文则明确呈现“惹怒母亲的人受主咒诅”，是重要的平行异文，但不应取代本处高可信度的希伯来文。
- issue: 是否依照希腊文 βλάσφημος 将 מֵזִיד 译成“亵渎者”
  choice: 狂妄的人
  alternative: 亵渎者
  rationale: 希伯来文主要表达傲慢、僭妄；希腊文的“亵渎者”加重并具体化了指控。正文以希伯来文为准，异文保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两处分词结构都译为“……的，……”以保留希伯来文的平行格局；第二分句依据希伯来文句法处理，不沿用咨询层中受希腊文影响的倒置释读。
