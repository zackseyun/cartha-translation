  text: And whoever honors his mother is like one who stores up treasure.
translation:
  language: zh_hans
  text: 尊敬自己母亲的人，就像积蓄财宝的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: 尊荣
  rationale: 这里指给予母亲应有的尊重和荣誉，而不是礼仪或敬拜意义上的“荣耀”；“尊荣”既保留原词力度，也符合孝亲语境。
- source_word: ἀποθησαυρίζων
  choice: 积蓄财宝
  rationale: 原词描绘把财宝储存起来的具体行动；“积蓄财宝”保留这一比喻，并不擅自说明财宝的性质。
- source_word: μητέρα αὐτοῦ
  choice: 自己母亲
  rationale: 保留希腊文单数、个体化的亲属关系；汉语用“自己”自然表达 αὐτοῦ 在此所指的所属关系。
- source_word: ὡς
  choice: 像
  rationale: 该词引出明喻；补足汉语判断结构，使原文省略系词的表达自然清楚。
- source_word: καί
  choice: 也
  rationale: 本句承接前文并列的智慧格言；译作“也”既体现连接关系，又使单节中文读起来完整自然。
theological_decisions:
- issue: 孝敬母亲所得回报的意象
  choice: 保留“积蓄财宝”的开放性比喻
  alternative: 明确译为物质福分、天上赏赐或一般道德益处
  rationale: 希腊文只作比较，没有界定财宝属于世上、天上还是象征性的益处，因此译文不把比喻限定为某一种奖赏观。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“尊荣”体现原文较强的敬重意味；“积蓄财宝”保留智慧文学中的具体意象。
