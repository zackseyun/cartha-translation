  yaml_path: translation/deuterocanon/sirach/003/001.yaml
  text: Listen[a], children, to a father's instruction, and do so that you may live.
translation:
  language: zh_hans
  text: 孩子们，要听父亲的训诲，并照着去做，使你们得以存活[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“孩子们，要听我——你们的父亲——的话，并照着去做，使你们得救。”希伯来文则较为泛指，作“父亲的训诲……使你们存活”。
    reason: 说明希伯来文与希腊文在父亲的自称以及结句“存活／得救”两处的重要异文。
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: 要听从
  rationale: 这是 שמע 的复数祈使式；“听从”既表达认真聆听，也自然承接下文“照着去做”，但不单独将其简化为“服从”。
- source_word: בָנִים
  choice: 孩子们
  rationale: 字面为阳性复数“儿子们”，但智慧文学中的称呼具有一般性；“孩子们”用现代汉语自然涵盖受教的子女。
- source_word: מִשְׁפַט
  choice: 教诲
  rationale: מִשְׁפַט 常可指“判决、规例”，但与“父亲”搭配并处于劝诫语境时，指父亲具有权威的训导；“教诲”比“判决”或“法令”更符合此处语义。
- source_word: אָב
  choice: 父亲的
  rationale: 希伯来文没有物主后缀，宜保留泛指，不增译为“你们父亲的”或“我的”。汉语“父亲的教诲”可自然表达这种泛指。
- source_word: וַעֲשׂוּ
  choice: 并且照着去做
  rationale: עשה 的基本义是“做、行”；补出“照着”使汉语宾语关系清楚，所指仍是前面的教诲，没有增添新的内容。
- source_word: לְמַעַן
  choice: 好使
  rationale: 准确表达目的或结果关系，同时保持庄重、流畅的现代汉语。
- source_word: תִּחְיוּ
  choice: 你们存活
  rationale: חיה 在此为“活、存活”。“存活”保留希伯来文具体的生命含义，不以希腊文的“得救”取代。
theological_decisions:
- issue: 希伯来文与希腊文对父亲身份的表述不同
  choice: 正文按希伯来文译作泛指的“父亲”
  alternative: 希腊文作“要听我这作父亲的”，带有第一人称自称
  rationale: 现存希伯来文是本节正文的首要依据，且没有第一人称或第二人称物主成分；希腊文差异在脚注中保留。
- issue: 结句“存活”与“得救”的异文张力
  choice: 正文译作“好使你们存活”
  alternative: 希腊文作“好使你们得救”
  rationale: 希伯来文 תִּחְיוּ 明确意为“你们可以活着/存活”；希腊文 σωθῆτε 的救助或得救含义作为重要异文注明，不在正文中调和。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“孩子们”保留智慧教师对受教者的亲属式称呼；“教诲”体现父亲训导的权威性；句中以“并且照着去做”避免生硬的“并且做”，同时紧贴希伯来文行动命令。
