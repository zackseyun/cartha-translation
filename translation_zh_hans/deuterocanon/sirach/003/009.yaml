  text: A father's blessing establishes roots[a], but a mother's curse uproots a plant.
translation:
  language: zh_hans
  text: 父亲的祝福使根扎稳[a]，母亲的咒诅却拔除栽种之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“父亲的祝福坚固儿女的家，母亲的咒诅却拔除根基。”希伯来文本则采用农业意象：“根”和“栽种之物”。
    reason: 记录希伯来文本与希腊平行文本之间的重要意象差异。
lexical_decisions:
- source_word: בִּרְכַת אָב
  choice: 父亲的祝福
  rationale: 按希伯来语领属结构直译，保留单数“父亲”，与下半句“母亲”形成对应；“祝福”自然表达所宣告的福言。
- source_word: תְּיַסֵּד
  choice: 使……稳固
  rationale: יסד表示奠立、建立或使之牢固。这里与“根”搭配时，“使……稳固”比生硬的“建立根”更符合现代汉语，同时保留使其安定扎实的语义。
- source_word: שֹׁרֶשׁ
  choice: 根基
  rationale: 希伯来语本义为“根”。汉语“根基”既保留根的意象，也能自然表达其比喻性的稳固基础；不随希腊文本改作“儿女的家”。
- source_word: וְקִלְלַת אֵם
  choice: 母亲的咒诅却
  rationale: “咒诅”准确对应 קללה；连接词按对偶关系译为“却”，清楚呈现祝福与咒诅、稳固与拔除之间的反差。
- source_word: תִּנְתּשׁ
  choice: 拔除
  rationale: 在植物语境中表示拔起、除去。“拔除”简洁庄重，并与前句根的意象相连。
- source_word: נֶטַע
  choice: 栽种的
  rationale: 该词可指所栽之物或栽种。“栽种的”保留一定语义开放性，既可理解为植物，也可承载家业、后代等比喻含义，而不额外限定为某一种植物。
theological_decisions:
- issue: 希伯来文本与希腊平行文本采用不同意象
  choice: 正文以希伯来文本的农业意象为准：根与所栽种的
  alternative: 依希腊文本译为“父亲的祝福坚固儿女的家，母亲的咒诅却拔除根基”
  rationale: 现存希伯来见证可信度高、语意连贯，故依原文优先原则作为正文依据；希腊文本的房屋与根基意象属于重要异文或解释性发展，收入脚注而不取代正文。
translation_notes:
  register: 采用自然、凝练而庄重的现代标准汉语，保持箴言式对偶。“根基”使农业意象在汉语中可读，同时正文与脚注明确区分希伯来和希腊见证。
