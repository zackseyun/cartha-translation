  text: A heavy heart multiplies its pains[b][a], and one who behaves recklessly adds sin upon sin.
translation:
  language: zh_hans
  text: 沉重的心，痛苦会增多[a]；行事狂妄的人罪上加罪。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“刚硬的心最终必受祸害”，又作：“刚硬的心最终必受重压。”
    reason: alternative_reading
  - marker: b
    text: “行事狂妄”所译的希伯来词含义较难确定，也可能指狂放行事、自我迷惑或自高夸耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: 沉重的心
  rationale: 依从高可信度的希伯来文本，保留“沉重”的具体意象；该表达也可能含有迟钝、顽梗或负重之意，但正文不将其窄化为其中一种。
- source_word: יִרְבּוּ מַכְאֹבָיו
  choice: 使自己的痛苦增多
  rationale: יִרְבּוּ表达增多的结果，מַכְאֹבָיו可指身体或内心的痛苦；以“使……增多”自然呈现此心给自身带来的后果。
- source_word: וּמִתְהוֹלֵל
  choice: 行事狂妄的人
  rationale: 该词形语义困难，可涉及狂放、妄自尊大、自我迷惑或鲁莽行事；“行事狂妄”兼顾失控行为与自高意味，同时用脚注保留不确定性。
- source_word: מוֹסִיף
  choice: 加
  rationale: 保留分词所表达的增加、继续添上的意义，并与汉语固定表达“罪上加罪”自然衔接。
- source_word: עָוֹן עַל עָוֹן
  choice: 罪上加罪
  rationale: עָוֹן可指罪孽或罪责；此处采用现代汉语清楚而凝练的“罪”，并保留原文层层累加的结构。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在前半句存在显著差异
  choice: 正文依从希伯来文本，译作“沉重的心使自己的痛苦增多”。
  alternative: 希腊平行文本作“刚硬的心最终必受祸害”和“刚硬的心最终必负重担”。
  rationale: 现存希伯来见证可信度高，应作为正文依据；希腊文本则反映真实但明显不同或扩展的传承，故在脚注中完整保存，不将两种读法混合。
translation_notes:
  register: 采用庄重、简明的现代标准汉语。“沉重的心”保留希伯来原文意象；“罪上加罪”以自然汉语再现重复累加结构。脚注标记按相关位置排列，避免英语咨询层中标记次序错置。
