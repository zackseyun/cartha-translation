base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/008.yaml
  text: My son[a], honor your father in word and deed, so that all blessings may come upon you.
translation:
  language: zh_hans
  text: 我儿，要在言语和行为上孝敬你的父亲，好让一切福分临到你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“好让来自他的福分临到你”，更明确地以父亲为福分的来源。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 希伯来文是阳性单数的直接称呼，明确指“儿子”；“我儿”简洁庄重，也符合智慧文学的劝诫语气。
- source_word: בְּמַאֲמָר וּבְמַעֲשֶׂה
  choice: 在言语和行为上
  rationale: 分别表达所说的话与实际行动；这一现代汉语搭配自然清楚，并保留原文两方面并举的结构。
- source_word: כַּבֵּד
  choice: 孝敬
  rationale: כבד在亲子伦理语境中指给予父亲应有的尊重和分量；“孝敬”是现代汉语圣经语境中准确而自然的对应，不限于口头尊敬。
- source_word: אָבִיךָ
  choice: 你的父亲
  rationale: 忠实保留第二人称单数所属关系以及原文明确的父亲身份。
- source_word: עֲבוּר
  choice: 好让
  rationale: 在此引出目的或结果；“好让”自然传达这种关联，又不把结果表达成机械必然。
- source_word: יַשִׂיגוּךָ
  choice: 临到你
  rationale: 该动词本义为“达到、赶上”；用于福分时，“临到你”符合现代汉语习惯，并保留福分来到当事人身上的意象。
- source_word: כֹּל בְּרָכוֹת
  choice: 一切福分
  rationale: 忠实反映希伯来文复数短语“所有福分”；“一切福分”比逐字的“所有祝福”更适合此处所指的福惠。
theological_decisions:
- issue: 福分的来源
  choice: 正文不明说福分来自上帝或父亲
  alternative: 依希腊文平行文本译为“好让来自他的福分临到你”
  rationale: 现存希伯来文只说“一切福分临到你”，没有明示来源。希腊文有“从他而来”，可能以父亲为来源，因此将此异文保留在脚注中，不在正文替希伯来文消除其开放性。
- issue: 应许的语气
  choice: 用“好让……临到你”保留目的与结果之间的张力
  alternative: 译成确定因果：“这样你就必蒙一切福分”
  rationale: 原文连接词与未完成式可以表达目的或预期结果；不宜强化成无条件、必然实现的保证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“言语和行为”保持原文简洁的伦理对举；“孝敬”贴合亲子语境；脚注标记置于相关整句之后。
