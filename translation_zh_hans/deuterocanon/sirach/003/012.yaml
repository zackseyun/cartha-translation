  text: My son[a], be strong in honoring your father, and do not forsake him all the days of your life.
translation:
  language: zh_hans
  text: 我儿[a]，要坚持尊敬你的父亲；你一生都不可离弃他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“孩子，要在你父亲年老时扶助他；他在世时，不要使他忧伤。”
    reason: 保存重要古代平行文本的不同读法；希腊文与希伯来正文在称呼、父亲年老、扶助及使其忧伤等方面均有差异。
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 这是带第一人称单数后缀的呼语，直译为“我儿”，既保留希伯来文阳性单数形式，也符合智慧文学中长辈教导晚辈的庄重语气。
- source_word: הִתְחַזֵּק
  choice: 要坚持
  rationale: 该词为חזק的Hitpael命令式，基本意象是使自己刚强、坚定。结合“尊敬父亲”这一行为领域，现代汉语用“要坚持”自然地表达坚定而持续地履行责任，同时避免误解为体力上的强壮。
- source_word: בִּכִבּוּד
  choice: 尊敬
  rationale: 介词ב与名词כיבוד构成“在尊敬……这件事上”的表达。汉语以动词“尊敬”承接“坚持”，简洁自然，并保留持续践行敬重之意。
- source_word: אָבִיךָ
  choice: 你的父亲
  rationale: 忠实表达第二人称单数所属关系；“父亲”庄重而符合现代标准汉语。
- source_word: וְאַל תַּעַזְבֵהוּ
  choice: 不可离弃他
  rationale: עזב可指离开、撇下或遗弃。在子女责任的语境中，“离弃”兼具实际照顾与道德责任的分量，又不把含义限定为某一种具体行为。
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: 你一生
  rationale: 这是表示终身持续的希伯来语惯用语。译作“你一生”自然清楚，也完整保留时间范围。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在本节核心劝诫上的差异
  choice: 正文依现存希伯来文译为“要坚持尊敬你的父亲；你一生都不可离弃他”
  alternative: 依希腊文可译为“要在父亲年老时扶助他；他在世时，不要使他忧伤”
  rationale: 现存希伯来文在此清楚且可信度高，故作为正文依据。希腊文明确提到父亲年老、子女扶助以及不要使他忧伤，与希伯来文措辞存在实质差异，可能反映诠释性扩展或不同底本，因此以脚注保存，而不将两种读法静默合并。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我儿”保留智慧文学的教诲口吻；“要坚持尊敬”传达希伯来文“刚强/坚定于尊敬”的结构；分号使两项彼此关联的终身责任清楚有力。脚注标记紧随“我儿”，提示整句希腊平行读法，而不暗示差异仅限于称呼。
