  yaml_path: translation/deuterocanon/sirach/003/019.yaml
  text: Many are lofty and renowned[a], but mysteries are revealed to the gentle.
translation:
  language: zh_hans
  text: 位高而有名望的人很多，但奥秘却向温柔的人显明。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “温柔的人”也可译作“谦和的人”或“谦卑的人”。希腊词 πραέσιν 可指性情温和、柔顺或不自张扬的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 很多
  rationale: 作为表人的不定复数，与“人”合译为“……的人很多”，符合现代汉语表达，并保留格言的简洁感。
- source_word: ὑψηλοὶ
  choice: 位高
  rationale: 原义为“高”，此处指地位尊高；“位高”既自然，又能与后文温柔、不自张扬的人形成对照。
- source_word: ἐπίδοξοι
  choice: 有名望
  rationale: 表示享有声誉、受人尊重；“有名望”准确传达公开的社会声望，而不额外加入荣耀或道德评价。
- source_word: πραέσιν
  choice: 温柔的人
  rationale: 该词可指性情温和、柔顺、不自张扬的人。“温柔的人”是现代汉语中自然且贴近原词性情含义的表达，同时用脚注保留“谦和的人”的可能译法。
- source_word: ἀποκαλύπτεται
  choice: 显明
  rationale: 保留现在时被动含义，不说明显明者是谁；“向……显明”在汉语中简洁庄重。
- source_word: μυστήρια
  choice: 奥秘
  rationale: 指隐藏、隐秘之事。“奥秘”保留原文的分量及开放性，不把它具体解释为某一类秘密。
theological_decisions:
- issue: πραέσιν应译为“温柔的人”“谦和的人”还是“谦卑的人”
  choice: 温柔的人
  alternative: 谦和的人；谦卑的人
  rationale: 原词首先描述温和、柔顺、不自张扬的性情。“温柔的人”最直接，也不把原文限定为内在自谦这一较窄含义；脚注保留其他合理译法。
- issue: 是否指出奥秘的显明者
  choice: 维持被动表达，不明说显明者
  alternative: 译作“上帝把奥秘显明给……”
  rationale: 希腊文使用被动式且未明说施事者。虽然语境可能暗示上帝，但正文不应补入原文没有明说的主语。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“位高而有名望”概括两个并列形容词所表达的社会地位与声望；“却”清楚呈现 ἀλλά 的转折。脚注标记置于正文相关句末。
