base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/003.yaml
  text: Whoever honors his father makes atonement for his sins[b][a], and whoever honors his mother stores up treasure.
translation:
  language: zh_hans
  text: 尊敬父亲的人，他的罪便得赎[a]；尊敬母亲的人，便积存珍宝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他的罪被赎”，其中“罪”为单数，但可作集合意义；希腊文平行文本作复数“罪”。
    reason: 说明希伯来文的单数形式、被动结构，以及与希腊文复数平行文本的关系。
  - marker: b
    text: “积存珍宝”也可译作“收藏宝藏”或“储蓄财宝”；意象是把财富储存起来，留作日后之用。
    reason: 说明原文 גנז אוצר 的储藏意象及可行译法。
lexical_decisions:
- source_word: מְכַבֵּד
  choice: 尊敬
  rationale: כבד 的 Piel 分词在此指给予父母当得的尊荣。现代汉语“尊敬”自然、庄重，也比“尊重”更能体现子女敬亲的伦理分量；“荣耀”则过于拔高。
- source_word: אָב
  choice: 父亲
  rationale: 希伯来文明确为阳性单数“父亲”，应与下半句的“母亲”保持对应，不泛化为“父母”。
- source_word: תְּכֻפַּר חַטָּאתוֹ
  choice: 自己的罪就得赎
  rationale: תְּכֻפַּר 是 כפר 的强意被动式，字面结构是“他的罪被赎”。译作“自己的罪就得赎”既保留被动结果，也避免把敬父者直接表述为执行赎罪的人；希腊文 ἐξιλάσεται 则佐证此处确有赎罪含义。
- source_word: חַטָּאתוֹ
  choice: 自己的罪
  rationale: 希伯来文为单数并带第三人称单数后缀；“罪”在汉语中可作集合意义，既贴近希伯来文本，也能涵盖希腊平行文本复数 ἁμαρτίας 的整体含义。
- source_word: וְגוֹנֵז אוֹצָר
  choice: 如同积存珍宝
  rationale: גנז 表示收藏、积存，אוצר 指珍宝或宝藏。“积存珍宝”保留储藏财富以备将来的意象；补入“如同”使汉语明确这是智慧文学中的比喻，而不改变其奖赏意涵。
- source_word: אִמּוֹ
  choice: 母亲
  rationale: 原文有第三人称单数后缀，汉语在平行结构中无需重复“自己的”，仍清楚指向该人的母亲，并保持表达简洁。
theological_decisions:
- issue: 智慧文学语境中的赎罪表述
  choice: 保留明确的赎罪语言，译作“自己的罪就得赎”。
  alternative: “他的罪就被遮盖”或“他的罪就蒙赦免”
  rationale: 希伯来文 כפר 与希腊文 ἐξιλάσεται 都具有赎罪、除罪的力度，不宜弱化为笼统的道德益处。“得赎”保留经文提出的神学张力，同时不把它扩展为某一后期教义体系。
- issue: 敬父者在赎罪表述中的语法角色
  choice: 按希伯来文保留结果性的被动表达：“罪就得赎”。
  alternative: “为自己的罪赎罪”
  rationale: 希伯来文本把“罪”置于被赎的语法关系中，而希腊平行文本可有较主动的结果意味。采用被动式优先反映高可信度希伯来来源，也避免断言敬父者自身就是施行赎罪的主体。
- issue: 父亲与母亲的性别明确性
  choice: 分别译为“父亲”和“母亲”。
  alternative: 合并译为“父母”
  rationale: 原文两分句分别点明父亲和母亲，且以平行结构赋予各自不同的结果；合并会损失这一结构和强调。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。两分句以“尊敬……的人”构成清楚的平行；“得赎”保留经文的宗教重量而不过度教义化，“积存珍宝”则维持智慧文学的财富比喻。
