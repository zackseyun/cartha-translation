base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/029.yaml
  text: The heart of the wise understands the sayings of the wise[b][a], and an attentive ear rejoices in wisdom.
translation:
  language: zh_hans
  text: 有智慧的心领悟智者的箴言[a]；留心聆听的耳朵因智慧而欢喜。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “箴言”也可译作“格言”“比喻”或“寓意之言”；希腊文平行文本用单数“比喻”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本的下半句有所不同，大意是：“听者的耳朵是智者的愿望。”现存希伯来文则作：“留心聆听的耳朵因智慧而欢喜。”本译文以希伯来文为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: לֵב חָכָם
  choice: 有智慧的心
  rationale: 保留希伯来文“心”的具体意象；这里的“心”指思考、理解的内在官能。“有智慧的心”也保留了原文单数的概括性表达。
- source_word: יָבִין
  choice: 领悟
  rationale: 本词在此表示透彻理解智慧教导的含义；“领悟”比单纯的“知道”更能体现这种辨识和理解。
- source_word: מִשְׁלֵי חֲכָמִים
  choice: 智者的箴言
  rationale: מָשָׁל在智慧文学中可指箴言、格言、比喻或寓意性言语；“箴言”简洁庄重，并由脚注保留其较宽的语义范围。
- source_word: אֹזֶן מַקְשֶׁבֶת
  choice: 留心聆听的耳朵
  rationale: 保留原文以“耳朵”指代认真听取教诲之人的形象，同时用“留心聆听”表达主动专注的意味。
- source_word: לְחָכְמָה תִּשְׂמָח
  choice: 因智慧而欢喜
  rationale: שׂמח表示欢喜、喜乐；介词לְ在此表明欢喜与智慧的关联。“因智慧而欢喜”在现代汉语中自然，也未把这种关联过度限定为单一解释。
