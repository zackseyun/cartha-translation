  text: Do not approach a foreign woman[a], lest you fall into her snares.
translation:
  language: zh_hans
  text: 不要亲近外来的女子[a]，免得落入她的罗网。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外来的女子”也可按字面译作“陌生女子”。在智慧文学中，这个称呼可指正当婚姻或社会界限之外的女子，并不单指族裔上的外来者；希腊语平行文本指向不正当的性关系。
    reason: 说明希伯来语 זָרָה 的字面范围及其智慧文学语境，避免将其误解为仅指族裔身份，或过度具体化为原文没有明说的职业或行为。
lexical_decisions:
- source_word: אַל תִּקְרַב
  choice: 不要亲近
  rationale: 否定词与未完成式在此构成直接禁令。“亲近”既可表达走近，也可涵盖建立亲密往来，符合本节警戒人不要涉入危险关系的语境，同时没有把动作过度限定为身体接近。
- source_word: אִשָּׁה זָרָה
  choice: 陌生女子[a]
  rationale: 字面可指“陌生的、外来的女子”；在希伯来智慧文学中，又常指处于正当婚姻或社会界限之外的女人。译作“陌生女子”保留原文含混性，并以脚注说明其语境意义，避免仅按族裔理解，也不武断地具体化为“妓女”。希腊语平行文本则进一步指向不正当的性关系。
- source_word: פֶּן
  choice: 免得
  rationale: 准确引出应当避免的后果，简洁而符合箴言式警语的庄重语体。
- source_word: תִּפּוֹל
  choice: 落入
  rationale: 保留“坠落、落入”的原文意象；希腊语 ἐμπέσῃς 也支持这一表达。
- source_word: בִּמְצוּדֹתֶיהָ
  choice: 她的罗网
  rationale: 该词指捕猎所用的网或圈套。中文“罗网”能保留捕捉的比喻，也自然表达道德上的诱陷；希腊语 παγίδας 同样指陷阱或罗网。
theological_decisions:
- issue: “陌生女子”在智慧文学中的含义
  choice: 正文译作“陌生女子”，脚注说明其既可有“外来的女子”之字面义，也可能指正当婚姻界限之外的女人。
  alternative: 外来的女子；不贞的女人；妓女
  rationale: 希伯来文 זָרָה 本身没有明确说“妓女”，不宜把含义缩窄；但若只译成“外国女子”，又容易使现代读者误以为警告单纯针对族裔身份。希腊语平行文本 γυναικὶ ἑταιριζομένῃ 明显偏向不正当的性往来，因此正文保留张力，脚注交代语境。
translation_notes:
  register: 采用现代、简洁而庄重的箴言式语体。“亲近”与“罗网”在当代汉语中易懂，也保留原文关系性警告和捕猎比喻。脚注标记[a]已在正文相应词语后出现。
