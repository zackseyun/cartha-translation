  text: Do not associate with singing women[a], lest they burn you with their mouths.
translation:
  language: zh_hans
  text: 不要与歌女亲近[a]，免得她们用口舌将你焚烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“不要把自己交给娼妓，免得失去你的产业。”希腊文本明确说这是性道德方面的警告；希伯来文本则说“歌女”，并说她们会用“口舌”把你焚烧。
    reason: alternative_reading
lexical_decisions:
- source_word: עִם מְנַגְּנוֹת
  choice: 与歌女
  rationale: עִם 表示相伴或交往；מְנַגְּנוֹת 是 נגן 的阴性复数，指从事歌唱或奏乐的女子。“歌女”简洁保留其女性表演者身份，也不把希腊文本所明说的性道德含义直接写入希伯来正文。
- source_word: אַל תִּדְמוֹךְ
  choice: 不要……亲近
  rationale: אַל 构成禁令；תִּדְמוֹךְ 词义较不确定，在此语境中指靠近、密切来往或亲密交往。“亲近”自然且保留社交与亲密关系之间的含混，不径直译成“厮混”或性关系。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达所警告的负面后果。
- source_word: יִשְׂרְפֻךָ
  choice: 把你焚毁
  rationale: 保留希伯来文“焚烧”的强烈隐喻，并以主动结构呈现由前述女子作主语的复数动词；“焚毁”在中文中比单纯“烧你”更能表达彻底毁坏的警告。
- source_word: בְּפִיפִיֹתָם
  choice: 用口舌
  rationale: 该词与“口”有关，表示施事手段，可能暗指言语、歌声或诱惑。“口舌”保留具体身体意象，也在现代中文中自然指向言语的作用，但不限定为某一种言语行为。
theological_decisions:
- issue: 希伯来文本与希腊文本的显著差异
  choice: 正文依据现存希伯来文，译作不可亲近“歌女”，否则被她们的“口舌”焚毁。
  alternative: 希腊文作：“不要把自己交给娼妓，免得失去你的产业。”
  rationale: 现存希伯来文在此处可信度高，故作为正文依据；希腊文把性道德警告和后果说得更明确，但其“娼妓／产业”不可无声并入希伯来正文。差异会实质影响理解，因此收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“歌女”保留古代女性表演者的社会语境；“亲近”有意保留一般交往与亲密来往之间的张力；“用口舌把你焚毁”保留原文突兀而有力的隐喻。
