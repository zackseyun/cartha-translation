base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/020.yaml
  text: By your strength acquire your friend[b][a], and associate yourself with the wise.
translation:
  language: zh_hans
  text: 你要尽力赢得朋友[a]，也要与智慧人交往[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要按你的能力结交朋友。”这里的“力量”也可指能力或条件。
    reason: lexical_alternative
  - marker: b
    text: 本句的希伯来语动词形式少见；希腊文本更具体地译为：“要与智慧人商议。”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֹחֲךָ
  choice: 尽力
  rationale: 希伯来语直指人的力量，也可引申为能力或条件；结合希腊语 κατὰ τὴν ἰσχύν σου，译作“尽力”在现代汉语中自然，并保留按自身能力而行的含义。
- source_word: קְנֵה
  choice: 赢得
  rationale: 该动词通常意为取得、获得或买得；这里宾语是朋友，显然不是商业购买。“赢得朋友”既体现取得关系的意味，也避免“买朋友”的误解。
- source_word: רֵעֶךָ
  choice: 朋友
  rationale: 该词可指朋友、同伴或邻舍；本句谈建立并维系人际关系，译作“朋友”最贴合保存下来的希伯来文本。
- source_word: וְעִם חֲכָמִים
  choice: 与智慧人
  rationale: חֲכָמִים 指具有智慧的一类人，并非必然限于男性；“智慧人”庄重自然，也不加入原文没有的性别限制。
- source_word: תִּסְתַּיָּד
  choice: 交往
  rationale: 这个希伯来语形式少见，确切语义存在不确定性；上下文支持与智慧人结交或相处，希腊语则更具体地作“商议”。正文采用较宽的“交往”，以免把语义过度限定为求教或商议。
theological_decisions:
- issue: חֲכָמִים 的阳性复数是否专指男性
  choice: 智慧人
  alternative: 智慧男子／贤士
  rationale: 这里的阳性复数表示智慧者这一类人，语境没有要求限定为男性；采用不强调性别的类称，既忠于语法功能，也符合现代汉语。
- issue: 是否依据希腊文本把 תִּסְתַּיָּד 明确定为“商议”
  choice: 交往
  alternative: 向智慧人求教／与智慧人商议
  rationale: 希伯来语形式本身罕见，希腊平行文本可作为重要见证，却不宜无说明地取代保存下来的希伯来措辞；正文保留较宽含义，脚注列出希腊异读。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“尽力赢得朋友”避免生硬直译为“用你的力量取得朋友”；“智慧人”作为类称，不限性别。两个脚注分别保留 בְּכֹחֲךָ 的语义幅度和 תִּסְתַּיָּד 的文本不确定性。
