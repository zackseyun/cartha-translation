  yaml_path: translation/deuterocanon/sirach/009/009.yaml
  text: Turn your eyes away from a graceful woman[a], and do not gaze at beauty that is not yours.
translation:
  language: zh_hans
  text: 要把目光从有魅力的女子身上移开[a]，不要凝视不属于你的美貌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“绝不可与有夫之妇同坐，也不要与她一起饮酒，免得你的心偏向她，使你在心灵上失足，陷入灭亡。”这里的希伯来文见证较短，所指也更宽泛。
    reason: alternative_reading
lexical_decisions:
- source_word: הַעֲלִים עַיִן
  choice: 要避开
  rationale: 原文直译近于“把眼睛藏起来”，在此是使目光避开的习语。译作“要避开”自然简洁，并能与下句“不要凝视”形成递进。
- source_word: אֵשֶׁת חֵן
  choice: 有魅力的女子
  rationale: חֵן 可指恩雅、吸引力或魅力，不宜只缩减为外貌美丽；下句另有 יֹפִי“美貌”，因此用“有魅力”保留两者差别。
- source_word: תַּבִּיט
  choice: 凝视
  rationale: 此处警戒的不是无意的一瞥，而是刻意、持续地观看；“凝视”贴合语境。
- source_word: יֹפִי
  choice: 美貌
  rationale: 直接表达 יֹפִי 的外在美之义，也与前句较广的“魅力”有所区分。
- source_word: לֹא לָךְ
  choice: 不属于你的
  rationale: 保留希伯来文简洁的所属表达及其道德界限，不把所指限定为希腊平行文本中的已婚妇女。
theological_decisions:
- issue: 希伯来正文与较长希腊平行文本的关系
  choice: 正文依从现存希伯来文的简短措辞，并以脚注交代希腊异文
  alternative: 按希腊文译成不可与有夫之妇同坐、饮酒，以免陷入灭亡的扩展劝诫
  rationale: 本项目在希伯来文存留时以希伯来文为首要文本证据。希腊文显著较长，可说明共同的性伦理警戒语境，却不应被无提示地并入正文。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“女子”较“女人”略显典雅，适合智慧文学；句式简洁，保留原文两项平行禁令。
