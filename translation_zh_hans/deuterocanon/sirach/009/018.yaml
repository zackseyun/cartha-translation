translation:
  language: zh_hans
  text: 工匠手中的作品必受称赞；民众的领袖言谈明智。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文在此处保存的是一句截然不同的话：“你若走近，便不至于招致罪责，免得〔她／你〕取去你的性命。”末句动词在形式上可理解为“她取去”或“你取去”；前一种理解可与本章有关女子的上下文相连，但原句并未明示主语。希伯来文与希腊文见证在本节有重大分歧。
    reason: 记录重要异文，并在不预设主语的情况下保留希伯来文末句动词的人称／性别歧义。
lexical_decisions:
- source_word: ἐν χειρὶ τεχνιτῶν
  choice: 工匠手中的
  rationale: 保留“在……手中”这一表示制作与能力的比喻；τεχνῖται 指有技艺的制作工匠。
- source_word: ἔργον
  choice: 作品
  rationale: 此处指工匠制成的成果或物件；“作品”比泛指行为的“工作”更符合语境。
- source_word: ἐπαινεθήσεται
  choice: 必受称赞
  rationale: 体现将来时被动态，并以“必”传达箴言式的一般规律。
- source_word: ὁ ἡγούμενος λαοῦ
  choice: 百姓的领袖
  rationale: ἡγούμενος 指带领或治理者；“领袖”既有公共治理意味，又不过度限定具体政体。
- source_word: σοφὸς ἐν λόγῳ αὐτοῦ
  choice: 在言谈中显出智慧
  rationale: 用自然汉语表达其智慧体现于言语之中，同时保留 λόγος 在此处“言谈、话语”的含义。
theological_decisions:
- issue: 《便西拉智训》9:18的希伯来文与希腊文见证显著分歧
  choice: 正文采用希腊文所保存、与传统节号对应的格言，并在脚注完整说明现存希伯来文异文。
  alternative: 按开罗藏经库希伯来文译作：“你若走近，也不至于负罪，免得她夺去你的性命。”
  rationale: 两种见证并非轻微措辞差异，而是完全不同的句子。希伯来文资料虽珍贵且置信度高，却被校勘资料标记为与本节严重不符；因此正文采用希腊文，同时不掩盖希伯来文证据。希伯来文 תִּקַּח 在形式上可作第二人称阳性单数或第三人称阴性单数；结合本章谈论女子的语境，异文暂译为“她夺去”，但在脚注说明其歧义。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体汉语；分号对应希腊文两个并列分句。正文脚注标记置于全节末尾。
