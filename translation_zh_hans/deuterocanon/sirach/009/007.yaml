  yaml_path: translation/deuterocanon/sirach/009/007.yaml
  text: Do not gaze at a virgin[b][a], lest you be ensnared by the penalties concerning her.
translation:
  language: zh_hans
  text: 不要凝视处女[b][a]，免得你陷入与她有关的刑罚之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“不要在城中的街巷张望，也不要在城中荒凉之处游荡。”现存希伯来文与希腊文见证在这里差异很大。
    reason: alternative_reading
  - marker: b
    text: 或译：“免得你被与她有关的刑罚所困住。”希伯来语表达简练，可能指因与她发生牵涉而招致的后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּבְתוּלָה
  choice: 盯着处女看
  rationale: בְּתוּלָה通常指处女或未婚年轻女子；译作“处女”保留其词义的明确性。介词ב与后面的观看动词合译为自然的汉语表达。
- source_word: אַל תִּתְבּוֹנֵן
  choice: 不要盯着……看
  rationale: התבונן表示专注、持续地观看，不只是无意的一瞥；“盯着……看”既自然，也保留警戒意味。
- source_word: פֶּן
  choice: 免得
  rationale: 该词引出可能发生的不良后果；“免得”准确传达劝诫语气。
- source_word: תִּוָּקֵש
  choice: 落入网罗
  rationale: 此处被动形式可表达被捕捉、陷入圈套；“落入网罗”保留智慧文学中的设陷意象，同时符合汉语表达。
- source_word: בַּעֲנָשֶׁיהָ
  choice: 因与她有关的惩罚
  rationale: עֹנֶשׁ意为惩罚或刑罚，阴性单数后缀表示“她的”。希伯来语中的关系较为压缩；“与她有关的惩罚”保留了这是因牵涉她而来的后果这一开放性，而不武断地断定惩罚只临到谁。
- source_word: μὴ περιβλέπου ἐν ῥύμαις πόλεως, καὶ ἐν ταῖς ἐρήμοις αὐτῆς μὴ πλανῶ
  choice: 仅作为异文参照，不控制正文
  rationale: 希腊文警告不要在城中街巷张望，也不要在荒僻处游荡，与现存希伯来文差异很大。既有高可信度希伯来文本，正文据此翻译，希腊异文则在脚注中完整保留。
theological_decisions:
- issue: 现存希伯来文与希腊文见证差异显著
  choice: 正文依据希伯来文翻译，并在脚注列出希腊异文。
  alternative: 采用希腊文关于城中街巷的警告，或把两种读法融合为笼统的防诱惑劝诫。
  rationale: 现存希伯来文在此完整且可信度高；希腊文本质上是另一读法。分别呈现可诚实保存文本差异，避免调和或掩盖不确定性。
- issue: בַּעֲנָשֶׁיהָ中“她”与“惩罚”的关系
  choice: 译为“与她有关的惩罚”，不限定惩罚的具体对象或法律背景。
  alternative: 译为“她所受的惩罚”或“她带来的惩罚”。
  rationale: 原文结构简练，既可指与她发生牵涉所招致的刑罚，也可能有其他所属或关联含义；正文与脚注应保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“盯着……看”传达持续注视；“落入网罗”略带智慧文学色彩，但仍属当代读者熟悉的表达。脚注标记按所给英文审定层的次序置为[b][a]，且均在正文出现。
