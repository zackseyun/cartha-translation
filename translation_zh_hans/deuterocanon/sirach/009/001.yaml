  text: Do not be jealous of the wife in your bosom[c][b][a], lest you teach against yourself an evil lesson.
translation:
  language: zh_hans
  text: 不要嫉妒你怀中的妻子[a][b]，免得你反倒使自己受到恶劣的教导[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嫉妒”也可译作“猜忌”。原文动词可指嫉妒或妒忌；在婚姻语境中，也可能含有因嫉妒而猜疑的意味。
    reason: lexical_alternative
  - marker: b
    text: “怀中的妻子”直译原文的亲密意象，指与自己亲密相依的妻子。
    reason: cultural_note
  - marker: c
    text: 本句的希伯来文措辞浓缩而不寻常，直译近于“免得你教导在自己身上恶”。希伯来文只说“恶”，希腊平行文本则作“恶劣的教导（或管教）”；正文据此表达为“受到恶劣的教导”。
    reason: textual_and_lexical_note
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: 不要猜忌
  rationale: קנא可表示嫉妒、妒忌或出于嫉妒而猜疑；婚姻语境中，“猜忌”最自然地传达针对配偶的嫉妒性怀疑，同时以脚注保留“嫉妒”的可能。
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: 你怀中的妻子
  rationale: חיק本指胸怀、怀抱；这一表达是亲密配偶的形象说法。保留“怀中”既忠于希伯来文意象，也与希腊文τοῦ κόλπου σου相符。
- source_word: פֶּן
  choice: 免得
  rationale: 该词引出应当避免的不良结果；“免得”简洁、自然地保留警戒语气。
- source_word: תִּלְמַד עָלֶיךָ
  choice: 你给自己上了……课
  rationale: 按所给读法，למד在此有“教”的使动意味，עליך带有临到自己或反过来针对自己的意味。“给自己上……课”以现代汉语保留自我施教这一反常而有力的修辞。
- source_word: רָעָה
  choice: 害自己的恶课
  rationale: 希伯来文仅说“恶、祸害”，希腊平行文本则有“恶劣的教导/管教”。正文用“恶课”承接“教”的意象，并以“害自己”体现עליך；脚注说明两种文本的措辞差异。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“怀中的妻子”保留原文亲密意象；“给自己上了一堂害自己的恶课”略带刻意的修辞张力，以避免把原文难解的“教……在自己身上”静默改写成单纯的“学习”或“招致祸患”。所有脚注标记均已置于正文。
