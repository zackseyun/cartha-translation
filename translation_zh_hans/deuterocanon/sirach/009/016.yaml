  text: Let your thoughts be with the discerning, and let all your speech be in the law of the Most High.
translation:
  language: zh_hans
  text: 要与明辨的人一同思量；你的一切言谈都要以至高者的律法为准。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文本在此处另作：“不要嫉妒亨通的狂傲人；要记住，他直到死也不能免受惩罚。”这里的希伯来见证似乎保存了不同的行文，或是一行错置的文字，因此正文采用希腊文本。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μετὰ συνετῶν
  choice: 与明辨的人同在
  rationale: συνετοί指有理解力、能明辨的人；此译不限定性别，也保留“与……同在”的关系表达。
- source_word: ἔστω ὁ διαλογισμός σου
  choice: 你的思量要
  rationale: διαλογισμός可指思想、思量或思索；“思量”兼顾内在思想活动与庄重自然的现代汉语表达，ἔστω的劝命语气译作“要”。
- source_word: πᾶσα διήγησίς σου
  choice: 你一切的言谈
  rationale: διήγησις可指叙说、谈论或话语；“言谈”在智慧文学语境中范围较广且自然。
- source_word: ἐν νόμῳ Ὑψίστου
  choice: 在至高者的律法中
  rationale: 直译ἐν以保留“处于……之中”的意象，不将其明确化为单纯“按照”；Ὑψίστου作为神圣称号译为“至高者”。
theological_decisions:
- issue: 希伯来见证与希腊见证在本节严重不一致
  choice: 正文采用希腊文对应本节的读法，并以脚注完整保留现存希伯来文异读
  alternative: 正文采用希伯来文：“不要嫉妒亨通的狂傲人；要记住，他直到死也不能免受惩罚。”
  rationale: 所给希伯来文本被校勘资料标为重大不符，可能属于异文或错置行；希腊文则提供与传统节次相符且语意连贯的本节内容。为避免掩盖文本证据的张力，正文依希腊文，脚注明确呈现希伯来异读。
- issue: ἐν νόμῳ的关系含义
  choice: 译作“在……的律法中”
  alternative: 译作“按照……的律法”
  rationale: 保留希腊介词表达的空间性和可能的广义关系，不把它完全解释为行为规范意义上的“按照”。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“思量”“明辨的人”“言谈”避免过度口语化，也不使用生僻古语。脚注标记[a]已置于正文相应位置。
