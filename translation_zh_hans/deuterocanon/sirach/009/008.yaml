  text: Do not give yourself to a prostitute[b][a], lest you squander your inheritance.
translation:
  language: zh_hans
  text: 不要把自己交给妓女[a]，免得你使自己的产业转归别处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“要转眼不看美貌女子，也不要细察别人的美色；许多人因女子的美貌误入歧途，情欲由此如火燃起。”这里的希腊文见证比现存希伯来文长得多，内容也明显不同。
    reason: alternative_reading
  - marker: b
    text: “产业”也可指家产或世袭的份额；“转归别处”直译了希伯来文的转离之意，所警告的可能是因性方面的愚行而使产业耗散、丧失或落入他人手中。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: 不要……交给
  rationale: 否定命令式与“给、交付”之意在汉语中自然译为“不要……交给”，保留劝诫的直接语气。
- source_word: לְזוֹנָה
  choice: 给妓女
  rationale: זוֹנָה在此具体指妓女；“妓女”是现代汉语中清楚、准确且不古雅化的对应词。
- source_word: נַפְשְׁךָ
  choice: 自己
  rationale: נפש在本句指整个人或自身，并非专指非物质的“灵魂”；“把自己交给”准确而自然。
- source_word: פֶּן
  choice: 免得
  rationale: פן引出应当避免的不良后果；“免得”保留原文简洁的警戒语气。
- source_word: תָּסֵב
  choice: 使……转归别处
  rationale: 该词表达使某物转离、转归他处的意思，但具体后果可能包括耗散、失去或转让。此译法较贴近原文意象，也避免把不确定的语义径直限定为“挥霍”。
- source_word: נַחֲלָתֶךָ
  choice: 自己的产业
  rationale: נחלה可指承受的产业、家产或继承份额。“产业”在此比单指未来所得的“遗产”更能涵盖现有家业和世袭份额。
theological_decisions:
- issue: 现存希伯来文与希腊文见证在本节内容上显著不同
  choice: 正文依从现存希伯来文，译作不可把自己交给妓女，以免产业转归别处
  alternative: 依希腊文译作要转眼不看美貌女子，也不要细察别人的美色；许多人因女子的美貌误入歧途，情欲由此如火燃起
  rationale: 既有希伯来文见证时以希伯来文为正文依据；希腊文显然保存了更长或不同的文本形态，不宜无声取代希伯来正文，但其差异具有文本批判价值，故收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“把自己交给”保留整个人屈从或委身的力度；“使自己的产业转归别处”略带书面色彩，以保存希伯来文动词的方向性和语义张力。
