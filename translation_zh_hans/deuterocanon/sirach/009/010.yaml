base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/010.yaml
  text: Do not abandon an old friend, for a new one is not equal to him; a new friend is like new wine—when it grows old, you will drink it with gladness.
translation:
  language: zh_hans
  text: 不要离弃旧友，因为新朋友比不上他；新朋友如同新酒；新酒陈年后，你便会欣然饮用。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希伯来文句子似乎属于另一则箴言，与《便西拉智训》9:10不符；本节因此依据希腊文见证翻译。
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ ἐγκαταλίπης
  choice: 不要离弃
  rationale: 表达关系上的抛弃或背离；“离弃”贴近原文，又符合庄重、自然的现代汉语。
- source_word: φίλον ἀρχαῖον
  choice: 旧友
  rationale: ἀρχαῖον在这里指交往已久，并非年代古老；“旧友”简洁自然，也与“新朋友”形成清楚对照。
- source_word: πρόσφατος
  choice: 新朋友
  rationale: 该词本义为新近的；结合旧友及新酒的对比，译为“新朋友”最合语境。
- source_word: οὐκ ἔστιν ἔφισος αὐτῷ
  choice: 比不上他
  rationale: 保留“不相等、不能相比”的比较含义，同时比“与他不相等”更符合现代汉语习惯。
- source_word: οἶνος νέος φίλος νέος
  choice: 新朋友如同新酒
  rationale: 希腊文是凝练的并置语；汉语补出“如同”，明确比喻关系而不改变箴言的意思。
- source_word: ἐὰν παλαιωθῇ
  choice: 陈年以后
  rationale: 在新酒的语境中，παλαιωθῇ指经过时间而变老、成熟；“陈年”准确传达酒经存放而醇熟的意象。
- source_word: μετ’ εὐφροσύνης πίεσαι αὐτόν
  choice: 你会欣然饮用
  rationale: “欣然”自然表达μετ’ εὐφροσύνης的喜悦之情；不明说代词所指，使朋友与酒的比喻仍保持紧密。
theological_decisions:
- issue: 本节底本对应关系
  choice: 依据所附希腊文平行见证翻译本节
  alternative: 把所附希伯来文按《便西拉智训》9:10翻译
  rationale: 所附希伯来文谈论女子的美貌使多人败亡，与本节旧友、新友和新酒的内容不符；所附希腊文则明确传承本节内容。因此正文采用希腊文，并以脚注如实说明底本错位。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“旧友”与“新朋友”形成自然对照；后半句保留新友如新酒、需经时间才显可喜的箴言式比喻。
