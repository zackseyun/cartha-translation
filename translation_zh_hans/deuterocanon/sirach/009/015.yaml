  text: Do not envy a wicked man[a], for you do not know what his day will be.
translation:
  language: zh_hans
  text: 不要嫉妒恶人[a]，因为你不知道他的日子会怎样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证在此记载的是另一则训言：“要按你的能力留心邻舍，并与智慧人商议。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: 不要嫉妒
  rationale: קנא 在此与否定命令连用，表示因他人的处境而生嫉妒；译文简洁自然，符合智慧训诲的语气。
- source_word: בְּאִישׁ רָשָׁע
  choice: 恶人
  rationale: אִישׁ רָשָׁע 指道德上邪恶的人；现代汉语以“恶人”即可自然表达其单数泛指意义，不必生硬译作“一个邪恶的男人”。
- source_word: כִּי לֹא תֵּדֵע
  choice: 因为你不知道
  rationale: כִּי 引出禁令的理由；“因为”准确、通顺，也保留原文的因果关系。
- source_word: מַה יּוֹמוֹ
  choice: 他的日子会怎样
  rationale: 原文直译近于“他的日子是什么/会怎样”，措辞简约且含义开放。“会怎样”保留“日子”的意象及结局未明的意味，同时不添加原文没有的“带来”或明确限定为“末日”。
theological_decisions:
- issue: 希伯来文与希腊文见证存在重大差异
  choice: 以现存希伯来文为正文，并用脚注注明希腊文保存的另一则训言。
  alternative: 照你的能力留心邻舍，并与智慧人商议。
  rationale: 本节有可靠的希伯来文见证，应以其为主要来源；希腊文并非近似异文，而是内容明显不同的训言，因此不宜混入正文，但须在脚注中透明呈现。
- issue: “他的日子”所指保持含蓄
  choice: 译作“他的日子会怎样”。
  alternative: 他的结局会怎样；他的日子会带来什么。
  rationale: 希伯来文没有明确说“结局”，也没有“带来”这一动词。保留其简约表达，可避免把可能涉及遭遇、命运或终局的含义提前固定下来。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“恶人”保留原文的道德判断；“他的日子会怎样”有意维持希伯来文的简约与含蓄。脚注标记已置于正文“恶人”之后。
