  text: Do not give your soul to a woman[b][a], to let her tread on your heights.
translation:
  language: zh_hans
  text: 不要把自己交给女人[a]，让她踏上你的高处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本句首的动词形式较难确定；希腊文本作：“不要把你自己交给女人，让她踏上你的力量。”“女人”（אשה）也可译作“妻子”。
    reason: textual_and_lexical_alternative
  - marker: b
    text: “你的高处”可能比喻人的力量、地位或尊严；希腊文本在此作“你的力量”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּקְנֶא
  choice: 不要……交给
  rationale: 现存希伯来文本的动词形式较难确定；希腊平行文本 μὴ δῷς 明确作“不要给”。正文据此表达不可把自己交付出去的意思，同时在注脚说明文本情况。
- source_word: נַפְשְׁךָ
  choice: 自己
  rationale: נפש 可指心魂、生命或整个人；现代汉语用“自己”最自然地传达这里将全人交付出去的意思，也避免把它限缩为某一灵魂观念。
- source_word: לְאִשָּׁה
  choice: 给女人
  rationale: אשה 可指“女人”或“妻子”，原文没有所属标记；“女人”范围较广，也较少加入解释。
- source_word: לְהַדְרִיכָהּ
  choice: 任她践踏
  rationale: 该形式可涉及使其踏行或引导；希腊文 ἐπιβῆναι 支持“踏上”的具体图像。“任她”自然表达前一行动所造成的结果或许可。
- source_word: עַל בָּמוֹתֶיךָ
  choice: 你的高处
  rationale: במותיך 字面为“你的高处／高地”。正文保留希伯来文的意象，不直接改写为权势、地位或尊严；注脚说明可能的比喻含义及希腊译法。
theological_decisions:
- issue: 是否把本节改写成关于男女支配关系的直白训诫
  choice: 保留“交给自己”与“践踏高处”的具体意象
  alternative: 不要向女人屈服，免得她控制你
  rationale: 本节是智慧训言，原文以比喻表达失去自主、力量或地位的危险。保留意象可避免把含混的诗性警戒系统化为关于婚姻或性别本质的教义。
- issue: אשה 应译为“女人”还是“妻子”
  choice: 女人
  alternative: 妻子
  rationale: 希伯来文和希腊文都可兼指女人或妻子，且此处没有所有格；采用较宽泛的“女人”，不把对象限定为婚姻关系。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“把自己交给”比直译“把你的心魂给”更符合普通话表达；“践踏你的高处”则有意保留原文突出的陌生比喻，并以注脚辅助理解。
