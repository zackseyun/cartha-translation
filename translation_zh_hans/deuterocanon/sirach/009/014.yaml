  text: New wine[a], a new friend; when it grows old[b], you may drink it with pleasure.
translation:
  language: zh_hans
  text: 新酒，新朋友；酒陈了以后，或许你会喝它。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文是一句格言，但末句在文本和语法上都有困难。所传希腊文文本则完全不同，大意是：“要知道，你行走在网罗中间，又走在城墙的垛口上。”这里正文依从现存希伯来文本。
    reason: textual_variant
  - marker: b
    text: 较直译可作：“新酒，新朋友；陈了以后，或许你会喝它。”这里保留原文简略的两项并列；末尾代词的文本形态并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן חָדָשׁ
  choice: 新酒
  rationale: 直译“新的酒”，用现代汉语常见的“新酒”，并保留格言中与“新友”的对应。
- source_word: אוֹהֵב חָדָשׁ
  choice: 新友
  rationale: 传世希伯来文本表达简略；将 אוֹהֵב 按“朋友”理解，以名词短语呈现，并用“如”补明格言所暗示的类比关系。
- source_word: וְיָשָׁן
  choice: 等它陈了
  rationale: יָשָׁן 意为“老、陈旧”；就酒的语境而言，“陈了”自然表达经过时间而成熟，同时避免擅自加入“醇美”等评价。
- source_word: אַחַר אוּלַי
  choice: 或许才会
  rationale: 保留 אַחַר 的后时意味与 אוּלַי 的不确定语气；“才”承接等待成熟之后的时间关系。
- source_word: תִּשְׁתֶּינוּ
  choice: 你会喝它
  rationale: 按上下文取“你将喝它”；该形式的词尾传承不稳，因此正文采用最可能的宾语“它”，并以脚注说明。
theological_decisions:
- issue: 希伯来文本与希腊平行文本严重不一致
  choice: 正文依据现存希伯来文，译作新酒与新友的格言
  alternative: 依据希腊文，译作行走在网罗与城墙垛口之间的警告
  rationale: 本节有可用且置信度高的希伯来见证；希腊文显然代表实质不同的文本形态。遵循希伯来文优先原则，同时在脚注中如实记录异文，不将两种文本调和。
- issue: 格言是否明确表示老朋友更令人愉悦
  choice: 仅保留酒须陈放后才饮用的类比，不在正文加入“愉快”或“最好”
  alternative: 译为“陈久以后，你便可畅饮”，明确表达成熟友谊带来的喜悦
  rationale: 希伯来文末句困难，且没有明确对应“愉快”的词；克制译法可保留文本的不确定性与含蓄劝诫。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留箴言式节奏。正文不加入希伯来文未明说的“愉快享用”，并用“或许”保留原文的不确定性。所有脚注标记均已置于正文。
