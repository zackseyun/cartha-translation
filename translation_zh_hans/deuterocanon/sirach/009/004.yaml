  text: Do not keep company with a prostitute[a], lest you be caught by her enticements.
translation:
  language: zh_hans
  text: 不要与妓女来往，免得陷入她的诱惑[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诱惑”：希伯来文 leqachot 含义不易确定；希腊文平行文本作“她的手段（或计谋）”。
    reason: 说明希伯来文疑难词的语义不确定性，以及希腊文平行文本所支持的“手段／计谋”理解。
lexical_decisions:
- source_word: עִם זוֹנָה
  choice: 与妓女
  rationale: עִם意为“与”，זוֹנָה指妓女；采用现代、明确且不过度贬抑的表达。
- source_word: אַל תִּסְתַּיֵּד
  choice: 不要……来往
  rationale: 此处动词较罕见；结合上下文及希腊文所表达的持续相处之意，“来往”自然地传达持续交往，而不把含义限定为性关系。
- source_word: פֶּן
  choice: 免得
  rationale: 引出应当避免的不良后果，符合希伯来智慧文学简洁的劝诫语气。
- source_word: תִּלָּכֵד
  choice: 被……缠住
  rationale: 原词有被捕获、陷住之意；“缠住”保留陷入其中、难以脱身的意象，并与中文“诱惑”搭配自然。
- source_word: בְּלִקְחֹתֶיהָ
  choice: 被她的诱惑
  rationale: 希伯来语形式含义不易确定；希腊文ἐν τοῖς ἐπιχειρήμασιν αὐτῆς支持“手段、图谋”一类含义。正文用“诱惑”契合语境，同时以脚注保留“手段／计谋”的可能性。
theological_decisions:
- issue: 希伯来文末句的疑难词是否借助希腊文平行文本解释
  choice: 以希伯来文为主，并参考希腊文，将末句译作“被她的诱惑缠住”
  alternative: “落入她的计谋中”或“被她的手段困住”
  rationale: 现存希伯来文应居首要地位，但בְּלִקְחֹתֶיהָ语义不确定。希腊文平行文本指向“手段、企图、计谋”，可支持语境中的诱惑性手段；脚注明确说明不确定性，避免将一种解释伪装成唯一含义。
translation_notes:
  register: 采用简洁、庄重而现代的智慧文学劝诫语体。“妓女”准确且中性；“来往”强调持续交往；“缠住”保留被捕获的形象。
