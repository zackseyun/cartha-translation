translation:
  language: zh_hans
  text: 你要知道：你将在众多陷阱之间迈步，行走直到罗网跟前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本作：“你要知道：你将在众多陷阱之间迈步，行走直到罗网跟前。”末句的“行走”所译希伯来动词可含持续或往来行走之意。希腊文本的这一节差异很大，作：“多言的人在自己的城中令人畏惧，言语鲁莽的人必遭憎恨。”本译文以现存希伯来文本为主要依据，同时在此注明希腊传统的异文。
    reason: textual_variant
lexical_decisions:
- source_word: דַּע
  choice: 你要知道
  rationale: 这是 ידע 的祈使式；“你要知道”保留了直接劝诫的语气，也符合现代汉语表达。
- source_word: בֵין פַּחִים
  choice: 在陷阱之间
  rationale: פַּחִים 指捕捉猎物的陷阱或圈套；בֵין 表示置身其间，描绘人在重重危险中前行。
- source_word: תִּצְעָד
  choice: 迈步
  rationale: צעד 强调踏步、迈步；译作“迈步”保留脚下处处危险的具体意象。
- source_word: וְעַד רֶשֶׁת
  choice: 也会一路走到罗网跟前
  rationale: עַד 的基本空间意义是“直到、到……为止”；“一路走到……跟前”既保留接近罗网的方向感，又不暗示已经落网。
- source_word: תִּתְהַלָּךְ
  choice: 走
  rationale: הלך 的 Hitpael 形式可带持续或往来行走之意；结合“一路”表达持续行进，避免生硬直译为“走来走去”。
- source_word: רֶשֶׁת
  choice: 罗网
  rationale: רֶשֶׁת 是用于捕捉的网；“罗网”既是自然庄重的现代中文，也与前面的“陷阱”保持相关而有区别的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。保留“陷阱—罗网”和“迈步—走到”的具体行路意象；不把接近罗网解释成已经被捕，以免消除希伯来文的空间张力。
