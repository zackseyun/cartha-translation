- from: 你要知道，你将在陷阱之间迈步，也会一路走到罗网跟前。[a]
  to: 你要知道：你将在众多陷阱之间迈步，行走直到罗网跟前。[a]
  rationale: 修订仅作必要的汉语表达与对应关系调整：以“众多陷阱之间”自然表达 בֵּין פַּחִים，以“行走直到罗网跟前”保留 וְעַד 的“直到／达至”空间指向；脚注保留希伯来与希腊文本显著分歧，并更新所引译文。
