  yaml_path: translation/deuterocanon/sirach/009/005.yaml
  text: Do not debase yourself by the sight of your eyes[b][a], nor be appalled after her house.
translation:
  language: zh_hans
  text: 不要因你眼目所见而自取卑贱，也不要追随她的家室[a]而自遭毁灭。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追随她的家室而自遭毁灭”所据的希伯来文十分简略，字面近于“在她家之后惊骇／遭毁灭”。这句话也可能指追逐她的家室，或因卷入她家中的事而遭毁坏。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本作：“不要仔细打量处女，免得因与她有关的责罚而跌倒。”本节的希伯来文与希腊文差异很大。
    reason: alternative_reading
lexical_decisions:
- source_word: לְהִתְנַבֵּל
  choice: 自取卑贱
  rationale: 该词是 נבל 的反身形式，表示使自己变得卑贱、可鄙。“自取卑贱”既保留反身意味，也符合本节劝诫的语气。
- source_word: בְּמַרְאֵה עֵינֵיךָ
  choice: 因眼前所见
  rationale: 原文直译近于“因你双眼所见的景象”。此译保留视觉诱惑与行为败坏之间的关系，同时采用自然的现代汉语。
- source_word: וּלְשׁוֹמֵם
  choice: 以致败亡
  rationale: שמם 可表示荒废、毁坏、震骇或陷入凄惨境地。这里译作行为所导致的“败亡”，传达其强烈的毁灭意味；具体语义仍有疑难，故加注说明。
- source_word: אֲחַר בֵּיתָהּ
  choice: 追到她家
  rationale: 原文简略，字面近于“在她家之后／追随她的家”。“追到她家”表达追随女子而进入其家庭范围的可能含义，但不将这一不确定解释隐藏起来，故在脚注中保留其他可能。
theological_decisions:
- issue: 本节现存希伯来文与希腊文平行文本差异显著
  choice: 正文以现存希伯来文为准，并在脚注列出希腊文平行读法
  alternative: 依希腊文译为：“不要仔细打量处女，免得因与她有关的责罚而跌倒。”
  rationale: 希伯来文证据现存且可信，应作为正文基础；但希腊文所表达的是明显不同的劝诫，不能将其差异静默消解，因此以脚注公开呈现。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文尽量保留希伯来文的反身警告和毁灭性后果；对后半句不可避免的解释性表达，通过脚注明示原文的含混及希腊文异读。
