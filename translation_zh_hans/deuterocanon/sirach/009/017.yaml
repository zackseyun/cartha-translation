  text: Keep far from a man who has power to kill[a], and do not fear the terrors of death.
translation:
  language: zh_hans
  text: 要远离有权杀人的人[a]，也不要惧怕死亡的种种恐怖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证在这里记载的是一句差异很大的话：“要让义人与你同席；你要以敬畏主为夸耀。”正文依据本节现存的希伯来文。
    reason: textual_variant
lexical_decisions:
- source_word: רְחַק מֵאִישׁ
  choice: 要远离……的人
  rationale: רְחַק是命令式，要求主动保持距离；מֵאִישׁ为阳性单数。中文以“要远离……的人”自然表达命令，也保留单数人物所指。
- source_word: שַׁלִּיט לַהֲרוֹג
  choice: 有权杀人
  rationale: שַׁלִּיט强调掌有权力或权柄，לַהֲרוֹג直指杀害。译作“有权杀人”保留实际权力的意味，不擅自限定为正式官职或司法处决。
- source_word: וְאַל תִּפְחַד
  choice: 也不要惧怕
  rationale: 这是直接的否定命令。“也不要惧怕”在现代汉语中简洁、庄重，并承接前一分句。
- source_word: פַּחֲדֵי מַוֶת
  choice: 死亡的种种恐怖
  rationale: 原文为复数附属结构，直指与死亡相关的诸般恐怖。“种种”体现复数，“恐怖”保留其强烈程度，避免将其弱化为一般的害怕。
theological_decisions:
- issue: 希伯来文与希腊文见证存在重大差异
  choice: 正文依据现存希伯来文翻译，并在脚注中列出希腊文的不同说法。
  alternative: 希腊文作：“要让义人与你同席；你要以敬畏主为夸耀。”
  rationale: 本节有现存且可信度高的希伯来文，因此正文以希伯来文为据。希腊文并非细微异文，而是保存了实质不同的箴言，故不将二者调和，而以脚注如实说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“有权杀人”紧贴希伯来文的权力表达；“死亡的种种恐怖”保留复数和强烈语气。脚注标记[a]已置于相关文本差异所在的第一分句之后。
