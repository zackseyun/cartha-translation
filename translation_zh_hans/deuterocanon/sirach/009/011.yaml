  text: Do not dine with her husband[a], and do not sit drinking with him while drunk.
translation:
  language: zh_hans
  text: 不要同她丈夫一起吃饭，也不要在醉酒时与他同席。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文传统作：“不要嫉妒罪人的荣耀，因为你不知道他的下场将会怎样。”这里现存的希伯来文与希腊文传统有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: עִם בַּעְלָהּ
  choice: 同她丈夫一起
  rationale: בעל加第三人称阴性单数后缀在此处最自然地指“她丈夫”；עִם表示共同参与。
- source_word: אַל תִּטְעָם
  choice: 不要……吃饭
  rationale: טעם本义为“尝”，但与人共同进行时，在这里自然指一起进食；“吃饭”既准确又符合现代汉语。
- source_word: וְאַל תָּסֵב עִמּוֹ
  choice: 也不要……与他同席
  rationale: סב可指入席、坐席或斜倚席间；“同席”保留宴饮场景，又避免把古代席间姿势不必要地具体化。
- source_word: שִׁכּוֹר
  choice: 在醉酒时
  rationale: 该词表示醉酒状态。此译法自然地表达不要在醉酒状态下与他同席，同时不额外添加希伯来文本没有明说的行为细节。
theological_decisions:
- issue: 现存希伯来文与希腊文传统显著不同
  choice: 正文依据现存希伯来文，译为关于同一名女子的丈夫吃饭、醉酒同席的警告。
  alternative: 希腊文作：“不要嫉妒罪人的荣耀，因为你不知道他的结局将会怎样。”
  rationale: 本节有可信度较高的希伯来文见证，故以希伯来文为正文依据；希腊文可能反映不同底本、经文错位或传承分歧，因此以脚注完整保留，而不把两种读法混合。
- issue: שִׁכּוֹר所描述的醉酒者
  choice: 译作“在醉酒时”，按句法通常理解为受劝诫者处于醉酒状态。
  alternative: 也可能理解为丈夫处于醉酒状态。
  rationale: 希伯来文的阳性单数形式在形态上可与受劝诫者或“他”相应；正文采用较自然的劝诫句理解，但不通过增添明确主语来过度消除歧义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“同席”保留古代共同坐席或斜倚进食饮酒的场景；“她”承接上下文中的女子。
