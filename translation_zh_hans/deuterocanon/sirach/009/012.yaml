  text: Lest your heart turn aside to them, and in blood you be brought down to the Pit.
translation:
  language: zh_hans
  text: 免得你的心偏向她，并在流血中走向深坑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流血”直译为“血”（复数）；此处“血”与“走向深坑”的关系未明，亦可理解为“在血中”或“以血”。古希腊文本在本节内容显著不同：“不要喜悦恶人的顺遂；要记住，他们直到阴间也绝不会被判为义。”
    reason: 说明דמים的字面形式及句法、语义含混，避免正文把它限定为“血债”；并公开保存希伯来文与希腊文之间无法调和的重大异文。
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: 向她
  rationale: 希伯来语为阴性单数“向她”，因此依原文保留单数女性所指，不采用英语修订层中的复数“向他们”。
- source_word: לֵב
  choice: 你的心
  rationale: 原文直译为“心”；按汉语表达补出领属关系，并与第二人称动词相呼应。
- source_word: וּבְדָמִים
  choice: 也因血债
  rationale: דמים是“血”的复数形式，在此可指流血所招致的罪责或后果；“血债”既保留血的意象，也比单说“因血”更自然，但不把具体情境限定为某一种暴力行为。
- source_word: תִּטֶּה אֶל שָׁחַת
  choice: 而走向深坑
  rationale: תטה基本义为“转向、偏向”，与前半句形成词根呼应；汉语用“走向”表达趋向毁灭的动态，שחת按其具体意象译作“深坑”。
theological_decisions:
- issue: אֵלֶיהָ的指代数与性
  choice: 她
  alternative: 他们
  rationale: 现存希伯来文本明确是阴性单数。英语POB的“them”与该形态不符，故以原语言证据为先；至于“她”具体指谁，不在译文中擅自补明。
- issue: דמים的含义
  choice: 血债
  alternative: 鲜血／流血
  rationale: 该词可能保留具体的“血”，也可能带有流血罪责的习惯含义。“血债”保存道德后果与毁灭之间的张力，同时脚注交代较字面的译法。
- issue: 希伯来文与希腊文的重大异文
  choice: 正文依据高置信度的希伯来文
  alternative: 采用希腊文“不要喜悦恶人的顺遂；要记住，他们直到阴间也绝不会被判为义”
  rationale: 两种文本在内容上完全不同，无法在正文中调和。任务指定希伯来文本为原语言来源且置信度高，因此正文从希伯来文翻译，并在脚注透明说明希腊平行文本。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“心偏向她”保留原文关系与道德倾向的含混性；“走向深坑”自然表达趋向毁灭，同时保留深坑意象。
