  text: Keep far away from a man who has authority to kill, and you will not have to fear death.[a]
translation:
  language: zh_hans
  text: 要远离那有权杀人的人，这样你就不必惧怕死亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存的希伯来文见证在本节记载的是另一句格言：“不可离弃老朋友，因为新朋友比不上他。”希腊文传统则记载正文所译的警告。
    reason: alternative_reading
lexical_decisions:
- source_word: μακρὰν ἄπεχε
  choice: 要远离
  rationale: 该命令要求人主动保持距离；“要远离”简洁自然，也保留了劝诫的力度。
- source_word: ἀπὸ ἀνθρώπου
  choice: 那……的人
  rationale: ἀνθρώπου在这里指一个具体的人；汉语用“那……的人”能自然衔接后面的关系从句。
- source_word: ὃς ἔχει ἐξουσίαν
  choice: 有权
  rationale: ἐξουσίαν既可指权柄也可指能力；结合杀人的语境，“有权”突出其可支配他人生死的权势，同时不限定为司法权。
- source_word: τοῦ φονεῦσαι
  choice: 杀人
  rationale: 该不定式泛指夺取生命；“杀人”避免了“谋杀”所附加的非法含义，也不把语境收窄为正式处决。
- source_word: καὶ οὐ μὴ ὑποπτεύσῃς
  choice: 这样你就不必惧怕
  rationale: ὑποπτεύω可表示怀疑、预感或忧惧；与“死亡的恐惧”搭配时，译为“不必惧怕”较符合现代汉语，并表达远离此人所带来的结果。
- source_word: φόβον θανάτου
  choice: 死亡
  rationale: 原短语直译为“死亡的恐惧”；由于“惧怕”已在谓语中表达φόβον，宾语译作“死亡”可避免汉语重复。
theological_decisions:
- issue: 现存希伯来文与希腊文在本节呈现两个完全不同的格言
  choice: 正文依照希腊传统，译出远离有权杀人者的警告
  alternative: 依照现存希伯来文译作：“不可离弃老朋友，因为新朋友比不上他。”
  rationale: 所给资料将希伯来文标为重大不一致，并明确以希腊平行文本作为本节正文的翻译输入。两种读法无法调和，故正文采用希腊文，同时以脚注完整保留现存希伯来文异文。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“那有权杀人的人”保留具体单数对象以及ἐξουσία的权势含义；脚注明确交代希伯来文与希腊文之间无法合并的文本差异。
