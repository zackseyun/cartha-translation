base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/013.yaml
  text: Do not multiply words with a fool[a], and do not go to an unintelligent man. Keep away from him, so that you may not have trouble and may not be defiled by his shaking-off. Turn aside from him, and you will find rest, and you will not grow weary because of his madness.
translation:
  language: zh_hans
  text: 不要跟愚昧人多说话，也不要走近无知的人。你要提防他，免得惹上麻烦，又被他的甩动[a]所玷污。要避开他，你就会得享安息，也不会因他的疯狂而厌倦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“甩动”的希腊词十分罕见，含义难以确定；也可能泛指愚昧人的突然爆发、扰乱性的举动，或其行为所产生的沾染作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἄφρονος μὴ πληθύνῃς λόγον
  choice: 不要跟愚昧人多说话
  rationale: 保留“不要增多言语”的核心意思，并用自然的现代汉语表达智慧文学中的劝诫语气；“愚昧人”也保留其道德与判断力层面的含义。
- source_word: πρὸς ἀσύνετον μὴ πορεύου
  choice: 也不要走近无知的人
  rationale: πορεύου带有行走、趋近的动态意味；“走近”比单纯“接近”更能保留这一意象。ἀσύνετος指缺乏理解与辨识，并非现代意义上的智力低下，故译作“无知的人”。
- source_word: φύλαξαι ἀπʼ αὐτοῦ
  choice: 你要提防他
  rationale: 该中间语态命令式表达自我防护；“提防他”既自然，又包含保持警戒与距离的意思。
- source_word: κόπον ἔχῃς
  choice: 自找麻烦
  rationale: κόπος在此指与愚昧人来往所招致的劳苦、烦扰；结合劝人远离的上下文，“自找麻烦”准确而口语自然。
- source_word: μολυνθῇς
  choice: 被……所玷污
  rationale: 保留μολύνω较强的污染、玷污意味，不将其弱化为单纯受到影响。
- source_word: ἐν τῷ ἐντιναγμῷ αὐτοῦ
  choice: 被他的猛烈甩动所玷污
  rationale: ἐντιναγμός罕见而意义不确定，可能指甩动、抖落，也可能泛指爆发性或扰乱性的举动；正文采用较贴近词源意象的译法，并以脚注说明可能含义。
- source_word: ἔκκλινον ἀπʼ αὐτοῦ
  choice: 要避开他
  rationale: ἔκκλινω指偏离、转身躲开；“避开”在现代汉语中简洁自然，也保留主动远离之意。
- source_word: ἀνάπαυσιν
  choice: 安宁
  rationale: 此处不仅指身体休息，更指脱离烦扰后的安歇与舒缓；“安宁”符合语境。
- source_word: οὐ μὴ ἀκηδιάσῃς
  choice: 也不会……厌倦
  rationale: ἀκηδιάω可表示厌倦、疲惫、烦闷或灰心；“厌倦”保留其情绪与精神消耗的意味。
- source_word: ἐν τῇ ἀπονοίᾳ αὐτοῦ
  choice: 因他的疯狂
  rationale: ἀπόνοια可指失去理智、愚妄乃至疯狂；“疯狂”保留原词较强的语气，而“因”自然表达此处的原因关系。
