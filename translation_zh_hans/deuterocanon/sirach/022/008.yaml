  yaml_path: translation/deuterocanon/sirach/022/008.yaml
  text: Telling a story to one who is drowsy is like telling it to a fool[a], and at the end he will say, “What was it?”
translation:
  language: zh_hans
  text: 给昏昏欲睡的人讲述，就像给愚昧人讲述[a]；到讲完时，他会说：“刚才讲的是什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的句式较为生硬，重复了“讲述的人”（διηγούμενος……ὁ διηγούμενος）。这里表达的是类比：给昏昏欲睡的人讲述，就等于给愚昧人讲述。
    reason: textual_variant
lexical_decisions:
- source_word: διηγούμενος（διηγέομαι）
  choice: 讲述
  rationale: 该词表示详细叙说、讲述；中文“讲述”既自然，又不把内容限定为虚构的“故事”。
- source_word: νυστάζοντι（νυστάζω）
  choice: 向昏昏欲睡的人
  rationale: 该词指困倦、打瞌睡的状态；“昏昏欲睡”保留了听者因困倦而无法专心的形象。
- source_word: μωρῷ（μωρός）
  choice: 向愚昧人
  rationale: 在智慧文学语境中，该词常指在判断与行事上愚昧的人，不仅是智力低下者；“愚昧人”符合中文圣经智慧文学的庄重语体。
- source_word: ἐπὶ συντελείᾳ
  choice: 讲完以后
  rationale: 此短语表示叙述结束或完成之时；结合上下文译作“讲完以后”比抽象的“到了终结”更清楚自然。
- source_word: Τί ἐστιν;
  choice: 讲的是什么？
  rationale: 原文直译为“是什么？”。中文补出语境中隐含的“讲的”，保留突兀的疑问，也清楚表现听者没有听懂或没有留意。
