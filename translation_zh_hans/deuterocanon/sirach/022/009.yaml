  yaml_path: translation/deuterocanon/sirach/022/009.yaml
  text: Weep over the dead[a], for the light has failed; and weep over the fool[b], for understanding has failed.
translation:
  language: zh_hans
  text: 要为死者哀哭，因为光已经熄灭[a]；也要为愚人哀哭[b]，因为悟性已经消失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“光已经不复存在。”希腊文保留“光”的意象，没有直接说“生命”。
    reason: lexical_alternative
  - marker: b
    text: 这句话具有箴言式的表达：为愚人哀哭，是因为悟性已经消失；这里并未明确说愚人身体已经死亡。
    reason: cultural_note
lexical_decisions:
- source_word: κλαῦσον
  choice: 要……哀哭
  rationale: 这是 κλαίω 的命令式，指因哀伤而哭泣。译作“要……哀哭”既保留命令语气，也适合本句的丧悼语境。
- source_word: νεκρῷ
  choice: 死人
  rationale: ἐπί 加与格在此表示哀哭的对象。单数名词具有泛指、箴言式的力量；“死人”简明自然。
- source_word: ἐξέλιπεν
  choice: 已经熄灭／已经消失
  rationale: ἐκλείπω 可表示不复存在、止息或耗尽。中文若两处都机械译为“消失”，会削弱“光”的意象；因此按各自搭配译为“熄灭”和“消失”，同时以相同句式保留平行结构。
- source_word: φῶς
  choice: 光
  rationale: 原文用 φῶς（光）而非 ζωή（生命）。正文保留光的意象，不直接解释为“生命”。
- source_word: μωρῷ
  choice: 愚人
  rationale: μωρός 在智慧文学中不仅指智力不足，也指缺乏正确判断和道德智慧的人。“愚人”保留这一传统智慧文学类别及原文的尖锐语气。
- source_word: σύνεσιν
  choice: 悟性
  rationale: σύνεσις 指理解力、洞察力或明辨能力。“悟性”简洁，并能自然呈现愚人所缺失的智慧与判断。
theological_decisions:
- issue: φῶς 与死亡之间的隐喻关系
  choice: 正文保留“光已经熄灭”的意象
  alternative: 生命已经逝去
  rationale: 希腊文说的是“光”，没有直接使用“生命”。保留隐喻可避免把诗性的压缩表达解释得过满。
- issue: μωρός 的智慧文学含义
  choice: 译作“愚人”
  alternative: 不明智的人／愚昧的人
  rationale: “愚人”能保留智慧文学中兼具认知与道德意味的类别，不将其弱化为单纯智力不足。
- issue: 后半句是否暗指愚人死亡
  choice: 不在正文中补出愚人已经死亡
  alternative: 为死去的愚人哀哭
  rationale: 原文只说“悟性已经消失”，并未明确陈述愚人身体死亡；应保留这句箴言的张力与含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀哭”契合丧悼语境；“愚人”和“悟性”保留智慧文学的语域。中文正文优先采用自然搭配，因此两处 ἐξέλιπεν 分别译为“熄灭”和“消失”，但用重复句式维持希腊文的平行结构。
