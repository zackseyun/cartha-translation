  yaml_path: translation/deuterocanon/sirach/022/027.yaml
  text: Who will set a guard over my mouth, and a shrewd seal over my lips, so that I may not fall because of it, and my tongue destroy me?
translation:
  language: zh_hans
  text: 谁能在我的口上安设看守，在我的嘴唇上加上一道巧妙的封印，使我不因它[a]跌倒，我的舌头也不毁灭我？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”在希腊文中的具体所指不明确；可能与下文的“舌头”有关，也可能泛指口舌所造成的危险。
    reason: 说明原文阴性代词的真实指代歧义，避免译文未经证实地将其限定为某一对象。
lexical_decisions:
- source_word: φυλακήν
  choice: 守卫
  rationale: 保留“看守、防护”这一具体意象；“设守卫”在现代汉语中清楚自然。
- source_word: σφραγῖδα πανοῦργον
  choice: 巧妙的封印
  rationale: σφραγίς指用于封闭、约束的印封；πανοῦργος在此表示机巧、有效而周密，并非道德意义上的奸诈，因此译作“巧妙”，同时保留原文略显突出的拟人化搭配。
- source_word: πέσω
  choice: 跌倒
  rationale: 保留动词的具象表达及其可能引申的失足、陷入过错之意，不将含义限定为“犯罪”。
- source_word: ἀπολέσῃ
  choice: 毁灭
  rationale: 表达强烈的败坏、毁掉之义，不弱化为一般的“伤害”或“惹祸”。
theological_decisions:
- issue: αὐτῆς的指代
  choice: 正文保留“它”的模糊指代，并加注说明
  alternative: 明确译为“因舌头”或“因口”
  rationale: 希腊文阴性代词在本句中没有清晰对应的前置阴性名词，可能前指一个省略或隐含的概念，也可能与随后出现的阴性名词“舌头”相关；不宜在译文中武断消除这种歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“口上设守卫”和“嘴唇上加一道巧妙的封印”保留原文平行结构与鲜明意象；句末用“也不让……”使汉语衔接自然，同时维持祈愿式反问的语气。
