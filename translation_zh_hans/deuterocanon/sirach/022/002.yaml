  text: A lazy man is compared to a lump of dung[a]; everyone who picks it up will shake off his hand.
translation:
  language: zh_hans
  text: 懒惰人好比一团粪便[a]；谁把它捡起来，谁就会甩甩手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译为：“懒惰人被扔到一处，与一团粪便混在一起。”这是把 συνεβλήθη 理解为实际的投掷或混在一起，而不是“相比”；按上下文的格言形式，“好比”更为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: βολβίτῳ κοπρίων
  choice: 一团粪便
  rationale: βολβίτῳ指圆团或土块状之物，κοπρίων说明其材质；合译为“一团粪便”，保留原文具体而贬抑的意象，也符合现代汉语表达。
- source_word: συνεβλήθη
  choice: 好比
  rationale: 此处采用“相比、比作”的语义，最契合智慧格言的比喻结构；同时以脚注保留其可按物理动作理解为“被扔在一起”的可能性。
- source_word: ὀκνηρός
  choice: 懒惰人
  rationale: 该词意为懒散、怠惰的人；“懒惰人”简洁自然，并保留希腊文阳性单数的泛指人物形象。
- source_word: πᾶς ὁ ἀναιρούμενος αὐτόν
  choice: 谁把它捡起来
  rationale: ἀναιρέω在此最自然地表示拿起、捡起；代词依随粪团的比喻对象译作“它”，使意象连贯。
- source_word: ἐκτινάξει χεῖρα
  choice: 就会把手甩干净
  rationale: ἐκτινάσσω表示甩掉、抖落；“把手甩干净”自然呈现触碰污物后急于除去沾染的动作，并保留单数“手”。
