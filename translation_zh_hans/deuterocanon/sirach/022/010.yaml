  text: Weep more sweetly over the dead[a], because he has found rest,
translation:
  language: zh_hans
  text: 为死者哀哭时，要稍微舒缓些[a]，因为他已经得了安息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “稍微舒缓些”直译可作“更甘美地”或“更加愉快地”；这里可能是说，为死者哀哭可以较为舒缓或节制。
    reason: 说明ἥδιον不寻常的字面意义及其在哀悼语境中的可能含义。
lexical_decisions:
- source_word: ἥδιον
  choice: 轻缓一些
  rationale: 这是ἡδύς的比较级副词，字面可指“更甘美地、更加愉快地”。用于哀哭语境时，直译容易在现代汉语中产生误解；“轻缓一些”保留比较意味，并表达哀恸可以有所节制，但不把原词的语义收窄到“不那么悲伤”。
- source_word: κλαῦσον
  choice: 哀哭
  rationale: κλαίω的不定过去时命令式，意为哭泣或哀哭；此处对象是死者，“哀哭”自然且准确，并保留命令语气。
- source_word: ἐπὶ νεκρῷ
  choice: 为死者
  rationale: ἐπί加与格在此标明哀哭的对象；“为死者”是自然的现代汉语表达。νεκρός为单数，按泛指的死者处理。
- source_word: ὅτι
  choice: 因为
  rationale: 明确引出前述劝告的原因，保留原文的因果关系。
- source_word: ἀνεπαύσατο
  choice: 已经得了安息
  rationale: ἀναπαύομαι的不定过去时中间语态，表示得到或进入安息。“已经得了安息”自然传达完成性，又不额外加入埋葬、睡眠或来世状态的细节。
theological_decisions:
- issue: 把死亡描述为安息的含义
  choice: 译作“已经得了安息”，不作教义性扩展
  alternative: 已经睡了／已经入土为安／已经停止劳苦
  rationale: 原文以智慧文学的语言把死者的状态称为安息，却没有在本句说明灵魂、中间状态或复活等教义细节；译文保留这一意象及其张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“为死者哀哭，要轻缓一些”以话题式结构避免生硬副词堆叠；“得了安息”保留经文语体，但普通读者仍易理解。
