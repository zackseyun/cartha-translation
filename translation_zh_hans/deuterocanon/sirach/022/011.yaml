translation:
  language: zh_hans
  text: 愚昧人的恶劣生活[a]比死亡更糟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶劣的生活”也可译作“邪恶的生活”或“悲惨的生活”；希腊语直译为“恶的生活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μωροῦ
  choice: 愚昧人
  rationale: μωρός指愚笨、缺乏明辨的人；“愚昧人”符合中文智慧文学的常用表达，也比“傻瓜”更庄重。
- source_word: ὑπὲρ θάνατον
  choice: 比死亡更糟
  rationale: ὑπέρ在此具有比较意味；结合格言式句法，表示这种生活较死亡更为恶劣、难堪。译作“比死亡更糟”自然清楚，同时不过度限定为痛苦或道德定罪。
- source_word: ζωὴ πονηρά
  choice: 邪恶的生活
  rationale: πονηρά既可指道德上的邪恶，也可指恶劣、困苦或可悲。“邪恶的生活”贴近希腊语表层措辞，并借脚注保留较宽的语义范围。
- source_word: τοῦ δὲ
  choice: 但对……来说
  rationale: δέ承接上文并形成轻微转折；属格τοῦ μωροῦ在此表达相关对象，“但对……来说”符合现代汉语。
theological_decisions:
- issue: 智慧文学语境中πονηρά的含义
  choice: 正文译作“邪恶的生活”，不把含义缩减为纯粹的悲惨处境
  alternative: 悲惨的生活；困苦的生活；败坏的生活
  rationale: 原文可同时唤起道德败坏与生活恶劣、可悲两层意味。正文采用较贴近字面的译法，脚注交代其他可能，保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“愚昧人”保持智慧文学语域；整体维持简洁的格言句式。
