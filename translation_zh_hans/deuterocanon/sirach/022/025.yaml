  text: I will not be ashamed to shelter a friend[a], and from his presence I will certainly not hide myself,
translation:
  language: zh_hans
  text: 我不以庇护朋友为耻，也绝不躲着不见他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作“我绝不会从他面前被隐藏”；κρυβῶ也可按语境理解为“我绝不会躲藏起来”。
    reason: 保留动词可能具有的被动或反身含义，以及“从他面前”这一较直译的表达。
lexical_decisions:
- source_word: φίλον
  choice: 朋友
  rationale: φίλον是单数宾格，在这里泛指受庇护的对象；译作“朋友”自然，也不增添原文未明说的“我的”。
- source_word: σκεπάσαι
  choice: 庇护
  rationale: σκεπάζω可表示遮盖、掩护或保护。此处与“不以……为耻”相连，重点是公开保护、支持朋友；“庇护”既保留遮护意象，也符合现代汉语表达。
- source_word: οὐκ αἰσχυνθήσομαι
  choice: 不以……为耻
  rationale: 该形式在此表示“不会感到羞耻”；汉语用“不以庇护朋友为耻”简洁而忠实。
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: 躲着不见他
  rationale: πρόσωπον本义为“脸”，短语ἀπὸ προσώπου可指“从某人面前”或“离开某人的临在”。结合κρυβῶ，译为“躲着不见他”自然地表达不从朋友面前退避。
- source_word: οὐ μὴ κρυβῶ
  choice: 绝不躲着
  rationale: οὐ μή加虚拟语气构成强烈否定。κρυβῶ形式上可作被动理解，也可按语境表达主体躲藏；正文采用自然的主动反身含义，并以“绝不”保留强调语气。
