  text: Teaching a fool is like gluing a potsherd[a], like waking one from a deep sleep.
translation:
  language: zh_hans
  text: 教导愚昧人，就像粘合一块陶片[a]，又像把人从酣睡中唤醒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式化地可译作：“教导愚昧人的，是在粘合一块陶片，是在把一个沉睡的人从酣睡中唤醒。”希腊文以两个分词描绘这两项行动，并未明说“就像”。
    reason: 保留原文以分词并列形成的格言性表达；正文依汉语习惯明确其比较关系。
lexical_decisions:
- source_word: συγκολλῶν
  choice: 粘合
  rationale: 该现在分词指把东西粘接、接合起来；“粘合”保留了具体动作及修补陶器的意象。
- source_word: ὄστρακον
  choice: 一块陶片
  rationale: 该词可指陶器或陶片；此处用单数“一块陶片”贴近希腊文形式，同时保留看似徒劳的修补意象。
- source_word: ὁ διδάσκων
  choice: 教导
  rationale: 带冠词的分词直译为“那教导……的人”；在汉语格言中用“教导愚昧人”更自然，并保留泛指意义。
- source_word: μωρόν
  choice: 愚昧人
  rationale: 智慧文学中的 μωρός 不只表示智力不足，也涉及不肯受教的思想和行为；“愚昧人”比“笨人”更能保留这一层面。
- source_word: ἐξεγείρων
  choice: 唤醒
  rationale: 该分词意为叫醒、唤起；“唤醒”清楚而庄重。
- source_word: καθεύδοντα
  choice: 一个沉睡的人
  rationale: 该分词直指“正在睡的人”；译出“沉睡的人”可使汉语对象明确，并与后面的“酣睡”意象相连。
- source_word: ἐκ βαθέος ὕπνου
  choice: 使他从酣睡中醒来
  rationale: 原义是“从深沉的睡眠中”；“从酣睡中醒来”符合现代汉语表达，并保留睡眠之深。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的格言体。正文补出“就像”以表达两个并列意象的比较关系；脚注交代希腊文并无显式比喻词。用“愚昧人”保持智慧文学用语的伦理与认知张力，避免仅理解为智力低下。
