  yaml_path: translation/deuterocanon/sirach/022/017.yaml
  text: A heart set firm on thoughtful understanding is like a plastered wall with a sanded finish[a].
translation:
  language: zh_hans
  text: 以明智的思虑为依托而坚定的心，犹如一面经刮抹平整的墙的沙灰饰面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的建筑比喻十分紧缩，近似直译为：“以明智思虑为依托而坚定的心，犹如经刮抹平整之墙的沙质整饰。”描述墙面工艺的词义并不完全确定：它可能指含沙灰浆形成的饰面，也可能强调经刮削、整平的墙面。比喻所传达的是稳固、构造完善的意象。
    reason: cultural_note
lexical_decisions:
- source_word: καρδία
  choice: 心
  rationale: 在智慧文学中指人的思想、判断与意志所在；“心”既保留圣经的人观，也符合现代汉语表达。
- source_word: ἠδρασμένη
  choice: 坚定
  rationale: 表达已经被稳固、立定的结果状态；与后面的建筑比喻相呼应。
- source_word: ἐπὶ διανοίας συνέσεως
  choice: 以明智的思想为根基
  rationale: 原文结构紧缩，ἐπὶ可表示所依托的基础，διανοία与σύνεσις共同涉及思想和理解；此译保留两层含义，又不把关系解释得过死。
- source_word: ὡς
  choice: 如同
  rationale: 明确引出比喻，庄重而自然。
- source_word: κόσμος
  choice: 饰面
  rationale: κόσμος可指装饰或整饰；在墙体语境中译为“饰面”，既保留装饰义，也体现建筑表层。
- source_word: ψαμμωτός
  choice: 沙灰
  rationale: 该罕见词与“沙”有关，可能指含沙的灰浆或沙质表层；“沙灰”比“打磨”更能保留材料层面的可能性。
- source_word: τοίχου ξυστοῦ
  choice: 抹平的墙
  rationale: τοῖχος是墙；ξυστός含刮削、磨平之意。译作“抹平的墙”保持建筑图景，同时避免武断指定为抛光或粉刷。
