  text: One who pricks an eye brings forth tears[b][a], and one who pricks a heart reveals feeling.
translation:
  language: zh_hans
  text: 刺眼睛的人，会使眼泪流下[a]；刺人心的人，会使感受显露出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“会引出眼泪”；希腊文直译带有“使眼泪向下流”的意思。
    reason: lexical_alternative
  - marker: b
    text: “感受”也可译作“感觉”“知觉”或“感受力”；希腊词可指感觉、知觉或内在感受。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νύσσων
  choice: 刺……的
  rationale: 原词指用尖锐之物刺、戳；中文用“刺”既保留具体动作，也能自然延伸到“刺人心”的比喻，并使两分句保持对应。
- source_word: ὀφθαλμόν
  choice: 眼睛
  rationale: 无冠词单数在此表达泛指；现代汉语无需添加不定标记，译作“眼睛”自然清楚。
- source_word: κατάξει δάκρυα
  choice: 会使眼泪流下
  rationale: κατάγω在此带有使之向下、使之流出的形象；“使眼泪流下”既保留动态意象，也符合现代汉语表达。
- source_word: καρδίαν
  choice: 人心
  rationale: 这里的“心”指人的内在生命和情感所在，而非仅指身体器官；“人心”可避免误读，并与比喻语境相合。
- source_word: ἐκφαίνει
  choice: 使……显露出来
  rationale: 该动词表示使隐藏在内的事物显明、呈现；“显露出来”保留由内而外的动态。
- source_word: αἴσθησιν
  choice: 内在的感受
  rationale: 该名词可指感觉、知觉、感受或感受力。与“心”搭配时，“内在的感受”较自然，但不把词义限定为纯粹情绪。
