  yaml_path: translation/deuterocanon/sirach/022/020.yaml
  text: One who throws a stone at birds drives them away[b][a], and one who reproaches a friend will break up friendship.
translation:
  language: zh_hans
  text: 向鸟投石的，会把它们赶走[a]；责骂[b]朋友的，会断送友谊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会把它们吓跑。”希腊语动词表示驱赶或使之逃离。
    reason: lexical_alternative
  - marker: b
    text: “责骂”也可译作“辱骂”或“羞辱”；希腊语词可指责备人，也可带有侮辱、使人蒙羞的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλων λίθον ἐπὶ πετεινὰ
  choice: 向鸟投石的
  rationale: 以汉语自然的箴言式结构表达泛指的现在分词；“鸟”准确传达 πετεινά 在本句中的通常所指，“向……投石”保留动作的方向与敌意。
- source_word: ἀποσοβεῖ αὐτά
  choice: 会把它们赶走
  rationale: ἀποσοβέω 表示驱赶、使逃离；“赶走”直接清楚，并与投石的结果相符。
- source_word: ὁ ὀνειδίζων φίλον
  choice: 责骂朋友的
  rationale: ὀνειδίζω 可指责备、辱骂或以言语羞辱。“责骂”保留其负面的言语攻击色彩，又不把程度限定为最强烈的辱骂。
- source_word: διαλύσει φιλίαν
  choice: 会断送友谊
  rationale: διαλύω 在此指使关系瓦解；“断送友谊”是自然、庄重的现代汉语，明确表达该行为造成友谊破裂的结果。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的箴言体，以“……的，会……”呈现希腊语两个泛指分词结构。措辞现代而庄重，保留原文由驱鸟类比破坏友谊的鲜明因果关系。
