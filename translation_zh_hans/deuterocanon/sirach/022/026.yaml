revisions:
- from: 即使我因他而遭遇祸患[a]，凡听见的人都会提防他。
  to: 而如果我因他遭遇祸患[a]，凡听见的人都必提防他。
  rationale: The revision removes the unwarranted concessive force of “即使,” represents the Greek connective with “而,” and uses “都必” for the future result. The footnote remains anchored to “祸患” and preserves the stated lexical alternative without over-specifying the nature of the harm or the person’s precise role.
