  text: And if harm comes to me through him[a], everyone who hears will guard himself from him.
translation:
  language: zh_hans
  text: 而如果我因他遭遇祸患[a]，凡听见的人都必提防他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因他而遭遇祸患”或译“祸事因他临到我”。
    reason: 保留κακά与συμβήσεται所表达的祸患临到之意，并反映διʼ αὐτόν可表原因或由此人所致的关系。
lexical_decisions:
- source_word: κακά
  choice: 祸患
  rationale: 中性复数在此指临到说话者的不利之事或伤害后果；“祸患”自然、庄重，也不把含义局限为身体伤害或道德邪恶。
- source_word: μοι
  choice: 我……遭遇
  rationale: 与格标明事件所影响的人；汉语以“我遭遇”自然表达“临到我”。
- source_word: συμβήσεται
  choice: 遭遇
  rationale: 该动词表示“发生、临到”；与“祸患”搭配时，“遭遇”符合现代汉语表达。
- source_word: διʼ αὐτόν
  choice: 因他
  rationale: διά接宾格通常表达原因；“因他”保留此人导致或牵涉其中的意思，同时不进一步断定具体方式。
- source_word: πᾶς ὁ ἀκούων
  choice: 凡听见的人
  rationale: 实体化分词泛指任何听见此事的人；不增补希腊文未明说的宾语，以保留原句的简练与语境依赖。
- source_word: φυλάξεται
  choice: 都会提防
  rationale: 将来中间态含有为自身采取防备的意味；“提防”在现代汉语中自然体现自我保护。
- source_word: ἀπʼ αὐτοῦ
  choice: 他
  rationale: ἀπό表示与危险人物保持防备或距离；汉语“提防他”自然包含防范此人的意思。
theological_decisions:
- issue: πᾶς ὁ ἀκούων的泛指性别表达
  choice: 凡听见的人
  alternative: 凡听见的男人
  rationale: 希腊文阳性单数分词在此作泛指，不限于男性；“凡……的人”准确传达其普遍范围。
- issue: διʼ αὐτόν所表达的因果或媒介关系
  choice: 因他
  alternative: 借着他
  rationale: διά接宾格更自然地表示原因；“因他”保留其责任或牵连关系，却不武断说明他是直接施害者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“即使”承接本节假设性的让步语气；“提防他”比直译为“防守自己远离他”更符合普通话习惯，同时保存中间态的自我防范含义。
