  text: Before bloodshed come the furnace’s vapor and smoke[b][a]; so before bloodshed comes abuse.
translation:
  language: zh_hans
  text: 火起之前，炉中先有热气和烟；同样，流血[a]之前，先有辱骂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文为“血”（复数），这里指流血事件或暴力行为。
    reason: lexical_alternative
  - marker: b
    text: 或译“侮辱”“谩骂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ
  choice: ……之前
  rationale: 两处均表达时间上的先后关系；中文用“……之前，先有……”自然呈现这一格言式对照。
- source_word: πυρὸς
  choice: 炉火
  rationale: πῦρ意为“火”；结合καμίνου所构成的熔炉意象，译作“炉火”能使中文图景完整，又不削弱火势的强烈感。
- source_word: ἀτμὶς
  choice: 热气
  rationale: ἀτμίς指蒸腾的气体、雾气或热气。在熔炉语境中，“热气”比容易让人联想到水汽的“蒸气”更自然。
- source_word: καμίνου
  choice: 炉
  rationale: καμίνος指炉、窑或熔炉。此处以“炉火”整合其所属关系，形成自然简洁的中文意象。
- source_word: καπνός
  choice: 烟
  rationale: 直接对应烟雾，并与“热气”并列，作为炉火出现前的征兆。
- source_word: οὕτως
  choice: 同样
  rationale: 明确引出物象与人际冲突之间的类比，符合现代汉语格言的表达习惯。
- source_word: αἱμάτων
  choice: 流血
  rationale: 原文为“血”的复数形式，在此是表示流血事件或暴力行为的惯用说法；“流血”准确而自然。
- source_word: λοιδορία
  choice: 辱骂
  rationale: 该词指侮辱、谩骂或恶言攻击；“辱骂”突出言语性质，也保留从恶言发展到暴力的警示。
theological_decisions:
- issue: 恶言与流血之间的道德进程
  choice: 译为辱骂在流血之前出现的格言式警告
  alternative: 译成辱骂必然导致流血，或辱骂与流血同时发生
  rationale: 两次πρὸ最自然地表示先后次序。译文保留警戒意味，却不把这句话扩展为每次辱骂都必然造成暴力的决定论断言。
translation_notes:
  register: 采用简洁、庄重而口语可懂的现代标准汉语。以“炉火燃起”补足汉语所需的动态表达，并用“先有”呈现原文省略系词的格言结构；分号保留两半之间鲜明的类比关系。
