    rationale: δολία主要指欺骗、诡诈或背信，并不必然表示行为秘密进行；“暗中”增加了原文未明示的情节。
  - severity: low
    issue: “遇到这些事”略弱化了原文“在这些事上／若有这些事”的例外条件结构。
    rationale: 原文先说明通常仍有和好的可能，随后列出使每一位朋友退避的例外；调整连接可使逻辑更清楚。
