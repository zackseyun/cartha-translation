base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/022.yaml
  text: If you open your mouth against a friend[a], do not be afraid, for there can be reconciliation—except in the case of insult and arrogance and the revealing of a secret and a treacherous blow; in these things every friend will flee.
translation:
  language: zh_hans
  text: 你若开口得罪朋友，不要害怕[a]，因为仍可和好。不过，辱骂、傲慢、泄露秘密和背信的伤害除外；若有这些事，任何朋友都会离去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要顾虑”或“不要畏缩”。希腊语动词可表示害怕、戒备或谨慎；下文“仍可和好”表明这里是在劝人不要因这次冒犯就放弃修复友谊。
    reason: 保留μὴ εὐλαβηθῇς的词义幅度及其语境上的不确定性。
lexical_decisions:
- source_word: ἐπὶ φίλον ἐὰν ἀνοίξῃς στόμα
  choice: 你若开口得罪了朋友
  rationale: 保留“开口”的具体意象，并按ἐπί加宾格及下文“和好”的语境，将言语理解为针对或冒犯朋友，而不是中性的“对朋友说话”。
- source_word: μὴ εὐλαβηθῇς
  choice: 不要害怕
  rationale: εὐλαβέομαι可表示害怕、顾虑或谨慎；下句说明仍有和好的可能，因此正文采用直接而不越出词义范围的“不要害怕”，并以脚注保留其他可能。
- source_word: διαλλαγή
  choice: 和好
  rationale: 该词指关系破裂后的复和；“和好”比抽象的“和解”更贴近日常友谊语境，同时保持庄重。
- source_word: ὀνειδισμοῦ
  choice: 辱骂
  rationale: 表达以言语羞辱、斥骂他人的行为，符合此处列举严重破坏友谊之事的语境。
- source_word: ὑπερηφανίας
  choice: 傲慢
  rationale: 该词指凌驾于人的高傲态度；“傲慢”准确呈现其人际关系层面的冒犯。
- source_word: μυστηρίου ἀποκαλύψεως
  choice: 泄露秘密
  rationale: 此处μυστήριον是受托保守的隐情，而非神学意义上的“奥秘”；“泄露秘密”自然清楚。
- source_word: πληγῆς δολίας
  choice: 暗中伤害
  rationale: πληγή可指击打或伤害，δολία强调欺骗和奸诈；“暗中伤害”兼顾加害与背信意味，也避免武断限定为字面的一击。
- source_word: ἀποφεύξεται πᾶς φίλος
  choice: 任何朋友都会离去
  rationale: 保留πᾶς的分配意义，并以“离去”表达ἀποφεύξεται所指的彻底躲开、退出关系。
