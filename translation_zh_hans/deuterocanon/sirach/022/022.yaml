  to: 你若开口得罪朋友，不要害怕[a]，因为仍可和好。不过，辱骂、傲慢、泄露秘密和背信的伤害除外；若有这些事，任何朋友都会离去。
  rationale: 修订仅消除“暗中”对奸诈／背信含义的额外限定，并微调例外结构的中文衔接。保留“不要害怕”及其脚注，以免在有词义争议之处把“顾虑”或“不要绝望”等解释性理解写死为正文。
