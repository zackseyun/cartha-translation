base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/023.yaml
  text: Gain faith with your neighbor in poverty[a], so that in his good things you may be filled together. In a time of distress remain with him[b], so that you may inherit along with him in his inheritance.
translation:
  language: zh_hans
  text: 要在贫困中与邻舍建立信任[a]，好使你在他的美好事物中也一同饱足[b]。患难之时，要留在他身边，好使你能与他一同承受他的产业[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信任”也可译作“忠信”。这里的“信”主要指人与人之间的信赖或忠诚。
    reason: lexical_alternative
  - marker: b
    text: “美好事物”也可译作“好处”“财物”或“富足”。
    reason: lexical_alternative
  - marker: c
    text: “产业”也可译作“遗产”或“所得的份”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν κτῆσαι
  choice: 赢得……的信任
  rationale: κτῆσαι表示取得、赢得；在人际友谊与患难相守的语境中，πίστις主要指信任或可靠的关系，而非抽象的宗教信仰。
- source_word: ἐν πτωχείᾳ
  choice: 在贫困中
  rationale: 直接保留πτωχεία的贫穷、贫困之义；希腊文未明说是谁贫困，因此中文也不增添“你”或“他”。
- source_word: μετὰ τοῦ πλησίον
  choice: 邻舍
  rationale: πλησίον指身边的人、邻舍；采用现代中文圣经语域中清楚而常见的“邻舍”。
- source_word: ἐν τοῖς ἀγαθοῖς αὐτοῦ
  choice: 在他的福乐中
  rationale: ἀγαθά可指好处、财物或顺境；“福乐”能兼顾物质富足与广义福分，不把含义限定为财产。
- source_word: ὁμοῦ πλησθῇς
  choice: 也一同饱足
  rationale: 保留ὁμοῦ的共同参与及πληρόω被动式“得饱足”的意象；“也”显明与邻舍共同分享。
- source_word: ἐν καιρῷ θλίψεως
  choice: 患难之时
  rationale: θλῖψις表示困苦、压迫或患难；此译简洁庄重，并与后文坚守相配。
- source_word: διάμενε αὐτῷ
  choice: 要留在他身边
  rationale: διαμένω表示持续留下、坚持不离；译文传达人际忠诚，而不过度解释为某种特定行动。
- source_word: συνκληρονομήσῃς
  choice: 与他一同承受
  rationale: 该复合动词表示与另一人共同承受产业；保留“承受”的继承语义及共同性。
- source_word: ἐν τῇ κληρονομίᾳ αὐτοῦ
  choice: 在他的产业中
  rationale: κληρονομία可指遗产、产业或所得的份；“产业”在智慧文学语境中自然，也保留其范围上的开放性。
theological_decisions:
- issue: 人际语境中的πίστις
  choice: 信任
  alternative: 信实；信仰
  rationale: 上下文论及邻舍在贫困、福乐和患难中的关系，故“信任”最合语境。“信实”也可能强调忠诚可靠，但“信仰”在这里容易被误解为专指对上帝的信。
- issue: 共同承受产业是否具有后期神学术语色彩
  choice: 按普通继承意义译为“与他一同承受”
  alternative: 成为共同继承人
  rationale: 本节是朋友忠诚的智慧劝诫；译文保留共同继承的形象，却不引入后期书信中可能具有的专门救恩论含义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。两个“好使”对应两个ἵνα目的从句；不补出贫困属于谁，以保存原文歧义。以“邻舍”保持智慧文学及经文语域，以“留在他身边”自然表达持续忠诚。
