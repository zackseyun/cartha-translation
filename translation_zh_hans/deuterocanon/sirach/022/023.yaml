revisions:
- from: 要在贫困中赢得邻舍的信任[a]，好使你在他的福乐中也一同饱足[b]。患难之时，要留在他身边，好使你在他的产业中与他一同承受[c]。
  to: 要在贫困中与邻舍建立信任[a]，好使你在他的美好事物中也一同饱足[b]。患难之时，要留在他身边，好使你能与他一同承受他的产业[c]。
  rationale: 修订避免把“与邻舍”的互相关系预设为单向的“赢得对方信任”，以保留希腊文的语义开放性；同时调整“福乐”和末句搭配，使现代标准汉语更自然，并维持原文关于美好事物及共同承受产业的宽泛表达。脚注锚点均紧随其所说明的词语。
