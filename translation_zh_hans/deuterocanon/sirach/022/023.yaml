  terminology: “邻舍”“患难”“产业”均符合庄重而现代的经文语域。“信任”适合πίστις在此人际关系语境；脚注中的备选词以“忠信”比“信实”更贴合普通人际忠诚。“美好事物”保留ἀγαθά可指益处、财物或顺遂的宽泛含义。
