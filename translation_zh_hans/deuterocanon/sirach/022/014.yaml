  text: What is heavier than lead? And what name does such a one have but “fool”?[a]
translation:
  language: zh_hans
  text: 有什么比铅更沉重呢？这样的人，除了“愚人”，还能叫什么呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“什么会变得比铅更沉重？它／他的名字除了‘愚人’还会是什么？”希腊文是一句高度凝练的箴言，代词的指向也较含混。
    reason: 保留原文的语法形式、压缩表达及αὐτῷ可能兼具“它／他”的歧义。
lexical_decisions:
- source_word: ὑπὲρ μόλυβον
  choice: 比铅
  rationale: ὑπέρ与宾格在此构成比较表达；现代汉语自然译作“比铅”，保留铅作为沉重之物的比喻基准。
- source_word: τί βαρυνθήσεται
  choice: 有什么……更沉重呢
  rationale: βαρυνθήσεται虽为将来时被动或中间形式，在这则凝练的箴言中表达比较意义。译文采用一般性反问，使汉语通顺而不把时态形式过度实化。
- source_word: τί αὐτῷ ὄνομα
  choice: 这样的人……还能叫什么呢
  rationale: 直译近于“它／他的名字是什么”。结合下文阳性名词μωρός，所指最终落在被称为愚人的人；“这样的人”在汉语中自然承接前句，同时脚注保留代词指向上的压缩与歧义。
- source_word: ἀλλʼ ἢ
  choice: 除了……还能
  rationale: 该组合在反问中排除其他答案，汉语用“除了……还能……”准确传达“除……以外”的唯一性。
- source_word: μωρός
  choice: 愚人
  rationale: “愚人”符合智慧文学的庄重语域，既涉及判断与品格，也避免“笨蛋”等过度口语化或侮辱性的表达。
