base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/018.yaml
  text: Stakes set on a height opposite the wind will never hold out[a]; so a timid heart, set on a foolish thought[b], will never hold out against any fear.
translation:
  language: zh_hans
  text: 插在高处、迎风而立的木桩，绝不能站稳[a]；同样，建立在愚妄念头上的胆怯之心，面对任何惊恐，也绝不能撑住[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迎风而立”也可译作“正对着风”或“顶风而立”；希腊文描绘木桩直接暴露在风中的景象。
    reason: lexical_alternative
  - marker: b
    text: 希腊文两处都使用强烈否定语气，意思是“必定不能持守”。
    reason: source_emphasis
lexical_decisions:
- source_word: χάρακες
  choice: 木桩
  rationale: 指尖削或用于围障的桩柱；“木桩”具体自然，也能清楚呈现暴露在风中的形象。
- source_word: ἐπὶ μετεώρου κείμενοι
  choice: 插在高处
  rationale: μετέωρος表示高起、悬置或处于高处；结合木桩意象，译作“插在高处”既自然，又保留其高而暴露、不稳固的处境。
- source_word: κατέναντι ἀνέμου
  choice: 迎风而立
  rationale: κατέναντι表示在……对面、面对；这里指木桩直接面对风。“迎风而立”保留空间关系，并在中文中呈现直接受风的画面。
- source_word: οὐ μὴ ὑπομείνωσιν / οὐ μὴ ὑπομείνῃ
  choice: 绝不能站稳 / 绝不能撑住
  rationale: οὐ μή加虚拟式表达强烈的将来否定；按物理意象与内心类比分别译为“绝不能站稳”和“绝不能撑住”，既保留重复和强调，也符合现代汉语搭配。
- source_word: καρδία δειλή
  choice: 胆怯之心
  rationale: δειλή表示怯懦、惧怕；“胆怯”准确表达面对恐惧时的软弱，又不过度加重道德谴责。
- source_word: ἐπὶ διανοήματος μωροῦ
  choice: 建立在愚妄念头上
  rationale: διανόημα可指思想、意念、打算；“念头”保留其范围，不把它限定为计划或推理。“建立在……上”也呼应前半句木桩所处的基础。
- source_word: παντὸς φόβου
  choice: 任何惊恐
  rationale: πᾶς在此具有逐一、无论何种的意味；“任何”传达这种广泛性。“惊恐”使φόβος与胆怯之心所遭遇的威胁自然衔接。
