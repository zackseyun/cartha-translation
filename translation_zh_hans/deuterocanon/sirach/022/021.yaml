  text: If you draw a sword against a friend[a], do not despair[b], for there can be a return.
translation:
  language: zh_hans
  text: 你若向朋友拔剑[a]，不要绝望，因为仍有回转的余地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你若对朋友拔剑。”希腊文动词的本义是“拉、抽出”；与剑连用时，意为拔出兵器。
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为有回转（或返回）。”也可译：“因为还有回头的路。”原文没有明确说明回转的是人、关系，还是处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: 向朋友
  rationale: ἐπί加宾格在敌对行动语境中表示动作所针对的对象。“向朋友”与“拔刀”连用，自然表达把武力指向朋友；其敌对含义由整句显明，无须另加解释。
- source_word: ἐὰν σπάσῃς
  choice: 你若……拔
  rationale: σπάω本义为拉、抽出；以刀剑为宾语时指拔刀。“你若”准确保留不定条件句的语气。
- source_word: ῥομφαίαν
  choice: 刀
  rationale: ῥομφαία指刀剑类长兵器，常可指较大的剑。现代汉语“拔刀”是自然、清楚的固定搭配，也避免用“剑”可能带来的文雅或特定兵器色彩。
- source_word: μὴ ἀπελπίσῃς
  choice: 不要绝望
  rationale: 保留否定命令的力度，并准确表达ἀπελπίζω所含的失去希望之意。
- source_word: ἔστιν γὰρ ἐπάνοδος
  choice: 因为还有挽回的余地
  rationale: ἐπάνοδος本指返回、回转；在朋友关系遭到严重破坏的语境中，“挽回的余地”自然表达关系仍可能恢复，同时不武断断言已经和好。脚注保留原文的返回意象。
theological_decisions:
- issue: 对朋友动刀之后“回转”的含义
  choice: 表达严重破裂之后关系仍有挽回的可能
  alternative: 泛指仍有回头的路，或指犯错者本人仍可回转
  rationale: 原文先用具体的拔刀意象，继而只说“有回转”，没有明定回转的主体或完整程度。正文按朋友关系的上下文表达可挽回性，但不写成必然和好；脚注提示原文较开放的措辞。
- issue: 拔刀是实指还是夸张比喻
  choice: 保留具体的拔刀形象，不判定其为实指或比喻
  alternative: 明确解释为实际暴力，或解释为严重冒犯的夸张说法
  rationale: 希腊文本本身使用具体武力形象，却未说明事件是否实际发生。直译意象可保存其张力与开放性。
translation_notes:
  register: 采用现代、庄重而通俗的表达。“向朋友拔刀”保留原文鲜明的武力意象；“还有挽回的余地”符合现代汉语习惯。正文中的[a]、[b]均与脚注对应。
