  yaml_path: translation/deuterocanon/sirach/022/001.yaml
  text: A lazy man is compared to a filthy stone[b][a], and everyone will whistle at his disgrace.
translation:
  language: zh_hans
  text: 懒汉好比一块污秽的[a]石头；人人都会因他的耻辱而向他发嘘声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “污秽的”所译的希腊词十分罕见，也可译作“沾了污垢的”或“被弄脏的”；其确切语感难以确定，但负面含义清楚。
    reason: lexical_alternative
  - marker: b
    text: “发嘘声”也可理解为“吹口哨嘲弄”；希腊词可指用嘘声或口哨声表示讥笑、鄙弃。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λίθῳ
  choice: 一块……石头
  rationale: λίθος为单数与格，指一块石头；量词“一块”符合现代汉语习惯，也保留比喻的具体形象。
- source_word: ἠρδαλωμένῳ
  choice: 污秽的
  rationale: 这是罕见的分词形式，描述石头遭到弄脏或沾污；“污秽的”简洁传达明确的负面意味，同时以脚注保留词义上的不确定性。
- source_word: συνεβλήθη
  choice: 好比
  rationale: 此处动词表达比拟、相比，而非字面上的投掷或放在一起。“好比”自然、凝练，适合格言体。
- source_word: ὀκνηρός
  choice: 懒汉
  rationale: 该形容词在此作名词使用，为阳性单数，指懒惰的人。“懒汉”既保留男性形式，又符合现代汉语格言式表达。
- source_word: πᾶς
  choice: 人人
  rationale: 此处具有泛指整体的作用；“人人”简洁自然，表达所有人的共同反应。
- source_word: ἐκσυριεῖ
  choice: 会……发嘘声
  rationale: 该动词指发出带有嘲弄意味的口哨声或嘘声。“发嘘声”在现代汉语中明确表现公开鄙弃，同时脚注保留“吹口哨嘲弄”的可能译法。
- source_word: ἀτιμίᾳ
  choice: 耻辱
  rationale: ἀτιμία表示失去尊荣、蒙受羞耻或耻辱；“耻辱”适合这里遭众人公开鄙弃的语境。
theological_decisions:
- issue: 阳性单数名词化形容词ὀκνηρός的性别表达
  choice: 懒汉
  alternative: 懒惰的人
  rationale: 原文形式为阳性单数。虽然这句格言可作普遍应用，但正文用“懒汉”保留其语法性别，不把原文无声改成中性表达。
translation_notes:
  register: 采用简洁、庄重而易懂的现代汉语格言体。“好比”使比较关系自然明确；分号保留原文两分句结构。正文中的[a]、[b]分别紧随其所说明的词语。
