  yaml_path: translation/deuterocanon/sirach/022/004.yaml
  text: A prudent daughter will obtain a husband[a], but one who brings shame is a grief to the one who fathered her.
translation:
  language: zh_hans
  text: 明智的女儿必得到丈夫[a]；使人蒙羞的女儿，却给生她的父亲带来忧伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“必承受丈夫”；这里按上下文译作“必得到丈夫”。
    reason: 说明原文特殊搭配，并保留“继承、承受”与语境性译法之间的差异。
lexical_decisions:
- source_word: θυγάτηρ
  choice: 女儿
  rationale: 直接保留亲属称谓，不作泛化。
- source_word: φρονίμη
  choice: 明智的
  rationale: 表达实际生活中的智慧、审慎和良好判断；比单纯的“聪明”更贴近原义，也比“贤慧”少带传统性别角色色彩。
- source_word: κληρονομήσει
  choice: 必得到
  rationale: 该词通常意为“继承、承受”，但以“丈夫”为宾语时，直译在现代汉语中容易产生错误联想；正文按语境译为“得到”，并以脚注保留字面表达。
- source_word: ἄνδρα αὐτῆς
  choice: 丈夫
  rationale: 在此婚姻语境中，ἀνήρ自然指“丈夫”；汉语无需另译物主代词αὐτῆς也能表达她得到丈夫之意。
- source_word: ἡ καταισχύνουσα
  choice: 使人蒙羞的女儿
  rationale: 保留主动分词“造成羞耻、使人受辱”的动态含义；根据前句补出省略的“女儿”。
- source_word: εἰς λύπην
  choice: 带来忧伤
  rationale: 表达成为或导致忧伤的结果关系，符合现代汉语习惯。
- source_word: γεννήσαντος
  choice: 生她的父亲
  rationale: 原文是阳性单数分词，指生育她的男性；译文明确为父亲，既自然又不将性别中性化。
theological_decisions:
- issue: γεννήσαντος所指父母的性别
  choice: 生她的父亲
  alternative: 生她的人／她的父母
  rationale: 希腊文使用阳性单数分词，应保留男性所指；译成中性的“生她的人”或复数“父母”会淡化或改变原文。
- issue: κληρονομήσει ἄνδρα αὐτῆς的语义张力
  choice: 正文译“必得到丈夫”，脚注注明字面为“必承受丈夫”
  alternative: 必继承丈夫／必承受丈夫
  rationale: 原文动词确有“继承、承受”之义，但这一搭配的具体语用含义并不完全透明。正文采用婚姻语境中较自然的结果性表达，同时借脚注保存原文措辞，避免把解释伪装成唯一字面意义。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。两分句以分号和“却”呈现对照；避免使用带有较强传统性别规范色彩的“贤慧”，也避免生硬的“继承丈夫”。
