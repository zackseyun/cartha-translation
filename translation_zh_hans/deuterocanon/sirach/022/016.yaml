base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/016.yaml
  text: A wooden binding fastened into a building will not be loosened in an earthquake[c][b][a]; so a heart made firm by deliberate counsel will not lose courage in time of trouble.
translation:
  language: zh_hans
  text: 固定在建筑物中的木制系件，在地震中不会松脱[a]；同样，以审慎谋划为基础而坚定的心，在关键时刻不会胆怯[c][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地震”也可泛指剧烈的摇动；“不会松脱”也可译作“不会散开”或“不会解体”。
    reason: 保留 συσσεισμός 和 διαλυθήσεται 在建筑固定物比喻中的词义范围。
  - marker: b
    text: “审慎谋划”对应一个表达紧缩的短语，也可理解为“经过思量的定意”或“周详的筹划”。
    reason: 说明 διανοήματος βουλῆς 所含思量、意向与筹划的复合语义。
  - marker: c
    text: 原文直译为“在时机／时候中”；可指特定或关键的时刻，语境也可能暗示受考验之时。
    reason: 说明 ἐν καιρῷ 的字面意义与语境含义，避免在正文中无标记加入“患难”。
lexical_decisions:
- source_word: ἱμάντωσις ξυλίνη
  choice: 木制系件
  rationale: ἱμάντωσις 指用于捆系、连接或加固之物，ξυλίνη 表明材质为木；译作“木制系件”保留结构性比喻，同时避免过度断定其具体形制。
- source_word: ἐνδεδεμένη εἰς οἰκοδομήν
  choice: 绑紧在建筑物中
  rationale: 完成时分词表示已经牢牢系住，εἰς 在此指纳入建筑结构；“绑紧在……中”兼顾固定状态和建筑意象。
- source_word: ἐν συσσεισμῷ
  choice: 遭遇震动
  rationale: συσσεισμός 指强烈摇动，可指地震；译文保留较宽的“震动”，并在脚注说明具体可能。
- source_word: οὐ διαλυθήσεται
  choice: 不会散开
  rationale: διαλύω 在结构语境中有解体、松脱、散开之意；“不会散开”自然承接系紧的形象。
- source_word: καρδία
  choice: 内心
  rationale: καρδία 涵盖人的思想、意志和勇气；“内心”在现代汉语中自然，又不把含义缩减为纯粹理智。
- source_word: ἐστηριγμένη
  choice: 立稳
  rationale: 完成时分词表达已经得到稳固的状态；“立稳”呼应上半句建筑结构的牢固形象。
- source_word: ἐπὶ διανοήματος βουλῆς
  choice: 在深思熟虑的谋划上
  rationale: 这一压缩短语结合了思想、意向与商议、谋划的语义；此译保留其修辞张力，不把它单一化为劝告或决心。
- source_word: ἐν καιρῷ
  choice: 到了关键时刻
  rationale: καιρός 指适当、特定或关键的时机；上下文暗示受考验的时刻，但原文未明说“患难”，故正文采用较克制的表达。
- source_word: οὐ δειλιάσει
  choice: 不会胆怯
  rationale: δειλιάω 指变得怯懦、畏缩；“不会胆怯”直接而庄重，并保留道德与意志层面的色彩。
theological_decisions:
- issue: καρδία 的人论含义
  choice: 内心
  alternative: 心；心思
  rationale: 本节所说的不只是认知，也包括意志和勇气。“内心”保留完整的人格中心之义，避免把经文收窄为单纯思想活动。
- issue: ἐν καιρῷ 是否明确为患难之时
  choice: 到了关键时刻
  alternative: 在患难的时候；到时候
  rationale: 语境确有压力和考验的意味，但希腊文只明说“在时机／时候中”。采用“关键时刻”既传达语境，又不把隐含内容写成明示内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。上半句保留建筑加固的具体意象，下半句用“立稳”形成对应；对不常见的器件采用“木制系件”这一较中性的结构用语，并以脚注交代词义弹性。
