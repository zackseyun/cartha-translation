- from: 绑紧在建筑物中的木制系件，即使遭遇震动也不会散开[a]；照样，内心若立稳在深思熟虑的谋划上[b]，到了关键时刻也不会胆怯[c]。
  to: 固定在建筑物中的木制系件，在地震中不会松脱[a]；同样，以审慎谋划为基础而坚定的心，在关键时刻不会胆怯[c][b]。
  rationale: 修订将上半句的具体地震意象恢复到正文，删除非必要的让步加强语气，并以更自然的中文表达下半句“建立于审慎思量／谋划之上”的关系。脚注同步调整，准确说明词义弹性且维持各锚点对应。
