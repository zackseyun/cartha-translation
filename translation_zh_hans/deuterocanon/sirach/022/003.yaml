  text: A father’s shame is the birth of an undisciplined son[b][a], and a daughter is born for loss.
translation:
  language: zh_hans
  text: 不受管教的儿子出生，是父亲的羞耻[a]；女儿则成为亏损[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“父亲的羞耻在于一个不受管教的〔男性孩子〕的出生”；“儿子”由阳性形容词及上下句的对举关系补出。
    reason: 说明原文省略的中心名词，并避免把“出生”误解为父亲亲自执行的生育动作。
  - marker: b
    text: 或译“女儿生来是为减损”“女儿带来损失”。希腊文指减少、减损或损失，但没有说明具体是谁受损，也没有限定是哪一种损失。
    reason: 保留介词短语在目的、结果及损失对象方面的歧义，并说明“成为亏损”的压缩表达。
lexical_decisions:
- source_word: αἰσχύνη
  choice: 羞耻
  rationale: 直接表达名誉受损、蒙羞之意，也保留箴言尖锐简洁的语气。
- source_word: πατρὸς
  choice: 父亲的
  rationale: 按属格的自然汉语表达译出，并保留原文明确的男性亲属称谓。
- source_word: ἐν γεννήσει
  choice: 生了个
  rationale: 原短语指生育、产生后代；此处用自然汉语表达父亲生下这样的孩子这一事实，不将含义改成单纯的教育过程。
- source_word: ἀπαιδεύτου
  choice: 不受管教的儿子
  rationale: 该词指缺少教导、训练或管束的人；智慧文学语境侧重品行，故译作“不受管教的”。形容词为阳性，且与下句“女儿”对举，所以补出“儿子”。
- source_word: θυγάτηρ
  choice: 女儿
  rationale: 保留原文明确的女性后代称谓。
- source_word: ἐπʼ ἐλαττώσει
  choice: 带来亏损
  rationale: ἐλάττωσις表示减少、减损或损失；“亏损”保留其宽泛含义，不擅自限定为经济、名誉或父亲个人的损失。
- source_word: γίνεται
  choice: 出生
  rationale: γίνομαι本义宽泛，可指成为、出现或产生；在上下文谈论子女出生时译作“出生”最自然，同时不扩写其对象。
theological_decisions:
- issue: 智慧格言中带有性别的子女称谓
  choice: 保留“父亲”、隐含的“儿子”和明确的“女儿”
  alternative: 改用“父母”“孩子”等中性称谓
  rationale: 原文明确说“父亲”和“女儿”，首句阳性形容词又暗示男性孩子。性别差异属于原文格言的结构，不宜中性化。
- issue: 经文对女儿所作的负面社会评价
  choice: 直译为女儿的出生“带来亏损”
  alternative: 淡化为一般家庭困难，或具体解释为嫁妆、名誉损失
  rationale: 原文反映古代社会对女儿的负面估价。译文不粉饰这一张力，也不把含义限定为原文未明说的某一种经济或社会损失。
- issue: ἐπʼ ἐλαττώσει所表达的目的或结果
  choice: 用“带来亏损”表达结果倾向，同时以脚注保留语义压缩
  alternative: 译作“为亏损而生”以突出目的意味
  rationale: 介词短语可带目的或结果色彩，原句极为凝练。“带来亏损”较符合现代汉语，但脚注说明其字面结构和解释空间。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保持智慧格言的对举和尖锐语气。分号呈现两分句的并列转折关系；不以现代价值判断改写原文，也不把“亏损”具体化为嫁妆、经济负担或名誉损害。
