base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/012.yaml
  text: Mourning for the dead is seven days[a], but for a fool and an ungodly man, all the days of his life.
translation:
  language: zh_hans
  text: 为死者哀悼七天；为愚昧而不敬虔的人哀悼，却贯穿他一生的每一天。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πένθος
  choice: 哀悼
  rationale: 指因死亡而有的哀恸、举哀；“哀悼”既自然，也保留了丧礼与悲痛的语境。
- source_word: νεκροῦ
  choice: 死者
  rationale: 属格单数在此作泛指，表示哀悼的对象；“死者”简洁而庄重。
- source_word: ἑπτὰ ἡμέραι
  choice: 七天
  rationale: 按原文直译这一明确的时间表达。
- source_word: μωροῦ
  choice: 愚昧人
  rationale: 在智慧文学中，μωρός不只是智力不足，也包含道德和处世上的愚妄；“愚昧人”能保留这一含义。
- source_word: ἀσεβοῦς
  choice: 不敬虔的人
  rationale: ἀσεβής指对上帝缺乏敬畏、行事不虔；“不敬虔的人”清楚而不额外导入宗派术语。
- source_word: πᾶσαι αἱ ἡμέραι τῆς ζωῆς αὐτοῦ
  choice: 他一生的每一天
  rationale: 保留原文“所有日子”与“他的一生”的结构，并与前句“七天”形成鲜明对照。
theological_decisions:
- issue: 智慧格言中的阳性单数泛指
  choice: 正文保留单数代词“他”，并以脚注说明其泛指功能
  alternative: 改为完全不带性别的复数表达，如“他们的一生”
  rationale: 希腊文以阳性单数表达具有代表性的愚昧、不敬虔之人；中文用“人”自然泛指，同时保留“他”以反映原文单数形式，又借脚注避免误解为只适用于男性。
- issue: 后半句哀悼期限的指向
  choice: 保留“为……哀悼，却是他一生的每一天”的紧凑表述
  alternative: 解释为“这种人一生都令人悲叹”
  rationale: 原文省略了后半句的中心名词和系词，语义有格言式张力；正文不把它扩写成单一解释，以免消除原文的含蓄。
translation_notes:
  register: 采用现代、庄重而通俗的智慧文学语体。分号和“却”呈现两种哀悼期限的对比；后半句略带突兀的格言式结构有意保留原文的张力。
