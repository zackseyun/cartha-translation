- from: 为死者哀悼七天；但为愚昧人和不敬虔的人[a]哀悼，却是他一生的每一天。
  to: 为死者哀悼七天；为愚昧而不敬虔的人哀悼，却贯穿他一生的每一天。
  rationale: 修订仅处理汉语句法和指称连贯性：“贯穿他一生的每一天”明确后半句所省略的“哀悼”持续时间；“愚昧而不敬虔的人”将原文并列的两个单数描述自然地用于同一代表性人物。保留“他”及脚注，以反映原文阳性单数的泛指用法。
