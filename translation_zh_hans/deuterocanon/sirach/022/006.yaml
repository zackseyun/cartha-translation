  yaml_path: translation/deuterocanon/sirach/022/006.yaml
  text: Music during mourning is an untimely discourse[b][a], but beatings and discipline are wisdom at all times.
translation:
  language: zh_hans
  text: 哀悼时奏乐，是不合时宜的言谈[a]；鞭打和管教，则无论何时都属于智慧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “言谈”也可译作“讲论”或“叙述”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文在这里采用压缩表达，直译近于“鞭打和管教……智慧的”；也可理解为“都是智慧”或“都是合乎智慧的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μουσικὰ
  choice: 奏乐
  rationale: 该中性复数泛指音乐或音乐活动；结合“哀悼时”的场景，译作“奏乐”自然明确，又不局限为歌唱。
- source_word: ἐν πένθει
  choice: 哀悼时
  rationale: 表达处于哀悼、悲丧的情境，并保留其时间和场合意味。
- source_word: ἄκαιρος
  choice: 不合时宜
  rationale: 原词指不在适当的时候；这一译法既保留时机不当的含义，也与后半句“无论何时”形成呼应。
- source_word: διήγησις
  choice: 言谈
  rationale: 该词可指叙述、讲论或言谈；此处采用范围较宽、现代汉语较自然的“言谈”，不把它限定为正式演说或故事叙述。
- source_word: μάστιγες
  choice: 鞭打
  rationale: 复数名词指鞭击或鞭打造成的击打；直译其身体惩戒意味，不弱化为抽象的“责备”。
- source_word: παιδεία
  choice: 管教
  rationale: 智慧文学中的该词兼有教导、训练和纠正之意；“管教”能体现这里与鞭打并列的纠正性训练。
- source_word: ἐν παντὶ καιρῷ
  choice: 无论何时
  rationale: 自然表达在任何时候或各种时机都适用，并保留与ἄκαιρος的时间对照。
- source_word: σοφίας
  choice: 属于智慧
  rationale: 希腊文使用属格，句法高度压缩，可能表示“是智慧”“属于智慧”或“合乎智慧”；正文采用“属于智慧”，既可读又尽量保留属格关系。
theological_decisions:
- issue: 格言对身体惩戒的肯定力度
  choice: 如实译出“鞭打”，并保留“无论何时”的普遍性表达
  alternative: 将μάστιγες弱化为“责备”，或将后半句限制为仅在某些适当场合
  rationale: 希腊文明确使用身体击打的词，并将其与管教并列；翻译不应因现代伦理顾虑而改写原文，同时也不额外扩展其适用对象或实施方式。
- issue: σοφίας的压缩属格结构
  choice: 译作“属于智慧”，并以脚注说明其他可能理解
  alternative: 译作“都是智慧”或“都是智慧之举”
  rationale: 原文没有明说系词或被省略的中心词；采用属格式表达并列出替代译法，可避免把原文的句法歧义过早定死。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前后分句保持简洁对称，以“不合时宜”和“无论何时”呈现原文的时间对照；不淡化身体惩戒用语，也不在正文中消除末尾属格结构的歧义。
