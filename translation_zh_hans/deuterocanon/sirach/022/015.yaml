  yaml_path: translation/deuterocanon/sirach/022/015.yaml
  text: It is easier to carry sand and salt and a lump of iron than a senseless man[a].
translation:
  language: zh_hans
  text: 背负沙子、盐和铁块，比背负一个不明事理的人还容易。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不明事理的人”或译“愚昧人”或“没有悟性的人”。
    reason: 保留ἀσύνετον在缺乏理解、悟性与智慧文学所说的愚昧之间的词义幅度。
lexical_decisions:
- source_word: ἄμμον
  choice: 沙子
  rationale: 直译具体名词；希腊文虽为单数，在这里表示物质，现代汉语自然用“沙子”。
- source_word: ἅλα
  choice: 盐
  rationale: 希腊文为复数形式但作集合义，汉语物质名词“盐”最自然。
- source_word: βῶλον σιδήρου
  choice: 铁块
  rationale: βῶλος可指土块、团块或一大块物体；“铁块”简洁保留沉重实体的形象。
- source_word: εὔκοπον
  choice: 容易
  rationale: 本义为容易、轻省；与ἤ构成比较，在汉语中用“比……容易”明确表达。
- source_word: ὑπενεγκεῖν
  choice: 背负
  rationale: 该词可指承载、忍受；“背负”既保留搬运实物的画面，也容纳把难相处之人视为重担的引申意味。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 此处指一个人；现代汉语“人”不必标明语法性别，也未削弱希腊文的单数对比。
- source_word: ἀσύνετον
  choice: 不明事理的
  rationale: 该词强调缺乏理解、悟性或判断；“不明事理”自然通俗，并避免现代“智商低”之类偏义。
theological_decisions:
- issue: ἀσύνετον的智慧文学含义
  choice: 不明事理的人
  alternative: 愚昧人；没有悟性的人
  rationale: 原词所指既可偏向缺乏理解，也可带有智慧文学中的愚昧评价。“不明事理”保留认知与处世两方面的张力，不把它径直强化为道德邪恶。
- issue: ἄνθρωπον的性别表达
  choice: 人
  alternative: 男人
  rationale: ἄνθρωπος通常泛指人，虽在本句为阳性宾格单数，却没有明确男性语义；汉语译作“人”最准确自然。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“尚且”突出三种沉重物料与人的比较；“背负”维持全句的具体负重意象及其引申张力。
