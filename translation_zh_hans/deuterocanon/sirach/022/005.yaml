  yaml_path: translation/deuterocanon/sirach/022/005.yaml
  text: A shameless woman brings shame on father and husband[a], and she will be dishonored by both.
translation:
  language: zh_hans
  text: 厚颜无耻的女人使父亲和丈夫蒙羞[a]，她必受二人羞辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厚颜无耻的女人”也可译作“放肆的女人”或“无礼的女人”。希腊词指一个行事大胆、放肆且不知羞耻的女人。
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: 父亲
  rationale: 作καταισχύνει的宾语。希腊文未用物主词，中文也可省略“她的”，亲属关系在语境中自然明白。
- source_word: ἄνδρα
  choice: 丈夫
  rationale: 与“父亲”并列，处于家庭荣辱语境中，最自然指丈夫，而非泛指男人。
- source_word: καταισχύνει
  choice: 使……蒙羞
  rationale: 表达使人遭受羞耻、丢失颜面的使动含义，也符合现代汉语表达。
- source_word: ἡ θρασεῖα
  choice: 厚颜无耻的女人
  rationale: 阴性形容词名词化，指以放肆、无耻为特征的女人；本节是负面评价，并非褒义的勇敢。
- source_word: ὑπὸ ἀμφοτέρων
  choice: 受二人
  rationale: “二人”回指前述父亲与丈夫，并与被动动词自然衔接。
- source_word: ἀτιμασθήσεται
  choice: 必受……羞辱
  rationale: 保留将来被动意义，并与前句“蒙羞”形成荣辱语义上的呼应；这里既可指被羞辱，也可含被轻视、不受尊重之意。
theological_decisions: []
