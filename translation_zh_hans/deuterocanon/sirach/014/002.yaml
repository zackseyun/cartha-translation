  text: Blessed is the man whom his soul has not reproached[a], and whose hope has not ceased.
translation:
  language: zh_hans
  text: 内心没有责备自己的人有福了[a]；他的希望也没有断绝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来抄本的前半句较难确定；希腊文本作“他的心没有谴责他”。这里译作“内心没有责备自己”，也可能含有“定罪”或“使蒙羞”的意味。
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי אִישׁ
  choice: 这人有福了
  rationale: 保留智慧文学中祝福语的庄重语气；“人”既对应阳性单数形式，也可在格言中具有代表性。
- source_word: לֹא חִסַּדְתּוֹ נַפְשׁוֹ
  choice: 自己的心没有责备自己的
  rationale: 现存希伯来文本措辞困难；结合希腊平行文本 κατέγνω，译为“责备”以保留“谴责、责难”的语义范围。“心”在现代汉语中比直译“灵魂”更自然地表达人的内在自我判断，同时不直接窄化为“良心”。
- source_word: וְלֹא שָׁבְתָה תּוֹחַלְתּוֹ
  choice: 他的希望也没有破灭
  rationale: שבת 表示停止、不再持续；汉语“希望没有破灭”自然表达希望没有终止或落空，并与希腊文 ἐλπίς 相符。
theological_decisions:
- issue: 现存希伯来文本首句困难，是否依据希腊平行文本明确其意义
  choice: 译作“自己的心没有责备自己的”
  alternative: 自己的心没有定自己的罪；自己的心没有使自己蒙羞
  rationale: 以希伯来文本为首要依据，同时用希腊文“没有谴责”稳定难解动词的基本方向；选择较宽的“责备”，避免把它限定为司法定罪或羞耻感。
- issue: נפש 的汉语表达
  choice: 心
  alternative: 灵魂；内心；良心
  rationale: 此处指人的内在自我对本人的判断。“心”在现代汉语中自然且范围较宽；“良心”会增加原文未明说的伦理心理术语，“灵魂”则在本句中较生硬。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。以对称的两个分句呈现原文格言结构；脚注标记置于相关难解内容之后。
