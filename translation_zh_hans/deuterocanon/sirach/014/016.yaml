base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/016.yaml
  text: Give to a brother[a], and be gracious, and indulge yourself, for in Sheol there is no seeking pleasure. And whatever is good to do[b], do it before God.
translation:
  language: zh_hans
  text: 要给弟兄，也要施恩；也要厚待自己[a]，因为在阴间[b]无法寻求享乐。凡是适宜做的事，都要在上帝面前去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“要给，也要取，并要欺哄自己的灵魂。”这句话较难理解；现存希伯来文较清楚，意为“厚待自己”。
    reason: alternative_reading
  - marker: b
    text: “阴间”指死者所在之境；也可译作“坟墓”或“地下世界”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לְאָח
  choice: 要给弟兄
  rationale: 直译希伯来文“给弟兄”。“弟兄”保留原文具体的亲属或群体称谓；在本语境中也可泛指共同体中的同伴，不扩译为“别人”。
- source_word: וְחֹנֵן
  choice: 也要施恩
  rationale: חנן 表示施予恩惠、恩待他人。“施恩”保留其伦理和关系意味，不把它限缩为金钱上的慷慨。
- source_word: וּפַנֵּק נַפְשֶׁךָ
  choice: 也要厚待自己
  rationale: פנק 有娇养、优待、让其享受之意；“厚待自己”在现代汉语中自然庄重，既比“善待自己”更有享受意味，又避免“放纵自己”所带的明确贬义。
- source_word: כִּי אֵין בִּשְׁאוֹל
  choice: 因为在阴间无法
  rationale: שְׁאוֹל 指死者所在之境。“阴间”保留古代观念，不误译为刑罚性的“地狱”，也不缩减为坟墓本身。
- source_word: לְבַקֵּשׁ תַּעֲנוּג
  choice: 寻求享乐
  rationale: בקש 是寻求，תענוג 是愉悦、享受。“寻求享乐”同时保留动作和对象，也与希腊文 ζητῆσαι τρυφήν 相符。
- source_word: וְכָל דָּבָר שֶׁיָּפֶה לַעֲשׂוֹת
  choice: 凡是美好而合宜去做的事
  rationale: יפה 在这里可指美好，也可指合宜、适当。并列“美好而合宜”在汉语中保存这层语义幅度，避免只理解为外表美丽。
- source_word: לִפְנֵי אֱלֹהִים עֲשֶׂה
  choice: 都要在上帝面前去做
  rationale: 保留“在上帝面前”的空间性表达，使其既可表达在上帝临在中，也可表达在上帝鉴察之下，不进一步限定。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；地下世界
  rationale: “阴间”最能在现代汉语中表达死者之境，同时避免把该词等同于后期神学中的刑罚之地。“坟墓”过于物质化，“地下世界”则偏解释性。
- issue: 自我享受的命令应如何理解
  choice: 厚待自己
  alternative: 欺哄自己的灵魂；让自己享受；娇养自己
  rationale: 现存希伯来文清楚使用 פנק，故正文以希伯来文为主。希腊文“欺哄你的灵魂”措辞困难，但其下文的“享乐”显示这一句与享受有关；脚注保存该异文，不在正文中强行协调。
- issue: “在上帝面前”的含义
  choice: 保留原有表达
  alternative: 在上帝眼中；在上帝的临在中
  rationale: 原文可以兼含上帝的鉴察与临在。直保留“在上帝面前”可避免把神学重点单一化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“厚待自己”避免过度口语化，也不赋予原文负面的道德判断；分号呈现连续命令之间的层次。脚注标记均置于正文相应词句之后。
