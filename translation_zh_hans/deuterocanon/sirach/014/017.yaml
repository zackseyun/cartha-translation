base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/017.yaml
  text: All flesh wears out like a garment[a], and the everlasting decree is, “Dying, they shall die.”
translation:
  language: zh_hans
  text: 一切血肉之躯，都像衣服一样会破旧；亘古的定例乃是：临终者，终必断气。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句措辞简短，且单数分词与复数动词之间似有数的不一致，近似“临终的，他们终必断气”。这是一种强调众生皆必死亡的困难表达。希腊文平行文本将其表述为自古以来关于死亡的定例。
    reason: 说明原文末句的语法难点及希腊文平行文本所反映的解释。
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: 凡有血肉的
  rationale: בָּשָׂר在这里是集合用法，指一切有血肉、必朽坏的生命；此译保留希伯来文的具体意象，又比直译“一切肉体”更符合现代汉语。
- source_word: כַּבֶּגֶד יִבְלֶה
  choice: 都像衣服一样渐渐破旧
  rationale: בגד是普通的“衣服”，בלה表示因年久或使用而破旧、衰残；“渐渐破旧”自然呈现这一比喻及其过程感。
- source_word: וְחֹק עוֹלָם
  choice: 永世的定例
  rationale: חֹק指固定的法则、定例；עוֹלָם可表达长久、亘古或永远。“永世的定例”保留其恒久且不可更改的意味，不把它具体化为某一成文律法。
- source_word: גֹּוֵעַ יִגְוָעוּ
  choice: 凡临终的，终必断气
  rationale: גוע常指断气、气绝。原文以分词和复数动词构成简短而不寻常的表达；此译保留重复强调和普遍死亡的意思，同时维持可读性。
theological_decisions:
- issue: 末句希伯来文数的一致并不规则，且表达极其简短；希腊文则将其解释为自古以来关于死亡的定命。
  choice: 永世的定例是：凡临终的，终必断气。
  alternative: 亘古的定例是：“你必定死。”
  rationale: 主译优先依据现存希伯来文，保留第三人称和גוע的“断气”意象，不借希腊文改成第二人称。希腊平行文本支持这是普遍而古老的死亡定例，但不足以消除希伯来文本身的措辞张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“凡有血肉的”保留圣经式具体意象但避免生硬；“渐渐破旧”承接衣服的比喻；末句有意保留原文近似重复的强调，不将其改写成抽象的“人人都有一死”。
