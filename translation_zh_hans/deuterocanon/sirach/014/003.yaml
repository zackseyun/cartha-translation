  text: Wealth is not fitting for a small-hearted man, and riches are not fitting for a man with an evil eye.
translation:
  language: zh_hans
  text: 财富不适合心胸狭小的人[a]；黄金也不适合吝啬的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心胸狭小”原文直译为“心小”，可指心胸狭窄、过分计较或吝啬。希腊语平行文本的相应词也有鄙小、计较之意。
    reason: 说明希伯来语形象及平行希腊语所支持的语义范围，避免把该词义说得过于确定。
  - marker: b
    text: “吝啬的人”原文直译为“有恶眼的人”。这是一个惯用说法，通常指吝啬、刻薄或不肯慷慨，也可带有嫉妒、贪婪的含义；“黄金”一词也可泛指贵重财物。
    reason: 以自然汉语表达习语的主要含义，同时保留其字面意象和较宽的语义范围，并交代 חָרוּץ 的含义。
lexical_decisions:
- source_word: לֵב קָטֹן
  choice: 心胸狭小的人
  rationale: 字面为“小心／小的心”，结合希腊语 μικρολόγῳ，语境指气量狭小、吝啬的人；译文保留“心”的形象，同时避免现代汉语中“小心”的歧义。
- source_word: לֹא נָאוֶה
  choice: 并不相称
  rationale: נָאוֶה 表示合宜、相配或美好；“不相称”既传达财富与这种品格不相配，也避免用“不配拥有”过度引入资格或报应含义。
- source_word: רַע עַיִן
  choice: 眼红心吝的人
  rationale: 字面为“恶眼的人”，是指嫉妒、贪婪或吝啬的惯用表达。“眼红心吝”保留眼目的意象，并以自然汉语提示其品格含义。
- source_word: חָרוּץ
  choice: 黄金
  rationale: 此处 חָרוּץ 是诗歌性的贵金属用语，通常指金或精金；与前半句“财富”形成由总称到具体贵重财物的平行。
theological_decisions:
- issue: 财富本身与人的品格之间的关系
  choice: 译作“与……并不相称”
  alternative: 译作“……不配拥有财富／黄金”
  rationale: 原文评论的是财富与狭隘、吝啬品格的不合宜，并未明确宣告这类人没有拥有财物的资格；采用较贴近 נָאוֶה 的表达，保留智慧文学的张力。
translation_notes:
  register: 采用简洁、对称的智慧文学句式。“财富／黄金”对应原文的 עֹשֶׁר／חָרוּץ；“心胸狭小／眼红心吝”兼顾希伯来语意象与现代普通读者的可理解性。
