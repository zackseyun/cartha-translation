  text: Will you not leave your wealth to another[a], and your labor to those who cast the lot?
translation:
  language: zh_hans
  text: 你岂不把你的财富留给别人，把你劳碌所得留给那些按阄分得一份的人[a]吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那些按阄分得一份的人”：希伯来语字面近于“知晓‘阄’的人”，是一种含义不甚明确的习语。也可较意译为“按所分份额承受的人”或“分受产业的人”；希腊语平行文本指向阄份或产业的分配。
    reason: 说明希伯来语习语及希腊语平行文本所支持的可能含义，同时保留“阄”是指抽签、所分份额还是产业分配的歧义。
lexical_decisions:
- source_word: הֲלֹא
  choice: 岂不是……吗
  rationale: 这是预期肯定回答的反问；用现代汉语反问句保留劝诫和提醒的语气。
- source_word: לְאַחֵר
  choice: 给别人
  rationale: 直接表达财物最终归于另一个人，不额外限定其法律身份。
- source_word: תַּעֲזוֹב
  choice: 留给
  rationale: 表示身后留下或留置；既符合上下文，又不把含义收窄为正式立遗嘱。
- source_word: חֵילֶךָ
  choice: 财富
  rationale: חיל在智慧文学的这一语境中指财力、资财或产业；“财富”自然简明。
- source_word: וִיגִיעֲךָ
  choice: 劳碌所得
  rationale: יגע既可着重劳苦，也可涉及劳苦所得；译为“劳碌所得”与财富及后来分受的语境衔接，同时保留其由辛劳而来的意味。
- source_word: לְיוֹדֵי גוֹרָל
  choice: 给按阄分受的人
  rationale: 希伯来语字面近于“熟知阄份的人”，表达较为特殊；希腊语平行文本指向阄份的分配。“按阄分受”保留“阄”的意象，也自然传达分配所得的意思，避免直接断定这些人必是法律意义上的继承人。
theological_decisions:
- issue: 接受财物者是否应明确译作“继承人”
  choice: 不明确称为“继承人”，译作“按阄分受的人”
  alternative: 继承产业的人／按份继承的人
  rationale: 上下文很可能涉及遗产分配，但希伯来语本身使用“阄份”这一含有歧义的表达；保留其形象可避免把隐含关系改写成明确的法律身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“岂不是……吗”保留原文反问力度；“劳碌所得”比单说“劳碌”更符合可被留下和分受的对象，但仍显出个人辛劳。脚注处理不易在正文中完全展开的“阄份”习语。
