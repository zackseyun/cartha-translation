  text: Do not deprive yourself of a good day, and do not let your share in a good desire pass you by.
translation:
  language: zh_hans
  text: 不要让自己错失美好的一天[a]；也不要让美好愿望中属于你的那一份与你擦肩而过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语见证另有一处置于方括号内的分句：“也不要使自己得不到好处。”所示文本的措辞或归属并不确定，也可能是后加的；希腊语平行文本在这里则作：“也不要让美好愿望中属于你的那一份与你擦肩而过。”
    reason: 文本异文
lexical_decisions:
- source_word: אַל תִּמְנַע / μὴ ἀφυστερήσῃς
  choice: 不要让自己错失
  rationale: 希伯来语表示“扣留、不让得到”，希腊语也有“使人得不到”的意思。译文明确受益者是自己，并用现代汉语自然表达不可自我剥夺之意。
- source_word: מִטּוֹבַת יוֹם / ἀπὸ ἀγαθῆς ἡμέρας
  choice: 美好的一天
  rationale: 希伯来语直指“一天的美好”，希腊语则为“美好的一天”；此译简洁自然，又不把含义限缩为享乐或物质福分。
- source_word: '[וְאַל תִּמְנַע מִטּוֹבָה נַפְשֶׁךָ]'
  choice: 不收入正文
  rationale: 该分句在所给希伯来文本中置于方括号内，措辞或文本归属存在疑问，且给出的希腊对应文本没有重复这一分句，因此改在脚注中保留。
- source_word: μερὶς
  choice: 属于你的那一份
  rationale: 保留希腊语“份额、所得之分”的概念；补出“属于你的”符合代词语境，也使汉语通顺。
- source_word: ἐπιθυμίας ἀγαθῆς
  choice: 美好愿望中
  rationale: 直译其正面而含义宽泛的“美好的愿望／渴望”，不擅自具体化为享乐、财富或食欲。
- source_word: μὴ σε παρελθάτω
  choice: 不要让……与你擦肩而过
  rationale: 以现代汉语惯用语表达某物从身旁经过而未能把握或享有的意思，保持劝诫语气。
theological_decisions:
- issue: 希伯来见证与希腊平行文本在后半句上的文本差异
  choice: 正文采用可靠的希伯来语首句，并以希腊语保存的后半句接续
  alternative: 把方括号内的希伯来分句收入正文；或全节只依希腊语翻译
  rationale: 《便西拉智训》有希伯来语存文时应优先参考，但本处该希伯来分句已明确标为存疑；希腊文本提供了连贯的第二分句。如此既不夸大希伯来文本的确定性，也完整呈现古代见证所保存的劝诫。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“错失”与“擦肩而过”自然连贯，同时避免把“美好”解释成某一种特定享乐。正文脚注标记与脚注条目一致。
