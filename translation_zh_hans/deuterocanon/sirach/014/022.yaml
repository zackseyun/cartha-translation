  text: Go out after her in search[a], and lurk at all her entrances.
translation:
  language: zh_hans
  text: 要出去追寻她，细心查访；在她所有的入口处守候。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守候”也可译作“埋伏等候”；希腊文本明确使用了伏候、埋伏的意象。
    reason: 保留罕见希伯来动词及希腊平行文本所支持的较强词义。
lexical_decisions:
- source_word: לָצֵאת אַחֲרֶיהָ בְחֵקֶר
  choice: 要仔细探寻，跟在她身后
  rationale: לצאת在劝勉语境中带有行动号召的意味；אחריה保留追随拟人化智慧的图景；בחקר表示查考、搜寻。译文用两个紧密相连的短语，使现代汉语自然，同时保留主动追寻的力度。
- source_word: מְבוֹאֶיהָ
  choice: 她所有的入口
  rationale: מבוא指入口、进入之处；希腊文εἴσοδοι也支持具体的空间意象，不宜抽象化为“道路”或“途径”。
- source_word: יְרַצֵּד
  choice: 守候
  rationale: 该动词罕见，语义略有不确定；希腊平行文本ἐνέδρευε显示“埋伏等候”的意象。“守候”既表达持续而专注的等候，也避免在正文中赋予追求智慧不必要的阴险色彩；更强烈的译法列入脚注。
theological_decisions:
- issue: 智慧的阴性拟人化
  choice: 保留“她”
  alternative: 重复使用“智慧”，或改用不体现性别的说法
  rationale: 希伯来文的代词后缀为阴性单数，承接上下文中被拟人化的智慧。保留“她”可维持原文的文学与神学张力，而不进一步把这一形象等同于某个特定教义对象。
- issue: 末句等候意象的力度
  choice: 正文译作“守候”
  alternative: 译作“埋伏等候”或“潜伏窥伺”
  rationale: 希腊平行文本明确带有伏候意象，希伯来文罕见动词也容许较强译法；但“守候”更符合现代汉语中追求智慧的正面语境，同时借脚注保留更尖锐的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“仔细探寻—跟在她身后—在入口守候”保留连续追寻智慧的具体图景；分号使两个动作层次清楚。
