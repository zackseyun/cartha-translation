  text: If he is evil to himself[a], to whom will he do good? He will not enjoy his own good things.
translation:
  language: zh_hans
  text: 连自己都亏待的人，能善待谁呢？他享受不到自己所有的福分。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “享受不到自己所有的福分”直译是“看不见自己的好处”。这里的“看见”可能指亲身经历或享用；希腊文平行文本作“不能因自己的财物而欢喜”。
    reason: 说明希伯来语惯用表达，并保留希伯来文较宽泛的“福分”与希腊文较具体的“财物”之间的差异。
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: 连自己都亏待的人
  rationale: רַע与לְנַפְשׁוֹ合起来指一个人恶待或苛待自己。译作“亏待自己”既保留负面的伦理意味，也比直译“对自己的灵魂是恶的”更符合现代汉语；“连……都”显明其与下句反问之间的推论关系。
- source_word: לְמִי יֵיטִיב
  choice: 能善待谁呢
  rationale: יטב的使役形可表示“行善、使人得益、善待”。这里与“亏待自己”形成对照；反问语气按希伯来文保留。
- source_word: וְלֹא יִרְאֶה
  choice: 享受不到
  rationale: 字面为“看不见”，在此是亲身经历、享用的惯用含义；希腊文平行文本以“欢喜享用”支持这一理解。
- source_word: בְּטוֹבָתוֹ
  choice: 自己所有的福分
  rationale: טובה可指好处、福乐、财物或境遇，范围比“财富”更广。“福分”保留这种宽度，“自己所有的”则表达第三人称所有后缀。
