  text: All his works rot away[a], and the work of his hands is dragged along behind him.
translation:
  language: zh_hans
  text: 他所做的一切都必腐朽[a]；他双手所做的，也必被拖在他身后。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“一切会腐朽的工作终必消逝，做这工作的人也要与它一同离去。”希伯来文则说，他双手所做的被拖在他身后。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל מַעֲשָׂיו
  choice: 他所做的一切
  rationale: 涵盖此人全部的行为与成果；现代汉语自然，也保留原文的广泛所指。
- source_word: רָקוֹב יִרְקָבוּ
  choice: 都必腐朽
  rationale: 希伯来语以同根词加强“腐朽”之意；用“必”表达强调，避免在汉语中生硬重复。
- source_word: וּפֹעַל יָדָיו
  choice: 他双手所做的
  rationale: 既表达行动的成果，也保留“手”的具体意象。
- source_word: יִמָּשֵׁךְ אַחֲרָיו
  choice: 必被拖在他身后
  rationale: 保留动词的被动意味及 אַחֲרָיו 的“在他身后”意象，不将其弱化为单纯的“跟随”。
theological_decisions:
- issue: 第二分句的希伯来文与希腊文存在差异
  choice: 正文依现存希伯来文：他双手所做的，也必被拖在他身后。
  alternative: 希腊文：做这事的人也要与它一同离去。
  rationale: 现存希伯来文证据置信度高，故正文以其为主；希腊文改变了主语，却同样表达人与其作为终必消逝的主题，因此在脚注中保留这一重要异文。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“腐朽”承载原文腐坏、消逝的意象；分号呈现两个对应分句。
