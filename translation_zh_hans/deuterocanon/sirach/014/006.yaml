translation:
  language: zh_hans
  text: 恶待自己的人[a]，没有谁比他更恶；他的恶的报应也与他同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语作“连自己也不肯善待的人”，或“对自己吝啬的人”，明确指出因吝啬而亏待自己的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: 恶待自己的人
  rationale: 希伯来语是无系词短语，直译为“对自己／自己的性命是恶的”。“恶待自己”保留其宽泛的道德措辞，也符合上下文所指向的自损行为；希腊语平行文本所凸显的吝于善待自己的含义则收入脚注。
- source_word: אֵין רַע מִמֶּנּוּ
  choice: 没有谁比他更恶
  rationale: 按希伯来语比较结构直译，并以“恶”复现רע词根，保留原文的强调和反复。
- source_word: תּשְלוּמַת
  choice: 报应
  rationale: 该词表示偿还、回报或报偿；此处处于道德后果的语境，“报应”在现代汉语中自然、庄重。
- source_word: רָעָתוֹ
  choice: 他恶行的
  rationale: 用“恶行”表达其恶或恶事，同时与前文的“恶”形成词义呼应。
- source_word: וְעִמּוֹ
  choice: 也与他同在
  rationale: 贴近希伯来语“并且与他同在”，不将其具体化为时间上的将来惩罚，从而保留原文简练而略含张力的表达。
- source_word: τοῦ βασκαίνοντος ἑαυτόν
  choice: 恶待自己的人
  rationale: 希腊语可指连自己也不肯善待、对自己吝啬的人；因希伯来语是主要依据且含义更宽，正文采用较宽泛的译法，并在脚注交代希腊语的具体语感。
