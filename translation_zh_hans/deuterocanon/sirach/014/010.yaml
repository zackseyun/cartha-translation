  source_fidelity: 第一分句的“恶眼”应保留为惯用语，并说明其在此指吝啬、嫉妒的性情；草稿的“眼目恶毒的人”容易被理解为眼神凶恶或人格恶毒。第二分句的希伯来语“מְהוּמָה”通常关联混乱、骚动，与希腊文平行本所支持的“吝啬／刻薄、桌上供应寒薄”并不完全一致。正文可依上下文和希腊文取后者，但脚注须明确保留这一差异，不能将希伯来语通常义说成“匮乏、寒碜”。
