translation:
  language: zh_hans
  text: 恶眼的人[a]连饼也吝惜；他的桌上也显出吝啬[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶眼”是希伯来语惯用说法；在这里指嫉妒、吝啬、不肯分享的性情。希腊语平行文本也支持这一理解。
    reason: lexical_alternative
  - marker: b
    text: 此处希伯来语用词较难处理；“混乱、骚动”是其通常含义。希腊语平行文本则支持“吝啬、刻薄”或桌上供应寒薄的理解；正文按后者及上下文翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: עַיִן רַע / ὀφθαλμὸς πονηρός
  choice: 眼目恶毒的人
  rationale: 保留希伯来语“恶眼”的具体意象，同时用“的人”使中文句法自然；此惯用语在上下文中指心怀嫉妒、吝啬而不肯分享的人。
- source_word: תָּעִיט / φθονερὸς
  choice: 舍不得
  rationale: 希伯来语词形和确切含义较难确定；希腊语平行文本表明这里是嫉妒、吝惜之意。“舍不得”自然表达对食物不肯分享的态度。
- source_word: לָחֶם / ἄρτος
  choice: 饼
  rationale: 希伯来语和希腊语均直指饼；保留具体食物意象，不泛化为“食物”。
- source_word: מְהוּמָה / ἐνλεπής
  choice: 尽显寒酸
  rationale: 希伯来语读法在此较难，其通常语义可涉及混乱或不安；希腊语平行文本则支持匮乏、寒碜的意思。正文依语境采用“寒酸”，并以脚注保留文本上的不确定性。
- source_word: שֻלְחָנוֹ / τραπέζης αὐτοῦ
  choice: 他的席上
  rationale: 忠实保留原文以筵席之处表现供给和待客状况的意象；“席上”比“餐桌上”更凝练庄重。
