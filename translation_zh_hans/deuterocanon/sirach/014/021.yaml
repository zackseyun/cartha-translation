  text: He who sets his heart on her ways and considers her insights[a].
translation:
  language: zh_hans
  text: '将心放在她的道路上，并思索她的洞见的人[a]。


    [a] 希腊文平行文本作：“并会明白她隐秘的事”，或“她的奥秘”。希伯来文作“她的洞见（或理解）”，正文据此翻译。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“并会明白她隐秘的事”，或“她的奥秘”。希伯来文作“她的洞见（或理解）”，正文据此翻译。
    reason: 记录希腊文平行文本与高可信度希伯来正文之间的异文差别。
lexical_decisions:
- source_word: הַשָּׂם
  choice: ……的人
  rationale: 带定冠词的分词在此作名词性用法，指“那把……放置的人”。中文以后置“……的人”自然表达这一结构。
- source_word: עַל דְרָכֶיהַ לִבּוֹ
  choice: 把心放在她的道路上
  rationale: 贴近希伯来文“把他的心放在她的道路上”；保留“心”，以涵盖思想、意向与专注，不窄化为单纯的“头脑”。
- source_word: וּבִתְבוּנֹתֶיהַ
  choice: 她的洞见
  rationale: תבונותיה 指她的理解、洞见或明达之处。正文以高可信度希伯来文本为准；希腊文“隐秘的事／奥秘”另收入脚注。
- source_word: יִתְבּוֹנָן
  choice: 思索
  rationale: 该词表达专注考察、反复思想并求得理解；“思索”简洁自然，也保留沉思意味。
theological_decisions:
- issue: 智慧的阴性人格化
  choice: 她
  alternative: 它
  rationale: 希伯来文与希腊文都以阴性形式人格化智慧；译作“她”保留其文学与神学张力，不将其淡化为非人格的抽象概念。
- issue: 阳性单数的参与者
  choice: ……的人
  alternative: 他把心放在……
  rationale: 希伯来文使用阳性单数名词性分词。现代汉语以“……的人”可自然保留单数代表性表达，同时避免凭空补出主句谓语。
translation_notes:
  register: 采用现代、庄重而通俗的书面语。正文保留原文名词性片语的结构，并以“她”呈现智慧的阴性人格化。
