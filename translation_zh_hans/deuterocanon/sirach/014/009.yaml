base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/009.yaml
  text: In the eye of the greedy[a], his portion is too little, and by taking his neighbor’s share he destroys his own portion.
translation:
  language: zh_hans
  text: 在贪心的人[a]眼中，自己的份太少；他拿取邻舍的份，反倒毁掉自己的份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“在……眼中，他的份很少”。这里译作“贪心的人”的希伯来词在现存抄本传统中较难确定；希腊语平行文本作“贪婪者的眼睛不因所得的份而满足”，支持本译法。
    reason: 说明疑难原文及希腊语平行文本所支持的读法。
lexical_decisions:
- source_word: בְּעֵין
  choice: 在……眼中
  rationale: 保留希伯来语以“眼”表达主观看法的生动习语，在现代汉语中也自然易懂。
- source_word: כּוֹשֵׁל
  choice: 贪心的人
  rationale: 此词在现存希伯来文本传统中疑难；若按通常词形可联想到“踉跄、失败”，但与上下文不易衔接。希腊语平行文本作 πλεονέκτου，意为贪婪、贪得无厌的人，支持此处译为“贪心的人”。
- source_word: מְעַט
  choice: 太少
  rationale: 这里不只是客观地说份额少，而是说在贪心者看来总嫌不足；“太少”准确传达这种评价意味。
- source_word: חֶלְקוֹ
  choice: 自己的份
  rationale: חֵלֶק 指所得的份额或分配所得。两处均译作“份”，保留原文刻意的重复；加“自己的”使汉语指代清楚。
- source_word: וְלוֹקֵחַ חֵלֶק רֵעֵהוּ
  choice: 他拿取邻舍的份
  rationale: לוקח 是“拿取”，רֵעַ 可指邻舍、同伴或他人。“邻舍”保留智慧文学中的伦理色彩，同时不把动词本身强化为原文未明说的暴力抢夺。
- source_word: מְאַבֵּד חֶלְקוֹ
  choice: 反倒毁掉自己的份
  rationale: מְאַבֵּד 是使之失去、毁坏的使役形式。“毁掉”保留主动结果；“反倒”明示原句中夺取别人之份却损毁自己之份的反讽关系。
theological_decisions:
- issue: 如何处理疑难的希伯来词 כּוֹשֵׁל
  choice: 依据希腊语平行文本译作“贪心的人”，将首句理解为贪欲永不满足。
  alternative: 较按字面译作“踉跄的人”或“失败的人”，并译成“在失败者眼中，他的份很少”。
  rationale: 希伯来文本此处存在显著异文或传抄困难，按通常词义直译会使箴言语意突兀。希腊语古译明确说“贪婪者的眼睛不因所得的份而满足”，与本节下半句侵占邻舍之份的警戒吻合，因此用它协助辨明疑难词，但不以希腊语不同的下半句取代现存希伯来语。
- issue: 希伯来语与希腊语下半句的差异
  choice: 正文依希伯来语译为“他拿取邻舍的份，反倒毁掉自己的份”。
  alternative: 依希腊语译为“邪恶的不义使灵魂枯干”。
  rationale: 现有希伯来语在下半句语法完整、意义连贯，且与上半句形成关于“份”的重复和反讽；因此正文保留希伯来见证，不调和为希腊语的不同表述。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“总是太少”表现贪心者主观上永不满足；分号保留两小句的紧密对照。正文脚注标记[a]与脚注完全对应。
