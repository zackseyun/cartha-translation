  text: He takes refuge in its shade from the heat[a], and he dwells in its shelters.
translation:
  language: zh_hans
  text: 他在她的荫下寻求庇护，躲避炎热[a]；他住在她的居所中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按希腊文平行本较直译：“他将蒙她庇护，免受灼热；并将在她的荣耀中住宿。”希伯来文作“在她的居所中”，希腊文则作“在她的荣耀中”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְחוֹסֶה
  choice: 他躲在……，避过
  rationale: חסה表示投靠、寻求庇护。结合后面的“荫下”和“炎热”，译为“躲在……避过”自然呈现保护之意，并保留希伯来文分词所表达的概括性场景。
- source_word: בְּצִלָּהּ
  choice: 在她的荫下
  rationale: צל意为荫、影；此处与炎热相对，译作“荫下”最贴合具体意象。阴性后缀承接上下文中人格化的智慧，因此用“她的”。
- source_word: מֵחֹרֶב
  choice: 避过炎热
  rationale: חרב在此可指炎热、干热；希腊文καῦμα也支持“炎热”或“灼热”。“避过炎热”准确而自然。
- source_word: וּבִמְעוֹנוֹתֶיהָ
  choice: 在她的居所中
  rationale: מָעוֹן的复数表示居所、住处。希伯来文首先指向“居所”，不宜仅凭保护性语境收窄为“庇护所”。汉语集合性的“居所”可自然对应复数。
- source_word: יִשְׁכֹּן
  choice: 他要住
  rationale: שכן意为居住、安居。未完成式可表达后续或概括性的动作；“要住”既衔接前半句，也保留其时态体貌的开放性。
theological_decisions:
- issue: 阴性后缀所指的人格化智慧
  choice: 译作“她的荫下”“她的居所”
  alternative: 译作“它的荫下”“它的居所”
  rationale: 希伯来文两处阴性后缀承接上下文中的智慧；现代汉语用“她”能显明人格化修辞，同时不对智慧的本体作额外教义界定。
- issue: 单数概括性主体
  choice: 用“他”
  alternative: 用“人”或“那人”
  rationale: 原文以单数形式延续前文所描写的寻求智慧者；“他”保留单数诗体表达，并不把经文限定为只有男性适用。
- issue: 希伯来文与希腊文末句差异
  choice: 正文采用希伯来文“在她的居所中”
  alternative: 依希腊文译作“在她的荣耀中住宿”
  rationale: 所给希伯来文本可靠，故正文以其为主；希腊平行文本的“荣耀”属于真实的文本差异，列入脚注而不在正文中调和。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“荫下—炎热—居所”保留原文连续的庇护与安居意象；分号呈现两分句的诗体平行。
