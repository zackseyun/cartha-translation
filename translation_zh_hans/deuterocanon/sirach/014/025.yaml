  text: He pitches his tent beside her[b][a], and he lodges in a good dwelling-place.
translation:
  language: zh_hans
  text: 他在她身旁搭起帐棚[a]，并住在美好的居所中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在她身旁”字面为“在她手边”，是表示靠近的说法；希腊平行文本也有“在她手边”的表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“并住在美好的住处中。”希伯来文措辞紧凑；希腊平行文本的表达也可能带有“在美好事物中住宿”的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹטֶה
  choice: 支搭
  rationale: נטה与“帐棚”连用时，表示展开、搭起帐棚；“支搭帐棚”自然保留具体意象。
- source_word: אָהֳלוֹ
  choice: 他的帐棚
  rationale: אֹהֶל是普通的“帐棚”，不宜抽象化为一般的居所或庇护。
- source_word: עַל יָדָהּ
  choice: 在她身旁
  rationale: 字面为“在她手边”，这里是表示靠近的方位说法；希腊文κατὰ χεῖρας αὐτῆς也支持此义。正文采用自然汉语，字面形式收入脚注。
- source_word: וְשָׁכַן
  choice: 便安居
  rationale: שכן可指居住、安顿；在帐棚和住所的语境中，“安居”既承接栖居意象，也避免表达得过于短暂。
- source_word: שֹׁכֶן טוֹב
  choice: 佳美的住所
  rationale: 传世希伯来文措辞紧凑，大致指“好的居所”；希腊文进一步呈现为“美好事物的住处”。“佳美的住所”保留居住意象而不过度确定其细微句法。
theological_decisions:
- issue: 智慧的女性人格化
  choice: 用“她”指智慧
  alternative: 用“它”取消人格化
  rationale: 上下文把智慧人格化为女性；保留阴性指称忠实呈现其文学和神学意象。
- issue: 居住意象的具体程度
  choice: 保留“帐棚—安居—住所”的具体意象
  alternative: 意译为“亲近智慧，便生活美好”
  rationale: 原文借支搭帐棚和居住描绘亲近智慧；不应将这一鲜明比喻抽象化。
- issue: שֹׁכֶן טוֹב的紧缩表达
  choice: 译作“佳美的住所”并注明另一种理解
  alternative: 译作“美好的住处”或“在美好之中住宿”
  rationale: 希伯来文可作紧缩的居所表达，希腊平行文本则带有“美好事物”的复数色彩；正文不强行解决这一张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“支搭帐棚”保留古代生活图景且通俗可懂；“佳美”略带经文语体，但仍属现代读者熟悉的表达。所有代词均延续上下文中智慧的女性人格化。
