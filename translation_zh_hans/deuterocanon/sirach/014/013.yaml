  text: Before you die[a], do good to one you love, and according to what your hand attains[b], give to him.
translation:
  language: zh_hans
  text: 你去世以前，要善待你所爱的人[a]；要把你力所能及的[b]给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你所爱的人”也可译作“朋友”；希腊语平行文本作“朋友”。
    reason: alternative_reading
  - marker: b
    text: 直译为“你手所达到的”，指按照你的能力、财力或可支配的资源。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם תָּמוּת
  choice: 你去世以前
  rationale: 直译时间从句，清楚表达应在死亡临到之前行善；“去世”庄重而符合现代汉语。
- source_word: הֵיטִב
  choice: 要善待
  rationale: 使役形在此表示使对方得益、向对方行善；“善待”自然地保留受益对象，不限定具体方式。
- source_word: לְאוֹהֵב
  choice: 你所爱的人
  rationale: 希伯来语可指所爱的人或亲爱者；希腊语 φίλῳ 支持“朋友”的关系含义，但正文保留希伯来语较宽的表达。
- source_word: וְהַשִּׂיגַת יָדְךָ
  choice: 按你力所能及的
  rationale: 原文以“你的手所达到的”表示个人实际能力或财力；此译自然传达习语意义，希腊语 κατὰ τὴν ἰσχύν σου 也印证“按能力”的理解。
- source_word: תֶּן לוֹ
  choice: 给他
  rationale: 保留命令语气和明确的受益对象；所给之物由上文“力所能及的”概括，不作额外限定。
theological_decisions:
- issue: לְאוֹהֵב / φίλῳ 所指的受惠对象
  choice: 你所爱的人
  alternative: 朋友
  rationale: 以希伯来语正文为主，保留其较广的亲爱关系含义；脚注注明希腊语平行文本的“朋友”，不把范围在正文中收窄。
- issue: “你的手所达到的”是财物还是广义能力
  choice: 按你力所能及的
  alternative: 按你的财力
  rationale: 希伯来语意象和希腊语平行文本均可涵盖资源与能力；不将劝勉仅限于金钱，以保留原文语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“善待”比生硬的“行善给”自然；“力所能及”传达原文手所能达到的意象含义。脚注标记置于整节末尾，涵盖本节两项必要说明。
