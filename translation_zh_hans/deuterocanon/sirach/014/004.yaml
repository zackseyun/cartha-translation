translation:
  language: zh_hans
  text: 亏待自己的人，是为别人积攒；外人[a]却要尽情享用他的财物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作单数“外人”；希腊文平行文本作复数“其他人”。
    reason: alternative_reading
lexical_decisions:
- source_word: מוֹנֵעַ לְנַפְשׁוֹ
  choice: 亏待自己的
  rationale: מנע意为扣留、不给；与לְנַפְשׁוֹ连用，表示不让自己享用所有之物。译作“亏待自己的”既体现自我剥夺，也符合现代汉语表达。
- source_word: יִקְבֹּץ לְאַחֵר
  choice: 是为别人积攒
  rationale: קבץ意为聚集、积攒；לְאַחֵר说明最终受益者是另一个人。“为别人积攒”保留原文的反讽。
- source_word: וּבְטוֹבָתוֹ
  choice: 他的财物
  rationale: טובה在此具体指其所有的好东西或产业；希腊文τοῖς ἀγαθοῖς αὐτοῦ也支持具体理解。译作“财物”自然且切合物质语境。
- source_word: יִתְבַּעְבֵּעַ
  choice: 尽情享用
  rationale: 这个罕见的反身或反复形式表示奢享、纵情享受；希腊文τρυφήσουσιν提供同样语义。“尽情享用”清楚传达强烈、充分的享受。
- source_word: זָר
  choice: 陌生人
  rationale: 希伯来文为单数，基本义是陌生者、外人。正文保留单数，以尊重主要希伯来文本。
