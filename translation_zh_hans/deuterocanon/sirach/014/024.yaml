  text: He who camps around her house and drives his tent peg into her wall—[a]
translation:
  language: zh_hans
  text: 那在她房屋四周安营、把帐篷橛钉在她的墙上的人——[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那在她房屋附近住宿、把橛子固定在她的墙上的人。”希腊文较明确地说“附近”，希伯来文则生动地说“四周”。“钉在她的墙上”也可按语境理解为“钉进她的墙内”或“靠着她的墙固定”。
    reason: 保留希伯来文与希腊文在方位表达上的差异，并说明介词ב在橛子与墙之关系上的合理译法。
lexical_decisions:
- source_word: הַחוֹנֶה
  choice: 安营
  rationale: חנה表示“扎营、安营”；分词形式描写这人的典型行动。“安营”保留希伯来文具体的营帐意象。
- source_word: סְבִיבוֹת
  choice: 在……四周
  rationale: 希伯来文表达环绕性的临近，比泛指“附近”更形象；希腊文σύνεγγυς则支持空间上靠近的含义。
- source_word: בֵּיתָהּ
  choice: 她房屋
  rationale: 直译其阴性所有结构；结合上下文，“她”指人格化的智慧。“房屋”保留具体比喻。
- source_word: וְהֵבִיא
  choice: 钉
  rationale: 该动词字面为“带来、使进入”，但与橛子搭配，并参照希腊文πήξει“固定、钉牢”，译为“钉”符合汉语习惯。
- source_word: יְתֵדָיו
  choice: 帐篷橛
  rationale: יתד指橛子或木桩，在安营语境中特指帐篷橛。希伯来文形式可理解为“他的橛子（复数）”，而希腊文为单数；汉语名词本身不强制标示数，因而保留这种数的含混。
- source_word: בְּקִירָהּ
  choice: 在她墙边
  rationale: קיר是“墙”；介词ב可表示“在、靠着、进入”。若直译“钉进墙里”会形成不自然甚至误导性的搭帐篷图景，因此正文用“墙边”表达紧贴其居所固定营帐，同时以脚注保留其他可能。
theological_decisions:
- issue: 阴性代词所指
  choice: 按上下文理解为人格化的智慧
  alternative: 泛指一名女子或一个家庭人物
  rationale: 紧接的语境论及寻求、守候智慧，因此房屋意象自然延续对智慧的拟人描写，而非突然转指普通女子。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“安营—帐篷橛”保持原文连续意象；“那……的人”体现希伯来文分词的特征性描述。句末破折号保留经节未完、承接下文的语势。
