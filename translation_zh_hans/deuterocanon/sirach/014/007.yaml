  text: Even if he does good[a], he does it in forgetfulness, and in the end he reveals his evil.
translation:
  language: zh_hans
  text: 即使他行善，也是在忘却中行的[a]；到最后，他显露出自己的恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也是忘记着行的”，或“行得仿佛会被遗忘”；希腊文直译为“在忘却中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν
  choice: 即使
  rationale: καὶ ἐάν的缩合形式，在此引出让步条件；“即使”自然保留其语气。
- source_word: εὖ ποιῇ
  choice: 行善
  rationale: εὖ ποιέω可指行得好或施行善事；“行善”简洁自然，并符合本节的道德语境。
- source_word: ἐν λήθῃ
  choice: 在忘却中
  rationale: 直译为“在忘却中”。原短语含义不寻常，可能表示忘记着去做、漫不经心地做，或做得仿佛会被遗忘；正文保留其含混性。
- source_word: ποιεῖ
  choice: 做的
  rationale: 承接前面的“行善”，在汉语中以“做的”复现动作，避免生硬重复完整宾语。
- source_word: ἐπʼ ἐσχάτων
  choice: 到最后
  rationale: 这是表示时间终点的短语，可指最后、最终；“到最后”符合现代汉语表达。
- source_word: ἐκφαίνει
  choice: 显露
  rationale: 该词指使某事显现或暴露出来；“显露”既保留主动意味，也适合恶被呈现出来的语境。
- source_word: τὴν κακίαν αὐτοῦ
  choice: 自己的恶
  rationale: κακία可涵盖恶、邪恶或恶意；“恶”保持宽泛，不将其限缩为某种特定恶意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在忘却中”略带陌生感，是为保留希腊原文ἐν λήθῃ的不寻常表达及其真实歧义；脚注列出较顺畅的可能译法。
