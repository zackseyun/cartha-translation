base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/001.yaml
  text: Happy is the man whose mouth has not caused him to stumble[b][a], and whose heart has not condemned him.
translation:
  language: zh_hans
  text: 口舌没有使他失足的人有福了[a]；他的心也没有定他的罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本此句较难，直译近似“他的口没有离弃他”。希腊平行文本作“没有在言语上失足”，所指大概是没有在言语上犯错。
    reason: alternative_reading
  - marker: b
    text: 此句的希伯来文本也不确定，字面包含“心的判断”。希腊平行文本则作“没有因罪的忧伤而被刺痛”。
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是智慧文学中的称福格式，表示一种令人羡慕的美好处境。“有福了”既自然庄重，也不必把它限定为直接由上帝施予的福分。
- source_word: אֱנוֹשׁ
  choice: 人／这人
  rationale: 该词泛指一个人。汉语用“人”准确自然，无须添加原文没有强调的性别意味；后半句用“这人”承接，以避免代词指向含混。
- source_word: לֹא עֲזָבוֹ פִיהוּ
  choice: 口舌没有使人失足
  rationale: 现存希伯来文本直译近似“他的口没有离弃他”，语义困难。希腊平行文本作“没有在口舌上失足”，表明所指很可能是言语导致的道德过失。“口舌没有使人失足”保留了口作为施事者的希伯来表达，同时传达可能的含义。
- source_word: וְלֹא אָבַח עָלָיו דִּין לִבּוֹ
  choice: 他的心也没有定他的罪
  rationale: 希伯来动词及句法不寻常，但“心的判断”显然涉及内在裁决或责备。译作“心……定他的罪”保留司法性的“判断”意象，也比直接译作“良心”更贴近原文字面。
theological_decisions:
- issue: 称福格式的表达
  choice: 有福了
  alternative: 快乐／幸福
  rationale: “有福了”在现代汉语中仍能清楚表达智慧文学的称福语气，同时保持庄重；它不额外断言此处明确描述一种特定的神学性赐福。
- issue: 如何处理两处分歧或残缺的文本
  choice: 正文以希伯来文本为锚点，并用希腊平行文本澄清首句的可能含义；第二句保留“心作出定罪判断”的意象
  alternative: 直译为“他的口没有离弃他”；或依希腊文译为“没有因罪的忧伤而被刺痛”
  rationale: 首句若机械直译会在汉语中近乎不可理解，因此采用希腊平行文本所见的“失足”含义。第二句的希伯来文虽困难，仍含“心”与“判断”的线索；正文不加入仅在现存希腊文中明确出现的“罪的忧伤”，而在脚注交代异文，以保留文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。以“口舌”自然表达言语行为，以“失足”和“定罪”保留道德及司法意象。正文脚注标记按出现顺序列为[a]、[b]。
