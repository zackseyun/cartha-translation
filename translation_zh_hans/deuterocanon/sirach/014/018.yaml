revisions:
- from: 繁茂树上的叶子萌发，一片凋零，另一片长出；血肉之人的世代也是如此：一代死去，另一代长成[a]。
  to: 正如繁茂的树上萌发的叶子：这一片凋零，另一片长出；血肉之人的世代也是如此：这一代逝去，另一代成长[a]。
  rationale: 修订明确译出比喻引导词，并将开头调整为自然的现代汉语，同时保留叶片的生长—凋零对照。“这一代逝去，另一代成长”延续希伯来语优先的谨慎处理；脚注保留希腊语“出生”的平行读法，而不在正文中消解见证间的歧义。
