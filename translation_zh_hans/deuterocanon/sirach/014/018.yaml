base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/018.yaml
  text: 'Like the leaves budding on a luxuriant tree—one withers and another sprouts—so are the generations of flesh and blood: one dies and another is born[a].'
translation:
  language: zh_hans
  text: 正如繁茂的树上萌发的叶子：这一片凋零，另一片长出；血肉之人的世代也是如此：这一代逝去，另一代成长[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 גּוֹמֵל 可理解为“成熟”或“长成”；希腊语平行文本作“出生”。
    reason: 保留希伯来语词义的可能范围，并交代希腊语平行见证的不同读法。
lexical_decisions:
- source_word: כְּפֶרַח עָלֶה
  choice: 叶子萌发
  rationale: 希伯来语表达较为凝缩，可指叶片初生、萌发；希腊语 θάλλον 也支持生长繁盛的叶叶意象。译文用现代汉语自然呈现，不另添“花朵”的意象。
- source_word: עֵץ רַעֲנָן
  choice: 繁茂树
  rationale: רַעֲנָן 表示青翠、鲜润而茂盛；“繁茂”既表达旺盛生机，也与希腊语所呈现的枝叶稠密相合。
- source_word: שֶׁזֶּה נוֹבֵל וְאַחֵר צוֹמֵחַ
  choice: 一片凋零，另一片长出
  rationale: נוֹבֵל 是枯萎、凋零，צוֹמֵחַ 是萌生、生长。“一片……另一片……”保留具体叶片的对照及植物隐喻。
- source_word: כֵּן דּוֹרוֹת בָּשָׂר וָדָם
  choice: 血肉之人的世代也是如此
  rationale: 保留“血肉”这一闪族语的人类必死性表达，同时补出“人”，使现代汉语清楚自然；דּוֹרוֹת 译作“世代”。
- source_word: אֶחַד גֹּוֵעַ
  choice: 一代死去
  rationale: גֹּוֵעַ 指断气、死亡；依前文“世代”的复数补明“一代”，避免误解为单独某个人。
- source_word: וְאֶחַד גּוֹמֵל
  choice: 另一代长成
  rationale: 以希伯来语为首要依据，גּוֹמֵל 可表达长成、成熟。译作“长成”也与前半句植物不断生长的比喻相连，同时用脚注交代希腊语异文。
theological_decisions:
- issue: בָּשָׂר וָדָם 的人类学惯用语
  choice: 血肉之人
  alternative: 人类／世人
  rationale: 保留原文“血肉”的具体意象及其必死性，不把它化约为抽象的“人类”。
- issue: גּוֹמֵל 所指的是长成还是出生
  choice: 长成
  alternative: 出生
  rationale: 希伯来语原文优先支持“长成／成熟”，希腊语则明确作“出生”。正文不以希腊语消解希伯来语的词义张力，而在脚注中保存平行见证。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号连接树叶更替与人类世代更替，使比喻关系清晰；用“一代……另一代……”承接“世代”，避免汉语指代含混。
