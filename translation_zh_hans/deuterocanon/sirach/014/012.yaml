base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/012.yaml
  text: Refresh yourself while you still have the power; remember that there is no pleasure in Sheol[a], and death does not delay, and the decree of Sheol has not been made known to you.
translation:
  language: zh_hans
  text: 趁你还有能力，使自己舒畅；要记住，阴间没有享乐[a]，死亡不会迟延，阴间的定例没有告知你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本从“要记住”开始，未包括本节开头的劝勉和“阴间没有享乐”一句，作：“要记住，死亡不会迟延，阴间的约没有指示给你。”希伯来文末句作“阴间的定例没有告知你”。
    reason: 说明希伯来文与希腊文平行传统在本节结构上的差异，并注明希伯来文“定例”与希腊文“约”的不同读法。
lexical_decisions:
- source_word: וּלְאֵל יָדְךָ
  choice: 趁你还有能力
  rationale: 该短语直译近于“按你手中的力量”，在上下文中指尚有能力或条件之时；采用自然汉语表达，同时保留当下能力有限的意味。
- source_word: הִדָּשֵׁן
  choice: 使自己身心舒畅
  rationale: דשן可指使丰足、滋润或享受美好；此处与死亡将至的提醒相对，意为趁尚能享用时使自己得到滋养和舒畅，并非字面上的“使自己肥胖”。
- source_word: זְכוֹר
  choice: 要记住
  rationale: 直接保留智慧劝诫中的命令语气。
- source_word: בִשְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל指死者所在之境；“阴间”是现代汉语中较自然且不必然等同于后期“地狱”观念的对应词。
- source_word: תַּעֲנוּג
  choice: 享乐
  rationale: 该名词表示愉悦、享受；“享乐”与前句趁有能力使自己舒畅的劝诫形成清楚呼应。
- source_word: וְלֹא מָוֶת יִתְמַהְמַהּ
  choice: 死亡不会迟延
  rationale: יתמהמה表示耽搁、迟延；译文保留其格言式陈述，希腊平行文本也支持此义。
- source_word: וְחֹק לִשְׁאוֹל
  choice: 阴间的定例
  rationale: חֹק可指法令、定例或所定的限度；לִשְׁאוֹל在此关系略有含混，译作“阴间的定例”保留其固定、不可回避之规则的意味，不改从希腊文“阴间的约”。
- source_word: לֹא הֻגַּד לָךְ
  choice: 并未向你说明
  rationale: נגד的被动式意为被告知、被说明；此处强调有关阴间定例的详情并未启示给人。
theological_decisions:
- issue: שְׁאוֹל / ᾅδης的译法
  choice: 阴间
  alternative: 坟墓；冥府；地狱
  rationale: 原文所指是希伯来智慧传统中的死者之境，并不明确等同于后期教义中的惩罚之地；“阴间”既自然，也避免加入过度具体的神学含义。
- issue: חֹק לִשְׁאוֹל与希腊文διαθήκη ᾅδου的差异
  choice: 正文依希伯来文译为“阴间的定例”
  alternative: 依希腊文译为“阴间的约”
  rationale: 所给希伯来文本证据可靠且为主要底本，因此正文保留חֹק“定例”的读法；脚注指出希腊平行文本的差异，不将两者强行调和。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“身心舒畅”避免将דשן误解为字面增肥；分号维持劝勉与死亡提醒之间的转折张力。
