  text: One who looks in through her window[a], and at her doorway he will listen.
translation:
  language: zh_hans
  text: 从她的窗户向里窥望的人，也会在她的门口侧耳倾听[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“窥听”。希伯来文此词表示专注地听，有时含暗中听的意味；希腊文作“倾听”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁקִיף
  choice: 向里窥望的人
  rationale: שׁקף表示从某处探看、窥望；结合“穿过窗户”和希腊文παρακύπτων，此处不是随意看一眼，而是探身向里察看。用“窥望”保留专注观察的意味。
- source_word: בְּעַד חֲלוֹנָה
  choice: 从她的窗户向里
  rationale: בְּעַד在空间语境中表示“穿过、透过”。“她的”承接上下文中女性化的智慧形象；“向里”使现代汉语清楚表达窥看方向。
- source_word: וְעַל פְּתָחֶיהָ
  choice: 也会在她的门口
  rationale: פְּתָחֶיהָ在形式上是复数“她的门口／入口”，但这里是整体性的建筑意象；汉语用集合意义的单数“门口”更自然。“在”准确表达עַל在此处的位置关系。
- source_word: יְצוֹתֵת
  choice: 侧耳倾听
  rationale: 该动词表示专注地听，也可能带暗中窥听的色彩；希腊文ἀκροάσεται支持一般的“倾听”。“侧耳倾听”既体现专注，又不把暗中偷听的含义定死。
theological_decisions:
- issue: 将智慧人格化为女性
  choice: 保留女性代词“她”
  alternative: 改用抽象化的“它”，或省略代词
  rationale: 上下文把智慧描绘成女性及房屋的主人；希伯来文的阴性后缀和希腊文的阴性代词都支持“她”。保留这一表达可避免削弱原文的人格化意象。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“窥望”与“侧耳倾听”形成视觉和听觉上的对应；“也会”自然连接分词所指的人与后续未完成式动作，同时不额外解释其动机。
