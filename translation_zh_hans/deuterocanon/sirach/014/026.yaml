translation:
  language: zh_hans
  text: 他把窝安在她的枝叶间[a]，并在她的枝条间过夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“他要把自己的儿女安置在她的庇荫下，并要在她的枝下过夜。”希伯来文则作“他的窝”和“在她的枝叶间”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשִׂים
  choice: 安在
  rationale: שׂים意为“放置、安放”；与“窝”搭配时，“把窝安在”是自然的现代汉语，也保留具体动作。
- source_word: קִנּוֹ
  choice: 他的窝
  rationale: קֵן明确指鸟巢、窝；希腊文虽作“他的儿女”，现存希伯来文本语义清楚，且与树木意象吻合，故正文从希伯来文。
- source_word: בְעָפְיָהּ
  choice: 在她的枝叶间
  rationale: עֳפִי指繁茂的叶丛或枝叶；“枝叶间”既自然又能呈现藏身于树冠之中的空间意象。阴性后缀译作“她的”，承接上下文中人格化的智慧。
- source_word: וּבַעֲנָפֶיהָ
  choice: 在她的枝头
  rationale: עָנָף意为树枝、枝条。介词ב基本表示“在……中/上”；“枝头”适合中文树栖图景，同时不采用希腊文的“枝下”。
- source_word: יִתְלוֹנָן
  choice: 住宿
  rationale: לון的这一形式表示投宿、过夜；“住宿”简明保留暂住或夜宿之义，不泛化为长期“居住”。
theological_decisions:
- issue: 希伯来文本与希腊平行文本略有差异时采用哪一读法
  choice: 正文依现存希伯来文，译作“他的窝／在她的枝叶间／在她的枝头”。
  alternative: 希腊平行文本作：“他要把自己的儿女安置在她的荫庇中，并要在她的枝下住宿。”
  rationale: 本节希伯来文本完整、连贯，并延续树木与筑巢的鲜明意象，应作为正文依据；希腊文的“儿女”“荫庇”“枝下”属于有意义的异文，故在脚注中完整保留，不将两种读法混合。
translation_notes:
  register: 采用现代、庄重而具象的汉语。“把窝安在”比直译“放置他的窝”自然；“住宿”保留过夜投宿的意味。以“她”延续智慧人格化的阴性指称。
