  text: My son[a], if you have the means, treat yourself well; and if you have anything, do good to yourself.
translation:
  language: zh_hans
  text: 我儿，你若有余裕，就善待自己；你若有财物，就使自己得益处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本只有对儿子的两重劝勉。希腊平行文本在“要善待自己”之后另有一句：“并向主献上相称的供物。”这可能反映一个较完整或不同的古代文本形式。
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 直译希伯来语带第一人称单数后缀的称呼；原文明确为阳性单数，用现代而庄重的“我儿”保留其父辈劝诫语气。
- source_word: אִם יֵשׁ לְךָ
  choice: 你若有
  rationale: 这是希伯来语表示拥有的存在句式；按汉语习惯译为“你若有”，并根据各分句语境补出宾语。
- source_word: שָׁרֵית נַפְשֶׁךָ
  choice: 有余裕，就善待自己
  rationale: 此短语简略且不寻常，可能指可供自己使用的余力或资源。译文以“有余裕”表达可支配条件，以“善待自己”传达对自身的照顾，同时避免把难解措辞过度具体化。
- source_word: הֵיטִיב לָךְ
  choice: 使自己得益处
  rationale: יטב 的使役形式配合 לָךְ，在此具有使自己受益、善待自己的反身意义。“使自己得益处”保留第二分句的劝勉色彩，也避免与前一分句完全重复。
- source_word: προσφορὰς Κυρίῳ ἀξίως πρόσαγε
  choice: 向主献上相称的供物
  rationale: 该分句仅见于希腊平行文本，意为向主呈献合宜或相称的供物。本译文不将其并入希伯来正文，而在脚注中完整说明。
theological_decisions:
- issue: 现存希伯来文本没有、希腊平行文本却保存的献祭分句
  choice: 正文依现存希伯来文本翻译，将希腊分句列入脚注
  alternative: 在正文加入“并向主献上相称的供物”
  rationale: 本节的希伯来文本现存且校勘置信度高，应作为正文的首要依据。希腊分句可能保存较完整的古老文本，也可能反映不同传本；以脚注呈现可保留重要证据，而不把有争议的增文无标记地纳入正文。
- issue: 第二分句反身表达的伦理含义
  choice: 使自己得益处
  alternative: 享受人生／犒赏自己
  rationale: 原文鼓励人在拥有资源时善待自身，但措辞本身并不必然表示纵欲或奢侈。“使自己得益处”保持正面的伦理张力，不添加特定禁欲或享乐立场。
translation_notes:
  register: 采用现代标准书面汉语，语气简洁、庄重而易懂。“我儿”保留智慧文学中长者教诲晚辈的称呼；两个条件分句尽量反映希伯来文本的重复结构，同时用“善待自己／使自己得益处”避免汉语表达机械重叠。
