  yaml_path: translation/deuterocanon/sirach/014/020.yaml
  text: Blessed is the man who meditates on wisdom[b][a], and who reflects with understanding.
translation:
  language: zh_hans
  text: 有福[a]的是那默想智慧的人[b]；他也以悟性沉思。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福”也可译作“幸福”或“可羡”。希伯来语的称福公式所指的不只是内心快乐，也包括一种兴盛、值得羡慕的生命状态。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本的措辞显著不同，作：“有福的是那在智慧中走到终点的人，也是那凭着自己的悟性谈论的人。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福的是
  rationale: 希伯来语智慧文学中的称福公式，表达一种值得羡慕、蒙福而兴盛的处境；“有福”比单纯描述情绪的“快乐”更能保留其庄重和宣告意味。
- source_word: אֱנוֹשׁ
  choice: 那……的人
  rationale: 原文为阳性单数，但此处用于智慧格言中的代表性个体。汉语以“人”自然表达，不必添加源文没有的性别标记。
- source_word: בְּחָכְמָה יֶהְגֶּה
  choice: 默想智慧
  rationale: הגה 表示沉思、低声吟诵或反复思想；与介词短语合用时，汉语译为“默想智慧”自然且贴近语义。
- source_word: וּבִתְבוּנָה
  choice: 以聪慧
  rationale: ב 可表达凭借或伴随；“以聪慧”保留其工具性，并与前半句的“智慧”有所区分。
- source_word: יִשְׁעֶה
  choice: 专心思量
  rationale: 该动词可指转向、留意或凝神关注；在本节平行结构中，“专心思量”表达对智慧的 attentive intellectual engagement，同时避免过度落实为视觉动作。
theological_decisions:
- issue: 称福公式的含义
  choice: 有福的是
  alternative: 快乐的是
  rationale: 保留智慧文学中对一种蒙福、可羡生命状态的宣告，而不把含义缩减为主观情绪。
- issue: 智慧格言中的阳性单数
  choice: 那……的人
  alternative: 那个男人
  rationale: 希伯来语 אֱנוֹשׁ 在形式上为阳性单数，但此处格言具有泛指作用；现代汉语“人”既忠实表达所指，也不强加不必要的男性限定。
- issue: 希伯来文与希腊文的显著差异
  choice: 正文依高可信度的希伯来文译作“默想智慧……以聪慧专心思量”
  alternative: 依希腊文译作“在智慧中走到终点……谈论自己的悟性”
  rationale: 指定的希伯来文本完整且置信度高，应作为正文依据；希腊平行文本的不同措辞则以脚注保存，不将两种读法调和。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“默想”保留沉思意味；“专心思量”使较罕见且含义宽泛的 יִשְׁעֶה 在汉语中自然呈现。脚注标记按首次涉及的位置排列为[a][b]。
