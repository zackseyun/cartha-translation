  yaml_path: translation/deuterocanon/sirach/014/008.yaml
  text: Evil is the man with an envious eye[b][a], turning away his face and despising lives.
translation:
  language: zh_hans
  text: 眼中怀着嫉妒的人是恶人[a]；他转过脸去，藐视他人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有恶眼的人是恶人。”这个希腊语说法可指嫉妒、吝惜、不愿别人得好处的性情。
    reason: lexical_alternative
  - marker: b
    text: “他人”原文直译为“灵魂”，也可指“人”或“性命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: 恶人
  rationale: 该谓语形容词表达道德上的邪恶，而不只是一般的不好；译作“恶人”自然地呈现其对人的品格判断。
- source_word: ὁ βασκαίνων ὀφθαλμῷ
  choice: 眼中怀着嫉妒的人
  rationale: βασκαίνω 与“眼”连用，可表达嫉妒、吝惜，也可能唤起“恶眼”这一习语。正文保留“眼”的意象，并用“嫉妒”传达本段伦理语境中的主要含义。
- source_word: ἀποστρέφων πρόσωπον
  choice: 转过脸去
  rationale: 贴近原文的身体动作意象，表现拒绝理会或不肯施予，同时符合现代汉语表达。
- source_word: ὑπερορῶν
  choice: 藐视
  rationale: 该词可指轻看、鄙视或漠视；“藐视”保留其轻蔑意味，并与本句凝练、庄重的语体相称。
- source_word: ψυχάς
  choice: 他人
  rationale: ψυχή 在此更可能指具体的人，而非专指与身体相对的非物质“灵魂”。“他人”在汉语中自然，并避免加入原文未必具有的人论含义。
theological_decisions:
- issue: 如何表达 βασκαίνων ὀφθαλμῷ 的习语含义
  choice: 眼中怀着嫉妒
  alternative: 有恶眼／用眼嫉妒
  rationale: 正文以现代读者容易理解的方式表达嫉妒、吝惜的性情，同时保留“眼”的具体意象；“恶眼”这一较具文化色彩的可能译法列入脚注。
- issue: 如何理解 ψυχάς
  choice: 他人
  alternative: 灵魂／性命
  rationale: 此处该词可以泛指人或生命，不宜在正文中限定为非物质的“灵魂”；脚注保留其字面及其他可能含义。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。正文保留“眼”与“转脸”的视觉意象，并以“他人”避免把 ψυχάς 过度术语化。
