  text: But these are men of steadfast love[b][a], and their hope will not cease.
translation:
  language: zh_hans
  text: 然而，这些人都是有忠贞之爱的人[b]，他们的盼望不会止息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“美好的产业与他们的后裔一同存留——他们的子孙。”开罗藏经库希伯来文本在这里却作：“这些人都是有忠贞之爱的人，他们的盼望不会止息。”马萨达文本在相邻内容中也有另一种表述，重点在后裔及其长存。
    reason: textual_variant
  - marker: b
    text: “忠贞之爱”所译的希伯来语 חֶסֶד，也可译作“坚定的爱”、“怜悯”或“忠诚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: 然而
  rationale: 承接上文形成转折，简洁保留希伯来语的逆接语气。
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 直接表达指示意义，指向正在述说的先贤。
- source_word: אַנְשֵׁי חֶסֶד
  choice: 忠贞仁爱之士
  rationale: “之士”保留原文对男性先贤的称谓；“忠贞仁爱”同时体现 חֶסֶד 所含的仁慈、信实与关系忠诚，避免仅译作一般的善良。
- source_word: וְתִקְוָתָם
  choice: 他们的盼望
  rationale: תקוה 的基本义为盼望，所有格后缀由“他们的”直接表达。
- source_word: לֹא תִשְׁבֹּת
  choice: 永不止息
  rationale: שבת 在此指停止、止息；“永不止息”自然表达未然和持续之意，又不擅自说明盼望如何实现。
theological_decisions:
- issue: 开罗藏经库希伯来文本与希腊平行文本在本节存在显著差异
  choice: 正文依现存希伯来文本译为“这些人是忠贞仁爱之士，他们的盼望永不止息”
  alternative: 依希腊文本译为“他们的后裔承受美好的产业，他们的子孙长存”，或把后裔、产业等内容调和进正文
  rationale: 《便西拉智训》有希伯来文存世之处以希伯来文为正文依据，同时不掩盖希腊传统的重大异文。两者内容不可无痕调和，因此将希腊读法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“忠贞仁爱之士”略带典雅色彩，适合先贤颂赞的语境；句法简洁，不将文本异文或神学含义强行调和。
