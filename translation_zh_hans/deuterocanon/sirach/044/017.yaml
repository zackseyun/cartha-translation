base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/017.yaml
  text: Noah was found righteous[a], blameless; at the time of destruction he became a substitute. Because of him a remnant remained[b], and by his covenant the flood ceased.
translation:
  language: zh_hans
  text: 挪亚被认定为义人，纯全无过；在毁灭之时，他成了替代者[a]。因着他，余民得以存留；藉着他的约，洪水止息了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “替代者”也可理解为“交换之物”“补偿”或“赎价”。希伯来语 תחליף 与希腊语 ἀντάλλαγμα 都含有以一方代替另一方的意思。
    reason: lexical_alternative
  - marker: b
    text: 希腊语平行文本的末句有异文，似乎指向洪水发生或临到，而不是洪水止息。这里采用的希伯来语见证作：“藉着他的约，洪水止息了。”
    reason: textual_variant
lexical_decisions:
- source_word: נח
  choice: 挪亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: צדיק
  choice: 义人
  rationale: 保留希伯来语所表达的道德正直及其圣经伦理色彩，也与希腊语 δίκαιος 相符。
- source_word: תמים
  choice: 纯全无过
  rationale: 此处强调挪亚品格完整、无可指摘，并非宣称绝对完美；这一译法也能自然地与“义人”并列。
- source_word: לעת כלה
  choice: 在毁灭之时
  rationale: כלה 在此指毁灭性的灾难或审判，不只是时间意义上的“终结”。
- source_word: תחליף
  choice: 替代者
  rationale: 该词表示取代另一方之物或人；“替代者”简明保留这种代替关系，同时不进一步限定其确切性质。
- source_word: בעבורו
  choice: 因着他
  rationale: 表达挪亚是余民得以存留的缘由，保留原文的因果关系。
- source_word: שארית
  choice: 余民得以存留
  rationale: שארית 可指灾难或审判后留下的幸存者；“余民”保留其圣经语感，“得以存留”则使中文句子自然完整。
- source_word: ובבריתו
  choice: 藉着他的约
  rationale: 将介词理解为工具或媒介用法，并保留后缀“他的”所具有的简洁性，不擅自明说立约的另一方。
- source_word: חדל מבול
  choice: 洪水止息了
  rationale: חדל 表示停止、止息；现存希伯来语见证明确支持洪水止息这一读法。
theological_decisions:
- issue: 末句在希伯来语与希腊语见证之间存在差异
  choice: 正文依现存希伯来语译作“藉着他的约，洪水止息了”
  alternative: 希腊语平行文本的末句似乎指向洪水发生或临到，而不是洪水止息
  rationale: 《便西拉智训》有希伯来语文本存留之处，以希伯来语见证为主要依据。此处开罗藏经库希伯来语文本清楚使用 חדל מבול，意为洪水止息；由于希腊语差异会实质改变句意，故在脚注中如实说明。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。“纯全无过”避免把 תמים 误解为绝对完美；“替代者”保留原词的神学张力，并以脚注列出其他可能语义。脚注标记按其实际所注释的词句重新配置。
