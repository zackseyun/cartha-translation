  text: Their remembrance will stand forever[a], and their righteousness will not be forgotten.
translation:
  language: zh_hans
  text: 他们的纪念必永存[a]；他们的义必不被忘记。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“他们的后裔必永存，他们的荣耀必不被抹去。”马萨达卷本在开罗藏经库希伯来文本文作“他们的纪念”之处，同样作“他们的后裔（种子）”。
    reason: textual_variant
lexical_decisions:
- source_word: זכרם
  choice: 他们的纪念
  rationale: זֵכֶר指人被记念、留在人心中的纪念；译作“纪念”保留希伯来文的名词形式，并与下句“不会被忘记”自然呼应。
- source_word: יעמד
  choice: 必存
  rationale: עמד本义为“站立”，此处表达长久存续。现代汉语用“存”比直译“站立”自然，同时保留其持续不衰之意。
- source_word: עד עולם
  choice: 到永远
  rationale: 这是表示永久延续的常用希伯来语短语；“到永远”在现代中文中自然、庄重。
- source_word: וצדקתם
  choice: 他们的义
  rationale: צדקה可指公义、正直或合乎义的行为。“义”直接而凝练，不把原文进一步限定为“义行”或“善行”。
- source_word: לא תשכח
  choice: 不会被忘记
  rationale: 原文为被动意义，直指其义不被遗忘；此译也保留了与上半句“纪念”的语义呼应。
theological_decisions:
- issue: 开罗藏经库希伯来文本与马萨达卷本、希腊文本的异文
  choice: 正文依现存开罗藏经库希伯来文本译为“他们的纪念必存到永远，他们的义也不会被忘记”。
  alternative: “他们的后裔必存到永远，他们的荣耀也不会被涂抹。”
  rationale: 在希伯来文本现存且可信度高时以其为正文；但马萨达卷本与希腊文本反映了内容明显不同的古老读法，因此在脚注中完整保留，不静默调和。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“必存到永远”表达原文的确定性与持久性；正文保留“纪念”与“义”的抽象名词，以免过度解释。
