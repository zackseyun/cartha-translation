  text: Let us now praise godly men[a], our fathers in their generations.
translation:
  language: zh_hans
  text: 现在，我要赞美忠信仁爱之士[a]，就是我们在他们的世代中的先祖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“现在，让我们赞美有荣光的人，以及我们在他们那一代中的先祖。”希伯来文作“忠信仁爱之士”，开头也是“我要赞美”。
    reason: 保存希伯来文与希腊文在人称、所赞美人物的描述，以及“世代”单复数上的异文。
lexical_decisions:
- source_word: אהללה נא
  choice: 现在，我要赞美
  rationale: 按现存希伯来文本，将第一人称单数意愿式直译为“我要赞美”；נא在此承接为“现在”。希腊文则作第一人称复数劝勉式“让我们赞美”，作为异文收入脚注。
- source_word: אנשי חסד
  choice: 忠信仁爱之士
  rationale: חסד兼有忠信、慈爱、恩慈等意涵；“忠信仁爱”尽量保留其复合语义，同时保持庄重自然。希腊文ἐνδόξους意为“有荣光的／显赫的”，与希伯来文有实质差异，故不并入正文。
- source_word: אבותינו
  choice: 我们的先祖
  rationale: אבותינו字面为“我们的父辈／列祖”；在回顾历代人物的语境中，“先祖”既准确又符合现代汉语。
- source_word: בדורותם
  choice: 历代
  rationale: 该词由介词ב、复数“世代”和第三人称复数后缀构成，字面为“在他们的世代中”。“历代”简洁表达这些先祖分属不同世代，并避免生硬的所有格结构。
theological_decisions:
- issue: 受赞美人物的品格：希伯来文“忠信仁爱”与希腊文“有荣光／显赫”之间的差异
  choice: 正文依从现存希伯来文，译为“忠信仁爱之士”。
  alternative: 依希腊文译为“有荣光的人”或“显赫之士”。
  rationale: 希伯来文证据可信度高，且项目以原文见证为先；希腊文可能反映不同底本或解释性翻译。两者对人物受赞美的原因呈现不同侧重，因此在脚注中保留差异。
- issue: 开头动词的人称：希伯来文单数与希腊文复数
  choice: 依希伯来文译为第一人称单数“我要赞美”。
  alternative: 依希腊文译为劝勉复数“让我们赞美”。
  rationale: 希伯来文אהללה为第一人称单数意愿式，而希腊文Αἰνέσωμεν为第一人称复数劝勉式。正文不以希腊文静默修正希伯来文，并在脚注透明呈现希腊异文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“忠信仁爱之士”保留חסד的丰富含义；为使并列宾语清楚，第二分句补出“赞美”，不增加新的命题内容。
