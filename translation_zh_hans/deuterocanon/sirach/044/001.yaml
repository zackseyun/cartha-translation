  source_fidelity: 正文依现存希伯来文将动词译为第一人称单数“我要赞美”，并以“忠信仁爱”对应 אנשי חסד，基本忠实。可是“我们历代的先祖”把 בדורותם（“在他们的世代中”）改写成修饰“先祖”的“历代”，削弱了原文所说这些人物各自在其所属世代中的位置；重复补出“赞美”也使原文一个动词所统摄的并列宾语变为两个动作，虽不致严重误解，仍无必要。
  naturalness: “现在，我要赞美……”和“忠信仁爱之士”庄重、现代且通顺。“我们的先祖，在他们的世代中”虽略带书面色彩，却能自然保留原文的句法关系及“世代”复数；避免“我们历代的先祖”这一较含混的搭配。
  terminology: “忠信仁爱”可适当地表达 חסד所含忠诚与仁爱，且未把希腊文“显赫／有荣光”混入正文。“先祖”在此为 אבותינו 的合宜语境译法。脚注应将希腊文 τῇ γενέσει 的单数明确译为“在他们那一代／世代中”，而非“我们那一代”。
