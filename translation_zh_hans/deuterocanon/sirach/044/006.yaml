  text: Men of valor[a], steadfast in strength, and at ease in their place.
translation:
  language: zh_hans
  text: 有勇力的人[a]，坚强有力，在自己的居所安然度日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“富有的人，拥有力量，在他们的聚居处安然生活。”此处以希伯来文为主，希腊文作为参照。
    reason: alternative_reading
lexical_decisions:
- source_word: אנשי חיל
  choice: 有勇力的人
  rationale: 该短语可指有力量、有才干或英勇的人。此处处于赞颂先贤的语境，“有勇力的人”保留其褒义和较宽的含义，不把它局限为军中勇士或富人。
- source_word: וסמכי כח
  choice: 力量坚定
  rationale: סמכי 的表达略带歧义，可含坚立、受支撑之意；与 כח 连用时，译为“力量坚定”既自然，也保留其稳固有力的形象，避免硬译成“力量的支柱”。
- source_word: ושוקטים
  choice: 安享太平
  rationale: 该分词表示安静、安稳或平静生活；希腊文 εἰρηνεύοντες 也支持和平安居的含义。“安享太平”符合此处对先贤安定生活的描写。
- source_word: על מכונתם
  choice: 在自己的居所
  rationale: מכונה 可指固定之处、根基或安置之所。结合希腊文“在他们的聚居地”，此处译作“自己的居所”最符合具体的安居语境，同时仍保留其固定、安顿的意味。
