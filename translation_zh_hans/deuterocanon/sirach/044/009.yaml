  yaml_path: translation/deuterocanon/sirach/044/009.yaml
  text: And there are some for whom there is no remembrance[a], they ceased to be, just as they had ceased, as though they had never existed, and so did their children after them.
translation:
  language: zh_hans
  text: 有些人无人记念[a]；他们消逝了，仿佛从未存在过；他们的儿女在他们之后也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来语见证较短，直译为：“有些人无人记念；他们停止了，如同他们停止了。”希腊语平行文本保存了较完整的表述：“他们消逝了，仿佛从未存在过……他们的儿女在他们之后也是如此。”正文以希伯来语为主要依据，并采用希腊语来阐明其压缩的措辞。
    reason: textual_variant
lexical_decisions:
- source_word: ויש מהם
  choice: 有些人
  rationale: 这一希伯来语表达从前文所说的先人中引出一部分人；“有些人”简洁自然，并保留其部分含义。
- source_word: אשר אין לו זכר
  choice: 无人记念
  rationale: זכר在此指记忆或纪念。“无人记念”既表达他们不再被人记得，也不把词义限定为有形的纪念物。
- source_word: וישבתו
  choice: 他们消逝了
  rationale: 源自动词שבת，重点是停止、不复存留。结合希腊语平行文本的ἀπώλοντο，“消逝了”可自然表达他们从人世和记忆中不复存在，而不暗示暴力死亡。
- source_word: כאשר שבתו
  choice: 仿佛从未存在过
  rationale: 现存希伯来语措辞高度压缩，直译近于“他们停止了，如同他们停止了”。希腊语平行文本“仿佛未曾存在”很可能保存或阐明了这一省略表达的含义，因此正文采用其较完整、自然的表述，并以脚注注明文本差异。
- source_word: καὶ τὰ τέκνα αὐτῶν μετʼ αὐτούς
  choice: 他们的儿女在他们之后也是如此
  rationale: 这一分句见于完整的希腊语平行文本而不见于所给希伯来语见证；译文保留它，以反映该节较完整的古代文本形态，同时用脚注明确交代。
