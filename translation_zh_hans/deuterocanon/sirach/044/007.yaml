  text: All these were honored in their generations[a], and in their days they were a glory.
translation:
  language: zh_hans
  text: 这些人都在各自的世代受尊崇；在他们的日子里，他们乃是荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文后半句是紧凑的无动词名词句，直译近于“在他们的日子里，他们的荣耀”。希腊文作“在他们的日子里〔有〕可夸耀之事／荣耀”。正文按现代汉语表达其含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אלה
  choice: 这些人
  rationale: 这是对上文所列人物的概括。“这些人”符合现代汉语表达；原文虽未明说“人”，但上下文所指明确。
- source_word: בדורם
  choice: 在各自的世代
  rationale: דור意为“世代、时代”，后接复数所属后缀。译作“各自的世代”既体现这些人物分属不同时期，也与希腊文复数γενεαῖς相符。
- source_word: ומימיהם
  choice: 在他们的时代
  rationale: 此处מימי结合语境最自然地表示时间，即“在他们的日子里”；希腊文ἐν ταῖς ἡμέραις αὐτῶν也支持这一理解。汉语用“在他们的时代”较自然庄重。
- source_word: תפארתם
  choice: 成为荣耀
  rationale: תפארת可指“荣耀、光彩、华美”。希伯来文是紧凑的无动词名词句，译作“成为荣耀”使中文完整自然，并保留这些人物在其时代本身就是荣耀这一含义。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“备受尊崇”表达人物在所属世代中享有荣誉；“成为荣耀”保留原文名词句的赞誉色彩及其一定程度的含混性。
