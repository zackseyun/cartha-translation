  text: who kept the commandments of the Most High and entered into covenant with him[a]. In his flesh he cut for him a statute[b], and in testing he was found faithful.
translation:
  language: zh_hans
  text: 他遵守至高者的诫命，与至高者立了约。他在自己的肉身上[b]为他刻下了一条定例[a]；在考验中，他被证明是忠信的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“他在自己的肉身上与他立了约。”希伯来文在此作“定例”。
    reason: alternative_reading
  - marker: b
    text: “在自己的肉身上”很可能指割礼，就是亚伯拉罕之约在身体上的记号。
    reason: cross_reference
lexical_decisions:
- source_word: שמר מצות עליון
  choice: 遵守至高者的诫命
  rationale: שמר与“诫命”连用，表示忠实遵行；“至高者”保留神圣称号及庄重语体。
- source_word: ובא בברית עמו
  choice: 与他立了约
  rationale: 希伯来文直译近于“进入与他的约”；现代汉语以“与他立了约”自然表达进入盟约关系，同时不额外解释双方角色。
- source_word: בבשרו
  choice: 在自己的肉身上
  rationale: 保留具体的身体用语，并以“上”贴合割礼在身体留下记号的语境，但不在正文中明说割礼。
- source_word: כרת לו חק
  choice: 为他刻下定例
  rationale: חק意为“定例”，故依希伯来文而不采用希腊文的“约”；“刻下”既保留כרת“切割”的具体意象，也比生硬的“割定例”更符合汉语，并与肉身语境相连。
- source_word: בניסוי נמצא נאמן
  choice: 经受考验时，显明是忠信的
  rationale: ניסוי指试验、考验而非诱惑；נמצא נאמן直译为“被发现是忠信的”，“显明是忠信的”在现代汉语中自然，并保留经验证实的含义。
theological_decisions:
- issue: 肉身措辞是否明确解释为亚伯拉罕受割礼
  choice: 正文保留“在自己的肉身上”的含蓄表达，脚注说明可能指割礼
  alternative: 正文译作“他在肉身上领受割礼，作为立约的记号”
  rationale: 上下文所指是亚伯拉罕，但本节本身采用简练暗示；不应把合理解释直接扩写进正文。
- issue: 希伯来文与希腊文在第三分句的差异
  choice: 正文依存世希伯来文译作“定例”，脚注保留希腊文“约”的异读
  alternative: 依希腊文译作“他在自己的肉身上与他立了约”
  rationale: 现存希伯来文在此处优先，但希腊文的实质性差异具有文本价值，须公开注明，不宜默默调和。
- issue: כרת在肉身与盟约语境中的双重意象
  choice: 译作“刻下”，保留切割意象而不直译成不自然的汉语
  alternative: 译作“设立”或“割下”
  rationale: “设立”流畅却淡化原文切割动作；“割下定例”则不合现代汉语。“刻下”兼顾动作感、肉身记号和可读性，同时没有把“定例”改成“约”。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“至高者”“诫命”“立约”“忠信”等词保留智慧文学和盟约语境；正文维持原文的简练与含蓄，文本差异及割礼所指均置于脚注。
