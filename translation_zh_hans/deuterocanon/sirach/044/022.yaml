  text: And in Isaac he established[a], because of Abraham his father, a covenant with every firstborn[b], and the blessing rested on the head of Israel.
translation:
  language: zh_hans
  text: 他也为以撒兴起了一个儿子[a]，这是因他父亲亚伯拉罕的缘故。他把一切长子之约赐给他[b]；福分临到以色列的头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“他在以撒身上，借着他父亲亚伯拉罕，确立了万民的福分和约。”希腊文本没有“为以撒兴起了一个儿子”，与希伯来文本的句法和内容有明显差异。
    reason: textual_variant
  - marker: b
    text: 希伯来文“一切长子之约”的含义和句法艰涩。希腊文本此处读作“万民的福分和约”，见证了显著不同的文本传统。
    reason: alternative_reading
lexical_decisions:
- source_word: וגם ליצחק הקים בן
  choice: 他也为以撒兴起了一个儿子
  rationale: 按现存希伯来文直译：ליצחק 表示“为以撒”，הקים בן 表示“兴起一个儿子”。虽然希腊文本的句法和内容不同，但不宜在正文中无标记地删去希伯来文明确存在的“儿子”。
- source_word: בעבור אברהם אביו
  choice: 这是因他父亲亚伯拉罕的缘故
  rationale: בעבור 可表示“因为”或“为了……的缘故”；此处采用自然且保留因由意味的现代汉语。代词“他”按上下文指以撒。
- source_word: ברית כל ראשון
  choice: 与一切长子所立的约
  rationale: 希伯来短语字面艰涩，但 ברית 是“约”，כל ראשון 按通常词义可理解为“一切长子”。用“与……所立的约”使汉语关系清楚，同时在脚注交代希腊异文。
- source_word: נתיו
  choice: 他把……赐给他
  rationale: 此形式看来表达“他赐给他”；正文明确译出施予动作及间接受词，不把它并入前句而省略。
- source_word: וברכה נחה על ראש ישראל
  choice: 福分临到以色列的头上
  rationale: נחה 有“停留、安歇、临到”之意；“临到……头上”既保留希伯来意象，也符合庄重的现代汉语。保留“以色列”这一名称，不限定其只指雅各个人或其后裔群体。
theological_decisions:
- issue: “以色列”的所指
  choice: 保留“以色列”，不加解释性限定
  alternative: 明确译为“雅各”或“以色列民”
  rationale: 祖先颂的次序使它首先让人想到族长雅各／以色列，但措辞也可引出其后裔民族的含义；正文保留这种双重回响。
- issue: 希伯来文“儿子”与希腊平行文本的差异
  choice: 正文依高可信度的希伯来文保留“儿子”，脚注列出希腊异文
  alternative: 按希腊文重构为“在以撒身上确立……万民的福分和约”
  rationale: 指定的主要原文证据是希伯来文，且“儿子”在其句法中可通；希腊文本则见证显著不同的文本传统。将两者主次分明地呈现，避免无声调和。
- issue: “与一切长子所立的约”的解释
  choice: 保留希伯来文的困难读法
  alternative: 依希腊文译作“万民的福分和约”
  rationale: 希伯来文此处意义和句法均不寻常，但不应凭神学预设改成更普世化的表述；脚注提供重要异文供读者判断。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“兴起一个儿子”“临到……头上”保留原文的圣经意象；对两处重要文本差异均以脚注公开说明，不在正文中暗自调和。
