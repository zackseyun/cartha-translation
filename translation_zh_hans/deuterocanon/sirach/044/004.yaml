translation:
  language: zh_hans
  text: 各国的领袖善于谋划，统治者精于考察[a]；言谈睿智，著述有方[b]；治理者在各自的职守中施行治理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本在这一分句与希伯来文略有不同，着重于治理民众所需的理解力和文书才干。本译文以希伯来文为主要依据，译作“精于考察”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文抄本在这里略有异文：开罗藏经库抄本作“在他们的书写（或著述）中”，马萨达古卷则支持意思相近的“在他们的书卷中”。两者都指向书写或著述方面的智慧。
    reason: textual_variant
lexical_decisions:
- source_word: שרי גוים
  choice: 各国的领袖
  rationale: שרי 指首领或高级官员，גוים 指列国或各民族；译为“各国的领袖”自然地保留其政治范围。
- source_word: במזמתם
  choice: 善于谋划
  rationale: מזמה 可指谋划、计策或筹议；本节为褒扬语境，采用中性正面的“谋划”，也与希腊文所表达的商议相合。
- source_word: ורוזנים
  choice: 统治者
  rationale: רוזנים 指显贵或掌权者；“统治者”突出其治理权柄，并与前句形成平行。
- source_word: במחקרותם
  choice: 精于考察
  rationale: 该词源于查究、探求的语义范围；“考察”保留主动探究的意味，不将其简化为静态的“理解”。
- source_word: חכמי שיח
  choice: 言谈有智慧的人
  rationale: 直译为“言谈方面的智者”；此译既保留对言语、论说能力的强调，也符合现代汉语表达。
- source_word: בספרתם
  choice: 借著述显明才智
  rationale: 该读法指向书写或著述活动；“借著述”表达其才智藉文字呈现。因希伯来语省略了重复的“智慧”，译文补出“才智”，使并列结构在汉语中完整清楚。
- source_word: ומושלים במשמרותם
  choice: 治理者各尽职守
  rationale: מושלים 指施行治理的人，משמרותם 可指其值守、职责或受托岗位；“各尽职守”自然表达他们在所受托职责中的治理，避免将其限定为军事守望。
