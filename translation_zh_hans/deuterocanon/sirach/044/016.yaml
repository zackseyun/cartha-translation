  text: Enoch was found blameless, and he walked with the LORD, and he was taken away—an example of knowledge for generation after generation.
translation:
  language: zh_hans
  text: 以诺被认定为纯全；他与耶和华同行，后来被接去，给世世代代作认识的记号。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“给各世代作悔改的榜样。”
    reason: 希伯来文“认识的记号”与希腊平行文本“悔改的榜样”存在显著文本差异，宜向读者说明。
lexical_decisions:
- source_word: נמצא תמים
  choice: 被认定为纯全
  rationale: 保留 נמצא 的被动/认定意味，并以“纯全”表达 תמים 在品格上的完整无可指摘，避免译成绝对无罪。
- source_word: והתהלך עם יהוה
  choice: 他与耶和华同行
  rationale: 按希伯来文直译，呼应《创世记》中以诺与神同行的措辞；יהוה 译作“耶和华”，清楚保留专名。
- source_word: ונלקח
  choice: 后来被接去
  rationale: 保留无施事者的被动表达，不擅自补出目的地或明确说明死亡与否。
- source_word: אות דעת
  choice: 认识的标志
  rationale: אות 通常为“标志、记号”；דעת 直译为“认识/知识”。原短语含义不寻常，正文保留其张力，不依希腊文改成“悔改的榜样”。
- source_word: לדור ודור
  choice: 世世代代
  rationale: 自然表达逐代延续的希伯来习语。
theological_decisions:
- issue: 以诺的“纯全”是否表示无罪
  choice: 纯全
  alternative: 无可指责／无罪
  rationale: “纯全”保留 תמים 的完整、正直意味，同时不把经文扩大为绝对无罪的教义断言。
- issue: אות דעת 与希腊平行文本的差异
  choice: 认识的标志
  alternative: 各世代悔改的榜样
  rationale: 高可信度的希伯来文本读作“认识的标志”，应作为正文依据；希腊文“悔改的榜样”属于重要异文，以脚注说明而不混入正文。
- issue: 被接去的施事者与含义
  choice: 被接去
  alternative: 被神接走／不经历死亡而被接走
  rationale: 希伯来文使用未明说施事者的被动式；译文不补充原文没有明说的神学细节。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“被认定为纯全”略带经文语体，但仍易懂；分号和逗号呈现希伯来文连续叙述，破折号式同位关系改用“成为”使中文自然。
