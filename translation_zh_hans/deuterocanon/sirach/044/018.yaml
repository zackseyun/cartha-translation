  text: An everlasting covenant was cut with him[a], that all flesh might not be destroyed.
translation:
  language: zh_hans
  text: 与他订立了永恒之约[a]，免得一切有血肉的都被毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“免得一切有血肉的都被洪水除灭。”这明确指出了挪亚与洪水的背景。
    reason: alternative_reading
lexical_decisions:
- source_word: באות עולם נכרת עמו
  choice: 与他立下了永远的约
  rationale: 所给希伯来文本写作“באות עולם”，字面涉及“永远的记号”，但“נכרת עמו”使用了希伯来语“立约”（字面为“切约”）的固定表达，希腊平行文本也明确作“永远的约”。中文若直译为“切”会造成误解，因此采用自然且庄重的“立下了永远的约”。
- source_word: לבלתי השחית
  choice: 使……都不致灭亡
  rationale: לבלתי引出否定的目的或结果；“不致”保留这种语义张力。השחית在这里表示遭毁灭，译作“灭亡”简洁自然。
- source_word: כל בשר
  choice: 一切有血肉的
  rationale: 该词组并不限于人类，在洪水语境中广指有血肉的生灵。“一切有血肉的”既保留希伯来表达，也避免缩窄为“全人类”。
theological_decisions:
- issue: 是否按希腊平行文本在正文中明确提到洪水
  choice: 正文依从现存希伯来文本，不增添“被洪水”
  alternative: 使一切有血肉的都不致被洪水抹去
  rationale: 希伯来文本只说不被毁灭，希腊文本则加入κατακλυσμῷ（“被洪水”），明确挪亚语境。正文优先保留希伯来文本较宽泛的说法，希腊异文置于脚注。
- issue: באות עולם与立约惯用语之间的文本张力
  choice: 结合נכרת的立约惯用语及希腊平行文本，译为“永远的约”
  alternative: 以永远的记号与他立约
  rationale: 所提供的希伯来读法字面可涉及“记号”，但句法不寻常；上下文中的נכרת以及希腊“永远的约”支持约的含义。为避免掩盖证据差异，在翻译说明中记录此处张力，不把“记号”强行加入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立下……约”符合中文圣经语体，又不机械复制希伯来语“切约”的字面形式；“一切有血肉的”保留原文范围，不擅自限定为人类。
