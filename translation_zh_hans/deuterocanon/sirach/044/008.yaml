  text: Some of them left behind a name[a], to be praised among their inheritance.
translation:
  language: zh_hans
  text: 他们中有些人留下了名声，在他们的产业中受人赞颂。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”也可指他们的后裔或所留下的传承。希腊文平行文本则着重于述说他们的赞美。
    reason: 说明希伯来文“产业”的可能所指，并交代希腊文平行文本对末句的不同表达。
lexical_decisions:
- source_word: יש מהם
  choice: 他们中有些人
  rationale: 这是从前述先祖中提出一部分人的分举表达；译法自然，并保留“其中有些”的范围。
- source_word: הניחו
  choice: 留下了
  rationale: 此动词表示使某物在身后存留；与“名声”搭配，指人在世后仍留下纪念。
- source_word: שם
  choice: 名声
  rationale: שם字面是“名”，在这里指身后留存的名望或声誉。中文“留下了名声”既传达其语境含义，也保留“名”的意象。
- source_word: להשתענות
  choice: 受人赞颂
  rationale: 希伯来语词形和确切含义较难确定，但语境指带着赞誉被提说；希腊语平行文本“述说赞美”也支持赞颂这一语义范围。采用被动表达，不把它过度限定为某一种讲述行为。
- source_word: בנחלתם
  choice: 在自己的产业中
  rationale: 按希伯来语保留“产业”这一具体意象及其处所关系；在本节中，它也可能延伸指后裔或所传承的群体，故以脚注说明而不在正文中单一化。
theological_decisions:
- issue: “名声”与“产业”的纪念性语言
  choice: 保留“留下名声”和“产业”的具体意象
  alternative: 他们中有些人留下美名，使后代述说他们的赞誉。
  rationale: 本节虽非教义争议焦点，但希伯来文以“名”和“产业”构成富有圣经色彩的身后纪念语言。正文不直接改写为“美名”和“后代”，以免消除“产业”也可指承受之业或传承范围的含混；脚注同时交代希腊文较明确的“述说赞美”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“受人赞颂”表达纪念性的称誉；“自己的产业”刻意保留希伯来文意象，相关歧义由脚注说明。
