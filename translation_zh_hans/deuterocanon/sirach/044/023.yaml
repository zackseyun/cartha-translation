base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/023.yaml
  text: He established him with a blessing[a], and gave him his inheritance; he set him over the tribes, as twelve divisions.
translation:
  language: zh_hans
  text: 他以祝福坚立他，把他的产业赐给他；又把他安置在众支派中，使之分作十二支。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句的句法十分简略，近于“把他安置于／为众支派，以分十二”，其代词和“分”的宾语均未明说。希腊平行文本较明确地说：“他划分他的份额，在支派中分作十二。”
    reason: 说明希伯来文的压缩与含混，并交代希腊平行文本所支持的十二支派分列之理解。
lexical_decisions:
- source_word: ויכוננהו
  choice: 坚立他
  rationale: 使役形式源于כון，表示使之稳固、确立；“坚立”既贴近原文，也符合庄重而自然的经文语体。
- source_word: בברכה
  choice: 以祝福
  rationale: 介词ב在此可表达凭借或伴随；“以祝福”保留其方式或工具色彩，不限定为单一解释。
- source_word: נחלתו
  choice: 他的产业
  rationale: נחלה指承受所得的产业或分得之地；“产业”适合本节有关支派与分配的语境，也保留继承所得的含义。
- source_word: ויציבהו
  choice: 又将他立为
  rationale: 源于יצב，意为使站立、设立或安置；结合后面的לשבטים，译作“立为”可自然表达设立的结果，同时避免额外加入统辖含义。
- source_word: לשבטים
  choice: 众支派
  rationale: ל可表示成为、归于或关乎；这里采用结果性的“立为众支派”，让雅各与由他而出的支派保持联系，但不补入原文没有明说的角色。
- source_word: לחלק שנים עשר
  choice: 分成十二支
  rationale: 希伯来文高度压缩，直译近于“分十二”；结合שבטים及希腊平行文本，补出结果表达“分成十二支”，以现代汉语清楚传达十二支派的结构。
theological_decisions:
- issue: 本节阳性单数代词所指
  choice: 正文保留“他”，按上下文指雅各／以色列理解，但不在正文中补出姓名。
  alternative: 直接译作“雅各”，或笼统理解为领受祝福的族长。
  rationale: 希伯来文本本行只用代词，希腊平行文本明确提到雅各，周围语境也支持这一所指；保留代词既忠于希伯来文的省略，也不消除文本本身的含蓄。
- issue: 雅各与十二支派之间的关系
  choice: 译作“将他立为众支派，分成十二支”，表达支派由他而出的整体—分支关系。
  alternative: 译作“使他管理众支派”或“把他的份分给十二支派”。
  rationale: 希伯来文没有明确的统治动词，也省略了“分”的宾语；所选译法避免引入权柄概念，同时借助希腊平行文本说明十二支派的分列。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚立”“产业”“支派”保留经文语域；正文不补出“雅各”或“管理”等解释性成分，并用脚注交代末句的句法含混。
