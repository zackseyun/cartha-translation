  text: Their bodies were gathered in peace[b][a], and their name lives from generation to generation.
translation:
  language: zh_hans
  text: 他们的遗体安然被收聚[b][a]；他们的名世世代代长存。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他们的遗体安然被埋葬。”希腊文将丧葬的含义说得更明确；希伯来文则说“安然被收聚”。
    reason: alternative_reading
  - marker: b
    text: 马萨大抄本在此保留较短异文：“若／在平安中，他们被收聚”；开罗藏经库抄本则作“他们的遗体安然被收聚”。
    reason: textual_variant
lexical_decisions:
- source_word: גויתם
  choice: 他们的遗体
  rationale: גויה在此指死者的身体；“遗体”自然、庄重，也明确保留丧葬语境。希腊文以单数集合形式表达，但希伯来文在上下文中宜译为复数意义。
- source_word: בשלום
  choice: 安然
  rationale: 保留“在平安中”的核心含义，同时与现代汉语中的“归聚”自然搭配；没有把它弱化为仅仅“平静地”。
- source_word: נאספו
  choice: 归聚
  rationale: 希伯来语אסף的被动式在此含死亡语境中的“被收聚”之意，但原文没有明说“埋葬”。“归聚”既保留该意象，也让读者听出死亡的委婉意味。
- source_word: ושמם
  choice: 他们的名
  rationale: 直译“名”，保留圣经语言中名声、声望与纪念长存的丰富意涵，而不局限为现代抽象词“名誉”。
- source_word: חי
  choice: 长存
  rationale: 原义为“活着”。汉语若说“他们的名活着”较生硬；“长存”自然表达其拟人化的持续生命力，并与跨世代的下句相合。
- source_word: לדור ודור
  choice: 世世代代
  rationale: 这是希伯来语表示一代接一代延续的惯用语；“世世代代”是自然、庄重且为普通读者熟悉的现代汉语表达。
theological_decisions:
- issue: 是否按希腊文“被埋葬”明确解释希伯来文的死亡委婉语
  choice: 正文以希伯来文为准，译作“安然归聚”
  alternative: 他们的遗体安葬于平安之中
  rationale: 现存希伯来文应作为正文依据。希腊文ἐτάφη明确表示“被埋葬”，可确认丧葬语境，却不应取代希伯来文较含蓄的“被收聚”；因此把希腊文的明确说法收入脚注。
- issue: 是否把“他们的名活着”严格逐字翻译
  choice: 译作“他们的名世世代代长存”
  alternative: 他们的名世世代代活着
  rationale: “活着”保留拟人效果但在现代汉语中明显生硬；“长存”准确传达名字持续有生命、被后世记念的意思，又不额外限定为某种关于死后生命的教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“遗体”明确丧葬语境；“归聚”刻意保留希伯来文的委婉和意象，不在正文中直接改成希腊文较明确的“埋葬”。脚注标记依英文审校层的顺序置于相关短语之后。
