  text: Abraham[a], father of a multitude of nations—no blemish was found in his honor.
translation:
  language: zh_hans
  text: 亚伯拉罕是众多民族之父；他没有使自己的尊荣蒙上瑕疵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“在尊荣上，无人能与他相比。”其中“尊荣”也可译作“荣耀”。
    reason: 希腊文平行文本的末句与希伯来文有实质差异，需保留其异读。
lexical_decisions:
- source_word: אב
  choice: 父
  rationale: 希伯来文直接称亚伯拉罕为“父”，希腊文 πατήρ 也相同；不改作较宽泛的“祖先”或“先祖”。
- source_word: המון גוים
  choice: 众多民族
  rationale: המון 表示众多、群体，גוים 表示民族或列国；“众多民族”自然清楚，也保留亚伯拉罕应许中“多国之父”的呼应，而不把范围扩大成“所有民族”。
- source_word: לא נתן
  choice: 从未使……蒙上
  rationale: 字面为“没有给／置入”，与后面的“瑕疵”连用时，译作“从未使……蒙上”既保留亚伯拉罕主动不玷污自身尊荣的语气，又符合现代汉语表达。
- source_word: בכבודו
  choice: 自己的尊荣
  rationale: כבוד 可指尊荣、荣耀或荣光；此处与“瑕疵”搭配，“尊荣”最能表达名誉与品格未受损的意思。反身性的“自己的”明确了希伯来文第三人称单数所属后缀。
- source_word: מום
  choice: 瑕疵
  rationale: מום 通常指身体或礼仪上的残缺、缺陷，也可引申为污点；“瑕疵”保留原词形象，并适合此处关于尊荣的语境。
theological_decisions:
- issue: 希伯来文与希腊文末句的差异
  choice: 正文依据现存希伯来文，译为亚伯拉罕未使自己的尊荣蒙上瑕疵。
  alternative: 希腊文作“在尊荣（或荣耀）上，无人能与他相比”。
  rationale: 现存希伯来文含“瑕疵”一词，并以 לא נתן 表达“没有给／置入”；希腊文则说“没有找到相似者”，两者表达实质不同。正文以希伯来文为先，脚注保留希腊文异读，不作无声调和。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众多民族之父”保留盟约应许的回声；分号呈现两句并列的赞誉。脚注标记置于相关末句之后。
