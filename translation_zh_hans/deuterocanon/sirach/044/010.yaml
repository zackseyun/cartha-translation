  text: But these were men of mercy, whose righteous deeds[b] were not forgotten;
translation:
  language: zh_hans
  text: 但这些人是有怜悯的人；他们的义行[b]没有被遗忘。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文本在此难解，且似乎与本节不相配；较为直译可作：“仿佛他们未曾存在，他们却曾存在，他们的子孙也在他们之后。”正文依从本节文意连贯的希腊文平行文本。
    reason: textual_variant
  - marker: b
    text: “义行”也可译作“正义的行为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ / כאשר
  choice: 但这些人
  rationale: 现存希伯来文在此难解且疑似错置；希腊文以转折语承接上文，故译作“但这些人”，同时以脚注说明文本问题。
- source_word: ἄνδρες ἐλέους
  choice: 有怜悯的人
  rationale: 希腊文直指一群以怜悯为特征的人；“有怜悯”自然、庄重，也保留原文的品格描述。
- source_word: δικαιοσύναι
  choice: 义行
  rationale: 复数形式在此侧重具体的正义或公义行为；“义行”简洁地保留其行动层面的含义。
- source_word: οὐκ ἐπελήσθησαν
  choice: 没有被遗忘
  rationale: 这是希腊文动词的直接含义，并与上节关于无人记念的叙述形成对照。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本之间的张力
  choice: 正文依从文意连贯、与上下文衔接自然的希腊文平行文本，并以脚注交代希伯来文异读。
  alternative: 按现存希伯来文近似直译为：“仿佛他们未曾存在，他们却曾存在，他们的子孙也在他们之后。”
  rationale: 希伯来文通常应优先采用，但此处所存文字本身难解，且似乎与本节位置不合；希腊文则形成完整、连贯的句意。正文不强行采用疑似错置的读法，同时不隐去原始见证之间的不一致。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“有怜悯”避免生硬直译为“怜悯之人”；“义行”兼顾简洁与原文复数所表达的具体行为。
