  to: 他们的福祉随着后裔而长存[a]；他们的产业归给子子孙孙。
  rationale: 修订使第一分句在现代标准汉语中明确表达福祉与后裔相伴延续的关系，同时保留טוב的宽泛含义及נאמן的持久、稳固意味。脚注继续说明希腊本和马萨达见证的盟约取向，并以自然汉语表达希腊文平行句中由前句承接的谓语。
