  terminology: טובם译为“福祉”能保留“好处、福泽、兴盛”的宽泛范围，避免“福分”在现代汉语中较易带出特定宗教恩赐意味。נחלתם译“产业”合适。“子子孙孙”是对“儿子的儿子们”的自然泛称。脚注中希腊文第二分句不应无依据补出“而立”；可在汉语中以“得以立定”使由首句动词带出的平行关系明晰。
