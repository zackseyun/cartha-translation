  text: With their offspring their good endures faithfully[a], and their inheritance is for their children's children.
translation:
  language: zh_hans
  text: 他们的福祉随着后裔而长存[a]；他们的产业归给子子孙孙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊本作：“他们的后裔立于诸约中；他们的儿女也因着他们得以立定。”较早的马萨达希伯来文见证也反映以盟约为中心的读法，而开罗藏经库希伯来文本则作“他们的福祉……他们的产业”。
    reason: alternative_reading
lexical_decisions:
- source_word: עם זרעם
  choice: 与后裔同在
  rationale: עם表示伴随、同在；זרע在此指子孙后裔。此译保留希伯来文紧凑的关联结构，又符合现代汉语表达。
- source_word: נאמן טובם
  choice: 他们的福分……稳固长存
  rationale: 原文词序直译近于“他们的好处是稳固的”。טוב涵盖福祉、好处与兴盛，译作“福分”保留其宽泛正面含义；נאמן表示可靠、稳固或持久，译作“稳固长存”使省略式名词句在汉语中清楚自然。
- source_word: ונחלתם
  choice: 他们的产业
  rationale: נחלה可指产业、继承所得或传承下来的基业；“产业”既保留可继承之物的含义，也避免把它限定为抽象传统。
- source_word: לבני בניהם
  choice: 留给子子孙孙
  rationale: 字面为“给他们儿子的儿子们”，是跨世代后裔的惯用表达。“子子孙孙”自然、庄重，也不把所指不必要地限于男性。
theological_decisions:
- issue: 开罗藏经库希伯来文本与希腊本及较早马萨达见证的差异
  choice: 正文依现存且可信度高的希伯来文，表达福分与产业在后裔中延续。
  alternative: 按希腊本译为“他们的后裔在诸约中站立，他们的儿女也因他们而立”；马萨达见证同样偏向盟约主题。
  rationale: 项目以现存希伯来文为主要依据。希腊本和较早的马萨达见证保存了重要异文，但不应无声取代此处完整可译的开罗藏经库文本，因此在脚注中说明。
- issue: טובם的语义范围
  choice: 福分
  alternative: 美善；福祉；兴盛
  rationale: “福分”可同时容纳祖先留下的好处、福祉和兴盛，不把经文狭义化为道德品质或物质财富。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“稳固长存”传达נאמן的可靠与持久；分号呈现两个平行分句。脚注标记[a]已置于相关异文所涉及的第一分句之后。
