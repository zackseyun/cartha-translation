translation:
  language: zh_hans
  text: 探究合乎规范的诗歌[a]，以文字记载箴言[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “合乎规范”的希伯来原文含义不甚明确，也可理解为诗歌具有一定的章法。希腊语平行文本作“探求乐曲”，支持这里所说的是经过编排、创作的诗歌。
    reason: lexical_alternative
  - marker: b
    text: “箴言”也可译作“格言”或“智慧之言”；希腊语平行文本用词较宽泛，意为“言辞”或“诗句”。
    reason: alternative_reading
lexical_decisions:
- source_word: חוקרי
  choice: 探究
  rationale: חקר表示深入查考、探寻；分词形式描述这类人持续从事的活动。“探究”兼顾主动寻索与钻研之意，亦与希腊语ἐκζητοῦντες相符。
- source_word: מזמור
  choice: 诗歌
  rationale: מזמור可指歌、诗歌或诗篇。此处谈论文化与文学成就，“诗歌”比“诗篇”更宽泛，也避免无根据地限定为礼仪或正典作品；希腊语平行文本的μέλη也支持歌唱作品之意。
- source_word: על חוק
  choice: 依定规而作
  rationale: חוק通常指规定、定例或固定秩序。置于诗歌创作的语境中，可能指遵循一定章法或规范；“依定规而作”保留其规范性，又不把它误解为法律条文。原文短语含义不甚确定，故加脚注说明。
- source_word: נושאי
  choice: 承载
  rationale: נשא本义为承担、携带。这里与“箴言”和“文字”连用，“承载”既保留希伯来语意象，也自然表达把箴言落实、保存于书面形式中的意思。
- source_word: משל
  choice: 箴言
  rationale: משל可指箴言、格言、譬喻等。在智慧文学语境中，“箴言”是最自然的对应；但希腊语ἔπη范围更广，因此以脚注注明另一读法。
- source_word: בכתב
  choice: 以文字
  rationale: בכתב直指“以书写形式”或“在文字中”。“以文字承载”是简洁自然的中文表达，也得到希腊语ἐν γραφῇ的支持。
