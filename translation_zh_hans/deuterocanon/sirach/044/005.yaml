translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。经文保持希伯来语两个并列分词短语的简练风格；“依定规而作”避免擅自把难解短语具体化为格律、旋律或法律，“以文字承载”则保留נשא的承载意象。所有脚注标记均置于相应主文之后。
