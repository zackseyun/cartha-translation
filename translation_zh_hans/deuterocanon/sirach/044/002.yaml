  text: The Most High apportioned abundant honor[c][b][a], and his greatness is from everlasting.
translation:
  language: zh_hans
  text: 至高者分赐了丰厚的尊荣[a][b]；他的伟大自亘古以来就存在[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开罗藏经库希伯来文抄本作“חלק”；较早的马萨达卷本作“חולק”，支持“至高者分赐／分配”的意思。希腊文平行文本则作“主创造了大量荣耀”。
    reason: textual_variant
  - marker: b
    text: “尊荣”也可译作“荣耀”。希伯来文“כבוד”和希腊文“δόξα”依语境均可表达这两层意思。
    reason: lexical_alternative
  - marker: c
    text: “自亘古以来”也可译作“自古以来”或“自永恒以来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רב
  choice: 丰厚的
  rationale: 在“רב כבוד”中表示尊荣在程度或数量上的丰盛；“丰厚的尊荣”符合现代汉语表达，也保留原文的强调。
- source_word: כבוד
  choice: 尊荣
  rationale: כבוד可指“尊荣”或“荣耀”。本节处于称颂先贤的语境，并与“分赐”搭配，因此正文采用“尊荣”；“荣耀”作为可能译法列入脚注。
- source_word: חלק / חולק
  choice: 分赐了
  rationale: 开罗藏经库抄本作חלק，较早的马萨达卷本作חולק；后者明确支持以“至高者”为主语的动词性理解。“分赐”既表达分配之意，也适合上帝赐予尊荣的语境。
- source_word: עליון
  choice: 至高者
  rationale: 这是对上帝的称号；“至高者”是庄重、自然且通行的现代汉语译法。
- source_word: וגדלו
  choice: 他的伟大
  rationale: 后缀自然理解为第三人称单数所有格；希腊文τὴν μεγαλωσύνην αὐτοῦ也支持“他的伟大”。“威严”亦可能，但“伟大”较贴近希伯来文和希腊文。
- source_word: מימות עולם
  choice: 自亘古以来
  rationale: 该短语可指远古或永恒。以至高者的伟大为所述对象时，“自亘古以来”既保留时间范围的张力，也不强行限定为严格的哲学性永恒。
theological_decisions:
- issue: 上半句的主语与句法
  choice: 以“至高者”为主语：“至高者分赐了丰厚的尊荣。”
  alternative: “主创造了许多荣耀”；或“至高者的份是极大的尊荣”
  rationale: 现存希伯来文应居首要地位，而较早的马萨达见证חולק有力支持动词性句法，即“至高者分赐”。希腊文使用“创造”，可能反映异文或解释性翻译，故在脚注中说明而不取代希伯来文正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“分赐”保留分配与赐予的双重意味；分号呈现两个分句的并列关系。正文不把“מימות עולם”过度限定为单一的时间观，而在脚注中保留“远古”与“永恒”两种可能。
