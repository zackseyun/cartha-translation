base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/021.yaml
  text: Therefore he confirmed it to him with an oath that nations would be blessed in his offspring[a], and that he would give them as an inheritance from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: zh_hans
  text: 所以，他以誓言向他作了保证：万国必因他的后裔而蒙福[a]；他要使他们承受产业，从海到海[b]，从大河直到地极[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后裔”原文为集合意义的单数词，也可直译为“种子”。
    reason: lexical_ambiguity
  - marker: b
    text: 现存希伯来文本字面作“从水到海”；希腊语平行文本作“从海到海”，较可能保存了这里原有的疆域公式，正文从后者。
    reason: textual_variant
  - marker: c
    text: “大河”是圣经疆域应许用语，通常指幼发拉底河。
    reason: cross_reference
lexical_decisions:
- source_word: על כן
  choice: 所以
  rationale: 自然表达承接上文的推论关系，符合现代汉语叙述。
- source_word: בשבועה הקים לו
  choice: 他以誓言向他作了保证
  rationale: הקים与誓言连用，表示以起誓确立或确认所应许之事；汉语不强行补出具体宾语，以保留原文的含蓄。
- source_word: לברך בזרעו גוים
  choice: 万国必因他的后裔而蒙福
  rationale: 希伯来语可表达藉着或因着其后裔得福；希腊语平行文本明确采用被动式，因此译作“蒙福”，同时不限定施福的具体方式。
- source_word: זרעו
  choice: 他的后裔
  rationale: 该词形式为单数而含集合意义；“后裔”在现代汉语中自然，并保留亚伯拉罕应许语境中的群体含义。
- source_word: להנחילם
  choice: 使他们承受产业
  rationale: נחל的使役形表示使人承受产业。保留“他们”这一代词，不在正文中断定其所指，以免消除原文可能存在的指代张力。
- source_word: מים עד ים
  choice: 从海到海
  rationale: 现存希伯来文本字面作“从水到海”，很可能是传抄差异；希腊语平行文本保存了常见的疆域公式“从海到海”，正文据此翻译，并以脚注说明。
- source_word: ומנהר
  choice: 从大河
  rationale: 在圣经疆域应许用语中，“大河”通常特指幼发拉底河；正文保留传统称谓，脚注交代所指。
- source_word: עד אפסי ארץ
  choice: 直到地极
  rationale: 简洁保留圣经式疆界表达，既可指土地最远的边界，也可带有世界尽头的广阔意味。
theological_decisions:
- issue: 万国得福的语态与媒介
  choice: 万国必因他的后裔而蒙福
  alternative: 他必藉着自己的后裔赐福万国
  rationale: 希伯来语不定式容许较主动的理解，但希腊语平行文本支持被动语态。“蒙福”保留谁施行、如何施行祝福的神学张力。
- issue: “他们”的指代
  choice: 保留代词“他们”
  alternative: 明确译为“使他的后裔承受产业”或“使万国承受产业”
  rationale: 原文宾语后缀的所指可受邻近的“万国”或整体应许语境影响；正文不擅自消除这种歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“作了保证”自然传达以誓言确立应许的意思；“蒙福”“承受产业”“地极”保留经文语体，但普通读者仍易理解。
