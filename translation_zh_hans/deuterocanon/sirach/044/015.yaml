  text: Their wisdom is proclaimed by the assembly[b][a], and their praise is recounted by the congregation.
translation:
  language: zh_hans
  text: 会众传诵他们的智慧；大会述说对他们的赞美。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开罗藏经库希伯来文作：“会众传诵他们的智慧；大会述说对他们的赞美。”希腊文平行文本作：“众民要述说他们的智慧，集会宣扬对他们的赞美。”正文以希伯来文为主要依据；希腊文第一分句的施事范围更广，为“众民”。
    reason: alternative_reading
  - marker: b
    text: 本节所在部分的马萨达卷残缺；本节只保存了末尾相当于“他们的赞美……大会／集会”的片段，没有保存完整诗行。
    reason: textual_variant
lexical_decisions:
- source_word: חכמתם
  choice: 他们的智慧
  rationale: 按名词 חכמה 加第三人称阳性复数词尾直译，保留简洁的所属关系。
- source_word: תשנה
  choice: 为……所传述
  rationale: שנה 在此有反复讲述、传诵之意；用“传述”既体现公开复述，也比“重复”更符合现代汉语诗体。
- source_word: עדה
  choice: 会众
  rationale: עדה 指聚集成群体的共同体；译作“会众”，保留其公共、群体性的语境。
- source_word: ותהלתם
  choice: 他们所受的赞美
  rationale: תהלה 基本义为“赞美”；补出“所受”说明这是众人对他们发出的赞美，而非他们自己的赞美行为。
- source_word: יספר
  choice: 由……讲说
  rationale: ספר 在此表示述说、讲述；采用被动式搭配，以维持两分句的诗性平行。
- source_word: קהל
  choice: 集会
  rationale: קהל 指聚集起来的群体。译作“集会”以区别前一分句的 עדה“会众”，同时保存近义平行。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两分句保持平行结构，并以“会众／集会”区分 עדה 与 קהל；“传述／讲说”保留希伯来文公开复述与述说的语义，同时避免把 תשנה 误解为“改变”。
