  text: rulers of the land in their kingdoms[a], and men renowned for their might; counselors in their understanding[b], and seers of all things in their prophecy.
translation:
  language: zh_hans
  text: 在各自国中统治疆土的人[a]，因勇力而闻名的男子；凭悟性出谋划策的人，以及在预言中洞见万事的先见者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在各自国中统治疆土的人”：希伯来语 דורי ארץ 的含义不易确定；希腊语对应文本作“在各自王国中掌权的人”，支持这里所表达的统治含义。
    reason: alternative_reading
  - marker: b
    text: “在预言中洞见万事的先见者”：希伯来语表达简略，也可直译为“看见一切的先见者”；希腊语对应文本则更明确地说“在预言中宣告（或传述）的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דורי ארץ
  choice: 掌权、治理疆土的人
  rationale: 这组希伯来语词义不易确定；结合下文“在其国中”和希腊语对应词 κυριεύοντες（掌权、统治），这里指治理一方土地的统治者。“疆土”比“全地”更符合具体政治统治的语境。
- source_word: במלכותם
  choice: 各自在其国中
  rationale: מלכות可指王权、统治时期或王国。此处采用“国”，表达政治领域；加入“各自”对应复数所有格，使现代汉语自然。
- source_word: אנשי שם
  choice: 扬名的男子
  rationale: 字面为“有名之人”，是享有声名的习语。希伯来语明确使用阳性名词，因此用“男子”保留原文性别信息。
- source_word: בגבורתם
  choice: 以勇力
  rationale: גבורה可表示力量、勇武或英勇。“勇力”兼顾体力与英雄气概，也与希腊语 δύναμις 的广义“能力、力量”相合。
- source_word: היועצים
  choice: 出谋划策的人
  rationale: 该词是表示一类人的分词形式，意为提供谋略或劝告者。此译简明自然，并保留其行动性。
- source_word: בתבונתם
  choice: 凭悟性
  rationale: תבונה涵盖理解力、洞察力和辨别力。“悟性”适合智慧传统的语境；“凭”清楚表达这种能力是他们献策的凭借。
- source_word: וחוזי כל
  choice: 洞见万事的先见者
  rationale: חוזי指看见异象者或先见者，כל简略而未明说受词。“万事”保留其宽泛含义，不限定具体预见内容。
- source_word: בנבואתם
  choice: 在预言中
  rationale: נבואה可指预言、先知性言说或先知职分。此处译作“在预言中”，紧贴希伯来语介词结构，同时保留其可指预言活动或内容的弹性。
theological_decisions:
- issue: 受尊崇先祖名录中的阳性称谓
  choice: 以勇力扬名的男子
  alternative: 以勇力扬名的人
  rationale: אנשי明确为阳性复数。译作“男子”保留原文所指的性别，不将其无声地中性化。
- issue: “先见者”所见或所宣告的范围
  choice: 在预言中洞见万事的先见者
  alternative: 借众预言传讲信息的人
  rationale: 希伯来语突出“看见”和含义宽泛的“万事”，希腊语则更明确突出在预言中宣告。正文优先依据可靠的希伯来语文本，脚注交代希腊语见证，避免把两者强行合并。
translation_notes:
  register: 采用现代、庄重而易懂的名录式语言，以分号呈现两组并列人物。“出谋划策”较口语化但不失庄重，能清楚传达智慧谋议；“先见者”保留古代先知性观看的色彩。
