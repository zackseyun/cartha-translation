  text: Until the appointed time, the patient one[b] will endure, and afterward joy will be repaid to him.[a]
translation:
  language: zh_hans
  text: 坚忍者[b]会忍耐到适当的时候；随后，他必得享喜乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所提供的希伯来文见证似乎与此处不对应；正文依据希腊文本翻译：“坚忍者会忍耐到适当的时候；随后，他必得享喜乐。”
    reason: textual_variant
  - marker: b
    text: “坚忍者”也可译作“恒久忍耐的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: 到适当的时候
  rationale: καιρός指合宜、适当的时机；这样翻译既保留时间达到某一节点的含义，也不额外明确是谁预定了这时刻。
- source_word: ἀνέξεται
  choice: 会坚持
  rationale: ἀνέχομαι在此表示承受困难并坚持下去；“坚持”符合现代汉语表达，并与延后获得喜乐的语境相称。
- source_word: μακρόθυμος
  choice: 忍耐的人
  rationale: 该形容词在此作名词用，指能长久忍耐的人；译文保留单数泛指，不限定性别。
- source_word: ὕστερον
  choice: 此后
  rationale: 直接表达前后相继的时间关系，简洁而庄重。
- source_word: ἀναδώσει
  choice: 必回报给他
  rationale: ἀναδίδωμι含归还、回报之意；按希腊文语序保留“喜乐”作主语，同时不补出经文未明说的施予者。
- source_word: εὐφροσύνη
  choice: 喜乐
  rationale: 该词表示欢喜、快乐；“喜乐”自然且适合智慧文学的庄重语域。
theological_decisions:
- issue: 本节所提供的希伯来文与希腊文内容严重不对应
  choice: 以希腊文平行文本作为本节正文依据，并以脚注说明文本问题
  alternative: 翻译所提供的希伯来文：“亲近她、以她的诫命为乐的人有福了”
  rationale: 资料已将希伯来文标为重大错配，其内容与《德训篇》1:22的希腊文完全不同。项目原则要求希伯来文缺失或不确定时采用希腊文，因此本节据现存希腊文翻译，同时坦诚保留见证差异。
- issue: 喜乐的施予者未明说
  choice: 不补出“上帝”等主语
  alternative: 译作“上帝必以喜乐回报他”
  rationale: 希腊文没有明说施予者；不加主语可保留原文的含蓄表达，避免加入解释性的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“适当的时候”保留καιρός所指合宜时机的意味；“喜乐必回报给他”略带文学色彩，以贴近希腊文中喜乐作主语的结构。所有脚注标记均置于正文相应位置。
