  naturalness: “忍耐的人会坚持”可以理解，但“坚忍者会忍耐”在庄重的现代汉语经文语体中更凝练，并较好分别体现μακρόθυμος的恒忍品格和ἀνέξεται的忍受、持守。“随后，他必得享喜乐”自然通顺。
