  text: The beginning of wisdom is the fear of Yahweh[a], and it brings abundant peace and life and healing.
translation:
  language: zh_hans
  text: 智慧的开端是敬畏雅威；这敬畏使平安、生命和医治增多。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证作：“她使他们全家充满她可喜爱的东西，又使库房充满她的出产。”这与现存希伯来文的一整行有显著差异。
    reason: 重大文本异文
lexical_decisions:
- source_word: רֵאשִׁית
  choice: 开端
  rationale: 既保留“开始、起点”的基本含义，也不排除其作为根基或首要原则的意味。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是智慧文学中自然、稳定的对应词。
- source_word: יִרְאַת
  choice: 敬畏
  rationale: “敬畏”同时保留畏惧与崇敬的分量，比单用“尊敬”更贴近希伯来语。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 以现代汉语常见音译表达四字神名，不用称号替代原文专名。
- source_word: וּמַרְבָּה
  choice: 使……增多
  rationale: 按使役或增益性的动词理解，译出敬畏雅威所带来的丰盛结果；同时避免把原文明确化为原本未出现的“赐予”。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 保留常见译法，并可涵盖安宁、健全与福祉。
- source_word: חַיִּים
  choice: 生命
  rationale: 原词虽为复数形式，但在此作抽象集合概念，汉语用“生命”最自然。
- source_word: וּמַרְפֵּא
  choice: 医治
  rationale: 保留恢复、治愈的动态意味；“健康”虽可成立，却较弱化这种意味。
theological_decisions:
- issue: 四字神名 יְהֹוָה 的译法
  choice: 雅威
  alternative: 上主／耶和华
  rationale: 原文直接使用神名，因此正文采用音译，避免以称号代替，也不据此引入额外的宗派解释。
- issue: 现存希伯来文与希腊文见证严重不同
  choice: 正文依现存希伯来文，脚注完整交代希腊文异读
  alternative: 正文依希腊文：“她使他们全家充满她可喜爱的东西，又使库房充满她的出产。”
  rationale: 所给希伯来文证据置信度高，适合作正文依据；但希腊文并非轻微措辞差异，而是另一整句，必须明确保存这一文本张力。
- issue: וּמַרְבָּה 的主语及句法补足
  choice: 以“这敬畏”承接前句作主语
  alternative: 并有丰盛的平安、生命和医治
  rationale: 希伯来语可自然理解为前述“敬畏雅威”使这些福分增多。汉语补出“这敬畏”可使句子完整，但不把作用者改成原文没有明说的上帝。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这敬畏”用于自然承接前句；“平安、生命和医治”保留原文并列结构。脚注标记置于全句末尾，因为异文涉及整节，而不只涉及神名。
