base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/023.yaml
  text: Until the right time he will conceal his words, and the lips of many will recount his understanding.[a]
translation:
  language: zh_hans
  text: 直到适当的时候，他会隐藏自己的话；许多人的嘴唇将传述他的见识。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存的开罗藏经库希伯来文本与希腊文本差异很大，大意是：“你要将永恒的冠冕置于他身上，并有永世的功德在圣者中。”由于这份希伯来文见证被标为严重不匹配，本节正文依据希腊文本翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: 直到时机来到
  rationale: καιρός指合宜或特定的时机，不只是一般的时间；此译自然表达“在那时以前”的含义，同时不过度限定为神所指定的日期。
- source_word: κρύψει
  choice: 会隐藏
  rationale: κρύπτω的将来时，表示把话藏住、不予显露；“隐藏”准确而庄重。
- source_word: τοὺς λόγους αὐτοῦ
  choice: 自己的话
  rationale: λόγοι直译为“话”或“言语”；用“自己的”清楚回指本句主语，并保持简洁。
- source_word: χείλη πολλῶν
  choice: 许多人的嘴唇
  rationale: 保留希腊文富有智慧文学色彩的转喻和诗意表达，不将其平化为“许多人”。
- source_word: ἐκδιηγήσεται
  choice: 将述说
  rationale: 该动词含详细讲述、传述之意；“述说”兼顾意义、文体和现代可读性。
- source_word: σύνεσιν αὐτοῦ
  choice: 他的悟性
  rationale: σύνεσις表示理解力、洞察力；“悟性”比单纯的“知识”更能体现其智慧文学含义，也不额外解释为某种特定教义性的智慧。
theological_decisions:
- issue: 现存希伯来文本与希腊文本严重不一致时的底本选择
  choice: 正文依据希腊平行文本翻译，并在脚注中完整说明现存希伯来异文。
  alternative: 依据现存开罗藏经库希伯来文本译为：“你要把永恒的冠冕戴在他头上，并使他在圣者中享有永世的功德。”
  rationale: 所提供的希伯来行与希腊《便西拉智训》1:23在语义上完全不对应，且资料已明确标为“严重不匹配”。希腊文本在此保存了可连贯归入本节的读法，因此用作正文依据；但不将希伯来见证静默删除，而以异文脚注保存文本传统中的真实张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“许多人的嘴唇”有意保留原文的诗性转喻；分号呈现前后两分句的智慧文学式推进。
