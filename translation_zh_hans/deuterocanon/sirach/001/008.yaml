  text: He poured her out upon all flesh according to his will[a], and he gave her to those who love him.
translation:
  language: zh_hans
  text: 他照自己的旨意，把智慧倾注在凡有血气的身上[a]，又把智慧赐给爱他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来传本第一分句作“把智慧赐给”；希腊平行文本支持“把智慧倾注”。因本节希伯来文本存在不确定性，正文采用后者。
    reason: textual_variant
lexical_decisions:
- source_word: אֶל כָּל בָּשָׂר
  choice: 在一切血肉之躯上
  rationale: 希伯来语直译为“向一切血肉”；“血肉之躯”保留原文具体意象，并可涵盖所有有血肉的受造者，同时自然承接“倾注”这一动词。
- source_word: כִּרְצוֹנוֹ
  choice: 照自己的旨意
  rationale: רָצוֹן可指意愿、喜悦或心意；“旨意”在庄重的现代汉语中自然表达上帝主动而有目的的意愿。
- source_word: נְתָנָהּ
  choice: 把智慧倾注
  rationale: 现存希伯来文本表层读作“赐下她”，但本节文本被标记为重大不一致，希腊平行文本以ἐξέχεεν支持“倾注”。正文采用希腊所支持的动词，同时用脚注如实保留希伯来读法。鉴于汉语不用阴性代词指代抽象名词，明说“智慧”。
- source_word: וַיִּתְּנָהּ
  choice: 又把智慧赐给
  rationale: 第二个动词清楚表示“他赐下她”；“她”回指智慧，汉语正文重复“智慧”以避免代词生硬或指代不明。
- source_word: לְאֹהֲבָיו
  choice: 爱他的人
  rationale: 分词形式意为“爱他者”；此译自然、准确，并保留人与上帝之间的关系含义。
theological_decisions:
- issue: 第一分句中希伯来见证与希腊平行文本的差异
  choice: 保留希伯来文本的句子结构及“一切血肉之躯”，但采用希腊文本支持的“倾注”作为第一动词。
  alternative: 他照自己的旨意，把智慧赐给一切血肉之躯，又把智慧赐给爱他的人。
  rationale: 希伯来见证在此被标记为文本不稳定，且其表层读法会造成连续两次“赐给”；希腊平行文本明确有“倾注”。采用“倾注”既反映重要的古代见证，也不掩盖差异，脚注同时交代希伯来传本读法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“血肉之躯”保留希伯来语“一切血肉”的具象表达；两处均明说“智慧”，避免以“她”指抽象名词所造成的不自然。
