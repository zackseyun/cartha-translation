  text: The fear of Yahweh is the beginning of wisdom[a], and she satisfies with the abundance of her produce.
translation:
  language: zh_hans
  text: 敬畏耶和华是智慧的开端[a]；她以丰盛的出产使人饱足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他（或：它）倾注知识和明悟，并高举持守她之人的荣耀。”这里的希腊文与现存希伯来文差异显著，可能反映了不同的文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: 开端
  rationale: 表示起始、开始；既符合希伯来文的通常含义，也保留智慧文学中的传统表述，不扩展为“首要原则”。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是智慧文学中该词自然、标准的译法。
- source_word: יִרְאַת יְהֹוָה
  choice: 敬畏耶和华
  rationale: “敬畏”兼含畏惧、敬重与崇敬，不将原文的张力缩减为单纯的“尊敬”；“耶和华”传达神圣四字名。
- source_word: וּתְרַוֵּה
  choice: 使人饱足
  rationale: 该动词有使之充分浸润、供应充足而满足之意；“使人饱足”在现代汉语中自然，并保留丰裕满足的意味。原文未明说宾语，汉语以泛指的“人”补足句法。
- source_word: בְּרֹב
  choice: 以丰盛的
  rationale: 介词与名词在此表达所凭借或所充满的内容，并保留数量丰盛之意。
- source_word: תְּבוּאָתָהּ
  choice: 她……的出产
  rationale: 该词指土地的出产或收成；“出产”保留农业比喻而不过度限定为一次“收割”。阴性后缀译作“她的”，呼应智慧的女性人格化。
theological_decisions:
- issue: 希伯来文与希腊文显著不一致时的底本选择
  choice: 正文依据现存希伯来文翻译，并在脚注列出希腊文异读。
  alternative: 依据希腊文译为：“他（或：它）倾注知识和明悟，并高举持守她之人的荣耀。”
  rationale: 本节有可靠的希伯来文见证，故正文以希伯来文为先；但希腊文并非细微措辞差别，而是反映显著不同的文本形态，因此必须在脚注中如实保留。
- issue: 阴性人格化及所指的含混
  choice: 以“她”保留阴性表达，使上下文自然指向人格化的智慧，同时不另加解释。
  alternative: 全用无性别的“它”，或明确改写为“智慧”。
  rationale: 希伯来文动词和物主后缀均为阴性；“敬畏”与“智慧”在语法上也都是阴性名词。使用“她”既呈现智慧传统中的女性人格化，也避免通过重复名词强行消除原文可能存在的指代张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“使人饱足”传达充分供应而满足的意义；“丰盛的出产”保留原文的农业意象。正文中的[a]与脚注标记一致。
