  text: Happy is the man who meditates on her[b][a], and she is better for him than every treasure.
translation:
  language: zh_hans
  text: 默想她的人有福了[a]；对他而言，她胜过一切珍宝。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “默想”也可译作“揣摩”或“沉思”。
    reason: 词义备选
  - marker: b
    text: 希腊文本此处的内容大不相同：“因为他的怒气一发作，就使他跌倒。”这可能反映了不同的文本形态或经节编排。
    reason: 重要文本异文
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是希伯来语智慧文学常见的称福句式，表示某人处于令人羡慕的美好境况；“有福了”既自然庄重，也保留了原文的传统语气。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 该词指凡人或世人。现代汉语用“人”即可自然表达原文具有代表性的单数，不必额外加入原文没有的性别限定。
- source_word: יֶהְגֶּה
  choice: 默想
  rationale: הגה 在智慧文学语境中表示反复思想、沉思或揣摩；“默想”准确传达持续而专注的思索。
- source_word: בָּהּ
  choice: 她
  rationale: 阴性代词后缀最自然地回指上下文中人格化的“智慧”；译作“她”保留这一人格化表达。
- source_word: וְטוֹבָה
  choice: 她……胜过
  rationale: 形容词“好”与 מִכָּל 构成比较，意思是价值更高；汉语用“胜过”清楚自然地表达这种比较。
- source_word: מִכָּל אוֹצָר
  choice: 胜过一切珍宝
  rationale: אוֹצָר 可指宝物、财富或宝库；此处指贵重的财富。“一切珍宝”保留 מִכָּל 的总括意味。
- source_word: ἡ γὰρ ῥοπὴ τοῦ θυμοῦ αὐτοῦ πτῶσις αὐτῷ
  choice: 不采入正文
  rationale: 现存希腊见证与希伯来文本差异极大，可能源于不同的文本形态或经节编排；正文依照本项目采用的希伯来见证，希腊异文则收入脚注。
theological_decisions:
- issue: 智慧的拟人化
  choice: 保留阴性人称“她”
  alternative: 译作“它”
  rationale: 希伯来语阴性代词及上下文中人格化的智慧支持“她”；不应将原文的拟人表达弱化为非人格的“它”而又不作说明。
- issue: 智慧称福句中的代表性单数
  choice: “人”
  alternative: “男子”或“凡……的人”
  rationale: אֱנוֹשׁ 为阳性单数形式，但在智慧格言中代表一般的人。汉语“人”既不增添不必要的男性限定，也没有把单数含义改成特定群体。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“有福了”保留称福公式的力度；分号呈现两个紧密相连而又各自完整的分句。所有脚注标记均已置于正文。
