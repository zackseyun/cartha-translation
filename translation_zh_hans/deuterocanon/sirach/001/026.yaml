  text: For wisdom and instruction are fear of the Lord, and his good pleasure is faith and meekness.
translation:
  language: zh_hans
  text: 因为智慧和训诲就是敬畏主；他所喜悦的是信心和温柔。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所提供的现存希伯来文见证被标记为“重大不匹配”，其内容与本节并不对应；因此正文依据《德训篇》1:26的希腊文本翻译。
    reason: textual_variant
  - marker: b
    text: “信心和温柔”也可译作“忠信和柔和”。希腊文πίστις也可指“忠信”或“信靠”，πρᾳότης也可译作“柔和”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: 智慧
  rationale: 本节现存希伯来文与节号内容严重不符，因此以希腊文平行文本为实际底本；σοφία在德训篇中指广义的道德与实践智慧。
- source_word: παιδεία
  choice: 训诲
  rationale: 可指教导、训练或管教；此处与“智慧”并列，采用“训诲”既保留智慧文学语体，也不将含义限于惩戒。
- source_word: φόβος κυρίου
  choice: 敬畏主
  rationale: 这是智慧文学中的核心表达；“敬畏”兼具畏惧、尊崇与虔敬之意，比单用“尊敬”更能保留原文的神学分量。
- source_word: ἡ εὐδοκία αὐτοῦ
  choice: 他所喜悦的
  rationale: 按“令他喜悦之事”理解，中文采用自然的关系从句；不强行解释为人所领受的“恩宠”。
- source_word: πίστις
  choice: 信心
  rationale: πίστις可表示信、信靠或忠信；正文用“信心”，同时在脚注保留“忠信”的语境可能性。
- source_word: πρᾳότης
  choice: 温柔
  rationale: 该词表示柔和谦逊的品格；现代汉语“温柔”自然清楚，“柔和”亦为可行译法，列入脚注。
theological_decisions:
- issue: 现存希伯来文与本节希腊文本严重不符时的底本选择
  choice: 依照本节希腊文翻译，并在脚注说明希伯来文见证错位
  alternative: 直接翻译所提供的希伯来文句子
  rationale: 所给希伯来文意为“这整卷书充满了它；听见并实行的人有福了”，并不对应德训篇1:26的希腊文。既然资料明确标记为重大不匹配，正文应采用对应本节的古代希腊文见证，同时如实记录文本问题。
- issue: πίστις的语义
  choice: 信心
  alternative: 忠信；信靠
  rationale: 此词本身容许主观信靠与忠诚信实两方面含义，智慧文学语境不能完全排除“忠信”；故正文采用“信心”，脚注保留另一读法，避免作教派化限定。
- issue: ἡ εὐδοκία αὐτοῦ所指
  choice: 他所喜悦的是信心和温柔
  alternative: 他的恩宠就是忠信和柔和
  rationale: 属格αὐτοῦ可与“喜悦”构成“他的喜悦／他所喜悦的”之意；正文采用较自然且不额外引入恩宠观念的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“训诲”保留智慧文学色彩，“敬畏主”沿用清楚且源文本贴近的经典表达。脚注标记均置于正文句末，分别说明底本问题与词义歧义。
