  text: The fear of the Lord is glory and exultation[a], and gladness and a crown of rejoicing.
translation:
  language: zh_hans
  text: 敬畏主，是荣耀和夸耀；是喜乐，也是欢庆的冠冕。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβος
  choice: 敬畏
  rationale: “敬畏主”是圣经智慧传统中的固定表达；“敬畏”既保留“畏”的成分，也能传达谦卑、尊崇和顺服之意。
- source_word: κυρίου
  choice: 主
  rationale: κύριος按本项目惯例译作“主”，与“敬畏”组成自然且为读者熟悉的表达。
- source_word: δόξα
  choice: 荣耀
  rationale: 此处指敬畏主所带来的尊荣；“荣耀”保留该词在圣经语体中的分量，也符合原文的名词排比。
- source_word: καύχημα
  choice: 夸耀
  rationale: 该词可指夸耀本身，也可指可夸耀的事物；此处语境正面，译作“夸耀”可避免误解为负面的“骄傲”，并保留原文简洁的名词形式。
- source_word: εὐφροσύνη
  choice: 喜乐
  rationale: 表示欢喜、愉悦；“喜乐”自然庄重，并与后面的ἀγαλλίαμα有所区分。
- source_word: στέφανος
  choice: 冠冕
  rationale: 原指花冠或胜利者的冠冕；此处用作尊荣的比喻，“冠冕”最符合汉语圣经语体。
- source_word: ἀγαλλιάματος
  choice: 欢庆
  rationale: 该属格修饰“冠冕”，描写以踊跃欢腾为特征的冠冕；“欢庆”既自然，也保留了它与“喜乐”之间细微的语义差别。
theological_decisions:
- issue: 智慧传统用语φόβος κυρίου的译法
  choice: 敬畏主
  alternative: 惧怕主；尊崇主
  rationale: 单译“惧怕”容易使现代读者只理解为恐惧，单译“尊崇”又会削弱原词中畏惧的一面；“敬畏主”较完整地保留这一智慧传统表达的张力。
translation_notes:
  register: 采用现代、庄重而通顺的汉语，保留原文连续使用抽象名词的诗性排比。“荣耀和夸耀”略带非常规搭配，是为呈现δόξα与καύχημα并列的语义张力；后半句以“喜乐和欢庆的冠冕”维持原文结构。
