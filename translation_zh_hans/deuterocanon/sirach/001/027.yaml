  text: Do not disobey the fear of the Lord, and do not come to him with a divided heart.
translation:
  language: zh_hans
  text: 不要抗拒对主的敬畏，也不要心怀二意地来到他面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文合订材料在此处所载内容与本节的希腊文不同；本译文依据与《便西拉智训》1:27对应的希腊文传统。
    reason: 所提供的希伯来文与本节存在重大错位，而希腊文见证与传统节号及英译审核层一致，需向读者说明文本依据。
lexical_decisions:
- source_word: μὴ ἀπειθήσῃς
  choice: 不要抗拒
  rationale: ἀπειθέω表示不服从、不听从或拒不信从；这里与“对主的敬畏”搭配，译作“不要抗拒”既自然，又保留其劝诫力度。
- source_word: φόβῳ Κυρίου
  choice: 对主的敬畏
  rationale: 保留φόβος的敬畏含义及属格“主”，不将其弱化为单纯的尊重，也不把它解释成恐惧。
- source_word: μὴ προσέλθῃς αὐτῷ
  choice: 不要……来到他面前
  rationale: προσέρχομαι指走近、进到某人跟前；此译法在现代汉语中自然，并保留亲近神或朝见神的空间意象。
- source_word: ἐν καρδίᾳ δισσῇ
  choice: 心怀二意地
  rationale: δισσός意为双重、两样；“心怀二意”保留内心分裂、不专一的含义，同时避免把它限定为一般性的犹豫不决。
theological_decisions:
- issue: “敬畏主”在句中是应当顺从的对象
  choice: 不要抗拒对主的敬畏
  alternative: 不要不顺从对主的敬畏
  rationale: 保留希腊文将“对主的敬畏”置于ἀπειθέω支配之下的张力，不将其扩写为某一套律法、命令或宗派性教义。
- issue: “二心”的具体所指
  choice: 心怀二意
  alternative: 怀着分裂的心
  rationale: 不进一步断定这是虚伪、怀疑还是忠诚分裂，保留原文较宽的伦理与属灵含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心怀二意”略带经典语感，但仍属当代常用表达；全句尽量贴近希腊文的平行禁令结构。
