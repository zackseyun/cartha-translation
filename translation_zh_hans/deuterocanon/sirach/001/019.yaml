  text: She is a staff of strength and a support[a], praise and everlasting honor to everyone who walks after her.
translation:
  language: zh_hans
  text: 她是强有力的杖和倚靠[a]；她也是所有跟随她之人的赞美和永远的尊荣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文译本作：“智慧的根就是敬畏主；她的枝条乃是长寿。”这里的希伯来文本与希腊传统有重大差异。
    reason: textual_variant
lexical_decisions:
- source_word: מַטּהֵ עֹז
  choice: 大能的杖
  rationale: מַטֶּה指杖或棍，עֹז指力量、能力；译作“大能的杖”保留原文意象，并与下句“倚靠”形成诗歌平行。
- source_word: מַשְׁעֵנָה
  choice: 人的倚靠
  rationale: 该词指可供倚靠、支撑之物。“人的倚靠”在现代汉语中自然，也避免与前面的“杖”重复。原文未明说“人的”，这里为使独立谓语通顺而作轻微补足。
- source_word: תְּהִלָּה
  choice: 赞美
  rationale: 按该词最直接的意义译为“赞美”，保留它可指所得称赞或可赞美之名声的语义张力，不擅自限定为“美名”。
- source_word: כְבוֹד עוֹלָם
  choice: 永远的尊荣
  rationale: כָּבוֹד可指荣耀或尊荣；用于跟随智慧之人时，“尊荣”较自然。עוֹלָם表达长久、恒久，译为“永远的”。
- source_word: לְכָל הַהוֹלֵךְ אַחֲרֶיהָ
  choice: 凡跟随她的人
  rationale: הלך אחרי是“跟随”的惯用表达。“她”保留智慧在希伯来文中的阴性人格化描写；“凡……的人”自然表达לְכָל的普遍范围。
theological_decisions:
- issue: 希伯来文本与希腊文本存在重大差异
  choice: 正文采用现存希伯来文本
  alternative: 希腊文作：“智慧的根就是敬畏主，她的枝条乃是长寿。”
  rationale: 本项目在《便西拉智训》希伯来文存留处优先据希伯来文翻译。希腊传统在本节提供的是实质不同的文本形态，因此不将二者调和，而在脚注中完整保存异文。
- issue: 智慧的拟人化
  choice: 以“她”指智慧
  alternative: 以“它”指智慧
  rationale: 阴性代词承接上下文中的智慧，保留原文的拟人化表达，同时不进一步赋予特定教义身份。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“杖—倚靠”的诗歌意象和智慧的女性拟人化；将后半句调整为“凡……都……”结构，使汉语关系清楚而不改变受益者范围。
