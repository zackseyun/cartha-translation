translation:
  language: zh_hans
  text: 它的根永远长存[a]；它的枝条——长寿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“易怒的人不能被称义（或：不能成为义人）。”本节的希伯来文与希腊文见证差异很大。
    reason: textual_variant
  - marker: b
    text: “长寿”直译为“日子的长度”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשֶׁיהָ
  choice: 它的根
  rationale: שֹׁרֶשׁ 加第三人称阴性单数后缀，承接上下文中语法上为阴性的智慧或敬畏；现代汉语用“它的”自然，并保留植物意象。
- source_word: לְעוֹלָם
  choice: 永远长存
  rationale: לְעוֹלָם 表示恒久不息；补出“长存”使“根”与时间状语的关系在现代汉语中完整自然，同时保持诗意。
- source_word: וַעֲנָפֶיהָ
  choice: 它的枝条
  rationale: עֲנָפִים 指树枝、枝条；“枝条”通俗清楚，也与前句的“根”形成植物意象的对应。
- source_word: אֹרֶךְ יָמִים
  choice: 带来长寿
  rationale: 该希伯来语习语直译为“日子的绵长”，通常表示长寿；译作“带来长寿”使省略系词的诗句在汉语中自然，并保留枝条结出益处的隐喻。
theological_decisions:
- issue: 本节现存希伯来文与希腊文见证严重分歧
  choice: 正文依据现存希伯来文诗句翻译
  alternative: 按希腊文译为“易怒的人不能被称义（或：不能成为义人）”
  rationale: 《便西拉智训》有希伯来文存世之处以希伯来文为主要依据；但希腊文并非细微异文，而是完全不同的一句，因此在脚注中明确保留，避免掩盖文本传统的不稳定。
- issue: δικαιωθῆναι 的译法
  choice: 脚注译作“被称义”
  alternative: 成为义人；证明为义
  rationale: 该希腊词可指被判定或承认为义，也可能指成为义；“被称义”较贴近被动形式，而脚注同时列出“成为义人”，以保存语义张力，不作宗派化解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“根—枝条”的诗歌平行意象；“永远长存”补足汉语谓语，“带来长寿”自然表达希伯来习语。所有脚注标记均置于相关正文之后。
