  text: All her storehouses she fills with delight[b][a], and her granaries with her produce.
translation:
  language: zh_hans
  text: 她以可喜的丰盛[b]充满她所有的库房，又以自己的出产充满她的粮仓。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作：“她以可喜的丰盛充满她所有的库房，又以自己的出产充满她的粮仓。”希腊文见证则作：“智慧的冠冕是敬畏主，绽放出平安和带来医治的健康。”
    reason: textual_variant
  - marker: b
    text: “可喜的丰盛”也可译作“珍贵之物”、“悦人之物”或“可欲之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אוֹצָרֶיהָ
  choice: 自己所有的库房
  rationale: אוֹצָר可指库房、宝库或所储之物；因下句以“粮仓”平行，这里采用具体的储藏场景。“所有的”反映כָּל，并保留希伯来文复数。
- source_word: תְּמַלֵּא
  choice: 使……充满／装满
  rationale: 未完成式在智慧文学中可表达一般性陈述；译为现在时语义，不限定为将来。“使……充满”也保留及物结构。第二分句依汉语搭配译作“装满”。
- source_word: חֶמְדָּה
  choice: 可喜之物
  rationale: חֶמְדָּה可表示可欲、珍贵、悦人之物或喜悦。“可喜之物”既适合装入库房的具体意象，又不把词义局限为财宝；其他可能译法列入脚注。
- source_word: וַאֲסָמֶיהָ
  choice: 使自己的粮仓
  rationale: אָסָם指粮仓或谷仓；“粮仓”保留农业意象，并与“出产”自然搭配。希伯来文省略第二个动词，中文补出“使……装满”以保持清楚。
- source_word: בִּתְבוּאָתָהּ
  choice: 她的出产
  rationale: תְּבוּאָה可指土地的出产、收成或产物。“出产”较宽泛，并保留阴性后缀所指向的拟人化智慧。
- source_word: στέφανος σοφίας
  choice: 未收入正文
  rationale: 希腊见证以“智慧的冠冕”起首，与现存希伯来文差异显著。本项目在《便西拉智训》有希伯来文存世时以希伯来文为正文依据，因此将希腊异文完整保留于脚注。
theological_decisions:
- issue: 《便西拉智训》1:17希伯来文与希腊文见证显著不同
  choice: 正文翻译现存希伯来文
  alternative: 依希腊文译作：“智慧的冠冕是敬畏主，开出平安和使人痊愈的健康。”
  rationale: 希伯来文在本节存世，故据其翻译正文；希腊传统并非细微措辞差异，而是另一整句，不宜调和或静默舍弃，因此置于文本异文脚注，让两种见证之间的张力清楚可见。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“库房—粮仓—出产”维持希伯来文的储藏和农业意象；以“自己”明确同一拟人化主体的所属关系，并避免连续使用多个“她”造成生硬。
