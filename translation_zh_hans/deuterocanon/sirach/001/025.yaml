  text: Desire wisdom, keep the commandments, and the Lord will supply her[b][a] to you.
translation:
  language: zh_hans
  text: 你若渴慕智慧，就要遵守诫命，主必将她赐给你。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所提供的现存希伯来文行与《便西拉智训》1:25不相符，因此此处依据希腊文见证翻译。
    reason: textual_variant
  - marker: b
    text: 或译：“要渴慕智慧，遵守诫命，主必将她赐给你。”开头的分词既可按条件理解，也可在此语境中表达劝勉或命令。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμήσας
  choice: 你若渴慕
  rationale: 现存所给希伯来文与本节不符，故以希腊文为翻译依据。该不定过去时分词可表达条件或带命令意味；译作“你若渴慕”自然保留其句法歧义中的条件可能，也与后面的命令相衔接。
- source_word: σοφίαν
  choice: 智慧
  rationale: 这是智慧文学中的标准译法；下文以阴性代词指代，显示智慧具有人格化色彩。
- source_word: διατήρησον
  choice: 就要遵守
  rationale: 在诫命语境中，“遵守”准确表达持守并实行之意，符合现代汉语圣经语体。
- source_word: ἐντολάς
  choice: 诫命
  rationale: “诫命”保留宗教伦理语境，较一般性的“命令”更贴切。
- source_word: Κύριος
  choice: 主
  rationale: 按通行的现代汉语圣经用语翻译 κύριος。
- source_word: χορηγήσει
  choice: 必将……赐给
  rationale: 该词含供给、授予之意；“赐给”既自然，也体现所赐之物来自主，同时避免过度强调物资供应。
- source_word: σοι
  choice: 给你
  rationale: 明确表达与格所指的受益者。
- source_word: αὐτήν
  choice: 她
  rationale: 保留希腊文对“智慧”的阴性指称及其人格化意象，不将其扁平化为无人格的“它”。
theological_decisions:
- issue: 本节主要文本依据
  choice: 采用与《便西拉智训》1:25相符的希腊文见证，而不翻译所给但错配的希伯来文行。
  alternative: 按所给希伯来文译为“上帝的使者必因她欢喜，并述说耶和华一切的赞美”。
  rationale: 所给希伯来文内容并不对应本节，而希腊文平行文本与本节编号及传承内容相符。应据希腊文翻译，并在脚注中如实交代文本依据。
- issue: ἐπιθυμήσας的句法理解
  choice: 译作条件式“你若渴慕”，随后以“就要”承接命令。
  alternative: 译作并列命令：“要渴慕智慧，遵守诫命。”
  rationale: 分词既可在语境中带命令意味，也可作条件理解；正文采用自然且语法上较直接的条件式，并以脚注保留命令式可能。
- issue: 智慧的性别化指称
  choice: 以“她”指智慧。
  alternative: 以“它”指智慧。
  rationale: “她”保存希腊文的阴性指称与智慧文学中的人格化张力，并不主张超出文本的身份认定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你若……就要……”清楚呈现条件与劝勉的关系；“主必将她赐给你”保留智慧的人格化，同时避免生硬欧化。脚注标记均置于正文句末，依次说明底本问题和句法异读。
