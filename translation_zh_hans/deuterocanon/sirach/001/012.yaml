  text: The fear of Yahweh gladdens the heart[a], and gives joy and favor and length of days.
translation:
  language: zh_hans
  text: 敬畏耶和华使人心里喜乐[a]，赐下欢喜、恩宠和长寿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“敬畏主的人终必得福；在他去世之日，他必蒙福。”希腊平行文本保存了本节一个内容大不相同的版本。
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: 敬畏耶和华
  rationale: יִרְאָה既含惧怕，也含尊崇敬重；“敬畏”保留这两方面的含义。按现代中文圣经传统，神名יְהוָה译作“耶和华”。
- source_word: מְשַׂמַּחַת לֵב
  choice: 使人心里喜乐
  rationale: מְשַׂמַּחַת是使役意义，לֵב指人的内心，包括思想与情感。“使人心里喜乐”自然清楚地表达其作用对象。
- source_word: וְנוֹתֶנֶת שִׂמְחָה
  choice: 赐下欢喜
  rationale: נוֹתֶנֶת直译为“给予”；因主语是“敬畏耶和华”，中文用“赐下”较自然。שִׂמְחָה译为“欢喜”，保留它与前句“喜乐”的语义叠加。
- source_word: חֵן
  choice: 恩宠
  rationale: חֵן可指恩惠、好感或美善吸引力。此处列举敬畏上主带来的福分，“恩宠”既保留受惠意味，也避免将词义限定为后期系统神学中的“恩典”。
- source_word: אֹרֶךְ יָמִים
  choice: 长寿
  rationale: 这是希伯来语表示寿命长久的惯用语。现代汉语译作“长寿”比形式对应的“日子长久”更自然明确。
theological_decisions:
- issue: 希伯来文本与希腊平行文本存在重大差异
  choice: 正文采用现存且文意完整的希伯来文本，并以脚注保存希腊异文。
  alternative: “敬畏主的人终必得福；在他去世之日，他必蒙福。”
  rationale: 希伯来见证在此完整连贯，应作为正文依据；希腊文本则呈现内容显著不同的独立形态，不宜与希伯来文调和或混入正文，故在脚注中完整说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“敬畏”保留原文的神学张力；整体句式简洁，适合普通读者朗读和理解。
