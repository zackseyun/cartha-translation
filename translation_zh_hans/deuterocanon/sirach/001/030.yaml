  text: Water puts out a blazing fire, and almsgiving makes atonement for sins.
translation:
  language: zh_hans
  text: 水能熄灭熊熊烈火，施舍也能赎罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῦρ φλογιζόμενον
  choice: 熊熊烈火
  rationale: 表达正在猛烈燃烧的火，符合现代汉语习惯，同时保留希腊语分词所强调的炽烈状态。
- source_word: ἀποσβέσει
  choice: 能熄灭
  rationale: 准确表达“使火熄灭”，并以“能”呈现格言式陈述的普遍效力。
- source_word: ἐλεημοσύνη
  choice: 施舍
  rationale: 指向出于怜悯而救济穷人的具体行动；“施舍”是现代汉语中简洁、通行的对应词。
- source_word: ἐξιλάσεται
  choice: 能赎
  rationale: 保留“赎除、补赎”的祭祀与关系修复色彩，不弱化为单纯的“遮盖”或“抵消”。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 希腊语为复数，但汉语集合名词“罪”更自然，语义范围不变。
theological_decisions:
- issue: 施舍与赎罪之间的关系
  choice: 施舍也能赎罪
  alternative: 施舍能为罪作补赎／施舍能消除罪过
  rationale: 直译希腊语 ἐξιλάσεται ἁμαρτίας，保留原文明确而富张力的陈述，不另行加入关于功德、称义方式或赦免机制的解释。
translation_notes:
  register: 采用简洁、庄重、易懂的箴言体。所给希伯来文本与本节的希腊平行文本及英文审校层内容完全不符，显然属于另一段经文；鉴于数据已标注 major_mismatch，本稿据与本节一致的希腊文本翻译。
