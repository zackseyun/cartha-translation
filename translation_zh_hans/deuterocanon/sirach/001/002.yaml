  text: Who can count the sand of the seas[a], the drops of rain, and the days of eternity?
translation:
  language: zh_hans
  text: 诸海的沙、雨滴和永恒的日子[a]，谁能数清呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个时代的日子”或“古时的日子”。希伯来文עוֹלָם可指永恒、一个时代或古远的时间；希腊文对应表达也支持时间漫长、无法计量的含义。
    reason: עוֹלָם在此有真实的词义歧义；正文采用“永恒”以表达本节不可计量的时间跨度，脚注保留其他可能的时间含义。
lexical_decisions:
- source_word: חוֹל יַמִּים
  choice: 海洋的沙
  rationale: חוֹל是集合名词“沙”，יַמִּים为“海”的复数。中文“海洋的沙”自然地保留宏阔意象，不额外明确为一颗颗“沙粒”。
- source_word: נִטְפֵי מָטָר
  choice: 雨水的点滴
  rationale: 直译为“雨的滴”，采用“雨水的点滴”既保留具体意象，也符合现代汉语表达。
- source_word: וִימוֹת עוֹלָם
  choice: 无尽的日子
  rationale: יְמוֹת意为“日子”，עוֹלָם在此可指永恒、漫长时代或古远之时。“无尽的日子”在中文中自然地表达不可计量的漫长时间，同时不把该词限定为严格的形而上学术语。
- source_word: מִי יִמְנֶה
  choice: 谁能数得清呢
  rationale: 疑问词加未完成式在此构成反问，表示人无法计数。“谁能数得清呢”准确传达这种修辞力量，且自然易懂。
theological_decisions:
- issue: 智慧文学夸张语境中עוֹלָם的时间含义
  choice: 译作“无尽的日子”，表达不可计量的久远
  alternative: 也可译作“永恒的日子”“一个时代的日子”或“古时的日子”
  rationale: 本节并列人无法计算的事物，重点是时间的浩瀚无边；希腊文ἡμέρας αἰῶνος也支持这一理解。“无尽”保留修辞张力，却不强行赋予该词技术性的永恒观。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个并列意象结构清楚，以“以及”引出末项；句末反问保留原文的智慧文学语气。脚注标记置于实际存在词义歧义的“无尽的日子”之后。
