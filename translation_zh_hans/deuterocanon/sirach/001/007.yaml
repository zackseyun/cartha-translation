  text: He examined her and saw her and counted her[a], and he gave her to those who love him.
translation:
  language: zh_hans
  text: 他察验了她，看见了她，又数算了她[a]；他把她赐给爱他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行见证作：“惟有一位是智慧的，极其可畏，坐在自己的宝座上。”这里现存的希伯来文与希腊传统有重大差异。
    reason: textual_variant
lexical_decisions:
- source_word: בְחָנָהּ
  choice: 察验了她
  rationale: בחן表示试验、考察或检验；“察验”既保留审察意味，也适合庄重而自然的现代汉语。
- source_word: וְרָאָהּ
  choice: 看见了她
  rationale: ראה的基本义是“看见”；采用直译，以保留希伯来文紧凑的动词次序。
- source_word: וְסְפָרָהּ
  choice: 数算了她
  rationale: ספר在此表示计数、数点；“数算”保留智慧被完全计量的形象，且不额外解释其含义。
- source_word: וּנְתָנָהּ
  choice: 把她赐给
  rationale: נתן是“给”；考虑到隐含施予者为上帝，“赐给”在中文中自然庄重，同时不改变基本动作。
- source_word: לְאֹהֲבָיו
  choice: 爱他的人
  rationale: 词尾为阳性单数，最自然地指向本句隐含的施予者上帝，而非阴性的智慧。
- source_word: ־הּ（阴性宾语词尾）
  choice: 她
  rationale: 这些阴性词尾指向阴性名词“智慧”，用“她”保留《便西拉智训》中智慧的拟人表达。
theological_decisions:
- issue: 现存希伯来文与希腊平行见证存在重大差异
  choice: 正文依据完整且可译的现存希伯来文，脚注说明希腊异文
  alternative: 按希腊文译作：“惟有一位是智慧的，极其可畏，坐在自己的宝座上。”
  rationale: 现存希伯来文本句语义连贯，故作为正文基础；希腊传统内容实质不同，不应混合进正文或予以隐去，因此在脚注中完整说明。
- issue: “爱他的人”中代词的所指
  choice: 保留阳性“他”，理解为隐含主语上帝
  alternative: 按语意同化为“爱她（智慧）的人”
  rationale: לְאֹהֲבָיו的词尾明确是阳性单数；译作“爱他的人”忠实保留其语法所指，同时不在正文中增添“上帝”来消除原文的含蓄。
translation_notes:
  register: 采用现代、庄重、易懂的书面普通话。连续使用“察验、看见、数算”来保存希伯来文的动词推进；以“她”保留智慧的拟人化，以“他”保留末尾阳性单数代词的语法张力。
