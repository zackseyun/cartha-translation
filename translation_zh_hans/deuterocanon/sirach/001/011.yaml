  text: The fear of Yahweh is glory and honor[a], greatness and a crown of splendor.
translation:
  language: zh_hans
  text: 敬畏耶和华，就是荣耀、尊贵、伟大和华美的冠冕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文有一处差异很大的读法：“敬畏主使人心里喜悦，并赐下欢欣、快乐和长寿。”
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: 敬畏耶和华
  rationale: 保留希伯来智慧文学中的固定表达；“敬畏”兼具畏惧与崇敬之意，不将其窄化为单纯的“尊敬”。神名 יהוה 译作“耶和华”，符合现代中文圣经读者熟悉的专名形式。
- source_word: כָּבוֹד וִיקָר
  choice: 荣耀、尊贵
  rationale: כבוד 表示荣耀、尊荣；יקר 在此可指尊贵或珍贵。并列译法既自然，也保留两个近义名词的层次。
- source_word: וּגְדֻלָּה
  choice: 伟大
  rationale: 直接表达 גדלה 的“伟大、崇高”之义，并维持原文名词列举的结构。
- source_word: וְעֲטֶרֶת תִּפְאָרֶת
  choice: 和华美的冠冕
  rationale: עטרת 是“冠冕”，תפארת 可指华美、荣美或光彩；译作“华美的冠冕”保留附属结构和尊荣意象，同时避免与前面的“荣耀”重复。
- source_word: φόβος κυρίου τέρψει καρδίαν, καὶ δώσει εὐφροσύνην καὶ χαρὰν καὶ μακροημέρευσιν
  choice: 未纳入正文，作为异文收入脚注
  rationale: 希腊文本与现存希伯来文本实质不同；既然本节有高可信度的希伯来见证，正文依希伯来文，脚注则完整保留希腊异文。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本存在重大差异
  choice: 正文采用希伯来文的名词性描述
  alternative: 采用希腊文：“敬畏主使人心里喜悦，并赐下欢欣、快乐和长寿。”
  rationale: 本节希伯来文确有保存，故以其为主要文本依据；但希腊见证表达的是完全不同的应许，不能静默调和，因此在脚注中明确列出。
- issue: “敬畏”是否弱化为“尊敬”或“崇敬”
  choice: 保留“敬畏”
  alternative: 译作“尊崇耶和华”
  rationale: 原词 יראה／φόβος 包含真实的畏惧维度，也包含虔敬与尊崇；传统而自然的“敬畏”较能保留这种神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句中加入“就是”以清楚表达希伯来文无系词名词句的判断关系；保留四项并列及“冠冕”意象。脚注标记置于正文句末。
