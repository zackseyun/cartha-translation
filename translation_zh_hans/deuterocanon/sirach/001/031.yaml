base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/031.yaml
  text: My son[a], do not be false in the fear of Yahweh[b], and do not draw near to him with a divided heart.
translation:
  language: zh_hans
  text: 我儿[a]，敬畏雅威，不可虚假；也不可怀着二心[b]亲近他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本作：“我儿，敬畏雅威，不可虚假；也不可怀着二心亲近他。”希腊文本在本节却作：“报答恩惠的人会顾念以后的事；在跌倒的时候，他必找到扶持。”
    reason: textual_variant
  - marker: b
    text: “二心”原文直译为“心和心”，是指内心不专一或表里不一的希伯来语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留阳性单数呼语以及智慧文学中长者对儿子的教诲语气；现代汉语中简洁而庄重。
- source_word: אַל תְּכַזֵּב
  choice: 不可……虚假
  rationale: כזב在此不只指口头说谎，也可指在敬畏上不真诚、表里不一；“虚假”保留较宽的伦理含义。
- source_word: בְּיִרְאַת יְהֹוָה
  choice: 在敬畏雅威的事上
  rationale: 保留智慧文学中的核心用语“敬畏”，并按所给神学决策将四字神名译作“雅威”；补出“的事上”使介词结构符合自然汉语。
- source_word: וְאַל תִּקְרַב אֵלָיו
  choice: 也不可……亲近他
  rationale: קרב אל表示走近、接近；“亲近”既自然，又保留关系性及可能的敬拜语境，不将其缩减为单纯空间移动。
- source_word: בְּלֵב וָלֵב
  choice: 怀着二心
  rationale: 原文直译为“以心和心”，是表示内心不专一或虚伪的习语。“二心”保留希伯来语意象，并为现代中文读者所能理解。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；依所给项目决策采用“雅威”，以明确呈现专名，而不以称号代替。
- issue: 希伯来文本与希腊平行文本内容严重不一致
  choice: 正文翻译现存希伯来见证，并在脚注完整说明希腊异文
  alternative: 改译希腊文本；将两种读法合并
  rationale: 现存希伯来文清楚且置信度高，应按原文优先原则作为正文；希腊文保存的是实质不同的格言，不能静默协调或混合，故在脚注中如实保留。
- issue: בְּלֵב וָלֵב 所表达的内心状态
  choice: 二心
  alternative: 心怀两意；怀着虚伪的心
  rationale: “二心”保留原文“心和心”的形象及其蓄意不专一、表里不一的张力，而不把它限定为单一心理解释。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学劝诫语体。“不可”体现禁令语气；“我儿”保留原文的男性单数称呼。脚注标记均置于正文相关位置；希腊异文不与希伯来正文混合。
