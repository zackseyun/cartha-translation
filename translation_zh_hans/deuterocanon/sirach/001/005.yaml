translation:
  language: zh_hans
  text: 智慧的根向谁显明了？她的精微，谁知道？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“智慧的源泉是高天中上帝的话；她的道路是永恒的诫命。”这里的希伯来文见证与希腊文有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁרֶשׁ
  choice: 根
  rationale: 希伯来文直译为“根”，以具体比喻表达智慧的起源或根基；不按希腊文的“源泉”加以调和。
- source_word: הַחָכְמָה
  choice: 智慧
  rationale: 这是智慧文学中 חכמה 的常规译法，并保留其拟人化表达。
- source_word: לְמִי נִגְלָה
  choice: 向谁显明了
  rationale: 保留介词所表达的“向谁”以及 Niphal 被动语态的启示、显露含义。
- source_word: מַעֲרֻמֶּיהָ
  choice: 她的奥秘
  rationale: 该词可指精微、隐微或巧妙之处；“奥秘”在现代中文中自然地表达智慧难以洞悉的深层内涵，同时避免“诡计”等负面含义。
- source_word: מִי יָדַע
  choice: 谁曾知道
  rationale: “知道”直接对应 ידע；“曾”体现完成式，并使反问在中文中自然。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本存在重大差异
  choice: 正文依现存希伯来文翻译，并在脚注保留希腊文异读。
  alternative: “至高处上帝的话是智慧的源泉，她的道路是永恒的诫命。”
  rationale: 以现存原文见证为正文依据，不把希腊文本的不同措辞混入希伯来文；但该差异涉及整句内容，须以脚注公开呈现，而不予忽略或消解。
translation_notes:
  register: 采用现代、庄重而简明的书面普通话。“智慧的根”保留希伯来文意象；以“她”延续智慧的阴性拟人化。两个反问句保持原文的凝练与不可穷究之感。
