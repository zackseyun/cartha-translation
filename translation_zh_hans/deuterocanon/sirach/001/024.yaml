base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/024.yaml
  text: In the treasures of wisdom are insightful sayings[b], but godliness[c] is an abomination to a sinner.[a]
translation:
  language: zh_hans
  text: 智慧的宝库里藏有知识的箴言[b]；敬虔在罪人看来却是可憎的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 卡哈纳版在此处所收的现存开罗藏经库希伯来文本大意为：“他必因她欢喜，她也必因他欢喜；永永远远不要离弃他。”这与本节希腊文本不符，因此正文依据希腊文见证翻译。
    reason: textual_variant
  - marker: b
    text: 或译：“知识的譬喻”或“理解的箴言”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν θησαυροῖς σοφίας
  choice: 智慧的宝库中
  rationale: 按希腊平行文本翻译；保留“宝库”的比喻，并以自然汉语表达智慧所蕴藏的丰富内容。
- source_word: παραβολαὶ ἐπιστήμης
  choice: 知识的箴言
  rationale: παραβολαί在智慧文学语境中可指箴言、格言或譬喻；“箴言”比“比喻”更贴合此处文体。ἐπιστήμης保留为“知识的”，不把其关系过度解释为单纯的形容词。
- source_word: βδέλυγμα
  choice: 所憎恶的
  rationale: 该词表达强烈厌恶、可憎之意；此译在现代汉语中自然，同时保留原文的强烈语气。
- source_word: ἁμαρτωλῷ
  choice: 罪人所
  rationale: 将与格理解为判断或感受的主体，即在罪人看来、为罪人所憎恶。
- source_word: θεοσέβεια
  choice: 敬畏上帝
  rationale: 该词指对上帝的敬畏与虔敬；“敬畏上帝”较“敬虔”更明确，也直接呈现其敬神含义。
theological_decisions:
- issue: 希伯来文本与希腊见证在本节严重不一致
  choice: 正文依据希腊文本翻译，并在脚注说明现存希伯来行文
  alternative: 以卡哈纳版所收希伯来行文作为正文：“他必因她欢喜，她也必因他欢喜；永永远远不要离弃他。”
  rationale: 所给希伯来行文与希腊《便西拉智训》1:24在内容上完全不同，且资料明确标为major_mismatch。希腊文本提供了本节连贯且可识别的见证，因此正文采用希腊文，同时不隐去希伯来材料的歧异。
- issue: θεοσέβεια的语义范围
  choice: 敬畏上帝
  alternative: 敬虔／虔敬
  rationale: 采用明确而非宗派化的表达，涵盖对上帝的敬重及由此产生的虔诚生活，不将其缩减为外在礼仪或某一特定神学传统。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智慧的宝库”保留智慧文学的诗性意象；“知识的箴言”避免让读者把παραβολαί局限理解为福音书式的比喻故事。所有脚注标记均置于相关词句之后。
