  text: All wisdom is from the Lord[a], and it is with him forever.
translation:
  language: zh_hans
  text: 一切智慧都来自雅威[a]，并且永远与他同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直用神名“雅威”；希腊文平行文本作“主”。
    reason: 说明希伯来文本与希腊平行文本在神名表达上的差异。
lexical_decisions:
- source_word: כָּל חָכְמָה
  choice: 一切智慧
  rationale: כָּל 表示无所遗漏的整体范围，חָכְמָה 在本书中指广义的智慧；译作“一切智慧”自然、庄重，也与希腊文 πᾶσα σοφία 相符。
- source_word: מֵיהֹוָה
  choice: 来自雅威
  rationale: 介词 מִן 表明来源，יהוה 是神的专名；“来自雅威”直接表达智慧的源头，并保留希伯来文本中的圣名。
- source_word: וִעמּוֹ הִיא
  choice: 并且与他同在
  rationale: עִם 加第三人称单数阳性后缀意为“与他同在”；希伯来文名词句中的系词在中文无需明说，代词 הִיא 所指的“智慧”也可依汉语习惯省略，以免生硬。希腊文 καὶ μετʼ αὐτοῦ ἐστιν 支持这一理解。
- source_word: לְעוֹלָמִים
  choice: 永远
  rationale: 该复数形式表达持续无尽的时间；“永远”是现代汉语中清楚自然的对应，也与希腊文 εἰς τὸν αἰῶνα 的方向一致。
theological_decisions:
- issue: 希伯来文 יהוה 的译法
  choice: 雅威
  alternative: 主／上主
  rationale: 希伯来见证直接使用四字圣名 יהוה，因此正文音译为“雅威”，不以称号取代；希腊平行文本则作 Κυρίου（“主”），故在脚注中说明。
- issue: “智慧”是否人格化
  choice: 不额外强化人格化
  alternative: 并且她永远与他同在
  rationale: חָכְמָה 和代词 הִיא 在希伯来语中为阴性，但此处仅凭语法性别不足以要求中文使用人格化的“她”；省略代词既合乎现代汉语，也不排除上下文可能逐步呈现的人格化色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“一切智慧都来自……”清楚表达来源；“并且永远与他同在”保持原文简洁，并保留智慧与神同在这一陈述的神学张力。
