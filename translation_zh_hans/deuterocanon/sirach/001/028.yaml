  text: Do not be hypocritical in the mouths of men[a], and watch your lips.
translation:
  language: zh_hans
  text: 在人前不要装假[a]，要谨慎自己的嘴唇。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文按字面可译为“在人们的口中”；也可理解为“在人群中”或“在人们面前”。
    reason: 保留ἐν στόμασιν ἀνθρώπων的特殊字面意象及其语义不确定性。
  - marker: b
    text: 所提供的现存希伯来文作：“我一切的话，你都要听从并实行；你就会被写在生命册上。”这句话似乎与本节不相配，因此正文依照希腊文翻译。
    reason: 说明希伯来文见证与希腊文本之间的重大错配及正文选择。
lexical_decisions:
- source_word: μὴ ὑποκριθῇς
  choice: 不要装假
  rationale: ὑποκρίνομαι在这里指虚假做作、扮演并非真实的样子。“装假”是简洁自然的现代汉语，保留伦理警告的力度，又不预先限定为某一种宗教意义上的“假冒为善”。
- source_word: ἐν στόμασιν ἀνθρώπων
  choice: 在人前
  rationale: 希腊文直译为“在人们的口中”，表达较为特殊，语境上很可能指在人群中或面对别人时的言行。“在人前”符合现代汉语习惯；原文意象及可能译法在脚注中保留。
- source_word: καὶ
  choice: ，要
  rationale: καί连接两个并列劝诫。汉语以逗号并承接第二个“要”表达，比机械译作“并且”更自然，同时保持平行结构。
- source_word: ἐν τοῖς χείλεσί σου πρόσεχε
  choice: 要留心自己的嘴唇
  rationale: πρόσεχε表示留意、谨慎，χείλη是“嘴唇”。此译保留身体意象，并让读者自然理解为应谨慎言语。
theological_decisions:
- issue: 现存希伯来文与本节希腊文严重不符时的底本选择
  choice: 本节正文依据希腊文翻译，并以脚注说明现存希伯来文异文。
  alternative: 照所提供的希伯来文译为“我一切的话，你都要听从并实行；你就会被写在生命册上”。
  rationale: 所提供的希伯来文句子与《便西拉智训》1:28的希腊见证在内容上完全不对应，并已标记为重大错配，可能属于别处。为避免把疑似错置的希伯来文直接当作本节正文，采用与本节编号相符的希腊见证，同时公开记录希伯来文情况，不掩盖文本问题。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“在人前不要装假”自然传达首句伦理劝诫；“留心自己的嘴唇”保留希腊文的身体意象和两分句之间关于言语的呼应。
