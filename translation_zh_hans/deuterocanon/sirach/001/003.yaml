base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/003.yaml
  text: The height of heaven and the breadth of the earth[a], and the depth of the abyss—who can search them out?
translation:
  language: zh_hans
  text: 天有多高，地有多广，深渊有多深[a]——谁能探究到底？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在“深渊”之后另有“和智慧”；按该异文，全句可译为：“天的高度、地的广度、深渊和智慧——谁能探究？”
    reason: textual_variant
lexical_decisions:
- source_word: רוּם שָׁמַיִם
  choice: 天有多高
  rationale: רוּם 在此表示垂直高度，与后文的广度、深度构成对应。译作“天有多高”比名词化的“天的高度”更符合现代汉语，同时保留度量意味。
- source_word: רֹחַב אָרֶץ
  choice: 地有多广
  rationale: רֹחַב 指宽度、广度；在宇宙性的并列结构中，אָרֶץ 指大地，而非某一地域。“地有多广”自然地承接“天有多高”。
- source_word: עֹמֶק תְּהוֹם
  choice: 深渊有多深
  rationale: עֹמֶק 表示深度，תְּהוֹם 指幽深的大水或宇宙性的深渊。“深渊”既保留其神秘、宏阔的意象，也与希腊文 ἄβυσσος 相符。
- source_word: מִי יַחֲקֹר
  choice: 谁能探究到底
  rationale: חקר 表示深入查考、穷究。疑问句隐含能力上的限制，汉语以“谁能”自然表达；“到底”传达穷尽探究之意，并非断言完全不可认识。
theological_decisions:
- issue: 希腊平行文本含“智慧”，现存希伯来文本无此语
  choice: 正文依高可信度希伯来文本，不加入“智慧”
  alternative: 依希腊文译作：“天有多高，地有多广，深渊和智慧——谁能探究到底？”
  rationale: 本节现存希伯来文本证据充足，应优先作为正文依据。希腊文所增“智慧”显著扩展了反问的范围，具有解释意义，因此在脚注中完整保留，而不混入正文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“有多高／有多广／有多深”的排比再现希伯来文“高度／广度／深度”的结构；末句用破折号凸显反问。脚注标记置于与希腊文增文相关的并列项之后。
