  text: The fullness of wisdom is to fear the Lord, and it makes them drunk from its fruits[b][a].
translation:
  language: zh_hans
  text: 智慧的丰盛，在于敬畏主；智慧使他们因其果实而沉醉。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文在此处有一行差异很大的文字：“她自古就在忠信的人中被建立；他的慈爱在他们的后裔中是信实的。”该行在所引版本中置于方括号内，并被标为与本节严重不符，因此主文采用希腊文读法。
    reason: textual_variant
  - marker: b
    text: “其果实”也可译作“她的果实”；希腊文的“智慧”为阴性，在《便西拉智训》中也常被拟人化。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλησμονὴ σοφίας
  choice: 智慧的丰盛
  rationale: πλησμονή表示充满、丰盛或充足；“智慧的丰盛”保留名词结构，也避免把它解释成主观的“满足”。
- source_word: φοβεῖσθαι τὸν κύριον
  choice: 在于敬畏主
  rationale: 不定式说明“智慧的丰盛”所包含的内容；“敬畏”同时保留畏惧与尊崇的张力，不弱化为一般的尊敬。
- source_word: μεθύσκει
  choice: 使……沉醉
  rationale: 该动词本义为使人醉；“沉醉”保留原文鲜明的比喻，又比“使……喝醉”更符合现代汉语智慧文学的庄重语体。
- source_word: αὐτούς
  choice: 他们
  rationale: 本节中的代词没有明说所指，语境上可能承接敬畏主的人；直译为“他们”可保留原文的简约与指代张力。
- source_word: ἀπὸ τῶν καρπῶν αὐτῆς
  choice: 因其果实
  rationale: ἀπό在这里表示醉意的来源；“因”在汉语中自然表达“从其果实而来”。αὐτῆς指智慧，主文用“其”避免过度强化拟人，另以脚注说明阴性形式。
theological_decisions:
- issue: 残存希伯来文与希腊文在本节严重不一致
  choice: 主文依据希腊文翻译，并在脚注列出有疑问的希伯来文异读
  alternative: 主文译作：“她自古就在忠信的人中被建立；他的慈爱在他们的后裔中是信实的。”
  rationale: 所给希伯来文在卡哈纳版本中置于方括号内，并被标为与本节严重不符；它与希腊文内容并不对应。因此本节主文由完整且位置明确的希腊见证控制，同时公开保留希伯来文证据，不将文本差异静默消除。
translation_notes:
  register: 采用现代、庄重而清楚的智慧文学语体。“智慧的丰盛”保留原文名词性表达；“沉醉”保存比喻力度。分号呈现定义与结果之间的关系；第二次明说“智慧”，使汉语指代清楚，但不补出“他们”具体是谁。
