  text: One alone is fearsome[b][a], God ruling over all her storehouses.
translation:
  language: zh_hans
  text: 智慧的根向谁显明了？她精妙的作为，谁曾知晓？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗基尼撒希伯来文本在此处与本节的希腊传统严重不合，其意约为：“唯有一位是可畏的，就是统管她一切宝库的上帝。”因此正文采用希腊文本。
    reason: textual_variant
  - marker: b
    text: “精妙的作为”也可译作“巧妙的运作”或“谋略”。希腊词有时可含“诡计”的贬义，但这里描述智慧，未必带负面意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα σοφίας
  choice: 智慧的根
  rationale: 以希腊平行文本为本节实际底本；“根”保留ῥίζα的具体比喻，不改释为“源头”或“根基”。
- source_word: τίνι ἀπεκαλύφθη
  choice: 向谁显明了
  rationale: 保留被动语态及启示、揭示之意，并采用自然的现代汉语问句。
- source_word: τὰ πανουργεύματα αὐτῆς
  choice: 她精妙的作为
  rationale: πανουργεύματα可指机巧的运作或谋略；此处以智慧为先行词，不宜无据引入“诡计”的贬义。“精妙的作为”兼顾其复杂、巧妙及行动性。
- source_word: τίς ἔγνω
  choice: 谁曾知晓
  rationale: “曾知晓”体现不定过去时在修辞问句中的概括意味，语气庄重而自然。
theological_decisions:
- issue: 希伯来见证与希腊传统严重不合时的底本选择
  choice: 正文依希腊文本翻译
  alternative: 按现存希伯来行译作“唯有一位是可畏的，就是统管她一切宝库的上帝”之类
  rationale: 所给希伯来文本被校勘资料标为重大不匹配，内容也不对应希腊传统的《便西拉智训》1:6。依资料所述原则，在希伯来文本缺失、不确定或错置时采用较完整的希腊见证，并在脚注中如实说明。
- issue: 智慧的语法性别与拟人表达
  choice: 用“她”指智慧
  alternative: 用“它”避免拟人化
  rationale: 希腊文αὐτῆς为阴性，承接σοφία；“她”保留原文的拟人色彩，但不把智慧解释为另一个独立神格。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两个并列修辞问句贴近希腊句法；“智慧的根”保留原文意象，“精妙的作为”避免生硬及不必要的贬义。
