revisions:
- from: 在这一切以先，智慧就已受造[a]；明智的悟性自亘古就有[b]。
  to: 在万物之先，智慧已被造[a]；明智的悟性自亘古以来就有[b]。
  rationale: 修订统一正文与希腊文见证及脚注引文，将 πάντων 译为“万物”，并以更精确、不过度解释的汉语保存希伯来文的替代读法。正文仍遵循既定文本判断，以希腊文的句法和核心意义为主；脚注清楚标示两种见证的实质差异。
