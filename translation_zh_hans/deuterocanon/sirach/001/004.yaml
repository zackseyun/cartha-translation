  text: Before all these, wisdom was created[b][a], and true understanding is from eternity.
translation:
  language: zh_hans
  text: 在万物之先，智慧已被造[a]；明智的悟性自亘古以来就有[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文作：“智慧比这一切都更大。”希腊文作：“在万物之先，智慧已被造。”正文从希腊文。
    reason: alternative_reading
  - marker: b
    text: 现存希伯来文作：“真理自亘古以来一直强盛。”希腊文作：“明智的悟性自亘古以来就有。”
    reason: alternative_reading
lexical_decisions:
- source_word: προτέρα πάντων
  choice: 在这一切以先
  rationale: 希腊文明确表达时间上的先在；“这一切”也承接上文所述受造之物。现存希伯来文则可直译为“胜过这一切”，故在脚注保留异文。
- source_word: ἔκτισται σοφία
  choice: 智慧就已受造
  rationale: 忠实表达希腊文完成时被动态，强调智慧在万物之前已经被创造；“受造”简洁庄重，也避免把智慧直接等同于造物主。
- source_word: σύνεσις φρονήσεως
  choice: 明智的悟性
  rationale: 保留“理解、悟性”与“审慎、明智”两个相近概念之间的修饰关系，不将其压缩成“真正的理解”，以免掩盖希腊文措辞。
- source_word: ἐξ αἰῶνος / מֵעוֹלָם
  choice: 自亘古就有
  rationale: 两种文本都指向极其久远、原初的时间。“自亘古”符合智慧文学的庄重语体；补出“就有”使希腊文省略系词的句子在现代汉语中自然。
theological_decisions:
- issue: 现存希伯来文与希腊文在两个分句中均显著不同
  choice: 正文依希腊文的句法和核心含义翻译
  alternative: “智慧胜过这一切，真理自亘古就已得胜。”
  rationale: 所给希伯来文本身以方括号标示，且与希腊见证在谓语及第二分句的主语上差异很大。依据材料所定的文本处理方向，正文采用较完整的希腊平行文本，同时以脚注如实保存现存希伯来读法，不强行调和。
- issue: 智慧的先存与受造
  choice: 译作“智慧就已受造”
  alternative: “智慧是伟大的”
  rationale: 这是希腊文 ἔκτισται 的直接含义。译文保留文本本身的神学张力，不把此处“智慧”的所指进一步教义化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“亘古”保留智慧文学的诗性；“明智的悟性”略带语义重叠，是为保存希腊文 σύνεσις φρονήσεως 的双重表达。脚注标记均置于相应正文之后。
