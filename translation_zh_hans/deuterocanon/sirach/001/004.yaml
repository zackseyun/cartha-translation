  source_fidelity: 正文应以希腊平行本为主：προτέρα πάντων 指“在万物之先”，ἔκτισται 为“已被造”，σύνεσις φρονήσεως 可译为“明智的悟性”，ἐξ αἰῶνος 则为“自亘古以来”。草稿的“这一切”保留了希伯来文 אלה 的色彩，但与希腊文 πάντων（万物）及脚注的引文不一致，宜改正。脚注对希伯来文两行的异读须更准确体现“智慧很大／胜过”及“真理强盛、占优势”的含义。
