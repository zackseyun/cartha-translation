base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/013.yaml
  text: One who fears Yahweh—his end will be good[a]; and at the end of his days he will be blessed.
translation:
  language: zh_hans
  text: 敬畏耶和华的人，必有美好的结局[a]；在他生命的末了，他必蒙福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证在本节有显著不同，作：“智慧的开端是敬畏主；智慧在母腹中就与忠信的人一同受造。”正文依据现存的希伯来文；因两种文本差异重大，特在此注明希腊异文。
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: 敬畏耶和华的人
  rationale: 分词 יְרֵא 在这里作名词用，指以敬畏上主为特征的人；译为“敬畏……的人”自然地保留泛指单数。神名 יהוה 依希伯来文本直译为“耶和华”，同时不把希腊本的 κύριος 混入正文。
- source_word: תִּיטַב אַחֲרִיתוֹ
  choice: 必有美好的结局
  rationale: טוב 与 אַחֲרִית 的组合指最终的结局良好；此译保留对终局的强调，避免窄化为物质上的兴旺。
- source_word: וּבְאַחֲרִית יָמָיו
  choice: 在他生命的末了
  rationale: 原文直指“他日子的末尾”；现代汉语用“生命的末了”既自然庄重，也保留临近人生终点的时间含义。
- source_word: יִתְבָּרָךְ
  choice: 他必蒙福
  rationale: 此处 Hitpael 形式按上下文取被动意义，与前句“美好的结局”构成平行；译文不进一步指定赐福者或福分的具体内容。
theological_decisions:
- issue: 现存希伯来文与希腊文在本节内容上显著不同
  choice: 正文依据现存且可信度高的希伯来文，脚注完整说明希腊异文
  alternative: 以希腊文为正文，或将希伯来文与希腊文合并调和
  rationale: 本节有现存希伯来见证，因此以其为正文；但希腊见证不是细微措辞差异，而是完全不同的句子，故必须在脚注中透明保留，不能静默忽略或加以调和。
- issue: יִתְבָּרָךְ 的被动与反身可能性
  choice: 按被动义译作“必蒙福”
  alternative: 译作“必自称有福”或“必祝福自己”
  rationale: 被动义最符合上下句关于敬畏者美好终局的平行关系；反身义在词形上虽非绝无可能，但在此语境中较不自然。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“美好的结局”紧贴希伯来语对终局的强调；“生命的末了”避免“日子的末尾”在现代汉语中的生硬感。脚注标记 [a] 已置于相关分句之后。
