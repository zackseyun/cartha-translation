  text: Love the fear of the LORD, and bless your heart in it; and do not fear.
translation:
  language: zh_hans
  text: 要爱敬畏耶和华，并要使你的心以此为乐；不要害怕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“明智人的心会领悟比喻；善于聆听者的耳朵是智慧人的心愿。”与这里的希伯来文本完全不同。
    reason: 所给资料标明两种古老文本传统之间存在重大差异；脚注呈现希腊文本，避免将其内容混入以希伯来文本为据的正文。
lexical_decisions:
- source_word: אֱהַב
  choice: 要爱
  rationale: 按希伯来文祈使语气直译，保留劝诫的力度。
- source_word: יִרְאַת יְהֹוָה
  choice: 对耶和华的敬畏
  rationale: יִרְאָה 在此指敬畏而非单纯恐惧；יהוה 译作“耶和华”，清楚保留专名。
- source_word: וְאַשֵּׁר בָּהּ לִבְּךָ
  choice: 让你的心因它而喜乐
  rationale: אַשֵּׁר 可表达使之有福、快乐；此处采用自然中文“使……喜乐”，בָּהּ 译为“因它”，所指仍是前句的敬畏。
- source_word: וְאַל תִּירָא
  choice: 不要害怕
  rationale: 保留 ירא 词根与前句“敬畏”的张力：敬畏耶和华，却不必害怕。
theological_decisions:
- issue: “敬畏”与“害怕”的并置
  choice: 分别译作“敬畏”和“害怕”，保留两者之间的张力
  alternative: 两处都译作“惧怕”
  rationale: 同一希伯来词根在语境中具有不同侧重；统一译法会使中文含混，并可能把对上帝的敬畏缩减为惊恐。
- issue: 希伯来文本与希腊平行文本严重不一致
  choice: 正文依据高可信度的希伯来文本，另以脚注交代希腊异文
  alternative: 采用希腊文本，或将两种文本拼合
  rationale: 任务所给希伯来来源明确且可信度高；拼合会制造任何单一文本传统都没有的内容。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“让你的心因它而喜乐”比字面化的“祝福你的心”更符合现代汉语，也能表达希伯来动词可能具有的使人快乐、蒙福之意。
