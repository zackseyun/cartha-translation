translation:
  language: zh_hans
  text: 在一切有血肉者中间，按着他的恩赐[a]；他又把她赐给爱他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与一切有血肉者同在”或“给一切有血肉者”。希腊语短语可理解为描述智慧在一切有血肉者中间的分授。
    reason: 原文μετά接属格可表示“与……”或“在……中间”；结合上下文，也可理解为智慧被分给一切有血肉者。
lexical_decisions:
- source_word: μετὰ πάσης σαρκός
  choice: 在一切有血肉的中间
  rationale: μετά接属格通常表示“与……同在”或“在……中间”；σάρξ在这里是集合性用语，指有血肉的受造者或必死者。此译保留原文具体而范围较宽的表达，不将其收窄为“全人类”。
- source_word: κατὰ τὴν δόσιν αὐτοῦ
  choice: 照着他的赐予
  rationale: δόσις可指给予或所赐之物；“照着他的赐予”既保留名词结构，也表明智慧的分授取决于他的给予。
- source_word: ἐχορήγησεν
  choice: 赐给
  rationale: χορηγέω有供给、供应、赐予之意；以智慧为宾语时，“赐给”在现代汉语中自然庄重，并保留主动施予的含义。
- source_word: αὐτήν
  choice: 她
  rationale: 阴性代词回指上下文中以阴性形象出现的“智慧”；用“她”保留原文的拟人化表达。
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: 给爱他的人
  rationale: 与格短语表示领受者；末尾阳性代词在语法和上下文中都指向上帝。
theological_decisions:
- issue: 本节两个代词的所指
  choice: “她”指智慧，“他”指上帝
  alternative: 把阴性代词非人格化地译作“它”；或不明确末尾“他”的所指
  rationale: 《便西拉智训》第1章将智慧拟人化为阴性，并以上帝为创造和分授智慧者。保留代词的性别和不同所指，可维持原文的文学与神学张力，而不另加教义解释。
- issue: “一切有血肉的”的范围
  choice: 保留可涵盖所有有血肉受造者的宽泛说法
  alternative: 译为“全人类”
  rationale: σάρξ的集合用法可能包括人类，也可能有更广范围；不宜在译文中无根据地限定为人类。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有血肉的”保留圣经式具体意象；“赐予”与“赐给”虽词根相近，但分别对应δόσις和χορηγέω。分号提示前半句是承接上文的片段，同时不擅自补入原文未提供的谓语。
