base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/014.yaml
  text: The beginning of wisdom is the fear of Yahweh[b][a], and with the faithful she was formed in the womb.
translation:
  language: zh_hans
  text: 智慧的开端是敬畏雅威；她与忠信的人一同在母腹中形成。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “形成”也可能译作“蒙保守”或“被保存”；希伯来语这个动词的辅音形式可按意为“看守、保存”的词根理解。
    reason: lexical_alternative
  - marker: b
    text: 希腊文的读法大不相同：“她在人间筑巢，作永恒的根基；她也必托付给他们的后裔。”希伯来文与希腊文见证在此有重大差异。
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: 智慧的开端
  rationale: 保留希伯来语结构及智慧文学中的惯用表达，主要指智慧的起点或根基，不将其窄化为“最重要的部分”。
- source_word: יִרְאַת יְהֹוָה
  choice: 敬畏雅威
  rationale: “敬畏”兼顾惧怕与崇敬的语义张力；יהוה按专名译作“雅威”。
- source_word: נֶאֱמָנִים
  choice: 忠信的人
  rationale: 该复数形容词作名词使用，既可含“可信可靠”之意，也有对上帝忠诚的宗教伦理意味；“忠信的人”自然且不过度限定。
- source_word: נוֹצְרָה
  choice: 形成
  rationale: 结合“在母腹中”的语境，理解为形成或孕育最为顺畅；但其辅音形式也可能来自“看守、保存”的词根，因此以脚注保留另一解。
- source_word: בַבָּטֶן
  choice: 在母腹中
  rationale: 在出生、形成的意象中，“母腹”比字面的“腹中”更明确自然。
- source_word: וְעִם
  choice: 与……一同
  rationale: 直接保留介词“与”的关系意义，并在汉语中以“一同”使句法流畅。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，不以称号代替。
- issue: 希伯来文本与希腊文本的重大差异
  choice: 正文依据现存希伯来文，脚注完整交代希腊异文
  alternative: 以希腊文作为正文：“她在人间筑巢，作永恒的根基；她也必托付给他们的后裔。”
  rationale: 现存希伯来文证据可信度高，故作为正文依据；但希腊见证并非小幅措辞差异，而是内容显著不同，必须明示，不能暗中调和。
- issue: 智慧的语法性别
  choice: 以“她”回指智慧
  alternative: 省略代词，译作“也与忠信的人一同在母腹中形成”
  rationale: 希伯来语动词为阴性单数，所指最自然是阴性名词“智慧”；用“她”保存原文拟人化色彩，但不进一步界定其位格或本体。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“敬畏”保留智慧文学术语的力度；“母腹”传达产前形成的意象。脚注标记按相关语句先后置于句末，正文不试图调和希伯来文与希腊文。
