  text: Do not go after your heart and your eyes[b][a], to walk in evil desires.
translation:
  language: zh_hans
  text: 不可随从自己的心和眼目[a][b]，行在邪恶的欲望中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邪恶的欲望”也可译作“邪恶的贪恋”或“所贪求的恶事”。“心和眼目”是具体的希伯来语表达，兼指内在的欲求与外在事物的吸引。
    reason: lexical_alternative
  - marker: b
    text: 本节的希腊文平行传统差异很大，作：“不要说：‘谁能制伏我？’因为主必向你施行报应。”此处正文采用希伯来文见证，并将希腊文保留为异文。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תֵּלֵךְ אַחֲרֵי
  choice: 不可随从
  rationale: הלך与אַחֲרֵי连用，意为“走在……之后、跟随”。“随从”既保留这一意象，也符合现代汉语表达。
- source_word: לִבְּךָ וְעֵינֵיךָ
  choice: 自己的心和眼目
  rationale: 保留希伯来文“心”和“眼目”的具体表达：前者指内在意愿和欲求，后者指外在所见带来的吸引，不将二者概括成单一的“欲望”。
- source_word: לָלֶכֶת
  choice: 行在
  rationale: 与句首הלך形成动词呼应；“行在……中”在庄重而自然的汉语中也能表达生活行为与道路。
- source_word: בַּחֲמוּדוֹת רָעָה
  choice: 邪恶的欲望中
  rationale: חֲמוּדוֹת可指所喜爱、贪求的事物或欲求；结合“心和眼目”及רָעָה的道德限定，此处译作“邪恶的欲望”最能传达语境，同时脚注保留其他可能性。
theological_decisions:
- issue: “心和眼目”的人论性意象
  choice: 正文保留“心和眼目”
  alternative: 不要随从自己的欲望；不要受情欲支配
  rationale: 希伯来文把内在意愿与外在吸引并列。保留具体意象可呈现经文对自我引导之欲求的警告，也避免将其窄化为某一种特定情欲。
- issue: חֲמוּדוֹת רָעָה的压缩表达
  choice: 邪恶的欲望
  alternative: 邪恶的贪恋；所贪求的恶事；邪恶的享乐
  rationale: 原词既可偏向主观欲求，也可偏向被贪求之物。上下文中“心和眼目”较支持主观欲望，但脚注说明词义范围，以保留原文的开放性。
- issue: 希伯来文与希腊文传统的显著差异
  choice: 正文依据所给高可信度希伯来文见证
  alternative: 采用希腊文：“不要说：‘谁能制伏我？’因为主必向你施行报应。”
  rationale: 本项目以所列希伯来文为原文依据；希腊文在本节内容完全不同，不能无声调和，因此以脚注明示平行传统的异文。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“随从自己的心和眼目”保留原文具体意象；“行在……中”维持前后הלך的动词呼应。脚注标记均在正文出现，并按[a][b]排列。
