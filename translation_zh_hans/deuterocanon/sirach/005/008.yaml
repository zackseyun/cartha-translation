  text: And you said, “His mercies are many; for the multitude of my iniquities he will forgive.”
translation:
  language: zh_hans
  text: 你说：“他的怜悯甚多；他会赦免我众多的罪孽。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行本作：“不要倚仗不义之财，因为在追讨之日，它对你毫无益处。”现存希伯来文本在这里则警告人不可仗着上帝的怜悯而妄想必蒙赦免。
    reason: textual_variant
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你却说
  rationale: 该完成式在劝诫语境中自然表达受劝者所说的话；用现代汉语现在时呈现习惯性或设想中的妄言。“却”体现上下文所含的反向警戒，但不改变话语内容。
- source_word: רַחֲמָיו רַבִּים
  choice: 他的怜悯很多
  rationale: 保留 רַחֲמִים 的复数/集合性意味及 רַבִּים 的数量表达；虽不如“他有丰富的怜悯”圆熟，却更贴近希伯来文，并与下句“再多”形成呼应。
- source_word: לְרֹב עֲוֹנוֹתַי
  choice: 我罪孽再多
  rationale: לְרֹב 在此可表达与数量相关的依据或情形。译为“我罪孽再多”既保留罪孽众多的意思，也自然呈现说话者恃恩而作的推断；避免生硬的“因我众多的罪孽”。
- source_word: עֲוֹנוֹתַי
  choice: 我的罪孽
  rationale: “罪孽”兼具行为邪恶与罪责的分量，比泛称“罪”更贴近 עָוֹן，并保留复数集合义。
- source_word: יִסְלָח
  choice: 他也会赦免
  rationale: 未完成式在此表达说话者对将来或必然结果的自信推断；“会赦免”自然保留这一情态，“也”显出不论罪多仍必获赦免的妄自推断。
theological_decisions:
- issue: 希伯来文本与希腊平行文本内容显著不同
  choice: 正文依现存希伯来文本，表达对倚仗上帝怜悯而妄想必蒙赦免的警戒，并以脚注保存希腊异文
  alternative: 依希腊文译为不可倚仗不义之财，因为降罚之日财富毫无益处
  rationale: 本节希伯来见证完整且可信度高，应作为正文依据；希腊文并非近似措辞，而是另一项实质不同的劝诫，故不应混合两者，却须在脚注中明确保留。
- issue: 是否把说话者的陈述改写成明确的神学断言
  choice: 保留为受劝者所说的直接引语
  alternative: 改写为“不要因为上帝怜悯丰富，就以为他必赦免你一切罪孽”
  rationale: 原文直接引述一种恃恩心态，并未在本句内部直接评断其真伪；保留引语可维持原有修辞和神学张力，避免把人的妄断写成经文作者的无条件应许。
translation_notes:
  register: 采用现代、庄重且易懂的劝诫语体。引语以自然汉语表达，同时尽量保留希伯来文中“怜悯很多”与“罪孽众多”的数量呼应。脚注标记置于整句引语之后。
