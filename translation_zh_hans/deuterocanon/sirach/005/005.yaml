base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/005.yaml
  text: Do not say[a], “I have sinned[b], and what has been done to me? Nothing,” for God is patient.
translation:
  language: zh_hans
  text: 不要说：“我犯了罪，会有什么事临到我呢？什么事也不会有。”因为上帝不轻易发怒。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不轻易发怒”是希伯来语惯用语，字面涉及“鼻子长”，意思是“发怒迟缓”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本作：“对于赎罪，不要毫无畏惧，以致罪上加罪。”希伯来文本警告人不可因上帝迟延发怒，就认定犯罪不会带来后果；两种文本都告诫人不可滥用上帝的怜悯而肆意犯罪。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: 直接保留希伯来语否定命令的语气，现代汉语自然明白。
- source_word: חָטָאתִי
  choice: 我犯了罪
  rationale: 完成体表示已经犯下的罪，并与说话者因暂未受罚而自我开脱的语境相合。
- source_word: וְמַה יֵעָשֶה לִי
  choice: 又会有怎样的事临到我呢
  rationale: 保留 יֵעָשֶׂה 的未完成体及被动意味，不把原文含混之处限定为已经发生的后果；“临到我”在现代汉语中也较为自然。
- source_word: מְאוּמָה
  choice: 什么事也没有
  rationale: 按上下文将这个省略式回答译明，表达说话者断言犯罪毫无后果。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达此处的解释关系：说话者以神迟延发怒为自己有恃无恐的理由。
- source_word: אֵל
  choice: 上帝
  rationale: 在此智慧文学语境中，这是现代标准汉语对该神称最自然、庄重的表达。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 准确传达希伯来语“长于鼻息”的惯用意义，即发怒迟缓；较“有耐心”更直接保留原文所指的神圣忿怒，同时自然易懂。
- source_word: הוּא
  choice: 隐含于谓语句式中
  rationale: 汉语在“上帝不轻易发怒”中无需另译代词，表达更自然。
theological_decisions:
- issue: 如何表达 אֶרֶךְ אַפַּיִם 所指的神圣宽容
  choice: 上帝不轻易发怒
  alternative: 上帝有耐心
  rationale: 原文明确使用表示“迟于发怒”的希伯来语惯用语。直译其实际含义既保留上帝会发怒的张力，也表明发怒有所迟延，避免把它弱化为一般性的耐心。
- issue: 希伯来文本与希腊平行文本的差异
  choice: 正文依高置信度希伯来见证翻译，并用脚注保存希腊异文
  alternative: 按希腊文译作“对于赎罪，不要毫无畏惧，以致罪上加罪”
  rationale: 指定的希伯来来源完整且置信度高，应作为正文依据；希腊文本差异显著，具有释经价值，故不混入正文而在脚注中如实说明。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“又会有怎样的事临到我呢？”保留希伯来语在未来后果与被动遭遇之间的含混；引语中的反问和自答体现说话者因暂未受罚而产生的有恃无恐。脚注标记均置于正文句末，以免打断引语内部的逻辑。
