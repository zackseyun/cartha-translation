  text: Do not rely on your own strength to walk after the desire of your soul[a][b].
translation:
  language: zh_hans
  text: 不要倚仗自己的力量，去追随你内心的欲望[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按希腊文平行文本可译作：“不要随从你自己和你的力量，照着你心里的种种欲望行事。”希伯来文则是：“不要倚仗自己的力量，去追随你内心的欲望。”
    reason: alternative_reading
  - marker: b
    text: “内心”所译的希伯来词也可指“自己”或“生命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: 不要倚仗
  rationale: שׁען的基本意思是“倚靠、依赖”。“倚仗”在现代汉语中自然、庄重，也保留了不可凭靠自身能力的警告。
- source_word: כֹּחֶךָ
  choice: 自己的力量
  rationale: כֹּחַ可指力量或能力。译作“自己的力量”清楚表达第二人称所有关系，并突出经文所警戒的自恃。
- source_word: לָלֶכֶת אַחַר
  choice: 去追随
  rationale: 原文直译为“走在……之后”，在这里表示行为上跟从。“去追随”既保留跟随的意象，又符合现代汉语表达。
- source_word: תַּאֲוַת
  choice: 欲望
  rationale: תַּאֲוָה可指愿望、欲求或贪欲；此处不必限定为性欲。“欲望”范围恰当，并以单数形式对应希伯来文。
- source_word: נַפְשֶׁךָ
  choice: 你心灵的
  rationale: נֶפֶשׁ语义包括生命、自我、心灵和欲求主体。“心灵”保留其人的内在生命这一表达层次，同时避免把它简单化为反身代词；其他可能译法列于脚注。
theological_decisions:
- issue: נַפְשֶׁךָ所表达的人论含义
  choice: 你心灵的
  alternative: 你自己的；你生命的
  rationale: “心灵”保留原文并非纯粹反身代词的可能性，但不把נֶפֶשׁ严格限定为与身体分离的“灵魂”。脚注说明其语义范围，以保留经文的含混性。
- issue: 希伯来文与希腊文平行文本的差异
  choice: 正文依循高可信度的希伯来文：“不要倚仗自己的力量”
  alternative: 依希腊文可译作“不要随从自己和自己的力量，照着心里的种种欲望行事”
  rationale: 现存希伯来文语法清楚，应作为正文依据；希腊文在动词支配关系及“心／心灵”的配置上不同，因此在脚注中完整保留这一异文，而不将两者调和。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“倚仗”保留原文依靠的意象；“追随”比直译“走在……之后”更符合现代汉语。正文和所有脚注标记一一对应。
