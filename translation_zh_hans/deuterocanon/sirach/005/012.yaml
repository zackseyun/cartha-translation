  yaml_path: translation/deuterocanon/sirach/005/012.yaml
  text: Do not trust in deceitful wealth[b][a], for it will not profit in the day of wrath.
translation:
  language: zh_hans
  text: 不要倚仗虚妄的财富[b]，因为在震怒之日，这些财富毫无益处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希腊平行传统则作：“你若有明悟，就回答你的邻人；若没有，就用手捂住你的口。”希伯来文本与此有显著差异；本译文以现存希伯来文本为准。
    reason: textual_variant
  - marker: b
    text: “虚妄的财富”也可译作“虚假的财富”“欺诈所得的财物”或“不可靠的财富”。希伯来语可指带有欺骗性质的财富，既可能是以不正当手段取得的，也可能是最终靠不住的。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח
  choice: 不要倚仗
  rationale: 希伯来语是否定命令；“倚仗”自然表达把信心寄托于某物的含义，也符合智慧文学的劝诫语气。
- source_word: עַל נִכְסֵי שֶׁקֶר
  choice: 虚妄的财富
  rationale: נִכְסֵי 指财产、资产或财富；שֶׁקֶר 可表示虚假、欺骗或不可靠。“虚妄的财富”保留了财富可能来路不正或终究靠不住的双重意味，而不把语义限缩为其中一种。
- source_word: כִּי לֹא יוֹעִילוּ
  choice: 因为……它们毫无益处
  rationale: 该动词表示不能带来益处、不能发挥作用。用“毫无益处”清楚传达财富届时无济于事；复数代词“它们”照应希伯来语复数形式。
- source_word: בְּיוֹם עֶבְרָה
  choice: 在震怒之日
  rationale: 保留原文正式而凝练的“……之日”结构；“震怒”传达 עֶבְרָה 强烈的愤怒及潜在审判色彩，但不擅自补明震怒的主体。
theological_decisions:
- issue: עֶבְרָה 是泛指愤怒，还是带有更强的审判意味
  choice: 震怒
  alternative: 愤怒；烈怒；审判
  rationale: 原词本身指强烈的怒气，并可在智慧文学语境中具有审判意味；译作“震怒”保留这种力度，却不把原文没有明说的主体补成“上帝”，也不直接释义为“审判”。
- issue: 希伯来文本与本节显著不同的希腊平行传统之间如何取舍
  choice: 以现存希伯来文本为正文
  alternative: 采用希腊文：“你若有明悟，就回答你的邻人；若没有，就用手捂住你的口。”
  rationale: 本节有可信度高的希伯来见证，故按原文优先原则译出；希腊传统反映明显不同的文本形态，应以脚注如实说明，而不取代正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倚仗”与“震怒之日”保留智慧箴言的凝练节奏；“虚妄”兼顾欺骗性与不可靠性。正文中的脚注标记均与脚注对应。
