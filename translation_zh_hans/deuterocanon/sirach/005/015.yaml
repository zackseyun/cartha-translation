  text: Be quick to listen[c][b][a], and with patience give a reply.
translation:
  language: zh_hans
  text: 要敏于倾听[c]，耐心地回答[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“以长的 רוח”，是表示耐心、克制性情或不轻易动怒的习语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耐心地回一句话。”希伯来语表达简练，其中的名词可指“话”“言语”或“答话”。
    reason: alternative_reading
  - marker: c
    text: 本节的希腊文本与现存希伯来文本差异很大，看来反映了另一种文本形态；这里以保存下来的希伯来文本为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: הֱיֶה מְמַהֵר
  choice: 要敏捷地
  rationale: 命令式与分词的组合表达迅速、随时准备的态度；“要敏捷地”保留劝诫语气，也适合庄重的现代汉语。
- source_word: לְהַאֲזִין
  choice: 聆听
  rationale: 此动词指留心倾听，不只是听见；“聆听”简洁地传达专注听取之意。
- source_word: וּבְאֶרֶךְ רוּחַ
  choice: 要耐心
  rationale: 希伯来语字面为“以长久的灵／气息”，是指耐性或克制脾气的习语；“耐心”在现代汉语中自然地表达其伦理含义。
- source_word: הָשֵׁב
  choice: 作答
  rationale: 该动词有归还、回应之意，与后面的“话语”连用时表示给出回应；“作答”保留回应动作，并使中文简练。
- source_word: פִּתְגָּם
  choice: 答话（合译为“作答”）
  rationale: 该词可指话、言语或格言；在“聆听”之后最可能指口头回应。正文以“作答”合译动词与名词，脚注保留较贴近字面的可能表达。
