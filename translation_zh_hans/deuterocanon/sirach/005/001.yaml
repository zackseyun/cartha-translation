  yaml_path: translation/deuterocanon/sirach/005/001.yaml
  text: Do not rely on your wealth[a], and do not say, “I have the power.”
translation:
  language: zh_hans
  text: 不要倚仗你的财富，也不要说：“我自己的力量足够了。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语此句较为压缩，字面涉及“我手的力量”；希腊语平行文本表达“这对我已经足够”或“我能自给自足”的意思。
    reason: 说明疑难原文及希腊平行文本所支持的另一种表达。
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: 不要倚仗
  rationale: שׁען本义为“倚靠”，在此比喻信赖、依靠；“倚仗”既自然，也保留了依靠某物自恃的语气。
- source_word: חֵילֶךָ
  choice: 你的财富
  rationale: חַיִל可指力量、能力、军力或财富；希腊平行文本χρήμασίν明确指向钱财、财物，因此此处采用经济意义。
- source_word: יֵשׁ לְאֵל יָדִי
  choice: 我自己的力量足够了
  rationale: 希伯来语短句压缩且略显异常，字面涉及“我手的能力/力量”；希腊平行文本Αὐτάρκη μοί ἐστιν表明其语意是自足。译文保留“力量”，并以“足够了”表达自恃自足的含义。
theological_decisions:
- issue: 如何在希伯来语疑难短句与希腊平行文本之间保持平衡
  choice: 将第二个禁令译为不可宣称自己的力量已经足够
  alternative: “我有能力”或“我的手有力量”
  rationale: 以现存希伯来文本为首要依据，保留其中“手/力量”的观念；同时参考希腊文本所见的“足够、自足”之意，避免把经文缩减成仅仅承认自己具有能力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“倚仗财富”传达以财物为依靠的警告；第二句保留原文的“力量”，并让希腊平行文本所体现的自足含义清楚可见。
