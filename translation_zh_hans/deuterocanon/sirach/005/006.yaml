  text: Do not say, “The LORD is compassionate; he will wipe away all my iniquities.”
translation:
  language: zh_hans
  text: 不要说：“耶和华是慈悲的，会抹去我一切的罪孽。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: 直接表达希伯来语否定命令，简洁自然。
- source_word: רַחוּם
  choice: 有怜悯
  rationale: 保留该形容词所表达的怜悯、慈悲属性；此处采用现代汉语中清楚而庄重的表述。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式呈现神名四字母。
- source_word: יִמְחֶה
  choice: 会抹去
  rationale: 对应 מחה 的擦除、抹去意象，并保留说话者以此推断将来结果的语气。
- source_word: כָל עֲוֹנוֹתַי
  choice: 我一切的罪孽
  rationale: עָוֹן兼有罪责与罪孽含义；“罪孽”可保留其道德和罪责色彩。
theological_decisions:
- issue: 神的怜悯与人对赦罪的错误推断
  choice: 按原文仅引述“耶和华有怜悯，会抹去我一切的罪孽”，不增补条件或解释
  alternative: 依希腊平行文本补入神的怜悯、愤怒和审判罪人的后半句
  rationale: 所给高可信度希伯来文本在本节只包含这句警戒；译文不借平行希腊文本扩写正文，也不替作者化解其中刻意保留的张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“抹去”保留原文的具体比喻；引号中的话呈现受警告者不可持有的想法，而不是译者对神怜悯的否定。
