translation:
  language: zh_hans
  text: 不可倚仗赦免，因而罪上加罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要拖延归向主，也不要一天推一天；因为主的愤怒必突然发出，在惩罚的时候，你必灭亡。”这里保存的希伯来文较短，特别强调不可凭恃赦免而继续犯罪。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶל סְלִיחָה
  choice: 倚仗赦免
  rationale: 介词与בָּטַח连用，标明所倚靠的对象；“倚仗赦免”自然传达把赦免当作继续犯罪凭据的语气。
- source_word: סְלִיחָה
  choice: 赦免
  rationale: 该名词指罪责得到宽赦；“赦免”在现代中文中庄重清楚，也比“宽恕”更贴近罪责获免的语境。
- source_word: אַל תִּבְטָח
  choice: 不可倚仗
  rationale: בטח意为信赖、倚靠；此处并非否定对赦免的信心，而是禁止凭恃赦免继续犯罪，因此译作“不可倚仗”。
- source_word: לְהוֹסִיף
  choice: 因而……加
  rationale: 不定式可表达目的或结果；“因而”保留两者间的联系，同时避免断言犯罪者必然怀有明确目的。
- source_word: עָוֹן
  choice: 罪
  rationale: עָוֹן可指罪孽、罪责或过犯；在重复结构中，“罪”最简洁自然，并侧重继续增加的恶行。
- source_word: עָוֹן עַל עָוֹן
  choice: 罪上加罪
  rationale: 保留希伯来语逐项叠加的形象，也是自然且庄重的现代汉语表达。
theological_decisions:
- issue: 赦免与持续犯罪之间的关系
  choice: 本节警告人不可把赦免当作继续犯罪的凭据。
  alternative: 较弱地理解为一般性劝诫：不要过度确信自己会获赦免。
  rationale: 希伯来文把“倚仗赦免”与“罪上加罪”直接相连；这是否明确表示主观目的仍有一定句法余地，故以“因而”保留目的或结果的张力。希腊平行文本则以拖延归向主、直至审判忽然临到来展开同一警告，而不是否认赦免本身。
translation_notes:
  register: 采用简洁、庄重而通俗的智慧文学劝诫语体。“不可”比“不要”略显郑重，但仍属现代标准汉语；“罪上加罪”保留原文的反复和累积感。
