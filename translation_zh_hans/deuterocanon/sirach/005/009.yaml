  text: For mercy and anger are with him[a], and his wrath comes to rest on the wicked.
translation:
  language: zh_hans
  text: 因为怜悯和怒气都与他同在[a]；他的烈怒会停留在恶人身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本传统在此另作：“不要随着每一阵风簸扬，也不要走每一条路；两舌的罪人也是这样。”这与现存希伯来文本差异很大，可能反映本节的另一种文本形态。
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的劝诫并说明理由；现代汉语中“因为”清楚自然。
- source_word: רַחֲמִים
  choice: 怜悯
  rationale: 该复数抽象名词通常表示慈悲怜悯；“怜悯”简洁庄重，并与“怒气”形成平衡。
- source_word: אַף
  choice: 怒气
  rationale: 字面与“鼻子”有关，但在希伯来语惯用法中表示愤怒；译作“怒气”，并与后句较强的“烈怒”有所区别。
- source_word: עִמּוֹ
  choice: 都在他那里
  rationale: 保留“与他同在”的基本空间性表达，同时用自然汉语说明怜悯和怒气都在他那里；不在正文中补出原文未明说的“上帝”。
- source_word: אֵל
  choice: 在……身上
  rationale: 此处标示烈怒停留的对象或目标；“在恶人身上”符合现代汉语搭配。
- source_word: רְשָעִים
  choice: 恶人
  rationale: 准确表达复数实词化形容词，指作恶或邪恶的人；汉语可用集合性的“恶人”。
- source_word: יָנוּחַ
  choice: 必停留
  rationale: נוח 表示安歇、落定或停驻；“停留”保留烈怒落在目标之上而不离开的意象，“必”体现未完成式在此语境中的将来或确定意味。
- source_word: רָגְזוֹ
  choice: 他的烈怒
  rationale: 该词表示激动、震怒；译作“烈怒”比前句的“怒气”更强，也保留审判语气。
theological_decisions:
- issue: 代词后缀“他那里”和“他的烈怒”所指为何
  choice: 正文保留代词，不直接补出“上帝”
  alternative: 译作“上帝既有怜悯，也有怒气；他的烈怒……”
  rationale: 上下文足以表明所指是上帝，但希伯来文本本句没有明说神名。保留代词既自然，也避免把语境信息当作明文增补。
- issue: 希伯来文本与希腊传统存在重大差异
  choice: 以现存希伯来文本为正文，并在脚注完整保存希腊异文
  alternative: 采用希腊文：“不要随每一阵风簸扬，也不要走每一条小路；口是心非的罪人就是这样。”
  rationale: 本项目在《便西拉智训》希伯来文可靠存世处以希伯来见证为先；希腊文本内容差异显著，可能代表不同文本形态，因此不能静默忽略，须列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“怜悯—怒气—烈怒”保留原文由慈悲与愤怒并置而形成的神学张力；分号呈现两小句的平行关系。脚注标记[a]已置于与异文相关的整句末段前界位置。
