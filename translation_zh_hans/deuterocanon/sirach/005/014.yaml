  text: Be firm in your understanding[a], and let your word be one.
translation:
  language: zh_hans
  text: 要坚定自己的见识；你说话要一致。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不可被称为说闲话的人，也不可用舌头设伏；因为羞耻临到盗贼，严厉的谴责临到口是心非的人。”此文本与现存希伯来文的表述不同；其中对口是心非的谴责，与“你说话要一致”相近。
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֶה סָמוּךְ
  choice: 要坚定地持守
  rationale: היה的祈使式与סמוך合起来表达处于稳固、坚定的状态。译为“要坚定地持守”既传达劝诫语气，也避免生硬直译为“要被支撑”。
- source_word: עַל דַּעְתֶּךָ
  choice: 你的见识
  rationale: דעת可指知识、理解或判断力；智慧文学语境中的“见识”兼顾理解与审慎判断，并能自然地与“持守”搭配。
- source_word: וְאֶחָד יְהִי
  choice: 要始终如一
  rationale: 希伯来文直译为“要是一个／一”，在此修饰下文的“话”，强调言语不分裂、不反复。中文用“始终如一”自然表达这一伦理含义，同时由脚注说明其与希腊平行文本的关系。
- source_word: דְבָרֶךָ
  choice: 你说的话
  rationale: דבר在此指人的言语。译作“你说的话”比“你的话语”更符合现代汉语，同时保留单数集合意义。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本差异显著：希伯来文强调稳固的见识和一致的言语，希腊文则直接警告暗中诽谤与口是心非。
  choice: 正文依据现存希伯来文，译为持守见识、言语始终如一；以脚注保留希腊平行文本的不同表述。
  alternative: 依据希腊文译作：“不要被人称为搬弄是非者，也不要用舌头设伏……口是心非的人必受严厉谴责。”
  rationale: 在希伯来文保存可靠之处，以希伯来见证为正文基础；同时不抹去希腊文本可能反映的异本或扩展。两者在反对虚假、分裂的言语方面仍有概念联系。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“见识”保留דעת在理解与判断之间的宽度；“始终如一”自然传达“一个”的语用含义，但不把正文扩写成希腊文本所明确表达的诽谤主题。
