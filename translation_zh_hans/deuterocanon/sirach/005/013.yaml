  text: Do not be a winnower to every wind[b][a], or walk on the path of the storm.
translation:
  language: zh_hans
  text: 不要随每一阵风扬谷，也不要走上风暴的道路。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来语“שִׁבֹּלֶת”含义不确定，可能指“风暴”或“洪流”；在其他语境中也可指“谷穗”。译文采用与前半句“风”的意象较相称的“风暴”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语平行文本的内容很不相同：“尊荣与羞辱都在言语中；人的舌头使他跌倒。”本译文依据现存的希伯来语文本。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיֶה
  choice: 不要作
  rationale: 这是以否定词אַל配合未完成式表达的劝诫性禁令；“不要作”简洁保留了“成为／充当”的含义。
- source_word: זוֹרֶה
  choice: 扬谷的人
  rationale: 该词源于זרה，描写借风簸扬谷物、使糠秕与谷粒分开的动作；译文保留具体的农业比喻，而不直接释为“反复无常的人”。
- source_word: לְכָל רוּחַ
  choice: 逢风就
  rationale: 直译接近“对每一阵风”；“逢风就”在现代汉语中自然地表达不加分辨地顺应每阵风，同时保留风的意象。
- source_word: וּפוֹנֶה
  choice: 也不要转向
  rationale: ו连接并列的第二项警告，פנה表示转向；汉语补出延续前句的否定，使禁令范围清楚，但不把它处理为独立的肯定陈述。
- source_word: דֶרֶך
  choice: 道路
  rationale: 采用常见的具体义“道路”，与“转向”搭配，并保留原文的路径意象。
- source_word: שִׁבֹּלֶת
  choice: 风暴
  rationale: 此处词义不确定；结合前半句的“风”和全句关于动荡、偏转的意象，采用气象性的“风暴”，同时以脚注保留“洪流”等可能。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“逢风就扬谷”保留原文具体而略显突兀的农业比喻，不将其直接解释成抽象的“随风摇摆”；后半句保留“转向—道路”的路径意象。两个文本问题均以脚注说明。
