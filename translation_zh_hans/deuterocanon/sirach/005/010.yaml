base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/010.yaml
  text: Do not delay to return to him[b][a], and do not put it off from day to day.
translation:
  language: zh_hans
  text: 不要迟延归向他[b]，也不要一天又一天地拖延[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不要从一天拖到下一天。”第二分句所用的希伯来语动词较难确定，但上下文清楚表明是在说一再拖延。
    reason: lexical_alternative
  - marker: b
    text: “归向他”很可能是指悔改并归向上帝，但希伯来原文这里只说“他”。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: 这是希伯来语中表示禁止的常用否定词；译作“不要”准确而自然。
- source_word: תְּאַחֵר
  choice: 迟延
  rationale: 该词在这里表示耽搁、推迟；与后面的“归向”搭配，清楚传达不可犹豫拖延的劝诫。
- source_word: לָשׁוּב
  choice: 归向
  rationale: שוב的基本义是“返回、回转”。此处很可能具有在道德和信仰上回转的含义；“归向”既保留这一层意味，也不额外加入原文没有明说的“悔改”等术语。
- source_word: אֵלָיו
  choice: 他
  rationale: 原文只使用第三人称代词，其所指可由上下文理解；译文保留“他”，不擅自补成“上帝”或“主”。
- source_word: תִּתְעַבֵּר
  choice: 拖延
  rationale: 这个动词的形式和确切含义较难确定，但与前句“不要迟延”平行，并受“从一天到一天”这一短语限定，语境明显指反复推迟。
- source_word: מִיּוֹם אֶל יוֹם
  choice: 一天又一天地
  rationale: 直译为“从一天到一天”，在此表示日复一日地推迟；“一天又一天地”符合现代汉语表达，也保留反复拖延的意味。
theological_decisions:
- issue: 是否明确说明所归向的是上帝，并将“归向”直接译成悔改
  choice: 保留原文含蓄的说法“归向他”
  alternative: “悔改归向上帝”或“归向主”
  rationale: 上下文中的“他”很可能指上帝，而“归向”也很可能包含悔改之意；然而本节希伯来文本没有出现“上帝”“主”或专门表示悔改的附加词，因此正文不将隐含意义明说，以保留原文的神学含蓄性。
- issue: 如何处理第二分句中含义较难确定的תִּתְעַבֵּר
  choice: 按上下文译为“拖延”
  alternative: “推迟”“耽搁”或较直译但语意不明的表达
  rationale: 前后分句的平行关系以及“一天又一天”的时间短语，都强烈支持“反复推迟”这一理解。此处希腊文本与希伯来传统内容显著不同，故不据希腊平行文本改写高可信度的希伯来正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“归向”保留宗教语境中的回转含义，同时仍是普通读者可以理解的表达；“一天又一天地拖延”自然呈现希伯来语所强调的连续推诿。脚注标记均置于正文相关词句之后。
