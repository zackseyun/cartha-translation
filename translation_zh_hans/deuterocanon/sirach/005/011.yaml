base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/011.yaml
  text: For suddenly his wrath will come forth[a], and at the time of vengeance you will be swept away.
translation:
  language: zh_hans
  text: 因为他的震怒会突然发作；到追讨之时，你必被一扫而灭。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希腊文平行文本差异很大，意为：“在聆听上要敏捷；回答时要耐心作答。”正文依据现存希伯来文见证翻译；此处希伯来文传统与希腊文传统明显分歧。
    reason: textual_variant
lexical_decisions:
- source_word: פִתְאוֹם
  choice: 突然
  rationale: 按其常见副词义译为“突然”，保留警告中事发猝然的意味。
- source_word: יֵצֵא
  choice: 发出
  rationale: 保留 יצא“出来、发出”的基本意象；与“烈怒”搭配自然，又不将其完全意译为“爆发”。
- source_word: זַעְמוֹ
  choice: 他的烈怒
  rationale: זעם 表示强烈的愤怒或震怒；“烈怒”体现其严厉程度。保留第三人称领属形式，不在正文中直接补明为上帝。
- source_word: וּבְעֵת
  choice: 在……之时
  rationale: 较直接地保留希伯来语的时间结构，同时符合庄重的现代汉语表达。
- source_word: נָקָם
  choice: 报应
  rationale: נָקָם 可指报仇、施行报复或惩治；此处“报应”在现代汉语中较自然地表达审判性、惩罚性的后果，又避免使人误解为私人复仇。
- source_word: תִּסָּפֶה
  choice: 你必被扫灭
  rationale: 该形式有被除灭、灭亡之意；“被扫灭”保留原词生动而猛烈的毁灭意象。
theological_decisions:
- issue: “他的烈怒”中代词所指
  choice: 正文保留“他的”，由上下文暗示所指为上帝／主
  alternative: 直接译作“上帝的烈怒”或理解为某位未指明的掌权者
  rationale: 本节希伯来文本只有第三人称领属后缀，并未重述上帝的名；保留代词既反映原文，也不把上下文推断写成明说。
- issue: נָקָם 的审判含义
  choice: 译作“报应”
  alternative: “复仇”或“惩罚”
  rationale: “报应”兼顾行为后果与施行惩治的语境；“复仇”在现代汉语中容易带上私人泄愤色彩，而“惩罚”则会削弱原词的追讨、报偿意味。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“他的烈怒必突然发出”略带原文意象但仍自然可懂；分号保留两项紧密相连的警告。脚注标记紧接存在文本异文的前半句。
