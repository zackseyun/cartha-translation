  text: Do not say[a], “Who can withstand his power?” for Yahweh seeks the persecuted.
translation:
  language: zh_hans
  text: 不要说[a]：“谁能抵挡他的力量？”因为雅威寻找受迫害的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“不要说：‘我犯了罪，又有什么事临到我呢？’因为主是宽容的。”这很可能反映了与现存希伯来文本不同的底本。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: 这是由否定词与未完成式构成的直接禁令；译为“不要说”简洁自然，也能直接引出后面的引语。
- source_word: מִי יוּכַל כֹּחוֹ
  choice: 谁能抵挡他的能力？
  rationale: 原文表达简略，字面结构略显困难。将 יוכל 理解为带有隐含对抗对象的“能够抵挡”，既保留疑问和警告语气，也不过度补足原文；כֹּחוֹ 译为“他的能力”。
- source_word: כִּי
  choice: 因为
  rationale: 引出禁止这样说的理由；“因为”清楚保留原文的因果关系。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译明确呈现四字神名，区别于作为称号的“主”。
- source_word: מְבַקֵּשׁ
  choice: 寻求
  rationale: 忠实保留 בקש 的基本义，同时避免把神如何回应受迫害者解释得过细。
- source_word: נִרְדָּפִים
  choice: 受迫害的人
  rationale: 这是 רדף 的被动分词复数；在此伦理语境中，“受迫害的人”既自然，也保留被追赶、遭逼迫之意。
theological_decisions:
- issue: 希伯来文本与希腊文本显著分歧
  choice: 正文采用现存希伯来文本，希腊异文收入脚注。
  alternative: “不要说：‘我犯了罪，又有什么事临到我呢？’因为主恒久忍耐。”
  rationale: 本节有可用且可信度较高的希伯来文本，故以之为正文依据；但希腊文本差异涉及整句内容，很可能反映不同的底本，因此必须在脚注中如实保留。
- issue: “寻求受迫害的人”的神学含义
  choice: 保留“寻求”，不具体解释为拯救、伸冤或追讨。
  alternative: “为受迫害的人伸冤”或“寻找受迫害的人”
  rationale: 原文 בקש 的含义较宽。上下文可能暗示神关切并介入，但正文不应把这一动作限定为某一种神学结果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“谁能抵挡他的能力”保留希伯来语的简略和修辞张力；“受迫害的人”比名词化的“受迫害者”更贴近日常表达。脚注标记紧接“说”之后，提示整个后续引文及理由在希腊传统中存在异文。
