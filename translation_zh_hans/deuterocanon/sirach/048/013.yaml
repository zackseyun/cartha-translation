base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/013.yaml
  text: In his days he did not tremble before anyone[a], and no flesh mastered his spirit. No word was too wondrous for him[b], and beneath him his flesh was created.
translation:
  language: zh_hans
  text: 他一生从不因任何人战栗，也没有一个血肉之人能辖制他的灵。没有一句话对他而言太奇妙[b]；在安睡中，他的身体说出预言[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句依照希腊文平行文本。现存希伯来文作“在他下面（或：在他之后），他的肉身被造”，意思晦涩，可能存在文本问题。
    reason: textual_variant
  - marker: b
    text: “话”也可译作“事”。希伯来文 דָּבָר 可有这两种意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: מימיו
  choice: 他一生
  rationale: 这是表示一生之中或在世之日的时间习语；译作“他一生”自然、庄重，也符合现代汉语。
- source_word: לא זע מכל
  choice: 从不因任何人战栗
  rationale: זע 表示震动或战栗；מכל 可指任何人或任何事物。上下文强调先知不受人威吓，因此正文采用“任何人”，但不把含义强化为一般性的无所畏惧。
- source_word: ולא משל ברוחו כל בשר
  choice: 也没有一个血肉之人能辖制他的灵
  rationale: כל בשר 字面为“所有血肉”，在这里泛指有血肉的人；משל ברוחו 表示对他的灵施行管辖。译文保留“血肉”意象，同时补出“人”以使汉语清楚。
- source_word: כל דבר לא נפלא ממנו
  choice: 没有什么话对他是太奇妙的
  rationale: דבר 可指“话”或“事”；נפלא מן 表示过于奇妙、超出能力范围。正文保留“话”，与希腊文 πᾶς λόγος 相呼应，并用脚注保留“事”的可能。
- source_word: ומתחתיו נברא בשרו / καὶ ἐν κοιμήσει ἐπροφήτευσεν τὸ σῶμα αὐτοῦ
  choice: 他在长眠中，身体仍发出预言
  rationale: 现存希伯来文末句字面意义晦涩，可能存在文本讹误；希腊文清楚地说“在睡眠中，他的身体说了预言”。“长眠”在汉语中保留睡眠意象，也让死亡语境自然可懂；“仍”表达其死后仍有先知性见证的语境含义。
theological_decisions:
- issue: 末句应依据现存希伯来文还是希腊文平行文本
  choice: 正文依据希腊文，译作“他在长眠中，身体仍发出预言”
  alternative: 按现存希伯来文字面可译为“在他下面，他的肉身被造”，或“在他之后，他的肉身被造”
  rationale: 现存希伯来文末句难以形成连贯意义，而希腊文读法明确，并符合上下文对以利沙死后能力的赞颂。正文采用希腊文，但脚注明示希伯来文本的困难，不掩盖文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“血肉”和“灵”的希伯来语意象，也保留末句“身体发出预言”的反常张力，不将其改写成解释性的神学陈述。脚注标记均置于所说明的正文词句之后。
