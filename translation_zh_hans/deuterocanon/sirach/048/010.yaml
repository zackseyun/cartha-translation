revisions:
- from: 你被记载下来，为指定的时刻预备[a]，要在上帝的烈怒发作以前止息怒气[b]，使父亲们的心转向儿女[c]，并复兴以色列各支派[d]。
  to: 你被记载，是为那时刻预备的[a]，要在上帝烈怒之前止息怒气[b]，使父亲们的心转向儿女[c]，并重建以色列各支派[d]。
  rationale: 修订仅处理可安全确定的汉语表达与细微的语义过度：首句改清楚其“为那时刻”与被记载者的关系；删去“发作”这一额外动作；以“重建”更直接表达建立／恢复各支派。脚注保留并略微中性化希腊文“责备”的说明。未改变希伯来文优先、希腊文作平行校核的处理，也未将“使心转向”解释性扩展为“和好”。
