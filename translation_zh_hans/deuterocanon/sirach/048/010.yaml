translation:
  language: zh_hans
  text: 你被记载，是为那时刻预备的[a]，要在上帝烈怒之前止息怒气[b]，使父亲们的心转向儿女[c]，并重建以色列各支派[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文开头较难确定，直译近于“被记载的、为那时刻预备的”；希腊文则作“为各个时机、在责备中被记载的”。
    reason: 翻译疑难及异文
  - marker: b
    text: 希伯来文较完整地说“在上帝的烈怒以前”；希腊文较简略，作“在盛怒以前”。
    reason: 文本异文
  - marker: c
    text: 希伯来文为复数“父亲们……儿女”；希腊文为单数“父亲……儿子”。
    reason: 文本异文
  - marker: d
    text: 希伯来文作“以色列各支派”；希腊文作“雅各各支派”。
    reason: 文本异文
lexical_decisions:
- source_word: הכתוב נכון לעת / ὁ καταγραφεὶς ἐν ἐλεγμοῖς εἰς καιρούς
  choice: 你被记载下来，为指定的时刻预备
  rationale: 希伯来文直译近于“被记载的、为时刻预备的”，措辞较难确定；希腊文也保留“被记载”及与特定时机相关的意思。译文保留“被记载”与“指定的时刻”两层含义，不把它单纯解释为任命。
- source_word: להשבית אף
  choice: 止息怒气
  rationale: להשבית意为使之停止或止息；“止息怒气”既贴近希伯来文，也符合庄重而自然的现代汉语。
- source_word: לפני חרון אל
  choice: 在上帝的烈怒发作以前
  rationale: 希伯来文明确提到“上帝的烈怒”，并带有怒火将要发作的意味；译文将这一较完整的读法置于正文。
- source_word: להשיב לב אבות על בנים
  choice: 使父亲们的心转向儿女
  rationale: 保留“使心转向”的先知性表达，不扩译为完全和解；“儿女”自然表达后代或孩子，并避免把关系不必要地限定为男性。
- source_word: ולהכין שבטי ישראל
  choice: 复兴以色列各支派
  rationale: להכין可指预备、坚立或整顿；结合以利亚带来更新的语境及希腊文καταστῆσαι，“复兴”较自然地表达重新建立、恢复秩序之意。
theological_decisions:
- issue: 希伯来文与希腊文见证在开头及怒气短语上的差异
  choice: 正文优先采用现存希伯来文的较完整含义，同时用脚注交代希腊文较短的读法。
  alternative: 按希腊文译作“那为各个时机、在责罚中被记载的人，要在盛怒以前平息怒气”。
  rationale: 本节有可靠的希伯来文见证，故以其为主要依据；但开头语法艰涩，需承认希腊文所保存的不同措辞，而不武断消除歧义。
- issue: “使父亲们的心转向儿女”的先知性含义
  choice: 保留“心转向”的原有意象。
  alternative: 使父亲与儿女和好。
  rationale: “和好”虽可能是经文所指的结果，却比原文说得更具体；保留原有表达能维持其与先知传统的呼应及解释空间。
- issue: 支派名称的文本差异
  choice: 正文采用希伯来文“以色列”。
  alternative: 依希腊文作“雅各”。
  rationale: 现存希伯来文在此清楚写作“以色列”，希腊文则写作“雅各”；两者所指相关，但文本差异应由脚注公开呈现。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“你”承接上下文对以利亚的直接称述；句式保留原文连续的不定式目的结构，以“要……使……并……”自然串联。所有重要文本差异均置于脚注，不在正文中混合不同见证。
