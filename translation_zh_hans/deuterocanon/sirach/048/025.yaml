  text: He declared what would be forever[b][a], and hidden things before they came.
translation:
  language: zh_hans
  text: 他宣告了直到永远将要发生的事[a]，也宣告了尚未到来的隐秘之事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到永远”也可译为“直到永世”或“直到时代终结”。希伯来文עד עולם与希腊文ἕως τοῦ αἰῶνος都表达延伸至无尽未来的时间范围。
    reason: lexical_alternative
  - marker: b
    text: “隐秘之事”也可译为“隐藏的事”或“秘密的事”。希腊文平行文本作“隐藏的事”（τὰ ἀπόκρυφα）。
    reason: lexical_alternative
lexical_decisions:
- source_word: עד עולם
  choice: 直到永远
  rationale: 希伯来语直译为“直到永远／直到永世”，与希腊语ἕως τοῦ αἰῶνος相符。中文采用庄重而自然的“直到永远”，保留其无尽的时间跨度。
- source_word: הגיד
  choice: 宣告／宣明
  rationale: 该动词意为告知、使人知道；在先知语境中，“宣告”庄重贴切。后半句为使中文句法清楚而复现其含义作“宣明”。
- source_word: נהיות
  choice: 将要发生的事
  rationale: 该词指未来的事情或将发生之事；希腊语τὰ ἐσόμενα也支持这一将来意义。
- source_word: ונסתרות
  choice: 隐秘之事
  rationale: 表示隐藏、未显露的事。“隐秘之事”既自然庄重，也不引入“次经”等后起技术含义。
- source_word: לפני בואן
  choice: 在……到来以前
  rationale: 贴近字面“在它们来到以前”。这里的“到来”可指这些事情发生或显现，保留原文的形象表达。
theological_decisions:
- issue: 先知所宣告之事的时间范围
  choice: 直到永远将要发生的事
  alternative: 他永远宣告将要发生的事／直到世代终结的未来之事
  rationale: 将“直到永远”与未来之事相连，符合希伯来语词序及希腊语平行文本，同时保留修饰关系上的一定张力，不把经文扩展为关于无所不知的系统性主张。
- issue: 隐秘之事如何被知晓
  choice: 在隐秘之事到来以前将它们宣明
  alternative: 在隐秘之事发生以前宣告它们
  rationale: 原文强调这些事尚未来到便已被告知；译文保留“到来”的意象，不进一步界定这种启示的方式或范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“宣告”体现先知语境；后半句复现为“宣明”，避免汉语中宾语关系含混。所有代词均指前述隐秘之事，不增添人物或教义解释。
