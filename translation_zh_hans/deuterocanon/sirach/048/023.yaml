  text: In his days the sun stood still[b][a], and life was added to the king.
translation:
  language: zh_hans
  text: 在他的日子，太阳停住了[b]，君王的寿命也延长了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 即君王的寿命得到延长；上下文所指的是希西家。
    reason: cross_reference
  - marker: b
    text: 希腊文本的说法较难理解，可译作“他阻住了太阳”或“太阳受了阻”；对应希伯来文本的“太阳停住了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עמד
  choice: 停住了
  rationale: 希伯来语本义为“站立”，以太阳为主语时表示运行停止；“停住了”在现代汉语中自然清楚，也与希腊语平行文本所含的受阻、停滞之意相符。
- source_word: השמש
  choice: 太阳
  rationale: 直接对应带定冠词的希伯来语名词；汉语通常无需另加定指成分。
- source_word: ונוסף
  choice: 也延长了
  rationale: 原文直译近于“被加上了”。结合“寿命”而言，“延长了”是自然的汉语表达；“也”承接前一分句的神迹叙述。
- source_word: חיי
  choice: 寿命
  rationale: 该词为“生命／年日”的复数构造形式；在君王获增年岁的语境中，“寿命”比机械译作“生命”更符合现代汉语，同时保留所增加的是在世年日之意。
- source_word: המלך
  choice: 君王
  rationale: 原文只称“王”，没有在本节直接写出希西家的名字；译作“君王”保持称号，并采用庄重而通俗的圣经叙事用语。
theological_decisions:
- issue: 是否在正文中直接点明君王是希西家
  choice: 保留“君王”
  alternative: 译作“希西家王”或“希西家”
  rationale: 希伯来语正文仅作“君王”，身份由上下文确定。保留称号可避免把解释性信息加入正文。
- issue: 太阳停住与希西家所得兆头之间的表达关系
  choice: 按希伯来语直译为“太阳停住了”
  alternative: 依相关叙事解释为“日影倒退了”
  rationale: 本节的希伯来语明确以太阳为主语并使用“站住／停住”；不以《列王纪下》或《以赛亚书》中日影倒退的具体表述替换本节措辞，以保留文本自身的概括方式。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“在他的日子”保留原文时代性表达；“君王”维持上下文称号。“寿命也延长了”比直译“生命被加给君王”更符合现代汉语，但脚注说明其具体含义。所有脚注标记均置于相关语句之后。
