  text: In his days Sennacherib came up and sent Rabshakeh[a]; he stretched out his hand against Zion and blasphemed in his pride.
translation:
  language: zh_hans
  text: 在他的日子，西拿基立上来，派遣了拉伯沙基；他向锡安伸手攻击，并在骄傲中说亵渎的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“并在狂傲中夸耀。”希伯来语见证则作“说亵渎的话”，正文依从希伯来语。
    reason: alternative_reading
lexical_decisions:
- source_word: עלה
  choice: 上来
  rationale: 保留希伯来语表示上行或军事进逼的基本意象；“上来”也符合庄重的历史叙事语体。
- source_word: וישלח
  choice: 派了
  rationale: 在差遣官员的语境中，“派了”比机械的“发送”自然，又忠实表达 שלח。
- source_word: רבשקה
  choice: 拉伯沙基
  rationale: 按传统音译保留这一亚述头衔或称谓；原文此处没有冠词，正文不另加“那位”或职衔解释。
- source_word: ויט ידו
  choice: 他伸手
  rationale: 直译希伯来语敌对行动的惯用表达，既保留身体意象，也不把具体军事行动解释得过满。
- source_word: על ציון
  choice: 攻击锡安
  rationale: 在敌对语境中 על 表示针对；用“攻击”使现代汉语读者清楚理解其敌意，同时与“伸手”搭配自然。
- source_word: ויגדף
  choice: 亵渎
  rationale: גדף 指带有不敬神意味的辱骂或毁谤；“亵渎”保留其神学分量。
- source_word: אל
  choice: 不明说亵渎的对象
  rationale: 此处 אל 可能指向对象“上帝”，也可能属于省略或文本不确定之处；正文不擅自补出“上帝”，以保存原文歧义。
- source_word: בגאונו
  choice: 在骄傲中
  rationale: גאון 在此表示狂傲、自高；“在骄傲中”贴近原文结构，并保持庄重简洁。
theological_decisions:
- issue: 希伯来语结尾“亵渎”与希腊语平行文本“夸耀”的差异
  choice: 正文依从现存希伯来语，译为“并在骄傲中亵渎”。
  alternative: “并在狂傲中夸耀。”
  rationale: 本节有可靠的希伯来语见证，应以其为主；但希腊语呈现了真实而重要的不同措辞，因此用脚注保存，而不在正文中消解差异。
- issue: 亵渎行为的对象是否明确为上帝
  choice: 正文保留隐含，不补出“上帝”。
  alternative: “并在骄傲中亵渎上帝。”
  rationale: 虽然上下文可使人联想到以色列的上帝，但希伯来语短句的句法与对象并非毫无歧义；不明确补足可避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“上来”“伸手”保留原文意象；“攻击”明确敌对方向。人名和地名采用常见圣经音译。脚注标记已在正文中以[a]出现。
