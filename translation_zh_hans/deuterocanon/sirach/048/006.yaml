translation:
  language: zh_hans
  text: 他使君王坠入毁灭[a][c]，又使显贵之人[b]从他们的床榻上下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坠入深坑”。希伯来语“שחת”既可指坑，也可指败坏或毁灭；希腊文平行文本作“进入毁灭”。
    reason: lexical_alternative
  - marker: b
    text: “显贵之人”也可译作“权贵”或“受尊崇的人”。
    reason: lexical_alternative
  - marker: c
    text: 这句话很可能呼应以利亚对君王和显要人物所宣告的审判，其中包括一位卧病在床的君王；参列王纪下1章。
    reason: cross_reference
lexical_decisions:
- source_word: המוריד
  choice: 他使……坠入／离开
  rationale: 这是ירד的使役分词，表达使人下降、倾覆。首分句用“使……坠入”保留下行与败亡的双重意味；次分句按汉语自然表达补出同一使役关系。
- source_word: מלכים
  choice: 君王
  rationale: 原文明确指“王”；“君王”符合经文语体，又不泛化为一般统治者。
- source_word: על שחת
  choice: 坠入毁灭
  rationale: שחת可指坑、坟墓、败坏或毁灭。此处希腊平行文本εἰς ἀπώλειαν支持结果意义“进入毁灭”；“坠入”也保留了המוריד的下降意象。
- source_word: ונכבדים
  choice: 又使尊贵的人
  rationale: נכבדים指有分量、受尊崇或地位显要的人。“尊贵的人”保留其宽泛含义，不把它限定为世袭贵族。
- source_word: ממטותם
  choice: 离开他们的床榻
  rationale: מטותם直指“他们的床／榻”，מן表示从其上或其中离开。“床榻”自然庄重，并保留可能涉及卧床君王的具体图景。
theological_decisions:
- issue: 第二分句应译作一般性的权势逆转，还是明确处理为以利亚审判卧床君王的典故
  choice: 正文保留“尊贵的人……床榻”的具体措辞，不明说疾病或特定人物
  alternative: 译作“使权贵离开病榻”，直接点明患病与典故
  rationale: 希伯来文和希腊文都只提到尊贵者及其床榻，并未明说“病榻”。可能的列王纪下1章背景可在注释中说明，不宜写入正文以消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“坠入毁灭”保存原文的下降意象和שחת的结果意义；第二分句用“离开他们的床榻”避免擅自加入“患病”，同时让汉语句法保持自然。
