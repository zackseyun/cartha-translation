translation:
  language: zh_hans
  text: 他使死人从死亡和阴间复起；他这样行，是照着耶和华的旨意[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“借着至高者的话。”希伯来文本作：“照着耶和华的旨意。”
    reason: textual_variant
lexical_decisions:
- source_word: המקים
  choice: 使……复起
  rationale: 希伯来语קום的使役分词在此描述以利亚使死者恢复生命；“使……复起”保留使役意义，又避免直接套用后期“复活”术语。
- source_word: גוע
  choice: 死人
  rationale: 此词指已经断气、死亡的人；“死人”自然庄重，并保留希伯来语和希腊语平行文本中的单数对象含义。
- source_word: ממות
  choice: 从死亡中
  rationale: מן表示脱离或离开；译作“从死亡中”保留原文紧凑的分离意象。
- source_word: ומשאול
  choice: 从阴间归回
  rationale: שאול指死者所在的领域；现代汉语圣经语境中“阴间”较能保留其古代以色列观念，又不将其缩减为坟墓。“归回”为使中文句意完整而补出，未另增神学断言。
- source_word: כרצון יהוה
  choice: 照着耶和华的旨意
  rationale: 希伯来文本直译为“按照耶和华的旨意”。主文依从高置信度的希伯来见证；希腊平行文本的异文收入脚注。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的传统译名表达四字神名，既明确是专名，也维持庄重语体。
theological_decisions:
- issue: 末句如何描述神的施行方式
  choice: 照着耶和华的旨意
  alternative: 借着至高者的话
  rationale: 希伯来见证作כרצון יהוה，希腊平行文本则作ἐν λόγῳ Ὑψίστου。主文优先采用希伯来原文，并在脚注保留这一会影响神学表达重点的异文。
- issue: 以利亚与神迹之间的施事关系
  choice: 以分词称以利亚为“使死人……复起的那一位”，并以末句限定其行动照着神的旨意
  alternative: 将神直接改写为使死人复活的唯一语法主语
  rationale: 原文语法将该行动归于以利亚，同时明确置于耶和华旨意之下；译文保留这种张力，不将人的执行与神的主权合并或对立。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“死人”比“尸体”更适合颂赞诗体；“阴间”保留שאול作为死亡领域的古代概念。为避免“从阴间”在中文中悬空，补入“归回”；脚注标记置于整句末尾，因为异文涉及末句。
