revisions:
- from: 使死人从死亡中复起、从阴间归回的那一位，是照着耶和华的旨意而行。[a]
  to: 他使死人从死亡和阴间复起；他这样行，是照着耶和华的旨意[a]。
  rationale: 删去无对应原文的“归回”，将“从死亡”和“从阴间”作为同一“使……复起”行动的并列补语。重组中文句法，使“照着耶和华的旨意”明确限定该行动，并把脚注标记移至异文所涉及的词语之后。
