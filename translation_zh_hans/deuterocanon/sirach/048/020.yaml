  text: Then they called to God Most High[a], and spread out their hands to him.
translation:
  language: zh_hans
  text: 于是，他们呼求至高的上帝[a]，向他伸开双手。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本接着说：“天上的圣者很快垂听了他们，并借着以赛亚的手拯救了他们。”
    reason: alternative_reading
lexical_decisions:
- source_word: ויקראו
  choice: 呼求
  rationale: 此处 קרא 指在祷告中向上帝求告；“呼求”既表达“呼唤”，也自然传达恳求之意。希腊文 ἐπεκαλέσαντο 亦支持“呼求、求告”的理解。
- source_word: אל אל עליון
  choice: 至高的上帝
  rationale: 第一个 אל 是介词“向”，第二个 אל 指“上帝”，עליון 是神圣称号“至高者”。“至高的上帝”在现代汉语中自然庄重，并保留紧凑的修饰关系。
- source_word: ויפרשו
  choice: 伸开
  rationale: פרש 在此描述祷告时展开或伸出双手的姿态。“伸开”符合现代汉语习惯，也保留动作形象。
- source_word: כפים
  choice: 双手
  rationale: כפים 可特指手掌，但在祷告姿势中汉语通常说“伸开双手”；“双手”自然地表达复数并避免“手掌”的生硬感。
- source_word: אליו
  choice: 向他
  rationale: 介词表达动作朝向上帝；“向他伸开双手”准确而自然。
theological_decisions:
- issue: 希伯来文本与较完整希腊平行文本的取舍
  choice: 正文只翻译现存希伯来文本，希腊文新增内容置于脚注。
  alternative: 将希腊文续句“天上的圣者很快垂听了他们，并借以赛亚的手拯救了他们”纳入正文。
  rationale: 本节所给希伯来见证清楚且可信度高，应作为正文依据。希腊文本可用于核对祷告用语，但其续句不见于现存希伯来文，不宜无说明地并入正文；以脚注保存可同时反映文本传统。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“呼求”保留祷告中的迫切意味；“伸开双手”清楚呈现祷告姿势。脚注标记置于与希腊文续句分歧相关的正文位置。
