  text: Then a prophet arose like fire[b][a], and his words were like a burning furnace.
translation:
  language: zh_hans
  text: 于是，有一位先知兴起，如火[a]；他的话语如同燃着的炉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“于是，以利亚先知兴起，如同火。”希伯来文这里只说“有一位先知兴起，如火”，但上下文显然是在讲以利亚。
    reason: alternative_reading
  - marker: b
    text: 希腊文平行文本作：“他的话语如火把般燃烧。”希伯来文作：“他的话语如同燃着的炉。”
    reason: textual_variant
lexical_decisions:
- source_word: עד אשר
  choice: 于是
  rationale: 此处承接前文并推进叙事；译作“于是”自然地引出以利亚，同时避免把这个短语僵化为严格的“直到”。
- source_word: קם
  choice: 兴起
  rationale: 用于先知人物的出现既贴近原文，也保留庄重、有力的语气；希腊文ἀνέστη亦支持这一表达。
- source_word: נביא
  choice: 有一位先知
  rationale: 希伯来文没有写出专名，故不在正文补入“以利亚”；“有一位”符合现代汉语，并保留原文的非专名表达。
- source_word: כאש
  choice: 如同烈火
  rationale: 保留直接而鲜明的火焰比喻；“烈火”比单说“火”更自然地传达人物显现的强烈形象，但未增添新的具体意象。
- source_word: ודבריו
  choice: 他的话
  rationale: 希伯来文为复数，汉语集合名词“话”无需形式上标出复数，也能涵盖其多次言说，并与希腊文单数读法保持必要的开放性。
- source_word: כתנור בוער
  choice: 如同燃烧的炉子
  rationale: 保留希伯来文的炉子意象，并较直接对应בוער“燃烧的”；不采用希腊文的“火把”意象。
theological_decisions:
- issue: 是否在正文明确指出这位先知是以利亚
  choice: 正文只译作“有一位先知”
  alternative: “以利亚先知兴起”
  rationale: 现存希伯来文没有以利亚之名，虽然上下文和希腊文都明确指向以利亚。以希伯来文为正文依据，并在脚注交代希腊文读法，可避免无声地协调文本。
- issue: 是否按希腊文改写后半句
  choice: 保留希伯来文“他的话如同燃烧的炉子”
  alternative: “他的话语如火把般燃烧”
  rationale: 希伯来文与希腊文在单复数、谓语结构和核心意象上均有差异；正文依从现存希伯来文，脚注保存重要的希腊平行读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文紧贴希伯来文，分号呈现两行诗句的平行结构；脚注标记分别紧随所说明的内容。
