base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/012.yaml
  text: Elijah was hidden in the storehouse[a], and Elisha was filled with his spirit. Twice as many signs, and many wonders[b], came from his mouth.
translation:
  language: zh_hans
  text: 以利亚被隐藏在宝库中[a]，以利沙充满了他的灵。他施行的神迹多一倍；他口中所出的话，尽是奇事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“以利亚被旋风遮蔽。”希伯来文本则作：“以利亚被隐藏在宝库中。”
    reason: textual_variant
  - marker: b
    text: “多一倍”原文直译为“两倍”或“双份”，可能呼应以利沙所得的双份。原文后半句十分简略；“他口中所出的话，尽是奇事”直译性地保留其将奇事与他的言语相连的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: שבאוצר נסתר
  choice: 被隐藏在宝库中
  rationale: 按现存希伯来文本直译“被隐藏在库房／宝库中”。虽然语意较隐晦，仍保留希伯来见证的独特措辞；希腊文本的显著异文列入脚注。
- source_word: ונמלא רוחו אלישע
  choice: 以利沙则被他的灵充满
  rationale: 后缀“他的”最自然地回指以利亚，希腊平行文本也支持这一理解。“灵”不作专名化处理，以免加入原文未明确表达的神学判断。
- source_word: פי שנים
  choice: 加倍
  rationale: 原文意为“两倍／双份”，句法简略，可能呼应以利沙所求的双份。译作“加倍”既自然，又不强行补出原文未说明的比较对象。
- source_word: אותות הרבה
  choice: 神迹
  rationale: אותות通常指“记号、神迹”；在此与“奇事”并列，译作“神迹”符合现代汉语的圣经语域。数量之多由上下文中的“加倍”表达。
- source_word: ומופתים כל מוצא פיהו
  choice: 他每次开口，都有许多奇事
  rationale: 原文高度凝练，字面近于“奇事——他口中每一次发出”。此译保留奇事与其言语之间的联系，同时使现代汉语通顺；“许多”也反映该句整体对大量异能作为的强调。
theological_decisions:
- issue: 开头希伯来文本与希腊文本的差异
  choice: 正文采用希伯来文本“以利亚被隐藏在宝库中”
  alternative: 采用希腊文本“以利亚被旋风遮蔽／卷走”
  rationale: 现存希伯来文本在本项目中是正文的首要依据；希腊读法古老、通顺，并与以利亚离世的叙事相呼应，因此作为重要异文保留在脚注中。
- issue: “他的灵”所指为何
  choice: 保留小写意义的“他的灵”，让“他的”自然回指以利亚
  alternative: 明确译为“上帝的灵”或“圣灵”
  rationale: 希伯来语后缀和希腊语对应表达都最自然地以以利亚为先行词。正文不把这一表达强化为原文未明说的圣灵论断。
- issue: “双份／加倍”与神迹的关系
  choice: 译作“他行了加倍的神迹”
  alternative: 译作“加倍的神迹和许多奇事都出自他口”
  rationale: 希伯来语句法压缩，既可看作对神迹数量的说明，也可能有意呼应以利沙承受双份的传统。正文采用自然而不过度具体的表达，脚注说明其字面和互文可能。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“宝库”刻意保留希伯来文本略显神秘的意象；分号用于呈现原文后半句的压缩并列关系。“神迹、奇事”保持传统圣经搭配，同时让普通读者容易理解。
