  text: By a spirit of might he saw the end[b][a], and he comforted the mourners of Zion.
translation:
  language: zh_hans
  text: 他凭着大能之灵看见了终局[a]，又安慰了锡安的哀悼者[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他以伟大的灵看见了末后的事。”希伯来文作：“他凭着大能之灵看见了终局。”
    reason: alternative_reading
  - marker: b
    text: 或译：“在锡安哀悼的人。”此译较贴近希腊文。
    reason: lexical_alternative
lexical_decisions:
- source_word: ברוח גבורה
  choice: 凭着大能之灵
  rationale: 介词ב可表示凭借或所处的状态；“凭着”保留工具性含义。גבורה指力量、大能；译作“大能之灵”紧扣希伯来文，同时不把“灵”进一步限定为某一特定神学所指。
- source_word: חזה
  choice: 看见了
  rationale: 该动词在此具有先知性、异象性的语境，但基本义仍是“看见”；直译可让上下文自然呈现其预见性质，避免增译解释。
- source_word: אחרית
  choice: 终局
  rationale: 该词可指结局、末后或将来。“终局”既保留“最终结局”的含义，也与希腊文τὰ ἔσχατα所表达的“末后的事”相呼应。
- source_word: וינחם
  choice: 又安慰了
  rationale: 此处נחם表示安慰、劝慰；“又”自然承接前一分句，并符合现代汉语叙述。
- source_word: אבלי ציון
  choice: 锡安的哀悼者
  rationale: 按希伯来文的构词关系直译为“锡安的哀悼者”，刻意保留他们是为锡安哀悼、属于锡安，还是身在锡安哀悼的可能含义。
theological_decisions:
- issue: ברוח גבורה所表达的先知性能力来源
  choice: 凭着大能之灵
  alternative: 在伟大的灵中
  rationale: 主文依据高可信度的希伯来文，呈现一种以“大能”为特征的灵使先知得以看见终局；不明确添加“圣”字，以免把原文未明说的身份直接确定下来。希腊文的“伟大的灵”作为异文信息收入脚注。
- issue: אבלי ציון中哀悼者与锡安的关系
  choice: 锡安的哀悼者
  alternative: 在锡安哀悼的人
  rationale: 希伯来文的属格结构本身有一定弹性，主文不将其限缩为地点关系；脚注列出希腊文较明确的地点性表达。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“终局”比“末日”更少附加特定末世论含义；“哀悼者”准确而易懂。两个脚注标记均置于其所说明的短语之后。
