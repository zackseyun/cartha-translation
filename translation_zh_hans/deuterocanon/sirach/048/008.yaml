translation:
  language: zh_hans
  text: 你在西奈使人听见责备之言[a]，在何烈听见报应的判决。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本的读法差异很大，大意是：“膏立君王以施行报应，又立先知在他以后继任。”希伯来文与希腊文似乎反映了本节不同的文本形态。
    reason: textual_variant
lexical_decisions:
- source_word: השמע
  choice: 使……被人听见
  rationale: 这是 שמע 的使役式，基本义为“使人听见”。希伯来文中该动词统领两个并列宾语；译文在第二分句补出谓语，使现代汉语清楚自然。
- source_word: בסיני
  choice: 在西奈
  rationale: 介词 ב 加地名在此表示事件发生的地点，译作“在西奈”。
- source_word: תוכחות
  choice: 责备之言
  rationale: תוכחות 指责备、斥责或劝诫；“责备之言”既保留其言语性质，也体现较强的训诫语气。
- source_word: ובחורב
  choice: 在何烈
  rationale: 同样将介词 ב 作为地点标记；חורב 采用现代中文圣经传统中通行的地名“何烈”。
- source_word: משפטי
  choice: 判决
  rationale: משפט 的复数构造形式可指判决、审判或施行公断；“判决”保留其司法语义，并与后面的 נקם 构成限定关系。
- source_word: נקם
  choice: 施行报应的
  rationale: נקם 可指报仇、惩罚或报应；译作“施行报应的”既保留惩治性的公义行动，又避免现代汉语中“复仇”可能暗示的私人泄愤。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在本节有重大差异
  choice: 正文依现存希伯来文，叙述在西奈使人听见责备、在何烈使人听见施行报应的判决。
  alternative: 希腊文大意为：“膏立君王以施行报应，又膏立先知接续他。”
  rationale: 本节希伯来文保存完整且证据可信，应作为正文依据。希腊文并非单纯措辞差异，而反映另一种文本形态，因此在脚注中完整说明，不将两种读法混合。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“使……被人听见”紧贴希伯来文使役结构；第二分句补出相同谓语，以免中文成为残缺短语。正文保留“西奈／何烈”的并列，不主动解释两者是否指同一地点。
