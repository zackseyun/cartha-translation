translation:
  language: zh_hans
  text: 他在世时行了奇事；在他死时，他的作为也令人惊叹。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在他的死亡中”；希腊文作“在他生命终结时，他的作为十分奇妙”。希伯来文末句的词形略有疑难，希腊文支持此处表达与他死亡或生命终结有关的奇妙作为。
    reason: alternative_reading
lexical_decisions:
- source_word: בחייו
  choice: 他在世时
  rationale: 介词短语表示以利沙一生在世的时期；这样译成现代汉语自然，也与希腊文 ἐν ζωῇ αὐτοῦ 相符。
- source_word: עשה
  choice: 行了
  rationale: עשה 是普通的“做、行”；与“奇事”搭配时，“行了”简洁庄重，不额外强化语义。
- source_word: נפלאות
  choice: 奇事
  rationale: 指非凡、令人惊奇的作为；“奇事”保留经文语体，同时不预先限定其性质。
- source_word: ובמותו
  choice: 他死后
  rationale: 希伯来文直译为“在他的死亡中”，指与他死亡相连而发生的事；结合上下文，现代汉语用“死后”最清楚，并与以利沙死后仍发生奇事的叙述相合。脚注保留更贴近字面的表达及希腊文异读。
- source_word: תמהי
  choice: 令人惊叹
  rationale: 希伯来文词形略有疑难，但上下文及希腊文 θαυμάσια 均支持“奇妙、令人惊叹”的含义。
- source_word: מעשה
  choice: 作为
  rationale: 希伯来文外形为单数，语义可作集合用法；希腊文则为复数并带“他的”。“他的作为”在中文中可涵盖集合意义，也避免生硬地强定单复数。
theological_decisions:
- issue: 希伯来文末句词形略有疑难时如何使用希腊文平行文本
  choice: 以希伯来文为主，将末句译为“他的作为也令人惊叹”，并以希腊文确认其基本意义。
  alternative: 严格按希伯来文字面译作“他的作为是惊人的”，或较贴近希腊文译作“在他临终时，他的作为十分奇妙”。
  rationale: 现存希伯来文应居首位，但 תמהי 的形式和 מעשה 的数存在轻微困难；希腊文清楚支持“他的作为是奇妙的”这一含义。译文保留希伯来文的核心措辞，不借机引入额外教义解释。
- issue: ובמותו 所指的时间关系
  choice: 译作“他死后”，表达与其死亡相连、随后发生的奇事。
  alternative: 译作“在他死时”或依希腊文译作“在他临终时”。
  rationale: 希伯来文表面为“在他的死亡中”，本身可容纳与死亡相连的时间范围；本章语境指向以利沙死后尸骨使死人复活之事，因此“死后”是自然且不过度解释的中文表达，同时用脚注呈现字面形式和希腊文差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在世时……死后……”构成清楚的时间对照；“奇事”“作为”“令人惊叹”既保留经文语感，又避免过度古雅。
