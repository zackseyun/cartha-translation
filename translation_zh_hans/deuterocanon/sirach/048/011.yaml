  yaml_path: translation/deuterocanon/sirach/048/011.yaml
  text: Happy is the one who saw you and died[a], and happy are you, for you will surely live.
translation:
  language: zh_hans
  text: 见过你而死去的人有福了[a]；你有福了，因为你必定存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“看见你的人，以及以爱为装饰的人，都是有福的，因为我们也必将存活。”希伯来文本则作：“你有福了，因为你必定存活。”
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי
  choice: 有福的
  rationale: 希伯来语祝福宣告惯用语，表达值得羡慕的福分；中文“有福的”自然、庄重，也保留经文的祝福语气。
- source_word: ראך
  choice: 看见你
  rationale: ראה的Qal完成式带第二人称阳性单数后缀，直译为“看见你”，此处“你”指以利亚。
- source_word: ומת
  choice: 而死去
  rationale: 保留连词与完成式的直接关系，不擅自加入“虽然”等让步解释；“而”使现代汉语句子通顺，同时维持原文的张力。
- source_word: ואשריך
  choice: 你也是有福的
  rationale: 第二人称后缀构成对以利亚的直接祝福宣告；“也”体现两个אשרי分句之间的平行。
- source_word: כי
  choice: 因为
  rationale: 将כי理解为说明第二个祝福宣告的理由，译作“因为”清楚而不过度阐释。
- source_word: חיה תחיה
  choice: 你必定活着
  rationale: 不定式绝对式与限定动词连用，强化“活”的确定性；“必定”传达这一强调结构。
theological_decisions:
- issue: 希伯来文本与希腊平行文本之间的关系
  choice: 正文以现存希伯来文本为准，并在脚注保留希腊文本的显著异文。
  alternative: 按希腊文译作：“看见你的人，以及以爱为妆饰的人，都是有福的，因为我们也将活着。”
  rationale: 本节有高可信度的希伯来见证，故正文优先依据希伯来文；希腊文后半节差异显著，脚注注明可保存文本证据及其神学张力，避免无声调和。
- issue: “看见你而死去”中死亡与福分的关系
  choice: 保留并列关系，不明确译成让步关系。
  alternative: “虽然死去，见过你的人仍是有福的。”
  rationale: 希伯来文只有连词ו，并未明确标示“虽然”；直译可保留死亡与有福之间的含蓄张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“有福的”保留智慧文学祝福宣告的语感；分号呈现两个平行分句。所有脚注标记均已置于正文。
