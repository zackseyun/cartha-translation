  text: Hezekiah fortified his city[a], and brought water into its midst; he cut through rock like bronze[b], and dammed up a reservoir in the mountains.
translation:
  language: zh_hans
  text: 希西家加固了自己的城，把水引到城中；他凿穿岩石，如同凿铜一般[a]，又在山间拦水成池[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本直译近于“他凿岩石，如同铜一般”，含义较难确定；希腊文本则作“他用铁开凿”。
    reason: textual_variant
  - marker: b
    text: 这句希伯来文十分简略，也可理解为“他堵住山中的水池”或“他在群山间筑成蓄水池”；希腊文本较笼统地说他修建了水源设施。
    reason: alternative_reading
lexical_decisions:
- source_word: יחזקיהו
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: חזק עירו
  choice: 加固了自己的城
  rationale: חזק用于城邑时指加强防御、使其坚固；“加固”既准确又符合现代汉语。
- source_word: בהטות אל תוכה מים
  choice: 把水引到城中
  rationale: הטה在此表示使水改道、流向某处；“引到城中”保留工程行动和城内供水的空间含义。
- source_word: ויחצב ... צורים
  choice: 凿穿岩石
  rationale: חצב指凿、开掘；结合引水工程，译作“凿穿岩石”比泛称“开采”更贴切。
- source_word: כנחשת
  choice: 如同凿铜一般
  rationale: 按现存希伯来文本保留כ的比较义和נחשת“铜、青铜”的通常词义；为使汉语关系清楚，补出“凿”。希腊见证的“用铁”列入脚注。
- source_word: ויחסום הרים מקוה
  choice: 在山间拦水成池
  rationale: 原文词序高度压缩；结合חסם“堵住、拦阻”和מקוה“聚水处、水池”，以自然汉语表达山地蓄水工程，同时在脚注保留其他句法可能。
