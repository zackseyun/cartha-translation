  text: By his word he restrained the heavens[b][a], and brought down fire three times.
translation:
  language: zh_hans
  text: 他凭自己的话封住了天[a]，又三次使火降下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处措辞简略且有疑义；正文按上下文理解为以利亚“凭自己的话”。希腊文平行本作：“凭主的话，他封住了天。”
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“三个火”；这里很可能指三次降火。希腊文平行本作“三次火”，支持这种按次数理解的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר אל
  choice: 凭上帝的话
  rationale: 按现存希伯来文本，אל最自然地理解为“上帝”，בדבר表示凭借或借着话语；希腊文“凭主的话”也支持这一理解。
- source_word: עצר שמים
  choice: 封住了天
  rationale: עצר有拦住、闭住之意；此处暗指天不降雨，但原文没有明说“雨”，故保留“封住天”的意象。
- source_word: ויורד
  choice: 使……降下
  rationale: 该动词在这里表达使役意义，指以利亚使火从上面降下。
- source_word: שלוש אשות
  choice: 使火三次降下
  rationale: 希伯来文直译为“三个火/三场火”，希腊文τρὶς πῦρ则明确呈现“三次降火”的理解；中文采用事件次数的自然表达。
theological_decisions:
- issue: 开头的话语应理解为以利亚自己的话，还是上帝的话
  choice: 正文译作“凭上帝的话”
  alternative: “他一发话”或“凭他的话”
  rationale: 现存希伯来文בדבר אל按字面最自然是“凭上帝的话”，希腊文的“凭主的话”进一步支持这一读法。鉴于希伯来文本在此较为简略，脚注保留按上下文指以利亚发话的另一种理解。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“封住了天”保留原文形象，不把未明说的“不降雨”加入正文；“使火三次降下”避免直译“三个火”在现代中文中的歧义。
