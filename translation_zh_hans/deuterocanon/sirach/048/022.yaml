base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/022.yaml
  text: For Hezekiah did what was good[a], and was strong in the ways of David, as Isaiah the prophet commanded him[b], the one praised among the prophets.
translation:
  language: zh_hans
  text: 因为希西家行了善[a]，并且在大卫的道路上刚强，照着先知以赛亚所吩咐他的去行——以赛亚在众先知中备受称颂[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“行了蒙主喜悦的事”；现存希伯来文只作“行了善”。
    reason: alternative_reading
  - marker: b
    text: 希腊文则称以赛亚为“伟大、在异象中忠信的先知”；希伯来文作“在众先知中备受称颂”。
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: 因为
  rationale: 保留其解释或说明上文的连接作用；现代汉语用“因为”自然地引出对希西家的陈述。
- source_word: עשה ... את הטוב
  choice: 行了善事
  rationale: 依现存希伯来文直译其道德评价，不把希腊文的“蒙主喜悦”纳入正文。
- source_word: ויחזק
  choice: 刚强
  rationale: 保留动词可能具有的不及物或反身意味，不增添希伯来文未明说的宾语。
- source_word: בדרכי דוד
  choice: 在大卫的道路上
  rationale: 保留圣经中以“道路”表示行为方式和生活典范的惯用表达。
- source_word: כאשר צוהו
  choice: 照着……所吩咐他的去行
  rationale: “吩咐”体现צוה较强的命令意味；补出“去行”使汉语句法完整，但不改变希伯来文所表达的遵命关系。
- source_word: ישעיה הנביא
  choice: 先知以赛亚
  rationale: 采用现代汉语自然且庄重的称谓次序。
- source_word: המהלל בנביאים
  choice: 在众先知中备受称颂
  rationale: 保留希伯来文的被动称颂之意，并明确该同位语指以赛亚，避免汉语中的修饰关系含混。
theological_decisions:
- issue: 是否把希腊文的“蒙主喜悦”纳入正文
  choice: 正文仅译作“行了善事”
  alternative: 行了蒙主喜悦的事
  rationale: 现存希伯来文只有“行善／行了善事”；以希伯来文为主要依据，并在脚注中保存希腊文异读。
- issue: 如何处理对以赛亚的不同描述
  choice: 依希伯来文译作“在众先知中备受称颂”
  alternative: 伟大的先知，在异象中忠信
  rationale: 希伯来文与希腊文在结尾处存在实质差异。正文遵从现存希伯来文，脚注注明重要的希腊文异读，不将两者调和。
- issue: “所吩咐他的”所指对象
  choice: 理解为以赛亚吩咐希西家，并用分号明确后句转而描述以赛亚
  alternative: 理解为以赛亚所吩咐的那些道路
  rationale: 希伯来文中的宾语后缀自然指向希西家；希腊文则把关系从句连接于“大卫的道路”，故保持希伯来文句法，同时避免把后置同位语误解为修饰希西家。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“道路”保留圣经惯用意象；用分号澄清末句的同位关系。所有重要异读均置于脚注，正文以现存希伯来文为准。
