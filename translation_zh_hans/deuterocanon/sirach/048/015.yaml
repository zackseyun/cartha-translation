base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/015.yaml
  text: Yet for all this the people did not turn back[a], and they did not cease from their sins[c][b], until they were uprooted from their land and were scattered throughout the earth.
translation:
  language: zh_hans
  text: 尽管如此，百姓仍没有回转[a]，也没有不再陷在自己的罪中，直到他们从自己的土地上被连根拔起，分散在各地[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仍不悔改”。希伯来文直译为“不回转”；希腊文平行文本明确作“不悔改”。
    reason: lexical_alternative
  - marker: b
    text: 或译“分散到全地”。希伯来文“全地”可表示广泛散居在许多地方。
    reason: alternative_reading
  - marker: c
    text: 希腊文平行文本在现存希伯来文之后还有：“百姓所剩无几，并有大卫家的一位首领。”正文以现存希伯来文为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: בכל זאת
  choice: 尽管如此
  rationale: 承接上文并表达让步、转折，比直译“在这一切中”更符合现代汉语，同时保留原文的逆转语气。
- source_word: לא שב
  choice: 仍不回转
  rationale: שוב的基本意象是转回、返回；此处语境指道德和宗教上的归正。“回转”既保留希伯来语意象，也不把解释性的“悔改”直接写入正文。
- source_word: העם
  choice: 百姓
  rationale: 此处指以色列群体；“百姓”是庄重而自然的圣经语体，也比“民族”少政治色彩。
- source_word: ולא חדלו מחטאתם
  choice: 也不停止犯罪
  rationale: חדל מן表示停止、离开某种行为。译作“不停止犯罪”比“不停止他们的罪”更自然，并传达持续陷于罪行的含义。
- source_word: עד אשר נסחו מארצם
  choice: 直到他们从自己的土地上被连根拔起
  rationale: נסח表达强行移除；“连根拔起”保留生动而严厉的迁离意象，适合被掳语境。
- source_word: ויפוצו בכל הארץ
  choice: 分散到全地
  rationale: פוץ指分散；בכל הארץ既可理解为遍及大地，也可指散居各地。“全地”保留ארץ在“大地／各地”之间的范围弹性。
theological_decisions:
- issue: לא שב与希腊文μετενόησεν所表达的悔改含义
  choice: 不回转
  alternative: 不悔改
  rationale: 以现存希伯来文为主，保留שוב的转回意象；希腊文明确支持其道德宗教意义，因此脚注说明“悔改”这一等值理解。
- issue: בכל הארץ中ארץ的范围
  choice: 全地
  alternative: 各地／天下各地
  rationale: 被掳语境表明广泛离散，但原词仍可表示地、土地或大地；“全地”避免过度限定，脚注保留“各地”的分布性理解。
- issue: 希腊平行文本较现存希伯来文更长
  choice: 正文止于现存希伯来文的“分散到全地”
  alternative: 加入“百姓所剩无几，并有一位治理大卫家的领袖”
  rationale: 现存希伯来文在此处结束，故依原语言主见证不把希腊文增句纳入正文；差异在脚注中明示。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“回转”保留希伯来语的具体意象，“连根拔起”传达强制迁离的力度；正文保持紧凑，重要词义与文本差异置于脚注。
