  text: Then they melted in the pride of their heart[a], and they writhed like a woman giving birth.
translation:
  language: zh_hans
  text: 那时，他们在内心的骄傲中消融了[a]，又像临产的妇人一样痛苦地扭动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“那时，他们的心和手都震颤；他们像临产的妇人一样经历产痛。”正文采用希伯来文见证，并参照希腊文平行文本。
    reason: alternative_reading
lexical_decisions:
- source_word: אז
  choice: 那时
  rationale: 直接保留希伯来文的时间推进语气，衔接上下文自然。
- source_word: נמוגו
  choice: 消融了
  rationale: 该动词本义带有融化、失去坚实状态的形象；此处描写勇气或内在自信的崩溃。“消融了”既保留原文意象，也适合庄重的现代汉语。
- source_word: בגאון לבם
  choice: 他们心中的骄傲
  rationale: גאון 可指骄傲、高傲、隆起或威势，短语本身较为凝练。译文保留“骄傲”这一可能含义，不将其明确解释为单纯的勇气或自信；לבם 按集合意义译为“他们心中”。
- source_word: ויחילו
  choice: 辗转痛苦
  rationale: 该词可表达战栗、扭动或经历产痛。因下文已有分娩的明喻，译作“辗转痛苦”保留身体性的痛楚，又避免机械重复“产痛”。
- source_word: כיולדה
  choice: 像临产的妇人一样
  rationale: 希伯来文为单数分娩者的比喻；“临产的妇人”是自然、明确而庄重的现代汉语表达。
