  text: He broke their staff of bread[a], and in his zeal he diminished them.
translation:
  language: zh_hans
  text: 他断绝了他们的粮食供应[a]，又因他的热忱使他们人数减少。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“粮食之杖”，是指维持生命的粮食供应；希腊文平行文本作“使饥荒临到他们”。
    reason: 说明希伯来语习语的字面意象，并记录希腊平行文本的解释性读法。
lexical_decisions:
- source_word: וישבר
  choice: 断绝了
  rationale: שבר本义为“打破”；与“维生的粮食”这一习语搭配时，“断绝”既保留破坏、折断的力度，也自然表达粮食供应被切断。
- source_word: מטה לחם
  choice: 赖以维生的粮食
  rationale: 字面为“粮食之杖”，是指支撑生命的粮食供应。汉语直译“粮食之杖”不易理解，故在正文中传达其习语意义，并用脚注保存原文意象及希腊平行文本的解释。
- source_word: ובקנאתו
  choice: 又因他的热忱
  rationale: קנאה可指热忱、嫉妒或妒忌；本节描述以利亚的行动，以“热忱”较符合语境。ב可表凭借或原因，因此译作“因”。
- source_word: המעיטם
  choice: 使他们人数减少
  rationale: מעט的使役形表示“使变少、使数目减少”。此译明确保留使役和数量减少的含义，并与希腊文ὠλιγοποίησεν相符。
- source_word: λιμόν
  choice: 饥荒
  rationale: 希腊平行文本用λιμόν明确表达“饥荒”，印证希伯来语“粮食之杖”在此是粮食匮乏的习语。
theological_decisions:
- issue: 正文应保留“粮食之杖”的字面意象，还是表达其习语意义
  choice: 正文译出“赖以维生的粮食”，脚注保留字面意象和“饥荒”的希腊平行读法。
  alternative: 他折断了他们的粮食之杖；他使饥荒临到他们。
  rationale: 以高可信度的希伯来文为主要依据，同时让现代普通读者直接理解该习语；脚注记录原文修辞，并说明希腊文对其意义的古代诠释。
- issue: קנאה在此译为“热忱”还是“嫉妒”
  choice: 热忱
  alternative: 嫉妒；妒忌
  rationale: 上下文赞述以利亚为上帝发热心及其行动，“热忱”更贴合此处，不额外引入负面的心理含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“赖以维生的粮食”自然传达古代习语；“使他们人数减少”保留原文的使役和数量含义，避免含混地译作“削弱他们”。
