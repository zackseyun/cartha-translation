base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/016.yaml
  text: A remnant was left to Judah[a], and to the house of David a ruler. Some of them did what was right, but some of them greatly increased apostasy.
translation:
  language: zh_hans
  text: 犹大只剩下少数余民；大卫家还有一位领袖。其中有些人行事正直，有些人却大行不忠[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“有些人却增添了许多罪。”希伯来文措辞更尖锐，指他们极其背信或不忠。
    reason: 保留希伯来文מעל（背信、不忠）与希腊文ἁμαρτίας（罪）之间的措辞差异，并反映希腊文“增多”与希伯来文强化表达之间的差别。
lexical_decisions:
- source_word: וישאר ליהודה מזער
  choice: 犹大还剩下一小群人
  rationale: וישאר表示“留下、剩下”，מזער表示极少的数量；结合国家与王朝的语境，译作“一小群人”自然地表达少数余民，同时不额外加入“蒙保守”等解释。
- source_word: לבית דוד קצין
  choice: 大卫家也还有一位统治者
  rationale: בית דוד是王朝性的“大卫家”，קצין泛指掌权者或领袖；“统治者”保留其宽泛含义，不擅自具体化为“君王”或“王子”。
- source_word: עשו יושר
  choice: 行事正直
  rationale: 这一短语直指合乎正直的行为；“行事正直”简洁、庄重，也符合现代汉语表达。
- source_word: הפליאו מעל
  choice: 严重背信
  rationale: הפליאו在此加强程度，מעל表示违背信义、失信或对盟约不忠；“严重背信”保留希伯来文较尖锐的道德与关系性含义，又避免把它限定为某一种制度化意义上的“叛教”。
theological_decisions:
- issue: 如何表达מעל所指的失信或不忠
  choice: 背信
  alternative: 叛教；不忠；犯罪
  rationale: 希伯来文מעל比一般的“犯罪”更强调违背信义或盟约；“背信”保留这一力度，却不像“叛教”那样预先限定其具体形式。希腊文平行文本的“罪”则在脚注中保留。
- issue: 如何理解הפליאו的强化作用
  choice: 严重
  alternative: 大大增多；到了极点
  rationale: 希伯来文可表示做得异常、格外严重；希腊文则明确作“增多”。正文以程度副词“严重”保留希伯来文的开放性，不强行采用希腊文的数量意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“一小群人”具体表达人数极少；“大卫家”保留圣经中的王朝称谓；“严重背信”避免生硬的“增多背信”，同时保留原文的道德力度。
