translation:
  language: zh_hans
  text: 他击打了亚述的营地[a]，用瘟疫使营中大乱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他击打了亚述人的营地，他的使者消灭了他们。”
    reason: alternative_reading
lexical_decisions:
- source_word: ויך
  choice: 他击打了
  rationale: 希伯来语 נכה 表示“击打、打击”；采用现代而庄重的“击打”，保留直接有力的动作。
- source_word: מחנה אשור
  choice: 亚述的营地
  rationale: 按构造词组直译为“亚述的营地”，自然清楚；“亚述”在此可指亚述国及其军队。
- source_word: ויהמם
  choice: 使营中大乱
  rationale: המם 的使役含义包括使混乱、惊惶或溃乱。译作“使营中大乱”既传达这种效果，也以“营中”照应希伯来语单数的“营地”。
- source_word: במגפה
  choice: 用瘟疫
  rationale: מגפה 指瘟疫、灾疫；介词 ב 在这里具有工具或方式意义，因此译为“用瘟疫”。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在后半句的差异
  choice: 正文依希伯来文译为“用瘟疫使营中大乱”
  alternative: 希腊文作“他的使者消灭了他们”
  rationale: 本节存有可信度高的希伯来文本，应以其为正文依据；希腊文明确提到上帝的使者，代表不同或解释性的文本传统，故在脚注中完整保留，而不把两种读法合并。
translation_notes:
  register: 采用现代标准普通话，措辞简明、庄重。“使营中大乱”比生硬的“使它混乱”更自然，同时不将 המם 过度限定为“击溃”或“消灭”。
