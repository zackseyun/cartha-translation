  text: How fearsome you are[a], Elijah! And who like you can boast?
translation:
  language: zh_hans
  text: 以利亚啊，你多么令人敬畏！[a] 谁能像你这样夸耀呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“以利亚啊，你因自己的奇事多么得荣耀！谁能像你一样夸耀呢？”希伯来文本直译为“以利亚啊，你多么令人敬畏”，正文从希伯来文本。
    reason: alternative_reading
lexical_decisions:
- source_word: מה נורא
  choice: 多么令人敬畏
  rationale: 希伯来语感叹结构 מה 加 נורא 表达带有畏惧感的惊叹与赞叹。“令人敬畏”保留威严和震撼之意，也比现代口语中的“了不起”更贴近原文。
- source_word: אתה
  choice: 你
  rationale: 原文为无系词感叹句；汉语自然表达无需补出“是”，也不必依照希腊语改为过去时。
- source_word: אליהו
  choice: 以利亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: ואשר כמוך יתפאר
  choice: 谁能像你这样夸耀呢？
  rationale: 传世希伯来文本的 אשר 在此处略显异常；结合上下文及希腊语 τίς ὅμοιός σοι καυχᾶσθαι，可理解为反问。“夸耀”对应 יתפאר，并保留其可能是因伟大事迹而自豪、夸口的张力，不改写为单纯的“荣耀”。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在首句上的差异
  choice: 正文依据希伯来语译作“你多么令人敬畏”
  alternative: “你因自己的奇事多么得荣耀”
  rationale: 现存希伯来见证明确使用 נורא，强调令人畏惧、敬畏；希腊文本则是“得荣耀”并增有“在你的奇事中”。正文以希伯来见证为主，同时用脚注如实保存希腊异文，不将两者暗中合并。
- issue: 第二分句的反问性质
  choice: “谁能像你这样夸耀呢？”
  alternative: “有谁像你，可以夸耀呢？”
  rationale: 希伯来传文措辞略有不整，希腊平行文本支持反问理解；采用自然中文表达，但不把“夸耀”的对象或神学含义具体化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“令人敬畏”兼顾赞叹、威严与畏惧感；第二句用简洁反问，适合普通读者朗读和理解。脚注标记置于其所说明的首句之后。
