translation:
  language: zh_hans
  text: 你膏立一人施行报应[b][a]，又膏立一位先知接替你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“在西奈听见责备，在何烈听见报应的判决。”现存希伯来文在这里与希腊传统有显著差异。
    reason: alternative_reading
  - marker: b
    text: 希伯来文中译作“一人施行报应”的措辞较难确定；本译依照上下文所显出的意思。
    reason: textual_variant
lexical_decisions:
- source_word: המושח
  choice: 你膏立
  rationale: 按源自 משח 的分词理解，并承接上文对以利亚的第二人称描述；“膏立”既表达膏抹，也自然体现任命之意。
- source_word: מלא
  choice: 一人
  rationale: 此处希伯来文颇难；结合以利亚膏立执行审判者的叙事语境，按指人的宾语处理，但以脚注保留不确定性。
- source_word: תשלומות
  choice: 报应
  rationale: 该词出自“偿还、报偿”的语义范围；“报应”在此可表达带有审判性质的惩罚性回报，又不额外限定具体行动。
- source_word: ונביא
  choice: 又立一位先知
  rationale: 希伯来文为“和一位先知”；中文补出与前项并列的“立”，使句法自然，同时不把所指者姓名加入正文。
- source_word: תחליף תחתיך
  choice: 接替你
  rationale: חלף 与 תחתיך 合起来表示取代某人的位置或职分；“接替你”简洁地保留职分承继之意。
- source_word: ἀκούων ἐν Σινὰ ἐλεγμὸν
  choice: 在西奈听见责备
  rationale: 用于脚注呈现希腊平行文本；按希腊语直译，避免以希伯来正文同化这一显著异文。
- source_word: κρίματα ἐκδικήσεως
  choice: 伸冤报应的判决
  rationale: 用于脚注呈现希腊平行文本，兼顾 κρίματα 的司法性与 ἐκδικήσεως 的伸冤、报复或惩治含义。
theological_decisions:
- issue: 现存希伯来文与希腊平行传统显著不同
  choice: 正文采用希伯来见证：以利亚膏立执行报应者，并立先知接替自己。
  alternative: 希腊文作：“在西奈听见责备，在何烈听见伸冤报应的判决。”
  rationale: 项目以现存希伯来文本为优先依据；希腊传统在本节内容差异较大，故不将二者调和，而在脚注完整保留异文。
- issue: מלא תשלומות 的困难读法
  choice: 译作“一人施行报应”
  alternative: 也可能按更字面的方式理解为“充满报偿”或相关表达。
  rationale: 复合抄本此处措辞不稳；结合上下文中以利亚任命审判执行者的叙事，此译较为通顺，但不把推断伪装成确定读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“膏立”保留古代任命礼仪的经文用语；“施行报应”表达司法惩治色彩。脚注标记依正文首次出现顺序保留为[b][a]，与给定审校文本一致。
