translation:
  language: zh_hans
  text: 你在暴风中被接上升，又在火焰的队列中升至诸天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“你在火的暴风中被接上去，乘着由火马拉的战车。”这一较完整的读法更明确地呼应《列王纪下》2:11中以利亚升天的记载。
    reason: alternative_reading
lexical_decisions:
- source_word: הנלקח
  choice: 被接升天
  rationale: לקח的被动分词在以利亚升天的语境中表示被接走；结合后文向上、上天的方向，译为“被接升天”既自然，也保留被动含义。
- source_word: בסערה
  choice: 在暴风中
  rationale: סערה指暴风、风暴；此处不直接套用《列王纪下》2:11常见的“旋风”，以忠实反映本希伯来文本较宽泛的措辞。
- source_word: מעלה
  choice: 升天
  rationale: 此词在这里表达向上、往高处的方向。结合以利亚被接去的语境，以“升天”传达其隐含的天上方向，但不增添车马意象。
- source_word: ובגדודי אש
  choice: 又在火焰的队列中
  rationale: גדודים通常指队伍、成列的群体，并不明确表示“战车”。因此正文保留希伯来文本较不寻常的“火焰的队列”意象。
- source_word: שמים
  choice: 上达诸天
  rationale: שמים是复数形式“诸天／天上”。译文以“上达诸天”衔接方向与终点，同时避免把它误解为希腊文本中的火马战车。
theological_decisions:
- issue: 是否按《列王纪下》2:11及希腊本的熟悉表述，将希伯来文本协调为“火马战车”
  choice: 正文依从现存希伯来文本，保留“暴风”“火焰的队列”和“诸天”的意象。
  alternative: 按希腊本译作“在火焰的暴风中被接升天，乘着火马的战车”。
  rationale: 现存希伯来文本没有明确出现“战车”或“马”。原文优先要求正文不以较完整的希腊读法覆盖希伯来见证；希腊异文则在脚注中完整交代，以保留文本张力及其对以利亚事迹更明确的呼应。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“火焰的队列”略显陌生，但这是希伯来文本本身的特殊意象，故不擅自改成熟悉的“火焰战车”。正文保留第二人称，以适应本段对以利亚的直接称述。
