base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/010.yaml
  text: 'Look to the generations of old and see: who believed in Yahweh and was put to shame? Or who trusted in him and was abandoned? Or who called on him and was not answered?[a][b]'
translation:
  language: zh_hans
  text: 你们看看古时的世代：谁信靠雅威而蒙羞？谁倚靠他而被遗弃？谁呼求他而没有得到回应？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“谁坚持敬畏他而被遗弃？”现存希伯来文本则作：“谁倚靠他而被遗弃？”
    reason: alternative_reading
  - marker: b
    text: 希腊文本作：“谁呼求他，他却忽视那人？”现存希伯来文本则作：“谁呼求他而没有得到回应？”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ לְדוֹרוֹת רִאשׂוֹנִים
  choice: 你们要回顾古时的世代
  rationale: הַבִּיטוּ是复数命令式，要求听众把注意力转向以往的世代；“回顾”在现代汉语中自然地表达以历史为鉴，并保留命令语气。
- source_word: מִי הֶאֱמִין בַּיהוָה
  choice: 谁信靠雅威
  rationale: האמין在此不只是认知上的相信，也指对神的信赖；译作“信靠”符合上下文，同时以“雅威”呈现יהוה这一专名。
- source_word: וַיֵּבוֹשׁ
  choice: 而蒙羞
  rationale: בוש在此表示因所倚赖的落空而遭受羞耻；“蒙羞”简洁、庄重，并保留结果含义。
- source_word: מִי בָּטַח בּוֹ
  choice: 谁倚靠他
  rationale: בטח侧重安然依赖。译作“倚靠”既与前句“信靠”保持语义平行，也保留两个希伯来动词之间的措辞区别。
- source_word: וְנֶעֱזַב
  choice: 却被遗弃
  rationale: עזב的被动式表示被撇下、得不到帮助；“被遗弃”是直接而清楚的现代汉语表达。
- source_word: מִי קָרָא אֵלָיו
  choice: 谁呼求他
  rationale: קרא אל在这里指向神发出求告或祈求；“呼求”自然表达宗教语境中的恳求。
- source_word: וְלֹא נֶעֱנָה
  choice: 却没有得到回应
  rationale: ענה的被动式意为得到回答；此译法保持原文不作进一步解释，没有改写为较具诠释性的“未蒙垂听”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名。采用“雅威”作为该专名的音译，不以称号代替。
- issue: 希伯来文本与希腊平行文本的差异
  choice: 正文采用现存希伯来文本，希腊异文列入脚注
  alternative: 正文采用希腊文本“持守对他的敬畏”及“忽视他”
  rationale: 本节希伯来文本现存且可信度高，因此正文以希伯来文为主；希腊文的实质性差异仍在脚注中完整保留，避免消除文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要……看看”保留复数劝诫语气；三个反问句保持希伯来文的平行结构。用“信靠／倚靠”体现האמין与בטח的细微差别；脚注标记均置于正文相应节末。
