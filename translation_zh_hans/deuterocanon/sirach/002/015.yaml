  text: Those who fear Yahweh will not rebel against his ways[a], and those who love him will keep his paths.
translation:
  language: zh_hans
  text: 敬畏耶和华的人必不背离他的道路[a]；爱他的人必谨守他的路径。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行本作“必不违背他的话语”，不同于希伯来文的“必不背离他的道路”。此处以开罗藏经库的希伯来文见证为主；两种读法表达的总体意思都是忠实顺服。
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: 敬畏耶和华的人
  rationale: 以“敬畏”保留智慧文学中兼具畏惧、尊崇与忠诚的含义；将四字神名译为“耶和华”，在现代中文圣经语境中自然且可识别。
- source_word: לֹא יַמְרוּ
  choice: 必不背逆
  rationale: מרה所表达的不只是一般的不顺从，更有抗拒、悖逆之意；“背逆”既保留其较强语气，也符合庄重的现代中文。
- source_word: בִּדְרָכָיו
  choice: 他的道路
  rationale: 介词ב与מרה连用时可引出背逆所针对的对象；中文“背逆他的道路”保留希伯来文意象及关系，而不另加解释性成分。
- source_word: וְאוֹהֲבָיו
  choice: 爱他的人
  rationale: 自然表达分词所指的一类人，并清楚保留第三人称宾语。
- source_word: יִצְרוּ
  choice: 必谨守
  rationale: נצר兼有看守、保守和遵行之意；“谨守”同时体现认真守护与忠实遵行。
- source_word: אָרְחוֹתָיו
  choice: 他的路径
  rationale: 译作“路径”以保留אָ֫רַח的道路意象，并与前半句דֶּרֶךְ所译的“道路”形成诗意变化。
theological_decisions:
- issue: 神名יְהֹוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文稿采用广为人知且庄重的“耶和华”，而不以“主”替代专名；“雅威”则更接近现代学界常见的拟音。
- issue: 敬畏、爱与顺服之间的关系
  choice: 保留两个平行陈述，不将其改写为条件或因果关系
  alternative: 解释为因为敬畏或爱神，所以必然顺服
  rationale: 希伯来文以诗体平行句描述这些人的特征，并未明确标出因果逻辑；译文避免加入原文没有明说的系统化解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两分句保持整齐的智慧诗体平行结构；“道路／路径”保留原文两个近义词的变化，“背逆／谨守”则呈现抗拒与忠守的对照。
