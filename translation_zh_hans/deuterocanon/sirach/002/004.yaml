translation:
  language: zh_hans
  text: 无论什么临到你，都要接受；在使你卑微的种种变故中[a]，要恒久忍耐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“在你的破碎中”；希腊文平行文本作“在你卑微处境的种种变化中”。正文兼顾两种见证。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּא עָלֶיךָ
  choice: 无论什么临到你
  rationale: 希伯来文直译为“凡临到你的”；此译自然地保留范围的开放性。希腊文平行文本也支持“凡被加在你身上的事”这一含义。
- source_word: קַבֵּל
  choice: 都要接受
  rationale: 该命令式表示接纳所临到的处境。“接受”比“领受”更符合现代汉语语境，又不像“欢迎”那样增添积极欣然之意。
- source_word: וּבְשִׁבְרְךָ
  choice: 在使你卑微的种种变故中
  rationale: 现存希伯来文指“在你的破碎中”，希腊文平行文本则作“在你卑微处境的种种变化中”。正文兼顾两种见证，以“使你卑微”表达受压低、受挫败的状态，以“种种变故”保留希腊文所见的处境变化；差异在脚注中明示。
- source_word: הַאֲרֵךְ רוּחַ
  choice: 要恒久忍耐
  rationale: 该希伯来语习语字面为“使心灵长久”，表示有耐性、长久忍受；希腊文 μακροθύμησον 亦印证此义。“恒久忍耐”既表达持续性，也符合现代庄重汉语。
theological_decisions:
- issue: 希伯来文主要见证与较完整的希腊文平行文本在第二分句上的差异
  choice: 正文译为“在使你卑微的种种变故中”，兼顾希伯来文的破碎意象和希腊文的变故、卑微表述
  alternative: 在你破碎的时候
  rationale: 希伯来文仍为主要依据，但该处来源标注有轻微不一致，且希腊文平行文本明确提供了“变化”和“卑微”的较完整表达。正文不把差异静默消除，而以兼顾两者的译法呈现可能含义，并在脚注保存更贴近希伯来文的读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“无论什么临到你”保持经文语气而不过分书面；“恒久忍耐”传达原文习语中的持续耐心。
