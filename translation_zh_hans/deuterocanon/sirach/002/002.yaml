  text: Prepare your heart[a], and be strong; and do not be alarmed in a time of calamity.
translation:
  language: zh_hans
  text: 要预备你的心，并要刚强坚定；当灾祸临到时，不要惊慌[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“在患难（或：灾祸临到）之时，不要急躁行事。”希伯来文强调不要惊慌；希腊文则强调受试炼时不要仓促行事。
    reason: alternative_reading
lexical_decisions:
- source_word: הָכֵן
  choice: 预备
  rationale: 该词是כון的使役式，含有使稳固、预备、安排妥当之意。这里译作“预备”，贴近希伯来文，也自然表达内心为将临的考验作好准备；希腊文εὐθυνον所含“使正直、引导”的意味则提供了内在整顿这一层背景。
- source_word: לִבְּךָ
  choice: 你的心
  rationale: 希伯来文“心”可指人的思想、意志与整个内在生命。“你的心”保留圣经惯用意象，在现代汉语中也足以涵盖这些层面。
- source_word: וְהִתְחַזֵּק
  choice: 刚强坚定
  rationale: 该形式带有使自己强健、站稳的反身意味；希腊文καρτέρησον又突出坚忍持守。“刚强坚定”兼顾力量与恒忍，且符合中文劝勉语气。
- source_word: וְאַל תִּבָּהֵל
  choice: 不要惊慌
  rationale: בהל通常表示惊惶、慌乱或受惊失措。译作“不要惊慌”准确传达希伯来文所强调的情绪与心志上的稳定。
- source_word: בְּיוֹם אֵד
  choice: 灾祸临到时
  rationale: 字面为“在灾祸之日”。中文译作“灾祸临到时”自然表达某一危难时刻，也与希腊文“在临到／患难之时”的时间表达相呼应。
theological_decisions:
- issue: 末句希伯来文与希腊文的不同侧重
  choice: 正文依从现存且可信度高的希伯来文，译为“不要惊慌”。
  alternative: 依希腊文可译为“在患难临到时，不要急躁行事”。
  rationale: 希伯来文强调面对灾祸不可惊惶失措，希腊文则强调患难中不可仓促冒进。两者并非直接矛盾，却保留了不同劝诫角度，因此正文以希伯来文为主，并在脚注中呈现希腊文异读。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“预备你的心”保留希伯来智慧文学的核心意象；分号划分内在预备与临灾反应，使节奏清楚。
