  text: You who fear Yahweh[a], wait for his mercy, and do not turn aside, lest you fall.
translation:
  language: zh_hans
  text: 敬畏雅威的人哪，要等候他的怜悯[a]；不要偏离，免得跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“חסד”也可指慈爱、信实的慈爱或恩慈；希腊语平行文本作“怜悯”，支持正文的译法。
    reason: 说明希伯来词的语义范围及希腊语平行文本对正文译法的支持。
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה / οἱ φοβούμενοι Κύριον
  choice: 你们敬畏雅威的人
  rationale: 希伯来语复数结构和希腊语分词都在直接称呼一群敬畏上帝的人。“你们……的人”保留劝勉中的直接呼语；יְהוָה按其专名译为“雅威”。
- source_word: חַכּוּ / ἀναμείνατε
  choice: 要等候
  rationale: 两种文本都使用命令式，表达耐心而有期待地等待；“等候”在现代汉语中自然、庄重，并能直接带出所等候的对象。
- source_word: לְחַסְדּוֹ / τὸ ἔλεος αὐτοῦ
  choice: 他的怜悯
  rationale: 希伯来语חסד可指慈爱、忠贞之爱或恩慈，但希腊语平行文本用ἔλεος，明确支持“怜悯”；脚注保留希伯来词更丰富的语义可能。
- source_word: וְאַל תִּטּוּ / καὶ μὴ ἐκκλίνητε
  choice: 不要偏离
  rationale: 原文动词带有从道路或正道转开的意象。“偏离”既保留路径隐喻，也不额外限定偏离的具体性质。
- source_word: פֶּן תִּפֹלוּ / ἵνα μὴ πέσητε
  choice: 免得跌倒
  rationale: 希伯来语פן和希腊语ἵνα μή均构成警戒性的否定目的或结果。“免得跌倒”简洁地保留这种张力，也不把“跌倒”限定为道德、属灵或处境上的失败。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 希伯来文本直接使用四字神名，故以“雅威”音译，保留其作为专名的性质；希腊语“主”可作为平行传统的见证，但不取代此处希伯来文本的神名。
- issue: חסד在希腊语平行文本之下的语义
  choice: 怜悯
  alternative: 慈爱；忠贞的爱；恩慈
  rationale: חסד本身具有较宽的语义范围，而希腊语ἔλεος在本节突出“怜悯”。正文采用“怜悯”，同时以脚注提示希伯来语可能包含忠贞之爱的意味，避免抹平文本间的语义张力。
translation_notes:
  register: 采用现代、庄重而清楚的劝勉语体。“你们……的人”体现直接呼语；分号呈现等候与不可偏离之间紧密相连的两项劝告。
