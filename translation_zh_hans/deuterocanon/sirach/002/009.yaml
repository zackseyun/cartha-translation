  text: You who fear Yahweh[a], hope for good[b], and for everlasting joy and mercy.
translation:
  language: zh_hans
  text: 敬畏耶和华的人啊，要盼望美善[a]、永远的喜乐和怜悯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“种种美善”，为复数；希伯来文在此为单数。
    reason: alternative_reading
  - marker: b
    text: 希伯来文“怜悯”也可译作“慈爱”、“恩慈”或“忠贞的爱”；希腊文同样作“怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: 敬畏耶和华的人啊
  rationale: 原文是复数分词性称呼，直接向一群人发出劝勉；用“……的人啊”保留呼语和劝勉语气。
- source_word: קַוּוּ
  choice: 要盼望
  rationale: 此复数命令式表达带着期待的倚赖；“盼望”既符合希伯来文，也与希腊文ἐλπίσατε相合。
- source_word: לְטוֹב
  choice: 福乐
  rationale: 希伯来文为单数、意义宽泛，可指所期待的美好或福分；“福乐”在本句祝福语境中自然，同时不机械追随希腊文的复数“美善之事”。
- source_word: וּלְשִׁמְחַת עוֹלָם
  choice: 永远的喜乐
  rationale: 保留שִׁמְחָה的喜乐含义及עוֹלָם所表达的恒久性，现代汉语清楚庄重。
- source_word: וָחֶסֶד
  choice: 怜悯
  rationale: חֶסֶד可指怜悯、慈爱、恩慈或忠贞之爱；此处“怜悯”与希腊文ἐλέους相合，又不把盟约含义解释得过满。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉且庄重的专名“耶和华”，明确呈现神名，而不以“主”代替；“雅威”是较贴近学术重构读音的替代译法。
- issue: 希伯来文本与希腊平行文本之间的数差异
  choice: 以现存希伯来文单数לְטוֹב为主，译作“福乐”
  alternative: 依希腊文复数ἀγαθά译作“种种福分”
  rationale: 本节希伯来文可用，故以其为主要依据；希腊文用于核对整体意义，并以脚注保留其复数差异。
- issue: חֶסֶד的神学与词义张力
  choice: 怜悯
  alternative: 慈爱／忠贞的爱／恩慈
  rationale: 不把该词在此处限定为某一种系统神学意义；正文采用与希腊平行文本一致且自然的“怜悯”，脚注保留其他真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“……的人啊”保留原文直接呼告的力量；并列结构简洁，适合公开诵读。
