translation:
  language: zh_hans
  text: 因为耶和华满有怜悯和恩典；他赦免罪孽，在患难的时候施救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָחוּם וְחַנּוּן
  choice: 有怜悯，有恩典
  rationale: 分别对应“富有怜悯”和“施恩”，保留两个并列属性，也采用自然、庄重的现代汉语表达。
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名表达希伯来文神名。
- source_word: סוֹלֵחַ לַעֲוֹנוֹת
  choice: 赦免罪孽
  rationale: עָוֹן兼有罪、过犯或罪孽之义；“罪孽”比泛称“罪”更贴近该词，同时不额外加入惩罚或罪责等解释。
- source_word: מוֹשִׁיעַ
  choice: 施行拯救
  rationale: 保留使役性拯救动作；希伯来文未明说宾语，中文也不补出“我们”或“人”。
- source_word: בְּעֵת צָרָה
  choice: 在患难之时
  rationale: 准确传达“在困厄、患难的时候”，并维持智慧文学的庄重语体。
theological_decisions:
- issue: 赦免的对象
  choice: 罪孽
  alternative: 罪／过犯
  rationale: 沿用希伯来文复数עֲוֹנוֹת的语义强度，不把经文限定为某一套罪论术语。
- issue: 拯救的宾语
  choice: 不补明宾语
  alternative: 拯救人／拯救我们
  rationale: 原文仅使用分词מוֹשִׁיעַ而没有明示宾语；保留这一省略，避免把普遍陈述改为特指。
translation_notes:
  register: 采用现代、清楚而庄重的标准普通话。“有怜悯，有恩典”保留希伯来文双重属性；分号呈现属性陈述与行动陈述之间的结构关系。
