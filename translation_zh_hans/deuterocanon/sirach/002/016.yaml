  text: Those who fear Yahweh will seek his favor[b][a], and those who love him will learn his law.
translation:
  language: zh_hans
  text: 敬畏耶和华的人必寻求他的恩宠；爱他的人必学习他的律法[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“教导”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本作：“爱他的人必被律法充满。”
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: 敬畏耶和华的人
  rationale: 该结构指以敬畏耶和华为特征的人；“敬畏”既保留宗教上的敬惧与尊崇，也符合现代汉语圣经语体。
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的传统形式呈现希伯来文神名 YHWH。
- source_word: יְבַקְּשׁוּ
  choice: 必寻求
  rationale: 未完成式在这里表达一般性或将然行动；“必寻求”简洁自然，并与希腊文 ζητήσουσιν 相符。
- source_word: רְצוֹנוֹ
  choice: 他的恩宠
  rationale: רצון 可指悦纳、恩宠、喜悦或旨意；结合希腊文 εὐδοκία，此处以“恩宠”表达寻求上帝悦纳的含义，同时不把它缩窄为命令意义上的“旨意”。
- source_word: וְאֹהֲבָיו
  choice: 爱他的人
  rationale: 代词指回耶和华；此译自然地保留对上帝的个人敬爱。
- source_word: יִלְמְדוּ
  choice: 必学习
  rationale: 希伯来文 למד 的 Qal 形式通常意为“学习”；主文本据现存希伯来文翻译，不以希腊文的不同读法取代。
- source_word: תוֹרָתוֹ
  choice: 他的律法
  rationale: תורה 可泛指教导或训诲，也有传统的圣约与律法内涵；正文采用“律法”，并在脚注保留“教导”这一较宽泛的译法。
theological_decisions:
- issue: 第二分句的希伯来文与希腊文存在实质差异
  choice: 正文依希伯来文译作“必学习他的律法”
  alternative: 希腊文平行文本作“必被律法充满”
  rationale: 本节有高可信度的希伯来文见证，因此正文以希伯来文为先；希腊文反映不同底本或诠释性翻译，故以脚注如实保存，不擅自调和。
- issue: רְצוֹנוֹ 的语义范围
  choice: 他的恩宠
  alternative: 他的旨意；他所喜悦的
  rationale: 该词兼有悦纳、喜悦和旨意等含义；希腊文 εὐδοκία 倾向支持“恩宠／悦纳”。此选择保留关系性的含义，避免把经文单纯解释为寻求命令。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；两分句保持希伯来诗句的平行结构。“必”表达格言式、一般性的将然行动。脚注标记均紧接其所说明的第二分句。
