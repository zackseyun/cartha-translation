  yaml_path: translation/deuterocanon/sirach/002/013.yaml
  text: Woe to the heart that does not trust[a], for it also will not stand.
translation:
  language: zh_hans
  text: 不信靠的心有祸了！它也必站立不住。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“松懈的心有祸了，因为它不相信；因此，它必得不到庇护。”希伯来文本没有“松懈”，末句作“它也必站立不住”。
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: 有祸了
  rationale: 兼具哀叹与警告的意味，保留智慧文学中郑重、严厉的语气；比单纯的“可悲”更贴近原文力度。
- source_word: לְלֵב
  choice: 心
  rationale: 希伯来语“心”指人的内在自我，包括意志、思想和倾向。直译为“心”既保留希伯来语的人观，也与希腊语平行文本相符。
- source_word: אֲשֶׁר לֹא יַאֲמִין
  choice: 不信靠
  rationale: אמן在这里表示相信、倚赖。上下文关乎人在考验中对上帝的倚靠，“信靠”比单说“相信”更能自然表达这种关系性和实践性的含义，同时不引入后期教义术语。
- source_word: וְאַף הוּא
  choice: 它也
  rationale: 保留附加和强调意味，指出这颗心本身也要承受随后的结果。中文以独立一句自然呈现其后果关系，而不额外加入原文没有的明确因果连词。
- source_word: לֹא יָקוּם
  choice: 必站立不住
  rationale: קום的基本意思是起来、站立；此处表示无法持守或存立。“站立不住”保留原文形象，也让现代读者理解其不能经受考验的语境含义。
theological_decisions:
- issue: 智慧劝诫中“相信／信靠”动词的译法
  choice: 不信靠
  alternative: 不相信；没有信心
  rationale: 希伯来语和希腊语都可表达相信或信靠。此处语境强调考验中的坚定倚赖，采用“信靠”可表达实际关系，却不把它限定为抽象的教义认同。
- issue: 末句采用希伯来文本还是希腊平行文本
  choice: 依希伯来文本译作“必站立不住”
  alternative: 依希腊文本译作“必得不到庇护”
  rationale: 所给希伯来文本可信度高，故正文优先保留其“站立”的措辞；希腊文本的实质差异在脚注中说明，不将两种读法混合。
translation_notes:
  register: 采用简明、庄重的现代标准汉语。“有祸了”保留警告力度；“信靠”符合上下文而不过度教义化；“站立不住”保留希伯来语的具体意象。脚注标记已在正文中出现。
