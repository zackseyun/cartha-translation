  text: You who fear Yahweh[a], trust in him, and your reward will not be delayed.
translation:
  language: zh_hans
  text: 敬畏雅威的人啊，要信靠他；他不会把你们的赏报留到次日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他不会让你们的赏报过夜”，意思可能是他不会延迟赏报。希腊文平行本则作：“你们绝不会失去自己的赏报。”
    reason: 说明希伯来文习语及希腊文平行本的不同表达，以保留文本证据中的歧义。
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: 敬畏雅威的人啊
  rationale: 该阳性复数分词短语在上下文中作呼语；用“……的人啊”自然表达直接劝勉，并以“雅威”呈现神名。
- source_word: הַאֲמִינוּ בּוֹ
  choice: 要信靠他
  rationale: אמן 的使役词干与介词 ב 连用，重点是倚赖、信任，而不只是认同某项事实；“信靠”符合智慧文学的劝勉语境。
- source_word: וְהוּא לֹא יָלִין
  choice: 他绝不会……留到次日
  rationale: 保留希伯来文明确的主语“他”，并以“留到次日”表达 לין“过夜、留宿”的核心意象；“绝不会”传达否定劝勉的坚定语气。
- source_word: שְׂכַרְכֶם
  choice: 你们的赏报
  rationale: שכר 可指工钱或报偿；此处涉及敬畏并信靠上帝所得的回报，“赏报”既保留报偿含义，也比单说“工钱”更切合语境。
theological_decisions:
- issue: 神名 יְהֹוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译保留专名性质，不以称号替代。
- issue: 末句希伯来文与希腊文平行本之间的张力
  choice: 正文依希伯来文译作“他绝不会把你们的赏报留到次日”
  alternative: “你们绝不会失去自己的赏报”（希腊文）
  rationale: 希伯来文虽属不寻常搭配，却仍可理解为上帝不会把应给的赏报扣留过夜，即不会延迟偿付；正文优先保留其具体意象，脚注注明希腊文的不同表达，不把两者静默合并。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“……的人啊”明确呼语功能；分号区分命令与随后的应许。正文保留希伯来文“留到次日”的具体意象，并借脚注解释其可能含义及希腊文差异。
