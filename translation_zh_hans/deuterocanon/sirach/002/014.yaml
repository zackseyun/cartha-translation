base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/014.yaml
  text: Woe to you who have lost hope[b][a]; what will you do at the visitation of Yahweh?
translation:
  language: zh_hans
  text: 你们这些失去盼望的人有祸了[a]！耶和华察访[b]时，你们要怎么办呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“失去忍耐”或“失去坚忍”；希伯来文本作“失去盼望”。
    reason: alternative_reading
  - marker: b
    text: “察访”所译的希伯来词可指耶和华亲自关注、鉴察并介入；在本节的警告语境中，尤其带有施行审判的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: 有祸了
  rationale: 既保留哀叹，也传达警告和审判的先知性语气；比单纯的“可悲啊”更有力度，又符合现代汉语表达。
- source_word: אוֹבְדֵי תִּקְוָה
  choice: 失去盼望的人
  rationale: 按现存希伯来文本直译其核心含义，指盼望已经丧失的人；不采用希腊文本所体现的“失去忍耐”。
- source_word: תִּקְוָה
  choice: 盼望
  rationale: 准确表达“希望、期待”的常用义，在智慧文学和信仰语境中自然庄重。
- source_word: פְקוֹד
  choice: 察访
  rationale: 保留词根 פקד 所含上主亲自关注、鉴察并介入的宽广语义；上下文使其带有审判威胁，但正文不直接窄化为“惩罚”。
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、易懂的专名译法。
theological_decisions:
- issue: 是否把“耶和华的察访”明确译成惩罚
  choice: 耶和华察访时
  alternative: 耶和华惩罚时
  rationale: 本节语境明显带有警告和审判色彩，但希伯来词 פקד 本身可泛指上主的关注、鉴察或介入。译作“察访”可让上下文传达其 ominous force，同时避免把原文的语义范围缩窄为单一的惩罚。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“你们这些……的人有祸了”保留原文直接警告的力度；后半句用口语可懂而不失庄严的反问句。“察访”保留神学张力，不在正文中直接解释为“惩罚”。
