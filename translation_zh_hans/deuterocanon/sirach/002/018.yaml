base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/018.yaml
  text: Let us fall into the hand of Yahweh[a], and not into the hand of man, for as his greatness is[b], so also is his mercy.
translation:
  language: zh_hans
  text: 让我们落在雅威的手里[a]，不落在人的手里；因为他有多伟大，他的怜悯[b]也有多大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文两处均作单数“手”；希腊文平行文本两处作复数“手”。本译文以希伯来文为主。
    reason: textual_variant
  - marker: b
    text: “怜悯”也可译作“慈爱”或“忠贞之爱”。希伯来文 חֶסֶד 可指坚定、守约的恩慈；希腊文作“怜悯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפֹּל
  choice: 我们要落在
  rationale: 这是 נפל 的第一人称复数意愿式，表达共同的意愿或劝勉；“我们要落在”保留原文“落入”的鲜明意象，不把它扩译为“把自己交托给”。
- source_word: בְּיַד
  choice: 在……手里
  rationale: 希伯来文两处均为单数“手”；现代汉语“落在……手里”自然地表达落入某者权下，同时保留身体意象。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；采用“雅威”音译，以区别于作为称号的“主”。
- source_word: אָדָם
  choice: 人
  rationale: 这里泛指与雅威相对的凡人；“人”在现代汉语中自然、涵盖性别，也无须为保留希伯来文单数而使用不自然的“一个人”。
- source_word: כְּגָדְלוֹ כֵּן
  choice: 他有多伟大……也有多大
  rationale: 以汉语对应结构重现希伯来文“怎样……也照样”的比较关系，并明确“伟大”指雅威本身。
- source_word: חַסְדּוֹ
  choice: 他的怜悯
  rationale: חסד 可指慈爱、忠贞之爱或恩慈；本句谈落在神手中而非人手中，“怜悯”最贴合语境，也得到希腊文 ἔλεος 的支持，同时以脚注保留其较宽的语义范围。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 主；耶和华
  rationale: 原文使用神的专名而非普通称号；音译“雅威”保留专名性质，不把它化为称号。
- issue: חסד 在本节中的神学含义
  choice: 怜悯
  alternative: 慈爱；忠贞之爱
  rationale: 本节把神的伟大与人落在他手中时可倚赖的 חסד 并列；“怜悯”符合直接语境和希腊平行文本，但不否认该词也可含忠贞、守约之爱的意味。
- issue: אָדָם 是否指男性
  choice: 人
  alternative: 世人；人类
  rationale: 此处是神与凡人的对照，并非特指男性；采用普通泛称“人”，避免加入原文没有的性别限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“落在……手里”保留原文意象，又是普通读者熟悉的表达；后半句以“有多……也有多……”重现 כ...כן 的对应结构。
