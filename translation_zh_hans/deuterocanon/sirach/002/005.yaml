  text: For gold is tested in fire[a], and men who are accepted, in the furnace of affliction.
translation:
  language: zh_hans
  text: 因为金子要在火中受检验[a]，蒙悦纳的人也要在苦难的熔炉中受检验。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语第二句的措辞较难理解；希腊文平行文本作“蒙悦纳的人在卑微的熔炉中”。正文依据这一含义，同时仍以现存希伯来语为基础。
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּחֵן
  choice: 受检验
  rationale: בחן表示检验、考验或验证；“受检验”保留被动语态，也不把炼净的结果预先加入动词含义。
- source_word: זָהָב
  choice: 金子
  rationale: 直接、自然地对应希伯来语，适合现代汉语智慧文学语体。
- source_word: בְּנֵי אָדָם / Greek ἄνθρωποι δεκτοὶ
  choice: 蒙悦纳的人
  rationale: 现存希伯来语短语在此处疑难；希腊平行文本的ἄνθρωποι δεκτοί支持“蒙悦纳的人”。这一译法既表达人的泛称，也保留其被接纳、获认可的被动意味。
- source_word: עֹנִי / Greek ταπεινώσεως
  choice: 苦难
  rationale: עֹנִי可指困苦、患难、卑微或屈辱；“苦难”契合受试验的语境，同时不把意义限缩为贫穷或羞辱。
- source_word: Greek καμίνῳ
  choice: 炉
  rationale: 希腊平行文本明确使用“炉”；它补足第二分句与前句火炼金子的对应意象。
theological_decisions:
- issue: 如何处理希伯来语第二分句的疑难措辞
  choice: 依据希腊平行文本，将其译为蒙悦纳的人在苦难的炉中受检验
  alternative: 较机械地译作“世人在困苦的熔炉中”，或把בְּכוּר理解为“拣选的／头生的”
  rationale: 希伯来语见证虽存，但בְּכוּר עֹנִי在上下文中难解。希腊文本保留了清楚的平行结构：金子在火中受检验，蒙悦纳的人在卑微或苦难之炉中受检验。正文采用这一有古代见证支持的意义，并用脚注说明文本问题，避免把某种特定教义强加给经文。
- issue: 是否在第二分句补出“受检验”
  choice: 补出“受检验”
  alternative: 省略谓语，译作“蒙悦纳的人也在苦难的炉中”
  rationale: 原文诗性平行允许第二分句承接前句谓语；现代汉语若不补出，句意容易显得残缺。重复谓语清楚呈现平行关系，并未增添新的命题。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“因为”承接上文论证；两次“受检验”使汉语平行关系清楚。“蒙悦纳”比“可悦纳”更自然，并保留被动意味；“苦难的炉”保留原文具体而紧张的比喻。
