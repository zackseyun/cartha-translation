  text: Those who fear Yahweh will prepare their hearts[a], and before him they will humble their spirits.
translation:
  language: zh_hans
  text: 敬畏雅威的人必预备他们的心，并在他面前谦卑他们的灵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作“使他们的魂谦卑”；希伯来文本作“谦卑他们的灵”，正文从希伯来文。
    reason: 记录希伯来文本与希腊平行文本在人论名词上的词汇差异。
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: 敬畏雅威的人
  rationale: 保留希伯来智慧文学中“敬畏雅威”的核心表达；“敬畏”兼具畏惧与尊崇之意，比单译“尊敬”更完整。
- source_word: יָכִינוּ לְבָבָם
  choice: 必预备自己的心
  rationale: כון的使役形在此表示预备、使之就绪；“预备自己的心”既保留原文的心之隐喻，也符合现代汉语的经文语体。未采用“坚定自己的心”，因为希腊平行文本ἑτοιμάσουσιν也支持“预备”。
- source_word: לְבָבָם
  choice: 自己的心
  rationale: לֵבָב指人的内在，包括思想、意志与倾向；译作“心”保留希伯来语的整体性隐喻，避免缩窄为“思想”。
- source_word: וּלְפָנָיו
  choice: 在他面前
  rationale: 直译原文的空间—关系表达，清楚传达人在上帝临在中的姿态。
- source_word: יַכְנִיעוּ רוּחָם
  choice: 使自己的灵谦卑
  rationale: 保留使役动词“使……谦卑”和名词רוּחַ“灵”；虽不如单说“谦卑自己”口语化，却避免抹去原文的重要人论用语。
theological_decisions:
- issue: 神名יְהֹוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并在现代普通话中作为专名自然可辨。
- issue: רוּחָם与希腊平行文本ψυχὰς αὐτῶν的差异
  choice: 正文采用“自己的灵”
  alternative: 自己的魂／自己
  rationale: 高可信度的希伯来文本作“他们的灵”，应作为正文依据；希腊平行文本作“他们的魂”，以脚注保留这一古代文本差异，不将两者强行调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“预备自己的心”和“在他面前”保留圣经智慧文学的意象；“使自己的灵谦卑”略带经文语体，以忠实呈现希伯来语的使役结构及“灵”这一明确名词。脚注标记紧随其所说明的“灵”之后。
