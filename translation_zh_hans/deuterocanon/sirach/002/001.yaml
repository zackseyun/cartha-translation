base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/001.yaml
  text: My son[a], if you draw near to serve Yahweh, prepare yourself for every trial.
translation:
  language: zh_hans
  text: 我儿，你若前来事奉雅威，就要预备自己面对各样的考验。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “考验”也可译作“试炼”。希腊文对应词按语境也可指“试探”。原文“预备自己”较直译为“预备你的性命”或“预备你自己”。
    reason: 保留希伯来文ניסיון及希腊文πειρασμόν的语义范围，并更准确说明נפשׁ在此的较直译表达。
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 希伯来文是单数阳性亲子称呼；“我儿”保留智慧教训中长者对晚辈的劝诫语气，也比“我的儿子”更自然凝练。
- source_word: תִּקְרַב
  choice: 近前来
  rationale: קרב意为靠近、走近；“近前来”既自然，也保留来到上帝面前的敬拜语境，希腊文προσέρχῃ与此一致。
- source_word: לַעֲבוֹד
  choice: 事奉
  rationale: עבד在以上帝为对象时兼有服事、顺服和敬拜之意；“事奉”在现代中文宗教语境中能保留这一宽度，不缩窄为单纯“敬拜”。
- source_word: אֶת יְהֹוָה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה；音译为“雅威”可保留其作为上帝圣约之名的性质。
- source_word: הָכֵן
  choice: 预备
  rationale: 该祈使式要求人有意识地做好准备；“预备自己”庄重、清楚，并与希腊文ἑτοίμασον相符。
- source_word: נַפְשְׁךָ
  choice: 自己
  rationale: נפשׁ在此指整个人或自身；译为“自己”避免把经文限于与身体分离的“灵魂”，同时符合现代汉语表达。
- source_word: לְכָל נִסָּיוֹן
  choice: 面对各样的考验
  rationale: ניסיון表示试验、考验；לכל表达全面性。“各样的考验”自然地传达可能临到的各种试炼，并以“面对”表达原文介词所指向的预备。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用专名而非普通称号；“雅威”较直接地反映该神名，也不以“主”取代原文的专名。
- issue: נַפְשְׁךָ是否直译为“你的灵魂”
  choice: 自己
  alternative: 你的心灵；你的性命
  rationale: 此处劝勉的是整个人为考验做好准备。“自己”保留整体人格含义，避免无根据地引入灵魂与身体二分的理解。
- issue: נִסָּיוֹן / πειρασμόν的语义范围
  choice: 考验
  alternative: 试炼；试探
  rationale: 希伯来词主要指检验或考验，语境也是事奉上帝时将面对的艰难；希腊词还可能有“试探”义，因此在脚注保留这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学劝诫语体。“我儿”保留亲切而郑重的师长口吻；句式简洁，适合公开诵读。
