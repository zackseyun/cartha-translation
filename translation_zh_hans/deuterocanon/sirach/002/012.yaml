  text: Woe to the faint of heart and the slack hands[a], and to the sinner of crooked ways.
translation:
  language: zh_hans
  text: 心里怯懦、双手无力的人有祸了！行事乖僻的罪人也有祸了[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“道路乖僻的恶人（或罪人）”；希腊文作“走在两条路上的罪人”，可能指三心二意或行为虚伪。
    reason: 说明希伯来文措辞及希腊平行文本的重要异读，避免把两种见证之间的张力无声消解。
lexical_decisions:
- source_word: אוֹי
  choice: 有祸了
  rationale: 这是带有哀叹和警告意味的感叹语；“有祸了”保留智慧文学中严肃的宣告语气。
- source_word: לְרַכֵּי לֵב
  choice: 心里怯懦的人
  rationale: 原文直指“心软弱”的人，语境所说的不是仁慈，而是畏缩、缺乏坚定；希腊文“胆怯的心”也支持这一含义。
- source_word: וּרְפֵה יָדָיִם
  choice: 双手无力的人
  rationale: 保留“手”这一具体意象，同时自然表达意志消沉、行动乏力的含义；希腊文同样描写松弛无力的手。
- source_word: וְלָרָשָׁע
  choice: 罪人
  rationale: 希伯来词可指“恶人”或“有罪的人”；采用“罪人”与希腊平行文本相符，也不把道德定性表达得超过原文。
- source_word: עִקֵּשׁ דְּרָכַיִם
  choice: 行事乖僻
  rationale: 按现存希伯来文译出“道路弯曲、行为乖僻”的基本含义；中文以“行事”自然传达“道路”作为生活方式的比喻，并在脚注保留希腊异文。
theological_decisions:
- issue: 末句希伯来文“道路乖僻”与希腊文“走两条路”之间的差异
  choice: 正文依高可信度的现存希伯来文译为“行事乖僻”
  alternative: 罪人走在两条路上
  rationale: 希伯来文本身可以成立，表示生活道路扭曲乖僻；希腊平行文本则具体呈现为在两条路上行走，可能强调三心二意或为人虚伪。正文不以较明确的希腊解释取代希伯来文，而以脚注保存重要的文本差异和可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里怯懦、双手无力”保留原文的身体意象和平行结构；分成两个感叹分句，使警告语气清楚有力。
