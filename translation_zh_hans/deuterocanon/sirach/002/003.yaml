  text: Cling to him and do not turn away[a], so that you may be exalted in your latter end.
translation:
  language: zh_hans
  text: 你要紧紧依附他，不要离开他，好叫你在末后得以尊荣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好叫你在末后得以成长（或增大）。”希伯来文的动词意为“长大、变得尊大”，希腊文对应词意为“增长、增多”。
    reason: 保留גדל及其希腊文对应词在“成长、增大”与“得尊荣／成为尊大”之间的词义幅度。
lexical_decisions:
- source_word: הִדָּבֵק
  choice: 紧紧依附
  rationale: דבק表示贴近、依附并持守不离；“紧紧依附”在现代汉语中自然，也保留了命令语气和关系上的亲近。希腊文κολλήθητι同样支持“紧密连结”的含义。
- source_word: בּוֹ
  choice: 他
  rationale: 希伯来文为阳性单数代词，按上下文指上主；译作“他”保留原文代词形式，不在正文中重复补出称谓。
- source_word: וְאַל תָּסוּר
  choice: 不可离开
  rationale: סור可指转离、偏离或离去；“不可离开”简洁地表达不得离弃他的意思，同时没有把关系性或道德性的含义解释得过满。
- source_word: לְמַעַן
  choice: 好使
  rationale: למען引出目的或结果；“好使”兼具庄重和清晰，适合本节劝诫与应许相连的句式。
- source_word: תִּגְדַּל
  choice: 得以尊大
  rationale: גדל基本义是变大、成长，也可指成为尊大。结合智慧文学中的最终结局，“得以尊大”表达提升或获尊荣，却不限定为物质兴旺；脚注保留“成长、增大”的词义空间。
- source_word: בְּאַחֲרִיתֶךָ
  choice: 到末了
  rationale: אחרית可指人的末后、最终结局或未来。“到末了”是自然而庄重的现代汉语，并保留它究竟指晚年还是最终结局的开放性。
theological_decisions:
- issue: “他”的所指
  choice: 按上下文理解为上主，但正文仍照原文使用代词“他”
  alternative: 理解为智慧或教诲
  rationale: 上下文劝人信靠并敬畏上主，希伯来文与希腊文都只用阳性单数代词，并未引入新的先行词。保留代词可避免不必要的扩写。
- issue: 末句应许的性质
  choice: 译为最终得以尊大，不限定为财富或现实昌盛
  alternative: 单纯成长、增多，或晚年物质兴旺
  rationale: 希伯来文גדל和希腊文αὐξηθῇς都可表示增长；与“末了”连用时，也可能指最终获得提升或尊荣。正文采用“尊大”，脚注说明较直译的可能，以保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“紧紧依附”突出坚定不离，“到末了”避免生硬的“在你的末后”，同时保留晚年与最终结局之间的含混。
