  text: Trust in him[a], and he will uphold you; make your ways straight[b], and hope in him.
translation:
  language: zh_hans
  text: 你要信靠他[a]，他必扶持你；要修直你的道路[b]，仰望他。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信靠”也可译作“相信”或“信赖”。原文所表达的不只是理智上的认同，也包括倚赖。
    reason: lexical_alternative
  - marker: b
    text: 本句依希伯来语和希腊语译为对读者的劝勉：“要修直你的道路。”有些译本则理解为上帝的应许：“他必指引（或修直）你的道路。”
    reason: alternative_reading
  - marker: c
    text: “仰望他”也可译作“等候他”或“把盼望寄托于他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמֵן בּוֹ / πίστευσον αὐτῷ
  choice: 信靠他
  rationale: 希伯来语使役词形与希腊语对应词在此都不只表示理智上的相信，也可表达倚赖和信任。“信靠”自然地保留了这种带有委身意味的劝勉。
- source_word: יַחֲזִיק בְּךָ / ἀντιλήμψεται σου
  choice: 扶持你
  rationale: 希伯来语表达抓住、使坚固或支持某人，希腊语也有伸手相助、扶助之意。“扶持”兼顾支撑的意象和自然的现代汉语表达。
- source_word: יַשֵּׁר אָרְחוֹתֶיךָ / εὐθύνας τὰς ὁδούς σου
  choice: 要修直你的道路
  rationale: 希伯来语和希腊语均表达使道路笔直；希腊语形式明确支持第二人称命令语气。译文保留人生道路的比喻，并将其作为对读者的劝勉。
- source_word: וְקַוֵּה אֵלָיו / καὶ ἔλπισον ἐπʼ αὐτόν
  choice: 仰望他
  rationale: 希伯来语可表示怀着盼望等候，希腊语侧重盼望。“仰望他”在现代中文中简洁地表达将盼望寄托于他，同时脚注保留“等候”的语义可能。
theological_decisions:
- issue: 中间分句的主语与语气
  choice: 视为对读者的命令：“要修直你的道路。”
  alternative: 视为关于上帝的应许：“他必指引／修直你的道路。”
  rationale: 希腊语 εὐθύνας 是第二人称单数命令式，且上下文是一连串劝勉；希伯来语在此也最自然地读作命令语气。因此不将主语改为上帝，但在脚注中说明传统上存在的另一种理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“信靠”“扶持”“道路”“仰望”保留智慧文学的凝练和人生道路的比喻；各分句节奏匀称，适合公开诵读。
