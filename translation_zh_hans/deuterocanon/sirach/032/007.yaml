  register: 采用现代、庄重而易懂的劝诫语体。“你若有必要，就开口”保留原文的条件性；分号呈现前后两项相连的劝告。疑难词 בחזק 不作过度确定的解释，并以双脚注标明文本与词义的不确定性。
