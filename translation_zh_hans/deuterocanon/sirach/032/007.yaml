  text: Speak[a], young man, if there is need for you to do so, with restraint[b], two or three times if you are asked.
translation:
  language: zh_hans
  text: 年轻人，若有必要，你就发言；若有人问你，也要有节制地说两三次。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有节制地”所对应的希伯来词 בחזק 在本句中含义不确定；现译依据本节关于言语适度的上下文。现存希腊平行文本与此处希伯来文本差异很大，不能直接解决这一疑难。
    reason: textual_variant
  - marker: b
    text: 或可译作“简短地”或“谨慎地”；本节的希伯来文本较难确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: דבר
  choice: 开口
  rationale: 这是דבר的命令式。结合席间发言的语境，“开口”比单独的“说”更自然，也保留了直接劝告的语气。
- source_word: נער
  choice: 年轻人
  rationale: 该词为阳性单数，指年轻男子；现代汉语用“年轻人”称呼自然，且未将对象扩大为复数群体。
- source_word: אם צריך אתה
  choice: 你若有必要
  rationale: 保留条件结构和明确的第二人称，表达只有确有需要时才发言的意思。
- source_word: בחזק
  choice: 有节制地
  rationale: 此处希伯来文本含义不确定。按上下文衡量，“有节制地”能表达审慎、克制的言语方式，同时用脚注保留其他可能。
- source_word: פעמים ושלש
  choice: 两三次
  rationale: 原文直译近于“二次和三次”，在现代汉语中用“两三次”最自然，并保留有限次数的含义。
- source_word: אם ישאלך
  choice: 若有人问你
  rationale: 希伯来语条件从句意为“若他问你”；译文以不定主语“有人”表达，不臆定询问者身份。
