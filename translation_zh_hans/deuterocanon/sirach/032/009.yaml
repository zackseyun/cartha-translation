translation:
  language: zh_hans
  text: 冰雹之前，闪电先发；谦卑人之前，恩惠先行。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文见证在此作：“义人的祭物蒙悦纳，它的记念必不被遗忘。”这可能反映不同的文本传统或经节编排。
    reason: textual_variant
  - marker: b
    text: “谦卑人”也可译作“卑微人”或“受压伤的人”；希伯来词既可指谦卑，也可指处境低下或被压伤。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: 未到……先……
  rationale: 两分句均表达先后次序；用“未到……先……”自然呈现希伯来语的对称结构。
- source_word: בָרָד
  choice: 冰雹
  rationale: 该词的通常含义，与闪电构成气象意象。
- source_word: יִנְצַח
  choice: 先发／先行
  rationale: 此动词在这里语义较难确定；结合 לִפְנֵי 及闪电先于冰雹的意象，取“率先出现、行在前面”之意，同时以两个近义表达使中文顺畅。
- source_word: בָּרָק
  choice: 闪电
  rationale: 标准词义，与冰雹自然相配。
- source_word: דַכָּא
  choice: 谦卑人
  rationale: 该词可指谦卑、卑微或受压低的人；此处保留伦理层面的“谦卑”，但以脚注说明其范围。
- source_word: חֵן
  choice: 恩宠
  rationale: 在智慧文学和人际语境中表示蒙悦纳、得青睐；“恩宠”兼具庄重和清晰度。
theological_decisions:
- issue: 现存希伯来文与所供希腊文平行材料完全不同
  choice: 正文依据现存希伯来文箴言翻译，并在脚注交代希腊异文。
  alternative: 采用希腊文：“义人的祭物蒙悦纳，人对这祭物的记念必不被遗忘。”
  rationale: 本节有可靠的希伯来文见证，应以其为正文；希腊文可能反映不同文本传统或经节编排，不应无声取代希伯来文，但须明确保存其见证。
translation_notes:
  register: 采用简洁、庄重的现代汉语，并以“未到……先……”保留原文两分句的平行和箴言节奏。脚注标记均置于正文句末，分别说明整节希腊异文及“谦卑人”的词义范围。
