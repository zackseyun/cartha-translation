base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/022.yaml
  text: Do not trust in the way of the wicked[a], and be careful in your paths. In all your ways guard yourself, for everyone who does these things keeps the commandment.
translation:
  language: zh_hans
  text: 不要信赖恶人的道路；在自己所走的路上要谨慎。[a] 在你一切道路上，都要谨慎自守；因为凡这样行的，就是遵守诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 卡哈纳所编的希伯来文本将“不要信赖恶人的道路；在自己所走的路上要谨慎”置于本节节号之前；所列《七十士译本》在本节并无相应内容。因此，这句话可能是相邻经文的文字，不属于本节。
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח בדרך רשעים
  choice: 不要倚靠恶人的道路
  rationale: 保留希伯来文“道路”的行为隐喻；“倚靠”准确表达 בטח 所含的信赖、依恃之意。
- source_word: ובארחותיך הזהר
  choice: 在自己所走的路上要谨慎
  rationale: ארחותיך 直译为“你的路径”，在此指个人行事为人的道路；补出“所走”使现代汉语自然，同时保留原有隐喻。
- source_word: בכל דרכיך
  choice: 在你一切所行的路上
  rationale: 保留 דרכים 的“道路”意象，也清楚表达它在智慧文学中所指的一切行为和生活方向。
- source_word: שמור נפשך
  choice: 要保守自己
  rationale: נפש 在此主要指整个人或自身安危，而非抽象的“灵魂”；“保守自己”兼顾警醒和自我护守之意。
- source_word: כי
  choice: 因为
  rationale: 引出前述劝告的理由，使箴言式论证关系清楚。
- source_word: כל עושה אלה
  choice: 凡这样做的
  rationale: 准确表达分词结构的泛指意义；“这样”自然承接前面的劝告。
- source_word: שומר מצוה
  choice: 就是遵守诫命
  rationale: 保留 מצוה 的单数形式，不擅自限定为某一条律法；“遵守”自然传达 שומר 在伦理语境中的持守与实行。
theological_decisions:
- issue: מצוה 在智慧文学语境中的范围
  choice: 诫命
  alternative: 一条诫命；律法的诫命
  rationale: 原文为单数，却没有明说是某一条诫命，也没有明确加上“律法的”。译作“诫命”既保留单数形式，也不额外加入原文未说明的教义范围。
- issue: 节号前短句是否属于本节
  choice: 收入正文并加文本注
  alternative: 视为相邻经文的残留而从正文省略
  rationale: 所给高可信度希伯来见证包含此句，且最新校订决定将其恢复；但该句位于希伯来节号之前，并与所列希腊平行文本不对应，因此用脚注保留真实的文本疑问，不武断解决。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两处“道路”保留希伯来智慧文学常见的行为隐喻；句式略带箴言体的凝练感，但避免生硬直译。
