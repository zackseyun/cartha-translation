translation:
  language: zh_hans
  text: 不要倚靠使人跌倒的道路[a][b]；至于你的结局，要谨慎自守。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“מחתף”含义难以确定，可能指使人失足或跌倒的事物；也可译作“湿滑的路”或“危险的路”。
    reason: lexical_alternative
  - marker: b
    text: 资料所附的希腊语平行文本似乎属于另一节经文；在其与现存希伯来语文本冲突之处，本译文未予采用。
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח
  choice: 不要信赖
  rationale: בטח表示信赖、倚靠；“不要信赖”直接保留警告语气，也不额外限定这种信赖的性质。
- source_word: בדרך
  choice: 道路
  rationale: דרך既可指实际道路，也可比喻人的行径或处世方式；“道路”保留了原文两者兼具的意象。
- source_word: מחתף
  choice: 使人跌倒的
  rationale: 该词词形和确切含义较难确定，语境中很可能指引起失足、跌倒或陷落之物；此译法贴近其可能的使役含义，同时用脚注保留“湿滑”“险诈”等可能理解。
- source_word: ובאחריתך
  choice: 至于你的结局
  rationale: אחרית可指末后、结局或未来，且原文有第二人称单数所有格；此译法保留“你的”，避免将其泛化为一般的“最终”。
- source_word: השמר
  choice: 要谨慎自守
  rationale: השמר是带反身意味的命令式，意为当心、提防或保守自己；“谨慎自守”兼顾警醒和自我防备之意。
