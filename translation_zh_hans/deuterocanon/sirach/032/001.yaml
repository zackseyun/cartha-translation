base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/001.yaml
  text: If they have made you the leader[a], do not exalt yourself; be among them like one of them. Care for them, and then recline; prepare what is needed[c][b], and then take your place.
translation:
  language: zh_hans
  text: 若有人立你为宴席的主事人[a]，不要自高；要和他们在一起，像他们中间的一员。要照料他们[b]，然后才入席斜倚[c]；预备好所需的一切[d]，然后才就位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文见证中的开头一句在卡哈纳版以方括号标出。上下文有力支持这里是宴席主事者的场景；本节希腊文平行文本也涉及用餐方面的教导，不过措辞差异很大。
    reason: textual_variant
  - marker: b
    text: “照料他们”也可译作“为他们操心”。希伯来文动词既可强调内心的关切，也可强调实际的料理。
    reason: lexical_alternative
  - marker: c
    text: “斜倚”反映古代正式宴席中常见的用餐姿势。
    reason: cultural_note
  - marker: d
    text: 此处希伯来文本较难确定；也可能指安排好宾客的位置、供应或服侍。
    reason: textual_uncertainty
lexical_decisions:
- source_word: ראש נבחרת
  choice: 被选为宴席的主事人
  rationale: 原文短语指受选群体或聚会中的首领。上下文是照料宾客并随后入席，因此译作“宴席的主事人”，既交代场景，也不把角色过度限定为某种固定职衔。
- source_word: אל תתרומם
  choice: 不要自高
  rationale: 反身表达意为抬高自己、自我尊大；“不要自高”简洁保留谦卑劝诫的道德力度。
- source_word: היה להם כאחד מהם
  choice: 要在众人中如同他们中的一员
  rationale: 表达主事者不应与众人自我隔绝，而应谦和地置身其中；此译兼顾原文结构和现代汉语自然度。
- source_word: דאג להם
  choice: 要照料他们
  rationale: 该动词既可指关切，也可指实际料理。在宴席语境中，“照料”能自然涵盖对宾客的关心和具体招待。
- source_word: תסב
  choice: 入席斜倚
  rationale: 该词指古代正式用餐时斜倚席间的姿势；加入“入席”使中文读者容易理解，同时保留历史文化特征。
- source_word: הכן מרכם
  choice: 预备好所需的一切
  rationale: 传世希伯来文本此处含义不够确定；上下文大概指在自己就位前办妥宾客或宴席所需的安排。此译传达可能含义而避免虚假的精确。
- source_word: תרבץ
  choice: 就位
  rationale: 动词可指躺卧或安顿下来。因前文已经明确用餐时斜倚的姿势，此处译作“就位”，自然呈现行动次序并避免重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“主事人”比单纯的“领袖”更贴合宴席语境；以“然后才”两次呈现先照料、预备，后入席、就位的劝诫次序。对括号中的开头和 הכן מרכם 的不确定性分别用脚注说明，不在正文中强行消解。
