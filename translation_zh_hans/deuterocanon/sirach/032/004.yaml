translation:
  language: zh_hans
  text: 酒宴上献给上帝的歌，好比盛金子的袋子上的印章[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝之歌。”希伯来语原文措辞简略，也可能指献给上帝的歌。
    reason: lexical_alternative
  - marker: b
    text: 本节此前几行的希伯来语文本在流传中存在疑难；这里的结尾比喻最为清楚，译文直接依据现存希伯来语。希腊语平行文本与此差异很大。
    reason: textual_variant
lexical_decisions:
- source_word: כחותם
  choice: 好比……印章
  rationale: 前缀 כ 表示比较；חותם 可指印章或印玺。此处用普通读者易懂的“印章”，并以“好比”自然表达比喻。
- source_word: על כיס זהב
  choice: 盛金子的袋子上的
  rationale: כיס 是装钱财或贵重物品的袋子、囊袋；“盛金子的袋子”清楚表明袋中所装的是金子，避免“金袋”被误解为金制的袋子。על 按空间关系译为“……上的”。
- source_word: שיר
  choice: 歌
  rationale: 保留单数名词的具体意象；现代汉语中无需另加量词也自然。
- source_word: אל
  choice: 献给上帝
  rationale: שיר אל 是压缩表达，可能表示面向上帝的歌，也可能较宽泛地表示“上帝之歌”。正文采用在此语境中自然的方向性理解，并在脚注保留另一可能。
- source_word: על משתה היין
  choice: 酒宴上
  rationale: משתה 指宴饮、筵席，היין 明指酒；“酒宴”简洁保留宴饮场景。介词 על 在这里按语境自然译为“……上”。
theological_decisions:
- issue: שיר אל 中“歌”与“上帝”的关系
  choice: 献给上帝的歌
  alternative: 上帝之歌
  rationale: 希伯来语短语关系紧缩，方向性理解合乎语境，但不能排除较宽泛的所属或关联含义；正文采用自然清楚的译法，脚注明确保存歧义，避免加入更狭窄的礼仪或教派含义。
translation_notes:
  register: 采用现代、清楚而庄重的普通话。“盛金子的袋子”虽比“金囊”稍长，却能避免材质歧义；“酒宴”简洁呈现原文宴饮场景。正文中的[a][b]与脚注逐一对应。
