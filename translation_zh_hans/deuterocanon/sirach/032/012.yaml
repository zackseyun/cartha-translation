  text: And fulfill your desire in the fear of God[a], and not with any lack.
translation:
  language: zh_hans
  text: 要在敬畏上帝中成全你的心愿[a]，不可有任何欠缺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“要照至高者所赐的献给他，并按你手中所得的，慷慨地献上。”希腊文本所反映的本节经文形态与现存希伯来文本有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: ושלם
  choice: 满足
  rationale: שלם在此可表达使之圆满、完成；与רצון搭配，译为“满足……心愿”较符合现代汉语，同时保留“使愿望得以实现”的含义。
- source_word: רצון
  choice: 你的心愿
  rationale: רצון可指意愿、愿望或喜悦；此处“心愿”自然表达个人所愿，又不把词义限定为抽象的“意志”。
- source_word: ביראת אל
  choice: 在敬畏上帝中
  rationale: 保留希伯来语ב所表达的处境或方式，并维持智慧文学中“敬畏上帝”的核心措辞。
- source_word: אל
  choice: 上帝
  rationale: אל在此是对神的通常称谓；“上帝”是清楚、庄重且通行的现代汉语表达。
- source_word: ולא בחסר כל
  choice: 毫无欠缺
  rationale: חסר表示缺少、欠缺，כל使其范围完整化。原文表达简练，译作“毫无欠缺”既贴近字面，也保留它究竟指愿望得到完全满足，还是行事不吝惜的语义张力。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在本节有显著差异
  choice: 正文依据现存希伯来文本翻译，并用脚注注明希腊文本的异文。
  alternative: “要照至高者所赐的献给他，并按你手中所得的，慷慨地献上。”
  rationale: 本节希伯来文本保存完整且可信度高，应作为正文依据；希腊文本显然反映了大幅不同的经文形态，不宜将两者调和或把希腊内容暗中并入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在敬畏上帝中”略带智慧文学的经文语体；“满足你的心愿，毫无欠缺”保留希伯来原文的简练及末句指向上的含混，不擅自解释为奉献时不可吝啬。
