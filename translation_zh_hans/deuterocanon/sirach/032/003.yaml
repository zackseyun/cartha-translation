base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/003.yaml
  text: Speak[a], elder, for it is fitting for you; but with sound understanding[b], and do not hinder song.
translation:
  language: zh_hans
  text: 长者啊，你当发言，因为这合乎你的身份；却要以明智自持，不要妨碍歌唱。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以明智自持”所译的希伯来语十分紧缩，也可理解为“要在明智中有所克制”或“要显出审慎的含蓄”。
    reason: lexical_alternative
  - marker: b
    text: 希腊语平行文本在此差异很大，作：“献上细面的人报答恩惠。”这表明本节存在不同的文本传统。
    reason: textual_variant
lexical_decisions:
- source_word: מלל
  choice: 发言
  rationale: 这是命令语气，意为“说话”。宴席语境中，“发言”比单纯“说”更自然，也保留庄重感。
- source_word: שב
  choice: 长者
  rationale: 此词在这里称呼年长且受尊重的人；“长者”同时传达年龄与敬意。
- source_word: כי הוא לך
  choice: 因为这于你合宜
  rationale: 直译近于“因为这是你的”，语境所表达的是发言符合长者的身份与席间角色。
- source_word: והצנא שכל
  choice: 但要言语有度，显出明智
  rationale: 希伯来语表达紧缩且解释不确定；译文保留“克制、审慎”与“明智、悟性”两方面的可能含义，而不把它简化为单一概念。
- source_word: ואל תמנע שיר
  choice: 不要妨碍歌唱
  rationale: מנע可指阻止、拦阻或扣留；这里指长者发言不应妨碍宴席中的歌唱。“歌唱”自然地表达集合意义。
theological_decisions:
- issue: 智慧宴席语境中对שב的称呼
  choice: 长者
  alternative: 老人、年老者
  rationale: “长者”保留原文明确的年龄指向和尊敬语气，又避免“老人”在现代汉语中可能带有的生硬或不敬感。
- issue: והצנא שכל这一紧缩短语的理解
  choice: 要言语有度，显出明智
  alternative: 要以明智发言；要在智慧上谦抑
  rationale: 原文可能同时涉及克制、谦抑或审慎，以及悟性、明智。正文用并列措辞保留这种张力，脚注说明其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的宴席劝诫语体。“长者啊”明确呈现直接称呼；分号前后形成“应当发言”与“不可妨碍歌唱”的平衡。正文所有脚注标记均已对应列出。
