  text: Do nothing without counsel[a], and after your deeds[b], do not be regretful.
translation:
  language: zh_hans
  text: 未经商议，不要做任何事；事后也不要懊恼[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要恼怒”或“不要烦恼”。希伯来语可指人在行动之后变得恼怒或心烦；正文依本节的智慧语境译为“懊恼”。
    reason: lexical_alternative
  - marker: b
    text: 现存的希腊语平行文本与本节希伯来语措辞不相符，因此正文以现存希伯来语见证为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: בלא עצה
  choice: 未经商议
  rationale: עצה可指劝告、谋议或审慎筹划；“未经商议”既保留智慧文学中征求意见的意味，也不排除行动前慎思的含义。
- source_word: אל תפעל דבר
  choice: 不要做任何事
  rationale: 在否定命令中，דבר泛指“任何事”；此译自然地表达禁令的完整范围。
- source_word: ואחר מעשיך
  choice: 事后
  rationale: 原文直译为“在你的行为之后”。“事后”以自然简洁的现代汉语保留先行动、后产生情绪反应的时间次序。
- source_word: אל תתקצף
  choice: 不要懊恼
  rationale: תקצף可表示动怒、烦恼或恼恨；在先商议后行动的智慧语境中，“懊恼”能表达事后烦扰或自责，同时在脚注保留更字面的可能。
