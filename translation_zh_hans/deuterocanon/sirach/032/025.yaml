translation:
  language: zh_hans
  text: 直到他裁决自己百姓的案件[a]，并凭着自己的怜悯使他们欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对自己百姓的事作出裁决”，或“为自己的百姓施行公义”。希腊原文采用形式上重复的司法用语，也可作为表示作出判决的习语。
    reason: 保留κρίνῃ τὴν κρίσιν可能表示审理案件、作出裁决或施行公义的词义范围。
lexical_decisions:
- source_word: ἕως
  choice: 直到
  rationale: 表示前述行动持续到这一时间终点；“直到”在现代汉语中自然、准确。
- source_word: κρίνῃ
  choice: 审断
  rationale: 该词在ἕως之后使用虚拟式，表达尚待发生的裁决；“审断”既保留司法意味，也能与宾语“案件”自然搭配。
- source_word: τὴν κρίσιν
  choice: 案件
  rationale: κρίνειν τὴν κρίσιν在希腊语中形式上重复，可指审理案件、作出判决或施行公义。直译为“审判审判”在汉语中生硬，“案件”较自然，同时借脚注保留其他可能含义。
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: 自己百姓的
  rationale: 保留属格结构及其一定的语义开放性，不完全限定为针对百姓或为百姓伸冤；“自己”清楚回指该句主语。
- source_word: εὐφράνει
  choice: 使他们欢喜
  rationale: 保留动词的使动意义，即使他们喜乐；比单说“欢喜”更准确。
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: 以他的怜悯
  rationale: ἐν在这里可表示凭借的方式或所在的范围；“以”自然表达怜悯是使他们欢喜的凭借，同时不作过度阐释。
theological_decisions:
- issue: 如何表达κρίνῃ τὴν κρίσιν这一司法性短语
  choice: 审断自己百姓的案件
  alternative: 为自己的百姓施行公义；对自己百姓的事作出裁决
  rationale: 原文的重复结构可涵盖审理、裁决或伸张公义等意味。“审断……案件”在现代汉语中自然，并保留司法语义；脚注列出其他读法，以免把原文所保留的方向性——有关百姓或为百姓伸冤——单一定死。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“审断”保留司法色彩而不过分古雅；“使他们欢喜”准确体现使动意义。脚注标记置于其所解释的司法短语之后。
