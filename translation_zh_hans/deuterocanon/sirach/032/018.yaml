  text: A wise man will not take a bribe[c][b][a], but a proud scoffer will not keep the law.
translation:
  language: zh_hans
  text: 智慧人不收受贿赂[c]；狂傲的嘲讽者[a]不遵守律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文“狂傲者、嘲讽者”（זד ולץ）也可理解为两个品格称谓，即“狂傲者和嘲讽者”，而不一定是合指一个“狂傲的嘲讽者”。
    reason: alternative_reading
  - marker: b
    text: “律法”或译“训诲”；希伯来文תורה可泛指有权威的教导，不仅指法律条文。
    reason: lexical_alternative
  - marker: c
    text: 此处所列的希腊文平行文本与这行希伯来文并不对应，因此正文主要依据现存希伯来文见证翻译。
    reason: textual_variant
lexical_decisions:
- source_word: איש חכם
  choice: 智慧人
  rationale: 保留希伯来文单数人物形象及箴言式概括；“智慧人”简洁、庄重，也比“智慧的男子”更符合现代汉语习惯。
- source_word: לא יקח
  choice: 不收受
  rationale: 此处未完成式表达智慧人一贯的行为特征；“收受”与“贿赂”是自然搭配，也准确传达“接受、拿取”。
- source_word: שחד
  choice: 贿赂
  rationale: 这是该希伯来词的标准含义；现代汉语清楚直接。
- source_word: זד ולץ
  choice: 狂傲的嘲讽者
  rationale: 将两个相邻的品格称谓理解为一个复合描述，既保留זד的狂傲、僭妄意味，也保留לץ在智慧文学中轻蔑嘲弄的意味；两者也可能分别指两类人，故以脚注说明。
- source_word: לא ישמור
  choice: 不遵守
  rationale: שמר与תורה搭配时通常指谨守、遵行；“遵守”在现代汉语中自然准确。
- source_word: תורה
  choice: 律法
  rationale: 此处指具有权威的道德规范或教导；“律法”保留其规范性，而较宽泛的“训诲”列入脚注。
theological_decisions:
- issue: 智慧文学语境中תורה的译法
  choice: 律法
  alternative: 训诲；教导
  rationale: “律法”能表达此句所强调的权威性规范，但不把תורה可能具有的较广泛“训诲、教导”义静默排除，故保留词义脚注。
- issue: זד ולץ所指人数及句法关系
  choice: 合译为单数复合称谓“狂傲的嘲讽者”
  alternative: “狂傲者和嘲讽者”两个并列称谓
  rationale: 希伯来文两词之间没有连接词，可理解为共同刻画同一类人，也可能是两个并列的品格标签；正文采用汉语较顺畅的复合表达，脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。以分号呈现两种品格的对照；“收受贿赂”“遵守律法”均为自然的现代汉语搭配。正文不消解זד ולץ的句法不确定性，也不把תורה限定为单一神学含义。
