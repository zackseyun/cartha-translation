base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/013.yaml
  text: For all these things bless your Maker[a], who fills you with his goodness. He who seeks the law will obtain favor[c][b], but the hypocrite will be caught by it.
translation:
  language: zh_hans
  text: '在这一切事上，要称颂你的创造者[a]；他以自己的美善使你饱足。


    寻求上帝的人盼望蒙悦纳[b]；妄自尊大的人却必因此落入圈套[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希伯来文见证与希腊文差异很大。希腊文作：“因为主是施行报偿的，他必七倍报偿你。”
    reason: textual_variant
  - marker: b
    text: 这一行的希伯来文较难确定。正文按传世文字将 אל 理解为“上帝”；按上下文也可能是指寻求律法或神圣训诲。
    reason: alternative_reading
  - marker: c
    text: 译作“妄自尊大的人”的希伯来词含义不确定，也可能指“夸口的人”“自欺的人”或“伪善的人”。末尾的“因此”保留 בו所指的不确定性；它也可能理解为“被他／它网罗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ברך
  choice: 称颂
  rationale: 该祈使动词指因上帝的恩惠而赞美、颂扬他；“称颂”既保留经文语体，也符合现代汉语表达。
- source_word: עושך
  choice: 造你的那一位
  rationale: 分词连同第二人称后缀直译为“造你的那一位”。这样既保留个人关系，也避免加入原文没有明说的称号。
- source_word: המרוך מטובתו
  choice: 他以自己的美善使你饱足
  rationale: 这一组合文本的措辞略有不确定，但大意是创造者从自己的美善中丰丰富富地供应受话者；“使你饱足”自然地表达充足供应，同时没有把“美善”窄化为物质财富。
- source_word: דורש אל
  choice: 寻求上帝的人
  rationale: 传世希伯来文的 אל 最直接可读作“上帝”，דורש 则表示主动寻求或追求。正文采用这一较贴近现存辅音文本的读法，并在脚注保留“寻求律法或神圣训诲”的语境性解释。
- source_word: יקוה רצון
  choice: 可以盼望蒙悦纳
  rationale: יקוה 的通常意义是“盼望、期待”，רצון 在此可指恩宠、悦纳。译文保留盼望的语气，不把尚有张力的表达直接改成必然获得。
- source_word: מתלהלה
  choice: 妄自尊大的人
  rationale: 此词罕见或文本有讹误，可能指夸口、自欺或品格虚假的人。“妄自尊大的人”能呈现智慧文学中的反面人物，又不武断地限定为宗教意义上的“伪善者”。
- source_word: יוקש בו
  choice: 必因此落入圈套
  rationale: 动词 יקש 表示被网罗、陷入圈套；בו 的具体所指并不完全清楚。“因此”保留与前述寻求对象或行为的联系，同时避免武断指定为“被律法”或“被上帝”网罗。
theological_decisions:
- issue: 现存希伯来文与希腊文传统显著不同
  choice: 正文以开罗藏经库所存希伯来文为主要依据，希腊文异文列入脚注
  alternative: 按希腊文译作：“因为主是施行报偿的，他必七倍报偿你。”
  rationale: 本项目在《便西拉智训》的希伯来文尚存时优先依据希伯来文。两种传统在此内容完全不同，不能暗中调和，因此正文译希伯来文，并完整注明希腊文异文。
- issue: אל 的理解
  choice: 译为“上帝”
  alternative: 按上下文理解为“律法”或“神圣训诲”
  rationale: 无元音辅音文本 אל 最直接支持“上帝”，而“律法”属于为取得智慧语境连贯而作的解释。正文采用较形式对应的读法，脚注保留另一可能。
- issue: בו 所指为何
  choice: 用“因此”保留泛指关系
  alternative: 明确译为“被它（律法）网罗”或“被他（上帝）网罗”
  rationale: 若前句的 אל 译为上帝，בו 可理解为指向上帝；若按语境补作训诲，也可指训诲。原文没有足够证据排除任何一方，故不在正文中强行消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称颂”“蒙悦纳”保留经文语感；“造你的那一位”“落入圈套”则避免生硬古奥。两行采用对称结构，以呈现希伯来智慧诗的格言式节奏。
