review_pass:
  verdict: revise
  source_fidelity: 现存希伯来文在节号（十四）之后读作“寻求上帝所愿的／所喜悦之事的人必领受教诲；他必在自己的祷告中应答他”。草稿第二分句采用了节号之前一行的“殷切（清早）寻求他”（ומשחרהו），而未按第14节希伯来文的“他必应答他”（ויענהו）翻译。因此正文与所列第14节希伯来底本不符。希腊异文脚注准确保留了其与希伯来文的实质差异。
  naturalness: “寻求上帝所喜悦之事的人”与“领受教诲”均自然、庄重。修订后将第二分句改为明确而自然的“上帝必在他的祷告中应答他”，避免“在祷告中得到回应”所造成的施事者不明，并与希伯来文动词的主动语态相合。
  terminology: “上帝”“教诲”“祷告”符合现代标准汉语的庄重经文语体。“上帝所愿意的事”可自然表达 חפצי אל，且不把该短语限定为某一神学体系。
  issues:
  - severity: high
    issue: 正文第二分句混入了节号前一行的“切切寻求他的人”，并遗漏第14节的“他必应答他”。
    rationale: 小号节标“（十四）”后的希伯来文为“דורש חפצי אל יקח לקח, ויענהו בתפלתו”。其中没有“切切／清早寻求他”的分词；该表述来自节标之前的“ומשחרהו”。第14节末句则以“应答他”表达上帝对寻求者祷告的回应。
  - severity: medium
    issue: “必在祷告中得到回应”弱化了希伯来文主动动词“应答他”的施事关系。
    rationale: ויענהו的语境所指为上帝应答寻求者；中文宜明示“上帝”作主语，以免读者误解为祷告本身或他人回应。
  revised_text: 寻求上帝所愿意之事的人，必领受教诲[a]；上帝必在他的祷告中应答他。
  revised_footnotes:
  - marker: a
    text: 希腊传统作：“不要献上贿赂，因为他不会接受。”这里现存的希伯来文本与希腊文本有显著差异。
    reason: textual_variant
  revision_rationale: 修订严格按节号“（十四）”之后的希伯来文翻译：דורש חפצי אל译为“寻求上帝所愿意之事的人”，יקח לקח译为“必领受教诲”，ויענהו בתפלתו译为“上帝必在他的祷告中应答他”。删除属于节号之前一行的“切切寻求他的人”。保留希腊传统脚注，因其“不要献上贿赂，因为他不会接受”的读法与现存希伯来文完全不同。
