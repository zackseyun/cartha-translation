  text: One who seeks what pleases God will accept instruction[a], and the one who seeks him early will receive an answer through his prayer.
translation:
  language: zh_hans
  text: 寻求上帝所喜悦之事的人，必领受教诲[a]；清早寻求他的人，他必在其祷告中应允他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊传统作：“不要试图行贿，因为他不会接受。”这里现存的希伯来文本与希腊文本有显著差异。
    reason: textual_variant
lexical_decisions:
- source_word: דורש חפצי אל
  choice: 寻求上帝所喜悦之事的人
  rationale: 将分词 דורש 译为持续、惯常的“寻求”，并把压缩的结构 חפצי אל 自然表达为“上帝所喜悦之事”，既保留原意，也避免将其过度解释为特定神学概念。
- source_word: יקח לקח
  choice: 必领受教诲
  rationale: 原文直译近于“取得教导”；在智慧文学语境中，“领受教诲”自然庄重，并表达主动接受教导之意。
- source_word: ומשחרהו
  choice: 切切寻求他的人
  rationale: שחר 可兼有清早寻求和殷切寻求的意味。中文“切切寻求”自然地传达勤勉、迫切的语气，但不强行保留可能成为误读焦点的时间意象。代词“他”依上下文指上帝。
- source_word: ישיג מענה / ויענהו בתפלתו
  choice: 必在祷告中得到回应
  rationale: 综合现存希伯来文本中“得到回答”与“在他的祷告中回应他”的表达，以“在祷告中得到回应”保留回应发生的范围或关联，同时不强断其具体方式。
- source_word: μὴ δωροκόπει, οὐ γὰρ προσδέξεται
  choice: 不纳入正文
  rationale: 希腊传统意为“不要献上贿赂，因为他不会接受”。它与现存希伯来文本差异显著；本项目在希伯来文存留时以希伯来文为正文依据，因此将希腊异文置于脚注。
theological_decisions:
- issue: 现存希伯来文本与希腊传统存在重大差异
  choice: 正文采用现存希伯来文本，脚注保留希腊传统
  alternative: 按希腊文译作：“不要献上贿赂，因为他不会接受。”
  rationale: 希伯来见证在此完整可用，应作为正文的首要依据；但希腊传统呈现完全不同的训诫，足以实质改变经文含义，因此必须明确披露，而不将两种传统调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝所喜悦之事”保持智慧文学语气；“切切寻求”传达 שחר 的殷切意味；“在祷告中得到回应”保留原文在方式与范围上的一定开放性。
