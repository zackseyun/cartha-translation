  text: He who keeps the law guards his life[a], and he who trusts in Yahweh will not be put to shame.
translation:
  language: zh_hans
  text: 谨守律法的人，保全自己的性命[a]；信靠耶和华的人，必不蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希腊文平行本与希伯来文有重大差异：“直到他照着一个人的行为报偿他，并照着众人的心思报偿他们的作为。”正文依据现存的希伯来文见证。
    reason: textual_variant
lexical_decisions:
- source_word: נוצר תורה
  choice: 谨守律法
  rationale: נצר含守护、谨守之意；以תורה为宾语时，“谨守律法”既自然，也保留认真遵行的意味。
- source_word: שומר נפשו
  choice: 保全自己的性命
  rationale: נפש在此指人的生命，而非现代语境中与身体相分的“灵魂”；“保全自己的性命”表达自我保存的含义。
- source_word: ובוטח ביהוה
  choice: 信靠耶和华的
  rationale: בטח表示倚赖、信靠；分词结构译作泛指人物。“耶和华”是现代中文圣经语体中对יהוה的通行音译。
- source_word: לא יבוש
  choice: 必不蒙羞
  rationale: בוש可指因所倚赖的落空而受羞辱；“不蒙羞”保留其结果性和常见的圣经表达。
theological_decisions:
- issue: יהוה的译法
  choice: 耶和华
  alternative: 上主；雅威
  rationale: 采用现代中文圣经读者熟悉的专名译法，清楚区别于一般称谓“主”，但不借此断定古代发音。
- issue: 希伯来文与希腊文的重大差异
  choice: 正文依据现存希伯来文，脚注完整说明希腊文异文
  alternative: 采用希腊文：“直到他按各人的行为报偿他，并按众人的意念报偿他们的作为。”
  rationale: 此处希伯来文见证完整且可信度高，故作为正文依据；希腊文呈现的是实质不同的句子，不宜与希伯来文调和，需在脚注中保留文本张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语；以两个平行的“……的”结构再现希伯来文格言体。正文中的[a]与脚注对应。
