  text: so that you may rejoice in their honor[b][a], and receive a reward for your instruction.
translation:
  language: zh_hans
  text: 为要使你因他们的尊荣而欢喜，并因训诲[a]得到奖赏。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”也可译作“管教”或“规整”。希伯来语 מוסר 在智慧文学中可包含教导、约束和良好秩序等含义。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本与此差异很大：“留心诫命的人献平安祭。”正文采用现存的希伯来文本；《便西拉智训》有希伯来文本保存之处，以希伯来文本为主要依据。
    reason: alternative_reading
lexical_decisions:
- source_word: למען
  choice: 好使
  rationale: 表达目的或结果，既自然，也保留希伯来语连接词的目的意味。
- source_word: תשמח
  choice: 欢喜
  rationale: 准确表达 שמח 的喜乐含义，并保持智慧文学庄重而通俗的语气。
- source_word: בכבודם
  choice: 因他们的尊荣
  rationale: כבוד 可指尊荣、荣耀；介词 ב 在这里表示欢喜所关涉的事由。此译保留“他们本有的尊荣”与“他们所得的尊荣”之间的开放性。
- source_word: ועל
  choice: 并因
  rationale: 连接后半句，并表达获得赏报的根据或缘由。
- source_word: מוסר
  choice: 训诲
  rationale: מוסר 可涵盖教导、管教、规训和良好秩序。“训诲”适合智慧文学语境，又不把含义局限为惩戒。
- source_word: תשא
  choice: 获得
  rationale: נשא 字面为拿起、承载，与 שכר 连用时可自然理解为领取或获得赏报。
- source_word: שכר
  choice: 赏报
  rationale: 表达因合宜行为所得的回报，比“工资”更符合智慧文学语境。
theological_decisions:
- issue: 希伯来文本与希腊平行文本差异显著
  choice: 正文直接翻译现存希伯来文本，并在脚注列出希腊异文
  alternative: 按希腊文译为“留心诫命的人，就是献平安祭”
  rationale: 本节有可信度较高的现存希伯来见证，应以此为正文依据；希腊文反映了完全不同的文本传统，不宜无声调和或取代希伯来文。
- issue: מוסר 的智慧文学含义
  choice: 译作“训诲”，并以脚注保留“管教”或“规整”的可能
  alternative: 译作“管教”或“良好秩序”
  rationale: “训诲”能体现道德教导，同时避免将词义过度收窄为惩罚；脚注保留原词的多义性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好使……并……”保留原文两分句结构；“尊荣”与“赏报”维持智慧文学语域。正文不添加希伯来文没有明确表达的“你的”，以免将“训诲”的施行者限定为受话者。
