base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/006.yaml
  text: Like settings of gold and a seal of beryl[b][a], so is the sound of a psalm with the sweetness of new wine.
translation:
  language: zh_hans
  text: 精金的镶嵌饰物和一枚绿柱石印玺[b]，正如伴着甘美新酒的诗歌之声。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所列希腊文平行文本作：“不可空手来到主面前。”这反映了不同的经文传统或节号编排；正文依现存希伯来文翻译。
    reason: textual_variant
  - marker: b
    text: “绿柱石”也可译作“祖母绿”；原文所指宝石的确切种类不能确定。“印玺”也可译作“印章”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מלואות פז
  choice: 精金的镶座
  rationale: פז指精炼而贵重的金；מלואות在珠宝意象中可指承托或镶嵌宝物的座架。“精金的镶座”保留了原文凝练的首饰图景，也避免把它具体化为原文未明说的某一种器物。
- source_word: חותם ברקת
  choice: 绿柱石印玺
  rationale: חותם可指印章或印玺；ברקת是一种身份不完全确定的宝石，常被理解为绿柱石或祖母绿。正文采用较宽泛的矿物名称“绿柱石”，并以脚注保留其他可能。
- source_word: קול מזמור
  choice: 诗歌之声
  rationale: קול是声音，מזמור指歌、颂歌或配乐吟唱的诗篇。“诗歌之声”保留其诗礼色彩，不把它缩限为纯器乐，也不预设特定礼仪用途。
- source_word: על נועם תירוש
  choice: 伴着甘美的新酒
  rationale: תירוש指新酒，נועם表示甘美、悦人；介词על在此关系含混。译作“伴着”自然呈现宴席中歌声与酒相配的意象，而不武断规定为位置、原因或严格的伴奏关系。
theological_decisions:
- issue: 希伯来文与所列希腊文平行文本严重不合
  choice: 正文依据现存希伯来文的诗性比喻翻译
  alternative: 依希腊文译为“不可空手来到主面前”
  rationale: 所列希腊文与希伯来文在语义上完全不同，看来属于不同的经文传统、编排或节号对应。既然此处有可信度较高的希伯来文见证，正文以它为准，同时在脚注中完整披露希腊异文，不将两者强行调和。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。原文是省略系词的紧凑诗句，译文用“如同……也是如此”显明比喻关系；不补入原文没有明确表达的审美评语。脚注标记均已置于正文相应位置。
