lexical_decisions:
- source_word: כרביד
  choice: 如同……金项饰
  rationale: רביד指佩在颈上的饰物或项链；“项饰”既保留具体形象，又不把其形制限定得过细。前缀כ־译作“如同”，明确比喻关系。
- source_word: נפך
  choice: 红玉
  rationale: 这种古代宝石的确切现代对应物不确定；“红玉”保留其作为名贵彩色宝石的形象，并以脚注说明其他可能鉴定。
- source_word: ספיר
  choice: 蓝宝石
  rationale: 这是ספיר的传统译名，但古代所指可能是青金石，因此在脚注中保留鉴定上的不确定性。
- source_word: כך נאים
  choice: 也是如此
  rationale: 承接前面的首饰比喻，简洁表达相称、美观之意，不额外限定究竟偏重悦目还是合宜。
- source_word: דברים יפים
  choice: 美好的言语
  rationale: 既表达言语的优美与可贵，也与珠宝首饰的审美意象自然呼应。
- source_word: על משתה היין
  choice: 在酒宴上
  rationale: 自然表达以饮酒为特征的宴席场景，同时保留原文具体的社交语境。
