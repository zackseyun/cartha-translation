  alternative: 采用所提供的希腊文，译为离恶与远离不义的内容。
  rationale: 所给希腊文在语义上完全不对应本节希伯来文，似属另一节或不同的文本排列；本节希伯来见证完整、可信度高，故按希伯来文翻译，不以错位的希腊文替代。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“金项饰”使首饰意象清楚，“在酒宴上”自然呈现宴席语境。正文中的[a]、[b]紧随相关宝石名，[c]置于全句末，说明整节的文本问题。
