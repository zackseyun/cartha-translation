  text: When it is time to depart, do not linger; go home and do what pleases you.
translation:
  language: zh_hans
  text: 到了该离席的时候，不要耽搁；回家去，成全心愿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成全心愿”：原文直译为“成全意愿（或心愿）”；未明说是谁的意愿，也可指所喜悦的事。
    reason: 保留רצון所属者及具体所指的真实含混，避免正文添加“你的”这一未明示限定。
lexical_decisions:
- source_word: מִפְקָד
  choice: 该离席的时候
  rationale: 此词可指指定的时刻、召集或解散的时刻；在宴席训诲的语境中，指到了应当离席回家的时候。
- source_word: אַל־תִּתְאַחַר
  choice: 不要耽搁
  rationale: 准确表达不要迟延、逗留之意，符合现代汉语习惯。
- source_word: פְּטֹר לְבֵיתֶךָ
  choice: 回家去
  rationale: 原文直指离开并往自己家去；汉语简洁表达即可涵盖“离去”的动作。
- source_word: וּשְׁלֵם רָצוֹן
  choice: 遂你所愿
  rationale: שׁלם有完成、成全之意，רצון可指意愿、心愿或所喜悦的事；此译保留其宽泛含义，同时保持自然庄重。
theological_decisions:
- issue: רצון所指的意愿属于谁
  choice: 正文译作“你所愿”，并以脚注说明原文未明说所属者
  alternative: “遵行旨意”或“做你喜欢的事”
  rationale: 希伯来文只说“成全意愿/心愿”，没有明确神、主人或受话者；避免将其神学化为“旨意”，也避免把意义收窄为即时喜好。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“离席”交代宴席语境，“遂你所愿”略带典雅色彩，但普通读者容易理解。
