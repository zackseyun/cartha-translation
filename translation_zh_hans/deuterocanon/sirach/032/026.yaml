  yaml_path: translation/deuterocanon/sirach/032/026.yaml
  text: Mercy is beautiful in the time of his distress[b][a], like rain clouds in a time without rain.
translation:
  language: zh_hans
  text: 他[b]遭受困苦时，怜悯是美好的[a]，如同无雨时的雨云。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他遭受困苦时，怜悯是合宜的。”这个形容词可强调美好、悦人或合宜。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“他的困苦”，用阳性单数代词；在这里是智慧训言中的泛指说法。
    reason: cultural_note
lexical_decisions:
- source_word: ὡραῖον
  choice: 美好的
  rationale: 该词可表达美丽、悦人或合宜；这里赞美怜悯在困苦中的可贵与可喜。“美好的”保留其评价和意象，同时不把含义收窄为单纯“及时”或“合宜”。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 该词指怜悯、同情及由此而来的帮助；“怜悯”直接而庄重，适合本节智慧文学语境。
- source_word: ἐν καιρῷ θλίψεως αὐτοῦ
  choice: 他遭受困苦时
  rationale: 自然表达时间关系，并保留 αὐτοῦ 的阳性单数形式；θλῖψις 的受压、患难之意译作普通读者易懂的“困苦”。
- source_word: νεφέλαι ὑετοῦ
  choice: 雨云
  rationale: 属格描述带来或含有雨水的云；“雨云”简洁自然，清楚保留原文意象。
- source_word: ἐν καιρῷ ἀβροχίας
  choice: 无雨时
  rationale: ἀβροχία 指缺少雨水；“无雨时”贴近原文，并与前半句的时间结构呼应，不额外强化为严重的“旱灾”。
theological_decisions:
- issue: 智慧训言中 αὐτοῦ 的泛指阳性单数
  choice: 正文保留“他”
  alternative: “人”或省去代词，译作“遭受困苦时”
  rationale: 希腊文明确使用阳性单数代词，且在智慧文学中具有代表性、泛指用法。保留“他”忠实反映原文形式，同时以脚注说明其泛指性质，避免误解为特定男子。
- issue: ὡραῖον 的评价含义
  choice: 译作“美好的”
  alternative: “合宜的”或“可喜的”
  rationale: 原词兼有美好、悦人和合宜等含义。正文保留较宽的“美好的”，不将其神学或伦理意义单向限定为时机上的合宜。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他遭受困苦时”比直译“在他的困苦之时”更自然；“如同无雨时的雨云”保留两半句的时间呼应和鲜明比喻。脚注标记依照其相关词语的位置排列。
