  text: In all your deeds guard yourself[b][a], for the one who does this keeps the commandment.
translation:
  language: zh_hans
  text: 你无论做什么，都要谨慎自守[a]，因为这样做的人遵守诫命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谨慎自守”也可译作“保全自己的性命”或“守护自己的灵魂”；希伯来语 נֶפֶשׁ 可指自己、性命或灵魂。
    reason: lexical_alternative
  - marker: b
    text: “遵守诫命”也可译作“遵守一条诫命”；原文“诫命”为单数，也可能作泛称理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: בכל מעשיך
  choice: 你无论做什么
  rationale: בכל 与复数 מעשיך 表示行为范围的周全性；译为“无论做什么”比直译“在你一切行为中”更符合现代汉语，同时保留“所有行为”的涵盖面。
- source_word: שמור
  choice: 谨慎自守
  rationale: 祈使式 שמור 有看守、谨守之意。结合宾语 נפשך，此处是警醒地守护自身；“谨慎自守”既表达持续警觉，也不把意思缩减为单纯保护身体。
- source_word: נפשך
  choice: 自守（即守护自己）
  rationale: נפש 可指自己、生命或魂。正文用“自守”表达对整个人的警醒守护，避免把它限定为非物质的“灵魂”；脚注保留“守护自己的生命/魂”的可能。
- source_word: כי
  choice: 因为
  rationale: 引出前面劝诫的理由，现代汉语用“因为”清楚自然。
- source_word: עושה זה
  choice: 这样做的人
  rationale: 分词加指示词表示凡实行此事者；“这样做的人”自然地保留其泛指意义，不额外突出语法阳性。
- source_word: שומר מצוה
  choice: 遵守诫命
  rationale: שמר 在此可自然译为“遵守”，מצוה 是无冠词单数，可指“诫命”这一整体概念，也可能指“一条诫命”；正文采用集合性理解，脚注说明另一可能。
theological_decisions:
- issue: 智慧劝诫中 נפש 的含义
  choice: 以“谨慎自守”表达守护自己
  alternative: 守护你的生命；守护你的魂
  rationale: 此词可涵盖整个人、生命或魂。上下文谈一切行为，因此正文突出全面的自我警醒，不预设身魂二分的人论。
- issue: מצוה 单数无冠词的理解
  choice: 诫命（集合性或泛称）
  alternative: 一条诫命
  rationale: 希伯来语形式本身不能完全排除不定意义。正文采用智慧文学中较自然的泛称理解，同时用脚注保存“一条诫命”的可能。
- issue: 希伯来文与所给希腊平行文本不一致
  choice: 依据高置信度的希伯来文翻译本节
  alternative: 采用所列希腊文关于向列国施报、折断不义权杖的内容
  rationale: 所列希腊文与希伯来文在内容上完全不对应，显然属于编号或配对错位，不能用来校改本句；因此以指定的希伯来原文为主要证据。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“你无论做什么”比生硬的逐词结构更自然；“谨慎自守”保留 שמר 与 נפשך 组合所表达的警醒守护。正文脚注标记按出现顺序排列为 [a]、[b]。
