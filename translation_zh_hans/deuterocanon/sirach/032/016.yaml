review_pass:
  verdict: revise
  source_fidelity: 正文将两种希伯来见证的第二行合并：主要见证有“他们的谋略/筹划”和“从破晓（或晨昏）”，却没有“从心里”或明确的“智慧之言”；后者来自另一读法。为避免把异文混成同一正文，修订后以主要见证为基础，并在脚注完整列出另一读法。
  naturalness: “审断”在现代普通话中较生硬，改为“公正”较符合智慧文学中“明白 משפט”的表达。“显明他们的谋略”保留原文代词及其所指不明的特点；这种略显突兀的指代以注释说明，不擅自补足。
  terminology: “敬畏雅威”及“雅威”均合乎庄重、现代的圣经汉语用语及项目神名规范。将 משפט 译为“公正”反映其可指公义、正当判断的语义范围，不将有争议的所有格写入正文。
  issues:
  - severity: high
    issue: 正文将不同希伯来读法的要素混合。
    rationale: “从心里”和“智慧之言”并不见于所列主要读法的第二行；主要读法反而有难解的“他们的谋略/筹划”。正文不应在未标示的情况下把异文拼合。
  - severity: medium
    issue: “审断”不够自然，且“智慧之言”将不确定的对象具体化。
    rationale: 现代汉语中“审断”罕用；“智慧之言”虽可作解释，却超出主要见证的字面表达。
  - severity: low
    issue: 脚注c的“将它们发出”中“它们”没有明确先行词。
    rationale: 该异文的宾语在希伯来文中确有不明之处；汉语应明确说明其省略或不确定，而非用无所指的代词掩盖。
  revised_text: 敬畏雅威的人必明白公正[a]；他必从破晓时显明他们的谋略[b][c][d]。
  revised_footnotes:
  - marker: a
    text: 希伯来文本见证有异：有的作“明白公正”，有的作“明白他的公正（或审判）”。
    reason: alternative_reading
  - marker: b
    text: 译作“从破晓时”的希伯来语含义不确定，也可理解为“清早”，或泛指晨昏交界之时。
    reason: lexical_alternative
  - marker: c
    text: 另一种希伯来文本作：“敬畏雅威的人必明白他的公正（或审判）；他们必以丰富的智慧，从心中表达出来。”末句所表达的具体内容在希伯来文中没有明说。
    reason: textual_variant
  - marker: d
    text: 本节现存的希腊文平行文本措辞大不相同，显示这里存在不同的文本传统。
    reason: textual_variant
  revision_rationale: 修订以所列第一希伯来见证为正文基础：“敬畏雅威的人”明白 משפט，并在不确定的“破晓/晨昏”时显明“他们的谋略”。“他们”在原文中无明确先行词，故保留其歧义。另一希伯来读法所含“从心中”及“丰富的智慧”仅置于脚注，避免与主要读法混合。希腊文平行文本与希伯来文实质分歧，仍只作文本异读说明。
