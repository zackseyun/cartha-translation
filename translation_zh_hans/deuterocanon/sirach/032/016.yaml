review_pass:
  verdict: revise
  source_fidelity: 正文将两种不一致的希伯来见证混合：首行见证的第二分句含有“他们的谋略/筹划”（תחבולום）及“从暮光/昏暗中”（מנשף），而草稿正文却采用另一行异文的“从心里”和“许多智慧”并补出“智慧之言”。这既遗漏首行的关键语义，也把异文内容无标示地并入正文。应以首列希伯来见证为正文，并将另一完整行保留为异文。
  naturalness: “审断”可理解但在现代普通话中较生硬；“判断”更自然，且仍保留 משפט 的判断/裁断语义。“从心里发出智慧之言”自然，却不适合本处作为正文，因为不是首列见证的措辞。修订后的“从暮光中显出他们的谋略”保留原文中主语、复数后缀和时间词的不寻常搭配；脚注说明时间词的不确定性。
  terminology: “敬畏雅威的人”及“雅威”的处理恰当。为避免把 משפט 过度定为神的末世审判或抽象公义，正文译为“判断”，并在脚注保留“他的判断”的异读。
  issues:
  - severity: high
    issue: 正文混合了两种希伯来文本见证。
    rationale: 首列文本为“…… ותחבולום מנשף יוציא”，并没有“从心里”或“智慧之言”；后列异文才有“以许多智慧”“从他们心里”。将后者纳入正文却把它仅称为脚注异文，改变了所据正文的意思。
  - severity: medium
    issue: “在破晓时”将 מנשף 的时段定得过窄。
    rationale: נשף 可指暮光或晨昏的昏暗时段；在没有足够上下文可排除暮色时，正文宜采用“暮光”这一较宽且可脚注说明的译法，而不确定为“破晓”。
  - severity: medium
    issue: “智慧之言”是补出的宾语，并取代了首列见证中的“他们的谋略”。
    rationale: “智慧之言”可作为对另一异文的解释性译法，但不能代表首列见证的 תחבולום。应保留“谋略/筹划”的字面语义及其指代不明。
  revised_text: 敬畏雅威的人明白判断[a]；他要从暮光中显出他们的谋略[b][c][d]。
  revised_footnotes:
  - marker: a
    text: 希伯来文本见证有异：有的作“明白判断”，有的作“明白他的判断”。
    reason: alternative_reading
  - marker: b
    text: 译作“暮光”的希伯来语含义不确定；它也可指清晨的微光，或泛指晨昏的昏暗时段。
    reason: lexical_alternative
  - marker: c
    text: 另一种希伯来文本作：“敬畏雅威的人必明白他的判断，并以许多智慧从他们心里发出。”末句的宾语在该异文中未明说。
    reason: textual_variant
  - marker: d
    text: 本节现存的希腊文平行文本措辞大不相同，显示这里存在不同的文本传统。
    reason: textual_variant
  revision_rationale: 修订以所列首个希伯来见证为正文基础，不再把后列异文的“许多智慧／从他们心里”混入正文。译文保留“他们的谋略”的复数后缀及其指代未明的特点，也不武断判定 מנשף 必为破晓。另一希伯来行和明显不同的希腊传统均以脚注呈现。
