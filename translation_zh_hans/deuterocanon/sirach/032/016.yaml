  text: One who fears Yahweh will understand judgment[d][c][b][a], and from the dawn he will bring forth wise sayings from his heart.
translation:
  language: zh_hans
  text: 敬畏雅威的人必明白审断[a]，在破晓时，他会从心里发出智慧之言[b][c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本见证有异：有的作“明白审断”，有的作“明白他的审断”。
    reason: alternative_reading
  - marker: b
    text: 译作“在破晓时”的希伯来语含义不确定，也可理解为“清早”，或泛指晨昏交界之时。
    reason: lexical_alternative
  - marker: c
    text: 另一种希伯来文本作：“敬畏雅威的人必明白他的审断，并以许多智慧从心里将它们发出。”
    reason: textual_variant
  - marker: d
    text: 本节现存的希腊文平行文本措辞大不相同，显示这里存在不同的文本传统。
    reason: textual_variant
lexical_decisions:
- source_word: ירא יהוה / יראי יהוה
  choice: 敬畏雅威的人
  rationale: 第一种希伯来文本用单数，另一种用复数；正文采用可作代表性单数理解的“……的人”。יהוה依项目规范译作“雅威”。
- source_word: יבין / יבינו
  choice: 必明白
  rationale: בין表示理解、辨明；“明白”自然清楚，“必”表达未完成式在智慧格言中的预期结果。
- source_word: משפט / משפטו
  choice: 审断
  rationale: משפט在此可指判断、裁断，也可能带所有格“他的审断”。“审断”保留其判断行为的意味，不径直化约为抽象的“公义”。
- source_word: מנשף
  choice: 在破晓时
  rationale: נשף可指晨昏交界，其确切时段不稳定；正文依语境取“破晓”，并以脚注保留不确定性。
- source_word: יוציא / יוציאו
  choice: 发出
  rationale: 使役形式表达“使之出来”；用于从心中表达智慧时，“发出”既保留意象，也符合现代汉语。
- source_word: ובחכמות רבות / תחבולום
  choice: 智慧之言
  rationale: 见证文本分别涉及“许多智慧”和较难确定的“谋略/筹划”。正文用“智慧之言”概括从内心表达出来的智慧内容，同时在脚注列出较完整的异文。
- source_word: מלבם
  choice: 从心里
  rationale: 保留希伯来语以“心”为思想、意念所在的表达，不改译为单纯的“头脑”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 按项目对四字神名的统一处理采用“雅威”，不以称号替代专名。
- issue: 希伯来文本与希腊平行文本明显分歧
  choice: 以现存希伯来见证为正文基础，并注明希腊传统的不同
  alternative: 改以希腊文本为正文，或将两者调和
  rationale: 本节有可用的希伯来文本，故以之为首要依据；希腊文反映的是实质不同的文本传统，不宜无说明地混入正文。
- issue: משפט与משפטו的文本差异
  choice: 正文译“审断”，脚注保留“他的审断”
  alternative: 正文直接译“他的审断”
  rationale: 两种读法均有希伯来见证，正文不擅自解决其所有格归属。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“敬畏雅威的人”保留智慧文学的格言语气；“从心里发出智慧之言”传达希伯来语由内而外表达智慧的意象。正文适度整合见证文本以求通顺，所有关键文本差异均在脚注中明示。
