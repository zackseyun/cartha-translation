  text: Whoever seeks the law will grasp it[b][a], but the one who plays the hypocrite will be caught by it.
translation:
  language: zh_hans
  text: 寻求律法的人，必得着它；装假者却必被它网住[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“ומתלהלה”含义不确定；也可能指“自欺的人”或其他不真诚的人。
    reason: lexical_alternative
  - marker: b
    text: 本节的希腊文本与此显著不同：“不可坚持献不义的祭，因为主是审判者；在他那里并不以貌取人。”希伯来文与希腊文似乎反映了不同的文本形态。
    reason: textual_variant
lexical_decisions:
- source_word: דורש
  choice: 寻求
  rationale: דרש在此为分词，表示主动寻求、探究；“寻求”既自然，也保留持续追求律法的意味。
- source_word: תורה
  choice: 律法
  rationale: תורה虽可泛指教导，但在《便西拉智训》的犹太智慧语境中常带有上帝所赐妥拉的权威意味；“律法”较能保留这一分量。
- source_word: יפיקנה
  choice: 必领会其中真义
  rationale: הפיק在此可能表示取得、达到或引出。结合智慧文学语境，此译表达寻求者真正获得并把握律法的意义，同时避免把律法说成可占有之物。
- source_word: ומתלהלה
  choice: 假装虔诚的
  rationale: 此词含义不确定，可能指装假者、自欺者或类似不真诚的人。上下句对比真诚寻求与虚假姿态，故采用“假装虔诚的”，并以脚注保留不确定性。
- source_word: יוקש
  choice: 被……绊住
  rationale: 该动词为被动意义，可指落入网罗或被捕捉。“绊住”在现代汉语中自然，也保留陷入圈套、受阻的形象。
- source_word: בו
  choice: 被它
  rationale: 阳性单数后缀的所指在形式上并非绝对明确；依最近的核心名词תורה及对偶结构，最自然地指律法：真诚者领会它，虚假者反被它绊住。
theological_decisions:
- issue: תורה应译作广义的“教导”还是较具体的“律法”
  choice: 律法
  alternative: 教导
  rationale: 以现存希伯来文为首要依据；在本书的智慧与圣约语境中，תורה很可能不只是一般劝诫，而是具有神圣权威的妥拉。译作“律法”保留这一宗教分量，却不进一步限定为某条具体诫命。
- issue: 如何处理含义困难且与希腊文本显著分歧的ומתלהלה
  choice: 假装虔诚的
  alternative: 装假者；自欺的人；轻浮的人
  rationale: 希伯来文此词不确定，希腊异文也无法判定其确切含义。正文保留与“寻求律法”相对的不真诚宗教姿态，脚注则明确其他可能，避免把争议词义定死。
- issue: בו所指为何
  choice: 指律法
  alternative: 指某个人或较宽泛地译作“在其中”
  rationale: 最近的语义先行词是“律法”，而且如此可维持鲜明对偶：寻求者从律法得益，装假者反受其困。不过希伯来语代词本身仍有一定歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“领会其中真义”以自然汉语传达成功取得并理解律法；“假装虔诚”呈现与真诚寻求相反的虚假宗教姿态，但用脚注明示原词不确定。脚注标记按相关词语就近排列。
