  text: Speak briefly[a], though you know much, and be like one who knows and keeps silent.
translation:
  language: zh_hans
  text: 即使知道很多，也要少说[a]；要像一个知道许多却保持沉默的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本十分凝缩，句法也可能有所省略；其词面大致包含“说”“少”“多”，可近似直译为：“说得少，〔即使知道〕很多。”本译文按这则箴言的上下两句，将其理解为即使知道很多，也要节制言语。斯威特本此处的希腊文与这行希伯来文并不对应，因此本译以希伯来文本为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: כל לאמר ומעט הרבה
  choice: 即使知道很多，也要少说
  rationale: 希伯来文本高度压缩，字面成分包括“说”“少”和“多”。结合下半句对克制言语的劝诫，将省略的对比关系自然表达为“知道很多，却少说”；“即使”标明让步关系，但以脚注保留原文的不确定性。
- source_word: ודמה
  choice: 要像
  rationale: דמה在此表示“像、相似”，承接前句作为劝诫；现代汉语用“要像”简洁自然。
- source_word: ליודע
  choice: 一个知道……的人
  rationale: ל在דמה之后可表达比较对象，יודע是“知道的人”。不补入特定的知识内容，以免缩小原文含义。
- source_word: ומחריש יחדו
  choice: 而保持沉默
  rationale: מחריש表示不作声、保持沉默；יחדו本义为“一同、同时”，在这里把“知道”与“沉默”两种状态并置。汉语用“而”自然呈现这种张力，不把它解释成无知或被迫缄默。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“少说”比“简短地说”更自然，也能突出智慧文学所强调的言语克制；脚注说明希伯来原句的凝缩和希腊平行文本不对应的问题。
