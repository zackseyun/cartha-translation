  text: Before hail[a], lightning flashes forth; and before shame[b], favor goes forth.
translation:
  language: zh_hans
  text: 冰雹未到，闪电先现；羞耻未临，恩宠[a]先显。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩宠”也可译作“恩惠”“青睐”或“魅力”（希伯来语 חֵן）。
    reason: lexical_alternative
  - marker: b
    text: 本节的希腊文平行文本差异很大：“要以慷慨的心荣耀主，也不可减少你手中所献初熟的果子。”正文依现存希伯来文本。
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְנֵי
  choice: 未到／未临……先……
  rationale: 两分句都表达时间或次序上的先后；采用“未……先……”既保留原文对称，也符合现代汉语习惯。
- source_word: בָרָד
  choice: 冰雹
  rationale: 这是该希伯来语气象名词的通常含义，与“闪电”构成清楚的自然现象意象。
- source_word: יִנְצַח
  choice: 先现／先显
  rationale: 此处依上下文取“先出现、显现”之意，而不取通常可能联想到的“得胜”。两个分句使用同一结构，并按各自主语采用自然搭配。
- source_word: בָּרָק
  choice: 闪电
  rationale: 该词通常指闪电，与冰雹的气象语境相符。
- source_word: בוֹשׁ
  choice: 羞辱
  rationale: 该词在这里表示羞耻或耻辱；“羞辱”较能作为临到人的境遇，与后面的“恩宠”形成对照。
- source_word: חֵן
  choice: 恩宠
  rationale: 该词可指恩惠、青睐或魅力。“恩宠”保留“受人眷顾、蒙悦纳”的宽泛含义，同时不把本句限定为救恩论陈述。
theological_decisions:
- issue: 智慧文学语境中 חֵן 的译法
  choice: 恩宠
  alternative: 恩惠、青睐、魅力
  rationale: 本句没有明确的救恩论语境，因此不把该词专门化为某种教义术语；“恩宠”保留其可指蒙眷顾或得悦纳的含义，其他词义在脚注中说明。
- issue: 希伯来文本与希腊平行文本的显著差异
  choice: 正文依现存希伯来文本
  alternative: 希腊文作：“要以善意的眼光荣耀主，也不可减少你手中所献的初熟果子。”
  rationale: 所提供的希伯来见证置信度高，并且本项目优先依据原文证据；希腊平行文本内容差异显著，故不混入正文，而以脚注完整保留。
translation_notes:
  register: 采用凝练、对称的箴言体，以“未……先……”再现两个希伯来分句的平行结构；用词庄重但保持现代汉语可读性。脚注标记均置于正文相关句末，其中[a]说明“恩宠”的词义范围，[b]交代希腊平行文本的异文。
