  text: Do not walk on a path full of obstacles[b][a], and do not stumble over the same hazard twice.
translation:
  language: zh_hans
  text: 不要走在布满绊脚物的路上[a][b]，也不要被同一障碍物绊倒两次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“דרך מוקשות”，字面意为“有绊跌之物的路”。“מוקשות”可指罗网、陷阱或绊脚物；正文依据下半句“绊倒”的平行表达译作“布满绊脚物”。
    reason: lexical_alternative
  - marker: b
    text: 斯韦特本希腊文本在此差异很大，作：“以善意服事的，必蒙悦纳；他的祈求必上达云霄。”这表明本节存在重大的文本传统分歧。正文依从现存希伯来文见证；在《便西拉智训》有保存的希伯来文处，以其为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: בדרך
  choice: 路
  rationale: דרך可指道路、路径，也常比喻人的行事方式；“路”在中文中保留了这两层含义。
- source_word: מוקשות
  choice: 布满绊脚物
  rationale: 该词可表示罗网、陷阱或使人跌倒之物。结合下句“绊倒”的平行意象，译作“绊脚物”既具体，又不局限于暗藏的圈套。
- source_word: אל תלך
  choice: 不要走
  rationale: 保留הלך“行走、前往”的基本意义，也符合智慧文学以道路比喻人生行为的表达。
- source_word: ואל תתקל
  choice: 也不要……绊倒
  rationale: 此处动词表示被绊、失足；“绊倒”自然地承接上句道路上的危险意象。
- source_word: בנגף
  choice: 在同一个障碍上
  rationale: נגף在此指造成跌倒的障碍。“障碍”保留其具体与比喻双重含义；“同一个”根据“绊倒两次”的告诫关系补出，表达不要重复犯同一错误的自然含义。
- source_word: פעמים
  choice: 两次
  rationale: 按其直接的数目义翻译为“两次”，不泛化为“屡次”或“再次”。
