base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/017.yaml
  text: A wise man will incline himself to reproof[a], but one who is deceived will follow his own desire. A wise man will not conceal anger, but a scoffer will not guard his tongue.
translation:
  language: zh_hans
  text: 智慧人倾听劝诫[a]，受迷惑的人却随从自己的欲望。智慧人不掩藏怒气，嘲讽者却不约束自己的舌头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证作：“他决不忽视孤儿的恳求，也不忽视寡妇倾诉的苦情。”本节保存下来的希伯来文与希腊文差异很大。
    reason: alternative_reading
lexical_decisions:
- source_word: איש חכם יטה תוכחות
  choice: 智慧人倾听劝诫
  rationale: יטה本有“倾向、转向”之意；汉语用“倾听”自然表达智慧人愿意转向并接受劝诫，同时保留主动接纳的意味。 תוכחות为复数，可概括译作“劝诫”，兼有责备与纠正的力量。
- source_word: ואחר צרכו ימשך נפתה
  choice: 受迷惑的人却随从自己的欲望
  rationale: נפתה可指受诱骗、易被引入歧途的人；צרכו可指其需要、所欲或合己意之事，ימשך含“被牵引、跟随”之意。译文保留此人受迷惑与随己欲而行之间的张力。
- source_word: איש חכם
  choice: 智慧人
  rationale: 原文为阳性单数的箴言式表达；“智慧人”在现代汉语智慧文学语体中自然，也不必额外强化生理性别。
- source_word: לא יכסה כחמה
  choice: 不掩藏怒气
  rationale: 按现存希伯来文本直译。כחמה在此指怒气或烈怒；句义略显困难，因此不擅自解释这是义怒、压抑怒气或虚伪遮掩。
- source_word: לץ
  choice: 嘲讽者
  rationale: 这是智慧文学中指傲慢讥诮之人的常用词；“嘲讽者”比“爱讥笑的人”更凝练，并保留其道德意味。
- source_word: לא ישמר לשונו
  choice: 不约束自己的舌头
  rationale: 直译意象为“不看守他的舌头”；“约束自己的舌头”是现代汉语中清楚自然的表达，保留管束言语的意象。
theological_decisions:
- issue: 希伯来文本与希腊文本在本节显著不同
  choice: 正文采用现存希伯来文本的两个对句，并在脚注列出希腊异文。
  alternative: 希腊文本作：“他决不忽视孤儿的恳求，也不忽视寡妇倾诉的苦情。”
  rationale: 《便西拉智训》有希伯来文本存世之处，应优先据希伯来文翻译。本节希腊文并非细微措辞差异，而是内容完全不同的重要异文，故不混合两种文本，也不静默取舍，而以脚注保存。
- issue: “智慧人不掩藏怒气”的意义
  choice: 依现存希伯来文保留直陈而含混的说法。
  alternative: 可解释为智慧人不虚伪遮掩怒气，或不当压抑正当的愤慨。
  rationale: 原句本身没有说明怒气的性质或不掩藏的伦理理由；为避免导入特定神学或伦理解释，正文不作消歧。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式汉语。正文保持两组对句的平衡；“智慧人”与“嘲讽者”保留智慧文学的人物类型。“不掩藏怒气”刻意保留希伯来文本的疑难与神学张力，不作解释性增译。
