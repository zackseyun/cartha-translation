  text: The eyes of God see his works[b][a], and he knows every deed of a man.
translation:
  language: zh_hans
  text: 上帝的眼睛看见人的作为[b]；他知晓每个人所做的一切[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一个男人的每一项行为”；这里的“男人”（אִישׁ）在智慧文学中常泛指人。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本首句作：“他的眼睛看顾敬畏他的人。”下半句同样表达上帝洞悉人的一切行为。
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינֵי אֵל
  choice: 上帝的眼睛
  rationale: 保留希伯来文具体的拟人意象；אֵל在此是对上帝的一般称谓，不是圣约名。
- source_word: יִרְאוּ
  choice: 看见
  rationale: 按其简单、直接的未完成式意义翻译，并与“眼睛”的意象自然衔接。
- source_word: מַעֲשָׂיו
  choice: 他的作为
  rationale: 保留阳性单数后缀“他的”。就希伯来文而言，其指代可能与下半句的“人”相连；不将这一点过度解释。
- source_word: יַכִּיר
  choice: 知晓
  rationale: הכיר在此表示辨认、洞悉而确知；“知晓”既自然，也比单纯“知道”略能体现充分认识的意味。
- source_word: כָּל מִפְעַל
  choice: 所做的一切
  rationale: 以自然现代汉语表达“每一项行为/作为”，同时保留范围的周全性。
- source_word: אִישׁ
  choice: 每个人
  rationale: אִישׁ虽为阳性单数，在智慧文学中常泛指人。现代汉语“每个人”准确传达其通用意义，且避免“一个男人的每项行为”造成不必要的性别限定。
theological_decisions:
- issue: 对上帝感知的拟人表达
  choice: 保留“上帝的眼睛”
  alternative: 上帝看见
  rationale: 原文采用具体诗性意象；直译可保留其修辞力度，无须抽象化。
- issue: אִישׁ的阳性单数与通用意义
  choice: 正文译作“每个人”
  alternative: 一个男人
  rationale: 这里论及上帝洞悉人的一切行为，אִישׁ在智慧文学中可作通称。汉语采用“每个人”既符合语境，也不改变命题的普遍范围。
- issue: מַעֲשָׂיו中代词的指向
  choice: 保留“他的作为”
  alternative: 人的作为／他们的作为
  rationale: 阳性单数后缀的先行对象在孤立经文中并未明说；译文保留单数代词，不把可能的所指静默限定为某一对象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现希伯来诗句的两个平行分句；保留“上帝的眼睛”的具体意象，并用“知晓”表达洞悉、确知之意。
