base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/001.yaml
  text: He who fears Yahweh will do this[b][a], and he who grasps the law will attain her.
translation:
  language: zh_hans
  text: 敬畏耶和华的人必这样行；持守律法[a]的人必得着她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“妥拉”或较广义的“教诲”。
    reason: lexical_alternative
  - marker: b
    text: 现存希伯来语末尾的动词较难理解；希腊平行文本作“必得着她”，支持这里将“她”理解为上下文中人格化的智慧。
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: 敬畏耶和华的人
  rationale: 希伯来语分词作名词用，意为“敬畏……的人”。用“敬畏”保留智慧文学中兼含畏惧、尊崇与顺服的固定表达；神名按原文直译为“耶和华”。
- source_word: יַעֲשֶׂה זֹאת
  choice: 必这样行
  rationale: 原文为“要做这事／这个”；现代汉语用“这样行”自然凝练，同时不具体限定“这”所指的内容。
- source_word: וְתוֹפֵשׂ תּוֹרָה
  choice: 持守律法的人
  rationale: תפש 本义为抓住、握住，此处表达牢牢把持、不放弃；“持守”在汉语中既保留坚定抓住的意象，也适合人与律法的关系。תּוֹרָה 在此可指律法、妥拉或教诲，希腊平行文本 νόμος 支持“律法”。
- source_word: יַדְרִיכֶנָּה
  choice: 必得着她
  rationale: 现存希伯来语形式较难，若按常见词根可让人想到引导；但希腊平行文本 καταλήμψεται αὐτήν 明确表示“将得着／达到她”。结合上下文中人格化的智慧，译作“必得着她”，并用脚注交代文本困难。
theological_decisions:
- issue: 末句阴性宾语所指
  choice: 以“她”指人格化的智慧
  alternative: 可较抽象地理解为持守律法所得的结果；若紧贴现存希伯来语的困难形式，也可能理解为引导之意。
  rationale: 《便西拉智训》14:20—15:10的上下文把智慧人格化为女性，希腊文本也明确使用阴性代词。保留“她”能呈现原段落的文学与神学张力，而不将其抽象化。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“敬畏耶和华”“持守律法”符合汉语圣经与智慧文学语域；分号呈现两个平行分句。所有脚注标记均置于正文相应词句之后。
