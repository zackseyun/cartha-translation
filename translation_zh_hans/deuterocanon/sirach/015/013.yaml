  text: Yahweh hates evil and abomination[a], and he will not permit it to those who fear him.
translation:
  language: zh_hans
  text: 耶和华憎恨邪恶和可憎之事[a]，绝不容它临到敬畏他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行本作：“敬畏他的人也不喜爱它（或：不以它为可接受）。”现存希伯来文则作：“他绝不容它临到敬畏他的人。”
    reason: alternative_reading
lexical_decisions:
- source_word: רָעָה
  choice: 邪恶
  rationale: 本句与“可憎之事”并列，语境所指是道德上的恶，而非灾祸。
- source_word: וְתוֹעֵבָה
  choice: 和可憎之事
  rationale: 保留该词所表达的强烈厌恶，同时采用现代汉语中自然、庄重的说法，不把其范围限定为礼仪或道德中的某一类。
- source_word: שָׂנֵא
  choice: 憎恨
  rationale: 以现在时态的汉语陈述恒常真理，准确表达希伯来语“恨恶”的强烈含义。
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确呈现四字神名。
- source_word: וְלֹא יְאַנֶּנָּה
  choice: 绝不容它临到
  rationale: 依现存希伯来文理解为“不让它发生或临到”；“它”回指前述作为整体观念的邪恶和可憎之事。“临到”也保留了究竟是行为发生还是恶事遭遇的语义张力。
- source_word: לִירֵאָיו
  choice: 敬畏他的人
  rationale: “敬畏”是自然且传统的圣经汉语表达，兼具尊崇与畏惧之意。
theological_decisions:
- issue: 第二分句的希伯来文与希腊文平行本存在实质差异
  choice: 正文依希伯来文译作“绝不容它临到敬畏他的人”
  alternative: 依希腊文可译作“敬畏他的人也不喜爱它（或：不以它为可接受）”
  rationale: 此处希伯来文见证完整且可信度高，应作为正文依据；希腊文表达了不同的主语与谓语关系，因此在脚注中如实保存，不将二者强行调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可憎之事”比单用“可憎”更自然；“绝不容它临到”紧贴希伯来文，同时不把略有歧义的动作关系解释得过死。
