  text: He will find gladness and joy[a], and an everlasting name will be his inheritance.
translation:
  language: zh_hans
  text: 他必寻得欢欣和喜乐；智慧必使他承受永存之名[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句也可理解为“他必承受永存之名”。希腊文译本则作“他必承受欢欣、欢跃的冠冕和永存之名”。
    reason: 说明希伯来文末句紧缩句法所容许的另一种理解，并如实保留希腊文平行译本的不同措辞。
lexical_decisions:
- source_word: שָׂשׂוֹן
  choice: 欢欣
  rationale: 表示由衷的欣喜；与下文“喜乐”构成近义并列，同时保留诗歌性的措辞。
- source_word: שִׂמְחָה
  choice: 喜乐
  rationale: 常指喜悦、快乐；用“喜乐”与“欢欣”相配，既自然又保留希伯来文的两个近义词。
- source_word: יִמְצָא
  choice: 必寻得
  rationale: 保留מצא“找到、寻得”的基本意义，也能表达此人最终得到欢欣和喜乐。
- source_word: שֵׂם עוֹלָם
  choice: 永存之名
  rationale: 直译为“永远的名”；“永存之名”保留“名”的意象及持久不灭的含义，不直接将其解释成“名声”或“声誉”。
- source_word: תּוֹרִישֶׁנּוּ
  choice: 必使他承受
  rationale: 该词为阴性单数使役式，适合以上下文中的“智慧”为主语，表达使此人得到产业的意思；“承受”保留了承继、产业的语义。
theological_decisions:
- issue: 末句תּוֹרִישֶׁנּוּ的主语和句法如何理解
  choice: 按希伯来文阴性单数动词，将“智慧”作为承前省略的主语：智慧使他承受永存之名。
  alternative: 可理解为“他必承受永存之名”；希腊文平行文本明确采用第三人称阳性单数，并把欢欣、欢跃的冠冕和永存之名一并作为所承受的事物。
  rationale: 现存希伯来文的动词形态是阴性单数使役式，最自然地承接本段拟人化的“智慧”。不过，紧缩的希伯来句法及希腊平行文本显示另一种古老理解，因此以脚注保留文本见证之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“欢欣和喜乐”保留原文近义并列；“永存之名”保留圣经诗歌中的“名”之意象。正文补出“智慧”，以明确希伯来文阴性动词所承接的上下文主语。
