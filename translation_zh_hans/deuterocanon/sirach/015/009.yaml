base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/009.yaml
  text: Praise is not fitting in the mouth of a wicked man[a], for it has not been allotted to him by God.
translation:
  language: zh_hans
  text: 赞美在恶人的口中并不合宜，因为这不是上帝分给他的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“因为这不是从主那里差来的。”希伯来文直译为：“因为这不是从上帝那里分给他的。”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאֲתָה
  choice: 并不合宜
  rationale: 表达不相称、不适宜之意，而不只指外在是否美好；措辞自然庄重。
- source_word: תְהִלָּה
  choice: 赞美
  rationale: 本词通常指赞美；上下文没有明确限定为诗歌。
- source_word: בְּפִי
  choice: 在……的口中
  rationale: 保留希伯来文的具体意象，也与希腊文平行文本的表达一致。
- source_word: רָשָׂע
  choice: 恶人
  rationale: 准确传达道德上的邪恶，并保留原文单数的泛指表达；希腊文平行文本则作“罪人”。
- source_word: נֶחְלְקָה לּוֹ
  choice: 分给他的
  rationale: 保留 חלק 在此处“分配、分给”的意象，比笼统译作“赐给”更贴近希伯来文。
- source_word: מֵאֵל
  choice: 上帝
  rationale: מֵאֵל 直指来源“从上帝而来”；中文句式“这不是上帝分给他的”以自然的主动表达同时保留神圣来源。
theological_decisions:
- issue: 第二分句中希伯来文与希腊文的差异
  choice: 正文依希伯来文译为“这不是上帝分给他的”
  alternative: 希腊文作“因为这不是从主那里差来的”
  rationale: 现存希伯来文在本节清晰且可信，应作为正文依据；希腊文可能反映不同底本或诠释性译法，因此收入脚注以保留文本差异。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“在恶人的口中”保留原文意象；第二分句略作自然汉语调整，不消除“分给”这一关键意象。
