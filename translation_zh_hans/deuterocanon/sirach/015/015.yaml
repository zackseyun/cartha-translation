base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/015.yaml
  text: If you desire[a], you will keep the commandment, and to act faithfully is a matter of your good pleasure. If you trust in him[c][b], you too will live.
translation:
  language: zh_hans
  text: 你若愿意，就会遵守诫命[a]；明智就是遵行他的旨意[b]。你若信靠他[c]，你也必存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本用单数“诫命”；希腊平行文本用复数“诫命”。
    reason: textual_variant
  - marker: b
    text: 这一分句的希伯来语句法和含义较难，直译近于“明智〔在于〕遵行他的旨意”。希腊平行文本则近于“实行忠信，是出于美意”，可能反映不同的底本或解释性翻译。
    reason: alternative_reading
  - marker: c
    text: 或译：“相信他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תַּחְפֹּץ
  choice: 你若愿意
  rationale: חפץ表达意愿、喜悦或渴望。译作“愿意”既保留条件句的意志色彩，也不把经文强化为关于人有绝对自主能力的哲学断言。
- source_word: תִּשְׁמֹר מִצְוָה
  choice: 就会遵守诫命
  rationale: שמר在此指持守、遵行；希伯来文本的מִצְוָה为单数，但可有集合意义。汉语不强制标示单复数，因此正文自然译作“诫命”，并以脚注交代希腊文本的复数异文。
- source_word: וְתָבִינָה
  choice: 明智就是
  rationale: 传世希伯来语在此句法简略且含义困难。将其理解为与“明辨、明智”有关，并用判断句连接下文，既贴近希伯来文本，也使现代汉语可读；不以希腊文本的“忠信”直接取代希伯来读法。
- source_word: לַעֲשׂוֹת רְצוֹנוֹ
  choice: 遵行他的旨意
  rationale: לעשות意为“做、实行”，רצונו按希伯来辅音和元音文本最自然地指“他的意愿／旨意”。“遵行他的旨意”准确而庄重，并避免把第三人称所有格改成受话者自己的“乐意”。
- source_word: אִם תַּאֲמִין בּוֹ
  choice: 你若信靠他
  rationale: אמן与介词ב连用可表示相信、信赖某人。“信靠”兼顾认知上的相信和关系上的倚赖；脚注保留“相信他”这一较直接的译法。
- source_word: גַּם אַתָּה תִּחְיֶה
  choice: 你也必存活
  rationale: “也”对应גַּם אַתָּה对受话者的强调；תִּחְיֶה意为“活、存活”，在条件结果句中译作“必存活”自然且不额外界定生命的具体性质。
theological_decisions:
- issue: 希伯来文本第二分句与希腊平行文本之间的文本张力
  choice: 正文以现存希伯来文本为主，译作“明智就是遵行他的旨意”，并用脚注列出希腊平行文本的不同读法。
  alternative: 忠信行事在于你自己的乐意。
  rationale: 希伯来语וְתָבִינָה לַעֲשׂוֹת רְצוֹנוֹ虽句法困难，却明确保留“遵行他的旨意”这一词组；希腊语则有“实行忠信，是出于美意／蒙悦纳”的不同措辞。将异文置于脚注，既不掩盖困难，也不让希腊解释性读法取代高可信度的希伯来见证。
- issue: 人的意愿与顺服之间的关系
  choice: 采用“你若愿意，就会遵守”的条件式表达。
  alternative: 只要你选择，就能遵守。
  rationale: 正文保留原文对人的意愿和责任的强调，但不加入“有能力”“自主选择”等更强的哲学或教义判断。
- issue: “信靠／相信”与“存活”的神学范围
  choice: 正文译作“信靠他……存活”，不说明此处生命仅指今生或特指永生。
  alternative: 相信他……必得永生。
  rationale: 原文只说“活／存活”，并未在本节中限定生命的层面；保留其开放性可避免把后来的系统神学含义预先写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“愿意”“遵守诫命”“遵行他的旨意”“信靠”均属当代宗教语境中普通读者可理解的表达。正文优先依据高可信度的希伯来文本，对困难的第二分句不作过度确定的神学解释，而以脚注明示希腊平行文本的差异。所有脚注标记均置于正文相应位置。
