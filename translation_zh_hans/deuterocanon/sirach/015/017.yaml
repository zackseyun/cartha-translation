  text: Before human beings are life and death[b][a], and whichever he chooses will be given to him.
translation:
  language: zh_hans
  text: 世人面前有生命和死亡[a]；他愿意哪一个，哪一个就会赐给他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对世人来说，有生命和死亡。”希伯来语介词可作此解；希腊平行文本则支持“在世人面前”。
    reason: alternative_reading
  - marker: b
    text: 或译：“他想要什么，就会赐给他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָדָם
  choice: 世人面前
  rationale: לִבְנֵי אָדָם直译为“给/对人的众子”，在此泛指人类；希腊平行文本ἔναντι ἀνθρώπων明确支持“在世人面前”的场景含义。
- source_word: חַיִּים וָמָוֶת
  choice: 生命和死亡
  rationale: 按希伯来语惯用法将复数形式חַיִּים译为单数概念“生命”，并保留两种相对结局的并列。
- source_word: אֲשֶׁר יַחְפֹּץ
  choice: 他愿意哪一个
  rationale: חפץ可表示愿意、喜爱或想要；结合前文“生命和死亡”这两个选项，用“愿意哪一个”保留意愿色彩，又不把经文强化为独立自主意志的教义陈述。
- source_word: יִנָּתֵן לוֹ
  choice: 哪一个就会赐给他
  rationale: 保留נתן被动式的含义，不明说施予者是谁；中文用“赐给”自然表达此处所领受的结果。
theological_decisions:
- issue: 人的道德能动性与未明说的施予者
  choice: 呈现生命与死亡摆在世人面前，并说人所愿意的会赐给他；不补充选择机制或被动式背后的施予者。
  alternative: 强化为完全自主的自由意志，或明确补出上帝决定并赐下结果。
  rationale: 希伯来文和希腊文都呈现选择框架，却没有在本节解决人的选择与神圣主权之间的关系；译文保留这种张力。
- issue: 集合名词与通用单数的转换
  choice: 先用集合性的“世人”，后用单数“他”。
  alternative: 全句都用复数“人们/他们”，或全句用单数“人”。
  rationale: 原文先以复数集合表达לִבְנֵי אָדָם指人类，随后转为通用单数动词和代词；译文保留这一转换。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“世人面前”简洁呈现选择被摆在人面前的意象；分号使前后两分句的逻辑关系清楚。
