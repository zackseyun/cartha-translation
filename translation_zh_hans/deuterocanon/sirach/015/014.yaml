base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/014.yaml
  text: God[a], from the beginning, created man, and placed him in the hand of his own violence[b]; he gave him over to the hand of his own inclination.
translation:
  language: zh_hans
  text: 上帝从起初创造了人[b]，把他置于自己暴力的权势之下[a]，又把他交由自己的倾向支配。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴力”所译的希伯来词含义不确定，可能与攫取、强取或暴力有关。希腊文本作：“他任凭他按自己的谋算行事。”
    reason: textual_difficulty
  - marker: b
    text: “人”也可理解为“人类”；希伯来文使用单数形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּרֵאשִׁית
  choice: 从起初
  rationale: מִן与רֵאשִׁית合用表示“从起初”；希腊文ἐξ ἀρχῆς亦支持这一时间含义。
- source_word: בָּרָא אָדָם
  choice: 创造了人
  rationale: ברא以神为主语时通常指“创造”；אדם在此为单数，并可代表全人类。“人”既保留单数表达，也容许集合含义。
- source_word: וַיְשִׁיתֵהוּ בְּיַד
  choice: 把他置于……掌控之下
  rationale: שית意为“安置、置于”，ביד字面为“在……手中”，常表示权势或控制；此处用自然汉语传达该习语。
- source_word: חוֹתְפוֹ
  choice: 自己强力的
  rationale: 此词形和语义均有困难，可能带有攫取、强取或暴力之意。译作“强力”保留其力量和强制色彩，不把它直接等同于后句的“意念”；以脚注交代希腊文异读。
- source_word: וַיִּתְּנֵהוּ בְּיַד יִצְרוֹ
  choice: 又把他交在自己意念的手中
  rationale: נתן ביד可表示交在某种权势之下；יצר在智慧文学语境中可指人的内在意念、倾向或心性。“意念”较为宽泛，可避免预先判定其必然为邪恶倾向。
theological_decisions:
- issue: 人的道德能动性
  choice: 保留上帝是创造者、而人被交在自身内在意念之下的张力
  alternative: 译为“任凭他自行决定”，或明确译为“交给自己的邪恶倾向”
  rationale: 希伯来文和希腊文都涉及受造之人的自我导向，但困难词חוֹתְפוֹ的确切含义并不清楚。正文不把本节发展成绝对自主，也不将יצר限定为邪恶冲动。
- issue: אדם的指称范围
  choice: 译作“人”，保持语法上的单数和代表性含义
  alternative: 译作“人类”
  rationale: 原文使用单数אדם及单数代词，既可指一个代表性的人，也可泛指人类；“人”在现代汉语中能够保留这种双重可能。
translation_notes:
  register: 采用现代、庄重而可朗读的标准汉语。“交在……手中”保留希伯来文的手之意象；前一处则以“掌控之下”避免连续重复造成生硬。困难词חוֹתְפוֹ不作过度确定的解释，并通过脚注呈现希腊平行文本。
