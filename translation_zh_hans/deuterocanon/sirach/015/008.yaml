  yaml_path: translation/deuterocanon/sirach/015/008.yaml
  text: She is far from scoffers[a], and men of falsehood will not remember her.
translation:
  language: zh_hans
  text: 她远离嘲讽者[a]，虚谎之人不会记念她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“她远离骄傲，说谎的人决不会记念她。”希伯来文在希腊文“骄傲”之处作“嘲讽者”，可能反映不同的底本或解释性翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: רְחוֹקָה הִיא
  choice: 她远离
  rationale: רְחוֹקָה 表示距离遥远；结合介词 מִן，译作“远离”自然准确。阴性代词 הִיא 承接上下文中人格化的智慧，故译“她”。
- source_word: מִלֵּצִים
  choice: 嘲讽者
  rationale: לֵצִים 指傲慢而好讥诮、轻蔑真理的人。“嘲讽者”既保留行为特征，也符合智慧文学的道德语境。希腊文作“骄傲”，可能反映不同底本或解释性翻译，正文依高可信度希伯来文本。
- source_word: וְאַנְשֵׁי כָזָב
  choice: 虚谎之人
  rationale: 直译为“虚假之人”，指以虚谎为特征的人；“虚谎之人”庄重、易懂，也与希腊文“说谎的人”在意义上相符。
- source_word: לֹא יִזְכְּרוּהָ
  choice: 不会记念她
  rationale: זכר 的基本义是记得、想起。“记念”保留其较正式的智慧文学语体；宾语阴性后缀指人格化的智慧。
theological_decisions:
- issue: 阴性代词所指及智慧的人格化
  choice: 用“她”指智慧
  alternative: 用“它”把智慧视为非人格化的抽象品质
  rationale: 本章上下文以阴性、人格化方式描写智慧。译作“她”保留原文的文学与神学张力，而不进一步断定其本体身份。
- issue: 希伯来文“嘲讽者”与希腊文“骄傲”的差异
  choice: 正文采用希伯来文“嘲讽者”
  alternative: 按希腊文译作“骄傲”或“傲慢”
  rationale: 所给希伯来文本可信度高且验证一致，因此正文优先依其措辞；以脚注保存希腊平行文本的异读，不将两者强行调和。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“嘲讽者”比“亵慢人”更易为现代读者理解；“记念”略带书面色彩，与智慧文学体裁相称。
