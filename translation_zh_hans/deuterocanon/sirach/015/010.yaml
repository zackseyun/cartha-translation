  text: Praise is spoken by the mouth of the wise[a], and one who masters it will teach it.
translation:
  language: zh_hans
  text: 赞美由智慧人的口发出[a]；掌握它的人必会传授它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本下半句作：“主必使他（或它）顺利。”这与现存希伯来文的下半句有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶה חָכָם
  choice: 从智慧人的口中
  rationale: בְּפֶה 可表示言语借口发出或存在于口中；现代汉语用“从……口中”自然保留原文意象。חָכָם 是泛指的单数，译作“智慧人”，不额外限定性别。
- source_word: תֵּאָמֵר
  choice: 说出
  rationale: Nifal 未完成式在箴言体中可表达一般事实；与“赞美”组合为“赞美……说出”，保留被动含义而不拘泥于将来时。
- source_word: תְּהִלָּה
  choice: 赞美
  rationale: 此处通常指赞美，希腊文 αἶνος 亦支持这一义项；原文没有明说赞美的对象，因此不予补足。
- source_word: וּמשֵׁל בָּהּ
  choice: 掌握它的人
  rationale: משל 表示支配、管辖或驾驭；在此译作“掌握”较符合汉语语境，同时保留施行主导的意味。בָּהּ 的阴性单数所指并不完全明确，故只译“它”，不明确指定为赞美、智慧或言语。
- source_word: יִלַמְּדֶנָּה
  choice: 必将它教导出来
  rationale: למד 在使役式中意为教导，阴性宾语后缀与前文阴性所指呼应。“教导出来”使压缩的希伯来语表达在汉语中可懂，同时保留“教导它”的结构。
theological_decisions:
- issue: 希伯来文下半句与希腊文平行文本的关系
  choice: 正文依现存希伯来文：“掌握它的人必将它教导出来。”
  alternative: 希腊文作：“主必使他（或它）顺利。”
  rationale: 本节有可信且经核验的希伯来文存本，应以其为正文依据。希腊文下半句可能反映不同底本或解释性发展；因差异重大，收入脚注而不在正文中调和。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“智慧人”保留单数泛指；分号呈现两个平行分句。正文不补出赞美的对象，也不判定两个“它”的确切所指，以保存原文的含混。
