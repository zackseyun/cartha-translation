  text: Do not say[a], “My transgression is from God,” for he has not done what he hates.
translation:
  language: zh_hans
  text: 不要说[a]：“我的过犯是出于上帝。”因为他没有做自己所恨恶的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要说：‘我因主而背离了。’因为你不会做他所恨恶的事。”希腊文所反映的措辞与现存希伯来文相关，但并不完全相同。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: 直译希伯来语否定命令式，简洁有力，符合智慧文学的劝诫语气。
- source_word: מֵאֵל
  choice: 出于上帝
  rationale: 介词 מִן 在此最自然地表示来源，意为不可把自己的过犯归因于上帝；“出于”比“来自”更适合抽象的道德来源。
- source_word: פִּשְׁעִי
  choice: 我的过犯
  rationale: פשע 常指带有故意违犯意味的过失或悖逆；“过犯”既保留其道德严重性，又不把政治性“叛逆”含义强加于本句。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面禁令的理由；现代汉语用“因为”自然清楚。
- source_word: אֶת אֲשֶׁר שָׂנֵא
  choice: 他所恨恶的事
  rationale: 自然表达希伯来语关系结构；“他”承接前句的上帝，“恨恶”保留强烈的道德反感。
- source_word: לֹא עָשָׂה
  choice: 他并没有做
  rationale: 按希伯来语完成式翻译，同时用“并”加强否定与前句归责之间的反驳关系，不改从希腊文本的第二人称将来式。
theological_decisions:
- issue: 本节是在否认罪源于上帝，还是仅否认人因上帝而犯罪
  choice: 正文采用“我的过犯是出于上帝”，明确按希伯来文本否认过犯以上帝为来源。
  alternative: “我是因主而离弃正道的”或“我因主而背离了”
  rationale: 主要希伯来见证 מֵאֵל פִּשְׁעִי 最自然地表示来源；希腊平行文本则有“因主而离开／背离”的相关但不完全相同措辞。正文以高置信度希伯来文本为准，并在脚注保存希腊异文。
- issue: פשע 是否应译为更强烈的“悖逆”
  choice: 过犯
  alternative: 悖逆；罪
  rationale: “过犯”保留故意违犯的严肃意味，同时避免在上下文不足时过度突出政治性或关系性的反叛含义。
- issue: 后半句的主语和时态
  choice: “他并没有做”，主语为上帝，依希伯来语完成式。
  alternative: “你不会做”，依希腊语第二人称将来式。
  rationale: 希伯来正文的隐含主语承接“上帝”，动词为第三人称阳性单数完成式；希腊平行文本反映了不同读法，故不混入正文，而在脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“出于上帝”准确表达来源归属；后句保留希伯来文略带法理辩驳色彩的结构。脚注标记 [a] 已置于正文相应位置。
