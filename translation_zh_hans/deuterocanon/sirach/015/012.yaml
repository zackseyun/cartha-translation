base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/012.yaml
  text: Do not say[b][a], “He made me stumble,” for he has no need of violent men.
translation:
  language: zh_hans
  text: 不要说：“是他使我跌倒。”[a]因为他不需要行强暴的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作“是他使我走入迷途”，含义比希伯来文本的“使我跌倒”更宽泛。
    reason: alternative_reading
  - marker: b
    text: 希腊平行文本在此作“罪人”，希伯来文本则作“行强暴的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תֹּאמַר
  choice: 不要说
  rationale: 在智慧训诲中，פֶּן加未完成式在此表达禁止或警戒；“不要说”符合现代汉语，也自然引出直接引语。
- source_word: הוּא
  choice: 是他
  rationale: 代词按上下文指向上帝；“是他”保留原文的强调意味，同时不另加称谓。
- source_word: הִתְקִילָנִי
  choice: 使我跌倒
  rationale: 希伯来语表达致使人绊跌，保留具体的跌倒意象；不以希腊文本较宽泛的“使我迷失”取代现存希伯来语读法。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达后半句对前面禁令所作的理由说明。
- source_word: אֵין צֹרֶךְ
  choice: 不需要
  rationale: 直接、自然地表达“没有需要”，并以上文所指的上帝为主语。
- source_word: בְּאַנְשֵׁי חָמָס
  choice: 强暴之人
  rationale: חָמָס具体指暴力、强暴或暴行；“强暴之人”保留希伯来文本比泛称“罪人”更鲜明的伦理含义。
theological_decisions:
- issue: 应按希伯来文本译作“使我跌倒”，还是更贴近希腊平行文本译作“使我迷失”
  choice: 使我跌倒
  alternative: 使我迷失
  rationale: 现存希伯来文本可靠度高，应作为正文依据；希腊文本的较宽泛表达有重要见证价值，故收入脚注而不取代正文。
- issue: 应保留希伯来语“强暴之人”，还是依希腊文本泛化为“罪人”
  choice: 强暴之人
  alternative: 罪人
  rationale: 希伯来语 אַנְשֵׁי חָמָס 是更具体的道德类别；保留它可避免受希腊平行文本影响而削弱原文锋芒。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“是他”体现原文独立代词的强调；“强暴之人”虽略带书面色彩，却准确保留 חָמָס 的暴力和恶行含义。脚注标记均置于对应正文之后。
