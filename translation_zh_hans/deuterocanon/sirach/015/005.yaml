base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/005.yaml
  text: And he will exalt him above his companions[a], and in the midst of the assembly he will open his mouth.
translation:
  language: zh_hans
  text: 她要高举他，使他超过同伴[a]；在会众中，她要使他开口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他超过他的朋友。”希伯来文采用单数形式，但可作集合意义；希腊文对应文本则用复数，意为“他的近人／同伴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוֹמְמַתְהוּ
  choice: 她要高举他
  rationale: רומם表示使之升高、尊荣；“高举”兼顾地位提升与受尊崇之意。希腊文ὑψώσει也支持这一理解。希伯来语动词为阴性单数，依上下文以“她”指智慧。
- source_word: מֵרֵעֵהוּ
  choice: 使他超过同伴
  rationale: 介词מִן在这里表达比较，רֵעַ虽为单数形式，却可在语境中具有集合意义；希腊文复数τοὺς πλησίον αὐτοῦ也支持“同伴”这一较广的社会关系含义。
- source_word: וּבְתוֹךְ
  choice: 在……中
  rationale: 准确表达位于群体之中的公开场景，同时比生硬的“在……中央”更符合现代汉语。
- source_word: קָהָל
  choice: 会众
  rationale: קָהָל指聚集起来的公众群体；“会众”庄重、简明，又能保留公共集会的意味，不必限定为后世特定教会制度。
- source_word: תִּפְתַּח פִּיו
  choice: 她要使他开口
  rationale: 原文直译为“她要打开他的口”。“使他开口”保留“开口”的具体意象，并以自然汉语表达智慧使人在会众中获得公开发言能力或机会。
theological_decisions:
- issue: 两个动词的主语所指
  choice: 译作阴性代词“她”，按上下文指智慧
  alternative: 依英文咨询层译作“他”，理解为上帝或智慧的赐予者
  rationale: 本节两个希伯来语动词וְרוֹמְמַתְהוּ和תִּפְתַּח均为阴性单数，且前文以阴性名词“智慧”为行动主体。中文用“她”既反映原文语法，也不把智慧另行解释为某个具名神学位格。
- issue: “使他开口”的含义
  choice: 保留具体意象，不明说是赐予权柄、口才或发言机会
  alternative: 意译为“使他公开发言”或“赐他发言的权柄”
  rationale: 原文只陈述智慧开启他的口；保留含蓄表达，可避免把可能包含的能力、机会和认可等意义缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“高举”“会众”“开口”保留原文的智慧文学和公开集会色彩；句法适度调整为自然汉语。脚注标记[a]已置于正文相应词语之后。
