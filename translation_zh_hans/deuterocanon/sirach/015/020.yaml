translation:
  language: zh_hans
  text: 他没有吩咐任何人犯罪，也没有认可诡诈的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他没有吩咐任何人行不敬虔的事，也没有准许任何人犯罪。”
    reason: 希腊平行文本在本节两个分句的表述均与现存希伯来文不同；英语审校层采用此希腊文读法。
lexical_decisions:
- source_word: לֹא צִוָּה אֱנוֹשׁ לַחֲטֹא
  choice: 他没有吩咐任何人犯罪
  rationale: 按现存希伯来文本直译：אֱנוֹשׁ在否定句中泛指“任何人”，לַחֲטֹא意为“犯罪”。
- source_word: וְלֹא הֶחֱלִים אַנְשֵׁי כָזָב
  choice: 也没有纵容虚谎的人
  rationale: הֶחֱלִים在此语境中较可能表示使其安然、给予宽免或放任；“纵容”自然表达上帝没有给虚谎者犯罪的宽免。אַנְשֵׁי כָזָב直译为“虚谎的人”。
theological_decisions:
- issue: 上帝与人的犯罪责任
  choice: 保留“没有吩咐……犯罪，也没有纵容……”的双重否定
  alternative: 依希腊文译作“没有吩咐任何人行不敬虔的事，也没有准许任何人犯罪”
  rationale: 希伯来文本为首要来源，明确否认上帝命令人犯罪或纵容虚谎者；不进一步加入自由意志等体系性解释。
- issue: 是否纳入希伯来文本中疑似越出本节的后续分句
  choice: 正文仅译前两个分句
  alternative: 续译“他也不怜悯行虚妄之事和泄露秘密的人”
  rationale: 希伯来引文中“小字（二十）”位于两个句组之间，显示后两个分句很可能属于下一节；希腊平行文本的15:20也仅对应前两个分句。
translation_notes:
  register: 采用庄重而通顺的现代普通话。“虚谎的人”比“说谎者”更贴近אַנְשֵׁי כָזָב的宽泛含义；脚注清楚呈现希腊传统的不同措辞。
