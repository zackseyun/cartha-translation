  text: For the wisdom of Yahweh is abundant[a]; he is mighty in power and sees all things.
translation:
  language: zh_hans
  text: 因为雅威的智慧丰盛[a]；他大有能力，洞察万事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“סָפְקָה”也可理解为“充足”或“供应了”；希腊文平行文本作“广大、丰盛”，支持此处译为“丰盛”。
    reason: 词义存在真实歧义，脚注保留其他可能，并说明平行文本对正文译法的支持。
lexical_decisions:
- source_word: סָפְקָה
  choice: 丰盛
  rationale: 该词可表达充足、丰裕，也可能理解为“供给了”。在这里作“雅威的智慧”的谓语，且希腊文平行文本用 πολλὴ（多、大），故译为“丰盛”，既自然又保留丰足之意。
- source_word: חָכְמַת
  choice: 智慧
  rationale: חָכְמָה 的标准译法，符合智慧文学语境。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；采用“雅威”音译，以区别于称号“主”。
- source_word: אַמִּיץ גְּבוּרוֹת
  choice: 大有能力
  rationale: אַמִּיץ 表示强盛、有力；גְּבוּרוֹת 可指力量或大能之举。希腊文平行文本倾向抽象的“能力/权能”，故合译为现代汉语自然的“大有能力”。
- source_word: וְחוֹזֶה כֹל
  choice: 洞察万事
  rationale: חזה 表示看见、观看，כֹל 表示一切；“洞察万事”以庄重而自然的汉语表达神无所不见，同时不额外引入无所不知的术语。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用专名而非一般称号，故以“雅威”保留其专名性质，不用“上主”替代；“耶和华”是传统形式，但较不贴近通常重构的读音。
- issue: וְחוֹזֶה כֹל 所表达的神圣认知范围
  choice: 洞察万事
  alternative: 看见一切
  rationale: 译文保留原句关于全面看见的陈述，不将其扩展成系统神学术语；“洞察”兼顾 חזה 的观看含义和本句庄重语体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“因为”承接上下文的论证关系；分号保留原句前后两个相关分句。“大有能力”比直译复数名词更符合现代汉语，“洞察万事”保持智慧文学的凝练感。
