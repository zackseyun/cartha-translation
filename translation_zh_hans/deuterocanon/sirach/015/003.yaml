  text: He will feed him with the bread of understanding[b][a], and give him the water of insight to drink.
translation:
  language: zh_hans
  text: 她必以明悟之饼喂养他，又把明辨之水给他喝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作“智慧之水”；希伯来文作“明辨之水”。
    reason: textual_variant
lexical_decisions:
- source_word: וְהֶאֱכִילַתְהוּ
  choice: 她必……喂养他
  rationale: 该词是 אכל 的使役式，意为“使……吃、喂养”，并带有阳性单数宾语“他”。结合上文，隐含主语是拟人化的“智慧”，故用“她”；“喂养”既自然，又保留给予食物的意象。
- source_word: לֶחֶם
  choice: 饼
  rationale: 保留具体的主食意象，并与下句的“水”构成鲜明对偶；在古代语境中“饼”比泛化的“食物”更贴近原词。
- source_word: שָׂכֶל
  choice: 明悟
  rationale: 此词指理解力、明达或健全的判断。“明悟”适合“明悟之饼”的诗性比喻，也可与下句 תְבוּנָה 所译的“明辨”有所区别。
- source_word: וּמֵי
  choice: 又把……之水
  rationale: 原文形式上是“……的水”，汉语以单数集合概念“水”表达最自然；“又”再现希伯来文连接词，并维持两句平行。
- source_word: תְבוּנָה
  choice: 明辨
  rationale: 该词可指洞察、辨识和理解；译作“明辨”可体现辨察意味，同时避免与 שָׂכֶל 合并成同一个汉语词。
- source_word: תַּשְׁקֶנּוּ
  choice: 给他喝
  rationale: שקה 表示“给……喝、使……饮用”。“把……给他喝”是自然的现代汉语，并保留原文的使役意义。
theological_decisions:
- issue: 隐含主语是否明确为拟人化的“智慧”
  choice: 正文用阴性代词“她”，承接上下文中拟人化的“智慧”。
  alternative: 可译作不标明性别的“它”，或把主语明说为“智慧”；英语咨询稿正文暂用“He”，脚注另列“She”。
  rationale: 希伯来文动词形式与篇章上下文共同指向拟人化的阴性“智慧”。汉语必须在“他／她／它”之间作书面选择；用“她”最能保存上下文的人格化表达，但不额外把原文省略的名词补入正文。
- issue: 希伯来文 תְבוּנָה 与希腊文 σοφίας 的差异
  choice: 正文依主要希伯来文见证译为“明辨”。
  alternative: 依希腊文平行文本译为“智慧”。
  rationale: 所给希伯来文见证可信度高，应作为正文依据；希腊文“智慧”反映同一智慧意象，但属于值得注明的文本差异。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“明悟之饼／明辨之水”保存原文的诗性对偶，并用“喂养他／给他喝”使表达自然清楚。
