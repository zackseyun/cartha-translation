  yaml_path: translation/deuterocanon/sirach/015/004.yaml
  text: He will lean on her and not be shaken[c][b][a]; he will trust in her and not be put to shame.
translation:
  language: zh_hans
  text: 他倚靠她[a]，就不动摇[b]；他信赖她，就不蒙羞[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”指上下文中被人格化为女性的智慧。
    reason: cross_reference
  - marker: b
    text: “不动摇”也可译作“不摇晃”或“不失足”。
    reason: lexical_alternative
  - marker: c
    text: “不蒙羞”也可译作“不羞愧”；此语还可表示因所信赖的没有落空而“不失望”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁעַן עָלֶיהָ
  choice: 他倚靠她
  rationale: שׁען 带有倚靠、凭靠之意；“倚靠”既保留具体的支撑意象，也自然表达信赖。阴性后缀照译为“她”，承接上下文中人格化的智慧。
- source_word: וְלֹא יִמּוֹט
  choice: 就不动摇
  rationale: מוט 可指摇动、失足或倾倒；“不动摇”以自然汉语保留稳定不移的核心含义。
- source_word: וּבָהּ יִבְטַח
  choice: 他信赖她
  rationale: בטח 表示信靠并因而安稳；“信赖”直接表达对人格化智慧的信任，同时避免与前句“倚靠”完全重复。
- source_word: וְלֹא יֵבוֹשׁ
  choice: 就不蒙羞
  rationale: בוש 可指因所倚赖的落空而羞愧、受辱或失望；“不蒙羞”保留其公开受辱及信靠不落空的意味，也与希腊文 καταισχυνθῇ 相符。
theological_decisions:
- issue: 阴性代词的所指与智慧的人格化
  choice: 用“她”指代上下文中人格化的智慧。
  alternative: 用“它”弱化人格化表达。
  rationale: 希伯来文两次使用阴性后缀，且上下文把智慧描写为女性；保留“她”忠实呈现原文的文学和神学意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号保留希伯来文两个平行分句；用“就”清楚表达倚靠与稳定、信赖与不蒙羞之间的结果关系，而不增添原文以外的教义解释。
