  text: She will meet him like a mother, and receive him like a wife of his youth.
translation:
  language: zh_hans
  text: 她要像母亲一样迎接他，又像他年轻时的妻子一样接纳他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“像童贞时期的女子”，可理解为年轻的新娘或童贞的妻子。
    reason: 保存希腊平行文本与希伯来文措辞之间的差异。
lexical_decisions:
- source_word: וְקִדְּמַתְהוּ
  choice: 她要……迎接他
  rationale: קדם在此表示主动上前相迎；希腊文ὑπαντήσεται也支持“迎接”。“迎接”既自然，也保留智慧主动亲近人的意味。
- source_word: כָאֵם
  choice: 像母亲一样
  rationale: 直接保留希伯来文כ所表达的明喻，并以现代汉语自然表达。
- source_word: וּכְאֵשֶׁת נְעוּרִים
  choice: 像他年轻时的妻子一样
  rationale: אֵשֶׁת נְעוּרִים是指与人青春时期相关的妻子，通常含有早年婚姻的亲爱意味。汉语补出“他”，使所指清楚，同时不把希腊文所强调的童贞或新娘意味并入正文。
- source_word: תְּקַבְּלֶנּוּ
  choice: 接纳他
  rationale: קבל可指接受、接待或接纳；“接纳”在本句的人际和亲密语境中自然，并与前句“迎接”形成合宜递进。
theological_decisions:
- issue: 智慧以女性身份出现，并采用母亲和妻子的意象
  choice: 保留女性代词“她”以及母亲、妻子的双重比喻
  alternative: 用中性“它”指智慧，或把人格化意象改写为抽象表达
  rationale: 希伯来文动词为阴性，且经文明说母亲与妻子的比喻。保留女性人格化忠于诗歌形式，也不消解经文的神学张力。
- issue: 如何依据希伯来文אֵשֶׁת נְעוּרִים并兼顾希腊文γυνὴ παρθενείας
  choice: 正文采用“他年轻时的妻子”
  alternative: 年轻的新娘；童贞的妻子；作处女时的妻子
  rationale: 本节存有可信度高的希伯来文，应以其为正文依据；希腊文所见“童贞／新娘时期”的差异则以脚注保存，不强行调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“迎接／接纳”呈现两个平行而不完全重复的动作；保留智慧的女性人格化。
