  text: Fire and water are set before you; whichever you choose[a], stretch out your hand to it.
translation:
  language: zh_hans
  text: 火与水摆在你面前；你愿意哪一样，就向哪一样伸手。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文开头的词（“מוּצָק”）词形不寻常；希腊文平行文本作“他摆在你面前”，支持这里表达“放置、陈列在面前”的意思。
    reason: textual_variant
lexical_decisions:
- source_word: מוּצָק
  choice: 摆在
  rationale: 希伯来文本此处词形不寻常；结合לְפָנֶיךָ及希腊文παρέθηκέν σοι，可知表达的是把选择陈列、放置在人面前。“摆在”自然地保留这一具体意象。
- source_word: לְפָנֶיךָ
  choice: 你面前
  rationale: 直译其空间性惯用语，也适合本节将两种选择呈给听者的语境。
- source_word: אֵשׁ וָמָיִם
  choice: 火与水
  rationale: 保留希伯来文及希腊文中的具体对举意象，不加解释。
- source_word: בַּאֲשֶׁר תַּחְפֹּץ
  choice: 你愿意要哪一样
  rationale: חפץ表示意愿、喜好或想要；此译自然呈现人在两个选项之间的意愿，同时不把它抽象化为术语性的“选择”。
- source_word: שְׁלַח יָדֶיךָ
  choice: 就向它伸手
  rationale: 按希伯来文惯用表达译为伸手取向某物；“它”承接前面的任一选项。希伯来文形式为“你的手”，希腊文也用单数，汉语无需标明数。
theological_decisions:
- issue: 本节对人的道德能动性的强调
  choice: 如实呈现两种选项摆在人面前，并由听者按自己的意愿伸手取向其中之一。
  alternative: 用决定论式措辞削弱命令及选择的实际意味。
  rationale: 希伯来文与希腊文都明确陈列选项并要求人伸手；译文保留这种能动性，不加入后来的教义限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“火与水”保留鲜明对举；分号呈现陈列选项与行动命令之间的结构。
