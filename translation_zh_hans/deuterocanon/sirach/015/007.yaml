  text: Men of falsehood will not attain her[b][a], and men of insolence will not see her.
translation:
  language: zh_hans
  text: 虚妄之徒得不到她[a][b]；狂傲之人看不见她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“虚妄之徒”；希腊文平行文本作“愚昧的人”，可能反映不同的底本，也可能是解释性译法。
    reason: alternative_reading
  - marker: b
    text: 此处希伯来动词若机械直译，可作“引导她”，但语意困难；希腊文平行文本支持“把握她”或“得到她”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַדְרִיכוּהָ
  choice: 得不到她
  rationale: 若按 דרך 的常见使役义直译为“引导她”，在此以上文的“智慧”为宾语并不自然。希腊平行文本 καταλήμψονται 支持“取得、把握、达到”的理解；“得不到她”用自然现代汉语表达这类人不能获得智慧。
- source_word: מְתֵי שָׁוְא
  choice: 虚妄之徒
  rationale: מְתֵי 是“……之人”，שָׁוְא 可指虚假、虚空或无价值。“虚妄之徒”保留其道德与虚假意味，也不把词义过度限定为单纯“骗子”。
- source_word: וְאַנְשֵׁי זָדוֹן
  choice: 狂傲之人
  rationale: זָדוֹן 表示傲慢、狂妄或僭越。“狂傲之人”既自然庄重，也保留出于骄傲而放肆的道德色彩，避免泛化为“恶人”。
- source_word: לֹא יִרְאוּהָ
  choice: 看不见她
  rationale: רָאָה 的基本义为“看见”，希腊文 ἴδωσιν 亦相符。这里虽可含有认识或领悟之意，正文仍保留具体的“看见”意象。
theological_decisions:
- issue: 希伯来文本第一分句的动词语义困难，应如何结合希腊平行文本处理
  choice: 以现存希伯来文本为主，保留“虚妄之徒”，同时依据希腊平行文本把困难动词译为“得不到”。
  alternative: 直译为“虚妄之徒不会引导她”；或完全依希腊文译为“愚昧的人绝不能把握她”。
  rationale: 希伯来见证在此完整且可信，应作为正文基础；但 יַדְרִיכוּהָ 若机械理解为“引导她”语意突兀。希腊文支持“获得、把握”的方向，因此以其帮助澄清动词，却不以希腊文“无知/不明智的人”取代希伯来文“虚妄之徒”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“她”承接上下文中人格化的智慧；两分句保持对称。“虚妄之徒”较凝练，兼顾希伯来习语的力度与现代可读性。
