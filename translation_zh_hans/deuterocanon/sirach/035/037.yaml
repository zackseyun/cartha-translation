  text: For idleness has taught much evil[a].
translation:
  language: zh_hans
  text: 因为闲散教会了人许多恶事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为懒惰教会了人许多恶事。”希腊语ἀργία可指闲散、懒惰或无所事事；正文采用“闲散”，以保留其较宽泛的状态含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὴν
  choice: 许多
  rationale: πολλήν修饰单数抽象名词κακίαν，表示程度或分量；汉语用“许多恶事”自然地表达恶的多方面表现。
- source_word: γὰρ
  choice: 因为
  rationale: γάρ在此说明前文的理由或根据；“因为”清楚保留其解释性连接作用。
- source_word: κακίαν
  choice: 恶事
  rationale: κακία含有恶、邪恶或败坏的广泛道德意义。“恶事”在现代汉语中自然，并可与“许多”搭配，而不将含义收窄为“恶意”或特定的“恶习”。
- source_word: ἐδίδαξεν
  choice: 教会了
  rationale: 原文明确采用“教导”的拟人化说法。“教会了”保留这一比喻，也体现不定过去时所概括的经验性结果。
- source_word: ἡ ἀργία
  choice: 闲散
  rationale: ἀργία指无所事事、懒散或不劳作的状态。“闲散”较宽泛，既保留状态含义，也避免“懒惰”过度强调人格特征。
theological_decisions: []
translation_notes:
