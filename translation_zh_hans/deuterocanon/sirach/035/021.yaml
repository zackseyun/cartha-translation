  text: A devious heart causes grief[b][a], and an experienced man will repay him in kind.
translation:
  language: zh_hans
  text: 诡诈的心带来忧伤[b]；老练的男子必作出相应的回应[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句较难确定。希伯来文大意近乎是：“老练的男子必把它归回／回应，在他／它里面（或以他／它）。”其中两个代词的所指以及介词短语的作用都不明确。也可理解为“必照样回应”或“必照所行的还报他”。本节的希腊文本与现存希伯来文差异很大，可能反映不同的底本或文本讹误。
    reason: alternative_reading
  - marker: b
    text: 斯威特本希腊文作：“不要信任一条不会使人绊跌的路。”这与此处保存下来的希伯来文并不相近。
    reason: textual_variant
lexical_decisions:
- source_word: לב
  choice: 心
  rationale: 在希伯来智慧文学中，לב指人的内在，包括思想、意向和品格；“心”保留原文的惯用意象。
- source_word: עקוב
  choice: 诡诈的
  rationale: 此词表示弯曲、不正的品格；“诡诈的”在现代汉语中自然，也保留其道德意味，而不局限于一般的“弯曲”。
- source_word: יתן
  choice: 带来
  rationale: 字面义为“给出”，在此具有产生结果的作用；“带来忧伤”符合汉语表达，又不过度补充施受关系。
- source_word: עצבת
  choice: 忧伤
  rationale: 该名词表示愁苦、悲伤或痛苦；“忧伤”简洁庄重，适合智慧文学语境。
- source_word: ואיש
  choice: 男子
  rationale: איש为阳性单数，译作“男子”保留原文明确的性别形式，同时仍可在箴言中具有代表性。
- source_word: ותיק
  choice: 老练的
  rationale: 此词指经过历练、富有经验或成熟可靠；“老练”既体现经验，也含有经事而有判断力的意味。
- source_word: ישיבנה
  choice: 还报
  rationale: 该形式来自“返回、使返回”，带阴性宾语后缀；“还报”保留回返和回应的意味，但具体宾语所指仍不完全确定。
- source_word: בו
  choice: 照样……他
  rationale: 介词加代词后缀的句法极为简略，可能表达“以同样方式”或指向“他”；主文采用自然的互惠表达，脚注保留其他可能。
theological_decisions:
- issue: איש的性别表达
  choice: 老练的男子
  alternative: 有经验的人
  rationale: 原文使用明确的阳性单数名词；主文不将其无提示地中性化，但这句箴言仍可能具有普遍适用性。
- issue: 末句代词结构含混
  choice: 必照样还报他
  alternative: 必作出相应的回答；必把它归还给他
  rationale: ישיבנה בו结构紧凑，宾语和介词后缀的具体指向不明确。主文传达可能的对应或回报关系，不把任何一种句法分析说成唯一解释；脚注说明歧义及希腊文本的显著差异。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前半句保持“心”的希伯来意象；后半句用“老练的男子”保留性别与阅历色彩，并以脚注明示文本和句法的不确定性。
