  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: zh_hans
  text: 轭和皮革带子将使颈项弯下；对于作恶的奴仆，有拷问架和酷刑。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: 轭
  rationale: 与“颈项”及使其弯下的动作相连，明确指套在颈上的轭，而非“天平”等其他词义。
- source_word: ἱμάς
  choice: 皮带
  rationale: 该词指皮革制的带子或皮条；“皮带”在现代汉语中清楚自然，也与“轭”的约束意象相配。
- source_word: κάμψουσιν
  choice: 必使……弯下
  rationale: 保留将来时和主动施力的身体意象；补出“使”符合汉语表达，同时不过度强化为“强压”。
- source_word: τράχηλον
  choice: 颈项
  rationale: 直接表达身体部位；“颈项”庄重且符合经文语体。
- source_word: οἰκέτῃ
  choice: 奴仆
  rationale: οἰκέτης可指家仆，也可能具有受役使者的身份色彩；“奴仆”既保留从属和强制背景，又不把原词狭义化为现代法律意义上的“奴隶”。
- source_word: κακούργῳ
  choice: 作恶的
  rationale: 表达道德上行恶、为恶的性质，同时避免“罪犯”所带来的法律定罪窄义。
- source_word: στρέβλαι
  choice: 刑架
  rationale: 该复数名词指扭拉身体的刑具，尤其可指拷问架；汉语以集合性表达“刑架”自然且具体。
- source_word: βάσανοι
  choice: 酷刑
  rationale: 在惩罚语境中指拷打、折磨；“酷刑”直接保留其强烈的刑罚含义。
theological_decisions:
- issue: οἰκέτῃ所表达的役属身份
  choice: 奴仆
  alternative: 仆人；家仆；奴隶
  rationale: 原词可泛指家庭中的仆役，不必然精确界定其法律身份，但本句的约束和刑罚语境凸显其受支配地位。“奴仆”兼顾两面，不将其淡化为普通雇员，也不武断限定为现代意义的奴隶。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前后两个分句以分号呈现并列格言结构；不增添原文未明说的施事者。
