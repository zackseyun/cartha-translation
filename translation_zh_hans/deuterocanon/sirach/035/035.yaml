review_pass:
  verdict: revise
  source_fidelity: 首句基本忠实，但“皮带”在现代汉语中通常指系腰的腰带，未能清楚表达ἱμάς在此处作为皮革束带的含义。次句加入“则要用”暗示了原文未明说的施事者和动作；希腊文只是以省略式陈述刑具和酷刑是为这类奴仆而设。
  naturalness: “对于作恶的奴仆，有拷问架和酷刑”保留格言式的简洁与省略，现代书面汉语自然。“皮革带子”虽较“皮带”稍长，却避免腰带义，表达明确。
  terminology: “轭”“颈项”“作恶的奴仆”准确且语体相称。“拷问架”比泛称的“刑架”更能表达στρέβλαι所指的扭拉身体的拷问器械；“酷刑”准确对应βάσανοι。
  issues:
  - severity: medium
    issue: “皮带”容易被理解为腰带。
    rationale: ἱμάς在此与轭并列，指用于束缚或施力的皮革带子，而不是现代通常所说的腰带。
  - severity: medium
    issue: “则要用”添加原文未明示的动作和施事者。
    rationale: 原文后半句为“给/对于作恶的奴仆，拷问架和酷刑”的省略表达。改为“有”可保留这种不指明谁施行的结构。
  - severity: low
    issue: “刑架”较为宽泛。
    rationale: στρέβλαι特别指拷问、扭拉用的刑具；“拷问架”较具体，同时不把其构造过度限定。
