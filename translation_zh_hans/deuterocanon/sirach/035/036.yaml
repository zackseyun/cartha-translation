  text: Put him to work, so that he may not be idle,
translation:
  language: zh_hans
  text: 要让他做工，免得他闲着，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: 要派
  rationale: ἐμβάλλω在“εἰς ἐργασίαν”这一搭配中不是字面上的“扔进去”，而是把人安排到工作中；“要派”自然地表达命令语气，并与后面的“去做工”搭配。
- source_word: αὐτὸν
  choice: 他
  rationale: 阳性单数宾格代词，按上下文指男性人物，译作“他”。
- source_word: εἰς ἐργασίαν
  choice: 去做工
  rationale: ἐργασία表示工作、劳作或职业；结合前面的动词，译作“派他去做工”符合现代汉语习惯，又保留安排其劳动的含义。
- source_word: ἵνα
  choice: 免得
  rationale: 此处引出所要避免的结果或带否定内容的目的；“免得”在现代汉语中简洁自然地传达“为使他不……”的目的关系。
- source_word: μὴ ἀργῇ
  choice: 他闲着
  rationale: ἀργέω意为闲置、无所事事或不工作。“闲着”保留行为状态，不强化为对品格的“懒惰”判断。
