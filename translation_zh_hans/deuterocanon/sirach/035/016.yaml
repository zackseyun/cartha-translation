  text: And all the ends of the earth will know that you are the eternal God[a][b].
translation:
  language: zh_hans
  text: 地极的人都必知道，你是永恒的上帝。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文传统作：“敬畏主的人必寻得审判，并要使正义的作为如光燃起。”这里的希伯来文本保存的是实质上不同的一行。
    reason: textual_variant
  - marker: b
    text: 或译：“永远的上帝”或“永恒之上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וידעו
  choice: 都必知道
  rationale: 该形式在此诗体、祷告式语境中自然表达将来或结果，译作“必知道”；“都”与后面的“地的四极”共同体现普遍性。
- source_word: כל אפסי ארץ
  choice: 地的四极都
  rationale: 这是指全世界最遥远之处的希伯来语惯用语。“地的四极”庄重、自然，也保留原文的空间意象；搭配“都”表达 כל。
- source_word: אתה
  choice: 你是
  rationale: 保留原文明说的第二人称代词及其强调意味，但不增添原文没有的“唯有”。
- source_word: אלהי עולם
  choice: 永恒的上帝
  rationale: 原文直译可作“永恒之上帝”或“永远的上帝”。现代汉语以“永恒的上帝”最自然，并保留 עולם 所表达的永恒含义。
theological_decisions:
- issue: 希伯来文本与希腊传统存在实质差异
  choice: 正文以现存希伯来文本为准，希腊异文列入脚注
  alternative: “敬畏主的人必寻得公正，并要使正义如光发亮。”
  rationale: 本节有可靠的希伯来见证，应优先据此翻译；希腊文本并非同一句话的轻微措辞差异，不宜将两者调和，但其重要异文应明确保存。
- issue: אלהי עולם 的表达
  choice: 永恒的上帝
  alternative: 永远的上帝／永恒之上帝
  rationale: “永恒的上帝”既可自然表达时间上的无尽，也不额外界定其具体神学内涵；脚注保留较贴近名词结构的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“地的四极”保留希伯来诗歌意象；正文中的脚注标记与脚注逐一对应。
