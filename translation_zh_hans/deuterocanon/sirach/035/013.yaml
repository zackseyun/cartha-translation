  text: Bear witness to your former deeds[a], and establish the vision swiftly in your name.
translation:
  language: zh_hans
  text: 请为你从前的作为作证，并以你的名使异象迅速确立。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本行希伯来文颇为费解，尤其是这里译作“迅速”的词。希腊文平行文本则作：“此外，你要称颂那创造你的、用他的美物使你饱足的。”
    reason: alternative_reading
lexical_decisions:
- source_word: תן עדות
  choice: 请……作证
  rationale: 原文是命令式，直译为“作证”或“给出见证”。“请”使对上帝的祈求在现代汉语中自然庄重，同时保留见证、证实的意味。
- source_word: למראש מעשיך
  choice: 为你从前的作为
  rationale: למראש 的形式和确切语义较难确定；结合 מעשיך（“你的作为”），译作“从前的”较能表达先前、以往之意。“作为”比“工作”更适合描述上帝的行动。
- source_word: והקם
  choice: 并……使……确立
  rationale: קום 的使役式命令可指使某事立定、建立或得到证实。“使……确立”保留其使役力量，也避免直接解释成“应验”。
- source_word: חזון
  choice: 异象
  rationale: חזון 通常指先知性的“异象”；此译法保留原文意象及其可能的启示语境，不窄化为“预言”或“神谕”。
- source_word: דברק
  choice: 迅速
  rationale: 该词在此处文本困难，辅音可能使人联想到闪电或迅疾。译作“迅速”是对现存希伯来文的克制处理，但不声称词义确定，因此在脚注中明确说明。
- source_word: בשמך
  choice: 以你的名
  rationale: 介词 ב 与“名”连用可表达“以、凭、在……之中”。“以你的名”贴近原文，也保留它与前述动词之间略显含混的句法关系。
theological_decisions:
- issue: 开罗藏经库希伯来文本与希腊平行文本显著不同
  choice: 正文以现存希伯来文为主，按其可辨识的语义谨慎翻译，并用脚注说明困难及希腊异文。
  alternative: “此外，你要称颂那创造你的、用他的美物使你饱足的。”
  rationale: 本项目在《便西拉智训》的希伯来文存留处优先采用希伯来见证；但本节希伯来文晦涩，且希腊文呈现完全不同的句意。正文不以希腊文取代希伯来文，也不掩盖两者之间的张力。
- issue: והקם חזון 是否应解释为异象的“应验”
  choice: 译作“使异象……确立”。
  alternative: “使异象应验”或“实现异象”。
  rationale: “应验”具有合理的预言语境，但比原文 קום 的使役含义更具体。采用“确立”可保留异象被立定、证实或成就的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语体。“请”体现希伯来文命令式在向上帝祈求时的汉语语用；句法尽量贴近原文，并以脚注保留文本不确定性。
