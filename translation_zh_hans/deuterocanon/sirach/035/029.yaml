  text: As long as you still live and have breath in you, do not give yourself over to any flesh.
translation:
  language: zh_hans
  text: 只要你还活着，你里面还有气息，就不要把自己交给任何世人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按较形式对应的译法，可译作：“不要为任何血肉之人改变自己。”这里的“血肉”指必死的世人；希腊语表达较为含蓄，也可能含有不要向世人屈从的意思。
    reason: 保留ἀλλάξῃς“改变”的基本含义及πάσῃ σαρκί的字面意象，并说明该习语可能具有的让渡或屈从含义。
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: 只要你还活着
  rationale: 表达持续的时限，并保留ἔτι所强调的“还、仍然”；现代汉语自然清楚。
- source_word: πνοὴ ἐν σοί
  choice: 气息尚在你里面
  rationale: πνοή在这里指维持生命的气息；“气息”既贴近原文，也避免把它强化为特定的人论意义上的“灵”。“尚”与前句“还”共同体现生命仍在延续。
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: 不要把自己交给
  rationale: ἀλλάσσω本义涉及改变或交换；与反身代词和与格对象连用时，语意较为压缩，可理解为把自己让给或置于他者支配之下。正文采用自然而不过度解释的汉语，脚注保留较形式对应的译法。
- source_word: πάσῃ σαρκί
  choice: 任何世人
  rationale: σάρξ在此智慧文学语境中指脆弱、必死的人类，而非“罪性”或身体欲望。“任何世人”在现代汉语中比“任何血肉”更能准确传达所指，同时保留凡人意味。
theological_decisions:
- issue: σάρξ在本节中的含义
  choice: 世人，即必死的人
  alternative: 肉体、肉欲或罪性
  rationale: πάσῃ σαρκί是可指人类的惯用表达；上下文没有依据把它解释为保罗书信语境中的“罪性”，也不是针对身体欲望。
- issue: μὴ ἀλλάξῃς σεαυτὸν πάσῃ σαρκί的语力
  choice: 警告人不要把自己交由任何世人摆布
  alternative: 不要为任何人改变自己；不要使自己像所有人
  rationale: 希腊语表达简约且具有歧义。正文以“把自己交给”传达可能的让渡或屈从含义，但不增添“控制”“审判”等原文未明说的概念；脚注说明字面可能性，以保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“气息尚在你里面”保留原文意象；“任何世人”避免“任何肉体”在现代汉语中被误解为身体或肉欲。脚注标记已在正文中列出。
