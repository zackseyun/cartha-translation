  text: Stir up anger and pour out wrath[a]; humble the foe and drive back the enemy.
translation:
  language: zh_hans
  text: 唤起怒气，倾倒烈怒[a]；使敌手降卑，击退仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特版希腊文平行文本与此处差异很大，译作：“金工制品上的绿宝石印章；伴着甘美酒的乐曲。”本节采用开罗藏经库传统中证据充分的希伯来文见证作为主要文本。
    reason: textual_variant
lexical_decisions:
- source_word: העיר
  choice: 唤起
  rationale: 这是使役命令式，意为使之醒起、发动。“唤起”保留了紧迫的命令语气，也自然地与“怒气”搭配。
- source_word: אף
  choice: 怒气
  rationale: 该词本义可指“鼻子”，但常用来表示愤怒；译作“怒气”，并与下文更强烈的“烈怒”形成诗意对应。
- source_word: ושפוך
  choice: 倾倒
  rationale: שפך的具体意象是“倒出、倾倒”。保留这一意象，比意译为“发泄”或“释放”更贴近原文。
- source_word: חמה
  choice: 烈怒
  rationale: 该词可指热气、暴怒；此处表示施行审判时强烈的愤怒。“烈怒”既与“怒气”有别，也保留其强度。
- source_word: והכניע
  choice: 使……降卑
  rationale: כנע可表示使之屈服或降卑。此译保留原文使敌手被压低、被制服的意象，同时不把含义限缩为单纯军事征服。
- source_word: צר
  choice: 敌手
  rationale: צר指敌对者、仇敌或压迫者。“敌手”简洁地保留单数敌对者的含义，并避免与末句“仇敌”完全重复。
- source_word: והדוף
  choice: 击退
  rationale: הדף意为推开、赶退。“击退”符合现代汉语表达，也保留排斥敌对势力的动作感。
- source_word: אויב
  choice: 仇敌
  rationale: אויב是常用的“敌人、仇敌”。译作“仇敌”与前面的“敌手”构成对应，并保留末句的加强语气。
theological_decisions:
- issue: 命令句的受话者与隐含主语
  choice: 保留第二人称命令式，不在正文中明加“主啊”或“上帝”。
  alternative: 按上下文明确补出“主啊”，表明这是向上帝发出的祈求。
  rationale: 希伯来文只有一连串命令式动词，没有明说主语；上下文虽指向向上帝祈求，但正文不宜加入本节未出现的称呼。汉语无主语命令句能保留这种含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语体。四个动词保持连续命令式和两组平行结构；“怒气／烈怒”“敌手／仇敌”分别体现希伯来诗句中相近而不完全相同的词语。
