base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/004.yaml
  text: Where[a] there is listening[b], do not pour out speech, and do not show off wisdom[c] at the wrong time.
translation:
  language: zh_hans
  text: 有人听的时候[a][b]，不要滔滔不绝，也不要不合时宜地卖弄智慧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希伯来文见证似乎与《便西拉智训》35:4不相对应；因此，本节依据希腊文平行文本翻译。希腊文在这里劝人节制言语，不要在不适当的时候炫示智慧。
    reason: textual_variant
  - marker: b
    text: 或译：“有听众的时候”。希腊词ἀκρόαμα既可指听或聆听，也可指听众。
    reason: lexical_alternative
  - marker: c
    text: 或译：“不要在不合时宜的时候装作聪明人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: ……的时候
  rationale: ὅπου引出相关情境；译作“……的时候”比直译为“在……的地方”更符合现代汉语，同时保留“在这种情况下”的意思。
- source_word: ἀκρόαμα
  choice: 有人听
  rationale: 该词可指听、聆听，也可指听众。“有人听”在汉语中自然，并在一定程度上兼顾行为与听众两层含义；另一种理解在脚注中说明。
- source_word: μὴ ἐκχέῃς λαλιάν
  choice: 不要滔滔不绝
  rationale: 原文直译为“不要倾倒话语”。“滔滔不绝”以自然的汉语表达大量倾泻言语的意象和劝戒语气。
- source_word: ἀκαίρως
  choice: 不合时宜地
  rationale: 准确表达“在不适当的时候、不得其时”，并保持智慧文学中重视言行合宜的意味。
- source_word: μὴ σοφίζου
  choice: 不要……卖弄智慧
  rationale: 这里不是禁止智慧本身，而是警告人不要使自己显得聪明或炫示智慧；“卖弄智慧”保留这种负面语气。
theological_decisions:
- issue: 本节应依据哪一份原文见证
  choice: 依据所给希腊文平行文本翻译，并在脚注中披露希伯来文错配问题。
  alternative: 将所给希伯来文“他们就会知道，正如我们已经知道……”作为本节正文翻译。
  rationale: 所给希伯来文内容与《便西拉智训》35:4的希腊文及本节语境明显不符，看来属于另一处经文。为避免把错配文本冒充本节原文，正文采用能够对应本节的希腊文见证，同时明确保留文本来源的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“滔滔不绝”自然传达原文“倾倒话语”的意象；“卖弄智慧”明确指出所责备的是炫示聪明，而不是智慧本身。脚注保留原文见证错配和关键词的歧义。
