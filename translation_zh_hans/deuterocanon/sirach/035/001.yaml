    text: 所提供的希腊文平行文本在《德训篇》35:1处作：“若有人立你作领袖，不要自高；要在他们中间，如同他们中的一员。”这与本节所提供的希伯来文完全不对应；正文据该希伯来文翻译。
    reason: textual_variant
