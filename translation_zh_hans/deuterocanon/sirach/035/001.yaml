  text: If they made you a leader, do not exalt yourself; be among them as one of them.[a]
translation:
  language: zh_hans
  text: 有人立你作领袖了吗？不要自高；在他们中间，要像他们中的一员。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所提供的希伯来文见证作：“拯救我们，万有的上帝；使万国都敬畏你。”这与标为《德训篇》35:1的希腊文并不对应，因此正文依据希腊文翻译，并在此注明这一文本错位。
    reason: textual_variant
lexical_decisions:
- source_word: Ἡγούμενόν
  choice: 领袖
  rationale: 该词指带领人或负有领导责任者；“领袖”自然明确，又不把这一角色限定为正式政治官职。
- source_word: κατέστησαν
  choice: 立你作
  rationale: 该动词表示使某人处于某种职位或委任其承担职责；“立你作”保留了希腊文不定复数主语和任命之意。
- source_word: μὴ ἐπαίρου
  choice: 不要自高
  rationale: 保留“抬高自己”的形象和反身意味，比单说“不要骄傲”更贴近原文。
- source_word: γίνου
  choice: 要像
  rationale: 此处为行为劝诫；结合后面的比较结构，译作“要像”符合现代汉语表达。
- source_word: ὡς εἷς ἐξ αὐτῶν
  choice: 像他们中的一员
  rationale: 准确表达领袖应与众人同处、视自己为其中一员的谦卑和群体认同。
theological_decisions:
- issue: 本节所附希伯来文本与希腊文本完全不对应
  choice: 正文依据与《德训篇》35:1这一标号相配且语意完整的希腊平行文本翻译，并在脚注中公开说明希伯来见证的不同内容。
  alternative: 正文按所提供的希伯来文译为：“拯救我们，万有的上帝；使万国都敬畏你。”
  rationale: 两份原文并非细微异文，而是不同句子。为避免把不对应的希伯来句子无说明地当作本节，正文采用所附希腊平行文本，同时完整记录来源错位，不掩盖文本问题。
- issue: Ἡγούμενόν σε κατέστησαν 的句法形式
  choice: 保留希腊文的疑问句：“有人立你作领袖了吗？”
  alternative: 按条件句处理：“若有人立你作领袖。”
  rationale: 原文以疑问句呈现；中文疑问句自然可懂，也避免把其语法形式默默改写为条件句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不要自高”保留原文意象；分号连接对领袖的两项劝诫。脚注措辞保持中立，只说明文本事实，不推定错位产生的原因。
