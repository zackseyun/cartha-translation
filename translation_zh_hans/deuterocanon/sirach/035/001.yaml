review_pass:
  verdict: revise
  source_fidelity: 所提供且标示为高可信度的希伯来文为“הושיענו אלהי הכל, והרם פחדך על כל הגוים”，其内容是向万有的上帝祈求拯救并使万国敬畏，不是关于被立为领袖的劝诫。正文应首先忠实译出该希伯来文。希腊文平行文本与之完全不对应，只宜在脚注中如实说明，不能取代本次所给希伯来语来源作为正文。
  naturalness: “求你拯救我们，万有的上帝；求你使万国敬畏你。”是自然、庄重的现代普通话祈祷语体。重复“求你”使并列祈求关系清楚，也避免把“使万国敬畏你”误读为单纯陈述。
  terminology: “上帝”适合译 אלהי；“万有的上帝”保留 הכל 的包容性，未将其缩窄为“万国的上帝”。“敬畏你”在汉语圣经语境中准确传达 פחדך 的“你的威严所激起的畏惧”，且不作超出原文的教义阐释。
  issues:
  - severity: high
    issue: 正文采用了与所供希伯来文完全不同的希腊文句子。
    rationale: 希伯来文要求译为对上帝的祈求：“拯救我们……使万国敬畏你。”现有正文“有人立你作领袖了吗？”没有对应的希伯来语词句，构成实质性的来源不忠实。
  - severity: medium
    issue: 脚注称正文依据希腊文，虽公开了文本错位，却未使正文与优先审查的原文来源一致。
    rationale: 应将文本错位说明保留为脚注，但正文须译出所提供的希伯来见证；希腊文的不同内容可作为平行来源信息说明。
  revised_text: 求你拯救我们，万有的上帝；求你使万国敬畏你。[a]
  revised_footnotes:
