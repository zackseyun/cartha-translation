  text: The prayer of the humble has passed through the clouds[a], and until it draws near, it will not be comforted[b];
translation:
  language: zh_hans
  text: 谦卑人的祷告穿过云层[a]；直到它临近，它绝不受安慰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直上云霄”。原文描绘祷告上升、直达上帝面前的景象。
    reason: lexical_alternative
  - marker: b
    text: 原文后半句没有重新点明主语。正文将“临近”和“受安慰”都理解为拟人化的“祷告”；也可理解为祷告临近，而谦卑人尚未得安慰。
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴ
  choice: 祷告
  rationale: 在向上帝呼求的语境中，这是现代汉语最自然、庄重的对应词，也比“祈求”更能涵盖一般性的祷告。
- source_word: ταπεινοῦ
  choice: 谦卑人
  rationale: 兼顾道德与属灵层面的谦卑含义，不把它限定为社会地位低下或身受苦难的人。
- source_word: νεφέλας διῆλθεν
  choice: 穿过云霄
  rationale: 保留祷告向上升达上帝面前的鲜明意象；“云霄”符合现代汉语表达，而不额外强化为破云而入。
- source_word: ἕως συνεγγίσῃ
  choice: 在它临近以前
  rationale: 希腊文动词未明说主语；按最近的阴性名词“祷告”理解，以“它”承接，同时在脚注交代歧义。
- source_word: οὐ μὴ παρακληθῇ
  choice: 它绝不受安慰
  rationale: 保留 παρακαλέω 被动式“受安慰”的通常意义，并以“绝不”体现 οὐ μή 的强烈否定。虽然祷告“受安慰”在汉语中带有拟人色彩，这正保留了希腊文可能的诗性张力。
theological_decisions:
- issue: 后半句两个动词的隐含主语
  choice: 将“临近”和“受安慰”的主语都理解为拟人化的“祷告”
  alternative: “祷告”临近，而谦卑人尚未得安慰；或两个动词都指谦卑人
  rationale: 希腊文没有在这两个动词前重述主语；从语法衔接看，阴性名词“祷告”是最直接的承接对象，但语义上“受安慰”也很自然地可指祷告者。正文采用语法上顺畅的拟人读法，脚注保留另一可能，不消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“穿过云霄”保留诗性意象；“它绝不受安慰”刻意保留原文可能的拟人表达，并借脚注说明主语歧义。
