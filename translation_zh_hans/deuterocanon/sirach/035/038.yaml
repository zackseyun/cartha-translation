base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/038.yaml
  text: Assign him work as is fitting for him; and if he does not obey[a], make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: zh_hans
  text: 要派他做适合他的工作；即使他不服从，也要加重他的脚镣。但对任何有血肉的人[a]都不可过分；凡事都不要未经判断就去做。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “任何有血肉的人”：希腊文直译为“一切血肉”，这里指任何人。
    reason: 说明σάρξ的字面形式及其在语境中的指称。
  - marker: b
    text: “判断”也可译作“审断”“权衡”或“公正裁决”。
    reason: 保留κρίσις在判断、辨别与裁决之间的语义幅度。
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: 要派他做……工作
  rationale: καθίστημι与εἰς加宾格表示把人安排到某项工作或职责中；“派他做……工作”在现代汉语中自然，并保留命令语气。
- source_word: καθὼς πρέπει αὐτῷ
  choice: 适合他的
  rationale: πρέπει表示合宜、相称；此译既可指工作与其身份或能力相称，也不额外限定判断标准。
- source_word: κἂν μὴ πειθαρχῇ
  choice: 即使他不服从
  rationale: κἂν为καὶ ἐάν的缩合，在此自然表达让步条件“即使”；πειθαρχέω指服从权威或命令，原文没有明说“管教”，故不补入。
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: 加重他的脚镣
  rationale: πέδαι是束缚双脚的镣铐；“加重他的脚镣”贴近字面，也保留原文严厉的社会历史语境。
- source_word: μὴ περισσεύσῃς
  choice: 都不可过分
  rationale: περισσεύω在这里指超过适当限度；“不可过分”简洁地表达不得施行过度。
- source_word: ἐν πάσῃ σαρκί
  choice: 对任何有血肉的人
  rationale: σάρξ字面为“肉、血肉”，此处以具体的人体用语泛指人；“有血肉的人”既保留意象，又比“任何肉体”更符合现代汉语。
- source_word: ἄνευ κρίσεως
  choice: 未经判断
  rationale: κρίσις可指判断、审断、辨别或裁决；“判断”保持其范围，不把语义仅限于司法公正或个人思量。
- source_word: μὴ ποιήσῃς μηδέν
  choice: 凡事都不要……去做
  rationale: 原文否定命令与μηδέν合用，表示任何事都不可如此做；汉语用“凡事都不要”自然呈现其全面禁止。
theological_decisions:
- issue: 智慧训诫中σάρξ的译法
  choice: 有血肉的人
  alternative: 任何人；一切血肉
  rationale: 此处σάρξ泛指人，但保留“血肉”可呈现原文具体而具受造者意味的措辞；加上“人”则避免现代汉语误解。
- issue: κρίσις所表达的规范
  choice: 判断
  alternative: 审断；权衡；公正裁决
  rationale: 上下文要求行事有合宜的衡量，但原文没有明确限定为司法程序、主观辨别或公平原则，因此采用涵盖面较广的“判断”。
translation_notes:
  register: 采用现代、庄重而直接的训诫语体。分号呈现前后两组命令的结构；保留“脚镣”和“血肉”的具体意象，不淡化原文的严厉语境，也不把古代社会关系改写成现代制度用语。
