  text: Have mercy on the city of your sanctuary[a], Jerusalem[b], the place established for your dwelling.
translation:
  language: zh_hans
  text: 求你怜悯你圣洁的城[a]——耶路撒冷[b]，你居住的所在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文可直译作“你圣洁的城”，也可理解为“你的圣城”，或较具解释性地译为“你圣所之城”。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希腊文平行文本与此处差异很大，大意是催促人及时起身，赶快回家，不可拖延。因本节有希伯来文存留，正文依照希伯来文翻译，希腊文则作为文本异文列出。
    reason: textual_variant
lexical_decisions:
- source_word: רחם
  choice: 求你怜悯
  rationale: 这是祈求语气的命令式；加“求你”符合现代汉语祷告表达，“怜悯”保留慈悲施恩的含义。
- source_word: קרית קדשך
  choice: 你圣洁之城
  rationale: 较贴近字面的“你圣洁之城”，保留希伯来语属格表达的含混性，不径直限定为圣所所在之城。
- source_word: ירושלים
  choice: 耶路撒冷
  rationale: 采用现代简体中文通行地名译法。
- source_word: מכון שבתך
  choice: 那为你居住而设立的地方
  rationale: מכון表示固定、确立或设立之处，שבתך表示“你的居住”；此译既保留两个语义成分，也使现代汉语自然清楚。
theological_decisions:
- issue: 如何理解 קדשך 所表达的圣洁关系
  choice: 你圣洁之城
  alternative: 你的圣城；你圣所之城
  rationale: 原文可直译为“你圣洁之城”，既可能指城本身属于上帝、具有圣洁性质，也可能使人联想到其中的圣所。正文不把这种压缩表达过度具体化，其他理解列入脚注。
- issue: 希伯来文本与所给希腊平行文本明显不同
  choice: 正文依据现存希伯来文，译作对耶路撒冷的怜悯祈求
  alternative: 依据希腊文译作催促人及时起身回家的劝勉
  rationale: 本节有可信度较高的希伯来文本存留，应以其为正文依据；希腊平行文本内容迥异，作为文本异文如实注明，不作调和。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你怜悯”体现祷告语气；破折号明确“耶路撒冷”是前述城市的同位说明。避免使用过度古雅或宗派化措辞。
