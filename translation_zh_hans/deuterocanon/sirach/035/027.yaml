lexical_decisions:
- source_word: כן
  choice: 也是这样
  rationale: 承接上文的比拟或类比；现代汉语中“也是这样”自然地保留了希伯来语的格言式衔接。
- source_word: איש
  choice: 人
  rationale: 原文为阳性单数，但此处是格言中的代表性个体；汉语“人”既不增加性别解释，也比“男人”更符合自然表达。
- source_word: אשר לא קן
  choice: 没有巢的人
  rationale: 保留 קן“巢”的具体意象，不直接释作“没有家”；这种不寻常的简省结构也反映了现存希伯来文本的凝练。
- source_word: המרגיע
  choice: 歇息
  rationale: 按与安静、休息相关的分词理解，以“歇息”表达持续或惯常动作，同时避免对不确定的词形作过细限定。
- source_word: כאשר יערב
  choice: 夜幕在哪里降临
  rationale: יערב 可指天色转晚。结合无固定巢居的意象，以处所化表达传达人在夜晚临到之处便落脚；这一空间含义在希伯来短句中并非完全明说，故以脚注提示文本不确定性。
