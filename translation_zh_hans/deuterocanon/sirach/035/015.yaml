  yaml_path: translation/deuterocanon/sirach/035/015.yaml
  text: Hear the prayer of your servants[b][a], according to your favor toward your people.
translation:
  language: zh_hans
  text: 求你垂听你仆人的祷告，按你向你子民所怀的恩意[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按你对你子民的旨意。”希伯来语“רצון”既可指旨意，也可指恩惠、喜悦或悦纳；因这里说“向你子民”，正文采用“恩意”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行传统在本节的内容截然不同：“寻求律法的，必被律法充满；假冒为善的，必在其中跌倒。”这表明《便西拉智训》现存希伯来文本与希腊文本在此存在重大差异。
    reason: textual_variant
lexical_decisions:
- source_word: תשמע
  choice: 求你垂听
  rationale: 该未完成式在祈祷语境中带有祈愿、恳求意味；“求你”明示语用功能，“垂听”是现代汉语祷告中自然、庄重而不晦涩的表达。
- source_word: תפלת
  choice: 祷告
  rationale: 保留希伯来文单数，并与后接属格“你仆人的”自然组合。
- source_word: עבדיך
  choice: 你仆人的
  rationale: עבד可指奴隶或仆人；这里是对上帝祷告的用语，重点在敬奉与隶属关系，而非社会制度中的奴役，故译作“仆人”。复数意义由“仆人”在此集合性结构中表达。
- source_word: כרצונך
  choice: 按你……的恩意
  rationale: רצון可表示旨意、意愿、喜悦或恩惠；与后面的“对你子民”相连时，较可能指上帝向子民所持的善意或悦纳，因此以“恩意”表达，同时用脚注保留“旨意”这一真实可能。
- source_word: על
  choice: 对
  rationale: 在רצון与对象“你子民”之间，“对”最自然地表达面向某对象的态度；避免生硬直译为“在……之上”。
- source_word: עמך
  choice: 你子民
  rationale: “子民”自然保留该词在上帝与群体关系中的共同体色彩，又未额外限定其身份。
theological_decisions:
- issue: עבדיך在对上帝的祷告中如何表达
  choice: 你仆人的
  alternative: 你奴仆的／你奴隶的
  rationale: 本句强调祷告者对上帝的服事与归属，并非着重社会奴役身份；“仆人”既保留隶属意味，也符合现代汉语的敬虔语境。
- issue: כרצונך的语义
  choice: 按你对你子民的恩意
  alternative: 按你对你子民的旨意
  rationale: 原词兼有“旨意”和“恩惠、悦纳”之义。因其后接“对你子民”，正文采用较具关系性和善意色彩的“恩意”，但不排除“旨意”，故列入脚注。
- issue: 希伯来文本与希腊平行传统的重大差异
  choice: 以高可信度的希伯来文本为正文，并注明希腊异文
  alternative: 采用希腊文“寻求律法的，必被律法充满；假冒为善的，必因律法跌倒”
  rationale: 指定的希伯来来源在此完整且可信度高，应作为翻译正文；希腊传统内容完全不同，属于必须公开说明的重要文本分歧，不宜混入正文或擅自调和。
translation_notes:
  register: 采用现代、庄重、易懂的祷告语言。“求你垂听”准确传达祈愿语气；“恩意”较“恩宠”自然，也比单纯的“旨意”更能呈现上下文可能具有的善意色彩。正文保持简洁，不尝试调和希伯来与希腊传统。
