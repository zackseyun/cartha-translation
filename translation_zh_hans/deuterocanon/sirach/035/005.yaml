  text: Renew a sign and repeat a wonder[a]; glorify the hand and strengthen the arm and the right hand.
translation:
  language: zh_hans
  text: 求你再显一个记号，再行一件奇事[a]；使你的手显出威严，使你的膀臂和右手刚强有力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特版希腊文平行文本在这里与希伯来文差异很大，意为：“黄金饰物上的红玉髓印章，酒宴中音乐的和谐。”由于此处希伯来文见证尚存且可信度高，正文依照希伯来文翻译；此处注明希腊文的重大异文。
    reason: textual_variant
lexical_decisions:
- source_word: חדש
  choice: 重新显出
  rationale: 此命令式表达使某事重新出现或焕新；与“神迹”搭配时，“重新显出”比直译“更新”更符合现代汉语，同时不限定为单纯重复。
- source_word: אות
  choice: 神迹
  rationale: אות可指记号、征兆或彰显神能的神迹；本句祈求上帝再次施行大能，译作“神迹”自然，并与מופת形成传统的并列意象。
- source_word: ושנה
  choice: 再行
  rationale: שנה在此有重复、再次施行之意；“再行”简洁地保留“第二次/再次”的语义。
- source_word: מופת
  choice: 奇事
  rationale: מופת可指奇事、异兆或神奇作为；“奇事”既保留超凡行动的意味，也避免与אות同词重复。
- source_word: האדר
  choice: 彰显……的威荣
  rationale: 使役命令式含使之显为尊荣、威严之意；“彰显……的威荣”能表达公开展现威严，而非暗示受祈求者原先缺少荣耀。
- source_word: יד
  choice: 手
  rationale: 保留希伯来文以身体部位象征能力与作为的具体意象，不抽象化为“能力”。
- source_word: ואמץ
  choice: 使……刚强有力
  rationale: 动词表示使强壮、坚固；“使……刚强有力”在汉语中适合同时支配“膀臂和右手”。
- source_word: זרוע
  choice: 膀臂
  rationale: “膀臂”是庄重且可懂的圣经语体，保留主动施力的身体意象。
- source_word: וימין
  choice: 右手
  rationale: 原文明确指右手；直译保留其象征力量与得胜的传统意涵。
theological_decisions:
- issue: 对上帝能力的拟人化表达
  choice: 保留“手、膀臂、右手”的身体意象
  alternative: 概括译为“能力”或“大能”
  rationale: 原文用身体部位描绘上帝的行动与能力；保留这些意象可保存经文的具体性和神学张力，避免释义性弱化。
- issue: “彰显你手的威荣”是否暗示上帝获得更多荣耀
  choice: 译为彰显其手本有的威荣
  alternative: 译为“使你的手得荣耀”或“荣耀你的手”
  rationale: האדר可表达使之显为威严；“彰显”强调威荣被公开显明，不必推断上帝原先有所欠缺。
- issue: 希腊平行文本与希伯来文本严重不同
  choice: 以现存且高可信度的希伯来文为正文，并以脚注注明希腊异文
  alternative: 按希腊文关于红宝石印章、黄金饰物和酒宴音乐的比喻翻译
  rationale: 本节希伯来见证现存且标为高可信度，故应优先采用；希腊文反映重大平行异文，不宜混入正文。
translation_notes:
  register: 采用现代、庄重而可朗读的祈求语体。开头补出“求你”，以自然呈现连续命令式在祷告中的语用功能；不增加明确主语名称。保留“手—膀臂—右手”的希伯来诗性并列，并以“威荣”“刚强有力”避免生硬直译。
