base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/030.yaml
  text: For it is better that your children should beg from you than that you should look to the hands of your sons[a][b].
translation:
  language: zh_hans
  text: 因为你的儿女向你求助[a]，总比你指望你儿子们的双手[b]要好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求助”也可译作“恳求”或“哀求”；希腊语动词指迫切地请求，不一定含有沿街乞讨的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译为“望向你儿子们的手”，意指依赖他们给予供养或帮助。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: 总比……要好
  rationale: 表达比较性的价值判断，并以现代汉语自然呈现原文“较好”的结构。
- source_word: τέκνα
  choice: 儿女
  rationale: τέκνα泛指子女，范围宽于后文特指男性后代的υἱῶν；“儿女”可保留这一区别。
- source_word: δεηθῆναί
  choice: 向你求助
  rationale: δέομαι可指恳求、请求；语境涉及生活供给和依靠。“求助”传达有需要而请求，又避免“乞讨”在现代汉语中过强的贬义。[a]
- source_word: ἐμβλέπειν
  choice: 指望
  rationale: 该词本义为“看、望向”，与εἰς χεῖρας连用时表达期待他人供给或帮助；“指望”自然地传达这一语用含义。
- source_word: εἰς χεῖρας
  choice: ……的手
  rationale: 保留原文具体的“手”这一意象，不直接释为“供养”，以免消除原文的形象表达。[b]
- source_word: υἱῶν
  choice: 儿子们
  rationale: υἱῶν特指儿子，与前文较宽泛的τέκνα形成词义范围上的区别。
theological_decisions:
- issue: τέκνα与υἱῶν之间的性别及范围区别
  choice: 将τέκνα译为“儿女”，将υἱῶν译为“儿子们”
  alternative: 两处都译为“儿女”或“孩子”
  rationale: 原文先用泛指子女的词，后用特指儿子的词。保留差异更忠实，也不把原文的性别表达一般化。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“指望……的手”刻意保留希腊文的身体意象，同时用脚注说明其依赖供养的含义；“儿女／儿子们”保留原文τέκνα／υἱῶν的范围区别。
