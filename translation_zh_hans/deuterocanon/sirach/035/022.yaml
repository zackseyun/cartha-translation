  text: Any wound a living creature may heal[b][a], but there is pain worse than pain.
translation:
  language: zh_hans
  text: 任何创伤，活物都可能使其痊愈[a][b]；但有一种痛，比另一种痛更难忍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希伯来文艰涩，部分文字很可能已经讹损。前半句逐字近似“任何创伤，活物都吃／吞食”；后半句较直译则近似“有一击从／胜过一击……”。正文按可能的整体意思译出。
    reason: textual_variant
  - marker: b
    text: 斯威特本的希腊文平行文本作：“也要提防你的儿女。”这与现存希伯来文差异很大，可能反映了另一种文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: כל
  choice: 任何
  rationale: 按分配意义理解，用“任何”引出概括性的箴言，比“所有”更符合现代汉语表达。
- source_word: נכה
  choice: 创伤
  rationale: 该词指遭击打所受的伤害；“创伤”既可表达身体上的伤，也能保留较宽的语义范围。
- source_word: תאכל חיה
  choice: 活物都可能痊愈
  rationale: 现存希伯来文逐字近似“活物吃/吞食”，语义十分困难，文本也可能受损。正文依上下文表达伤势可以复原的可能含义，同时在脚注中明确其不确定性，不把这一解释伪装成确定的直译。
- source_word: אך
  choice: 但
  rationale: 保留箴言从一般情形转向更严重例外的转折。
- source_word: מכה ממכה
  choice: 一种痛，胜过另一种痛
  rationale: מן按比较意义处理；以“一种……另一种……”保留原文重复而避免生硬。מכה本可指击打、伤口或伤痛，此处取“痛”以传达比较的严重程度。
- source_word: תנעם
  choice: 胜过
  rationale: 该词形在现存文本中意义不明，可能已有讹损。依据句式和上下文取比较义，但不进一步限定究竟是更痛、更重还是更难忍。
