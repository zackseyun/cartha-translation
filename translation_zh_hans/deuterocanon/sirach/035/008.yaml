  text: Sum up your speech[a]; in few words say much[b]. Be like one who knows and yet keeps silent.
translation:
  language: zh_hans
  text: 说话要抓住要点[a]；用寥寥数语，说出许多意思[b]。要像一个有见识、又能保持沉默的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节现存的希伯来文有几处难解，似乎部分残损；前两句尤其参照希腊文平行文本，以恢复较可能的原意。
    reason: textual_variant
  - marker: b
    text: 希腊文直译为“在少数之中，有许多”，是指用很少的话表达很多意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: השבת ראש
  choice: 概括
  rationale: 现存希伯来文本难解；结合希腊文 κεφαλαίωσον（归纳、概括），这里指把话归结到要点，而非照字面译作“使头返回”。
- source_word: פאתי
  choice: 你的话
  rationale: 希伯来文传本此处可能残损，字面或可涉及“边缘”；希腊平行文本作 λόγον（话、言语），因此按较可恢复的语义译为“你的话”。
- source_word: ἐν ὀλίγοις πολλά
  choice: 寥寥数语，要表达丰富的意思
  rationale: 希腊文直译近于“在少数之中有许多”，是以少言表达多意的简练说法；此译在现代汉语中自然，并保留劝人言简意赅的含义。
- source_word: γίνου ὡς γινώσκων
  choice: 要像一个明白事理的人
  rationale: 希伯来文后半句与希腊文差异很大且难以成立；希腊文清楚表达“要像一个知道的人”，译作“明白事理”较符合汉语智慧文学语体。
- source_word: ἅμα σιωπῶν
  choice: 却仍保持沉默
  rationale: ἅμα 表示同时并存；“却仍”凸显有知识而能缄默的张力，同时没有把沉默绝对化。
