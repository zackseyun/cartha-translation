  text: Give the recompense of those who wait for you[b][a], and let your prophets be found faithful.
translation:
  language: zh_hans
  text: 求你赐给等候你的人报偿[a][b]，使你的先知显为可信。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候你”也可译作“仰望你”；希伯来语动词兼有等候和怀着盼望信靠的意思。
    reason: lexical_alternative
  - marker: b
    text: 希腊文见证在这里差异很大，意为：“敬畏主的人必领受教导，清早寻求他的人必得着恩惠。”这可能反映了不同的文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: תן
  choice: 求你赐下
  rationale: נתן的祈使式在这里是向上帝发出的直接祈求；加上“求你”符合现代汉语祷告语体，“赐下”保留由上而下施予的意味。
- source_word: פעלת
  choice: 报偿
  rationale: פעלה本可指“工作、行为、成果”，但在此与等候上帝的人相连，较可能指上帝为他们施行的回报。“报偿”既能表达应得或获赐的结果，也不过度限定为物质奖赏。
- source_word: קוויך
  choice: 等候你之人
  rationale: קוה兼有等候与盼望之意；正文采用“等候你”保存其期待性的时间意味，并在脚注保留“仰望你”的可能。
- source_word: ונביאיך
  choice: 你的先知
  rationale: 按希伯来文附属结构及第二人称后缀直译；连词在汉语中由后半句句法自然体现。
- source_word: יאמנו
  choice: 得以证实
  rationale: אמן在此可表示被确认可靠、应验为真或显为可信。“得以证实”主要表达先知及其话语获得验证，同时避免把含义收窄为个人品格上的“忠信”。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本显著不同
  choice: 正文以现存希伯来文的祈求为准：“求你赐下等候你之人的报偿……使你的先知得以证实。”
  alternative: 希腊文意为：“敬畏主的人必领受教导，清早寻求他的人必蒙悦纳。”
  rationale: 本节有高可信度的希伯来文见证，因此正文优先依据希伯来文。希腊文并非紧密对应，可能代表不同文本形态，故以脚注完整提示，不将两者混合。
- issue: יאמנו所表达的先知获验证之含义
  choice: 得以证实
  alternative: 显为忠信／被人相信
  rationale: 该词形允许“被确认、显为可信、被相信”等相近理解；正文保留验证和兑现的张力，不把它专门解释为先知个人的忠诚，也不限定为听众主观相信。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你赐下”体现祷告语气；“报偿”较“奖赏”正式，又不预设物质内容；“得以证实”保留先知及其宣告最终获验证的开放性。脚注标记均置于相关正文之后。
