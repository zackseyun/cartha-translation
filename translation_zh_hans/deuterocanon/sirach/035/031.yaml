  text: In all your works be preeminent[a]; do not give a blemish to your honor.
translation:
  language: zh_hans
  text: 凡你所做的，都要出类拔萃；不要使你的荣誉蒙上污点[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荣誉”也可译作“名声”；希腊文直译为“荣耀”。
    reason: 保留δόξα在“荣誉、名声、荣耀”之间的词义幅度，并说明正文依据语境所作的选择。
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: 凡你所做的
  rationale: 按现代汉语习惯表达“在你一切的作为中”，完整保留范围，也比直译“在你所有的工作中”更自然。
- source_word: γίνου
  choice: 要
  rationale: 此处为劝勉性的命令，汉语用“要”自然传达持续持守某种品格或表现的要求；不译作“成为”，以免过分强调变化过程。
- source_word: ὑπεράγων
  choice: 卓越超群
  rationale: 该词含超越、胜出的意味。“卓越超群”既保留比较性的力度，又适合智慧文学庄重而通俗的语体。
- source_word: μὴ δῷς μῶμον
  choice: 不要让……蒙上污点
  rationale: 希腊文直译近于“不要给……瑕疵”。此处采用自然的汉语搭配，同时保留“污点/瑕疵”的具体比喻和受责难之意。
- source_word: ἐν τῇ δόξῃ σου
  choice: 你的荣誉
  rationale: δόξα在此伦理与社会声望的语境中宜理解为荣誉或名声，而非神学意义较强的“荣耀”。“荣誉”保留原词的尊荣意味；“名声”作为可能译法列入脚注。
theological_decisions:
- issue: 智慧伦理语境中δόξα的含义
  choice: 荣誉
  alternative: 名声；直译“荣耀”
  rationale: 本节劝人行事卓越，不使个人的社会尊荣受损。“荣誉”符合语境，又不把本来可能涵盖名声的词义收窄为某种特定教义概念；脚注保留其词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“卓越超群”传达ὑπεράγων的超越意味；后半句用“蒙上污点”形成自然汉语搭配，并保留原文的瑕疵比喻。
