  text: On the day the days of your life are completed[a], and at the time of your death, distribute your inheritance.
translation:
  language: zh_hans
  text: 在你一生的日子满了的那一天[a]，在你死亡之时，要分配你的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你一生结束时。”希腊文直译为“在你一生的日子满了的那一天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: 在……的那一天
  rationale: ἐν加时间性与格表示时间；此处保留具体的“那一天”，同时使汉语自然。
- source_word: συντελείας
  choice: 满了
  rationale: 该词表示完成、终结；“满了”既保留生命日数走到尽头的意象，也符合庄重而通俗的现代汉语。
- source_word: ἡμερῶν ζωῆς σου
  choice: 你一生的日子
  rationale: 直译为“你生命的日子”；“你一生的日子”保留原文“日子”的复现，又较为自然。
- source_word: καιρῷ τελευτῆς
  choice: 你死亡的时候
  rationale: καιρός指时候，τελευτή在遗产处置的语境中自然指死亡；不以“离世”等委婉语弱化原文。
- source_word: διάδος
  choice: 要分配
  rationale: 不定过去时命令式要求实行给予或分派；与产业搭配时，“分配”准确表达有意的划分。
- source_word: κληρονομίαν
  choice: 你的产业
  rationale: 该词可指继承的财产或产业。希腊文无冠词，但语境明确是受劝者所拥有、将由继承人承受的产业；汉语补出“你的”可清楚表达关系而不增加实质内容。
theological_decisions:
- issue: τελευτή应译作一般性的“终了”还是明确的“死亡”
  choice: 死亡
  alternative: 终了；离世
  rationale: 该词虽可泛指终结，但在分配产业的上下文中明确涉及生命结束；“死亡”保留劝诫的直接性，不额外引入神学解释。
- issue: συντελείας ἡμερῶν ζωῆς σου是否化约为“一生结束”
  choice: 保留“你一生的日子满了”
  alternative: 在你一生结束时
  rationale: 原文特意使用“日子完成”的表达。正文保留这一意象，并用脚注给出自然的意义表达，以保存原文措辞及其张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“在……的那一天”保留原文具体时间表达；“满了”保留日数完成的意象；“要分配你的产业”用直接命令语气传达劝诫。
