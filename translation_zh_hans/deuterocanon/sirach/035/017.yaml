  text: The throat eats every kind of food[b][a], but one kind of food is more pleasant than another.
translation:
  language: zh_hans
  text: 咽喉吞下各样食物[a][b]，但有的食物比别的更可口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文是一句简短的箴言，措辞略显生硬。希腊文平行文本的内容大不相同：“有罪的人必躲避责备，并按自己的意愿得着判决（或：辩词）。”这可能反映了不同的底本，也可能说明希伯来文传承中出现了文本讹乱。
    reason: textual_variant
  - marker: b
    text: “咽喉”也可译作“喉咙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כל מאכל
  choice: 什么食物都
  rationale: 概括性表达，保留希伯来文的普遍含义，同时符合现代汉语谚语式说法。
- source_word: אוכל
  choice: 吃
  rationale: 采用普通、直接的动词，不额外引入“吞食”等较强语气。
- source_word: גרגרת
  choice: 喉咙
  rationale: 指接受食物的喉部或咽喉；“喉咙”通俗自然，“咽喉”可作备选。
- source_word: אך
  choice: 但
  rationale: 标示前后对照，简洁保留原文转折。
- source_word: אכל / מאכל
  choice: 食物
  rationale: 两者在此均指所吃之物；统一译为“食物”可保留平行关系，避免制造原文未必具有的区别。
- source_word: נעים
  choice: 可口
  rationale: 在食物语境中自然表达“令人愉悦、合意”；结合对照关系，用“比别的可口”呈现隐含的比较意味。
theological_decisions:
- issue: 希伯来文与希腊文平行文本差异
  choice: 正文依据高可信度的希伯来文，保留其关于食物的箴言
  alternative: 依希腊文译为罪人躲避责备、随己意寻找判断或辩词
  rationale: 指定的希伯来文来源置信度高且已验证；希腊文内容差异显著，应以文本异文脚注说明，不应混入正文或调和两者。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文维持简短的箴言节奏，以“什么食物都吃”表达普遍性，并用“有的……比别的……”自然呈现原文对照中隐含的比较关系。脚注标记均置于正文相关词句之后。
