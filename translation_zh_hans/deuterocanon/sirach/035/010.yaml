  yaml_path: translation/deuterocanon/sirach/035/010.yaml
  text: Have mercy on the people called by your name[a], on Israel, your firstborn[c][b], whom you acquired.
translation:
  language: zh_hans
  text: 求你怜悯那奉你名被称呼的子民[a]，就是以色列——你的长子、你所获得的子民[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“承受你名的子民”。这是希伯来语表示归属的习语，指这子民因奉你的名而被认定属于你。
    reason: lexical_alternative
  - marker: b
    text: “你所获得的”也可译作“你所拥有的”“你所购得的”，或可能作“你所创造的”。希伯来文动词可有这些相近含义。
    reason: alternative_reading
  - marker: c
    text: 现存希腊文平行文本在此处是一句内容显著不同的话，反映另一文本传统；本译文依照现存希伯来文见证。
    reason: textual_variant
lexical_decisions:
- source_word: רַחֵם
  choice: 求你怜悯
  rationale: 这是祈求中的命令式；“求你怜悯”符合现代汉语祷告语体，既自然又庄重。
- source_word: עַל־עָם
  choice: 那……的子民
  rationale: עם是集合名词，指一个民族或群体。译作“子民”能自然表达其与上帝的关系，但不直接增添原文没有的“你的”。
- source_word: נִקְרָא בִּשְׁמֶךָ
  choice: 称为你名下的
  rationale: 保留希伯来语“以某人的名被称呼”的归属表达；“名下”在现代汉语中可清楚传达被上帝之名标识、归属于他的含义。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按通行中文圣经人名译法处理专名。
- source_word: בְּכוֹר
  choice: 你称为长子的
  rationale: בכור意为“长子／头生的”。原文短语“以色列，长子，你称……”较为紧缩；结合כנה“称为、命名”，译为“你称为长子的”可在汉语中保留以色列被称作长子的关系，又不补入“儿子”。
- source_word: כִּנִּיתָה
  choice: 你称为
  rationale: 按所给希伯来文本的辅音与句法，末词是כנה的第二人称单数完成式，意为“你称呼／命名”，并非קנה“取得”。因此将其与“长子”连读为“你称为长子的”。
theological_decisions:
- issue: “称为你名下”所表达的圣约归属
  choice: 保留以神之名被称呼的希伯来语意象
  alternative: 直译为“属于你的子民”
  rationale: 原文以“名”表达身份与归属；保留这一意象能维持经文的圣约色彩，不把它简化为一般所有关系。
- issue: בכור כניתה的句法与意义
  choice: 理解为“你称为长子的”
  alternative: 依英语咨询层作“你的长子，是你所得的”
  rationale: 用户提供的希伯来正文为בכור כניתה，其中כנה意为“称呼、命名”；若作“所得的”，须假定不同的希伯来词קניתה。原语言证据应优先，故正文按现存希伯来文翻译，并以脚注说明差异。
- issue: “长子”的关系含义
  choice: 保留“长子”而不解释为“最蒙爱”或“居首位”
  alternative: 意译为“你所拣选、居首位的子民”
  rationale: “长子”可能兼具亲属、地位与拣选意涵；直保留该称谓可避免替文本消解神学张力。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语体。首句重复“怜悯”使两个并列对象在中文中清楚；破折号标明“以色列”与“子民”同位，并将紧缩的希伯来短语自然展开。
