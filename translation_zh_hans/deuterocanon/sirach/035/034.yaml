  text: Put a child to work[a], and you will find rest; leave his hands idle, and he will seek freedom.
translation:
  language: zh_hans
  text: 要让童仆做工[a]，你就会得享安歇；松开他的双手，他就会寻求自由。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “童仆”译自希腊语παιδί；该词也可泛指孩子或少年，但在本段有关家役的语境中，很可能指年轻仆役。“松开他的双手”直译保留原文意象，指放松对他的管束、任其闲散或不让他做工。
    reason: 说明παιδί的语义范围及其在上下文中较可能的家役含义，并解释“手”的惯用意象。
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: 要使孩子做工
  rationale: 原文结构简约，直译近于“在孩子身上做工”或“与孩子一同做工”，但在这则训诫的平行结构中，实际意思是让孩子从事劳动、不要闲着。“使孩子做工”既自然，也保留命令语气。
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: 你就会得到安歇
  rationale: ἀνάπαυσις可指休息、安歇或轻省；“得到安歇”符合格言式的结果表达，也保留原文较庄重的语气。
- source_word: ἄνες χεῖρας αὐτῷ
  choice: 若放松他的双手
  rationale: ἄνες是“松开、放松、任其松弛”的命令式，χεῖρας为“双手”。译文保留原文的具体意象；其语境含义是任其闲散、不加约束。
- source_word: ζητήσει ἐλευθερίαν
  choice: 他就会寻求自由
  rationale: ἐλευθερία的直接含义是“自由”。这里指摆脱家中管束或劳动约束，但不宜直接改译为“任性”等解释性词语，以免消除原文的社会伦理张力。
theological_decisions:
- issue: παιδί所指是孩子还是少年仆役
  choice: 孩子
  alternative: 少年仆役／童仆
  rationale: παιδί通常可指孩子，也可能在家庭语境中指年轻仆役。现有句子本身不足以确定仆役身份，因此正文采用较基本的“孩子”，并在脚注交代另一可能。
- issue: ἐλευθερία在家庭管教语境中的伦理含义
  choice: 自由
  alternative: 放纵／自行其是／摆脱管束
  rationale: 保留“自由”可忠实呈现希腊词义及原文的张力；不把古代家庭秩序中的评价直接改写成现代政治自由，也不以带有定罪色彩的词替代原词。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。正文保留“双手”和“自由”的原文意象，不把隐含意义过度明说；以脚注呈现παιδί及ἔργασαι ἐν παιδί的真实歧义。
