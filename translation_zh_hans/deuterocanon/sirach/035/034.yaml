  source_fidelity: 需修订。παιδί本身可指儿童，也可指少年仆役；但本节所在的奴仆／家役训诫语境使“仆人”（尤其是年轻仆役）远较单纯“孩子”可信。正文译作“孩子”会把这则古代家役训诫改造成一般育儿劝诫，脚注虽提及仆役的可能，仍不足以消除正文的误导。ἐλευθερία宜保留为“自由”。
