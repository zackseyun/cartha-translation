translation:
  language: zh_hans
  text: 谁会信赖一支从一座城跃到另一座城的武装部队[a]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希腊文平行文本与本句完全不同：“你们要明白，我劳苦不只是为自己，也是为所有寻求训诲的人。”因此，这里以希伯来文见证为正文依据。
    reason: textual_variant
lexical_decisions:
- source_word: מי
  choice: 谁会
  rationale: 疑问代词引出带有格言意味的反问；“谁会”在现代汉语中自然体现这种语气。
- source_word: יאמין
  choice: 信赖
  rationale: אמן 的使役词干在此表示把信任或信心寄托于某对象，并非只是相信某个命题。
- source_word: בגדוד צבא
  choice: 一支军队
  rationale: גדוד 指部队、队伍或武装团伙，צבא 明确其军事性质；译作“一支军队”符合现代汉语量词搭配，也保留军事含义。
- source_word: המדלג
  choice: 跃
  rationale: דלג 的本义是跳跃、跃过；此处保留鲜明的动态意象，不将其解释性地弱化为普通的“转移”。
- source_word: מעיר אל עיר
  choice: 从这城到那城
  rationale: 自然表达在各城之间不断移动，同时对应希伯来语“从城到城”的结构。
theological_decisions:
- issue: 本节希伯来文见证与所给希腊文平行文本内容完全不同
  choice: 正文以现存希伯来文为准，并以脚注说明希腊文异文
  alternative: 采用希腊文：“你们要明白，我劳苦不只是为自己，也是为所有寻求教导的人。”
  rationale: 《便西拉智训》有希伯来文存世时应优先从希伯来文翻译；两种文本无法调和，因此不在正文中混合，而如实保留文本差异。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“从这城跃到那城”保留原文跳跃式移动的生动意象；脚注明示重大的文本差异，不加以调和。
