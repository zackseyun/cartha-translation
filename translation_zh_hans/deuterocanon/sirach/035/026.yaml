  naturalness: “从这城跃到那城的军队”虽可理解，但“这城／那城”增添了原文没有的指示意味，且修饰语较为生硬。改为“从一座城跃到另一座城的武装部队”更自然，也更贴近原文的重复移动。
  terminology: “信赖”恰当。“武装部队”兼顾גדוד的队伍义和צבא的军事限定，不将其过度扩大为“军队”。脚注中的“训诲”较“教导”更适合对应παιδείαν，并维持本书的智慧训诲语域。
