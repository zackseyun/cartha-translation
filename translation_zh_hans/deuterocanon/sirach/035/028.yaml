  yaml_path: translation/deuterocanon/sirach/035/028.yaml
  text: Do not give authority over yourself in your lifetime to son or wife[a], brother or friend; and do not give your property to another, lest you regret it and have to ask for it back.
translation:
  language: zh_hans
  text: 你活着的时候，不要把支配自己的权力交给儿子、妻子、兄弟或朋友；也不要把你的财物交给别人，免得后悔而不得不为这些财物求人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得后悔以后，为这些财物陷入缺乏（或不得不为此恳求）。”希腊语末句较为简略；δέῃ περὶ αὐτῶν也可较直译为“为这些财物而有需要”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σὲ
  choice: 不要把管辖你的权柄交给
  rationale: 保留“给予权柄”的具体结构；ἐπὶ σὲ在这里表示权柄施加于本人，即让别人管辖自己。
- source_word: ἐν ζωῇ σου
  choice: 你活着的时候
  rationale: 自然、清楚地表达“在你一生之中、尚在人世时”的时间含义。
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: 儿子、妻子、兄弟或朋友
  rationale: 这些与格名词列举亲近之人；在否定劝诫中用“或”连接，符合现代汉语习惯，不额外补入原文没有明说的物主代词。
- source_word: τὰ χρήματά σου
  choice: 你的财物
  rationale: χρήματα可指钱财或较广义的财产；“财物”兼顾两者，且不显得法律化。
- source_word: ἑτέρῳ
  choice: 别人
  rationale: 简明表达另一个人或他人，符合上下文。
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: 免得日后后悔
  rationale: μεταμέλομαι表示事后的懊悔；加入“日后”自然呈现行动后的结果，而不改变意义。
- source_word: δέῃ περὶ αὐτῶν
  choice: 还得向他们讨回来
  rationale: 结合把财物交给别人的语境，表达后来不得不为这些财物向受赠者索求；同时以脚注保留希腊语压缩句式可能具有的较宽泛含义。
