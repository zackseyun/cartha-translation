  naturalness: “把支配自己的权力交给”是现代标准汉语中更自然、明确的表达。“为这些财物求人”既通顺，也保留原文未说明请求对象和具体请求方式的余地。
  terminology: “权力”可自然对应ἐξουσία；“财物”恰当涵盖χρήματα的金钱及财产含义。保留“儿子、妻子、兄弟或朋友”，不擅加物主代词或冠词。
