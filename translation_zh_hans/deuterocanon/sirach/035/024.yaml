  text: And again[a], if there is healing for the tongue[b], it is not among human beings.
translation:
  language: zh_hans
  text: 凡信靠律法的人，都留心诫命；凡信靠主的人，必不会被减损。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文抄本的这一行似乎与本节不相对应，或已有错置、讹损。正文因此依据内容连贯的希腊文本翻译；希腊文直译为：“信靠律法的人留心诫命，信靠主的人必不被减损。”
    reason: textual_variant
  - marker: b
    text: “不会被减损”也可译作“不会被降低”或“不致缺乏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: 凡信靠……的人
  rationale: πιστεύω在两处都强调倚靠、信赖；“信靠”比单纯的“相信”更能表达这种关系性的倚赖，同时保留两分句的平行结构。
- source_word: νόμῳ
  choice: 律法
  rationale: 在《便西拉智训》的犹太智慧传统中，νόμος指上帝所赐的律法，即妥拉；“律法”是现代中文圣经语境中清楚而自然的对应词。
- source_word: προσέχει
  choice: 留心
  rationale: προσέχω表示注意、专心听从；“留心”保留其注意和重视之意，没有将其强化为已经完全“遵守”。
- source_word: ἐντολαῖς
  choice: 诫命
  rationale: “诫命”准确传达宗教伦理语境中的命令，并与“律法”自然搭配。
- source_word: Κυρίῳ
  choice: 主
  rationale: 此处κύριος指上帝；译为“主”符合希腊文本及现代中文圣经的通行表达。
- source_word: οὐκ ἐλαττωθήσεται
  choice: 必不致衰微
  rationale: ἐλαττόω的被动形式可表示被减损、降低或变得不足；“不致衰微”保留这种较宽泛的减损含义，不武断限定为物质上的缺乏。
theological_decisions:
- issue: 现存希伯来文行与本节的希腊平行文本实质不对应，可能错置或讹损。
  choice: 正文依据连贯且与本节编号相符的希腊平行文本翻译，并在脚注中说明希伯来文见证的问题。
  alternative: 按现存希伯来文行译作类似“再者，舌头若有医治之法，世人中也没有这样的人”。
  rationale: 所给希伯来文与希腊本内容完全不同，且资料明确标为不匹配；希腊文本则语义完整、平行结构清楚。采用希腊文本能避免把疑似错置的希伯来文误作本节正文，同时如实披露文本不确定性。
- issue: οὐκ ἐλαττωθήσεται所指的减损性质并不明确。
  choice: 译作“必不致衰微”，保留可能涵盖被贬低、受减损或陷入不足的开放含义。
  alternative: “必不缺乏”或“必不被降卑”。
  rationale: 原文没有明确限定减损发生在物质、地位或其他层面，因此不宜以较具体的译法消除其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两个“凡信靠……的人”保持希腊原文的平行句式；“都”和“必”使中文关系清晰，但不把“留心”过度解释为完全遵守，也不把末句限定为物质丰足。
