base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/003.yaml
  text: Speak, elder, for it is fitting for you—yet with accurate knowledge, and do not hinder the music.[b][a]
translation:
  language: zh_hans
  text: 长者啊，你要说话，因为这与你相称；要凭确切的知识，也不要妨碍音乐演奏。[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里提供的主要希伯来文见证似乎与本节不相符，因此本译文以希腊文平行文本为主要依据。
    reason: textual_variant
  - marker: b
    text: “不要妨碍音乐演奏”也可译作“不要打断音乐表演”。希腊文可泛指音乐活动或演出过程，而不只是抽象意义上的音乐。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λάλησον
  choice: 你要说话
  rationale: 直译命令语气，表达在宴席场合受邀发言，现代汉语自然明确。
- source_word: πρεσβύτερε
  choice: 长者啊
  rationale: 保留呼格以及对年长者或资深者的尊称，不窄化为职分意义上的“长老”。
- source_word: πρέπει γάρ σοι
  choice: 因为这与你相称
  rationale: 表达合宜、得体之意，并保留第二人称所指。
- source_word: ἐν ἀκριβεῖ ἐπιστήμῃ
  choice: 要凭确切的知识
  rationale: 兼顾 ἀκριβής 的准确、严谨含义和 ἐπιστήμη 的知识、见识含义，不把它弱化为一般性的“明智”。
- source_word: μὴ ἐμποδίσῃς
  choice: 不要妨碍
  rationale: 保留“阻碍、妨害”的宽泛语义；在语境中也可能指不要打断或扰乱。
- source_word: μουσικά
  choice: 音乐演奏
  rationale: 中性复数可指音乐之事或音乐表演；“音乐演奏”比抽象的“音乐”更贴合宴席活动语境，同时避免限定为音乐家本人。
