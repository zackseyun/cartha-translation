review_pass:
  verdict: revise
  source_fidelity: 需修订。草稿完全依希腊文平行文本翻译，但所给的主要希伯来文文本（尽管标有 minor_mismatch）内容显然不同。按来源优先原则，正文应反映希伯来文的“在他们眼前／借着我们”“显为圣洁／得荣耀”的对应结构；不可将不相干的希腊文宴席训诫作为正文。
  naturalness: 草稿中文本身通顺庄重，但其内容不对应主要来源。修订正文采用自然的祈愿式现代汉语，并保留原文重复“借着我们”所造成的不寻常表达。
  terminology: “显为圣洁”对应 נקדשת，避免将其仅泛化为“受尊敬”；“得荣耀”对应 הכבד，保留神圣尊荣的语域。“在……眼前”对应 לעיני。
  issues:
  - severity: high
    issue: 正文采用了与主要希伯来文来源不对应的希腊文平行文本。
    rationale: 希伯来文说的是神借着“我们”在“他们眼前”显为圣洁、并在“我们眼前”得荣耀；草稿则是对长者说话和不妨碍音乐。即使该希伯来文见证与通常节号可能不符，任务要求先依原语来源审校。
  - severity: medium
    issue: 脚注 a 以文本不相符为由，将希腊文作为正文的主要依据。
    rationale: 应说明节号或文本对应关系存在疑问，并透明指出希腊文平行文本内容不同；但不能据此取代所提供的主要希伯来文正文。
  - severity: medium
    issue: 脚注 b 及其锚点服务于未采用的希腊文“音乐”译法。
    rationale: 修订后的希伯来文正文没有 μουσικά，故该脚注必须删除。
  revised_text: 正如你借着我们在他们眼前显为圣洁，愿你也借着我们在我们眼前得荣耀。[a]
  revised_footnotes:
  - marker: a
    text: 所提供的希伯来文见证与此节通常所对应的希腊文平行文本内容不一致。此处按所提供的希伯来文翻译；该希伯来文两分句均读作“借着我们”，因此译文保留这一重复。希腊文平行文本则为对一位长者发言及不要妨碍音乐的劝告。
    reason: textual_variant
  revision_rationale: 将正文改为忠实反映所给高置信度希伯来文：保留“正如……愿也……”的平行祈愿结构、“在他们眼前／在我们眼前”的视域对照，以及两处 בנו（“借着我们”）的重复。脚注说明该见证与希腊文平行文本的严重内容差异，而不以平行文本替换主要来源。
