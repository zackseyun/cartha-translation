  yaml_path: translation/deuterocanon/sirach/035/033.yaml
  text: Fodder and a stick and loads are for a donkey[c][b][a]; bread and discipline and work are for a servant.
translation:
  language: zh_hans
  text: 草料、棍子和重担，是给驴的；饼、管教和劳作，是给家奴的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “管教”也可译作“教导”或“训练”；“家奴”原文特指家中的奴隶或家仆。
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: 草料
  rationale: 指供牲畜吃饱的饲料；“草料”符合驴的语境，也自然简洁。
- source_word: ῥάβδος
  choice: 棍子
  rationale: 可指棍、杖或棒；此处与管理驴有关，“棍子”具体自然，同时不额外强化正式惩戒意味。
- source_word: φορτία
  choice: 驮载
  rationale: 指让役畜背负的载荷；“驮载”明确表达驴所负载的东西，并保留复数概括意义。
- source_word: ὄνῳ
  choice: 给驴的
  rationale: 与格在省略系词的名词句中表达归属或适用对象；译作“给驴的”符合汉语并保留原句结构。
- source_word: ἄρτος
  choice: 饼
  rationale: 原词具体指饼或面包；古代语境中译作“饼”比泛化为“食物”更贴近原文。
- source_word: παιδεία
  choice: 管教
  rationale: 兼有训练、教导、纠正和纪律约束之意；在家奴与劳作的语境中，“管教”较好保留其实际约束与训练的力度。
- source_word: ἔργον
  choice: 劳作
  rationale: 指工作、劳动；“劳作”与家内劳动语境相合，也保持格言式表达的庄重。
- source_word: οἰκέτῃ
  choice: 家奴
  rationale: 特指家中的奴隶或仆役；“家奴”既准确表达其家庭隶属身份，也避免用“仆人”淡化原文中的社会不对等。
theological_decisions:
- issue: 智慧格言中 οἰκέτῃ 的身份表达
  choice: 家奴
  alternative: 仆人／家仆
  rationale: 原词具体指家庭中的奴隶或隶属仆役。此处不应把受支配的身份柔化为一般雇佣仆人；“家奴”在现代中文中简洁而明确。
- issue: παιδεία 的语义力度
  choice: 管教
  alternative: 教导／训练／惩戒
  rationale: 该词兼具教育、训练和纠正意味。译作“管教”保留这些张力，不把它缩窄为纯粹知识教导，也不强化为单纯体罚。
translation_notes:
  register: 采用简洁、对称的格言体，以两个并列分句重现希腊文结构。用词现代而庄重；“驮载”略带书面色彩，但能准确表达役畜所背负的载荷。
