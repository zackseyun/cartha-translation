  yaml_path: translation/deuterocanon/sirach/035/023.yaml
  text: A woman’s beauty brightens the face[a], and it surpasses every delight of the eye.
translation:
  language: zh_hans
  text: 女子的美貌使人容光焕发[a]，胜过一切悦目的事物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的读法大不相同：“无论做什么事，都要信赖自己的心，因为这也是遵守诫命。”
    reason: alternative_reading
lexical_decisions:
- source_word: תאר
  choice: 美貌
  rationale: 该词指外在形貌或秀美；与“女子”连用时译作“美貌”，既自然，也不局限于身材。
- source_word: יחליץ פנים
  choice: 使人容光焕发
  rationale: 这是含义较难确定的表达，似指使面容显出积极、鲜明的变化。“使人容光焕发”保留其对面容的振奋效果，同时避免把具体机制说得过死。
- source_word: מחמד עין
  choice: 悦目的事物
  rationale: 该短语字面指眼睛所喜爱、所珍视的对象；“悦目的事物”兼顾视觉吸引力和可喜爱性。
- source_word: יגבר
  choice: 胜过
  rationale: 动词本义为强盛、占优势；在比较性的诗句中，“胜过”自然表达其优越之意。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本差异显著
  choice: 正文依据现存希伯来文翻译，并以脚注列出希腊文异读。
  alternative: 希腊文作：“无论做什么事，都要信赖自己的心，因为这也是遵守诫命。”
  rationale: 既然本节有可信度较高的希伯来文见证，就以希伯来文为正文依据；但希腊文保存的是内容完全不同的传统，必须明确记录，不可悄然略去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“容光焕发”自然表达面容因美貌而显出的明亮、振奋效果；原文未明说是谁的面容，因此用“使人”保留一定开放性。
