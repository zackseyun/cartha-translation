translation:
  language: zh_hans
  text: 各种食物都被收在腹中[b]，但有些食物比另一些更可口[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文表达较为简约，直译近于“有食物比食物悦人”；这里按比较意义译为“有些食物比另一些更可口”。
    reason: lexical_alternative
  - marker: b
    text: 此处希腊文平行文本与现存希伯来文差异很大，似乎反映了不同的文本形式；本译文以希伯来文见证为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: כל מאכל
  choice: 各种食物都
  rationale: כל加单数名词可表达周遍或逐一的总体意义；译作“各种食物都”符合现代汉语，也保留概括性陈述。
- source_word: תסגר
  choice: 封存在
  rationale: 保留该动词被关闭、被围住的被动意象；结合食物进入肚腹的语境，“封存在”比单纯的“留在”更贴近原文。
- source_word: בבטן
  choice: 肚腹里
  rationale: 此处谈论进食，指腹内消化之处，而非子宫；“肚腹”自然而略具庄重感，也保留希伯来文具体、质朴的表达。
- source_word: אך
  choice: 但
  rationale: 标明两层意思的对照：食物同样归入肚腹，滋味却有差别。
- source_word: יש מאכל ממאכל
  choice: 有的食物比别的
  rationale: 原文比较结构简约，直译会生硬；此译自然呈现一种食物与另一种食物之间的比较，同时不额外限定类别。
- source_word: תנעם
  choice: 更可口
  rationale: נעם表示悦人、令人愉快；在食物语境中，“可口”自然传达滋味上的愉悦，又不把意义局限为“甜”。
