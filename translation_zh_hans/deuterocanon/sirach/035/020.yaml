translation:
  language: zh_hans
  text: 上腭辨别言语的滋味，明辨的心辨别虚假的滋味。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上腭察验言语的味道，明辨的心也察验谎言的味道。”希伯来文上下两句都重复使用“滋味”的意象。
    reason: lexical_alternative
  - marker: b
    text: 斯威特本的希腊文在此处与希伯来文显著不同，作：“不要走在使人跌倒的路上，也不要在多石之处绊倒。”本译文以现存的希伯来文见证为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: חך
  choice: 上膛
  rationale: 原词指口腔上部，是品尝滋味的器官；“上膛”保留具体的感官意象，比“口”或“舌头”更准确。
- source_word: בוחן
  choice: 品辨
  rationale: 该词有检验、考察之意；结合上膛和滋味的比喻，“品辨”既体现品尝，也体现辨别。
- source_word: מטעמי
  choice: ……的滋味
  rationale: 该词源于“品尝、滋味”这一语义范围，并在上下两句重复出现；译文两处均保留滋味的比喻。
- source_word: דבר
  choice: 话语
  rationale: 此处可指所说的话或言语整体；“话语”比单数的“一个字”自然，也与下句的虚假相对应。
- source_word: לב מבין
  choice: 明慧的心
  rationale: 原文将理解与辨识的能力归于“心”；译作“明慧的心”保留希伯来语的人观和修饰结构，同时符合现代汉语表达。
- source_word: כזב
  choice: 虚假
  rationale: 该词可涵盖谎言、欺骗和虚妄；“虚假”保留其概括性，不把含义限缩为某一句具体的谎话。
