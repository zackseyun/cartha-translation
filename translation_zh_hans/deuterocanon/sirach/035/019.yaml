  text: Any male will accept a woman[a], but a man will choose a young woman.
translation:
  language: zh_hans
  text: 女人会接纳任何雄性；但男人会选择年轻女子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“不要未经商议就做任何事；做了以后，也不要后悔。”这里的希腊传统与现存希伯来文本有显著差异。
    reason: textual_variant
lexical_decisions:
- source_word: כָּל זָכָר
  choice: 雄性都
  rationale: זכר明确指“雄性”，不同于下半句的איש“男人”。译作“雄性”保留原文较尖锐的生物性用语及两词之间的对比；结合全句采用“凡是……都……”表达格言式概括。
- source_word: תְּקַבֵּל
  choice: 肯接受
  rationale: קבל的基本义为“接受、接纳”。加“肯”使现代汉语自然，同时不把关系限定为婚姻或性结合。
- source_word: אִשָּׁה
  choice: 女人
  rationale: אשה既可指“女人”也可指“妻子”；这里与下半句的עלמה对照，译作“女人”较少加入婚姻层面的解释。
- source_word: אַךְ
  choice: 但
  rationale: 清楚表达上下两分句之间的反差。
- source_word: אִישׁ
  choice: 男人
  rationale: 保留原文从זכר“雄性”转为איש“男人”的词汇变化。
- source_word: יִבְחַר
  choice: 会选择
  rationale: בחר意为“选择、挑选”；“会选择”保留格言式陈述和审慎挑选的意味。
- source_word: עַלְמָה
  choice: 年轻女子
  rationale: עלמה通常指适婚年龄的年轻女子；不译作“童女”，以免赋予原词未必包含的贞洁含义；“少女”也可能暗示年龄过低。
theological_decisions:
- issue: 希伯来文本与希腊传统显著不同
  choice: 正文翻译现存希伯来格言
  alternative: 希腊传统作：“不要未经商议就做任何事；做了以后，也不要后悔。”
  rationale: 本节有高可信度的现存希伯来文本，故正文以希伯来文为据。希腊文所传是完全不同的格言，并非普通措辞差异，因此在脚注中完整保留，以诚实呈现文本传统的分歧。
translation_notes:
  register: 采用现代、凝练的格言体。“雄性”在汉语中刻意显得生物性较强，用来保留זכר与后文איש“男人”的鲜明区别。方括号所标的希伯来下半句虽可能反映文本状态，但所给资料将其作为可译正文，故不在正文另加不确定性符号；主要文本分歧通过脚注说明。
