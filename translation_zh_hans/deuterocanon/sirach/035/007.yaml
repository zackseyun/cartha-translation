base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/007.yaml
  text: Hasten the end and attend to the appointed time[b][a], for who will tell you what you should do?
translation:
  language: zh_hans
  text: 加快结局的来到，留意所定的时刻；因为谁会告诉你该做什么？[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行传统在这里的内容很不相同：“年轻人，若有需要你说话，就说吧；即使有人问你，也不过两次。”这似乎反映了不同的文本形态或经节对应，并非现存希伯来文的贴近翻译。
    reason: textual_variant
  - marker: b
    text: “该做什么”按希伯来文字面也可译为“你会做什么”；这里的译法突出了反问句所含的实际指引意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: החיש
  choice: 催促……来到
  rationale: 这是表示急迫行动的祈使式。中文补出“来到”，使“催促结局”自然可懂，同时不另行指定行动者。
- source_word: קץ
  choice: 结局
  rationale: קץ可指“终结、尽头、结局”。此处保留原文简短而略含省略的表达；“结局”比“末日”更少引入特定神学解释。
- source_word: ופקוד
  choice: 留意
  rationale: פקד语义宽广，可指眷顾、察看、指定或关注。与“时刻”连用时，“留意”表达积极关注，又不把词义限定为“指定”或“临到”。
- source_word: מועד
  choice: 所定的时刻
  rationale: מועד常指预先定下的时间或时机。“所定的时刻”既传达固定性，也不明说由谁设定。
- source_word: כי
  choice: 因为
  rationale: 引出前面命令的理由，符合此处因果关系。
- source_word: מי יאמר לך
  choice: 谁会告诉你
  rationale: 保留希伯来文将来式疑问句的直接性和反问语气。
- source_word: מה תעשה
  choice: 该做什么
  rationale: 字面可译为“你会做什么”；在此反问语境中，“该做什么”自然地表达寻求指引的实际意味，同时以脚注保留较直译的可能。
theological_decisions:
- issue: 希伯来文与希腊文平行传统显著不同
  choice: 以现存希伯来文为正文依据，并在脚注说明希腊文异读
  alternative: 按照希腊文译作关于青年人在被询问时才发言的训言
  rationale: 本节希伯来文完整且可信度高；所给希腊文并非其贴近翻译，较可能反映不同文本形态或经节对应。故不以希腊文覆盖希伯来文，但公开保留文本差异。
- issue: קץ是否具有特定末世含义
  choice: 译为较宽泛的“结局”
  alternative: 译为“末日”或“终末”
  rationale: 原词本身可指一般的终结；上下文不足以把它明确限定为末世事件，因此不在译文中预先解决其神学指向。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留希伯来文的命令语气、简洁结构和“结局”所具有的开放含义；避免使用容易把经文限定为特定末世论的“末日”。脚注标记按相关位置置于正文句末。
