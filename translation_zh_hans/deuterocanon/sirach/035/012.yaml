  text: Fill Zion with your splendor[a], and your temple with your glory.
translation:
  language: zh_hans
  text: 求你使锡安充满你的威荣[a]，使你的圣殿充满你的荣耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希腊文见证与希伯来文差异很大，意为：“你在那里嬉戏，并照着你的心意行事；不要以骄傲的话犯罪。”这表明现存希伯来文本与希腊文本之间存在重大的异文。
    reason: textual_variant
lexical_decisions:
- source_word: מלא
  choice: 使……充满
  rationale: 这是祈求语气的命令式；用“使……充满”既准确表达动作，也符合现代汉语祷告文体。第二分句承接并补出同一动词。
- source_word: ציון
  choice: 锡安
  rationale: 保留希伯来地名，不将其解释性改译为“耶路撒冷”。
- source_word: הודך
  choice: 你的荣美
  rationale: הוד可指华美、威荣和庄严的光彩；“荣美”自然凝练，并与下句כבוד“荣耀”保持词义区别。
- source_word: ומכבודך
  choice: 充满你的荣耀
  rationale: 第二分句省略了从首句承接的动词。מ־在此结合“充满”的结构理解为所充满的内容，汉语自然表达为“充满你的荣耀”。
- source_word: היכלך
  choice: 你的圣殿
  rationale: היכל也可指宫殿，但与锡安及上帝的荣耀并列时，语境明确指上帝的殿；“圣殿”最清楚。
- source_word: כבודך
  choice: 你的荣耀
  rationale: כבוד在此指上帝显赫、可敬的临在与荣光；“荣耀”是准确而通行的译法。
theological_decisions:
- issue: הוד与כבוד的诗性区别
  choice: 分别译作“荣美”和“荣耀”
  alternative: 两者都译作“荣耀”，或将הוד译作“威荣”
  rationale: 原文有意使用两个相关但不相同的词。分别翻译可保留诗句层次，又不额外规定二者的神学含义。
- issue: 希伯来文本与希腊文本的显著差异
  choice: 正文依据现存希伯来文祷告句翻译
  alternative: 采用希腊文“你在那里嬉戏，实行你的意念，不要以骄傲的话犯罪”一类读法
  rationale: 本节有可信度较高的希伯来文本，故以之为正文依据；希腊见证内容完全不同，应以脚注保留这一重要文本分歧，而不在正文中调和。
- issue: 第二分句中מ־的解释
  choice: 按充满之内容理解，译为“充满你的荣耀”
  alternative: 较字面地译为“从你的荣耀中使你的圣殿充满”
  rationale: 原句第二分句省略谓语，结构简约。按平行关系补出“使……充满”，并把מ־表达为充满的内容，最符合上下文和自然汉语；同时不扩展为关于荣耀来源的额外命题。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”明确表达希伯来命令式在祈祷中的恳求功能；两个平行分句都用“使……充满”，使省略结构在汉语中清楚自然。
