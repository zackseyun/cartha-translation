translation:
  language: zh_hans
  text: 召聚雅各的众支派[a]，使他们如同往昔一样承受产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希腊文平行文本却作：“在权贵中间，不要把自己看作与他们同等；别人说话时，不要喋喋不休。”这似乎反映了不同的文本传承或节次对应关系，与现存希伯来文并不相同。
    reason: textual_variant
lexical_decisions:
- source_word: אסוף
  choice: 召聚
  rationale: 这是动词 אסף 的命令式，要求把分散的人聚集起来；“召聚”既保留祈求或呼召的语气，也符合庄重而自然的现代汉语。
- source_word: כל שבטי יעקב
  choice: 雅各所有的支派
  rationale: 直接保留原文的支派称谓和“雅各”的祖先性表达，不改写为解释性的“以色列各支派”。
- source_word: ויתנחלו
  choice: 让他们……承受产业
  rationale: 该动词在此表达取得所分得之产业的意思。汉语若只译“继承”容易被理解为一般家产继承；“承受产业”保留土地或份额的语义，同时不擅自补出具体对象。
- source_word: כימי קדם
  choice: 像往昔一样
  rationale: 准确表达对从前景况的回望及恢复意味；措辞自然、简洁，也保留原文未明确限定具体时代的开放性。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本内容明显不同
  choice: 正文以现存希伯来文为依据，译作召聚雅各众支派并使其重新承受产业的祈愿。
  alternative: 希腊文作：“在权贵中间，不要把自己看作与他们同等；别人说话时，不要喋喋不休。”
  rationale: 本项目在可靠的希伯来文存世时优先据其翻译。本节希腊文呈现的是完全不同的训诫，可能源于不同文本传统或节次错位，因此不混入正文，而以脚注如实保存这一重大异文。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“召聚”体现命令兼祈愿的语势；“承受产业”保留 נחל 所含的产业或地业意味，避免将其弱化为一般的“继承”。
