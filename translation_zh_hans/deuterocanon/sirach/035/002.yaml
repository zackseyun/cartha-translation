  source_fidelity: 正文“向外族人出手”把希伯来语 הרף（通常与“松开、放松、罢手”相关）的不确定而可能相反的含义定为攻击性行动，超过了现存希伯来文本所能安全支持的程度。鉴于该词与 על 的搭配简略且语义难定，宜在正文保留其动作指向和不确定性。第二分句“让他们看见你大能的作为”忠实反映 ויראו גבורתיך。
  naturalness: “向外族人放手”在现代普通话中简洁自然；在此处可表达“松开／罢手”的基本语义，同时因“对……放手”本身不完全指定具体行动，较适合承载原文的简略性。
  terminology: “外族人”可接受，但“外族”更贴近 עם נכר 的集体性；“你大能的作为”庄重且准确。异文脚注应仅说明所给希腊平行文本的实际内容；其中没有“用餐”。
  issues:
