review_pass:
  verdict: revise
  source_fidelity: 需修订。“向外族人出手”把希伯来语命令式 הרף（来自 רפה，通常意为松开、放松、罢手）译成了方向相反的攻击行动；所给希伯来文本本身并不支持“出手/击打”。虽然句法和语境使其具体语气仍有不确定性，但正文应保留“罢手/放松”的基本词义，并以脚注说明歧义。
  naturalness: “对外族人罢手”是现代普通话中自然、庄重且简明的表达；它也比“向外族人出手”更忠实地呈现该动词的通常含义。
  terminology: “外族人”可保留，能表达 עם נכר 的集体性及外来/异族属性。“你大能的作为”准确传达 גבורתיך 的复数、可见的能力彰显。希腊异文脚注应准确概述其内容，不宜把“躺卧/安歇”过度具体化为“用餐”。
  issues:
  - severity: high
    issue: 正文“向外族人出手”与 הרף 的基本词义不符。
    rationale: רפה 的命令式通常表示放松、松开、停止或罢手，而非攻击、击打。即使上下文可能促使人猜测另一文本形态，也不能在未标示的情况下把现存希伯来文本译成相反的动作。
  - severity: low
    issue: 希腊异文脚注中的“用餐”过于具体。
    rationale: 所给希腊文说到照料、坐下、完成需要、安歇/躺卧、喜乐及得冠冕；并未明确说“用餐”。
  revised_text: 对外族人罢手[a]，让他们看见你大能的作为。[b]
  revised_footnotes:
  - marker: a
    text: “对外族人罢手”：原文命令式十分简略，确切语气不能完全确定。该动词通常有“放松、松开、停止”之意；也可理解为“对外族人放松行动”。
    reason: lexical_alternative
  - marker: b
    text: 现存希腊文本与本句希伯来文本差异很大，内容涉及照料、坐下、满足需要、安歇、喜乐和得冠冕，看来反映了另一种文本形态；本译文依据现存希伯来文本。
    reason: textual_variant
  revision_rationale: 修订正文以恢复现存希伯来文本中 רפה 的基本语义，不以英语审计轨迹中“Strike”的选择凌驾于原文。保留“罢手”这一自然译法，并在脚注中明确该简略结构的语气和具体关系仍不完全确定。同步校正希腊异文脚注，使其准确而不添加“用餐”这一原文未明说的细节。
