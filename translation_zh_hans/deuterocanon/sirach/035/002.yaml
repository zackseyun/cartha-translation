  text: Strike the foreign people[b][a], and let them see your mighty deeds.
translation:
  language: zh_hans
  text: 向外族人出手[a]，让他们看见你大能的作为。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向……出手”：原文命令式十分简略，确切语气不能完全确定；也可理解为“对外族人罢手”或“放松对外族人的行动”。
    reason: lexical_alternative
  - marker: b
    text: 现存希腊文本与本句希伯来文本差异很大，内容涉及照料、入席、用餐和得冠冕，看来反映了另一种文本形态；本译文依据现存希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: הרף על
  choice: 向……出手
  rationale: 该命令式与介词 על 连用，语意十分简略，直译难以自然表达。“向……出手”保留了动作指向某群体的含义，也与下句彰显大能相衔接；同时以脚注说明 רפה 通常也可表示“松开、罢手”，不掩盖原文的不确定性。
- source_word: עם נכר
  choice: 外族人
  rationale: עם 表示作为整体的“人民、族群”，נכר 表示外来的、异族的。“外族人”在现代汉语中自然，并保留群体及族属上的外来性。
- source_word: ויראו
  choice: 让他们看见
  rationale: 承接命令式，将前缀动词理解为祈使性或愿望性的连续表达，比单纯的将来时更符合本句语气。
- source_word: גבורתיך
  choice: 你大能的作为
  rationale: 复数形式所指更像可被看见的能力彰显，而非抽象的力量；“大能的作为”兼顾复数含义与庄重语体。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本差异显著
  choice: 正文依据现存希伯来文本翻译，并在脚注中披露异文
  alternative: 依希腊文本译成有关照料、入席、用餐和得冠冕的内容
  rationale: 本处希伯来文本完整可读，而所提供的希腊文本显然代表另一种文本形态。若将两者调和，反会掩盖真实的文本差异。
- issue: הרף על 的动作含义不确定
  choice: 正文采用“向……出手”，脚注保留“对……罢手／放松”的可能
  alternative: 正文译为“对外族人罢手”或“宽待外族人”
  rationale: 上下文所呈现的彰显大能，可支持敌对行动的理解；然而 רפה 的常见词义确实可指松开或停止，因此不把这一相反方向的可能性从读者面前删去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“向……出手”比“击打”稍含蓄，可承载原文动作方式未明的特点；脚注明确保留词义张力与希腊异文。
