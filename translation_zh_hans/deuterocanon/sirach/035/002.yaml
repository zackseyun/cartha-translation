    issue: “向外族人出手”将不确定的 הרף 译为攻击行动。
    rationale: 该选择与 רפה 的通常词义及脚注所承认的“罢手／放松”可能相冲突；上下文或其他文本传统不能在未标明的情况下消除现存希伯来语措辞的歧义。
  - severity: medium
