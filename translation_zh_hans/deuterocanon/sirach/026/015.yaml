  yaml_path: translation/deuterocanon/sirach/026/015.yaml
  text: A quiet wife is a gift from the Lord[a], and there is no equivalent for a disciplined soul.
translation:
  language: zh_hans
  text: 寡言的妻子是主所赐的礼物；受过教养的心灵，其价值无可替代。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受过教养的心灵”也可译作“受过训练的心灵”或“有自律的心灵”；希腊文兼有教导、训练和管教塑造的含义。
    reason: 保留 πεπαιδευμένης 的词义幅度，并说明正文未完全展现的可译方向。
lexical_decisions:
- source_word: δόσις
  choice: 所赐的礼物
  rationale: 此处指所给予之物，而非给予的动作；与来源属格 Κυρίου 合译为“主所赐的礼物”，自然表达其来自主。
- source_word: Κυρίου
  choice: 主
  rationale: 属格表示来源；“主”符合中文圣经智慧文学的庄重语域，且不额外引入专名。
- source_word: γυνὴ
  choice: 妻子
  rationale: γυνή 可指“女人”或“妻子”，但本章上下文论及婚姻与配偶品格，因此取“妻子”。
- source_word: σιγηρά
  choice: 寡言的
  rationale: 表示言语节制、安静稳重；“寡言”比“沉默”更避免绝对缄默之意，也较准确保留对说话有节制的赞许。
- source_word: ἀντάλλαγμα
  choice: 无可替代
  rationale: 原词可指交换物、代价或等值之物；此处表达没有任何东西足以与之相换或相比，用“其价值无可替代”传达不可比拟的价值。
- source_word: πεπαιδευμένης
  choice: 受过教养的
  rationale: παιδεύω 词族兼有教育、训练和管教塑造之意；“受过教养”保留教导与品格塑造两面，不限于学校教育。
- source_word: ψυχῆς
  choice: 心灵
  rationale: 此处指人的内在生命与品格；“心灵”在现代汉语中自然庄重，也避免把 ψυχή 过度限定为后世系统神学意义上的“灵魂”。
theological_decisions:
- issue: πεπαιδευμένης ψυχῆς 与前句“妻子”的关系
  choice: 不在第二分句补出“妻子”，保留“受过教养的心灵”这一独立语法表达，同时让平行结构自然关联前句所称赞的妻子品格。
  alternative: 明确译作“这样一位受过教养的妻子”或泛指“受过教养的人”。
  rationale: 希腊文第二分句没有重复 γυνή；上下文和平行关系支持它主要延续对妻子内在品格的称赞，但原句表面也可作为较一般的格言理解，因此不应在正文中彻底消除这一张力。
- issue: πεπαιδευμένης 的侧重点
  choice: 译为“受过教养的”，兼顾受教与品格塑造。
  alternative: “受过管教的”“有自律的”“受过良好教育的”。
  rationale: 该词既可突出教导，也可突出训练与纪律；单取“自律”或“教育”都会缩窄原义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“寡言”表达言语有节制，并非要求绝对沉默；分号保留原文两分句的格言式平行。脚注标记置于所解释的第二分句之后。
