lexical_decisions:
- source_word: ἀνὴρ πολεμιστής
  choice: 一个战士
  rationale: 保留阳性单数和军事身份；“战士”简洁、自然。
- source_word: ὑστερῶν
  choice: 衰败
  rationale: 该分词可指缺乏、亏损或不济；与“因贫乏”连用时，表达战士因匮乏而陷于衰颓，同时避免把结果限定为单纯身体虚弱。
- source_word: διʼ ἔνδειαν
  choice: 因贫乏
  rationale: ἔνδεια表示缺乏、困窘或贫困；“因贫乏”保留原因关系，并维持原文较宽的语义。
- source_word: ἄνδρες συνετοί
  choice: 有见识的人
  rationale: συνετός侧重理解力、明辨和实际判断；现代汉语中“有见识的人”自然地传达这一含义。希腊文为阳性复数，但此处汉语不必强加仅指男性的限制。
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: 若被当作废物丢弃
  rationale: 动词源自σκύβαλον，带有把某物视为污秽废弃物而丢掉的强烈意象；此译兼顾受辱与遭弃置两层含义。
