  text: Guard yourself against an impudent eye[b][a], and do not be surprised if she sins against you.
translation:
  language: zh_hans
  text: 你要防备无耻的眼目[a]；若她[b]得罪你，不要惊讶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近似“从／在无耻的眼目后面保护自己”。这个介词短语含义较难确定；正文按其在警告语境中最可能的意思翻译。
    reason: lexical_alternative
  - marker: b
    text: 希腊文此处没有明说“她”；这个女性主语是根据上下文关于品行不端之女人的论述补出的。
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπίσω
  choice: 防备
  rationale: ὀπίσω与φύλαξαι构成的说法直译近似“从／在……后面提防自己”，含义和句法较难确定。结合警戒语境，用“防备”自然表达避开其危害的意思，同时以脚注保留原文措辞的困难。
- source_word: ἀναιδοῦς
  choice: 无耻的
  rationale: ἀναιδής指不知羞耻、厚颜无忌；“无耻的”在现代汉语中清楚、凝练，并保留原文的道德评价。
- source_word: ὀφθαλμοῦ
  choice: 眼目
  rationale: 原文使用具体名词“眼睛”；“眼目”既保留这一意象，也比抽象的“眼神”更贴近原文，并符合庄重的智慧文学语体。
- source_word: φύλαξαι
  choice: 你要防备
  rationale: 这是φυλάσσω的命令式，表达警戒和自我保护。“你要防备”在汉语中自然，并保留直接劝诫的语气。
- source_word: μὴ θαυμάσῃς
  choice: 不要惊讶
  rationale: θαυμάζω可指惊奇、诧异；在警告语境中，“不要惊讶”准确表达不要因所警告之事发生而意外。
- source_word: ἐὰν
  choice: 若
  rationale: ἐὰν引出条件句。“若”保留条件性，不将此事说成必然发生，也与全句庄重而通俗的语体相称。
- source_word: εἰς σέ
  choice: 得罪你
  rationale: εἰς加宾格在此指出行为所冒犯、伤害的对象；与πλημμελέω合译为“得罪你”，简洁表达针对听者的过犯。
- source_word: πλημμελήσῃ
  choice: 得罪
  rationale: πλημμελέω可指行错、冒犯或犯罪。“得罪”保留人际与道德层面的过犯含义，又不把词义过度限定为某种特定教义意义。
theological_decisions:
- issue: 后半句的行为主体在希腊文中没有明说性别或名词
  choice: 正文依上下文补出“她”，并加脚注说明
  alternative: 省略主语，译作“若有人得罪你”或“若有过犯临到你”
  rationale: 本节所在语境谈论品行不端的女人，因此“她”是最可能的所指；但希腊文本身只用第三人称单数动词，没有明写代词。正文补出“她”使汉语清楚，脚注则保留这一解释性补充的透明度。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“眼目”保留原文具体意象；分号呈现警戒与条件结果之间的紧密联系。正文不掩盖介词短语的困难，也不把未明说的女性主语当作希腊文的显式措辞。
