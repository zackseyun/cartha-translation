  text: A good wife is a good gift[a]; she will be given into the bosom of one who fears God.
translation:
  language: zh_hans
  text: 贤妻是美好的礼物；她必被赐入敬畏上帝之人的怀中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“她必被赐在敬畏主之人的份中。”希伯来文直译为“她必被赐入敬畏上帝之人的怀中”，保留了更亲密的意象。
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: 贤妻
  rationale: אִשָּׁה 可指“女人”或“妻子”；本节的婚姻语境及希腊文平行文本支持“妻子”。“贤妻”在现代汉语中简洁、庄重，也自然表达“好妻子”。
- source_word: מַתָּנָה טוֹבָה
  choice: 美好的礼物
  rationale: מַתָּנָה 指所赐的礼物；译作“美好的礼物”保留 טוֹבָה 与前半句“贤”的重复呼应，同时符合汉语箴言式表达。
- source_word: בְּחֵיק
  choice: 与他相依
  rationale: חֵיק 本指胸怀或怀中，在这里传达亲密结合、归属相伴的意象。若直译“被赐在……怀中”现代汉语较生硬，因此正文以“与他相依”自然传达其关系意象，并在脚注交代字面表达。
- source_word: יֵרֵא אֱלֹהִים
  choice: 敬畏上帝的人
  rationale: 忠实表达“敬畏上帝者”的单数含义，不额外加入原文未明说的“男人”，同时由婚姻语境表明其配偶关系。
- source_word: תִּנָּתֵן
  choice: 她必被赐给
  rationale: 该词为尼法勒未完成式，具有被动意义；“必被赐给”既保留被动结构，也体现箴言语境中的将来或确定性。
theological_decisions:
- issue: 末句中的神圣称谓
  choice: 上帝
  alternative: 主
  rationale: 希伯来文主要见证作 אֱלֹהִים（上帝），希腊文平行文本作 Κύριον（主）。正文依从希伯来文，脚注保留希腊文差异。
- issue: 妻子被赐予的表达是否明确指出赐予者
  choice: 保留神学被动，不补出“上帝”作主语
  alternative: 上帝必将她赐给敬畏他的人
  rationale: תִּנָּתֵן 仅用被动语态，并未明说施事者。译文保留这种含蓄，以免把可能暗示的神圣施事者变成原文明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“贤妻”凝练表达婚姻语境；末句避免生硬照搬“怀中”，以“与他相依”呈现希伯来文的亲密意象，并用脚注保存字面形式及希腊文异读。
