base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/013.yaml
  text: Like a thirsty traveler she opens her mouth[a], and from every nearby water she will drink; opposite every stake she will sit down[c][b], and before every arrow she will open her quiver.
translation:
  language: zh_hans
  text: 她像口渴的旅人一样张开嘴[a]，凡是近旁的水，她都要喝；她会对着每根木桩坐下，在一支箭面前打开箭袋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些形象是隐喻，很可能指她在性关系上毫无节制，遇到近旁的机会便接受。
    reason: cultural_note
  - marker: b
    text: 原文直译为“在一支箭面前打开箭袋”。这幅图像的确切含义有争议，但它延续了本节带有性意味的隐喻，因此正文没有把它解释性地改写。
    reason: lexical_alternative
lexical_decisions:
- source_word: διψῶν ὁδοιπόρος
  choice: 口渴的旅人
  rationale: 保留比喻的主体和急切口渴的状态；“旅人”是现代汉语中自然、庄重的表达。
- source_word: τὸ στόμα ἀνοίγει
  choice: 张开嘴
  rationale: 按原文保留具体动作，不额外加强为“张大嘴”。
- source_word: ἀπὸ παντὸς ὕδατος τοῦ σύνεγγυς πίεται
  choice: 凡是近旁的水，她都要喝
  rationale: 以自然汉语表达“从每一处近旁的水取饮”的周遍意味，并保留将来时所呈现的倾向或行动。
- source_word: κατέναντι παντὸς πασσάλου καθίσεται
  choice: 她会对着每根木桩坐下
  rationale: πάσσαλος直译为“木桩”；κατέναντι译作“对着”，保留空间意象及其隐喻张力，不将含义直接改写为性行为。
- source_word: ἔναντι βέλους
  choice: 在一支箭面前
  rationale: βέλους为单数且没有πᾶς修饰，因此不译作“每支箭”；“在……面前”贴近ἔναντι，同时承认这一意象在汉语中也较突兀。
- source_word: ἀνοίξει φαρέτραν
  choice: 打开箭袋
  rationale: φαρέτρα通常指盛箭的箭袋。虽然后半句的比喻含义有争议，仍保留原文具体形象。
theological_decisions:
- issue: 智慧训诫语境中的性隐喻
  choice: 保留“喝水、木桩、箭、箭袋”等具体意象
  alternative: 直接释义为她对任何性机会都来者不拒绝
  rationale: 上下文很可能借这些形象描写性方面的毫无节制，但希腊文本没有直接明说；保留隐喻可避免把有争议的具体对应强加给正文。
- issue: 各分句中没有明说的阴性主语
  choice: 在汉语中补出“她”
  alternative: 始终省略主语，或以泛指人物代替
  rationale: 本节上下文所谈的是女子；补出“她”使汉语连贯，同时不改变指称对象。
- issue: βέλους的范围含义
  choice: 译为“一支箭”
  alternative: 译为“每支箭”或“任何箭”
  rationale: 原文是无冠词的单数属格βέλους，没有与上一分句παντός相应的周遍限定词；因此不把“每”从“每根木桩”延伸到“箭”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡是……都……”自然传达原文的周遍意味；后半节有意保留突兀的具体意象，不以露骨释义取代原文的含混。
