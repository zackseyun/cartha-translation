  text: 'Over two things my heart is grieved[a], and over the third anger came upon me:'
translation:
  language: zh_hans
  text: 有两件事使我的心忧伤[a]，第三件使怒气临到我：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的表述本身清楚，但本节单独来看句意未完，所说的事项见下文。
    reason: cross_reference
lexical_decisions:
- source_word: Ἐπὶ δυτὶ
  choice: 有两件事
  rationale: ἐπί加与格表示忧伤所因之事；用“有两件事”自然保留数目递进的格言结构。
- source_word: λελύπηται
  choice: 使……忧伤
  rationale: 该完成时中被动态表达由忧伤造成且持续的状态；汉语使动句既自然，也保留“我的心处于忧伤中”的含义。
- source_word: ἡ καρδία μου
  choice: 我的心
  rationale: 直译“我的心”，符合圣经语体，也自然表达情感与内在生命的中心。
- source_word: ἐπὶ τῷ τρίτῳ
  choice: 第三件
  rationale: 与前句“两件事”对应，保留由二至三的修辞递进；中文语境中“事”可承前省略。
- source_word: θυμός
  choice: 怒气
  rationale: θυμός表示强烈的愤怒或激愤；“怒气”庄重而通俗，既不弱化为一般不悦，也不强化为暴怒。
- source_word: μοι ἐπῆλθεν
  choice: 临到我
  rationale: 保留愤怒如同来到并笼罩说话者的表达方式，不擅自解释为外在袭来或内心升起。
