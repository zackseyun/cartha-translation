translation:
  language: zh_hans
  text: 圣灯台上明亮照耀的灯；匀称挺拔的身姿，配以美丽的容颜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成熟稳重的年华中美丽的容颜。”希腊语ἡλικία可指年龄、人生阶段，也可指身量或体态；στασίμη含稳固、安定之意。因此本短语也可理解为成熟安定的年华，而正文按身量匀称、稳健的理解翻译。
    reason: 原文短语ἐπὶ ἡλικίᾳ στασίμῃ的ἡλικία与στασίμη均容许不同但相关的理解；脚注保留年龄／人生阶段的解释，避免排除歧义。
lexical_decisions:
- source_word: λύχνος
  choice: 灯
  rationale: 该词指具体的油灯，而非抽象的光；译作“灯”保留原文鲜明的物象。
- source_word: ἐκλάμπων
  choice: 灿然发光
  rationale: ἐκλάμπω带有光辉显露、明亮照耀之意；“灿然发光”既体现其力度，也符合汉语诗性表达。
- source_word: ἐπὶ λυχνίας ἁγίας
  choice: 神圣的灯台上
  rationale: ἐπί在此表示位置，λυχνία是灯台；ἁγία保留分别为圣或敬拜语境中的神圣意味，不弱化为“华美”。
- source_word: κάλλος προσώπου
  choice: 美丽的容颜
  rationale: 保留κάλλος与πρόσωπον的具体关系；“容颜”比“脸的美丽”自然庄重，也适合本节的诗体。
- source_word: ἐπὶ ἡλικίᾳ στασίμῃ
  choice: 匀称挺拔的身姿上
  rationale: ἡλικία既可指年龄，也可指身量、体态；在容颜与整体形体相配的平行意象中，“身姿”较贴合语境。στασίμη含稳固、端正站立之感，故译为“匀称挺拔”，同时以脚注保留“成熟稳重的年华”这一可能解释。
