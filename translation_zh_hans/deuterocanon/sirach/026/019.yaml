translation:
  language: zh_hans
  text: 金柱在银制基座上；美丽的双脚在稳立者的胸膛上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文的意象十分凝缩，后半句的含义也不完全清楚；较直译为“美丽的双脚在稳立者的胸膛上”。这里暂把 εὐσταθοῦς 按名词化用法理解为“稳立者”，把 στέρνοις 理解为胸部区域；原文的句法和图像仍有歧义。
    reason: 说明原文后半句的句法与意象困难，并保留而非消除其歧义。
lexical_decisions:
- source_word: στύλοι χρύσεοι
  choice: 金柱
  rationale: στύλοι指直立的支柱，χρύσεοι表示金制的；“金柱”简洁保留贵重材质与挺立的诗歌意象。
- source_word: ἐπὶ βάσεως ἀργυρᾶς
  choice: 立在银座上
  rationale: βάσις在此是柱子所立的基座；“银座”比“银的根基”更具体，也与建筑意象相合。
- source_word: πόδες ὡραῖοι
  choice: 美丽的双脚
  rationale: πόδες直指脚，ὡραῖοι表达美丽、悦目；不改译为“腿”或“步态”，以保留原文具体而略显突兀的身体意象。
- source_word: στέρνοις
  choice: 胸膛
  rationale: 该词为复数与格，通常指胸部或胸膛；汉语以集合性的单数“胸膛”表达更自然。
- source_word: εὐσταθοῦς
  choice: 稳立之人
  rationale: 此形容词可表示稳固、稳定或站立安稳；按名词化用法处理为“稳立之人”，既保留稳定含义，也呼应全句站立、承托的意象。
