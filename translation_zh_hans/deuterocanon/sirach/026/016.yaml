  text: Grace upon grace is a modest woman[a], and no scale is worthy of a self-controlled soul.
translation:
  language: zh_hans
  text: 端庄的女子，美好加上美好[a]；没有任何天平配得上一个自制的心灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美好加上美好”也可译作“魅力加上魅力”或“恩惠加上恩惠”；希腊文χάρις可指美好、可喜之处、魅力或恩惠。
    reason: 保留χάρις的词义范围，并避免正文将其限定为神学性的“恩典”。
lexical_decisions:
- source_word: χάρις ἐπὶ χάριτι
  choice: 恩上加恩
  rationale: χάρις在此可指恩惠、可喜之处或魅力；重复结构表达累加和强化。译作“恩上加恩”保留原文形式与语义开放性，脚注补充语境中的另一可能。
- source_word: γυνὴ
  choice: 女子
  rationale: γυνή既可指女人，也可指妻子；本节没有明确婚姻限定，因此采用范围较宽且合乎箴言文体的“女子”。
- source_word: αἰσχυντηρά
  choice: 端庄的
  rationale: 该词在褒义伦理语境中指有羞耻感、含蓄自持；“端庄”比“羞怯”更自然，也避免误解为蒙羞。
- source_word: σταθμός
  choice: 天平
  rationale: σταθμός在此属于称量或衡量意象；“天平”具体保留原文的称量比喻。
- source_word: πᾶς ἄξιος
  choice: 任何……都不足以衡量
  rationale: 原文直译近于“没有任何天平配得上”；中文这样重组可自然传达没有衡量标准足以相称的含义，同时保留天平意象。
- source_word: ἐγκρατοῦς ψυχῆς
  choice: 自制的心灵
  rationale: ἐγκρατής表示能约束、掌控自己；ψυχή在这里指人的内在生命或心灵。“自制的心灵”兼顾伦理含义和原文措辞。
theological_decisions:
- issue: αἰσχυντηρά所表达的德性
  choice: 端庄的
  alternative: 羞怯的；知羞的
  rationale: 上下文是在称赞一种有分寸、知廉耻的品格，并非贬低或描述羞辱；“端庄”以现代褒义措辞呈现此德性。
- issue: χάρις在智慧文学语境中的含义
  choice: 正文保留“恩上加恩”，脚注说明也可理解为“魅力倍增”
  alternative: 魅力倍增；美上加美
  rationale: χάρις本身可涵盖恩惠、可喜和魅力。正文保留重复句式及词义张力，不把它限定为神学术语，也不完全消除其在女性德性语境中的审美意味。
- issue: 无合适天平的价值比喻
  choice: 任何天平都不足以衡量
  alternative: 没有任何天平配得上；其价值无法称量
  rationale: 原句高度压缩，字面是没有天平足以与自制的心灵相称。译文使隐含的衡量关系在中文中清楚，但不另加具体价值判断。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。分号呈现两个并列的赞美判断；保留“心灵”和“天平”的原文意象，并以脚注交代首句的真实歧义。
