  terminology: αἰσχυντηρά译“端庄”恰当；ἐγκρατοῦς ψυχῆς译“自制的心灵”可接受，保留伦理性的自制与ψυχή的内在生命含义。σταθμός译“天平”准确。将χάρις改作“美好”避免把本节的称赞性、魅力性用语神学化；脚注可说明“魅力”这一更具体的可能译法。
