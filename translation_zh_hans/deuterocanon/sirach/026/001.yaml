  text: Happy is the husband of a good wife[a], and the number of his days is doubled.
translation:
  language: zh_hans
  text: 有好妻子的丈夫有福了[a]；他的年日加倍。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“幸福的”或“幸运的”。
    reason: 保留 אַשְׁרֵי 在智慧文学语境中“有福、幸福、幸运”等可羡慕福乐的词义范围。
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: 好妻子
  rationale: 直译为“好女人／好妻子”；בַעֲלָהּ 明确表明婚姻关系，因此译作“妻子”最自然。“好”保留了原文宽泛的品德与生活评价，不收窄为“贤德”。希腊文 γυναικὸς ἀγαθῆς 也支持此译。
- source_word: אַשְׁרֵי
  choice: 是幸福的
  rationale: 该词是智慧文学中对可羡慕福分的感叹，可译为“幸福的”“有福的”或“幸运的”。“幸福的”在现代汉语中自然易懂，并避免把原句明确化为上帝直接赐福的宣告。
- source_word: בַעֲלָהּ
  choice: 丈夫
  rationale: 该词在这里指这位女子的丈夫。现代汉语译作“丈夫”可准确表达婚姻关系，并避免“主人”一词造成误解；希腊文 ὁ ἀνήρ 也印证此义。
- source_word: וּמִסְפַּר יָמָיו
  choice: 他年日的数目
  rationale: 较形式对等地保留“他的日子的数目”这一希伯来语表达，也与希腊文 ἀριθμὸς τῶν ἡμερῶν αὐτοῦ 一致；采用“年日”使中文庄重而不将其直接解释成“寿命”。
- source_word: כִּפְלַיִם
  choice: 也加倍
  rationale: 原词意为“双倍、两倍”。“加倍”简洁地保留原文的谚语性说法，不强行判定这是严格的寿命数字，还是对生命丰盛感的修辞描述。
theological_decisions:
- issue: 智慧文学中 אַשְׁרֵי／μακάριος 的福语表达
  choice: 是幸福的
  alternative: 有福的；幸运的
  rationale: 本节是在智慧文学语境中称赞一种令人羡慕的境况，并未明说这是上帝直接施予的盟约性福分。“幸福的”保留福语色彩，同时不增加原文未明说的神学施动者；其他译法仍属合理可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“好妻子”有意保持原文评价的宽泛性；“年日的数目也加倍”保留原文带有张力的谚语式陈述，不将其解释性改写为确定的寿命承诺。
