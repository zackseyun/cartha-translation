  text: A wicked wife is a shaking yoke for oxen[a]; whoever takes hold of her is like one who grabs a scorpion.
translation:
  language: zh_hans
  text: 邪恶的妻子如同摇晃不稳的牛轭[a]；抓住她的人，就像伸手抓蝎子的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语“摇晃不稳的牛轭”是一个含义较难确定、比喻性很强的说法；也可能指套在轭下却颠簸不稳的一组牛。这里描绘的是一种扰人而难以驾驭的重负。
    reason: lexical_alternative
lexical_decisions:
- source_word: βοοζύγιον
  choice: 牛轭
  rationale: 该复合词由“牛”和“轭”的意象构成；译作“牛轭”保留具体的农耕比喻，也不贸然限定为套轭的一队牛。
- source_word: σαλευόμενον
  choice: 摇晃不稳的
  rationale: 该分词表示受摇动或处于晃动状态；“摇晃不稳”兼顾动态画面与不稳定之意。
- source_word: γυνὴ πονηρά
  choice: 邪恶的妻子
  rationale: 在这一家庭智慧语境中，γυνή 取“妻子”较合适；πονηρά 带有明确的道德贬义，故译“邪恶的”。
- source_word: ὁ κρατῶν αὐτῆς
  choice: 抓住她的人
  rationale: κρατέω 可指抓住、握住或控制；下句以手抓蝎子作比，因此保留触觉性的“抓住”，而不解释为“制伏”。
- source_word: δρασσόμενος
  choice: 伸手抓
  rationale: 该词指用手抓取；加入“伸手”使中文画面自然清楚，同时保留亲手抓握所带来的危险感。
- source_word: σκορπίου
  choice: 蝎子
  rationale: 这是明确的动物名称；中文在此无需量词也能自然表达泛指。
