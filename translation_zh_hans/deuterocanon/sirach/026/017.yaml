  yaml_path: translation/deuterocanon/sirach/026/017.yaml
  text: Like the sun rising in the heights of the Lord[b][a], so is the beauty of a good wife in the adornment of his house.
translation:
  language: zh_hans
  text: 正如太阳在主的高天升起，贤妻的美也为她丈夫的家增添装饰。 [a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “装饰”所译的希腊词也可指“布置”或“秩序”。
    reason: lexical_alternative
  - marker: b
    text: “贤妻”也可译作“良善的女人”；这里的家庭语境较支持“妻子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥλιος ἀνατέλλων
  choice: 太阳升起
  rationale: 保留分词所呈现的动态意象，中文自然简洁。
- source_word: ἐν ὑψίστοις Κυρίου
  choice: 在主的高天之上
  rationale: ὑψίστοις为复数，指至高之处；保留Κυρίου的属格关系，不径直改写为“天上”。
- source_word: κάλλος
  choice: 美丽
  rationale: 直接表达外在荣美，符合本节的明喻。
- source_word: ἀγαθῆς γυναικός
  choice: 贤妻
  rationale: γυνή可指女人或妻子；下文家庭语境支持“妻子”。“贤”以凝练、尊重的现代汉语表达ἀγαθή的良善含义。
- source_word: ἐν κόσμῳ
  choice: 在……陈设之间
  rationale: κόσμος可指秩序、布置或装饰；“陈设”在家庭语境中兼顾布置与装饰效果，但不能完全涵盖其词义范围，故加注。
- source_word: οἰκίας αὐτοῦ
  choice: 丈夫家中
  rationale: αὐτοῦ是阳性属格；结合“妻子”的婚姻语境，将隐含的男性所指明译为“丈夫”，避免中文“他的”指代不清。
theological_decisions:
- issue: 性别化的家庭表述
  choice: 贤妻……丈夫家中
  alternative: 良善的女人……他的家中
  rationale: 婚姻与家庭语境支持将γυνή理解为妻子，而阳性αὐτοῦ应予保留；译文不将其性别中和，也不据现代观念改为“她的家”。
- issue: 两个意象之间的关系
  choice: 以分号和“也照耀”表达省略的比较关系
  alternative: 正如……同样……
  rationale: 希腊文以καί连接两个名词性图景，并未明写“像”；中文补出“照耀”使比喻通顺，同时不把比较关系解释得过细。
translation_notes:
  register: 采用现代、庄重而可朗读的箴言体。以“高天”保留复数高处的崇高意象；避免生硬直译“主的至高处”。“也照耀”是为中文完整性所作的轻度补足。
