revisions:
- from: 太阳升起在主的高天之上；贤妻的美丽，也照耀在丈夫家中的陈设之间。[a][b]
  to: 正如太阳在主的高天升起，贤妻的美也为她丈夫的家增添装饰。 [a][b]
  rationale: 修订恢复ἐν的地点义，删除原文未表达的“照耀”，并将κόσμος译为“装饰”，以保留其在家宅语境中的妆饰／装点含义。以“为她丈夫的家增添装饰”将中文中较难直译的“贤妻之美在其家宅装饰中”自然化，同时维持原文的比较与男性所有格指向。脚注锚点按顺序紧随相关经文，且均有对应条目。
