base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/029.yaml
  text: A merchant will scarcely be kept from wrongdoing[b][a], and a shopkeeper will not be declared righteous from sin.
translation:
  language: zh_hans
  text: 商人很难摆脱过错[a]，小贩也不能免除罪责[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摆脱”也可译作“逃脱”或“使自己脱离”。希腊语动词可指从某事中脱身。
    reason: lexical_alternative
  - marker: b
    text: “不能免除罪责”表达原文的司法性意思；也可译作“不会被判为无罪”。
    reason: translation_clarity
lexical_decisions:
- source_word: Μόλις
  choice: 很难
  rationale: 表达某事只能勉强做到、几乎不能做到，符合格言式语气，也比“几乎不”更自然。
- source_word: ἐξελεῖται
  choice: 摆脱
  rationale: 该动词在中间语态并与ἀπό连用时，可表示从某事中脱身或逃脱；“摆脱”保留主体设法脱离的含义，不把语态强行解释为被动。
- source_word: ἔμπορος
  choice: 商人
  rationale: 指从事贸易者；“商人”准确、中性，符合现代汉语。
- source_word: πλημμελείας
  choice: 过错
  rationale: 该词泛指过失、冒犯或不当行为；“过错”保留宽泛的道德含义，不擅自限定为商业欺诈。
- source_word: δικαιωθήσεται
  choice: 被判为义
  rationale: 保留δικαιόω被动式的宣告或判定意味，同时避免仅译作“称义”而带入后期神学术语色彩。
- source_word: κάπηλος
  choice: 小贩
  rationale: 指小规模零售者，也可带有负面社会色彩；“小贩”能较简洁地区别于前句经营较大范围贸易的“商人”。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 保留明确的道德与宗教含义，不弱化为一般的错误。
theological_decisions:
- issue: 智慧文学语境中δικαιωθήσεται的表达
  choice: 被判为义
  alternative: 被称为义；被判无罪
  rationale: “被判为义”保留司法性、宣告性的含义，又不将经文缩窄为仅仅无罪开释，也不导入特定宗派的称义体系。
- issue: ἀπὸ ἁμαρτίας与δικαιωθήσεται的关系
  choice: 脱离罪而被判为义
  alternative: 从罪中被判为义；在罪上被判无罪
  rationale: 希腊语介词结构直译生硬，且可能表达不受罪牵连或从罪责中脱身；正文用自然汉语呈现基本关系，脚注保留较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。“商人”与“小贩”对应两类贸易者；不把经文泛化为对所有商业活动的绝对定罪，也不淡化其对贸易中道德危险的尖锐警告。
