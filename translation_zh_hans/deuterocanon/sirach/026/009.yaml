translation:
  language: zh_hans
  text: 醉酒的妻子令人极其恼怒；她不会遮掩自己的羞耻。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ μεγάλη
  choice: 惹来盛怒
  rationale: 希腊文是名词性短语，直译“极大的愤怒”在现代汉语中生硬；按语境表达醉酒妻子引发强烈愤怒，同时不额外指定愤怒的主体。
- source_word: γυνὴ μέθυσος
  choice: 醉酒的妻子
  rationale: γυνή 可指“女人”或“妻子”；本章语境论及妻子，故取“妻子”。μέθυσος 指醉酒或嗜酒者；这里用“醉酒的”避免把持续性的酗酒习惯强加于原文。
- source_word: ἀσχημοσύνην
  choice: 丑态
  rationale: 该词指不体面、羞耻或失态之事；“丑态”自然地衔接醉酒语境，也保留公开失仪所带来的羞耻意味。
- source_word: οὐ συγκαλύψει
  choice: 不会遮掩
  rationale: συγκαλύπτω 表示遮盖、掩藏；“不会遮掩”贴近将来时形式，也保留可能带有结果性的陈述。
theological_decisions:
- issue: ὀργὴ μεγάλη 的句法关系
  choice: 译作“惹来盛怒”
  alternative: “醉酒的妻子就是极大的愤怒”或“醉酒的妻子令人极其恼怒”
  rationale: 原文为省略系词的名词句，字面关系略显压缩。“惹来”使汉语可懂，并保留其造成强烈愤怒/恼怒的基本意义；不明确添加丈夫、家庭或上帝为愤怒主体。
- issue: 羞耻属于内在羞耻还是外在失态
  choice: 译作“自己的丑态”
  alternative: “自己的羞耻”或“自己的不体面”
  rationale: 原文可涵盖羞耻与不雅行为。结合醉酒语境，“丑态”较自然，但不把经文解释成特定性行为或道德罪名。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语；保留原文两分句的箴言式力度。未设脚注，因此正文无脚注标记。
