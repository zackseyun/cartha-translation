  source_fidelity: 正文将γυνὴ ἀντίζηλος ἐπὶ γυναικί处理为“妻子若嫉妒另一个女人”，基本把握了关系方向，却无根据地加入条件词“若”，并将原文的名词性断语改成条件—结果句。“使人”虽可由汉语补足，仍略强化了原文未明说的受事。末句“抽打所有人”是可成立的解释，但πᾶσιν ἐπικοινωνοῦσα的语义与其所指对象均有真实歧义，不宜在正文中完全定为实际鞭打众人。
