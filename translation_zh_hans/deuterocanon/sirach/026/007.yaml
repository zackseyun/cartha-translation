  terminology: “嫉妒”“另一个女人”“心痛和悲伤”可用，并借脚注保留“争竞”及“女人／妻子”的可能。“舌头如鞭子”恰当保留伤人言语的隐喻。末句改为“波及众人”，仍是连贯的上下文理解，但脚注明确说明并非唯一句法分析。
