  rationale: 删除原文没有的“若……就……”条件关系，恢复箴言式的陈述。末句将“抽打所有人”收敛为“波及众人”，以保留“舌头的鞭子”的意象和最连贯的语境理解，同时不把困难的ἐπικοινωνοῦσα完全定死。脚注a避免把竞争限定为“争宠”，并继续保留“女人／妻子”的歧义。
