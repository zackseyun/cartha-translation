base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/007.yaml
  text: A jealous wife is heartache and grief when set against another woman[b][a], and a scourge of the tongue that associates with everyone.
translation:
  language: zh_hans
  text: 嫉妒另一个女人的妻子，带来心痛和悲伤[a]；她的舌头如鞭子，波及众人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与另一个女人相争的妻子，带来心痛和悲伤。”这里的希腊文十分简练；“女人”也可理解为“妻子”。ἀντίζηλος可指嫉妒，也可指彼此争竞。
    reason: lexical_alternative
  - marker: b
    text: 本句希腊文较难确定，字面近于“舌头的鞭子，与众人相通（或：同众人交往）”。这里按上下文译作伤人的言语波及众人；语法上也可能是说这女人与所有人交往。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλγος καρδίας
  choice: 心痛
  rationale: 直译为“心的痛苦”，在现代汉语中“心痛”自然地表达内心的痛楚，并保留原文意象。
- source_word: πένθος
  choice: 悲伤
  rationale: 该词可指悲痛、哀伤或哀悼；此处与“心痛”并列，用“悲伤”既自然，也不把含义限定为礼仪性的举哀。
- source_word: γυνὴ ἀντίζηλος
  choice: 妻子若嫉妒
  rationale: γυνή可指女人或妻子，ἀντίζηλος兼有嫉妒和争竞之意。婚姻语境中译作“妻子若嫉妒”较自然，同时在脚注保留“争宠的妻子”等可能。
- source_word: ἐπὶ γυναικί
  choice: 另一个女人
  rationale: 介词短语高度压缩，可表示针对、敌对或与另一女人争竞。正文以“嫉妒另一个女人”表达关系方向，却不强行认定对方也是妻子。
- source_word: μάστιξ γλώσσης
  choice: 舌头如鞭子
  rationale: 保留μάστιξ的鞭打隐喻，同时将名词短语转为现代汉语自然的明喻，指伤人的言语。
- source_word: πᾶσιν ἐπικοινωνοῦσα
  choice: 抽打所有人
  rationale: 原文末句艰涩，字面涉及“与众人相通、共同有分或交往”。结合“舌头的鞭子”这一意象，正文表达其言语无差别地伤及众人，并以脚注交代字面形式及句法歧义。
theological_decisions:
- issue: 是否把另一名女人明确认定为另一位妻子
  choice: 不在正文中限定为另一位妻子
  alternative: 译作“与另一个妻子争宠的妻子”
  rationale: γυνή可指女人或妻子，ἐπὶ γυναικί也未明确说明家庭结构；避免将多妻处境强加给原文。
- issue: 末句所修饰的对象及具体含义
  choice: 按伤人的言语波及所有人来译
  alternative: 按该女人“与所有人交往”来译
  rationale: ἐπικοινωνοῦσα在性、数、格上既可能与γυνή呼应，也可能与同为阴性的μάστιξ呼应，语义亦不寻常。正文采用与“舌头如鞭子”最连贯的理解，脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保持原句的两幅强烈意象——内心的痛楚与舌头的鞭打——但不把“另一个女人”限定为另一位妻子。两个脚注分别说明争竞关系和末句句法、词义上的真实歧义。
