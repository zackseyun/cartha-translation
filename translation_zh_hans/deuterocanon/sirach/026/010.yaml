  yaml_path: translation/deuterocanon/sirach/026/010.yaml
  text: A woman's sexual immorality is known by the lifting of her eyes[b][a], and by her eyelids.
translation:
  language: zh_hans
  text: 妇人的淫乱显在她游移的目光中[a]，也会从她的眼睑看出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“抬起的目光”“不安的眼神”或“傲慢的眼神”。这里的希腊词较难确定，可指眼睛上抬、游移或流露某种意味。
    reason: lexical_alternative
  - marker: b
    text: 直译“在她的眼睑中”；这里可能是以眼睑代指眼部神态或目光。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορνεία
  choice: 淫乱
  rationale: 该词泛指不正当的性行为；“淫乱”在现代汉语中简明、庄重，也不把含义局限为卖淫。
- source_word: γυναικὸς
  choice: 妇人的
  rationale: 无冠词属格在此具有泛指和所有关系，符合智慧文学箴言式表达。
- source_word: ἐν μετεωρισμοῖς ὀφθαλμῶν
  choice: 显在她游移的目光中
  rationale: μετεωρισμοῖς可指抬起、浮动或不安定的动作；“游移的目光”保留眼睛动作的形象，同时不武断限定为傲慢或挑逗。
- source_word: βλεφάροις
  choice: 眼睑
  rationale: 按希腊文保留具体身体意象；此处可能借眼睑转指眼部神态或目光。
- source_word: γνωσθήσεται
  choice: 会……看出来
  rationale: 未来被动式在箴言中表达一般规律；汉语用“会……看出来”既保留可被识别之意，也自然体现格言语气。
theological_decisions:
- issue: 智慧文学中πορνεία所表达的道德范畴
  choice: 淫乱
  alternative: 卖淫；私通；不贞
  rationale: 本节作概括性的道德观察，并未限定某一种具体性行为；“淫乱”保留其宽泛含义，不额外引入更狭窄的法律或宗派解释。
translation_notes:
  register: 采用现代、庄重而通俗的箴言式表达。“显在……中”与“会从……看出来”呼应希腊文重复的ἐν及末尾被动动词，同时通过脚注保留μετεωρισμοῖς的词义不确定性。
