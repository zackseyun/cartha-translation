  text: 有三件事使我心里害怕；至于第四个，我便祈求：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τριῶν
  choice: 有三件事使
  rationale: ἀπό与数词在这里引出造成惧怕的事物。汉语补出“件事”，并用使动结构自然表达其因由，不预先限定下文所列内容。
- source_word: εὐλαβήθη
  choice: 害怕
  rationale: εὐλαβέομαι可指谨慎、敬畏或恐惧；此处语境是令人不安的处境，因此译作普通而明确的“害怕”，不取宗教性的“敬畏”。
- source_word: ἡ καρδία μου
  choice: 我心里
  rationale: 保留“心”作为内在感受所在的意象，同时采用现代汉语自然的“我心里”，避免生硬的“我的心”。
- source_word: ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: 面对第四张脸
  rationale: πρόσωπον直义为“脸”，也可指“人”或“面貌”；ἐπί在此可表达面对、关于。正文保留不寻常的“脸”这一形象，并以脚注说明其他可能理解。
- source_word: ἐδεήθην
  choice: 我便祈求
  rationale: δέομαι可表示恳求或祈求。原文没有明说祈求的对象，故译作“祈求”而不补出“向上帝”，以保留原文的含蓄。
theological_decisions:
- issue: ἐπὶ τῷ τετάρτῳ προσώπῳ中“第四张脸”的解释
  choice: 正文保留“面对第四张脸”
  alternative: “对于第四个人”或更宽泛的“遇到第四件事”
  rationale: 这不是主要教义问题，却是实际的释义难点。πρόσωπον兼有“脸”和“人”之义，且上下文将列举人物或类型；保留“脸”可避免在正文中提前消解原文的多义性，脚注则提供自然的可能解释。
- issue: ἐδεήθην的祈求对象
  choice: 不补出祈求对象
  alternative: “我便向上帝祷告”
  rationale: 动词可用于向上帝祷告，但本句未明说对象；不补出“上帝”可避免把语境推断写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“有三件事使我心里害怕”比逐词直译更自然；“面对第四张脸”刻意保留原文突兀的形象，并由脚注帮助普通读者理解。分号呈现两个并列分句，句末冒号承接下文的列举。
