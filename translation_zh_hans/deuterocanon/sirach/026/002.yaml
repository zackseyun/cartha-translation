revisions:
- from: 贤能的妻子使丈夫身心丰润，他一生的岁月必过得舒心[a]。
  to: 贤能的妻子使丈夫喜乐；他一生的岁月必在愉悦中度过[a]。
  rationale: 修订移除“身心”这一无原文依据且不自然的具体化表达，以“使丈夫喜乐”自然呈现本句所表达的积极结果，并与希腊文平行本相互印证。末句改为“在愉悦中度过”，更贴近希伯来文“在宜人/愉悦的事物（境况）中”，同时保留希腊文“平安”的异读脚注。
