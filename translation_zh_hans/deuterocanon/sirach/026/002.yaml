  text: A capable wife gladdens her husband, and he will spend his years in pleasantness.
translation:
  language: zh_hans
  text: 贤能的妻子使丈夫喜乐；他一生的岁月必在愉悦中度过[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他必在平安中度尽自己的年岁。”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: 贤能的妻子
  rationale: חַיִל在此兼有能力、才干、品格与可贵之意；“贤能”是现代汉语中自然而庄重的表达，也与智慧文学语境相称，不把它窄化为军事性的“勇武”。
- source_word: תְּדַּשֵּׁן
  choice: 使丈夫身心丰润
  rationale: 该动词本义涉及使肥沃、丰足、兴旺，引申为使人得到滋养、喜乐。译作“身心丰润”保留希伯来语的丰盛意象，同时涵盖希腊文εὐφραίνει所强调的喜乐效果，避免只译成物质上的“富足”。
- source_word: לְבַעֲלָהּ
  choice: 丈夫
  rationale: בעל在这里明确指“丈夫”；汉语直接作动词宾语最自然。
- source_word: וּשְׁנֵי חַיָּיו
  choice: 他一生的岁月
  rationale: 较完整地体现原文“他生命的年岁”，并保持自然的现代汉语表达。
- source_word: יְבַלֶּה
  choice: 必过得
  rationale: 此处表示度过、消磨人生年日；结合后面的状态词，汉语用“过得”自然贴切。
- source_word: בַנְעִימִים
  choice: 舒心
  rationale: נְעִימִים表示愉悦、宜人、可喜的境况。“舒心”既通俗自然，又保留生活安适愉悦之意；希腊文的“平安”作为异文另注。
theological_decisions:
- issue: 末句希伯来文与希腊文的差异
  choice: 正文依希伯来文译为“舒心”
  alternative: 依希腊文译为“平安”
  rationale: 现存希伯来文在此可信度高，בַנְעִימִים指愉悦、宜人的境况；希腊文ἐν εἰρήνῃ则作“在平安中”。正文优先采用希伯来文，同时以脚注保存希腊传统的不同读法，不消除文本见证之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“贤能”凝练表达妻子的才干与品格；“身心丰润”有意保留希伯来文的丰盛意象，而不将其限于经济富裕。脚注标记[a]置于与希腊文差异相关的末句之后。
