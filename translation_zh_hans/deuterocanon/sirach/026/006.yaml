  yaml_path: translation/deuterocanon/sirach/026/006.yaml
  text: Slander in a city[a], and an assembly of a mob, and a false accusation—all these are worse than death.
translation:
  language: zh_hans
  text: 城中的诽谤[a]、人群的集会和诬告——这一切都比死亡更糟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文是高度凝缩的并列清单，直译近似“城的诽谤、人群的集会”。其中属格关系没有明说；“城的诽谤”也可理解为关于一座城的诽谤，或出现在城中的诽谤。正文采用后一种较自然的表达。
    reason: 保留原文省略式属格结构的歧义，并说明正文为符合现代汉语而作的表达。
lexical_decisions:
- source_word: διαβολὴν
  choice: 诽谤
  rationale: 指以恶意言语毁损他人名誉或作出诋毁性指控；“诽谤”简洁自然，也符合本节列举社会祸患的语气。
- source_word: πόλεως
  choice: 城里的
  rationale: 属格表达高度凝缩，关系略有省略；译作“城里的”保留其地点或社会环境之意，同时不武断地解释为“针对全城”。
- source_word: ἐκκλησίαν
  choice: 集会
  rationale: 此处泛指人群聚集，不宜带入后来的教会专门含义；“集会”既正式又符合语境。
- source_word: ὄχλου
  choice: 乌合之众的
  rationale: ὄχλος本可指群众或人群；在本节负面事物的并列中，译作“乌合之众”传达混乱、危险的群体色彩，但仍以脚注提示原词也可较中性地理解。
- source_word: καταψευσμόν
  choice: 诬告
  rationale: 指用虚假言辞攻击或控告别人；“诬告”比一般的“谎言”更准确，也与前面的“诽谤”有所区别。
- source_word: ὑπὲρ θάνατον
  choice: 比死亡更
  rationale: ὑπέρ在此构成比较，表示在坏处或严重程度上超过死亡。
- source_word: πάντα μοχθηρά
  choice: 这一切都……可怕
  rationale: πάντα回指前三项；μοχθηρά可表示坏、邪恶、痛苦或严重。结合比较结构，现代汉语以“这一切都比死亡更可怕”自然传达其总体判断。
theological_decisions:
- issue: 是否把ἐκκλησία理解为宗教性会众
  choice: 译作一般性的“集会”
  alternative: 会众／教会
  rationale: 智慧文学语境与ὄχλος的搭配都支持普通集会之义；采用宗教专称会引入原文未明确表达的后期教会含义。
- issue: πόλεως与διαβολή之间属格关系
  choice: 以地点性表达“城里的诽谤”
  alternative: 对一座城的诽谤／一城所作的诽谤
  rationale: 希腊文关系凝缩而含混；正文采用自然且较少过度解释的地点读法，并用脚注保留其他语法可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“乌合之众”体现ὄχλος在此负面语境中的贬义；破折号清楚标示末句对前三项的总结。
