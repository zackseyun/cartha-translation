  text: Whether rich or poor[a], a good heart has a cheerful face at all times.
translation:
  language: zh_hans
  text: 无论贫富[a]，善良的心总有喜乐的面容。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文结构简练，也可较直译为：“富人和穷人的心是美善的；无论何时，面容都是喜乐的。”
    reason: 保留原文中贫富对举与后续两个无动词短语之间的句法歧义。
lexical_decisions:
- source_word: πλουσίου δὲ καὶ πτωχοῦ
  choice: 无论贫富
  rationale: πλουσίου与πτωχοῦ构成贫富对举；希腊文结构简练，译作“无论贫富”能以自然汉语表达不受经济境况限制的意思。δέ在此可作轻微承接，不必硬译为“但是”。
- source_word: καρδία ἀγαθή
  choice: 善良的心
  rationale: 保留καρδία的“心”这一具体意象，并以“善良”表达ἀγαθή所指的内在美善，不将其缩减为单纯的情绪或健康状态。
- source_word: ἐν παντὶ καιρῷ
  choice: 总
  rationale: 该短语直指“在任何时候”；“总”在现代汉语中简洁自然地传达持续、普遍的时间意义。
- source_word: πρόσωπον ἱλαρόν
  choice: 喜乐的面容
  rationale: πρόσωπον是“脸、面容”，ἱλαρόν表示愉悦、欢欣；“喜乐的面容”既保留外在表情的意象，也保持庄重自然的经文语体。
theological_decisions:
- issue: 贫富、内心美善与喜乐面容之间的句法关系
  choice: 将“无论贫富”理解为适用于“善良的心”的处境限定，同时保留内在品格与外在神情之间的关联
  alternative: 较直译地理解为“富人和穷人的心是善的；无论何时，面容都是喜乐的”
  rationale: 原文为无动词的压缩结构，属格πλουσίου καὶ πτωχοῦ与后文的确切句法关系并不完全明说。正文采用较通顺且符合语境的理解，脚注注明更贴近字面的可能表达，避免把歧义悄然消除。
translation_notes:
  register: 采用现代、简洁而庄重的普通话。“无论贫富”是自然的成对表达；“善良的心”和“喜乐的面容”保留原文由内而外的具体意象。
