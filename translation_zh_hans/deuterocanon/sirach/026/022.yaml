  text: One who turns back from righteousness to sin—the Lord will prepare him for the sword[a].
translation:
  language: zh_hans
  text: 从公义转回罪中的人，主必预备他面对刀剑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转回”所译希腊文直义可指“带回、领回”。原文未明说其宾语；因此也可理解为“把（某人）从公义带回罪中的人”。
    reason: 保留 ἐπανάγων 的主动、使役性基本义，以及原文宾语未明所造成的歧义；正文则采用与后文代词衔接自然的理解。
lexical_decisions:
- source_word: ἐπανάγων
  choice: 把人……引回……的
  rationale: 该词是主动语态现在分词，基本义为“带回、领回”。译文保留其使役意味；希腊文未明说被引回的是谁，因此“人”只作为汉语表达所需的泛指宾语，并在脚注说明也可能指本人回转。
- source_word: δικαιοσύνης
  choice: 公义
  rationale: 这里与“罪”形成道德和宗教层面的对照；“公义”既符合智慧文学语境，也比单指司法公平的“正义”更贴切。
- source_word: ἁμαρτίαν
  choice: 罪中
  rationale: 直接保留其道德—宗教含义；“从公义……到罪中”自然呈现方向性的对照。
- source_word: ὁ κύριος
  choice: 主
  rationale: 在犹太智慧文学中，这一称谓指上帝；“主”是庄重而通行的圣经用语。
- source_word: ἑτοιμάσει
  choice: 必预备
  rationale: 保留动词“预备、使就绪”的基本意象和将来判断，不将其弱化为单纯的自然后果。
- source_word: εἰς ῥομφαίαν
  choice: 交给刀剑
  rationale: 介词短语直译为“为了刀剑”在现代汉语中生硬；“交给刀剑”表达被预备以遭受刀剑审判，同时保留原文的刀剑意象，未进一步限定为战争、处刑或屠杀。
theological_decisions:
- issue: 主在刀剑审判中的角色
  choice: 明确保留主为行动主体：主预备此人交给刀剑。
  alternative: 将刀剑理解为离弃公义后的一般性后果，而弱化主的直接行动。
  rationale: 希腊文明确以“主”为主语，并使用将来时动词“必预备”；译文保留这种神圣审判的张力，不扩展为完整的报应教义。
- issue: ἐπανάγων所指的是引诱别人还是本人倒退
  choice: 正文优先保留主动使役义“把人引回”，脚注列出反身理解。
  alternative: 译为“从公义退回罪中的人”，理解为此人自己倒退。
  rationale: 分词在形态和通常词义上是主动的“带回、领回”，且原文没有反身代词；但其绝对用法及语境容许反身性理解，故不应静默排除。
translation_notes:
  register: 采用现代、庄重而简洁的智慧文学语体。“凡……的”将希腊文名词化分词自然转成汉语；“必”体现将来审判语气。脚注标记已在正文中以[a]出现。
