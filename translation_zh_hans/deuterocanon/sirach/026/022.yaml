  source_fidelity: 原译将未明示的宾语具体化为“人”，并以“把人……引回”作为正文主解，容易把经文理解为引诱或带领他人犯罪；希腊文主动分词确有“带回、领回”之基本义，但此处宾语未明，且与后文“他”相连时，自身从义路转向罪的理解更自然，也与英文审校轨迹一致。修订正文采用不额外指定受事者的自然汉语表达，并以脚注保留主动、使役性的词汇歧义。
