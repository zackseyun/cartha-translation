base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/028.yaml
  text: 'Over two things my heart is grieved[a], and over a third anger has come upon me: a warrior brought low by poverty, and men of understanding if they are treated like refuse[b], and one who turns back from righteousness to sin—the Lord will prepare him for the sword.'
translation:
  language: zh_hans
  text: 有两件事使我心里忧伤，第三件事使我怒气上涌：战士因贫困而落魄，明达的人若被视为废物[a]，以及从义回转而转向罪恶的人——主必使他面临刀剑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“被当作垃圾”或“被当作粪土丢弃”。希腊文动词源于表示废物或秽物的词，强调受人鄙弃和贬损。
    reason: lexical_alternative
  - marker: b
    text: 末句的“他”是单数，最自然地指从义回转而转向罪恶的人；不过，希腊文的列举句法十分紧凑，也有人可能把这句审判的话理解为对整段列举的总结。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπὶ δυτὶ λελύπηται ἡ καρδία μου
  choice: 有两件事使我心里忧伤
  rationale: 以自然的现代汉语表达希腊文所描述的持续忧伤状态，同时保留以“两件事”引出列举的智慧文学句式。
- source_word: ἐπὶ τῷ τρίτῳ θυμός μοι ἐπῆλθεν
  choice: 第三件事更使我怒气上涌
  rationale: “怒气上涌”保留 θυμός 临到或涌上说话者心头的动态意象；“更”体现第三件事相对于前两件事引发更强烈反应的语势。
- source_word: ἀνὴρ πολεμιστὴς ὑστερῶν διʼ ἔνδειαν
  choice: 战士因贫困而落魄
  rationale: “战士”简洁对应 ἀνὴρ πολεμιστής；“因贫困而落魄”兼顾 ὑστερέω 的匮乏与处境下降之意，并明确 διʼ ἔνδειαν 所表达的原因。
- source_word: ἄνδρες συνετοὶ
  choice: 明达的人
  rationale: συνετός 指有理解力和辨识力；“明达”既含聪慧也含通达判断，语体庄重而不古奥。希腊文复数在汉语中可由“的人”自然表达。
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: 被当作废物
  rationale: 该动词源于表示垃圾、秽物或弃物的 σκύβαλον，含受鄙弃、贬损之意。“被当作废物”自然清楚，并保留受人轻蔑践踏的力度。
- source_word: ἐπανάγων ἀπὸ δικαιοσύνης ἐπὶ ἁμαρτίαν
  choice: 从义转向罪恶的人
  rationale: “转向”表达从一种道路回转至另一种道路的方向变化；“义”在此指合乎正道的品行与状态，与“罪恶”形成道德和宗教层面的对照。
- source_word: ὁ κύριος
  choice: 主
  rationale: κύριος 在此指上帝；译作“主”符合中文圣经语体，也不额外引入希伯来文神名的排印惯例。
- source_word: ἑτοιμάσει εἰς ῥομφαίαν αὐτόν
  choice: 必预备他受刀剑之灾
  rationale: 保留 ἑτοιμάσει 的“预备”意象和 εἰς ῥομφαίαν 所指向的刀剑刑罚；加入“之灾”使中文通顺，同时维持其不祥的审判语气。
theological_decisions:
- issue: 末句单数代词 αὐτόν 的所指
  choice: 正文让“他”就近指从义转向罪恶的人
  alternative: 也可能把末句理解为对整个列举的总结性审判，或认为压缩的句法特别突出了第三种人
  rationale: αὐτόν 是阳性单数，紧接单数的分词结构 ἐπανάγων，最自然地指第三种人。正文以破折号保留希腊文突转的语势，脚注则说明句法的压缩性，避免把可能的范围解释得过死。
- issue: δικαιοσύνη 的译法
  choice: 义
  alternative: 正义；正直
  rationale: 本节将 δικαιοσύνη 与 ἁμαρτία 对举，重点是从合乎正道的生活退入罪恶，而不只是社会司法意义；“义”能保留其较宽广的道德—宗教内涵。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“落魄”“明达”“刀剑之灾”保持智慧文学的凝练和警戒语气；句中以冒号列举三项，以破折号呈现末尾审判宣告的突然转折。脚注标记均置于正文对应歧义之后。
