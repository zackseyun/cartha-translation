  text: A wife's grace delights her husband[a], and her understanding puts flesh on his bones.
translation:
  language: zh_hans
  text: 妻子的温雅使丈夫喜悦；她的见识使他的骨头肥壮。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的知识使他的骨头肥壮”。希腊文保留“使骨头肥壮”的身体比喻，表达有见识的妻子使丈夫得到滋养、变得强健。
    reason: 说明ἐπιστήμη可译为“知识”，并交代πιανεῖ与“骨头”所构成的、在现代汉语中略显突兀的身体隐喻。
lexical_decisions:
- source_word: χάρις
  choice: 温雅
  rationale: 此处指妻子令人愉悦的优美品格与亲和风度，并非救恩意义上的“恩典”。“温雅”兼顾道德与审美意味，也符合现代汉语表达。
- source_word: γυναικός
  choice: 妻子
  rationale: γυνή可指“女人”或“妻子”；同句明确提到“她的丈夫”，因此按婚姻语境译为“妻子”。
- source_word: τέρψει
  choice: 使……喜悦
  rationale: τέρπω表示使人欢喜、愉悦；这里的将来时具有格言式陈述的作用，汉语无需显明将来时态。
- source_word: ἐπιστήμη
  choice: 明达
  rationale: 该词可指知识、理解或识见。在智慧文学的家庭语境中，“明达”比单纯的“知识”更能体现有见识、善判断的实际智慧。
- source_word: πιανεῖ
  choice: 使……丰润
  rationale: 该动词本义为使肥壮、丰盈。译作“丰润”保留身体得滋养、强健的意象，同时避免现代汉语中“把骨头养肥”的突兀感。
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: 他的骨头
  rationale: 直译“他的骨头”，保留希腊文本中具体的身体隐喻，不将其抽象化为“身心”或“生命力”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“温雅”避免把 χάρις 误读为专门的救恩术语；“骨头丰润”保留原文的具象张力，脚注补出更直白的词义。
