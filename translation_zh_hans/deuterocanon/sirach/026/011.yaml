  text: Keep strict watch over a headstrong daughter[a], lest, finding freedom for herself, she make use of it.
translation:
  language: zh_hans
  text: 对刚愎的女儿，要严加看守[a]，免得她一有了自由，便加以利用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译可作：“对不肯转变的女儿，要使看守坚固，免得她为自己找到了宽松，就加以利用。”原文较为简练；末句“加以利用”的对象，是她所得的自由或宽松。
    reason: 说明ἀδιατρέπτως、στερέωσον φυλακήν和ἄνεσιν的字面含义，并交代χρήσηται所省略宾语回指前面的“自由／宽松”。
lexical_decisions:
- source_word: ἐπὶ θυγατρὶ
  choice: 对……女儿
  rationale: ἐπί加与格在此标明看守的对象；汉语用“对……女儿”自然清楚。
- source_word: ἀδιατρέπτως
  choice: 刚愎的
  rationale: 该词形式虽为副词，但语义指向女儿不肯转变、不受劝导的性情；“刚愎”保留其顽固、不易约束之意，同时避免加入原文没有的具体行为。
- source_word: στερέωσον φυλακήν
  choice: 要严加看守
  rationale: 字面为“使看守坚固”；“严加看守”以现代汉语保留命令语气、看守意象和加强力度。
- source_word: ἵνα μὴ
  choice: 免得
  rationale: 自然表达否定目的或防范结果，并保持经文的警戒语气。
- source_word: εὑροῦσα ἄνεσιν
  choice: 一有了自由
  rationale: ἄνεσις可指宽松、松弛或脱离约束；在看守的语境中，“有了自由”最能体现限制被放松，但其具体性质仍留有余地。
- source_word: ἑαυτῇ χρήσηται
  choice: 就任意利用
  rationale: χράομαι意为“使用、利用”；ἑαυτῇ带有为自己、由自己支配的意味。“任意利用”自然承接前面的自由，也表达自行运用的语势。
