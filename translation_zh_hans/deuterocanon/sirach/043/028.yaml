  yaml_path: translation/deuterocanon/sirach/043/028.yaml
  text: Let us still magnify him[a], for we cannot search him out; and he is greater than all his works.
translation:
  language: zh_hans
  text: 我们还要颂扬他[a]，因为我们无法穷究他；他比他所做的一切都伟大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作“我们还要尊为大／继续述说，因为我们无法穷究”；“颂扬”和“穷究”的对象都没有明说。按上下文及希腊文平行文本，这对象是上帝。
    reason: 说明希伯来文省略宾语，并保留נגדלה的词义选择及句法含蓄。
lexical_decisions:
- source_word: נגדלה עוד
  choice: 我们还要颂扬他
  rationale: נגדלה是复数劝勉形式，源自גדל，在此表达继续尊崇、颂扬；עוד表示继续或进一步。“还要颂扬他”在现代汉语中自然庄重，也保留劝勉语气。希伯来文没有明说宾语，因此以脚注注明。
- source_word: כי לא נחקור
  choice: 因为我们无法将他探究透彻
  rationale: חקר指搜寻、考察以至彻底探明。希伯来文省略宾语；上下文及希腊文平行文本都表明所指是上帝。“探究透彻”保留了考察、穷究的意象，没有直接改写成较抽象的“完全理解”。
- source_word: והוא גדול
  choice: 他……伟大
  rationale: גדול本义为“大、伟大”；后接比较结构מכל מעשיו，因此汉语用“比……都伟大”清楚表达比较关系。
- source_word: מכל מעשיו
  choice: 比自己一切的作为
  rationale: מעשים可指行为、作为或所做之工；本段颂赞创造主，“一切的作为”既能涵盖受造之物，也贴近原文较宽的语义范围。使用“自己”清楚回指同一主语，避免汉语中“他比他……”的歧义。
theological_decisions:
- issue: “无法探究”所省略的宾语
  choice: 正文补出“他”，指上帝自己；脚注说明原文省略宾语。
  alternative: 保留无宾语结构，译作“因为我们无法探究透彻”；或理解为“无法穷究他的伟大”。
  rationale: 希伯来文在语法上没有明说宾语，因此不应掩盖这一点；但本节上下文和希腊文平行文本使上帝成为最自然的所指。正文补出“他”可使现代汉语通顺，脚注则保留原文的含蓄与可能张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“颂扬”比直译式的“使之为大”自然，也比“夸大”更符合敬拜语境；分号保留原文后半句既承接又总结的节奏。
