base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/027.yaml
  text: 'We could say more than these[a], but there would be no end[b]; and the conclusion of the matter is: all is he.'
translation:
  language: zh_hans
  text: 我们还可以述说许多这样的事[a]，却总也说不尽；总而言之：他就是一切[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语可较直译为“还要加上这类的事”；希腊语平行文本作“我们会说许多，却不能达到尽头”。
    reason: alternative_reading
  - marker: b
    text: 或译：“他是全部”或“他是万有。”原文极为简练；希腊语平行文本作“他自己就是一切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוד כאלה
  choice: 还可以述说许多这样的事
  rationale: 希伯来语指更多同类之事；希腊语平行文本以“我们会说许多”明确了持续述说的语境。译文保留“这样的事”的比较指向，并用自然汉语表达。
- source_word: לא נוסף
  choice: 却总也说不尽
  rationale: 现存希伯来语措辞简约且略显生硬，字面涉及“增添”；希腊语平行文本表明其意为无论说多少也达不到尽头。“总也说不尽”兼顾上下文与汉语表达。
- source_word: וקץ דבר
  choice: 总而言之
  rationale: קץ可指终点或结论，דבר可指话语、事情或论述。此处是对整段赞歌的总结，因此采用凝练而自然的总结语。
- source_word: הוא הכל
  choice: 他就是一切
  rationale: 希伯来语以简短有力的方式把“他”与“一切/全体”并置；希腊语平行文本也明确以“他自己”为主语。此译保留原文强烈而含蓄的神学张力，不加解释性限定。
theological_decisions:
- issue: 末句关于上帝与“一切”的关系
  choice: 他就是一切
  alternative: 他是全部；一切都在于他
  rationale: 原文是高度压缩的颂赞性断言。译作“他就是一切”保留其直接性和可能引发的神学张力；不改写为“万有都是他所造”或“他超越万有”，以免加入原文未明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“述说”呼应赞美创造的上下文；分号和“总而言之”呈现由无法穷尽的列举转入末句总结的结构。
