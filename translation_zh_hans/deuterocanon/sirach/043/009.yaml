base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/009.yaml
  text: The splendor of the heavens and the majesty of the stars—its light shines brightly in the heights of God[a][b].
translation:
  language: zh_hans
  text: 天穹的华美，星辰的荣光；其光在上帝的高天闪耀。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马萨大抄本在本节开头保存了不同的读法，大意为“……天的华美和一颗星的荣光”；开罗藏经库希伯来文本则作“天穹的华美，星辰的荣光”。正文依据这一区域中较有支持的希伯来文本；希腊文平行文本的复数“星辰”也支持集合意义。
    reason: textual_variant
  - marker: b
    text: 希腊文平行文本作：“天的美丽，星辰的荣耀，发光的装饰；在至高处，主。”它印证了天上光体如明亮装饰的意象，但正文仍依现存希伯来文本措辞翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: תואר
  choice: 华美
  rationale: 此处指天穹可见的美丽与壮观；“华美”既保留审美意味，也符合诗歌语体。
- source_word: שמים
  choice: 天穹
  rationale: 希伯来语形式为复数，但通常整体指天空或诸天；“天穹”在现代汉语中自然、庄重，并适合这里的天象描写。
- source_word: הדר
  choice: 荣光
  rationale: 该词表达庄严、显赫的美；“荣光”与前面的“华美”有所区别，也保留高昂的诗意。
- source_word: כוכב
  choice: 星辰
  rationale: 希伯来文本采用单数形式，但可作集合意义；希腊平行文本也用复数。“星辰”自然表达群星，同时不把诗句局限为一颗星。
- source_word: ואורו
  choice: 其光
  rationale: 希伯来语代词后缀为单数。“其光”保留这一形式及所指对象的含混性，可理解为星辰整体或眼前的天上景象之光，避免擅自改成明确复数。
- source_word: מזהיר
  choice: 闪耀
  rationale: 该分词表示发出明亮的光。“闪耀”简洁而富有画面感，不额外加入程度副词。
- source_word: במרומי אל
  choice: 在上帝的高天
  rationale: 保留原文明确出现的 אל，并把 מרומים 所指的崇高领域译为“高天”；此表达比直译“上帝的高处”更符合现代汉语。
theological_decisions:
- issue: במרומי אל 中 אל 的译法
  choice: 上帝
  alternative: 大能者；至高处
  rationale: 原文明确包含神圣称谓 אל。“上帝”是透明、通行的现代汉语译法；省去神称或只译作“至高处”会损失原文信息，而“大能者”在此不如“上帝”自然。
- issue: ואורו 的单数所指
  choice: 其光
  alternative: 它的光；群星的光
  rationale: 原文后缀为单数，但前文意象可能具有集合性。“其光”不强行判定它究竟回指一颗星、星辰整体，还是整个天上景象，从而保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学诗歌语体。“天穹—星辰—高天”形成连贯的天象意境；分号呈现两组名词短语与后半句之间的诗行转折。“其光”刻意保留希伯来语单数代词所指的含混性。
