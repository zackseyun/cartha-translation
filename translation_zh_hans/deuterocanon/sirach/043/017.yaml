  text: At the flash he shakes out snow[a], and like locusts it settles where it stays.
translation:
  language: zh_hans
  text: 在闪光之时，他抖落雪[a]；雪如蝗虫般栖居在自己的居所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处的希伯来文见证较难理解，且与希腊文平行文本显著不同。希腊文则说：“他的雷声斥责大地；又有北风的风暴和旋风。”马萨达所见的另一希伯来文见证在此也保存了不同的句子，其部分文字作“雷声”，而开罗藏经库文本作“在闪光之时”。
    reason: textual_variant
lexical_decisions:
- source_word: ברשף
  choice: 闪光中
  rationale: רשף可指火光、闪光或类似闪电的光芒；在气象语境中译作“闪光中”，既保留简练的时间或伴随意味，也不武断限定为闪电。
- source_word: יניף
  choice: 他抖落
  rationale: 该动词有挥动、举动、使飞散之意；以雪为宾语时，“抖落”自然地表现雪被撒落、扬散的图景。
- source_word: שלגו
  choice: 雪花
  rationale: 原文直译为“他的雪”。汉语气象描写中通常不必明说所属；“雪花”也与后文如蝗虫般纷纷落下的形象相称。
- source_word: וכארבה
  choice: 像蝗虫一样
  rationale: ארבה通常指蝗虫，既可有集合意味，也可指成群的蝗虫；此译保留原比喻而不额外加入“成群”。
- source_word: ישכון
  choice: 落下，停在
  rationale: שכן本义为居住、安居、停驻。在雪的语境中，用“落下，停在”表达其降落后驻留的状态，同时保留与“栖身之处”的居住意象。
- source_word: דירתו
  choice: 栖身之处
  rationale: דירה意为住处、居所。译作“栖身之处”保留原文拟人化和居住语义，也不掩盖这一希伯来语句本身略显费解的特点。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本显著不同
  choice: 正文以开罗藏经库所存希伯来文为主，译为闪光、降雪和蝗虫比喻。
  alternative: 依希腊文译为他的雷声斥责大地，以及北风的暴雨和旋风。
  rationale: 本节有可用的希伯来见证，应优先据其翻译；但希腊文本保存了完全不同的气象描写，且马萨达希伯来残文也有“雷声”一类异文，因此以脚注明确交代，不将各见证暗中调和。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“抖落雪花”使气象图景自然清楚；后半句保留“蝗虫”和“栖身”的鲜明比喻及原文张力。脚注标记[a]已置于相关短语之后。
