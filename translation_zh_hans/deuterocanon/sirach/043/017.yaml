review_pass:
  verdict: revise
  source_fidelity: 译稿前半句基本遵循现存开罗藏经库希伯来见证，但“雪花”将泛称的“雪”缩小化，“落下”则是原文未明说的动作。后半句的居住意象应保留，同时不应借“落下”调和或补足困难的希伯来句法。
  naturalness: “闪光中”可懂，但“在闪光之时”较符合现代汉语；“停在栖身之处”略显重复且“栖身”带有无所依凭的语感。以“栖居在自己的居所”保留原文的拟人化张力，语义更清楚。
  terminology: “蝗虫”恰当。正文应使用“雪”而非“雪花”。脚注中的希腊文καταιγίς宜译作“风暴”而非限定为“暴雨”；其动词意思为“斥责”，应如实说明。
  issues:
  - severity: medium
    issue: 后半句加入“落下”
    rationale: ישכון的核心义为居住、安顿或停驻，并不直接表示降落。虽然气象语境可使人联想到降雪，但本节文本困难且与希腊文严重分歧，不宜在正文增添未明说的动作。
  - severity: low
    issue: “雪花”缩小了“雪”的范围
    rationale: שלג意为雪；中文“雪花”并非严重误译，但把整体降雪现象具体化为单个雪片，较原文狭窄。
  - severity: medium
    issue: 脚注将希腊文风暴译作“暴雨”且未说明“斥责”
    rationale: καταιγίς可指风暴，不必限定为雨；ὠνείδισεν意为斥责、责备。脚注应准确呈现异文，避免使读者误以为希腊文只是一般地描述雷声。
  revised_text: 在闪光之时，他抖落雪[a]；雪如蝗虫般栖居在自己的居所。
  revised_footnotes:
  - marker: a
    text: 此处的希伯来文见证较难理解，且与希腊文平行文本显著不同。希腊文则说：“他的雷声斥责大地；又有北风的风暴和旋风。”马萨达所见的另一希伯来文见证在此也保存了不同的句子，其部分文字作“雷声”，而开罗藏经库文本作“在闪光之时”。
    reason: textual_variant
  revision_rationale: 修订以开罗藏经库希伯来文本为正文依据：ברשף译为“在闪光之时”，יניף译为“抖落”，并保留雪与蝗虫的比喻。删除原文未直述的“落下”，以“栖居在自己的居所”对应ישכון דירתו的居住意象，虽保留其本有的费解和拟人化，仍使汉语可读。脚注准确交代希腊文及马萨达见证的重大异读，而不在正文混合各文本。
