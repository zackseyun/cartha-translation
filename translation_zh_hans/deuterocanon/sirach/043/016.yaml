base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/016.yaml
  text: At the sound of his thunder the earth writhes[b][a]; the blasts of the north are storm and tempest.
translation:
  language: zh_hans
  text: 他的雷声一响，大地就震颤[a]；北方的狂风乃是暴风和风暴[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “震颤”所译的希伯来语动词也可译作“战抖”“摇撼”，并可带有痉挛或产痛般扭动的形象。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本作：“他显现时，群山必震动；南风照他的旨意吹起。”这与现存希伯来文差异很大；希伯来文下半句说北方的狂风乃是暴风和风暴。
    reason: alternative_reading
lexical_decisions:
- source_word: קול רעמו
  choice: 他雷声一响
  rationale: קול在此指雷鸣的声响，רעמו带第三人称单数所有格，语境所指为上帝。译成“他雷声一响”自然凝练，并保留神圣归属。
- source_word: יחיל
  choice: 震颤
  rationale: חיל/חול可指颤抖、扭动或如产痛般痉挛。“震颤”既适合以“大地”为主语，也保留强烈而近乎痉挛的动态；脚注说明其他可能译法。
- source_word: ארצו
  choice: 大地
  rationale: 形式上带所有格后缀，可直译“他的大地/土地”；在宇宙颂歌中指大地整体。汉语省略所有格更自然，也避免误解为局部疆土。
- source_word: זלעפות צפון
  choice: 北方的狂风
  rationale: זלעפות可指猛烈、灼烈的阵风，צפון字面为“北方”，在此具有气象含义。“北方的狂风”传达风向和猛烈程度，而不武断加入热风意象。
- source_word: סופה וסערה
  choice: 暴风和风暴
  rationale: 两个词义域重叠，均可指猛烈风雨、旋风或风暴。采用两个相近词保留希伯来文的并列加强效果，不刻意制造原文没有的明确分类。
theological_decisions:
- issue: 气象意象中的神圣所有格
  choice: 在“他雷声”中保留神的所有格，在“大地”前不重复“他的”
  alternative: “听见他的雷声，他的大地就震颤”
  rationale: רעמו明确把雷归于上帝，宜保留；ארצו虽也有所有格，但汉语连续重复会显笨重，并可能使“大地”被误读为某一特定领土。
- issue: 希伯来文与希腊文传统重大差异
  choice: 正文依现存希伯来文，写北方狂风与暴风；希腊文异读收入脚注
  alternative: 依希腊文译作“他显现时，群山必震动；南风照他的旨意吹起”
  rationale: 项目原则是在希伯来文存留且可信时以其为正文；希腊文在两分句均有重大差异，必须完整保存为重要异文，而不能默默调和。
translation_notes:
  register: 采用现代、庄重而清楚的诗体汉语。分号保留两个诗行的平衡；“尽是”表达名词句的断定和加强语气。脚注标记均置于正文相关内容之后。
