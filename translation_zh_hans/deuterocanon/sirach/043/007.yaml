base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/007.yaml
  text: From them come the appointed time and the fixed seasons by statute[b][a], and the work he desired is in its cycle.
translation:
  language: zh_hans
  text: 藉着它们，有指定的时刻和按定例所定的时节[b]；他所愿成就的事，也在其循环中[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文后半句艰涩。开罗藏经库文本大致作：“他所愿的工作……在它的循环中。”希腊文本则作：“月亮是节庆的标志，是一盏在月尽时渐亏的明灯。”
    reason: alternative_reading
  - marker: b
    text: 马萨达卷在这里作：“因为造它的主是伟大的”；开罗藏经库文本的措辞不同，而且较难解释。
    reason: textual_variant
lexical_decisions:
- source_word: בם
  choice: 其中有
  rationale: בם本义可指“在它们之中／借着它们”。希伯来诗句高度凝练；译作“其中有”既保留介词关系，也自然表达天体与历法时序的关联，不把因果关系说得过满。
- source_word: מועד
  choice: 指定的时刻
  rationale: מועד既可指约定或指定的时间，也可特指节庆。此处与“时节／节期”并列，先采用较宽的“指定的时刻”，保留历法意义而不局限为宗教节日。
- source_word: וזמני חוק
  choice: 按定例而定的节期
  rationale: זמנים指时间、季节或节期，חוק带有规定、定例及固定秩序之意。“按定例而定”保留其规范性与固定性；“节期”也与希腊平行文本的“节庆”相呼应。
- source_word: וחפץ עשיו
  choice: 他所愿的工作
  rationale: 抄本措辞和形态均艰涩。此译依现有综合希伯来文本，保留חפץ的意愿义，并以“工作”表达所愿成就之事；不将难解形式武断改释为“创造者”。
- source_word: בתקופתו
  choice: 在它的循环中
  rationale: תקופה可指转动、周期或季节循环；在天文和历法语境中，“循环”最能体现反复运行的周期，同时保留代词所指的不确定性。
theological_decisions:
- issue: 后半句的主语、所指及神学含义
  choice: 正文笼统表达“他所愿的工作”处于其循环中，不明确补出上帝、月亮或创造者。
  alternative: 可依希腊文本译为月亮是节庆的标志、在月末渐亏；也可依马萨达卷理解为“因为造它的主是伟大的”。
  rationale: 开罗藏经库希伯来文本在此艰涩，而希腊平行文本和马萨达异文各呈不同方向。正文优先依所给希伯来文本，不借补词消除其歧义；重要异文在脚注交代。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“指定的时刻／按定例而定的节期”保留诗句的历法语域；后半句刻意保持传世希伯来文的凝练与歧义。脚注标记均已置入正文，并按相关位置排列。
