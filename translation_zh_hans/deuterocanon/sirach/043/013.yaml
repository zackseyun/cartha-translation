  text: By his might he directs the lightning[b][a], and he makes the flashes prevail on high.
translation:
  language: zh_hans
  text: 他以大能为闪电划定路径[a][b]，又使电光在高天逞威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “划定路径”所译的希伯来动词在这里少见，含义不确定，也可能译作“勾画”“引导”或“指定”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本作：“他一声令下，雪便止息；他又催促施行审判的闪电。”本句的希伯来文与希腊文差异很大。
    reason: alternative_reading
lexical_decisions:
- source_word: גבורתו
  choice: 他以大能
  rationale: גְּבוּרָה表示力量、威能；按本句的诗性表达处理为工具意义，表明这一行动凭借上帝的大能而成。
- source_word: תתוה
  choice: 为……划定路径
  rationale: 此动词在这里少见且语义不确定，可能指画出、标定或引导。译作“划定路径”既保留希伯来文可能具有的描画、标定意象，也自然表达上帝支配闪电。
- source_word: ברק
  choice: 闪电
  rationale: 这是表示闪电或电光的常用词；此处泛指自然现象。
- source_word: ותנצח
  choice: 又使……逞威
  rationale: נצח在此可表达占优、得胜或显出强势；“使……逞威”保留其强烈动态意味，也符合上下句中上帝掌管风暴现象的语境。
- source_word: זיקות
  choice: 电光
  rationale: 该词可指火花、闪光或电光；因其与ברק平行，译作“电光”自然且不过度限定具体形态。
- source_word: במרום
  choice: 在高天
  rationale: 字面义为“在高处、在上方”；“高天”保留空间位置和诗体语感，同时避免过度建构具体宇宙观。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本明显不同，且希伯来文动词תתוה含义不确定
  choice: 正文以开罗藏经库希伯来文本为主，保留“为闪电划定路径”的意象
  alternative: 希腊文作：“他一声令下，雪便止息；他又催促施行审判的闪电。”
  rationale: 本节有可信的希伯来文见证，故正文首先依据希伯来文；希腊文并非仅为释义，而是存在显著差异的古代平行文本，因此在脚注中完整说明，不用它默默取代希伯来文。
translation_notes:
  register: 采用现代、庄重而富有诗意的普通话。“划定路径”保留原文少见动词的具象意味；“逞威”传达נצח的强势、占优之义；“高天”兼顾במרום的方位感与诗体节奏。
