  naturalness: “诸天的本体”虽可勉强直译，却在现代汉语中生硬且含混；“诸天的实体”较自然，仍保留原文未明确具体所指的宽度。“万物都听命，以应各种需要”可理解，但“为着各种用途”更贴近צרך在此处的用途、功用之义。
