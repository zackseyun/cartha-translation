  text: The splendor of the heights is the clear firmament, the appearance of heaven in a vision of glory.
translation:
  language: zh_hans
  text: 诸天的实体增添他的威荣；万物都听从，为着各种用途。[a]它们彼此不同；他所造的，没有一样有缺陷。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文传统作：“高天的荣耀是明净的穹苍；天在荣耀异象中的景象。”这与本处希伯来文的内容显著不同。
    reason: 标明主要古代文本传统的实质异文，并说明正文依据希伯来文。
  - marker: b
    text: “有缺陷”所译的希伯来词שיסוף较罕见，其精确词义或词形仍有不确定性；本句按上下文理解为缺陷、缺少或不完整。
    reason: 保留词汇不确定性，同时避免将该句不当地译作受造物“止息”或“消逝”。
lexical_decisions:
- source_word: עצם שמים
  choice: 诸天的本体
  rationale: עצם可指实体、本质或力量；这里保留较直译的“本体”，避免擅自具体化为星辰或穹苍。
- source_word: מרבים הדרו
  choice: 彰显他的荣美
  rationale: 字面为“增多／增添他的荣美”；汉语用“彰显”表达受造界使其荣美越发显明，同时不把代词所指明说为上帝。
- source_word: ולכל צרך הכל ישמע
  choice: 万物都听命，以应各种需要
  rationale: ישמע既可指听见，也可指听从；本句语境更适合“听命”。צרך保留“需要、用途”的宽泛含义。
- source_word: שונים זה מזה
  choice: 彼此各不相同
  rationale: 直接表达诸受造物相互有别。
- source_word: שיסוף
  choice: 会止息
  rationale: 按יסף／סוף相关语义理解为停止、终结；采用“止息”以保留其可指停止运作或归于终结的幅度。
theological_decisions:
- issue: “他的荣美”中代词的指向
  choice: 保留“他的”，不在正文补出“上帝”
  alternative: “上帝的荣美”
  rationale: 希伯来文只用第三人称后缀；上下文虽很可能指创造主，但不应在本节中把隐含所指改成明说。
- issue: 希伯来文本与希腊平行文本的显著差异
  choice: 正文依据所给高可信度希伯来文本翻译
  alternative: 采用希腊文“高处的夸耀是明净的穹苍……”
  rationale: 任务要求以原文证据为先；希腊文在脚注中完整列出，供读者了解另一古代文本传统，不把两者拼合。
- issue: “没有一样会止息”的主语关系
  choice: 译作创造者使其受造物持续不息
  alternative: “他没有造出一样残缺的东西”
  rationale: 后者更接近《便西拉智训》相邻经节的部分传统，但并非所给希伯来文שיסוף最直接的读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文紧随所给希伯来文，不以英语审校层或希腊平行文取代；对难以自然转述的עצם שמים用“诸天的本体”，并以脚注交代希腊异文。
