translation:
  language: zh_hans
  text: 他使霜如盐般铺展；霜又如棕榈的嫩芽般长出[a][c][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kahana所据希伯来文本可直译为“霜雾如盐般停留”；希腊平行文本则作“他把霜如盐一般倾倒在地上”。此行文本不确定，正文取两者共有的基本图景，而非拘泥于受扰动的希伯来措辞。
    reason: textual_variant
  - marker: b
    text: 后半句也可译作“霜又如棕榈的花朵般开放”。若参照希腊平行文本，也可能描写霜冻结后形成尖锐的冰晶。
    reason: lexical_alternative
  - marker: c
    text: 马萨达抄本在本节这一部分保存了不同于Kahana所代表的开罗藏经库文本的读法，显示希伯来文本传承在此受到扰动。
    reason: textual_variant
lexical_decisions:
- source_word: אד
  choice: 他使
  rationale: 传世希伯来文本的אד通常意为“雾、汽”，但此处句法和文本均有扰动；希腊平行文本以隐含的神为施事者，且上下文是颂扬上帝掌管天气。因此以“他使”表达隐含主语，同时不把אד生硬译作名词。
- source_word: כפור
  choice: 霜
  rationale: כפור指霜或白霜；现代汉语用“霜”自然清楚。
- source_word: כמלח
  choice: 像盐一样
  rationale: 保留霜与盐在外观及铺展状态上的明喻。
- source_word: ישכון
  choice: 铺开
  rationale: 该动词基本义为“居住、停留、安驻”。结合霜覆盖地面的景象，译作“铺开”较符合现代汉语诗性表达；但因希伯来文本不明确说“在地上”，正文不增补这一成分。
- source_word: ויציץ
  choice: 冒出
  rationale: צוץ意为“发芽、开花、长出”。“冒出”既保留植物生长的比喻，也能表现霜形成突起的形态。
- source_word: כתמר
  choice: 像棕榈
  rationale: תמר指棕榈或海枣树；“棕榈”简洁并保留原诗的树木意象。
- source_word: ציצים
  choice: 新芽
  rationale: ציצים可指花、芽或芽状突起。“新芽”与ויציץ形成自然搭配，并保留希伯来文本的植物意象；尖锐冰晶的理解留在脚注中。
theological_decisions:
- issue: 开头采用隐含的神为主语，还是按现存希伯来文本直译为名词“雾”
  choice: 译作“他使”，以上下文中的上帝为隐含主语
  alternative: 直译为“霜雾像盐一样停留”，或依希腊文译为“他把霜像盐一样倾倒在地上”
  rationale: Kahana所据希伯来抄本此行明显不稳定，马萨达文本在此处也有异文；希腊平行文本和整段赞歌的语境都支持上帝为施事者。正文采用隐含主语以保持连贯，但不照搬希腊文较强的“倾倒”及“在地上”。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“铺开”呈现霜如盐覆盖的可见景象；“新芽般冒出”保留希伯来文紧凑的植物比喻。所有不确定性均在脚注中说明，正文避免加入希伯来文未明说的“在地上”。
