base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/012.yaml
  text: He encircled the horizon in his glory[c][b][a], and the hand of God stretched out in his majesty.
translation:
  language: zh_hans
  text: 他在自己的荣耀中环绕定界[a][c]；上帝的手在他的威严中伸展开来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定界”所译的希伯来词通常也可指“定例”或“法令”。希腊文平行文本作：“他以荣耀的圆环环绕天空。”这可能反映不同的底本，也可能是对这句艰深诗语的解释性翻译。
    reason: alternative_reading
  - marker: b
    text: 希伯来文作单数“上帝的手”；希腊文平行文本作复数“至高者的双手”，并说双手将“它”展开。
    reason: textual_variant
  - marker: c
    text: 马萨达抄本在此只保存残句“……以他的荣耀”；正文较完整的措辞来自开罗藏经库希伯来抄本。
    reason: textual_variant
lexical_decisions:
- source_word: חוק
  choice: 定界
  rationale: 该词通常表示法令、定例，也可指受规定的界限。结合本节宇宙性的诗歌意象，译作“定界”既保留“规定、设定”的含义，也避免把希腊文的“天”直接移入正文。
- source_word: הקיפה
  choice: 环绕
  rationale: 该动词表示绕行、围住；“环绕”简洁地保留诗歌中的圆周意象。
- source_word: בכבודה
  choice: 以自己的荣耀
  rationale: 保留介词所表达的凭借或伴随关系，并将阳性单数后缀按上下文理解为指向上帝。
- source_word: ויד אל
  choice: 上帝的手
  rationale: אל在此处按颂赞上帝的语境译为“上帝”；“手”依希伯来文保留单数。
- source_word: נטתה
  choice: 伸展开来
  rationale: נטה表示伸展、铺展；此译自然地保留上帝之手展开的拟人意象，同时不把动作对象补入正文。
- source_word: בגבה
  choice: 在他的威严中
  rationale: 该词可表示高处、崇高或尊荣；在赞美诗语境中，“威严”较自然，同时仍保留崇高的语义。
theological_decisions:
- issue: 希伯来文主要见证与希腊文平行文本有差异
  choice: 正文依希伯来文译作“定界”和单数“上帝的手”
  alternative: “他以荣耀的圆环环绕天空；至高者的双手将它展开。”
  rationale: 本节有可靠的希伯来文见证，因此正文优先依据希伯来文；希腊文所保存的“天空”和复数“至高者的手”是实质性异文，列入脚注而不取代正文。
- issue: חוק在诗句中的多义性
  choice: 译作“定界”
  alternative: “定例”或“法令”
  rationale: “定界”保留该词作为所规定之界限的可能含义，也契合环绕的宇宙图景；但原词仍可按“定例、法令”理解，故不将歧义完全消除。
translation_notes:
  register: 采用现代、庄重而可朗读的诗歌语体。“定界”有意保留希伯来文חוק在“规定”与“界限”之间的张力；没有依希腊文在正文中补出“天空”或动作宾语。代词“他”按上下文指上帝。
