  text: By his power he gives strength to the clouds[b][a], to cast down hailstones.
translation:
  language: zh_hans
  text: 他以自己的能力使云彩[a][b]有力量，以便抛下冰雹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作单数“云”；希腊文平行文本作复数“云彩”。译文采用汉语不显单复数的“云彩”，保留这种差异。
    reason: alternative_reading
  - marker: b
    text: 马萨达抄本只保存本节开头，大意为“云因他的能力而刚强”；开罗藏经库的希伯来文还保存“抛下冰雹”的后半句，希腊文平行文本也支持冰雹的意象。
    reason: textual_variant
lexical_decisions:
- source_word: בכחו
  choice: 以自己的能力
  rationale: 介词 ב 在此表示凭借或手段；“以自己的能力”自然传达神以其能力施行天气作为。
- source_word: יתן
  choice: 使……
  rationale: נתן 基本义为“给、赐予”；与 עז 连用时，汉语用“使……刚强”能清楚表达“赋予力量”，又不过度解释。
- source_word: לענן
  choice: 云彩
  rationale: 希伯来文为单数，可作集合性用法；现代汉语“云彩”本身不强制标明单复数，既贴近希伯来文，也与希腊文复数平行。
- source_word: עז
  choice: 刚强
  rationale: עז 表示力量、强度；此处与“使”搭配为“使云彩刚强”，保留原文赋予力量的表达。
- source_word: להשליך
  choice: 好降下
  rationale: 不定式可表示目的或结果；天气语境中“降下”比直译“抛下”自然，“好”保留目的意味。
- source_word: אבני אלגביש
  choice: 冰雹
  rationale: 该短语字面为“冰雹之石”；现代汉语以“冰雹”最自然，并保留具体的气象意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“使云彩刚强”略带诗性，以保留希伯来文“给云力量”的具体表达；“好降下”呈现不定式可能具有的目的意味。脚注标记均置于相关词语之后。
