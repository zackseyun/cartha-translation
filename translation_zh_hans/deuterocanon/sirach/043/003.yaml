  text: At its shining it makes the world boil[b][a], and before its sword who can endure?
translation:
  language: zh_hans
  text: 当它炽烈照耀时，使大地沸腾[b]；在它的剑前，谁能承受得住？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“在它的剑前”；希腊语平行文本作“面对它的灼热，谁能站立得住？”正文保留希伯来语的比喻。
    reason: alternative_reading
  - marker: b
    text: 本句此处较古老的马萨达抄本残缺；正文主要采用开罗藏经库希伯来语抄本的读法，并以希腊语平行文本参校。
    reason: textual_variant
lexical_decisions:
- source_word: בהצהירו
  choice: 它光芒四射时
  rationale: 希伯来语指明亮照耀或炽烈放光；译文保留动态而强烈的太阳意象。希腊语平行文本作“正午时”，反映光热最盛的时刻，但正文以现存希伯来语为主。
- source_word: ירתיח
  choice: 使……沸腾
  rationale: רתח的核心意象是沸腾、翻滚；如此翻译保留极端炎热的具体修辞力度，没有弱化为一般的“加热”。
- source_word: תבל
  choice: 人间
  rationale: תבל常指有人居住的世界。此处“人间”自然凝练，也突出烈日对大地及其居民的影响；“世界”亦为可行译法。
- source_word: חרבו
  choice: 它的利剑
  rationale: 希伯来语直译为“它的剑”，是描绘太阳锐利而有毁伤力之光热的鲜明比喻；加“利”使现代汉语意象自然，同时不把它解释性地改译成“热浪”。
- source_word: מי יתכלכל
  choice: 谁能承受得住？
  rationale: 此语表达在压力下维持自身、支撑或忍受；“承受得住”符合现代汉语习惯，并与希腊语“谁能站立得住”相呼应。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“光芒四射”“使人间沸腾”“利剑”保留原文鲜明的诗歌意象；疑问句使用口语可懂但不失典雅的“承受得住”。脚注标记均置于相关正文之后。
