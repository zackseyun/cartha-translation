  yaml_path: translation/deuterocanon/sirach/043/030.yaml
  text: As you exalt the Lord[a], lift up your voice as much as you can, for there is still more.
translation:
  language: zh_hans
  text: 尊崇主的人啊，要尽你们所能扬声，因为还有更多。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“因为他仍超越”，较明确地指主仍超越人所能献上的赞美；希伯来文较简短，只作“因为还有更多”。
    reason: alternative_reading
lexical_decisions:
- source_word: מגדלי ה׳
  choice: 尊崇主的人啊
  rationale: מגדלי 是 גדל 的复数分词形式，最自然地理解为对尊崇、颂扬主之人的呼语；译为“尊崇主的人啊”，既保留其名词性呼语，也符合本节赞美的语境。
- source_word: הרימו קול
  choice: 要……扬声
  rationale: 直译为“举起声音”，是希伯来语中提高声音、发声颂扬的表达；“扬声”简洁自然，并保留原文的具体意象。
- source_word: בכל תוכלו
  choice: 尽你们所能
  rationale: 表示按照能力所及的全部程度；希腊文 καθʼ ὅσον ἂν δύνησθε 也支持“尽你们所能”的理解。
- source_word: כי יש עוד
  choice: 因为还有更多
  rationale: 原文简短而有所省略，意指无论人怎样尊崇主，仍有更多尚未表达；正文保留希伯来文的简练和开放性，不把希腊文所明确表达的主语补入正文。
- source_word: ה׳
  choice: 主
  rationale: 原文以敬称缩写指神名；译作“主”，符合现代中文圣经文体，并避免在原文未完整拼写神名之处作过度明确化。
theological_decisions:
- issue: 末句是否明确说是主超越一切赞美
  choice: 因为还有更多
  alternative: 因为他仍远远超过这一切
  rationale: 现存希伯来文只说“还有更多”，保留了省略和张力；希腊文则明确说“他仍超越”。正文以希伯来文为先，希腊文的解释性读法列入脚注。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“尊崇主的人啊”保留复数分词呼语；“扬声”简练而有诗意。末句刻意保持希伯来文的含蓄，不在正文中补出解释。
