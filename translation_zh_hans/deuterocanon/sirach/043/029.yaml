  text: The Lord is exceedingly awesome[a], and his words are wondrous.
translation:
  language: zh_hans
  text: 主极其可畏；他的话语奇妙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“主可畏，而且极其伟大；他的权能令人惊叹。”其后半句与现存希伯来文“他的话语奇妙”不同。
    reason: alternative_reading
lexical_decisions:
- source_word: נורא
  choice: 可畏
  rationale: 此词源于 ירא，表示令人敬畏、心生畏惧；“可畏”在现代汉语中既保留威严所引发的惧怕，也不把含义缩减为单纯的危险。希腊语 φοβερός 与此相符。
- source_word: ה'
  choice: 主
  rationale: 此缩写指神名；按本项目惯例译作“主”。希腊语平行文本的 Κύριος 也支持这一称呼。
- source_word: מאד מאד
  choice: 极其
  rationale: 两个 מאד 构成强烈的程度强调。汉语若直译为“非常非常”略显口语；“极其”自然、庄重，并保留高度强化的语气。
- source_word: ונפלאות
  choice: 奇妙非凡
  rationale: 源于 פלא，指超乎寻常、令人惊叹。“奇妙非凡”兼顾奇异卓绝与引人赞叹的色彩；希伯来语无系词，汉语可直接作谓语。
- source_word: דבריו
  choice: 他的话语
  rationale: דבריו 的直接含义是“他的话／话语”。现存希伯来文在此清楚，因此正文依从希伯来文；希腊语异文“他的权能／统治”置于脚注。
theological_decisions:
- issue: 神名缩写 ה' 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 该缩写代表神名，而平行希腊文作 Κύριος。采用通行而庄重的“主”，不展开为音译，也不额外引入宗派性色彩。
- issue: 希伯来文与希腊文第二分句的差异
  choice: 他的话语奇妙非凡
  alternative: 他的权能令人惊叹；他的统治奇妙非凡
  rationale: 本节现存希伯来文作 דבריו“他的话语”，故正文以希伯来文为准。希腊文 ἡ δυναστεία αὐτοῦ 则指“他的权能／统治”；此差异可能反映不同底本或翻译传统，故以脚注保留，不在正文中消解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“极其可畏”保留敬畏与惧怕并存的张力；“奇妙非凡”避免过度古雅。脚注标记放在涉及希伯来文与希腊文差异的主要陈述之后。
