  text: The appearance of snow dazzles the eyes, and at its falling the heart is amazed.
translation:
  language: zh_hans
  text: 雪的景象令双眼目眩[a]；它降下时[b]，人心为之惊叹[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雪”所对应的希伯来词也可理解为“洁白”或“白色”；希腊文本明确作“雪”，上下文也支持这一理解。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本直译近于“因它的雨（或降水）”，在此处略显生硬；希腊文本支持理解为雪的降下。
    reason: textual_variant
  - marker: c
    text: 马萨达抄本在本段相邻诗句中保存了不同的读法：“这景象使人心惊叹”，显示希伯来抄本对这些分句的排列并不完全一致。
    reason: textual_variant
lexical_decisions:
- source_word: תואר
  choice: 容光
  rationale: 该词指可见的形貌、仪容或美态；结合希腊文 κάλλος（美丽）及诗体语境，“容光”既保留视觉层面，也传达雪景之美。
- source_word: לבנה
  choice: 雪
  rationale: 希伯来词形可理解为“白色／洁白”，但希腊平行文本明确作 χιόνα（雪），上下文也在描写气象现象，因此正文译作“雪”，并以脚注保留词义上的可能性。
- source_word: יגהה עינים
  choice: 耀人眼目
  rationale: 动词表达发亮或以光辉作用于眼睛；“耀人眼目”自然、凝练，并保留雪光使人目眩神夺的诗意，而不把效果过度限定为伤眼的“刺眼”。
- source_word: ממטרו
  choice: 雪降下时
  rationale: 传世希伯来文使用与“雨、降水”相关的形式，在雪景中较为生硬；希腊文本也指其降水或降落。译为“雪降下时”表达此处气象意义，同时由脚注说明文本问题。
- source_word: יהמה לב
  choice: 人心为之惊叹
  rationale: יהמה 本可表示喧腾、激荡或骚动；希腊文 ἐκστήσεται καρδία 指心因惊异而出神。译作“人心为之惊叹”兼顾内心震动和上下文中的赞叹意味，避免直译成“咆哮”造成误解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语，以分号呈现两个平行分句。“容光”“眼目”略带典雅色彩，但仍为现代读者所熟悉；正文不强行消除希伯来文与希腊文之间的词义及文本张力，相关信息置于脚注。
