  text: 'A healing for all: a massing cloud of dew[c][b][a], driving back the scorching heat.'
translation:
  language: zh_hans
  text: 疗愈万物的良方：汇聚如云的露水[a][c]；它驱散灼人的暑热，带来丰润[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “汇聚如云的露水”所据的希伯来语较难确定，也可理解为“云中滴下的露水”或“露水般的云雾”。希腊平行文本作“雾气、露水”，重点在带来清凉的水汽，而不一定是暴雨云。
    reason: lexical_alternative
  - marker: b
    text: “带来丰润”直译近于“使……肥美／丰润”。本句的希伯来语句法简约，受事未明；末句也可理解为“驱散灼热，以使丰润”或“驱散灼热，带来丰润”。
    reason: alternative_reading
  - marker: c
    text: 这一段的马萨达卷残缺，不能为本节提供清楚的不同读法；译文主要依据开罗藏经库的希伯来语抄本，并以希腊平行文本作参照。
    reason: textual_variant
lexical_decisions:
- source_word: מרפא כל
  choice: 万物的良药
  rationale: מרפא意为“医治、疗愈之物、良药”，כל可泛指“一切、万物”。此处以自然界的清凉水汽为有益万物的疗治，译作“万物的良药”简洁而保留诗意，也与希腊文ἴασις πάντων相符。
- source_word: מערף ענן טל
  choice: 凝聚成云雾的露水
  rationale: 这一希伯来语短语艰涩，可能涉及聚集、滴落或笼罩的意象。希腊平行文本的ὁμίχλη, δρόσος意为“雾气、露水”，显示重点是带来清凉的湿气。译文保留“云雾”和“露水”，但不武断限定其确切物理形态。
- source_word: פורע
  choice: 驱散
  rationale: 该词在此以שרב“灼热、暑热”为作用对象，语境要求“除去、赶退、驱散”之意；希腊平行文本也表达从酷热中得到舒缓。
- source_word: לדשן
  choice: 使万物重新丰润
  rationale: דשן词根通常含“肥美、丰润、滋养”之意。在露水消解暑热的气候语境中，指受热之物因水汽而恢复润泽和生机。“重新丰润”既保留原词的丰盛意象，也符合现代汉语表达。
- source_word: שרב
  choice: 灼人的暑热
  rationale: שרב指干燥灼人的热气，有时也可指热风。“灼人的暑热”自然明确，并与希腊文καύσων相合。
