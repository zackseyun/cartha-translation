base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/008.yaml
  text: Month by month it renews itself—how awe-inspiring it is in its changing! A vessel of the host on high[c][b][a], from the expanse of the sky is its shining.
translation:
  language: zh_hans
  text: '它月月更新[a]；它变化时多么令人敬畏！

    它是高天军旅的器具，是高处的琴[c][b]；它的光辉出自穹苍的穹顶。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行本作：“月按其名称而有，在变换中奇妙地增长。”这可能反映了与现存希伯来文不同的底本或解释；希伯来文则是“它月月更新”。
    reason: alternative_reading
  - marker: b
    text: 本节后半句的希伯来文艰深，文本可能不稳定。马萨达抄本保存了相关但不同的措辞；大意似乎是月亮属于天上的军旅，并从天空发光。
    reason: textual_variant
  - marker: c
    text: 或译：“高天的竖琴”或“高处的琴”。希伯来语措辞很不寻常；这里可能是诗歌隐喻，也可能存在文本问题。
    reason: lexical_alternative
lexical_decisions:
- source_word: חדש בחדשו הוא מתחדש
  choice: 它月月更新
  rationale: 希伯来文重复使用“חדש”词根，并以反身形式描写月亮周期性焕新；“月月更新”既保留这种重复意涵，也符合现代汉语表达。
- source_word: מה נורא
  choice: 多么令人敬畏
  rationale: “נורא”可指令人畏惧或肃然起敬；在赞颂受造界的语境中，“令人敬畏”兼顾敬畏感与诗歌语气，不把它窄化为恐怖。
- source_word: בהשתנותו
  choice: 它的变化
  rationale: 该词指改变、变换；这里对应月相变化。“它的变化”自然简洁，同时不具体限定变化的方式。
- source_word: כלי צבא
  choice: 众军的器具
  rationale: “כלי”可指器具、器皿、装备或兵器，“צבא”可指军队或众军。宇宙诗歌语境较适合“众军的器具”，既保留天上众军的意象，也避免擅自译成武器。
- source_word: נבלי מרום
  choice: 高天
  rationale: 现存希伯来文在此异常而且上下文衔接困难；“נבלי”若按通常词义可理解为琴一类的弦乐器，但也可能反映文本传抄问题。正文采用较克制的“高天”，不把不确定的乐器隐喻写死，异读见脚注。
- source_word: מרצף רקיע
  choice: 从穹苍铺展开来
  rationale: “רקיע”是穹苍、天空的广阔空间；“מרצף”在此难解，可能含铺设、铺展或如地面铺砌之意。译文用“铺展开来”保留空间图景，同时让诗句在现代汉语中可读。
- source_word: מזהירתו
  choice: 它的光辉
  rationale: 此形式与发光、光辉有关，原句结构省略而凝练；“它的光辉”保留诗性，也与月亮的明亮相符。
theological_decisions:
- issue: 希伯来文尚存但后半句文本及句法艰深时，如何使用希腊文平行本
  choice: 正文以现存希伯来文为主，并用脚注说明希腊文异读及后半句的不确定性。
  alternative: 按希腊文改译首句，或把后半句意译为月亮在天上众军中发光。
  rationale: 此处希伯来文首句相对清楚，应优先采用；后半句虽有疑难，却不宜借希腊文或流畅意译默默消除。脚注使读者看到真实的文本张力。
- issue: “נבלי מרום”是否明确译为高天的琴
  choice: 正文不将其确定为琴，而译作较克制的“高天”，并在脚注保存“高处的琴”这一词汇可能。
  alternative: 高处的琴／高天的竖琴。
  rationale: 按通常词汇意义，乐器译法有根据，但该短语在此语境异常，且整行可能存在文本问题；正文避免把一个高度不确定的隐喻确立为唯一读法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留赞歌式惊叹和凝练的宇宙意象。对后半句不作过度顺译，以脚注明示词义及文本的不确定性。
