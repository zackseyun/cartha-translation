base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/020.yaml
  text: The cold of the north wind returns[a]; like rot, it freezes its spring. Over every standing body of water it settles[b], and the reservoir puts on armor like a breastplate.
translation:
  language: zh_hans
  text: '北风的寒气再度袭来；如同腐朽一般，它使自己的水源冻结[a]。


    它覆盖每一处积水[b]，水池也仿佛披上了胸甲。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“如腐朽，它使其水源冻结”，比喻含义难解；希腊文平行经文则较直接地说“冰晶由水凝结”。正文以现存希伯来文为主，保留其艰深的意象。
    reason: alternative_reading
  - marker: b
    text: 此处希伯来文用词和句法疑难。希腊文平行经文支持冰层停落或覆盖在每一处聚水之上的意思。
    reason: textual_variant
lexical_decisions:
- source_word: צִנַּת רוּחַ צָפוֹן
  choice: 北风的寒气
  rationale: צִנַּת表示寒冷、寒气；在气象语境中，רוּחַ צָפוֹן指北风。译文保留原文的领属结构，同时符合现代汉语表达。
- source_word: יָשִׁיב
  choice: 再度袭来
  rationale: 原文动词简略，可指返回、使返回。用于寒冷天气时，“再度袭来”既保留反复来临之意，又比直译“返回”自然；希腊文平行经文则作“吹来”。
- source_word: וְכָרָקָב
  choice: 仿佛腐朽侵蚀一般
  rationale: 现存希伯来文作“如腐朽”，意象艰深。译文以“腐朽侵蚀”使比喻在汉语中可理解，却不以较顺畅的希腊文“冰晶”取代希伯来文读法。
- source_word: יַקְפִּיא מְקוֹרוֹ
  choice: 它使水源冻结
  rationale: יַקְפִּיא表示使冻结或凝结；מְקוֹרוֹ可指它的源头、泉源。译作“水源”保留水的意象，也避免把所指过度限定为泉眼。
- source_word: מַעֲמַד מַיִם
  choice: 静止的水面
  rationale: 该短语指聚集并停驻于一处的水体；“静止的水面”在现代汉语中清楚传达这一状态，并与下文结冰覆盖的景象衔接。
- source_word: יְקָרִים
  choice: 它覆盖
  rationale: 此词形在本句中疑难，可能存在文本问题。希腊文平行经文支持冰层停落、覆盖在聚水之上的意思；译文采用“覆盖”，并以脚注说明不确定性。
- source_word: וּכְשִׁרְיוֹן יִלְבַּשׁ מִקְוֶה
  choice: 水池也仿佛披上了胸甲
  rationale: שִׁרְיוֹן指护甲，尤其可指胸甲；מִקְוֶה指聚水之处或水池。译文保留水体拟人化“穿戴”护甲的鲜明比喻。
