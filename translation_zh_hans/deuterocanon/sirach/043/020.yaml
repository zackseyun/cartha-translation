- from: '北风的寒气再度袭来；它使水源冻结，仿佛腐朽侵蚀一般[a]。

    它覆盖每一处静止的水面[b]，水池也仿佛披上了胸甲。'
  to: '北风的寒气再度袭来；如同腐朽一般，它使自己的水源冻结[a]。


    它覆盖每一处积水[b]，水池也仿佛披上了胸甲。'
  rationale: 删去原文未明言的“侵蚀”，使“如同腐朽一般”保留希伯来文困难而未决的意象；将“静止的水面”调整为“积水”，以较自然且不缩窄的汉语对应聚集、停驻的水。其余译文及脚注可保留。
