  text: It scorches the produce of the mountains with drought[b][a], and the pasture of plants with flame.
translation:
  language: zh_hans
  text: 它以干旱灼伤山中的出产[b][a]，以火焰烧灼草木丛生的牧场。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本的表述较为宽泛：“它要吞噬群山，烧尽旷野，又像火一样使青草消失。”本译所据的希伯来文本更为简练，意象也有所不同。
    reason: alternative_reading
  - marker: b
    text: 这里译作“干旱”的希伯来词本义与干燥有关，也可较直译为“以干燥”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יבול
  choice: 出产
  rationale: 指土地所生之物；“出产”范围较广，适合山地植被，也避免“庄稼”过强的农耕色彩。
- source_word: הרים
  choice: 山中
  rationale: 原义为“山”；结合“出产”，译作“山中的”更符合现代汉语表达，同时保留山地意象。
- source_word: בחרב
  choice: 以干旱
  rationale: חֹרֶב表示干燥、旱情；此处用“干旱”自然地表达造成毁坏的手段，“以干燥”则是较直译的可能。
- source_word: ישיק
  choice: 灼伤
  rationale: 在与下句“火焰”平行的语境中，此动词表示灼烧性的毁坏；“灼伤”既保留热力意象，也不强断首句为实际燃烧。
- source_word: נוה
  choice: 牧场
  rationale: 本词可指居所，也可指牧地；与“草木”连用时，牧场或草场的自然环境义更合适。
- source_word: צמחים
  choice: 草木
  rationale: 指萌生、生长之物；“草木”比泛称“植物”更具诗意，又是现代读者熟悉的自然表达。
- source_word: בלהבה
  choice: 以火焰
  rationale: 介词加名词在此宜理解为工具或方式；“以火焰”保留原文紧凑的诗性表达。
