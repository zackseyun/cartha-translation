revisions:
- from: 它像一座鼓风烧旺、酷热逼人的熔炉；太阳三倍猛烈地灼烧群山，[a]喷吐火热的气雾，闪射光芒，使眼睛昏花。[b]
  to: 太阳如同一座在酷热中鼓风烧旺的炉，以三倍的强度灼烧群山[a]；它喷吐火热的气雾，闪射光芒，使眼目昏花。[b]
  rationale: 修订仅解决中文主语和句法连贯性，并使“三倍”的表达及文本说明更自然、更审慎。保留希腊文本明确的“三倍”、气雾、闪光和视觉受损意象，且不把艰涩的希伯来文末句强行调和为单一确定读法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:47:30Z'
