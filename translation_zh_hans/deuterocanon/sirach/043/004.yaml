base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/004.yaml
  text: Like a blazing furnace in the works of heat[a], the sun scorches the mountains three times over; breathing out fiery vapors, and flashing rays[b], it dims the eyes.
translation:
  language: zh_hans
  text: 太阳如同一座在酷热中鼓风烧旺的炉，以三倍的强度灼烧群山[a]；它喷吐火热的气雾，闪射光芒，使眼目昏花。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以三倍的强度”见于希腊文本；现存希伯来文本没有清楚保存这一说法。
    reason: alternative_reading
  - marker: b
    text: 本节希伯来文本有几处艰涩，并非处处与希腊文本完全对应。本译以现存希伯来文为主要依据，并参考希腊平行文本来理解若干压缩或不确定的短语。希伯来文末句按字面近于“明灯灼伤眼睛”，而希腊文说光使眼目昏暗。
    reason: textual_variant
lexical_decisions:
- source_word: כור נפוח / κάμινον φυσῶν
  choice: 鼓风烧旺的熔炉
  rationale: 希伯来文和希腊文都呈现以吹风增强炉火的意象；此译既保留“鼓风”，又用自然的现代汉语说明炉火因此烧旺。
- source_word: מחם מצוק / ἐν ἔργοις καύματος
  choice: 酷热逼人的
  rationale: 希伯来语短语艰涩，可能表达酷热及其压迫感；采用较为凝练的描述，不把不确定的结构硬译成生涩的“热的工作”。
- source_word: ידליק הרים / ἐκκαίων ὄρη
  choice: 灼烧群山
  rationale: 原词有点燃、烧起之意；在太阳热力的语境中，“灼烧”既保留强烈火焰意象，也避免令人误解为山体实际燃烧。
- source_word: τριπλασίως
  choice: 三倍猛烈地
  rationale: “三倍”明确见于希腊见证，虽在现存希伯来行文中未清楚保存；正文保留这一古老见证，并以脚注标明文本差异。
- source_word: ἀτμίδας πυρώδεις ἐμφυσῶν
  choice: 喷吐火热的气雾
  rationale: 保留希腊文中太阳如炉火呼出炽热蒸气的拟人化画面；“气雾”比“烟”更贴近ἀτμίδας。
- source_word: לשאון מאור תגמר נושבת / καὶ ἐκλάμπων ἀκτῖνας
  choice: 闪射光芒
  rationale: 希伯来文本处压缩而艰涩，希腊平行文本清楚表达放射光线；采用简洁自然的译法，同时在脚注交代差异。
- source_word: ומנורה תכוה עין / ἀμαυροῖ ὀφθαλμούς
  choice: 使眼睛昏花
  rationale: 希伯来文较直接地描写光体灼伤眼睛，希腊文则说使眼睛暗淡；“昏花”表达强光造成的视觉受损，而不夸大为完全失明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而富有诗意的书面语。“鼓风烧旺”“喷吐”“闪射”保留原文连续而强烈的炉火与太阳意象；两处脚注明示希伯来文与希腊文之间的真实张力，不在正文中假装文本完全一致。
