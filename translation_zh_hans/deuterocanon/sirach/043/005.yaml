  text: For great is the Lord who made it[b][a], and by his word he hastens its course.
translation:
  language: zh_hans
  text: 造它的主何其伟大！他凭自己的话催促它运行。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马萨达抄本只保存了上半句“造它的主何其伟大”；开罗藏经库的希伯来抄本有下半句，但读法困难。希腊文本支持“他凭自己的话催促它运行”这一理解。
    reason: 文本见证与疑难读法
  - marker: b
    text: 下半句也可按疑难的希伯来字面理解为：“凭他的话，他的大能者得胜”；或意译为：“他一声令下，就指引它运行。”
    reason: 词义与译法备选
lexical_decisions:
- source_word: גדול
  choice: 伟大
  rationale: 这是描述主的表语形容词；“伟大”直接、自然，也符合颂赞诗的语体。
- source_word: ה'
  choice: 主
  rationale: 希伯来文本以敬称缩写指神的名；译作“主”既符合汉语圣经传统，也不把缩写误作普通称谓。
- source_word: עושהו
  choice: 造它的
  rationale: 后缀按上下文指前文所说的天体（月亮）；汉语用“造它的主”简洁保留原文关系结构。
- source_word: בדבריו
  choice: 凭自己的话
  rationale: 介词表达凭借或施行的方式；“话”在汉语中可统摄原文形式上的复数，并保留“命令”的可能含义。
- source_word: ינצח
  choice: 催促
  rationale: 此词在本句中含义困难；希腊平行文本 κατέσπευσεν 支持“催赶、使加快”的理解，且适合天体运行的语境。
- source_word: אביריו
  choice: 它运行
  rationale: 希伯来读法在此语境中疑难；结合希腊平行文本 πορείαν（行程、运行）表达天体的行进，但避免使用现代技术色彩较强的“轨道”。
theological_decisions:
- issue: 神名的译法
  choice: 主
  alternative: 雅威
  rationale: 原文 ה' 是神名的敬称缩写；译作“主”保留敬称功能，不采用音译来过度明确原文缩写。
- issue: 疑难下半句如何使用希腊平行文本
  choice: 以希伯来文为底本，并由希腊文澄清为“他凭自己的话催促它运行”
  alternative: 较拘泥地译作“凭他的话，他的大能者得胜”
  rationale: 下半句的希伯来文在词义和句法上均有困难，而希腊见证提供连贯且符合天文语境的“催促其行程”；正文采用这一理解，脚注同时保留希伯来表层读法造成的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体。“何其伟大”保留诗歌感；“运行”适合描述天体，又不引入“轨道”等现代科学术语。脚注标记均置于正文相关句末。
