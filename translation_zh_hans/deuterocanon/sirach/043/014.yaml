  text: For this reason he created the storehouse[b][a], and made the clouds fly like birds.
translation:
  language: zh_hans
  text: 因此，他开启了宝库[a][b]，使密云像飞鸟一样飞翔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文辅音若按通常读法直译，可作“他创造了一个宝库”；希腊平行文本则作“宝库敞开了”。正文依照后者及本段的风暴意象译作“开启了”。
    reason: textual_variant
  - marker: b
    text: 马萨达抄本未清楚保存本节；这里主要依据开罗藏经库的希伯来文抄本，并以希腊平行文本互相参照。
    reason: cross_reference
lexical_decisions:
- source_word: למען
  choice: 因此
  rationale: 此处承接上文，表达原因或结果；希腊平行文本 διὰ τοῦτο 也支持“因此”，而非目的性的“为了”。
- source_word: ברא
  choice: 开启了
  rationale: 希伯来文辅音按通常读法可作“创造了”，但希腊平行文本 ἠνεῴχθησαν 明确作“被打开了”。结合风暴中天上宝库开启的意象，正文译作“开启了”，并用脚注保留异读。
- source_word: אוצר
  choice: 宝库
  rationale: 希伯来文为单数，可能具有集合意义；“宝库”既贴近词义，也保留天上储藏风雨之物的诗歌意象。
- source_word: ויעף
  choice: 使……翱翔
  rationale: 按希伯来文句法体现使役意味，描绘上帝使云迅速飞行；“翱翔”保留鲜明的飞鸟意象。
- source_word: עבים
  choice: 密云
  rationale: 该词常指浓厚、带雨的云；“密云”比泛称“云”更能传达原词的气象色彩。
- source_word: כצפרים
  choice: 如飞鸟
  rationale: 直接保留原文的明喻，现代汉语自然且富有诗意。
theological_decisions:
- issue: 希伯来文主要见证与希腊平行文本对首句动词的不同指向
  choice: 正文作“他开启了宝库”
  alternative: “他创造了一个宝库”；或依希腊文被动句式作“宝库敞开了”
  rationale: 希伯来文辅音 ברא 通常可理解为“创造”，但希腊文保存了“开启”的读法；后者更符合天气诗歌中天上宝库开启、云层飞出的语境。正文采用“开启”，脚注明示文本差异，不把不确定性隐去。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“宝库”“密云”“飞鸟翱翔”保留古代气象诗歌的意象；脚注标记按[a][b]置于相关短语之后。
