  text: The moon also marks the returning seasons[c][b][a], a ruler of the end and a sign forever.
translation:
  language: zh_hans
  text: 月亮也标示反复来临的时节[a][c]，掌管终点[b]，永远作记号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“月亮在万事中各按自己的定期，显明时序，永远作记号。”希伯来文则作“反复来临的时节”和“掌管终点”。
    reason: alternative_reading
  - marker: b
    text: “掌管终点”在希伯来文中十分凝练，可能指月亮掌管月份的完成或固定界限。
    reason: lexical_alternative
  - marker: c
    text: 马萨达抄本此节保存了不同读法；其残存文字作：“因为伟大的主造了它。”
    reason: textual_variant
lexical_decisions:
- source_word: וגם
  choice: 也
  rationale: 承接上下文所述的受造光体，保留附加语气，现代汉语中简洁自然。
- source_word: ירח
  choice: 月亮
  rationale: 该词明确指月亮；汉语在此无需另加定冠表达。
- source_word: עתות שבות
  choice: 循环的节期
  rationale: עתות指时节、节期，שבות表达返回或反复；此译保留周期循环及历法意味，不把它限定为单一季节。
- source_word: ממשלת
  choice: 掌管
  rationale: 该名词表示统治、管辖；转译为动词“掌管”符合汉语诗体，并保留月亮被人格化为治理者的意味。
- source_word: קץ
  choice: 终点
  rationale: 可指终结、界限或完成之处；“终点”保持原文的凝练与开放性，不径直解释为月底。
- source_word: ואות עולם
  choice: 永远作记号
  rationale: אות是记号，עולם在此表达恒久；该译直接、庄重，并保留“永远”的时间意味。
theological_decisions:
- issue: 希伯来文本与希腊平行文本存在小幅差异时的取舍
  choice: 正文以现存希伯来文为主，并用希腊文印证其历法语境
  alternative: 依希腊文译作：“月亮在万事中各按定期，显明时序，永远作记号。”
  rationale: 此处希伯来文尚存，故正文遵从其“循环的节期”和“掌管终点”等措辞；希腊文则帮助确认本句涉及时间、节期和历法，但不取代希伯来读法。
- issue: “掌管终点”的具体所指
  choice: 保留紧凑而含混的表达
  alternative: 明确解释为“掌管月末”或“标志月份的完成”
  rationale: 语境可能指月亮支配月份的完成或固定界限，但原文没有明说；不在正文中消除这种诗性和语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“循环的节期”保留月亮与周期性时序、历法节期的关联；“掌管终点”刻意保留希伯来文的简练和歧义。所有脚注标记均置于相关正文之后。
