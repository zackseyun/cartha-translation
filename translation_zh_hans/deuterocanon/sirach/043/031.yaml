  text: Who has seen him and can describe him? And who can magnify him as he is?[a]
translation:
  language: zh_hans
  text: 谁曾见过他而能详述他？谁能按他本来的样子颂扬他为大？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文本在这里有不同内容，而且似乎与本节不相配；直译为：“诸高天重得力量，并不疲倦，因为你们无法探究它们。”希腊文本则为：“谁曾见过他而能详述他？谁能按他本来的样子颂扬他为大？”正文采用希腊文本，因为它与上下文衔接连贯。
    reason: textual_variant
lexical_decisions:
- source_word: τίς ἑόρακεν αὐτόν
  choice: 谁见过他
  rationale: ἑόρακεν是ὁράω的完成时，表示曾经见过；“见过”是自然、准确的现代汉语。代词“他”承接上下文中的上帝。
- source_word: ἐκδιηγήσεται
  choice: 能详述他
  rationale: 该动词有充分讲述、详细陈说之意；“详述”既保留其充分表达的力度，也适合此处关于人无法尽述上帝的反问。
- source_word: μεγαλυνεῖ
  choice: 称颂他的伟大
  rationale: 该词表示尊为大、颂扬；直译“使他为大”在汉语中生硬，“称颂他的伟大”自然地保留敬拜和颂赞的语气。
- source_word: καθὼς ἐστιν
  choice: 照着他的本相
  rationale: 此语强调与他实际所是相称；“本相”简洁表达真实所是，又不额外界定上帝的本质。
- source_word: מרומים
  choice: 高处（异文脚注）
  rationale: 现存希伯来文本中的מרומים意为“高处”或“诸高天”；由于整句与本节希腊文本及上下文不相合，正文依希腊文，希伯来文见脚注。
- source_word: החליפו כח
  choice: 重得力量（异文脚注）
  rationale: 该短语可表示更新、重新获得力量；脚注采用“重得力量”，避免误解为彼此交换力量。
- source_word: כי לא תחקרו
  choice: 因为你们无法探究它们（异文脚注）
  rationale: חקר表示查究、探察到底；复数“你们”和宾语“它们”按现存希伯来句法呈现，不将其强行协调为希腊文的单数指称。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本不一致
  choice: 正文采用希腊文关于谁能看见并充分颂扬上帝的两个反问句，同时以脚注完整披露现存希伯来文的不同读法。
  alternative: 按现存希伯来文译作：“高处重得力量，并不疲倦，因为你们无法探究它们。”
  rationale: 所提供的希伯来见证已标为轻微错配，其内容与本节希腊文及相邻语境难以衔接；希腊文则连贯延续对上帝伟大和不可穷尽性的颂赞。采用希腊文作正文并保存希伯来读法，既不掩盖文本问题，也不武断调和两个见证。
- issue: καθὼς ἐστιν所表达的认识限度
  choice: 译作“照着他的本相”，保留人无法按上帝真实所是充分颂扬他的张力。
  alternative: 译作“像他本来那样”或“照他真实的所是”。
  rationale: “本相”不把经文扩展成系统神学命题，同时自然表达人的言语无法完全与上帝真实所是相称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两个反问句保持平行节奏；“详述”略带书面庄重感，但仍属现代常用语。“本相”用来简洁表达καθὼς ἐστιν，并避免冗长或教派化解释。
