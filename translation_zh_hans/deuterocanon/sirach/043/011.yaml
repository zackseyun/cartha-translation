  text: Look at the rainbow and bless its Maker[b][a], for it is exceedingly majestic in splendor.
translation:
  language: zh_hans
  text: 你看彩虹[a]，要称颂造它的那一位，因为它在荣光中显得极其壮美。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彩虹”原文作“弓”；这里指天空中的弓，也就是彩虹。
    reason: lexical_alternative
  - marker: b
    text: 此处希伯来文本的措辞表达威荣与光辉；马萨达抄卷以同源措辞支持“壮美、荣光”这一理解。
    reason: textual_variant
lexical_decisions:
- source_word: ראה
  choice: 你看
  rationale: 保留希伯来语命令式所表达的直接注视，同时采用自然、简洁的现代汉语。
- source_word: קשת
  choice: 彩虹
  rationale: 原词本义为“弓”，但本段谈论天象，所指是天空中的弓形彩虹；译明所指，词面含义置于脚注。
- source_word: וברך
  choice: 要称颂
  rationale: ברך通常意为“祝福”；当对象是创造者时，汉语“称颂”自然表达颂赞之意，又保留敬虔语气。
- source_word: עושיה
  choice: 那造它的
  rationale: 准确保留分词结构及指回彩虹的宾语后缀，不把经文未明说的“上帝”直接补入正文。
- source_word: כי
  choice: 因为
  rationale: 清楚表达后半句提供称颂创造者之理由。
- source_word: מאד
  choice: 极其
  rationale: 保留强烈程度，又符合庄重的现代汉语诗体。
- source_word: נאדרה
  choice: 壮美
  rationale: 该词根表达威荣、宏伟或华美；“壮美”兼顾宏伟与美感，并适合彩虹这一景象。
- source_word: בהוד
  choice: 在荣光中
  rationale: הוד可指荣美、威荣、光辉；“在荣光中”保留介词结构及较宽的语义，不局限为物理亮度。
theological_decisions:
- issue: 称颂的对象
  choice: 译作“那造它的”，让读者由语境理解所指为创造者上帝。
  alternative: 明确译作“造它的上帝”。
  rationale: 希伯来语只说“造它的”，没有直接出现“上帝”；正文不作超出原文的明示，以保留原有表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你看……要称颂……”保留劝告式命令语气；“壮美”“荣光”维持诗歌的崇高感。所有脚注标记均在正文中出现，并紧邻相关内容。
