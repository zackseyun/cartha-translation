base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/025.yaml
  text: There are the wonders of his marvelous works[a], every kind of living thing, and the great sea-creatures.
translation:
  language: zh_hans
  text: 那里有他奇妙作为中的种种奇事，各类活物，还有巨大的海兽[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语末句艰涩，字面可能指“强大之物”或类似含义；希腊文平行文本作“海兽的创造”（即海兽这一类受造物），可能保存了这里原有的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: שם
  choice: 那里有
  rationale: שם本义为“那里”；原文是无动词句，译作“那里有”既保留方位含义，也符合现代汉语的存在句表达。希腊文ἐκεῖ同样支持这一理解。
- source_word: פלאות תמהי מעשהו
  choice: 他奇妙作为的种种奇观
  rationale: פלאות指令人惊异的事物，תמהי带有惊奇、奇妙之意，מעשהו指“他的作为/所造之物”。此译保留原文的密集修饰关系，同时用自然汉语表达其赞叹语气。
- source_word: מין כל חי
  choice: 各类活物
  rationale: מין表示种类，כל חי指一切有生命之物；“各类活物”简洁地保留分类意义，也与希腊文ποικιλία παντὸς ζῴου相符。
- source_word: וגבורות רבה
  choice: 还有巨大的海兽
  rationale: 现存希伯来语结尾艰涩，字面可涉及“大能/强大之物”；希腊平行文本κτίσις κητῶν明确指海中巨兽或海兽。结合本段海洋语境，正文采用“巨大的海兽”，并以脚注说明文本问题。
theological_decisions:
- issue: 是否借助希腊平行文本阐明希伯来语末句
  choice: 正文译为“巨大的海兽”
  alternative: “许多大能之物”或“强大的受造物”
  rationale: 希伯来语传本末句在语法和语义上均不明朗，而希腊平行文本明确提到海兽；上下文也在描写海洋。采用海兽这一读法最符合现有源文证据，但脚注保留希伯来语的不确定性，避免把推定读法当成毫无疑问的原文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“奇妙作为”“种种奇观”保留诗性和赞叹色彩；“活物”“海兽”则保持简洁，适合普通读者。
