  text: Many such wonders exist[b][a], but I have seen only a few of his works.
translation:
  language: zh_hans
  text: 这样的奇事很多[a]；他的作为，我只见过其中一小部分[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“有许多隐藏的事比这些更大。”现存希伯来文较简短，只说“这样的奇事很多”。
    reason: alternative_reading
  - marker: b
    text: 希腊文作“我们只见过他的作为中的一小部分”；现存希伯来文作“我只见过”。
    reason: textual_variant
lexical_decisions:
- source_word: רוב
  choice: 多得很
  rationale: 这里表示数量众多；结合后句“只见过少数”，译为“多得很”既自然，也保留数量上的强烈对照。
- source_word: נפלאות
  choice: 奇事
  rationale: 指上帝令人惊叹的非凡作为。“奇事”简洁庄重，并能与后面的“作为”有所区分。
- source_word: כאלה
  choice: 这样的
  rationale: 回指上文所述的受造现象和奇妙之事，保留原文的指示与类比作用。
- source_word: מעט
  choice: 只……少数
  rationale: 与部分结构“在他的作为中”相连，表示所见仅占很小一部分；用“只见过少数”明确表达限制意味。
- source_word: ראיתי
  choice: 我只见过
  rationale: 希伯来文为第一人称单数完成式；现代汉语用“见过”自然表达截至当前的经验。
- source_word: ממעשיו
  choice: 他的作为
  rationale: מן在此为部分用法，意为从他全部作为中仅见少数；汉语通过“他的作为，我只见过少数”自然体现这种部分关系。
theological_decisions:
- issue: 是否在正文中加入希腊文的“隐藏之事”及“比这些更大”
  choice: 正文以现存希伯来文较简短的“这样的奇事多得很”为准
  alternative: 有许多隐藏的事比这些更大
  rationale: 现存希伯来文没有明确对应“隐藏”或“比这些更大”的词语。以希伯来文为正文依据，同时在脚注保存希腊文较完整的异读，避免把异本内容无标记地并入正文。
- issue: 叙述者使用单数还是复数
  choice: 采用希伯来文第一人称单数“我”
  alternative: 我们只见过他少数的作为
  rationale: 希伯来文ראיתי明确为第一人称单数；希腊文则为第一人称复数。正文遵循希伯来文，脚注注明希腊文异读。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“多得很”自然传达数量之多；后半句使用话题结构“他的作为，我只见过少数”，既符合汉语习惯，也凸显人所见有限。所有异本信息均以脚注标明。
