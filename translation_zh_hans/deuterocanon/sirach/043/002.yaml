  text: The sun[a], appearing in its form and hot[c][b], how awe-inspiring are the works of the Lord.
translation:
  language: zh_hans
  text: 太阳[a]显出自己的形貌，发出热力[b][c]；上主的作为多么令人敬畏！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“太阳显现，在升起时宣告：它是奇妙的器具，是至高者的作品。”希伯来文本则强调太阳可见的形貌和热力。
    reason: alternative_reading
  - marker: b
    text: 希伯来文“显出自己的形貌，发出热力”措辞紧缩，含义略有困难；大意是太阳的外观和热力彰显上主那令人敬畏的作为。
    reason: lexical_alternative
  - marker: c
    text: 马萨达抄本在此只残存片段；正文采用开罗藏经库抄本所保存的较完整希伯来文。
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: 太阳
  rationale: 指天体太阳；现代汉语无需另加定冠词。
- source_word: מביע
  choice: 显现
  rationale: 该分词在此处含义略有困难；结合 בצורתו 的视觉语境及希腊文平行文本的 ὀπτασίᾳ，译为“显现”既保留可见呈现之意，也避免过度确定为“宣告”或“照耀”。
- source_word: בצורתו
  choice: 以其形貌
  rationale: צורה 指可见的形状、样貌；“形貌”比“形状”更适合庄重诗体，同时贴近希伯来文。
- source_word: וחמה
  choice: 且炽热
  rationale: 传世希伯来文表达紧缩而稍显生硬，看来描述太阳的热力；“炽热”自然表达其意，同时脚注保留文本难点及希腊文差异。
- source_word: מה נורא
  choice: 多么令人敬畏
  rationale: נורא 表示使人畏惧、惊叹或肃然起敬；“令人敬畏”在现代中文中庄重且不过分口语化。
- source_word: מעשי ה׳
  choice: 上主的作为
  rationale: מעשי 是复数“作为”；ה׳ 是神名的敬称缩写，在中文次经语境中译作“上主”，避免将复数误作单一作为。
theological_decisions:
- issue: 神名缩写 ה׳ 的译法
  choice: 上主
  alternative: 耶和华；主
  rationale: 希伯来文以敬称缩写代指神名。“上主”既保留神圣称号的性质，也符合庄重、跨宗派的现代中文表达；不根据希腊文“至高者”改写希伯来正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。正文保留希伯来文的紧缩结构与诗意感叹，不以希腊文平行文本替换其“形貌”和“炽热”的重点；用脚注交代异文、语义难点和抄本状况。
