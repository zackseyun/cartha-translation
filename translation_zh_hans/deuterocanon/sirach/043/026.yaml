  yaml_path: translation/deuterocanon/sirach/043/026.yaml
  text: For his sake the messenger succeeds[b][a], and by his word he accomplishes his will.
translation:
  language: zh_hans
  text: 为了他，使者[a]行事顺利；使者凭他的话成就他的旨意。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天使”。希伯来语 מַלְאָךְ 可指“使者”，也可指“天使”。
    reason: 保留原词可指人间使者或天上使者的词义歧义。
  - marker: b
    text: 希腊文平行文本的后半句作：“万有因他的话而一同被安排。”这比希伯来文的表述更广泛。
    reason: 记录与希伯来正文明显不同的重要平行读法，而不将其纳入正文。
lexical_decisions:
- source_word: למענו
  choice: 为了他
  rationale: לְמַעַן加代词后缀通常表示目的或所关涉的对象。“为了他”保留原文的目的性表达，并让“他”按上下文指向上帝。
- source_word: יצלח
  choice: 行事顺利
  rationale: צלח表示成功、顺利推进。这里译作“行事顺利”，既自然，也不额外补入原文没有明说的具体任务。
- source_word: מלאך
  choice: 使者
  rationale: מלאך既可指一般的使者，也可指天使。“使者”保留词义上的开放性，不在正文中预先限定为天上的使者。
- source_word: ובדבריו
  choice: 并照他的话
  rationale: ב可表示凭借、按照或在……之下；“照他的话”自然表达使者依从神圣命令而行动，同时避免把后半句扩写成希腊文较宽泛的宇宙秩序表述。
- source_word: יפעל
  choice: 成就
  rationale: פעל在此表示实行、促成或完成。“成就”适合与“旨意”搭配，并传达有效执行的含义。
- source_word: רצון
  choice: 他的旨意
  rationale: רצון可指意愿、喜悦或旨意。上下文涉及执行神的话，“旨意”是自然而庄重的表达；保留代词，不把原文未明说的名词直接补成“上帝”。
theological_decisions:
- issue: מלאך是否应明确译为“天使”
  choice: 使者
  alternative: 天使
  rationale: 希伯来词本身兼有“使者”和“天使”两义，本节也没有充分信息迫使读者采用专指天使的理解，因此正文保留歧义，并在脚注列出另一可能。
- issue: 后半句的施事者及代词所指
  choice: 承接前句，以“使者”为省略的主语，并保留“他”的代词表达
  alternative: 明说“上帝凭自己的话成就自己的旨意”
  rationale: 希伯来文动词均为阳性单数，语法上可自然承接“使者”；但多个阳性单数代词的指向并非完全显明。正文不擅自把施事者改成上帝，也不反复补写“上帝”，从而保留原文的紧凑与张力。
- issue: 是否把希腊平行文本“万有一同被安排”纳入正文
  choice: 以希伯来文“成就他的旨意”为正文
  alternative: 并且万有因他的话而一同井然有序
  rationale: 希伯来文是本次翻译的主要依据，且证据可信度高；希腊文是重要异文和平行见证，但不应取代现存希伯来措辞，故仅收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行事顺利”比单说“亨通”更贴近日常现代汉语，又不扩充具体使命；后半句省略重复主语，使其自然承接“使者”，同时保留代词指向的原文张力。
