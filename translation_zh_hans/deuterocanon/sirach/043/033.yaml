base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/033.yaml
  text: The Lord made everything[a], and to those who fear him he gave wisdom[b]; the praise of the fathers is everlasting.
translation:
  language: zh_hans
  text: 主造了万物，把智慧赐给敬畏他的人[a]。——对古代先祖的赞美[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“虔敬的人”；希伯来文更直译为“敬畏他的人”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文在此含有“对古代先祖的赞美”这句话。希腊文在“赐给智慧”处结束；因此，这句话也可能是下一段“赞美先祖”的标题或开头被带入本节。
    reason: textual_variant
lexical_decisions:
- source_word: את הכל
  choice: 万物
  rationale: כל在直接宾语结构中涵盖一切受造之物；“万物”简洁自然，也与希腊文πάντα相符。
- source_word: עשה
  choice: 造了
  rationale: עשה可指“做、造”；此处概括主对万物的作为，用“造了”既贴近原文，又保留创造语境。
- source_word: ה׳
  choice: 主
  rationale: 希伯来文以敬称缩写表示神名，希腊文对应ὁ κύριος；“主”是现代中文中庄重而通行的称呼。
- source_word: ליראיו
  choice: 给敬畏他的人
  rationale: 字面义为“给那些敬畏他的人”。保留“敬畏”这一重要的圣经表达，不以希腊文较解释性的“虔敬者”取代。
- source_word: נתן
  choice: 赐给
  rationale: נתן意为“给”；智慧由主授予，用“赐给”符合中文语境，并未增添原文没有的条件。
- source_word: חכמה
  choice: 智慧
  rationale: חכמה是《便西拉智训》的核心词，“智慧”准确、通行，也与希腊文σοφία一致。
- source_word: שבח אבות עולם
  choice: 先祖的赞美永存
  rationale: 该短语字面结构简略，可理解为“古代先祖的赞美”或“先祖永存的赞美”。正文依现有希伯来文本保留全部词语，并以自然中文表达其可能的述谓含义；其文本位置与句法不确定性在脚注说明。
theological_decisions:
- issue: 神名缩写ה׳的译法
  choice: 主
  alternative: 耶和华／上主
  rationale: 原文采用敬称缩写，希腊平行文本作“主”。译作“主”既明确所指是以色列的神，也不把底本未完整拼写的神名强行展开。
- issue: ליראיו应按希伯来文还是希腊文表达
  choice: 敬畏他的人
  alternative: 虔敬的人
  rationale: 以高可信度的希伯来文本为主，保留“敬畏神”的神学措辞；脚注交代希腊平行文本的解释性读法。
- issue: 是否在正文保留שבח אבות עולם
  choice: 保留为“先祖的赞美永存”
  alternative: 视为下一段标题的窜入而从正文删除
  rationale: 现有希伯来来源明确包含该短语，来源优先要求正文予以反映；但希腊平行文本没有此语，而且它可能与下一段“赞美先祖”的标题或开头有关，因此不掩盖其文本疑难，并在脚注中说明。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“造了万物”“赐给智慧”“敬畏他的人”保持圣经语体而不显古奥。末句按希伯来文本收入正文，同时以脚注保留其句法与文本归属上的真实不确定性。
