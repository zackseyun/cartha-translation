  naturalness: “我们的耳朵一听见”略显口语化且缺少明确的所闻内容；改为“我们听见这些事”更合现代书面汉语，同时不损失原文“听闻而惊”的关系。
  terminology: 以“航海的人”准确表达 יורדי הים 的语境义，并以脚注保留其字面意象。“海的尽头”可保留希伯来文的边际/极处之含混，不应在正文改作“危险”。
