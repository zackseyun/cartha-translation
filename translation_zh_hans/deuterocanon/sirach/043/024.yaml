  text: Those who go down to the sea recount its far reaches[a]; when our ears hear[b], we are astonished.
translation:
  language: zh_hans
  text: 航海的人[b]讲述海的尽头[a]；我们听见这些事，就惊愕不已。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“海的危险”，而希伯来文作“海的尽头（或边际、极处）”。正文从现存希伯来文本；希腊文可能反映异文，也可能是着眼于海上险境的解释性译法。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“下到海里的人”，是指航海者的惯用说法。
    reason: cultural_note
lexical_decisions:
- source_word: יורדי הים
  choice: 下海的人
  rationale: 直译为“下到海里去的人”，是指航海者的希伯来语惯用说法。“下海的人”保留原文意象，在现代汉语中也自然易懂；希腊文“航行海上的人”印证其航海含义。
- source_word: יספרו
  choice: 讲述
  rationale: 该动词表示叙说、述说；这里指航海者讲述亲身所见所历。
- source_word: קצהו
  choice: 海的尽头
  rationale: 希伯来文意为“它的尽头、边际、极处”。译作“海的尽头”保留原文具体而略带诗意的表达，不把它限定解释为辽远海域。希腊文异读“它的危险”另见脚注。
- source_word: לשמע אזנינו
  choice: 我们的耳朵一听见
  rationale: 原文近乎直译是“到了我们耳朵听见时”，带有感官上的强调。此译保留“耳朵”这一意象，同时符合现代汉语表达。
- source_word: נשתומם
  choice: 惊愕不已
  rationale: 该词表示震惊、愕然或惊异。此处既可能回应大海的辽阔，也可能含其可畏之处；“惊愕不已”保留这种张力，不专门限定为恐惧或赞叹。
