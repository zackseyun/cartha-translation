  text: At his word the decree stands[b][a], and they do not fail in their watches.
translation:
  language: zh_hans
  text: 因上帝的话，定规便立定[a]；它们在各自的守望中并不松懈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 马萨达希伯来文本作“因主的话，定规便立定”；这里所据的开罗藏经库文本作“因上帝的话”。
    reason: textual_variant
  - marker: b
    text: 或译“它们在各自的岗位上并不衰弱”。此处希伯来动词的读法和含义不完全确定；希腊文本支持“不松懈、不衰弱”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר אל
  choice: 因上帝的话
  rationale: בְּדְבַר可表达凭借、原因或所依据的话；所给希伯来文本明确有“אל”（上帝）。译作“因上帝的话”既贴近字面，也自然表达天体秩序由上帝的话而立。
- source_word: יעמד חק
  choice: 定规得以确立
  rationale: עמד本义为“站立、存立”，与חק搭配时表示所规定的秩序成立并保持有效。“定规”兼顾חק在宇宙语境中的法令与固定秩序之意。
- source_word: ולא ישח
  choice: 决不懈怠
  rationale: 此处希伯来词形及读法存在不确定性，字面可能涉及下沉、低垂；希腊平行文本用ἐκλυθῶσιν，支持“松懈、疲弱”，马萨达材料所反映的意思也接近“不疲倦”。正文采用符合语境的“决不懈怠”，并以脚注保留不确定性。
- source_word: באשמרותם
  choice: 在各自的值守中
  rationale: אשמרות可指守更、值守时段或守卫岗位；这里描写天体各守其位、各按班次运行。“各自的值守”保留守望意象，同时适合现代汉语。
theological_decisions:
- issue: 是否在正文明确说出神圣主体
  choice: 译作“上帝”，因为所给希伯来文本读作בדבר אל
  alternative: 依马萨达异文译作“因主的话”；或将主体处理为代词“因他的话”
  rationale: 当前提供的主要希伯来文本含אל，通常意为“上帝”；因此不宜在正文中将神圣主体隐去。马萨达所见אדני则作为文本异文记录，不把“主”直接带入正文。
- issue: “定规”是法令还是宇宙秩序
  choice: 采用兼具命令与固定秩序意味的“定规”
  alternative: 法令；定例；固定秩序
  rationale: 本节处于天体运行的语境，חק既有权威规定之意，也指受造界固定的运行秩序；“定规”避免将含义缩限为人间法律。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“值守”保留天体如守望者按指定班次或岗位运行的形象；分号对应原文两个紧密相连的分句。
