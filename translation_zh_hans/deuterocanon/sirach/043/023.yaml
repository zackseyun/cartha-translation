  text: By his plan he stilled the deep[b][a], and planted islands in it.
translation:
  language: zh_hans
  text: 他凭自己的谋划使深渊平静[a]，又在其中安置海岛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文本较难理解；希腊平行文本作：“他凭自己的思量使深渊平静，并栽种了它。”这支持“使深渊平静”的理解；其“栽种”一词也与本句在深渊中设立海岛的整体意象相呼应。
    reason: textual_variant
  - marker: b
    text: “海岛”也可译作“沿海之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מחשבתו
  choice: 他按自己的谋划
  rationale: מחשבה可指思想、意图或谋划；此处描述创造秩序中的有效旨意，“谋划”既表达深思筹定，也避免仅指一时念头。希腊文λογισμῷ αὐτοῦ同样支持筹划、思量之意。
- source_word: משיק
  choice: 使……平静
  rationale: 希伯来文词形和句法较难确定；希腊平行文本ἐκόπασεν意为“使止息、使平静”，结合深渊意象，译作“使……平静”自然且审慎。
- source_word: רבה / בתהום
  choice: 深渊；在其中
  rationale: 此处希伯来文本存在困难，希腊文ἄβυσσον清楚指“深渊”。前句明确“深渊”后，בתהום在后句按其指向译为“在其中”，使中文流畅，同时保留海中设立陆地的意象。
- source_word: ויט
  choice: 栽立
  rationale: 希伯来文可能表达安置、设立；希腊文ἐφύτευσεν直译为“栽种”。“栽立”保留栽种的鲜明比喻，同时清楚表达海岛被稳固设立。
- source_word: איים
  choice: 海岛
  rationale: איים可指岛屿或沿海地区；创造语境中“海岛”更具体，并与在深渊中栽立的图景相合。脚注保留“沿海之地”的可能。
theological_decisions:
- issue: 难解希伯来文本与较清楚的希腊平行文本之间的张力
  choice: 以现存希伯来文为基础，并用希腊平行文本澄清难解的动词和整体意象，译为“他按自己的谋划使深渊平静，又在其中栽立海岛”。
  alternative: 他凭自己的意念使大水止息，又在深渊中设立沿海之地。
  rationale: 现存希伯来文应居首要地位，但本节文字确有困难。采用希腊见证来稳定“使平静”和“栽种／设立”的语义，同时用脚注如实说明文本问题，不把不确定性转化为教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“谋划”表达有意而有效的安排；“深渊”保留圣经宇宙图景；“栽立”兼顾希腊文的栽种比喻与现代中文对稳固设立的理解。脚注标记依正文出现顺序排列。
