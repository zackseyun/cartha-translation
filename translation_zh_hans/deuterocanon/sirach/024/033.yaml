  text: Still I will pour out instruction like prophecy[c][b][a], and I will leave it for everlasting generations.
translation:
  language: zh_hans
  text: 我还要把教诲像预言一样倾注出来[a]，并把它留给万世万代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像预言一样”或可译作“作为预言”。希腊语ὡς既可表示比较，也可表示身份或作用。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι
  choice: 还要
  rationale: 在这里表示进一步或继续有所行动；“还要”既自然，也不把语义过度限定为严格的重复。
- source_word: διδασκαλίαν
  choice: 教诲
  rationale: 符合智慧文学语体，兼具教导与训诲之意，又避免“教义”所带的技术性或制度性色彩。
- source_word: ὡς προφητείαν
  choice: 如预言一般
  rationale: 保留ὡς最直接的比较意味，同时不排除将其理解为“作为预言”的可能，相关歧义在脚注中说明。
- source_word: ἐκχέω
  choice: 倾注出来
  rationale: 保留“倾倒、涌流”的鲜明意象；结合并列的将来时καταλείψω，在汉语中用“要”表达将来指向。
- source_word: καταλείψω αὐτήν
  choice: 把它留给
  rationale: αὐτήν回指“教诲”；“留给”自然表达将其存留并传给后世的含义，不过度加入“遗赠”等解释。
- source_word: εἰς γενεὰς αἰώνων
  choice: 给万世万代
  rationale: 以现代汉语的固定表达传达跨越无尽世代、永久存留的意思，避免生硬直译为“永恒的世代”。
theological_decisions:
- issue: ὡς προφητείαν中比较与身份认定之间的张力
  choice: 正文译作“如预言一般”，明确呈现比较
  alternative: “作为预言”或“当作预言”
  rationale: ὡς既可表达“如同”，也可表达“作为”。正文采用较为谨慎的比较义，避免无根据地强化这教诲与预言在身份上的等同，同时用脚注保留另一种理解。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“教诲”“倾注出来”“万世万代”保留智慧文学的诗性与传承意象，同时避免过度古雅。
