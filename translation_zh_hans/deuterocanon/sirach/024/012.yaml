  text: And I took root among a glorified people[a], in the portion of the Lord[b], his inheritance.
translation:
  language: zh_hans
  text: 我在得了荣耀的百姓中[a]扎下了根，在主的那一份——他的产业——中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“荣耀的百姓中”。原文是完成时被动分词，主译保留了“得了荣耀”这一动作结果的意味。
    reason: lexical_alternative
  - marker: b
    text: “在主的那一份——他的产业——中”也可译作“在主产业的份中”或“在主所分得的产业中”。原文结构紧凑，可有不同的句法理解。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρίζωσα
  choice: 扎下了根
  rationale: 该词为第一人称单数不定过去时主动形式；“扎下了根”是自然的现代汉语表达，也保留了主动进入并安顿下来的意象。
- source_word: λαῷ
  choice: 百姓
  rationale: λαός指一个群体或民族共同体，此处又处在主的产业这一语境中；“百姓”比“国家”更贴近其集体和归属意味。
- source_word: δεδοξασμένῳ
  choice: 得了荣耀的
  rationale: 这是δοξάζω的完成时被动分词。“得了荣耀的”保留其被动及结果状态，表明荣耀是所领受的，而不只是固有性质。
- source_word: μερίδι
  choice: 份
  rationale: μερίς可指分得或划定的一份。“份”简洁地保留分配、归属的意味，并与后面的“产业”相呼应。
- source_word: Κυρίου
  choice: 主
  rationale: 按经文语境将Κύριος译为“主”，用语庄重且为现代中文读者熟悉。
- source_word: κληρονομίας
  choice: 产业
  rationale: κληρονομία指承受所得的产业、基业或继承物；“产业”在此能表达归属和承受之物，同时读来较自然。
theological_decisions:
- issue: δεδοξασμένῳ应按单纯形容词理解，还是保留完成时被动分词的结果意味。
  choice: 得了荣耀的百姓
  alternative: 荣耀的百姓；受尊荣的百姓
  rationale: 原文是完成时被动分词，主译保留“已经被赋予荣耀”这一结果意味，不把荣耀处理为百姓固有的性质，也不进一步说明荣耀的来源或方式。
- issue: 如何理解ἐν μερίδι Κυρίου κληρονομίας αὐτοῦ这一紧凑结构。
  choice: 在主的份中，就是他的产业
  alternative: 在主产业的份中；在主所分得的产业中
  rationale: 原文的属格和同位关系较为紧凑。主译尽量保留“主的份”与“他的产业”两层措辞，并用“就是”显示可能的同位关系，而不排除其他句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“扎下了根”保留原文生长和安居的形象；“得了荣耀”虽略带书面色彩，却能准确呈现完成时被动分词。两个脚注标记均已置于正文相应位置。
