  text: For the memory of me is sweeter than honey[c][b][a], and my inheritance is sweeter than the honeycomb.
translation:
  language: zh_hans
  text: 因为对我的记念比蜜甘甜[a]，我的产业比蜂房更甜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记念”也可译作“回忆”或“纪念”。
    reason: lexical_alternative
  - marker: b
    text: “蜂房”：原文直译近于“蜜的蜂蜡”；这是指蜂房或蜂巢蜜的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημόσυνόν μου
  choice: 人对我的记念
  rationale: μνημόσυνον可指记念、回忆或纪念之物；结合属格μου和本章智慧的第一人称自述，译为“人对我的记念”，既自然又明确保留智慧是被记念的对象。
- source_word: ὑπὲρ μέλι γλυκύ
  choice: 比蜜甘甜
  rationale: γλυκύ虽为原级形式，但ὑπέρ在这里构成比较意义，因此译作“比蜜甘甜”。
- source_word: ἡ κληρονομία μου
  choice: 我的产业
  rationale: κληρονομία可指产业、继承所得或基业。“产业”保留其可承受、可拥有的含义，同时不预先限定为智慧所留下的遗产或智慧赐给人的份。
- source_word: μέλιτος κηροῦ
  choice: 蜂房里的蜜
  rationale: 该短语字面涉及蜜与蜂蜡，惯用上指蜂房中的蜜；译作“蜂房里的蜜”比单译“蜂房”更准确地保留甘甜比较的对象。
theological_decisions:
- issue: 第一人称说话者的所指
  choice: 保留智慧以第一人称谈论自己
  alternative: 将本句抽象化，理解为智慧的名声或遗产
  rationale: 《德训篇》24章的上下文是智慧以第一人称自述；因此保留“我的记念”和“我的产业”，不消解其人格化表达。
- issue: “我的产业”的语义关系
  choice: 保留“产业”的开放性
  alternative: 明确译成“我赐下的产业”或“我留下的遗产”
  rationale: 原文没有明说这产业是智慧所赐、所留，还是属于智慧的份；直译为“我的产业”可保留这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两分句保持诗歌式平行；第二句补出“更甜”，使中文自然清楚。所有脚注标记均置于正文对应位置。
