  text: And I, like a canal from a river, and like a water channel, went out into a garden.
translation:
  language: zh_hans
  text: 我也像从河中引出的水渠，又像一道引水沟，延伸到园中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “园子”或译“乐园”。希腊词可指园子、园林或乐园；这里紧接水渠灌溉的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: 我也
  rationale: κἀγώ兼有承接和强调说话者自身的作用；“我也”简洁保留“καί”可能具有的“也”义。
- source_word: διῶρυξ
  choice: 水渠
  rationale: 该词指人工开凿的沟渠；“水渠”既自然，也与作为水源的“河”形成区别。
- source_word: ἀπὸ ποταμοῦ
  choice: 从河里引出的
  rationale: ἀπό表示来源；结合人工水渠的意象，译作“从河里引出的”比生硬的“来自一条河”更符合现代汉语，同时不把无冠词的ποταμός特定化。
- source_word: ὑδραγωγός
  choice: 引水沟
  rationale: 该词表示导水的人工通道；“引水沟”突出其导流功能，并避免“渡槽”所带来的特定建筑形态。
- source_word: ἐξῆλθον
  choice: 流进
  rationale: 字面义为“出去、出来”；主语处于水渠和导水沟的比喻中，汉语用“流进”自然呈现水流进入园子的运动方向。
- source_word: παράδεισον
  choice: 园子
  rationale: 此处处于灌溉意象中，指受灌溉的园圃或园林；“园子”具体自然，不先行引入后世“乐园”的神学联想。
theological_decisions:
- issue: 智慧比喻中παράδεισος的译法
  choice: 园子
  alternative: 乐园
  rationale: 上下文直接描绘水渠灌溉园圃，并非明确谈论末世乐园；正文采用具体的“园子”，脚注保留“乐园”的词义可能，以保存原词可能引发的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“水渠／引水沟”保留两个近义人工水道词的平行；“流进”按水流意象自然化ἐξῆλθον，而不改变其从水源延伸至园中的基本方向。
