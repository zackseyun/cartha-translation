  text: I am the mother of beautiful love[a], and of fear, and of knowledge, and of holy hope[b];
translation:
  language: zh_hans
  text: 我是美好的爱[a]、惧怕[b]、知识和圣洁盼望的母亲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “美好”也可译作“美善”或“高尚”；希腊语καλῆς兼有审美和道德方面的意味。
    reason: lexical_alternative
  - marker: b
    text: “惧怕”也可译作“敬畏”；在智慧文学中，这个词常指敬畏，尤其是对上帝的敬畏。
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: 母亲
  rationale: 保留原文拟人化智慧所用的亲属隐喻；不抽象化为“源头”或“根源”。
- source_word: καλῆς
  choice: 美好
  rationale: καλός兼有美、善和高尚的意味；“美好”在现代汉语中较自然地兼顾审美与道德内涵。
- source_word: ἀγάπης
  choice: 爱
  rationale: 直接对应ἀγάπη，简洁自然，无须按特定神学体系加以限定。
- source_word: φόβου
  choice: 惧怕
  rationale: 保留φόβος的基本义及其张力，不在正文中径直收窄为智慧文学语境下的“敬畏”。
- source_word: γνώσεως
  choice: 知识
  rationale: 直接表达γνῶσις，较“领悟”或“理解”更贴近原词。
- source_word: ἁγίας
  choice: 圣洁
  rationale: 对应ἅγιος，并自然修饰“盼望”；保留其宗教与伦理意味。
- source_word: ἐλπίδος
  choice: 盼望
  rationale: “盼望”是圣经语体中自然、清楚的对应词，比“期待”更能承载此处的庄重意味。
theological_decisions:
- issue: 智慧文学语境中φόβου的含义
  choice: 惧怕
  alternative: 敬畏
  rationale: 智慧文学中的“惧怕”常含对上帝敬畏之意，但本句未明说对象，也未用词限定为纯粹的崇敬；正文保留较宽的基本义，并以脚注提示语境中的可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“母亲”的拟人化意象，并用并列结构呈现四个属格成分。脚注标记紧随各自所说明的词语。
