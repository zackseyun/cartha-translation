  yaml_path: translation/deuterocanon/sirach/024/001.yaml
  text: Wisdom will praise herself[c][b][a], and in the midst of her people she will boast.
translation:
  language: zh_hans
  text: 智慧要赞美自己[a]，要在她的子民中夸耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己”按语境译出；希腊文直译为“她的魂”，这里可作反身表达。
    reason: lexical_alternative
  - marker: b
    text: “夸耀”也可译作“夸口”或“以自己为荣”；原词可指公开的欢然宣扬，也可指自我夸耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ σοφία
  choice: 智慧
  rationale: 保留人格化的“智慧”；汉语代词“她”使其女性人格形象在下半句中清楚显明，无须以不自然的专名格式另作标示。
- source_word: αἰνέσει
  choice: 要赞美
  rationale: 该词为将来时，基本义是“赞美、称颂”；“要赞美”既保留时态，也自然庄重。
- source_word: ψυχὴν αὐτῆς
  choice: 自己
  rationale: 字面为“她的魂/性命”，但在此可作受闪语影响的反身表达；译作“自己”准确传达语境意义，并在脚注保留字面形式。
- source_word: ἐν μέσῳ
  choice: 在……中
  rationale: 自然表达身处群体之中的公开场景，同时保留原文的空间意味。
- source_word: λαοῦ αὐτῆς
  choice: 她的子民
  rationale: λαός 指人民或子民；“她的子民”保留原文所属关系，也符合本段人格化智慧的公共场景。
- source_word: καυχήσεται
  choice: 夸耀
  rationale: 可指夸口、夸耀或以……为荣；“夸耀”保留公开自我宣示的语气，又不预先判定为罪性的自夸。
theological_decisions:
- issue: 智慧的人格化
  choice: 保留女性人格指称“她”
  alternative: 将智慧完全作为抽象概念处理，不使用人格代词
  rationale: 希腊文语法为阴性，且本章让智慧以人格化形象发言；保留“她”忠实呈现其文学与神学张力，而不进一步把她等同于某一特定教义对象。
- issue: καυχήσεται 的价值色彩
  choice: 译为“夸耀”，不加褒贬解释
  alternative: 译为偏褒义的“引以为荣”或偏贬义的“自吹自擂”
  rationale: 原词可表达公开夸耀或以某事为荣；正文保留其张力，避免强加道德判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要……，要……”对应两个将来时，并形成整齐的诗性节奏；“她的子民”保留人格化和所属关系。
