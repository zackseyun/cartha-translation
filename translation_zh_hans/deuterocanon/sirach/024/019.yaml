  text: Come to me[a], you who desire me[b], and be filled with my fruits.
translation:
  language: zh_hans
  text: 渴慕我的人哪，到我这里来[a]，从我的果实中得饱足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走近我。”
    reason: lexical_alternative
  - marker: b
    text: “果实”也可译作“出产”或“所结的果子”；这里保留上下文中智慧如同结果植物的诗歌意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: προέλθετέ πρὸς μέ
  choice: 到我这里来
  rationale: 该短语是复数命令式加方向短语，表达智慧邀请众人前来亲近她。“到我这里来”符合现代汉语习惯，也保留了趋向说话者的动作。
- source_word: οἱ ἐπιθυμοῦντές μου
  choice: 渴慕我的人
  rationale: 分词表达强烈的愿望。“渴慕”比普通的“想要”更能传达力度，并适合拟人化智慧发出的诗性邀请。
- source_word: γενημάτων
  choice: 果实
  rationale: γένημα指所产生之物，可指果品、出产或成果。上下文把智慧描绘为芳香而结果的植物，因此“果实”最能保留诗歌意象。
- source_word: ἐμπλήσθητε
  choice: 饱享
  rationale: 该词是复数被动命令式，基本意为“被充满”。与“果实”搭配时，“饱享”自然表达吃得丰足的意象，同时不把果实明确解释为教训或恩惠。
theological_decisions:
- issue: 拟人化智慧的邀请及果实意象
  choice: 保留智慧的第一人称话语和“我的果实”这一隐喻，不在正文中说明果实具体指什么。
  alternative: 把“果实”明确译解为智慧的教训、益处或恩赐。
  rationale: 希腊文本维持拟人和植物意象；将其直接解释为某种教义性内容会消除原文有意保留的诗性开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人哪”体现直接呼唤；“渴慕”和“饱享”保留诗性，但在当代宗教及文学语境中仍自然可懂。所有脚注标记均已置于正文。
