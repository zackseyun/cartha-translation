  text: I alone encircled the vault of heaven[c][b][a], and walked in the depths of the abysses.
translation:
  language: zh_hans
  text: 我独自绕行天穹[a]，又在深渊的深处行走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天的圆周”。原词可指圆形的范围、环道或拱曲的穹顶。
    reason: lexical_alternative
  - marker: b
    text: “深渊”原文为复数，描绘重重不可测度的深处。
    reason: lexical_form
lexical_decisions:
- source_word: γῦρον
  choice: 天穹
  rationale: 该词表示圆形、弧形的范围或环道；与“天”连用时，描绘天空弯曲如穹顶的宇宙图景。“天穹”在现代汉语中自然、庄重，也保留了这一形象。
- source_word: ἐκύκλωσα
  choice: 环绕
  rationale: κυκλόω表示绕行或环绕；“环绕”保留原文的圆周意象，并与“天穹”搭配自然。
- source_word: μόνη
  choice: 我独自
  rationale: 阴性单数形式与拟人化的智慧相应，并强调唯有说话者如此行；“我独自”清楚传达这一排他性重点。
- source_word: βάθει
  choice: 深处
  rationale: 该词虽为单数形式，但在“众深渊的深处”这一结构中表示深渊内部极深之处；译作“深处”既贴近形式，也符合现代汉语。
- source_word: ἀβύσσων
  choice: 众深渊
  rationale: 原文为复数属格，指多个或重重不可测度的深渊；“众深渊”明确保留复数，同时维持宇宙性的庄重语域。
- source_word: περιεπάτησα
  choice: 行走
  rationale: 该动词本义是走动、行走；“行走”保留具体形象，不以“遍历”等解释性较强的词替代。
theological_decisions:
- issue: 拟人化智慧的说话身份
  choice: 保留第一人称及“独自”的强调，将本句呈现为拟人化智慧的自述，不作超出本文语境的身份界定。
  alternative: 把本句直接解释为某一特定神圣位格的陈述。
  rationale: 《德训篇》24章的文学语境是智慧以第一人称说话。本节本身并未裁定其与后来的位格神学之间的关系，因此译文应保留其文学与神学张力，而不代替原文作进一步认定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“天穹”保留古代宇宙图景而不过分古奥；“众深渊的深处”有意同时体现 βάθει 的单数概念和 ἀβύσσων 的复数形式。两个并列动词共用第一人称主语，后半句不重复“我”，以贴近希腊文结构并保持汉语流畅。
