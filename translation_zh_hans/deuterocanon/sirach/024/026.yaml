  yaml_path: translation/deuterocanon/sirach/024/026.yaml
  text: It fills up understanding like the Euphrates[a], and like the Jordan in the days of harvest[d][c][b];
translation:
  language: zh_hans
  text: 它使悟性充盈，如幼发拉底河；又如收割时节的约旦河。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文开头是带定冠词的分词，也可译作：“那使悟性充盈的，如幼发拉底河，又如收割时节的约旦河。”河水丰沛的景象突出了智慧的丰富。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀναπληρῶν
  choice: 它使……充盈
  rationale: ἀναπληρῶν是带定冠词的主动分词，并以σύνεσιν为宾语，表达使悟性充满、丰盈之意。结合大河水势充沛的比喻，“使……充盈”既保留其及物结构，也传达丰盛感；代词“它”承接上文所述对象。
- source_word: σύνεσιν
  choice: 悟性
  rationale: σύνεσις指理解、领悟或洞察的能力；“悟性”简洁自然，符合智慧文学语域，也保留其抽象名词性质。
- source_word: ὡς Εὐφράτης
  choice: 如幼发拉底河
  rationale: ὡς引出比喻；采用现代汉语通行河名，并补出“河”，使地理意象清楚自然。
- source_word: Ἰορδάνης
  choice: 约旦河
  rationale: 采用现代汉语通行名称，明确其河流所指。
- source_word: ἐν ἡμέραις θερισμοῦ
  choice: 收割时节
  rationale: 该短语直指收割的日子或时期。“收割时节”符合现代汉语，同时保留季节性的具体意象。
theological_decisions:
- issue: ὁ ἀναπληρῶν的主语表达
  choice: 以“它”承接上文，不在本节另行指明身份
  alternative: 译作“那使悟性充盈的”或明确重复上文名词
  rationale: 希腊文本以带定冠词的分词承接前文，其所指需由上下文确定。本节采用代词可使中文成句，又不额外导入身份解释。
- issue: 河流比喻与悟性的语义关系
  choice: 译为“使悟性充盈”
  alternative: 译为“满有悟性”或“涌流着悟性”
  rationale: σύνεσιν在希腊文中是ἀναπληρῶν的直接宾语，因此保留使某物充盈的及物关系，避免把原文改成主语自身充满悟性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“充盈”兼具使之充满与丰盛之感，适合智慧文学及河流意象；分号呈现两个平行比喻。
