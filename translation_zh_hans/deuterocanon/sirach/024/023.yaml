  text: All these things are the book of the covenant of God Most High[b][a], the law that Moses commanded as an inheritance for the assemblies of Jacob.
translation:
  language: zh_hans
  text: 这一切都是至高上帝的盟约之书，就是摩西所吩咐、作为雅各的各个会众[a]之基业的律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”也可译作“集会”或“聚集的群体”。这里指雅各（即以色列）的聚集群体，不一定特指后世制度化的会堂。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα πάντα
  choice: 这一切
  rationale: 概括前文所述的一切内容；现代汉语用“这一切”即可自然保留希腊语中整体性的回指。
- source_word: βίβλος διαθήκης
  choice: 盟约之书
  rationale: βίβλος指书卷或成文之书，διαθήκη在此摩西律法的语境中指上帝与其子民所立的盟约；“盟约之书”简明保留两者。
- source_word: θεοῦ Ὑψίστου
  choice: 至高上帝
  rationale: 将Ὑψίστου理解为修饰θεοῦ；“至高上帝”是自然、庄重的现代汉语表达。
- source_word: νόμον
  choice: 律法
  rationale: 此处特指与摩西及盟约之书相连的律法，而非泛指一般法规。
- source_word: ὃν ἐνετείλατο Μωυσῆς
  choice: 摩西所吩咐的
  rationale: ἐντέλλομαι表示吩咐、命令；此译法保留摩西为语法主语，不改写为“上帝借摩西赐下”。
- source_word: κληρονομίαν
  choice: 产业
  rationale: 指作为承受之物的产业或基业；“产业”在现代汉语中较易懂，也保留律法属于雅各群体的传承意义。
- source_word: συναγωγαῖς Ἰακώβ
  choice: 雅各各会众
  rationale: συναγωγαῖς为复数，基本含义是聚集的群体；“各会众”保留复数，又避免直接套用后世制度化的“会堂”。
theological_decisions:
- issue: διαθήκη在摩西律法语境中的译法
  choice: 盟约
  alternative: 遗约；约定
  rationale: 本节把成文启示、摩西与雅各的群体联系起来，διαθήκη在此具有圣经中的盟约含义；“盟约”既准确，又不把它误解为遗嘱。
- issue: 律法作为κληρονομίαν与雅各各会众的关系
  choice: 是雅各各会众的产业
  alternative: 赐给雅各各会众作产业
  rationale: 希腊文将“产业”与“律法”并置，并以与格指出相关群体；正文保留这种简洁关系，不补入原文没有明说的“赐给”或“留下”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“盟约之书”“律法”“产业”保留经文的圣约与传承语域；以两个“就是／也就是”和一个“是”呈现希腊文的同位结构，同时避免过度补足原文未明说的施予动作。
