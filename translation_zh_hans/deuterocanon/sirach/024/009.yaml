  yaml_path: translation/deuterocanon/sirach/024/009.yaml
  text: Before the age[a], from the beginning, he created me[c][b], and for all ages I will never cease.
translation:
  language: zh_hans
  text: 在时间以前，从起初，他创造了我；直到永远，我绝不会止息。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在时间以前”也可译作“在时代以前”或“在永恒以前”。希腊文αἰών可指时代，也可按上下文指时间或无尽的延续。
    reason: lexical_alternative
  - marker: b
    text: “直到永远，我绝不会止息”也可译作“直到永恒，我绝不会终结”。希腊文的否定语气很强。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ αἰῶνος
  choice: 在万世以前
  rationale: αἰών在这里指受造秩序中的时代或时间历程；“在万世以前”自然表达智慧在时间展开之前的原初位置，同时不把词义僵化为某一个特定时代。
- source_word: ἀπʼ ἀρχῆς
  choice: 从起初
  rationale: 保留原文表示起点的措辞，并采用现代中文圣经语体中自然、庄重的表达。
- source_word: ἔκτισέν με
  choice: 他就创造了我
  rationale: κτίζω的直接含义是“创造、建立”；此处保留“创造”，不因后来的神学争议而弱化人格化智慧所说的话。“我”明确保留智慧的第一人称拟人表达。
- source_word: ἕως αἰῶνος
  choice: 直到永远
  rationale: 此处αἰών侧重无尽的持续，中文“直到永远”比逐字的“直到世代”更自然，也保留时间延伸至无穷的意义。
- source_word: οὐ μὴ ἐκλίπω
  choice: 我绝不会消逝
  rationale: οὐ μή构成强烈否定；ἐκλείπω在此指停止存在、消失或终结，而非办事失败。“绝不会消逝”兼顾存在意义和强调语气。
theological_decisions:
- issue: 是否为避免智慧具有受造性而弱化“创造了我”
  choice: 保留“他就创造了我”
  alternative: 他建立了我／他塑造了我
  rationale: 原文使用ἔκτισέν，最直接的译法是“创造了”。本节说话者是人格化的智慧；译文应保留文本本身的张力，而不以较弱措辞预先解决后来的基督论或智慧论问题。
- issue: 如何表达智慧持续存在的范围
  choice: 直到永远，我绝不会消逝
  alternative: 直到世代，我绝不止息／世世代代，我永不终止
  rationale: 原文把ἕως αἰῶνος与强调否定οὐ μή并置，表达没有终点的持续存在；中文采用自然措辞，但不额外说明这种持续与前句“受造”之间的神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从起初”保留经文语感；“创造了我”直译关键神学措辞；“绝不会消逝”自然传达强调否定和持续存在。脚注标记置于整节末尾，涵盖本节相关词义备选。
