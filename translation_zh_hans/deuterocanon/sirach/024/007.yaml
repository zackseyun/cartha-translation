  text: Among all these I sought a resting place[b][a], and in whose inheritance shall I lodge?
translation:
  language: zh_hans
  text: 在这一切之中，我寻求安歇之处[a]，我将在谁的基业中投宿呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安歇之处”也可译作“安歇”或“休息”。希腊语名词本身可指安歇；因下句谈到投宿，这里译出地点意味。
    reason: lexical_alternative
  - marker: b
    text: “投宿”也可译作“住宿”或“扎营过夜”。希腊语动词可指投宿、过夜或扎营。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τούτων πάντων
  choice: 在这一切之中
  rationale: μετά加属格在此可表达处于一组对象之中；上下文是拟人化的智慧察看可安居之处，因此译作“在这一切之中”比时间性的“在这一切之后”更合适，同时不限定具体对象。
- source_word: ἀνάπαυσιν
  choice: 安歇之处
  rationale: 该名词本义为“安歇、休息”；结合下句“寄居”的地点意味，译成“安歇之处”既自然，又保留其可作抽象“安歇”理解的空间。
- source_word: ἐζήτησα
  choice: 我寻求
  rationale: 准确表达ζητέω的寻找、寻求之意；“寻求”庄重而符合拟人化智慧的发言语体。
- source_word: κληρονομίᾳ
  choice: 产业
  rationale: κληρονομία可指继承所得或分配所得的份地、产业；“产业”在现代中文圣经语境中能兼顾归属和所得之地的含义，且比“遗产”更适合可供寄居的领域。
- source_word: τίνος
  choice: 谁的
  rationale: 直接表达属格疑问代词所询问的所有者，中文自然明确。
- source_word: αὐλισθήσομαι
  choice: 我将寄居
  rationale: αὐλίζομαι可指过夜、住宿或扎营；“寄居”保留暂住、落脚的意味，又避免“扎营”可能带来的军事色彩。
theological_decisions:
- issue: 拟人化智慧寻找安居之所
  choice: 按经文直译为智慧寻求安歇之处，并询问将在谁的产业中寄居，不在本节明说该产业所指。
  alternative: 在正文中直接把“产业”解释为以色列，或抽象解释为在人群中得到接纳。
  rationale: 希腊文本在此保留疑问，而后文才进一步说明智慧所得的安居之处；本节应维持这种文学推进和神学张力，不预先作身份或对象上的限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在这一切之中”保留范围关系；“安歇之处”与“寄居”形成自然呼应。问号后的脚注[b]明确对应“寄居”，所有脚注标记均已置于正文。
