  yaml_path: translation/deuterocanon/sirach/024/016.yaml
  text: Like a terebinth I spread out my branches[d][c][b][a], and my branches are branches of glory and grace.
translation:
  language: zh_hans
  text: 我像笃耨香树一样伸展枝条[a][b]；我的枝条是荣耀和恩惠的枝条[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伸展”也可译作“展开”或“延伸”。
    reason: lexical_alternative
  - marker: b
    text: “笃耨香树”（tere­binth）是地中海地区的一种大型树木；希腊文特指此树，有些译本较笼统地译作“橡树”。
    reason: cultural_note
  - marker: c
    text: “恩惠”也可译作“恩宠”或“优美”；原词可指恩惠、可喜或悦人之美。
    reason: lexical_alternative
lexical_decisions:
- source_word: τερέβινθος
  choice: 笃耨香树
  rationale: 希腊文指一种具体树木，即 terebinth（Pistacia terebinthus），不是泛称的“橡树”。“笃耨香树”是中文圣经语境中可辨识的专名，并以脚注说明。
- source_word: ἐξέτεινα
  choice: 伸展
  rationale: 该动词表示向外延伸；“伸展枝条”自然地保留树枝向外展开的动态，也比单纯“长出”更贴近原文。
- source_word: κλάδους / κλάδοι
  choice: 枝条
  rationale: “枝条”准确、通俗，并可自然保留原文两次重复 κλάδοι 所形成的诗意强调。
- source_word: δόξης
  choice: 荣耀
  rationale: “荣耀”保留 δόξα 在圣经语体中的宽广含义及庄重色彩，不把它限缩为视觉上的“华美”。
- source_word: χάριτος
  choice: 恩美
  rationale: χάρις 可涵盖恩惠、悦人之美与可喜之意；“恩美”在此兼顾惠泽与美好，避免只取教义化的“恩典”或纯审美的“美丽”。
theological_decisions:
- issue: 智慧以树木自述其丰盛与可悦
  choice: 直接保留树木比喻和“枝条”的重复，不作解释性扩写
  alternative: 译作“我长出荣耀而优美的枝条”
  rationale: 原文明确重复“我的枝条是……的枝条”，且 δόξης καὶ χάριτος 是两个属格名词。直译其结构可保存诗歌力度，并避免把“荣耀与恩美”压缩成两个性质形容词。
- issue: χάρις 在智慧诗歌中的语义张力
  choice: 译作“恩美”，并在脚注列出“恩惠”这一可能译法
  alternative: 译作“恩典”或“恩惠”
  rationale: 上下文兼具树木之美和智慧施惠的意象；“恩美”保存这种双重可能，不将经文预先限定为某一神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。把比喻前置，以贴合希腊文次序及本段连续树木比拟的节奏；用分号清楚呈现两个并列分句，并保留“枝条”的重复。
