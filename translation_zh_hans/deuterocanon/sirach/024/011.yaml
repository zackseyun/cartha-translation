  text: In the beloved city likewise he gave me rest[b][a], and in Jerusalem was my authority.
translation:
  language: zh_hans
  text: 在蒙爱的城中，他同样使我安歇[a]；我的权柄在耶路撒冷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”在希腊文中是动词所含的主语，并未在本节明确说出是谁；上下文指向上帝。
    reason: 说明隐含主语，避免正文把所指明确化。
  - marker: b
    text: 希腊文直译为“在耶路撒冷，我的权柄”，没有明写“是”或“曾是”。
    reason: 保留省略系词所产生的时态开放性。
lexical_decisions:
- source_word: πόλει ἠγαπημένῃ
  choice: 蒙爱的城
  rationale: ἠγαπημένῃ是完成时被动分词，在此作形容词，意为“被爱、蒙爱”。“蒙爱的城”既保留被动意味和庄重语气，也自然指向下句的耶路撒冷。
- source_word: ὁμοίως
  choice: 同样
  rationale: ὁμοίως承接上文，表示相同或相应的情形；“同样”是现代汉语中自然且准确的连接语。
- source_word: κατέπαυσεν
  choice: 使我安歇
  rationale: καταπαύω可指使人停止、安息或安顿。结合智慧被安置于一座城中的语境，“使我安歇”兼顾安息与安顿之意，又不过度具体化为“定居”。
- source_word: ἐξουσία
  choice: 权柄
  rationale: ἐξουσία可指权力、权利、权限或管辖权。“权柄”适合拟人化智慧的庄重语境，并保留该词是抽象名词这一特点。
theological_decisions:
- issue: κατέπαυσεν的隐含主语
  choice: 正文用“他”，但不明确写成“上帝”或“主”
  alternative: 译作“上帝使我安歇”或“主使我安歇”
  rationale: 希腊文动词为第三人称单数，主语未在本节明说；上下文大概指上帝，但正文不补出具体称谓，以免消除原文保留的含蓄。
- issue: 第二分句省略系词及其时态
  choice: 译作“我的权柄在耶路撒冷”，不明定过去或现在时
  alternative: 译作“我的权柄曾在耶路撒冷”或“我在耶路撒冷有权柄”
  rationale: 希腊文第二分句没有明写系词，因此单凭本节不能确定应补作“是”还是“曾是”。中文无须补出时态，可保留这种开放性。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“蒙爱的城”“安歇”“权柄”保留原文的抒情和拟人色彩；分号呈现两个紧密平行的地点分句。
