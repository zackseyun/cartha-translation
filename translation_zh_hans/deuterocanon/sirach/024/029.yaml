  yaml_path: translation/deuterocanon/sirach/024/029.yaml
  text: For her understanding is more abundant than the sea[d][c][b][a], and her counsel than the great deep.
translation:
  language: zh_hans
  text: 因为她的见识[a]比海更丰富[c][d]，她的谋略也比大深渊[b]更丰富。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见识”也可译作“思想”或“意念”；希腊词既可指思考能力，也可指思考所得。
    reason: lexical_alternative
  - marker: b
    text: “大深渊”指宏大、幽深的水域，也可译作“巨大的深渊”。
    reason: lexical_alternative
  - marker: c
    text: 较直译可作：“因为她的见识从海而增多，她的谋略从大深渊而增多。”正文把介词理解为闪语式比较用法。
    reason: source_form_alternative
  - marker: d
    text: 或译：“因为她的见识比海更浩瀚，她的谋略比大深渊更深广。”这种译法较形象，但第二分句的“更深广”是按意象补出的。
    reason: translation_alternative
lexical_decisions:
- source_word: διανόημα
  choice: 悟性
  rationale: 该词可指思考的能力或思考所得；“悟性”符合智慧人格化的语境，同时不把它窄化为单一的“想法”。
- source_word: ἐπληθύνθη
  choice: 更丰盛
  rationale: 此处与ἀπό构成受闪语影响的比较表达，重点是智慧的悟性和谋略在丰盛程度上超过海与大深渊，而不是说它们源自海洋。
- source_word: βουλή
  choice: 谋略
  rationale: 既可表达筹划、计策，也保留智慧语境中的审慎谋划意味；较“劝告”或“旨意”更贴合此处。
- source_word: ἀβύσσου μεγάλης
  choice: 大深渊
  rationale: 保留原文宏大的深水或宇宙深渊意象，并与前句的“海”形成平行。
- source_word: ἀπὸ γὰρ θαλάσσης
  choice: 比海
  rationale: 将ἀπό按此处很可能反映的闪语比较句式译为“比”，避免误导读者以为悟性来自海。
- source_word: αὐτῆς
  choice: 她的
  rationale: 上下文把智慧人格化为女性形象；“她的”保留原文的语法和文学特征。
theological_decisions:
- issue: 智慧的人格化
  choice: 以“她的”指称智慧
  alternative: 把智慧作为抽象概念，译为“它的”或省去代词
  rationale: 希腊文使用阴性形式，且上下文中的智慧以女性说话者出现；保留女性人格化，不进一步断定其系统神学身份。
- issue: 悟性与海、大深渊之间的关系
  choice: 译作程度上的比较，即“比……更丰盛”
  alternative: 按表面介词结构译作“从海而增多……从大深渊而来”
  rationale: 这里的ἀπό很可能承载闪语式比较功能；正文采用较合语境的比较义，同时在脚注保留较直译的可能，以免掩盖原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“更丰盛”刻意贯穿两个平行分句，以保留希腊文第二句省略谓语、承接前句的结构；“她的”维持智慧的女性人格化。
