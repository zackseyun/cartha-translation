base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/015.yaml
  text: Like cinnamon and aspalathus[a], I gave forth a scent of spices, and like choice myrrh I spread fragrance, like galbanum and onycha and stacte[e][d][c][b], and like the smoke of frankincense in the tabernacle.
translation:
  language: zh_hans
  text: 我散发香气，如肉桂和香荆等香料；我播散芬芳，如上等的没药，又如古蓬香、香螺和滴取香脂[b]，也如帐幕[c]中乳香的烟气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “古蓬香、香螺和滴取香脂”都是古代制香用的芳香材料。“滴取香脂”对应希腊文στακτή（stacte），字面关联滴出的香脂；这些原料中有些的确切辨识仍有争议。
    reason: cultural_note
  - marker: c
    text: 或译“会幕”。希腊文直译为“帐幕”；在这里的制香和敬拜语境中，很可能指圣所的帐幕。
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: 肉桂
  rationale: 该词通常指肉桂；译名现代、明确，也保留香料意象。
- source_word: ἀσπάλαθος
  choice: 香荆
  rationale: 所指芳香植物的确切种类不明；采用较简洁的植物名，并以脚注说明不确定性，避免过度精确。
- source_word: ἀρωμάτων
  choice: 香气
  rationale: 此属格与ὀσμήν结合，表达芳香香料的气味；中文合并为“散发香气”较自然，且不损失语义。
- source_word: δέδωκα ὀσμήν
  choice: 我散发香气
  rationale: 完成时表达已经发出并持续可闻的香气；中文以自然的诗性表达呈现。
- source_word: σμύρνα ἐκλεκτή
  choice: 上等的没药
  rationale: ἐκλεκτή意为精选、优质；“上等的”符合现代汉语，并保留品质强调。
- source_word: διέδωκα εὐωδίαν
  choice: 我播散芬芳
  rationale: διέδωκα有向外散布之意，εὐωδία指悦人的香气；“播散芬芳”兼顾动作与诗歌语域。
- source_word: χαλβάνη
  choice: 古蓬香
  rationale: 这是芳香树脂galbanum的常见中文名称，保留具体香料身份。
- source_word: ὄνυξ
  choice: 香螺
  rationale: 在制香语境中指onycha一类芳香材料，并非宝石“缟玛瑙”；“香螺”可避免误解。
- source_word: στακτή
  choice: 苏合香
  rationale: 该词指特定滴取的芳香物质；采用传统香料译名，同时在脚注提示古代原料辨识并非完全确定。
- source_word: λίβανου ἀτμίς
  choice: 乳香的烟气
  rationale: ἀτμίς可指蒸气、烟气；焚烧乳香的语境中“烟气”自然，并保留可见上升的祭仪意象。
- source_word: ἐν σκηνῇ
  choice: 帐幕中
  rationale: σκηνή字面为帐幕，而本节的香料语境又可能特指圣所帐幕；正文保留字面张力，脚注交代祭仪所指。
theological_decisions:
- issue: σκηνή是否应明确译作圣所中的会幕
  choice: 帐幕中
  alternative: 会幕中
  rationale: 希腊词本义是“帐幕”，而香料清单明显唤起敬拜礼仪和圣所背景。正文不强行消除这种张力，以“帐幕”保留词义范围，脚注说明也可理解为“会幕”。
translation_notes:
  register: 采用现代、庄重而略带诗性的普通话。用“散发—播散”的平行动词再现希腊文两组香气描写；具体香料尽量保留名称，对植物辨识和“帐幕／会幕”的歧义以简短脚注说明。
