  yaml_path: translation/deuterocanon/sirach/024/013.yaml
  text: Like a cedar I was raised high in Lebanon[a], and like a cypress in the mountains of Hermon.
translation:
  language: zh_hans
  text: 我在黎巴嫩如香柏树，被高高举起；又如黑门群山中的柏树[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文Ἀερμών所指的地名，通常译作“黑门”。
    reason: 说明希腊文本中的地名拼写与通行中文译名之间的对应关系。
lexical_decisions:
- source_word: ὡς
  choice: 像……一样
  rationale: 引出明喻；现代汉语用“像……一样”自然地保留比较意味。
- source_word: κέδρος
  choice: 香柏树
  rationale: “香柏树”是圣经汉语中对该树名的通行译法，也符合黎巴嫩树木高大庄严的意象。
- source_word: ἀνυψώθην
  choice: 高高挺立
  rationale: 该词是ἀνυψόω的不定过去时被动式，表示被举高或升高；汉语“高高挺立”着重树木高耸的画面，行文自然，并避免把它过度解释为身份上的“被高举”。
- source_word: ἐν τῷ Λιβάνῳ
  choice: 黎巴嫩的
  rationale: 结合树木意象，以所属结构自然表达其所在地；含义相当于“在黎巴嫩”。
- source_word: κυπάρισσος
  choice: 柏树
  rationale: κυπάρισσος通常指柏类树木；“柏树”是自然、易懂的现代汉语名称，较“枞树”或“松树”更贴近希腊词义。
- source_word: ἐν ὄρεσιν Ἀερμών
  choice: 黑门群山上的
  rationale: ὄρεσιν为复数，译作“群山”；Ἀερμών对应通行地名“黑门”。“……上的”符合汉语描述山地树木的习惯。
theological_decisions:
- issue: 是否用带有明确尊荣或神学意味的词语翻译ἀνυψώθην
  choice: 高高挺立
  alternative: 被高举
  rationale: 本节是人格化的智慧借树木作诗性自述；选择突出高度和长势的表达，既保存意象，也不把动词额外解释为地位或尊荣上的高升。
translation_notes:
  register: 采用现代、庄重而易懂的诗性表达。“高高挺立”使香柏树与柏树的平行意象连贯；保留第一人称自述和两重明喻。脚注标记放在第一分句末，说明后文地名“黑门”的文本形式。
