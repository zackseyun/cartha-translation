  text: The first did not finish knowing her[c][b][a], and likewise the last did not trace her out.
translation:
  language: zh_hans
  text: 最先的人没有完全认识她[a]；同样，最后的人也没有把她探究到底。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有完全认识她”也可译作“没有穷尽对她的认识”。
    reason: 原文把“完成”与“认识”连用，既可较形式地译出“没有完全认识”，也可按语义理解为没有穷尽对智慧的认识。
lexical_decisions:
- source_word: οὐ συνετέλεσεν
  choice: 没有完全
  rationale: 保留 συντελέω 所表达的“达到完成、做到完全”之意，同时避免把经文改写成单纯的“不能认识”。
- source_word: ὁ πρῶτος
  choice: 最先的人
  rationale: 该短语作名词使用，并与 ὁ ἔσχατος 对举；“最先的人”保留其开放的时间或世代含义，不限定为某个特定人物。
- source_word: γνῶναι
  choice: 认识
  rationale: γινώσκω 在此指对拟人化智慧的认识；“认识”比“发现”更贴合上下文，也保留认知层面的含义。
- source_word: αὐτήν
  choice: 她
  rationale: 上文的智慧以女性形象说话，希腊语代词也是阴性；用“她”保留原文的拟人表达。
- source_word: καὶ οὕτως
  choice: 同样
  rationale: οὕτως 在此连接两个平行陈述，表示后者的情形与前者相同，而非前者导致后者。
- source_word: ὁ ἔσχατος
  choice: 最后的人
  rationale: 与“最先的人”形成直接对举，同时不把它特定解释为末世人物。
- source_word: οὐκ ἐξιχνίασεν
  choice: 没有把她探究到底
  rationale: ἐξιχνιάζω 带有循迹查究、探察透彻的意味；“探究到底”既自然，也呈现未能穷尽智慧的意象。
theological_decisions:
- issue: 拟人化智慧的指称与性别
  choice: 以女性人称“她”指智慧
  alternative: 以无生命的“它”指抽象智慧
  rationale: 《便西拉智训》24章把智慧塑造成女性说话者；保留“她”忠实反映本段文学与神学表达，而不进一步附加后来的教义认同。
- issue: “最先的人”与“最后的人”的具体身份
  choice: 保留开放的世代性对举
  alternative: 明确解释为第一个人亚当与末世最后一人
  rationale: 原文只使用“最先的”与“最后的”两个名词化形容词，并未明说具体身份；译文不应替原文消除这一含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“最先的人／最后的人”保持整齐对举；“探究到底”兼顾希腊语的循迹探察意象与中文自然度。
