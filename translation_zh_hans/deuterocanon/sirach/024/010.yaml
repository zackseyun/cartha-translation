  text: In the holy tent I ministered before him[b][a], and so I was established in Zion.
translation:
  language: zh_hans
  text: 我在圣帐中、在他面前事奉；这样，我在锡安得以坚立。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκηνῇ ἁγίᾳ
  choice: 圣帐
  rationale: σκηνή本指帐幕；“圣帐”保留具体的敬拜场所意象，也比传统术语“会幕”更直接对应原文，而ἁγίᾳ译作“圣”。
- source_word: ἐνώπιον αὐτοῦ
  choice: 在他面前
  rationale: 直译原文的空间与关系含义，不进一步断定代词所指。
- source_word: ἐλειτούργησα
  choice: 供职
  rationale: 该动词在敬拜语境中表示履行神圣职事；“供职”保留礼仪性服务的意味，但不把智慧明确说成祭司。
- source_word: οὕτως
  choice: 就这样
  rationale: 保留前句与后句之间可能兼具方式和结果意味的联系。
- source_word: ἐστηρίχθην
  choice: 立稳了
  rationale: 被动式表达被确立、得以稳固；“立稳了”自然地保留‘使之坚定’的意象。
- source_word: Σειὼν
  choice: 锡安
  rationale: 采用现代中文圣经与一般中文中通行的地名译法。
theological_decisions:
- issue: 智慧在圣所中的敬拜职事
  choice: 译为“供职”
  alternative: 事奉；履行祭司职务
  rationale: 原文动词具有神圣礼仪服务的色彩，却没有明说智慧担任祭司职分；“供职”既保留敬拜语境，也避免加上原文未明说的身份。
- issue: οὕτως与后句的逻辑关系
  choice: 译为“就这样”
  alternative: 因此；于是
  rationale: οὕτως可以表示“这样、如此”，在此也可能暗示结果。译作“就这样”可保留这种张力，不把关系单一化为纯粹因果。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“圣帐”保留具体意象；分号呈现两个分句的推进关系，同时避免把οὕτως过度解释成明确因果。
