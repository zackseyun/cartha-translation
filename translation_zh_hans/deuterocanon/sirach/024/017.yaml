  text: I[a], like a vine, put forth grace[c][b], and my blossoms are the fruit of glory and wealth.
translation:
  language: zh_hans
  text: 我如葡萄树般生发恩惠[a]；我的花朵是荣耀与财富的果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩惠”也可译作“秀美”、“美好”或“魅力”。这里的希腊词在这首诗歌中既可表达悦人之美，也可表达恩惠或益处。
    reason: lexical_alternative
  - marker: b
    text: “荣耀与财富的果实”也可理解为“带着荣耀与财富的果实”，或“荣耀而富足的果实”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ
  choice: 我
  rationale: 保留原文显明的第一人称代词，突出人格化智慧的自我陈述。
- source_word: ὡς ἄμπελος
  choice: 像葡萄树一样
  rationale: 自然地保留明喻及葡萄树意象。
- source_word: βλαστήσασα
  choice: 萌发
  rationale: 该词表示植物发芽、生长；“萌发”既维持植物意象，也能在诗句中与抽象宾语“恩惠”搭配。
- source_word: χάριν
  choice: 恩惠
  rationale: χάρις可指恩惠、悦人之美或可爱之处；正文采用“恩惠”以保留施益意味，并以脚注说明审美层面的可能含义。
- source_word: τὰ ἄνθη μου
  choice: 我的花朵
  rationale: 直接表达ἄνθη，并维持葡萄树从萌发、开花到结果的意象链。
- source_word: καρπὸς
  choice: 果实
  rationale: 以集合意义自然表达希腊文单数谓语，同时保留原文将“花朵”称为“果实”的诗性张力。
- source_word: δόξης
  choice: 荣耀
  rationale: 保留δόξα所含的荣耀、尊荣和光彩等宽广意义及庄重语体。
- source_word: πλούτου
  choice: 财富
  rationale: 直接对应πλοῦτος的财富、丰富之义，不把它限定为较抽象的“丰盛”。
theological_decisions:
- issue: 人格化智慧所萌发之χάρις的含义
  choice: 恩惠
  alternative: 秀美、美好、可爱之处
  rationale: 上下文的植物诗歌意象容许审美与施益两方面同时存在。“恩惠”保留后者及其潜在神学回响，脚注则明确前者，避免把多义性压平。
- issue: “花朵”与“果实”的关系
  choice: 按原文保留“我的花朵是……的果实”
  alternative: 我的花朵结出荣耀与财富的果实
  rationale: 希腊文以“果实”直接作“我的花朵”的谓语，并无“结出”一词。正文保留这一浓缩而略带张力的诗性表达，脚注提供较合汉语习惯的理解。
translation_notes:
  register: 采用现代、庄重而可朗读的汉语；保留人格化智慧的第一人称语气、葡萄树意象，以及原文“花朵是果实”的凝练诗性结构。
