  language: zh_hans
  text: 我住在高天；我的宝座在云柱[a]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “云柱”很可能呼应以色列人在旷野时象征上帝临在和引导的云柱；希腊文此处没有定冠词，形式上可译作“在一根云柱中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσκήνωσα
  choice: 安居
  rationale: 该动词表示搭帐并住下、定居。“安居”自然地表达持续居住之意，也保留了设立居所的意味；若直译为“安营”则容易过度突出临时驻扎。
- source_word: ἐν ὑψηλοῖς
  choice: 在高天
  rationale: ὑψηλοῖς是复数、中性形容词名词化，指高处或天上的高境。“高天”简洁庄重，并在现代汉语中自然传达其天上空间意味。
- source_word: θρόνος
  choice: 宝座
  rationale: 该词明确带有君王权柄与尊荣的意象；“宝座”是现代中文圣经语体中自然且准确的对应。
- source_word: ἐν στύλῳ νεφέλης
  choice: 在云柱中
  rationale: 直译为“在云的一根柱子中”。“云柱”是自然、凝练的中文表达，也保留了可能指向旷野中神显现与引导的经文呼应；中文没有冠词，因此不强行加入“一根”或“那”。
theological_decisions:
- issue: “云柱”是否特指以色列旷野传统中的云柱
  choice: 正文仅译作“云柱”，不明说其所指
  alternative: 译作“那云柱”，明确视为特指旷野中的云柱
  rationale: 希腊文没有冠词，但这一措辞很可能呼应旷野神显传统。正文保留意象及其互文张力，不将暗示扩展成明确认定。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“高天”保留复数高处所表达的天上境域，“安居”兼顾自然表达与κατασκηνόω所含的设立居所意味。脚注标记置于其实际说明的“云柱”之后。
