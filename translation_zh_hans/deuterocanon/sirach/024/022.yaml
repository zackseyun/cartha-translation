  text: Whoever obeys me will not be put to shame, and those who work with me will not sin.
translation:
  language: zh_hans
  text: 听从我的人，必不蒙羞；在我里面劳作的人，必不犯罪。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “犯罪”也可译作“犯错”或“偏离正道”；“在我里面劳作”保留原文的关系表达，也可理解为在智慧的范围内或借着智慧行事。
    reason: 说明ἁμαρτάνω的较宽语义范围，并提示ἐν ἐμοί的开放性，同时不以“与我一同”取代原文的ἐν。
lexical_decisions:
- source_word: ὁ ὑπακούων μου
  choice: 听从我的
  rationale: ὑπακούω在此表示听从、顺从；用“听从”兼顾听与服从的语义，且符合智慧以第一人称说话的语境。
- source_word: οὐκ αἰσχυνθήσεται
  choice: 必不蒙羞
  rationale: 保留将来时所表达的确定结果；“蒙羞”自然、庄重，也比单纯表达主观羞愧更能涵盖被置于羞辱境地的含义。
- source_word: οἱ ἐργαζόμενοι ἐν ἐμοὶ
  choice: 在我里面劳作的
  rationale: ἐν ἐμοί字面是“在我里面”，可指以智慧为领域、根基或能力而行事。原文并非通常表达“与我一同”的μετ’ ἐμοῦ，因此正文保留其真实的空间—关系隐喻。
- source_word: οὐχ ἁμαρτήσουσιν
  choice: 必不犯罪
  rationale: ἁμαρτάνω可指犯罪、犯错或偏离目标；本句的智慧与伦理语境支持“犯罪”，同时以脚注提示较宽语义。
theological_decisions:
- issue: “在我里面劳作”与“和我一同劳作”
  choice: 在我里面劳作
  alternative: 和我一同劳作
  rationale: 希腊文使用ἐν加与格，而非明确表示共同参与的介词μετά或σύν。为免把人与智慧并肩工作的特定关系读入经文，保留“在我里面”的开放隐喻。
- issue: “不犯罪”的绝对表达
  choice: 必不犯罪
  alternative: 必不犯错
  rationale: 不将绝对句改写成较弱的习惯性陈述，也不在正文中限定为某一类罪；保留智慧文学中的强烈应许及其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。两个分句保持平行结构，并用“必不”传达希腊文将来时在智慧格言中的确定语气。
