    reason: textual_variant
lexical_decisions:
- source_word: ἐκλίπητε
  choice: 失去
  rationale: 该动词可表示衰退、停止、耗尽或昏厥。与“力量”连用时，“失去力量”在现代汉语中自然，同时保留劝诫人不可力衰或放弃的含义。
- source_word: ἰσχύϊ
  choice: 力量
  rationale: ἰσχύς表示力量、能力或强健；“力量”直接、通顺，并能与前后关于刚强的语义呼应。
- source_word: κολλᾶσθε
  choice: 紧紧依附
  rationale: 该形式表达使自己贴近、依附于某者。“紧紧依附”既保留主动持守与亲密联结的力度，也适合庄重的劝诫语体。
- source_word: αὐτῷ
  choice: 他
  rationale: 该与格代词在形式上可能是阳性“他”或中性“它”。本句作为对人发出的宗教劝诫，以“他”指向上主较为自然；但不在正文中进一步补明所指，以免超出希腊文本。
- source_word: κραταιωθῆτε
  choice: 得以刚强
  rationale: 该被动虚拟式表示依附之后所产生的结果。“得以刚强”在汉语中保留结果和被增强的意味，又避免生硬的直译。
theological_decisions:
- issue: 增补劝诫句中αὐτῷ的所指
  choice: 译作“他”
  alternative: 译作“它”
  rationale: 代词在语法上容许阳性或中性理解；此处劝人紧紧依附，按语境理解为依附上主更为自然。正文只用“他”，不直接增译“上主”，以保留原文所指未明说的程度。
- issue: 德训篇24:24作为文本增补句的地位
  choice: 保留在本章正文，并用脚注说明文本差异
  alternative: 从正文省略
  rationale: 本项目所据章节编排保留这句为第24节；将其置于正文并注明其文本传统状况，既维持篇章次序，也让读者知悉抄本传统的差异。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“不要失去力量”避免过度释义；“紧紧依附”传达κολλᾶσθε贴近并持守的力度；“得以刚强”保留κραταιωθῆτε的被动结果意味。所有脚注标记均已置于正文相应位置。
