translation:
  language: zh_hans
  text: 不要在力量上衰竭[a]；要紧紧依附于他[b]，使你们得以刚强。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要因力量衰竭而困乏。”原文动词可表示衰竭、停止、耗尽或昏厥。
    reason: lexical_alternative
  - marker: b
