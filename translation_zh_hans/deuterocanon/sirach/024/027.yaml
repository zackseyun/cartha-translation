  text: It makes instruction shine forth like light[b][a], like the Gihon in the days of the grape harvest.
translation:
  language: zh_hans
  text: 它使教诲像光一样照耀，如收葡萄时节的基训河。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按希腊文的形式，直译可作：“那使教诲像光一样照耀的，如收葡萄时节的基训河。”这里的“它”承接上文所说的律法。
    reason: 保留带冠词分词的形式，并说明其在上下文中的所指。
lexical_decisions:
- source_word: ὁ ἐκφαίνων
  choice: 它使……照耀
  rationale: 分词承接上文所说的律法；用“它”保持这一指向，并以使动表达 ἐκφαίνων“使显出、使照耀”的含义。
- source_word: ὡς φῶς
  choice: 如光
  rationale: 保留 ὡς 所引出的明喻，不把“光”改释为其他水域意象。
- source_word: παιδείαν
  choice: 教诲
  rationale: 此词在《便西拉智训》的智慧传统中指塑造人的教导和训练；“教诲”既庄重易懂，也不会让人误以为专指惩罚。
- source_word: ὡς Γηὼν
  choice: 如……基训河
  rationale: Γηὼν 是河名，采用现代中文圣经读者较熟悉的译名“基训”，并补出“河”以明确所指。
- source_word: ἐν ἡμέραις τρυγητοῦ
  choice: 收葡萄时节
  rationale: τρυγητός 特指采收葡萄；此译法自然简洁，并保留农业意象。
theological_decisions:
- issue: 带冠词分词 ὁ ἐκφαίνων 的所指
  choice: 以“它”承接上文的律法
  alternative: 译作“那使教诲如光照耀的”或以人格化主语“他”来表达
  rationale: 第23节以后的一连串分词在语篇上描述摩西所吩咐的律法；译作“它”可避免读者无根据地把主语直接认作上帝。不过，希腊文形式本身是阳性带冠词分词，因此用脚注保留较形式化的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“如光照耀”保留原文光的明喻；后半句维持希腊文简练的并列比较，不擅自补足其省略的谓语。
