base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/031.yaml
  text: I said[a], ‘I will water my garden, and I will drench my garden bed.’ And behold, my channel became a river[c][b], and my river became a sea.
translation:
  language: zh_hans
  text: 我说：“我要浇灌我的园子，浇透我的畦地[a]。”看哪，我的水渠竟成了河流，我的河流竟成了海[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “畦地”指园中划分出来、经过耕作的一块种植地，也可译作“园畦”。
    reason: lexical_alternative
  - marker: b
    text: 原文的图景从灌溉用的水渠扩大为河流，再扩大为海，层层加强。
    reason: literary_note
lexical_decisions:
- source_word: Ποτιῶ
  choice: 我要浇灌
  rationale: 这是表示将来的动词；在园圃语境中译作“浇灌”自然清楚，并保留农业意象。
- source_word: κῆπον
  choice: 我的园子
  rationale: κῆπος通常指园子或园圃；“园子”是现代汉语中自然、宽泛的对应词，不把它限定为果园。
- source_word: μεθύσω
  choice: 浇透
  rationale: 该词本有使之酣醉、充分饱足之意，在灌溉语境中表示让土壤充分吸水；“浇透”既传达强烈程度，也避免引入饮酒的误解。
- source_word: πρασιάν
  choice: 我的畦地
  rationale: πρασιά指园中经过耕作、划分出来的苗床或畦地；“畦地”保留农业含义，又不把它缩窄为只种花的花圃。
- source_word: ἰδοὺ
  choice: 看哪
  rationale: 保留原文引人注意、凸显突然变化的修辞作用，也符合庄重而可懂的经文语体。
- source_word: διῶρυξ
  choice: 水渠
  rationale: 该词指挖掘而成、用于引水的水道；“水渠”比“沟”更准确，也比“运河”更符合园圃灌溉场景。
- source_word: ποταμόν
  choice: 河流
  rationale: ποταμός的常见义为河流；与水渠和海洋相接，清楚呈现规模逐级扩大的图景。
- source_word: θάλασσαν
  choice: 海洋
  rationale: θάλασσα在此泛指海；“海洋”自然表达辽阔水域，并不强指定某一片海。
theological_decisions:
- issue: 园圃灌溉之水逐步扩张的比喻是否应在正文中加以解释
  choice: 只保留水渠、河流、海洋逐级扩大的具体意象，不在正文中解明其寓意。
  alternative: 明确解释为智慧、教导或经书传播并充满天下。
  rationale: 本节呈现了强烈的扩张意象，却没有在本句内明确说明各形象的对应对象；直译其图景能保存原文的开放性，避免加入特定教义解释。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“浇灌……浇透”再现两个动词在强度上的递进；“竟”体现“看哪”所引出的意外和惊叹，但不额外解释比喻。
