  text: It fills with wisdom like the Pishon[d][c][b][a], and like the Tigris in the days of firstfruits.
translation:
  language: zh_hans
  text: 它使智慧充盈，有如比逊河；又有如新作物时节[a]的底格里斯河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“在新的事物的日子”，语义较难确定；也可能指新收成或新生长的时节。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιπλῶν
  choice: 它使……充盈
  rationale: 分词为阳性单数，承接上文的“律法”；译作“它”以维持上下文衔接。“使……充盈”保留主动、使动意味，也契合河水丰沛的比喻，同时避免把原文明确化为“泛滥”。
- source_word: ὡς Φισὼν
  choice: 如比逊河
  rationale: 采用《创世记》河名的通行汉语音译，并补出“河”，使现代汉语表达自然清楚。
- source_word: σοφίαν
  choice: 智慧
  rationale: σοφία的标准译法；本章虽将智慧人格化，汉语无须借助大写来额外规定其神学身份。
- source_word: ὡς Τίγρις
  choice: 如……底格里斯河
  rationale: 采用该河名的现代通行汉语译名，并保留与比逊河平行的河流意象。
- source_word: ἐν ἡμέραις νέων
  choice: 在初熟时节
  rationale: νέων字面为“新的事物”，此处在农业与河水丰沛的语境中可指新出产或初熟作物；正文采用简洁自然的“初熟时节”，脚注保留原语的不确定性。
theological_decisions:
- issue: 人格化智慧的呈现
  choice: 译作普通名词“智慧”，不额外加称谓或身份说明
  alternative: 译作带有专名意味的“智慧者”或明确指向某一神学身份
  rationale: 希腊文σοφίαν在此可延续本章的人格化描写，但本节本身没有进一步界定其身份；译文保留这种张力，不作宗派性解释。
- issue: 分词ὁ πιπλῶν的主语
  choice: 用“它”承接上文的律法
  alternative: 译作“那使智慧充盈的”或补成“他”
  rationale: 阳性分词在希腊文中自然承接上文阳性名词νόμος；现代汉语以“它”指律法最为自然，又不将语法阳性误读为人格或性别判断。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。两个河流比喻保持平行；分号帮助读者辨明结构。措辞不把河流景象强化为“泛滥”，也不把含混的农业时令限定为礼仪性的“初熟之物”。
