  yaml_path: translation/deuterocanon/sirach/024/006.yaml
  text: In the waves of the sea and in all the earth[a], and among every people and nation[b], I gained possession.
translation:
  language: zh_hans
  text: 在海浪中，在全地上，在各民各族中，我都取得了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文也可译作“我获得了”或“我占有了”；原文没有明说所取得的是什么。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν κύμασιν θαλάσσης
  choice: 在海浪中
  rationale: 按处所义直译，保留海浪的具体意象；“海浪”是自然、通行的现代汉语。
- source_word: ἐν πάσῃ τῇ γῇ
  choice: 在全地上
  rationale: γῆ可指“土地”或“大地”；本句范围由海洋扩展至全地和万民，因此采用具有普世范围的“全地”。
- source_word: ἐν παντὶ λαῷ καὶ ἔθνει
  choice: 在各民各族中
  rationale: λαός与ἔθνος并列，表示不同的人类群体；“各民各族”既简洁自然，也保留两个名词的并列。
- source_word: ἐκτησάμην
  choice: 我都获得了产业
  rationale: κτάομαι表示取得、获得或占有。原文未明说宾语；汉语若只说“我获得了”显得残缺，因此用含义较宽的“产业”补足句法，并以脚注说明原文的开放性。“都”呼应前面连续列举的各个范围。
theological_decisions:
- issue: ἐκτησάμην的隐含宾语
  choice: 译作“我都获得了产业”，并用脚注说明原文未明说所得之物
  alternative: 我都取得了占有；我都据为己有；我都获得了领地
  rationale: 希腊文只出现动词，没有明示宾语。正文需符合现代汉语句法，但不宜把所得之物限定为某一特定民族、土地或统治权；“产业”相对宽泛，脚注则保留原文可能表示“取得、占有”的歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。三个“在……”短语保持原文递进铺陈；“各民各族”避免生硬的“每一个人民和民族”。
