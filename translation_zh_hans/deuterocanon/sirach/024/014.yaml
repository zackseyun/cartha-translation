  yaml_path: translation/deuterocanon/sirach/024/014.yaml
  text: Like a palm tree I was raised high on the shores[a], and like rose plants in Jericho; like a splendid olive tree in the plain[b], and I was raised high like a plane tree.
translation:
  language: zh_hans
  text: 我像海边的棕榈树被高高举起[a]，又像耶利哥的玫瑰植株；像平原上秀美的橄榄树，又像悬铃木被高高举起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“在海岸一带”。有人因棕榈树更常让人联想到绿洲或河岸，推测这里原指另一地点；但现存希腊文本支持“海岸”。
    reason: 说明原文读法及其所保留的地理意象，避免未经文本支持便改作其他地点。
lexical_decisions:
- source_word: φοῖνιξ
  choice: 棕榈树
  rationale: 在这一植物比喻中指棕榈树；此译法清楚自然，又不把种类进一步限定为海枣树。
- source_word: ἀνυψώθην
  choice: 被高高举起
  rationale: 保留希腊语被动形式，同时兼顾树木向上高耸的形象与“受高举”的含义，不把两者简化为单纯“长高”。
- source_word: αἰγιαλοῖς
  choice: 海岸一带
  rationale: 该词指海岸、岸边；“在海岸一带”既贴近复数形式，也符合现代汉语表达。
- source_word: φυτὰ ῥόδου
  choice: 玫瑰花木
  rationale: φυτά指植物或栽种之物；“玫瑰花木”保留植物意象，避免将其过度限定为灌木丛。
- source_word: Ἰερειχώ
  choice: 耶利哥
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: ἐλαία εὐπρεπής
  choice: 秀美的橄榄树
  rationale: εὐπρεπής含美观、端庄、出众之意；“秀美”自然地表达其优美而有风采的形象。
- source_word: πεδίῳ
  choice: 平原
  rationale: πεδίον指平坦开阔之地；“平原”准确且简明。
- source_word: πλάτανος
  choice: 悬铃木
  rationale: πλάτανος指plane tree，即悬铃木；避免误译为圣经语境中另一种树木的“桑树”或笼统的“梧桐”。
theological_decisions:
- issue: ἀνυψώθην兼具树木高耸与受高举的意味
  choice: 两处均译为“被高高举起”
  alternative: “高高耸立”或“长得高大”
  rationale: 直译被动语态，使物理高度与人格化智慧受高举的潜在意味并存，不替读者消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。四个树木比喻保持平行；重复“被高高举起”，以对应原文两次出现的ἀνυψώθην。
