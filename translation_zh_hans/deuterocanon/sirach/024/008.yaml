  yaml_path: translation/deuterocanon/sirach/024/008.yaml
  text: Then the Creator of all commanded me[a], and the one who created me pitched my tent and said, “Dwell in Jacob[c][b], and receive your inheritance in Israel.”
translation:
  language: zh_hans
  text: 那时，万有的创造主命令我；创造我的那一位安置了我的帐幕[a]，说：“你要在雅各中居住，在以色列中承受产业[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“支搭了我的帐棚”或“立定了我的帐幕”。希腊语采用固定、支搭帐幕的具体说法。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“在以色列中被分得产业”或“在以色列中得份”。希腊语动词含有继承和分配产业的意象，并采用被动命令式。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: 那时
  rationale: 保留叙事推进和时间承接，符合现代汉语表达。
- source_word: ἐνετείλατό μοι
  choice: 命令我
  rationale: ἐντέλλομαι 表示发出命令或吩咐；“命令我”简洁地保留其权威语气。
- source_word: ὁ κτίστης ἁπάντων
  choice: 万有的创造主
  rationale: κτίστης 指创造者，ἁπάντων 表示一切、万有；此译既保留普遍范围，也采用庄重而通行的汉语称谓。
- source_word: ὁ κτίσας με
  choice: 创造我的那一位
  rationale: 保留分词结构与前句“创造主”的呼应，并明确智慧与创造她的那一位之间的关系。
- source_word: κατέπηξεν τὴν σκηνήν μου
  choice: 安置了我的帐幕
  rationale: καταπήγνυμι 有固定、支搭帐幕之意；“安置”在汉语中较自然，同时保留帐幕这一具体居住意象。
- source_word: Ἐν Ἰακὼβ κατασκήνωσον
  choice: 你要在雅各中安居
  rationale: κατασκηνόω 可指扎营、居住；“安居”既自然，又与前文帐幕意象保持联系。“雅各”按原文保留为群体性称呼。
- source_word: ἐν Ἰσραὴλ κατακληρονομήθητι
  choice: 在以色列中承受产业
  rationale: 该动词带有继承、分配产业的意象，且形式为被动命令式；“承受产业”保留了产业语言，同时避免在正文中过度限定究竟是继承还是被分配。
theological_decisions:
- issue: 人格化智慧与创造主的关系
  choice: 保留智慧以第一人称、人格化方式说话，同时明确她是由“万有的创造主”所创造并奉命住在雅各中。
  alternative: 将智慧抽象化为一种属性，或采用后来教义体系中的专门称谓来解释其身份。
  rationale: 希腊文本同时呈现鲜明的人格化表达和明确的创造者—受造者措辞；译文保留这两方面的张力，不借后来的神学范畴消解它。
- issue: 帐幕与居住意象
  choice: 正文采用“帐幕”和“安居”，保留连续的居住意象，但不特意强化为宗教礼仪术语。
  alternative: 译作“会幕”以突出崇拜场所，或完全抽象化为“设立住处”。
  rationale: σκηνή 本身可以指帐幕，但本节未必要求专指以色列的会幕；“帐幕”既具体，又不预先锁定其神学指涉。
- issue: κατακληρονομήθητι 的被动及产业含义
  choice: 译作“承受产业”，并以脚注说明也可理解为被分配产业或在以色列中得份。
  alternative: 直译为“在以色列中成为产业”或单纯译为“继承以色列”。
  rationale: 该形式和语义存在一定张力。正文采用可读且保留产业意象的表达，脚注呈现被动、分配层面的可能性，不武断解决歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“万有的创造主”保留经文语体；“帐幕”“承受产业”延续原文意象，但避免使用过度宗派化或礼仪化的术语。标点将首句两个紧密相关而主语不同的分句以分号区隔，使长句层次清楚。
