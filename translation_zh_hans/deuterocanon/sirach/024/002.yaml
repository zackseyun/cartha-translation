  text: In the assembly of the Most High she will open her mouth[c][b][a], and before his power she will boast.
translation:
  language: zh_hans
  text: 她[a]要在至高者的会众中开口，在他的大能[b]面前夸耀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她”指上下文中人格化的智慧。
    reason: cross_reference
  - marker: b
    text: “大能”或译“众军”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: 会众
  rationale: 这里指聚集的群体；“会众”既保留群体含义，也避免使用可能带有后期制度色彩的“教会”一词。
- source_word: Ὑψίστου
  choice: 至高者
  rationale: 这是犹太希腊文献中对上帝的尊称；“至高者”庄重、自然，也符合现代汉语圣经语体。
- source_word: στόμα αὐτῆς ἀνοίξει
  choice: 她要……开口
  rationale: 保留希腊文“张口说话”的生动表达及智慧被人格化的形象；汉语以“开口”自然传达其含义。
- source_word: ἔναντι
  choice: 在……面前
  rationale: 准确表达处于某者临在之前的空间与关系含义。
- source_word: δυνάμεως αὐτοῦ
  choice: 他的大能
  rationale: δύναμις的直接常见义是“能力、权能”；此处属格单数可自然译为“大能”。鉴于该词在七十士译本中也可能有“军旅、众军”之义，以脚注保留这一语境性可能。
- source_word: καυχήσεται
  choice: 要夸耀
  rationale: καυχάομαι表示夸耀、以某事为荣；“夸耀”保留原词可能具有正面或中性色彩的张力，不武断译成带明显贬义的“自吹自擂”。
theological_decisions:
- issue: 阴性主语所指
  choice: 正文只译作“她”，并以脚注说明上下文所指
  alternative: 在正文中直接补出“智慧”
  rationale: 上下文表明阴性主语是人格化的智慧，但本节希腊文本身只用阴性代词，因此正文不补入原文未重复的名词。
- issue: δυνάμεως所描绘的是抽象权能还是天上军旅
  choice: 正文译“大能”，脚注保留“众军”的可能
  alternative: 正文译“众军”或“天军”
  rationale: “大能”最直接反映δύναμις的常见单数义；然而本节“会众”与“在……面前”的场景可能使该词指至高者的军旅。原文并未明确写出“天”，故不在正文中消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“她要……开口”保留人格化描写；“夸耀”避免加入原文没有的强烈贬义。句式尽量贴近希腊文两个并列分句，同时保持自然汉语节奏。
