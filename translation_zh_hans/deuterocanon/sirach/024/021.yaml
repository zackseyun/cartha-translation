  text: Those who eat me will still hunger[a], and those who drink me will still thirst.
translation:
  language: zh_hans
  text: 吃我的人仍会饥饿，喝我的人仍会口渴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：他们会更渴望智慧。希腊文直译为“仍会饥饿”和“仍会口渴”；这可能表达人在领受智慧之后仍持续渴慕她。
    reason: 说明“饥饿／口渴”可含有持续渴慕智慧的解释性意味，同时保留正文未明说“更多”的字面悖论。
lexical_decisions:
- source_word: οἱ ἐσθίοντές με
  choice: 吃我的人
  rationale: 带冠词的现在分词作名词使用，指凡是吃“我”的人；保留人格化智慧以“我”自称的直接隐喻，也自然表达一般性、持续性的动作。
- source_word: ἔτι
  choice: 仍
  rationale: 表示领受之后饥渴依然持续；“仍”简洁自然，并保留原文的悖论意味。
- source_word: πεινάσουσιν
  choice: 会饥饿
  rationale: 忠实表达将来时主动动词，不在正文中增添原文未明说的“想要更多”。
- source_word: οἱ πίνοντές με
  choice: 喝我的人
  rationale: 与“吃我的人”保持平行，保留饮用人格化智慧的比喻。
- source_word: διψήσουσιν
  choice: 会口渴
  rationale: 直接表达将来仍将口渴；“仍”的语义按并列结构自然贯通后半句。
theological_decisions:
- issue: 领受智慧之后仍然饥渴这一悖论应如何表达
  choice: 正文直译为“仍会饥饿……仍会口渴”的含义，不消解悖论
  alternative: 译为“还会渴望得到更多”或明确补出“想要更多”
  rationale: 希腊文直接陈述吃喝之后仍有饥渴，可能暗示人会继续渴慕智慧，但并未明说“更多”。正文保留其张力，解释性含义放入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；句式简洁，保持两个分句的平行结构，并保留人格化智慧的吃喝意象。
