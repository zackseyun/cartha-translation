  text: See that I have not labored for myself alone[a], but for all who seek her.
translation:
  language: zh_hans
  text: 你们要明白：我辛劳，并不只是为了自己，而是为了所有寻求她的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδετε
  choice: 你们要明白
  rationale: 这是复数命令式，在此呼吁听众认识并留意下述事实；译作“你们要明白”既体现劝告语气，也符合现代汉语表达。
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: 并不只是为自己
  rationale: 与格表示受益对象，μόνῳ突出“不只为我一人”；此译自然地表达劳苦并非仅为说话者自身的益处。
- source_word: ἐκοπίασα
  choice: 我劳苦
  rationale: 该词指付出辛劳、勤苦工作。希腊语不定过去时在此陈述已经付出的劳动；汉语无需借助时态标记，也能兼顾既成行动及其当前成果。
- source_word: ἀλλὰ πᾶσι
  choice: 而是为所有……的人
  rationale: 保留与前句“并不只是”的强烈对比，并由后面的分词短语界定“所有”的范围。
- source_word: τοῖς ἐκζητοῦσιν
  choice: 寻求……的人
  rationale: ἐκζητέω可含认真探求之意，但“寻求”在智慧文学语境中准确、庄重，且避免过度强化。
- source_word: αὐτήν
  choice: 她
  rationale: 阴性代词回指本章人格化的智慧；译作“她”保留原文的阴性人格化表达。
theological_decisions:
- issue: 智慧语境中αὐτήν的所指及性别表达
  choice: 译作“她”，指人格化的智慧
  alternative: 译作“它”，将智慧视为抽象事物
  rationale: 《德训篇》第24章持续以女性形象使智慧人格化。保留“她”忠实呈现本章的文学与神学张力，并不额外断定这一形象的身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要明白”明确复数受众；“劳苦”保留κοπιάω所含的辛劳意味。汉语不强行标示希腊语不定过去时，以免人为限定为单纯过去或现在完成。
