  text: I came forth from the mouth of the Most High, and like a mist I covered the earth;
translation:
  language: zh_hans
  text: 我从至高者口中出来，又像雾一样笼罩大地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出来
  rationale: 这是ἐξέρχομαι的简单过去时；“出来”自然、直接，并保留智慧从至高者口中而出的起源意象，不将其解释成较窄的“受造”或“被说出”。
- source_word: ἀπὸ στόματος
  choice: 从……口中
  rationale: 贴近希腊语的空间与来源表达，同时在现代汉语中自然地保留言语、发出与起源的隐喻。
- source_word: Ὑψίστου
  choice: 至高者
  rationale: 这是圣经汉语中对神圣称号Ὕψιστος准确而庄重的常用译法。
- source_word: ὡς ὁμίχλη
  choice: 像雾一样
  rationale: ὁμίχλη可指雾或薄雾；“雾”简洁自然，符合诗歌意象，也不额外限定其浓淡。
- source_word: κατεκάλυψα
  choice: 笼罩
  rationale: 该复合动词表示覆盖在上；结合雾的意象，“笼罩”比一般的“覆盖”更符合现代汉语搭配，同时保持覆盖全地的画面。
- source_word: γῆν
  choice: 大地
  rationale: 在宇宙性的诗歌语境中，γῆ指广义的地；“大地”兼具范围感与庄重的诗体色彩。
theological_decisions:
- issue: 人格化智慧从神而出的表述
  choice: 直译为“我从至高者口中出来”
  alternative: “至高者说出了我”或“我由至高者的命令而出”
  rationale: 原文让人格化的智慧以第一人称陈述自己从至高者口中而出。译文保留这一来源与言语相连的神学—诗歌张力，不把它限定为受造、受命或单纯被说出。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从至高者口中出来”保留原文略带超越性的拟人表达；“像雾一样笼罩大地”则使用自然汉语搭配，维持诗意与宇宙范围。
