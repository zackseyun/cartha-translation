    issue: “侍立在权贵面前”对 לְהִתְיַצֵּב לִפְנֵי שָׂרִים 的表达偏窄。
    rationale: “侍立”常指侍从在尊长旁站立，带有服侍意味；原文着重在官长面前呈身、立身时所需的教导，并不必然指侍从职责。
  - severity: medium
    issue: 希腊文异读脚注的“免得他坐下，像埋伏一样伺机攻击你的口”不够准确自然。
    rationale: 希腊文的比喻是该人如伏兵般对“你的口”设伏；直述“坐下”并以“像埋伏一样”修饰，中文语义生硬且模糊。
  revised_text: 连他平常的谈话也不要轻看[a]，因为你会从他那里学到在官长面前立身的教益。
