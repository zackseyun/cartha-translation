  yaml_path: translation/deuterocanon/sirach/008/011.yaml
  text: Do not despise even his ordinary conversation[a], for from him you will learn instruction for standing before rulers.
translation:
  language: zh_hans
  text: 连他平常的谈话也不要轻看[a]，因为你会从他那里学到在官长面前立身的教益。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要从狂妄的人面前起身，免得他如同伏兵，伺机攻击你的口。”这里的希腊传统与现存希伯来文本有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂיחוֹת חוֹל
  choice: 平常的谈话
  rationale: שִׂיחוֹת指谈话、言谈；חוֹל在这里与高深或正式之言相对，表示日常、普通，而非亵渎或粗俗。
- source_word: תִבְזֶה
  choice: 不要轻看
  rationale: 该动词表示鄙视、轻蔑；“不要轻看”在现代汉语中自然，并保留不可因言谈普通而看不起它的劝诫意味。
- source_word: לְהִתְיַצֵּב לִפְנֵי שָׂרִים
  choice: 如何侍立在权贵面前
  rationale: 该短语直指站立或呈身于有权势者面前；“侍立”简洁表达在上位者面前应有的举止，“权贵”涵盖 שָׂרִים 所指的首领、官长或显要人物。
- source_word: לֶקַח
  choice: 学会
  rationale: לֶקַח表示所领受的教导或教益。汉语将其融入“学会如何……”的结构，可自然表达从对方言谈中获得实际教导。
- source_word: מִמֶּנּוּ
  choice: 从他那里
  rationale: 保留希伯来文阳性单数代词，不把所指对象泛化；尽管前面的 מֵהֶם 在现存复合希伯来文本中为复数，本句依上下文以单数人物表达。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本显著不同
  choice: 正文依据现存希伯来文本翻译，并在脚注保存希腊异读
  alternative: 希腊文：“不要从狂妄的人面前起身，免得他坐下，像埋伏一样伺机攻击你的口。”
  rationale: 《便西拉智训》有希伯来文本存世之处以希伯来文为主要依据；本节希腊传统内容差异很大，不宜调和或取代正文，但应完整提示读者这一重要异读。
translation_notes:
  register: 采用现代、庄重而通俗的劝诫语体。“平常的谈话”避免把 חוֹל 误解为不敬或污秽之言；“侍立在权贵面前”保留古代智慧文学的社会场景，同时普通读者容易理解。
