  to: 连他平常的谈话也不要轻看[a]，因为你会从他那里学到在官长面前立身的教益。
  rationale: 修订仅澄清两个表达：以“在官长面前立身的教益”对应“从他学习在首领面前站立／呈身的教导”，避免“侍立”的侍从含义；并将希腊文异读的伏兵比喻译为自然且较贴近原文的中文。正文继续依现存希伯来文，脚注继续提示显著不同的希腊传统。
