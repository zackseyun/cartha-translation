  text: Do not quarrel with a powerful man, lest you fall into his hands.
translation:
  language: zh_hans
  text: 不要与有权势的人争执，免得落在他手中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文更直译为：“为什么你会被置于他手上？”希腊文平行文本支持正文较顺畅的意思：“免得落在他手中。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרִיב
  choice: 不要……争执
  rationale: ריב可指争吵、争讼或对抗；“争执”是自然的现代汉语，既保留冲突意味，也不把语境限定为法律诉讼，并与希腊文διαμάχου相符。
- source_word: עִם אִישׁ גָּדוֹל
  choice: 与有权势的人
  rationale: גָּדוֹל字面为“大”，但此处所警戒的是对方具有社会或政治权力；希腊文δυνάστης也支持“有权势的人”，可避免“伟人”所带的褒义。
- source_word: לָמָּה תִשּׁוֹם עַל יָדוֹ
  choice: 免得落在他手中
  rationale: 现存希伯来文较生硬，字面近于“为什么你会被置于他手上”；希腊文明确呈现警告性的结果从句“免得落入他的手中”。正文采用自然且符合语境的表达，同时以脚注保存希伯来文本的形式。
theological_decisions: []
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“有权势的人”表达实际权力而非道德上的伟大；“落在他手中”保留受其控制或处置的形象。脚注标记置于整句之后，对应全句后半的文本问题。
