  text: Do not lend to a man stronger than you; and if you do lend[a], regard it as lost.
translation:
  language: zh_hans
  text: 不要借钱给比你更强的人；如果你已经借了，就当作损失了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证在这里是另一则警告：“不要与易怒的人争斗，也不要同他穿越旷野……因为在他眼中，流血算不得什么；在无人援助之处，他会把你击倒。”现存希伯来文则警告人不要借钱给比自己更强的人。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּלְוֶה
  choice: 不要借钱给
  rationale: אַל加未完成式构成智慧训诲中常见的禁止语；לוה的使役式在此指借出钱财。“不要借钱给”明确而自然，也与下句把所借之物视为损失相呼应。
- source_word: אִישׁ חָזָק מִמְּךָ
  choice: 比你强势的人
  rationale: חָזָק可指体力强，也可指权势或社会力量强；在追讨贷款的语境中，“强势”能保留力量对比，又避免把含义局限于体格。中文以“人”自然表达希伯来文单数אִישׁ，不额外限定性别。
- source_word: וְאִם הִלְוִיתָ
  choice: 如果你已经借了
  rationale: 完成式הִלְוִיתָ在条件句中自然表示禁令虽已被违反的实际情形；“已经借了”保留这种事后处置的意味。
- source_word: כִּמְאַבֵּד
  choice: 就当作已经损失了
  rationale: 原文表达简略，כְּ表示“如同、当作”，מְאַבֵּד与失去或使之丧失有关。中文补出由语境可知的贷款对象，并用“当作已经损失了”传达不要期待收回的劝诫，同时保留其省略性，不具体断定损失的是本金还是全部债权。
theological_decisions:
- issue: 希伯来文本与希腊文本呈现不同警语
  choice: 正文依现存希伯来文翻译借贷警语
  alternative: 依希腊文翻译为不要与暴怒的人争斗，也不要同他穿越旷野
  rationale: 本节有可靠的希伯来文见证，故以其为正文依据；希腊文保存的是内容显著不同的警语，不宜与希伯来文拼合，但应在脚注中完整提示这一重要异文。
- issue: אִישׁ的性别表达
  choice: 译为“人”
  alternative: 译为“男人”或“男子”
  rationale: 希伯来文אִישׁ为阳性单数，但此处箴言的适用重点是借款者相对于出借者更有力量，并无明确的生理性别对比。现代汉语“人”既准确又自然，未改变训诫对象或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“强势”兼顾חָזָק可能包含的力量与权势含义；分号体现禁止与补救性条件句之间的紧密转折。脚注标记[a]紧接触发异文说明的条件句。
