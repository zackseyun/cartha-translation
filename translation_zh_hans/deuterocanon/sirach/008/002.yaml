  text: Do not quarrel with one harder than you, lest you fall into his hand.
translation:
  language: zh_hans
  text: 不要与比你强硬的人争斗，免得落在他手中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּרִיב
  choice: 争斗
  rationale: 该动词可指争辩、争讼或争斗；此处后接“落在他手中”，用“争斗”既自然，又保留冲突范围的宽泛性。
- source_word: קָשֶׁה מִמְּךָ
  choice: 比你强硬的人
  rationale: קָשֶׁה 基本义为“硬、严厉、强硬”，并非希腊平行文本的“富有”；“强硬”比单纯译作“强壮”更贴近希伯来文本，也保留其可能兼指难以对付、势力强横之人的含义。
- source_word: תִפּוֹל בְּיָדוֹ
  choice: 落在他手中
  rationale: 保留希伯来语惯用意象，表示落入对方控制或权势之下；中文亦自然可解。
theological_decisions: []
