  text: Do not abandon the discourse of the wise[b][a], and occupy yourself with their riddles.
translation:
  language: zh_hans
  text: 不要离弃智者的言谈[a]，要专心揣摩他们的谜语[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本在这里的内容完全不同：“不要点燃罪人的炭，免得你被他的火焰烧着。”这反映了与现存希伯来文本有显著差异的文本传统。
    reason: textual_variant
  - marker: b
    text: “专心揣摩”所译的希伯来动词较为罕见，确切语感并不完全确定；也可理解为“用心钻研”或“投入其中”。这里强调主动面对并思考智者难解的话语。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּטֹּשׁ
  choice: 不要离弃
  rationale: 动词 נטש 表示离开、撇弃或放弃；“不要离弃”保留了原文劝诫的力度，也符合庄重而自然的现代汉语。
- source_word: שִׂיחַת
  choice: 言论
  rationale: שיחה 可指谈话、言说或论述；这里与智者及其隐语并列，所指更可能是智慧教导，而非随意闲谈。“言论”既简洁又不把含义限定得过窄。
- source_word: חֲכָמִים
  choice: 智者
  rationale: 原文为阳性复数，泛指有智慧的人；“智者”保留类别意义，不额外突出性别。
- source_word: וּבְחִידֹתֵיהֶם
  choice: 他们的隐语
  rationale: חידה 可指谜语、隐晦难解的格言或谜一般的话。“隐语”适合智慧文学语境，并保留这些话需要揣摩的特点。
- source_word: הִתְרַפֵּשׂ
  choice: 要潜心研习
  rationale: 此处动词罕见，具体语感不完全确定，但上下文要求积极投入、反复揣摩智者的难解话语。“潜心研习”以自然汉语传达这种专注参与，同时在脚注中说明不确定性。
theological_decisions:
- issue: 希伯来文本与希腊平行文本有实质差异
  choice: 正文依据现存希伯来文本，谈论智者的言论和隐语
  alternative: 希腊文本作：“不要点燃罪人的炭火，免得你被他火焰的烈火烧伤。”
  rationale: 用户所给希伯来文本来源可信度高，且任务要求优先依据原文证据；希腊文显然代表另一文本传统，因此不应混入正文，而应通过脚注完整保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智者”“言论”“隐语”保持智慧文学的文体；“潜心研习”比直译式表达更自然，同时借脚注保留罕见动词的词义不确定性。
