  text: Do not move aside before a scoffer[a], lest he seat him as one lying in wait before you.
translation:
  language: zh_hans
  text: 不要在讥诮者面前退让，免得他使某人像伏击者那样坐在你面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半句的希伯来语较难理解，字面是“免得他使某人像伏击者那样坐在你面前”；其中“他”和“某人”的所指及句法关系都不明确。希腊语平行文本的措辞不同，大意是警告不可与鲁莽的人同行，免得他随己意行事，因自己的愚妄使你一同灭亡。
    reason: 文本异文及句法歧义
lexical_decisions:
- source_word: אַל תָּזוּחַ
  choice: 不要……退让
  rationale: 动词在此表示挪开、退却或让出位置；“退让”既保留让步的空间意象，也符合现代汉语的劝诫语气。
- source_word: מִפְּנֵי
  choice: 在……面前
  rationale: 直译为“从……面前”，此处用“在……面前”自然表达面对某人时的处境。
- source_word: לֵץ
  choice: 讥诮者
  rationale: 该词在智慧文学中指轻蔑、好嘲讽的人；“讥诮者”比一般的“开玩笑的人”更能保留其道德贬义和庄重语域。
- source_word: לְהוֹשִׁיבוֹ
  choice: 使那人……坐
  rationale: 希伯来语使役式不定词带第三人称阳性单数后缀，字面为“使他坐下”。译作“使那人……坐”保留后缀所指不明的困难，不擅自将其改成反身意义。
- source_word: כְּאוֹרֵב
  choice: 如伏击者般
  rationale: אֹרֵב 指埋伏等候、准备袭击的人；“伏击者”简洁保留隐藏敌意的意象。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 按希伯来语字面翻译；敌对意味由“伏击者”的意象表达，而不直接改译成“攻击你”。
theological_decisions:
- issue: 希伯来语第二分句句法艰深，且与希腊语平行文本差异显著
  choice: 以现存希伯来语为主，保留“使那人坐”及其代词指向不明的特点，并用脚注说明。
  alternative: 依希腊语改译为“不要与鲁莽的人同行，免得他重重压迫你”；或把希伯来语代词解释为反身代词，译成“免得他设伏在你面前”。
  rationale: 现存希伯来语见证置信度高，应优先翻译；希腊语可印证全句是在警告危险而任性的人，却不足以取代希伯来语的具体措辞。保留歧义可避免把不确定的指代或反身解释写成定论。
translation_notes:
  register: 采用现代、庄重而可懂的智慧文学劝诫语体。“讥诮者”保留传统智慧文学色彩；第二分句刻意略显生硬，以忠实呈现希伯来文本真实存在的句法和指代困难，脚注则帮助普通读者理解其大意。
