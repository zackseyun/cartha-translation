- from: 不要轻视听那些归来的人[a]，他们曾从自己的父辈那里听闻。[b]
  to: 不要轻视那些归来之人[a]所传述的、他们从父辈那里听来的话。[b]
  rationale: 修订只为解决现代汉语的句法不畅：以“所传述的……话”自然表达“听取那些人所带来的、他们从父辈听得的内容”。“话”是非特指的汉语承接词，不把原文未明说的内容解释为教训或传统。脚注标记仍分别紧随“归来之人”和全句，准确对应词义不确定性与希腊异文。
