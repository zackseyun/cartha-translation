base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/012.yaml
  text: Do not despise hearing from those who have returned[b][a], who have heard from their fathers.
translation:
  language: zh_hans
  text: 不要轻视那些归来之人[a]所传述的、他们从父辈那里听来的话。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归来之人”也可理解为“回转的人”或“悔改的人”；希伯来词的基本意思是返回或回转，但这里的确切所指不明。
    reason: lexical_alternative
  - marker: b
    text: 希腊传统作：“不要借给比你强的人；若借给了，就当作已经失去了。”这看来反映了本节另一种文本传统。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: 不要轻视
  rationale: אַל加未完成式表达直接禁令；תִּמְאַס含鄙弃、藐视之意。“不要轻视”既保留道德分量，也符合现代汉语劝诫语体。
- source_word: בִּשְׁמִיעַת
  choice: 听
  rationale: 该词源于שמע，可指听、聆听或听取。译作“听”使“听那些……的人”在中文中自然，同时不把所听内容具体化为原文未明说的“教训”或“故事”。
- source_word: שָׁבִים
  choice: 归来的人
  rationale: 这是שוב的复数主动分词，基本义为“返回、回转的人”。“归来的人”保留其宽泛字面义；是否特指悔改者、回归者或某类返乡者，语境不足以确定，故在脚注说明。
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: 他们曾……听闻
  rationale: 关系从句修饰前面的复数人群；完成式表示他们已经领受过所听见的传统。“曾……听闻”简洁地传达这一过去经历。
- source_word: מֵאֲבֹתָם
  choice: 从自己的父辈那里
  rationale: 直译为“从他们的父亲们那里”。此处可泛指前代父辈所传的传统；“父辈”既保留父系用语，也比逐字译作“父亲们”更符合现代汉语。
theological_decisions:
- issue: 现存希伯来文本与希腊传统在《便西拉智训》8:12完全不同
  choice: 正文依现存希伯来文本翻译
  alternative: 希腊传统作：“不要借给比你强的人；若借给了，就当作已经失去了。”
  rationale: 本节有可信度高的希伯来见证，应以希伯来文本为正文。希腊文并非细微措辞差异，而是另一整句格言，因此不加调和，只在脚注保存这一异文传统。
- issue: שָׁבִים是否具有“悔改者”的神学含义
  choice: 译作中性的“归来的人”
  alternative: “回转的人”或“悔改的人”
  rationale: שוב可以在特定语境中表示悔改或转回，但本句没有足够线索限定为宗教悔改。正文保留基本动作含义，避免把可能的神学含义定死。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。句法尽量贴近希伯来文的“禁令＋关系从句”结构；不用“教训”“传统”等解释性名词，以免补入原文没有明说的内容。
