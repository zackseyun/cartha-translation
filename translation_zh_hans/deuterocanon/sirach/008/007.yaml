  text: Do not shame a man who turns back from transgression[a]; remember that we all are guilty.
translation:
  language: zh_hans
  text: 不要使一个离弃过犯而回转的人蒙羞[a]；要记住，我们人人都有罪责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“不要因死人而幸灾乐祸；要记住，我们人人终有一死。”本节希伯来文本的前后两句都与希腊文本不同，因此正文采用现存希伯来文本，并在此保留希腊异读。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּכְלִים
  choice: 不要使……蒙羞
  rationale: כלם 的使役形表示使人受羞辱、蒙羞；此译自然地保留其人际伤害的意味，而不额外限定羞辱的方式。
- source_word: אִישׁ
  choice: 一个……的人
  rationale: 原文为阳性单数；汉语以“一个……的人”自然表达单数个体，不必加入原文没有的身份限定。
- source_word: שָׁב
  choice: 回头
  rationale: שוב 的分词表示转回、回转；在离开过犯的语境中，“回头”保留悔改的含义，又不将其处理成专门的神学术语。
- source_word: מִפֶּשֶׁע
  choice: 离开过犯
  rationale: 介词 מִן 表示从某事中离开；פשע 可指过犯或悖逆。“过犯”保留其道德与法理色彩。
- source_word: זְכֹר
  choice: 要记住
  rationale: 直接表达命令语气，符合现代汉语劝诫文体。
- source_word: כֻּלָּנוּ
  choice: 我们人人
  rationale: 明确保留“我们全体”的包容性和强调作用。
- source_word: חַיָּבִים
  choice: 都有罪责
  rationale: חייבים 可指负有责任、应受追究或有罪。“有罪责”在此既自然，也保留责任与罪咎的幅度；不按希腊平行文本直接译成死亡。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在全节上的差异
  choice: 正文依现存希伯来文译为“不要使一个回头离开过犯的人蒙羞；要记住，我们人人都有罪责”
  alternative: 希腊平行文本作：“不要因死人而幸灾乐祸；要记住，我们人人终有一死。”
  rationale: 此处有可信度较高的现存希伯来见证，故正文以其为主。希腊文本两分句均呈现显著不同的读法，具有重要的文本与释义价值，因此在脚注中完整保存。
- issue: 悔改用语
  choice: 回头离开过犯
  alternative: 为罪悔改
  rationale: 原文以“回转”描写离开过犯的行动，并未使用后期专门术语；所选译法保留这种具体动态及其神学张力。
- issue: חַיָּבִים 的语义范围
  choice: 都有罪责
  alternative: 都负有责任；都要死
  rationale: 希伯来词可表达有罪、负有责任或承担后果；“都有罪责”符合本句的道德语境。希腊文明确说人人死亡，但不应借此把希伯来正文的较宽含义收窄为死亡。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“蒙羞”“过犯”“罪责”保持智慧文学的道德分量；句式简洁，适合公开诵读。脚注标记 [a] 已置于正文相应分句之后。
