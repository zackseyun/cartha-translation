  text: For many has gold ruined[b][a], and it leads astray the heart of nobles.
translation:
  language: zh_hans
  text: 金子使许多人行事鲁莽；也使贵族[b]的心误入歧途。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里有显著不同的读法：“不要嘲弄无知的人，免得你的祖先蒙受羞辱。”
    reason: alternative_reading
  - marker: b
    text: “贵族”也可译作“显贵”或“慷慨的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: 许多人
  rationale: 该词在这里作名词用，指人数众多的人；“许多人”是自然、清楚的现代汉语。
- source_word: הִפְחִיז
  choice: 使……行事鲁莽
  rationale: 这是一个较罕见且含义有一定困难的动词，可表达使人轻率、鲁莽或陷入败坏；结合下半句“使……误入歧途”，译作“使……行事鲁莽”既贴近其可能的使役意义，也避免把结果过度确定为“毁灭”。
- source_word: זָהָב
  choice: 金子
  rationale: 直接保留原文所指的黄金，并符合普通现代汉语表达。
- source_word: יַשְׂגֶּה
  choice: 使……误入歧途
  rationale: 该使役动词表示使人走错、迷失；“误入歧途”保留了智慧文学语境中的道德意味。
- source_word: לֵב
  choice: 心
  rationale: 希伯来语的“心”涵盖思想、意志和欲望；保留“心”的意象，不简化为单纯的“思想”。
- source_word: נְדִיבִים
  choice: 高贵人
  rationale: 该词可指尊贵者、贵族或慷慨的人。“高贵人”较能保留身份与品格之间的词义张力；另一可能义在脚注中说明。
theological_decisions:
- issue: 现存希伯来文本与希腊文本显著不同
  choice: 正文依据现存希伯来文，表达金子使许多人鲁莽并使高贵人的心误入歧途。
  alternative: 希腊文作：“不要嘲弄没有教养的人，免得你的祖先蒙受羞辱。”
  rationale: 此处有可信度高的现存希伯来文本，应作为正文依据。希腊文反映的是实质不同的异文，而非轻微措辞差异，因此在脚注中完整保留，以便读者知悉文本传统的分歧。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行事鲁莽”有意保留希伯来动词的困难和不确定性；“高贵人”则保留 נְדִיבִים 可兼指尊贵身份与慷慨品格的语义张力。两个脚注标记均置于正文相关句末。
