  text: For from him you will gain understanding[a], at a time of need to answer a saying.
translation:
  language: zh_hans
  text: 因为你会从他那里获得见识，在需要时回应一句话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里有明显不同的读法：“不要作超过你能力的担保；如果作了担保，就要像将要偿还的人一样谨慎。”本节希伯来文尚存，因此正文依照开罗藏经库的希伯来文本翻译；但这一差异相当显著。
    reason: textual_variant
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: 从他那里
  rationale: 介词 מִן 加第三人称阳性单数后缀，最自然地指“从他那里”；上下文的男性人物是其先行对象。
- source_word: תִּקַּח
  choice: 获得
  rationale: 字面是“拿取”，与 שֶׂכֶל 连用时表达从人那里取得或学到明智，译作“获得”自然且保留获取之意。
- source_word: שֶׂכֶל
  choice: 明智
  rationale: 此处侧重实际判断力和处世智慧，而不只是抽象的理解能力；“明智”简洁地传达这一智慧文学语境。
- source_word: בְּעֵת צֹרֶךְ
  choice: 在需要时
  rationale: 既保留“时候”的时间含义，也符合现代汉语表达。
- source_word: לְהַשִׁיב
  choice: 懂得怎样回答
  rationale: 原文是不定式“回答”；结合获得明智的结果，以“懂得怎样回答”使汉语关系清楚，但不限定回答的具体内容。
- source_word: פִּתְגָּם
  choice: 一句话
  rationale: 该词可指言语、格言或论断；“一句话”保留其宽泛性，避免过度具体化为“箴言”。
