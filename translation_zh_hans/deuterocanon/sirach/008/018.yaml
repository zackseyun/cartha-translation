  text: Do not contend with a judge[a], for he will judge according to his own will.
translation:
  language: zh_hans
  text: 不要同法官争讼[a]，因为他会照自己的意愿判决。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文文本此处是另一则格言：“不要在陌生人面前做隐秘的事，因为你不知道这事会带来什么后果。”本节正文采用开罗藏经库保存的希伯来文，因为本节有希伯来文存世；但两种文本差异显著，故在此注明。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תּשָּׁפֵט
  choice: 不要……争讼
  rationale: אַל引出禁止性劝诫；שפט与עִם及“审判官”连用时，语境指与对方进行法律争辩或诉讼，而不是自己施行审判。“争讼”保留法律语境，也符合简洁的智慧文学文风。
- source_word: עִם שׁוֹפֵט
  choice: 与审判官
  rationale: עִם本义为“与”；配合“争讼”，自然表达敌对性的法律行动。“审判官”比泛指性的“法官”略庄重，并明确其司法身份。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述禁令的理由；现代汉语中“因为”清楚自然。
- source_word: כִּרְצוֹנוֹ
  choice: 按自己的意愿
  rationale: רָצוֹן表示意愿、心意或喜好。此译保留该审判官依个人意志判决的警告意味，同时不额外断定其判决必然腐败。
- source_word: יִשְׁפֹּט
  choice: 判决
  rationale: 该词与前面的שפט同根；在司法语境中译作“判决”比“审判”更自然，突出作出裁断的行为。
