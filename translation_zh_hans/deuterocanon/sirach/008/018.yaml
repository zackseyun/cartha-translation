translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“争讼—判决”呈现希伯来文的法律语境；正文保留其对司法权力与个人意愿之间张力的警告，不将其解释为对所有审判官的绝对道德定性。
