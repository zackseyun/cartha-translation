base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/005.yaml
  text: Do not quarrel with a man of tongue[b][a], and do not put wood on the fire.
translation:
  language: zh_hans
  text: 不要跟口舌伤人的人争吵[a]，也不要往火上添柴。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“舌头之人”，指惯以言语伤人或挑起争端的人。
    reason: lexical_alternative
  - marker: b
    text: 希腊文见证作：“不要责备那离弃罪恶的人；要记住，我们众人都难免受责备。”现存希伯来文则警告人不要同口舌伤人者争吵，也不要使冲突加剧。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּינָץ
  choice: 不要……争吵
  rationale: אַל加未完成式表达禁令；תִּינָץ指发生争执或争斗。“不要……争吵”符合现代汉语劝诫语气。
- source_word: עִם אִישׁ לָשׁוֹן
  choice: 跟口舌伤人的人
  rationale: עִם表示争执的对象；אִישׁ לָשׁוֹן直译为“舌头之人”，是指以言语伤人或挑起争端的人。采用略作释义的表达，以免“舌头之人”在现代汉语中含混，同时不把其范围缩窄为“诽谤者”。
- source_word: וְאַל תִּתֵּן
  choice: 也不要……添
  rationale: 第二个אַל引出并列禁令；תִּתֵּן本义为“放、给”，在添加燃料的语境中自然译作“添”。
- source_word: עַל אֵשׁ עֵץ
  choice: 往火上添柴
  rationale: 原文具体意象是把木柴放到火上，使火势加剧。汉语成语“火上添柴”直接保留这一图像及其比喻作用。
theological_decisions:
- issue: 希伯来文与希腊文见证显著不同
  choice: 正文依据现存希伯来文，译为避免与言语伤人者争吵，并以添柴的比喻警戒不要加剧冲突。
  alternative: 希腊文作：“不要责备那离弃罪恶的人；要记住，我们众人都在责罚之下。”
  rationale: 现存希伯来文语义完整，两个分句也由争吵与添柴的意象紧密相连，因此作为正文依据。希腊文并非近似对译，可能反映不同底本或文本发展；其差异涉及整节内容，故在脚注中完整保留，而不强行调和。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“口舌伤人的人”解释希伯来习语但保留其言语危险性；“往火上添柴”是普通读者熟悉的表达，并保留原文的具体比喻。脚注标记按其所说明内容分别紧随相关正文。
