  text: Do not pledge yourself for one stronger than you; and if you have pledged yourself[a], act as one who must pay.
translation:
  language: zh_hans
  text: 不要作超过自己能力的担保；若已经作保[a]，就当作自己必须偿还。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “超过自己能力的担保”也可理解为替“比你更强的人”或“地位高过你的人”作保；原文措辞未明说对象，所指可为超出你的能力或身份所能承担的责任。希腊语平行文本的读法不同：“不要同愚昧人商议，因为他不能守住一件事。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲרֹב
  choice: 不要……作保
  rationale: 希伯来语动词 ערב 在此指为他人担保、承担保证责任。“作保”是现代汉语中自然且明确的法律、财务表达。
- source_word: יָתֵר מִמְּךָ
  choice: 超过你能力的人
  rationale: יָתֵר מִמְּךָ 可指“比你更大/更强”或“超出你”。结合担保语境，译作“超过你能力的人”传达其债务或责任超出担保人承受范围，同时脚注保留地位、力量方面的可能含义。
- source_word: וְאִם עָרַבְתָּ
  choice: 如果已经作了保
  rationale: 与前句同一动词保持一致，并以“已经”自然表达完成性语境。
- source_word: כִּמְשַׁלֵּם
  choice: 就要把自己当作还债的人
  rationale: 前缀 כ־ 表示比较；分词 מְשַׁלֵּם 指偿付者。此译表达一旦担保便应视自己实际负有偿还责任，而不把含义限定为已经完成付款。
