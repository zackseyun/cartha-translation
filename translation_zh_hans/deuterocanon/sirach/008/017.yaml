  source_fidelity: 首句的希伯来语“יָתֵר מִמְּךָ”没有明说“人”；可指比自己更强／地位更高者，也可概括指超出自身能力或限度的担保。草稿把它定为“超过你能力的人”，既不够自然，也过早限定了原文。修订以“超过自己能力的担保”保留其实际劝诫的范围。末句表达担保人应视同自己负有付款责任，译为“当作自己必须偿还”较为贴切。
  naturalness: “超过你能力的人作保”在现代汉语中搭配不顺，容易被理解为替一个人的能力作保证。改为“作超过自己能力的担保”简洁自然；“若已经作保”保留原有法律语域。
  terminology: “作保／担保”准确对应 ערב 的保证、担保含义。脚注中的希腊语“λόγον στέξαι”并非特指“保守秘密”；草稿的“保守秘密”不当，应按英语审计轨迹及希腊文较宽泛地译为“守住一件事”。
  issues:
  - severity: medium
    issue: 首句将未明说的对象限定为“人”，且措辞不自然。
    rationale: 希伯来文本仅有“超过你／比你更多”，没有“人”这一名词；在担保语境中可理解为超出能力的责任，也可涉及较强或较高地位者。
  - severity: medium
    issue: 脚注将希腊语平行文本译为“不能保守秘密”。
    rationale: 希腊文 λόγον 的意义较宽，不等于“秘密”；英语审计文本为“keep a matter”。应避免无根据地缩窄为秘密。
