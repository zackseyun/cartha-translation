  yaml_path: translation/deuterocanon/sirach/008/008.yaml
  text: Do not shame an old man[a]; remember that you too will be numbered among the elders.
translation:
  language: zh_hans
  text: 不要使年老的人蒙羞[a]；要记住，你也会被列在长者之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文传统则作：“不要忽视智者的言论，要潜心于他们的箴言；因为你会从他们那里学到教诲，并学会怎样服侍权贵。”此处的希伯来文见证保存的是另一则劝诫，教人尊重年长者。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַיֵּשׁ
  choice: 不要使……蒙羞
  rationale: בוש 的皮勒尔形在这里有使役含义，即使人受羞辱；此译既保留使役结构，也符合现代汉语的庄重表达。
- source_word: אֱנוֹשׁ יָשִׁישׁ
  choice: 年老的人
  rationale: אֱנוֹשׁ 指人，יָשִׁישׁ 指年事已高。译作“年老的人”自然、尊重，也不把年龄本身写成带贬义的称呼。
- source_word: זְכֹר
  choice: 要记住
  rationale: 直译命令式“记住”，保留劝诫语气以及前后两句之间的伦理逻辑。
- source_word: תִמָּנֶה
  choice: 会被列在
  rationale: 保留 מנה 尼法勒形的被动意义，并表达将被归入某一群体之意。
- source_word: מִזְּקֵנִים
  choice: 长者之中
  rationale: 此处介词可表达归入、列在某一群体中；זְקֵנִים 既指年长者，也可带有社会敬称色彩，因此译作“长者”。
theological_decisions:
- issue: 单数阳性对象的汉语表达
  choice: 译作“年老的人”，保留单数指称而不刻意突出男性
  alternative: 译作“年老的男人”或“老人”
  rationale: 希伯来语短语采用阳性单数，但在此可作具体而具代表性的泛指。现代汉语“年老的人”保留单数语义和普遍适用性；“年老的男人”可能过度限定性别，“老人”在“使老人蒙羞”中则稍显概括。
- issue: 希伯来文本与希腊传统的显著异文
  choice: 正文依据现存希伯来文本，希腊传统另以脚注说明
  alternative: 正文采用希腊文关于聆听智者言论和学习服侍权贵的内容
  rationale: 此处希伯来见证完整且可信度高，应作为正文依据；希腊文本内容差异显著，不宜拼合或用其改写希伯来正文，但应保存这一重要文本传统。
- issue: מִזְּקֵנִים 的群体意义
  choice: “被列在长者之中”
  alternative: “也会年老”
  rationale: 正文保留原文的被动动词和被归入长者群体的意象，不将其简化为一般性的衰老陈述。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“使……蒙羞”准确传达使役含义；分号保留两项命令之间紧密的因果与反思关系。脚注标记[a]已置于相关分句之后。
