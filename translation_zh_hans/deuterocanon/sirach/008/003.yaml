  text: Do not quarrel with a man who has a sharp tongue, and do not pile wood on his fire.[a]
translation:
  language: zh_hans
  text: 不要同一个嘴尖舌利的人争吵，也不要往他的火上堆木柴。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存的希伯来文本大致可译为：“不要图谋加害没有财物的人，免得他衡量你的身价，你便灭亡。”其中“衡量你的身价”一语难以确定。希腊文本则作：“不要同一个嘴尖舌利的人争吵，也不要往他的火上堆木柴。”正文采用希腊文本的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּחֲרֹשׁ עַל
  choice: 不要图谋加害
  rationale: תחרש 通常可表示“谋划、图谋”，介词 עַל 指向谋划所针对的人。这里优先依照现存希伯来文本，译出“图谋加害”，而不以希腊平行文本的“争吵”取代它。
- source_word: אִישׁ לֹא הוֹן
  choice: 一无所有的人
  rationale: לֹא הוֹן 字面指“没有财富、资财”，可理解为贫穷或没有家产的人。“一无所有的人”保留原文的简短表达，也避免将其解释成道德意义上的“无用之人”。
- source_word: פֶּן יִשְׁקֹל מְחִירְךָ
  choice: 免得他衡量你的身价
  rationale: שקל 是“称量、衡量”，מחיר 是“价钱、代价”。此句在上下文中含义晦涩；直译“衡量你的身价”可保留其真实的不确定性，不擅自解释为勒索、报复或偿还。
- source_word: וְאָבָדְתָּ
  choice: 你便灭亡
  rationale: אבד 在此表示丧失、毁灭或灭亡。译作“灭亡”保留警告的力度，同时不限定究竟是财物、地位还是生命的毁灭。
