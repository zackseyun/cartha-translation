  text: Do not go with a cruel man[a], lest you add weight to your own trouble.
translation:
  language: zh_hans
  text: 不要与残忍的人同行[a]，免得你使自己的祸患更加沉重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“不要向任何人显露你的心，也不要让他以恩惠回报你。”本节的希伯来文本与希腊文本有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם אַכְזָרִי
  choice: 与残忍的人
  rationale: 此处希伯来文本中的 אִם 依句法可理解为“与”，אַכְזָרִי 指残忍、无怜悯的人；译作“与残忍的人”既保留单数人物类型，也符合现代汉语表达。
- source_word: אַל תֵּלֵךְ
  choice: 不要……同行
  rationale: הלך 的基本义是行走、前往；在与某人相伴的语境中，“同行”自然传达结伴而行之意，同时避免过度解释为泛指“交往”。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן 引出应当避免的不良后果；“免得”简洁地保留警戒语气。
- source_word: תַּכְבִּיד
  choice: 使……更加沉重
  rationale: 该词为 כבד 的使役形，意为使之沉重或加重；此译保留希伯来文的重量意象，又符合现代汉语习惯。
- source_word: אֶת רָעָתֶךָ
  choice: 自己的祸患
  rationale: רָעָה 可指邪恶、伤害、灾祸或困境；这里是残忍之人可能给受劝者带来的不良后果，故译“祸患”。“自己的”明确表达第二人称单数所属后缀。
theological_decisions:
- issue: 《便西拉智训》8:19现存希伯来文本与希腊平行文本有实质差异
  choice: 正文依据现存希伯来文本翻译，并在脚注保存希腊异文。
  alternative: 希腊文本可译为：“不要向任何人显露你的心，也不要让他以恩惠回报你。”
  rationale: 本节希伯来见证完整且可信度高，因此正文以希伯来文为主要依据；希腊传统内容显著不同，可能反映不同底本或文本发展，故不将两者调和，而以脚注如实呈现。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“同行”贴近原文动作意象；“使自己的祸患更加沉重”保留希伯来文“加重”的比喻。脚注标记[a]已置于正文相应位置。
