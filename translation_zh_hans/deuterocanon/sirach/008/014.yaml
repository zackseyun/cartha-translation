  text: Do not prosper in the inheritance of a wicked man[a], lest you be burned by the sparks of his fire.
translation:
  language: zh_hans
  text: 不要在恶人的产业中求亨通[a]，免得被他火中迸出的火星烧伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证在这里是另一句格言：“不要同审判官争讼，因为人会按他的地位偏袒他作出判决。”开罗藏经库的希伯来文则警告人不要牵涉恶人的产业。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְלַח
  choice: 不要……求亨通
  rationale: צלח通常表示成功、顺利或亨通。这里保留希伯来文较为突兀的劝诫语气，不把它意译成单纯的“不要参与”；加“求”使现代汉语自然，同时表达借此谋求发达之意。
- source_word: בְּנַחֲלַת
  choice: 在……产业中
  rationale: נחלה可指产业、祖业或继承所得的家产。“产业”既保留具体的财产背景，也不把语义过早限定为继承行为本身；介词בְּ译作“在……中”，保留涉入其范围的意味。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 以现代汉语智慧文学中自然、凝练的称谓对应阳性单数רָשָׁע，指一个具有代表性的作恶者。
- source_word: פֶּן תְּבֹעַר
  choice: 免得……烧着
  rationale: פן引出警告性的后果，译为“免得”；בער在这里表示被点燃或灼烧，“烧着”保持火焰意象且符合现代汉语。
- source_word: בִּשְׁבִיב
  choice: 被……飞星
  rationale: שביב指火星、火花或火焰闪光。“飞星”是简洁而有画面感的汉语表达，指从火中迸出的火星，并避免与天体意义混淆，因为上下文明确提到火。
- source_word: אִשּׁוֹ
  choice: 他火中的
  rationale: 阳性单数后缀回指“恶人”。译成“他火中的飞星”，保留危险从恶人之火发出的比喻关系。
theological_decisions:
- issue: 希伯来文与希腊文见证存在重大差异
  choice: 正文依据现存的希伯来文，译作爱在恶人的产业中求亨通及被其火星烧着的警告。
  alternative: 希腊文作：“不要同审判官争讼，因为人必按他的地位为他判决。”
  rationale: 本节有可靠的希伯来文见证，故以希伯来文为正文依据。希腊文保存的是内容完全不同的格言，不能与希伯来文调和；将其列入脚注，以公开保存文本差异而不强行消解。
translation_notes:
  register: 采用现代、凝练而庄重的智慧文学语体。“求亨通”刻意保留原文不寻常的措辞；“产业”比“遗产”涵盖面稍宽，可表达承继的家产或所属财产。正文脚注标记与脚注完全对应。
