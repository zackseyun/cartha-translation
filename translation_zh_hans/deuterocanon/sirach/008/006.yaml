  text: Do not become familiar with a foolish man[a], lest he show contempt for nobles.
translation:
  language: zh_hans
  text: 不要与愚昧人过从甚密[a]，免得他藐视显贵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要羞辱年老的人，因为我们中也有人正在老去。”本节希腊文与现存希伯来文差异显著。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּרַגִּיל
  choice: 不要……混熟
  rationale: אַל引出禁令；תְּרַגִּיל源自רגל，在此表示因经常来往而熟稔。“混熟”自然地传达养成惯常交往、变得熟悉之意，又不把原文收窄为单纯的训练。
- source_word: אִישׁ אֱוִיל
  choice: 愚昧人
  rationale: 保留智慧文学中带有道德判断的“愚昧”范畴；现代汉语无需机械译出אִישׁ为“男人”，且“愚昧人”简洁庄重。
- source_word: פֶּן
  choice: 免得
  rationale: 准确引出所警戒的负面后果，符合现代汉语劝诫语体。
- source_word: יָבוּז
  choice: 他藐视
  rationale: בוז表示轻蔑、鄙视；“藐视”保留其强度和智慧文学语体。代词“他”对应希伯来文阳性单数动词的主语。
- source_word: לִנְדִיבִים
  choice: 尊贵的人
  rationale: נְדִיבִים可指贵族、显贵，也可带高尚或慷慨之意。“尊贵的人”保留身份与品格之间的词义张力，避免过度限定为世袭“贵族”或政治性的“王公”。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本显著不同
  choice: 正文依据现存希伯来文翻译，并以脚注列出希腊文异读。
  alternative: “不要羞辱年老的人，因为我们中也有人正在老去。”
  rationale: 本节有可信度较高的希伯来文见证，应以之为正文依据；希腊文并非轻微措辞差异，而是内容完全不同，故须透明保留，不能静默调和。
- issue: נְדִיבִים的身份义与品格义
  choice: 译为“尊贵的人”。
  alternative: “贵族”“慷慨的人”
  rationale: 原词可兼具社会地位、高尚品格及慷慨之意；正文采用较宽的表达，以保存词义张力，不据此引入特定阶层伦理。
translation_notes:
  register: 采用现代、简洁而庄重的劝诫语体。“混熟”较口语化但不过分随便，能自然表达长期来往而熟稔；脚注明示希腊文重大异读。
