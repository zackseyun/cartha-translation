base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/009.yaml
  text: Do not boast over one who is dying[b][a]; remember that all of us are being gathered.
translation:
  language: zh_hans
  text: 不要因有人垂死而得意[b]；要记住，我们众人终将被收聚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“我们众人被收聚”，是表示死亡的传统隐喻；也可译作“我们众人都会死”。
    reason: lexical_alternative
  - marker: b
    text: 《德训篇》8:9的希腊文传本与此处差异很大，内容转而劝人聆听长者的讲述、从他们学习智慧；本译文以开罗藏经库的希伯来文见证为正文依据。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְהַלֵּל
  choice: 不要……就得意
  rationale: התהלל 的反身形式可指自夸、夸胜或扬扬得意；与“因有人垂死”连用时，重点是不可因别人的死亡而得意，不宜仅译成一般性的“自夸”。
- source_word: עַל
  choice: 因
  rationale: 此处 עַל 标明得意的对象或缘由；汉语用“因”自然表达“因别人的垂死而得意”的敌对意味。
- source_word: גֹּוֵעַ
  choice: 有人垂死
  rationale: גוע 的分词指正在断气、走向死亡的人，而非已经死去的人；“垂死”保留其过程性。
- source_word: זְכֹר
  choice: 要记住
  rationale: 直译命令式，同时符合现代汉语劝诫语气。
- source_word: כֻּלָּנוּ
  choice: 我们所有人
  rationale: 保留原文明确而包容的第一人称复数，不把劝诫仅仅指向听者。
- source_word: נֶאֱסָפִים
  choice: 都要被收去
  rationale: אסף 的被动式可婉指死亡。“被收去”保留收聚的隐喻；“都要”则以自然汉语表达分词所陈述的普遍命运，而不补出原文未说的归宿。
theological_decisions:
- issue: נֶאֱסָפִים 所含的死亡婉语
  choice: 保留“被收去”的收聚隐喻
  alternative: 我们所有人都会死；我们所有人都要归到列祖那里
  rationale: 直接译为“都会死”会抹平原文意象；译为“归到列祖那里”则补入本节没有明说的归宿。现译既保留死亡的含蓄表达，也不对死后的归属作额外断定。
- issue: 对垂死者“得意”的道德语气
  choice: 按语境译作“因有人垂死就得意”
  alternative: 向垂死的人自夸
  rationale: 原文动词本身可指自夸或夸胜，但 עַל גֹּוֵעַ 使其在此更可能表示凌驾于垂死者之上的得意。译文保留自我抬高的意味，同时避免把它误解成只是在垂死者面前谈论自己的成就。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“垂死”准确而简洁；“得意”比生硬的“夸胜”更符合当代汉语，并在本语境中传达幸灾与自我抬高。“被收去”刻意保留原文的死亡隐喻，脚注说明其字面形式与可选直译。
