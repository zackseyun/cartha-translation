  text: Whoever touches pitch will have his hand stick to it[a], and whoever associates with a scoffer will learn his way.
translation:
  language: zh_hans
  text: 摸沥青的，手必被沥青黏住；与嘲讽者结交的，必学他的行径。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“摸沥青的必受玷污；与骄傲的人来往的，必变得像他一样。”希伯来文则作“嘲讽者”和“必学他的行径”。
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹגֵעַ בְּזֶפֶת
  choice: 摸沥青的
  rationale: 分词表达普遍性的箴言主体；“沥青”准确呈现黏稠的黑色物质及本句的黏附意象。
- source_word: תִּדְבַּק יָדוֹ
  choice: 手必粘上
  rationale: 贴近希伯来文“他的手必黏住”；中文省去上下文已明示的宾语，表达自然，并保留具体的黏附意象。
- source_word: וְחוֹבֵר אֶל
  choice: 与……结交的
  rationale: 体现主动亲近、与人来往的关系含义，符合现代汉语箴言式表达。
- source_word: לֵץ
  choice: 嘲讽者
  rationale: 该词在希伯来智慧文学中通常指讥诮、嘲弄的人；不依希腊平行文本改作“骄傲的人”。
- source_word: יִלְמַד דַּרְכּוֹ
  choice: 必学他的行径
  rationale: 保留希伯来文“学习他的道路”的明确措辞；“行径”在现代中文中自然传达对其行为模式的效法，并带有符合语境的负面色彩。
theological_decisions:
- issue: 希伯来文本与希腊平行文本的差异
  choice: 正文以现存希伯来文为准：手粘上、嘲讽者、学他的行径。
  alternative: 依希腊文译作：“摸沥青的必受玷污；与骄傲的人来往的，必变得像他一样。”
  rationale: 现存希伯来文在本项目中为主要文本见证；希腊文大意相近，但将具体的黏附写成玷污，并以“骄傲的人／变得像他”取代“嘲讽者／学他的行径”。脚注保留这项真实的文本差异。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留希伯来箴言上下两句的平行结构。以“必”体现格言所陈述的典型后果；脚注标记置于整节末尾，对应整处希腊异文。
