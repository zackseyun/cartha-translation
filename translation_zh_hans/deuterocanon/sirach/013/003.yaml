base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/003.yaml
  text: If a rich man does wrong[a], he acts arrogantly; but if a poor man does wrong, he himself pleads for mercy.
translation:
  language: zh_hans
  text: 富人作恶，仍然趾高气扬；穷人作恶，却只能恳求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行见证与此显著不同：“瓦锅和铜锅有什么共同之处？这个撞上去，那个就会粉碎。”
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: 富人
  rationale: 按现存希伯来文的直接含义翻译，与下句的“穷人”构成社会地位上的鲜明对比。
- source_word: יְעַוֶּה
  choice: 作恶
  rationale: 该动词表达行事不正、做错或作恶；“作恶”简洁自然，也保留其道德含义。
- source_word: יִתְנַוֶּה
  choice: 傲慢自大
  rationale: 依语境表达富人犯错后仍摆出高傲姿态；采用双词短语，使较少见词形所含的骄矜意味在现代汉语中清楚可懂。
- source_word: דַּל
  choice: 穷人
  rationale: 指贫寒、弱势的人，与“富人”对应；“穷人”是现代汉语中最直接自然的表达。
- source_word: יִתְחַנָּן
  choice: 低声求情
  rationale: 该词表示恳求恩待、怜悯；“求情”贴合人在受责难时恳切请求宽容的语境，“低声”则传达其屈身央求的姿态。
theological_decisions:
- issue: 希伯来文与希腊文见证在本节内容上显著不同
  choice: 正文采用现存希伯来文的富人／穷人箴言，并在脚注完整保留希腊文的器皿箴言。
  alternative: 按希腊文译作：“瓦锅怎能与铜锅相交？这个一碰，那个就会粉碎。”
  rationale: 所给希伯来文来源置信度高，且任务要求优先依据原文证据；因此不以内容完全不同的希腊平行文本取代现存希伯来文。两种见证的差异无法通过调和消除，故以脚注如实呈现。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“自己还……自己却……”对应两处强调性代词，并突出富人与穷人在同样作恶之后所表现或被迫采取的不同姿态。
