review_pass:
  verdict: revise
  source_fidelity: 正文总体遵循现存希伯来文的富人／穷人箴言，处理见证分歧的方向可取。但“低声”并非יִתְחַנָּן所明示，属于不必要的形象化增添；“自己还／自己却要”也未能自然表达两处强调代词及格言的对照。
  naturalness: “富人作恶，自己还傲慢自大；穷人作恶，自己却要低声求情”可理解，但“自己还”略显口语且语义着力不稳。“仍然趾高气扬／却只能恳求”更凝练、自然，并保持箴言体的庄重。
  terminology: “富人”“穷人”“作恶”均可接受。“恳求”足以表达יִתְחַנָּן的乞求怜悯、求恩意味，不添加“低声”或预设具体司法场景。“趾高气扬”适切表达יִתְנַוֶּה的骄矜姿态。脚注应明确这是希腊文平行见证，且避免“相交”这一现代汉语中易带人际或宗教联想的词。
  issues:
  - severity: medium
    issue: “低声求情”加入原文未明示的“低声”
    rationale: יִתְחַנָּן意为恳求、哀求，并不指定说话音量；删去该附加限定可提高源文忠实度。
  - severity: low
    issue: 正文中“自己还……自己却要……”表达不够自然
    rationale: 希伯来文的הוּא可作强调，但逐一译为“自己”在汉语中生硬。以“仍然／却只能”表达对比及处境的不对等更自然。
  - severity: low
    issue: 脚注“瓦锅怎能与铜锅相交”措辞不够准确自然
    rationale: κοινωνήσει问的是两者有什么共同、相合或可共处之处；“有什么共同之处”清楚且不引入“相交”的额外联想。
  revised_text: 富人作恶，仍然趾高气扬；穷人作恶，却只能恳求。[a]
  revised_footnotes:
