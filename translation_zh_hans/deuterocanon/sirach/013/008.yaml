  text: Be careful not to be too bold[a], and do not make yourself like those who lack understanding.
translation:
  language: zh_hans
  text: 你要谨慎，不可过于狂妄[a]，也不可与无知的人相像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行本作：“你要留心，免得被引入歧途；也不要在你的欢乐中受屈辱。”本节的希伯来文与希腊文差异显著。
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: 你要谨慎
  rationale: 该词是שׁמר的尼法勒命令式，在这里表达警戒、留心之意。“你要谨慎”符合现代汉语劝诫语气，也与希腊文πρόσεχε所表达的留意相呼应。
- source_word: אַל תִּרְהַב מְאֹד
  choice: 不可过于狂妄
  rationale: רהב可表示狂傲、冒失或放肆地自我张扬；“狂妄”保留其负面的越分意味，而“过于”对应מְאֹד，避免把它弱化成一般的勇敢。
- source_word: וְאַל תִּדְמֶה
  choice: 也不可与……相像
  rationale: דמה在此宜理解为“像、相似”。“与……相像”自然地表达禁止效法或呈现某类人的样子，又不额外断定具体行为。
- source_word: בַּחֲסֵירֵי מַדָּע
  choice: 无知的人
  rationale: 该短语直指“缺少知识／见识的人”。在智慧文学语境中，“无知的人”简洁自然，兼有缺乏认识和判断力之意。
theological_decisions:
- issue: 希伯来文与希腊文平行本的两个分句均有显著差异
  choice: 正文依现存希伯来文翻译，并以脚注保存希腊文异读。
  alternative: 希腊文：“你要留心，免得被引入歧途；也不要在你的欢乐中受屈辱。”
  rationale: 本节有可靠的希伯来文见证，故以其为正文依据；希腊文并非单纯措辞不同，而是呈现实质不同的内容，因此不将两者调和，而明确记录异读。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“狂妄”传达越分、自我张扬的负面意味；“无知的人”适合智慧文学语境。脚注标记紧接存在异读的首个分句，并说明整节差异。
