base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/022.yaml
  text: A poor man totters[a]; he speaks, and they cry, “Away, away!”; but an intelligent man speaks[b], and there is no place for him.
translation:
  language: zh_hans
  text: 穷人一失足，他一开口，人们便喊：“滚开！滚开！”[a]；即使他说得明智，也没有他的容身之地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的重复感叹语简短而带习语色彩，确切语气不完全确定；这里译作“滚开！滚开！”，表示反复的驱赶或斥责。希腊文平行文本将其表述为：卑微的人一失足，人们又加以责骂。
    reason: lexical_alternative
  - marker: b
    text: 直译“也没有他的地方”，可理解为他的话得不到听取、接纳，或在社会上没有立足之处。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: 穷人
  rationale: 该词可指贫穷、软弱或社会地位低下的人；这里保留单数人物形象，并与本节所描写的社会轻蔑相符。
- source_word: נָמוֹט
  choice: 一失足
  rationale: מוט可表示摇晃、滑倒、失足或陷入不稳；“失足”保留具体与比喻两种可能，不限定为道德过错或境遇失败。
- source_word: גָּע גָּע יִשֶּׂא
  choice: 人们便喊：“滚开！滚开！”
  rationale: 希伯来文简短而难解；重复的感叹语表达驱赶或斥责，יִשֶּׂא则表示这样的喊声被扬起。补出泛指主语“人们”，使现代汉语自然，并与希腊文所见的责骂反应一致。
- source_word: וְדִבֶּר מַשְׂכִּיל
  choice: 即使他说出有见识的话
  rationale: 按希伯来文的压缩结构理解为同一位穷人说出明智、有洞察力的话，而非另引入一位“聪明人”；希腊文平行文本“他说出明理的话”支持此解。“即使”明确上下两分句的让步关系，但不增添教义判断。
- source_word: וְאֵין לוֹ מָקוֹם
  choice: 也没有他的容身之地
  rationale: 直译为“没有他的地方”。“容身之地”保留空间隐喻，同时可自然表达他的见识在社会中得不到位置、接纳或听取。
theological_decisions:
- issue: “有见识”所修饰的对象
  choice: 把它理解为穷人所说的话，即“他说出有见识的话”
  alternative: 理解为另一位有见识的人开口说话
  rationale: 希伯来语可因句法压缩而产生歧义；然而希腊文平行文本以同一个卑微者为主语，并说他“发出明理的话”，故正文采用同一主语，同时不把这层社会批判扩展成特定教派教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一失足”保留原文关于摇晃、滑倒或失败的开放性；“滚开！滚开！”传达突然而重复的排斥；“容身之地”既保留原文的空间意象，也让普通读者理解其社会含义。
