  register: 采用简洁、对称的现代汉语箴言体。“一……就……”突出两种处境下的即时社会反应；“却”明确呈现富人与穷人所受待遇的强烈反差。脚注标记置于整节相关表述之后，避免误指单个“踉跄”。
