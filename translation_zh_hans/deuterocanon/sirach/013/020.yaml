  text: When a rich man stumbles[a], he is supported by a friend; but when a poor man stumbles[b], he is driven away from friend to friend.
translation:
  language: zh_hans
  text: 富人一踉跄，就有朋友扶持；穷人一踉跄，却被一个朋友赶到另一个朋友那里。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可直译作“从一个朋友到另一个朋友”。希伯来文的说法表明，穷人被人反复推诿或赶走，而没有得到真正的扶助。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本与此处差异很大：“谦卑是骄傲人所厌恶的，穷人也是富人所厌恶的。”本节在希伯来文尚存之处，以希伯来文见证为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: עָשִׁיר
  choice: 富人
  rationale: 单数名词在此作箴言式泛指；“富人”自然地保留了与“穷人”的社会经济对照。
- source_word: מוּט / נָמוֹט
  choice: 一踉跄
  rationale: 两处同源动词表示摇晃、失足或遭遇挫折，并非必然彻底跌倒；采用同一译法也保留希伯来文的平行结构。
- source_word: נִסְמָךְ
  choice: 有朋友扶持
  rationale: 该词表示得到支撑、扶助；结合 מֵרֵעַ，译成主动而自然的汉语，同时保留帮助来自朋友这一点。
- source_word: רֵעַ
  choice: 朋友
  rationale: 在本句社会关系语境中，“朋友”是最直接、通顺的对应词，也能显出富人与穷人所受待遇的反差。
- source_word: דַל
  choice: 穷人
  rationale: דַל 可指贫穷、弱小的人；此处与 עָשִׁיר 对举，宜译“穷人”。
- source_word: נִדְחָה
  choice: 被赶到
  rationale: 该被动形式含有被推开、驱离、排斥之意；“被赶到”与后面的方向短语衔接自然，并体现没有人真正接纳或扶助他。
- source_word: מֵרֵעַ אֶל רֵעַ
  choice: 从这个朋友……到那个朋友那里
  rationale: 尽量保留“从朋友到朋友”的移动结构；“这个……那个……”在现代汉语中自然地表达被人反复推诿、转手的意味。
