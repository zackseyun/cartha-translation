  text: When a noble draws near[a], keep your distance, and then he will bring you nearer still.
translation:
  language: zh_hans
  text: 权贵召你近前时[a]，你要退后保持距离；这样，他会越发召你近前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文十分简约，也可较直译为：“要靠近权贵，却要远离。”希腊平行文本则作“有权势的人召你时”，支持正文所采用的意思：受到权贵召见时，仍应谦退自持，他便会越发召你近前。
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵב
  choice: 召你近前时
  rationale: 希伯来文本极为简约，单独看可理解为“你要靠近”或与权贵的接近有关；希腊平行文本 προσκαλεσαμένου σε 明确呈现“召你”的意思。正文据综合证据译为“召你近前时”，并用脚注保留希伯来文的字面歧义。
- source_word: נָדִיב
  choice: 权贵
  rationale: 此处指社会地位高、掌握权势的人；“权贵”自然地兼顾身份与权力色彩，又不把范围限于君王或贵族爵位。希腊文 δυνάστης 也支持权势人物之义。
- source_word: הֱיֶה רָחוֹק
  choice: 你要退后保持距离
  rationale: 字面为“要远离／要在远处”，在此劝人面对有权势者时有所退让和保留。希腊文 ὑποχωρῶν γίνου 支持“退后”的动作色彩；“保持距离”则保留希伯来文的状态含义。
- source_word: וּכְדֵי כֵן
  choice: 这样，反而
  rationale: 该表达连接克制退让与随后被进一步招近的结果；希腊文 τόσῳ μᾶλλον 带有“越发／更”的加强意味。“这样，反而”在现代汉语中清楚表达箴言式的结果与反转。
- source_word: יַגִּישֶׁךָ
  choice: 他会叫你更近前
  rationale: 此动词带第二人称宾语后缀，表示使对方靠近。“叫你更近前”既表达使役意义，也结合希腊平行文本的加强语气呈现进一步接近。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“权贵”体现社会权势而不限定具体官爵；“退后保持距离”避免把劝诫误解为敌意疏远；分号突出先谦退、后被招近的对照。
