base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/017.yaml
  text: What peace can there be between a hyena and a dog? What peace can there be between a rich man and a poor man?[a]
translation:
  language: zh_hans
  text: 鬣狗与狗之间，哪会有和平？富人与穷人之间，哪会有和平？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“狼与羊羔能有什么相交呢？罪人与敬虔人也是如此。”现存希伯来文本则作“鬣狗……狗”和“富人……穷人”。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאַיִן
  choice: 哪会有
  rationale: 此处不是询问来源的“从哪里”，而是反问，否定双方之间存在和平的可能；“哪会有”自然地传达这一语用力量。
- source_word: שָׁלוֹם
  choice: 和平
  rationale: 该词指和平、和睦的关系；“和平”直接保留原文用词，并让上下文表达无法和谐共处之意。
- source_word: צָבוּעַ
  choice: 鬣狗
  rationale: 在后期圣经希伯来语及《便西拉智训》的语境中，此词通常指鬣狗。现存希伯来文本在此完整可用，因此不以希腊平行文本的“狼”取代它。
- source_word: כָּלֶב
  choice: 狗
  rationale: 这是该希伯来词直接、通行的现代汉语对应词。
- source_word: עָשִׁיר
  choice: 富人
  rationale: 该词为阳性单数，指富有的人；现代汉语“富人”简洁自然，也与下文“穷人”形成整齐对照。
- source_word: רָשׁ
  choice: 穷人
  rationale: 该词指贫穷或困乏的人；“穷人”准确保留原文的社会经济对比。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本的比喻及道德指向不同
  choice: 正文依现存希伯来文本译作“鬣狗……狗”和“富人……穷人”
  alternative: 希腊平行文本作“狼……羊羔”和“罪人……敬虔人”
  rationale: 《便西拉智训》有希伯来文本存世之处，应优先按希伯来语翻译。希腊文本反映了实质不同的流传形式，把社会经济对比转为道德对比；为保留这一真实的文本张力，将其列入脚注，而不在正文中调和。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。重复“哪会有和平”以保留希伯来原文的平行结构和反问力度；不增添“同样”等解释性连接语。
