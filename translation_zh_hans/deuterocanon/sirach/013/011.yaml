base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/011.yaml
  text: Do not trust his ease with you[a], and do not believe his many words; for with much talk he is testing you, and while laughing with you he is probing you.
translation:
  language: zh_hans
  text: 不要因同他相处时无拘无束就掉以轻心[a]，也不要相信他的许多话；因为他话多，是在试探你；他一面同你说笑，一面探察你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要因同他自由交谈就掉以轻心。”希伯来文“自由”以及希腊文平行文本都可指在他面前毫无顾忌、过于随便地说话或相处。
    reason: 保留 לְחֹפֶשׁ עִמּוֹ 在“自在相处”与“自由交谈”之间的词义幅度。
lexical_decisions:
- source_word: אַל תִּבְטַח
  choice: 不要……就放心
  rationale: 希伯来文表示不可倚赖、不可确信；结合后接的不定式性短语，这样译成现代汉语较自然，并保留警戒语气。
- source_word: לְחֹפֶשׁ עִמּוֹ
  choice: 因能在他面前无拘无束
  rationale: חֹפֶשׁ 的基本意象是自由、不受拘束；עִמּוֹ 表示与他同在或同他交往。希腊文 ἰσηγορεῖσθαι 也指自由或平等地说话。正文表达毫无戒备的自在，脚注保留“自由交谈”的可能。
- source_word: וְאַל תַּאֲמִין לְרֹב שִׂיחוֹ
  choice: 也不要相信他的许多话
  rationale: אמן 的使役词干在此指相信；对象是他大量的话语。译文简洁保留原文数量意味。
- source_word: כִּי מַרְבִּית שִׂיחוֹ
  choice: 因为他滔滔不绝
  rationale: 原文强调话语繁多；“滔滔不绝”以自然汉语表达持续而大量说话，同时承接上句“许多话”。
- source_word: נִסּיוֹן
  choice: 是在试探你
  rationale: 希伯来文表达较压缩，希腊文 πειράσει σε 明确以“你”为受事。译为动词结构，保留其有意测试对方的意味。
- source_word: וְשֹׂחֵק לְךָ
  choice: 他一面与你说笑
  rationale: שׂחק 可指笑或嬉笑；此处表面友善与暗中探察同时发生。“与你说笑”符合现代汉语人际语境，但不把它强化为嘲笑。
- source_word: וַחֲקָרֶךָ
  choice: 一面探察你
  rationale: 词根 חקר 指搜寻、查究、考察；“探察”既保留审查意味，也符合对方借谈笑摸清内情的语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“无拘无束”“滔滔不绝”“一面……一面……”使警戒关系清楚；不增添人物身份或动机之外的神学解释。
