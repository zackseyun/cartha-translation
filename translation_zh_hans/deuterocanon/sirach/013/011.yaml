  rationale: 修订首句以更自然的汉语表达“不可信赖／不可因而放心”的警戒，并使“无拘无束”明确修饰与对方相处的状态。将“滔滔不绝”改为“话多”，避免不必要的修辞增色。其余句子保留原译对试探、谈笑和探察同时发生的准确表达。
