  text: What fellowship has a wolf with a lamb? So a wicked man with a righteous man[b][a], and likewise a rich man with a man brought low.
translation:
  language: zh_hans
  text: 豺狼怎能与羔羊相伴？恶人与义人也是这样；富人与卑微的人也是如此。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“富人与一个卑微的人”。末尾这个表达的含义不十分确定，可能指社会地位低下或境遇衰落的人。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本作：“凡有血肉的都按自己的种类聚集，人也必亲近与自己相似的。”这反映了这句格言的另一种文本形式，强调人会与同类相交。
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יְּחֻבַּר
  choice: 怎能……相交
  rationale: חבר 的被动式在这里以反问表达彼此结合、来往或结交。“怎能……相交”既保留反问力度，也自然传达关系层面的意思。
- source_word: זְאֵב
  choice: 豺狼
  rationale: זאב 指狼；现代汉语圣经和箴言语体中常用“豺狼”，能鲜明呈现捕食者形象。
- source_word: כֶּבֶשׂ
  choice: 羔羊
  rationale: כבש 可指羊或羔羊；在与狼的捕食关系中，“羔羊”更能体现脆弱性，也符合庄重的圣经语体。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词指邪恶、不义的人；“恶人”简洁地保留智慧文学中与“义人”相对的固定范畴。
- source_word: לַצַּדִיק
  choice: 与义人
  rationale: 介词 ל 在比较结构中表达关系上的对应；译作“与义人”承接首句“与羔羊”的句式。
- source_word: עָשִׁיר
  choice: 富人
  rationale: 阳性单数名词在箴言中作代表性泛指；汉语“富人”自然且不必额外添加性别。
- source_word: אִישׁ נֶאֱצָל
  choice: 卑微的人
  rationale: 末词语义不十分确定，语境上与“富人”形成社会地位的对照。“卑微的人”保留社会地位低下或遭贬抑的宽泛含义，避免武断限定为经济贫穷。
theological_decisions:
- issue: 智慧箴言中阳性单数的表达
  choice: 恶人／义人／富人／卑微的人
  alternative: 邪恶的男人／正义的男人／富有的男人／被贬低的男人
  rationale: 希伯来文使用阳性单数作箴言式代表表达；现代汉语的“恶人、义人、富人”本身可泛指，不需机械加入“男人”，同时仍保留各伦理和社会类别的对照。
- issue: 希伯来文本与希腊平行文本的差异
  choice: 正文依据现存希伯来文的豺狼与羔羊之喻
  alternative: 正文采用希腊文“凡有血肉的都按自己的种类聚集，人也必亲近与自己相似的”
  rationale: 此处希伯来文本存留且可信度高，应作为正文基础；希腊文显著不同，适合以脚注保存为异文，而不取代希伯来文。
- issue: אִישׁ נֶאֱצָל 的不确定含义
  choice: 卑微的人
  alternative: 贫穷的人／被贬低的人／地位低微的人
  rationale: 该表达可能指社会地位低下或境遇衰落者。正文采用涵盖面较广的“卑微的人”，并在脚注中明确其不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“豺狼怎能与羔羊相交”保留希伯来文反问；后两分句用“也是这样／也是如此”呈现原文 כַּךְ 与 וְכֵן 的递进平行。脚注标记均在正文中出现。
