  naturalness: 修订后的正文为现代标准普通话，语气简洁而带有箴言式警醒。“说好听的话”“使你一贫如洗”“毫不心痛”均自然、清楚，且层次分明。
  terminology: “一贫如洗”恰当表达ירשש所指的使人贫穷、剥夺所有；“毫不心痛”合乎“不会使他痛苦／忧伤”的语义。脚注保留希腊平行文本的实质差异，避免将两种文本形态混入正文。
