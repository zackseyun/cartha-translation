  text: If you have something[a], he will speak kindly with you, and he will strip you bare without feeling pain.
translation:
  language: zh_hans
  text: 如果你手里有些东西[a]，他就会对你说好听的话；他会使你一贫如洗，自己却毫不心痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“如果你有用，他就会利用你；如果你缺乏，他就会离弃你。”这与现存希伯来文本所反映的经文形态有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם שַלְּךָ
  choice: 如果你有可取之处
  rationale: 希伯来文本此处艰涩，字面似指“如果你有所拥有”，而希腊平行文本作“如果你有用”。“有可取之处”保留对方因你尚有东西可取、尚可利用而亲近你的语境，也避免把不确定含义限定为财富。异文在脚注中完整说明。
- source_word: יֵיטִיב דְּבָרָיו עִמָּךְ
  choice: 他就会对你说好听的话
  rationale: 原文直译近于“他使自己的话对你悦耳/美好”，指以悦耳、讨好的话笼络人。“说好听的话”自然地保留言语层面的动作及其谄媚意味。
- source_word: וִירֹשֶׁשְׁךָ
  choice: 他会使你一贫如洗
  rationale: 该词表示使人贫穷或剥夺其所有。“使你一贫如洗”准确传达掠夺至贫的结果，也符合现代汉语表达。
- source_word: וְלֹא יִכְאַב לוֹ
  choice: 自己却毫不心痛
  rationale: 原文表示这事不会使他疼痛或忧伤；此处描写剥削者毫无不安或怜悯。“毫不心痛”既保留痛感意象，也自然呈现其冷酷。
theological_decisions:
- issue: 希伯来开罗藏经库见证与显著不同的希腊平行文本之间的取舍
  choice: 正文依照现存希伯来文本翻译，并以脚注保存希腊异文。
  alternative: 依希腊文译为：“如果你有用，他就会利用你；如果你缺乏，他就会离弃你。”
  rationale: 本节有存世希伯来文本，故正文以希伯来见证为首要依据；但希腊文本反映了实质不同的经文形态，不应被正文无声调和，故在脚注中完整列出。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“说好听的话”呈现刻意讨好的语气；“一贫如洗”有力度但并不过分古雅。正文保留希伯来文本中先笼络、后榨取且毫无心痛的递进关系。
