revisions:
- from: 如果你有可取之处[a]，他就会对你说好听的话；他会使你一贫如洗，自己却毫不心痛。
  to: 如果你手里有些东西[a]，他就会对你说好听的话；他会使你一贫如洗，自己却毫不心痛。
  rationale: 仅修订首句，将容易理解为“具有长处”的“有可取之处”改为“手里有些东西”。这一表达对应希伯来文本所传“有所拥有”的宽泛含义，并不武断限定为财富，也不将希腊文“有用”的异读纳入正文。其余译文和脚注可保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:33:56Z'
