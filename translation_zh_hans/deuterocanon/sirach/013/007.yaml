base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/007.yaml
  text: As long as you are useful[a], he will make sport of you; two or three times he will flatter you. Then he will look at you as if to pass beyond you[b], and he will shake his head at you.
translation:
  language: zh_hans
  text: 只要你还有用，他就戏弄你[a]，二三次奉承你。随后，他看着你，像要从你身边走过似的[b]，还冲着你摇头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “戏弄”所译的希伯来词可以表示嘲弄、轻慢，或把人当作玩物。
    reason: lexical_alternative
  - marker: b
    text: 这一分句的希伯来文较难；这里按其“越过／走过”的意象翻译。希腊文作“看见你，便离开你”。
    reason: textual_variant
lexical_decisions:
- source_word: עַד אֲשֶׁר תּוֹעִיל
  choice: 只要你还有用
  rationale: 该短语表示以对方是否仍有用处为条件或时限；这样译符合现代汉语，也与希腊文“他需要你”所呈现的利用关系相合。
- source_word: יְהָתֵל בָּךְ
  choice: 他就戏弄你
  rationale: התל 在此可涵盖嘲弄、玩弄、把人当消遣等意思。“戏弄”保留其轻慢和利用色彩，又不把含义限定为单纯欺骗。
- source_word: פַעֲמַיִם שָׁלֹשׁ
  choice: 再三
  rationale: 字面为“两次、三次”，是表示有限而反复发生的数词说法；“再三”是自然、庄重的现代汉语对应。
- source_word: יַעֲרִיצֶךָ
  choice: 奉承你
  rationale: 此处所说的抬举并非真诚尊重，而是为利用对方所作的刻意讨好；希腊文平行文本中的笑脸、好话和给人希望也支持这一语境。
- source_word: וּבְכֵן
  choice: 随后
  rationale: 承接前面的暂时奉承，转入利用之后的冷落；“随后”清楚表达叙事推进。
- source_word: יִרְאֲךָ לְהִתְעַבֵּר בָּךְ
  choice: 他见了你，却从你身边走开
  rationale: 希伯来文这一分句较难，其中 עבר 的意象可能是越过、经过或离开。译文保留“见到”与“走开”的画面，并参考希腊文“看见你，便离开你”，表达轻蔑的弃置而不作过度确定。
- source_word: וּבְרֹאשׁוֹ יָנִיעַ אֵלֶיךָ
  choice: 还冲着你摇头
  rationale: 摇头的动作在上下文中表示鄙夷或不屑；希腊文有直接对应。“冲着你摇头”是清楚自然的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“只要……还有用”突出有钱有势者以利益衡量人的语境；“再三”避免生硬直译数字，同时保留反复奉承之意。正文中的两个脚注标记均已对应列出。
