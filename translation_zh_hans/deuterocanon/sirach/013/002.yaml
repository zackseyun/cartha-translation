  text: Do not carry what is heavier than you, and do not associate with one richer than you.
translation:
  language: zh_hans
  text: 不要挑超过你承受能力的重担，也不要与比你富有的人结交。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּבֵד מִמְּךָ
  choice: 超过你承受能力的重担
  rationale: 希伯来文直译近于“比你重的东西”；结合 תִּשָּׂא“背负、承担”，在中文中明确为超过自身承受能力的重担，同时保留比喻空间。
- source_word: תִּשָּׂא
  choice: 挑
  rationale: 表达实际负重及比喻性的承担，口吻自然而庄重。
- source_word: תִּתְחַבָּר
  choice: 结交
  rationale: 此处指建立伙伴或交往关系；“结交”比泛泛的“来往”更贴近主动联合之意。
- source_word: עָשִׁיר מִמְּךָ
  choice: 比你富有的人
  rationale: 直接保留比较结构，不增添权势、阶层等原文未明说的含义。
theological_decisions:
- issue: 本节是否包含陶器与贫富之人的扩展比喻
  choice: 正文仅译至“不要与比你富有的人结交”
  alternative: 纳入“瓦锅与铁锅”等后续句子
  rationale: 所给经节编号及希腊平行文本都支持本节止于两项禁令；希伯来材料中其后的陶器比喻很可能属于随后经节，且英文审校层也采用较短边界。
translation_notes:
  register: 采用现代、简洁、劝诫式的标准普通话。“超过你承受能力”自然呈现希伯来语比较表达，避免生硬的“比你重”；不把富人关系解释成特定宗派或社会理论。
