translation:
  language: zh_hans
  text: 人的内心会使脸色改变，或好或坏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本在这里有显著差异，大意是：喜乐的面容是内心处于美好境况的迹象；随后还有一句较难理解的话，谈到费力寻得箴言。本节希伯来文尚存，正文因此以希伯来文为主。希腊文虽同样把内心状态与外在表情联系起来，具体措辞却不相同。
    reason: textual_variant
lexical_decisions:
- source_word: לֵב
  choice: 内心
  rationale: 在希伯来智慧文学中，这个词常指人的思想、情感和性情所在。“内心”既自然，又能清楚表现内在状态与外在脸色之间的联系。
- source_word: אֱנוֹשׁ
  choice: 人
  rationale: 这里是单数、具有代表性的人类称谓。汉语用“人”可保留泛指意义，无须添加原文没有强调的性别色彩。
- source_word: יְשַׁנֵּא
  choice: 会改变
  rationale: 该动词意为“改变、使不同”。“会改变”直接表达内心状态对外在面容产生的作用。
- source_word: פָנָיו
  choice: 他的脸色
  rationale: 原义为“他的脸”。此处谈的是内在状态显露于面部；现代汉语“脸色”比单说“脸”更自然，同时仍保留具体的面部意象。
- source_word: אִם לְטוֹב וְאִם לְרָע
  choice: 无论变好还是变坏
  rationale: 这一对称结构表示两种相反的结果。“变好……变坏”承接前面的“改变”，并避免把 רָע 在此处不必要地强化为纯粹道德意义上的“邪恶”。
