  text: When a poor man speaks[a], they say, “Who is this?” and if he stumbles[b], they push him down all the more.
translation:
  language: zh_hans
  text: 穷人说话时，人们说：“这是谁？”他若失足，他们也推他[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“他们也推他”中的“也”也可译为“甚至”或“还”；这里表示旁人不但轻蔑穷人，也在他失足时加以推挤。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本在这里显著不同：“财富若不带罪，便是好的；贫穷在敬虔人的口中是恶的。”正文依照现存的希伯来文本；本注保留希腊平行传统。
    reason: textual_variant
lexical_decisions:
- source_word: דַּל
  choice: 穷人
  rationale: 该词指贫穷、弱小或社会地位低下的人。中文“穷人”既保留核心含义，也适合箴言式的泛指表达，无须把希伯来语阳性形式显明为“男人”。
- source_word: דּוֹבֵר
  choice: 一开口
  rationale: 分词在此表达一般情形。“一开口”自然地呈现穷人说话便遭轻蔑的语境，同时不改变动作本身。
- source_word: מִי זֶה
  choice: 这是谁？
  rationale: 直译并保留原文轻蔑、排斥的反问语气。
- source_word: נִתְקַל
  choice: 失足
  rationale: 该动词可指绊跌，也可引申为受挫或陷入困境。“失足”保留具体意象及其较宽的社会性含义。
- source_word: גַּם הֵם
  choice: 他们也
  rationale: 按希伯来语保留“他们也／连他们也”的表层表达，不把它无根据地完全解释为程度副词“更甚地”。
- source_word: יֶהְדֳּפוּהוּ
  choice: 推搡他
  rationale: הדף可指推、猛推或驱开。“推搡”在现代中文中自然，并保留动作方向及最终结果上的含混，避免擅自补入“推倒”或“推下去”。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在本节内容上显著不同
  choice: 正文依照现存希伯来文本，描述穷人发言和失足时所受的轻蔑与欺压
  alternative: 希腊文本作：“财富若不带罪便是好的；贫穷在敬虔人的口中是坏的。”
  rationale: 所给希伯来证据可信度高，且任务要求优先依据原文语言证据；同时以脚注保留希腊传统，不将两种不同读法调和成一个文本。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体中文。“一开口”突出随即遭到轻蔑的情境；“失足”和“推搡”保留原文可兼具具体动作与社会处境的意象。引号及标点按现代简体中文规范处理。
