  text: All flesh loves its own kind[a], and every person the one like himself.
translation:
  language: zh_hans
  text: 一切有血肉的，都爱自己的同类；每个人也爱与自己相像的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“每个人爱自己的邻舍。”希伯来文更直译为：“与自己相像的人。”
    reason: 保存希腊文平行见证在第二分句宾语上的重要异读；脚注锚定于受影响的“相像的人”。
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: 凡有血肉的
  rationale: 较贴近希伯来文“所有血肉”，同时以现代汉语中可理解的表达泛指有血肉的生灵，保留箴言质朴而具身体感的措辞。
- source_word: יֶאֱהַב
  choice: 爱
  rationale: 未完成式在此表达恒常、概括性的规律，汉语用一般现在意义的“爱”最自然。
- source_word: מִינוֹ
  choice: 自己的同类
  rationale: מִין表示种类、类别；“自己的同类”准确传达归属与相同性，也符合现代汉语习惯。
- source_word: וְכָל אָדָם
  choice: 人人
  rationale: אָדָם在此泛指每一个人；“人人”自然、简洁，并避免把通称误解为仅指男性。
- source_word: אֶת הַדּוֹמֶה לוֹ
  choice: 与自己相像的人
  rationale: 忠实保留希伯来文“与他相似者”的比较含义；根据汉语泛指结构，将代词自然处理为“自己”，不采用希腊文的“邻人”。
theological_decisions:
- issue: 第二分句应依希伯来文“与他相像的人”还是希腊文“他的邻人”
  choice: 正文采用“与自己相像的人”
  alternative: 他的邻人
  rationale: 现存希伯来文在此清楚强调相似、同类关系，应作为正文依据；希腊文是重要古代平行见证，但其“邻人”使重点转向社会邻近关系，故列入脚注而不取代希伯来文。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。前后两句以“有血肉的—人人”和“同类—相像的人”形成平行；不以生硬的“所有肉体”直译，也不把希伯来文的“相像”解释性改写为伦理意味更强的“邻人”。
