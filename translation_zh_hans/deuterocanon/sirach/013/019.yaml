  text: Humility is abhorrent to pride[a], and the poor are abhorrent to the rich.
translation:
  language: zh_hans
  text: 谦卑为骄傲所憎恶[a]，穷人也为富人所憎恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证作：“旷野中的野驴是狮子的猎物；同样，穷人是富人的食物。”这里现存的希伯来文则作：“谦卑为骄傲所憎恶，穷人也为富人所憎恶。”
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: 所憎恶的
  rationale: 该词在两个结构相同的短句中表达强烈厌恶。译作“所憎恶的”既保留力度，也避免“可憎之物”在现代汉语中可能带来的过强祭仪色彩。
- source_word: גַּאֲוָה
  choice: 骄傲
  rationale: 此处是与“谦卑”相对的抽象名词；“骄傲”自然直接，并保留其负面道德含义。
- source_word: עֲנָוָה
  choice: 谦卑
  rationale: 该抽象名词可指谦逊的品格或卑微状态；“谦卑”在现代中文中简洁庄重，也与“骄傲”形成清楚对照。
- source_word: עָשִׁיר
  choice: 富人
  rationale: 希伯来文虽为单数，却在箴言中泛指一类人；中文用“富人”可自然表达这种类别意义。
- source_word: אֶבְיוֹן
  choice: 穷人
  rationale: 该词指贫穷、困乏的人。这里与“富人”构成社会类别上的对照，译作“穷人”最直接。
theological_decisions:
- issue: 现存希伯来文与希腊文平行见证内容显著不同
  choice: 正文依照现存希伯来文：“谦卑是骄傲所憎恶的，穷人也是富人所憎恶的。”
  alternative: 希腊文意为：“旷野中的野驴是狮子猎取的对象；同样，穷人是富人的草场。”
  rationale: 本节希伯来文完整且可信度高，因此正文以希伯来文为主。希腊文保存了明显不同的意象，不宜暗中调和，故在脚注中完整说明。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两个分句维持平行结构，以“是……所憎恶的”保留希伯来文强烈的关系性表达；第二句加“也”使中文衔接自然，但不消除原文的简练对称。
