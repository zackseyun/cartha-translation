  text: Every kind of flesh keeps to its own kind[a], and a man is joined to his own kind.
translation:
  language: zh_hans
  text: 凡有血肉的生物，都亲近自己的同类[a]；人也与自己的同类相联。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“凡活物都爱与自己相似者，人人也爱自己的邻舍。”希伯来文正文则强调与自己的同类亲近、相联。
    reason: alternative_reading
lexical_decisions:
- source_word: מִין
  choice: 同类
  rationale: מִין指类别、种类；在这句论及同类相聚的格言中，“同类”既自然，也能贯通上下两句。
- source_word: כָּל בָּשָׂר
  choice: 每一种有血肉的生物
  rationale: 字面为“所有血肉”；此处泛指有生命的受造物。译文保留“血肉”的意象，同时用“生物”明确其所指。
- source_word: אֶצְלוֹ
  choice: 亲近自己的
  rationale: 希伯来文首句高度凝练，אֶצְלוֹ有“在它旁边、与它相近”之意；结合下句及希腊平行文本，表达各从其类、彼此亲近的关系，但不直接采用希腊文的“爱”。
- source_word: יְחֻבַּר
  choice: 相联
  rationale: 这是חבר的被动式，表示被连接、联合或交往。“相联”保留关系性的宽泛含义，避免误解为专指婚姻结合。
- source_word: אָדָם
  choice: 人
  rationale: 此处是泛指人类个体的单数用法；现代汉语用“人”即可自然保留其概括性。
theological_decisions:
- issue: 希伯来文首句省略凝练，与希腊平行文本措辞不同
  choice: 正文以希伯来文为主，译作有血肉的生物亲近自己的同类
  alternative: 凡活物都爱与自己相似的；人人也爱自己的邻舍
  rationale: 现存希伯来文反复强调“类”与同类相联；希腊文可帮助确认其亲和、趋同之意，却不应取代希伯来文而把正文改成“爱”与“邻舍”。脚注保留该重要异文。
translation_notes:
  register: 采用现代、庄重而通顺的格言体。“有血肉的生物”兼顾希伯来文意象与现代可懂度；两句以“自己的同类”呼应，保留原文的平行结构。
