  yaml_path: translation/deuterocanon/sirach/013/010.yaml
  text: Do not draw near[a], lest you be pushed away; and do not stay far off[b], lest you be hated.
translation:
  language: zh_hans
  text: 不要靠近，免得被推开。[a]也不要离得太远，免得被人憎恨。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文直译可作“免得你变得远离”，此处措辞较难；希腊文作“免得你被推开”，支持正文译法。
    reason: textual_variant
  - marker: b
    text: 希腊文作“免得被忘记”或“被忽略”，而非希伯来文的“免得被人憎恨”。正文按现存希伯来文；希腊文所表达的后果较轻，也符合这里的人际处境。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְקָרֵב
  choice: 不要太靠近
  rationale: אַל加未完成式构成禁令；“靠近”保留空间和人际关系双重意味。结合上下文以及希腊文所显示的被推开后果，补出“太”可自然表达不要过分趋近之意。
- source_word: פֶּן
  choice: 免得
  rationale: 准确传达警戒性的否定后果，并维持两分句整齐的箴言式对仗。
- source_word: תִּתְרַחֵק
  choice: 被推开
  rationale: 希伯来文此处字面可指变得远离，但传存措辞较难；希腊文ἀπωσθῇς明确支持“被推开”。这一译法也能说明靠得过近所导致的社会后果。
- source_word: וְאַל תִּתְרַחֵק
  choice: 也不要离得太远
  rationale: 同一词根在第二分句中明显表达主动保持距离，与前句“靠近”构成平衡对照；“离得太远”符合现代汉语习惯。
- source_word: תִּשָּׂנֵא
  choice: 被厌弃
  rationale: 希伯来文通常意为“被恨”；“被厌弃”既保留强烈的负面关系后果，又比现代汉语中的“被恨”更自然庄重。希腊文异读则另列脚注。
