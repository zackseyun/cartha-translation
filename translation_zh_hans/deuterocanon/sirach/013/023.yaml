  text: When a rich man speaks[a], everyone falls silent, and they lift up his sense to the clouds.
translation:
  language: zh_hans
  text: 富人一开口，众人就默不作声；他们把他的见识捧到云端。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“把他的话抬到云端。”希伯来文作“他的见识”，此处以希伯来文为准。
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: 富人
  rationale: 以单数泛指富有的人，符合希伯来智慧文学的格言表达，也自然适合现代汉语。
- source_word: דּוֹבֵר
  choice: 一开口
  rationale: 希伯来语分词具有一般、反复发生的格言意味；“一开口”又能自然带出后句众人的即时反应。
- source_word: הַכֹּל
  choice: 众人
  rationale: 表达在场所有人的集合意义，比直译“所有”更符合现代汉语。
- source_word: נִסְכָּתוּ
  choice: 默不作声
  rationale: 该词形较罕见，但希腊文平行文本 ἐσίγησαν 明确支持“沉默”之意。
- source_word: שִׂכְלוֹ
  choice: 他的见识
  rationale: שׂכל 可指理解力、见识或明智判断；“见识”既自然，又保留讽刺意味，即众人因说话者富有而过度抬高其才识。
- source_word: עַד עָב
  choice: 到云端
  rationale: 保留原文夸张的高举意象；希伯来语单数“云”在汉语中自然表达为“云端”。
- source_word: יַגִּיעוּ
  choice: 捧到
  rationale: 此处表示使之达到高处，与“云端”构成夸张比喻；“捧”还能自然传达逢迎吹捧的语用色彩，而不把讽刺意味解释得过死。
