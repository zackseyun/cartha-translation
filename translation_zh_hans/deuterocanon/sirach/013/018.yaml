base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/018.yaml
  text: The wild beasts of the wilderness are food for the lion[b][a]; so the poor are the pasture of the rich.
translation:
  language: zh_hans
  text: 旷野的野兽是狮子的食物[b]；同样，穷人是富人的草场。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“鬣狗与狗之间哪有和平？富人与穷人之间哪有和平？”希腊文保存了另一则谚语，同样指出贫富之间的敌对关系。
    reason: alternative_reading
  - marker: b
    text: “野兽”或可译作“野驴”；若将希伯来词理解得较为具体，便有此译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל
  choice: 食物
  rationale: 该名词指被吃之物；“食物”贴近原义，也保留捕食意象而不过度限定为猎物。
- source_word: אֲרִי
  choice: 狮子
  rationale: 该动物词的标准译法。
- source_word: פִּרְאֵי מִדְבָּר
  choice: 旷野的野兽
  rationale: 按较宽泛的意义理解为旷野中的野生动物；פרא也可能较具体地指野驴，因此在脚注保留这一词义可能。
- source_word: כֵּן
  choice: 同样
  rationale: 自然引出谚语后半句的类比关系。
- source_word: מַרְעִית
  choice: 草场
  rationale: 本义为牧场或放牧之处；此处用作尖锐比喻，表示富人以穷人为取食、获利的对象。保留“草场”可呈现希伯来文前后相应的吞食意象。
- source_word: עָשִׁיר
  choice: 富人
  rationale: 在谚语中泛指富有者这一类人。
- source_word: דַּלִּים
  choice: 穷人
  rationale: 此处主要指贫穷、困乏而处于社会弱势的人，与富人形成对照；希腊文平行文本也支持经济层面的理解。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本存在显著差异
  choice: 正文以现存希伯来文的捕食和取食谚语为准
  alternative: “鬣狗与狗之间哪有和平？富人与穷人之间哪有和平？”
  rationale: 本节希伯来文保存完整且可信度高，因此正文优先据其翻译。希腊文使用不相容与敌对的意象，虽与希伯来文共同强调贫富之间的压迫性关系，却不是同一措辞，故列入脚注而不取代正文。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“旷野”比“荒漠”更适合此处开放荒野的意象；“草场”刻意保留原文不寻常且尖锐的比喻，不将其解释性地改写为“猎物”。所有脚注标记均见于正文。
