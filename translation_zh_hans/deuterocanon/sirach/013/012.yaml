  text: A cruel man will give a stumbling block and will not spare[b][a]; against the life of many he plots a plot.
translation:
  language: zh_hans
  text: 残暴的人必设置绊脚石，毫不怜惜[a]；他图谋加害许多人的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语作：“不信守诺言的人是无情的；对于伤害和捆绑，他决不留情。”希腊语平行文本的前半节措辞明显不同，但同样表达冷酷加害之意；正文依照现存希伯来语见证。
    reason: textual_variant
  - marker: b
    text: 希伯来语在此重复同一词根以加强语气，直译近于“图谋一个阴谋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזָרִי
  choice: 残暴的人
  rationale: 该词指残忍、无情的人；译作“残暴的人”既保留单数代表性用法，也符合现代汉语表达。
- source_word: יִתֵּן כֹּשֶׂל
  choice: 必设置绊脚石
  rationale: 希伯来语措辞简练，字面意象是“放置使人跌倒之物”。“设置绊脚石”保留这一具体意象及蓄意加害的意味；希腊语平行文本在此有显著异文。
- source_word: וְלֹא יַחְמוֹל
  choice: 毫不怜惜
  rationale: חמל可表示怜悯或饶恕。“毫不怜惜”简洁地传达不施怜悯、不肯放过之意。
- source_word: עַל נֶפֶשׁ רַבִּים
  choice: 害许多人的性命
  rationale: נפש在此语境中指生命或性命，而非抽象的“灵魂”；על在敌对谋划的语境中表示针对。汉语以“害许多人的性命”自然表达这一敌意。
- source_word: קוֹשֵׂר קָשֶר
  choice: 图谋
  rationale: 原文以同根词构成强调式表达，近于“图谋一个阴谋”。正文采用自然汉语“图谋”，并在脚注中说明原文的重复强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“必”保留未完成式在警戒语境中的确定性；“设置绊脚石”保留希伯来语的具体比喻，“图谋害许多人的性命”则避免生硬照搬同根重复，同时以脚注保存其形式特征。
