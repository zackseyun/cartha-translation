  naturalness: 译文简洁、通顺，适合现代标准汉语的箴言体和庄重语域。“你若……，他就会……；你若……，他也不会……”的平行结构清晰自然。“屈膝”和“怜惜”略具书面庄重感，与《德训篇》的智慧训诫体相称。
  terminology: “对他有用／利用你”在中文中形成有意的对应，准确呈现原文中“有用”与“被使用”的关系。“屈膝”没有过度释义，“怜惜”也未把“饶恕、宽免”等可能含义教义化。脚注中的“富人／穷人”及“有权势的人”仅用于说明不同传统所呈现的社会关系，措辞恰当。
