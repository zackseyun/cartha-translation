base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/004.yaml
  text: If you are useful to him[a], he will make use of you; and if you bow down, he will not spare you.
translation:
  language: zh_hans
  text: 你若对他有用[a]，他就会利用你；你若屈膝，他也不会怜惜你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊传统作：“富人行了不义，还大发怒气；穷人受了欺压，还得苦苦哀求。”这里保存的希伯来文本则提出另一种警告：有权势的人会在你对他有用时利用你，而在你屈膝时也不怜惜你。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תִּכְשַׁר לוֹ
  choice: 你若对他有用
  rationale: כשר在这里指合用、适合或对某人有利，并非道德上的正直；“对他有用”自然地表达出强者按实际价值待人的语境。
- source_word: יַעֲבֹד בָּךְ
  choice: 他就会利用你
  rationale: 原文可直译为“他会用你/借你做工”。“利用你”既符合现代汉语，也保留其把人当作工具的负面意味；但不强化为更具体的“剥削”。
- source_word: וְאִם תִּכְרַע
  choice: 你若屈膝
  rationale: כרע的基本意象是弯曲、跪下或倒下。“屈膝”保留身体动作及向强者低伏的社会意味，不把原文含混之处单一解释为经济或身份上的衰落。
- source_word: לֹא יַחְמֹל עָלֶיךָ
  choice: 他也不会怜惜你
  rationale: חמל兼有怜悯与饶惜之意。“不会怜惜你”在中文中同时容纳情感上的无情和行动上的不留情。
theological_decisions:
- issue: 希伯来文本与希腊传统存在重大差异
  choice: 正文直接翻译现存希伯来文本，并用脚注保存希腊异文
  alternative: 按希腊文译为“富人行了不义，还大发怒气；穷人受了欺压，还得苦苦哀求。”
  rationale: 本节有完整且可信度高的希伯来见证，故以其为正文依据；希腊传统代表显著不同的古老文本形态，不应被抹去，故在脚注中完整说明。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“利用”明确呈现人际关系中的工具化意味；“屈膝”保留希伯来动词可指弯身、跪下或倒下的形象及张力。脚注标记[a]已置于对应短语之后。
