base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/025.yaml
  text: Wealth is good if there is no iniquity[b][a], and poverty is bad according to the mouth of arrogance.
translation:
  language: zh_hans
  text: 财富若没有罪孽，便是好的；贫穷照狂傲之口所言，是坏的。[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本的读法明显不同：“人的心会改变他的面容，或向好，或向坏。”
    reason: textual_variant
  - marker: b
    text: 希伯来文“照狂傲之口所言”含义不易确定，也可理解为“按狂傲者的判断（或言论）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הָעֹשֶׂר
  choice: 财富……就是好事
  rationale: טוֹב直接评价“财富”这一处境；译为“好事”既保留箴言式的简洁，也比单说“好”更符合现代汉语表达。
- source_word: אִם אֵין עָוֹן
  choice: 若不带罪孽
  rationale: 条件句从道德层面限定财富。עָוֹן可指罪孽、过错或罪责；“不带罪孽”不把它局限为财富的取得方式，也保留原文较宽的伦理含义。
- source_word: הָעוֹנִי
  choice: 贫穷
  rationale: 该名词表示贫困、贫穷的处境；“贫穷”是简明自然的现代汉语对应词。
- source_word: עַל פִּי זָדוֹן
  choice: 照狂傲者口中的说法
  rationale: עַל פִּי字面涉及“口”，可引申为依照某人的话、判断或裁定；זָדוֹן表示狂傲、妄自尊大。正文采用可读的表达，同时借脚注保留短语本身的困难与多义性。
theological_decisions:
- issue: 希伯来文本与希腊平行文本显著不同
  choice: 正文以现存希伯来文关于财富与贫穷的箴言为准
  alternative: 采用希腊文：“人的心会改变他的面容，或变好，或变坏。”
  rationale: 此处希伯来文本完整且可信度高，应作为翻译正文的主要依据；希腊文并非细微措辞差异，而是另一句内容显著不同的话，因此列入脚注，不用来改写正文。
- issue: 贫穷与狂傲之“口”的关系
  choice: 译作“照狂傲者口中的说法，贫穷是坏事”
  alternative: 可理解为“贫穷因狂傲而有害”，或“在狂傲者的判断中，贫穷是坏事”
  rationale: 希伯来语עַל פִּי זָדוֹן结构艰涩。所选译法保留“口／说法”的意象，并避免断定是在客观谴责贫穷，还是在描述狂傲者对贫穷的评价。
translation_notes:
  register: 采用简洁、对称的智慧文学句式。“财富”“贫穷”“罪孽”“狂傲”庄重而通俗；第二分句略保留原文不寻常的“口”这一意象，并以脚注说明其歧义。
