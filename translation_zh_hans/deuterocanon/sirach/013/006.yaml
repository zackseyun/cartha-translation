  text: He has need of you[a], and he will deceive you[b]; he will smile at you and reassure you.
translation:
  language: zh_hans
  text: 他需要你[a]，又会哄骗你[b]；他会对你微笑，使你安心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊本作：“你若有〔什么〕，他就与你交往，把你耗尽；他自己却不劳苦。”这与现存希伯来文本有显著差异。
    reason: alternative_reading
  - marker: b
    text: 此处希伯来文本艰难；现有词形表面上通常可理解为“帮助（你）”或“拯救”，但不合本节语境。希腊本的“把你耗尽”表明这里可能是指欺骗或榨取。
    reason: textual_variant
lexical_decisions:
- source_word: צֹרֶךְ לוֹ עִמְּךָ
  choice: 他需要你时
  rationale: 希伯来语直陈“他对你有需要”；结合本节所描写的权宜亲近，用“……时”自然表达这种处境关系，但不把希腊本的条件句直接移入正文。
- source_word: וְהָשִׁיעַ לָךְ
  choice: 就会哄骗你
  rationale: 现存希伯来语形式艰难，按通常字形似可理解为“帮助／拯救”，但与上下文不协调。希腊平行本的“把你耗尽”显示这里指带来伤害的操控行为；“哄骗”也与后文的笑脸和使人安心相呼应。异文张力在脚注中保留。
- source_word: וְשׁוֹחֵק לְךָ
  choice: 他会对你笑脸相迎
  rationale: שׂחק可指笑或嬉戏；在逢迎、操控的语境中，“笑脸相迎”比单纯“向你发笑”更自然，也保留其表面友善的意味。
- source_word: וְהִבְטִיחֶךָ
  choice: 使你安心
  rationale: בטח的使役式表示使人感到安全或有把握；“使你安心”简洁保留其使役意义，且符合现代汉语表达。
- source_word: ἀποκενώσει σε
  choice: 把你耗尽
  rationale: 希腊语平行本具体描写把人掏空、耗尽，可能指耗尽其财物或资源；此义作为校勘证据收入脚注，而不直接取代艰难的希伯来正文。
theological_decisions:
- issue: 如何处理希伯来文本与希腊平行本的重大差异
  choice: 正文以希伯来语的句法轮廓为主，并按语境译作“哄骗”；脚注列明希腊本的完整不同读法及希伯来词形的困难。
  alternative: 正文直接依希腊本译为“你若有财物，他就与你同住，把你耗尽，自己却毫无损失”。
  rationale: 这样既不把希腊本当作无声替代文本，也不掩盖希伯来读法在语义上的困难，保留了真实的文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“笑脸相迎”表现表面亲善，“使你安心”保留使役语气。两个脚注标记均置于正文相应位置，并明确呈现希伯来文本与希腊平行本之间的重大差异。
