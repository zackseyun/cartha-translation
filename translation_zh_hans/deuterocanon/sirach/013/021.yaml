  text: A rich man speaks[a], and many are his supporters; even his ugly words are made beautiful.
translation:
  language: zh_hans
  text: 富人说话，支持他的人很多；连他丑陋的言辞也被美化。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׁיר
  choice: 富人
  rationale: 希伯来文为阳性单数，在箴言式语境中代表一类人；“富人”简洁自然。
- source_word: מְדַבֵּר
  choice: 一开口
  rationale: 基本义是“说话”；译作“一开口”自然呈现富人说话便有人响应的社会现象，又不改变原句的箴言性质。
- source_word: וְעוֹזְרָיו רַבִּים
  choice: 支持他的人就很多
  rationale: 字面为“他的帮助者很多”。“支持他的人”更符合这里的人际与社会语境；“就”体现前后分句紧密相随的关系，但不明定因果。
- source_word: דְבָרָיו
  choice: 他的言辞
  rationale: 保留复数“话语”的具体指向；“言辞”与后面的评价搭配自然、庄重。
- source_word: מְכוֹעֲרִין
  choice: 丑陋的
  rationale: 保留原文“难看、可厌”的形象性，并与“美化”形成鲜明反讽。
- source_word: מְיוּפִּין
  choice: 被美化
  rationale: 保留原文的被动、使役意味，表明旁人把本来丑陋的言辞粉饰得好看。
