translation:
  language: zh_hans
  text: 你要谨慎，务必小心，不可与强暴之人同行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“因为你正与自己的倾覆同行”，或“因为你正与自己的跌倒同行。”希伯来文本则作：“不可与强暴之人同行。”
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: 你要谨慎
  rationale: 该词为 שמר 的尼法勒命令式，含有自守、警醒之意。“你要谨慎”在现代汉语中自然地表达对自身保持戒备。
- source_word: וֶהְיֵה זָהִיר
  choice: 务必小心
  rationale: זָהִיר 表示小心、审慎。希腊平行文本的 σφοδρῶς 带有加强语气；“务必”既体现强烈告诫，也保持庄重自然。
- source_word: וְאַל תִּתְהַלֵּךְ עִם
  choice: 不可与……同行
  rationale: הלך 的希特帕勒形式可指行走、往来或行事；“与……同行”保留行走意象，同时自然包含结伴交往之意。
- source_word: אַנְשֵׁי חָמָס
  choice: 强暴之人
  rationale: חָמָס 可指暴力、强暴及不义侵害。“强暴之人”保留原文具体的道德危险，又不把意义缩窄为单纯身体暴力。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在后半句存在显著差异
  choice: 依现存希伯来文本译作“不可与强暴之人同行”
  alternative: 希腊文本可译作“因为你正与自己的倾覆同行”或“因为你正走向自己的败亡”
  rationale: 本节有可靠的现存希伯来见证，且其训诫语义连贯，应作为正文依据。希腊异文不取代希伯来正文，但需以脚注保存，以呈现真实的文本差异。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“谨慎／小心”保留原文并列告诫；“同行”兼具实际行走与结伴交往的含义。脚注标记置于整句之后，说明后半句的希腊异文。
