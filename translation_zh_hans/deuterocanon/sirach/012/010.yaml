  text: Do not trust an enemy forever, for as bronze rusts, so does his evil.
translation:
  language: zh_hans
  text: 永远不要信任仇敌，因为正如铜会锈蚀，他的恶也会如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּאֲמִין
  choice: 不要信任
  rationale: 直接表达希伯来语的否定命令；“信任”比“相信”更切合对仇敌不可交托信赖的语境。
- source_word: בְּשׂוֹנֵא
  choice: 仇敌
  rationale: שׂוֹנֵא 字面为“恨你的人”，在本句中指敌对者；译作“仇敌”简洁而符合智慧文学语体。
- source_word: לָעַד
  choice: 永远
  rationale: 保留希伯来语时间副词的字面力度及其可能形成的警戒性夸张，不擅自释为“即使已经和好”等具体情境。
- source_word: כנחשת ... יחליא
  choice: 如铜锈蚀
  rationale: נחשת 是铜或青铜；动词形式和抄本措辞较难，但希腊平行文本明确以铜生锈作比。中文用“锈蚀”自然呈现腐蚀意象，同时不额外展开金属学解释。
- source_word: רועו
  choice: 他的恶
  rationale: 保留 רֹעַ 所指的恶性、邪恶，不将其弱化为单纯的“恶意”或“坏脾气”。
theological_decisions:
- issue: 对“永远不要信任仇敌”的绝对表述是否加以缓和
  choice: 保留绝对形式“永远不要信任仇敌”
  alternative: 不要轻易信任仇敌／即使和好，也不要信任仇敌
  rationale: 原文以 לָעַד 表达“永远”，且未明说和好或悔改等条件。译文保留智慧箴言本身的张力，不以系统性教义或解释性补语限制其范围。
- issue: 末句的主语关系
  choice: 译为“他的恶如铜锈蚀”
  alternative: 铜怎样锈蚀，他的恶也怎样显露／恶化
  rationale: 希伯来文本次句较为凝缩且有文本困难；希腊平行文本支持“如铜生锈，他的恶也如此”的比喻。采用紧凑中文，保留比喻关系而避免过度确定恶是“显露”还是“恶化”。
translation_notes:
  register: 采用现代、凝练、庄重的智慧文学语体。句式保持箴言式警告的力度；不添加原文没有的和解、悔改或防范细节。
