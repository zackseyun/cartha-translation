  text: If you do good, know to whom you do good, and there will be hope for your kindness.
translation:
  language: zh_hans
  text: 你若行善，要知道是向谁行善；这样，你的善行就有指望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这样，你的福祉就有指望。”依希腊文也可较明确地译作：“你的善行会得到感谢。”
    reason: 希伯来语末句可理解为善行带来可期待的结果，也可指行善者的福祉；希腊平行文本则使用“恩惠／感谢”，并以复数“你的善事”为对象。
lexical_decisions:
- source_word: אִם תֵּטִיב
  choice: 你若行善
  rationale: אִם表示条件，译作“若”；היטיב在此指向人行好、使人受益，“行善”既贴近希伯来语，也符合现代汉语智慧文学的表达。
- source_word: תֵּדַע לְמִי תֵטִיב
  choice: 要知道是向谁行善
  rationale: תֵּדַע在语境中带劝诫意味，译为“要知道”；לְמִי标明善行的对象，译作“向谁”。重复“行善”保留原文的修辞呼应。
- source_word: וִיהִי
  choice: 这样……才有
  rationale: 该形式可带祈愿色彩，也可表达随之而来的结果；此处采用结果性的汉语结构，同时不把结果说成无条件保证。
- source_word: תִקְוָה
  choice: 指望
  rationale: 该词意为“希望、期待”。“有指望”在此比“有希望给……”更自然，也保留对良好结果的期待。
- source_word: לְטוֹבָתָךְ
  choice: 你的善行
  rationale: טוֹבָה可指善、美善、益处或福祉。结合前文重复的“行善”及希腊平行文本所说“你的善事”，正文采用“你的善行”，但以脚注保留“你的福祉”和“感谢你的善行”等可能理解。
theological_decisions:
- issue: 末句 לְטוֹבָתָךְ 与希腊平行文本 καὶ ἔσται χάρις τοῖς ἀγαθοῖς σου 的关系
  choice: 这样，你的善行才有指望
  alternative: “这样，你的福祉才有指望”；或依希腊文较明确地译为“你的善行会得到感谢”
  rationale: 希伯来文本身可指善行，也可能指行善者的福祉；希腊文本则偏向善行得到恩惠、认可或感谢。正文以较宽泛的“善行才有指望”保留预期善果的含义，不明确限定为物质回报或人的感谢，并在脚注中呈现主要异读。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“向谁行善”保留原文对受惠对象的强调；分号呈现条件劝告与结果之间的关系。
