  text: A friend is not known in prosperity[a], and an enemy is not hidden in adversity.
translation:
  language: zh_hans
  text: 在顺境中，朋友认不出来；在逆境中，仇敌藏不住。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“在好景况中，朋友不被认出；在坏景况中，仇敌不被隐藏。”希腊文平行文本的上半句不同，大意为“朋友在福乐中不会得到申雪（或：报应）”。这里以现存希伯来文为主；其上下两句构成“认出／隐藏”与“顺境／逆境”的对照。
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב
  choice: 朋友
  rationale: 该分词字面指“爱的人”，在智慧文学的人际语境中表示以友爱相待的人；希腊文 φίλος 也支持“朋友”。
- source_word: לֹא יִוָּדַע
  choice: 看不出
  rationale: ידע 的尼法勒式可表示“被认识、被辨认”。现代汉语“看不出谁是朋友”自然表达顺境不能显明真朋友之意，同时保留与下句“藏不住”的显露对比。
- source_word: בַּטּוֹבָה
  choice: 顺境中
  rationale: 字面为“在好处／福乐中”，此处指有利、亨通的处境，与 רָעָה 构成箴言式对照。
- source_word: וְלֹא יְכֻסֶּה
  choice: 也藏不住
  rationale: כסה 的被动式意为“被遮盖、被隐藏”；采用自然的现代汉语，表达逆境会使敌意暴露。
- source_word: בְרָעָה
  choice: 逆境中
  rationale: 此处 רעה 指祸患或不利处境，并非道德意义的“邪恶”；“逆境”与“顺境”形成清楚而庄重的对偶。
- source_word: שׂוֹנֵא
  choice: 仇敌
  rationale: 该分词字面为“恨的人”，在此指怀有敌意者；希腊文 ἐχθρός 同样支持“敌人／仇敌”的关系含义。
