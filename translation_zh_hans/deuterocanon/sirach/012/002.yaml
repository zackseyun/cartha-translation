  text: Do good to the righteous[a], and you will find repayment—if not from him, then from Yahweh.
translation:
  language: zh_hans
  text: 你要善待义人，必得报偿；若不是从他那里，便是从耶和华那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“若不是从他那里，而是从至高者那里。”希伯来文作“从耶和华那里”。
    reason: textual_variant
lexical_decisions:
- source_word: הֵיטִב
  choice: 善待
  rationale: 这是 יטב 的使役命令式，在此指主动向人行善、施惠。“善待”在现代汉语中自然直接，也与希腊文 εὖ ποίησον 相符。
- source_word: לַצַּדִּיק
  choice: 义人
  rationale: 希伯来文指公义、正直的人；“义人”准确保留其伦理和宗教意味，又是普通读者熟悉的圣经用语。希腊文 εὐσεβεῖ 较偏向“敬虔的人”，但不取代现存希伯来文。
- source_word: תִּמְצָא תַשְׁלוּמַת
  choice: 就会得到回报
  rationale: תִּמְצָא 字面为“找到”，תַשְׁלוּמַת 指偿还、报偿。汉语若直译“找到偿还”不自然，因此用“得到回报”传达原文结果，同时保留互惠、报偿的含义。
- source_word: אִם לֹא מִמֶּנוּ
  choice: 即使不是从他那里
  rationale: 保留原文条件表达及阳性单数代词；这里的“他”回指前面的“义人”，不改成复数或中性说法。
- source_word: מֵיְהֹוָה
  choice: 从耶和华那里
  rationale: 主文本依从现存希伯来文的神名 יהוה，以现代中文常见的专名“耶和华”表达；希腊文异读“至高者”列入脚注。
theological_decisions:
- issue: 末句的神圣称号在希伯来文与希腊文见证中不同
  choice: 从耶和华那里
  alternative: 从至高者那里
  rationale: 本节有高可信度的希伯来文见证，故正文依 מֵיְהֹוָה；希腊文 παρὰ Ὑψίστου 是有意义的异文，不予调和，收入脚注。
- issue: 受惠者的单数阳性指代
  choice: 从他那里
  alternative: 从那人那里
  rationale: 希伯来文阳性单数后缀与希腊文单数 αὐτοῦ 一致，均回指“义人”；正文保留单数人称指代。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“善待义人”简洁有力；后半句以“即使……也……”自然呈现原文的条件关系。脚注标记置于实际存在异文的“耶和华”分句之后。
