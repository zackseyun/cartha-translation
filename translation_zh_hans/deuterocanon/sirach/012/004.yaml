review_pass:
  verdict: revise
  source_fidelity: 正文采用希伯来文本的第二人称分析是可成立的：תַּשִּׂיג 和 תַּגִּיעַ 的书写形式均容许第二人称阳性单数的理解。原译基本传达了“在困苦时遭遇双倍祸患、却把好处带给他”的对照。不过，“你所给的”略将原文的使役含义预先具体化；改为“你会把……带给他”更贴近原文，同时仍是自然汉语。
  naturalness: “在困苦之时”比倒装的“困苦之时”更符合现代书面普通话。“每一件好处都带给他”清楚表达בכל的逐项/全面意味，也避免“好处送到他那里”中无生命主语“好处”自行移动的轻微别扭。
  terminology: “祸患”“困苦”“好处”适合智慧文学的庄重警戒语体。脚注保留“敬虔的人”“罪人”，准确对应希腊文εὐσεβής与ἁμαρτωλός，且不以希腊平行文本取代此处完整的希伯来正文。
  issues:
  - severity: low
    issue: “你所给的”比希伯来文稍具体。
    rationale: בְּכָל טוֹבָה תַּגִּיעַ אֵלָיו可按使役式理解为“你会使每一件好处到达他那里”，但原文没有独立的“所给的”关系结构。
  - severity: medium
    issue: 脚注对人称歧义的替代译文未充分呈现第二句同样可能作第三人称阴性。
    rationale: תַּשִּׂיג与תַּגִּיעַ均可在无辅音差别的情况下按第三人称阴性分析；应说明该读法会使“祸患”成为两动词的主语，并承认首句受词在希伯来文中未明说。
  revised_text: 在困苦之时，你会遭遇双倍的祸患；你会把每一件好处都带给他。[a]
  revised_footnotes:
