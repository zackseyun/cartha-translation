  text: Give to the godly, and do not support the sinner.[a]
translation:
  language: zh_hans
  text: 在困苦之时，你会遭遇双倍的祸患；你会把每一件好处都带给他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文两个动词的形式也可按第三人称阴性理解，使“祸患”成为主语，意为：“在困苦之时，双倍的祸患会追上（他）；它会随着每一件好事临到他。”首句的受词在希伯来文中未明说。希腊文本则作：“要周济敬虔的人，不要扶助罪人。”
    reason: 希伯来语动词形式容许第二人称阳性单数或第三人称阴性单数的分析；此外，本节希伯来传统与希腊传统内容显著不同，须以脚注向读者说明。
lexical_decisions:
- source_word: פִּי שְׁנַיִם
  choice: 双倍
  rationale: 这是希伯来语表示倍数的惯用说法，意为“两倍、加倍”。
- source_word: רָעָה תַּשִּׂיג
  choice: 你会遭遇……祸患
  rationale: 将 תַּשִּׂיג 理解为第二人称阳性单数“你会得到／遭遇”，רָעָה 为其宾语；在上下文中指帮助恶人者反受其害。该形式也可能被读作第三人称阴性单数，以“祸患”为主语。
- source_word: בְּעֵת צֹרֶךְ
  choice: 困苦之时
  rationale: צֹרֶךְ 在此指窘迫、危难或有需要的处境；“困苦之时”保留其范围，不限定具体情境。
- source_word: בְּכָל טוֹבָה תַּגִּיעַ אֵלָיו
  choice: 你所给的一切好处，却都会送到他那里
  rationale: 直译近于“你会使一切好处到达他那里”；结合施惠的语境，以自然汉语表达使役含义，并保留 אֵלָיו“到他那里”的指向。
theological_decisions:
- issue: 本节希伯来文本与希腊平行文本的显著差异
  choice: 正文依所给高可信度希伯来文本翻译，呈现施惠者遭祸、好处却归于对方的警告
  alternative: 依希腊文译作“要周济敬虔的人，不要扶助罪人”
  rationale: 任务要求以原文证据为先；所给希伯来文本完整且标为高可信度，因此不以希腊文及英文咨询层取代正文，但用脚注如实记录异文。
- issue: תַּשִּׂיג 的人称与句法歧义
  choice: 按第二人称“你会遭遇”处理
  alternative: 按第三人称阴性“祸患会追上”处理
  rationale: 无元音字母形式允许两种分析；前后句若同以第二人称为主语，语意衔接较顺。脚注提示另一可能，避免掩盖真实歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“祸患”“困苦”保留智慧文学的警戒语气；“送到他那里”使希伯来语使役结构易于普通读者理解。
