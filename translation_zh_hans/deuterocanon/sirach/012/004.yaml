review_pass:
  verdict: revise
  source_fidelity: 草稿虽然以希伯来文本为正文依据，并注意到与希腊文本的重大差异，但把两个未明示宾语／主语的人称形式确定译为“你”，又在后半句加入“你所给”“送到”的使役施惠关系，超出希伯来文本可明确支持的范围。希伯来文的两个未完成式均存在第二人称阳性单数与第三人称阴性单数的形态歧义；尤其后句不宜擅自补出“你所给”。
  naturalness: 原译汉语通顺，但“你所给的一切好处，却都会送到他那里”既添加了原文没有的“所给”，也使“送到”暗示使役动作。修订以较自然而审慎的警戒性表述保留句法歧义。
  terminology: “祸患”“困苦之时”适合智慧文学的庄重语域。“好处”可保留，但应避免把它解释为施予的恩惠。希腊异文中的“敬虔的人／罪人”准确反映平行希腊文，却不应取代希伯来正文。
  issues:
  - severity: high
    issue: 正文将不确定的人称和关系定为“你……你所给……送到”。
    rationale: תַּשִּׂיג 与 תַּגִּיעַ 可按第二人称阳性单数或第三人称阴性单数分析；原文没有“给”这一动词，也没有明确的使役结构支持“送到”。该译法改变了原文保留的歧义并添加语义。
  - severity: medium
    issue: 脚注对后句的释义仍加入“你会把……送到”。
    rationale: 脚注应说明形态歧义与文本传统差异，不应以一种缺乏明示词汇依据的扩展解释作为“希伯来文本也可译作”。
  - severity: low
    issue: 正文中“却”属于较强的逻辑连接。
    rationale: 希伯来文本并无明确的转折连词；可不用“却”，让并列及上下文自行表达关系。
  revised_text: 困苦之时，双倍的祸患会临到你；一切好处都会临到他那里。[a]
  revised_footnotes:
  - marker: a
    text: 希伯来文两个动词的形式可作第二人称阳性单数，也可作第三人称阴性单数。因此，本节也可译作：“困苦之时，双倍的祸患会临到；一切好处都会临到他那里。”所传希腊文本则作：“要周济敬虔的人，不要扶助罪人。”
    reason: 保留希伯来文动词人称／主语的真实歧义，并说明本节希伯来文本与希腊文本内容显著不同。
  revision_rationale: 修订以所给希伯来文本为先。“双倍的祸患会临到你”采用可成立的第二人称理解，同时脚注完整保留第三人称阴性理解的可能；后句不再添加“所给”“送到”等原文未明说的施惠和使役意义，仅译出“好处”临到“他那里”。希腊文本作为显著异文在脚注中如实呈现，符合英文审计轨迹所反映的希腊传统，但不以其覆盖完整的希伯来底本。
