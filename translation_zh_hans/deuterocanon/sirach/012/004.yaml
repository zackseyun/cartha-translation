    reason: 希伯来语动词形式容许第二人称阳性单数或第三人称阴性单数的分析；此外，本节希伯来传统与希腊传统内容显著不同，须以脚注向读者说明。
  revision_rationale: 修订仅收紧中文表达并更完整说明可验证的希伯来语句法歧义；正文仍依完整且高可信度的希伯来文本，采用上下文较顺的第二人称读法。希腊文及英文审校轨迹所反映的“周济敬虔的人，不扶助罪人”作为显著平行异文置于脚注，避免混入正文。
