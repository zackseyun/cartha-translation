  text: For God also hates evildoers[b][a], and will repay the wicked with vengeance.
translation:
  language: zh_hans
  text: 因为上帝[a]也恨恶作恶的人[b]，必向恶人[c]施行报应。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“上帝”；希腊文作“至高者”。
    reason: textual_variant
  - marker: b
    text: 希伯来文作“作恶的人”或“恶人”；希腊文作“罪人”。
    reason: textual_variant
  - marker: c
    text: 希伯来文作“恶人”；希腊文作“不敬虔的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: 上帝
  rationale: 希伯来文 אֵל 直接指“上帝、神”。正文以高可信度的希伯来文本为先，不以希腊文较具体的神圣称号取代它。
- source_word: שֹׂנֵא
  choice: 恨恶
  rationale: 该词明确表达憎恨；“恨恶”既保留原文的强烈语气，也比日常口语“讨厌”更庄重。希伯来文分词在此自然表达恒常性质。
- source_word: רָעִים
  choice: 作恶的人
  rationale: 该词可指“恶人”或“作恶者”。译作“作恶的人”保留其主动的道德含义，并与下半句 רְשָׁעִים 的“恶人”有所区分。
- source_word: לָרְשָׁעִים
  choice: 向恶人
  rationale: רְשָׁעִים 通常指邪恶、不义的人；介词 לְ 在此标明报应所针对的对象，因此译作“向恶人”。
- source_word: יָשִׁיב נָקָם
  choice: 施行报应
  rationale: 该短语表达偿还、回报性的惩治。中文“施行报应”保留司法性和相称回报的含义，同时避免“报仇”可能带出的私人泄愤色彩。
theological_decisions:
- issue: 希伯来文与希腊文的神圣称号不同
  choice: 正文作“上帝”
  alternative: 至高者
  rationale: 希伯来文读作 אֵל（“上帝”），希腊文平行文本作 ὁ ὕψιστος（“至高者”）。正文遵循所给高可信度希伯来文本，并用脚注如实保留希腊异文。
- issue: 上帝对恶人的态度与审判
  choice: 保留“恨恶”和“施行报应”的强烈措辞
  alternative: 拒绝、惩罚
  rationale: 希伯来文和希腊文都使用强烈的憎恨与报偿用语。弱化这些词会消解经文的神学张力，因此不作缓和性释译。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“恨恶”保留原文力度；“施行报应”呈现司法性的偿还含义。两个近义人群称谓分别译为“作恶的人”和“恶人”，使希伯来文的词汇区别在中文中可见。
