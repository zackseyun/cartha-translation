base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/007.yaml
  text: Give to the good[a], and withhold from the evil; honor the poor, and do not give to a stranger.[b]
translation:
  language: zh_hans
  text: 要施与善人，却不要施助恶人[a]；要敬重贫困的人，不要给外人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文可直译为“从恶扣留”或“不要给恶人”；其中“恶”也可能指抽象的邪恶。希腊平行文本作“不要扶助罪人”。
    reason: 保留希伯来文在抽象的“恶”与人格化的“恶人”之间的歧义，并交代希腊平行文本对人格化理解的支持。
  - marker: b
    text: “外人”也可译作“陌生人”或“外国人”，泛指相关群体或适当关系圈之外的人。
    reason: 说明זָר的语义范围，避免将其无根据地限定为民族意义。
lexical_decisions:
- source_word: תֵּן לַטּוֹב
  choice: 要给善人
  rationale: תֵּן是直接的命令式“给”；לַטּוֹב字面为“给善者/好的”，希腊文τῷ ἀγαθῷ也支持以人为所指。“善人”在现代汉语中简洁自然，并保留伦理类别。
- source_word: וּמְנַע מֵרָע
  choice: 却要向恶人收回援手
  rationale: מנע的基本义是扣留、收回或不予；מֵרָע既可理解为“从恶”也可指“从恶人”。上下文与希腊平行文本“不要扶助罪人”支持人格化理解。“收回援手”兼顾希伯来文的扣留之义与希腊文的援助语境。
- source_word: הֹקֵיר מָךְ
  choice: 要尊重贫寒人
  rationale: הֹקֵיר表示看重、尊敬；מָךְ指贫穷、卑微或地位低下的人。“贫寒人”既表达经济困乏，也不完全抹去低微处境。
- source_word: וְאַל תִּתֵּן לְזֵר
  choice: 不要给外人
  rationale: 否定命令式直译为“不要给”；זָר可指陌生人、外人或外国人。“外人”保留其相对于某一群体或适当关系圈的广义，不把它限定为族裔意义的外国人。
theological_decisions:
- issue: 首句后半是泛指远离邪恶，还是禁止援助恶人/罪人
  choice: 正文采用人格化的“向恶人收回援手”
  alternative: “要远离恶事”或“不要扶助罪人”
  rationale: 希伯来文מֵרָע在形式上容许抽象的“从恶”及人格化的“从恶人”，而希腊平行文本明确作“罪人”。正文以“恶人”呈现较合语境的个人所指，同时借脚注保存希伯来文的真实歧义；不将“恶人”进一步专门化为某种教义类别。
- issue: לְזֵר所指群体的范围
  choice: 译作“外人”而不限定其民族身份
  alternative: “陌生人”或“外国人”
  rationale: 原词可泛指不属于相关群体、关系圈或身份范围的人。译作“外人”避免无文本依据地限定为外国民族，同时保留经文中的社会边界张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。以“要……却要……；要……不要……”呈现希伯来文四个命令的平行结构。“收回援手”比单说“不帮助”更贴近מנע的扣留意味，同时与希腊平行文本的扶助含义相呼应。
