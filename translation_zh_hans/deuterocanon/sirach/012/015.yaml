  text: Afterward you will understand my words[a], and for my sister you will sigh.
translation:
  language: zh_hans
  text: 后来，你会明白我的话，也会为我的姊妹[a]叹息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希伯来文艰深，尤其是译作“为我的姊妹”的短语。希腊文本则作：“他会同你相处片刻；你若偏离，他就不会坚持下去。”这反映了明显不同的文本或理解。
    reason: 说明艰深的希伯来措辞及希腊文本的重大异读。
lexical_decisions:
- source_word: וּלְאָחוֹר
  choice: 后来
  rationale: 该短语表示较后的时间点；“后来”自然简洁，又不擅自解释为“为时已晚”。
- source_word: תַּשִּׂיג
  choice: 会明白
  rationale: 该动词本义为“达到、追上”；以“我的话”为宾语时，“明白”自然表达终于领会这些话，同时保留迟后才领悟的含义。
- source_word: אֲמָרַי
  choice: 我的话
  rationale: 直接译出复数名词及第一人称后缀，符合现代汉语表达。
- source_word: וּלְאַחְוָתִי
  choice: 为我的姊妹
  rationale: 传世希伯来文本的形式最直接指向“我的姊妹”，尽管语义难解，也不据推测改写为“同伴”或“情谊”；异文问题在脚注中说明。
- source_word: תִּתְאַנָּח
  choice: 叹息
  rationale: 该词表示叹息或呻吟；“叹息”语气庄重而不过度强化为哀号。
theological_decisions:
- issue: 希伯来文本与希腊文本显著分歧
  choice: 正文依照现存希伯来文本翻译
  alternative: 依希腊文本译为：“他会同你相处片刻；你若偏离，他就不会坚持下去。”
  rationale: 《便西拉智训》有希伯来文本存世之处以其为主要依据；希腊见证的差异较大，不宜无说明地取代希伯来正文，故列入脚注。
- issue: 希伯来语“为我的姊妹”语义不明
  choice: 保留直译“为我的姊妹”
  alternative: 按推测改译为“为我的亲友”“为情谊”，或用希腊异文取代
  rationale: 原文确实艰深，且不同见证无法彼此轻易调和；保留其张力比默默修订或阐释更透明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“姊妹”较“姐妹”略具经籍语体，并能明确保留希伯来文本中的单数亲属称谓；全句不为追求顺畅而消除原文的突兀感。
