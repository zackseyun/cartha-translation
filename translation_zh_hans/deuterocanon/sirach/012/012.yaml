base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/012.yaml
  text: Be to him like one who reveals a secret[a], and he will not find a way to ruin you[b]; and know the outcome of jealousy.
translation:
  language: zh_hans
  text: 你对他要像泄露秘密的人一样[a]，这样他就找不到毁掉你的机会；你要明白嫉妒的结局[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“你对他要像一个揭露秘密的人。”希伯来文的表达简略，未明确这个比喻中的施受关系；结合上下文，可能是在劝人像防备泄密者一样谨慎防备他。
    reason: 保留希伯来语比喻在施受关系上的含混，并将语境性解释标为可能理解。
  - marker: b
    text: “嫉妒”也可译作“妒忌”。希伯来文直译为“嫉妒的末后”。希腊文在本节有较长的不同文本，警告不可让敌人靠近或坐在右边，免得他谋取你的位子，并说到人在末后才领会这番训言。
    reason: 说明关键词的可译范围，并交代希伯来文与希腊文平行见证之间的重要差异。
lexical_decisions:
- source_word: הֱיֵה לוֹ
  choice: 你对待他
  rationale: היה 与介词 ל 连用，在这里表达对某人的态度或处置方式。译作“你对待他”既符合现代汉语，也保留命令语气。
- source_word: כִּמְגַלֶּה רָז
  choice: 像对待泄露秘密的人一样
  rationale: מְגַלֶּה 是 גלה（揭开、泄露）的分词，רָז 指秘密。希伯来语比汉语更为含混；结合上下文，这个比喻劝人像防备泄密者那样谨慎对待敌人。脚注保留较直译的可能表达。
- source_word: וְלֹא יִמְצָא לְהַשְׁחִיתְךָ
  choice: 这样他就找不到毁掉你的机会
  rationale: 字面为“他就找不到毁掉你（的办法）”。“机会”是为使汉语完整自然所作的最小补足；שחת 的使役式在此指使人败坏、遭毁损，故译“毁掉”而不限定为肉体杀害。
- source_word: וְדַע
  choice: 你要明白
  rationale: 按现存希伯来文保留命令式。译作“要明白”比生硬的“要知道”更适合对后果的认识，同时不改成希腊文所呈现的将来结果句。
- source_word: אַחֲרִית
  choice: 结局
  rationale: 该词可指末后、终局或结果。“结局”简洁地保留其时间性和后果含义。
- source_word: קִנְאָה
  choice: 嫉妒
  rationale: קנאה 可指嫉妒、妒忌或热忱；在敌意和加害的语境中，“嫉妒”最贴切，但“妒忌”仍是可行译法，列于脚注。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本差异显著
  choice: 正文以现存希伯来文为准，保留其简短的命令和警告
  alternative: 依希腊文译为不要让敌人站在身旁或坐在右边，免得他夺取你的位子，并在末后才领会训言
  rationale: 本节希伯来文完整可译，应作为正文的首要依据；希腊文虽扩展了防备敌人篡位或加害的意象，却不应取代希伯来见证。脚注说明这一文本差异，避免把两种见证无声合并。
- issue: “泄露秘密的人”这一比喻的施受关系
  choice: 按上下文译为像对待泄密者那样对待他
  alternative: 较直译为“你对他要像一个泄露秘密的人”
  rationale: 希伯来语短语本身简略，较直译的汉语容易被理解为受劝者应向敌人泄密，与全段警戒敌人的语境相冲突。正文采用自然且最可能的语境义，脚注保留形式上的歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“泄露秘密的人”“找不到毁掉你的机会”“嫉妒的结局”均为普通读者易懂的表达；分号保留原文两项劝诫之间既相连又有转折推进的结构。
