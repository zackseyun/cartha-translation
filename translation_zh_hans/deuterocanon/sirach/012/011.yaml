  source_fidelity: “听从你”和“举止温顺”可分别对应希伯来文的“听从/听你的话”和“安静、柔顺地行事”。末句“留心惧怕他”意在保留 תֵּן לִבְּךָ לְהִתְיָרֵא מִמֶּנּוּ 的“留意／专心而惧怕他”，但汉语搭配略显生硬。
