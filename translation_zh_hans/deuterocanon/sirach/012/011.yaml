  text: Even if he listens to you and walks gently, give your heart to be afraid of him.[a]
translation:
  language: zh_hans
  text: 即使他听从你，举止温顺，你也要留心，对他心存惧怕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“要使你的心警醒，并要防备他”；比现存希伯来文本更明确地表达自我防护。
    reason: alternative_reading
lexical_decisions:
- source_word: ישמע לך
  choice: 听从你
  rationale: שמע 加介词 ל 可表示听某人的话，并可引申为顺从；“听从你”在现代汉语中兼顾听与服从的语义，不把姿态说得过强。
- source_word: וִיהַלֵּךְ בְּנַחַת
  choice: 举止温顺
  rationale: הלך בנחת 可指安静、从容或柔顺地行事；此处描写敌人表面低姿态的表现。“举止温顺”自然传达行为方式，也与希腊文所见的卑屈姿态相呼应。
- source_word: תֵּן לִבְּךָ
  choice: 要留心
  rationale: 字面为“把你的心放在……上”，在希伯来语中是专心留意的劝告；“留心”是简洁自然的现代汉语表达，同时没有把希腊文更明确的防卫措辞引入正文。
- source_word: לְהִתְיָרֵא מִמֶּנּוּ
  choice: 惧怕他
  rationale: 源自动词 ירא，基本义是害怕、畏惧；上下文具有警惕、防备的实际含义，但正文保留其明确的“惧怕”用词，不以希腊文的“防备”取代。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“即使……也……”清楚呈现让步关系；“留心惧怕他”略带经训式凝练感，以保留希伯来文“把心放在惧怕他这件事上”的结构和张力。
