  text: In a man's prosperity even an enemy is friendly[a], but in his adversity even a friend keeps apart.
translation:
  language: zh_hans
  text: 人在顺境中，连仇敌也显得友善[a]；但在逆境中，连朋友也会远离他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“连仇敌也成了朋友。”希伯来文 רֵעַ 可指“朋友、同伴”，也可表达友好关系；正文采用较审慎的译法，以保留这句箴言的讽刺意味，而不把表面的亲近说成真正的和好。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוֹבַת אִישׁ
  choice: 人在顺境中
  rationale: בְּטוֹבַת 指一个人处境良好、兴旺顺遂，与后半句的 רָעָה 构成鲜明对照；“人在顺境中”自然地保留了希伯来文谚语式的泛指。
- source_word: שׂוֹנֵא
  choice: 仇敌
  rationale: 该词字面指“恨他的人”，在此表示敌对关系；“仇敌”简洁庄重，也与希腊文 ἐχθροί 相符。
- source_word: רֵעַ（前半句）
  choice: 显得友善
  rationale: 此处可指朋友、同伴或友好关系。译作“显得友善”保留谚语的讽刺意味，同时避免断言仇敌已经真正成为朋友。
- source_word: וּבְרָעָתוֹ
  choice: 但在逆境中
  rationale: רָעָה 在此指不幸或困境，而非道德上的邪恶；“逆境”与“顺境”对称。连接词 וּ 在对照结构中自然译为“但”。
- source_word: רֵעַ（后半句）
  choice: 朋友
  rationale: 后半句明确指原有的朋友，与前半句的“仇敌”形成关系上的反转。
- source_word: בּוֹדֵד
  choice: 躲得远远的
  rationale: 该词表达独处、分离或保持距离；结合朋友在他人逆境中的反应，这一译法自然表现其疏远、回避，同时不增添彻底断交的含义。
