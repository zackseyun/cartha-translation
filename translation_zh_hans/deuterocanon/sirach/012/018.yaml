translation:
  language: zh_hans
  text: 他不会离去，直到火在他里面燃烧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“他会摇头拍手，低声说许多话，并变换脸色。”这一较完整的措辞，可能是在解释希伯来文简短描述的敌对行为。
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַעֲבֹר
  choice: 他不会离去
  rationale: עבר常指“经过、离去、继续前行”。本句着重敌意持续不止；译作“不会离去”比直译“不会经过”更符合现代汉语，同时不增添原文没有的对象。
- source_word: עַד
  choice: 直到
  rationale: 表示前一行动持续到后一情形发生为止。
- source_word: תִּבְעַר
  choice: 燃起
  rationale: 该未完成式在这里最自然地表达火开始或持续燃烧；以“火”为主语，避免把词形明确改释为“他点燃”。
- source_word: בּוֹ
  choice: 在他里面
  rationale: 保留介词ב与第三人称阳性单数后缀最直接的空间性表达，也保留“他”究竟指敌人自身还是受害者的语境歧义。
- source_word: אֵשׁ
  choice: 有火
  rationale: 希伯来文无定冠词；汉语用“有火……燃起”自然表达不定的“火”，并保留其可能的比喻意味。
theological_decisions:
- issue: 现存希伯来文与较完整的希腊文平行文本差异显著
  choice: 正文依照现存希伯来文，脚注收录希腊文异读
  alternative: 依希腊文译为“他会摇头拍手，低声说许多话，并改变脸色”
  rationale: 现存希伯来文虽简短且含义略显隐晦，仍应作为正文的首要依据；希腊文可能反映扩充的底本或解释性发展，故以脚注保留，避免将两种传统无声混合。
- issue: “在他里面”的指代与“火”的性质
  choice: 维持原文歧义，不解释为特定人物内心的怒火或针对受害者的祸患
  alternative: 译为“直到在他心里燃起怒火”或“直到向他点起祸火”
  rationale: 希伯来文没有明说“怒火”“心里”或“祸患”，代词所指也不完全明确；正文不应替读者消解这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不会离去”传达持续纠缠的语气；“有火在他里面燃起”刻意保留希伯来文的简约、意象及代词歧义。脚注标记已在正文中列出。
