base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/005.yaml
  text: Do not give him your bread[b][a], lest by it he set himself against you.
translation:
  language: zh_hans
  text: 不要把食物给他[a]，免得他借此与你为敌[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”：希伯来语字面近似“饼的器具／饼食之物”，原文措辞疑难；希腊语平行文本支持“饼”或“食物”的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“免得他借这些辖制你。”希腊语平行文本更强烈地表达“取得权势、辖制”的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלֵי לָחֶם
  choice: 食物
  rationale: 该希伯来语短语字面近似“饼的器具／饼食之物”，措辞疑难；希腊语平行文本的“饼食”支持按食物或口粮理解。“食物”在现代汉语中自然，也保留了实际供给的含义。
- source_word: אַל תִּתֵּן לוֹ
  choice: 不要把……给他
  rationale: 准确表达希伯来语的直接禁令，并采用自然的现代汉语句式。
- source_word: לָמָּה
  choice: 免得
  rationale: 此词通常意为“为什么”，但传本文句法生硬；希腊语平行文本用ἵνα μὴ明确表达警戒性的结果。“免得”最能传达此处语势，同时以脚注说明文本问题。
- source_word: בָם
  choice: 借此
  rationale: 希伯来语为复数“借着它们”，与前面的疑难复数短语呼应；中文主译采用集合意义的“食物”，故以“借此”自然承接。
- source_word: יַקְבִּיל אֵלֶיךָ
  choice: 与你为敌
  rationale: 希伯来语主要表达迎面相对、敌对或对抗；“与你为敌”保留敌对关系，又不像希腊语“辖制”那样明确强化为支配。
theological_decisions:
- issue: 疑难希伯来语句与希腊语平行文本的取舍
  choice: 以现存希伯来语为主，用希腊语澄清警戒语气，但不把末句完全强化为“辖制你”。
  alternative: 偏向希腊语译作：“要扣住他的食物，不要给他，免得他借此辖制你。”
  rationale: 希伯来语见证虽有轻微错位且句法困难，仍应居首；希腊语可证明此处意在警告赠食会使恶人取得敌对优势。主文保留希伯来语较宽的敌对含义，脚注呈现希腊语较强的理解。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“食物”避免晦涩的字面直译；“与你为敌”保留希伯来语的开放程度，较强的希腊语读法放入脚注。
