  text: So is one who associates with a man of insolence and rolls about in his sins.[a]
translation:
  language: zh_hans
  text: 同样，和狂傲之人结交、在他的罪孽中翻滚的人，也是如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证在这里有显著不同：“若有祸患临到你，你会发现他已先你在那里；他佯装帮助你，却要绊倒你的脚跟。”开罗藏经库保存的希伯来文则说，与狂傲之人结交，并在他的罪孽中翻滚。
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: 同样
  rationale: 承接上文作类比或应用，保留格言式的简洁语气。
- source_word: חוֹבֵר אֶל
  choice: 与……结交的
  rationale: חבר 表示联合、交往；采用现代汉语自然表达，不把关系强化为亲密友谊。
- source_word: אִישׁ זָדוֹן
  choice: 狂傲的人
  rationale: זָדוֹן 指带有骄傲、僭越意味的恶行或品性；“狂傲”兼顾傲慢与放肆的道德色彩。
- source_word: וּמִתְגֹלֵל
  choice: 也……翻滚
  rationale: 保留 גלל 反身形态所呈现的滚动意象，不径直解释成“参与”或“陷入”。
- source_word: בַּעֲוֹנֹתָיו
  choice: 在他的罪孽中
  rationale: עָוֹן 在此可指罪、罪孽或罪责；“罪孽”庄重而易懂。第三人称后缀按最自然的句法理解，指狂傲之人的罪孽，同时不扩写其具体关系。
theological_decisions:
- issue: 希伯来文与希腊文见证显著不同
  choice: 正文以现存开罗藏经库希伯来文为依据，并在脚注列出希腊文异读。
  alternative: 希腊文作：“若有祸患临到你，你会发现他已经先你到了那里；他佯装帮助你，却要绊倒你的脚跟。”
  rationale: 此处希伯来文尚存且可信度高，应作为正文基础；希腊文并非轻微措辞差别，而是内容显著不同，故须保存于脚注，以如实呈现文本传统的张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“翻滚”有意保留希伯来文的具体意象，虽略显突兀，却避免把原文解释性地改写为“沉溺”“卷入”或“同流合污”。
