  terminology: “狂傲之人”恰当地表达זָדוֹן所含傲慢、放肆、僭越的意味；“罪孽”可译עֲוֹנוֹת，且“他的”保留后缀可能指向狂傲之人的歧义/自然指向。“翻滚”保留מתגלל的滚动意象，适合本句庄重而不作过度诠释的文体。
