  text: No good comes to one who persists in wickedness[b][a], nor to one who does not show mercy.
translation:
  language: zh_hans
  text: 执意行恶[b]的人得不着益处；不施怜悯[a]的人也得不着益处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“不行公义（或义行）”；希腊语平行文本则作“不施舍（或不施怜悯）”。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语措辞艰深；希腊语平行文本支持“持续、执意行恶”的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹבָה
  choice: 得不着益处
  rationale: 希伯来语直译为“没有好处/益处”；此处采用自然的汉语谓语表达，同时保留其否定判断。希腊语 οὐκ ἔστιν ἀγαθὰ 也支持“没有益处”的基本含义。
- source_word: לִמְנֹחַ רָשָׁע
  choice: 执意行恶的人
  rationale: 希伯来语措辞艰深，若机械理解 לִמְנֹחַ，可有“安歇、安顿”之意；希腊语平行文本 τῷ ἐνδελεχίζοντι εἰς κακά 明确支持“持续作恶”。“执意行恶”既表达持续性，也不掩盖文本疑难，故附注说明。
- source_word: וְגַם
  choice: 也一样
  rationale: 原文为递加连接“并且也”；汉语用“也一样”自然地把第二类人纳入同一否定判断。
- source_word: צְדָקָה
  choice: 怜悯
  rationale: 该词通常可指“公义、义行”，在后期希伯来语中也可指慈善施舍；希腊语平行文本以 ἐλεημοσύνη（施舍、怜悯）对应，因此正文取“怜悯”，脚注保留希伯来语的字面可能。
- source_word: לֹא עָשָׂה
  choice: 不施
  rationale: 希伯来语字面为“不行/没有行”；与“怜悯”搭配时，“施怜悯”是简洁、自然且庄重的现代汉语表达，也与希腊语“不施予”相合。
theological_decisions:
- issue: צְדָקָה 在本节是“公义”还是慈善性的“怜悯/施舍”
  choice: 正文译作“怜悯”
  alternative: “公义”“义行”或“施舍”
  rationale: 希伯来语本身允许“公义/义行”，但希腊语古译明确指向慈善施予。为体现本段具体的伦理行为而不引入抽象教义范畴，正文采用“怜悯”，并在脚注保存希伯来语的字面张力。
- issue: לִמְנֹחַ רָשָׁע 的疑难含义
  choice: 依希腊语佐证译为“执意行恶的人”
  alternative: “安于邪恶的人”或按字面作“恶人安歇”
  rationale: 现存希伯来语组合语义不顺，不能假装其含义毫无疑问；希腊语见证支持持续、坚持作恶的理解，因此正文采用这一较可能的意义，脚注明示疑难。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“得不着益处”比生硬的“没有好处给……”更符合汉语表达；分号呈现两类人的平行关系。脚注标记均紧随相关措辞。
