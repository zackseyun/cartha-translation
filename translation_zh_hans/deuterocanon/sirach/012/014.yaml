  yaml_path: translation/deuterocanon/sirach/012/014.yaml
  text: Do not seat him at your right hand[a], lest he seek your seat.
translation:
  language: zh_hans
  text: 不要让他坐在你的右边[a]，免得他谋求你的座位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你的右边”也可译作“在你的右手边”，这里可能暗含亲近或尊荣的位置；“你的座位”也可指你的位置或地位。
    reason: 说明方位短语的社会含义及“座位”的语义范围，同时保留原文意象。
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: 用现代汉语常见的禁止式，准确表达希伯来语的否定命令。
- source_word: תּוֹשִׁיבֵהוּ
  choice: 让他坐
  rationale: 保留使役含义，即安排或准许某人就座；比单说“他坐”更贴近原文。
- source_word: לִימִינֶךָ
  choice: 在你的右边
  rationale: 直译右侧的位置，同时可自然承载亲近和尊荣位置的语用含义，不在正文中过度解释。
- source_word: לָמָּה
  choice: 免得
  rationale: 该词字面通常可作“为什么”，但在此警戒句中连接应当避免的后果；译作“免得”使现代汉语通顺，同时保留告诫语气。
- source_word: יְבַקֵּשׁ
  choice: 谋求
  rationale: בקש 可指寻求或设法取得；此处对象是对方的座位或地位，“谋求”能表达主动企图取得之意。
- source_word: מוֹשָׁבֶךָ
  choice: 你的座位
  rationale: 保留与前半句就座意象的词语呼应；“座位”在语境中也可暗指一个人的位置或地位。
theological_decisions:
- issue: 希伯来文本与句法不同的希腊平行文本之间的关系
  choice: 以现存且可信度高的希伯来文本为正文依据，译出不要给予危险人物亲近位置的警告。
  alternative: 依希腊平行文本扩译为与罪人同行并沾染其罪恶的普遍警戒。
  rationale: 希伯来文本在本节完整明确，应居首位；希腊文本可作主题一致性参照，却不应取代其具体的座位意象。
- issue: “座位”是否应直接解释为权位或身份
  choice: 正文保留具体的“座位”，脚注说明也可暗指位置或地位。
  alternative: 正文译作“地位”或“位置”。
  rationale: 具体意象和社会地位的含义在原文中并存；保留“座位”可避免把隐含意义固定为单一解释。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“不要……免得……”呈现智慧训诫的警告结构；正文不明说“尊位”或“夺位”，以保存希伯来文的具体意象与含义张力。
