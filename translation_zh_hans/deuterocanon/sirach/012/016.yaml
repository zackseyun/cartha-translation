base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/016.yaml
  text: Who will pity a snake charmer who is bitten[b][a], or anyone who goes near a beast of prey?
translation:
  language: zh_hans
  text: 弄蛇的人被咬，谁会怜悯他？[b]同样，靠近猛兽的人，又有谁会怜悯呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“有牙的兽”，指危险的食肉猛兽。
    reason: lexical_alternative
  - marker: b
    text: 斯威特本的希腊文平行文本在此差异很大，内容是：仇敌嘴上说甜言蜜语，心里却图谋把你推入坑中；他眼中流泪，一有机会，便不会因血而满足。由于本节有希伯来文存世，而《便西拉智训》凡有存世希伯来文之处以其为主要见证，正文据希伯来文翻译。
    reason: textual_variant
lexical_decisions:
- source_word: מִי יוּחַן
  choice: 谁会怜悯他
  rationale: מִי引出反问；יוּחַן源于חנן，在此表示蒙怜悯或同情。译作“谁会怜悯他”自然地保留箴言式反问的语气。
- source_word: חוֹבֵר נָשׁוּךְ
  choice: 弄蛇的人被咬
  rationale: חוֹבֵר指施行咒术、驯弄蛇类的人；נָשׁוּךְ是“被咬”的被动分词。中文用主谓结构简明表达其所受的可预见伤害。
- source_word: וְכָל הַקָּרֵב
  choice: 同样，靠近……的人
  rationale: 原文以וְ连接平行事例，כָל הַקָּרֵב指凡接近者。以“同样”显明类比关系，并用“……的人”形成自然现代汉语。
- source_word: אֶל חַיַּת שֵׁן
  choice: 靠近猛兽
  rationale: 字面为“有牙的兽”，在语境中指危险的食肉猛兽。“猛兽”简洁传达惯用含义，而脚注保留字面形象。
