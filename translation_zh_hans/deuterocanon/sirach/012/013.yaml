  yaml_path: translation/deuterocanon/sirach/012/013.yaml
  text: Do not set him beside you[a], lest he push you aside and stand in your place.
translation:
  language: zh_hans
  text: 不要把他安置在你身旁[a]，免得他把你挤开，站在你的位置上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“谁会怜悯被蛇咬的弄蛇人，以及一切接近野兽的人？”希腊文见证在此反映了一个内容大不相同的异文。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲמִידֵהוּ
  choice: 不要让他站
  rationale: עמד的使役式表示使某人站立或安置某人；“让他站”既保留使役含义，也符合现代汉语表达。
- source_word: אֶצְלֶךָ
  choice: 在你身旁
  rationale: אצל表示近旁、身边；此处保留空间意象，也可自然承载亲近或地位上的含义。
- source_word: לָמָּה
  choice: 免得
  rationale: 该词通常意为“为什么”，但在此警戒句中引出应当避免的后果；“免得”自然传达这一语用功能。
- source_word: יֶהְדָּפְךָ
  choice: 他把你挤开
  rationale: הדף意为推、撞开或逐走；结合后句的取代意象，“挤开”同时保留动作感和位置被夺的含义。
- source_word: וְיַעֲמֹד תַּחְתֶּיךָ
  choice: 站到你的位置上
  rationale: 字面涉及“站立”与“在你之下／代替你”；在本语境中指对方把人排挤后占据其位置。译文保留“站”的意象，同时表达替代关系。
theological_decisions:
- issue: 希伯来文与希腊文见证在本节内容迥异
  choice: 正文依据现存希伯来文翻译，并在脚注列出希腊文异文
  alternative: 以希腊文“谁会怜悯被蛇咬的弄蛇人，以及一切接近野兽的人？”作为正文
  rationale: 本节有可信度高的希伯来文见证，故以其为正文基础；希腊文反映明显不同的传承，不宜无声地调和或取代希伯来文，但应完整提示读者。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“站到你的位置上”保留希伯来文的站立意象，并清楚表达被排挤、取代的警告。
