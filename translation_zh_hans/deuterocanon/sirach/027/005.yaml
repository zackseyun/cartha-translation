  text: A potter’s vessels are tested by the kiln[a], and likewise a man by his reasoning.
translation:
  language: zh_hans
  text: 陶匠的器皿由窑炉检验；同样，一个人也借着自己的思量[a]显露出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “思量”也可译作“思想”“推理”或“盘算”；希腊文平行文本作“在他的思量中”。
    reason: 保留 חֶשְׁבּוֹן 及希腊文 διαλογισμός 的词义范围，并说明第二分句可能的结构理解。
lexical_decisions:
- source_word: כְּלֵי יוֹצֵר
  choice: 陶匠的器皿
  rationale: 保留希伯来语“器皿”的复数和“陶匠”的具体意象；表达自然庄重。
- source_word: לְבָעֵר כִּבְשָׁן
  choice: 由窑炉检验
  rationale: 希伯来文措辞简缩，希腊平行文本明确说窑炉检验陶器；用被动结构传达烧窑显验器皿品质之意。
- source_word: וְכָמֹהוּ
  choice: 同样
  rationale: 简洁呈现前后两分句之间的类比关系。
- source_word: אִישׁ
  choice: 人
  rationale: 这里是代表性单数，泛指一个人；现代汉语“人”无需标示语法性别，也未改变原文所指。
- source_word: עַל חֶשְׁבּוֹנוֹ
  choice: 由他的思量显明
  rationale: חֶשְׁבּוֹן可指思考、盘算或推理，希腊文ἐν διαλογισμῷ αὐτοῦ也支持“思量、思虑”。补出“显明”以完整表达类比中“受检验”的省略谓语，同时保留其具体如何显验的张力。
theological_decisions:
- issue: 人的内在思量如何构成检验
  choice: 由他的思量显明
  alternative: 在他的思量中受检验／由他的推理检验
  rationale: 原文的第二分句省略谓语，并可能表示人的品质借其思量受到检验或显露。译文不把它扩展成特定道德或教义判断，只补足汉语所需的类比关系。
- issue: 代表性阳性单数
  choice: 人
  alternative: 一个男人
  rationale: 希伯来语אִישׁ为阳性单数，但在本句中作一般性的人类指称；汉语“人”自然涵盖此用法，不需人为强化生理性别。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。分号保留两分句的平衡；“显明”补足汉语表达，但脚注保留原文在“由思量受检验”与“在思量中显露”之间的含混。
