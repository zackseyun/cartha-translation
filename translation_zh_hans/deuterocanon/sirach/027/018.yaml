  yaml_path: translation/deuterocanon/sirach/027/018.yaml
  text: For just as a man has destroyed his enemy[a], so you have destroyed the friendship of your neighbor;
translation:
  language: zh_hans
  text: 正如一个人毁灭了自己的仇敌一样，你也毁掉了邻舍的友谊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “邻舍的友谊”也可译作“与邻舍之间的友谊”。希腊语属格τοῦ πλησίον既可指邻舍所拥有的友谊，也可指与邻舍之间的友谊。
    reason: 保留希腊语属格结构的真实歧义。
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: 因为……怎样
  rationale: 兼顾γὰρ的解释、承接作用和καθώς引出的比较结构；现代汉语用“因为……怎样”自然连接上下文。
- source_word: ἀπώλεσεν / ἀπώλεσας
  choice: 毁掉了
  rationale: 两处采用同一强烈动词，保留原文重复和彻底破坏的力度，不弱化为“损害”或“疏远”。
- source_word: ἄνθρωπος
  choice: 一个人
  rationale: 此处是智慧格言中的泛指单数；汉语“一个人”自然涵盖一般人，不必以性别化表达承载希腊语的语法形式。
- source_word: τὸν ἐχθρὸν αὐτοῦ
  choice: 自己的仇敌
  rationale: “仇敌”准确表达ἐχθρός，并与后半句的“友情”形成鲜明对照；“自己的”清楚表达αὐτοῦ的所属关系。
- source_word: οὕτως
  choice: 也照样
  rationale: 明确承接前半句的类比，同时以“也”突出对受话者的直接指责。
- source_word: τὴν φιλίαν τοῦ πλησίον
  choice: 与邻舍的友情
  rationale: 将属格理解为涉及邻舍的友情关系，符合汉语习惯；同时以脚注保留“邻舍所拥有的友情”这一属格可能性。
- source_word: πλησίον
  choice: 邻舍
  rationale: 在犹太—希腊伦理语境中，这是传统而清楚的对应词，指与人有伦理关系的近人，而不只指住处相邻者。
theological_decisions:
- issue: 格言中ἄνθρωπος的性别表达
  choice: 一个人
  alternative: 一个男人
  rationale: 原文重点是泛指的人，而非男性身份。现代汉语“一个人”忠实保留泛指功能，不额外突出性别。
- issue: 关系破坏的严重程度
  choice: 毁掉了与邻舍的友情
  alternative: 破坏了与邻舍的友情
  rationale: 重复的ἀπόλλυμι语气强烈，并把友情的丧失与仇敌的毁灭并列；“毁掉”更能保留这种修辞力度。
- issue: τοῦ πλησίον的属格歧义
  choice: 与邻舍的友情
  alternative: 邻舍的友情
  rationale: 希腊语属格既可表示属于邻舍的友情，也可表示涉及邻舍的友情。正文采用较自然的关系性表达，脚注明示另一种读法，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“仇敌”“邻舍”保留经书语域，“毁掉了”则保持直接有力。脚注标记已在正文相应位置出现。
