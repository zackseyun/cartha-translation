  naturalness: “正如一个人毁灭了自己的仇敌一样，你也毁掉了邻舍的友谊”符合现代标准汉语，也保有智慧文学所需的庄重、直接语气。“毁灭”用于仇敌更贴合ἀπώλεσεν的强烈意义；对友谊用“毁掉”则自然并保留重复动词所造成的修辞对应。
  terminology: “仇敌”“邻舍”“友谊”均合适。“邻舍的友谊”在正文中较贴近希腊语属格表达；脚注说明它可指邻舍所拥有的友谊，或与邻舍之间的友谊，避免把有争议的属格功能定死。
