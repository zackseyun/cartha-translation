  text: I have hated many things, but I have not become like him; and the Lord will hate him.
translation:
  language: zh_hans
  text: 我憎恨过许多事，却没有把其中任何一样比作他[a]；主也必憎恨他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有把其中任何一样比作他”：希腊语可理解为“我没有把所憎恨的任何事物比作他”，即没有什么像他那样可恨。也有人将这句话理解为“我却没有变得像他”。
    reason: οὐχ ὡμοίωσα αὐτῷ为主动形式，可有省略宾语的比较读法；在此语境中亦存在理解为说话者未变得像该人的可能。脚注保留这一歧义。
lexical_decisions:
- source_word: πολλὰ
  choice: 许多事
  rationale: 中性复数在此作名词使用；译作“许多事”既明确其所指，又符合现代汉语表达。
- source_word: ἐμίσησα
  choice: 我憎恨过
  rationale: 不定过去时概括说话者以往的经历；“憎恨过”在汉语中自然地传达这种经验性陈述，并保留强烈语气。
- source_word: οὐχ ὡμοίωσα αὐτῷ
  choice: 却没有一样能与他相比
  rationale: ὁμοιόω为主动形式，搭配与格αὐτῷ，最自然可理解为省略了由前句πολλὰ提示的宾语，即“我没有把其中任何一样比作他”；按憎恨程度而言，就是没有一样能与他相比。译文以脚注保留另一种可能理解。
- source_word: ὁ κύριος
  choice: 主
  rationale: 此处在智慧文学语境中指上帝；“主”是庄重、通行且简洁的对应表达。
- source_word: μισήσει
  choice: 必憎恨
  rationale: 直译μισέω的将来时，并以“必”自然表达格言式的确定将来；重复“憎恨”保留原文与前半句相同词根的修辞呼应。
- source_word: αὐτόν
  choice: 他
  rationale: 阳性单数代词回指上文所说的那个人；“他”准确而简洁。
theological_decisions:
- issue: 上帝“憎恨”人的强烈措辞
  choice: 主也必憎恨他
  alternative: 主也必厌恶他／主也必敌对他
  rationale: 原文在人的反应和主的反应中都使用μισέω。保留“憎恨”既维持词语重复和审判语气，也不因神学顾虑而弱化原文。
- issue: οὐχ ὡμοίωσα αὐτῷ的句法与含义
  choice: 没有一样能与他相比
  alternative: 我却没有变得像他
  rationale: 动词形态是主动语态，且前文πολλὰ可为其提供隐含宾语，因此“没有把任何一样与他相比”在句法上更直接；不过ὁμοιόω在某些语境中也可表达“成为相似”，故以脚注保留该理解，不把歧义完全抹去。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。“憎恨”保留原文的强烈力度及前后重复；“却……；也……”清楚呈现两分句的推进关系。
