  text: Among the senseless[a], watch for the right time; but among the thoughtful, be constant.
translation:
  language: zh_hans
  text: 在无知的人中，要留意适当的时机[a]；在有见识的人中，却要常常与他们在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在愚昧人中，要守候合宜的时机；在明辨的人中，则要恒常停留。”
    reason: 词义与句法容许更贴近字面的表达；“无知／愚昧”、“留意／守候”及“常常与他们在一起／恒常停留”各自呈现原文的不同侧重。
lexical_decisions:
- source_word: ἀσυνέτων
  choice: 无知的人
  rationale: 该词指缺乏理解力或判断力的人。“无知的人”保留智识与道德层面的不足，又比“愚蠢的人”较少带有单纯辱骂色彩。
- source_word: συντήρησον καιρόν
  choice: 要留意合宜的时机
  rationale: συντηρέω有留心、守候、谨慎观察之意；καιρός指适当、合宜的时机，而非一般的时间。“留意合宜的时机”兼顾警醒与审时度势。
- source_word: διανοουμένου
  choice: 有见识的人
  rationale: 该分词指会思考、能领会或有辨识力的人。“有见识的人”自然地与“无知的人”形成对照，同时不把含义限定为单纯聪明。
- source_word: ἐνδελέχιζε
  choice: 要常常相伴
  rationale: 该动词表达持续、恒常或长久停留。结合“在……中”的社交语境，译作“常常相伴”呈现持续与有见识者来往之意，同时避免过度规定具体活动。
- source_word: εἰς μέσον ... εἰς μέσον δέ
  choice: 在……中……；在……中，却……
  rationale: 原文重复“进入／处于……中间”的结构，指身处两类人群之中；中文用“在……中”自然，并以“却”标明对比。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的普通话。主句保留原文两部分的平行与对比；“常常相伴”按语境补出持续交往的意味，但脚注保留较字面的“恒久停留”，以免掩盖原动词的开放性。
