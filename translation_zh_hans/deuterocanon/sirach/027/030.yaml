  naturalness: “紧抓着不放”可以理解，但略偏口语，且“着不放”与复数指代搭配不如“紧抓着它们不放”明确自然。以“罪人”对应ἁμαρτωλὸς更凝练、庄重，也适合箴言式语境。
  terminology: “罪人”准确传达ἁμαρτωλὸς作为具有罪性／犯罪特征者的名词性用法；中文无须在此强行标出ἀνήρ的语法阳性。“可憎的事”保留原文复数。脚注应说明ἐγκρατής通常所带的“掌控／自制”语义及本处结构的困难，不能将“会受它们控制”说成原文的字面意思。
