  - severity: low
    issue: “紧抓着不放”略口语，且省略代词使所执持的对象不够显明。
    rationale: “紧抓着它们不放”更自然、清楚，并保持对αὐτῶν的指代。
  - severity: low
    issue: 脚注将“会受它们控制”列作理解可能，但未区分这与原词通常的主动“掌控／自制”语义之间的距离。
    rationale: 应如实标明原短语字面接近“将掌控它们／对它们有自制”，并说明正文是在负面语境下采取“牢牢执持”的解释。
