  to: 怨恨和愤怒，这两样也是可憎的事；罪人紧抓着它们不放。[a]
  rationale: 修订仅消除原文未明示的“却”字转折，改善末句的现代汉语表达，并更准确地说明困难希腊语短语的字面语义与正文解释。其余关键词及原文的道德谴责力度均予保留。
