  text: Resentment and anger—these also are abominations[b][a], and a sinful man will cling to them.
translation:
  language: zh_hans
  text: 怨恨和愤怒，这两样也是可憎的事；罪人紧抓着它们不放。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “紧抓着它们不放”所译的希腊语表达较难理解。ἐγκρατής通常有“能掌控”或“有自制”之意，这里的字面意思近于“将能掌控它们”。正文按罪人牢牢保留这些恶习来理解；也有人作不同理解。
    reason: alternative_reading
lexical_decisions:
- source_word: Μῆνις
  choice: 怨恨
  rationale: 此词可指深藏、持久甚至带报复性的怒意；译作“怨恨”既表达其持续性，也与后面的普通怒气用语ὀργή区分。
- source_word: ὀργή
  choice: 愤怒
  rationale: 这是表示怒气或震怒的常用词；“愤怒”自然庄重，又不至于与Μῆνις混同。
- source_word: βδελύγματα
  choice: 可憎之事
  rationale: 该复数名词指令人厌恶、在道德或宗教意义上可憎的事物；此译保留其强烈的否定分量，同时符合现代汉语表达。
- source_word: ἀνὴρ ἁμαρτωλὸς
  choice: 犯罪的人
  rationale: ἀνήρ本为阳性单数“男人”，但这里表达的是具有代表性的道德命题；汉语用“人”自然且没有额外限定性别，ἁμαρτωλός则按其罪行状态译作“犯罪的”。
- source_word: ἐγκρατὴς ἔσται αὐτῶν
  choice: 却紧抓着不放
  rationale: ἐγκρατής通常有“有节制、能控制”之义，但与属格αὐτῶν连用且处于谴责怨恨与愤怒的语境中，措辞存在困难。这里理解为犯罪者牢牢保留这些恶习；“紧抓着不放”自然表达这种执持，同时以脚注保留原文难点。
theological_decisions:
- issue: ἀνὴρ在普遍道德陈述中的性别表达
  choice: 犯罪的人
  alternative: 犯罪的男人
  rationale: 原词在形态上是阳性单数，但本句的教训具有一般指向。现代汉语“人”可自然承载代表性单数，不需加入原文未强调的男性限定；脚注在此并非必要。
- issue: 负面语境中ἐγκρατὴς ἔσται αὐτῶν的解释
  choice: 却紧抓着不放
  alternative: 会控制它们／会受它们控制
  rationale: 直译近似“会是它们的掌控者”，与上下文形成语义张力。结合属格结构及本句对这些情欲的谴责，正文采用“执持、保留”之义，但用脚注明示字面表达和其他理解的可能，避免掩盖原文的困难。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“怨恨／愤怒”体现两个希腊怒气词之间的区别；以分号保留原句前后判断与人物行为的对照，并加“却”使汉语关系清楚。
