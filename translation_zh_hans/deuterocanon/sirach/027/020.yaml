  text: Do not pursue him[a], for he has gone far away[b], and has escaped like a gazelle from a snare.
translation:
  language: zh_hans
  text: 不要追赶他[a]，因为他已远去；他已脱身，如同羚羊逃出陷阱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追赶”也可译作“追逐”。希腊语动词可泛指追在后面，并不必然含有迫害之意。
    reason: lexical_alternative
  - marker: b
    text: 这里描绘的是敏捷的野兽逃出捕兽陷阱。“羚羊”也可泛译为“羚羊类动物”；“陷阱”也可译作“圈套”或“捕具”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ αὐτὸν διώξῃς
  choice: 不要追赶他
  rationale: διώκω在此表示追逐、追赶；译为“追赶”既保留禁止命令的语气，也不引入“迫害”的敌对含义。αὐτόν为阳性单数，故译作“他”。
- source_word: μακρὰν ἀπέστη
  choice: 他已经远去
  rationale: ἀφίστημι在此指离开、远离，μακράν强调距离；“已经远去”是自然简洁的现代汉语，也体现动作已经发生。
- source_word: ἐξέφυγεν
  choice: 他已逃脱
  rationale: ἐκφεύγω表示逃出、脱身；“逃脱”与下文动物挣脱捕具的比喻自然衔接。
- source_word: ὡς δορκὰς
  choice: 如同羚羊
  rationale: δορκάς指瞪羚或狍一类敏捷的野生动物；“羚羊”在现代汉语中清楚易懂，并保留迅速逃脱的意象。
- source_word: ἐκ παγίδος
  choice: 逃出罗网
  rationale: παγίς可指套索、陷阱或罗网；“罗网”符合捕捉野兽的图景，也保留智慧文学常见的捕猎意象。
