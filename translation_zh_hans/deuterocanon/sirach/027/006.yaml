  text: The fruit shows the cultivation of a tree[a]; so a man's reasoning shows the inclination of his heart.
translation:
  language: zh_hans
  text: 果实显出树木受过怎样的栽培[a]；同样，一个人的思量也显出他内心的倾向。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文后半句句法凝缩，直译近于“思量／考量对应一个人的倾向”。希腊平行文本作“人的心中所思所发的话”，以“话语”表达内在心思的外在流露；这可支持本节的整体意思，但其措辞与希伯来文不同。
    reason: 说明希伯来文凝缩的表达，并准确保留希腊平行文本的不同措辞及其解释作用。
lexical_decisions:
- source_word: עֲבֹדַת עֵץ
  choice: 树木受了怎样的栽培
  rationale: עֲבֹדָה本义为“劳作、照料”，与“树木”连用时指栽培或照料树木；希腊平行文本γεώργιον ξύλου也支持农业语境。“受了怎样的栽培”使果实作为辨识依据的关系在现代汉语中清楚自然。
- source_word: פֶרִי
  choice: 果实
  rationale: 保留谚语的具体农业意象，也能自然承载比喻意义。
- source_word: חֶשְׁבּוֹן
  choice: 判断
  rationale: 该词可指计算、思量或推断。此处“判断”既保留思想活动的含义，也可指一个人表达出来的看法，从而与“显出”相配；希腊平行文本以λόγος表达言语或陈述，说明这里可能涉及内在思想的外在表达。
- source_word: יֵצֶר
  choice: 内心的倾向
  rationale: יֵצֶר可指内在的构想、意向或性情倾向。“内心的倾向”保持其人类内在取向的含义，又不引入后期特定的教义术语。
- source_word: אֶחָד
  choice: 一个人……他
  rationale: 希伯来语字面为“一个”，在这里指某个个体或一般意义上的人；用“一个人……他”符合现代汉语的代表性单数表达。
theological_decisions:
- issue: 人的内在倾向如何由外在表现显明
  choice: 一个人的判断也显出他内心的倾向
  alternative: 一个人的思量依照他的倾向；或：人的言语显出他心中的思想
  rationale: 希伯来文本的后半句较为凝缩，字面接近“判断/思量照着一个人的倾向”；希腊平行文本则明确说“人的心思所发的话”。正文借助两句的平行关系表达“显出”，但以脚注保留“判断、思量、言语”之间的文本张力，不把它限定为某种教义性的人论。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。前后两句以“显出……；同样……也显出……”形成清晰对偶；“一个人”表达普遍适用的人类经验，并非专指男性。
