  text: The talk of fools is offensive[b][a], and their laughter is in the indulgence of sin.
translation:
  language: zh_hans
  text: 愚人的谈吐令人厌烦[a]；他们的笑声是在罪恶的放纵中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愚人的言谈叫人恼怒。”προσόχθισμα 也可侧重“烦扰、恼怒”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们的笑声是在罪恶的奢靡放纵中。”σπατάλη 可指自我放纵、奢靡享乐或无度的生活。
    reason: lexical_alternative
lexical_decisions:
- source_word: διήγησις
  choice: 谈吐
  rationale: 此词可指叙述、言谈或话语；在智慧文学语境中，“谈吐”自然地概括愚人所说的话，又不局限于正式叙事。
- source_word: μωρῶν
  choice: 愚人的
  rationale: 保留智慧文学中兼具道德与认知意味的“愚人”，不弱化为单纯缺乏聪明的人。
- source_word: προσόχθισμα
  choice: 令人厌烦
  rationale: 该名词指引起不悦、恼怒或反感之物；译为“令人厌烦”符合现代汉语，也保留其负面评价，而不把程度限定得过重。
- source_word: γέλως
  choice: 笑声
  rationale: 采用基本义“笑声”；原文没有明确说是嘲笑，因此不增译为“讥笑”。
- source_word: ἐν
  choice: 伴随着
  rationale: 此处可表达所处的范围、情境或关联；“伴随着”在汉语中自然，并保留笑声与罪恶放纵紧密相连的含义，但不武断判定两者完全等同。
- source_word: σπατάλῃ
  choice: 放纵
  rationale: 该词可指奢靡、纵欲、自我放任或挥霍无度；“放纵”涵盖其道德上的过度与失控，不把语义只限于物质奢侈。
- source_word: ἁμαρτίας
  choice: 罪恶的
  rationale: 直陈其道德类别为“罪恶”，保留原文的伦理力度，并以定语结构修饰“放纵”。
theological_decisions:
- issue: 智慧文学道德术语的力度
  choice: 保留“愚人”和“罪恶”这两个明确的道德范畴
  alternative: 译作“无知的人”和“过错”
  rationale: 原文 μωρῶν 与 ἁμαρτίας 都具有鲜明的伦理分量；较柔和的措辞会无根据地削弱经文的道德锋芒。
- issue: 笑声与罪恶放纵之间的关系
  choice: 译为“伴随着”，表达紧密关联而不把句法关系过度定死
  alternative: 译为“就在罪恶的放纵中”或“就是罪恶的放纵”
  rationale: ἐν 可表示范围、处境或关联。原文保留一定张力，因此中文不应武断解释为同一关系或单纯地点关系。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“谈吐”比“叙述”更适合本节泛指愚人的言语；分号呈现希腊文两个并列分句。脚注标记均置于正文相关短语之后。
