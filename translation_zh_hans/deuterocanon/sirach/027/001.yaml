  text: For the sake of gain many have sinned[b][a], and whoever seeks to increase it will turn away his eye.
translation:
  language: zh_hans
  text: 许多人为了利益[a]犯了罪；想要增加利益的人，必移开目光[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“利润”。这里的希腊词很可能指物质上的好处或所得。
    reason: lexical_alternative
  - marker: b
    text: 直译“必转开眼睛”。原文没有说明他从什么事上移开目光；这个意象暗示为求利益而故意不顾本应看见或正视的事。
    reason: idiom_explanation
lexical_decisions:
- source_word: χάριν ἀδιαφόρου
  choice: 为了利益
  rationale: χάριν加属格表示动机或缘由；ἀδιαφόρου在本箴言语境中与追求增多相连，最自然地指物质利益，而不是抽象的“无所谓”。
- source_word: πολλοὶ ἥμαρτον
  choice: 许多人犯了罪
  rationale: 直译其普遍、箴言式的陈述；汉语无需借助完成体标记也可表达这种一般经验。
- source_word: ὁ ζητῶν πληθῦναι
  choice: 想要增加利益的人
  rationale: 定冠词加分词表达泛指；不定式的宾语在希腊文中省略，按上文补出“利益”，使现代汉语清楚自然。
- source_word: ἀποστρέψει ὀφθαλμόν
  choice: 必转眼不看
  rationale: 保留“转眼”的具体意象和将来式所表达的必然结果，同时用“不看”使汉语惯用语义清楚，不限定他究竟对什么视而不见。
theological_decisions:
- issue: 末句所指的道德妥协
  choice: 保留“转眼不看”的开放意象
  alternative: 对恶行视而不见；闭眼不顾
  rationale: 原文没有说明眼睛从什么对象转开。译文不擅自补明是恶行、穷人或不公，从而保存原文的含混与道德张力。
- issue: ἀδιαφόρου的语义
  choice: 利益
  alternative: 利润；无关紧要之物
  rationale: 后句“增加”支持物质收益之义，但该词较不寻常，因此以脚注提示“利润”这一接近的译法，不将其扩大为特定商业或教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“为了利益”简洁自然；分号呈现两分句间的递进关系。“必转眼不看”既保留希腊文意象，也避免把其对象解释得过于具体。所有脚注标记均已置于正文相应位置。
