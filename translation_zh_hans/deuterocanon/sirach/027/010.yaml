  text: A lion lies in wait for prey[a]; so sins do for those who practice injustice.
translation:
  language: zh_hans
  text: 狮子埋伏，等候猎物[a]；罪也照样埋伏，等候行不义的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“狮子伏击猎物；罪也照样伏击行不义的人。”
    reason: “ἐνεδρεύει”兼有设伏、伏击和潜伏等候之意；此译法更紧凑地突出伏击动作。
lexical_decisions:
- source_word: λέων
  choice: 狮子
  rationale: 无冠词单数在智慧格言中表达泛指；现代汉语直接说“狮子”即可自然传达普遍意义。
- source_word: θήραν
  choice: 猎物
  rationale: 该词指狩猎所得或被捕猎的对象；“猎物”简洁、自然，并保留捕食意象。
- source_word: ἐνεδρεύει
  choice: 埋伏，等候
  rationale: 动词表示设伏或潜伏等候；“埋伏，等候”既保留伏击意味，也清楚呈现捕食者守候猎物的画面。
- source_word: οὕτως
  choice: 也照样
  rationale: 明确引出前后类比，符合现代汉语格言式表达。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: 保留原文的“罪”，不改释为“罪的后果”或“惩罚”；汉语中“罪”可作集合性概念，并能承载此处的拟人化意象。
- source_word: ἐργαζομένους
  choice: 行……的人
  rationale: 分词指实际从事某种行为的人；“行……的人”庄重而自然，也可表达持续的行为取向。
- source_word: ἄδικα
  choice: 不义
  rationale: 中性复数可指“不义之事”；译为“行不义”简练自然，并保留伦理判断。
theological_decisions:
- issue: ἁμαρτίαι（罪）的拟人化
  choice: 把“罪”保留为埋伏等候恶行者的主体
  alternative: 译作“罪的后果”或“罪的惩罚”埋伏等候恶行者
  rationale: 希腊文明确以“罪”为主语，并未明说“后果”或“惩罚”。保留拟人化可维持原文鲜明意象及其神学张力，避免替文本作解释性限定。
- issue: 后半句谓语的省略
  choice: 在汉语中补出“埋伏，等候”
  alternative: 仅译“罪也照样对待行不义的人”
  rationale: 希腊文后半句承接前半句的谓语。汉语补出谓语能使关系清楚，并忠实保留平行的捕食意象，而不增加新的意义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。用分号呈现比喻与所指之间的平行关系；后半句重复“埋伏，等候”，使希腊文省略的谓语在汉语中清晰可见。
