  yaml_path: translation/deuterocanon/sirach/027/029.yaml
  text: Those who rejoice at the fall of the godly will be caught in a trap[a], and pain will consume them before their death.
translation:
  language: zh_hans
  text: 因敬虔的人的跌倒而幸灾乐祸的人，必落入圈套；痛苦必在他们死前将他们吞噬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παγίδι
  choice: 圈套
  rationale: 该词为与格单数，可表示被捕获的处境或手段。“圈套”是现代汉语中自然清楚的表达，也保留诱捕意象。
- source_word: ἁλώσονται
  choice: 必落入
  rationale: 这是表示将来的被动形式，意为“被捉住、被捕获”。与“圈套”搭配时，“落入圈套”最符合自然汉语，同时传达被擒获之意。
- source_word: οἱ εὐφραινόμενοι
  choice: 幸灾乐祸的
  rationale: 该分词作名词用，指因他人的跌倒而欢喜的人。结合其补语，“幸灾乐祸”准确而自然地表达这种恶意的喜悦。
- source_word: πτώσει
  choice: 跌倒
  rationale: πτῶσις 可指跌落、倒下或败落。“跌倒”保留原文较宽泛的形象，不把它过度限定为社会性或最终性的“败亡”。
- source_word: εὐσεβῶν
  choice: 虔诚人
  rationale: εὐσεβής 指敬畏神、虔敬的人。“虔诚人”在现代汉语中清楚传达其宗教与道德含义，又不引入特定宗派术语。
- source_word: ὀδύνη
  choice: 痛苦
  rationale: 该词既可表示身体疼痛，也可表示悲痛或剧烈苦楚。“痛苦”涵盖面较广，保留原文对痛楚性质的含混。
- source_word: καταναλώσει
  choice: 将……吞噬
  rationale: καταναλίσκω 有耗尽、消耗、吞灭之意。“吞噬”保留原文强烈而生动的毁灭性意象。
- source_word: πρὸ τοῦ θανάτου αὐτῶν
  choice: 在他们死前
  rationale: 这是明确的时间短语。“在他们死前”自然简洁，并忠实表达痛苦发生于其死亡之前。
theological_decisions:
- issue: 智慧文学中 εὐσεβῶν 的译法
  choice: 虔诚人
  alternative: 敬虔的人；虔敬的人
  rationale: 此词在本节指以敬神和虔敬为特征的一类人。“虔诚人”通俗而庄重，保留道德—宗教范畴，不将其窄化为某种后期神学身份。
- issue: πτῶσις 所指的“跌倒”性质
  choice: 保留为“跌倒”
  alternative: 败落；垮台
  rationale: 原文没有明确说明这是道德失足、遭遇灾祸还是社会败落，因此采用较宽泛的“跌倒”，不替文本消除其真实含混。
- issue: ὀδύνη 是身体疼痛还是精神悲痛
  choice: 译作宽泛的“痛苦”
  alternative: 疼痛；悲痛；苦楚
  rationale: 原词可涵盖身体与精神层面的苦楚；“痛苦”避免无根据地限定其性质。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“幸灾乐祸”虽是成语，但准确对应因虔诚人跌倒而欢喜的完整语义；后半句保留“吞噬”的强烈比喻。本文无需脚注，因为主要词义的含混可在正文中自然保留，且没有必须另列的文本异读。
