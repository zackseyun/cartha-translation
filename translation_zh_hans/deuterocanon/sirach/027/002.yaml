  text: A peg will be driven in between the joints of stones[b][a], and sin will be wedged in between selling and buying.
translation:
  language: zh_hans
  text: 石块的接缝中，一根钉子必被打进[a]；卖与买之间，罪也必被压碎[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打进”也可译作“钉牢”或“固定”；原词所指之物也可译作“栓钉”或“桩”。
    reason: 说明 παγήσεται 与 πάσσαλος 的词义范围。
  - marker: b
    text: “被压碎”直接反映希腊文的用词；也有人按上下文理解为“被挤压在其中”。原句中罪如何与石缝里的钉子构成对应，含义并不完全明确。
    reason: 保留 συντριβήσεται 的基本意义，同时提示比喻关系及其真实歧义。
lexical_decisions:
- source_word: ἀνὰ μέσον
  choice: ……之间
  rationale: 该短语在两小句中重复，表示处于两者中间；中文用“……之间”既自然，也保留平行结构。
- source_word: ἁρμῶν λίθων
  choice: 石块的接缝
  rationale: ἁρμός 指连接、接合之处；与“石块”连用时，指砌石之间的接缝，而不只是泛指裂缝。
- source_word: παγήσεται
  choice: 必钉入
  rationale: πήγνυμι 的将来时被动态表示被牢牢安置、钉牢；“钉入”具体呈现钉子进入石缝的形象。
- source_word: πάσσαλος
  choice: 一根钉子
  rationale: 该词可指钉、栓或桩；此处位于石块接缝中，“钉子”是普通读者易懂且不过度限定大小、材质的表达。
- source_word: πράσεως καὶ ἀγορασμοῦ
  choice: 卖与买
  rationale: 两个名词分别表示出售和购买的行为；简洁译作“卖与买”，保留箴言式对称。
- source_word: συντριβήσεται
  choice: 必被压碎
  rationale: 这是 συντρίβω 的将来时被动态，基本义为被压碎、击碎。尽管语境使形象较难理解，正文不以较顺畅的“嵌入”取代原文动词。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 保留其道德和神学分量，不把含义预先收窄为商业欺诈或一般过失。
theological_decisions:
- issue: 商业语境中 ἁμαρτία 的道德力度
  choice: 罪
  alternative: 不义／过错
  rationale: 原文以一般性的“罪”说明买卖关系中的道德危险，并未只限定某一种商业不法行为。
- issue: 后半句难解的受动态形象
  choice: 罪也必被压碎
  alternative: 罪也必被挤在其中／嵌入其中
  rationale: 希腊文明确使用通常表示“压碎、击碎”的 συντρίβω 被动态。上下句可能形成受挤压的意象，但不宜为增强表面对仗而把动词改译成“嵌入”。
translation_notes:
  register: 采用简洁、庄重的现代普通话，并保留原文两个“……之间”的平行句式。正文不沿用英语咨询层较解释性的“嵌入其中”，而以脚注交代可能的语境理解。
