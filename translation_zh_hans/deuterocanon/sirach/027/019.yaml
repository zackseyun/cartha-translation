revisions:
- from: 你放走邻舍，就像从手中放飞一只鸟；你再也捕不回他。[a]
  to: 正如你从手中放走一只鸟，你也放走了邻舍；你将不能再捕获他。[a]
  rationale: 修订恢复原文“鸟—邻舍”的明喻次序，并以“捕获”对应最终的猎捕动词。保留“再”是由先前“放走”的画面自然引出的汉语表达，但不用“再也”或“捕不回”来过度强调关系不可挽回的解释。
