  yaml_path: translation/deuterocanon/sirach/027/019.yaml
  text: And as a bird from your hand you have let go[a], so you have let your neighbor go, and you will not catch him.
translation:
  language: zh_hans
  text: 正如你从手中放走一只鸟，你也放走了邻舍；你将不能再捕获他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “捕获”原文带有猎捕、猎取的意象；也可译为“猎捕他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὸν
  choice: 一只鸟
  rationale: 该词泛指鸟类；“一只鸟”符合现代汉语习惯，也保留比喻的具体形象。
- source_word: ἐκ χειρός σου
  choice: 从手中
  rationale: 直接保留空间意象，表达鸟原在人的掌握之中。
- source_word: ἀπέλυσας
  choice: 放飞
  rationale: 原义为释放、放走；结合鸟的意象，“放飞”自然地表现让鸟离手而去。
- source_word: ἀφῆκας
  choice: 放走
  rationale: 该词可指离弃、释放或任其离去；此处与前句释放鸟的动作平行，“放走”既自然，又不过度限定关系破裂的具体方式。
- source_word: τὸν πλησίον
  choice: 邻舍
  rationale: 在智慧文学的伦理语境中，指与自己有社会关系的身边之人；“邻舍”保留其传统伦理含义，同时为现代读者所能理解。
- source_word: οὐ θηρεύσεις αὐτόν
  choice: 你再也捕不回他
  rationale: θηρεύω带有猎取、捕捉的意象；“捕不回”既延续捕鸟比喻，也清楚表达一旦放走便难以挽回的结果。“再也”在汉语中自然传达将来不能重新捕获的语用含义。
theological_decisions:
- issue: 末句是否显明译出狩猎意象
  choice: 你再也捕不回他
  alternative: 你将无法猎取他／你再也找不回他
  rationale: 原文θηρεύσεις明确带有捕猎色彩，但重点也包括无法重新得回邻舍。“捕不回”同时保留鸟喻和不可挽回之意，避免把它弱化为纯粹的“找不到”，也不把邻舍描写得过分像被追猎的对象。
- issue: ἀφῆκας描述邻舍时的关系含义
  choice: 放走邻舍
  alternative: 离弃邻舍／失去邻舍
  rationale: 原文可有“离开、任去、释放”等含义，并借与ἀπέλυσας的平行形成类比。选择“放走”保留这种张力，不明确断定是离弃、冒犯或断交。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。为使汉语顺畅，将希腊文先述鸟、后述邻舍的结构调整为先提出邻舍，再引入鸟喻；逻辑关系和两者的对应仍然保留。脚注标记置于相关末句之后。
