  text: One who winks with the eye devises evil things[a], and no one will turn him away from them.
translation:
  language: zh_hans
  text: 以眼神示意的人图谋恶事[a]，没有人能使他离弃它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”所对应的希腊文代词为单数，语法上可为阳性或中性，字面可作“他”或“它”；其具体所指不甚明确，可能指前述的恶事或图谋恶事之举。
    reason: 保留原文单数代词及其所指不明确之处。
lexical_decisions:
- source_word: διανεύων
  choice: 示意的人
  rationale: 该分词指用动作传递信号；与“眼睛”连用时，表示隐秘地使眼色。“示意”比单纯“眨眼”更准确地保留了传递暗号的含义。
- source_word: ὀφθαλμῷ
  choice: 以眼神
  rationale: 与格表工具或方式。现代汉语用“以眼神”自然地表达“用眼睛打信号”，且无需补入原文未明说的所属代词。
- source_word: τεκταίνει
  choice: 图谋
  rationale: 该动词本可指制作、构造，在此道德语境中引申为策划、谋划；“图谋”兼具蓄意筹划和负面色彩。
- source_word: κακά
  choice: 恶事
  rationale: 中性复数泛指邪恶或有害之事。“恶事”保留其宽泛的道德含义，不将其过度限定为具体计谋。
- source_word: οὐδεὶς
  choice: 没有人
  rationale: 直接、自然地表达全称否定。
- source_word: ἀποστήσει
  choice: 能使他离开
  rationale: 使役意义为使某人离开、退离或停止所走的道路；“使他离开”保留其方向性，同时不额外断定是外在阻止还是内在劝止。
- source_word: ἀπʼ αὐτοῦ
  choice: 离开这事
  rationale: 希腊文代词为阳性或中性单数，字面可译“离开它/他”。其确切所指并不完全清楚；正文用“这事”保持单数并指向前述图谋恶事的行为，脚注说明歧义。
