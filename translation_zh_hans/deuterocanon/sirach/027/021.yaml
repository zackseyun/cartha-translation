  text: For a wound may be bound up, and after insults there may be reconciliation; but one who has revealed secrets has lost hope.
translation:
  language: zh_hans
  text: 因为伤口可以包扎，受辱之后也可以和解；但泄露秘密的人已经失去希望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“已经绝望”或“已无希望”。希腊文没有说明所失去的是什么希望；按上下文，很可能是指泄露秘密后恢复信任的希望。
    reason: lexical_alternative
lexical_decisions:
- source_word: τραῦμά
  choice: 创伤
  rationale: 指实际的伤口或创伤；保留具体意象，并可自然地与后半句关系上的破坏形成对照。
- source_word: καταδῆσαι
  choice: 可以包扎
  rationale: 该不定式表示捆扎或包扎伤口；用“可以包扎”自然表达希腊文所含的可能性。
- source_word: λοιδορίας
  choice: 辱骂
  rationale: 指侮辱、谩骂一类的言语攻击；“辱骂”在现代汉语中清楚自然。
- source_word: διαλλαγή
  choice: 和解
  rationale: 表示冲突之后关系得到修复；“和解”准确保留其人际关系含义。
- source_word: ἀποκαλύψας
  choice: 泄露
  rationale: 意为揭开、披露；与“秘密”搭配时，“泄露”最自然，也体现违背信任的语境。
- source_word: μυστήρια
  choice: 秘密
  rationale: 在本智慧文学语境中指应当保密的事情，并非启示文学意义上的“奥秘”。
- source_word: ἀφήλπισεν
  choice: 已经失去希望
  rationale: 该动词表示不再抱有希望或陷入绝望；此译法保留完成性，也不明说所失去的是哪一种希望。
theological_decisions:
- issue: 末句 ὁ δὲ ἀποκαλύψας μυστήρια ἀφήλπισεν 的含义
  choice: 泄露秘密的人已经失去希望
  alternative: 泄露秘密的人已经绝望；或泄露秘密的人已无可挽回
  rationale: 上下文很可能指泄密者失去了恢复信任或关系的希望，但希腊文没有说明希望的具体对象。正文保留这种省略与张力，避免将其解释成绝对的道德绝望。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“创伤—包扎”保留原文的具体比喻；“也可以和解”体现 καὶ 的递进对照。末句不补出“恢复信任”等宾语，以保存原文的简洁与含混。
