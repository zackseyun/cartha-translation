  yaml_path: translation/deuterocanon/sirach/027/023.yaml
  text: Before your eyes his mouth speaks sweetly[a], and he will marvel at your words; but afterward he will twist his mouth and, in regard to your words, he will cause offense.
translation:
  language: zh_hans
  text: 他当着你的面甜言蜜语，又对你的话赞叹不已；后来却变了口气，并拿你的话使人跌倒[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使人跌倒”也可译作“造成冒犯”或“拿你的话绊倒你”。希腊语σκάνδαλον可指使人跌倒的障碍、陷阱，或冒犯的缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέναντι τῶν ὀφθαλμῶν σου
  choice: 当着你的面
  rationale: 表达在对方眼前、当面而为的意思，符合现代汉语习惯。
- source_word: γλυκανεῖ στόμα σου
  choice: 甜言蜜语
  rationale: 原文此处按语境应理解为那人的口说甜言；希腊文本所见 στόμα σου（“你的口”）可能存在代词或文本问题。译文自然表达奉承之言，同时保留“口甜”的意象。
- source_word: ἐπὶ τῶν λόγων σου ἐκθαυμάσει
  choice: 对你的话赞叹不已
  rationale: ἐκθαυμάσει 表示强烈惊叹；在上下文中可能是刻意表现出的赞赏，但不把虚假动机直接写入正文。
- source_word: διαστρέψει τὸ στόμα αὐτοῦ
  choice: 撇嘴讥讽
  rationale: 保留嘴脸转变的身体意象，并以“讥讽”传达口舌转为歪曲、敌对的语境含义。
- source_word: ἐν τοῖς λόγοις σου δώσει σκάνδαλον
  choice: 拿你的话使人跌倒
  rationale: 将 ἐν 理解为凭借或利用，将 δώσει σκάνδαλον 的致使性译出；“使人跌倒”保留 σκάνδαλον 的障碍、陷害或冒犯等开放含义。
theological_decisions:
- issue: σκάνδαλον 的含义及受害者是否明确
  choice: 使人跌倒
  alternative: 造成冒犯／拿你的话绊倒你
  rationale: 原文没有明说跌倒者是谁，也可能兼有陷害、冒犯和设置障碍之意；正文不补出“你”，以免消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体；前后以“当面奉承—背后敌对”形成鲜明对照。
