  text: The talk of one who swears much makes the hair stand up[a], and their quarrel stops the ears.
translation:
  language: zh_hans
  text: 动辄赌咒的人的言谈令人毛发竖起[a]；他们的争吵令人掩耳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “动辄赌咒”所译的希腊词 πολυκόρυφου 词义疑难，可能指惯于频繁起誓或咒诅的人，也可能较宽泛地指喧嚷、狂妄或言语骇人的人。正文按上下文采用“动辄赌咒”，但确切含义不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰ
  choice: 言谈
  rationale: 此词泛指说话、言语；“言谈”自然庄重，也符合箴言式语境。
- source_word: πολυκόρυφου
  choice: 常赌咒之人
  rationale: 该词词义疑难，可能指频繁起誓、咒骂的人，也可能较宽泛地指喧嚷、狂妄或骇人的说话者。正文依上下文采用“常赌咒之人”，并用脚注保留不确定性。
- source_word: ὀρθώσει τρίχας
  choice: 叫人毛发直竖
  rationale: 保留希腊文“使毛发竖起”的鲜明意象，表达惊骇或厌恶，又符合现代汉语习惯。
- source_word: μάχη
  choice: 争吵
  rationale: 在言谈与社交的智慧文学语境中，此处更可能指口头冲突，而非实际战斗。
- source_word: ἐμφραγμὸς ὤτιων
  choice: 叫人堵住耳朵
  rationale: 希腊文直指“耳朵的堵塞”；译文将其自然地表达为争吵令人不愿再听，同时保留原有身体意象。
