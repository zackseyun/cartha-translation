  text: When a sieve is shaken[a], the refuse remains; so a person's filth is revealed in his thoughts.
translation:
  language: zh_hans
  text: 摇动筛子时，粪渣[a]留在筛中；照样，一个人的污秽也留在他的思量[b]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “粪渣”也可译作“污物”或“废渣”；希腊词可指粪土、肥料或污秽废物。
    reason: 说明原词的粗粝色彩及其词义范围。
  - marker: b
    text: “思量”也可译作“思想”“推理”或“盘算”。希腊文后半句没有另行明说与前句相对应的动词；译文按上下文补足“留在”。
    reason: 保留λογισμός的词义幅度，并说明原文省略相应谓语所保留的表达张力。
lexical_decisions:
- source_word: ἐν σείσματι κοσκίνου
  choice: 筛子摇动时
  rationale: 将介词短语按箴言语境自然地译为时间表达，同时保留“摇筛子”的具体图景。
- source_word: διαμενεῖ
  choice: 会留下
  rationale: 该动词表示继续存在、留存；“留下”准确表现筛过之后粗渣仍留在筛中的画面。
- source_word: κοπρία
  choice: 粪渣
  rationale: 原词可指粪土、肥料或污秽废物；“粪渣”保留原文较粗粝的意象，也适合筛分场景。
- source_word: σκύβαλα
  choice: 污秽
  rationale: 原词可指废物、垃圾乃至粪秽。用于人时，“污秽”既保留贬义，也与前半句的废弃物意象相呼应。
- source_word: ἀνθρώπου
  choice: 人的
  rationale: 此处是智慧文学中代表全人类的一般性单数；现代汉语用“人的”自然表达其泛指意义，不额外标明性别。
- source_word: ἐν λογισμῷ αὐτοῦ
  choice: 在他的思量中
  rationale: λογισμός可表示思想、思考、推理或盘算；“思量”保留思考过程的意味，又不把它缩窄为单一念头。
theological_decisions:
- issue: 后半句省略谓语所形成的含义张力
  choice: 沿用前半句的“留在”，译作“也留在他的思量中”
  alternative: 译作“在他的思想中显露出来”
  rationale: 希腊文后半句没有“显露”一词，语法上自然承接前半句的διαμενεῖ。保留“留在”既忠于省略结构，也让读者自行体会人的思量如何显出或保存其内在污秽。
- issue: ἀνθρώπου的泛指表达
  choice: 人的
  alternative: 男人的
  rationale: 此处所说的是普遍的人性观察，并非针对男性的教导；“人的”在现代汉语中准确、自然地保留泛指作用。
translation_notes:
  register: 采用简洁、对称的箴言句式，语言现代而庄重。保留原文筛分粪渣的粗粝比喻，不以较抽象的“缺点”或“罪恶”取代；后半句不擅自补入“显露”，以免消解原文的省略和开放性。
