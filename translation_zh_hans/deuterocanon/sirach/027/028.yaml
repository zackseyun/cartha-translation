  text: Mockery and reproach are for the proud[b][a], and vengeance will lie in wait for him like a lion.
translation:
  language: zh_hans
  text: 狂傲的人[a]必受嘲弄和羞辱；报应要像狮子一样埋伏等候他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“骄傲的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“报应要像狮子一样伏击他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαιγμός
  choice: 嘲弄
  rationale: 表示以言行取笑、戏弄而使人受辱；“嘲弄”自然、准确，也能与后面的“羞辱”形成协调的并列。
- source_word: ὀνειδισμός
  choice: 羞辱
  rationale: 该词兼有责骂、凌辱和使人蒙羞之意；“羞辱”保留其社会性与道德性的耻辱色彩。
- source_word: ὑπερηφάνων
  choice: 骄傲的人
  rationale: 属格复数泛指骄傲、自高的一类人；此译简明自然，并保留其群体性的泛指。
- source_word: ἐκδίκησις
  choice: 报应
  rationale: 表示报复性或惩罚性的追讨；“报应”在本节智慧文学的警告语境中自然有力，同时不擅自指明施行者。
- source_word: ἐνεδρεύσει
  choice: 埋伏，等候
  rationale: 动词表示暗中设伏、伺机袭击；这一表达保留狮子潜伏守候猎物的形象。
- source_word: αὐτόν
  choice: 他
  rationale: 原文为阳性单数代词，在前面的复数类别之后把警告落实到其中一个代表性个体；保留单数可呈现原文的谚语式力度。
theological_decisions:
- issue: 如何处理复数类别名词之后的单数代词 αὐτόν
  choice: 保留单数“他”
  alternative: 译作“他们”或“这样的人”
  rationale: 希腊文从泛指骄傲之人的复数转为单数宾语，是把警告个体化的常见表达。译作“他”最贴近原文形式，不把原有单数改成复数。
- issue: ἐκδίκησις 是否弱化为一般性的“惩罚”或“公正”
  choice: 译作“报应”
  alternative: 报复、惩罚、公正
  rationale: 本节描写追讨如狮子潜伏，语气严厉且带有报复性后果。“报应”保留这种力度，又不超出原文去确定报应的具体施行者。
- issue: 如何表达首句无明示系词的属格结构
  choice: 译作“骄傲的人必受嘲弄和羞辱”
  alternative: “嘲弄和羞辱归于骄傲的人”或较直译的“骄傲之人的嘲弄和羞辱”
  rationale: 上下文和后半句都指向骄傲者所遭遇的后果；采用受事结构可在现代汉语中清楚自然地表达这一关系，但不进一步说明是谁实施嘲弄和羞辱。
translation_notes:
  register: 采用现代、庄重而易懂的智慧格言语体。分号保留前后两幅相连的警告图景；“埋伏，等候”使狮子潜伏伺机的意象在汉语中清晰可感。
