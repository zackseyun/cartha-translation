  text: Whoever does evil[a], onto himself it will roll, and he will certainly not know from where it came upon him.
translation:
  language: zh_hans
  text: 作恶的人，恶事必滚到他自己身上[a]；他绝不会知道它是从哪里临到他的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“恶事必滚回他身上。”希腊文以滚动的图像描写恶事归到作恶者身上。
    reason: 说明“滚到”可按语境理解为“滚回”，同时保留原文方向表达的含混性。
lexical_decisions:
- source_word: ὁ ποιῶν πονηρὰ
  choice: 作恶的人
  rationale: 定冠词加现在分词构成泛指，表达普遍性的箴言；将实词化的中性复数 πονηρά 自然地译为“作恶”。
- source_word: εἰς αὐτὸν κυλισθήσεται
  choice: 恶事必滚到自己身上
  rationale: 保留 κυλίω 的“滚动”意象及 εἰς 所表达的趋向；从上文补出“恶事”作主语，使中文清楚，同时不把比喻抽象化为一般的“报应”或“后果”。
- source_word: οὐ μὴ ἐπιγνῷ
  choice: 他绝不会知道
  rationale: οὐ μή 加虚拟语气构成强烈否定；“绝不会”在现代汉语中自然地传达这种强调。
- source_word: πόθεν ἧκε αὐτῷ
  choice: 这是从哪里临到他的
  rationale: πόθεν 表示来源，ἥκω 表示来到或已经抵达；“临到”既保留事件来到其身上的方向，也符合庄重而通顺的现代中文。
theological_decisions:
- issue: 恶行回到作恶者身上的报应意象
  choice: 保留恶事“滚到自己身上”的具体图像
  alternative: 作恶的人必自食其果
  rationale: 原文用滚动的动态意象表达道德后果回到行为人身上；不将其改写成固定成语，可避免增加原文没有明说的解释，并保存箴言的张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“作恶的人”保持箴言式泛指；“滚到自己身上”刻意保留原文鲜明而略显突兀的比喻；分号清楚划分后果与当事人不知其来源两个分句。
