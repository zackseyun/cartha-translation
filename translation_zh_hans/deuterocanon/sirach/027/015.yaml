  text: The quarrel of the proud is bloodshed[a], and their reviling is grievous to hear.
translation:
  language: zh_hans
  text: 傲慢之人的争斗就是流血[a]；他们的辱骂听来令人痛苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“傲慢之人的战斗就是流血；他们的辱骂是恶劣的传闻。”希腊语的μάχη也可译为“战斗”；“听来令人痛苦”也可较直译为“是恶劣的传闻”。
    reason: 保留μάχη与ἀκοὴ μοχθηρά在词义和句法上的歧义。
lexical_decisions:
- source_word: ἔκχυσις αἵματος
  choice: 流血
  rationale: ἔκχυσις与αἵματος合成“倾流血液、流血”的惯用表达；“流血”在现代汉语中自然简洁，并保留暴力后果。
- source_word: μάχη
  choice: 争斗
  rationale: 可指战斗、打斗或争执；本节是智慧格言，并与“流血”相连，“争斗”既适用于人际冲突，也不削弱其可能升级为暴力的意味。
- source_word: ὑπερηφάνων
  choice: 骄傲人
  rationale: 属格指以高傲为特征的人。“骄傲人”保留道德评价，简洁而符合经文语体。
- source_word: διαλοιδόρησις
  choice: 彼此辱骂
  rationale: 该词表示辱骂、相互斥骂；“彼此辱骂”清楚呈现其言语攻击以及可能的交互意味。
- source_word: ἀκοὴ μοχθηρά
  choice: 听来令人痛苦
  rationale: ἀκοή可指听闻、所听见的事或传闻，μοχθηρά可指恶劣、痛苦、令人不快。正文按语境译为听觉与心理上的难受，同时以脚注保留“恶劣的传闻”这一结构上较形式对应的可能。
theological_decisions:
- issue: 本节是描写骄傲人的暴力冲突，还是正式战争
  choice: 译作关于骄傲所引发之人际争斗及伤害性言语的智慧观察
  alternative: 将μάχη译为“战斗”，按较正式的军事意义理解
  rationale: 希腊文容许“战斗”，但上下文的智慧格言性质更支持一般的人际争斗；“争斗”仍保留可能导致流血的暴力张力。
- issue: ἀκοὴ μοχθηρά是“听来痛苦”还是“恶劣的传闻”
  choice: 正文译为“听来令人痛苦”
  alternative: 译为“是恶劣的传闻”
  rationale: 两种理解在词汇上皆有根据。正文采用较符合辱骂言语之直接听觉效果的表达，脚注保留“传闻”义，避免消除原文歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“争斗就是流血”保留原文省略系词的凝练格言结构；“彼此辱骂”使较生僻的名词性表达自然化。
