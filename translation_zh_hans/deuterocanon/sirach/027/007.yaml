  text: Do not praise a man before he speaks his mind[b][a], for this is the test of men.
translation:
  language: zh_hans
  text: 不要在一个人表明自己的想法以前称赞他[a]，因为这是检验人的方法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要在思量以前称赞一个人”，或“不要在一个人的推理显明以前称赞他”。希腊文直译为：“在思想／推理以前，不要称赞一个人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ λογισμοῦ
  choice: 在一个人表明自己的想法以前
  rationale: λογισμός可指思想、推理或思量；原文省略了思想如何显明。正文用“表明自己的想法”传达箴言的实际含义，同时以脚注保留较为字面的可能译法。
- source_word: μὴ ἐπαινέσῃς
  choice: 不要……称赞
  rationale: μή加不定过去时虚拟语气构成禁令；“称赞”自然、直接。
- source_word: ἄνδρα
  choice: 一个人
  rationale: 希腊文为阳性单数，但在此箴言中泛指任何人；现代汉语“一个人”既自然，也不额外限定性别。
- source_word: οὗτος
  choice: 这才是
  rationale: 指向前述通过其思想或推理来认识一个人的做法；“才”凸显判断标准，但不改变指示代词的所指。
- source_word: πειρασμὸς
  choice: 考验
  rationale: 智慧文学语境中指检验、试验，而非诱惑。
- source_word: ἀνθρώπων
  choice: 对人的
  rationale: 将属格理解为受检验者，即对人的考验；“人”在汉语中自然涵盖众人。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。正文避免机械保留希腊文阳性形式，因为汉语“人”本身可作泛称；脚注保留λογισμός在“思想、推理、思量”之间的语义幅度。
