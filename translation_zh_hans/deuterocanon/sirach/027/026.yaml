translation:
  language: zh_hans
  text: 挖坑的，必掉进坑里；设下网罗的，必被网罗捕住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀρύσσων
  choice: 挖坑的
  rationale: 带冠词的现在分词作名词使用，泛指做出这一行为的人；“挖坑的”简洁自然，并保留箴言式语气。
- source_word: βόθρον
  choice: 坑
  rationale: βόθρος指挖出的坑或穴；此处带有害人陷阱的意象，“坑”在现代汉语中自然且能承载这一含义。
- source_word: εἰς αὐτὸν
  choice: 进坑里
  rationale: 代词按意义回指βόθρον。汉语明确复现“坑”，比直译为“其中”更自然，也不增加“同一个坑”等原文未明说的内容。
- source_word: ἐμπεσεῖται
  choice: 必掉
  rationale: 将来时表达行为的必然后果；“必掉进”符合汉语箴言体，也准确传达落入其中的方向。
- source_word: ὁ ἱστῶν
  choice: 设下……的
  rationale: ἵστημι在此指安设、布置捕捉人的器具；“设下”与“网罗”搭配自然。
- source_word: παγίδα
  choice: 网罗
  rationale: παγίς指诱捕用的罗网或圈套；“网罗”保留具体的捕捉意象和庄重的智慧文学语体。
- source_word: ἐν αὐτῇ
  choice: 被网罗
  rationale: 阴性代词明确回指παγίδα。汉语复现名词可避免“在其中被捕住”的生硬表达，并保持所设之物反过来捕住设网者的重点。
- source_word: ἁλώσεται
  choice: 必被……捕住
  rationale: 将来被动形式表示将遭捕获；“被……捕住”切合网罗意象，并保留被动关系。
