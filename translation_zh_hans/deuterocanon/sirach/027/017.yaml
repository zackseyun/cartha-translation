  text: Cherish a friend and be faithful to him; but if you reveal his secrets[a], you will certainly not pursue after him.
translation:
  language: zh_hans
  text: 要珍爱朋友，对他忠诚；但你若泄露他的秘密，就绝不会去追他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就绝不可去追他。”希腊文既可理解为说明后果，也可（可能性较小地）理解为禁止。
    reason: 保留末句强烈否定结构在结果陈述与禁令之间的语气歧义。
lexical_decisions:
- source_word: στέργον
  choice: 要珍爱
  rationale: 该命令式表达亲爱、珍重和忠贞的感情；“珍爱”既保留温厚深切的意味，也符合现代汉语箴言式劝诫的语气。
- source_word: φίλον
  choice: 朋友
  rationale: 这里是动词的宾语，指与人有友谊关系的人；汉语泛指性的“朋友”自然涵盖希腊文未带冠词的表达。
- source_word: πιστώθητι μετʼ αὐτοῦ
  choice: 对他忠诚
  rationale: 该中间／被动形式在此表示成为忠信可靠的人；μετά加属格表达与对方的关系。汉语用“对他忠诚”比直译“与他忠诚”自然，并保留关系性的忠信含义。
- source_word: ἀποκαλύψῃς
  choice: 泄露
  rationale: 动词本义是揭开、显露；用于朋友的隐秘之事时，“泄露”准确表达把本应保密的内容透露出去。
- source_word: τὰ μυστήρια αὐτοῦ
  choice: 他的秘密
  rationale: 在此人际语境中，μυστήρια指私密、机密之事，并非特指宗教奥秘；“秘密”清楚自然。
- source_word: οὐ μὴ
  choice: 绝不会
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不会”在现代汉语中保留其强调语气，并适合主文所采用的结果性理解。
- source_word: καταδιώξῃς ὀπίσω αὐτοῦ
  choice: 再去追他
  rationale: 该短语有“在他后面追赶”的形象。译文保留“追”的意象；“再”依语境表明泄密后关系已经破裂，但不把原文扩展为明确的“追回友谊”或“追上”。
theological_decisions:
- issue: 泄露朋友秘密后末句的语气和解释功能
  choice: 按预示后果的陈述理解：“就绝不会再去追他。”
  alternative: 按禁令理解：“就绝不可再去追他。”
  rationale: 第二人称虚拟式配合οὐ μή通常可表达强烈否定的预示，因而主文采用箴言式后果；但该形式在语境中也可能被听作强烈禁止，故以脚注保留这一较不可能但真实存在的歧义，不进一步断定是否意味着无法挽回友谊。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“要珍爱……对他忠诚”直接传达劝诫；后半句保留“追他”的原文意象，并用脚注呈现句法歧义。
