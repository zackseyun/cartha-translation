translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留原文前后对照的格言结构。“言谈”避免过于书面化的“论述”，也不把 διήγησις 限定为“叙事”；“始终是智慧”刻意保留希腊文名词谓语的凝练表达。脚注标记按正文出现顺序排列。
