  text: The speech of the godly is always wisdom[b][a], but the fool changes like the moon.
translation:
  language: zh_hans
  text: 虔敬之人的言谈始终是智慧[a]，愚昧人却像月亮一样变化[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“虔敬之人的话语时时都是智慧。”
    reason: lexical_alternative
  - marker: b
    text: 这里很可能是指月亮随月相圆缺而不断改变，以此形容愚昧人反复无常。
    reason: cultural_note
lexical_decisions:
- source_word: διήγησις
  choice: 言谈
  rationale: 此词可指叙述、讲述或话语；在这句智慧格言中，重点是虔敬之人所说的话，译作“言谈”自然且不过度限定为正式论述或故事。
- source_word: εὐσεβοῦς
  choice: 虔敬之人
  rationale: 该属格单数作名词使用，意为“虔敬者的”。“虔敬之人”保留其对神敬畏、敬虔的宗教伦理含义，同时符合现代汉语。
- source_word: διὰ παντός
  choice: 始终
  rationale: 这一习语表示“时时、一直”。“始终”简洁地传达持续性，并与后半句愚昧人的多变形成对照。
- source_word: σοφία
  choice: 智慧
  rationale: 希腊文直接以名词“智慧”作表语；保留名词形式，可维持原句凝练的格言色彩，而不改写成“有智慧的”。
- source_word: ἄφρων
  choice: 愚昧人
  rationale: 这是智慧文学中指缺乏明辨与见识之人的常用词。“愚昧人”比单纯的“笨人”更能表达其伦理和智慧层面的含义。
- source_word: ἀλλοιοῦται
  choice: 变化
  rationale: 该动词意为改变、变得不同。“变化”保留动词性，也自然呼应月亮外观随月相而改变的比喻。
- source_word: ὡς σελήνη
  choice: 像月亮一样
  rationale: 原文是明确的明喻；此译法自然，并保留月亮为何可作为多变象征的开放性，由脚注说明其可能所指。
