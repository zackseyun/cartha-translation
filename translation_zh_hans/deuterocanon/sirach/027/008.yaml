  text: If you pursue righteousness[a], you will attain it, and put it on like a robe of glory.
translation:
  language: zh_hans
  text: 你若追求正义[a]，必会得着它，并把它当作荣耀的长袍穿上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“正当的事”；也可译“公义”。希腊语所指较广，既包括个人的正直，也包括公正的行为。
    reason: lexical_alternative
lexical_decisions:
- source_word: διώκῃς
  choice: 追求
  rationale: 保留原词主动、持续追逐目标的力度，也符合现代汉语表达道德志向时的自然用法。
- source_word: τὸ δίκαιον
  choice: 正义
  rationale: 带冠词的中性单数可泛指正当、公正之事或正义这一伦理实质。“正义”既可涵盖个人行义，也可涵盖公正行为；脚注保留“正道”等可能表达。
- source_word: καταλήμψῃ
  choice: 得着
  rationale: 原词本有赶上、抓住之意；在追求伦理目标的语境中，“得着”自然地表达成功达到并取得，同时与前面的“追求”形成动态呼应。
- source_word: ἐνδύσῃ
  choice: 把它穿上
  rationale: 直接保留穿衣意象，并以代词明确指回“正义”，用语自然清楚。
- source_word: ποδήρη
  choice: 长袍
  rationale: 该词指长及脚部的衣服；“长袍”比单说“袍子”更能传达其长度和庄重形象。
- source_word: δόξης
  choice: 荣耀的
  rationale: 以定语结构自然表达属格关系，保留δόξα的尊荣、光彩意味及全句的崇高语调。
theological_decisions:
- issue: τὸ δίκαιον在智慧文学语境中的译法
  choice: 正义
  alternative: 正道；正当的事；公义
  rationale: 希腊语表达的范围较广，并不只限于司法公平，也包括个人正直和合宜行为。“正义”在现代普通话中较自然且保持伦理广度；脚注说明其他可行理解，避免将其限定为单一神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“追求—得着—穿上”保存原文连续而鲜明的动作意象；“荣耀的长袍”保留智慧文学的尊贵修辞。
