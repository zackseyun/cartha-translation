  text: Whoever reveals secrets destroys trust[b][a], and will never find a friend for his soul.
translation:
  language: zh_hans
  text: 泄露秘密[a]的人，毁掉了信任，再也找不到知心的朋友[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秘密”也可译作“隐秘之事”或“受托保守的私事”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“为他的心灵（生命）的朋友”。这是一种习语性的表达，意指真正与他亲近、贴心的朋友。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀποκαλύπτων
  choice: 泄露……的人
  rationale: 带冠词的现在分词表达一类惯常这样行事的人；此译保留箴言式的概括语气。
- source_word: μυστήρια
  choice: 秘密
  rationale: 本节谈论人际信任与友谊，指不应向外披露的私密之事；“秘密”比带神学色彩的“奥秘”更符合语境。
- source_word: ἀπώλεσεν
  choice: 毁掉了
  rationale: 不定过去时把后果表述为已然、确定的事实；“毁掉了”既保留动词的强度，也适合中文箴言语体。
- source_word: πίστιν
  choice: 信任
  rationale: 这里是泄密导致的关系破裂，所指是人与人之间的信任，而非神学意义上的“信仰”。
- source_word: οὐ μὴ εὕρῃ
  choice: 再也找不到
  rationale: οὐ μή加虚拟式构成强烈的将来否定；“再也找不到”自然传达其断然语气。
- source_word: φίλον πρὸς τὴν ψυχὴν αὐτοῦ
  choice: 知心的朋友
  rationale: 该短语直译近于“适合他心灵的朋友”，意指与他真正亲近、心灵相契的朋友；“知心的朋友”在现代汉语中自然传达这一关系。
theological_decisions:
- issue: 非神学语境中πίστις的译法
  choice: 信任
  alternative: 信仰；忠信；信用
  rationale: 上下文关乎泄露秘密和失去朋友，关系性的“信任”最贴合语义，也避免无根据地引入宗教含义。
- issue: πρὸς τὴν ψυχὴν αὐτοῦ的灵魂意象
  choice: 正文译为“知心的朋友”，脚注保留直译信息
  alternative: 适合他心灵的朋友；与他心灵相契的朋友；属于他灵魂的朋友
  rationale: 原短语具有一定习语性。正文采用自然且庄重的中文，脚注说明希腊文的字面表达，以免把“ψυχή”的意象完全隐藏。
- issue: 希腊文阳性形式在普遍性箴言中的处理
  choice: 采用不标明性别的汉语结构“……的人”
  alternative: 他；那人
  rationale: 汉语定语结构无需标示性别即可准确表达希腊文的泛指作用，不改变命题适用于所有人的范围。
translation_notes:
  register: 采用现代、简洁而庄重的箴言语体。“泄露秘密—毁掉信任—失去知心朋友”形成清楚的因果推进；保留强烈否定语气，同时通过脚注呈现原文“心灵”的意象与μυστήρια的词义范围。
