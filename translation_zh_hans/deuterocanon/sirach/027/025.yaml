  text: Whoever throws a stone upward throws it on his own head, and a treacherous blow opens wounds.
translation:
  language: zh_hans
  text: 向高处抛石头的，是把石头抛到自己头上；诡诈的一击必使伤口裂开。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ὕψος
  choice: 向高处
  rationale: 直译其方向含义，表达把石头向上抛出的动作，现代汉语自然清楚。
- source_word: ἐπὶ κεφαλὴν αὐτοῦ
  choice: 向自己的头
  rationale: 保留原文动作方向及反害己身的鲜明意象，不增补结果性的解释。
- source_word: πληγὴ δολία
  choice: 诡诈的一击
  rationale: δολία 表示带有欺骗、阴险或背信性质；“诡诈”保留其道德色彩，而“一击”对应 πληγή 在此处的打击义。
- source_word: διελεῖ τραύματα
  choice: 必使伤口裂开
  rationale: διαιρέω 的核心义为分开、劈开；结合 τραύματα，译作“使伤口裂开”既保留其具体意象，也符合现代汉语表达。“必”体现未来式在箴言语境中的确定后果。
theological_decisions:
- issue: 报应意象是否解释为神圣审判
  choice: 保留行为反噬自身的具体图像，不明说审判主体
  alternative: 译成“害人的必害自己”或增明为上帝的惩罚
  rationale: 原文只陈述行为及其后果，没有明说上帝施行审判；不应把箴言意象扩展为原文未明言的教义解释。
translation_notes:
  register: 采用简洁、庄重而通俗的现代标准汉语；两分句保持原文平行而警策的箴言节奏。
