  text: Birds settle with their own kind[b][a], and truth returns to those who practice it.
translation:
  language: zh_hans
  text: 飞鸟与同类一起栖息，真理也回到践行真理的人那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回到”也可译作“再来到”。希腊文把真理拟人化，说它回到那些将真理付诸实行的人那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὰ
  choice: 飞鸟
  rationale: 该中性复数泛指鸟类；“飞鸟”自然、庄重，也保留箴言中的生动意象。
- source_word: πρὸς τὰ ὅμοια αὐτοῖς
  choice: 与同类一起
  rationale: 该短语表达相似和同类相聚的意思；此译符合现代汉语习惯，又不过度具体化。
- source_word: καταλύσει
  choice: 栖息
  rationale: 该动词可指投宿、歇息或驻留；用于飞鸟时，“栖息”最贴合语境，同时保留落脚安歇之意。
- source_word: ἀλήθεια
  choice: 真理
  rationale: 该名词基本义为“真理、真实”；“真理”保留其宽广含义以及句中的拟人色彩。
- source_word: πρὸς τοὺς ἐργαζομένους αὐτὴν
  choice: 践行真理的人
  rationale: ἐργάζομαι带直接宾语时可表示实行、实践；中文重复“真理”比使用可能指代含混的“它”更清楚。
- source_word: ἐπανήξει
  choice: 回到
  rationale: 未来时动词表示回来、返回；“回到”保留了原文所含的返回意象和道德回应关系。
theological_decisions:
- issue: 真理的拟人化与伦理回应
  choice: 译为“真理也回到践行真理的人那里”
  alternative: 真理临到践行真理的人；真理与践行真理的人相伴
  rationale: ἐπανήξει明确含有返回、再来的意思，不只是一般的临到或相伴。保留“回到”可呈现智慧文学中真理仿佛主动回应实行真理之人的拟人表达，而不进一步界定其运作方式。
translation_notes:
  register: 采用现代、清晰而庄重的箴言体。“飞鸟”“栖息”保持具体意象；后半句保留原文的拟人和“返回”张力。
