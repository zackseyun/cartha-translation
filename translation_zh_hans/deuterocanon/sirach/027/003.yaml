  yaml_path: translation/deuterocanon/sirach/027/003.yaml
  text: If he does not hold fast with diligence in the fear of the Lord[a], his house will quickly be overthrown.
translation:
  language: zh_hans
  text: 人若不怀着对主的敬畏殷勤持守，他的家[a]必很快倾覆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”也可指“家室”或一个人的家庭、家业。希腊文οἶκος既可表示房屋，也可表示家庭及其整体基业。
    reason: 保留原文οἶκος在住所、家室与家庭基业之间的词义宽度。
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: 人若不
  rationale: 以现代汉语的条件句自然表达希腊文否定条件结构，并补出泛指主语“人”，不把经文限定为某个特定男子。
- source_word: ἐν φόβῳ Κυρίου
  choice: 怀着对主的敬畏
  rationale: 保留智慧文学中“敬畏主”的核心措辞，同时用“怀着”自然表达其作为持守时的内在姿态；不将其弱化为单纯的尊敬或虔诚。
- source_word: κρατήσῃ
  choice: 持守
  rationale: κρατέω在此表示牢牢把持、坚定坚持。“持守”简洁庄重，并保留原文没有明说持守对象这一特点。
- source_word: κατὰ σπουδήν
  choice: 殷勤
  rationale: 表达认真、热切而不懈的态度，适合作状语修饰“持守”，也符合现代汉语圣经智慧文学的语体。
- source_word: ἐν τάχει
  choice: 很快
  rationale: 直接表达结果迅速发生，比“仓促”更准确，也比“顷刻”更贴近现代标准汉语。
- source_word: καταστραφήσεται
  choice: 必……倾覆
  rationale: 保留被推翻、崩塌而归于败亡的鲜明意象；汉语以自然的主动形态表达希腊文将来被动，语义不变。“必”体现将来陈述的确定语气。
- source_word: αὐτοῦ ὁ οἶκος
  choice: 他的家
  rationale: “家”既可使人想到住所，也可涵盖家人、家业和家庭体系，较好保存οἶκος在此未被限定的语义宽度。
theological_decisions:
- issue: “敬畏主”的含义
  choice: 保留“敬畏主”这一传统智慧文学表达
  alternative: 敬重主；虔诚事奉主
  rationale: φόβος Κυρίου兼有畏惧、尊崇和顺服的神学分量；直译核心表达能保持经文互文联系，避免把它缩减成单纯情绪或一般虔敬。
- issue: “家”的范围
  choice: 正文采用含义较宽的“家”，并以脚注说明
  alternative: 家室；家族；家业；房屋
  rationale: οἶκος可指建筑物，也可指家庭成员或一个人的家庭与产业体系。上下文不足以强行限定，故保留其真实歧义。
- issue: “持守”的对象
  choice: 不补出具体宾语
  alternative: 持守敬畏主的心；坚守正道
  rationale: 希腊文本没有明说κρατήσῃ所持守的对象。正文保留这种省略，避免擅自把对象解释为某种德行、道路或信条。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“怀着对主的敬畏殷勤持守”保持原句紧凑，不补足原文省略的持守对象；“倾覆”与“家”形成清晰的崩塌意象，同时仍可用于家庭或家业的败落。
