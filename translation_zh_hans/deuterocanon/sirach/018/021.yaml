  text: Before you become sick[a], humble yourself, and in the time of sins show repentance.
translation:
  language: zh_hans
  text: 在你患病以前，要谦卑自己；在犯罪之时，要显出悔改[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悔改”也可译为“回转”或“转回”。希腊语ἐπιστροφή可指回转；因其紧接着提到犯罪，这里译为“悔改”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἀρρωστῆσαί σε
  choice: 你还没有患病以前
  rationale: πρίν加不定式表示某事发生之前；ἀρρωστέω在此指患病或身体衰弱。译文保留其时间先后与进入患病状态的意味。
- source_word: ταπεινώθητι
  choice: 要谦卑自己
  rationale: 虽为被动形式的命令语气，在劝诫语境中可有反身意味，指主动使自己谦卑，而非仅仅遭受羞辱。
- source_word: ἐν καιρῷ ἁμαρτημάτων
  choice: 在犯罪的时候
  rationale: καιρός表示时机或时候；ἁμαρτημάτων为复数属格。中文以动词性表达“犯罪”较自然，同时不把含义限定为抽象的罪性。
- source_word: δεῖξον
  choice: 要显出
  rationale: 对应“显示、表明”，保留悔改须被显明的语气。
- source_word: ἐπιστροφήν
  choice: 悔改
  rationale: 本词本义可指转回、回转；因紧邻“犯罪”，此处译作“悔改”最能表达道德劝诫，但以脚注保留较字面的可能。
theological_decisions:
- issue: ἐπιστροφήν与ἁμαρτημάτων的关系
  choice: 悔改
  alternative: 回转、归回
  rationale: 上下文明确涉及犯罪，因此“悔改”自然表达从罪中回转之意；脚注保留该词较宽泛的“回转”语义，避免把它过度技术化。
- issue: ταπεινώθητι的语态效力
  choice: 谦卑自己
  alternative: 被降卑
  rationale: 智慧文学中的命令在此指向受劝者自愿采取的态度；反身译法符合语境，同时不否认希腊语形式上的被动形态。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体；用“患病”而非较口语的“生病”，用“显出悔改来”保留δεῖξον的明确动作性。脚注标记置于所释词句之后。
