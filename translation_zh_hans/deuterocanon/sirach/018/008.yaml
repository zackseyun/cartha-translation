  naturalness: 修订文本仍为简洁、庄重的现代汉语。“他的善是什么？他的恶是什么？”比“他有什么善，又有什么恶？”更直接对应原文重复的 τί 和所属结构，同时不排除道德、祸福或广义好坏的理解。
  terminology: “用处”恰当对应 χρῆσις，未引入“目的”的额外目的论含义；“善／恶”适当地保留 ἀγαθόν／κακόν 的宽广对照。无需脚注；本节正文中的这些词在汉语中可维持必要的涵盖范围。
