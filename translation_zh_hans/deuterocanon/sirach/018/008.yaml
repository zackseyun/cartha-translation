  text: What is a man[a], and what is his use? What is his good[c][b], and what is his evil?
translation:
  language: zh_hans
  text: 人是什么？他有什么用处？他的善是什么？他的恶是什么？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: 什么
  rationale: 重复的疑问代词引出关于人的意义、作用及善恶的反问；“什么”保留原文简洁而探究的语气。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 单数名词在此泛指人或作为个体的人；现代汉语用“人”自然涵盖泛指意义，也保留原文单数式的凝练表达。
- source_word: χρῆσις
  choice: 用处
  rationale: 该词可指使用、功用或实际价值。“用处”最直接地保留其实用性含义；译作“目的”会加入原文未必具有的目的论色彩。
- source_word: ἀγαθόν
  choice: 善
  rationale: 中性名词实体化，与 κακόν 对举；“善”保留道德和广义良善两方面的空间，而不缩窄为“益处”。
- source_word: κακόν
  choice: 恶
  rationale: 与 ἀγαθόν 构成鲜明对举。“恶”保留智慧文学中的道德分量，但该希腊词也可宽泛指坏处、祸害或有害之事。
- source_word: αὐτοῦ
  choice: 他有什么
  rationale: 重复的属格代词均回指单数的“人”。汉语以“他有什么……”表达所属关系，比生硬的“他的……是什么”更自然，并维持两问的平行结构。
theological_decisions:
- issue: 泛指的人及其单数表达
  choice: 人……他
  alternative: 人类……其／他们
  rationale: 原文以单数 ἄνθρωπος 和重复的单数代词谈论一般意义上的人。采用“人……他”既保留个体化、箴言式的表达，也不把原文改成复数或抽象集合名词。
- issue: κακόν 的道德意义与广义不利含义
  choice: 恶
  alternative: 坏处／祸害
  rationale: ἀγαθόν 与 κακόν 的对举可引发道德反思，“善／恶”最能保留这种力度；同时不将 κακόν 限定为纯粹的道德邪恶，其更宽的含义在语言说明中予以承认。
- issue: χρῆσις 是功用还是目的
  choice: 用处
  alternative: 目的／益处／功用
  rationale: “用处”贴近该词的使用、功用和实际价值范围；“目的”容易暗示预定使命，超出原文必然表达的内容。
translation_notes:
  register: 采用现代、简洁而庄重的汉语，保留希腊文两组并列反问及“善／恶”的紧凑对照。未加脚注，因为主要歧义可由正文的宽义词汇保留，且正文没有需要补充说明的标记。
