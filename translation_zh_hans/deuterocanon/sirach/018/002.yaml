lexical_decisions:
- source_word: Κύριος
  choice: 主
  rationale: Κύριος在此作主语，是对上帝的常用尊称；译作“主”简洁、自然，也符合现代中文圣经语体。
- source_word: μόνος
  choice: 惟有
  rationale: μόνος强调排他性。将其译作“惟有”置于主语之前，既符合现代汉语表达，也保留“只有主、别无他者”的语义。
- source_word: δικαιωθήσεται
  choice: 必显为公义
  rationale: 这是δικαιόω的将来时被动形式，可有“被判为义、被证实为义、得到申明”等含义。“显为公义”保留被动或显明性的张力，并明确呈现“公义”这一核心概念，同时避免“称义”在现代中文中可能带入的特定教义技术含义。
theological_decisions:
- issue: 智慧文学语境中δικαιωθήσεται的译法
  choice: 必显为公义
  alternative: 必被判为义；必得以昭雪；必被证实为公义
  rationale: 原动词兼具司法宣告和证明、申明的可能含义。正文采用“显为公义”，不把含义限缩为罪人蒙宣告为义，也不完全转向“昭雪”所强调的公开平反；脚注保留其他可能。
- issue: validation标为major_mismatch所反映的源文本不确定性
  choice: 严格按所给现存希腊文短句翻译，不作扩写
