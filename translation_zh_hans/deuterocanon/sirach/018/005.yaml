  text: Who can number the might of his majesty? And who can add to recounting his mercies?[a]
translation:
  language: zh_hans
  text: 谁能数尽他威严的大能？谁又能继续详尽述说他的种种怜悯？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “继续详尽述说”直译为“加以／增添来详尽述说”。希腊文“增添”在这里指在叙述上进一步添加，即继续述说下去；“详尽述说”含有充分、详细讲述的意思。
    reason: 说明προσθήσει与ἐκδιηγήσασθαι的组合所保留的“进一步／继续叙述”意象，并交代后者的强化语义。
lexical_decisions:
- source_word: κράτος
  choice: 大能
  rationale: 表示彰显出来的力量或权能；“大能”在现代汉语中自然庄重，也适合指上帝的能力。
- source_word: μεγαλωσύνης
  choice: 威严
  rationale: 与κράτος构成属格关系，指与上帝崇高威荣相称的大能；“威严”保留其尊荣色彩。
- source_word: ἐξαριθμήσεται
  choice: 能数尽
  rationale: 此处将来时用于反问，意为逐一数算直到穷尽；“数尽”简洁地传达不可胜数之意。
- source_word: προσθήσει
  choice: 又能……述说到底
  rationale: 本义为“增添、继续”，与不定式连用表示继续讲述；正文采用自然汉语表达其延续乃至穷尽叙说的含义，同时以脚注保留原文意象。
- source_word: ἐκδιηγήσασθαι
  choice: 述说到底
  rationale: 复合动词带有详尽叙说的强化意味；“述说到底”既通顺，又保留充分、持续讲述的语气。
- source_word: τὰ ἐλέη αὐτοῦ
  choice: 他的种种怜悯
  rationale: 复数ἐλέη可指多次或多方面的怜悯作为；“种种怜悯”保留复数含义，避免仅理解为一种内在情感。
theological_decisions:
- issue: 上帝所指与庄重措辞
  choice: 用“他”指上帝，并以“威严”“大能”“怜悯”等词保持崇高语气
  alternative: 使用特殊敬称代词“祂”，或把μεγαλωσύνη平译为“伟大”
  rationale: 希腊文的敬意主要由词汇体现，并无特殊神性代词；现代标准汉语用“他”可避免引入后起的书写惯例，而庄重名词仍保留神学分量。
- issue: προσθήσει与ἐκδιηγήσασθαι的关系
  choice: 正文译为“述说到底”，脚注说明直译及“继续述说”的可能
  alternative: 直译为“加以述说”或译为“继续详尽述说”
  rationale: 原文表达带有继续增添叙述的意象，也暗示无人能将上帝的怜悯说尽；正文采用自然表达，脚注保留其真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。两个反问句保持原文的平行结构；“数尽”与“述说到底”相互呼应，突出人的言语无法穷尽上帝的大能与怜悯。
