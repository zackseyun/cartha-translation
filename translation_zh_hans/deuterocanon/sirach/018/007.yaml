base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/007.yaml
  text: When a man has finished[a], then he is just beginning; and when he stops[b], then he will be at a loss.
translation:
  language: zh_hans
  text: 人做完时[a]，才刚开始；人停下时，就会茫然无措[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“人完成（某事）时”。希腊语动词可指完成、做完或使某事达到终点；原文没有说明所完成的对象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“就会困惑”或“就会不知所措”。希腊语可表示无路可走、无计可施或找不到答案。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ……时
  rationale: 引出概括性的时间条件；汉语用“……时”自然简洁，符合箴言式表达。
- source_word: συντελέσῃ
  choice: 完成
  rationale: 表达做完、达到终点或使之完结。原文没有明说所完成的具体对象，因此保留其开放性，并与下文“开始”形成悖论。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 这里是单数类指，指一般的人，并不限定男性；现代汉语以“人”最自然准确。
- source_word: τότε ἄρχεται
  choice: 才刚刚开始
  rationale: 基本义为“那时开始”。“才刚刚”自然地凸显完成与开始之间的悖论，但不补入原文未明说的对象。
- source_word: παύσηται
  choice: 停下来
  rationale: 表示停止、止息；“停下来”是现代汉语中清楚自然的说法，并与前半句保持平衡。
- source_word: ἀπορηθήσεται
  choice: 就会茫然无措
  rationale: 该词可表示陷入困惑、无路可走或不知如何继续。“茫然无措”兼顾认知上的困惑与行动上的无从推进。
theological_decisions:
- issue: 这则箴言所表达的人之有限
  choice: 保留其宽泛的悖论意味：人以为完成之时其实才开始，停止之时反而陷入茫然。
  alternative: 将其具体解释为人的劳作永无止境，或专指死亡终止人的活动。
  rationale: 希腊文简练含蓄，没有明确提到劳作、知识或死亡；译文不把开放的智慧箴言收窄为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两分句保持对称，以“完成／开始”和“停下／茫然无措”呈现原文张力；不增补劳作、知识或死亡等原文未明说的对象。
