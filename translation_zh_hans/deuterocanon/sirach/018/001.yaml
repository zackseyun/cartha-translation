  yaml_path: translation/deuterocanon/sirach/018/001.yaml
  text: The one who lives forever created all things at once[a].
translation:
  language: zh_hans
  text: 那永远活着的一位将万物一并创造出来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一并”也可译作“共同地”或“作为一个整体”。希腊文 κοινῇ 表达简练，可能强调万物作为整体受造。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ζῶν
  choice: 活着的那一位
  rationale: 带冠词的现在分词作名词用，指“那位活着者”。译作“活着的那一位”既保留描述性称谓，也符合现代汉语表达；不直接补出“上帝”或“主”。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该短语表示持续无尽的时间；“永远”简洁自然，并保留其恒久之意。
- source_word: ἔκτισεν
  choice: 创造了
  rationale: κτίζω 在宇宙创造语境中表示使万有得以存在，“创造”比“制造”或“建立”更准确。
- source_word: τὰ πάντα
  choice: 万物
  rationale: 指一切存在之物；“万物”全面而庄重，也符合现代汉语宗教与文学语体。
- source_word: κοινῇ
  choice: 一并
  rationale: 该副词可表示“共同地、合在一起、作为整体”。“一并”自然地表达对万物整体性的强调，同时不把含义过度限定为严格的时间概念“一次完成”。
theological_decisions:
- issue: 原文没有明说主语是“上帝”或“主”
  choice: 永远活着的那一位
  alternative: 永活的上帝；永远活着的主
  rationale: 希腊文以描述性的分词短语称呼主语，并未使用 θεός 或 κύριος。正文保留这种间接称谓，让其神学身份由上下文表明，而不擅自补入神名或称号。
- issue: κοινῇ 对创造方式或范围的修饰
  choice: 一并
  alternative: 同时；共同；作为一个整体
  rationale: 原词表达压缩，可能强调万物合在一起、共同地或作为整体受造。正文采用含义较宽的“一并”，脚注保留其他可能，不把它限定为关于创造时间长短的教义陈述。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“永远活着的那一位”保留原文描述性称谓；“万物”维持经文应有的凝练感。正文中的脚注标记与脚注完全对应。
