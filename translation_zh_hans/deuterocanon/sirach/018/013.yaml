  yaml_path: translation/deuterocanon/sirach/018/013.yaml
  text: A man's mercy is for his neighbor[a], but the Lord's mercy is for all flesh[b]; he rebukes and disciplines and teaches and turns back his flock like a shepherd.
translation:
  language: zh_hans
  text: 人的怜悯归于自己的邻舍，主的怜悯却归于一切血肉之躯[a]；他责备、管教、教导，又像牧人领回自己的羊群[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切血肉之躯”直译为“一切肉体”，是宽泛的圣经表达；也可理解为“全人类”，或广义地指所有生灵。
    reason: lexical_alternative
  - marker: b
    text: “领回”也可译作“使……回转”或“使……复原”。希腊文直指“转回”；牧人图像使人想到把走迷的羊带回。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: 怜悯
  rationale: 既表达对困苦者的慈悲，也保留伦理与神学分量，并使人的怜悯与主的怜悯形成对应。
- source_word: ἀνθρώπου
  choice: 人的
  rationale: 以现代汉语自然表达泛指的单数“人”，不把原文无根据地限定为男性。
- source_word: πλησίον
  choice: 邻舍
  rationale: 这是伦理语境中 πλησίον 的常用圣经译语，表示与自己有切近关系的人。
- source_word: Κυρίου
  choice: 主的
  rationale: 直接对应 Κυρίου，并与前句“人的”构成平行对比。
- source_word: πᾶσαν σάρκα
  choice: 一切有血肉的
  rationale: 保留“所有血肉”这一宽广的圣经表达，同时使现代中文可懂，不把范围擅自缩限为全人类。
- source_word: ἐλέγχων
  choice: 责备
  rationale: 表达指出过错并加以纠正的行动，适合本节带有牧养意味的语境。
- source_word: παιδεύων
  choice: 管教
  rationale: 兼有纠正与培育之意，比单纯的惩罚更能体现 παιδεύω 的形成性作用。
- source_word: διδάσκων
  choice: 教导
  rationale: 直接而自然地表达传授和指导。
- source_word: ἐπιστρέφων
  choice: 使……回转
  rationale: 保留“转回、返回”的基本含义，并与牧人使走迷的羊群归回的图像相合，避免采用带有后期技术性意味的宗教术语。
- source_word: ὡς ποιμήν
  choice: 像牧人一样
  rationale: 明确保留原文的明喻，并自然修饰使羊群回转的行动。
- source_word: τὸ ποίμνιον αὐτοῦ
  choice: 自己的羊群
  rationale: 自然呈现所属关系和牧养意象；不刻意表达希腊词形可能含有的指小色彩。
theological_decisions:
- issue: πᾶσαν σάρκα 的范围
  choice: 译作“一切有血肉的”，保留可涵盖所有受造生命的宽广说法
  alternative: 全人类；所有生灵
  rationale: 原文以宽泛的圣经惯用语与人的怜悯所及的“邻舍”形成对比。正文不将其限定为人类，也不武断断定必然包括每一种动物。
- issue: ἐπιστρέφων 的牧养含义
  choice: 使自己的羊群回转
  alternative: 领回自己的羊群；使自己的羊群复原
  rationale: “回转”贴近动词本义，并保留它既可指改变方向、也可指被带回的张力；牧人比喻使其归回的意味清楚可见。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半句保持“人的怜悯／主的怜悯”的平行结构；后半句以连续动词再现希腊文四个现在分词的节奏，并让“像牧人一样”自然连接最后的牧养行动。
