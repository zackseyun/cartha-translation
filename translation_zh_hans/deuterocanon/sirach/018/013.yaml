revisions:
- from: 人的怜悯临到自己的邻舍，主的怜悯却临到一切有血肉的[a]；他责备、管教、教导，又像牧人一样使自己的羊群回转[b]。
  to: 人的怜悯归于自己的邻舍，主的怜悯却归于一切血肉之躯[a]；他责备、管教、教导，又像牧人领回自己的羊群[b]。
  rationale: 修订主要改善现代汉语搭配，并使“all flesh”的中文表达更自然且保留原文的语义开放性。“像牧人领回自己的羊群”将比喻直接连于最后一项行动，忠实反映牧人召回走迷羊群的画面，未引入技术性教义含义。
  reviewer_model: gpt-5.6-terra
