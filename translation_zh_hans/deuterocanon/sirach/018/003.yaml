  yaml_path: translation/deuterocanon/sirach/018/003.yaml
  text: He has allowed no one to proclaim his works.
translation:
  language: zh_hans
  text: 他没有准许任何人宣告他的作为。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他没有使任何人能够宣告他的作为”，或“他没有授予任何人宣告他作为的权利。”希腊文动词较少见，可能含准许、授予或使之能够之意。
    reason: 保留罕见动词 ἐξεποίησεν 在准许、授予与使之能够之间的词义可能性。
lexical_decisions:
- source_word: οὐθενί
  choice: 任何人
  rationale: 这是带否定意义的不定代词的与格，与谓语连用，表示这项准许、授予或使之能够并未临到任何人；汉语以“没有……任何人”表达自然。
- source_word: ἐξεποίησεν
  choice: 准许
  rationale: 此动词较少见，在这里支配不定式，可表示使某人得以做某事，也可能含准许、授予或使之能够之意。“准许”使正文简明自然，同时以脚注保留其词义幅度。
- source_word: ἐξαγγεῖλαι
  choice: 宣告
  rationale: ἐξαγγέλλω 的不定式表示公开宣布、传扬或述说；“宣告”保留其公开而郑重的表达色彩。
- source_word: τὰ ἔργα αὐτοῦ
  choice: 他的作为
  rationale: 直译该复数名词短语；“作为”在现代汉语中自然，也保留了对上帝所行之事的概括性，没有缩窄为道德意义上的行为。
theological_decisions:
- issue: 无人宣告上帝作为这一陈述的范围
  choice: 正文说，没有任何人蒙准许宣告他的作为。
  alternative: 没有任何人被赋予能力、受委任或得以宣告他的作为。
  rationale: 希腊文措辞简练，且 ἐξεποίησεν 罕见，其含义可能游移于准许、授予和使之能够之间。正文不加入“完全”等原文未明说的限定，也不把本节扩大为关于上帝绝对不可知的教义断言；脚注保留真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“宣告他的作为”保持经文的凝练和公开宣述的语气；正文不补入原文没有明确表达的“完全”。
