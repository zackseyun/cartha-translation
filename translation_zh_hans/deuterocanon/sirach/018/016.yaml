  text: Before you make a vow[a], prepare your vow[b], and do not be like one who tests Yahweh.
translation:
  language: zh_hans
  text: 许愿以前，要先预备好你所许的愿[a]；不可像那试探雅威的人一样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你所许的愿”一语在希伯来文本中略显难解，也可按语境理解为“你所许诺的事”。意思可能是：许愿之前，应当先准备好履行誓愿。
    reason: lexical_alternative
  - marker: b
    text: 希腊文传统在这里有显著不同，作：“露水岂不使炎热消退吗？照样，一句话胜过一件礼物。”这表明希腊文传统所依据的文本形态与现存希伯来文不同。
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תִּדּוֹר
  choice: 许愿以前
  rationale: בְּטֶרֶם 表示某事发生之前，תִּדּוֹר 是 נדר“许愿”的未完成式；合译简洁自然，并保留先后次序。
- source_word: הָכֵן נִדְרֶךָ
  choice: 要将你的誓愿预备妥当
  rationale: הָכֵן 是“预备、使妥当”的命令式，נִדְרֶךָ 直指“你的誓愿”。译文尽量保留原文表达，不在正文中直接加入“履行”，脚注则说明其语境含义。
- source_word: בַּל תִּהְיֶה
  choice: 不可……的人
  rationale: בַּל 与未完成式构成禁令；“不可”符合智慧文学劝诫的庄重语气。
- source_word: כִּמְנַסָּה
  choice: 像试探……的人
  rationale: נסה 可指试验、考验或试探；此处涉及人对上帝的不当行为，“试探”既贴合语境，也保留其伦理张力。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 原文直接使用四字神名，采用现代汉语对 Yahweh 的音译“雅威”，将其作为专名呈现，而不改译为称号。
theological_decisions:
- issue: 四字神名 יְהֹוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 希伯来文此处使用神的专名。译作“雅威”较接近学界通常重构的读音，并保留专名性质；不以“上主”等称号代替。
- issue: “试探雅威”与许愿的关系
  choice: 保留原文简洁而未明说的关联
  alternative: 解释为许愿后不履行就是试探上帝
  rationale: 上下句暗示许愿者若未预备履行，便是在试探上帝，但希伯来文没有把这一推论完全说透，因此正文不增添明确的因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“将……预备妥当”略带书面色彩，用以保留希伯来文命令句的简洁力度；分号呈现劝诫的两部分。所有脚注标记均置于正文中。
