  text: Before judgment[a], examine yourself[b], and in the hour of visitation you will find atonement.
translation:
  language: zh_hans
  text: 审判以前，要省察自己；在受察看的时候[a]，你必得蒙赎罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受察看”也可译作“受鉴察的时候”“眷顾的时候”或“清算的时候”；希腊语可指受审视的时刻，也可能暗示上帝的临到或介入。
    reason: lexical_alternative
  - marker: b
    text: “赎罪”也可译作“除罪”或“挽回祭”；此词指罪责得以除去，并涉及关系的恢复。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ κρίσεως
  choice: 审判以前
  rationale: κρίσις可指审判、裁断或司法性的评断。“审判以前”保留其宽广的道德与司法含义，不把它收窄为“定罪”。
- source_word: ἐξέταζε σεαυτόν
  choice: 要省察自己
  rationale: ἐξέταζε是要求检验、细察的命令式，σεαυτόν为反身宾语。“省察自己”符合现代汉语表达，也准确传达自我审视之意。
- source_word: ἐν ὥρᾳ ἐπισκοπῆς
  choice: 在察访的时刻
  rationale: ἐπισκοπή可表示察看、检验、监督或临到性的察访；“察访”既能表达审视，也可带有上帝介入或追究的意味，避免只按积极的“眷顾”或单纯的“检查”来理解。
- source_word: εὑρήσεις
  choice: 你必得着
  rationale: εὑρήσεις直译为“你将找到”。在“赎罪”这一宾语前，“必得着”是自然的现代汉语，同时保留将来结果的语气。
- source_word: ἐξιλασμόν
  choice: 赎罪
  rationale: ἐξιλασμός指除去罪责、平息冒犯并恢复关系的行动或途径。“赎罪”简明易懂，也保留其祭祀与和好的神学分量；其他可能含义列入脚注。
theological_decisions:
- issue: 智慧文学语境中ἐπισκοπή的含义
  choice: 察访，含有审视及可能的神圣介入或追究意味
  alternative: 检查；鉴察；眷顾；清算
  rationale: 此词可能指人受察验、被追究的决定性时刻，也可能暗含上帝的临到。“察访”保留这些张力，不把经文限定为纯粹的惩罚、监督或恩惠性眷顾。
- issue: ἐξιλασμόν的表达
  choice: 赎罪
  alternative: 除罪；挽回；消除罪责
  rationale: 原词兼有除去罪责和恢复关系的意涵。“赎罪”在普通现代汉语中较为清楚，并保留原文的礼仪与和好色彩；脚注说明其语义范围，避免限定于某一种赎罪理论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“省察自己”保留智慧文学的劝诫语气；“察访”有一定圣经语体色彩，但仍易于普通读者理解，并能承载原文ἐπισκοπή的刻意多义性。
