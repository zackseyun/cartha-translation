  text: A foolish ingrate reproaches[a], and the gift of an envious man wears out the eyes.
translation:
  language: zh_hans
  text: 愚昧而不知感恩的人出言责难；嫉妒者的礼物耗损眼睛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耗损眼睛”直译希腊文；其具体所指未明。这里的“嫉妒者”也可带“有恶眼的人”之意；在施赠的语境中，可指吝啬或不情愿施与的人。
    reason: 保留 βασκάνος 的“嫉妒／恶眼”语义范围，并保留 ἐκτήκει ὀφθαλμούς 的字面意象及其未明的解释空间。
lexical_decisions:
- source_word: μωρὸς ἀχάριστος
  choice: 愚昧又忘恩的人
  rationale: 保留两个并列的道德特征，并以现代汉语自然表达；“忘恩”比单纯“不感恩”更有箴言式的道德力度。
- source_word: ὀνειδιεῖ
  choice: 出言辱骂
  rationale: 该动词表示责骂、羞辱或以言语加以责难；此译兼顾动作的言语性质和贬损意味。
- source_word: δόσις
  choice: 礼物
  rationale: 此处既可指给予的行为，也可指所给之物；结合所有格“嫉妒者的”，译作“礼物”最自然。
- source_word: βασκάνου
  choice: 嫉妒者
  rationale: 紧贴希腊词表示嫉妒、恶眼之人的基本意义，不在正文中将其限定为吝啬者；相关语义在脚注说明。
- source_word: ἐκτήκει ὀφθαλμούς
  choice: 使人望眼欲穿
  rationale: 原文直译为“耗损眼睛”。汉语成语保留眼睛因久候而受煎熬的形象，适合礼物被勉强或迟延给予的语境，同时用脚注保留字面表达及其歧义。
