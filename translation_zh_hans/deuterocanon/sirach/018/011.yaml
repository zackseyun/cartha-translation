  text: Therefore the Lord was patient with them, and poured out his mercy upon them.
translation:
  language: zh_hans
  text: 因此，主对他们长久忍耐，并把自己的怜悯倾倒在他们身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 表示由上文引出的因果或推论关系；“因此”简洁自然，并保留上下文的逻辑衔接。
- source_word: ἐμακροθύμησεν
  choice: 耐心宽容
  rationale: 该动词表示长久忍耐、不轻易发怒；“耐心宽容”兼顾忍耐与克制怒气的含义，也符合现代汉语表达。
- source_word: Κύριος
  choice: 主
  rationale: 作为对上帝的称号，译作“主”简明、庄重，并符合其在此处的特指用法。
- source_word: ἐπʼ αὐτοῖς
  choice: 他们
  rationale: 与“耐心宽容”搭配时，汉语直接以“他们”作对象最自然，无须机械译出介词。
- source_word: ἐξέχεεν
  choice: 倾倒
  rationale: 保留“倒出、倾注”的具体意象，没有弱化为一般性的“赐下”。
- source_word: τὸ ἔλεος αὐτοῦ
  choice: 自己的怜悯
  rationale: ἔλεος可指怜悯或慈悲；“怜悯”清楚表达向软弱者施恩的含义。“自己的”明确回指主。
- source_word: ἐπʼ αὐτοὺς
  choice: 在他们身上
  rationale: 与“倾倒”共同保留施予临到对象身上的空间意象，同时符合自然汉语。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 上主
  rationale: 原文使用神圣称号κύριος；“主”直接、庄重，不额外引入特定宗派的惯用形式。
- issue: ἐμακροθύμησεν所表达的神圣忍耐
  choice: 耐心宽容
  alternative: 长久忍耐／不轻易发怒
  rationale: 原词兼有恒久忍耐和延缓发怒的语义。“耐心宽容”不把经文限定为仅仅延迟惩罚，也不消除其面对人的过失仍施忍耐的张力。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。保留“倾倒怜悯”的原文比喻；句式紧凑，与智慧文学的陈述语气相称。
