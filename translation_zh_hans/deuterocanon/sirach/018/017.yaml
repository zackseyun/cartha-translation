  yaml_path: translation/deuterocanon/sirach/018/017.yaml
  text: Is not a word better than a good gift? And both are with a gracious man[a][b].
translation:
  language: zh_hans
  text: 一句话[a]岂不胜过一份美好的礼物？这两样，仁厚的人[b]都具备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “话”也可译作“言语”或“话语”；希腊文在这里把说出来的话与物质的礼物相比较。
    reason: lexical_alternative
  - marker: b
    text: “仁厚的人”也可理解为“蒙恩的人”或“得人喜爱的人”；后半句也可译作“这两样都见于这样的人身上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἰδοὺ
  choice: 岂不
  rationale: 这一组合在此引出反问；“岂不”自然传达其强调和期待肯定回答的语气，而不生硬直译“看哪”。
- source_word: λόγος
  choice: 一句话
  rationale: 此处指说出来的话，与物质礼物形成对照；“一句话”简洁自然，也保留箴言式表达。
- source_word: ὑπὲρ
  choice: 胜过
  rationale: 在此比较结构中表示价值上的优越，不是空间意义的“在……之上”。
- source_word: δόμα ἀγαθόν
  choice: 一份美好的礼物
  rationale: δόμα是礼物或赠品，ἀγαθόν直接修饰它；译文保留“美好”的宽泛评价，不擅自限定为贵重或慷慨的礼物。
- source_word: ἀμφότερα
  choice: 这两样
  rationale: 明确回指前述的言语和礼物，符合现代汉语表达。
- source_word: παρὰ ἀνδρὶ
  choice: 人……都具备
  rationale: παρά加与格在这里可表示两样事物为某人所有或见于其身上；“具备”表达归属于此人的含义。
- source_word: κεχαριτωμένῳ
  choice: 仁厚的
  rationale: 此处描写一个具有恩慈、待人厚道的人；“仁厚”既适合智慧文学的语体，也与其善言和赠礼的行为相称。
theological_decisions:
- issue: ἀνδρὶ的阳性代表性单数
  choice: 人
  alternative: 男子
  rationale: 希腊文形式为阳性单数，但本句是普遍性的智慧格言，并非特指男性；汉语“人”自然保留代表性个体的泛指功能，避免使适用范围被误解为仅限男子。
- issue: κεχαριτωμένῳ所表达的是品格还是蒙受恩宠
  choice: 仁厚的人
  alternative: 蒙恩的人
  rationale: 上下文谈善言和赠礼，较直接地指向待人有恩慈的品格；但该词也可被理解为蒙恩或得宠，因此在脚注中保留这一词义张力。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留原文的反问和箴言式对偶。未在“话”前添加原文没有的“好”，以免提前消解一句话为何能胜过礼物的张力。
