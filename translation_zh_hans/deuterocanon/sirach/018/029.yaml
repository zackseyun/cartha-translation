  text: Those who are prudent in words also became wise, and they poured forth precise proverbs.
translation:
  language: zh_hans
  text: 在言语上明智的人，自己也成了有智慧的人，并倾泻出精当的箴言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετοὶ ἐν λόγοις
  choice: 言语明智的人
  rationale: 保留“在言语上有悟性、明智”的范围限定，同时采用自然的现代汉语表达。
- source_word: καὶ αὐτοὶ ἐσοφίσαντο
  choice: 自己也得了智慧
  rationale: ἐσοφίσαντο可指成为有智慧或获得智慧；译为“得了智慧”既呈现其变化，也避免生硬的“使自己有智慧”。καὶ αὐτοὶ中的强调以“自己也”表达。
- source_word: ἀνώμβρησαν
  choice: 倾注出
  rationale: 该动词具有如雨倾降、倾泻而出的形象；“倾注出”保留这一强烈的比喻，而不弱化为普通的“说出”。
- source_word: παροιμίας ἀκριβεῖς
  choice: 精确的箴言
  rationale: παροιμίαι在智慧文学语境中宜译“箴言”；ἀκριβεῖς强调严谨、准确、周密，译“精确”贴近原文。
