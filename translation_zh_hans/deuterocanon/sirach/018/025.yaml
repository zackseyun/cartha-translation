  text: Remember the time of famine in the time of plenty[a], and poverty and need in the days of wealth.
translation:
  language: zh_hans
  text: 富足的时候，要记得饥荒的时节[a]；富裕的日子，要想到贫穷和缺乏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“丰盛的时节，要记得饥荒的时节。”希腊文以两个“时节”对照匮乏与充足。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: 要记得／要想到
  rationale: 这个不定过去时命令式要求人有意识地记在心上。中文为避免重复，前半译作“要记得”，后半承接省略的动词译作“要想到”，保持同一劝诫力度。
- source_word: καιρὸν λιμοῦ
  choice: 饥荒的时节
  rationale: καιρός可指时节或特定时期，λιμός在这里是“饥荒”，不宜弱化为个人层面的“饥饿”。
- source_word: ἐν καιρῷ πλησμονῆς
  choice: 富足的时候
  rationale: πλησμονή表示充足、丰盛；“富足”自然地传达物质充裕，并与“饥荒”形成鲜明对照。
- source_word: πτωχείαν
  choice: 贫穷
  rationale: πτωχεία指贫穷的状态；“贫穷”准确、通俗，也保留了原文的具体经济含义。
- source_word: ἔνδειαν
  choice: 缺乏
  rationale: ἔνδεια强调欠缺、不足；译作“缺乏”可与“贫穷”并列而不合并两者含义。
- source_word: ἐν ἡμέραις πλούτου
  choice: 富裕的日子
  rationale: πλοῦτος指财富、富裕；“富裕的日子”保留“日子”的意象，同时符合现代汉语表达。
theological_decisions:
- issue: 是否将本节意译为对未来逆境的一般性警告
  choice: 保留“饥荒／富足”和“贫穷、缺乏／富裕”两组具体对照
  alternative: 意译为“顺境时要想到将来可能有逆境”
  rationale: 希腊文本用平衡的对应结构列出具体的经济处境，并未明说这些困境必定发生在未来。保留原有张力，可避免添加概括性的道德解释。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。用两个并列分句再现原文的平衡结构；分号凸显两组对照。脚注标记[a]已置于正文对应位置。
