base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/006.yaml
  text: It is not possible to diminish or to add[a], and it is not possible to trace out the wonders of the Lord.
translation:
  language: zh_hans
  text: 不能减少，也不能增添；主的奇妙之事，人也无法探究到底。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “探究到底”或译“追寻出”或“测透”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: 不能／无法
  rationale: 这一无人称结构表达不可能性；按汉语搭配分别译为“不能”和“无法”，清楚自然。
- source_word: ἐλαττῶσαι
  choice: 减少
  rationale: 表示使之变少，与“增添”构成平衡鲜明的对举。
- source_word: προσθεῖναι
  choice: 增添
  rationale: 保留“加上、增加”的基本含义，并与“减少”对应。
- source_word: ἐξιχνιάσαι
  choice: 探究到底
  rationale: 原词带有循迹追查直至穷尽的意味；“探究到底”既传达追索的意象，也表达无法彻底参透。
- source_word: τὰ θαυμάσια
  choice: 奇妙之事
  rationale: 涵盖奇事、奇工和令人惊叹之物，不把所指限定为作为或受造物。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: κύριος在此指上帝，译作传统而明确的神圣称号“主”。
theological_decisions:
- issue: “减少，也不能增添”的宾语范围
  choice: 保留宾语未明说的表达
  alternative: 补作“对这些事”“对他的作为”等
  rationale: 希腊文没有明说宾语；不补宾语可保留格言式张力，避免将范围局限于主的作为。
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 在本智慧文学语境中，该词是对上帝的称号，而不是一般社会关系中的称谓。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号保留两个并列不可能命题的结构；第二句加入泛指主语“人”，使汉语自然，但不限定具体群体。脚注标记置于对应短语之后。
