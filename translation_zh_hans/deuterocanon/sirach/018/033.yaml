  text: Do not be a glutton and a drunkard[b][a], when there is nothing in your purse.
translation:
  language: zh_hans
  text: 不要做贪食又嗜酒的人，[a]囊中却一无所有。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证将这项警戒扩展为：“不要靠借来的钱宴饮，以致贫穷；你囊中一无所有。”
    reason: alternative_reading
  - marker: b
    text: 希伯来文末词 בַּכִּים 难解；希腊平行文本作“在你的钱袋里”，支持正文所采用的经济意义。
    reason: textual_variant
lexical_decisions:
- source_word: זוֹלֵל
  choice: 贪吃
  rationale: 该词在希伯来智慧文学中常指饮食无度，也可含挥霍之意；与“醉酒”并列时，“贪吃”最自然地保留其恶习警戒。
- source_word: וְסוֹבֵא
  choice: 醉酒
  rationale: 该词指嗜酒、纵饮；译作“醉酒”简洁自然，并与“贪吃”构成平行。
- source_word: וּמְאוּמָה אֵין
  choice: 却一无所有
  rationale: 希伯来文直陈“什么也没有”；“却”清楚表达纵情饮食与经济匮乏之间的反差，同时不把关系限定为单一的时间或因果意义。
- source_word: בַּכִּים
  choice: 囊中
  rationale: 此处希伯来词形或读法困难；希腊平行文本 ἐν μαρσιππίῳ 明确指钱袋。中文“囊中”既简练，也自然表达手头没有钱财。
theological_decisions:
- issue: 现存希伯来文末词不确定，是否以希腊平行文本阐明
  choice: 正文保留希伯来文对贪吃醉酒的警戒，并依据希腊文将末句译为经济意义的“囊中却一无所有”
  alternative: 采用希腊文扩展式读法：“不要靠借钱宴饮，以致贫穷；你囊中本来一无所有。”
  rationale: 现存希伯来文应居首要地位；但末词难解，而希腊见证清楚支持“钱袋中”的意义。正文因此借希腊文澄清末句，却不纳入希伯来正文没有明确表达的“借钱”和“变穷”。
translation_notes:
  register: 采用现代、简洁而庄重的劝诫语体。“贪吃醉酒”贴近原文并列结构；“囊中却一无所有”是普通读者易懂的成语式表达。脚注标记均置于正文相关位置。
