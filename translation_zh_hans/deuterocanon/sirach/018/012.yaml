  yaml_path: translation/deuterocanon/sirach/018/012.yaml
  text: He saw and recognized that their destruction was evil[b][a]; therefore he multiplied his atonement for them.
translation:
  language: zh_hans
  text: 他看见，也认清他们的毁灭是悲惨的[a]；因此，他加增了自己的赎罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “悲惨的”也可译作“恶劣的”或“邪恶的”。“毁灭”也可译作“败亡”或“倾覆”。
    reason: 保留πονηρά与καταστροφή的词义范围，以及灾难性与道德性之间的可能张力。
  - marker: b
    text: “赎罪”也可译作“除罪”或“挽回”。原文直译为“他的赎罪”；虽可按上下文理解为与“他们”有关，原文没有明说对象。
    reason: 说明ἐξιλασμός的主要译法，并保留原文未明示受益对象的表达。
lexical_decisions:
- source_word: ἶδεν
  choice: 看见
  rationale: 这是ὁράω的简单过去时，直译为“看见”，并与后面的“认清”形成由看见到理解的递进。
- source_word: ἐπέγνω
  choice: 认清
  rationale: 该复合动词带有充分认识、辨明之意；“认清”既保留加强语气，也符合现代汉语表达。
- source_word: τὴν καταστροφὴν αὐτῶν
  choice: 他们的毁灭
  rationale: καταστροφή可指倾覆、毁灭或败亡；“毁灭”贴近此处的强烈词义，不弱化为较含混的“结局”。
- source_word: ὅτι πονηρά
  choice: 是悲惨的
  rationale: πονηρά在这里更自然地描述他们毁灭这一结局的恶劣、可悲性质，而不必判定其本身具有道德邪恶；“悲惨”保留灾难性语义。
- source_word: διὰ τοῦτο
  choice: 因此
  rationale: 准确表达由前述认识引出的因果推论。
- source_word: ἐπλήθυνεν
  choice: 大大施行了
  rationale: 字面义为“增多、使丰富”。与汉语“赎罪”搭配时，直说“增加赎罪”生硬；“大大施行”自然表达其丰盛、加增的程度。
- source_word: τὸν ἐξιλασμὸν αὐτοῦ
  choice: 他为他们……施行了赎罪
  rationale: ἐξιλασμός指赎罪、除罪或挽回；“赎罪”保留其神学分量。αὐτοῦ以主语“他”体现；“为他们”是按上下文补出的受益对象，故在脚注中说明。
theological_decisions:
- issue: ἐξιλασμός的译法
  choice: 赎罪
  alternative: 除罪；挽回；怜悯
  rationale: “赎罪”最能保留该词处理罪责、消除冒犯的宗教内涵；“怜悯”会削弱原词意义，而“挽回”可能过早限定其作用方向。
- issue: πονηρά所表达的是道德邪恶还是悲惨结果
  choice: 悲惨的
  alternative: 邪恶的；恶劣的
  rationale: 此处中性复数πονηρά与καταστροφή所指的败亡或毁灭相联系，重点较可能是人类结局的凄惨、恶劣。脚注保留较字面的“恶劣/邪恶”可能性，避免消除原文张力。
- issue: 是否补出ἐξιλασμός的对象
  choice: 为他们
  alternative: 不补对象，仅译“增多了他的赎罪”
  rationale: 希腊文没有明说间接宾语，但上下文中的“他们”自然构成赎罪行动所关涉的对象。正文补出可使现代汉语通顺，脚注明示这是语境补足。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看见，也认清”保留两个希腊动词的递进；“大大施行了赎罪”避免生硬的“增多他的赎罪”，同时尽量保存ἐπλήθυνεν的加强意味。所有补足和重要词义差异均以脚注交代。
