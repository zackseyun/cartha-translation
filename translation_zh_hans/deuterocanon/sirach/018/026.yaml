  yaml_path: translation/deuterocanon/sirach/018/026.yaml
  text: From morning until evening the time changes[b][a], and all things are swift before the Lord.
translation:
  language: zh_hans
  text: 从早晨直到晚上，时势变迁[a]；在主面前，万事都很迅速[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “时势”也可译作“时间”、“时节”或“境况”；希腊语 καιρός 可随语境表示时间、时机、时节或处境。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“在主看来，万事变化都很快”。原文可能强调万事在主面前迅速发生或改变。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: 从早晨直到晚上
  rationale: 如实表达从早到晚的时间跨度，不把 πρωΐθεν 过度限定为黎明时分。
- source_word: μεταβάλλει
  choice: 变迁
  rationale: 表达改变、转变之意；与“时势”搭配自然，也保留智慧文学的凝练语气。
- source_word: καιρός
  choice: 时势
  rationale: καιρός 可指时间、时节、时机或处境；“时势”兼顾时间与境况的流转，比单纯的“时间”更能保留原词在本句中的宽广含义。
- source_word: πάντα
  choice: 万事
  rationale: 保留中性复数所涵盖的一切事物和事情，并符合现代汉语智慧文学的庄重表达。
- source_word: ταχινὰ
  choice: 很迅速
  rationale: 按其主要词义译为迅速、快捷，不改释为“容易”；虽然汉语表达略带张力，却保留原文“万事都是迅速的”这一不寻常说法。
- source_word: ἔναντι Κυρίου
  choice: 在主面前
  rationale: 既可表达处于主的临在之中，也可含“在主看来”之意，避免只固定为视觉层面的解释。
theological_decisions:
- issue: 智慧语句中 καιρός 的含义
  choice: 时势
  alternative: 时间；时节；境况
  rationale: 原词兼具时间、时机和处境等义。本译文不把它局限为自然季节或抽象时间，而以脚注保留其他可能。
- issue: πάντα ἐστὶν ταχινὰ ἔναντι Κυρίου 的语力
  choice: 在主面前，万事都很迅速
  alternative: 在主看来，万事变化都很快；在主面前，一切都转瞬即逝
  rationale: ταχινὰ 的基本意义是迅速、快捷。译文不将其解释为万事对主而言“容易”，也不直接增补“变化”或“短暂无常”，从而保留原文在神的视角与万事迅速之间的神学张力。
translation_notes:
  register: 采用现代、凝练而庄重的智慧文学语体。“从早晨直到晚上”清楚自然；“时势变迁”保留 καιρός 的多义性；后半句刻意不把略显反常的希腊语结构完全解释开，以保存其歧义和神学张力。
