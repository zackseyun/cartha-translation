revisions:
- from: 你若任由自己的心满足欲望[a]，就会成为仇敌幸灾乐祸的对象。
  to: 你若让自己的心随欲望得到满足[a]，就会成为仇敌所欢喜的对象。
  rationale: 修订澄清了“向自己的心供给欲望的满足”这一原文关系，并将结果句调整为较贴近ἐπίχαρμα的宽泛表达。保留“心”和“欲望”，以维持原文关于内在自我与欲求的措辞及其解释弹性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:34:26Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本把握了条件句、对内在自我的供给／纵容，以及仇敌因之欢喜的结果。不过“任由自己的心满足欲望”容易理解为“心”主动去满足某个独立的“欲望”，未清楚表达“使自己的心获得欲望的满足”。“幸灾乐祸”通常预设对方遭灾，较原文“成为仇敌所欢喜的对象”具体且加强了语义。
  naturalness: 建议改为“让自己的心随欲望得到满足”，更符合现代汉语，也较清楚地呈现欲望与满足的关系。“成为仇敌所欢喜的对象”庄重自然，适合智慧文学语体。
  terminology: “心”可自然承载此处ψυχή所指的内在自我，无须使用带技术性意味的“灵魂”。“欲望”可保留ἐπιθυμία的广义，不限于性欲。“仇敌所欢喜的对象”保留ἐπίχαρμα的宽泛“令其欢喜之物”，不擅自落实为“幸灾乐祸”或“笑柄”。
  issues:
