  yaml_path: translation/deuterocanon/sirach/018/031.yaml
  text: If you grant your soul the pleasure it desires[a], it will make you a joy to your enemies.
translation:
  language: zh_hans
  text: 你若让自己的心随欲望得到满足[a]，就会成为仇敌所欢喜的对象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你若纵容自己内心的欲求。”
    reason: “给你的心以欲望的喜悦（或满足）”可按“使内心随欲望得到满足”或“纵容内心的欲求”表达；后一译法突出χορηγήσεις在语境中的纵容意味。
lexical_decisions:
- source_word: ἐὰν
  choice: 你若
  rationale: 引出条件句，符合本节警戒式箴言的结构。
- source_word: χορηγήσεις
  choice: 任由……满足
  rationale: 原义为供给、提供；此处指给内在欲望所求的满足。译作“任由……满足”既传达供给之意，也自然呈现纵容的语境，而不把含义限定得过死。
- source_word: τῇ ψυχῇ σου
  choice: 自己的心
  rationale: ψυχή在这里指人的内在自我，尤其是欲求的一面，并非在陈述灵魂构成的技术性教义。现代汉语“自己的心”比直译“自己的灵魂”更自然，同时保留内在主体的意象。
- source_word: εὐδοκίαν ἐπιθυμίας
  choice: 满足欲望
  rationale: 该短语表达欲望所得的喜悦、满意或满足。译文保留其语法关系可能存在的弹性；脚注列出更贴近字面的表达。
- source_word: ποιήσει σε
  choice: 就会成为
  rationale: 希腊文直译为“会使你成为”；汉语按结果句自然表达为“你就会成为”。
- source_word: ἐπίχαρμα
  choice: 幸灾乐祸的对象
  rationale: 该词指令他人欢喜的事物；与“仇敌”连用时带有敌人因你的处境而得意、欢喜的负面意味。此译比单说“喜乐”更清楚，同时没有具体化为“笑柄”。
- source_word: τῶν ἐχθρῶν σου
  choice: 仇敌
  rationale: 直接表达所属或关联关系：你成为仇敌为之欢喜的对象。
theological_decisions:
- issue: ψυχή的人论含义
  choice: 译为“自己的心”
  alternative: 自己的灵魂；自己；自己的胃口
  rationale: 本节讨论内在欲望与自制，不是在界定灵魂的本体。用“心”既保留内在自我的含义，也符合现代汉语智慧文学的表达。
- issue: ἐπίχαρμα τῶν ἐχθρῶν σου的敌意色彩
  choice: 译为“仇敌幸灾乐祸的对象”
  alternative: 仇敌的喜乐；仇敌的笑柄
  rationale: 原文明确说仇敌因你而欢喜，却未明确说明是嘲笑。“幸灾乐祸”呈现敌意语境，“对象”则避免擅自增添“笑柄”的具体意象。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“任由”体现警戒意味；“幸灾乐祸的对象”清楚传达仇敌因其后果而欢喜，却不把原文过度具体化为“笑柄”。
