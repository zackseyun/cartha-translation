  yaml_path: translation/deuterocanon/sirach/018/028.yaml
  text: Every prudent man has recognized wisdom[a], and to the one who found her he will give praise.
translation:
  language: zh_hans
  text: 每个明达的人都认出了智慧，也会向找到她[a]的人献上赞美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文用阴性代词指“智慧”，可译作“她”，以保留拟人化色彩；也可译作“它”。
    reason: 说明原文的语法性别及其可能具有的拟人化意味。
lexical_decisions:
- source_word: πᾶς συνετός
  choice: 每个明达的人
  rationale: πᾶς与单数的实词化形容词 συνετός 连用，具有逐一概括的意思；“明达的人”既表达理解力和辨别力，也符合现代汉语的庄重语体。
- source_word: ἔγνω
  choice: 认出了
  rationale: γινώσκω 的简单过去时在这里表示已经辨认、认识智慧；“认出了”比单纯“知道”更能体现完成性的识别。
- source_word: σοφίαν
  choice: 智慧
  rationale: 这是 σοφία 在智慧文学中的常规译法，既可指智慧本身，也容纳其拟人化表达。
- source_word: τῷ εὑρόντι αὐτήν
  choice: 向找到她的人
  rationale: 保留与格所表示的接受对象，并把 αὐτήν 理解为回指“智慧”；“找到”准确对应 εὑρόντι。
- source_word: δώσει ἐξομολόγησιν
  choice: 会……献上赞美
  rationale: δώσει 是将来时；ἐξομολόγησις 在此更自然地表示赞美、称颂或公开认可，而非认罪。“献上赞美”兼顾原文的“给予”结构与汉语习惯。
theological_decisions:
- issue: 智慧的阴性指代与拟人化
  choice: 用“她”回指智慧
  alternative: 用“它”回指智慧
  rationale: 希腊文 σοφία 是阴性名词，αὐτήν 为阴性单数代词；智慧文学也常将智慧拟人化。中文用“她”能保留这一文学神学色彩，但脚注说明也可按语法性别理解为“它”。
- issue: 第二分句中赞美的接受者
  choice: 明达的人向找到智慧的人献上赞美
  alternative: 把“找到智慧的人”理解为后句主语，译作“找到智慧的人会献上赞美”
  rationale: τῷ εὑρόντι 是与格，最自然地表示“给予赞美”的接受者；δώσει 的省略主语承接前句的 πᾶς συνετός。因此不把分词短语改作主语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“明达”比“聪明”更突出 συνετός 所含的理解力与辨别力；句法保留原文中赞美是献给“找到智慧的人”这一关系。
