  text: My child[a], in good things do not add reproach, nor in any gift grief of words.
translation:
  language: zh_hans
  text: 孩子，你行善时，不要加上责难；无论送什么礼物，都不要说令人伤心的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“也不要在任何赠与中加上言语的忧伤”，是一种简练的说法，告诫人不要用使人难过的话破坏慷慨的善意。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: 孩子
  rationale: 单数呼格，用于智慧教导中的亲切称呼；“孩子”自然庄重，也不把原文未明确的性别限定为男性。
- source_word: ἐν ἀγαθοῖς
  choice: 你行善时
  rationale: 该复数短语涵盖善行、恩惠等行善之举；结合下句赠礼语境，译为“你行善时”比直译“在好事中”更符合现代汉语，同时保留较宽泛的所指。
- source_word: μὴ δῷς μῶμον
  choice: 不要加上责难
  rationale: δῷς本义为“给”，但在此表示让善举伴随着责难；“加上责难”准确传达不要以挑剔、贬责破坏善行的意思。
- source_word: ἐν πάσῃ δόσει
  choice: 无论送什么礼物
  rationale: δόσις可指给予的行动或所赠之物，πάσῃ具有周遍、逐一的力量；此译自然表达“每次/任何赠与”的含义。
- source_word: λύπην λόγων
  choice: 说令人伤心的话
  rationale: 希腊文是压缩的属格结构，直译近于“言语的忧伤”；此处指随赠礼而来的话使领受者难过，故以自然汉语显明其致使含义。
