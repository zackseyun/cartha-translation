  yaml_path: translation/deuterocanon/sirach/018/024.yaml
  text: Remember wrath in the days of your end[b][a], and the time of vengeance at the turning away of the face.
translation:
  language: zh_hans
  text: 在生命终结的日子，要记住震怒[a]，以及在面容转开之时的报应时刻[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “震怒”也可译作“愤怒”。希腊词可泛指强烈的怒气；本节语境很可能指审判中的神圣震怒。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在面容转开时”。这很可能表示恩惠被收回；所指的面容大概是上帝的，但希腊文没有明确说出主体。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: 要记住
  rationale: 这是命令式；“要记住”直接、自然，并能统摄并列的“震怒”和“报应的时刻”。
- source_word: θυμοῦ
  choice: 震怒
  rationale: θυμός可指强烈的愤怒；此处与报应和终结相连，“震怒”能表达庄严的审判语境，同时不在正文中明说其来源。
- source_word: ἐν ἡμέραις τελευτῆς
  choice: 在生命终结的日子
  rationale: τελευτή可指终结或死亡；此译保留“终结”的表达，又使现代汉语读者自然理解为临终时期。
- source_word: καιρὸν
  choice: 时刻
  rationale: καιρός指特定或适当的时间；“时刻”与后接的“报应”搭配自然，并传达事件发生的特定关头。
- source_word: ἐκδικήσεως
  choice: 报应
  rationale: ἐκδίκησις可指报复、惩罚或伸冤；在震怒与终结的警告语境中，“报应”较能表达惩罚性审判，又避免过度拟人化为人的复仇。
- source_word: ἐν ἀποστροφῇ προσώπου
  choice: 就是面容转开之时
  rationale: 原文是名词性表达，直指“面容的转开”。此译保留其意象与主体未明的特点，不擅自在正文中补出“上帝”。
theological_decisions:
- issue: 震怒、报应以及转开的面容是否应在正文中明确归于上帝
  choice: 正文保留隐含的主体
  alternative: 明确译成“上帝震怒、施行报应并转脸不顾之时”
  rationale: 上下文很可能指向上帝的审判和恩宠的撤回，但希腊文没有明说主体。保留隐含表达，可避免消除原文的神学张力。
- issue: ἐκδίκησις应译为惩罚性的“报应”还是使人得直的“伸冤”
  choice: 报应
  alternative: 伸冤
  rationale: 本节把该词与震怒及生命终结并置，警告性的惩罚含义较强；不过该词本身在其他语境中也可表示伸冤。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“生命终结的日子”保留原文关于终结或死亡的表达；“面容转开”刻意维持略带诗性的意象和主体上的含蓄。
