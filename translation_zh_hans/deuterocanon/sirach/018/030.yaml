  yaml_path: translation/deuterocanon/sirach/018/030.yaml
  text: Do not go after your desires, and restrain yourself from your cravings;
translation:
  language: zh_hans
  text: 不要随从自己的欲望；要抑制自己强烈的欲求。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要跟着自己的欲望走；要克制自己，不随从自己强烈的欲求。”
    reason: 词义与表达方式的备选译法；“跟着……走”保留ὀπίσω与πορεύου的路径意象，“克制自己，不随从……”明确表达κωλύου与ἀπό所含的自我约束及离开所欲之物的关系。
lexical_decisions:
- source_word: Ὀπίσω ... μὴ πορεύου
  choice: 不要追随
  rationale: ὀπίσω与πορεύου连用，表达“跟随、追逐”的意思；“不要追随”在现代汉语中自然，并保留行动受欲望引领的意象。
- source_word: τῶν ἐπιθυμιῶν σου
  choice: 自己的欲望
  rationale: ἐπιθυμία泛指欲望，在劝诫语境中带有负面警示，但不限于性欲；“欲望”保留其宽泛语义。
- source_word: ἀπὸ τῶν ὀρέξεών σου
  choice: 自己的贪求
  rationale: ὄρεξις可指强烈的欲求、胃口或冲动；“贪求”既与前句“欲望”有所区别，也传达强烈而需受约束的欲求，同时不把范围限于肉体食欲。
- source_word: κωλύου
  choice: 要克制自己
  rationale: 此处命令形式在语境中具有自我约束之意；“克制自己”简洁自然地表达阻止、约束自身的含义。
theological_decisions:
- issue: 欲望用语的道德范围
  choice: 采用“欲望”和“贪求”，表达警戒意味但不限定为某一种欲念。
  alternative: 译作“私欲”和“情欲”，或“欲望”和“冲动”。
  rationale: 希腊文本告诫人不可受欲求支配，却没有把所指范围明确限定为性欲；因此避免用容易造成过度限定的“情欲”。
- issue: 两分句之间的力度
  choice: 将前句译为不可追随，后句译为主动克制。
  alternative: 两句均泛化为“不要顺从”。
  rationale: 这样保留原文从“不跟随”到“自我约束”的平行而有差别的劝诫。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“追随”保留原文的路径意象；“贪求”用于区别两个近义欲望词。句末标点按单节独立呈现处理。
