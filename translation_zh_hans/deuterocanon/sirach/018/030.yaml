  source_fidelity: 首分句“不要追随自己的欲望”准确传达ὀπίσω…μὴ πορεύου的“不要跟随／追随”之意。后分句的“克制自己”基本符合κωλύου的自我抑制，但“贪求”通常偏指贪婪、贪得，较原文ὄρεξις所指广义而强烈的欲求／渴求更为狭窄，可能不当地加入逐利或贪婪的意味。
