  text: Before you speak[a], learn; and before sickness, seek treatment.
translation:
  language: zh_hans
  text: 开口以前，要先学习；生病以前，要保养身体[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要照料好自己”或“要采取治疗措施”。希腊语动词可指照料、护理，也可指医治。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ λαλῆσαι
  choice: 开口以前
  rationale: πρὶν ἢ引出在另一行动之前发生的事，λαλῆσαι意为“说话”。“开口以前”简洁自然，也符合箴言式表达。
- source_word: μάνθανε
  choice: 要先学习
  rationale: 这是μανθάνω的命令式，意为学习、领会或受教；“要先学习”保留了发言之前先求知的劝诫意味。
- source_word: πρὸ ἀρρωστίας
  choice: 生病以前
  rationale: πρό表示时间上的“在……以前”；ἀρρωστία指疾病或身体虚弱。“生病以前”准确保留原文的时间关系。
- source_word: θεραπεύου
  choice: 要保养身体
  rationale: θεραπεύω可指照料、护理或医治；在“生病以前”的语境中，这一命令偏重预先照顾健康。“保养身体”在现代汉语中自然，并避免造成已经患病才医治的矛盾。
