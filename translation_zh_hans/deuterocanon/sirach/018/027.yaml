  yaml_path: translation/deuterocanon/sirach/018/027.yaml
  text: A wise man will be cautious in everything[b][a], and in days of sins he will beware of wrongdoing.
translation:
  language: zh_hans
  text: 智慧人在一切事上都会谨慎[a]；在罪恶的日子里[b]，他会留心远避过错。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在一切事上都会敬畏。”这里的希腊语动词既可指敬畏，也可指谨慎、警戒；下半句较支持“谨慎”的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译“在罪恶的日子里”，可能指罪恶或试探特别多的时期。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος σοφὸς
  choice: 智慧人
  rationale: 这是智慧文学中的概括性单数表达；“智慧人”自然、凝练，保留了箴言式语气，也没有把ἄνθρωπος不必要地限定为成年男性。
- source_word: ἐν παντὶ
  choice: 在一切事上
  rationale: 保留原文范围广泛的表达，既可涵盖各种事情，也可涵盖各种处境。
- source_word: εὐλαβηθήσεται
  choice: 都会谨慎
  rationale: εὐλαβέομαι可表示谨慎、警戒，也可表示敬畏。下半句强调留心避开过错，因此正文采用实践和道德层面的“谨慎”，同时以脚注保留“敬畏”的可能。
- source_word: ἐν ἡμέραις ἁμαρτιῶν
  choice: 在罪恶的日子里
  rationale: 贴近复数原文“罪恶的日子”，保留其可能指罪恶、犯罪机会或试探增多之时期的开放性。
- source_word: προσέξει
  choice: 他会留心
  rationale: προσέχω的核心意义是注意、留心；与后面的ἀπό短语结合，表达有意识地防备并避开。
- source_word: ἀπὸ πλημμελίας
  choice: 远避过错
  rationale: ἀπό表达离开或避开；πλημμέλεια可指过错、冒犯或不当行为。“远避过错”既传达规避之意，也不把该词过度限定为某一种法律或宗教意义上的罪。
theological_decisions:
- issue: εὐλαβηθήσεται在本节中的含义
  choice: 正文译为实践性的“谨慎”
  alternative: “在一切事上都会敬畏”
  rationale: 该动词确可含敬畏或虔敬之意，但平行分句谈到留心远避过错，较支持谨慎警戒的伦理含义。脚注保留另一词义，避免消除原文张力。
- issue: ἡμέραις ἁμαρτιῶν所指的时期
  choice: 保留为“罪恶的日子”
  alternative: “受试探的时候”或“罪恶横行的时期”
  rationale: 原文没有明确说明这些日子是由普遍罪恶、个人犯罪还是试探所刻画，因此正文不作单一解释，脚注仅说明可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体；句式简洁对称。“智慧人”保留箴言式概括，“留心远避”兼顾原文的注意与规避两层意思。
