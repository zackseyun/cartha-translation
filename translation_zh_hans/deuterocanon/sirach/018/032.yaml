  text: Do not delight in a mere scrap of pleasure[b][a], for its end is poverty.
translation:
  language: zh_hans
  text: 不要因些许享乐而欣喜[a]，因为它的结局是贫穷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要因一点点享乐而欣喜。”希伯来语שֶׁמֶץ可指小碎片、少许或一丝。希腊文平行本则作“许多奢华”，反映出文本差异。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语末句的传世文本含义不明。其中“פִּי שְׂנַיִם”可近似直译为“两个的口”，但它与“贫穷”的句法关系无法确定。希腊文平行本作“也不要受它的花费所牵累”，为正文将此句理解为享乐带来贫穷提供了支持；这是一种解释性译法。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: 不要……而欣喜
  rationale: שמח表示欢喜、快乐；在此指从享乐中获得满足。译作“欣喜”既保留禁令语气，也避免把原文强化为“贪恋”或“沉溺”。
- source_word: שֶׁמֶץ
  choice: 些许
  rationale: שֶׁמֶץ可指极少的一点、碎片或痕迹。“些许”自然地保留其微小之意；希腊文平行本作“许多奢华”，显示此处可能存在文本差异。
- source_word: תַּעֲנוּג
  choice: 享乐
  rationale: 该词指愉悦、享受，且可带感官享受的意味。“享乐”适合本节智慧训诫的语境，又不像“奢华”那样偏向希腊文τρυφή。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: אֲשֶׁר通常是关系词，但此处后半句说明禁令的理由，汉语用“因为”能自然表达其因果功能。
- source_word: פִּי
  choice: 结局
  rationale: 该词本义为“口”，也可延伸指边缘、尽头或结果。传世希伯来语短语难以直解；结合智慧格言的结构，译作“结局”较为通顺，但属于语境性处理。
- source_word: שְׂנַיִם
  choice: 未单独译出
  rationale: 传世读法意为“二、两个”，与前后词无法构成明确句法和语义。为避免制造虚假的确定性，正文不强行逐词对应，并在脚注说明。
- source_word: רֵישׁוֹ
  choice: 贫穷
  rationale: ריש明确表示贫穷、匮乏，是疑难末句中最稳固的词义依据；代词后缀由汉语“它的”体现。
