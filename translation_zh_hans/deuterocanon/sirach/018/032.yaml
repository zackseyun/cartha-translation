  register: 采用简洁、庄重的现代标准汉语，保持智慧文学中直接劝诫的语气。“些许享乐”保留希伯来文本的微小量感；疑难末句以可理解的正文呈现，同时用脚注明示文本不确定性，不把推断伪装成确定原意。
