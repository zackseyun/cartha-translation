  text: And who can search out his mighty deeds?
translation:
  language: zh_hans
  text: 谁能彻底探究他的伟大作为？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς
  choice: 谁
  rationale: 疑问代词引出反问；“谁”简洁自然，并保留原文的修辞力度。
- source_word: ἐξιχνιάσει
  choice: 能探究尽
  rationale: 该动词有追踪、彻底查究之意。译作“能探究尽”既表达深入探究，也借“能”显出反问所暗含的人无法穷尽；虽为将来时形式，汉语反问无需生硬标出将来。
- source_word: τὰ μεγαλεῖα
  choice: 伟大作为
  rationale: 复数名词可指彰显伟大的事或伟业；“伟大作为”兼顾其行动性与宏伟含义，而不缩窄为某一类神迹。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 按上下文指上帝；正文保留代词形式，不把“上帝”直接增补进本句。
theological_decisions:
- issue: 代词 αὐτοῦ 的所指
  choice: “他的”按上下文指上帝
  alternative: 正文直译为“上帝的”
  rationale: 上下文自然确定其所指为主；保留代词既忠于希腊文本，也避免把上下文信息扩写进正文。
- issue: 反问所表达的不可穷尽性
  choice: 用“谁能……尽？”保留反问
  alternative: 陈述为“无人能够完全探究……”
  rationale: 原文以疑问形式表达人的有限；不改成直陈句，可保留其修辞张力，并避免把暗示显化为解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“探究尽”比单说“探究”更能体现 ἐξιχνιάσει 的彻底追索意味；全句简洁，适合经文体裁。
