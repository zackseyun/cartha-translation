  yaml_path: translation/deuterocanon/sirach/018/022.yaml
  text: Do not be hindered from paying a vow in due time[a], and do not wait until death to be justified.
translation:
  language: zh_hans
  text: 不要因受阻而延误按时履行所许的愿；也不要等到临死才得以称义[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称义”也可译作“被证实为义”“被显明为义”或“被判定为正当／在理”。这里的希腊文可以较宽泛地指被认定为正当或在理，未必具有后期神学用语中“称义”的全部专门含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμποδισθῇς
  choice: 让任何事妨碍你
  rationale: 该词是被动形式，意为受阻、被妨碍。汉语用“让任何事妨碍你”自然地保留了不要容许阻碍发生的劝诫语气，同时不臆断阻碍的具体来源。
- source_word: ἀποδοῦναι
  choice: 还
  rationale: 与“愿”搭配时，指履行所许之愿；“还愿”是现代汉语中准确而自然的固定表达。
- source_word: εὐχήν
  choice: 愿
  rationale: εὐχή虽也可指祷告，但与ἀποδοῦναι连用时最自然地指向向上帝所许、随后应当履行的愿。
- source_word: εὐκαίρως
  choice: 按时
  rationale: 该副词表示在合宜或应当的时机。“按时”简明地传达不可拖延、应在适当时候履行的含义。
- source_word: μὴ μείνῃς
  choice: 不要等到
  rationale: 此处μένω在语境中表示等候或拖延，而非单纯停留；“不要等到”与后面的死亡终点自然衔接。
- source_word: ἕως θανάτου
  choice: 到死时
  rationale: 该短语以死亡作为拖延的极限终点。“到死时”贴近原文，也比“直到死亡”更符合现代汉语表达。
- source_word: δικαιωθῆναι
  choice: 得以称义
  rationale: δικαιόω的被动不定式可指被判定、显明为义或被证明有理。“得以称义”保留其重要词汇联系和被动意味，而脚注说明此处未必带有后期神学术语的全部内涵。
theological_decisions:
- issue: 智慧劝诫语境中δικαιωθῆναι的含义
  choice: 得以称义
  alternative: 被证明为义；被判定为义；被证明有理
  rationale: 正文保留原词的司法和义性语言，不把它改写为悔改或赦免等原文没有明说的概念；同时借脚注保留其在本语境中可能较宽泛的意义，避免自动套入后期技术性的称义教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“还愿”是普通读者熟悉的表达；两个“不要”保留原文并列禁令的节奏。脚注标记紧接存在歧义的“称义”，便于读者辨认其所注词语。
