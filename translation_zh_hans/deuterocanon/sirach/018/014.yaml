  text: He has mercy on those who accept discipline[b][a], and on those who eagerly hasten to his judgments.
translation:
  language: zh_hans
  text: 他怜悯那些接受管教[a]的人，也怜悯那些急切寻求他的裁断[b]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “接受管教”或译“领受教导”。希腊语παιδεία可指教导、训练或纠正性的管教。
    reason: lexical_alternative
  - marker: b
    text: “裁断”或译“判决”或“典章”。希腊语κρίματα可指裁断、判决或典章。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεᾷ
  choice: 怜悯
  rationale: 表达施予慈悲、怜恤之意，保留经文中的道德与宗教分量，也符合现代汉语经文语体。
- source_word: τοὺς ἐκδεχομένους
  choice: 那些接受……的人
  rationale: ἐκδέχομαι可表示等候或领受；与παιδείαν连用时，语境更侧重以开放态度接受管教，而非单纯等候。
- source_word: παιδείαν
  choice: 管教
  rationale: 该词涵盖教导、训练和纠正性的管束；“管教”兼顾塑造与纠正的含义，并保留智慧文学中的伦理力度。
- source_word: κατασπεύδοντας
  choice: 急切趋向
  rationale: 该复合动词带有加紧、赶往的意味；“急切趋向”既保留行动方向，也体现热切和主动的态度。
- source_word: ἐπὶ τὰ κρίματα αὐτοῦ
  choice: 趋向他的判决
  rationale: ἐπί接宾格并用于趋向性动词之后，可表达朝向；κρίματα可指判决、裁断或典章，“判决”较直接，并保留其司法性和规范性之间的张力。
theological_decisions:
- issue: 智慧文学语境中παιδεία的含义
  choice: 管教
  alternative: 教导；训练
  rationale: “管教”能体现人对塑造性、纠正性教诲的领受，同时不把该词限缩为惩罚。
- issue: κρίματα αὐτοῦ的语义范围
  choice: 他的判决
  alternative: 他的典章；他的裁断
  rationale: 原词既可能指上帝的裁断，也可能指其规范性的法令；正文采用“判决”以保留司法意味，脚注说明“典章”这一可能读法，避免把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“急切趋向”略带书面色彩，用来保存希腊文所表达的热切行动及其方向性；两个“那些……的人”保持原句平行结构。
