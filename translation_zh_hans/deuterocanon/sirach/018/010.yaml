  text: Like a drop of water from the sea and a grain of sand[b][a], so are a few years in the day of eternity.
translation:
  language: zh_hans
  text: 在永恒的一日[b]中，短短几年也不过如同大海里的一滴水和一粒沙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一粒沙”或译“一颗小石子”。希腊语ψῆφος常指小石子，但这里与“沙”连用，较可能指单个沙粒。
    reason: lexical_alternative
  - marker: b
    text: “永恒的一日”也可较直译为“一个世代的一日”。原文表达紧凑；此处以人的几年与无尽久远的时间相对照。
    reason: alternative_reading
lexical_decisions:
- source_word: σταγὼν ὕδατος ἀπὸ θαλάσσης
  choice: 大海中的一滴水
  rationale: ἀπό在此表示从广大海水中取出或相较于海洋；译为“大海中的”能自然呈现单独一滴与大海的悬殊对比。
- source_word: ψῆφος ἄμμου
  choice: 沙中的一粒
  rationale: ψῆφος通常可指小石子，但受属格ἄμμου“沙”限定，此处最自然地指一粒沙；保留脚注说明其词义范围。
- source_word: ὀλίγα ἔτη
  choice: 短短几年
  rationale: 既表达“少数几年”，也自然突出人生岁月相对于永恒的短暂。
- source_word: ἐν ἡμέρᾳ αἰῶνος
  choice: 在永恒的一日中
  rationale: 保留原文“日”的醒目单数意象，并按上下文将αἰών理解为无尽久远的时间；脚注同时保留更直译的可能。
- source_word: οὕτως
  choice: 也是如此
  rationale: 明确承接前面的两个比喻，把人短短几年与大海中的水滴、沙中的一粒相比较。
theological_decisions:
- issue: 短语ἡμέρα αἰῶνος中αἰών的时间含义
  choice: 永恒
  alternative: 世代；时代
  rationale: 上下文以极微小之物比拟人的短暂岁月，重点是与不可测度的久远时间形成对照；“永恒”自然传达这一含义，但脚注保留原短语的紧凑性与另一种直译。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文以“一日”对照“几年”的反常张力；两个脚注标记均置于相关词语之后。
