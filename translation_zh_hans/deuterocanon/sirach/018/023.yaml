  text: Before you pray[a], prepare yourself, and do not be like a man testing the Lord.
translation:
  language: zh_hans
  text: 祷告以前，要预备好自己；不要像那种把主置于考验之下的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把主置于考验之下”也可译作“试探主”。希腊文可指“试探”或“考验”；这里很可能是指以不当的方式考验主。
    reason: 保留πειράζω的词义范围，同时避免正文中“试探主”在现代汉语里被优先理解为“引诱主”的歧义。
lexical_decisions:
- source_word: πρὶν εὔξασθαι
  choice: 祷告以前
  rationale: πρὶν加不定式表示先后关系；εὔχομαι在此智慧文学语境中自然指向上帝祷告，也可涉及许愿，但上下文不足以要求译出“许愿”。
- source_word: ἑτοίμασον σεαυτόν
  choice: 要预备好自己
  rationale: 保留命令语气和反身宾语，强调祷告者本人应事先作好准备。
- source_word: μὴ γίνου
  choice: 不要成为
  rationale: 保留γίνομαι“成为、变成”的动态意味，而不简化为静态的“不要像”。
- source_word: ὡς ἄνθρωπος
  choice: 那种人
  rationale: ἄνθρωπος在此为泛指的人；现代汉语用“那种人”既自然，也与前面的“成为”顺畅衔接，不额外限定性别。
- source_word: πειράζων
  choice: 试探
  rationale: πειράζω可指试验、考验或试探；“试探主”符合汉语圣经语域，同时以脚注保留其词义张力。
- source_word: τὸν κύριον
  choice: 主
  rationale: 在犹太智慧文学语境中κύριος指上帝；译作“主”庄重、简洁，并符合常见经文用语。
theological_decisions:
- issue: πειράζων τὸν κύριον的含义
  choice: 试探主
  alternative: 考验主；把主置于考验之下
  rationale: 原词兼有“试验”和“试探”的语义范围。正文保留传统而自然的“试探主”，脚注说明此处更可能指以不当方式考验主，避免把歧义完全消除。
- issue: 祷告前“预备自己”的具体内容
  choice: 不加解释
  alternative: 预备内心；洁净自己；省察自己
  rationale: 原文只命令“预备自己”，没有说明准备的具体方式；正文不引入礼仪、心理或宗派性的限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祷告以前”与“要预备好自己”清楚直接；“成为……的那种人”兼顾γίνομαι的动态含义和ὡς ἄνθρωπος的比较结构。
