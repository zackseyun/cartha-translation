  text: A third tongue has shaken many and scattered them from nation to nation,[a]
translation:
  language: zh_hans
  text: 第三条舌头使许多人动摇，又使他们从一国流散到另一国。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“诽谤的舌头”、“两舌”，或概括为“挑拨离间的话”。希腊文直译为“第三条舌头”；正文保留了这一不寻常的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: 舌头
  rationale: 原词本义为“舌头”，也可转指言语；此处保留具体意象，以免把不寻常的习语直接解释掉。
- source_word: τρίτη
  choice: 第三种
  rationale: 原文是序数词“第三”；译作“第三种”较符合现代汉语，同时保留希腊文本的陌生表达。
- source_word: ἐσάλευσεν
  choice: 使……动摇
  rationale: 该动词有摇动、震撼、扰乱之意；“使……动摇”既保留摇撼的意象，也适合这里的社会语境。
- source_word: διέστησεν
  choice: 使……流散
  rationale: 该动词表示使分开、使离散；结合后面的“从一国到另一国”，“流散”自然表达了被分离并散居各地的结果。
- source_word: ἀπὸ ἔθνους εἰς ἔθνος
  choice: 从一国到另一国
  rationale: 保留由一个民族或国家到另一个民族或国家的迁移方向；此处“国”简洁自然，并对应原文重复出现的 ἔθνος。
theological_decisions:
- issue: 习语 γλῶσσα τρίτη 的解释
  choice: 正文保留较直译的“第三种舌头”
  alternative: 诽谤的舌头；两面舌；挑拨离间的话
  rationale: 现有希腊文本直译为“第三舌头”。正文不把其含义单一化，以保留原文的异常意象和解释空间；可能的习语含义列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“第三种舌头”刻意保留原文习语的陌生感；“使……动摇”“使……流散”呈现两个并列动词的力度。
