  yaml_path: translation/deuterocanon/sirach/028/021.yaml
  text: Its death is an evil death[b][a], and its Hades is more advantageous.
translation:
  language: zh_hans
  text: 它的死亡是可怕的死亡[a]，它的阴间反倒更可取[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”也可按希腊语的阴性形式译作“她”；这个代词回指上文的阴性先行词，很可能是舌头或毁谤人的言语。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“阴间反倒比它更可取”，或“死者之境反倒胜过它。”
    reason: alternative_reading
lexical_decisions:
- source_word: θάνατος … ὁ θάνατος
  choice: 死亡……死亡
  rationale: 原文两次重复同一名词，形成强调和鲜明的平行结构；中文保留重复，不改写为“结局”等词。
- source_word: πονηρός
  choice: 惨痛的
  rationale: 此处修饰“死亡”，兼有恶劣、悲惨、造成祸害之意；“惨痛的”在现代汉语中自然有力，又不强行限定为道德意义上的“邪恶”。
- source_word: αὐτῆς
  choice: 它的
  rationale: 希腊语阴性代词回指上文的阴性先行词，可能是“舌头”或毁谤性的言语。汉语用中性“它”保持回指，不因语法阴性而过度人格化。
- source_word: λυσιτελής μᾶλλον
  choice: 反倒更可取
  rationale: λυσιτελής 表示有利、有益或值得选择，μᾶλλον 标明比较。“反倒更可取”自然传达惊人的比较意味，同时不补出原文未明说的比较对象。
- source_word: ᾅδης
  choice: 阴间
  rationale: 指死者所在的领域；“阴间”是普通现代汉语中较透明的对应词，既不缩减为实体坟墓，也不等同于后世教义中的刑罚之地。
theological_decisions:
- issue: ᾅδης 的所指
  choice: 阴间
  alternative: 坟墓；死者之境；哈得斯
  rationale: 译作“阴间”保留死者领域的含义，避免把它解释成单纯的坟墓或特指地狱刑罚。
- issue: 第二个 αὐτῆς 与比较关系
  choice: 正文保留“它的阴间”这一属格结构，并译出“更可取”
  alternative: “阴间也比它更可取”
  rationale: 原文表面是“它的阴间”，但 μᾶλλον 也可能使读者理解为阴间与该先行词相比较。正文保留语法张力，脚注交代较顺畅的另一种理解，不把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“死亡”一词的重复以呈现原文修辞；用“惨痛”避免生硬的“邪恶的死亡”，用“阴间”而非“地狱”避免导入后期教义含义。
