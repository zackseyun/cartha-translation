  text: For an angry man kindles strife[a], and a sinful man stirs up friends[b], and among those making peace he casts slander.
translation:
  language: zh_hans
  text: 因为易怒的人[a]会点燃纷争，罪人会搅扰朋友，又会在使人和睦的人中间抛出毁谤之言[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “易怒的”也可译作“脾气暴躁的”；希腊词指容易发怒或以怒气为性情特征的人。
    reason: lexical_alternative
  - marker: b
    text: 直译为“抛出毁谤”。原文以投掷的意象描写有人把诬蔑性言语带进正在谋求和睦的人群中。
    reason: lexical_metaphor
lexical_decisions:
- source_word: θυμώδης
  choice: 易怒的
  rationale: 表示以怒气或急躁脾气为特征；“易怒的”自然准确，也保留性情上的持续倾向。
- source_word: ἐκκαύσει μάχην
  choice: 会点燃纷争
  rationale: “点燃”保留ἐκκαύσει的火焰意象；“纷争”比具体的肢体打斗更符合智慧文学中的人际冲突语境。
- source_word: ἁμαρτωλός
  choice: 犯罪的
  rationale: 保留其道德与宗教含义，并与前句“易怒的”形成形容性平行；不强化为固定身份标签。
- source_word: ταράξει φίλους
  choice: 会搅扰朋友
  rationale: ταράσσω可指扰乱、使动荡；此译保留朋友受到搅扰的开放表达，不擅自明确为挑拨朋友彼此相争。
- source_word: εἰρηνευόντων
  choice: 促成和睦的人
  rationale: 用动态表达呈现分词的行动意味，指正在谋求和平、调解或和睦的人。
- source_word: ἐκβάλλει διαβολήν
  choice: 抛出毁谤之言
  rationale: “抛出”保留ἐκβάλλει的鲜明动作意象，“毁谤之言”准确表达διαβολή所指的诬蔑性言语。
- source_word: ἄνθρωπος / ἀνήρ
  choice: 人
  rationale: 现代汉语“人”既自然又能承载希腊文格言中的泛指意义；汉语无需以男性词形重现希腊语阳性名词。
theological_decisions:
- issue: 格言中阳性单数名词的代表性范围
  choice: 译作泛指的“人”
  alternative: 译作“男人”或“男子”
  rationale: ἄνθρωπος与ἀνήρ在此用于平行格言，论述适用于一般人的行为；现代汉语用“人”可准确传达代表性意义，又不无根据地把教训限于男性。
- issue: 末句动作的主语衔接
  choice: 以“还会”承接“犯罪的人”
  alternative: 另立泛指主语“有人”
  rationale: 希腊文连续使用第三人称单数动词，最自然的句法衔接是让末句继续描述前述“犯罪的人”，同时不增加原文没有的新主语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“点燃”和“抛出”两处希腊文意象，并以“纷争”“毁谤之言”维持智慧文学的凝练格言风格。
