    rationale: Ψίθυρος指私下说人、散布流言或搬弄是非者，不必然指编造谣言。“散布流言的人”既保留秘密传播有害言语的语境，也避免添加“捏造”的含义。
  - severity: medium
    issue: “安然度日的人”未准确呈现εἰρηνεύοντας。
    rationale: 该分词指处在和平或和睦关系中的人；“安然度日”主要指安稳、无忧地生活，可能脱离人际和平的意思。
  - severity: low
    issue: 脚注“正文从希腊文本”措辞不够自然。
    rationale: 改为“正文依据希腊文本翻译”更符合现代标准汉语，并更准确说明翻译依据。
