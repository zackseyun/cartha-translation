  yaml_path: translation/deuterocanon/sirach/028/013.yaml
  text: Curse the whisperer and the double-tongued[a], for they have destroyed many who were at peace.
translation:
  language: zh_hans
  text: 要咒诅散布流言的人和口是心非的人[a]，因为他们毁了许多和睦相处的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本在这里较难理解，较直译为：“向它吐唾沫，它就熄灭；［两者都出自你的口］。”这可能承接上文以火比喻口舌的意象。希腊文本则作：“要咒诅散布流言的人和口是心非的人。”正文依据希腊文本翻译；希伯来文末句的方括号表示传文不确定。
    reason: alternative_reading
lexical_decisions:
- source_word: Ψίθυρον
  choice: 暗中造谣的
  rationale: 希腊词指暗地散布有害言语的人；此译保留隐秘言说的特点，也比“耳语者”更清楚地表达其恶意。
- source_word: δίγλωσσον
  choice: 口是心非的人
  rationale: 原意为“有两条舌头的”，比喻说话反复、欺骗；采用自然的现代汉语表达，同时保留其言语不忠实的含义。
- source_word: καταράσθε
  choice: 要咒诅
  rationale: 直译希腊语的命令式，不把其强烈措辞弱化为“要憎恶”或“要谴责”。
- source_word: εἰρηνεύοντας
  choice: 安然度日的人
  rationale: 表达处于平安状态的人，既保留分词的状态意义，也符合现代汉语习惯。
- source_word: רָקַק בָּהּ וְכָבְתָה
  choice: 向它吐唾沫，它就熄灭
  rationale: 这是现存希伯来文本较直面的读法，延续火焰熄灭的意象；因与希腊文本明显分歧，收入脚注而不置于正文。
- source_word: '[וּשְׁנֵיהֶם מִפִּיךָ הֵם]'
  choice: 两者都出自你的口
  rationale: 按希伯来语直译，并保留方括号所反映的文本不确定性；“两者”可能承接上下文中点燃与熄灭两种口舌作用。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本明显分歧
  choice: 正文采用希腊文本关于暗中造谣者和口是心非者的劝诫
  alternative: 按现存希伯来文本译作：“向它吐唾沫，它就熄灭；两者都出自你的口。”
  rationale: 希伯来文本虽为首要证据，但此处传文艰涩且末句带有编者方括号；希腊文本在上下文关于毁灭性言语的论述中语意完整。为不掩盖文本张力，正文采用希腊读法，脚注明载希伯来异文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“要咒诅”保留原文命令的力度；“暗中造谣的”和“口是心非的人”便于普通读者理解，并共同突出秘密诋毁与欺诈言语。脚注完整呈现希伯来读法及其不确定性。
