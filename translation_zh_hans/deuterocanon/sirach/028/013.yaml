revisions:
- from: 要咒诅暗中造谣的和口是心非的人[a]，因为他们毁灭了许多安然度日的人。
  to: 要咒诅散布流言的人和口是心非的人[a]，因为他们毁了许多和睦相处的人。
  rationale: 修订仅调整希腊文主文本中两处词义：以“散布流言的人”避免把私下恶意言语限定为“造谣”，并以“和睦相处的人”表达处于和平关系中的人。保留“咒诅”的命令力度、对“两舌”者的自然汉语表达，以及脚注中希伯来文与希腊文的分歧和不确定性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:37:04Z'
review_pass:
  verdict: revise
  source_fidelity: 正文依据希腊平行文本，保留了命令语气、对两类恶意言语者的谴责，以及“毁了许多处于和平中的人”这一结果。现有“暗中造谣的”将Ψίθυρον限定为捏造谣言，较原词“私下散布流言／搬弄是非者”狭窄；“安然度日的人”也偏向生活安逸，未充分表达εἰρηνεύοντας“与人和平、和睦相处”的状态。脚注对现存希伯来文及其与希腊文的重大分歧交代基本准确。
  naturalness: “要咒诅”庄重且可理解。“暗中造谣的”作为名词性短语略显生硬，且“造谣”含有编造的特定意思；“散布流言的人”更自然也更贴近原文。“和睦相处的人”比“安然度日的人”更准确、通顺。脚注中的“正文从希腊文本”宜改为“正文依据希腊文本翻译”。
  terminology: “咒诅”恰当地保留καταράσθε的强烈咒诅语气，不应无根据弱化。“口是心非的人”可传达δίγλωσσον的虚伪与两面言语，属自然现代汉语；虽未逐字保留“两舌”形象，仍可保留。希伯来文脚注应继续明确方括号所标示的是传文／复原的不确定性，而不是将其作为确定正文。
  issues:
  - severity: medium
