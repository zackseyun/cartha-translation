base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/019.yaml
  text: Blessed is the one sheltered from it[a], who has not passed through its wrath, who has not drawn its yoke, and has not been bound in its chains.
translation:
  language: zh_hans
  text: 蒙保守、免受它害的人有福了[a]！他未曾经历它的怒气，没有背负它的轭，也没有被它的锁链捆住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希腊文各处均使用阴性代词，承接上文毁灭人的舌头或恶言；本译按现代汉语习惯译作“它”。也可译作“蒙保守、免受她害的人……她的怒气……她的轭……她的锁链”，以较明显保留拟人化。
    reason: 说明希腊文阴性代词的上下文所指，并提供保留拟人化的可行译法。
lexical_decisions:
- source_word: μακάριος
  choice: 有福了
  rationale: 保留智慧文学中宣告福分的语气；比“快乐”更不偏重主观感受，也比“幸运”更庄重。
- source_word: σκεπασθεὶς ἀπʼ αὐτῆς
  choice: 躲过它
  rationale: 该被动分词表达蒙遮蔽、受保护而免遭其害；“躲过”在现代汉语中自然简洁，并明确呈现脱离危险的结果。
- source_word: διῆλθεν ἐν τῷ θυμῷ αὐτῆς
  choice: 经历它的暴怒
  rationale: διέρχομαι的穿越意象在此指亲身遭受；译作“经历”避免生硬，同时以“暴怒”表达θυμός的猛烈破坏力。
- source_word: εἵλκυσεν τὸν ζυγὸν αὐτῆς
  choice: 负起它的轭
  rationale: 保留“轭”这一受辖制、服苦役的具体隐喻；“负起”符合轭置于肩上承受的汉语表达。
- source_word: ἐν τοῖς δεσμοῖς αὐτῆς οὐκ ἐδέθη
  choice: 没有被它的锁链捆住
  rationale: 以“锁链”清楚传达δεσμοί的束缚意象，“被……捆住”保留原文被动结构及受奴役的意味。
theological_decisions:
- issue: 本节阴性代词的所指
  choice: 按上文理解为毁灭人的舌头或恶言，并在正文中用中性的“它”承接。
  alternative: 用“她”凸显希腊文阴性形式及拟人化。
  rationale: 阴性形式与上文语法阴性的“舌头”相应，并不必然赋予女性身份。现代汉语称非人格化的舌头或言语力量通常用“它”；脚注说明所指，以保留上下文联系和拟人色彩。
- issue: “负起它的轭”所表达的施受关系
  choice: 保留主动形式，表示此人没有承担或牵引它的轭。
  alternative: 解释为“没有被套上它的轭”。
  rationale: 原文εἵλκυσεν是主动语态，而下一分句明确使用被动语态；不将两者强行统一，可保留原文意象中的张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“有福了”保留祝福宣告的智慧文学语气；“轭”和“锁链”保留原文连续的奴役意象。正文中的脚注标记[a]与脚注对应。
