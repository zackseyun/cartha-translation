  text: A hastened quarrel kindles fire, and a hasty fight pours out blood.
translation:
  language: zh_hans
  text: 急促的争吵燃起火来，急促的争斗流出鲜血。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρις
  choice: 争吵
  rationale: 指言语或人际间的争执；译作“争吵”自然明白，并与后半句更具行动性的“争斗”形成递进。
- source_word: κατασπευδομένη
  choice: 急促挑起的
  rationale: 保留分词所表达的催促、加速之意；结合“争吵”，用“挑起”使汉语搭配自然，但不把责任限定于某个明确主体。
- source_word: ἐκκαίει πῦρ
  choice: 点燃烈火
  rationale: 直译其点火意象；“烈火”体现火势被激起的语感。
- source_word: μάχη
  choice: 争斗
  rationale: 可指争战、打斗或冲突；此处与流血相连，“争斗”既保留广度，也比“争吵”更强烈。
- source_word: κατασπεύδουσα
  choice: 仓促爆发的
  rationale: 表达冲突被催促、迅速推进的状态；不强行判定是“轻率”还是“急速”。
- source_word: ἐκχέει αἷμα
  choice: 使鲜血流淌
  rationale: 保留“倾流血”的结果性意象，同时采用自然、庄重的现代汉语。
