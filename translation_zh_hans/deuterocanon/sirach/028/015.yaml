  text: A third tongue has driven out strong women[a], and has deprived them of the fruit of their labor;
translation:
  language: zh_hans
  text: 第三舌头[a]赶走了刚强的妇女，又使她们失去劳苦所得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“第三舌头”。这可能指介入双方之间、挑拨离间的言语；也可理解为“离间的舌头”或“背后毁谤的舌头”。
    reason: 说明希腊语的特殊表达及其可能含义，同时不在正文中消除其含混。
lexical_decisions:
- source_word: γλῶσσα τρίτη
  choice: 第三者的舌头
  rationale: 原文直译近于“第三舌头”，指介入双方之间、搬弄是非并造成离间的言语。“第三者的舌头”既保留“舌头”的形象和“第三”的要素，也比生硬的“第三舌头”更符合现代汉语。
- source_word: γυναῖκας ἀνδρείας
  choice: 刚强的妇女
  rationale: ἀνδρείας在这里形容妇女勇敢、坚强；“刚强”庄重自然，并保留其力量与勇气的含义。
- source_word: ἐξέβαλεν
  choice: 赶走了
  rationale: 该动词意为赶出、驱逐；“赶走了”清楚表达这些妇女被迫离开的结果，而不额外限定具体场所。
- source_word: ἐστέρεσεν
  choice: 使她们失去
  rationale: 该词表示使人缺少或被剥夺；采用“使……失去”符合现代汉语，同时保留因有害言语而遭受损失的因果关系。
- source_word: τῶν πόνων αὐτῶν
  choice: 劳苦所得
  rationale: πόνων字面为“劳苦、辛劳”。在“使她们失去”的结构中，“劳苦所得”自然表达她们因辛劳而取得的成果，但不把所得过度具体化。
