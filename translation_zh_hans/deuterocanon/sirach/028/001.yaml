  yaml_path: translation/deuterocanon/sirach/028/001.yaml
  text: The one who takes vengeance will find vengeance from the Lord, and he will surely keep his sins in mind.[a]
translation:
  language: zh_hans
  text: 报复人的，必从主那里遭到报复；他必牢牢记着自己的罪。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存、且标作本节的希伯来文作：“不要为明日的患难忧惧，因为你不知道一天会带来什么。”这与此处《便西拉智训》的希腊文不相符，似乎属于另一节经文，或反映传抄或编号对应上的错置。因此，正文依据《便西拉智训》28:1的希腊文见证翻译。
    reason: textual_variant
  - marker: b
    text: “牢牢记着”：希腊文重复同一个动词以加强语气；也可译为“牢牢保留着”。这里指他不放下、仍保留着自己的罪。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐκδικῶν
  choice: 向人报复的
  rationale: 以泛指结构表达希腊语现在时分词所含的惯常行为意味；“报复”既自然，也能与下文同词根的ἐκδίκησιν形成呼应。
- source_word: παρὰ Κυρίου
  choice: 从主而来的
  rationale: παρά接属格在这里表示来源；译作“从主而来的”清楚表明报复来自主，同时不添加原文没有的方式说明。
- source_word: εὑρήσει ἐκδίκησιν
  choice: 必遭到……报复
  rationale: 直译“必找到报复”在现代汉语中生硬；“必遭到报复”自然地表达将遇见或承受报复，并保留ἐκδικῶν与ἐκδίκησιν的词根呼应。
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: 他的罪
  rationale: 按通常含义直译ἁμαρτίαι为“罪”，不淡化其道德和宗教分量。
- source_word: διατηρῶν διατηρήσει
  choice: 必被牢牢记下
  rationale: 希腊语以同一动词的分词和限定动词重复来加强语气。“牢牢”体现强调，“记下”传达罪被保留、记账而不被放过的语境含义；采用被动式，可避免在汉语中强行判定原文后半句省略主语的指向。
theological_decisions:
- issue: 希伯来文与希腊文见证在本节内容上不一致
  choice: 正文依据希腊文《便西拉智训》28:1翻译
  alternative: 按所提供的希伯来文译作：“不要为明日的患难忧惧，因为你不知道一日会生出什么。”
  rationale: 所提供的希伯来文与本节希腊文内容完全不同，并近似《箴言》27:1，显然可能属于另一节经文或传抄、对号上的错置。因此，以确实对应《便西拉智训》28:1的希腊文见证为正文依据，并用脚注如实说明分歧。
- issue: 后半句施事者的指向
  choice: 译为被动式“他的罪也必被牢牢记下”
  alternative: 明确译作“主必牢牢记住他的罪”或“他必牢牢记住自己的罪”
  rationale: 希腊文后半句使用阳性单数形式和“他的罪”，但在汉语中若补出“主”或“他自己”，会比原文更明确地判定施事者。被动表达保留罪被严格存记的核心意义和原文潜在的指代张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“向人报复的”保持智慧文学格言式的泛指语气；“从主而来的报复”保留原文的词语呼应；后半句用自然的被动结构，既适合普通读者，也避免过度解释省略主语。
