  text: Remember the end[a], and stop being hostile; remember decay and death[b], and remain in the commandments.
translation:
  language: zh_hans
  text: 要想到最终的结局[a]，不再怀有敌意；要想到腐朽和死亡[b]，并持守诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“末后的事”，可指一个人最终的结局，也可指事情最后的结果。
    reason: lexical_alternative
  - marker: b
    text: 此处所提供的希伯来文见证载有另一句格言，大意是：“……未听就回答事情。”这显示来源位置可能错配，并非本节通常意义上的直接异文。
    reason: textual_variant
lexical_decisions:
- source_word: μνήσθητι
  choice: 要记住
  rationale: 直接传达命令语气，也符合智慧文学劝诫的表达方式。
- source_word: τὰ ἔσχατα
  choice: 最终的结局
  rationale: 原文直译为“末后的事”；此处可指人最后的终局或事情最终的结果。“最终的结局”自然简洁，同时以脚注保留其语义幅度。
- source_word: παῦσαι ἐχθραίνων
  choice: 停止敌对
  rationale: 表达停止持续的敌视态度或敌对行为，不把含义缩窄为内心的“仇恨”。
- source_word: καταφθοράν
  choice: 腐朽
  rationale: 该词可指败坏、毁灭或腐朽；与“死亡”并列时，“腐朽”自然体现人的衰败和必死性。
- source_word: θάνατον
  choice: 死亡
  rationale: 标准对应词，与“腐朽”并列。
- source_word: ἔμμενε
  choice: 持守
  rationale: 此命令要求持续忠于某事；汉语中“持守诫命”比直译“留在诫命中”更自然，并保留坚持不离的含义。
- source_word: ἐντολαῖς
  choice: 诫命
  rationale: 保留其宗教和伦理分量；希腊文没有明说“上帝的”，因此不在正文中增补。
theological_decisions:
- issue: 本节主要文本依据
  choice: 以对应本节且语意连贯的希腊文平行文本为实际翻译依据，并在脚注说明所提供希伯来文的位置错配。
  alternative: 直接翻译所提供的希伯来文：“比过客更轻率的，是还没有听完就回答事情的人。”
  rationale: 所提供的希伯来文与《便西拉智训》28:6的希腊文内容并不对应，较可能属于来源提取时的位置错配，而非本节可直接并列的异文。采用希腊文可恢复本节连贯的劝诫，同时脚注诚实保留希伯来见证的问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“停止敌对”保留态度与行为两方面的可能含义；“持守诫命”是自然的宗教伦理用语，但不增补原文未明说的“上帝的”。
