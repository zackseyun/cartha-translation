  yaml_path: translation/deuterocanon/sirach/028/004.yaml
  text: He has no mercy on a man like himself[b][a], yet he asks for his own sins to be forgiven?
translation:
  language: zh_hans
  text: 他对与自己一样的人毫无怜悯，却还为自己的罪祈求吗？[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文在此处似乎与本节错配；本节因此依据希腊文见证翻译。
    reason: textual_variant
  - marker: b
    text: 也可按上下文译为：“却还求自己的罪得赦免吗？”希腊文直说“为自己的罪祈求”，所求的结果并未明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπʼ ἄνθρωπον ὅμοιον αὐτῷ
  choice: 对与自己一样的人
  rationale: 所给希伯来文与本节内容不相符，因此依据希腊文。此短语指与他同为人的人；译法保留“像他自己”的比较含义，同时符合现代汉语表达。
- source_word: οὐκ ἔχει ἔλεος
  choice: 毫无怜悯
  rationale: ἔλεος 在本段关于报复、宽恕与罪的伦理语境中意为“怜悯”；“毫无怜悯”自然地表达否定，并保留原文强烈对照。
- source_word: καὶ περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται
  choice: 却还为自己的罪祈求吗
  rationale: δεῖται 可指请求、恳求或祈求；原文只说“为自己的罪祈求”，并未明说所求结果。正文保留这一含蓄性，以免把“求赦免”直接补入原文；“却还”表达上下句在修辞问句中的反差。
theological_decisions:
- issue: 所给希伯来文与本节不相符时采用何种文本
  choice: 依据对应本节且符合上下文的希腊文翻译，并以脚注说明希伯来文错配
  alternative: 按所给希伯来文逐字翻译，尽管其内容显然属于别处
  rationale: 现存所给希伯来文意为“在席间微不足道的，是住在岳父家的新郎”一类内容，与《德训篇》28:4及其报复、怜悯和宽恕的上下文无关。希腊见证则与本节及上下文吻合，故作为此处有效底本，同时如实标明文本问题。
- issue: 是否明说祈求罪得赦免
  choice: 正文译作“为自己的罪祈求”，保留祈求结果未明说的张力
  alternative: 译作“求自己的罪得赦免”
  rationale: 希腊文 περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται 没有明确出现“赦免”一词。上下文强烈暗示求赦免，但不宜在正文中消除原文的含蓄；脚注可说明这一语境含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“他”承接希腊文单数男性形式，但句意泛指任何人；修辞问句及“却还”凸显不肯怜悯别人、自己却向上帝祈求之间的道德矛盾。
