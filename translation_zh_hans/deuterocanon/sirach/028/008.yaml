  language: zh_hans
  text: 远离争斗，便会少犯罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόσχου
  choice: 远离
  rationale: 该词为命令语气，要求人主动避开、不参与；“远离”自然简洁，也保留了刻意退出的意味。
- source_word: μάχης
  choice: 争斗
  rationale: μάχη既可指打斗，也可指争吵、纷争；此处用“争斗”能够涵盖人际冲突，不局限于肢体搏斗。
- source_word: ἐλαττώσεις
  choice: 就会少犯些
  rationale: 该将来时动词表达随之产生的结果，即避开争斗会使犯罪行为减少；结合宾语译为“少犯些”更符合现代汉语习惯。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 原文为复数，指具体的犯罪行为；汉语通常以“犯……罪”的结构自然表达，无须机械标出复数。
theological_decisions:
- issue: 减少罪的含义
  choice: 表述为犯罪次数或行为的减少
  alternative: 理解为罪责、罪性或抽象之罪的减轻
  rationale: 复数ἁμαρτίας与ἐλαττώσεις的直接搭配更自然地指所犯之罪减少；译文不把本句扩展为关于罪责消除或罪性改变的教义陈述。
translation_notes:
  register: 采用现代、凝练而庄重的智慧文学语体。“远离争斗”保留劝诫力度，“就会少犯些罪”清楚呈现命令与结果之间的关系。
