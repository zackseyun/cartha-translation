  yaml_path: translation/deuterocanon/sirach/028/016.yaml
  text: Whoever pays attention to it will never find rest[a], nor will he settle down in peace.
translation:
  language: zh_hans
  text: 留心它的人绝不会找到安歇，也绝不会安静地住下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ προσέχων αὐτῇ
  choice: 留心它的人
  rationale: 带冠词的现在分词表示泛指，即任何持续留意它的人；αὐτῇ按上下文指前文所说的舌头，在汉语中用“它”自然且不误作女性人物。
- source_word: οὐ μὴ εὑρῇ
  choice: 决找不到
  rationale: οὐ μή加虚拟式构成强烈否定；“决找不到”既保留强调语气，也符合现代汉语表达。
- source_word: ἀνάπαυσιν
  choice: 安息
  rationale: 该词表示休息、安歇或舒缓；“安息”简洁庄重，并与下句的安宁意象相呼应。
- source_word: οὐδὲ κατασκηνώσει
  choice: 也不能……居住
  rationale: κατασκηνόω本义为扎营、安营，亦可引申为定居或住下；此处译作“居住”保留稳定栖居的含义，避免把比喻过度具体化。
- source_word: μεθʼ ἡσυχίας
  choice: 安然
  rationale: ἡσυχία表示安静、平静、安宁；与“居住”搭配时，“安然”自然地表达不受搅扰的状态。
