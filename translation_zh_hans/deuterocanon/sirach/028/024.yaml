  text: 看哪，要用荆棘围住你的财产；要把你的银子和金子捆好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要用荆棘把你的财物围起来；要妥善保管你的银子和金子。”原文采用具体的谚语式图景，劝人谨慎守护贵重之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: 看哪
  rationale: 这是引起注意的命令语；“看哪”简洁有力，也符合智慧文学中郑重劝诫的语气。
- source_word: περίφραξον
  choice: 围住
  rationale: 该动词表示在四周设置围障；“围住”保留具体的防护意象，现代汉语也自然。
- source_word: τὸ κτῆμά σου
  choice: 你的产业
  rationale: κτῆμα指所拥有的财物或地产；“产业”可涵盖这两层意思，又与下句具体提到的银金有所区别。
- source_word: ἀκάνθαις
  choice: 用荆棘
  rationale: 与格在此表示工具或材料；“用荆棘”清楚呈现以带刺植物筑成围障的具体图景。
- source_word: τὸ ἀργύριόν σου
  choice: 你的银子
  rationale: 原文明确指银；“银子”既保留贵金属意象，也可自然暗示钱财。
- source_word: καὶ τὸ χρυσίον
  choice: 和金子
  rationale: 原文具体说金，与银构成并列；不泛化为“财富”，以保留原文形象。
- source_word: κατάδησον
  choice: 都要捆牢
  rationale: 该动词有绑紧、牢牢系住之意；“捆牢”保留字面的捆束图景，同时表达妥善保管贵重物的劝诫。
