base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/010.yaml
  text: As the fuel of a fire, so it will be kindled; according to a man's strength, so will his wrath be; and according to his wealth he will raise up his anger, and according to the firmness of the conflict it will be kindled.
translation:
  language: zh_hans
  text: 火的燃料有多少，烈怒就会燃起到什么程度；人的烈怒会与他的力量相称；他的财富有多少，他就会把怒气抬高到什么程度；争斗越强固，烈怒就越会燃起。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “燃料”也可译作“木柴”或“可燃物”；希腊文指供火燃烧的材料。
    reason: lexical_alternative
  - marker: b
    text: “争斗越强固”较直译地保留“争斗的坚固／强固程度”；按语境也可理解为争斗越激烈或越难平息。原文末句只说“会燃起”，没有明说主语；这里按上下文理解为烈怒，亦可作较开放的理解。
    reason: ambiguity
lexical_decisions:
- source_word: ὕλην
  choice: 燃料
  rationale: 在与“火”和“燃烧起来”搭配时，指供火燃烧的可燃物；“燃料”比“材料”自然，也不像“木柴”那样限定过窄。
- source_word: ἐκκαυθήσεται
  choice: 燃烧起来
  rationale: 保留将火点燃、使其炽烈燃烧的意象，并在首尾两处采用相同译法形成照应。
- source_word: ἰσχὺν
  choice: 力量
  rationale: 表示人的力量或能力；此处与其烈怒的程度形成对应。
- source_word: ἀνθρώπου
  choice: 人
  rationale: 希腊文单数在这里具有箴言式的泛指作用；现代汉语用“人”可自然保留其普遍意义。
- source_word: θυμός
  choice: 烈怒
  rationale: 该词着重强烈、激动的怒气；译作“烈怒”可与后面的ὀργή“怒气”略作区分，同时不夸大二者差异。
- source_word: πλοῦτον
  choice: 财富
  rationale: 指财物或由财富带来的资源与势力；“财富”清楚而中性。
- source_word: ἀνυψώσει
  choice: 加剧
  rationale: 字面义为抬高、提升；在“怒气”的搭配中，“加剧”自然表达使怒气升高的意思，同时承认原文带有上扬意象。
- source_word: ὀργήν
  choice: 怒气
  rationale: 常指愤怒；以“怒气”与θυμός所译的“烈怒”保持轻微但不过度技术化的区别。
- source_word: στερέωσιν
  choice: 激烈程度
  rationale: 本义涉及坚固、强固或强化；修饰争斗时，语境上指冲突变得强烈或难以平息。“激烈程度”是自然的语境译法，但以脚注保留较直译的可能。
- source_word: μάχης
  choice: 争斗
  rationale: 在本章论及口角、怒气和纷争的语境中，指人与人之间的冲突；“争斗”比军事性的“战斗”更合适。
theological_decisions:
- issue: ἀνθρώπου的泛指单数及阳性代词
  choice: 译为“人……他的”
  alternative: 译为“一个男人……他的”或改写为不带代词的泛指结构
  rationale: 原文是箴言式的泛指单数。汉语“人”本身不标示性别，既忠实于其普遍指向，也可用“他的”维持单数句法，而不额外限定为男性。
- issue: θυμός与ὀργή的区分
  choice: 分别译为“烈怒”和“怒气”
  alternative: 两者都译作“愤怒”，或分别译作“暴怒”和“忿怒”
  rationale: 两个词语义重叠却并非完全相同；当前译法保留轻微差别，又不把它们塑造成固定的神学术语。
- issue: 末句主语的歧义
  choice: 补出“火”作为“燃烧起来”的主语
  alternative: 不补主语，译作“也照样燃烧起来”，使其可能指怒气或争斗
  rationale: 希腊文末句只有动词，语法上主语含蓄；补“火”使首尾比喻在汉语中清楚，但脚注说明原文并未明说主语，以保留其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以“怎样……也怎样……”呈现κατά反复构成的对应关系；首尾保留火焰意象。中文标点将四个平行分句分成两个层次，避免生硬直译，同时以脚注交代ὕλη、στερέωσις及末句省略主语所形成的歧义。
