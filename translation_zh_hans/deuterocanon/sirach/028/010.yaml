revisions:
- from: 火怎样按着燃料[a]燃烧起来，人的烈怒也怎样按着他的力量而发；他怎样按着自己的财富加剧怒气，火也怎样按着争斗的激烈程度燃烧起来。[b]
  to: 火的燃料有多少，烈怒就会燃起到什么程度；人的烈怒会与他的力量相称；他的财富有多少，他就会把怒气抬高到什么程度；争斗越强固，烈怒就越会燃起。[a][b]
  rationale: 修订恢复原文四个以κατά引出的递进对应：燃料与烈怒燃起、人的力量与烈怒、财富与抬高怒气、争斗的强固与烈怒燃起。避免把原文未明言的主语确定为“火”，同时以脚注保留末句的句法开放性；“强固”也比“激烈程度”更少预断στερέωσις的含义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:35:28Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿将首尾两个ἐκκαυθήσεται明确补作“火”燃烧，改变了希腊文省略主语所维持的连贯比喻；在句法和上下文中，该动词更自然地延续“烈怒／怒气”的燃起意象。第三分句也应明确是人按其财富“抬高”怒气，而非与前后火的比喻交错成新的对应结构。
  naturalness: “火怎样按着燃料燃烧起来”及末句“火也怎样按着争斗的激烈程度燃烧起来”在现代汉语中较为拗口，且“按着”重复后使逻辑关系不清。改用“有多少……就……”和“与……相称”可保留箴言体平行而更自然。
  terminology: “燃料”“烈怒／怒气”“财富”“争斗”均可保留。στερέωσις不宜直接确定为“激烈程度”；译为“强固程度”较贴近其“坚固、稳固、强度”语义，并以脚注说明可按语境理解为冲突的强烈、难以平息。
  issues:
  - severity: high
    issue: 首尾分句补出“火”为燃烧主语。
    rationale: 原文两处均只用第三人称单数被动动词，未明说主语；将其定为“火”弱化了该节把怒气比作火焰、并可能由θυμός延续作隐含主语的表达。中文应避免无依据地固定为“火”。
  - severity: medium
    issue: 第三、四分句的平行关系在草稿中被改写。
    rationale: κατὰ τὸν πλοῦτον ἀνυψώσει ὀργὴν αὐτοῦ直指“他按自己的财富抬高怒气”；末句再以争斗的στερέωσις说明其燃起。应使这两层关系清楚。
  - severity: medium
    issue: 将στερέωσις定译为“激烈程度”过于解释性。
    rationale: 该词基本义为坚固、稳固、强度；“强固程度”保留原词意象，脚注可交代语境性的“激烈、难以平息”理解。
  revised_text: 火的燃料有多少，烈怒就会燃起到什么程度；人的烈怒会与他的力量相称；他的财富有多少，他就会把怒气抬高到什么程度；争斗越强固，烈怒就越会燃起。[a][b]
  revised_footnotes:
