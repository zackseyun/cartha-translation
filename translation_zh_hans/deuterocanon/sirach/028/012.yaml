  text: There was a coal before him; he blew on it[a], and it blazed up.
translation:
  language: zh_hans
  text: 他面前有一块火炭；他向那火炭吹气[a]，火炭就燃起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“你若向火星吹气，它就会燃起；你若向它吐唾沫，它就会熄灭；这两样都从你口中出来。”希伯来文见证较短，作：“他面前有一块火炭；他向那火炭吹气，火炭就燃起来。”
    reason: alternative_reading
lexical_decisions:
- source_word: הָיְתָה
  choice: 有
  rationale: 句首是存在句；现代汉语用“有”自然地保留其简明含义。
- source_word: לְפָנָיו
  choice: 他面前
  rationale: 保留希伯来文本阳性单数后缀所指的“他”；希腊平行文本改用第二人称，但正文以现存希伯来文为准。
- source_word: גַחֶלֶת
  choice: 一块炭
  rationale: גַחֶלֶת 指炭或余烬；“一块炭”贴近希伯来文本，也避免依照希腊文改译为“火星”。
- source_word: נָפַח בָּה
  choice: 他向炭吹气
  rationale: נפח 表示吹气；补出“炭”可消除汉语代词连用的生硬感，同时不增加原文含义。
- source_word: וּבָעֲרָה
  choice: 炭就燃烧起来
  rationale: בער 在此表示炭因吹气而燃起；“就……起来”自然表达前后相承及起始意味。
