  text: He, being flesh, keeps wrath; who then will make atonement for his sins?[c][b][a]
translation:
  language: zh_hans
  text: 他自己身为血肉之躯，却仍怀着怒气[b]；谁能为他的罪赎罪[c]呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存的希伯来文在这一行十分费解，在开罗藏经库抄本传统中似有讹误或高度省略。希腊文作：“他自己身为血肉之躯，却仍怀着怒气；谁能为他的罪赎罪呢？”本译文依照这一可恢复的句意。
    reason: textual_variant
  - marker: b
    text: “仍怀着怒气”也可译作“始终怀恨在心”。
    reason: lexical_alternative
  - marker: c
    text: “谁能为他的罪赎罪”也可译作“谁能赦免他的罪”。希腊文动词更具体地含有赎罪或除罪的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַל מֵחָתָן, אֹרֵחַ מַכְנִיס אֹרֵחַ
  choice: 依据希腊平行文本恢复全句意义
  rationale: 现存希伯来文在此处疑有讹误或严重省略，按其字面无法形成与上下文连贯的句子；因此以保存完整且意义清楚的希腊平行文本作为实际翻译依据，同时用脚注交代文本状况。
- source_word: αὐτὸς σὰρξ ὢν
  choice: 他自己身为血肉之躯
  rationale: “他自己”保留αὐτός的强调；“血肉之躯”保留σάρξ的具体意象，表达人的脆弱和必死性，不把它解释成特定教义中的“罪性”。
- source_word: διατηρεῖ μῆνιν
  choice: 仍怀着怒气
  rationale: διατηρεῖ表示持续保留，μῆνις指怒气或怨恨；“仍怀着怒气”自然地传达持续不放下愤怒的意思。
- source_word: τίς ἐξιλάσεται
  choice: 谁能……赎罪呢
  rationale: ἐξιλάσκομαι在这里带有赎罪、除罪的含义，不只是人际间的宽恕；疑问句保留原文的反诘力度。
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: 为他的罪
  rationale: “罪”是ἁμαρτία在此神学和智慧文学语境中的常规、简明译法。
theological_decisions:
- issue: 智慧文学语境中σάρξ的人论含义
  choice: 血肉之躯
  alternative: 凡人；不过是血肉
  rationale: 此处强调人的脆弱和必死性，而不是把σάρξ处理为技术性的“罪性”；具体的身体意象也得以保留。
- issue: ἐξιλάσεται的赎罪含义
  choice: 为他的罪赎罪
  alternative: 赦免他的罪；除掉他的罪
  rationale: “赎罪”保留原词的祭祀性和神学分量，同时不进一步判定赎罪者是谁或赎罪如何实现，从而保留原句的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“血肉之躯”保留圣经式具体意象；“却仍怀着怒气”突出身为脆弱凡人却执意持怒的反差。脚注标记按正文出现顺序列为[a][b][c]。
