  yaml_path: translation/deuterocanon/sirach/028/007.yaml
  text: Remember the commandments[a], and do not be angry with your neighbor; remember the covenant of the Most High, and overlook ignorance.
translation:
  language: zh_hans
  text: 要记住诫命，不要向邻舍动怒；也要记住至高者的约，并宽容无知。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无知”也可译作“无知所致的过错”；“宽容”也可译作“不予追究”或“略过不计”。
    reason: 保留ἄγνοιαν“无知”的基本词义，同时说明它在本节伦理语境中可指因无知而造成的冒犯，并反映πάριδε“略过、不计较”的含义。
lexical_decisions:
- source_word: μνήσθητι
  choice: 要记住
  rationale: 不定过去时中动命令式在此发出积极记念的劝告。“要记住”自然、直接；后半句按希腊文省略关系补出一次，使汉语清楚。
- source_word: ἐντολῶν
  choice: 诫命
  rationale: 保留其伦理与宗教语境中的分量；原文没有“律法的”等限定语，故不增添。
- source_word: μὴ μηνίσῃς
  choice: 不要……怀怒
  rationale: μή加不定过去时虚拟式构成禁止语；μηνίω指发怒或怀有怒气。“怀怒”既表达持续针对邻舍的怒意，又避免夸大为暴怒。
- source_word: τῷ πλησίον
  choice: 向邻舍
  rationale: πλησίον在伦理语境中指邻舍；“向邻舍怀怒”符合现代汉语表达。
- source_word: διαθήκην Ὑψίστου
  choice: 至高者的约
  rationale: διαθήκη在圣经希腊文中通常译为“约”；属格按原文保留为“至高者的约”，不解释成“与至高者所立的约”。
- source_word: πάριδε
  choice: 宽容
  rationale: 该命令式有不追究、越过不计之意。结合对象“无知”，译为“宽容”可自然表达伦理上的包容，但不意味着否认过错。
- source_word: ἄγνοιαν
  choice: 无知之过
  rationale: ἄγνοια字面为“无知、不知情”；语境中很可能指因无知而有的冒犯。正文用“无知之过”使汉语对象明确，同时以脚注保留较字面的译法。
theological_decisions:
- issue: 第二个宾语前省略支配动词
  choice: 在“至高者的约”前补出“也要记住”
  alternative: 保留无动词结构：“以及至高者的约，并宽容无知”
  rationale: 希腊文由开头的命令式支配相关宾语，随后转入另一个命令式。汉语若完全保留省略会显得残缺；重复“记住”只显明原有句法关系，不增加新的神学内容。
- issue: ἄγνοιαν所指的范围
  choice: 正文译作“无知之过”，脚注说明字面译法
  alternative: 仅译作“无知”
  rationale: 上下文谈到对邻舍的怒气，故此词很可能指因无知而造成的过错或冒犯；同时原词本身只说“无知”，因此用脚注保留其词义张力，不把解释绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“邻舍”“至高者”“约”“诫命”延续常见圣经用语；句式简洁，适合普通读者诵读。
