  text: It will never overpower the godly[a], and they will not be burned in its flame.
translation:
  language: zh_hans
  text: 它绝不能制伏敬虔的人[a]；他们也不会被它的火焰烧伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它绝不能抓住虔敬的人。”希腊语动词可以表示抓住、控制或胜过。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: 绝不能
  rationale: οὐ μή与不定过去时虚拟语气构成强烈的将来否定；“绝不能”既自然，又保留了坚决否定的力度。
- source_word: κρατήσῃ
  choice: 制伏
  rationale: κρατέω可表示抓住、控制或胜过；结合上下文中舌头如火的毁灭力量，“制伏”表达其不能控制或胜过敬虔之人，同时在脚注保留“抓住”的词义可能。
- source_word: εὐσεβῶν
  choice: 敬虔的人
  rationale: εὐσεβής指以敬畏、尊崇上帝为特征的人；“敬虔的人”在现代汉语宗教语境中清楚、庄重。
- source_word: φλογί
  choice: 火焰
  rationale: φλόξ特指火焰；“火焰”准确保留原文鲜明的火之意象。
- source_word: καήσονται
  choice: 被……烧伤
  rationale: 将来时被动语态表示遭受焚烧。“烧伤”不额外断言被彻底烧尽，避免将程度解释过度。
theological_decisions:
- issue: 阴性代词αὐτῆς的所指
  choice: 译作“它的”，指向上下文中被描绘为火的舌头或其毁灭力量
  alternative: 若突出舌头的拟人化，可译作“她的”
  rationale: 现代汉语通常以“它”指非人的舌头或毁灭性力量；这样既保持所指联系和火焰隐喻，也不无必要地强化拟人化。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“制伏”保留敌对力量试图占上风的语境；分号呈现两个并列而紧密相关的否定陈述。
