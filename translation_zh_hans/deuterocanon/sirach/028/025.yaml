  text: And make for your words a balance and a measure[a], and make for your mouth a door and a bolt.
translation:
  language: zh_hans
  text: 要为你的言语做天平和砝码[a]，也要为你的口做门和门闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “天平”所译的希腊词通常也可指“轭”；但它在这里与“砝码”并列，构成称量的比喻，意思是要衡量并约束自己的言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγοις
  choice: 言语
  rationale: 这里指人所说的话；“言语”既直接，又适合智慧劝诫的庄重语体。
- source_word: ζυγόν
  choice: 天平
  rationale: ζυγός通常可指“轭”，但与σταθμός并列时形成称量的意象；“天平”能清楚表达衡量、约束言语之意。
- source_word: σταθμόν
  choice: 砝码
  rationale: 该词可指称量所用的重量或标准；在“天平”之后译作“砝码”，可具体保留原文的称量图景。
- source_word: στόματί
  choice: 口
  rationale: 直译以保留随后为口安门闩这一具体而强烈的比喻。
- source_word: θύραν
  choice: 门
  rationale: 保留原文把嘴比作出入口、需要封闭管束的形象。
- source_word: μοχλόν
  choice: 门闩
  rationale: μοχλός在此指用来固定门的横木或闩；“门闩”自然明确，也体现严加约束。
- source_word: ποίησον
  choice: 做
  rationale: 两次使用“做”，对应原文重复的命令式，并保持平行结构；在比喻性造物语境中自然易懂。
