  text: For her yoke is an iron yoke[a], and her bonds are bronze bonds.
translation:
  language: zh_hans
  text: 因为她的轭是铁轭[a]，她的束缚是青铜束缚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它的轭……它的束缚”；若将这一意象理解为对舌头或毁谤之言的抽象指称，而不是拟人。
    reason: 代词与拟人手法的翻译异文
lexical_decisions:
- source_word: ζυγός
  choice: 轭
  rationale: 保留原文具体的轭之意象及其压迫、辖制的比喻力量，不泛化为“重担”。
- source_word: σιδηροῦς
  choice: 铁
  rationale: 直译其材质含义，并保持原文简练、有力的箴言式表达。
- source_word: δεσμοί
  choice: 锁链
  rationale: 该词泛指捆绑或拘束之物；“锁链”在现代汉语中自然清楚，也能与金属材质相配。虽比原词略具体，但比重复“束缚是青铜束缚”更自然。
- source_word: χαλκεῖοι
  choice: 青铜
  rationale: 此词指铜或青铜制成；在古代器物与圣经语境中，“青铜”是清楚、自然的现代译法。
- source_word: αὐτῆς
  choice: 她的
  rationale: 原文两次使用阴性属格代词，承接上下文中被拟人化的有害舌头或言语；“她的”保留这一文学手法。
theological_decisions:
- issue: 是否保留阴性拟人
  choice: 两处均译作“她的”
  alternative: 采用较抽象的“它的”，指舌头或毁谤之言
  rationale: 希腊文重复使用阴性代词，语境又把有害的舌头拟作施加辖制的力量。保留拟人可传达原文文学张力，而不额外引入教义解释。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。“轭”是读者可从圣经语境理解的具体意象；“铁轭／青铜锁链”的平行结构尽量保留希腊文的重复与力度。
