base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/023.yaml
  text: Those who forsake the Lord will fall into it[a], and it will burn among them and will certainly not be quenched; it will be sent against them like a lion[c][b], and like a leopard it will ravage them.
translation:
  language: zh_hans
  text: 离弃主的人必落入其中[a]；它必在他们中间燃烧起来[b]，绝不会熄灭。它必被差来，如狮子般攻击他们；又如豹[c]般蹂躏他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中”所指的是上文描述的毁灭性力量，尤其与舌头所发出的害人言语有关。
    reason: cross_reference
  - marker: b
    text: 或译：“在他们里面燃烧起来。”
    reason: lexical_alternative
  - marker: c
    text: 希腊词指豹一类的猛兽，也可译作“花豹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ καταλείποντες Κύριον
  choice: 离弃主的人
  rationale: καταλείπω表示离开、抛弃；用于“主”时，“离弃”既自然，也保留背离关系的严肃意味。Κύριον按神圣称谓译为“主”。
- source_word: ἐμπεσοῦνται εἰς αὐτήν
  choice: 必落入其中
  rationale: 忠实表达“落入”的空间性比喻；αὐτήν所指须由上文补足，因此正文不擅自明说为“舌头”。
- source_word: ἐν αὐτοῖς ἐκκαήσεται
  choice: 必在他们中间燃烧起来
  rationale: ἐκκαίω可指燃起或猛烈燃烧；ἐν αὐτοῖς既可理解为“在他们中间”，也可能偏向“在他们里面”，正文采用较符合蔓延性毁灭意象的前者，并以脚注保留另一读法。
- source_word: οὐ μὴ σβεσθῇ
  choice: 绝不会熄灭
  rationale: οὐ μή加虚拟式构成强烈否定；“绝不会”传达其强调语气。
- source_word: ἐξαποσταλήσεται ἐπʼ αὐτοῖς
  choice: 必被差来攻击他们
  rationale: 保留未来被动式“被差来”，并按敌对语境将ἐπί译为“攻击他们”，不额外指定差遣者。
- source_word: ὡς λέων
  choice: 像狮子一样
  rationale: 直接、自然地保留猛兽比喻。
- source_word: ὡς πάρδαλις
  choice: 像豹一样
  rationale: πάρδαλις指豹类猛兽；“豹”简洁、庄重，也避免在古代动物分类不确定时作过细的现代物种判定。
- source_word: λυμανεῖται αὐτούς
  choice: 蹂躏他们
  rationale: λυμαίνομαι表示摧残、毁坏；“蹂躏”能体现猛兽意象中的猛烈伤害，又不把动作窄化为撕咬。
theological_decisions:
- issue: αὐτήν以及本节后续省略主语的所指
  choice: 正文统一用“其中／它”，让所指由上文确定，并在脚注说明其与害人的舌及言语有关。
  alternative: 在正文中直接补成“舌头”，或用拟人化的“她”。
  rationale: 希腊文只使用阴性代词，其先行词来自上文。直接补出“舌头”虽清楚，却超出本节明说的内容；中文“她”会造成不必要的拟人化。采用“它”可保留上下文联系及原文的含蓄性。
- issue: 毁灭力量是“在他们中间”还是“在他们里面”燃烧
  choice: 正文作“在他们中间燃烧起来”。
  alternative: “在他们里面燃烧起来”。
  rationale: 介词短语两种理解均有可能。正文保留群体中蔓延的意象，脚注说明较内在化的读法，不将神学含义单一化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“绝不会熄灭”保留希腊文的强烈否定；“被差来”保留被动语态及未明说的施事者。标点将本节分成陷入、燃烧和猛兽攻击三个紧密相连的意象。
