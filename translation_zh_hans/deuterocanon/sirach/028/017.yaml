  text: A blow from a whip makes welts[a], but a blow from the tongue shatters bones.
translation:
  language: zh_hans
  text: 鞭子的一击造成瘀痕[a]，舌头的一击却会击碎骨头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青肿”或“伤痕”；这个希腊词指击打后留下的青肿和痕迹。
    reason: lexical_alternative
lexical_decisions:
- source_word: πληγὴ
  choice: 一击
  rationale: 此处着重击打的动作，并在前后两分句中形成鲜明平行；“一击”简洁地保留了这一结构。
- source_word: μάστιγος
  choice: 鞭子的
  rationale: 属格说明击打所用的器具；译为“鞭子的”保留具体意象，也符合现代汉语表达。
- source_word: ποιεῖ
  choice: 造成
  rationale: 表达击打产生瘀痕的结果，适合格言式的一般陈述。
- source_word: μώλωπας
  choice: 瘀痕
  rationale: 该词指受击后留下的青肿或痕迹；“瘀痕”兼顾伤势及可见痕迹，也比单纯的“伤口”更准确。
- source_word: γλώσσης
  choice: 舌头的
  rationale: 保留希腊文以“舌头”喻指伤人言语的具体形象，不将隐喻直接释作“言语”。
- source_word: συγκλάσει
  choice: 会击碎
  rationale: 希腊文为将来时，且动词带有彻底折断、击碎的强烈意味；“会击碎”既体现时态差异，也保留夸张有力的警戒语气。
- source_word: ὀστᾶ
  choice: 骨头
  rationale: 按原文保留复数名词的整体意象；现代汉语用“骨头”自然表达，无须另加复数标记。
theological_decisions: []
translation_notes:
  register: 采用简洁、对称的格言体。前后均用“一击”保持修辞平行；以“却”显明鞭打与恶语伤害之间的反差。保留原文前句现在时的一般因果和后句将来时的警示意味，不把“舌头”的隐喻解释性改写为“恶言”。
