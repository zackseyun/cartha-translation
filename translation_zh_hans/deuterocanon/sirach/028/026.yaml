lexical_decisions:
- source_word: πρόσεχε
  choice: 你要谨慎
  rationale: 表达持续警戒、留心的劝诫语气，符合现代汉语经文体。
- source_word: ὀλισθήσῃς ἐν αὐτῇ
  choice: 因它失足
  rationale: ὀλισθήσῃς意为滑倒、失足；ἐν αὐτῇ在此可表达相关范围或凭借关系。“因它”既自然，又不把所指对象重新明说，保留代词衔接及一定的原文张力。
- source_word: κατέναντι ἐνεδρεύοντος
  choice: 在埋伏者面前
  rationale: κατέναντι表示“在……面前”；ἐνεδρεύοντος是单数分词名词化用法，指正在设伏或伺机加害的人，译作“埋伏者”简洁贴近原文。
