base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/002.yaml
  text: Forgive your neighbor the wrong he has done, and then, when you pray, your sins will be released[a].[b]
translation:
  language: zh_hans
  text: 要饶恕邻人对你所行的不义；这样，你祈求的时候，你的罪也必得解除[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“你的罪将被解开”。“得解除”保留了原文的隐喻；也可理解为“得赦免”。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希伯来文见证与《便西拉智训》28:2的通常内容不符，看来属于另一处材料；因此本节正文以希腊文平行文本为主要依据。
    reason: textual_variant
lexical_decisions:
- source_word: ἄφες
  choice: 要饶恕
  rationale: 该不定过去时命令式可指“释放、宽免、饶恕”；在人际过犯的语境中，“饶恕”最自然，同时保留命令的语气。
- source_word: ἀδίκημα
  choice: 所行的不义
  rationale: 该词指实际造成的过错、伤害或不义行为。“所行的不义”既体现行为性质，也不把具体伤害范围缩窄。
- source_word: τῷ πλησίον σου
  choice: 邻人
  rationale: 在伦理语境中，πλησίον 指与自己有关联的他人；“邻人”保留圣经语体，且比单指住处相邻者更宽。
- source_word: δεηθέντος σου
  choice: 你祈求的时候
  rationale: 属格独立结构表达时间，动词特指恳求、祈求；此译比泛称“祷告”更贴近其求告意味。
- source_word: αἱ ἁμαρτίαι σου λυθήσονται
  choice: 你的罪也必得释放
  rationale: λυθήσονται 的字面意象是“被解开、获得释放”。译作“得释放”保留这一隐喻，不直接将其解释为较常见的“得赦免”；“也”呈现句中前后相应的关系。
theological_decisions:
- issue: 本节采用的主要文本
  choice: 以希腊文平行文本作为本节正文的翻译依据，并用脚注说明所给希伯来文与本节内容不符。
  alternative: 将所给希伯来文直接当作《便西拉智训》28:2翻译。
  rationale: 所给希伯来文意为“恐怕明天他来到，却已不在了；结果他为不属于自己的世界忧伤”，在语义上与传统编号的28:2不对应。希腊文则提供了连贯且与本节位置相符的见证。采用希腊文并公开注明文本错位，既不掩盖证据，也避免把另一段材料误列为本节。
- issue: 罪得释放与人的饶恕之间的关系
  choice: 按原文保留“这样……的时候……也必”的关联，不进一步说明其因果或教义机制。
  alternative: 明确解释为人的饶恕赚取神的赦免，或仅仅是已蒙赦免的证据。
  rationale: 原文把饶恕邻人与祈求时罪得释放紧密相连，却未详述两者的神学机制；译文应保存这种张力，不加入特定宗派的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“邻人”保留经文伦理语域；“所行的不义”较“得罪你的事”更贴近ἀδίκημα的客观过错含义。分号清楚呈现劝诫与后果之间的联系，脚注标记均已在正文出现。
