  yaml_path: translation/deuterocanon/sirach/028/018.yaml
  text: Many have fallen by the mouth of the sword[a], but not as those who have fallen because of the tongue.
translation:
  language: zh_hans
  text: 许多人倒在刀口之下[a]，却不及那些因舌头而倒下的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译作“在刀剑的口中”。这里译为“刀口”，既指刀刃，也保留了与下句“舌头”的呼应。
    reason: 说明原文习语及其修辞双关。
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 直接表达数量众多，符合现代汉语智慧文学的自然措辞。
- source_word: ἔπεσαν
  choice: 倒在……之下
  rationale: 保留πίπτω“倒下”的形象；结合刀剑语境，自然表达遭杀戮之意而不过度释义。
- source_word: ἐν στόματι μαχαίρας
  choice: 在刀口之下
  rationale: στόμα字面为“口”，此处是刀剑之刃的习语。“刀口”在汉语中既自然地指刀刃，也保留“口”的意象，以呼应下句的“舌头”。
- source_word: καὶ οὐχ ὡς
  choice: 却不及
  rationale: 希腊文比较关系较为简略；“却不及”保留其比较张力，又不擅自补入明确的比较维度，如人数或严重程度。
- source_word: οἱ πεπτωκότες
  choice: 那些……倒下的人
  rationale: 保留完成分词所指的既成状态，并与前句“倒”形成修辞重复。
- source_word: διὰ γλῶσσαν
  choice: 因舌头
  rationale: διά加宾格可表达原因；“因”简明自然，同时保留“舌头”这一具体意象，不抽象化为“言语”。
theological_decisions:
- issue: 刀剑与舌头之间的比喻对照
  choice: 采用“刀口”与“舌头”，保留身体部位相关的具体意象
  alternative: 译为“刀刃”与“言语”
  rationale: 本节的智慧文学力量在于有形武器与毁灭性言语的鲜明对照；“刀口”既符合汉语习惯，也比“刀刃”更能保留原文στόμα与γλῶσσα之间的意象联系。
- issue: οὐχ ὡς所比较的具体方面
  choice: 译作“却不及”，不明说是人数、程度或后果
  alternative: 译作“却没有因舌头倒下的人多”
  rationale: 原文省略了明确的比较标准。语境很可能涉及数量，但正文保留其真实的简略与张力，避免把一种解释写死。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“刀口之下”略带文学色彩，适合智慧文学；全句保持警句式节奏，并保留原文比较关系的含蓄性。
