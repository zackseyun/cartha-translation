  text: Better is a man who hides his folly than a man who hides his wisdom[b][a]; instruction is shame.
translation:
  language: zh_hans
  text: 隐藏自己愚昧的人，胜过隐藏自己智慧的人。[a]；羞耻的训诫。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文两处都用阳性单数“人”，在这句格言中具有代表性，也可译作“一个人……另一个人……”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文末尾还有一个难解的短语，直译近于“羞耻的训诫”（מוסר בשת），也可能是下文的标题。希腊文没有这个短语，只作：“隐藏自己愚昧的人，胜过隐藏自己智慧的人。”
    reason: textual_variant
lexical_decisions:
- source_word: טוב
  choice: 胜过
  rationale: 这里构成智慧文学中常见的比较句式；希腊文 κρείσσων 也明确支持“胜过／更好”的比较义。
- source_word: איש
  choice: 人
  rationale: 希伯来文用阳性单数“人”，但在格言中具有代表性；现代汉语用“人”既自然，也不额外限定为成年男性。
- source_word: מצפין
  choice: 隐藏
  rationale: 该分词表示把某事遮掩或秘而不宣；“隐藏”简洁，并保留原文两次重复所形成的对称。
- source_word: אולתו
  choice: 自己的愚昧
  rationale: “愚昧”符合智慧文学语域，也比“愚蠢”庄重；所有关系依照希伯来文后缀译为“自己”。
- source_word: חכמתו
  choice: 自己的智慧
  rationale: חכמה 的直接意义是“智慧”，且希腊文 σοφία 与之相符。
- source_word: מוסר בשת
  choice: 关于羞耻的训诫
  rationale: 原短语形式简短而意义不够确定，可理解为由“训诫／管教”和“羞耻”构成的标题式短语。译文保留为独立短句，不强行把它解释成“训诫就是羞耻”或并入前面的比较句。
