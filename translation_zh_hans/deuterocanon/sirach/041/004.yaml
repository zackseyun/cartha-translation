  to: 这是上帝给一切血肉之躯的份[a]；你为什么拒绝至高者的定旨[b]？无论十年、一百年，还是一千年[c]，在阴间没有关于生命的责问[d]。
  rationale: 修订仅收回末句中源文未明示的“因寿命长短而受”这一解释，并微调首句语序。这样既保留希伯来文本的残涩及希腊平行文本所提供的基本句义，也避免把此节发展为关于寿命评价或死后审判的断言。脚注完整保留“上帝／主”“份／审判”“律法／美意”、数字次序及末句困难等关键审校信息。
