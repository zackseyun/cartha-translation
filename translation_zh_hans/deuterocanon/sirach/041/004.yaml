  source_fidelity: 前半节基本忠实地反映希伯来文本，并适当以脚注交代与希腊平行文本的差异。“定旨”是对希伯来文“律法”与希腊文“美意”之间分歧的审慎折中，但须保留为文本不确定处。数字列举采用希腊文本清楚的“三项”读法是可接受的。末句原稿将“生命”具体解释为“寿命长短”，并加上“受”责问，超出希伯来残涩文本及希腊文“没有关于生命的责问／责备”所明示的内容，需收回为较保留的表达。
  naturalness: 原文整体庄重、通顺。“这是所有血肉之躯从上帝所得的份”语序稍显滞重，改为“这是上帝给一切血肉之躯的份”更合现代书面汉语。“在阴间都不会因寿命长短而受责问”虽流畅，却因释义过度而不宜保留；“在阴间没有关于生命的责问”虽略具源文的凝练感，仍属可理解的现代汉语，并忠实保留其困难。
