base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/004.yaml
  text: This is the lot of all flesh from God[a], so why reject the decree of the Most High? Whether for a thousand years, or a hundred, or ten[d][c][b], there is no rebuke of life in Sheol.
translation:
  language: zh_hans
  text: 这是上帝给一切血肉之躯的份[a]；你为什么拒绝至高者的定旨[b]？无论十年、一百年，还是一千年[c]，在阴间没有关于生命的责问[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“从上帝”；希腊平行文本作“从主”，并将“份”表达为“审判”。
    reason: alternative_reading
  - marker: b
    text: 希伯来抄本表面作“至高者的律法”，希腊平行文本作“至高者的美意”。正文“定旨”是依本节语境所作的折中译法，并非任一见证的直译。
    reason: alternative_reading
  - marker: c
    text: 希伯来文的数字排列艰涩，近于“一千年、一百和十”；希腊平行文本清楚作“无论十年、一百年，还是一千年”。正文采用希腊文所保存的次序。
    reason: textual_variant
  - marker: d
    text: 希伯来文这一短句残涩，含有“责问（或责备）”“阴间”和“生命”等词；希腊平行文本作“在哈得斯没有关于生命的责问”。正文保留“生命”与“责问”之间关系的未定性，未将其具体解释为寿命长短或死后审判。
    reason: textual_difficulty
lexical_decisions:
- source_word: זה חלק כל בשר
  choice: 这是所有血肉之躯……所得的份
  rationale: חלק的基本义是“份、所得之分”；“所有血肉之躯”保留“凡有血肉者”的希伯来习语，同时在现代汉语中指向必死的人类。希腊平行文本作“审判”，但现存希伯来文在此优先。
- source_word: מאל
  choice: 从上帝
  rationale: 希伯来文明确作“从上帝”；希腊平行文本作“从主”，作为异文收入脚注。
- source_word: תמאס
  choice: 拒绝
  rationale: מאס可指拒绝、厌弃；此处为反问，“拒绝”自然且与希腊文ἀπαναίνῃ“拒绝”相符。
- source_word: בתורת עליון / ἐν εὐδοκίᾳ Ὑψίστου
  choice: 至高者的定旨
  rationale: 希伯来抄本表面作“至高者的律法”，希腊文则作“至高者的美意”。上下文谈上帝为人所定的死亡，“定旨”能表达所命定之事，又不把有意义的抄本分歧暗中归入某一端；两种直译均列入脚注。
- source_word: לאלף שנים מאה ועשר / εἴτε δέκα εἴτε ἑκατὸν εἴτε χίλια ἔτη
  choice: 无论活十年、一百年，还是一千年
  rationale: 希伯来数字次序艰涩，字面近于“一千年、一百和十”；希腊平行文本清楚列出“十、一百、一千年”。正文采用希腊文所保存的递进结构，并注明希伯来见证的困难。
- source_word: איש תוכחות בשאול חיים / οὐκ ἔστιν ἐν ᾅδου ἔλεγמὸς ζωῆς
  choice: 在阴间都不会因寿命长短而受责问
  rationale: 希伯来文此句残涩，但保留“责问/责备”“阴间”“生命”等词；希腊文意为“在阴间没有关于生命的责问”。结合前列寿数，汉语以“因寿命长短而受责问”表达其关联，同时不将其扩展为末世审判教义。שאול译作“阴间”，保留古代希伯来语中死者所在之处的概念。
theological_decisions:
- issue: שאול / ᾅδης所指的死者领域
  choice: 阴间
  alternative: 哈得斯；坟墓
  rationale: 希伯来文见证使用שאול，现代中文以“阴间”最易懂，也比音译希腊词更贴近希伯来来源；不译作“地狱”，以免带入后期关于刑罚之地的特定含义。
- issue: 希伯来文“律法”与希腊文“美意”的差异
  choice: 定旨
  alternative: 至高者的律法；至高者的美意（或旨意）
  rationale: 正文用“定旨”承接本段关于死亡为上帝所定之份的语境，却借脚注完整保留两种见证，不把分歧处理成某一教派性的神意论断。
- issue: “生命的责问”与人在死后受审的关系
  choice: 因寿命长短而受责问
  alternative: 在阴间没有对生命的责问；在阴间没有生命的责备
  rationale: 前句列举不同寿数，因此将“生命”理解为寿命最符合近距语境；措辞只说明寿命长短本身不成为责问理由，不据此否定或肯定其他形式的死后审判。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“血肉之躯”保留源文的人类必死性意象；“所得的份”比“命运”更贴近חלק。“阴间”按古代文本中的死者领域使用，并非后期意义上的“地狱”。末句因源文艰涩而作有限度的语境化表达，脚注公开其字面困难。
