  terminology: “不义”对应 עול 合适；“统治”比现代政治色彩较强且含义较宽泛的“恶势力”更准确反映 ממשלה（统治、权柄、支配）。“后代”和“羞辱”均恰当。“常”表达 תמיד 的持续性，避免把它无根据地绝对化为“永远”。
