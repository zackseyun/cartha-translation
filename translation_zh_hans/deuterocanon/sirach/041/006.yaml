  text: The dominion of evil is from the child of injustice, and disgrace is always with his offspring.
translation:
  language: zh_hans
  text: 恶的统治出于不义之子；羞辱常与他的后代相随。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“罪人子女的产业必灭亡；羞辱必与他们的后代长存。”此处残存的希伯来文较为艰涩，尤其是第二分句；但两种文本都指向不义之人的后代长久蒙羞。
    reason: alternative_reading
lexical_decisions:
- source_word: מבן עול
  choice: 不义之子
  rationale: בן保留单数“子”，עול表示不义、邪恶或不公；中文以“不义之子”简洁保留希伯来文结构。介词מ־与后接名词短语的关系在残存文本中不够明朗，因此不强行译出明确的因果句式。
- source_word: ממשלת רע
  choice: 恶势力
  rationale: ממשלה可指统治、权势或支配力量，רע可作“恶”解。“恶势力”在现代汉语中自然，也保留了恶所具有的支配力量之意。
- source_word: וריש עם
  choice: 和……蒙受的羞辱
  rationale: 传世希伯来文此处艰涩。参照希腊文ὄνειδος，译为“羞辱”；用“蒙受”使其与后代的关系在中文中清楚，同时不重构不确定的希伯来文字形。
- source_word: זרעו
  choice: 他的后代
  rationale: זרע在此指子孙、后裔；“后代”是自然、清楚的现代汉语。
- source_word: תמיד
  choice: 长久
  rationale: תמיד表示持续不断。结合希腊文ἐνδελεχεῖ，译作“长久”比绝对化的“永远”更稳妥，并表达羞辱延续不止。
theological_decisions:
- issue: 艰涩希伯来文本与希腊平行文本的取舍
  choice: 正文以现存希伯来文的词汇和简短结构为主，并借希腊文确认第二分句为后代持续蒙羞。
  alternative: 完全依希腊文译作：“罪人之子的产业必灭亡；羞辱必与他们的后代长存。”
  rationale: 希伯来文是此处优先采用的原文证据，但句法及第二分句的传文存在困难。希腊文所反映的读法差异较大，适合在脚注中保留，而不宜无提示地取代希伯来正文。
- issue: 是否把首分句补成明确的因果命题
  choice: 采用并列名词短语，保留“מבן עול ממשלת רע”关系上的含混。
  alternative: 译作“不义之子带来恶的统治”或“恶的统治出于不义之子”。
  rationale: 介词מ־可支持来源关系，但残存句子的确切句法不够确定。中文若补入“带来”或“出于”，会比原文更明确，因此正文避免静默消除歧义。
translation_notes:
  register: 采用庄重而简明的现代标准汉语。因希伯来文句法残缺艰涩，正文以凝练的并列结构保存其张力，不以希腊文读法重写正文；脚注明示重要异文。
