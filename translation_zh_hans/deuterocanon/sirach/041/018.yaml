  naturalness: 行文庄重、清晰，适合本书体裁。“主人和主母”在现代普通话中不够明确：“主母”常特指一家女主人或家主之妻，未能稳定对应与“主人”并列的阴性词。改为“男主人和女主人”更自然且更准确。
