  yaml_path: translation/deuterocanon/sirach/041/018.yaml
  text: Before a master and mistress[a], be ashamed of a lie; before an assembly and the people, of transgression; before a companion and a friend, of wrongdoing; and where you sojourn[c][b], of theft.
translation:
  language: zh_hans
  text: 在男主人和女主人面前，要以说谎为耻[a]；在会众和民众面前，要以过犯为耻；在同伴和朋友面前，要以不义为耻[b]；在你寄居的地方，要以偷窃为耻[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“男主人和女主人”；希腊平行文本作“审判官和统治者”。正文以现存希伯来文本为主。
    reason: textual_variant
  - marker: b
    text: “不义”所译的希伯来词也可指“不忠”“失信”或“侵犯”。
    reason: lexical_alternative
  - marker: c
    text: 末句的希伯来文本含义不明确，直译近于“在你寄居的地方，因外人／外来的事物”。末词也可能涉及他人之物；希腊平行文本支持“偷窃”的理解，正文据此翻译。
    reason: textual_variant
lexical_decisions:
- source_word: מאדון וגברת
  choice: 在主人和主母面前
  rationale: 现存希伯来文本明确作“主人和主母”；在这一连串“以……为耻”的语境中，前缀 מ־宜按关系译为“在……面前”。
- source_word: על שקר
  choice: 以说谎为耻
  rationale: שקר可指虚假或谎言；汉语用“说谎”自然地表达这里应当引以为耻的行为。
- source_word: מעדה ועם
  choice: 在会众和民众面前
  rationale: עדה指聚集的群体或会众；“会众”保留群体含义，同时不限定为礼仪性集会。עם译为“民众”，以保留并列。
- source_word: על פשע
  choice: 以过犯为耻
  rationale: פשע表示越界、违犯，有时含悖逆意味；“过犯”保留其道德分量而不额外限定性质。
- source_word: מחבר ורע
  choice: 在同伴和朋友面前
  rationale: 二词都指亲近的社会关系；“同伴和朋友”自然，并保留原文的成对表达。
- source_word: על מעל
  choice: 以不义为耻
  rationale: מעל可指不忠、失信或侵犯；“不义”在此人际语境中保持较宽的意义，具体可能性在脚注中说明。
- source_word: וממקום תגור
  choice: 在你寄居的地方
  rationale: גור表示寄居、居留；译作“寄居”比泛化为“居住”更贴近希伯来语，同时在现代汉语中仍可理解。
- source_word: על זר
  choice: 以偷窃为耻
  rationale: 希伯来语末句读法和意义困难；זר本身可涉及外人、外来的或属于他人的事物。希腊平行文本支持“偷窃”的理解，因此正文采用这一最可能的语境意义，并以脚注标明不确定性。
