base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/016.yaml
  text: 'Instruction in shame: hear[a], sons, and be ashamed according to my judgments. Not every shame is fitting to keep[b], and not every disgrace is rightly chosen.'
translation:
  language: zh_hans
  text: 关于羞耻的训诲：儿子们啊，你们要听，并要按我的判断知耻。并非每一种羞耻都适宜保留，也并非每一种耻辱都值得选择。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“所以，你们要因我的话而知耻；因为持守每一种羞耻并不好，而且并不是一切事都在众人中凭着信实蒙认可。”其末句与现存希伯来文明显不同。
    reason: alternative_reading
lexical_decisions:
- source_word: מוסר בשת
  choice: 论羞耻的训诲
  rationale: מוסר在智慧文学中指塑造人的训诲或管教；这里引出教师对听众的劝诫，译作“训诲”庄重而自然。בשת指羞耻；“论羞耻”清楚表达本句所引出的主题。
- source_word: שמעו בנים
  choice: 儿子们啊，你们要听
  rationale: שמעו是复数命令式，译作“你们要听”；בנים明确是阳性复数“儿子们”，保留智慧教师对男性门生的传统称呼，并以“啊”呈现呼语。
- source_word: והכלמו
  choice: 并要……知耻
  rationale: 此处是劝令听众产生适当的羞耻感。“知耻”比直译“感到羞耻”更符合汉语劝诫语体，同时保留其伦理意味。
- source_word: על משפטי
  choice: 按我的判断
  rationale: על在此可表示依据，משפטי可指“我的判断、判定或准则”。译文保留“判断”，不把它进一步解释为律例或话语。
- source_word: לא כל בשת נאה לשמור
  choice: 不是每一种羞耻都宜于持守
  rationale: נאה表示合宜、适当，לשמור表示守住、保存。“宜于持守”保留原文把羞耻视为可保留之物的表达，也体现并非所有羞耻都应维持。
- source_word: ולא כל הכלם נבחר
  choice: 也不是每一种蒙羞都值得选择
  rationale: הכלם与前面的בשת同属羞耻语义场，但更可指蒙羞或受辱；נבחר本义为“被选择”。“值得选择”保留选择意象及其价值判断，而不将其简化成“可取”。
theological_decisions:
- issue: בנים的性别化称呼
  choice: 儿子们
  alternative: 孩子们；门徒们
  rationale: 希伯来文明确使用阳性复数“儿子们”，这是智慧教师称呼受教者的惯用形式。正文保留其性别和父子式教学语境，不中性化为“孩子们”，也不增译为原文未明说的“门徒”。
- issue: 希伯来文与希腊文末句的差异
  choice: 正文遵从现存希伯来文
  alternative: 依希腊文译为“并不是一切事在所有人看来都因信实而蒙认可”一类读法
  rationale: 此处希伯来文见证完整且可信度高，故正文按希伯来文翻译。希腊平行文本末句差异显著，应在脚注中透明呈现，而不混入正文。
- issue: 羞耻是否一概被肯定或否定
  choice: 保留原文对不同羞耻作伦理辨别的张力
  alternative: 概括成“要知耻”或“不要羞愧”
  rationale: 本节先命人知耻，随后又说明并非每一种羞耻都应持守或选择。译文不消解这种张力，也不替原文规定具体类别。
translation_notes:
  register: 采用现代、庄重而易懂的智慧训诲语体。“知耻”体现劝诫意味；“持守”和“值得选择”略带书面色彩，以保留希伯来文的保存与选择意象。脚注标记[a]置于相关整节之后。
