  text: Woe to you[a], wicked men[b], who have abandoned the law of the Most High.
translation:
  language: zh_hans
  text: 你们这些离弃至高者[a]的律法[b]的恶人有祸了！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作“至高的上帝”；希伯来文主要见证仅作“至高者”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文“律法”也可译作“训诲”或“教导”；此处的圣约含义及希腊文 νόμον 支持译作“律法”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוי / οὐαί
  choice: 有祸了
  rationale: 希伯来文与希腊文都以表示哀叹兼宣告审判的感叹语开头。“有祸了”在现代汉语中清楚自然，同时保留先知式警告的力度。
- source_word: לכם / ὑμῖν
  choice: 你们……有祸了
  rationale: 两处原文都直接指向受话者；将“你们”置于句首，符合现代汉语表达。
- source_word: אנשי רשע / ἄνδρες ἀσεβεῖς
  choice: 这些恶人
  rationale: 希伯来文直指属恶、行恶的人，希腊文侧重不敬虔。“恶人”以希伯来文为本，也能涵盖希腊文的道德与宗教含义；“这些”使直接称呼在汉语中更自然。
- source_word: אשר / οἵτινες
  choice: 你们
  rationale: 原文以关系从句说明所谴责的人。汉语拆为两个紧密相连的分句，并重复“你们”，比生硬照搬关系结构更自然，语义关系不变。
- source_word: עזבתם / ἐγκατελίπετε
  choice: 离弃了
  rationale: 该词表示舍弃、背离；“离弃”既保留主动背离的道德力度，也适合与上帝的律法搭配。
- source_word: תורת / νόμον
  choice: 律法
  rationale: 希伯来文 תורת 也可指“训诲”或“教导”，但本节很可能具有圣约语境，且希腊文 νόμον 支持“律法”。
- source_word: עליון / θεοῦ Ὑψίστου
  choice: 至高者
  rationale: 希伯来文仅有神圣称号“至高者”，没有明说“上帝”；主文据希伯来文保留较短形式。
theological_decisions:
- issue: 希伯来文 עליון 与希腊文 θεοῦ Ὑψίστου 的神圣称号差异
  choice: 至高者
  alternative: 至高上帝
  rationale: 现存希伯来文是本节主证，仅写“至高者”；希腊文把隐含的“上帝”明确表达出来。主文不增添希伯来文未明说的词，并在脚注保存希腊文异读。
- issue: תורת 的语义范围
  choice: 律法
  alternative: 训诲；教导
  rationale: “律法”保留可能的圣约含义，并获希腊文 νόμον 支持；脚注同时交代希伯来词较宽的语义范围，避免把它仅限于法规。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“你们这些恶人有祸了”保留原文直接宣告灾祸的力度；将原文关系从句拆为第二句，使汉语流畅，同时不改变谴责对象与原因之间的关系。脚注标记置于各自实际说明的词语之后。
