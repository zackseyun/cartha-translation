  text: for a friend[a], over words of reproach; and after giving a gift to a brother, do not reproach him.
translation:
  language: zh_hans
  text: 在朋友面前，因说责辱人的话应当羞愧[a]；送给弟兄礼物以后，不要责辱他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文极为简略，字面可作“从／在朋友面前，关于责辱的话”。其中与“朋友”的关系未能完全确定，也可理解为涉及朋友的责辱之言。希腊平行文本同样简略，作“从朋友，关于责辱的话”。本译文依本段列举应当羞愧之事的语境补出“应当羞愧”，但不据此断定责辱之言必然是直接对朋友说的。
    reason: textual_variant
lexical_decisions:
- source_word: מאוהב
  choice: 对朋友
  rationale: אוהב在此指“朋友”。前置介词短语处于省略结构中；结合本段“当羞愧”的劝诫框架，译作“对朋友”自然地承接所补明的言语行为，同时不把关系解释为恋爱之情。
- source_word: על דברי חרפה
  choice: 说了羞辱的话
  rationale: דברי חרפה指带来羞辱、责辱或侮辱的话。על的具体句法因希伯来文本简略而不完全明确；此处按劝诫语境表达为对朋友说羞辱之言。
- source_word: ומאחרי מתת
  choice: 给了……礼物以后
  rationale: מאחרי表示“在……之后”，מתת可指赠予或礼物。以动词结构译出，使现代汉语清楚流畅。
- source_word: אח
  choice: 弟兄
  rationale: 保留希伯来文“兄弟”的关系用语；智慧文学中也可能泛指同胞、亲友或同伴，因此采用较有延展性的“弟兄”。
- source_word: מנאץ
  choice: 不要再责辱他
  rationale: 此词在该简略劝诫句中按禁止义理解。希腊平行文本明确作“不要责辱”，并表明责辱的对象是受赠者；“再”凸显赠礼以后反以赠礼责难对方的不当。
theological_decisions:
- issue: 是否借助希腊平行文本补明简略希伯来文的劝诫语气
  choice: 第一分句依本段语境补出“羞愧”，第二分句按希腊文本译为“不要责辱他”
  alternative: 逐字保留为断裂式短语：“从朋友，因羞辱的话；给弟兄礼物以后，责辱者”
  rationale: 现存希伯来文高度简略且资料标注为重大不吻合。希腊平行文本保留了明确的禁止语气，而本章上下文又是列举应当羞愧或避免之事。这样处理以希伯来文词汇为主，同时用希腊文与篇章结构恢复可理解的劝诫句，并在注释中保留第一分句的不确定性。
- issue: 第一分句所隐含行为的解释
  choice: 理解为因对朋友说羞辱的话而应当羞愧
  alternative: 理解为因朋友所说的羞辱话而远离朋友，或“关于朋友的责辱之言”
  rationale: 希伯来文介词结构容许多种关系，希腊文ἀπὸ φίλων περὶ λόγων ὀνειδισμοῦ同样简略。所选译法最符合本段羞耻清单的形式，但不把它当作唯一确定的句法分析，因此以脚注说明歧义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“责辱”兼具责难与使人蒙羞之意，呼应前句“羞辱的话”。脚注明确保留希伯来文及希腊平行文本的省略性和真实歧义。
