  text: of staring at the face of another man’s wife[a], and of drawing near to her maidservant.
translation:
  language: zh_hans
  text: 盯着他人妻子的脸看[a]，又亲近她的婢女。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他人的妻子”：希伯来文זרה也可译作“陌生女子”或“外族女子”；希腊平行文本作“有丈夫的女人”，支持正文的译法。
    reason: 保留זרה的词义歧义，并说明希腊平行文本所提供的具体解释。
lexical_decisions:
- source_word: מהביט
  choice: 盯着……看
  rationale: הביט表示注视、观看；在这份列举可耻行为的语境中，不只是无意的一瞥。“盯着……看”自然地传达持续而不当的注视，也与希腊文κατανόησις所含的仔细观看之意相符。
- source_word: אל פני
  choice: 着……看
  rationale: 希伯来文直译为“向着……的脸”。现代汉语若硬译“看着……的脸”容易把重点落在面部；用“盯着……看”保留朝向某人注视的具体意味，同时更自然。
- source_word: זרה
  choice: 别人的妻子
  rationale: זרה本可指“陌生的、外来的女人”，在智慧文学中也常指不属于该男子、不可亲近的女人。希腊平行文本明确作γυναικὸς ὑπάνδρου，即“有丈夫的女人”，因此正文译作“别人的妻子”，并以脚注保留希伯来文的较宽含义。
- source_word: ומהתקרב
  choice: 又亲近
  rationale: קרב意为走近、接近。此处“亲近”既保留接近之意，也能表达语境中越界亲昵的可能含义，而不把性意味说得过死。
- source_word: שפחתה
  choice: 她的婢女
  rationale: שפחה指女性仆役或女奴。“婢女”简洁、庄重，并保留其女性家仆及从属身份；经文本身没有要求在正文中进一步界定其法律身份。
theological_decisions:
- issue: זרה应理解为一般的陌生女子，还是有夫之妇
  choice: 正文译作“别人的妻子”
  alternative: “陌生女子”或“外族女子”
  rationale: 希伯来词本身存在较宽的词义，但希腊平行传统明确指向有夫之妇。正文采纳这一较具体的语境解释，脚注则保留希伯来文真实存在的歧义，避免把该词误解为单纯的族群身份。
- issue: “亲近”是否明确指性行为
  choice: 保留为“亲近”
  alternative: “靠近”或明确译成调情、发生关系
  rationale: 希伯来文只表达接近，语境可暗示不当亲昵，却没有明确陈述具体性行为。因此保留含蓄张力，不作过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的表达。经节是前文“当以……为耻”一类清单的续句，因此保留短语式结构，不擅自补出主句。
