  text: Hidden wisdom and a concealed treasure—what benefit is there in either of them?[a][b]
translation:
  language: zh_hans
  text: 隐藏的智慧和秘藏的财宝，两者有什么益处呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本在本句之前另有一句：“孩子们，要平安地持守训诲。”本译文所依据的希伯来文见证则从“隐藏的智慧”开始。
    reason: textual_variant
lexical_decisions:
- source_word: חכמה
  choice: 智慧
  rationale: 此处指智慧，与希腊文 σοφία 相符；上下文将其比作有价值的财宝。
- source_word: טמונה
  choice: 隐藏的
  rationale: 该分词表示被藏起来或收存不露；“隐藏的”简明自然，又不把意思限定为埋在地下。
- source_word: אוצר
  choice: 财宝
  rationale: 在与智慧平行的表达中，指贵重之物，而非储藏之处；希腊文 θησαυρός 也支持这一理解。
- source_word: מוסתר
  choice: 秘藏的
  rationale: 表示被遮掩、藏而不露；与前面的“隐藏”形成诗意对应，同时避免用词完全重复。
- source_word: מה תועלה
  choice: 有什么益处呢
  rationale: 这是询问实际效益的反问；该译法符合现代汉语，也保留原文的反问语气。
- source_word: בשתיהם
  choice: 两者有什么益处
  rationale: 希伯来文直指“二者／两者”。中文如此表达自然，并保留原文把隐藏的智慧与秘藏的财宝合并而论的措辞，不改写成“任何一个”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“隐藏的智慧”与“秘藏的财宝”构成平行结构；“两者有什么益处呢”保留简洁有力的反问。
