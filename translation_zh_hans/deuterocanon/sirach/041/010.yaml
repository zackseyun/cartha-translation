  text: Everything from nothing returns to nothing[a]; so the ungodly go from emptiness to emptiness.
translation:
  language: zh_hans
  text: 凡从虚无而来的，都归回虚无[a]；不敬虔的人也从空虚走向空虚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“凡出于尘土的，都要归于尘土；不敬虔的人也照样从咒诅走向灭亡。”希腊文所反映的本节形式与现存希伯来文有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: כל מאפס אל אפס ישוב
  choice: 凡从虚无而来的，都要归回虚无
  rationale: 以“凡……都……”表达 כל 的总括意义，并保留 מאפס／אל אפס 的重复结构与 ישוב“归回”的方向性。“虚无”比口语化的“什么都没有”更适合这句凝练、庄重的箴言。
- source_word: כן
  choice: 也是这样
  rationale: 清楚引出上下两分句之间的类比关系，现代汉语自然，同时不增添因果含义。
- source_word: חנף
  choice: 不敬虔的人
  rationale: 该词可指不虔诚、亵渎或虚伪的人；此处希腊平行文本的 ἀσεβεῖς 支持较宽泛的宗教—道德含义，因此不窄化为“伪善的人”。
- source_word: מתהו אל תהו
  choice: 从空虚走向空虚
  rationale: 保留 תהו 的首尾重复和动态结构。“空虚”可表达徒然、虚空之意，又避免把本句过度解释为创世语境中的“混沌”。“走向”自然呈现从起点到终点的进程。
theological_decisions:
- issue: חנף 的含义
  choice: 不敬虔的人
  alternative: 伪善的人；不虔诚的人
  rationale: 原词确有“亵渎、不敬虔”及某些语境中的“虚伪”含义。这里采用范围较宽的“不敬虔的人”，与希腊平行文本相合，又不把道德—宗教含义限定为表里不一。
- issue: 希伯来文与希腊文见证之间的关系
  choice: 正文依现存希伯来文翻译，脚注完整保留差异显著的希腊平行文本
  alternative: 正文采用希腊文“从尘土归于尘土”；或将两种文本调和
  rationale: 现存希伯来文在本节可用且可信度高，应作为正文依据；希腊文的意象和结局措辞均明显不同，属于真实的异文传统，不宜静默舍弃或混合。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“虚无”与“空虚”分别对应 אפס 和 תהו，既保留原文词语差别，也重现两组首尾重复。脚注标记 [a] 已置于相关正文之后。
