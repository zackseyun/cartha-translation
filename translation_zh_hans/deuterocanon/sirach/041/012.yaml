  text: Be concerned for your name, for it will go with you more than a thousand stores of wisdom.
translation:
  language: zh_hans
  text: 要顾惜自己的名声，因为它会伴随你，胜过一千个智慧宝藏。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“一千个智慧宝藏”；希腊文本作“一千个巨大的黄金宝藏”。
    reason: 希伯来原文与古希腊平行文本在宝藏的内容有所不同；正文优先采用高置信度的希伯来文本。
lexical_decisions:
- source_word: פחד על שם
  choice: 要顾惜自己的名声
  rationale: פחד在这里并非单指感到恐惧，而是要求人对“名”怀有警觉和重视；“顾惜”自然表达谨慎维护之意。“名声”传达שם在本句中所指的名誉，而“自己的”由语境补出，使现代汉语通顺。
- source_word: כי הוא ילוך
  choice: 因为它会伴随你
  rationale: 按希伯来文本直译其伴随、同行的意象，不把这句话解释成特定的身后名望观。
- source_word: מאלפי אוצרות חכמה
  choice: 胜过成千上万的智慧宝藏
  rationale: מאלפי表达比较意义和极大的数量；אוצרות可指宝藏或宝库，此处用“宝藏”较自然，并保留希伯来文本较不寻常的“智慧”，不以希腊平行文本的“金子”替换。
theological_decisions:
- issue: “名”是否应解释为死后长存的名誉
  choice: 只译为“名声”及其“伴随”人的作用
  alternative: 明确译作“死后仍长存的美名”
  rationale: 希伯来文本本身没有明确提到死亡或身后存留；应保留其开放性，避免加入经文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语气。“顾惜”兼具重视和维护之意；保留“智慧宝藏”的独特表达，不按希腊文本或后世解释加以平滑。
