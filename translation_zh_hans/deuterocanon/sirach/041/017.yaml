  text: Be ashamed before father and mother for sexual immorality[a], and before a ruler in office for lying.
translation:
  language: zh_hans
  text: 要因淫乱在父母面前感到羞愧，也要因说谎在在位的首领[a]面前感到羞愧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在位的首领”按希伯来文可直译为“坐着的首领”；希腊文平行文本作“领袖和有权势者”。这里指身居权位的人。
    reason: alternative_reading
lexical_decisions:
- source_word: בוש
  choice: 感到羞耻
  rationale: 该祈使形式是在劝人存羞耻之心；译为“感到羞耻”自然清楚，也避免误解为被别人羞辱。
- source_word: מאב ואם
  choice: 在父母面前
  rationale: בוש 后的 מן 可指出人在谁面前感到羞耻；希腊文平行文本也支持这一关系意义。
- source_word: אל זנות
  choice: 因淫乱
  rationale: זנות 泛指不正当的性行为，不宜限缩为卖淫；“淫乱”简洁庄重，并保留其广义伦理含义。
- source_word: מנשיא יושב
  choice: 在居位的首领面前
  rationale: 希伯来文直译近于“在坐着的首领面前”；“居位”保留其坐于权位、履行职权的意象，同时使现代中文读者明白这是权威人物。
- source_word: אל כחש
  choice: 因说谎
  rationale: כחש 指虚假或欺骗；在伦理劝诫中，“说谎”直接自然，亦与希腊文 ψεῦδος 相符。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。重复“感到羞耻”以清楚呈现两组平行结构；“居位”略带书面色彩，用来保留希伯来文 יושב 的权位意象。
