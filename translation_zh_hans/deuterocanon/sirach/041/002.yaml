base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/002.yaml
  text: O death, how fitting is your sentence for a man who is needy and lacking strength, stumbling in everything, defiant, and having lost hope.
translation:
  language: zh_hans
  text: 死亡啊，你的判决何等合宜，临到那困苦无力、事事踉跄受困、抗拒不从、已经失去希望的人！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在“力量衰减”之后另有“年老至极、为一切忧虑”，并作“失去忍耐”；现存希伯来文本则作“事事踉跄受困”和“失去希望”。正文依希伯来文本翻译。
    reason: 希伯来文与希腊平行文本在本节有显著差异，需向读者交代主要异文而不把两种文本静默混合。
lexical_decisions:
- source_word: האח למות
  choice: 死亡啊
  rationale: 按对死亡的直接呼告处理；האח在此表达感叹，现代汉语以“死亡啊”自然承接下文。
- source_word: כי טוב חקיך
  choice: 你的判决何等合宜
  rationale: חקיך字面可指“你的定例/裁决”；结合对死亡的呼告及希腊文τὸ κρίμα，译为“判决”，טוב在语境中表达适切而非道德上的良善。
- source_word: איש אונים וחסר עצמה
  choice: 困苦无力的人
  rationale: 该短语描述处境艰难且力量不足的人；希腊文ἐπιδεομένῳ καὶ ἐλασσουμένῳ ἰσχύϊ支持“缺乏、力量衰减”的理解。
- source_word: איש כושל ינקש בכל
  choice: 事事踉跄受困
  rationale: כושל表示踉跄、衰弱或跌倒，ינקש表示落入网罗、被绊住；合译以保留身体衰弱与处处受阻的双重意象。
- source_word: סורב
  choice: 抗拒不从
  rationale: 该词可表示顽梗、悖逆或不服从；希腊文ἀπειθοῦντι也支持“不从”，此译避免将其仅理解为性格上的固执。
- source_word: אובד תקוה
  choice: 已经失去希望
  rationale: 直译为“失去希望”；希腊平行文本作“失去忍耐”，但现存希伯来文明确是תקוה（希望）。
theological_decisions:
- issue: 死亡的“判决”是否带有肯定死亡本身为善的含义
  choice: 译作“何等合宜”
  alternative: “何等美好”
  rationale: 经文谈的是死亡对于受苦无望者的适切性，不必引申为死亡在本质上是善；这样既保留经文张力，也避免加入系统神学判断。
- issue: סורב所指是性格固执还是对命令的悖逆
  choice: 抗拒不从
  alternative: 倔强
  rationale: 希伯来词与希腊平行文本均容许不服从之意；采用较宽的表达，不限定抗拒的具体对象。
translation_notes:
  register: 采用庄重而现代的直接呼告句式。“临到”补足汉语句法，使“死亡的判决”与所描述之人的关系清楚；并列短语保持经文逐层加重的节奏。
