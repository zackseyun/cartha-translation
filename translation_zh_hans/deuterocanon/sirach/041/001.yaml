base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/001.yaml
  text: O death[a], how bitter is your remembrance to a man at ease in his possessions, to a man untroubled and prospering in everything[b], and still strong enough to enjoy pleasure.
translation:
  language: zh_hans
  text: 死亡啊，人一想到你，对于一个安然享有自己财物[a]、安逸无忧、凡事顺利、仍有力量享受乐趣[b]的人来说，是多么苦涩！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安然享有自己财物”所据的希伯来语短语含义略不确定，也可理解为“安居于自己的处境”；希腊文作“在自己所有的财物中安然度日”。
    reason: textual_variant
  - marker: b
    text: 希伯来文直译为“仍有力量接受乐趣”；希腊文更具体地作“仍有力量进食”。
    reason: alternative_reading
lexical_decisions:
- source_word: מה מר זכרך / ὡς πικρόν σου τὸ μνημόσυνόν
  choice: 你的名被人想起……是多么苦涩
  rationale: 希伯来文 זכרך 和希腊文 μνημόσυνον 都指对死亡的记念或想起，而不是笼统说死亡本身苦涩；此译保留对死亡的直接呼告，并以自然汉语表达被人想到之意。
- source_word: לאיש שוקט על מכונתו / ἀνθρώπῳ εἰρηνεύοντι ἐν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: 对一个安享自己所有……的人
  rationale: 希伯来语短语略有不确定，可理解为安居于自己的处境；希腊文则明确指安然生活在自己所有之中的人。“安享自己所有”兼顾两种见证。
- source_word: איש שליו / ἀνδρὶ ἀπερισπάστῳ
  choice: 无忧无虑
  rationale: 希伯来文表示安宁、安逸，希腊文带有不受搅扰或牵累之意；“无忧无虑”在现代汉语中自然地涵盖二者。
- source_word: ומצליח בכל / καὶ εὐοδουμένῳ ἐν πᾶσιν
  choice: 凡事顺利
  rationale: 希伯来文和希腊文均表达各方面亨通、成功；“凡事顺利”清楚自然，并保留范围的全面性。
- source_word: ועוד בו חיל לקבל תענוג / καὶ ἔτι ἰσχύοντι ἐπιδέξασθαι τροφήν
  choice: 仍有力享受乐趣
  rationale: 希伯来文直指仍有力量接受或享受“乐趣”，希腊文则具体作有能力进食。正文以现存希伯来文为主，不将其较宽的含义缩限为食物，并在脚注注明希腊文。
theological_decisions:
- issue: איש 的阳性单数表达
  choice: 一个……的人
  alternative: 一个男人
  rationale: 原文以阳性单数作代表性表达；现代汉语的“人”并不强行改成复数或抽象群体，同时避免“男人”在此处可能造成的不必要性别限定。
- issue: 希伯来文与希腊平行文本的取舍
  choice: 正文依希伯来文译作“享受乐趣”，以希腊文在脚注中说明“进食”
  alternative: 正文依希腊文译作“仍有力进食”
  rationale: 现存希伯来文可信度高，תענוג 明确是“乐趣、享受”；希腊文可能保存了更具体或不同的读法，适合注明而不宜无声取代希伯来正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。以“死亡啊”保留原文呼语；句式略作汉语化重组，使“苦涩”自然统摄后面的对象与处境。脚注标记均置于正文句末，分别对应处境短语和末句异读。
