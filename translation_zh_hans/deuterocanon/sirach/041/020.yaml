  text: Be ashamed of refusing a request[a], and of turning away the face of your neighbor.
translation:
  language: zh_hans
  text: 要因拒绝别人的请求而羞愧，也要因转脸不顾邻舍而羞愧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节现存希伯来文措辞艰涩，与希腊文差异很大；尤其后半句的词形和句法不确定。正文将其谨慎译为“转脸不顾邻舍”；该处也可能涉及“邻舍的怒气”。希腊文大意是：“也要以在有关静默的事上问候，以及注视一个女伴（或：妓女）为耻。”
    reason: alternative_reading
lexical_decisions:
- source_word: ממנוע
  choice: 不肯
  rationale: מן与מנע的形式表达“扣住、不给、拒绝”之意；结合后面的“所求”，译为“不肯”自然地传达拒绝之意。
- source_word: מתת שאלה
  choice: 应允所求
  rationale: 传本措辞艰涩；מתת通常与“给予、礼物”有关，שאלה则指“请求、所求之事”。合译为“应允所求”，既保留给予所求之物的含义，也避免生硬的“请求的礼物”。
- source_word: מהשב
  choice: 让……转脸而去
  rationale: השיב可表示使之返回或转开；在本句有文本或语义疑难的情况下，此译表达使邻舍受拒而离开的动作。
- source_word: אפי רעך
  choice: 邻舍转脸
  rationale: 所传希伯来文אפי本身不稳定，可与“怒气”相关，但主句按语境理解为使邻舍的脸转开，即令求助者失望而去；显著歧义在脚注中说明。
- source_word: רעך
  choice: 邻舍
  rationale: רעך指与你有社会关系的同伴、近人或邻舍；“邻舍”保留其伦理意味，也符合庄重的现代圣经汉语。
theological_decisions:
- issue: 现存希伯来文的语义不确定，且与希腊文平行文本显著不同
  choice: 正文依现存希伯来文及上下文，译作因拒绝所求、使邻舍转脸离去而羞耻，并用脚注明确文本分歧。
  alternative: 希腊文大意为：“也要以在静默之事上问候，并注视女伴／妓女为耻。”希伯来文也可较直译为：“扣住请求的给予，转回你邻舍的怒气。”
  rationale: 以现存希伯来文为正文基础，但不把艰涩的אפי强行解释为毫无疑问的“脸”或“怒气”；脚注保留希伯来文内部疑难和希腊文的重大异文，避免消除真实的文本张力。
translation_notes:
  register: 采用现代、庄重而通俗的劝诫语体；重复“为耻”以清楚呈现本段羞耻清单的句法框架。“应允所求”比逐字译作“给予请求”更符合现代汉语，同时不限定请求的具体内容。
