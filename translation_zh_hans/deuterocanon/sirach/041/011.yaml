  text: A man's body is vanity[a], but a gracious name will not be cut off.
translation:
  language: zh_hans
  text: 人的身体不过是虚空，但仁慈的名声不会断绝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“人的哀伤在他们的身体中；罪人的名不会以善的方式被涂抹掉。”后半句中 οὐκ ἀγαθόν 的句法归属有歧义，也可理解为：“罪人的名不会作为美名被涂抹掉”，或“罪人的名永远不会被涂抹掉”。希伯来文则作：“仁慈的名声不会断绝。”
    reason: 交代希伯来文与希腊文的异文，并保留希腊文句法上的真实歧义。
lexical_decisions:
- source_word: הבל
  choice: 虚空
  rationale: 该词可指气息、雾气般的短暂与虚幻；“虚空”保留智慧文学中的传统回响，并在此表达肉身的短暂无常。
- source_word: אדם
  choice: 人
  rationale: 原文为单数，但在箴言式表达中代表一般的人；现代汉语用“人”既保留单数形式，也自然涵盖全人类。
- source_word: בגויתו
  choice: 人的身体
  rationale: גויה可指身体或尸体；此处与长存的名声相对，“身体”较合语境，也得到希腊文相应词语的旁证，避免把死亡状态说得过于具体。
- source_word: אך
  choice: 但
  rationale: 此处连接肉身的短暂与名声的长存，具有明显的转折作用。
- source_word: שם
  choice: 名声
  rationale: 字面为“名”，在本句中自然指人的名望或声誉；译作“名声”能让现代读者直接理解，同时保留原有意象。
- source_word: חסד
  choice: 仁慈
  rationale: 该词在这里正面修饰“名声”，侧重人的仁厚、慈善品格；“仁慈”自然易懂，也避免无根据地限定为盟约语境中的“坚定之爱”。
- source_word: לא יכרת
  choice: 不会断绝
  rationale: כרת的基本意象是“剪断、除掉”；“不会断绝”保留希伯来语表达，又能自然说明好名声将持续存在。
theological_decisions:
- issue: 希伯来文主要见证与希腊文平行文本在本节存在显著差异
  choice: 正文依从现存希伯来文：“仁慈的名声不会断绝”
  alternative: 希腊文可理解为“罪人的恶名将被涂抹掉”，其词语组合也容许其他切分，形成“罪人的名不会作为美名被涂抹掉”或“罪人的名永远不会被涂抹掉”等理解
  rationale: 本节希伯来文见证完整、可信度高且已获验证，因此正文以希伯来文为准；希腊文反映了不同措辞和语义走向，不在正文中强行调和，而以脚注保留其差异与歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不过是虚空”呈现箴言式对照与肉身短暂的意味；“仁慈的名声”避免生硬直译“仁慈之名”，同时不把 חסד 过度神学化。
