base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/003.yaml
  text: Do not fear the decree of your death[c][b][a]; remember that those before and those after are with you.
translation:
  language: zh_hans
  text: 不要惧怕死亡；这是你的定命[a][c]。要记住，先前的人和后来的人都与你同在[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语的表达较为压缩，可直译为“不要惧怕死亡；这是你的定分／定命”；希腊语平行文本作“不要惧怕死亡的判定”。正文以分句表达希伯来语的并置关系。
    reason: alternative_reading
  - marker: b
    text: “先前的人和后来的人都与你同在”是说，无论先来还是后来的人，都同样面对死亡。
    reason: lexical_alternative
  - marker: c
    text: 马萨达抄本在这一段只留下残片；此处开罗藏经库的希伯来语抄本较完整，而希腊语文本有助于理解这句有关死亡的简略说法。
    reason: textual_variant
lexical_decisions:
- source_word: אל תפחד
  choice: 不要惧怕
  rationale: 准确表达希伯来语否定命令，语气庄重而符合现代汉语习惯。
- source_word: ממות חקיך
  choice: 为你定下的死亡
  rationale: 希伯来语措辞压缩，可直指“死亡”与“所定之分”；希腊语平行文本 κρίμα θανάτου（死亡的判定／定命）支持其中“定下”的含义。此译法保留第二人称处境，也不把它限定为死亡的具体时刻。
- source_word: זכור
  choice: 要记住
  rationale: 直接传达祈使命令，并使汉语劝诫语气自然。
- source_word: ראשנים ואחרנים
  choice: 在你以前和以后的人
  rationale: 保留原文“先前者与后来者”的宽泛时间对照，不擅自明确为某些特定世代。
- source_word: עמך
  choice: 都与你同在
  rationale: 贴近希伯来语“与你一起”的字面表达，同时让其所含的共同命运之意留待上下文和脚注说明。
theological_decisions:
- issue: 面对希伯来语压缩表达与希腊语平行文本之间的差异，如何表述所惧怕的对象
  choice: 为你定下的死亡
  alternative: 死亡；死亡的判决；你命定的结局
  rationale: 以现存希伯来语为主，同时让希腊语“死亡的判定”帮助澄清 חק 的规定、定分含义；不把死亡本身、死亡的判定及个人所面对的定分完全等同，也不引入额外的教派性解释。
translation_notes:
  register: 采用现代、庄重且易懂的智慧文学语体。“为你定下的死亡”保留原文的规定／定分意味；“与你同在”刻意保留原句的含蓄与张力，由脚注说明其共同命运之意。
