  text: And if you are born, you will be born for a curse; and if you die, you will be allotted to a curse.
translation:
  language: zh_hans
  text: 你们若跌倒，便成了永远的欢乐；你们若死去，便成为咒诅。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“你们若出生，就是生来受咒诅；你们若死去，也必归于咒诅。”
    reason: 所提供的希伯来文本在本节前半句与希腊平行文本及英文POB有实质差异，需向读者公开这一文本异读。
lexical_decisions:
- source_word: תכשלו
  choice: 跌倒
  rationale: 该词基本义为绊倒、跌倒，也可引申为失败；此处保留其形象和语义张力。
- source_word: לשמחת עולם
  choice: 便成了永远的欢乐
  rationale: עולם在此最自然地修饰“欢乐”，表示长久、永远；补出“成了”以使省略谓语的希伯来语短句在现代汉语中通顺。
- source_word: לקללה
  choice: 便成为咒诅
  rationale: 介词ל־可表达结果或归宿；“成为咒诅”保留原文简练措辞，也可理解为成为受人咒诅的对象。
theological_decisions:
- issue: 希伯来文本与希腊平行文本的显著差异
  choice: 正文依照所提供的希伯来语见证，译作“若跌倒……若死去……”
  alternative: 依希腊文本译作“若出生……若死去……”
  rationale: 任务要求优先依据原文证据；现存希伯来语在本节首句与希腊语明显不同，因此不以希腊文或英文审校层无声取代希伯来文，而在脚注中完整说明异文。
- issue: “永远的欢乐”的主体与含义
  choice: 不明确说明是谁欢乐，也不把欢乐解释为审判后的义人欢庆
  alternative: 译成“世人便永远欢喜”或“你们将永远欢喜”
  rationale: 希伯来文只说לשמחת עולם，没有明示欢乐的主体；正文保留这一歧义，避免加入原文没有的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保持希伯来诗句的对称结构；不用生僻术语，并保留原文关于“欢乐”主体及“成为咒诅”的含混性。
