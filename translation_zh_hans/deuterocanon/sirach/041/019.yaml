translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“要以……为耻”承接本段劝诫人应当羞于某些行为的清单语境；第二分句保留原文具体而略显陌生的席间礼仪画面，不补入“桌子”等解释性成分。
