  text: for violating an oath and a covenant[b][a], and for leaning with your elbow over the bread.
translation:
  language: zh_hans
  text: 要以违背誓言[b]和盟约，以及在饼上方以肘支撑身体[a]为耻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这一分句的希伯来文本简略，含义不十分确定。希腊平行文本较完整，作“把肘支在饼上”，支持这里所译的席间姿态。
    reason: textual_variant
  - marker: b
    text: “誓言”也可译作“咒誓”或“起誓的约束”；希伯来语这个词可含誓言所附带的咒诅意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: מהפר
  choice: 违背
  rationale: 希伯来语词根פרר的使役形式可指破坏、废除或违背有约束力的义务；这里与“誓言”和“盟约”相连，用“违背”既自然，也保留其道德与契约意味。
- source_word: אלה
  choice: 誓言
  rationale: אלה可指誓言、带咒诅约束的起誓，或咒诅；此处与“盟约”并列，“誓言”最符合语境，同时以脚注保留“咒誓”等可能含义。
- source_word: וברית
  choice: 和盟约
  rationale: ברית通常指正式且具约束力的盟约；“盟约”比一般的“约定”更能保留原文的庄重色彩。
- source_word: ממטה
  choice: 撑
  rationale: 这处希伯来文本简略且不甚确定；结合希腊平行文本“把肘固定／支起”，这里所描写的很可能是席间用肘支撑身体的动作。“撑”在现代汉语中自然，并保留具体姿态。
- source_word: אציל
  choice: 胳膊肘
  rationale: אציל指肘或手臂关节，希腊平行文本ἀγκών也明确支持“肘”。“胳膊肘”通俗清楚。
- source_word: אל לחם
  choice: 在饼食上方
  rationale: 希伯来语介词短语字面接近“朝向饼”，表达略显生硬；希腊平行文本ἐπ᾿ ἄρτους支持肘位于饼食之上或横在饼食上方的画面。此译法避免误说肘直接压在饼上，也不擅自补入原文没有的“桌子”。
