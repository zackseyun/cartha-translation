base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/013.yaml
  text: The good of life is a limited number of days[b][a], but the good of a name is days without number.
translation:
  language: zh_hans
  text: 人生的福分，是有限的年日；美名[b]的福分，是无数的年日。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“美名将永远长存。”
    reason: alternative_reading
  - marker: b
    text: 这里的“名”指一个人的声誉，以及他留在人们记忆中的荣誉，并非仅指名字。
    reason: lexical_alternative
lexical_decisions:
- source_word: טובת
  choice: 美好
  rationale: 此处名词性表达指生命之美善或可贵之处；译为“美好”自然凝练，并在两个分句中借“美好人生／美名”保留原文的呼应。
- source_word: חי
  choice: 人生
  rationale: 这里抽象指人的生命历程，与希腊文 ζωῆς 相合；“人生”在现代汉语中比单用“生命”更自然地搭配“日子”。
- source_word: ימי מספר
  choice: 日子屈指可数
  rationale: 原文直译为“有数的日子”，表示有限、可数；“屈指可数”清楚传达生命年日有限，并与后句“无可计数”构成对照。
- source_word: שם
  choice: 美名
  rationale: שם 在此不只是个人称谓，也包括声誉和身后为人记念的名声；“美名”保留“名”的意象，也自然表达正面声誉。
- source_word: ימי אין מספר
  choice: 流传的日子无可计数
  rationale: 原文直译为“无数的日子”。补入“流传”使汉语语义完整，同时没有把希伯来文含蓄的持续性直接限定为“永远”；“无可计数”保留与前句可数日子的对偶。
theological_decisions:
- issue: 希伯来文成语与希腊文解释性表达的关系
  choice: 正文保留人生年日可数与美名年日不可计数的希伯来文对比
  alternative: 美名将永远长存
  rationale: 现存希伯来文清楚且可信度高，应作为正文依据。希腊文把后半句明确解释为“永远长存”，可作为古代平行见证列入脚注，而不取代希伯来文较含蓄的措辞。
translation_notes:
  register: 采用现代、庄重而简洁的箴言体。以“屈指可数／无可计数”呈现鲜明对偶；“流传”补足现代汉语表达，但正文仍保留希伯来文“日子”的意象和未被完全解释的张力。
