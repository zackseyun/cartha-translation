  text: The children of the despised are an evil thing[c][b][a], and the offspring of a fool are in the terror of the wicked.
translation:
  language: zh_hans
  text: 被厌弃者的子孙，是一件恶事[a][c]；愚人的后代，处在恶人的恐惧中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文上半句艰涩；希腊平行文本大意为：“可憎的儿女是罪人的儿女。”
    reason: alternative_reading
  - marker: b
    text: 希腊平行文本的下半句差异较大，大意为：“他们与不敬虔者的聚居地相交往。”
    reason: alternative_reading
  - marker: c
    text: 这一处较早的马萨达抄本残缺；本节可读的主要希伯来文措辞来自开罗藏经库抄本。
    reason: textual_variant
lexical_decisions:
- source_word: נין
  choice: 子孙
  rationale: 表示后裔、子孙；与下半句的“后代”构成诗体平行，又不限定具体年龄或代数。
- source_word: נמאס
  choice: 被人厌弃者
  rationale: 按被动形容意义理解，指遭厌弃的人；保留希伯来文中修饰后裔来源者的句法关系，而不依希腊文直接把后裔称作“可憎”。
- source_word: דבר רעים
  choice: 一件恶事
  rationale: 原文短语艰涩。将 דבר 理解为“事情、事物”，将 רעים 理解为“恶的”，可形成勉强连贯的判断，同时不以推测性重构消除文本困难。
- source_word: נכד
  choice: 后代
  rationale: 虽可特指孙辈，但与 נין 平行时宜作较宽泛的“后代”。
- source_word: אויל
  choice: 愚人
  rationale: 这是智慧文学中带有道德判断的常用称谓；“愚人”比单指智力不足的说法更准确。
- source_word: במגור
  choice: 处在……恐惧中
  rationale: מגור 表示恐惧、惊惧；直译其介词结构，不补入“生活”等原文没有的动作。
- source_word: רשע
  choice: 恶人
  rationale: 单数可作类别性或集合性用法；“恶人”保留智慧文学中的道德范畴。
theological_decisions:
- issue: 现存希伯来文艰涩，并与希腊平行文本存在明显差异
  choice: 以开罗藏经库希伯来文本为主，保留其艰涩表达，并用脚注列出希腊文异读。
  alternative: 依希腊文译作：“可憎的儿女是罪人的儿女；他们与不敬虔的人一同居住。”
  rationale: 本节有可读的希伯来文本，故应优先翻译希伯来文；希腊文可作为重要校勘参照，却不应在正文中取代现存希伯来见证。此处不把“恶人的恐惧”解释成神学上更明确的因果或归属关系，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“是一件恶事”有意保留希伯来文的生硬和严厉判断；“处在恶人的恐惧中”同样保持原句关系的含混，不擅自释为“害怕恶人”或“活在恶人造成的恐怖中”。
