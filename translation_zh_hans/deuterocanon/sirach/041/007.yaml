base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/007.yaml
  text: The children of a wicked father are cursed[a], for because of him they are a disgrace.
translation:
  language: zh_hans
  text: 作恶的父亲会遭儿女咒骂[a]，因为儿女会因他蒙羞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“儿女责难不敬虔的父亲，因为他们会因他蒙羞。”希伯来语中的“咒骂”语气较强，希腊语则侧重“责难”。
    reason: 说明希伯来语正文与希腊语平行文本对于儿女对父亲所作回应的用词和语气重点不同。
lexical_decisions:
- source_word: אב רשע
  choice: 恶父
  rationale: 原文为单数，明确指父亲；רשע表示邪恶、有罪。译作“恶父”简洁自然，并保留道德判断。
- source_word: יקוב
  choice: 必受咒诅
  rationale: נקב在此可取咒诅义；结合格言语境，用“必受咒诅”表达被动或结果性的含义。希腊语平行文本偏重“受责难”，故在脚注中保留这一差异。
- source_word: ילד
  choice: 儿女
  rationale: 希伯来语形式虽为单数，却可作集合名词；希腊语平行文本也使用复数。“儿女”在现代汉语中自然地表达整体后代。
- source_word: כי בגללו
  choice: 因为他们因他而
  rationale: 保留原文明确的因果关系和代词指向；汉语补出“他们”，使句法清楚，而“他”仍直接回指父亲。
- source_word: לחרפה
  choice: 蒙受羞辱
  rationale: חרפה可指羞辱、耻辱或责难。“蒙受羞辱”既符合希伯来语的社会性羞耻含义，也与希腊语“将受羞辱”相呼应，且比直译为“成为耻辱”更贴合平行证据。
theological_decisions:
- issue: 正文应突出希伯来语的“咒诅”，还是希腊语平行文本的“责难”
  choice: 正文采用“必受咒诅”
  alternative: “受到责难”或“必受斥责”
  rationale: 现存希伯来语是主要依据，יקוב在此更强烈地指向咒诅；希腊语则强调社会性的责难。正文保留希伯来语较尖锐的表达，脚注说明希腊语差异，不将两者强行调和。
- issue: 末句描述儿女“成为耻辱”还是“蒙受羞辱”
  choice: 蒙受羞辱
  alternative: 成为耻辱
  rationale: לחרפה本身容许两种理解。希腊语ὀνειδισθήσονται明确偏向“将受羞辱”，因此正文采用“蒙受羞辱”，同时不削弱父亲行为给儿女带来社会羞耻这一因果关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恶父”凝练地对应单数“邪恶的父亲”；“必受咒诅”保留格言式语气；“因他而蒙受羞辱”清楚表达父亲给儿女带来的社会性羞耻。
