  text: A poor man who is proud[a], and a rich man who lies[b], and an old man who commits adultery and lacks sense.
translation:
  language: zh_hans
  text: 骄傲的穷人，说谎的富人，以及通奸而不明事理的老人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本在这三类人之前还有：“我的心憎恨三种人，我对他们的生活极其厌恶。”现存希伯来文本没有这句话。希伯来文“不明事理”也可译作“缺乏理解力”或“缺少判断力”；希腊文意为“理解力不足”。
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: דַּל גֵּאֶה
  choice: 骄傲的穷人
  rationale: דַּל指贫穷、卑微的人，גֵּאֶה在此表示骄傲、自高；译文保留希伯来文简洁的名词短语结构。
- source_word: וְעָשִׁיר מְכַחֵשׁ
  choice: 说谎的富人
  rationale: עָשִׁיר意为富人；מְכַחֵשׁ可指说谎、欺骗或否认，希腊文ψεύστην支持“说谎”这一语义。
- source_word: וְזָקֵן מְנָאֵף
  choice: 通奸的老人
  rationale: זָקֵן在此指年老的男子而非职分上的长老；מְנָאֵף指犯通奸的人。
- source_word: וַחֲסַר דַּעַת
  choice: 不明事理
  rationale: 该短语直指缺乏知识、理解或判断力；“不明事理”在现代汉语中自然，并保留其智识与道德判断两方面的含义。
theological_decisions:
- issue: 在标记为 major_mismatch 的经节中如何处理希伯来文本与希腊平行文本
  choice: 直接翻译现存希伯来文，并用希腊文核验关键词义；不补入希腊文开头“我的心憎恨三种人”等希伯来行中没有的框架语。
  alternative: 依照希腊文扩译为“我的心憎恨三种人……：骄傲的穷人、说谎的富人、通奸而缺乏明智的老人”。
  rationale: 现存希伯来文与希腊文所列三类人在实质上相符，但希伯来文缺少希腊文的引介句。以希伯来文为主要底本可避免把平行见证中的额外内容无标记地并入正文，同时让希腊文帮助确认מְכַחֵשׁ与חֲסַר דַּעַת的语义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。三个并列短语尽量保持希伯来文的紧凑节奏；以“通奸”准确表达婚姻不忠，以“不明事理”避免过度口语化，同时不把原文的理解力缺失窄化为单纯的知识不足。
