  text: A woman's evil darkens a man's appearance[b][a], and makes his face gloomy like a bear.
translation:
  language: zh_hans
  text: 女人[a]的恶使男人的容貌发黑，使他的脸色像熊一样阴沉。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女人”也可译作“妻子”；本句因而也可能特指家庭中的夫妻关系。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本作“使她的脸像粗麻布一样阴暗”，其中代词和比喻都与现存希伯来文的“使他的脸……像熊一样”不同。
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעַ
  choice: 恶
  rationale: 该名词表示道德上的恶或有害性；“恶”简洁有力，保留希伯来文箴言式语气，也与希腊文 πονηρία 相符。
- source_word: אִשָּׁה
  choice: 女人
  rationale: אִשָּׁה 既可指“女人”，也可指“妻子”。原文没有明确的所属标记，因此正文采用较宽泛的“女人”，并以脚注保留“妻子”的可能。
- source_word: יַשְׁחִיר
  choice: 使……发黑
  rationale: 该使役动词有使之变黑、变暗之意；“发黑”保留原文鲜明的颜色意象。
- source_word: מַרְאֶה אִישׁ
  choice: 男人的容貌
  rationale: מַרְאֶה 指可见的外貌，אִישׁ 明确指男人；此译自然且保留原文的性别用语。
- source_word: וְיַקְדִיר
  choice: 使……阴沉
  rationale: קדר 可表示变暗、昏黑或显得忧郁；“阴沉”同时传达脸色暗淡和愁苦的意味，并避免机械重复“发黑”。
- source_word: פָּנָיו
  choice: 他的脸
  rationale: פָּנִים 的通常含义是“脸”；阳性单数后缀译作“他的”。
- source_word: לְדוֹב
  choice: 像熊一样
  rationale: 现存希伯来文本明确读作“熊”；尽管希腊平行文本有不同意象，正文优先依从希伯来文，并在脚注说明异文。
theological_decisions:
- issue: 箴言中的性别化表述
  choice: 女人的恶使男人的容貌发黑
  alternative: 妻子的恶使丈夫的容貌发黑；女人的恶使人的容貌发黑
  rationale: 希伯来文分别使用 אִשָּׁה 和 אִישׁ，具有明确的性别表述。译文不将其性别中和；同时，אִשָּׁה 可作“妻子”的语义可能通过脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“发黑”保留首句颜色意象，“阴沉”兼顾次句的暗色与愁苦含义。两个脚注标记均置于正文相关表达之后。
