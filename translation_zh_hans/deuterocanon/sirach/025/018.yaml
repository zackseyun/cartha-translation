translation:
  language: zh_hans
  text: 她的丈夫坐在同伴中间[a]，不明所以地叹息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“她的丈夫要在同伴中间斜倚而坐；听见后便痛苦地叹息。”这与现存希伯来文有明显差异，尤其在后半句。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲלָה
  choice: 她丈夫
  rationale: בעל 加阴性单数第三人称后缀，在此婚姻语境中指“她的丈夫”；译作“主人”或“所有者”会引入不合语境的含义。
- source_word: בֵּין רֵעִים
  choice: 在同伴中间
  rationale: רֵעִים 可指朋友或同伴；“同伴”既保留社交场景，也不把关系限定为亲密朋友。
- source_word: יֵשֵׁב
  choice: 坐
  rationale: 依现存希伯来文本直译为“坐”；希腊文的“躺席”可能反映宴席姿态，但不取代希伯来主本文。
- source_word: וּבְלֹא טַעֲמוֹ
  choice: 无缘无故地
  rationale: טעם 可涉及判断、理由或缘由；结合第三人称后缀，此处可自然理解为他没有缘由或不明所以。译文保留这种认知与缘由之间的语义空间，而不作字面“没有味觉”。
- source_word: יִתְאַנָּח
  choice: 叹息
  rationale: 该动词表示因苦恼而叹气、呻吟；现代汉语“叹息”自然庄重，也不比原文过度强化声音或痛苦程度。
theological_decisions:
- issue: 希伯来文与希腊文见证存在差异
  choice: 正文采用现存希伯来文：丈夫坐在同伴中间，并无缘无故地叹息。
  alternative: 希腊文作：“她丈夫要在同伴中躺席，听见后便痛苦地叹息。”
  rationale: 本节希伯来文存世且可信度高，因此正文以希伯来文为主；希腊文在时态、宴席姿态及第二分句上差异显著，故以脚注完整提示，不暗中调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式尽量贴近希伯来文的两个并列分句；脚注保留希腊文异读。
