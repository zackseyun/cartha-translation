  text: If you did not gather in your youth[a], how then would you find anything in your old age?
translation:
  language: zh_hans
  text: 你年轻时若没有积聚[a]，到年老时又怎能找到呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处所据希腊文本的动词形式有文本上的困难；其可能意思是“聚集”或“收集”，译文据此译作“积聚”。
    reason: textual_variant
lexical_decisions:
- source_word: ἐν νεότητι
  choice: 年轻时
  rationale: 表示人生阶段的时间短语；“年轻时”是自然的现代汉语，并与下文“年老时”形成对应。
- source_word: οὐ συναγίοχας
  choice: 没有积聚
  rationale: 传抄形式不寻常，可能存在文本讹误；按其大概与 συνάγω（聚集、收集）相关的意义译作“积聚”，既保留箴言式语气，也不擅自说明所积聚的对象。
- source_word: πῶς ἂν εὕροις
  choice: 又怎能找到呢
  rationale: 以反问表达带 ἄν 的潜在语气；“又”体现上下句的推论关系，“找到”保留 εὑρίσκω 的基本含义。
- source_word: ἐν τῷ γήρᾳ σου
  choice: 到年老时
  rationale: γήρας 指老年这一人生阶段；此译自然流畅，并与“年轻时”构成平衡。
theological_decisions:
- issue: “积聚／找到”的宾语在原文中省略
  choice: 不补出宾语
  alternative: 按上下文补作“智慧”，或按农业、生活储备的比喻补作“粮食／储备”
  rationale: 希腊文没有明说宾语。保留省略可维持箴言的宽广含义，避免把它限定为智慧、财富或物资。
- issue: 异常动词形式 συναγίοχας 的处理
  choice: 正文按可能意义译作“积聚”，脚注说明文本困难
  alternative: 译作“收集”或“储存”
  rationale: 该形式并非标准、明确的希腊文形式，且来源验证标记为重大不匹配；译文应传达最可能的意义，同时如实保留文本层面的不确定性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。上下句以“年轻时／年老时”形成对照，以反问保留原文的箴言语气；不补足原文省略的宾语。
