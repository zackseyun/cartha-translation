  yaml_path: translation/deuterocanon/sirach/025/011.yaml
  text: Happy is the husband of a prudent wife[b][a], and who does not plow with an ox and a donkey together.
translation:
  language: zh_hans
  text: 有贤明妻子的丈夫，又不套着牛和驴一同耕地，这样的人有福了。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这幅图景很可能呼应《申命记》22:10，那里禁止把牛和驴套在一起耕地；此处可能作为箴言式说法，比喻不相配的结合。
    reason: cross_reference
  - marker: b
    text: 希腊文译本的读法大不相同：“找到智慧的人何等伟大！但没有人胜过敬畏主的人。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是希伯来智慧文学常见的称福格式，表示此人的处境可羡、蒙福；“有福了”既自然庄重，也保留其智慧文学色彩。
- source_word: בַעַל אִשָּׁה
  choice: 妻子的丈夫
  rationale: 字面形式带有“拥有者、主人”的旧式表达，但在这里是“丈夫”的惯用语；中文按婚姻关系自然表达，避免造成妻子属于丈夫的误解。
- source_word: מַשְׁכָּלֶת
  choice: 贤明
  rationale: 该词指明达、有见识、行事审慎；“贤明”兼顾判断力与实际品行，也适合描述智慧文学中的配偶。
- source_word: חוֹרֵשׁ
  choice: 耕地
  rationale: 分词表示从事犁耕；“耕地”是现代中文直接、自然的农业表达。
- source_word: בְּשׁוֹר וְבַחְמוֹר יַחְדָּו
  choice: 用牛和驴一同耕地
  rationale: 直译保留“牛、驴、一同”的意象，并让其与申命记22:10的禁令形成可辨认的呼应，不在正文中明说其比喻含义。
theological_decisions:
- issue: 现存希伯来文本与希腊文本显著不同
  choice: 正文依据现存希伯来文本翻译，并在脚注保存希腊异文。
  alternative: 按希腊文译作：“找到智慧的人何等伟大，但没有人胜过敬畏主的人。”
  rationale: 本项目在《便西拉智训》希伯来文存世之处以希伯来见证为主。两种文本在本节无法调和，因此不把它们合并，也不以希腊文替换现存希伯来文，而是如实标明重要异文。
- issue: 牛与驴一同耕地的箴言性含义
  choice: 正文保留农业意象，脚注说明它可能喻指不相配的结合。
  alternative: 在正文中释义为“没有与不相配的人结合”。
  rationale: 希伯来正文只陈述耕作意象；直译可保留其与申命记律例的互文关系及比喻张力，避免把可能的含义写成唯一确定的解释。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“妻子贤明的丈夫”比“拥有贤明妻子的人”更贴近希伯来语的男性特指，同时避免生硬的所有权措辞。分号使第二分句继续描述同一位被称为有福的人；“也”保留希伯来语连接关系，但不强行解释两幅图景之间的逻辑。
