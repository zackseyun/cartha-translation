  text: From a woman is the beginning of sin[b][a], and because of her we all die together.
translation:
  language: zh_hans
  text: 罪的开端出于一个女人[a]；我们都因她的缘故而一同死去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里很可能暗指太初堕落叙事中的那个女人；本节措辞简短，并未进一步阐释其神学含义。
    reason: cross_reference
  - marker: b
    text: 或译：“我们都因她的缘故而一同死了。”希伯来文动词可理解为已经完成的动作；希腊文平行文本则作“我们众人都死”，支持正文所表达的普遍性理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאִשָּׁה
  choice: 始于一个女人
  rationale: 介词 מִן 表示来源；“一个女人”保留希伯来文单数及其含蓄指向，不改作“妻子”。
- source_word: תְחִלַת עָוֹן
  choice: 罪始于
  rationale: תְחִלַת 表示“开始、开端”；עָוֹן 在此依希腊文 ἁμαρτίας 的印证译作“罪”。中文以“罪始于……”自然表达希伯来文无系词短句，同时不增添“带来”等因果动词。
- source_word: וּבִגְלָלָהּ
  choice: 因她的缘故
  rationale: בגלל 明确表达原因；此译法庄重自然，并保留阴性单数代词。
- source_word: גָוַעְנוּ
  choice: 死去
  rationale: גוע 意为断气、死亡。希伯来文形式可理解为完成动作，故正文采用“死去”；其普遍、持续意义由希腊文现在时支持，并在脚注说明。
- source_word: יַחַד
  choice: 都一同
  rationale: יַחַד 本义为“一同”，此处兼有全体共同的意味；“都一同”既保留其字面意义，也与希腊文 πάντες“所有人”相呼应。
theological_decisions:
- issue: 是否淡化经文把罪与死亡的开端归于“一个女人”的性别措辞
  choice: 保留“一个女人”和“因她的缘故”
  alternative: 改为不带性别的“人”，或在正文中明确增译“夏娃”
  rationale: 希伯来文和希腊文均明确使用阴性单数“女人”，很可能含蓄指向创世之初的堕落叙事。正文应保存这一措辞及其张力，但不把经文本身未明说的名字或完整神学解释加入正文。
- issue: גָוַעְנוּ 的时态与普遍意义
  choice: 正文译“我们都一同死去”
  alternative: “我们都一同死了”或“我们都一同会死”
  rationale: 希伯来文形式容许完成式理解，而希腊平行文本用现在时表达普遍事实。正文保留较贴近希伯来文的“死去”，脚注交代另一种时态理解，避免过度裁定。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持原文格言式的两分结构。以“罪始于一个女人”自然呈现希伯来文无系词句，不额外加入“来到”或“进入世界”。脚注标记均置于相关正文之后。
