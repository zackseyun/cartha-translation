  rationale: 修订将三个关系分句置于一个由“有福了”统摄的中文句子中，贴合希腊文结构而不重复添加祝福宣告。末句撤除“配得他服侍”的解释性补足，改用自然且较少预断的“不可与他相称”表达；脚注说明直译及 δουλεύω 的较强可能含义。
