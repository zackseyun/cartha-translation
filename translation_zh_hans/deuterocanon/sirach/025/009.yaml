  yaml_path: translation/deuterocanon/sirach/025/009.yaml
  text: Blessed is the man who lives with an intelligent wife[a], and who has not slipped with his tongue[c][b], and who has not served one unworthy of him.
translation:
  language: zh_hans
  text: 与明智的妻子同住、言语上没有失足、也没有服侍过不配与他相称之人的男子有福了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “服侍”也可译作“作奴隶服侍”或“受奴役于”；希腊词可指奴役性的服役。末句直译近于“没有服侍过一个不配于他的人”；“不配与他相称”保留原文的关系性评价，未具体说明此人的社会地位或不配的缘由。
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: 有福了
  rationale: 沿用智慧文学中祝福宣告的庄重语气；比“快乐”更能表达一种蒙福、可称羡的处境。
- source_word: συνοικῶν
  choice: 共同生活
  rationale: 表示在同一家庭中一起生活；结合 γυναικί，语境明确指夫妻共同生活。
- source_word: γυναικὶ συνετῇ
  choice: 明智的妻子
  rationale: γυνή 在婚居语境中指妻子；συνετός 强调有理解力和实际判断力，“明智”兼顾智慧与审慎。
- source_word: ἐν γλώσσῃ οὐκ ὠλίσθησεν
  choice: 说话没有失足
  rationale: 保留“失足”的身体隐喻，同时以“说话”自然表达 ἐν γλώσσῃ 的言语范围，不扩大为特定的罪。
- source_word: ἐδούλευσεν
  choice: 服侍
  rationale: δουλεύω 可指作奴仆或服役；此处采用“服侍”，保留从属服务关系而不武断断定法律意义上的奴役。
- source_word: ἀναξίῳ αὐτοῦ
  choice: 不配得他服侍之人
  rationale: 直译“对他而言不配/不相称的人”在中文中容易误解为“不配拥有他”；结合 ἐδούλευσεν 补出“服侍”，明确其关系而不改成社会等级色彩更强的“低于他的人”。
theological_decisions:
- issue: 三个并列关系从句是否都承接 μακάριος
  choice: 三项均译作“有福了”
  alternative: 只在第一项出现“有福了”，其余以“并且”连接
  rationale: 希腊文仅在句首明说 μακάριος，后面两个 καὶ ὃς 与首项并列，共同受其统摄。中文重复“有福了”可清楚呈现三种可称羡之人的并列结构，不改变语义。
- issue: 阳性单数关系表达
  choice: 译作“……的人”并保留第三分句中的“他”
  alternative: 译作“男子”或完全改为无性别复数
  rationale: 希腊文关系代词为阳性单数，但中文“……的人”可自然承载代表性单数；涉及 αὐτοῦ 时用“他”，保留原文明确的阳性指称。
- issue: δουλεύω 的从属强度
  choice: 服侍
  alternative: 作奴隶服侍／受奴役于
  rationale: 原词可带奴役含义，但本句未交代法律身份；“服侍”保留从属关系，并以脚注提示较强译法，避免过度确定。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。三个并列分句重复“有福了”，使希腊文中由句首 μακάριος 统摄的结构在中文里清晰可闻；避免使用生硬的“同居”，也不把“舌头失足”解释性扩大为“犯罪”。
