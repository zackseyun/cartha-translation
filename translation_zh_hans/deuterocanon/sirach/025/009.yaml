  terminology: “有福”“明智的妻子”“服侍”均合适。末句以“不配与他相称的人”表达 ἀνάξιος αὐτοῦ 的关系性评价，避免擅自具体化为“不配受他服侍”或强化为社会等级。脚注保留 δουλεύω 可含奴役性服役的可能，并说明末句的直译范围。
