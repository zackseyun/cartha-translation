  text: Any wound[a], but not like a wound of the heart; any evil, but not like the evil of a woman.
translation:
  language: zh_hans
  text: 宁受任何创伤，也不受心的创伤；宁遇任何祸患，也不遇妇人所带来的祸患。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妇人所带来的祸患”也可译作“妇人的恶”或“妻子的祸患”。希伯来语 רָעָה 可指“恶”，也可指“祸患、伤害”；אִשָּׁה 可指“妇人”，也可按语境指“妻子”。
    reason: 保留 רָעָה 与 אִשָּׁה 的词义歧义，并说明末句属格可指妇人的恶或由妇人而来的祸害。
lexical_decisions:
- source_word: כָּל
  choice: 任何
  rationale: 两处均作分配性的全称表达；“任何”符合汉语格言式对举，也保留原文的普遍范围。
- source_word: מַכָּה
  choice: 创伤
  rationale: 该词可指击打及其造成的伤害；与“心”连用时兼具身体和内在伤痛的意象，希腊文 πληγή 亦支持“创伤”。
- source_word: הַלֵּב
  choice: 心灵
  rationale: 希伯来语 לֵב 可指心及人的内在生命；译作“心灵”能在现代汉语中自然表达内在创伤，又不把含义收窄为理智或情绪。
- source_word: רָעָה
  choice: 祸患
  rationale: 该词兼有邪恶、灾祸、伤害等义。此处与前句“创伤”形成遭受祸害的平行关系，故正文取“祸患”；其道德性的“恶”义在脚注中保留。
- source_word: אִשָּׁה
  choice: 妇人
  rationale: 无所属成分或明确婚姻标记，直译为“妇人”；原词在语境中也可指“妻子”，故列入脚注。
- source_word: וְלֹא כְ
  choice: 宁……也不……
  rationale: 原结构表示强烈的比较性否定，即别的尚可承受，唯独所举者更甚。汉语“宁……也不……”自然传达这种格言式对比，而未改成绝对数量判断。
theological_decisions:
- issue: 末句可能被理解为对女性整体的负面概括
  choice: 保留原文直指“妇人”的尖锐措辞，不在正文中加以缓和或普遍化
  alternative: 译作“妻子所造成的祸患”或“妇人的恶”
  rationale: 原文的性别指称和比较语气明确，译者不应以解释性改写消除其张力；同时，רָעָה 的“祸患／恶”与 אִשָּׁה 的“妇人／妻子”歧义以脚注说明。
translation_notes:
  register: 采用简洁、对称的现代汉语格言体。“宁受／宁遇……也不……”重现两分句的平行和递进；“妇人”较“女人”庄重，又不自动限定为婚姻关系。
