base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/005.yaml
  text: If you did not desire them in your youth[b][a], how will you attain them in your old age?
translation:
  language: zh_hans
  text: 你年轻时若不渴望它们[a]，年老时又怎能得到它们呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“它们”，没有明说所指。按上下文及希腊文平行文本，可能指与智慧、判断和领悟谋略有关的品格或成就。
    reason: 说明未表达的复数宾语所指，并保留原文的含混。
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出条件从句；“若”简洁庄重，准确对应希伯来语条件词。
- source_word: בִּנְעֻרוֹתֶיךָ
  choice: 你年轻时
  rationale: 该复数形式指人生的青年时期；现代汉语以“年轻时”表达最自然。
- source_word: לֹא חֲפַצְתָּם
  choice: 不渴慕它们
  rationale: חפץ 的核心义是喜爱、愿意、渴望；“渴慕”既保留内在意愿与喜爱之意，也适合智慧文学语境。宾语复数仍按原文保留为“它们”。
- source_word: אֵיךְ
  choice: 又怎能
  rationale: 表达带有反诘意味的“如何”，并借“又”凸显青年与老年之间的对照。
- source_word: תַּשִּׁיגֵם
  choice: 得到它们
  rationale: השיג 表示达到、取得或获得；“得到”在现代汉语中自然，并适用于原文未明说的抽象复数对象。
- source_word: בְּזִקְנוֹתֶיךָ
  choice: 年老时
  rationale: 指人生的老年时期，与“年轻时”形成清楚、自然的对照。
theological_decisions:
- issue: 复数宾语“它们”的先行对象未明说
  choice: 正文保留“它们”，不补作“智慧”或其他具体内容。
  alternative: 译作“你年轻时若不追求智慧，年老时又怎能得到智慧呢？”
  rationale: 希伯来文本只用复数宾语后缀，并未明确指出所指。希腊平行文本提到判断和领悟谋略，可帮助读者理解其智慧语境，却不足以把原文的复数对象限定为单一的“智慧”。保留代词可维护原文的含混与张力。
- issue: חפץ 是内在渴望还是主动寻求
  choice: 译作“不渴慕”，优先呈现“喜爱、渴望”的词汇本义。
  alternative: 译作“不寻求”，突出实际追求的含义。
  rationale: 希伯来语直接表达的是渴望、喜爱或乐意，而非通常表示寻找的动词。反诘语境虽暗含实际追求，但不宜以推论取代词义本身。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“你年轻时……年老时……”形成自然对称；反问句“又怎能……呢”传达原文的修辞力度。
