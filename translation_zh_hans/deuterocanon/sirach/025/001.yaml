  text: 'In three things I was made beautiful[b][a], and I stood beautiful before the Lord and men:'
translation:
  language: zh_hans
  text: 在三件事上，我显得美好[a]，并在主和世人面前美好地站立[b]：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显得美好”也可译作“变得美好”或“被妆饰得美好”；希腊文动词为被动式，可表达结果状态，也可听作施于说话者的动作。
    reason: lexical_alternative
  - marker: b
    text: “站立”也可译作“起来”或“挺立”；希腊文保留具体的起身、站立意象，并非仅指抽象的“显现”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τρισὶν
  choice: 有三样事
  rationale: ἐν加与格在这里说明使说话者得以美好的三项事物，并引出后文的列举；汉语用“有三样事”自然清楚。
- source_word: ὡραιώθην
  choice: 使我显得美好
  rationale: 该词是不定过去时被动形式，可表达“被赋予美好”或由此“变得美好”。译文保留外来作用与结果状态之间的张力，且与后面的ὡραία形成词根呼应。
- source_word: ἀνέστην
  choice: 挺立
  rationale: ἀνίστημι的不定过去时可指起来、站起或站立显出；“挺立”保留具体的起立、站立意象，又适合此处庄重语境。
- source_word: ὡραία
  choice: 美好地
  rationale: 此阴性形容词与说话者相配，并重复ὡραιώθην的美好意象；在汉语中作状态补语译为“美好地”，避免把它抽象化为单纯的“显现”。
- source_word: ἔναντι Κυρίου καὶ ἀνθρώπων
  choice: 在主和世人面前
  rationale: ἔναντι表示“在……面前、当着……的面”；ἀνθρώπων泛指人类，现代汉语“世人”既自然又不限定为男性。
theological_decisions:
- issue: Κυρίου的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文本仅见κύριος，虽在此指神，却没有直接呈现希伯来神名；译作“主”既忠于现存原文，也保持敬虔而不作越出证据的回译。
- issue: ἀνθρώπων的涵盖范围
  choice: 世人
  alternative: 男人／人类
  rationale: 该复数名词在此泛指人，而非专指男性。“世人”与“主”形成自然对举，并准确传达普遍的人类范围。
- issue: 说话者的身份与阴性形式
  choice: 不在正文中补明身份
  alternative: 补作“智慧说”或以阴性代词标示
  rationale: ὡραία为阴性，暗示说话者在语法上为阴性，但本节本身未明说其身份；汉语不必强行补入解释，以免消除上下文应保留的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“美好”重复出现，以再现ὡραιώθην与ὡραία的词义呼应；分号呈现两个并列分句，冒号保留其引出后文列举的功能。
