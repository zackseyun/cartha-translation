  text: Do not fall for a woman's beauty, and do not desire a woman for what she has.
translation:
  language: zh_hans
  text: 不要为女子的美貌倾倒，也不要因她所拥有的而贪恋她。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“也不要贪恋女子。”希伯来文本在这里更具体，警告人不可因她所拥有的而贪恋她。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל
  choice: 不要……倾倒
  rationale: 原文直译为“不要跌倒”，在这里与“美貌”连用，表示被吸引、迷住。“倾倒”既保留原文的下坠意象，也符合现代汉语表达。
- source_word: בְּיֹפִי אִשָּׁה
  choice: 为女子的美貌
  rationale: 介词 בְּ 在此表示引发或导致“倾倒”的缘由；אִשָּׁה 在缺少婚姻语境时译作较宽泛的“女子”，不限定为“妻子”。
- source_word: וְעַל יֵש לָהּ
  choice: 因她所拥有的
  rationale: 希伯来语表达简略，字面涉及“她所有的／她所拥有的”；采用概括性译法，不把所指擅自限定为钱财、产业或社会地位。
- source_word: לֹא תַּחְמוֹד
  choice: 不要……贪恋
  rationale: חמד 可指渴望、贪求或垂涎。“贪恋”在本句中兼顾对女子的强烈欲求及由她所有之物引起的贪图，不把含义缩窄为纯粹的性欲。
theological_decisions:
- issue: 希伯来文本第二分句与希腊平行文本的差异
  choice: 正文依从现存希伯来文本，译为“不要因她所拥有的而贪恋她”
  alternative: 希腊平行文本可译为“不要贪恋女子”
  rationale: 现存希伯来见证在此更具体，指出贪恋的诱因是“她所拥有的”；希腊文本则没有这一限定。正文以高可信度的希伯来文本为主，同时用脚注保存希腊异文，避免消除文本张力。
- issue: 第二分句中贪恋对象是否明说
  choice: 在汉语中补出宾语“她”
  alternative: 译为“也不要贪图她所有的”
  rationale: 希伯来语句法较为压缩；结合前句及希腊平行文本，贪恋的对象可理解为该女子，而“她所拥有的”说明动机。补出“她”使汉语明确流畅，但脚注交代希腊文本的较短表达。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“为……倾倒”保留原文隐喻；“她所拥有的”刻意保持宽泛，不擅自解释为财富。脚注标记置于相关第二分句之后。
