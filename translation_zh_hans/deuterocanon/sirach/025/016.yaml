  text: I would rather live with a lion and a dragon than dwell with a wicked woman[a].
translation:
  language: zh_hans
  text: 我宁愿与一头狮子和一条龙同住，也不愿与邪恶的女人[a]同住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“邪恶的妻子。”希腊语 γυνή 按语境既可指“女人”，也可指“妻子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῆσαι
  choice: 同住
  rationale: 表示共同居住；“同住”自然简洁，保留居家共处的含义，又不额外引入性关系意味。
- source_word: λέοντι
  choice: 狮子
  rationale: 直译与格单数 λέων，保留格言中鲜明的单数形象。
- source_word: δράκοντι
  choice: 巨龙
  rationale: δράκων 可指龙、巨蛇或可怖的大蛇；“巨龙”保留传统而夸张的格言意象，也避免普通“龙”在现代汉语中可能带有的吉祥联想。
- source_word: εὐδόκησα ... ἢ
  choice: 我宁愿……也不愿……
  rationale: εὐδοκέω 本可表示“乐意、满意”，但在与 ἤ 构成的比较结构中表达取舍偏好；汉语用“宁愿……也不愿……”最自然。
- source_word: ἐνοικῆσαι
  choice: 住在一起
  rationale: 表示居住、住在某处；此处译作“住在一起”，既与前面的“同住”呼应，又自然体现共同生活的语境。
- source_word: μετὰ γυναικὸς πονηρᾶς
  choice: 跟邪恶的女人
  rationale: γυνή 可指“女人”或“妻子”，希腊文本身没有明确的所有关系，因此正文采用较宽泛的“女人”；πονηρά 在此具有道德贬义，译为“邪恶的”比“坏的”更准确。
theological_decisions:
- issue: 格言中的 γυνή 应译为“女人”还是“妻子”
  choice: 女人
  alternative: 妻子
  rationale: γυνή 本身兼有“女人”和“妻子”两义。共同居住的语境使“妻子”很可能，但原文没有明确限定为某人的妻子，因此正文保留较宽的“女人”，脚注列出“妻子”这一合理解释，不替读者消除原文的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。“我宁愿……也不愿……”清楚表达比较取舍；“同住／住在一起”保留原文两个近义居住动词的轻微变化。
