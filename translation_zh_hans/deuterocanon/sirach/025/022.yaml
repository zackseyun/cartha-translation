  text: For because of her there is reproach and shame[a], when a wife supports her husband.
translation:
  language: zh_hans
  text: 因为妻子供养丈夫[a]，便因她而有羞辱和羞耻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供养”也可译作“供应生活所需”。希伯来文 מְכַלְכֶּלֶת 和希腊文 ἐπιχορηγῇ 都可指在物质上供应、维持生活。
    reason: 说明关键词的物质供给含义及可行译法。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 引出本句所陈述的缘由，与上文形成解释关系；现代汉语用“因为”自然清楚。
- source_word: בַעֲדָהּ
  choice: 因她
  rationale: 该介词短语在这里表示原因或由来；保留女性代词，也不额外指定究竟是谁蒙羞。
- source_word: חֶרְפָּה
  choice: 羞辱
  rationale: 体现公开受辱、遭人非议的社会荣辱含义，并与“羞耻”有所区分。
- source_word: וּבֹשֶׁת
  choice: 和羞耻
  rationale: 直接表达内在或社会意义上的羞耻，与前面的“羞辱”共同保留希伯来文的并列结构。
- source_word: אִשָּׁה
  choice: 妻子
  rationale: 该词可指“女人”或“妻子”，但后面的“丈夫”明确限定了婚姻关系。
- source_word: מְכַלְכֶּלֶת
  choice: 供养
  rationale: כלכל在此指供应生活所需、维持生计；“供养”比泛义的“支持”更准确地表达物质供给。
- source_word: אֶת בַּעֲלָהּ
  choice: 丈夫
  rationale: 婚姻语境要求将בעל理解为“丈夫”，而不是“主人”。
theological_decisions:
- issue: 是否在译文中淡化古代父权社会的价值判断
  choice: 直接保留经文所说的羞辱和羞耻，不加缓和或辩解
  alternative: 改写为仅反映古代社会观念，或弱化其负面判断
  rationale: 翻译应忠实呈现原文的社会荣辱判断，同时不在原文字义之外加重谴责。
- issue: 末句与前句的句法关系
  choice: 以“因为……便……”表达妻子供养丈夫与羞辱、羞耻之间的因果关系
  alternative: 用冒号把“妻子供养丈夫”处理为前句的同位说明
  rationale: 希伯来文省略了系词和明确连接词，结构较紧缩；因果式汉语既保留כִּי和בַעֲדָהּ的作用，也使句意自然，但不额外说明由谁承受羞辱。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“便会因她而有”有意保留原文较为笼统的无人称表达，不擅自补出是丈夫、妻子还是家庭蒙受羞辱。
