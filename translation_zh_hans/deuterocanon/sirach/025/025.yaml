base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/025.yaml
  text: A bad wife is leprosy to her husband[a]; let him drive her out of his house[c][b], and he will be healed of his leprosy.
translation:
  language: zh_hans
  text: 恶妻对于丈夫如同麻风病[a]；他应把她赶出自己的家[b][c]，他就会从自己的麻风病中得痊愈。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“麻风病”的希伯来词，可泛指圣经时代某些严重的皮肤病，不一定等同于现代所说的汉森病。
    reason: cultural_note
  - marker: b
    text: 或译：“他应休了她。”希伯来文直译是“把她从自己的房屋赶走”，可能意味着分居或离婚，但没有明确其法律形式。
    reason: alternative_reading
  - marker: c
    text: 希腊文本此处大不相同：“不要给水出口，也不要给恶妇人权柄。”正文以现存希伯来文本为据。
    reason: textual_variant
lexical_decisions:
- source_word: אִשָּׁה רָעָה
  choice: 恶妻
  rationale: 上下文有“她的丈夫”，故明确指妻子；“恶妻”简洁保留 רָעָה 宽泛的负面道德与实际含义，不进一步限定为“邪恶的妻子”。
- source_word: צָרַעַת
  choice: 麻风病
  rationale: 这是圣经中传统译作“麻风病”的病名；古代所指范围比现代汉森病更广，故以脚注说明，同时保留原文强烈的疾病比喻及前后呼应。
- source_word: לְבַעֲלָהּ
  choice: 是丈夫的
  rationale: 婚姻语境中 בַּעַל 指“丈夫”；此处表达恶妻之于丈夫如同严重疾病，汉语用“是丈夫的麻风病”自然而贴近原句。
- source_word: יְגַרְשֶׁנָּה מִבֵּיתוֹ
  choice: 他应把她赶出家门
  rationale: גרש 的具体意义是赶走、逐出，且后接“从他的房屋”，因此不直接译成法律意义较明确的“休妻”或“离婚”。“应”传达此处祈使或义务性的语气。
- source_word: וְיִתְרַפֵּא מִצָּרַעְתּוֹ
  choice: 这样就会从他的麻风病中痊愈
  rationale: 将连续结构理解为结果：赶出之后，他便得医治。“这样”使现代汉语关系清楚；重复“麻风病”保留原文首尾呼应。
theological_decisions:
- issue: 应把所建议的做法译为法律上的离婚，还是具体的逐出住所
  choice: 具体译作“把她赶出家门”
  alternative: “休了她”或“与她离婚”
  rationale: 希伯来文明确说“把她从他的房屋赶走”，可能隐含婚姻分离，却没有明说其法律形式。译文保留这种张力，不将其收窄为特定婚姻法规。
- issue: 如何处理本节希伯来文与希腊文之间的显著差异
  choice: 正文依据现存希伯来文，脚注列出希腊异文
  alternative: 正文采用希腊文“不要给水出口，也不要给恶妻权柄”
  rationale: 所给希伯来文本置信度高，且本项目以原始语言证据为首要依据；希腊文差异重大，不能静默调和，故在脚注中完整说明。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“恶妻”保持格言式的凝练；“赶出家门”具体直白，但不擅自法律化为“离婚”。正文中的 [a]、[b]、[c] 均与脚注对应。
