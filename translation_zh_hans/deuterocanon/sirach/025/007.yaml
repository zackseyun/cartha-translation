  text: The crown of the aged is much experience[a], and their boast is the fear of the Lord.
translation:
  language: zh_hans
  text: 老年人的冠冕是丰富的阅历[a]；他们所夸耀的，是敬畏主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“广博的经验”或“丰富的经验”。希腊词 πολυπειρία 强调随时间积累而来的广泛经验。
    reason: lexical_alternative
lexical_decisions:
- source_word: στέφανος
  choice: 冠冕
  rationale: 指作为尊荣标志的冠冕或花冠；在此比喻语境中，“冠冕”自然、庄重，也保留智慧文学的意象。
- source_word: γερόντων
  choice: 老年人
  rationale: 该词指年老的人；译作“老年人”保留年龄含义，同时避免“长老”可能带来的职分色彩。
- source_word: πολυπειρία
  choice: 丰富的阅历
  rationale: 该复合词强调经过岁月积累而来的广泛经验；“丰富的阅历”符合现代汉语表达，也较好传达 πολυ- 的广、多之意。
- source_word: καύχημα
  choice: 所夸耀的
  rationale: 该词既可指夸耀，也可指夸耀的对象或根据；“所夸耀的”明确表达后者，并保留原文的修辞力度。
- source_word: φόβος Κυρίου
  choice: 敬畏主
  rationale: 这是智慧文学中常见的神学用语；“敬畏”保留畏惧与尊崇并存的张力，而“主”直接对应希腊文 Κυρίου。
theological_decisions:
- issue: 智慧文学固定用语 φόβος Κυρίου 的表达
  choice: 敬畏主
  alternative: 对主的尊崇；惧怕主
  rationale: “敬畏主”是清楚而庄重的现代汉语圣经用语，既不把 φόβος 弱化为单纯尊敬，也不将其收窄为纯粹恐惧。
- issue: Κυρίου 的译法
  choice: 主
  alternative: 耶和华
  rationale: 本节所依据的希腊文本写作 Κυρίου，故译为“主”；不根据可能的希伯来背景改译为神名，以保持对现存原文见证的忠实。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。分号呈现两个平行分句；“老年人”避免职分歧义，“阅历”突出长期生活经验。
