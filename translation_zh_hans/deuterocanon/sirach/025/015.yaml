  text: There is no head above the head of a snake[a], and there is no wrath above the wrath of an enemy.
translation:
  language: zh_hans
  text: 没有任何头胜过蛇的头[a]，也没有任何怒气胜过仇敌的怒气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“没有任何毒液胜过蛇的毒液。”希腊文直译为“没有头胜过蛇的头”；正文保留这一意象，没有改用解释性的意译。
    reason: lexical_alternative
lexical_decisions:
- source_word: κεφαλή
  choice: 头
  rationale: 希腊文两处都明确使用具体名词“头”。虽然“蛇的头”可被转喻性地理解为蛇的毒液或致命攻击力，正文仍保留原文意象，不以解释性译法取代。
- source_word: ὄφις
  choice: 蛇
  rationale: “蛇”是现代汉语中自然、准确的常用对应词；无需采用较具文学色彩的其他称法。
- source_word: θυμός
  choice: 怒气
  rationale: 此处指强烈而带敌意的愤怒。“怒气”自然庄重，也能维持上下两句的箴言式对应；“愤怒”亦可，但句式略显沉重。
- source_word: ἐχθρός
  choice: 仇敌
  rationale: “仇敌”准确表达敌对关系，并与强烈的“怒气”搭配自然；“敌人”较口语化，但也属可能译法。
- source_word: ὑπέρ
  choice: 胜过
  rationale: 在该比较结构中表示超过、凌驾于。“胜过”以自然现代汉语清楚传达比较意义，同时避免机械直译为“在……之上”。
