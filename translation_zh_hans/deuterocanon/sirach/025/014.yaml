  yaml_path: translation/deuterocanon/sirach/025/014.yaml
  text: Any wound[a], but not the wound of those who hate; and any vengeance[b], but not the vengeance of enemies.
translation:
  language: zh_hans
  text: 宁愿受任何伤害[a]，也不要受怀恨者的伤害；宁愿受任何报复[b]，也不要受仇敌的报复。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伤害”也可译作“苦难”“攻击”或“灾祸”。希腊词可泛指加在人身上的苦害。
    reason: lexical_alternative
  - marker: b
    text: 希腊原文是省略动词的箴言，直译近于：“任何伤害，而非怀恨者的伤害；任何报复，而非仇敌的报复。”此处表达的是比较性的取舍：出于这种敌意的伤害和报复，比其他同类的伤害更难承受。
    reason: cultural_note
lexical_decisions:
- source_word: πᾶσαν
  choice: 任何
  rationale: 在省略的比较句式中作周遍、分配性表达；“任何”自然传达甘愿承受其他任何一种、唯独不愿承受特定一种的意思。
- source_word: ἐπαγωγήν
  choice: 伤害
  rationale: 该词可指加在人身上的攻击、灾祸或苦害。“伤害”既可涵盖身体损伤，也可指较广泛的侵害，适合与“憎恨者所加的”搭配，并保留原词的语义宽度。
- source_word: μισούντων
  choice: 憎恨者
  rationale: 这是名词化的现在分词，强调正在怀有并施行敌意的人；“憎恨者”简练地保留其主动含义。
- source_word: ἐκδίκησιν
  choice: 报复
  rationale: 此处指因敌意而施行的报复性惩治。“报复”在现代汉语中自然清楚，也与下句“仇敌”形成紧密搭配。
- source_word: ἐχθρῶν
  choice: 仇敌
  rationale: 准确表达复数属格所指的敌对之人；“仇敌”比“敌人”更能承接本句报复性的强烈敌意，同时仍属通行庄重用语。
theological_decisions:
- issue: 无动词的省略式比较箴言如何表达
  choice: 补出“宁受……也不受……”以显明隐含的比较，同时保留对称、简洁的箴言形式。
  alternative: 直译为“任何伤害，却不要憎恨者的伤害；任何报复，却不要仇敌的报复”，或解释为“没有什么伤害比憎恨者的伤害更重”。
  rationale: 希腊文 πᾶσαν ... καὶ μὴ ... 是无动词的省略结构，语势自然表示宁可承受任何同类之害，也不要承受出于仇恨或仇敌的那一种。中文若完全照录省略结构会晦涩，因此最少量补入比较关系，但不进一步断定伤害的具体性质。
- issue: ἐπαγωγήν 的语义范围
  choice: 正文用较宽泛的“伤害”。
  alternative: “创伤”“攻击”“苦难”或“灾祸”。
  rationale: 原词在此含义不完全确定，可指被加诸的攻击、苦害或患难。“伤害”能保留身体与非身体层面的可能性，避免把原文限定为伤口或一般苦难。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以重复的“宁受任何……也不受……”再现原文平行结构；“所加的”仅用于首句，使施害关系清楚，不在第二分句机械重复。
