  text: If she does not go according to your hand[b][a], cut her off from your flesh.
translation:
  language: zh_hans
  text: 她若不按你的意思行事[a]，就把她从你的血肉中割除[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“照你的手”；这是指依从你的指引或支配。
    reason: lexical_alternative
  - marker: b
    text: “从你的血肉中割除”使用身体意象表达决然的断绝；原文没有使用明确的离婚法律术语。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ μὴ
  choice: 若不
  rationale: 直截了当地保留否定条件句的结构和力度；“除非”虽可行，却会改变句子的正面表达方式。
- source_word: πορεύεται
  choice: 行事
  rationale: 本义是“行走、前行”，此处指人的行为方式。译作“行事”在现代汉语中自然，又不过度增添解释。
- source_word: κατὰ χεῖρά σου
  choice: 照你的手
  rationale: 保留希腊文“手”的具体意象及其所表达的指引或支配意味；因这一说法在现代汉语中并非常用习语，脚注说明其含义。
- source_word: ἀπότεμε
  choice: 割除
  rationale: 准确传达命令式所含的割断、除去之意，并与下文“血肉”的身体意象相配，保留原文严厉而鲜明的措辞。
- source_word: ἀπὸ τῶν σαρκῶν σου
  choice: 从你的血肉中
  rationale: 希腊文用复数“肉”，表达身体及亲密联合的意象。汉语“血肉”比“肉体”更能兼顾身体意象和亲密关系的共鸣。
- source_word: αὐτήν
  choice: 她
  rationale: 阴性代词承接上下文所说的女人或妻子，汉语中明确译出。
theological_decisions:
- issue: 智慧文学语境中这一命令的伦理力度与所指范围
  choice: 保留“从你的血肉中割除”这一严厉的身体性比喻，不将其改写为法律术语。
  alternative: 明确译成“休掉她”或较缓和地译成“与她分开”。
  rationale: 原文没有采用明确的离婚法律术语，而是使用“割除”和“血肉”的强烈意象。译文应保留这种张力，既不把它限定为某一法律程序，也不削弱其决绝性。
translation_notes:
  register: 采用简洁、庄重而可懂的现代标准汉语。正文刻意保留“手”“血肉”“割除”等原文意象；两处脚注分别解释不自然的手部习语和可能被误解为肉体伤害的分离比喻。
