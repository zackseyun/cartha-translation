  text: 'Slack hands and failing knees: a wife who does not bless her husband[a].'
translation:
  language: zh_hans
  text: 双手无力，双膝发软：不使丈夫有福的妻子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不给丈夫祝福的妻子。”这里也可能指“不称丈夫为有福”，或“不使丈夫觉得自己有福（或幸福）”。希腊文平行文本作“她不称自己的丈夫为有福”。
    reason: 说明לֹא תְאַשֵּׁר可指使人有福／幸福，也可指祝福或称人为有福；保留原文及平行希腊文之间的语义张力。
lexical_decisions:
- source_word: רִפְיוֹן יָדַיִם
  choice: 双手无力
  rationale: רִפְיוֹן表示松弛、软弱或乏力；与“手”连用，描绘因衰弱或沮丧而无力行动的状态。译为“双手无力”既保留身体意象，也符合现代汉语表达。
- source_word: וְכִשְׁלוֹן בִּרְכַּיִם
  choice: 双膝发软
  rationale: כִשְׁלוֹן源于“绊跌、失足”一词，与“膝”连用表示膝盖支撑不住、将要瘫软。“双膝发软”自然地保留了身体失力的比喻，并与希腊文所见“瘫软的膝盖”相符。
- source_word: אִשָּׁה
  choice: 一个……的妻子
  rationale: 该词本可指“女人”，但后文明确提到“她的丈夫”，故此处按婚姻关系译作“妻子”。
- source_word: לֹא תְאַשֵּׁר
  choice: 不能使……有福
  rationale: אשר的加强词干可表示称某人为有福，也可带有使其幸福、幸运的结果含义。主文采用“使……有福”，保留这种因果意味，同时不把它缩窄为单纯口头上的称许。
- source_word: בַּעֲלָהּ
  choice: 丈夫
  rationale: 在明确的婚姻语境中，该词指“她的丈夫”；译作“主人”会引入此处不必要且容易误解的含义。
theological_decisions:
- issue: 以希伯来文还是较长的希腊文传统为主
  choice: 以现存且高可信度的希伯来文为主，只用希腊文核对句法和意象
  alternative: 将希腊文中“卑微的心、愁苦的脸、心里的创伤、恶妻”等较长内容一并纳入本节
  rationale: 本节有可靠的希伯来文见证，故正文不补入该希伯来行所没有的希腊文扩展内容。希腊文仅支持将“无力的手、瘫软的膝”理解为对这类妻子的形象描写。
- issue: לֹא תְאַשֵּׁר的语义张力
  choice: 正文译为“不能使丈夫有福”，脚注保留“不给丈夫祝福”和“不称丈夫有福”等可能
  alternative: 直接确定为“不给丈夫祝福”或“不称丈夫有福”
  rationale: 希伯来语可能兼有使人有福、使人幸福，以及称人有福的意味；希腊文更偏向“称为有福”。正文保留较宽的结果义，脚注说明其他合理理解，避免过早消除歧义。
translation_notes:
  register: 采用简洁、对称的智慧文学格言体。“双手无力，双膝发软”保留原文并列的身体意象；冒号呈现后半句与前述意象之间的解释或等同关系。用“一个不能使丈夫有福的妻子”保持原文略带突兀的名词性结构，不额外加入道德评价。
