  text: Blessed is the one who has found wisdom[b][a], and the one who speaks in the ears of those who hear.
translation:
  language: zh_hans
  text: 寻得明辨力的人有福了[a]；能向听者讲述的人也有福了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “明辨力”也可译作“明智”“悟性”或“审慎”；原词侧重实际的理解和健全判断。
    reason: lexical_alternative
  - marker: b
    text: “讲述”也可理解为“陈说”或“讲解”。希腊文直译为“向听者的耳中”，是具体的直接传达之说法；也可表达为“讲给听众听”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: 有福了
  rationale: 既表达处于可羡、蒙福的境况，也保留智慧文学中庄重而熟悉的祝福语气。
- source_word: εὗρε
  choice: 寻得
  rationale: 对应“找到、发现”，并自然表达经过寻求而获得之后所处的状态。
- source_word: φρόνησιν
  choice: 明辨力
  rationale: 该词侧重实际的理解、判断与审慎；“明辨力”比宽泛的“智慧”更能保留这一语义特点。
- source_word: διηγούμενος
  choice: 讲述
  rationale: 可指叙说、陈述或解释；“讲述”保留其宽度，不把含义限定为单纯说话或正式讲解。
- source_word: εἰς ὦτα
  choice: 向……耳中
  rationale: 保留希腊文带方向性的具体意象，同时在汉语中仍可理解为直接对听者陈说。
- source_word: ἀκουόντων
  choice: 听者
  rationale: 简洁对应分词“正在听的人”，不擅自判定他们只是听见还是专心聆听。
theological_decisions: []
