base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/008.yaml
  text: Happy is the man who has not stumbled with his tongue[a], and has not served one more contemptible than himself.
translation:
  language: zh_hans
  text: 未曾在言语上失足、也未服侍比自己更低微的人的人，是有福的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“一个因儿女而欢喜、活着看见仇敌败亡的人。”本节的希伯来文本与希腊文本差异显著。
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 是有福的
  rationale: 这是希伯来智慧文学常见的称福格式，表示此人的境况可羡可庆；“有福”既庄重自然，也保留原文的格言色彩，不必限定为直接的神学赐福。
- source_word: נִכְשַׁל
  choice: 失足
  rationale: 原词本义是绊倒、失足；与“舌头”连用时指言语上的过失。译作“失足”保留原文隐喻，不把含义收窄为“犯罪”或泛化为“失败”。
- source_word: בִּלְשׁוֹנוֹ
  choice: 因舌头
  rationale: 保留“舌头”这一具体意象；介词在此可表达导致失足的凭借或缘由，现代汉语用“因舌头失足”简洁地呈现言语致错之意。
- source_word: עֹבֵד
  choice: 服侍
  rationale: 该词表示服事、效劳或处于从属地位；“服侍”保持宽泛的社会从属含义，不额外断定为奴隶身份，也不窄化为现代雇佣关系。
- source_word: נִקְלֶה
  choice: 卑劣
  rationale: 原词指被轻视、低贱或不光彩。“卑劣”可表达品格或社会评价上的可鄙，同时与后面的比较结构自然搭配。
- source_word: מִמֶּנּוּ
  choice: 比自己
  rationale: 在比较结构中指“比他自己”；译作“比自己”符合现代汉语习惯，并保留反身比较。
theological_decisions:
- issue: 希伯来文本与希腊文本在本节存在重大差异
  choice: 正文采用现存希伯来见证：“未曾因舌头失足、也未服侍比自己卑劣之人的人，是有福的。”
  alternative: 希腊文作：“一个因儿女而欢喜、活着看见仇敌败亡的人。”
  rationale: 本节有可靠的希伯来见证，故正文优先据希伯来文翻译；希腊文内容与之显著不同，不能静默调和，须在脚注中完整保留其异文。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“因舌头失足”刻意保留希伯来文的身体隐喻；句末使用“是有福的”使中文称福句自然完整。
