  yaml_path: translation/deuterocanon/sirach/025/012.yaml
  text: The fear of the Lord surpasses everything[b][a]; to whom will the one who holds fast to it be compared?
translation:
  language: zh_hans
  text: 敬畏主，超越一切[a]；持守这敬畏的人[b]，可与谁相比呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“敬畏主，高过万有。”希腊语的说法强调它胜过一切。
    reason: lexical_alternative
  - marker: b
    text: “持守”也可译作“拥有”或“牢牢抓住”。原词兼有坚定把持和持有之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος Κυρίου
  choice: 敬畏主
  rationale: φόβος本有“惧怕、敬畏”之义；在智慧文学的固定神学语境中，“敬畏主”既是现代中文通行表达，也保留了面对主时畏惧与尊崇并存的含义。
- source_word: ὑπὲρ πᾶν ὑπερέβαλεν
  choice: 超越一切
  rationale: ὑπὲρ πᾶν与ὑπερέβαλεν共同强化“高过、胜过一切”的意思。希腊语虽用不定过去时，但此处是格言式陈述；现代汉语无需添加过去时标记。
- source_word: ὁ κρατῶν αὐτοῦ
  choice: 持守这敬畏的人
  rationale: κρατέω可表示牢牢抓住、持守或拥有；“持守”保留持续而坚定的意味。将αὐτοῦ按所指明译为“这敬畏”，避免中文代词指向含混。
- source_word: τίνι ὁμοιωθήσεται
  choice: 可与谁相比呢？
  rationale: 保留未来被动式修辞问句的比较含义；“可与谁相比”在现代中文中自然有力，也传达此人无可比拟的言外之意而不把它改写成直陈句。
theological_decisions:
- issue: φόβος是否弱化为单纯的尊敬
  choice: 敬畏主
  alternative: 惧怕主；尊崇主
  rationale: “敬畏”没有把φόβος消解为一般尊重，同时符合中文智慧文学的关键术语传统，保留畏惧与尊崇之间的神学张力。
- issue: 不定过去时ὑπερέβαλεν是否译成过去事件
  choice: 超越一切
  alternative: 已经超越一切；曾胜过一切
  rationale: 上下文表达普遍而恒常的智慧判断。现代汉语不强制标示时态，以无时态形式更准确地呈现格言性质。
- issue: 分词ὁ κρατῶν的代表性阳性是否在中文中限定为男性
  choice: 持守这敬畏的人
  alternative: 持守这敬畏的男子；他
  rationale: 希腊语阳性单数在这里可作泛指。中文“人”自然保留单数代表性，不额外加入原文未强调的生理性别。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。前半句简洁断言，后半句保留修辞问句。以“这敬畏”明确αὐτοῦ的回指对象，并用“可与谁相比呢”保持原文的庄严力度。
