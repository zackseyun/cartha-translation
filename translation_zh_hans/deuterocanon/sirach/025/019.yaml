  text: Any evil is small compared with the evil of a woman[b][a]; may the lot of a sinner fall upon her.
translation:
  language: zh_hans
  text: 任何恶事，与女人的恶相比，都算轻微；愿罪人的命运落在她身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译作：“罪人的命运必落在她身上。”希伯来文可以表示祈愿，也可以理解为将来发生的事；希腊文本的愿望式较支持正文的译法。
    reason: alternative_reading
lexical_decisions:
- source_word: מְעַט רָעָה
  choice: 任何恶事……都算轻微
  rationale: 希伯来文表达恶事在随后的比较中显得轻微；结合希腊文 μικρὰ πᾶσα κακία，将概括性的范围自然译为“任何恶事”，并保留“轻微”的比较意味。
- source_word: כְרָעַת אִשָּׁה
  choice: 与女人的恶相比
  rationale: 前缀 כְּ 表示比较；“与……相比”在现代汉语中清楚自然。אִשָּׁה 是单数“女人”，没有充分依据缩窄为“妻子”，也不将原文尖锐的性别措辞淡化。
- source_word: רָעָה
  choice: 恶事／恶
  rationale: רָעָה 可指道德上的邪恶、伤害或祸患；此处用“恶事”和“恶”保留其宽广而强烈的语义，也与希腊文 κακία 相符。
- source_word: גוֹרַל
  choice: 命运
  rationale: 该词本指抽签所得的份额，进而指所分得的遭遇或命运。中文“命运”能自然表达此处的引申义；直译“签”会妨碍理解。
- source_word: חוֹטֵא
  choice: 罪人
  rationale: 分词名词化，泛指犯罪或有罪的人；“罪人”简洁并保留单数泛指。
- source_word: יִפּוֹל עָלֶיהָ
  choice: 愿……落在她身上
  rationale: 希伯来文未完成体可有祈愿语气，希腊平行文本的愿望式 ἐπιπέσοι 进一步支持这一理解；“愿……落在她身上”保留咒愿式力度。
theological_decisions:
- issue: 末句动词的语气
  choice: 译作祈愿或咒愿：“愿罪人的命运落在她身上”
  alternative: 译作预告：“罪人的命运必落在她身上”
  rationale: 希伯来文形式容许情态解读，而希腊文愿望式强力支持祈愿义。脚注保留陈述未来这一语法上可能的理解。
- issue: 带有性别指向的措辞
  choice: 保留单数“女人”
  alternative: 译作“妻子”或泛化为“女人们”
  rationale: 希伯来文 אִשָּׁה 与希腊文 γυναικός 均为单数“女人”；虽然该格言措辞严酷，但不应在没有文本依据时缩窄、泛化或缓和。
translation_notes:
  register: 采用现代、凝练而庄重的智慧文学格言语体。“都算轻微”使比较关系符合普通现代汉语；“女人的恶”有意保留原文的尖锐措辞，不作辩护性改写。
