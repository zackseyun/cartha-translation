  source_fidelity: 正文正确以现存希伯来文为依据，并保留了其与希腊文的重大分歧。不过，“它们的生活”在中文中容易把尚未列出的“三样”理解为无生命事物，却又赋予其“生活”，表达不自然；希伯来文此处是在说所指对象的生活／行径。
  naturalness: “有三样，是我心所憎恨的”略显停顿和倒装。“有三件事是我心所憎恨的”更符合现代标准汉语。将后句改作“它们的行径使我极其苦恼”可自然表达该处的伦理性不满，同时保留其指涉要待后文列举才明确的状态。
  terminology: “我心所憎恨”“极其苦恼”庄重、自然，足以传达 נַפְשִׁי 与 וְצַר לִי מְאֹד 的情感力度。脚注应将希腊文的“邻舍的友谊”明确译出；“邻舍相亲”虽可理解，但不如“邻舍之间的友谊”准确。
  issues:
