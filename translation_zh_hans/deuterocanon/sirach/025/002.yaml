    issue: “它们的生活”搭配不自然且指涉失当
    rationale: “三样／三件事”在中文通常指事物；以“它们的生活”承接会造成语义冲突。希伯来文 בְּחַיֵּיהֶם 可在此语境中指相关对象的生活行径，中文以“行径”表达更通顺，也不必预先断定后文三项的具体身份。
  - severity: low
