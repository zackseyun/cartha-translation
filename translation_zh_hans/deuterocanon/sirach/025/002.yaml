  language: zh_hans
  text: 有三件事是我心所憎恨的[a]；它们的行径使我极其苦恼：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证在此处有显著不同：“弟兄的和睦，邻舍之间的友谊，以及妻子和丈夫彼此和谐相处。”希伯来文与希腊文看来反映了本节不同的文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ
  choice: 有三样
  rationale: 希伯来文仅用阴性数词“三”，语境表明它引出三类事物；中文补出“样”，自然地承接下文。
- source_word: שָׂנְאָה נַפְשִׁי
  choice: 是我心所憎恨的
  rationale: 保留“我的心/生命”这一强烈的情感表达，同时用现代中文“我心”避免生硬直译为“我的灵魂”；完成式在格言语境中表达已经形成、持续有效的厌恶。
- source_word: וְצַר לִי מְאֹד
  choice: 使我极其苦恼
  rationale: 该短语表达说话者深切的烦恼、窘迫或痛苦；“极其苦恼”既自然又保留情感力度。
- source_word: בְּחַיֵּיהֶם
  choice: 它们的生活
  rationale: 较直接地保留“在/因它们的生活”这一表述，不将其明确扩展为“生活方式”，从而避免过度解释；因所指的三项尚未列出，采用中性的“它们”。
theological_decisions:
- issue: 《便西拉智训》25:2希伯来文与希腊文见证严重分歧
  choice: 正文依据现存希伯来文，译为对三样事物的憎恨与苦恼。
  alternative: 希腊文为：“弟兄和睦，邻舍相亲，夫妻彼此和谐相处。”
  rationale: 本节有可信的希伯来文见证，故以其为正文基础；希腊文反映实质不同的文本形态，不能暗中调和，须在脚注完整说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我心所憎恨的”保留希伯来文 נַפְשִׁי 的情感力度；分号与冒号呈现本句作为后续列举引言的结构。
