  text: How beautiful is wisdom in the aged[a], and understanding and counsel in those who are honored.
translation:
  language: zh_hans
  text: 老年人的智慧何其美好！受人尊重者的见识和谋略也是如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ὡραία
  choice: 何其美好
  rationale: ὡς与形容词连用构成感叹，表示“多么美好”，并非比较意义。“何其美好”保留了赞叹语气和庄重风格。
- source_word: γερόντων
  choice: 老年人
  rationale: 该词指年长者，并不表示担任职分的“长老”。希腊语形式虽为阳性复数，格言在此泛指老年人；中文“老年人”自然且不无端缩窄为男性。
- source_word: σοφία
  choice: 智慧
  rationale: σοφία是《便西拉智训》的核心智慧词汇；“智慧”准确、自然，也适合本节的格言体。
- source_word: δεδοξασμένοις
  choice: 受人尊重者
  rationale: 完成时被动分词表示处于受尊崇、受敬重状态的人。“受人尊重者”既保留被动意味，也避免把该词神学化地译成“得荣耀者”。
- source_word: διανόημα
  choice: 见识
  rationale: 此词可指思想、思考所得或理解力。与“谋略”并列时，“见识”自然地表达成熟的认识和判断，同时避免“思想”过于宽泛。
- source_word: βουλή
  choice: 谋略
  rationale: βουλή在此指经过权衡而形成的明智筹划或主意。“谋略”保留其实践性和格言体的凝练感；并不将其限定为向别人提出的“劝告”。
theological_decisions:
- issue: γερόντων的性别与指称范围
  choice: 译作不限定性别的“老年人”
  alternative: “老翁”或“老者”
  rationale: 希腊语在语法上为阳性复数，但本句是关于年长者智慧的一般性格言，并无明确依据将其教训限于男性，也不应译成带职分含义的“长老”。
- issue: δεδοξασμένοις与后两个名词的句法关系
  choice: 按领属关系自然译为“受人尊重者的见识和谋略”
  alternative: 较形式化地译为“对受人尊重者而言，见识和谋略……”
  rationale: 原文使用与格与“受人尊重者”相连，中文用领属结构最自然，也与前半句“老年人的智慧”形成清楚的平行；未进一步断定尊重来自宗教、社会地位或道德品格。
- issue: 后半句省略的评价语
  choice: 以“也是如此”承接“何其美好”
  alternative: 重复译为“见识和谋略何其美好”
  rationale: 希腊文后半句没有重复ὡραία，而是通过并列承接前面的感叹。“也是如此”既补足中文句意，又保留原文的省略和平行结构。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“何其美好”传达感叹色彩；后句用“也是如此”避免笨重重复，并保留希腊文的省略结构。
