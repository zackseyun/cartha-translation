  text: Like a sandy ascent under the feet of an old man[c][b][a], so is a sharp-tongued wife to a gentle man.
translation:
  language: zh_hans
  text: 老人脚下的沙地坡路[a]如何，长舌的妻子[b]对温和的男人[c]也如何。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沙地”所对应的希伯来文在此难解，通常意为“外面”；希腊文平行文本作“多沙的”，很可能保存了这一比喻所描绘的不稳固地面。
    reason: textual_variant
  - marker: b
    text: 或译“多嘴的妻子”。希伯来文直译为“有舌头的妻子”，希腊文也指多言或惯于动舌的女人。
    reason: lexical_alternative
  - marker: c
    text: 或译“安静的男人”。希伯来文意为“柔和、温和”，希腊文平行文本可指“安静”或“平和”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲלֵה
  choice: 沙土坡
  rationale: מַעֲלֶה指上坡、坡道；译作“坡”能以简洁自然的现代汉语呈现这一比喻中的艰难上行。
- source_word: חוּץ
  choice: 沙土
  rationale: 希伯来文חוּץ在此难解，通常意为“外面”；希腊文平行文本ἀμμώδης明确为“多沙的”，很可能保存了此处不稳固地面的原意，因此正文采用“沙土”，并以脚注说明文本问题。
- source_word: לְרַגְלֵי יָשִׁישׁ
  choice: 老人脚下
  rationale: יָשִׁישׁ指年老的人；这里不是职衔“长老”，而是以老人行走困难构成比喻。“老人脚下”准确而自然。
- source_word: אֵשֶׁת לָשׁוֹן
  choice: 长舌的妻子
  rationale: 字面为“有舌头的妻子／舌头之妻”，表示以言语为显著特征的人。希腊文γλωσσώδης可指多言、饶舌。“长舌”保留负面语气，却不把原文未明确表达的“尖刻”定死。
- source_word: לְאִישׁ רַךְ
  choice: 对温和的丈夫
  rationale: רַךְ本义为柔软、柔嫩，用于人可指温和；希腊文ἡσύχῳ则可指安静、平和。译作“温和”既体现性情上的对比，也保留“安静”的可能性于脚注中。אִישׁ在婚姻关系中自然指丈夫。
theological_decisions:
- issue: 智慧格言中的性别与婚姻关系称谓
  choice: 妻子……丈夫
  alternative: 女人……男人；配偶……人
  rationale: 希伯来文אֵשֶׁת与אִישׁ在此构成婚姻关系中的一对，希腊文也用γυνή与ἀνήρ。保留明确的性别和婚姻语境，不改写为性别中性的普遍命题。
- issue: 是否把“有舌头”解释为尖酸刻薄
  choice: 长舌的
  alternative: 尖刻的；多嘴的
  rationale: 原文及希腊文首先强调言语多或惯于动舌，虽语境显然负面，却未必专指言辞尖刻。采用“长舌的”以保存词义张力，不作过度限定。
translation_notes:
  register: 采用简洁、庄重而口语可懂的现代标准汉语，保留原文“怎样……也是怎样”的格言式平行结构。“沙土坡”使古代行路意象具体可感；“长舌”保留负面含义，同时避免把含混的言语特征过度解释为单一的尖刻性格。所有脚注标记均置于相应正文词语之后。
