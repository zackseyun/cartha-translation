  text: For he is a God of justice[a], and with him there is no partiality.
translation:
  language: zh_hans
  text: 因为他是秉公审判的上帝[a]，在他那里绝无偏袒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 斯威特本所列本节希腊文是另一句话：“我屡次冒死，却因这些事而获救。”这表明此处可能存在文本或节号错位；正文依照现存希伯来文见证翻译。
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: 因为
  rationale: 承接前文关于不可行贿、不可倚靠不义祭物的禁令，说明其理由；“因为”自然保留因果关系。
- source_word: אלהי משפט
  choice: 秉公审判的上帝
  rationale: 构造短语表明上帝具有公正施行审判的属性；此译兼顾 משפט 的司法行动与公义内涵，比单译“公义的上帝”更直接呼应下句不偏袒人的司法语境。
- source_word: אין עמו
  choice: 在他那里绝无
  rationale: 保留希伯来语“与他同在／在他那里没有”的表达关系，并以“绝无”自然传达明确否定。
- source_word: משוא פנים
  choice: 偏袒
  rationale: 这是指因人的身份、地位等而徇情的惯用语；“偏袒”简洁自然，也适合审判语境。
theological_decisions:
- issue: משפט 在描述上帝属性时的译法
  choice: 秉公审判
  alternative: 公义；审判
  rationale: 原词兼具审判与公正之意。“秉公审判”不把张力缩减为抽象品格或单纯判决，且清楚说明上帝不接受贿赂的理由。
- issue: 希伯来文本与所给希腊平行文本严重不符
  choice: 正文依照现存希伯来见证翻译，并以脚注注明错位
  alternative: 采用希腊句子；将希伯来文与希腊文合并
  rationale: 此处有高可信度的希伯来文本，而希腊平行文本表达完全不同的句子，可能源于文本或节号错位；不应擅自调和两者。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“秉公审判”保留司法语境，“绝无偏袒”语气明确，普通读者易懂。脚注标记[a]已置于相关正文之后。
