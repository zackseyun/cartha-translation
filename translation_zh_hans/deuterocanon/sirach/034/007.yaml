  text: For dreams have misled many[b][a], and those who hoped in them have fallen.
translation:
  language: zh_hans
  text: 因为梦曾使许多人迷失，那些寄望于梦的人也跌倒了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跌倒了”也可译作“失败了”或“败亡了”；原文没有明确说明其失败或败亡的具体形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: 许多人
  rationale: 这是ἐπλάνησεν的复数宾语，指数量众多但未具体限定的人。
- source_word: ἐπλάνησεν
  choice: 使……迷失
  rationale: 该动词表示使人偏离正路或走入歧途；“使……迷失”既保留比喻色彩，也不将含义过度限定为蓄意欺骗。
- source_word: τὰ ἐνύπνια
  choice: 梦境
  rationale: 指梦中所见或梦；“梦境”在现代汉语中自然，并能体现希腊文的复数概括意义。
- source_word: ἐξέπεσαν
  choice: 跌倒了
  rationale: 原词具有坠落、失足乃至失败或败亡的语义范围；“跌倒了”保留原文比喻及其结果的开放性。
- source_word: ἐλπίζοντες
  choice: 那些寄望……的人
  rationale: 分词在此指寄托希望的人；“寄望于”自然表达其持续倚赖的意味。
- source_word: ἐπʼ αὐτοῖς
  choice: 于梦境
  rationale: 代词回指梦境；为避免汉语中“寄望于它们”的生硬表达，明确复现所指对象。
theological_decisions:
- issue: 本节对梦境的警告范围
  choice: 经文警告人寄望于梦境，因为梦境曾使许多人迷失，并使倚望它的人跌倒。
  alternative: 把本节理解为毫无例外地谴责一切梦，或仅仅谴责错误的解梦。
  rationale: 希腊文直接陈述梦境曾使许多人迷失，并特别提到寄望于梦境的人；译文不把警告扩大为对所有梦的绝对否定，也不把它缩窄为只针对解梦行为。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“迷失”“跌倒”保留原文相互呼应的道路与失足意象；用“寄望于”准确表达将希望寄托在梦境上的含义。
