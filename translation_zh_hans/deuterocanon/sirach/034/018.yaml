base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/018.yaml
  text: Even God will not delay[a], and like a warrior he will go out and not hold back, until he crushes the loins of the cruel, and repays vengeance to the nations; until he dispossesses the scepter of arrogance, and the staff of the wicked he will cut down completely.
translation:
  language: zh_hans
  text: 连上帝也必不迟延[a]；他要像勇士出征，毫不克制，直到击碎残暴者的腰身，向列国施行报应；直到除去狂傲的权杖，把恶人的杖彻底砍断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所提供的希腊文见证却作：“使心灵振奋，使眼睛明亮，赐下医治、生命和福分。”这与现存希伯来文本属于差异很大的文本传统。
    reason: textual_variant
lexical_decisions:
- source_word: גם אל
  choice: 连上帝也
  rationale: גם在此构成强调性的转折；译作“连……也”保留其突出的语气，同时不把具体篇章关系解释得过死。
- source_word: לא יתמהמה
  choice: 必不迟延
  rationale: התמהמה表示耽延、迟迟不行动；“必不迟延”既自然，也保留未完成式在此指向将来行动的语气。
- source_word: כגבור יצא
  choice: 他要像勇士出征
  rationale: גבור在审判和争战意象中指勇士；יצא直译为“出去”，此处用“出征”自然呈现军事语境。
- source_word: לא יתאפק
  choice: 毫不退缩
  rationale: אפק在此表示克制、遏止自己；“毫不退缩”传达不再收敛行动的意思，并与勇士出征的意象衔接。
- source_word: ימחץ
  choice: 击碎
  rationale: מחץ是力度很强的击打、压碎之词；“击碎”保留审判图像的猛烈程度。
- source_word: מתני אכזרי
  choice: 残暴者的腰身
  rationale: מתנים字面指腰部或胯部，也可暗示力量所在；保留“腰身”的具体身体意象，不直接释义为“力量”。אכזרי按单数实体译作“残暴者”。
- source_word: לגוים ישיב נקם
  choice: 向列国施行报应
  rationale: ישיב נקם具有使报复或惩罚回到对象身上的报偿含义；“向列国施行报应”保留ל的方向性，也比现代汉语中的“向列国报仇”更庄重自然。
- source_word: יוריש שבט זדון
  choice: 废除狂傲的权杖
  rationale: יוריש可表示使之失去产业、赶走或除去；与象征统治的שבט搭配时，“废除”较自然。שבט译作“权杖”，凸显狂傲权势的统治意象。
- source_word: מטה רשע
  choice: 恶人的杖
  rationale: מטה是杖或棍；与前句“权杖”平行而不完全重复。רשע可作实体称谓，故译“恶人”。
- source_word: גדוע יגדע
  choice: 彻底砍断
  rationale: 不定式绝对形与限定动词连用，强化动作的确定性和彻底性；“彻底砍断”在现代汉语中清楚表达这种强调。
theological_decisions:
- issue: 希伯来文本与希腊平行文本存在重大差异
  choice: 正文以现存希伯来文本为依据，并用脚注说明希腊见证的不同内容。
  alternative: 采用希腊文本：“使心灵振奋，使眼睛明亮，赐下医治、生命和福分。”
  rationale: 本项目在《便西拉智训》希伯来文尚存之处优先依据希伯来文。此处希腊文不是细微异文，而是内容完全不同的文本传统，因此不将二者调和；以脚注如实保留文本不确定性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“腰身”“权杖”“杖”等具体诗歌和军事意象；以分号呈现两个“直到”分句的递进与平行。
