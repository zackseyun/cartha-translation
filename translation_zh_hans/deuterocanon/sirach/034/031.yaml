base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/031.yaml
  text: At a banquet of wine do not rebuke your neighbor[a], and do not belittle him in his gladness; do not speak a word of reproach to him, and do not distress him by making demands.
translation:
  language: zh_hans
  text: 在酒宴上，不要责备你的邻人；他欢庆时，不要轻看他。不要说羞辱他的话，也不要在向他提出要求时使他苦恼。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提出要求”也可理解为“催他还债”；希腊语可指提出要求或强行索取，也常用于追讨所欠之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: συμποσίῳ οἴνου
  choice: 酒宴
  rationale: 指以饮酒为特色的社交宴席。“酒宴”简洁自然，既保留酒的语义，也避免“饮酒会”可能带来的贬义。
- source_word: ἐλέγξῃς
  choice: 责备
  rationale: 本处指当面指责或斥责同席者；“责备”符合人际劝诫的语境，且不引入正式审判或揭露罪行的意味。
- source_word: πλησίον
  choice: 邻人
  rationale: 保留该词在智慧传统中的伦理用语；在当前语境中也可泛指身边的人或同伴。
- source_word: ἐξουδενώσῃς
  choice: 轻看
  rationale: 原词有视为无足轻重、鄙视之意。“轻看”兼顾内在态度与外在贬低，语气自然且不过度强化为公开羞辱。
- source_word: ἐν εὐφροσύνῃ αὐτοῦ
  choice: 他欢庆时
  rationale: 表达对方正处于宴饮欢乐之中；采用时间表达比直译“在他的欢乐中”更符合现代汉语。
- source_word: λόγον ὀνειδισμοῦ
  choice: 责辱的话
  rationale: ὀνειδισμός兼有责难与羞辱意味；“责辱的话”保留两层含义及智慧文学的凝练语气。
- source_word: θλίψῃς
  choice: 使他苦恼
  rationale: 原词可指压迫、逼迫或使人困苦；此处采用结果式表达，涵盖催逼造成的心理和实际困扰，而不限定为身体伤害。
- source_word: ἐν ἀπαιτήσει
  choice: 因催讨
  rationale: ἀπαίτησις可泛指索取、催讨，也常带追讨欠款的意味。“催讨”保留这种语义范围，不在正文中明确补出原文未明说的债务。
theological_decisions: []
