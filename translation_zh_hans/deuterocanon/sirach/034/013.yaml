  text: He does not show partiality to the poor[a], and he hears the plea of the oppressed.
translation:
  language: zh_hans
  text: 他不偏袒穷人[a]，并垂听受压迫者的恳求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“敬畏主之人的灵必存活，因为他们盼望那拯救他们的。”这里的希腊文与现存希伯来文反映了差异显著的文本形式。
    reason: textual_variant
lexical_decisions:
- source_word: לא ישא פנים
  choice: 不偏袒
  rationale: 希伯来语习语字面为“抬起脸”，在此表示徇私、偏待；“不偏袒”自然简明，并保留司法语境。
- source_word: אל דל
  choice: 穷人
  rationale: אל标明偏袒所指向的对象；דל可指贫穷、弱小或社会地位低下的人，此处译为“穷人”最直接。原文的要点不是说上帝敌视穷人，而是说他审断时不因其贫穷而徇私。
- source_word: ותחנוני מצוק
  choice: 却垂听受压迫者的恳求
  rationale: תחנונים指迫切求怜悯、求援助的恳求；מצוק指身处困境、受逼迫的人。“受压迫者”与前句“穷人”形成社会处境上的呼应。连接词用“却”呈现“不偏袒”与“仍垂听”之间的重要张力。
- source_word: ישמע
  choice: 垂听
  rationale: 未完成式在智慧文学中可表达恒常、惯常事实；“垂听”不仅表示听见，也自然表达对恳求的留意与回应。
- source_word: πνεῦμα φοβουμένων Κύριον ζήσεται
  choice: 不纳入正文
  rationale: 希腊见证与现存希伯来文差异显著，显然代表另一文本形态。此处希伯来文尚存，故正文从希伯来文，希腊异文收入脚注。
theological_decisions:
- issue: “不偏袒穷人”与“垂听受压迫者”之间的张力
  choice: 保留“不偏袒穷人”，并以“却”连接后句
  alternative: 不偏待穷人／不歧视穷人
  rationale: 希伯来文表面意思是否定对穷人的偏袒，而非明确说“不歧视穷人”。后半句同时肯定他垂听困苦者，因此不应通过改译消除这种司法公正与眷顾受苦者并存的张力。
- issue: 现存希伯来文与希腊文见证分歧
  choice: 正文采用开罗藏经库希伯来文，希腊读法列入脚注
  alternative: 正文采用希腊文：“敬畏主之人的灵必存活，因为他们仰望那拯救他们的。”
  rationale: 本节希伯来文尚存且可信度高；希腊文并非近似措辞，而是实质不同的文本形态，因此保留为重要异文，不与正文混合。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“偏袒”准确表达司法上的徇私；“垂听”和“恳求”略带经文语体，但仍属现代常用表达。正文保留希伯来文中出人意料的“不偏袒穷人”，不将其解释性改写为“不歧视穷人”。
