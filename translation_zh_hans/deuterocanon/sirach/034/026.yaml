  text: A furnace tests the tempering in dipping[b][a]; so wine tests hearts in the strife of the proud.
translation:
  language: zh_hans
  text: 熔炉检验浸淬处理的金属制品[a]；照样，酒在骄傲者的争斗中检验人心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句前半的希腊文含义较难确定。“浸淬处理的金属制品”也可更具体地理解为“淬火中的刃口”，或理解为“浸淬所成的硬化状态”。
    reason: lexical_alternative
  - marker: b
    text: “争斗”也可译作“争战”或“冲突”；原词既可指战斗，也可泛指争执。
    reason: alternative_reading
lexical_decisions:
- source_word: κάμινος
  choice: 熔炉
  rationale: 指产生高温、用于冶炼或烧制的炉；“熔炉”自然保留了高热检验的冶金意象。
- source_word: δοκιμάζει
  choice: 检验
  rationale: 表达通过试验判明品质的意思；“检验”兼具评定和验证之意，适合本节两处平行用法。
- source_word: στόμωμα
  choice: 硬化程度
  rationale: 此词在这里含义困难，可能指硬化、淬炼结果、刃口或金属制品。正文以“硬化程度”表达冶金检验的大意，又用脚注保留更具体或更宽泛的可能。
- source_word: ἐν βαφῇ
  choice: 在浸淬中
  rationale: βαφή的基本意象是浸入，也可用于染色；在冶金语境下很可能涉及浸水淬火。“浸淬”既保留浸入动作，也提示可能的技术含义。
- source_word: οὕτως
  choice: 照样
  rationale: 清楚引出前后两句的类比关系，符合现代汉语智慧文学的表达。
- source_word: οἶνος
  choice: 酒
  rationale: 直接对应原词，并保留酒使人的内在品性显露出来的意象。
- source_word: καρδίας
  choice: 人心
  rationale: 原文为复数“心”；汉语用集合性的“人心”更自然，同时保留“心”作为内在人格与意向中心的圣经语言。
- source_word: ἐν μάχῃ
  choice: 在……争斗中
  rationale: μάχη可指战斗、冲突或争执。此处用较宽泛的“争斗”，不强行限定为军事战场。
- source_word: ὑπερηφάνων
  choice: 骄傲人的
  rationale: 保留该词对相关之人的道德刻画；属格在此自然理解为这些人所参与或引起的争斗。
theological_decisions:
- issue: στόμωμα ἐν βαφῇ这一困难短语的解释
  choice: 采用冶金意象，译为“金属在浸淬中的硬化程度”
  alternative: 也可理解为“淬火中的刃口”，或较笼统地理解为“浸入处理的金属制品”
  rationale: 这主要是词义和文本理解上的难点，并非教义判断。正文呈现由高热与浸淬检验金属品质的总体意象，脚注则保留原文可能指刃口或金属制品的歧义。
- issue: ἐν μάχῃ ὑπερηφάνων的范围
  choice: 译为“在骄傲人的争斗中”
  alternative: 可译为“在骄傲人的争战中”
  rationale: μάχη既可指具体战斗，也可泛指冲突。选用“争斗”避免无根据地军事化，同时保留酒在冲突情境中显明人心的张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。前半句因希腊文存在重大理解困难，正文使用可读的冶金表述，并以脚注明确保留歧义；后半句保持“酒—检验—人心”的简洁类比，不添加因果解释。
