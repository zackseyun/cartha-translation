  choice: 正文依现存希伯来文翻译，并以脚注保存希腊文异文。
  alternative: “谁是他的扶持者？”
  rationale: 《便西拉智训》有希伯来文存留时以其为主要原文证据；但本节希腊文呈现完全不同的句子，可能反映不同的底本或文本发展阶段，因此不可默默调和或省略。
