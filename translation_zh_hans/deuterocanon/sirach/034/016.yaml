lexical_decisions:
- source_word: תמרורי
  choice: 征兆
  rationale: 此复数名词指可辨认的标志或迹象；“征兆”自然地保留其指示性，又不像“预兆”那样强加吉凶含义。
- source_word: רצון
  choice: 蒙悦纳
  rationale: רצון可指喜悦、恩惠或接纳；在“征兆”的属格结构中，“蒙悦纳”较自然，也保留所蒙恩惠之主体未明的含混性。
- source_word: הניחה
  choice: 留下
  rationale: 该使役形在此有放置、安放之意；“留下”符合“征兆”的中文搭配，并保留具体动作感。
- source_word: וצעקה
  choice: 一声呼喊
  rationale: 按名词理解，保留希伯来文突兀而凝练的诗性表达。
- source_word: ענן
  choice: 云彩
  rationale: 直译单数名词；中文在此无需强行标出定指或不定指，因而保留原文所允许的含混。
- source_word: חשתה
  choice: 使……急速而来
  rationale: 词根表达迅速、赶快；句法虽困难，但此译依现有希伯来文将“呼喊”理解为促使云彩迅速行动，并以“而来”给出自然中文，同时不扩展其目的。
