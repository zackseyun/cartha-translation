  text: 'A dream-vision is this against that: like the likeness of a face opposite a face.'
translation:
  language: zh_hans
  text: 梦中所见，是此对彼；如同一张脸的形像在另一张脸的对面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希腊文十分简省，也可译作：“梦的异象，是这个对着那个；如同一张脸的形像在另一张脸的对面。”其中的关系既可理解为彼此相对，也可理解为对应或映照。
    reason: 说明原文省略式表达及比较关系的多种可能。
lexical_decisions:
- source_word: ὅρασις ἐνυπνίων
  choice: 梦中所见
  rationale: 这一属格结构简练而略带格言色彩。“梦中所见”在现代汉语中自然，也保留“梦”与“所见景象”的紧密关系，未扩写为对梦境性质的解释。
- source_word: τοῦτο κατὰ τούτου
  choice: 此与彼相对
  rationale: 原文极其简省，κατά在这里可表达相对、对照或对应。“此与彼相对”保留并置关系及含混性，又与下半句两张脸彼此相对的意象呼应。
- source_word: κατέναντι προσώπου
  choice: 一张脸的对面
  rationale: κατέναντι表示在……对面或正对着。译文避免使用容易形成固定交往含义的“面对面”，以便保留原句的空间结构。
- source_word: ὁμοίωμα προσώπου
  choice: 一张脸的形像
  rationale: ὁμοίωμα可指相似之物、形像或影像。“形像”强调相似而非同一，同时没有明确断定这里必然是镜中倒影。
theological_decisions:
- issue: 本节关于梦的格言究竟表达何种比较关系
  choice: 保留梦中所见与现实或另一事物彼此相对、相似的意象，不明确断言它就是镜像或虚假副本。
  alternative: 可理解为梦只是现实的映像，或梦使一事与另一事彼此对应。
  rationale: 上下文对轻信梦境持警戒态度，但本句本身措辞简省，只明确呈现相对与相似的关系。译文不把上下文中的评价强化成原句未明说的哲学判断。
translation_notes:
  register: 采用简洁、庄重而可懂的现代标准汉语，并以分号呈现原文格言式的两段结构。“此与彼”略带书面色彩，用来保留希腊文反复指示词的凝练感；脚注补充较展开的译法。
