  source_fidelity: 主文将ἐλασσουμένῳ οἴνῳ理解为“缺少酒的人”，是可成立且与《德训篇》此处常见译法相符的理解；脚注也适当保存“因酒受损”的另一种可能。酒的受造目的、适量饮用的条件及反问语气均得到保留。不过，“生活”未能与前句ζωή所译的“生命”保持对应，且“只要你按适当的分量饮用”在现代汉语中宾语省略、条件关系略显松散。
