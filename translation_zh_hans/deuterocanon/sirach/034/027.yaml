base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/027.yaml
  text: Wine is like life to a man[a], if you drink it in due measure. What is life to one diminished by wine? For it too was created for human gladness.
translation:
  language: zh_hans
  text: 人若适量饮酒，酒对于人就如同生命。对缺少酒的人[a]来说，生命又算什么呢？因为酒也是为了使人欢喜而被造的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希腊文十分简约，也可能理解为：“因酒而受损的人，生命又算什么呢？”主文将与格“酒”理解为所缺少的事物。
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσον ζωῆς
  choice: 如同生命
  rationale: ἴσον配合属格ζωῆς表达相等或可比；“如同生命”既保留比较力度，也符合现代汉语表达。
- source_word: ἀνθρώπῳ
  choice: 对于人
  rationale: 单数与格在此作泛指，指一般的人，不限定性别。
- source_word: ἐὰν πίνῃς αὐτὸν
  choice: 只要你……饮用
  rationale: 保留希腊文第二人称单数和箴言式条件语气；“只要”自然表达条件所设的限制。
- source_word: μέτρῳ αὐτοῦ
  choice: 按适当的分量
  rationale: μέτρον的核心义是尺度、分量；此译既保留具体的“量”，也传达适度饮用之意，而不抽象化为一般性的“节制”。
- source_word: τίς ζωὴ
  choice: 还有什么生活可言呢
  rationale: 以自然汉语保留简短有力的反问；“生活”在此比重复译为“生命”更能表达生活境况，但仍维持与前句ζωή的语义联系。
- source_word: ἐλασσουμένῳ οἴνῳ
  choice: 缺少酒的人
  rationale: ἐλασσόω可表示使减少、使缺少；两个与格形式可理解为“在酒方面有所缺少的人”。句法十分简约，故另以脚注保留“被酒损害”的可能理解。
- source_word: ἔκτισται
  choice: 被造
  rationale: 保留完成时被动态所表达的受造状态，同时用简洁、庄重的现代汉语呈现。
- source_word: εἰς εὐφροσύνην ἀνθρώποις
  choice: 是为使人欢喜
  rationale: εἰς表达目的，εὐφροσύνη指喜乐、欢欣；“使人欢喜”自然清楚，并保留酒受造的正面目的。
theological_decisions:
- issue: 酒的受造目的与适量限制
  choice: 酒也被造，是为使人欢喜
  alternative: 酒被造，是为给人带来欢乐
  rationale: 译文直接保留酒具有使人欢喜的受造目的，同时由前句“按适当的分量”明确限定其正面使用，不额外引入禁酒或纵饮的立场。
- issue: ἐλασσουμένῳ οἴνῳ的含义
  choice: 缺少酒的人
  alternative: 被酒损害的人
  rationale: 主文采用较直接的句法理解，即人在酒方面有所缺少；但希腊语的与格关系简约，亦可能理解为人因酒而受损，因此在脚注中保存这一真实歧义，不以神学立场消除张力。
translation_notes:
  register: 采用现代、庄重而通俗的箴言体。前句用“生命”，反问句用“生活可言”，兼顾词语呼应与自然汉语；脚注明示原文歧义，且标记置于实际涉及的短语之后。
