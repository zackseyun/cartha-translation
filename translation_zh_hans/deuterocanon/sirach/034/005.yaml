  text: Divinations and omens[b] and dreams are empty, and the heart imagines them like a woman in labor.[a]
translation:
  language: zh_hans
  text: 占卜、观兆[b]和梦都是虚妄的；人的心会产生幻想，如同临产的妇人一般。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存并归于本节的希伯来文作：“要以善意的眼光周济穷人；给他时，不要心生恼怒。”这似乎属于另一节经文，或是文本见证发生了错配。此处正文依据希腊文本翻译。
    reason: textual_variant
  - marker: b
    text: “观兆”也可译作“占兆”，指观察并解释某些迹象，把它们视为吉凶的征兆。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαντεῖαι
  choice: 占卜
  rationale: 指寻求预知或神秘启示的占卜活动；“占卜”是现代汉语中直接、易懂且不过度限定具体方式的表达。
- source_word: οἰωνισμοί
  choice: 观兆
  rationale: 指观察并解释征兆以推断吉凶；“观兆”比单说“预兆”更能表达人的解兆行为，同时保留脚注说明其他译法。
- source_word: ἐνύπνια
  choice: 梦
  rationale: 直接表达睡梦或梦中景象，不额外强化为异象。
- source_word: μάταιά
  choice: 虚妄的
  rationale: 兼顾空虚、徒然和不可靠之意，符合本节对占卜、观兆和梦的负面判断，又保持庄重自然。
- source_word: φαντάζεται
  choice: 凭空想象
  rationale: 表达内心产生影像或幻想的活动；“凭空”传达其虚幻性质，但不把原文进一步解释为精神错乱。
- source_word: καρδία
  choice: 人的心
  rationale: 保留圣经语言中“心”作为思想和感受中心的意象；补出“人的”使现代汉语句意清楚。
- source_word: ὡς ὠδινούσης
  choice: 如同临产的妇人一般
  rationale: 阴性分词唤起妇人临产、经历产痛的形象；此译明确补出比较对象，同时不超出原文。
theological_decisions:
- issue: 现存希伯来文本与《便西拉智训》34:5的希腊文本严重不合
  choice: 以希腊平行文本作为本节正文的翻译依据，并在脚注中如实说明希伯来文本的异读或错配。
  alternative: 按所提供的希伯来文译为：“要以善意的眼光周济穷人；给他时，不要心生恼怒。”
  rationale: 所提供的希伯来行与本节希腊文在语义上完全无关，且资料已标记为“major_mismatch”；希腊文本则构成连贯的34:5读法。因此正文采用希腊见证，同时不隐去现存希伯来证据及其不确定性。
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的书面汉语。“占卜、观兆和梦”保留希腊文三项并列结构；后半句保留“心”与“临产妇人”的原文意象。脚注标记均置于正文相应位置。
