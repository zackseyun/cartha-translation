    reason: textual_variant
lexical_decisions:
- source_word: ἄνευ ψεύδους
  choice: 没有虚假
  rationale: ἄνευ加属格表示“没有、离开”；ψεῦδος在此是抽象的“虚假、虚妄”。这一表达自然，并保留其道德含义。
- source_word: συντελεσθήσεται
  choice: 就必成全
  rationale: 这是συντελέω的将来时被动态，表示完成、贯彻到底；与“律法”搭配时，“成全”兼顾完成与落实的意义。
- source_word: νόμος
  choice: 律法
  rationale: νόμος通常指“律法”。虽在智慧文学中也可能带有“训诲”的色彩，但原文没有要求缩窄为该义。
- source_word: σοφία
  choice: 智慧
  rationale: σοφία的标准对应词，符合智慧文学语体。
- source_word: στόματι πιστῷ
  choice: 在忠信之人的口中
  rationale: στόματι πιστῷ是与后文关系紧密的与格短语；直译为“在忠信的口中”略显生硬，因此补出“之人”，同时保留“口”的言语意象。πιστός译为“忠信”，既可表达忠诚，也可表达可靠。
- source_word: τελείωσις
  choice: 达到完满
  rationale: τελείωσις表示完成、臻于完善。用动词性表达“达到完满”使紧缩的希腊语名词句在现代汉语中通顺，同时不把它限定为道德上的绝对完美。
theological_decisions:
- issue: νόμος在智慧文学及次经语境中的含义
  choice: 律法
  alternative: 训诲
  rationale: 原文明确使用νόμος；采用直接对应的“律法”，避免把范围解释性地缩窄为一般教导。
- issue: στόματι πιστῷ的句法作用
  choice: 理解为处所或领域：“在忠信之人的口中”
  alternative: 理解为关联或受益与格：“对于忠信的口，智慧就是完满”
  rationale: 希腊语句法紧缩，与格可有不同理解。正文采用较自然且保留言语意象的处所表达，脚注说明另一种可能，不消除原文的不确定性。
- issue: τελείωσις与σοφία的关系
  choice: 智慧在忠信之人的口中“达到完满”
  alternative: 智慧“就是”忠信之口的完满或完成
  rationale: 原文无明示系词，名词τελείωσις可作谓语。中文正文将其动态化以便理解，但脚注保留名词性断句的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“没有虚假”与后句形成箴言式条件关系；“忠信之人的口”保留原文以“口”指言语表达的意象。两个脚注标记均置于相关的末句之后。
