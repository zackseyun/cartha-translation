  text: Without falsehood the law will be fulfilled[b][a], and wisdom is perfection for a faithful mouth.
translation:
  language: zh_hans
  text: 律法必不带虚假地得以成全；智慧在忠信之口中达到完满。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“智慧在忠信之口中是完满。”末句的希腊语句法十分紧缩，与格短语也可作稍有不同的理解。
    reason: alternative_reading
  - marker: b
