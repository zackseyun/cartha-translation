  yaml_path: translation/deuterocanon/sirach/034/022.yaml
  text: Bread for the needy is the life of the poor[a]; the one who deprives them of it is a man of blood.
translation:
  language: zh_hans
  text: 穷乏人的饼，是穷人的生命；剥夺这生命的人，就是有血债的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有血债的人”原文直译近于“血的人”，也可译作“杀人者”或“流人血的人”。
    reason: 说明原文惯用语的字面形式及其可能译法，同时保留血咎语言的伦理张力。
lexical_decisions:
- source_word: ἄρτος
  choice: 饼
  rationale: 保留“饼”的具体意象；在本句中，它也自然代表维持生命的基本食物。
- source_word: ἐπιδεομένων
  choice: 穷乏人的
  rationale: 该分词指缺少生活必需品、处于匮乏中的人。“穷乏人”简明而庄重，并保留属格表达。
- source_word: ζωὴ πτωχῶν
  choice: 穷人的生命
  rationale: 直译其表语结构，强调饼对穷人并非可有可无，而是维系生命之物。
- source_word: ὁ ἀποστερῶν
  choice: 剥夺……的
  rationale: ἀποστερέω可指剥夺、侵占或扣留本应归给他人的东西；“剥夺”保留其强烈的伦理意味，又不把语义限缩为某种特定法律行为。
- source_word: αὐτὴν
  choice: 这生命
  rationale: 该代词为阴性单数，在希腊文中与阴性名词ζωή（生命）一致，而不与阳性名词ἄρτος（饼）一致。因此按原文语法译为“这生命”，没有沿用英语咨询层中“剥夺他们的饼”的解释。
- source_word: ἄνθρωπος αἱμάτων
  choice: 有血债的人
  rationale: 此表达带有闪语色彩，字面近于“属血的人／血的人”。“有血债的人”在现代汉语中较易理解，也保留其血咎与杀人般严重罪责的力度，而不直接把含义限定为司法意义上的“杀人犯”。
theological_decisions:
- issue: 扣留穷人生存之物为何被称为ἄνθρωπος αἱμάτων
  choice: 有血债的人
  alternative: 杀人者；流人血的人
  rationale: 原文以血咎语言严厉谴责剥夺穷人生命所系之物的人。正文保留这种强烈等同关系，但不把含义收窄为已经实施直接杀人行为的司法断言。
- issue: αὐτὴν的指代
  choice: 这生命
  alternative: 这饼；剥夺他们的饼
  rationale: 阴性单数代词在语法上回指阴性名词ζωή，而ἄρτος为阳性。这样翻译保留原文从“维生之饼”转向“剥夺生命”的修辞力度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“饼”保留原文具体意象；“穷乏人／穷人”的轻微变化对应两个不同的希腊词。分号呈现原文前后两项之间由生存事实转入伦理判词的推进。
