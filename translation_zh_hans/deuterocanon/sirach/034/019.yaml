base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/019.yaml
  text: Until he repays a man for his deed[a], and a person's recompense according to his scheme; until he pleads the case of his people and gladdens them with his salvation.
translation:
  language: zh_hans
  text: 直到他照人所行的回报人，按人的谋算施行报偿；直到他为自己的百姓申辩，使他们因他的拯救而欢喜。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存《便西拉智训》34:19的希腊文本却作：“以不义所得献祭的人，所献的是有瑕疵的祭物；不法之人的礼物不蒙悦纳。”此处保存下来的希伯来文见证与希腊文有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: עד
  choice: 直到
  rationale: 两次出现的 עד 都表示此前状态延续到某一时点，译作“直到”保留其时间界限作用。
- source_word: ישיב לאנוש פעלו
  choice: 照人的行为报应他
  rationale: ישיב 在这里不是一般的“归还”，而是按行为施行回报；此译保留司法性报应的语境，同时用现代汉语表达。
- source_word: וגמול אדם כמזימתו
  choice: 按人的谋算给他应得的报偿
  rationale: גמול 表示回报或报偿；מזמה 可指谋划、意图，也可能带负面色彩。“谋算”保留这种潜在的道德意味，不将其弱化为中性的“计划”。
- source_word: יריב ריב עמו
  choice: 为自己的百姓申辩
  rationale: 同根结构 ריב ריב 具有法庭性的“争讼、主持案件”含义。“申辩”自然地保留了替百姓伸张其案件的司法图景。
- source_word: ושמחם
  choice: 使他们……欢喜
  rationale: 该动词为使役意义，指使人喜乐；译文明确保留这一使役关系。
- source_word: בישועתו
  choice: 因他的拯救
  rationale: ישועה 可指拯救、救助或胜利。“拯救”既适合具体解救的语境，也保留较宽广的神学内涵。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本显著不同
  choice: 正文依据现存希伯来文翻译，并以脚注完整说明希腊文异读。
  alternative: 按希腊文译为：“以不义所得献祭的人，所献的是有瑕疵的祭物；不法之人的礼物不蒙悦纳。”
  rationale: 此处有可用且置信度高的希伯来文见证，故以希伯来文为正文依据；但希腊传统的内容完全不同，属于不可忽略的重要异读，必须公开保留，不能暗中调和。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“报应”“报偿”“申辩”保留原文的司法语气；避免将“谋算”的道德色彩解释得过死。脚注标记置于整节末尾，明确适用于全节的重大文本异读。
