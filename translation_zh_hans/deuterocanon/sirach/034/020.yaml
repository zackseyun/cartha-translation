  text: The kindness of Yahweh is fitting in a time of distress[a], like a rain cloud in a time of drought.
translation:
  language: zh_hans
  text: 耶和华的恩慈在患难之时何其美好，如同干旱之时的雨云。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“至高者不喜悦不敬虔之人的供物，也不因祭物众多而赦免罪恶。”本节的希伯来文本与希腊文本差异很大。
    reason: textual_variant
lexical_decisions:
- source_word: נאה
  choice: 何其美好
  rationale: 该词表示美好、合宜、令人欣慰；这里不是抽象判断“合宜”，而是赞叹患难中临到的恩慈恰逢其时，因此译为自然而庄重的“何其美好”。
- source_word: חסד
  choice: 恩慈
  rationale: 此处指在困境中施予人的仁厚与眷顾。“恩慈”既保留善意和惠泽，也避免把语义过度限定为某一特定的圣约术语。
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译神名，明确保留希伯来文本中的专名。
- source_word: בזמן מצוקה
  choice: 在患难之时
  rationale: מצוקה表示受压、窘迫、危难的处境；“患难之时”准确、简洁，并符合智慧文学的庄重语体。
- source_word: כעב חזיזים
  choice: 如同……雨云
  rationale: עב是云，חזיזים与风暴、闪电及带来雨水的云象有关；结合下句干旱背景，重点是及时带来雨水和纾解，故译“雨云”，不强化其威胁性。
- source_word: בעת בצרת
  choice: 干旱之时
  rationale: 此处构成雨云带来纾解的农业比喻，指干燥、旱灾的时节；“干旱之时”是清楚自然的现代汉语。
theological_decisions:
- issue: 希伯来文本与希腊文本在本节存在重大差异
  choice: 正文依据现存且可信度高的希伯来文本翻译，并在脚注完整保留希腊异文。
  alternative: 至高者不喜悦不敬虔之人的供物，也不因祭物众多而赦免罪恶。
  rationale: 本节希伯来文保存完整且语意连贯，应作为正文依据；但希腊见证内容完全不同，不能静默调和或舍弃，故以脚注透明呈现另一文本传统。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“何其美好”保留原文的赞叹色彩；整句维持希伯来诗句中“患难—干旱、恩慈—雨云”的平行意象。
