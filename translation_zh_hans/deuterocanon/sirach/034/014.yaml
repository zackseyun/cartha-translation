translation:
  language: zh_hans
  text: 敬畏主的人必不惊慌，也不胆怯，因为主是他的盼望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的开罗藏经库希伯来语行作：“他必不撇下孤儿的呼求，也不撇下多多倾诉苦情的寡妇。”这与本节的希腊语内容不符，很可能是源数据中的节行错配。
    reason: textual_variant
lexical_decisions:
- source_word: ὁ φοβούμενος Κύριον
  choice: 敬畏主的人
  rationale: 希腊语带冠词的现在分词表示一类人；译为“敬畏主的人”自然、庄重，并保留代表性的单数含义。鉴于所提供的希伯来语行与本节明显不符，正文采用对应本节的希腊语见证。
- source_word: οὐ μὴ πτοηθῇ
  choice: 必不惊慌
  rationale: πτοέω可指受惊、慌乱；“必不惊慌”既表达强烈否定，也避免把意义过度扩展为一般性的“动摇”。
- source_word: οὐ μὴ δειλιάσῃ
  choice: 也不胆怯
  rationale: δειλιάω侧重因惧怕而失去勇气；“胆怯”与前句“惊慌”有区分，并保留其勇气层面的含义。
- source_word: ἐλπὶς αὐτοῦ
  choice: 他的盼望
  rationale: ἐλπίς可指盼望或信赖的根据；“盼望”直接而有神学张力，不改写为较抽象的“信心”或“倚靠”。
- source_word: αὐτός
  choice: 主
  rationale: 希腊语强调代词所指最自然是“主”。汉语若直译“他是他的盼望”容易产生指代含混，因此明确译出“主”，同时保存原句关系。
theological_decisions:
- issue: 所提供的希伯来语行与希腊语本节严重不一致
  choice: 以希腊语《七十士译本》对应《德训篇》34:14的读法作为正文
  alternative: 按所提供的希伯来语译作：“他必不撇下孤儿的呼求，也不撇下多多倾诉苦情的寡妇。”
  rationale: 所给希伯来语内容谈孤儿和寡妇的申诉，与希腊语34:14关于敬畏主之人的话在意义上完全不同，极可能是资料中的节行错配。提示也明确标注major_mismatch，并提供希腊语作为回退及核对见证。因此正文采用连贯且对应本节的希腊语读法，同时在脚注中如实保留希伯来语差异。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惊慌”与“胆怯”分别体现πτοέω的受惊慌乱和δειλιάω的失去勇气；“主是他的盼望”明确代词所指，读来顺畅。
