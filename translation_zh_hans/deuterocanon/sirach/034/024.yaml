  text: One builds and another tears down—what did they gain beyond toil?[a]
translation:
  language: zh_hans
  text: 一个人建造，另一个人拆毁；他们除了劳苦，还得了什么？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们所得的，除了劳苦还有什么？”希腊文的比较结构问的是：当一个人建造、另一个人拆毁时，他们所得的益处是否超过劳苦。
    reason: 说明πλεῖον ἢ κόπους可作‘除了……还有什么’的反问表达，并保留原文对所得益处的询问。
lexical_decisions:
- source_word: οἰκοδομῶν
  choice: 建造
  rationale: 现在分词在格言中泛指持续或典型的行动；“建造”自然、庄重，并保留具体的建筑意象。
- source_word: καθαιρῶν
  choice: 拆毁
  rationale: 该词在此指拆除、毁掉所建之物；“拆毁”与“建造”形成清楚对照，又不额外强化为暴力性的摧毁。
- source_word: τί ὠφέλησαν
  choice: 他们……得了什么
  rationale: ὠφελέω的不定过去时在反问中关注最终所得的益处；此译法符合现代汉语，也保留结果性的反问。
- source_word: πλεῖον ἢ
  choice: 除了……还
  rationale: 该比较结构询问所得是否超过劳苦本身；“除了……还”自然表达‘除此之外还有什么’的含义。
- source_word: κόπους
  choice: 劳苦
  rationale: κόπος可指辛劳、疲惫的劳动或苦楚；“劳苦”兼具劳作和辛苦之意，适合本句的格言语气。
theological_decisions:
- issue: 格言式单数主体
  choice: 一个建造，另一个拆毁
  alternative: 有人建造，有人拆毁
  rationale: 希腊文以两个阳性单数分词作泛指主体，并无明说名词；“一个……另一个……”保留个体之间的鲜明对照，同时不必增添性别信息。
- issue: 反问所表达的徒劳
  choice: 他们除了劳苦，还得了什么？
  alternative: 他们所得的，岂不只是劳苦吗？
  rationale: 原文直接询问其益处是否超过劳苦，并没有显式加入‘只是’或断言式解释；所选译文保留反问力度及原文仍具的表达张力。
- issue: 动词复数ὠφέλησαν的指向
  choice: 他们
  alternative: 人
  rationale: 复数动词可把前述两个泛指主体合并来看；译作“他们”忠实呈现语法数，并使问题落在双方共同的最终所得上。
translation_notes:
  register: 采用现代、简洁而庄重的格言体。“建造／拆毁”保持原文具体对照；“劳苦”比单纯的“劳动”更能传达κόπος所含的辛劳感。
