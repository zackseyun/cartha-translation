  naturalness: “虚空而虚假的盼望，是给无知之人的”生硬，尤其“是给……的”不适合作格言式的归属表达。改为“……所抱的盼望，既……又……”可使汉语自然，并清楚表达该人所持有的盼望具有这些性质。
  terminology: 以“不明事理的人”表达ἀσύνετος，较“无知之人”更贴近缺乏悟性、判断力的含义；“愚人”保留给ἄφρων，维持两词的区别。“空洞而虚假”对应κεναὶ καὶ ψευδεῖς；“梦境给愚人插上翅膀”保留原文未展开的比喻。
