  text: Empty and false hopes are for a senseless man[b][a], and dreams give wings to fools.
translation:
  language: zh_hans
  text: 不明事理的人所抱的盼望，既空洞又虚假；梦境给愚人插上翅膀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “给……插上翅膀”直译希腊文的比喻，描绘梦境使愚人仿佛飞起；原文没有进一步说明这一意象的具体方式。
    reason: 保留并说明原文比喻，避免正文中过度诠释。
lexical_decisions:
- source_word: κεναὶ
  choice: 虚空
  rationale: 保留“空洞、没有实质”的基本意象，并与“虚假的”自然并列。
- source_word: ψευδεῖς
  choice: 虚假的
  rationale: 直接表达“不真实”的含义，不额外解释为蓄意欺骗。
- source_word: ἐλπίδες
  choice: 盼望
  rationale: 对应通常意义的“希望、盼望”；在智慧文学语境中庄重而易懂。
- source_word: ἀσυνέτῳ ἀνδρί
  choice: 无知之人
  rationale: ἀσύνετος着重缺乏理解力或判断力；“无知之人”保留这一侧重，并以现代汉语自然表达格言中的泛指人物。
- source_word: ἐνύπνια
  choice: 梦境
  rationale: 表达睡梦及梦中所见，比单用“梦”更明确，但不扩展为特殊启示。
- source_word: ἀναπτεροῦσιν
  choice: 给……插上翅膀
  rationale: 保留原文使之生翼、飞起的鲜明比喻，不将其解释性改写为“使人飘飘然”或“把人带走”。
- source_word: ἄφρονας
  choice: 愚人
  rationale: 这是智慧文学中指缺乏健全判断者的常用词；“愚人”简洁，并与前句“无知之人”维持词义区别。
theological_decisions:
- issue: 梦境的作用及“插上翅膀”这一比喻的方向
  choice: 保留“梦境给愚人插上翅膀”
  alternative: 梦境使愚人飘飘然／把愚人带走
  rationale: 原文只呈现使之生翼的意象，具体是抬举、激发还是带离现实具有一定开放性；直译可避免将负面机制解释得过窄。
- issue: 格言中阳性单数ἀνδρί的表达
  choice: 无知之人
  alternative: 无知的男人
  rationale: 此处是泛指性的智慧格言；现代汉语“人”自然涵盖代表性个体，同时没有为原文加入性别上的神学主张。
translation_notes:
  register: 采用现代、庄重而通俗的智慧文学格言体。两句保持平行结构，并用分号体现紧密对照。正文保留生翼的具体意象；脚注只说明其直译性质和语义开放性。
