- from: 虚空而虚假的盼望，是给无知之人的；梦境给愚人插上翅膀。[a]
  to: 不明事理的人所抱的盼望，既空洞又虚假；梦境给愚人插上翅膀。[a]
  rationale: 修订第一句的语序和用词，使其成为自然的现代汉语格言，同时准确传达原文中“空洞、虚假”的盼望乃不明事理之人所抱有。第二句及脚注保留，以维持原文“使人生翼”的开放比喻，避免指定其心理或神学机制。
