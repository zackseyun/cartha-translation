  yaml_path: translation/deuterocanon/sirach/034/002.yaml
  text: Like one grasping at a shadow and chasing the wind[a], so is one who clings to dreams.
translation:
  language: zh_hans
  text: 好像伸手抓影子、追赶风的人，依凭梦境的人[a]也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“执着于梦境的人”或“留意梦境的人”。希腊语动词可表示持守、依赖，也可表示留意。
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: 伸手抓
  rationale: 该分词表示用手抓取或试图抓住；“伸手抓”自然地呈现抓取影子这一徒劳的动作。
- source_word: σκιᾶς
  choice: 影子
  rationale: 此处指无法真正抓住的影像；“影子”比“荫凉”更符合比喻所强调的虚幻和不可捉摸。
- source_word: διώκων ἄνεμον
  choice: 追赶风
  rationale: 保留原文关于徒劳追逐的具体意象，同时符合现代汉语表达。
- source_word: ὁ ἐπέχων
  choice: 依凭……的人
  rationale: ἐπέχω在此可表示持守、倚赖或留意；结合抓影追风的反面比喻，“依凭”表达把梦境当作依据，却不排除其他词义，故以脚注说明。
- source_word: ἐνυπνίοις
  choice: 梦境
  rationale: 该复数名词指人在睡眠中所见的梦或梦中异象；“梦境”简洁自然，也比单说“梦”更能涵盖梦中所见。
theological_decisions:
- issue: ὁ ἐπέχων ἐνυπνίοις的解释力度
  choice: 依凭梦境的人
  alternative: 执着于梦境的人；留意梦境的人
  rationale: 上下文的比喻明显指出这种行为徒劳，但动词本身可涵盖依赖、持守或留意。正文采用符合比喻语气的“依凭”，同时用脚注保留原词的语义幅度，避免把经文扩大为对一切梦境的系统性教义判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“伸手抓影子、追赶风”保留两个并列的徒劳意象；“也是如此”对应原文的比较结构。
