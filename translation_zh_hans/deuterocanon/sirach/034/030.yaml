  yaml_path: translation/deuterocanon/sirach/034/030.yaml
  text: Drunkenness multiplies the anger of a foolish man into stumbling[a], diminishing strength and producing wounds.
translation:
  language: zh_hans
  text: 醉酒使愚昧人的怒气大增，以致失足[a]；它削弱力量，又造成创伤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “失足”也可译作“绊跌”或“走向败落”；原词可指绊脚之物、跌倒的缘由或由此而来的败落。
    reason: 保留πρόσκομμα在具体绊跌与引申败落之间的词义幅度。
lexical_decisions:
- source_word: μέθη
  choice: 醉酒
  rationale: 指饮酒后醉酒的状态；“醉酒”简明自然，也符合智慧文学的劝诫语体。
- source_word: πληθύνει
  choice: 使……大增
  rationale: 保留其使某物增多、加剧的使动含义；与“怒气”搭配时，“大增”比直译为“倍增”更符合现代汉语。
- source_word: θυμὸν
  choice: 怒气
  rationale: 本句语境涉及醉酒后被激发的激烈情绪，“怒气”准确保留其愤怒、暴烈之意。
- source_word: ἄφρονος
  choice: 愚昧人
  rationale: 希腊文为阳性单数的智慧文学典型人物；汉语“愚昧人”保留单数人物类型，且比“愚昧男子”自然庄重。
- source_word: εἰς πρόσκομμα
  choice: 以致失足
  rationale: εἰς表达结果趋向，πρόσκομμα带有绊跌、跌倒或败落的意象；“失足”可兼具实际绊跌与走向败落的含义。
- source_word: ἐλαττῶν ἰσχὺν
  choice: 削弱力量
  rationale: 分词短语说明醉酒持续造成的结果；“削弱力量”自然保留减少体力或能力的宽泛含义。
- source_word: προσποιοῦν τραύματα
  choice: 造成创伤
  rationale: 表达醉酒另行带来的伤害结果；“创伤”保留τραύματα具体伤口或伤害的含义。
theological_decisions:
- issue: 智慧文学中阳性单数的代表性人物
  choice: 译作“愚昧人”
  alternative: 译作“愚昧男子”或“愚人”
  rationale: 原文为阳性单数，但现代汉语通常不靠“男子”标示此类代表性人物；“愚昧人”既不改为复数或抽象概念，也避免生硬添加原文未强调的生理性别。
- issue: 醉酒、怒气与失足之间的句法关系
  choice: 译作“醉酒使愚昧人的怒气大增，以致失足”
  alternative: 译作“愚昧人的怒气成为绊脚石”
  rationale: 将πληθύνει理解为以μέθη作主语、θυμὸν作宾语，并把εἰς πρόσκομμα作为结果；同时用脚注保留πρόσκομμα可指绊脚石或败落契机的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。主句保持紧凑，后半句以“它”明确承接“醉酒”，避免汉语中分词结构造成主语含混；分号呈现原句前后两组危害的并列推进。
