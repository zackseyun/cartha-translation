  text: He who offers a sacrifice from the goods of the poor is like one who slaughters a son before his father[a].
translation:
  language: zh_hans
  text: 用穷人的财物来献祭，就像当着父亲的面宰杀他的儿子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 更直译可作：“在父亲面前宰杀儿子的，就是用穷人的财物来献祭的人。”希腊文采用压缩的格言式比较。
    reason: 说明原文的压缩句法及较直译表达。
lexical_decisions:
- source_word: θύων
  choice: 就像……宰杀
  rationale: 该分词可指献祭或宰杀；此处用“宰杀”保留格言中令人震惊的暴力意象，并用“就像”明确希腊文中压缩的比较关系。
- source_word: υἱὸν
  choice: 儿子
  rationale: 准确对应阳性名词“儿子”，不泛化为“孩子”；所有关系由后面的“他的父亲”自然体现。
- source_word: ἔναντι
  choice: 在……面前
  rationale: 表达当面、在场之意，现代汉语自然清楚。
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: 他的父亲
  rationale: 代词最自然地回指儿子；中文保留这一理解，同时不增添原文未明说的其他关系。
- source_word: ὁ προσάγων θυσίαν
  choice: 拿……献祭
  rationale: “献祭”保留礼仪语境；“拿……献祭”自然表达祭物来源。
- source_word: ἐκ χρημάτων πενήτων
  choice: 穷人的财物
  rationale: χρήματα可泛指钱财、产业或财物，“财物”比“钱”范围更合适；πενήτων为复数类称，可自然译作“穷人的”。
theological_decisions:
- issue: 以不义所得献祭与杀子暴行之间的比较力度
  choice: 将压缩句法明译为“拿穷人的财物献祭，就像……宰杀”。
  alternative: 较直译地说：“在父亲面前宰杀儿子的，就是拿穷人财物献祭的人。”
  rationale: 希腊文是压缩的格言式比较。加入“就像”没有消解其张力，而是使现代汉语读者清楚看见：以剥夺穷人所得进行敬拜，被比作当着父亲的面杀死其儿子。
translation_notes:
  register: 采用庄重而通俗的现代标准汉语。“宰杀”刻意保留原文强烈、刺耳的暴力意象；正文补出“就像”以符合汉语比较句习惯。
