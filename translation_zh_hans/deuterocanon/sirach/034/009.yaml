  text: A man who has traveled[b] knows many things, and one with much experience will recount understanding.[a]
translation:
  language: zh_hans
  text: 受过教导的人[b]知道许多事；阅历丰富的人会把自己的见识讲述出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希伯来文本在本节与希腊文本有重大差异，大意是：“你无论做什么，都要面带喜色；要欢欢喜喜地献上圣物的十分之一。”这句话与《便西拉智训》34:9的上下文不符，因此正文采用希腊文本。
    reason: textual_variant
  - marker: b
    text: 或译：“游历过的人。”希腊词通常指受过教育或训练的人；但本段上下文侧重游历和阅历。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ πεπαιδευμένος
  choice: 游历过的人
  rationale: 现存希腊文本直译可指“受过教导的人”，但本段上下文及与“阅历丰富”相呼应的下句支持由游历而增长见识的理解；用“人”自然表达箴言中的泛指。
- source_word: ἔγνω πολλά
  choice: 见多识广
  rationale: 原意为“知道了许多”；此成语在现代汉语中自然凝练，并能配合游历所得的广博见识。
- source_word: ὁ πολυπειρῶν
  choice: 阅历丰富的人
  rationale: 准确表达经历多、经验广的含义，措辞自然庄重。
- source_word: ἐκδιηγήσεται
  choice: 能讲述
  rationale: 表达把所知所悟陈述出来的能力；汉语箴言体用“能”比机械翻作将来时更自然。
- source_word: σύνεσιν
  choice: 其中的见识
  rationale: σύνεσις可指理解、洞见或明达；“见识”承接游历与阅历，并保留智慧文学语境。“其中的”是为使汉语关系清楚而作的轻度补足。
theological_decisions:
- issue: 所提供的希伯来文本与《便西拉智训》34:9的希腊平行文本及上下文明显不符
  choice: 正文以希腊平行文本为本，并在脚注中完整说明希伯来异文的大意
  alternative: 按所提供的希伯来文本译为：“你无论做什么，都要面带喜色；要欢欢喜喜地献上圣物的十分之一。”
  rationale: 该希伯来句在内容上与本节上下文脱节，而希腊文本与本段论游历和阅历的脉络吻合。采用希腊文本可维持本节连贯性，同时借脚注如实保留主要文本差异，不把不确定性隐藏起来。
- issue: πεπαιδευμένος的语义
  choice: 游历过的人
  alternative: 受过教导（或训练）的人
  rationale: 该词通常可指受教育或受训练，但本段语境强调游历与经验，且下句πολυπειρῶν强化阅历之意；正文采用语境义，脚注保留较直接的词义。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“见多识广”与“阅历丰富”形成平衡句式，便于普通读者理解。正文脚注标记均已对应出现。
