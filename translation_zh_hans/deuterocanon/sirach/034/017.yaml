base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/017.yaml
  text: The cry of the poor passes through the cloud[a], and until it reaches him it does not rest. It does not cease until God attends[b], and the righteous Judge executes judgment.
translation:
  language: zh_hans
  text: 穷人的呼求穿过云层；在到达上帝面前以前，绝不止息。它不会停下，直到上帝垂顾，公义的审判者施行审判[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“主持公道。”希伯来文习语直译为“施行审判”。
    reason: lexical_alternative
  - marker: b
    text: 斯威特本的希腊文平行经文与此处有重大差异，开头作：“主的眼目看顾爱他的人……”；现存希伯来文则如正文所译。因此，本节在源文本层面存在不确定性。
    reason: textual_variant
lexical_decisions:
- source_word: שועת
  choice: 呼求
  rationale: 此词指人在困苦中发出的求助呼声；“呼求”既保留迫切感，也自然适合现代汉语。
- source_word: דל
  choice: 穷人
  rationale: דל可指贫穷、卑微或处于弱势的人；本处社会伦理语境以“穷人”最直接，同时仍含脆弱无助之意。
- source_word: ענן חלפה
  choice: 穿过云层
  rationale: 保留呼求越过云层、上达于上帝的鲜明空间意象；“穿过”也准确表达חלף在此处的运动意义。
- source_word: ועד תגיע לא תנוח
  choice: 在到达上帝面前以前，绝不止息
  rationale: 阴性动词回指“呼求”。希伯来文未明说到达的对象，结合下句所指为上帝；译作“到达上帝面前”使汉语清楚，又不过度具体化。
- source_word: לא תמוש
  choice: 它不会停下
  rationale: מוש本可表示离开或移去；在持续呼求的语境中，“不会停下”自然表达其坚持不息。
- source_word: יפקוד אל
  choice: 直到上帝垂顾
  rationale: פקד语义包括察看、眷顾、理会或介入。“垂顾”表达上帝留意并作出回应，同时不预先限定回应的具体方式。
- source_word: ושופט צדק
  choice: 公义的审判者
  rationale: 可理解为以公义为特征的审判者；此译法自然，并保留对上帝审判品格的描述。
- source_word: יעשה משפט
  choice: 施行审判
  rationale: 希伯来习语直译为“行审判”，也可理解为“主持公道”。“施行审判”保留与“审判者”相呼应的司法语域。
theological_decisions:
- issue: “直到到达”所隐含的神圣对象
  choice: 译为“在到达上帝面前以前”
  alternative: 保留无宾语形式：“在到达以前”
  rationale: 希伯来文省略到达的对象，但下一分句明确提到上帝。汉语补明“上帝面前”有助理解，同时没有增加新的神学主张。
- issue: משפט的译法
  choice: 正文采用“施行审判”
  alternative: “主持公道”或“施行公义”
  rationale: 经文描绘上帝作为审判者回应穷人的呼求。“施行审判”保留司法意象；“主持公道”这一可行理解列入脚注，以保存原文语义张力。
- issue: 希伯来文本与希腊平行文本的重大差异
  choice: 以现存希伯来文为正文依据，并注明文本不确定性
  alternative: 采用希腊文“主的眼目看顾爱他的人……”的内容
  rationale: 所给原文证据指定高可信度的卡哈纳希伯来合成文本，但同时标注重大不一致。正文依希伯来文翻译，脚注如实保留源文本层面的差异，不尝试调和。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“呼求”“垂顾”“施行审判”保留经文的诗性与司法意象，但避免生僻古奥。两个相近的持续性分句分别译作“绝不止息”和“不会停下”，既呈现希伯来文的强调，也避免机械重复。
