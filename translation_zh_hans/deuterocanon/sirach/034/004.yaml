  text: From the unclean[a], what will be made clean? And from falsehood, what will become true?
translation:
  language: zh_hans
  text: 从不洁之物中，什么会被洁净呢？从虚假中，什么会显为真实呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从谎言中，什么会显为真实呢？”这里的希腊语动词也可表示“说真话”或“证实为真”；正文依照它与前句“被洁净”的平行关系，译作“显为真实”。
    reason: 保留ἀληθεύσει可指真实、显明为真或说真话的词义空间，同时避免“成为真实的”所增加的变化过程含义。
lexical_decisions:
- source_word: ἀπὸ
  choice: 从……中
  rationale: 两处均表示来源或出处；“从……中”自然地保留了希腊文的来源关系。
- source_word: ἀκαθάρτου
  choice: 不洁之物
  rationale: 该单数属格形容词作名词使用，泛指不洁净的事物；“不洁之物”既不限定具体对象，也适合箴言式表达。
- source_word: τί
  choice: 什么
  rationale: 两处均为中性疑问代词，引出反问，询问由某种来源能够产生什么结果。
- source_word: καθαρισθήσεται
  choice: 会被洁净
  rationale: 保留 καθαρίζω 将来时被动语态的明确被动含义，同时避免把语境过度限定为礼仪洁净。
- source_word: ψευδοῦς
  choice: 虚假
  rationale: 该形容词作名词使用，可泛指虚假或谬妄；“虚假”比“一个谎言”范围更宽，也与前句的抽象概括相称。
- source_word: ἀληθεύσει
  choice: 会成为真实的
  rationale: 此处与前句构成平行反问，结果义最能表达“由虚假能产生何种真实之物”；但该动词也可表示“说真话”或“证实为真”，故以脚注保留歧义。
theological_decisions:
- issue: 箴言式平行结构中 ἀληθεύσει 的含义
  choice: 结果义：“会成为真实的”
  alternative: 言语行为义：“会说真话”；验证义：“会证实为真”
  rationale: 两句都追问从不洁或虚假的来源能否出现相反性质的结果。结果义最清楚地保留这种平行关系，但原词的其他可能含义不应被抹去，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两句保持对称的反问句式；“不洁之物”与“虚假”保留概括性，不把经文限定为礼仪、道德或单一言语行为。
