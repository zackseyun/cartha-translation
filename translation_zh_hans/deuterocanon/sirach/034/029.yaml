  text: Wine drunk in excess is bitterness of soul[a], in provocation and downfall.
translation:
  language: zh_hans
  text: 酒喝得过量，是心灵的苦涩[a]，带来烦躁和跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“酒喝得过量，是心灵的苦楚，伴随着激愤和绊跌。”末尾两个名词含义凝练，也可理解为刺激、恼怒，以及跌倒、败落。
    reason: lexical_alternative
lexical_decisions:
- source_word: πικρία
  choice: 苦涩
  rationale: 保留“苦”的比喻力量，也可涵盖内在痛苦或苦楚，不限定为怨恨。
- source_word: ψυχῆς
  choice: 心灵
  rationale: 在现代汉语中自然表达人的内在生命与感受，同时保留原文的人论色彩。
- source_word: οἶνος
  choice: 酒
  rationale: 原文明确指酒，不泛化为一切酒精饮料。
- source_word: πινόμενος πολὺς
  choice: 喝得过量
  rationale: 自然表达大量饮酒，并凸显警戒所针对的是过量饮用，而非酒本身。
- source_word: ἐν ἐρεθισμῷ
  choice: 引起烦躁
  rationale: ἐρεθισμός可指刺激、恼怒或激愤；“烦躁”较自然，又不把含义收窄为单纯愤怒。
- source_word: ἀντιπτώματι
  choice: 跌倒
  rationale: 保留该词“绊跌、倒下”的具体意象，也容许读者理解其败落或受损的引申义。
