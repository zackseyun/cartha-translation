  naturalness: “要从自身推知邻舍的处境；凡事都要仔细思量。”是自然、庄重的现代汉语。“从自身”明确表达 ἐκ σεαυτοῦ 的类比起点，“推知”与“仔细思量”保留两项命令的审慎语气。
  terminology: “邻舍”适合本书智慧文学及圣经语体。脚注保留希伯来异文的重大分歧；对 מרודיה 不在正文式地裁定，维持“毁坏者／叛逆者”的歧义。
