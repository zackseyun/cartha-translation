  text: Judge your neighbor's feelings by your own, and think carefully about every matter.[a]
translation:
  language: zh_hans
  text: 要从自身推知邻舍的处境；凡事都要仔细思量。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来见证（开罗藏经库抄本／Kahana 校本）在这里显著不同：“泪水岂不从脸颊流下，并为她的毁坏者／叛逆者叹息吗？”本节的文本传承并不确定，因此正文采用希腊平行文本。
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: 推知
  rationale: 希腊文命令式要求人以反思和类比来理解；与“由自己”连用时，“推知”自然地表达从自身经验理解他人。
- source_word: τὰ τοῦ πλησίον
  choice: 邻舍的感受
  rationale: 字面为“邻舍的事/与邻舍有关的情况”。“感受”略具解释性，但在“由自己推知”的伦理语境中清楚表达设身处地理解邻人的意思。
- source_word: ἐκ σεαυτοῦ
  choice: 由自己
  rationale: 保留“从你自己出发”的类比基础，简洁而不额外限定为某一种经验。
- source_word: ἐπὶ παντὶ πράγματι
  choice: 凡事
  rationale: 概括“一切事情/每一件事”，符合现代汉语智慧文学的简洁表达。
- source_word: διανοοῦ
  choice: 仔细思量
  rationale: 表达持续、审慎思考的命令语气，兼顾庄重与通俗。
- source_word: דמעה ... תרד
  choice: 泪水……流下
  rationale: 脚注中的希伯来异文保留“泪水在脸颊上流下”的鲜明意象。
- source_word: מרודיה
  choice: 毁坏她的人／背叛她的人
  rationale: 该词形和所指存在歧义，可能与毁坏或反叛有关；并列保留两种可能，不强行消解。
theological_decisions:
- issue: 现存希伯来见证与希腊平行文本显著分歧
  choice: 正文采用希腊文本所呈现的智慧劝诫，脚注完整保留希伯来异文
  alternative: 正文译作：“泪水岂不从脸颊流下，并因毁坏她的人／背叛她的人而叹息吗？”
  rationale: 所给希伯来文本虽置信度高，却被资料明确标为与本节传统严重不符；希腊文本语义完整，并与《便西拉智训》的劝诫语境协调。由于两者无法直接调和，正文采用希腊见证，同时以脚注诚实呈现重要的希伯来异文及其歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“邻舍”保留智慧文学和圣经语体色彩；“推知”“仔细思量”准确表达两项思考命令。脚注明示文本传统的不确定性，并保留希伯来词义张力。
