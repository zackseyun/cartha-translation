  text: A man who has not been tested knows little, but one who has wandered[b] increases cunning[c][a].
translation:
  language: zh_hans
  text: 未经考验的人所知甚少；但漂泊过的人[b]更添狡黠[c]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存并在此提供的希伯来文句子与本节希腊文内容不符；本译文因此采用希腊文见证。
    reason: textual_variant
  - marker: b
    text: “漂泊过的人”也可译作“走迷的人”或“受迷惑的人”。希腊词既可指实际的漂泊，也可指偏离正途。
    reason: alternative_reading
  - marker: c
    text: “狡黠”也可译作“诡诈”或“精明”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς οὐκ ἐπειράθη
  choice: 未经试炼的人
  rationale: 鉴于所提供的希伯来文与本节严重不符，此处依据希腊文。ἐπειράθη 可指受试验，也可含经由经历而得到磨炼之意；“未经试炼”保留这两方面的联系。
- source_word: ὀλίγα οἶδεν
  choice: 所知甚少
  rationale: 自然、凝练地表达其知识或见识有限。
- source_word: ὁ δὲ πεπλανημένος
  choice: 漂泊过的人
  rationale: πλανάω 的完成时被动分词可指漂泊、走迷或受误导；“漂泊过”在本智慧语境中保留游历所得经验的可能，也不完全消除偏离正途的意味。
- source_word: πληθυνεῖ
  choice: 增添
  rationale: 表达增加、使之增多；与后面的抽象名词搭配自然。
- source_word: πανουργίαν
  choice: 机智
  rationale: πανουργία 可指机敏、精明，也常带狡猾的负面色彩。“机智”适合智慧文学语境，但以脚注保留“狡黠”等可能。
theological_decisions:
- issue: 希伯来文与希腊文本节内容严重不符
  choice: 本节据希腊文平行见证翻译，并在脚注中公开说明
  alternative: 按所提供的希伯来文“照他给你的礼物给他……”翻译
  rationale: 所提供的希伯来文并不对应《便西拉智训》34:10，而希腊文内容与本节传统定位相符。为避免把错置的希伯来文强行当作本节，采用希腊见证，并明确记录文本问题。
- issue: πεπλανημένος 的语义倾向
  choice: 译作“漂泊过的人”，保留中性游历与负面迷失之间的张力
  alternative: 译作“走迷的人”或“受迷惑的人”
  rationale: 上下文可能强调经历带来的见识，但该词本身也可表示偏离或受误导，不宜在正文中完全正面化或道德化。
- issue: πανουργία 的褒贬色彩
  choice: 正文译“机智”，脚注列出“狡黠、精明”
  alternative: 正文直接译“狡猾”
  rationale: 该词常有负面意味，但在经验与知识的智慧格言中也可能偏向实用的精明；正文与脚注共同保存其张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“所知甚少”保持智慧格言的凝练；脚注标记依其所解释的词就近排列，文本见证说明置于句末。
