  text: One is praying and one is cursing—whose voice will the Master listen to?
translation:
  language: zh_hans
  text: 一个人祈祷，另一个人诅咒——主宰会垂听谁的声音呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς ... καὶ εἷς
  choice: 一个人……另一个人
  rationale: 准确表达两个彼此对照的人，比机械重复“一个……一个……”更符合现代汉语。
- source_word: εὐχόμενος
  choice: 祈祷
  rationale: 在与“诅咒”对举的语境中，表示向神祈求。
- source_word: καταρώμενος
  choice: 诅咒
  rationale: 保留该分词明确的咒诅含义及与祈祷之间的张力。
- source_word: τίνος φωνῆς
  choice: 谁的声音
  rationale: τίνος是属格疑问代词，直指声音所属的人；不改写为较模糊的“哪一个声音”。
- source_word: εἰσακούσεται
  choice: 会垂听
  rationale: 该词不只是听见，也常含听取、应允之意；“垂听”适合向神祈求的庄重语域，同时未明确断言必然应允。
- source_word: ὁ δεσπότης
  choice: 主宰
  rationale: 保留δεσπότης所含的主权与权柄意味，并避免未经文本依据将其替换为特定圣名。
theological_decisions:
- issue: 主宰将垂听祈祷者还是诅咒者
  choice: 保留反问：“主宰会垂听谁的声音呢？”
  alternative: 明确说主宰只垂听祈祷者
  rationale: 希腊文本提出问题而不在本节内明说答案；译文不替作者消解这种伦理与神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。破折号保留原句前后两部分之间的强烈转折与反问力度。
