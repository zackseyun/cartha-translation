revisions:
- from: 除非它是在察访中从至高者那里差来的[b]，否则不要把你的心交给这些事[a]。
  to: 若不是由至高者在察访之时差来的，不可把你的心交给这些事[a][b]。
  rationale: 修订使条件句与被动“差来”的关系更符合现代标准汉语，并将ἐν ἐπισκοπῇ暂译为“在察访之时”。该译法表达神圣察访／临到的可行含义，但不将其限定为审判、眷顾或监督；脚注保留原文的语义开放性。
