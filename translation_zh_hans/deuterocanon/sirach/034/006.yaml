  text: Unless it is sent from the Most High in visitation[b][a], do not give your heart to them.
translation:
  language: zh_hans
  text: 若不是由至高者在察访之时差来的，不可把你的心交给这些事[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些事”指上下文所说的梦和类似经历；也可译作“它们”。
    reason: lexical_alternative
  - marker: b
    text: “在察访之时”也可理解为“在神的鉴察或看顾中”或“为要查验”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: 除非……否则
  rationale: 表达否定条件，既符合现代汉语习惯，也保留警告的力度。
- source_word: παρὰ Ὑψίστου
  choice: 从至高者那里
  rationale: παρά加属格在此表示来源；“至高者”保留这一神圣称号。
- source_word: ἀποσταλῇ
  choice: 差来的
  rationale: 体现不定过去时被动虚拟语气在条件句中的意义；汉语用“差来的”自然表达被差遣而来的含义。
- source_word: ἐν ἐπισκοπῇ
  choice: 在察访中
  rationale: ἐπισκοπή可指察访、鉴察、监督或临到；“察访”保留神圣介入与鉴察之间的语义开放性。
- source_word: μὴ δῷς
  choice: 不要……交给
  rationale: 保留原文“给、交出”的命令式比喻，不将其窄化为单纯的留意或相信。
- source_word: εἰς αὐτὰ
  choice: 给这些事
  rationale: 中性复数代词回指上下文中的梦及类似经历；“这些事”比汉语复数代词更清楚，同时脚注说明其所指。
- source_word: τὴν καρδίαν σου
  choice: 你的心
  rationale: 保留圣经中“心”所表达的内在信靠、关注与委身，不简化为“思想”或“注意力”。
theological_decisions:
- issue: ἐν ἐπισκοπῇ的含义
  choice: 译作“在察访中”，不具体限定为审判、眷顾或监督
  alternative: 在鉴察中；在察访的时候；为要查验
  rationale: 原词语义宽广，可能涉及上帝的察访、鉴察或介入。正文保留这种神学张力，脚注列出其他理解。
- issue: 条件句中隐含主语的所指
  choice: 用“它”承接上下文所说的梦
  alternative: 省略主语；明确译为“这梦”
  rationale: ἀποσταλῇ为单数，按上下文最自然地指某个梦；采用“它”既使汉语完整，又避免把正文解释得过死。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至高者”“把你的心交给”保留经文的神圣称号和心灵比喻；“察访”虽略带经文语体，却能较好保存原文ἐπισκοπή的多义性。
