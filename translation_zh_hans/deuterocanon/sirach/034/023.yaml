  yaml_path: translation/deuterocanon/sirach/034/023.yaml
  text: Whoever takes away a neighbor’s livelihood is murdering him[b][a], and whoever withholds a hired worker’s wages is shedding blood.
translation:
  language: zh_hans
  text: 夺去邻舍生计的，就是杀害邻舍；扣留雇工的工资的，就是流人的血。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直接把夺去邻舍生计称为“杀害邻舍”，把扣留雇工工资称为“流人的血”，并非只说这些行为“如同”杀人。
    reason: alternative_reading
lexical_decisions:
- source_word: φονεύων τὸν πλησίον
  choice: 杀害邻舍
  rationale: φονεύω指非法或应受谴责的杀害；这里与后半句构成警句式并列，直译其强烈的道德判断，不弱化为“如同杀人”。
- source_word: ὁ ἀφαιρούμενος συμβίωσιν
  choice: 夺走邻舍生计的
  rationale: ἀφαιρέω意为夺走、剥夺；συμβίωσις在此指赖以生活的资源或生活来源。“生计”自然、简明，并与克扣工资的语境呼应。希腊语未在此短语内再次明说“邻舍”，中文为明确受害对象而承接前句补出。
- source_word: ἐκχέων αἷμα
  choice: 流人的血
  rationale: 保留圣经中“流血”表示杀人及血债的惯用表达；补出“人的”使现代汉语句法自然，而不改变其道德力度。
- source_word: ὁ ἀποστερῶν
  choice: 克扣
  rationale: ἀποστερέω可指剥夺、欺诈或扣留；与工资搭配时，“克扣”准确表达不正当地扣住应付报酬。
- source_word: μισθὸν μισθωτοῦ
  choice: 雇工工资
  rationale: μισθός是工资、报酬，μισθωτός是受雇劳动者。“雇工工资”简洁地保留其社会经济背景。
theological_decisions:
- issue: 剥夺生计与杀人的直接道德等同
  choice: 译作“就是杀害邻舍……就是流人的血”
  alternative: 译作“如同杀害邻舍……如同流人的血”
  rationale: 希腊文以两个现在分词结构直接并列，没有表示比拟的词。直陈式表达保留原文刻意造成的伦理冲击与张力，不把它软化为一般类比。
translation_notes:
  register: 采用现代、庄重而易懂的警句体。“生计”“克扣工资”贴近日常语言；两个“就是”保持希腊文平行结构和直接的伦理力度。
