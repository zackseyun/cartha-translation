base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/028.yaml
  text: Wine drunk at the proper time and in moderation is gladness of heart and joy of soul[a].
translation:
  language: zh_hans
  text: 酒若在合宜的时候适量饮用，就是心中的欢欣，灵魂的喜乐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “适量”也可译作“足量”或“够用”。希腊词更直译为“足够、适足”；在这里很可能是指饮用有度，不过量。
    reason: 说明αὐτάρκης的词义范围，并保留较直译的另一种理解。
lexical_decisions:
- source_word: ἀγαλλίαμα
  choice: 欢欣
  rationale: 表示欢腾、欣喜；“欢欣”自然庄重，并与下句“喜乐”形成诗意平行。
- source_word: καρδίας
  choice: 心中的
  rationale: 保留属格所表达的内在感受，同时符合现代汉语习惯。
- source_word: εὐφροσύνη
  choice: 喜乐
  rationale: 表示愉悦、欢庆之乐；“喜乐”兼具庄重感和可读性。
- source_word: ψυχῆς
  choice: 灵魂的
  rationale: ψυχή在此指人的内在生命；译作“灵魂”保留与“心”相对的诗性结构及原文的人论深度。
- source_word: οἶνος
  choice: 酒
  rationale: 直接对应原文，现代汉语中自然明确。
- source_word: πινόμενος
  choice: 饮用
  rationale: 以条件结构“若……饮用”自然表达修饰酒的被动现在分词，不引入额外意义。
- source_word: ἐν καιρῷ
  choice: 在合宜的时候
  rationale: καιρός指适当、相宜的时机，不只是一般的时间。
- source_word: αὐτάρκης
  choice: 适量
  rationale: 该形容词本义涉及足够、适足；在饮酒语境中可表达不过量的适足分量，但这一语境解释需以脚注保留其较直译的可能。
theological_decisions:
- issue: αὐτάρκης用于饮酒时的伦理含义
  choice: 译为“适量”，表达合宜而不过度的饮用
  alternative: 译为“足量”或“够用”，较直接保留“足够、适足”的词义
  rationale: 原句把合宜的时机与αὐτάρκης并列；“适量”较自然地传达智慧训诲中的分寸感，同时脚注保留原词“足够、适足”的真实歧义，避免把解释伪装成唯一词义。
translation_notes:
  register: 采用现代、自然而庄重的智慧文学语体。“心中的欢欣，灵魂的喜乐”保留原文紧凑的平行结构；条件句使希腊分词结构在汉语中清晰流畅。
