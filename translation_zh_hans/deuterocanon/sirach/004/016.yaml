  text: If he trusts her, he will inherit her, and his descendants will possess her.[a]
translation:
  language: zh_hans
  text: 因为我要以陌生人的身分与他同行；起初，我要用种种试炼考验他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文作：“他若信赖她，就必承受她为产业；他的后代也必拥有她。”此读法与这里的希伯来文差异显著。希伯来文的内容更接近智慧考验门徒的上下文，也可能反映古抄本传统或节次划分上的差异。
    reason: alternative_reading
lexical_decisions:
- source_word: בְהִתְנַכֵּר
  choice: 佯装陌生人
  rationale: 此处为反身形式，表示把自己装成陌生人或以疏离、难以辨认的方式出现。“佯装陌生人”既保留具体意象，也符合智慧以第一人称说话的语境。
- source_word: אֵלֵךְ עִמּוֹ
  choice: 我要……与他同行
  rationale: 保留第一人称主语和“同行”的基本意象；说话者按上下文是人格化的智慧。
- source_word: וּלְפָנִים
  choice: 起初
  rationale: 该词在此表示先前阶段或一开始，译作“起初”自然简洁，同时不额外规定考验持续多久。
- source_word: אֶבְחָרֶנּוּ בְנִסְיוֹנוֹת
  choice: 要用种种考验试炼他
  rationale: 字面动词通常有“选择”之义，但与“考验”连用时语义较难，可能表达借考验察验、甄别此人。正文采用符合语境的“试炼”，不把它解释成最终拣选。
- source_word: כִּי
  choice: 因为
  rationale: 保留此句与前文之间的解释或说明关系。
theological_decisions:
- issue: 现存希伯来文与希腊文在本节内容上显著不同
  choice: 正文依照所提供的希伯来文，译为智慧佯装陌生并试炼门徒；脚注列出希腊文异读
  alternative: 依希腊文译为“他若信赖她，就必承受她为产业；他的后代也必拥有她”
  rationale: 翻译应首先依据所给原文证据。虽然希伯来文本可能与通行节次错位，且措辞存在困难，但其内容完整可译，不应因希腊文较顺畅而在正文中无声替换；重要异读则在脚注中如实保存。
- issue: אֶבְחָרֶנּוּ 的“选择”与“试验”张力
  choice: 正文按搭配和上下文译作“试炼他”
  alternative: 较直译地译作“在考验中选择他”或“借着考验甄选他”
  rationale: “在考验中选择他”在现代汉语中容易被理解为预先认定结果；“试炼他”更自然地表达智慧先察验门徒的语境，同时脚注所述文本差异提醒读者此处并非毫无疑难。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“佯装陌生人”保留希伯来文的具体形象；“种种考验”自然表达复数形式。正文不依据希腊文改换内容，而以脚注透明呈现异读。
