  text: For wisdom is made known in speech[a], and understanding in the response of the tongue.
translation:
  language: zh_hans
  text: 因为智慧在言谈中显明[a]，悟性在舌头的应答中显明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本第二分句作：“教诲在舌头的话语中显明。”希伯来文本作：“悟性在舌头的应答中显明。”
    reason: alternative_reading
lexical_decisions:
- source_word: בְאֹמֶר
  choice: 从言谈中
  rationale: 该词指话语或说话；“从言谈中”在现代汉语中自然，也表达智慧借人的言语而被识别。
- source_word: נוֹדַעַת
  choice: 显明
  rationale: 该动词为ידע的尼法勒式，具有被认识、显露出来的意味；“显明”兼顾被动语义和汉语表达。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是חכמה在智慧文学中的标准译法。
- source_word: וּתְבוּנָה
  choice: 悟性
  rationale: תבונה指理解力、洞察力；“悟性”与“智慧”并列自然，并区别于希腊平行文本的“教诲”。
- source_word: בְּמַעֲנֵה
  choice: 从……应答中
  rationale: מענה指回答或应答；此译法保留希伯来文本具体的回应含义，同时符合现代汉语。
- source_word: לָשׁוֹן
  choice: 舌头的
  rationale: 原文直译为“舌头”，希腊平行文本也保留同一身体意象，因此不将其平化为“言语”或“语言”。
theological_decisions:
- issue: 第二分句的希伯来文本与希腊平行文本不同
  choice: 正文依现存希伯来文本译作“悟性也从舌头的应答中显明”
  alternative: 依希腊文可译作“教诲也从舌头所发的话中显明”
  rationale: 现存希伯来文本置信度高且已获验证，应作为正文依据；希腊文的不同读法则在脚注中保留，以呈现文本传统的差异。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两分句补出第二个“显明”，以清楚呈现希伯来诗句省略谓语的平行结构；保留“舌头”这一原文意象。
