  text: Do not abase yourself before a fool[b][a], and do not show partiality before rulers.
translation:
  language: zh_hans
  text: 不要在愚顽人面前自我贬低[a]，也不要在掌权者面前偏袒人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作“不要把自己铺在愚顽人面前”；希腊平行文本也表达把自己铺在下面的意象，表示自我贬抑。
    reason: lexical_alternative
  - marker: b
    text: 这一分句的希伯来文单独看不够明朗，也可能被理解为“不要信任”。希腊平行文本作“不要接受掌权者的情面”，因而支持“不要偏袒人”的译法。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּצַּע ... נַפְשֶׁךָ
  choice: 不要……自甘卑下
  rationale: יצע本指铺开、铺在下面；与נפש“自己”连用，并参照希腊文ὑποστρώσῃς σεαυτόν，描绘把自己铺在别人脚下般的自我贬抑。“自甘卑下”以自然中文传达这一比喻意义。
- source_word: לְנָבָל
  choice: 在愚顽人面前
  rationale: נבל主要指道德上愚妄、可鄙的人，而不只是智力不足者；“愚顽人”保留其道德色彩。介词按此处社会姿态译作“在……面前”。
- source_word: וְאַל תַּאֲמֵן
  choice: 也不要……徇私
  rationale: 希伯来文本句单独看不够明朗，字形也可能使人联想到“相信”；但希腊平行文本μὴ λάβῃς πρόσωπον（不要看人的情面）支持偏袒、徇私之义。“徇私”简洁而自然，并保留其社会伦理含义。
- source_word: לִפְּנֵי מוֹשְׁלִים
  choice: 在掌权者面前
  rationale: מושלים指统治或行使权力的人。“掌权者”较“统治者”更自然，也能涵盖各种有权势者；“在……面前”保留原文所呈现的权力场景。
theological_decisions:
- issue: 第二分句תַּאֲמֵן的含义不够透明
  choice: 译为警告人在掌权者面前不可徇私
  alternative: 不要在掌权者面前轻信；不要在掌权者面前顺从讨好
  rationale: 以希伯来文本为首要依据，同时用所提供的希腊平行文本校验。希腊文明确使用“接受人的脸面”的惯用表达，支持偏袒、徇私之义；脚注仍交代希伯来文可能产生的不同理解，不把文本张力隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“愚顽人”保留道德愚妄的意味；“自甘卑下”传达原文铺在别人下面的形象，但避免生硬直译。所有脚注标记均已置于正文相应位置。
