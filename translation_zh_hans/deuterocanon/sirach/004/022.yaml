  text: Do not show partiality against yourself[a], and do not stumble to your own downfall.
translation:
  language: zh_hans
  text: 不要偏私，以致害了自己；也不要在自己的失足上再失足。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文较直译作“不要在你的绊脚石（或：失足）上跌倒”，动词“跌倒”与名词“绊脚石／失足”同根。希腊语平行文本作“不要羞愧，以致跌倒”。
    reason: 说明希伯来文本的同根重复，并保留希腊语平行文本所反映的不同读法或理解。
lexical_decisions:
- source_word: אַל תִּשָּׂא פָנֶיךָ
  choice: 不要偏私
  rationale: “举起脸”是希伯来语习语，表示徇情、偏袒或偏私；希腊语平行文本的 λάβῃς πρόσωπον 也支持按习语表达，而非直译面部动作。
- source_word: עַל נַפְשֶׁךָ
  choice: 反而伤害自己
  rationale: נפשך 在这里指“你自己／你的生命”；介词 על 与希腊语 κατὰ 都使警告带有“针对、损害自己”的反常意味。加入“反而”使现代汉语清楚呈现这一张力，但不说明偏私的具体对象。
- source_word: וְאַל תִּכָּשֵׁל
  choice: 也不要……跌倒
  rationale: 所传希伯来文本的 כשל 通常意为“绊倒、跌倒”。正文优先依据高可信度的希伯来文本；希腊语所见“羞愧”作为异文在脚注交代。
- source_word: לְמִכְשׁוֹלֶיךָ
  choice: 因自己的绊脚石
  rationale: מכשול 可指绊脚之物、障碍或导致跌倒的因素。此译保留它与前一动词“跌倒”的词根呼应，也保留复数形式所表达的概括性。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“偏私”保留伦理警告的力度；“反而伤害自己”传达希伯来语与希腊语共同具有的反常结构。第二分句以希伯来文本为正文依据，并用脚注保留希腊平行文本的差异。
