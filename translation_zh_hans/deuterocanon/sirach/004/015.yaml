base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/015.yaml
  text: Whoever listens to me will judge truly[b][a], and whoever gives ear to me will dwell securely in my inner chambers.
translation:
  language: zh_hans
  text: 聆听我的人，必按真理判断；侧耳听我的人，必安然住在我的内室里[b]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“听从她的，必审判万国；来到她那里的人，必安然安营。”两句都与现存希伯来文有明显差异。正文以希伯来文为主；末句的艰涩之处则参考希腊文。
    reason: alternative_reading
  - marker: b
    text: “我的内室”延续智慧被拟人化为女子的表达：她接纳留心聆听的人进入自己的居所。
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹמֵעַ לִי
  choice: 听从我的
  rationale: שמע可指听见、聆听或顺从；“听从”既保留听的意象，也表达积极回应，与希腊文ὑπακούων相符。
- source_word: יִשׁפֹּט אֱמֶת
  choice: 必按真理施行判断
  rationale: 希伯来文直译为“判断真理”；这里把אֱמֶת理解为方式或准则，译作“按真理施行判断”，避免采用希腊文不同的宾语“万国”。
- source_word: וּמַאֲזִין לִי
  choice: 留心听我的
  rationale: מאזין强调专注倾听；此译保留与首句שׁוֹמֵעַ的近义平行，同时显出更强的留意意味。
- source_word: יִיחַן
  choice: 必……住
  rationale: 该词形较难，希腊文κατασκηνώσει支持“扎营、居住”的含义；“住”在现代汉语中自然，并保留居所意象。
- source_word: בַּחֲדָרַי
  choice: 在我的内室里
  rationale: חדר指房屋内部的房间或内室；智慧以女性口吻说话，此译保留她接纳听者进入自家内室的拟人化家庭意象。
- source_word: מִבָּיִת
  choice: 安然
  rationale: 此短语在现存希伯来文中的句法艰涩；希腊文πεποιθώς意为“有信心地、安稳地”，可帮助说明整句含有安稳居住之意，但这一处理需用脚注交代其不确定性。
theological_decisions:
- issue: 希伯来文与希腊文首句存在显著差异
  choice: 正文依希伯来文译作“必按真理施行判断”
  alternative: 希腊文作“必审判万国”
  rationale: 有存世希伯来文时以其为正文主要依据，不以希腊文的不同宾语取代它；同时在脚注中如实列出异文。
- issue: 末尾מִבָּיִת的艰涩读法
  choice: 结合希腊文将整句译为“必安然住在我的内室里”
  alternative: 较直译但晦涩的“必住在我从房屋而来的内室里”；或依希腊文译作“必满怀信心地安营”
  rationale: 希伯来文结尾句法不明，希腊文支持安稳居住的整体含义。正文采用通顺但审慎的译法，并在脚注中说明见证之间的差异，不把推断冒充确定文本。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“施行判断”比单说“判断”更明确地表达裁断行为；“内室”保留古代家庭空间和智慧拟人化的意象。脚注标记置于正文相关句末，并按[a]、[b]顺序排列。
