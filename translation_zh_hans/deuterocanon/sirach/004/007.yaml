  text: Incline your ear to the poor[a], and answer him peacefully with humility.
translation:
  language: zh_hans
  text: 要侧耳倾听穷人[a]，平和而谦卑地回答他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“要使自己蒙会众喜爱，也要向权贵低头。”这反映的文本形态与现存希伯来文有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: הַט…אָזְנֶךָ
  choice: 侧耳倾听
  rationale: 原文直译为“倾下你的耳朵”，是专心听取对方言语的惯用表达；“侧耳倾听”既保留身体意象，又符合现代汉语习惯。
- source_word: לֶעָנִי
  choice: 穷人
  rationale: עָנִי可指贫穷、困苦或受压的人；本句采用最直接的“穷人”，同时不排除其处境困苦、社会地位弱势的含义。
- source_word: וַהֲשִׁיבֵהוּ
  choice: 回答他
  rationale: 使役形在此处结合“倾听”的语境，表示回应、作答；译作“回答他”自然明确。
- source_word: שָׁלוֹם
  choice: 平和地
  rationale: שָׁלוֹם在此修饰回答，带有和平、安宁、和善之意；“平和地”保留其和平语义，也适合现代汉语表达。
- source_word: בַּעֲנָוָה
  choice: 谦卑地
  rationale: עֲנָוָה表示谦卑、温柔或柔和；“谦卑地”直接保留原文所要求的内在姿态，并与“平和”区分。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本显著不同
  choice: 正文依据现存希伯来文翻译，并以脚注列出希腊文异读。
  alternative: 按希腊文译为：“要使自己蒙会众喜爱，也要向权贵低头。”
  rationale: 本节有可信度高的希伯来文见证，应以其为正文依据；希腊文并非细微措辞差异，而代表显著不同的文本形态，因此不将两者调和，而在脚注中完整说明。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“侧耳倾听”保留希伯来文的身体意象；“平和而谦卑”分别呈现שָׁלוֹם与עֲנָוָה，避免将两个概念合并。
