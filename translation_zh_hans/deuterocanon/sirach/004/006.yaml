  text: For if he cries out against you in the bitterness of his soul, his Maker will hear his plea.[a][b]
translation:
  language: zh_hans
  text: 因为他若在心灵的苦痛中控诉你，那创造他的必垂听他的恳求。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来抄本在此处的文字与本节希腊文本不相符；正文因此依据希腊见证翻译。
    reason: textual_variant
  - marker: b
    text: “控诉你”也可译作“求上帝审判你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: καραμένου
  choice: 控诉你
  rationale: 该分词在受欺压者向上帝申诉的语境中带有针对对方的敌意或控告意味；“控诉你”自然、凝练，也保留其可能含有求上帝施行审判的色彩。
- source_word: ἐν πικρίᾳ ψυχῆς αὐτοῦ
  choice: 在心灵的苦痛中
  rationale: 保留ψυχή所指的内在生命，同时用现代汉语自然表达深切的苦楚；不将其弱化为一般的不快。
- source_word: δέησις
  choice: 恳求
  rationale: 表达迫切而谦卑的求助，既可用于祷告，也保留申诉性的语气。
- source_word: ἐπακούσεται
  choice: 必垂听
  rationale: 该动词不只是听见，也含有 favorable hearing；“垂听”在庄重经文语体中自然，并避免过度译成“应允”。
- source_word: ὁ ποιήσας αὐτόν
  choice: 造他的主
  rationale: 明确指创造他的上帝，又比“他的创造者”更符合汉语经文的凝练庄重语体。
theological_decisions:
- issue: 现存希伯来文本与本节希腊文本不相符时所依据的底本
  choice: 正文依据与本节上下文连贯的希腊见证翻译，并以脚注说明希伯来见证的错位或异文问题。
  alternative: 按所列希伯来行直译为“要为会众爱惜你的生命，并要向掌权者更加低头”。
  rationale: 所列希伯来行在内容上与希腊本及本节关于受欺压者申诉的语境不对应，很可能错置或归属另一处。采用希腊见证可恢复连贯文本，同时脚注诚实保留文本证据的不确定性。
- issue: καραμένου是否明确译出求审判的含义
  choice: 译作“控诉你”，保留向上帝申诉并针对对方的含义。
  alternative: 译作“求上帝降罚于你”。
  rationale: 希腊词可带诅咒或求审判色彩，但正文不宜将隐含结果完全明说；脚注列出更强的可能译法，以保存语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心灵的苦痛”保留原文的强烈内在痛苦；“垂听”体现上帝有利地听取恳求，却不把经文过度解释为立即应允。所有脚注标记均已置于正文。
