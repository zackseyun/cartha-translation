  text: Do not be proud in your speech[a], and slack and negligent in your work.
translation:
  language: zh_hans
  text: 不要在言语上傲慢[a]，在工作上松懈怠惰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作另一种说法：“不要伸手去拿，偿还时却缩手。”
    reason: textual_variant
lexical_decisions:
- source_word: גַבְהָן
  choice: 傲慢
  rationale: 该词表示高傲、自大；“傲慢”在现代汉语中自然明确，并保留其责备意味。
- source_word: בִּלְשׁוֹנֶךָ
  choice: 言语
  rationale: 字面为“在你的舌头上”，此处指说话的方式；译作“言语”比直译“舌头”更符合现代汉语表达。
- source_word: רָפוּי
  choice: 松懈
  rationale: 该词有松弛、软弱、缺乏干劲之意；在做事的语境中，“松懈”贴切自然。
- source_word: רָשִׁישׁ
  choice: 怠惰
  rationale: 这是较罕见的词，与前词意义相近，表示无力、懒散或疏于尽责；“怠惰”保留希伯来文双重责备的力度。
- source_word: בִּמְלַאכְתֶּךָ
  choice: 做事
  rationale: 原词泛指工作、事务或任务；“做事”适合此处的智慧训诫语体，也能自然连接两个形容词。
theological_decisions:
- issue: 《便西拉智训》4:31现存希伯来文与希腊文形式显著不同
  choice: 正文依据高可信度的现存希伯来文翻译
  alternative: 采用希腊文：“不要伸手领取，偿还时却把手缩回。”
  rationale: 本节希伯来文完整且可信度高，故应作为正文依据。希腊文表达的是另一则实质不同的训诫，不宜与希伯来文调和，适合在脚注中透明保留。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“不要……，……却……”凸显言语傲慢与行动懈怠之间的反差；保留两个近义词，以反映希伯来文的双重责备。
