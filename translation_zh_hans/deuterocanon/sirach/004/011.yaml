  text: Wisdom has instructed her children[a], and she bears witness for all who have understanding in her.
translation:
  language: zh_hans
  text: 智慧教导她的儿女[a]，也为所有明白她的人作证。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“智慧高举自己的儿子们，又扶持那些寻求她的人。”现存希伯来文作：“智慧教导她的儿女，也为所有明白她的人作证。”
    reason: 保留希伯来文与希腊文之间涉及两个分句的显著异文。
lexical_decisions:
- source_word: חָכְמוֹת
  choice: 智慧
  rationale: 该词虽具有复数词形，在本节却指人格化的“智慧”；希腊文平行文本也使用单数名词。
- source_word: לִמְּדָה
  choice: 教导了
  rationale: 源自动词 למד，意为“教导、训诲”。用“教导了”保留完成式，同时符合现代汉语表达。
- source_word: בָנֶיהָ
  choice: 她的儿女
  rationale: בנים 可专指儿子，也可泛指子女。这里指人格化智慧的追随者，译作“儿女”既保留亲属意象，也不无故限于男性。
- source_word: וְתָעִיד
  choice: 也……作证
  rationale: 保留 העיד 的“作证、见证”语义及可能具有的司法色彩，不采用较弱的“留意”或“眷顾”。
- source_word: לְכָל
  choice: 为一切
  rationale: 介词 ל 在“作证”的语境中可表达有利于某人的见证；“为”在汉语中自然地传达这一方向。
- source_word: מְבִינִים בָּהּ
  choice: 明白她的人
  rationale: מְבִינִים 表示具有理解力或辨识力的人，בָּהּ 回指人格化的智慧。译作“明白她的人”自然地表达对智慧有所领悟的人，同时避免生硬的“在她里面有悟性”。
theological_decisions:
- issue: 智慧的阴性人格化
  choice: 以“她”指称智慧
  alternative: 把智慧作为非人格化的抽象概念，不使用代词
  rationale: 希伯来文中的阴性语法和“她的儿女”共同构成人格化描写；保留“她”可维护原文的文学与神学张力。
- issue: 希伯来文与希腊文平行文本的差异
  choice: 正文依照现存希伯来文，译为教导儿女并为明白她的人作证
  alternative: 依希腊文译为高举自己的儿子并扶持寻求她的人
  rationale: 本节有可信度较高的希伯来文存本，故以其为正文依据；希腊文呈现明显异文，收于脚注以保持文本透明度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“教导”“作证”贴近原文核心词义；“她的儿女”保留智慧的母性人格化意象。
