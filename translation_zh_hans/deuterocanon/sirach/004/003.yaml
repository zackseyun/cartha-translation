base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/003.yaml
  text: Do not embitter the inward parts of the poor[a], and do not cause pain to the heart of the needy.
translation:
  language: zh_hans
  text: 不要加重穷苦人内心的愁苦[a]，也不要使贫困者心中的痛苦加深。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内心”按希伯来文直译为“内在之处”或“内脏”，这里指人深层的情感；希腊文平行文本作“心”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמִיר
  choice: 使……苦上加苦
  rationale: 该词在此有使之苦涩、加重痛苦之意。结合宾语“内在之处”及希腊文所表达的进一步搅扰，译作“苦上加苦”既自然，也保留加剧其内心痛苦的力度。
- source_word: מְעֵי
  choice: 内心
  rationale: 字面指“内脏、内在之处”，在希伯来语中可指深层情感所在。现代汉语若直译“内脏”容易被理解为身体器官，故正文译作“内心”，脚注保留具体意象。
- source_word: דָךְ
  choice: 穷苦人
  rationale: 此词可指贫穷、受压、卑微或被压伤的人。“穷苦人”兼顾物质贫困和受苦处境。
- source_word: קֶרֶב
  choice: 心里
  rationale: 字面为内部、内中；在此与 מְעֵי 平行，指人的内在情感。译作“心里”符合现代汉语表达，同时不把两个希伯来词处理成完全相同的措辞。
- source_word: עָנִי
  choice: 贫困者
  rationale: 可指贫穷、困苦或受欺压的人。“贫困者”清楚表达其匮乏处境，并与前句“穷苦人”形成近义平行而避免机械重复。
- source_word: תַּכְאִיב
  choice: 使……疼痛
  rationale: 该词是“疼痛”的使役形式。译作“使……心里疼痛”保留原文具体、直接的力度。
theological_decisions:
- issue: 是否保留希伯来文关于人体内部的具体意象
  choice: 正文采用自然的“内心／心里”，并以脚注说明第一处字面意象。
  alternative: 将第一处直译为“内脏”或把两处都统一译为“心”。
  rationale: 希伯来文两处用词并不相同，但都指向人的内在情感。现代汉语直译“内脏”会产生不必要的生理意味；完全统一为“心”又会抹平原文差异。因此正文自然传意，脚注保存词汇层面的具体形象与希腊文旁证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“苦上加苦”传达不可进一步加重穷苦人内在痛楚的禁令；两分句以“穷苦人／贫困者”和“内心／心里”构成自然的近义平行。
