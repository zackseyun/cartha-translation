  text: If he turns aside[b][a], she will bind him with bonds.
translation:
  language: zh_hans
  text: 如果他偏离、离开她，她必用绳索捆住他。[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本在这里大不相同：“随后，她要再次径直来到他那里，使他欢乐，并向他揭示自己的隐秘之事。”这很可能反映《便西拉智训》的另一种文本形态。
    reason: textual_variant
  - marker: b
    text: 希伯来语“用绳索捆住他”也可更具体地译作“用镣铐锁住他”；其中的动词若采用另一种读法，也可译为“我必捆住他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 保留希伯来语条件句的语气，不将其改作单纯的时间顺序。
- source_word: יָסוּר
  choice: 他偏离
  rationale: סור可指离开或转离；“偏离”保留了偏离道路的意象，并符合上下文的智慧主题。
- source_word: וּנְטוֹתֵיהוּ
  choice: 转身离开她
  rationale: 此词形较难确定；按上下文理解为进一步离开人格化的智慧。“她”由上下文补明，而非声称该介词宾语在希伯来语中完全明说。
- source_word: וַאֲסַרְתִיהוּ
  choice: 她就要……捆住他
  rationale: 辅音形式容许不同读法；上下文中智慧是持续行动的阴性主体，因此正文采用第三人称阴性，并以将来意义承接条件句。
- source_word: בָאֲסוּרִים
  choice: 用捆索
  rationale: 该名词表示束缚物、镣铐或锁链；“捆索”保留束缚意象，同时不限定为金属刑具。
theological_decisions:
- issue: 后半句的主语
  choice: 以人格化的智慧为主语：“她就要……捆住他”
  alternative: 按另一种读法译为第一人称：“我就要捆住他”
  rationale: 上下文将智慧人格化，并以她为行动主体；正文依循这一连贯读法，同时在脚注说明希伯来语形式的歧义，避免把不确定性隐藏起来。
- issue: 希腊语平行文本与希伯来语正文的显著差异
  choice: 正文以现存且可信度高的希伯来语为依据
  alternative: 依希腊语译作智慧再次径直来到他那里，使他欢乐，并向他揭示隐秘之事
  rationale: 希腊语似乎反映《便西拉智训》的另一文本形态。既有希伯来语见证，正文不以希腊语替换，但在脚注完整交代异文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“偏离、转身离开她”保留希伯来语两个相连动作的力度；“她”承接上下文中人格化的智慧。脚注标记置于整句末尾，以同时提示文本异文和词形歧义。
