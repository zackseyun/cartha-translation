base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/013.yaml
  text: Those who hold fast to her will find honor from Yahweh[a], and they will be favored with the blessing of Yahweh.
translation:
  language: zh_hans
  text: 持守她的人必从雅威得着尊荣[a]，也必因雅威的赐福蒙恩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“持守她的人必承受荣耀；无论他进入哪里，主都必赐福。”希伯来文作“必从雅威得着尊荣”和“也必因雅威的赐福蒙恩”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְתֹמְכֶיהָ
  choice: 坚守她的人
  rationale: תמך有“扶持、托住、紧紧持守”之意；这里的“她”指人格化的智慧。译作“坚守她”表达忠实依附，也与希腊文κρατῶν αὐτῆς的较强语气相合。
- source_word: יִמְצְאוּ
  choice: 必……得着
  rationale: 保留希伯来文“找到、获得”的普通含义；“得着”在现代中文中自然，也不随希腊文改译为“承受”。
- source_word: כָבוֹד
  choice: 尊荣
  rationale: כבוד既可指荣耀，也可指所获的尊重与荣誉；智慧文学语境中“尊荣”兼顾神所赐的荣誉和荣耀意味。
- source_word: מֵיהֹוָה
  choice: 从雅威
  rationale: מן表示来源，译为“从”；יהוה按其专名译作“雅威”。
- source_word: וְיֻחַנּוּ
  choice: 必蒙……施恩
  rationale: 该词是חנן的被动形态，表示“蒙恩、受眷顾”；中文用“蒙……施恩”保留受惠含义，同时使句子通顺。
- source_word: בְּבִרְכַּת יְהֹוָה
  choice: 雅威赐福
  rationale: ב可表达伴随或凭借关系。译文将“施恩”与“赐福”并置，保留两者的紧密联系，而不把介词关系限定为纯粹工具义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה；音译“雅威”保留其作为神专名的性质，不以称号取代。
- issue: 赐福与施恩的关系
  choice: 蒙雅威赐福施恩
  alternative: 因雅威的赐福而蒙恩；蒙恩得享雅威的赐福
  rationale: 希伯来文可将ב理解为凭借或伴随。正文用并列紧密的表达保留二者关系，避免过度断定赐福是施恩的工具，或把它们完全拆成两个动作。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“坚守她”延续上下文中人格化智慧的阴性指称；“得着尊荣”和“赐福施恩”具有经文语体感，但不显陈旧。
