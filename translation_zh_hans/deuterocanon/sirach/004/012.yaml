base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/012.yaml
  text: Those who love her love life[a], and those who seek her will obtain favor from Yahweh.
translation:
  language: zh_hans
  text: 爱她的人爱生命；寻求她的人必得耶和华的恩惠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“清早起来寻求她的，必充满喜乐。”
    reason: 保留希腊见证中与希伯来文后半节不同的读法。
lexical_decisions:
- source_word: אֹהֲבֶיהָ
  choice: 爱她的
  rationale: 主动分词带阴性单数后缀，所指为上下文中的智慧；译为“爱她的”自然简洁，并保留智慧的阴性指代。
- source_word: אָהֲבוּ חַיִּים
  choice: 就是爱生命
  rationale: 希伯来文直译为“爱生命”；这里是格言式陈述，汉语用现在时态表达普遍真理。“就是”清楚呈现两者之间的对应关系。
- source_word: וּמְבַקְשֶׁיהָ
  choice: 寻求她的
  rationale: בקש 的基本义为“寻求”。希伯来文本没有明确的“殷勤”或“清早”成分，因此不在正文中增添程度或时间含义。
- source_word: יָפִיקוּ
  choice: 必蒙
  rationale: 在与“恩待”和神圣来源搭配时，意思是获得、得着；汉语“蒙……恩待”能自然表达领受来自上主的恩惠。
- source_word: רָצוֹן
  choice: 恩待
  rationale: רצון 在“从耶和华而来”的结构中表示悦纳、恩惠或善意；“恩待”既自然，又保留神施予有利看顾的含义。
- source_word: מֵיהֹוָה
  choice: 耶和华
  rationale: 明确译出希伯来文神名 יהוה；“蒙耶和华恩待”也自然表达介词 מן 所标示的来源。
theological_decisions:
- issue: 希伯来文与希腊文后半节的差异
  choice: 正文采用现存希伯来文：“必蒙耶和华恩待”
  alternative: 希腊文作：“必充满喜乐”
  rationale: 本节希伯来文保存完整、意义清楚且来源置信度高，故作为正文依据；希腊平行文本保留了实质不同的读法，应以脚注呈现，不将两者调和。
- issue: 寻求智慧是否包含“清早”或“殷勤”的含义
  choice: 仅译“寻求她的”
  alternative: “殷勤寻求她的”或“清早起来寻求她的”
  rationale: 希伯来文 בקש 本身只要求“寻求”；“清早起来”的意象来自希腊文 ὀρθρίζοντες，不宜加入以希伯来文为依据的正文。
translation_notes:
  register: 采用现代、庄重而通顺的格言体。“爱她的，就是爱生命”保留原文简洁的对应结构；“蒙耶和华恩待”是现代汉语宗教语境中清楚且不生硬的表达。脚注标记置于全节末，所注为希腊文与希伯来文在后半节的整体差异。
