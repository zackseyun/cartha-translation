base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/005.yaml
  text: One crying out in bitter spirit and in the pain of his soul[a], and at the sound of his cry, his Rock will hear.
translation:
  language: zh_hans
  text: 那心中愁苦、内心伤痛而呼喊的人[a]，他的磐石必听见他呼喊的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要对恳求的人视而不见，也不要给人咒诅你的机会。”现存希伯来文本则强调：受苦之人的磐石必听见他的呼喊。
    reason: alternative_reading
lexical_decisions:
- source_word: צוֹעֵק
  choice: 发出呼喊
  rationale: 希伯来语分词描写正在呼喊的人；译作动词性短语，使中文自然，同时保留其鲜明的持续状态。
- source_word: מַר רוּחַ
  choice: 心灵苦涩
  rationale: 直译为“灵苦涩”；这里表达内在的苦楚与悲愤，不宜淡化为一般的不快。
- source_word: בִּכְאֵב נַפְשׁוֹ
  choice: 内心伤痛
  rationale: נפש 在此指人的内在自我；“内心伤痛”比机械地译作“灵魂的疼痛”更符合现代汉语，也不强加特定的人论解释。
- source_word: וּבְקוֹל צַעֲקָתוֹ
  choice: 他呼求的声音
  rationale: 保留原文“声音”和“呼喊”的听觉意象；“呼求”也体现向援助者发出的迫切呼喊。
- source_word: צוּרוֹ
  choice: 他的磐石
  rationale: 保留希伯来文对上帝的隐喻性称号，不将其释义化为“上帝”“创造主”或“保护者”。
- source_word: יִשְׁמַע
  choice: 必听见
  rationale: 未完成式在警戒语境中具有将来和确定后果的意味；“必听见”简洁传达这种力度。
theological_decisions:
- issue: 希伯来文本与希腊平行文本的关系
  choice: 正文严格以现存希伯来文为主，不把希腊文中的禁止命令补入正文；希腊异文置于脚注。
  alternative: 按希腊文译为：“不要转眼不顾那向你恳求的人，也不要给人咒诅你的机会。”
  rationale: 所给希伯来文没有“不要转眼不顾”的命令，而强调受苦者呼喊及其磐石垂听。将希腊内容并入正文会混合两个实质不同的见证；脚注可同时保存文本差异与神学张力。
- issue: נפש 的表达
  choice: 内心
  alternative: 灵魂；生命；自身
  rationale: 此处与“苦涩”和“伤痛”并列，重在整个人深处的痛苦。“内心”在现代汉语中自然，又避免把该词限定为后期系统神学中的“灵魂”。
- issue: צוּרוֹ 的神圣指称
  choice: 他的磐石
  alternative: 他的上帝；他的保护者；他的创造主
  rationale: “磐石”是有神学意义的神圣称号与意象，应保留其稳固、庇护的隐喻，而不在正文中直接解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保持希伯来诗句的两分结构，并以“磐石”保留神圣隐喻；不用古奥词语，也不把希腊平行文本的命令句补入希伯来正文。
