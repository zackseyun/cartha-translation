  yaml_path: translation/deuterocanon/sirach/004/023.yaml
  text: Do not withhold a word in the world, and do not hide your wisdom.
translation:
  language: zh_hans
  text: 不要在世上隐瞒一句话[a]，也不要隐藏你的智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“在拯救之时，不要拦阻话语。”其中“拯救”也可译作“解救”。现存希伯来文本则作“在世上”。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: 不要……闭口不言
  rationale: מנע表示拦阻、扣留或不让发生；与“言语”搭配时，“闭口不言”是自然的现代汉语表达，同时保留禁止压下应说之话的含义。
- source_word: דִּבֵּר
  choice: 言
  rationale: 此处所指是说出的话或言语；译作“言”简洁庄重，并与“闭口不言”形成自然搭配。
- source_word: בָּעוֹלָם
  choice: 在世上
  rationale: 现存希伯来文本直读为“在世界／世上”。虽然措辞不寻常，仍按高可信度的希伯来见证翻译，不将其解释性改写为“在适当的时候”。
- source_word: וְאַל תַּצְפִּין
  choice: 也不要隐藏
  rationale: צפן的使役形式表达藏起、隐匿；“隐藏”准确自然，也与前半句不应压下言语的劝诫相呼应。
- source_word: אֶת חָכְמָתֶךָ
  choice: 你的智慧
  rationale: חכמה通常指智慧；保留第二人称所有关系，不把它缩窄为“教导”或“见识”。
theological_decisions:
- issue: 前半句希伯来文本与希腊文本的重大差异
  choice: 正文依现存希伯来见证译为“不要在世上闭口不言”
  alternative: 希腊文本可译为“在拯救的时候，不要拦阻应说的话”
  rationale: 《便西拉智训》有可靠希伯来文本存留时以希伯来文为正文依据。希腊平行文本在“世上”与“拯救的时候”之间存在实质差异，因此不在正文中暗自调和，而以脚注保存异文及其可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在世上”刻意保留希伯来文本不寻常的措辞；脚注交代希腊异文，避免把两种见证无声调和。
