base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/017.yaml
  text: And until his heart is filled with me[a], I will return and make him happy[b], and I will reveal my secrets to him.
translation:
  language: zh_hans
  text: 直到他的心被我充满[a]，我就回转，使他有福[b]，并向他揭示我的奥秘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作“直到她信任他的心灵”（也可理解为“直到他把自己的心灵托付给她”），并说智慧“要用她的典章考验他”；这反映了智慧先考验人、随后转而施恩的较完整表述。
    reason: alternative_reading
  - marker: b
    text: 或译“使他幸福”，也可理解为“称他有福”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד עֵת
  choice: 直到
  rationale: 该短语标明时间界限；中文用“直到”自然清楚，句首不必机械保留连接词“和”。
- source_word: יִמָּלֵא לִבּוֹ בִּי
  choice: 他的心被我充满
  rationale: 依存留的希伯来文本直译“心被我充满”，保留智慧以第一人称说话的拟人意象，也不以希腊平行文本的“信赖”消解其含混性。
- source_word: אָשׁוּב
  choice: 我就回转
  rationale: שוב的基本义是返回、转回；“回转”既保留动作意象，又适合智慧在考验之后转而施恩的语境。
- source_word: אֲאַשְּׁרֶנּוֹ
  choice: 使他蒙福
  rationale: 该动词可指使人有福或称其有福。“使他蒙福”在庄重而现代的中文里自然，并以脚注保留“使他幸福／称他有福”的可能。
- source_word: וְגָלִיתִי לוֹ
  choice: 并向他揭示
  rationale: גלה在此表示揭开、显露；“揭示”准确表达向某人披露隐藏之事。
- source_word: מִסְתָּרִי
  choice: 我的奥秘
  rationale: 该词指隐藏、秘密之事。“奥秘”适合智慧向门徒披露隐秘知识的语境，且不额外扩展为特定教义概念。
theological_decisions:
- issue: 希伯来正文与较完整的希腊平行文本之间的关系
  choice: 正文依据现存希伯来文，保留“他的心被我充满”；以脚注交代希腊文本中的信赖、考验等内容。
  alternative: 按希腊文本在正文中译出智慧使人恐惧、以训诲考验他，直到她信任他的心灵。
  rationale: 《便西拉智训》有希伯来文本存留之处，应以希伯来证据为主；希腊平行文本可用于校勘和理解上下文，却不宜把其较长内容无标记地并入正文。
- issue: אֲאַשְּׁרֶנּוֹ 的福乐含义
  choice: 使他蒙福
  alternative: 使他幸福；称他有福
  rationale: 希伯来动词兼具使人有福和宣告其有福的语义范围；正文选择自然庄重的“使他蒙福”，脚注保留其他可能，不将其限定为某一宗派性的祝福观。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“被我充满”刻意保留希伯来文不寻常的意象和含混性；“回转”“蒙福”“奥秘”与智慧文学语域相称，但避免过度古雅。
