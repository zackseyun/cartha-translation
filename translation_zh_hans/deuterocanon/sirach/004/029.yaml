  text: Contend for righteousness until death[b][a], and Yahweh will fight for you.
translation:
  language: zh_hans
  text: 要为正义[a]抗争[b]，直到死；雅威将为你争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正义”或译“公正”；也可指“正直”。希伯来语 צֶדֶק 可指合乎道德的正直，也可指公平正义。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本在此是另一句话：“说话不要刻薄，做事不要迟钝懈怠。”正文依据开罗藏经库所保存的希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: עַד הַמָּוֶת
  choice: 直到死也
  rationale: 忠实表达坚持抗争直至死亡的限度，同时不额外断定殉道情境；现代汉语简洁有力。
- source_word: הִנָּצֵה
  choice: 抗争
  rationale: 该反身命令式表示投入争斗或争辩。译作“抗争”既保留争战意象，也比单纯“争辩”更能涵盖为正义奋力坚持的广义行动。
- source_word: עַל הַצֶּדֶק
  choice: 为正义
  rationale: צֶדֶק兼有正义、公正和正直之意；本节是广义的伦理劝勉，“正义”自然凝练，另一可能译法在脚注保留。
- source_word: וַיהֹוָה
  choice: 雅威
  rationale: 按希伯来文直接出现的四字神名 יהוה 音译，保留其作为上帝圣约之名的性质。
- source_word: נִלְחָם לָךְ
  choice: 就为你争战
  rationale: נִלְחָם形式上是分词，在命令句之后可表达相应的结果或应许。“就”体现两分句的关联，同时不以明确时态过度限定其为现在或将来。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。采用“雅威”较直接地呈现该专名，不以称号取代，也不借此加入宗派性解释。
- issue: צֶדֶק 是“正义”还是“正直/公正”
  choice: 正义
  alternative: 公正；正直
  rationale: 此词可指司法公正，也可指较广泛的伦理正直。正文采用涵盖面较广且符合现代汉语劝诫语体的“正义”，并以脚注保存另一译法。
- issue: נִלְחָם 的时间和语气
  choice: 就为你争战
  alternative: 必为你争战；正在为你争战
  rationale: 希伯来文为分词，语境中可有将来或结果意味，但形式本身未明确标记将来时。正文以“就”表达回应关系，避免把时态含义定得过死。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“直到死也要……抗争”保留原文的强烈命令语气；分号呈现两小句之间的平行与回应关系。
