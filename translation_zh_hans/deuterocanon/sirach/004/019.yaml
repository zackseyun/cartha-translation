  text: If he turns away from me[a], I will cast him off and hand him over to plunderers.
translation:
  language: zh_hans
  text: 若他离开我，我就弃绝他，把他交给掠夺者。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“把他交在他败亡的手中。”这可能反映不同的底本，或是解释性的译法。
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר
  choice: 转身离开
  rationale: סור常指转离、偏离或离去；这里与מֵאַחֲרַי连用，表达不再跟随智慧。“转身离开”自然、具体，又不把含义扩大为正式背教。
- source_word: מֵאַחֲרַי
  choice: 离开我
  rationale: 字面为“从我后面”，是停止跟随的习语。与“转身”合译为“转身离开我”，既符合现代汉语，也保留跟随关系的含意。
- source_word: אַשׁלִיכֶנּוּ
  choice: 把他抛弃
  rationale: שלך本义是投、扔；在关系语境中，“抛弃”保留其强烈而具体的弃绝意象，比单纯的“拒绝”更贴近原文。
- source_word: וְאַסְגִּירֶנּוּ
  choice: 将他交给
  rationale: 此处סגר表示把某人交入他者权下。“交给”是清楚自然的现代汉语，也与希腊文παραδώσει所表达的交付含义一致。
- source_word: לַשֹׁדְדִים
  choice: 给掠夺者
  rationale: שֹׁדְדִים指劫掠者、抢夺者；“掠夺者”直接保留其施行劫掠的含义。现存希伯来文清楚，故正文以此为准。
theological_decisions:
- issue: 希伯来文与希腊文平行文本的差异
  choice: 正文采用现存希伯来文“将他交给掠夺者”
  alternative: “把他交在使他败亡者的手中”或“把他交给自己的败亡”
  rationale: 《便西拉智训》有可靠希伯来文存世时，应优先依据希伯来文。本节希伯来文לַשֹׁדְדִים明确指“给掠夺者”；希腊文则作εἰς χεῖρας πτώσεως αὐτοῦ，存在不同底本或解释性翻译的可能，因此将该异文保留于脚注，而不在正文中调和。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“转身离开我”呈现停止跟随智慧的关系语境；“抛弃”“交给掠夺者”保留原文连续而强烈的动作意象。脚注标记[a]已置于正文相应位置。
