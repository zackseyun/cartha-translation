translation:
  language: zh_hans
  text: 不要抗拒上帝，却要在上帝面前谦卑自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要反驳真理，要为自己未受教导而羞愧。”现存希伯来文则作：“不要抗拒上帝，却要在上帝面前谦卑自己。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּסָּרֵב
  choice: 不要抗拒
  rationale: 该动词在此表达拒绝、抵抗或执意反对；“抗拒”与下句“谦卑自己”形成自然对照，也保留了希伯来文的劝诫力度。
- source_word: עִם הָאֵל
  choice: 上帝
  rationale: אֵל 是常见的神称；介词 עִם 不逐字译作“与”，而按现代汉语搭配并入“抗拒上帝”。
- source_word: וְאֶל אֱלֹהִים
  choice: 却要在上帝面前
  rationale: אֶל 本义为“向、朝向”；与 הִכָּנֵעַ 连用时，“在上帝面前”自然表达向上帝降卑、顺服的关系姿态。连接词 וְ 依上下句对照译为“却要”。
- source_word: הִכָּנֵעַ
  choice: 谦卑自己
  rationale: 该形式在此具有自谦、降服的反身意味；“谦卑自己”既清楚自然，也避免把经文仅限缩为外在服从。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本存在显著差异
  choice: 正文以现存希伯来文为准，译作“不要抗拒上帝，却要在上帝面前谦卑自己”
  alternative: 希腊文平行文本作：“不要反驳真理，要为自己未受教导而羞愧。”
  rationale: 本节有可靠的希伯来文见证，应作为正文基础；希腊文可能反映不同底本或传承发展。两者差异涉及宾语与第二分句的整体含义，因此在脚注中完整保留异文，不将两种读法混合。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“抗拒”比“争辩”更能涵盖希伯来文所表达的拒绝与抵抗；“谦卑自己”保留伦理劝诫及关系姿态。脚注明示希腊文的重要异读。
