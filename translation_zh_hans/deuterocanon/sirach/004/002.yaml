  text: Do not make a needy soul despair[a], and do not ignore a crushed soul.
translation:
  language: zh_hans
  text: 不要加深困乏而痛苦之人的愁苦[a]，也不要漠视心灵被压伤的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要使饥饿的人忧伤，也不要在一个人困窘时激怒他。”希伯来文的表达范围较广，指困乏而痛苦的人及心灵被压伤的人；因此正文依照希伯来文翻译，并在此保留希腊文的差异。
    reason: alternative_reading
lexical_decisions:
- source_word: דֹּוֶוה נֶפֶשׁ חֲסֵרָה
  choice: 贫乏的人
  rationale: חֲסֵרָה 表示有所缺乏、处于匮乏中；דֹּוֶוה 与 נֶפֶשׁ 又带有内在痛苦或衰弱之意。译作“贫乏的人”涵盖物质与一般困乏，不把意义限缩为希腊文所突出的饥饿。
- source_word: אַל תָּפוּחַ
  choice: 不要使……更加愁苦
  rationale: 此动词形式和含义较难确定；上下文与希腊文 λυπήσῃς 都支持“使忧伤、加重痛苦”。加入“更加”体现此人原已困苦，但不采用较强、较具解释性的“使绝望”。
- source_word: וְאַל תִּתְעַלֵּם
  choice: 也不要对……视而不见
  rationale: עלם 的反身形式可指隐藏自己、佯装没有看见；“视而不见”自然地表达蓄意不理会的语气。
- source_word: מִמְּדֻכְדַּךְ נָפֶשׁ
  choice: 心灵受压的人
  rationale: מְדֻכְדַּךְ 指被压伤、受挫、低沉的人；“心灵受压”保留受压垮的形象和内在困顿，同时比“抑郁的人”更少现代临床色彩。
theological_decisions: []
