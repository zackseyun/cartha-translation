    issue: “心灵受压的人”表达略显生硬。
    rationale: “受压”在现代汉语常指压力状态，较弱地呈现“被压碎、受挫”的形象；“心灵被压伤的人”更自然且更贴近原文。
  - severity: low
    issue: “更加”带入未明说的比较程度。
    rationale: 经文确实针对已困苦者，语境允许“加重”之意；但以“加深……愁苦”表达行为的加害效果，避免把程度副词直接加于原文。
