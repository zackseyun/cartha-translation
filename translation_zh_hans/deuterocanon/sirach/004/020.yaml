base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/020.yaml
  text: My son[a], keep the proper time and beware of evil[c][b], and do not be ashamed for your own soul.
translation:
  language: zh_hans
  text: 我儿，要留意合宜的时机[a]，防备邪恶[b]；也不要为自己的性命感到羞愧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文这里抄传为“时候＋众多（或财富、喧嚷）”，含义难解；希腊文平行本只有“守住／留意合宜的时机”。正文采用希腊文所保存的较清楚意义。
    reason: textual_variant
  - marker: b
    text: 或译：“惧怕邪恶”或“远离邪恶”。希伯来文直译较生硬；希腊文作“防备邪恶”。
    reason: lexical_alternative
  - marker: c
    text: “性命”所译的希伯来词也可指“自己”或“灵魂”。末句也可译作：“不要以自己为耻”或“不要为自己的灵魂感到羞愧。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 这是带阳性单数后缀的直接称呼；“我儿”既准确反映希伯来文，也符合智慧文学中长者训诲晚辈的庄重语体。
- source_word: עֵת הָמוֹן שְׁמֹר
  choice: 要把握合宜的时机
  rationale: 抄传的希伯来文因הָמוֹן而语义困难；希腊文平行本作“持守/留意时机”。据此译出整体最清楚的意义，同时以脚注保留文本疑难。中文“把握合宜的时机”自然表达καιρός所含适当、合时之意。
- source_word: וּפְחַד מִרָע
  choice: 防备邪恶
  rationale: 按希伯来文可直解为“惧怕邪恶”或“因邪恶而害怕”，但表达生硬；希腊文明确作“防备邪恶”。所选译法兼顾平行见证与劝诫语境。
- source_word: וְאֶל נַפְשְׁךָ אַל תֵּבוֹשׁ
  choice: 不要因顾惜自己的性命而羞怯
  rationale: נפש可指性命、自身或灵魂；介词结构直译不够明晰。结合本章随后关于不合宜羞耻的教训，此处理解为不要因关乎保全自身性命而羞于采取行动，但不排除“不要以自己为耻”等读法，故在脚注说明。
- source_word: אַל תֵּבוֹשׁ
  choice: 不要……羞怯
  rationale: בוש表示感到羞耻或因羞耻而退缩；“羞怯”在劝诫语境中能自然表达不可因羞耻而不敢行当行之事。
theological_decisions:
- issue: נֶפֶשׁ / ψυχή的人论含义
  choice: 自己的性命
  alternative: 自己；自己的灵魂
  rationale: 该词在古代语境中可指人的生命、自身或内在生命，不能预设为与身体截然分离的“灵魂”。正文采用语境中较自然的“性命”，脚注保留其他可能，以免消除原文的语义张力。
- issue: 末句羞耻与自我保全之间的关系
  choice: 不要因顾惜自己的性命而羞怯
  alternative: 不要以自己为耻；不要为自己的灵魂感到羞耻
  rationale: 希伯来文介词אֶל在此关系不够确定，希腊文περὶ也可作“关于、为了”。正文采用可通顺衔接劝诫语境的目的性理解，但用脚注明示其他合理读法。
translation_notes:
  register: 采用现代、庄重而易懂的智慧训诲语体。“我儿”保留原文性别明确的称呼；分号呈现两个相连但各自完整的命令。脚注标记均置于相关正文之后。
