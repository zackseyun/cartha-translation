  text: And God will call you son[a], and he will show you favor and deliver you from the Pit.
translation:
  language: zh_hans
  text: 上帝要称你为儿子[a]，向你施恩，救你脱离深坑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“你将如同至高者的儿子；他爱你，要胜过你的母亲爱你。”希伯来文本则作：“上帝要称你为儿子，向你施恩，救你脱离深坑。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵל
  choice: 上帝
  rationale: 此处 אֵל 是对神通常的称呼；译作“上帝”自然清楚，也与希腊文本“至高者”的神圣指称相符。
- source_word: יִקְרָאֲךָ בֵּן
  choice: 要称你为儿子
  rationale: 希伯来文直译为“要称你儿子”。现代汉语需用“为”表达称谓关系；不增添原文没有的“他的”，并保留阳性单数“儿子”。
- source_word: וְיָחְנְךָ
  choice: 向你施恩
  rationale: חנן 的核心含义是施予恩惠、恩待；“向你施恩”兼具现代可懂性与庄重语体，没有将语义偏移为主要强调怜悯。
- source_word: וְיַצִּילְךָ
  choice: 救你脱离
  rationale: נצל 表示搭救、解救；“救你脱离”自然引出其后的危险或死亡意象。
- source_word: מִשָׁחַת
  choice: 脱离深坑
  rationale: שחת 可指坑、坟墓或毁灭。译作“深坑”保留具体意象及其死亡含义的开放性，避免直接限定为“阴间”“坟墓”或终极毁灭。
theological_decisions:
- issue: 上帝赐给义行者的儿子称谓
  choice: 上帝要称你为儿子
  alternative: 你将如同至高者的儿子
  rationale: 现存希伯来文本直接说上帝要称受话者为“儿子”，因此正文依从希伯来见证，不以希腊文本较缓和的比拟措辞取代它；希腊异文则在脚注中完整保留。
- issue: שחת 的死亡意象
  choice: 深坑
  alternative: 坟墓；毁灭
  rationale: “深坑”保留希伯来词的具象表达及其可能关联死亡的张力，而不把它单义化为坟墓、抽象毁灭或特定末世概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“称你为儿子”保留原文直接的亲子称谓；“施恩”延续经文语体但仍属现代常用表达；“深坑”保留死亡与毁灭的隐喻空间。
