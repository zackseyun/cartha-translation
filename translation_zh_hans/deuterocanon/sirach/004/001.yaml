base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/001.yaml
  text: My son[a], do not mock the life of the poor[b], and do not grieve a poor and bitter soul.
translation:
  language: zh_hans
  text: 我儿，不可嘲笑穷人的生活[a]，也不可使贫困、内心愁苦的人忧伤[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“不可剥夺穷人的生命”，也可理解为“不可剥夺穷人的生计”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文“内心”所译的词为“生命／心灵”（נפש），也可指自己或整个人；末句直译为“贫困而心灵愁苦的（人）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留希伯来智慧训诲中阳性单数的父子称呼，简洁而庄重。
- source_word: אַל תִּלְעַג
  choice: 不可嘲笑
  rationale: 该动词表达讥笑、蔑视；“嘲笑”在现代汉语中自然，并保留伦理谴责的力度。
- source_word: לְחַיֵּי עָנִי
  choice: 穷人的生活
  rationale: 贴近希伯来文“穷人的生命／生活”；“生活”既可指生活处境，也可含生计之意，同时不把语义过早限定为物质供应。
- source_word: וְאַל תַּדְאִיב
  choice: 也不可使……伤痛
  rationale: 该使役动词可指使人悲伤或痛苦；“使……伤痛”兼顾情感与更广义的苦楚。
- source_word: נֶפֶשׁ
  choice: 人（见脚注）
  rationale: נפש在此可指生命、自我、内在之人或整个人；正文用“人”形成自然汉语，脚注保留其丰富语义。
- source_word: עָנֵי וּמַר נָפֶשׁ
  choice: 贫苦、心中愁苦的人
  rationale: 将“贫苦的”和“心里苦的”理解为共同描述受困者，避免生硬直译“苦的灵魂”，又保留物质困乏与内心痛苦的并列张力。
theological_decisions:
- issue: 首分句希伯来文本与希腊平行文本的差异
  choice: 正文依现存希伯来文译为“不可嘲笑穷人的生活”
  alternative: 依希腊文译为“不可剥夺穷人的生命／生计”
  rationale: 希伯来文本在此存留且可信度高，应作为正文基础；希腊文反映显著异文，并可能指向剥夺生活资源，因此在脚注中完整保留。
- issue: 智慧训诲中的性别称呼
  choice: 我儿
  alternative: 我的孩子
  rationale: 原文是阳性单数“儿子”；正文准确保留其形式，不以中性称呼替代。
- issue: נפש的语义范围
  choice: 正文按整个人译为“人”，并以“心中愁苦”表达内在状态
  alternative: 灵魂／生命／自身
  rationale: 本句的נפש既可能指内在生命，也可转指整个人；译成“人”较自然，但脚注保留“生命、自己、心灵”等可能，避免把人论含义固定化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我儿”保留智慧文学的传统训诲语气；“贫苦、心中愁苦的人”避免僵硬的“苦魂”，同时呈现社会困乏与内心痛楚。所有脚注标记均已在正文出现。
