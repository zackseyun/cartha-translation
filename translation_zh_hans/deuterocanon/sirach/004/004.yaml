base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/004.yaml
  text: Do not withhold a gift from your poor man[a], and do not despise the request of the poor, nor give him occasion to curse you.
translation:
  language: zh_hans
  text: 不要扣留给你身边穷人的礼物[a]；不要轻看贫寒人的请求，也不要给他咒诅你的机会。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要拒绝困苦中的求告者，也不要转脸不顾穷人。”希腊文见证较短，未包含末尾关于给穷人机会咒诅你的话。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: 不要扣下
  rationale: מנע意为扣留、不予；“扣下”既贴近原文，也保留明知应当给予却不给的伦理力度。
- source_word: מַתָּן
  choice: 赠予
  rationale: 该词指礼物或给予之物。“赠予”不把含义限缩为制度化的“施舍”或“周济”。
- source_word: מִמִּסְכֵּנֶךָ
  choice: 本该给你所照顾的穷人
  rationale: 原文直译近于“你的穷人”。汉语若直说“你的穷人”容易被理解为所有关系；此译保留第二人称后缀所表达的责任关系，同时避免将其解释为占有。
- source_word: וְלֹא תִבְזֶה
  choice: 不要轻看
  rationale: בזה表示轻视、藐视；“轻看”自然、庄重，并传达把对方及其请求视为无足轻重之意。
- source_word: שְׁאֵלוֹת דָּל
  choice: 贫寒人的请求
  rationale: שאלות指请求、求告，דל指贫穷卑微的人；采用概括性单数，不额外强化为哀求。
- source_word: וְלֹא תִתֵּן לוֹ מָקוֹם
  choice: 也不要给他理由
  rationale: 字面为“不要给他地方”；在此是不要给对方可据以采取下一行动的缘由。“给他理由”符合现代汉语。
- source_word: לְקַלְלֶךָ
  choice: 咒诅你
  rationale: קלל在此指咒诅。保留直接而严肃的警告，不弱化为责骂或抱怨。
theological_decisions:
- issue: 希伯来文本与较短希腊平行文本之间的差异
  choice: 正文以现存希伯来文为主，保留关于“给他理由咒诅你”的末句。
  alternative: 按希腊文本译为：“不要拒绝困苦中的求告者，也不要转脸不顾穷人。”
  rationale: 本节有可信度较高的希伯来见证，故以其为正文依据；希腊见证明显较短，且没有末句，应在脚注中如实保存这一文本差异，而不混合两种读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“本该给你所照顾的穷人”用于传达希伯来文第二人称所属后缀中的责任关系；行文避免宗派化术语。脚注标记[a]已置于正文相关处。
