  text: Rescue the oppressed from his oppressors[a], and do not let your spirit grow impatient when judging rightly.
translation:
  language: zh_hans
  text: 要从欺压者手中救出受欺压的人[a]；秉公审判时，不要心生厌烦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“要侧耳听穷人的话，以温柔平和地回答他。”这里的希伯来文本却说，要救受欺压的人，并在秉公审判时不可心生厌烦。
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשַׁע
  choice: 救出
  rationale: 这是ישׁע的使役命令式，要求采取实际行动搭救；“救出”既表达紧迫性，也避免在此社会公义语境中加入不必要的神学限定。
- source_word: מוּצָק
  choice: 受欺压的人
  rationale: 此词表示承受压力、逼迫或亏待的人；“受欺压的人”自然清楚，并符合本节的司法与社会伦理语境。
- source_word: מִמְּצִיקָיו
  choice: 从欺压者手中
  rationale: 该词与מוּצָק词根相关，指施加压迫的人；用“从……手中”自然表达脱离其控制或伤害。
- source_word: וְאַל תָּקוֹץ רוּחֲךָ
  choice: 不要心生厌烦
  rationale: קוץ可表达厌烦、烦躁、不耐或憎恶；“心生厌烦”保留内在情绪层面及可能逐渐产生的意味，同时不把含义过窄地限定为“不耐烦”。
- source_word: בְּמִשְׁפַט יֹשֶׁר
  choice: 秉公审判时
  rationale: 该短语将审判与正直、公义相连；“秉公审判时”在现代汉语中自然，也保留其司法行动含义。
theological_decisions:
- issue: 希伯来文本与希腊平行文本显著不同
  choice: 正文采用现存希伯来文本，脚注保存希腊异文传统。
  alternative: “要侧耳听穷人的话，以温柔平和地回答他。”
  rationale: 本节有可信度较高的希伯来见证，应以其为正文依据；希腊文本在措辞和劝勉重点上均显著不同，故不将二者调和，而在脚注中完整说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受欺压的人／欺压者”保留希伯来原文的词根呼应；分号呈现两项紧密相关的劝诫。
