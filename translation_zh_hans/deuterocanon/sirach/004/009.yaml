  text: Be like a father to orphans[a], and in place of a husband to widows.
translation:
  language: zh_hans
  text: 要像父亲一样对待孤儿[a]，替寡妇承担丈夫的责任。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本的读法大不相同：“要从作恶者手中救出受欺压的人；你施行判断时，不要胆怯。”这很可能反映本节另一种文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה כְאָב
  choice: 要像父亲一样照顾
  rationale: הֱיֵה是命令式，כְאָב表示比较。中文用“要像父亲一样”保留比喻；补出“照顾”，自然表达两个间接宾语所隐含的关怀与担当，但不把受话者说成孤儿真正的父亲。
- source_word: לִיתוֹמִים
  choice: 孤儿
  rationale: יתומים指失去父亲或双亲的儿童；“孤儿”是现代汉语最清楚自然的对应。
- source_word: וּתְמוּר
  choice: 代替
  rationale: תמור表达替代、居于某人位置之意；“代替”简洁保留这种关系性的替补含义。
- source_word: בַּעַל
  choice: 丈夫
  rationale: 在与寡妇相连的家庭语境中，בעל指丈夫，而非主人或所有者。
- source_word: לְאַלְמָנוֹת
  choice: 照顾寡妇
  rationale: אלמנות意为寡妇。中文补出与前半句共用的“照顾”，使平行结构清楚自然。
- source_word: ἐξελοῦ ἀδικούμενον ἐκ χειρὸς ἀδικοῦντος
  choice: 不纳入正文
  rationale: 希腊文本与现存希伯来文本差异显著，可能见证本节另一种文本形态。此处希伯来证据完整且可信度高，因此正文据希伯来文翻译，并在脚注保留希腊异文。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本的显著分歧
  choice: 正文采用希伯来文本：劝人对孤儿如父，并代替丈夫照顾寡妇
  alternative: 采用希腊文本：“要从作恶者手中救出受欺压的人；你施行判断时，不要胆怯。”
  rationale: 《便西拉智训》有可靠现存希伯来文本时以希伯来文为主要依据。本节希伯来文本可信度高且已获验证；希腊文本则作为真实而重要的另一文本形态收入脚注，不将分歧静默消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“像父亲一样”保留希伯来文的比较语气；两处“照顾”使中文关系明确，同时避免生硬直译为“对孤儿作父亲、对寡妇代替丈夫”。脚注标记[a]置于“孤儿”之后，与替代整节的希腊异文相连。
