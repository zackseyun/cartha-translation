  text: Those who minister to her minister to the Holy One[a], and God loves those who love her dwelling.
translation:
  language: zh_hans
  text: 侍奉她的，就是侍奉圣者；上帝爱她居所的房屋。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“主爱那些爱她的人。”希伯来文本这里的措辞直译为“她居所的房屋”，且“居所”一词有文本上的不确定性；正文保留这一较难读法。
    reason: 异文与文本疑难
lexical_decisions:
- source_word: מְשָׁרְתֵי / מְשָׁרְתֶיהָ
  choice: 侍奉她的，就是侍奉
  rationale: שרת表示服侍、供职，常用于神圣或正式场合。“侍奉”在现代汉语中自然且庄重，也保留了希腊文 λατρεύοντες / λειτουργήσουσιν 所显示的敬拜与圣职色彩。
- source_word: קֹדֶשׁ
  choice: 圣者
  rationale: משרתי קדש句式简练，所指略有含混；结合希腊文 ἁγίῳ，可理解为“圣者”，既符合语境，也不把它径直化为抽象的“圣洁”或具体的“圣所”。
- source_word: וֵאלֹהִים
  choice: 上帝
  rationale: 希伯来文明确使用אֱלֹהִים，因此译作“上帝”，而不依希腊文ὁ κύριος译作“主”。
- source_word: בֵּית [מוֹשָׁבָהּ אָהֵב]
  choice: 爱那些爱她居所的人
  rationale: 现存希伯来文本似乎保留“房屋／居所”的措辞，虽然句法及文本均有疑难。正文优先保存这一较难读法，并以自然汉语表达；希腊文较简洁的异文收入脚注。
- source_word: אָהֵב
  choice: 爱
  rationale: אהב通常译为“爱”。保留同一词的重复，以呈现原文的修辞呼应。
theological_decisions:
- issue: 第二分句中的神圣称谓
  choice: 上帝
  alternative: 主
  rationale: 希伯来文主要见证作אֱלֹהִים，故正文译“上帝”；希腊传统作ὁ κύριος（“主”），但不取代希伯来文正文。
- issue: 第二分句中上帝所爱的人
  choice: 那些爱她居所的人
  alternative: 那些爱她的人
  rationale: 希伯来文似有“居所”的较难读法，虽经编辑括号标示而存在文本疑问；希腊文则作“那些爱她的人”。正文保留希伯来文的张力，脚注交代希腊异文。
- issue: קֹדֶשׁ的所指
  choice: 圣者
  alternative: 圣洁／圣所
  rationale: 原文表达压缩，可能容许不同理解。结合希腊平行文本及“侍奉”的神圣语域，译作“圣者”，但不进一步指名其身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“侍奉”保留圣礼性语域；“圣者”保持原文所指的凝缩与一定含混。脚注标记置于相关分句之后。
