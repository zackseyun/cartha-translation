  terminology: “侍奉”适合שרת的庄重服侍语域；“圣者”可保留קדש在此的凝缩和歧义，不擅自具体化为神、圣所或抽象的圣洁。“上帝”对应אֱלֹהִים；脚注中将希腊文κύριος译为“主”，清楚反映异读。
