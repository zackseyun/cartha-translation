  source_fidelity: 首分句可表达希伯来文“侍奉她的人／是圣者的侍从”的并置关系，且保留“圣者”这一压缩而未完全确定的所指。第二分句的草稿却将希伯来文中可见的“家／居所”短语改写为“爱她居所的人”，无论从现存希伯来文措辞还是其困难句法均无法支持；这实际上把希腊文“爱她的人”与希伯来文的居所语汇混合了。应在正文保留“她居所的房屋”这一较难、略显重复的希伯来文读法，并在脚注说明不确定性及希腊文异读。
