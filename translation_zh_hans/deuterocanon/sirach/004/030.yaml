translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“两面话的人”比“两面派”更紧扣上下文的言语主题；“让你的舌头养成这种习惯”保留希伯来语意象，并避免生硬的“训练你的舌头”。脚注标记按词义说明在前、文本异文在后排列。
