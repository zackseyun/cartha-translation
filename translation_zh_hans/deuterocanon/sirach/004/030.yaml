  text: Do not be called double-tongued[b][a], and do not train your tongue to it.
translation:
  language: zh_hans
  text: 不要让人称你为说两面话的人[a][b]，也不要使你的舌头习惯于此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“拥有两个〔事物〕的人”；这很可能是指言语两面、虚假或口是心非的人。下句所说的“舌头”支持这种理解。
    reason: lexical_alternative
  - marker: b
    text: 希腊语平行文本作：“不要在家中像狮子，也不要在仆人中装腔作势。”这与现存希伯来文本差异很大，可能反映不同的文本形态或解释传统。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּקָּרֵא
  choice: 不要让人称你为
  rationale: 保留希伯来语被动式“被称为”的语义，同时用现代汉语自然表达劝诫语气。
- source_word: בַּעַל שְׁתַּיִם
  choice: 两面话的人
  rationale: 原文直译为“拥有两个〔事物〕的人”，具体所指没有明说；下句提到舌头，表明这是关于言语反复或欺诈。“两面话的人”既呈现其言语层面的含义，又避免扩大为泛指人格的“两面派”。
- source_word: לְשׁוֹנְךָ
  choice: 你的舌头
  rationale: 保留原文以“舌头”指代言语行为的具体意象，在现代汉语中也容易理解。
- source_word: וְאֶל ... אַל תַּרְגֵּל
  choice: 也不要让……养成这种习惯
  rationale: רגל在此有使之习惯、训练之意；“养成这种习惯”自然表达持续操练而形成言语恶习的含义。“这种”回指上句的两面话。
