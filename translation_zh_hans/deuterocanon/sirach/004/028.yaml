  text: Do not sit with an unjust judge[a], for with him judgment will be according to his pleasure.
translation:
  language: zh_hans
  text: 不要与不义的审判者同坐[a]，因为你若同他审判，必会照他的心意裁断。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里有显著不同的读法：“要为真理奋斗，直到死；主上帝必为你争战。”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּשֵׁב
  choice: 不要……同席
  rationale: 保留“坐”的具体意象，同时用现代汉语“同席”表达与某人一同参与商议或审断，而不泛化为单纯居住。
- source_word: שׁוֹפֵט עַוָּל
  choice: 不公正的审判者
  rationale: שׁוֹפֵט 指作出裁断的人；עַוָּל 在司法语境中强调不公与枉法，故译为“不公正”，比宽泛的“邪恶”更贴切。
- source_word: כַאֲשֶׁר כִּרְצוֹנוֹ
  choice: 照他的心意
  rationale: 该短语表示裁断受此人的个人意愿支配；“照他的心意”既贴近原文，也保留其任意而为的负面含义。
- source_word: תִּשְׁפּוֹט עִמּוֹ
  choice: 你若与他一同审判，就会……裁断
  rationale: 动词是第二人称单数，直译为“你将与他审判”。中文用条件式衔接上下句，明确保留第二人称和共同参与审判的含义，不把它非人格化为抽象的“审判将会”。
theological_decisions:
- issue: 希伯来文本与希腊文本显著分歧时的正文依据
  choice: 以现存希伯来文为正文，并在脚注列出希腊异文
  alternative: 采用希腊文：“要为真理奋斗，直到死；主上帝必为你争战。”
  rationale: 本节有高可信度的希伯来文本，故据其翻译。希腊文并非近似对应，而是内容显著不同的文本传统；不将两者调和，也不以希腊文取代希伯来正文，但用脚注如实保存这一重要异文。
- issue: 第二分句的主语与责任归属
  choice: 保留第二人称：“你若与他一同审判”
  alternative: 非人格化处理为“与他同席，审判就会照他的心意”
  rationale: 希伯来语 תִּשְׁפּוֹט 是第二人称单数。保留这一形式可呈现经文对听者可能参与不义裁断的直接警告，同时不额外规定其具体司法身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“同席”保留原文“坐”的意象，并暗示参与审断；第二句用“你若……就会……”使希伯来语的第二人称和逻辑关系在中文中清楚可读。
