  text: For there is a shame that bears iniquity[b][a], and there is a shame that is glory and favor.
translation:
  language: zh_hans
  text: 因为，有一种羞耻会招致罪责[a]，也有一种羞耻却是尊荣和恩宠[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作“背负罪孽”，意思较为凝练；希腊文则作“导致犯罪”或“带来罪”。
    reason: 保留希伯来文难句及希腊平行文本所见的另一种理解。
  - marker: b
    text: “尊荣和恩宠”也可译作“荣耀和恩惠”。
    reason: 说明 כָּבוֹד 与 חֵן 的主要词义选择。
lexical_decisions:
- source_word: בֹּשֶׁת
  choice: 羞耻
  rationale: 该词兼有内心羞愧与社会耻辱的分量；“羞耻”在两句的对照中自然，也与希腊文 αἰσχύνη 相符。
- source_word: מַשְׂאֵת עָוֹן
  choice: 招致罪责
  rationale: 希伯来语表达高度凝练，字面可理解为“承担／背负罪孽”；参照希腊文“带来罪”，这里译作“招致罪责”，表达这种羞耻造成负面道德后果，同时不把 עָוֹן 仅限于罪行本身。
- source_word: עָוֹן
  choice: 罪责
  rationale: עָוֹן 可指罪孽，也可指由罪而来的责任或罪咎；“罪责”适合本句的结果语境。
- source_word: כָּבוֹד
  choice: 尊荣
  rationale: 该词可指荣耀或荣誉；“尊荣”保持庄重，并能清楚表达这种羞耻并非可耻，反而值得称许。
- source_word: חֵן
  choice: 恩宠
  rationale: 该词可指恩惠、眷爱或青睐；“恩宠”保留其典雅分量，又不明确限定施恩者是谁。
theological_decisions:
- issue: 首句 מַשְׂאֵת עָוֹן 的解释
  choice: 一种羞耻会招致罪责
  alternative: 一种羞耻会使人犯罪；一种羞耻是背负罪孽
  rationale: 希伯来语可直解为“背负罪孽”，希腊平行文本则明确呈现“带来罪”的结果意义。正文采用“招致罪责”，以希伯来文为主并借希腊文确认其负面结果，同时用脚注保留歧义。
- issue: 第二句的判断关系
  choice: 羞耻却是尊荣和恩宠
  alternative: 羞耻带来尊荣和恩宠
  rationale: 原文没有明示“带来”的动词，而以“尊荣和恩宠”直接描述这一类羞耻；译文保留这种紧凑而略带张力的判断关系。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因为”承接上下文；两个“有一种羞耻”保持原文的平行对照。“却是”凸显同一概念在道德效果上的反转，但不额外解释何种羞耻属于哪一类。
