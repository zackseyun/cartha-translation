  yaml_path: translation/deuterocanon/sirach/004/026.yaml
  text: Do not be ashamed to turn back from iniquity, and do not stand before the current of a river.
translation:
  language: zh_hans
  text: 不要羞于回头离开罪恶；也不要站在水流面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“不要羞于承认你的罪，也不要强行对抗河流的水流。”希伯来文与希腊文在前半句不同，后半句的动作也略有差异。正文依从现存希伯来文；希腊文表明这里的“水流”可理解为河流的水势。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּבוֹשׁ
  choice: 不要羞于
  rationale: בוש表示感到羞耻；“不要羞于”在现代汉语中自然、简洁，也与希腊文的对应动词一致。
- source_word: לָשׁוּב מֵעָוֹן
  choice: 回头离开罪恶
  rationale: שוב的基本意象是回转、返回，介词מִן表示离开；此译保留“回头离开”的动作意象，而不直接改写为带有较强神学术语色彩的“悔改”。עָוֹן在此指道德上的罪恶。
- source_word: וְאַל תַּעֲמוֹד לִפְנֵי
  choice: 也不要站在……面前
  rationale: 按希伯来文直译עמד与לפני的空间意象，保留面对危险水势而站立的警戒意味。
- source_word: שִׁבֹּלֶת
  choice: 河流的激流
  rationale: 该词在此可指水流或奔涌的水势；希腊文ῥοῦν ποταμοῦ明确支持河流之水流这一理解。“激流”比单说“水流”更能传达不可贸然抵挡的危险意象，“河流的”则借助古老希腊平行文本澄清较罕见的希伯来文用法。
theological_decisions:
- issue: 是否把לָשׁוּב译成明确的悔罪术语
  choice: 回头离开罪恶
  alternative: 为罪悔改／承认你的罪
  rationale: 希伯来文强调从罪恶中回转，希腊文则作“承认你的罪”。正文以现存希伯来文为准，不把两种表达合并，也不将其收窄为特定的悔罪仪式或神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“不要羞于”简练自然；分号呈现两个彼此呼应的禁令。正文保留希伯来文“回头离开”与“站在……面前”的具体意象，并以脚注交代希腊平行文本的异文。
