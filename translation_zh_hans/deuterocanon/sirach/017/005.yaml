  yaml_path: translation/deuterocanon/sirach/017/005.yaml
  text: He gave them counsel and a tongue and eyes[a], ears and a heart[b], to reason with.
translation:
  language: zh_hans
  text: 他赐给他们思量的能力[a]、舌头、眼睛、耳朵和心[b]，使他们能够思考。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “思量的能力”也可译作“谋虑”；希腊语指经过考虑而判断的能力。
    reason: lexical_alternative
  - marker: b
    text: 这里的“心”按圣经常见用法，是思想和意志所在的内在官能，不只是情感。
    reason: cultural_note
lexical_decisions:
- source_word: διαβούλιον
  choice: 思量的能力
  rationale: 该词在此指经过考虑、作出判断的内在能力；译为“思量的能力”既避免误解为别人所给的“劝告”，又保留其审慎思考的含义。
- source_word: γλῶσσαν
  choice: 舌头
  rationale: 保留原文所列的具体身体器官，并兼含说话功能，不抽象化为“语言”或“言语”。
- source_word: ὀφθαλμούς
  choice: 眼睛
  rationale: 按原文复数所指，用现代汉语自然的集合性名词“眼睛”，保留器官形象。
- source_word: ὦτα
  choice: 耳朵
  rationale: 保留原文具体器官的表达，不改译为抽象的“听觉”。
- source_word: καρδίαν
  choice: 心
  rationale: 保留圣经语境中“心”兼具思想、意志等功能的观念；下文“思考”提示其认知作用。
- source_word: ἔδωκεν
  choice: 赐给
  rationale: 主语承接上下文中的上帝；“赐给”自然、庄重，也符合受造者领受能力与器官的语境。
- source_word: διανοεῖσθαι
  choice: 使他们能够思考
  rationale: 不定式表达所赐各项的用途或结果；此译法在现代汉语中清楚自然，并保留思想活动这一核心意义。
- source_word: αὐτοῖς
  choice: 他们
  rationale: 与ἔδωκεν结合译为“赐给他们”，同时在目的分句中按汉语需要复现，使句意明确。
theological_decisions:
- issue: καρδία在人的诸种能力之列所具有的人论含义
  choice: 直译为“心”，并以“使他们能够思考”显出其认知功能
  alternative: 心智；悟性
  rationale: 圣经语境中的“心”不只指情感，也可指思想和意志。保留“心”可避免把原文的人观压缩成现代心理学范畴。
- issue: 是否把具体器官列表改写为抽象能力
  choice: 保留“舌头、眼睛、耳朵和心”的混合列表
  alternative: 言语、视觉、听觉和理智
  rationale: 原文有意并列能力与身体器官；保留这种表达可贴近其形式，也避免加入解释性改写。
- issue: διανοεῖσθαι与前列各项的句法关系
  choice: 译为目的或结果分句“使他们能够思考”
  alternative: 他们用这些来思考；赐给他们思想
  rationale: 希腊语不定式可表达所赐之物的用途或结果；中文采用“使……能够……”既通顺，也不限定思考只由列表中的某一项完成。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“思量的能力”说明抽象名词διαβούλιον的能力含义；其余项目保留具体器官名称。句末用“使他们能够思考”自然呈现希腊语不定式的用途或结果关系。
