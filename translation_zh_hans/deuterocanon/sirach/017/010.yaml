  text: He added knowledge to them[a], and he bequeathed to them the law of life.
translation:
  language: zh_hans
  text: 他又给他们增添了知识，并把生命的律法[a]赐给他们作产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赐生命的律法。”希腊文直译为“生命的律法”。
    reason: 说明属格结构可能具有的解释性含义，同时保留正文的形式对应。
lexical_decisions:
- source_word: προσέθηκεν
  choice: 又给……增添了
  rationale: 保留“增添、加给”的基本意义；“又”自然承接上文所述的其他恩赐。
- source_word: ἐπιστήμην
  choice: 知识
  rationale: 该词在此泛指知识或认识；译作“知识”既宽泛自然，也避免限定为技能或辨别力。
- source_word: νόμον ζωῆς
  choice: 生命的律法
  rationale: 按希腊文属格结构直译，保留“生命”与“律法”之间可能具有的多重关系，不在正文中径直解释为“赐生命的律法”。
- source_word: ἐκληροδότησεν
  choice: 赐给……作产业
  rationale: 表达该动词所含的遗赠、使人承受为业之意，同时比单说“分配”更充分地保留继承语义。
- source_word: αὐτοῖς
  choice: 给他们
  rationale: 两处与格代词的受益者意义均在译文中体现，使接受知识和律法的对象清楚。
theological_decisions:
- issue: νόμον ζωῆς应形式化译为“生命的律法”，还是解释为“赐生命的律法”
  choice: 生命的律法
  alternative: 赐生命的律法
  rationale: 希腊文仅以属格“生命”修饰“律法”，可指与生命有关的律法，也可能指带来生命的律法。正文保留这种张力，解释性读法列入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赐给……作产业”略带经文语体，但现代读者仍易理解，并能传达继承、遗赠的含义。脚注标记置于其实际所说明的“生命的律法”之后。
