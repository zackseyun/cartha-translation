  text: For each nation he appointed a ruler[a], and Israel is the Lord’s own portion.
translation:
  language: zh_hans
  text: 他为每个民族设立了一位首领，而以色列是主的份[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文连接词通常译作“和”或“并且”；此处也可能含有对照意味，因此译作“而”。
    reason: discourse_ambiguity
lexical_decisions:
- source_word: ἑκάστῳ ἔθνει
  choice: 为每个民族
  rationale: 与格短语具有逐一分配的意思；“为每个民族”符合现代汉语，也保留“各民族”的普遍范围。
- source_word: κατέστησεν
  choice: 设立了
  rationale: 该动词表示使某人居于某职位或委任其任职；“设立”自然地表达任命并赋予地位。
- source_word: ἡγούμενον
  choice: 一位统领
  rationale: 该分词指领导、治理的人。“统领”兼顾领导与治理之意，不限定为君王或某种特定政治职衔。
- source_word: καί
  choice: 而
  rationale: καί通常可译为“和、并且”，但此处两个分句在语义上可能形成对照；正文用“而”表达这种自然关联，并以脚注保留其也可作并列理解的歧义。
- source_word: μερὶς Κυρίου
  choice: 主的那一份
  rationale: μερὶς意为“份、份额”。“主的那一份”比“份额”更自然，也保留分配或归属的意象，未扩译为“产业”或“继承之物”。
- source_word: Ἰσραήλ
  choice: 以色列
  rationale: 采用现代汉语中通行的专名译法。
theological_decisions:
- issue: 各民族的统领与以色列归主之间的关系
  choice: 正文用“而”呈现可能隐含的对照，并用脚注说明原文连接词也可直译为“并且”。
  alternative: 译作“并且以色列是主的那一份”，将两句纯粹并列。
  rationale: 希腊文καί本身不强制表示转折，但上下文很可能将各民族所得的统领与以色列作为主之份相对照。正文体现自然语义，脚注则避免把这一对照当作原文唯一可能的句法关系。
- issue: “统领”的身份
  choice: 不说明其是人间君王、天使或其他属灵掌权者。
  alternative: 明确译作“君王”或“天使统治者”。
  rationale: ἡγούμενον只表明领导或治理者，单凭本节不足以确定其本体身份；译文保留原文的开放性。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“一位统领”避免过度具体化其职衔或身份；“主的那一份”保留分配与归属的经文意象，同时比生硬的“份额”更适合普通读者。
