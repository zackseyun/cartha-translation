  text: He gave them a fixed number of days and a set time[b][a], and he gave them authority over the things on it.
translation:
  language: zh_hans
  text: 他赐给他们有限的年日和指定的期限[a]，又赐给他们对地上事物的权柄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“指定的时日”。
    reason: 保留καιρός可指指定时日或适当时期的词义选择。
  - marker: b
    text: 原文直译为“在她上面的事物”；“她”很可能指上一节所说的大地。
    reason: 说明希腊文代词的回指和原句的省略表达。
lexical_decisions:
- source_word: ἡμέρας ἀριθμοῦ
  choice: 有限的年日
  rationale: 该属格结构表示人的日子是可数且有限的；“有限的年日”在现代汉语中自然、庄重，也保留寿命受限的含义。
- source_word: καιρόν
  choice: 指定的期限
  rationale: καιρός在此指划定或指定的一段时间，而非抽象的“时间”；“指定的期限”与前面的有限年日相应。
- source_word: ἐξουσίαν
  choice: 权柄
  rationale: 此词强调获授的管辖权或权利，不只是能力或力量；“权柄”能保留其委授性质。
- source_word: τῶν ἐπ᾿ αὐτῆς
  choice: 管理地上的一切
  rationale: 希腊文直指“在她／它上面的事物”，阴性代词最自然地回指上一节的“大地”。中文补出“地上”以避免代词指向不清，并以“管理”使ἐξουσία所支配的对象表达自然；“一切”概括带冠词的复数结构，但不限定为某一类受造物。
theological_decisions:
- issue: ἐξουσίαν τῶν ἐπ᾿ αὐτῆς所表达的人类管辖范围
  choice: 人获赐权柄，管理地上的一切
  alternative: 人获赐对大地本身的权柄；或笼统地获得支配尘世生命的能力
  rationale: 该短语承接创造语境，较可能指大地之上的事物，而非大地本身。译文表达获授的管辖权，却不加入“绝对占有”或特定的管家职分理论，以保留原文的范围与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“年日”保留智慧文学语感；正文适度明示代词所指以确保中文清楚，脚注则交代原文较含蓄的形式。
