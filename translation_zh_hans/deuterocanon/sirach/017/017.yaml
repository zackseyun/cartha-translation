  text: Their injustices were not hidden from him[a], and every sin of theirs was before the Lord.
translation:
  language: zh_hans
  text: 他们的不义没有向他隐藏[a]；他们所犯的每一项罪，都在主面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的不义没有瞒过他。”希腊文较直译为：“他们的不义没有向他隐藏。”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκρύβησαν
  choice: 不能……隐藏
  rationale: 希腊文为不定过去时被动语态，直译是“没有被隐藏”。中文用“不能向他隐藏”自然地表达这些不义未曾隐而不见，同时保留“隐藏”的意象，而不只释为“没有逃过注意”。
- source_word: αἱ ἀδικίαι αὐτῶν
  choice: 他们的不义
  rationale: ἀδικίαι 可指不义、恶行或不公正之事。“他们的不义”简洁庄重，涵盖违背正义的行为与性质，也与下半句的“罪”保持区别。
- source_word: ἀπ᾿ αὐτοῦ
  choice: 向他
  rationale: ἀπό 加属格在“隐藏”这一结构中表示隐瞒的对象。现代汉语说“向他隐藏”较“从他隐藏”自然，并未把所指明说为视线或注意力。
- source_word: πᾶσα ἁμαρτία αὐτῶν
  choice: 他们所犯的每一项罪
  rationale: πᾶσα 加单数名词具有逐一分配的意味。“每一项罪”突显没有任何一罪例外；补入“所犯的”使现代汉语通顺，但不增加实质信息。
- source_word: ἔναντι Κυρίου
  choice: 在主面前
  rationale: ἔναντι 表示“在……面前”或“在……眼前”。译作“在主面前”直接保留原文关于一切罪都呈露在主面前的空间性意象。Κυρίου 依希腊文本译为“主”。
theological_decisions:
- issue: 人的罪完全显露在神面前所暗含的神圣全知
  choice: 保留“不义不能隐藏”以及“每一项罪都在主面前”的双重陈述
  alternative: 意译为“他们的一切罪恶都逃不过主的察看”
  rationale: 原文通过“隐藏”和“在主面前”的意象表达罪无法避开神，却没有在本节中展开全知教义。正文因此不作教义化扩写，也不把两个分句合并。
- issue: 前半句“他”与后半句“主”的关系
  choice: 依原文先译代词“他”，后译“主”
  alternative: 两处都明译为“主”
  rationale: 希腊文前半句用 αὐτοῦ，后半句才用 Κυρίου。保留这一变化，既忠于措辞，也不额外消除原文指称结构。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“不义”保留智慧文学和宗教语境中的分量；分号对应原文两个紧密并列的分句。脚注标记置于相关短语之后。
