  terminology: “不义”适切对应ἀδικίαι，并与下句“罪”保持原文的词汇区分；“主”适切对应Κυρίου。“向他隐藏”自然表达ἀπ᾿ αὐτοῦ在此结构中的对象，不需将“他”扩写为“主”或“神”。
