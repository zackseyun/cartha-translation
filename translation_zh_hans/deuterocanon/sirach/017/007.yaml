translation:
  language: zh_hans
  text: 他把目光落在他们的心上[a]，为要使他们看见他作为的伟大。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他把自己的眼放在他们的心上。”希腊文直译为“他的眼”（单数）；“目光”是较自然的汉语表达，仍保留原文的拟人化意象。
    reason: 说明原文的单数形式、具体拟人化图像，以及正文采用较自然汉语表达的原因。
lexical_decisions:
- source_word: ἔθηκεν
  choice: 把……放在
  rationale: 直接保留 τίθημι 的具体动作含义；与“眼目”搭配虽带鲜明意象，却忠实于原文。
- source_word: τὸν ὀφθαλμὸν αὐτοῦ
  choice: 自己的眼目
  rationale: 保留希腊文单数的拟人化意象；“眼目”比单说“眼”更符合庄重而自然的汉语经文语体。
- source_word: ἐπὶ τὰς καρδίας αὐτῶν
  choice: 在他们心上
  rationale: 保留 ἐπί 的空间意象和 καρδία 的“心”这一内在人格隐喻，不将其窄化为思想或意志。
- source_word: δεῖξαι
  choice: 为要向他们显明
  rationale: 明确表达目的不定式；“显明”自然地传达展示、使人看见之意，并与前面的视觉意象呼应。
- source_word: τὸ μεγαλεῖον
  choice: 伟大
  rationale: 在“作为的伟大”中保留该名词所表达的宏伟、卓越性质，不限定为威严或某一件大事。
- source_word: τῶν ἔργων αὐτοῦ
  choice: 他作为的
  rationale: “作为”涵盖神所做的事及其行动成果，适合智慧文学语境；整体译为“他作为的伟大”。
theological_decisions:
- issue: 描写上帝察看人的拟人化语言
  choice: 保留“把自己的眼目放在他们心上”的具体意象
  alternative: 译作“看顾他们的心”或“留意他们的内心”
  rationale: 原文刻意将单数的“眼目”与人的“心”并置。直译保留身体意象与内在人格之间的张力，避免把它解释性地弱化为一般的关注或看顾。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眼目”“显明”“作为”保留智慧文学的经文质感；句法稍具原文意象性，但仍可理解。
