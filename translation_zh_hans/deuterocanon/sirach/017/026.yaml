  yaml_path: translation/deuterocanon/sirach/017/026.yaml
  text: For not everything can be in human beings, because a son of man is not immortal.
translation:
  language: zh_hans
  text: 原来，人不可能事事具备，因为凡人[a]不是不死之身。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“人的儿子”（或“人子”）；此处是泛指普通、必死的人，并非专门称号。
    reason: 说明υἱὸς ἀνθρώπου的字面形式及其在本节的泛指用法，避免将其误读为称号。
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 原来，并非
  rationale: γάρ承接上文并说明理由；“原来”自然地保留这种解释性联系，οὐ则与πάντα共同表达“并非一切都”。
- source_word: δύναται πάντα εἶναι
  choice: 一切都能存在
  rationale: δύναται表示可能或能力，εἶναι表示“存在、是”；置于“并非”之后，准确保留“不是一切都能……”的否定范围，避免误译成“一切都不能”。
- source_word: ἐν ἀνθρώποις
  choice: 在人身上
  rationale: ἀνθρώποις泛指人类；“在人身上”既保留ἐν的内在或附着关系，也比生硬的“在人类里面”更符合现代汉语。
- source_word: ὅτι
  choice: 因为
  rationale: 明确保留后半句作为前半句理由的因果关系。
- source_word: οὐκ ἀθάνατος
  choice: 并非不死
  rationale: ἀθάνατος意为“不死的、永生不死的”；采用“并非不死”保留希腊文简洁而带张力的否定表达，不扩写为其他死亡观念。
- source_word: υἱὸς ἀνθρώπου
  choice: 人子[a]
  rationale: 直译这一无冠词的闪语式表达，同时以脚注说明此处泛指有死的人，并非专名或称号。
theological_decisions:
- issue: υἱὸς ἀνθρώπου是称号还是泛指人
  choice: 保留“人子”，并注明此处泛指有死的人
  alternative: 直接译作“人”或“凡人”
  rationale: 智慧文学语境、无冠词形式以及关于不能不死的说明，都支持泛指普通人；正文保留原文意象，脚注则防止读者误解为后来的专门称号。
- issue: οὐ δύναται πάντα的否定范围
  choice: 并非一切都能
  alternative: 一切都不能
  rationale: 希腊文最自然地否定“全部皆能存在”，而非断言任何事物都不能存在；译文保留这一范围差别。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“原来”承接上文的解释关系；“并非一切都能”清楚表达否定范围。保留“人子”的原文意象，并借脚注化解现代读者可能产生的称号联想。
