  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: zh_hans
  text: 主的怜悯何其浩大！又有为回转归向他的人所预备的赎罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪”也可译为“除罪”或“使人和好”；此词指除去罪责并恢复关系的作为。
    reason: 说明ἐξιλασμός的词义范围；锚点直接置于对应术语之后。
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: 何其深厚
  rationale: ὡς加形容词构成感叹；用“何其”保留感叹语气，“深厚”自然修饰“怜悯”。
- source_word: ἐλεημοσύνη
  choice: 怜悯
  rationale: 此处指主的慈悲怜悯，并非“施舍”；“怜悯”准确、通俗且庄重。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: κύριος在此为神圣称号，按现代汉语习惯译作“主”。
- source_word: ἐξιλασμός
  choice: 施行赎罪
  rationale: 该名词涉及罪的除去及关系的修复；汉语以动词性表达较自然，同时避免用“挽回祭”等较窄或技术性较强的术语。
- source_word: τοῖς ἐπιστρέφουσιν
  choice: 为回转……的人
  rationale: 保留ἐπιστρέφω在宗教语境中悔改、转回的含义；“回转”比单说“转向”更能传达归回之意。
- source_word: ἐπʼ αὐτόν
  choice: 归向他
  rationale: 与“回转”连用，自然表达转回到主面前的方向性。
theological_decisions:
- issue: ἐξιλασμός的译法
  choice: 施行赎罪
  alternative: 赎罪；除罪；挽回
  rationale: “施行赎罪”保留除去罪责与恢复关系的语义，却不限定具体的赎罪理论。希腊文第二分句没有明示施事领属词，因此正文以语境中的主为施事作自然表达，并以脚注说明较直译的结构。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“何其”保留经文感叹力度；后句用动词性结构避免生硬的“他的赎罪”，脚注交代原文更简约且略有含混的名词句法。
