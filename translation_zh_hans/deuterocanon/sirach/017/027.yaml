  text: Who will sing praise to the Most High in Hades[c][b][a], instead of the living who give thanks?
translation:
  language: zh_hans
  text: 谁能在阴间赞美至高者，代替那些献上感谢的活人呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指死人所在的领域，不一定指最终受审判之处。末句也可译作：“代替那些献上感恩的活人呢？”
    reason: 说明ᾅδης的语义范围，并保留ἀνθομολόγησις可译为“感谢”或“感恩”的词义空间。
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: 至高者
  rationale: 与αἰνέσει相配的与格，表示赞美所归向的对象；“至高者”保留了这一神圣称号的称号性质。
- source_word: τίς αἰνέσει
  choice: 谁能赞美
  rationale: τίς引出反问，αἰνέσει是αἰνέω的将来时。汉语用“谁能”自然表达此处反问所含的可能性意味，同时不加入原文没有的“歌唱”。
- source_word: ἐν ᾅδου
  choice: 在阴间
  rationale: ᾅδης在此指死人所在的领域；“阴间”是现代汉语圣经语境中自然且范围合宜的表达，不把它限定为坟墓，也不等同于最终刑罚之地。
- source_word: ἀντὶ
  choice: 取代
  rationale: 保留该介词所表达的替代或代替关系；原句不是单纯把死人和活人并列对比，而是反问阴间中的人谁能代替活人赞美。
- source_word: ζώντων
  choice: 活人
  rationale: 将实词化分词简洁地译出，与“在阴间”的人形成明确对照。
- source_word: διδόντων ἀνθομολόγησιν
  choice: 献上感谢
  rationale: διδόντων表示给予、献上，ἀνθομολόγησις可指感谢、感恩或回应性的赞颂；“献上感谢”兼顾敬拜语境和现代汉语的自然表达。
theological_decisions:
- issue: ᾅδης在本节中的含义
  choice: 阴间，即死人所在的领域
  alternative: 坟墓；死者中；音译为“哈得斯”
  rationale: 本节着重对照死人和活人能否赞美至高者，并未明确谈论最终审判或永刑；“阴间”保留其范围和神学张力，避免过度解释。
- issue: 死人赞美与活人感谢之间的关系
  choice: 保留反问及ἀντί的替代意味
  alternative: 弱化为“死人不像活人那样赞美”
  rationale: 原文以“谁”发问并使用ἀντί，表达阴间中无人能取代献上感谢的活人；译文不把这一诗性陈述扩展为完整的死后状态教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文反问结构；“赞美”直接对应αἰνέω，避免增添“歌唱”的意思。脚注标记置于整节末尾，涵盖“阴间”和末句的词义说明。
