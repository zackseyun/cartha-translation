  text: Their ways are always before him[a]; they will not be hidden from his eyes.
translation:
  language: zh_hans
  text: 他们的道路始终在他面前[a]，绝不会向他的眼目隐藏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “道路”也可译作“行为”；这里指人的生活方式和行事为人，并非仅指实际行走的路。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ὁδοὶ αὐτῶν
  choice: 他们的道路
  rationale: ὁδοί本指道路，在智慧文学中也常喻指人的行事为人。译作“道路”既保留原文意象，也可自然承载生活方式和行为的含义。
- source_word: ἐναντίον αὐτοῦ
  choice: 在他面前
  rationale: 该短语表示处于某人面前、在其视野或临在之中。“在他面前”符合现代汉语，也保留原文具体的视觉意象。
- source_word: διὰ παντός
  choice: 始终
  rationale: 该习语表示持续不断或时时刻刻。“始终”简洁庄重，准确表达其连续性。
- source_word: οὐ κρυβήσονται
  choice: 绝不会……隐藏
  rationale: 这是κρύπτω的将来时被动态。译文保留将来陈述的语气；“绝”自然体现否定陈述的确定性，而不改写成能力意义的“不能”。
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ
  choice: 从他眼中
  rationale: 直译保留拟人化的视觉表达，并与前半句“在他面前”相呼应，清楚传达一切行为都在上帝察看之下。
theological_decisions:
- issue: 以拟人化视觉语言表达上帝的知晓
  choice: 保留“在他面前”和“从他眼中”
  alternative: 意译为“他全都知道”或“逃不过他的察看”
  rationale: 希腊文用具体的视觉意象表达上帝持续察看人的行为。保留这一表达，可维持智慧文学的语调及神学张力，避免将其抽象化。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“道路”保留智慧文学常见的生活道路隐喻；“始终”和“绝不会”使句意清楚有力，同时不把原文的将来被动形式改成能力判断。
