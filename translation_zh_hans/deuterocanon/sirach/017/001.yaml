  yaml_path: translation/deuterocanon/sirach/017/001.yaml
  text: The Lord created man from the earth[a], and returned him to it again.
translation:
  language: zh_hans
  text: 主从大地创造了人[a]，又使他归回大地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人类”或“一个人”；希腊原文用单数“人”，在这里代表全人类。
    reason: 说明ἄνθρωπον的单数形式及其代表性范围。
lexical_decisions:
- source_word: Κύριος
  choice: 主
  rationale: 作为对上帝的称谓，译作“主”简洁、庄重，符合现代中文圣经语体。
- source_word: ἔκτισεν
  choice: 造了
  rationale: κτίζω在此表示创造；“造了”自然凝练，并保留创造语境。
- source_word: ἐκ γῆς
  choice: 从尘土
  rationale: γῆ本可指“大地、土地、土”；结合人受造并归回其中的创造与死亡意象，“尘土”在中文中最自然，也能清楚表达物质来源。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 单数ἄνθρωπον在此以个体形式代表人类；中文“人”既保留单数表达，又不必额外限定性别。
- source_word: πάλιν
  choice: 又
  rationale: πάλιν表示再次或返回；与“归回”搭配时，“又”自然地保留其重复、回返含义，避免中文中“又……归回……再次”的赘余。
- source_word: ἀπέστρεψεν
  choice: 使他归回
  rationale: 该动词在此为使动意义，表示主使人返回；“使他归回”保留上帝为施事者，也符合庄重中文。
- source_word: εἰς αὐτήν
  choice: 尘土
  rationale: 阴性代词αὐτήν回指γῆ。中文若译“它”略显生硬，重述“尘土”可明确指代，并保持句意流畅。
theological_decisions:
- issue: ἄνθρωπον的指称范围
  choice: 正文译“人”，并以脚注说明单数具有代表全人类的用法。
  alternative: 译作“人类”或“一人”。
  rationale: 原文使用单数，可能带有亚当式的受造意象，同时泛指人类。“人”能在中文中自然保留这种个体与代表性之间的张力。
- issue: γῆ的语义与创造意象
  choice: 译作“尘土”。
  alternative: 译作“大地”或“土地”。
  rationale: γῆ自身语义较宽，但本句强调人从其中受造并归回其中；“尘土”最自然地传达这一创造—死亡结构，同时不把“人”明确等同于某一具名人物。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“从尘土……归回尘土”形成清楚的首尾照应；正文保留“人”的代表性单数，并避免生硬的代词回指。
