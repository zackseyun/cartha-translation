  text: All their works are before him like the sun[a], and his eyes are continually upon their ways.
translation:
  language: zh_hans
  text: 他们的一切行为在他面前都如太阳一般[a]；他的眼目不断注视他们的道路。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们的一切行为都如太阳一般在他面前。”这个比喻可能强调，人的行为在上帝面前完全显露。
    reason: 保留ὡς ὁ ἥλιος与ἐναντίον αὐτοῦ在汉语中可能的语序，并以“可能”说明太阳比喻所暗示的含义，不将解释写入正文。
lexical_decisions:
- source_word: ἅπαντα τὰ ἔργα αὐτῶν
  choice: 他们的一切行为
  rationale: ἅπαντα强调毫无遗漏的整体性；ἔργα在此指人的所作所为。译作“一切行为”自然、宽泛，也适合上下文。
- source_word: ὡς ὁ ἥλιος
  choice: 如太阳一般
  rationale: ὡς明确引出明喻。保留“太阳”的具体意象，不把其可能表达的显明、无可隐藏直接写入正文。
- source_word: ἐναντίον αὐτοῦ
  choice: 显在他面前
  rationale: ἐναντίον αὐτοῦ意为“在他面前”。结合太阳的比喻补出汉语所需的“显在”，传达行为完全呈现于上帝面前之意，同时由脚注保留较直译的表达。
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: 他的眼目
  rationale: 保留原文关于上帝的具体拟人意象，不抽象化为“洞察”或“知识”。“眼目”庄重且为现代读者易懂。
- source_word: ἐνδελεχεῖς
  choice: 时刻察看
  rationale: 该词表达持续不间断的关注。汉语不能自然地直译为“眼目是持续的”，故结合介词短语译为“时刻察看”。
- source_word: ἐπὶ τὰς ὁδοὺς αὐτῶν
  choice: 他们所走的道路
  rationale: ὁδοὺς本义为“道路”，也可隐喻生活方式或行事为人。“所走的道路”保留双重意涵，避免缩窄为抽象的“品行”。
theological_decisions:
- issue: 关于上帝认知的拟人表达
  choice: 保留“他的眼目”这一身体意象，并译作“时刻察看”。
  alternative: 他时刻洞察他们的行为
  rationale: 原文以“眼目”表达上帝持续的察看。保留此意象可避免把经文的具体语言消解为抽象神学陈述。
- issue: 太阳这一比喻的作用
  choice: 正文保留“如太阳一般”，并以“显在”使汉语句意完整。
  alternative: 他们的一切行为在他面前都像太阳一样
  rationale: 原文没有明说“明亮”或“无可隐藏”；因此不把某一种解释写死。“显在”表达呈现于面前的基本关系，脚注则保留更贴近希腊语形式的译法及其可能含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“行为”比“工作”更准确地涵盖人的所作所为；“眼目”和“道路”保留原文意象。“时刻察看”使希腊语形容词结构在汉语中自然呈现。
