  text: Return to the Lord and leave sins behind[b][a]; pray before his face and lessen stumbling.
translation:
  language: zh_hans
  text: 你要归向主，离弃罪恶；要在他面前祈求[a]，并减少绊脚之物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“在面前祈求”；“他”承接上文的“主”。也可译作“在主面前祈求”。
    reason: 说明省略的所指及希腊语惯用表达。
  - marker: b
    text: 或译“减少绊脚石”“减少使人跌倒的事”。原词可指障碍，也可指造成道德跌倒的因素。
    reason: 保留πρόσκομμα在具体障碍与伦理诱因之间的多义性。
lexical_decisions:
- source_word: Ἐπίστρεφε
  choice: 归向
  rationale: 该动词表示转回、返回；“归向”既保留朝向主的关系性和方向性，也不把它直接扩展为含义更宽的神学术语“悔改”。
- source_word: ἐπὶ Κύριον
  choice: 向主
  rationale: ἐπί加宾格在这里表示朝向某人；与“归”合为“归向主”，符合现代汉语，也保留κύριος的称号“主”。
- source_word: ἀπόλειπε
  choice: 离弃
  rationale: 该命令式表示离开、撇下。“离弃”简洁地表达与罪恶分离的要求，又不增添原文没有的具体行动方式。
- source_word: ἁμαρτίας
  choice: 罪恶
  rationale: 原文为复数，指各样的罪；现代汉语“罪恶”可自然地作集合表达，避免生硬的“诸罪”。
- source_word: δεήθητι
  choice: 恳求
  rationale: δέομαι在此特指带有祈求、求告意味的祷告；“恳求”比泛称“祷告”更贴近其请求语气。
- source_word: κατὰ πρόσωπον
  choice: 在他面前
  rationale: 原文直译近于“在面前／当着面”，未明说代词；根据前文“主”补出“他”，使汉语完整，同时保留直接来到主面前的意象。
- source_word: σμίκρυνον
  choice: 减少
  rationale: 该命令式意为使之变小、减轻或减少；“减少”自然明白，并未将其强化为彻底消除。
- source_word: πρόσκομμα
  choice: 绊脚之物
  rationale: 该词可指障碍、绊脚物或导致道德跌倒的因素。“绊脚之物”保留具体意象，也不限定它究竟是内在罪因、外在诱因，还是使别人跌倒之事。
theological_decisions:
- issue: κατὰ πρόσωπον未明说所属对象
  choice: 在他面前
  alternative: 在面前；当面；在主面前
  rationale: “他”由紧邻的“主”自然承接，只为满足汉语表达需要，并未增加新的神学对象；脚注同时交代原文的浓缩说法。
- issue: πρόσκομμα的伦理指向
  choice: 绊脚之物
  alternative: 绊脚石；使人跌倒的事；跌倒的因素
  rationale: 原文没有说明这是令自己还是令别人跌倒，也没有明确其内外性质；采用较开放的表达，以保留这种歧义。
- issue: σμίκρυνον所表达的程度
  choice: 减少
  alternative: 减轻；使……变小
  rationale: 原文要求使之变少或变小，并非明说完全除尽；译文保留这一程度上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体，以“你要……；要……”呈现连续命令。“归向主”“离弃罪恶”自然简洁；“绊脚之物”略带书面色彩，用来保留原文的具体比喻和未限定的伦理指向。脚注标记均紧随其所解释的短语。
