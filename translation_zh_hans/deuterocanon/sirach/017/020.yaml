  text: Yet to those who repent he granted a return[c][b][a], and he encouraged those who were failing in patience.
translation:
  language: zh_hans
  text: 然而，他赐给悔改的人一条归回之路[a][b]，又勉励那些在坚忍上渐渐不支的人。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一条归回之路”也可译作“归回”或“恢复”。
    reason: lexical_alternative
  - marker: b
    text: 此处希腊语来源的校验结果标为“重大不一致”，所以具体措辞需谨慎看待，不过全句大意仍较清楚。
    reason: textual_variant
  - marker: c
    text: 希腊语措辞十分紧缩，也可理解为“勉励那些渐渐不支的人要坚忍”。
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: 然而
  rationale: 表达与上文相对的转折，语气庄重而自然。
- source_word: μετανοοῦσιν
  choice: 悔改的人
  rationale: 保留现在时分词的实质用法和主动意味，指正在转意、悔改的人。
- source_word: ἔδωκεν
  choice: 赐给
  rationale: 对应“给予”，并自然表达此处行动的施予者是上帝。
- source_word: ἐπάνοδον
  choice: 一条归回之路
  rationale: 该词可指返回、归途或恢复；此译保持“归回”的核心意义，又不明确限定归回的具体层面。
- source_word: παρεκάλεσεν
  choice: 勉励
  rationale: 该动词兼有劝勉、鼓励和安慰等含义；“勉励”既体现扶持，也不把语义限于安慰或命令。
- source_word: ἐκλείποντας
  choice: 渐渐不支的人
  rationale: 该分词可表示衰退、气力不继或失败；“渐渐不支”保留其过程意味，也不限定为身体或属灵方面。
- source_word: ὑπομονήν
  choice: 在坚忍上
  rationale: “坚忍”体现持守和忍耐；介词结构在中文中保留其与“渐渐不支”及“勉励”之间较紧缩的关系。
theological_decisions:
- issue: 悔改语境中ἐπάνοδον的含义
  choice: 一条归回之路
  alternative: 归回；恢复
  rationale: 经文说明上帝回应悔改，却未具体界定这种“归回”是归向上帝、恢复关系还是复原处境，因此正文不将其扩展成完整的教义陈述。
- issue: παρεκάλεσεν ἐκλείποντας ὑπομονήν的句法关系
  choice: 勉励那些在坚忍上渐渐不支的人
  alternative: 勉励那些渐渐不支的人要坚忍；以坚忍扶持衰弱的人
  rationale: 希腊语表达紧缩，ὑπομονήν可理解为所劝勉的内容，也可能与不支之处或所给予的扶持有关。正文采用自然但仍较开放的表达，脚注保留其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“赐给……一条归回之路”比直译“赐给归回”自然，同时避免将ἐπάνοδον明确解释为某一种教义性的恢复；末句用“在坚忍上渐渐不支”保留原文的紧缩与一定歧义。
