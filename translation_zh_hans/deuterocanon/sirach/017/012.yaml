  text: Their eyes saw a majestic glory[a], and their ears heard the glory of his voice.
translation:
  language: zh_hans
  text: 他们的眼睛看见了壮丽的荣耀；他们的耳朵听见了他们声音的荣耀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传世希腊文本直译为“他们的耳朵听见了他们声音的荣耀”。这里两个“他们的”都对应希腊文 αὐτῶν，语意较难。按上下文，后一个代词也可能意指“他（上帝）的”，即“他们的耳朵听见了他声音的荣耀”。
    reason: 说明传世文本中重复使用的复数属格代词及其造成的困难，同时保留上下文所支持、但未被正文擅自采用的另一种理解。
lexical_decisions:
- source_word: μεγαλεῖον δόξης
  choice: 荣耀的壮丽
  rationale: μεγαλεῖον 表示宏伟、壮丽之物，与属格 δόξης 连用。译文保留两个名词之间的关系及本节庄重的语气，不把它改写成单纯的形容词。
- source_word: εἶδον οἱ ὀφθαλμοὶ αὐτῶν
  choice: 他们的眼睛看见了
  rationale: 希腊文明确以“他们的眼睛”为主语；直译可保留与后半句“他们的耳朵”之间的身体感官平行结构。
- source_word: δόξαν
  choice: 荣耀
  rationale: 在此指可彰显、可感知的荣美或威荣；“荣耀”既符合七十士译本的常见圣经用语，也保留前后两次 δόξα 词根的呼应。
- source_word: φωνῆς αὐτῶν
  choice: 他们声音的
  rationale: 所给 Swete 文本明确读作复数属格代词 αὐτῶν，即“他们的”。虽然语意困难，正文仍优先忠实呈现传世希腊文本，并在脚注说明上下文所容许的另一种理解。
- source_word: ἤκουσεν τὸ οὖς αὐτῶν
  choice: 他们的耳朵听见了
  rationale: 希腊文以单数“耳朵”表达集合或分配意义；现代汉语采用自然的复数式表达，并保留其与“眼睛看见”平行的句法。
theological_decisions:
- issue: “声音”的所属者
  choice: 正文译作“他们声音的荣耀”，依照传世希腊文 αὐτῶν。
  alternative: 按上下文理解为“他（上帝）声音的荣耀”。
  rationale: 本句希腊文重复使用 αὐτῶν，字面上是“他们的耳朵听见了他们声音的荣耀”，但上下文可能描述人听见上帝的声音。为避免未经文本证据便在正文中把复数“他们的”改成单数“他的”，正文保留困难读法，脚注交代较通顺且具上下文依据的另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“荣耀的壮丽”与“声音的荣耀”刻意保留原文中 δόξα 的重复和凝练意象；脚注不替正文武断解决代词指向。
