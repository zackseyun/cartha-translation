  text: And he said to them[a], “Watch yourselves against every injustice,” and he commanded each of them concerning his neighbor.
translation:
  language: zh_hans
  text: 他对他们说：“要提防一切不义的事[a]。”他又就邻舍的事吩咐他们各人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要谨防一切不义的事”或“要防备一切不义之事。”希腊文措辞简洁，可作这些相近的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ παντὸς ἀδίκου
  choice: 要提防一切不义的事
  rationale: προσέχετε 与 ἀπό 连用，在此表达警戒、远避之意；“提防”自然保留警示语气。“不义的事”既涵盖错误和不公的行为，也避免把形容词中性单数实词化得过于抽象。
- source_word: ἐνετείλατο
  choice: 吩咐
  rationale: 该动词表示带权威地命令或嘱咐；“吩咐”在现代汉语中庄重自然，并保留其权威性。
- source_word: ἑκάστῳ
  choice: 他们各人
  rationale: 明确呈现与格单数的分配意义，即命令分别落实到每一个人。
- source_word: περὶ τοῦ πλησίον
  choice: 当怎样对待自己的邻舍
  rationale: περί 表示关乎、关于；πλησίον 在伦理语境中指邻舍或身边的人。中文若直译为“关于自己的邻舍”略显悬空，因此以“当怎样对待”自然表达命令所涉及的关系范围，而不具体补入原文未说明的行为。
theological_decisions:
- issue: ἀδίκου 的伦理范围
  choice: 译作“不义的事”
  alternative: “不公”“一切恶事”
  rationale: 上下文随即提到邻舍，显示其社会伦理指向；“不义的事”既能包括不公和错误行为，又不把词义限制为司法层面的不公平，也不引入特定教义术语。
- issue: 单数“邻舍”的分配结构
  choice: 保留为“他们各人……自己的邻舍”
  alternative: “彼此”或“各自的邻舍们”
  rationale: 原文 ἑκάστῳ 与单数 τοῦ πλησίον 构成分配表达；保留单数和个体指向，可呈现每个人对邻舍所负的伦理责任。
- issue: περὶ 所引内容的省略
  choice: 以“当怎样对待”表达其关系性内容
  alternative: 直译“关于自己的邻舍”
  rationale: 希腊文措辞简约，没有说明具体命令内容。译文只补出中文句法所需的关系方向，不把命令具体化为爱、帮助或不可伤害，以保留原文的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“邻舍”保留圣经伦理语域；全句维持命令的权威口吻，并避免生硬照搬希腊语介词结构。
