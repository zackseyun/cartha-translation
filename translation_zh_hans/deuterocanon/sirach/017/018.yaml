base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/018.yaml
  text: A man's almsgiving is like a seal with him[b][a], and he will preserve a person's kindness like the pupil of the eye.
translation:
  language: zh_hans
  text: 人的施舍如同随身的印章；人的恩惠，必像保护眼中的瞳仁[b]一样受珍护[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的“必珍护”没有明说主语。可理解为泛指的施事者；结合上下文，也可能理解为“上帝必珍护”。
    reason: alternative_reading
  - marker: b
    text: 直译为“瞳仁”。这比喻像保护眼睛最敏感、珍贵的部分一样谨慎守护。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: 施舍
  rationale: 在希腊化时期的犹太语境中，此词常指向贫困者施予财物的怜悯行动；“施舍”具体、自然，也符合《便西拉智训》的相关用法。
- source_word: ἀνδρός
  choice: 人的
  rationale: 原文为阳性单数属格，但在这句智慧格言中泛指一个人；现代汉语用“人的”自然表达其概括意义，同时不必添加原文没有强调的性别信息。
- source_word: σφραγίς
  choice: 印章
  rationale: 直接保留原文比喻，不把它具体化为印戒；“印章”也能传达贴身保存、作为凭证的意象。
- source_word: μετ᾿ αὐτοῦ
  choice: 随身的
  rationale: 原义为“与他同在”；结合“印章”的意象，译作“随身的”是自然汉语，并保留紧随其人的含义。
- source_word: χάριν
  choice: 人所施的恩惠
  rationale: 此处与前半句的施舍平行，较可能指人给予别人的善意或恩惠。“恩惠”保留 χάρις 的宽度；加“所施的”说明这里指付诸行动的惠助，而非抽象的神学概念。
- source_word: ἀνθρώπου
  choice: 人所施的
  rationale: ἀνθρώπου 是泛指人的单数属格；“人所施的”以自然汉语表达其与“恩惠”的所属关系。
- source_word: κόρην
  choice: 眼中的瞳仁
  rationale: κόρη 在此指眼睛的瞳孔。“瞳仁”既贴近字面，也在汉语中能传达极其珍惜、谨慎保护的形象。
- source_word: συντηρήσει
  choice: 必……珍护
  rationale: 原文是将来时主动语态单数。“珍护”兼顾保存、守护以及瞳仁比喻所含的珍视意味；“必”体现将来陈述的确定语气。
theological_decisions:
- issue: 将来时动词 συντηρήσει 的隐含主语
  choice: 正文保留无明确先行词的“他”，并以脚注说明
  alternative: 明确译作“上帝必珍护”或改成泛指的“人必珍护”
  rationale: 希腊文动词为第三人称单数，却没有明说主语。上下文可能使读者理解为上帝，但本句本身没有点名。正文用“他”保留这一悬而未决之处，脚注列出可能的神学理解，避免替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。分号呈现两个平行分句；“随身的印章”保留紧密相伴的比喻，“珍护”使末句在中文中自然，同时不明确补出希腊文省略的主语。
