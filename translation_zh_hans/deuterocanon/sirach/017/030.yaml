  text: For not everything can be among human beings[a], because a son of man is not immortal.
translation:
  language: zh_hans
  text: 因为世人不可能样样俱全；凡人并不是不死的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ δύναται
  choice: 因为……不可能
  rationale: δύναται表示能力或可能性；结合否定词οὐ，译为“不可能”自然清楚。γάρ承接上文说明理由，译为“因为”。
- source_word: πάντα εἶναι ἐν ἀνθρώποις
  choice: 世人不可能样样俱全
  rationale: 原文表达简约，直译近于“一切不可能在人中存在”。“世人不可能样样俱全”保留人类不能拥有一切的概括含义，同时符合现代汉语习惯，不把“一切”具体限定为某类品德或能力。
- source_word: ἀνθρώποις
  choice: 世人
  rationale: 此处泛指人类，并非专指男性；“世人”简洁、自然，也能与下句“人子”形成呼应。
- source_word: ὅτι
  choice: ；
  rationale: ὅτι引出前句所述限制的根据。汉语以分号并列承接即可清楚表达因果说明，避免连续使用两个“因为”造成拗口。
- source_word: οὐκ ἀθάνατος
  choice: 并非不死之身
  rationale: ἀθάνατος意为“不死的、永生不死的”。“并非不死之身”保持原文否定形式，并自然表达凡人必死的性质。
- source_word: υἱὸς ἀνθρώπου
  choice: 人子
  rationale: 保留希腊文所反映的闪语式表达及原文质感；本处泛指必死的人，并非弥赛亚称号，故以脚注澄清。
theological_decisions:
- issue: υἱὸς ἀνθρώπου应按字面保留，还是按含义译作“人”或“凡人”
  choice: 人子
  alternative: 凡人
  rationale: 本句中的短语泛指人类个体，并未作为特定称号使用；正文保留字面表达以呈现源文特色，脚注则防止读者误解为弥赛亚称号。
- issue: 是否把πάντα具体解释为一切德性、能力或美善
  choice: 保留概括性的“样样俱全”
  alternative: 具备一切能力
  rationale: 希腊文本身没有明确限定πάντα所涵盖的范围，不宜在译文中补入某一特定神学或伦理解释。
translation_notes:
  register: 采用现代、庄重而通顺的汉语。“样样俱全”使压缩的希腊表达易于理解；分号保留两句之间的紧密解释关系，又避免汉语中连续重复“因为”。
