  - severity: low
    issue: “不死之身”的表达略有附加语感
    rationale: 原文仅称人不是ἀθάνατος（不死的、永生不死的）；“不死之身”自然但较具形象性。译为“不死的”更贴近原文谓词表达。
  revised_text: 因为世人不可能样样俱全；凡人并不是不死的。
