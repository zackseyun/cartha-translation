  text: What is brighter than the sun? Yet even this fails[b][a], and flesh and blood devises evil.
translation:
  language: zh_hans
  text: 有什么比太阳更明亮呢？连太阳也会失去光辉[a]；血肉之躯却图谋恶事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“连太阳也会亏蚀”，又或“连太阳也会消逝”；希腊语动词可表示衰退、停止、消失或发生亏蚀。
    reason: lexical_alternative
  - marker: b
    text: “血肉之躯”直译为“肉与血”，指必朽的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί φωτεινότερον ἡλίου
  choice: 有什么比太阳更明亮呢
  rationale: τί引出反问，比较级后接属格，按现代汉语自然表达为“有什么比……更……呢”。
- source_word: καὶ τοῦτο ἐκλείπει
  choice: 连太阳也会失去光辉
  rationale: τοῦτο回指太阳；ἐκλείπει可指衰退、消失或发生亏蚀。“失去光辉”保留其广义，不把含义限定为天文现象“日食”。
- source_word: πονηρὸς ἐνθυμήσεται
  choice: 却图谋恶事
  rationale: πονηρός在此与动词结合表达道德上的恶；ἐνθυμήσεται指在心里思量、盘算，译作“图谋”体现其内在筹划意味。
- source_word: σάρκα καὶ αἷμα
  choice: 血肉之躯
  rationale: 保留“肉与血”的具体意象，同时用现代汉语习用表达指有血有肉、必朽的人。
theological_decisions:
- issue: σάρκα καὶ αἷμα的人论表达
  choice: 血肉之躯
  alternative: 凡人；人类
  rationale: 保留原文具象的人体语言及人之有限、必朽的意味，不引入后期宗派性的人论解释。
- issue: ἐκλείπει所表达的太阳之有限性
  choice: 失去光辉
  alternative: 被遮蔽；消逝；衰败
  rationale: 原词兼有亏缺、停止、消失等可能；正文采用较宽泛的表达，脚注保留词义歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。反问句保持智慧文学的凝练语气；“却”呈现上下两分句之间的转折。所有脚注标记均置于正文相关词句之后。
