  text: He himself watches over the host of the height of heaven[b][a], and all men are earth and ashes.
translation:
  language: zh_hans
  text: 他亲自察看天上高处的万军[a]；所有人[b]都是土和灰烬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“天上高处的能力。”希腊词 δύναμις 可指“能力、力量”，在圣经用法中也可指天上的“军旅”。
    reason: lexical_alternative
  - marker: b
    text: “所有人”在这里指全体人类。
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμιν
  choice: 万军
  rationale: δύναμις虽为单数，在圣经希腊语中可指成队的力量或天上的军旅；译作“万军”能自然表达其集合性的宇宙语境，同时在脚注保留“能力”这一真实可能。
- source_word: ὕψους οὐρανοῦ
  choice: 天上高处
  rationale: 按描述性属格理解为“天的高处”，不将ὕψους过度解释为“至高者”这一神圣称号；“天上高处”符合现代汉语表达。
- source_word: ἐπισκέπτεται
  choice: 察看
  rationale: 该动词可表示探访、视察或看顾；“察看”既表达主动关注和监管，也不把含义限定为短暂探访或特别强调照料。
- source_word: οἱ ἄνθρωποι πάντες
  choice: 所有人
  rationale: 该短语虽使用语法阳性形式，却泛指全体人类；现代汉语用“所有人”准确而自然，无须引入男性限定。
- source_word: γῆ καὶ σποδός
  choice: 土和灰烬
  rationale: 依照希腊文本直译为“土和灰烬”，不套用较熟悉却并非原文字面的“尘土和灰烬”。
theological_decisions:
- issue: δύναμιν在天界语境中的含义
  choice: 万军
  alternative: 能力／力量
  rationale: 上下句形成天上受神察看者与地上脆弱人类的对照，“万军”较能体现可能的集合性、天军含义；但希腊词本身也确可指“能力”，故以脚注保留歧义。
- issue: οἱ ἄνθρωποι πάντες所指的范围
  choice: 所有人
  alternative: 所有男人
  rationale: 语法阳性在此具有泛指作用，指全体人类；译作“所有人”避免在汉语中误读为仅指男性。
- issue: ὕψους是否为神的称号
  choice: 天上高处
  alternative: 天上至高者
  rationale: ὕψους与οὐρανοῦ最自然地构成描述天之高度的短语；文本没有充分依据把它实体化为“至高者”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“察看”保留ἐπισκέπτεται兼有视察与关注的宽度；“土和灰烬”刻意贴近希腊原文，而不改成熟悉的固定说法“尘土和灰烬”。
