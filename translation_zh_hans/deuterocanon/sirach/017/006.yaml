  yaml_path: translation/deuterocanon/sirach/017/006.yaml
  text: He filled them with the knowledge of understanding[a], and showed them good and evil.
translation:
  language: zh_hans
  text: 他使他们充满明辨的知识，并向他们指明善与恶[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好事与坏事”。希腊语既可指道德上的善恶，也可指有益与有害的事物；本节语境较偏向道德辨别。
    reason: 保留ἀγαθὰ καὶ κακὰ的词义范围，避免把其含义完全限定为道德范畴。
lexical_decisions:
- source_word: ἐπιστήμην συνέσεως
  choice: 明悟的知识
  rationale: 将属格结构理解为“以悟性为特征的知识”，既保留两个名词之间的修饰关系，也避免生硬的“悟性的知识”；“明悟”表达理解、洞察之意。
- source_word: ἐνέπλησεν
  choice: 使……充满
  rationale: 直接体现“使充满、使满有”的使役含义，并与宾语“他们”及所充满之物自然衔接。
- source_word: αὐτούς
  choice: 他们
  rationale: 指向上下文所说的人类，采用现代汉语中自然的复数代词。
- source_word: ἀγαθὰ καὶ κακὰ
  choice: 善与恶
  rationale: 简洁保留原文成对的评价性概念；上下文侧重上帝赐予人的认知和道德辨别能力，但原词也可指好事与坏事，故以脚注保留歧义。
- source_word: ὑπέδειξεν
  choice: 指明
  rationale: 兼顾“展示、指出、使人看明”的含义；在抽象宾语“善与恶”前比“展示”更自然。
- source_word: αὐτοῖς
  choice: 向他们
  rationale: 明确呈现与动词相连的间接宾语关系。
theological_decisions:
- issue: ἀγαθὰ καὶ κακὰ 是指道德范畴，还是有益与有害之事
  choice: 正文译作“善与恶”
  alternative: “好事与坏事”或“有益与有害的事”
  rationale: 本节语境在于上帝赐给人认知与辨别的能力，“善与恶”较能呈现其道德分量；同时原文复数中性形容词名词化，也可泛指好的和坏的事物，因此用脚注保留另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“明悟的知识”保留原文紧凑的属格关系；“指明善与恶”清楚易懂，并借脚注呈现真实的词义歧义。
