lexical_decisions:
- source_word: ἐπάναγε
  choice: 归向
  rationale: 该命令式表达重新转回、朝向至高者之意；“归向”在现代汉语圣经语体中自然，也保留悔改和重新定向的含义。
- source_word: ἐπὶ Ὕψιστον
  choice: 至高者
  rationale: 介词短语表示行动所朝向的对象；“至高者”保留了Ὕψιστον作为上帝称号的性质。
- source_word: ἀπόστρεφε
  choice: 远离
  rationale: 现在命令式强调持续的道德转向；“远离”简洁表达从不义中转开的要求。
- source_word: ἀπὸ ἀδικίας
  choice: 不义
  rationale: ἀδικία可指不公、恶行或广义的不正；本节把归向上帝与道德转离并列，“不义”能保留其较宽泛的伦理与宗教含义。
- source_word: σφόδρα
  choice: 深深
  rationale: 该副词加强憎恶的程度；“深深”在现代汉语中自然，并保留强烈语气。
- source_word: μίσησον
  choice: 憎恶
  rationale: 原词是强烈的命令；“憎恶”不弱化其力度，同时比口语性的“恨”更符合庄重语体。
- source_word: βδέλυγμα
  choice: 可憎之事
  rationale: 该词指令人厌恶、可憎的事物；“可憎之事”保留道德上的强烈否定，又避免把语义无根据地限定为某一类仪式性禁忌。
