  yaml_path: translation/deuterocanon/sirach/017/004.yaml
  text: And he placed his fear upon all flesh[a], and to rule over beasts and birds.
translation:
  language: zh_hans
  text: 他使一切血肉都惧怕他[a]，又使他统管走兽和飞鸟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切血肉”也可译作“一切生灵”；希腊语原意为“一切血肉”，在这里泛指有生命的受造物。
    reason: 说明希腊语集合性习语的范围，并提供较自然的词义替代。
lexical_decisions:
- source_word: ἔθηκεν
  choice: 使……都
  rationale: τίθημι在此与“惧怕”连用，表达把对人的惧怕置于众生之上；汉语用使役结构更自然，也保留主动施加的语义。
- source_word: τὸν φόβον αὐτοῦ
  choice: 惧怕他
  rationale: φόβος指其他受造物对作为代表性人类的“他”所怀的惧怕；译作“惧怕”不过度强化为“恐怖”。αὐτοῦ保留为单数“他”。
- source_word: ἐπὶ πάσης σαρκός
  choice: 一切血肉之躯
  rationale: 保留σάρξ“血肉”的具体意象及πάσης的全称范围，同时用“之躯”使现代汉语可读；此处整体泛指有血肉的生灵。
- source_word: κατακυριεύειν
  choice: 使他统管
  rationale: 该不定式承接ἔθηκεν，表示赋予人统治的能力或权柄。汉语补出使役关系和由上下文可知的宾语“他”，避免照搬希腊语句法造成残句；“统管”保留其强于一般管理的管辖意味。
- source_word: θηρίων
  choice: 走兽
  rationale: θηρία指兽类，常可指野兽；“走兽”与后面的“飞鸟”构成自然、庄重的对举，又不必把范围限制为凶猛野兽。
- source_word: πετεινῶν
  choice: 飞鸟
  rationale: πετεινά指飞行之物，语境中即鸟类；“飞鸟”既准确又与“走兽”对称。
theological_decisions:
- issue: 人类代表的单数代词
  choice: 保留单数“他”
  alternative: 改为复数“他们”，明确指全人类
  rationale: 希腊文αὐτοῦ为单数，承接上下文中作为人类代表的“人”。保留单数既忠于原文，也不把代表性单数悄然改写为集合复数。
- issue: “一切血肉”的范围
  choice: 正文译作“一切血肉之躯”，脚注说明泛指一切有生命的受造物
  alternative: 正文直接译作“一切生灵”或“一切活物”
  rationale: 原文πάσης σαρκός具有具体的“血肉”意象，同时在此是广义集合说法。正文保留原文质感，脚注交代其惯用意义，不将其误解为保罗书信中与罪性相关的神学用法。
- issue: κατακυριεύειν的句法关系
  choice: 译为“又使他统管”，明确其承接前面的使役动词
  alternative: 直译为“并且统管”或理解为独立命令
  rationale: 不定式与前面的ἔθηκεν相连，语义上是神使人获得对兽类和鸟类的管辖。补出汉语所需的使役关系，不把它解释为命令，也不额外界定这种管辖的具体性质。
translation_notes:
  register: 采用现代、庄重而易懂的圣经叙事语体。“走兽和飞鸟”形成简洁对举；两处“他”按上下文分别指作为人类代表的人，虽在孤立经节中略有指代张力，仍保留原文的单数表达。
