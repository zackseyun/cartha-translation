translation:
  language: zh_hans
  text: 他与他们立了永远的约[a]，又把自己的典章[b]指示给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永恒的约”或“万世长存的约”。
    reason: lexical_alternative
  - marker: b
    text: “典章”或译“判决”或“法令”。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκην
  choice: 约
  rationale: 在圣经希腊语中，此词通常指具有神圣关系和约束力的“约”，而非一般协议；中文“约”简洁，并保留经文的立约意涵。
- source_word: αἰῶνος
  choice: 永远的
  rationale: 该属格结构表示此约长久延续。“永远的约”是自然、庄重的现代汉语圣经用语，同时脚注保留“永恒的／万世长存的”等可能表达。
- source_word: ἔστησεν
  choice: 立了
  rationale: 此动词表示设立、确立；汉语固定搭配“立约”准确而自然，也传达约被正式确立。
- source_word: μετ᾿ αὐτῶν
  choice: 与他们
  rationale: μετά加属格的基本义是“与”，保留立约关系的双方性，不改译为“为他们”或“在他们中间”。
- source_word: τὰ κρίματα αὐτοῦ
  choice: 自己的典章
  rationale: κρίματα可指判决、规章或法令。结合立约语境，“典章”较自然地表达神所颁示的规范，同时不局限于个别司法裁决；脚注保留其他译法。
- source_word: ὑπέδειξεν
  choice: 指示给
  rationale: 该词意为指明、展示或使人知道；“指示给他们”贴近原文动作性，并与前句保持简明并列。
theological_decisions:
- issue: 智慧文学语境中的立约措辞
  choice: 永远的约
  alternative: 永恒的约；万世长存的约
  rationale: 原文明确使用διαθήκη，不宜弱化为普通“协议”。“永远的约”保留其圣经神学分量，但不进一步指定这里所指的具体历史之约。
- issue: κρίματα在立约语境中的含义
  choice: 典章
  alternative: 判决；法令
  rationale: 该词兼有司法裁决与规范性法令的语义。“典章”适合中文立约语境，脚注则保存原词范围，避免把它仅仅解释为法规或审判结果。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“立约”为自然的圣经汉语搭配；用“自己的”清楚回指上帝。脚注标记按正文相关词语的先后排列。
