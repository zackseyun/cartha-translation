  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: zh_hans
  text: 主的怜悯何其广大！他为归向他的人所作的赎罪也何其广大[a]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪”也可译为“除去罪责”或“平息忿怒”；原词并未限定赎罪实现的具体方式。
    reason: 保留ἐξιλασμός的词义范围及其神学张力，避免正文锁定某一种赎罪理论。
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: 何其广大
  rationale: ὡς与形容词连用在此具有感叹语气；“何其广大”既保留感叹力度，也符合庄重而自然的现代汉语。
- source_word: ἐλεημοσύνη
  choice: 怜悯
  rationale: 该词虽可指“施舍”，但由“主”发出时，语境所指是上帝的慈悲和怜悯行动；“怜悯”最自然贴切。
- source_word: τοῦ κυρίου
  choice: 主的
  rationale: 在犹太智慧文学的语境中，κύριος是对上帝的尊称，译作“主”。
- source_word: ἐξιλασμός
  choice: 赎罪之恩
  rationale: 该词指罪责得以除去或关系得以修复的赎罪；“赎罪之恩”保留其神学分量，又使汉语名词结构自然，并不限定赎罪如何实现。
- source_word: τοῖς ἐπιστρέφουσιν
  choice: 回转归向……的人
  rationale: ἐπιστρέφω本义是转回、返回；“回转归向”保留悔改与重归上帝的方向性，而不直接改写成抽象的教义术语。
- source_word: ἐπ᾿ αὐτόν
  choice: 他
  rationale: 与ἐπιστρέφω连用，表示转向的对象；汉语置于“归向”之后，自然表达“归向他”。
- source_word: καί
  choice: 也
  rationale: 连接两个并列名词概念，并承接前句“何其广大”的感叹；“也是如此”在汉语中自然补足希腊文省略的比较述语。
theological_decisions:
- issue: ἐξιλασμός所表达的赎罪含义
  choice: 赎罪之恩
  alternative: 除罪；平息忿怒
  rationale: 正文采用涵盖面较广的“赎罪”，既表达罪责被处理，也不预先裁定其机制是侧重除罪还是平息忿怒；加“之恩”使句法自然，并与“主的怜悯”形成平行。
- issue: 回转与悔改的关系
  choice: 回转归向他
  alternative: 向他悔改；返回他那里
  rationale: 保留原文空间与关系性的转向隐喻，不把它完全术语化为“悔改”，也不把它局限为地点上的返回。
- issue: 第二分句的省略结构
  choice: 他赐给……的……也是如此
  alternative: 他也为……施行赎罪
  rationale: 希腊文第二分句没有明说动词，且可理解为承接“何其广大”。正文用自然汉语补出关系并保留平行感，避免把名词ἐξιλασμός过度改写成明确的施行动作。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“何其广大”保留原文感叹语气；第二句以“也是如此”承接前句，重现希腊文的并列与省略，同时避免生硬的逐词翻译。
