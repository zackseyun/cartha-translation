  text: Who will sing praise to the Most High in Hades[b][a], instead of the living who give thanks?
translation:
  language: zh_hans
  text: 在阴间[a]，谁能像那些活着并献上感谢[b]的人那样赞美至高者呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在死亡之地”或“在坟墓中”。希腊文作“在哈得斯”，这里指死者所在之境，并不特指最终受刑之地。
    reason: lexical_alternative
  - marker: b
    text: “献上感谢”也可译作“献上称谢”“表示感恩”或“作出承认”；原词在敬拜语境中兼有承认、称谢和感恩赞美的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: 至高者
  rationale: 与“赞美”相连的与格，表示赞美的对象；“至高者”准确保留犹太希腊文中对上帝的这一尊称。
- source_word: τίς αἰνέσει
  choice: 谁会赞美
  rationale: τίς引出反问；αἰνέσει是αἰνέω的将来时，核心义为“赞美”。中文用“会”自然表达其将来意味，不额外加入原文未明说的“歌唱”。
- source_word: ἐν ᾅδου
  choice: 在阴间
  rationale: ᾅδης在此指死者所在之境。“阴间”是现代中文圣经语境中自然且直接的对应词，也避免把它解释为最终刑罚之地。
- source_word: ἀντὶ ζώντων
  choice: 代替那些活着……的人
  rationale: ἀντί表达替代或对比；此处保留“代替”的直观关系，并以中文关系结构连接后面的分词。
- source_word: καὶ διδόντων ἀνθομολόγησιν
  choice: 并献上感谢
  rationale: 字面结构为“给予/献上承认、感谢或称谢”。在敬拜语境中译作“献上感谢”自然，同时用脚注保留“称谢、认信”等词义可能。
theological_decisions:
- issue: ᾅδης在本节中的含义
  choice: 译作“阴间”，理解为死者所在之境
  alternative: 坟墓；死亡之地；音译“哈得斯”
  rationale: 本节所强调的是死者与活人在赞美上帝方面的对比，并未明确陈述末后刑罚的教义；因此不将“阴间”解释成“地狱”。
- issue: 反问所表达的死者状态
  choice: 保留“谁会……呢”的反问，不把它改写为绝对教义命题
  alternative: 译成“没有人能在阴间赞美至高者”
  rationale: 原文采用反问形式；保留这一形式可避免超出本节，断言所有关于死后状态的细节。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“阴间”保留古代智慧文学关于死者之境的表达；句式维持原文的反问及“代替”的张力，不将其改写成系统教义命题。
