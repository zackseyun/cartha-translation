  yaml_path: translation/deuterocanon/sirach/017/024.yaml
  text: From the dead, as from one who no longer exists, thanksgiving perishes; but one who is alive and well will praise the Lord.
translation:
  language: zh_hans
  text: 死人如同已不复存在的人，称谢不再从他们发出；活着而健康的人必赞美主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: 从死人那里
  rationale: ἀπό加属格表示来源；译文以“从他那里”承接“死人”，表达称谢不再出于死者，同时保留原文单数的泛指作用。
- source_word: ὡς μηδὲ ὄντος
  choice: 如同已不复存在的人
  rationale: 保留ὡς所标明的比较语气。“已不复存在”自然传达μηδὲ ὄντος的修辞力度，但不把比较改写为关于死后状态的系统性断言。
- source_word: ἀπόλλυται
  choice: 消失
  rationale: 该中动/被动形式可指灭亡、失落或不复有；“消失”既保留生动意象，也符合称谢不再从死者发出的语境。
- source_word: ἐξομολόγησις
  choice: 称谢
  rationale: 该词在七十士译本中常指向上帝表达承认、感谢或颂赞。“称谢”兼有感谢与赞颂色彩，并与下句“赞美”形成紧密而不完全重叠的对应。
- source_word: ζῶν καὶ ὑγιὴς
  choice: 活着而健康的人
  rationale: 两个形容词性分词/形容词共同描述能够赞美主的人；此译简洁自然，保留“活着”与“健康”两个要素。
- source_word: αἰνέσει
  choice: 必赞美
  rationale: 保留将来时的陈述力量；在智慧文学的概括性语句中，“必”自然表达其确定性。
- source_word: τὸν κύριον
  choice: 主
  rationale: 在犹太圣经语境中，κύριος指上帝；现代中文经文通常译作“主”。
theological_decisions:
- issue: “如同已不复存在的人”对死者状态的含义
  choice: 保留为修辞性比较
  alternative: 直译为“如同不存在的人”，并将其理解为对死后存在的本体论断言
  rationale: 原文以ὡς明确引入比较，重点是死者不能在现世发出称谢，与活人赞美主形成对照。译文保留其尖锐张力，却不替经文建立或否定某种完整的死后论。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。前半句保留原文关于死者的强烈比较，后半句用简洁对句呈现与活人赞美主的对照。
