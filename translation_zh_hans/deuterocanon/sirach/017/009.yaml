  text: so that they might recount the mighty deeds of his works[a].
translation:
  language: zh_hans
  text: 好叫他们述说他作为中的伟大之事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“述说他作为中的大能之事。”也可译：“述说他作为的伟大。”
    reason: 说明τὰ μεγαλεῖα可较具体地指伟大或大能的事，也可作较抽象的理解；正文优先保留其复数、较具体的表达。
lexical_decisions:
- source_word: ἵνα
  choice: 为要使
  rationale: 引出目的；既保留目的含义，也能自然承接上下文中上帝赋予人的能力。
- source_word: διηγῶνται
  choice: 述说
  rationale: 表达有条理地讲述、传扬之意，比泛泛的“说”更贴近原词。
- source_word: τὰ μεγαλεῖα
  choice: 伟大之处
  rationale: 原文为复数，可指伟大的事或宏伟作为；与后面的“作为”连用时译为“伟大之处”，避免重复，同时保留该短语在具体大能之事与总体伟大之间的张力。
- source_word: τῶν ἔργων
  choice: 作为中的
  rationale: ἔργα 指所行之事或作为；用“作为”贴近原文，并以“中的”自然表达属格关系。
- source_word: αὐτοῦ
  choice: 他
  rationale: 按上下文指上帝；正文沿用原文代词，不另行增补“上帝”。
theological_decisions:
- issue: “他”的所指
  choice: 按上下文理解为上帝
  alternative: 在正文中直接译作“上帝”
  rationale: 《便西拉智训》17章上下文持续述说上帝对人类的创造与恩惠；保留代词则更忠实于本节希腊文。
- issue: τὰ μεγαλεῖα 是抽象的“伟大”还是具体的“大能作为”
  choice: 译作“伟大之处”，保留两者之间的语义空间
  alternative: 译作“大能之事”或“伟大作为”
  rationale: 该复数名词可指彰显威能的伟大之事，但紧接 τῶν ἔργων；不宜用重复结构强行限定为另一组“作为”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“为要使”保留目的结构；“述说”适合智慧文学语境。正文保留希腊语短语的语义张力，并用脚注列出主要译法。
