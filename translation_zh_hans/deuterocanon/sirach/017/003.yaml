  text: And he clothed them with strength[a], and made them according to his image.
translation:
  language: zh_hans
  text: 他使他们披上力量，又照着自己的形象造了他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照着自己的形象”也可译作“按他的形象”。这句话呼应《创世记》中创造人类的表述。
    reason: 说明κατά短语的可译方式及其明确的创造叙事互文。
lexical_decisions:
- source_word: ἐνέδυσεν
  choice: 披上
  rationale: 该动词本义为“穿上、给……穿上”；与“力量”搭配时，以“披上力量”保留希腊文鲜明的衣着隐喻，也符合庄重的现代汉语表达。
- source_word: ἰσχύν
  choice: 力量
  rationale: ἰσχύς表示力量、强健或能力；“力量”语义宽度适当，不将其强化为权柄或抽象能力。
- source_word: κατ᾿ εἰκόνα αὐτοῦ
  choice: 照着自己的形象
  rationale: “照着”贴近κατά加宾格所表达的依照、按照关系，并保留与《创世记》创造叙事的呼应；在汉语中，反身代词“自己的”清楚表明形象属于句子的主语。
- source_word: ἐποίησεν
  choice: 造了
  rationale: ποιέω本义宽泛，可指制作、造作；此处处于创造人类的语境，“造了”自然且能保留《创世记》的回响，但不额外扩展经文内容。
- source_word: αὐτούς
  choice: 他们
  rationale: 复数代词指前文所说的人类；“他们”直接保留复数指称。
theological_decisions:
- issue: κατ᾿ εἰκόνα αὐτοῦ所表达的《创世记》式神人形象关系
  choice: 照着自己的形象
  alternative: 按他的形象／依照他的形象
  rationale: 译文保留人类按上帝形象受造的互文联系，同时不进一步界定“形象”的性质或教义含义。“自己的”只消除现代汉语中代词所指的歧义，并未增添神学解释。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“披上力量”有意保留原文隐喻；两分句以“又”连接，贴近希腊文并列结构。脚注标记置于整节末，所注释的是第二分句。
