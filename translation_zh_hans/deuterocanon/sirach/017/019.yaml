translation:
  language: zh_hans
  text: 此后，他必起来报应他们[a]，把他们的报应归到他们头上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “起来”也可译作“起身”。希腊文以起身的形象表现果断采取行动。
    reason: lexical_alternative
  - marker: b
    text: “归到他们头上”是形象说法，意指他们自己承受相应的后果。
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 明确表达时间上的先后关系，简洁自然，对应“这些事以后”。
- source_word: ἐξαναστήσεται
  choice: 他必起来
  rationale: 保留动词“起来”的具体形象及其所表现的果断行动，不将其淡化为泛指的“采取行动”。
- source_word: ἀνταποδώσει
  choice: 报应他们
  rationale: 体现针对先前行为作出相应回报的双向、追偿含义；在本节审判语境中，“报应”自然且庄重。
- source_word: τὸ ἀνταπόδομα αὐτῶν
  choice: 他们应得的报偿
  rationale: “报偿”与前句“报应”保持同一语义场，并用“应得的”表达此处归给他们的相应回报，而不擅自说明具体罪行。
- source_word: εἰς κεφαλὴν αὐτῶν
  choice: 归到他们头上
  rationale: 保留希腊文及圣经传统中“临到头上”的形象说法，表示行为的后果回到本人身上。
- source_word: ἀποδώσει
  choice: 归到
  rationale: 在“归到……头上”的汉语结构中自然表达交付、归还之意，同时避免机械重复“报应”。
theological_decisions:
- issue: 审判语言中神的行动性质
  choice: 保留“他必起来报应他们”这一人格化且带有相应报偿意味的表述
  alternative: 他必采取行动，使他们承受自己行为的后果
  rationale: 希腊文描写的是主动而亲自施行的相应回报；译文不把它弱化为纯粹非人格化的自然后果，也不超出原文界定报应的具体方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”传达将来行动的确定性；保留“起来”和“归到……头上”的具体形象，同时以脚注说明其含义。
