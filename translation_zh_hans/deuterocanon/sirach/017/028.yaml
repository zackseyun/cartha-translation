base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/028.yaml
  text: From the dead[a], as from one who no longer exists, praise perishes; but one who is alive and well will praise the Lord.
translation:
  language: zh_hans
  text: 死人如同不复存在的人，颂赞便从他那里消失；活着且健康的人必赞美主。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: 从死人那里
  rationale: 单数名词在这里具有泛指作用，指任何死去的人；此译法自然，并保留介词ἀπό所表达的来源关系。
- source_word: ὡς μηδὲ ὄντος
  choice: 仿佛他已不复存在
  rationale: 按修辞性比较来表达死人如同不再存在，并不把这句话扩展为关于死后存在状态的形而上断言。
- source_word: ἀπόλλυται
  choice: 消失
  rationale: 该动词可表示灭亡、失去或不复存在；与‘颂赞从死人那里’搭配时，‘消失’既清楚又保留原文的强烈语气。
- source_word: ἐξομολόγησις
  choice: 颂赞
  rationale: 该词虽可指承认、宣认或感谢，但与下半句αἰνέσει‘必赞美’形成平行，因此此处以对主的颂赞为主要含义。
- source_word: ζῶν καὶ ὑγιὴς
  choice: 活着而健康的人
  rationale: 分别保留ζῶν‘活着’与ὑγιής‘健康、健全’两个要素，并与前半句的死人形成鲜明对照。
- source_word: αἰνέσει τὸν κύριον
  choice: 必赞美主
  rationale: 以‘必’表达希腊语将来时在格言语境中的确定意味；κύριος在此犹太智慧文学语境中指上帝，译作‘主’。
theological_decisions:
- issue: ἐξομολόγησις应译为认罪、感谢还是颂赞
  choice: 正文译作‘颂赞’，脚注保留‘感谢、宣认’等可能
  alternative: 译作‘认罪’或‘感谢’
  rationale: 与αἰνέσει τὸν κύριον‘必赞美主’的平行关系支持赞美或感谢之义；译作‘认罪’会无根据地引入悔罪含义。
- issue: ‘仿佛他已不复存在’是否断言死人完全不存在
  choice: 保留为修辞性比较
  alternative: 将其解释为对死后状态的明确教义陈述
  rationale: ὡς表明这是比较性说法，重点在死人不能发出颂赞；译文不应超出本节而解决其未明确讨论的死后存在问题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不复存在”保留原文凝练的修辞力度；分号呈现希腊文中死人与活着且健康之人的对照。
