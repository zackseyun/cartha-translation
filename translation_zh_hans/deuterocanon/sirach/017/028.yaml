review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands ἐξομολόγησις in this context as praise/thanksgiving and retains the rhetorical, rather than metaphysical, force of ὡς μηδὲ ὄντος. However, the Chinese word order makes it initially sound as though the praise itself is 'as if he no longer exists,' rather than identifying the dead person as one who is as though nonexistent.
  naturalness: The draft is generally clear and suitably dignified, but 「颂赞从死人那里消失，仿佛他已不复存在」is syntactically awkward in Mandarin and shifts the comparison to an unclear antecedent. Reordering produces a natural and unambiguous proverbial contrast.
  terminology: 「颂赞」and 「赞美主」appropriately reflect the parallel Greek terms. 「活着且健康的人」preserves both ζῶν and ὑγιής. 「主」is appropriate for κύριον in this context.
  issues:
  - severity: medium
    issue: The comparative phrase has an unclear attachment in the Chinese sentence.
    rationale: 'In Greek, ὡς μηδὲ ὄντος characterizes the dead person: ''from a dead person, as from one who does not exist.'' In the draft, its placement after 「颂赞从死人那里消失」can be read as qualifying 「颂赞」or leaves 「他」without a clean antecedent. Reordering retains the intended rhetoric and avoids ambiguity.'
  revised_text: 死人如同不复存在的人，颂赞便从他那里消失；活着且健康的人必赞美主。
  revised_footnotes:
  - marker: a
    text: “颂赞”也可译作“感谢”或“宣认”。这个希腊词也可表示“承认”或“认罪”，但这里与下半句“赞美主”相呼应，较可能指颂赞或感谢。
    reason: 词义存在多种可能；脚注保留其语义范围，并说明上下文较支持的含义。
  revision_rationale: 将「如同不复存在的人」紧接「死人」，使比较对象明确对应希腊文的 νεκροῦ ὡς μηδὲ ὄντος；以「颂赞便从他那里消失」自然表达 ἀπόλλυται ἐξομολόγησις，且不把此句扩展为死后存在状态的教义断言。其余关键术语及平行结构均予保留。
