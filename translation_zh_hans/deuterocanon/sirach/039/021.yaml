  text: One should not say[a], “Why this and why that?” For everything will prevail in its time.
translation:
  language: zh_hans
  text: 不可说[a]：“这个为什么？那个为什么？”因为万物都必在各自的时候显出力量。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“因为万物都是为各自的需要（或‘用途’）而造的。”希伯来文作：“因为万物都必在各自的时候显出力量。”
    reason: alternative_reading
lexical_decisions:
- source_word: אין לאמר
  choice: 不可说
  rationale: 希伯来语字面为“没有可说的”，在此表达一般性的劝阻；“不可说”简洁、庄重，也不把它改成仅针对某一位听者的命令。
- source_word: זה למה זה
  choice: “这个为什么？那个为什么？”
  rationale: 保留原文“这个……那个……”的重复和质问语气；采用两个短问句，使现代汉语自然清楚。
- source_word: כי
  choice: 因为
  rationale: 直接表达后半句对前面劝阻所给出的原因。
- source_word: הכל
  choice: 万物
  rationale: 语境所指范围广，包括一切受造之物或事物；“万物”符合智慧文学的庄重语体。
- source_word: בעתו
  choice: 在各自的时候
  rationale: 原文为单数并带第三人称后缀，指每一事物所属或合宜的时间；“各自”在汉语中明确呈现这种分配意义，而不额外加入“命定”等解释。
- source_word: יגבר
  choice: 显出力量
  rationale: גבר 的基本意义是强盛、占优势。这里“显出力量”保留其力量意象，又比“必得胜”少引入争战或竞争含义。
theological_decisions:
- issue: 希伯来文与希腊文后半句存在重大异文
  choice: 正文依据现存且可信度高的希伯来文，译作“因为万物都必在各自的时候显出力量”。
  alternative: 希腊文可译作“因为万物都是为各自的需要／用途而造的”。
  rationale: 希伯来文见证在此完整可用，应作为正文依据；希腊文则表达受造目的和用途，语义差异显著，因此以脚注保存，不将两种读法调和成一个解释性译文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可说”保留格言式的一般劝诫；“显出力量”维持希伯来文 גבר 的开放性，避免把它过度解释为“有用”“合宜”或“得胜”。
