  text: Do not say[a], “This is bad[b]; what is this?” for everything will prevail in its time.
translation:
  language: zh_hans
  text: 不要说：“这个比那个坏。”因为万物各在其时都会显为美好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来语本句较难理解，字面可近似译作“这是坏的；这是什么？”末尾的动词也可译作“必占优势”或“必兴盛”。希腊平行文本则明确作“这个比那个坏”，并说万物到了时候都会得到认可或显为美好。
    reason: textual_variant
lexical_decisions:
- source_word: אל לאמר
  choice: 不要说
  rationale: אל在此作禁止语气，לאמר与之合译为自然的现代汉语命令；希腊文οὐκ ἔστιν εἰπεῖν也支持不可这样说的意思。
- source_word: זה רע מה זה
  choice: 这个比那个坏
  rationale: 现存希伯来语措辞较为生硬；希腊平行文本Τοῦτο τούτου πονηρότερον明确呈现比较义，因此译出“这个比那个坏”，同时以脚注保留文本困难。
- source_word: הכל
  choice: 万物
  rationale: 表达包举一切受造事物的整体范围，比口语化的“所有东西”更符合本书庄重的智慧文学语体。
- source_word: בעתו
  choice: 到了各自的时候
  rationale: 希伯来语为单数形式并带第三人称后缀，按汉语习惯以“各自”明确分配关系，不额外加入“指定”这一解释。
- source_word: יגביר
  choice: 都会显出其美善
  rationale: 该动词在此语境中难解；若机械译作“占优势”不易与上句衔接。希腊文εὐδοκιμηθήσεται支持“得到认可、显为良善／兴盛”的正面结果，故采用自然而仍留有结果性意味的译法。
theological_decisions:
- issue: 如何处理希伯来文本的困难措辞与希腊平行文本的澄清
  choice: 把上半句译为不可断言一物比另一物坏，下半句译为万物适时显出美善。
  alternative: 严格依照现存希伯来语表层形式译为“不要说：‘这是坏的；这是什么？’因为万物在其时必占优势”。
  rationale: 希伯来语见证优先，但本句存在公认的措辞困难与轻微文本不合；希腊平行文本清楚保留比较结构，并为末尾动词提供正面评价的语境。正文采用这一较连贯的理解，脚注则公开说明歧义，避免把重构伪装成毫无疑问的读法。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“万物”保持概括性；“显出其美善”不把经文扩展为关于恶本身必然为善的系统性命题，而是保留其关于事物各有合宜时机的张力。
