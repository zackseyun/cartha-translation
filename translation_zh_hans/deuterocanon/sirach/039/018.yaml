  text: The desire of his will succeeds[a], and there is no hindrance to his salvation.
translation:
  language: zh_hans
  text: 他所愿的必成就[a]；没有什么能拦阻他的拯救。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所喜悦的必亨通。”希腊文平行文本作：“一切美意都在他的命令之下；也没有人能削减他的拯救。”
    reason: 说明תאות רצונו可指他所愿、所喜悦之事，并列出希腊文平行文本的重要措辞差异。
lexical_decisions:
- source_word: תאות רצונו
  choice: 他旨意所愿的
  rationale: תאות可指“愿望”或“所愿之事”，רצונו可指“他的旨意、意愿或喜悦”。合译为“他旨意所愿的”，既保留原文的意志表达，也比直译“他旨意的愿望”更符合现代汉语。
- source_word: יצליח
  choice: 必成就
  rationale: צלח的使役式可表示成功、亨通或顺利实现。此处主语是上帝所愿之事，“必成就”自然地表达其旨意有效实现，并以“必”传达该陈述的确定语气。
- source_word: מעצור
  choice: 能拦阻
  rationale: מעצור指阻碍、约束之物，也可在语境中指实施阻拦者。译作“没有什么能拦阻”保留希伯来文广义的阻碍概念，同时采用自然的现代汉语句式。
- source_word: תשועתו
  choice: 他的拯救
  rationale: תשועה可指救恩、解救、得救或胜利，希腊文σωτήριον也支持救助、救恩之义。“他的拯救”在此侧重上帝施行拯救的行动与能力，避免把智慧文学语境过度限定为后期系统神学意义。
theological_decisions:
- issue: תשועתו应译为较专门的“救恩”，还是较宽泛的“拯救”
  choice: 他的拯救
  alternative: 他的救恩；他施行的解救
  rationale: 本节泛论上帝旨意的实现及其救助不受阻挡。“拯救”可涵盖属灵救恩和现实解救，保留希伯来词在此处的语义宽度，而不排除其神学分量。
- issue: 是否将תאות רצונו明确解释为上帝所喜悦的人或事
  choice: 他旨意所愿的
  alternative: 他所喜悦的；他所愿的事
  rationale: 原文可表达愿望本身，也可表达所愿之事。正文不进一步限定对象，以保存这种真实的词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“旨意”保留经文语体与神学分量，“所愿的必成就”使句法易懂；后半句用“没有什么能……”自然表达绝对无可阻挡之意。脚注标记[a]已置于正文相应词句之后。
