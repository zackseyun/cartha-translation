  text: With the service of harp and instruments of music[c][b][a], so you shall speak with a shout of praise.
translation:
  language: zh_hans
  text: 在竖琴[a]和各种乐器的伴奏下，你们要这样高声欢呼[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竖琴”也可译作“里拉琴”。希伯来文所指的是一种古代弦乐器，其确切形制难以确定。
    reason: lexical_alternative
  - marker: b
    text: “高声欢呼”也可译作“喝彩”或“发出呼声”；这个希伯来词有时也可指号角般的响声。
    reason: lexical_alternative
  - marker: c
    text: 本节的希腊文平行文本篇幅长得多，明确呼吁人称颂主、将伟大归于他的名；这里的希伯来文见证只保留了有关乐器伴奏和欢呼的部分。
    reason: textual_variant
lexical_decisions:
- source_word: בשירות
  choice: 伴着……的演奏
  rationale: 该词在这里指向音乐性的服事或演奏；结合后面的弦乐器和各样乐器，译为“伴着……的演奏”既自然，也保留礼仪音乐的语境。
- source_word: נבל
  choice: 竖琴
  rationale: 该词指古代弦乐器，但其确切形制难以确定；“竖琴”是现代读者容易理解的近似译名，脚注保留“里拉琴”等可能。
- source_word: כלי מינים
  choice: 各样乐器
  rationale: כלי意为器具或乐器，מינים意为种类；合起来最自然地表示各种乐器。
- source_word: וכן
  choice: 也要这样
  rationale: 保留“如此、这样”的方式含义，并以“也要”顺畅衔接前面的音乐演奏。
- source_word: תאמרו
  choice: 你们……欢呼
  rationale: 该动词本义为“说”；与介词短语בתרועה连用时，中文用“欢呼”可自然表达以呼声发言的动作，而不是另加一层重复的“说”。
- source_word: בתרועה
  choice: 高声欢呼
  rationale: תרועה可指响亮的欢呼、喝彩，也可指号角般的响声；此处音乐礼赞的语境支持“高声欢呼”，同时用脚注保留其他可能。
theological_decisions:
- issue: 希伯来文本与较完整的希腊平行文本有重大差异
  choice: 正文只翻译现存希伯来文所保留的音乐与欢呼部分
  alternative: 按希腊文增译“要因主的一切作为称颂他，使他的名显为伟大”等内容
  rationale: 本项目在《便西拉智训》有希伯来文见证时以希伯来文为首要依据。希腊文可帮助确认礼赞语境，却不应把希伯来正文未保存的完整语句直接补入正文；差异在脚注中明确说明。
- issue: תרועה是否明确包含“赞美”
  choice: 译作“高声欢呼”，不在正文添加“赞美”
  alternative: 译作“发出赞美的欢呼”
  rationale: 赞美语境由希腊平行文本支持，但希伯来词本身只明确表示响亮的欢呼、喝彩或号角般的声响。为避免把语境推断写成词义本身，正文采用较开放的表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伴着……的演奏”避免生硬直译为“以……的服事”，“高声欢呼”保留喜庆礼仪氛围，却不把希伯来词未明说的“赞美”加入正文。脚注标记均在正文中出现，并紧随相关词句。
