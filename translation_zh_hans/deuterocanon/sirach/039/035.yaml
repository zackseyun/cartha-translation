  text: Now with all your heart sing for joy[a], and bless the name of the Holy One.
translation:
  language: zh_hans
  text: 现在，你们要全心欢呼，并称颂圣者的名。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“并称颂主的名。”希伯来文见证作“圣者”。
    reason: alternative_reading
lexical_decisions:
- source_word: עתה
  choice: 现在
  rationale: 作为时间兼话语标记，引出结尾的劝勉；希伯来文本没有连接词，因此不增译“如今又”或“所以”。
- source_word: בכל לב
  choice: 全心
  rationale: 这是表示全心全意的希伯来惯用语；结合复数命令语气，以现代汉语“你们要全心”自然表达。
- source_word: הרנינו
  choice: 欢呼
  rationale: רנן表示发声表达喜乐，可指欢唱或欢呼；“欢呼”保留其喜乐而响亮的语义，又不把含义限缩为歌唱。
- source_word: וברכו
  choice: 并称颂
  rationale: ברך用于对上帝及其名时，既有颂赞也有祝颂之意；现代汉语“称颂”比直译“祝福”更自然，同时保留敬拜语境。
- source_word: את שם
  choice: ……的名
  rationale: 按希伯来构词关系译出“圣者的名”，保留圣经中以“名”指涉上帝及其尊荣的表达。
- source_word: הקדוש
  choice: 圣者
  rationale: 希伯来文本直为“那圣者／圣者”，作为神圣称号；译作“圣者”既忠实又庄重，不按希腊平行文本改为“主”。
theological_decisions:
- issue: 末句的神圣称号：希伯来文 הקדוש 与希腊文 Κυρίου
  choice: 圣者
  alternative: 主
  rationale: 现存且可信度高的希伯来见证作“圣者”，故正文依希伯来文；希腊平行文本作“主”，这一称号差异具有文本和神学意义，收入脚注而不在正文中调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要”明确复数命令语气；“全心欢呼”保留希伯来语的热烈劝勉，“称颂圣者的名”维持经文敬拜语域。
