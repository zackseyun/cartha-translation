  text: He himself makes plain the instruction of his teaching[b][a], and in the law of the Lord’s covenant he will boast.
translation:
  language: zh_hans
  text: 他亲自阐明他教导中的训诲[a]，并要以主之约的律法为荣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他教导中的管教显明。”原文用词既可指训诲，也可含培育、管教的意思；动词则有使之显明、带到光明中的含义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“并要以主之约的律法夸口。”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: 他亲自
  rationale: 保留强调代词的作用，突出此人亲身作出下文所述的行动。
- source_word: ἐκφαίνει
  choice: 阐明
  rationale: 表达使某事显明、清楚呈现之意；现代汉语自然，也不把词义限缩为单纯公开展示。
- source_word: παιδείαν
  choice: 训诲
  rationale: 在智慧文学语境中兼有教导、培育和管教的意味；“训诲”可较自然地保留其塑造人格的色彩。
- source_word: διδασκαλίας
  choice: 教导
  rationale: 保留一般的教学含义，避免使用偏技术性或宗派化的“教义”。
- source_word: νόμῳ
  choice: 律法
  rationale: 在犹太智慧文学语境中自然指向律法／妥拉；“律法”是中文圣经传统中清楚而准确的表达。
- source_word: διαθήκης
  choice: 约
  rationale: 在与主和律法相关的圣经语境中指盟约；“约”简洁保留其宗教与关系性含义。
- source_word: Κυρίου
  choice: 主
  rationale: 按圣经语境译为“主”，并以“主之约”自然表达属格关系。
- source_word: καυχήσεται
  choice: 要……为荣
  rationale: 表达因某事而夸耀、引以为荣；比“自夸”少一层现代汉语常有的贬义，同时保留原词可能含有的夸耀意味。
theological_decisions:
- issue: ἐν νόμῳ διαθήκης Κυρίου 中“律法”“约”与“主”的关系
  choice: 主之约的律法
  alternative: 主的约之律法；在律法——主的约——中
  rationale: 将 διαθήκης 视为修饰 νόμῳ，并将 Κυρίου 连接于“约”，最直接地保留希腊语层叠的属格结构；同时不进一步界定律法与约在神学上的同一或从属关系。
- issue: καυχήσεται 的评价色彩
  choice: 以……为荣
  alternative: 以……夸口
  rationale: 原词可指夸口、夸耀或引以为荣。正文采用较自然且不预设负面道德评价的表达，脚注保留更直接的词义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他亲自”保留原文强调；“阐明……训诲”维持智慧文学的教导语域；“主之约的律法”尽量贴近希腊语结构，并借脚注保存关键词的语义张力。
