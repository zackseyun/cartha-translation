  text: Blessings overflowed like the Nile[b][a], and like a river they drenched the world.
translation:
  language: zh_hans
  text: 福泽[a]如尼罗河漫溢，又如江河，使人间饱饮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“众福泽”；希腊文平行文本作单数“他的福泽”。
    reason: alternative_reading
  - marker: b
    text: 也可译作“浸润人间”；希腊文平行文本作“像洪水使干地饱饮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ברכות
  choice: 福泽
  rationale: 希伯来文是复数“祝福”，但汉语“福泽”可自然表达汇聚而丰盛的恩惠，同时不强行标明单复数；脚注交代希腊文异读。
- source_word: כיאור
  choice: 如尼罗河
  rationale: יאר在此最自然地指尼罗河，保留其定期泛滥、带来丰饶的具体意象。
- source_word: הציפה
  choice: 漫溢
  rationale: 该动词表达水涨而漫出、淹覆；“漫溢”既契合尼罗河意象，也保持诗句的庄重感。
- source_word: וכנהר
  choice: 又像江河
  rationale: 直译第二个水流比喻；“江河”在现代汉语中比单说“河”更有充盈奔流之感，但未增添新的专名。
- source_word: תבל
  choice: 人间
  rationale: תבל常指有人居住的世界；“人间”比“世界”更适合被江河浸润的具体图景，也保留其普遍范围。
- source_word: ריותה
  choice: 浸润
  rationale: 该词根表示使之饱饮、充分得水；“浸润”兼有浇灌与饱和之意，又避免把希腊文对应词机械译成“灌醉”。
theological_decisions:
- issue: “福泽”的数及所属关系
  choice: 正文用不显单复数、也不补所属代词的“福泽”
  alternative: “他的福泽”或“种种福泽”
  rationale: 希伯来文 ברכות 是复数且无“他的”后缀，希腊文则作单数“他的祝福”。正文优先依据高可信度希伯来文，并利用汉语不强制标数的特点保留张力；异文在脚注说明。
- issue: 受浸润之物的范围
  choice: 人间
  alternative: 干地
  rationale: 希伯来文作 תבל（有人居住的世界），希腊文平行文本作“干地”。正文采用希伯来文，不以希腊文收窄其范围。
translation_notes:
  register: 采用现代、凝练而庄重的诗体表达。“漫溢—浸润”延续水势丰沛的平行意象；正文优先遵循希伯来文，同时用脚注保存希腊文的重要差异。
