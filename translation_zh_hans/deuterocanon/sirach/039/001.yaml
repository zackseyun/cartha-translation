base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/001.yaml
  text: But the one who gives himself over to it and meditates on the law of the Most High will seek out the wisdom of all the ancients[b][a], and will occupy himself with prophecies.
translation:
  language: zh_hans
  text: 但那全心投入[a]、默想至高者的律法的人，必探求所有古人的智慧，也必专注于预言[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“把自己的魂（或自己）交付出去”；这里表示整个人全然投入。原文没有明说投入的对象。
    reason: 说明ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ所表达的强烈自我委身意味，并保留其宾语省略。
  - marker: b
    text: “预言”也可理解为“先知著作”；原文直译为“专注于预言”。
    reason: 提示προφητείαις可指预言内容，也可能在语境中指承载预言的著作；正文保留较直接而开放的译法。
lexical_decisions:
- source_word: Πλὴν
  choice: 但
  rationale: 承接上文形成对比；“但”简洁自然，也保留其转折意味。
- source_word: τοῦ ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ
  choice: 那全心投入的人
  rationale: 原文直译近于“交出自己的魂/自己”，在此表示整个人专注投入。译作“全心投入”既符合现代汉语，也不擅自补明原文省略的投入对象。
- source_word: διανοουμένου
  choice: 专心思想
  rationale: 表达持续而深入的心智活动；“专心思想”适合智慧文学语体，又不将其过度限定为某种特定灵修实践。
- source_word: ἐν νόμῳ Ὑψίστου
  choice: 至高者律法
  rationale: 在思想类动词之后，汉语自然表达为“思想……律法”；“至高者”保留Ὑψίστου的神圣称号。
- source_word: σοφίαν πάντων ἀρχαίων
  choice: 所有古人的智慧
  rationale: ἀρχαίων在此指古时的人；此译保留πάντων“所有”的范围，也避免将其抽象化为单纯的“古代智慧”。
- source_word: ἐκζητήσει
  choice: 必探求
  rationale: 复合动词带有认真搜寻、深入寻求的意味；“探求”比一般的“寻求”更能体现其力度。
- source_word: ἐν προφητείαις ἀσχοληθήσεται
  choice: 也必潜心研究预言
  rationale: ἀσχολέομαι表示专注从事、用心于某事；“潜心研究”符合上下文的学者活动。προφητείαις直译为“预言”，不直接限定为成文作品。
theological_decisions:
- issue: “全心投入”的对象是否应当明说
  choice: 保留对象未明说的状态
  alternative: 补作“全心投入律法的研习”或“全心投入智慧的追求”
  rationale: 希腊文在ἐπιδιδόντος之后没有明说投入的对象；上下文虽可使读者联想到智慧或律法研习，却不足以在正文中只确定其中一项。汉语“全心投入”可自然保留这种省略。
- issue: προφητείαις指预言本身还是先知著作
  choice: 正文译作“预言”
  alternative: 译作“先知著作”
  rationale: “预言”是较直接的词义，也保留其可指预言内容或相关文本的开放性；“先知著作”属于可能但更具体的语境解释，列入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“全心投入”“专心思想”“探求”“潜心研究”形成连贯的智慧教师或经学者形象；两个“必”对应希腊文的将来时，并使平行结构清晰。
