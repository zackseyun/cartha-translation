  text: He himself will direct his counsel and knowledge[a], and he will reflect on his hidden things.
translation:
  language: zh_hans
  text: 他自己必使自己的筹谋和知识得到妥善引导，并思索自己隐藏的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐藏的事”也可译作“秘密的事”或“隐藏的事项”。希腊语表达简略，既可能指隐藏的教训，也可能指他自己所思量的隐秘事项。
    reason: 保留ἀποκρύφοις的词义范围及其所指对象的歧义。
lexical_decisions:
- source_word: αὐτὸς
  choice: 他自己
  rationale: 保留独立代词在句中的强调作用，而不弱化为单纯的“他”。
- source_word: κατευθυνεῖ
  choice: 必理顺
  rationale: 该动词有使之正直、导向正途或妥善安排之意；“理顺”在现代汉语中自然，并能同时搭配“筹谋”和“知识”，又不过度限定具体方式。
- source_word: βουλὴν
  choice: 筹谋
  rationale: βουλή可指谋划、商议或主意；“筹谋”兼顾内在思量与实际谋划，也符合智慧文学语境。
- source_word: ἐπιστήμην
  choice: 知识
  rationale: 直接表达智慧文学中知识、认识的基本含义，不额外缩窄为专门技能。
- source_word: ἀποκρύφοις
  choice: 隐秘的事
  rationale: 保留“隐藏、未显露之事”的宽泛含义，避免擅自引入神秘主义或秘传教义色彩。
- source_word: διανοηθήσεται
  choice: 必思索
  rationale: 表达该中间态动词所含的内在思想、仔细考虑之意，语言庄重而自然。
- source_word: αὐτοῦ
  choice: 自己的
  rationale: 重复的属格代词在语法上自然回指同一位阳性单数主体；用“自己的”保持这种联系，同时不在本节内另行指定其身份。
theological_decisions:
- issue: 重复代词所指的对象
  choice: 全句以“他自己……自己的……自己……”维持同一位阳性单数主体
  alternative: 按上下文泛化表达，省略部分代词或明确指出这人是谁
  rationale: 希腊文本本节没有重新点明主体身份，只以阳性单数形式和重复的αὐτοῦ保持衔接；译文保留这种语法凝聚力，不替经文消解上下文中所指对象的含蓄性。
- issue: “隐秘的事”的性质
  choice: 保留为未具体说明的“隐秘的事”
  alternative: 明确译为秘密教训、奥秘或内心隐情
  rationale: ἀπόκρυφος的实体化复数本身含义简约，可指隐藏的教训、事项或内在思量；正文不把其中任何一种解释定为唯一含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“理顺”避免生硬直译“使……正直”，同时保留κατευθύνω所含的整顿和导正意味；全句节奏简洁，与智慧文学语体相称。
