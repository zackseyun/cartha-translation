  text: All the works of God are good[a], and for every need he provides in its time.
translation:
  language: zh_hans
  text: 上帝的一切作为都美好[a]；他都在每一种需要的适当时候供给所需。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“主的一切作为都非常美好，每一道命令都将在适当的时候实现。”现存希伯来见证则作“上帝的一切作为都美好”，并说他在每一种需要的适当时候供给所需；正文采用现存希伯来文本，同时保留希腊异文。
    reason: alternative_reading
lexical_decisions:
- source_word: מעשי אל
  choice: 上帝所做的
  rationale: מעשי 是“作为、工作”的复数构造形式，אל 是神的通称。译为“上帝所做的”比生硬的“上帝的诸工作”更符合现代汉语，同时涵盖上帝所行和所造的一切。
- source_word: כלם טובים
  choice: 一切都美好
  rationale: כלם 强调整体无一例外，טובים 作广义的正面评价。译作“美好”既自然庄重，也不引入希腊文本所多出的“非常”。
- source_word: לכל צורך
  choice: 每一种需要
  rationale: צורך 在此指需要或必需之事；“每一种需要”保留 לכל 的周全含义，并适合供应的语境。
- source_word: בעתו
  choice: 按时
  rationale: 直译为“在它的时候”，所指可能是各项需要相应的时机。“按时”以自然汉语保留适时之意，但不把它强化为固定的神学术语。
- source_word: יספיק
  choice: 他都……供应
  rationale: ספק 的使役式可表达供给足够所需。希伯来文没有明说主语，结合上半句以上帝为中心，汉语补出“他”最为通顺；“供应”保留供给而使之充足的含义。
theological_decisions:
- issue: 神的称号
  choice: 上帝
  alternative: 主
  rationale: 现存希伯来文本使用 אל，而非四字神名；因此正文依希伯来文译为“上帝”。希腊平行文本作 Κυρίου（“主”），列入脚注说明，不据此改动正文。
- issue: 下半句的文本差异
  choice: 每一种需要，他都按时供应
  alternative: 每一道命令都将在适当的时候实现
  rationale: 希伯来见证谈到为各样需要作适时供应，希腊平行文本则谈命令按时实现。依据原文优先原则，正文采用现存希伯来文，同时用脚注保存显著异文。
- issue: 上帝作为供应者是否明说
  choice: 补出代词“他”
  alternative: 每一种需要都按时得到满足
  rationale: יספיק 是阳性单数动词而未明示主语，语境很可能以上帝为主语。补出“他”使现代汉语清楚自然，但不进一步说明供应的具体方式。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“上帝所做的一切”避免书面腔过重的“上帝的一切工作”；分号呈现两小句的平衡关系。脚注标记[a]已置于相关文本差异的第一分句之后。
