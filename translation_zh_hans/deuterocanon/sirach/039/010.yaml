  yaml_path: translation/deuterocanon/sirach/039/010.yaml
  text: Nations will recount his wisdom[a], and the assembly will proclaim his praise.
translation:
  language: zh_hans
  text: 列国要述说他的智慧；会众要宣扬对他的赞美。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会众”指聚集起来的群体或集会；“赞美”也可译作“赞誉”。
    reason: 说明ἐκκλησία在本处指聚集的共同体，而非后来的基督教制度性教会，并保留ἔπαινος的自然词汇替代。
lexical_decisions:
- source_word: διηγήσονται
  choice: 要述说
  rationale: 该词为将来时，表示较完整地讲述、传扬；“述说”既贴近原义，也保留公开见证的语气。
- source_word: ἔθνη
  choice: 列国
  rationale: 在《七十士译本》的智慧文学语境中，通常泛指众国或各民族；“列国”简洁庄重，也不额外引入犹太人与外邦人的对立。
- source_word: σοφίαν
  choice: 智慧
  rationale: 这是 σοφία 在《便西拉智训》中的常用对应，兼具道德、属灵和明辨方面的含义。
- source_word: ἐξαγγελεῖ
  choice: 要宣扬
  rationale: 该动词含公开传告、使人知晓之意；“宣扬”与前半句“述说”形成自然平行。
- source_word: ἐκκλησία
  choice: 会众
  rationale: 此处处于基督教以前的犹太智慧文学语境，指聚集的群体或集会；“会众”自然且避免误解为后来的基督教制度性教会。
- source_word: ἔπαινον
  choice: 美名
  rationale: ἔπαινος 可指赞美、称赞或由此而来的声誉。这里的宾语是前文所说的智慧人；“宣扬他的美名”在现代汉语中自然表达群体公开称颂他的可赞之处，同时脚注保留“赞誉”的较直译选择。
- source_word: αὐτοῦ
  choice: 他的
  rationale: 单数阳性代词承接上下文中的智慧人，应保留其单数男性所指，不作中性化处理。
theological_decisions:
- issue: 基督教以前的犹太文本中 ἐκκλησία 的译法
  choice: 会众
  alternative: 集会；教会
  rationale: “会众”能表达聚集起来的共同体，又不把后来的基督教“教会”概念倒置进原文。
- issue: αὐτοῦ 的性别和数
  choice: 他的
  alternative: 他们的；其
  rationale: 希腊文是单数阳性，按上下文指那位智慧人；保留“他的”最准确。
- issue: ἔπαινος 指对人的称颂还是声誉
  choice: 美名
  alternative: 赞誉；赞美
  rationale: 原词允许“称赞”和“可称赞的声誉”之间的语义张力。“美名”使中文搭配自然，却不把对象误作对上帝的敬拜；脚注列出更形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，以“列国……会众……”保留原文两分句的平行结构；“要”表达希腊文将来时。脚注标记置于全句末，所注内容同时涵盖“美名”和“会众”的词义选择。
