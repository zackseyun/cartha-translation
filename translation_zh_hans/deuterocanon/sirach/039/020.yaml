  text: From eternity to eternity he looks on[a], and nothing is too wondrous or too strong for him.
translation:
  language: zh_hans
  text: 从亘古到永远，他察看；没有什么对他来说太奇妙或太强大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“从世代到世代，他察看了；在他面前，没有什么是奇妙的。”希腊语文本没有希伯来文本中“或太强大”这一附加表达。
    reason: textual_variant
lexical_decisions:
- source_word: מעולם ועד עולם
  choice: 从亘古到永远
  rationale: 保留希伯来语从一个永恒端点延伸到另一个端点的庄严时间跨度；比直译“从世代到世代”更自然，也符合此处论述上帝恒久察看的语境。
- source_word: יביט
  choice: 他都察看
  rationale: 该未完成式在智慧文学中可表达恒常、概括性的行动。“察看”兼顾观看与留意之意；“都”使汉语中的恒常意味自然呈现，而不改成特定过去事件。
- source_word: נפלא
  choice: 太奇妙
  rationale: 此词可指奇异、非凡乃至超出能力或理解之事。配合否定句译为“没有什么对他太奇妙”，既自然又保留其语义张力。
- source_word: חזק
  choice: 比他更强
  rationale: 希伯来文本明确有“强、有力”这一附加谓语。结合 ממנו 可自然理解为比较关系，因此译作“没有什么比他更强”，避免将原文两个谓语强行处理成完全相同的句法。
- source_word: ממנו
  choice: 对他／比他
  rationale: 该介词在两个并列形容词之后可能容许不同的汉语表达：对于“奇妙”译作“对他”，对于“强”译作“比他”，既传达没有事情难倒他，也传达没有力量胜过他。
theological_decisions:
- issue: 希伯来语动词所含的主语未另行点明
  choice: 译作“他”，由上下文指向上帝
  alternative: 在本节明确补出“上帝”
  rationale: 原文仅由动词形态表达阳性单数主语，上下文清楚指向上帝。汉语补出代词是语法和表达所需，同时保留原文的简练，不额外重复神名。
- issue: 末句可理解为能力陈述或比较陈述
  choice: 前半译为“没有什么对他太奇妙”，后半译为“没有什么比他更强”
  alternative: 统一译作“没有什么对他太奇妙或太强大”
  rationale: ממנו 可表达“对他／从他”或“比他”的关系。分开处理可保留希伯来语中“奇妙”与“强”之间的语义差异，也不把经文仅限缩为“对上帝而言没有难事”这一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“亘古”保留智慧文学的崇高语域；其余措辞力求清楚自然。脚注标记置于整节末尾，说明希腊语平行文本与希伯来文本的差异。
