  text: At his command they rejoice[b][a], and in their appointed order they do not rebel against his word.
translation:
  language: zh_hans
  text: 他一命令，它们便欢喜[b]；它们按各自的定例，不违背他的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他的口”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本在此扩展为：“它们必在地上预备好，以供所需；到了各自的时候，它们必不违背一句话。”这显示受造之物按所派定的时机和用途运行。
    reason: alternative_reading
lexical_decisions:
- source_word: בצותו
  choice: 他一吩咐
  rationale: ב 加不定式结构可表达时间或情境关系；“他一吩咐”自然地传达“当他发令／奉他的命令”之意，也与希腊文 ἐν τῇ ἐντολῇ αὐτοῦ 相符。
- source_word: ישישו
  choice: 它们就欢喜
  rationale: ישישו 源自 שוש／שיש，表示欢喜、欣悦；上下文将受造之物人格化，因此用“欢喜”既清楚又自然。
- source_word: ובחקם
  choice: 在所定的秩序中
  rationale: חקם 可指它们的定例、规定范围或固定秩序。这里谈受造之物按神所派定的方式运行，“所定的秩序”保留了制度性与固定性的语义，同时避免把它缩窄为法律条文。
- source_word: לא ימרו פיו
  choice: 它们不违抗他口中所出的话
  rationale: מרה 表示悖逆、抗命；פיו 直译“他的口”，是指他口中所说的话。正文以自然中文保留“口”的意象，并明确其所指，避免仅译“命令”而抹去原文表达。
theological_decisions:
- issue: 神说话时的拟人化表达
  choice: 他口中所出的话
  alternative: 他的话／他的命令
  rationale: 希伯来文明确使用“他的口”。中文可自然地说“他口中所出的话”，既保存拟人化意象，也准确表达其言语或命令，不引入额外神学解释。
- issue: 受造之物的拟人化顺服
  choice: 它们就欢喜；它们不违抗
  alternative: 它们欣然运作；它们不偏离
  rationale: 原文直接使用“欢喜”和“违抗／悖逆”等人格化动词，应保留这种诗性张力，而不把它解释性地改写成单纯的自然运行。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他一吩咐……就……”表达原文的时间—情境关系；“所定的秩序”适合智慧文学语境。脚注标记均在正文出现，并按正文相关位置排列。
