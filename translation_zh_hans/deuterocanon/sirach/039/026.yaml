  yaml_path: translation/deuterocanon/sirach/039/026.yaml
  text: The essentials for human life are water[a], fire, iron, and salt; wheat flour, milk, and honey; the blood of the grape, oil[b], and clothing.
translation:
  language: zh_hans
  text: 人维生所需的基本之物是水、火、铁和盐；小麦面粉[a]、奶和蜂蜜；葡萄之血[b]、油和衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开罗藏经库的希伯来文本在“小麦面粉”一带措辞较难确定；希腊文平行文本支持“小麦面粉”或“细小麦粉”的意思。
    reason: textual_variant
  - marker: b
    text: 希伯来文直译为“葡萄之血”，可能泛指葡萄制成的饮品，包括酒；正文保留原文的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש לחיי אדם
  choice: 人生活的基本必需品
  rationale: ראש在此表示首要、根本之物，并非时间上的“开始”；希腊文平行文本也支持“满足生活需要的基本事物”这一含义。
- source_word: מים, ואש וברזל ומלח
  choice: 水、火、铁和盐
  rationale: 逐项保留希伯来文所列的具体生活必需品。
- source_word: חלב חטה
  choice: 小麦面粉
  rationale: 开罗藏经库希伯来文本此处措辞较难；结合上下文及希腊文σεμίδαλις所指的细面，译为现代汉语自然明确的“小麦面粉”。
- source_word: חלב
  choice: 奶
  rationale: 此处位于食物清单中，希腊文γάλα也确认应理解为奶，而不是脂肪。
- source_word: דבש
  choice: 蜂蜜
  rationale: 采用该词通常且符合语境的含义。
- source_word: דם עינב
  choice: 葡萄之血
  rationale: 直译并保留希伯来文鲜明的比喻，也与希腊文平行文本一致；不强行限定为葡萄汁或发酵酒。
- source_word: יצהר
  choice: 油
  rationale: 该词通常指新榨的油，多为橄榄油；译作“油”既准确，也不加入经文未明说的限定。
- source_word: בגד
  choice: 衣服
  rationale: 希伯来文集合性单数在生活必需品清单中用现代汉语“衣服”表达最自然。
theological_decisions:
- issue: אדם的泛指范围
  choice: 人生活
  alternative: 男人的生活／一个人的生命
  rationale: 此处אדם泛指人类，并非特指男性；“人生活”准确表达普遍的人类生活需要。
- issue: דם עינב所指饮品的范围
  choice: 葡萄之血
  alternative: 葡萄汁／酒
  rationale: 原文以比喻表达，可能广义指葡萄饮品，也可能令人联想到酒；正文保留意象及其开放性，不作超出文本的教义性限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“基本必需品”传达ראש在本句中的首要、根本含义；分号保留清单的节奏和分组。所有脚注标记均置于对应词语之后。
