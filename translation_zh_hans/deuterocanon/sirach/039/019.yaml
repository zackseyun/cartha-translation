  text: The deeds of all flesh are before him[b][a], and nothing is hidden from before his eyes.
translation:
  language: zh_hans
  text: 凡有血肉者的作为，都在他面前[a]；没有什么能瞒过他的眼目。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡有血肉者”也可理解为“全人类”或“一切生灵”；希伯来文这一惯用语范围宽泛，希腊文同样作“所有血肉”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译可作“没有什么从他眼前隐藏”。希腊文作“没有可能从他眼前隐藏”，更明确地强调不可能隐藏。
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה
  choice: 所做的
  rationale: 希伯来文单数构造形式在“凡有血肉者”前具有集合意义，指其行为或作为；译作“所做的”自然清楚，也与希腊文ἔργα（作为、行为）相合。
- source_word: כל בשר
  choice: 凡有血肉者
  rationale: 直译为“所有血肉”，可泛指人类或一切有生命者。中文用“凡有血肉者”保留圣经惯用语及范围上的开放性，不把所指限缩为人类；希腊文πάσης σαρκὸς亦支持此译。
- source_word: נגדו
  choice: 在他面前
  rationale: 表示处于某人面前或临在之中；“在他面前”简洁庄重，并对应希腊文ἐνώπιον αὐτοῦ。
- source_word: אין נסתר
  choice: 没有什么能……隐藏
  rationale: 希伯来文直接表达“没有隐藏的”；结合中文表达，译为“没有什么能隐藏”自然地传达无人能够躲避的含义。希腊文则更明确地表达“不可能隐藏”。
- source_word: מנגד עיניו
  choice: 从他眼前
  rationale: 保留“眼”这一具体意象以及介词所表达的“从……面前”，比单译“躲过他的察看”更贴近希伯来文，也与希腊文ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ一致。
theological_decisions:
- issue: “凡有血肉者”受上帝察看的范围
  choice: 保留“凡有血肉者”这一宽泛表达
  alternative: 全人类；一切生灵
  rationale: 希伯来文和希腊文都使用“血肉”这一用语，其范围可指人类，也可能更广。译文不将其解释性地限缩，以保留上帝察看一切行为的广度及原文的真实含混。
- issue: 隐藏是事实上的不存在，还是能力上的不可能
  choice: 正文译作“没有什么能……隐藏”
  alternative: 没有什么是隐藏的
  rationale: 希伯来文着重陈述没有隐藏之物，希腊文则略为明确地突出不可能隐藏。正文采用自然中文兼顾两者，并以脚注说明希腊文的强调。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“凡有血肉者”保留经文意象和范围上的含混；“在他面前”“从他眼前”维持上下句的空间与视觉意象。所有脚注标记均置于正文相应位置。
