  text: The works of God are all good[a], and for every need he provides in its time.
translation:
  language: zh_hans
  text: 上帝的一切作为都是美好的[a]；他必在适当的时候满足每一种需要。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“主的一切作为都是美好的。”这里的希伯来文作“上帝”，不是“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה אל כלם
  choice: 上帝的一切作为
  rationale: מעשה虽为单数形式，却由“全都”表明是集合性用法，指上帝各样的作为；“作为”庄重自然，也与希腊文复数“诸工作”相符。אל直译为“上帝”。
- source_word: טובים
  choice: 都是美好的
  rationale: 直接表达“好”的肯定；“美好”在现代汉语中适合描述上帝的作为，且不把含义缩限为仅仅“有用”。
- source_word: לכל צורך
  choice: 每一种需要
  rationale: צורך主要指需要、所需之事；如此翻译自然，并与希腊文χρεία一致。
- source_word: בעתו
  choice: 按时
  rationale: 字面为“在它的时候”，后缀最自然地关联前述每一种需要，即在相应的时候；“按时”保留这一时机恰当的含义而不过度解释。
- source_word: יספיק
  choice: 他都必……供应
  rationale: 该动词可指使充足、充分供给。这里以上帝为承接上句的隐含主语；未完成体可表达恒常或预期性的行动，“都必供应”兼顾一般性保证与动词形态，不局限为一次未来事件。
theological_decisions:
- issue: 首句的神圣称谓
  choice: 正文采用“上帝”
  alternative: “主”
  rationale: 现存希伯来文作אל，宜直接译为“上帝”；希腊文平行文本作Κυρίου（“主”）。正文以希伯来文为主，异文则收入脚注。
- issue: 供应者是否明说为上帝
  choice: 以“他”明示承接上帝
  alternative: 译作非人称的“就足够”或以“作为”为主语
  rationale: 希伯来文动词主语未明说，但语境和希腊文主动供应之义支持以上帝为隐含主语；用“他”使中文清楚，又不增添额外神学内容。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“作为”比“工作”更适合指神的行动；分号呈现原文两个分句。“都必按时供应”表达普遍性的神圣供给，同时保留希伯来文未完成体可能具有的保证意味。
