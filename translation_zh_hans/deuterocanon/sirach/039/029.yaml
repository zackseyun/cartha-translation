  text: Fire and hail[a], famine and pestilence—these also were created for judgment.
translation:
  language: zh_hans
  text: 火与冰雹、饥荒与瘟疫——这些也都是为审判而被造的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“这一切都是为报应而造的”，也可译作“为惩罚而造的”；希伯来文本作“为审判”。
    reason: 说明希伯来文本与希腊平行文本的异读及语义差别。
lexical_decisions:
- source_word: אש
  choice: 火
  rationale: 希伯来语常用名词，直接指火；也与希腊语 πῦρ 一致。
- source_word: ברד
  choice: 冰雹
  rationale: 该词通常指冰雹这一自然现象，希腊语 χάλαζα 也印证此义。
- source_word: רעב
  choice: 饥荒
  rationale: 虽也可指饥饿，但在一连串公共灾害中译作“饥荒”更符合语境，也与希腊语 λιμός 相符。
- source_word: דבר
  choice: 瘟疫
  rationale: 该词常指瘟疫或疫病；“瘟疫”保留灾祸和审判语境中的含义，不随希腊译文 θάνατος 窄化或转为“死亡”。
- source_word: גם אלה
  choice: 这些也都
  rationale: 保留“也”的追加意味，承接上文所论的受造之物；加“都”使现代汉语表达自然，并与复数主语协调。
- source_word: למשפט
  choice: 为施行审判
  rationale: משפט 可指审判或公义；此处译作“施行审判”保留司法性和目的性，又不直接收窄为惩罚或报复。
- source_word: נוצרו
  choice: 而造的
  rationale: 该被动复数形式表示这些灾害被创造或塑造出来；结合上下文的创造主题，用“造”简洁自然，并隐含神的施事作用。
theological_decisions:
- issue: 末句希伯来文本与希腊平行文本的语义差异
  choice: 正文依希伯来文译为“为施行审判而造的”
  alternative: 希腊文可理解为“为报应而造”或“为惩罚而造”
  rationale: 现存希伯来文 למשפט 表意较宽，首先是“为审判”；希腊文 εἰς ἐκδίκησιν 则更偏向惩罚性报应。以希伯来文本为正文依据，同时在脚注保留希腊传统较强的惩罚意味，避免消解文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“火与冰雹、饥荒与瘟疫”以成对并列保持原文节奏；破折号突出总结句。“施行审判”比单说“审判”更符合汉语目的结构，同时不把 המשפט 过度限定为惩罚。
