  text: Raise your voices and bless together[a], and give thanks to Yahweh for all his works.
translation:
  language: zh_hans
  text: 你们要扬声，一同称颂；要为他的一切作为感谢雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“又要像乳香一样散发香气，像百合花一样开花；要散发香气，唱出赞美的歌。”这一较长的措辞反映了与现存希伯来文不同的文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: הרימו קולכם
  choice: 你们要扬声
  rationale: הרימו是复数使役命令式，קולכם字面为“你们的声音”。“扬声”自然、庄重，也保留了提高声音的具体意象。
- source_word: וברכו יחדו
  choice: 一同称颂
  rationale: ברך在对上帝的敬拜语境中有“祝颂、称颂”之意；中文不用容易误解为上对下赐福的“祝福”，而以“称颂”准确表达。יחדו译为“一同”，保留群体性的劝勉。
- source_word: והודו
  choice: 感谢他
  rationale: ידה的使役词干在敬拜语境中通常表示“感谢、称谢”。“感谢他”保留感恩意味，并与前面的“称颂”有所区分。
- source_word: ליהוה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה；以“雅威”音译，保留其专名性质。
- source_word: על כל מעשיו
  choice: 为……的一切作为
  rationale: על在此表示感谢的缘由；מעשיו指“他的作为”。“一切作为”兼顾原文名词形式和中文圣经语体。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用以色列上帝的专名；“雅威”较直接反映通行学术重构的读音，并避免把专名改成称号。
- issue: 希伯来文本与希腊平行文本差异显著
  choice: 正文依据现存希伯来文，希腊文异读收入脚注
  alternative: 正文采用较完整的希腊文本
  rationale: 所给希伯来文本可信度高、语意完整，应作为正文依据；希腊文本代表不同且更长的文本形态，宜在脚注中完整说明，不将二者混合。
translation_notes:
  register: 采用现代、庄重而易懂的敬拜用语。“扬声”“一同称颂”“一切作为”保留原文的诗性和礼仪色彩；分号呈现两个并列命令。
