  yaml_path: translation/deuterocanon/sirach/039/011.yaml
  text: If he remains steadfast[a], he will leave behind a name beyond a thousand; and if he comes to rest[b], he still accomplishes them.
translation:
  language: zh_hans
  text: 他若坚持不懈，必留下胜过千人的名声[a]；他若安息[b]，仍成就这些事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“他将留下一个名字，胜过一千人”。原文的比较结构较为生硬；这里很可能是说，他的名声胜过千人之名。
    reason: 说明ἢ χίλιοι在此处难解的比较结构，以及译文所采用的语意理解。
  - marker: b
    text: “安息”也可能在这里委婉地指死亡，同时仍可保留一般“歇息”的意思。
    reason: 保留ἀναπαύσηται可能指死亡或一般安歇的双重含义。
  - marker: c
    text: “这些事”在希腊文中所指不明，可能涉及前文所述智者的工作、成就或持续影响。
    reason: 说明复数代词αὐτά的指向含混，避免将其具体化。
lexical_decisions:
- source_word: ἐὰν ἐμμένῃ
  choice: 他若持守到底
  rationale: ἐμμένω表示持续、坚持或留在某种状态中。“持守到底”体现其持续不懈的意味，又不把它限定为单纯的寿命长短。
- source_word: ὄνομα καταλείψει
  choice: 必留下……名声
  rationale: 直译为“留下名字”，在本句中指身后长存的名望。“留下名声”既保留遗留于后世的意象，也符合现代汉语习惯。
- source_word: ἢ χίλιοι
  choice: 胜过千人
  rationale: 传抄文本中的ἢ在此若直译为“或”语意突兀；按比较结构理解为“胜过/多于”较为通顺。“千人”在语义上理解为其他千人的名声，但正文不额外补出“其他人的”。
- source_word: ἐὰν ἀναπαύσηται
  choice: 他若安息
  rationale: ἀναπαύομαι可指歇息，也可能委婉指死亡。“安息”在中文中同样保留这两层可能性。
- source_word: ἐμποιεῖ αὐτά
  choice: 仍会成就这些事
  rationale: ἐμποιέω有造成、产生、成就之意；αὐτά为中性复数，所指并不明确。“这些事”保留代词的复数与含混性，“仍会”表达即便安息其功效仍延续的语境关系。
theological_decisions:
- issue: ἀναπαύσηται是否明确指死亡
  choice: 译为“安息”
  alternative: 译为“去世”或“歇息”
  rationale: 原词本义范围较广，虽在这里可能暗指死亡，却没有明确说“死”。“安息”可保留死亡与歇息之间的张力，不将经文的含义过早限定。
- issue: 安息之后是否仍有影响
  choice: 保留“仍会成就这些事”的开放表述
  alternative: 具体解释为“他的著作仍发挥作用”或“他的名声仍长存”
  rationale: 希腊文的复数代词αὐτά没有清楚交代先行对象，因此不把它教义化或具体化为死后行为、著作影响或名声延续中的任何一种。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“持守到底”“留下名声”“安息”具有经文语体的凝练感，但不使用生僻古语；对比较结构、死亡含义和复数代词的歧义均以脚注保留。
