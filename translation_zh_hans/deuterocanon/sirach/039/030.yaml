  yaml_path: translation/deuterocanon/sirach/039/030.yaml
  text: The teeth of wild beasts, and scorpions and vipers, and a sword that takes vengeance to destroy the wicked— all these were created for their purpose, and they are kept in store until the time they are appointed.
translation:
  language: zh_hans
  text: 野兽的牙齿、蝎子和毒蛇[a]，以及施行报应、毁灭[b]恶人的刀剑——这一切都是为其用途而造的；它们被存放在库房中，到了指定的时候便被征召[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毒蛇”所对应的希伯来词指一种有毒的蛇，确切种类不能确定；也可译作“蝰蛇”或“阿斯普蛇”。希腊语平行文本也使用较宽泛的蝰蛇／蛇类名称。
    reason: lexical_alternative
  - marker: b
    text: “毁灭”也可译作“尽行毁灭”或“灭绝”；希伯来语原词可带有更强的彻底毁灭之意。
    reason: lexical_alternative
  - marker: c
    text: 或译：“它们都在库房中，到了指定的时候便被点召。”希伯来语末句较为凝练，意指这些力量被留存，等候受调遣的时刻。
    reason: alternative_reading
lexical_decisions:
- source_word: חית שן
  choice: 野兽的牙齿
  rationale: 按希伯来语结构理解为“野兽之齿”；שן 虽为单数形式，在此具有集合意义。希腊语复数 ὀδόντες 及 θηρίων 也支持此译。
- source_word: עקרב
  choice: 蝎子
  rationale: 在列举中作类称，现代汉语用“蝎子”自然，无须加复数标记。
- source_word: פתן
  choice: 毒蛇
  rationale: 该词指有毒的蛇，但确切物种难以确定；“毒蛇”既清楚又不作过度具体的动物学判断，亦与希腊语 ἔχεις 相符。
- source_word: חרב נקמות
  choice: 施行报应的刀剑
  rationale: 保留希伯来语“报应之剑”的主动意味，并与希腊语分词 ἐκδικοῦσα 的“施行报应”相呼应；“刀剑”符合庄重的经文语体。
- source_word: להחרים
  choice: 毁灭
  rationale: 此动词可有“尽行毁灭、灭绝”乃至“奉献为当毁灭之物”的较强含义；正文采用自然而不弱化基本力度的“毁灭”，并以脚注说明。
- source_word: רשעים
  choice: 恶人
  rationale: 准确表达道德意义上的邪恶者，是现代中文圣经语体中清楚而常用的对应词。
- source_word: לצורכם
  choice: 为各自的用途
  rationale: 表达这些事物受造时所对应的功能或需要，同时避免擅自指定受益者；“各自”使希伯来语附属代词在中文中更为明确自然。
- source_word: נבראו
  choice: 而造
  rationale: 保留明确的被创造意义，不淡化有害之物也属于受造秩序这一神学张力。
- source_word: באוצר
  choice: 被收存在库中
  rationale: 保留 אוצר 的库房意象，同时用现代中文被动结构表达这些力量正被留存备用。
- source_word: ולעת יפקדו
  choice: 到指定的时候便被召出
  rationale: פקד 在此语境表示点召、征召或调遣；“被召出”与前面的库存意象衔接，并保留时机由外在权柄指定的意味。
theological_decisions:
- issue: 有害生物与毁灭力量是否被描述为受造并受神圣治理
  choice: 直译为“都是……而造的”，并写明它们被收存，待指定之时召出。
  alternative: 把相关语言弱化为自然现象，或将“受造”改为仅仅“出现”。
  rationale: 希伯来文本明确使用“被造”，并以库藏及按时点召的图像描述这些毁灭性力量。译文应保留这一关于创造、审判与苦难的张力，而不加以调和。
- issue: חרם 的毁灭含义是否采用技术性的宗教术语
  choice: 正文译作“毁灭”，脚注交代也可有“尽行毁灭”或“灭绝”的强化含义。
  alternative: 正文译作“奉献为当毁灭之物”。
  rationale: 此处语境强调执行毁灭，并无充分必要在正文中引入可能晦涩的技术术语；同时不应完全遮蔽该词更强的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号连接受造与留存待命两个断句，用破折号收束前面的灾害清单。保留“库”的具体意象及“被召出”的调遣意味，不将神学张力解释进正文。
