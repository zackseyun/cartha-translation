base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/009.yaml
  text: Many will praise his understanding; it will not be blotted out forever. His remembrance will not depart[a], and his name will live for generations of generations.
translation:
  language: zh_hans
  text: 许多人必称赞他的悟性；这悟性永远不会被抹去。人对他的记念必不消逝；他的名必世世代代存活。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世世代代”对应的希腊语字面为“世代的世代”，是表示历经连续世代、长久延续的加强说法。
    reason: 说明希腊语εἰς γενεὰς γενεῶν的字面构形及其惯用含义。
lexical_decisions:
- source_word: αἰνέσουσιν
  choice: 必称赞
  rationale: 该词为将来时，表示人们将公开赞扬；“必称赞”自然传达其将来与肯定语气。
- source_word: σύνεσιν
  choice: 悟性
  rationale: 该词指理解、洞察和明辨的能力；“悟性”符合智慧文学语境，也比技术性的“智力”更贴切。
- source_word: ἕως τοῦ αἰῶνος
  choice: 永远
  rationale: 这是表示长久不灭的惯用语；“永远”以现代汉语自然表达其持久性。
- source_word: ἐξαλειφθήσεται
  choice: 被抹去
  rationale: 保留原词“擦除、涂抹掉”的具体意象，而不抽象改写为“被遗忘”。
- source_word: μνημόσυνον
  choice: 人对他的记念
  rationale: 此处与“他的名必存活”平行，指后人持续记得他，而非实体纪念物；补出“人对”使汉语所指清楚。
- source_word: ἀποστήσεται
  choice: 必不消逝
  rationale: 原词本义为离开、退去；用于“记念”时，“不消逝”是自然汉语，同时保留其不会退去的含义。
- source_word: ὄνομα
  choice: 名
  rationale: 直译原词，并保留“名字”兼有声名、名望的诗性含义。
- source_word: ζήσεται
  choice: 必存活
  rationale: 保留“活着”的拟人意象，避免将其平化为抽象的“流传”。
- source_word: εἰς γενεὰς γενεῶν
  choice: 直到世世代代
  rationale: 该闪语式加强表达指连续许多世代；“世世代代”是现代汉语自然且庄重的对应说法。
theological_decisions:
- issue: 持久声名的意象应否意译为抽象的“遗产”或“影响”
  choice: 保留“抹去”“记念”“名存活”等具体意象
  alternative: 他的遗泽将永远长存
  rationale: 希腊文本以彼此呼应的具体诗性意象描述智者身后的声名；保留这些意象可维持智慧文学的张力，不额外引入某种有关死后生命或功德的教义解释。
- issue: οὐκ ἐξαλειφθήσεται隐含主语的处理
  choice: 以“这悟性”承接上一分句
  alternative: 理解为智者本人或其名不会被抹去
  rationale: 就紧邻语法而言，阴性单数的σύνεσιν是最自然的承接对象；但原文省略主语，后文又转向“记念”和“名”，因此译文只作必要明示，不将整句扩展成关于个人存在状态的断言。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“悟性”兼顾洞察与理解；“被抹去”和“名必存活”保留原文鲜明意象。标点将四个相连分句整理为两个句子，以提升中文可读性，同时保留平行结构。
