  text: All these things are for good to the good[a]; so also for the wicked they are turned to harm.
translation:
  language: zh_hans
  text: 这一切都使良善的人受益[a]；同样，这一切对恶人却转为祸害。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作“敬虔的人”；希伯来文作“良善的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: כל אלה
  choice: 这一切
  rationale: 直接保留希伯来文概括性的指示语，指向上文所列的一切事物。
- source_word: לטובים ייטיבו
  choice: 使良善的人受益
  rationale: לטובים 指“良善的人”，ייטיבו 在此表达产生益处；此译法自然呈现希伯来文中对象与有益结果的关系。
- source_word: כן
  choice: 同样
  rationale: 标明上下两句彼此对应的对比结构。
- source_word: לרעים
  choice: 对恶人
  rationale: רעים 指道德意义上的恶者；“恶人”符合现代汉语智慧文学语体，也不以希腊文的“罪人”取代希伯来文。
- source_word: לרעה נהפכו
  choice: 却转为祸害
  rationale: נהפכו 保留“转变、变为”的动态，רעה 在结果语境中译作“祸害”，表达不利与伤害，而不把它仅抽象化为“恶”。
theological_decisions:
- issue: 上半句受益者的道德—宗教身份
  choice: 良善的人
  alternative: 敬虔的人
  rationale: 希伯来文 טובים 是“良善的人”，希腊文平行文本则作“敬虔的人”。正文以现存希伯来文为先，不将其宗教含义过度明确化；脚注保存希腊文见证。
- issue: 同一切事物对恶人的结果
  choice: 转为祸害
  alternative: 成为恶事
  rationale: 保留 נהפכו 的转变意味，并将 רעה 理解为不利后果；不进一步断定这种转变的施动者或机制。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，以分号呈现格言式的平行对比。“良善的人”比单说“好人”略为庄重，并贴近希伯来文形容词名词化的表达。
