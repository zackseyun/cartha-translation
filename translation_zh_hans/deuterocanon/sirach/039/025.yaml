  text: Good is allotted to the good from the beginning; so too[a], for the wicked, good and evil.
translation:
  language: zh_hans
  text: 从起初，善就是善人的一份；同样[a]，恶人所得的有善也有恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“善事从起初就是为善人所造的；同样，恶事是为罪人所造的。”这里保存的希伯来文则较完整地说：“给恶人的，善与恶。”
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: 善
  rationale: 此词在本节两次出现，泛指善好、有益之事。译作“善”既保留希伯来文的凝练，也维持末尾“善—恶”的对举。
- source_word: חלק
  choice: 就是……的份
  rationale: חלק 本义为“份、份额”。希伯来文是无动词诗句，中文用“就是……的份”自然补足判断关系，同时保留分配所得的意象，不改译成较强的被动动作。
- source_word: מראש
  choice: 从起初
  rationale: 自然表达“从开始、从最初”，并与希腊文 ἀπ’ ἀρχῆς 相合；“从起初”语体庄重且适合智慧文学。
- source_word: לרעים
  choice: 恶人
  rationale: רעים 在这里指道德意义上的坏人，而非不幸的人；“恶人”能清楚呈现与“善人”的人物对照。希腊文作“罪人”，但不取代现存希伯来文。
- source_word: טוב ורע
  choice: 有善也有恶
  rationale: 保留原文宽泛而鲜明的两极表达，不把它缩窄为“顺境与逆境”等解释性说法；加入“有……也有……”使现代汉语句法顺畅。
theological_decisions:
- issue: 末句与希腊文平行文本不同，应如何处理
  choice: 按希伯来文译为恶人所得的包括善与恶
  alternative: 依希腊文译为“同样，为罪人造的是恶事”
  rationale: 主要原文见证明确写作“给恶人的，善与恶”。希腊文可作异文与一致性参照，却不应覆盖现存的希伯来文；正文因此保留希伯来文较完整、也较具张力的说法，并以脚注交代希腊异文。
translation_notes:
  register: 采用现代、凝练而庄重的智慧文学语体。“善人的份”贴近希伯来文名词结构；末句用“所得的有善也有恶”使中文自然，同时不消解原文中恶人也可能得善的神学张力。
