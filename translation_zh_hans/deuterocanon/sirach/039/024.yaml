  text: The ways of the blameless are made straight[b][a]; but for strangers they become ruinous.
translation:
  language: zh_hans
  text: 无可指摘的人的道路变得平直；对外人却成了险阻[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“对违法的人，却成为绊脚石。”希腊文似乎把希伯来文的“外人”理解为与上帝之道疏离的人。
    reason: alternative_reading
  - marker: b
    text: 末句的希伯来文动词含义难定；这里译作“成了险阻”，参考了希腊文“绊脚石”的读法。
    reason: textual_variant
lexical_decisions:
- source_word: ארחות
  choice: 道路
  rationale: 该词复数可指实际的路径，也常比喻人的行事方式或人生道路；“道路”在现代汉语中自然保留了这一比喻。
- source_word: תמים
  choice: 纯全人
  rationale: תמים可表示完整、纯全、无可指摘；“纯全人”保留希伯来文的整体性与道德含义，又不把它限定为礼仪意义的“圣洁”。
- source_word: יישרו
  choice: 变得平直
  rationale: ישר在此表示道路成为平直、端正；“变得平直”保留其动词力量，同时避免明确加入原文没有明说的施事者。
- source_word: כן
  choice: 却
  rationale: כן通常可译为“如此、同样”，但本节平行结构表达相反结果；“却”自然呈现这一对照，而不改变命题内容。
- source_word: לזרים
  choice: 对外人
  rationale: זר本义为陌生人、外人或局外人。主文保留较宽泛的“外人”，不直接采用希腊文所作的道德化解释“违法的人”。
- source_word: יסתוללו
  choice: 成为险阻
  rationale: 此动词词形罕见且含义困难；希腊文对应“绊脚石”，支持阻碍、跌倒或败坏的语义。“成为险阻”既表达负面结果，也不过度断定其精确词源。
theological_decisions:
- issue: 希伯来文“外人”与希腊文“违法的人”之间的差异
  choice: 主文采用希伯来文所支持的“外人”
  alternative: 违法的人
  rationale: 现存希伯来文证据可靠，应优先保留其较宽泛且带有张力的称呼。希腊文可能把“外人”解释为与上帝秩序疏离、因而违法的人；这一解释收入脚注，而不代替主文。
- issue: 末句困难动词的具体意象
  choice: 译作“成为险阻”，并以脚注说明不确定性
  alternative: 成为绊脚石／走向毁灭／变得曲折
  rationale: 希伯来文无法确定支持某一个狭窄意象；“险阻”涵盖阻碍与致人跌倒的效果，并与希腊文平行文本相符，同时保留文本上的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。上下两分句结构紧凑，以“却”突出对照；“纯全人”和“外人”分别保留希伯来文的道德整体性及身份含混性，避免加入特定宗派解释。
