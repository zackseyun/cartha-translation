  to: 他一心要清早起来，到那造他的主那里去[a]；他要在至高者面前恳求。他要开口祷告，为自己的罪恳求。
  rationale: 修订仅处理“归向”所可能加入的归信含义和原句搭配不畅的问题。“到那造他的主那里去”自然表达πρὸς的朝向性，并与“清早起来”的基本词义相连。保留“恳求”的两次重复，以及“为自己的罪”不具体规定祈求内容的表述。
