  source_fidelity: “早起归向”将ὀρθρίσαι与πρὸς Κύριον合并得较为自由，且“归向”在现代中文宗教语境中容易带出悔改归信或转向的含义，超过原文所明确表达的清早起身、朝向主而去。改为“清早起来，到……那里去”，保留早起及方向性，避免加入“归信”意味。其余分句忠实保留了两次δεηθήσεται的重复及“为自己的罪”所保有的开放性。
  naturalness: 原句“他专心早起归向……”搭配略显压缩，“早起归向”也不够自然。修订后的“一心要清早起来，到……那里去”是现代普通话中清楚自然而仍具庄重感的表达。
  terminology: “主”“至高者”“恳求”“祷告”“罪”均恰当。“那造他的主”可保留，既忠实于分词短语，也符合中文圣经语体。
