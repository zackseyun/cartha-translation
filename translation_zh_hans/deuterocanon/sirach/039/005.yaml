base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/005.yaml
  text: He will devote his heart to rising early to the Lord who made him[a], and he will make supplication before the Most High; he will open his mouth in prayer, and he will make supplication for his sins.
translation:
  language: zh_hans
  text: 他一心要清早起来，到那造他的主那里去[a]；他要在至高者面前恳求。他要开口祷告，为自己的罪恳求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他一心清早寻求那造他的主。”希腊语动词本指清早起来，按语境也可含有清早殷切寻求之意。
    reason: 保留ὀρθρίσαι“清早起来”的基本含义及其在语境中可引申为“清早寻求”的可能性，不在正文中单方面消除这种张力。
lexical_decisions:
- source_word: ἐπιδώσει τὴν καρδίαν αὐτοῦ
  choice: 他专心
  rationale: 原文是“献上／投入自己的心”，表示有意将内心专注于随后的行动；“专心”在现代汉语中自然凝练，也保留意志与委身之意。
- source_word: ὀρθρίσαι πρὸς Κύριον
  choice: 早起归向……主
  rationale: ὀρθρίσαι直接涉及清早起来，πρός表示朝向；译文保留“早起”，并以“归向”表达朝向主的关系，但不把动词径直改释为“寻求”。
- source_word: τὸν ποιήσαντα αὐτόν
  choice: 那造他的
  rationale: 贴近分词结构，明确主是造他者；“造”比“创造了”更凝练庄重。
- source_word: ἔναντι Ὑψίστου
  choice: 在至高者面前
  rationale: 保留原文“在……面前”的临在与敬畏意象；“至高者”是Ὕψιστος自然、传统而清楚的对应。
- source_word: δεηθήσεται
  choice: 恳求
  rationale: 该词强调迫切祈求，不只是泛指祷告；两处均译“恳求”，保留原文重复。
- source_word: ἀνοίξει στόμα αὐτοῦ ἐν προσευχῇ
  choice: 他开口祷告
  rationale: 保留“开口”的鲜明动作，同时用自然现代汉语表达ἐν προσευχῇ。
- source_word: περὶ τῶν ἁμαρτιῶν αὐτοῦ
  choice: 为自己的罪
  rationale: περί指出恳求所关涉的事项；此译不进一步规定为认罪、求赦免或赎罪，保留原文开放性。
theological_decisions:
- issue: 次经智慧文学语境中Κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 此处明确指向造他的神；“主”既保留敬称与神学分量，也符合现代中文圣经语体。
- issue: “为自己的罪恳求”的具体含义
  choice: 为自己的罪恳求
  alternative: 因自己的罪恳求／求赦免自己的罪
  rationale: 希腊文只说明恳求涉及他的罪，并未明说恳求的具体内容；译文不将其限定为求赦免、认罪或其他特定教义表述。
- issue: ὀρθρίσαι是否直接译作“清早寻求”
  choice: 早起归向
  alternative: 清早寻求
  rationale: 动词本身首先表示清早起来，寻求之意可由语境引申；正文保留早起与朝向主两个要素，并在脚注说明可能的语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“专心”“归向”“恳求”避免生硬直译；分号保留原文祈求、祷告与为罪恳求之间的平行推进。
