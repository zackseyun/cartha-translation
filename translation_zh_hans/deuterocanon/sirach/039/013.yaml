  yaml_path: translation/deuterocanon/sirach/039/013.yaml
  text: Listen to me[a], holy sons, and bud forth like a rose growing beside a stream in a field[b],
translation:
  language: zh_hans
  text: 你们这些虔敬的众子啊[a]，要听我说；要像生长在田野溪流旁的玫瑰一样萌芽[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虔敬”也可译作“圣洁”或“忠信”；原文“众子”为阳性复数称呼。
    reason: lexical_alternative
  - marker: b
    text: “萌芽”也可译作“发芽”或“长出新枝”。原文动词着重植物萌生、长出，不一定特指已经开花。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσακούσατέ μου
  choice: 请听我说
  rationale: 不定过去时命令语气要求听者留心听从；“请听我说”在现代汉语中自然，也保留了直接劝勉的语气。
- source_word: υἱοὶ ὅσιοι
  choice: 虔敬的众子啊
  rationale: υἱοὶ明确为阳性复数“众子”，ὅσιοι在此侧重敬虔、忠于宗教本分；“虔敬的众子”兼顾原文形式和庄重语域。
- source_word: βλαστήσατε
  choice: 你们要萌芽
  rationale: 该命令式延续植物生长的劝勉意象；“萌芽”表达新生长开始出现，未把含义过度限定为完全开花。
- source_word: ῥόδον
  choice: 玫瑰
  rationale: 该词通常指玫瑰；直译即可清楚传达比喻意象。
- source_word: φυόμενον
  choice: 生长
  rationale: 现在时分词描写玫瑰持续生长的状态，“生长”简洁自然。
- source_word: ἐπὶ ῥεύματος ἀγροῦ
  choice: 在田野溪流旁
  rationale: ἐπί在此表达临近流水的位置，ῥεῦμα指流动的水道，ἀγρός提供田野环境；此译保持意象，同时避免生硬的“在溪流之上”。
theological_decisions:
- issue: 称呼υἱοὶ ὅσιοι的性别与敬虔含义
  choice: 虔敬的众子
  alternative: 圣洁的众子；虔敬的孩子们
  rationale: 保留υἱοὶ的阳性复数形式，不将其无提示地中性化；同时用“虔敬”表达ὅσιοι所含敬神、忠信行事的意味。“圣洁”也可能，但在现代汉语中容易使这一称呼显得更偏向身份或本体性的圣洁。
- issue: βλαστήσατε所描绘的生长阶段
  choice: 萌芽
  alternative: 开花；长出嫩芽
  rationale: 原动词泛指发芽、长出或萌生，并不必然表示已经盛开；因此不用“开花”来消除原文的开放性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“众子啊”保留智慧文学中长者对受教者的称呼方式；分号呈现由呼吁聆听转入比喻性劝勉的结构。
