  yaml_path: translation/deuterocanon/sirach/039/006.yaml
  text: If the great Lord wills[a], he will be filled with a spirit of understanding; he himself will pour forth words of wisdom like rain[b], and in prayer he will give thanks to the Lord.
translation:
  language: zh_hans
  text: 至大的主若愿意，他必被悟性之灵充满；他自己必如雨般倾洒智慧的话语[a]，并在祷告中感谢主[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必降下智慧的话语。”希腊文动词含有降雨的意象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“向主承认”或“颂赞主”。希腊文动词也可有这些含义；本句的祷告语境较支持“感谢”。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν Κύριος ὁ μέγας θελήσῃ
  choice: 伟大的主若愿意
  rationale: 保留ἐὰν加虚拟式所表达的真实条件，以及θελήσῃ的意愿含义；将Κύριος ὁ μέγας自然译为“伟大的主”。
- source_word: πνεύματι συνέσεως ἐμπλησθήσεται
  choice: 他就必充满明悟之灵
  rationale: ἐμπλησθήσεται是将来被动式，表达他将得到充满；“充满……之灵”在现代汉语中比机械的“被……之灵充满”自然。“明悟”兼顾理解力与洞察力。
- source_word: ἀνομβρήσει
  choice: 必如雨般倾降
  rationale: 此罕见动词含降雨意象；“如雨般倾降”既保留比喻，又避免把“话语下雨”直译得生硬。
- source_word: ῥήματα σοφίας
  choice: 智慧的话语
  rationale: 直接表达ῥήματα的言语、话语含义及σοφίας的所属或性质关系。
- source_word: αὐτός
  choice: 他自己
  rationale: 保留独立人称代词在此处的强调作用。
- source_word: ἐν προσευχῇ
  choice: 在祷告中
  rationale: 自然表达ἐν加与格所指的范围或情境。
- source_word: ἐξομολογήσεται Κυρίῳ
  choice: 感谢主
  rationale: 该动词可指感谢、赞颂、承认或认罪；在祷告语境中，“感谢主”最为顺畅，但以脚注保留其他真实可能。
theological_decisions:
- issue: ἐξομολογήσεται在祷告语境中的含义
  choice: 感谢主
  alternative: 向主承认／向主认罪，或颂赞主
  rationale: 上下文谈到智慧话语与祷告，较支持感恩或赞颂；但希腊词本身语义较宽，因此不把认信、承认或认罪的可能性从读者面前删去。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“他自己”的强调及降雨意象；脚注标记按其实际所注释的词语安放，纠正咨询层中标记与脚注内容错位的问题。
