  text: So also his wrath will dispossess nations, and he will turn their drink into brine.
translation:
  language: zh_hans
  text: 同样，他的烈怒必使列国失去产业[a]，又把他们所喝的变成盐水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他的烈怒必承受列国。”希伯来文在这里很可能是“使列国失去产业”，更符合审判的语境。
    reason: alternative_reading
  - marker: b
    text: 希腊文作“水”；希伯来文的词义较广，指“饮料”或“所喝的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  choice: 同样
  rationale: 承接上文，表达相应或类比关系；现代汉语简洁自然。
- source_word: זעמו
  choice: 他的烈怒
  rationale: זעם表示强烈的愤怒，在此关乎神的审判；“烈怒”既庄重，又符合语境。
- source_word: גוים
  choice: 列国
  rationale: 准确表达复数“各国、万国”，且不引入后来的族群或宗教对立。
- source_word: יוריש
  choice: 必赶逐
  rationale: 按使役形理解为使人失去产业或被逐出，即“赶逐、剥夺”；审判语境支持这一读法，同时以脚注保留希腊文的不同理解。
- source_word: ויהפך
  choice: 把……变成
  rationale: 自然表达转变结果，并与前半句的将来审判相衔接。
- source_word: למלח
  choice: 变成盐水
  rationale: 此处指可饮之物变咸而不可饮；“盐水”比抽象的“盐”更符合液体语境。
- source_word: משקה
  choice: 他们所喝的
  rationale: 希伯来文泛指饮料或所饮之物，不限于水；补出“他们”承接“列国”，使中文关系清楚而不缩窄词义。
theological_decisions:
- issue: יוריש应译为“赶逐”还是按希腊文译为“承受”
  choice: 他的烈怒必赶逐列国
  alternative: 他的烈怒必承受列国
  rationale: 现存希伯来文在审判语境中可自然理解为“使失去产业、赶逐”；希腊文则作“承受”，构成真实的文本与释义张力，故主文从希伯来文，脚注保留希腊文。
- issue: משקה应泛译为所饮之物，还是具体译为水
  choice: 他们所喝的
  alternative: 他们的水
  rationale: 主文依希伯来文较宽泛的משקה，不将意义限定为水；希腊文ὕδατα明确作“水”，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”“烈怒”保留经文诗体和审判语气；“他们所喝的”避免生硬的“饮物”，并忠实保留希伯来文较宽的指称。所有脚注标记均置于相关短语之后。
