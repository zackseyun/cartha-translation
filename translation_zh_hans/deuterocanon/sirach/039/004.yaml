  yaml_path: translation/deuterocanon/sirach/039/004.yaml
  text: He will serve among great men[a], and will appear before a ruler; he will travel through the land of foreign nations, for he has tested good and evil among men.
translation:
  language: zh_hans
  text: 他将在权贵中供职，也将在统治者面前出现；他将穿行于外邦各国的土地上，因为他曾在人间体验过善与恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “体验过”或译“考察过”“试验过”。希腊语动词可指经由亲历而认识，也可指尝试、试验或考察。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: 在权贵中
  rationale: ἀνὰ μέσον表示“在……中间”；μεγιστάνων指位高势显的人。“权贵”自然凝练，并保留其精英社会地位。
- source_word: ὑπηρετήσει
  choice: 供职
  rationale: 该动词表示服侍、侍奉或任职；在权贵与统治者的宫廷语境中，“供职”比泛泛的“服务”更贴切，又不引入宗教职分含义。
- source_word: ἔναντι ἡγουμένου ὀφθήσεται
  choice: 要在统治者面前露面
  rationale: ἔναντι表示“在……面前”，ἡγούμενος指领导或治理者，ὀφθήσεται字面为“将被看见”，此处惯用地表示获得觐见、公开出现；“露面”保留被人看见的语感。
- source_word: ἐν γῇ ἀλλοτρίων ἐθνῶν διελεύσεται
  choice: 要走遍异族之地
  rationale: διέρχομαι表示穿行、经过；ἀλλότρια ἔθνη是外来的、异族的民族。“异族之地”保留相对于本族而言的外来性；“走遍”以自然汉语表达在这些地域穿行。
- source_word: ἐπείρασεν
  choice: 曾……体验过
  rationale: πειράω可指试验、尝试或经由亲历而认识。此处以善恶为宾语，重点较可能是人生阅历；“体验过”自然表达亲历，同时脚注保留“考察”的主动试验意味。
- source_word: ἀγαθὰ καὶ κακὰ
  choice: 善与恶
  rationale: 直译这一宽泛的伦理及经验性对举，不把含义缩窄为顺境与逆境。
- source_word: ἐν ἀνθρώποις
  choice: 在人世间
  rationale: 该短语表示在人类社会之中。现代汉语的“人世间”自然、庄重，也不把希腊语的通称阳性误限为仅有男性。
theological_decisions:
- issue: ἀγαθὰ καὶ κακὰ 的范围
  choice: 善与恶
  alternative: 好事与坏事；福与祸
  rationale: 原文可涵盖道德判断与人生经验，宜保留其宽广张力，不把它限定为境遇或祸福。
- issue: ἐπείρασεν 表示试验还是亲历
  choice: 主文译作“体验过”，脚注保留“考察过”
  alternative: 试验过；考察过
  rationale: 上下文强调智者游历人间所得的阅历，但动词也有主动试探、考察之意；主文采用自然汉语，脚注保存词义歧义。
- issue: μεγιστάνων 与 ἀνθρώποις 的性别表达
  choice: 分别译作“权贵”和“人世间”
  alternative: 大人物／伟人；男人中
  rationale: μεγιστάνων强调身份等级而非生理性别，ἀνθρώποις在这里通指人类社会。如此翻译既符合现代普通话，也不额外限定原文所指群体。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“权贵”“统治者”体现宫廷及公共事务语境；分号保留原句的三段推进。脚注标记置于相关分句末尾。
