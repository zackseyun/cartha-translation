base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/028.yaml
  text: There are spirits created for judgment[a], and in their anger they move mountains; at the time of wrath they display their might[b], and they stir up a storm from the open country.
translation:
  language: zh_hans
  text: 有些灵是为施行审判而造的[a]；它们发怒时，使群山挪移；在震怒之时，它们显出威力[b]，从原野激起风暴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有些风是为施行惩罚而造的。”希伯来语“רוחות”和希腊语“πνεύματα”都可以指“灵”，也可以指“风”。
    reason: lexical_alternative
  - marker: b
    text: 后半句在开罗藏经库希伯来文本的校订本中置于方括号内，表示文本存在一定的不确定性；希腊语见证则支持收录本节较完整的内容。
    reason: textual_variant
lexical_decisions:
- source_word: רוחות
  choice: 灵
  rationale: 希伯来语可指“灵”或“风”，希腊语平行文本同样保留双义。正文采用“灵”，以呼应“被造来施行审判”及拟人化行动，同时在脚注保留“风”的可能。
- source_word: למשפט
  choice: 为施行审判
  rationale: 该短语表示受造的目的或职分；“施行审判”既自然，又不把 משפט 过早缩窄为单纯的刑罚。
- source_word: נוצרו
  choice: 而造的
  rationale: 准确表达被动的“被造／被塑造”，并与希腊语 ἔκτισται 相符；中文语境已隐含创造者。
- source_word: ובאפם
  choice: 它们发怒时
  rationale: אף 在此按常见习语表示怒气，且得到希腊语 ἐν θυμῷ αὐτῶν 的支持；用时间式表达使现代中文流畅。
- source_word: הרים יעתיקו
  choice: 能使群山挪移
  rationale: 保留使山岭移位的宏大意象，不将动词过度限定为“连根拔起”。“能”自然体现其惊人力量。
- source_word: בעת זעם
  choice: 在震怒之时
  rationale: 贴近“在愤怒／震怒的时候”，并保持审判语境下庄重而强烈的语气。
- source_word: גבורתם יראו
  choice: 它们显出威力
  rationale: 希伯来语可表示其力量被显明或由它们展示；此译法自然保留两者相通的含义。
- source_word: וסער מן שדה יעוררו
  choice: 从旷野激起风暴
  rationale: סער 为“风暴”，יעוררו 为“唤起／激起”；שדה 字面为田野或开阔地，此处“旷野”能自然表达风暴从开阔野地兴起的图景，但不取“荒地”这一更狭窄含义。
theological_decisions:
- issue: רוחות／πνεύματα 应理解为气象性的风，还是施行神圣审判的灵性行动者
  choice: 正文译作拟人化的“灵”
  alternative: “为惩罚而造的风”
  rationale: 希伯来语和希腊语均容许两解，且本节有意交织宇宙风暴与审判行动的意象。正文根据“被造来施行审判”及其拟人化行为采用“灵”，脚注则保留“风”的真实歧义。
- issue: 如何处理开罗藏经库希伯来文本中加方括号的后半句
  choice: 收入正文，并以脚注说明文本不确定性
  alternative: 视为次生材料，仅翻译前半句
  rationale: 所给希伯来版本以方括号标示后半句，表明文本传承存在不确定性；但希腊语见证含有对应的扩展内容，因此收入正文较为妥当，同时应透明说明证据状况。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“灵／风”的歧义不在正文中强行消解，而以脚注保留；后半句照录，同时如实交代希伯来文本的括注状况。
