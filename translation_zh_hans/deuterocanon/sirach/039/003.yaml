  text: He will seek out the hidden things of proverbs[b][a], and will occupy himself with the riddles of parables.
translation:
  language: zh_hans
  text: 他要探求箴言中隐秘的事[a]，也要潜心揣摩比喻中的谜语[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“箴言中隐晦之处。”希腊语可泛指隐藏或隐晦的事，并不只限于“含义”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“也要置身于比喻的谜语之中。”这里的希腊语动词可表示在某一领域中活动、与之交往，或专注于其中。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόκρυφα
  choice: 隐秘的事
  rationale: 该词是中性复数名词化用法，指隐藏、隐晦之事；译作“隐秘的事”比直接限定为“深意”更贴近原文，并保留其所指的开放性。
- source_word: παροιμιῶν
  choice: 箴言中
  rationale: παροιμία指箴言、格言式言语；结合“隐秘的事”，用“箴言中”自然表达其所属范围。
- source_word: ἐκζητήσει
  choice: 要探求
  rationale: 复合动词带有认真搜寻、深入考察之意；“探求”简洁地传达这种主动而深入的寻求。
- source_word: ἐν αἰνίγμασι
  choice: 谜语中
  rationale: αἴνιγμα指谜语或隐晦难解的话；介词ἐν标明活动所在的领域，译作“……中的谜语”符合现代汉语表达。
- source_word: παραβολῶν
  choice: 比喻中的
  rationale: παραβολή在智慧文学中可指比喻、类比或寓言；“比喻”保留较宽的语义，不把它局限为特定文类。
- source_word: ἀναστραφήσεται
  choice: 要潜心揣摩
  rationale: 该动词在此表示置身其中、持续与之打交道或专注于此；“潜心揣摩”自然传达持续投入和思索的语境含义，同时脚注保留更贴近其空间性隐喻的译法。
