  text: He will preserve the accounts of famous men, and he will enter into the twists of parables.
translation:
  language: zh_hans
  text: 他会保存著名人物的记述，也会进入比喻的曲折之中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσεις
  choice: 事迹
  rationale: 该词指叙述、记述或故事；与“名人”搭配时，“事迹”自然凝练，同时保留有关他们的记述这一含义。
- source_word: ἀνδρῶν ὀνομαστῶν
  choice: 名人
  rationale: 直指有名望、知名的人；现代汉语用“名人”简洁自然，且不必把泛指男性的形式刻意扩展。
- source_word: συντηρήσει
  choice: 会牢记
  rationale: συντηρέω可指保存、持守，也可指牢记于心；本段谈论研习者对传统智慧的专注，“牢记”在汉语中既自然又保留保存于心的意味。
- source_word: ἐν στροφαῖς παραβολῶν
  choice: 比喻的曲折之处
  rationale: στροφαί有转折、曲折之意，可能指比喻中迂回、难解的表达；译文保留原文形象及其一定程度的含混。
- source_word: συνεισελεύσεται
  choice: 会深入探索
  rationale: 字面有“进入其中、与之同入”的意味；此处表达进入比喻的曲折深处加以探究，“深入探索”符合现代汉语语境。
theological_decisions:
- issue: “比喻的曲折”是否应解释为奥秘、隐义或难题
  choice: 比喻的曲折之处
  alternative: 比喻的奥秘／隐义／难解之处
  rationale: 原文使用στροφαί而非明确表示“奥秘”或“隐义”的词，因此不把它限定为某种神学释经观，保留其修辞上的曲折和难解性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两分句保持平行结构；不添加原文没有的主语身份或神学解释。
