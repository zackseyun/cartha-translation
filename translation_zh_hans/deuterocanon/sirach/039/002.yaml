    rationale: συνεισελεύσεται 的基本图像是进入、涉入；原文未明说系统地“探索”。
  - severity: low
    issue: “名人”带有现代语境的潜在歧义。
    rationale: “著名人物”更中性，适用于古代叙述中的有名望之人。
  revised_text: 他会保存著名人物的记述，也会进入比喻的曲折之中。
