base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/017.yaml
  text: At his word the waters pile up like a heap[a], and at the utterance of his mouth are storehouses of water.
translation:
  language: zh_hans
  text: 他一发话，众水便堆聚如垒；他口中一出言，便有储水的库房。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本末句简略作“他口中一出言，他的库房”，省略了谓语；希腊文本作“储水的库房”（复数）。译文据希腊文本补明其为储水之处，但不确定这些库房是被造、开启还是以其他方式显现。
    reason: alternative_reading
lexical_decisions:
- source_word: בדברו
  choice: 他一发话
  rationale: 介词ב既可表示凭借，也可表示时机；“一发话”以简洁自然的汉语兼顾“借着他的话”和“他一说话”的意味，并与下句形成平行。
- source_word: יעריך
  choice: 便聚成
  rationale: ערך基本义为“排列、布置”。用于众水与“垒”的意象时，表示水被聚拢、列成堆垒；“聚成”既传达结果，也避免生硬直译为“排列”。
- source_word: כנד מים
  choice: 众水……成垒
  rationale: נד在描写水时指堆起的水垒或积聚之物。译作“成垒”保留水被竖聚如墙垒的诗歌图景；“众水”体现集合意义。
- source_word: ובמוצא פיו
  choice: 他口中一出言
  rationale: מוצא פיו字面是“他口中所出的”；译文保留口与言语的具体意象，并与“他一发话”构成诗体平行。
- source_word: אוצרו
  choice: 储水的库房
  rationale: 希伯来文本简略作“他的库房/库藏”，希腊平行文本明确作“储水的库房（复数）”。结合上句的众水，译作“储水的库房”使所指清楚，同时以脚注交代文本差异。
- source_word: ἔστη
  choice: 便立定
  rationale: 希腊平行文本的“立住、立定”直接支配上半句，也可理解为在并列结构中延续至下半句；补出“立定”使中文句法完整，又保持神命令一出、受造秩序即告确立的意象。
theological_decisions:
- issue: “他”的所指
  choice: 沿用代词“他”，由上下文指向创造主
  alternative: 在本节明说“上帝”
  rationale: 本段上下文足以表明所指是上帝；不在本节增添原文没有的名词，可保留诗歌衔接和原文表达。
- issue: 水因话语聚集及库房立定的关系
  choice: 保留两个平行结果，不解释其具体自然机制
  alternative: 解释为上帝创造或开启天上的水库
  rationale: 原文强调命令与结果，却没有说明是创造、开启还是约束；译文不替文本消除这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。“水垒”意象以“聚成垒”表达；“库房”比“宝库”更直接体现储水之所，同时避免把古代宇宙图景过度现代化为工程意义上的“水库”。
