  yaml_path: translation/deuterocanon/sirach/029/024.yaml
  text: A miserable life is to go from house to house[a], and where one stays as a stranger[b], he will not open his mouth.
translation:
  language: zh_hans
  text: 从一家到另一家，过的是苦日子[a]；无论寄居在哪一家，他都不开口[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“从一家到另一家，是一种苦日子。”原文描绘的是在不同人家之间辗转、居无定所的处境。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“无论在哪里寄居，他都不开口”。“寄居”指以外来者或非家庭成员的身份居住；原文没有说明他不开口的具体原因。
    reason: ambiguity_and_cultural_note
lexical_decisions:
- source_word: ζωὴ πονηρά
  choice: 过的是苦日子
  rationale: 这里的 πονηρά 更自然地描述生活艰苦、困窘，而非道德上的邪恶；“苦日子”符合现代汉语，也切合寄人篱下的语境。
- source_word: ἐξ οἰκίας εἰς οἰκίαν
  choice: 从这家到那家
  rationale: 保留从一个家庭辗转到另一个家庭的空间意象，并以自然汉语传达居所不定的处境。
- source_word: παροικήσει
  choice: 寄居在哪里
  rationale: παροικέω 指以外来者、非正式成员的身份居住；“寄居”兼顾暂住和不属于当地或该家庭的意味。
- source_word: οὐκ ἀνοίξει στόμα
  choice: 便不敢开口
  rationale: 原文直译为“不张口”。“不敢开口”表达寄居者因缺乏地位而沉默的语境含义；脚注注明原文并未明说“不敢”，以保留其开放性。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“从这家到那家”保留原文的反复辗转意象；“寄居”准确呈现局外人的社会处境。主文以“不敢开口”传达语境中的受拘束感，同时借脚注保留希腊文仅陈述“不开口”的含混性。
