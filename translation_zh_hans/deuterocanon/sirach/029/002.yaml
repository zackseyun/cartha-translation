  text: Lend to your neighbor in his time of need, and in turn repay your neighbor on time.
translation:
  language: zh_hans
  text: 要在邻舍有需要时借给他，也要按时把所欠的还给邻舍。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δάνεισον
  choice: 借给
  rationale: 准确表达向人出借财物的命令语气；以“要”体现希腊文命令式，同时保持现代汉语自然。
- source_word: τῷ πλησίον
  choice: 邻舍
  rationale: 保留智慧文学中对身边之人的伦理称谓；本节两处均一致译出。
- source_word: ἐν καιρῷ χρείας αὐτοῦ
  choice: 在邻舍有需要时
  rationale: καιρός在此指需要发生的时机，χρεία指需要、缺乏；合译简明自然。
- source_word: πάλιν
  choice: 也
  rationale: 原词可有“反过来、相应地、又”之意；此处连接借出与偿还两项相应义务，以“也”自然表达，不强行限定为特定先后情境。
- source_word: ἀπόδος
  choice: 把所欠的还给
  rationale: ἀποδίδωμι表示归还、偿付；补出汉语语境中隐含的宾语“所欠的”，避免误读为把邻舍本人‘还回去’。
- source_word: εἰς τὸν καιρόν
  choice: 按时
  rationale: 表示到应当履行的时间、在期限内；“按时”简洁传达守期偿还的要求，而不额外引入原文未明说的正式约定。
theological_decisions:
- issue: πάλιν所表达的互惠关系
  choice: 译作“也”，保留借贷双方相应的伦理责任
  alternative: 译作“反过来”或“轮到你时”
  rationale: 原文既可连接两个命令，也可暗示角色互换后的相应义务；“也”不把经文限制为同一笔交易或固定角色转换。
- issue: 偿还对象与内容
  choice: 明确为“把所欠的还给邻舍”
  alternative: 直译为“还给邻舍”
  rationale: 汉语需要适度补足受词才能清楚表达债务偿还；所补内容由δάνεισον与ἀπόδος构成的借贷语境直接支持，不增添教派性解释。
translation_notes:
  register: 采用现代、庄重而通俗的劝诫语体。两个“要”对应并列命令；保留“邻舍”这一经文伦理用语，并用“按时”自然表达守期偿还。
