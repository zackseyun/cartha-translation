  yaml_path: translation/deuterocanon/sirach/029/020.yaml
  text: Support your neighbor according to your ability[a], and watch yourself lest you fall.
translation:
  language: zh_hans
  text: 要按你的能力扶助邻舍，也要谨慎自守，免得跌倒。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得陷入困境”或“免得落入圈套”。希腊原文没有具体说明所指的危险。
    reason: 词义存在合理替代译法，且原文刻意保留危险对象的不确定性。
lexical_decisions:
- source_word: ἀντιλαβοῦ
  choice: 扶助
  rationale: 该中间语态命令式表达主动援助、扶持之意；“扶助”既保留实际帮助的力度，也适合庄重而自然的现代汉语。
- source_word: τοῦ πλησίον
  choice: 邻舍
  rationale: 在伦理语境中，πλησίον指应当帮助的身边之人；“邻舍”是中文圣经语体中清楚而稳定的对应词，并不限于住处相邻者。
- source_word: κατὰ δύναμίν σου
  choice: 按你的能力
  rationale: κατά加宾格在此表示尺度或限度；此译保留量力而行、以自身能力为界的含义。
- source_word: πρόσεχε σεαυτῷ
  choice: 谨慎自守
  rationale: 这是要求留意自身处境的警戒语。“谨慎自守”自然凝练，兼顾警醒与保护自己的意思。
- source_word: μὴ ἐμπέσῃς
  choice: 免得跌倒
  rationale: ἐμπίπτω本义为“落入、陷入”，但原文没有说明落入什么；“免得跌倒”保留这一开放性的警告，不在正文中擅自限定为经济、道德或其他困境。
theological_decisions:
- issue: μὴ ἐμπέσῃς所指危险的范围
  choice: 保留为一般性的“免得跌倒”
  alternative: 免得陷入困境；免得落入圈套
  rationale: 经文把扶助邻舍与自我谨慎并列，形成慷慨与审慎之间的张力。希腊文未明说危险为何，因此不将其收窄为财务损失、道德失败或受人算计。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“邻舍”保留圣经伦理语境中的传统用语；句式简洁，呈现原文先劝助人、继而警戒自守的平衡。
