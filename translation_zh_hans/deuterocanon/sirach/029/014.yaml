  text: A good man will stand surety for his neighbor[a], but one who has lost shame will abandon him.
translation:
  language: zh_hans
  text: 善人必为邻舍作保；失去羞耻的人[a]却会抛弃他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无耻的人”。希腊文直译为“失去羞耻的人”。
    reason: 保留ὁ ἀπολωλεκὼς αἰσχύνην的字面动态意象，并说明自然的汉语替代表达。
lexical_decisions:
- source_word: ἀνὴρ ἀγαθός
  choice: 善人
  rationale: 既保留ἀνήρ ἀγαθός所表达的道德正直，也符合汉语智慧文学的凝练表达；“人”在现代汉语中可自然承载原文的代表性单数，不必生硬译作“好男人”。
- source_word: ἐγγυήσεται
  choice: 愿意……作保
  rationale: ἐγγυάομαι指为别人承担担保责任。“作保”准确保留法律和财务语义；将将来时译作“愿意”体现格言中由品格而生的典型行为，避免被误解为单纯预测。
- source_word: τὸν πλησίον
  choice: 邻舍
  rationale: πλησίον在伦理和社会关系语境中指近人、邻人；“邻舍”清楚自然，并延续汉语圣经传统中这一关系性用语。
- source_word: ὁ ἀπολωλεκὼς αἰσχύνην
  choice: 丧尽羞耻的人
  rationale: 保留完成分词“已经失去”与αἰσχύνη“羞耻感、廉耻”的形象。“丧尽羞耻”较“无耻之徒”更贴近原文的动词结构，也传达道德约束已经丧失。
- source_word: καταλείψει αὐτόν
  choice: 却会抛弃他
  rationale: καταλείπω在此指丢下、遗弃。“抛弃”传达作保关系中背弃他人的意味；“却”显明上下两类人的对照，但不增加新的命题内容。
theological_decisions:
- issue: 智慧格言中的阳性单数
  choice: 善人
  alternative: 善良的男人
  rationale: 原文ἀνήρ为阳性单数，但本句是代表性格言。现代汉语“善人”既没有否认原文形式，也避免把普遍的道德教训不自然地限定为成年男性。
- issue: “失去羞耻”的道德意象
  choice: 丧尽羞耻的人
  alternative: 无耻的人
  rationale: 采用接近希腊文结构的表达，保留一个人已经丧失羞耻或廉耻这一动态意象，而不把它压缩成单一标签。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持智慧文学格言的平衡与对照。“作保”保留本章的经济法律背景；“邻舍”具有适度的圣经语体色彩，但普通读者仍易理解。原文语义足够明确，因此不设脚注。
