  text: Many have regarded a loan as a windfall[a], and have caused trouble for those who helped them.
translation:
  language: zh_hans
  text: 许多人把借款当作意外之财[a]，反倒给帮助他们的人带来麻烦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“当作捡到的东西”或“当作所得之物”，意思是把借来的钱看成意外得到的好处，而不是应当偿还的款项。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 不定复数，泛指许多人；译法简洁自然。
- source_word: ὡς εὕρεμα
  choice: 当作意外之财
  rationale: εὕρεμα本指所找到之物，也可指意外所得；在借贷语境中，表示把借来的钱视为无需偿还的意外收益。
- source_word: ἐνόμισαν
  choice: 把……当作
  rationale: νομίζω在此表示认为、看作；用现代汉语惯用结构准确传达。
- source_word: δάνος
  choice: 借款
  rationale: δάνος指借出的或借入的一笔款项，而非抽象的负债状态；“借款”直接明确。
- source_word: παρέσχον πόνον
  choice: 带来麻烦
  rationale: 该短语直义为“造成劳苦、痛苦”，此处指给施助者造成困扰；“带来麻烦”自然且保留负面后果。
- source_word: τοῖς βοηθήσασιν αὐτοῖς
  choice: 给帮助他们的人
  rationale: 分词指曾向他们提供帮助的人，语境中即出借者；不额外加入原文未明说的社会身份。
