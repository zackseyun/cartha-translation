  text: A sinner who falls into surety and pursues contracts will fall into lawsuits[a][b].
translation:
  language: zh_hans
  text: 罪人若陷入替人担保，又一味寻求承揽事务，必会卷入诉讼[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诉讼”也可译作“审判”或“法律纠纷”。希腊语 κρίσεις 可广指司法程序、裁决或争讼；这里因上下文涉及担保和承揽事务，译作“诉讼”。
    reason: lexical_alternative
  - marker: b
    text: “替人担保”指为别人的债务或义务承担担保责任。
    reason: cultural_note
lexical_decisions:
- source_word: ἁμαρτωλός
  choice: 罪人
  rationale: 单数名词作泛指，保留原文的道德定性，不额外限定性别。
- source_word: ἐμπεσὼν εἰς ἐγγύην
  choice: 陷入为人作保
  rationale: ἐγγύη指为他人的债务或义务作担保；“陷入”保留ἐμπίπτω的落入、陷入意象，同时用“为人作保”自然说明其含义。
- source_word: διώκων
  choice: 追逐
  rationale: 保留该分词主动追求、奔逐的力度，也符合本节警戒性的语气。
- source_word: ἐργολαβίας
  choice: 承揽事务
  rationale: 该词可指承包、承揽的业务或契约性事务；此译比单纯“合同”更能体现其活动或经营行为，同时避免过度限定具体行业。
- source_word: ἐμπεσεῖται εἰς κρίσεις
  choice: 终必卷入诉讼
  rationale: κρίσεις在此可指审判、司法程序或法律争端；结合担保与承揽事务的语境，“诉讼”最自然。“卷入”延续原文再次使用ἐμπίπτω所形成的呼应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句中两次以“陷入／卷入”对应原文ἐμπίπτω的重复，呈现从主动涉入担保、经营活动到被动陷入司法争端的警戒结构；“若……又……终必……”使希腊语分词与将来时的关系在中文中清楚自然。
