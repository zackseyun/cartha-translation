  text: More than a strong shield and more than a mighty spear, it will fight for you against an enemy.
translation:
  language: zh_hans
  text: 面对仇敌，它[a]必为你争战，胜过坚固的盾牌，也胜过强有力的长矛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在本节没有再次说明主语；这里把上文所称许之物拟人化，说它替你争战。按上下文，也可能明确理解为“你的善行”或“你的担保”。
    reason: 说明隐含主语及可能的上下文指向，避免正文过度限定。
lexical_decisions:
- source_word: ὑπὲρ（用于ἀσπίδα和δόρυ之前）
  choice: 胜过
  rationale: 此处重复用于两种兵器之前，表达价值或效力上的超越，而非“为了”。
- source_word: ἀσπίδα κράτους
  choice: 坚固的盾牌
  rationale: ἀσπίς是盾牌；属格κράτους表示力量或坚固的性质，译为“坚固的”自然且保留军事意象。
- source_word: δόρυ ἀλκῆς
  choice: 强劲的长矛
  rationale: δόρυ指矛；ἀλκή在此强调力量、勇力或战斗效能。“强劲的长矛”与前句形成自然的平行。
- source_word: κατέναντι ἐχθροῦ
  choice: 面对仇敌
  rationale: κατέναντι在战斗语境中表示在敌人面前、与之对抗；ἐχθροῦ无冠词，可作泛指，故不限定为某一特定敌人。
- source_word: πολεμήσει
  choice: 必……争战
  rationale: 将来时动词表示将要作战；“必”体现前瞻语气，“争战”庄重而易懂。
- source_word: ὑπὲρ σοῦ
  choice: 为你
  rationale: 此处ὑπὲρ表示受益或代表关系，即替听者出战。
- source_word: πολεμήσει的隐含主语
  choice: 它
  rationale: 希腊文没有重述主语，而是承接上文所称许之物。现代汉语虽可省略主语，但本节独立呈现时用中性“它”较清楚，同时借脚注保留所指的不确定性。
theological_decisions:
- issue: “必为你争战”的主语所指
  choice: 正文使用中性代词“它”，不明确指认其先行词
  alternative: 明确译作“你的善行”“你的慈惠”或“你的担保”
  rationale: 希腊文本节只保留隐含主语，具体所指须由上文推知。明确补入某一种解释会消除原文留下的语境张力，因此正文采用中性代词，并在脚注说明。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。保留盾牌、长矛和争战的军事比喻；以“也”呈现两个“胜过”分句的平行关系。
