base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/006.yaml
  text: If he is able[a], he will scarcely recover half, and will count it as a find; but if not, he has been deprived of his money, and has gained an enemy for nothing. He will repay him with curses and insults[b], and instead of honor he will repay him with dishonor.
translation:
  language: zh_hans
  text: 出借人若办得到，也只能勉强收回一半，并把这看作意外之得[a]；若办不到，借款人就使他失去钱财，又白白使他成了自己的仇敌[b]。借款人会以咒骂和辱骂回报出借人，以羞辱代替尊荣回报他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “意外之得”直译为“找到的东西”；意思是，即使只收回一半，出借人也把它当作意外得来的收获。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“使他得了一个并非白白得来的仇敌”。这里指借款人使出借人因钱财损失而成为自己的仇敌；“白白”带有徒然、无益的反讽。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἰσχύσῃ
  choice: 他若有能力偿还
  rationale: ἰσχύω表示有力量或有能力；结合借贷语境，所指是借款人有能力偿还。补出“偿还”使现代汉语清楚，但不规定他能否足额偿还。
- source_word: μόλις κομίσεται τὸ ἥμισυ
  choice: 债主也只能勉强收回一半
  rationale: κομίζω在此指收回借出的钱，μόλις表示艰难或仅仅做到；“勉强收回”兼顾动作和困难程度。
- source_word: λογιεῖται αὐτὸ ὡς εὕρεμα
  choice: 还会把这看作意外之得
  rationale: λογίζομαι是看作、算作，εὕρεμα本指找到之物；“意外之得”保留即使收回一半也像捡到钱一样的讽刺意味。
- source_word: ἀπεστέρησεν αὐτὸν τῶν χρημάτων αὐτοῦ
  choice: 他就使债主失去钱财
  rationale: ἀποστερέω可指剥夺、侵占或欺骗取得；此处采用较中性的“使……失去”，避免额外断定借款人蓄意诈骗。
- source_word: ἐκτήσατο αὐτὸν ἐχθρὸν οὐ δωρεάν
  choice: 债主付了代价，反倒给自己添了这个仇敌
  rationale: κτάομαι表示取得、添得；οὐ δωρεάν字面为“不是无代价地”，语境中的苦涩反讽是债主损失钱财后又得到敌意。
- source_word: κατάρας καὶ λοιδορίας
  choice: 咒骂和辱骂
  rationale: 两个词都指敌意言语；前者偏重诅咒，后者偏重凌辱、斥骂，译文保留二者并列。
- source_word: ἀποδώσει αὐτῷ
  choice: 回报债主
  rationale: ἀποδίδωμι可指偿还或回报；此处借用“回报”保留反讽：借款人没有按理还钱，反以恶言和羞辱相报。
- source_word: ἀντὶ δόξης ... ἀτιμίαν
  choice: 以羞辱代替尊重
  rationale: δόξα与ἀτιμία在此涉及社会评价和礼遇。“尊重／羞辱”构成自然、清楚的现代汉语对比，避免把δόξα过度神学化为“荣耀”。
theological_decisions:
- issue: 借贷失败的社会伦理含义
  choice: 按具体借贷情境呈现债主的钱财损失、双方结怨以及借款人的恶言相向
  alternative: 将经文扩大解释为对利息、欺诈或神圣审判的一般教义判断
  rationale: 希腊文本集中描述实际后果，并未在本节明说利息制度、借款人的预谋欺诈或上帝的审判，因此不加入这些判断。
- issue: 代词所指与叙事角色
  choice: 依上下文分别明确为“借款人”和“债主”，正文用“他”承接借款人，用“债主”标明受损者
  alternative: 完全照搬希腊文连续代词，使现代汉语难以判断谁失去钱财、谁成为仇敌
  rationale: 希腊文借助上下文可辨认角色，现代汉语若只用“他”会产生额外混乱；适度明示角色属于语义澄清，而非加入新教义。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“债主”与“偿还”明确借贷场景；两次“回报”保留原文以偿还措辞形成的反讽。正文所有脚注标记均已对应列出。
