revisions:
- from: 他若有能力偿还，债主也只能勉强收回一半，还会把这看作意外之得[a]；若不然，他就使债主失去钱财，而债主付了代价，反倒给自己添了这个仇敌[b]。他会以咒骂和辱骂回报债主，以羞辱代替尊重回报他。
  to: 出借人若办得到，也只能勉强收回一半，并把这看作意外之得[a]；若办不到，借款人就使他失去钱财，又白白使他成了自己的仇敌[b]。借款人会以咒骂和辱骂回报出借人，以羞辱代替尊荣回报他。
  rationale: 修订首先恢复本节与前文连贯的叙事主语：出借人若能追回钱，也仅能收回一半。后半节明确借款人为主动施事，既避免把“使他成为自己的仇敌”误作债主主动添敌，也保留原文以“回报”描写未还债反以恶言和羞辱相报的讽刺。脚注a保留εὕρεμα的字面意象；脚注b说明代词关系及οὐ δωρεάν的反讽，不添加关于欺诈意图、利息或审判的断言。
