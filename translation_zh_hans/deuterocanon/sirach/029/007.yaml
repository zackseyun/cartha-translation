  text: Many[a], because of wickedness, turned away; they were afraid of being defrauded gratuitously.
translation:
  language: zh_hans
  text: 许多人因邪恶而退避[a]，害怕无故受骗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “退避”也可译作“转身离去”或“退缩”。
    reason: 保留ἀπέστρεψαν“转开、离去、撤回”的词义范围，且不把上下文推断的“拒绝借贷”写入正文。
  - marker: b
    text: “无故”也可译作“白白地”或“徒然地”；“受骗”亦可理解为“被剥夺”或“蒙受损失”。
    reason: 说明ἀποστερηθῆναι与δωρεὰν的语义范围，避免将受损限定为特定的财物或特定施事者。
lexical_decisions:
- source_word: πολλοὶ
  choice: 许多人
  rationale: 以不定复数概括一类人的普遍反应，符合现代汉语表达。
- source_word: χάριν πονηρίας
  choice: 因恶行
  rationale: χάριν与属格连用，表示“因为、由于”；πονηρία保留道德上的恶，也可涵盖本段借贷语境中的欺诈行为，而不限定恶行属于哪一方。
- source_word: ἀπέστρεψαν
  choice: 退避
  rationale: 该动词表示转身离开、退回或避开；“退避”自然地表达因风险而不再施助，同时不把上下文未明说的“拒绝借贷”直接写入正文。
- source_word: ἀποστερηθῆναι
  choice: 被人侵吞财物
  rationale: 被动不定式表示被剥夺应得之物，在借贷语境中带有遭欺骗、财物被侵占的意味；此译法清楚传达经济损失。
- source_word: δωρεὰν
  choice: 平白
  rationale: 可表示“无缘无故、白白地、徒然”；“平白”既自然，又保留无端受损和徒然受损之间的语义张力。
- source_word: εὐλαβήθησαν
  choice: 害怕
  rationale: 此处表示出于谨慎而惧怕某种后果；“害怕”直接呈现其动机。
theological_decisions:
- issue: πονηρίας所指恶行的归属
  choice: 译作“因恶行”，不明定是谁的恶行
  alternative: 因别人的欺诈而退避
  rationale: 希腊文只说明退避与恶有关，并未以所有格明确指出恶行的主体；正文保留这种开放性，避免将上下文推断写成明示内容。
- issue: 本节对退避行为的道德评价
  choice: 如实陈述退避和惧怕，不另加谴责或辩护
  alternative: 许多人因此不肯帮助穷人
  rationale: 经文描述因恶行及受损之惧而退避；若增添“不肯帮助穷人”等措辞，会提前解释其伦理意义并缩窄原文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“退避”比“转身离去”更贴合借贷与施助的语境，但仍保留原动词的撤回意味；“平白被人侵吞财物”让普通读者清楚理解经济风险，同时以脚注保留“徒然受损”的另一可能。
