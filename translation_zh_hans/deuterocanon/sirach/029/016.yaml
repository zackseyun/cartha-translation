  text: A sinner will overturn the good things of a guarantor,[a]
translation:
  language: zh_hans
  text: 罪人会毁掉担保人的好处。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“罪人会毁掉担保人的财物。”希腊语ἀγαθὰ可广指好处、利益、福祉或财物。
    reason: 词义存在宽窄不同的合理理解；正文保留较宽泛的意义，脚注列出上下文中可能突出的财产义。
lexical_decisions:
- source_word: ἀγαθὰ
  choice: 好东西
  rationale: 该中性复数可广指好处、福分或财物；译作“好东西”保留原文的宽泛性，不预先限定为物质财产。
- source_word: ἐγγύου
  choice: 担保人的
  rationale: ἐγγύος指为别人承担担保责任的人；“担保人”是现代汉语中清楚、自然的法律和财务用语。
- source_word: ἀνατρέψει
  choice: 会毁掉
  rationale: 该动词本义为推翻、颠覆，在这里表达使担保人的所有或处境败坏；“毁掉”在现代汉语中自然，并保留强烈的破坏意味。
- source_word: ἁμαρτωλός
  choice: 罪人
  rationale: 无冠词单数在此作泛指；“罪人”直接保留原文的道德定性，也不增添原文未要求的性别限定。
theological_decisions:
- issue: 对行为主体的道德定性
  choice: 罪人
  alternative: 有罪的人
  rationale: 本节是伦理警告，并非展开教义论述；“罪人”直接对应ἁμαρτωλός，既保持原文力度，也不额外具体化。
- issue: ἀγαθὰ所指范围
  choice: 正文保留宽泛的“好东西”
  alternative: 财物
  rationale: 上下文可能着重经济损失，但该希腊词本身可涵盖财物、益处及其他美好之物；正文不应无依据地缩窄其范围，物质含义放入脚注说明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“担保人”准确传达法律和财务语境；“好东西”虽较日常，却最能保留原词的宽泛意义，脚注补充更具体的“财物”译法。
