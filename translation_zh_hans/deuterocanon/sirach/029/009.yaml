  yaml_path: translation/deuterocanon/sirach/029/009.yaml
  text: For the sake of the commandment[a], help the poor, and according to his need do not send him away empty.
translation:
  language: zh_hans
  text: 因着那诫命，要扶助穷人；要按他的需要，不可让他空手而去[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可空手打发他走。”
    reason: ἀποστρέψῃς可侧重使其离去，也可侧重拒绝、打发；两种译法都与κενόν“一无所得”相合。
lexical_decisions:
- source_word: χάριν ἐντολῆς
  choice: 因着那诫命
  rationale: χάριν接属格表示缘由或动机；“因着”自然传达“为了……的缘故”。“那诫命”保留ἐντολῆς单数且有所特指的语气，却不擅自认定是某一条具体律法。
- source_word: ἀντιλαβοῦ
  choice: 扶助
  rationale: 该中间语态命令式有伸手扶持、援助之意；“扶助”既保留积极支持的形象，也符合现代汉语庄重而易懂的表达。
- source_word: πένητος
  choice: 穷人
  rationale: πένης指贫穷、缺乏生活资源的人。“穷人”简明自然，也不把泛指对象不必要地限定为男性个体。
- source_word: κατὰ τὴν ἔνδειαν αὐτοῦ
  choice: 按他的需要
  rationale: ἔνδεια表示缺乏、匮乏或需要；“按他的需要”保留κατά在此所表达的衡量或相应关系。
- source_word: μὴ ἀποστρέψῃς αὐτὸν κενόν
  choice: 不可让他空手而去
  rationale: ἀποστρέφω可表示使人转身离开或拒绝，κενόν则突出一无所得的状态；此译自然表达不可拒绝求助者、使其空手离开的意思。
theological_decisions:
- issue: “那诫命”所指为何
  choice: 保留为未明确说明的、具有神圣或道德权威的诫命
  alternative: 明确译成摩西律法中的某一条诫命，或弱化为一般劝告
  rationale: 希腊文ἐντολῆς为单数，语气有所特指，但经文本身没有说明具体是哪条诫命。因此译文既保留其权威性，也不将其限定为某一具体律法条文。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“扶助”比单纯“帮助”略能体现ἀντιλαβοῦ所含的主动扶持意味；分号保留两项命令之间紧密而有层次的关系。脚注标记置于其实际说明的末句之后。
