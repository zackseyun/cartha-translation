base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/027.yaml
  text: Go out[a], sojourner, from the place of honor, for my brother has become my guest[b], and I need the lodging.
translation:
  language: zh_hans
  text: “寄居的人，离开尊荣之地[a]吧！因为我的兄弟来我这里作客，需要住宿之处。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊荣之地”原文直译近于“从尊荣的面前离开”，也可理解为“离开受尊重的位置”。希腊语表达不寻常；此处可能是要寄居者让出显要或尊贵的位置，给另一位客人腾出地方。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作“有接待客人的需要”或“需要住处”。ξενία可指款待或住宿；原文强调因又有一位客人而产生的需要，但未明确限定为一间客房，或明确说明谁是住宿的受益者。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξελθε
  choice: 离开……吧
  rationale: 这是ἐξέρχομαι的命令式；“离开”在此自然表达要求对方让出所在之处，同时保留命令的直接语气。
- source_word: πάροικε
  choice: 寄居的人
  rationale: πάροικος指住在当地却不属于本地共同体的人，可带暂居者或外来者之意；“寄居的人”既通俗，也保留其处境上的脆弱性。
- source_word: ἀπὸ προσώπου δόξης
  choice: 离开尊荣之地
  rationale: 原文直译近于“从尊荣的面前”，希腊语表达不寻常。结合上下文，较可能指显要或受尊重的位置；正文采用自然中文，并以脚注保存字面形式及不确定性。
- source_word: ἐπεξενώταί μοι
  choice: 来投宿在我这里
  rationale: 该完成时形式表示某人已被接待并处于作客状态；“来投宿在我这里”自然表达其结果，也保留与住宿、待客有关的语义。
- source_word: ὁ ἀδελφός
  choice: 我的兄弟
  rationale: 希腊文直为“那弟兄/兄弟”，但与μοι相连的语境自然暗示说话者与此人的关系；“我的兄弟”可指亲兄弟，也不排除亲族或同群体成员。
- source_word: χρεία τῆς ξενίας
  choice: 我需要客房
  rationale: χρεία表示需要或必要，ξενία可指款待、住宿或客居处。上下文是为新来的客人腾地方，“客房”清楚传达具体需要；脚注列出较抽象的可能译法。
