translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寄居的人”保留社会身份色彩；引语用直接命令呈现原文的突兀与压力。两处脚注分别保存ἀπὸ προσώπου δόξης的不寻常表达，以及ξενία在“款待”与“住宿”之间的语义幅度。
