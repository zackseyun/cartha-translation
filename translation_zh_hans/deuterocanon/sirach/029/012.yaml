  yaml_path: translation/deuterocanon/sirach/029/012.yaml
  text: Store up almsgiving in your treasuries[b][a], and it will rescue you from every affliction.
translation:
  language: zh_hans
  text: 要把施舍收藏在你的库房里[a]，它必救你脱离一切苦难[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要把周济穷人的善行收藏在你的储藏室里。”希腊文直译为“要把施舍封闭在你的库房里”。
    reason: lexical_alternative
  - marker: b
    text: “苦难”也可译作“祸患”“伤害”或“虐待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: 封存
  rationale: 该命令式本义为“关住、封闭”，与宝库意象结合时表示将贵重之物妥善收存；“封存”既保留原文形象，也符合现代汉语。
- source_word: ἐλεημοσύνην
  choice: 施舍
  rationale: 在希腊化时期犹太语境中，该词通常指向穷人提供财物的慈善行动，而非仅指抽象的怜悯；“施舍”简洁而具体。
- source_word: ἐν τοῖς ταμείοις σου
  choice: 在你的宝库里
  rationale: ταμεῖον可指储藏室、内室或宝库；此处把施舍比作珍贵之物收存起来，“宝库”最能传达比喻意味。
- source_word: ἐξελεῖταί
  choice: 必救……脱离
  rationale: 该动词表示从危险或困境中救出；“救……脱离”自然、庄重，又不过度加入特定的救恩论含义。
- source_word: ἐκ πάσης κακώσεως
  choice: 脱离一切苦难
  rationale: κακώσις可表示受苦、困苦、伤害或虐待；“苦难”适合本节智慧文学中蒙拯救脱离患难的语境，同时保留一定语义宽度。
theological_decisions:
- issue: 如何表达施舍被人格化的救助效力
  choice: 它必救你脱离一切苦难
  alternative: 这必救你脱离一切祸患
  rationale: 希腊文直接把保护和救助的效力归于“施舍”。译文照原文保留这一神学张力，不将其弱化为一般后果，也不加入后来的教义限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要把……封存在……”保留命令语气及财宝入库的比喻；“它”明确回指“施舍”，保留原文的人格化表达。
