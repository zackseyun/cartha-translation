  yaml_path: translation/deuterocanon/sirach/029/005.yaml
  text: Until he receives it[a], he will kiss his neighbor's hand, and for his neighbor’s money he will lower his voice; but at the time of repayment he will delay[b], and he will repay with words of indifference and blame the timing.
translation:
  language: zh_hans
  text: 在拿到钱以前，他会连连亲吻邻人的手，为了邻人的钱低声下气地说话；但到了还款的时候，他会拖延时日，只用冷漠敷衍的话来“偿还”[a]，还把责任归咎于时机[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偿还”在这里带有反讽意味：他没有还钱，只拿冷漠敷衍的话来抵偿。
    reason: lexical_alternative
  - marker: b
    text: “时机”也可译作“时候”或“情势”；原文没有说明他具体怪罪哪一种外在因素。
    reason: ambiguity
lexical_decisions:
- source_word: ἕως οὗ λάβῃ
  choice: 在拿到钱以前
  rationale: 希腊文省略了所接受之物；上下文明确指借得的钱。此译自然地标明奉承行为发生在钱到手之前。
- source_word: καταφιλήσει χεῖρα αὐτοῦ
  choice: 他会连连亲吻邻人的手
  rationale: καταφιλέω带有热切或反复亲吻的加强意味，因此译作“连连亲吻”；“邻人”依紧接着的τοῦ πλησίον补明代词所指，同时保留具体的屈尊奉承形象。
- source_word: ἐπὶ τῶν χρημάτων τοῦ πλησίον
  choice: 为了邻人的钱
  rationale: ἐπί在这里表示引发这种卑下言辞的缘由或目的；“为了”简洁地传达借款人因想得到对方的钱而奉承。
- source_word: ταπεινώσει φωνήν
  choice: 低声下气地说话
  rationale: 字面为“使声音卑微”。现代汉语成语“低声下气”既保留声音降低的意象，也准确表达谦卑逢迎的语气。
- source_word: ἐν καιρῷ ἀποδόσεως
  choice: 到了还款的时候
  rationale: ἀπόδοσις在借贷语境中指归还所欠款项；此译清楚自然。
- source_word: παρελκύσει χρόνον
  choice: 拖延时日
  rationale: 该短语不是单纯一次性的迟延，而有把时间拖长、不断搪塞之意；“拖延时日”保留其形象和力度。
- source_word: ἀποδώσει λόγους ἀκηδίας
  choice: 只用冷漠敷衍的话来“偿还”
  rationale: ἀποδώσει与还款形成反讽：该还钱时，所给的却只有话。ἀκηδία可指漠不关心、怠慢或疏忽；“冷漠敷衍的话”保留其语义范围，又符合汉语语境。
- source_word: τὸν καιρὸν αἰτιάσεται
  choice: 把责任归咎于时机
  rationale: αἰτιάομαι表示责怪或归咎；καιρός可指时机、时候或当下情势。“时机”保留原文对具体时间还是处境的开放性。
