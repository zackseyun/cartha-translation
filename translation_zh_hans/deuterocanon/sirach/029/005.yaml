translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“邻人”对应πλησίον，较“邻舍”更符合当代普通话；“低声下气”和“拖延时日”使句意自然，同时保留原文对借款人前倨后恭的讽刺。
