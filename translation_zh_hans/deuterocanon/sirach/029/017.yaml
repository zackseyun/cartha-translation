  text: And one who is ungrateful in mind will abandon the one who rescued him[a].
translation:
  language: zh_hans
  text: 而心中忘恩的人，会离弃那救过他的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀχάριστος
  choice: 忘恩
  rationale: 该词指缺乏感恩之心；“忘恩”在现代汉语中自然、凝练，并保留其鲜明的道德意味。
- source_word: ἐν διανοίᾳ
  choice: 心里
  rationale: 该短语强调内在的思想或心态。“心里忘恩”既贴近希腊文，又比抽象的“在意念中”更符合现代汉语表达。
- source_word: ἐγκαταλείψει
  choice: 必离弃
  rationale: 该将来时动词意为撇下、遗弃。“离弃”表达蓄意背弃关系；“必”体现箴言式将来陈述的确定语气。
- source_word: ῥυσάμενον
  choice: 那救过他的人
  rationale: 这是ῥύομαι的简过去时中态分词，指曾施行搭救的人。汉语补出由语境隐含的受事“他”，并用“救过”体现先于离弃发生的行动。
- source_word: καί
  choice: 而
  rationale: 保留与上文的连接，同时用“而”自然引出这句带有对照或递进意味的警告。
theological_decisions:
- issue: 泛指人物的性别表达
  choice: ……的人
  alternative: 忘恩的男人
  rationale: 希腊文没有明示“男人”或“人”的名词，只有形容词和分词的语法性阳性形式。汉语用“……的人”可准确保留泛指，不额外加入生理性别。
- issue: “心里”的修饰范围
  choice: 把ἐν διανοίᾳ与ἀχάριστος连读为“心里忘恩”
  alternative: 把它理解为独立状语，如“在心思中离弃”
  rationale: 词序最自然地表明该短语描述忘恩者的内在品性；译文保留这一内在层面，而不把它移到“离弃”上。
- issue: ῥυσάμενον隐含受事
  choice: 补出“他”
  alternative: 译作“施救的人”而不说明获救者
  rationale: 分词本身直译为“救过的那一位”，受救对象由句中忘恩者自然补足。汉语若不补出“他”，关系会显得含混；补出后不改变原句所表达的人际指向。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留箴言式警告的力度。“心里忘恩”明确呈现原文对内在心态的强调；“离弃”比口语化的“丢下”更适合经文语体，但仍为普通读者易懂。
