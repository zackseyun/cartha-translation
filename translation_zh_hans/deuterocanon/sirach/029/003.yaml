  text: Keep your word[a], and be faithful to him, and at all times you will find what you need.
translation:
  language: zh_hans
  text: 要信守诺言，并对他守信[a]；这样，无论何时，你都会得到自己所需的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”也可较抽象地指前面的诺言或约定。全句亦可译为：“要使你的诺言坚定，并在这事上显为可信。”
    reason: 保留μετʼ αὐτοῦ的个人或抽象所指歧义，并说明στερέωσον λόγον及πιστώθητι的可行较直译表达。
lexical_decisions:
- source_word: στερέωσον
  choice: 信守
  rationale: 该命令式本义为“使之坚定、确立”。在借贷与偿还的语境中，与“诺言”搭配译作“信守”，自然表达使承诺坚定、切实履行的含义。
- source_word: λόγον
  choice: 诺言
  rationale: λόγος可指话语、承诺或约定；此处涉及财务信用与人际责任，“诺言”比单译“话”更清楚，同时不过度限定为正式契约。
- source_word: πιστώθητι
  choice: 忠实
  rationale: 该词在此表示显为可信、可靠或忠诚。“忠实”保留其道德意味，并与前句的履约要求衔接。
- source_word: μετʼ αὐτοῦ
  choice: 对他
  rationale: 希腊文直译近于“与他一同／同他相处”，最自然是指交易或约定的另一方；现代汉语用“对他忠实”表达关系指向。代词也可能较抽象地关联前面的承诺或约定，故以脚注保留。
- source_word: ἐν παντὶ καιρῷ
  choice: 无论何时
  rationale: 该短语指每一个时候或任何场合；“无论何时”自然保留其广泛的时间范围。
- source_word: εὑρήσεις
  choice: 会得到
  rationale: εὑρίσκω直义为“找到”，但与“所需之物”搭配时，汉语“得到”更自然地表达实际获得供应或帮助，未增添具体来源。
- source_word: τὴν χρείαν σου
  choice: 自己所需的
  rationale: χρεία指需要、必需之物或用处；“自己所需的”符合现代汉语习惯，并保留原文未具体说明所需为何物的开放性。
