lexical_decisions:
- source_word: ἐπὶ μικρῷ καὶ μεγάλῳ
  choice: 无论所有的是少是多
  rationale: ἐπί加与格在这里表示所处的情形或拥有的分量；此译自然地保留“少”与“多”的对照，并避免生硬直译为“在小与大之上”。
- source_word: εὐδοκίαν
  choice: 知足
  rationale: εὐδοκία可指喜悦、满意或认可；与ἔχε构成命令语气时，表达保持满意、接纳的心态。现代汉语用“知足”简明自然，同时保留其劝勉意味。
- source_word: ἔχε
  choice: 要
  rationale: ἔχε字面是“持有”，在εὐδοκίαν ἔχε这一结构中承担命令功能；汉语以“要知足”表达，比“持有满意”更自然。
