translation:
  language: zh_hans
  text: 生活的根基，是水、饼、衣服和遮盖羞耻的房屋。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羞耻”或译“裸露”或“不雅之处”。希腊词可泛指羞耻或不雅，也可特指应当遮盖的身体裸露。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ ζωῆς
  choice: 维持生命所必需的
  rationale: ἀρχή可指开端、根基或首要之物；在这句列举基本生活条件的格言中，译作“维持生命所必需的”能自然表达其基础、首要之义，而不误解为生命在时间上的开始。
- source_word: ὕδωρ
  choice: 水
  rationale: 具体列举生活必需品，直译即可。
- source_word: ἄρτος
  choice: 食物
  rationale: ἄρτος字面为“饼、面包”，也可泛指食物；在现代汉语的基本生活条件清单中，“食物”较自然，也避免把普遍命题局限于某一种主食。
- source_word: ἱμάτιον
  choice: 衣服
  rationale: 此处单数具有集合意义，现代汉语用“衣服”自然准确。
- source_word: οἶκος
  choice: 住所
  rationale: οἶκος本义为房屋，也可指居所；此处作为生活基本条件，“住所”既保留具体居住空间，又比“房子”更贴合功能语境。
- source_word: καλύπτων
  choice: 遮蔽
  rationale: 现在分词修饰οἶκος，表达住所持续发挥遮盖、保护的作用。
- source_word: ἀσχημοσύνην
  choice: 羞体
  rationale: 该词可指羞耻、不雅之处或裸露的身体；结合衣服和住所的语境，“羞体”保留羞耻与身体裸露两层含义，且不把意义泛化为抽象的羞耻感。
