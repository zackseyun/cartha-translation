translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留原文格言式列举结构。将Ἀρχὴ ζωῆς按语境译为“维持生命所必需的”，避免生硬的“生命的开端”；“羞体”则有意保留ἀσχημοσύνην在抽象羞耻与具体裸露之间的语义张力。
