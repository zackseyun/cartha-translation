  yaml_path: translation/deuterocanon/sirach/029/022.yaml
  text: Better is the life of a poor man under shelter than splendid food in another's house[a][b].
translation:
  language: zh_hans
  text: 穷人在木梁搭成的屋顶下过日子[a]，胜过在别人家吃丰盛的饭菜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希腊词δοκῶν是δοκός（“梁木”）的属格复数，与“遮蔽、屋顶”连用，指“梁木的屋顶”。在不标重音的书写中，它可与δοκέω（“以为、看来”）的分词同形。
    reason: lexical_ambiguity
  - marker: b
    text: 或译：“在外人中间吃华美的菜肴”，也可较宽泛地理解为“享用属于别人的丰盛饭菜”。希腊语ἐν ἀλλοτρίοις可指在别人那里、外人中间，或在属于他人的事物中。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσων
  choice: 胜过
  rationale: 比较级形容词引出智慧格言中的优劣对比；汉语用“胜过”自然明确。
- source_word: βίος πτωχοῦ
  choice: 穷人……过日子
  rationale: βίος在此指生活或生活方式；将属格πτωχοῦ融入汉语主谓结构，比直译为“穷人的生活”更自然。
- source_word: ὑπὸ σκέπην δοκῶν
  choice: 在木梁搭成的屋顶下
  rationale: σκέπη表示遮盖或屋顶；δοκῶν按δοκός（梁木）的属格复数理解，构成“梁木的屋顶/遮蔽”。译文保留具体意象而不擅自加入“自家”或“简陋”等原文未明说的含义。
- source_word: ἐδέσματα λαμπρά
  choice: 丰盛的饭菜
  rationale: ἐδέσματα指食物、菜肴，λαμπρά在此表示华美、上等；“丰盛的饭菜”符合现代汉语格言语境。
- source_word: ἐν ἀλλοτρίοις
  choice: 在别人家
  rationale: ἀλλότριος指属于他人的、外人的；结合屋顶与饮食的语境，“在别人家”自然表达依赖他人住所或款待的对比，同时以脚注保留较宽泛的可能。
