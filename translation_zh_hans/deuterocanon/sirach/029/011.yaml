  text: Store up your treasure according to the commandments of the Most High[a], and it will profit you more than gold.
translation:
  language: zh_hans
  text: 要按至高者的诫命积存你的财宝；它给你带来的益处胜过黄金。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θὲς
  choice: 积存
  rationale: 这是 τίθημι 的不定过去时命令式。与“财宝”搭配时，“积存”自然表达把财宝妥善储备起来，而不只是一般性的“放置”。
- source_word: τὸν θησαυρόν σου
  choice: 你的财宝
  rationale: θησαυρός 指财宝或储存的财富；“财宝”既保留财富意象，也符合智慧文学中关于人所珍视之物的表达。
- source_word: κατʼ ἐντολὰς
  choice: 按……的诫命
  rationale: κατά 在此表示依照、遵循；ἐντολάς 是复数，因此译作“诫命”，不将其化为集合意义的单数。
- source_word: Ὑψίστου
  choice: 至高者
  rationale: 这是犹太希腊文献中对上帝称号 Ὕψιστος 的标准、庄重译法。
- source_word: λυσιτελήσει σοι
  choice: 给你带来的益处
  rationale: λυσιτελέω 表示有益、有利。此译法在现代汉语中自然，并明确保留 σοι“对你”的受益关系。
- source_word: μᾶλλον ἢ τὸ χρυσίον
  choice: 胜过黄金
  rationale: 该比较结构表示比黄金更有益；“胜过黄金”简洁保留比较和财富意象，未将其泛化为单纯的道德评价。
theological_decisions:
- issue: 是否把本节明确限定为施舍
  choice: 保留原文较宽泛的“按至高者的诫命积存你的财宝”
  alternative: 译成“要施舍，照至高者的命令为自己积存财宝”
  rationale: 上下文涉及借贷、慷慨和施舍，但本节希腊文本身没有明说“施舍”。因此不把上下文中的一种具体应用直接加入正文，以保存原文的表达范围。
- issue: 财宝本身还是按诫命行事带来益处
  choice: 用“这样做”承接整项行动，并保留一定指代张力
  alternative: 明确译为“这财宝给你的益处”或“遵守诫命给你的益处”
  rationale: 希腊文 λυσιτελήσει 的主语可由前面的整体行动或“财宝”来理解。中文用“这样做”较自然地承接前句，同时不额外建立特定教义性的因果解释。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“要……；这样做……”清楚传达命令与结果。“诫命”严格保留希腊文复数形式；正文不添加原文没有的“施舍”。
