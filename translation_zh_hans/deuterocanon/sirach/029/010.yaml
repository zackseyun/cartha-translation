  text: Lose silver for a brother and a friend[a], and do not let it rust under a stone to destruction.
translation:
  language: zh_hans
  text: 要为弟兄和朋友舍掉银钱；也不要把它藏在石头底下，以致锈蚀、毁坏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要让银钱在石头底下腐蚀，以致毁掉。”这里的希腊语动词罕见，词义不易确定；结合上下文，意思是钱财若被藏起来而不用于帮助他人，最终会败坏或白白损失。
    reason: 说明罕见动词 μὴ ἰωθῇ 的词义不确定性，并给出“腐蚀”这一可行译法。
lexical_decisions:
- source_word: ἀπόλεσον
  choice: 舍掉
  rationale: 这是ἀπόλλυμι的不定过去时命令式；在本句中不是无意遗失，而是劝人为了亲近之人甘愿放弃钱财。“舍掉”保留了原文带有反常意味的力度，也没有像“花费”那样削弱牺牲色彩。
- source_word: ἀργύριον
  choice: 银钱
  rationale: 原义为“银”，也常指钱财。“银钱”既保留古代以银为钱的具体意象，又能让现代读者直接明白其经济含义。第二分句补出“银钱”，以避免汉语代词指向不清。
- source_word: διʼ ἀδελφὸν καὶ φίλον
  choice: 为弟兄和朋友
  rationale: διά加宾格在此表示缘故或受益对象。“为”自然表达为了亲近之人的益处；不擅自加入“你的”等原文没有的领属成分。
- source_word: μὴ ἰωθῇ
  choice: 不要让……锈坏
  rationale: 该动词形式罕见且词义有困难；结合银钱藏在石头底下的语境，所描绘的是钱财因藏置不用而腐蚀、败坏。“锈坏”保留古代形象，同时脚注提示词义的不确定性。
- source_word: ὑπὸ τὸν λίθον
  choice: 藏在石头底下
  rationale: 直译核心意象为“在石头底下”；加入“藏”使汉语自然，并明确这是埋藏、囤积钱财的画面，而不改变原意。
- source_word: εἰς ἀπώλειαν
  choice: 而归于毁灭
  rationale: εἰς表示结果或趋向，ἀπώλεια可指毁灭、败亡或损失。“归于毁灭”保留原文严厉而略带格言色彩的措辞，不把它弱化为单纯的经济贬值。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的格言式表达。“弟兄”保留智慧文学中亲近同胞或手足的传统称呼；“舍掉银钱”保留原文劝人甘愿承受钱财损失的张力。脚注标记紧随存在词义困难的“锈坏”，便于读者准确对应。
