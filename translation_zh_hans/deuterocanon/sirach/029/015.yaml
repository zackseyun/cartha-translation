  text: Do not forget the kindnesses of a guarantor[b][a], for he gave his life for you.
translation:
  language: zh_hans
  text: 不要忘记担保人的恩情[a]，因为他为你交出了自己的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为你作保之人的恩惠。”这里指担保人为别人的债务或义务承担责任。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“他的生命”；在这里可指他本人或他所冒的生命危险。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτας
  choice: 恩情
  rationale: 复数 χάριτας 在这里指担保人所施的具体恩惠；汉语“恩情”自然地表达受惠者应当铭记的情分，而不引入神学术语“恩典”的意味。
- source_word: ἐγγύου
  choice: 担保人的
  rationale: ἐγγύος 指为他人的债务或义务作保的人；“担保人”是现代汉语中清楚、准确的对应词。
- source_word: μὴ ἐπιλάθῃ
  choice: 不要忘记
  rationale: 直接保留希腊文禁止式的语气，表达不可忘却所受恩惠。
- source_word: ἔδωκεν
  choice: 交出了
  rationale: δίδωμι 本义为“给”；结合担保人承担重大风险的语境，“交出了”比单说“给了”更自然，同时不额外加入献祭含义。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自己的性命
  rationale: ψυχή 在此指生命或本人所承受的风险，并非对“灵魂”作人论陈述；“自己的性命”既保留强烈程度，也符合现代汉语表达。
- source_word: ὑπὲρ σοῦ
  choice: 为你
  rationale: ὑπέρ 表示为某人的利益或代表某人；“为你”简洁，并保留“为了你、替你”的语义范围。
theological_decisions:
- issue: ψυχή 是否应直译为“灵魂”
  choice: 自己的性命
  alternative: 自己的灵魂；他自己
  rationale: 上下文谈的是担保人为债务人承担切身风险，而不是界定灵魂的性质；译作“性命”可避免不必要的神学化，同时保留原文力度。
- issue: “为你交出性命”可能产生代赎联想
  choice: 保留原文强烈措辞，但不加入“牺牲”“赎罪”等词
  alternative: 为你冒了生命危险
  rationale: 原文确实说“给出他的 ψυχή”，不宜弱化成纯粹解释性转述；同时，本节的社会经济语境不支持添加特定救赎论含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恩情”避免把 χάριτας 误读为专门的神学“恩典”；“交出了自己的性命”保留原文的强烈表达，并以脚注说明其在担保语境中的含义。
