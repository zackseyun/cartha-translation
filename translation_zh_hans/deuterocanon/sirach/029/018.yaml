base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/018.yaml
  text: Surety has destroyed many who were upright[a], and has shaken them like a wave of the sea; it has driven mighty men from their homes, and they wandered among foreign nations.
translation:
  language: zh_hans
  text: 为人作保[a]毁掉了许多原本顺遂的人[b]，使他们像海浪一样摇荡；它迫使有权势的男子离乡背井，他们便漂泊在异族中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作保”指为别人的债务承担担保责任。
    reason: 说明ἐγγύη的法律与财务含义。
  - marker: b
    text: “顺遂”也可译作“行正路”或“正直”。希腊词既可表示沿着正直的道路前行，也可表示进展顺利。
    reason: 保留κατευθύνοντας在道德正直与境况顺遂之间的语义张力。
lexical_decisions:
- source_word: ἐγγύη
  choice: 为人作保
  rationale: 该名词指为他人的债务提供担保。“为人作保”以现代汉语直接表达其法律和财务含义，也与本章语境吻合。
- source_word: ἀπώλεσεν
  choice: 毁掉了
  rationale: 该动词表达使人遭受毁灭或败亡；这里主要指生活、产业和处境被毁，不必限定为丧失生命。“毁掉了”保留原文的强烈程度。
- source_word: κατευθύνοντας
  choice: 原本顺遂的人
  rationale: 该分词可指行路正直、进展顺利或处境亨通的人。结合债务担保导致倾覆的语境，“原本顺遂的人”自然地传达其事业或生活本来进展良好的含义，同时用脚注保留“行路正直”的可能性。
- source_word: ἐσάλευσεν
  choice: 使他们……摇荡
  rationale: 该动词意为摇动、震荡或使之站立不稳；“摇荡”与随后的海浪比喻自然衔接。
- source_word: ὡς κῦμα θαλάσσης
  choice: 像海浪一样
  rationale: 贴近原文的单数比喻，同时符合现代汉语表达。
- source_word: ἄνδρας δυνατούς
  choice: 有权势的男子
  rationale: δυνατούς可指强壮、有能力或有势力；此处强调连有力量和地位者也不能幸免。ἄνδρας明确为男性，因此保留“男子”。
- source_word: ἀπῴκισεν
  choice: 迫使……离乡背井
  rationale: 该动词表示使人离开本乡本土、迁居远方或流亡。“迫使……离乡背井”明确呈现非自愿的迁离，并与下句的漂泊相连。
- source_word: ἐπλανήθησαν
  choice: 漂泊
  rationale: 在被迫离乡并身处异族的语境中，该词主要描述流离游荡，而非道德上的迷误。
- source_word: ἐν ἔθνεσιν ἀλλοτρίοις
  choice: 在异族中
  rationale: ἔθνη在此指外来的民族或族群，ἀλλότριος强调不属于自己的；“在异族中”简洁保留社会与地域上的疏离感。
theological_decisions:
- issue: κατευθύνοντας是指品行正直还是处境顺遂
  choice: 正文译作“原本顺遂的人”
  alternative: “行正路的人”或“正直的人”
  rationale: κατευθύνω的基本意象是使道路笔直、顺利前行，也可引申为兴旺顺遂。债务担保使本来境况良好者败落的语境支持“顺遂”，但原文仍容许道德性的“正直”理解，因此不在正文中绝对排除，并以脚注说明。
- issue: ἄνδρας δυνατούς的性别表达
  choice: 有权势的男子
  alternative: 有权势的人或强者
  rationale: 原文使用明确表示成年男性的ἄνδρας，而非泛指人类的词，因此保留男性所指；δυνατούς则按语境译为社会力量或地位上的“有权势”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“离乡背井”“漂泊在异族中”保持智慧文学的凝练节奏；分号对应原文两组并列后果。正文不把债务担保的风险弱化为一般建议，也不将“毁掉”限定为死亡。
