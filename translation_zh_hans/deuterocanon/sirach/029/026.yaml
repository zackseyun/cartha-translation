base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/026.yaml
  text: Move along[a], sojourner; set the table in order, and if you have anything in your hand, feed me with it.
translation:
  language: zh_hans
  text: “往前走[a]，寄居者[b]！把桌子摆好；你手里若有什么，就给我吃。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“走过去”或“过来”。原文动词可表示经过、上前，也可依语境表示离开；这里译作“往前走”，以保留其生硬、驱使人的口吻，而不确定其移动方向。
    reason: 保留Πάρελθε在移动方向和语用语气上的歧义。
  - marker: b
    text: “寄居者”指住在当地、却仍被视为外来者而非家户正式成员的人；也可译作“外乡人”。
    reason: 说明πάροικος所表达的社会身份，并提供自然的词义选择。
lexical_decisions:
- source_word: Πάρελθε
  choice: 走开吧
  rationale: 这是 παρέρχομαι 的命令式。该动词本可表示“经过、走过去、上前”，但在此处对寄居者发号施令的语境中，“走开吧”较能传达生硬、驱使人的口吻；其方向上的歧义在脚注中保留。
- source_word: πάροικε
  choice: 寄居的人
  rationale: πάροικος 指住在当地却不属于本地共同体或家户正式成员的人。“寄居的人”既自然易懂，也保留其外来者、非正式成员的社会地位；“客人”会减弱这种疏离感。
- source_word: κόσμησον
  choice: 摆好
  rationale: κοσμέω 在这里与“桌子”搭配，表示整理、布置妥当，而不是装饰美化。
- source_word: τράπεζαν
  choice: 桌子
  rationale: 保留原文具体的家居意象；在此语境中指备餐用的桌子。
- source_word: εἴ τι ἐν τῇ χειρί σου
  choice: 你手里若有什么
  rationale: 贴近原文的条件句和具体表达，同时在现代汉语中可自然表示手头拥有食物或其他可供之物。
- source_word: ψώμισόν με
  choice: 就拿来给我吃
  rationale: ψωμίζω 指拿食物或一口一口地给人吃。“拿来给我吃”在汉语中自然地保留命令的直接性，也与前文“手里若有什么”衔接。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的口语化命令句。用感叹号和简洁措辞保留说话者居高临下、近乎驱使的语气；不把“寄居的人”弱化为受欢迎的“客人”，也不把 Πάρελθε 的方向歧义默默消除。
