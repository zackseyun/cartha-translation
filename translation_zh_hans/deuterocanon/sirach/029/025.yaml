  text: You will host and give drink to the ungrateful[a], and besides these things you will hear bitter words.
translation:
  language: zh_hans
  text: 你会款待不知感恩的人，供他们饮用；除此以外，你还会听到尖刻的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“苦的事。”原文没有明说所听到的内容；译文按汉语习惯补出“话”，指尖刻、令人难受的言语。
    reason: implicit_object
lexical_decisions:
- source_word: ξενιεῖς
  choice: 你接待人
  rationale: ξενίζω在此指接待客旅、款待来客。“接待人”用现代汉语自然表达其待客含义，也与下文“给人喝的”形成并列。
- source_word: ποτιεῖς
  choice: 给人喝的
  rationale: ποτίζω意为给某人饮用之物。此译保留动作的直接性，并避免误解为接待者自己饮酒。
- source_word: εἰς ἀχάριστα
  choice: 却得不到感谢
  rationale: ἀχάριστα为中性复数，介词短语可表示这些款待落得不被感激、徒劳无谢的结果；译作“得不到感谢”比把它直接人格化为“不知感恩的人”更贴近希腊语形态，同时保留结果性的语气。
- source_word: πρὸς ἐπὶ τούτοις
  choice: 除此以外
  rationale: 该叠加式短语强调在前述负担之外还有一层；“除此以外”简洁自然地保留其递进作用。
- source_word: πικρὰ
  choice: 刺耳的话
  rationale: πικρά字面为“苦的事物”，与“听到”连用时指令人难受、尖刻的话。“刺耳的话”符合现代汉语习惯；原文未明说“话”，故加注说明。
- source_word: ἀκούσει
  choice: 还会听到
  rationale: ἀκούω的简单将来时，直接译为“会听到”；加“还”承接前面的递进短语。
