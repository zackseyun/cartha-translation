  yaml_path: translation/deuterocanon/sirach/029/028.yaml
  text: 'These things are grievous to a man who has understanding: the reproach of a household and the insult of a lender.'
translation:
  language: zh_hans
  text: 这些事使明达的人感到沉重：家中的责难和债主的侮辱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρέα
  choice: 难以忍受
  rationale: 本义为“沉重、难承受”；结合寄居受辱的语境，用“难以忍受”自然表达其心理重压。
- source_word: ἀνθρώπῳ ἔχοντι φρόνησιν
  choice: 明达的人
  rationale: φρόνησις指实践性的明智、明辨；“明达”简洁而庄重。
- source_word: ἐπιτίμησις οἰκίας
  choice: 家主的责骂
  rationale: ἐπιτίμησις为斥责、责骂；οἰκίας字面可指“房屋／家”，但此处承接寄居他人屋檐下的语境，宜理解为来自一家之主的责骂。
- source_word: ὀνειδισμὸς δανιστοῦ
  choice: 债主的羞辱
  rationale: ὀνειδισμός指责辱、羞辱；δανιστής通常指放债者或债主，“债主”符合现代汉语。
theological_decisions:
- issue: οἰκίας的语义归属
  choice: 译作“家主的”
  alternative: “一家人的”或“家中的”
  rationale: 希腊语属格表达简略，存在一定歧义；结合本段谈寄居和债务所受屈辱的语境，“家主”最能形成自然、具体的汉语意义，但不赋予额外神学含义。
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。两个并列短语保持原文节奏；不用生硬的“有明智的人”，改为普通读者易懂的“明达的人”。
