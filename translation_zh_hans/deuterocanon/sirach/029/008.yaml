  text: But be patient with the humble[a], and do not keep him waiting for almsgiving.
translation:
  language: zh_hans
  text: 但对贫苦的人要有耐心，不要让他为领周济而久等。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在施舍的事上不要耽搁他。”希腊语动词可指推迟或把事情拖延下去。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: 但
  rationale: 承接前文并引出限制或转折；“但”简洁自然，保留其转折作用。
- source_word: ἐπὶ ταπεινῷ
  choice: 对贫苦的人
  rationale: ταπεινός可指卑微、困苦或贫穷的人；本节处于借贷与施舍的语境，“贫苦的人”既体现社会经济处境，也避免把它仅理解为内在谦卑。
- source_word: μακροθύμησον
  choice: 要有耐心
  rationale: 该命令式表达耐心、宽容和恒久忍耐；“要有耐心”符合现代汉语伦理劝诫的自然表达。
- source_word: ἐπʼ ἐλεημοσύνην
  choice: 为领周济
  rationale: ἐλεημοσύνη在犹太希腊语中常指对穷人的具体施舍或救济；结合αὐτόν作为受助者，以“领周济”自然呈现其具体语境。
- source_word: μὴ παρελκύσῃς
  choice: 不要让……久等
  rationale: παρέλκω可表示拖延、耽搁或把事情拖长；这里宾语是人，“不要让他久等”保留拖延受助者的个人性含义。
- source_word: αὐτόν
  choice: 他
  rationale: 保留希腊文阳性单数代词，并明确回指前述贫苦的人。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“贫苦的人”保留ταπεινός在经济困境与社会卑微之间的语义空间；“周济”比“施舍”在正文中更自然且较少居高临下的色彩，脚注则保留较贴近原文结构的译法。
