  yaml_path: translation/deuterocanon/sirach/029/001.yaml
  text: He who shows mercy lends to his neighbor[a], and he who strengthens him with his hand keeps the commandments.
translation:
  language: zh_hans
  text: 施行怜悯的人，会借给邻舍；用自己的手扶助他的人[a]，遵守诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“用自己的手扶助他”或“使他坚强”，描绘实际而具体的援助。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ποιῶν ἔλεος
  choice: 施怜悯的人
  rationale: ποιέω与ἔλεος连用，指实际施行怜悯，而不只是心里同情；“施怜悯”自然、庄重，也保留了主动实践的含义。
- source_word: δανιεῖ
  choice: 必借给
  rationale: 这是将来时，表达这种人会采取借贷行动；“必”保留概括性的将来意味。“借给”在本章语境中自然指借出财物。
- source_word: τῷ πλησίον
  choice: 给邻舍
  rationale: πλησίον在伦理语境中通常指身边的人；“邻舍”保留了其熟悉的伦理和经文色彩。
- source_word: ὁ ἐπισχύων τῇ χειρὶ αὐτοῦ
  choice: 亲手扶助他的人
  rationale: ἐπισχύω有使人强健、支持或扶助之意；工具性短语“用他的手”形成具体行动的图景。“亲手扶助”在现代汉语中自然，并保留实际援助的意味。代词“他”承接前句的邻舍。
- source_word: τηρεῖ ἐντολάς
  choice: 就是遵守诫命
  rationale: τηρέω与ἐντολή连用，惯常表示谨守、遵守诫命；“就是”呈现施以援手与守诫命之间的判断关系。
theological_decisions:
- issue: ἐντολάς应理解为一般命令，还是带有信仰语境的诫命
  choice: 诫命
  alternative: 命令
  rationale: 《便西拉智训》的智慧传统使该词自然指向上帝的诫命；译作“诫命”保留其道德与宗教分量，同时不具体限定为某一组诫命。
- issue: 后半句是在描述普通帮助，还是把实际扶助视为守诫命
  choice: 保留“就是遵守诫命”的直接判断
  alternative: 便算是遵守诫命
  rationale: 希腊文直接以τηρεῖ陈述“遵守诫命”，没有弱化为仅仅“算作”；译文因此保留慈惠行动与顺服诫命之间的紧密张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“施怜悯”“邻舍”“诫命”保留智慧文学与经文语体；“亲手扶助”使具体的手部意象在中文中自然呈现。
