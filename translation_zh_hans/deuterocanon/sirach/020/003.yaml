  text: Like a eunuch’s desire to deflower a young woman, so is one who executes judgments by force.
translation:
  language: zh_hans
  text: 阉人的欲望是使少女失去童贞；以强力[a]施行审判的人也是如此。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以暴力手段”。希腊语ἐν βίᾳ既可强调强迫，也可强调暴力行为。
    reason: lexical_alternative
  - marker: b
    text: 这个比喻可能着重指出以强力施行审判的错误，也可能着重指出这种做法的不相称、荒谬或徒劳。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμία
  choice: 想要
  rationale: 该名词表示愿望、欲望或渴求；译作“想要”能以自然现代汉语表达其欲求，又不额外强化原文未明说的情欲色彩。
- source_word: εὐνούχου
  choice: 太监
  rationale: εὐνοῦχος指阉人或宦官；“太监”是普通读者易懂的现代汉语对应词，并保留比喻所依赖的身体处境。
- source_word: ἀποπαρθενῶσαι
  choice: 夺去……的贞洁
  rationale: 该动词特指使女子失去童贞。“夺去……的贞洁”准确传达动作及其侵犯意味，同时比文言化的说法更易懂。
- source_word: νεάνιδα
  choice: 少女
  rationale: νεᾶνις指年轻女子；“少女”简洁自然，并与这里关于贞洁的语境相合。
- source_word: οὕτως
  choice: 也是如此
  rationale: 该词引出前后类比；“也是如此”清楚保留箴言的比拟结构。
- source_word: ὁ ποιῶν
  choice: 施行……的人
  rationale: 分词字面意为“做……的人”；与κρίματα连用时，“施行判决”既保留行动含义，也符合汉语司法语境。
- source_word: ἐν βίᾳ
  choice: 强行
  rationale: 介词短语可表示凭强力、胁迫或暴力而行；“强行”简明自然，并保留手段上的强制意味。
- source_word: κρίματα
  choice: 判决
  rationale: 复数名词在此指裁断、判决或司法行为；“判决”比“正义”更贴近其具体司法含义，也避免把原文解释成抽象观念。
theological_decisions:
- issue: 这则比喻的道德重点
  choice: 正文保留太监欲夺少女贞洁与强行施行判决之间的直接类比，不明说其具体着重点。
  alternative: 将比喻明确解释为谴责暴力审判，或主要强调这种行为的荒谬、不相称与徒劳。
  rationale: 希腊文只陈述类比，没有解释共同点；保留其开放性可避免把“强制之恶”或“徒劳悖谬”中的任何一种理解定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“夺去少女的贞洁”准确保留原文直白而令人不适的性意象；分号清楚呈现比喻的前后两项。所有解释性分歧均留在脚注，不在正文中消解。
