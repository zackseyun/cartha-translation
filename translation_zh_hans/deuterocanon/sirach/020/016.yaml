  text: A fool will say[a], “I have no friend, and there is no gratitude for my good deeds.”
translation:
  language: zh_hans
  text: 愚昧人会说：“我没有朋友，我所行的善事也无人感激。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我所行的善事也无人感激”或译：“我的善举得不到感谢。”希腊语χάρις可指“感激”“感谢”或“恩惠”，τοῖς ἀγαθοῖς μου可指“我的好东西”或“我的善行”。
    reason: 保留原文χάρις及τοῖς ἀγαθοῖς μου的词义范围。
lexical_decisions:
- source_word: μωρός
  choice: 愚昧人
  rationale: 在智慧文学中指缺乏智慧的人；“愚昧人”自然、庄重，也保留其道德与智慧层面的含义。
- source_word: ἐρεῖ
  choice: 会说
  rationale: 对应希腊语将来时直陈语气，同时符合汉语箴言式表达。
- source_word: Οὐχ ὑπάρχει μοι φίλος
  choice: 我没有朋友
  rationale: ὑπάρχει与与格连用，在此表达相对于说话者的存在或拥有；译为“我没有朋友”最自然。
- source_word: χάρις
  choice: 感激
  rationale: 语境所指是对善行或惠助的感谢、感念，而不是神学意义上的“恩典”。
- source_word: τοῖς ἀγαθοῖς μου
  choice: 我所行的善事
  rationale: 中性复数形容词名词化，可指“我的好东西”或“我的善行、惠助”；正文采用自然且切合语境的“我所行的善事”。
