  text: There is one who keeps silent and is found wise[a], and there is one who is hated because of much talk.
translation:
  language: zh_hans
  text: 有人沉默不语，被认作有智慧；也有人因话太多而遭人厌恶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν
  choice: 有人
  rationale: 重复的存在句式描绘两类人；译作“有人……也有人……”自然保留箴言式对比。
- source_word: σιωπῶν
  choice: 沉默不语
  rationale: 现在分词表示持续或惯常的沉默；“沉默不语”简洁自然，也不额外断定其动机。
- source_word: εὑρισκόμενος σοφός
  choice: 显为有智慧
  rationale: 保留“被发现、显出是”的意味，同时避免把它明确收窄为他人的主观看法；“有智慧”符合智慧文学语境。
- source_word: μισητός
  choice: 遭人厌恶
  rationale: 表达强烈的负面反应，并以现代汉语的被动式对应希腊语谓语形容词。
- source_word: ἀπὸ πολλῆς λαλιᾶς
  choice: 因话太多
  rationale: ἀπό在此表达原因，λαλιά指言谈；这一译法自然简练，并保留与“沉默不语”的对照。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的箴言体。“显为有智慧”保留εὑρισκόμενος的观察或显明色彩，不明确解释为单纯的社会评价。英文咨询层的脚注标记位置与脚注内容不相符；因希腊文在此并无需要读者辨明的实质歧义，正文不设脚注。
