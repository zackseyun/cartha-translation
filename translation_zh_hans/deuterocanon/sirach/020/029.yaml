  yaml_path: translation/deuterocanon/sirach/020/029.yaml
  text: Hospitality and gifts blind the eyes of the wise[b][a], and like a muzzle on the mouth they turn away rebukes.
translation:
  language: zh_hans
  text: 款待[a]和礼物[b]会蒙蔽智慧人的眼睛，又像嘴上的口套一样，挡开责备。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “款待”或译“宾客之礼”；希腊词 ξένια 既可指对宾客的款待，也可指宾主交谊中的馈赠。
    reason: lexical_alternative
  - marker: b
    text: 这里的“礼物”可指足以败坏判断的恩惠；希腊原文并未明确说“贿赂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένια
  choice: 款待
  rationale: 该词可指对宾客的款待，也可指宾主交谊中的馈赠。译作“款待”既与后面的“礼物”有所区别，也保留社会恩惠可能影响判断的语境。
- source_word: δῶρα
  choice: 礼物
  rationale: 原词直指赠礼；上下文暗示其可能左右判断，但并未明确使用“贿赂”一词，因此不将含义收窄为“贿赂”。
- source_word: ἀποτυφλοῖ
  choice: 蒙蔽
  rationale: 原词意为使眼瞎；“蒙蔽……眼睛”保留视觉隐喻，同时在现代汉语中自然表达判断力受损。
- source_word: ὀφθαλμοὺς σοφῶν
  choice: 智慧人的眼睛
  rationale: 忠实保留属格结构和智慧文学中的代表性称谓，不额外限定性别。
- source_word: φιμός
  choice: 口套
  rationale: 该词指套在动物嘴上的笼口之物；“口套”比抽象的“禁言”更能保留具体形象。
- source_word: ἀποτρέπει
  choice: 使……止息
  rationale: 原词有转开、挡开、阻止之意；结合口套的比喻，“使……止息”自然表达责备受到压制，同时不过度说明具体施事者。
- source_word: ἐλεγμούς
  choice: 责备
  rationale: 在智慧文学语境中指责斥、规劝或纠正；“责备”简明地保留其道德纠正力度。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“蒙蔽……眼睛”和“套在嘴上的口套”保留原文相连的具体隐喻；“使责备止息”避免补明究竟是谁发出或拦阻责备，从而保留原句的简约与一定歧义。
