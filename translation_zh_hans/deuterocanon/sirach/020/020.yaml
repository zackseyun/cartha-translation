  yaml_path: translation/deuterocanon/sirach/020/020.yaml
  text: A proverb will be rejected from the mouth of a fool[a], for he will certainly not speak it at its proper time.
translation:
  language: zh_hans
  text: 出自愚人之口的箴言会遭拒绝[a]，因为他绝不会在合宜的时候说出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “箴言”或译“比喻”，若将 παραβολή 按较宽泛的意义理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ στόματος
  choice: 口中的
  rationale: 该介词短语表示话语的来源；“口中的”保留了原文具体的口语意象，也符合现代汉语表达。
- source_word: μωροῦ
  choice: 愚人
  rationale: 在智慧文学中，μωρός通常指在道德和处世上愚昧的人，而不只是智力不足者；“愚人”简洁、庄重，并保留这一智慧文学色彩。
- source_word: ἀποδοκιμασθήσεται
  choice: 必遭弃绝
  rationale: 未来被动式表示这箴言因出自不合宜的说话者而受到拒斥；“遭弃绝”保留被动意义，“必”同时自然承接其确定的将来语气。
- source_word: παραβολή
  choice: 箴言
  rationale: 在《便西拉智训》的智慧文学语境中，此词更可能指箴言或智慧格言，而非叙事性的比喻；脚注保留较宽泛的另一译法。
- source_word: οὐ γὰρ μὴ
  choice: 因为他绝不会
  rationale: οὐ μή构成强烈否定；“绝不会”以自然的现代汉语传达原文强调语气。
- source_word: εἴπῃ αὐτὴν
  choice: 说出来
  rationale: 此处指把该箴言说出口；“说出来”自然地表达发言动作，并使其宾语在汉语中保持清楚。
- source_word: ἐν καιρῷ αὐτῆς
  choice: 在恰当的时候
  rationale: καιρός不仅表示时间，也表示合宜的时机；“恰当的时候”同时传达时间性与适切性。
