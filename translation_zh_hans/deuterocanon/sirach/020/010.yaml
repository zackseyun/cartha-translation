translation:
  language: zh_hans
  text: 有一种降卑是为了荣耀[a]；也有人从卑微中抬起头来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “降卑”也可译作“降低”“减少”或“受屈辱”。希腊文未说明这降低是人主动为之，还是由他人或处境所造成；“荣耀”也可指“尊荣”或“声望”。
    reason: lexical_alternative
  - marker: b
    text: “抬起头来”保留原文的形象说法，可表示一个人从低下处境中得到恢复、尊严或信心；此处不限定为其中某一种解释。
    reason: cultural_note
lexical_decisions:
- source_word: ἐλάττωσις
  choice: 降卑自己
  rationale: 该词可指减少、降低或受屈辱。这里与“荣耀”形成悖论式对照；译作“降卑自己”在现代汉语中自然，但希腊文自身并未明确说明是主动自谦还是被降低，因此以脚注保留歧义。
- source_word: ἕνεκεν
  choice: 为得
  rationale: 表达目的或关联缘由；“为得荣耀”简洁地保留“为了荣耀”的目的性读法。
- source_word: δόξης
  choice: 荣耀
  rationale: 既可指荣耀，也可指尊荣、声望；“荣耀”保留较宽的语义范围及与降卑之间的强烈对照。
- source_word: ταπεινώσεως
  choice: 卑微
  rationale: 表示一个人由之上升的低下境况；“卑微”避免把它限定为道德美德“谦卑”，也不强行解释为公开受辱。
- source_word: ἦρεν κεφαλήν
  choice: 抬起了头
  rationale: 保留原文具体意象和不定过去时，同时在脚注说明其可表示从低微处境中振作、恢复尊严或地位。
- source_word: ἔστιν ὃς
  choice: 也有人
  rationale: 自然呈现希腊文引出某一类人的箴言式结构。
theological_decisions:
- issue: 降卑与荣耀之间的关系
  choice: 译为“为得荣耀而降卑自己”，保留目的性理解
  alternative: “因荣耀而受贬抑”或“有一种降低是为了荣耀”
  rationale: ἕνεκεν 可表达目的或缘由，而 ἐλάττωσις 未明示施事者。正文采用在箴言语境中较通顺的目的性表达，脚注保留被降低或受屈辱的可能，避免把因果关系或伦理评价绝对化。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留箴言式的对称结构和“降卑—荣耀、卑微—抬头”的意象张力。
