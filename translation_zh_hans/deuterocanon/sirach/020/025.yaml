  text: A thief is preferable to one who persists in lying[a]; yet both will inherit destruction.
translation:
  language: zh_hans
  text: 盗贼比惯于说谎的人还可取；两者却都将承受灭亡。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较为直译：“宁可选择盗贼，也不选择一味说谎的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετὸν
  choice: 还……可取
  rationale: 该词表示“值得选择、较为可取”。结合ἤ形成比较，译为“还比……可取”，既自然，也保留箴言直截了当的道德比较。
- source_word: κλέπτης
  choice: 盗贼
  rationale: κλέπτης通常指暗中偷窃者，而非以暴力抢劫者；“盗贼”是庄重且通俗的对应词。
- source_word: ἐνδελεχίζων
  choice: 惯于
  rationale: 现在分词表达持续或习惯性的行为。“惯于”简洁地体现反复、持久的意味，而不是一次性的说谎。
- source_word: ψεύδει
  choice: 说谎
  rationale: 这里的与格与分词相连，表示持续从事的行为或范围；汉语用“惯于说谎”最自然。
- source_word: ἀμφότεροι
  choice: 两者
  rationale: 明确包括前述盗贼和惯于说谎的人。
- source_word: ἀπώλειαν
  choice: 灭亡
  rationale: 该词可指毁灭、败亡或最终的丧失。“灭亡”保留原文的沉重语气，又不额外限定其神学性质。
- source_word: κληρονομήσουσιν
  choice: 必承受
  rationale: 原义为“将继承”。“承受”保留所得之分的意味，并在汉语中较自然地呈现他们以灭亡为结局的反讽；“必”表达未来陈述的确定语气。
theological_decisions:
- issue: 箴言中的道德比较
  choice: 照原文保留“盗贼比惯于说谎的人可取”的真实比较，同时以后一分句说明两者都将灭亡。
  alternative: 可将前半句理解为夸张的智慧文学修辞，重点强调长期说谎格外有害。
  rationale: 希腊文αἱρετὸν…ἤ明确作出比较，但ἀμφότεροι及共同承受灭亡的结论排除了对偷盗的认可；译文应保留这种张力，不替原文消解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惯于说谎”表现持续和习惯性；“还比……可取”保留尖锐的比较；分号呈现比较与共同结局之间的转折。
