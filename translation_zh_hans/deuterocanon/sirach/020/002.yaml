  yaml_path: translation/deuterocanon/sirach/020/002.yaml
  text: How good it is to reprove rather than to become angry[a], and the one who confesses will be kept from loss.
translation:
  language: zh_hans
  text: 与其发怒，不如责备，这是多么好！承认的人必免受损失。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承认”也可译作“坦白”或“认可”；原文没有说明所承认的对象。“损失”也可指损害、减损或不利。
    reason: 说明原文在动词宾语和后果名词上的词义开放性。
lexical_decisions:
- source_word: Ὡς καλὸν
  choice: 这是多么好
  rationale: 保留希腊文感叹式的道德评价，同时使用自然、庄重的现代汉语。
- source_word: ἐλέγξαι
  choice: 责备
  rationale: 这里指以言语指出过错、加以规劝或责难；“责备”简洁地保留了纠正与责难两方面的语气。
- source_word: ἢ θυμοῦσθαι
  choice: 与其发怒，不如
  rationale: 用汉语常见的比较句式表达希腊文“责备胜于发怒”的对照；“发怒”也能体现动词所含的进入怒气状态之意。
- source_word: ὁ ἀνθομολογούμενος
  choice: 承认的人
  rationale: 该分词可指承认、坦白或公开认可；原文未说明所承认的对象，因此译文也不补出“过错”等内容。
- source_word: ἀπὸ ἐλαττώσεως
  choice: 免受损失
  rationale: ἐλάττωσις可表示减损、损失、损害或不利；“损失”保持宽泛，不限定为物质、社会或道德层面的后果。
- source_word: κωλυθήσεται
  choice: 必免受
  rationale: 未来被动式配合ἀπό表示被阻隔于某种不利后果之外；“必免受”符合汉语箴言体，也保留未来结果的语气。
theological_decisions:
- issue: “承认”的对象与“损失”的性质均未明说
  choice: 正文保持对象与后果的开放性
  alternative: 译作“承认过错的人必免受惩罚”
  rationale: 希腊文既没有明说所承认的是“过错”，也没有把ἐλάττωσις限定为“惩罚”；不应以解释性补语消除原文的含混。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“与其……不如……”清楚呈现两种反应的对照；感叹句保留原文劝诫中的赞叹语气。
