  yaml_path: translation/deuterocanon/sirach/020/019.yaml
  text: An ungracious person is an untimely saying[a]; in the mouth of the undisciplined it will be repeated continually.
translation:
  language: zh_hans
  text: 没有风度的人，如同一句不合时宜的话[a]；这样的话在缺乏教养的人口中会被不断重复。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个不讨人喜欢的人，是一句不合时宜的话。”希腊文前半句极为简略，两个名词短语之间的关系没有明说；“没有风度的人”也可理解为“令人不快的人”，“话”也可译为“故事”或“说法”。
    reason: 保留ἄχαρις与μῦθος的词义范围，并说明希腊文简略句法所产生的真实歧义。
lexical_decisions:
- source_word: ἄνθρωπος ἄχαρις
  choice: 不得体的人
  rationale: ἄνθρωπος泛指“人”；ἄχαρις可指缺乏风度、魅力或恩情。结合本节对言语失当的批评，“不得体的人”自然地保留了社交与品格上的负面含义，而不局限为“不知感恩”。
- source_word: μῦθος
  choice: 话
  rationale: 此处更可能指一句言语或说法，而非完整的故事；“话”简洁自然，也适合本节凝练的箴言体。
- source_word: ἄκαιρος
  choice: 不合时宜
  rationale: 表达在不恰当的时机出现或说出，准确保留其时间与场合上的失当。
- source_word: ἀπαιδεύτων
  choice: 缺乏教养的人
  rationale: 该词指没有受过训练、教导或品格塑造的人。“缺乏教养”同时涵盖言谈举止和道德训练，不窄化为缺少学校教育。
- source_word: ἐνδελεχισθήσεται
  choice: 会没完没了地重复
  rationale: 未来被动形式在此表达持续或反复发生；结合“在……口中”，译为不断被重复，能清楚传达语境中的习惯性言说。
- source_word: ἐν στόματι
  choice: 在……口中
  rationale: 保留希腊文以“口”表示言说来源的形象，在现代汉语中也清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“就像”补明希腊文省略的关系，但以脚注说明原文的简略和歧义；“没完没了”较口语化，却贴切传达持续反复及其负面语气。
