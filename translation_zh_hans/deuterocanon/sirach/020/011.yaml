  text: There is one who buys much for little[b][a], and repays it sevenfold.
translation:
  language: zh_hans
  text: 有人以很少的价钱买许多东西，却偿付七倍[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“并把它们偿付七倍”。“它们”为复数，所指可能是买来的东西，也可能是与之相关的款项或价值。原文措辞凝练：可理解为有人低价买了许多东西，却付出七倍的代价；也可泛指看似划算的交易最终代价高昂。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστιν
  choice: 有人
  rationale: 这一存在句式在智慧文学中引出一种人或一种情形；“有人”简洁自然。
- source_word: ἀγοράζων πολλὰ ὀλίγου
  choice: 花很少的钱买了许多东西
  rationale: ἀγοράζων 表示购买，πολλὰ 指许多东西，ὀλίγου 是表示价钱的属格；此译明确呈现“以少价购多物”的商业意象，同时保持原文的简练。
- source_word: ἀποτιννύων
  choice: 却要偿还
  rationale: 该动词表示偿付所欠或偿还；“偿还”保留财务语境。“却”呈现两分句之间明显的反转关系，但不限定偿还为何发生。
- source_word: αὐτὰ
  choice: 省略显明的复数宾语
  rationale: 希腊文代词为中性复数，回指所购物品或相关款项；现代汉语在“偿还七倍”中可自然省略宾语，以免误将偿还对象过度具体化。相关歧义由脚注说明。
- source_word: ἑπταπλάσιον
  choice: 七倍
  rationale: 该词表示七倍的量；“七倍”保留格言式的紧凑表达，不擅自确定所加倍的是价钱、价值还是偿付额。
