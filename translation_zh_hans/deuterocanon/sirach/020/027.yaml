  text: A wise man will advance himself by his words[a], and a prudent man will please great men.
translation:
  language: zh_hans
  text: 有智慧的人借着言语使自己得到提升；明智的人必取悦权贵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “权贵”也可译作“大人物”、“显贵”或“掌权者”。希腊文泛指社会地位显赫或有权势的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφὸς
  choice: 有智慧的人
  rationale: 在智慧文学中指具有实际智慧的人；此译自然，也不把含义缩减为有学问或有技能。
- source_word: ἐν λόγοις
  choice: 凭言语
  rationale: ἐν 在此表示手段，言语是使自己向前发展的方式；“凭言语”简洁保留其工具性。
- source_word: προάξει ἑαυτόν
  choice: 使自己进身
  rationale: προάγω 与反身代词连用，表示使自己向前、提升自身处境；“进身”贴合本节的社会语境，又避免“自我推销”的贬义。
- source_word: ἄνθρωπος φρόνιμος
  choice: 明智的人
  rationale: φρόνιμος 强调实际判断力与审慎；“明智的人”是现代汉语中自然、庄重而不过度性别化的表达。
- source_word: ἀρέσει
  choice: 必蒙……喜悦
  rationale: ἀρέσκω 表示使人喜悦、得到悦纳；此结构在汉语中自然表达将来意义以及在权势者面前受认可。
- source_word: μεγιστᾶσιν
  choice: 权贵
  rationale: 该词泛指社会地位显赫或握有权势的人，不必限定为某种正式官职；“权贵”准确而简练。
