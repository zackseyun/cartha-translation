  text: Hidden wisdom and an unseen treasure—what benefit is there in either of them?[a]
translation:
  language: zh_hans
  text: 隐藏的智慧和不显露的宝藏，二者有什么益处呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这两样有什么用处呢？”希腊文的“二者”指前述隐藏的智慧和不显露的宝藏；原句问的是这两者的益处。
    reason: 说明ἐν ἀμφοτέροις指前述两项，并提供自然的中文替代表达。
lexical_decisions:
- source_word: σοφία
  choice: 智慧
  rationale: 在智慧文学语境中通常指“智慧”，也与“宝藏”形成价值意象上的并列。
- source_word: κεκρυμμένη
  choice: 隐藏的
  rationale: 完成时被动分词表示已经被隐藏起来；“隐藏的”简洁自然，并保留其结果状态。
- source_word: θησαυρός
  choice: 宝藏
  rationale: 此处指有价值却不能发挥作用之物；“宝藏”最能保留原文的具体比喻。
- source_word: ἀφανής
  choice: 不见天日的
  rationale: 该词表示看不见、未显露；此译与前面的“隐藏”有所区别，并自然表达宝藏未被发现、无法利用的状态。
- source_word: τίς ὠφέλεια
  choice: 有什么益处呢
  rationale: 准确表达询问实际效用或利益的反问语气，符合现代汉语表达。
- source_word: ἐν ἀμφοτέροις
  choice: 二者有什么益处
  rationale: ἀμφοτέροις明确统指前述两项；“二者”保留“两者合说”的形式，不把原文擅自细化为“任何一个”。
