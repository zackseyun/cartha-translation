  text: The character of a lying man is dishonor[a], and his shame is continually with him.
translation:
  language: zh_hans
  text: 说谎之人的品性就是耻辱[a]；他的羞耻常与他同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“虚假之人的性情是耻辱；他的羞耻不断与他同在。”
    reason: 原文ἦθος可指“品性”或“性情”；ψευδής可译为“说谎的”或“虚假的”；ἐνδελεχῶς可译为“常”或“不断”。“耻辱”保留ἀτιμία的名词表达。
lexical_decisions:
- source_word: ἦθος
  choice: 品性
  rationale: 此处指一个人较为固定的道德性情或为人特征。“品性”自然庄重，也不把含义缩窄为单纯的“习惯”。
- source_word: ἀνθρώπου ψευδοῦς
  choice: 说谎之人
  rationale: 该属格短语指以虚假、说谎为特征的人。“说谎之人”准确传达其性质，同时符合现代汉语表达。
- source_word: ἀτιμία
  choice: 耻辱
  rationale: 该词表示失去尊荣、处于受辱或不名誉的状态。“耻辱”简洁地保留其社会与道德层面的含义。
- source_word: αἰσχύνη
  choice: 羞耻
  rationale: 与前面的“耻辱”有所区别，侧重伴随此人的羞愧或可羞之处，保留原文两个近义词之间的张力。
- source_word: μετʼ αὐτοῦ
  choice: 与他同在
  rationale: 按原文直译为伴随此人，不额外解释成后果、惩罚或名声。
- source_word: ἐνδελεχῶς
  choice: 常
  rationale: 表达持续不断、长久伴随之意；置于“与他同在”之前，形成自然凝练的现代汉语。
