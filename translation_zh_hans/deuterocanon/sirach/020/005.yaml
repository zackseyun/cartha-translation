  text: There is one who keeps silent and is considered wise[a], and there is one who is despised because of much talk.
translation:
  language: zh_hans
  text: 有人保持沉默，被认为有智慧[a]；也有人因话多而遭人鄙弃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“有人沉默，是因为无话可答；也有人沉默，是因为知道时机。”这里保存的希伯来文本与希腊文本有重大差异；正文依照现存希伯来文本，因为《便西拉智训》有希伯来文本可据时，以希伯来文为主要来源。
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: 有人
  rationale: 存在句在这里引出一种人；译作“有人”符合现代汉语习惯，也保留两个分句的对应结构。
- source_word: מַחֲרִישׁ
  choice: 保持沉默
  rationale: 该分词表示持续不言语；“保持沉默”既传达持续意味，也与本节智慧格言的语体相称。
- source_word: וְנֶחְשָׁב
  choice: 被认为
  rationale: 该词为尼法勒形态，表达被别人看作、算作某种人；“被认为”准确保留社会评价的含义。
- source_word: חָכָם
  choice: 有智慧
  rationale: 这里指智慧传统中一般意义上的明智；译作“有智慧”自然清楚，又不把原文语法上的阳性泛指限制为男性。
- source_word: נִמְאָס
  choice: 遭人鄙弃
  rationale: מאס含拒斥、轻蔑之意；“遭人鄙弃”与前句正面的“被认为有智慧”形成鲜明的社会评价对照。
- source_word: בְּרוֹב
  choice: 因……多
  rationale: 介词ב在此表达原因，רֹב表示数量繁多；“因……多”以简洁自然的汉语明确其因果关系。
- source_word: שִׂיחַ
  choice: 话
  rationale: שִׂיחַ可指言谈或话语；在沉默与多言的对比中，“话多”是现代汉语最自然、最有格言力度的表达。
theological_decisions:
- issue: 希伯来文本与希腊文本存在重大差异
  choice: 正文依照现存希伯来文本，表达沉默者被视为有智慧、多言者遭鄙弃
  alternative: 依照希腊文本，区分因无话可答而沉默与因懂得时机而沉默的两种人
  rationale: 所给希伯来见证完整、语意连贯，且本项目在《便西拉智训》有可靠希伯来文本时以希伯来文为主要来源；希腊异文具有重要解释价值，因此在脚注中完整说明，不将两种不同读法调和。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“有人……；也有人……”保留原文平行结构；“话多”通俗自然，“遭人鄙弃”则保留原文较强的负面社会评价。
