  yaml_path: translation/deuterocanon/sirach/020/021.yaml
  text: There is one who is prevented from sinning by poverty[b][a], and in his rest he will feel no remorse.
translation:
  language: zh_hans
  text: 有人因贫困而无法犯罪[a]；在安歇时，也不会感到内疚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因贫困”也可译作“因缺乏”或“因穷乏”；希腊文表示缺乏是他受到限制的原因。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“不会被刺痛”或“不会受刺扰”；这里可指内心的愧疚、懊悔或痛悔。
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόμενος
  choice: 不能
  rationale: 表达受外在处境限制、被阻止的被动含义；结合“因贫困”可自然理解为并非出于自身意愿或德行。
- source_word: ἁμαρτάνειν
  choice: 犯罪
  rationale: 保留原词明确的道德与宗教含义，不弱化为一般的“做错事”。
- source_word: ἀπὸ ἐνδείας
  choice: 因贫困
  rationale: ἐνδεία可指缺乏、穷困；介词短语在此表示原因。“因贫困”简洁自然，同时以脚注保留“缺乏、穷乏”的词义范围。
- source_word: ἀναπαύσει
  choice: 安歇
  rationale: 保留休息、安静或安逸状态的开放性；“安歇”比单纯“休息”略显庄重，也不限定为身体休息。
- source_word: οὐ κατανυγήσεται
  choice: 不会受到良心的刺痛
  rationale: 保留动词“被刺、被扎”的隐喻，同时以“良心”传达其内在悔恨、愧疚的语境含义；脚注说明直译及其他可能表达。
theological_decisions:
- issue: 贫困阻止犯罪的道德含义
  choice: 将本句译为对现实处境的观察：有人因贫困而没有犯罪，并不明说此人具有主动的德行。
  alternative: 可较概括地译作“因缺乏而不能作恶”，或理解为贫困本身具有道德上的益处。
  rationale: 希腊文强调受阻，而不是主动拒绝犯罪；经文也没有宣称贫困本身使人公义。因此保留这种带有张力的智慧观察，不额外赞美贫困。
- issue: οὐ κατανυγήσεται所指的内在反应
  choice: 译作“不会受到良心的刺痛”，表示没有因已犯之罪而产生的内在愧疚或悔恨。
  alternative: 可直译为“不会被刺痛”，或意译为“不会懊悔”。
  rationale: 该动词含被刺、受刺激并由此产生内在痛悔的意象；当前译法兼顾隐喻与可理解性，但不把它收窄为某一套特定的悔罪教义。
translation_notes:
  register: 采用现代、简明而庄重的普通话。“有人……；……”保留智慧文学格言式结构。“安歇”有一定经文语体色彩，但现代读者仍易理解。脚注标记均置于正文相关词语之后。
