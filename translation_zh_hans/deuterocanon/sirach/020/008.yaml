  text: There is success for a man in evil things[a], and there is a gain that leads to loss.
translation:
  language: zh_hans
  text: 有人在恶事中亨通[a]，也有所得终致损失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有人在患难中仍亨通。”希腊语“在恶事中”既可指从事恶事，也可指身处祸患；这里的说法简练，含义可能兼有两面。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδία
  choice: 亨通
  rationale: 该词指道路顺遂、进展顺利或结果兴旺；“亨通”既自然简洁，也保留箴言中恶事竟能顺利的反讽意味。
- source_word: ἐν κακοῖς
  choice: 在恶事上
  rationale: 介词短语可指处于祸患中，也可指在邪恶之事上。此处与“亨通”搭配，较可能具有道德含义；正文采用这一理解，同时以脚注保留处境性读法。
- source_word: ἀνδρί
  choice: 有人
  rationale: 希腊文为阳性单数，但在普遍性箴言中，现代汉语用“有人”自然表达不特指性别的人，同时保留单数泛指功能。
- source_word: εὕρεμα
  choice: 所得
  rationale: 该名词本义为所找到之物，也可指获得的利益或成果。“所得”既保留“得到之物”的宽泛含义，又能与后面的受损构成悖论。
- source_word: εἰς ἐλάττωσιν
  choice: 反倒使人受损
  rationale: 原文直译为“趋向减少”。“使人受损”自然传达所得最终导致减损的意义；加入“反倒”明确呈现原句的箴言式反差，而未限定为纯经济损失。
