  text: A wise man will make himself beloved by his words[a], but the favors of fools will be poured out.
translation:
  language: zh_hans
  text: 智者凭言语使自己受人喜爱；愚人的恩惠却会倾泻而出。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恩惠”所译的希腊词也可指“魅力”或“讨喜之处”。因此，本句后半也可理解为：“愚人的魅力却会倾泻而出。”
    reason: 保留χάριτες在恩惠、善意与魅力之间的词义歧义。
lexical_decisions:
- source_word: ὁ σοφὸς
  choice: 智者
  rationale: 希腊语阳性单数形容词带冠词并作名词用；“智者”简洁庄重，可表达智慧文学中具有代表性的有智慧之人，而不把句意改成复数。
- source_word: ἐν λόγῳ
  choice: 凭言语
  rationale: ἐν在此可表示方式或凭借；“凭言语”自然地保留了借说话使人喜爱的含义，同时不限定为一句话。
- source_word: ἑαυτὸν προσφιλῆ ποιήσει
  choice: 使自己受人喜爱
  rationale: 保留ἑαυτόν的反身结构及ποιήσει的使役意义；“受人喜爱”表达προσφιλής所含的亲爱、讨人喜欢之意。
- source_word: χάριτες
  choice: 恩惠
  rationale: χάριτες为复数，可指恩惠、善意的举动，也可指魅力或讨喜之处；正文选“恩惠”以呈现较具体的语境意义，另以脚注保留词义歧义。
- source_word: μωρῶν
  choice: 愚人的
  rationale: 直译属格关系，符合中文智慧文学的简洁表达。
- source_word: ἐκχυθήσονται
  choice: 会倾泻而出
  rationale: 保留ἐκχέω未来被动形式的倾倒、倾泻意象，不进一步解释为“被挥霍”，以免过度消解原文的开放性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。分号呈现两小句的对照；“却”对应δέ的转折。正文保留“倾泻而出”的比喻，不擅自解释这种倾泻究竟是慷慨、失控还是徒然。
