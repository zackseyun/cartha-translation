  text: 隐藏自己愚昧的人，胜过隐藏自己智慧的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρείσσων
  choice: 胜过
  rationale: 这是引出比较的比较级形容词；用“胜过”自然保留格言中两类人的鲜明对照。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 该词在这里是单数泛指，现代汉语用“人”既准确又自然，无须标明性别；两处重复也保留原文的平行结构。
- source_word: ἀποκρύπτων
  choice: 隐藏
  rationale: 现在分词描述人的行为特征；两处统一译作“隐藏”，保留原文的重复和修辞对称。
- source_word: μωρίαν
  choice: 愚昧
  rationale: μωρία表示愚蠢、愚昧；“愚昧”符合智慧文学的道德语域，又不过分口语化或尖刻。
- source_word: σοφίαν
  choice: 智慧
  rationale: σοφία是《便西拉智训》的核心词汇，“智慧”是准确且稳定的对应词。
