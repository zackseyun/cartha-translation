  yaml_path: translation/deuterocanon/sirach/020/001.yaml
  text: There is a rebuke that is not timely[a], and there is one who keeps silent and is himself wise.
translation:
  language: zh_hans
  text: 有一种责备并不合时宜[a]；也有人保持沉默，他自己是明智的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并不合宜。”希腊词可指“适时、合宜”，在其他语境中也可指“美好”；这里可能侧重责备的时机或场合是否恰当。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγχος
  choice: 责备
  rationale: 指针对过错所作的言语指正或斥责。“责备”在现代汉语中自然，也能与下句的沉默形成鲜明对照。
- source_word: ὡραῖος
  choice: 合时宜
  rationale: 该词本可表示“适时、合宜”，在其他语境也可表示“美好”。用于“责备”时，重点更可能是时机或场合是否恰当，因此译为“合时宜”，同时以脚注保留“合宜”的可能。
- source_word: σιωπῶν
  choice: 保持沉默
  rationale: 保留现在分词所表达的持续或特征性状态，也符合现代汉语习惯。
- source_word: φρόνιμος
  choice: 明智
  rationale: 该词侧重实际判断上的智慧、审慎。“明智”适合箴言式语境，并比单纯的“聪明”更能体现判断得当。
- source_word: καὶ αὐτός
  choice: 他自己却是
  rationale: “他自己”保留 αὐτός 的强调；“却”自然呈现责备与沉默之间的语意对照，但不把沉默绝对化为智慧。
