  yaml_path: translation/deuterocanon/sirach/020/024.yaml
  text: A lie is a shameful blemish in a person[b][a]; in the mouth of the undisciplined it will be continually present.
translation:
  language: zh_hans
  text: 谎言是人身上的可耻污点；在未受教诲的人[a]口中，它会不断出现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “未受教诲的人”也可译作“未受教育的人”或“未受训练的人”；原词既可指缺少教育，也常在智慧文学中指缺少道德训诲或品格训练。
    reason: lexical_alternative
lexical_decisions:
- source_word: μῶμος πονηρός
  choice: 可耻的污点
  rationale: μῶμος可指污点、瑕疵或羞辱；πονηρός在此修饰并加强其负面评价。“可耻的污点”既保留具体比喻，也传达道德贬义。
- source_word: ἐν ἀνθρώπῳ
  choice: 人身上
  rationale: ἄνθρωπος为泛指单数，并非特指男性；现代汉语用“人身上”自然地保留其普遍指向。
- source_word: ψεῦδος
  choice: 谎言
  rationale: ψεῦδος可指谎话或虚假；“谎言”在此简洁具体，符合箴言式表达。
- source_word: ἀπαιδεύτων
  choice: 不受教诲的人
  rationale: ἀπαίδευτος在智慧文学中不仅指未受教育，也指缺少训诲和品格陶成；“不受教诲的人”避免将其缩减为学校教育程度。
- source_word: ἐνδελεχισθήσεται
  choice: 总不断绝
  rationale: 该动词表达持续、经常存在之意；结合“口中”的意象，“总不断绝”自然表现说谎持续出现。
theological_decisions:
- issue: 泛指单数ἀνθρώπῳ的性别表达
  choice: 人身上
  alternative: 男人身上
  rationale: 原文ἄνθρωπος在此泛指任何人，不强调男性身份；汉语“人”准确保留普遍性，也不增添原文没有的性别限定。
- issue: ἀπαίδευτος的智慧文学含义
  choice: 不受教诲的人
  alternative: 未受教育的人
  rationale: 上下文涉及道德习性；译作“不受教诲”保留知识与品格训练之间的张力，不把经文理解为单纯贬斥缺乏学校教育者。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，保留原文前后两个分句的箴言式对照。“总不断绝”传达持续性，并与“口中”搭配自然。
