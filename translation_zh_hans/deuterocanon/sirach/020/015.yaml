  text: Today he lends[a], and tomorrow he demands it back; such a man is hateful.
translation:
  language: zh_hans
  text: 今天借出，明天就索回；这样的人可憎[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎”也可译作“遭人厌恶”。希腊词既可描述这种人的可憎，也可着重表示他引起别人的厌恶。
    reason: 保留μισητός在性质描述与所受反应之间的词义歧义。
lexical_decisions:
- source_word: σήμερον
  choice: 今天
  rationale: 直接保留与“明天”的鲜明时间对照，符合箴言式表达。
- source_word: δανιεῖ
  choice: 借给人
  rationale: 该词是表示借出的将来时形式；在格言语境中用汉语现在式更自然。“给人”明确这是出借而非借入，但不擅自补出具体物品。
- source_word: αὔριον
  choice: 明天
  rationale: 准确保留原文与“今天”相对的紧凑时间推进。
- source_word: ἀπαιτήσει
  choice: 就讨回来
  rationale: 该动词表示索回、追讨；“回来”补明原文由出借语境隐含的对象回收，“就”体现前后相隔极短所形成的责备意味。
- source_word: μισητός
  choice: 可憎
  rationale: 保留该形容词对这种人的强烈负面评价；此词也可能侧重他所引起的反应，即“遭人厌恶”，故加脚注说明。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 此处指一种具有代表性的人；现代汉语“人”自然涵盖这一格言中的泛指意义。
- source_word: ὁ τοιοῦτος
  choice: 这样的人
  rationale: 自然对应“如此之人、这一类人”，承接前述行为。
theological_decisions:
- issue: μισητός是描述此人的可憎性质，还是描述他遭人厌恶
  choice: 正文译作“可憎”
  alternative: “遭人厌恶”
  rationale: 希腊词可表达“可憎的”或“被憎恶的”。正文采用简洁的性质评价，同时以脚注保留被动理解，避免消除原文的词义张力。
- issue: 智慧格言中ἄνθρωπος的泛指表达
  choice: 译作“人”
  alternative: “男人”
  rationale: 希腊语ἄνθρωπος在此指一般的人类个体，并非强调男性；汉语“这样的人”最准确、自然地表达其代表性道德类型。
translation_notes:
  register: 采用简洁、庄重而口语自然的箴言体。“今天……明天……”保留原文的对称和讽刺力度；“讨回来”比“要求偿还”更适合普通现代读者，同时仍表达强硬索回的意味。
