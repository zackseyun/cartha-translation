  text: A wise man keeps silent until the right time[a], but a fool does not observe the right time.
translation:
  language: zh_hans
  text: 智者静默，直到合宜的时候[a]；愚人却不留意时机。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “合宜的时候”直译为“时候”；后半句“不留意时机”直译为“不守时候”。本节的希腊文平行文本差异很大，作：“多言的人必遭厌恶，专横行事的人必遭憎恨。”
    reason: 说明希伯来文的字面表达，并保存希腊文平行传统的重大异文。
lexical_decisions:
- source_word: חָכָם
  choice: 智者
  rationale: 希伯来文为阳性单数名词，在箴言体中代表有智慧的人；现代汉语用“智者”自然、庄重，也无需添加原文没有的性别限定。
- source_word: יַחֲרִישׁ
  choice: 静默
  rationale: 该动词意为保持沉默；“静默”保留主动克制、不发言的意味，并符合智慧文学的凝练语体。
- source_word: עַד עֵת
  choice: 直到合宜的时候
  rationale: 字面为“直到时候”。在智慧文学语境中，עֵת可指适当的时刻；加“合宜的”使现代读者明确其语用含义，同时在脚注中交代字面形式。
- source_word: וּכְסִיל
  choice: 愚人却
  rationale: וּ通常为“和”，但此处两分句明显对照；译作“却”自然呈现其转折功能。
- source_word: לֹא יִשְׁמוֹר עֵת
  choice: 不顾时机
  rationale: 字面是“不守／不留意时候”。“不顾时机”在现代汉语中简洁自然，表达愚人不理会适当发言时刻的意思，而不将其窄化为单纯的等待。
