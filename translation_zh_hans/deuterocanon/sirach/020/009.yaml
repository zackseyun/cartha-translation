  text: There is a gift that will not profit you[a], and there is a gift whose repayment is double.
translation:
  language: zh_hans
  text: 有一种馈赠[a]对你没有益处；也有一种馈赠，其回报是双倍的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “馈赠”也可译作“给予”：有一种给予对你没有益处；也有一种给予，其回报是双倍的。
    reason: 原文δόσις既可侧重所赠之物，也可侧重给予的行为；正文保留简洁表达，脚注说明另一种可能。
lexical_decisions:
- source_word: δόσις
  choice: 馈赠
  rationale: δόσις既可指给予这一行为，也可指所赠之物。“馈赠”在现代汉语中较自然，并能在一定程度上保留这种双重可能；全句两处采用同一译词，以维持原文的重复和对照。
- source_word: λυσιτελήσει
  choice: 没有益处
  rationale: 该动词表示有利、有益或带来实际好处。译为“没有益处”简洁自然，也不把利益局限为金钱收益。
- source_word: σοι
  choice: 对你
  rationale: 与“没有益处”搭配，清楚表达与格所指的受影响者。
- source_word: ἀνταπόδομα
  choice: 回报
  rationale: 该词指作为回应而给予的东西。“回报”既表达互惠、返还之意，又不预先断定这是偿债、奖赏或报应。
- source_word: διπλοῦν
  choice: 双倍的
  rationale: 直接表达“二倍、两倍”的含义，符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的箴言式语体；以分号呈现两种馈赠的对照，并用“其回报是双倍的”保留原文未明确说明由谁回报、回报归谁的含蓄性。
