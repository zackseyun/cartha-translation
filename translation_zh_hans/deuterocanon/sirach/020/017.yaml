  text: Those who eat my bread are evil of tongue[a]; how often, and how many[b], will laugh at him?
translation:
  language: zh_hans
  text: 吃我饼的人，言语卑劣；多少次，又有多少人会讥笑[a]他呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “讥笑”也可译作“嘲笑”或“奚落”；希腊词含有贬抑、嘲弄之意，不只是发笑。
    reason: lexical_alternative
  - marker: b
    text: 本句希腊文表达简短而突兀，直译近似“多少次，又有多少人会讥笑他呢？”这里没有大幅顺译，也没有补明“他”指谁。
    reason: textual_difficulty
lexical_decisions:
- source_word: οἱ ἐσθίοντες
  choice: 吃……的人
  rationale: 现在时分词作名词用，表示一般或持续性的行为；此译自然保留其概括意义。
- source_word: τὸν ἄρτον μου
  choice: 我的饼
  rationale: 直译为“我的饼”，既保留具体意象，也可自然暗示同席或领受供应，不泛化为“食物”。
- source_word: φαῦλοι γλώσσῃ
  choice: 口出恶言
  rationale: φαῦλοι 表示卑劣、恶劣，γλώσσῃ 是与舌头或言语有关的与格；“口出恶言”在现代汉语中自然，并保留其道德贬义。
- source_word: ποσάκις
  choice: 多少次
  rationale: 对应询问频率的副词，直译其反复发生的意味。
- source_word: καὶ ὅσοι
  choice: 又有多少人
  rationale: 保留与 ποσάκις 并列的第二个疑问成分；不把原文突兀的结构完全改写。
- source_word: καταγελάσονται
  choice: 讥笑
  rationale: 该动词不只是发笑，也可表示嘲笑、奚落；“讥笑”简洁传达其贬抑意味。
- source_word: αὐτοῦ
  choice: 他
  rationale: 这是 καταγελάω 所支配的阳性单数属格宾语；译作“他”，但不擅自补明其所指。
theological_decisions:
- issue: 第二分句结构突兀，且 αὐτοῦ 的指代不明确
  choice: 保留“多少次、又有多少人讥笑他”的并列疑问形式，并译出“他”
  alternative: 顺译为“会有许多人屡次讥笑他”或补明“他”所指的人物
  rationale: 现存希腊文本简缩而不平顺；直译其两个疑问成分并保留代词的模糊所指，可避免把不确定的句法和人物关系解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“口出恶言”避免生硬的“舌头邪恶”；后半句则有意保留原文略显突兀的并列结构和代词歧义。
