  yaml_path: translation/deuterocanon/sirach/020/028.yaml
  text: The one who works the land will raise up his grain heap[a], and the one who pleases great men will atone for injustice.
translation:
  language: zh_hans
  text: 耕种土地的人，必使自己的谷堆高起来；取悦大人物的人，必为不义赎罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必遮掩过错。”希腊文直译为“必为不义赎罪”；这里可能是在描述取悦有权势者所产生的实际效果。
    reason: 说明后半句中赎罪用语在社会语境下可能具有的另一种理解，同时保留正文的直译力度。
lexical_decisions:
- source_word: ὁ ἐργαζόμενος γῆν
  choice: 耕种土地的
  rationale: 分词结构作名词用，泛指耕作者；“耕种土地”自然表达农业语境，又不把 γῆ 过度限定为某一种田地。
- source_word: ἀνυψώσει
  choice: 必使……高起来
  rationale: 保留“举高、升高”的基本意象；在谷堆语境中也自然暗示收成增加。
- source_word: θιμωνιὰν αὐτοῦ
  choice: 自己的谷堆
  rationale: θιμωνιά 指收获后堆积的谷物或禾捆；“谷堆”简明地保留农耕图景，αὐτοῦ 译作“自己的”。
- source_word: ὁ ἀρέσκων
  choice: 讨……喜欢的
  rationale: 表达使人喜悦、取悦之意；比“巴结”中性，避免加入原文未明说的贬义。
- source_word: μεγιστᾶσιν
  choice: 大人物
  rationale: 指社会地位显赫、有权势的人；“大人物”是现代汉语中自然的泛称，不将其过度具体化为官长或统治者。
- source_word: ἐξιλάσεται
  choice: 必……赎罪
  rationale: 保留该动词赎罪、消解罪责的强烈语义，不把它直接淡化为掩盖或补救。
- source_word: ἀδικίαν
  choice: 不义
  rationale: 既可涵盖不公，也可指错误、恶行；“不义”与赎罪用语搭配自然，并保留道德和社会层面的宽度。
theological_decisions:
- issue: 后半句究竟指真正为不义赎罪，还是借取悦权贵遮掩恶行
  choice: 正文保留“必为不义赎罪”
  alternative: 必遮掩过错；必消解不义
  rationale: 希腊文 ἐξιλάσεται 具有赎罪、平息或消解罪责的语义。箴言在此可能带有现实或讽刺意味，但原文没有明示，因此正文保留其神学—伦理张力，不替读者消解。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“大人物”准确传达社会权势与显赫身份；“赎罪”刻意保留原文较强的宗教伦理用语。脚注标记置于全句末，所注释的是后半句。
