  text: There is one who keeps silent because there is no answer[b][a], and there is one who keeps silent because he sees the right time.
translation:
  language: zh_hans
  text: 有人沉默，是因为无话可答[b][a]；也有人沉默，是因为看准了时机。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“智慧人沉默直到合宜的时候，喋喋不休的人和愚昧人却越过合宜的时机。”这句格言的希伯来文与希腊文形式差异明显；正文依现存希伯来文，希腊文则印证了“时机”所含的合宜时刻之意。
    reason: textual_variant
  - marker: b
    text: 或译：“因为没有回答”，也可理解为“因为答不上来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲרִישׁ
  choice: 沉默
  rationale: 该分词在这里表示不说话、保持缄默；“沉默”自然简洁，也适合格言体，并可涵盖持续或有意不发言的意思。
- source_word: מֵאֵין מַעֲנֶה
  choice: 因为无话可答
  rationale: 希伯来语直指“没有回答/答复”。“无话可答”在现代汉语中自然，并保留究竟是没有可作的回答，还是本人答不上来的轻微歧义。
- source_word: עֵת
  choice: 时机
  rationale: עֵת本义为时间、时节；在智慧文学语境中可指合宜的时刻。“时机”简洁地传达这种合宜性，希腊平行文本中的καιρός也支持这一语气。
- source_word: רֹאֶה עֵת
  choice: 看准了时机
  rationale: 原文直译为“看见时机/时间”。“看准了时机”既保留“看”的意象，又以自然汉语表达辨明合宜时刻的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的格言体。“有人……也有人……”对应希伯来文重复的יֵשׁ结构；分号突出两类沉默之间的对照。脚注标记按正文相关短语后的顺序保留为[b][a]。
