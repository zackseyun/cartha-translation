  yaml_path: translation/deuterocanon/sirach/020/022.yaml
  text: There is one who destroys his own life through shame[b][a], and because of a foolish face he will lose it.
translation:
  language: zh_hans
  text: 有人因羞耻而断送自己的性命[a]，也会因愚昧的神色[b]而丧掉性命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”或译“灵魂”或“自己”；希腊语ψυχή可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“因愚昧的脸面（面容）”。这里也可能指愚蠢、无知的外在表情或举止。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολλύων
  choice: 断送
  rationale: ἀπόλλυμι可指毁灭、败坏或丧失；“断送”既保留其严重性，也自然表达当事人使自己的生命走向丧失。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自己的性命
  rationale: ψυχή在此可指生命、自我或灵魂。智慧文学的实际劝诫语境中，“性命”自然贴切，同时不把经文限定为关于非物质灵魂的断言。
- source_word: διʼ αἰσχύνην
  choice: 因羞耻
  rationale: διά接宾格可表示原因或途径；“因”简洁保留了这里的因果关系。αἰσχύνη也可能带有羞怯、难为情之意，但正文不进一步限定。
- source_word: ἀπὸ ἄφρονος προσώπου
  choice: 因愚昧的神色
  rationale: 短语直译近于“出于／由于愚昧的脸面（面容）”。“神色”在现代汉语中较自然地保留外在面容或表情的意象，又不将其过度解释为特定行为。
- source_word: ἀπολεῖ αὐτήν
  choice: 丧掉性命
  rationale: 未来式ἀπολεῖ与前面的ἀπολλύων相呼应，αὐτήν回指ψυχή；“丧掉性命”保留结果意味，并使中文指代清楚。
theological_decisions:
- issue: 智慧文学语境中ψυχή的含义
  choice: 性命
  alternative: 灵魂；自己
  rationale: 本节警告羞耻及外在神色所造成的自我毁损。“性命”保留实际生命层面的警告，又避免擅自把ψυχή限定为某种灵魂论概念。
- issue: ἀπὸ ἄφρονος προσώπου所指为何
  choice: 保留为“因愚昧的神色”
  alternative: 因愚人的脸面；因顾及愚人的情面；因愚蠢的表情
  rationale: 希腊语短语本身生硬且具有歧义，既可能描述愚昧的面容或神态，也可能牵涉某人的脸面。正文保留面容意象，不替原文消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“断送自己的性命”与“丧掉性命”保留原文同一动词词根的呼应，同时避免机械重复；“愚昧的神色”尽量兼顾原文面容意象与中文自然度。
