  text: There is one who promises a favor out of shame to a friend[a], and so acquires him as an enemy for nothing.
translation:
  language: zh_hans
  text: 有人因怕难堪而向朋友许诺，反倒白白地[a]给自己招来一个仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无缘无故地”；希腊语这个副词既可表示徒然、毫无益处，也可表示没有正当缘由。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν αἰσχύνης
  choice: 碍于情面
  rationale: χάριν在这里与属格αἰσχύνης构成表示缘由的短语，意为“因为羞惭、顾及颜面”。“碍于情面”自然表达此人迫于难为情而承诺，并不把χάριν误解为“恩惠”。
- source_word: ἐπαγγελλόμενος
  choice: 许下承诺
  rationale: 该分词表示作出应允或承诺；原文没有明说所承诺的具体事情，因此不增添“帮忙”或“送礼”等内容。
- source_word: φίλῳ
  choice: 向朋友
  rationale: 与ἐπαγγελλόμενος相配的与格表示承诺的对象或接受者。
- source_word: ἐκτήσατο
  choice: 给自己招来
  rationale: 该动词表示为自己取得、获得；在这里所得的是“仇敌”，用“给自己招来”保留反讽意味，也符合现代汉语习惯。
- source_word: ἐχθρόν
  choice: 一个仇敌
  rationale: 直接保留“敌人、仇敌”的强烈关系词，不弱化为一般的不满或疏远。
- source_word: δωρεάν
  choice: 白白地
  rationale: 该副词既可表示徒然、毫无所得，也可表示无缘无故。“白白地”在正文中突出结果毫无益处，并以脚注保留另一可能。
