  yaml_path: translation/deuterocanon/sirach/020/018.yaml
  text: A slip is better from the ground than from the tongue[a]; so the downfall of the wicked will come in haste.
translation:
  language: zh_hans
  text: 在地上失足，总胜过舌头失言；照样，恶人[a]的败亡必迅速临到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照样，恶事的倾覆必迅速临到。”希腊语“κακῶν”既可指恶人，也可抽象地指恶事。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀλίσθημα
  choice: 滑一跤
  rationale: 表示因脚下打滑而踉跄或跌倒；“滑一跤”具体自然，并适合箴言式表达。
- source_word: ἀπὸ ἐδάφους
  choice: 在地上
  rationale: 按汉语习惯表达因地面或脚下而滑倒的具体图景，不机械保留希腊语介词。
- source_word: μᾶλλον ἢ ἀπὸ γλώσσης
  choice: 胜过在舌头上失足
  rationale: 希腊文省略比较谓语；补出“胜过”使句意完整，同时保留身体失足与言语失误之间的形象对照。
- source_word: γλώσσης
  choice: 舌头
  rationale: 保留智慧文学以“舌头”代指言语的具体比喻，而不抽象化为“言语”。
- source_word: πτῶσις
  choice: 败亡
  rationale: 此处不只是普通跌倒，而是恶人走向崩溃、毁灭；“败亡”在现代汉语中庄重而清楚。
- source_word: κακῶν
  choice: 恶人
  rationale: 属格复数既可能指“恶事／祸患”，也可能人格化地指“恶人”；正文采用在此语境中较顺畅的人称理解，并以脚注保留抽象读法。
- source_word: κατὰ σπουδήν
  choice: 匆匆
  rationale: 表达急速、仓促临到的意味，比单纯“很快”更能保留σπουδή所含的急迫感。
- source_word: ἥξει
  choice: 必……临到
  rationale: 准确表达将来发生之事；“临到”与“败亡”搭配自然，并保留“来到”的动势。
theological_decisions:
- issue: κακῶν的指称
  choice: 人格性理解：“恶人”
  alternative: 抽象性理解：“恶事／祸患”
  rationale: πτῶσις κακῶν可理解为“恶人的败亡”，符合智慧文学常见的道德分类；但希腊语形式本身也容许“恶事的倾覆／祸患的降临”等抽象理解，因此不在正文中消除这一真实歧义，而以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“在地上滑一跤／在舌头上失足”保留原文的具体对照；分号呈现两小句之间的类比关系。
