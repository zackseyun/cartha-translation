  yaml_path: translation/deuterocanon/sirach/020/013.yaml
  text: A wise man speaks little for himself[c][b][a], but the goodness of fools pours out wisdom.
translation:
  language: zh_hans
  text: 智者为自己只说几句话[b]，愚人的善意却倾泻出智慧[c][a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“愚人的礼物不会使你得益，因为他的眼睛不是一只，而是许多只。”本节的希伯来文与希腊文见证差异很大；正文采用现存希伯来文，因这一差异会实质影响理解，故在此保留希腊异文。
    reason: textual_variant
  - marker: b
    text: 或译：“智者言语简短。”
    reason: lexical_alternative
  - marker: c
    text: 末句可能含有讽刺意味：愚人倾泻言辞，仿佛是在施放智慧。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: 智者
  rationale: 将作名词使用的阳性单数形容词译为“智者”，既保留智慧人的所指，又符合现代汉语箴言体的自然表达。
- source_word: בִּמְעַט דִבֶּר
  choice: 很少……说话
  rationale: בִּמְעַט表示少量或寥寥数语；此处译作“很少说话”，保留言语简少的含义，同时在脚注列出“言语简短”这一可能。
- source_word: נַפְשׁוֹ
  choice: 为自己
  rationale: 此处较可能是反身或涉及自身利益的用法，并非专指非物质的“灵魂”；“为自己”保留其自我指涉而不过度解释。
- source_word: טוֹבַת כְּסִילִים
  choice: 愚人的善意
  rationale: טוֹבָה可指好处、善意或馈赠。正文紧贴现存希伯来文本，采用较宽泛的“善意”；希腊文本所见“礼物”则随完整异文收入脚注。
- source_word: יִשְׁפוֹךְ
  choice: 倾泻出
  rationale: 保留“倒出、倾泻”的鲜明意象，也容许本句带有讽刺意味。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是该词的直接对应；不把可能的反讽直接写入正文，以免消除原文张力。
- source_word: δόσις
  choice: 礼物
  rationale: 希腊平行文本明确指给予之物，译作“礼物”，但因希伯来与希腊本节差异重大，仅置于异文脚注。
- source_word: οὐ λυσιτελήσει σοι
  choice: 不会使你得益
  rationale: 准确表达希腊文“不会对你有益”，作为与希伯来正文显著不同的异文保存。
theological_decisions:
- issue: 末句是否明确标为讽刺
  choice: 正文保留字面张力，以脚注说明可能的讽刺
  alternative: 直接译成“愚人只会滔滔不绝，仿佛自己有智慧”
  rationale: 希伯来文字面仍说“倾泻出智慧”；直接意译为讥讽会把可能含义定死，因此正文不替读者消除歧义。
- issue: 希伯来与希腊见证的重大分歧
  choice: 正文依据现存希伯来见证，脚注完整保留希腊异文
  alternative: 采用希腊文作为正文
  rationale: 此处有高可信度的希伯来文本，故优先据其翻译；但希腊文内容完全不同，必须显著注明，以免掩盖文本史上的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“智者”“愚人”简洁自然；“倾泻出智慧”刻意保留希伯来文略显突兀的意象与可能的反讽，不以流畅为由消除文本张力。所有脚注标记均置于正文相应位置。
