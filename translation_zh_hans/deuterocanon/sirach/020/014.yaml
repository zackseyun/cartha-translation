  text: He gives little and heaps on many reproaches[a], and he opens his mouth like a herald.
translation:
  language: zh_hans
  text: 他给得少，却多加责骂[a]；他张开口，如同传令官。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他将给得少，却多加责骂”。希腊文动词为将来时；在此智慧文学的格言语境中，也可表达一贯的行为。
    reason: 保留希腊文将来时的较字面译法，并说明正文采用一般性表述的理由。
lexical_decisions:
- source_word: ὀλίγα
  choice: 少
  rationale: 中性复数在此作动词 δώσει 的内容，表示所给之物很少；译作“少”最符合现代汉语习惯。
- source_word: δώσει
  choice: 给得
  rationale: 希腊语为将来时，但在智慧文学的格言语境中可表达一贯的行为模式；汉语用一般性表述“给得”更自然。
- source_word: πολλὰ
  choice: 百般
  rationale: 此处修饰责骂行为，表示责难很多、反复加诸对方；“百般”简洁地传达数量与程度，而非机械译为“许多”。
- source_word: ὀνειδίσει
  choice: 责骂
  rationale: ὀνειδίζω 可指责备、辱骂或讥刺；“责骂”保留其负面言语攻击的广度，不额外限定为单纯侮辱。
- source_word: ἀνοίξει τὸ στόμα αὐτοῦ
  choice: 他张口说话
  rationale: 原文直译为“他张开他的口”；汉语“张口说话”既保留形象，也明确这是开始发言。
- source_word: ὡς κῆρυξ
  choice: 如同传令官
  rationale: κῆρυξ 是公开宣告信息的人；“传令官”比“使者”更能体现公开高声宣告的形象，也适合古代语境。
