  text: Pain and sleepless wandering[a], and retching and choking[c][b], and a turned face with a foolish man.
translation:
  language: zh_hans
  text: 疼痛，睡意逃遁，干呕和噎塞；与愚昧人同在时，面容反常。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本行希伯来文本颇难，尤其是中间几个症状以及“面容反常”一语；“睡意逃遁”也可理解为“辗转难眠”，“干呕和噎塞”也可理解为“呕吐和窒息”；“面容反常”也可指“把脸转开”或“面容扭曲”。希腊文本在此完全不同：“用穷人的财物献上祭物的人，就像当着父亲的面宰杀自己的儿子。”这表明抄传传统存在重大差异。
    reason: textual_variant
lexical_decisions:
- source_word: מכאוב
  choice: 疼痛
  rationale: 该名词可指身体的疼痛或痛苦；本句罗列身体症状，因此译作“疼痛”最合语境。
- source_word: ונדד ישנה
  choice: 睡眠逃离
  rationale: 短语将“游移、逃走”与“睡眠”相连，生动表达失眠或辗转难眠；保留希伯来文意象，不将其固定解释为某一种睡眠状态。
- source_word: ומער
  choice: 干呕
  rationale: 词形和确切含义有困难；在胃部不适的症状序列中，“干呕”既自然，也避免断定已经呕吐出来。
- source_word: ותשניק
  choice: 窒噎
  rationale: 该词与喉部受阻、窒息相关；“窒噎”适合与干呕并列，也保留喉间梗阻的身体感。
- source_word: ופני הפוכות
  choice: 面容反常
  rationale: 字面涉及“翻转、改变的脸”；此表达可能指脸转开或表情扭曲。“面容反常”在中文中可懂，同时保留一定歧义。
- source_word: עם איש כסיל
  choice: 愚昧人
  rationale: כסיל是智慧文学中典型的“愚昧人”；中文无需机械补出“与……同在”，因其在残缺或困难句法中的确切关系并不清楚。
