  naturalness: 原译整体庄重自然。将首句略作重组后，可更清楚地表达“平安”与“荣耀”都是对该人的陈述，同时避免“获得荣耀”造成的语义偏移。末句仍保留原文不寻常的表达和人称转换。
  terminology: “持守”“平安”“荣耀”适合此处，并能对应דבק、שלום、תפארה。保留“它”是处理不明指称的恰当做法。
