base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/010.yaml
  text: Who is this[a], He has been tested in these things and has become complete; and it will be for him a ground for boasting.
translation:
  language: zh_hans
  text: 谁是那紧紧持守它、得享平安，并以此为荣耀的人？[a] 因为他一生平安丰盛，这必成为你的荣耀。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文较难，直译近于：“谁是这紧贴于它的人？他有平安，这成了他的荣耀。”“它”所指为何并不明确。
    reason: alternative_reading
  - marker: b
    text: 希腊文本与这里的希伯来文差异很大，近于：“未曾受过考验的人，所知甚少。”它可能反映另一种文本形态。希伯来文末句的“你的”也与前文的“他”在人称上不一致。
    reason: textual_variant
lexical_decisions:
- source_word: מי הוא זה
  choice: 谁是那……的人？
  rationale: 保留希伯来文开头的辨认式反问语气，并使现代汉语句式自然完整。
- source_word: שנדבק בו
  choice: 紧紧持守它
  rationale: דבק 的基本意思是“粘住、紧贴、依附”；译作“紧紧持守”既保留原文意象，也避免在缺少明确先行词时擅自把 בו 具体化为“财富”或“金钱”。
- source_word: והיה לו שלום
  choice: 得享平安
  rationale: שלום 可指平安、安康或顺遂；“得享平安”保留其宽广含义，未按希腊异文改作“受考验而完全”。
- source_word: והיה לו תפארה
  choice: 又获得荣耀
  rationale: תפארה 表示荣耀、尊荣或光彩；这里用“荣耀”与本节末尾同词对应。
- source_word: כי ברבות שלום חייו
  choice: 因为他一生平安丰盛
  rationale: 原句结构简略且不寻常；此译尽量保留“丰盛/增多”“平安”“他的一生”三个要素，同时形成可理解的现代汉语。
- source_word: יהיה לך לתפארת
  choice: 这必成为你的荣耀
  rationale: 保留 לך 的第二人称“你的”，不把突兀的人称转换静默改成第三人称；יהיה 的未完成式依语境译为“必成为”。
theological_decisions:
- issue: 希伯来文本与希腊平行文本严重不一致
  choice: 正文以现存希伯来文为主，保留“持守、平安、荣耀”及末句的人称变化
  alternative: 依希腊文译作“未曾受过一点考验的人，所知甚少”，或将希伯来文与希腊文折衷为关于受考验而完全的陈述
  rationale: 所给希伯来文完整地保存了两句，而希腊平行文本表达的是另一内容。按“先依据原文证据”的原则，不宜在正文中用希腊文的“受考验”主题替换希伯来文；二者差异以脚注透明呈现。
- issue: בו 的所指不明
  choice: 译作“它”，不明确补成财富或金钱
  alternative: 译作“紧守财富”或“依附金钱”
  rationale: 本节单独所给文本没有明确先行词；虽然上下文可能涉及财富，正文仍应保留真实的指代含混。
- issue: 末句第二人称 לך 与前文第三人称不协调
  choice: 保留“你的荣耀”
  alternative: 协调为“他的荣耀”
  rationale: 人称突变可能反映文本传承问题，但现存希伯来证据明确为第二人称，故不静默修正。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。正文优先反映完整的希伯来见证，不以较短且内容不同的希腊平行文本重构正文；对指代不明和人称突变均予保留，并在脚注中说明。
