  text: For it is a stumbling block to a fool[a], and every simpleton is ensnared by it.
translation:
  language: zh_hans
  text: 因为这事是愚人的绊脚石[a]，凡轻信的人都被它网住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“因为梦使许多人误入歧途，寄望于梦的人都跌倒了。”此处希伯来文与希腊文见证差异很大。
    reason: alternative_reading
lexical_decisions:
- source_word: תקלה
  choice: 使……绊倒
  rationale: 该名词指使人跌倒或败亡之物；译成动词结构更符合现代汉语，同时保留原文的绊跌意象。
- source_word: אויל
  choice: 愚人
  rationale: 这是智慧文学中兼有道德与认知缺陷含义的常用词；“愚人”简洁、庄重，也符合汉语圣经智慧文学的语域。
- source_word: פותה
  choice: 愚蒙人
  rationale: 该词指缺乏判断、容易受骗的人；“愚蒙人”保留智慧文学色彩，并比一般的“单纯人”更清楚地传达其负面含义。
- source_word: יוקש
  choice: 被……网罗
  rationale: 该被动动词描写落入圈套；“被……网罗”保留捕捉、设套的比喻。
- source_word: בו
  choice: 被它
  rationale: 代词回指上下文中所说之事；与“网罗”组成自然的被动表达，同时不擅自明确其所指。
theological_decisions:
- issue: 希伯来文与希腊文见证存在重大差异
  choice: 正文以现存希伯来文为准，翻译愚人绊倒、愚蒙人被网罗的句子。
  alternative: “因为梦使许多人误入歧途，寄望于梦的人都跌倒了。”
  rationale: 《便西拉智训》有希伯来文存世之处，以希伯来文为主要文本依据；但希腊文在此反映的是实质不同的经文传统，因此以脚注完整保留，不将两者调和。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“使……绊倒”与“被……网罗”并列，保留希伯来文两个危险意象；不补明“这事／它”的具体所指，以保存原文在本节中的指代含混。
