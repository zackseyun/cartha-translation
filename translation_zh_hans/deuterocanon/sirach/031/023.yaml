  text: Is not a little enough for an intelligent man? And on his bed he does not gasp[a][b].
translation:
  language: zh_hans
  text: 对明达的人来说，少量不就够了吗？他在床上也不会气喘[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不会气喘”所译的希伯来语较难确定。现存希伯来文本在这里不易解释；按上下文，大意是饮食有节制的人躺卧时不会感到不适。
    reason: textual_variant
  - marker: b
    text: 资料所附的希腊语平行文本与这句希伯来文并不对应，看来属于另一节。因此正文以希伯来文为主要依据，同时注明其不确定性。
    reason: textual_variant
lexical_decisions:
- source_word: הלא
  choice: 不就……吗
  rationale: 保留期待肯定回答的反问语气，并符合现代汉语习惯。
- source_word: די
  choice: 够
  rationale: 表达“足够、充足”的意思，在这句格言式问句中简洁自然。
- source_word: אנוש נבון
  choice: 明达的人
  rationale: אנוש指人，נבון侧重有理解力和辨别力；“明达的人”兼顾原文形式与实际判断力。
- source_word: מזער
  choice: 一点
  rationale: 指少量；结合饮食节制的语境，“一点”自然且不过度具体化。
- source_word: יצועיו
  choice: 床上
  rationale: 该词指床榻或卧处；现代汉语以“床上”最清楚。
- source_word: לא ישיק
  choice: 不会喘息
  rationale: 动词形式和确切含义较难确定；“喘息”保留身体不适的含义，又避免擅自具体化为呕吐或窒息。
