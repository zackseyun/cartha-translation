  yaml_path: translation/deuterocanon/sirach/031/017.yaml
  text: Stretch out your hand to the place he looks at[a], and do not reach with him into the dish.
translation:
  language: zh_hans
  text: 他所注视之处，你不要往那里伸手[a]；也不要和他同时把手伸进共用的盘中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本传统在这里作：“敬畏主的人，他的心灵是有福的。”开罗藏经库保存的希伯来见证则是这句关于席间礼仪的话。此处文本传统并不确定。
    reason: alternative_reading
lexical_decisions:
- source_word: מקום
  choice: ……之处
  rationale: מקום通常指“地方、所在之处”。这里处于同席进食的语境，译作“……之处”既保留具体空间含义，也自然指对方所留意的食物位置。
- source_word: יביט
  choice: 他目光所及
  rationale: 该词表达“看、注视”。“他目光所及”符合现代汉语，并保留第三人称阳性单数所指的同席者。
- source_word: אל תושיט יד
  choice: 你不要伸手过去
  rationale: 现存希伯来文本最自然地读作带否定词אַל的禁令：“不要伸手”。这也与下半句的餐桌礼仪劝诫一致。英文本所给“伸出你的手”似漏译否定，因此未予采用。
- source_word: עמו
  choice: 和他同时
  rationale: עמו本义为“与他一起”。在共享食盘的语境中，加“同时”明确其所禁止的是与对方争相取食，同时不改变原意。
- source_word: בטנא
  choice: 把手伸进盘中
  rationale: טנא可指篮子或盛物的容器；在用餐语境中译作“盘”最易理解。“把手伸进”结合上下文补明动作，但不把容器过度具体化为某一种器皿。
- source_word: φοβουμένου τὸν Κύριον μακαρία ἡ ψυχή
  choice: 未收入正文
  rationale: 所给希腊传统意为“敬畏主的人，他的心灵是有福的”，与现存希伯来餐桌礼仪句差异极大。既然本节有希伯来见证，正文依希伯来文，希腊异文则在脚注中完整保留。
theological_decisions:
- issue: 本节现存希伯来传统与希腊传统严重分歧
  choice: 正文采用现存希伯来文的餐桌礼仪训诫，并以脚注注明希腊传统。
  alternative: “敬畏主的人，他的心灵是有福的。”
  rationale: 《便西拉智训》有希伯来文本存世之处，以希伯来文为正文依据；但此处并非细微措辞差异，而是完全不同的句子，因此必须公开保留希腊异文及文本不确定性，不将两者调和。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“目光所及之处”保留原文的空间表达；“不要伸手过去”清楚呈现希伯来文禁令。下半句用“同时”传达与同席者争相从共用食盘取食的语境。脚注标记[a]已置于与文本分歧直接相关的第一分句之后。
