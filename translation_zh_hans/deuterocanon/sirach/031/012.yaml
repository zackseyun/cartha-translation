base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/012.yaml
  text: Therefore hold fast to his goodness[a], and the assembly will recount his praise. Bread is instruction[c][b], and wine with it.
translation:
  language: zh_hans
  text: 所以，要持守他的美善[b]；会众必述说对他的赞美。饼是管教[c]，酒与它相伴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “他的美善”在宴席语境中也可能有“他的厚意”或“他的慷慨”之意。
    reason: lexical_alternative
  - marker: c
    text: 本句的文本和含义都难以确定。“管教”也可译作“训诲”或“纠正”。
    reason: lexical_alternative
lexical_decisions:
- source_word: על כן
  choice: 所以
  rationale: 自然表达承接上文而得出的结论。
- source_word: חזק
  choice: 要持守
  rationale: 该命令式可指刚强、抓牢或坚持；与“他的美善”连用时，“持守”既保留劝勉语气，也避免擅自限定为称颂或接受馈赠。
- source_word: טובו
  choice: 他的美善
  rationale: טובו可指他的良善、恩惠或慷慨；“美善”保留较宽的语义范围，宴席语境中的厚待之意仍可包含其中。
- source_word: ותהלתו
  choice: 对他的赞美
  rationale: 明确表达该名词指向对那人的称赞，符合现代汉语习惯。
- source_word: יספר קהל
  choice: 会众必述说
  rationale: ספר在此为述说、传扬；קהל指聚集的人群。“会众”保留集体含义，但不把场景限定为礼仪性聚会。
- source_word: מוסר לחם
  choice: 饼是管教
  rationale: 原文短促而语义艰难。מוסר兼有管教、训诲和纠正之义；“管教”保留其纪律与教导的双重力度，不把难句解释得过于明确。
- source_word: ויין יחדו
  choice: 酒与它相伴
  rationale: יחדו表达一同、相伴。此译文以“它”回指饼，尽量保留两者并列相随的关系，同时使汉语可读。
theological_decisions:
- issue: 希伯来文本与希腊文本在本节严重分歧
  choice: 正文依据现存希伯来文本翻译，并用脚注完整说明希腊异文。
  alternative: 依据希腊文译作：“我在漂泊中见过许多事；我的领悟比我的言语更多。”
  rationale: 现存希伯来文应作为正文的主要文本依据，但希腊见证与之完全不同，不能混合成一个协调后的读法，也不能隐去其重要性。
- issue: מוסר לחם的关系与含义
  choice: 保留为“饼是管教”，不补入具体的比喻解释。
  alternative: “饼是训诲”或“饼是纠正”。
  rationale: 希伯来语句法简略，且语境意义不明；直陈式译法保存原有张力，避免引入特定伦理或神学解释。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“要持守”呈现劝勉语气；“会众”不特指宗教礼仪群体。末句刻意保留希伯来文的突兀和含混，不用解释性扩写消除文本困难。
