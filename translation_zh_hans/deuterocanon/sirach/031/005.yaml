  text: One who eagerly pursues gain will not go unpunished[c][b][a], and one who loves profit will go astray by it.
translation:
  language: zh_hans
  text: 追逐财富的人不能免受惩罚[a][b]；喜爱收益的人，必因它走入歧途[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文是一则论追逐财富、喜爱收益的格言。希腊文在本节却作：“占卜、兆头和梦都是虚妄的；心中幻想，如临产妇人的心一般。”这似乎反映了一个差异很大的文本传统。
    reason: textual_variant
  - marker: b
    text: “财富”或可译作“金子”或“钱财”；这里的希伯来词可能更具体地指物质财富。
    reason: lexical_alternative
  - marker: c
    text: “收益”或可译作“价钱”或“报酬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רודף
  choice: 追逐
  rationale: 该分词表示持续、主动地追求；“追逐”自然地保留了刻意奔逐的意味。
- source_word: חרוץ
  choice: 财富
  rationale: 此处最可能泛指物质财富或所得，不必限定为金子；并与下半句的 מחיר 构成经济语义上的平行。
- source_word: לא ינקה
  choice: 不能免受惩罚
  rationale: 这一习语可指不能免罪或逃脱惩罚；该译法以现代汉语清楚表达智慧格言所强调的后果。
- source_word: אוהב
  choice: 贪爱
  rationale: 原文直译为“爱……的人”；结合所爱的对象是收益，“贪爱”在汉语中简洁传达这种不当依恋，同时维持泛指结构。
- source_word: מחיר
  choice: 收益
  rationale: 该词通常可指价钱、代价或报酬；在此经济伦理语境中，“收益”较自然，也与上句“财富”有所区分。
- source_word: בו
  choice: 因它
  rationale: 将介词及代词后缀理解为原因或媒介，指所贪爱的收益成为走入歧途的原因。
- source_word: ישגה
  choice: 必……走入歧途
  rationale: 该动词表示偏离或犯错；“走入歧途”兼具道德与实际判断上的偏离，又不额外指定外在诱导者。
theological_decisions:
- issue: 希伯来文与希腊文平行经文显著不同
  choice: 正文依据现存希伯来文，译为追逐财富、贪爱收益的格言，并用脚注说明希腊文本的另一传统。
  alternative: 希腊文作：“占卜、兆头和梦都是虚妄的；心中幻想，如临产妇人的心一般。”
  rationale: 本节有可靠的希伯来文见证，故以希伯来文为正文依据；但希腊文并非轻微异文，而是完全不同的格言，必须如实记录，不能调和。
- issue: 贪财与受罚之间的表达强度
  choice: 保留“不能免受惩罚”的确定陈述。
  alternative: 译作“不能算为无罪”或“不能获判无罪”。
  rationale: לא ינקה 兼有不被算为无罪和不能逃脱惩罚的语义；正文采用现代读者更易理解的习语意义，而不把惩罚的方式或时间具体化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并以两句平行结构体现希伯来智慧格言的节奏。“贪爱”使经济欲望的负面语境清楚，但没有加入特定宗派解释；“必因它走入歧途”保留原文因果关系及道德张力。
