  text: The sleeplessness of a rich man wastes away his flesh[a], and anxiety about livelihood drives away sleep.
translation:
  language: zh_hans
  text: 富人的失眠耗损他的肉身[a]；对生计的忧虑使人难以入睡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文开头一语难解。希腊文平行文本作：“空虚而虚假的希望属于无知的人，梦境使愚昧人飘飘然。”正文依据现存希伯来文，并按上下文作释译；此处经文传承并不稳定。
    reason: textual_variant
lexical_decisions:
- source_word: שקר עשיר
  choice: 富人的失眠
  rationale: 传世希伯来文本此处难解；שקר 通常意为“虚假”，但按本节与下半句有关睡眠的平行关系，以及《便西拉智训》31:1 的语境，译作“失眠”可表达因财富而彻夜不安的意思，同时以脚注说明文本问题。
- source_word: ימחה שארו
  choice: 消磨他的身体
  rationale: ימחה 表示逐渐除去、耗损；שאר 可指“肉体”。中文用“消磨他的身体”保留身体受损的意象，又比“消灭他的肉”自然。
- source_word: דאגת מחיה
  choice: 为生计忧虑
  rationale: דאגה 是焦虑、忧愁；מחיה 指维持生活所需之物或谋生来源。“为生计忧虑”简洁自然，并保留物质生活压力的含义。
- source_word: תפריע נומה
  choice: 使人无法入睡
  rationale: 该动词表示搅扰或使中断，נומה 指睡眠。译文表达忧虑妨碍睡眠的实际结果；补出泛指的“人”，符合现代汉语习惯。
