  text: Who is this? Let us call him blessed[a], for he has done wonders among his people.
translation:
  language: zh_hans
  text: 这人是谁？让我们称他有福[a]，因为他在自己的百姓中行了奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本在这里差异很大：“受过教导的人知道许多事，经验丰富的人会讲述明智之言。”这可能反映了不同的文本形态或经节划分。
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא זה
  choice: 这人是谁？
  rationale: 保留希伯来语反问和指示词“这”的意味；补出“人”使现代汉语表达自然，且没有超出明确的人物所指。
- source_word: ונאשרנו
  choice: 让我们称他有福
  rationale: אשר在这里表示宣告某人有福；“让我们”体现劝勉或共同称颂的语气，避免误译为向他祝福。
- source_word: כי
  choice: 因为
  rationale: 引出称他有福的理由，现代汉语中清楚自然。
- source_word: הפליא לעשות
  choice: 行了奇事
  rationale: 该组合表示作出非凡、令人惊奇之事；“行了奇事”保留庄重语体和语义力度，同时不具体限定所做何事。
- source_word: בעמו
  choice: 在自己的百姓中
  rationale: 保留介词ב较直接的范围意义“在……中”，不将其解释性地收窄为“为了他的百姓”。“自己的”清楚表达后缀所指。
theological_decisions:
- issue: 希伯来文本与所附希腊平行文本存在重大差异
  choice: 正文以现存希伯来文本为依据，并用脚注说明希腊文本的不同内容。
  alternative: 正文译作：“受过教导的人知道许多事，经验丰富的人会讲述明智之言。”
  rationale: 此处希伯来文本完整且来源置信度高，应作为主要翻译依据。希腊文本并非近似对应，而可能反映另一文本形态或不同的经节对齐，因此不宜混入正文，但应诚实保存在脚注中。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“有福”和“行了奇事”保留智慧文学的称颂语气；正文中的[a]与脚注对应。
