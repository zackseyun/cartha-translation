  text: Recline like a well-bred man[a], and do not gobble[c][b], lest you become disgusting.
translation:
  language: zh_hans
  text: 要像个有教养的人那样斜倚入席[a][b]；不要狼吞虎咽，免得惹人厌恶。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有教养的人”也可译作“受人推重的人”或“蒙拣选的人”；希伯来语措辞的细微含义不完全确定，但上下文显然强调得体、有礼的席间举止。
    reason: lexical_alternative
  - marker: b
    text: 古代地中海地区的正式宴席上，人们通常斜倚着用餐。
    reason: cultural_note
  - marker: c
    text: 斯威特版希腊文在《便西拉智训》31:19的内容与这句希伯来文并不对应，表明不同文本传统在此存在经节或内容错位。
    reason: textual_variant
lexical_decisions:
- source_word: הסב
  choice: 斜倚入席
  rationale: 在宴席语境中，这个动词指按古代习俗斜倚着用餐，不只是一般的“坐下”；此译既保留历史姿态，也自然交代入席动作。
- source_word: כאיש אשר נבחר
  choice: 像个有教养的人那样
  rationale: 字面近于“像一个被选中的人”，在本节餐桌礼仪语境中更可能形容受推重、举止得体的人。“有教养”传达其社会伦理含义，同时以脚注保留“蒙拣选”或“受推重”的可能。
- source_word: תעט
  choice: 狼吞虎咽
  rationale: 这里警戒粗鲁、贪急的吃相；“狼吞虎咽”是现代汉语中自然鲜明的对应表达，又没有增添具体食物宾语。
- source_word: תגעל
  choice: 惹人厌恶
  rationale: 该形式在此表达因失礼而成为他人厌恶的对象。“惹人厌恶”比生硬的“成为可憎恶的”更符合现代汉语，同时保留社会后果。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“斜倚入席”保留古代宴饮背景，“狼吞虎咽”则以普通读者熟悉的成语传达粗鲁贪急的吃相；脚注明确保留 נבחר 的语义不确定性及希腊平行文本的重大错位。
