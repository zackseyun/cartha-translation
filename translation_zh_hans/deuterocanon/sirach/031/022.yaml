  text: Even if you sit among many[b][a], do not reach out your hand before your companion.
translation:
  language: zh_hans
  text: 即使你与许多人同席[b]，也不要先于同伴伸手[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 意思是：不要先于同席的人伸手取食。
    reason: cultural_note
  - marker: b
    text: 斯威特本希腊文平行文本与此处差异很大，内容为“不法之人的讥嘲不会得到悦纳”一类的话。本节因此以希伯来文见证为正文，并将希腊文保留为异文参考。
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: 即使
  rationale: 在条件性劝诫中表达让步关系；省去生硬的“并且”，符合现代汉语表达。
- source_word: בין רבים
  choice: 与许多人同席
  rationale: 字面为“在许多人中间”；上下文涉及用餐礼仪，“同席”自然点明场景，但不限定具体宴席形式。
- source_word: ישבת
  choice: 同席
  rationale: 希伯来语完成式在条件句中可表达一般情形；与“与许多人”合译为现代汉语的“与许多人同席”。
- source_word: לפני
  choice: 抢在……前
  rationale: 此处主要表示行动上的先后，而非单纯空间位置；“抢在”准确传达不可先于同伴取食的劝诫。
- source_word: רע
  choice: 同伴
  rationale: 智慧文学语境中指身边的伙伴或同席者；“同伴”比“邻舍”更适合餐桌场景，也不将其误解为“恶”。
- source_word: אל תושיט יד
  choice: 不要……伸手
  rationale: 保留原文伸手的具体意象，同时以“抢在同伴前”显明这是关于取食次序的餐桌礼仪。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“同席”简洁呈现用餐场景；“抢在同伴前伸手”既保留原文动作意象，也让普通读者容易理解。异文标记紧接涉及整句希伯来文传统的短语之后，文化注则置于动作劝诫之后。
