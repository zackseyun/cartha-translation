base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/008.yaml
  text: Blessed is the man who is found blameless[b][a], and who has not gone astray after wealth.
translation:
  language: zh_hans
  text: 有福的人，是那被发现为无可指摘、在财富的事上没有偏离正道的人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文第二分句较难确定。这里译作“在财富的事上没有偏离正道”；也可理解为“没有因财富而偏离正道”或“没有因追逐财富而走入歧途”。
    reason: alternative_reading
  - marker: b
    text: 本节的希腊文平行文本与现存希伯来文差异很大。正文依照希伯来文翻译，并保留其中有关财富之分句的不确定性。
    reason: textual_variant
lexical_decisions:
- source_word: אשרי
  choice: 有福的是
  rationale: 这是智慧文学常见的祝福句式；“有福”既保留其庄重语气，也不把含义缩减为主观的快乐感受。
- source_word: איש
  choice: 人
  rationale: 希伯来文为阳性单数，但这里是智慧训诲中的代表性个体；现代汉语用“人”自然，并未抹去原文的单数表达。
- source_word: נמצא
  choice: 被证实为
  rationale: 保留被动、经检验而显明的意味，比单说“是”更贴近原文。
- source_word: תמים
  choice: 正直
  rationale: 此处指品格完整、行为无可指摘，并非宣称绝对无罪；“正直”符合现代汉语伦理语境。
- source_word: ויחר
  choice: 在……的事上
  rationale: 传世希伯来文在这里艰涩且可能有文本问题，因此采用关系性的表达，不强行断定是“追逐”财富或“被财富引诱”。
- source_word: ממון
  choice: 财富
  rationale: 泛指钱财和物质资产；“财富”比“钱”涵盖面更广。
- source_word: לא נלוז
  choice: 没有偏离正道
  rationale: 该词表达从正确道路转离的意思；补出“正道”使现代汉语清楚，同时保留其道德意象。
theological_decisions:
- issue: 希伯来文第二分句在钱财与偏离正道之间的确切关系不明
  choice: 译为“在财富的事上没有偏离正道”
  alternative: “没有因财富而偏离正道”或“没有因追逐财富而走入歧途”
  rationale: 现存希伯来文明确包含“财富”和“没有偏离”的核心意思，却不足以确定财富究竟是偏离的原因、目标，还是所涉及的领域。关系性译法保留这种张力，不作过度重构。
- issue: 希腊平行文本与现存希伯来文显著不同
  choice: 正文依据现存希伯来文，脚注说明异文
  alternative: 依据希腊文译作关于律法、虚假与忠信之口的陈述
  rationale: 所给希伯来见证置信度高，虽有重大文本差异，仍应优先翻译其可辨识内容；希腊文用于校勘并在脚注中如实披露，而不混合两种文本。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“被证实为正直”保留原文的评定意味；“在财富的事上”刻意保持关系开放，避免把艰涩的希伯来文过度解释为单一因果关系。
