  text: Even if you are constrained[a], wait for delicacies patiently[b], and it will bring you rest.
translation:
  language: zh_hans
  text: 即使你受到强迫[a]，也要耐心等候佳肴[b]，这样你便得安歇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“一个人在祈祷，另一个人在咒诅——主人会听谁的声音呢？”这与此处现存希伯来文属于差异重大的文本传统。
    reason: alternative_reading
  - marker: b
    text: 本节希伯来文有疑难，并且与希腊文见证差异很大。“受到强迫”所译的词也可表示“被迫”或“处于压力之下”；原文重复“等候”一词，以加强语气。
    reason: textual_variant
lexical_decisions:
- source_word: וגם
  choice: 即使
  rationale: 与后面的条件词 אם 合起来表达让步语气；现代汉语用“即使”比直译为“并且也”更自然。
- source_word: אם
  choice: 即使
  rationale: 通常表示条件“如果”；在 וגם אם 的组合中，以“即使”自然呈现其让步条件。
- source_word: נאנסתה
  choice: 你受到强迫
  rationale: 源自动词 אנס，表示被迫、受压力。此处形式和语境均有疑难，因此采用含义较宽的“受到强迫”，不引入语境不支持的性含义。
- source_word: במטעמים
  choice: 面对佳肴
  rationale: מטעמים 指美味、精选的食物；“佳肴”简洁庄重。“面对”用来顺畅表达介词 ב 在本句中的关系，同时避免过度确定其具体句法功能。
- source_word: קוה קוה
  choice: 耐心等候
  rationale: קוה 有等候、盼望之意；重复形式表示强调或持续。汉语以“耐心等候”自然表达这种强化，而不生硬重复动词。
- source_word: וינוח
  choice: 这样你便得安歇
  rationale: נוח 表示休息、安定或舒缓。希伯来文的主语关系不够明确；此译文以结果句表达，不武断指定某物为使役主语。
- source_word: לך
  choice: 你便得
  rationale: לך 可表示利益与归属，即安歇临到“你”或“为你”而有；融入“你便得安歇”符合现代汉语表达。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本严重分歧
  choice: 正文依据现存希伯来文翻译，并用脚注完整说明希腊文的不同传统。
  alternative: 按希腊文译为：“一个人在祈祷，另一个人在咒诅——主人会听谁的声音呢？”
  rationale: 《便西拉智训》有希伯来文存世之处，以希伯来文为主要文本依据；但这里的希腊文并非细微异文，而是内容完全不同的文本传统，必须明确保留，避免掩盖文本问题。
- issue: 希伯来文 נאנסתה 与整句句法不确定
  choice: 译作“你受到强迫”，并将后半句译为结果表达“这样你便得安歇”。
  alternative: 可理解为“你被迫”“你处于压力之下”；末句也可能译作“它就会安定下来”或“你就会休息”。
  rationale: 采用较宽泛的现代汉语，保留受迫之意，同时不把不确定的施事、对象或末句主语强行坐实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“佳肴”“安歇”略具经文文体色彩，但仍属当代常用书面语。正文避免机械重复“等候”，以“耐心”传达希伯来文叠词的持续和强调意味；脚注则交代原文重复及重大文本分歧。
