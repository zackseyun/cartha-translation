  language: zh_hans
  text: 不要说：“对他来说已经够了。”要记住，恶眼[a]是邪恶的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶眼”是希伯来习语，常指吝啬、吝于给予或嫉妒的心态。
    reason: lexical_alternative
  - marker: b
    text: 本节所附的希腊文平行文本作：“敬畏主之人的灵必存活。”这与此处希伯来文并不对应，可能反映不同的文本编排或节号。
    reason: textual_variant
lexical_decisions:
- source_word: אל תאמר
  choice: 不要说
  rationale: 直译否定命令式，保留直接劝诫的语气。
- source_word: ספוק עליו
  choice: 给他这些就够了
  rationale: ספוק表达“足够、充足”，עליו带第三人称阳性单数后缀。结合宴席与待人慷慨的语境，用自然汉语表达“对他而言已经足够”，但不把所指进一步具体化。
- source_word: זכור
  choice: 要记住
  rationale: 保留命令语气；“要记住”在现代汉语中自然且庄重。
- source_word: רעה עין רעה
  choice: 恶眼是恶的
  rationale: 保留原文“恶—眼—恶”的重复和箴言式力度；“恶眼”作为具体的圣经习语不在正文中被单一解释为吝啬或嫉妒，以免消除其语义张力。
theological_decisions:
- issue: 是否在正文保留“恶眼”这一希伯来习语
  choice: 保留“恶眼”，并用脚注解释其常见含义
  alternative: 译作“吝啬的心”“嫉妒的眼”或“舍不得给人的态度”
  rationale: 该习语在宴席语境中常指吝啬、不情愿给予或嫉妒的心态，但原文形象具体，且含义不必限定为其中一种。正文保留形象，脚注辅助普通读者理解。
- issue: 希伯来文本与所供希腊平行文本严重不一致
  choice: 以现存希伯来文本为正文依据，并在脚注中说明差异
  alternative: 依希腊文译作“敬畏主之人的灵必存活”
  rationale: 本项目在《便西拉智训》希伯来文存世处优先采用希伯来文；此处希腊平行句与希伯来文完全不对应，可能源于文本编排或节号错位，不宜据此替换正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“给他这些就够了”使省略成分在汉语中自然可懂，同时不具体指定食物或份量；“恶眼是恶的”刻意保留希伯来原文简短、有重复的警句形式。
