translation:
  language: zh_hans
  text: 健全的肠胃使人长寿；清晨起来，生命仍与他同在。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所存希腊文本在此处是一句不同的话：“穷人所需的食物是他们的生命；剥夺这种食物的人是流人血的人。”这可能反映不同的文本传统或章节编号对应。
    reason: 所给希腊平行文本与希伯来正文完全不同，须向读者说明这一重要文本差异；同时修正原脚注对希腊文的转述。
lexical_decisions:
- source_word: קרב
  choice: 肠胃
  rationale: 此处指人体内部、腹中脏腑；结合寿命与清晨起身的语境，译作现代汉语“肠胃”比泛称“内脏”更自然。
- source_word: תולל
  choice: 健全的
  rationale: 该词形与含义不够明确；依希伯来句意及英译审校层所保留的“sound”，采用“健全的”，但不扩展为更具体的医学判断。
- source_word: שנות חיים
  choice: 使人长寿
  rationale: 原文直译近于“生命的年岁”；汉语用动词结构“使人长寿”自然表达寿年得以延长的意思。
- source_word: ונפשו אתו
  choice: 生命仍与他同在
  rationale: נפש在此可指生命、性命或生命力；保留原文“与他同在”的独特表达，不擅自释为单纯“精神很好”。
theological_decisions:
- issue: 希伯来文本与所列希腊平行文本严重不一致
  choice: 正文依据高置信度的希伯来文本翻译，并以脚注提示异文
  alternative: 以希腊文“穷人的生命在于所需的食物……”取代正文
  rationale: 任务指定优先依据原文证据，且希伯来文本完整可译；希腊句子内容完全不同，很可能反映文本或编号传统差异，不宜混合或静默调和。
translation_notes:
  register: 采用简洁、庄重而现代的箴言体。“肠胃”通俗明确；后半句保留“生命仍与他同在”的希伯来意象与含蓄张力。
