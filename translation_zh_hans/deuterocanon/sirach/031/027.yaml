translation:
  language: zh_hans
  text: '[如果他们强劝你吃[a]，就离开宴席，]你便会得享安宁。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文作：“[如果他们强劝你吃，就离开宴席，]你便会得享安宁。”这里所列的希腊文平行文本却作：“克扣雇工工资的，就是流人血的。”两者严重不符，可能反映不同的文本传统或节号编排。
    reason: textual_variant
lexical_decisions:
- source_word: ואם יפצירו בך
  choice: 如果他们硬要你
  rationale: ואם引出条件；יפצירו בך表示他人执意催逼或坚持要求。“硬要你”以自然现代汉语保留了宴席场合中的强迫性压力。
- source_word: לאכול
  choice: 吃
  rationale: אכל的不定式意为“吃”；汉语在“硬要你”之后直接用“吃”最自然，不增添原文没有的“赴宴”等含义。
- source_word: סור מן הסבה
  choice: 就离开宴席
  rationale: סור是“离开、退去”的命令式；הסבה指席间斜倚用餐的场合或同席群体。“宴席”清楚传达社交用餐场景，又避免生硬直译为“斜倚”。“就”自然呈现条件句的后件。
- source_word: ותמצא נחת
  choice: 你便会得到安宁
  rationale: מצא נחת可指得到安歇、舒缓或安宁。“得到安宁”既表达脱离催逼后的平静，也不把含义缩窄为身体休息。
theological_decisions:
- issue: 现存希伯来文括号内语句与希腊文平行文本严重不符
  choice: 正文依现存希伯来文翻译，并以方括号保留其文本状态，以脚注说明希腊文差异。
  alternative: 按所给希腊文译为：“克扣雇工工资的，就是流人血的。”
  rationale: 本项目在《便西拉智训》希伯来文尚存时以希伯来文证据为先；但希腊文并非近似异文，而是完全不同的句子，可能反映不同文本传统或节号错位，因此必须明确记录，不能暗中调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“硬要你吃”保留社交压力，“宴席”传达古代斜倚进餐的场景而不作生硬直译。正文沿用来源中的方括号，以诚实呈现该段希伯来文本的特殊状态；脚注标记[a]已置于相关语句中。
