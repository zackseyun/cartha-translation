  text: Know that your neighbor is a man like yourself[b][a], and eat what is set before you.
translation:
  language: zh_hans
  text: 要知道，你的邻舍是像你一样的人[a][b]；吃摆在你面前的东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “像你一样的人”：希伯来文直译为“像你一样的男人”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文见证在此有显著不同的读法：“振奋心灵，使眼目明亮，赐予医治、生命和福分。”希伯来文与希腊文似乎保存了本节的不同文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: דע
  choice: 要知道
  rationale: ידע的祈使式。译作“要知道”既直接保留劝诫语气，也符合现代汉语表达。
- source_word: רעך
  choice: 你的邻舍
  rationale: רֵעַ可指朋友、同伴或邻舍；此处强调席间与自己相对的他人，“邻舍”较能保留其伦理和人际含义。
- source_word: איש כמוך
  choice: 也是和你一样的人
  rationale: 原文直译为“像你一样的男人”。在现代汉语中，“人”可自然表达此处普遍适用的格言含义；“也是”凸显对方与你同为人的比较关系，但不增添实质内容。字面性别表达收入脚注。
- source_word: ואכול
  choice: 要吃
  rationale: 保留祈使语气。希伯来语以ו连接两个命令；中文以分号并列，比生硬译作“并且吃”更自然，且不额外加入因果关系。
- source_word: דבר
  choice: 食物
  rationale: דבר字面为“事物、东西”，但在“摆在你面前”这一进餐语境中所指为供人食用之物；译作“食物”清楚自然。
- source_word: ששם לפניך
  choice: 摆在你面前的
  rationale: 该短语指被放置在面前之物；“摆在你面前”符合现代汉语的席间用语，并保留原文的被摆放意象。
theological_decisions:
- issue: איש כמוך的性别表达
  choice: 正文译作“和你一样的人”，脚注注明字面为“像你一样的男人”
  alternative: 正文译作“像你一样的男人”
  rationale: 希伯来语איש是阳性单数，但此句为普遍适用的席间伦理劝诫。现代汉语“人”能自然涵盖该语义，同时脚注保留原文字面性别形式，避免掩盖源文证据。
- issue: 希伯来文与希腊文见证的重大差异
  choice: 正文依现存希伯来文翻译，并在脚注列出希腊文异读
  alternative: 依希腊文译作“使心灵振奋，使眼睛明亮，赐下医治、生命和福分”
  rationale: 本节有高可信度的希伯来文见证，故以之为正文依据；希腊文并非细微措辞差异，而保存了内容显著不同的经文形态，不应与希伯来文调和，须以脚注明示。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。两个祈使句以分号连接，既反映希伯来文的并列结构，又避免不自然的逐字翻译。正文中的脚注标记按内容出现次序排列。
