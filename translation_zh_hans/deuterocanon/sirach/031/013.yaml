translation:
  language: zh_hans
  text: 我儿，你若坐在丰盛的筵席前[a]，不可贪食[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丰盛的筵席”所译的希伯来语可直译为“大桌席”；“大”可能指规模、丰盛程度或社会地位，原文未明确限定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面是“不要在它上面张开你的喉咙”，是警告人在丰盛筵席前不可贪食的形象说法。
    reason: idiom
lexical_decisions:
- source_word: בני
  choice: 我儿
  rationale: 保留带第一人称单数后缀的呼格，以及智慧文学中长者教诲晚辈的语气。
- source_word: אם
  choice: 若
  rationale: 忠实表达条件含义，同时符合庄重而自然的汉语训诫文体。
- source_word: על שלחן גדול
  choice: 坐在盛筵前
  rationale: “盛筵”自然传达גדול在此可能包含的丰盛、显贵或隆重意味，而不把它局限为桌子的物理尺寸；“前”则符合汉语中赴席就座的表达。
- source_word: ישבת
  choice: 坐在
  rationale: 虽为完成式，在条件训诫句中表达一般情形，汉语用现在性的“坐在”最自然。
- source_word: אל תפתח
  choice: 不要……大张
  rationale: 保留禁止语气及“张开”的具体形象；加入“大”使“张开喉咙”这一希伯来语夸张意象在汉语中较为可解。
- source_word: גרנך
  choice: 喉咙
  rationale: 按字面保留גרון“喉咙”的鲜明意象，不直接释为“胃口”或“贪欲”，其贪食含义由脚注说明。
