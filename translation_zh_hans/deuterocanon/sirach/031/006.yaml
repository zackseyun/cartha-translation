base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/006.yaml
  text: Many have been ruined by gold[a], and by trusting in pearls; they did not find escape from evil[b], nor deliverance on the day of wrath.
translation:
  language: zh_hans
  text: 许多人被金子所害；倚靠珍珠[a]的人也同样受害。他们未能逃脱祸患，在震怒之日也未能蒙拯救。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “珍珠”所译的希伯来词也可泛指贵重的宝石或珍宝。
    reason: lexical_alternative
  - marker: b
    text: 希腊文见证在这里有重大差异：“除非这些事物是在鉴察之时由至高者差遣的，不要把你的心交给它们。”本译文正文依照现存希伯来文；希伯来文警告人，倚靠财富不能使人逃脱祸患，也不能使人在震怒之日蒙拯救。
    reason: textual_variant
lexical_decisions:
- source_word: חבולי
  choice: 受了重创
  rationale: 该词本义可指受伤、受损，也可引申为败坏或陷入毁灭。这里以“受了重创”保留受伤意象，同时自然表达财富给人带来的严重损害，不把结果过度限定为彻底败亡。
- source_word: זהב
  choice: 金子
  rationale: 直接对应原文，且在语境中代表贵重财富。
- source_word: הבוטח על
  choice: 信靠……的人
  rationale: 保留希伯来文由复数陈述转为单数分词结构的特点。“也不例外”补足汉语句法所需的联系，但不消除原文所表达的警告：依赖财宝的人同样遭害。
- source_word: פנינים
  choice: 珍珠
  rationale: “珍珠”是常见且可辩护的译法；该词也可能泛指珊瑚、宝石或珍宝，因此用脚注保留词义范围。
- source_word: להנצל מרעה
  choice: 逃脱祸患
  rationale: להנצל表示逃脱、获救；רעה既可指邪恶，也可指灾祸或祸患。此处“祸患”与财富不能在危难和审判中救人这一语境较为贴合，同时仍保留宽泛含义。
- source_word: להושע
  choice: 得救
  rationale: 该动词表示蒙拯救、获救；“得救”在现代汉语中简洁自然，且在“震怒之日”的审判语境中保持其严肃分量。
- source_word: ביום עברה
  choice: 在震怒之日
  rationale: עברה指强烈的愤怒或烈怒，常带审判色彩。“震怒之日”既庄重，又保留这一表达的神学张力。
theological_decisions:
- issue: 希伯来文与希腊文见证存在重大差异时的底本选择
  choice: 正文依照现存希伯来文翻译，并以脚注完整说明希腊文异读。
  alternative: 依希腊文译作：“除非它是在鉴察时由至高者差来的，否则不要把你的心交给它们。”
  rationale: 本节希伯来文完整可用，故以希伯来文为正文依据；但希腊文内容并非细微措辞差别，而是实质不同的句子，必须明确保存为文本异读，不能暗中调和。
- issue: 财富与末日拯救的关系
  choice: 保留希伯来文关于金子和珍宝不能使人逃脱祸患、也不能在震怒之日施行拯救的警告。
  alternative: 将本句仅理解为一般性的理财劝诫，不涉及审判。
  rationale: “震怒之日”明确带有审判意味；译文应保留财富失去救助能力与审判临到之间的张力，而不附加特定宗派的末世体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“受了重创”保留希伯来文的受伤意象；“也不例外”使原文复数转单数的突兀句法在汉语中可读，同时未把它改写成新的因果关系。脚注标记均已置于正文。
