translation:
  language: zh_hans
  text: 富人劳碌，为要积聚财富；他若歇息，就得享逸乐[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逸乐”也可译作“愉悦”或“享受”；原文较直译为“获得享乐”。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希腊文平行文本与本节希伯来文的措辞和内容并不对应。因此本译文以希伯来文见证为准；这也显示此处的文本传承存在不稳定性。
    reason: textual_variant
lexical_decisions:
- source_word: עמלי
  choice: 劳碌
  rationale: 源自动词词根 עמל，表示辛劳、劳作；“劳碌”既保留辛苦工作的意味，也符合智慧文学的庄重语体。
- source_word: עשיר
  choice: 富人
  rationale: 希伯来文为阳性单数，指一个富有的人；现代汉语用“富人”自然简洁，无须额外补出性别。
- source_word: לקבץ הון
  choice: 为要积聚财富
  rationale: לקבץ 是“聚集、收集”，הון 是“财富、资财”；“积聚财富”准确表达持续累积财物的意思。“为要”显明不定式所表达的目的。
- source_word: ואם ינוח
  choice: 他若歇息
  rationale: אם 的基本义为“若、如果”，虽在语境中也可近似“当……时”；采用“若”保留原文条件意味，不将其无声改成确定的时间关系。ינוח 直译为“歇息”。
- source_word: לקבל תענוג
  choice: 就得享逸乐
  rationale: לקבל 字面为“接受、获得”，תענוג 可指享乐、愉悦或奢适的享受。“得享逸乐”兼顾“获得”与“享受”两层意义，又不把所享之物过度具体化为奢侈品。
