  source_fidelity: 译文准确对应希伯来文：富人“劳碌”以“积聚财富”，在“歇息”时“得享逸乐”。“为要”恰当地表达לקבץ的不定式目的；“他若歇息，就”保留了אם可作条件、亦可在语境中理解为“当……时”的开放性。未受所列不对应的希腊文平行文本影响。
