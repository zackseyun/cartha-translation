base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/026.yaml
  text: Years of life are with a discerning man[a]; he will lie down until morning[b], and his life is with him.
translation:
  language: zh_hans
  text: 明达的人享有生命的年日；他过夜直到清晨，性命[a]仍与他同在。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”所译的希伯来词也可指“生命”“自己”或“灵魂”；这里结合上下文译为“性命”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本在此与希伯来文本差异很大，意为：“夺去邻舍生计的，就是杀害他。”这似乎反映了不同的文本形态；正文依照现存希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: שנות חיים
  choice: 生命的年岁
  rationale: 保留希伯来语“生命之年”的结构，不径自解释为“长寿”，以免把含蓄的延年之意强化为明确应许。
- source_word: איש נבון
  choice: 明达的人
  rationale: נבון侧重理解力、辨识力和明察；“明达”既贴近原义，也比“聪明”更庄重，并避免把它泛化为一般的“智慧”。
- source_word: ילין עד בקר
  choice: 他必过夜直到清晨
  rationale: ילין指住宿、过夜；此译明确保留夜间停留的意象，同时符合现代汉语表达。
- source_word: ונפשו עמו
  choice: 性命仍与他同在
  rationale: נפש在这里可指生命、自身或魂。结合前文“生命的年岁”和安然度过一夜的语境，“性命”最能表达生命得以保存；加“仍”使汉语自然，但不改变持续存活的含义。
- source_word: φονεύων τὸν πλησίον ὁ ἀφαιρούμενος συμβίωσιν
  choice: 仅作为显示重大异文的对照见证，不用于正文
  rationale: 所给希腊文本与现存希伯来文本内容显著不同，近于“夺去邻舍生计的，就是杀害他”。依本项目原则，希伯来文本现存时以其为正文，并在脚注保存希腊异文。
theological_decisions:
- issue: נפש所涉及的人论含义
  choice: 译作“性命”，表达生命仍得保存
  alternative: 译作“灵魂”或“自己”
  rationale: נפש的语义范围大于汉语神学术语“灵魂”。本句更自然地谈论活命或完整地存留，不宜借翻译引入灵魂与身体二分的教义判断。
- issue: 希伯来文本与希腊文本的重大分歧
  choice: 正文依据现存希伯来见证
  alternative: 采用希腊文“夺去邻舍生计的，就是杀害他”一类读法
  rationale: 希伯来原文在此有高可信度见证，而希腊平行文本似反映另一文本形态；因此以希伯来文为正文，同时在脚注完整说明分歧。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“生命的年岁”有意保留原文略显凝练的表达和前后“生命／性命”的呼应；分号呈现两小句的并列关系，不补入原文未明说的因果关系。
