  yaml_path: translation/deuterocanon/sirach/031/018.yaml
  text: Know your neighbor as yourself[a], and in everything you hate[c][b], be considerate.
translation:
  language: zh_hans
  text: 要像认识自己一样认识你的邻舍[a][b]；凡是你所厌恶的，都要仔细思量[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本与这里的希伯来文差异很大，大意是：“他留意谁呢？谁是他的支撑呢？”本译文在此依据现存的希伯来文。
    reason: textual_variant
  - marker: b
    text: “自己”所译的希伯来词נפש，也可指“生命”或“本人”；本句可较直译为：“要认识你的邻舍，如同你自己（或你的生命）。”
    reason: lexical_alternative
  - marker: c
    text: 末句也可理解为：“你所厌恶的任何事，都要慎重考虑。”它可能以自己不愿承受之事作为伦理判断的尺度，但原文没有把这一含义完全说开。
    reason: alternative_reading
lexical_decisions:
- source_word: דעה
  choice: 要认识
  rationale: 这是ידע的命令式，表示认识、了解或留心对待。译作“认识”贴近基本词义，也不把原文改写成更熟悉的“爱”。
- source_word: רעך
  choice: 你的邻舍
  rationale: רע指与自己有社会关系的同伴或他人。“邻舍”保留其圣经伦理语境，又不限于住处相邻的人。
- source_word: כנפשך
  choice: 如同认识你自己
  rationale: 字面是“如同你的נפש”。נפש在这里可指生命、本人或自我；中文以“你自己”自然表达这种比较。为使句意通顺，重复了原文隐含的“认识”。
- source_word: ובכל ששנאת
  choice: 凡是你所厌恶的
  rationale: 保留原文以受话者自身的厌恶为伦理反思起点；“凡是”自然表达בכל的广泛范围。
- source_word: התבונן
  choice: 都要仔细思量
  rationale: התבונן是要求审慎观察、辨明和反思的命令式。“仔细思量”保留其深思熟虑的意味，不将其缩减为一般性的礼貌或体贴。
- source_word: τίνι ἐπέχει; καὶ τίς ἀντιστήριγμα αὐτοῦ;
  choice: 仅作为校勘参照，不用于正文
  rationale: 希腊平行文本与现存希伯来文差异显著，可能反映不同文本形态或节次对应。此处既有可靠的希伯来文见证，正文优先依据希伯来文，并在脚注说明差异。
theological_decisions:
- issue: 本句与“爱邻舍如同自己”这一熟知表述的关系
  choice: 保留希伯来文“认识你的邻舍”的措辞
  alternative: 爱你的邻舍，如同爱自己
  rationale: 希伯来文使用ידע（认识、了解），并未使用明确表示“爱”的词。译文不与其他经文的熟悉措辞调和，以保存本句独特的伦理重点。
- issue: 末句所表达的伦理要求
  choice: 凡自己厌恶的事都要仔细思量
  alternative: 对一切你所厌恶的事，要顾念别人；或：不要把自己厌恶的事加给别人
  rationale: 原文只明确命令受话者对自己所厌恶的事进行反思，并未明说反思后的具体行动。正文保存这种简练与开放性，不把可能隐含的互惠伦理直接补入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“邻舍”保留圣经语体及伦理含义；“仔细思量”比口语化的“想一想”更能体现התבונן所含的审慎反思。标点用分号呈现两个彼此关联的命令。
