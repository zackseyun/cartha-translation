  text: Be the first to stop[a], for the sake of good manners, and do not be a glutton[b], lest you be despised.
translation:
  language: zh_hans
  text: 为显得体[a]，要先停止进食；不要贪食，免得遭人嫌弃[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得体”所译的希伯来语常指“管教”或“训诲”；在这里的宴席语境中，侧重由自制表现出来的合宜举止。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希伯来文本完整，但资料标注其来源存在重大不匹配；随附的希腊文平行文本并不对应本句。因此正文以希伯来见证为准，并在此注明这一不一致。
    reason: textual_variant
lexical_decisions:
- source_word: חדל ראשון
  choice: 先停下不吃
  rationale: חדל是停止的命令式；ראשון表示先于别人。结合宴席语境，明确补出“不吃”，比单说“停下”更自然。
- source_word: בעבור מוסר
  choice: 因修养
  rationale: מוסר通常可指管教、训诲或修养；在席间礼仪的语境中，指受教而有的自制与得体行为。“修养”既自然，也保留其伦理含义。
- source_word: גרגרן
  choice: 贪食
  rationale: 该词指贪婪、无节制地进食。译作“贪食”简洁而带有劝诫意味。
- source_word: פן תמאס
  choice: 免得惹人厌恶
  rationale: פן引出应避免的后果；מאס含拒绝、鄙弃、厌恶之意。此处用主动使役式汉语自然表达因贪食而招致他人反感。
