  text: Listen, my son, and do not despise me; in the end you will grasp my words.
translation:
  language: zh_hans
  text: 我儿，要听，不可轻看我；到最后，你必领会我的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所附的希腊文平行文本是一则完全不同的训言：“从死人沾染中洗净的人，若又去触摸死人，他的洗濯有什么益处呢？”这似乎反映节次对应或文本传统上的重大差异；正文依据现存的希伯来文见证。
    reason: textual_variant
lexical_decisions:
- source_word: שמע
  choice: 要听
  rationale: 祈使式在此是呼吁专心听取；译作“要听”自然直接，又不把含义过度收窄为“顺服”。
- source_word: בני
  choice: 我儿
  rationale: 原文为阳性单数呼格；“我儿”准确保留称呼和劝诫语气。
- source_word: תבוז
  choice: 轻看
  rationale: בזה 表示轻蔑、鄙视；“轻看”在现代中文中庄重自然，也适合智慧训诲的语境。
- source_word: ובאחרית
  choice: 到最后
  rationale: 保留 אחרית 所表达的最终时刻或结果，不预先限定为今生某个特定阶段。
- source_word: תשיג
  choice: 领会
  rationale: נשׂג 本有达到、取得之意，与“我的话”搭配时指最终把握其意义；“领会”在中文中自然，同时保留逐渐达到理解的意味。
- source_word: אמרי
  choice: 我的话
  rationale: אמרים 指言语或训言；“我的话”简洁、准确且符合现代汉语表达。
theological_decisions:
- issue: 希伯来文主体见证与希腊文平行文本完全不同
  choice: 正文依据现存的希伯来文《便西拉智训》文本翻译，并以脚注说明希腊文异文。
  alternative: 依希腊文译作：“从死人沾染中洗净的人，若又去触摸死人，他的洗濯有什么益处呢？”
  rationale: 本节已有高可信度的希伯来文见证，应以其为正文依据。所给希腊文不是细微异文，而是另一则完全不同的训言，可能源于节次对应或文本传统的重大差异；因此不应将两者调和。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“我儿，要听”保留师长直接劝诫的口吻；分号呈现命令与最终结果之间的推进关系。脚注标记置于整节末尾，清楚表明它涉及全节的文本差异。
