  text: For because of every matter the eye trembles[a], and from the face tears will flow.
translation:
  language: zh_hans
  text: 因为每一件事，眼睛都会颤动[a]；泪水从脸上流下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本在这里与希腊传统大不相同。希腊文作：“敬畏主的人绝不会畏缩，也绝不会胆怯，因为主是他的盼望。”正文依从现存的希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: כי זה
  choice: 正因如此
  rationale: 希伯来文开头简略而不寻常；译作“正因如此”保留其承接并说明缘由的作用，同时避免用生硬的重复因果结构过度模拟原文。
- source_word: מפני כל דבר
  choice: 因每一件事
  rationale: מפני可表示“由于”或“在……面前”，דבר也可指事、事情或话语。此处采用范围较宽的“每一件事”，但不把它限缩为言语。
- source_word: תזוע עין
  choice: 眼睛会……颤动
  rationale: זוע表示震动、颤抖；保留原文单数“眼睛”的具体身体意象，不抽象改写为害怕或不安。
- source_word: ומפנים
  choice: 也会从脸上
  rationale: פנים直指“脸、面容”。尽管中文常说泪从眼中流出，译文仍保留原文“从脸上”的图像。
- source_word: דמעה תדמע
  choice: 泪水……流下
  rationale: 原文以同根或紧密相联的名词—动词表达加强泪流之意；“泪水流下”在现代中文中自然，也保留可见的动作。
theological_decisions:
- issue: 现存希伯来文本与希腊传统显著分歧
  choice: 正文以现存希伯来文为准，并在脚注完整说明希腊异文。
  alternative: 按希腊文译作：“敬畏主的人绝不会畏缩，也绝不会胆怯，因为主是他的盼望。”
  rationale: 本项目在《便西拉智训》的希伯来文存世处优先依据希伯来文本。此处两种传统无法视为同一句话的普通译法差异，因此不加调和，而以脚注诚实保存希腊见证。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留“眼睛颤动”和“泪水从脸上流下”的具体意象；对晦涩的开头作最低限度的自然化处理，不用希腊异文来修正或调和希伯来正文。
