  text: Like one who grasps at a shadow and pursues the wind, so is one who clings to dreams.
translation:
  language: zh_hans
  text: 像伸手抓影子、追逐风的人一样，执着于梦的人也是如此。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 卡哈纳本在此编号所列的现存希伯来文与希腊文差异很大，其中相应标为（ב）的一行可译作：“忠信的恶人会挑起羞辱；保守秘密的人如同自己的性命一般，是朋友。”所给希伯来文材料中还有：“为生计忧虑扰乱睡眠，重病也扰乱睡眠。”由于这些内容与希腊文本节并不对应，正文按希腊文翻译。
    reason: textual_variant
  - marker: b
    text: “执着于梦”也可译作“留意梦境”或“紧抓住梦不放”。
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: 伸手抓
  rationale: 表达试图抓住某物的动作；加上“伸手”使现代汉语自然，同时保留抓取虚影的徒劳感。
- source_word: σκιᾶς
  choice: 影子
  rationale: 直译其通常含义，并保留不可捉摸、虚无的意象。
- source_word: διώκων
  choice: 追逐
  rationale: 保留持续追赶的主动意味，文体简洁庄重。
- source_word: ἄνεμον
  choice: 风
  rationale: 保留原文追逐无形之物的比喻。
- source_word: ὁ ἐπέχων
  choice: 执着于
  rationale: 该词可表示留意、专注或持守；在本句徒劳的比喻中，“执着于”自然地呈现紧抓不放的意味，但不排除“留意”的可能。
- source_word: ἐνυπνίοις
  choice: 梦
  rationale: 简明表达睡梦或梦中景象，不作不必要的具体化。
theological_decisions:
- issue: 希伯来文与希腊文见证在本节编号处严重不一致
  choice: 正文依据希腊文，翻译抓影子、追逐风并执着于梦的比喻
  alternative: 卡哈纳所列现存希伯来文在此处为：“忠信的恶人会挑起羞辱；保守秘密的人如同自己的性命一般，是朋友。”另有紧邻材料为：“为生计忧虑扰乱睡眠，重病也扰乱睡眠。”
  rationale: 所给希伯来文材料与希腊文《德训篇》31:2不对应，可能涉及经节错位、复合抄本排列或不同文本传统。为与本参考编号对应，正文采用保存该节完整内容的希腊文，同时用注释诚实说明希伯来文差异，不将两者强行调和。
translation_notes:
  register: 采用现代、自然而庄重的普通话。保留原文“抓影子—追逐风”的平行意象，并以“也是如此”对应希腊文的明示比较结构。两个脚注标记均置于正文中。
