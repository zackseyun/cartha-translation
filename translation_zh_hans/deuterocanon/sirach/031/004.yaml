  text: A poor man labors until his strength is spent, and if he rests, he is still in need.
translation:
  language: zh_hans
  text: 穷人劳碌，耗尽自己的力气；即使歇息，也不得安歇。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 同一希伯来复合版本另有异文：“穷人劳碌，以致家中匮乏；他若歇息，就会陷入贫困。”
    reason: 记录开头所列的平行希伯来表述，避免将两种读法无标识地合并。
  - marker: b
    text: 现存希腊文本在此节为：“从不洁净之物，什么能洁净？从虚假之物，什么能真实？”与希伯来文本完全不同，可能反映章节编号或文本传承上的错位。
    reason: 所给希腊平行文本与希伯来文存在重大不一致，需向读者公开说明。
lexical_decisions:
- source_word: עמל עני
  choice: 穷人劳碌
  rationale: עמל表示辛苦劳作；用“劳碌”既贴近原文，也符合本节庄重而自然的语体。
- source_word: לחסר כחו
  choice: 耗尽自己的力气
  rationale: 字面为“使他的力量缺少”；按语境译作“耗尽自己的力气”，清楚表达劳作使体力衰竭。
- source_word: ואם ינוח לא נחה לו
  choice: 即使歇息，也不得安歇
  rationale: 保留希伯来文נוח／נחה的重复和张力。后半句主语并未明说，因此不擅自补成“贫困”；“不得安歇”可自然传达即便停工，困境仍不容他安息。
theological_decisions:
- issue: 后半句是否明确补出“仍然贫困”
  choice: 不补出隐含主语，译为“也不得安歇”
  alternative: “他仍然贫困”或“贫困仍不放过他”
  rationale: 现存希伯来文只说“它/她不为他歇息”，所指可能是贫困、劳苦或困境；保留这种省略，避免把一种解释写入正文。
- issue: 互异文本的处理
  choice: 以标有段落记号（ד）的希伯来文本为正文，并用脚注列出同一复合版本中的异文
  alternative: 把两种希伯来表述合并为一句
  rationale: 两行在“家中匮乏/力气耗尽”和“将会缺乏/不得安歇”上有实质差异；不应静默混合。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“劳碌—耗尽—歇息—安歇”的节奏保留原文的沉重感与动词复沓；正文不依赖英文咨询层所作的解释性补足。
