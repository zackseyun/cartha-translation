base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/011.yaml
  text: Who was tested by it and was found complete? Let it be for him a boast[a]. Who was able to transgress and did not transgress[b], and to do evil and did not desire it?
translation:
  language: zh_hans
  text: 谁经受考验而被证实为纯全？这可成为他的荣耀[a]。谁能偏离却没有偏离，能作恶却不愿意作恶[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本行的希伯来文本疑难。按传存字句，也可较直译为：“谁祝福了他，他一生便完全。”但上下文支持“经受考验而被证实为纯全”的理解。所给希腊平行文本则为：“走迷的人必增多诡诈。”
    reason: textual_variant
  - marker: b
    text: “偏离”也可译作“犯罪”；“不愿意作恶”也可译作“不肯去害人”或“不愿作恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מי ברכו וישלם בחייו
  choice: 谁经受了考验，仍显为完全
  rationale: 传存的希伯来文本在此十分困难。结合上下文关于财富考验人的主题，将首句理解为人在考验中显出完整；“完全”保留 שלם 所表达的完整、无亏的道德含义。
- source_word: הוא לך לתפארת
  choice: 这可成为他的荣耀
  rationale: 原文代词和介词关系不稳；译文保留“荣耀、称誉”的核心意思，同时避免把疑难的 לך 强行解释为“给你”。
- source_word: יוכל לסור ולא סר
  choice: 本能偏离，却没有偏离
  rationale: סור 的基本义是“转离、偏离”。这里具有伦理意味，但直译为“偏离”可同时保留行为方向和道德含义，不把它限定为某一种律法术语。
- source_word: ולהרע רעה ולא אבה
  choice: 本能作恶，却不肯作恶
  rationale: להרע רעה 是同根结构，表示施行恶事；אבה 主要表示愿意、肯，因此译作“不肯”，强调面对机会时意志上的拒绝。
theological_decisions:
- issue: 希伯来首行文本困难，且与所给希腊平行文本明显不合
  choice: 正文主要依照希伯来语的修复性语境理解，译为经受考验而显为完全，并以脚注说明字面读法
  alternative: 按传存辅音较直译为“谁祝福了他，他一生便完全”；或主要依希腊文译为“走迷的人必增多诡诈”
  rationale: 现存希伯来见证应优先，但其首行显然存在文本困难。正文采用与本章财富考验主题相符的理解，不以关系不明的希腊平行句替换希伯来结构，并公开保留异读。
- issue: סור 的伦理强度
  choice: 译作“偏离”
  alternative: 译作“犯罪”或“违犯”
  rationale: “偏离”更贴近词的基本形象，也保留究竟是偏离正道、道德越轨还是具体违犯的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。两组“本能……却……”保持希伯来文反复设问的节奏；首行因文本不稳而采用克制的意译，并用脚注完整披露主要异读。
