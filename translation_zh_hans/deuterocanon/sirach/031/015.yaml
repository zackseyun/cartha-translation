translation:
  language: zh_hans
  text: 恶眼之人[a]恨上帝；上帝没有造出比他更坏的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶眼”是希伯来语习语，指吝啬、嫉妒，或见不得别人得好处的人。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本在这里差异很大，作：“因为他们的盼望在于那拯救他们的。”这似乎反映了另一种文本形态。
    reason: textual_variant
lexical_decisions:
- source_word: רע עין
  choice: 恶眼之人
  rationale: 希伯来语字面为“眼恶／恶眼”，是指吝啬、嫉妒或见不得别人得好处之人的习语。正文保留其具体意象，同时补出“之人”，使现代汉语句法自然；脚注说明其习语含义。
- source_word: שונא
  choice: 恨
  rationale: 该分词通常意为“恨”。按现存希伯来语的自然句法，以“恶眼之人”为主语、以上帝为宾语。
- source_word: אל
  choice: 上帝
  rationale: 此处 אֵל 是对神的称呼，译作“上帝”清楚而庄重。
- source_word: ורע ממנו לא ברא
  choice: 上帝没有造出比他更坏的
  rationale: 原文极简，ברא 是“创造”，未明说主语；从紧邻的“上帝”推知其为隐含主语。“他”可回指被拟人化的“恶眼之人”，同时保留原句比较对象的简约表达。
theological_decisions:
- issue: 第一分句的主宾关系，以及它与希腊文本重大差异的处理
  choice: 以现存希伯来语为正文，译作“恶眼之人恨上帝”
  alternative: 希腊文本作“因为他们仰望那拯救他们的”，是完全不同的一句
  rationale: 本节有可靠的希伯来语见证，应优先据此翻译。希腊文并非可由细微词义差异解释的对应译文，而代表显著不同的文本形态，因此在脚注中如实注明，不以其取代希伯来正文。
- issue: 第二分句中 ברא 的隐含主语
  choice: 将“上帝”作为创造者，并在中文中明说
  alternative: 采用被动式：“没有什么比他更坏的受造物”
  rationale: 希伯来语允许承接前句的“上帝”作为隐含主语；中文若完全省略会不自然。明说“上帝”呈现最可能的句法关系，但不扩展为额外的教义判断。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“恶眼之人”刻意保存希伯来语的具体意象，并借脚注解释；分号呈现两分句紧密的判断关系。所有脚注标记均已置入正文。
