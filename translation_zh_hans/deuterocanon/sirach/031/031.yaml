  text: Listen, my son, and accept my words; do not reject me, and in the end you will find my words.
translation:
  language: zh_hans
  text: 我儿，要听，也要接受我的话；不要讥诮我；到后来，你会发现我所说的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在此处的内容不同，大意为：“一个人为自己的罪禁食，却又去做同样的事；谁会垂听他的祷告？他谦卑自己又有什么益处呢？”
    reason: 提示读者本节希伯来传统与希腊传统之间存在重大文本或编号差异，避免把两者误认为同一句的普通译法差别。
lexical_decisions:
- source_word: שמע
  choice: 要听
  rationale: 保留祈使语气，表达留心听从的要求，同时避免把“听”直接解释为“顺服”。
- source_word: וקח אמרי
  choice: 也要接受我的话
  rationale: לקח的基本义为“拿、取”，在此与“话”搭配，意为接受或采纳；译作“接受”符合现代汉语。
- source_word: תלעיז עליי
  choice: 诋毁我
  rationale: לעז可指毁谤、说坏话或嘲弄；“诋毁”较贴近该词针对说话者的敌意言语，比“拒绝我”更符合希伯来语词义。
- source_word: ובאחרית תמצא דברי
  choice: 最终你会发现我的话
  rationale: 直译保留“最终”和“发现”以及宾语“我的话”，不擅自补成“发现我的话真实”或“明白我的话”，从而保留原文略显含蓄的意义。
theological_decisions:
- issue: “最终发现我的话”所指为何
  choice: 不补明所发现的是话语的真实性、益处还是应验
  alternative: “最终你会发现我的话所言不虚”
  rationale: 希伯来文本仅说“发现我的话”，补入“所言不虚”虽较顺畅，却会消除原文的开放性。
- issue: 希伯来文本与希腊平行文本存在重大差异
  choice: 正文依高可信度的希伯来文本翻译，并以脚注说明希腊传统的不同内容
  alternative: 按希腊文本翻译有关禁食、重复犯罪和祷告不蒙垂听的句子
  rationale: 本条指定的主要原文证据是卡哈纳整理的希伯来文本；希腊文在此显然代表不同的编排或文本对应，不宜混入正文。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语气。“我儿”保留智慧文学中长者教导晚辈的称呼；分句结构尽量贴近希伯来诗句。末句有意保留原文的含蓄和轻微陌生感。
