  text: In all your deeds be modest[a], and no disaster will touch you.
translation:
  language: zh_hans
  text: 你无论做什么，都要谦逊[a]；这样，灾祸就不会临到你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里有显著不同的读法：“一个建造，另一个拆毁；他们除了劳苦，还得了什么呢？”本节依据现存希伯来文本翻译；希伯来文本与希腊传统差异很大。
    reason: textual_variant
lexical_decisions:
- source_word: בכל מעשיך
  choice: 你无论做什么
  rationale: 以自然的现代汉语表达“在你一切行为中”，完整保留劝诫所涵盖的范围。
- source_word: היה
  choice: 都要
  rationale: 结合谓语形容词表达命令语气；“都要谦逊”在汉语中简洁自然。
- source_word: צנוע
  choice: 谦逊
  rationale: 该词可指谦逊、端庄、克制；此处“谦逊”既保留品格和行为层面的含义，也不额外限定为某一种具体礼仪。
- source_word: וכל אסון לא
  choice: 灾祸就不会
  rationale: 希伯来语字面结构近于“任何灾祸都不”；汉语以“灾祸就不会”自然表达否定结果，并保留前后句的关联。
- source_word: יגע בך
  choice: 临到你
  rationale: נגע可指触及、达到或袭击；“临到你”符合汉语灾祸搭配，同时保留灾祸到达人身的意象。
- source_word: εἷς οἰκοδομῶν καὶ εἷς καθαιρῶν, τί ὠφέλησαν πλεῖον ἢ κόπους;
  choice: 仅在脚注中列为异文，不纳入正文
  rationale: 希腊传统与现存希伯来文本差异显著；本译以现存希伯来文为正文依据，并用脚注保存重要异文。
