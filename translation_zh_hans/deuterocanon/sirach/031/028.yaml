translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“你无论做什么”比直译“在你一切行为中”更自然；以分号连接劝诫及其结果。脚注标记紧随存在词义范围且涉及重大文本异文说明的“谦逊”之后，以符合所给标记位置。
