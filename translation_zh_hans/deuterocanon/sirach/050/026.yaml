  text: the inhabitants of Seir and Philistia[a], and the foolish nation that dwells in Shechem.
translation:
  language: zh_hans
  text: 住在西珥和非利士地的人[a]，以及住在示剑的愚顽之民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“住在撒马利亚山和非利士地的人”，而不是“住在西珥和非利士地的人”。
    reason: textual_variant
lexical_decisions:
- source_word: יוֹשְׁבֵי
  choice: 住在……的人
  rationale: 该词是ישב的复数附属形式，在此作名词用，指居住于某地的人；译法自然，并保留群体含义。
- source_word: שֵׂעִיר
  choice: 西珥
  rationale: 按希伯来文音译地名；原文此处没有“山”字，因此不增译为“西珥山”。
- source_word: וּפְלֶשֶׁת
  choice: 和非利士地
  rationale: 希伯来文所指是地域“非利士”，不是直接指“非利士人”；补出“地”符合现代汉语地名表达，也使其受前面的“住在”统摄。
- source_word: גּוֹי
  choice: 民
  rationale: גוי指一个民族或群体；在本句中译作“民”简洁庄重，并保留集体意义。
- source_word: נָבָל
  choice: 愚顽
  rationale: 该词兼有理智昏昧与道德悖谬的贬义；“愚顽”比单纯“愚蠢”更能保留其伦理色彩。
- source_word: הַדָּר
  choice: 住在
  rationale: 分词在此修饰“民”，表达持续居住的状态；现代汉语用“住在”自然清楚。
- source_word: בִּשְׁכֶם
  choice: 在示剑
  rationale: 采用该希伯来地名在中文圣经传统中的通行译名“示剑”。
theological_decisions:
- issue: 希伯来文与希腊文在首个地理名称上存在差异
  choice: 正文依现存希伯来文译作“西珥和非利士地”
  alternative: “撒马利亚山和非利士地”
  rationale: 现存希伯来文证据可信度高且已经校验，故正文以希伯来文为先；希腊文的实质性异文则在脚注中保留，不将两种读法混合。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“愚顽之民”保留原文的强烈贬义及其道德意味；句法维持两个并列对象，并让“住在”清楚统摄相应地名。
