base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/020.yaml
  text: Then he came down and lifted up his hands over all the assembly of Israel[a], to give the blessing of Yahweh with his lips[b], and to glory in the name of Yahweh.
translation:
  language: zh_hans
  text: 随后，他下来，向以色列全体会众举起双手，以嘴唇祝颂雅威[a]，并以雅威的名为荣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本此处是压缩的名词结构，直译可作：“雅威的祝福在他唇上。”希腊平行文本作“从他口中向主献上祝颂”，支持正文的理解。由于上下文是他向会众举手，这句话也可理解为“以嘴唇宣告雅威的祝福”。
    reason: 说明希伯来语省略结构，并保留祝福方向的真实歧义；正文采用希腊平行文本较直接支持的理解。
  - marker: b
    text: 或译：“并以雅威的名夸耀。”原词可表示夸耀、以……为荣或欢欣；在这里不一定含有贬义。
    reason: 保留 הִתְפָּאֵר 与希腊语 καυχᾶσθαι 的词义幅度。
lexical_decisions:
- source_word: יָרַד
  choice: 下来
  rationale: 准确表达向下移动，并自然衔接祭司礼仪结束后的动作。
- source_word: וְנָשָׂא יָדָיו
  choice: 举起双手
  rationale: 保留希伯来语中举手祝福或祷告的礼仪动作；现代汉语自然清楚。
- source_word: עַל כָּל קְהַל יִשְׂרָאֵל
  choice: 向以色列全体会众
  rationale: עַל 在此表示举手所朝向或覆及的对象；קהל 指正式聚集的群体，译作“会众”简洁而具有礼仪语境。
- source_word: וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: 以自己的嘴唇宣告雅威的赐福
  rationale: 希伯来文本是压缩的名词短语，希腊平行文本以 δοῦναι 明示目的。译文据此补出“宣告”，同时用“赐福”保留这是来自雅威的祝福这一可能含义。
- source_word: וּבְשֵׁם יְהֹוָה
  choice: 因雅威的名
  rationale: 介词短语可表示以神的名为欢欣、自豪的根据；此译法与后面的反身动词自然搭配。
- source_word: הִתְפָּאֵר
  choice: 欢欣自豪
  rationale: 该反身动词可表示夸耀、自豪或欢欣；希腊语 καυχᾶσθαι 也支持这一语义范围。“欢欣自豪”在敬拜语境中避免现代“夸口”常有的贬义，同时保留以神之名为荣的意味。
- source_word: יְהֹוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，而非以称号替代。
theological_decisions:
- issue: 如何翻译神名 יהוה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常的拟音，也保留专名性质。
- issue: 如何处理希伯来语 וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו 的省略结构
  choice: 以自己的嘴唇宣告雅威的赐福
  alternative: 雅威的赐福在他唇上
  rationale: 存留的希伯来文没有明示限定动词，既可按名词短语直译，也可依希腊平行文本的目的式 δοῦναι 理解为施行祝福。正文采用后者以形成清楚的礼仪动作，并以脚注保留希伯来文本更压缩的形式。
- issue: 祝福的方向
  choice: 雅威的赐福
  alternative: 向雅威献上祝颂
  rationale: 希伯来语属格本身可能有弹性，希腊语 εὐλογίαν Κυρίῳ 也可被理解为“给主的祝颂”。上下文中祭司向会众举手，更自然地指宣告来自雅威的祝福，但不把另一理解完全排除。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“会众”“宣告”“赐福”保留公共礼仪色彩，但避免过度古雅。正文依据希伯来文本优先，并用希腊平行文本澄清省略的动作；两处不能确定的语义均在脚注中明示。
