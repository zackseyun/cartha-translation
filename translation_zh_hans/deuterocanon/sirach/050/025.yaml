  text: With two nations my soul is disgusted[a], and the third is not a people.
translation:
  language: zh_hans
  text: 我的心厌恶两个民族；第三个不是一个民族。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作“第三个不是一个民族”；希伯来文此处用“民、人民”一词。
    reason: 说明希伯来文 עָם 与希腊文 ἔθνος 的词汇差异；主文本依从高可信度的希伯来文，同时保留希腊文平行文本的对应表达。
lexical_decisions:
- source_word: בִּשְׁנֵי גוֹיִם
  choice: 两个民族
  rationale: 介词 בּ 与厌恶类动词连用，表示厌恶所指向的对象；汉语直接用“厌恶两个民族”最自然，也不增添“因为”等解释性关系。
- source_word: קָצָה נַפְשִׁי
  choice: 我的心厌恶
  rationale: נַפְשִׁי 字面为“我的魂/生命”，在此表达人的内在感受。现代汉语以“我的心”保留诗性和内在主体，同时避免“我的灵魂感到恶心”的生硬表达；קָצָה 表示强烈厌弃，译作“厌恶”。
- source_word: וְהַשְּׁלִישִׁית
  choice: 第三个
  rationale: 希伯来语阴性序数词承接语境中省略的群体名词。汉语用“第三个”保留省略，不擅自补明具体对象。
- source_word: אִינֶנּוּ עָם
  choice: 根本算不上一个民族
  rationale: עָם 指作为共同体的“民、民族”。“算不上”自然传达对其人民身份的否定；加入“根本”体现该短句的强烈修辞锋芒，而不把它弱化为单纯分类陈述。
theological_decisions:
- issue: 是否把“我的魂”按现代汉语惯用表达处理
  choice: 译作“我的心”，保留内在主体的诗性表达
  alternative: 我厌恶；我的灵魂厌恶
  rationale: 原文 נַפְשִׁי 与希腊平行文本 ἡ ψυχή μου 都明确保留内在主体，但这里是常见的人体—情感习语，并非关于灵魂构成的教义陈述。“我的心”在现代汉语中自然、庄重，也没有引入额外的人论立场。
- issue: 末句采用希伯来文“民”还是希腊文“邦国/民族”
  choice: 以希伯来文 עָם 为准，译作“民族”
  alternative: 不是一个国家；算不上一个邦国
  rationale: 现存希伯来文本可信度高，应作为主文本依据。此处“民族”能自然表达 עָם 所指的群体共同体；希腊平行文本的 ἔθνος 另见脚注。
translation_notes:
  register: 采用现代、庄重而可诵读的书面汉语。“我的心厌恶”保留诗性，“根本算不上”传达原句尖锐的修辞否定。脚注标记已在正文中出现。
