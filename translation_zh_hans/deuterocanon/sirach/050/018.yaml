  text: And the song gave forth its voice[a], and over the multitude they set his lamp in order.
translation:
  language: zh_hans
  text: 歌声发出了声音[a]；他们在众人上方安置了他的灯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“诗歌唱者用自己的声音赞美；在满是人的殿中，曲调变得悦耳。”这表明希伯来文后半句可能存在文本困难，或出自不同的传承。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן הַשִּׁיר קוֹלוֹ
  choice: 歌声扬起了它的声音
  rationale: “נתן קול”是发声、扬声的惯用表达；译作“扬起了……声音”既保留希伯来文拟人化的说法，也符合庄重的礼仪语境。“歌声”可兼顾具体的歌与歌唱活动。
- source_word: וְעַל הֲמּוֹן
  choice: 在众人上方
  rationale: על直译为“在……上/上方”，而המון指群众、众人。此处语义虽不寻常，仍保留其空间意象，不擅自改释为“在会众中”。
- source_word: הֶעֱרִיכוּ
  choice: 他们……摆好了
  rationale: ערך的使役形表示安排、陈设或摆放妥当。“摆好了”在现代汉语中自然，同时保留动作已经完成和有序安置的含义。
- source_word: נֵרוֹ
  choice: 他的灯
  rationale: נר通常指灯，第三人称阳性单数后缀直译为“他的”。所指对象并不明确，因此不改作“那灯”或“他的光”。
theological_decisions:
- issue: 希伯来文末句艰涩，且与希腊文平行文本差异显著
  choice: 正文直接翻译现存希伯来文，并用脚注列出希腊文异文
  alternative: 按希腊文译为：“吟唱圣诗的人用自己的声音赞美；在挤满人的殿中，曲调变得悦耳。”
  rationale: 希伯来文见证在此尚存，应作为正文依据；但末句的意义和代词所指均有困难。希腊文显然代表另一种传承，故以脚注如实保留，而不将两种文本暗中调和。
translation_notes:
  register: 采用现代、庄重而可读的普通话。正文尽量贴近希伯来文，并刻意保留“歌声……它的声音”“他的灯”等原文中的拟人化和指代不确定性；不以希腊文消解希伯来文的艰涩。
