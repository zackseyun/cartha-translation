base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/012.yaml
  text: When he received the portions from the hand of his brothers[a], and he stood at his arrangement, around him was a crown of sons, like saplings of cedars in Lebanon[b]; and they surrounded him like willows by a stream—all the sons of Aaron in their splendor.
translation:
  language: zh_hans
  text: 他从弟兄手中接过祭牲的肉块[a]，站在陈设旁[b]；他周围是一圈众子，如同黎巴嫩的香柏幼苗；亚伦的众子满有荣光，像溪边的柳树环绕着他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“从他弟兄手中”；希腊文本作“从祭司们手中”。按上下文，这些“弟兄”应是与他一同供职的人。
    reason: alternative_reading
  - marker: b
    text: 希伯来文此词指“摆列、陈设”或“摆列之物”，含义和具体所指并不完全确定；希腊文本作“站在祭坛的炉床旁”。
    reason: textual_variant
lexical_decisions:
- source_word: בְּקַבְּלוֹ נְתָחִים
  choice: 他……接过祭牲的肉块
  rationale: בְּ加不定式在此表示时间背景；נְתָחִים指切开的块，在献祭语境中是祭牲的肉块。译文补出“祭牲”以使现代读者明白语境，但不限定具体祭物或份额。
- source_word: מִיַּד אֶחָיו
  choice: 从弟兄手中
  rationale: 紧随现存希伯来文本，保留“弟兄”；上下文表明他们是同为祭司的人。
- source_word: נִצָּב עַל מַעֲרָכוֹת
  choice: 站在柴堆旁
  rationale: מַעֲרָכוֹת本义涉及有次序的摆列，在献祭语境中可指坛上摆列的柴堆；介词עַל在这里按场景自然译作“旁”。希腊平行文本的“祭坛炉床旁”支持这一祭坛场景，但正文不把希腊细节全部加入。
- source_word: עֲטֶרֶת בָּנִים
  choice: 一圈子孙
  rationale: עֲטֶרֶת有冠冕或环状花冠的形象；“一圈”既承接环绕的视觉效果，也避免把众人说成一顶实体冠冕。בָּנִים结合后文“亚伦的众子孙”译为“子孙”。
- source_word: כִּשְׁתִילֵי אֲרָזִים בַּלְּבָנוֹן
  choice: 仿佛黎巴嫩的香柏幼苗
  rationale: 保留幼嫩而挺拔的树木意象；אֲרָזִים按圣经常用植物名译作“香柏”。
- source_word: בְּעַרְבֵי נָחַל
  choice: 像溪边的柳树
  rationale: עַרְבֵי נָחַל是生长在水道旁的柳树；“溪边”简洁自然，并保留诗歌画面。
- source_word: כָּל־בְּנֵי אֲהַרֹן בִּכְבוֹדָם
  choice: 亚伦的众子孙荣光焕发
  rationale: בִּכְבוֹדָם描写他们庄严、荣耀的仪容；“荣光焕发”在现代中文中既生动又保持礼仪场景的尊贵感。
theological_decisions:
- issue: “弟兄”的祭司身份
  choice: 正文保留“弟兄”，由上下文说明其祭司身份
  alternative: 译作“祭司们”
  rationale: 现存希伯来文本明确作“他的弟兄”，希腊文本则作“祭司们”。以希伯来文为正文依据，不用希腊异文取代它，同时在脚注交代两者关系。
- issue: מַעֲרָכוֹת所指为何
  choice: 按献祭场景译为“柴堆”，并以脚注保留词义与文本上的不确定性
  alternative: “摆列之处”或“祭坛炉床旁”
  rationale: 希伯来语可表示摆列好的事物，在祭坛语境中特别可指摆好的柴；希腊平行文本明确提到祭坛炉床。“柴堆”比“摆列之处”自然，也不直接把希腊文本的“祭坛炉床”写进正文。
translation_notes:
  register: 采用现代、庄重而可朗读的书面普通话。句式保留原文由祭祀动作转入树木意象的诗性推进；对较晦涩的礼仪用语用脚注说明，不在正文中消除文本张力。
