  text: May he give you wisdom of heart[b][a], and may there be peace among you.
translation:
  language: zh_hans
  text: 愿他赐给你们心中的智慧[a]，愿你们中间有平安。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作“心中的喜乐”，而不是“心中的智慧”。
    reason: alternative_reading
  - marker: b
    text: 希腊文将这句祝福扩展为：“在我们的日子里，愿以色列有平安，如同古时的日子。”
    reason: textual_variant
lexical_decisions:
- source_word: יִתֵּן
  choice: 愿他赐给
  rationale: 未完成式在祝福语境中表达祈愿，而非单纯将来；“愿他赐给”自然保留祝祷语气。
- source_word: לָכֶם
  choice: 你们
  rationale: 原文为复数第二人称间接受词；汉语用“赐给你们”清楚自然。
- source_word: חָכְמַת לֵבָב
  choice: 心中的智慧
  rationale: 优先依据现存希伯来文“心的智慧”，表达内在的明辨；“心中的智慧”比直译“心之智慧”更符合现代汉语，同时不把“心”缩限为理智。
- source_word: וִיהִי
  choice: 愿……有
  rationale: 与前句同为祝福中的祈愿表达；用第二个“愿”保持并列结构和庄重语气。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: “平安”既可涵盖人与人之间的和睦，也可包含安康、完满之意，是此处 שָׁלוֹם 的自然对应。
- source_word: בֵּינֵיכֶם
  choice: 你们中间
  rationale: 对象为复数群体，“你们中间”准确表达群体内部的关系，较“你们之间”略显庄重而仍属现代汉语。
theological_decisions:
- issue: 希伯来文与希腊文平行文本不同时的正文选择
  choice: 正文采用希伯来文“心中的智慧”及“你们中间有平安”
  alternative: 希腊文作“心中的喜乐”，并扩展为“在我们的日子里，愿以色列有平安，如同古时的日子”
  rationale: 此处希伯来文见证存留且可信度高，故按原文优先原则作为正文依据；希腊文的重要异文和扩展则以脚注完整保留，不将两种文本调和。
translation_notes:
  register: 采用现代、庄重而易懂的祝福语体。正文紧随高可信度的希伯来文；两个脚注标记均置于其所说明的对应内容之后，并按正文出现顺序排列。
