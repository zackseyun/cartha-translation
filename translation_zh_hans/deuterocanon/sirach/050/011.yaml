revisions:
- from: 他披上尊荣的衣袍，以华美的礼服为衣；他登上辉煌的祭坛时，使圣所的院子也显得庄严华美。[a]
  to: 他穿上尊荣的衣袍，披上华美的礼服；当他登上威荣的祭坛[a]时，他使圣所的院子增添华美。
  rationale: 修订仅改善汉语搭配、使役表达和脚注的术语与锚点，不改变希伯来文为正文依据的译法。“穿上／披上”保留原文两次穿戴动作的平行；“使……增添华美”直接表达 וַיֶּהְדַּר 的使役性，同时不具体化为实际装饰建筑。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:47:08Z'
review_pass:
  verdict: revise
  source_fidelity: 正文总体遵循现存希伯来文：两组礼服、祭坛的“威荣／辉煌”性质，以及“圣所的院子”均得到保留。惟“以华美的礼服为衣”不是现代汉语自然表达；末句“使……也显得庄严华美”虽可通，却较原文的使役性“使之增辉／增添华美”更迂回。脚注中希腊文的περιβολή宜译作“服饰”或“外饰”，不宜作含义过宽的“周围”。
  naturalness: “他披上……，以……为衣”搭配生硬，且“衣袍／礼服”为同类词时以两个自然的穿戴动词形成平行更合乎现代庄重书面语。修订后句法清晰，仍保有礼仪性和诗性。
  terminology: “尊荣”“华美”“祭坛”“圣所的院子”均合适。“威荣的祭坛”较准确呈现הוֹד的威仪、荣光含义，且避免把希腊文“圣洁的”混入正文。脚注明确该处是希伯来文与希腊文平行本的读法差异。
  issues:
  - severity: medium
    issue: “以华美的礼服为衣”不合现代汉语常用搭配。
    rationale: 该表达逐字模拟“以……为衣”，读来拗口；原文两个穿戴动词可用“穿上／披上”自然而忠实地呈现。
  - severity: low
    issue: 脚注将希腊文末语的可能含义列为“周围”。
    rationale: 此处περιβολή的核心义为衣饰、覆盖物或外饰；“周围”过于笼统，容易误解为地点。以“服饰（或：外饰）”保留必要歧义。
  - severity: low
    issue: 脚注标记置于全节末尾，未紧邻异文首先出现处。
    rationale: 将标记置于“威荣的祭坛”后，读者能立即识别脚注所涉及的祭坛读法，并由脚注说明末句宾语亦有差异。
