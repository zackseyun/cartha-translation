base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/011.yaml
  text: When he put on garments of honor and clothed himself in garments of splendor[a], when he went up to the altar of glory, he adorned the court of the sanctuary.
translation:
  language: zh_hans
  text: 他穿上尊荣的衣袍，披上华美的礼服；当他登上威荣的祭坛[a]时，他使圣所的院子增添华美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“……登上圣洁的祭坛时，他使圣所的服饰（或：外饰）增光。”希伯来文作“威荣的祭坛”和“圣所的院子”。
    reason: 保留希伯来文与希腊文平行本在祭坛性质及末句宾语上的差异；正文按现存希伯来文翻译。
lexical_decisions:
- source_word: בַּעֲטוֹתוֹ
  choice: 他披上
  rationale: 该形式描写穿戴礼服的动作；“披上”自然地传达衣袍加身，也保留庄重语气。
- source_word: בִּגְדֵי כָבוֹד
  choice: 尊荣的衣袍
  rationale: כָבוֹד 可指尊荣或荣耀；“尊荣的衣袍”保留原文修饰关系，并符合祭司礼服的语境。
- source_word: וְהִתְלַבְּשׁוֹ בִּגְדֵי תִפְאָרֶת
  choice: 以华美的礼服为衣
  rationale: 保留反身穿衣之意及诗句的平行结构；תִפְאָרֶת 在此表示华美、荣美或辉煌。
- source_word: בַּעֲלוֹתוֹ
  choice: 他登上……时
  rationale: 明确表达向祭坛所在处上行的动作，并与前一时间分句自然衔接。
- source_word: מִזְבַּח הוֹד
  choice: 辉煌的祭坛
  rationale: הוֹד 可表示威荣、光辉或华美；“辉煌的祭坛”忠实反映现存希伯来文本，且不以希腊文的“圣洁的祭坛”取代它。
- source_word: וַיֶּהְדַּר
  choice: 使……也显得庄严华美
  rationale: 该词有使之华美、增添荣美的含义；此译文表明大祭司的盛装使整个圣所院宇增辉，又避免将动作具体化为实际装饰建筑。
- source_word: עֲזֶרֶת מִקְדָּשׁ
  choice: 圣所的院子
  rationale: עֲזֶרֶת 指圣殿范围内的院子；此译法清楚保留其与“圣所”的从属关系。
theological_decisions:
- issue: 现存希伯来文与希腊文平行本的差异
  choice: 正文以现存希伯来文为主，译作“辉煌的祭坛”和“圣所的院子”。
  alternative: 希腊文可译为“圣洁的祭坛”，末句亦可能理解为“使圣所的服饰／周围增光”。
  rationale: 此处希伯来见证完整、可信且语意连贯，因此正文遵从希伯来文；希腊文的真实异文则在脚注中保留，不将两种读法悄然调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话；以较整齐的平行句式呈现礼仪场景。“衣袍／礼服”“辉煌／庄严华美”避免机械重复，同时维持原文尊荣、华美和威荣几个近义词之间的层次。
