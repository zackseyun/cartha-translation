translation:
  language: zh_hans
  text: 如同一件雕琢的金器，以锑为饰[a]，固定在珍贵的宝石上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“אַנְטִיל”（安提勒）词义不确定，可能指锑，也可能指某种装饰性镶嵌物或饰件。希腊语平行文本较概括地说：“以各样宝石装饰。”
    reason: lexical_alternative
  - marker: b
    text: 希腊语见证将这个比喻表述为：“如同一件锤制的金器，以各样宝石装饰。”这支持希伯来语所描绘的是华美精细的装饰工艺。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּכְלִי זָהָב
  choice: 如同一件金器
  rationale: כִּ־表示比喻，כְּלִי可指器皿或精制器物；此处用“金器”既自然，也保留礼仪性工艺品的诗意形象。
- source_word: מְפֻתָּח
  choice: 雕琢的
  rationale: 该被动分词表示经过雕刻、錾刻或装饰加工；“雕琢”在现代中文中能自然涵盖精细金工，而不把具体工艺限定得过窄。
- source_word: וְאַנְטִיל
  choice: 饰以锑
  rationale: אַנְטִיל词义不确定，可能指锑，也可能指某种嵌饰或装饰物。正文保留较可能的矿物义“锑”，并用“饰以”表达其装饰作用；不确定性在脚注中说明。
- source_word: הַנֶּאֱחָז
  choice: 镶嵌
  rationale: Nifal分词基本义为被固定、扣住或安置。结合宝石工艺的语境，“镶嵌”比直译“固定”更自然，但仍没有明确断定具体镶嵌技术。
- source_word: עַל אַבְנֵי חֵפֶץ
  choice: 在宝石上
  rationale: 字面为“在可喜爱／贵重的石头上”；חֵפֶץ在此表示珍贵、可宝爱的性质，希腊平行文本的“贵重的石头”也支持译作“宝石”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗性表达。“金器”“雕琢”“镶嵌”形成连贯的工艺意象；对疑难词אַנְטִיל不作无提示的确定化处理，而以脚注保留其真实歧义。所有脚注标记均已置于正文。
