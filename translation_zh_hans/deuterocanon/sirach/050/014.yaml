  text: until he finished ministering at the altar[a], and arranging the offerings of the Most High.
translation:
  language: zh_hans
  text: 直到他在祭坛前供职、摆列至高者的各项陈设完毕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“摆列至高全能者的供物。”希伯来文本较简略，直译近于“摆列至高者的各项陈设”。
    reason: 说明希伯来文本与希腊平行文本在礼仪对象及神圣称号上的差异。
lexical_decisions:
- source_word: עַד כַּלּוֹתוֹ
  choice: 直到他完成
  rationale: 该不定式结构表示前述行动所达到的终点；“直到他完成”既保留时间关系，也符合现代汉语表达。
- source_word: לְשָׁרֵת
  choice: 供职
  rationale: שרת在祭司语境中指礼仪性的事奉；“供职”能体现正式的祭司职务，又不把含义泛化为普通劳动。
- source_word: מִזְבֵּחַ
  choice: 祭坛前
  rationale: מזבח通常译为“祭坛”；原文虽未明示介词，但此处说的是祭司在祭坛处履行职务，汉语以“祭坛前”表达最自然。
- source_word: וּלְסַדֵּר
  choice: 摆列整齐
  rationale: סדר意为安排、按次序摆放；“摆列整齐”适合祭坛礼仪场景，并保留整理、排列的动作含义。
- source_word: מַעַרְכוֹת
  choice: 各项陈设
  rationale: 该复数名词可指排列好的各组事物或陈设。希伯来文本没有明确说成“祭物”，因此采用较宽泛的“各项陈设”，避免把希腊文本所体现的具体解释直接写入正文。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 这是智慧文学中常见的上帝称号；“至高者”是庄重、清楚且通行的译法。
theological_decisions:
- issue: 是否依照希腊文本把מַעַרְכוֹת明确译成“供物”
  choice: 正文采用较宽泛的“各项陈设”
  alternative: 摆列至高全能者的供物
  rationale: 现存且可信度高的希伯来文本用复数名词מַעַרְכוֹת，含义较为简略，可指按次序排列的事物；希腊文本则明确作单数“供物”，并增加“全能者”。正文以希伯来证据为主，保留其概括性，同时在脚注中交代希腊异文。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语体。“祭坛前的供职”体现祭司职务；“各项陈设”刻意保留希伯来原文没有明说具体对象的含混性。
