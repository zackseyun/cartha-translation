translation:
  language: zh_hans
  text: 如夏日里黎巴嫩的花朵[a]，又如谷物祭上乳香燃起的火焰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本在此处作：“如夏日里黎巴嫩的嫩枝。”现存希伯来文则作“又如谷物祭上乳香的火焰”；正文依从希伯来文。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח
  choice: 如……的花朵
  rationale: כְּ־表示比拟，פֶרַח指花或花朵；译作“花朵”既保留鲜明意象，也符合现代汉语诗性表达。
- source_word: לְבָנוֹן
  choice: 黎巴嫩的
  rationale: 与前词构成“黎巴嫩的花朵”，保留原文对黎巴嫩草木景象的联想，不具体化为某一种植物。
- source_word: בִּימֵי קָיִץ
  choice: 夏日里
  rationale: 原文直译为“在夏天的日子里”；“夏日里”在现代汉语中自然凝练，也保留诗歌节奏。
- source_word: וּכְאֵשׁ לְבוֹנָה
  choice: 又如……燃烧的乳香
  rationale: 原文为“又如乳香之火”。汉语若直译成“乳香的火”较生硬；“燃烧的乳香”保留火焰与乳香相连的具体祭祀意象，同时不泛化为一般香料。
- source_word: עַל הַמִּנְחָה
  choice: 素祭上
  rationale: מִנְחָה在祭祀语境中指以细面等献上的素祭；“素祭”是简洁、明确的现代中文礼仪术语。“上”对应עַל，呈现乳香在祭物上焚烧的画面。
theological_decisions:
- issue: 祭祀术语 מִנְחָה 的具体程度
  choice: 素祭
  alternative: 供物／祭物
  rationale: 本节以圣殿礼仪比喻大祭司的荣美，保留祭物种类有助于呈现原文的礼仪背景；“素祭”比泛称“供物”准确，又比解释性的“谷物祭”更凝练。
- issue: אֵשׁ לְבוֹנָה 的句法意象
  choice: 燃烧的乳香
  alternative: 乳香之火
  rationale: 原文的字面结构容许“乳香之火”，但现代汉语易误解为一种名为“乳香火”的事物。译作“燃烧的乳香”不改变祭祀意象，也不额外赋予象征意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“夏日里”维持诗性节奏，以“素祭”保留圣殿祭祀背景；脚注说明希腊平行文本的较大差异，不把两种传统强行调和。
