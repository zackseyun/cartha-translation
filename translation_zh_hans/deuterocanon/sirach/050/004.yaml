translation:
  language: zh_hans
  text: 他关怀自己的百姓，使他们免遭灾祸[a]；又加固自己的城，抵御危难[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们免遭突来的灾难。”希腊语平行文本作“免于倾覆”，同样表达保护百姓免遭毁灭的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“加固自己的城，抵御围攻。”希腊语平行文本更明确地指向军事围困，而此处希伯来语也可泛指困境或压力。
    reason: alternative_reading
lexical_decisions:
- source_word: הַדּוֹאֵג לְעַמּוֹ
  choice: 他照管自己的百姓
  rationale: דאג的分词表示持续的关切和照料；译作“照管”既保留主动、持续的意味，也不把它限定为行政供给。לְעַמּוֹ自然处理为“自己的百姓”。
- source_word: מֵחֶתֶף
  choice: 使他们免遭灾祸
  rationale: חֶתֶף可指突然而具破坏性的打击或灾难。介词מִן表达远离或免受某种危险，故用“免遭”；“灾祸”保留其宽泛含义，突发性另见脚注。
- source_word: וּמְחַזֵּק
  choice: 又加固
  rationale: חזק的加强式可指使坚固或设防；因宾语是“城”，译作“加固”自然体现城防语境，同时不必明确限定具体军事工程。
- source_word: עִירוֹ
  choice: 自己的城
  rationale: 保留עיר的“城”以及第三人称单数所属后缀；“自己的”与前半句形成自然对应。
- source_word: מִצָּר
  choice: 抵御危难
  rationale: צָר可表示困境、压力，也可指敌人或围困所造成的威胁。“危难”在正文中保留希伯来语较宽的范围；希腊语平行文本所支持的军事性理解收入脚注。
