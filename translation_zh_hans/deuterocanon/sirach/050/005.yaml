  text: How splendid he was when he looked out from the tent[b][a], when he came out from the house of the curtain.
translation:
  language: zh_hans
  text: 他从帐幕中向外望时，何等威严！他从帷幔之殿出来时，也何等威严！[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本此处作：“他在百姓巡行之中何等荣耀”，不同于希伯来文的“他从帐幕中向外望时”；这表明首句存在文本差异。
    reason: textual_variant
  - marker: b
    text: “帷幔”也可译作“幔子”，指内层圣所前的遮隔物。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶהְדַּר
  choice: 何等威严
  rationale: מַה构成感叹，נֶהְדַּר兼有壮美、尊荣和令人敬畏的观感；“何等威严”在现代汉语中庄重自然，也适合大祭司显现的场景。
- source_word: בְּהַשְׁגִּיחוֹ
  choice: 他……向外望时
  rationale: 使役词形在此自然表达从里面向外观看；保留“望”的具体动作，不因上下文而改译为较宽泛的“显现”。
- source_word: מֵאֹהֶל
  choice: 从帐幕中
  rationale: אֹהֶל直义为“帐幕”。虽处于圣殿礼仪语境，仍保留希伯来文沿用的帐幕意象，不统一改成“圣殿”。
- source_word: וּבְצֵאתוֹ
  choice: 他……出来时
  rationale: 按其时间性不定式结构直译，并与前半句“……时”形成平行。
- source_word: מִבֵּית הַפָּרֹכֶת
  choice: 从帷幔之殿
  rationale: 保留בֵּית与פָּרֹכֶת的紧密属格关系。“帷幔之殿”较“帷幔的房屋”自然，又不添加“从帷幔后面”等原文未明说的空间解释。
theological_decisions:
- issue: “帐幕”与“帷幔之殿”并置的圣所意象
  choice: 保留两种不同的建筑与礼仪称谓
  alternative: 统一译作“圣所”或“圣殿”
  rationale: 希伯来文有意或依传统语言将אֹהֶל与בֵּית הַפָּרֹכֶת并置；统一术语会抹平其承袭帐幕传统而用于圣殿礼仪的张力。
- issue: 希腊文首句与希伯来文的文本差异
  choice: 正文以高可信度希伯来文本为准，脚注列出希腊文异读
  alternative: 按希腊文译为“他在百姓巡行之中何等荣耀”
  rationale: 现有希伯来证据清楚表达“从帐幕中向外望”；希腊平行文本反映不同底本或传抄传统，不宜无说明地并入正文。
translation_notes:
  register: 采用庄重而可读的现代标准汉语。用感叹句重现מַה的赞叹语气，以两个“……时”保留希伯来文的平行结构；“也是如此”补足汉语中后半句承接感叹的自然表达，但不增加新的事件内容。脚注标记均置于正文末尾。
