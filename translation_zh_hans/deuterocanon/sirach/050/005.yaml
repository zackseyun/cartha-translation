- from: 他从帐幕中向外望时，何等威严！他从帷幔之殿出来时，也是如此。[a][b]
  to: 他从帐幕中向外望时，何等威严！他从帷幔之殿出来时，也何等威严！[a][b]
  rationale: 删除原文未明示、且在汉语中指代较弱的“也是如此”，以“也何等威严”明示两个时间分句共同受感叹句支配。脚注内容无需改动；标记应分别附在“帐幕”和“帷幔”之后，修订文本如下：他从帐幕[a]中向外望时，何等威严！他从帷幔[b]之殿出来时，也何等威严！
