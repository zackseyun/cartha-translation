translation:
  language: zh_hans
  text: 如一棵青翠的橄榄树，结满果实[b]；又如一棵丰茂的树，滋润着枝条[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“又如一棵高耸入云的柏树”，不同于希伯来文本的“又如一棵丰茂的树，滋润着枝条”。本译在希伯来文尚存之处以希伯来文本为主要依据。
    reason: alternative_reading
  - marker: b
    text: 或译：“结满橄榄果。”此处的希伯来词罕见，在本句中很可能指橄榄树的果实。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּזַיִת רַעֲנָן
  choice: 如一棵青翠的橄榄树
  rationale: כְּ 表示比拟；זַיִת 在与后半句“树”平行的语境中指橄榄树。רַעֲנָן 描写鲜活、繁茂而青绿的状态，“青翠”自然保留这一诗意形象。
- source_word: מָלֵא גַרְגַּר
  choice: 结满果实
  rationale: 字面为“充满 גַרְגַּר”；该罕见名词在此很可能指橄榄果。译作“结满果实”既符合树木意象，也避免把不完全确定的词义过度限定为“浆果”。
- source_word: וּכְעֵץ שָׁמֵן
  choice: 又如一棵丰润的树
  rationale: שָׁמֵן 字面有“肥、油润”之意，用于植物可表示肥美、茂盛、滋养充足。“丰润”保留其丰富油润的意味，同时比“油树”更符合现代汉语。
- source_word: מְרַוֶּה עָנָף
  choice: 滋润着枝条
  rationale: רוה 的使役分词表示使之饱受水分、浸润或滋养；“滋润着枝条”保留主动而持续的画面，又不把强度夸大为“浸透”。עָנָף 在此作集合性单数处理。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。两个比喻以“如……；又如……”保持希伯来文的平行结构；不以希腊异文取代现存希伯来正文，而在脚注中完整说明。
