  yaml_path: translation/deuterocanon/sirach/050/029.yaml
  text: For if one does these things[a], he will prevail in everything, for the light of the Lord is his path.
translation:
  language: zh_hans
  text: 因为若有人实行这些事，就能应对一切；因为主的光是他的道路[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “道路”所译的希腊语词更直译为“他的足迹”或“他的踪迹”。
    reason: 保留ἴχνος较具体的字面意象，以及该比喻的含混性。
lexical_decisions:
- source_word: ἐὰν γὰρ αὐτὰ ποιήσῃ
  choice: 因为人若实行这些教导
  rationale: ἐὰν引出条件，γὰρ承接上文并说明理由；αὐτά回指前文的教训或吩咐。补出“人”和“教导”使现代汉语自然，但不限定具体内容。
- source_word: πρὸς πάντα ἰσχύσει
  choice: 就能应对一切
  rationale: ἰσχύω表示有力量、能够或占优势；πρὸς πάντα语义较为压缩。“应对一切”既保留面对各种事物时有能力的含义，也避免把它过度解释为必然在凡事上成功或战胜所有敌手。
- source_word: φῶς Κυρίου
  choice: 主的光
  rationale: 直译属格结构，保留智慧文学中神圣光照的意象，不把“光”明说为引导、启示或律法。
- source_word: τὸ ἴχνος αὐτοῦ
  choice: 他所走的路
  rationale: ἴχνος本义为足迹、踪迹，也可借喻所循的道路。“他所走的路”在汉语中自然，并保留人生行程的比喻；更具体的原文形象见脚注。
theological_decisions:
- issue: “主的光就是他的足迹/道路”这一比喻的含义
  choice: 正文译作“主的光就是他所走的路”，表达主的光与此人的人生道路相联，同时不明说光究竟是引导道路、照亮道路，还是构成可循的踪迹。
  alternative: 直译为“主的光就是他的足迹”或“他的踪迹”，更具体地保留ἴχνος的形象，却在现代汉语中较晦涩，并可能被理解为“主自己的足迹”。
  rationale: 希腊文没有显式动词，意象凝练且关系含混。正文采用可懂的道路表达，脚注保留“足迹/踪迹”的字面可能，以免消除原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“应对一切”比“胜过一切”少一层必胜色彩，也比“向着一切刚强”自然；分号保留两层因果说明之间的紧密关系。
