  yaml_path: translation/deuterocanon/sirach/050/028.yaml
  text: Blessed is the man who meditates on these things[a], and he who takes them to heart will become wise.
translation:
  language: zh_hans
  text: 默想这些事的人有福了[a]；把这些事放在心上的人，必成为有智慧的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有福了”也可译作“快乐”。希伯来文 אַשְׁרֵי 和希腊文 μακάριος 在这里是智慧文学的称福用语，含义不止于主观的快乐。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: 有福了
  rationale: 这是希伯来智慧文学常见的称福句式，不只表示主观快乐；“有福了”既保留庄重的智慧箴言语气，也与希腊文 μακάριος 相符。
- source_word: אִישׁ
  choice: ……的人
  rationale: 原文为阳性单数，但在智慧文学中泛指任何个体。现代汉语以“……的人”自然表达这种泛指，无须加入仅指男性的“男人”。
- source_word: בְּאֵלֶּה יֶהְגֶּה
  choice: 默想这些事
  rationale: הגה 在此指反复思想、揣摩；介词短语 בְּאֵלֶּה 指向前文所述内容。“默想这些事”准确而自然。
- source_word: וְנוֹתֵן עַל לִבּוֹ
  choice: 把这些事放在心上
  rationale: 直译意象为“放在他的心上”，表示认真留意并内化。补出“这些事”承接上句；希腊文 αὐτά 也明确支持这一复数所指。
- source_word: יֶחְכָּם
  choice: 必有智慧
  rationale: 该动词表示成为有智慧。汉语“必有智慧”自然表达由用心领会而达到智慧的结果，同时不过度引入希腊文可能具有的被动意味。
theological_decisions:
- issue: 智慧文学称福句中的阳性单数泛指
  choice: 译作“……的人”
  alternative: 译作“男人”或“人”
  rationale: אִישׁ 在语法上是阳性单数，在此却具有代表性、泛指功能。汉语关系结构“……的人”既不抹去个体性，也不把适用范围误限于男性。
- issue: 以希伯来文为主要文本、希腊文为校验
  choice: 依希伯来文翻译，并由希腊文确认第二分句省略宾语所指为“这些事”
  alternative: 拘泥于表面形式，译为“放在心上的人”而不补宾语
  rationale: 现存希伯来文足以作为主证；希腊文 αὐτά 确认第二分句承接前文复数内容，因此补出“这些事”属于澄清省略，并非添加新义。
- issue: יֶחְכָּם 的语态与结果含义
  choice: 必有智慧
  alternative: 必成为有智慧的人；必得教导而有智慧
  rationale: 希伯来文首先表达变得有智慧的结果；不依希腊文被动形式将其解释成特定的外在施教过程，以保留文本的简洁性。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。两个“……的人”形成清楚的平行结构；分号呈现两分句紧密相关而又各自完整。保留“放在心上”的心之意象，同时避免生硬直译。
