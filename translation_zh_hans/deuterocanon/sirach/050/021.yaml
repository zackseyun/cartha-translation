  text: And they bowed down a second time[b][a], to receive blessing from before him.
translation:
  language: zh_hans
  text: 他们再一次俯伏在地[a]，为要从他面前领受祝福。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“再次倒下，第二次”；在这里指敬拜中的俯伏。
    reason: lexical_alternative
  - marker: b
    text: 希腊文作“显明来自至高者的祝福”，明确把上帝而非祭司说成祝福的来源。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁנוּ
  choice: 再次
  rationale: 该动词表示重复、再做一次；与后面的“第二次”共同保留原文刻意强调的重复动作。
- source_word: לִנְפּוֹל
  choice: 俯伏
  rationale: 字面义是“倒下、伏下”；在礼仪语境中指敬拜时俯伏。“俯伏”既保留身体动作，也自然传达敬拜含义。
- source_word: שֵׁנִית
  choice: 第二次
  rationale: 原文明确标示这是第二次，故不简化为单纯的“又”。
- source_word: בְּרָכוֹת
  choice: 祝福
  rationale: 希伯来文形式为复数，但此处可作集合意义；现代汉语用单数形式“祝福”更自然，希腊文单数也提供旁证。
- source_word: לָקַחַת
  choice: 领受
  rationale: 字面为“拿取”，在接受祭司祝福的语境中译作“领受”庄重而自然，也不暗示强取。
- source_word: מִפָּנָיו
  choice: 从他面前
  rationale: 保留希伯来文“从他面前／临在”的空间表达及第三人称代词，不在正文中替代为希腊传统明确写出的“至高者”。
theological_decisions:
- issue: מִפָּנָיו中“他”的所指与希腊文解释性扩展之间的差异
  choice: 正文按现存希伯来文译为“从他面前”。
  alternative: 希腊文作“从至高者那里”，并有“彰显至高者所赐的祝福”之意。
  rationale: 以现存希伯来文为主要依据，保留第三人称代词所具有的指代张力；同时用脚注记录希腊传统将祝福的最终来源明确指向至高者的读法。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“再次……第二次”在汉语中略显重复，但忠实保留希伯来文对第二次俯伏的双重强调。脚注标记均置于正文对应内容之后。
