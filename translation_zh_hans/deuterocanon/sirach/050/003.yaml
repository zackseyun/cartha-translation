  text: In his days the wall with corner towers was built[b][a], a dwelling like a royal palace.
translation:
  language: zh_hans
  text: 在他任内，带角楼的城墙建成了；那是一处如王宫般的居所[b][a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本此处差异很大：“在他任内，蓄水池缩小了，周边的铜如同海一般。”这可能反映了不同的底本，或某一文本传统中的讹误。
    reason: textual_variant
  - marker: b
    text: “带角楼的城墙”所译的希伯来语较难确定，字面与“墙”和“角”有关；可能指墙角部分、角楼，或设防的围墙。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָמָיו
  choice: 在他任内
  rationale: 这是说明大祭司任职时期的时间短语；“在他任内”自然、准确，也比直译“在他的日子里”更符合现代汉语。
- source_word: נִבְנָה
  choice: 建成了
  rationale: 该词是בנה的被动式，表示“被建造”。原文没有明确表达重建，因此不译作“重建”。
- source_word: קִיר / פִּנּוֹת
  choice: 带角楼的城墙
  rationale: קיר意为“墙”；פנות字面与“角、拐角”有关，但建筑上的确切所指不明。“带角楼的城墙”给出合乎语境的读法，同时用脚注保留可能是墙角部分或设防围墙的歧义。
- source_word: מָעוֹן
  choice: 巍然可居
  rationale: מָעוֹן通常指居所、住处。这里与前面的建筑和后面的王宫比喻并列；译为“可居”保留居所含义，加“巍然”使汉语句法自然，但不把它另行实体化为第二座建筑。
- source_word: כְּהֵיכַל מֶלֶךְ
  choice: 如同君王的宫殿
  rationale: היכל与מלך连用时自然指王宫或君王的宫殿；此译保留明喻及庄严气势。
- source_word: ἐν ἡμέραις αὐτοῦ ἠλαττώθη ἀποδοχεῖον ὑδάτων, χαλκὸς ὡσεὶ θαλάσσης τὸ περίμετρον
  choice: 仅用于校勘对照，不纳入正文
  rationale: 希腊文本与现存希伯来文本差异显著，可能反映不同底本或传抄讹误。本节既有可信度较高的希伯来文本，正文从希伯来文，希腊异文收入脚注。
