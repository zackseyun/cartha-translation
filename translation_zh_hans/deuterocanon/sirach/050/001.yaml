base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/001.yaml
  text: Simon son of Yohanan the priest was the glory of his brothers and the splendor of his people[a]; in his generation the house was repaired[b], and in his days the temple was strengthened.
translation:
  language: zh_hans
  text: 约哈难的儿子、祭司西门，在弟兄中为尊，是他百姓的荣美[a]；在他的世代，圣殿得以修缮[b]；在他的日子，殿宇得以加固。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“敖尼雅的儿子、大祭司西门。”这里的希伯来文本作：“约哈难的儿子、祭司西门。”
    reason: alternative_reading
  - marker: b
    text: 或译：“圣殿受到照管／得以修复。”希伯来语动词可指受到照管或修缮；希腊平行文本更明确地指向圣殿的建筑工程。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדוֹל אֶחָיו
  choice: 在弟兄中为尊
  rationale: 短语直译近于“在他的弟兄中为大”。译作“在弟兄中为尊”既保留比较与尊荣意味，也与后半句形成自然的赞颂性平行，而不把“荣美”的含义提前移入本短语。
- source_word: וְתִפְאֶרֶת עַמּוֹ
  choice: 是他百姓的荣美
  rationale: תִפְאֶרֶת兼有荣美、光彩、尊荣之意；“荣美”保留诗性和赞誉语气，也适合用来称述一位使百姓得荣耀的人。
- source_word: שִׁמְעוֹן בֶּן יוֹחָנָן
  choice: 约哈难的儿子、祭司西门
  rationale: 按现代中文圣经人名音译习惯处理；调整语序，使身份称谓自然，同时不改变父子关系。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 希伯来文本仅作“祭司”，未明说“大祭司”；正文据此直译，希腊平行文本的较完整称号收入脚注。
- source_word: נִפְקַד הַבָּיִת
  choice: 圣殿得以修缮
  rationale: נפקד在此可指受到照管、修复；结合建筑语境及希腊平行文本所指的建造工程，“得以修缮”清楚而不过度限定具体工程。הַבָּיִת字面是“那房屋”，此处所指为圣殿。
- source_word: חֻזַּק הֵיכָל
  choice: 殿宇得以加固
  rationale: חֻזַּק为被动式，意为“被加强、加固”；הֵיכָל在此指圣殿建筑。“殿宇”既保留与前一分句的词语变化，也避免中文连续重复“圣殿”。
theological_decisions:
- issue: 西门的祭司称号
  choice: 祭司
  alternative: 大祭司（或“大祭司长”）
  rationale: 现存希伯来主要文本作הַכֹּהֵן，即“祭司”；希腊平行文本作ἱερεὺς ὁ μέγας，可理解为“大祭司”。正文遵从希伯来文本，脚注保留希腊异文，不消解文本传统之间的差异。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在弟兄中为尊”较贴近希伯来语结构；“荣美”保留赞颂诗体。“圣殿”与“殿宇”对应原文הַבָּיִת与הֵיכָל的词汇变化。所有脚注标记均已置于正文。
