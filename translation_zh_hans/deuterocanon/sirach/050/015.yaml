  text: Then the sons of Aaron, the priests, would raise a shout with hammered trumpets.
translation:
  language: zh_hans
  text: 那时，亚伦的子孙，就是众祭司，用锤打制成的号筒高声吹响。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里有一段较长的平行记载：祭司为奠祭伸出手，把“葡萄之血”倾在祭坛根基上，作为献给至高者、万有之王的馨香。这里保存的希伯来文本只有吹号筒这一句。
    reason: textual_variant
  - marker: b
    text: “高声吹响”也可译作“用号筒发出响亮的信号”。希伯来文动词可表示大声欢呼、呐喊或发出信号；在这里，这声音是借号筒发出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为时间与次序标记，自然承接礼仪场景中的下一项行动。
- source_word: יָרִיעוּ
  choice: 高声吹响
  rationale: 该动词可指欢呼、呐喊或发出响亮信号；因后接号筒作工具，译为“高声吹响”既符合语境，也保留其响亮宣告或信号的意味。
- source_word: בְנֵי אֲהַרֹן / הַכֹּהֲנִים
  choice: 亚伦的子孙，就是众祭司
  rationale: 保留祭司世系称号，并把“众祭司”按希伯来文的同位关系表达出来。
- source_word: בַּחֲצֹצְרוֹת
  choice: 用……号筒
  rationale: חצוצרות 指圣殿礼仪中使用的金属号筒；“用”清楚表达介词的工具意义。
- source_word: מִקְשֶׁה
  choice: 锤打制成的
  rationale: 该工艺词指金属经锤打成形；此译比单说“锤打的”更自然，也不把原文未说明的材质加入正文。
theological_decisions:
- issue: 现存希伯来文短句与较长希腊文平行文本的关系
  choice: 正文只翻译现存希伯来文，并以脚注说明希腊文本的较长内容。
  alternative: 依据希腊文在正文加入奠祭、葡萄之血和馨香等描写。
  rationale: 此处有高可信度的希伯来文见证，应以其为正文依据；希腊文所含额外礼仪内容不应无标记地并入。
- issue: יָרִיעוּ 是人的欢呼还是号筒声
  choice: 译作“高声吹响”，让响亮宣告的动作借号筒表达。
  alternative: 译作“欢呼”或“发出呐喊”。
  rationale: 原词具有呼喊或发出信号的张力，而工具短语明确提到号筒；所选译法避免造成祭司一面口头喊叫、一面使用号筒的误解，同时在脚注保留词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“亚伦的子孙”保留经文中的祭司世系表达；“锤打制成的号筒”准确呈现金属制作工艺，同时避免生硬的直译。
