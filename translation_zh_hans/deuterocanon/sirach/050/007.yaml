translation:
  language: zh_hans
  text: 如太阳照耀着君王的宫殿[a]，又如彩虹显现在云中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作“至高者的圣殿”，而不是“君王的宫殿”。希伯来文见证可能保存了另一种读法；希腊文则更明确地表明这里的祭仪背景。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשֶׁמֶשׁ
  choice: 如太阳
  rationale: 前缀 כְּ 表示比拟；“如太阳”自然保留诗歌中的明喻。
- source_word: מְשַׁקֶּרֶת
  choice: 照耀
  rationale: 此词形罕见，但上下文要求发光、投射光辉之意；希腊文 ἐκλάμπων（发光、照耀）亦支持这一理解。
- source_word: אֶל הֵיכַל הַמֶּלֶךְ
  choice: 照耀君王的殿宇
  rationale: אֶל 在此可表达光照所向；הֵיכַל 兼有“宫殿”和“圣殿”之义。“殿宇”保留其语义张力，既不把希伯来文直接限定为世俗宫殿，也不借希腊平行文本把它完全明确化为圣殿；“君王”则忠实保留希伯来文本。
- source_word: וּכְקֶשֶׁת
  choice: 又如彩虹
  rationale: קֶשֶׁת 本可指弓，但与“云中”搭配时显然指彩虹；“又如”延续并列比喻。
- source_word: נִרְאֲתָה
  choice: 显现
  rationale: Nifal 形式表示被看见或出现；“显现”简洁而有诗意。
- source_word: בֶעָנָן
  choice: 在云中
  rationale: 依希伯来文保留单数“云”，不采用希腊文复数及其附加的“荣耀”。
theological_decisions:
- issue: 希伯来文“君王的殿宇”与希腊文“至高者的圣殿”的差异
  choice: 正文依据希伯来文译作“君王的殿宇”
  alternative: 至高者的圣殿；君王的宫殿
  rationale: 现存希伯来见证应居正文首位。“殿宇”容许 הֵיכַל 的宫殿与圣殿两种语感，避免武断消除歧义；希腊平行文本对祭仪场景的明确理解则列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。以“殿宇”承载 הֵיכַל 在“宫殿”与“圣殿”之间的真实歧义，并以脚注交代希腊平行文本的重要异读。
