  yaml_path: translation/deuterocanon/sirach/050/017.yaml
  text: All flesh together hurried, and they fell on their faces to the ground, to bow down before the Most High, before the Holy One of Israel.
translation:
  language: zh_hans
  text: 众人一同赶忙，俯伏在地，在至高者面前、在以色列的圣者面前敬拜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל בָּשָׂר
  choice: 众人
  rationale: 字面为“凡有血肉的”，在此语境中指在场全体民众；译作“众人”符合现代汉语，也与希腊文 πᾶς ὁ λαός 的理解相符。
- source_word: יַחְדָּו נִמְהָרוּ
  choice: 一同急忙上前
  rationale: יַחְדָּו 表示共同动作，נִמְהָרוּ 表示赶紧、急忙；补出“上前”使汉语动作自然，但不改变其趋近敬拜的语境。
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  choice: 俯伏在地
  rationale: 希伯来语直译为“面伏于地”；“俯伏在地”是自然、庄重且准确的现代汉语表达。
- source_word: לְהִשְׁתַּחֲוֹת
  choice: 敬拜
  rationale: 此处动作对象是至高者，既包含身体俯伏，也表达宗教敬拜；前文“俯伏在地”已保留姿态，因此译为“敬拜”避免重复。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 保留希伯来文作为神圣称号的名词性用法。
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 按希伯来语传统神圣称号直译，保留其庄重性及与圣经其他经文的互文联系。
theological_decisions:
- issue: “至高者”与“以色列的圣者”之间的关系
  choice: 以同位称号连续呈现，不加连接词
  alternative: 译作“至高者，就是以色列的圣者”
  rationale: 原文两次使用 לִפְנֵי（“在……面前”），形成平行复述；不添加“就是”可避免替原文明确界定两称号间的句法关系。
- issue: 敬拜的对象
  choice: 严格依照希伯来文译为“至高者，以色列的圣者”
  alternative: 采希腊文扩展为“他们的主、全能的至高神”
  rationale: 现存希伯来文在此清楚且可信度高，应优先采用；希腊文的较长神名串不纳入正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“俯伏在地，敬拜……”保留礼仪场景与动作次序；避免文言化的“凡有血气者”以及现代语境中可能显得突兀的“脸伏于地”。
