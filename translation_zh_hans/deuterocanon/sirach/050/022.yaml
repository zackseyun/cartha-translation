base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/022.yaml
  text: And now[a], please bless Yahweh, the God of Israel, who does wondrous things on the earth, who makes man great from the womb and deals with him according to his will.
translation:
  language: zh_hans
  text: 现在，请称颂耶和华——以色列的上帝！他在地上施行奇事，使人自母腹中长大，并照自己的旨意对待他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行本作：“按他的怜悯对待我们”，而不是“照自己的旨意对待他”。
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה בָּרְכוּ נָא
  choice: 现在，请称颂
  rationale: עַתָּה 表示“现在”；复数命令式 בָּרְכוּ 加语气词 נָא，带有恳切劝请意味，用“请称颂”自然传达。
- source_word: יְהֹוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 耶和华以色列的上帝
  rationale: 按希伯来文本保留神名，并以现代汉语表达其与“以色列的上帝”的同位关系。
- source_word: הַמַּפְלִיא לַעֲשׂוֹת בָּאָרֶץ
  choice: 他在地上施行奇事
  rationale: 该短语指做出非凡、奇妙之事；בָּאָרֶץ 在此赞美语境中以广义“在地上”理解。
- source_word: הַמְגַדֵּל אָדָם מֵרֶחֶם
  choice: 使人从母腹中成长为大
  rationale: גדל 的使役形式兼有“使长大”和“使尊大”的张力；译文保留“从母腹中”这一成长意象，同时以“为大”保留尊荣、提升的可能含义。אָדָם 在此泛指人。
- source_word: וַיַּעֲשֵׂהוּ בִּרְצוֹנוֹ
  choice: 并按自己的旨意待他
  rationale: 依现存希伯来文的“按他的意愿/旨意”翻译；עשה 加宾语后缀在此可理解为对他采取行动，故用自然而不过度限定的“待他”。
theological_decisions:
- issue: אָדָם 是单数而具有泛指意义
  choice: 人
  alternative: 男人／人类
  rationale: “人”既保留单数指称，又可自然表示具有代表性的人，不把经文限定为成年男性，也不将单数改成抽象集合名词。
- issue: 末句希伯来文与希腊文平行本分歧
  choice: 按自己的旨意待他
  alternative: 按他的怜悯恩待我们
  rationale: 现存希伯来文作 בִּרְצוֹנוֹ，“按他的旨意”，故正文从希伯来文；希腊文则有“按他的怜悯对待我们”，涉及代词、名词和语义差异，列入脚注而不予调和。
- issue: גדל 的使役意义
  choice: 使人……成长为大
  alternative: 使人……尊大／使人长大
  rationale: 原词可涉及成长、增大或尊荣提升；结合“从母腹中”，译文刻意保留身体成长与使之尊大之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“成长为大”略带文学色彩，用以保留原文 גדל 在成长与尊大之间的双重意味；脚注标记已置于相关末句之后。
