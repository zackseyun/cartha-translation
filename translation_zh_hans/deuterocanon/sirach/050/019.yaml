base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/019.yaml
  text: And all the people of the land cried out in prayer before the Merciful One[b][a], until he finished ministering at the altar and his ordinances reached completion.
translation:
  language: zh_hans
  text: 那地所有的百姓都在怜悯者面前高声祷告，[a]直到他在祭坛前侍奉完毕，他所当行的礼仪也告完成。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“至高主的百姓在怜悯者面前祷告。”其后半句也与希伯来文本有所不同，见注b。
    reason: textual_variant
  - marker: b
    text: 本句希伯来文较难；末句也可较直译为“他的定例临到他”。希腊文本则作：“直到主的装饰（或：礼仪）完成，他们也完成了他的侍奉。”
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: וַיָּרֹנּוּ
  choice: 高声祷告
  rationale: רנן可指欢呼、扬声或发出响亮的声音；与בִּתְפִלָּה连用时，译为“高声祷告”既体现群体发声，也不过度限定为歌唱。
- source_word: כָּל עַם הָאָרֶץ
  choice: 全地的百姓
  rationale: 保留“地上的全体百姓”这一希伯来表达；上下文所指是当地聚集的民众，并非普世人类。
- source_word: לִפְנֵי רַחוּם
  choice: 在怜悯者面前
  rationale: 原文仅用形容词性神圣称号“怜悯者”，未明说“上帝”；此译保留其称号性质和原文的省略。
- source_word: עַד כַּלּוֹתוֹ לְשָׁרֵת מִזְבֵּחַ
  choice: 直到他在祭坛前完成侍奉
  rationale: שרת在祭祀语境中指礼仪性的侍奉；中文用“在祭坛前侍奉”自然地表达祭司职分。
- source_word: וּמִשְׁפָּטָיו הִגִּיעַ אֵלָיו
  choice: 所定的礼仪也告完成
  rationale: 该希伯来短语较难，מִשְׁפָּטָיו可指规定、定例或按规所行之礼；结合上下文及希腊文本所见的礼仪完成之意，采用不生硬且保留不确定性的译法。
theological_decisions:
- issue: 神圣称号 רַחוּם
  choice: 怜悯者
  alternative: 慈悲者；怜悯人的上帝
  rationale: 译作称号而不补出原文没有的“上帝”，突出神的怜悯属性，同时避免增译。
- issue: 末句所指的完成
  choice: 所定的礼仪也告完成
  alternative: 他的典章也达到了他那里；他们完成了他的礼仪
  rationale: 希伯来文本末句语法和语义不寻常，希腊平行文本又有差异；正文按希伯来语境表达规定礼仪的完成，并以脚注保存异文和字面可能。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙事语体。“怜悯者”保留神圣称号；“侍奉”“礼仪”体现祭坛语境。所有脚注标记均置于正文相应位置。
