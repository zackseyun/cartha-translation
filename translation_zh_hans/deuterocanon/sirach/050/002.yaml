  text: In his days a reservoir was dug out[b][a], and a conduit like the sea in its abundance.
translation:
  language: zh_hans
  text: 在他的时代，蓄水池被开凿；水渠[a]里的水量丰沛，宛如大海。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“水渠”的希伯来词含义不确定，也可能泛指沟渠或水道。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本作：“双层建筑的高处由他奠基，就是圣殿围墙高大的扶壁。”现存希伯来文本则说到蓄水池和水渠，两种文本存在显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּדוֹרוֹ
  choice: 在他的时代
  rationale: 该短语在这里表示这位大祭司活动的时期；译为“在他的时代”自然清楚，也不把 דּוֹר 生硬地限定为“世代”。
- source_word: נִכְרָה
  choice: 被开凿出来
  rationale: 这是 כרה 的被动形式，指挖掘或开凿；用于蓄水设施时，“被开凿出来”既准确又符合建筑语境。
- source_word: מִקְוֶה
  choice: 蓄水池
  rationale: 该词本义与水的聚集有关；在本节工程语境中，“蓄水池”能表达人工汇集、储存大量水的设施，同时避免过度确定为某一种特定池型。
- source_word: שִׂיחַ
  choice: 水渠
  rationale: 此词在本处含义不确定，可能泛指沟渠、水道或水流通道；结合前句的蓄水设施，正文采用较自然的“水渠”，并以脚注保留不确定性。
- source_word: כַּיָּם
  choice: 宛如大海
  rationale: 保留希伯来文明确的比喻，表达这项水利设施规模或水量之大。
- source_word: בַּהֲמוֹנוֹ
  choice: 水量充盈
  rationale: הָמוֹן 可表示众多、丰盛，也可带有喧腾之意；在水渠与大海的语境中，“水量充盈”优先呈现数量丰沛的意义，同时不将其解释成海浪声势。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本存在显著差异
  choice: 正文依照现存希伯来文，描述蓄水池和水渠；脚注列出希腊文本的建筑工程异读。
  alternative: 按希腊文本译为：“双层建筑的高处由他奠基，就是圣殿围墙高大的扶壁。”
  rationale: 本项目在《便西拉智训》希伯来文尚存时以希伯来见证为主要依据。希腊文本与其表层内容差异很大，可能反映不同底本或文本发展，因此不应把两者暗中调和；正文保留希伯来文，脚注公开呈现希腊异读。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“被开凿出来”保留原文被动表达；分号呈现两个并列的水利设施意象。“水量充盈，宛如大海”以自然汉语传达原文的丰盛比喻，同时避免把含义不确定的 הָמוֹן 强行解释为“轰鸣”。
