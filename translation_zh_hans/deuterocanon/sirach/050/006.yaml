  text: Like a shining star from among clouds[a], and like the full moon in the days of the feast.
translation:
  language: zh_hans
  text: 如一颗明亮的星从云间显现[a]，又如节期中的满月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“如晨星在一片云中。”希伯来文的说法较为宽泛，意为“如一颗明亮的星从云间显现”。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּכוֹכָב אוֹר
  choice: 如明亮的星
  rationale: כְּ标明比喻，כּוֹכָב意为“星”；אוֹר在此表达光明、发亮。译作“明亮的星”既符合现代汉语，也保留希伯来文本的光亮意象，不按希腊平行文本具体化为“晨星”。
- source_word: מִבֵּין עָבִים
  choice: 从云间显出
  rationale: מִן与בֵּין结合，有“从……之间、从……当中”的意思；עָבִים为“云”。补出“显出”，使汉语中的动态画面自然，并保留星从云间出现的意象。
- source_word: וּכְיָרֵחַ מָלֵא
  choice: 又如……满月
  rationale: וּכְ保留并列的第二个比喻；יָרֵחַ מָלֵא直指月亮圆满，现代汉语自然表达为“满月”。
- source_word: בִּימֵי מוֹעֵד
  choice: 节期之日的
  rationale: מוֹעֵד既可指指定的时日，也可指节期。结合本章礼仪语境及满月意象，译为“节期”最可能；“节期之日”仍保留复数“日子”的表达，不指定某一具体节日。
theological_decisions:
- issue: 采用希伯来文的光亮意象，还是希腊平行文本更具体的“晨星”
  choice: 正文采用“明亮的星”
  alternative: 如晨星在云中
  rationale: 现存希伯来文可信度高，אוֹר表示光或明亮，并未明确表示清晨；因此正文遵从希伯来文。希腊文ἀστὴρ ἑωθινός所见的“晨星”传统则收入脚注，以保留文本差异。
- issue: מוֹעֵד应译为一般的“指定时日”还是礼仪性的“节期”
  choice: 节期
  alternative: 指定的日子
  rationale: 本段描写大祭司及圣殿礼仪，且满月与古代节期历法相关，因此“节期”较合语境；但不进一步指明某个节日，以免超出原文。
translation_notes:
  register: 采用现代、庄重而清楚的诗歌性表达。两个“如”保留原文平行比喻；“从云间显出”以自然汉语呈现מִבֵּין的动态意象。脚注标记[a]已置于相关短语之后。
