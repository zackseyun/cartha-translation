  register: 采用现代、庄重而易懂的智慧文学语体。“训诲”“明达”保持卷末题署的凝练感；家系用破折号嵌入说明，以免中文长串父子关系含混。脚注分别说明疑难词组和希伯来—希腊文本之间的张力。
