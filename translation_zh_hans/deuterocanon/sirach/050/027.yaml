  text: Instruction in understanding and mastery of expression[a], by Shimon son of Yeshua, son of Eleazar son of Sira, who poured forth wisdom from his heart[b].
translation:
  language: zh_hans
  text: 明达的训诲和驾驭表达的本领[a]，出自西缅——他是耶书亚之子、以利亚撒之孙、西拉之曾孙；他从心中倾注出智慧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “驾驭表达的本领”所对应的希伯来语短语含义不确定，也可能指有条理地组织言辞或篇章的能力。
    reason: lexical_alternative
  - marker: b
    text: 此处开罗藏经库希伯来文本的末句难以确定，并且似乎保留了两个动词。希腊平行文本作“从他心中倾注出智慧”；主文据此翻译。
    reason: textual_variant
lexical_decisions:
- source_word: מוּסַר שֵׂכֶל
  choice: 明达的训诲
  rationale: מוּסַר带有塑造人的教导之意，译作“训诲”既庄重又保留智慧文学的劝教色彩；שֵׂכֶל在此限定训诲的性质，译作“明达”较“聪明”更符合书面语境。
- source_word: וּמוֹשֵׁל אוֹפַנִּים
  choice: 和驾驭言辞的本领
  rationale: 这一希伯来语短语含义不确定；מוֹשֵׁל可表示掌管或驾驭，אוֹפַנִּים字面涉及方式、转折或形式。结合整句作为卷末署名的语境，译为熟练组织和运用言辞的能力，同时以脚注保留不确定性。
- source_word: לְשִׁמְעוֹן
  choice: 出自西缅
  rationale: 此处介词לְ在类似题署的结构中最可能标示归属或作者，用“出自”自然表达这种功能，又不把语法关系说得过死。
- source_word: שִׁמְעוֹן / יֵשׁוּעַ / אֶלְעָזָר / סִירָא
  choice: 西缅／耶书亚／以利亚撒／西拉
  rationale: 按希伯来语人名及现代中文圣经语域音译，并依希伯来文本保留其家系次序。
- source_word: נִיבַּע / הִבִּיעַ
  choice: 倾注出
  rationale: 两个动词都与涌出、发出言语有关；主文依希腊平行文本以一个流动意象概括表达，中文“倾注出”兼有丰富涌流和由内而发的意味。
- source_word: בִּפְתוֹר לְבָן ... בִּתְבוּנוֹת
  choice: 从心中……智慧
  rationale: 现存希伯来语组合读法困难，且表面上包含两个分句；希腊平行文本明确作“从他心中倾注出智慧”，故主文采用这一较完整、连贯的古代见证，并在脚注交代希伯来文本的张力。
