  yaml_path: translation/deuterocanon/sirach/050/016.yaml
  text: And they raised a shout and made a mighty sound heard[a], to make remembrance before the Most High.
translation:
  language: zh_hans
  text: 他们高声欢呼，使雄壮的声音被听见，为要在至高者面前作为记念。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要使人想起，呈在至高者面前。”希伯来文的不定式和希腊文平行文本都使用具有礼仪意味的“记念”语言；原文没有明确说明记念的主体或对象。
    reason: 说明礼仪性“记念”的另一种动态表达，并保留原文关于记念主体与对象的开放性。
lexical_decisions:
- source_word: וַיָּרִיעוּ
  choice: 他们高声欢呼
  rationale: 该词在礼仪和公众场景中表示发出响亮的呼声或欢呼；此译保留其隆重的听觉效果，同时不依据希腊文增添希伯来文本未明说的号筒。
- source_word: וַיַּשְׁמִיעוּ
  choice: 使……传扬开来
  rationale: 这是שמע的使役式，意为“使人听见”或“使……被听见”；译文保留使役意味，并使现代汉语自然流畅。
- source_word: קוֹל אַדִּיר
  choice: 雄壮的声音
  rationale: קוֹל既可指嗓音，也可泛指声响；אַדִּיר表达强大、宏伟之意。“雄壮的声音”保留其力度，又不限定为言语或乐器声。
- source_word: לְהַזְכִּיר
  choice: 唤起记念
  rationale: 该使役不定式在献祭礼仪语境中带有使人记起、作为纪念的含义。“唤起记念”保留这一礼仪色彩及其语义张力。
- source_word: לִפְנֵי עֶלְיוֹן
  choice: 在至高者面前
  rationale: עֶלְיוֹן在此是神的尊称，“至高者”准确而庄重；“在……面前”直接对应לִפְנֵי，并符合敬拜场景。
theological_decisions:
- issue: 礼仪语境中“记念”用语的含义
  choice: 为要在至高者面前唤起记念
  alternative: 为要在至高者面前作为纪念
  rationale: 希伯来文使役不定式与希腊文平行文本都保留了礼仪性的记念语言。正文不明确限定是谁记念谁，也不引入后来的教义范畴；脚注列出同样可能的纪念性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“高声欢呼”和“传扬开来”呈现礼仪场面的声势；不采用希腊平行文本中“亚伦的子孙”和“号筒”等希伯来文本没有明说的细节。
