  to: 他们高声欢呼，使雄壮的声音被听见，为要在至高者面前作为记念。[a]
  rationale: 修订将第二个动词译为“使……被听见”，明确保留其使役义；并以“作为记念”表达礼仪性的 memorial 功能。此译不从希腊文平行文本补入“亚伦的子孙”或号筒等希伯来文本未载细节。
