  text: and the offerings of Yahweh were in their hands[a], before all the assembly of Israel.
translation:
  language: zh_hans
  text: 他们手中拿着献给上主的火祭[a]，在以色列全体会众面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“上主的火祭”，指经火献上的祭物；希腊语平行文本较宽泛，作“献给主的祭物”。
    reason: 说明希伯来文祭祀术语的具体含义及希腊语平行文本较宽泛的表达。
lexical_decisions:
- source_word: וְאִשֵּׁי
  choice: 献给……的火祭
  rationale: אִשֵּׁי 特指经火献上的祭物。正文保留希伯来文本较具体的祭祀意象，同时在脚注说明希腊语平行文本采用较宽泛的说法。
- source_word: יְהֹוָה
  choice: 上主
  rationale: 以庄重而通行的现代汉语称谓表达四字神名，避免采用可能引起宗派联想的音译形式。
- source_word: בְּיָדָם
  choice: 他们手中拿着
  rationale: 将希伯来语字面的“在他们手中”自然化为现代汉语，同时保留祭司亲手持着祭物的具体画面。
- source_word: נֶגֶד
  choice: 面对
  rationale: 表达祭礼在全体会众面前公开进行的空间关系，比生硬直译为“在……之前”更符合现代汉语。
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: 以色列全体会众
  rationale: קהל 在公共敬拜语境中指聚集的会众；“全体会众”准确且自然。
theological_decisions:
- issue: 祭祀术语 אִשֵּׁי 的具体程度
  choice: 火祭
  alternative: 祭物
  rationale: 现存希伯来文本明确使用与火献有关的专门术语，因此正文保留其具体含义；希腊语 προσφορά 较宽泛的异文见脚注，不据此削弱希伯来文本。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“拿着”保留仪式动作的具体感，“面对以色列全体会众”呈现公开礼仪场景；正文不补入希伯来短句中没有明说的动作或主体身份。
