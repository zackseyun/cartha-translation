  text: May his mercy remain faithful with Shimon[a], and may he establish for him the covenant of Phinehas[b], which shall not be cut off from him or from his offspring as long as the days of heaven endure.
translation:
  language: zh_hans
  text: 愿他的慈爱在西缅身上坚固[a]；愿他为西缅坚立非尼哈之约[b]。这约必不从他和他的后裔断绝，与天同久。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“愿他把自己的怜悯托付给我们，并愿他在他的日子里救赎我们。”这与现存希伯来文差异很大；希伯来文提到西缅和非尼哈之约。
    reason: alternative_reading
  - marker: b
    text: “非尼哈之约”指向《民数记》25:12—13中赐给非尼哈及其后裔、长久有效的祭司之约。
    reason: cross_reference
lexical_decisions:
- source_word: יֵאָמֵן עִם שִׁמְעוֹן חַסְדּוֹ
  choice: 愿他的慈爱坚定地与西缅同在
  rationale: יֵאָמֵן源于אמן的尼法勒式，表达坚固、可靠或信实；译作“坚定地”保留这一含义，又使现代汉语自然。עִם按通常意义译为“与……同在”；חַסְדּוֹ译作“他的慈爱”，兼顾怜悯、忠贞之爱的语义。
- source_word: שִׁמְעוֹן
  choice: 西缅
  rationale: 采用现代中文圣经语境中通行的音译，并与本章所称的大祭司西缅保持一致。
- source_word: וְיָקֶם
  choice: 愿他……坚立
  rationale: קום的使役式与“约”连用时有设立、确立或维持之意；“坚立”既保留盟约语体，也符合祈愿句。
- source_word: בְּרִית פִּינְחָס
  choice: 非尼哈之约
  rationale: 保留希伯来文的简洁属格结构及其对《民数记》25章祭司之约的暗示。
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  choice: 这约必不……断绝
  rationale: כרת在此为被动式“被剪除、断绝”；“断绝”既自然，也保留盟约与后裔延续的语感。
- source_word: וּלְזַרְעוֹ
  choice: 和他的后裔
  rationale: זֶרַע在谱系语境指后代；译作“后裔”庄重而清楚，不采用容易被现代读者误解为单数的“种子”。
- source_word: כִּימֵי שָׁמָיִם
  choice: 与天同久
  rationale: 希伯来语直译为“如天的日子”，意指长久存续；“与天同久”保留天的意象，并以简洁自然的汉语传达时间意义。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本差异显著
  choice: 正文以现存希伯来文为准，保留关于西缅和非尼哈之约的祈愿。
  alternative: 依希腊文译为：“愿他把自己的怜悯托付给我们，并愿他在那些日子救赎我们。”
  rationale: 此处有高可信度的希伯来文本，故按原文优先原则作为正文依据。希腊文可能反映不同的底本或较自由的传译，其重大差异以脚注说明，不将两种读法混合。
- issue: חסד的盟约性含义
  choice: 译为“慈爱”，并以“坚定地”表达יֵאָמֵן的可靠、信实含义。
  alternative: 合译为“信实的爱”或译作“怜悯”。
  rationale: 分开翻译两个希伯来词，可避免把יֵאָמֵן的语义完全吸收到חסד之中，同时“慈爱”仍可承载怜悯与忠贞之爱的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“坚立”“断绝”“后裔”等词保留盟约语境的分量；“与天同久”保存希伯来诗性意象，避免过度解释。所有脚注标记均已置于正文相应位置。
