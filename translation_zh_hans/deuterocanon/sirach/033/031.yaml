  text: If you have a servant[a], let him be as yourself[b], because you acquired him with blood.
translation:
  language: zh_hans
  text: 你若有家奴[a]，要让他如同你自己，因为你是用血[b]得着了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家奴”所译的希腊词也可指“仆人”或“家仆”；但本句说此人是主人“得着”的，因此其受奴役的身份较为突出。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在血中”或“用血”，可能指付出血的代价；但没有说明是谁的血。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: 家奴
  rationale: 该词可指家中仆役，但本句又说主人“得着”了他，表明其受奴役、隶属于主人的身份。“家奴”既保留家庭成员/家内劳役的语境，也不淡化这种社会现实。
- source_word: ἔστω ὡς σύ
  choice: 要让他如同你自己
  rationale: 贴近希腊文直译“让他如同你”，保留其可能涉及身份看待、处境安排或对待方式的开放性，不扩写为单一解释。
- source_word: ἐν αἵματι
  choice: 用血
  rationale: 保留原文鲜明而含义未完全限定的表达；它可能表示付出血的代价，但原文没有说明是谁的血，也没有明确具体情境。
- source_word: ἐκτήσω
  choice: 得着
  rationale: κτάομαι表示取得、获得；“得着”不强行加入原文没有明说的金钱购买方式，同时适合本句的占有语境。
theological_decisions:
- issue: 奴役身份用语
  choice: 家奴
  alternative: 仆人／家仆
  rationale: 上下文中的“得着”凸显此人的从属和受奴役身份；采用“家奴”以避免用较柔和的“仆人”遮蔽古代社会现实，同时准确反映 οἰκέτης 的家庭语境。
- issue: “如同你自己”的含义
  choice: 保留简洁的比拟表达
  alternative: 要像对待自己一样对待他
  rationale: 原文没有明确只谈主人的对待方式；直译式表达保留伦理要求的力度及其解释空间，不把潜在含义收窄。
- issue: 血的所指
  choice: 不指明是谁的血
  alternative: 用你的血／以性命为代价
  rationale: ἐν αἵματι 本身未限定血的归属或具体事件；保留含混性，避免引入原文未明说的神学或历史解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“你若……，要……”保持智慧文学劝诫的语气；“家奴”准确呈现古代制度现实，“用血得着”则保留原文的凝练意象和真实歧义。
