  text: Do not seek counsel from every man[b][a], but keep one counselor out of a thousand.
translation:
  language: zh_hans
  text: 不要向每个人征询意见[a]，却要在千人中只留一人作你的谋士[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要同每个人商议。”希腊语动词可指征询意见，也可指共同商议。
    reason: lexical_alternative
  - marker: b
    text: “千人中只留一人”是夸张的格言式说法，强调选择谋士必须极其慎重。
    reason: cultural_note
lexical_decisions:
- source_word: μὴ
  choice: 不要
  rationale: 与命令式连用，构成自然明确的否定命令。
- source_word: ἐν παντὶ ἀνθρώπῳ
  choice: 向每个人
  rationale: 结合 συμβούλευε 表达求取意见的对象；ἀνθρώπῳ 在此为泛指，现代汉语用“每个人”自然且准确。
- source_word: συμβούλευε
  choice: 求教
  rationale: 传达向人征询意见、寻求劝告之意，同时以脚注保留“商议”的词义可能。
- source_word: ἀλλὰ
  choice: 却要
  rationale: 清楚呈现否定命令与正面指示之间的转折对照。
- source_word: ἕνα ἐκ χιλίων
  choice: 在千人中只……一人
  rationale: 保留原文“一千人中一个”的强烈筛选意味，并以“只”自然呈现其限制性。
- source_word: σύμβουλον
  choice: 谋士
  rationale: 指提供意见和谋略的人；“谋士”简洁庄重，也与智慧文学的语体相称。
- source_word: ἔχε
  choice: 留……作你的
  rationale: 表达拥有并持续保有一位可信谋士的意思；“留”比单纯的“有”更能体现慎选后保留。
