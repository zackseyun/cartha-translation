translation:
  language: zh_hans
  text: 在你生命的年日终结之日[a]，在死亡的时候，要分配你的产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在你生命的年日终结的日子。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: 在……的那一天
  rationale: 按时间意义理解介词ἐν与与格的搭配；中文用“在……的那一天”自然表达特定时点。
- source_word: συντελείας
  choice: 满了
  rationale: 该词表示完成、终结；“年日满了”既保留原文“完成”的意象，也符合庄重自然的现代汉语。
- source_word: ἡμερῶν ζωῆς σου
  choice: 你一生的年日
  rationale: 保留原文“你生命的日子”这一复数表达，同时用“一生的年日”使中文流畅而庄重。
- source_word: καιρῷ
  choice: ……之时
  rationale: καιρός在这里指特定或合宜的时刻；“之时”简洁地保留其时间含义。
- source_word: τελευτῆς
  choice: 临终
  rationale: 在本语境中指生命的终结或死亡；“临终”与“之时”搭配自然，并避免把原文表达扩展成抽象论述。
- source_word: διάδος
  choice: 分配
  rationale: 这是διαδίδωμι的命令式，表示分发、分给；以“分配”搭配遗产，准确体现将财产分给承受者的行动。
- source_word: κληρονομίαν
  choice: 遗产
  rationale: 此处指在人死前安排给继承人的财产；中文“遗产”比“产业”更直接符合上下文。
