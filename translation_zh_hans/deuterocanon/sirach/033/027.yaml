  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: zh_hans
  text: 轭和皮带必使颈项屈下；作恶的仆人[a]，所受的是刑架和酷刑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”或译“家仆”或“家奴”。希腊文 οἰκέτης 指家中的仆役，也可指处于奴役身份的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: 轭
  rationale: 结合“使颈项屈下”的语境，指套在颈上的轭，而非天平。
- source_word: ἱμάς
  choice: 皮带
  rationale: 指皮制的带子或革条；“皮带”简明保留了具体器物的形象。
- source_word: κάμψουσιν
  choice: 必使……屈下
  rationale: 保留将来时所表达的确定结果，也呈现颈项被压弯、低下的形象。
- source_word: τράχηλον
  choice: 颈项
  rationale: 原文为泛指的单数；“颈项”符合庄重的现代汉语表达。
- source_word: οἰκέτῃ
  choice: 仆人
  rationale: 该词通常指家中的仆役；原文本身未明确限定其法律身份，故正文不强行译作“奴隶”，并以脚注说明另一可能。
- source_word: κακούργῳ
  choice: 作恶的
  rationale: 修饰“仆人”，表示行为恶劣或作恶；此译法避免把含义收窄为法律意义上的“罪犯”。
- source_word: στρέβλαι
  choice: 刑架
  rationale: 该复数名词可指扭拉身体的刑具，尤其是拷问架；汉语用集合性的“刑架”自然地保留具体刑具形象。
- source_word: βάσανοι
  choice: 酷刑
  rationale: 表示严酷的拷打、折磨；“酷刑”保留原文的强烈程度，不弱化为一般惩罚。
theological_decisions:
- issue: οἰκέτῃ所表示的服役身份
  choice: 仆人
  alternative: 家仆、家奴、奴隶
  rationale: οἰκέτης可指家庭中的仆役，也可能处于奴役身份。此节强调强制管束，却未单独说明其确切法律地位，因此正文采用较宽泛的“仆人”，脚注保留“家仆、家奴”的可能，不把社会身份解释得过于确定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“颈项屈下”保留轭所造成的身体姿态；分号呈现原文两个并列箴言式分句。“刑架和酷刑”不淡化经文中严酷的惩罚语言。
