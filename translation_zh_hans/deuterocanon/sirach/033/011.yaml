  text: In the wrath of fire[a], let the one who is saved be consumed[b], and let those who wrong your people find destruction.
translation:
  language: zh_hans
  text: 愿那逃脱的人在火的震怒中被吞噬[a]；愿那些向你子民行不义的人遭遇毁灭。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那逃脱的人”：希腊语也可译作“那正在得救的人”或“幸存者”。此处语境较支持指先前逃脱、后来仍面对审判的人。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希腊文见证与《德训篇》33:11通常预期的经文对应关系存在重大不符；本译文直接依照所提供的希腊文翻译，未与其他文本传统协调。
    reason: textual_variant
lexical_decisions:
- source_word: ἐν ὀργῇ πυρός
  choice: 在烈火的震怒中
  rationale: 保留“震怒”与“火”的属格关系及其不寻常的强烈意象，不武断判定火是震怒的主体还是施行震怒的工具；为使现代汉语自然，将定语次序调整为“烈火的震怒”。
- source_word: καταβρωθήτω
  choice: 愿……被吞灭
  rationale: 以“愿”表达第三人称命令式的祈愿、宣告语气；“吞灭”既保留原词“吞吃”的形象，也符合烈火彻底毁灭的语境。
- source_word: ὁ σωζόμενος
  choice: 那逃脱的人
  rationale: 该现在分词本可指“正在得救的人”或“幸存者”；但在审判语境中，较自然地指先前逃过灾难的人。译文采用“逃脱的人”，同时用脚注保留其真实歧义。
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: 那些欺压你子民的人
  rationale: ἀδικέω在此以“你的子民”为受事，表示对他们行不义；“欺压”是自然、庄重的现代汉语，并明确传达持续施加不义的行为。
- source_word: εὕροισαν ἀπώλειαν
  choice: 愿……遭遇毁灭
  rationale: 以“愿”传达希求式的祈愿语气；汉语“遭遇毁灭”比直译“找到毁灭”自然，同时保留遭逢最终毁灭的含义。
theological_decisions:
- issue: ὁ σωζόμενος在审判语境中的含义
  choice: 译作“那逃脱的人”，理解为逃过先前灾难却仍面对进一步审判的人。
  alternative: 译作“那正在得救的人”或“幸存者”。
  rationale: 希腊语形式本身容许这些解释，且“得救”与“被吞灭”形成尖锐张力。正文按上下文采用“逃脱”，脚注则保留词义和神学张力，不将其消解。
- issue: 所供希腊文本与《德训篇》33:11通常语境存在重大错位
  choice: 直接翻译所提供的希腊文，将其作为审判性的祈愿，不与其他文本传统协调。
  alternative: 采用其他版本或编号传统中《德训篇》33:11的内容。
  rationale: 原文证据优先；在文本对齐被标为重大不符时，不应无声替换或拼合另一传统，而应如实注明。
translation_notes:
  register: 采用现代、庄重而可朗读的祈愿体。两个分句以“愿”平行展开，保持原文的咒诅／审判语气；使用“你子民”呈现λαός的群体含义。脚注标记均置于正文相应位置。
