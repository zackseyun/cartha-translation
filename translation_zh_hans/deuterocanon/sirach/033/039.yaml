  naturalness: “有朋友会转而怀有敌意，并会揭露一场争吵，使你蒙羞”符合现代标准汉语，语气庄重简明，也避免“有一种朋友”可能带来的分类说明式语感。
  terminology: “敌意”恰当保留ἔχθραν的抽象性质；“争吵”可表达μάχην在此社会关系语境中的争执；“蒙羞”适切表达ὀνειδισμοῦ的羞辱／责难含义。
