  text: And there is a friend who changes into enmity[b][a], and he will expose a quarrel to your disgrace.
translation:
  language: zh_hans
  text: 有朋友会转而怀有敌意[a]，并会揭露一场争吵，使你蒙羞[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会变得敌对。”希腊文使用的是抽象名词“敌意”，不是“敌人”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“并会揭露一场使你受责难的争吵。”希腊文措辞简练，重点既可能在争吵被揭露，也可能在它给你带来的羞辱。
    reason: alternative_reading
lexical_decisions:
- source_word: φίλος
  choice: 朋友
  rationale: 取普通的人际关系义，简明自然，也符合智慧文学的社交语境。
- source_word: μεταβαλλόμενος
  choice: 会转为
  rationale: 表达状态发生转变，并保留分词所含的变化过程。
- source_word: εἰς ἔχθραν
  choice: 转为敌意
  rationale: ἔχθρα是抽象名词，意为敌意或仇恨，而非表示人物的“敌人”；译文尽量保留这一形式。
- source_word: μάχην
  choice: 争吵
  rationale: 此处更可能指人际争执，而非实际战斗；“争吵”符合现代汉语和上下文。
- source_word: ὀνειδισμοῦ σου
  choice: 使你蒙羞
  rationale: 该属格短语结构紧凑，可指争吵给对方带来的羞辱或针对对方的责难；正文采用自然汉语表达其羞辱结果。
- source_word: ἀποκαλύψει
  choice: 揭露出来
  rationale: 保留“揭开、显露”的基本意义，并传达怀有敌意者公开争端的负面意味。
