revisions:
- from: 有一种朋友会转为敌意[a]，还会把争吵揭露出来，使你蒙羞[b]。
  to: 有朋友会转而怀有敌意[a]，并会揭露一场争吵，使你蒙羞[b]。
  rationale: 修改“转为敌意”为“转而怀有敌意”，以消除不合汉语的主谓搭配，同时维持原文将状态表述为抽象“敌意”的语义。调整连接词及两条脚注，使表达更自然，并避免将末句理解限定为故意羞辱。
