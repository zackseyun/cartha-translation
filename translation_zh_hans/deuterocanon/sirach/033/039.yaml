    rationale: 原文可指揭露的争吵成为对你的羞辱，不必断定其目的就是羞辱你。应保留“争吵本身”与“所带来羞辱”之间的结构歧义。
  revised_text: 有朋友会转而怀有敌意[a]，并会揭露一场争吵，使你蒙羞[b]。
