lexical_decisions:
- source_word: δόξασον
  choice: 要尊崇
  rationale: 这是 δοξάζω 的命令式，可表达给予荣耀、尊荣。译作“要尊崇”既保留原词的庄重分量，也不把对象的含义进一步解释为能力或权势。
- source_word: χεῖρα
  choice: 手
  rationale: χείρ 的直接含义是“手”；希腊文没有冠词，汉语也无需增添量词或定指成分。
- source_word: βραχίονα
  choice: 臂
  rationale: βραχίων 在这里宜作“臂”，比解剖意味较强的“前臂”更符合圣经文学用语，也保留其可能关联力量的意象。
- source_word: δεξιόν
  choice: 右
  rationale: δεξιόν 修饰 βραχίονα，直译为“右”，组成自然而凝练的“右臂”，不额外解释右侧所可能象征的力量、恩宠或权柄。
