  text: Listen to me[a], you great men of the people, and you leaders of the assembly, give ear.
translation:
  language: zh_hans
  text: 你们这些百姓中的显要人物，要听我说；会众的领袖们，要侧耳倾听。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατέ
  choice: 要听我说
  rationale: 这是ἀκούω的复数第二人称不定过去时命令式，直接呼吁听众留心听；“要听我说”在现代汉语中自然，并保留命令和劝告的语气。
- source_word: μεγιστᾶνες
  choice: 显要人物
  rationale: 该词指地位崇高、颇有权势的人。“显要人物”既表达社会地位，又不额外限定为世袭贵族；汉语无须为准确表达而强加“男人”一词。
- source_word: λαοῦ
  choice: 百姓中的
  rationale: λαός在此指作为社会共同体的百姓；结合汉语习惯，将属格关系译作“百姓中的”，自然表达这些显要人物与百姓群体的关系。
- source_word: ἡγούμενοι
  choice: 领袖
  rationale: 该分词指带领或主持的人；“领袖”清楚表达其领导身份，又不把他们过度界定为统治者或特定官职。
- source_word: ἐκκλησίας
  choice: 会众
  rationale: 在本处指聚集的群体或大会，并非特指后来制度化的基督教会；“会众”保留共同聚集之意，也避免译成“教会”所可能带来的时代错置。
- source_word: ἐνωτίσασθε
  choice: 要侧耳倾听
  rationale: 该命令式含专心聆听之意。“侧耳倾听”保留与前句听觉动词的修辞呼应，也比单纯重复“听”更能体现加强语气。
theological_decisions:
- issue: 对男性社会显贵的称呼
  choice: 你们这些百姓中的显要人物
  alternative: 百姓中的显贵男子；百姓中的尊贵者
  rationale: μεγιστᾶνες为语法上的阳性复数，并在古代语境中通常指男性显贵；但现代汉语的“显要人物”本身可自然指该群体，而加译“男子”会比希腊语的实际表达更突兀。译文不刻意中性化其历史所指，也不在正文中强化原文未明说的生理性别。
- issue: ἐκκλησία的译法
  choice: 会众
  alternative: 集会；大会；教会
  rationale: 这里强调聚集的群体及其领袖，不要求理解为后来制度化的基督教会。“会众”兼顾群体性与宗教智慧文学语境，同时避免时代错置。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。两个命令式分别译为“要听我说”和“要侧耳倾听”，保留原文的平行与递进；分号划分两组受呼语，使句子层次清楚。
