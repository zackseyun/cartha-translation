  text: Put him to work, so that he may not be idle;
translation:
  language: zh_hans
  text: 要让他做工，免得他闲着；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: 要让
  rationale: ἐμβάλλω本义有“投入”之意，但与εἰς ἐργασίαν连用时表示使某人开始或从事工作。“要让”以自然的现代汉语保留命令语气。
- source_word: αὐτὸν
  choice: 他
  rationale: 该词为阳性单数宾格，按上下文指前文所说的男性奴仆，因此译作“他”。
- source_word: εἰς ἐργασίαν
  choice: 做工
  rationale: ἐργασία可指工作、劳作；在此与ἔμβαλε构成“让他做工”的惯用表达，既准确又自然。
- source_word: ἵνα μὴ ἀργῇ
  choice: 免得他闲着
  rationale: ἀργέω意为闲着、无所事事或不工作。“闲着”直接表达缺少劳作的状态，不额外加入“懒惰”的道德评价；“免得”简洁保留目的或防范意味。
theological_decisions:
- issue: 奴役语境中阳性单数受事者的表达
  choice: 他
  alternative: 不明示性别或译作“他/她”
  rationale: 希腊文代词为阳性单数，且上下文所指为男性奴仆；保留“他”忠实反映原文的语法与社会语境，而不将其性别中性化。
- issue: ἔμβαλε εἰς ἐργασίαν的直译程度
  choice: 要让他做工
  alternative: 把他投入劳作中
  rationale: 原表达字面带有“投入工作”的形象，但现代汉语直译显得生硬。“要让他做工”以对等且清楚的方式保存其命令含义。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语。“做工”符合本段劳役语境；“闲着”不将原文可能只是无事可做的状态强化为品格上的懒惰。分号承接原文句末标点，并表明经文可能仍与下句相连。
