    issue: 末句将τῶν ἰδίων σου译为“你自己的人和物”，并用“疏离”统摄。
    rationale: 原文仅称“属于你自己的（事物／人）”，并未作“人和物”的二分；汉语中“与物疏离”也不自然。改为“使你脱离属于自己的一切”既可表达ἀπαλλοτριώσει的被隔绝、被剥离之意，也保留所指的歧义。
  revised_text: 让一个外人寄居在你这里[a]，他就会使你陷入纷乱，并使你脱离属于自己的一切。
