  text: Settle a stranger with you[a], and he will throw you into turmoil, and estrange you from your own.
translation:
  language: zh_hans
  text: 让一个外人寄居在你这里[a]，他就会使你陷入纷乱，并使你脱离属于自己的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外人”也可译作“陌生人”；“属于自己的一切”原文直译为“属于你自己的”，可指自己人、家人、家中事物或财物。
    reason: 说明ἀλλότριον及τῶν ἰδίων σου的词义范围，并保留原文末语的歧义。
lexical_decisions:
- source_word: παροίκισον
  choice: 让……寄居在你这里
  rationale: 这是使役性命令，指让某人在自己身边以寄居者身份住下；此译既保留“寄居”的身份色彩，也符合现代汉语表达。
- source_word: ἀλλότριον
  choice: 一个外人
  rationale: 该词指属于别处、非自己圈内的人；“外人”不把含义限于族裔或国籍，也适合本节家庭与所属范围的语境。
- source_word: διαστρέψει σε ἐν ταραχαῖς
  choice: 使你陷入纷乱
  rationale: διαστρέφω在这里结合ἐν ταραχαῖς，重点是搅乱、扰乱，而非道德意义上的“败坏”；合译为“使你陷入纷乱”自然地表达由此造成的动荡。
- source_word: ἀπαλλοτριώσει σε
  choice: 使你……疏离
  rationale: 该动词有使人成为外人、使疏远或隔离之意；“使……疏离”保留关系或归属遭破坏的意味。
- source_word: τῶν ἰδίων σου
  choice: 与你自己的人和物
  rationale: 希腊文实为宽泛的“属于你自己的”，可指自己人、家人、家中事物或财物。正文用“人和物”保留其开放范围，避免只落实为亲属或财产。
