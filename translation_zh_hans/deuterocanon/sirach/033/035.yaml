review_pass:
  verdict: revise
  source_fidelity: 译文总体准确呈现命令句、随后的两个结果，以及末语τῶν ἰδίων σου刻意宽泛的所指。惟“使你与你自己的人和物疏离”把希腊文抽象而开放的“你的所有／属于你的事物”明确拆作“人和物”，既显得累赘，也使与“物”搭配的“疏离”不够贴切。
  naturalness: “让一个外人寄居在你这里”与“使你陷入纷乱”均可理解，但末句搭配不够自然。改作“使你脱离属于自己的一切”更合乎现代汉语，且保留原文的范围未定性。
  terminology: “外人”适当地传达ἀλλότριον为非己方圈内者，未将其误限为外国人；“寄居”也保留παροίκισον的使役性居住含义。末语不应在正文中固定为家人或财物，脚注说明其可涵盖的范围即可。
  issues:
