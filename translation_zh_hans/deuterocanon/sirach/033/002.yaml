  yaml_path: translation/deuterocanon/sirach/033/002.yaml
  text: One who hates instruction will not become wise[b][a], and he is tossed about in a storm like a ship.
translation:
  language: zh_hans
  text: 憎恶训诲的人不会变得有智慧[a]；他在风暴中像船一样颠簸不定[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训诲”也可译作“律法”或“教导”；希伯来语“妥拉”（תורה）可有这些含义。
    reason: lexical_alternative
  - marker: b
    text: 资料所附的希腊文平行文本似乎属于另一行，与本节希伯来文本不符；这里采用语意连贯且可信度高的希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: שׂוֹנֵא
  choice: 憎恶……的人
  rationale: 希伯来语分词在此作名词用，刻画一类主动厌恶训诲的人；“憎恶……的人”自然且保留了强烈语气。
- source_word: תוֹרָה
  choice: 训诲
  rationale: 在《便西拉智训》的智慧文学语境中，该词可泛指教导、训诲，也可指律法；正文用“训诲”以免将意义局限于法典，脚注保留“律法”这一可能。
- source_word: יֶחְכַּם
  choice: 不会有智慧
  rationale: 该未完成式表达不能达到明智状态或结果；“不会有智慧”是自然的现代汉语，并体现智慧无法形成的结果。
- source_word: מִתְמוֹטֵט
  choice: 摇摆不定
  rationale: 该词在风暴与船的比喻中表示因外力而动摇、不稳；“摇摆不定”既保留动态，也传达缺乏稳固的含义。
- source_word: בְּמִסְעָר
  choice: 在风暴中
  rationale: 直接表达暴风雨的环境，与船的比喻自然衔接。
- source_word: כָּאֳנִיָּה
  choice: 如同一艘船
  rationale: 忠实保留明喻；“船”比“舟”更符合现代标准汉语，也适合风暴中的航行意象。
theological_decisions:
- issue: 智慧语境中 תורה 的含义
  choice: 训诲
  alternative: 律法；教导
  rationale: 本句是智慧性的格言，“训诲”较能保留广义的教导含义，又不排除该词与律法传统的联系；“律法”作为真实的词义可能列入脚注。
- issue: 希伯来文本与所附希腊平行文本严重不符
  choice: 以连贯且高可信度的希伯来见证为正文依据
  alternative: 依所附希腊文本改译，或因差异而不直接翻译本句
  rationale: 所附希腊文“要垂顾，并使你的威严临到万国”显然反映另一行内容，不能校正本句；现存希伯来文本语义完整，因此据其翻译，同时用脚注如实说明文本差异。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“憎恶训诲”保留原文的强烈伦理判断；后半句以简洁的船与风暴意象呈现人的不稳定。所有脚注标记均置于相关正文之后。
