lexical_decisions:
- source_word: πλὴν σοῦ
  choice: 除你以外
  rationale: 准确表达排他性的“except you”，同时保留原文直接对上帝说话的语气。
- source_word: ἐγκαίνισον
  choice: 更新
  rationale: 保留“使之更新、重新施行”的基本含义，不把它弱化为单纯的“显出”。
- source_word: σημεῖα
  choice: 征兆
  rationale: 与后面的“奇事”区分，并保留 σημεῖον 作为可辨认记号的语义。
- source_word: ἀλλοίωσον
  choice: 变换
  rationale: 保留“使之不同、改变”的明确动作，避免擅自解释成“增多”或“再显”。
- source_word: θαυμάσια
  choice: 奇事
  rationale: 用庄重而通俗的表达呈现“令人惊奇的作为”，并与“征兆”形成原文的平行结构。
theological_decisions:
- issue: 独一神宣告的排他性
  choice: 除你以外，再没有神
  alternative: 唯有你是神
  rationale: 前者更贴近 οὐκ ἔστι θεὸς πλὴν σοῦ 的存在句结构，也不削弱其明确的排他性。
- issue: “更新征兆、变换奇事”的含义
  choice: 保留两个祈使动词及其语义差异
  alternative: 合并为“再施神迹奇事”
  rationale: 原文有两个不同的动词和两个相应名词；合并会消除原有的诗性平行与“更新/改变”之间的张力。
translation_notes:
  register: 采用现代、庄重、适合朗读的标准普通话。“主啊”保留呼告语气；两个祈使句用“求你”统领，使中文自然，同时不削弱命令式祈祷的力度。
