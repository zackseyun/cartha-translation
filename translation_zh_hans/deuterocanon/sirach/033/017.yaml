base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/017.yaml
  text: Have mercy on the people[a], O Lord, who are called by your name, and on Israel[b], whom you made equal to a firstborn son.
translation:
  language: zh_hans
  text: 主啊，求你怜悯那称为你名下的百姓[a]，也怜悯以色列，求你使他如同长子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称为你名下”是圣经中的惯用语，表示这百姓以神的名被识别，归属于神。
    reason: cultural_note
  - marker: b
    text: 本节末尾的希腊语句法较为生硬。现存词形最直接可译为新的祈求：“求你使他如同长子”；也有人把它理解为描述神先前对以色列的看待：“你曾使他如同长子。”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  choice: 求你怜悯
  rationale: 这是不定过去时命令式，在祷告中表达直接而恳切的请求；“求你怜悯”自然保留了祈求语气。
- source_word: λαόν
  choice: 百姓
  rationale: 指作为整体的群体；上下文所指是属神的约民，但原文没有明说“你的”，因此不在译文中增补。
- source_word: Κύριε
  choice: 主啊
  rationale: 呼格形式，译作“主啊”符合现代汉语祷告中的庄重称呼。
- source_word: κεκλημένον ἐπ᾽ ὀνόματί σου
  choice: 称为你名下的
  rationale: 保留圣经惯用语，表达这百姓以神的名被识别、归属于神；脚注说明其含义，避免在正文中过度释义。
- source_word: Ἰσραὴλ
  choice: 以色列
  rationale: 采用现代简体中文通行专名。
- source_word: ὃν
  choice: 他
  rationale: 阳性单数关系代词指向作为整体的“以色列”；汉语以“他”体现民族的集合单数指称。
- source_word: πρωτογόνῳ
  choice: 长子
  rationale: 与格用于比较对象，指长子的身份或地位；汉语“长子”已可自然表达，无须增补原文未明说的“儿子”。
- source_word: ὁμοίωσον
  choice: 求你使……如同
  rationale: 现存希腊文本的词形是第二人称单数不定过去时主动命令式，最直接应译为新的祈求，而非过去行动；“使……如同”也保留ὁμοιόω所表达的类比关系。
theological_decisions:
- issue: 以色列的“长子”地位
  choice: 将ὁμοίωσον按现存词形译为祈使语气：“求你使他如同长子。”
  alternative: 将末句理解为描述神以往对以色列的作为：“你曾使他如同长子。”
  rationale: ὁμοίωσον本身明确呈祈使词形，故正文优先忠实呈现祈求；但ὃν引出的结构较为生硬，且“以色列如长子”会令人联想到既有的圣经身份表述，因此以脚注保留另一种句法理解，不消除原文张力。
- issue: “称为你名下”的归属含义
  choice: 正文保留惯用语，不直接改写成“属于你的”。
  alternative: 意译为“归属于你的百姓”。
  rationale: 保留原文关于“名”的意象，同时用脚注帮助普通读者理解其所表达的归属与认同。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主啊，求你……”符合普通话自然表达；“称为你名下”刻意保留圣经意象，并由脚注解释。末句按希腊语祈使词形处理，同时用脚注保存句法歧义。
