base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/001.yaml
  text: One who fears Yahweh will not meet with evil[a], for even in trial he will turn back and escape.
translation:
  language: zh_hans
  text: 敬畏雅威的人不会遭遇灾祸；即使在考验中[a]，他也会回转，得以脱险。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文本较难确定，尤其是译作“在考验中”的一语；也可能理解为“在逃亡时”。后半句或可译作：“但他在逃亡时，会回转并脱险。”现存对应的希腊语材料与本节内容不相符，不能用来解决这一疑难。
    reason: 说明文本疑难及另一种可能读法
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: 敬畏雅威的人
  rationale: 希伯来语分词式表达指以敬畏雅威为特征的人；译文保留单数代表性，并以自然现代汉语表达。
- source_word: לֹא יִפְגַּע רָע
  choice: 不会遭遇灾祸
  rationale: פגע在此表示遇到、碰上，רָע既可指恶，也可指不幸或灾害；上下文谈考验与脱险，因此译作“灾祸”，但不强化为绝对不受任何苦难。
- source_word: כִּי אִם
  choice: 即使……也
  rationale: 此处承接前句并加以限定，表达敬畏者仍可能经历考验，却能脱险的让步关系。
- source_word: בְּנוּסוֹ
  choice: 在考验中
  rationale: 该词文本和词源解释存在困难；按“试验、考验”理解最能与本节智慧文学语境衔接，但在脚注保留“逃亡时”的可能读法。
- source_word: שָׁב
  choice: 回转
  rationale: שוב通常意为返回、回转；此处不明确表示悔改，因此不用带有更强宗教含义的“悔改”。
- source_word: וְנִמְלָט
  choice: 得以脱险
  rationale: נמלט表示逃脱或获救；“得以脱险”在汉语中自然，也保留被救出的含义而不明说施救者。
theological_decisions:
- issue: 神名יְהֹוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”较直接地传达该专名，不以称号替代。
- issue: 敬畏者与灾祸的关系
  choice: 不会遭遇灾祸；即使在考验中……也会……脱险
  alternative: 绝不会受到任何伤害
  rationale: 后半句仍承认考验和危险的存在；译文保留箴言式确信与现实考验之间的张力，不把本节解释成免受一切苦难的绝对保证。
- issue: שָׁב是否指悔改
  choice: 回转
  alternative: 悔改
  rationale: 本句没有足够依据把普通的“返回、回转”限定为宗教意义上的悔改，因此采用较宽泛的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“敬畏雅威的人”保留智慧文学中典型人物的代表性表达；分号呈现两分句间既对照又互相限定的关系。正文中的[a]与脚注标记一致。
