  yaml_path: translation/deuterocanon/sirach/033/030.yaml
  text: Set him to work as is fitting for him[a], and if he does not obey, make his fetters heavy; but do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: zh_hans
  text: 要按适合他的方式派他做工；如果他不服从，就加重他的脚镣。但对任何血肉之躯[a]都不要过分；凡事都不要未经判断便去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“任何人”。希腊文直译为“任何血肉”。
    reason: 说明ἐν πάσῃ σαρκί的惯用人称含义，同时保留正文的原文意象。
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: 派他做工
  rationale: κατάστησον含有安置、指派之意，εἰς ἔργα指向劳作或任务；“派他做工”在现代汉语中自然，并保留命令语气。
- source_word: καθὼς πρέπει αὐτῷ
  choice: 按适合他的方式
  rationale: πρέπει表示合宜、适合；此译保留“对他而言合适”的意思，同时与中文动词短语顺畅衔接。
- source_word: κἂν μὴ πειθαρχῇ
  choice: 如果他不服从
  rationale: πειθαρχέω指服从权威或命令；原文未明说“管教”，因此不将其补入正文。κἂν在此按条件句自然译为“如果”。
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: 加重他的脚镣
  rationale: βάρυνον直指使之沉重，πέδαι是束缚双脚的镣铐；“加重他的脚镣”既贴近字面，也不淡化原文的强制性。
- source_word: μὴ περισσεύσῃς
  choice: 不要过分
  rationale: περισσεύω在否定命令中表示越过适当限度；“不要过分”简明地保留警戒意味。
- source_word: ἐν πάσῃ σαρκί
  choice: 对任何血肉之躯
  rationale: σάρξ字面为“肉身、血肉”，此处代指人；正文保留原文具体意象，以“血肉之躯”使现代中文可理解，并在脚注注明惯用义。
- source_word: ἄνευ κρίσεως
  choice: 未经判断
  rationale: κρίσις可指判断、审断或辨别；“未经判断”保留其语义宽度，不擅自限定为司法审判或个人慎思。
- source_word: μὴ ποιήσῃς μηδέν
  choice: 凡事都不要……便去做
  rationale: 该否定结构表达任何事都不可如此行；采用自然中文语序，保留禁令的全面性。
theological_decisions:
- issue: 涉及受役者劳动、服从和脚镣的严厉训诫
  choice: 直译做工、服从和脚镣等强制性措辞，不作委婉化处理
  alternative: 将其泛化为服务、接受教导和约束
  rationale: 希腊文本明确涉及劳动安排与身体束缚。忠实翻译应呈现文本本身令人不安的社会伦理现实，而不是借现代措辞将其软化。
- issue: “任何血肉”在警戒语中的含义
  choice: 正文译作“任何血肉之躯”，脚注说明可译“任何人”
  alternative: 正文直接译作“任何人”
  rationale: 该短语在语境中指任何人，但保留“血肉”的具体措辞，可呈现原文从严厉惩戒转向限制过度行为时的张力。
- issue: κρίσις所指的判断性质
  choice: 保留为一般性的“判断”
  alternative: 具体译为“公正审判”或“慎重考虑”
  rationale: 原文并未明确限定为司法裁决、道德辨别或审慎考虑，故不替文本消除这层歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。分号保留两组命令之间的逻辑推进；“脚镣”明确呈现πέδαι的身体束缚含义；不添加原文没有的“管教”“公正”等解释性成分。
