  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: zh_hans
  text: 草料、棍棒和重担，是给驴的；饼、管教和劳作，是给家奴的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家奴”或译“家仆”；希腊文特指家中的奴隶或仆役。
    reason: 说明οἰκέτης兼有家庭从属与奴役身份的词义范围。
lexical_decisions:
- source_word: χορτάσματα
  choice: 草料
  rationale: 指喂牲畜的饲料；“草料”自然贴合驴的具体形象，也保留了复数名词的集合意义。
- source_word: ῥάβδος
  choice: 棍杖
  rationale: 本句语境指驱策或管束牲畜的棍杖，不是供行走倚靠的手杖；“棍杖”保留其实际用途而不过度释为惩打。
- source_word: φορτία
  choice: 重担
  rationale: 指驮畜所负载的东西；“重担”既具体表达驴所驮之物，也保留原词所含的负荷意味。
- source_word: ὄνῳ
  choice: 给驴的
  rationale: 与本句省略系词的箴言式并列结构相符，自然表达与格所指的对象。
- source_word: ἄρτος
  choice: 饼
  rationale: 原文具体为“饼、面包”，不泛化为“食物”；“饼”符合古代主食语境，并为现代读者所理解。
- source_word: παιδεία
  choice: 管教
  rationale: 此词兼有教导、训练、规训和纠正之意；在家庭管理语境中，“管教”能同时体现塑造与约束，不局限于惩罚。
- source_word: ἔργον
  choice: 劳作
  rationale: 指所做的工作或劳动；“劳作”在此与供养和管教并列，简洁而有箴言体色彩。
- source_word: οἰκέτῃ
  choice: 家奴
  rationale: οἰκέτης特指家中的奴隶或受役使的仆役；“家奴”同时保留家庭归属和不自由的社会身份，避免较柔化的“仆人”。
theological_decisions:
- issue: οἰκέτῃ在家庭从属语境中的身份表达
  choice: 家奴
  alternative: 仆人／家仆
  rationale: 原词所指不仅是一般服务者，而是隶属于家庭、受主人支配的奴仆。译作“家奴”不淡化其受奴役的社会现实；脚注同时说明词义范围，以保留“家庭仆役”的可能表述。
- issue: παιδεία是否仅指惩罚
  choice: 管教
  alternative: 教导／训练／惩戒
  rationale: 原词语义范围包含教育、训练与纠正。译作“管教”保留这种张力，既不削弱其约束意味，也不把它收窄为肉体惩罚。
translation_notes:
  register: 采用简洁、对称的箴言体。“草料、棍杖和重担”与“饼、管教和劳作”形成三项并列；两次使用“是给……的”补足希腊文省略的系词，使现代汉语自然清楚，同时保留原句鲜明而令人不安的社会等级观念，不加以美化或神学化解释。
