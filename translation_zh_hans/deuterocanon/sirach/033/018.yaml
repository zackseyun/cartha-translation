  text: Understand that I have not labored for myself alone[a], but for all who seek instruction.
translation:
  language: zh_hans
  text: 你们要明白：我辛劳，并非单为自己，而是为所有寻求教诲[a]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “教诲”也可译作“管教”或“训练”；原词可兼指知识上的教导和品格上的塑造。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: 你们要明白
  rationale: 该词是复数不定过去时命令式，要求听众领会并认清所说的要点；“你们要明白”既明确表达复数对象，也保留命令语气。
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: 不只是为我自己
  rationale: 与格在此表示受益者或所为对象，μόνῳ突出“仅仅、单独”；此译自然表达辛劳并非只为说话者自身。
- source_word: ἐκοπίασα
  choice: 我辛劳
  rationale: κοπιάω表示付出艰苦劳动、劳苦；“辛劳”庄重而简洁，并保留劳动强度。希腊语为简单过去时，中文无需强行标示完成体。
- source_word: ἀλλὰ πᾶσιν τοῖς ζητοῦσιν
  choice: 也是为所有寻求……的人
  rationale: ἀλλά在“不是……而是/也是……”结构中形成转折扩展；“所有……的人”保留其包容性和泛指意义，ζητοῦσιν译作“寻求”保留主动追求的意味。
- source_word: παιδείαν
  choice: 教诲
  rationale: παιδεία可涵盖教导、管教、训练及道德塑造；“教诲”在现代中文中自然庄重，也比“教育”少制度色彩，但仍不足以独自呈现该词全部范围，故加脚注。
