lexical_decisions:
- source_word: σπεῦσον
  choice: 催促……来到
  rationale: 这是表示急切行动的不定过去时命令式。结合“时刻”作宾语，译为“催促那时刻来到”比单说“赶快”更自然，并保留祈求其加速实现的含义。
- source_word: καιρόν
  choice: 那时刻
  rationale: καιρός可指适宜或指定的时机。“那时刻”简洁自然，也不把“指定的”这一可能但并非明说的意味写入正文。
- source_word: μνήσθητι
  choice: 记念
  rationale: 这是μιμνῄσκομαι的不定过去时中间语态命令式。“记念”在向上帝祈求的语境中庄重自然，并保留直接命令或恳求的语气。
- source_word: ὁρκισμοῦ
  choice: 那誓言
  rationale: ὁρκισμός指誓言或起誓所作的承诺。“那誓言”保留定指意味，不进一步解释其具体内容。
- source_word: ἐκδιηγησάσθωσαν
  choice: 愿人述说
  rationale: 第三人称命令式表达愿望或吩咐，动词含详述、传讲之意。“愿人述说”既传达祈愿语气，也避免在希腊文未明示主语所指时擅自指定具体群体。
- source_word: τὰ μεγαλεῖά σου
  choice: 你的大能作为
  rationale: 中性复数在希腊圣经语境中常指彰显伟大能力的作为。“大能作为”是现代汉语中自然而庄重的表达，胜过生硬直译为“你的伟大之事”。
theological_decisions:
- issue: 第二人称所指及赞美用语
  choice: 按对上帝的祈求来译，但正文只保留“你／你的”，不增添“上帝”等称号。
  alternative: 将其处理为对象不明的泛称呼语。
  rationale: 记念誓言和述说“大能作为”的措辞符合希腊圣经中向上帝祷告的语言；不过原文没有明说称号，因此不在正文中补出。
- issue: 因校验标记产生的文本不确定性
  choice: 依所提供的现存希腊文本翻译，并用脚注披露文本不确定性。
  alternative: 根据推测的希伯来底本改写或校订正文。
  rationale: “major_mismatch”表明来源校验存在重大不一致，但没有足够证据支持具体校勘重构；因此忠实翻译现有希腊文字，同时明确提示读者。
- issue: ἐκδιηγησάσθωσαν隐含主语的身份
  choice: 译作不特指的“人”，不判定究竟是哪一群人。
  alternative: 译作“他们”，并假定上下文已有明确先行词。
  rationale: 该动词为第三人称复数，但本节自身未明示主语。汉语“愿他们述说”若脱离清楚的先行词会显得悬空；“愿人述说”保留复数主体不确定的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“求你”将希腊文连续命令式在汉语中的恳求功能自然表达出来；分号呈现祈求与其结果或目的之间的推进。所有脚注标记均置于正文，其中词义脚注[b]紧随“誓言”后的分句末，文本批判脚注[a]随后列出，以对应所给审校层的标记安排。
