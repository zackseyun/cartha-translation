  yaml_path: translation/deuterocanon/sirach/033/022.yaml
  text: For it is better that your children should have need of you than that you should look to the hands of your sons[a].
translation:
  language: zh_hans
  text: 因为，儿女需要你，总比你仰望儿子们的手好[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可意译为“总比你依靠儿子们好”。希腊文直译为“仰望儿子们的手”；“手”在这里形象地表示供养或扶助。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: 胜过
  rationale: 在“甲胜过乙”的比较结构中自然表达更可取、更有利之意。
- source_word: τὰ τέκνα
  choice: 你的儿女
  rationale: τέκνα是泛指子女的较宽用语；译作“儿女”保留其范围，并与后文特指男性后代的υἱῶν相区别。
- source_word: δεηθῆναί σου
  choice: 需要你
  rationale: δέομαι接属格可表示需要某人、依赖某人；“需要你”在现代汉语中简明自然，也保留关系上的倚赖意味。
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: 仰望……的手
  rationale: 原文具体意象是朝着他人的手看，语境中暗含指望其供给或扶助；正文保留“手”的意象，并用脚注说明其含义。
- source_word: υἱῶν σου
  choice: 你儿子们
  rationale: υἱῶν明确指儿子；保留它与前文τέκνα“儿女”的措辞转换。
