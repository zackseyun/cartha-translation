  text: Crush the heads of the rulers of the enemies[a], who say[b], “There is no one except us.”
translation:
  language: zh_hans
  text: 击碎敌人首领的头颅；他们说：“除我们以外，再没有谁。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“唯有我们。”这同样表达原文狂妄的排他宣称，但措辞更凝练。
    reason: lexical_alternative
  - marker: b
    text: 本节希腊文的来源核验被标记为“重大不一致”；本译文依照所提供的《七十士译本》希腊文措辞翻译。
    reason: textual_variant
lexical_decisions:
- source_word: σύντριψον
  choice: 击碎
  rationale: 这是 συντρίβω 的不定过去时命令式，表达猛烈打碎、粉碎之意。“击碎”既保留命令语气和强烈动作，也符合现代汉语的庄重表达。
- source_word: κεφαλὰς
  choice: 头颅
  rationale: κεφαλή 的复数，原文使用具体而强烈的身体意象。“头颅”比泛化为“权势”或“首脑”更忠实地保留这一意象。
- source_word: ἀρχόντων
  choice: 首领
  rationale: ἄρχων 指掌权者、统治者或领袖。此处与“敌人”相连，“首领”自然明白，也不把其身份过度限定为君王或行政统治者。
- source_word: ἐχθρῶν
  choice: 敌人
  rationale: 属格最自然地表示这些首领属于或代表敌对群体。“敌人首领”保留原文关系，同时符合简洁的现代汉语。
- source_word: λεγόντων
  choice: 他们说
  rationale: 现在分词描写这些首领（语法上也可能与同为属格复数的“敌人”相连）的持续特征。用“他们说”行文自然，而代词也没有不必要地彻底排除这一语法张力。
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: 除我们以外，再没有谁
  rationale: πλήν 加属格表示排除，即除“我们”之外没有别人。译文保留其自夸和排他的口吻，而不改写为比较性的“没有谁像我们”。
theological_decisions:
- issue: 敌人宣称的所指与语气
  choice: 译作排他性的狂妄宣称：“除我们以外，再没有谁。”
  alternative: “没有谁像我们”或“唯有我们”
  rationale: 希腊文直接表达的是排除，而非明确的相似性比较。译文保留其傲慢语气，但不擅自断定这是关于神性、政治权力或民族地位的特定主张。
- issue: λεγόντων 所修饰的对象
  choice: 正文用“他们”承接“敌人首领”，同时不重复名词，以免过度限定。
  alternative: 明确译作“那些首领说”或“敌人说”
  rationale: “首领”和“敌人”在希腊文中都是属格阳性复数，分词在形式上可与二者相应；按语序和意义，理解为首领所说最自然，但译文避免添加原文没有的绝对消歧。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留原文“击碎……头颅”的强烈意象和命令语气，不作弱化或寓意化处理；“除我们以外，再没有谁”自然清楚，并维持原句的神学张力与狂妄口吻。
