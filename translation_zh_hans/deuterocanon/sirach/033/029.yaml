  text: 因为闲散教人作许多恶事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὴν
  choice: 许多
  rationale: 修饰单数名词 κακίαν，表示程度或数量之多；汉语用“许多恶事”自然地传达其量多的含义。
- source_word: γὰρ
  choice: 因为
  rationale: 承接上下文，说明前述劝诫的理由；“因为”在现代汉语中清楚自然。
- source_word: κακίαν
  choice: 恶事
  rationale: κακία 可泛指邪恶、恶行或败坏；“恶事”保持宽泛的道德含义，也与“许多”搭配自然，不把语义局限为恶意或某种特定恶习。
- source_word: ἐδίδαξεν
  choice: 教会了
  rationale: 保留原文把闲散人格化为教师的修辞；希腊语不定过去时在此表达格言式经验，汉语“教会了”简洁自然。
- source_word: ἡ ἀργία
  choice: 闲散
  rationale: ἀργία 指无所事事、闲置不做工；“闲散”比“懒惰”少一层直接的品格定罪，也比“无所作为”更凝练。
- source_word: implicit object of ἐδίδαξεν
  choice: 人
  rationale: 希腊语“教导”在此未明说受教对象；汉语若直译为“闲散教会了许多恶事”不够自然，因此补出泛指的“人”，不限定具体对象。
