  text: In all your works be preeminent[b][a]; do not give a blemish to your honor.
translation:
  language: zh_hans
  text: 在你所做的一切事上，都要出类拔萃[a]；不要使你的声誉蒙上污点[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出类拔萃”也可译作“胜过众人”或“表现卓越”。
    reason: lexical_alternative
  - marker: b
    text: “声誉”也可译作“荣誉”或“荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: 在你所做的一切事上
  rationale: πᾶσι 表示范围周全，ἔργοις 指行为、工作或所做的事；此译既保留原意，也符合现代汉语表达。
- source_word: γίνου
  choice: 要
  rationale: γίνου 是 γίνομαι 的现在时命令式，在这里用于劝勉人保持某种表现；汉语用“要”配合后面的状态性成语，比直译为“成为”自然。
- source_word: ὑπεράγων
  choice: 出类拔萃
  rationale: 该词在此有超过一般水平、表现卓越之意；“出类拔萃”准确传达褒义和超越性，同时自然庄重。
- source_word: μὴ δῷς
  choice: 不要使……蒙上
  rationale: μή 加不定过去时虚拟式构成禁止语气。结合 μῶμον 的污点比喻，译作“不要使……蒙上”比逐字译为“不要给”更符合汉语习惯。
- source_word: μῶμον
  choice: 污点
  rationale: μῶμον 可指瑕疵、责难或耻辱；“污点”保留具体比喻，并能自然搭配声誉。
- source_word: ἐν τῇ δόξῃ σου
  choice: 你的声誉
  rationale: δόξα 在本节智慧伦理语境中主要指他人所给予的评价、尊荣或名声；“声誉”切合避免因行为招致非议的语境，同时以脚注保留“荣誉／荣耀”的词义可能。
theological_decisions:
- issue: 智慧伦理语境中 δόξα 的译法
  choice: 声誉
  alternative: 荣誉；荣耀
  rationale: 上下文聚焦个人行事及其可能招致的污点，因此“声誉”最自然地表达社会评价层面的含义；“荣耀”可能使现代读者误以为这里专指神学意义上的荣耀，但原词的较宽词义仍在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学劝诫语体。前半句用成语凝练表达 ὑπεράγων 的卓越和超越意味；后半句保留“污点”的形象比喻，并避免把 δόξα 过度神学化。
