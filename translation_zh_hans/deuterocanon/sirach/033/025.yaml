  yaml_path: translation/deuterocanon/sirach/033/025.yaml
  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: zh_hans
  text: 草料、杖和重担，是给驴的；饼、管教和劳作，是给家奴的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家奴”或译“家仆”。希腊语οἰκέτης指家中处于服役地位的人；这里采用“家奴”，以呈现古代语境中其受支配、通常并非自由雇员的身份。
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: 草料
  rationale: 复数在这里指供牲畜食用的饲料；“草料”具体、自然，并与驴相称。
- source_word: ῥάβδος
  choice: 棍杖
  rationale: 保留棍棒或杖的具体形象；语境暗含驱策或纠正，但正文不把这一含义进一步明说。
- source_word: φορτία
  choice: 重担
  rationale: 指驴所负载的东西；“重担”保留负荷之意，也符合中文箴言式表达。
- source_word: ὄνῳ
  choice: 驴
  rationale: 与隐含的“给……”结构相配；希腊文无冠词，中文无需增添定指。
- source_word: ἄρτος
  choice: 饼
  rationale: 原词具体指饼或面包；采用“饼”保留古代主食的具体意象，而不泛化为“食物”。
- source_word: παιδεία
  choice: 管教
  rationale: 该词可涵盖教导、训练和纠正；在古代家政语境中，“管教”最能保留其纠正与训练的双重色彩。
- source_word: ἔργον
  choice: 劳作
  rationale: 指所做的工作或劳动；“劳作”在此比抽象的“工作”更贴合家内服役语境。
- source_word: οἰκέτῃ
  choice: 家奴
  rationale: 该词指家中处于服役、受支配地位的人。“家奴”既表达其家庭成员身份，也避免用“仆人”淡化其非自由身份。
theological_decisions:
- issue: 古代家政格言中οἰκέτῃ的身份表达
  choice: 家奴
  alternative: 家仆；家中的仆役
  rationale: 本节反映古代家庭等级和支配关系。“家奴”较准确地呈现其受奴役的社会身份，但脚注保留较宽泛的词义可能性，避免把每一处οἰκέτης都绝对限定为同一种法律身份。
- issue: παιδεία在此处是否专指惩罚
  choice: 管教
  alternative: 教导；训练；责罚
  rationale: 原词语义范围兼有教育、训练和纠正。正文选“管教”以保留这种张力，不将其缩窄为单纯体罚或课堂教导。
translation_notes:
  register: 采用简洁、对称的箴言体，以“是给……的”补出希腊文省略的系词关系。用词现代而庄重；正文保留原文将驴与家奴并列的尖锐古代社会图景，不加以缓和或认可。
