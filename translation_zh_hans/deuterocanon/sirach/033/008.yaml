lexical_decisions:
- source_word: ἔγειρον
  choice: 激起
  rationale: 这是ἐγείρω的命令式；与θυμός连用时，表示使怒气发动、兴起，而非字面上的“举起”。“激起”自然地保留了命令语气。
- source_word: θυμόν
  choice: 怒气
  rationale: θυμός可指怒气、激情或盛怒。此处与ὀργή平行；译作“怒气”既不过度强化，也与后面的“烈怒”略作区分。
- source_word: ἔκχεον
  choice: 倾泻
  rationale: 这是ἐκχέω的命令式，基本意象是把液体倒出。“倾泻”保留了将愤怒如液体般释放出来的鲜明比喻。
- source_word: ὀργήν
  choice: 烈怒
  rationale: ὀργή常指强烈或发作出来的愤怒。译作“烈怒”与θυμός的“怒气”形成适度区别，同时保持庄重有力的语体。
