base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/004.yaml
  text: Just as you were sanctified among us before them[a], so also be magnified among them before us[b];
translation:
  language: zh_hans
  text: 正如你在他们眼前、在我们中间被尊为圣[a]，也愿你在我们眼前、在他们中间被尊为大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被尊为圣”也可译作“显为圣”。这里不是说上帝变得圣洁，而是说他的圣洁被人承认或彰显。
    reason: lexical_alternative
  - marker: b
    text: “愿……被尊为大”也可译作“愿……彰显伟大”。希腊文动词使用祈愿式，表达祷告中的愿望。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ … οὕτως
  choice: 正如……也愿……
  rationale: 保留希腊文前后对应的比较结构；后半句结合祈愿语气，用“也愿”自然承接。
- source_word: ἐνώπιον αὐτῶν
  choice: 在他们眼前
  rationale: 表达在对方视线或见证之下，并与后文“在我们眼前”形成清楚的对称。
- source_word: ἡγιάσθης
  choice: 被尊为圣
  rationale: 保留被动形式，又传达论及上帝时该圣经用语的实际含义：不是变得圣洁，而是被承认为圣、显明为圣。
- source_word: ἐν ἡμῖν
  choice: 在我们中间
  rationale: 这里的ἐν表示在一个群体当中；“在我们中间”比直译“在我们里面”更符合现代汉语。
- source_word: ἐναντίον ἡμῶν
  choice: 在我们眼前
  rationale: 与“在他们眼前”平行，表达在我们的视线或见证之下。
- source_word: μεγαλυνθείης
  choice: 愿……被尊为大
  rationale: 该词为被动祈愿式，表达祷告或愿望；“愿”明确其祈愿语气，“被尊为大”保留被动和“显为伟大、受尊崇”的含义。
- source_word: ἐν αὐτοῖς
  choice: 在他们中间
  rationale: 与“在我们中间”平行，指在该群体当中，而非个体内在的变化。
theological_decisions:
- issue: ἡγιάσθης用于上帝时的含义
  choice: 译作“被尊为圣”，并用脚注说明也可理解为“显为圣”。
  alternative: 显为圣；被分别为圣
  rationale: 上帝并非由不圣变为圣；这里是圣经惯用表达，指上帝的圣洁被人承认或彰显。译文保留被动张力，同时避免造成上帝后来才成为圣洁的误解。
- issue: μεγαλυνθείης的祈愿式语气
  choice: 译作“愿你……被尊为大”。
  alternative: 你要……被尊为大；愿你彰显伟大
  rationale: 希腊文祈愿式表示愿望或祈求。“愿”在现代汉语中能清楚表达这种语气，同时不把它改成命令或事实陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式保留原文“正如……也愿……”的平衡结构，并以“在他们眼前／在我们眼前”和“在我们中间／在他们中间”呈现交错对应。
