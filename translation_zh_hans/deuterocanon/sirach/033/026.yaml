  yaml_path: translation/deuterocanon/sirach/033/026.yaml
  text: Put your servant to work[a], and you will find rest; let his hands be idle, and he will seek freedom.
translation:
  language: zh_hans
  text: 让奴隶[a]做工，你就会得到安歇；任由他的双手闲着，他就会寻求自由。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语παιδί字面可指“孩子”或“男孩”。在这里的家内劳动语境中，它也可指受主人支配的家内从属者；下文提到“寻求自由”，因此译作“奴隶”。也可译作“仆人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: 要让奴隶做工
  rationale: ἔργασαι是命令式；七十士译本《德训篇》的这一表达在此是使受权柄约束的家内成员劳动。译为“要让……做工”既保留命令语气，也符合现代汉语。
- source_word: παιδί
  choice: 奴隶
  rationale: 该词本义可指“孩子、男孩”，也可指处于从属地位的家内成员；下文说他会“寻求自由”，显示这里突出的是受奴役的身份，因此不用较弱的“仆人”。以脚注保留词义上的真实幅度。
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: 你就会得到安歇
  rationale: 保留“找到/得到安歇”的结果关系；“得到安歇”在现代汉语中自然，也传达ἀνάπαυσις的歇息、舒缓之意。
- source_word: ἄνες χεῖρας αὐτῷ
  choice: 若让他的双手闲着
  rationale: ἄνες在这里有放松、任其松懈之意；直译“他的双手”保留劳动的具体意象。“若”明示后半句隐含的条件关系，但不改变其警戒语气。
- source_word: ζητήσει ἐλευθερίαν
  choice: 他就会寻求自由
  rationale: ζητήσει是“将寻求”，ἐλευθερίαν是“自由”；此译不把“寻求”强化为“要求”或“争取”，保留原文力度。
theological_decisions:
- issue: 家内劳动语境中παιδί所指的社会身份
  choice: 奴隶
  alternative: 仆人；男孩；孩子
  rationale: “寻求自由”使受奴役的法律和社会处境成为本句重点。“奴隶”比“仆人”更明确地呈现这种现实，同时脚注说明该希腊词自身较宽的词义，避免把词义歧义完全抹去。
translation_notes:
  register: 采用现代、庄重而清楚的劝诫体。“奴隶”直陈原文语境中的受奴役身份，不以较委婉的称呼淡化；“双手闲着”保留原文具体意象。脚注标记[a]已置于正文对应词后。
