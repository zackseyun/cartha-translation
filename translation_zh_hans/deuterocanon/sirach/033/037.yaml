  yaml_path: translation/deuterocanon/sirach/033/037.yaml
  text: When you acquire a friend[a], acquire him through testing, and do not quickly trust him.
translation:
  language: zh_hans
  text: 你若结交朋友，要在考验中结交他[a]，不要急着信任他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在考验中结交他”也可译作“经过考验才结交他”或“在受考验时结交他”。希腊语ἐν πειρασμῷ在这里可表示借着考验，也可表示处于考验之中。
    reason: 词义与句法存在相关的多种理解
lexical_decisions:
- source_word: κτήσῃ / κτῆσαι
  choice: 结交／结交
  rationale: κτάομαι有“取得、获得”之意；用于朋友关系时，现代汉语以“结交”最自然。两处重复“结交”，保留原文重复用词所形成的箴言力度。
- source_word: φίλον
  choice: 朋友
  rationale: 准确保留阳性单数宾语的基本含义；汉语名词本身不标示语法性别。
- source_word: ἐν πειρασμῷ
  choice: 在考验中
  rationale: πειρασμός可指考验、试炼或试探；本句语境侧重朋友是否可靠。“在考验中”既贴近介词结构，也保留究竟是借着考验来验证对方，还是在患难考验期间结交对方的语义张力。
- source_word: μὴ ταχὺ
  choice: 不要急着
  rationale: 表达不要仓促行事，符合现代汉语习惯，也忠实传达ταχύ修饰信任行为的意义。
- source_word: ἐμπιστεύσῃς αὐτῷ
  choice: 信任他
  rationale: ἐμπιστεύω加与格表示信任某人；“信任他”简洁自然，并保留阳性单数指代。
theological_decisions:
- issue: 智慧训诲中阳性单数的指代
  choice: 保留“他”
  alternative: 那个人／对方
  rationale: 希腊文αὐτῷ为阳性单数；译文保留代表性个体的单数阳性指代，不将其无依据地中性化。
- issue: ἐν πειρασμῷ所指考验的性质
  choice: 正文保留“在考验中”的开放表达
  alternative: 经过考验才结交他／在患难时结交他
  rationale: 原文可理解为以考验验证朋友，也可理解为在受考验的处境中获得朋友。正文不替原文消除这一张力，具体可能性在脚注说明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“结交”比直译为“取得朋友”更符合汉语关系表达，同时借重复用词保留原文的箴言节奏；“不要急着”清楚传达对仓促信任的警戒。
