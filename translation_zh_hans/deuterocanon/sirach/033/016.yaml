    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: 我也是
  rationale: κἀγώ由καί与ἐγώ缩合而成，兼有连接和强调意味；“我也是”自然保留附加语气。
- source_word: ἔσχατος
  choice: 最后才
  rationale: 此处作表语而带副词作用，表示说话者在众人之后才行动；“最后才”明确呈现先后次序。
- source_word: ἠγρύπνησα
  choice: 警醒劳作
  rationale: 该动词本义为保持清醒、警觉；结合上下文中迟至最后仍勤勉工作的图景，“警醒劳作”既保留警醒之意，也避免被误解为单纯失眠。
- source_word: ὡς
  choice: 如同
  rationale: 引出比喻而非严格等同；“如同”符合庄重、自然的现代汉语。
- source_word: καλαμώμενος
  choice: 拾取余穗的人
  rationale: 该分词表示在收割者之后捡取残留之物，字面与禾秆、穗梗相关；“拾取余穗”保留收获后捡拾余留作物的农业图景，同时不把动作泛化为普通收集。
- source_word: ὀπίσω
  choice: 跟在……后面
  rationale: 保留其具体的空间意象，也自然表达说话者处于收获者之后。
- source_word: τρυγητῶν
  choice: 收葡萄的人
  rationale: 该名词特指采收葡萄的人；这一译法清楚、现代，并保留葡萄收获的具体场景。
