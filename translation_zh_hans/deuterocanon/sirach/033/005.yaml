  text: and may they know you[a], just as we also knew you.
translation:
  language: zh_hans
  text: 也愿他们认识你[a]，正如我们也认识了你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “认识”所译的希腊语动词比后半句的“认识”用词稍强，可含“确实认出”或“进一步认识”的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώτωσάν
  choice: 愿他们认识
  rationale: 第三人称复数不定过去时命令式；在向上帝祈求的语境中用“愿”自然表达祈愿语气。“认识”保留其认知、确认之义，而不把可能含有的较充分认识之意过度明说。
- source_word: σε
  choice: 你
  rationale: 作直接宾语，按现代汉语自然译为第二人称单数“你”。
- source_word: καθάπερ
  choice: 正如
  rationale: 明确表达比较和对应关系，并保留原文较强的比较语气。
- source_word: ἡμεῖς
  choice: 我们也
  rationale: 原文显式使用主语代词以突出对比；“也”同时对应 καί，体现双方的对应关系。
- source_word: ἔγνωμεν
  choice: 认识了
  rationale: 不定过去时表示已经发生或达成的认识；“了”简洁呈现完成性，同时避免把它限定为与现在无关的过去状态。
theological_decisions:
- issue: 祈祷语境中命令式的语力
  choice: 译为“愿他们认识你”
  alternative: “让他们认识你”
  rationale: 第三人称命令式在此是向上帝发出的祈求；“愿”在现代庄重汉语中既自然又能保存祈愿语力。
- issue: ἐπιγινώσκω 与 γινώσκω 的词义差别
  choice: 正文均以“认识”表达，并用脚注说明前者可能语气较强
  alternative: 把前者译为“充分认识”或“真正认出”
  rationale: ἐπιγινώσκω 有时带有更充分、确切地认识或认出的意味，但本句未必刻意建立程度对比；在正文强加“充分”可能过译，脚注可忠实保留这一词汇张力。
- issue: ἔγνωμεν 的时体表达
  choice: 译为“认识了”
  alternative: “曾认识”或单作“认识”
  rationale: “认识了”体现不定过去时所呈现的已达成认识，同时不武断断定这种认识如今已经终止。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“也愿……正如……”保持本句显然承接上文的结构；保留“我们”以呈现原文的强调。
