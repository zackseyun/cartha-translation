  yaml_path: translation/deuterocanon/sirach/033/020.yaml
  text: To son and wife[a], to brother and friend, do not give authority over yourself during your lifetime; and do not give your possessions to another[c][b], lest you regret it and have to plead for them.
translation:
  language: zh_hans
  text: 在你有生之年，不要把支配你的权力交给儿子和妻子、兄弟和朋友；也不要把你的财物交给别人，免得日后懊悔，还要为这些财物求助于人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“免得你懊悔后，还得为这些财物有所求”。这可指交出财物后，自己反而不得不为这些财物求助；上下文可能包括请求取回，但原文没有明确说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: 对儿子和妻子，对兄弟和朋友
  rationale: 逐一保留原文四种具体关系及其男性或婚姻指向；各与格名词受后面的“不要交给”支配。
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σὲ
  choice: 不要把支配你的权柄交给他们
  rationale: ἐξουσία可指权柄、权力或支配权；“支配你的权柄”既保留权柄语义，也自然表达ἐπὶ σέ所指向的对本人或事务的控制。补出“他们”以适应汉语句法，其所指即前列亲友。
- source_word: ἐν ζωῇ σου
  choice: 你有生之年
  rationale: 准确表达警告所涵盖的时间范围，且为自然、庄重的现代汉语。
- source_word: ἑτέρῳ
  choice: 别人
  rationale: 在此不定指另一人，“别人”比“另一个人”更自然。
- source_word: τὰ χρήματά σου
  choice: 你的财物
  rationale: χρήματα可泛指钱财、资产或物品；“财物”保持广义，不把含义缩窄为现金。
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: 免得你后来懊悔
  rationale: μεταμέλομαι指事后后悔或改变心意；“后来懊悔”明确呈现其后发性。
- source_word: δέῃ περὶ αὐτῶν
  choice: 还得为这些财物求人
  rationale: 原句可直译为“在这些事物上有需要”；上下文暗示赠出财物后不得不为之求助。“求人”传达这种依赖处境，又不把含义过度限定为明确索回。
