  text: 'And so look at all the works of the Most High: two by two[a], one opposite the other.'
translation:
  language: zh_hans
  text: 你也当这样察看至高者的一切作为：两两成对，一个与另一个相对[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个与另一个相应。”希腊语κατέναντι可表示相对而置，也可表示相应；上下文的成对对照支持正文译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὕτως
  choice: 因此
  rationale: 承接上下文所作的归纳，用“因此”自然表达由前述观察所得出的结论；οὕτως所含“如此”的意味由整句的承接关系体现。
- source_word: ἔμβλεψον
  choice: 你要察看
  rationale: 命令式要求读者把注意力集中于所述对象；“察看”兼具观看和审察之意，比单纯“看”更符合智慧文学语境。
- source_word: πάντα τὰ ἔργα
  choice: 一切作为
  rationale: ἔργα可广指至高者所造、所行的一切；“作为”保留其广度，既不局限于受造物，也不只指具体行动。
- source_word: τοῦ ὑψίστου
  choice: 至高者
  rationale: ὁ ὕψιστος是常见的上帝称号；“至高者”是现代汉语圣经语体中准确、庄重且清楚的对应。
- source_word: δύο δύο
  choice: 两两成对
  rationale: 希腊语的重复构成分配性表达，意为每两个一组；“两两成对”既自然，又保留配对结构。
- source_word: ἓν κατέναντι τοῦ ἑνός
  choice: 彼此相对
  rationale: κατέναντι可指相对、相向或相应。上下文强调成对的对照关系，故正文用“彼此相对”，同时以脚注保留“彼此相应”的可能。
theological_decisions:
- issue: 神圣称号ὁ ὕψιστος
  choice: 至高者
  alternative: 最高者
  rationale: “至高者”是犹太智慧文学中这一神圣称号的自然汉译，保留尊称性质而不增添额外教义含义。
- issue: 成对事物之间的关系
  choice: 彼此相对
  alternative: 彼此相应
  rationale: κατέναντι本身容许对立与对应两层含义；本节语境中的配对和对照支持“相对”，但不应消除“相应”的真实词义可能，因此列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“察看”保持智慧文学中的劝诫语气；句式简洁，并用冒号呈现后半句对“一切作为”的说明。
