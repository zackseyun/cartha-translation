  text: A discerning man understands the word of Yahweh[b][a], and his instruction is like the Urim in the breastpiece.
translation:
  language: zh_hans
  text: 明哲的人领会雅威的话[b]；他的教导如同胸牌里的乌陵[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的教导”也可理解为“雅威的教导（或律法）”，即将“他的”看作指雅威，而不是指明哲的人。
    reason: alternative_reading
  - marker: b
    text: 本节的希伯来文本与现存希腊文本差异很大；本译文以保存下来的希伯来文本为主要依据。希腊文本作：“求你向外邦举起你的手，使他们看见你的权能。”
    reason: textual_variant
lexical_decisions:
- source_word: אִישׁ נָבוֹן
  choice: 明哲的人
  rationale: 保留阳性单数所描绘的智慧文学典型人物，同时用现代汉语中自然、庄重的“明哲”表达兼具理解力与判断力的人。
- source_word: יָבִין
  choice: 领会
  rationale: 表达 בין 在智慧语境中正确理解、洞察的认知含义；“领会”比单纯“明白”更能体现深入把握。
- source_word: דְּבַר יְהֹוָה
  choice: 雅威的话
  rationale: דבר 在此最自然地指神的话语；将四字神名按其专名译作“雅威”。
- source_word: וְתוֹרָתוֹ
  choice: 他的教导
  rationale: תורה 在此具有训诲、教导的含义，不宜局限为法规性的“律法”。阳性单数后缀在句法上较自然地回指“明哲的人”，但也可能指雅威，故以脚注保存歧义。
- source_word: כְּאוּרִים
  choice: 如同……乌陵
  rationale: אוּרִים 是与祭司求问相关的专门名称，采用通行音译“乌陵”，不按词源泛译为“光”。
- source_word: בַּחֹשֶׁן
  choice: 胸牌里的
  rationale: חֹשֶׁן 指祭司的胸牌，并非护身铠甲；“胸牌”准确且为现代读者易懂。介词 ב־ 译为“里”，体现乌陵与胸牌的关联。
theological_decisions:
- issue: 神名 יְהֹוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近当前学界对其读音的通常重构，也明确保留专名性质。
- issue: וְתוֹרָתוֹ 中物主后缀的所指
  choice: 理解为明哲之人的“教导”
  alternative: 理解为雅威的“教导／律法”
  rationale: 按紧邻先行词与句子结构，后缀较自然地回指“明哲的人”；但“雅威”也是语法上可能的先行词，且会形成神之教导如乌陵般指引人的含义，因此不在正文中强行消除张力，而在脚注中注明。
- issue: 希伯来文本与现存希腊文本的重大差异
  choice: 正文依从现存希伯来文本
  alternative: 依从希腊文本“向外邦举手，使他们看见你的权能”
  rationale: 本项目优先依据可用的《便西拉智训》希伯来见证；希腊平行文本内容完全不同，故以脚注明示文本差异，而不将两者调和。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“明哲的人”保持智慧文学语体；“乌陵”和“胸牌”保留祭司礼仪背景。脚注标记按相关短语就近放置：文本差异标在“雅威的话”之后，后缀歧义标在整句末。
