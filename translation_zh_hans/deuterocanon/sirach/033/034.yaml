  text: Be on guard against a wrongdoer, for he devises evil, lest he ever bring disgrace upon you.
translation:
  language: zh_hans
  text: 要提防作恶的人，因为他图谋恶事，免得他使你永远蒙受羞辱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羞辱”或译“非议”或“污名”。
    reason: μῶμον的语义可涵盖责难、非议、名誉污点和耻辱；上下文不能完全限定为其中一项。
lexical_decisions:
- source_word: πρόσεχε ἀπὸ κακούργου
  choice: 要提防作恶的人
  rationale: πρόσεχε与ἀπό连用，在这里表示对某人保持警惕；κακοῦργος泛指行恶、害人的人。“提防作恶的人”既传达警戒语气，也不把含义收窄为法律意义上的“罪犯”。
- source_word: πονηρὰ
  choice: 恶事
  rationale: 中性复数在此作名词使用，指邪恶或有害的事情、计谋；译作“恶事”简洁自然，并保留道德色彩。
- source_word: τεκταίνεται
  choice: 图谋
  rationale: 该动词含构思、筹划、蓄意设计之意。“图谋”表现其有意策划恶事，又不额外限定具体手段。
- source_word: μή ποτε
  choice: 免得
  rationale: 引出所警告的可能后果；“免得”符合汉语劝诫体，也保留原文并非断言结果必然发生的语气。
- source_word: μῶμον
  choice: 羞辱
  rationale: μῶμος可指责难、非议、污点或耻辱。此处译作“羞辱”，自然表达恶人可能使对方承受的名誉损害；其他可能义项列入脚注。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远
  rationale: 该短语直指延续到长久、永久；“永远”比弱化为“有朝一日”更准确地保留持续性。
- source_word: δῷ σοι
  choice: 使你……蒙受
  rationale: 字面为“给你”，但与μῶμον搭配时，汉语用“使你蒙受”更自然，表达把羞辱或非议加在某人身上。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学劝诫语体。“要提防”保留命令语气；后半句用“免得”呈现警告中的可能性，并按原文将“永远”明确关联于所蒙受的羞辱。
