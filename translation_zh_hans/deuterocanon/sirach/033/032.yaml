  text: On the day the days of your life are completed[a], and at the time of death, give an inheritance.
translation:
  language: zh_hans
  text: 在你一生的年日终结之日[a]，在你去世之时，要把产业交出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在你生命的年日之终结的日子。”
    reason: 原文以“终结”这一名词构成凝缩的属格结构；正文调整为自然的现代中文句式。
lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου
  choice: 在你一生的年日满了的那一天
  rationale: 保留原文“日子达到完满/终结”的结构与时间指向；“一生的年日”自然、庄重，也不把 συντέλεια 过度解释为别的概念。
- source_word: καὶ ἐν καιρῷ τελευτῆς
  choice: 到了死亡的时候
  rationale: καιρός 表示特定时刻，τελευτή 在此指生命终结、死亡；此译清楚表达临终时点。
- source_word: διδὸς
  choice: 才把……交给
  rationale: διδούς 是现在时主动命令式“给”。结合前置时间状语，用“才”凸显应等到生命终结时再给的劝诫逻辑，但不改变命令本身。
- source_word: κληρονομίαν
  choice: 产业交给后人
  rationale: κληρονομία 指可继承的产业或遗产。中文若只说“给一份遗产”略显生硬；“把产业交给后人”明确表达财产传承，同时避免抽象化为精神‘遗产’。
theological_decisions:
- issue: κληρονομίαν 应译为具体财产，还是可兼指精神传承的“遗产”
  choice: 产业交给后人
  alternative: 留下一份遗产
  rationale: 上下文是关于人在生命终结时处置所有物的实际智慧；采用具体的“产业”可保留法律及家庭财产含义，不引入精神传承的延伸义。
- issue: 是否把死亡解释为预先指定的神定时刻
  choice: 到了死亡的时候
  alternative: 到了命定的死期
  rationale: 原文 καιρός 表示时候或时机，但没有明说“命定”；因此不加入额外的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“一生的年日”略带智慧文学色彩；“产业”保持财产继承的具体含义。脚注标记已在正文中对应出现。
