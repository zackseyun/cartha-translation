  yaml_path: translation/deuterocanon/sirach/033/021.yaml
  text: As long as you are still alive and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: zh_hans
  text: 只要你还活着，气息还在你里面，就不要把自己交给任何血肉之躯[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要把自己交在任何人手中”，或“不要使自己受制于任何人”。希腊文直译为“不要把自己交给任何血肉”。
    reason: 说明ἀλλάξῃς σεαυτόν及πάσῃ σαρκί的词义选择，并保留原文可能的不同理解。
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: 只要你还活着
  rationale: ἕως配合ἔτι和现在时ζῇς，表示生命持续期间的时间界限；此译自然保留“仍然活着”的强调。
- source_word: πνοὴ
  choice: 气息
  rationale: πνοή首先指呼吸、气息；与“在你里面”连用时表示生命尚存。“气息”既贴近原词，也避免把它直接解释为“灵”。
- source_word: μὴ ἀλλάξῃς σεαυτόν
  choice: 不要把自己交给
  rationale: ἀλλάσσω通常有“改变、交换”之意，但在此与反身代词及间接对象连用，直译成“不要把自己改变给”不合汉语；“把自己交给”保留转交或让渡自身的语义，同时不把具体后果说死。
- source_word: πάσῃ σαρκί
  choice: 任何血肉之躯
  rationale: σάρξ字面为“肉、血肉”，此处以血肉指人。“血肉之躯”在现代汉语中可理解为凡人，又保留希腊文鲜明的身体性表达。
theological_decisions:
- issue: σάρξ所指范围
  choice: 血肉之躯
  alternative: 任何人／任何凡人
  rationale: 上下文中该词指人，但原文仍以“血肉”称之，可能带出人的脆弱与必死性；正文保留这一张力，不直接简化为“人”。
- issue: ἀλλάξῃς σεαυτόν的语义
  choice: 把自己交给
  alternative: 使自己受制于／把自己置于……权下
  rationale: “受制于”或“置于权下”会明确加入支配关系；“交给”较贴近让渡自身的动作，也保留原表达可能涵盖托付、移交或屈从的开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“里面还有气息”保留原文“气息在你里面”的生命意象；“血肉之躯”略带书面色彩，但普通读者易懂，并与智慧文学的劝诫语气相称。
