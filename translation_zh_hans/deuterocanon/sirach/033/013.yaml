  text: 聚集雅各的众支派。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节现存于第1区的希腊文本只是一个简短的命令句：“聚集雅各的众支派。”由于原文校验标记为“重大不匹配”，本译文依照现存希腊文本的措辞翻译，不据此断定该见证未提供的更多上下文。
    reason: textual_variant
lexical_decisions:
- source_word: συνάγαγε
  choice: 请聚集
  rationale: 这是 συνάγω 的简单过去时命令式，表达直接的吩咐；汉语用“请聚集”既保留命令语气，也符合祈求语境中的自然庄重表达。
- source_word: πάσας
  choice: 各
  rationale: πάσας 全面修饰 φυλάς；“各支派”在现代汉语中自然表达所有支派，无一遗漏。
- source_word: φυλάς
  choice: 支派
  rationale: 在以色列民族的圣经语境中，φυλή 通常指“支派”；译作“宗族”会削弱其既定的十二支派含义。
- source_word: Ἰακώβ
  choice: 雅各
  rationale: 希腊文本明确使用 Ἰακώβ；保留“雅各”，体现以先祖之名统称其后裔各支派的表达，而不改译为“以色列”。
