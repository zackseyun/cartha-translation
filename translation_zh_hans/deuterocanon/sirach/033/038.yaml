  yaml_path: translation/deuterocanon/sirach/033/038.yaml
  text: For there is a friend in his own time[a], and he will certainly not remain in the day of your distress.
translation:
  language: zh_hans
  text: 因为有的朋友只在适合自己的时候才会做朋友[a]；到你遭难的日子，他决不会留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有的朋友只做一时的朋友”，或“有的朋友只在适合自己的时候才会做朋友”；这里指只在顺境或条件有利时维持的友谊。
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος
  choice: 朋友
  rationale: 这是该词在此处最普通、直接的含义，也与上下文所谈的人际关系相符。
- source_word: ἐν καιρῷ αὐτοῦ
  choice: 只在自己的时机
  rationale: καιρός可指合宜、特定的时机，αὐτοῦ表示“他的/自己的”。译文保留此语可能指“在适合他的时候”或“只做一时朋友”的含混性；加入“只”则由后半句的强烈对比自然支持。
- source_word: οὐ μὴ παραμείνῃ
  choice: 决不会留下
  rationale: οὐ μή加虚拟式表达强烈否定，并带有将来指向；“决不会”体现其强调语气，“留下”自然表达陪伴到底之意。
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: 到你遭难的日子
  rationale: θλῖψις指患难、困苦或压迫；“遭难”简洁而庄重。“日子”保留原文的时间意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自己的时机”刻意保留希腊语短语的多义性，脚注说明主要译法；后半句以“决不会”准确传达强调否定。
