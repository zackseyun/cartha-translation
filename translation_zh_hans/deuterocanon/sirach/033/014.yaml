  text: Opposite evil is good[a], and opposite death is life; so opposite a godly man is a sinner.
translation:
  language: zh_hans
  text: 与恶相对的是善，与死亡相对的是生命；照样，与敬虔的人相对的是罪人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέναντι
  choice: 对面
  rationale: 该词在三组结构中反复出现，表示彼此相对的对应项；“对面”保留格言式的对称和对立意味。
- source_word: κακοῦ / ἀγαθόν
  choice: 恶 / 善
  rationale: 用现代汉语中简洁、庄重的道德范畴词，准确呈现两者的反义关系。
- source_word: θανάτου / ζωή
  choice: 死亡 / 生命
  rationale: 直译这组清楚的基本对立，并保持与前后分句平行。
- source_word: οὕτως
  choice: 照样
  rationale: 表明末一组对比依照前两组的模式展开，比单用“所以”更准确地传达类比关系。
- source_word: εὐσεβοῦς
  choice: 敬虔人
  rationale: 此处为阳性单数形容词名词化，指敬畏、尊崇上帝的人；“敬虔人”既保留个人单数，也比“虔诚者”更贴近经文的宗教伦理含义。
- source_word: ἁμαρτωλός
  choice: 罪人
  rationale: 该词在此名词化使用，与“敬虔人”构成个人品格上的对照；“罪人”是自然且通行的对应译法。
theological_decisions:
- issue: εὐσεβοῦς 与 ἁμαρτωλός 的单数人格性对照
  choice: 敬虔人 / 罪人
  alternative: 敬虔者 / 有罪者
  rationale: 希腊文使用两个单数的名词化形容词。译文保留人物之间的直接对照，但汉语不必额外加入带生理性别意味的“男人”，从而既不抽象化，也不超出原文实际所表达的性别信息。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语；三个分句保持同构，以再现原文智慧格言的节奏。
