  text: What offspring is honorable? Human offspring[a]. What offspring is honorable? Those who fear God[b]. What offspring is honorable? Those who keep the commandment.
translation:
  language: zh_hans
  text: 什么后裔是尊贵的？人的后裔[a]。什么后裔是尊贵的？敬畏上帝的人[b]。什么后裔是尊贵的？谨守诫命的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行本的末句作：“什么后裔是卑贱的？人的后裔。”现存希伯来文本则作：“什么后裔是尊贵的？谨守诫命的人。”
    reason: textual_variant
  - marker: b
    text: 希腊文作“敬畏主的人”；希伯来文作“敬畏上帝的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע / σπέρμα
  choice: 后裔
  rationale: 此词在希伯来文和希腊文中反复出现，是本节的修辞关键词；“后裔”能表达集合意义，又比直译“种子”更符合现代汉语。
- source_word: נִכְבָּד / ἔντιμον
  choice: 尊贵的
  rationale: 该词指具有尊荣或受尊重的地位；“尊贵的”自然保留智慧文学中的荣辱语义，也避免“高贵”可能暗示门第出身。
- source_word: מַה / ποῖον
  choice: 什么
  rationale: 疑问词用于修辞性的分类发问；“什么”简洁自然，并保留格言式的反复结构。
- source_word: לֶאֱנוֹשׂ / ἀνθρώπου
  choice: 人的
  rationale: 希伯来文和希腊文都泛指人类，并非特指男性；“人的”准确保留这一普遍意义。
- source_word: יְרֵא אֱלֹהִים / οἱ φοβούμενοι τὸν κύριον
  choice: 敬畏上帝的人
  rationale: 现存希伯来文本作“敬畏上帝”，希腊文平行本作“敬畏主”；正文以希伯来文为主，并用明确的名词短语自然表达分词含义。
- source_word: שׂוֹמֵר מִצְוָה
  choice: 谨守诫命的人
  rationale: 希伯来文“诫命”为单数，因此不泛化为复数；“谨守”既体现 שמר 的遵守、持守之意，也保留合宜的圣经语体。
theological_decisions:
- issue: 本节末句在希伯来文与希腊文之间存在重大文本差异
  choice: 正文依照现存希伯来文，保留第三个正面问答：“什么后裔是尊贵的？谨守诫命的人。”
  alternative: 希腊文作：“什么后裔是卑贱的？人的后裔。”
  rationale: 本节有现存希伯来文，故以其为主要原文证据；希腊文却保存了形成正反对照的不同末句。该差异影响全节结构与含义，因此在脚注中明确保留，而不擅自调和。
- issue: 神名在希伯来文与希腊文之间不同
  choice: 正文采用希伯来文的“上帝”
  alternative: 希腊文作“主”
  rationale: 希伯来文为 אֱלֹהִים，希腊文为 κύριον；依主要希伯来文见证译作“上帝”，并在脚注说明希腊文异读。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。三次重复“什么后裔是尊贵的”以保留原文的格言节奏和关键词复现；用“尊贵”表达荣誉地位，用“谨守诫命”保留智慧传统和圣经语体。
