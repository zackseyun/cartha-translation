  text: One should not despise an intelligent poor man[a], nor honor a wrongdoer who has been exalted.
translation:
  language: zh_hans
  text: 不可轻视有见识的穷人[a]，也不可尊敬被抬举的作恶者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊传统在这里的文字很不相同：“大人物、审判官和统治者将受尊崇，但他们当中没有谁比敬畏主的人更大。”正文所依据的希伯来见证则是一则伦理格言：不可轻视有见识的穷人，也不可尊敬被抬举的作恶者。
    reason: textual_variant
lexical_decisions:
- source_word: אֵין לִבְזוֹת
  choice: 不可轻视
  rationale: אֵין加不定式在这里表达格言式的禁止或不当；“不可轻视”简洁自然，并保留智慧文学的训诫语气。
- source_word: דַּל
  choice: 穷人
  rationale: דַּל可指贫穷、弱小或社会地位低下的人；上下文以贫穷与高位相对照，因此译作“穷人”。
- source_word: מַשְׂכִּיל
  choice: 有见识的
  rationale: 该词表示具有理解力、洞察力或明智审慎；“有见识的”既自然，又比单译“聪明”更能体现判断与领悟的意味。
- source_word: לְכַבֵּד
  choice: 尊荣
  rationale: כבד的加强词干常指给予尊重、分量或荣誉；“尊荣”在本句中与“轻视”形成清楚对照，也符合庄重格言的语体。
- source_word: עַוָּל
  choice: 作恶者
  rationale: עַוָּל指行不义、作恶的人；“作恶者”是现代汉语中清楚而不过度限定具体罪行的表达。
- source_word: אֲשֶׁר הוּרָם
  choice: 身居高位的
  rationale: 原文是被动完成式，意为被抬高、获提升。汉语“身居高位的”自然呈现其已经升至较高社会地位的结果；并未断定这种提升是否正当。
theological_decisions:
- issue: 希伯来文本与希腊传统在本节存在重大差异
  choice: 正文直接翻译现存的希伯来格言，以不可轻视有见识的穷人、不可尊荣身居高位的作恶者为内容。
  alternative: 按希腊传统译为：“大人物、审判官和统治者会得尊荣，但他们当中没有谁比敬畏主的人更大。”
  rationale: 现存希伯来见证可信度高，故正文以其为本；然而希腊传统内容显著不同，不能无声忽略，因此在脚注中完整说明异文，不将两种传统调和为一个意思。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。“不可……也不可……”保留原文平行结构；“有见识的穷人”与“身居高位的作恶者”突出智慧或品行同社会地位之间的张力。
