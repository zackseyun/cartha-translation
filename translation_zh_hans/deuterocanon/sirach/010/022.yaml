  text: A resident alien[a], a foreigner, a stranger, and a poor man—their glory is the fear of God.
translation:
  language: zh_hans
  text: 寄居者、外人、异乡人和穷人——他们的荣耀在于敬畏上帝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“羞辱有智慧的穷人是不对的，尊荣犯罪的人也是不合宜的。”这里的希伯来文与希腊文差异很大。
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  choice: 寄居者
  rationale: 指住在本地却不属于本族群的人；“寄居者”保留其定居而非仅仅过路的社会身份。
- source_word: וְזָר
  choice: 外人
  rationale: 指处于通常亲族、礼仪或社会圈子之外的人；译作“外人”，并与后面的“异乡人”有所区分。
- source_word: נָכְרִי
  choice: 异乡人
  rationale: 通常指来自另一族群或地方的人；“异乡人”自然清楚，也避免与前面的 זָר 合并为同一概念。
- source_word: וָרָשׁ
  choice: 和穷人
  rationale: רָשׁ 指贫穷、缺乏资财的人；中文用单数集合性的“穷人”自然地保留原文并列结构。
- source_word: תִּפְאֶרֶת
  choice: 他们的荣耀
  rationale: 该词可指荣美、光彩或尊荣；此处说明这些社会地位较低者真正的尊荣所在，译作“荣耀”最贴切。
- source_word: יִרְאַת אֱלֹהִים
  choice: 敬畏上帝
  rationale: 这是智慧文学中的固定观念，兼含畏惧、尊崇与虔敬；“敬畏上帝”在现代中文中准确而庄重。
theological_decisions:
- issue: 希伯来文本与希腊平行文本存在重大差异
  choice: 正文依据现存希伯来文本翻译，并在脚注中完整保留希腊异文的大意。
  alternative: 按希腊文译为：“羞辱有智慧的穷人是不对的，尊荣犯罪的人也是不合宜的。”
  rationale: 本项目在《便西拉智训》有希伯来见证时以希伯来文为主要依据；但希腊文表达的是明显不同的箴言，不能视为轻微措辞差异，因此以脚注诚实呈现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“寄居者、外人、异乡人”刻意保留希伯来文三个相近却不完全相同的身份称谓；破折号突出后半句对真正荣耀的断定。
