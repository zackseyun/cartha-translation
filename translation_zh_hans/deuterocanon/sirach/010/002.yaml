base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/002.yaml
  text: An undisciplined king will ruin a city[a], but a city is inhabited through the wisdom of its rulers.
translation:
  language: zh_hans
  text: 不受约束的王必毁坏一座城；一座城却因其官长的明智而有人居住。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因其官长的明智而有人居住”也可更直译为“因其官长的审慎而得以居住”。希腊文平行文本则表达为：城的领袖怎样，城中所有居民也怎样。
    reason: 说明希伯来文介词短语的译法，并交代希腊文平行文本的不同表达。
lexical_decisions:
- source_word: מֶלֶךְ
  choice: 王
  rationale: 这是该词在政治语境中的通常含义，指单数的最高统治者。
- source_word: פָּרוּעַ
  choice: 不受约束的
  rationale: 表达松弛、缺乏管束或节制之意；不把含义过度限定为违法或犯罪。
- source_word: יַשְׁחִית
  choice: 使……败落
  rationale: שחת使役形表示造成毁坏或败坏；用于城市治理格言时，“使……败落”既体现严重后果，又不必理解为彻底摧毁。
- source_word: עִיר
  choice: 城
  rationale: 指城市及其共同体；符合希伯来文，也与希腊文平行文本的城市语境一致。
- source_word: נוֹשֶׁבֶת
  choice: 有人安居
  rationale: 保留“被居住、有人定居”的意义，并以现代汉语自然表达城市因良好治理而宜居、有人居住的状态。
- source_word: בְּשֶׂכֶל
  choice: 因……明智
  rationale: 介词短语可表凭借或原因；שכל在此指明智、洞察和审慎。译文保留其与治理成效的直接关系。
- source_word: שָׂרֶיהָ
  choice: 其首领
  rationale: 复数词形指城中的领袖、执政者或官长；汉语“首领”可作集合性称谓，避免误解为现代特定官职。
theological_decisions:
- issue: 希伯来文两分句与希腊文平行文本的关系
  choice: 正文按现存希伯来文的次序和意象直译，并让希腊文仅辅助确认本节关乎领导者对全城居民的影响。
  alternative: 依希腊文译为：“百姓的审判者怎样，他的属员也怎样；城的领袖怎样，其中所有居民也怎样。”
  rationale: 希伯来文见证完整且可信度高，应作为正文依据；希腊文呈现相关但明显不同的表述，不宜取代希伯来文，却可帮助说明治理者与城市状况之间的联系。
- issue: נוֹשֶׁבֶת בְּשֶׂכֶל שָׂרֶיהָ 的语法张力
  choice: 译为“因其首领的明智而有人安居”，保留城市被居住与首领明智之间的工具或因果关系。
  alternative: 译为“其首领明智，城就有人居住”，将介词短语转为条件式或对应式表达。
  rationale: 原文更直接地把“明智”作为城市有人居住的凭借或原因；正文不将其改写成希腊文式的“怎样……也怎样”结构。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。前后分句以“却”凸显败坏与安居的对照；“有人安居”比生硬的“被居住”自然，同时保留希伯来文 נוֹשֶׁבֶת 的城市居住意象。脚注标记已在正文中标为[a]。
