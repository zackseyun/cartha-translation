base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/020.yaml
  text: What kind of offspring is contemptible? The offspring of one who transgresses a commandment.[a]
translation:
  language: zh_hans
  text: 哪一种后裔是可鄙的？就是违背诫命之人的后裔。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“那些违背诫命的人”，其中“人”和“诫命”均为复数；这也有助于理解较难的希伯来文措辞。
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע
  choice: 后裔
  rationale: 此处指人的子孙或后代；“后裔”既保留集合性含义，也符合智慧文学的庄重语体。
- source_word: נִקְלֶה
  choice: 卑贱的
  rationale: 该词表示被轻看、缺乏尊荣；“卑贱”与希腊语ἄτιμον的“不受尊重”相合，又保留评价意味。
- source_word: מַה
  choice: 哪一种
  rationale: 这里引出修辞性的类别询问；“哪一种”在现代汉语中清楚自然。
- source_word: לֶאֱנוֹשׁ
  choice: 之人的
  rationale: 传世希伯来文句法艰涩；结合后半句及希腊语平行文本，以所属结构表达其所指的人，同时不照搬难解的字面形式。
- source_word: עוֹבֵר
  choice: 违背
  rationale: 与מִצְוָה搭配时表示违反命令或诫命；“违背”自然且保留道德—律法语域。
- source_word: מִצְוָה
  choice: 诫命
  rationale: 保留希伯来文单数，并以“诫命”体现妥拉及智慧文学语境。
theological_decisions:
- issue: 后半句希伯来文与希腊文的文本差异
  choice: 正文以现存希伯来文为主，保留单数“诫命”，并借助希腊文澄清艰涩句法。
  alternative: “是那些违背诫命的人”（较贴近希腊文复数）
  rationale: 希伯来文虽句法困难但仍存，故正文优先反映其见证；希腊文则作为重要平行见证在脚注中注明，不将二者差异静默抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哪一种……？”保留箴言式修辞问句；“卑贱”表达缺乏尊荣的评价，但不额外引入特定宗派解释。
