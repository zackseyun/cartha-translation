base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/028.yaml
  text: Who will justify the one who sins against his own soul[a], and who will honor the one who dishonors his own life?
translation:
  language: zh_hans
  text: 谁能称那得罪自己灵魂的人为义呢？谁又会尊重那轻贱自己生命的人呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文本与希腊文本差异很大，而且句意难明，大致可译为：“我儿，要以谦卑尊重自己；他必赐你见识和失去的尊荣。”由于此处希伯来文本可能不稳定，正文采用语意连贯的希腊文本。
    reason: 文本异文
lexical_decisions:
- source_word: τὸν ἁμαρτάνοντα εἰς τὴν ψυχὴν αὐτοῦ
  choice: 那得罪自己灵魂的人
  rationale: 现存希伯来文本在此难解，且与希腊文本严重分歧，因此正文依据连贯的希腊平行文本。ἁμαρτάνω εἰς 表示“得罪、伤害”，ψυχή 可指灵魂、自身或生命；鉴于下句另用 ζωή，译作“灵魂”以保留两词的区别。
- source_word: τίς δικαιώσει
  choice: 谁能称……为义呢
  rationale: δικαιόω 在此带有判定某人为正、为义的法理和道德意味；“称……为义”比单纯“辩护”更准确，同时保留反问的力度。
- source_word: τίς δοξάσει
  choice: 谁又会尊重
  rationale: δοξάζω 在智慧文学的社会伦理语境中指给予尊荣；现代汉语“尊重”自然，并与后面的“轻贱”形成鲜明对照。
- source_word: τὸν ἀτιμάζοντα τὴν ζωὴν αὐτοῦ
  choice: 那轻贱自己生命的人
  rationale: ἀτιμάζω 指不予尊荣、视为卑贱；译作“轻贱”兼具态度与行为含义。ζωή 明确译作“生命”，与上句 ψυχή 的“灵魂”相区别。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本严重分歧
  choice: 正文采用希腊文本所保存的连贯双行反问句
  alternative: “我儿，要以谦卑尊重自己；他必赐你见识和失去的尊荣。”（仅为现存希伯来文本的大致译法，句意不稳）
  rationale: 所给希伯来句在语法和语义上均有明显困难，可能已经讹损，或代表不同文本传统；希腊文本则形成语义清楚、结构平衡的双行诗。为避免把不确定的希伯来句强行解释成确定含义，正文据希腊文本翻译，并在脚注如实保存希伯来异文。
- issue: ψυχή 与 ζωή 是否合并译为“生命”或“自己”
  choice: 分别译为“灵魂”和“生命”
  alternative: 两处均按“自己／生命”处理
  rationale: 希腊原文有意使用两个不同名词。分别翻译可保留其修辞变化，也不预设二者在神学上必然截然分离。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个反问句保留原文的平行结构；“称……为义”保存 δικαιόω 的道德—法理意味，“尊重／轻贱”则构成清楚的荣辱对照。脚注标记置于整节末尾，因为它说明的是全节的文本分歧。
