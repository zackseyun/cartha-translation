  text: Why does dust and ashes exalt itself[a], though in its life its body is lifted up?
translation:
  language: zh_hans
  text: 尘土和灰烬为何自高？人活着时，他的身体却被抬起[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句含义艰深，直译近于“人活着时，他的身体被抬起”。希腊文平行文本作：“因为在活着的时候，我抛出他的内脏”，更明显地强调人体的败坏和人的必死性。
    reason: 说明重要的文本差异，并保留希伯来文难句可能具有的多重含义。
lexical_decisions:
- source_word: מַה יִּגְאֶה
  choice: 为何还骄傲
  rationale: מַה在此构成带责问意味的修辞疑问；גאה表示高傲、自高。“为何还骄傲”自然传达责问，也保留自高的含义。
- source_word: עָפָר וָאֵפֶר
  choice: 尘土和灰烬
  rationale: 这是表达人的卑微、脆弱和必死性的固定意象；采用现代汉语中清楚而庄重的直译。
- source_word: בְּחַיָּיו
  choice: 他活着时
  rationale: 直接表达“在他的一生中／在他活着的时候”，并以“他”明确此处所说的是人。
- source_word: יוּרַם
  choice: 被抬起
  rationale: 保留רום被动式的空间意象，不擅自解释为尊荣、安葬或抛弃。
- source_word: גִּוְיוֹ
  choice: 身体
  rationale: 该词可指身体或尸身；“身体”较少预断语境，并把可能的尸身含义留给注释说明。
theological_decisions:
- issue: 希伯来文末句含义艰深，且与希腊文平行文本差异显著
  choice: 以现存希伯来文为正文基础，译作“他活着时，身体却被抬起”
  alternative: 依希腊文译作“因为他活着时，我便丢出他的内脏”
  rationale: 希伯来文本虽难解但确实存留，故不以希腊文取代；同时不把“被抬起”解释成受尊荣或被抬去埋葬，以保留原文的歧义及其关于肉身脆弱、必死的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人既是”补明“尘土和灰烬”所指的人类，却未削弱原文的修辞意象；末句刻意保持略带突兀的表达，以免把有争议的希伯来文解释得过于确定。
