translation:
  language: zh_hans
  text: 上帝推翻了骄傲者的宝座，使谦卑者取而代之。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּסֵּא גֵאִים
  choice: 骄傲之人的宝座
  rationale: כִּסֵּא在希伯来文本中为单数集合性表达，可泛指骄傲者掌权的座位；译作“宝座”保留王权与统治意象。后续复数代词“他们”与גֵאִים相应。
- source_word: הָפַך
  choice: 倾覆了
  rationale: 该动词有翻转、推翻之意；“倾覆”既传达权位被颠覆，也保留原文鲜明的翻转意象。
- source_word: עֲנָוִים
  choice: 谦卑的人
  rationale: 可指谦卑、温顺或受压低的人；“谦卑的人”与前句“骄傲之人”形成直接的伦理对照，同时不额外限定其社会身份。
- source_word: וַיֹּשֶׁב
  choice: 让……坐
  rationale: 使役词形表示使某人坐下或安置其就位；此处与“宝座”语境相连，译作“让……坐”自然且准确。
- source_word: תַּחְתָּם
  choice: 在他们的位置上
  rationale: 字面为“在他们之下／代替他们”，语境指谦卑者取代骄傲者的权位；此译保留替代关系，并避免误解为空间上的下方。
theological_decisions:
- issue: 施行倾覆者的称谓
  choice: 上帝
  alternative: 主
  rationale: 希伯来主要文本明确作אֱלֹהִים（上帝）；希腊平行文本作ὁ κύριος（主）。以高可信度的希伯来文本为首要依据，采用“上帝”。
- issue: 宝座的数
  choice: 采用单数“宝座”
  alternative: 复数“宝座”
  rationale: 希伯来文本כִּסֵּא为单数，故正文保留其形式；希腊平行文本θρόνους及英语咨询层采用复数，但不足以取代现存希伯来读法。单数在此可作集合性表达，不要求骄傲者只有一个共同宝座。
- issue: 谦卑者取代骄傲者的含义
  choice: 译为坐在他们的位置上
  alternative: 坐在他们下面
  rationale: תַּחְתָּם在此结合倾覆宝座和使人坐下的语境，主要表达取代；不将其扩展为关于某一具体政体或末世秩序的教义陈述。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“倾覆—坐在”保留原文权位逆转的画面；“骄傲之人—谦卑的人”形成清楚对照。正文无脚注，因此没有脚注标记。
