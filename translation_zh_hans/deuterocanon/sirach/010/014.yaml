  text: Therefore God filled his heart and struck him[b][a], and struck him down completely.
translation:
  language: zh_hans
  text: 因此，上帝充满了他的心，又击打他[a][b]，把他彻底击倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处艰涩，直译近于：“因此，上帝充满了他的心，击打。”希腊文则作：“因此，主使所降的灾祸（或：审判）非同寻常，把他们彻底毁灭。”
    reason: 文本异文
  - marker: b
    text: 希腊文作“主”；现存希伯来文本作“上帝”。
    reason: 异文读法
lexical_decisions:
- source_word: עַל כֵּן
  choice: 因此
  rationale: 这是常见的推论连接语，承接前文并引出骄傲所招致的后果。
- source_word: מִלֵּא לִבּוֹ
  choice: 使他的心充满
  rationale: 按现存希伯来文本保留“充满他的心”这一措辞；原文没有说明充满什么，因此不擅自补入“恐惧”或“灾祸”，并以脚注说明文本困难。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 现存希伯来见证作 אֱלֹהִים；希腊文作“主”，作为异文收入脚注。
- source_word: נָגַע
  choice: 击打
  rationale: 该词在惩罚语境中可指击打、降灾或使受苦；“击打”既符合语境，也保留与后一句之间近似重复的张力。
- source_word: וַיַּכֵּהוּ
  choice: 把他击倒
  rationale: נכה 的使役式在审判语境中表示重击；译作“击倒”体现其毁灭性的结果，并与前面的“击打”有所区分。
- source_word: עַד כַּלֵּה
  choice: 彻底
  rationale: 该短语表示直到毁灭、完全终结；“彻底”是自然简洁的现代汉语表达，希腊文 εἰς τέλος 也支持这一总体意义。
theological_decisions:
- issue: 希伯来文与希腊文使用不同的神称
  choice: 正文采用“上帝”
  alternative: “主”
  rationale: 本节有现存希伯来文本，故正文以其 אֱלֹהִים 为准；希腊文 Κύριος 的读法在脚注中保留，不作调和。
- issue: 希伯来文前半句语法艰涩且可能存在文本问题
  choice: 较直译为“上帝使他的心充满，又击打他”
  alternative: “上帝使他的心充满恐惧”或依希腊文译作“主使灾祸非同寻常”
  rationale: 希伯来文没有明说心中充满什么，补入“恐惧”会消除原文的不确定性；正文因此保留其突兀表达，并由脚注提供希腊平行文本。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文刻意保留希伯来文中“使他的心充满”未交代内容的艰涩，以及连续两次“击打”的张力；不以未经明说的“恐惧”补足句意。脚注标记按首次涉及文本困难、随后涉及神称异文的顺序列为[a][b]。
