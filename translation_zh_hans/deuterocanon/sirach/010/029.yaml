  text: Who will declare righteous the one who condemns himself[a], and who will honor the one who dishonors himself?
translation:
  language: zh_hans
  text: 定自己有罪的人，谁能宣告他为义[a]？轻看自己的人，谁会尊重他？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证作：“穷人因自己的知识而受尊重，富人因自己的财富而受尊重。”这里的希伯来文与希腊文保存了内容显著不同的格言。
    reason: alternative_reading
lexical_decisions:
- source_word: מַרְשִׁיעַ
  choice: 定……有罪
  rationale: 该词是רשע的使役词形，通常带有司法色彩，意为“判定有罪、定罪”。这里以“定自己有罪”保留其司法意味，也自然表达反身关系。
- source_word: נַפְשׁוֹ
  choice: 自己
  rationale: נפש可指生命、性命或自身；两句中均表示人对待自己。译作“自己”符合现代汉语，且避免将其不必要地限定为与身体相对的“灵魂”。
- source_word: יַצְדִיקֶנּוּ
  choice: 宣告他为义
  rationale: צדק的使役词形在此具有司法意义，即判定或宣告某人为义。“宣告他为义”明确保留这一语义，又不以术语化的“称义”预先引入后来的教义联想。
- source_word: יְכַבֵּד
  choice: 尊重
  rationale: כבד的加强词形常指尊敬、尊重。此处描述社会评价，“尊重”自然地与下句的“轻看”相对。
- source_word: מַקְלֶה
  choice: 轻看
  rationale: 该词源于קלל，核心意象是看轻、贬低或不尊重。“轻看”既贴近字义，又能与“尊重”构成清晰对照。
theological_decisions:
- issue: 希伯来文与希腊文见证内容显著不同
  choice: 正文依据现存希伯来文，译为关于人定自己有罪、轻看自己的格言。
  alternative: 希腊文：“穷人因自己的知识而受尊重，富人因自己的财富而受尊重。”
  rationale: 本节有可靠的希伯来文见证，故正文以希伯来文为主。希腊文保存的是实质上不同的格言，不能与希伯来文调和或拼合，因此在脚注中完整注明这一重要异文传统。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两句保留希伯来诗句的平行结构及司法、社会评价之间的张力；以“自己”表达נפש的反身含义，避免不必要地译成“灵魂”。
