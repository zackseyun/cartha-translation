  text: At a man's death[a], his inheritance is maggots and worms[b], gnats and creeping things.
translation:
  language: zh_hans
  text: 人死时，他所继承的是蛆虫、蠕虫、虱子[a]和爬行之物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虱子”所译的希伯来词也可理解为小飞虫，或较笼统的“害虫”；具体所指并不确定。
    reason: 词义存在合理的翻译选择。
  - marker: b
    text: 希腊文平行本的生物清单较宽泛，作：“他将继承爬行之物、走兽和蠕虫。”这与希伯来文的清单不同。
    reason: 记录希腊文平行本的重要异文。
lexical_decisions:
- source_word: בְּמוֹת אָדָם
  choice: 人死时
  rationale: 介词 בְּ 与不定式连用，在这里表示时间，即“当人死时”。אָדָם 指一个有代表性的人，现代汉语用“人”既自然，也保留这句格言的普遍适用性。
- source_word: יִנְחַל
  choice: 所继承的是
  rationale: 该动词意为“继承、承受为产业”。用“所继承的是”保留原文带有反讽意味的“继承”意象，并自然引出后面的生物清单。
- source_word: רִמָּה
  choice: 蛆虫
  rationale: 该词常指尸体腐败时出现的蛆或类似虫类；译作“蛆虫”符合死亡语境，也与后面的 תוֹלֵעָה 略作区分。
- source_word: וְתוֹלֵעָה
  choice: 和蠕虫
  rationale: 该词通常表示虫、蠕虫。单独译出，以保留希伯来文并列两种近似腐尸虫类的表达。
- source_word: כִּנִּים
  choice: 虱子
  rationale: 该词可指虱子，也可能泛指极小的寄生虫或成群小虫；正文采用常见而具体的“虱子”，并以脚注保留词义的不确定性。
- source_word: וָרֶמֶשׂ
  choice: 和爬行之物
  rationale: רֶמֶשׂ 是涵盖面较广的词，指爬行或蠕动的小生物。“爬行之物”不把它过度限定为现代分类学意义上的爬行动物。
theological_decisions:
- issue: אָדָם 的代表性用法
  choice: 人
  alternative: 男人；一个人；人类
  rationale: 此处说的是一个有代表性的人，并由此表达人人终有一死的普遍事实。汉语“人”无需标明语法性别，既忠于所指，也避免误导读者以为本句只谈男性。
- issue: 以现存希伯来文为主要文本，同时参考希腊文平行本
  choice: 按希伯来文译出“蛆虫和蠕虫、虱子和爬行之物”
  alternative: 按希腊文译作“爬行之物、走兽和虫子”
  rationale: 本节有可信度高的希伯来文见证，应以其具体清单为正文。希腊文支持“人死后承受卑微生物”的总体含义，却在清单上有差异，因此将其保留在脚注中，而不混合两种文本。
- issue: “继承”意象的保留
  choice: 所继承的是
  alternative: 死后归于；死后只剩下
  rationale: 原文使用继承动词，借人通常盼望得到产业的观念，反衬死亡时身体落入虫类之中。正文保留这一张力，不将其解释性改写为一般的尸体腐败描写。
translation_notes:
  register: 采用现代、庄重而易懂的格言式表达。“人死时”简洁直接；“所继承的是”保留原文反讽性的产业意象；“爬行之物”保持圣经语域，同时避免把 רֶמֶשׂ 狭义化。两个脚注标记均置于正文相关位置。
