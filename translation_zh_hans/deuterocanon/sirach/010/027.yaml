  text: Better is one who works and has abundant wealth than one who honors himself and lacks food[a].
translation:
  language: zh_hans
  text: 劳作且家财丰足的人，胜过自抬身价却缺少食物的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证作：“孩子，要以温柔尊荣你的心灵，并按它的价值给它尊荣。”这里的希伯来文与希腊文有重大差异。
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: 胜过
  rationale: 智慧格言中的比较用法；用“胜过”自然呈现希伯来文“好于……”的结构。
- source_word: עוֹבֵד
  choice: 劳作
  rationale: עבד在此指工作、劳动；上下文对比的是实际劳作与自我抬高，并非奴仆身份。
- source_word: וְיוֹתֵר הוֹן
  choice: 而家产丰足
  rationale: 短语较为凝练，הוֹן指财富、资财，יוֹתֵר表达有余或丰足；“家产丰足”既保留经济含义，也与后面的匮乏形成清楚对照。
- source_word: מִמִּתְכַּבֵּד
  choice: 自抬身价
  rationale: Hitpael词形宜理解为反身意义，即抬高、尊荣自己；“自抬身价”以现代汉语表达装腔自重、自视甚高之意，而非被别人尊重。
- source_word: וַחֲסַר
  choice: 却缺少
  rationale: 连接词在对比关系中自然译为“却”，突出自我抬高与实际匮乏之间的反差。
- source_word: מַתָּן
  choice: 食物
  rationale: 该词形可让人联想到“礼物”，但在本句财富与缺乏的经济语境中，更可能指供应、生计所需；译作“食物”沿用可理解的具体意义，同时其不确定性值得留意。
theological_decisions:
- issue: 《便西拉智训》10:27的希伯来文与希腊文见证严重分歧
  choice: 正文依现存希伯来文翻译，并在脚注完整保留希腊文异读。
  alternative: 希腊文：“孩子，要以温柔使你的灵魂得荣耀，并按它应得的尊荣它。”
  rationale: 本项目在希伯来文存世处以希伯来文为主要文本依据；但这里的希腊文不是细微措辞差异，而是内容完全不同，故须在脚注中透明呈现，不将二者调和。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留智慧格言的对偶和比较结构。“自抬身价”较口语化但不轻佻，可清楚传达反身性的自我抬高；脚注明示文本见证的重大分歧。
