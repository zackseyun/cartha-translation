  text: Kingship passes from nation to nation because of violence and arrogance[a].
translation:
  language: zh_hans
  text: 王权从一国转到另一国，是因暴力和骄傲。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊传统作：“王权从一国转移到另一国，是因不义、暴行和钱财。”
    reason: textual_variant
lexical_decisions:
- source_word: מַלְכוּת
  choice: 王权
  rationale: 此词在这里主要指君王的统治权或政治主权，而非单指疆域；“王权”既保留抽象意义，也符合政权在列国之间转移的语境。
- source_word: מִגּוֹי אֶל גּוֹי
  choice: 从一国转到另一国
  rationale: גוי在此具有政治共同体的含义；这一表达自然、清楚地传达统治权由一个国家转移给另一个国家。
- source_word: תִּסֹּב
  choice: 转到
  rationale: 原动词有转动、转移之意；在王权更替的语境中，“转到”简洁自然，又不过度解释其方式。
- source_word: בִּגְלַל
  choice: 是因
  rationale: 明确表达原因关系，并保持格言式句子的凝练。
- source_word: חֲמַס
  choice: 暴力
  rationale: חמס常指暴力及暴行；希腊文作“不义”，但现存高可信度希伯来文本应居首，因此采用“暴力”。
- source_word: גַּאֲוָה
  choice: 骄傲
  rationale: 此词指高傲、自大这一道德恶习；“骄傲”是现代汉语中清楚而庄重的对应词。
theological_decisions:
- issue: 希伯来文本与希腊传统所列原因不同
  choice: 正文依希伯来文本译作“暴力和骄傲”两项。
  alternative: 希腊传统作“不义、暴行和钱财”三项。
  rationale: 本节有高可信度且经核验的希伯来文本，故正文以之为据；希腊传统的差异具有实质意义，保留在脚注中，不将两种文本合并。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。“王权”准确表达抽象的统治权；句式简洁，保留希伯来文的因果力度。
