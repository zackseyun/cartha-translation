  text: He swept them from the earth and uprooted them[a], and he made their memory cease from the earth.
translation:
  language: zh_hans
  text: 他将他们从地上扫除[a]，又将他们连根拔起；他使他们的记念从地上消逝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扫除”所译的希伯来词 וְסִחָם 含义较难确定；希腊文平行文本支持清除或灭除之意。也可译作：“他把他们从地上抹去，又将他们连根拔起。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִחָם
  choice: 把他们……扫除
  rationale: 此词形较罕见，具体意象不完全确定；希腊文平行文本支持清除、灭除之意。“扫除”既保留力度和形象，也不过度限定为“使枯干”。
- source_word: מֵאֶרֶץ
  choice: 从地上
  rationale: אֶרֶץ 可指“土地”或“大地”；此处描述彻底消灭，且后半句重复这一表达，译作“地上”自然，并保留较广的范围。
- source_word: וַיִּתְּשֵׁם
  choice: 又将他们连根拔起
  rationale: נתשׁ 常指拔出、拔除；“连根拔起”在现代汉语中自然地表达彻底清除的比喻。
- source_word: וַיַּשְׁבֵּת
  choice: 使……消逝
  rationale: שׁבת 的使役式表示使之止息。与“记念”搭配时，“使……消逝”比直译“使……停止”更自然，同时保留使其不复存在的含义。
- source_word: זִכְרָם
  choice: 他们的记念
  rationale: זֵכֶר 可指记忆、纪念或留在人间的名声。“记念”保留其语义宽度，既可指人对他们的记忆，也可指他们遗留的名号。
