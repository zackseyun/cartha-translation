  text: Arrogance and insolence are not fitting for a human being[a], much less for one born of a woman.
translation:
  language: zh_hans
  text: 狂傲和放肆与世人不相称[a]，更不与妇人所生的人相称。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“狂傲不是为世人所造的，暴怒也不是为妇人所生的人所造的。”希伯来文本则作“狂傲和放肆……更不与妇人所生的人相称”。
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאוֶה
  choice: 不相称
  rationale: 希伯来语表达“不合宜、不合身份”的评价义；“不相称”自然、庄重，也不引入希腊平行文本“不是为……受造”的措辞。
- source_word: לֶאֱנוֹשׁ
  choice: 与世人
  rationale: אֱנוֹשׁ指作为软弱、必死者的人类；“世人”既保留泛指人类的意义，也与下句“生于妇人的人”形成自然呼应。
- source_word: זָדוֹן
  choice: 狂傲
  rationale: 该词指骄傲自大、妄自尊高；“狂傲”能体现其内在的自高姿态。
- source_word: וְעַזוּת
  choice: 放肆
  rationale: 该词表示厚颜、强横而无所顾忌；“放肆”传达外显的冒犯和无礼，并与“狂傲”有所区分。
- source_word: אַף
  choice: 就更
  rationale: 此处具有递进、加强语气的作用；“就更……了”在现代汉语中自然表达“更何况／更不适合”的高潮意味。
- source_word: לִילוּד אִשָּׁה
  choice: 生于妇人的人
  rationale: 直承希伯来语惯用表达，强调凡人的受生与脆弱；这一措辞也与希腊平行文本“妇人所生的”相合。
theological_decisions:
- issue: 希伯来文本与希腊平行文本的关系
  choice: 正文以现存且可信度高的希伯来文本为准，译作“不相称”，并将第二项恶德译为“放肆”。
  alternative: “狂傲不是为世人所造的，暴怒也不是为妇人所生的人所造的。”
  rationale: 希腊文本在谓语（“不是受造的”）和第二项恶德（“暴怒”）上均与希伯来文本有显著差异。既然希伯来见证完整且经校验，正文应优先依据希伯来语；希腊异文则以脚注保存，不将两种传统混合。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“狂傲和放肆”保留两个彼此相关但不相同的恶德；“世人”与“生于妇人的人”体现普遍人性及凡人的脆弱。脚注标记[a]已置于正文相应位置。
