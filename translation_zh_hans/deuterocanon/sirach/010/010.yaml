translation:
  language: zh_hans
  text: 一点小病就使医生面色发黄[a]；今天是君王，明天就倒下[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“使医生变黄”，描写疾病使人显出病态面色。希腊文平行文本的前半句则作“医生嘲弄久病”，反映了不同的文本传统。
    reason: lexical_and_textual_alternative
  - marker: b
    text: 希腊文平行文本作“明天就会死去（或：走到尽头）”，把希伯来文“倒下”更具体地理解为死亡。
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶץ מַחֲלָה
  choice: 一点小病
  rationale: שֶׁמֶץ表示极少的量或轻微程度；与מַחֲלָה连用，译为“一点小病”自然简洁，也保留轻微疾病竟使医生变色的反讽意味。
- source_word: יַצְהִיב
  choice: 使……面色发黄
  rationale: 该动词表达变黄或显出病态颜色。中文“面色发黄”既保留希伯来文明确的颜色意象，也符合疾病影响外貌的自然说法；不泛化为单纯“脸色苍白”。
- source_word: רוֹפֵא
  choice: 医生
  rationale: 指医治者；“医生”是现代标准汉语中自然、明确且不失庄重的称呼。
- source_word: מֶלֶךְ
  choice: 君王
  rationale: 准确表达王者身份；“君王”适合智慧文学的庄重语体。
- source_word: הַיּוֹם וּמָחָר
  choice: 今天……明天……
  rationale: 保留原文紧凑的时间对照，以突显权势转瞬即逝。
- source_word: יִפּוֹל
  choice: 倒下
  rationale: 希伯来文基本义为“倒下、坠落”，可涵盖死亡、败亡或失势而不限定其中一种；“倒下”保留了这一开放性。
theological_decisions:
- issue: 君王次日的结局应明确译为死亡，还是保留较宽泛的倒下意象
  choice: 倒下
  alternative: 死去／走到生命尽头
  rationale: 希伯来文יִפּוֹל本身只说“倒下”，虽可暗示死亡，却也可能指败亡或失势。正文保留希伯来文的宽泛意象；希腊文将其具体理解为死亡，列入脚注。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。分号保留两幅人生无常图景之间的并列关系；“今天是君王，明天就倒下”维持原文突兀有力的对照，不补入死亡或失势等解释性限定。
