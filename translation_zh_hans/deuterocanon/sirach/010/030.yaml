  text: There is a poor man who is honored because of his insight[a], and there is one who is honored because of his wealth.
translation:
  language: zh_hans
  text: 有一个穷人因他的见识而受人尊重[a]；也有一个人因他的财富而受人尊重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“在贫穷中受尊重的人，在富有时岂不更受尊重？富有时尚不受尊重的人，在贫穷时岂不更不受尊重？”希伯来文与希腊文在这里差异很大。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: 贫穷人
  rationale: 此词可指贫穷或弱小的人。译作“贫穷人”保留原文单数个体的表达，也自然衔接本节关于财富与社会尊重的对比。
- source_word: נִכְבָּד
  choice: 受人尊重
  rationale: 该词在此为被动意义，表示被看重、受尊敬。“受人尊重”既保留社会评价的意味，也避免译成“荣耀”而赋予过强的宗教色彩。
- source_word: בִּגְלַל
  choice: 因
  rationale: 介词表示原因或依据；“因”简洁自然，并使两个分句保持平衡。
- source_word: שִׂכְלוֹ
  choice: 自己的见识
  rationale: שכל可表示理解力、明辨力或审慎。“见识”在现代汉语中自然易懂，能表达理智与判断力，又不把它直接等同于范围更广的“智慧”。“自己的”明确保留第三人称单数领属关系。
- source_word: עָשְׁרוֹ
  choice: 自己的财富
  rationale: 该词指物质财富。“财富”准确而中性，并与前句的“贫穷人”形成清楚对照。
- source_word: יֵשׁ ... וְיֵשׁ
  choice: 有……也有……
  rationale: 这一存在句式列举两种相对的情形。“有……也有……”保留格言式的平行结构，同时符合现代汉语习惯。
theological_decisions:
- issue: 希伯来文本与希腊平行文本存在重大差异
  choice: 正文依现存希伯来文，陈述两种受尊重的人：一人因见识受尊重，另一人因财富受尊重。
  alternative: 希腊文意为：“在贫穷中受尊重的人，在富有时岂不更受尊重？富有时尚不受尊重的人，在贫穷时岂不更不受尊重？”
  rationale: 现存希伯来文本完整且置信度高，因此作为正文依据；但希腊平行文本并非细微异文，而是结构和意义均显著不同，可能反映不同的传本形式，故在脚注中完整提示，不擅自调和两者。
translation_notes:
  register: 采用现代、庄重而通俗的格言体。“受人尊重”在两分句中重复，以保留希伯来文的平行和强调；脚注标记[a]置于第一分句末，提示整节存在重要的希腊异文。
