  text: Do not act wisely in doing your work, and do not boast in a time of distress.[a]
translation:
  language: zh_hans
  text: 做你的工作时，不要卖弄聪明；在你困苦的时候，也不要自夸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文见证在这里有很大差异：“明智的仆人被高举，愚昧的仆人不会抱怨。”末一动词的含义不确定，也可能有“发怨言”或“寻找借口”等意味。
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ σοφίζου
  choice: 不要卖弄聪明
  rationale: σοφίζου在此并非禁止真正的智慧，而是警戒故作聪明、炫示才智；“卖弄聪明”自然地保留这种负面语气。
- source_word: ποιῆσαι τὸ ἔργον σου
  choice: 做你的工作时
  rationale: 表达所警戒行为发生的范围或情境；“做你的工作时”符合现代汉语，也保留ἔργον的工作、任务之义。
- source_word: μὴ δοξάζου
  choice: 不要自夸
  rationale: δοξάζου在劝诫语境中带有自我抬高、夸耀之意；“自夸”准确而简洁。
- source_word: ἐν καιρῷ στενοχωρίας σου
  choice: 在你困苦的时候
  rationale: στενοχωρία指困苦、窘迫或患难；此译保留καιρός的时间意味，并采用普通读者易懂的措辞。
- source_word: עֶבֶד מַשְׂכּיל הוּרָם, וְעֶבֶד סָכָל לֹא יִתְאוֹנֵן
  choice: 不收入正文，列于脚注
  rationale: 现存希伯来文与希腊文在意义上严重不一致。为避免拼合两个不同文本，正文依照所给希腊见证，脚注完整说明希伯来异文及末一动词的不确定性。
theological_decisions:
- issue: 《便西拉智训》10:25希伯来文与希腊文见证严重分歧
  choice: 正文采用希腊文的劝诫：工作时不要卖弄聪明，困苦时不要自夸。
  alternative: 现存希伯来文大意为：“明智的仆人被高举，愚昧的仆人不会抱怨。”末一分句也可能含“发怨言”或“寻找借口”等意味。
  rationale: 这是文本批判问题，而非应被默默调和的教义问题。两个见证无法自然合并；正文据希腊文翻译，并以脚注诚实保存重要的希伯来异文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“卖弄聪明”避免把希腊文误解为禁止真正明智地工作；句式保留两项并列劝诫。脚注明示重大文本差异，不将希伯来文与希腊文强行调和。
