  text: Pride is hateful to the Lord and to men[a], and from both comes oppressive wrongdoing.
translation:
  language: zh_hans
  text: 骄傲为主和世人所憎恶；欺压在双方看来都是罪过。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文后半句十分凝缩，直译近于“从双方，欺压是罪过”，也可能理解为“从双方而来的是欺压人的罪行”。希腊文同样保留了“从双方”的表达，句法也有歧义。
    reason: 说明原文压缩句法及另一种可能读法，避免把有争议的关系解释伪装成确定含义。
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: 所憎恶
  rationale: 这是由“恨、憎恶”词根构成的谓语形式，表示骄傲是厌恶的对象；中文被动式自然保留了原文的评价力度。
- source_word: לְאָדוֹן
  choice: 为主
  rationale: אדון 本可指主人，但本节智慧文学语境及希腊文 Κυρίου 均支持以神为所指，故译作神圣称号“主”。
- source_word: וַאֲנָשִׁים
  choice: 和世人
  rationale: 原文为泛指人类的阳性复数。现代汉语用“世人”可自然表达与“主”相对的人间群体，又不误解为仅指成年男性。
- source_word: גַּאֲוָה
  choice: 骄傲
  rationale: 该词表示自高、自负；“骄傲”是现代中文智慧文学语境中最通顺且道德色彩明确的对应词。
- source_word: וּמִשְּׁנֵיהֶם
  choice: 在双方看来
  rationale: 字面近于“从两者/双方”，回指主与世人。结合后面的名词短语，译为双方对欺压的一致判定最合中文，也避免把罪恶说成源自神；原文压缩结构的另一种理解收入脚注。
- source_word: מַעַל
  choice: 罪过
  rationale: מעל 可表示不忠、冒犯或过犯；此处用“罪过”保留其道德冒犯含义，而不强加特定的盟约语境。
- source_word: עֹשֶׁק
  choice: 欺压
  rationale: 该词具体指压迫、剥削或勒索。“欺压”准确保留希伯来文比希腊文一般性“不义”更具体的社会伦理含义。
theological_decisions:
- issue: אֲדוֹן 的所指
  choice: 主，即神
  alternative: 人间的主人
  rationale: 希腊平行文本使用 Κυρίου，且“主与世人”的并列清楚指向神与人；因此采用神圣称号，但不进一步添加专名。
- issue: וּמִשְּׁנֵיהֶם מַעַל עֹשֶׁק 的关系
  choice: 欺压对主和世人双方都是罪过
  alternative: 从双方而来的是欺压人的罪行
  rationale: 希伯来文高度凝缩，介词 מן 的功能存在解释空间。所选译法与“主和世人”作为共同憎恶、判定罪恶的双方相符，并避免产生罪恶源自神的神学误解；脚注明示另一种较贴字面的句法理解。
- issue: אֲנָשִׁים 的性别范围
  choice: 世人
  alternative: 男人
  rationale: 此处该阳性复数与神相对，泛指人类而非专指男性；“世人”在现代汉语中准确传达其代表性用法。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“为……所憎恶”保留智慧文学格言的凝练感；“世人”“欺压”“罪过”均为普通读者易懂而又不过分口语化的表达。
