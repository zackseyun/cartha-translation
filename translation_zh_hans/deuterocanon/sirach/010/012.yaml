  text: The beginning of a man's pride is defiance[a], and his heart turns away from his Maker.
translation:
  language: zh_hans
  text: 人的骄傲以狂妄为开端；他的心背离造他的那一位。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“人骄傲的开端，是他离弃主；他的心已经离开了造他的那一位。”希伯来文本的上半句较短，正文依希伯来见证翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַת
  choice: 始于
  rationale: 该词表示“开始、开端”。译作“始于”使汉语箴言式表达自然紧凑，同时保留起始关系。
- source_word: גְּאוֹן
  choice: 骄傲
  rationale: 此处指人在道德意义上的自高。“骄傲”是现代汉语中清楚自然的对应词，也保留了其负面含义。
- source_word: אָדָם
  choice: 人
  rationale: 希伯来语用单数通称，所指具有普遍性；汉语“人”既保留单数代表意义，也不把经文限制为男性。
- source_word: מוּעָז
  choice: 狂妄
  rationale: 该词含有大胆越界、傲慢无忌的意味。“狂妄”能表达这种自高而放肆的道德色彩，又不把希伯来文未明说的对象补入正文。
- source_word: וּמֵעֹשֶׂהוּ
  choice: 造他的那一位
  rationale: 原文直译为“从造他的那一位”。这一译法准确、自然，也明确指向创造者，却不额外加入希伯来正文没有的称号。
- source_word: יָסוּר לִבּוֹ
  choice: 他的心偏离
  rationale: סור表示转开、偏离；“心偏离”保留希伯来语的意象，并以现代汉语表达内在忠诚和取向的转变。
theological_decisions:
- issue: 是否依照希腊语平行文本，明确说狂妄是“离弃主”
  choice: 正文依从希伯来文本，译作“狂妄”，由下半句说明这是对创造者的偏离。
  alternative: “人骄傲的开端，是他离弃主；他的心离开了造他的那一位。”
  rationale: 希伯来见证在上半句较简短，מוּעָז并未明说狂妄所针对的对象。希腊语平行文本阐明了其神学方向，但不宜据此扩写希伯来正文；因此将希腊读法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。分号保留原文两个对应分句；“造他的那一位”避免生硬，也不额外引入“主”这一称号。
