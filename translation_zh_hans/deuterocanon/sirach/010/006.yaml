  text: For any offense[a], do not repay your neighbor with evil, and do not walk in the way of pride.
translation:
  language: zh_hans
  text: 无论因什么过犯，都不可向邻人以恶相报；也不可走傲慢的道路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֵל פֶּשַׁע
  choice: 无论受到什么冒犯
  rationale: 该短语直译为“因任何过犯／冒犯”。置于禁令中，用“无论受到什么冒犯”自然表达其周遍意义，同时交代报复行为的缘由。
- source_word: אַל תְּשַׁלֵּם רַע
  choice: 不要以恶报复
  rationale: שׁלם 的皮埃勒词干可表示“偿还、报偿”；“以恶报复”保留针对所受冒犯进行恶意回报的含义。
- source_word: לְרֵעַ
  choice: 邻人
  rationale: רֵעַ 可指邻舍、同伴或身边的人；“邻人”简洁庄重，也与希腊文 τῷ πλησίον 相符。
- source_word: וְאַל תִּהֲלַךְ
  choice: 也不要走
  rationale: 保留 הלך“行走”的道路隐喻；现代汉语中的“走……道路”也自然表达生活方式和行为取向。
- source_word: בְּדֶרֶךְ גַּאֲוָה
  choice: 骄傲的道路
  rationale: 保留 דֶּרֶךְ 的道路意象；גַּאֲוָה 在此指骄傲、自高或傲慢，“骄傲的道路”准确而易懂。
theological_decisions:
- issue: 希伯来文与希腊文在第一项禁令上的差异
  choice: 正文依高可信度希伯来文译作“不要以恶报复邻人”
  alternative: 希腊文可译作“不要因任何不义而恼恨邻人”
  rationale: 现存希伯来文明确使用“报偿”一类动词，侧重禁止以恶回报；希腊文则侧重愤怒或怨恨。正文以希伯来文为准，并用脚注保留希腊平行文本的不同侧重，不将两者强行合并。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“以恶报复”清楚呈现希伯来文的报偿含义；“走骄傲的道路”保留智慧文学常见的道路隐喻。
