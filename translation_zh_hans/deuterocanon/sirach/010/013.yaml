  text: For the hope of arrogance is sin[a], and its source pours out wickedness.
translation:
  language: zh_hans
  text: 因为狂傲的盼望是罪[a]；它的泉源涌出邪恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“因为骄傲的开端是罪；持守它的人必倾泻出可憎之物。”希腊文的第一分句明显不同，第二分句也有所扩展。
    reason: alternative_reading
lexical_decisions:
- source_word: מִקְוֵה
  choice: 所寄望的
  rationale: מִקְוֵה通常可指“希望”或“所倚赖、所寄望之物”。这里用“所寄望的”保留其直接含义，并使“狂傲”拟人化的表达在现代汉语中较自然；希腊文ἀρχή“开端”作为异文收入脚注。
- source_word: זָדוֹן
  choice: 狂傲
  rationale: זָדוֹן表示骄横、自负、僭妄的态度。“狂傲”既传达强烈的道德贬义，也符合庄重而通俗的智慧文学语体。
- source_word: חֵטְא
  choice: 罪
  rationale: 直接对应表示罪过的名词，也与希腊文ἁμαρτία一致。
- source_word: מְקוֹרָהּ
  choice: 它的源头
  rationale: 阴性后缀最自然地回指拟人化的“狂傲”。“源头”保留泉源意象，同时可与后面的“涌出”自然搭配。
- source_word: יַבִּיעַ
  choice: 涌出
  rationale: 该动词可描写泉水冒出、涌流，也可引申为发出；“涌出”在此保留与“源头”相连的水流意象。
- source_word: זִמָּה
  choice: 恶事
  rationale: זִמָּה可指恶念、邪谋、败坏或可耻行为。“恶事”保持广义的道德力度，不把含义局限于淫乱；希腊文较强的“可憎之物”见脚注。
theological_decisions:
- issue: 本节开头希伯来文מִקְוֵה与希腊文ἀρχή的差异
  choice: 正文依现存希伯来文译为“狂傲所寄望的是罪”
  alternative: 依希腊文可译为“骄傲的开端是罪”
  rationale: 本节有可信度较高的希伯来文见证，应优先作为正文依据。希腊文反映显著不同的文本传统，而且第二分句也有所扩展，因此在脚注完整保留，不以解释性选择消除两者张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“狂傲—源头—涌出”保留原文的拟人化及泉源意象；第一分句略显反常的神学张力按希伯来文保留，不改写成因果解释。
