  text: A ruler[a], a governor, and a judge are honored, but none is greater than one who fears God.
translation:
  language: zh_hans
  text: 领袖、统治者和审判官都受人尊重，但没有人比敬畏上帝的人更尊贵。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里有显著不同的读法：“自由人要服侍有智慧的奴仆；明达的人不会抱怨。”
    reason: textual_variant
lexical_decisions:
- source_word: נָגִיד
  choice: 领袖
  rationale: 指被立在众人之上、拥有权柄的人；“领袖”自然宽泛，也避免“王子”可能带来的世袭含义。
- source_word: מוֹשֶׁל
  choice: 统治者
  rationale: 指实际行使治理权的人；与“领袖”并列，尽量保留原文三项身份的区分。
- source_word: שׁוֹפֵט
  choice: 审判官
  rationale: 准确表达司法职分；较“法官”略具古代公共职务的庄重感。
- source_word: נִכְבָּדוּ
  choice: 都受人尊重
  rationale: 该词为复数被动形式，表示这些人受到尊重或重视；补出“人”使现代汉语更自然。
- source_word: וְאֵין גָּדוֹל
  choice: 但没有谁……更尊贵
  rationale: 表达与前半句的转折及最高级比较；“尊贵”承接前文社会荣誉的语境。
- source_word: מִיְּרֵא אֱלֹהִים
  choice: 比敬畏上帝的人
  rationale: 保留圣经中“敬畏上帝”这一兼具敬重、虔诚与顺服意味的核心表达，并保持代表性的单数人物。
theological_decisions:
- issue: 希伯来文本与希腊平行文本显著不同
  choice: 正文以现存希伯来文为依据，并用脚注注明希腊文本的另一读法。
  alternative: 按希腊文本译作：“自由人要服侍有智慧的奴仆；明达的人不会抱怨。”
  rationale: 此处希伯来文本完整且可信度高，应作为《便西拉智训》的主要翻译依据；希腊文并非轻微异文，而是保存了完全不同的格言，因此不混入正文，而在脚注中如实保留。
- issue: “敬畏上帝”的表达
  choice: 保留“敬畏上帝”。
  alternative: 译作“敬重上帝”或“虔敬上帝”。
  rationale: “敬畏”是圣经传统中的重要神学用语，含义不等同于单纯害怕，也不宜弱化为一般尊敬；保留原有张力最为妥当。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。三项职分用“领袖、统治者和审判官”呈现，避免过度现代行政化；后半句用“更尊贵”与前半句“受人尊重”形成自然呼应。脚注标记置于完整陈述希伯来读法之后，提示整节存在希腊异文。
