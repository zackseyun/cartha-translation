base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/003.yaml
  text: As the judge of a people[a], so are his officials; and as the head of a city, so are its inhabitants.
translation:
  language: zh_hans
  text: 百姓的审判官怎样，他的官员也怎样[a]；一城的首领怎样，城里的居民也怎样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“没有教养的君王必毁灭自己的百姓；一座城必因统治者的明智而有人居住。”现存希伯来文本与希腊文本在本节有显著差异；正文依据现存希伯来文本。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשׁוֹפֵט עַם
  choice: 百姓的审判官怎样
  rationale: שׁוֹפֵט兼有审判者与治理者的含义；译作“审判官”保留其基本称谓，也与本节政治治理的语境相符。כְּ…כֵּן…采用“怎样……也怎样”的汉语格言式结构。עַם在此为泛指群体，译作“百姓”自然简洁。
- source_word: מְלִיצָיו
  choice: 他的官员
  rationale: מֵלִיץ可指传译者、代言人或中介者；在统治与城市治理的上下文中，更可能指审判官身边履行职务的人，故译“官员”，同时避免过度限定为谋士或发言人。
- source_word: וּכְרֹאשׁ עִיר
  choice: 一城的首领怎样
  rationale: רֹאשׁ字面为“头”，用于人时可指首领。现代汉语以“首领”既保留领头者的意象，又比“一城之头”自然；עִיר以“一城”表达格言中的泛指。
- source_word: יוֹשְׁבָיו
  choice: 城里的居民
  rationale: יֹשֵׁב指居住者；译作“居民”准确简洁。补出“城里的”以清楚表达希伯来语第三人称复数附属代词所指向的城市。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本显著不同
  choice: 正文依据现存且可信度高的希伯来文本，呈现审判官、官员、城市首领与居民彼此对应的格言。
  alternative: 希腊文作：“没有教养的君王必毁灭自己的百姓；一座城必因统治者的明智而有人居住。”
  rationale: 本项目在《便西拉智训》希伯来文存留可靠时以希伯来文为正文依据。希腊文本在本节反映了显著不同的文本形态，不宜混入正文以调和两者，但其差异具有文本见证价值，故完整列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的格言体。“怎样……也怎样”重现希伯来文两个分句的比较和平行结构；分号保留诗性对仗。脚注标记置于第一分句后，提示整节存在重要的希腊异文。
