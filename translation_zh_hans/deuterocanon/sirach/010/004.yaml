  text: In the hand of God is the rule of every man, and before the lawgiver he sets his splendor.
translation:
  language: zh_hans
  text: 每个男子的统治权都在上帝手中；他把他的威荣[b]置于立法者面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“大地的权柄在主手中；到了适当的时候，他必在其上兴起合用的人。”希腊文本的后半句明显不同，可能反映了不同的希伯来语底本或后来的诠释发展。
    reason: alternative_reading
  - marker: b
    text: “威荣”也可译作“威严”或“尊荣”；“他的”具体指谁，原文并不完全明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  choice: 在上帝手中
  rationale: 保留希伯来语以“手”表达掌控和权柄的比喻，同时符合现代汉语习惯；אֱלֹהִים直译为“上帝”，不按希腊平行文本改作“主”。
- source_word: מֶמְשֶׁלֶת
  choice: 统治权
  rationale: 该词表示统治、管辖或权柄；“统治权”既切合本段政治语境，也与希腊语ἐξουσία所涵盖的语义范围相符。
- source_word: כָּל גֶּבֶר
  choice: 每个男子
  rationale: גֶּבֶר明确为阳性，通常指成年男子；此处不将其无根据地中性化为“每个人”。
- source_word: מְחוֹקֵק
  choice: 立法者
  rationale: 该词指颁布法令或制定律例的人；“立法者”保留其词义，不依希腊异文改写为合用的统治者。
- source_word: יָשִׁית
  choice: 置于
  rationale: שׂים的基本义是放置、安置；“置于”简洁而庄重，避免加入“赐予”或“彰显”等原文未明说的含义。
- source_word: הוֹדוֹ
  choice: 他的威荣
  rationale: הוֹד可指尊荣、威严或荣美；“威荣”兼顾君王语境中的威严与尊荣，并保留第三人称所属关系。
theological_decisions:
- issue: 上帝主权与人的政治权柄之间的关系
  choice: 译为人的统治权在上帝手中
  alternative: 译成上帝直接任命每一位统治者
  rationale: 希伯来文本明确宣告人的统治权受上帝掌管，却没有说明上帝实施这种掌管的具体方式，因此不扩展为完整的君权或任命教义。
- issue: הוֹדוֹ中“他的”所指
  choice: 保留“他把他的威荣”这一可能含混的代词结构
  alternative: 明确译为“上帝自己的威荣”或“立法者的威荣”
  rationale: 希伯来语阳性单数后缀的具体所指并非绝对清楚；译文不擅自判定威荣属于上帝还是立法者，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而可懂的书面普通话。“在上帝手中”保留原文意象；分号呈现两行诗句的并列关系。第二句略带生硬之处源于希伯来文本本身的代词含混，译文有意不予消解。
