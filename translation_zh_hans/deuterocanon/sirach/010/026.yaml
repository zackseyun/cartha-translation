  yaml_path: translation/deuterocanon/sirach/010/026.yaml
  text: Do not act too wisely to serve your own desire[a], and do not honor yourself in the time of your need.
translation:
  language: zh_hans
  text: 不要自作聪明，为自己的欲望效力[a]；也不要在你有需要的时候抬高自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里有很不相同的读法：“在各方面劳作的人，胜过四处游走、夸耀自己却缺少食物的人。”开罗藏经库保存的希伯来文本则警告人不可为自己的欲望而自作聪明，也不可在有需要时抬高自己。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תּתְחַכַּם
  choice: 不要自作聪明
  rationale: התפעל形式带有把自己表现为聪明、卖弄聪明的意味；“自作聪明”自然地保留了这种反身色彩及警戒语气，而没有把它过度解释为蓄意谋算。
- source_word: לַעֲבוֹד
  choice: 去满足
  rationale: עבד本义为“服事、劳作”。与“欲望”搭配时，直译“服事自己的欲望”在现代汉语中略显生硬；“去满足”自然表达为自身欲望效力的含义。
- source_word: חֶפְצֶךָ
  choice: 自己的欲望
  rationale: חפץ可指愿望、喜好、欲求；此处结合反身性的伦理警告，译作“自己的欲望”清楚呈现自利指向，同时不限定为某一种具体欲望。
- source_word: וְאַל תִּתְכַּבֵּד
  choice: 也不要……抬高自己
  rationale: כבד的התפעל形式可表示使自己显得有分量、尊崇自己。“抬高自己”既保留反身意义，也符合现代汉语对自我尊大的表达。
- source_word: בְּמוֹעֵד
  choice: 在……的时候
  rationale: מועד可指特定的时间、时机或时期；这里引出人处于需要中的情境，“在……的时候”自然且不过度强调预定性。
- source_word: צָרְכֶּךָ
  choice: 有需要
  rationale: צרך指需要、匮乏；希腊平行文本提到缺少食物，支持这里含现实贫乏之意，但希伯来文本本身并未限定为食物，因此采用较宽泛的“有需要”。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本显著分歧
  choice: 正文以现存希伯来文为准，末句保留一般性的“需要”；脚注完整提示希腊异文。
  alternative: 按希腊文译为：“凡事亲手劳作的人，胜过四处夸耀却缺少食物的人。”
  rationale: 希伯来文本在此完整可读，应作为正文依据；希腊文的内容和句法均大不相同，不宜暗中调和。不过，希腊文可旁证末尾的“需要”可能包括物质匮乏。重大异文以脚注保存，避免掩盖文本传统中的张力。
translation_notes:
  register: 采用现代、庄重而通俗的劝诫语体。“自作聪明”和“抬高自己”清晰表达两个反身动词；分号呈现两项平行禁令。脚注标记[a]已置于正文相关分句之后。
