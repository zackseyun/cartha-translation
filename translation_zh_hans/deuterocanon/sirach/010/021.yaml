  text: Among brothers their chief is honored[a], and one who fears God among his people.
translation:
  language: zh_hans
  text: 弟兄中，他们的首领受人尊敬；敬畏上帝的人在本族人中也受人尊敬。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“富人、显贵者和穷人——他们所夸耀的是敬畏主。”希伯来文与希腊文见证在此有显著差异；正文依照现存希伯来文。
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין אַחִים
  choice: 在弟兄中
  rationale: בֵּין 在群体语境中表示“在……中间”；אַחִים 保留其阳性复数的字面表达“弟兄”。
- source_word: רֹאשָׁם
  choice: 他们的首领
  rationale: רֹאשׁ 字面为“头”，在社会关系中可指居首者或首领；“首领”在现代汉语中自然且准确。
- source_word: נִכְבָּד
  choice: 受人尊重
  rationale: כבד 的尼法勒形式在此表示受到尊敬、被看重；译为“受人尊重”清楚呈现其被动意义。
- source_word: וִירֵא אֱלֹהִים
  choice: 敬畏上帝的人也受人尊重
  rationale: 原文直译为“而敬畏上帝的人”，省略了与前半句相对应的谓语。汉语补出“也受人尊重”，以显明平行结构；“上帝”依从希伯来文本 אֱלֹהִים。
- source_word: בְּעַמּוֹ
  choice: 在他的百姓中
  rationale: 介词 בְּ 在此表示群体范围，与前半句“在弟兄中”形成对应；单数后缀保留为“他的”。
theological_decisions:
- issue: 希伯来文本与希腊平行文本存在重大差异
  choice: 正文依据现存希伯来文本翻译，并以脚注列出希腊异文
  alternative: 希腊文本作：“富足的、尊贵的和贫穷的——他们所夸耀的是敬畏主。”
  rationale: 现存希伯来文应作为正文的首要依据；但希腊见证内容差异显著，必须明确保留，避免掩盖文本传统的张力。
- issue: 后半句是否补出省略谓语
  choice: 补出“也受人尊重”
  alternative: 较形式化地译为：“在弟兄中，他们的首领受人尊重；在他的百姓中，敬畏上帝的人。”
  rationale: 希伯来诗句可由前半句向后半句省略谓语。现代汉语若不补出，容易形成残句；补译不改变基本意义，并保留两组群体关系的平行结构。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“受人尊重”在后半句补出，以符合现代汉语句法并呈现希伯来文的省略平行；脚注明示主要文本见证之间的重大差异。
