- from: 智慧的审判官使自己的百姓井然有序[a]；明达者的治理也秩序井然。
  to: 一国的审判官使自己的百姓得以建立[a]；明达者的统治井然有序。
  rationale: 修订以所给希伯来文本为正文依据：删去仅见于希腊平行文本的“智慧的”，并将 יוֹסֵד 译为“使……得以建立”，保留其“建立／奠定”的核心语义。脚注简要交代希腊文本的显著差异，既不掩盖文本证据，也不以该平行文本改写希伯来正文。第二分句维持原译，因为其准确传达“明达者的统治／管治是安排妥当的”。
