translation:
  language: zh_hans
  text: 一国的审判官使自己的百姓得以建立[a]；明达者的统治井然有序。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……得以建立”译自希伯来文 יוֹסֵד，也可译为“奠定”或“建立”。希腊文平行文本首句不同，作“智慧的审判官教导自己的百姓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפֵט
  choice: 审判官
  rationale: 该名词通常指负责审判并施行治理的人；希腊文平行文本 κριτής 也支持“审判官”，而非泛指“统治者”。
- source_word: יוֹסֵד
  choice: 使……井然有序
  rationale: 此动词本可表示“建立”或“奠立”，但宾语是“百姓”，且下半句以“有秩序”相呼应；希腊文 παιδεύσει 也指向治理、教导和整顿百姓的语境。因此正文采用自然的治理性表达，同时以脚注保留其他可能。
- source_word: עַמּוֹ
  choice: 自己的百姓
  rationale: 忠实表达希伯来文第三人称单数所属后缀；“百姓”在治理语境中自然，并与希腊文 λαὸν αὐτοῦ 相符。
- source_word: מֶמְשֶׁלֶת
  choice: 治理
  rationale: 该词表示统治权、管治或治理；此处采用“治理”，既可指施政状态，也能与上半句审判官整顿百姓的行动形成平行。
- source_word: מֵבִין
  choice: 明达者
  rationale: 分词指有理解力、辨识力的人。“明达者”简洁庄重，并保留其人格性和智慧语境。
- source_word: סְדוּרָה
  choice: 秩序井然
  rationale: 该词表示安排妥当、有条理。译作“秩序井然”自然地呈现正面评价，并与上半句的“井然有序”形成修辞呼应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以分号呈现希伯来诗句的两分结构，并保留两句在“秩序”主题上的平行关系；不把审判官仅现代化为司法官员，也不加入特定政体或宗派解释。
