  text: God erased the traces of nations[b][a], and their root to the very ground.
translation:
  language: zh_hans
  text: 上帝抹去了列国的足迹，也铲除了他们的根，直至地底最深处[b]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“主拔出了列国的根，把谦卑的人栽种在他们的位置上。”现存希伯来文本则说，上帝抹去列国的“足迹”，并铲除他们的“根”，直至地底最深处。
    reason: alternative_reading
  - marker: b
    text: 译作“地底最深处”的希伯来词十分罕见，也可能指土地的最底层；这里的重点是彻底除根。
    reason: lexical_alternative
lexical_decisions:
- source_word: עִקְבוֹת
  choice: 足迹
  rationale: 该词与“脚跟、脚步”有关；译作“足迹”保留希伯来文具体的痕迹意象，也与下半句彻底除根的意象形成呼应。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 这里泛指各民族、各国，并不必然带有后期神学语境中“外邦人”的专门含义；“列国”简洁而庄重。
- source_word: טִמְטֵם
  choice: 抹去了
  rationale: 此动词表达涂抹、消除或使之不复存在；“抹去了”贴合“足迹”的意象，同时避免把含义过度限定为肉体灭绝。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 希伯来文明确作“上帝”，不依希腊文异读改成“主”。
- source_word: וְשָׁרְשָׁם
  choice: 连他们的根也除去
  rationale: 原文用单数集合名词“他们的根”。汉语补出承接性的“除去”，使省略谓语的并列结构自然清楚，并保留彻底根除的意象。
- source_word: עַד אֶרֶץ קִעֲקָע
  choice: 直到地底最深处
  rationale: קִעֲקָע 是罕见词，可能指地的底层或最深处。“直到地底最深处”表达向下达到极限的意思，又不武断指定为某种具体地质层。
theological_decisions:
- issue: 希伯来文与希腊文的显著差异
  choice: 正文以现存希伯来文为准，保留“足迹”“上帝”及除根至地底的表述。
  alternative: 希腊文作：“主拔出了列国的根，把谦卑的人栽种在他们的位置上。”
  rationale: 现存希伯来文本在本项目中是主要依据；希腊文与其在审判列国这一大意上相关，但在意象、神称和后半句内容上均有实质差异，因此不在正文中调和，改以脚注完整交代。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“足迹”保留原文的具体意象；“连……也……”自然呈现第二分句在希伯来文中省略谓语的结构。脚注标记均已在正文中出现。
