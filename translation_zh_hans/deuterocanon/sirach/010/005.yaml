  text: In the hand of God is the rule of the world[a], and in due time he will raise up over it the right man.
translation:
  language: zh_hans
  text: 世界的统治权在上帝手中[a]；到时候，一人将立于其上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“人的亨通在主手中；他必将自己的荣耀加在经师的脸上。”这里的希腊文本传统与现存希伯来文本有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  choice: 在上帝手中
  rationale: בְּיַד 表示处于某人的掌控之下；保留“手中”的希伯来语意象，同时用“上帝”准确对应 אֱלֹהִים。
- source_word: מֶמְשֶׁלֶת תֵּבֵל
  choice: 世界的统治权
  rationale: מֶמְשֶׁלֶת 指统治、管辖或权柄，תֵּבֵל 指有人居住的世界；“世界的统治权”准确而自然。
- source_word: וְאִישׁ
  choice: 必有一人
  rationale: אִישׁ 是阳性单数“一个人/一名男子”，此处指一位居于统治地位的人；不添加原文没有明说的“合适”或“正确”。“必有”使汉语句子自然，并传达未完成体所指向的将来情形。
- source_word: לְעֵת
  choice: 到了时候
  rationale: 该短语可指在某个时候或在适当的时候。译作“到了时候”既符合现代汉语，也保留原文未明确说明究竟何时的含蓄。
- source_word: יַעֲמוֹד עָלֶיהָ
  choice: 立在其上
  rationale: יַעֲמוֹד 是“站立、起来、任职”的未完成式，עָלֶיהָ 是“在它之上”。“立在其上”保留原文措辞及其可能含有的掌权意味，而不把该动词改译为使役性的“立他”或“兴起他”。
theological_decisions:
- issue: 希伯来文本与希腊传统显著不同
  choice: 正文以现存希伯来文本为准，希腊异文收入脚注
  alternative: 按希腊文译为：“人的成功在主手中；他要把自己的荣耀加在经师脸上。”
  rationale: 本节希伯来文本完整且可信度高，故应作为正文依据；希腊传统反映了实质不同的文本形态，不宜混入正文，却值得完整注明。
- issue: יַעֲמוֹד 的主语及语态
  choice: 以“一人”为语法主语，译作“必有一人立在其上”
  alternative: 以上帝为主语，意译作“他要在其上兴起合适的人”
  rationale: 现存希伯来文的 יַעֲמוֹד 是第三人称阳性单数的简单词干，紧接 אִישׁ，最直接的句法是“一个人将立在其上”。不采用使役译法，也不添加“合适”，以免消除原文的语法张力。
- issue: אִישׁ 的性别表达
  choice: 一人
  alternative: 一个合适的人；一名男子
  rationale: “一人”保留单数个体所指，在现代汉语中也可自然指称一位统治者；本句并未强调生理性别，因此无需刻意译成“一名男子”，但也不将其泛化为全人类。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“世界的统治权在上帝手中”保留希伯来语的手之隐喻；后半句刻意保持简洁，不按英语咨询文本加入“合适的”或使役性的“兴起”，以忠实呈现希伯来文本。脚注标记 [a] 已置于正文对应位置。
