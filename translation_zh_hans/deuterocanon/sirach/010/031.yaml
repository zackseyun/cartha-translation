  text: How honored one is in his wealth[a], and how despised in his poverty.
translation:
  language: zh_hans
  text: 一个人富有时何等受尊重，贫穷时又何等受轻视！[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本的次序和着重点不同：“但那在贫穷中受尊崇的人，在富足中岂不更受尊崇吗？那在富足中不受尊崇的人，在贫穷中岂不更不受尊崇吗？”本译文以希伯来文见证为主，并以希腊文作对照参考。
    reason: alternative_reading
lexical_decisions:
- source_word: נִכְבָּד
  choice: 受尊重
  rationale: 该词是כבד的尼法勒形态，在这里表示受到尊崇或看重；“受尊重”自然地传达社会评价，并与下句形成对照。
- source_word: בְּעָשְׁרוֹ
  choice: 富有时
  rationale: 介词ב可表示处境或状态；译作“富有时”符合现代汉语习惯，同时保留人在财富处境中受到尊重的含义，不把它明确解释为因果关系。
- source_word: אֵיכָכָה
  choice: 何等
  rationale: 这是表达程度的感叹或疑问词；“何等”保留原文强烈的感叹语气，而不擅自增译为“何况”或“更何况”。
- source_word: וְנִקְלֶה
  choice: 又何等受轻视
  rationale: 该词源自קלה，尼法勒形态表示被看轻、被轻蔑；“受轻视”与“受尊重”构成清楚而庄重的反义平行。“又”体现希伯来文连接词并使汉语对偶自然。
- source_word: בְּעָנְיוֹ
  choice: 贫穷时
  rationale: 与“富有时”保持平行，把ב理解为处境而非明确的原因，既贴近原文结构，也符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“一个人”自然表达希伯来文阳性单数的泛指意义；两个“何等”保留原文的感叹式对偶。句末使用感叹号，以呈现אֵיכָכָה的修辞力度。
