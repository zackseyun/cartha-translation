  text: Give testimony to your creatures from the beginning[b][a], and raise up the prophecies spoken in your name.
translation:
  language: zh_hans
  text: 求你为你起初所造的作见证[a]，使奉你名所说的预言得以实现[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你起初所造的作见证”也可译作“向你起初所造的显出见证”。原文的与格结构简略；“所造的”可指受造者，也可泛指受造之物。
    reason: 保留与格关系及κτίσμα指称范围的歧义。
  - marker: b
    text: 原文直译为“使……预言兴起”。这可指使预言实现、发挥效力或得到证实；并非指使先知兴起。
    reason: 说明ἐγείρω的字面比喻及其在此处可能表达的实现或证实含义。
lexical_decisions:
- source_word: δὸς μαρτύριον
  choice: 显出见证
  rationale: δὸς是“赐下、给出”的命令式，μαρτύριον指见证、证据。“显出见证”在中文中比直译“给见证”自然，也保留了求上帝以行动作证、提供凭据的开放含义。
- source_word: τοῖς ἐν ἀρχῇ κτίσμασίν σου
  choice: 向起初所造的万物
  rationale: κτίσμα可指受造之物或受造者；“万物”不把范围限于有生命的受造者。ἐν ἀρχῇ与该名词短语的关系较压缩，“起初所造的”保留其时间与创造含义。与格用“向”表达，但也可能具有“为”的意思，故加注说明。
- source_word: ἔγειρον
  choice: 使……兴起
  rationale: ἐγείρω的基本义是“使起来、唤起、兴起”。虽然语境中可能指使预言应验或生效，正文保留原文的比喻，避免直接把含义收窄为“应验”。
- source_word: προφητείας
  choice: 预言
  rationale: προφητεία指预言或先知性言语。此处为复数，在现代汉语中用集合性的“预言”即可自然表达。
- source_word: τὰς ἐπʼ ὀνόματί σου
  choice: 奉你名所说的
  rationale: ἐπʼ ὀνόματί σου直译较生硬；用于预言时，“奉你名所说”自然表达这些话以神的名义和权柄发出。“所说”是根据“预言”隐含的言说行为补出。
theological_decisions:
- issue: “起初所造的”所指的范围
  choice: 正文采用广义的“万物”，不限定为以色列或某一群人
  alternative: 理解为上帝自古所造的子民，或专指起初受造的生灵
  rationale: κτίσμα本身可泛指受造之物；上下文或许使人联想到上帝的子民，但本节希腊文没有明确限定，故不在正文中缩窄所指。
- issue: “使预言兴起”的效力
  choice: 保留“兴起”的比喻，让它可涵盖应验、证实或重新生效
  alternative: 直接译作“使预言应验”
  rationale: 原文宾语是“预言”而不是“先知”，动词ἐγείρω也不是通常表示“应验”的专门词。保留比喻可避免把神学含义限定为单一解释。
- issue: 上帝所给“见证”的方向
  choice: 按与格译为“向……显出见证”
  alternative: 译为“为……作证”或“在……身上显出证据”
  rationale: 希腊文与格在此可表达接受对象或利益对象，句法关系较为压缩；正文选用自然且直接的“向”，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的祈求语气。“求你”补足汉语祷告式命令的礼貌与庄重；“显出见证”和“兴起”有意保留原文略显浓缩的诗性表达，并以脚注解释真实歧义。
