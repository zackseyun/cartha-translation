  text: Fill Zion with your praises[b][a], and your people with your glory.
translation:
  language: zh_hans
  text: 求你使锡安充满对你的颂扬[a]，也以你的荣耀充满你的子民[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“充满对你大能作为的传扬”，或“充满对你卓越的宣扬”。这个希腊词既可指颂扬，也可指述说值得称颂的品格或作为。
    reason: lexical_alternative
  - marker: b
    text: 直译近于：“也使你的子民从你的荣耀得以充满。”希腊文用“从”突出荣耀来自上帝；中文正文按“充满”的自然搭配译作“以你的荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆσον
  choice: 求你使……充满
  rationale: 这是表示直接祈求的过去时命令式；中文加“求你”自然呈现祷告语气，“使……充满”保留使之满溢的具体意象。
- source_word: Σιὼν
  choice: 锡安
  rationale: 采用现代中文圣经传统中通行的专名译法。
- source_word: ἀρεταλογίας σου
  choice: 对你的颂扬
  rationale: 该名词可指颂扬本身，也可指宣扬某人的美德、卓越或可称颂之作为。“对你的颂扬”在祷告语境中自然，同时以脚注保留“传扬大能作为／卓越”的可能。
- source_word: ἀπὸ τῆς δόξης σου
  choice: 以你的荣耀
  rationale: ἀπό字面表示“从、出于”，但在省略而承接“充满”的结构中，中文用“以……充满”最为自然；脚注说明其来源意味。
- source_word: τὸν λαόν σου
  choice: 你的子民
  rationale: “子民”自然表达与上帝立约归属相关的“你的人民”，又不额外限定具体群体。
theological_decisions:
- issue: ἀρεταλογίας所指的是人献上的颂扬，还是上帝可称颂的卓越与大能作为
  choice: 正文译作“对你的颂扬”
  alternative: “对你大能作为的传扬”或“对你卓越的宣扬”
  rationale: 原词涵盖赞美言语及对可赞美品格、作为的述说；正文采用宽泛而自然的表达，不把对象仅限于言语或神迹，并在脚注中保留词义张力。
- issue: ἀπὸ τῆς δόξης σου在承接“充满”时的语义
  choice: 正文译作“以你的荣耀充满”
  alternative: “使你的子民因从你而来的荣耀充盈”或较直译的“从你的荣耀”
  rationale: 希腊文介词突出来源，但中文若直译“从你的荣耀充满”会不通顺；“以你的荣耀”清楚表达充满的内容，而脚注保留“从、出于”的来源意味。
translation_notes:
  register: 采用庄重而现代的祷告语体。“求你”显明命令式在此是祈求；两个“充满”构成平行句。正文避免生硬照搬希腊文第二分句的省略和介词结构，并用脚注保留其来源意味及ἀρεταλογία的词义幅度。
