  text: If there is mercy and gentleness on her tongue[b][a], her husband is not like the sons of men.
translation:
  language: zh_hans
  text: 她的言语中若有怜悯和温柔，她的丈夫就不像其他男子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译作“她的丈夫不像世人之子”。“世人之子”是较生硬的男性化惯用表达；此处可能指“其他男子”或“普通男子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ γλώσσης αὐτῆς
  choice: 她的舌上
  rationale: 保留希腊文以“舌”指言语的具体意象，同时符合现代汉语表达。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 直接表达对人的慈悲与体恤，也保留该词的道德和宗教意味；“仁慈”或“恩慈”亦有可能。
- source_word: πραΰτης
  choice: 温柔
  rationale: 在现代汉语中自然地表达柔和、不粗暴的品格；较“谦和”更贴近该词在言语表现上的含义。
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: 她的丈夫
  rationale: 上下文为婚姻关系，ἀνήρ在此自然指“丈夫”，而非泛指“男人”。
- source_word: καθʼ υἱοὺς ἀνθρώπων
  choice: 不是一般男子可比的
  rationale: κατά在此表示比较或衡量；此译传达丈夫非同一般的语意，同时以脚注保留希腊文“世人之子”这一较生硬的男性化惯用表达。
theological_decisions:
- issue: καθʼ υἱοὺς ἀνθρώπων中的男性化人类称谓
  choice: 一般男子
  alternative: 世人之子；一般人
  rationale: 本句具体谈论丈夫，希腊文也采用阳性复数表达，因此主文保留男性所指，不将其泛化为性别中性的“一般人”；脚注说明原文形式及其可能含义。
- issue: 妻子的言语与丈夫非同一般之间的关系
  choice: 保留条件句与结论，不明说妻子“使”丈夫出众
  alternative: 有这样妻子的丈夫便非同一般
  rationale: 希腊文表达略显生硬，只并列条件与结论，没有明确使用使役动词；译文不额外断定因果机制，以保留原文张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“她的舌上”保留原文意象；“不是一般男子可比的”使比较结构在汉语中自然，同时由脚注交代较字面的表达。
