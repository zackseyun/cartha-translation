  text: A horse for mounting is like a mocking friend; under anyone who sits on it[a], it neighs.
translation:
  language: zh_hans
  text: 供人骑乘的马，好像一个嘲弄人的朋友；无论谁骑在它身上[a]，它都会嘶鸣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语的措辞简短而不寻常。这里译作“供人骑乘”的短语，在其他语境中也可有交配方面的含义；但本句接着描写有人骑在马上，因此此处更适合按骑乘来理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: 马
  rationale: 采用通常义“马”；原文并不要求更具体地译作“公马”。
- source_word: εἰς ὀχείαν
  choice: 供人骑乘
  rationale: ὀχεία在别处可有交配方面的含义，但本句随后提到有人坐在马上，因此此处以骑乘义最合上下文；“供人骑乘”也保留了原文简短而略显突兀的表达。
- source_word: ὡς φίλος μῶκος
  choice: 好像一个嘲弄人的朋友
  rationale: μῶκος涉及嘲弄、讥笑或嘲弄者；此译保留“朋友”这一关系意象，同时避免把它弱化为单纯的愚蠢。
- source_word: ὑποκάτω παντὸς ἐπικαθημένου
  choice: 无论谁骑在它身上
  rationale: παντός具有不加限制的普遍意味，ἐπικαθημένου指坐在其上的人；结合马的意象，用“骑在它身上”自然清楚。
- source_word: χρεμετίζει
  choice: 它都会嘶鸣
  rationale: χρεμετίζει是指马发出叫声；“嘶鸣”是现代汉语中准确且庄重的对应表达，“都”承接前面的“无论谁”。
