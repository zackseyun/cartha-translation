  text: From them he exalted and sanctified[b][a], and from them he appointed a fixed number of days.
translation:
  language: zh_hans
  text: 其中一些，他抬举并使之为圣[a]；另一些，他归入日子的数目[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他举起并使之成圣”。“抬举”对应希腊文“举高、提升”，也可含尊崇之意。
    reason: lexical_alternative
  - marker: b
    text: 直译“归入日子的数目”。这句话可能指把另一些列为普通、可计数的日子；原文没有明说“固定期限”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπ᾽ αὐτῶν
  choice: 从它们中
  rationale: 保留ἀπό加属格所表达的“从它们之中／由它们而出”，不把部分关系完全明说；但汉语句中以“选出一些”使动作关系自然可懂。
- source_word: ἀνύψωσεν
  choice: 加以尊崇
  rationale: ἀνυψόω可指举起、提升或尊崇；此处与“分别为圣”并列，“尊崇”较自然地传达其荣升含义，同时脚注保留较直译的可能。
- source_word: ἡγίασεν
  choice: 分别为圣
  rationale: ἁγιάζω意为使之圣洁、分别为圣或奉献；“分别为圣”保留经文庄重语域，又不把含义限缩为礼仪性的“奉献”。
- source_word: ἔθηκεν
  choice: 定下
  rationale: τίθημι本义宽泛，可作放置、设立或指定；用于日子的数目时，“定下”能自然表达设定之意。
- source_word: εἰς ἀριθμὸν ἡμερῶν
  choice: 有数的日子
  rationale: 希腊文直译近于“归入日子的数目”；“有数的日子”保留其确定、可计数的意味，又避免把“固定期限”解释得过满。
theological_decisions:
- issue: 希腊文动词的主语未明说
  choice: 他
  alternative: 上帝／主
  rationale: 原文只有第三人称单数动词，没有在本句点明主语；用“他”承接上下文并保留指代空间，不擅自补入神名或称号。
- issue: ἀπ᾽ αὐτῶν是否明确为部分关系
  choice: 从它们中选出一些
  alternative: 从它们而出／从它们中
  rationale: 上下文很可能是在一组日子中突出某些日子；正文采用自然汉语表达这种部分关系，但脚注说明希腊文并未明说“选出一些”，以保存原文的简约和歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“分别为圣”保留经文语域；代词“它们”照应作为无生命时间单位的日子。正文保持第三人称“他”，不补出原文未明说的神名。
