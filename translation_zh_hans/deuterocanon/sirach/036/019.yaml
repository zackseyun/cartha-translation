  text: according to the blessing of Aaron over your people[a], and all those on the earth will know that you are the Lord[b], the God of the ages.
translation:
  language: zh_hans
  text: 照着亚伦为你子民所宣告的祝福[a]，地上所有的人就都必知道你是主，是万世的上帝[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚伦关于你子民的祝福”或“亚伦给你子民的祝福”。希腊语介词短语可有这些理解；这里指亚伦向以色列人宣告祝福。
    reason: lexical_alternative
  - marker: b
    text: 或译：“永恒的上帝”。希腊语直译为“诸世代的上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν εὐλογίαν
  choice: 照着……祝福
  rationale: κατά加宾格在此表示依照、符合；“照着”自然保留这一关系，而“祝福”是εὐλογία在祷告语境中的通常译法。
- source_word: Ἀαρὼν
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: περὶ τοῦ λαοῦ σου
  choice: 为你子民所宣告的
  rationale: περί本可表示“关于”或“为了”；结合亚伦向以色列人宣告祝福的语境，以“为……所宣告”传达其关系，同时用脚注保留原文的其他理解。
- source_word: γνώσονται
  choice: 必知道
  rationale: 以“必”表达将来时的确定性；不添加“开始”等原文未明确表达的体貌含义。
- source_word: πάντες οἱ ἐπὶ τῆς γῆς
  choice: 地上所有的人
  rationale: 准确而自然地指地上一切人，不将其收窄为某一民族或群体。
- source_word: Κύριος
  choice: 主
  rationale: 在此为神圣称号；“主”是现代中文庄重且通行的对应译法。
- source_word: ὁ θεὸς τῶν αἰώνων
  choice: 万世的上帝
  rationale: 以“万世”保留αἰώνων复数所表达的历世历代之广度，避免直接将其化约为解释性的“永恒的上帝”。
theological_decisions:
- issue: 神圣称号Κύριος的译法
  choice: 主
  alternative: 主人／统治者
  rationale: 上下文明确指上帝；“主”既符合神圣称号的用法，也不额外引入宗派性解释。
- issue: ὁ θεὸς τῶν αἰώνων的时间含义
  choice: 万世的上帝
  alternative: 永恒的上帝／万古的上帝
  rationale: “万世的上帝”较直接反映属格复数τῶν αἰώνων，保留“诸世代”与“永恒”之间的语义张力，不将其静默固定为单一神学表述。
- issue: περὶ τοῦ λαοῦ σου与亚伦祝福的关系
  choice: 亚伦为你子民所宣告的祝福
  alternative: 亚伦关于你子民的祝福／亚伦给你子民的祝福
  rationale: 结合祝福被宣告于百姓的背景作自然表达，但因περί本身具有多种关系义，脚注明确保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“照着”“子民”“万世”保持祷告文体的尊严；补入“所宣告的”使中文关系清楚，但以脚注保留περί的真实歧义。
