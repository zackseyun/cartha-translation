  text: Why does one day surpass another[a], when every daylight of the year comes from the sun?
translation:
  language: zh_hans
  text: 为什么一天胜过另一天，既然一年中每一天的光都来自太阳？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τί
  choice: 为什么
  rationale: 引出询问原因的直接问句，符合现代汉语表达。
- source_word: ἡμέρα ἡμέρας ὑπερέχει
  choice: 日子有胜过日子的
  rationale: 保留ὑπερέχει及其属格比较对象所表达的比较关系；“胜过”不额外限定这种优越是道德、礼仪还是其他层面的。
- source_word: πᾶν φῶς ἡμέρας ἐνιαυτοῦ
  choice: 一年中每一天的光
  rationale: 将πᾶν按分配意义理解，并把ἐνιαυτοῦ自然地处理为时间范围，表达全年各日之光。
- source_word: ἀφ᾽ ἡλίου
  choice: 都来自太阳
  rationale: ἀπό表示来源；“来自太阳”自然且准确。“都”呼应πᾶν的全称范围。
theological_decisions:
- issue: ὑπερέχει所表达的日子之间的差别
  choice: 胜过
  alternative: 更优越
  rationale: 经文提出智慧文学式的张力：各日之光同出于太阳，日子却仍有高下之别。“胜过”保留比较而不擅自解释这种差别的性质或依据。
translation_notes:
  register: 采用现代、庄重而易懂的问句。“既然”清楚呈现后半句与前半句之间的反诘张力；不增添礼仪性或道德性的解释。
