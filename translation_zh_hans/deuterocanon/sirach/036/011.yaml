  text: In fiery wrath let the survivor be consumed[a], and let those who do injustice to your people meet destruction.
translation:
  language: zh_hans
  text: 愿那逃过的人[a]在烈火般的震怒中被吞灭；愿那些亏待你子民的人遭遇毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“那正在被拯救（或被保全）的人”。这个希腊语短语在本节语境中较难理解，可能是指此前逃过毁灭的敌人。
    reason: 保留ὁ σωζόμενος的字面意义及其语境歧义。
lexical_decisions:
- source_word: ἐν ὀργῇ πυρὸς
  choice: 在烈火般的震怒中
  rationale: 原文直译近于“在火的震怒中”。此译保留“火”的毁灭性意象，并以现代汉语自然表达其修饰关系，不将其弱化为一般的愤怒。
- source_word: καταβρωθήτω
  choice: 愿……被吞灭
  rationale: 该被动命令形式有“被吃尽、被吞噬、被消灭”之意；“被吞灭”既保留强烈意象，也与前面的烈火相协调，并传达祈愿语气。
- source_word: ὁ σωζόμενος
  choice: 那逃过的人
  rationale: 分词字面可指“正在被拯救／保全的人”，但在敌对和审判的语境中，较可能指先前逃过毁灭的人。正文采用符合语境且不额外引入“余民”概念的译法，字面歧义见脚注。
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: 那些亏待你子民的人
  rationale: ἀδικέω表示不公正地对待、伤害或亏负；“亏待”保留其施加于“你子民”的及物关系，又不把含义过度限定为某一种形式的压迫。
- source_word: εὕροισαν ἀπώλειαν
  choice: 愿……遭遇毁灭
  rationale: εὕροισαν在这里表达祈愿，“遭遇毁灭”比字面的“找到毁灭”更符合现代汉语，同时保留直接求审判临到的力度。
theological_decisions:
- issue: 本节的咒诅祈愿语气
  choice: 保留为直接祈求审判：“愿……被吞灭；愿……遭遇毁灭”
  alternative: 改译为对将来审判的陈述或预言
  rationale: καταβρωθήτω和εὕροισαν在句中都带祈愿／命令意味。原文是在祈求审判，不宜缓和为单纯预测。
- issue: ὁ σωζόμενος所指对象的歧义
  choice: 正文按语境译作“那逃过的人”，并用脚注保留字面可能性
  alternative: 直接译作“那正在得救的人”或“那被保全的人”
  rationale: 若直译为“正在得救的人”，在此求敌人灭亡的语境中容易令人误解为神所拯救的人；但原词本身确有“被救／被保全”的形式意义，因此不应完全消除该张力。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷体。“震怒”承载审判语境的力度；两个“愿”清楚呈现原文的祈愿结构。脚注标记[a]已置于正文相应短语之后。
