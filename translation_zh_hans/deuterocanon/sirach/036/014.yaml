  yaml_path: translation/deuterocanon/sirach/036/014.yaml
  text: Have mercy on the people, O Lord, who are called by your name, and on Israel, whom you likened to a firstborn son.
translation:
  language: zh_hans
  text: 主啊，求你怜悯那以你名为称的民，也怜悯以色列，就是你使之如同长子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλέησον
  choice: 求你怜悯
  rationale: 该词为不定过去时命令式，在祷告中表达直接而恳切的请求；“求你怜悯”自然、庄重，并保留行动性的祈求语气。
- source_word: λαόν
  choice: 那……的民
  rationale: 原文虽无冠词，但后面的分词短语明确限定这民；译作“那……的民”既表达其特指性，也不擅自加入原文没有的“你的”。
- source_word: Κύριε
  choice: 主啊
  rationale: 呼格形式用于直接称呼；“主啊”是现代汉语祷告中自然而庄重的表达。
- source_word: κεκλημένον ἐπʼ ὀνόματί σου
  choice: 以你名为称的
  rationale: 完成时被动分词结合“名”这一结构，表示被神的名所称、归在其名下；此译保留“称名”的圣经语感及被动含义。
- source_word: Ἰσραήλ
  choice: 以色列
  rationale: 按现代简体中文通行译名处理专名。
- source_word: ὡμοίωσας
  choice: 你使他如同
  rationale: ὁμοιόω表达“使之像、使之相似”的比较意义；“使他如同”贴近希腊文，不把它强化为直接宣告身份。
- source_word: πρωτόγονον
  choice: 长子
  rationale: 该词意为“头生的、长子”；在这里是名词化用法。“长子”简洁自然，也保留亲子与首生地位的意象。
theological_decisions:
- issue: 末句是说以色列确实为神的长子，还是说神使以色列如同长子
  choice: 按比较意义译为“就是你使他如同长子的”
  alternative: “就是你立为长子的”或“你的长子以色列”
  rationale: 希腊动词ὁμοιόω通常表示使之相似或比作，而非直接认定身份。正文保留该比较力度，不用《出埃及记》4:22的表述来消解本句自身的措辞；较强的身份性理解置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的祷告体。“主啊，求你……”符合普通现代汉语的敬虔语域；整体保持原文并列结构及末句的比较性张力。
