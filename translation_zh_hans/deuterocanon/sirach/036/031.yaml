base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/031.yaml
  text: For who will trust a well-armed robber[b][a], stumbling from city to city? So it is with a man who has no nest and lodges wherever evening finds him.
translation:
  language: zh_hans
  text: 谁会信任一个束好腰带[a]、从一城踉跄到另一城的强盗呢？同样，一个没有巢[b]、天晚时到哪里就在哪里投宿的人，也不可信任。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “束好腰带”也可译作“整装待发”或“装备妥当”。希腊语原指束好腰带、装备妥当；在这里可能强调强盗随时准备行动。
    reason: lexical_alternative
  - marker: b
    text: “没有巢”是没有固定住处或安稳栖身之所的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐζώνῳ
  choice: 束紧腰带
  rationale: 保留“束腰、整装”的字面形象，并在强盗的语境中暗示随时可以行动；不直接译成“全副武装”，以免把原文没有明说的武器具体化。
- source_word: λῃστῇ
  choice: 强盗
  rationale: 该词指抢掠者或匪徒，往往含暴力意味；“强盗”是清楚、自然的现代汉语。
- source_word: σφαλλομένῳ
  choice: 踉跄
  rationale: 保留失足、步履不稳的动态意象，而不把它平化为单纯的“漂泊”或“游荡”。
- source_word: νοσσιὰν
  choice: 巢
  rationale: 保留原文鲜明的鸟巢比喻，指没有固定而安稳的居所。
- source_word: καταλύοντι
  choice: 投宿
  rationale: 表达临时住宿、过夜的意思，符合四处无定所的语境。
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: 天晚到哪里就在哪里
  rationale: 以自然汉语表达夜幕来临时人在何处便于何处停宿的含义，同时保留地点的不确定性。
- source_word: ἀνθρώπῳ
  choice: 人
  rationale: 此处是智慧文学中的泛指；现代汉语“人”自然涵盖原文单数的人物，不必额外限定性别。
