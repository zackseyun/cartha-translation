  yaml_path: translation/deuterocanon/sirach/036/028.yaml
  text: For who will trust a well-armed robber[b][a], staggering from city to city? So it is with a man who has no nest and lodges wherever night finds him.
translation:
  language: zh_hans
  text: 谁会信任一个束好腰带[a]、从一城踉跄到另一城的强盗呢？同样，谁会信任一个没有巢[b]、天晚到哪里就投宿在哪里的人呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “束好腰带”也可理解为“装备妥当、随时可以行动”；希腊词本义指腰带束得妥帖。
    reason: lexical_alternative
  - marker: b
    text: “没有巢”保留了希腊原文的鸟巢比喻，所指的是没有安定居所的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ πιστεύσει
  choice: 谁会信任……呢
  rationale: πιστεύω在这里指把信任寄托于某人；反问语气自然表达其否定意味。γάρ承接上文，但在独立呈现本节时，汉语不必生硬译出“因为”。
- source_word: εὐζώνῳ
  choice: 束紧腰带
  rationale: 保留该词“束好腰带、装备妥当以便行动”的具体形象，不直接把可能的实际含义收窄为“全副武装”。
- source_word: λῃστῇ
  choice: 强盗
  rationale: λῃστής指以暴力劫掠的人，较“贼”更能体现其含义，也不额外增添历史色彩。
- source_word: σφαλλομένῳ ἐκ πόλεως εἰς πόλιν
  choice: 从一城踉跄到另一城
  rationale: σφάλλομαι可表达失足、踉跄或处境不稳；译文保留这种不稳定感，而不将其平化为单纯“游荡”。
- source_word: οὕτως
  choice: 也是这样
  rationale: 以自然汉语引出前后两种人的类比关系。
- source_word: ἀνθρώπῳ
  choice: 一个……的人
  rationale: 按上下文译为泛指的单数“人”，既符合现代汉语，也不额外限定身份。
- source_word: μὴ ἔχοντι νοσσιὰν
  choice: 没有窝巢
  rationale: νοσσιά本义为鸟窝、巢穴；保留原文鲜明的鸟巢比喻，而不直接解释成“没有家”。
- source_word: καταλύοντι
  choice: 投宿
  rationale: 此处指途中停下住宿；“投宿”简洁地表达临时住宿的意味。
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: 天晚到哪里……在哪里
  rationale: ὀψίζω与天色已晚有关；这一表达保留地点开放性，并自然传达在哪里遇上夜晚就在哪里住宿的意思。
