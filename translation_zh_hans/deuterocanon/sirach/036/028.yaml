revisions:
- from: 谁会信任一个束紧腰带、从一城踉跄到另一城的强盗[a]呢？一个没有窝巢、天晚到哪里就投宿在哪里的人[b]，也是这样。
  to: 谁会信任一个束好腰带[a]、从一城踉跄到另一城的强盗呢？同样，谁会信任一个没有巢[b]、天晚到哪里就投宿在哪里的人呢？
  rationale: 修订以重复的反问明确原文类比中省略的判断，使“同样”所表达的结论在现代汉语中完整清晰。将“束紧腰带”改为“束好腰带”，避免不必要的汉语歧义；将“窝巢”简化为“巢”，并调整脚注锚点至相应词语。未将εὐζώνῳ限定译为“全副武装”，保留其“束腰／装备就绪”的词义范围。
