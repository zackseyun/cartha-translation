  text: Every food is eaten by the stomach[a], but one food is better than another.
translation:
  language: zh_hans
  text: 肚腹能吃各种食物，但有些食物比另一些更好。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“有食物比食物更好。”这是希腊语的比较表达，意思是有些食物胜过另一些。
    reason: 说明原文重复“食物”的比较结构，以及正文采用自然汉语比较句的原因。
lexical_decisions:
- source_word: Πᾶν βρῶμα
  choice: 什么食物都
  rationale: Πᾶν修饰βρῶμα，表示概括性的“各种食物”或“任何食物”；用“什么食物都”自然体现箴言式的周遍意义。
- source_word: φάγεται
  choice: 吃
  rationale: 该形式虽为将来时被动态，但在智慧文学中表达恒常规律；汉语用一般现在意义的主动表达更自然，而“肚腹”仍是承受食物的主体。
- source_word: κοιλία
  choice: 肚腹
  rationale: 语境明确指消化食物的腹部。“肚腹”比“胃”略宽，也保留古代身体意象，同时现代读者容易理解。
- source_word: ἔστιν δὲ
  choice: 但
  rationale: δέ引出转折：肚腹虽能接受各种食物，食物本身却有优劣之别。
- source_word: βρῶμα βρώματος κάλλιον
  choice: 食物有好坏之分
  rationale: 原文是希腊语比较结构，直译为“有食物比食物更好”。汉语如此直译生硬；“有好坏之分”自然表达不同食物之间存在优劣，同时不额外指定评价标准。
