  yaml_path: translation/deuterocanon/sirach/036/001.yaml
  text: No evil will confront the one who fears the Lord[b][a], but in trial he will rescue him again.
translation:
  language: zh_hans
  text: 敬畏主的人，不会遭遇祸患[a]；但在试炼[b]中，主必再次救他脱险。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”也可译作“恶事”“伤害”或“不幸”。希腊语κακόν的含义较广。
    reason: lexical_alternative
  - marker: b
    text: “试炼”也可译作“考验”或“诱惑”；这里的语境较偏向患难或考验。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ φοβουμένῳ Κύριον
  choice: 敬畏主的人
  rationale: 带冠词的分词作名词使用，泛指以敬畏主为特征的人；保留原文单数和箴言式语气。
- source_word: οὐκ ἀπαντήσει
  choice: 不会遭遇
  rationale: ἀπαντάω本义为“相遇、迎面遇见”，此处以κακόν为主语，表达祸患不会临到此人；“不会遭遇”符合现代汉语习惯。
- source_word: κακόν
  choice: 祸患
  rationale: κακόν可指邪恶、伤害或不幸。上下文谈到人在试炼中蒙拯救，因此正文采用较符合处境性灾祸的“祸患”，脚注保留“恶事、伤害、不幸”等语义幅度。
- source_word: ἐν πειρασμῷ
  choice: 在试炼中
  rationale: πειρασμός可指试炼、考验或诱惑；这里重点是人所经历并从中获救的困境，“试炼”既简洁又不局限于道德诱惑。
- source_word: καὶ πάλιν
  choice: 再次
  rationale: πάλιν通常表示“再次、又一次”，此处保留反复或再度蒙拯救的含义。
- source_word: ἐξελεῖται
  choice: 必救他脱险
  rationale: 该动词表示救出、解救；中文补出上下文所隐含的主语“主”和指向敬畏主之人的宾语“他”。
theological_decisions:
- issue: ἐξελεῖται的隐含主语
  choice: 在正文中补出“主”作为施行拯救者
  alternative: 采用不明确施救者的表达，如“他必蒙拯救”
  rationale: 前句明确提到“主”，且本句的语境自然指向主施行拯救。汉语补出主语可避免含混，但不增加原文以外的神学限定。
- issue: “不会遭遇祸患”与“在试炼中蒙救”之间的张力
  choice: 保留两个分句的表面张力，不将前句改写成“不会被祸患胜过”
  alternative: 解释性翻译为“祸患终不能伤害他”或“他不会被祸患击倒”
  rationale: 原文一方面否定κακόν临到，另一方面又承认πειρασμός中的拯救。译文不替作者消解这一箴言式张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“敬畏主的人”保持智慧文学的箴言语气；“救他脱险”清楚表达解救之意。正文中的[a]、[b]均与脚注对应。
