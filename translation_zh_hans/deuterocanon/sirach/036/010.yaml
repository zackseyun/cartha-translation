  text: 所有人都出于土地，亚当从地上被造。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωποι πάντες
  choice: 所有人
  rationale: 该短语虽采用阳性复数形式，却在此泛指全人类。现代汉语用“所有人”自然、准确，无须以带性别限定的说法来机械对应希腊语语法性别。
- source_word: ἀπὸ ἐδάφους
  choice: 出于尘土
  rationale: ἐδάφος指地面、土壤；“尘土”在汉语中自然承接人受造于土的意象，并与后半句形成平行而不完全重复的表达。
- source_word: ἐκ γῆς
  choice: 从地里
  rationale: γῆ可指地、土地或大地。“从地里”保留具体的受造来源，也与前句“出于尘土”形成原文所有的措辞变化。
- source_word: ἐκτίσθη
  choice: 被造
  rationale: κτίζω的被动式在这里表示“被创造”。“被造”简洁、庄重，并清楚保留神圣被动所隐含的创造者。
- source_word: Ἀδάμ
  choice: 亚当
  rationale: 按现代汉语圣经传统音译为专名“亚当”；不将其泛化为“人”，以保留原文中个体与代表性之间的张力。
theological_decisions:
- issue: “所有人”与亚当之间的代表关系
  choice: 先陈述所有人都出于尘土，再以亚当从地里被造与之并列关联。
  alternative: 可把后半句理解为解释性或同位性的陈述，使亚当主要代表整个人类。
  rationale: 希腊文给出一个关于全人类的概括陈述，随后提到亚当的受造。译文保留“亚当”这一专名及两个并列分句，不明确限定二者究竟是例证、根据还是代表关系。
translation_notes:
  register: 采用现代、简洁而庄重的书面普通话。“出于尘土”与“从地里”保留ἐδάφος和γῆ的词汇变化及创造意象；不设置脚注，因为“所有人”已直接表达希腊语在语境中的泛指意义，且未产生需要注明的实质歧义。
