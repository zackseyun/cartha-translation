  text: A woman will accept any male[a], but one daughter is better than another.
translation:
  language: zh_hans
  text: 女人会接纳任何男性[a]，但有的女儿胜过别的女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“妻子会接纳任何男人。”希腊语γυνή既可指“女人”，也可指“妻子”；ἄρρην也可较一般地译作“男人”，但“男性”更贴近其字面所强调的性别。
    reason: 保留γυνή在“女人／妻子”之间以及ἄρρην在“男性／男人”之间的词义可能。
lexical_decisions:
- source_word: πάντα ἄρρενα
  choice: 任何男性
  rationale: πάντα与单数ἄρρενα搭配，具有周遍或任指意义，即“任何男性”。ἄρρην着重性别上的“雄性、男性”，比表示“男人、丈夫”的ἀνήρ更具生物性，因此译作“男性”，不预先加入婚姻含义。
- source_word: ἐπιδέξεται
  choice: 会接受
  rationale: 该词为将来时中间语态，在此表示接纳、接受。“会接受”既符合格言式陈述，也避免“领受”过于书面或“选取”增添原文没有的主动挑选意味。
- source_word: γυνή
  choice: 女人
  rationale: γυνή既可指“女人”，也可指“妻子”。这里是泛指性格言，原文没有明确限定婚姻关系，故正文采用解释负担较小的“女人”，并在脚注保留“妻子”的可能。
- source_word: ἔστιν δὲ
  choice: 但
  rationale: δέ在两个分句之间具有转折或对照作用；现代汉语用“但”简洁地表达这种关系。
- source_word: θυγάτηρ θυγατρός
  choice: 一个女儿……另一个女儿
  rationale: 重复的θυγάτηρ与比较级κρεῖσσον构成比较表达，意为一个女儿与另一个女儿相比；不可按字面误译为“女儿的女儿”。
- source_word: κρεῖσσον
  choice: 胜过
  rationale: κρεῖσσον是“更好、较优”的比较级。汉语“胜过”自然承接两个女儿之间的比较，并保留原文直接评断的语气。
theological_decisions:
- issue: 格言所反映的社会处境
  choice: 按原文译为关于女人和女儿的概括性陈述，不增加婚姻或道德解释。
  alternative: 把γυνή明确译为“妻子”，使全句直接成为婚配语境中的说法；或弱化原文带有性别与等级色彩的表达。
  rationale: 希腊文简短而具有格言色彩。译文应保留其社会世界和令人不适的张力，不把推测的婚姻背景写入正文，也不因现代观感而改写其性别化表述。
translation_notes:
  register: 采用简洁、庄重而通顺的现代标准汉语，保留原文格言式的绝对语气和两个分句之间的对照。正文中的“男性”略显生物性，这是为反映ἄρρην的用词特点；脚注提供更自然但解释性稍强的婚姻语境译法。
