  text: Gather all the tribes of Jacob[a], and allot them their inheritance as from the beginning.
translation:
  language: zh_hans
  text: 求你聚集雅各的各支派，并使他们承受产业，如同起初一样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们承受产业”所译的希腊语动词较罕见，含有承受产业或分配产业的意味；也可较直译为“以他们为产业，如同起初一样”或“把他们分作产业，如同起初一样”。
    reason: lexical_alternative
lexical_decisions:
- source_word: σύναγε
  choice: 求你聚集
  rationale: 这是 συνάγω 的命令式；在祷告语境中加“求你”自然表达恳求语气，“聚集”保留召集、使分散者归拢的含义。
- source_word: πάσας φυλὰς Ἰακώβ
  choice: 雅各的各支派
  rationale: 直接保留希腊文所用的“雅各”，不替换为“以色列”；“各支派”自然表达 πάσας 的全称范围。
- source_word: κατακληρονομήσεις
  choice: 使他们承受产业
  rationale: 该罕见动词带有继承、产业和分配的意象。此译法在中文中通顺，也保留其使役性及产业语义，同时不把具体所指限定为土地。
- source_word: αὐτούς
  choice: 他们
  rationale: 指前面的雅各各支派；作为“使……承受产业”的宾语清楚自然。
- source_word: καθὼς ἀπʼ ἀρχῆς
  choice: 如同起初一样
  rationale: 保留与初始状态或古时安排相比较的开放性，不明确限定为创造之初、早期以色列或最初分地。
theological_decisions:
- issue: κατακληρονομήσεις 中产业语言的施受关系
  choice: 译作“使他们承受产业”，理解为求上帝使各支派恢复其产业或承受产业的地位。
  alternative: 也可较直译为“以他们为产业”或“把他们分作产业”。
  rationale: 该希腊动词罕见，其形态和用法容许不同理解。正文采用符合聚集各支派语境且自然的使役表达，但以脚注保留上帝以他们为产业或将他们分配为产业的可能性，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你”显明命令式在祈求中的语用功能；“产业”保留经文中的继承和分配意象。脚注标记置于整句末，说明罕见动词造成的真实歧义。
