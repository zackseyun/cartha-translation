  text: Prepare your words[a], and then you will be heard; bind together instruction, and answer.
translation:
  language: zh_hans
  text: 要预备好你要说的话[a]，这样你就会被人听取；要把教诲联结起来，并作回答。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“预备好一番话，这样你就会被人听取。”希腊文λόγον是单数，可指“一个词”或“一番话”；“把教诲联结起来”是一个比喻，也可较意译地表达为“把教诲组织好”。
    reason: 词义与隐喻的译法
lexical_decisions:
- source_word: ἑτοίμασον
  choice: 要预备好
  rationale: 这是ἑτοιμάζω的不定过去时命令式，要求人在开口前有意识地作好准备。“预备好”既保留命令语气，也符合现代汉语表达。
- source_word: λόγον
  choice: 你要说的话
  rationale: λόγος在此可指一个词、一番话、言论或论述。结合下文“回答”，译作“你要说的话”自然地表达预先组织发言的意思，同时以脚注保留原文单数形式的可能性。
- source_word: οὕτως
  choice: 这样
  rationale: οὕτως可表示方式或结果；“这样”保留“以这种方式”的含义，也能自然引出随后得到听取的结果。
- source_word: ἀκουσθήσῃ
  choice: 你就会被人听取
  rationale: 这是ἀκούω的将来时被动形式。“被人听取”保留被动结构，并表达发言获得他人认真聆听的社会语境，而不只是声音被听见。
- source_word: σύνδησον
  choice: 要……联结起来
  rationale: συνδέω本义是“绑在一起、联结起来”。这里保留希腊文鲜明的捆扎隐喻，而不直接解释为“整理”或“组织”。
- source_word: παιδείαν
  choice: 教诲
  rationale: παιδεία可指教育、训练、管教或塑造人的训导。在智慧文学语境中，“教诲”兼具教导与品格塑造的意味，也避免“管教”可能带来的单一惩罚色彩。
- source_word: ἀποκρίθητι
  choice: 再作回答
  rationale: 这是ἀποκρίνομαι的不定过去时中间语态命令式，直接要求作出回应。“作回答”庄重自然；“再”表达前面预备和贯串教诲之后才回答的语意次序。
