  text: By the knowledge of the Lord they were distinguished, and he altered seasons and festivals.
translation:
  language: zh_hans
  text: 主凭着自己的知识把它们区分开来；他又改变了时节和节期。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γνώσει Κυρίου
  choice: 因主的知识
  rationale: 保留 γνώσει 的“知识、认识”义及 Κυρίου 的属格关系；ἐν 在此可表达凭借或依据，译作“因”使中文自然，同时不把它扩释为“智慧”或“旨意”。
- source_word: διεχωρίσθησαν
  choice: 被区分开来
  rationale: 保留不定过去时被动态及“分开、区别”的语义，也维持复数主语“它们”对上文所指对象的承接。
- source_word: ἠλλοίωσεν
  choice: 改变了
  rationale: 该动词表示使之变更、变得不同；“改变”简明而不额外说明改变的方式或程度。
- source_word: καιρούς
  choice: 时节
  rationale: καιρός 指特定、合宜或划定的时期；“时节”比泛指连续时间的“时间”更贴切。
- source_word: ἑορτάς
  choice: 节期
  rationale: 指宗教或公共庆典的日期、节庆；“节期”符合经文语域，并与“时节”有所区分。
theological_decisions:
- issue: 主的知识与区分行动之间的关系
  choice: 因主的知识而被区分开来
  alternative: 主凭着他的知识把它们区分开来
  rationale: 希腊文使用被动态，没有明说主是该动词的语法施事；所选译法保留这种表达及其可能的神学张力，不把隐含关系改成明确主动句。
- issue: 第二分句的主语
  choice: 他又改变了
  alternative: 主又改变了
  rationale: 希腊文动词为第三人称单数，主语承接“主”；用“他”既清楚又保留原文的衔接方式。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“它们”保留复数指代，以承接上下文；分号呈现两个紧密相关的分句。“知识”虽略具书面色彩，却忠实保留原词，避免解释性改写。
