  text: The inward parts of a fool are like a cartwheel[a], and his thinking is like a turning axle.
translation:
  language: zh_hans
  text: 愚人的内腑如同车轮[a]；他的思量仿佛旋转的车轴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“愚人的内脏如同车轮。”希腊文以身体器官描绘愚人的内在状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχὸς ἁμάξης
  choice: 车轮
  rationale: τροχός意为“轮”，ἁμάξης限定为车的轮子；“车轮”简洁自然，保留具体的乡野交通意象。
- source_word: σπλάγχνα
  choice: 内腑
  rationale: 该词本指内脏、脏腑，也可引申指人的内在状态。“内腑”保留身体隐喻，同时避免直接解释为“心”或某一种情感。
- source_word: μωροῦ
  choice: 愚人的
  rationale: μωρός在智慧文学中指道德与认知层面的愚昧者；“愚人”符合中文智慧文学的庄重用语。
- source_word: διαλογισμὸς
  choice: 思量
  rationale: 该词可指思想、推想、盘算或思考过程。“思量”自然而略带文学色彩，并保留其涵义宽度。
- source_word: ὡς ἄξων στρεφόμενος
  choice: 仿佛旋转的车轴
  rationale: ἄξων是车轴，στρεφόμενος表示正在转动；译文保留持续旋转的动态意象及其与前半句车轮的对应。
