  text: The throat tastes the food of the hunt[b][a]; so an intelligent heart tests false words.
translation:
  language: zh_hans
  text: 喉咙品尝狩猎所得的食物[a]；同样，有悟性的心辨别虚假的话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狩猎所得的食物”也可译作“猎物”或“野味”。
    reason: alternative_reading
  - marker: b
    text: 希腊文直译为：“喉咙品尝狩猎所得的食物；同样，有悟性的心——虚假的话。”后半句省略了谓语；译文按上下文补出“辨别”。
    reason: lexical_alternative
lexical_decisions:
- source_word: φάρυγξ
  choice: 喉咙
  rationale: 原词直指喉咙或咽喉；保留身体意象，也与下文“心”的意象相对应。
- source_word: γεύεται
  choice: 品尝
  rationale: 表达借味觉尝取、辨知之意，既贴近原词，也能自然引出后半句的判断行为。
- source_word: βρώματα θήρας
  choice: 狩猎所得的食物
  rationale: βρώματα泛指可吃的食物，θήρας为属格，可能表示狩猎所得；此译不把所指过度限定为肉类。
- source_word: καρδία συνετή
  choice: 明辨的心
  rationale: 智慧文学中的“心”是理解和判断的中心；“明辨”兼顾聪慧与分辨能力，并保留原文的心之意象。
- source_word: λόγους ψευδεῖς
  choice: 虚假的话
  rationale: 直译该短语，涵盖一切不真实或带欺骗性的言语，不缩窄为正式陈述。
- source_word: '[οὕτως后省略的谓语]'
  choice: 辨别
  rationale: 现存希腊文本后半句没有明说谓语；按比喻结构，从前半句“品尝”推知心对话语作辨察。正文补出“辨别”以符合现代汉语，同时用脚注说明省略。
