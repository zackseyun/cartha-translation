  yaml_path: translation/deuterocanon/sirach/036/015.yaml
  text: Have compassion on the city of your sanctuary[a], Jerusalem, the city of your dwelling place.
translation:
  language: zh_hans
  text: 求你怜悯你圣所的城——耶路撒冷，就是你安歇之处的城。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你安歇之处的城”也可译作“你安息之所的城”或“你居所的城”。
    reason: κατάπαυμα指安歇、安息之处；“居所”是结合耶路撒冷作为上帝居所的语境所作的替代译法。
lexical_decisions:
- source_word: οἰκτείρησον
  choice: 求你怜悯
  rationale: 该词是命令式，表达向上帝祈求慈悲怜悯；汉语祷告语境中加“求你”自然地传达其祈愿功能。
- source_word: πόλιν ἁγιάσματός σου
  choice: 你圣所之城
  rationale: ἁγίασμα可指圣洁、分别为圣之处，即“圣所”；保留属格结构，不将耶路撒冷与圣所本身简单等同。
- source_word: Ἰερουσαλήμ
  choice: 耶路撒冷
  rationale: 采用现代汉语通行地名译法。
- source_word: πόλιν καταπαύματός σου
  choice: 你安歇之城
  rationale: κατάπαυμα主要表达安歇、安息之处；“安歇之城”既保留原文的“安歇”意象，也避免只译成“居所”而消解其词义色彩。
theological_decisions:
- issue: 如何处理描述耶路撒冷的两个属格短语
  choice: 分别译作“你圣所之城”和“你安歇之城”
  alternative: “你的圣城，你的安歇之所”或“你圣所所在的城，你居住的城”
  rationale: 希腊文以两个平行的“城”结构描述耶路撒冷。译文保留这种平行及圣所与安歇两重意象，不把二者合并，也不明确添加原文未明说的空间关系。
- issue: κατάπαυμα是强调安息还是居住
  choice: 正文保留“安歇”意象
  alternative: 译作“居所”
  rationale: “居所”在语境中通顺，却会弱化κατάπαυμα本有的安息、安歇含义；以脚注提示“居所”这一语境性理解，可保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代汉语祷告体。“求你怜悯”清楚表达命令式祈求；破折号标明“耶路撒冷”是前一短语的同位说明。脚注标记置于正文相应句末。
