base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/027.yaml
  text: Where there is no fence[a], the property will be plundered; and where there is no wife[b], he will groan as he wanders.
translation:
  language: zh_hans
  text: 没有围栏[a]的地方，财产必遭劫掠；没有妻子的男子，必在漂泊中叹息。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“篱笆”。希腊词指环绕财产、起保护作用的围障。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译为“没有妻子的地方，必漂泊叹息”；“叹息”的主语没有明说，按语境理解为缺少妻子的男子。
    reason: implicit_subject
lexical_decisions:
- source_word: φραγμός
  choice: 篱笆
  rationale: 指保护产业的围障；“篱笆”自然保留原文意象，又不将材质限定为石墙。
- source_word: διαρπαγήσεται
  choice: 必被劫掠
  rationale: 保留将来时被动语态，也表达财物被人强行夺取的含义。
- source_word: κτῆμα
  choice: 产业
  rationale: 此词泛指所拥有的财产；“产业”适合与围障和家户的语境搭配，同时不过度限定为动产。
- source_word: γυνή
  choice: 妻子
  rationale: 在这一家户格言的语境中，γυνή 最自然地指妻子，而非泛指女人。
- source_word: στενάξει
  choice: 必……叹息
  rationale: στενάζω 表达因困苦而发出的叹息；现代汉语用“叹息”比“呻吟”更适合此处人物漂泊的语境。
- source_word: πλανώμενος
  choice: 漂泊
  rationale: 分词表示与叹息同时持续的无定处状态；“漂泊”既自然，也避免把它直接解释为道德意义上的“走迷”。
- source_word: οὗ οὐκ ἔστιν ... καὶ οὗ οὐκ ἔστιν
  choice: 没有……的地方；没有……的地方
  rationale: 保留重复的地点关系结构和格言式平行，不改写成原文没有明说的所有者结构。
theological_decisions:
- issue: 第二分句中隐含主语的性别与身份
  choice: 以“他”表达隐含的男性主语
  alternative: 译作“人必漂泊叹息”，或明说“男人必漂泊叹息”
  rationale: 希腊文的 στενάξει 没有明写主语，但 γυνή 在此意为“妻子”，语境自然暗示缺少妻子的丈夫或男家主。“他”既反映这一含义，又避免添加原文没有的明确名词。
- issue: πλανώμενος 的含义
  choice: 理解为居无定所地漂泊
  alternative: 理解为走迷或偏离正道
  rationale: 本句讨论缺少家户保障所带来的不安定；译作“漂泊”保留处境性的含义，也不擅自加入道德或神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的格言体；以两个“没有……的地方”保持原文平行。“必”体现将来陈述的确定语气；脚注说明围障词义和第二分句省略的主语。
