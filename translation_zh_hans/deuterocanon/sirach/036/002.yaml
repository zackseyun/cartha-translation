base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/002.yaml
  text: A wise man will not hate the law[a], but the one who is hypocritical in it is like a ship in a storm.
translation:
  language: zh_hans
  text: 智慧人不会憎恨律法；但在律法上假冒为善的人，就像暴风中的船。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνὴρ σοφὸς
  choice: 智慧人
  rationale: 既保留智慧文学的语体，也以现代汉语自然表达有智慧的人；希腊文虽为阳性单数，此处具有格言式的代表意义。
- source_word: μισήσει
  choice: 不会厌恶
  rationale: μισέω的基本义是“恨、厌恶”；“厌恶”在此既保持力度，也比“憎恨律法”更符合现代汉语搭配。
- source_word: νόμον
  choice: 律法
  rationale: 在《便西拉智训》的犹太智慧传统中，此词很可能指上帝的律法，即妥拉；“律法”同时保留其宗教语境，不扩写为解释性措辞。
- source_word: ὑποκρινόμενος
  choice: 装假
  rationale: 该分词表示扮演、佯装或虚假做作；“装假”保留其动态意味，避免只用静态标签“伪君子”，也不擅自说明其具体伪装行为。
- source_word: ἐν αὐτῷ
  choice: 在律法上
  rationale: 代词最自然地回指“律法”；按汉语习惯明确复现所指，同时保留“就律法而言”的关系。
- source_word: ἐν καταιγίδι πλοῖον
  choice: 风暴中的船
  rationale: 简洁保留原文比喻；καταιγίς表示猛烈风暴，πλοῖον泛指船只。
theological_decisions:
- issue: νόμος所指的范围
  choice: 译作“律法”，保留其指向犹太妥拉的主要可能
  alternative: 泛指“训诲”或一般意义上的“法则”
  rationale: 本书语境常将律法与神所赐的智慧相联；直译“律法”既符合主要所指，也不在正文中加入超出原文的解释。
- issue: ὑποκρινόμενος的道德含义
  choice: 译作动态的“装假”
  alternative: 译作“伪善的人”或“假冒为善的人”
  rationale: 原文强调佯装这一行为，而不仅是给人物贴上固定道德标签；所装假的具体方式并未明说，因此不补成“假意遵行”。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。分号呈现两类人的鲜明对照，“风暴中的船”保留原文突然而有力的比喻，并未补说船只摇摆不定或将要沉没。
