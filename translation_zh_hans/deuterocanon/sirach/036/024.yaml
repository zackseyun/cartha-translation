  text: A woman's beauty brightens the face[b][a], and surpasses every desire of a man.
translation:
  language: zh_hans
  text: 女人的美貌使人面露喜色[a]，胜过男人的一切渴望[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使面容明朗起来”或“使人满面欢喜”。
    reason: ἱλαρύνει既可侧重“使欢喜”，也可侧重“使明朗”；πρόσωπον保留了具体的面容意象。
  - marker: b
    text: “男人”所译的希腊词也可泛指“人”；本句也可译为：“胜过人的一切渴望。”
    reason: ἀνθρώπου既可能是带有语境性别色彩的“男人”，也可能是泛指的“人”，原文容许一定歧义。
lexical_decisions:
- source_word: κάλλος γυναικός
  choice: 女人的美貌
  rationale: κάλλος指美丽、姣好的外貌；γυνή在此不必限定为“妻子”，因此译作“女人的美貌”，既自然又保留原文的性别表达。
- source_word: ἱλαρύνει πρόσωπον
  choice: 使人面露喜色
  rationale: ἱλαρύνει有使欢喜、使明朗之意，πρόσωπον是“脸、面容”。“使人面露喜色”保留面部表情的具体意象，也符合现代汉语习惯；原文未明说面容属于谁，译文中的“人”不限定具体对象。
- source_word: ὑπὲρ πᾶσαν ἐπιθυμίαν
  choice: 胜过……一切渴望
  rationale: ὑπέρ接宾格表达超越，ἐπιθυμία可指愿望、渴望或欲求。“胜过……一切渴望”保留比较力度，并避免把该词不必要地窄化为情欲。
- source_word: ἀνθρώπου
  choice: 男人的
  rationale: ἀνθρώπου本可泛指“人”，但本句先说女人的美貌，格言的修辞关系很可能是女人与受其吸引的男人之间；正文保留这一性别结构，同时以脚注交代泛指理解。
- source_word: ὑπεράγει
  choice: 胜过
  rationale: 该动词表示超过、胜出；“胜过”简洁自然，并与前置的ὑπέρ共同传达原文强烈的超越含义。
theological_decisions:
- issue: 智慧格言中的性别措辞
  choice: 正文保留“女人”与“男人”的对应表达。
  alternative: “女人的美貌使人面露喜色，胜过人的一切渴望。”
  rationale: ἀνθρώπου在希腊语中可以泛指人类，但本句语境形成了带性别色彩的吸引关系。正文保留这种可能的修辞结构，不把它无声地中性化；脚注则保存其泛指可能。
- issue: “渴望”的范围
  choice: 采用范围较宽的“渴望”。
  alternative: “欲望”或“所爱慕的一切”
  rationale: ἐπιθυμία既可表示一般渴望，也可能有较强的欲求意味。译作“渴望”保留开放性，不将本节限定为性欲或某种特定对象。
translation_notes:
  register: 采用现代、庄重而通俗的格言体。“面露喜色”比直译“使脸明亮”更符合汉语表达，同时保留可见的面容意象；“一切渴望”有意维持ἐπιθυμία的宽泛语义。
