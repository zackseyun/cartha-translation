  text: A crooked heart causes grief[b][a], and a very experienced man will repay him.
translation:
  language: zh_hans
  text: 扭曲的心会带来忧伤[a]；阅历丰富的人必还报他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扭曲的”也可译作“弯曲的”或“乖僻的”。
    reason: lexical_alternative
  - marker: b
    text: “还报”也可理解为“作出相应的回应”。原文没有说明这种回应的具体方式或性质；“他”最自然地指有扭曲之心的人，但指代较为紧缩。
    reason: alternative_reading
lexical_decisions:
- source_word: καρδία
  choice: 心
  rationale: 保留圣经智慧文学中“心”作为思想、意向和品格中心的常见意象，不窄化为单纯的情感或理智。
- source_word: στρεβλὴ
  choice: 扭曲的
  rationale: 表达内在品格的弯曲、失正，同时避免把其道德程度过度限定为极端邪恶。
- source_word: δώσει λύπην
  choice: 会带来忧伤
  rationale: 自然表达“给予忧伤”的结果性含义，并保留原文将其陈述为将会发生之事的语气。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 现代汉语的“人”自然承载这条格言中的单数泛指，不必强行标示希腊语的语法阳性。
- source_word: πολύπειρος
  choice: 阅历丰富的
  rationale: 准确表达因经历众多而富有经验的含义，语体自然且庄重。
- source_word: ἀνταποδώσει
  choice: 必还报
  rationale: “还报”保留回还、报偿的对等意味，未明确规定回应是善意、惩罚还是其他性质。
- source_word: αὐτῷ
  choice: 他
  rationale: 按最自然的句法理解，指向具有扭曲之心的那个人；同时借脚注说明希腊文中的指代较为紧缩。
theological_decisions:
- issue: 智慧格言中ἄνθρωπος的语法阳性
  choice: 人
  alternative: 男人
  rationale: 此处是在泛论有丰富阅历者，并无证据表明命题仅限男性；现代汉语“人”既忠于所指，也不添加性别限制。
- issue: ἀνταποδώσει所指回应的性质
  choice: 必还报他
  alternative: 必回敬他；必报复他；必回答他
  rationale: 原文只表明相应的回还或回应，没有明确其道德性质；采用“还报”以保留这种张力，不把它解释成报复或普通答话。
- issue: αὐτῷ的先行对象
  choice: 译作“他”，理解为扭曲之心所代表的人
  alternative: 译作“它”，指扭曲的心；或笼统译作“作出回应”
  rationale: 阳性单数代词最自然地指向拥有这种心的人，但原文先行词表达紧缩，故不在正文中扩写，并以脚注提示。
translation_notes:
  register: 采用简洁、庄重而易懂的现代汉语格言体。分号呈现两个并列而相互关联的分句；“必还报”略带书面色彩，以保存希腊文的互惠、回还意味及其未决的褒贬色彩。
