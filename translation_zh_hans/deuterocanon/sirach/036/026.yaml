  yaml_path: translation/deuterocanon/sirach/036/026.yaml
  text: He who acquires a wife begins an acquisition[b][a], a helper corresponding to him and a pillar of rest.
translation:
  language: zh_hans
  text: 获得妻子的人，开始拥有产业[a]；妻子是与他相配的帮手[b]，也是安歇的支柱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产业”也可译作“所得”“财产”或“所有物”。原文“获得”和“产业”所对应的希腊词出自同一词根，形成文字呼应。
    reason: 说明κτώμενος与κτήσεως的同源文字游戏，以及κτήσεως的词义范围。
  - marker: b
    text: “与他相配”直译为“按照他”，也可理解为“与他相应”或“适合他”。
    reason: 保留κατʼ αὐτόν的字面形式及其可能含义。
lexical_decisions:
- source_word: ὁ κτώμενος γυναῖκα
  choice: 娶得妻子的人
  rationale: κτώμενος是阳性单数分词，句中作泛指箴言式主语；γυναῖκα在此指妻子。“娶得”既符合现代汉语婚姻语境，也保留κτάομαι所含“取得、获得”的意味。
- source_word: ἐνάρχεται κτήσεως
  choice: 便开始有了产业
  rationale: ἐνάρχεται表示开始，κτήσεως可指所得、产业或财产。“开始有了产业”比直译“开始一项取得”自然，同时保留建立家业、开始拥有产业的含义；与前面的κτώμενος同源呼应则交由脚注说明。
- source_word: βοηθὸν
  choice: 一个……帮手
  rationale: βοηθός意为帮助者或帮手；“帮手”简明自然，并保留其人物指称。
- source_word: κατʼ αὐτόν
  choice: 与他相配
  rationale: 字面为“按照他”，在此表达对应、合宜或相配。“与他相配”保留关系上的对应性，不把这种对应进一步解释为等级或身份。
- source_word: στύλον ἀναπαύσεως
  choice: 使他安歇的支柱
  rationale: στῦλος保留建筑比喻“支柱”；ἀνάπαυσις表示安歇、休息。“使他安歇”在汉语中比“安歇的支柱”更清楚，并自然表达支撑和安顿之意。
theological_decisions:
- issue: 箴言式主语的性别形式
  choice: 娶得妻子的人
  alternative: 凡娶妻的；人若娶妻
  rationale: 原文以阳性单数表述娶妻者。译文保留丈夫这一具体视角，不把它泛化为无性别的婚姻陈述。
- issue: 妻子作为帮手的对应关系
  choice: 与他相配的帮手
  alternative: 适合他的帮手；照着他的帮手
  rationale: κατʼ αὐτόν本身可表示“按照他”或“与他对应”。选择“与他相配”保留对应和合宜的含义，同时不引入从属、同等或其他原文未明说的教义判断。
- issue: κτήσεως所指的范围
  choice: 产业
  alternative: 所得；财产；所有物
  rationale: 该词可指取得、所有物或产业。译作“产业”保留家业与所有之物的语义范围，脚注列出其他可能，避免把妻子简单窄化为物件。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。以“娶得……开始有了……”再现原文紧凑的递进结构；第二个“有了”是为汉语句法清晰而补出，使“帮手”和“支柱”自然承接妻子这一宾语。脚注标记按正文首次出现顺序排列。
