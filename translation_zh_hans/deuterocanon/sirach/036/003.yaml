  text: A man of understanding will trust in the law, and the law is as trustworthy to him as an oracle of the righteous.
translation:
  language: zh_hans
  text: 明智的人信赖律法；律法对他也可靠，如同义人求问所得的神谕。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求问所得的神谕”所译的希腊词ἐρώτημα基本义为“询问”或“求问”；在此也可指求问所得到的答复或神谕。该短语也可较直译为“义人的求问”。
    reason: 保留ἐρώτημα δικαίων的词义与属格关系的歧义，同时避免正文被误解为义人亲自作出的答复。
lexical_decisions:
- source_word: ἄνθρωπος συνετός
  choice: 明智的人
  rationale: 自然表达具备理解力、审慎判断的人，不限于男性。
- source_word: ἐμπιστεύσει νόμῳ
  choice: 信赖律法
  rationale: 保留将信任寄托于律法的语义；将νόμος译作传统且清楚的“律法”。
- source_word: πιστός
  choice: 可靠
  rationale: 在此表示值得信赖、靠得住，与前句“信赖”形成呼应。
- source_word: ἐρώτημα δικαίων
  choice: 义人的答复
  rationale: ἐρώτημα可指询问、所问之事或答复；此处按上下文采用“答复”，同时用脚注保留词义歧义。
theological_decisions:
- issue: νόμος的所指
  choice: 律法
  alternative: 法律／教诲
  rationale: 原文未进一步限定；采用经书语境中的常规译法，不擅自缩限为某一具体法典。
- issue: ἐρώτημα δικαίων的解释
  choice: 义人的答复
  alternative: 向义人求问所得的神谕／义人的求问
  rationale: 该短语语义和句法具有张力；正文选取通顺且有古典背景支持的理解，脚注明确其他可能，避免把“神谕”确定化。
translation_notes:
  register: 采用现代、庄重而简明的汉语；以分号呈现两分句的对应关系，并保留“信赖—可靠”的语义呼应。
