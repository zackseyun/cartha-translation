  yaml_path: translation/deuterocanon/sirach/036/012.yaml
  text: Crush the heads of enemy rulers[a], who say, “There is no one but us.”
translation:
  language: zh_hans
  text: 击碎敌方首领的头颅；他们说：“除我们以外，再没有别人。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“除我们以外，再没有谁。”希腊文表达排他的自我抬高；有人可能从中听出近乎自居为神的狂妄，但原文并未明说“神”。
    reason: 说明原句的词义范围及其可能具有、却不宜在正文中明确添加的神学意味。
lexical_decisions:
- source_word: σύντριψον
  choice: 击碎
  rationale: 这是 συντρίβω 的不定过去时命令式，表达强力粉碎、毁坏；“击碎”既保留力度，也适合“头颅”的具体意象。
- source_word: κεφαλὰς
  choice: 头颅
  rationale: 保留原文复数名词的具体暴力意象，不将其弱化为“权势”等抽象说法；现代汉语中复数可由语境自然表达。
- source_word: ἀρχόντων
  choice: 首领
  rationale: ἄρχων 指掌权或居领导地位的人；“首领”在这里自然地指敌方的领袖，而不额外限定其具体政治身份。
- source_word: ἐχθρῶν
  choice: 敌方
  rationale: 该属格与 ἀρχόντων 连用，最自然地表示敌对一方的首领；译作“敌方”比“仇敌的”更符合现代汉语，同时保留敌对含义。
- source_word: λεγόντων
  choice: 他们说
  rationale: 分词用来描写这些首领；汉语以独立分句承接，指代清楚，也保留其言论对他们的刻画作用。
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: 除我们以外，再没有别人
  rationale: 表达排他的狂妄自夸。“别人”补足汉语表达所需的指称，但不加入原文没有明说的“神”。
theological_decisions:
- issue: 敌方首领自夸之言的性质
  choice: 译为排他性的自我抬高：“除我们以外，再没有别人。”
  alternative: “除我们以外，再没有谁”或带神性意味的“除我们以外，并没有神”
  rationale: 希腊文没有出现“神”一词。此话可能让人听出近乎神化自己的狂妄，但译文不应把这种可能的含义改写成明确的神学宣称。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“击碎……头颅”保留祈求中的强烈意象；引语自然流畅，同时不消解原文在一般政治狂妄与近乎神性自夸之间的张力。
