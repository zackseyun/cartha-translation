base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/018.yaml
  text: Give a reward to those who wait for you[a], and let your prophets be trusted. Hear, O Lord[b], the prayer of your suppliants.
translation:
  language: zh_hans
  text: 求你赏赐那些等候你的人[a]，使你的先知得人信赖[b]。主啊，求你垂听向你恳求之人的祷告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些为你忍耐的人”，或“那些向你坚守的人”。希腊语动词既可表示等候，也可表示忍耐、坚持。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使你的先知显为可信”，或“使你的先知被人相信”。希腊原文较为凝缩，既可指先知受到信赖，也可指他们被证实可信。
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς μισθὸν
  choice: 求你赏赐
  rationale: δὸς是直接祈求，μισθός可指报酬、奖赏；在向上帝祷告的语境中，“赏赐”自然庄重，也避免“工资”的交易意味。
- source_word: τοῖς ὑπομένουσίν σε
  choice: 那些等候你的人
  rationale: ὑπομένω兼有等候、忍耐、坚守之意；以“你”为宾语时，“等候你”最符合此处祈求上帝行动的语境，同时以脚注保留坚持忍耐的可能。
- source_word: οἱ προφῆταί σου
  choice: 你的先知
  rationale: 忠实直译该名词短语，保留明确的先知所指。
- source_word: ἐμπιστευθήτωσαν
  choice: 使……得人信赖
  rationale: 该被动命令式表达较为浓缩，可指先知受到信赖或被证实可信；正文采用自然的被动意义，并在脚注说明另一可能。
- source_word: εἰσάκουσον
  choice: 求你垂听
  rationale: 该动词在祷告中不仅指听见，也含应允、留意之意；“垂听”是现代中文祷告语体中自然而庄重的表达。
- source_word: Κύριε
  choice: 主啊
  rationale: 作为对上帝的直接呼告，译作“主啊”准确自然。
- source_word: δεήσεως τῶν ἱκετῶν σου
  choice: 你恳求者的祷告
  rationale: δέησις指恳切的祈求或祷告，ἱκέτης指前来哀求、恳求的人；此译保留祈求姿态，又避免过度生硬。
theological_decisions:
- issue: τοῖς ὑπομένουσίν σε所表达的是等候还是忍耐坚守
  choice: 那些等候你的人
  alternative: 那些为你忍耐的人；那些向你坚守的人
  rationale: 上下文是求上帝施行作为并使预言可信，“等候你”较贴合忠诚信靠与期待；但希腊词确实也有忍耐、坚守的语义，故不将其排除，而以脚注保存。
- issue: ἐμπιστευθήτωσαν是指先知受人信赖，还是被证实可信
  choice: 使你的先知得人信赖
  alternative: 使你的先知显为可信；使你的先知被人相信
  rationale: 被动命令式最直接可理解为先知获得信赖；同时，语境也可能是在求上帝以行动证实先知的话，因此脚注保留这一压缩结构中的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你……”“主啊，求你垂听……”保持原文命令式祈求的力度；对两处真实的词义歧义均在正文作出可读选择，并以脚注保存其他可能。
