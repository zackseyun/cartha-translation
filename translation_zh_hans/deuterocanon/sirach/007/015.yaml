  text: Do not count yourself among the people’s dead[b][a]; remember that passing away will not pass over.
translation:
  language: zh_hans
  text: 不要把自己算在百姓的死者中；要记住，逝去不会越过任何人。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句后半的希伯来文语义较难确定，并可能借同一词根表达“逝去／越过”的文字呼应；大意是死亡或人的逝去不会绕过任何人。
    reason: lexical_alternative
  - marker: b
    text: 希腊传统作：“不要厌恶辛苦的劳动和至高者所创造的耕作。”希腊文与此处现存的希伯来文差异显著。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּחְשׁוֹבְךָ
  choice: 不要把自己算在
  rationale: חשב在这里表示把自己归入某一类；“把自己算在……中”既贴近原文结构，也符合现代汉语表达。
- source_word: בָּמֳתֵי עָם
  choice: 百姓的死者中
  rationale: 将מותי理解为具体的“死者”，עם理解为百姓或群体；保留希伯来文简缩而不寻常的意象。
- source_word: זְכוֹר
  choice: 要记住
  rationale: 准确传达זכר命令式的劝诫语气。
- source_word: עִבָּרוֹן
  choice: 死亡
  rationale: 该词含义困难，并与下一个动词形成源自עבר的文字呼应。上下文指向逝去、死亡；正文用自然明确的“死亡”，不把它武断解释为“过犯”或“忿怒”。
- source_word: לֹא יִתְעַבָּר
  choice: 不会绕过任何人
  rationale: 表达“不越过、不避开”的含义，并呈现死亡无人能够逃避的意思；原文的词根呼应则在脚注中说明。
- source_word: μὴ μισήσῃς ἐπίπονον ἐργασίαν καὶ γεωργίαν ὑπὸ Ὑψίστου ἐκτισμένην
  choice: 不纳入正文
  rationale: 希腊传统与现存希伯来文差异显著。此处希伯来文本保存且可信度高，因此正文据希伯来文翻译，希腊异文另见脚注。
theological_decisions:
- issue: 现存希伯来文与希腊传统存在实质差异
  choice: 正文采用现存希伯来文，脚注完整保留希腊传统的主要异文
  alternative: “不要厌恶辛苦的劳动，也不要厌恶至高者所创造的耕作。”
  rationale: 此处有可信度高的希伯来文本，不宜用差异显著的希腊传统取代；但该异文关系到整节内容，必须向读者透明说明。
- issue: עִבָּרוֹן的解释
  choice: 按死亡或逝去理解，同时在脚注承认原文困难及文字呼应
  alternative: 过犯、忿怒或经过
  rationale: 与前半句“死者”相连时，死亡最符合本节内部语境；但词义并非毫无疑问，因此不将其他可能性完全抹去。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“百姓的死者”刻意保留原文压缩且略显突兀的表达；后半句以自然汉语传达死亡不可逃避的意思，并用脚注交代希伯来文的词义困难和文字呼应。
