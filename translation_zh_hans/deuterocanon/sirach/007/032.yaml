translation:
  language: zh_hans
  text: 大能者的饼和手所献的供物[a]，公义的祭牲和圣洁的奉献。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“也要向穷人伸出你的手，好使你的福分得以完全。”希伯来文与希腊文在这里差异很大，可能反映了不同的文本传统，或传抄过程中发生了讹误。
    reason: textual_variant
lexical_decisions:
- source_word: לֶחֶם
  choice: 饼
  rationale: 采用基本义“饼”，不在上下文依据不足时泛化为“食物”。
- source_word: אַבִּירִים
  choice: 大能者
  rationale: 该词可指强者、大能者，在某些语境也可指公牛；此处所指不明，译作“大能者”以保留希伯来文的含混，不因下文的献祭用语而擅自确定所指。
- source_word: וּתְרוּמַת יָד
  choice: 和手所献的供物
  rationale: תרומה表示奉献之物或举祭；与“手”连用，可能指人亲手献上的供物。此译保留手的意象，同时比“手的供物”更符合现代汉语。
- source_word: זִבְחֵי צֶדֶק
  choice: 公义的祭牲
  rationale: 保留原文的结构，使“公义”既可描述这些祭牲或献祭，也不把道德与礼仪层面的张力过度解释。זבח在此祭祀语境中译作“祭牲”。
- source_word: וּתְרוּמַת קֹדֶשׁ
  choice: 和圣洁的奉献
  rationale: 表达分别为圣的奉献之物，保留祭祀语域，又避免加入原文没有明确限定的专门礼仪术语。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本显著不同
  choice: 正文以现存希伯来文为主要文本依据，并在脚注完整保留希腊文的不同读法。
  alternative: “也要向穷人伸出你的手，好使你的福分得以完全。”
  rationale: 此处希腊文并非仅有措辞差异，而是表达了完全不同的内容，可能反映不同的底本传统或传抄讹误。既然本节有可信度较高的希伯来文见证，正文从希伯来文翻译；但希腊异文对理解文本传承十分重要，故列入脚注。
- issue: אַבִּירִים所指不确定
  choice: 译作“大能者”，不明确解释为贵族、公牛或其他对象。
  alternative: “强者”“贵族”或“公牛”
  rationale: 原词本身具有多种可能含义，而祭祀语境虽可能支持动物所指，却不足以排除其他解释；保留含混可避免将推测写入正文。
translation_notes:
  register: 采用现代、庄重而简洁的祭祀语体。“手所献的供物”兼顾自然汉语与原文意象；全句保留希伯来诗句并列、凝练的形式。
