  text: Humble pride very much[a], for the hope of man is worms.
translation:
  language: zh_hans
  text: 要极力抑制骄傲[a]，因为世人的指望是蛆虫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“不要把自己算在众多罪人之中。”这看来反映了不同的文本传统，并非细微的措辞差异。
    reason: textual_variant
lexical_decisions:
- source_word: מְאֹד מְאֹד
  choice: 极力
  rationale: 叠用“非常”强烈加重命令语气；汉语用“极力”自然而有力，避免生硬重复，同时保留强化意味。
- source_word: הַשְׁפִּיל
  choice: 压低
  rationale: 该使役命令式要求主动使之降低；“压低”既保留下降意象，也适合以“骄傲”为宾语。
- source_word: גַּאֲוָה
  choice: 骄傲
  rationale: 这是涵盖自高、自傲之意的常用现代汉语对应词，不将含义收窄为更强烈的“狂妄”。
- source_word: תִקְוַת
  choice: 指望
  rationale: 保留“希望、所期待之事”的基本语义，也让此处刻意尖锐的死亡格言在汉语中成立，不改译为原文未明说的“结局”。
- source_word: אֱנוֹשׁ
  choice: 世人
  rationale: 该词突出脆弱、必死的人类；“世人”自然、庄重，并可表达泛指的人，而不局限于男性。
- source_word: רִמָּה
  choice: 蛆虫
  rationale: 该词指与尸体腐败相关的虫；“蛆虫”比泛称“虫子”更清楚地传达死亡与朽坏的图像。
theological_decisions:
- issue: 希伯来文本与希腊平行文本存在实质差异
  choice: 正文依现存希伯来文译作关于压低骄傲及人终归蛆虫的格言。
  alternative: 希腊平行文本作：“不要把自己算在众多罪人之中。”
  rationale: 希伯来见证在此完整且可信度高；希腊文不是轻微措辞差异，而代表另一文本传统。因此正文遵循希伯来文，并以脚注诚实保留希腊异文。
- issue: “指望是蛆虫”的神学张力
  choice: 保留“指望”这一反常而尖锐的表达。
  alternative: 意译为“结局是蛆虫”或“终将归于蛆虫”。
  rationale: 原文使用תִקְוָה，通常意为“希望、指望、期待”；改成“结局”虽较易懂，却会消解原文将人的自高与死亡朽坏并置的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“要极力”传达强烈命令；“压低骄傲”有意贴近希伯来语的下降意象；“指望是蛆虫”保留原文略显突兀的死亡警语。脚注标记置于与整句希伯来读法相关的第一分句之后。
