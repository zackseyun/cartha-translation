  text: Marry off a daughter[a], and the matter will be settled[b]; and give her to an intelligent man.
translation:
  language: zh_hans
  text: 嫁出女儿，事情就了结了[a]；并把她嫁给明智的男子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事情就了结了”直译为“事情就出去了”。希腊文平行经文说：“你就完成了一件大事。”
    reason: alternative_reading
  - marker: b
    text: “把她嫁给”也可译作“使她与……结合”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵא בַת
  choice: 嫁出女儿
  rationale: הוֹצֵא 字面为“使出去、送出”，但与“女儿”连用时是嫁女的惯用表达；希腊文 ἔκδου 也印证了这一婚嫁语境。中文用“嫁出女儿”既自然，也保留家长采取行动的含义。
- source_word: וְיֵצֵא עֵסֶק
  choice: 事情就了结了
  rationale: יֵצֵא 字面为“出去”，עֵסֶק 可指事务、事情或操心之事；合起来在此表示相关事务告一段落。译文传达完成之意，同时用脚注保留原文意象和希腊文平行经文的扩展表达。
- source_word: גֶּבֶר נָבוֹן
  choice: 明智的人
  rationale: גֶּבֶר 指成年男子；נָבוֹן 强调有理解力、判断力和见识。“明智的人”是现代中文中自然且涵义适中的表达，也与希腊文 συνετός 相符。
- source_word: חַבְּרָהּ
  choice: 把她嫁给
  rationale: 该词源自 חבר，基本义为连接、使结合；在本节婚姻语境中指使女儿与男子结为夫妻。中文“把她嫁给”清楚表达其语境含义，而脚注说明较贴近字面的译法。
