  text: Honor God and honor the priest[a], and give them their portion[b], as you were commanded.
translation:
  language: zh_hans
  text: 要尊荣上帝，也要敬重祭司[a]；要照所吩咐你的，把他们应得的份[b]给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“要敬畏主，荣耀祭司；要把他的份给他，正如从起初所吩咐你的”，随后还列出更完整的祭司所得之物。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“他们的份”，使用复数，可能统指众祭司所得的份额；希腊平行文本则用单数“他的份”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: 尊荣
  rationale: 该词为 כבד 的加强词干命令式，表示给予应有的分量与尊敬；“尊荣”既庄重又自然，并保留其较强的伦理语气。
- source_word: אֵל
  choice: 上帝
  rationale: 希伯来文本使用通用神称 אֵל，故按主要原文见证译为“上帝”，不把希腊平行文本的“主”引入正文。
- source_word: וַהֲדַר
  choice: 敬重
  rationale: הדר 在此表示以尊严、敬意相待；译作“敬重”可与前句“尊荣”保持语义呼应，同时避免中文中生硬的重复。
- source_word: כֹּהֵן
  choice: 祭司
  rationale: 单数在此具有代表性，指祭司这一职分；现代汉语不必添加冠词或量词。
- source_word: וְתֵן
  choice: 给
  rationale: 直接保留命令式“给予”的基本含义，不预先限定所给之物的法律或礼仪性质。
- source_word: חֶלְקָם
  choice: 他们当得的份
  rationale: 后缀为第三人称复数，应予保留；“当得的份”自然表达分配给祭司群体的份额，也避免仅译“他们的份”可能产生的含混。
- source_word: כַּאֲשֶׁר צֻוֵּיתָה
  choice: 照你所受的吩咐
  rationale: 保留被动意义，即受话者先前已经领受命令；此表达符合现代庄重汉语。
theological_decisions:
- issue: 正文中的神称
  choice: 按希伯来文 אֵל 译为“上帝”
  alternative: 按希腊平行文本译为“主”
  rationale: 现存希伯来文在此清楚可靠，应以其为正文依据；希腊异文则在脚注中保存。
- issue: חֶלְקָם 的所指与数
  choice: 保留复数，译作“他们当得的份”
  alternative: 依希腊文单数译作“他当得的份”，或释为“祭司当得的份”
  rationale: 希伯来文所有格后缀明确为复数，可能统指祭司群体所得的份额；不宜因前面的代表性单数“祭司”而默默改成单数。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尊荣上帝”与“敬重祭司”体现两个近义但不完全相同的希伯来命令词；以分号划分尊敬的命令与实际供给的命令。所有脚注标记均已置于正文相应位置。
