  text: Do not delay with those who weep[a], and mourn with those who mourn.
translation:
  language: zh_hans
  text: 不要迟延去陪伴哀哭的人[a]；要与哀恸的人一同哀悼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证作：“不要迟疑去探望病人，因为你会因这样的事而受人爱戴。”这与现存希伯来文的读法有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְאַחֵר
  choice: 不要迟延
  rationale: 否定词加未完成时的反身词干构成禁令，表示不可耽搁或退缩；“不要迟延”既保留紧迫感，也符合庄重的现代汉语。
- source_word: מִבּוֹכִים
  choice: 要陪伴哀哭的人
  rationale: 字面形式带介词“从/离”，但结合上下句的平行结构和伦理劝勉，语义是在哀哭者身旁与他们同在，而非离开他们。汉语补出“陪伴”，清楚传达这种团结关怀，同时不把“哀哭”泛化为抽象悲伤。
- source_word: אֲבֵלִים
  choice: 哀悼的人
  rationale: 该名词指处于丧恸或守丧中的人。“哀悼的人”自然清楚，并与下文动词形成词语呼应。
- source_word: תִּתְאַבָּל
  choice: 一同哀悼
  rationale: 反身词干表示自己进入哀悼状态；结合介词“与”，译作“一同哀悼”准确表达与他人共同承受哀痛的劝勉。
theological_decisions:
- issue: 希伯来文与希腊文见证之间的关系
  choice: 正文以现存希伯来文为准，译为劝人陪伴哀哭者、与哀悼者一同哀悼。
  alternative: 希腊文作：“不要迟疑去探望病人，因为你会因这样的事而受人爱戴。”
  rationale: 本节有可信度高的现存希伯来文，故正文优先据其翻译。希腊文所反映的是内容显著不同的异文，并非可在正文中悄然调和的细微差别，因此完整保留在脚注中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀哭”与“哀悼”保留原文两分句的语义层次；首句补出“陪伴”以自然表达希伯来文在平行语境中的关联与同在之意。
