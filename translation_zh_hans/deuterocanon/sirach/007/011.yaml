  text: Do not despise a man in bitterness of spirit[a]; remember that there is one who exalts and humbles.
translation:
  language: zh_hans
  text: 不要轻视心中愁苦的人；要记住，有一位使人升高，也使人降卑。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“使人升高，也使人降卑”；希腊平行文本的次序相反，作“使人降卑，也使人升高”。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּבֶז
  choice: 不要轻看
  rationale: 希伯来语 בזה 表示轻蔑、鄙视。这里用“轻看”，既保留以轻蔑态度待人的含义，又比“嘲笑”更宽泛，符合希伯来文本。
- source_word: לֶאֱנוֹשׁ
  choice: 人
  rationale: אֱנוֹשׁ 指人，常隐含人的脆弱性。现代汉语用“人”自然准确；汉语无需以“男人”表达原文具有代表性的阳性单数。
- source_word: בְּמַר רוּחַ
  choice: 心灵苦痛
  rationale: 原文直译近于“在灵的苦涩中”。“心灵苦痛”保留内在痛苦之意，也与希腊平行文本“在他心灵的苦涩中”相符，且现代中文自然易懂。
- source_word: זְכוֹר
  choice: 要记住
  rationale: 直接保留命令语气，并自然引出后面的内容。
- source_word: כִּי יֵשׁ
  choice: 有一位
  rationale: 保留 יֵשׁ 的存在表达以及后续动作主体的单数性质，同时不把原文未明说的“上帝”补入正文。
- source_word: מֵרִים וּמַשְׁפִּיל
  choice: 使人升高，也使人降卑
  rationale: 按现存希伯来文本的次序翻译为“升高、降卑”，并以“使人……”自然表达两个使役分词。希腊平行文本的次序相反，故在脚注中说明。
theological_decisions:
- issue: 改变人处境者的隐含身份
  choice: 译作“有一位”，不在正文明确补作“上帝”或“主”
  alternative: 译作“上帝使人降卑，也使人升高”或“主使人降卑，也使人升高”
  rationale: 希伯来文和希腊文都暗示一位施行处境逆转者，却没有在本句明确称其为上帝或主。保留含蓄表达可避免加入原文未出现的称号。
- issue: 末句两个动作的次序
  choice: 正文依希伯来文译为“使人升高，也使人降卑”
  alternative: 依希腊平行文本译为“使人降卑，也使人升高”
  rationale: 用户所给的高可信度希伯来来源明确作 מֵרִים וּמַשְׁפִּיל，即“升高、降卑”；希腊文本则为相反次序。以希伯来文为正文依据，并用脚注保存真实的文本差异，不以语境推断覆盖主文本证据。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心灵苦痛”避免过度书面化的“灵里苦涩”，同时保留原文的内在痛楚。“轻看”表达轻蔑而不把含义限缩为言语嘲弄。脚注标记置于相关差异所在的末句之后。
