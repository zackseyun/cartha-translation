base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/001.yaml
  text: Do not do evil[a], and evil will not overtake you; keep far from iniquity[b], and it will turn away from you.
translation:
  language: zh_hans
  text: 不要作恶[a]，恶就不会追上你；要远离罪孽，它就会转离你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第二个“恶”也可理解为“灾祸”或“伤害”。希伯来文两处使用同一个词，希腊语平行文本也同样重复“恶”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文末句十分简练，也可译作“它就会离开你”。这里的“它”可能指罪孽，也可能包括罪孽带来的危险或后果。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעַשׂ
  choice: 不要作
  rationale: 直译希伯来语“不要做”，保持禁令简洁直接；与“恶”搭配时，“作恶”也是自然、庄重的现代汉语。
- source_word: רָעָה
  choice: 恶
  rationale: 原文两次使用同一个词，希腊语平行文本也重复同一词根。两处均译为“恶”，既保留道德含义，也保留“作恶—恶追上你”的修辞对应；第二处亦可包含灾祸或伤害之意，故以脚注说明。
- source_word: יַשִּׂיגְךָ
  choice: 追上你
  rationale: 该动词表示赶上、追及；“追上你”自然地保留原文将恶描写为追赶人的动态意象。
- source_word: הַרְחֵק
  choice: 要远离
  rationale: 表达主动拉开距离，保留原文的空间比喻，同时符合现代汉语劝诫语体。
- source_word: מֵעָוֹן
  choice: 罪孽
  rationale: עָוֹן可指罪恶、罪责或其后果；本节是道德劝诫，主要指罪恶。“罪孽”保留其较重的伦理分量。
- source_word: וְיֵט מִמְּךָ
  choice: 它就会转离你
  rationale: 原文简练，主语没有明说。“它”可回指罪孽，也可涵盖罪孽所带来的危险或后果；“转离”保留动词“转开、偏离”的意象，不擅自补出施事者。
theological_decisions:
- issue: 重复的 רָעָה 是道德之恶，还是由恶导致的灾害
  choice: 正文两处都译作“恶”
  alternative: 第二处译作“灾祸”或“伤害”
  rationale: 希伯来文有意重复同一个词，希腊语平行文本亦然。统一译作“恶”可保留道德行为与其反噬之间的张力和修辞对称；第二处可能侧重恶所造成的灾害，因此在脚注中保留这一可能。
- issue: 末句 וְיֵט מִמְּךָ 的隐含主语及含义
  choice: 译作“它就会转离你”，不明确限定“它”是什么
  alternative: 译作“它就会离开你”，或解释为罪孽的危险、影响将避开你
  rationale: 希伯来文没有明示主语，句意可回指罪孽，也可能包含罪孽的危险或后果。正文保留代词的开放性，避免把一种解释写死。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。“作恶—恶追上你”保留原文的关键词重复和动态意象；“罪孽”体现 עָוֹן 的伦理分量。正文中所有脚注标记均已对应列出。
