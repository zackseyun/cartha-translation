  text: Do not be hasty in the army[a], for it is laborious work allotted by God.
translation:
  language: zh_hans
  text: 在军中不要仓促行事[a]，因为这是上帝分派的劳苦差事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要说：‘他会顾念我众多的礼物；当我向至高的上帝献上礼物时，他必悦纳。’”这反映了一个与现存希伯来文本显著不同的文本传统。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּאִיץ
  choice: 不要急着
  rationale: 否定命令式表达不要催逼自己、贸然行事；“不要急着”是自然的现代汉语，也保留了对仓促行动的警戒。
- source_word: בַּצָּבָא
  choice: 从军
  rationale: צָבָא通常指军队、军旅或服役；此处“从军”简洁自然，明确传达军事语境。
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: 劳苦差事
  rationale: 该组合兼有工作、服役和劳作之意，并强化其艰苦性；“劳苦差事”在现代汉语中自然地保留这种负重劳作的意味。
- source_word: מֵאֵל נֶחֱלָקָה
  choice: 上帝分派的
  rationale: מֵאֵל可表示来源或施事，נֶחֱלָקָה是חלק的被动形式，意为被分配、划定；此译保留上帝作为分派者的含义。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本显著不同
  choice: 正文以现存希伯来文本为准
  alternative: 希腊文本作：“不要说：‘他会看我礼物众多；我向至高的上帝献礼时，他必悦纳。’”
  rationale: 此处希伯来文本完整且可信度高；希腊文显然代表另一文本传统，而非可用词义调整消除的小异文。因此正文翻译希伯来文，并在脚注中完整保留希腊异文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从军”比“在军队里”更符合命令句语境；“劳苦差事”保留原文 מְלֶאכֶת עֲבֹדָה 的强化表达。
