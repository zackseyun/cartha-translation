  text: Do not be fainthearted in your prayer, and do not neglect to give alms.
translation:
  language: zh_hans
  text: 祷告时不要灰心，也不要忽略施舍[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施舍”所译的希伯来语也可意为“公义”；但希腊语平行文本明确作“行施舍”，支持这里的译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְקַצֵּר
  choice: 不要灰心
  rationale: 这个希伯来语形式单独看较难确定，但希腊语平行文本 μὴ ὀλιγοψυχήσῃς 明确支持“灰心、气馁”之意，而不是单指缩短祷告。
- source_word: בַּתְּפִלָּה
  choice: 祷告时
  rationale: 希伯来语直译为“在祷告中”；“祷告时”符合现代汉语表达，也不额外加入希伯来文本没有明说的所属代词。
- source_word: וּבִצְדָקָה
  choice: 施舍
  rationale: צדקה 也可指“公义”，但在较晚期希伯来语及本处语境中可指周济穷人的施舍；希腊语平行文本 ἐλεημοσύνην ποιῆσαι（行施舍）支持这一理解。
- source_word: אַל תִּתְעַבָּר
  choice: 不要忽略
  rationale: 该动词有“越过、不顾”之意，希腊语 μὴ παρίδῃς 也支持“不要忽视、忽略”；“不要忽略”在现代汉语劝诫中自然准确。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“祷告时不要灰心”保留劝勉语气；“施舍”沿用读者易懂的传统宗教与慈善用语，但以脚注保留“公义”这一真实的词义可能。
