  yaml_path: translation/deuterocanon/sirach/007/030.yaml
  text: With all your strength[a], love your Maker[b], and do not forsake his ministers.
translation:
  language: zh_hans
  text: 你要尽全力[a]爱创造你的那一位；也不可离弃侍奉他的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“竭尽全力”或“用你全部的能力”。
    reason: lexical_alternative
  - marker: b
    text: 这里可能较具体地指在圣所或礼仪事务中侍奉上帝的人；也可译作“他的仆人”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל מְאֹדְךָ
  choice: 尽你全部的力量
  rationale: מְאֹד 在这一结构中表示人的全部力量或能力；希腊语 ἐν ὅλῃ δυνάμει 也支持这一理解。译文既保留“全部”的强调，也符合现代汉语表达。
- source_word: אֱהוֹב
  choice: 爱
  rationale: אהב 的命令式，直接译为“爱”，简洁并忠于原文。
- source_word: עוֹשֶׂךָ
  choice: 造你的那一位
  rationale: 该分词直指“造你的那一位”；这一译法保留希伯来语的表达方式和明确的创造者所指，又不额外加入原文没有的称号。
- source_word: מְשָׁרְתָיו
  choice: 侍奉他的人
  rationale: שרת 指服侍或供职，常可带有正式、礼仪或圣所服侍的意味；希腊语 λειτουργούς 也支持这一层含义。“侍奉他的人”自然可懂，同时不把所指过早限定为某一特定职分。
- source_word: לֹא תַעֲזֹב
  choice: 不可离弃
  rationale: עזב 表示离开、抛弃或离弃；“不可离弃”保留命令的道德力度，并与希腊语 μὴ ἐγκαταλίπῃς 相符。
theological_decisions:
- issue: עוֹשֶׂךָ 所指的表达
  choice: 造你的那一位
  alternative: 你的创造者
  rationale: 上下文所指为创造人的上帝，但希伯来语本身采用分词表达。译作“造你的那一位”既清楚传达神圣所指，也避免增添“主”等原文未明说的称号。
- issue: מְשָׁרְתָיו / λειτουργούς αὐτοῦ 的范围
  choice: 侍奉他的人
  alternative: 他的仆人；在圣所中侍奉他的人
  rationale: 原词可能特指从事圣所或礼仪服侍者，也可较宽泛地指服侍上帝的人。正文保留较宽的表达，脚注说明较具体的可能性，以维持原文的含义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尽你全部的力量”保持原文强调；“造你的那一位”避免不必要的称号增补；分号呈现两个并列命令之间的紧密关系。
