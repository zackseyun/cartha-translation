review_pass:
  verdict: revise
  source_fidelity: 正文忠实反映所给希伯来文的基本句法：אַל־תִּשָּׂא לֵב מֵאוֹהֵב 可译为不要把心从爱你的人身上移开；כִּי מִמֶּנוּ תֵּאָהֵב 表示因为你会蒙他所爱。鉴于希伯来见证与希腊文平行本内容完全不同，保留希腊文的完整异读十分必要。
  naturalness: “不要把心从爱你的人身上移开”自然且保有原文的“心”这一意象。“必蒙他所爱”略显生硬；改为“会蒙他所爱”较合现代庄重汉语，仍保留原文未完成式的结果意味。脚注中的“在你一切所说的事上”不够自然，宜改为“在你所说的一切话上”。
  terminology: “爱”“蒙……所爱”没有擅自把对象解释为上帝、朋友或恩宠，处理恰当。希腊异读中的“结局”和“犯罪”准确对应 τὰ ἔσχατά σου 与 ἁμαρτήσεις；“结局”也保留了原文未明确限定的终末含义。
  issues:
  - severity: low
    issue: 正文“必蒙他所爱”的语气稍显文言化和生硬。
    rationale: 原文不要求以“必”表达强制或绝对的将来；“会蒙他所爱”在现代庄重汉语中更流畅，同时保留未来／结果意味。
  - severity: low
    issue: 脚注的希腊异读首句措辞不够自然。
    rationale: λόγοι更顺畅的汉语表达是“所说的一切话”；此修改不改变异读的内容或其与希伯来文本的差异。
  revised_text: 不要把心从爱你的人身上移开，因为你会蒙他所爱。[a]
  revised_footnotes:
  - marker: a
    text: 希腊传统作：“在你所说的一切话上，要记住你的结局，你就永不犯罪。”这与现存希伯来文本有显著差异。
    reason: 重要异文
  revision_rationale: 采用所给希伯来见证作为正文依据，并以脚注完整呈现内容显著不同的希腊传统。仅作两处安全的现代汉语润饰：以“会”替换生硬的“必”，并改善脚注中希腊异读的语序；不改变经文含义、关系对象或神学指向。
