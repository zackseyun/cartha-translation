  text: In all your words remember your end, and you will never sin.[a]
translation:
  language: zh_hans
  text: 不要把心从爱你的人身上移开，因为你必蒙他所爱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊传统作：“在你一切所说的事上，要记住你的结局，你就永不犯罪。”这与现存希伯来文本有显著差异。
    reason: 重要异文
lexical_decisions:
- source_word: אַל תִּשָּׂא לֵב מֵאוֹהֵב
  choice: 不要把心从爱你的人身上移开
  rationale: תִּשָּׂא לֵב 字面涉及“抬起／挪开心”，与表示离开来源的 מִן 连用时，可理解为把心从某人那里移开；译文保留“心”的意象，并以现代汉语表达疏远之意。אוֹהֵב 是“爱的人／爱你的人”，此处按关系语境补出隐含宾语“你”。
- source_word: כִּי מִמֶּנוּ תֵּאָהֵב
  choice: 因为你必蒙他所爱
  rationale: תֵּאָהֵב 是“被爱”的未完成式，מִמֶּנוּ 指爱的来源“从他／由他”；“必蒙他所爱”既保留被动关系，也符合庄重而自然的现代汉语。
theological_decisions:
- issue: 希伯来文本与希腊传统显著不同，正文应采用哪一读法
  choice: 正文采用现存希伯来见证，希腊异文列入脚注
  alternative: 正文采用希腊文“在你一切所说的事上，要记住你的结局，你就永不犯罪”
  rationale: 所提供的希伯来文本虽措辞不寻常，却能形成可理解的劝诫，且该见证的置信度与校验结果均高；因此按原文证据优先采用希伯来文，同时透明保留内容完全不同的希腊传统。
- issue: 是否把“蒙他所爱”解释为特定神学意义的爱
  choice: 保留一般人际关系中的“爱”
  alternative: 将“他”理解为上帝，或把爱具体化为友谊、忠诚或恩宠
  rationale: 上下文所给句子没有明说“他”的身份，也未限定爱的性质；译文不加入经文本身未表达的神学指向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把心……移开”保留希伯来语的身体意象；“必蒙他所爱”略带经文语体，但意思清楚，并准确呈现原文的被动结构。
