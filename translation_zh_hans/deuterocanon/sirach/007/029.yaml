translation:
  language: zh_hans
  text: 你要全心敬畏上帝，也要尊他的祭司为圣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尊……为圣”也可理解为“把……分别为圣”。希腊文本作“尊崇他的祭司”。
    reason: 说明希伯来文 הַקְדִישׁ 的语义范围，以及希腊平行文本较弱的对应表达，保留文本传统之间的差异。
lexical_decisions:
- source_word: בְּכָל לִבְּך
  choice: 全心
  rationale: 直译为“用你全部的心”；现代汉语以“全心”自然表达全人的专一投入。
- source_word: פְּחַד
  choice: 敬畏
  rationale: 该动词在此指对上帝怀有敬惧与尊崇；“敬畏”兼顾畏惧和敬重，符合智慧文学语境。
- source_word: אִל
  choice: 上帝
  rationale: 希伯来文 אֵל 的普通称谓，译作现代汉语通行的“上帝”，不将其扩展为原文未出现的专名。
- source_word: הַקְדִישׁ
  choice: 尊……为圣
  rationale: 希伯来文使役形直指分别为圣或承认为圣；此译保留“圣”的语义，同时以“尊……为圣”表达对祭司身份的敬重。
theological_decisions:
- issue: 如何表达对祭司的要求
  choice: 尊他的祭司为圣
  alternative: 尊重他的祭司／尊崇他的祭司
  rationale: 希伯来文本使用 הַקְדִישׁ，语义强于一般的“尊重”；保留“为圣”可避免把祭司的圣职身份淡化为普通礼遇。希腊平行文本则用 θαύμαζε，较接近“敬重、尊崇”，故以脚注说明差异而不在正文中消解。
translation_notes:
  register: 采用现代、庄重而简洁的劝诫语体。“你要……也要……”清楚呈现两个并列命令；正文优先依据高可信度希伯来文本，脚注交代希腊平行文本的不同措辞。
