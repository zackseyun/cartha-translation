  text: Do not desire to repeat a lie[a], for its outcome is not good.
translation:
  language: zh_hans
  text: 不要存心谎上加谎[a]，因为它的结局并不美好。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“在虚假之上说谎”，可能指谎上加谎或反复弄虚作假。希腊文平行本作“任何谎言”，表达的范围更广。
    reason: 说明希伯来语短语的字面结构及希腊文平行本所支持的另一种理解。
lexical_decisions:
- source_word: אַל תַּחְפֹּץ
  choice: 不要存心
  rationale: אַל引出劝诫性的禁令；חפץ表示愿望、意欲或喜好。“不要存心”在现代汉语中自然地保留了主观意愿的含义。
- source_word: לְכַחֵש עַל כָּחַש
  choice: 谎上加谎
  rationale: כחש可指说谎或行虚假之事，עַל כָּחַש直译近于“在虚假之上”。“谎上加谎”保留希伯来语的累加意象，也可涵盖重复或持续弄虚作假；脚注说明希腊文平行本的较宽泛表达。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述禁令的理由，现代汉语用“因为”清楚自然。
- source_word: תִקְוָתוֹ
  choice: 它的结局
  rationale: תִּקְוָה通常指“希望、期待”，此处以虚假行为为所指，可能表示其所期待的结果或最终结局。“结局”避免生硬的“它的希望”，同时不过度具体化。
- source_word: לֹא תִנְעָם
  choice: 并不美好
  rationale: נעם本义涉及悦人、甘美或令人愉快；“并不美好”既保留希伯来文的愉悦色彩，也与希腊文οὐκ εἰς ἀγαθόν（并非趋向善好）相协调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“谎上加谎”简洁有力，并保留原文略带歧义的累加结构；“结局并不美好”自然表达后果，同时未把נעם狭义化为单纯的愉快或甜美。
