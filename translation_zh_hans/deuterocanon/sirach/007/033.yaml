  text: Also stretch out your hand to the poor[a], so that your blessing may be complete.
translation:
  language: zh_hans
  text: 也要向穷人伸出手[a]，好使你的祝福得以圆满。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文异读：“要向每一个活着的人显出馈赠的恩惠；即使对死者，也不要停止施恩。”这里的希伯来文则作：“也要向穷人伸出手，好使你的祝福得以圆满。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: 也要
  rationale: 承接前文一连串劝勉，保留附加语气；“也要”在现代汉语中简洁自然。
- source_word: לְאֶבְיוֹן
  choice: 向穷人
  rationale: אֶבְיוֹן指贫穷或有需要的人；“穷人”通俗明确，也保留其社会伦理含义。
- source_word: הוֹשִׁיט יָד
  choice: 伸出手
  rationale: 按希伯来文保留伸手相助的身体意象，而不直接释作“慷慨施舍”。
- source_word: לְמַעַן
  choice: 好使
  rationale: 表达目的或结果关系，语气庄重而符合现代汉语。
- source_word: תִּשְׁלַם
  choice: 得以圆满
  rationale: שלם在此可指达到完整、完满；“得以圆满”保留其未必单指回报或履行的含义。
- source_word: בִּרְכָתֶךָ
  choice: 你的祝福
  rationale: 直译为“你的祝福”，保留它可能指所领受的福、所给予的祝福或具体惠赠的歧义。
theological_decisions:
- issue: 《便西拉智训》7:33希伯来文与希腊文见证差异显著
  choice: 正文以现存希伯来文为准，并在脚注列出希腊文异读。
  alternative: 希腊文：“要向每一个活着的人显出馈赠的恩惠；即使对死者，也不要停止施恩。”
  rationale: 本节希伯来文保存完整且可信度高；希腊文并非紧密对应，可能反映不同文本形态。因此不以希腊文改写正文，但将其作为重要异读完整注明。
- issue: “你的祝福”所指为何
  choice: 保留“祝福”的宽泛表达，不限定为施舍、善行或所得报偿。
  alternative: 译作“你的惠赠”或“你的善行”。
  rationale: 希伯来文措辞本身可容纳领受、给予及具体惠赠等含义；不应在译文中替作者消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伸出手”保留原文意象；“得以圆满”避免把含义过早限定为得到回报。脚注标记[a]已置于正文相关短语之后。
