translation:
  language: zh_hans
  text: 你若有牲畜，要亲眼察看[a]；若它有用[b]，就留着它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“用你的眼睛看”，意思是要亲自留意、仔细察看并照管牲畜。
    reason: lexical_alternative
  - marker: b
    text: “有用”所对应的希伯来词 אֻמָּנָה 在这里含义不十分确定，也可理解为“可靠”“堪用”或“有收益”；希腊文平行文本作“有用”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵמָה לְךָ
  choice: 你若有牲畜
  rationale: בְּהֵמָה 指家养牲畜或役畜；לְךָ 构成无动词的所属表达。译作“你若有牲畜”符合现代汉语劝诫语气，也与希腊文的所属问句相合，而不把范围缩窄为牛类。
- source_word: רְאֵה עֵינֶיךָ
  choice: 要亲眼察看
  rationale: 原文直译近于“用你的眼睛看”，强调亲自留意并检查。译作“亲眼察看”既保留眼目意象，也自然表达仔细照管牲畜的含义。
- source_word: אֻמָּנָה
  choice: 有用
  rationale: 此词在本节的确切含义不确定，可能涉及可靠、堪用或有收益。希腊文 χρήσιμα 明确支持“有用、可用”，因此采用较宽泛的“有用”，避免过度限定为“盈利”或“训练有素”。
- source_word: הַעֲמִידָהּ
  choice: 就留着它
  rationale: 这是 עמד 的使役形式，字面为“使它站立／维持它”，在语境中指继续保有或饲养该牲畜。“留着它”清楚传达实际劝告，并保留希伯来文的单数指代。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留智慧文学的直接劝诫语气。“牲畜”按集合性类别理解，后文用单数“它”呼应希伯来文的单数形式。
