revisions:
- from: 不要在上帝众门的会众中使自己负罪[a]，也不要在集会中使自己跌倒。
  to: 不要在上帝诸门处的会众中自招罪责[a]，也不要在集会中使自己跌倒。
  rationale: 修订首句以消除中文结构歧义，并以“上帝诸门处”表达希伯来文难解但显然关联城门／公共场合的短语；不在正文采纳希腊文的“城中的群众”。将“使自己负罪”调整为“自招罪责”，提高现代汉语自然度而不改变原义。第二分句及其隐喻保持开放。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:33:39Z'
