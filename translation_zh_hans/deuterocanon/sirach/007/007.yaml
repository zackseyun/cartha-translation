    issue: “上帝众门的会众”句法关系含混且不自然。
    rationale: 希伯来文的“上帝的诸门”本已是难句，但中文不应额外造成“会众属于门”的歧义。译作“上帝诸门处的会众”以最小解释标示其公共地点功能，并保留“上帝诸门”这一不寻常表述。
  - severity: low
