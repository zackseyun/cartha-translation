  source_fidelity: 首句的“负罪”恰当反映希伯来文使役式带反身意义，即自招罪责。原译“上帝众门的会众”在汉语中结构关系不清，且容易被理解为“属于众门的会众”；应明确其为“上帝诸门处”的公共会众，同时不把这一难句替换为希腊文的“城中的群众”。第二句保留“使自己跌倒”的开放隐喻是可取的。
  naturalness: “上帝众门”不合现代汉语通常的定中表达，读者难以辨识“众门”是“上帝的门”还是其他成分。“上帝诸门处的会众”较自然、庄重，也保留原文措辞的突兀性和地点关联。
  terminology: “会众”“集会”可分别对应 עֵדָה 与 קְהִלָּה；“自招罪责”比“使自己负罪”更符合现代汉语搭配，仍不弱化其反身的致罪含义。脚注应说明希腊文平行文本可能来自不同底本或为解释性处理。
  issues:
