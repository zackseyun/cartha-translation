  yaml_path: translation/deuterocanon/sirach/007/007.yaml
  text: Do not make yourself guilty in the assembly at the gates of God[a], and do not bring yourself down in the congregation.
translation:
  language: zh_hans
  text: 不要在上帝诸门处的会众中自招罪责[a]，也不要在集会中使自己跌倒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要在城中的群众里犯罪，也不要在人群中使自己倒下。”这可能反映另一种希伯来文读法，也可能是对希伯来文“上帝的诸门”这一短语所作的解释性平顺处理。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּרְשִׁיעֲךָ
  choice: 不要……使自己负罪
  rationale: רשע 的使役形在这里带反身意味，可指使自己成为有罪、招致罪责；这样既保留希伯来文较具体的罪责含义，也与希腊文“不要犯罪”的道德语境相合。
- source_word: בַּעֲדַת
  choice: 在……会众中
  rationale: עֵדָה 指聚集起来的群体或会众；“会众”自然地保留公共、群体性的场景。
- source_word: שַׁעֲרֵי אֵל
  choice: 上帝众门
  rationale: 按现存高可信度希伯来文本直译其不寻常的复数结构“上帝的门”；不在正文中以希腊文的“城中的群众”消解这一难句。
- source_word: וְאַל תַּפִּילְךָ
  choice: 也不要……使自己跌倒
  rationale: נפל 的使役形式在这里具有反身意味，保留“使自己倒下、陷入败落”的隐喻，不将其过度解释为单纯的自谦或社会降格。
- source_word: בַּקְּהִלָּה
  choice: 在集会中
  rationale: קְהִלָּה 指聚集的共同体；用“集会”与前句的 עֵדָה 略作区分，同时保持公共群体的含义。
theological_decisions:
- issue: 正文应采用希伯来文不寻常的“上帝众门”，还是希腊文的“城中的群众”
  choice: 正文保留希伯来文取向的“上帝众门”
  alternative: 不要在城中的群众里犯罪
  rationale: 本节存有高可信度的希伯来文，因此以其为主要依据；希腊文可能反映不同的希伯来底本，也可能是对难句的解释性平顺处理。为诚实保留文本张力，希腊文异读列入脚注。
- issue: 第二分句的“跌倒”是否应明确解释为受辱、败亡或失去地位
  choice: 保留“使自己跌倒”的开放性隐喻
  alternative: 使自己蒙羞／使自己败落
  rationale: 原文容许自招败落、受挫或蒙羞等关联含义，但未明确限定其中一种；译文不替原文消除这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“负罪”表达招致罪责；“使自己跌倒”保留原文隐喻。正文脚注标记与脚注一致。
