translation:
  language: zh_hans
  text: 你要大大谦卑自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希腊文本作“你要大大谦卑自己”。所提供的希伯来抄本合成文本在此处却是另一句话，内容大意涉及“不要急着说……交托给上帝，并悦纳他的道路”；它与本节希腊文本明显不一致，可能存在抄本残缺、错置或经节对应问题。
    reason: 公开说明主要原文见证之间的重大差异，避免把不确定的希伯来材料静默调和进正文。
lexical_decisions:
- source_word: ταπείνωσον
  choice: 使……谦卑
  rationale: 希腊文为主动命令式，意思是使自己降卑；此译既保留命令语气，也符合现代汉语表达。
- source_word: σφόδρα
  choice: 极其
  rationale: 表达程度很深，对应“非常、极其”，不削弱原文的强调。
- source_word: τὴν ψυχήν σου
  choice: 你的心灵
  rationale: ψυχή可指生命、自我或内在的人；这里与“谦卑”搭配，译作“心灵”自然，并保留原文以人的内在生命为对象的表达。
theological_decisions:
- issue: “谦卑”是内在态度，还是使整个人降卑
  choice: 保留“使你的心灵谦卑”的使动结构
  alternative: “你要极其谦卑”或“要刻苦己心”
  rationale: 希腊文直译是“使你的心灵极其谦卑”，既可能涉及内在态度，也可能指整个人自我降卑；不把它限定为苦修、禁食或某种特定宗教操练。
- issue: 希伯来文本与希腊平行文本不一致
  choice: 正文依据与本节传统内容一致且语义完整的希腊见证
  alternative: 按所提供的希伯来行译为关于“不要急着说……交托给上帝”的句子
  rationale: 所提供的希伯来行在词义和内容上都与《便西拉智训》7:17的希腊见证及经节传统明显不符，疑为错置或经节对应问题；因此不将其混入正文，但在脚注中如实提示。
translation_notes:
  register: 采用简洁、庄重而现代的标准普通话。“心灵”比“灵魂”更适合此处关于自我降卑的语境，也避免让普通读者误以为经文专指与身体相分离的实体；“极其”保留原文强烈的程度副词。
