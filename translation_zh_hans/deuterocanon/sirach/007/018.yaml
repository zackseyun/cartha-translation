base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/018.yaml
  text: Do not trade away a friend for a price[c][b][a], or a brother who is worth the gold of Ophir.
translation:
  language: zh_hans
  text: 不要为了价钱换掉朋友[b]，也不要把弟兄[c]同俄斐的金子相较。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里有截然不同的读法：“要记住，愤怒不会迟延。”开罗藏经库保存的希伯来文本则警告人不可为了价钱换掉朋友，也不可把弟兄同俄斐的金子相较。
    reason: textual_variant
  - marker: b
    text: 或译：“不要为报酬交换朋友。”
    reason: lexical_alternative
  - marker: c
    text: “弟兄”可以指亲兄弟，也可以泛指近亲或亲密伙伴。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִיר
  choice: 换掉
  rationale: 这是动词 מור 的使役形，在此表示以一物交换、替代另一物；“换掉”自然传达为利益而舍弃关系的警告，也保留交易色彩。
- source_word: אוֹהֵב
  choice: 朋友
  rationale: 字面可指“爱人之人”，但在智慧文学语境中通常指朋友或忠实伙伴；“朋友”最符合现代汉语习惯。
- source_word: בִּמְחִיר
  choice: 因价钱
  rationale: מְחִיר 指价钱、代价或交换所得；“因价钱”保留商业意味，又不把支付媒介限定为钱币。
- source_word: אָח
  choice: 弟兄
  rationale: 原词本义为兄弟，也可泛指近亲或亲密伙伴。“弟兄”既保留具体亲属称谓，也容纳较宽的古代语义范围。
- source_word: תָּלוּי
  choice: 衡量
  rationale: 此词形式和句法较难确定；结合前半句的交易语境及“俄斐的金子”，很可能涉及称量、估价或比较。译作“衡量”保留价值比较的意象，而不武断断定弟兄具有某一确定价格。
- source_word: בִּזְהַב אוֹפִיר
  choice: 同俄斐的金子
  rationale: 俄斐在圣经传统中以珍贵金子闻名；保留地名及金子的文化意象，并与“衡量”构成价值比较。
theological_decisions:
- issue: 希伯来文本与希腊文本的重大异文
  choice: 正文依据现存开罗藏经库希伯来见证，译作关于朋友、弟兄与财富的警告。
  alternative: 希腊文作：“要记住，愤怒不会长久。”
  rationale: 本项目在《便西拉智训》希伯来文尚存之处以希伯来见证为主要依据。两种文本在此并非措辞小异，而是内容完全不同，因此正文采用希伯来文，并在脚注完整保留希腊异文，以诚实呈现文本传统的不稳定。
- issue: אָח תָּלוּי 的解释
  choice: “拿弟兄同……衡量”
  alternative: “值……的弟兄”或“用……换弟兄”
  rationale: 希伯来语表达本身困难，可能涉及称量、估价或交换。正文采用较少限定的价值比较说法，不把隐含关系过度明确化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“因价钱而换掉”保留原文的商业语气；“同……衡量”刻意保留希伯来文后半句在称量、估价和比较之间的张力。脚注标记均置于正文相关词句之后。
