  text: Do not add sin a second time[a], for even for one you will not go unpunished.
translation:
  language: zh_hans
  text: 不要再犯一次罪[a]；因为即使只犯一次罪，你也不能免受惩罚[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“不要把罪捆绑两次”或“不要再次捆绑罪”；希腊语平行文本也有“不要把罪捆绑两次”。这一“捆绑”的意象确切如何起作用并不完全确定；这里按语境译为不要再次犯罪或在原有的罪上加罪。
    reason: 保留希伯来语和希腊语的“捆绑”意象、第二次的限定及该表达的语义不确定性。
  - marker: b
    text: 也可译作“你不能获判无罪”或“你不能洗脱罪责”。原文既可表示不能逃过惩罚，也可带司法上的无罪或清白之意。
    reason: 保留末句在惩罚含义与司法含义之间的词义张力。
lexical_decisions:
- source_word: אַל
  choice: 不要
  rationale: 这是希伯来语常见的否定禁令；“不要”直接、自然地传达劝诫语气。
- source_word: תִּקְשׁוֹר לְשָׁנוֹת
  choice: 把……一犯再犯
  rationale: תִּקְשׁוֹר 的本义是“捆绑、系住”，לְשָׁנוֹת 表示“重复、再做一次”。直译在现代汉语中难以理解，因此正文用“一犯再犯”表达反复加添罪行的警告，同时在脚注保留原文的捆绑意象及其不确定性。
- source_word: חֵטְ
  choice: 罪
  rationale: 该词可指罪、过犯；希腊语平行文本也用 ἁμαρτία。“罪”简洁明确，并保留原文的道德和神学分量。
- source_word: כִּי
  choice: 因为
  rationale: 引出前一禁令的理由，符合现代汉语的因果表达。
- source_word: בְאַחַת
  choice: 即使只犯一次
  rationale: 原文简略作“在一次之中／就一件而言”，希腊语也有相同结构；结合上下文，指哪怕只有一次或一项罪，也不能逃避追究。“即使”传达其强调意味。
- source_word: לֹא תִנָּקֶה
  choice: 不能免受惩罚
  rationale: נקה 的被动词形可表示“被判无罪、得以清白”或“免受惩罚”。正文采用符合智慧训诫语境的惩罚义，司法性的含义则收入脚注。
theological_decisions:
- issue: 末句应采用司法性的“不能获判无罪”，还是后果性的“不能免受惩罚”
  choice: 不能免受惩罚
  alternative: 不能获判无罪／不能洗脱罪责
  rationale: 本节警告人不要重复犯罪，语境侧重罪不会不受追究；但希伯来语 נקה 和希腊语 ἀθῷος 都可带司法意味，因此不把另一含义排除，而在脚注中保留。
- issue: 首句的“捆绑”意象是否应直译
  choice: 正文按语义译作“把罪一犯再犯”
  alternative: 不要把罪捆绑两次／不要系住自己去再次犯罪
  rationale: 希伯来语和希腊语都保留“捆绑”一词，但这一搭配的确切作用并不完全明朗；机械直译会使普通读者误解。正文表达明确的重复犯罪之意，脚注说明字面形式，避免把文本的不确定性隐藏起来。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体。“把罪一犯再犯”比生硬的“捆绑罪两次”更符合现代标准汉语，同时由脚注保存原文意象和歧义；分号维持原文简洁紧密的禁令—理由结构。
