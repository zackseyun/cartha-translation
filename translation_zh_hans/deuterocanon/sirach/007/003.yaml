  text: Do not seek authority from God[a], nor from the king a seat of honor.
translation:
  language: zh_hans
  text: 不要向上帝求权柄[a]，也不要向君王求尊位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证在这里是另一句格言：“孩子，不要在不义的犁沟里撒种，你就不会收割七倍。”正文依据本节现存的希伯来文见证。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: 不要求
  rationale: בקש 可指寻求、请求或企求；“不要求”在此既保留向某人求取的方向，也自然表达对权位的企求。
- source_word: מֵאֵל
  choice: 向上帝
  rationale: אֵל 在此是对上帝的一般称呼；译作“上帝”清楚自然，不增添原文没有的特殊神名或称号。
- source_word: מֶמְשֶׁלַת
  choice: 掌权
  rationale: ממשלה 指统治、管辖或权柄；“掌权”既保留治理权力的动态含义，又适合本节劝诫人不要企求权位的语境。
- source_word: וְכֵן
  choice: 也不要
  rationale: 字面为“同样、也如此”；承接前面的禁令，译作“也不要”准确呈现两句平行的否定结构。
- source_word: מִמֶּלֶךְ
  choice: 向君王
  rationale: מן 表示来源，结合“求”在汉语中的配价，自然译作“向……求”；单数“君王”可作泛指。
- source_word: מוֹשַׁב כָּבוֹד
  choice: 尊位
  rationale: מוֹשב 可指座位、席位或职位，כבוד 表示尊荣；“尊位”简洁保留受君王赐予显要席位或职位的含义，而不把意象限定为普通座席。
theological_decisions:
- issue: 本节希伯来文与希腊文见证的关系
  choice: 正文依据现存希伯来文，译为不可向上帝求掌权、也不可向君王求尊位。
  alternative: “孩子，不要在不义的犁沟里撒种，你就不会收割七倍。”
  rationale: 《便西拉智训》有希伯来文存世之处，优先依据希伯来文。此处希腊文保存的是内容明显不同的格言，不能与希伯来文静默调和，因此将其完整保留在异文脚注中。
translation_notes:
  register: 采用现代、庄重而简明的劝诫语体。“掌权”与“尊位”构成自然的平行表达；脚注明示重大文本异读，不予调和。
