  text: Do not mistreat a faithful servant[b][a], nor a hired laborer who gives himself.
translation:
  language: zh_hans
  text: 不可苛待忠实做工的人[a]，也不可苛待全心投入的雇工[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近于“做真实之工的人”；希腊语作“按真实做工的家仆”。这里指做工忠实、诚实的人。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来语措辞较难确定；希腊语平行文本作“献出自己生命的雇工”，支持这里译为“全心投入的雇工”。此处强调其投入、耗费自身，并非必指实际死亡。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרֵעַ
  choice: 不可苛待
  rationale: 希伯来语动词表示加害、恶待；希腊语 μὴ κακώσῃς 也支持“苛待、伤害”。“苛待”在劳作关系的语境中自然明确。
- source_word: עוֹבֵד אֱמֶת
  choice: 忠实做工的人
  rationale: 原文直译近于“真实／忠信的做工者”；希腊语为“按真实做工的家仆”。此处译作“忠实做工的人”，既保留其诚实可靠的伦理含义，也不把身份过早限定为家仆。
- source_word: וְכֵן
  choice: 也不可
  rationale: 该连接语引出与前句并列的禁令；汉语以“也不可”自然承接前面的否定命令。
- source_word: שׁוֹמֵר
  choice: 雇工
  rationale: 现存希伯来语读法在此较难解释，若按字面可指看守者；希腊语平行文本明确作 μίσθιον，即受雇领薪的人，因此正文采用“雇工”。
- source_word: נוֹחֵן נַפְשׁוֹ
  choice: 倾尽自己
  rationale: 传抄下来的希伯来语措辞困难；希腊语 διδόντα ψυχὴν αὐτοῦ 意为“献出自己的性命／自身”。“倾尽自己”保留全心投入、耗费自身的力度，又避免让现代读者误以为必然指实际死亡。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“忠实做工的人”避免把 עוֹבֵד 过度限定为奴仆；“倾尽自己”保留 נַפְשׁוֹ／ψυχή 所表达的全人投入，同时在汉语中比“献出生命”更符合劳动语境。
