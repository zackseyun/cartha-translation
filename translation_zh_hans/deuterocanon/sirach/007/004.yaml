  text: Do not justify yourself before a king[a], and do not show understanding before a king.
translation:
  language: zh_hans
  text: 不要在君王面前自称有理[a]，也不要在君王面前卖弄聪明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“不要向主求统治权，也不要向君王求荣耀的座位。”这里正文所依据的希伯来文见证与希腊文差异很大。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְטַדֵּק
  choice: 不要……自称有理
  rationale: אַל引出禁止；צדק的Hitpael形式带反身意味，指把自己说成正当、有理。“自称有理”既保留反身语气，也避免把经文限定为内心的自义或法庭上的申辩。
- source_word: לִפְנֵי מֶלֶךְ
  choice: 在君王面前
  rationale: 准确表达处于王的面前或当着王的面；希伯来文没有冠词，中文用泛指的“君王”自然呈现。
- source_word: וּמִפְּנֵי מֶלֶךְ
  choice: 也不要在君王面前
  rationale: 按两分句的紧密平行关系理解为同一场合，并在中文中重复该短语，以保留原文的修辞结构。
- source_word: תִּתְבּוֹנֵן
  choice: 卖弄聪明
  rationale: 该形式源自בין；在这里结合君王面前的社交处境，不只是内在思考，而是显出自己有见识、聪明。“卖弄聪明”自然表达这种带警戒意味的自我展示。
theological_decisions:
- issue: 希伯来文与希腊文见证显著不同
  choice: 以现存希伯来文为正文，译作不要在君王面前自称有理或卖弄聪明。
  alternative: 希腊文作：“不要向主求统治权，也不要向君王求荣耀的座位。”
  rationale: 本节有可信度高的希伯来文见证，应以希伯来文为主要来源；希腊文反映了意义显著不同的文本形态，因此在脚注中完整保留，而不据此改写正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自称有理”保留反身性的自我正当化，“卖弄聪明”传达在君王面前刻意显示见识的警戒意味；重复“在君王面前”以呈现希伯来诗句的平行结构。
