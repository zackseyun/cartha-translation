translation:
  language: zh_hans
  text: 不可图谋加害弟兄；对朋友和同伴也不可如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּחֲרוֹשׁ
  choice: 不可图谋
  rationale: 字面意象是“不可耕作”，在此引申为暗中筹划；“图谋”自然、凝练，并保留蓄意策划的意味。
- source_word: חָמָס
  choice: 伤害
  rationale: 该词可指暴力、恶行或不法侵害；“伤害”在本句中涵盖面较宽，不把含义限缩为身体暴力。
- source_word: אָח
  choice: 弟兄
  rationale: 可指亲兄弟，也可泛指同胞或群体中的弟兄；“弟兄”保留这种关系用语的开放性。
- source_word: רֵעַ וְחָבֵר
  choice: 朋友和同伴
  rationale: 分别对应亲近之人和相伴之人，保留原文并列而不合并。
- source_word: וְכֵן ... יַחְדָּו
  choice: 也不可同样对待……
  rationale: 将“同样如此”自然地接续前一禁令；末词“יַחְדָּו”在此可能强调并列涵盖，中文不另加生硬的“一同”。
theological_decisions:
- issue: חָמָס 的范围
  choice: 伤害
  alternative: 暴力
  rationale: 希伯来文范围可超过直接的身体暴力；采用较宽的“伤害”，避免无根据地限缩伦理禁令。
- issue: אָח 的关系范围
  choice: 弟兄
  alternative: 兄弟
  rationale: “弟兄”既可用于血缘，也能保留共同体关系的可能性，不替原文裁定具体范围。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体；句式简洁，并保留“弟兄—朋友—同伴”的关系层次。
