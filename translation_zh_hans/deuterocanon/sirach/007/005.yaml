base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/005.yaml
  text: Do not seek to become a ruler if you have no strength to put an end to insolence[a].
translation:
  language: zh_hans
  text: 不要谋求做统治者；如果你没有能力制止狂妄之举。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“不要在主面前自称为义，也不要在君王面前卖弄聪明。”这反映了本节一种实质不同的文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: 不要谋求
  rationale: 否定命令中的 בקש 表示寻求、追求；“谋求”自然地体现对统治地位的主动追求。
- source_word: לִהְיוֹת מוֹשֵׁל
  choice: 做统治者
  rationale: מושל 指掌权或治理的人；“做统治者”保留身份意味，也符合现代汉语表达。
- source_word: חַיִל
  choice: 能力
  rationale: חיל 可指力量、才干或资源；此处谈治理所需的实际胜任能力，“能力”比单指体力的“力量”更宽泛。
- source_word: לְהַשְׁבִּית
  choice: 制止
  rationale: שבת 的使役式表示使某事停止；“制止”简洁表达治理者遏止不当行为的行动。
- source_word: זָדוֹן
  choice: 狂妄之举
  rationale: זדון 涵盖骄横、僭越和出于狂妄的恶行；加上“之举”保留其可被治理者制止的行为性，而不只指内心态度。
- source_word: μὴ δικαίου ἔναντι Κυρίου, καὶ παρὰ βασιλεῖ μὴ σοφίζου
  choice: 仅作为次要校勘参照，不用于正文
  rationale: 希腊文本与现存希伯来文本差异显著，可能反映不同底本或较大的文本演变；现存希伯来文在本节作为正文依据，希腊异文收入脚注。
theological_decisions:
- issue: 《德训篇》7:5希伯来文本与希腊文本的显著分歧
  choice: 正文翻译现存希伯来文本
  alternative: 按希腊文译作：“不要在主面前自称为义，也不要在君王面前卖弄聪明。”
  rationale: 本节有可靠的现存希伯来文，故以其为正文；希腊文呈现实质不同的经文形态，应在脚注中完整保留，以免掩盖文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“统治者”准确对应治理者身份；“狂妄之举”兼顾道德上的骄横与外在行为。正文中的[a]与脚注对应。
