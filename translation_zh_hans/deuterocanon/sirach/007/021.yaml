    rationale: 希伯来文仅命令不可扣留其自由，并未使用“应得、应当”一类词语。译文应保留这种简约性。
  - severity: low
    issue: 脚注“好的奴隶”表达不够自然。
    rationale: 希腊文 ἀγαθός 用于人物时，汉语通常译作“善良的”或“好的”；“善良的奴隶”更明确自然。
  revised_text: 要像爱自己一样爱有见识的奴隶[a]；不可拒绝给他自由。
