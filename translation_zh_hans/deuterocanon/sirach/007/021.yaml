  text: Love an intelligent servant as yourself[a], and do not withhold freedom from him.
translation:
  language: zh_hans
  text: 要像爱自己一样爱有见识的奴隶[a]；不可拒绝给他自由。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“有见识的”；希腊文平行文本作“善良的”。
    reason: alternative_reading
lexical_decisions:
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 该词可指仆人或奴隶；下半句明确谈到给予自由，表明其受奴役身份在此十分突出，因此译作“奴隶”，不以较弱的“仆人”淡化原文。
- source_word: מַשְׂכִּיל
  choice: 有见识的
  rationale: 该分词描述有理解力、行事明智的人。“有见识的”在现代汉语中自然，也兼顾聪慧与明达之意；希腊文平行文本作“好的”，列入脚注。
- source_word: חַבֵּב
  choice: 要爱
  rationale: 这是表达珍爱、亲爱之意的命令式；“要爱”直接保留其伦理命令的力度，希腊文 ἀγαπάτω 也支持此义。
- source_word: כְּנֶפֶשׁ
  choice: 如同爱自己
  rationale: 字面近于“像（自己的）性命/自身”；在此表达以看待自身的珍爱来对待对方。“如同爱自己”符合现代汉语习惯，并保留原句的伦理力度。
- source_word: וְאַל תִּמְנַע
  choice: 不要扣留本该给他的
  rationale: מנע 表示拦阻、扣住或不给予。单译“不要剥夺”容易暗示对方已经享有自由；“不要扣留本该给他的”更清楚表达不可把自由留而不给。
- source_word: חֹפֶשׁ
  choice: 自由
  rationale: 该名词指脱离奴役、成为自由人的状态。“自由”清楚、现代，且避免使用过于技术性的“解放奴籍”。
theological_decisions:
- issue: 智慧训诲中 עֶבֶד 的社会身份
  choice: 奴隶
  alternative: 仆人
  rationale: 原句随后命令不可扣留其自由，使受奴役的法律与社会身份成为显著语境；故保留“奴隶”，避免以“仆人”弱化原文的张力。
- issue: כְּנֶפֶשׁ 所表达的比较对象
  choice: 如同爱自己
  alternative: 如同珍爱自己的性命
  rationale: 原文简约，可理解为像自己的生命或自身一样珍爱。正文采用自然汉语“如同爱自己”，脚注不强行扩展，以保留其习语性的开放程度。
translation_notes:
  register: 采用现代、庄重而直接的智慧文学训诫语体。“奴隶”明确呈现原文社会现实；“有见识的”避免生硬的“聪明的奴隶”。分号呈现两项紧密相连的命令。
