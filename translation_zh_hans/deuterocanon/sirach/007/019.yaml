  text: Do not despise an intelligent wife, for her graciousness is better than pearls.
translation:
  language: zh_hans
  text: 不要厌弃聪慧的妻子[b]；她的优雅胜过珍珠。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“不要错过一位有智慧而善良的女子，因为她的优雅胜过黄金。”希伯来文本在此作“珍珠”，也可理解为另一种珍宝。
    reason: alternative_reading
  - marker: b
    text: “聪慧的妻子”也可译作“明达的妻子”或“有智慧的女人”。希伯来语着重指洞察力和良好的判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: 不要厌弃
  rationale: מָאַס兼有拒绝、轻视和厌弃之意；“厌弃”既保留劝诫的力度，也适合婚姻关系语境。
- source_word: אִשָּׁה מַשְׁכֶּלֶת
  choice: 聪慧的妻子
  rationale: מַשְׁכֶּלֶת源于שׂכל，强调洞察力、明智和良好判断；“聪慧”比单纯的“聪明”更能涵盖这些含义。אִשָּׁה可指女人或妻子，结合本段家庭关系语境译作“妻子”。
- source_word: וְטוֹבַת חֵן
  choice: 她的温雅
  rationale: 希伯来语表达简练，חֵן可指恩宠、可爱之处、优雅或令人喜悦的品格。“温雅”在现代汉语中自然地指向宜人的品格与举止，避免仅理解为外貌魅力；“她的”依上下句关系补出，但不把含义限定为姿色。
- source_word: מִפְּנִינִים
  choice: 胜过珍珠
  rationale: פְּנִינִים指贵重宝物，可译珍珠、珊瑚、红宝石或宝石；“珍珠”是智慧文学语境中常见且可成立的译法。
theological_decisions:
- issue: אִשָּׁה在劝诫中的所指
  choice: 妻子
  alternative: 女人
  rationale: 该词本身可兼指女人与妻子；上下文涉及家庭和人际责任，因此正文采用较具体的“妻子”，并以脚注保留“女人”的可能。
- issue: וְטוֹבַת חֵן与前半句的关系
  choice: 理解为这位妻子的温雅
  alternative: 理解为独立而概括的“美好的恩宠”或“有恩宠的女子”
  rationale: 希伯来语措辞压缩，句法关系并非完全明说；结合阴性形式及希腊平行文本“她的恩宠”，正文采用自然的指代关系，但不作教义性延伸。
translation_notes:
  register: 采用简洁、庄重而现代的劝诫语体。“厌弃”“聪慧”“温雅”均为普通读者易懂的现代标准汉语；分号保留原句两个相连箴言分句的紧凑结构。
