  yaml_path: translation/deuterocanon/sirach/007/024.yaml
  text: Do you have daughters? Guard their chastity[a], and do not show them a cheerful face.
translation:
  language: zh_hans
  text: 你有女儿吗？要守护她们的身体，不要向她们和颜悦色。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“不要使你的脸向她们发光”。这里可能是说，不可对她们过分宽纵或迁就。
    reason: 说明希伯来文和希腊文共有的面容意象及其可能的习语含义。
lexical_decisions:
- source_word: בָּנוֹת לְךָ / θυγατέρες σοί εἰσιν
  choice: 你有女儿吗？
  rationale: 希伯来文是省略式的“女儿归你所有”，希腊文也用领有式存在表达；译作现代汉语问句，能自然传达随后的条件性劝诫。
- source_word: נְצוֹר / πρόσεχε
  choice: 要守护
  rationale: 希伯来文命令式表示看守、保守；希腊文平行文本有留心照管之意。“守护”兼顾保护与谨慎监管。
- source_word: שְׁאֵרָם / τῷ σώματι αὐτῶν
  choice: 她们的身体
  rationale: 希伯来词可指肉身、身体；希腊文明确译为“身体”。采用具体表达，不把原文进一步解释成“贞洁”，从而避免缩窄语义。
- source_word: וְאַל תָּאִיר אֲלֵיהֶם פָּנִים / καὶ μὴ ἱλαρώσῃς πρὸς αὐτὰς τὸ πρόσωπόν σου
  choice: 不要向她们和颜悦色
  rationale: 原文直译为“不要使脸向她们发光”，希腊文同样保留使脸显得欢悦的意象。汉语成语“和颜悦色”自然保留面容温和的具体图像，脚注说明其在本句中可能指不可过分宽纵。
theological_decisions:
- issue: 父母警戒的伦理力度
  choice: 保留关于面容的具体意象，并以脚注说明可能含义
  alternative: 不要纵容她们／不要娇惯她们
  rationale: 直接译成“纵容”会把隐含意义写入正文，并可能引入比原文更具体的教养观；保留意象可维持原文的伦理张力。
- issue: שְׁאֵרָם 的所指
  choice: 她们的身体
  alternative: 她们的贞洁
  rationale: 希腊平行文本明确支持“身体”；“贞洁”虽可能是语境中的实际关切，却属于解释性收窄，因此不放入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“和颜悦色”保留原文面容意象，但若脱离脚注可能被理解为禁止一般性的亲切，因此脚注明确指出其语境含义可能是避免过度宽纵。
