  text: Give a gift before every living person[a], and do not withhold kindness even from the dead.
translation:
  language: zh_hans
  text: 要在所有活人面前赠送礼物[a]；也不可向死者吝惜善意。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“不要不顾哭泣的人；要与哀悼的人一同哀悼。”这反映了本节一个内容差异显著的文本传统。
    reason: textual_variant
lexical_decisions:
- source_word: תֵּן מַתָּן
  choice: 送上礼物
  rationale: תֵּן是直接命令“给”，מַתָּן泛指礼物或赠礼。“送上礼物”在现代汉语中自然庄重，又不引入祭物等宗教礼仪含义。
- source_word: לִפְנֵי כָל חָי
  choice: 在每个活人面前
  rationale: לִפְנֵי直译为“在……面前”；保留这一空间或关系表达，不擅自改成明确的受益对象。“每个活人”保持与后文“死者”的鲜明对照。
- source_word: וְגַם מִמֵּת
  choice: 即使对死者，也
  rationale: וְגַם具有递进、附加的强调作用；结合מִמֵּת，在汉语中用“即使……也”自然呈现由活人延伸到死者的语势。介词在汉语中按施恩对象译为“对”。
- source_word: אַל תִּמְנַע
  choice: 不可停止
  rationale: מנע表示扣留、阻止或不再给予。这里与“施恩”搭配，“不可停止”清楚表达不得因对方已死而中断善待，同时不把具体行为限定得过窄。
- source_word: חָסֶד
  choice: 施恩
  rationale: חָסֶד在此指付诸行动的仁爱、善待或忠厚之举。“施恩”简洁庄重，可涵盖对死者应尽的安葬、追念等善意责任，而不强行赋予专门的盟约含义。
theological_decisions:
- issue: 希伯来文本与差异显著的希腊平行文本之间的关系
  choice: 正文以现存希伯来文为准，翻译赠礼与不停止向死者施恩的训诫。
  alternative: 希腊文作：“不要亏负哭泣的人，要与哀悼的人一同哀悼。”
  rationale: 本节希伯来文保存完整且可信度高，应作为正文依据。希腊文并非细微措辞差异，而代表内容明显不同的文本传统，因此在脚注中完整保留，不将两种读法混合。
- issue: 对死者“施恩”的具体所指
  choice: 保留宽泛的“施恩”，不在正文中限定为安葬、守丧或纪念。
  alternative: 译成“不要拒绝为死者安葬”或其他具体礼俗。
  rationale: 上下文可能使人联想到对死者的安葬及纪念义务，但חָסֶד本身范围更广；译文应保存这种开放性，避免加入原文没有明说的宗教或礼俗规定。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“在每个活人面前”有意贴近希伯来文，并保留其关系指向上的些许含混；分号突出“活人—死者”的对照。脚注标记[a]已置于正文相应位置。
