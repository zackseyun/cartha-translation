  text: Do not chatter in the assembly of rulers[b][a], and do not repeat a word in your prayer.
translation:
  language: zh_hans
  text: 不可在权贵的集会中喋喋不休[a]；祷告时，不可重复一句话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不要絮叨”或“不要说个没完”。希腊文平行文本同样告诫人，不要在长老中间闲谈过多。
    reason: lexical_alternative
  - marker: b
    text: 直译为“祷告时，不可把一句话说第二遍”。这可能是告诫人不要空洞、机械或冗余地重复，并不一定禁止一切重复的祈求。
    reason: alternative_reading
lexical_decisions:
- source_word: תְּסַוֵּר
  choice: 喋喋不休
  rationale: 结合希腊文对应词 ἀδολέσχει，此动词指闲谈过多、言语冗长，而不只是一般的“说话”；“喋喋不休”在现代汉语中自然地传达这种告诫。
- source_word: בַּעֲדַת
  choice: 在……的集会中
  rationale: עֵדָה 指聚集起来的群体或正式会众；“集会”既保留公共场合的意味，也符合现代汉语表达。
- source_word: שָׂרִים
  choice: 权贵
  rationale: שָׂרִים 指有地位、权柄的人，可包括首领、官长或统治者；“权贵”能表达其身份和权势，又不把范围限定为王室成员。
- source_word: תִּישֶׁן דָּבָר
  choice: 重复一句话
  rationale: 此希伯来语说法较为少见，但希腊文 μὴ δευτερώσῃς λόγον 明确支持“不要重复话语”的理解。“重复一句话”贴近原文，并保留其具体而略带张力的表述。
- source_word: בַּתְּפִלָּה
  choice: 祷告时
  rationale: 希伯来文直指祷告这一场合；“祷告时”是简洁自然的现代汉语。希腊文虽有“你的”，但希伯来文本未明示，故正文不补入所有格。
theological_decisions:
- issue: 后半句是否禁止一切重复祷告
  choice: 正文直译为“不可重复一句话”，不在正文中限定其范围；脚注说明语境可能针对空洞、机械或冗余的重复。
  alternative: 把正文解释性地译为“祷告时不要翻来覆去地说空话”，或理解为禁止任何形式的重复祈求。
  rationale: 希伯来文与希腊文都明确涉及话语的重复，但没有充分依据在正文中断定它禁止所有持续祈求，或只禁止某一种重复。直译并用脚注提示可能含义，可以保留原文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“权贵的集会”保留正式公共场合及参与者身份较高的意味；两个分句以分号连接，呈现希伯来智慧训诫的平行节奏。所有解释性限定均置于脚注，正文尽量贴近希伯来文，并以希腊文作为校验。
