review_pass:
  verdict: revise
  source_fidelity: 首句准确传达了“不要因/在显贵面前惧怕退缩”。但“让贿赂损害自己的正直”将希伯来文“置入/放入”及其直接宾语关系改写为“贿赂”主动造成损害，且把可指贪婪所得、不义之财的 בֶּצַע 限定为“贿赂”，解释性略强。
  naturalness: “在权贵面前畏缩”自然庄重；原第二分句也通顺，但“让贿赂损害”弱化了警告对象本身主动将不义之得混入正直之中的反讽性意象。改为“把不义之财掺进自己的正直里”在现代汉语中清楚、自然，并保留原文张力。
  terminology: “权贵”适切对应 נָדִיב 在此处的显贵、权势者。בֶּצַע 宜译为“不义之财”或“不正当的利益”，不应在正文中无保留地定为“贿赂”；“正直”适切对应 בִּתְמִימִיךָ。希腊文的“绊脚石”应保留于脚注，作为平行文本的不同读法。
  issues:
  - severity: medium
    issue: “贿赂”将 בֶּצַע 过度具体化。
    rationale: 该词主要指贪婪或不正当取得的利益；虽可在司法或权势语境中包含贿赂，却不必然专指贿赂。采用“不义之财”能保留原文的语义范围。
  - severity: low
    issue: “让贿赂损害”改变了原文的置入意象。
    rationale: וְנָתוּן 字面为“放置、置入”。以“把不义之财掺进自己的正直里”保留说话者主动使道德操守受污染的形象，同时中文可理解。
