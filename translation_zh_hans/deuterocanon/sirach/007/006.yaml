  text: Do not cower before a noble[a], lest you set a bribe against your integrity.
translation:
  language: zh_hans
  text: 不要在权贵面前畏缩，免得你把不义之财掺进自己的正直里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“免得你在自己的正直中设置绊脚石。”希伯来文所用词指贪婪所得或不义之财。
    reason: alternative_reading
lexical_decisions:
- source_word: תָגוּר
  choice: 畏缩
  rationale: 这里的 גור 表示面对有权势者时因惧怕而退缩；希腊文 εὐλαβηθῇς 也支持“受威吓、心存畏惧”的意思，而非一般性的害怕。
- source_word: נָדִיב
  choice: 权贵
  rationale: נדיב 在此指身份显赫、有权势的人；“权贵”既保留社会地位的含义，也与希腊文 δυνάστης（有权势者、统治者）相符。
- source_word: וְנָתוּן
  choice: 让……损害
  rationale: 字面义为“放置、置入”。汉语若直译为“把贿赂放在正直中”颇为生硬，因此按其道德破坏的意象译为“让……损害”，同时不改变因畏惧权贵而使正直受损的关系。
- source_word: בֶּצַע
  choice: 贿赂
  rationale: בצע 常指贪婪所得或不义之财；在面对权贵而可能枉法的语境中，“贿赂”自然地表达这种具体的腐败行为。
- source_word: בִּתְמִימִיךָ
  choice: 自己的正直
  rationale: תמים 一语在此表示道德上的纯正、正直；希腊文 ἐν εὐθύτητί σου 亦印证这一伦理含义。用“自己的正直”是自然、庄重的现代汉语。
theological_decisions:
- issue: 如何结合希伯来文 וְנָתוּן בֶּצַע בִּתְמִימִיךָ 与希腊文 καὶ θήσεις σκάνδαλον ἐν εὐθύτητί σου 翻译这一含混短语
  choice: 以现存希伯来文为主，译作因贿赂而损害自己的正直
  alternative: 依希腊文译作“在自己的正直中设置绊脚石”
  rationale: 希伯来文明确使用 בצע，通常带有贪婪所得或不义之财的意味；希腊文则较宽泛地描述使正直受阻。正文保留希伯来文较具体的腐败意象，并在脚注中注明希腊文异读，以免抹平文本差异。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“权贵”比“贵族”更能表达原文中地位与权势兼具的人；“畏缩”保留因受威吓而退让的意味。脚注标记置于整句末，说明希腊文平行文本与希伯来文的差异。
