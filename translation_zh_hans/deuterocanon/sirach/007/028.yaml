base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/028.yaml
  text: Remember that if not for them[a], you would not have come into the world[b]; and what can you do for them as they have done for you?
translation:
  language: zh_hans
  text: 要记住：若不是他们[a]，你就不会来到世上；你又能怎样回报他们，才与他们为你所做的相称呢？[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们”指上文所说的父母；原文在本节只用代词。
    reason: cross_reference
  - marker: b
    text: 希伯来文较直译可作：“你为他们做什么，像他们待你那样？”其中 גמל 可表示“对待、施予”或“报偿”。希腊文本则明确说：“你将拿什么回报他们？”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכוֹר
  choice: 要记住
  rationale: 这是动词 זכר 的命令式，要求人持续铭记；“要记住”直接、自然，也保留劝诫语气。
- source_word: לוּלֵי הֵם
  choice: 若不是他们
  rationale: לוּלֵי 表示反事实条件；“若不是他们”准确表达人的出生有赖于父母，也保留原文的代词形式。
- source_word: לֹא בָאתָ לָעוֹלָם
  choice: 你就不会来到世上
  rationale: 按希伯来文直译为“来到世上”，在上下文中指经由父母出生；此译法既自然，又比直接译作“出生”更贴近原文措辞。
- source_word: וּמָה אַתָּה עוֹשֶׂה לָהֶם
  choice: 你又能拿什么回报他们
  rationale: 希伯来文表面为“你为他们做什么”，但与后句 גמל 相连构成关于报答的反问；希腊平行文本 ἀνταποδώσεις 也明确表达“回报”。加入“能”传达这种反问所含的难以报偿之意。
- source_word: שֶׁהֵם גּוֹמְלִים לָךְ
  choice: 像他们为你所做的那样
  rationale: גמל 可指对待、施予或报偿。这里结合父母的语境和希腊文 καθὼς αὐτοί σοι，译文保留比较关系，不把父母所做之事进一步限定为某一种恩惠。
theological_decisions:
- issue: “他们”的所指
  choice: 正文保留“他们”，由上下文指向父母
  alternative: 在正文直接译成“你的父母”
  rationale: 本节上下文谈论父母，但希伯来文和希腊文在本句都只用代词。保留代词既忠于原文形式，也由脚注帮助独立阅读者确认所指。
- issue: 子女是否能够等量报答父母
  choice: 以反问表达难以相称回报，而不把“不可能”明说为绝对命题
  alternative: 译成“你绝不可能报答他们”
  rationale: 原文提出比较性的反问，强调父母之恩难以回报，却没有直接陈述一个绝对的教义判断；因此保留其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“来到世上”保留希伯来文意象；后半句使用自然的汉语反问，同时借脚注呈现希伯来文的词义宽度及希腊平行文本的明确“回报”措辞。
