base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/026.yaml
  text: Do not despise a wife who is yours[a], and do not trust one you hate.
translation:
  language: zh_hans
  text: 你有妻子，不要厌弃她[a]；你所恨的女子，不要信任她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“你有合心意的妻子吗？不要休弃她。”现存希伯来文本与希腊文本在本节有明显差异，因此正文依从希伯来见证，并在此保留希腊异文。
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה לְךָ
  choice: 你有妻子
  rationale: אִשָּׁה 可指“女子”或“妻子”；与表示所属关系的 לְךָ 连用时，最自然地指听者自己的妻子。译为“你有妻子”既保留希伯来语简洁的存在、所属表达，也符合现代汉语习惯。
- source_word: אַל תְּתַעֲבֶהָ
  choice: 不要厌弃她
  rationale: תעב 表示强烈厌恶、拒斥。“厌弃”兼有憎恶与排斥之意，适合本节的婚姻关系语境，又不把希腊文本的“休弃/赶走”直接混入希伯来正文。
- source_word: וּשְׂנוּאָה
  choice: 你所恨的女子
  rationale: 该形式可作“被恨的女子”理解，但上下文更自然地指听者所恨的女子。“你所恨的女子”保留关系性的含义，同时没有断言她受其他人憎恨。
- source_word: אַל תַּאֲמֵן בָּהּ
  choice: 不要信任她
  rationale: אמן 的使役式与介词 ב 连用，可表示信任、信赖。“不要信任她”直接对应希伯来语，又是自然清楚的现代汉语。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本明显不同
  choice: 正文依从现存希伯来见证，并在脚注保存希腊异文
  alternative: 按希腊文本译作：“你有合心意的妻子吗？不要休弃她。”
  rationale: 本节有可靠的希伯来见证，因此正文以希伯来语为主要依据；但希腊文本在第一分句的修饰语和命令措辞上均不同，并且没有希伯来文本的第二分句，差异具有文本批判价值，故不应默默调和。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“厌弃”体现希伯来动词的强烈拒斥意味；分号保留两项并列劝诫的智慧文学节奏。脚注标记[a]已置于与异文相关的第一分句之后。
