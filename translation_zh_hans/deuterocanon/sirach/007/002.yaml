base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/002.yaml
  text: Do not sow furrows of injustice against a brother[b][a], lest you reap it sevenfold.
translation:
  language: zh_hans
  text: 不要针对弟兄，在不义的犁沟中撒种，免得你七倍地收割所播的不义[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作“收割他／它”；这个宾语后缀单独来看有所歧义。正文按播种与收割的意象，将其理解为所播下的“不义”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文保存了较概括的另一种说法：“离开不义，它也必离开你。”这反映的格言形式与现存希伯来文本不同。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְרַע
  choice: 不要……撒种
  rationale: אַל加未完成式表达禁令；“撒种”保留明确的农业比喻，并与后半句“收获”呼应。
- source_word: חֲרוּשֵׁי עָוֶל
  choice: 不义的犁沟
  rationale: חֲרוּשֵׁי与耕犁土地有关；译作“犁沟”保留原文较为奇特的农耕意象，不将其泛化为“恶行”。עָוֶל译为“不义”，兼顾道德错误与人际不公。为使现代汉语自然，将整句处理为“在不义的犁沟中撒种”。
- source_word: עַל אָח
  choice: 针对弟兄
  rationale: עַל在此有敌对、加害的方向；“针对”比直译“在……之上”自然。“弟兄”保留אָח的男性单数形式，不擅自补入原文没有的“你的”。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达智慧训诲中警告可能后果的语气，简洁而庄重。
- source_word: תִּקְצְרֵהוּ
  choice: 收获这不义
  rationale: 动词延续前半句农耕比喻。宾语后缀在孤立形式下可有歧义；正文按播种—收获的对应关系，将其理解为所播下的“不义”，并以脚注保留歧义。
- source_word: שִׁבְעָתָיִם
  choice: 七倍地
  rationale: 保留希伯来语数字强化表达，表示所得后果成倍而来，不把“七”解释性改写为笼统的“许多倍”。
theological_decisions:
- issue: תִּקְצְרֵהוּ中宾语后缀的所指
  choice: 将宾语理解为先前播下的“不义”：七倍地收获这不义。
  alternative: 可孤立地理解为指“弟兄”，即“七倍地收割他”；希腊文本则保存了另一种说法：“离开不义，它也必离开你。”
  rationale: 希伯来语中的播种—收获意象最自然地支持宾语指向所播之物，但后缀本身并未消除全部歧义。希腊见证与现存希伯来文本差异明显，因此正文以希伯来文本为主，并用脚注记录两项文本与释义问题，避免抹平张力。
translation_notes:
  register: 采用现代、庄重而可理解的智慧文学语体。“不义的犁沟”刻意保留原文不寻常的农业意象；通过“在……中撒种”调整汉语句法，使表达自然，同时维持“撒种—收获”的结构。脚注标记均已置于正文，且按所注内容分别放在对应分句之后。
