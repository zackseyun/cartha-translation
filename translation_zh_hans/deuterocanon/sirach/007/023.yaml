  text: Do you have sons? Discipline them[a], and get wives for them in their youth.
translation:
  language: zh_hans
  text: 你有儿子，就要管教他们[a]；趁他们年轻时，为他们娶妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“你有孩子吗？要管教他们，使他们从小就低下颈项。”希伯来文本则作：“……趁他们年轻时，为他们娶妻。”
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: 儿子
  rationale: 希伯来语阳性复数在此指儿子；下句“为他们娶妻”也表明这里特指男性子女，而非泛指孩子。
- source_word: יַסֵּר
  choice: 管教
  rationale: יסר兼有纠正、教导和训练之意；“管教”在现代汉语中自然，并保留纠正性教养的含义。
- source_word: וְשָׂא לָהֶם נָשִׁים
  choice: 为他们娶妻
  rationale: 这一希伯来语表达指为儿子促成或安排婚姻；“为他们娶妻”简洁自然，也保留父母参与婚配的文化语境。
- source_word: בִּנְעוּרֵיהֶם
  choice: 趁他们年轻
  rationale: 该短语表示在他们年轻之时；此译法在汉语中自然，并清楚修饰娶妻的吩咐。
theological_decisions:
- issue: 希伯来文本与希腊平行文本下半节不同
  choice: 正文依希伯来文本译作“趁他们年轻，为他们娶妻”
  alternative: 依希腊文本译作“从小就使他们低头顺服”
  rationale: 现存希伯来见证在此完整、语意连贯，故正文以其为准；希腊文本反映明显不同的底本或传承，放入脚注以保留文本差异，不加以调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你有儿子，就要……”比直译成问句更符合希伯来语条件式表达在汉语中的自然用法；脚注明确呈现希腊与希伯来文本的显著差异。
