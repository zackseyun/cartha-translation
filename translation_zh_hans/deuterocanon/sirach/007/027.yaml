  text: With all your heart honor your father[a], and do not forget the labor pains of your mother.
translation:
  language: zh_hans
  text: 你要全心尊敬父亲，也不要忘记母亲生你时所受的痛苦。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句很简练，直译近似“不要忘记生你的母亲”；希腊平行文本则明确作“不要忘记你母亲分娩的痛苦”。
    reason: 说明希伯来主要文本的简练措辞，以及正文采用希腊平行文本加以明确的依据。
lexical_decisions:
- source_word: בְּכָל לִבְּךָ
  choice: 全心
  rationale: 保留“用全部的心”这一希伯来语惯用表达，指真诚而毫无保留的态度；“全心”在现代汉语中简洁自然。
- source_word: כַּבֵּד
  choice: 尊敬
  rationale: כבד在亲子关系中表示给予应有的分量与尊荣。“尊敬”既符合现代汉语习惯，也与尊敬父母的圣经用语一致。
- source_word: לְאָבִיךָ
  choice: 父亲
  rationale: 按希伯来文直译亲属称谓；汉语在劝诫句中可自然省略“你的”，而不改变所指。
- source_word: וְאֵם יוֹלַדְתְּךָ
  choice: 母亲生你时
  rationale: 希伯来文直指“生你的母亲”。译文以“母亲生你时”保留生育关系，并与后面的生产痛苦自然衔接。
- source_word: אַל תִּשֶּׁה
  choice: 不要忘记
  rationale: 希伯来文末句十分简练；希腊平行文本的μὴ ἐπιλάθῃ明确支持“不要忘记”。
- source_word: μητρὸς ὠδῖνας
  choice: 母亲生你时所受的痛苦
  rationale: 希腊文明确指母亲的分娩之痛。此译法比“产痛”更通俗自然，同时保留生产时受苦的具体含义。
theological_decisions:
- issue: 希伯来主要文本与希腊平行文本在末句详略不同
  choice: 以希伯来文为主要依据，并采用希腊平行文本所明确表达的“母亲分娩之痛”来译出压缩的末句。
  alternative: 仅按希伯来文译作“不要忘记生你的母亲”，不明说分娩的痛苦。
  rationale: 现存希伯来文的表达简练，句义可能是不要忘记生育自己的母亲；希腊平行文本则明确提出母亲的分娩之痛。正文采用希腊文本提供的具体含义，脚注说明文本差异，避免掩盖原始见证之间的张力。
translation_notes:
  register: 采用现代、庄重而通俗的劝诫语体。“全心尊敬”简洁有力；“生你时所受的痛苦”避免古雅的“劬劳”或较临床化的术语，使普通读者容易理解。
