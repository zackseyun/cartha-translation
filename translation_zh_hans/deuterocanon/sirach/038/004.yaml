  text: The Lord created medicines from the earth[b][a], and a sensible man will not despise them.
translation:
  language: zh_hans
  text: 上帝使药物从地里生出[a]；明理的人不会厌弃它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本的这个词形较难确定，可能指“使……生出”；希腊文本作“主从地里创造了药物”。
    reason: textual_variant
lexical_decisions:
- source_word: אל
  choice: 上帝
  rationale: 希伯来文直接以“神、上帝”为主语；希腊平行文本作“主”。正文优先反映高可信度的希伯来文本。
- source_word: מארץ
  choice: 从地里
  rationale: 介词与“地、土地”连用，表示药物的来源；“从地里”自然地表达由土地生出的意思。
- source_word: מצוציא
  choice: 使……生出
  rationale: 此词形在抄本传统中疑难，可能表达使某物出来或产生。译作“使……生出”贴近可辨认的希伯来语使役含义，也与希腊文“创造”的总体意思相合而不把疑难过度确定化。
- source_word: תרופות
  choice: 药物
  rationale: 指用于医治的药或疗法；“药物”在现代汉语中明确、自然，并适合本节语境。
- source_word: גבר מבין
  choice: 明理的人
  rationale: גבר指成年男子或人，מבין指有理解力、能辨明事理者。“明理的人”保留其智慧与判断力的重点，同时符合现代汉语表达。
- source_word: אל ימאס בם
  choice: 不会厌弃它们
  rationale: מאס表示厌弃、拒绝或轻视；这里作为一般性陈述，译为“不会厌弃”保留评价色彩。
theological_decisions:
- issue: 神圣主语：希伯来文 אל 与希腊文 Κύριος
  choice: 上帝使药物从地里生出
  alternative: 主从地里创造了药物
  rationale: 高可信度的希伯来来源以 אל 为主语，通常意为“上帝”；希腊平行文本则作“主”。正文依希伯来文译“上帝”，脚注说明希腊异文，二者都表达药物源于神的供应。
- issue: 疑难词 מצוציא 的动作含义
  choice: 使……生出
  alternative: 创造了
  rationale: 希伯来词形存在文本困难，但可见使其出来、产生的方向；希腊文 ἔκτισεν 明确支持“创造”。正文采用较贴近希伯来形态且保留张力的表达，脚注交代希腊佐证。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从地里生出”保持土地作为药物来源的具体意象；分号使两小句之间的因果与劝诫关系清楚。
