  text: My son[a], shed tears for the dead, be bitter, and begin the lament.
translation:
  language: zh_hans
  text: 我儿，要为死者流泪，痛苦悲伤，唱起哀歌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为“痛苦悲伤，并……哀歌”；现存希伯来语末一个动词的意思较难确定。希腊语平行文本作“像遭受极大痛苦的人那样，开始哀哭”，支持这里“唱起哀歌”的译法。
    reason: textual_variant
lexical_decisions:
- source_word: בני
  choice: 我儿
  rationale: 这是带第一人称单数后缀的单数呼语；“我儿”保留了智慧教诲中长者对受教者亲切而郑重的称呼。
- source_word: על המת
  choice: 为死者
  rationale: 介词短语表示哀悼所针对的对象或缘由；“为死者”符合现代汉语表达。
- source_word: הזיב דמעה
  choice: 流泪
  rationale: 希伯来语字面为“使眼泪流下”，希腊语平行文本也支持哭泣的命令；“流泪”简洁自然。
- source_word: התמרר
  choice: 悲痛不已
  rationale: 该反身词形表达进入深切、苦涩的哀痛状态；“悲痛不已”在现代汉语中自然地传达强烈悲伤，而不把“苦”误解为怨愤。
- source_word: וגהה קינה
  choice: 唱起哀歌
  rationale: קינה指正式的哀歌；现存希伯来语中的动词词形难解，希腊语平行文本明确支持“开始哀歌”的意思。“唱起哀歌”保留这一动作，并以自然汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我儿”保留《便西拉智训》的教诲语气；全句使用直接命令式，并以脚注交代末一动词的文本困难。
