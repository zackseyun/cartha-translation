  text: So the smith sits near the anvil and studies the raw iron; the vapor of the fire wastes his flesh, and he struggles with the heat of the furnace.
translation:
  language: zh_hans
  text: 同样，铁匠坐在铁砧旁，专心察看未经锻打的铁[a]；炉火的热气灼耗他的肉体[b]，他在熔炉的炽热中挣扎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未加工的铁”。希腊语形容词可指闲置或尚未做工的状态。
    reason: lexical_alternative
  - marker: b
    text: 直译“熔化他的肉体”。这里描写炉火热气对身体的损耗。
    reason: lexical_alternative
lexical_decisions:
- source_word: χαλκεύς
  choice: 铁匠
  rationale: 该词泛指金属工匠；本节明确提到铁，因此现代汉语用“铁匠”最自然，也符合具体语境。
- source_word: ἐγγὺς ἄκμονος
  choice: 在铁砧旁
  rationale: 准确表达工匠靠近铁砧而坐的空间关系，并采用现代汉语常用术语。
- source_word: καταμανθάνων
  choice: 专心察看
  rationale: 该分词含仔细观察、深入留意之意；“专心察看”既表现持续专注，又避免“研究”过于学术化。
- source_word: ἀργῷ σιδήρῳ
  choice: 未经锻打的铁
  rationale: ἀργός在此最可能指尚未加工，而不是“闪亮”；“未经锻打”结合铁匠语境，清楚呈现铁仍待加工的状态。
- source_word: ἀτμὶς πυρός
  choice: 炉火的热气
  rationale: ἀτμίς指蒸气、气息或散发之气；此处译作“热气”符合炉火场景，同时不与后文直接表示高温的θέρμη完全等同。
- source_word: τήξει σάρκας αὐτοῦ
  choice: 熔蚀他的肌体
  rationale: τήξει字面是“熔化”，以“肌体”为宾语时描写炉火对身体的侵蚀。“熔蚀”保留熔化意象，又不至于令人误解为身体真的液化。
- source_word: ἐν θέρμῃ καμίνου
  choice: 在熔炉的高温中
  rationale: καμίνος在金属加工语境中宜译“熔炉”；“高温”自然表达θέρμη所指的强烈热力。
- source_word: διαμαχήσεται
  choice: 奋力苦干
  rationale: 该动词有争斗、抗争之意；在劳动场景中，“奋力苦干”表现工匠在炉温中持续搏斗般劳作的强度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。保留原文两个不同的热力意象：“炉火的热气”对应ἀτμὶς πυρός，“熔炉的高温”对应θέρμη καμίνου；分号保持原句对工匠工作状态与身体劳苦的并列描写。
