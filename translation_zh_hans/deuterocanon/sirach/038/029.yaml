lexical_decisions:
- source_word: φωνὴ
  choice: 响声
  rationale: 与“锤子”连用时，指锤打所发出的声音；“响声”比“声音”更能体现工坊中的敲击声。
- source_word: σφύρης
  choice: 锤子
  rationale: 这是该工具最直接、通行的现代汉语名称，属格表示声音的来源。
- source_word: καινεῖ
  choice: 敲击着
  rationale: 此动词在本句中的用法较难确定；结合“锤子的响声”和“耳朵”，译为声音持续冲击听觉，既传达锤打的反复效果，也避免生硬地直译为“更新”。
- source_word: τὸ οὖς αὐτοῦ
  choice: 他的耳朵
  rationale: 依照希腊文保留单数和具体的身体意象；现代汉语在此用单数自然可懂。
- source_word: κατέναντι
  choice: 注视着
  rationale: 该词本义为“在……面前／对着”；与“眼睛”连用时，译作“注视着”自然表达工匠持续面对并察看所制物件。
- source_word: ὁμοιώματος
  choice: 形样
  rationale: 此词可指形状、样式或仿照的形像。“形样”保留“形”与“样”的开放性，不把它限定为外在的设计图或独立模型。
- source_word: σκεύους
  choice: 器皿
  rationale: 在工匠制作的语境中，可指所制成的器物或容器；“器皿”简洁、庄重，也保留其类别上的宽泛性。
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: 他的眼睛
  rationale: 直译以保留经文中耳朵与眼睛相互对应的具体感官意象。
