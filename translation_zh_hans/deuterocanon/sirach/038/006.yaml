revisions:
- from: 他赐给世人悟性[a]，使人因他的威能而夸耀[b][c]。
  to: 他赐给世人悟性[a]，使人以他的威能为荣[b][c]。
  rationale: 仅作汉语表达的低风险调整：以“以他的威能为荣”替换“因他的威能而夸耀”。此改法更自然，并更贴近“在／以其大能中夸耀”的句法关系；仍保留原文关于夸耀、荣耀、引以为荣的语义张力，也不预断“他的”必定指向谁。脚注标记均保留并与其所说明的词语对应。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:47:10Z'
