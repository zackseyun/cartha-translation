  text: And he gave man understanding[c][b][a], to glory in his might.
translation:
  language: zh_hans
  text: 他赐给世人悟性[a]，使人以他的威能为荣[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”也可译作“人”或“必死之人”；希伯来语在这里是集合性的泛指。
    reason: lexical_alternative
  - marker: b
    text: “以……为荣”也可译作“夸耀”或“自豪”；原文既可表达夸口，也可表达欢然引以为荣。
    reason: lexical_alternative
  - marker: c
    text: “他的威能”通常理解为上帝的威能；希腊语平行文本作“他的奇妙之事”。希伯来语也可按形式理解为世人的能力，但上下文较不支持这一解读。
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן
  choice: 他赐给
  rationale: 希伯来语是叙事性的过去时表达，希腊语 ἔδωκεν 也印证“赐给”；中文用“赐给”符合上帝施予悟性的语境。
- source_word: לאנוש
  choice: 世人
  rationale: אֱנוֹשׁ 指人或必死的人，在这里具有集合、泛指意义；希腊语复数 ἀνθρώποις 也支持泛指人类。
- source_word: בינה
  choice: 悟性
  rationale: בִּינָה 的核心义是理解力、辨识力；“悟性”自然凝练，并切合上下文中人认识医治之道的能力。
- source_word: להתפאר
  choice: 夸耀
  rationale: פאר 的 Hitpael 形式可指夸耀、自豪或以某事为荣；“夸耀”保留其反身意味及可能的褒贬张力，不把它单纯处理为赞美。
- source_word: בגבורתו
  choice: 因他的威能
  rationale: גְּבוּרָה 可指能力、威力，也可指大能作为；“威能”紧贴希伯来语的抽象表达，不擅自补入“作为”，同时容许读者联想到彰显出来的大能。介词 ב־ 在此按所夸耀的根据或对象译作“因”。
theological_decisions:
- issue: “他的威能”中代词所指
  choice: 正文自然理解为上帝的威能
  alternative: 也可能理解为世人自己的能力或成就
  rationale: 前后文以上帝为赐予者，希腊语“他的奇妙之事”也强力支持代词指上帝；但希伯来语代词本身在形式上仍可能产生另一理解，故以脚注保留。
- issue: “夸耀”的性质
  choice: 保留“因上帝的威能而夸耀／以之为荣”的开放表达
  alternative: 明确译为“颂扬上帝的大能”或贬义的“自夸”
  rationale: להתפאר 的语义可涵盖夸耀、引以为荣或荣耀，不宜在正文中把其神学意味单向化。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“世人”避免性别限定并传达集合义；“悟性”“威能”保持智慧文学的凝练语体。正文依希伯来语保留“威能”的抽象性，并借脚注交代希腊语所见的“奇妙之事”及代词歧义。
