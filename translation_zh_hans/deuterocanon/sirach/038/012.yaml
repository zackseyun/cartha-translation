  text: Also give the physician a place[a], and do not dismiss him, for there is need of him as well.
translation:
  language: zh_hans
  text: 也要给医生留一席之地[a]，不要让他离开，因为也需要他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在此后增有：“因为主创造了他”；并将下一句表述为“不要让他离开你”。
    reason: 记录希腊平行文本中具有意义的增句及措辞差异，而不将其并入以希伯来文本为据的正文。
lexical_decisions:
- source_word: וגם
  choice: 也要
  rationale: 承接上下文，保留添加另一项劝诫的语气；现代汉语中简洁自然。
- source_word: לרופא
  choice: 医生
  rationale: רופא指医治者或医生；“医生”是现代标准汉语中普通、清楚且不失庄重的称呼。
- source_word: תן מקום
  choice: 给……留有位置
  rationale: 保留希伯来语“给位置”的具体意象，同时表达应当容许医生介入并给予其适当位置。
- source_word: ולא ימוש
  choice: 不要让他离开
  rationale: מוש表示移开、离去；此译法保留希伯来语可能带有使动意味的表达，也与希腊语“不要让他离开你”相符，而不把含义限定为主动辞退。
- source_word: כי גם בו צורך
  choice: 因为也需要他
  rationale: 以自然汉语表达希伯来语非人称式的“他也是有需要的”，并保留גם的添加、强调作用。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在“主创造了他”一语上的差异
  choice: 正文依现存希伯来文本，不加入“因为主创造了他”
  alternative: 也要给医生留有位置，因为主创造了他；不要让他离开你，因为需要他。
  rationale: 本节希伯来文本完整且可信度高，应作为正文依据。希腊文本的增句具有重要见证价值，但不应取代希伯来正文，故收入脚注。
- issue: ולא ימוש的主语及语态张力
  choice: 不要让他离开
  alternative: 不要辞退他
  rationale: 希伯来语可直指“他不要离去”，上下文也可理解为劝人不要让医生离开。“不要让他离开”保存这种开放性；“不要辞退他”会较强地限定为雇佣关系和主动解雇。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“给医生留有位置”稍具原文意象，同时在现代汉语中可理解为给医生适当的介入空间；正文脚注标记与脚注对应。
