base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/021.yaml
  text: Do not keep remembering him[a], for there is no return; you will not help him, and you will harm yourself.
translation:
  language: zh_hans
  text: 不要再对他念念不忘，因为他已没有指望[a]；这有什么益处呢？反而会使你受害。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“因为他没有指望”；希腊文平行文本作“因为没有归回”。
    reason: 保存希伯来文与希腊文平行见证之间的异文和意义张力。
lexical_decisions:
- source_word: אל תזכרנו
  choice: 不要再对他念念不忘
  rationale: זכר可指记得、想起或提及；否定命令置于丧亲语境中，重点不是禁止一切回忆，而是劝人不要持续沉溺其中。“不要再对他念念不忘”在现代汉语中表达这种持续执着。
- source_word: כי אין לו תקוה
  choice: 因为他已没有指望
  rationale: תקוה通常意为“希望、指望”。以希伯来文为首要依据，正文保留其直接含义；希腊文平行文本的“没有归回”另载脚注，以呈现文本差异。
- source_word: מה תועיל
  choice: 这有什么益处呢？
  rationale: 希伯来文是反问句，未明说受益对象。此译保留其简练与开放性，不按希腊文补出“他”作为宾语。
- source_word: ולך תרע
  choice: 反会伤害你自己
  rationale: 该短语表示结果对哀悼者不利；希腊文以反身代词明确支持“伤害自己”。“反会”自然呈现前句所问的无益与后句所说的有害之间的对比。
theological_decisions:
- issue: תקוה应按希伯来文通常意义译为“指望”，还是按希腊文平行文本译为“归回”
  choice: 正文译“他已没有指望”
  alternative: “因为没有归回”或“因为他不会回来”
  rationale: 希伯来文见证清楚且可信度高，תקוה的直接词义是“希望、指望”，故正文不以希腊文读法取代它。希腊文οὐ γάρ ἐστιν ἐπάνοδος确实表达“没有归回”，与丧亡语境密切相关，因此收入脚注，保留原始见证之间的张力，不据此推演有关死后状态的额外教义。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“念念不忘”表示持续沉溺，并非禁止对死者的一切正常回忆；分号和反问句保留原文由无望、无益到有害的论述推进。
