  terminology: “指望”可准确对应תקוה，并在此处自然表示死者已无可盼望的前景。脚注保留希腊文“没有归回”的平行读法，足以呈现两种见证的语义张力；不宜将该希腊文的“伤害自己”扩展进希伯来正文。
