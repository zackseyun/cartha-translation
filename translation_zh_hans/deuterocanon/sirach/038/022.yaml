review_pass:
  verdict: revise
  source_fidelity: 草稿将“מושבת מתו”误解为时间从句“死者安息后”，又把“שבת זכרו”解释为要求停止追念；这两项均未能忠实反映所给希伯来文本及其“安息之处／居所”的名词性表达。应保留该处文本本身的简略与一定歧义，而不把它扩展为停止哀悼的命令。第二分句“והנחם עם צאת נפשו”可译为在其生命离去时接受安慰。
  naturalness: “死者的安息之处，就是他的居所”在现代汉语中庄重、明白，虽带有原文的凝缩和近乎同义反复，仍可接受；“当他的生命离去时，你要得安慰”自然地表达劝慰语气。
  terminology: “安息之处”适合葬丧语境，且不擅自具体化为坟墓；“生命”对应 נפש，并以脚注保留“魂”。“得安慰”比“节哀”更贴近 והנחם 的受安慰／自我得安慰之义。希腊文脚注应准确使用“审判”，不可改作“结局”。
  issues:
  - severity: high
    issue: 首句将地点／居所表达改为“死者安息后”。
    rationale: מושבת 是居住、停留或安息之处一类名词，不是“在……之后”的时间连接；“后”无相应依据。
  - severity: high
    issue: “也让对他的追念平息吧”缺乏可靠依据。
    rationale: 该译法将疑难的“שבת זכרו”扩展为停止纪念死者的命令，既偏离英文学术审校所确定的名词性“居所”理解，也过度消解了希伯来文本的歧义。
  - severity: medium
    issue: “你要节哀”弱化并改变了“得安慰”的语义。
    rationale: “节哀”是汉语常用慰唁语，却主要劝人克制悲伤；והנחם更直接是接受／获得安慰。
  - severity: medium
    issue: 希腊文平行文本脚注把 κρίμα 译作“结局”。
    rationale: κρίμα的核心义为审判、裁断；应译为“审判”，同时保留该平行本与希伯来文本显著不同的说明。
  revised_text: 死者的安息之处，就是他的居所。[b]当他的生命离去时[a]，你要得安慰。
  revised_footnotes:
  - marker: a
    text: 或译“他的魂离去时”。希伯来语“נפש”可指生命、魂、自我或生命气息。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本的内容大不相同：“要记住，他所受的审判和你的也是一样：我的在昨天，你的在今天。”这可能反映了不同于现存希伯来文的另一种文本形态。
    reason: alternative_reading
  revision_rationale: 依现存希伯来文优先原则，首句按“安息之处／居所”的表达翻译，不将其改写为死亡之后停止追念的劝告。为避免把原文中“他的”所指过度界定，正文保留代词。第二句保留生命离去的死亡习语及受安慰的命令。脚注a保留 נפש 的词汇可能性；脚注b准确呈现与希伯来本不同的希腊文平行读法，并将锚点置于相应首句。
