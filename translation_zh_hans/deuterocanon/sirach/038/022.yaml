  text: The resting place of the dead is his dwelling[b][a]; and be comforted when his life departs.
translation:
  language: zh_hans
  text: 死者的安息之处，就是他的居所。[b]当他的生命离去时[a]，你要得安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的魂离去时”。希伯来语“נפש”可指生命、魂、自我或生命气息。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本的内容大不相同：“要记住，他所受的审判和你的也是一样：我的在昨天，你的在今天。”这可能反映了不同于现存希伯来文的另一种文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: מושבת מתו
  choice: 死者安息后
  rationale: 该短语的传抄形态略有疑难；结合 מות（死者／死去）与 ישב（坐下、居住、安顿）一系的语义及丧葬语境，译作“死者安息后”最能表达死者已经归于安息的情景，同时不把地点过度具体化为“坟墓”。
- source_word: שבת זכרו
  choice: 也让对他的追念平息吧
  rationale: שבת可表达停止、止息，זכרו可指“对他的记念／追念”。把两词连读为劝人让哀悼性的追念也渐趋平息，既符合希伯来语的压缩表达，也与上下文劝慰丧者的方向一致。
- source_word: והנחם
  choice: 你要节哀
  rationale: 该词是劝人接受安慰、从悲痛中得宽慰；现代汉语丧葬语境中的“节哀”自然、庄重，也保留劝慰语气。
- source_word: עם צאת
  choice: 离去时
  rationale: עם在此可作时间关系理解；צאת是“出去、离开”。合译为“离去时”，自然表达死亡发生之际。
- source_word: נפשו
  choice: 他的生命
  rationale: נפש可指生命、性命、自我、气息或魂。正文用“生命”可自然表达死亡，又不预先规定特定的灵魂论；“魂”这一可行译法收入脚注。
theological_decisions:
- issue: 死亡语境中 נפש 的译法
  choice: 他的生命离去
  alternative: 他的魂离去／他的气息消逝
  rationale: 希伯来语 נפש 语义宽广。正文采用“生命”，避免把经文本身未明确界定的人论体系带入译文；脚注保留“魂”等可能性。
- issue: 疑难希伯来文本与希腊平行文本的关系
  choice: 正文依据现存希伯来文，理解为死者安息后，生者也应让追念平息并接受安慰
  alternative: 希腊文：要记住，他的结局也会像你的一样；昨天轮到我，今天轮到你
  rationale: 现存希伯来文虽有轻微文本疑难，仍是正文翻译的首要依据。希腊平行文本差异显著，可能代表另一文本形态，因此完整列入脚注而不与希伯来正文混合。
- issue: שבת זכרו 的句法与劝慰含义
  choice: 也让对他的追念平息吧
  alternative: 死者的安息之处就是他的居所
  rationale: 把 שבת 理解为“止息”，并以 זכרו 为其主语或宾语关系，更能形成连贯的希伯来语劝告，也符合本段限制长期哀伤的语境；另一读法虽然较字面地处理地点概念，却难以充分说明 שבת זכרו 的连续结构。
translation_notes:
  register: 采用现代、庄重而易懂的丧葬用语。“安息”“追念”“节哀”彼此呼应，呈现由死亡、记念到接受安慰的推进。正文不使用过度学术化或宗派化措辞；两个脚注标记均已置于正文。
