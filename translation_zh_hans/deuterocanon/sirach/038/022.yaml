review_pass:
  verdict: revise
  source_fidelity: 草稿将“死者安息后”和“让对他的追念平息”作为两项劝告，未能忠实对应希伯来文中以 מושבת（居处／安息之处）和 מתו（他的死者）为核心的名词性表述。尤其把 שבת זכרו 处理成“追念平息”缺乏稳固依据，并与所提供的英语审校轨迹所保留的“居所／安息之处”理解相背。应保留该处希伯来文本的压缩和困难，不把它扩展成停止纪念死者的命令。后半句“生命离去时，你要节哀”基本传达了 וְהִנָּחֵם עִם צֵאת נַפְשׁוֹ，但“得安慰”比“节哀”更直接对应原文的受安慰／得慰藉。
  naturalness: 修订文采用“安息之处”“居所”“得安慰”等现代而庄重的书面汉语。首句虽因原文压缩而略带格言式语气，仍可自然理解；不采用“追念平息”这种在现代汉语中会改变劝告对象和内容的表述。
  terminology: “生命”适当对应 נפש，并以脚注保留“魂”的词汇可能性，避免将其固定为特定灵魂论。“安息之处”体现 מושבת 的丧葬语境，但不无根据地具体化为“坟墓”。希腊文异读脚注应将 κρίμα 译为“审判”，而非较弱的“结局”。
  issues:
  - severity: high
    issue: 首句把名词性、居所相关的希伯来文改写为“死者安息后，也让对他的追念平息吧”。
    rationale: 这加入了“停止／平息追念”的明确命令；该意思既不受所给英语审校轨迹支持，也不能安全地从困难的 שבת זכרו 推得。
  - severity: medium
    issue: “节哀”弱化了 וְהִנָּחֵם 所表达的接受安慰／得慰藉。
    rationale: “节哀”虽符合中文丧葬礼貌用语，却主要是劝人克制悲伤；“得安慰”更贴近原文的安慰语义。
  - severity: low
    issue: 希腊文平行文本脚注将 κρίμα 译为“结局”。
    rationale: 所给平行希腊文明确使用“审判／判决”的词；正文不应据此决定神学含义，但脚注应如实保留该词。
  revised_text: 死者的安息之处，就是他的居所；在他的生命离去时[a]，你要得安慰。[b]
  revised_footnotes:
  - marker: a
    text: 或译“他的魂离去时”。希伯来语“נפש”可指生命、魂、自我或生命气息。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本的内容大不相同：“要记住，他所受的审判也和你所受的一样：昨天临到我，今天临到你。”这可能反映了不同于现存希伯来文的另一文本形态。
    reason: alternative_reading
  revision_rationale: 依现存希伯来文及英语审校轨迹，首句保留“死者的安息之处／居所”的表述，而不擅自解释为停止追念死者。后句以“得安慰”准确呈现劝慰语气；“生命”及其“魂”的脚注替代则维持原文 נפש 的语义开放性。希腊文的显著异读完整保留在脚注中，并以“审判”对应 κρίμα。
