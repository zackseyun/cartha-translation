  yaml_path: translation/deuterocanon/sirach/038/005.yaml
  text: Was not water made sweet by wood[c][b][a], so that his power might be made known to every man?
translation:
  language: zh_hans
  text: 水不是借着木头变甜了吗？[a][b]为要使人人知道他的能力。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 可能暗指苦水借着木头变甜的事（出埃及记15:25）。
    reason: cross_reference
  - marker: b
    text: “木头”也可译作“树”或“木块”；原文只说明所用的媒介，并未进一步具体说明。
    reason: translation_note
  - marker: c
    text: “他的能力”较可能指上帝的能力；原文也可理解为“它的能力”，即木头的能力。
    reason: alternative_reading
lexical_decisions:
- source_word: הלא
  choice: 不是……了吗？
  rationale: 引出期待肯定回答的反问，与希腊文 οὐκ 的反问语气一致；现代汉语自然明晰。
- source_word: בעץ
  choice: 借着木头
  rationale: ב 表示工具或媒介；“木头”保留希伯来文 עץ 和希腊文 ξύλον 的宽泛表达，不在正文中过度具体化为“树”或“木块”。
- source_word: המתיקו מים
  choice: 水……变甜
  rationale: 该动词表示使之甘甜；用“变甜”自然传达结果，同时保留水质发生实际改变的具体意象。
- source_word: בעבור להודיע
  choice: 这是为了让……知道
  rationale: בעבור 加不定式表达目的；此译法在现代汉语中自然，并保留“使人知道”的使动意义。
- source_word: כל אנוש
  choice: 人人
  rationale: אנוש 在这里泛指人类个体；“人人”既保留 כל 的周遍、分配意味，又符合现代汉语的普遍性表达。
- source_word: כחו
  choice: 他的能力
  rationale: 阳性单数后缀在上下文中较可能指上帝；“能力”适合表达借神迹显明的力量，同时用脚注保留其所指的语法歧义。
theological_decisions:
- issue: כחו / αὐτοῦ 中代词的所指
  choice: “他的”指上帝
  alternative: “它的”指木头；也可能理解为“他的”指摩西
  rationale: 本句的目的较自然地理解为借木头使水变甜，从而向众人显明上帝的能力；但原文阳性单数后缀及希腊文对应代词本身不能完全排除近指木头或另指摩西，因此在脚注中保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。反问句保留原文修辞力量；后半句另起一句，以避免汉语长句生硬。“人人”自然表达 כל אנוש 的泛指意义，不引入不必要的性别限定。
