  text: so that his work may not cease[b][a], and success may come through men.
translation:
  language: zh_hans
  text: 使他的工作不致停止，也使成效[a]借着人[b]而来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成效”所译的希伯来语 תושיה 在这里含义较难确定，也可表示健全、成功或有效的帮助。希腊语平行文本作：“从他而来的平安临到全地。”
    reason: alternative_reading
  - marker: b
    text: 这里的“人”泛指人类，并非只指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: למען
  choice: 使
  rationale: 引出目的或结果；在汉语中用“使”自然承接上文，同时保留目的意味。
- source_word: לא ישבות
  choice: 不致停止
  rationale: שבת在此指停止、止息；“不致停止”既保留原文语气，也符合现代汉语表达。
- source_word: מעשהו
  choice: 他的工作
  rationale: 原文为单数名词并带第三人称阳性单数后缀；“工作”比“行为”更符合本段有关配制药物及其功效的语境，同时不强行判定代词所指。
- source_word: ותושיה
  choice: 成效
  rationale: תושיה在此含义较难确定，可涉及健全、成功、有效帮助或实际功效；“成效”保留其积极而实际的结果意味，又避免把它限定为技术、智慧或平安。
- source_word: מבני אדם
  choice: 借着人而来
  rationale: 字面为“从人的子孙/人类而来”；这里泛指人类而非男性。“借着人而来”在现代汉语中自然，也保留人作为来源或媒介的可能含义。
theological_decisions:
- issue: 希伯来语“ותושיה מבני אדם”与希腊语平行文本“从他而来的平安遍及地面”之间的差异
  choice: 以现存希伯来语为主，译作“成效也可借着人而来”
  alternative: “从他而来的平安遍及地面”
  rationale: 希伯来语见证在此完整但措辞简略、语义困难，因此正文优先依从希伯来语，不以希腊语替换；脚注保留希腊语异文，并承认תושיה可能具有较宽泛的正面意义。
- issue: “他的工作”中代词所指
  choice: 保留“他的”，不在正文明确指为上帝、医生或配药者
  alternative: 明确译为“上帝的工作”或“配药者的工作”
  rationale: 原文只使用第三人称后缀，近文可能容许不止一种理解；保留代词可避免消除原有歧义。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“不致停止”略带书面色彩但普通读者易懂；正文保持希伯来语的简练和代词歧义，并以脚注交代关键词及希腊语平行见证。
