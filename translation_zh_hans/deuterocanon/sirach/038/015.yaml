  text: Whoever sins before his Maker will be defiant before a physician[a].
translation:
  language: zh_hans
  text: 凡在自己的造物主面前犯罪的，必在医生面前抗拒不从。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“愿他落在医生手中。”希伯来文本作：“必在医生面前抗拒不从。”
    reason: 记录希伯来文本与希腊平行文本在下半句的实质性异读。
lexical_decisions:
- source_word: אשר
  choice: 谁……谁就……
  rationale: 引出泛指关系句；汉语用“谁……谁就……”自然保留箴言式的普遍含义。
- source_word: חואט
  choice: 犯罪
  rationale: 源自动词 חטא，具有明确的道德和宗教意味；“犯罪”比“做错事”更准确。
- source_word: לפני
  choice: 在……面前
  rationale: 保留希伯来语“在……面前／在……临在中”的基本空间与关系意义，也与希腊语 ἔναντι 相符，避免强化为“得罪”。
- source_word: עושהו
  choice: 造他的主
  rationale: 直译为“造他的那一位”。“造他的主”在现代汉语中简洁庄重，并清楚指向创造者；不把关系扩展成原文未明说的称号。
- source_word: יתנכר
  choice: 抗拒不从
  rationale: נכר 的 Hitpael 可表达使自己疏远、表现得像陌生人或采取敌对态度。此处译作“抗拒不从”，呈现病人在医生面前疏离、不合作的实际意味，同时不采用希腊文本所见的被动遭遇。
- source_word: רופא
  choice: 医生
  rationale: 这是现代标准汉语中自然、通行且尊重专业身份的称呼，符合上下文的医疗语境。
theological_decisions:
- issue: 下半句希伯来文本与希腊文本的分歧
  choice: 正文依现存希伯来文，译为“会在医生面前抗拒不从”
  alternative: 依希腊文译为“愿他落在医生手中”或“他必落在医生手中”
  rationale: 《便西拉智训》有可靠希伯来文本存世时，以希伯来文为正文依据。本节希伯来文 יתנכר לפני רופא 与希腊文 ἐμπέσοι εἰς χεῖρας ἰατροῦ 差异明显，因此正文采用高可信度的希伯来读法，并在脚注中保留希腊异文，不消解两种传统之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“谁……谁就……”保持格言节奏；“抗拒不从”比单用“反抗”更能表达疏离并不配合医生的语境含义。
