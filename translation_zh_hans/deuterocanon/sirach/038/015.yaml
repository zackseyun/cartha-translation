  source_fidelity: 正文准确保留希伯来文的两层关系：在“造他者／造物主”面前犯罪，以及在医生面前采取抗拒、不顺从的态度；并以脚注保留希腊文本“落在医生手中”的实质异读。原译的“造他的主”改变了属格关系，不能表达 עושהו“造他的那一位／他的造物主”。
