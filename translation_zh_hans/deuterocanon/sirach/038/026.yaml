  text: His diligence is to finish the foddering place[b][a]; he sets his heart on plowing the furrows.
translation:
  language: zh_hans
  text: 他孜孜不倦地完成牲畜棚的事务[a]；他一心耙松犁沟中的土[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“完成牲畜棚”，可能指完成与棚中喂养牲畜有关的事务。希腊文作“他的警醒是为了幼牛的饲料”，同样强调他持续挂念牲畜的饲养。
    reason: alternative_reading
  - marker: b
    text: 或译：“专心翻整犁过的田地。”这里的希伯来语动词可指耙地、碎土或翻松土壤；希腊文则作“开出犁沟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ושקידתו
  choice: 他孜孜不倦
  rationale: שקד表示持续专注、警醒勤作；结合农耕语境，“孜孜不倦”自然表达长久而殷勤的操劳。希腊文ἀγρυπνία（警醒、不眠的挂虑）也支持这种持续操心的含义。
- source_word: לכלות
  choice: 要把……的活做完
  rationale: כלה在此取“完成、做完”之义。原文未明说“活”，但在汉语中补出，可自然表达完成与棚圈有关的劳作，而不把棚圈本身误解为被“做完”的建筑工程。
- source_word: מרבק
  choice: 棚圈
  rationale: מרבק指喂养或育肥牲畜的棚、圈。译作“棚圈”既保留场所含义，也比技术性较强的“育肥栏”更适合普通现代读者；其喂养功能在脚注说明。
- source_word: לב ישית
  choice: 他一心
  rationale: 字面为“他把心放在……上”，是表示专注用心的希伯来语习语。“一心”保留心志集中之意，同时符合现代汉语表达。
- source_word: לשדד
  choice: 耙松
  rationale: 该动词在农耕语境中可指耙地、碎土或翻松土壤。“耙松”保留比泛称“耕”更具体的田间作业含义，同时避免过度限定某一种古代农具。
- source_word: בתלמים
  choice: 犁沟里的土
  rationale: תלמים指犁出的沟或垄行。结合“耙松”，汉语补出“土”使动作与对象关系自然，并保留具体的犁沟意象。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“孜孜不倦”“一心”保留原文的持续勤作和内心专注；“棚圈里的活”与“耙松犁沟里的土”使古代农务图景对普通读者清楚，同时以脚注保留希伯来文的简约表达及希腊平行文本的差异。
