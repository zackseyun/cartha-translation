base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/017.yaml
  text: My son[a], make the mourning bitter and complete the lament; perform his mourning as is fitting for him. For a day or two, because of slander, shed tears[b]; then be comforted because of grief.
translation:
  language: zh_hans
  text: 我儿，要悲切地哀哭，充分地举哀；要按他应有的礼数为他治丧。流泪一两天[a]；随后要从悲伤中得到安慰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本是“为流泪”；希腊文本则作“为了毁谤（或非议）”，可能指为免因没有适当举哀而受人指责。
    reason: textual_variant
  - marker: b
    text: 此处希伯来词通常可指“罪孽”，也可能指“患难、痛苦”；希腊文本作“悲伤”。
    reason: alternative_reading
lexical_decisions:
- source_word: המר
  choice: 哀哭得悲切
  rationale: 该使役命令式本有“使之苦涩”的形象；与哀哭连用时，指哀哭深切、强烈。译文保留“悲切”的情感力度，也符合现代汉语表达。
- source_word: והתם מספד
  choice: 充分举哀
  rationale: 希伯来语要求把为死者的哀悼完成、做足，并非立即停止哀悼。“充分举哀”简洁表达完整履行哀悼之意。
- source_word: ושית אבלו כיוצא בו
  choice: 要照他所当得的为他治丧
  rationale: כיוצא בו在这里表示与死者所应得的相称；希腊语κατὰ τὴν ἀξίαν αὐτοῦ也支持“按他所当得的”。“治丧”自然涵盖为死者举行的丧礼和哀悼。
- source_word: יום ושנים בעבור דמעה
  choice: 要流泪一两天
  rationale: 现存希伯来文本直译近于“为流泪，一天和两天”，自然理解为用一两天流泪哀悼。译文以希伯来语为主，并在脚注说明希腊语的不同读法。
- source_word: הנחם
  choice: 得到安慰
  rationale: 该命令式可表达“受安慰、获得安慰”，也可带反身意味。译为“得到安慰”避免过度强调自行排解。
- source_word: בעבור עון
  choice: 从悲伤中
  rationale: עון在此语境中含义困难；若按常见词义可涉及罪孽，但希腊语λύπης支持悲痛、忧伤的语义。正文按丧亲语境译作“悲伤”，脚注保留歧义。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在“一两天”一语上的差异
  choice: 正文依现存希伯来语译为“要流泪一两天”
  alternative: 依希腊语译为“为免受非议，要哀悼一两天”
  rationale: 项目以尚存的希伯来文本为首要证据。此处希伯来语明确出现“眼泪”，不宜在正文中无声地以希腊语“毁谤、非议”取代；希腊异文则在脚注中保留。
- issue: 末句עון的语义
  choice: 依据上下文及希腊平行文本译作“悲伤”
  alternative: 译作“罪孽”或“患难”
  rationale: “罪孽”虽是该词的常见含义，却与本节丧亲语境衔接困难；希腊语明确为“悲伤”。正文采用语境最通顺的读法，同时以脚注保留希伯来语可能产生的其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的智慧教诲语体。“我儿”保留师长劝诫的称呼；“哀哭得悲切、充分举哀、治丧”兼顾希伯来语意象、丧礼语境与当代普通读者的可读性。
