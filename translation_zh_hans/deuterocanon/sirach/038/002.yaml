  text: From God the physician becomes wise[c][b][a], and from the king he receives a gift.
translation:
  language: zh_hans
  text: 医生从上帝得智慧[a][b]，也从君王领受赏赐[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“因为医治来自至高者。”希伯来文作“从上帝”，并有“医生得智慧”这一较难的结构。
    reason: alternative_reading
  - marker: b
    text: 希伯来文明确提到“医生”；希腊文在此没有对应的“医生”，而是直接说“医治”。
    reason: textual_variant
  - marker: c
    text: 或译“领受报酬”。希伯来文短语较难，字面近于“承担重担”；希腊文作“将领受礼物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מאת אל
  choice: 从上帝
  rationale: 希伯来文明确作“从上帝”；希腊文平行本作“从至高者”。正文以希伯来文为主，希腊异文收入脚注。
- source_word: יחכם רופא
  choice: 医生得智慧
  rationale: 按现存希伯来文的自然词汇对应，יחכם可理解为“变得有智慧/得智慧”，רופא为“医生”。但该结构和文本传承均有困难，希腊文则作“医治”，故保留异文说明。
- source_word: מאת מלך
  choice: 从君王
  rationale: 希伯来文可泛指“一位君王”，也可在汉语中自然译为“君王”；此处不强加特指。
- source_word: ישא משאות
  choice: 领受赏赐
  rationale: 该希伯来短语字面近于“承担重担/拿起所负之物”，在本节语境中意义困难；希腊文作“将领受礼物”。“领受赏赐”既符合医生从君王所得报偿的语境，也保留其奖赏色彩。
theological_decisions:
- issue: 医术或医治的来源
  choice: 正文依希伯来文呈现为医生从上帝得智慧
  alternative: 依希腊文译作“因为医治来自至高者”
  rationale: 两种见证在主语和措辞上有实质差异。正文优先采用指定的高可信度希伯来文，不把希腊文的较顺畅读法无声并入正文，并以脚注保存其见证。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“医生”较“医师”更便于普通读者理解；“君王”“赏赐”保持经文语体。脚注标记均置于相关正文成分之后，并按[a][b][c]顺序排列。
