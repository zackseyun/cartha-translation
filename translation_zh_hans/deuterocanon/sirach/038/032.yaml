  text: With his arm he will shape clay[a], and before his feet he will bend his strength.
translation:
  language: zh_hans
  text: 他用臂膀塑造陶土，又在双脚前俯身使力[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“在双脚前屈下他的力量”，可能着重描写陶匠俯身的姿势，也可能着重描写他在劳作中用尽力气。
    reason: 原文短语κάμψει ἰσχὺν αὐτοῦ高度凝缩，在汉语中无法同时按字面自然表达其姿势与用力两层可能含义。
lexical_decisions:
- source_word: ἐν βραχίονι αὐτοῦ
  choice: 他用臂膀
  rationale: βραχίων指手臂，介词ἐν在这里表示劳作所用的身体部位；“用臂膀”保留了具体的体力劳动形象，也符合现代汉语表达。
- source_word: τυπώσει
  choice: 塑造
  rationale: τυπόω可指压出形状、模塑；与πηλός连用时，译作“塑造”能自然表达陶匠使泥成形的动作，又不限定具体技法。
- source_word: πηλόν
  choice: 陶土
  rationale: πηλός可指泥或黏土；本节语境是陶匠劳作，“陶土”比泛称“泥”更准确清楚。
- source_word: πρὸ ποδῶν
  choice: 在双脚前
  rationale: 该短语描写劳作者脚前的空间位置。“双脚”是汉语对复数ποδῶν的自然表达，同时保留原文具体的身体意象。
- source_word: κάμψει ἰσχὺν αὐτοῦ
  choice: 俯身使力
  rationale: 原文直译近于“屈下他的力量”，是紧缩而不寻常的说法。译作“俯身使力”既呈现κάμπτω的弯屈动作，也保留ἰσχύς所表达的体力；脚注说明其语法和解释上的含混。
