  yaml_path: translation/deuterocanon/sirach/038/013.yaml
  text: For there is a time when success is in his hands[a], for he too will make supplication to God.
translation:
  language: zh_hans
  text: 因为有时他手中有成效[a]；因为他也会向上帝恳求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语作“因为有时，成功也在他们手中”。希伯来语见证作单数“他手中”，正文从希伯来语。
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: 因为；（第二处不重复明译）
  rationale: 首处作因果连词，承接上下文，说明不应轻看医生的理由。第二处同样带解释意味，但现代汉语若重复“因为”会显得累赘，因此以分号自然延续理由，而不改变句间关系。
- source_word: יש עתם
  choice: 有时
  rationale: 希伯来语直译为“有一个时候”，在此表达不定时机；“有时”是自然、准确的现代汉语，也避免过度指定为预定的时刻。
- source_word: בידו
  choice: 在他手中
  rationale: 保留希伯来语单数及“手中”的能动性意象，所指为上下文中的医生；同时不把医治成效说成始终完全由他控制。
- source_word: מצלחת
  choice: 成功
  rationale: 表示顺利、良好结果或成效；“成功”简洁贴合医疗语境，也与希腊语平行文本 εὐοδία 所表达的顺利、成功相符。
- source_word: גם הוא
  choice: 他也
  rationale: 保留强调：医生不仅运用医术，自己也向上帝祈求。
- source_word: אל אל
  choice: 向上帝
  rationale: 前一个 אל 是介词“向”，后一个 אֵל 是神称“上帝”；合译为“向上帝”最符合现代汉语。
- source_word: יעתיר
  choice: 会……恳求
  rationale: 该动词含恳切祈求之意，比一般的“祷告”更能保留语气力度；“会”表达未完成体在此处的惯常或将来意味。
theological_decisions:
- issue: 医生的医术成效与对上帝的倚赖之间的关系
  choice: 既承认医生有时能取得真实成效，也保留医生向上帝恳求的事实。
  alternative: 可弱化为仅仅陈述医生偶尔成功，或把医治完全归为人的技术或纯粹的神迹。
  rationale: 希伯来文本把“成功在他手中”和“他也向上帝恳求”并置，肯定人的医疗行动，同时不取消其对上帝的倚赖；译文保留这种张力。
- issue: 医生是单数还是复数
  choice: 正文依希伯来文本译为单数“他”。
  alternative: 依希腊语平行文本译为复数“他们”，泛指医生群体。
  rationale: 指定的希伯来语文本为主要来源，בידו 明确是单数；希腊语的复数异文则在脚注中交代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“成功就在他手中”保留原文意象；“恳求”传达祈求的恳切程度。正文中的[a]与脚注标记对应。
