base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/019.yaml
  text: Do not set your heart on him any longer[a]; let his memory go[c][b], and remember the end.
translation:
  language: zh_hans
  text: 不要再一心牵挂他[a]；放下对他的追念[b]，要记住结局[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“不要再把心放向他”，意思是不要继续在情感上牢牢系于死者。
    reason: lexical_alternative
  - marker: b
    text: 或译“任对他的记忆淡去”“不再追念他”。这一短语中的希伯来语动词含义较难确定；希腊语平行文本支持走出哀伤的意思。
    reason: alternative_reading
  - marker: c
    text: 或指“他的结局”或“你自己的结局”。希伯来语只说“结局”，可能有意保留较宽泛的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: אל תשים אליו לב
  choice: 不要再一心牵挂他
  rationale: 希伯来语直译为“不要再把心放向他”。在哀悼语境中，这一习语劝人不要继续把内心和情感牢牢系于死者；“一心牵挂”既保留“心”的含义，也符合现代汉语表达。
- source_word: עוד
  choice: 再
  rationale: 此处表示某种状态不应继续下去；与否定词连用译作“不要再”，自然传达“不再继续”的意思。
- source_word: פרע זכרו
  choice: 放下对他的追念
  rationale: פרע 在此短语中的含义较难确定。结合上下文及希腊语平行文本，重点不是彻底抹去死者，而是松开对其记忆的执持、走出哀伤；“放下对他的追念”保留了这种较温和的含义。
- source_word: וזכור אחרית
  choice: 要记住结局
  rationale: אחרית 可指终结、最终结局或末后的归宿。原文未说明是谁的结局，因此采用简洁的“结局”，保留其可指死者之终局、哀悼者自身之终局或普遍死亡结局的开放性。
theological_decisions:
- issue: “结局”（אחרית）的所指
  choice: 不限定所指，保留对最终结局、尤其死亡之现实的广义提醒
  alternative: “记住他的结局”或“记住你自己的结局”
  rationale: 希伯来语没有明示所属对象。智慧文学中的 אחרית 常具有较宽广的末后或死亡意涵；正文不补出代词，以免消除原文有意或实际存在的含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一心牵挂”使“心”的意象在汉语中自然呈现；“放下对他的追念”避免把劝慰误译成冷酷的“忘掉他”；“结局”不补明所属对象，以保存原文的含混与智慧文学的张力。
