  text: He will apply his heart to complete the glaze[b][a], and his wakefulness is to cleanse the furnace.
translation:
  language: zh_hans
  text: 他专心完成器物的装饰[b]，又彻夜不眠，要把窑炉[a]清理干净。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“炉子”。原词可指炉或窑；按上下文的制陶场景，这里很可能特指烧陶的窑。
    reason: lexical_alternative
  - marker: b
    text: 原文此处较难确定，所用词通常意为“恩赐”或“赠礼”。本译文按制陶的上下文，将它理解为器物最后的装饰或表面处理；也可能指“釉面”或泛指“成品”。
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν ἐπιδώσει
  choice: 他专心
  rationale: 原文直译近于“他把心投入”，是指全心致力于工作。中文用“专心”自然地保留这种专注之意，且不添加原文没有明说的心理活动。
- source_word: συντελέσαι
  choice: 完成
  rationale: 该不定式表示投入心力的目的，即把工作做完、使之完成。
- source_word: τὸ χάρισμα
  choice: 器物的装饰
  rationale: χάρισμα通常可指“恩赐、赠礼”，但这一常见义项放在制陶语境中难以讲通。这里可能指陶器最后的装饰或表面处理；译作“器物的装饰”比特指“釉面”更谨慎，并用脚注保留原文的困难与其他理解。
- source_word: ἡ ἀγρυπνία αὐτοῦ
  choice: 又彻夜不眠
  rationale: ἀγρυπνία指不睡、警醒守候。结合烧窑工作，译文用动作表达，传达工匠通宵照料窑火的形象。
- source_word: καθαρίσαι
  choice: 清理干净
  rationale: 动词可指洁净或清除污物；宾语是窑炉，现代汉语“清理干净”具体自然，也避免引入礼仪洁净含义。
- source_word: κάμινον
  choice: 窑炉
  rationale: κάμινος可指炉、熔炉或窑；上下文谈制陶，故“窑炉”既符合语境，也保留该词较宽泛的炉窑含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“专心”传达希腊语“把心投入”的习语；“彻夜不眠”保留工匠守候窑炉的具体形象。对含义不明的 τὸ χάρισμα 不作过度技术化处理，而在正文采用较宽的“器物的装饰”，并以脚注说明歧义。脚注标记依其所注词语在正文中的先后排列为[b]、[a]，与所给标记对应。
