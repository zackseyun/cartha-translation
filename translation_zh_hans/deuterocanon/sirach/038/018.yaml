  text: For from grief disaster comes forth[a]; so a sorrowful heart wastes away in sadness.
translation:
  language: zh_hans
  text: 因为悲伤会生出灾祸[a]；同样，愁苦会耗尽忧伤的心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“因为死亡出于悲伤，心中的悲痛会削弱力量。”希伯来文本作“灾祸”，而不是“死亡”，所以正文依希伯来文本翻译，并在此保留希腊文本的异文。
    reason: alternative_reading
lexical_decisions:
- source_word: מדין
  choice: 因为悲伤
  rationale: 该词形单独看较难确定，但希腊平行文本 ἀπὸ λύπης 明确支持“从悲伤/忧愁而来”的理解；结合上下文的哀悼主题，译作“因为悲伤”自然且贴切。
- source_word: יוצא
  choice: 会带来
  rationale: 原义为“出来、产生”。在汉语因果表达中，“会带来”自然地保留灾祸由悲伤而生的意思。
- source_word: אסון
  choice: 灾祸
  rationale: 希伯来词通常指严重的灾难或祸患；主文据希伯来文本译为“灾祸”，不以希腊文本的“死亡”取代，并将该异文收入脚注。
- source_word: כן
  choice: 同样
  rationale: 保留两分句之间的对应关系，不将其弱化为单纯并列。
- source_word: רע לבב
  choice: 忧伤的心
  rationale: 字面近于“心中不佳/痛苦”，在哀伤语境中指内心忧苦，而非道德上的邪恶；“忧伤的心”也与希腊平行文本“心中的悲痛”相符。
- source_word: יכלה
  choice: 衰残
  rationale: 该动词有耗尽、消损、归于尽头之意；“衰残”兼顾身心被愁苦消耗的意象，并与希腊文本“使力量屈服”形成语义呼应。
- source_word: עצבה
  choice: 在愁苦中
  rationale: 该名词可指痛苦、悲伤或愁苦；此处译为“在愁苦中”，保留情绪与痛楚兼具的色彩。
