  yaml_path: translation/deuterocanon/sirach/038/031.yaml
  text: So the potter[a], sitting at his work and turning the wheel with his feet, is continually anxious over his work, and all his labor is by number;
translation:
  language: zh_hans
  text: 同样，陶匠坐着做工，用脚转动陶轮；他总是为自己的工作操心，他所做的一切都有数目。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他所做的一切都经过计数。”希腊文ἐνάριθμος可指“有数目的”或“经过计数的”。
    reason: 保留ἐνάριθμος的词义范围与末句所指的含蓄性：可指其劳作或产出被逐一计数，亦可泛指其全部工作具有数目。
lexical_decisions:
- source_word: κεραμεὺς
  choice: 陶匠
  rationale: 指制作陶器的工匠；“陶匠”简洁自然，也符合古代手工业语境。
- source_word: καθήμενος ἐν ἔργῳ αὐτοῦ
  choice: 坐着做工
  rationale: 保留陶匠工作时的坐姿，并用现代汉语自然表达其正在从事本业。
- source_word: συστρέφων ἐν ποσὶν αὐτοῦ τροχόν
  choice: 双脚转动轮盘
  rationale: 明确轮盘由脚操控；“轮盘”在上下文中自然指陶轮。
- source_word: ἐν μερίμνῃ κεῖται διὰ παντὸς ἐπὶ τὸ ἔργον αὐτοῦ
  choice: 他始终为自己的工作操心
  rationale: μερίμνη既可指关切，也带挂虑意味；“操心”保留这种张力，又避免现代临床意义过强的“焦虑”。
- source_word: ἐνάριθμος πᾶσα ἡ ἐργασία αὐτοῦ
  choice: 所做的一切都按数计算
  rationale: ἐνάριθμος意为列入数目、经过计数；此译保留原文略显凝练而含义开放的表达，不武断限定为成品数量或精密度。
