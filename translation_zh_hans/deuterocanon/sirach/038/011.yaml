  text: Present a memorial offering of soothing aroma[b][a], and enrich the arranged offering with the best of your wealth.
translation:
  language: zh_hans
  text: 献上馨香的纪念祭[a][b]，用你财富中最好的，使已陈设好的祭物更为丰盛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文较直译为：“献上馨香的纪念祭，并用你财富的翅膀，使已陈设好的祭物肥厚。”其中“你财富的翅膀”含义不十分确定，可能指用财富中最好的，或按自己财力的充分程度来献。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行本作：“献上馨香和细面作的纪念祭，使供物丰厚，如同一个将不复存在的人。”末句与希伯来文有显著差异；正文采用希伯来文。
    reason: alternative_reading
lexical_decisions:
- source_word: הגש
  choice: 献上
  rationale: 这是献祭语境中的命令式，指把祭物带到近前献上；“献上”既自然，也保留礼仪含义。
- source_word: ניחוח
  choice: 馨香的
  rationale: 该词在献祭用语中表达蒙悦纳、令人愉悦的香气；“馨香”是现代中文可理解且庄重的祭祀表达，同时不过度解释为单纯的气味。
- source_word: אזכרה
  choice: 纪念祭
  rationale: 这是献祭术语，指作为纪念而献的祭或祭物部分；“纪念祭”保留其礼仪专指性，并与希腊文 μνημόσυνον 相符。
- source_word: ודשן
  choice: 使……丰厚
  rationale: דשן 可指使之肥厚、丰盛；这里用“使……丰厚”自然表达祭物供应充足，而不采用容易误解的直译“使之肥胖”。
- source_word: ערוך
  choice: 摆好的祭物
  rationale: 该词表示已经排列、预备妥当之物；上下文为献祭，因此补明“祭物”，既保留“摆好”的具体图景，也使中文完整。
- source_word: בכנפי
  choice: 用……中最好的
  rationale: 字面为“用……的翅膀／边缘”；与财富连用时语义不明，可能指财富的上好部分或充分范围。正文采用较合语境的“最好的”，并以脚注保留字面及不确定性。
- source_word: הוניך
  choice: 你的财富
  rationale: הון 指财富、资财或家产；“你的财富”直接清楚，符合慷慨献祭的劝勉。
theological_decisions:
- issue: 智慧训诲中的献祭意象
  choice: 保留“纪念祭”“祭物”等明确的献祭语言
  alternative: 泛化为“纪念”“礼物”或属灵敬虔行为
  rationale: 希伯来文与希腊文平行本都采用祭祀术语。即使上下文涉及祷告和医治，本节自身仍在谈献祭，不宜将其属灵化或淡化。
- issue: 希伯来文与希腊文末句的差异
  choice: 正文依据高可信度的希伯来文见证
  alternative: 采用希腊文“如同将不复存在的人”之类的读法
  rationale: 所给希伯来文本完整且验证为一致；希腊文末句与其有实质差异，因此仅在脚注中说明，不将两种读法调和。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“馨香”“纪念祭”保留礼仪色彩；“摆好的祭物”避免生硬的“排列之脂”，同时通过脚注呈现希伯来文较具体而含混的措辞。
