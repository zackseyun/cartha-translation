  text: Turn away from wrongdoing[a], and make your hands straight[b]; and from every sin cleanse your heart.
translation:
  language: zh_hans
  text: 要远离不义，并端正你的行为[a]；要洁净你的心，除去一切过犯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文的这个分句难以确定。希腊文作“使你的双手正直”，可能是以“手”指行动，意思是纠正自己的行为。
    reason: textual_variant
  - marker: b
    text: 或译：“一切罪”。这里的希伯来词也可带有悖逆、越界的较强意味；希腊文作“每一种罪”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נום מעול
  choice: 要远离不义
  rationale: 复合希伯来文本中的动词形式略有不确定，但结合上下文及希腊文ἀπόστησον，表达离开、远离恶行的命令。עול可指不义、邪恶或错行；“不义”简洁庄重，也保留其道德含义。
- source_word: ומהכר פנים
  choice: 并端正你的行为[a]
  rationale: 现存希伯来文此处难解，希腊文作εὔθυνον χεῖρας，直译为“使双手正直”，以“手”转指人的行动。“端正你的行为”在现代汉语中自然地传达这一意象的实际含义，并以脚注说明文本问题。
- source_word: ומכל פשעים
  choice: 从一切过犯中
  rationale: פשעים通常指越界、悖逆性的罪行。“过犯”比泛称“罪”更贴近希伯来词的较强语气，同时仍是普通读者容易理解的宗教伦理用语。
- source_word: טהר לב
  choice: 洁净你的心
  rationale: טהר表示洁净或使纯净；“洁净你的心”保留道德与礼仪相互映照的意味，也准确传达命令语气。
theological_decisions:
- issue: 希伯来文中间分句难解时如何采用希腊文平行文本
  choice: 以希伯来文为首要见证，但依据希腊文将该句译为纠正自身行动的劝诫，即“端正你的行为”。
  alternative: 按现存希伯来字面勉强译作与“脸面”有关的表达，或直译希腊文为“使你的双手正直”。
  rationale: 该希伯来分句文本状况不稳，而希腊文提供了与前后命令句协调、意义清楚的读法。“行为”解释了“手”的转喻，但脚注明示希腊文的字面措辞，避免掩盖文本差异。
- issue: פשעים的道德语气
  choice: 译为“过犯”。
  alternative: 译为“一切罪”。
  rationale: “过犯”保留希伯来词所含的越界乃至悖逆色彩，不将其弱化为完全泛化的罪，同时不额外引入特定宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“要……并……；要……”保留原文连续命令的力度。正文以“行为”自然表达“手”的转喻，并通过脚注交代希伯来文本困难及希腊平行文本。
