  yaml_path: translation/deuterocanon/sirach/038/003.yaml
  text: A physician’s knowledge will raise his horn[a], and before nobles he will stand.
translation:
  language: zh_hans
  text: 医生的学识必使他受尊崇；他必站在显贵面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他必在权贵面前受赞叹。”
    reason: 希伯来文与希腊文在后半句存在实质差异；脚注保存希腊平行文本的读法。
lexical_decisions:
- source_word: דעת
  choice: 学识
  rationale: 该词表示知识、认识；与“医生”连用时，所指是其经学习而有的医学知识和专业素养。“学识”比单纯的“知识”更符合此处语境。
- source_word: רופא
  choice: 医生
  rationale: 该词指医治者或行医者；“医生”是现代汉语中自然、庄重且清楚的对应词。
- source_word: תרים קרנו
  choice: 必使他受尊崇
  rationale: 希伯来文直译为“必高举他的角”。“角被高举”是获得力量、地位或尊荣的意象；若在现代汉语正文中直译，会显得晦涩，因此译出其在本句中的主要含义，同时保留其使役结构。
- source_word: נדיבים
  choice: 贵人
  rationale: 该词在此指身份尊贵、地位显赫的人。“贵人”既保留社会地位含义，也适合智慧文学的庄重语体。
- source_word: יתיצב
  choice: 必站在……面前
  rationale: 该动词意为站立、立于某处。此译忠实保留希伯来文所表达的进入贵人面前、在其面前立身的图景，不以希腊文的“受赞叹”取代它。
theological_decisions:
- issue: 后半句希伯来文与希腊文的差异
  choice: 正文依从希伯来文“他必站在贵人面前”
  alternative: 希腊文作“他在权贵面前必受赞叹”
  rationale: 现存希伯来文证据可信度高，故正文以其为准；希腊文改变了句子的侧重点，从获准立于显贵面前转为受到显贵赞叹，因此作为重要异文收入脚注。
- issue: “高举他的角”的意象
  choice: 正文译出习语含义“使他受尊崇”
  alternative: 直译为“高举他的角”或转用“使他昂首”
  rationale: “角”在希伯来语中可象征力量、地位和尊荣，现代汉语直译不易自然理解；“受尊崇”传达此处的社会提升，同时避免采用受希腊文影响较深的“昂首”。
translation_notes:
  register: 采用简洁、庄重而现代的智慧文学语体。“医生”“学识”“贵人”均为普通读者易懂的标准现代汉语；分号呈现两行诗句之间的并列递进关系。
