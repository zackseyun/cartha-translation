base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/009.yaml
  text: My son[a], in your sickness do not be negligent; pray to God[b], for he will heal you.
translation:
  language: zh_hans
  text: 我儿，你患病时不可疏忽[a]；要向上帝[b]祷告，因为他必医治你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要忽视病情。”希腊平行文本支持“不忽视／不轻看”的含义。
    reason: lexical_alternative
  - marker: b
    text: 希腊平行文本作“向主祷告”；这里的希伯来文本作“向上帝祷告”。
    reason: alternative_reading
lexical_decisions:
- source_word: בני
  choice: 我儿
  rationale: 这是直译为“我的儿子”的呼语；“我儿”既保留《便西拉智训》中父辈教导的语气，也符合庄重自然的现代汉语。
- source_word: בחולי
  choice: 你患病时
  rationale: 介词ב与חולי合用，可表示处境或时间，即“在你的疾病中／当你患病时”；译作“你患病时”更符合现代汉语表达，希腊文ἐν ἀρρωστήματί σου也支持此义。
- source_word: על תתעבר
  choice: 不可疏忽
  rationale: 希伯来语传本文句含义略有不确定；希腊平行文本μὴ παράβλεπε意为“不要忽视／疏忽”，支持这里是在劝人患病时不可掉以轻心。正文不强加希伯来语中未明说的宾语，另以脚注保留“不要忽视病情”的可能表达。
- source_word: התפלל
  choice: 祷告
  rationale: 此词直接表示“祷告”，无须增添“恳切”等原文没有的程度含义；希腊文εὔξαι与此一致。
- source_word: אל אל
  choice: 向上帝
  rationale: 希伯来文本作אל אל，即“向上帝”；采用“上帝”是自然、通行且不带特定宗派色彩的现代汉语表达。希腊平行文本作“向主”，该异文收入脚注。
- source_word: כי הוא ירפא
  choice: 因为他必医治你
  rationale: כי引出祷告的理由；希伯来文直陈“他必医治”，语境中的受事者是患病的“你”，希腊文也明确有σε（你），故在汉语中补出“你”。
theological_decisions:
- issue: 祷告对象的称谓
  choice: 上帝
  alternative: 主
  rationale: 现存希伯来见证明确使用אל（上帝），故正文以希伯来文为准；希腊平行文本使用Κυρίῳ（主），作为有意义的文本差异列入脚注，不据此改动正文。
- issue: 医治应许的语气
  choice: 他必医治你
  alternative: 他会医治你
  rationale: 希伯来语未完成式ירפא在这里表达面向将来的肯定陈述，希腊文ἰάσεταί同样为将来时。译作“必医治”保留原文鲜明的肯定语气，不自行将其弱化为一般可能性，也不额外解释医治的方式或时间。
translation_notes:
  register: 采用庄重、清楚而自然的现代标准汉语。“我儿”保留智慧文学中长者劝诫晚辈的口吻；分号呈现“不可疏忽”与“要祷告”两个相连的劝告。脚注标记按其实际所指分别置于“疏忽”和“上帝”之后。
