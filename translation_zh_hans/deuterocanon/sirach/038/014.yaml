  text: for his plea may succeed[a], and his healing serves to preserve life.
translation:
  language: zh_hans
  text: 愿他的祈求得以成就[a]，他的医治也是为保全生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希伯来文“פשרה”含义不确定。希腊文平行文本说得更明确：“他们也要祈求主，愿他使他们的舒缓和医治顺利成功，为使生命得以延续。”
    reason: 说明疑难词及希腊平行文本的异读。
lexical_decisions:
- source_word: פשרה
  choice: 他的祈求
  rationale: 此词在这里含义不确定；按通常词义直译并不合语境。希腊平行文本用 δεηθήσονται（祈求），支持理解为向主发出的恳求。译作“祈求”自然、庄重，同时不限定为某种特定礼仪。
- source_word: יצלח לו
  choice: 得以亨通
  rationale: צלח 表示顺利、成功或兴旺；“得以亨通”保留原文的祈愿或目的语气，也与希腊文 εὐοδώσῃ（使顺利、使成功）相应。
- source_word: ורפאות
  choice: 他的医治
  rationale: 该形式可指医治、疗效或治疗措施；希腊文 ἴασιν 支持“医治”之义。这里不具体限定为康复结果或医疗手段，以保留原文的宽度。
- source_word: למען מחיה
  choice: 为使人存活
  rationale: למען 表目的，מחיה 涉及维持生命、使人活着。译文清楚表达医治以存续生命为目的；“人”是汉语为使受益者自然明确而作的最低限度补足。
theological_decisions:
- issue: 如何处理希伯来文本的晦涩措辞与较明确的希腊平行文本
  choice: 以希伯来文的简短结构为主，并借希腊文确认前半句关乎祈求、后半句关乎维持生命的医治。
  alternative: 可译作“愿他的代求成功，他的疗治也使生命延续”，或依希腊文扩译为“他们也要祈求主，使他们的舒缓和医治顺利，为使人继续存活”。
  rationale: 现存希伯来文尤其是 פשרה 意义可疑，且资料标注存在重大文本差异。采用希腊平行文本作校验能避免把该词按常见义误译为“妥协”，但正文仍保留希伯来文的紧凑形式，不将希腊文独有的“主”“舒缓”等成分直接并入。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……得以亨通”保留祈愿色彩；“医治”不强行区分治疗行为与康复结果。脚注标记[a]已置于对应疑难词组之后。
