  yaml_path: translation/deuterocanon/sirach/038/020.yaml
  text: 'Remember his lot, for it is your lot: his yesterday, and your today.'
translation:
  language: zh_hans
  text: 要记住他的定分[a]，因为那也是你的定分：昨日是他的，今日是你的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定分”也可译作“定规”或“所定的份”。希伯来语 חק 常指律例或定规；在这里则很可能指人人在死亡中所承受的既定归宿。
    reason: lexical_alternative
  - marker: b
    text: 希腊语平行文本作：“不要让你的心陷入悲伤；要摆脱悲伤，记住末后的事。”这同样把重点放在人的终局上，但措辞与这里的希伯来文本不同。
    reason: alternative_reading
lexical_decisions:
- source_word: זכור
  choice: 要记住
  rationale: 这是动词 זכר 的命令式，要求人主动铭记；“要记住”在现代汉语中直接、自然。
- source_word: חקו
  choice: 他的定分
  rationale: חק 常指律例、定规或所定之分；本节处于哀悼和死亡的语境，“定分”既保留“被规定、被分派”的含义，也能表达死是人人共同面对的归宿，且避免“命运”可能带来的偶然或宿命色彩。
- source_word: כי הוא חקך
  choice: 因为那也是你的定分
  rationale: 该句把死者所承受的定分转向哀悼者本人。“也”明确呈现二者共有同一归宿，而不额外解释为具体死亡日期。
- source_word: לו אתמול ולך היום
  choice: 昨日是他的，今日是你的
  rationale: 原文是极简的对举，省略了临到双方的具体事物。译文保留这种诗性省略和“昨日／今日”“他／你”的鲜明对照，同时符合现代汉语表达。
theological_decisions:
- issue: 死亡语境中 חק 的含义
  choice: 定分，即死者与生者共同面对的既定归宿
  alternative: 定规／法令／定数
  rationale: 上下文讨论哀恸与死亡，而非法律诫命。“定分”最能兼顾该词“所规定、所分定”的词义和本节所说人人共有的死亡归宿；不将经文扩展为特定的宿命论主张。
- issue: 末句省略内容的处理
  choice: 保留“昨日是他的，今日是你的”的诗性省略
  alternative: 明说“死亡昨日临到他，今日也会临到你”
  rationale: 希伯来文刻意压缩，没有明说“死亡”或“末日”。保留省略可保存原文的张力，不把隐含意义写成正文中的明确断言。
- issue: 希腊平行文本与希伯来文本的关系
  choice: 正文按高置信度的希伯来文本翻译，希腊异文列入脚注
  alternative: 按希腊文译作“不要让你的心陷入悲伤；要摆脱悲伤，记住末后的事”
  rationale: 所给希伯来文本完整且验证为一致，应作为正文依据；希腊文措辞差异显著，只适合记录为重要异文和语境参照。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“定分”略带经典语体，用来承载 חק 的“规定／分定”双重意味；末句保持简短对偶，不擅自补出“死亡”一词。
