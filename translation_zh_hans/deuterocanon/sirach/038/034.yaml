  text: All these have trusted in their hands[a], and each becomes skillful in his own work.
translation:
  language: zh_hans
  text: 这些人都倚靠自己的双手[a]，各自在本职工作上显出智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文这一短语较难确定，也可理解为“被交在他们手中”或“信赖自己的双手”。正文按工匠倚靠手上技艺的可能含义翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: 这些人都
  rationale: 承接上文所列的工匠；希腊文没有明说“男人”，中文用“这些人”可自然指明所指对象。
- source_word: εἰς χεῖρας αὐτῶν ἐνεπίστευσαν
  choice: 倚靠自己的双手
  rationale: ἐμπιστεύω可表示“信靠”或“交托”，此处主动复数形式结合工匠语境，很可能指他们倚仗手上的技艺；但原文结构罕见，其他理解保留在脚注中。
- source_word: ἕκαστος
  choice: 各自
  rationale: 准确表达逐一分配的含义，也符合现代汉语表达。
- source_word: ἐν τῷ ἔργῳ αὐτοῦ
  choice: 在本职工作上
  rationale: ἔργον在上下文中指各人的工作或行业；“本职工作”自然传达所属领域，而不把范围过度缩窄为某一种手艺。
- source_word: σοφίζεται
  choice: 显出智慧
  rationale: σοφίζομαι可指有智慧、运用智慧或变得娴熟。上下文带有实用技艺的意味，但译作“显出智慧”更直接保留“智慧”主题及动词的语义张力。
