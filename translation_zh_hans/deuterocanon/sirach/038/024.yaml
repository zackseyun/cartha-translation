base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/024.yaml
  text: The wisdom of a scribe comes with the opportunity for leisure, and the one who is less occupied with his work will become wise.[a]
translation:
  language: zh_hans
  text: 文士的智慧，得于享有闲暇的时机；事务较少的人，将会变得有智慧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节现存的希伯来文本艰涩，不能与希腊文本清楚对应。正文在此主要依照较明晰的希腊文本，尤其采用“文士”以及闲暇有助于获得智慧的意思。
    reason: textual_variant
lexical_decisions:
- source_word: חכם / יתחכם || σοφία / σοφισθήσεται
  choice: 智慧／成为智慧人
  rationale: 现存希伯来文本艰涩，而希腊文清楚以“智慧”和“成为有智慧的人”构成首尾呼应。这样译保留智慧文学主题，也不对不稳定的希伯来措辞作过度推断。
- source_word: תומך מלמד || γραμματέως
  choice: 经师
  rationale: 希伯来语词组的保存形态难以确定；希腊文 γραμματεύς 明确指从事经籍研习与抄写的文士。在本语境中，“经师”比单纯的“书记”更能表达其学问身份。
- source_word: ἐν εὐκαιρίᾳ σχολῆς
  choice: 来自有闲暇的机会
  rationale: 该短语表示不受繁重事务挤压、得以从容研习的合宜时机。“有闲暇的机会”既自然，也保留 εὐκαιρία 与 σχολή 的条件意味。
- source_word: ὁ ἐλασσούμενος πράξει αὐτοῦ
  choice: 事务较少的人
  rationale: 希腊文指实际事务或劳作有所减少的人。此译简洁地表达工作负担较轻、因而有时间求取智慧的意思。
theological_decisions:
- issue: 现存希伯来文与希腊文不易对应时采用哪一文本作为主译依据
  choice: 正文依照较清楚连贯的希腊文大意，同时以脚注说明现存希伯来文的困难
  alternative: 按现存希伯来文直译为扶持某种农具、以赶牲口工具自夸的人
  rationale: 本节希伯来见证虽存，却明显艰涩且与希腊文不能顺畅对应；希腊文则形成完整连贯的箴言。选择希腊文是文本鉴别上的判断，并非为消除任何教义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“经师”体现古代 γραμματεύς 的经籍学者身份；分号保留原句两部分的平行关系。
