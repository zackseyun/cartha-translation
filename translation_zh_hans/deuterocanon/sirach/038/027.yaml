  yaml_path: translation/deuterocanon/sirach/038/027.yaml
  text: So too every craftsman and planner[a], who labors by night as by day.
translation:
  language: zh_hans
  text: 工匠和设计者也同样如此[a]：他们夜以继日地辛劳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语十分简练，直译近于“工匠和构思者”。希腊语平行文本则扩展了这幅图景，提到建造者、匠师、雕刻印章的人，以及他们不眠不休、务求完成作品。本译文以希伯来语为主，并参考希腊语来理解其中熟练构思和设计的含义。
    reason: alternative_reading
lexical_decisions:
- source_word: אף
  choice: 也同样如此
  rationale: 承接上文对各行劳动者的描述，表达类比和递进关系；比单用“也”更清楚。
- source_word: עשה חרש
  choice: 工匠
  rationale: 希伯来语表达简约，指从事熟练手工制作的人；结合希腊语 τέκτων，采用涵盖面较广的“工匠”，不限定为木匠或铁匠。
- source_word: וחשב
  choice: 和设计者
  rationale: חשב可指筹划、构思或技巧性的艺术设计；“设计者”保留其工艺与构思并重的含义，又不把它限定为现代职业名称。
- source_word: אשר
  choice: 他们
  rationale: 原文用关系词引出对这类劳动者的描述。中文改用复数代词承接并列的职业称谓，更自然。
- source_word: לילה כיום
  choice: 夜以继日
  rationale: 原意是把夜晚当作白昼一般劳作；“夜以继日”是自然、庄重的现代汉语表达，保留持续不息的含义。
- source_word: יגיע
  choice: 辛劳
  rationale: 该动词表示劳苦、费力工作；“辛劳”既体现付出的体力与精力，也符合本段语体。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“夜以继日”自然传达原文“夜如昼”的比喻；冒号使承接关系清晰。主文保持希伯来语的简洁，不纳入希腊语扩展出的雕刻与绘饰细节。
