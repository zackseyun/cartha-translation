translation:
  language: zh_hans
  text: 医生用这些减轻疼痛；调制香料的人也调制混合剂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בהם
  choice: 用这些
  rationale: 介词 ב 在此表示凭借或使用；复数代词回指上文所说的药材或受造之物。
- source_word: יניח מכאוב
  choice: 减轻疼痛
  rationale: 字面意象是使疼痛安歇、止息；现代汉语用“减轻疼痛”自然表达其医疗功效，同时不过度断言完全治愈。
- source_word: רופא
  choice: 医生
  rationale: 采用现代通行且庄重的职业名称。
- source_word: רוקח
  choice: 药剂师
  rationale: 此处所做的是配制药剂；译作“药剂师”比可能的“香料师”更符合上下文中的医药语境。
- source_word: עושה מרקחת
  choice: 配制药剂
  rationale: עושה 表示制作，מרקחת 指调和而成的制剂或混合物；“配制药剂”准确且符合现代汉语习惯。
- source_word: וכן
  choice: 也照样
  rationale: 保留“同样、如此”的承接关系，使医生使用药材与药剂师配药形成并列。
