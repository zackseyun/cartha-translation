base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/025.yaml
  text: How can one who guides the plow become wise[b][a], who drives the ox with a goad and whose concerns are with the cattle?
translation:
  language: zh_hans
  text: 扶犁的人怎能成为有智慧的人呢？[a]他赶着牛，心思都在牛群上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文的开头和句法较难确定。希腊文较明确地作：“扶着犁的人怎能成为有智慧的人呢……赶着牛……？”正文依照希伯来文，并参考希腊文说明这里的耕作场景。
    reason: alternative_reading
  - marker: b
    text: 或译：“他谈论的都是牛群。”希伯来文既可指他的心思和关注，也可能更具体地指他的谈话；希腊文较偏向“谈论”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אלוף
  choice: 扶犁的人
  rationale: 本节希伯来文开头较难确定；结合 ינהג、לשדד、בשור 所构成的耕作场景，并参照希腊文“扶着犁的人”，用职业性描述表达在田间驾牛耕作的人，不把该词定解为“首领”或“师傅”。
- source_word: ינהג
  choice: 赶着
  rationale: 该动词表示引领或驱赶；在牛耕语境中译作“赶着”自然准确。
- source_word: ישובב לשדד
  choice: 扶犁
  rationale: 这些词形及其句法关系较难确定，但语义场指向往返耕作、破土；希腊文明确提到犁。译作“扶犁”清楚呈现农业场景，同时不在正文中加入希伯来文未明确出现的赶牛棒。
- source_word: בשור
  choice: 牛
  rationale: 介词短语可表示“用牛”或“与牛一起”；汉语按耕作场景自然表达为赶牛耕作。
- source_word: שעיותיו
  choice: 心思都在
  rationale: 该词可指思虑、关注，也可能指言谈。正文采用范围较广且自然的“心思”，并以脚注保留“谈论”的可能。
- source_word: בני בקר
  choice: 牛群
  rationale: 字面为“牛的子孙”，在此泛指牛类牲畜；“牛群”符合现代汉语，也保留其职业生活围绕牛只的图景。
