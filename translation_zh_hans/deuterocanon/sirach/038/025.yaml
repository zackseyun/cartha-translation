translation_notes:
  register: 采用现代、庄重而通俗的表达。“扶犁”“赶着牛”呈现具体农耕图景；疑问句保留本节关于劳作与获得智慧之间张力的修辞语气，不将其扩展为对劳动者价值的神学判断。
