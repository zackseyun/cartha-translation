  yaml_path: translation/deuterocanon/sirach/038/035.yaml
  text: but they will sustain the order of the age[b][a], and their prayer is in the work of their craft.
translation:
  language: zh_hans
  text: 但他们维系世间的秩序[a]；他们的祈求就在从事技艺的劳作中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们使长存的结构稳固”，又或“他们建立世间的受造秩序”。希腊语“κτίσμα αἰῶνος”含义凝练，既可指社会赖以延续的结构，也可广指世间既有的受造秩序。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为：“他们的恳求关乎技艺的劳作”，或“他们在技艺的劳作中祈求。”原文把祈求与熟练的劳动联系起来，却没有明确说明二者究竟是目的、伴随关系，还是劳动本身成为祈求的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: 但
  rationale: 承接上文工匠不能参与议事和公共职务的描述，表达鲜明而自然的转折。
- source_word: κτίσμα αἰῶνος
  choice: 世间的秩序
  rationale: κτίσμα本指受造或造成之物，αἰῶνος可指时代、世间或长久延续的领域；结合工匠支撑社会生活的语境，译作“世间的秩序”较为自然，同时以脚注保留“受造结构、长存建制”等可能含义。
- source_word: στηρίσουσιν
  choice: 维系
  rationale: στηρίζω有使稳固、支撑、建立之义；此处强调工匠借劳动使共同生活得以稳固延续，“维系”贴合语境，又不把动作限于一次性的建立。
- source_word: ἡ δέησις αὐτῶν
  choice: 他们的祈求
  rationale: δέησις通常指恳求、祷告；“祈求”既保留请求意味，也保持宗教语境中的开放性。
- source_word: ἐν ἐργασίᾳ τέχνης
  choice: 就在从事技艺的劳作中
  rationale: 保留ἐν所表达的范围或处境，不断定劳作本身等同于祷告；τέχνη在上下文中指工匠的专门技艺。
theological_decisions:
- issue: “他们的祈求在技艺的劳作中”如何理解
  choice: 译文保留祈求与技艺劳动紧密相连的表达，不明确断言劳动本身就是祷告。
  alternative: 可理解为他们为工作成功而祈求，或祈求伴随着劳动。
  rationale: δέησις通常表示祈求，而ἐν ἐργασίᾳ τέχνης只说明祈求处于技艺劳动的范围或情境中；原文没有进一步界定二者关系，因此不应替作者消除张力。
- issue: κτίσμα αἰῶνος所指的范围
  choice: 正文采用社会语境较自然的“世间的秩序”，并以脚注保留原文可指长存结构或受造秩序的歧义。
  alternative: 可译为“时代的建制”“长存的结构”或“世间的受造秩序”。
  rationale: 上下文谈各类工匠对共同生活的贡献，但短语本身紧凑，可能具有比社会制度更宽广的受造界含义。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“世间的秩序”便于普通读者理解；“从事技艺的劳作”略带书面色彩，以呼应智慧文学语体，同时避免“手艺活”过于口语。两个脚注标记均置于正文相关短语之后。
