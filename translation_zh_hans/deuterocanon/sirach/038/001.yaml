  text: Honor the physician according to your need of him[a], for God has also given him a portion.
translation:
  language: zh_hans
  text: 当你需要医生时，要尊重他[a]，因为他也从上帝得了一份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或依希腊文译作：“要因医生的服务而尊荣他，因为主也创造了他。”希伯来文较直译为：“因为他也有一份来自上帝的分。”
    reason: alternative_reading
lexical_decisions:
- source_word: רעי
  choice: 尊重
  rationale: 该命令可指重视、善待或尊荣；希腊平行文本的 Τίμα（尊荣）支持“尊重”，既自然，又不过分强化礼仪性的尊崇。
- source_word: רופא
  choice: 医生
  rationale: רופא 指医治者或医师；“医生”是现代普通话中最自然、清楚而庄重的称呼。
- source_word: לפני צרכו
  choice: 按你对他的需要
  rationale: 希伯来语短语简略，涉及需要或必要性；此译保留“需要他”这一关系，也避免把希腊文本可能涉及的酬谢直接写入正文。
- source_word: חלק אל
  choice: 从上帝得了一份职分
  rationale: חלק 本义为份、分或所分得的部分；结合语境，“一份职分”表达医生从上帝所得的分与位置，同时避免含混的中文“一份”。
theological_decisions:
- issue: 尊重医生的神学依据
  choice: 因为他也从上帝得了一份职分
  alternative: 因为主也创造了他
  rationale: 现存希伯来文本以“份”（חלק）说明医生的地位来自上帝，希腊文本则说主创造了他。正文优先依据希伯来文，脚注保留希腊异文，不将两种表达混为一谈。
translation_notes:
  register: 采用现代、清楚而庄重的智慧文学语体。“尊重”适合当代普通读者；“职分”用于使 חלק 在本节中的社会与神学含义明确，但脚注保留其更直译的“一份”。
