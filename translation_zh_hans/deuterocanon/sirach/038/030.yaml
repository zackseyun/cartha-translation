  yaml_path: translation/deuterocanon/sirach/038/030.yaml
  text: He will apply his heart to the completion of his work[a], and his wakefulness is to bring it to perfection.
translation:
  language: zh_hans
  text: 他专心致力于完成各项工作；他不眠不休，为要将它们修整妥当，直至完成。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于：“他把自己的心投入诸般工作的完成；他的不眠，是为要修饰，直到完成。”后半句的结构很简练。κοσμῆσαι可指“装饰”“整理”或“使之合宜”；ἐπὶ συντελείας可理解为“为达到完成”“直到完成”，也可能指收尾阶段。
    reason: 原文后半句结构压缩，需说明κοσμῆσαι与ἐπὶ συντελείας的可能含义，同时避免将其固定为“完工之后”。
lexical_decisions:
- source_word: καρδίαν αὐτοῦ δώσει εἰς
  choice: 他专心致力于
  rationale: 直译为“他会把自己的心放在……上”。这里“心”指人的心思、意志和专注；译为“专心致力于”既传达希腊语习惯用法，也符合现代汉语表达。
- source_word: συντέλειαν ἔργων
  choice: 完成各样作品
  rationale: συντέλεια 在此指工作达到完成阶段；ἔργων 是复数，在工匠语境中可指所制作的各样作品。保留复数含义，避免把原文限缩为一件作品。
- source_word: ἀγρυπνία αὐτοῦ
  choice: 彻夜不眠
  rationale: ἀγρυπνία 可指不睡、警醒或殷勤守候。此处描述工匠为工作付出的专注努力，“彻夜不眠”保留了原文具体而有力度的意象。
- source_word: κοσμῆσαι
  choice: 把它们修饰妥当
  rationale: κοσμέω 可指装饰、整理或使之井然有序。在手工艺语境中，“修饰妥当”兼顾最后加工与使作品达到合宜状态的含义，不把它过度解释为抽象的“完美”。
- source_word: ἐπὶ συντελείας
  choice: 在完工时
  rationale: 这一压缩短语可理解为“到完成之时”“为了完成”或“在最后工序上”。正文采用“在完工时”，保留其与收尾阶段的联系，相关歧义在脚注中说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“专心致力于”自然表达“把心放在……上”的希腊语习惯用法；后半句保留“彻夜不眠”的具体形象，并用“修饰妥当”呈现工匠收尾、整理和装饰作品的含义。
