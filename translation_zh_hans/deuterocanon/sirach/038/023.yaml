  text: A scribe’s wisdom increases wisdom[a], and one free from busyness will become wise.
translation:
  language: zh_hans
  text: 文士的智慧使智慧增多；少受事务牵累的人[a]会变得有智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“缺少事务（或营生）的人”。这里可指较少受职业或日常事务牵累、因而有余暇的人；并非赞美失业或完全无所事事。
    reason: 说明 עסק 的语义范围，并避免将其误解为绝对没有工作。
lexical_decisions:
- source_word: חכמת
  choice: 智慧
  rationale: 该词在这里指智慧，不宜缩窄为技巧或学问；与后半句“成为有智慧的人”相呼应。
- source_word: סופר
  choice: 经师
  rationale: 在《便西拉智训》的语境中，此词指从事经典研习与传授的文士；“经师”比单纯的“书记”或“写字的人”更能表达其社会与学术角色。
- source_word: תרבה
  choice: 使……增长
  rationale: 保留希伯来语使役、增益的意味，也不消解原文“智慧使智慧增长”的修辞性重复。
- source_word: וחסר עסק
  choice: 少有事务缠身的人
  rationale: 原文直译近于“缺少事务／营生的人”；结合上下文，重点是较少受日常职业事务牵制，而不是失业或完全无事可做。
- source_word: יתחכם
  choice: 必能成为有智慧的人
  rationale: 该反身词形在此表示逐渐获得或达到智慧；“成为有智慧的人”自然地传达这一过程。
theological_decisions:
- issue: 智慧增长与闲暇之间的关系
  choice: 按原文并列陈述，不把它改写成绝对因果律
  alternative: 解释为只有脱离工作的人才能获得智慧
  rationale: 原文赞扬有余暇研习智慧，却没有贬低一切劳动，也没有断言忙于职业者绝不可能有智慧。
- issue: 希伯来文本与所给希腊平行文本内容不一致
  choice: 以标为高可信度且验证一致的希伯来文本为正文依据
  alternative: 按希腊文译作关于死者、追念与安慰的内容
  rationale: 所给希腊文与希伯来文并非同一内容，可能反映节号或文本对应问题；在本任务中应优先翻译明确指定的希伯来语源文，而不将两者强行调和。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“经师”保留古代文士兼学者的身份；“使智慧增长”刻意保留原文的重复和张力。所给希腊平行文本内容与希伯来正文完全不同，因此未据希腊文改动本节正文。
