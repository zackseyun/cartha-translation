  text: Even to me he will not pay attention[a], and who will consider my ways?
translation:
  language: zh_hans
  text: 就连我，他也不会留意。[a] 谁会思量我的行事呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“他”按上下文是指上主，但希伯来文没有明说主语；原文直译为“他不会把心放在我身上”。
    reason: 说明隐含主语及希伯来语惯用表达
lexical_decisions:
- source_word: גַּם עָלַי
  choice: 连我
  rationale: גַּם 在此增添说话者的设想，译作“连”自然传达“甚至对我”的语气；עָלַי 与“留意”搭配，表达“对我”。
- source_word: לֹא יָשִׂים לֵב
  choice: 不会留意
  rationale: שׂים לב 字面为“把心放在”，是留心、注意的惯用语；“不会留意”简洁自然，也保留内在关注之意。
- source_word: וּבִדְרָכַי
  choice: 我的行径
  rationale: “道路”在此指人的行为和生活方式；“行径”能在现代汉语中传达这一含义，而不把介词 ב 生硬译出。
- source_word: מִי יִתְבּוֹנָן
  choice: 谁会细察
  rationale: התבונן 表示用心察看、思量或理解；“细察”保留其审慎关注的力度，并适合反问语气。
theological_decisions:
- issue: 动词 יָשִׂים 的隐含主语所指
  choice: 正文保留第三人称“他”，不明说是谁
  alternative: 译为“上主不会留意我”或“没有人会留意我”
  rationale: 希伯来文动词含单数阳性主语，但未在本句点明。上下文可使读者理解为上主，然而直接补出“上主”会消除原文形式上的含蓄；译成“没有人”则会把单数主语泛化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“连我”保留 גַּם 的递进语气；“行径”表达 דְּרָכַי 所指的行为和生活道路。脚注标记置于整节末尾，涵盖本句隐含主语的说明。
