base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/013.yaml
  text: An unjust one will not escape with plunder[a], and the desire of the righteous will never fail.
translation:
  language: zh_hans
  text: 不义之人不能借劫掠逃脱，也不能使义人的愿望永远止息。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“罪人不能借劫掠逃脱，敬虔之人的忍耐也必不迟延。”希伯来文后半句直译为：“他不能使义人的愿望永远止息。”
    reason: 希腊文与希伯来文在后半句的主语、宾语和谓语意义上均有明显差异；脚注保留这一重要异文，同时说明正文所据的希伯来文结构。
lexical_decisions:
- source_word: לֹא יִמָּלֵט
  choice: 不能……逃脱
  rationale: מלט 的尼法勒式表示“逃脱、获救”；这里与希腊文 ἐκφεύξεται 相符，按审判语境译为“不能逃脱”自然明确。
- source_word: בְּגָזֵל
  choice: 靠劫掠
  rationale: גזל 指抢夺、劫掠；介词 בְּ 可表示手段，因此译作“靠劫掠”，表达不义之财不能成为逃脱的手段。
- source_word: עַוָּל
  choice: 不义的人
  rationale: עַוָּל 指行事不公或邪恶的人；“不义的人”比“罪人”更贴近希伯来词本身，同时保留其与后句“义人”的鲜明对照。
- source_word: וְלֹא יַשְׁבִּית
  choice: 也不能使……永远止息
  rationale: שבת 的使役式意为“使停止、使止息”。译文保留使役结构，并让前句的“不义的人”作为延续的主语，避免将其改写成愿望自行落空。
- source_word: תַּאֲוַת צַדִּיק
  choice: 义人的愿望
  rationale: תַּאֲוָה 表示愿望、渴望；צַדִּיק 为泛指单数，译作“义人”既简洁，也保留智慧文学中的道德类别。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 该词表示长久、永远；置于“止息”前，保留其可能修饰使役行动持续时间的表达，而不直接解释为愿望必然实现。
theological_decisions:
- issue: עַוָּל 与希腊文 ἁμαρτωλός 的道德称谓差异
  choice: 不义的人
  alternative: 罪人
  rationale: 主文本优先遵循高可信度的希伯来文；“不义的人”准确反映 עַוָּל，并与“义人”形成原文的对应。希腊文较宽泛的“罪人”不取代希伯来读法。
- issue: 后半句的主语及语义
  choice: 不义的人不能使义人的愿望永远止息
  alternative: 义人的愿望永不落空；敬虔之人的忍耐必不迟延
  rationale: 希伯来文的使役动词 יַשְׁבִּית 最自然地承接前句的“不义的人”为主语，意为他不能使义人的愿望止息。希腊文则将“敬虔者的忍耐”作为主语，并使用“迟延”，差异显著，故在脚注中完整保留。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“劫掠”保留智慧文学的审判语气；“不能使……永远止息”略具书面色彩，但能准确呈现希伯来文使役结构及其未被消解的张力。
