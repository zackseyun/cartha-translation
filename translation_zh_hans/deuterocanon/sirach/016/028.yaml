  text: Each one did not oppress his neighbor[a], and they will never disobey his word.
translation:
  language: zh_hans
  text: 各自不挤迫相邻者；它们永远不会违背他的话[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的话”也可译作“他的命令”；希腊文“话”在这里可含有吩咐或命令的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: 各自都
  rationale: 保留希腊文逐一分配的单数意味，同时以自然汉语表达整体中的每一个。
- source_word: τὸν πλησίον αὐτοῦ
  choice: 邻近的另一个
  rationale: πλησίον本义是近旁者；本段描述受造秩序，用“邻近的另一个”既保留空间关系，也不把它过早限定为人际伦理中的“邻舍”。
- source_word: οὐκ ἔθλιψεν
  choice: 不挤迫
  rationale: θλίβω可指挤压、逼迫或压迫；在各受造之物彼此相邻而秩序井然的语境中，“挤迫”较能兼顾物理挤压与侵扰之意。
- source_word: ἕως αἰῶνος
  choice: 永远不会
  rationale: 在否定句中以“永远不会”自然表达持续无尽的时间意味。
- source_word: οὐκ ἀπειθήσουσι
  choice: 不会违背
  rationale: 保留将来时和不顺从、拒不听从的基本含义；“违背”与后面的“话”搭配自然。
- source_word: τοῦ ῥήματος αὐτοῦ
  choice: 他的话
  rationale: ῥῆμα可指话语、吩咐或命令；译作“话”保留其语义宽度，不擅自窄化为“命令”。
theological_decisions:
- issue: “他的话”中“他”的所指
  choice: 保留男性单数代词“他”，由上下文暗示上帝
  alternative: 明确译作“上帝的话”
  rationale: 在本段受造秩序的描述中，上帝最自然地是所指，但希腊文仅用代词；保留“他”可避免把隐含所指改成明说。
- issue: 前半句是伦理压迫还是受造物之间的挤压
  choice: 按受造秩序语境译作“不挤迫”
  alternative: “不压迫邻舍”
  rationale: θλίβω容许两种意味，但上下文更像描写各受造之物各守其位；译文仍用“挤迫”保留一定的引申空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“各自都……它们……”反映希腊文由分配性单数转为复数的结构；分号使两个并列陈述清楚连贯。
