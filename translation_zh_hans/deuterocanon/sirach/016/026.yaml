  yaml_path: translation/deuterocanon/sirach/016/026.yaml
  text: When God created his works from the beginning[a], he assigned their dominion over their living things.
translation:
  language: zh_hans
  text: 起初，上帝创造万物时，就为其中的生灵划定了各自的管辖范围[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半句的希伯来文本难解，约可直译为：“在（或关于）它们的生命之上，他划分了它们的统辖。”希腊译本则意为：“主的作为从起初就在他的判定之下；从造它们之时，他划分了它们的份额。”这支持这里所表达的：上帝为受造界划分秩序或范围。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּבְרֹא
  choice: 创造……时
  rationale: כ־与不定式连用，在这里自然表达时间关系，即“当……创造时”。
- source_word: אֵל
  choice: 上帝
  rationale: אֵל在此是通常的神圣称号，直接译为“上帝”，不增添原文没有的限定。
- source_word: מַעֲשָׂיו
  choice: 他的作品
  rationale: 字面意为“他的工作／所造之物”；在创造语境中，“他的作品”既保留原文措辞，也可指上帝所造的一切。
- source_word: מֵרֹאשׁ
  choice: 从起初
  rationale: 表示自开端以来；也与希腊平行文本ἀπ’ ἀρχῆς相符。
- source_word: עַל חַיֵּיהֶם
  choice: 为其中的生灵
  rationale: 传世希伯来文本此处难解，字面可能涉及“在／关于它们的生命之上”。结合上下文与后续的秩序、管辖用语，译作“为其中的生灵”，但以脚注明确其不确定性。
- source_word: חָלָק
  choice: 划定
  rationale: 该词根表达分开、分配或分给；“划定”适合与管辖范围搭配，并传达创造秩序中的分配动作。
- source_word: מִשְׁטָרָם
  choice: 各自的管辖范围
  rationale: מִשְׁטָר可指统辖、治理或有序安排。“管辖范围”保留统辖含义，同时结合希腊文本“各自的份额”所支持的划分观念。
theological_decisions:
- issue: 文本有疑义的创造秩序用语
  choice: 把本节译为上帝在创造之初为受造界中的生灵划定各自的管辖范围。
  alternative: 较直译但晦涩地译为：“在它们的生命之上，他划分了它们的统辖。”或依希腊文本译为：“主的作为从起初就在他的裁断中；他一造它们，便划分了它们各自的份额。”
  rationale: 以现存希伯来文为主要依据，同时用希腊平行文本确认“划分／分配秩序”的大意。正文求自然可懂，脚注则保留第二分句在文本和语义上的不确定性，不据此引申额外教义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“他的作品”保留创造者与受造之物的原文联系；后半句采用适度意译，并借脚注交代希伯来文本的艰涩与希腊平行文本的不同见证。
