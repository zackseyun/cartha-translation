  text: And he did not spare Lot’s neighbors[b][a], who became arrogant in their pride.
translation:
  language: zh_hans
  text: 他没有饶过罗得寄居之处的人[a]；他们在自己的骄傲中狂妄自大[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗得寄居之处的人”所译的希伯来语较少见，也可理解为“罗得的邻居”或“罗得所寄居群体的人”。希腊文作“罗得寄居的群体”。
    reason: lexical_alternative
  - marker: b
    text: 这句希伯来语的词形较难，正文按现存希伯来文理解为“在骄傲中狂妄自大”。希腊文则可译为：“他因他们的骄傲而憎恶他们。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: 他也没有宽恕
  rationale: חמל 可表示怜惜、顾惜或饶过；在审判的语境中，“没有宽恕”自然地表达未予饶恕之意，并与希腊文 οὐκ ἐφείσατο 相符。
- source_word: מְגוּרֵי לוֹט
  choice: 与罗得同住的人
  rationale: מְגוּרֵי 源于 גור，涉及寄居、居住；此处后接复数分词，语境指与罗得居住之地相关的人群。“与罗得同住的人”比直接译作“所多玛人”更贴近原文措辞，也比生硬的“罗得的寄居者”更符合现代汉语。
- source_word: הַמִּתְעַבְּרִים
  choice: 狂妄自大
  rationale: 此词形较难，但按马所拉式标音可联系 עבר 的反身词干，在这里表达逞强、狂傲的行为；结合 בְּגַאֲוָתָם，译为“狂妄自大”通顺且保留其行为色彩。希腊文则反映“被憎恶”的理解，故列入脚注。
- source_word: בְּגַאֲוָתָם
  choice: 因自己的骄傲
  rationale: 介词 בְּ 在此可作状态、方式或原因理解；希腊文 διὰ 明确支持原因义。“因自己的骄傲”在汉语中清楚表达骄傲与受审判行为之间的关联。
theological_decisions:
- issue: “与罗得同住的人”的所指
  choice: 保留为与罗得居住之处相关的人群
  alternative: 直译为“罗得寄居之地”或明确译作“所多玛人”
  rationale: 经文背景显然让人联想到所多玛居民，但希伯来文没有直接使用“所多玛人”一词。正文保留原文的间接说法，避免把历史所指直接代入文本。
- issue: הַמִּתְעַבְּרִים 的理解
  choice: 他们因骄傲而狂妄自大
  alternative: 上帝因他们的骄傲而憎恶他们／他们因骄傲而变得可憎
  rationale: 希伯来词形艰难，可理解为狂傲逞强；希腊平行文本则作“他因他们的骄傲而憎恶他们”。正文优先依据现存希伯来文，脚注保存希腊见证所代表的另一读法，不消除文本张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“与罗得同住的人”既使普通读者易懂，又保留原文没有直接点名所多玛人的含蓄表达；分号呈现审判对象与其骄傲行为之间的紧密关系。
