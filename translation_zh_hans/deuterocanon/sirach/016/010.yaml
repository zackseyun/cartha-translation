  text: So also six hundred thousand foot soldiers[b][a], gathered together in the arrogance of their heart.
translation:
  language: zh_hans
  text: 同样，那些聚集在一起、心怀狂妄的六十万步兵[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “六十万步兵”可能暗指以色列人在旷野中的那一代人；参《出埃及记》12:37和《民数记》11:21所载的传统人数。
    reason: cross_reference
  - marker: b
    text: “狂妄”也可译作“傲慢”“放肆”或“妄自尊大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: 同样
  rationale: 承接上文，继续列举受审判的例子；“同样”自然保留其连接和类比作用。
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: 六十万
  rationale: 直接对应希伯来文数目，也符合现代汉语表达。
- source_word: רַגְלִי
  choice: 步兵
  rationale: 本词指徒步之人，在此有军事或人口编组语境；希腊文 πεζῶν 亦支持“步兵”。
- source_word: הַנֶּאֱסָפִים
  choice: 聚集在一起
  rationale: 保留 אסף 被动分词所表达的聚集、集合之意，同时使汉语句子流畅。
- source_word: בִּזְדוֹן
  choice: 狂妄
  rationale: זדון 表示傲慢、放肆、自恃妄为；“狂妄”在现代汉语中简明自然，并保留其道德贬义。
- source_word: לִבָּם
  choice: 心中
  rationale: 希伯来文为带复数属格后缀的集合性单数“他们的心”；汉语用“心中”可自然表达全体共同的内在态度，而不必强行标明单复数。
theological_decisions:
- issue: 六十万人的身份
  choice: 正文不明说他们是以色列人或旷野世代，仅以脚注指出可能的典故。
  alternative: 在正文中直接译作“以色列那六十万步兵”或“旷野世代的六十万人”。
  rationale: 数目很可能让人联想到出埃及及旷野时期的人口数字，但本节希伯来文本身未明确点名；正文保留隐含指涉，可避免把合理推断写成明说。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“步兵”保留原文“徒步者”的具体含义；逗号结构体现原文片段式的历史例证，并避免补入原文没有明说的谓语或审判结果。脚注标记按其所说明的词语分别安置。
