base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/027.yaml
  text: He ordered his works forever[a], and their beginnings for their generations; they neither hungered nor grew weary, and they did not cease from their works.
translation:
  language: zh_hans
  text: 他使他的作为永远井然有序，也使它们的开端延续到世世代代[a]；它们既不饥饿，也不疲倦，也没有停止自己的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开端”也可译“本原”。希腊词也可能指权柄、辖域或所承担的职能；结合上下文，有人理解为上帝为受造之物所定的功能或范围。
    reason: 保留 τὰς ἀρχὰς αὐτῶν 的词义和所指歧义，不将一种语境性解释写成正文的唯一含义。
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: 使……井然有序
  rationale: 该动词在此创造秩序的语境中指安排、整顿，使受造之物各得其序，并非侧重装饰。
- source_word: εἰς αἰῶνα
  choice: 永远
  rationale: 表达所设秩序持久不变；“永远”是自然、庄重的现代汉语。
- source_word: τὰ ἔργα αὐτοῦ
  choice: 自己的工程
  rationale: 这里指上帝所造并安排的万物。“工程”既保留“作品、工作”的宽泛含义，也适合宏观的创造语境。
- source_word: τὰς ἀρχὰς αὐτῶν
  choice: 各自的职分
  rationale: ἀρχάς 可指开端，也可涉及权柄、统辖或所辖领域。结合下文受造之物持续执行工作，此处译作“职分”可表达各自获派的作用范围，同时以脚注保留“开端”的真实歧义。
- source_word: εἰς γενεὰς αὐτῶν
  choice: 世世代代
  rationale: 表示在它们相继的世代中持续不变；此译符合现代汉语习惯。
- source_word: οὔτε ἐπείνασαν οὔτε ἐκοπίασαν
  choice: 既不饥饿，也不疲倦
  rationale: 保留两个并列否定及拟人化表达；κοπιάω 在此强调因劳作而疲乏。
- source_word: οὐκ ἐξέλιπον ἀπὸ τῶν ἔργων αὐτῶν
  choice: 从不停止自己的工作
  rationale: ἐκλείπω 在此有停止、衰竭或失职之意；结合 ἀπό 短语，译文突出它们持续履行工作。
theological_decisions:
- issue: τὰς ἀρχὰς αὐτῶν 所指的是受造物的开端，还是受造秩序中的职权或功能范围
  choice: 正文采用“各自的职分”，理解为上帝给受造之物所定的持续功能与范围。
  alternative: 可直译为“它们的开端”，指其起源或初始原则延续于各世代。
  rationale: 上下文强调受造万物按秩序持续工作，不饥饿、不疲倦、也不停止，因此功能或职分的理解较连贯；但 ἀρχή 的“开端”义十分常见，不能排除，故以脚注明示。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“井然有序”呈现创造秩序；“职分”简明表达受造物获派的作用，又不把它们具体化为某种宗派性的天使阶级。
