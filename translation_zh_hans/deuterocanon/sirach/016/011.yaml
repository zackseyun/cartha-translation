base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/011.yaml
  text: Even if one person is stiff-necked[a], it is astonishing if he will be cleared; for mercy and anger are with him, and he bears and forgives[b], but upon the wicked he lets his wrath rest.
translation:
  language: zh_hans
  text: 即使只有一人硬着颈项，他若能免罪[a]，也实在令人惊奇。因为怜悯与愤怒都在他那里；他担当，也赦免，却让自己的烈怒停留在恶人身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “免罪”也可译作“获判无罪”或“不受惩罚”。希伯来语 יִנָּקֶה 和希腊语 ἀθῳωθήσεται 都带有司法意味，指从罪责或刑罚中获释。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“让他的烈怒停留在恶人身上”，描绘烈怒落下并停驻于他们身上的形象，并非只是怒气一时发作。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְשֶׁה עֹרֶף / σκληροτράχηλος
  choice: 硬着颈项
  rationale: 保留希伯来语及希腊语共有的身体隐喻，表达顽梗抗拒；现代读者也能从语境理解，且比单译“固执”更贴近原文形象。
- source_word: תֵּמַהּ זֶה / θαυμαστὸν τοῦτο
  choice: 也实在令人惊奇
  rationale: 传达原文对这种可能性的惊异语气，同时采用自然、庄重的现代汉语。
- source_word: יִנָּקֶה / ἀθῳωθήσεται
  choice: 免罪
  rationale: 兼顾“被判无罪、免受罪责或刑罚”的司法性含义；脚注保留“获判无罪、不受惩罚”等可能表达。
- source_word: רַחֲמִים
  choice: 怜悯
  rationale: 准确表达带有慈悲行动意味的 mercy，并与后文“愤怒”形成原文中的鲜明张力。
- source_word: אַף
  choice: 愤怒
  rationale: 此处是表示怒气的名词，并非“也”；用“愤怒”与后面的“烈怒”适度区分措辞。
- source_word: וְנוֹשֵׂא
  choice: 他担当
  rationale: 保留 נשׂא 的“承担、背负”语义及原文的简约性，不擅自限定所担当的是罪、冒犯还是罪人。
- source_word: וְסוֹלֵחַ
  choice: 也赦免
  rationale: 这是该动词在神赦罪语境中的常见意义；“赦免”比一般的“原谅”更契合庄重语域。
- source_word: יַנִּיחַ רָגְזוֹ
  choice: 让自己的烈怒停留
  rationale: 保留使烈怒落下并停驻于恶人身上的原文意象，而不弱化为一时发怒，也不强化成原文未明说的爆发。
theological_decisions:
- issue: 上帝同时具有怜悯与愤怒
  choice: 直译二者都“在他那里”，并并列呈现担当、赦免与烈怒停留在恶人身上。
  alternative: 淡化愤怒，只突出怜悯；或把愤怒解释为短暂不悦。
  rationale: 希伯来文本明确并置怜悯和愤怒，继而并置赦免与对恶人的烈怒；译文保留这种神学张力，不替文本加以调和。
- issue: 顽梗之人是否可能免罪
  choice: 保留条件式陈述及惊异语气：“他若能免罪，也实在令人惊奇。”
  alternative: 将其绝对化为“他绝不能免罪”，或解释为“他竟逃脱了惩罚”。
  rationale: 希伯来语与希腊语表达的是对其获释无罪这一可能性的惊异，并未直接改写成绝对否定；译文不消除其修辞上的开放性。
translation_notes:
  register: 采用现代、庄重而可读的简体中文。“硬着颈项”保留圣经性的具体隐喻；“免罪”“赦免”“烈怒”维持司法与神学语域。句法略作汉语化处理，但保留原文的条件关系、惊异语气，以及怜悯和愤怒并置的张力。
