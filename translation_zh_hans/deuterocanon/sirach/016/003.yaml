base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/003.yaml
  text: Do not trust in their life[a], and do not rely on their future; for one who does what is pleasing is better than a thousand[c][b], and to die childless than to have many children in unrighteousness and a lawless end.
translation:
  language: zh_hans
  text: 不要信赖他们的生命[a]，也不要倚靠他们的将来[b]，因为他们不会有美好的结局。一个行蒙悦纳之事的人，胜过一千人[c]；无儿无女而死，胜过有许多在不义中的儿女的人，也胜过狂妄的结局。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们的生命”也可译作“他们活着的时候”或“他们活着时的景况”；这里可能指那些儿女当下看似兴盛的生命。
    reason: lexical_alternative
  - marker: b
    text: “他们的将来”所译的希伯来词字面与“脚跟、随后而来之事”有关，也可理解为“后果”或“结局”，在本语境中还可能含有“后代”的意味。希腊文本则作“不要看重他们的地位（或位置）”。
    reason: textual_variant
  - marker: c
    text: “行蒙悦纳之事”也可译作“遵行旨意”；这里很可能指行上帝所喜悦的事，但原文没有明说“上帝”。末句的希伯来文十分紧凑：“无儿无女而死”可与“有许多在不义中的儿女的人”比较，末尾也可另作“胜过狂妄（或擅行）的结局”。其具体句法关系不能完全确定。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּאֲמִין בְּחַיֵּיהֶם
  choice: 不要信赖他们眼前的生命
  rationale: אמן 的使役式在此表示把信心寄托于某事，而非仅仅相信其真实性。“眼前的生命”保留 חַיִּים 的生命含义，也提示这里所警告的是不可因其当下活着或兴盛而放心。
- source_word: וְאַל תִּבְטַח בְּעִקְבוֹתָם
  choice: 也不要倚靠他们的将来
  rationale: בטח 表示倚赖以求稳妥；עִקְבוֹתָם 字面与“脚跟、随后而来之事”有关，在下句“美好的结局”的语境中可指将来、后果或结局。正文采用自然且保留前瞻意味的“将来”，并以脚注说明异文与歧义。
- source_word: אַחֲרִית טוֹבָה
  choice: 美好的结局
  rationale: אַחֲרִית 可指末后、结局或最终结果。此处独立成句，希伯来文本明确说他们不会有美好的结局，因此予以保留。
- source_word: טוֹב אֶחָד ... מֵאָלֶף
  choice: 一个……的人，胜过一千人
  rationale: 希伯来语采用省略式比较结构，希腊平行文本也支持“一人胜过千人”。中文补足“人”以使句子完整。
- source_word: עוֹשֶׂה רָצוֹן
  choice: 行所悦纳之事的人
  rationale: רָצוֹן 可表示意愿、喜悦或蒙悦纳之事。智慧文学语境很可能暗含上帝的悦纳，但原文没有明说对象，故正文不增添“上帝”。
- source_word: עֲרִירִי
  choice: 无儿无女
  rationale: 该词指没有后代或被剥夺儿女；“无儿无女”是清楚自然的现代汉语表达。
- source_word: בְּעַוְלָה
  choice: 活在不义中
  rationale: עַוְלָה 表示不义、邪恶或不公。“活在不义中”在中文里自然地说明众多儿女受不义所标记，同时未把名词弱化为笼统的“坏”。
- source_word: זָדוֹן
  choice: 狂妄邪恶
  rationale: זָדוֹן 兼有狂妄、僭越、故意作恶等意味；“狂妄邪恶”比单用“无法无天”更贴近其道德傲慢的色彩。
theological_decisions:
- issue: “行所悦纳之事”的悦纳者是否明确为上帝
  choice: 正文保留隐含对象，不添加“上帝”。
  alternative: 译作“遵行上帝旨意的人”或“行上帝所喜悦之事的人”。
  rationale: 上下文很可能具有神学指向，但希伯来原文只说 עוֹשֶׂה רָצוֹן，并未明示上帝；保留这一含蓄性可避免把合理推断写成明文。
- issue: 无儿女而死与拥有众多不义儿女之间的价值比较
  choice: 保留原文直截了当的比较，不作缓和。
  alternative: 将其解释性改写为“与其有不敬虔的儿女，不如没有儿女”。
  rationale: 经文刻意把义置于后代数量之上。正文维持其尖锐张力，同时不把它扩展为对所有无子女者或父母的普遍评价。
- issue: 是否保留“他们不会有美好的结局”一整句
  choice: 按现存希伯来文本明确译出。
  alternative: 依希腊平行文本省略此句，或仅把它融入“将来”一词。
  rationale: 指定的希伯来来源在此有完整分句 כִּי לֹא תִהְיֶה לָהֶם אַחֲרִית טוֹבָה。既然希伯来文本在此可读且来源置信度高，应优先翻译，不能因英译咨询层省略而删去。
- issue: 末句压缩结构的理解
  choice: 理解为众多儿女活在不义中，并最终有狂妄邪恶的结局。
  alternative: 将末语另译为“胜过出于狂妄邪恶的后代”或“胜过狂妄邪恶的结局”。
  rationale: 希伯来语末尾 וּמֵאַחֲרִית זָדוֹן 高度压缩，语法关系并不完全明朗。正文给出与前文“结局”相呼应、中文可读的理解，脚注保留其他可能。
translation_notes:
  register: 采用庄重而现代的标准普通话，保留智慧文学警句式的对比力度。正文优先遵循现存希伯来文本，并以脚注交代希腊异文、关键词义范围及末句的语法压缩；避免加入原文未明说的神学对象。
