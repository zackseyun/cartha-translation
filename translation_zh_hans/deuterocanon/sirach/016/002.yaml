base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/002.yaml
  text: Even if they become many[a], do not delight in them, if the fear of Yahweh is not with them.
translation:
  language: zh_hans
  text: 即使他们人数增多，他们中间若没有对耶和华的敬畏，也不要因他们而欢喜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语这里的措辞略不明晰；希腊语平行文本作“不要因他们而欢喜”，支持“欢喜”或“喜悦”这一含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִם / ἐὰν
  choice: 即使
  rationale: 这里引出让步条件；“即使”自然表达“纵然如此”的语气，也与希腊语条件句相符。
- source_word: פָּרוּ / πληθύνωσιν
  choice: 人数增多
  rationale: 希伯来语动词可指繁衍、增多，希腊语平行文本也明确指数量增加；“人数增多”既适合上下文，又不额外强调生育过程。
- source_word: אַל תָּבֻעַ בָּם / μὴ εὐφραίνου ἐπʼ αὐτοῖς
  choice: 不要因他们而欢喜
  rationale: 希伯来语此处词形和意义略不明晰；希腊语平行文本明确表达“不要因他们而欢喜”，可作为可靠的释义依据。
- source_word: אִם אֵין אִתָּם / εἰ μὴ ἔστιν ... μετʼ αὐτῶν
  choice: 如果……不在他们中间
  rationale: 希伯来语和希腊语都以同在、伴随来表达，而不只是拥有；“不在他们中间”在现代汉语中较自然地保留这一空间与群体意味。
- source_word: יִרְאַת יְהֹוָה / φόβος Κυρίου
  choice: 敬畏耶和华的心
  rationale: “敬畏耶和华”保留智慧文学的核心固定表达；补出“的心”使它与“在他们中间”搭配自然，并未将“敬畏”弱化为一般尊敬。
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名译出四字神名，避免把专名与普通称号混同。
theological_decisions:
- issue: 如何表达智慧文学公式“敬畏耶和华”
  choice: 敬畏耶和华的心
  alternative: 对主的尊崇
  rationale: 原文将群体人数与对耶和华的敬畏相对照；保留“敬畏耶和华”这一具有丰富圣经内涵的表达，避免把它窄化为一般礼敬，同时“的心”使中文句法通顺。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句子依照汉语习惯将两个条件连续置于劝诫之前；“人数增多”避免古奥，“敬畏耶和华”则保留智慧文学的传统神学用语。
