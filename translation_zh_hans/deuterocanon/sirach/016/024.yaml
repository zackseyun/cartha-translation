  text: Listen to me and receive understanding[b][a], and pay attention in your heart to my words.
translation:
  language: zh_hans
  text: 你们要听我，领受我的见识[a]；要把我的话放在心上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“孩子，要听我，学习知识。”希伯来文没有“孩子”，而作“领受我的见识”。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译：“把心放在我的话上”；希腊文作：“用你的心留意我的话。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: 你们要听我
  rationale: שִׁמְעוּ是复数命令式，既指听见，也含留心听从之意；“你们要听我”自然保留其复数劝诫语气。
- source_word: וּקְחוּ
  choice: 领受
  rationale: לקח本义为“取、拿”，在训诲语境中指接受教导；“领受”比“拿取”自然，也没有把它改写成希腊文的“学习”。
- source_word: שִׂכְלִי
  choice: 我的见识
  rationale: שכל可指悟性、明达、见识；后缀明确表示“我的”。“我的见识”保留说话者将其所具的明达传授给听者这一表达，同时避免把它窄化为单纯知识。
- source_word: וְעַל דְבָרַי שִׂימוּ לֵב
  choice: 要把我的话放在心上
  rationale: 希伯来文直译近于“把心放在我的话上”。汉语“把我的话放在心上”既自然，又保留“心”的明确意象和郑重留意的含义。
theological_decisions:
- issue: 是否在正文加入“孩子”这一称呼
  choice: 正文不加入“孩子”
  alternative: “孩子，要听我……”
  rationale: 现存希伯来文正文没有称呼语，希腊文平行文本则有τέκνον（孩子）。以希伯来文为主要依据，正文从其较短读法，并在脚注保存希腊文异读。
- issue: 是否明确保留“心”
  choice: 译为“放在心上”
  alternative: “要留意我的话”
  rationale: 希伯来文明确使用לֵב（心），希腊文也保留καρδία（心）；不宜将这一关于内在思考与专注的表达淡化为一般的“留意”。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“你们”体现希伯来文复数命令式；“领受我的见识”紧贴希伯来文所有格结构；“把我的话放在心上”是自然汉语，并保留原文“心”的意象。所有脚注标记均置于相关正文之后。
