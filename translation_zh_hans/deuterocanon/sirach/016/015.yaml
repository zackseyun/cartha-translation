  text: Yahweh hardened Pharaoh’s heart[a], though he did not know him, for his deeds are revealed under heaven.
translation:
  language: zh_hans
  text: 耶和华使那不认识他的法老心刚硬[a]，为使自己的作为显露在天下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“不要说：‘我必能向主隐藏。’”希腊文见证与现存希伯来文这一行差异很大，可能反映不同的文本形态或节次对应。
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确表达原文专名 YHWH，而不改作泛称“主”。
- source_word: הִקְשָׁה אֶת לֵב
  choice: 使……的心刚硬
  rationale: 保留希伯来语使役结构以及与《出埃及记》法老传统的互文联系；“心”也保留思想、意志和内在倾向之中心这一圣经意象。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代汉语圣经传统中通行的埃及君王称号。
- source_word: אֲשֶׁר לֹא יְדָעוֹ
  choice: 法老虽不认识他
  rationale: 将关系从句理解为指法老不认识耶和华；“虽”传达语境中可能的让步意味，同时补出“法老”以避免中文代词指向含混。
- source_word: שֶׁמַעֲשָׂיו
  choice: 他的所作所为却都
  rationale: 将 שׁ 理解为承接并带解释或对照意味；“所作所为”自然表达 מַעֲשִׂים 的行为含义，“却”与前面的“虽”构成流畅的让步结构。
- source_word: מְגֻלִּין
  choice: 显露
  rationale: 表达被揭开、无所隐藏的状态，不额外指定揭露者，从而保留被动含义。
- source_word: תַּחַת הַשָּׁמַיִם
  choice: 在天下
  rationale: 这是 תַּחַת הַשָּׁמַיִם 自然而庄重的现代汉语对应，也保留其普世范围。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本的关系
  choice: 正文以现存希伯来文本为准，译出耶和华使法老心刚硬及其行为显露在天下的句子。
  alternative: 按希腊文译为：“不要说：‘我必能向主隐藏。’”
  rationale: 《便西拉智训》有希伯来文存证时，应优先依据希伯来文；但希腊见证与本行差异显著，可能反映不同文本形态或节次对应，因此以脚注完整说明，不将两者调和。
- issue: 耶和华使法老心刚硬与法老不认识耶和华之间的关系
  choice: 保留“使……刚硬”及“虽不认识他”的张力，不解释为单纯许可、自我刚硬或因果关系。
  alternative: 译作“法老因不认识他，心便刚硬”或“耶和华任凭法老刚硬”。
  rationale: 希伯来文明确使用使役动词，而 אֲשֶׁר 的逻辑关系并非完全明示；译文不应借释义消解神圣行动与人的无知之间的神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“使……的心刚硬”保留圣经传统意象；分号及“虽……却……”使句法清楚。脚注标记 [a] 已置于正文相应位置。
