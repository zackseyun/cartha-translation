translation:
  language: zh_hans
  text: 他没有宽恕古时的首领[a]，他们恃自己的勇力而悖逆[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“古代的巨人”。
    reason: alternative_reading
  - marker: b
    text: 本句希伯来文本中的“עוֹלָם”难以确定；希腊文平行文本支持“凭自己的勇力”这一句意。
    reason: textual_variant
lexical_decisions:
- source_word: לֹא נָשָׂא
  choice: 没有宽恕
  rationale: 此处 נָשָׂא 以人物为宾语并用于审判语境，表示不赦免、不施宽容；希腊文 οὐκ ἐξιλάσατο 也支持这一理解。
- source_word: לֲנְסִיכֵי קֶדֶם
  choice: 古时的首领
  rationale: 按现存希伯来文本直译为“古时的首领／统治者”；主文本以希伯来文为准，希腊文“古代的巨人”作为异文说明保留。
- source_word: הַמּוֹרִים
  choice: 悖逆的人
  rationale: 源自动词 מרה，意为悖逆、不服从。以“悖逆的人”表达分词所描述的持续性身份特征，并保持庄重语体。
- source_word: עוֹלָם בִּגְבוּרָתָם
  choice: 倚仗自己的勇力
  rationale: 传世希伯来文中 עוֹלָם 在此难解，而 בִּגְבוּרָתָם 明确涉及他们的勇力；希腊文 τῇ ἰσχύϊ αὐτῶν 支持“凭着／倚仗自己的力量”。译文据平行文本表达句意，同时以脚注交代文本困难。
theological_decisions:
- issue: 受审判者的身份
  choice: 正文采用希伯来文“古时的首领”
  alternative: 希腊文作“古代的巨人”
  rationale: 现存希伯来文应在正文中优先，但希腊文可能保存了对这些远古悖逆者的古老辨识。脚注并列两者，避免把“首领”无声地改成“巨人”。
- issue: 他们与勇力的关系
  choice: 译作“倚仗自己的勇力而悖逆”
  alternative: “在自己的勇力中悖逆”
  rationale: “倚仗”自然表达希伯来介词短语及希腊文与格可能具有的凭借意味，却不改变其因强力而悖逆的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“宽恕”较准确地体现审判语境中的不赦免；“悖逆”保留经文的伦理与神学力度。所有脚注标记均置于正文中。
