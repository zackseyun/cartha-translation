base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/018.yaml
  text: 'Look—the heavens and the highest heavens[a], the deep and the earth: when he descends upon them, they stand still[b]; at his visitation they quake.'
translation:
  language: zh_hans
  text: 看哪，诸天和至高之天[a]，深渊和大地：当他降临在它们之上时，它们站立[b]；他察访时，它们便震动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“诸天和天中之天”，是表示最高之天的说法。
    reason: lexical_alternative
  - marker: b
    text: 这一分句在现存的希伯来复合文本中较难理解，直译近于“当他降到它们之上时，它们站立”。希腊文平行文本没有这一分句，只说“深渊和大地在他察访时都要震动”。
    reason: textual_variant
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留原文强调、引人注目的指示语气；“看哪”在现代中文中庄重而易懂。
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: 诸天和至高之天
  rationale: “天中之天”是希伯来语最高级表达；译作“至高之天”自然地传达最高天界之意，并以脚注说明原文形式。
- source_word: תְהוֹם
  choice: 深渊
  rationale: 此词指原初的深水或无底深处；“深渊”简洁庄重，也与希腊文ἄβυσσος相符。
- source_word: בְּרִדְתּוֹ עֲלֵיהֶם עוֹמְדִים
  choice: 当他降临其上时，它们肃立不动
  rationale: 按现存希伯来文直译其基本句法和意象；“肃立不动”既表达עמדים的站立状态，也使其与下句的震动形成张力，不因文本困难而擅自删去。
- source_word: בְּפָקְדוֹ
  choice: 他察访时
  rationale: פקד在此表示神主动临到、察看或干预；“察访”保留行动的庄重和一定语义宽度，避免只限定为审判。
- source_word: יִרְגְּשׁוּ
  choice: 它们便震动
  rationale: 该动词表示骚动、战栗或震荡；宇宙性主语用“震动”自然，且得到希腊文σαλευθήσονται的支持。
theological_decisions:
- issue: 神行动的拟人性表达
  choice: 当他降临其上时
  alternative: 他察访时／当他临到时
  rationale: 现存希伯来文明确含“下降、降临”之语，故正文予以保留；不以希腊平行文本的“察访”消除这一拟人意象。
- issue: “肃立”与“震动”之间的张力
  choice: 两句均保留
  alternative: 依希腊文合并为“在他察访时都要震动”
  rationale: 希伯来见证虽措辞困难，却实际保存了“站立”与“震动”两个动作。正文不替作者调和，脚注诚实交代希腊平行文本较短。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“看哪”“察访”保留经文语体，但避免过度古雅；正文以希伯来文为先，同时用脚注明示希伯来复合文本的困难及希腊平行文本的差异。
