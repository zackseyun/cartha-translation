  text: My eye has seen many such things[a], and my ear has heard things as mighty as these.
translation:
  language: zh_hans
  text: 我的眼睛见过许多这样的事；我的耳朵也听过这样强大的事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这样强大的事”也可译作“这样非凡的事”。希伯来文 עַצֻּמוֹת כָּאֵלֶּה 可按非比较方式理解为“这样强大的事”；希腊文平行本则作“比这些更强大的事”。
    reason: 保留希伯来文的非比较表达，并说明希腊文平行本的比较级读法。
lexical_decisions:
- source_word: רַבּוֹת כָּאֵלֶּה
  choice: 许多这样的事
  rationale: רַבּוֹת 在此作名词性用法，与比较指示语 כָּאֵלֶּה 合用，意为“许多这样的事”；译法自然，并与希腊文 πολλὰ τοιαῦτα 一致。
- source_word: רַאֲתָה עֵינִי
  choice: 我的眼睛见过
  rationale: 保留希伯来文单数身体部位的表达及其与下句“我的耳朵”的诗性平行；现代汉语用“眼睛”无需标明单复数。
- source_word: וְעַצֻּמוֹת כָּאֵלֶּה
  choice: 比这些更惊人的事
  rationale: עַצֻּמוֹת 表示强大、非凡或令人震撼；希腊文比较级 ἰσχυρότερα 明确支持“比这些更……”的读法。“惊人”在此比直译“强大”更自然，也能涵盖规模、力量或震撼程度。
- source_word: שָׂמְעָה אָזְנִי
  choice: 我的耳朵也听过
  rationale: 保留原文单数“我的耳朵”及与“我的眼睛”的对应；“也”表达并列递进关系，而“听过”符合见闻语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留“我的眼睛／我的耳朵”的诗性平行。正文依据希伯来文，并以希腊文校核第二分句的比较含义；脚注保留原文可能表达“强大、非凡、惊人”的词义张力。
