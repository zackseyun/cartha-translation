  text: For every act of righteousness there is a reward; each person will find it according to his works[a][b].
translation:
  language: zh_hans
  text: 凡行公义的，都有赏报。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本直译为：“每一个行公义的人，他有赏报。”
    reason: 说明正文对希伯来语泛指结构和领有结构所作的自然化处理。
  - marker: b
    text: 希腊平行文本较长：“（原文主语未明）必为每一次施舍（或：每一件怜悯人的善行）留出位置；各人必按自己的行为寻得。”其中“施舍／怜悯人的善行”与希伯来文本的“公义”用词不同；末一分句不见于现存希伯来文本。
    reason: 交代希伯来文本与希腊平行文本之间的词义差异、希腊文首句未明示的主语，以及长短异文。
lexical_decisions:
- source_word: כָּל הָעֹשֶׁה
  choice: 凡……的
  rationale: 希伯来语是带冠词的分词结构，直译为“每一个行……的人”；“凡……的”自然表达逐一适用的泛指意义，同时保留行为者为句子中心。
- source_word: צְדָקָה
  choice: 行公义
  rationale: 希伯来语首要意义是“公义、正义”；在此与“行”搭配译作“行公义”，既贴近原文，也不以希腊语所反映的“施舍”取代希伯来文本。
- source_word: יֵשׁ לוֹ
  choice: 都有
  rationale: 该存在领有结构直译为“他有”；结合前面的泛指结构，译作“都有”简洁自然，并保留每一位行公义者所得赏报的意思。
- source_word: שָׂכָר
  choice: 赏报
  rationale: 该词可指工价、报酬或奖赏。“赏报”适合智慧文学语体，兼有行为所得回报之意，又不过度商业化。
- source_word: πάσῃ ἐλεημοσύνῃ
  choice: 每一次施舍（异文含义）
  rationale: 希腊平行文本可指“每一次施舍”或“每一件怜悯人的善行”，但与希伯来语“公义”有词义差异，因此仅在脚注中说明。
- source_word: ἕκαστος κατὰ τὰ ἔργα αὐτοῦ εὑρήσει
  choice: 各人必按自己的行为寻得（希腊增文）
  rationale: 此分句见于较完整的希腊平行文本，却不见于所提供的希伯来正文。为优先忠实于现存希伯来语，本句不并入正文，而在脚注中完整保存文本差异。
theological_decisions:
- issue: צְדָקָה应译为“公义”还是依希腊语译为“施舍”
  choice: 正文采用“公义”
  alternative: 施舍；怜悯人的善行；正义
  rationale: 所提供的高可信度希伯来文本明确作צְדָקָה，故正文以希伯来语为准；希腊平行文本的慈善含义在脚注中保留，以免消除见证间的张力。
- issue: 是否把希腊文本末尾“各人必按自己的行为寻得”纳入正文
  choice: 不纳入正文，只在脚注注明
  alternative: 将该分句补入正文，形成双句格言
  rationale: 该分句在现存希伯来行文中完全缺失。虽然希腊文本可能保存了较完整的形式，但也可能反映不同底本；正文不应无标记地扩充高可信度的希伯来文本。脚注则透明呈现较长读法。
- issue: 赏报是否明确来自上帝
  choice: 不补出施予赏报的主体
  alternative: 译为“上帝必赏报他”
  rationale: 原文仅说行公义者“有赏报”，没有明说施报主体。保持这种含蓄，避免加入原文未表达的神学限定。
translation_notes:
  register: 采用现代、简洁而庄重的智慧文学语体。“凡……的，都……”是普通读者易懂的泛指句式；“赏报”比“工资”更符合经文语域。正文严格以现存希伯来语为主，希腊较长读法及其词义差异均置于脚注。
