  text: Even the peaks of the mountains and the foundations of the world—when he looks at them[a], they quake.
translation:
  language: zh_hans
  text: 连群山的巅峰和世界的根基[a]，他注视它们时，它们都剧烈震动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“世界的根基”；希腊文平行文本作“地的根基”。
    reason: alternative_reading
lexical_decisions:
- source_word: קִצְבֵי הָרִים
  choice: 群山的巅峰
  rationale: קִצְבֵי 本义涉及边端、极处；与“山”连用时指山的极高处。译作“巅峰”既自然，也保留鲜明意象。
- source_word: וִיסוֹדֵי תֵבֵל
  choice: 和世界的根基
  rationale: יְסוֹדֵי 表示“根基”，תֵבֵל 指有秩序、有人居住的世界；“世界的根基”忠实反映希伯来文的宇宙性表达。
- source_word: בְּהַבִּיטוֹ אֲלֵיהֶם
  choice: 他一看它们
  rationale: 以自然的时间表达呈现带代词后缀的不定式结构；上下文所指为上帝，但原句没有明说其名，因此仍用“他”。
- source_word: רַעַשׁ יִרְעָשׁוּ
  choice: 就都震动不已
  rationale: 同根名词与动词连用，形成强调。译作“震动不已”避免汉语中生硬重复，同时保留强烈、持续震动的语势。
theological_decisions:
- issue: “他一看它们”中未明说的施动者
  choice: 保留代词“他”，不直接补作“上帝”
  alternative: 上帝一看它们
  rationale: 上下文足以表明所指，但希伯来文本句只隐含施动者；保留代词可避免把解释直接写入正文。
- issue: 受造界对神注视的反应
  choice: 译为“震动不已”
  alternative: 因恐惧而战栗
  rationale: 希伯来文强调震动，却没有在本句明确说明其心理原因；不补入“恐惧”，以保留文本的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“连……也……”的语意由“连”与后句自然体现；“巅峰—根基”保留从最高处到最深处的对照。脚注标记紧接其所说明的“世界的根基”。
