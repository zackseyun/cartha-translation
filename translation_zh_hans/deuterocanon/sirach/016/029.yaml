  text: 此后，主观看大地，使大地充满他的美好之物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: 此后
  rationale: 准确表达时间上的先后关系，简洁自然；希腊文中性复数也可直译为“这些事以后”，但本节没有必要将其生硬展开。
- source_word: Κύριος
  choice: 主
  rationale: 作为对上帝的称号，采用现代中文圣经语体中通行而庄重的“主”。
- source_word: εἰς τὴν γῆν ἐπέβλεψεν
  choice: 垂顾大地
  rationale: ἐπιβλέπω表示把目光投向、观看；在此与随后施予美物的行动相连。“垂顾”既保留从上而下关注的意味，也符合庄重而自然的中文表达。
- source_word: ἐνέπλησεν αὐτήν
  choice: 使大地充满
  rationale: ἐμπίμπλημι在此意为“充满”；将代词αὐτήν明确译作“大地”，避免中文代词指涉含混。
- source_word: τῶν ἀγαθῶν αὐτοῦ
  choice: 他的美物
  rationale: ἀγαθά可泛指美好的事物、益处或恩赐。“美物”保留其广泛、具体而未加解释的意义，避免把它限缩为神学色彩更强的“福分”或“恩赐”。
theological_decisions:
- issue: 神圣称号Κύριος的译法
  choice: 主
  alternative: 上主
  rationale: 原文使用Κύριος作为神圣称号。“主”直接、通行，不额外引入特定传统偏好的称谓。
- issue: τῶν ἀγαθῶν αὐτοῦ所指的范围
  choice: 他的美物
  alternative: 他的福分／他的恩赐
  rationale: 原文没有限定这些“美好之物”是属灵福分、创造界资源还是具体恩赐，因此采用范围较广的译法，保留语义开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“垂顾”略带经文语体色彩，但仍为当代读者熟悉；句中重复“大地”以确保指代清楚。
