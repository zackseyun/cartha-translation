  text: Do not desire the appearance of worthless youths[a], and do not rejoice in sons of unrighteousness.
translation:
  language: zh_hans
  text: 不要贪慕虚妄少年的外貌[a]，也不要因不义之子而欢喜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“不要渴望许多无用的儿女，也不要因不敬虔的儿子而欢喜。”现存希伯来文本则说虚妄少年的外貌。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְאַוֶּה
  choice: 不要贪慕
  rationale: אַל加未完成式构成禁令；“贪慕”自然表达强烈欲求，又不把含义限定为情欲。
- source_word: תֹּאַר
  choice: 外貌
  rationale: תֹּאַר指外在形貌或容貌；译作“外貌”保留希伯来文本对外表的强调，不额外加入“俊美”。
- source_word: נַעֲרֵי שָׁוְא
  choice: 虚妄少年
  rationale: נַעֲרֵי指少年或青年男子；שָׁוְא可指虚空、虚妄、无价值。“虚妄少年”既保留智慧文学语体，也避免用“无用”把人作绝对价值判断。
- source_word: וְאַל תִּשְׂמַח
  choice: 也不要……欢喜
  rationale: 与上半句形成平行禁令；“欢喜”准确保留שׂמח的情感含义。
- source_word: בִּבְנֵי עַוְלָה
  choice: 因不义之子
  rationale: עַוְלָה表示不义、邪曲；保留“子”的阳性与希伯来语“……之子”结构。“因……而”在现代汉语中自然表达介词ב所指的欢喜缘由。
- source_word: Μὴ ἐπιθύμει τέκνων πλῆθος ἀχρήστων
  choice: 未用于正文
  rationale: 希腊平行文本意为“不要渴望许多无用的儿女”，与现存希伯来文差异显著。本节希伯来文可信度高，故正文以希伯来文为准，并在脚注保存希腊异文。
theological_decisions:
- issue: 希伯来文与希腊文分歧时的底本选择
  choice: 正文采用现存希伯来文，并以脚注保存希腊异文
  alternative: 采用希腊文：“不要渴望许多无用的儿女，也不要因不敬虔的儿子而欢喜。”
  rationale: 本节有可靠的希伯来文见证，按《便西拉智训》的文本原则应以其为正文依据；但希腊文本的差异涉及整句意象，不能静默忽略，因此列入脚注。
translation_notes:
  register: 采用简洁、端庄的现代标准汉语，保留智慧文学的警戒语气和平行结构。“虚妄少年”略具书面色彩，但普通读者可理解，并较好承载שָׁוְא的多重意味。
