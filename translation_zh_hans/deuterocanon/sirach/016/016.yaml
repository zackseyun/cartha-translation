base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/016.yaml
  text: His mercies are seen by all his creatures[b][a], and he has apportioned his light and his praise to the sons of man.
translation:
  language: zh_hans
  text: 他的怜悯向他所有的受造之物显现[b]；他把他的光和赞美分给世人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “世人”：希伯来文直译为“人的众子”，是泛指人类的惯用语。
    reason: lexical_alternative
  - marker: b
    text: 斯威特本希腊文在这里的读法差异很大，作：“谁会从高天记念我呢？”主文依据现存的希伯来文见证。
    reason: textual_variant
lexical_decisions:
- source_word: רַחֲמָיו
  choice: 他的怜悯
  rationale: 希伯来文为复数形式，可指怜悯之情或种种怜悯作为；现代汉语通常以集合性的“怜悯”自然表达，不必生硬标出复数。
- source_word: יֵרָאוּ
  choice: 显明
  rationale: 按 ראה 的被动或中间意义理解为“被看见、显现”。“显明”既符合上下文中与“光”的呼应，也避免误读为“受敬畏”。
- source_word: לְכָל בִּרְיוֹתָיו
  choice: 向他一切受造之物
  rationale: 介词 ל 可表达“向、给”，בִּרְיוֹתָיו 指他所创造的众生或受造物；此译法与“显明”搭配自然，并保留受造者的含义。
- source_word: וְאוֹרוֹ
  choice: 自己的光
  rationale: אוֹר 的基本义是“光”。保留这一意象，不把它具体解释为启示、智慧或荣光。
- source_word: וְשִׁבְחוֹ
  choice: 赞美
  rationale: שבח 可指赞美、颂赞或可赞美之处。“赞美”形式贴近原文，并保留这是属于上帝、归于上帝或由上帝所赐的开放性。
- source_word: חָלַק
  choice: 分给
  rationale: חלק 表示划分、分配。“分给”是现代汉语中自然而庄重的说法，也准确表达上帝把“光和赞美”分配给人的动作。
- source_word: לִבְנֵי אָדָם
  choice: 世人
  rationale: 该短语字面为“亚当之子／人的众子”，在希伯来文中是泛指全人类的惯用语。主文采用自然的“世人”，字面形式则在脚注中说明。
theological_decisions:
- issue: בני אדם 所指的人类范围
  choice: 世人
  alternative: 亚当的众子／人的子孙
  rationale: 原文虽采用阳性复数形式，却是泛指人类的希伯来惯用语。“世人”准确传达其代表性范围，又不让现代读者误以为只指男性或某一血缘群体；脚注保留字面信息。
- issue: 上帝的“光”和“赞美”与人类的关系
  choice: 他把自己的光和赞美分给世人
  alternative: 他把自己的光和荣耀分赐给人类
  rationale: 原文只陈述“分给”，没有说明“光”具体是启示、智慧还是荣光，也没有明确“赞美”是人的颂赞能力、归给上帝的赞美或上帝所赐的尊荣。因此保留原文的神学张力，不以解释性词语消除歧义。
- issue: 希伯来文本与希腊平行文本的显著差异
  choice: 主文依据现存希伯来文
  alternative: 采用希腊文“谁会从高处记念我呢？”
  rationale: 本节有高可信度的希伯来文见证，且项目以原文证据优先；希腊平行文本内容完全不同，故不混入主文，而在脚注中如实注明异文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“向……显明”保留被看见或显现的语义，“受造之物”延续经文体的创造语言；“分给”比“分配”更自然，也不过度行政化。句中保留“光”和“赞美”两个原文意象，不作教义化阐释。
