base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/017.yaml
  text: Do not say[a], “I am hidden from God, and from on high who will remember me? In a great people I will not be known; and what is my life among the ends of the winds, all the sons of man?”
translation:
  language: zh_hans
  text: 不要说：“我躲过上帝了；从高天之上，谁会记得我？在众多的人中，我不会被认出；在风的尽头[a]、所有世人之中，我的性命算什么呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“在无可计量的受造界中”，而不是“在风的尽头”；这可能反映了不同的希伯来文底本，也可能是对这句艰涩希伯来语的解释性翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: 直接保留希伯来语否定命令的语气，简洁自然。
- source_word: מֵאֵל נִסְתַּרְתִּי
  choice: 我在上帝面前藏起来了
  rationale: 希伯来语可表达“对上帝而言是隐藏的”；此译保留说话者自以为能躲过上帝察看的错误想法，又符合现代汉语表达。
- source_word: וּבַמָּרוֹם
  choice: 在高天之上
  rationale: 保留原文的高处、天上领域这一空间意象，不直接解释为“天堂”。
- source_word: יִזְכְּרֵנִי
  choice: 谁会记得我
  rationale: 采用 זכר 的基本义“记得”，希腊语 μνησθήσεται 也支持这一理解。
- source_word: בְּעַם כָּבֵד
  choice: 在众多的人中
  rationale: כבד 在这里由“有分量”引申为人数众多；希腊语 ἐν λαῷ πλείονι 亦支持“众多”的含义。
- source_word: לֹא אִוָּדֵעַ
  choice: 我不会被认出
  rationale: 保留 ידע 的被动意义，并清楚传达说话者以为自己会淹没在人群中、不受注意。
- source_word: וּמַה נַפְשִׁי
  choice: 我的性命算什么呢
  rationale: נפש 可指生命、性命或自身；反问语境强调个人生命的微不足道，“性命”比抽象的“灵魂”更贴合此处。
- source_word: כְּקַצּוֹת רוּחוֹת
  choice: 在风的尽头
  rationale: 此句希伯来语艰涩；正文保留“风的尽头”这一具体宇宙性意象，不用希腊语的解释性表达取代。
- source_word: כּלָ בּנֵי אָדָם
  choice: 所有世人
  rationale: 这是指全人类的集合性惯用语；“所有世人”自然、庄重，也完整表达“亚当之子”的普遍人类所指。
theological_decisions:
- issue: 末句采用希伯来语的宇宙意象，还是希腊语的解释性读法
  choice: 正文保留“在风的尽头”
  alternative: 在无可计量的受造界中
  rationale: 本节有存世希伯来文，应以其为主要依据。希腊文可能反映不同底本，也可能是对艰涩希伯来语的解释性顺译；将其列入脚注，可保存文本差异而不在正文中擅自消解。
- issue: נפש 在此译为“性命”还是“灵魂”
  choice: 性命
  alternative: 灵魂
  rationale: 上下文是说话者认为个人在浩瀚人类与宇宙中微不足道，נפש 在此更自然地指个人生命或自身；译作“性命”不预设灵魂论上的特定教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在高天之上”保留原文的空间意象；“我的性命算什么呢”以自然反问呈现人物自认渺小的心态。末句希伯来语句法艰涩，译文尽量保留其意象，并以脚注交代希腊文本的显著异读。
