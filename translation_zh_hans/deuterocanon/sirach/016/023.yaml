translation:
  language: zh_hans
  text: 缺乏理解力的人会明白这些事；愚昧的人会思量这事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本在第二分句作“这事”；希腊文平行文本则作“愚妄的事”。正文依从希伯来文；“愚昧”表达פּוֹתֶה不仅指天真，也含判断力欠缺之意。
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְרֵי לֵב
  choice: 心智不足的人
  rationale: 字面为“缺少心的人”；在希伯来智慧文学中，“心”常指理解力和判断力。译作“心智不足”既传达这一习语，也保留其智性与道德判断上的含义。
- source_word: יָבִינוּ
  choice: 会明白
  rationale: 该动词表示理解、领会或辨明；“会明白”直接保留原文未完成体在此处的将来或概括性语气。
- source_word: אֵלֶּה
  choice: 这些事
  rationale: 原文是复数指示词；补出“事”符合现代汉语习惯，并保留与后半句单数“这事”的区别。
- source_word: גֶבֶר
  choice: 人
  rationale: 此词指一个成年男子，但本句是智慧文学中的类型化表述；汉语“人”自然且不增添原文没有强调的性别信息。
- source_word: פּוֹתֶה
  choice: 愚昧
  rationale: 该词可指头脑简单、轻信或容易受诱惑的人。希腊平行文本以“愚妄并迷失”加以展开，因此“愚昧”比“天真”更能表达判断力有缺陷的贬义，同时不把含义限定为某一种过失。
- source_word: יַחְשֹׁב
  choice: 会思量
  rationale: 该动词可表示思想、盘算或考虑；“思量”在此语体庄重而自然，也避免把动作过度解释为赞同或理解。
- source_word: זֹאת
  choice: 这事
  rationale: 希伯来文为阴性单数指示词。译文保留其单数形式，不与上半句的复数“这些事”强行协调。
