  text: The surface of it covered the life of every living thing[b][a], and to it is their return.
translation:
  language: zh_hans
  text: 她的表面覆盖着一切活物的生命[a]；它们归回到她那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她的表面”直译为“她的脸面”。希腊文使用阴性代词；这里的“她”很可能指上下文中的大地。
    reason: lexical_alternative
  - marker: b
    text: “归回到她那里”也可译作“归入她”；这里很可能指活物归回大地。
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχὴν
  choice: 生命
  rationale: 在παντὸς ζῴου的搭配中，指活物所具有的生命，而非特指与身体分离的“灵魂”。
- source_word: παντὸς ζῴου
  choice: 一切活物
  rationale: 保留ζῷον可泛指有生命之物的广度，不限于“动物”。
- source_word: ἐκάλυψεν
  choice: 覆盖着
  rationale: 按基本义译为“覆盖”；结合该句描写受造界的语境，用持续状态表达自然的汉语意思。
- source_word: τὸ πρόσωπον αὐτῆς
  choice: 她的表面
  rationale: πρόσωπον字面为“脸、面”，此处指前文所说之大地的表面；保留阴性代词“她”，同时用“表面”使汉语清楚。
- source_word: καὶ εἰς αὐτὴν
  choice: 都要归回她
  rationale: εἰς可表示“到”或“进入”；此处与ἀποστροφή合译为“归回她”，不额外限定为埋入地下。
- source_word: ἡ ἀποστροφὴ αὐτῶν
  choice: 它们都要归回
  rationale: ἀποστροφή在此表示转回、返回；“归回”既自然又契合生命归于大地的语境。
theological_decisions:
- issue: 阴性代词αὐτῆς/αὐτὴν的所指
  choice: 以“她”保留原文阴性指代，并由脚注说明所指很可能是大地
  alternative: 直接译成“地面……归回大地”，或中性化为“它的表面……归回它”
  rationale: 本句没有明说所指名词，原文仅用阴性代词承接上下文。正文保留“她”可显出原文的指代方式，脚注则保障可理解性，避免把推定的“大地”无标记地写入正文。
- issue: ψυχή在本句中的含义
  choice: 生命
  alternative: 灵魂、气息、生命气息
  rationale: 与“一切活物”连用时，重点是使其成为活物的生命，并非明确陈述灵魂与身体关系的教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“她”有意保留希腊文阴性代词造成的拟人色彩和指代张力；分号呈现两个并列而相关的陈述。
