base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/021.yaml
  text: If I have sinned, no eye sees me; or if I lie, who knows it in every hiding place?
translation:
  language: zh_hans
  text: 我若犯了罪[a]，没有一只眼能看见我；我若说谎，在一切隐秘之处[b]，谁会知道呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本在这里差异很大，其中提到人看不见的风暴，并说他的许多作为都在隐秘处。本节因有现存的希伯来文，正文依照希伯来文翻译。
    reason: textual_variant
  - marker: b
    text: 或译：“藏身之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתִי
  choice: 我若犯了罪
  rationale: אִם引出条件，完成式חָטָאתִי在这一概括性的设想中译作“犯了罪”；“若”简洁庄重，也不把条件句改成让步句。
- source_word: לֹא תִרְאֵנִי עָיִן
  choice: 没有一只眼睛会看见我
  rationale: 保留希伯来文以“眼睛”为主语的具体意象，不简化为“没有人看见我”；“会”自然表达条件语境中的未完成式。
- source_word: אוֹ אִם אֲכַזֵב
  choice: 我若说谎
  rationale: כזב在此指说谎、弄虚作假；“说谎”最清楚自然，同时不额外限定欺骗的对象或方式。
- source_word: בְּכָל סֵתֶר
  choice: 无论是在什么隐秘之处
  rationale: סֵתֶר可指隐秘或隐藏的地方；这一表达保留空间意义，并以现代汉语自然呈现כָּל在疑问语境中的周遍含义。
- source_word: מִי יוֹדֵעַ
  choice: 谁会知道呢
  rationale: 忠实保留希伯来文的反问形式；所知道的对象可由上下文领会，无须在中文中补出“这事”。
- source_word: καὶ καταιγίς, ἣν οὐκ ὄψεται ἄνθρωπος, τὰ δὲ πλεῖονα τῶν ἔργων αὐτοῦ ἐν ἀποκρύφοις
  choice: 仅用来印证“隐秘”这一语义，不作为正文底本
  rationale: 希腊平行文本与现存希伯来文差异显著，但ἐν ἀποκρύφοις可印证隐藏、隐秘的语义。因本节希伯来文保存完整且可信度高，正文仍以希伯来文为主。
theological_decisions:
- issue: 《便西拉智训》本节希伯来文与希腊文差异显著时的底本取舍
  choice: 正文翻译现存希伯来文，以希腊平行文本辅助确认“隐秘”的语义
  alternative: 采用希腊文所述“他的许多作为都在隐秘处”等内容，或把两种见证调和为一段
  rationale: 本节希伯来文见证现存且可靠，应按项目原则优先采用。希腊文反映了明显不同的传承，不宜无提示地混入正文；此处保留文本差异，不借取舍引入额外教义判断。
translation_notes:
  register: 采用现代、清楚而庄重的书面普通话。“没有一只眼睛”刻意保留原文的具体意象；两个“我若”形成平行结构，反问语气则呈现说话者以无人看见、无人知晓来自我开脱的口吻，而不在译文中替读者作神学解释。
