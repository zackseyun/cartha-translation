  text: Who will declare a work of righteousness[c][b][a], and who will wait for it? For the covenant is far off.
translation:
  language: zh_hans
  text: 谁会述说公义的作为[b][a]？谁又会等候？因为那约很遥远。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本此处艰涩，大意可能是：“什么是公义的行为，谁能说出？又盼望什么……？”希腊文则较清楚：“谁会述说公义的作为？谁又会等候（或忍耐）？因为那约很遥远。”
    reason: textual_variant
  - marker: b
    text: 也可译作“公义的行为”“正义的作为”。希腊文为复数。
    reason: lexical_alternative
  - marker: c
    text: “那约”依希腊文；现存希伯来文似作“律例”“定例”或“法令”。
    reason: alternative_reading
lexical_decisions:
- source_word: מָה מַעֲשֶׂה צֶדֶק / ἔργα δικαιοσύνης
  choice: 公义的作为
  rationale: 希伯来文本此处艰涩，希腊文则作复数“公义的作为”。译作“公义的作为”既保留数的不确定性，也自然表达正直、公义之举。
- source_word: מִי יַגִּידֶנּוּ / τίς ἀναγγελεῖ
  choice: 谁会述说
  rationale: 希伯来语 הִגִּיד 与希腊语 ἀναγγέλλω 都可表示告知、宣告或述说；“述说”适合此处的反问语气，也不把公开宣告的意味说得过强。
- source_word: וְתִקְוַת מָּה כִי אָצוּק חוֹק / ἢ τίς ὑπομενεῖ
  choice: 谁又会等候它
  rationale: 希伯来文含“盼望”一词，但整句疑有讹误；希腊文较清楚，意为“谁会等候／忍耐”。“等候它”保留盼望与恒忍之间可能共有的语义。
- source_word: חוֹק / ἡ διαθήκη
  choice: 那约
  rationale: 希伯来文现存读法为“律例／定例”，希腊文则为“约”。正文采用能形成完整连贯句意的希腊读法，并在脚注注明希伯来异文。
- source_word: מָּה / μακρὰν
  choice: 还很遥远
  rationale: “遥远”直接对应希腊文 μακράν，并说明为何需要等候；“还很”使现代汉语自然，同时可传达尚未临近的意味。
theological_decisions:
- issue: 在希伯来文本艰涩而希腊平行文本较完整时应采用哪一读法
  choice: 正文主要依从希腊文的连贯句意，同时以希伯来文校核共有语义，并用脚注保存重要异文。
  alternative: 按现存希伯来文直译为近似“什么是公义的行为，谁能说出？又盼望什么，因为定例已经铸定？”
  rationale: 此处希伯来文在句法和语义上均不稳定，尤其后半句难以确解；希腊文形成清楚的反问与因果关系。采用希腊文并明示异文，既避免把残缺文本强行解释成确定教义，也保留文本见证之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。反问句保留原文的修辞力度；“公义”“约”延续经籍语域，但整体仍便于普通现代读者理解。脚注标记按首次相关内容的自然次序置于正文。
