  yaml_path: translation/deuterocanon/sirach/016/006.yaml
  text: In the assembly of the wicked[a], fire burns; and among a godless nation, wrath is kindled.
translation:
  language: zh_hans
  text: 在恶人的会众中，火在燃烧；在不敬虔的民族中，烈怒燃起。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“在罪人的会众中，火将燃起；在不顺从的民族中，烈怒燃起了。”
    reason: 希腊文平行文本在“恶人／罪人”“不敬虔／不顺从”以及第一分句的时态表达上与希伯来文有所不同。
lexical_decisions:
- source_word: בַּעֲדַת
  choice: 在……的会众中
  rationale: עֵדָה 指聚集而成的群体或会众；介词 ב 在此取处所义。“会众”既保留群体含义，也符合本节庄重、凝练的语体。
- source_word: רְשָׁעִים
  choice: 恶人
  rationale: רְשָׁעִים 通常指邪恶或有罪的人。译作“恶人”简洁地保留其道德判断；希腊文作“罪人”，但现存希伯来文为主要依据。
- source_word: יוֹקֶדֶת אֵשׁ
  choice: 火焰燃烧
  rationale: יקד 表示燃烧、炽烈；希伯来文分词呈现持续燃烧的景象。“火焰燃烧”自然且保留主动意象。
- source_word: וּבְגוֹי
  choice: 在……的民族中
  rationale: גוי 可指民族、国族或人民；介词 ב 在此仍为处所义。“民族”能自然表达烈怒在这样一个群体中燃起。
- source_word: חָנֵף
  choice: 不敬虔
  rationale: חנף 在此表示不虔、亵慢或背离神圣规范。“不敬虔”保留其宗教与道德层面的宽广含义，且不误收窄为“虚伪”。
- source_word: נִצְּתָה חֵמָה
  choice: 烈怒燃起
  rationale: נצתה 表示被点燃、燃起，חמה 表示烈怒或震怒。“烈怒燃起”保留原文的点火隐喻，并避免擅自补明烈怒的所属者。
theological_decisions:
- issue: חָנֵף 应按希伯来文译为“不敬虔”，还是按希腊文 ἀπειθεῖ 译为“不顺从”
  choice: 不敬虔
  alternative: 不顺从
  rationale: 本节有可信度高的希伯来文见证，故正文以希伯来文为准。希腊文反映相关但不完全相同的诠释传统，其异文在脚注中保留。
- issue: 是否明确指出“烈怒”属于上帝
  choice: 不补出所属者
  alternative: 上帝的烈怒燃起
  rationale: 原文只说 חֵמָה（烈怒），未明说所属者。上下文或可使读者理解为神的震怒，但正文不应消除原文留下的含蓄与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；两分句保持希伯来文的平行结构。“火焰燃烧／烈怒燃起”重现原文相互呼应的火焰意象，同时不额外解释审判主体。
