  yaml_path: translation/deuterocanon/sirach/016/004.yaml
  text: From one God-fearing childless man a city will be inhabited, but from a family of traitors it will be laid waste.
translation:
  language: zh_hans
  text: 因一个敬畏耶和华、没有子嗣的人，一座城得以有人居住。[a]因一族背信之人，城却必荒废。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“一座城将因一个明智的人而有人居住。”希伯来文作：“因一个敬畏耶和华、没有子嗣的人。”
    reason: 保留希伯来文与希腊文之间影响首分句句义的重要异文。
lexical_decisions:
- source_word: מֵאֶחַד
  choice: 一个……的人
  rationale: 介词מִן表示起因或来源；结合汉语表达，以“一个……的人，能使”自然呈现由一人带来的结果。
- source_word: עֲרִירִי
  choice: 没有子嗣的人
  rationale: 该词通常指没有儿女或后代的人。“没有子嗣”比“孤身”更准确保留希伯来文的具体含义。
- source_word: יְרֵא יְהֹוָה
  choice: 敬畏耶和华
  rationale: 直译并保留神名，表达对耶和华的敬畏，而非泛指虔诚。
- source_word: תֵּשֵׁב עִיר
  choice: 能使一座城有人居住
  rationale: ישב在这里表示城得以有人居住或定居；汉语用使动表达，清楚呈现这一人所带来的结果，同时不把句义缩减为单纯的生育繁衍。
- source_word: מִמִּשְׁפַּחַת
  choice: 一族
  rationale: מִשְׁפָּחָה可指家族、宗族或亲族群体；“一族”简洁，并与前句“一个人”形成鲜明对照。
- source_word: בֹּגְדִים
  choice: 背信的人
  rationale: 该词指行事诡诈、背叛信义的人；“背信”保留道德和关系层面的含义，又避免现代政治语境中过窄的“叛徒”。
- source_word: תֶּחֱרָב
  choice: 能使城荒废
  rationale: חרב表示成为废墟、荒凉或遭毁坏；“荒废”与希腊文ἐρημωθήσεται相合，并与前句“有人居住”构成自然对照。
theological_decisions:
- issue: 首句应采用希伯来文עֲרִירִי（没有子嗣）还是希腊文συνετοῦ（明智）
  choice: 正文采用希伯来文“没有子嗣的人”
  alternative: 依希腊文译作“一个明智的人”
  rationale: 现存希伯来文在此清楚且可信度高，应作为正文依据；希腊文呈现实质性异文，因此在脚注保留，不将两种读法调和。
- issue: 是否明确译出神名יהוה
  choice: 译作“耶和华”
  alternative: 译作“上主”或概括为“敬畏神”
  rationale: 希伯来正文明确有四字神名；译出“耶和华”可避免把特指的敬畏泛化为一般宗教虔诚。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。前后两句以“一个人／一族”和“有人居住／荒废”形成对照；用两个“能使”自然表达希伯来文介词所示的起因关系。脚注标记置于整节末，涵盖首句异文。
