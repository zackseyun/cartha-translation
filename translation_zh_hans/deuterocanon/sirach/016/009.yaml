  rationale: 修订“因自己的罪孽”为“在自己的罪孽中”，以保留希伯来文和希腊文共同呈现的介词歧义，避免将其单一解释为因果。修订“被定为毁灭”为“注定毁灭的”，改善现代汉语表达。脚注保留希腊文“被除去”与希伯来文“被践踏”之间的差异。
