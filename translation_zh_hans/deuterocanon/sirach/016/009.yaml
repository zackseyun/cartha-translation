  text: And he did not spare a people devoted to destruction[a], those trampled down in their iniquity.
translation:
  language: zh_hans
  text: 他也没有怜惜那注定毁灭的民族[a]，即那些在自己的罪孽中被践踏的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“一个注定灭亡的民族，即那些在自己的罪中被除去的人。”希伯来文似乎采用“被践踏”或“被碾压”的意象；希腊文则以不同措辞表达相近的审判含义。
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: 他也没有怜惜
  rationale: חמל可表示怜悯或饶恕；“没有怜惜”在审判语境中自然，并兼顾不施怜悯与不予宽免的含义。
- source_word: גוֹי
  choice: 民族
  rationale: גוי指一个民族或群体；“民族”既符合古代群体概念，也避免误解为现代民族国家。
- source_word: חֶרֶם
  choice: 被定为毁灭
  rationale: חרם在此含被置于禁令之下、归于毁灭的司法及宗教意味；“被定为毁灭”清楚传达其严重性，又不使用现代汉语中生僻的术语。
- source_word: הַנּדוֹשִׁים
  choice: 被践踏的人
  rationale: 该词形较难，希伯来文似以踩踏或碾压为意象；译作“被践踏”保留原文形象。希腊文则作“被除去的人”，故在脚注中说明异文。
- source_word: בַּעֲוֹנָם
  choice: 因自己的罪孽
  rationale: עון含罪孽、罪责之意；介词ב在此可表达处境或缘由。“因自己的罪孽”在现代汉语中明确体现罪孽与审判之间的联系。
theological_decisions:
- issue: 如何翻译审判语境中的חֶרֶם
  choice: 被定为毁灭
  alternative: 处在毁灭的禁令之下；注定毁灭
  rationale: 此译保留该词的司法与神圣禁令意味，同时避免加入后来的教派性术语。
- issue: 如何依据希伯来文并参照希腊文处理难解的הַנּדוֹשִׁים
  choice: 因自己的罪孽而被践踏的人
  alternative: 在自己的罪中被除去的人；被自己的罪孽压碎的人
  rationale: 正文以希伯来文见证为主，保留踩踏的具体意象；希腊文呈现相关但不同的审判措辞，因此以脚注保留，不在正文中暗自消解差异。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被定为毁灭”传达חֶרֶם的审判力度；“被践踏”保留希伯来文的具体意象。脚注标记[a]已置于正文对应词组之后。
