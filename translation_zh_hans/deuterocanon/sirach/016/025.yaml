  text: I will declare my spirit with measure[c][b][a], and with care I will make my knowledge known.
translation:
  language: zh_hans
  text: 我要按分寸表达我的心意[a][b]，并谨慎地陈明我的知识[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的心意”直译为“我的灵”；希腊文平行文本作“教训”。
    reason: alternative_reading
  - marker: b
    text: “按分寸”直译为“按重量”，比喻把话仔细权衡后说出。
    reason: lexical_alternative
  - marker: c
    text: “谨慎地”也可理解为“含蓄地”或“谦逊地”；希腊文平行文本强调准确、严谨。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבִּיעָה
  choice: 说出
  rationale: 该动词表示涌出、吐露或发表言语；译为“说出”自然地表达将内在思想诉诸言语，也与希腊文“显明”相呼应。
- source_word: בְמִשְׁקָל
  choice: 斟酌
  rationale: 字面意为“按重量/衡量”，在此比喻说话经过权衡；“斟酌”既保留衡量意象，又符合现代汉语表达。
- source_word: רוּחִי
  choice: 我心中的话
  rationale: 希伯来文直译为“我的灵”，在言说语境中可指内在的思想、心意；译文不直接采纳希腊文“教训”，但以“心中的话”表达由内而发的内容，并保留脚注说明文本差异。
- source_word: וּבְהַצְנֵעַ
  choice: 谨慎地
  rationale: 词根可表达谦逊、含蓄、审慎；希腊文强调精确。“谨慎地”可涵盖克制与细致，不把含义局限为单纯的谦卑。
- source_word: אֲחַוֶּה
  choice: 陈明
  rationale: 意为显示、述说、使人知道；“陈明”庄重而自然，适合与“见识”搭配。
- source_word: דֵעִי
  choice: 我的见识
  rationale: 该词指知识、认识或理解；“见识”在此比“知识”更自然地表示说话者所领会并要陈述的内容。
theological_decisions:
- issue: רוּחִי 与希腊文 παιδείαν 的见证差异
  choice: 正文译为“我心中的话”，以希伯来文“我的灵”为基础，并按言说语境表达其内在内容
  alternative: 译为“我的教训”，依从希腊文；或直译“我的灵”
  rationale: 希伯来文证据可信度高，不宜以希腊文的“教训”取代；但现代汉语“把我的灵说出”容易产生非原文所必需的本体论理解，因此采用语境化表达，并在脚注中保留差异。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。两分句结构对应希伯来文平行句式；“斟酌说出／谨慎地陈明”保留原文关于慎重表达的递进。所有脚注标记均置于其所说明的词语之后。
