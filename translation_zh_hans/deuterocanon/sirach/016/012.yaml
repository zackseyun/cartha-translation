base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/012.yaml
  text: As great as his mercies are[a], so also is his reproof[c][b]; he will judge a man according to his deeds.
translation:
  language: zh_hans
  text: 他的怜悯有多么丰盛[a]，他的责备也有多么严正[b]；他必照各人[c]所行的审判各人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语此处用复数，直译可作“他的诸般怜悯”；希腊语作单数“怜悯”。
    reason: lexical_alternative
  - marker: b
    text: “责备”也可译作“纠正”或“斥责”；此词主要指揭责并使人改正，不宜理解为单纯的刑罚。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语原作阳性单数“一个人”，在这里具有代表性的泛指作用。
    reason: cultural_note
lexical_decisions:
- source_word: כְּרָב ... כֵּן
  choice: 何等丰盛……也同样严厉
  rationale: 这一对应结构表达“怎样……也怎样”的比例关系。中文用“何等……也同样……”保留两者并列相称的力量；“丰盛”对应 רָב 的丰富、广大之意，而“严厉”使“责备”的分量在现代汉语中自然显明，并不把它改译成惩罚。
- source_word: רַחֲמָיו
  choice: 他的怜悯
  rationale: 希伯来语形式为复数，可指丰富的慈怜或多次施怜悯；现代汉语通常以集合性的“怜悯”自然表达，不宜生硬译成“他的怜悯们”。
- source_word: תּוֹכַחְתּוֹ
  choice: 他的责备
  rationale: 该词指揭责、纠正性的斥责；希腊语 ἔλεγχος 也支持此义。“责备”保留道德纠正的意味，避免将其收窄为纯粹的刑罚。
- source_word: אִישׁ
  choice: 各人
  rationale: 原文是阳性单数“一个人”，在这里具有代表和泛指作用。中文用“各人”自然表达逐人受审的分配意义，同时以脚注说明原文形式。
- source_word: כְּמִפְעָלָיו
  choice: 照各人所行的
  rationale: מִפְעָל 指行为、作为或所做之事；“所行的”简洁自然，并保留按行为审判的道德含义。
- source_word: יִשְׁפֹּט
  choice: 他必……审判
  rationale: 希伯来语未完成式结合希腊语将来时 κρινεῖ，适合表达将来的确定行动。“必……审判”兼具清楚和庄重感。
theological_decisions:
- issue: 上帝的怜悯与责备、审判之间的关系
  choice: 将丰盛的怜悯和严厉的责备并列，并保留按行为审判的结论。
  alternative: 把 תּוֹכַחְתּוֹ 译成更具惩罚意味的“刑罚”或“惩治”。
  rationale: 希伯来语与希腊语首先指向责备和纠正，而不是单纯报复性的惩罚。译文不让怜悯取消道德责任，也不让审判遮蔽怜悯，保留经文本身的张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“何等……也同样……”呈现原文的比例平行；后半句用“各人……各人”自然表达原文单数泛指及逐人受审之意。
