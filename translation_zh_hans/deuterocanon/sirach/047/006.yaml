  yaml_path: translation/deuterocanon/sirach/047/006.yaml
  text: Therefore the daughters answered him[a], and acclaimed him among the myriads. When he put on the turban, he fought[b], and all around he subdued the foe.
translation:
  language: zh_hans
  text: 因此，女子们回应他，称颂他为“万万”[a]。他缠上头巾作战[b]，制伏了四围的仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回应他”在此语境中可能指女子们在胜利庆祝中应和歌唱；“万万”保留了原文的数字性称誉。
    reason: cultural_note
  - marker: b
    text: 希腊本作：“他就这样在万众中荣耀他，并在主的祝福中称赞他；当荣耀的冠冕被带给他的时候。”希腊本文的代词关系不十分明确，并保留了比希伯来文“头巾”更鲜明的王权形象。
    reason: alternative_reading
lexical_decisions:
- source_word: על כן
  choice: 因此
  rationale: 表达承接上文的因果关系，说明女子们的回应源于大卫先前的胜利。
- source_word: ענו לו בנות
  choice: 女子们应声向他歌唱
  rationale: ענה的基本义是“回答、回应”；结合女子庆贺胜利的语境，此处很可能指应和歌唱。“应声向他歌唱”既保留回应之意，也使现代汉语读者明白场景。בנות按语境译为“女子们”，比直译“女儿们”自然。
- source_word: ויכנוהו ברבבה
  choice: 把“万万”归给他
  rationale: 希伯来语措辞较难，可能表示以“万”称誉他；这里也呼应胜利之歌中归给大卫“万万”的说法。译文保留数字称号式表达，不把它泛化为单纯的“众人称颂”。
- source_word: בעטותו צניף
  choice: 他缠上头巾
  rationale: עטה在此表示披戴或缠裹，צניף指缠裹式头饰。“缠上头巾”紧随现存希伯来文本；希腊本更具王权色彩的异文另见脚注。
- source_word: נלחם
  choice: 出战
  rationale: 在此武事语境中自然表达“作战”，并与后面的制伏仇敌连贯。
- source_word: ומסביב הכניע צר
  choice: 制服了四围的仇敌
  rationale: הכניע表示使之屈服、制伏；מסביב表示四周或各方。צר虽为单数形式，但可作集合意义，汉语译作“仇敌”可兼容单数与群体理解。
theological_decisions:
- issue: 希伯来文本的“头巾”与希腊本的“荣耀冠冕”之间的差异
  choice: 正文依现存希伯来文本译作“头巾”
  alternative: 依希腊本译作“荣耀的冠冕”，并将整句理解为对大卫王权荣耀的称颂
  rationale: 现存希伯来文在本节是首要原文证据，其צניף通常指缠裹式头饰；希腊本可能反映另一底本或把这一形象王权化的解释。正文不消解两者差异，以脚注保存重要异文。
- issue: “万万”的含义
  choice: 保留为女子们归给大卫的数字性称誉
  alternative: 泛译为“在万人中称颂他”或“称颂他杀敌万万”
  rationale: 原文ויכנוהו ברבבה较为困难。保留“把‘万万’归给他”可呈现其与胜利歌唱传统的联系，同时避免在正文中明确补出原文未明说的“杀敌”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“应声向他歌唱”比生硬的“回答他”更符合庆功歌唱的场景，同时保留ענה的回应义；“把‘万万’归给他”有意保留希伯来语的数字性称誉及其含混之处。
