base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/008.yaml
  text: In all his work he gave thanks to God Most High with words of glory[a]; with all his heart he loved his Maker[b], and every day he gave thanks to him with songs.
translation:
  language: zh_hans
  text: 他一切所行的事，都用荣耀的话[a]向至高的上帝献上感谢；他全心爱创造他的那一位[b]，天天用诗歌向他献上感谢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“用荣耀的话”；希腊文相近，作“用荣耀的话语”（单数）。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文接着说：“天天用诗歌向他献上感谢。”希腊文平行文本则作“他歌颂并爱创造他的那一位”，没有明确的“天天”这一分句。
    reason: alternative_reading
lexical_decisions:
- source_word: בכל מעשהו
  choice: 他一切所行的事
  rationale: מעשהו是集合性表达，涵盖他全部的作为；译为“他一切所行的事”自然清楚，也保留范围的完整性。
- source_word: נתן הודות
  choice: 献上感谢
  rationale: 原文直译近于“给予感谢”；“献上感谢”符合现代汉语敬虔语境，并保留向上帝表达感恩的含义。
- source_word: לאל עליון
  choice: 向至高的上帝
  rationale: 忠实保留神圣称号עליון“至高者/至高的”；以“至高的上帝”表达自然明确。
- source_word: באמרי כבוד
  choice: 用荣耀的话
  rationale: אמרי כבוד直译为“荣耀的话语”；此译保留原文属格结构，没有擅自限定为赞美或尊荣。
- source_word: בכל לבו
  choice: 全心
  rationale: 这是表达完全委身的常见希伯来语习语；“全心”简洁自然。
- source_word: אוהב עשהו
  choice: 爱那造他的主
  rationale: עשהו指“造他的那一位”。加入“主”使中文指称自然而庄重，但核心关系仍是“造他的”。
- source_word: וכבל יום
  choice: 天天
  rationale: 传本文字略有不整，语境支持“每一天/日复一日”；“天天”自然表达持续反复之意。
- source_word: הודה לו בזמירות
  choice: 用诗歌感谢他
  rationale: הודה兼有感谢、称颂之意，זמירות指可歌唱的诗歌或颂歌；译文保留“感谢”，并以“诗歌”避免过度具体化为《诗篇》。
theological_decisions:
- issue: 神圣称号 עליון
  choice: 至高的上帝
  alternative: 至高者
  rationale: “至高的上帝”既保留称号含义，又在本句中明确受感谢的对象，不引入宗派性解释。
- issue: עשהו 对上帝的称呼
  choice: 那造他的主
  alternative: 造他的那一位／他的创造主
  rationale: 原文强调上帝是造他者；“那造他的主”在现代中文中庄重自然，同时避免用较抽象的神学术语替代原文关系。
- issue: 希伯来文与希腊文下半节差异
  choice: 正文依希伯来文保留“天天用诗歌感谢他”
  alternative: 依希腊文作“他歌颂并爱那造他的”
  rationale: 指定的希伯来文为主要来源，且明确含有每日以诗歌感谢的分句；希腊平行文本的不同次序及缺句应在脚注交代，不应在正文中调和。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“献上感谢”“至高的上帝”保持经文语体，但避免古奥表达。正文以希伯来文为主，并用脚注保留希腊平行文本的真实差异。
