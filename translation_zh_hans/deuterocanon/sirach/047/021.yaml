translation:
  language: zh_hans
  text: 把百姓分成两个支派[a]，又有一个行强暴的王国[b]出自以法莲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“使统治分裂，并从以法莲兴起一个悖逆的王国。”希伯来文本更明确地说“把百姓分成两个支派”。
    reason: alternative_reading
  - marker: b
    text: “行强暴的”也可译作“不义的”；希伯来语 חמס 可指暴力、残害或恶行。希腊文本则作“悖逆的”或“不顺从的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לחלק
  choice: 分成
  rationale: 此处不定式表示造成分裂；“分成”自然地表达政治群体被划分的结果。
- source_word: העם
  choice: 百姓
  rationale: 直译希伯来语“人民”，在此指分裂前作为整体的人民；“百姓”符合经书语体且通俗。
- source_word: לשני שבטים
  choice: 两个支派
  rationale: שבטים 字面为“支派”。尽管历史背景是南北国分裂，正文保留希伯来文本的具体措辞。
- source_word: ומאפרים
  choice: 又从以法莲
  rationale: מן 表示来源；“从以法莲”保留王国从何处兴起的宽泛含义。
- source_word: ממלכת
  choice: 王国
  rationale: ממלכה 在此具有政治实体的意义，与希腊语 βασιλεία 相符。
- source_word: חמס
  choice: 强暴的
  rationale: חמס 首要涵盖暴力、残害和不义。“强暴的”紧贴希伯来语，同时脚注保留“不义/悖逆”的可能性。
- source_word: ἄρξαι βασιλείαν ἀπειθῆ
  choice: 兴起一个悖逆的王国（希腊文本）
  rationale: 希腊平行文本明说“开始/兴起”并以“悖逆、不顺从”形容王国，可帮助说明希伯来语 חמס 在此可能含有叛逆意味，但不取代希伯来正文。
theological_decisions:
- issue: 如何定性从以法莲而来的王国
  choice: 强暴的王国
  alternative: 不义的王国；悖逆的王国
  rationale: 希伯来语 חמס 直接指向暴力或恶行，而希腊语 ἀπειθῆ 强调不顺从、悖逆。正文优先依从高可信度希伯来文本，脚注则保存其道德及政治宗教层面的多义性。
- issue: 第二分句是否补出产生或兴起的动词
  choice: 补出“产生了”以构成自然汉语
  alternative: 又从以法莲，一个强暴的王国
  rationale: 希伯来语第二分句是无动词短语，语义关系较为凝缩。现代汉语若完全照搬会显得残缺，因此补出一般性的“产生了”，不具体断定是建立、统治还是使之兴起。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“百姓”“支派”“以法莲”“王国”保留经书语域，但避免过度古雅。脚注标记均置于其所说明的正文成分之后。
