base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/010.yaml
  text: He gave splendor[a], beauty, and glory to the festivals year after year; when they praised his holy name[b], before morning the court resounded.
translation:
  language: zh_hans
  text: 他使各节期年复一年充满威严、华美和尊荣；他们赞美他的圣名时，圣所从清早起便回响。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来语末句可近似直译为“清晨以前，判决（或法度）鸣响”，意思不明。希腊文平行本作“圣所从清早起便回响”；正文据此表达。
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לחגים
  choice: 他使各节期……充满
  rationale: נתן 的基本义是“给予”；此处与抽象的尊荣词组连用，译作“使……充满”较符合现代汉语，同时保留大卫使节期增添荣美的含义。ל 表明这些荣美是赋予节期的。
- source_word: בכל שנה ושנה
  choice: 年复一年
  rationale: 重复“年”的希伯来语习语强调每年持续重现；“年复一年”自然地保留这种反复性。
- source_word: הוד פאר וכבוד
  choice: 威荣、华美和尊荣
  rationale: 原文连续使用三个意义相近但不完全相同的名词。译文保留三项：הוד 表示庄严显赫的荣美，פאר 强调华美，כבוד 表示尊荣或荣耀。
- source_word: בהללו את שם קדשו
  choice: 他们赞美他的圣名时
  rationale: ב 加不定式结构在此表达伴随或时间关系；结合上下文及希腊文平行本所明示的复数主体，译为“他们……时”。“他的圣名”是该希伯来语属格结构自然且庄重的汉语表达。
- source_word: לפני בקר ירן משפט
  choice: 圣所从清早起便回响着赞美声
  rationale: 现存希伯来语末句语义艰涩，其中 משפט 通常意为“判决、法度”，在这里与“欢呼/鸣响”难以形成清楚语意。希腊文平行本作“圣所从清早起便回响”，很可能保存了较可靠的句意；补出“赞美声”使汉语明确承接前句。
theological_decisions:
- issue: 现存希伯来语末句与希腊文平行本的差异
  choice: 正文采用希腊文所保存的“圣所从清早起便回响”的通顺句意，并用脚注说明希伯来语读法。
  alternative: 按现存希伯来语直译为“清晨以前，判决（或法度）欢呼”，或把 משפט 解释为“法庭”。
  rationale: 希伯来语的词形虽可辨认，组合后的语义却异常且可能存在传抄讹误；希腊文与节期、圣名和圣殿敬拜的语境连贯。采用平行本并公开标注异文，既不掩盖文本困难，也不把不确定解释冒充确定原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“节期”“圣名”“圣所”保留经文语域；荣美词组不作英语式压缩，以反映希伯来文三重并列。分号维持两行诗意之间的紧密联系。
