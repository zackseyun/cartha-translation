    text: 希伯来文更直译为“使他的过犯过去”；希腊文作“主除去了他的罪”。
    reason: 说明希伯来措辞的形象及希腊平行文本的差异。
  - marker: b
    text: 希腊文作“赐给他君王之约，以及在以色列的荣耀宝座”。希伯来文末句较直译为“使他的宝座坚立，直到（或：远至）耶路撒冷”；这里的地点／范围关系不十分明确。
    reason: 保存希伯来文与希腊文关于王权安排及宝座地点的显著异文，并保留希伯来文末语的句法不确定性。
  revision_rationale: 修订以现存希伯来文本为主。“远至耶路撒冷”虽略具书面色彩，却比“在耶路撒冷”更忠实地保留 עד 的空间延伸及原文的疑难，且脚注明确说明。将“君王之位的定例”改为“一项王权的定例”，使现代汉语更清楚，同时维持 חוק 的法定／定例语义，不混入希腊文的“约”。
