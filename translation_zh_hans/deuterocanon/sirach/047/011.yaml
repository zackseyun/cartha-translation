base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/011.yaml
  text: Yahweh also passed over his transgression[a], and exalted his horn forever; he gave him a decree of kingship[b], and established his throne in Jerusalem.
translation:
  language: zh_hans
  text: 耶和华也赦免了他的过犯[a]，使他的角永远高举；又赐给他君王之位的定例[b]，并在耶路撒冷坚立他的宝座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文更直译为“使他的过犯过去”；希腊文作“主除去了他的罪”。
    reason: 说明希伯来措辞的形象及希腊平行文本的差异。
  - marker: b
    text: 希腊文作“赐给他君王之约，以及在以色列荣耀的宝座”。希伯来文末句较直译为“坚立他的宝座，直到（或：远至）耶路撒冷”。
    reason: 保存希伯来文与希腊文关于王权安排及宝座地点的显著异文。
lexical_decisions:
- source_word: יהוה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式明确呈现神名，避免仅译作称号“主”。
- source_word: העביר פשעו
  choice: 赦免了他的过犯
  rationale: העביר本义为“使之过去、除去”，在此语境表达神不再追究；中文译为“赦免”自然清楚，“过犯”保留פשע较“罪”更强的违逆意味。
- source_word: וירם לעולם קרנו
  choice: 使他的角永远高举
  rationale: 保留希伯来文“角”这一象征力量、尊荣与王权的意象，并以“高举”自然表达רום。
- source_word: חוק ממלכת
  choice: 君王之位的定例
  rationale: חוק具有定例、法定安排之意；ממלכת在此关乎王权或君王身份。此译避免混同希腊文的“君王之约”，同时比生硬的“王权法令”更易懂。
- source_word: וכסאו הכין
  choice: 并……坚立他的宝座
  rationale: כון的使役式在此指使宝座稳固、确立；“坚立”兼顾王朝稳固的含义与庄重语体。
- source_word: עד ירושלים
  choice: 在耶路撒冷
  rationale: עד通常可指“直到、远至”，但此处直译会造成地点关系含混；结合句法语境，以“在耶路撒冷”表达王座设立之处，同时在脚注交代字面读法及希腊异文。
theological_decisions:
- issue: 神如何处理大卫的过犯
  choice: 译作“赦免了他的过犯”，不扩展其救赎论含义
  alternative: “使他的过犯过去”或依希腊文译“除去了他的罪”
  rationale: 希伯来文意象指使过犯过去或不再追究；中文主文以“赦免”清楚传意，脚注保留希伯来文与希腊文措辞差异。
- issue: 赐予王权安排的性质
  choice: 依希伯来文译“君王之位的定例”
  alternative: 依希腊文译“君王之约”
  rationale: 现存希伯来文חוק ממלכת并非明确的“约”；主文优先采用希伯来见证，不将希腊文的盟约措辞纳入正文。
- issue: 大卫宝座的地点或延伸范围
  choice: 正文译“在耶路撒冷坚立他的宝座”
  alternative: 较字面地译“坚立他的宝座，直到耶路撒冷”或依希腊文译“在以色列有荣耀的宝座”
  rationale: 希伯来文עד ירושלים字面有“直到／远至耶路撒冷”之意，但在此语境关系不够明确；正文采用自然的地点表达，脚注如实保存文本张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。保留“角”这一重要的希伯来王权意象；法律性表达采用“定例”，避免过度教派化或将希腊异文无声并入正文。所有脚注标记均已置于正文。
