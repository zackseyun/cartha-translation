translation:
  language: zh_hans
  text: 祭物的脂油怎样被分别出来，大卫也照样从以色列人中被分别出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处十分简练，也可译作：“从圣物中分别出来的脂油怎样，大卫也照样从以色列中被分别出来。”希腊文更明确地作“从平安祭中分别出来的脂油……从以色列众子中”。
    reason: 说明希伯来文的简省表达，并保留希腊平行文本所见的较明确读法。
lexical_decisions:
- source_word: כחלב
  choice: 祭物的脂油怎样
  rationale: חֵלֶב通常指脂油；本句采用具体的献祭意象，不抽象译作“上好的部分”。“祭物的”由后文献祭语境补足，使现代汉语自然。
- source_word: מורם
  choice: 被分别出来
  rationale: 该被动分词在献祭语境中表示某一份被举起、取出并划归特定用途；希腊文ἀφωρισμένον也支持“分别出来”。
- source_word: מקדש
  choice: 祭物
  rationale: 希伯来文表达简省，字面可涉及“圣物”；结合希腊文σωτηρίου，所指是献祭之物而非建筑意义的圣所。正文用宽泛的“祭物”，避免过度限定祭种。
- source_word: כן דוד מישראל
  choice: 大卫也照样从以色列人中被分别出来
  rationale: 希伯来文简练，比较结构承接前句的“被分别出来”；介词מן表示从群体中分别，希腊文“从以色列众子中”进一步印证这一理解。
theological_decisions:
- issue: 是否明说大卫是蒙上帝拣选
  choice: 译为“大卫……从以色列人中被分别出来”
  alternative: “大卫也照样蒙上帝从以色列人中拣选”
  rationale: 经文本句借献祭脂油表达大卫的尊荣与独特地位，却没有明说行动者是上帝，也没有直接使用“拣选”一词；因此保留暗含的神学意味，不加入原文未明说的教义表述。
- issue: 是否把希腊文所示的祭种写入正文
  choice: 正文仅作“祭物”，脚注交代另一种较明确的理解
  alternative: “平安祭的脂油怎样被分别出来”
  rationale: 希伯来文מקדש较简省且存在解释空间；希腊文σωτηρίου可能指平安祭，但正文不应仅凭平行文本把较窄的祭种确定化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为使比喻两端结构清楚，后半句补出由前半句承接的“被分别出来”；用“以色列人中”自然表达群体中的分离义。脚注标记置于正文句末。
