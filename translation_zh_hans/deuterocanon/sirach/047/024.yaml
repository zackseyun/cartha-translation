base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/024.yaml
  text: A broad folly and lacking understanding was Rehoboam[a], who caused the people to revolt by his counsel, until one arose—may there be no remembrance of him—Jeroboam son of Nebat[b], who sinned and caused Israel to sin.
translation:
  language: zh_hans
  text: 罗波安愚昧至极，缺乏明智；他凭自己的谋略使百姓离叛。[a] 直到有一人兴起——愿他不被记念——就是尼八的儿子耶罗波安；他犯罪，又使以色列犯罪。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希伯来文本十分压缩，句法也不稳定。希腊平行文本的意思较完整，大意是罗波安因自己的决策使百姓离叛。
    reason: textual_variant
  - marker: b
    text: 希腊平行文本在这里另有“给以法莲开了一条犯罪之路”；现存希伯来文本没有明确保留这句话，因此未收入正文。
    reason: textual_variant
lexical_decisions:
- source_word: רחב אולת
  choice: 愚昧至极
  rationale: 传世希伯来文本的表达压缩且不寻常；רחב 本有“宽广、众多”之意，与 אולת 连用可表达愚昧之甚。译为“愚昧至极”在现代汉语中自然，并保留强烈的贬义评价，而不武断补入希腊文本中的“百姓”。
- source_word: חסר בינה
  choice: 缺乏明智
  rationale: 直接表达欠缺理解力和判断力；“明智”比“聪明”更符合君王施政语境，也与希腊文 ἐλαττούμενον συνέσει 相符。
- source_word: רחבעם
  choice: 罗波安
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: הפריע בעצתו עם
  choice: 他按自己的谋算使百姓背叛
  rationale: 此处希伯来动词和句法均较困难。希腊平行文本 ἀπεστέτησεν λαὸν ἐκ βουλῆς αὐτοῦ 支持因其谋略或决策导致百姓离叛的含义；“谋算”保留 בעצתו 可指谋议、计策或决策的范围。
- source_word: עד אשר קם
  choice: 直到有一人兴起
  rationale: 按现存希伯来文直译，保留其与上下文衔接略显突兀的特点，不以希腊文本重构或删除。
- source_word: אל יהי לו זכר
  choice: 愿他不被记念
  rationale: 保留希伯来文的咒诅式愿望语气，不弱化为单纯的负面评价。
- source_word: ירבעם בן נבט
  choice: 尼八的儿子耶罗波安
  rationale: 采用中文圣经传统通行的人名形式，并用自然的现代汉语表达父子关系。
- source_word: חטא והחטיא את ישראל
  choice: 他自己犯罪，又使以色列陷入罪中
  rationale: 明确保留 חטא 与使役式 החטיא 的区别：先是本人犯罪，继而使以色列犯罪；“陷入罪中”在中文中自然地表达其导致性。
theological_decisions:
- issue: 希伯来文本压缩且与希腊平行文本存在较大差异
  choice: 正文以现存希伯来文为主，保留罗波安、‘直到有一人兴起’及‘愿他不被记念’的连续表述；以希腊文辅助理解罗波安导致百姓离叛的难句。
  alternative: 按照较完整的希腊文本译出所罗门留下后裔、百姓的愚昧，以及耶罗波安‘给以法莲开了一条犯罪之路’。
  rationale: 希伯来文在此虽压缩、分节不稳，却明确保存了若干希腊文没有对应的措辞。译文不应舍弃这些希伯来证据，也不应把仅见于希腊文的扩展无标记地纳入正文。
- issue: אל יהי לו זכר 所指对象可能不够明确
  choice: 在破折号结构中保留‘愿他不被记念’，使其自然指向随后点名的耶罗波安，同时不作解释性增补。
  alternative: 将这句话明确处理为对罗波安或另一未具名人物的咒诅。
  rationale: 现存语序最自然地让该愿望与即将出现的耶罗波安相连，但压缩文本不足以完全消除歧义，因此正文避免加入明确代词或身份说明。
- issue: 耶罗波安对以色列犯罪的责任
  choice: 译作‘他自己犯罪，又使以色列陷入罪中’。
  alternative: 译作较弱的‘他犯罪，并给以色列一条犯罪的路’。
  rationale: 希伯来文 החטיא 是明确的使役形式；译文保留个人犯罪与诱使群体犯罪之间的张力，不将责任淡化。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“愚昧至极，缺乏明智”保持智慧文学的评断语气；破折号保留压缩希伯来文本中突转和咒诅式插语的张力。人名采用简体中文圣经通行译名。
