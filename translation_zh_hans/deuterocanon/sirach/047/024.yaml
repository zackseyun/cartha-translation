revisions:
- from: 罗波安愚昧至极，缺乏明智；他按自己的谋算使百姓背叛。[a] 直到有一人兴起——愿他不被记念——就是尼八的儿子耶罗波安；他自己犯罪，又使以色列陷入罪中。[b]
  to: 罗波安愚昧至极，缺乏明智；他凭自己的谋略使百姓离叛。[a] 直到有一人兴起——愿他不被记念——就是尼八的儿子耶罗波安；他犯罪，又使以色列犯罪。[b]
  rationale: 修订仅收紧语义：以“凭自己的谋略使百姓离叛”表达难解的 הפריע בעצתו עם，并按 חטא והחטיא 的非使役与使役对照，译作“他犯罪，又使以色列犯罪”。保留“直到有一人兴起——愿他不被记念——”的压缩与所指未完全确定性，也保留脚注对希腊文扩展的说明。
