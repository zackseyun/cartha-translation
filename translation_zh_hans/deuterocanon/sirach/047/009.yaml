  yaml_path: translation/deuterocanon/sirach/047/009.yaml
  text: With songs in the gardens he made preparation before the altar[b][a], and he arranged the sound of psalm and harps.
translation:
  language: zh_hans
  text: 他在园中以歌声，在祭坛前作预备；又安排诗歌和竖琴[b]的声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在园中以歌声”所据的希伯来文含义不确定。希腊文译本作：“他把歌唱者安置在祭坛对面，藉着他们的声音使曲调悦耳。”这可能反映不同的底本，或希伯来文本在流传中发生了讹误。
    reason: textual_variant
  - marker: b
    text: “竖琴”也可译作“里拉琴”；希伯来词指一种弦乐器。
    reason: lexical_alternative
lexical_decisions:
- source_word: בגינות שיר
  choice: 在园中以歌声
  rationale: 按现存希伯来文本的字面结构翻译；בגינות通常可理解为“在园中”，שיר为“歌、歌声”。原句含义困难，故不在正文中据希腊文本改成“歌唱者”，而以脚注说明异文。
- source_word: הכין
  choice: 作了预备
  rationale: 该词可指“预备、使就绪、设立”。希伯来文未明确指出所预备的宾语，因此采用不增补具体对象的表达。
- source_word: לפני מזבח
  choice: 在祭坛前
  rationale: 直接表达其空间或礼仪方位；在圣殿语境中，汉语用“祭坛”自然且明确。
- source_word: קול
  choice: 声音
  rationale: 该词既可指“声音”也可指“嗓音”；此处与诗歌和乐器相连，用较宽泛的“声音”可保留原文范围。
- source_word: מזמור
  choice: 诗歌
  rationale: 指用于歌唱的乐歌，常有礼仪色彩；“诗歌”在现代汉语中自然，也避免把它限定为《诗篇》中的某一篇。
- source_word: נבלים
  choice: 竖琴
  rationale: 指古代弦乐器，具体形制难以确定；“竖琴”通俗易懂，并以脚注保留“里拉琴”等可能译法。
- source_word: תקן
  choice: 编排妥当
  rationale: 该动词有“整理、安排、使有秩序”之意；在音乐和礼仪语境中，“编排妥当”自然体现其动作结果。
theological_decisions:
- issue: 困难的希伯来文本与较顺畅的希腊平行文本之间的取舍
  choice: 正文以现存希伯来文为准，保留“在园中以歌声”这一困难表达，并在脚注中列出希腊文本的不同读法。
  alternative: “他把歌唱者安置在祭坛对面，使他们以歌声增添旋律的悦耳。”
  rationale: 希伯来见证虽难解，却是本节现存的原文证据；希腊文本可能反映不同底本或对讹误文本的另一传承。将希腊读法直接纳入正文会掩盖真实的文本差异，因此正文与脚注分别呈现。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“作了预备”有意保留原文宾语未明的特点；“编排妥当”使后半句在汉语中顺畅，同时维持音乐与礼仪安排的语境。所有不确定之处均以脚注明示，未将希腊平行文本静默融入正文。
