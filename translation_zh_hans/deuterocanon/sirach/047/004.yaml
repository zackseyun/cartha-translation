base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/004.yaml
  text: In his youth he struck down a warrior and removed everlasting disgrace[a]; when he raised his hand with the sling[b], he shattered the glory of Goliath.
translation:
  language: zh_hans
  text: 他年轻时击倒勇士，除去了永久的耻辱[a]；他举手用投石索，粉碎了歌利亚的荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“除去了百姓所受的羞辱”；希伯来文作“除去了永久的耻辱”。
    reason: alternative_reading
  - marker: b
    text: 希腊文明确说他杀死了“巨人”，并提到投石索的石头；末句则作击倒歌利亚的“夸耀”（或“骄傲”）。
    reason: lexical_alternative
lexical_decisions:
- source_word: בנעוריו
  choice: 他年轻时
  rationale: 自然表达大卫年少的时期，不额外限定具体年龄。
- source_word: הכה גבור
  choice: 击倒勇士
  rationale: גבור 可指勇士、强者；以现存希伯来文为主，不在正文采用希腊文更明确的“巨人”。“击倒”既保留 הכה 的打击义，也符合大卫杀死歌利亚的语境。
- source_word: ויסר חרפת עולם
  choice: 除去了长久的耻辱
  rationale: 按希伯来文直译其核心意象。עולם 在这里可表达久远、恒久；“长久的”比“永恒的”更自然，也避免暗示严格的形而上意义。
- source_word: בהניפו ידו על קלע
  choice: 他扬手甩动投石索
  rationale: 希伯来语结构简练，字面涉及扬手与投石索；中文补出“甩动”，使动作清楚而不改变其工具性。希腊文提到投石索的石头，可作为语境印证。
- source_word: וישבר תפארת גלית
  choice: 粉碎了歌利亚的威荣
  rationale: תפארת 可指荣耀、华美或引以为傲之处；“威荣”保留其公开显赫与骄矜的双重色彩，而“粉碎”传达 וישבר 的强烈意象。
theological_decisions:
- issue: 希伯来文与希腊文对所除耻辱的表述不同
  choice: 正文采用现存希伯来文“除去了长久的耻辱”
  alternative: 希腊文作“除去了百姓所受的羞辱”
  rationale: 《便西拉智训》有存世希伯来文时以其为主要依据，同时在脚注保留希腊平行文本的群体指向，不把差异静默消解。
- issue: 被击倒者的称谓
  choice: 按希伯来文译为“勇士”
  alternative: 希腊文明确作“巨人”
  rationale: 保留希伯来文本较宽的词义，并借上下文中的歌利亚明确所指；不以希腊文的解释性称谓取代正文。
- issue: 歌利亚的 תפארת 如何理解
  choice: 译为“威荣”
  alternative: 可译为“骄傲”或“夸耀”
  rationale: 希伯来词本身兼有荣耀、显赫和骄矜的可能，采用“威荣”以保留语义张力；希腊文 γαυρίαμα 则较明显偏向夸耀或骄傲。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“投石索”比单说“甩石器”更贴近古代武器；“威荣”略带诗性，以对应希伯来文 תפארת 的宽广语义。所有脚注标记均已置于正文。
