translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“雅言”略带文学色彩，以对应原文 מליצה 的修辞意味；主句保持简洁有力。脚注标记置于整句末尾，涵盖希伯来文末句的困难及希腊文对整句的平行见证。
