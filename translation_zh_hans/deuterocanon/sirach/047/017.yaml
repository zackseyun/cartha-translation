translation:
  language: zh_hans
  text: 你以诗歌、箴言、谜语和雅辞，使万民惊叹。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾的希伯来词较难，也可较直译为“你震动了万民”。希腊文作：“各地在诗歌、箴言、比喻和解释中都对你惊叹。”
    reason: textual_variant
lexical_decisions:
- source_word: בשיר
  choice: 以诗歌
  rationale: 前缀 ב 可表示方式或凭借；“以诗歌”自然地表达工具性含义，也与希腊文 ἐν ᾠδαῖς 相符。
- source_word: משל
  choice: 箴言
  rationale: 在智慧文学语境中，משל 通常指箴言或智慧格言；“箴言”准确且为现代读者熟悉。
- source_word: חידה
  choice: 谜语
  rationale: חידה 常指谜语或隐晦之言；“谜语”简明地保留其智慧文学含义。
- source_word: ומליצה
  choice: 雅言
  rationale: מליצה 可指优美、讲究修辞的言语，也可能有“解释”之意。“雅言”保留其文辞优美的色彩，并与诗歌、箴言、谜语组成文学形式的并列项；希腊文的另一理解在脚注中说明。
- source_word: עמים
  choice: 万民
  rationale: עמים 是复数集合名词，指众民或各族。“万民”以庄重自然的汉语传达广泛的复数范围，而不局限于政治意义上的国家。
- source_word: הסערתה
  choice: 使万民惊叹
  rationale: 该希伯来语形式较难，词根 סער 可含搅动、震撼之意；希腊文 ἀπεθαύμασάν σε χῶραι 明确指各地因你而惊叹。译文表达造成震撼惊异的结果，同时用脚注保留文本困难。
