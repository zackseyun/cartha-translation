  text: He gave cities among the Philistines[b][a], and to this day he has broken their horn.
translation:
  language: zh_hans
  text: 他在非利士人中设立城邑[a]；直到今日，他折断了他们的角[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“从非利士人那里取得城邑”或“在非利士境内设立城邑”。希伯来文的表达十分凝练；希腊文平行文本表明，这句话所说的是大卫对非利士人的持久挫败。
    reason: alternative_reading
  - marker: b
    text: “角”是圣经中象征力量或权势的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  choice: 赐下
  rationale: נתן通常表示“给、赐、置于”。这里保留希伯来文简洁的“给”这一表述，不依据希腊文扩写为“消灭”或“征服”。
- source_word: בפלשתים
  choice: 在非利士人中
  rationale: 介词ב与族名连用时，此处含义较为压缩，可指在非利士人中、非利士境内，或涉及从他们那里取得；正文贴近希伯来文形式，歧义以脚注说明。
- source_word: ערים
  choice: 城邑
  rationale: ערים意为城市或城镇；“城邑”自然庄重，也适合古代军事与政治语境。
- source_word: ועד היום
  choice: 直到今日
  rationale: 直译该时间短语，表达其结果持续到作者所说的“今日”。
- source_word: שבר קרנם
  choice: 仍折断了他们的角
  rationale: שבר意为折断、打碎；קרנם直译为“他们的角”。“角”是圣经中力量或权势的形象，希腊平行文本也保留此意象。加入“仍”使“直到今日”所表达的持续效力在现代汉语中更清楚，但不把意象解释进正文。
theological_decisions:
- issue: 大卫对非利士城邑所采取行动的历史含义
  choice: 保留希伯来文关于“在非利士人中赐下城邑”的简练说法
  alternative: 译作“他从非利士人手中夺取城邑”或依希腊文概括为“他击溃四围的敌人”
  rationale: 现存希伯来文应主导正文；其表达虽压缩，却不宜借希腊平行文本直接扩写。希腊文可作为语境佐证，表明本节涉及大卫对非利士势力的持久挫败。
- issue: “角”的神学与诗性意象
  choice: 正文保留“角”
  alternative: 直接译为“力量”或“权势”
  rationale: 希伯来文与希腊文均使用“角”的意象。保留这一圣经修辞，避免把其多层含义缩减为单一抽象名词，并用脚注帮助普通读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“非利士人”和“城邑”符合常见圣经语域；保留“折断他们的角”这一原文意象，并通过脚注解释。正文中的脚注标记按出现顺序排列为[a]、[b]。
