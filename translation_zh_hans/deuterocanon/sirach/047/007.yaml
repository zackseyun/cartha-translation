- from: 他在非利士人中赐下城邑[a]；直到今日，他仍折断了他们的角[b]。
  to: 他在非利士人中设立城邑[a]；直到今日，他折断了他们的角[b]。
  rationale: 修订以希伯来文为先：“设立”对应נתן在地点短语中的“置设”用法，同时不把原文压缩的介词结构扩写为确定的征服叙述。删除“仍”以消除不自然的完成体搭配；“直到今日”仍保留原文所表达的持久效果。脚注继续保留不确定性及希腊文本所提供的历史语境，且所有脚注锚点均与正文对应。
