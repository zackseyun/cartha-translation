base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/022.yaml
  text: But God will not abandon mercy[a], nor let any of his words fall to the ground. He will not cut off offspring and posterity from his chosen one[b], and he will not destroy the seed of the one who loved him.
translation:
  language: zh_hans
  text: 但上帝不会离弃他的慈爱[a]，也不会让他所说的任何一句话落空。他不会从他所拣选的人[b]剪除后代和子孙，也不会灭绝那爱他之人的后裔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“但主决不会离弃他的怜悯，也决不会毁坏他的任何作为。”希伯来文在后一分句则作：“也不会让他所说的任何一句话落空。”
    reason: textual_variant
  - marker: b
    text: 希伯来文“他所拣选的人”所依据的形式也可理解为复数“他所拣选的人们”；希腊平行文本支持单数。
    reason: alternative_reading
lexical_decisions:
- source_word: אל
  choice: 上帝
  rationale: 希伯来文本用通称神衔“אל”，并非四字神名；译作“上帝”直接反映主要见证，希腊平行文本的“主”则在脚注所引异文中保留。
- source_word: יטוש חסד
  choice: 丢弃他的慈爱
  rationale: “יטוש”表示离弃、丢弃；“חסד”在这里指上帝信实而怜悯的恩慈。译作“慈爱”既保留盟约色彩，也符合现代中文圣经语体。
- source_word: ולא יפיל מדבריו ארצה
  choice: 也不会让他所说的任何一句话落空
  rationale: 直译是“不让他的话落到地上”，这一习语表示所说的话不会失效；中文用“落空”自然传达意义，同时不把“话”抽象化为一般计划。
- source_word: לא יכרית לבחיריו נין ונכד
  choice: 他不会使他的蒙拣选者断子绝孙
  rationale: “נין ונכד”是强调世代延续的成对表达；“断子绝孙”在现代中文中凝练而准确地表达不使后代断绝。“לבחיריו”的数存在歧义，正文依希腊平行文本和大卫王朝语境取单数。
- source_word: זרע אובהו
  choice: 那爱他之人的后裔
  rationale: “זרע”在王朝语境中指后裔；“אובהו”指那位爱上帝的人，希腊文本也支持过去时所指，语境很可能是大卫，但正文不直接补出名字。
- source_word: ישמיד
  choice: 灭绝
  rationale: 该动词表示毁灭、除尽；用于家系后裔时，“灭绝”准确而庄重。
theological_decisions:
- issue: 开头的神衔
  choice: 上帝
  alternative: 主
  rationale: 主要希伯来见证为 אל，而希腊平行文本为 Κύριος。正文优先依希伯来文，不以传统译法取代原文神衔；希腊异文在脚注中说明。
- issue: “蒙拣选者”的单复数
  choice: 单数“他的蒙拣选者”
  alternative: 复数“他的蒙拣选者们”
  rationale: 希伯来形式可被理解为复数，但希腊平行文本明确为单数，且上下文聚焦于大卫及其王朝。正文采用较可能的单数，同时以脚注保存歧义。
- issue: חסד 的表达
  choice: 慈爱
  alternative: 怜悯
  rationale: 希腊 ἔλεος 支持“怜悯”，但希伯来 חסד 还带有信实恩慈和盟约忠诚的意味；“慈爱”较能保留其语义幅度，不将其限缩为同情怜悯。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“落空”传达希伯来习语而避免生硬直译；“断子绝孙”虽为常用成语，但语义严肃，适合此处王朝血脉不被截断的语境。所有文本异文和数的歧义均以脚注明示。
