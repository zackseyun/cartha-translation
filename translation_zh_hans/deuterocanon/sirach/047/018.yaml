base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/018.yaml
  text: You were called by the honored name, the one invoked over Israel; and you amassed gold like iron, and multiplied silver like lead.
translation:
  language: zh_hans
  text: 你以那尊贵的名被称[a]；这名是称在以色列之上的。你积聚黄金如铁，又使白银增多如铅。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“以那尊贵的名被称；这名是称在以色列之上的。”希伯来语“名被称在某人之上”是一种习语，可表示这名与其相关、归属其上或临在其上，也可含有受人求告的意思；希腊文本也支持保留这种含混性。
    reason: 说明希伯来习语的可能语义范围，同时避免把正文未明说的关系限定为“以色列所求告”。
lexical_decisions:
- source_word: נקראת בשם הנכבד
  choice: 你得以那尊贵的名为称
  rationale: 保留希伯来文被动语态和“以某名为称”的结构；“尊贵”传达 נכבד 所含的尊荣、分量与荣耀，同时避免过度阐释。上下文中的第二人称指向所罗门。
- source_word: הנקרא על ישראל
  choice: 那称在以色列之上的名
  rationale: 尽量保留“名被称在某人之上”这一希伯来习语及其含混性；它可表达求告、归属或临在。希腊文 ἐπικεκλημένου 也支持“称在／求告于”这一语义范围。
- source_word: ותצבר
  choice: 你积聚
  rationale: 该动词表示收集、储积；“积聚”自然地表达君王累积财富的语境。
- source_word: כברזל זהב
  choice: 黄金，多如铁
  rationale: 保留原文简洁的比喻，强调黄金数量极多，仿佛普通的铁一样常见。
- source_word: וכעפרת הרבית כסף
  choice: 又使白银增多，多如铅
  rationale: עפרת 在此指铅，希腊平行文本 μόλιβον 亦予以印证；הרבית 表示使之增多。译文保留白银与铅的平行比较。
theological_decisions:
- issue: “尊贵的名”所指为何
  choice: 保留为与以色列相连、称在以色列之上的神圣之名，不进一步说明所罗门如何承受此名。
  alternative: 明确译成“耶和华的名”，或解释为所罗门承受主名／以色列具有圣约归属。
  rationale: 希伯来文和希腊文都暗示这是与以色列相关的神圣之名，但本句没有明说该名，也未解释其神学机制；因此译文保留原有的暗示与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。财富部分保留原文紧凑的诗性平行结构；关于“名”的表达则略带异质感，以保存希伯来习语本有的含混性。
