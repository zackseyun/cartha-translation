  text: How wise you were in your youth[a], and instruction overflowed like the Nile.
translation:
  language: zh_hans
  text: 你年轻时何等有智慧！你的训诲如尼罗河般涌流。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文在这里有显著不同的读法：“你的心灵覆盖了大地，你又使大地充满谜语般的比喻。”这可能反映了不同的希伯来底本或分歧的文本传统。
    reason: alternative_reading
lexical_decisions:
- source_word: מה
  choice: 何等
  rationale: 这里是感叹用法，表达赞叹，并非提出疑问；“何等”庄重而自然。
- source_word: חכמת
  choice: 有智慧
  rationale: 按 חכם 的状态性含义处理；与感叹词连用，译成“何等有智慧”比直译“你的智慧何等大”更符合现代汉语。
- source_word: בנעוריך
  choice: 年轻时
  rationale: 直接表达所罗门年少时期，简洁自然。
- source_word: ותצף
  choice: 涌流
  rationale: 该动词在此呈现水丰沛涌动的意象；“涌流”既保留动态，也表达训诲丰盛不绝。
- source_word: כיאר
  choice: 如尼罗河般
  rationale: יאר 常特指尼罗河；保留专名比泛译为“河流”更能传达原文意象。
- source_word: מוסר
  choice: 训诲
  rationale: מוסר 可兼有教导、管教与塑造之意；“训诲”在本句中自然、庄重，也保留其劝导和培育意味。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本明显不同
  choice: 正文以现存希伯来文本为准，并在脚注保存希腊异文
  alternative: 按希腊文译作“你的心灵覆盖大地，你又使大地充满含谜的比喻”
  rationale: 本节有可靠的希伯来见证，故正文优先依从希伯来文；希腊文反映显著不同的古代文本传统，不应默默调和或取代，但应明确记录。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“何等”保留赞叹语气；“训诲”兼顾 מוסר 的教导与塑造内涵；以“涌流”配合尼罗河意象。脚注标记已在正文中以 [a] 出现。
