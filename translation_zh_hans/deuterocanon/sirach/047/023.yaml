  yaml_path: translation/deuterocanon/sirach/047/023.yaml
  text: And he gave a remnant to Jacob[a], and to the house of David a root from him. And Solomon lay down with his fathers[c][b], and left behind him one of his offspring.
translation:
  language: zh_hans
  text: 他赐给雅各余民，也赐给大卫家一个从他而出的根[a]。所罗门与列祖同眠[b]，身后留下一个后裔[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “根”也可按比喻译为“后代”或“后裔”。“从他而出”中的“他”在此上下文中的所指并不完全确定。
    reason: lexical_alternative
  - marker: b
    text: 此处希伯来文本中“所罗门同眠”之后的一个词难以确定，或可理解为“年老”或“衰残”；希腊语平行文本作“与列祖”，正文据此翻译。
    reason: textual_variant
  - marker: c
    text: “后裔”所对应的希伯来词罕见，确切含义不确定；也可译作“继承人”或“子孙”。
    reason: alternative_reading
lexical_decisions:
- source_word: שארית / κατάλιμμα
  choice: 余民
  rationale: 希伯来语 שארית 和希腊语 κατάλιμμα 都指被留下、得以存留的部分；“余民”在现代中文圣经语境中自然，也保留群体与家系延续的意味。
- source_word: שרש / ῥίζαν
  choice: 根
  rationale: 希伯来语和希腊语均使用“根”的具体意象；此处比喻大卫家系的延续。正文保留这一意象，不直接释作“后代”，以免消除原文的象征张力。
- source_word: וישכב ... / ἀνεπαύσατο
  choice: 与列祖同眠
  rationale: וישכב 在死亡语境中可表达“躺下、长眠”；希腊语平行文本有“与列祖一同安息”。“与列祖同眠”既清楚表达死亡，也保留古代家族性死亡惯用语。
- source_word: מיושש
  choice: 与列祖
  rationale: 现存希伯来文本的 מיושש 难解，可能涉及“年老、衰残”等意思；但希腊语平行文本明确读作“与列祖”。正文采用较有文本支持且符合死亡惯用语的读法，并以脚注说明不确定性。
- source_word: מנון
  choice: 一个后裔
  rationale: 该词罕见且词形、确切含义不稳，但上下文指所罗门身后留下的家系继承者。“一个后裔”比“儿子”宽泛，也不强行确定其法律身份为“继承人”。
theological_decisions:
- issue: “从他而出的根”所表达的大卫王朝应许
  choice: 保留“根”的比喻，表达大卫家系继续存留，但不明说为弥赛亚预言
  alternative: 直译为“一个后代”，或明确译作“弥赛亚之根”
  rationale: 本节直接关注大卫家系的延续；“根”可能引发更广泛的弥赛亚联想，但原文并未在此明确说明。保留比喻可让这种神学回响存在，而不替文本下定论。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“余民”“根”“与列祖同眠”保留经文意象与古代死亡惯用语；脚注交代希伯来文本的两处词义或文本困难。
