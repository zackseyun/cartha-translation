  rationale: 修订仅改善中文搭配并澄清末句的自然句法，没有改变希伯来文本的基本意象或因果关系。“使你在卧榻上哀叹”是对“哀叹／呻吟 + 在你的卧榻上”这一压缩表达的自然汉语呈现；希腊文本所反映的“后裔（种子）”及“因愚妄而痛苦”仍完整保留在相应脚注中。
