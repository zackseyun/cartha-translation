  text: You put a blemish on your honor[a], and profaned your bed[b], bringing wrath on your offspring and groaning on your couch.
translation:
  language: zh_hans
  text: 你使自己的尊荣蒙上污点，又玷污了自己的床榻[a]，以致烈怒临到你的后代，使你在卧榻上哀叹[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“又亵渎了你的后裔（或：种子）”，而不是“又玷污了自己的床榻”。
    reason: textual_variant
  - marker: b
    text: 希腊文本末尾作“因你的愚妄而痛苦”，而不是“使你在卧榻上哀叹”。
    reason: textual_variant
lexical_decisions:
- source_word: ותתן מום בכבודך
  choice: 你使自己的尊荣蒙上污点
  rationale: “נתן מום”直译为“加上瑕疵”，在此表示使名誉或尊荣受损；“蒙上污点”自然保留具体意象。“כבוד”兼有荣耀、尊荣之意，此处关乎君王的身份与名声，译作“尊荣”较贴切。
- source_word: ותחלל
  choice: 又亵渎了
  rationale: “חלל”的强化词干表示把本应圣洁之物变为俗污，含有强烈的道德和宗教意味；“亵渎”比一般的“玷污”更能传达这一力度。
- source_word: יצועיך
  choice: 自己的床榻
  rationale: 该词指床或卧榻，并可含性关系的意味；“床榻”既保留原文意象，也不把含义明确化为原文未直接说出的“婚床”。
- source_word: להביא אף על צאצאיך
  choice: 以致烈怒临到你的后代
  rationale: 不定式在此表达所导致的结果；“אף”是强烈的怒气，“צאצאים”指子孙后代，尤其适合此处王朝后果的语境。
- source_word: ואנחה על משכבך
  choice: 哀叹落在你的卧榻上
  rationale: “אנחה”可指叹息、哀叹或呻吟；原文是名词性并列结构，译作“哀叹落在……”保留其后果临到的意象。“משכב”译为“卧榻”，并保留与前一“床榻”的刻意呼应。
theological_decisions:
- issue: 末句与所罗门罪行及其后果的关系
  choice: 按希伯来文本，保留“床榻／卧榻”的呼应，将后半节理解为烈怒临到后代、哀叹临到本人卧榻的后果陈述。
  alternative: 希腊文本末句作“因你的愚妄而痛苦”，可理解为对其愚妄的内心悲痛。
  rationale: 希伯来文本两次使用卧具意象，把行为与后果紧密联系；但希腊平行文本反映不同文本形式，因此不在正文中调和，而以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“床榻／卧榻”略带书面色彩，以保留诗性平行和原文中两个近义卧具词的呼应；正文以高可信度的希伯来文本为主，希腊异文列入脚注。
