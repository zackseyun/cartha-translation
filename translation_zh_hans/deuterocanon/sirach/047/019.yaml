  text: You gave your strength to women[a], and let them rule over your body.
translation:
  language: zh_hans
  text: 你把自己的力量给了女人[a]，让她们支配你的身体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“你的力量”；原词含义较难确定。希腊文平行文本作“你的腰间”，暗指性能力，使性的意味更为明确。
    reason: 说明疑难希伯来词及希腊平行文本所保存的较明确读法。
lexical_decisions:
- source_word: ותתן
  choice: 你把……给了
  rationale: 直译 נתן 的基本义，保留责备语气；“把”字句使现代汉语表达自然有力。
- source_word: לנשים
  choice: 给了女人
  rationale: ל 在此表示给予的对象；“女人”保持原文泛指复数，不额外限定为妻妾。
- source_word: כסלך
  choice: 自己的力量
  rationale: 此词形含义较难确定；结合上下文及希腊文平行文本“腰部”，指向身体、性能力或男性精力。“力量”保留较宽的语义，也避免在正文中过度解明原文。
- source_word: ותמשילם
  choice: 让她们支配
  rationale: משל 的使役形式表示使或容许其掌权；宾语后缀回指“女人”。“让她们支配”既自然，也保留主动交出主导权的责备意味。
- source_word: בגויתך
  choice: 你的身体
  rationale: גויה 在此指身体；介词 ב 与“支配”搭配时按汉语习惯译为直接宾语，不机械译作“在……里面”。
theological_decisions:
- issue: 如何依据希伯来文本并参照希腊平行文本处理 כסלך 的疑难含义
  choice: 正文译作“力量”，脚注说明希腊文作“腰部”，由读者看见其身体和性的含义。
  alternative: 正文译作“腰力”“腰部”或“愚妄”。
  rationale: 现存希伯来文应作为底本，但 כסלך 的确切含义有疑难。希腊文 παρέκλινας τὰς λαγόνας σου 明确提到“腰部”，与本节责备所罗门受女人支配的语境相符。“力量”能涵盖体力、精力和性能力，而不把较明确的希腊表达冒充为毫无疑问的希伯来原义。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“支配你的身体”清楚传达掌权关系；正文不使用过度古雅的“辖制”或过度解剖化的措辞。
