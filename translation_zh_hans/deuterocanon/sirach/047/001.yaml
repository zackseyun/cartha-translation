  text: And after him Nathan arose[a], to stand before David.
translation:
  language: zh_hans
  text: 在他之后，拿单也兴起[a]，站在大卫面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“拿单兴起，在大卫的日子说预言。”希伯来文作：“站在大卫面前。”
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: 也
  rationale: 保留 גם 的附加意味；与“他之后”连用，在现代汉语中自然承接上文。
- source_word: אחריו
  choice: 他之后
  rationale: 明确表示拿单继前述人物之后出现，保留原文的人称指向。
- source_word: עמד
  choice: 兴起
  rationale: 该词本义为“站立”，此处结合人物相继出现的语境，译作“兴起”较自然；也与希腊文 ἀνέστη 相呼应，而不把它仅理解为身体站起。
- source_word: נתן
  choice: 拿单
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: להתיצב
  choice: 侍立
  rationale: 该反身词形表达站到某人面前、在其面前任职或候命；“侍立”简洁保留了宫廷及先知在王前的姿态。
- source_word: לפני דוד
  choice: 在大卫面前
  rationale: 直接依照现存希伯来文，保留空间与关系性的“在……面前”，不以希腊文的时间性表达取代。
theological_decisions:
- issue: 末句中拿单与大卫的关系
  choice: 侍立在大卫面前
  alternative: 在大卫的日子说预言
  rationale: 现存希伯来文明确作“站在大卫面前”，希腊文则作“在大卫的日子说预言”。正文以希伯来文为主，同时用脚注保存希腊平行文本的差异，不消解两种见证之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“兴起”呈现人物承接前人而出现；“侍立”略带正式色彩，适合拿单在王前的身份和场景。
