  text: Because of him there stood up after him an intelligent son[a], who lived in security.
translation:
  language: zh_hans
  text: 因着他，在他之后兴起了一位聪慧的儿子[a]；这儿子安然居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“在他之后，一位聪慧的儿子兴起；因着他，这儿子安居在宽阔安逸之中。”希伯来文见证作“安然居住”。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַעֲבוּרוֹ
  choice: 因着他
  rationale: עֲבוּר与前置词ב共同表达原因或受益关系，可指“因他”或“为了他”。“因着他”保留这位儿子的有利处境与前人之间的联系，同时不进一步说明具体因果。
- source_word: עָמַד אַחֲרָיו
  choice: 在他之后兴起
  rationale: עָמַד本义为“站立”，在继承语境中可指某人起来接续前人；希腊文ἀνέστη也支持“兴起”。中文若直译为“站起来”容易误解，因此采用自然而仍保留原意象的“兴起”。
- source_word: בֵּן מַשְׂכִּיל
  choice: 一位聪慧的儿子
  rationale: מַשְׂכִּיל指有洞察力、悟性或明智的人；“聪慧”在现代中文中自然，也不把该词限缩为纯粹的道德智慧。
- source_word: שׁוֹכֵן לָבֶטַח
  choice: 安然居住
  rationale: שׁוֹכֵן表示居住，לָבֶטַח表示安全、安稳；“安然居住”简洁保留希伯来文的核心含义，不把希腊文的“宽阔”意象纳入正文。
theological_decisions:
- issue: 儿子的兴起及安稳与前人之间的关系
  choice: 译作“因着他”，表明儿子的兴起和安稳处境与前人有关，但不具体界定这是王朝继承、领土扩张还是神学性的报偿。
  alternative: 可按希腊文的句法理解为：儿子在他之后兴起，并因着他安居于宽阔安逸之中。
  rationale: 希伯来文与希腊文都把儿子的有利处境同前人联系起来，但短语的具体附着点及“安稳／宽阔”的表达有所差异；正文依据高置信度希伯来文，脚注保存希腊文异读。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“兴起”适合继承语境；“聪慧”兼顾认知洞察与明智；“安然居住”自然呈现安全、安稳之意。脚注标记[a]已置于正文相应位置。
