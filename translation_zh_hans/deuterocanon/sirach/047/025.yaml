base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/025.yaml
  text: He gave Ephraim a stumbling block[a], to drive them from their land; and his sin grew very great, and he sold himself to every evil.
translation:
  language: zh_hans
  text: 他使以法莲有了绊脚石[a]，要把他们从自己的土地上赶走；他的罪恶越发深重，把自己卖给了各样恶事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“他们的罪大大增多，使他们离开自己的土地；他们寻求各样邪恶，直到报应临到他们。”本处希伯来文见证采用单数，且文字较短。
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן לאפרים מכשול
  choice: 他给以法莲设下绊脚石
  rationale: 按希伯来文直译其“给……绊脚石”的结构，同时用“设下”使现代汉语自然，并保留导致跌倒、败亡的比喻。以法莲保留原有支派及北国称谓，不改释为“以色列”。
- source_word: להדיחם מאדמתם
  choice: 要把他们从自己的土地上赶走
  rationale: להדיחם 表示使人被驱逐、赶离；“赶走”自然地承接“从……土地上”。代词依希伯来文保持复数，指以法莲所代表的群体。
- source_word: ותגדל חטאתו מאד
  choice: 他的罪恶越发深重
  rationale: 遵从现存希伯来文的单数“他的罪”，而不把希腊文复数读法纳入正文；“越发深重”自然表达罪恶大为增长、加重。
- source_word: ולכל רעה התמכר
  choice: 把自己卖给了各样恶事
  rationale: 保留 התמכר 所含“自卖”的强烈比喻，表达主动委身于恶而不引入额外的教义解释；“各样恶事”比“每一个邪恶”更符合现代汉语。
theological_decisions:
- issue: 希伯来文单数与希腊文复数的差异
  choice: 正文依希伯来文译作“他的罪恶越发深重”，并保留简短的希伯来文结句。
  alternative: 希腊文作“他们的罪大大增多……他们寻求各样邪恶，直到报应临到他们”。
  rationale: 现存希伯来文在本处为单数，可能继续指上文的君王；希腊文则将责任扩展为群体，并有较长结尾。鉴于两者存在实质差异，正文以希伯来文为主，脚注如实保留希腊文见证。
- issue: התמכר 的道德主体性
  choice: 译作“把自己卖给了各样恶事”。
  alternative: “任凭自己陷入各样恶事”或“投身于各样恶事”。
  rationale: “把自己卖给”保留原文自我出卖的隐喻及主动性，但不将其扩展为特定的后期教义概念。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“绊脚石”保留原文意象；“罪恶越发深重”避免生硬直译；正文中的[a]与脚注对应。
