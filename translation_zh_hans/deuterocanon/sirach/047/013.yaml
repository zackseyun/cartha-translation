base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/013.yaml
  text: Solomon reigned in days of peace[a], and God gave him rest on every side, so that he might build a house for his name and prepare a sanctuary forever.
translation:
  language: zh_hans
  text: 所罗门在太平的岁月作王[a]，上帝使他四境安宁，好让他为上帝的名建造殿宇，并预备一座永远的圣所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文到“上帝使他四境安宁”为止；希腊文平行本另有后面的目的从句，提到为上帝的名建造殿宇，并预备一座永远的圣所。
    reason: 文本异文：希伯来文见证较短，希腊文平行本保留较长读法。
lexical_decisions:
- source_word: שְׁלֹמֹה
  choice: 所罗门
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מלך
  choice: 作王
  rationale: 按希伯来语动词形式译出执掌王权的行动；“作王”自然、庄重。
- source_word: בימי שלוה
  choice: 在太平的岁月
  rationale: שלוה表示安宁、太平；保留“在……的日子/岁月”这一时间表达，同时使中文流畅。
- source_word: ואל הניח לו מסביב
  choice: 上帝使他四境安宁
  rationale: 传世希伯来文的 ואל 形式略有疑难，希腊文平行本明确以上帝为主语，并表达使他四周得享安息；“四境安宁”简洁地传达 מסביב 与 κυκλόθεν 的空间范围。
- source_word: ἵνα στήσῃ οἶκον ἐπʼ ὀνόματι αὐτοῦ
  choice: 好让他为上帝的名建造殿宇
  rationale: 此目的从句见于希腊文平行本；“殿宇”既保留 οἶκον 的房屋意象，又在所罗门建殿的语境中避免普通住宅的误解。代词“他的”在中文中可能误指所罗门，故明确为“上帝的”。
- source_word: καὶ ἑτοιμάσῃ ἁγίασμα εἰς τὸν αἰῶνα
  choice: 并预备一座永远的圣所
  rationale: “圣所”准确表达 ἁγίασμα；“永远的”保留 εἰς τὸν αἰῶνα，同时不额外界定其神学含义。
theological_decisions:
- issue: 是否纳入仅见于希腊文平行本的建殿目的从句
  choice: 在正文中纳入，并以脚注说明希伯来文存本较短
  alternative: 正文只译现存希伯来文：“所罗门在太平的岁月作王，上帝使他四境安宁。”
  rationale: 现存希伯来文在此较短且文本略有疑难；希腊文平行见证提供了连贯的后半句。纳入正文可呈现较完整的古代文本传统，而脚注则透明保留见证差异，不把较长读法冒充为现存希伯来文原句。
- issue: “他的名”所指为何
  choice: 译作“上帝的名”
  alternative: 译作“他的名”
  rationale: 希腊文 αὐτοῦ 的先行词在语法和圣殿语境中是上帝；中文若直译“他的”容易被理解为所罗门的名，因此明示所指，但不增添额外教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“太平的岁月”“四境安宁”保留古典经文气息，但仍属现代读者容易理解的表达；避免过度古雅。
