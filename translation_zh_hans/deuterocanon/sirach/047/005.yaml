base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/005.yaml
  text: For he called on God Most High[a], and he gave strength to his right hand[b], to drive back a man skilled in war and to raise up the horn of Israel.
translation:
  language: zh_hans
  text: 因为他呼求至高的上帝[a]，上帝就赐力量给他的右手，使他击退善战之人，并高举以色列的角[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“至高的上帝”；希腊文平行文本作“至高的主”。
    reason: alternative_reading
  - marker: b
    text: “角”是圣经中的象征，可表示力量、尊荣或权势。
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל
  choice: 呼求
  rationale: 该短语表示向上帝呼喊、求告以获得帮助；“呼求”在现代汉语中自然地保留了祷告和求援的含义。
- source_word: אל עליון
  choice: 至高的上帝
  rationale: 紧随希伯来文“至高的上帝”；希腊文平行文本作“至高的主”，其差异在脚注中说明，不在正文中加以调和。
- source_word: ויתן בימינו עז
  choice: 上帝就赐力量给他的右手
  rationale: 保留“右手”这一身体意象，同时用“给”表达希伯来文在此处的赋能含义；补出“上帝”以消除现代汉语中代词指向不清的问题。
- source_word: להדוף
  choice: 击退
  rationale: 该动词表示推开、排斥或击退；军事语境中的“击退”准确而不过度限定具体击败方式。
- source_word: איש יודע מלחמות
  choice: 善战之人
  rationale: 原文直译为“懂得战争的人”；“善战之人”简洁地传达富有作战经验、精于战斗之意，并未在正文中直接认定其具体身份。
- source_word: ולהרים את קרן ישראל
  choice: 并高举以色列的角
  rationale: 保留圣经中“角”象征力量、尊荣或权势的诗性意象，不将多重象征意义压缩为单一解释。
theological_decisions:
- issue: 希伯来文与希腊文中的神圣称号略有不同
  choice: 至高的上帝
  alternative: 至高的主
  rationale: 希伯来文是本节的主要原文证据，明确作“至高的上帝”；希腊文平行文本的“至高的主”作为异文见证列入脚注，以保存差异而不在正文中调和。
- issue: 赐力量者的主语
  choice: 明确译为“上帝”
  alternative: 译作代词“他”
  rationale: 希伯来文动词主语承接前句所呼求的上帝。现代汉语若连续使用“他”，容易误解为大卫赐力量给自己的右手，因此明确主语，但不改变原句的神学关系。
- issue: “以色列的角”的象征意义
  choice: 正文保留“角”的意象
  alternative: 译为“以色列的力量”或“以色列的尊荣”
  rationale: “角”可象征力量、尊荣或权势。保留原有意象并以脚注解释，可避免在正文中只选定其中一种含义。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“呼求”“善战之人”自然易懂；保留“右手”和“角”的原文意象，以维持本节的诗性与圣经语汇。
