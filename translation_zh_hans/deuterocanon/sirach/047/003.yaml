  text: He played with young lions as with a kid[b][a], and with bears as with calves of Bashan.
translation:
  language: zh_hans
  text: 他与少壮狮子嬉戏，如同与山羊羔嬉戏；与熊嬉戏，如同与巴珊的幼畜嬉戏。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“巴珊的儿子（或幼小者）”，没有明说是哪一种牲畜；巴珊以肥壮的牲畜闻名。
    reason: 文化与词义说明
  - marker: b
    text: 希腊文本作：“与熊嬉戏，如同与绵羊羔嬉戏。”
    reason: 平行文本的不同读法
lexical_decisions:
- source_word: לכפירים
  choice: 与少壮狮子
  rationale: כפירים指年轻而有力的狮子；前缀ל在此诗句中表达相伴、面对的关系。译作“与少壮狮子”既区别于泛称“狮子”，也符合现代汉语。
- source_word: שחק
  choice: 嬉戏
  rationale: 该动词表示玩耍、戏耍。“嬉戏”保留诗体庄重感，也表现大卫面对猛兽如同面对驯顺幼畜般从容。
- source_word: כגדי
  choice: 如同与山羊羔嬉戏
  rationale: גדי是幼山羊。汉语补出承前省略的“嬉戏”，使比较关系清楚，并避免把它误解成狮子本身像山羊羔。
- source_word: ולדבים
  choice: 与熊嬉戏
  rationale: 延续上一分句的平行结构；汉语补出谓语，使诗句自然清晰。
- source_word: כבני בשן
  choice: 如同与巴珊的幼畜嬉戏
  rationale: 希伯来文直译为“如同巴珊之子／幼小者”，没有明说牲畜种类。巴珊以肥壮牲畜闻名；“幼畜”保留这一牧养意象及原文未限定种类的含混性，不武断指定为牛犊或羊羔。
theological_decisions:
- issue: 希伯来文“巴珊的幼小者”与希腊文“绵羊羔”之间的差异
  choice: 正文以现存希伯来文为主，译作“巴珊的幼畜”
  alternative: 依希腊文译作“绵羊羔”
  rationale: 现存希伯来文是本节的首要文本证据，希腊文则确认整体比喻是把危险猛兽视同温驯幼畜，但对第二个幼畜作了更明确的解释。正文不消除希伯来文的含混性，希腊异文置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的叙事诗体。“嬉戏”重复三次是为清楚呈现希伯来诗句中省略而平行的动作；“少壮狮子”比“幼狮”更能表达כפירים既年轻又具威胁性的形象。脚注标记均在正文出现。
