  text: You covered the earth with your wisdom[a], and you filled the heights with song of praise.
translation:
  language: zh_hans
  text: 你以智慧覆盖大地[a]，又使高天充满赞歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“你的名传到遥远的海岛；你在平安中为人所爱。”希腊文所反映的文本形态与现存希伯来文有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: כסית
  choice: 覆盖
  rationale: כס״ה的常见义是“遮盖、覆盖”；这里保留智慧遍及大地的具体诗歌意象。
- source_word: בחכמתך
  choice: 以智慧
  rationale: 介词ב在此具有工具意味；“以智慧”自然、凝练，同时保留“借着/用”的含义。
- source_word: ותקלס
  choice: 使……充满
  rationale: 此词形及其语境较难确定。结合后面的“高天”和“赞歌”，译作“使……充满”能表达歌声遍布高处的意象，同时不强行采用较晚期的“赞美”动词义。
- source_word: במרום
  choice: 高天
  rationale: מרום可指高处、高天或天上；“高天”既保留诗意的空间形象，也不把所指过度限定为某种宇宙观。
- source_word: שירה
  choice: 赞歌
  rationale: שירה意为“歌、歌唱”；在颂扬所罗门智慧与敬拜的语境中，“赞歌”简洁自然，并传达其颂赞色彩。
theological_decisions:
- issue: 现存希伯来文本与差异显著的希腊平行文本之间的取舍
  choice: 正文依据现存希伯来见证翻译，并在脚注中列出希腊异文。
  alternative: 依据希腊文译作：“你的名传到遥远的海岛；你在平安中为人所爱。”
  rationale: 本节希伯来文本保存完整且可信度高，因此正文以希伯来文为首要依据。希腊文反映了显著不同的文本形态，可能源自不同底本或不同流传阶段，故以脚注如实保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“覆盖大地”保留原文的具体隐喻；“高天充满赞歌”使诗句自然流畅，同时保留希伯来文的诗歌平行结构与空间意象。
