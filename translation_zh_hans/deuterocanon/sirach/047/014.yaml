translation:
  language: zh_hans
  text: 他为上帝的名预备了一座殿宇[a]，并使圣所永远坚立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节所提供的希腊文本作：“你年轻时何等有智慧，你满有聪明，如同江河。”这反映了上下文中的另一行文本。正文依照现存希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: אשר
  choice: 他……
  rationale: 本词引出关系从句，承接上文的所罗门。现代汉语若直译为“那为……的”会显得残缺，因此以“他”自然承接。
- source_word: הכין
  choice: 预备了
  rationale: 该动词意为预备、使就绪；译作“预备了”忠实保留原文措辞，不直接扩展为“建造了”。
- source_word: בית
  choice: 殿宇
  rationale: 原义为“房屋”，此处指献给上帝的殿。“殿宇”既保留“房屋”的形象，也能让现代读者自然理解其圣殿语境。
- source_word: לשמו
  choice: 为他的名
  rationale: 保留希伯来语关于上帝之“名”的圣所用语，不解释性地改写为“为主”或“荣耀他的名”。
- source_word: ויצב
  choice: 并使……坚立
  rationale: 该动词表达使某物站稳、确立之意；“使……坚立”保留其使役意味，并与后面的长久性相呼应。
- source_word: לעד
  choice: 永远
  rationale: 直接表达持续不息的时间概念，保留经文理想化的永久性语言，不因圣殿后来的毁坏而弱化原文。
- source_word: מקדש
  choice: 圣所
  rationale: 指分别为圣的神圣处所；“圣所”准确、庄重，也不额外限定为建筑中的某一具体区域。
- source_word: ὡς ἐσοφίσθης ἐν νεότητί σου, καὶ ἐνεπλήσθης ὡς ποταμὸς συνέσεως
  choice: 正文不采用
  rationale: 所提供的希腊平行文本谈论所罗门年轻时的智慧，与希伯来文本关于殿宇和圣所的句子不同。鉴于现存希伯来文本可信度高，正文从希伯来文，希腊异文则收入脚注。
theological_decisions:
- issue: 圣殿与上帝之“名”的表达
  choice: 保留“为他的名预备了殿宇”
  alternative: 译为“为主建造了圣殿”或“建殿尊荣主”
  rationale: 原文把圣所与上帝的“名”联系起来，而不是说建筑容纳上帝本身。保留这一措辞可传达其重要的圣经神学张力，同时不加入原文没有的称号或解释。
- issue: לעד所表达的永久性
  choice: 译作“永远”
  alternative: 译作“长久”或“世世代代”
  rationale: “永远”保留本节赞颂圣所坚立不移的修辞，不因后来圣殿被毁的历史事实而替文本消解张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿宇”兼顾בית的“房屋”意象和圣殿语境；“使圣所永远坚立”保留ויצב的使役及稳固意味。脚注标记[a]置于相关希伯来句之后。
