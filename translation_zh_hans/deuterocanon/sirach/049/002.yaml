  text: For he had compassion on our backsliding[c][b][a], and removed the abominations of vanity.
translation:
  language: zh_hans
  text: 因为他怜悯我们的背道[a]，除去了虚妄的可憎之物[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本可译作：“因为他使百姓在回转时走上正路”，或“在百姓悔改时，使他们归正。”希伯来语作“我们的背道”，希腊语则反映较正面的“回转”或“悔改”。
    reason: alternative_reading
  - marker: b
    text: “虚妄的可憎之物”很可能指与偶像崇拜有关的可憎之物；希伯来语常用“虚妄”作为对偶像的贬称。
    reason: lexical_alternative
  - marker: c
    text: 希腊语平行文本作“除去了不法的可憎之物”，与希伯来语的“虚妄的可憎之物”不同。
    reason: textual_variant
lexical_decisions:
- source_word: נחל
  choice: 怜悯
  rationale: 此处希伯来语词形和语义较难确定；结合后半句的改革行动，“怜悯”表达他面对百姓背道时所作的恩慈回应，同时避免采纳推测性过强的重构。
- source_word: על משובתינו
  choice: 我们的背道
  rationale: משובה通常指背离、叛离；第一人称复数后缀明确为“我们的”。译作“背道”保留希伯来语的负面含义，不与希腊语平行文本较正面的“回转”强行调和。
- source_word: וישבת
  choice: 除去了
  rationale: 语境指使可憎之物停止或消失。“除去了”符合现代汉语表达，也能自然衔接宾语。
- source_word: תועבות
  choice: 可憎之物
  rationale: 保留该词强烈的宗教和道德否定意味，又不武断限定为物件、礼仪或行为。
- source_word: הבל
  choice: 虚妄
  rationale: הבל本指空虚、虚幻、毫无价值，也常作为偶像的贬称。“虚妄”保留原文意象及反偶像崇拜的含义，但不直接增译为“偶像”。
theological_decisions:
- issue: 是否按希腊语 ἐπιστροφή 将 משובה 正面化为“回转”或“悔改”
  choice: 正文采用希伯来语倾向的“我们的背道”
  alternative: “百姓回转时”或“百姓悔改时”
  rationale: 现存希伯来语见证优先，其词通常带负面含义；希腊语所反映的正面读法作为真实的文本差异在脚注中保留。
- issue: 是否将 הבל 直接解释为“偶像”
  choice: 译作“虚妄”
  alternative: “偶像”或“虚无之物”
  rationale: 上下文很可能涉及除去偶像崇拜，但原词本身使用的是“虚空、虚妄”的贬义意象；正文不应将其所指过度具体化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“怜悯”比“同情”更符合经文语域；“背道”简洁保留宗教性和负面力度；“可憎之物”避免把 תועבות 过早限定为具体物件或行为。脚注标记依相关词组排列，并全部在正文出现。
