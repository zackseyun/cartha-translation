  yaml_path: translation/deuterocanon/sirach/049/011.yaml
  text: How shall we praise Zerubbabel? He was like a signet ring on the right hand[a][b].
translation:
  language: zh_hans
  text: 我们该怎样赞美所罗巴伯呢？他如同右手上的印戒[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赞美”也可译作“颂扬”或“尊崇”。希腊平行文本作“尊崇”，希伯来语则可表达“赞美、颂扬”。
    reason: lexical_alternative
  - marker: b
    text: “印戒”也可译作“印”或“印章”。这一意象可能表示尊荣和珍贵；另见《哈该书》2:23。
    reason: cross_reference
lexical_decisions:
- source_word: מה נהללה
  choice: 我们该怎样赞美……呢
  rationale: 希伯来语疑问词加意愿式表达带有赞叹意味的修辞问句。译作“我们该怎样赞美……呢”自然、庄重，也保留“赞美、颂扬”的语义范围；希腊平行文本 μεγαλύνωμεν 则更接近“尊崇”。
- source_word: זרבבל
  choice: 所罗巴伯
  rationale: 采用现代中文圣经传统中通行的人名译法，便于辨识。
- source_word: כחותם
  choice: 如同……印戒
  rationale: חותם 可指印、印章或印戒；因本句明确说在手上，“印戒”最能具体呈现这一意象，又不在正文中解释其象征意义。
- source_word: על יד ימין
  choice: 右手上的
  rationale: 直译希伯来语所指的右手，并与希腊平行文本 ἐπὶ δεξιᾶς χειρός 相符。“右手上的”是自然清楚的现代汉语表达。
theological_decisions:
- issue: 所罗巴伯被比作右手上的印戒
  choice: 在正文中直接保留印戒比喻
  alternative: 将比喻解释为蒙拣选、尊贵或备受珍视
  rationale: 该意象可能呼应《哈该书》2:23，含有尊荣、珍贵和特殊拣选等意味，但本节本身只陈述比喻。正文不将潜在含义固定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我们该怎样……呢”保留原文修辞性的赞叹；“印戒”兼顾手上佩戴的具体画面与源文未加阐释的象征张力。
