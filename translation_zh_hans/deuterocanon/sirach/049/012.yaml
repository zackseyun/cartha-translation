base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/012.yaml
  text: So also Yehoshua son of Jehozadak[a], who in distress raised up an altar; and they raised up a holy temple, established for everlasting glory.
translation:
  language: zh_hans
  text: 约萨达的儿子约书亚也是这样[a]；他们建起一座圣殿，为永恒的荣耀而奠立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所据希伯来文版本还以方括号保存一句不确定的文字：“他在困境中立起祭坛。”希腊文平行文本没有这句话。
    reason: textual_variant
lexical_decisions:
- source_word: גם יהושע בן יהוצדק
  choice: 约撒达的儿子约书亚也是如此
  rationale: גם承接前文受纪念的人物，译作“也是如此”自然地保留递进关系；人名采用现代中文圣经语境中易辨认的形式。
- source_word: וירימו
  choice: 他们建起
  rationale: 该动词本义为“举起、使升起”，用于殿宇时自然表达建造并使之耸立；保留希伯来文复数主语。
- source_word: היכל קדש
  choice: 圣殿
  rationale: היכל在此指供敬拜的殿宇，קדש赋予其神圣性质；中文“圣殿”简洁而符合语境。
- source_word: ומכונן
  choice: 使它坚立
  rationale: 此词表达被奠定、稳固建立的状态；“坚立”兼顾其稳固与持久之意，并以“使它”连接前面的建殿行动。
- source_word: לכבוד עולם
  choice: 永远彰显荣耀
  rationale: כבוד可指荣耀、尊荣，עולם表示长久不息；此译保留目的或结果的开放性，同时符合中文赞颂语体。
- source_word: אשר במצוק הקימו מזבח
  choice: 置于脚注：他在困境中筑起祭坛
  rationale: 该分句在所据希伯来文版本中以方括号标为不确定，且希腊文平行文本没有对应语句，因此不纳入正文，但以脚注保存异文证据。
theological_decisions:
- issue: 方括号内“在困境中筑起祭坛”是否属于正文
  choice: 不纳入正文，作为文本异文列于脚注
  alternative: 纳入正文，作“他在困境中筑起祭坛”
  rationale: 所据希伯来文版本明确以方括号标示该句的不确定性，希腊文平行文本亦无此句。将其置于脚注既不让不稳定文本控制正文，也不隐藏希伯来传本所保存的读法。
- issue: 复数动词的主语
  choice: 保留为“他们”
  alternative: 按约书亚一人改为“他”
  rationale: 希伯来文וירימו为复数，希腊文也以复数形式提到“在他们的日子”并述及建造；正文不强行将其单数化，以保留原文的语法张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“圣殿”“坚立”“彰显荣耀”保持颂赞语体，又避免生硬直译。正文中的[a]与脚注对应；复数“他们”保留希伯来文及希腊文的源文证据。
