revisions:
- from: 约撒达的儿子约书亚也是如此[a]；他们建起圣殿，使它坚立，永远彰显荣耀。
  to: 约萨达的儿子约书亚也是这样[a]；他们建起一座圣殿，为永恒的荣耀而奠立。
  rationale: 修订仅调整父名译写及后半句的句法。“为永恒的荣耀而奠立”对应圣殿被稳固建立、指向持久荣耀的描述，不添加“彰显”的动态意义。方括号内祭坛句仍保留在脚注，因其文本地位未定且希腊文平行本未载。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:47:13Z'
