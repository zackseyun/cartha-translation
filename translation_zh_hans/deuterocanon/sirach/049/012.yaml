  naturalness: “约撒达的儿子约书亚也是如此”可理解，但“也是如此”在中文中不如“也同样受称颂／也是这样”顺畅；在保持原文简洁的前提下可略作调整。修订后的后半句使“圣殿”为“奠立”的承受者，句法更自然。
