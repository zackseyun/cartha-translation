  text: Nehemiah—may his memory be honored—who raised up our ruins[a], and healed our destruction[b], and set up doors and bars.
translation:
  language: zh_hans
  text: 尼希米——愿人尊崇对他的记念——使我们的废墟重新立起[a]，修复了我们被拆毁之处[b]，又安设了门扇和门闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“为我们重建倒塌的城墙，安设城门和门闩，并重建我们的住处（或：宅地）。”希伯来文本较宽泛地说“我们的废墟”，下句还采用了“医治”的比喻。
    reason: alternative_reading
  - marker: b
    text: “修复”原文直译为“医治”，把遭拆毁之处描写成需要医治的创伤。
    reason: lexical_alternative
lexical_decisions:
- source_word: יאדר זכרו
  choice: 愿他的名声受尊崇
  rationale: 该短语是祝愿性的褒扬语，不只是说尼希米被人记得。“愿……受尊崇”在现代汉语中自然、庄重，并保留其祝颂语气。
- source_word: המקים
  choice: 重建了
  rationale: 这是קום的使役形式，指使倒塌、荒废之物重新立起。中文“重建”在本处比直译“使……起来”自然，同时符合尼希米修复城防的语境。
- source_word: חרבתינו
  choice: 我们的废墟
  rationale: 希伯来文泛指荒废、毁坏之处，并未像希腊文平行文本那样明确限定为倒塌的城墙；“废墟”保留这一较宽泛的意义。
- source_word: וירפא
  choice: 修复了
  rationale: 字面为“医治”。用于受毁坏之处时，中文“修复”既自然地表达实际行动，也保留从破坏中恢复完整的核心意象；脚注说明原文的医治比喻。
- source_word: הריסתינו
  choice: 我们被拆毁之处
  rationale: 该词指遭拆毁、破坏的部分。“被拆毁之处”具体而自然，也与前面的“废墟”有所区分。
- source_word: ויצב
  choice: 安设了
  rationale: 表示把物件立好、置于适当位置。“安设”与门扇、门闩搭配庄重自然。
- source_word: דלתים ובריח
  choice: 门扇和门闩
  rationale: 希伯来文直指门的扇片及用于固定门的横闩；在城门语境中，“门扇和门闩”比笼统的“门和闩”更清楚。
