  yaml_path: translation/deuterocanon/sirach/049/004.yaml
  text: Except for David[a], Hezekiah, and Josiah, all of them acted corruptly; the kings of Judah abandoned the law of the Most High[b], until they came to an end.
translation:
  language: zh_hans
  text: 除了大卫、希西家和约西亚，犹大其余诸王都行事败坏[a]；他们离弃了至高者的律法，直到他们走到尽头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都犯了过错”，较贴近希腊文；希伯来文直译可作“都败坏了”或“都行毁坏之事”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文末语十分简略，直译为“直到终结／尽头”；希腊文作“犹大诸王走到了尽头”或“消亡了”。
    reason: alternative_reading
lexical_decisions:
- source_word: לבד / παρὲξ
  choice: 除了……
  rationale: 希伯来文和希腊文都表示排除例外；“除了”清楚表明大卫、希西家和约西亚不在后面的总体谴责之列。
- source_word: השחיטו / πλημμελίαν ἐπλημμέλησαν
  choice: 行事败坏
  rationale: 希伯来词根 שחת 的使役形可指败坏、毁坏，希腊文则以同源词组表达犯罪或过犯；“行事败坏”保留道德判断的力度，又不限定为某一种罪。
- source_word: ויעזבו / κατέλιπον
  choice: 离弃了
  rationale: 两种文本都表达背离应当遵守之事；“离弃”既自然，也体现有意背弃的意味。
- source_word: תורת עליון / τὸν νόμον τοῦ ὑψίστου
  choice: 至高者的律法
  rationale: תורה 可泛指教导，但希腊文 νόμος 及君王与盟约的语境支持译作“律法”；“至高者”保留神圣称号。
- source_word: מלכי יהודה
  choice: 犹大诸王
  rationale: 简洁、自然地保留其历史所指，与希腊文 οἱ βασιλεῖς Ἰούδα 一致。
- source_word: עד תמם / ἐξέλιπον
  choice: 直到他们走到尽头
  rationale: 希伯来文短语简约，含“直至终结”之意；希腊文可指终止、消逝或失败。“走到尽头”保留终局含义，而不把它狭义限定为死亡或王朝灭绝。
theological_decisions:
- issue: 如何结合希腊文 ἐξέλιπον 理解末句 עד תמם
  choice: 将其译为犹大诸王离弃律法后所达到的终局：“直到他们走到尽头”。
  alternative: 另立一句译为“犹大诸王消亡了／失败了”，或更直译为“直到他们完结”。
  rationale: 希伯来文措辞简短且略显突兀，希腊文提供的是解释性对应。正文保留“尽头”的开放含义，既呈现警戒语气，也不武断断定其具体指死亡、国祚断绝还是失败。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行事败坏”适合对诸王作概括性的道德评断；“走到尽头”有意保留原文末句的简约与多义，不将其具体化为单一历史或神学解释。
