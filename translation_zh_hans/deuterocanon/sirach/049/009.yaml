  text: He also mentioned Job[a], who upheld all the ways of righteousness.
translation:
  language: zh_hans
  text: 他也提到约伯[a]；约伯持守一切正义之道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“并善待那些修直道路的人。”现存希伯来文本则作：“约伯持守一切正义之道。”
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: 他也
  rationale: 保留附加语气，并自然承接前文所列举的人物。
- source_word: הזכיר
  choice: 提到
  rationale: 直译为“提到、说起”；虽也可理解为“记念”，但现存希伯来文本首先支持直接的陈述义。
- source_word: את איוב
  choice: 约伯
  rationale: 采用现代中文《圣经》中通行的人名译法。
- source_word: ומכלכל
  choice: 持守
  rationale: כלכל可表示维持、支撑或引导；与“正义之道”搭配时，“持守”自然表达坚持并维护正直生活道路的意思，同时不过度限定其具体含义。
- source_word: כל דרכי צדק
  choice: 一切正义之道
  rationale: 保留“道路”的希伯来意象；צדק兼有正义、公正与正直之意，此处用“正义”既庄重，也能涵盖道德行为的语境。
theological_decisions:
- issue: 希伯来文本末句与希腊平行文本存在显著差异
  choice: 正文以现存希伯来文本为准，译作“约伯持守一切正义之道”
  alternative: “并善待那些修直道路的人”（依希腊平行文本）
  rationale: 《便西拉智训》有可靠希伯来文本存世之处，应以希伯来文本为主要依据；希腊文本代表有意义的异文传统，故在脚注中保留，而不取代正文。
- issue: ומכלכל的主语及其与约伯的关系
  choice: 在中文中重述“约伯”，明确由约伯持守正义之道
  alternative: “他也提到约伯，并持守一切正义之道”
  rationale: 希伯来语连续结构在语境中自然承接“约伯”；中文若只用“他”，可能误指前句的提及者。重述人名可避免不必要的歧义，但不增添教义性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“持守”具有经文语体的尊严感，但在现代中文中仍清楚自然；分号用来表明后半句继续说明约伯，并避免代词指向不明。
