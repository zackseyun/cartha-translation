  text: Few have been created on earth like Enoch, and he too was taken from the earth.
translation:
  language: zh_hans
  text: 地上受造而像以诺的人少有[b]；他也从地上[a]被接走了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文可译作：“地上受造而像以诺的人少有；他也被接走……”末尾的希伯来语词在这里难以解释；希腊文平行文本作“从地上”，正文据此翻译。
    reason: textual_variant
  - marker: b
    text: 希腊文语气更强，作：“在地上受造的，没有一个像以诺。”希伯来文则作“少有”，并非绝对的“没有一个”。
    reason: alternative_reading
  - marker: c
    text: 或译：“被接上去。”这里的措辞使人想起以诺被上帝取去的记载（参创世记5:24）。
    reason: lexical_alternative
lexical_decisions:
- source_word: מעט
  choice: 少有
  rationale: 希伯来语意为“少、很少”，并非绝对的“没有一个”；“少有”既自然，也忠实保留希伯来文本与希腊文本之间的差异。
- source_word: נוצרו
  choice: 受造的人
  rationale: 该被动形式表达“被塑造、被创造”；结合语境，补出“人”可使现代汉语通顺，同时保留神圣被动的含义。
- source_word: כחנוך
  choice: 像以诺的
  rationale: 前缀כ表示比较，“像以诺的”是自然、准确的现代汉语表达。
- source_word: וגם הוא
  choice: 他也
  rationale: 保留原文的附加强调，不把语气强化为“连他也”。
- source_word: נלקח
  choice: 被接走了
  rationale: לקח在这里暗指以诺被上帝取去；“被接走”保留圣经式的含蓄，没有在正文中明确加入“升天”等原文未直说的解释。
- source_word: פנים
  choice: 从地上
  rationale: 现存希伯来语末词在此难解，可能涉及文本讹误；希腊平行文本明确作“从地上”，正文据此采用该读法，并以脚注说明。
theological_decisions:
- issue: 如何表达以诺被取去
  choice: 从地上被接走了
  alternative: 被接上去了；被接到上帝面前
  rationale: 此句呼应以诺非同寻常地被上帝取去的传统。正文采用希腊文本所支持的克制表达，不进一步断定过程或目的地，从而保留原文的含蓄和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在地上受造的人中”明确比较范围；“少有”保留希伯来语的非绝对表述；“被接走”延续圣经语体的含蓄，不擅自补入具体教义解释。
