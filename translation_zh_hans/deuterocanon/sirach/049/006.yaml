revisions:
- from: 他们焚烧圣城，使城中的道路荒凉；这事借耶利米的手而来[a]。因为他们苦待他，而他从母腹中就被塑造成先知[b]。
  to: 他们焚烧圣城，使它的道路荒凉——借耶利米的手[a]；因为他们苦待他，尽管他从母腹中就被塑造成先知[b]。
  rationale: 修订只处理“借耶利米的手”在汉语中的不自然重组，并将城市所属关系译得更简洁。破折号和脚注保留原文与希腊文平行所见的压缩性及歧义；“尽管”对应上下文中苦待先知与其受造为先知之间的逆向关系，不指定“他们”的身份，也不把该短语解释为耶利米直接施行毁灭。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:47:36Z'
