base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/006.yaml
  text: They set the holy city on fire[a], and made its streets desolate, by the hand of Yirmeyahu; for they afflicted him[c][b], though he had been formed in the womb as a prophet.
translation:
  language: zh_hans
  text: 他们焚烧圣城，使它的道路荒凉——借耶利米的手[a]；因为他们苦待他，尽管他从母腹中就被塑造成先知[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借耶利米的手”直译原文，也可理解为“借着耶利米”，即这些事与他的先知职事或警告有关；原句结构十分紧凑，未明确说明他在这些事中的具体关系。
    reason: 保留压缩句法及可能的不同理解，避免暗示耶利米亲手毁城。
  - marker: b
    text: 参耶利米书1:5；本句呼应耶利米从母腹中就被指定为先知。
    reason: 说明明显的经文互文背景，而不以互文取代本节措辞。
lexical_decisions:
- source_word: ויציתו
  choice: 他们焚烧
  rationale: 该动词表示点燃、使燃烧；以“焚烧”描述城市，简洁自然，也保留毁灭性的动作。
- source_word: קרית קדש
  choice: 圣城
  rationale: 希伯来语为“圣洁之城”的组合形式；“圣城”准确、自然。希腊语平行文本略有差异，但此处以希伯来语见证为主。
- source_word: וישמו
  choice: 使……荒凉
  rationale: 该形式表达使某处荒废、遭到毁坏；“使……荒凉”保留了结果状态。
- source_word: ארחתיה
  choice: 城中的道路
  rationale: 原词可指路径、道路或行路之处；在城市语境中指其中的道路。“城中的”自然表达希伯来语的所属后缀，同时不把词义过窄地限定为现代街道。
- source_word: ביד ירמיהו
  choice: 借耶利米的手
  rationale: 直译保留希伯来语“借着某人的手”这一惯用表达及其压缩、含混的句法；它可能表示事件与耶利米的预言职事或警告有关，而非说他亲手毁城。
- source_word: כי ענוהו
  choice: 因为他们苦待他
  rationale: 动词在此表示使人受苦、压迫或屈辱；“苦待”自然地传达不公正的恶劣对待，又不额外限定具体方式。
- source_word: מרחם נוצר נביא
  choice: 他从母腹中就被塑造成先知
  rationale: “塑造”对应 נוצר，并保留被动形式；“从母腹中”反映其先知身份自母腹即已确定，也呼应耶利米书1:5。
- source_word: ירמיהו
  choice: 耶利米
  rationale: 采用现代汉语圣经传统中通行且易于识别的人名译法。
theological_decisions:
- issue: “ביד ירמיהו”与焚城、道路荒凉之间的关系
  choice: 正文保留“借耶利米的手”这一源语意象，并以脚注说明其可能指事件与他的先知职事或警告有关。
  alternative: 译为“正如耶利米所预言的”或“因耶利米的缘故”。
  rationale: 希伯来语句法高度压缩，希腊语平行文本也保留“借着／在耶利米手中”的说法。若直接译成“正如他所预言的”，虽较顺畅，却会消除原文真实存在的歧义。
- issue: 复数主语“他们”在焚城与苦待耶利米两件事中的所指
  choice: 两处均保留未明说所指的“他们”。
  alternative: 分别明确为毁城者与苦待耶利米的百姓。
  rationale: 原文没有明示两处复数动词的主语是否完全相同；正文不补入特定群体，以免替原文解决指代上的张力。
- issue: 耶利米从母腹即为先知的表述
  choice: 译为“从母腹中就被塑造成先知”。
  alternative: 译为“在母腹中就蒙召作先知”。
  rationale: “蒙召”符合耶利米书1:5的关联，却没有直接对应此处的 נוצר（被塑造）；保留“塑造”可避免把文本进一步系统化。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“焚烧圣城”“使城中的道路荒凉”保持诗性与并行感；“借耶利米的手”有意保留源语意象和歧义，并由脚注辅助普通读者理解。所有脚注标记均已在正文出现。
