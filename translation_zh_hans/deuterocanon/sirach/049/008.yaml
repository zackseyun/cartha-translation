  text: Ezekiel saw a vision[a], and described the kinds of the chariot.
translation:
  language: zh_hans
  text: 以西结看见了异象[a]，并讲述了战车的各种样式。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“以西结看见了荣耀的异象；这异象是在基路伯的战车上向他显示的。”希伯来文较简短，其中“战车的各种样式”可能是压缩的说法，文本也可能存在不确定之处。
    reason: alternative_reading
lexical_decisions:
- source_word: וחזקאל
  choice: 以西结
  rationale: 先知名采用现代简体中文通行译名；句首的连接词 ו 在单节呈现中不生硬译作“而”。
- source_word: ראה
  choice: 看见了
  rationale: 按常用动词“看见”直译，以完成体语气表达过去发生的动作。
- source_word: מראה
  choice: 异象
  rationale: 在先知语境中指超自然的视觉启示；希腊文 ὅρασιν 也支持这一理解。
- source_word: ויגד
  choice: 并述说了
  rationale: נגד 的使役形有讲述、宣告之意；此处宾语涉及战车的形态，用“述说”既自然又不过度解释为详尽描绘。
- source_word: זני
  choice: 种种形态
  rationale: 原文通常可指种类、类别；在战车异象的语境中，“种种形态”比生硬的“种类”更自然，同时保留其复数和传本文字的不寻常之处。
- source_word: מרכבה
  choice: 战车
  rationale: 按该词的基本意义翻译。这里使人联想到以西结所见的神圣战车，但希伯来文没有明说“基路伯”，故不在正文中增补。
theological_decisions:
- issue: 是否依照希腊文补出“荣耀”和“基路伯的战车”
  choice: 正文以现存希伯来文的简短表述为准，仅以希腊文帮助确认“异象”的含义。
  alternative: “以西结看见了荣耀的异象，就是在基路伯的战车上向他显现的异象。”
  rationale: 现存希伯来文虽在 זני 一处显得压缩或可能存在传抄问题，但仍是首要文本证据。将希腊文较完整的神圣荣耀意象放入脚注，可避免在正文中消除真实的文本差异。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“述说了战车的种种形态”略带不寻常感，以忠实保留希伯来文本身的压缩和歧义；脚注交代希腊文的较长异文。
