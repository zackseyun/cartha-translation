translation:
  language: zh_hans
  text: 为要拔起、拆毁、毁灭、推倒；同样也为要建造、栽种，并使之高升[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在末尾比希腊文平行文本多出一个积极意义的动词，可能意为“使之高升”“置于高处”或“使之稳固”。希腊文平行文本较短，只到“建造、栽种”为止。
    reason: textual_variant
  - marker: b
    text: 本句有意呼应《耶利米书》1:10中交付先知的使命，不过《便西拉智训》的希伯来文措辞与该处并不完全相同。
    reason: cross_reference
lexical_decisions:
- source_word: לנתוש
  choice: 拔除
  rationale: נתש表示连根拔起；“拔除”自然简洁，也保留了与《耶利米书》先知使命用语的呼应。
- source_word: לנתוץ
  choice: 拆毁
  rationale: נתץ常指拆下或毁坏建筑物；“拆毁”保留具体而强烈的破坏意象。
- source_word: ולהאביד
  choice: 灭绝
  rationale: 使役形态表达使之灭亡、彻底毁灭；“灭绝”与本句连续的审判动词相称。
- source_word: להרוס
  choice: 推倒
  rationale: הרס表示拆毁、破坏；“推倒”与“拆毁”有所区分，同时保留原文语义上的重叠。
- source_word: וכן
  choice: 也同样
  rationale: וכן引出与前半句相平衡的积极行动；“也同样”清楚呈现这种对应关系。
- source_word: לבנות
  choice: 建造
  rationale: 忠实表达בנה的一般含义，不添加原文未明确表达的“重建”。
- source_word: לנטע
  choice: 栽种
  rationale: נטע的标准对应词，且与“建造”共同保留先知使命语句的固定搭配。
- source_word: ולהשגיב
  choice: 使之高升
  rationale: שגב的使役形式可指使升高、置于高处或使稳固安全。“使之高升”保留其升举与保护之间的语义开放性；“之”不明确限定受事对象，以免补入原文未说明的内容。
theological_decisions:
- issue: 与《耶利米书》先知使命的互文呼应
  choice: 保留一连串目的性动词及先毁坏、后建立的平衡结构，同时依照《便西拉智训》现存希伯来文本措辞翻译。
  alternative: 按照《耶利米书》1:10的常见译法调整本句，或采用较短的希腊文本结尾。
  rationale: 希伯来文显然呼应《耶利米书》1:10，但具体词序和末尾动词并不完全相同；译文应让读者听出呼应，却不把两处经文强行统一。
- issue: 末尾ולהשגיב与希腊平行文本较短的差异
  choice: 在正文保留希伯来文末尾动词，译作“使之高升”，并以脚注说明希腊文本及可能的其他词义。
  alternative: 依希腊平行文本止于“栽种”，或较具体地译为“使之稳固”或“使之尊高”。
  rationale: 现存希伯来文在此证据充分，应优先进入正文；但该词语义较宽，且希腊文本没有对应成分，因此以较开放的译法和文本脚注保存不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“为要”统领连续的不定式，保存使命宣告的节奏；前后两组动词保持平行。“使之高升”有意不具体说明受事者，以保存希伯来原文的省略与语义张力。
