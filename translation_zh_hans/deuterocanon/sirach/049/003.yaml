  text: He directed his heart to God[b][a], and in days of violence he showed loyalty.
translation:
  language: zh_hans
  text: 他使自己的心归向神[a]；在强暴的日子，他践行忠诚之爱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语作“归向主”；希伯来语作“归向神”。
    reason: alternative_reading
  - marker: b
    text: 或译“施行慈爱”。希腊语较明确地作“坚定持守敬虔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתם
  choice: 使……归向
  rationale: 该希伯来语形式略有不确定，但希腊语平行文本 κατεύθυνεν 支持“引导、使转向或使端正”的意思；“使自己的心归向”在现代汉语中自然，也与宾语“心”相配。
- source_word: אל אל
  choice: 归向神
  rationale: 希伯来语作“向神”，故正文优先采用这一见证；希腊语作“归向主”，列入脚注保存异文。
- source_word: לבו
  choice: 自己的心
  rationale: 保留圣经人论中“心”的整体含义，不缩窄为“思想”或“理智”。
- source_word: ובימי חמס
  choice: 在强暴横行的日子
  rationale: חמס 指强暴、暴行或严重不义；此译保留希伯来语的社会与道德力度，同时符合现代汉语表达。
- source_word: עשה חסד
  choice: 践行忠诚之爱
  rationale: חסד 可指慈爱、恩慈或忠诚之爱；“践行忠诚之爱”既保留实际行动，也呈现忠贞维度，而不把含义完全限定为待人行善或宗教敬虔。
theological_decisions:
- issue: 末句应理解为待人的慈爱，还是向神的敬虔忠诚
  choice: 践行忠诚之爱
  alternative: 施行慈爱；坚固敬虔
  rationale: 希伯来语 עשה חסד 本身可涵盖慈爱与忠诚，希腊语则明确解释为“坚固敬虔”。正文采用较宽的“忠诚之爱”，避免完全倒向其中一种解释，并在脚注中保存希腊语见证。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“强暴横行”使时间背景清楚有力；“忠诚之爱”保留 חסד 的慈爱与忠贞双重色彩，并以脚注呈现希腊语对敬虔层面的解释。
