  text: And they gave their horn backward[b][a], and their glory to a foolish foreign nation.
translation:
  language: zh_hans
  text: 他使他们的角向后退[a][b]，又把他们的荣耀交给愚昧的外邦民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”在这里是力量、威势或权柄的比喻。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本直译作“他使他们的角向后退”。希腊文本则作“他们把自己的角交给别人，并把自己的荣耀交给外邦”；两者在主语及“向后／给别人”的表达上不同。
    reason: textual_variant
lexical_decisions:
- source_word: קרנם
  choice: 他们的角
  rationale: קֶרֶן本义为“角”，在圣经语境中常比喻力量、威势或权柄；希腊文κέρας也保留这一意象。正文保留“角”，不直接释为“力量”。
- source_word: לאחור
  choice: 退后
  rationale: 现存希伯来文本直译为“向后”；在“使……向后”的结构中译作“使……退后”较符合现代汉语。希腊平行文本读作“给别人”，这一重要异文在脚注中说明。
- source_word: כבודם
  choice: 他们的荣耀
  rationale: כָּבוֹד可指荣耀、尊荣或光彩；“荣耀”既贴合希伯来文，也与希腊文δόξα相应。
- source_word: גוי
  choice: 异族
  rationale: גּוֹי指民族或邦国；与נכרי连用时，“异族”自然表达一个外来的民族群体，避免现代“外国”偏重国家政体的含义。
- source_word: נבל
  choice: 愚昧
  rationale: נָבָל表示带有道德贬义的愚顽或无知；“愚昧”通顺易懂，又不额外限定为某种神学身份。
- source_word: נכרי
  choice: 异族
  rationale: נָכְרִי意为外来的、异邦的；与גוי合译为“异族”，简洁呈现“外来的民族”之意。
- source_word: ויתן
  choice: 他使……；把……交给
  rationale: 希伯来文是第三人称阳性单数“他给出／使”，故保留未明说所指的“他”；后半句按同一动词的延续关系自然译为“把……交给”。
theological_decisions:
- issue: “角”的比喻意义
  choice: 正文保留“角”，脚注说明可理解为力量或威势。
  alternative: 直接译为“力量”或“权势”。
  rationale: 原文和希腊平行文本都保留角的传统象征；译文不应把诗性和神学意象完全解释掉。
- issue: לאחור的文本歧异
  choice: 正文依现存希伯来文译为“退后”，脚注列出希腊文所支持的“给别人”。
  alternative: 正文按希腊文译为“把他们的角交给别人”。
  rationale: 任务要求首先依据原文证据；希伯来文在此虽显得不寻常，却可理解。与此同时，希腊文很可能反映另一底本，因此用脚注保留该重要异读，不武断消除歧义。
- issue: 动词主语的数
  choice: 依希伯来文保留单数“他”，不指明其身份。
  alternative: 依希腊文译为复数“他们”。
  rationale: 希伯来文ויתן为第三人称阳性单数，而希腊文ἔδωκαν为复数。正文优先采用希伯来见证，同时在异文脚注中完整交代希腊读法，以免把“他”擅自解释为上帝或其他特定主体。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“使……退后”尽量自然地保留希伯来文较不寻常的表达；“愚昧的异族”保持原文的评价色彩而不过度神学化。
