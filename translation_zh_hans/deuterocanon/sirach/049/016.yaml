translation:
  language: zh_hans
  text: 闪、塞特和以挪士都受到记念；他们的荣耀[a]超越一切生灵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本此处作“他们的荣耀”，其中“他们的”一词因未加元音而可有不同理解。古希腊文则读作：“闪和塞特在人类中受尊崇；在一切受造物之上的是亚当。”
    reason: 说明希伯来文末句的语义不确定性，并准确交代希腊文在人物名单、首句语境及末句主体上的重要异文。
lexical_decisions:
- source_word: נפקדו
  choice: 被人铭记
  rationale: 该词是פקד的被动式，可表示“被记念、被提及”。在列举古代先祖并颂扬其声名的语境中，“被人铭记”既贴近希伯来文，也比单纯译作“受尊荣”更保留原词意象。
- source_word: תפארת
  choice: 荣耀
  rationale: 常指荣美、尊荣或值得夸耀之处；此处采用庄重且通行的“荣耀”。
- source_word: עמם
  choice: 他们民族的
  rationale: 按所给希伯来文本的辅音形式理解为“他们的人民／民族”，并以属格连接“荣耀”。由于古希腊文平行本在此读作“亚当”，以脚注保留重要异文。
- source_word: כל חי
  choice: 一切生灵
  rationale: 直译为“一切活物”；“一切生灵”在现代汉语中自然、庄重，并涵盖各类有生命之物。
theological_decisions:
- issue: 末句主体的文本差异
  choice: 正文依高可信度的希伯来文本译为“他们民族的荣耀”
  alternative: 依古希腊文平行本译为“亚当的荣耀”，或“亚当超越一切受造的生灵”
  rationale: 任务要求优先依据原语言希伯来文本；所给希伯来文为עמם，而非“亚当”אדם。为避免无声地改从希腊文，正文保留希伯来读法，同时在脚注交代希腊异文及其意义。
- issue: 是否保留以挪士
  choice: 保留“以挪士”
  alternative: 像所给英文咨询文本那样只列闪和塞特
  rationale: 希伯来文本明确有ואנוש“和以挪士”；因此不应因英文咨询层或希腊平行本的差异而删去。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“被人铭记”保留希伯来文的记念意象；分号呈现原句并列而递进的颂赞结构。
