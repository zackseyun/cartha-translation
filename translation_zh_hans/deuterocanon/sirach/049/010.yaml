base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/010.yaml
  text: And as for the twelve prophets[a], may their bones flourish from where they lie[c][b]; for they healed Jacob and delivered them by faithful hope.
translation:
  language: zh_hans
  text: 至于十二位先知[a]：愿他们的骸骨从其下萌发[b]！他们医治了雅各，又在信实的盼望中将他高举[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十二位先知”指合为一组流传的十二先知；原文没有“小先知”这一后世称呼。
    reason: historical_context
  - marker: b
    text: 希伯来文此处语意困难，直译近于“从他们下面萌发”；希腊文作“从他们的地方繁茂”。
    reason: textual_variant
  - marker: c
    text: 希腊文后半节作：“安慰了雅各，并在盼望的信心中救赎了他们。”希伯来文则作“医治了雅各，又在信实的盼望中将他高举”。
    reason: textual_variant
lexical_decisions:
- source_word: שנים עשר הנביאים
  choice: 十二位先知
  rationale: 希伯来文和希腊文都直译为“十二位先知”，指十二先知的整体传统；不加入原文没有的后世称呼“小先知”。
- source_word: עצמתם
  choice: 他们的骸骨
  rationale: 保留具体的“骨头、骸骨”意象，不泛化为“遗体”或“遗泽”。
- source_word: פרחת
  choice: 重新萌发
  rationale: 该词呈现发芽、开花或繁茂的生命意象；“重新萌发”既适合骸骨所在的墓葬语境，也保留祝愿其身后荣誉再度兴盛的诗性。
- source_word: מתחתם
  choice: 从安息之地
  rationale: 希伯来文直译近于“从他们下面”，语意困难；希腊文作“从他们的地方”。结合骸骨的语境，以“安息之地”表达可能的墓所含义，同时用脚注保留文本的困难。
- source_word: החלימו
  choice: 医治了
  rationale: 优先依据现存希伯来文，采用“使痊愈、医治”的通常含义；希腊文“安慰、鼓励”列入脚注。
- source_word: יעקב
  choice: 雅各
  rationale: 保留原文专名；此处虽可集合性地指以色列民，却不直接改译为“以色列”。
- source_word: וישגבהו
  choice: 将他高举
  rationale: 按希伯来文动词 שגב 的使役意义及阳性单数宾语后缀翻译，宾语承接“雅各”；不在正文中改从希腊文的“救赎他们”。
- source_word: באמונת תקוה
  choice: 以忠信的盼望
  rationale: 保留“忠信／信实”与“盼望”的紧密关系，不把压缩的结构扩写成两个并列概念，也不限定为某一套系统神学术语。
theological_decisions:
- issue: 希伯来文与希腊文在后半节存在重大差异
  choice: 正文优先采用现存希伯来文：“医治了雅各……将他高举”。
  alternative: 希腊文可译为：“安慰了雅各，并在盼望的信心中救赎了他们。”
  rationale: 希伯来文在本节确有存文，故正文以其为首要依据；希腊文的重要差异不应被混合成一个看似确定的读法，因此完整保留在脚注中。
- issue: “雅各”的单数形式与群体指涉
  choice: 正文以单数“他”承接“雅各”。
  alternative: 按希腊文及“雅各”代表以色列民的集合意义，可用复数“他们”。
  rationale: 希伯来文的宾语后缀为阳性单数，正文应保留其语法形式；群体性理解仍可由专名“雅各”自然承载。
- issue: 骸骨“萌发”的表达
  choice: 保留复苏、繁茂的诗性意象，不解释为身体复活或仅仅是名声流传。
  alternative: 可解释为死后复活、后世尊荣或纪念长存。
  rationale: 原文意象具有开放性；译文不应替文本决定其确切神学指向。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“骸骨”“萌发”“高举”保留原诗句鲜明的具体意象；正文以希伯来文为主，凡希伯来文难解或与希腊文显著分歧之处均以脚注说明，不将不同见证无痕拼合。
