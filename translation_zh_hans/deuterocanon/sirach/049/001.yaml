base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/001.yaml
  text: The name of Josiah is like blended incense[a], the work of a perfumer; his memory is sweet as honey to the mouth[b], and like music at a banquet of wine.
translation:
  language: zh_hans
  text: 约西亚的名如同调和的香[a]，是调香师的作品；人们对他的怀念，甜如口中的蜜，又如酒宴上的乐声[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“约西亚的记念如同配制的香，是调香师所制；在人人口中都甘甜如蜜，又如酒宴上的音乐。”希伯来文在开头突出他的“名”，希腊文则突出对他的“记念”。
    reason: alternative_reading
  - marker: b
    text: “乐声”也可译作“歌声”。希伯来文的这个词可指歌曲，希腊文平行文本则用含义较广的“音乐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שם
  choice: 约西亚的名
  rationale: 希伯来文明确用“名”，既指名字，也可承载名声与后世记念；正文保留其字面表达，后半句再自然呈现“怀念”的含义。
- source_word: כקטורת סמים
  choice: 如同调和的香料
  rationale: קטורת指焚烧的香，סמים指芳香香料；结合下文调香师的制作及希腊文“香的调和物”，译为“调和的香料”，凸显配制而成的馨香。
- source_word: וממלה מעשה רוקח
  choice: 是调香师的手艺
  rationale: 希伯来文形式较难，但上下文与希腊文均指经专业调制而成；“调香师的手艺”自然保留制作工艺的意象。
- source_word: בחך כדבש ימתיק זכרו
  choice: 人怀念他，口中甘甜如蜜
  rationale: חך本指上腭、口腔；זכרו指对他的记念。这样既保留味觉意象，也以自然汉语表达记念约西亚给人的甘美感。未将未完成式机械处理为将来时，因为这里可作格言式、描述性陈述。
- source_word: וכמזמור
  choice: 又如……乐声
  rationale: מזמור可指歌曲或带伴奏的歌；希腊文用范围较广的“音乐”。酒宴语境重在悦耳的音乐，故正文译“乐声”，脚注保留“歌声”的可能。
- source_word: על משתה היין
  choice: 酒宴上的
  rationale: משתה היין指饮酒的宴席；“酒宴上的”简洁自然，并准确呈现宴饮场景。
