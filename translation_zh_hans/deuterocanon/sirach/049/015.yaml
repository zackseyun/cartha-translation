  text: Like Joseph[a], a man was born[b]; and even his body was cared for.
translation:
  language: zh_hans
  text: 没有人生来像约瑟；连他的遗体也受到照料[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“但约瑟成了男子，是他众兄弟的领袖、百姓的支柱；他的骸骨也受到照料。”现存希伯来文本在这里较短。这里“没有人生来像约瑟”的否定承接上一节的表述。其遗体“受到照料”可能指约瑟的遗骸后来受到尊重，被带出埃及并安葬；参《出埃及记》13:19；《约书亚记》24:32。
    reason: alternative_reading; cross_reference
lexical_decisions:
- source_word: כיוסף
  choice: 像约瑟一样
  rationale: 前缀 כ 表示比较，译作“像……一样”。希伯来文本句法简略；此译保留比较关系，不把希腊文本的扩展内容移入正文。
- source_word: אם נולד גבר
  choice: 有一个大丈夫诞生了
  rationale: נולד גבר 直译为“一个男子诞生了”。אם 在此句中的功能不够明确，可能属于强调或感叹性表达；据上下文采用自然的陈述句。“大丈夫”传达 גבר 所含成年男子、刚强之人的褒义色彩，同时不强化为“勇士”。
- source_word: גבר
  choice: 大丈夫
  rationale: גבר 可指男子，也可带有刚强、杰出的意味。此处处于赞颂语境，“大丈夫”比单纯“男人”更庄重自然，又不至于译成具体的军事称号。
- source_word: גויתו
  choice: 他的遗体
  rationale: גויה 常指身体，尤其是死者的身体。上下文涉及约瑟死后骸骨受到安置，译为“遗体”既符合希伯来词义，也保留其比希腊文“骸骨”较宽泛的表达。
- source_word: נפקדה
  choice: 得到照料
  rationale: פקד 的被动式可表示受到眷顾、关注或处置。此处指约瑟死后的遗体后来被带走并安葬；“得到照料”保持原词的宽度，不把具体行动直接写入正文。
theological_decisions:
- issue: 采用较短的希伯来文本还是较完整的希腊平行文本
  choice: 正文依照现存希伯来文本，希腊文的扩展读法收入脚注。
  alternative: 正文按希腊文译为：“但约瑟成了大丈夫，是众兄弟的领袖、百姓的支柱；他的骸骨也得到照料。”
  rationale: 《便西拉智训》有可靠希伯来见证之处以希伯来文为正文依据。希腊文在此较长，可帮助理解，却不宜在没有希伯来对应文字时直接补入正文。
- issue: 约瑟遗体“得到照料”的具体所指
  choice: 正文保留概括表达，脚注说明可能指其骸骨后来被迁运并安葬。
  alternative: 在正文中明确译为“他的遗骸后来也得以安葬”。
  rationale: פקד 本身没有明确说出迁运或安葬。相关传统可由《出埃及记》13:19和《约书亚记》24:32阐明，但不应以互文取代原句的含混性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大丈夫”保留赞颂语气；“遗体”自然表达死者身体。“得到照料”刻意维持希伯来动词的概括性。所有脚注标记均已置于正文。
