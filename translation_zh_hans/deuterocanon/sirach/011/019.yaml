  text: Folly and darkness are reserved for transgressors[a], and evildoers have evil with them.
translation:
  language: zh_hans
  text: 愚昧和黑暗为悖逆者存留[a]；作恶的人有恶相伴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“他说：‘我已经得享安逸，现在可以享用我的财物了。’他却不知道时日何时流逝；他必把这些留给别人，然后死去。”本节的希伯来见证与希腊传统差异显著。
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂכְלוּת
  choice: 愚昧
  rationale: 指缺乏明智、愚妄的状态或行为；“愚昧”符合现代汉语智慧文学的庄重语域，也保留道德意味。
- source_word: וְחֹשֶׁךְ
  choice: 和黑暗
  rationale: 保留希伯来文的基本意象，不把其道德或灾祸含义解释得过实。
- source_word: לְפוֹשְׁעִים
  choice: 为悖逆者
  rationale: פשע含越界、反叛之意；“悖逆者”比宽泛的“罪人”更能表达有意反抗的意味。
- source_word: נוֹצְרָה
  choice: 存留
  rationale: 此处被动形式表达为某人保留、储存；“存留”自然简洁，并暗示将临到的后果。
- source_word: וּמְרֵעִים
  choice: 作恶的人
  rationale: 保留分词所表达的行为性，比名词化的“恶人”更直接透明。
- source_word: רָעָה
  choice: 恶
  rationale: 该词既可指道德上的恶，也可指祸患、灾难；“恶”既与“作恶”形成希伯来文中的词义呼应，也不消除这种歧义。
- source_word: עִמָּם
  choice: 与他们相伴
  rationale: עם基本义为“与……同在”；译作“与他们相伴”使现代汉语通顺，同时保留恶伴随、缠附作恶者的紧凑意象。
theological_decisions:
- issue: 开罗藏经库希伯来文本与希腊平行文本在本节显著不同
  choice: 正文以现存希伯来文本为准，并在脚注列出希腊异文。
  alternative: 按希腊文本译为：‘他说：“我已经得享安逸，现在可以享用我的财物了。”他却不知道会有怎样的时刻临到；他必把财物留给别人，自己死去。’
  rationale: 本项目在《便西拉智训》有可靠希伯来见证时优先依据希伯来文。此处希伯来文置信度高，虽有轻微匹配问题；希腊传统内容差异极大，可能反映不同文本传统或节次对应问题，因此不以希腊文取代正文，但在脚注中透明呈现。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。句式尽量贴近希伯来文的两分结构，并以“恶”保留道德邪恶与祸患后果之间的语义张力。
