  yaml_path: translation/deuterocanon/sirach/011/031.yaml
  text: An evil time makes pleasure be forgotten[a], and a man's end tells about him.
translation:
  language: zh_hans
  text: 患难之时使人忘却乐趣；一个人的结局会说明他是怎样的人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行经文作：“因为他把好事变成坏事，伺机埋伏；甚至在可取之事上，他也会加以指摘。”希伯来文与希腊文见证在这里差异显著；正文依从现存希伯来文，因为《便西拉智训》有希伯来文保存之处以希伯来文为主要见证。
    reason: textual_variant
lexical_decisions:
- source_word: עֵת רָעָה
  choice: 患难之时
  rationale: עֵת 指时候或时期，רָעָה 在此更自然地表示逆境、祸患，而非单指道德上的邪恶；“患难之时”符合汉语智慧文学的凝练表达。
- source_word: תְּשַׁכֵּח
  choice: 使人忘记
  rationale: 这是 שכח 的使役形式，表达患难导致人忘记先前的享乐；汉语用“使人忘记”自然地保留使役含义。
- source_word: תַּעֲנוּג
  choice: 享乐
  rationale: 该词指愉悦、享受；“享乐”简洁，并与患难形成鲜明对照。
- source_word: וְסוֹף אָדָם
  choice: 一个人的结局
  rationale: סוֹף 可指终局、最终结果；אָדָם 在此是箴言式的泛指单数，现代汉语以“一个人”表达最自然，也不把泛指误限为男性。
- source_word: יַגִּיד עָלָיו
  choice: 会说明他是怎样的人
  rationale: נגד 的使役式有告知、宣明之意，עָלָיו 是“关于他”。此译表达人的结局会揭示或说明其为人，同时保留经文对“结局”具体所指的开放性。
theological_decisions:
- issue: אָדָם 在箴言式单数中的所指
  choice: 一个人
  alternative: 一个男人
  rationale: 这里谈的是普遍的人生经验，并无证据把 אָדָם 限定为男性；“一个人”既保留单数形式，也符合现代汉语的泛指用法。
- issue: “人的结局”如何说明这个人
  choice: 会说明他是怎样的人
  alternative: 会宣告关于他的事
  rationale: 希伯来文 יַגִּיד עָלָיו 字面是“会讲述/宣明关于他”；正文采用自然汉语表达其揭示性，但不具体断定这里的“结局”必然只指死亡、审判或道德评价。
translation_notes:
  register: 采用凝练、庄重而易懂的现代标准汉语。“患难之时”保留智慧文学格言的节奏；分号呈现两个彼此关联的判断。脚注标记[a]已置于正文相应经句之后。
