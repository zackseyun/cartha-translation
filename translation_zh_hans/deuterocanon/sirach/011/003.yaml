  text: The bee is small among flying creatures[a], but the first of sweet produce is its fruit.
translation:
  language: zh_hans
  text: 蜜蜂在有翅的生物中很小[a]，它的果实却在各样出产中居首。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有翅的生物”也可译作“飞禽”。希腊文平行文本后半句作“它的果实却在甘甜之物中居首”；希伯来文作“各样出产”。
    reason: 说明希伯来词语的可译范围，以及希伯来文与希腊文平行文本之间的措辞差异。
lexical_decisions:
- source_word: אֱלִיל
  choice: 很小
  rationale: 此处与“有翅的生物”及希腊文 μικρά 对应，表示体形微小，而非“无足轻重”或偶像之意。
- source_word: בְּעוֹף
  choice: 在有翅的生物中
  rationale: 希伯来文 עוף 可广指有翅、能飞的生物，不限于现代分类中的鸟类；这样译也避免把蜜蜂称作“飞禽”。
- source_word: דְּבֹרָה
  choice: 蜜蜂
  rationale: 直接表达所指生物，并符合现代汉语通常称谓。
- source_word: וְרֹאשׁ
  choice: 却……居首
  rationale: רֹאשׁ 在这里表示首位、上乘；“却”把两分句之间隐含的反差自然表达出来。
- source_word: תְּנוּבוֹת
  choice: 各样出产
  rationale: 保留希伯来文“出产、产物”的广义，不把希腊文所明确的“甘甜之物”直接写入正文。
- source_word: פּרִיָהּ
  choice: 它的果实
  rationale: 保留希伯来文以“果实”指蜜蜂产物的比喻；希腊文平行文本也采用“果实”一词。
