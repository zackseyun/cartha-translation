  language: zh_hans
  text: 在查究以前，不要妄加指责。[a]要先查明，然后再责备。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “妄加指责”所译的希伯来语动词，较直译可作“扭曲”或“歪曲”；这里可能是警告人不要在查明以前作出不利判断。
    reason: lexical_alternative
  - marker: b
    text: 本节后半的希伯来语措辞较难确定。希腊文本作：“在听以前，不要回答；在言谈中，不要插嘴。”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקוֹר
  choice: 未经查究
  rationale: חקר 表示查考、探究；以“未经查究”自然表达在弄清事实以前不可贸然判断。
- source_word: אַל תְּסַלֵּף
  choice: 不要妄加指责
  rationale: סלף 的基本意象是扭曲、歪曲；在此智慧训诫的语境中，可能指未经查明便作不利判断。“妄加指责”传达实际劝诫，同时由脚注保留较直译的可能。
- source_word: בַּקֵּר לְפָנִים
  choice: 要先查明
  rationale: בקר 在此要求察看、核查，לְפָנִים 表示次序上的在先；“先查明”简洁而符合现代汉语。
- source_word: וְאַחַר תַּזִּיף
  choice: 然后再责备
  rationale: 末一动词的词形和含义有困难；依希伯来语句内“先……然后……”的次序及训诫语境，正文采用“责备”，但不排除希腊文本所见的“回答／插话”。
