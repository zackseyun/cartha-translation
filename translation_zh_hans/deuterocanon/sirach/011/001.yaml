  text: The wisdom of the poor lifts up his head[a], and seats him among nobles.
translation:
  language: zh_hans
  text: 穷人的智慧使他抬起头来[a]，又使他坐在贵人中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “穷人”也可译作“卑微的人”或“谦卑的人”。希伯来文直指贫穷或弱势的人；希腊文平行文本则可泛指地位低微的人。
    reason: 保留 דַּל 在经济贫困、社会低微和谦卑之间的语义幅度。
lexical_decisions:
- source_word: חָכְמַת דַּל
  choice: 穷人的智慧
  rationale: 保留希伯来文的构造关系，并以“穷人”优先表达 דַּל 的贫困、社会地位低下之义。
- source_word: תִּשָּׂא רֹאשׁוֹ
  choice: 使他抬起头来
  rationale: 保留原文“抬头”的形象，既可表达尊严恢复，也暗含地位提升；希腊文平行文本同样保留“头”的意象。
- source_word: וּבֵין נְדִיבִים
  choice: 在贵人中间
  rationale: 此处 נְדִיבִים 结合上下文及希腊文 μεγιστάνων，指有身份、有地位的人；“贵人”自然传达社会尊荣，而不限定为王公。
- source_word: תּוֹשִׁיבֶנּוּ
  choice: 使他坐
  rationale: 这是 ישב 的使役形式，表示使某人得以入座；译文保留与贵人同席所体现的接纳和尊荣。
theological_decisions:
- issue: דַּל 应主要理解为经济贫困，还是较广义的卑微、低微
  choice: 穷人
  alternative: 卑微的人；谦卑的人
  rationale: 希伯来文本首先支持具体的贫困或弱势身份，故正文译作“穷人”；希腊文 ταπεινοῦ 可涵盖更广的低微身份，因此在脚注中保留其他可能。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“抬起头来”保存原文形象；“坐在贵人中间”呈现获准与尊贵者同席的社会尊荣。
