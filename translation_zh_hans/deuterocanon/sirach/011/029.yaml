  text: Do not say[a], “I have enough before me; what disaster will come upon me?”
translation:
  language: zh_hans
  text: 不要说[a]：“我面前已有足够的了，什么灾祸会临到我呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“不要把每个人都带进你家，因为诡诈之人的埋伏很多。”这反映了本节一种实质不同的文本形态。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: 忠实表达否定命令，保留劝诫的直接语气，不将“说”解释为“想”。
- source_word: דַּיִּי
  choice: 已经够用了
  rationale: די表示“足够、充足”；译文表达第一人称所认定的充足，又不改写成偏重主观感受的“我很满足”。
- source_word: לְפָנַי
  choice: 我眼前
  rationale: 保留希伯来语“在我面前”的空间意象，在现代汉语中也可自然指目前摆在面前、可供使用之物。
- source_word: מַה אָסוֹן
  choice: 什么灾祸
  rationale: אָסוֹן指严重的祸患或灾难；“灾祸”既庄重自然，也保留其严重程度。
- source_word: יְהִי עָלָי
  choice: 会临到我呢
  rationale: 贴近字面“将会在我身上”，并以汉语反问句自然呈现说话者自以为不会遭祸的语气；不额外加入“可能”等情态。
- source_word: Μὴ πάντα ἄνθρωπον εἴσαγε εἰς τὸν οἶκόν σου· πολλὰ γὰρ τὰ ἔνεδρα τοῦ δολίου
  choice: 不纳入正文
  rationale: 希腊文本与现存希伯来文本内容显著不同，不能在不混合两个文本传统的情况下合并；因此保留为异文脚注。
theological_decisions:
- issue: 《便西拉智训》11:29希伯来文本与希腊文本显著分歧
  choice: 正文采用现存希伯来文本，并在脚注列出希腊异文
  alternative: 以希腊文本为正文：“不要把任何人都带进你家，因为诡诈之人设下许多埋伏。”
  rationale: 本节希伯来见证现存且可靠度高，故据其翻译正文；希腊传统反映实质不同的经文形态，需透明保留，却不宜与希伯来正文调和或拼接。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我眼前已经够用了”保留希伯来语的具体意象；末句用反问语气呈现自恃安稳的口吻。脚注标记[a]置于“说”后，明确提示整句存在希腊异文。
