revisions:
- from: 到那时，他会说：“我已经得享安逸，现在可以享用我的福分了。”[a][b]
  to: 当他说：“我已经得享安逸，如今我要享用我的好东西。”[a][b]
  rationale: 修订以所给带元音的希伯来文本为准：保留“已经”所表达的完成状态、以“安逸”表达נַחַת，并将两个第一人称动词置于同一段直接引语中。“如今”自然对应וְעַתָּה；“享用我的好东西”保留“吃我的好物”的比喻性用法和未限定的物质／美好所得含义。希腊文仅作为显著异文列于脚注，不混入正文。
