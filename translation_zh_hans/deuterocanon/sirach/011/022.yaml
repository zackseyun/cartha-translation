  text: And at the time he says, “I have found rest,” then now he will eat from his good things.
translation:
  language: zh_hans
  text: 当他说：“我已经得享安逸，如今我要享用我的好东西。”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“如今我要吃我的好物。”这里的“吃”指享用所得之物。
    reason: literal_rendering
  - marker: b
    text: 希腊文在此显著不同：“主的赐福在虔敬者的报偿中；在顷刻之间，他的赐福蓬勃兴盛。”希伯来文与希腊文似乎反映了不同的文本形态。
    reason: textual_variant
lexical_decisions:
- source_word: וּבְעֵת יֹאמַר
  choice: 到那时，他会说
  rationale: וּבְעֵת标示一个时间点；未完成式יֹאמַר在这里可自然译为将来或情境性的“会说”。
- source_word: מָצָאתִי נַחַת
  choice: 我已经得享安逸
  rationale: מָצָאתִי表示已经达到或获得某种状态；נַחַת指安歇、安稳、舒适。“得享安逸”既保留完成意义，也符合现代汉语表达。
- source_word: וְעַתָּה אֹכַל
  choice: 现在可以享用
  rationale: 希伯来文直译为“现在我要吃”。这里的“吃”指享受所得之物，译作“可以享用”更符合汉语习惯；第一人称形态表明此句继续前面的直接引语。
- source_word: מִטּוֹבָתִי
  choice: 我的福分
  rationale: 该词带第一人称单数后缀，直指“我的好物／好处”。“福分”可涵盖财物、富足及美好所得，又不把所指限定得过窄。
theological_decisions:
- issue: 后半句是直接引语还是第三人称叙述
  choice: 作为此人话语的延续：“现在可以享用我的福分了”
  alternative: 转为叙述：“现在他要享用自己的好东西”
  rationale: 带元音的希伯来文本אֹכַל和מִטּוֹבָתִי都是第一人称，最自然的句法是继续直接引语。无需为追求表面顺畅而改换人称。
- issue: 希伯来文与希腊文的显著差异
  choice: 正文依据高可信度的希伯来文本，脚注列出希腊异文
  alternative: 采用希腊文关于“主的赐福”和“虔敬者报偿”的文本
  rationale: 所给希伯来原文证据完整且置信度高；希腊平行文本显然代表另一文本形态，应如实保留为异文，而不混入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“得享安逸”表达已经获得安稳舒适的状态；“享用我的福分”传达“吃自己的好物”这一比喻性说法。保留原文第一人称直接引语，以避免无根据的人称转换。
