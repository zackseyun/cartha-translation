base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/007.yaml
  text: Many who were exalted have been greatly disgraced[a], and brought low together; even the honored have been given into another's hand.
translation:
  language: zh_hans
  text: 许多身居高位的人大受羞辱[a]，并一同被降为卑微；就连尊贵的人也被交在别人手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在此有实质不同的读法：“未经查验，不要责怪；先要明白，然后才责备。”本译文依照现存的希伯来文本。
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים נִשָּׂאִים
  choice: 许多身居高位的人
  rationale: נִשָּׂאִים在此指身份或地位被抬高，并非实际被举起。“身居高位”以自然的现代汉语表达其社会地位，同时保留“许多”作数量限定。
- source_word: נִקְלוּ מְאֹד
  choice: 大受羞辱
  rationale: נִקְלוּ表达被轻看、失去尊荣或蒙羞，מְאֹד加强程度。“大受羞辱”既与前面的高位形成鲜明逆转，也避免把经文过度限定为内在品格变得卑劣。
- source_word: וְהִשְׁפִּלוּ יַחַד
  choice: 一同降为卑微
  rationale: 希伯来文本的动词形式较为压缩，语境明确表达由高而低的共同结局。“降为卑微”保留地位下降的结果，“一同”对应יַחַד；不擅自补出施事者。
- source_word: וְגַם נִכְבָּדִים
  choice: 就连尊贵的人
  rationale: וְגַם在此有递进强调作用；נִכְבָּדִים泛指受尊重、地位显赫者。“就连尊贵的人”保留这种修辞力度，又不限定为世袭贵族。
- source_word: נִתְּנוּ בְיָד
  choice: 被交在别人手中
  rationale: 这是落入他人权势或控制之下的希伯来惯用语。“被交在别人手中”保留原文的“手”意象，并按汉语需要明示其为他人之手。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本有重大差异
  choice: 正文依照现存希伯来见证，译为尊贵者降卑并落入他人手中的智慧箴言。
  alternative: 依希腊文译为：“未经查验，不要责怪；先要明白，然后才责备。”
  rationale: 本项目在《便西拉智训》有希伯来文本存留时以希伯来文为正文依据。此处希腊文呈现的不是轻微措辞变体，而是实质不同的读法，故在脚注中完整说明，而不以之取代希伯来正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“身居高位—降为卑微”凸显原文的命运逆转；“被交在别人手中”保留希伯来语意象，同时让普通读者能够理解为落入他人权势之下。
