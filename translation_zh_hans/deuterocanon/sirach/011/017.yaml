  text: Good and evil[a], life and death[c][b], poverty and wealth—they are from him.
translation:
  language: zh_hans
  text: 善与恶[a]，生与死[b]，贫穷与富足，都出于他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶”也可译作“祸患”“逆境”或“灾祸”；希伯来词 רַע 既可泛指恶，也可指临到人的患难。
    reason: lexical_alternative
  - marker: b
    text: 希腊文见证在本节有显著不同：“主的恩赐常存留给敬虔人；他的恩惠将永远兴盛。”希伯来文与希腊文在这里并不相合。
    reason: textual_variant
  - marker: c
    text: 希伯来文直译为“出于他”。从上下文看，“他”很可能指上帝，但本行没有明说神名。
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: 善
  rationale: 与“恶”构成概括性的对举；“善”保留希伯来词的广泛含义，不把它限缩为福祉或顺境。
- source_word: וְרַע
  choice: 与恶
  rationale: רַע 可指恶，也可指祸患、逆境；正文采用较宽泛且与“善”直接对应的“恶”，并以脚注保留其他可能。
- source_word: חַיִּים
  choice: 生
  rationale: 与“死”形成固定而简洁的对举，符合现代汉语智慧文学的庄重表达。
- source_word: וָמָוֶת
  choice: 与死
  rationale: 直接呈现“生—死”的反义关系，不作弱化或释义。
- source_word: רֵישׁ
  choice: 贫穷
  rationale: 该名词表示贫困、缺乏；“贫穷”自然地与后面的“富足”相对。
- source_word: וְעֹשֶׁר
  choice: 与富足
  rationale: 表示财富或富裕状态；“富足”与“贫穷”对称，也比“财富”更适合此处成对列举的状态。
- source_word: מֵיי הוּא
  choice: 都出于他
  rationale: 所给希伯来文本使用第三人称单数代词，并未明说上帝的名号；“都”统摄前述各组事物，“出于他”保留原文措辞及指代张力。
theological_decisions:
- issue: 末尾代词所指
  choice: 他
  alternative: 主／上帝
  rationale: 上下文很可能以“他”指上帝，但本行希伯来文本没有明说神名或称号，因此正文不补入“主”或“上帝”。
- issue: רַע 的范围及其与神圣来源的关系
  choice: 恶
  alternative: 祸患／逆境／灾祸
  rationale: רַע 的语义既可能涵盖道德之恶，也可能指遭遇的祸患。正文保留较宽的“恶”，脚注说明另一语义范围，不替原文消解神学张力。
- issue: 希伯来文与希腊文见证的差异
  choice: 以所给希伯来文为正文
  alternative: 采用希腊文：“主的恩赐常与敬虔人同在，他的恩惠必永远亨通。”
  rationale: 希腊平行文本与希伯来文本差异显著，不能仅作为同一句的直译校正；依原文优先原则，以高可信度的希伯来见证立正文，并在脚注记录异文。
translation_notes:
  register: 采用现代、简洁而庄重的标准普通话，以三组对举维持希伯来智慧格言的节奏。“善与恶，生与死，贫穷与富足”结构整齐；末句保留代词，不擅自补明指称。
