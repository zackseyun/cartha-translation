base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/026.yaml
  text: For it is easy in the eyes of the Lord[a], in a sudden moment, to make a poor man rich.
translation:
  language: zh_hans
  text: 因为在主眼中，使穷人顷刻间富足，是轻而易举的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“因为在主面前这是容易的：在死亡之日，按一个人的行为报应他。”希腊文所反映的本节文本，与现存希伯来文有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: נֹכַח
  choice: 轻而易举
  rationale: 结合“在主眼中”及希腊文 κοῦφον，本词在此表示这事对主毫不费力；译为“轻而易举”比“显然”或“直接”更符合上下文。
- source_word: בְּעֵינֵי יי
  choice: 在主眼中
  rationale: 保留希伯来语惯用表达，并以现代汉语中自然、庄重的措辞呈现；יי按传统敬称译作“主”。
- source_word: בְּפֶתַע פִּתְאֹם
  choice: 顷刻间
  rationale: 原文叠用近义词以加强突然、迅速之意；“顷刻间”简洁自然，并保留强烈的瞬时意味。
- source_word: לְהַעֲשִׁיר
  choice: 使……富足
  rationale: 准确体现使役形态，表示使穷人变得富有；“富足”在智慧文学语境中自然且庄重。
- source_word: דָּל
  choice: 穷人
  rationale: 指一个贫穷的人。汉语“穷人”可自然表达单数的泛指，无须额外标明性别。
- source_word: ὅτι κοῦφον ἔναντι Κυρίου
  choice: 因为在主眼中……是轻而易举的
  rationale: 希腊文平行文本支持“容易、毫不费力”的语义，也支持因果性的开头“因为”。
- source_word: ἐν ἡμέρᾳ τελευτῆς ἀποδοῦναι ἀνθρώπῳ κατὰ τὰς ὁδοὺς αὐτοῦ
  choice: 不纳入正文
  rationale: 希腊文本在此与现存希伯来文本有实质差异。鉴于本节有高可信度的希伯来见证，正文依希伯来文，希腊异文则在脚注中完整保留。
theological_decisions:
- issue: 神名的译法
  choice: 主
  alternative: 雅威／上主
  rationale: 希伯来文יי是对神名的敬虔写法；“主”是简体中文圣经语体中自然、庄重且不过度限定宗派传统的对应。
- issue: 希伯来文本与希腊文本的不同形式
  choice: 正文采用现存希伯来文，脚注列出希腊异文
  alternative: 正文采用希腊文：“因为在主面前这是容易的：在死亡之日，按一个人的行为报应他。”
  rationale: 本节希伯来文本保存完整且可信度高，应作为正文依据；希腊文反映出实质不同的文本形态，故以脚注呈现，避免掩盖文本传统中的张力。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“在主眼中”保留希伯来语意象；“顷刻间”传达叠词所加强的突然性；语序调整为自然汉语，同时保持因果关系和神使穷人富足的核心命题。
