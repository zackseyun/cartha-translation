  text: My son[a], stand by your appointed lot and walk in it[b], and grow old in your work.
translation:
  language: zh_hans
  text: 我儿[a]，要坚守你的本分，在其中行事[b]；要在你的工作中终老。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文见证作：“不要说：‘我已经自给自足，从今以后还能有什么祸患临到我呢？’”现存希伯来文在这里与希腊文传统差异显著。
    reason: alternative_reading
  - marker: b
    text: 希伯来文“你的本分”一语含义较难确定，也可能指“你所分得的份”“为你规定的范围”或“你应遵循的准则”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留阳性单数呼语和父辈训诲的语境；现代中文简洁庄重。
- source_word: עֲמוֹד
  choice: 要坚守
  rationale: 命令式在此不宜机械译作“站立”；“坚守”表达持续持守、不离开所指定范围的意思。
- source_word: בְּחֻקֶּךָ
  choice: 你的本分
  rationale: חֹק通常可指律例、定分或所规定的范围；此处词义困难。“本分”在现代中文中可涵盖所分派的职责与界限，同时避免过度限定为法律条文。
- source_word: וּבוֹ הִתְהַלֵּךְ
  choice: 在其中行事
  rationale: התהלך在此指持续的生活行为。“行事”自然表达按该本分生活，并保留介词בו所指向的范围。
- source_word: וּבִמְלָאכְתְּךָ
  choice: 在你的工作上
  rationale: מלאכה可指工作、职业或劳作；“工作”宽泛自然，不把经文缩限为某一种职业。
- source_word: הִתְיַשֶּׁן
  choice: 终老
  rationale: 该形式表达变老、年久之意；“终老”简洁地传达长久安于并坚持自己的工作，且不误解为疲惫耗尽。
theological_decisions:
- issue: 现存希伯来文与希腊文传统显著不同
  choice: 正文以现存希伯来文为准，并在脚注完整提示希腊异文。
  alternative: 仅依希腊文译作：“不要说：‘我已经自给自足，从今以后还能有什么祸患临到我呢？’”
  rationale: 本节有可信度较高的希伯来文见证，因此正文应优先翻译希伯来文；但希腊见证内容完全不同，可能反映不同底本或文本传承的不稳定，必须明确保留而不可调和或隐藏。
- issue: בְּחֻקֶּךָ的语义范围
  choice: 译作“你的本分”，并以脚注保留“所分得的份、规定的范围或应遵循的准则”等可能。
  alternative: 译作“你的律例”“你的定分”或“你的道路”。
  rationale: 上下文不足以确定该词究竟偏向定分、职责范围还是规范。“本分”较自然并保留多重含义，脚注则明确其不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的训诲体。“我儿”保留原文称呼；分号呈现前两项相连的劝勉与末项长期坚持之间的层次。“终老”略具书面色彩，但在现代标准汉语中通顺凝练。
