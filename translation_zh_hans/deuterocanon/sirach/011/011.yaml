  text: There is[a] one who labors and toils and hurries, yet all the more he comes up short.
translation:
  language: zh_hans
  text: 有一个人[a]辛苦劳碌，匆忙奔波，反而越发缺乏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的开罗藏经库希伯来文本与本节的希腊文本不相对应，因此正文依照希腊见证翻译。该希伯来文本大意为：“我儿，你为何增多你的欺压？……增多这事的人必不能免罪。”
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν
  choice: 有一个人
  rationale: 采用希腊平行文本作为本节正文依据；此处是存在式表达，用自然的现代汉语引出一类人。
- source_word: κοπιῶν καὶ πονῶν
  choice: 辛苦劳碌
  rationale: 两个近义分词叠加，强调艰苦费力；译文保留双重表达，又避免生硬重复。
- source_word: σπεύδων
  choice: 匆忙奔波
  rationale: 此词可指急忙或热切；在连续描写劳苦的语境中，译作“匆忙奔波”能体现加紧行动的画面。
- source_word: τόσῳ μᾶλλον
  choice: 反而越发
  rationale: 表达与先前努力形成反差，并保留程度不断加深的比较意味。
- source_word: ὑστερεῖται
  choice: 缺乏
  rationale: 原词可指短缺、落后或未能达到；“缺乏”不限定所缺的是钱财、地位还是其他事物，保留原文的开放性。
theological_decisions:
- issue: 现存希伯来文本与本节希腊平行文本不相对应
  choice: 正文依照内容连贯、明确对应《便西拉智训》11:11的希腊见证翻译，并以脚注说明文本差异。
  alternative: 依所提供的希伯来行译作：“我儿，你为何增多你的欺压？……增多这事的人必不能免罪。”
  rationale: 所给希伯来行与希腊本本节内容不符，可能来自另一处语境。采用希腊见证可恢复本节连贯意义，同时脚注明示异文，不掩盖原始资料的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“辛苦劳碌，匆忙奔波”保留原文连续堆叠的努力动作；“反而越发缺乏”突出其讽刺性的逆转，同时不擅自说明缺乏的具体对象。
