  text: He lifted him up and exalted him[b][a], and many were astonished at him.
translation:
  language: zh_hans
  text: 他把他高高举起，使他尊贵[a][b]；许多人都因他而惊奇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高高举起”所对应的希伯来语，字面可理解为“举到／举在他的头（或顶端）”；这里可能指把他提升到高位。
    reason: lexical_alternative
  - marker: b
    text: 所提供的希腊语平行文本与此处希伯来文内容并不对应，因此本译文依据现存希伯来文。
    reason: textual_variant
lexical_decisions:
- source_word: נָשָׂא בְּרֹאשׁוֹ
  choice: 把他高高举起
  rationale: נָשָׂא 表示“举起、抬高”；בְּרֹאשׁוֹ 字面较难，可能保留“头、顶端”的意象。译作“高高举起”以自然中文表达提升之意，同时不把它过度限定为具体位置。
- source_word: וַיְרֹמְמֵהוּ
  choice: 使他尊贵
  rationale: רומם 可指抬高或尊崇。这里与前句形成平行；“使他尊贵”既避免机械重复，也传达地位被提升的含义。
- source_word: וַיִּתְמְהוּ
  choice: 惊奇
  rationale: תמה 表示惊讶、诧异或惊奇；“惊奇”兼含惊讶与希奇，适合简洁的诗性叙述。
- source_word: עָלָיו
  choice: 因他而
  rationale: 介词 עַל 在惊异类动词后可指出引起惊奇的对象或缘由；“因他而”在现代汉语中自然，并保留“关于他／对着他惊奇”的语义幅度。
- source_word: רַבִּים
  choice: 许多人
  rationale: 准确表达不定多数，并补出中文所需的指人名词。
theological_decisions:
- issue: 希伯来文没有明说施事者和受事者的身份
  choice: 以两个男性单数代词“他”翻译，不指明其中任何一方是谁
  alternative: 把主语明确译为“上主／神”，或把宾语确定为某位统治者
  rationale: 原文只有阳性单数动词和宾语后缀，没有出现明确名词；保留代词可避免把上下文之外的神学身份强加给本句。
- issue: 提升是空间性的还是身份性的
  choice: 以“高高举起”与“使他尊贵”并列，兼顾两层意义
  alternative: 两处都译作纯空间性的“抬高”，或都译作纯身份性的“尊崇”
  rationale: 两个平行动词既有抬高意象，也可能表达地位提升；分别呈现可保存原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“高高举起”保留诗性提升意象，“使他尊贵”表达身份升高。脚注标记均置于相关主句之后；顺序按正文出现排列。
