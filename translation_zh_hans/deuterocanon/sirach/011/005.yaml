  text: For the works of the Lord are wondrous[b][a], and his work is hidden from man.
translation:
  language: zh_hans
  text: 因为主的作为奇妙[a]，他的作为向人隐藏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本与这里的希伯来文差异很大：“许多暴君坐在地上，那出人意料的人却戴上了冠冕。”希伯来文与希腊文见证在此似乎反映了不同的文本形态。
    reason: textual_variant
lexical_decisions:
- source_word: פְלָאוֹת
  choice: 奇妙非凡
  rationale: 该词源于 פלא，表示超乎寻常、令人惊奇；“奇妙非凡”既保留其崇高意味，也适合现代汉语的表语结构。
- source_word: מַעֲשֵׂי
  choice: 作为
  rationale: 这是 מַעֲשֶׂה 的复数附属形式，在此指主所行的一切；“作为”自然庄重，并可与后文单数的“工作”形成对应。
- source_word: יי
  choice: 主
  rationale: 希伯来文本以敬称式写法 יי 指称上帝；译作“主”既传达神圣称号，也不对其具体书写形式作过度推断。
- source_word: וְנֶעְלָם
  choice: 不为……所知
  rationale: עלם 的被动式表示隐藏、超出认知；“不为人所知”以自然汉语保留被动含义，未把它加强为绝对不可知。
- source_word: מֵאָדָם
  choice: 人
  rationale: אָדָם 在此为单数泛指，所指是人类；现代汉语“人”本身可作泛称，无须加入性别限定。
- source_word: פָּעֳלוֹ
  choice: 他的工作
  rationale: 该单数词指上帝的行动或工作；译文保留原文从复数“作为”转为单数“工作”的变化，而不将两者合并。
theological_decisions:
- issue: 敬称式神名 יי 的译法
  choice: 主
  alternative: 耶和华
  rationale: 原见证写作敬称式 יי，而非完整四字神名；“主”忠实反映其敬称功能，又避免对底本文字作超出证据的还原。
- issue: 人的认知限度
  choice: 他的工作不为人所知
  alternative: 人无法明白他所做的一切
  rationale: 选择被动、较克制的表达，以保留原文“隐藏”的意象和张力；不擅自把它解释成绝对、永久或全面的不可知。
- issue: אָדָם 的泛指范围
  choice: 人
  alternative: 世人
  rationale: “人”既能对应希伯来语单数形式，也能在现代汉语中自然泛指全人类；“世人”虽更显明，却加入了原文没有的集合色彩。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“奇妙非凡”传达 פלא 的强度；“作为／工作”刻意保留原文复数与单数及近义词之间的变化。脚注标记紧接相关希伯来文本所代表的整句内容。
