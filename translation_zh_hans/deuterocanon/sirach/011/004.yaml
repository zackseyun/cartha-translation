  text: Do not mock a poor man[b][a], and do not boast in bitter days.
translation:
  language: zh_hans
  text: 不要因破旧的外衣自夸[b][a]，也不要在困苦的日子夸耀自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊本作：“不要因衣着夸口，也不要在荣耀的日子抬高自己；因为主的作为奇妙，他在人间的作为隐而不见。”
    reason: textual_variant
  - marker: b
    text: 或译：“将坏的外衣”或“褴褛的衣服”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲטֶה אֹבֵד
  choice: 衣衫褴褛的人
  rationale: מַעֲטֶה 指外衣或遮身之物，אֹבֵד 有败坏、损坏、将要消亡之意。原文可直指“破旧的外衣”，也可借衣着指衣衫破旧、处境贫困的人；正文采用自然的汉语转喻，同时在脚注保留直译可能。
- source_word: אַל תְּהַתֵּל
  choice: 不要讥笑
  rationale: התל 在此宜理解为嘲弄、戏弄；与前面的衣着或衣衫褴褛者相连，构成不可因外表而轻蔑人的劝诫。
- source_word: תְּקַלֵּס
  choice: 自夸
  rationale: קלס 的强意词干可表达称颂、夸耀；此处没有明说宾语，劝诫语境容许理解为称扬自己。译作“自夸”在现代汉语中简洁自然，也保留自我高举的意味。
- source_word: בִּמְרִירֵי יוֹם
  choice: 在苦难的日子
  rationale: 该短语字面涉及“日子的苦涩”，可指艰难、困苦的时日。译文以“苦难的日子”传达希伯来文本的苦涩意象，不采用希腊本“荣耀的日子”。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本在第二分句及后续解释句上存在差异
  choice: 正文采用希伯来文本的两分句劝诫，并译作“在苦难的日子”。
  alternative: 希腊本作：“不要因身上穿的衣服夸口，也不要在荣耀的日子抬高自己；因为主的作为奇妙，他在人间的作为隐而不见。”
  rationale: 此处希伯来文本保存完整、来源可信度高，因此正文以希伯来见证为先；希腊本的不同措辞及新增解释句作为真实的文本异文完整列入脚注，不把二者调和。
- issue: מַעֲטֶה אֹבֵד 是直接指破衣，还是借衣着指贫困者
  choice: 正文采用转喻性理解“衣衫褴褛的人”。
  alternative: “破旧的外衣”或“褴褛的衣服”。
  rationale: 希伯来语法容许直接指一件败坏的外衣，也可能借外衣描述穿衣者。正文采用汉语中较通顺且符合“讥笑”搭配的转喻表达，脚注明确保留物件义，避免把歧义悄然消除。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“衣衫褴褛的人”比“贫穷人”更保留原文以外衣描写外在处境的形象；“苦难的日子”自然传达希伯来语的“苦涩”而不过度口语化。脚注标记沿用所给资料的对应关系：[a] 为希腊异文，[b] 为词义备选。
