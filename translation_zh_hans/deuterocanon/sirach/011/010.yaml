base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/010.yaml
  text: Do not contend where there is no cause[b][a], and do not rise up in the quarrel of the arrogant.
translation:
  language: zh_hans
  text: 若无缘由，不要争执[a]；在狂傲人的争端中，不要出头。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 עַצָּבָה 在这里的确切含义不确定，也可理解为“痛苦”“烦恼”“麻烦”或“冒犯、得罪之事”。本译文按“没有足以引起争执的缘由”理解。
    reason: lexical_alternative
  - marker: b
    text: 希腊文本在这里差异很大：“孩子，不要让你所做的事过多；你若增多，就不能免罪；你若追赶，也追不上；你即使逃跑，也逃脱不了。”这可能反映了不同的希伯来底本或重大的文本分歧。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֵין
  choice: 若无
  rationale: 介词 בְּ 与表示不存在的 אֵין 连用，说明某种情形或条件；“若无”在现代汉语中简洁自然。
- source_word: עַצָּבָה
  choice: 缘由
  rationale: 该词在此处语义不确定，可涉及痛苦、烦恼、麻烦或引发争端的事由。结合“不要争执”，译作“缘由”表达没有正当争端依据的意思，同时用脚注保留其他可能。
- source_word: אַל תִּתְחָר
  choice: 不要争执
  rationale: 此动词可表示激动、发怒或投入争竞；在劝戒语境中，“不要争执”清楚传达其实际含义。
- source_word: וּבְרִיב
  choice: 在……的争吵中
  rationale: רִיב 可指争端、争讼或争吵；此处采用日常而庄重的“争吵”，不把语境限定为法律诉讼。
- source_word: זֵדִים
  choice: 傲慢的人
  rationale: זֵדִים 指狂妄、放肆或自以为是的人；“傲慢的人”是现代汉语中清楚且保留道德评价的表达。
- source_word: אַל תְּקוֹמֵם
  choice: 不要挺身介入
  rationale: 该动词以“起来、站起”为基本意象，在这里可能指站出来参与或对抗。“挺身介入”既保留动作意象，也使中文意思自然明确。
theological_decisions:
- issue: 希伯来文本与希腊平行文本差异显著
  choice: 正文依据现存希伯来文翻译，并在脚注列出希腊异文。
  alternative: 以希腊文较长的劝戒作为正文：“孩子，不要让你的事务涉及许多事……”
  rationale: 本节有可用且可信度高的希伯来文本；希腊文内容明显不同，可能反映另一希伯来底本或重大的文本分歧。因此不以希腊文取代希伯来正文，但完整提示读者。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保持智慧文学劝诫语气。“挺身介入”保留希伯来语“起来”的形象，同时避免生硬直译。
