base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/018.yaml
  text: Wisdom and understanding and the knowledge of a matter are from the Lord[a]; sin and upright ways are from the Lord.
translation:
  language: zh_hans
  text: 有人因谨慎和吝啬而致富；这就是他所得报偿的一部分：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的开罗藏经库希伯来文本在这里是另一则格言：“智慧、明悟和辨明事理都出于主；罪和正直的道路都出于主。”这段话与《便西拉智训》11:18的希腊文本不对应，因此正文依照希腊文本翻译。
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν πλουτῶν
  choice: 有人……致富
  rationale: 用存在句表达某一类人；现在分词呈现其逐渐或实际致富的状态，中文以“致富”自然传达。
- source_word: ἀπὸ προσοχῆς
  choice: 因谨慎
  rationale: προσοχή可指留心、谨慎；“因”保留ἀπό的原因意味，也不预先把该品质判为褒义或贬义。
- source_word: καὶ σφιγγίας αὐτοῦ
  choice: 和吝啬
  rationale: σφιγγία表示节制到悭吝、紧缩的程度；“吝啬”清楚、现代，并保留原文的负面色彩。
- source_word: καὶ αὕτη ἡ μερὶς
  choice: 这就是……的一部分
  rationale: μερίς指份额、所得的一份；结合后文未完的承接结构，译作“一部分”自然，也为下一节所述结果留下空间。
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: 他所得报偿
  rationale: μισθός可指工资或报偿；此处是其行为带来的所得，以“报偿”保留结果性，不限定为雇佣工资。
theological_decisions:
- issue: 所给希伯来文本与《便西拉智训》11:18希腊见证不对应
  choice: 正文依照希腊平行文本翻译，并用脚注完整说明希伯来异文
  alternative: 按所给希伯来文译为“智慧、明悟和辨明事理都出于主；罪和正直的道路都出于主”
  rationale: 所给希伯来句显然属于另一则格言，与希腊本本节的上下文和节次不合。为避免把错置文本当成本节正文，采用连贯对应11:18的希腊见证，同时不隐去希伯来材料及其神学张力。
- issue: μερὶς τοῦ μισθοῦ的范围
  choice: 译作“所得报偿的一部分”
  alternative: 译作“所得的报偿”或“他的份”
  rationale: 直译保留“份额”概念，也避免断言致富本身就是其全部报偿；句末冒号反映原文与下一节相连。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“谨慎和吝啬”保留两个并列成因及其褒贬张力；句末用冒号，因为希腊句法和思想在下一节继续。
