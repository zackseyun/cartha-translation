  text: There is one who labors and toils and rushes about[a], yet all the more he falls behind.
translation:
  language: zh_hans
  text: 有人劳碌、辛劳、奔忙，反而越发落后[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处直译可作：“他迟延了／落在后面。”本节的希腊文传统则作：“他抬起了头，许多人都因他而惊奇。”这反映了一个差异很大的文本传统。
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  choice: 有人
  rationale: 以存在句引出一种典型人物；“有人”自然、简洁，并保留泛指单数。
- source_word: עָמֵל
  choice: 劳苦
  rationale: 表达辛勤劳作和付出艰苦努力的意思，也适合智慧文学的凝练语体。
- source_word: וְיָגֵעַ
  choice: 疲惫
  rationale: 该词可指困倦、疲乏；与“劳苦”并列，保留由辛劳而疲惫的递进，而不将两个近义词完全合并。
- source_word: וָרָץ
  choice: 奔忙
  rationale: 字面为“奔跑”；在此描写忙碌急切的行动，“奔忙”比单说“跑”更符合现代汉语语境。
- source_word: וּכְדֵי כֵן
  choice: 结果反而
  rationale: 此短语含义困难；结合本句前后反讽性的对照，以“结果反而”自然传达尽管竭力奔忙却仍迟滞落后的关系，同时不作过度具体化。
- source_word: הוּא מִתְאַחֵר
  choice: 落在后面
  rationale: 该反身形式表示耽搁、迟延或落后；“落在后面”保留动态意象，并与前面的“奔忙”形成鲜明对照。
