  text: Do not say[a], “Look, I have done what I desired; and what now will be lacking to me?”
translation:
  language: zh_hans
  text: 不要说[a]：“看，我已经做成了自己想做的事；现在我还会缺少什么呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“未到终局，不要称任何人有福；一个人要从他的儿女身上被认出来。”这里的希伯来文本却警告人不可说：“我已经做成了自己想做的事；现在我还会缺少什么呢？”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: 不要说
  rationale: 否定词加未完成时在此表达禁令；“不要说”直接、自然地保留这一语气。
- source_word: הִנֵּה
  choice: 看
  rationale: 用来引出自满的断言；“看”既保留指示和强调作用，又比“看哪”更符合现代汉语。
- source_word: עָשִׂיתִי חֶפְצִי
  choice: 我已经做成了自己想做的事
  rationale: 完成式表达已经实现的行动结果；חֶפְצִי 可指自己的愿望、喜好或意愿。此译文自然地传达“完成自己所愿”的意思，不把它收窄为享乐。
- source_word: וּמֶה עַתָּה
  choice: 现在……什么呢
  rationale: 保留从自我满足转向自以为安稳的反问；希伯来语连接词在分号后的汉语承接关系中自然体现。
- source_word: יֵעָזֵב לִי
  choice: 我还会缺少什么
  rationale: 该形式字面可涉及“被留下、剩下”，在此语境中也可表达“有所缺少”。反问译法传达说话者自以为什么都不缺的心态，同时不把句意扩展为确定的未来保证。
theological_decisions:
- issue: 希伯来文本与希腊平行文本显著不同
  choice: 正文直接翻译现存希伯来文，并在脚注中列出希腊异文。
  alternative: 依希腊文译为：“未到终局，不要称任何人有福；一个人要从他的儿女身上被认出来。”
  rationale: 本节有可靠的希伯来见证，应以其为正文依据。希腊文措辞并非近似的逐词对应，虽同样警戒人不可过早自满，却不宜取代希伯来正文；其重要差异应由脚注完整保存。
- issue: יֵעָזֵב לִי 的语义张力
  choice: 按语境译为“我还会缺少什么”。
  alternative: 较字面的译法是“还会给我留下什么”。
  rationale: 本句是自满者的反问，“缺少什么”在现代汉语中最清楚地呈现其自以为已经如愿、今后不会匮乏的意思；但希伯来词本身“留下”的语义背景仍值得在翻译说明中承认。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“做成了自己想做的事”比“遂我所欲”通俗，也比“满足了我的欲望”更少引入负面含义；末句用反问自然表现说话者的自满。脚注标记[a]已置于正文相应位置。
