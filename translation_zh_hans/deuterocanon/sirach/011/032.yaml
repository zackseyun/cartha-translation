base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/032.yaml
  text: Before you examine a man[a], do not call him blessed[b], for a man will be called blessed in his end.
translation:
  language: zh_hans
  text: 在考察一个人[a]之前，不要称他为有福[b]；因为一个人到了结局时，才会被称为有福。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在查明一个人之前，不要宣称他有福；因为一个人到了最终结果时，才会被称为有福。”希伯来文前后两次使用同一词根，前者为主动式，后者为被动式，均有“称为有福”的意思。
    reason: lexical_alternative
  - marker: b
    text: 斯威特本的希腊文在本节与此差异很大：“从火星会增添一堆炭火；犯罪的人埋伏着要流人的血。”这表明本节的希伯来文与希腊文见证之间存在重大的文本分歧。
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 在……以前
  rationale: 表示某事发生之前的时间关系；这一表达符合现代汉语习惯。
- source_word: תַּחְקֹר
  choice: 考察
  rationale: חקר 表示查究、探察或检验；“考察”既保留审慎评估一个人的含义，也适合智慧文学语境。
- source_word: אָדָם
  choice: 一个人／人
  rationale: 此处指受评断的单个个体，同时具有泛指意义；现代汉语用“人”自然涵盖这一含义，无须译成特指男性的“男人”。
- source_word: אַל תְּאַשְּׁרֵהוּ
  choice: 不要称他为有福
  rationale: אשר 的强意词干在此意为宣称某人有福或幸福；“称他为有福”保留了评断性质，并与后半句的被动形式相呼应。
- source_word: כִּי
  choice: 因为
  rationale: 引出前面禁令的理由。
- source_word: בְּאַחֲרִיתוֹ
  choice: 到结局
  rationale: אַחֲרִית 可指终局、末后或最终结果；“到结局”在汉语中自然，并保留须视最终结果而定的智慧文学张力。
- source_word: יְאֻשַּׁר
  choice: 才会被称为有福
  rationale: 这是 אשר 的被动形式；译文保留“称为有福”的重复以及主动、被动的对应。“才”明确表达前后句所形成的时间限制。
theological_decisions:
- issue: 智慧格言中 אָדָם 的泛指范围
  choice: 一个人／人
  alternative: 一个男人
  rationale: 希伯来语单数 אָדָם 在这里泛指接受考察和评断的个人，并未强调生理性别。现代汉语的“人”最准确自然，也没有消除原文的个体性。
- issue: “有福”应按现状还是最终结局判断
  choice: 保留“要到结局才会被称为有福”的终局性表达
  alternative: 按当前境况称人为幸福
  rationale: 原文把是否可称为有福系于 בְּאַחֲרִיתוֹ（他的终局／结局），译文不把这种张力具体限定为死亡、审判或今生结果，以免加入原文未明说的神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“考察”比“调查”更适合对人格与人生结果的审慎评估；“称……为有福”保留希伯来文的关键词重复。分号呈现禁令与理由之间紧密、对称的格言结构。
