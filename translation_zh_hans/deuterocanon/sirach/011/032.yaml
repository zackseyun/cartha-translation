revisions:
- from: 在考察一个人[a]以前，不要称他为有福；因为人要到结局才会被称为有福。[b]
  to: 在考察一个人[a]之前，不要称他为有福[b]；因为一个人到了结局时，才会被称为有福。
  rationale: 修订仅改善现代汉语的语序和脚注对主动／被动重复的呈现，不改变经文的时间性与终局性张力。“结局”仍可指最终结果或终局，不被解释为任何特定神学事件。将文本异文脚注锚定在首次“有福”之后，便于读者在该关键词处注意到全节的希伯来文—希腊文分歧。
