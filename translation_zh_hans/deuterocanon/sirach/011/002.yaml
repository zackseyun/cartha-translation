  yaml_path: translation/deuterocanon/sirach/011/002.yaml
  text: Do not praise a man for his appearance[a], and do not despise a man who is ugly in his looks.
translation:
  language: zh_hans
  text: 不要因人的外貌而称赞他，也不要因一个人长得丑陋而厌弃他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作：“不要因一个人的美貌而称赞他，也不要因一个人的外表而厌弃他。”希伯来语第一句的“外貌”含义较广，希腊语则具体作“美貌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהַלֵּלו
  choice: 不要……称赞
  rationale: 希伯来语 הלל 的加强语干在此意为“称赞、赞美”；“称赞”自然、准确，也与希腊语 αἰνέσῃς 相符。
- source_word: אָדָם
  choice: 人／一个人
  rationale: 此处指个体的人，并非抽象的“人类”。现代汉语无需用带性别色彩的“男人”，即可准确表达希伯来语的泛指单数。
- source_word: בְּתָאֳרוֹ
  choice: 因人的外貌
  rationale: תֹּאַר 指外在形貌或容貌，范围比希腊语 κάλλος“美貌”更广；译作“外貌”保留希伯来文本的宽泛含义。介词 בְּ 在语境中自然表达评判所依据的方面，故译作“因”。
- source_word: וְאַל תְּתַעֵב
  choice: 也不要……厌弃
  rationale: תעב 表示强烈嫌恶、排斥；“厌弃”既保留力度，又适合庄重而通俗的现代汉语。
- source_word: מְכוֹעָר
  choice: 长得丑陋
  rationale: 该词意为丑陋、不美观。“长得丑陋”明确指外表，又不将含义过度具体化为身体畸形。
- source_word: בְּמַרְאֵהוּ
  choice: 因……长得
  rationale: מַרְאֶה 指可见的样貌。汉语以“因一个人长得丑陋”自然整合形容词和外貌限定，避免生硬重复“外貌”，同时保留判断基于可见样貌的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的劝诫语体。“称赞”与“厌弃”形成清楚对照；第二句用“长得丑陋”表达自然，同时忠实保留原文对外在样貌的关注。脚注标记置于整节末尾，对应希伯来语与希腊语在第一句上的词义差异。
