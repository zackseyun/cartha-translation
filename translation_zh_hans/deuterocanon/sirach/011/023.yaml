  text: Do not say, "What do I need, and what good things will be mine from now on?"[a]
translation:
  language: zh_hans
  text: 不要说：“我还需要什么？从今以后，什么好事会归我呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文在这里与主文所据的希腊文读法差异很大，大意是：“他不知道将会发生什么，就把它留给别人而死了。”希腊文则是主文所译的劝诫。由于此处希伯来文可能有错位、讹误，或反映不同的文本传统，主文采用与上下文连贯的希腊文读法。
    reason: textual_variant
lexical_decisions:
- source_word: לֹא יָדַע / μὴ εἴπῃς
  choice: 不要说
  rationale: 现存希伯来文作“他不知道”，但其整句与本节希腊文及上下文明显不合。主文采用希腊文 μὴ εἴπῃς 的劝诫语气，译作自然而直接的“不要说”；希伯来文异文则在脚注中完整说明。
- source_word: Τίς ἐστίν μου χρεία
  choice: 我还需要什么
  rationale: χρεία 表示“需要、必需之物”。“我还需要什么”既符合现代汉语，也保留说话者自以为已经一无所缺的反问意味。
- source_word: τίνα ... ἔσται μου τὰ ἀγαθά
  choice: 我会得到什么好处
  rationale: τὰ ἀγαθά 可指好东西、益处或福分；“好处”保留较宽泛的含义，不把所指限定为财物，也避免加入过强的宗教色彩。
- source_word: ἀπὸ τοῦ νῦν
  choice: 从今以后
  rationale: 直接表达由当前时刻延伸到未来的时间意义，庄重而符合现代汉语习惯。
theological_decisions:
- issue: 希伯来文与希腊文严重分歧时主文所采用的读法
  choice: 主文采用希腊文的劝诫：“不要说……”
  alternative: 按现存希伯来文可译为：“他不知道以后会发生什么，便把它留给别人，自己死了。”或近似表达。
  rationale: 《便西拉智训》有存世希伯来文时通常应优先依据希伯来文，但此处希伯来文本身与对应经节和上下文明显错位，可能存在讹误、移位或不同文本行。希腊文读法语意连贯，并符合邻近段落的劝诫形式。因此主文采用希腊文，同时用脚注公开保存希伯来文证据及其不确定性，不把分歧悄然消除。
translation_notes:
  register: 采用现代、清楚而庄重的劝诫语体。“我还需要什么”保留自满式反问；“好处”刻意保持宽泛，可涵盖财物、利益和顺境，而不将含义限定为某一种神学概念。
