  rationale: 修订只改善汉语自然度并避免不必要的具体化：以“不让……进你家”表达从家中排除，以“埋伏着的人”保留分词意象和原文的含蓄性。希腊文平行文本继续仅在脚注中说明，保留其与希伯来文本不同的警告形式。
