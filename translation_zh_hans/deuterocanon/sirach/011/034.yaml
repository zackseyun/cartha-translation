base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/034.yaml
  text: Keep many out of your house[a], and do not bring every man into your home, for many lie in wait[b], and many are deceivers.
translation:
  language: zh_hans
  text: 不要让许多人进你家[a]，也不要把每个人都带进家里；因为埋伏着的人很多，骗子也很多[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句正文以希伯来文见证为主。希腊文平行文本则大意为：“让一个外人住进来，他就会使你陷入纷乱，并使你失去自己所有的东西。”这可能反映了另一种文本形态，或是对警告的扩充。
    reason: alternative_reading
  - marker: b
    text: 所据版本把本节希伯来文的首句和末句置于方括号内，表明现存手稿传统在这些文字上带有补拟或不确定性。
    reason: textual_variant
lexical_decisions:
- source_word: מְנַע רַבִּים מִתּוֹךְ בֵּיתֶךָ
  choice: 要把许多人挡在你家门外
  rationale: מְנַע 是命令语气，表示阻止或不让进入；结合“从你家中”的空间表达，译为“挡在你家门外”自然地传达拒绝其进入家中的意思。
- source_word: וְלֹא כָל אִישׁ לְהָבִיא אֶל בַּיִת
  choice: 不要随便把什么人都带进家里
  rationale: 原文直译近于“不要把每一个人带进家里”，实际警告的是不加分辨地接纳人。“不要随便把什么人都……”符合现代汉语习惯，同时保留劝诫的普遍范围。
- source_word: אוֹרְבִים
  choice: 埋伏害人的
  rationale: 该分词指潜伏等候、意图加害的人；“埋伏害人的”既保留埋伏的意象，也使其恶意在汉语中清楚可懂。
- source_word: נוֹכְלִים
  choice: 骗子
  rationale: 该词指行事诡诈、欺骗他人的人。“骗子”是现代汉语中简洁自然的对应，不把欺诈限定为某一种具体形式。
- source_word: וְכֵן
  choice: 也
  rationale: 此连接语把“骗子很多”与前面的“埋伏害人的很多”并列；汉语用“也”即可自然表达“同样、照样”的关系。
- source_word: רַבִּים
  choice: 许多人／很多
  rationale: 首句作名词性对象时译为“许多人”，后两处说明某类人数量众多时译为“很多”，保持语义一致而顺应汉语句法。
