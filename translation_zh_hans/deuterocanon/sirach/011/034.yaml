translation_notes:
  register: 采用现代、庄重而易懂的智慧文学劝诫语气。“挡在你家门外”具体有力；“不要随便把什么人都……”避免生硬直译，同时没有把警告绝对化为拒绝一切接待。分号呈现命令与理由之间的关系。
