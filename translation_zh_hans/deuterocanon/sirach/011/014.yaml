base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/014.yaml
  text: There is one who is poor and perishing as he walks[a], lacking everything, yet more than a poor man.
translation:
  language: zh_hans
  text: 善与恶、生命与死亡、贫穷与富足，都出于主。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存主要希伯来文见证在此写作：“有一个人穷困，行走中衰败；一无所有，却比穷人更甚。”这段文字与本节编号及希腊文不相合，且资料标注为轻微错配。因此，本译文采用较稳定的希腊文平行文本；该文本作：“善与恶、生命与死亡、贫穷与富足，都出于主。”
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαθὰ καὶ κακά
  choice: 善与恶
  rationale: 两个中性复数名词构成鲜明对举，可兼指善恶之事或有利与不利的境遇；译作“善与恶”保留原文的宽度及其神学张力，不擅自缩窄为“福与祸”。
- source_word: ζωὴ καὶ θάνατος
  choice: 生命与死亡
  rationale: 直接保留希腊文固定对举；“生命”比单用“生”更符合现代汉语庄重散文。
- source_word: πτωχεία καὶ πλοῦτος
  choice: 贫穷与富足
  rationale: 准确表达经济处境的对比；“富足”自然庄重，也不把 πλοῦτος 限定为大量钱财。
- source_word: παρὰ Κυρίου ἐστίν
  choice: 都出于主
  rationale: παρά 与属格在此表示来源；补出“都”统摄前三组并列项，使汉语清楚流畅，而不扩张原文所陈述的因果方式。
- source_word: Κυρίου
  choice: 主
  rationale: 按希腊文通常译为“主”，适合此处次经语境。
theological_decisions:
- issue: 有利与不利之事都被说成出于主
  choice: 保留“善与恶……都出于主”的直陈
  alternative: 将 κακά 解释性地译为“灾祸”或“逆境”，以避免涉及道德之恶
  rationale: 希腊文明确将 ἀγαθὰ 与 κακά 对举，并把各组事物归为出于主。译文不替原文消解这项神学张力，也不进一步断言神如何与道德之恶相关。
translation_notes:
  register: 采用现代、简洁而庄重的箴言体。三组对偶保持整齐节奏；“都”明确共同谓语的涵盖范围。脚注公开交代希伯来见证与本节希腊文本不一致的情况。
