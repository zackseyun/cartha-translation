base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/027.yaml
  text: The blessing of God is the lot of the righteous[b][a], and in the time of his hope it will blossom.
translation:
  language: zh_hans
  text: 上帝的赐福是义人的分[a]；到了他所盼望的时候，这赐福必开花[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作：“上帝的赐福是义人的分；到了他所盼望的时候，它必开花。”希腊文平行文本则很不相同：“患难的时刻使人忘记享乐；人在终结时，他的作为就显露出来。”这表明本节存在不同的文本传统。
    reason: textual_variant
  - marker: b
    text: 也可译作：“他的盼望必开花。”希伯来语动词所指的既可能是“赐福”，也可能是“盼望”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת אֵל
  choice: 上帝的赐福
  rationale: 构造链直译为“上帝的福”；用“赐福”更自然地表达来自上帝的福分，同时不增添原文没有的特殊神名。
- source_word: גּוֹרָל
  choice: 分
  rationale: 该词指抽签所得之分或获派的份额。“分”保留所得份额的意象；“命运”容易过度诠释，“产业”则不如原词直接。
- source_word: צַדִּיק
  choice: 义人
  rationale: 形容词名词化，泛指为义的人；“义人”是简洁、庄重而通行的智慧文学用语。
- source_word: וּבְעֵת תִּקְוָתוֹ
  choice: 到了他所盼望的时候
  rationale: 把时间短语译成自然现代汉语，并保留阳性单数后缀所指的代表性个体；תקוה在此仍可理解为盼望或所盼之事。
- source_word: תִּפְרָח
  choice: 必开花
  rationale: פרח意为发芽、开花；“开花”保留原文鲜明的植物意象。补明“这赐福”作主语，以便中文清楚，但以脚注保留也可能以“盼望”为所指的歧义。
theological_decisions:
- issue: 阴性单数动词 תִּפְרָח 的所指
  choice: 正文以“这赐福必开花”理解为回指“上帝的赐福”。
  alternative: 也可译作“他的盼望必开花”。
  rationale: “赐福”和带后缀的“盼望”在希伯来语中都可能成为阴性单数动词的先行词。语序和全句意象容许两种理解，故正文择一而脚注保留另一种，不消除原文张力。
- issue: 希伯来文本与希腊平行文本显著不同
  choice: 以给定的高可信度希伯来文本为正文依据。
  alternative: 希腊文作：“患难的时刻使人忘记享乐；人在终结时，他的作为就显露出来。”
  rationale: 希腊平行文本显然反映不同的文本传统，不能无声地混入希伯来正文；其重要差异应在脚注中说明。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“义人”沿用汉语圣经与智慧文学中通行的道德类别用语；“分”简洁保留 גורל 所表达的获派份额。“这赐福”在中文中明确主语，同时以脚注保存希伯来文真正的指代歧义。
