  text: Before death, do not call a man blessed, for in his end a man is made known.
translation:
  language: zh_hans
  text: 人死以前，不要称他有福[b]；因为要到最后，他才显明出来[c]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本差异很大：“要提防作恶的人，因为他图谋恶事，免得他使你永远蒙受污点。”这很可能反映了另一种文本形态；正文以希伯来文为主要依据。
    reason: alternative_reading
  - marker: b
    text: “称他有福”也可译作“说他幸福”或“称他幸运”。
    reason: lexical_alternative
  - marker: c
    text: “他才显明出来”也可译作“他才被认清”或“一个人的为人才显露出来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי מָוֶת
  choice: 一个人死以前
  rationale: 直译其时间意义，同时用现代汉语自然表达“不可在死亡之前作最终判断”。
- source_word: אַל תְּאַשֶּׁר גָּבֶר
  choice: 不要称他有福
  rationale: תְּאַשֶּׁר 在此表示宣称或判定某人有福；“称他有福”保留智慧文学中的评断意味。גָּבֶר 由前置的“一个人”承接，避免汉语重复生硬。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出禁令的理由，符合现代汉语箴言式表达。
- source_word: בְּאַחֲרִיתוֹ
  choice: 到了他的结局
  rationale: אַחֲרִית 可指末了、人生终局或最终结果；“结局”保留时间与结果两方面的含义，不把它限缩为临终一刻。
- source_word: יִנָּכֵר אִישׁ
  choice: 一个人才显明
  rationale: יִנָּכֵר 可指被认出、被认识或变得明显；“才显明”保留被动／结果性的意味，也不明确补入原文未说出的“品格”或“真面目”。
theological_decisions:
- issue: 希伯来语智慧文学中的阳性单数泛指
  choice: 译作“一个人”
  alternative: 译作“一个男人”或“任何人”
  rationale: גָּבֶר 与 אִישׁ 均为阳性单数，但此处箴言显然具有普遍适用性。现代汉语“人”本身不标性别，既未扩大为复数，也避免“男人”造成只限男性的误读。
- issue: 末句所指的是人生终点、最终结果，还是届时显出的真实状况
  choice: “到了他的结局，一个人才显明”
  alternative: “到生命终了时，才认得出一个人”或“从一个人的结局才可看清他”
  rationale: 原文语义简练，并未说明究竟显明的是品格、福分还是最终状况；译文保留这种开放性，不作神学性补充。
- issue: 希腊平行文本与希伯来文本显著不同
  choice: 正文依从现存希伯来文本，并以脚注保存希腊异文
  alternative: 采用希腊文“要提防作恶的人……”
  rationale: 本节有高可信度的希伯来文本，项目原则以希伯来文为主要见证；希腊文很可能代表另一文本形态，故不应静默合并或取代。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语，保留原文的箴言节奏。分号呈现禁令与理由之间的关系；“结局”和“显明”刻意保留希伯来文对人生终点及最终评价的语义张力。
