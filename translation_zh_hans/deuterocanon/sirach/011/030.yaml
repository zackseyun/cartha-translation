base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/030.yaml
  text: A good day makes one forget trouble[a], and a bad day makes one forget prosperity; and a man's end will be set before him.
translation:
  language: zh_hans
  text: 顺境的日子使人忘记患难，逆境的日子使人忘记福乐；人的结局必临到他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“人的结局必在他身上”。这句话也可理解为人的最终结局会落到他身上或追上他。此处希腊文本与现存希伯来文本差异很大，不能帮助确定本句的确切含义。
    reason: 原文末句含义含混，且希腊平行文本存在重大异文。
lexical_decisions:
- source_word: טוֹב יוֹם
  choice: 顺境的日子
  rationale: 原文直译为“好日子”，此处与“坏日子”对举，指处境顺遂、生活安好的时期；“顺境的日子”在现代汉语中自然，并保留境遇层面的含义。
- source_word: תִּשָּכַח רָעָה
  choice: 使人忘记患难
  rationale: 动词形式表达“被忘记”的意思；汉语用使动结构更自然。רָעָה在此指灾祸、困苦，而非道德意义上的邪恶，故译“患难”。
- source_word: וְרָע יוֹם
  choice: 逆境的日子
  rationale: 与前句构成鲜明对偶，所指是处境不利的时期，而非日子本身具有道德上的邪恶；“逆境的日子”庄重且易懂。
- source_word: תִּשָׁכַח טוֹבָה
  choice: 使人忘记福乐
  rationale: טוֹבָה指人所经历的福分、安好或顺遂。“福乐”既包含福祉，也保留体验层面的善境，与“患难”相对。
- source_word: וְאַחֲרִית אָדָם
  choice: 人的结局
  rationale: אַחֲרִית可指末后、终局或最终结果；אָדָם为泛指的人。译作“人的结局”简洁自然，不把泛指限定为男性。
- source_word: תִּהְיֶה עָלָיו
  choice: 必临到他
  rationale: 字面为“必在他身上／必归到他身上”。“临到他”保留结局来到并落在本人身上的动态感，同时不把含混的介词短语过度解释为审判、揭示或陈列。
theological_decisions:
- issue: אָדָם的泛指范围
  choice: 人的结局
  alternative: 一个男人的结局
  rationale: 这里的אָדָם是代表全人类的泛称，并非专指男性；现代汉语“人”准确而自然。
- issue: 末句是否明确指审判或报应
  choice: 人的结局必临到他
  alternative: 人的结局必摆在他面前
  rationale: 希伯来文只说结局“在／临到他身上”，没有明确说明是末日审判、今生报应或结局被展示。译文避免加入原文未明说的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。前两分句以“顺境／逆境”和“患难／福乐”形成整齐对偶；末句保持希伯来文的凝练与开放性，并以脚注说明字面表达及文本差异。
