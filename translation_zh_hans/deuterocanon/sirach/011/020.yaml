  text: Stand by your covenant and attend to it, and grow old in your work.[a]
translation:
  language: zh_hans
  text: 义人的馈赠必为敬畏他的人存留；他的心愿必永远成就。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本为：“要坚守你的约，专心于此，并在你的工作中终老。”希伯来文本与希腊文本在本节有重大差异。
    reason: alternative_reading
lexical_decisions:
- source_word: מַתַּן צַדִּיק
  choice: 义人的馈赠
  rationale: מַתַּן意为“赠礼、馈赠”，צַדִּיק既可作定语“义人的”，也可理解为“义者的”；译文按希伯来文本的自然属格关系处理，不采用希腊异文的“盟约”一词。
- source_word: יַעֲמֹד
  choice: 必……存留
  rationale: 该动词本义为“站立”，在赠礼这一主语下表达持续、保持有效；“存留”比直译“站立”更符合现代汉语，同时保留持久之意。
- source_word: לִירֵאָיו
  choice: 为敬畏他的人
  rationale: 介词ל可表示对象或受益者；后缀“他”在语法上可回指“义人”，但语境中也可能引人联想到对上帝的敬畏，故不替换为明确名词，以保留原文张力。
- source_word: וּרְצוֹנוֹ
  choice: 他的心愿
  rationale: רָצוֹן可指意愿、心愿、喜悦或恩 favor；此处选择“心愿”，与后面的“成就”搭配自然，也避免把含义限定为施予他人的恩惠。
- source_word: יִצְלַח לָעַד
  choice: 必永远成就
  rationale: צלח可表示成功、顺利、兴旺；以心愿为主语时，“成就”是自然且庄重的汉语表达，לָעַד译为“永远”。
theological_decisions:
- issue: 希伯来文本与希腊文本存在重大差异
  choice: 正文依照现存且置信度高的希伯来见证翻译
  alternative: 希腊文本作：“要坚守你的约，专心于此，并在你的工作中终老。”
  rationale: 所给希伯来文本完整、验证结果为一致，且任务要求首先依据原文证据。希腊文并非可逐词对应的译法，而是实质不同的异文，因此收入脚注，不以其取代希伯来正文。
- issue: 两个第三人称单数后缀所指为何
  choice: 保留为“他／他的”，不在正文中明确改成“义人”或“上帝”
  alternative: 明确译作“敬畏义人的人／义人的心愿”，或按宗教语境理解为指向上帝
  rationale: 希伯来语法允许自然回指前面的“义人”，但表达在智慧文学语境中仍可能产生神学联想；保留代词可避免无根据地消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“馈赠”“存留”“成就”兼顾原文意象与汉语自然度；正文保留代词指向及רצון语义上的一定开放性。
