  text: My son[a], do not answer a matter before you hear it, and do not speak in the midst of conversation.
translation:
  language: zh_hans
  text: 我儿[a]，事情还没听完，不要作答；交谈之中，不要插话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“不要为与你无关的事争辩，也不要与罪人一同坐席审判。”现存希伯来文本与希腊文本在这里差异很大；正文采用现存希伯来见证，脚注则保留希腊文所代表的另一文本传统。
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留希伯来文阳性单数呼语，以及父亲或师长劝诫儿子、门生的智慧文学语气。
- source_word: אַל תָּשִׁיב דָּבָר
  choice: 一件事……不要作答
  rationale: השיב意为回答、作答；דבר在此可指话语、事情或问题。译作“一件事……不要作答”既保留其语义范围，也符合本节告诫人不可贸然回应的语境。
- source_word: טֶרֶם תִּשְׁמָע
  choice: 还没有听明白
  rationale: טֶרֶם表示“尚未、在……以前”，שמע本义为“听”。汉语“听明白”自然地表达先完整听取、理解之后再回答，但不额外规定所听内容的性质。
- source_word: וּבְתוֹךְ שִׂיחָה
  choice: 交谈之中
  rationale: שיחה可指谈话、言谈或交谈。译文不增补“别人说话时”，以免把原文未明说的对象具体化。
- source_word: אַל תְּדַבֵּר
  choice: 不要插话
  rationale: דבר本义为“说话”；结合“交谈之中”的位置表达，现代汉语用“不要插话”更自然地传达不可在谈话进行时贸然开口的劝诫。
- source_word: περὶ πράγματος οὗ οὐκ ἔστιν σοι χρεία μὴ ἔριζε
  choice: 未用于正文
  rationale: 希腊文本与现存希伯来文本差异显著；既有可信的希伯来见证，正文据希伯来文翻译，希腊异文收入脚注。
- source_word: καὶ ἐν κρίσει ἁμαρτωλῶν μὴ σύνεδρευε
  choice: 未用于正文
  rationale: 此分句与希伯来文后半句并不对应，反映另一文本传统，因此不并入正文，以脚注保存。
