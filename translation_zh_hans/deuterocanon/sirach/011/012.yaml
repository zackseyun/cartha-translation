base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/012.yaml
  text: My son[a], if you do not run, you will not attain; and if you do not seek, you will not find.
translation:
  language: zh_hans
  text: 我儿[a]，你若不奔跑，便不能到达；你若不寻求，便不能找到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本在这里有显著不同，大意是：有一人懒惰，需要扶助，力量不足，且陷于贫困；主的眼目眷顾他，使他得福，并把他从卑微中扶起。因此，正文采用希伯来文本；这一重要的希腊异文传统在此说明。
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 这是带第一人称单数后缀的阳性单数呼语，保留智慧文学中父辈对儿子的教诲语气。
- source_word: תָּרוּץ
  choice: 奔跑
  rationale: רוץ的本义是“跑”；译作“奔跑”保留具体而有力的箴言意象，不先行解释为“努力”或“奋争”。
- source_word: תַגִּיעַ
  choice: 达到
  rationale: 此处表示到达或达成某个未明说的目标；“达到”既可承接奔跑的空间意象，也保留抽象的成就含义。
- source_word: תְּבַקֵּשׁ
  choice: 寻求
  rationale: בקש常指寻找、寻求；“寻求”保留其具体与引申义，并与下句“找到”形成对应。
- source_word: תִמְצָא
  choice: 找到
  rationale: מצא的通常含义是“找到”；与“寻求”构成忠实于希伯来文的平行表达。
theological_decisions:
- issue: 智慧教诲中的性别化称呼
  choice: 我儿
  alternative: 我的孩子
  rationale: 希伯来文明说阳性单数的亲子称呼；正文保留其父对子式的教诲语气，不将其泛化为中性称呼。
- issue: 希伯来文本与显著不同的希腊见证
  choice: 正文直接翻译现存希伯来箴言，并在脚注说明希腊文本的差异
  alternative: 按希腊文本翻译软弱贫穷者蒙主眷顾、从卑微中被扶起的内容
  rationale: 本节有可用且置信度高的希伯来见证，故以其为正文依据；希腊见证内容显著不同，应作为重要异文传统如实保留，而不与希伯来文混合。
- issue: 奔跑与达到之间未明说的目标
  choice: 保留“达到”的不及物式开放含义
  alternative: 补出“达到目标”或解释为“成功”
  rationale: 希伯来文没有明说所达到的对象；不补入“目标”或“成功”，可保留原文的简练及含义张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。两句均以“你若不……，就不能……”构成整齐平行；保留“奔跑—达到”和“寻求—找到”的具体意象与节奏。
