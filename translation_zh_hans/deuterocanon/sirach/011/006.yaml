  text: Many who were oppressed sat on a throne[b][a], and one not thought of put on a turban.
translation:
  language: zh_hans
  text: 许多受压迫的人坐上了宝座[b]；那些未曾被人想到的人，也戴上了头巾[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“裹上了头巾”。头巾在这里可能是尊荣或高位的具体象征；也可按意思译为“意想不到的人得了尊荣”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文平行文本的措辞不同：“许多权贵大受羞辱，显赫的人被交在同伴手中。”两种文本都表达身份和地位的逆转。
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים נִדְכָּאִים
  choice: 许多受压迫的人
  rationale: נִדְכָּאִים含有“被压碎、受压制”的被动意味；译为“受压迫的人”既保留被动状态，也符合本节身份逆转的语境。
- source_word: יָשְׁבוּ עַל כִּסֵּא
  choice: 坐上了王位
  rationale: כִּסֵּא本义为座位，也常指宝座或统治地位；结合上下文的骤然升迁，现代汉语用“坐上了王位”自然地表达取得高位。
- source_word: וּבַל עָלוּ עַל לֵב
  choice: 从未被人想到的人
  rationale: 字面意为“没有上到心里”；这是“未曾想到、未被考虑”的习语。希伯来语动词为复数，中文“人”可作集合表达，不强行限定为单数。
- source_word: עָטוּ צְנִיף
  choice: 戴上了尊贵的头巾
  rationale: עָטוּ表示裹上或穿戴，צְנִיף是缠裹式头巾，并可象征尊荣或职位。“头巾”保留具体意象，加“尊贵的”帮助现代读者理解其地位象征，且由脚注说明。
theological_decisions:
- issue: 希伯来文本与希腊平行文本措辞不同
  choice: 以高可信度的希伯来文本为正文，呈现受压者登位和意外之人获得尊荣的双重升迁意象。
  alternative: 依希腊文译为“许多权贵大受羞辱，显赫的人被交在别人手中”。
  rationale: 现存希伯来文本在本节完整且可信，应作为正文依据；希腊文虽描述的是权贵降卑而非卑微者升高，但二者共同见证身份逆转这一主题。脚注保留异文，不将两种见证混合成一个正文。
- issue: צְנִיף的象征意义
  choice: 正文保留“头巾”的具体形象，并以“尊贵的”点明语境功能。
  alternative: 抽象译作“得了尊荣”或“身居高位”。
  rationale: 保留原文物象可避免抹平诗性表达；有限的语境性修饰使普通现代读者不致把它只理解为日常服饰。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“坐上了王位”比“坐在座位上”更准确地传达掌权或升至高位；分号保持两行智慧格言的平衡。正文保留希伯来文的具体意象，同时用脚注交代较为抽象的惯用理解和希腊异文。
