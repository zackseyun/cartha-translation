  text: And the eye of the Lord looked on him for good[c][b][a], and shook him out of the dust of filth.
translation:
  language: zh_hans
  text: 主的眼目以恩惠看顾他[a]；又把他从污秽的尘土中抖落出来[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“主的眼目为他的益处留意他”；希伯来文把神的察看与有益的旨意结合在一起。
    reason: lexical_alternative
  - marker: b
    text: “污秽的尘土”也可理解为“恶臭的尘土”或“腐臭的尘土”；希伯来文的意象鲜明，但具体含义并不完全确定。
    reason: alternative_reading
  - marker: c
    text: 希腊文此节差异很大：“主拔除列国的根，栽种谦卑的人取代他们。”希伯来文与希腊文似乎反映了显著不同的文本形态。
    reason: textual_variant
lexical_decisions:
- source_word: וְעֵין יי
  choice: 主的眼目
  rationale: 保留希伯来文单数“眼”的具体意象，同时按敬称缩写 יי 译作“主”；中文以“眼目”表达神的察看，庄重而自然。
- source_word: צָפַתְהוּ
  choice: 眷顾他
  rationale: 该动词表示察看、留意或看顾；与 לְטוֹב 连用时，“眷顾”既包含注视，也保留有利于他的含义。
- source_word: לְטוֹב
  choice: 使他得福
  rationale: 直译为“为着好处／福祉”。此处用结果取向的自然中文表达有益的旨意，但脚注保留“以恩惠看顾”的另一理解。
- source_word: וַיְנַעֲרֵהוּ
  choice: 把他……抖落出来
  rationale: נער 在此有摇动、抖出之意；译文保留这一强烈而略显突兀的图像，不平滑处理为“提拔”或“举起”。
- source_word: מֵעֲפַר
  choice: 从……尘土中
  rationale: 直接表达从尘土这一卑微处境中出来的空间意象。
- source_word: צַחֲנָה
  choice: 污秽的
  rationale: 该词可指恶臭、污秽或腐臭状态；“污秽的尘土”保留具体图像而不武断限定为粪堆，其他语义列入脚注。
theological_decisions:
- issue: 神名敬称缩写 יי 的译法
  choice: 主
  alternative: 耶和华
  rationale: 底本使用敬称缩写而非完整拼写；译作“主”符合该见证的诵读传统，也避免在此处反向补出底本未明写的形式。
- issue: 神的察看与施恩之间的关系
  choice: 眷顾他，使他得福
  alternative: 以恩惠看顾他
  rationale: 希伯来文“察看他，为着好处”兼有注视和有益旨意；正文采用自然中文，但不将其限定为单纯观察或特定救赎教义。
- issue: 从卑微处境中被移出的动作
  choice: 抖落出来
  alternative: 提拔出来
  rationale: 保留 נער 的摇抖意象及文本张力，不以较顺畅但解释性更强的“提拔”消解原文图像。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“主的眼目”保留希伯来语的具体表达；“抖落出来”刻意保存原文强烈的动作意象。脚注标记按其对应短语就近排列。
