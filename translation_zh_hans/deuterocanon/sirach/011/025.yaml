  text: Do not be astonished at evildoers[a]; run to the Lord and wait for his light.
translation:
  language: zh_hans
  text: 不要对作恶的人感到惊讶[a]；要奔向耶和华，等候他的光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“在好事的日子，人会忘记坏事；在坏事的日子，人不会记得好事。”此处希腊文见证与现存希伯来文有显著差异。
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְמַה
  choice: 不要……惊讶
  rationale: 该动词表示惊奇、诧异或因意外而愕然；“不要……惊讶”保留劝诫语气，不额外解释为惧怕或困惑。
- source_word: בְּעוֹשֵׂי רָע
  choice: 因作恶的人
  rationale: 字面为“作恶者”；现代汉语用“作恶的人”自然清楚，介词“因”可表达希伯来语 בְּ 在此所指的触发缘由，同时不把人物抽象化。
- source_word: תָּרוּץ
  choice: 要奔向
  rationale: 原词的具体含义是“跑”；“奔向”既保留动作的鲜明和急迫，也与后面的目标“耶和华”自然搭配。
- source_word: לַיי
  choice: 耶和华
  rationale: יי 是对神名的敬称式写法；中文以“耶和华”明确反映专名，避免把它泛化为普通称号“主”。
- source_word: וְקַוֵּה
  choice: 等候
  rationale: 该词兼有等候与盼望的含义；“等候”适合与命令句相连，并让期待、信靠的意味由语境保留。
- source_word: לְאוֹרוֹ
  choice: 他的光
  rationale: 按希伯来文直译为“他的光”，保留其可能指神的恩惠、引导或拯救的开放意象，不将其收窄为某一种解释。
theological_decisions:
- issue: 敬称式拼写 יי 所代表的神名
  choice: 耶和华
  alternative: 主；上主
  rationale: 源文指向以色列之神的专名。中文正文采用通行且明确的“耶和华”，可保留专名性质；“主”较顺口，但会弱化源文的专名信息。
- issue: 现存希伯来文与希腊文见证的关系
  choice: 正文依据现存希伯来文，脚注完整提示希腊文的重大异文
  alternative: 仅按希腊文翻译；将两种见证调和为一句
  rationale: 此处希腊文并非小幅措辞差异，而是另一则格言。既然有可信的希伯来文见证，正文应据此翻译，同时以脚注保留希腊见证，避免忽略或强行调和文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“奔向”保留希伯来文命令的动感和紧迫性；分号呈现两个相连的劝告。脚注标记[a]已置于相关分句之后。
