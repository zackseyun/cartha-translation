base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/021.yaml
  text: There is one who grows rich through affliction[b][a], and this is the reward he deserves.
translation:
  language: zh_hans
  text: 有人因受苦而变得富足[a]，这就是他应得的报偿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受苦”也可译作“克己”“遭受困苦”或“劳苦”。希伯来语含义较宽；希腊语平行文本侧重劳作和贫穷。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来语含义不十分确定，直译近似“这将使他的报偿成为所当得的（或所应负的）”。也可理解为“这就是他的酬劳”。
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: 有人
  rationale: 这是存在句，用来引出智慧文学所观察的一类人；“有人”自然简洁。
- source_word: מִתְעַשּׁר
  choice: 富足
  rationale: 该词为表示过程的分词，意为变得富有；结合“因……而”，中文“富足”可自然表达这一结果。
- source_word: מֵהִתְעַנּוֹת
  choice: 因受苦
  rationale: 此词可涵盖遭受困苦、自我克制或劳苦；“受苦”保留其宽泛性，不武断限定苦难是否出于自愿。
- source_word: וְזֶה
  choice: 这就
  rationale: 指回前述因受苦而富足的情形；“就”使中文判断句衔接自然。
- source_word: יְחַיֵּב
  choice: 算作……应得的
  rationale: 该动词可表达使人负有责任、判定应得或归为当得；希伯来语此处措辞困难，译文以自然中文保留应得报偿的可能含义。
- source_word: שְׂכָרוֹ
  choice: 他的报偿
  rationale: שכר 可指工价、酬劳或报偿；“报偿”既保留智慧文学语体，也不把它狭义化为工资。
theological_decisions:
- issue: 财富、受苦与报偿之间的关系
  choice: 译作“这就算作他应得的报偿”
  alternative: “这就是他的酬劳”或“这使他有权得到报偿”
  rationale: 希伯来语末句高度压缩且语义不稳。所选译法表达可能的应得报偿之意，但用脚注明确原文困难，避免把它扩展成完整的功德或报应教义。
- issue: 受苦是否特指自我克制
  choice: 保留为宽泛的“受苦”
  alternative: “克己”“劳苦”
  rationale: 希伯来词可以涉及自我苦待，也可泛指困苦；希腊平行文本偏向劳作和贫穷。正文不强行消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“富足—受苦—报偿”保留智慧箴言的凝练结构；两处脚注分别说明词义范围和末句的文本难点。
