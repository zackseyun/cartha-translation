  text: If you desire it[a], my son, you will become wise; and if you set your heart on it[b], you will become shrewd.
translation:
  language: zh_hans
  text: 我儿，你若愿意，就会成为有智慧的人；你若用心[a]，就会变得精明[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用心”对应希伯来文“把你的心放在（这事）上”的习语，指专心留意并认真投入；“这事”由语境补足。希腊文作“若献上你的心灵”，并接着说“你就会变得机敏”。
    reason: cultural_note
  - marker: b
    text: “精明”在这里是褒义，指机敏、审慎而有判断力，并非诡诈。希腊文也可译作“机敏”或“善于应对”。希腊文前半句作：“孩子，你若愿意，就会受到教导。”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תַּחְפּוֹץ
  choice: 你若愿意
  rationale: חפץ在此表达意愿和渴望。现代汉语“愿意”自然地保留条件句中的主动意愿，也与希腊文ἐὰν θέλῃς相合；所愿之事由上下文中的求智慧补足，不必在正文中增添宾语。
- source_word: בְּנִי
  choice: 我儿
  rationale: 希伯来文明确为阳性单数呼语。“我儿”简洁庄重，并准确保留原文性别和师徒式智慧训诲的语气。
- source_word: תִּתְחַכָּם
  choice: 就会成为有智慧的人
  rationale: 该词源自חכם，hitpael形式在这里表示进入或发展到有智慧的状态。译文保留“成为”的过程意味；希腊文侧重“受教”，另在脚注说明。
- source_word: וְאִם תָּשִׂים לִבְּךָ
  choice: 你若用心
  rationale: 字面为“你若放置你的心”，即专心留意、投入心志。现代汉语“用心”自然凝练，既包含注意，也包含认真投入。
- source_word: תַּעֲרֹם
  choice: 就会变得精明
  rationale: ערם在智慧文学的正面语境中指实际判断上的机敏、审慎。“精明”保留其敏锐锋芒，同时脚注排除诡诈的负面理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的智慧训诲语体。“我儿”保留希伯来文阳性单数呼语；两个平行条件句保持简洁节奏。正文以高可信度希伯来文本为主，脚注交代希腊平行文本在“受教”和“献上心灵”方面的差异。
