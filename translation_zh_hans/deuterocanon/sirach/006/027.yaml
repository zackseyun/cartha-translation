  text: Search out and investigate; seek[a], and find. Hold fast to her, and do not let her go.
translation:
  language: zh_hans
  text: 要查究，要考察；要寻求并找到。要紧紧抓住她，不可放手。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּרֹש
  choice: 寻访
  rationale: דרש表示主动查寻、探求；译作“寻访”既保留追索意味，也与后面的“寻求”有所区别。
- source_word: וַחֲקֹר
  choice: 考察
  rationale: חקר指深入查究、考察。与“寻访”并列，表现持续而审慎的探索。
- source_word: בַּקֵּש
  choice: 寻求
  rationale: בקש通常表示寻找、寻求；此处保留为独立的追求动作，以呈现希伯来文动词叠加的修辞。
- source_word: וּמְצָא
  choice: 要寻见
  rationale: 希伯来文是祈使式序列，直译近于“并且找到”。“要寻见”保留命令语气，也使现代汉语表达自然；希腊文异读另见脚注。
- source_word: וְהֶחֱזַקְתָּהּ
  choice: 要紧紧持守她
  rationale: 该词带阴性宾语后缀，语境所指为拟人化的智慧。“紧紧持守”表达牢牢抓住、坚持不放的含义。
- source_word: וְאַל תַּרְפֶּהָ
  choice: 不可松手
  rationale: רפה在此指松开、放松抓握。“不可松手”自然保留与前句相连的抓持意象，宾语“她”可由上句承接。
theological_decisions:
- issue: 阴性宾语后缀的所指
  choice: 译为“她”，指向上下文中拟人化的智慧。
  alternative: 译为“它”，理解为教导或悟性。
  rationale: 本章上下文将智慧人格化，希伯来文阴性后缀也与此一致；保留“她”可维持原文的文学与神学张力。
- issue: 希伯来文与希腊文在“发现”分句上的差异
  choice: 正文依希伯来文祈使式，译为“要寻见”。
  alternative: 依希腊文译为“它就会向你显明”或“你就会认识她”。
  rationale: 现存希伯来文本可信度高，故正文以希伯来文为准；希腊文的实质差异则在脚注中保留，不将两种读法强行调和。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。连续使用“寻访、考察、寻求、寻见”，尽量保留原文层层推进的命令句；以“她”维持智慧人格化的意象。
