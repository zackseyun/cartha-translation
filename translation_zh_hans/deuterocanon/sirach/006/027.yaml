revisions:
- from: 要寻访，要考察；要寻求[a]，要寻见。要紧紧持守她，不可松手。
  to: 要查究，要考察；要寻求并找到。要紧紧抓住她，不可放手。
  rationale: 修订以希伯来文为正文依据，保留动词累进、祈使语气和智慧的阴性人格化。将不自然或语义偏移的“寻访／寻见”分别改为“查究／找到”，并使脚注准确、连贯地呈现希腊文平行文本的不同读法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:33:37Z'
review_pass:
