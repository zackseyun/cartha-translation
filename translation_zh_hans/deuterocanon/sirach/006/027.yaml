  source_fidelity: 正文正确以现存希伯来文为主：三个连续的探求／查究动词、随后“找到”的祈使序列，以及阴性宾语“她”和不放手的意象都应保留。草稿的“寻见”在现代普通话中不够自然，改为“找到”更符合原文命令式的协调结构。脚注保留希腊文“将为你所知／向你显明”的不同读法。
  naturalness: “寻访”通常偏指探访人或地点，不足以准确承载דרש的查究意味；“查究”更贴切。“要寻求，要寻见”重复使用“要”且“寻见”生硬。改后的并列祈使句庄重、清楚，也适合智慧文学的训诫语体。
  terminology: “她”应保留，以对应上下文中人格化的智慧及两个阴性宾语后缀。“紧紧抓住她，不可放手”既保留抓握隐喻，也比“紧紧持守她，不可松手”更自然；未增添任何教义性解释。
  issues:
