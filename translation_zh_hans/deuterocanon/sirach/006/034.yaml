  text: Be eager to hear every discourse[a], and do not let a proverb of understanding escape you.
translation:
  language: zh_hans
  text: 要乐意聆听各种言谈[a]；有悟性的箴言，不可错过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行经文作：“要站在众长者中间；若有人有智慧，就要亲近他。”现存希伯来文本节与希腊文差异很大；因本节有希伯来文存世，正文依希伯来文翻译。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל שִׂיחָה
  choice: 每一番谈论
  rationale: כָּל在此取逐一、广泛的分配义；שִׂיחָה可指言谈、谈论或交谈。“每一番谈论”保留范围宽广的意思，又适合智慧训诲的语境。
- source_word: חֲפוֹץ לִשְׁמֹעַ
  choice: 要切望聆听
  rationale: חפץ表达意愿、喜爱或渴望，结合不定式לִשְׁמֹעַ构成劝勉。“切望聆听”既传达主动求听的态度，也比单纯“听见”更能体现专心听取。
- source_word: וּמְשַׁל בִּינָה
  choice: 明智的箴言
  rationale: מָשָׁל在智慧文学中通常指箴言、格言；בִּינָה可表示聪明、悟性或洞察力。译作“明智的箴言”自然地表达这是一句富有悟性的箴言，同时不限定智慧属于说话者还是内容。
- source_word: אַל יֵצְאֶךָּ
  choice: 不要让它从你身边溜走
  rationale: 原文意象是某物离开或越过听者。“从你身边溜走”保留动态意象，并自然表达不要错过、漏掉或失去这箴言的劝告。
theological_decisions:
- issue: 现存希伯来文与希腊文平行经文存在重大差异
  choice: 正文依据现存且可信度高的希伯来文，译为切望聆听谈论、不要错过明智箴言的劝勉。
  alternative: 依据希腊文译为：“要站在众长老中间；若有人有智慧，就要亲近他。”
  rationale: 本节希伯来文完整可用，故按原文优先原则作为正文依据。希腊文虽同属寻求智慧教导的主题，却有不同的具体措辞，不宜混入正文以消解文本见证之间的真实差异；其异文以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“切望聆听”保持智慧训诲的劝勉语气；分号呈现两句并列命令。“溜走”略带具体意象，但仍属自然书面表达，可传达不要错失智慧言语之意。
