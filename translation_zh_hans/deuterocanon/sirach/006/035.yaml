- from: 要留意谁有悟性，并切切寻求他；让你的脚磨损他的门槛。[a][b]
  to: 要辨认谁有悟性[a]，并殷勤寻访他；让你的脚把他的门槛踏得磨损。[b]
  rationale: 修订不改变希伯来正文的含义，只使“看出／辨认”、殷勤寻访和反复踏临门槛的关系在现代汉语中更明确自然。希腊平行文本仍以脚注保留，并明确其与希伯来见证存在重大差异。
  reviewer_model: gpt-5.6-terra
