  text: See who has understanding[a], and seek him out[b]; and let your foot wear out his threshold.
translation:
  language: zh_hans
  text: 要辨认谁有悟性[a]，并殷勤寻访他；让你的脚把他的门槛踏得磨损。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“要渴望聆听一切属神的教诲，不可让有悟性的箴言从你身边溜走。”希伯来文与希腊文在这里差异很大，但两者都劝人热切追求智慧。
    reason: alternative_reading
  - marker: b
    text: “让你的脚把他的门槛踏得磨损”描绘经常登门拜访有智慧的人，向他学习。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: 要留意
  rationale: 这是命令式，在此不是单指视觉上的“看”，而是要辨认、留心察看；“要留意”在现代汉语中自然，并保留劝诫语气。
- source_word: מִי יָבִין
  choice: 谁有悟性
  rationale: 指具有理解力、辨识力的人。“有悟性”简洁自然，也与本节寻访智慧之人的语境相合。
- source_word: וְשַׁחֲרֵהוּ
  choice: 并切切寻求他
  rationale: שחר 在这里表达殷勤、迫切地寻找。“切切寻求”保留其积极而持续的力度，又不把可能的“清早寻求”字面义强加于正文。
- source_word: וְתִשְׁחוֹק
  choice: 让……磨损
  rationale: 该词与“脚”和“门槛”连用，形成因频繁登门而磨损门槛的形象；“磨损”保留原文具体而夸张的意象。
- source_word: בְּסִפּוֹ
  choice: 他的门槛
  rationale: סף 通常指门槛或门限；“门槛”是现代汉语中清楚、庄重且具象的对应词。
- source_word: רַגְלְךָ
  choice: 你的脚
  rationale: 希伯来文为单数，中文保留单数仍然自然，也维持原文意象。
theological_decisions:
- issue: 希伯来文本与希腊平行文本存在重大差异
  choice: 以现存且语意连贯的希伯来文为正文，译作寻访有悟性者并常到其门前求教。
  alternative: 按希腊文译作：“要渴望聆听一切属神的论述，不可让明智的箴言从你身边溜走。”
  rationale: 本项目在《便西拉智训》希伯来文存世且可理解之处，以希伯来见证为主要依据；但希腊见证的显著异文必须如实保留。两者措辞和意象大不相同，却都劝人热切追求智慧，因此将希腊读法列入脚注，而不以它取代希伯来正文。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫体。“切切寻求”略带智慧文学的郑重感；正文保留“脚磨损门槛”的希伯来意象，并用脚注说明其含义。所有脚注标记均置于正文相关句末。
