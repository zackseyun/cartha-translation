  text: It will be upon him like a heavy stone[a], and he will not delay to throw it off.
translation:
  language: zh_hans
  text: 它必像一块沉重的石头压在他身上[a]，他不会迟延把它丢弃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“像一块重担之石”；希腊文平行文本作“像一块坚固的试验石”，更突出试炼的意味。
    reason: 说明希伯来文本与希腊平行文本之间的重要异文差异。
lexical_decisions:
- source_word: כְּאֶבֶן מַשָּׂא
  choice: 像一块沉重的石头
  rationale: כְּ־表示比喻；מַשָּׂא本义为“重担、负荷”。译为“沉重的石头”既自然，又保留重压的意象。
- source_word: תִּהְיֶה עָלָיו
  choice: 压在他身上
  rationale: 原文直译为“在他身上”，结合石头和重担的意象，用“压在”清楚表达其空间关系与负重感。
- source_word: וְלֹא יְאַחֵר
  choice: 会毫不迟延地
  rationale: אחר的使役式在此表示“耽延、迟延”；这一译法直接保留行动迅速之意。
- source_word: לְהַשְׁלִיכָה
  choice: 把它甩掉
  rationale: 该动词表示“投掷、丢弃”；在重物压身的语境中，“甩掉”符合现代汉语习惯，也保留摆脱智慧或训诲的负面动作。
theological_decisions:
- issue: 希伯来文本的负重意象与希腊平行文本的考验意象
  choice: 正文以现存希伯来文为主，译作“沉重的石头”，在脚注中注明希腊文的“试验石”读法
  alternative: 正文译作“考验人的沉重石头”
  rationale: 现存希伯来文明确使用מַשָּׂא（重担、负荷），并未明说“考验”。希腊文δοκιμασίας提供重要但有差异的解释性意象，适合在脚注中保存，避免将其无标记地并入希伯来正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“压在他身上”具体呈现重担意象；“毫不迟延地把它甩掉”保留原文所说迅速弃绝的动作。
