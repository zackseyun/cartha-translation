  text: Listen, my son, and accept my judgment, and do not reject my counsel.
translation:
  language: zh_hans
  text: 孩子啊，听我说，接受我的见解；不要拒绝我的劝告。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所提供的希伯来文行似乎与本节错配，或在传抄中已有讹损；本译文因此依据希腊文本。该希腊文本可直译为：“孩子，要听，接受我的见解，不要拒绝我的劝告。”
    reason: textual_variant
  - marker: b
    text: “见解”也可译作“判断”或“意见”；希腊词 γνώμη 可指经过思考而形成的看法或主张。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄκουσον
  choice: 听从
  rationale: 此处是要求受教者认真听取并顺从训言；“听从”在现代汉语中自然地传达命令的实际指向。
- source_word: τέκνον
  choice: 孩子
  rationale: 希腊词可泛指孩子，也可作为师长对门徒的称呼；译作“孩子”保留其较宽泛的意义，不额外限定性别。
- source_word: δέξαι
  choice: 接受
  rationale: 表达主动领受并认可教导，比仅表示接收的“领受”更符合劝诫语境。
- source_word: γνώμην
  choice: 见解
  rationale: 该词可指意见、判断或经过思考的主张；“见解”保留其审慎思考之意，又避免把它与下文“劝告”完全同义化。
- source_word: ἀπαναίνου
  choice: 拒绝
  rationale: 准确表达否定命令中“不要推辞或拒斥”的语气。
- source_word: συμβουλίαν
  choice: 劝告
  rationale: 既体现智慧文学中的教诲意味，也符合现代汉语的自然表达。
theological_decisions:
- issue: 现存希伯来文本与本节不符时所依据的正文
  choice: 以内容连贯且符合上下文的希腊平行文本作为本节翻译依据，并以脚注说明文本问题。
  alternative: 按所提供的希伯来行翻译为陶器、熔炉和人的考验。
  rationale: 所给希伯来行与《便西拉智训》6:23的希腊文本及当前上下文明显不对应，很可能属于错配或损坏的见证。直接据其翻译会产生另一节内容；采用希腊文本并公开标明依据，能诚实保存文本证据的不确定性。
- issue: τέκνον的性别表达
  choice: 译作“孩子”。
  alternative: 译作“我儿”或“儿子”。
  rationale: 希腊词本身不限定男性；“孩子”既适合师徒训诲语境，也不把源文未明示的性别加入正文。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，保持智慧教师对受教者直接劝诫的语气。为避免把两个近义词抹平，分别以“见解”对应 γνώμη、以“劝告”对应 συμβουλία。
