translation:
  language: zh_hans
  text: 你若乐意聆听，就会受教[a]；你若侧耳倾听，就会成为智慧人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本较难理解，并且似乎比希腊文本短。希腊平行文本可译为：“你若喜爱聆听，就会领受教导；你若侧耳倾听，就会成为智慧人。”本译文以希伯来文本为主，并参照希腊文本澄清文意、保留较完整的平行结构。
    reason: textual_variant
  - marker: b
    text: 本分句依据希腊平行文本；现存希伯来文本没有明确对应的字句。
    reason: textual_variant
lexical_decisions:
- source_word: אִם תּוֹבֵא לִשְׁמֹעַ
  choice: 你若愿意聆听
  rationale: 希伯来文本的形式较为特殊；按希腊平行文本 ἐὰν ἀγαπήσῃς ἀκούειν，可知重点在于乐意、渴望听取，而不只是“前来听”。“愿意聆听”既自然，也保留意愿意味。
- source_word: תִּוָּסֵר
  choice: 就会领受教导
  rationale: 该词源于 יסר，在此表示受到教导、训诲或纠正。“领受教导”避免“受惩戒”可能带来的过强意味，也符合智慧文学语境；希腊文 ἐκδέξῃ 亦支持“接受、领受”的理解。
- source_word: וְתֵט אָזְנְךָ
  choice: 你若侧耳倾听
  rationale: 保留希伯来语“倾耳”的身体隐喻，同时用现代汉语常见的“侧耳倾听”表达专心听取。
- source_word: σοφὸς ἔσῃ（希腊平行文本）
  choice: 就会成为有智慧的人
  rationale: 现存希伯来短句没有明确对应成分，但希腊平行文本保存了第二个结果分句。“成为有智慧的人”自然表达未来的结果。
