base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/001.yaml
  text: Do not become an enemy instead of a friend, for an evil name will inherit shame and disgrace[b][a]; so it is with a sinful man of double tongue.
translation:
  language: zh_hans
  text: 不要由朋友变成仇敌[a]，因为恶名必承受羞耻和凌辱；说两样话的恶人也是如此[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文没有“不要由朋友变成仇敌”这句；希腊文在此前还另有一句，直译近于“无论大事小事，都不要不明事理”，其确切含义不甚清楚。
    reason: textual_variant
  - marker: b
    text: “说两样话”依希腊文；希伯来文原句较含混，直译近于“拥有两个〔事物〕的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם רַע / ὄνομα πονηρόν
  choice: 恶名
  rationale: 希伯来文直译为“坏的名字”，希腊文与之对应；“恶名”既保留“名”的意象，也自然表达不良名声。
- source_word: וְקָלוֹן / αἰσχύνη
  choice: 羞耻
  rationale: 两种文本都指公开蒙羞；译作“羞耻”，并与后面的“凌辱”区分。
- source_word: חֶרְפָּה / ὄνειδος
  choice: 凌辱
  rationale: 原词可指责难、羞辱或耻辱；“凌辱”凸显社会性的羞辱，并与“羞耻”组成自然的并列。
- source_word: תּוֹרִישׁ / κληρονομήσει
  choice: 必承受
  rationale: 希腊文明确使用“继承”意象，希伯来文形式在语境中较难解；“承受”保留所得后果的意象，同时比直译“继承羞耻”更符合现代汉语。
- source_word: אִישׁ רַע / ὁ ἁμαρτωλός
  choice: 奸恶的人
  rationale: 正文“奸恶而说两样话的人”以“奸恶”对应希伯来文“恶人”，也能涵盖希腊文“罪人”的道德含义，而不偏废任一见证。
- source_word: בַּעַל שְׁתָּיִם / ὁ δίγλωσσος
  choice: 说两样话
  rationale: 希伯来文直译近于“拥有两个〔事物〕的人”，所指不明；希腊文将其理解为“双舌的”。“说两样话”表达口是心非或对不同对象说相反的话，同时由脚注保留原文疑难。
- source_word: ἀντὶ φίλου μὴ γίνου ἐχθρός
  choice: 不要由朋友变成仇敌
  rationale: 该希腊文分句含义清楚。“由朋友变成仇敌”以自然汉语表达从朋友的位置转成敌对者。
theological_decisions:
- issue: 希伯来文与希腊文在本节存在重大差异
  choice: 正文纳入希腊文保存的明确劝诫“不要由朋友变成仇敌”，并以希伯来文与希腊文共有的恶名警告为主体；差异在脚注中说明。
  alternative: 仅按现存希伯来文译为：“恶名必承受羞耻和凌辱；奸恶而拥有两个〔事物〕的人也是如此。”
  rationale: 现存希伯来文较短，末语又晦涩；希腊文保存了较完整且可理解的语境。正文采用两种古代见证互证所得的读法，但不掩盖文本差异。
- issue: 末语的道德含义
  choice: 依希腊文译为“说两样话”，并在脚注说明希伯来文仅作“拥有两个〔事物〕”。
  alternative: 直译希伯来文为“拥有两个〔事物〕的人”，不说明具体所指。
  rationale: 希腊文提供了古老而明确的解释，但希伯来文本身仍有歧义，因此正文给出可读的古代解释，脚注保留不确定性，避免将其提升为无争议的唯一含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“恶名”“羞耻”“凌辱”保留原文的公共名誉语汇；“说两样话”比生硬的“双舌”更易为普通读者理解。脚注标记均置于正文相应位置。
