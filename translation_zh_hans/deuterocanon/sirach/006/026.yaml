  text: Approach her with all your soul, and with all your strength keep to her ways.
translation:
  language: zh_hans
  text: 你要全心亲近她，并全力谨守她的道路。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πάσῃ ψυχῇ σου
  choice: 全心
  rationale: 直译为“以你的整个魂/生命”，这里表达全人的投入；现代汉语用“全心”自然凝练，也与后面的“全力”形成对应。
- source_word: πρόσελθε αὐτῇ
  choice: 亲近她
  rationale: προσέρχομαι 表示走近、接近；对象“她”承接上下文中的智慧。译作“亲近”既保留趋近之意，也符合人与智慧建立紧密关系的语境。
- source_word: ἐν ὅλῃ δυνάμει σου
  choice: 全力
  rationale: 表示用全部力量或能力；“全力”是现代汉语中准确而简洁的表达。
- source_word: συντήρησον τὰς ὁδοὺς αὐτῆς
  choice: 持守她的道路
  rationale: συντηρέω 有谨慎保存、守住之意；“持守”保留主动且持续遵行的力度。“她的道路”照应希腊文复数 τὰς ὁδούς，避免将其弱化为一般性的跟随。
theological_decisions:
- issue: 阴性代词 αὐτῇ／αὐτῆς 的所指
  choice: 保留“她”
  alternative: 译成“智慧”
  rationale: 希腊文以阴性代词承接上下文人格化的智慧。本节不明说名词，故保留代词，维持原文的篇章衔接和人格化表达。
- issue: “持守道路”是保存还是遵行
  choice: 采用兼具守护与遵循意味的“持守”
  alternative: “行在她的道路上”或“谨守她的道路”
  rationale: 原文 συντήρησον 的核心是谨慎守住、保存；“持守她的道路”不把意思单一化为行动，也不排除忠实遵循的含义。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“全心……全力……”保留原句的平行结构；“她”延续智慧人格化的表达。
