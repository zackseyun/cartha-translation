  text: If trouble overtakes you[a], he will turn against you and hide himself from you.
translation:
  language: zh_hans
  text: 祸患若临到你[a]，他就会转而反对你，并躲着不见你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“你若落到卑微的境地”，而不是希伯来文本的“祸患若临到你”。
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תַּשִּׂיגְךָ רָעָה
  choice: 祸患若临到你
  rationale: אִם引出条件；תַּשִּׂיגְךָ意为“追上、临到你”，רָעָה在此指患难、灾祸而非道德上的邪恶。“祸患若临到你”自然庄重，并保留逆境突然临身的意味。
- source_word: יֵהָפֵךְ בְּךָ
  choice: 他就会转而反对你
  rationale: הפך与ב连用，表示对某人的态度发生逆转；上下文谈不可靠的朋友，因此译出关系上的敌对转变。
- source_word: וּמִפָּנֶיךָ יִסָּתֵר
  choice: 并躲着不见你
  rationale: 字面为“从你面前把自己隐藏起来”。此处指刻意避开身处困境的人；该译法既体现主动躲避，也符合现代汉语表达。
theological_decisions:
- issue: 现存希伯来文本与希腊平行文本在条件句上的差异
  choice: 正文依现存希伯来文译作“祸患若临到你”
  alternative: 希腊文可译作“你若落到卑微的境地”或“你若被压低”
  rationale: 现存希伯来文在本项目中为首要依据；希腊文ἐὰν ταπεινωθῇς表达“若被降卑／落到低微境地”，与希伯来文并不相同，因此不在正文中调和，而以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他”承接上文所说的朋友；“躲着不见你”比生硬的“从你面前隐藏自己”更自然，同时保留其在患难中刻意回避的含义。
