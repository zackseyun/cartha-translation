  text: It will consume your leaves and uproot your fruit[b][a], and leave you like a dry tree.
translation:
  language: zh_hans
  text: 它必吞噬你的叶子，毁掉你的果实[a]，使你如同一棵枯树。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文有几处难解；希腊平行文本支持“你的叶子”以及“你的果实被毁”的意思。“毁掉”也可译作“连根拔除”。
    reason: 文本异文与词义选择
lexical_decisions:
- source_word: עָלֶיךָ
  choice: 你的叶子
  rationale: 马所拉式拼写所呈现的形式若直读可作“在你身上”，但与“你的果实”和“枯树”的意象不协调；希腊平行文本明确作“你的叶子”，很可能保存了此处原有的树木意象。
- source_word: תֹּאכַל
  choice: 它必吞噬
  rationale: 动词本义为“吃、吞吃”。承接上文所指的毁灭性力量，用“吞噬”既自然，也保留强烈的破坏意味。
- source_word: וּפֶרְיְךָ
  choice: 你的果实
  rationale: 直译为“你的果实”，并与叶子、枯树构成连贯的树木比喻。
- source_word: תְּשָׁרֵשׁ
  choice: 毁掉
  rationale: 希伯来文形式难解；可能使人联想到“连根拔除”，而希腊平行文本作“毁灭、丧失”。正文采用较稳妥的“毁掉”，避免把不确定的词源意象写得过实，并在脚注保留另一可能。
- source_word: וְהִנִיחַתְךָ
  choice: 使你
  rationale: 此处表达最终把人置于某种状态；译成“使你如同”符合现代汉语，也传达“留下你成为……”的结果含义。
- source_word: כְּעֵץ יָבֵשׁ
  choice: 如同一棵枯树
  rationale: עֵץ יָבֵשׁ直指干枯的树；“枯树”简洁、自然，并保留原文鲜明而严峻的比喻。
theological_decisions:
- issue: 希伯来文本疑难与希腊平行文本的关系
  choice: 以现存希伯来文为主，并用希腊文本澄清“叶子”及果实遭毁的整体意义。
  alternative: 机械直译希伯来文为“它必在你身上吃，你的果实将扎根”，或完全依照希腊语句法译为“你将使自己如同枯木”。
  rationale: 本节希伯来文若孤立直读，在若干处语义和句法均不顺；希腊见证则保留连贯的叶子—果实—枯树意象。采用该意象不是引入教义解释，而是在文本见证之间作审慎的校勘性判断。
- issue: תְּשָׁרֵשׁ的破坏方式
  choice: 正文译为较宽泛的“毁掉”。
  alternative: 译为“连根拔除”或“根除”。
  rationale: “连根拔除”形象鲜明，但希伯来词形本身不确定，希腊文只明确表达毁灭或丧失。较宽泛的译法保存破坏结果，同时不把有争议的具体方式确定下来。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“吞噬—毁掉—枯树”保持原文逐步加深的毁灭图景；脚注集中说明文本困难，避免正文显得生硬。
