  text: If you acquire a friend, acquire him through testing, and do not quickly put your trust in him.
translation:
  language: zh_hans
  text: 若要结交朋友，就要在考验中结交他[a]；不可急着信任他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文前后两次使用同一个意为“取得、获得”的动词；“结交”是按汉语习惯的表达。也可译作“若要得到一位朋友，就要在考验中得到他”。“在考验中”可指借着考验，也可指在考验的处境中。
    reason: 说明原文重复用词、保留“获得”的比喻，并避免把“在考验中”限定为单一的时序或方式。
lexical_decisions:
- source_word: קָנִיתָ / קְנֵהוּ
  choice: 得 / 接纳
  rationale: קנה意为“取得、获得”。首处译作“得一个朋友”，保留获得朋友的表达；第二处按汉语关系语境译作“接纳他”，并以脚注说明原文重复使用同一动词，避免正文显得生硬或把朋友物化得过重。希腊文κτᾶσαι / κτῆσαι与此相符。
- source_word: אוֹהֵב
  choice: 朋友
  rationale: 此处指与人有亲密、忠诚关系的朋友；希腊文φίλον也支持这一理解。
- source_word: בְּנִסָּיוֹן
  choice: 经过考验
  rationale: נסיון可指考验、试验；介词ב既可表示处境，也可表示途径。“经过考验”自然表达应当在考验中确认朋友是否可靠，同时不排除“在患难考验中”的意味。
- source_word: וְאַל תְּמַהֵר
  choice: 不要急着
  rationale: מהר在此警戒人不要仓促行动。“不要急着”是现代汉语中自然、明确的表达。
- source_word: לִבְטוֹחַ עָלָיו
  choice: 信任他
  rationale: בטח על表示信靠、倚赖某人。“信任他”简洁自然，也保留了劝人谨慎托付信赖的含义。
theological_decisions:
- issue: 智慧训诲中泛指男性的单数形式
  choice: 保留单数代词“他”
  alternative: 改用“对方”或省略代词
  rationale: 希伯来文和希腊文均采用阳性单数形式。中文“他”可自然承接“一个朋友”，并忠实保留原文的单数指称；这里不赋予额外的性别或教义含义。
- issue: 考验是结交朋友的手段还是身处患难的情境
  choice: 译为“经过考验”，保留两者之间的张力
  alternative: 明确译作“先考验他”或“在患难中结交他”
  rationale: 介词ב可有工具性或情境性含义，希腊文ἐν πειρασμῷ也未完全消除这种歧义，因此不把经文限定为主动测试朋友或仅指共同患难。
translation_notes:
  register: 采用现代、庄重而易懂的智慧文学语体。“若要……就要……”呈现希腊平行文本明确表达的条件关系，也符合希伯来语句意。“不要急着”比“不可迅速”更自然，但仍保持劝诫语气。
