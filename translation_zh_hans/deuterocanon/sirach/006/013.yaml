base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/013.yaml
  text: Keep away from your enemies[a], and be on guard against your friends.
translation:
  language: zh_hans
  text: 要远离恨你的人，也要提防爱你的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊语平行文本作“朋友”。
    reason: 记录希伯来语“爱你的人”与希腊语“朋友”之间的表达差异。
lexical_decisions:
- source_word: מִשֹּׂנְאֶיךָ
  choice: 恨你的人
  rationale: 希伯来语是由 שׂנא 构成的分词性表达，直指“那些恨你的人”；这样译比概括为“仇敌”更贴近现存希伯来文本，同时符合现代汉语。
- source_word: הִבָּדֵל
  choice: 要远离
  rationale: בדל 的尼法勒命令式表示使自己分开、保持距离。“要远离”自然地表达主动疏远的命令语气。
- source_word: וּמֵאֹהֲבֶיָך
  choice: 爱你的人
  rationale: 现存希伯来语字面指“那些爱你的人”。主文保留这一较广且富有张力的说法，不以希腊语平行文本较窄的“朋友”取代。
- source_word: הֵשָּׁמֵר
  choice: 要提防
  rationale: שמר 在此为自我警戒之意；“提防”简洁自然，并保留对亲近者仍须谨慎的劝诫语气。
theological_decisions:
- issue: 第二分句关系称谓应依希伯来语还是希腊语表达
  choice: 主文译作“爱你的人”
  alternative: 朋友
  rationale: 希伯来语原文明确为 אֹהֲבֶיךָ（爱你的人），希腊语平行文本则作 φίλων（朋友）。以现存希伯来文本为主要依据，并在脚注记录希腊语读法，既不消除原文令人意外的张力，也保留文本见证的差异。
translation_notes:
  register: 采用简洁、对称的箴言体。“要远离……也要提防……”语气庄重而通俗；不补入“甚至”等解释性成分，以免过度限定两分句的逻辑关系。
