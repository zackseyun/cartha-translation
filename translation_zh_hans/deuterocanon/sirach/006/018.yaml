  text: My son[a], from your youth receive instruction, and until gray hair you will attain wisdom.
translation:
  language: zh_hans
  text: 我儿，你要从年轻时起领受教诲，直到白发之年，你必得着智慧。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“选择教诲”；希伯来文作“领受教诲”。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: 我儿
  rationale: 保留希伯来文父亲式劝诫中明确的男性称呼；“我儿”简洁庄重，也符合智慧文学语体。
- source_word: מִנְּעוּרֶיךָ
  choice: 从年轻时
  rationale: 表达自人生早期开始，既贴近原文，也比“从你的青春”更符合现代汉语。
- source_word: קַח לֶקַח
  choice: 领受教诲
  rationale: קַח本义为“拿、接受”，לֶקַח指所领受的教导；合译为“领受教诲”，兼顾字义和智慧文学语境。
- source_word: וְעַד שֵׂיבָה
  choice: 直到白发之年
  rationale: 保留“白发”这一具体意象，同时用“之年”自然表达其所指的老年阶段。
- source_word: תַּשִּׂיג
  choice: 必能获得
  rationale: 该动词表示达到、取得；“必能获得”自然传达持续受教最终得着智慧的结果，同时不采用希腊文“找到”的措辞。
- source_word: חָכְמָה
  choice: 智慧
  rationale: 这是智慧文学中的标准对应词，语义明确。
