  text: A sweet palate multiplies friends[b][a], and gracious lips ask after peace.
translation:
  language: zh_hans
  text: 甜美的言谈使朋友增多[a]；恩慈的嘴唇常向人问安[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本字面近于“使一个爱者增多”，意思较难确定；希腊文本作“使他的朋友增多”，正文依其较清楚的意思翻译。
    reason: alternative_reading
  - marker: b
    text: 或译：“恩慈的话语带来许多亲切的问候。”希伯来文直作“恩惠的嘴唇，询问平安者”；“询问平安”是问候、询问安好的说法。希腊文作“悦人的言语增多亲切的问候”，并以“喉咙”和“舌头”采用身体意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵךְ עָרֵב
  choice: 甜美的言谈
  rationale: חֵךְ直指“上腭、口”，在此借身体部位指言谈；עָרֵב意为“悦人的、甜美的”。译作“甜美的言谈”保留感官色彩，同时比直译“甜美的上腭”更符合现代汉语。希腊文“甜美的喉咙”也支持这是身体部位代指言语的意象。
- source_word: יַרְבֶּה אוֹהֵב
  choice: 使朋友增多
  rationale: 现存希伯来文本字面近于“使一个爱者增多”，语法或文本较难；希腊平行文本作“使他的朋友增多”，与上下文相合。正文采用较清楚的意义，并以脚注保存希伯来文本的困难。
- source_word: שִׂפְתֵי חֵן
  choice: 恩慈的话语
  rationale: 字面为“恩惠的嘴唇”。“恩慈的话语”既表达חֵן所含的亲切、讨人喜悦之意，也自然传达嘴唇代指言语的修辞。
- source_word: שׁוֹאֲלֵי שָׁלוֹם
  choice: 带来友好的问候
  rationale: 希伯来短语字面为“询问平安者”，可指问候、询问安好；希腊文则指悦人的招呼。此处译成“带来友好的问候”，凸显社交语境而不将其抽象化为一般的缔造和平。
