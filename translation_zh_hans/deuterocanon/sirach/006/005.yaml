translation_notes:
  register: 采用现代、庄重而易懂的汉语。正文优先传达希伯来诗句的社会伦理含义，同时借“甜美”保留感官隐喻；较生硬的身体部位直译及文本差异放入脚注。所有脚注标记均已置于正文。
