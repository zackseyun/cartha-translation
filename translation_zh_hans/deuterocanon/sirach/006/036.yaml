  text: Reflect on the fear of the Most High and on his commandments[a]; meditate continually.
translation:
  language: zh_hans
  text: 你要用心思想对至高者的敬畏和他的诫命[a]；要不断默想。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“如果你看见一个有见识的人，就要清早到他那里去；愿你的脚磨损他门前的台阶。”本节现存的希伯来文见证与希腊文差异很大。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: 你要用心思想
  rationale: התבונן表示专注地思考、审察。“用心思想”既保留深思的意味，也符合现代汉语表达。
- source_word: בְּיִרְאַת
  choice: 对……的敬畏
  rationale: יראה在智慧文学中兼有畏惧、尊崇和虔敬之意。“敬畏”保留了这一传统圣经用语的神学分量，没有将其弱化为单纯的“尊敬”。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: עליון在这里是神的称号。“至高者”是简明、庄重且通行的对应译法。
- source_word: וּבְמִצוֹתָיו
  choice: 和他的诫命
  rationale: 介词ב与前一短语并列，表明“他的诫命”同样是“用心思想”的对象；“诫命”保留了原文的圣经语域。
- source_word: וֶהְגֵה
  choice: 要……默想
  rationale: הגה在智慧与敬虔语境中指反复思量，有时也包含低声诵念。“默想”自然地传达其核心含义，同时不排除诵念的背景意味。
- source_word: תָמִיד
  choice: 不断
  rationale: תמיד表示持续或恒常进行。“不断”简洁地保留其延续性。
theological_decisions:
- issue: 现存希伯来文与希腊文见证之间存在重大差异
  choice: 正文依照现存希伯来文翻译，并在脚注中列出希腊文异文。
  alternative: 希腊文：如果你看见一个有见识的人，就要清早到他那里去；愿你的脚磨损他门前的台阶。
  rationale: 《便西拉智训》有可靠希伯来文见证之处以希伯来文为正文依据。本节希伯来文与希腊文内容明显不同，因此不将两者调和，而以脚注透明保留希腊文见证。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“用心思想”与“默想”区分原文两个相关但不完全相同的动词；分号保留两小句的结构，并避免把“不断”误解为只修饰“他的诫命”。
