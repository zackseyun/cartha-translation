  text: You will wear her like garments of honor[a], and you will crown yourself with her like a crown of splendor.
translation:
  language: zh_hans
  text: 你必披戴她，如同披戴尊荣的衣裳；你必把她当作华美的冠冕戴在头上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文下半句作“欢欣（或：喜乐）的冠冕”，不同于希伯来文的“华美的冠冕”。正文采用现存希伯来文本。
    reason: alternative_reading
lexical_decisions:
- source_word: בִּגְדֵי כָבוֹד
  choice: 尊荣的衣裳
  rationale: כָבוֹד 可指尊荣、荣耀；这里与具体的衣着意象相连。“尊荣的衣裳”既保留原文形象，也符合现代汉语的庄重语体。
- source_word: תִלְבְּשֶׁנָּה
  choice: 披戴她
  rationale: לבשׁ 表示穿上、披戴，阴性宾语后缀承接上下文中人格化的智慧。“披戴她”保留宾语及衣着隐喻，也比直译为“穿她”自然。
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: 华美的冠冕
  rationale: תִּפְאֶרֶת 可表示华美、荣美、光彩；“华美的冠冕”准确传达希伯来文本，并与上半句的尊荣意象呼应。
- source_word: תְּעַטְּרֶנָּה
  choice: 以她为……戴在头上
  rationale: עטר 有加冠、环绕、装饰之意，阴性后缀仍指人格化的智慧。译文用“以她为……戴在头上”自然表达把她当作冠冕戴上的反身含义。
theological_decisions:
- issue: 两个阴性后缀所指为何
  choice: 将其译为人格化智慧的“她”
  alternative: 省去明确的阴性代词，只译为“披上尊荣的衣裳，戴上华美的冠冕”
  rationale: 《便西拉智训》第6章的上下文把智慧人格化为女性；保留“她”可维持该段的文学形象和神学张力，而不把智慧化为纯粹抽象概念。
- issue: 冠冕的性质
  choice: 正文依现存希伯来文译作“华美的冠冕”
  alternative: 依希腊文译作“欢欣的冠冕”或“喜乐的冠冕”
  rationale: 主要文本依据是高可信度的希伯来见证，其中 תִּפְאֶרֶת 表示华美或荣美；希腊平行文本的不同意涵具有价值，故列入脚注而不取代正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“披戴”兼顾衣裳与礼仪性的尊荣意象；后半句补出“戴在头上”，使中文清楚自然，同时保留智慧人格化为“她”的表达。脚注标记置于上半句末，但内容说明下半句的希腊文异读。
