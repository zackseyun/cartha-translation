base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/019.yaml
  text: Draw near to her like one who plows and reaps[a], and wait for her abundant produce. For in her service you will labor only a little[b], and before long you will eat her fruit.
translation:
  language: zh_hans
  text: 你要像耕作和收割的人那样亲近她[a]，等候她丰盛的出产。因为你为她劳作，所受的辛劳不多；到明天，你就会吃她的果实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“像耕作和撒种的人那样”，而不是“耕作和收割”。
    reason: textual_variant
  - marker: b
    text: 希伯来文直译作“明天”（或“到明天”）；按语境也可能表示“很快”或“不久”。希腊文本作“很快”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחוֹרֵשׁ וּכְקוֹצֵר
  choice: 像耕田收割的人一样
  rationale: 依现存希伯来文本保留“耕田—收割”的农耕意象；“收割”与希腊文本的“撒种”存在异文，另以脚注说明。
- source_word: קְרַב אֵלֶיהָ
  choice: 亲近她
  rationale: קרב是表示接近的命令式；“亲近她”自然而庄重，也保留智慧被人格化为女性的表达。
- source_word: וְקַוֵּה
  choice: 等候
  rationale: 该动词兼有等候、盼望之意；农耕语境强调带着期待耐心等候收成。
- source_word: לְרֹב תְּבוּאָתָהּ
  choice: 她丰盛的出产
  rationale: רֹב表示丰盛，תְּבוּאָה指农作物的出产或收成；此译保持农耕比喻，也避免把词义限缩为收割动作。
- source_word: בַעֲבֹדָתָהּ מְעַט תַּעֲבוֹד
  choice: 为她劳作，你只须辛苦片刻
  rationale: עבודה与עבד在此形成同根呼应，表示为智慧付出劳作；“只须辛苦片刻”表达מְעַט所强调的短暂或有限程度。
- source_word: וּלְמָחָר
  choice: 到了明天
  rationale: 直译希伯来文的“明天”，不在正文中预先消解其可能具有的“很快”之惯用含义；希腊文本作“很快”，在脚注中交代。
- source_word: פִּרְיָהּ
  choice: 她的果实
  rationale: 保留智慧的女性人格化，以及劳作最终结出果实的比喻。
theological_decisions:
- issue: 智慧的女性人格化
  choice: 全文以“她”指智慧
  alternative: 将智慧作为抽象事物，用“它”指代
  rationale: 希伯来文使用阴性形式，并在上下文中把智慧人格化；使用“她”可保存原文的文学与神学张力。
- issue: 希伯来文与希腊文在农耕次序上的差异
  choice: 正文采用希伯来文“耕田收割”
  alternative: 依希腊文译作“耕田撒种”
  rationale: 现有希伯来文本清楚作“收割”，故正文从希伯来文；希腊异文具有重要文本价值，以脚注保留。
- issue: “明天”的时间含义
  choice: 正文保留字面表达“到了明天”
  alternative: 译作“很快”或“不久”
  rationale: 希伯来文明确使用“明天”，而希腊文作“很快”。保留字面说法并以脚注说明，可避免无声地消除文本间差异和原文可能的修辞张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“亲近她”保留智慧的女性人格化；“出产、劳作、果实”维持全句连贯的农耕意象。正文优先依据现存希伯来文，并用脚注诚实呈现希腊异文及时间词的语义可能性。
