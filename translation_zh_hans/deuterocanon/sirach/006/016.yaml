  text: A faithful friend is a bundle of life[b][a], and one who fears the Lord will attain him.
translation:
  language: zh_hans
  text: 忠信的朋友是生命之囊[a]；敬畏主的人必寻得这样的朋友[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“生命之囊，喜爱忠信者”；希腊语平行文本作“忠信的朋友是生命之药”。正文保留希伯来语“囊”的意象，并参照希腊语明确其所指是忠信的朋友。
    reason: alternative_reading
  - marker: b
    text: 希伯来语末句文本难解：“敬畏”没有明说宾语，末一动词可解作“达到、追上”，其宾语形式却是复数。希腊语平行文本作“敬畏主的人必寻得他”；其中“他”在语境中指上句的忠信朋友。正文据此翻译。
    reason: textual_variant
lexical_decisions:
- source_word: צְרוֹר חַיִּים
  choice: 生命之囊
  rationale: 直译希伯来语意象，保留“生命被包裹、珍藏并维系”的含义；不以希腊语的“生命之药”取代主要希伯来文本。
- source_word: אוֹהֵב אֱמוּנָה
  choice: 忠信的朋友
  rationale: 希伯来语字面为“喜爱忠信者”，表达紧缩；结合本节论朋友的语境及希腊语 φίλος πιστός，译作“忠信的朋友”，指可靠、守信的友人。
- source_word: יְרֵא
  choice: 敬畏……的人
  rationale: 将希伯来语分词作为泛指称谓处理，符合智慧文学格言的表达方式。
- source_word: יַשִּׂיגֵם
  choice: 必寻得他
  rationale: 希伯来语形式可表示“达到、追上”，但宾语的数与所指均有困难；希腊平行文本的“将找到他”与上文单数的朋友衔接清楚，因此按其支持的语境义译出。
- source_word: Κύριον
  choice: 主
  rationale: 现存希伯来语的“敬畏”没有明说宾语；希腊平行文本明确作“敬畏主”，故据此补明。
theological_decisions:
- issue: “敬畏”的宾语是否补出
  choice: 敬畏主的人
  alternative: 敬畏的人
  rationale: 现存希伯来文本没有明说宾语，保留了一定歧义；但希腊平行文本明确有“主”，且符合便西拉智慧传统的常用表达。正文据希腊文本补出，脚注说明文本情况，不藉此加入额外教义。
- issue: 末句动词按“寻得”还是“达到”理解
  choice: 必寻得他
  alternative: 必得着他／必达到他们
  rationale: 希伯来语动词及其宾语形式难以顺畅解释；希腊平行文本明确为“将找到他”，单数宾语也自然回指忠信的朋友。采用“寻得”能保持文本连贯，同时以脚注保留希伯来异文的张力。
translation_notes:
  register: 采用现代、庄重而简洁的智慧文学语体。“生命之囊”有意保留希伯来语较陌生的具体意象，不将其顺译为“良药”；“忠信”兼具可靠与守信之意。“寻得他”让代词回指前句的朋友，并避免以解释性扩写消除原文的凝练。
