  text: Let those at peace with you be many[a], but your confidant one out of a thousand.
translation:
  language: zh_hans
  text: 愿与你和睦的人众多；但可托付秘密的人，千人中只选一个。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“你的顾问们”或“给你出谋划策的人”；希伯来文作“你秘密的拥有者”，指可与你共享秘密或参与密议、受你信任的人。因此正文译作“可托付秘密的人”。
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי שְׁלוֹמְךָ
  choice: 与你和睦的人
  rationale: 原文直译为“与你和平相处的人”。此译保留“和睦、和平”的关系含义，也与希腊文 οἱ εἰρηνεύοντές σοι 相符；不笼统译作“朋友”，以免把关系说得过于亲密。
- source_word: יִהְיוּ רַבִּים
  choice: 愿……众多
  rationale: 希伯来文未完成式在此具有愿望或劝勉语气。“愿……众多”既表达这种语气，也保持简洁庄重。
- source_word: וּבַעַל סוֹדְךָ
  choice: 你的知心人
  rationale: בעל סוד 字面指“掌握你的秘密或参与你密议的人”。“知心人”自然地传达获准分享隐情、深受信任的亲密含义；脚注同时保留希腊文偏重顾问或参谋的读法。
- source_word: אֶחַד מֵאָלֶף
  choice: 千人中只能有一个
  rationale: 此短语强调这样的人极其稀少、必须慎重选择。“千人中只能有一个”保留数量意象，并在现代汉语中清楚表达劝诫意味。
theological_decisions:
- issue: 在本节被标为重大文本差异时，如何处理希伯来文与希腊文的措辞差别
  choice: 正文以现存希伯来文为主，译作“知心人”，突出 סוד 所含秘密、密议和亲密信任的意味。
  alternative: 依希腊文 οἱ δὲ σύμβουλοί σου 译作“你的顾问”或“给你出谋划策的人”。
  rationale: 两个见证的整体对比一致：与你和睦者可以很多，深受信任者却极少。希伯来文明确使用 סוד，因此正文保留更亲密的“知心人”；希腊文的顾问含义则在脚注中说明，不把二者的张力暗中消除。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“愿……众多；但……”呈现两分句的鲜明对照；“知心人”通俗自然，同时不失原文所强调的私密信任。
