  text: For there is a friend for the occasion[a], and he will not stand firm in the day of distress.
translation:
  language: zh_hans
  text: 因为有些朋友只是一时的朋友[a]，到了患难之日，他便站立不住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有些朋友是应时而交的”或“有些朋友只在适当的时候才是朋友”。希伯来语短语表示这种友谊受时机限制；希腊语平行文本也显示，这样的朋友不会在困苦之日长久相伴。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹהֵב
  choice: 朋友
  rationale: 该词字面指“爱的人”或“表示友爱的人”，在本节智慧文学的交友语境中作名词使用，指朋友；希腊语平行文本 φίλος 也支持这一理解。
- source_word: כְּפִי עֵת
  choice: 只在时机合适时才是朋友
  rationale: 该短语字面近于“按照时机”，表达受时势或有利处境限制的友谊。译文将隐含的机会主义意味自然呈现，同时用脚注保留“只是一时的朋友”等可能译法。
- source_word: יַעֲמוֹד
  choice: 站立不住
  rationale: עמד 的基本意象是“站立”，在此表示遭逢患难时仍然坚定、继续相守。译作“站立不住”既保留原文意象，也表达不能持守忠诚。希腊语 παραμείνῃ（留下、持续）印证此意。
- source_word: בְּיוֹם צָרָה
  choice: 到了患难之日
  rationale: 保留希伯来语“患难之日”的时间表达；“到了”使现代汉语衔接自然。צָרָה 可指困苦、危难或逆境。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“只在时机合适时才是朋友”明确表达原文所说受时势限制的友谊；后半句保留“站立”的希伯来语形象，并以“站立不住”传达不能在患难中坚守。
