translation:
  language: zh_hans
  text: 把你的双脚放进她的脚镣中，把你的颈项放进她的颈圈中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文合成本在此处所给文字与本节内容不相对应；本句据保存完整且与本节传统一致的希腊文译出。
    reason: 所提供的希伯来文本与《德训篇》6:24的希腊平行文本存在重大错位，需交代本译文采用希腊文见证。
lexical_decisions:
- source_word: πέδας
  choice: 脚镣
  rationale: 指束缚双脚的镣铐；结合“脚”译作“脚镣”，准确而自然。
- source_word: κλοιόν
  choice: 项圈
  rationale: 原词指套在颈部、用于拘束的圈具；“项圈”保留与“脚镣”并列的约束意象，不将其解释性地改译为“轭”。
- source_word: εἴσενεγκον
  choice: 伸进／套进
  rationale: 原意为“带入、放入”。按汉语与“脚镣”“项圈”的不同搭配分别译为“伸进”和“套进”，同时保留主动接受智慧管束的命令语气。
- source_word: αὐτῆς
  choice: 她的
  rationale: 希腊文阴性代词承接上下文中人格化的智慧，中文保留这一指称。
theological_decisions:
- issue: 智慧的束缚意象
  choice: 直译为“脚镣”和“项圈”
  alternative: 意译为“接受她的管教／负她的轭”
  rationale: 原文刻意使用强烈的拘束意象；直译可保留智慧既要求顺服、又最终带来自由与益处的张力，不提前替读者消解隐喻。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。两个并列祈使句保持原文节奏；“伸进／套进”符合现代汉语搭配，“脚镣／项圈”保留具体而有力度的拘束意象。
