  text: For discipline is true to its name[a], and it is not evident to many.
translation:
  language: zh_hans
  text: 因为训诲名副其实[a]，它并不向许多人显明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行本作：“因为智慧正如其名，并不向许多人显明。”希伯来文此处作“训诲”，希腊文则作“智慧”。
    reason: 重要异文：希伯来文与希腊文的主语名词不同。
lexical_decisions:
- source_word: הַמּוּסָר
  choice: 管教
  rationale: 该词可指管教、训诲或纠正。现存希伯来文作“管教”，与希腊文平行本的“智慧”不同；正文依希伯来文翻译。
- source_word: בִּשְׁמָהּ כֵּן הִיא
  choice: 正如其名
  rationale: 原文直译近于“按着它的名字，它就是如此”，表示其本质与名称相符；此译保留原句的名称呼应，又符合现代汉语表达。
- source_word: נְכוֹחָה
  choice: 显明
  rationale: 该词可表示明白、直截或正确；在“对许多人”这一结构中，理解为“不显明、不易看清”最合语境，希腊文 φανερά 也支持此义。
- source_word: לְרַבִּים
  choice: 对许多人
  rationale: 直接体现介词 לְ 与“许多人”的关系，并与“显明”自然搭配。
theological_decisions:
- issue: 希伯来文与希腊文在主语名词上的异文
  choice: 正文依希伯来文译作“管教”
  alternative: 依希腊文平行本译作“智慧”
  rationale: 《便西拉智训》有可靠希伯来文见证之处以希伯来文为主要依据；但此处异文影响句子主语，故在脚注中明确保存希腊文读法，不将两者调和。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“正如其名”保留原文略带凝练的表达；“对许多人并不显明”保留其认知层面的含义，不扩展为“许多人不能接受”或其他解释。
