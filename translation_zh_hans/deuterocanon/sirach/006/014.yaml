  text: A faithful friend is a strong refuge[a], and whoever finds one has found a treasure.
translation:
  language: zh_hans
  text: 忠实的朋友是坚固的庇护所[a]；找到这样的朋友，就是找到了珍宝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文本在这里较难理解，并与希腊文本有明显差异。按流传下来的希伯来文，较直译可作：“喜爱忠信的人喜爱力量；找到它的人找到了财富。”正文采用希腊平行文本较清楚的意思：“忠实的朋友是坚固的庇护所。”
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב אֱמוּנָה
  choice: 忠实的朋友
  rationale: 现存希伯来文直译较为费解，可理解为“喜爱忠信的人”，但希腊平行文本 φίλος πιστός 明确作“忠实的朋友”，且与下半句所指的人相合，因此正文采用这一较清楚、很可能反映原意的表达。
- source_word: תְּקוֹף / σκέπη κραταιά
  choice: 坚固的庇护所
  rationale: 希伯来文本在此难解；希腊文 σκέπη κραταιά 表示强有力、可靠的遮蔽或庇护。“坚固的庇护所”保留保护性的比喻，也符合庄重而自然的现代汉语。
- source_word: וּמוֹצְאוֹ / ὁ δὲ εὑρὼν αὐτόν
  choice: 找到这样的朋友
  rationale: 希伯来文后缀与希腊文代词均为单数，回指朋友。汉语用“这样的朋友”明确指代并避免生硬重复。
- source_word: הוֹן / θησαυρόν
  choice: 珍宝
  rationale: 希伯来文 הוֹן 可指财富、资财，希腊文 θησαυρός 明确指宝藏或珍宝。“珍宝”兼顾两种见证的财富意象及箴言式评价。
theological_decisions:
- issue: 希伯来文本与希腊平行文本显著不一致时如何处理
  choice: 正文依据希腊平行文本译为“忠实的朋友是坚固的庇护所”，并以脚注交代希伯来传本的较直译形式。
  alternative: “喜爱忠信的人喜爱力量；找到它的人找到了财富。”
  rationale: 现存希伯来语首句在句法和语义上均较困难，而希腊文表达连贯，并与后半句自然衔接。正文采用综合证据所支持的清楚读法，同时不掩盖希伯来见证的差异与不确定性。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“庇护所”保留原文的保护性比喻；后半句以“这样的朋友”自然回指前文。
