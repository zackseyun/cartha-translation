  text: Bend your shoulder and carry her[a], and do not be disgusted by her bonds.
translation:
  language: zh_hans
  text: 低下你的肩膀，背负她[a]；不要厌恶她的束缚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 此处希伯来文“她的 תַחְבּוּלוֹת”含义难定；希腊文平行文本作“她的束缚”，很可能保存了这里关于智慧之约束和管教的原有意象。
    reason: textual_variant
lexical_decisions:
- source_word: הַט
  choice: 俯下
  rationale: 该命令式表示使肩膀倾斜或放低，以承受重担；“俯下”保留具体的身体动作和顺服于智慧管教的意象。
- source_word: שִׁכְמְךָ
  choice: 肩膀
  rationale: שכם直指肩部，希腊文ὦμος也予以印证；译作“肩膀”可保留负重的身体隐喻。
- source_word: וְשָׂאֶהָ
  choice: 背负她
  rationale: 该词表示举起、承载或持续负担，阴性宾语指拟人化的智慧；“背负”与肩膀及后文束缚的意象自然衔接。
- source_word: וְאַל תָּקוֹץ
  choice: 不要厌恶
  rationale: קוץ在此表达反感、憎厌或因约束而排斥；“厌恶”力度明确，又比“感到恶心”更符合庄重劝诫的语体。
- source_word: בְּתַחְבּוּלוֹתֶיהָ
  choice: 她的束缚
  rationale: 现存希伯来文用词在此难解；希腊平行文本明确作“她的捆绑/束缚”（δεσμοῖς αὐτῆς）。主文采用“束缚”，既保持约束意象，也避免把它解释性地改写为“管教”。
theological_decisions:
- issue: 智慧的女性拟人化
  choice: 用“她”指智慧
  alternative: 用“它”弱化拟人表达
  rationale: 希伯来文阴性词尾、希腊文阴性代词及上下文都把智慧塑造成女性形象；保留“她”忠实呈现原文的文学和神学表达。
- issue: 疑难词תַחְבּוּלוֹתֶיהָ的处理
  choice: 依据希腊平行文本在主文译为“束缚”
  alternative: 译为“谋略”“绳索”或解释为“管教”
  rationale: 希伯来文本此处存在重大疑难，而希腊文δεσμοῖς清楚延续负担与约束的比喻。“束缚”保留这种张力，同时由脚注交代文本依据，不把某种神学解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“俯下肩膀，背负她”刻意保留原文连续的身体和负重意象；分号使两项命令之间的关系清楚。
