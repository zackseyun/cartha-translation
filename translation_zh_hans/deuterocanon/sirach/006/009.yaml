translation:
  language: zh_hans
  text: 有一种朋友会变成仇敌，并把那使你蒙羞的争端揭露出来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“把你蒙羞的争端揭露出来。”希伯来文的结构十分简练，也可理解为争端本身是可耻的，或争端使人公开蒙羞。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אוֹהֵב
  choice: 有一种朋友
  rationale: אוֹהֵב字面可指“爱人者”，但智慧文学语境及希腊文φίλος均表明此处指朋友；“有一种朋友”自然地引出某类不可靠的朋友。
- source_word: נֶהְפָּךְ לְשׂוֹנֵא
  choice: 会变成仇敌
  rationale: נהפך与לְ加שׂוֹנֵא表达关系的逆转，即朋友转而成为仇敌；希腊文μετατιθέμενος εἰς ἔχθραν也支持此义。
- source_word: רִיב
  choice: 争端
  rationale: רִיב可指争吵、争端或诉讼；此处没有必要限定为法律案件，“争端”既保留范围，也符合人际冲突的语境。
- source_word: חֶרְפָּתְךָ
  choice: 使你蒙羞的
  rationale: 该词意为你的羞辱、耻辱或受辱。希伯来文属格结构简练，译作“使你蒙羞的”表达争端与羞辱之间可能的结果关系，同时以脚注保留更直译的结构。
- source_word: יַחְשֹׂף
  choice: 揭露出来
  rationale: חשׂף意为揭开、暴露；希腊文ἀποκαλύψει同样表示揭露。“揭露出来”清楚传达昔日朋友将争端公开的敌对行为。
