translation_notes:
  register: 采用现代、庄重而易懂的普通话。“仇敌”保留智慧文学的严肃语气；“争端”避免把רִיב过度限定为诉讼。正文保留原文关系上的含混，不把羞辱仅解释为争端的性质。
