  text: Its net will become for you a strong refuge[b][a], and its cords garments of fine gold.
translation:
  language: zh_hans
  text: 它的网要成为你坚固的避难所[b][a]；它的绳索要成为精金的衣裳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“它的脚镣要成为你坚固的庇护，它的枝条要成为荣耀的袍服。”这与现存希伯来文的“网……绳索……精金的衣裳”有明显差异。
    reason: alternative_reading
  - marker: b
    text: 希伯来文的意象表明：起初看似限制人的事物，最终却成为保护和尊荣。
    reason: cross_reference
lexical_decisions:
- source_word: רִשְׁתָּהּ
  choice: 它的网
  rationale: רשת指网或网罗；此处采用中性的“网”，既贴近希伯来文，也与下句“绳索”的意象相连，不强化“陷阱”的负面含义。
- source_word: מְכוֹן עֹז
  choice: 坚固的避难所
  rationale: מכון可指稳固之处、根基或安置之所，与עז连用时表达稳固而有保护作用的地方；“坚固的避难所”在现代汉语中自然，并保留保护性的比喻。
- source_word: חַבְלֹתֶיהָ
  choice: 它的绳索
  rationale: חבל可指绳、索或带；“绳索”准确承接“网”的构造意象。
- source_word: בִּגְדֵי כָתֶם
  choice: 精金的衣裳
  rationale: בגדי意为衣服、衣裳，כתם指精金或上等的金子；“精金的衣裳”保留希伯来文华贵而具体的意象。
- source_word: וְהָיְתָה לְךָ
  choice: 必为你成为
  rationale: 该结构表达将来的结果或转变；“必为你成为”保留这种结果意味，并与后半句省略而自然补出的“必成为”相呼应。
theological_decisions:
- issue: 现存希伯来文与希腊文平行文本的意象明显不同
  choice: 正文以现存希伯来文“网、绳索、精金的衣裳”为准，并在脚注列出希腊文异读。
  alternative: 按希腊文译为“脚镣、力量的庇护、枝条、荣耀的袍服”。
  rationale: 本节有高可信度的希伯来文见证，应作为正文依据；希腊文可能反映不同的底本或解释性传统，故保留在脚注中，以免掩盖文本差异。
- issue: 约束性意象与保护、尊荣结果之间的张力
  choice: 保留“网、绳索”与“避难所、精金衣裳”之间的反转，不在正文中解释或弱化。
  alternative: 将“网、绳索”意译为较正面的“护网、饰带”。
  rationale: 希伯来文本身让看似束缚人的事物转化为保护和尊荣；直译这些意象能保存经文的修辞张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“它”承接上下文所拟人化的智慧；“精金”保留智慧文学的高雅色彩。脚注标记依照所给审校层顺序置为[b][a]。
