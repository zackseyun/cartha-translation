  text: Do not fall into the power of your own desire[a], lest your strength be consumed against you.
translation:
  language: zh_hans
  text: 不要落在自己欲望的掌控之下[a]，免得你的力量反倒耗尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“不要落在你自己的手中”；其中“你自己”一词也可按语境理解为“你的生命”或“你的欲望”。希腊文平行文本作：“不要因随从自己内心的计谋而自高，免得你的性命像公牛一样被撕碎。”希伯来文后半句艰涩，正文按两种文本共同表达的意思翻译：任由自身欲望支配，终会招致毁灭。
    reason: 说明希伯来文的字面表达、词义范围、文本困难及希腊平行异文。
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיַד
  choice: 不要落在……的掌控之下
  rationale: 保留“落在……手中”的希伯来语意象，同时用现代汉语“掌控之下”表达受其支配、向其屈服的意思。
- source_word: נַפְשְׁךָ
  choice: 自己的欲望
  rationale: נפש在智慧文学中可指人的内在欲求或胃口；本节警告人不可受自身冲动支配，故不机械译作“灵魂”。
- source_word: חֵילֵךָ
  choice: 你的力量
  rationale: חיל可指力量、精力或财富；此处保留范围较宽的“力量”，与自我损耗的警告相合。
- source_word: וּתְעַבֶּה ... עָלֶיךָ
  choice: 反过来被耗尽
  rationale: 希伯来文本此处艰涩，逐字意义不明；译文依据上下文表达欲望造成反噬和损耗的共同意义，并以脚注说明异文。
theological_decisions:
- issue: 如何处理希伯来文第二分句的文本困难及其与希腊文的差异
  choice: 正文表达放纵自身欲望会使人的力量遭到反噬并耗尽
  alternative: 较形式化地译为“你的力量就会在你身上增肥”；或依据希腊文译为“免得你的性命像公牛一样被撕碎”
  rationale: 现存希伯来文第二分句难以形成明确自然的意义，且资料标记为重大不一致。译文以希伯来文为主，并参照希腊平行文本所明确保留的自毁警告，不把某一修复方案伪装成确定原文。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“掌控之下”既保留“落在手中”的支配意象，也避免“灵魂”在现代读者中引发不必要的形而上限定；“反过来”清楚呈现 עָלֶיךָ 所含的反噬意味。
