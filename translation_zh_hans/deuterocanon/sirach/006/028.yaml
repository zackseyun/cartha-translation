  text: For in the end you will find its rest[b][a], and it will turn for you into delight.
translation:
  language: zh_hans
  text: 因为最终[a]，你必找到她的安歇[b]；她必为你化作喜乐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语也可译作“以后”或“往后”；希腊语平行文本作“到了末后”。这里指坚持寻求智慧之后最终得到的结果。
    reason: lexical_alternative
  - marker: b
    text: “她”指上下文中人格化的智慧。
    reason: referent_ambiguity
lexical_decisions:
- source_word: לְאָחוֹר
  choice: 到后来
  rationale: 该词字面指“往后、后来”；希腊平行文本 ἐπ᾽ ἐσχάτων 表明这里是时间意义，指坚持追求智慧之后最终出现的结果。“到后来”自然保留了这一时间指向。
- source_word: תִּמְצָא
  choice: 你必找到
  rationale: 直接表达 מצא 的未完成式在此处所指的未来结果；“必”也传达智慧训诲中应许式陈述的确定语气。
- source_word: מְנוּחָתָהּ
  choice: 她的安歇
  rationale: 保留希伯来语阴性单数后缀，并与上下文中人格化的智慧相呼应。“安歇”准确表达 מנוחה，也不强行消除它究竟是智慧自身的安歇、与智慧相伴的安歇，还是智慧所带来的安歇这一语义张力。
- source_word: וְתֵהָפֵךְ
  choice: 她也必……化作
  rationale: הפך 表示转变、变成；“化作”既保留转变意象，又符合现代汉语的智慧文学语体。
- source_word: לְךָ
  choice: 为你
  rationale: 表达与格所含的受益及切身结果：这种转变是对受教者而言、并为其益处发生的。
- source_word: לְתַעֲנוּג
  choice: 喜乐
  rationale: תענוג 可指愉悦、乐趣或享受；“喜乐”庄重而易懂，并与前句“安歇”形成自然对应。
theological_decisions:
- issue: 阴性后缀及动词的指代对象
  choice: 在正文中用“她”指向上下文中人格化的智慧。
  alternative: 理解为追求智慧的过程或智慧的管教，而不直接指智慧本身。
  rationale: 希伯来语阴性后缀和希腊语阴性形式都支持指向上下文人格化的智慧；但脚注说明也保留了将“安歇”理解为智慧所赐结果的可能性，避免把语法指代扩展为额外教义。
translation_notes:
  register: 采用现代、庄重而简明的智慧文学语体。“到后来”比生硬的“往后”更自然；“她的安歇”刻意贴近原文，并用脚注说明汉语中可能感受到的关系歧义。
