  text: For a fierce soul destroys its owner[a], and the rejoicing of an enemy overtakes him.
translation:
  language: zh_hans
  text: 因为暴烈的心性会毁掉拥有它的人，使他成为仇敌欢喜的对象。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文直译近于“仇敌的欢喜必追上他们”，但末尾的“他们”与上文单数所指不一致，语意也较难确定。希腊文平行文本作“使他成为仇敌欢喜的对象”，正文据此表达句意。
    reason: textual_variant
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: 心性
  rationale: 此处不是单指“生命”或一个独立的“灵魂”，而是指人的内在性情；“心性”既自然，也能与后面的品格形容词相配，并保留希伯来文与希腊文所表达的内在人格含义。
- source_word: עַזָּה
  choice: 刚烈
  rationale: 该词基本义涉及强劲、猛烈；在本节的劝诫语境中带有负面的不受约束之意。“刚烈”保留其力度，又不像“邪恶”那样完全采用希腊文 πονηρά 的解释性表达。
- source_word: תַּשְׁחִית
  choice: 会毁掉
  rationale: שחת 可指毁坏、败坏或使之灭亡；这里强调一种性情给持有者带来的自毁后果，“毁掉”准确而有力度。
- source_word: בְּעָלֶיהָ
  choice: 拥有它的人
  rationale: בעליה 指其拥有者或主人。译作“拥有它的人”保留所有关系，同时比“它的主人”更符合现代汉语表达人的心性。
- source_word: וְשִׂמְחַת שׂוֹנֵא
  choice: 仇敌幸灾乐祸的对象
  rationale: 希伯来文直译近于“仇敌的欢喜”，希腊文则明确表达此人会成为仇敌欢喜的对象。“幸灾乐祸”在汉语中自然呈现仇敌因其败亡而欢喜的负面意味。
- source_word: תַּשִּׂיגֵם
  choice: 使他成为
  rationale: 现存希伯来文通常应解作“追上他们”，但复数宾语与上文单数所指不合，整句语义也困难。希腊平行文本 ποιήσει αὐτόν（“使他成为”）提供了连贯读法，因此正文依其所保存的句意翻译，并以脚注说明差异。
theological_decisions:
- issue: 希伯来文末句存在数不一致和语义困难时，正文如何处理
  choice: 以希伯来文为主要依据，并采用希腊平行文本所保存的连贯句意：“使他成为仇敌幸灾乐祸的对象。”
  alternative: 按现存希伯来文较直译为：“仇敌的欢喜必追上他们。”
  rationale: 希伯来文 תַּשִּׂיגֵם 的复数后缀缺少清楚的复数先行词，而“仇敌的欢喜追上他们”也较难理解。希腊文“使他成为仇敌的欢喜”与前半节的单数对象一致，并清楚表达恶劣心性使人自取败亡、令仇敌欢喜的智慧主题。脚注保留文本问题，不把不确定性隐藏起来。
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。“刚烈的心性”保留原文性情强悍且失控的力度；“幸灾乐祸的对象”使希腊平行文本所保存的结果关系对普通读者清楚可懂。
