  text: There is a friend who is a table-companion[b][a], but he will not be found in a day of trouble.
translation:
  language: zh_hans
  text: 有一种朋友，是饭桌上的伙伴[a]，到了患难之日，他就不见了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语是紧缩的“饭桌伙伴”一类表达；希腊语平行文本作“同桌共享的人”，指平日一同吃喝、患难时却靠不住的伙伴。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语作“不被找到（不见了）”；希腊语平行文本作“不再留下”。两种读法都表明这种朋友在患难临到时便不在身边。
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹהֵב חָבֵר
  choice: 朋友
  rationale: אוֹהֵב 字面可指“爱人者”或“亲爱的人”，חָבֵר 指同伴、伙伴；二者在此共同描写一种以朋友面目出现的人。译作“朋友”符合现代汉语，也保留下文对这种友情的检验。
- source_word: חָבֵר שֻׁלְחָן
  choice: 饭桌上的伙伴
  rationale: 希伯来语是紧缩表达，字面涉及“桌子”与“伙伴”；希腊语平行文本 κοινωνὸς τραπεζῶν（同桌共享者）印证这里指一同吃喝的人。“饭桌上的伙伴”保留席间交往的具体意象，不直接释义成“酒肉朋友”，以免加入过强的贬义。
- source_word: וְלֹא יִמָּצֵא
  choice: 他就不见了
  rationale: 希伯来语 נִמְצָא 是“被找到、出现”的被动形式。“不见了”在现代汉语中自然表达患难来到时此人无处可寻，同时未改从希腊语的“不再留下”。
- source_word: בְּיוֹם רָעָה
  choice: 到了患难之日
  rationale: רָעָה 在此指灾祸、逆境，而非道德意义上的邪恶；希腊语 θλίψεως（苦难、困厄）也支持这一语义。“患难之日”庄重而易懂，并保留原文“日”的意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的智慧文学语体。“饭桌上的伙伴”保留原文的宴饮意象；“不见了”既贴近希伯来语，也比生硬的“不能被找到”更符合现代汉语。
