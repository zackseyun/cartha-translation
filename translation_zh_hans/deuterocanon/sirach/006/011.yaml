  text: In your prosperity he is like you[a], but in your adversity he will separate himself from you.
translation:
  language: zh_hans
  text: 你处境顺利时，他与你一样；你处境艰难时，他却会远离你。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本下半句作：“并且他会对你的仆人放胆说话。”现存希伯来文本则作：“他会远离你。”正文以现存希伯来文本为准；因两种文本差异显著，特此保留希腊文本的异读。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטוֹבָתְךָ
  choice: 你顺利时
  rationale: טובה在此与下句רעה相对，指处境良好、诸事顺遂；译为“顺利时”自然明白，也不把含义限于物质富足。
- source_word: הוּא כָמוֹךָ
  choice: 他就像你一样
  rationale: 希伯来文是直接的比较表达，意为“他像你”；保留其简洁性及可能包含的认同、趋同意味，不进一步解释为“与你平等”。
- source_word: וּבְרָעָתְךָ
  choice: 你遭难时
  rationale: רעה在本句指困境、患难或不顺的处境，与“顺利时”形成鲜明对照；连接词按对偶中的转折关系译作“却”。
- source_word: יִתְנַדֶּה מִמֶּךָּ
  choice: 他却会与你疏远
  rationale: 该反身词形表达主动使自己远离、与人疏隔。“与你疏远”既保留主动抽离的意味，也符合现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话，以“顺利时／遭难时”呈现两个分句的对照；“疏远”比“分离自己”更符合自然汉语，同时保留希伯来文反身动词所表达的主动退避意味。
