base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/037.yaml
  text: He will give understanding to your heart[a], and what you have desired will make you wise.
translation:
  language: zh_hans
  text: 他必使你的心有悟性[a]；你所渴望的，必使你有智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“他自己必坚固你的心；你所渴慕的智慧必赐给你。”这里的希伯来文见证则作：“他必使你的心有悟性；你所渴望的，必使你有智慧。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: 他
  rationale: 希伯来文为阳性单数代词；本行自身未明说先行词，但希腊文平行文本承接“主”的命令，支持以“他”指主，同时不在正文中补出原文未明说的名词。
- source_word: יָבִין
  choice: 必使……明白
  rationale: בין 的使役形式表达“使明白、使有悟性”。此译保留使役意义，也符合现代汉语表达。
- source_word: לִבֶּךָ
  choice: 你的心
  rationale: לֵב 可指人的思想、意志和内在生命。“心”保留希伯来文的人观意象；与“明白”搭配时，其认知含义清楚。
- source_word: וַאֲשֶׁר
  choice: 你所……的
  rationale: 关系表达指向所渴望之事；此结构自然，并保留所指对象的开放性。
- source_word: אִוִּיתָה
  choice: 渴望
  rationale: 该动词表示愿望、切望。“渴望”较“想要”庄重，又不过分强化为贪求。
- source_word: יְחַכְּמֶךָּ
  choice: 必使你有智慧
  rationale: 该形式具有使役意义，即“使你成为有智慧的人”。“使你有智慧”在现代汉语中自然，并避免“使你聪明”可能偏向机敏或智力的含义。
theological_decisions:
- issue: “他”的所指
  choice: 正文保留“他”，按希腊文平行文本理解为主
  alternative: 理解为智慧、默想等非明确的人称主体
  rationale: 希伯来文本行没有显明先行词，因此正文不直接增补“主”；但希腊文完整平行文本先提到主的律例与命令，随后说“他自己”，强烈支持其所指为主。
- issue: 后半句的主语与智慧的关系
  choice: 按现存希伯来文译作“你所渴望的，必使你有智慧”
  alternative: 按希腊文译作“你对智慧的渴望必赐给你”
  rationale: 两种见证在句法和意义上确有差异。正文以高可信度的希伯来文为先，不将希腊文较明确的“对智慧的渴望”并入正文；差异在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心”保留希伯来文意象，“有智慧”避免把圣经中的智慧窄化为智力或机敏。分号呈现两小句的平行关系；脚注标记置于相关分句之后。
