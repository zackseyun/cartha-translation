  text: Its yoke is a golden ornament[b][a], and its bonds are a cord of blue thread.
translation:
  language: zh_hans
  text: 她的轭是金饰[a]，她的束索是蓝紫色的线绳[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本在这里保留“轭”的意象；希腊平行文本则作“她身上的金饰”。正文以“轭是金饰”兼存两层意味。
    reason: alternative_reading
  - marker: b
    text: “蓝紫色”也可译作“紫蓝色”或“风信子蓝色”；原词指一种珍贵的蓝至蓝紫色染料或染线。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻלֵּי / עֻלָּהּ
  choice: 轭／金饰
  rationale: 希伯来文本保留“轭”的意象，并以“金饰”描述它，使负担与装饰的双重意味并存；希腊平行文本的“金饰”也支持其华美的一面。
- source_word: זָהָב
  choice: 金
  rationale: 简洁表达材质；“金饰”在现代汉语中自然、清楚。
- source_word: מוֹסְרוֹתֶיהָ
  choice: 束索
  rationale: 原词指捆绑或约束之物。“束索”既保留约束意味，也能与下文具体的线绳形象衔接。
- source_word: פְּתִיל
  choice: 线绳
  rationale: 原词可指搓成的线或细绳；“线绳”兼顾其纤维质地与作为系缚物的形象。
- source_word: תְּכֵלֶת
  choice: 蓝紫色
  rationale: 该词指珍贵的蓝至蓝紫色染料或染成的材料；希腊语ὑάκινθινον也支持蓝紫色范围，故不将其限制为单一现代色值。
theological_decisions:
- issue: 智慧的管教同时被描绘为约束与美饰
  choice: 同句保留“轭／束索”与“金饰／蓝紫色线绳”两组意象
  alternative: 只译成装饰物，或只译成沉重的轭和锁链
  rationale: 希伯来文本及希腊平行文本共同呈现一种刻意的张力：智慧对门徒的约束不仅是负担，也显得珍贵而美丽。译文不把这种张力化约为单一方向。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“她”承接人格化的智慧；句式简洁对称，并保留原文中约束与华美并置的诗性张力。
