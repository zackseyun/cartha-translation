  text: For as he is[a], so is his friend, and as his name, so are his deeds.
translation:
  language: zh_hans
  text: 因为他如何，他的朋友也如何；他的名如何，他的作为也如何。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作：“敬畏主的人使自己的友谊合乎正道；因为他如何，他的邻舍也如何。”本节希伯来文本的前半句与此有显著差异。
    reason: alternative_reading
lexical_decisions:
- source_word: כָמוֹהוּ
  choice: 他怎样
  rationale: 该比较结构直译为“像他”或“他怎样”；在汉语箴言式对句中，“他怎样”更自然，并保留原文简练而略含歧义的表达。
- source_word: רֵעֵהוּ
  choice: 他的朋友
  rationale: רֵעַ 可指朋友、同伴或邻舍；本段语境论及友谊，希腊平行文本也提到友谊，因此译作“朋友”最切合上下文。
- source_word: כִּשְׁמוֹ
  choice: 他的名怎样
  rationale: 原文明确说“他的名”；虽可引申为名声或声誉，但正文保留“名”，不把隐含意义直接写入译文。
- source_word: מַעֲשָׂיו
  choice: 他的作为
  rationale: מַעֲשִׂים 指所行之事、行为或作为；“作为”适合现代汉语智慧文学的庄重语体，也保留一定的道德意味。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在本节有重大差异
  choice: 正文翻译现存希伯来文，并以脚注注明希腊异文。
  alternative: 按希腊文译为：“敬畏主的人使自己的友谊走正路；因为他怎样，他的近人也怎样。”
  rationale: 现存希伯来文应作为正文的首要依据，但希腊文本的前半句内容明显不同；将其列入脚注，可诚实保留文本传统的差异，而不擅自调和。
translation_notes:
  register: 采用简洁、对称的箴言式句法。“他怎样……也怎样”自然易懂，同时保存希伯来文的平行结构；“名”和“作为”不作解释性扩写，以保留原文可能涉及身份、名声与行为之间关系的张力。
