  text: It is difficult for a fool[b][a], and one lacking sense will not endure it.
translation:
  language: zh_hans
  text: 智慧对愚昧人来说很难[a]；缺乏悟性的人[b]不能持守智慧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“对愚昧人来说崎岖难行。”希伯来语原词也可表示曲折、艰难；希腊平行文本作“对不受教的人来说非常艰难”。
    reason: lexical_alternative
  - marker: b
    text: “缺乏悟性的人”原文直译为“缺少心的人”；希伯来语的“心”在这里指理解和判断的能力。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲקֻבָּה
  choice: 很难
  rationale: 此词较罕见，可表示曲折、崎岖或难以应付。希腊平行文本以 τραχεῖά…σφόδρα（非常艰难、难以承受）印证这里是在说智慧对愚昧人而言难以接受和遵行；译为“很难”既自然，也保留原词的困难感。
- source_word: לָאֱוִיל
  choice: 对愚昧人来说
  rationale: אֱוִיל 是智慧文学中常见的“愚昧人”，兼有认知与道德上的迟钝之意，并非单指智力不足。
- source_word: וְלֹא יְכַלְכְּלֶנָּה
  choice: 不能持守到底
  rationale: כלכל 可指承受、维持或坚持；阴性宾语后缀回指上下文中的智慧。希腊文本“不会常留在其中”支持持续、坚持的含义。“不能持守到底”比字面的“不能承受她”更符合现代汉语，同时不把重点限于一时的忍受。
- source_word: חֲסַר לֵב
  choice: 缺乏悟性的人
  rationale: 字面义为“缺少心的人”；在希伯来语中，“心”可指思想、判断和理解能力。现代汉语译为“缺乏悟性的人”可避免被误解为缺乏同情心或勇气。
- source_word: ἐμμενεῖ ἐν αὐτῇ
  choice: 持守到底
  rationale: 希腊平行文本意为“留在其中、持续于其中”，说明本句所强调的是不能持续跟从智慧，而非物理意义上的支撑。
theological_decisions:
- issue: 智慧的阴性指代及人的性别表达
  choice: 明说“智慧”，并用“持守到底”避免不自然的阴性代词；将 חֲסַר לֵב 译作不限定性别的“缺乏悟性的人”。
  alternative: “智慧对愚昧人来说很难，缺乏悟性的人不能承受她。”
  rationale: 希伯来语阴性宾语回指智慧，但语法性别不必在汉语中机械地译成“她”。本节所说的人也不是特指男性。这样的表达既保留智慧为所指对象，也不额外强化人格化或性别限定。
translation_notes:
  register: 采用现代、庄重而通顺的智慧文学语体。分号保留两个平行分句的紧密关系；“持守到底”传达持续遵循智慧之意，同时避免生硬的阴性代词。
