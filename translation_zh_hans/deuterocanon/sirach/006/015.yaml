  text: There is no price for a faithful friend[b][a], and there is no weighing his worth.
translation:
  language: zh_hans
  text: 忠实的朋友[a]无价；他的美善无法衡量[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语较直译为“喜爱忠实的人”；希腊语作“忠实的朋友”。上下文表明这里说的是一位忠实可靠的朋友。
    reason: alternative_reading
  - marker: b
    text: 希伯来语直译为“他的美善”，也可指“他所带来的益处”；希腊语作“他的美好”，也可理解为“他的高贵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאוֹהֵב אֱמוּנָה
  choice: 忠实的朋友
  rationale: 希伯来语字面可理解为“喜爱忠实的人”，但在6:14—16论可靠友谊的语境中，指以忠实为特征的朋友；希腊语 φίλου πιστοῦ（“忠实的朋友”）也支持这一理解。
- source_word: אֵין מְחִיר
  choice: 是无价的
  rationale: מְחִיר意为“价钱、价值”；“无价”自然表达这种朋友不能用价钱衡量，同时保留其不可替代的意味。
- source_word: מִשְׁקָל
  choice: 无法衡量
  rationale: מִשְׁקָל与重量、称量有关；此处以称重为喻，表示其价值不可度量。希腊语 σταθμός 同样支持“称量、衡量”的意象。
- source_word: לְטוֹבָתוֹ
  choice: 他的可贵
  rationale: 希伯来语可指他的“美善、益处”；结合价值与称量的比喻，译作“可贵”能自然涵盖其美善及价值，而不把含义限缩为实用利益。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语。“是无价的；……无法衡量”保留原文两个否定分句的平行关系，并使称价与称量的意象清楚可懂。
