  text: For he has heard you and has guarded himself against you[a], and in time he will hate you.
translation:
  language: zh_hans
  text: 因为他已经听说了你的事，也已经提防你[a]；到时候，他会恨你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也已经守护你”，或“也已经留意你”。希腊语动词可指守护、看守或留意；在这里，结合下文“会恨你”，也可理解为他已经对你有所戒备。
    reason: 保留 ἐφυλάξατό σε 在中间语态及具体语境中的词义歧义。
lexical_decisions:
- source_word: ἀκήκοεν
  choice: 已经听到了
  rationale: 完成时表示听见这一行为已经发生，并对当前仍有影响；“已经听到了”在现代汉语中自然地保留这一意味。其后属格 σου 结合语境译作“你的话”。
- source_word: γάρ
  choice: 因为
  rationale: 该词承接上文并说明理由；“因为”清楚表达解释关系。
- source_word: ἐφυλάξατό σε
  choice: 已经提防你
  rationale: φυλάσσω 的中间语态在此可表示为自己戒备、防范某人；下句所说日后产生仇恨，使“提防你”比单纯的保护更切合语境，同时以脚注保留其他可能。
- source_word: ἐν καιρῷ
  choice: 时机一到
  rationale: 该短语指某个来到的时刻，也可能含合适或有利时机之意；“时机一到”简洁而不把时间具体化。
- source_word: μισήσει σε
  choice: 他就会恨你
  rationale: 直译 μισέω 的将来时，不将其弱化为一般的不满或敌意。
theological_decisions: []
