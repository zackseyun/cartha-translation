  text: A worker in this will not become rich, and one who despises small things will be ruined.
translation:
  language: zh_hans
  text: 做这种事的人[a]不会富足；轻看小事的人必会衰败[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作“酗酒的工人”；希伯来文本直译为“做这种事的人”，其中“这种事”回指上文。
    reason: 交代希伯来文本与希腊平行文本的重要差异；正文不把希伯来分词狭化为职业“工人”，也不补入“酗酒”。
  - marker: b
    text: “衰败”：希伯来文也可译作“动摇”或“变得不稳”；希腊文本作“必渐渐跌倒”。
    reason: 保留希伯来结尾动词的语义幅度，并将“渐渐”明确标为希腊平行文本的表达。
lexical_decisions:
- source_word: פּוֹעֵל זֹאת
  choice: 做这种事的工人
  rationale: פּוֹעֵל既可作“工人”，也带有“做、行”的分词意味；保留“工人”并用“做这种事”表达זֹאת的回指，不擅自说明“这种事”具体为何。
- source_word: לֹא יַעֲשִׁיר
  choice: 不会富足
  rationale: 使役词形在此按不及物意义理解为“不会致富／富足”，符合希伯来语语境及希腊平行文本。
- source_word: בוֹזֶה מְעוּטִים
  choice: 轻看微小之事的人
  rationale: 直译בוֹזֶה为“轻看、藐视”，מְעוּטִים按复数实体化用法译作“微小之事”，保留其可泛指小额、小事或微小损失的宽度。
- source_word: יִתְעַרְעָר
  choice: 必日渐衰败
  rationale: 该词表达动摇、失稳或崩坏；中文“衰败”自然涵盖结果，且“日渐”参考希腊平行文本κατὰ μικρόν，表明过程是逐步发生的。
theological_decisions:
- issue: “这种事”所指为何
  choice: 保留含蓄回指，不在正文中补作“酗酒”
  alternative: 依希腊平行文本译作“酗酒的工人”
  rationale: 现存希伯来文本只有זֹאת“这种事”，没有“醉酒”一词；正文优先依希伯来证据，并用脚注交代希腊异文，避免消除文本差异。
- issue: 结局的强度
  choice: 译为“衰败”
  alternative: 译为“毁灭”或“跌倒”
  rationale: 希伯来语强调被动摇、变得不稳，未必等同彻底毁灭；“衰败”既传达严重后果，也不过度强化。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体；两分句结构对称。正文以希伯来文本为主，脚注简要呈现希腊平行文本对“酗酒”和“渐渐跌倒”的不同见证。
