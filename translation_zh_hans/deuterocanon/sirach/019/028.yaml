  yaml_path: translation/deuterocanon/sirach/019/028.yaml
  text: And if he is prevented from sinning by lack of strength[a], when he finds an opportunity, he will do evil.
translation:
  language: zh_hans
  text: 他若因力量不足而无法犯罪，一旦有机会，就会作恶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作恶”也可译作“害人”；希腊语动词既可泛指行恶，也可特指加害于人。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάττωμα ἰσχύος
  choice: 力有不逮
  rationale: 表达因力量或能力不足而受限，保留希腊语所指的客观缺欠，又不把它误解为道德上的软弱。
- source_word: κωλυθῇ ἁμαρτεῖν
  choice: 不能犯罪
  rationale: 在本句中自然表达“受阻而无法犯罪”；重点是外在能力不足，并非内心不愿犯罪。
- source_word: καιρόν
  choice: 机会
  rationale: καιρός在此指适合行动的时机或可乘之机，而不只是一般的时间。
- source_word: κακοποιήσει
  choice: 会作恶
  rationale: 保留动词广泛的道德含义，可指行恶，也可能更具体地指加害于人。
theological_decisions:
- issue: 不能犯罪与真正的义
  choice: 译文表明，此人没有犯罪是由于能力不足，而非出于德行；机会一到仍会作恶。
  alternative: 也可把末句较窄地理解为“他就会害人”。
  rationale: ἁμαρτεῖν与κακοποιήσει共同构成一般性的道德判断；译文不把没有行动能力等同于内在正直，也不把恶行限定为某一种加害行为。
translation_notes:
  register: 采用现代、凝练而庄重的普通话。“力有不逮”略带书面色彩，但通俗可懂，并能简洁传达力量或能力不足；“一有机会，仍会作恶”保留原文对其内在意图的鲜明判断。
