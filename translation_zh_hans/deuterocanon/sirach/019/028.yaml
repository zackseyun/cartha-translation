- from: 即使他因力有不逮而不能犯罪，一有机会，仍会作恶。[a]
  to: 他若因力量不足而无法犯罪，一旦有机会，就会作恶。[a]
  rationale: 将让步式“即使……仍会……”改为与希腊文相符的条件式“若……一旦……就……”。“力量不足”明确对应“力量的缺乏”，而“无法犯罪”在此语境中仍可表达因能力受限而未能犯罪，未暗示内心自愿克制。
