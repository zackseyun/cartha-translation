  text: There is a wickedness that is also an abomination[a], and there is a fool lacking in wisdom.
translation:
  language: zh_hans
  text: 有一种邪恶，这也是可憎之事；也有愚昧人，在智慧上有所欠缺[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有所欠缺”也可译作“被减损”或“不足”。希腊文分词表达在智慧方面的欠缺或减损，并不一定表示全然没有智慧。
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρία
  choice: 邪恶
  rationale: 这是宽泛的道德用语；“邪恶”保留其伦理恶意，又不把含义收窄为“恶意”这种内在动机。
- source_word: καὶ αὕτη
  choice: 也是
  rationale: 保留καί的附加意味，并把αὕτη理解为回指前述“邪恶”：这种邪恶也属于可憎之事。
- source_word: βδέλυγμα
  choice: 可憎之事
  rationale: 表达强烈的道德或宗教厌恶，庄重而不显生硬；“之事”也保留名词性。
- source_word: ἄφρων
  choice: 愚昧人
  rationale: 符合智慧文学中兼具道德与认知意味的人物类别，比现代汉语中容易仅作辱骂理解的“蠢人”更合宜。
- source_word: ἐλαττούμενος
  choice: 有所欠缺
  rationale: 分词表达减少、不足或处于欠缺状态；“有所欠缺”既自然，又避免将其简化为完全没有智慧。
- source_word: σοφίᾳ
  choice: 在智慧上
  rationale: 将与格理解为欠缺所涉及的领域，保留本句的智慧文学用语。
