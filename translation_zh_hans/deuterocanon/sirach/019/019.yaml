  register: 采用现代、庄重而清楚的智慧文学语体。两个ἔστιν结构译作“有一种……；也有……”，保留原文的并列和平衡。由于所给希腊文本与现有英语脚注内容存在错位，脚注改为直接说明ἐλαττούμενος的语义范围；标记置于相关分句之后。
