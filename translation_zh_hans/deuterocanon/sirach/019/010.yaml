  text: A fool will suffer pangs at the sight of a word[a], like a woman in labor at the sight of a baby.
translation:
  language: zh_hans
  text: 愚人因一句话而感到阵痛[a]，如同正在生产的妇人因婴儿而感到阵痛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一句话”也可译作“一件事”或“一个消息”。“阵痛”保留原文所唤起的分娩疼痛意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ προσώπου
  choice: 因……而
  rationale: 该短语字面为“从……面前／由于……的临在”，在这里表达原因或引发痛苦的缘由。译作“因……而”既符合现代汉语，也在两个平行分句中保留同一结构。
- source_word: λόγου
  choice: 一句话
  rationale: λόγος 可指“话、事情、消息”。结合本节箴言式的简洁表达及上下文关于听见并传话的主题，“一句话”最直接，同时不排除消息或言论的语义。
- source_word: ὠδινήσει
  choice: 经历阵痛
  rationale: 该动词特指或强烈唤起分娩之痛；后半句以生产的妇人为明喻，因此保留“阵痛”意象，而不弱化为一般的“痛苦”。
- source_word: μωρός
  choice: 愚人
  rationale: 这是智慧文学中对缺乏明智、判断失当之人的常用称呼；“愚人”简洁、庄重，并符合汉语智慧文学语体。
- source_word: βρέφους
  choice: 婴儿
  rationale: βρέφος 指婴孩或新生儿；在生产场景中译作“婴儿”准确自然。
- source_word: ἡ τίκτουσα
  choice: 生产的妇人
  rationale: 原文是“正在生产的那一位（女性）”。“生产的妇人”保留动作性，比仅译“产妇”更明确地对应分娩场景。
theological_decisions: []
translation_notes:
  register: 采用简洁、箴言式的现代书面汉语。两个分句重复“经历阵痛”，有意保留希腊文鲜明而略显突兀的平行比喻；不采用“看见一句话／婴儿”之类译法，因为ἀπὸ προσώπου在此主要表示原因，而非视觉动作。
