  text: A man may slip and not mean it; and who has not sinned with his tongue?
translation:
  language: zh_hans
  text: 有人失足，并非出于本意[a]；谁没有因自己的舌头犯过罪呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有人失足，并非出于本心。”原文直译为“有人失足，不是出于心灵／自身”；此处指并非有意而为。
    reason: 保留ὀλισθάνων的“失足”意象，并说明οὐκ ἀπὸ ψυχῆς较字面的措辞及其在语境中的非故意含义。
lexical_decisions:
- source_word: ἔστιν ὀλισθάνων
  choice: 有人失言
  rationale: ἔστιν加分词构成存在式表达，指一般情形中的“有人”；ὀλισθάνων本义为滑倒、失足，结合下句的“舌头”，自然译作言语上的失误“失言”。
- source_word: οὐκ ἀπὸ ψυχῆς
  choice: 并非出于本意
  rationale: 原文直译为“不是出于心灵／自身”。此处表示过失并非有意而为；“出于本意”既自然，也保留行为动机的含义。
- source_word: τίς οὐχ ἥμαρτεν
  choice: 谁没有……犯过罪呢
  rationale: 反问预期的答案是“没有人”；ἥμαρτεν保留道德分量，译为“犯过罪”，不弱化为单纯的“犯错”。
- source_word: ἐν τῇ γλώσσῃ αὐτοῦ
  choice: 在言语上
  rationale: 字面为“在他的舌头上”，是指说话方面；现代汉语用“在言语上”清楚自然，并与前半句“失言”相呼应。
theological_decisions:
- issue: ἥμαρτεν在智慧文学中是道德犯罪还是一般失误
  choice: 犯过罪
  alternative: 犯过错／有过失
  rationale: 动词ἁμαρτάνω在这里把言语失误置于伦理层面。“犯过罪”保留其道德力度，同时不引入额外的教义解释。
- issue: οὐκ ἀπὸ ψυχῆς是否断定完全无罪
  choice: 并非出于本意
  alternative: 不是从心里发出的／并非故意
  rationale: 本句区分无意失言与蓄意言语之罪，但没有明确断言无意之失毫无责任；译文保留这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的箴言式表达。“有人”比带性别色彩的“一个男人”更符合希腊文泛指功能；分号呈现两分句之间由陈述转向反问的关系。
