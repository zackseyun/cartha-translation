  text: Never repeat a word[b][a], and nothing will be taken from you.
translation:
  language: zh_hans
  text: 绝不要把话说第二遍[a][b]，你也绝不会有任何损失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“绝不要重复一件事，你就不会有任何亏损。”希腊语 λόγον 可指“话、说法”或“事情”；ἐλαττονωθῇ 更直译为“被减少”。
    reason: lexical_alternative
  - marker: b
    text: 此处希腊语来源的校验标记为“重大不一致”；本译文仍按所提供的斯威特版现存文本翻译。
    reason: textual_variant
lexical_decisions:
- source_word: μηδέποτε
  choice: 绝不要
  rationale: 该词表示带时间意味的强烈否定；“绝不要”自然地保留了禁令的强调语气。
- source_word: δευτερώσῃς
  choice: 说第二遍
  rationale: δευτερόω 的字面意思是“使之成为第二次”或“再做一次”；与 λόγον 连用时即再次说出、重复或转述。“说第二遍”既贴近字面，也符合现代汉语。
- source_word: λόγον
  choice: 话
  rationale: λόγος 在此可指“话、言语、说法”或“一件事”。“话”简洁自然，同时保留一定的语义宽度；其他可能含义在脚注中说明。
- source_word: οὐθέν
  choice: 任何
  rationale: 与强烈否定结构合译为“绝不会有任何……”，自然表达“没有什么”的全面否定。
- source_word: οὐ μὴ ἐλαττονωθῇ
  choice: 绝不会有任何损失
  rationale: οὐ μή 加虚拟语气构成强烈否定；ἐλαττονόω 的被动式字面为“被减少、被削减”。“绝不会有任何损失”在汉语中清楚表达其实际含义，并保留强调语气。
