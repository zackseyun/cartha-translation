  text: An arrow stuck in the thigh of flesh—so is a word in the belly of a fool[a].
translation:
  language: zh_hans
  text: 箭嵌在大腿的肉中；愚人肚腹里的话也是如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊原文前半句的属格结构较为凝练；也可较贴近字面地译作“嵌在血肉之大腿中的箭”。无论如何，意象都是箭扎入并留在大腿的肉中。
    reason: 说明压缩的希腊语结构及可行的细微句法处理，不改变正文所保留的核心意象。
lexical_decisions:
- source_word: βέλος
  choice: 箭
  rationale: 该词泛指投射武器；在此具体身体意象中译作“箭”最自然。
- source_word: πεπηγὸς
  choice: 嵌在
  rationale: 这是πήγνυμι的完成时分词，表示已经扎入并仍留在其中；“嵌在”兼顾动作结果与持续状态。
- source_word: ἐν μηρῷ
  choice: 在大腿……里
  rationale: μηρός特指大腿，不泛化为“腿”，保留原文明确的身体部位。
- source_word: σαρκός
  choice: 肉
  rationale: 此处σάρξ是字面的身体血肉，并非神学意义上的“肉体”；“大腿的肉里”以自然汉语保留其具体、鲜明的意象。
- source_word: λόγος
  choice: 话
  rationale: 这里指人听到或存留在心腹中的言语；“话”比“言词”更自然，同时保持原词的宽泛性。
- source_word: ἐν κοιλίᾳ
  choice: 在……肚腹中
  rationale: κοιλία可指肚腹，也可引申为人的内里；此处与前半句的身体意象平行，故保留具体说法。
- source_word: μωροῦ
  choice: 愚人
  rationale: 智慧文学中的μωρός兼有见识和品行上的愚昧含义；“愚人”简洁且符合箴言体。
- source_word: οὕτως
  choice: 也是如此
  rationale: 明确保留前后两幅图像之间的类比关系，又不替原文补明话在愚人腹中究竟造成何种感受或结果。
theological_decisions:
- issue: σάρξ在本节中的含义
  choice: 按字面译为“肉”
  alternative: 身体
  rationale: 本节使用具体的受伤身体意象，σάρξ并无罪性或属世本性的神学含义；译作“肉”既准确，也避免将图像抽象化。
- issue: 类比的具体着重点
  choice: 保留“也是如此”的开放表达
  alternative: 明确解释为话使愚人难受、急于吐露
  rationale: 原文只把腹中的话比作嵌在大腿肉里的箭，并未明说类比着重于疼痛、压力还是无法忍耐；译文不擅自消解这种含蓄。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留智慧文学的对偶和比喻。“肚腹”比单用“肚子”略为典雅，又仍为普通读者易懂；句法有意保持原文的凝练，不补入原文没有明说的心理反应。
