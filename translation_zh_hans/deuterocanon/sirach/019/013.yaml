  yaml_path: translation/deuterocanon/sirach/019/013.yaml
  text: Reprove a friend[a], lest perhaps he did not say it; and if he did say it, so that he may not repeat it.
translation:
  language: zh_hans
  text: 要查问朋友[a]：也许他并没有说过这话；如果他说过，好使他不再说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要责备朋友”。希腊语动词既可表示查问、查验，也可表示揭露或责备；下文较支持先核实事情。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: 要查问
  rationale: ἐλέγχω可指查验、质问、揭露或责备。下文“也许他并没有说过”表明首先应核实传言，因此正文采用“查问”，同时以脚注保留“责备”的可能。
- source_word: τὸν φίλον
  choice: 朋友
  rationale: 定冠词在此用于一般性的箴言教导，现代汉语用不带限定词的“朋友”最自然，不必增添“你的”。
- source_word: μή ποτε οὐκ εἶπεν
  choice: 也许他并没有说过这话
  rationale: μή ποτε在此引出需要谨慎考虑的可能性；“这话”明确希腊文语境中省略的言语内容，却不添加具体信息。
- source_word: καὶ εἰ εἴρηκεν
  choice: 即使他说过
  rationale: εἰ本可译为“如果”；结合前后对举，汉语“即使”自然表达无论传言是否属实都应查问，但不改变其条件性质。
- source_word: ἵνα μὴ δευτερώσῃ
  choice: 也好使他不再说
  rationale: δευτερόω意为第二次做同一件事；上下文所指是说话，因此译为“不再说”，既承接前文，也保留目的从句的语气。
