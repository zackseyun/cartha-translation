  text: Rot and worms will inherit him, and a bold soul will be taken away.
translation:
  language: zh_hans
  text: 朽烂和蛆虫必承受他；胆大的人[a]必被除去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胆大的人”直译为“大胆（或冒失）的魂”。“大胆”也可按语境理解为“鲁莽”或“放肆”；“被除去”也可译作“被带走”。
    reason: 保留ψυχὴ τολμηρά和ἐξαρθήσεται的语义范围，而不在正文中预先判定其褒贬色彩或ψυχή的具体指涉。
lexical_decisions:
- source_word: σήπη
  choice: 腐朽
  rationale: 指腐败、朽坏；用名词“腐朽”保留原文与“蛆虫”并列的拟人表达。
- source_word: κληρονομήσουσιν
  choice: 必承受
  rationale: 基本义为“继承、承受产业”。这里刻意保留原文反常而有力的意象：死者最终归腐朽和蛆虫所有。
- source_word: ψυχὴ τολμηρά
  choice: 胆大妄为者的性命
  rationale: ψυχή可指“生命、性命”，也可借指整个人；τολμηρά可表示大胆、冒失或放肆。结合警戒语境译作“胆大妄为者”，但不把该词缩窄为某种特定罪名。
- source_word: ἐξαρθήσεται
  choice: 必被夺去
  rationale: 被动式可表示“被带走、除去”。与“性命”搭配时，“被夺去”自然且保留被动语气。
theological_decisions:
- issue: ψυχή应译作“灵魂”还是“性命/人”
  choice: 译作“胆大妄为者的性命”
  alternative: “大胆的灵魂”或“胆大妄为的人”
  rationale: 此处谈到腐朽、蛆虫和被除去，ψυχή很可能以“生命/性命”或代指人的方式使用。译作“性命”避免把经文预先解释成关于灵魂本体遭毁灭的教义命题。
- issue: τολμηρά的褒贬色彩
  choice: 正文采用带贬义的“胆大妄为”
  alternative: 较中性的“大胆”
  rationale: τολμηρός本身可在“勇敢”与“冒失、放肆”之间摆动；本句的惩罚语境支持贬义理解，同时以脚注保留词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话；保留“腐朽和蛆虫必承受他”这一突兀的原文意象，不将其淡化为解释性措辞。
