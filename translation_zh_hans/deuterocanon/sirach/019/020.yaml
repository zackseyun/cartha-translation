base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/020.yaml
  text: Better is one who is lacking[a], with understanding and fear, than one who abounds in prudence and transgresses the law.
translation:
  language: zh_hans
  text: 理解力不足却心存畏惧[a]的人，胜过明智有余却违犯律法的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心存畏惧”也可译作“心存敬畏”；希腊文没有说明所畏惧的对象。
    reason: 保留 ἔμφοβος 在一般惧怕与宗教性敬畏之间的词义空间。
lexical_decisions:
- source_word: κρείττων
  choice: 胜过
  rationale: 比较级用于智慧格言中的人物对比；“胜过”自然、庄重，并保留原文的比较结构。
- source_word: ἡττώμενος ἐν συνέσει
  choice: 理解力不足
  rationale: ἡττώμενος 表示较弱、欠缺，ἐν συνέσει 限定所欠缺的是理解或领悟能力。这样处理也与后半句“明智有余”形成原文中的对照。
- source_word: ἔμφοβος
  choice: 心存畏惧[a]
  rationale: 该词表示有惧怕、心怀畏惧。此处可能含敬畏之意，但原文未说明畏惧的对象，因此正文不补入“主”或“上帝”。
- source_word: περισσεύων ἐν φρονήσει
  choice: 明智有余
  rationale: περισσεύων 表示充足、有余，φρόνησις 指明智、审慎或实践智慧；译文既保留“有余”的比较意味，也避免与前句的 σύνεσις 完全混同。
- source_word: παραβαίνων νόμον
  choice: 违犯律法
  rationale: παραβαίνω 表示越界、违反，νόμος 在此为律法；“违犯律法”保留其道德和法律分量。
theological_decisions:
- issue: ἔμφοβος 是否应明确译作“敬畏主”
  choice: 心存畏惧
  alternative: 敬畏主；心存敬畏；害怕
  rationale: 《便西拉智训》的整体语境可能使人联想到对上帝的敬畏，但本节希腊文没有明说对象。译文保留这种开放性，不将可能的神学含义直接写入正文。
- issue: ἡττώμενος ἐν συνέσει 的句法关系
  choice: 理解力不足
  alternative: 虽有所不足，却有理解力
  rationale: 介词短语 ἐν συνέσει 最自然地限定 ἡττώμενος，意为“在理解力方面欠缺”，而非说明此人“有理解力”。这也与 περισσεύων ἐν φρονήσει 的平行结构相符。
translation_notes:
  register: 采用简洁、庄重的现代汉语格言体。以“理解力不足／明智有余”和“心存畏惧／违犯律法”呈现原文的双重张力；不沿用英语咨询层将 ἐν συνέσει 误解为正面拥有“理解力”的表达。
