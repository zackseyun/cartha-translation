  text: Rebuke your neighbor before you threaten[a], and give place to the law of the Most High.
translation:
  language: zh_hans
  text: 在威吓之前，要责备你的邻人；并要给至高者的律法留出余地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “给……留出余地”也可理解为让至高者的律法发挥作用，或让自己的回应受律法引导；即不要以威吓使事态升级。
    reason: 说明δὸς τόπον的习语性表达及其主要可能含义，同时避免把原文开放的措辞限定为律法“自行施行”。
lexical_decisions:
- source_word: ἔλεγξον
  choice: 责备
  rationale: 该命令式表示指出过错并加以纠正；“责备”保留其道德分量，又符合现代汉语表达。
- source_word: τὸν πλησίον σου
  choice: 你的邻舍
  rationale: πλησίον在伦理劝诫中通常指身边的同胞或他人；“邻舍”是简洁而庄重的传统表达，含义不限于住处相邻的人。
- source_word: πρὶν ἢ ἀπειλῆσαι
  choice: 在威吓以前
  rationale: πρὶν ἢ表明时间上的先后，ἀπειλῆσαι通常意为威胁或恐吓；译文保留先责备、后才可能升级为威吓的次序。
- source_word: δὸς τόπον
  choice: 留出余地
  rationale: 该短语直译为“给出地方”，在此可表示让位、容许发挥作用或听凭施行；“留出余地”既保留空间隐喻，也不把具体含义限定得过窄。
- source_word: νόμῳ Ὑψίστου
  choice: 至高者的律法
  rationale: νόμος在这里指来自上帝的律法或教导；Ὑψίστου是犹太希腊文中常见的神圣称号，译作“至高者”。
theological_decisions:
- issue: δὸς τόπον νόμῳ Ὑψίστου的含义
  choice: 保留“给至高者的律法留出余地”的空间隐喻
  alternative: 让至高者的律法自行施行；或放下个人报复，让自己的回应服从至高者的律法
  rationale: 原文可以侧重让律法发挥作用、听凭律法处理，或让个人行动服从律法。正文不把这一开放表达收窄为某一种神学解释，脚注说明主要可能性。
translation_notes:
  register: 采用现代、庄重而易懂的劝诫语体。“邻舍”和“至高者”保留经文语域；句法紧贴希腊文的两个并列命令，同时避免过度解释第二分句。
