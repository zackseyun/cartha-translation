  yaml_path: translation/deuterocanon/sirach/019/022.yaml
  text: There is one who plots evil[a], bent low in gloom, and inwardly he is full of deceit;
translation:
  language: zh_hans
  text: 有人图谋作恶，低伏着身子，神情阴郁[a]，内心充满诡诈；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “低伏着身子，神情阴郁”也可译作“忧郁地低伏着”或“在昏暗中弯着身”；希腊文可指低伏的姿态，并可让人想到阴沉的情绪或暗沉的外貌。
    reason: 保留 συγκεκυφὼς μελανίᾳ 所包含的身体姿态，以及 μελανίᾳ 在阴郁情绪与暗沉外观之间的词义歧义。
lexical_decisions:
- source_word: ἔστιν
  choice: 有一种人
  rationale: 以现代汉语自然表达希腊文存在句，并表明这里是在描写一类人。
- source_word: πονηρευόμενος
  choice: 行恶
  rationale: 该分词表示从事恶事或怀有恶意；“行恶”保留行为层面的概括，不把原文进一步限定为“图谋”。
- source_word: συγκεκυφώς
  choice: 弯着腰
  rationale: 完成时分词描写弯身、低伏的状态；此译保留可指实际姿态、情绪表现或伪装姿态的开放性。
- source_word: μελανίᾳ
  choice: 阴郁地
  rationale: 该词可涉及黑暗、阴沉的外貌或忧郁的情绪；正文采用自然的汉语表达，并用脚注保留词义歧义。
- source_word: τὰ ἐντὸς αὐτοῦ
  choice: 内里
  rationale: 所指是人的内在，而非解剖意义上的内脏；“内里”也与前面的外在姿态形成呼应。
- source_word: πλήρης δόλου
  choice: 充满诡诈
  rationale: δόλος指欺骗、诡计或奸诈；“诡诈”既清楚又保留其道德与谋算意味。
theological_decisions:
- issue: 外在低伏阴郁与内在诡诈的关系
  choice: 译文呈现外在姿态与内在品性的反差，但不判定其外表必然是刻意伪装。
  alternative: 可明确译成此人故意装作忧郁低伏，以掩饰内心奸恶。
  rationale: 希腊文把弯腰、阴沉与内里的诡诈并置，确有反差，却没有明说外在表现是蓄意假装；因此保留这种道德张力而不补入动机。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“有一种人”引出一般性人物类型；“内里却”自然凸显外在表现与内在诡诈的对照。脚注标记置于实际存在歧义的短语之后。
