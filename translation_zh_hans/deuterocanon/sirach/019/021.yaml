base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/021.yaml
  text: There is a meticulous cunning[a], and this too is unjust[b]; and there is one who twists things in order to bring a judgment to light.
translation:
  language: zh_hans
  text: 有一种缜密的狡诈[a]，这也是不义的；也有人歪曲事情，为要显明判断[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “缜密的狡诈”也可译作“周密的机巧”或“仔细的狡诈”；原文形容这种机巧严密、细致，随即明确说它是不义的。
    reason: lexical_alternative
  - marker: b
    text: “判断”也可译作“判决”“裁断”或“公义”；原文含义较宽。
    reason: alternative_reading
lexical_decisions:
- source_word: πανουργία ἀκριβὴς
  choice: 精心算计的狡诈
  rationale: πανουργία 在此带有负面的机巧、狡诈之意；ἀκριβὴς 表示严密、精确或细致。“精心算计”既体现其周密性，也保留其操弄性的道德色彩。
- source_word: ἄδικος
  choice: 不义的
  rationale: 该词直接对前述狡诈作道德判断；“不义”兼具伦理与公义层面的含义，适合智慧文学的庄重语域。
- source_word: διαστρέφων
  choice: 歪曲事理
  rationale: 分词表示扭曲、使偏离正道。希腊文未明说宾语，中文补出泛指的“事理”，使句子自然，同时不限定具体被歪曲的对象。
- source_word: χάριν τοῦ
  choice: 为要
  rationale: 这一结构表达目的；“为要”简洁而庄重，清楚保留目的关系。
- source_word: ἐκφᾶναι
  choice: 显明
  rationale: 该动词意为使显露、使清楚可见；“显明”准确而不增添解释。
- source_word: κρίμα
  choice: 裁断
  rationale: κρίμα 可指判断、判决、裁决或公断。“裁断”保留其司法和伦理色彩，同时以脚注说明其他可能含义。
theological_decisions:
- issue: 对周密机巧的道德评价
  choice: 将 πανουργία 明确译作负面的“狡诈”，并保留“这也是不义的”的直接评价。
  alternative: 可较中性地译作“周密的机巧”，再由后半句作负面判断。
  rationale: αὕτη ἄδικος 明确评价前述 πανουργία；主文采用负面词能自然传达原句的道德指向，但脚注保留较中性的词义可能。
- issue: 歪曲与显明裁断之间的张力
  choice: 直译为“歪曲事理，为要显明裁断”，不解释此人的动机是善是恶。
  alternative: 可将末句理解为为了显出公义、作出判决，或揭露某项判断。
  rationale: 原文把 διαστρέφων 与目的短语并置，形成明显张力，却未说明这种歪曲怎样导致裁断显明；译文不应擅自化解。
- issue: κρίμα 的含义
  choice: 译作“裁断”，并以脚注保留“判断、判决、公义”等可能。
  alternative: 判断；判决；公义。
  rationale: 原词语义较宽，既可偏向司法决定，也可能含公义层面；不宜把它限定为某一种神学或法律概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“精心算计的狡诈”传达严密机巧的负面色彩；“歪曲事理”自然补足希腊文省略的宾语；分号保留两个并列存在句的结构及末句未化解的伦理张力。
