  yaml_path: translation/deuterocanon/sirach/019/024.yaml
  text: And if he is prevented from sinning by lack of strength[b][a], when he finds an opportunity he will do evil.
translation:
  language: zh_hans
  text: 而且，若他因力量不足[a]而受阻，不能犯罪；若找到时机[b]，他就会作恶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “力量不足”也可译作“能力欠缺”或“由于软弱”；希腊语可泛指力量或能力不够。
    reason: lexical_alternative
  - marker: b
    text: 直译“找到一个时机”；这里指可乘之机。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: 如果
  rationale: καί承接上文；在独立引述本节时，中文无需机械译作“并且”，直接进入条件句更自然，也不增添转折含义。
- source_word: ἐὰν
  choice: 如果／一旦
  rationale: 两处ἐὰν都引出条件；第一处译为“如果”，第二处结合εὕρῃ καιρόν译为“一旦”，使中文条件关系清楚自然。
- source_word: ὑπὸ ἐλαττώματος ἰσχύος
  choice: 因力量不足
  rationale: 保留ἐλάττωμα所表达的欠缺和ἰσχύς所表达的力量、能力，不把这种不足限定为身体虚弱或道德软弱。
- source_word: κωλυθῇ ἁμαρτεῖν
  choice: 受阻，不能犯罪
  rationale: κωλυθῇ是被动式，表示受到阻碍；译文明确此人没有犯罪是由于能力或处境受限，而非暗示其内心已经改正。
- source_word: εὕρῃ καιρόν
  choice: 找到时机
  rationale: καιρός在此指适合行动的时刻或机会；“时机”既贴近原文的时间意象，也能表达有利机会。
- source_word: κακοποιήσει
  choice: 会作恶
  rationale: κακοποιέω泛指作恶或做坏事；“作恶”与前面的“犯罪”呼应，又不把恶行缩窄为伤害他人。
theological_decisions:
- issue: 此人没有犯罪的原因
  choice: 译为因力量不足而“受阻，不能犯罪”，表明其克制出于能力或处境的限制。
  alternative: 把“力量不足”理解为道德或属灵上的软弱。
  rationale: 希腊文明确以ἐλάττωμα ἰσχύος说明阻碍的原因，而后半句说他找到时机便会作恶，显示这里并非称赞真正的义行；但译文不进一步断定这种“力量”专指身体、社会地位或其他具体能力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“受阻，不能犯罪”保留被动受限的意味；“一旦……就……”自然呈现后半句所强调的条件与结果。
