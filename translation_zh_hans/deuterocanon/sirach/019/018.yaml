  text: And the knowledge of evil is not wisdom[a], and where the counsel of sinners is, there is no understanding.
translation:
  language: zh_hans
  text: 对恶事的知识不是智慧[a]；哪里有罪人的谋划，哪里就没有明辨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“精通邪恶，并不算智慧。”希腊文在“智慧”（σοφία）、“知识”（ἐπιστήμη）和“明辨”（φρόνησις）之间作了区分。
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: 智慧
  rationale: 采用智慧文学中的常用译法，保留其兼具道德与认知的正面含义。
- source_word: πονηρίας
  choice: 恶事的
  rationale: 作为属格修饰ἐπιστήμη，指向邪恶之事；“恶事”在现代汉语中自然，也保留较宽泛的道德范围。
- source_word: ἐπιστήμη
  choice: 知识
  rationale: 直译为“知识”，并与本节的“智慧”和“明辨”保持词义区分。
- source_word: βουλή
  choice: 计谋
  rationale: 此处指罪人所商议、筹划的主意；“计谋”既体现谋划含义，也符合上下文的负面色彩。
- source_word: ἁμαρτωλῶν
  choice: 罪人的
  rationale: 直接表达属格关系，并保留圣经智慧文学中的道德类别。
- source_word: φρόνησις
  choice: 明辨
  rationale: 表达实践性的道德判断力，且避免与ἐπιστήμη的“知识”混同。
- source_word: οὐκ ἔστιν ὅπου
  choice: 哪里有……，哪里就没有……
  rationale: 保留希腊文明确的处所结构，同时符合现代汉语表达习惯。
theological_decisions:
- issue: 邪恶方面的知识是否可算为智慧
  choice: 明确否认恶事的知识就是智慧，也否认罪人的计谋中有真正的明辨。
  alternative: 较弱地理解为恶事的知识只与智慧有所区别，而不被完全排除在智慧之外。
  rationale: 两个οὐκ ἔστιν均构成明确否定；译文保留这种道德判断，不另行引入后期教义范畴。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“恶事的知识”略带形式对应色彩，以保留原文三个认知类词语之间的对照；第二分句用复现式“哪里……哪里……”呈现原文的处所结构。
