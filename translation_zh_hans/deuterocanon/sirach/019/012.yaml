  yaml_path: translation/deuterocanon/sirach/019/012.yaml
  text: Question a friend[a], perhaps he did not do it; and if he did do something, so that he may not add to it.
translation:
  language: zh_hans
  text: 要查问朋友[a]：也许那件事不是他做的；若他做了什么，也免得他再加添[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “查问”也可译作“责备”或“质问”。原文动词可有揭露、查验和责备的含义；因下文说朋友也许并未做那件事，译文侧重先查明实情。
    reason: lexical_alternative
  - marker: b
    text: “再加添”直译原文“加上”。在此行为语境中，也可理解为“再犯”“继续”或“使事情更严重”；原文未明确说明所加添的具体内容。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ἔλεγξον
  choice: 当面查问
  rationale: 该命令式可指揭露、查验、责备或质问。下文首先顾及朋友可能并未做那件事，因此译为“当面查问”，既保留对质与查明的意味，又不预先定罪。
- source_word: φίλον
  choice: 朋友
  rationale: 无冠词单数在此具有箴言式的泛指意味；现代汉语直接说“朋友”自然简洁。
- source_word: μή ποτε
  choice: 也许／也好使……不
  rationale: 同一短语在两处都表达谨慎防范的可能性；前一处用“也许”表示事情可能并非如此，后一处按目的性语境译作“也好使……不”。
- source_word: οὐκ ἐποίησεν
  choice: 那件事不是他做的
  rationale: ποιέω所指行为由上下文省略；汉语补出“那件事”，自然表达被传述或被指控的行为。
- source_word: καὶ εἴ τι ἐποίησεν
  choice: 即使他做了什么
  rationale: τι是不定代词，保留行为内容未明的特点；“即使”在汉语中自然承接前句，并突出两种可能。
- source_word: προσθῇ
  choice: 再做下去
  rationale: προστίθημι本义为“加上”，在行为语境中可指继续、再犯或使事情加重。“再做下去”较自然，同时保留继续与重复的开放性；脚注说明其字面和其他可能理解。
