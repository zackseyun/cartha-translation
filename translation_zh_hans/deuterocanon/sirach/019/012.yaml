  rationale: 将让步式“即使”改为条件式“若”，以对应 καὶ εἴ；将“再做下去”改为“再加添”，保留 προσθῇ 的字面与语义开放性。首句删去原文未明说的“当面”，并润饰末句，使中文自然而不改变两处 μή ποτε 的谨慎／防范张力。
