  naturalness: “当面查问”中的“当面”不是原文明确表达，且“也好使他不再做下去”在现代汉语中较生硬。改为“查问朋友：也许……；若……，免得他再加添”更简洁、庄重，并与箴言体相称。
  terminology: “查问”可安全表达 ἔλεγξον 在此语境中的查验、对质意味，同时脚注保留“责备／质问”等词义可能。“再加添”保留 προστίθημι 的字面意象，不把所加添的内容或是否为重复犯罪限定得过死。
