  text: All wisdom is fear of the Lord[b][a], and in all wisdom there is the practice of the law.
translation:
  language: zh_hans
  text: 一切智慧都是敬畏主；在一切智慧中，都有对律法的遵行。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遵行”直译可作“实行”或“践行”；希腊文强调把律法付诸行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα σοφία
  choice: 一切智慧
  rationale: Πᾶσα 表达全面、周遍的范围；“一切智慧”自然保留了希腊文的概括性，也延续《便西拉智训》的智慧文学用语。
- source_word: φόβος Κυρίου
  choice: 敬畏主
  rationale: “敬畏”在现代汉语圣经语域中兼含惧怕、敬重与肃然崇敬，能够保留 φόβος 的力度，不把它弱化为单纯的尊敬；Κυρίου 译作“主”。
- source_word: ἐν πάσῃ σοφίᾳ
  choice: 在一切智慧中
  rationale: 按希腊文介词结构直译，保留第二分句与第一分句之间的平行关系，而不擅自限定为各种智慧。
- source_word: ποίησις νόμου
  choice: 对律法的遵行
  rationale: ποίησις 的核心是实行、践行；与 νόμου 搭配时，“遵行律法”比生硬的“做律法”自然，同时明确表达实际履行而不只是认同。
- source_word: νόμου
  choice: 律法
  rationale: 在犹太智慧文学语境中，νόμος 通常指向律法或妥拉；“律法”比宽泛的“教导”更贴合此处。
theological_decisions:
- issue: Κυρίου 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 现存希腊文直接使用 Κυρίου，并未在本行提供希伯来神名；“主”既忠于源文，又避免把未明示的底本形式带入正文。
- issue: φόβος 在智慧神学中的含义
  choice: 敬畏
  alternative: 惧怕；尊崇
  rationale: “敬畏”保留畏惧与崇敬并存的张力；单译“惧怕”容易显得只有恐惧，单译“尊崇”又会削弱 φόβος 的强度。
- issue: ποίησις νόμου 所表达的关系
  choice: 对律法的遵行
  alternative: 律法的实行；遵守律法
  rationale: 源文强调智慧中包含实际履行律法。“遵行”保留行动性，但不进一步界定智慧与律法之间的系统神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一切智慧都是敬畏主”紧贴希腊文的名词判断结构；第二分句保留“在一切智慧中”的形式，以避免过度解释。脚注标记置于其所说明的第二分句之后。
