  yaml_path: translation/deuterocanon/sirach/019/014.yaml
  text: Reprove a friend[a], for often there is slander, and do not believe every word.
translation:
  language: zh_hans
  text: 要责备朋友[a]，因为常有诽谤；不要轻信每一句话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “责备”也可按语境理解为“查问”或“核实”。希腊词可指揭露、指正或使人知错；正文保留其通常的劝诫意味。
    reason: 说明ἐλέγχω可有的语义幅度，同时不以次要解释取代正文的“责备”。
  - marker: b
    text: 直译“不要相信每一句话”；这里的“话”可指关于某人的说法或传闻。
    reason: 说明λόγος的字面意义及其在本节语境中的所指。
lexical_decisions:
- source_word: Ἔλεγξον
  choice: 查问
  rationale: ἐλέγχω可表示查验、质问、指责或使人知错。结合本节对诽谤和传言的警告，“查问”自然表达先向当事朋友求证，同时不把语义限定为已经认定朋友有错。
- source_word: φίλον
  choice: 朋友
  rationale: 无冠词单数在这里具有一般性的箴言语气；汉语用“朋友”即可，无须增添原文未明说的所属词“你的”。
- source_word: πολλάκις
  choice: 常常
  rationale: 准确表达“多次、经常”，符合现代汉语箴言式表达。
- source_word: γὰρ
  choice: 因为
  rationale: 明确保留后一分句对“向朋友查问”所给出的理由。
- source_word: γίνεται
  choice: 发生
  rationale: 保留“出现、发生”的动态含义，又与抽象名词“诽谤”构成自然汉语。
- source_word: διαβολή
  choice: 诽谤的事
  rationale: διαβολή指诽谤、恶意指控；译作“诽谤的事”既清楚又避免把所有传言都预先判定为司法意义上的诬告。
- source_word: μὴ παντὶ λόγῳ πίστευε
  choice: 不要什么话都信
  rationale: λόγος在语境中可指话、说法或传闻。“不要什么话都信”既贴近“每一句话”，又是自然、易懂的现代汉语警语。
