  yaml_path: translation/deuterocanon/sirach/019/023.yaml
  text: He stoops his face and pretends to be deaf[a]; where he is not recognized[b], he will outwit you.
translation:
  language: zh_hans
  text: 他低着脸，装作耳聋；在没有人认出他的地方[a]，他会抢在你前头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文也可理解为“在没有人注意到他”或“在没有人识破他”的地方；原句简短，具体意味并不完全确定。
    reason: lexical_alternative
  - marker: b
    text: 原文动词意为先到、先行动，因而占得优势；也可译作“他会抢先对付你”或“他会占你的先”。
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκύφων πρόσωπον
  choice: 低着脸
  rationale: συγκύφων表示弯下、俯下，πρόσωπον意为“脸”。译作“低着脸”既保留身体姿态，也符合现代汉语表达；不额外断定这是谦卑、躲藏或欺骗的姿态。
- source_word: ἑτεροκωφῶν
  choice: 装作耳聋
  rationale: 这个罕见动词表示表现得像聋人，而非说明其确实耳聋。“装作耳聋”自然地传达佯装不闻的意味。
- source_word: ὅπου
  choice: 在……的地方
  rationale: 保留该关系副词通常的地点含义“哪里、在……的地方”，不强行改释为纯粹的时间关系“当……时”。
- source_word: οὐκ ἐπεγνώσθη
  choice: 没有人认出他
  rationale: 将ἐπιγινώσκω的被动形式按“被认出、被辨认”处理，并以汉语主动句表达。“识破”虽符合可能的语境，却会更明确地加入其伪装已被看穿的解释。
- source_word: προφθάσει σε
  choice: 会抢在你前头
  rationale: προφθάνω的核心意思是先到、先行动或占得先机。“抢在你前头”保留相对于“你”先行一步的意象，也暗示取得优势，但不像“智胜你”那样把手段限定为谋略。
