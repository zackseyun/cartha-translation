  text: Do not tell it to friend or foe[a], and if it is not a sin for you, do not reveal it.
translation:
  language: zh_hans
  text: 无论对朋友还是仇敌，都不要述说这事；如果这对你不算罪，就不要揭露。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于：“不要向朋友或仇敌述说；如果这对你不是罪，就不要揭露。”后半句十分简约，“这”所指未明；也有人理解为：除非隐瞒会使你担罪，否则不要揭露。
    reason: 保留原文条件句的歧义及其伦理张力。
lexical_decisions:
- source_word: ἐν φίλῳ καὶ ἐν ἐχθρῷ
  choice: 无论对朋友还是仇敌
  rationale: 介词短语在禁令中自然指述说的对象；“无论……还是……”保留朋友与仇敌的对举和箴言式语气。
- source_word: μὴ διηγοῦ
  choice: 不要述说这事
  rationale: διηγέομαι意为讲述、叙说；希腊文省略宾语，语境所指是一件听到或知道的事，汉语补出“这事”更自然。
- source_word: καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: 如果这事对你不算罪
  rationale: 按现存希腊文的表层句法直译条件结构，不把它预先改释为“除非保持沉默会使你犯罪”，从而保留原句的简约与张力。
- source_word: μὴ ἀποκάλυπτε
  choice: 不要揭露
  rationale: ἀποκαλύπτω在此指把隐而未明的事公开；“揭露”保留其比一般“述说”更强的披露意味。
theological_decisions:
- issue: καὶ εἰ μή ἐστίν σοι ἁμαρτία的条件关系
  choice: 正文译作“如果这事对你不算罪，就不要揭露”
  alternative: “除非不说会使你犯罪，否则不要揭露”
  rationale: 希腊文直陈“如果……不算罪”，但表达非常简约，其伦理逻辑可能容许另一种理解。正文依从句法，脚注说明可能的语境性解释，不把含混处单向定论。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。“述说”与“揭露”形成力度递进；分号呈现两个相连的禁令。
