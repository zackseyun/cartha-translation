  to: 轻信的人心思浮浅；犯罪而伤害自己[a]的人，必会失足。
  rationale: 修订将第二分句由可能暗示两个独立动作的“犯罪损害自己生命”调整为“犯罪而伤害自己”，更贴近“向自己的ψυχή犯罪”的结构和语义，同时避免将ψυχή单一定义为肉身生命。保留“轻信”“心思浮浅”“犯罪”和“失足”，以维持原文的箴言体、道德语义及未来结果。
