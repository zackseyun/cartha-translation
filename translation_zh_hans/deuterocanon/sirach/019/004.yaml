  yaml_path: translation/deuterocanon/sirach/019/004.yaml
  text: He who trusts too quickly is light of heart[a], and he who sins against his own soul will go astray.
translation:
  language: zh_hans
  text: 轻信的人心思浮浅；犯罪而伤害自己[a]的人，必会失足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伤害自己”直译为“向（或针对）自己的魂犯罪”。“魂”（ψυχή）也可指“自身”或“生命”。
    reason: 保留εἰς ψυχὴν αὐτοῦ的自我指向与伤害含义，并说明ψυχή在此处的词义范围。
lexical_decisions:
- source_word: ταχὺ
  choice: 轻信
  rationale: 该副词修饰“信任”，在箴言式警告中含仓促、过快之意；汉语“轻信”自然凝练，并保留负面语气。
- source_word: ἐμπιστεύων
  choice: 信
  rationale: 表示信任、把信心放在某人或某事上；与ταχὺ合译为“轻信”。
- source_word: κοῦφος καρδίᾳ
  choice: 心思浮浅
  rationale: κοῦφος本义为“轻”，用于καρδίᾳ描写内在心思欠稳重、浅薄；“心思浮浅”既传达比喻，也避免现代汉语“心情轻松”的误解。
- source_word: ἁμαρτάνων
  choice: 犯罪
  rationale: 保留ἁμαρτάνω的道德意义，不弱化为一般性的“犯错”。
- source_word: εἰς ψυχὴν αὐτοῦ
  choice: 损害自己生命
  rationale: εἰς在这里有行为指向并伤及自身之意；ψυχή可指生命、自身或魂。“损害自己生命”在正文中自然可懂，其他可能译法列入脚注。
- source_word: πλημμελήσει
  choice: 必会行差踏错
  rationale: 该动词表示失足、做错或行为不当；“行差踏错”保留其道德行动含义，也符合智慧文学语体。
theological_decisions:
- issue: ψυχή的人论含义
  choice: 生命
  alternative: 自己；灵魂
  rationale: 此处ψυχή可以指人的生命、本人，也可较字面地译为“灵魂”。正文采用“生命”，避免把词义过窄地限定为与身体相对的非物质部分；脚注保留其真实歧义。
- issue: εἰς ψυχὴν αὐτοῦ与后句的关系
  choice: 犯罪损害自己生命的人，必会行差踏错
  alternative: 得罪自己灵魂的人，必会犯错
  rationale: 将εἰς理解为罪所指向并造成伤害的对象，但不把后果具体化为某一种惩罚；后句仍保持宽泛的道德失足含义。
translation_notes:
  register: 采用现代、庄重而简洁的智慧文学语体。以“轻信”自然表达ταχὺ ἐμπιστεύων；将κοῦφος καρδίᾳ译作“心思浮浅”，避免“心轻”或“心情轻松”造成歧义。脚注标记[a]置于相关分句之后。
