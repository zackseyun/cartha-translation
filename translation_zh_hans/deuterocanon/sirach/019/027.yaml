  text: One who lowers his face and pretends not to hear—where he is not recognized, he will get ahead of you.
translation:
  language: zh_hans
  text: 有人低着头，装作听不见[a]；在无人认出他的地方，他会抢在你前头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“装聋”。希腊文分词描写一个人佯装耳聋或故意不听。
    reason: lexical_alternative
  - marker: b
    text: 或译“他会超过你”或“他会先你一步”。希腊文动词意为走在某人前面、先于某人，这里可能含有占得先机的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκύφων
  choice: 低着
  rationale: 该分词表示弯身、低垂的姿态；与“脸”搭配译作“低着脸”，既保留身体动作，也符合现代汉语表达。
- source_word: πρόσωπον
  choice: 脸
  rationale: 采用该词最普通直接的意义，语言自然，不作不必要的雅化。
- source_word: ἑτεροκωφῶν
  choice: 装作听不见
  rationale: 这个罕见分词描写故意表现得像耳聋或充耳不闻；此译清楚传达伪装的意味，同时以脚注保留“装聋”的词汇选择。
- source_word: ὅπου
  choice: 在……的地方
  rationale: 按其最自然的地点义处理，保留希腊文“在哪里”的表达；不擅自改为时间性的“当……时”。
- source_word: οὐκ ἐπεγνώσθη
  choice: 没有人认出他
  rationale: 将被动式自然转译为汉语主动句，保留“未被认出”的社交情境；“认出”比泛泛的“认识”或“注意到”更切合语境。
- source_word: προφθάσει
  choice: 抢在你前头
  rationale: 该动词可指先于、赶在前面或占得先机；此译保留“在先”的形象及可能的占先意味，不把它过度解释为明确的欺压或胜过。
