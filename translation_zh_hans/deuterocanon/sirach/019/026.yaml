  text: A man's attire[a], and the laughter of his teeth[b], and a person's steps proclaim what concerns him.
translation:
  language: zh_hans
  text: 男人的装束、牙齿的笑[a]和人的步履，都显明他的情形。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“牙齿的笑”；这可能是指一个人的笑容，或笑时露出牙齿的样子。
    reason: lexical_alternative
  - marker: b
    text: 本句希腊语的表达颇为奇特；译文保留其外在迹象显露一个人情形的意象，没有具体限定所显明的是性格、身份还是处境。
    reason: translation_ambiguity
lexical_decisions:
- source_word: στολισμός
  choice: 装束
  rationale: 指外在的装扮或衣着；“装束”既涵盖衣着，也保留整体外在呈现的意味。
- source_word: ἀνδρός
  choice: 男人的
  rationale: 原文为阳性单数，明确指男人；译文不将其泛化为“人的”。
- source_word: γέλως ὀδόντων
  choice: 牙齿的笑
  rationale: 直译为“牙齿的笑”。希腊语意象不寻常，可能指笑容或露齿而笑；正文保留其生动而含混的表达，脚注说明可能含义。
- source_word: βήματα
  choice: 步履
  rationale: 可指脚步或走路的姿态；“步履”在现代中文中自然庄重，也保留这两层可能。
- source_word: ἀνθρώπου
  choice: 人的
  rationale: 此词比前面的ἀνήρ范围更广，泛指人，因此译作“人的”。
- source_word: ἀναγγέλλει
  choice: 显明
  rationale: 该动词意为报告、宣告或使人知道；在本句中表示外在迹象把有关此人的事显露出来。
- source_word: τὰ περὶ αὐτοῦ
  choice: 他的情形
  rationale: 原文宽泛地指“关于他的事”；“他的情形”较符合现代中文，同时不把意思限定为品格、身份或内心。
