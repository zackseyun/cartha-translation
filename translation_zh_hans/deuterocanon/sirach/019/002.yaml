  text: Wine and women lead the heart astray[a], and a bold soul destroys its owner.
translation:
  language: zh_hans
  text: 酒和女人使人心变得轻浮[a]；胆大妄为的心灵必毁掉它的主人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本作：“酒和女人会使明智的人偏离；依恋妓女的人会变得更加鲁莽。”希伯来文本的后半句与此差异显著。
    reason: alternative_reading
lexical_decisions:
- source_word: יַיִן
  choice: 酒
  rationale: 直译为“酒”，保留警戒中并列的第一项；上下文自然指酒类饮品。
- source_word: נָשִׁים
  choice: 女人
  rationale: 希伯来语复数通常意为“女人”，本句本身没有限定为妻子或妓女，因此不作窄化。
- source_word: יַפְחִיזוּ
  choice: 使……变得轻浮
  rationale: 该动词含使人轻率、浮躁或鲁莽之意；与“心”搭配时，“使人心变得轻浮”自然地表达内在判断和欲望失去稳重，且没有把含义过度限定为单纯“迷失”。
- source_word: לֵב
  choice: 人心
  rationale: “心”在希伯来语中是思想、意愿与欲望的内在中心；译作“人心”既保留原文意象，又符合现代汉语。
- source_word: נֶפֶשׁ
  choice: 心灵
  rationale: 此处指人的生命性自我或内在生命。译作“心灵”保留其庄重感，并与后面的阴性代词关系相协调；不将其解释为技术性的灵魂观。
- source_word: עָזָה
  choice: 胆大妄为的
  rationale: 该词可指强悍、大胆或放肆；在道德警戒语境中，“胆大妄为”传达负面的逞强与鲁莽，同时不擅自加入性方面的限定。
- source_word: תַשְׁחִית
  choice: 必毁掉
  rationale: 动词表示毁坏、败坏；“毁掉”保留警告的强烈程度。未完成体在箴言式陈述中表达必然或典型后果，故用“必”。
- source_word: בְעָלֶיהָ
  choice: 它的主人
  rationale: 字面是“它的主人／拥有者”；阴性后缀回指“心灵”。此译保留“心灵反过来毁掉其拥有者”的拟人化张力。
theological_decisions:
- issue: 以现存希伯来文本为主要见证，同时处理希腊平行文本的显著差异
  choice: 正文直接翻译希伯来文，将希腊文的不同读法收入脚注
  alternative: 按希腊文译为“酒和女人会使明智的人背离正道；依恋妓女的人会变得更加鲁莽”
  rationale: 现存希伯来文完整可译，应作为正文依据。希腊文与第一分句大意相近，但明确提到“明智的人”，第二分句又改为“依恋妓女的人”，与希伯来文“胆大妄为的心灵毁掉它的主人”差异显著，因此不可在正文中调和，须如实保留为异读。
- issue: נֶפֶשׁ עָזָה 的道德语气
  choice: 译作“胆大妄为的心灵”
  alternative: 译作“刚强的心灵”或“大胆的灵魂”
  rationale: 上下文及谓语“毁掉”表明此处的“大胆”带负面道德色彩；“胆大妄为”能传达鲁莽和放肆，但不把它专门解释成淫乱。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体。保留“心”和“心灵”的希伯来式内在人观，以及“心灵毁掉它的主人”这一刻意突出的拟人表达。脚注标记置于与希腊异读相关的第一分句之后。
