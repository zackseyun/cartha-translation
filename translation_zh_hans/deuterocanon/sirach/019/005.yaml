  text: Whoever rejoices in heart will be condemned[b][a], and whoever hates talk is lessened by evil.
translation:
  language: zh_hans
  text: 心里喜乐的人，必被判为有罪；厌恶闲言[a]的人，必因恶而受损[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “闲言”所译的希腊词也可指“言谈”“多嘴”或“喋喋不休”；这里很可能是指过多或无益的话，而非一切言语。
    reason: lexical_alternative
  - marker: b
    text: 希腊文这一短语十分简练，直译近于“因恶而被减少”或“在恶中被减少”。除“因恶而受损”外，也可理解为“在恶中被减少”；其确切关系并不明确。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ εὐφραινόμενος καρδίᾳ
  choice: 心里喜乐的人
  rationale: 按现有希腊文本直译其内在的喜乐状态，不依上下文擅自补出“以恶为乐”等原文没有的宾语；同时保留这句箴言本身令人意外的张力。
- source_word: καταγνωσθήσεται
  choice: 必被判为有罪
  rationale: 该词为将来时被动态，带有作出不利判断或定罪的裁决意味；“被判为有罪”比单说“受责备”更能体现其判罪色彩，又不额外引入刑罚含义。
- source_word: λαλιὰν
  choice: 闲言
  rationale: λαλιά可泛指言谈，但智慧文学语境很可能指多余、轻率或无益的话。“闲言”自然简洁，并由脚注保留“言谈、多嘴”的词义范围。
- source_word: ἐλαττονοῦται κακίᾳ
  choice: 必因恶而受损
  rationale: ἐλαττονοῦται表示被减少、削弱或受亏损；κακίᾳ的与格可作手段理解为“因恶”，但也可能表示范围，即“在恶上减少”。正文采用较自然的工具性理解，脚注保留另一种读法。
theological_decisions:
- issue: “心里喜乐”与随后被判有罪之间的突兀关系
  choice: 不补出喜乐的邪恶对象
  alternative: 译作“心里以恶为乐的人”或“以作恶为乐的人”
  rationale: 所给希腊文本只有καρδίᾳ“心里”，没有“恶”作为喜乐对象。即使上下文或其他文本传统可能支持补足，当前原文证据不足以在正文中消除这一张力。
- issue: 第二分句中κακίᾳ的句法关系
  choice: 正文采用工具性读法“因恶而受损”，脚注注明范围性读法
  alternative: “必在恶上减少”，即变得较少作恶或恶有所减少
  rationale: 希腊文极其简练，两种理解均有语法可能；不把一种道德因果解释包装成唯一明确含义。
translation_notes:
  register: 采用现代、庄重而易懂的箴言体；以“……的人，必……”对应两个泛指分词结构。正文尽量顺畅，同时用脚注保存λαλιά及κακίᾳ的真实歧义。
