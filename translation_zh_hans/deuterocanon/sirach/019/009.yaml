  text: Have you heard a word? Let it die with you[a]; take courage[b], it will not burst you open.
translation:
  language: zh_hans
  text: 你听说了一件事吗？让它随你一同死去[a]。放心，它绝不会把你胀破[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一件事”也可译作“话语”或“传闻”；原文可泛指所听闻的事。
    reason: lexical_alternative
  - marker: b
    text: 原文是鲜明的夸张意象，直译为“它绝不会使你破裂／胀破”；意思是把所听之事守住，并不会使你承受不住。
    reason: cultural_note
lexical_decisions:
- source_word: ἀκήκοας
  choice: 你听到……吗
  rationale: 希腊语完成时在这里带有反问和现实关联；汉语用“你听到……吗”自然地表达已经听闻某事并引出劝诫。
- source_word: λόγον
  choice: 一句话
  rationale: λόγος在此可指所听见的话、事情或传闻。“一句话”保留箴言的简洁，也不过度限定其内容；其他可能含义列入脚注。
- source_word: συναποθανέτω σοι
  choice: 让它与你一同死去
  rationale: 命令式以死亡作比喻，意为所听之事到你这里为止，不再外传。直译保留原文鲜明而凝练的意象。
- source_word: θάρσει
  choice: 放心吧
  rationale: θαρσέω命令式表示鼓起勇气、不要害怕。语境是在安慰听者，秘密留在心里也不会造成伤害；“放心吧”在现代汉语中自然，并保留劝慰语气。
- source_word: οὐ μή
  choice: 绝不会
  rationale: οὐ μή构成强烈否定；“绝不会”比单纯“不会”更充分地体现其强调语气。
- source_word: ῥήξει
  choice: 把你撑裂
  rationale: ῥήγνυμι意为使破裂、迸裂。这里以夸张的身体意象说明守住所听之事不会使人胀破；“撑裂”既保留由内而外破裂的画面，也符合汉语表达。
