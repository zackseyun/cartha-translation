  text: From appearance a man is recognized[a], and from the expression of the face one who has understanding is recognized.
translation:
  language: zh_hans
  text: 从外表可以认出一个人；从脸上的神态[a]可以认出有见识的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脸上的神态”或译“脸上的仪态”。
    reason: 保留ἀπαντήσεως προσώπου这一不常见短语在“表情、神态”与“仪态、气度”之间的词义幅度。
lexical_decisions:
- source_word: ὁράσεως
  choice: 外表
  rationale: 在ἀπὸ ὁράσεως中，指一个人可被看见的外在样貌，而非“观看”这一动作；“外表”符合现代汉语箴言式表达。
- source_word: ἐπιγνωσθήσεται
  choice: 可以认出
  rationale: 未来被动式表示依据可见迹象被人识别；在汉语格言中用“可以认出”自然地表达这种可辨识性，同时保留被动含义。
- source_word: ἀνήρ
  choice: 一个人
  rationale: 原词为阳性单数，在此用于普遍性的智慧格言；现代汉语“一个人”既自然，也不把含义误限为丈夫或成年男性。
- source_word: ἀπαντήσεως προσώπου
  choice: 面容的神态
  rationale: 该短语直译生硬，所指是迎面可见的面部表现或仪态；“面容的神态”清楚传达可观察的脸部表情与气度。
- source_word: νοήμων
  choice: 明智的人
  rationale: 该词表示有理解力、辨识力的人；“明智的人”简洁自然，并保持智慧文学语域。
