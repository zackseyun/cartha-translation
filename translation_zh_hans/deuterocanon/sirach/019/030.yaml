translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“服饰—笑容—步履”形成简洁并列；前半保留“男子”，后半依照希腊文词汇变化改用泛指的“人”。主文追求自然可读，脚注则保存希腊文中较生硬或宽泛的表达。
