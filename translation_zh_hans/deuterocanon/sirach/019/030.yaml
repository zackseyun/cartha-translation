  text: A man's attire[a], and the laughter of his teeth, and a person's steps proclaim what is about him.
translation:
  language: zh_hans
  text: 一个男子的服饰、他露齿的笑容[a]，以及一个人的步履，都显明他是怎样的人。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“牙齿的笑”，指笑时从牙齿显出的面部表情。
    reason: 说明原文不寻常的具体意象及其惯用含义。
  - marker: b
    text: 原文也可译作“都显明关于他的事”，范围可能包括他的品性、状况或其他与他有关的事。
    reason: 保留τὰ περὶ αὐτοῦ较宽泛的语义，避免把它完全限定为品格判断。
lexical_decisions:
- source_word: στολισμὸς
  choice: 服饰
  rationale: 该词指装饰、装束或外在的穿戴；“服饰”在此自然地表达可观察的外在装束，又不把含义扩大为笼统的“外表”或道德意义上的“仪表”。
- source_word: ἀνδρὸς
  choice: 一个男子的
  rationale: ἀνήρ的属格单数明确指男性；译作“一个男子的”，保留原文的性别与单数形式。
- source_word: γέλως ὀδόντων
  choice: 露齿的笑容
  rationale: 原文直译为“牙齿的笑”，是借牙齿显露来描写笑容的具体意象。汉语以“露齿的笑容”表达这一画面，避免生硬难解；直译信息收入脚注。
- source_word: βήματα ἀνθρώπου
  choice: 一个人的步履
  rationale: βήματα指脚步，也可由脚步引申为步态；“步履”兼有两层意味。ἀνθρώπου比前面的ἀνδρός更为泛指，因此译作“一个人的”，保留原文用词的转换。
- source_word: ἀναγγέλλει
  choice: 显明
  rationale: 该动词指报告、宣告或使人知道；在服饰、笑容和步履作为可观察迹象的语境中，“显明”自然表达其揭示作用。
- source_word: τὰ περὶ αὐτοῦ
  choice: 他是怎样的人
  rationale: 原文较直译为“关于他的事”。此处所列外在表现让人认识这个人，汉语以“他是怎样的人”表达最为自然；因这一表达可能较偏向人的品性，脚注保留原短语更宽泛的范围。
