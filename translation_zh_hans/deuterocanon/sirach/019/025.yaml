  text: A man is recognized by his appearance[a], and a man of understanding is recognized by the expression of his face.
translation:
  language: zh_hans
  text: 从外表可以认出一个人；有悟性的人，也可以从他的面容神态[a]认出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译近于“从面容的相遇（或迎面呈现）”；这可能是指人在与人相遇时，脸上所显出的神态。
    reason: 原文ἀπὸ ἀπαντήσεως προσώπου措辞不寻常，译文需说明其字面意象及语义上的不确定性。
lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: 从外表
  rationale: ὅρασις在此指可见的样貌或外观；与ἀπό连用，表示据以辨认的外在根据。“从外表”自然地保留这一含义。
- source_word: ἐπιγνωσθήσεται
  choice: 可以认出
  rationale: 这是将来时被动式，在智慧文学中表达一般规律；汉语用“可以认出”既保留被辨识的意思，也符合格言语气。
- source_word: ἀνήρ
  choice: 一个人
  rationale: ἀνήρ可指成年男子，但此处格言论及由外在表现识人；现代汉语“一個人”自然，且不额外强化原句未着重的性别信息。
- source_word: ἀπὸ ἀπαντήσεως προσώπου
  choice: 从他的面容神态[a]
  rationale: 字面结构近于“从面容的相遇/迎面呈现”。“面容神态”表达人在相遇时脸上显出的样子，同时以脚注保留短语本身的含混性。
- source_word: νοήμων
  choice: 有悟性的人
  rationale: νοήμων表示有理解力、明辨力的人。“有悟性”符合智慧文学语境，又不局限为一般智力高低。
