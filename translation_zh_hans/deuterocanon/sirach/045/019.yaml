base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/019.yaml
  text: The men of Dathan and Abiram[a], and the company of Korah in the strength of their anger— Yahweh saw and was enraged[b], and he consumed them in the heat of his anger.
translation:
  language: zh_hans
  text: 大坍和亚比兰的同党，以及可拉的会众，怒气强盛[a]——雅威看见了，就震怒，在他烈怒中将他们灭绝。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译近于“在他们怒气的威势中”。希伯来语表达简练；“他们的”通常回指前面所列的群体。
    reason: lexical_alternative
  - marker: b
    text: 希腊平行文本在此较长：“他们在盛怒中被终结；他向他们施行异迹，为要用他火焰的烈火毁灭他们。”现存希伯来文本没有这些扩展细节。
    reason: alternative_reading
lexical_decisions:
- source_word: אנשי דתן ואבירם
  choice: 大坍和亚比兰一伙的人
  rationale: אנשי直译为“……的人”；结合叛乱派系的语境，译作“一伙的人”既自然，又不把他们过度解释为正式组织或单纯的“追随者”。人名采用现代中文圣经中常见的音译。
- source_word: ועדת קרח
  choice: 以及可拉的会众
  rationale: עדה可指会众、集会或群体。“会众”保留其集体性，也避免把原词窄化为后世特定宗教制度。
- source_word: בעזוז אפם
  choice: 都怀着猛烈的怒气
  rationale: עזוז表示强盛、猛烈，אף在此表示怒气；复数后缀明确指前述叛乱者。中文补出“都怀着”，使压缩的希伯来语短语自然可读，同时不消除它究竟修饰两个群体还是概括整场反叛的张力。
- source_word: וירא יהוה
  choice: 雅威看见了
  rationale: ראה按通常意义译为“看见”；יהוה作为上帝的专名音译为“雅威”，不以普通称号替代。
- source_word: ויתאנף
  choice: 便震怒
  rationale: אנף的反身词干表达发怒、显出烈怒；“震怒”简洁而庄重，传达其强度。
- source_word: ויכלם
  choice: 将他们灭尽
  rationale: 此形式在短句中有一定难度，但上下文指向彻底的惩罚性毁灭；希腊平行文本的“被终结”和火焰焚灭也支持这一理解。“灭尽”不把希腊文本额外的神迹与火焰细节写入正文。
- source_word: בחרון אפו
  choice: 在他的烈怒中
  rationale: חרון אף是表达强烈愤怒的常见希伯来语搭配；“烈怒”保留强度，现代中文也庄重自然。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 上主／耶和华
  rationale: 原文直接使用四字神名；正文以“雅威”音译，保留其专名性质，不将其改为称号。
- issue: 希伯来文本与较长希腊平行文本的关系
  choice: 以现存希伯来文本为正文，希腊增文置于脚注
  alternative: 把希腊文本中的神迹和火焰焚灭并入正文
  rationale: 希伯来见证在此完整而可信，应居优先地位。希腊文本较长，可帮助确认审判语义，却不应无标记地扩充希伯来正文。
- issue: 怒气所属者的区分
  choice: בעזוז אפם指叛乱者的怒气；בחרון אפו指雅威的烈怒
  alternative: 把前一短语也理解为上帝的怒气
  rationale: 前一短语的复数后缀“他们的”自然回指大坍、亚比兰与可拉的群体；后一短语的单数后缀“他的”则回指雅威。译文明确保留这种对照。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。破折号承接希伯来语中先列举叛乱群体、随后转入雅威审判的压缩结构；避免补入希腊平行文本独有的神迹与火焰意象。所有脚注标记均已置于正文对应位置。
