  text: and pomegranates in abundance all around[a], to make melody at his steps.
translation:
  language: zh_hans
  text: 又有许多石榴饰物，围绕在他四周[a]，使他行走时发出悦耳的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文本较长：“他又用石榴和四围许多金铃铛环绕他，使他行走时发出声音，使圣所中能听见这声音，作为他百姓子孙的记念。”现存希伯来文本较短，只提到石榴饰物和随脚步发出的声响。
    reason: textual_variant
lexical_decisions:
- source_word: ורמונים
  choice: 石榴饰物
  rationale: 原文直译为“石榴”；此处语境指大祭司衣袍上的石榴形装饰。译出“饰物”可避免被误解为鲜果，同时不把希腊文所明说的铃铛加入希伯来文本。
- source_word: המון
  choice: 许多
  rationale: 表示数量众多；“许多”简明自然，保留复多之意。
- source_word: סביב
  choice: 环绕四周
  rationale: 表达这些饰物围绕衣袍排列的空间关系。
- source_word: לתת
  choice: 使……发出
  rationale: 这里是不定式目的结构，指这些装饰伴随脚步产生声响；现代汉语以“使……发出”表达自然。
- source_word: נעינה
  choice: 悦耳的声响
  rationale: 此词指带有音乐性质的声音。译作“悦耳的声响”既保留音乐意味，也没有越过希伯来文而直接指定为铃声。
- source_word: בצעדיו
  choice: 他行走时
  rationale: 介词短语表示声音随他的脚步而产生；汉语用时间结构表达最为自然。
theological_decisions:
- issue: 希伯来文短读与希腊文较长读法之间的文本差异
  choice: 正文依据现存希伯来文，只写石榴饰物及随脚步而发的声响。
  alternative: 采用希腊文较长读法，加入“许多金铃铛”、圣所中的响声和供百姓子孙记念等内容。
  rationale: 现存希伯来文在此较短，且没有明说铃铛及希腊文后半句。正文以高可信度的希伯来见证为准；希腊文有助于确认声音与行走相关，但其扩展内容以脚注如实保存，不混入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“石榴饰物”交代祭司衣袍语境；“悦耳的声响”保留原词可能具有的音乐色彩，同时避免将希腊文明确提到的金铃铛直接写入较短的希伯来正文。
