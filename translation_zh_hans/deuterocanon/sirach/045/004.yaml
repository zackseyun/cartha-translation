  text: In his faithfulness and humility[a], he chose him from all flesh.
translation:
  language: zh_hans
  text: 上帝因他的忠信和谦卑，从一切有血肉者中拣选了他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“他在他的信心和温柔中使他成圣；从一切有血肉者中拣选了他。”希伯来文见证没有希腊文中“使他成圣”这一明确动词；“忠信”也可译作“信心”。
    reason: alternative_reading
lexical_decisions:
- source_word: באמונתו
  choice: 因他的忠信
  rationale: אֱמוּנָה既可指信，也可指忠信、可靠。这里与“谦卑”并列，描写摩西蒙拣选时受到称许的品格，因此译为“忠信”较自然；介词ב在此可表达依据或缘由，汉语用“因”使句意清楚。
- source_word: ובענותו
  choice: 和谦卑
  rationale: עֲנָוָה表示谦卑、温柔或柔和；“谦卑”是现代汉语中清楚、庄重且贴合人物品格的表达。
- source_word: בחר בו
  choice: 拣选了他
  rationale: בחר加ב是希伯来语中“选择某人”的常见结构。“拣选”保留经文语体，同时不加入希伯来原文所没有的额外动作。
- source_word: מכל בשר
  choice: 从凡有血肉的众生中
  rationale: 字面为“从一切肉体中”。“凡有血肉的众生”保留圣经惯用意象及普遍范围，又比孤立的“一切肉体”更符合现代汉语。
theological_decisions:
- issue: אמונה / πίστις在称许摩西的语境中应译为“忠信”还是“信心”
  choice: 忠信
  alternative: 信心
  rationale: 希伯来文本在此把אמונה与谦卑并列，更可能是在称许摩西可靠、忠诚的品格。希腊文πίστις也容许“信心”的理解，因此在脚注中保留这一可能，不把神学张力静默消除。
- issue: 是否纳入希腊平行文本中的“使他成圣”
  choice: 正文不纳入
  alternative: 在正文译作“因他的信心和温柔，使他成圣；又从凡有血肉的众生中拣选了他”
  rationale: 高可信度的希伯来见证没有对应“使他成圣”的动词，故正文以希伯来原文为准；希腊文本的增文属于重要异读，在脚注中完整说明。
- issue: בחר的隐含主语
  choice: 明确译为“上帝”
  alternative: 仅译“他”
  rationale: 本节上下文的施事者是上帝；现代汉语若连续使用“他”，容易误解为摩西拣选了另一人。明确主语是为消除代词歧义，并非增添新的神学主张。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“拣选”保留圣经表达；“凡有血肉的众生”兼顾原文意象与汉语可读性。脚注标记[a]已置于正文相关句末。
