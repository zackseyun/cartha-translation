base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/017.yaml
  text: And he gave him his commandments[a], and granted him authority in statute and judgment, to teach Jacob his testimonies and to enlighten Israel with his law.
translation:
  language: zh_hans
  text: 他把自己的诫命赐给他[a]，又赋予他在律例和审判上的权柄，好教导雅各他的法度，用他的律法光照以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存开罗藏经库希伯来文本节较短，只作：“他把自己的诫命赐给他，又赋予他在律例和审判上的权柄。”后面的“好教导雅各他的法度，用他的律法光照以色列”有希腊文见证支持；这里将其收入正文，因为现存希伯来文这一行可能有所缩略。
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לו מצותיו
  choice: 他把自己的诫命赐给他
  rationale: 直译希伯来文“他将他的诫命给他”；“赐给”符合上帝授予亚伦使命的语境，“诫命”保留盟约和律法色彩。
- source_word: וימשילהו
  choice: 又使他……掌权
  rationale: 该词的使役形式表示“使其治理”或“赋予权柄”；这里指祭司在律法事务中受托行使权柄，并不暗示王权。
- source_word: בחוק ומשפט
  choice: 在律例和判决上
  rationale: 保留希伯来文法律性并列结构。介词表达较为凝练；中文用“在……上”自然呈现其权柄所及的法律领域。
- source_word: διδάξαι τὸν Ἰακὼβ τὰ μαρτύρια
  choice: 好把他的法度教导雅各
  rationale: 此目的分句见于希腊文见证。“法度”适合表达盟约语境中的 μαρτύρια，也比字面化的“见证”更便于现代读者理解。
- source_word: καὶ ἐν νόμῳ αὐτοῦ φωτῖσαι Ἰσραήλ
  choice: 用他的律法光照以色列
  rationale: 保留 φωτίζω 的光照隐喻，并将 ἐν 表达为工具意义的“用”；措辞自然且庄重。
theological_decisions:
- issue: 是否以希腊文补足现存希伯来文较短的经句
  choice: 在正文中收入“好把他的法度教导雅各，用他的律法光照以色列”
  alternative: 只译现存希伯来文：“他把自己的诫命赐给他，又使他在律例和判决上掌权。”
  rationale: 现存开罗藏经库希伯来文到“律例和判决”即止，而希腊文保存了语意连贯的目的分句，并符合本段所述亚伦的教导职责。正文采用较完整的见证，同时以脚注如实说明文本差异。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“律例、判决、法度、律法”保留原文的盟约法律语域；代词所指依上下文维持原文表达，不额外加入解释性专名。
