base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/021.yaml
  text: He gave him the choicest holy bread[a]; they shall eat the food offerings of Yahweh. The bread of the Presence is his portion[c][b], a gift to him and to his offspring.
translation:
  language: zh_hans
  text: 他把圣物中最上好的饼赐给他[a]；他们要吃献给雅威的火祭[b]。陈设饼[c]是他的份，是赐给他和他后裔的礼物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文表述紧凑，也可较直译为“他把圣物中居首（或最好的）的饼赐给他”。“圣物中居首”也可理解为圣物中最上好的份额。
    reason: 保留ראשית קדש与לחם的字面结构及“首要／上好”的可能含义。
  - marker: b
    text: “火祭”指经火献给雅威的祭物；这些祭物中有按规定归祭司食用的份。
    reason: 说明אשי的礼仪术语含义，避免读者误以为祭物全部焚尽。
  - marker: c
    text: “陈设饼”较字面的意思是“面前的饼”，即陈设在上帝面前的圣饼。
    reason: 解释לחם פנים这一固定礼仪称谓。
lexical_decisions:
- source_word: ראשית קדש
  choice: 圣物中上好的
  rationale: ראשית可指首先、首要或上好的部分；与קדש连用，指圣物中居首或精选的份额。译文保留其优先性与神圣性，不把它过度限定为“初熟之物”。
- source_word: לחם
  choice: 食物
  rationale: 该词字面为“饼”，也可泛指食物。此处与“赐给他”连用，表达祭司所得的可食圣物，译作“食物”在现代汉语中更自然；字面形式在脚注中说明。
- source_word: אשי יהוה
  choice: 献给雅威的火祭
  rationale: אשי是祭祀术语，指经火献上的祭物。“火祭”简洁地保留献祭方式与礼仪语境；יהוה按其专名译作“雅威”。
- source_word: יאכלון
  choice: 他们要吃
  rationale: 希伯来语为复数，所指自然包括亚伦及其祭司后裔。“要吃”保留未完成式在祭司制度语境中的规定或持续许可意味。
- source_word: לחם פנים
  choice: 陈设饼
  rationale: 这是放置在上帝面前的圣饼的固定礼仪称谓。中文“陈设饼”简明且通行，其较贴近字面的含义在脚注中说明。
- source_word: חלקו
  choice: 是他的份
  rationale: חלק指分得、划定的份额。“他的份”自然、简洁，并保留祭司受分配之权利的含义。
- source_word: ומתנה לו ולזרעו
  choice: 是赐给他和他后裔的礼物
  rationale: מתנה指礼物或赐予；זרעו在这里指延续的祭司家系，故译作“后裔”，避免字面“种子”造成误解。
- source_word: τῷ σπέρματι αὐτοῦ
  choice: 他后裔
  rationale: 希腊平行文本印证受赐者包括亚伦的后代，与希伯来语זרעו所表达的家系延续一致。
theological_decisions:
- issue: 上帝圣名的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名יהוה；译作“雅威”保留其作为盟约专名的性质，而不以称号代替。
- issue: 祭司所得圣物的表达
  choice: 圣物中上好的／火祭／陈设饼
  alternative: 圣物之首／食物祭／面前之饼
  rationale: 译文保留祭司获赐祭物份额的礼仪背景，同时采用现代读者可理解的祭祀用语；对压缩或较字面的读法用脚注交代，不将希伯来语的含混之处强行化解。
- issue: 复数“他们”的所指
  choice: 保留“他们要吃”
  alternative: 改为“他要吃”或明说“祭司们要吃”
  rationale: 希伯来语动词明确为复数，但本句没有再次明说主语。保留代词既忠于语法，也不把上下文推定直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。正文以短句呈现希伯来诗行的并列结构；“雅威”“火祭”“陈设饼”保留经文的盟约与圣所语境，较生硬的字面形式置于脚注。
