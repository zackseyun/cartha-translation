  text: Beloved by God and men was Moses[c][b][a], whose memory is for blessing.
translation:
  language: zh_hans
  text: 摩西[b]蒙上帝和众人所爱[a]；他的记念是蒙福的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众人”：希伯来语也可译作“人们”或较字面的“男人们”；希腊语平行文本使用含义较广的词，可指“人类”或“众人”。
    reason: alternative_reading
  - marker: b
    text: 希腊语平行文本在“摩西”以前还有较长的话：“又从他而出一位仁慈的人，在凡有血肉者眼前蒙恩。”这些话不见于现存的希伯来语文本。
    reason: textual_variant
  - marker: c
    text: “他的记念是蒙福的”：希伯来语较直译为“他的记念归于美善”或“他的记念是为着美善”；希腊语作“他的记念在祝福中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אהוב
  choice: 蒙……所爱
  rationale: 保留希伯来语被动、尊崇性的含义，并与希腊语 ἠγαπημένον 相合；现代汉语中自然庄重。
- source_word: אלהים
  choice: 上帝
  rationale: 此处指以色列的上帝；“上帝”是现代标准普通话中清楚而庄重的对应表达。
- source_word: ואנשים
  choice: 和众人
  rationale: אנשים 可指男人，也常泛指人们；希腊语 ἀνθρώπων 也支持“众人／人类”。“众人”避免在汉语中误解为只限男性，同时保留复数群体意义。
- source_word: משה
  choice: 摩西
  rationale: 采用该人名在现代中文圣经传统中的标准译名。
- source_word: זכרו לטובה
  choice: 愿人永远怀念他
  rationale: 该希伯来语纪念用语字面近于“愿他的记念归于美善／好处”，实际表达对逝者的美好、蒙福记念。中文以祝愿式“愿人永远怀念他”传达语用意义；希腊语“他的记念在祝福中”印证其褒扬意味。
theological_decisions:
- issue: 希伯来语短句与较长希腊语平行文本之间的取舍
  choice: 正文依据现存希伯来语，只译“摩西蒙上帝和众人所爱；愿人永远怀念他”。
  alternative: 按希腊语增译“又从他而出一位仁慈的人，在凡有血肉者眼前蒙恩”等内容。
  rationale: 所给希伯来语见证可信度高，应主导正文；希腊语仅用于核对和阐明希伯来习语，不把希伯来语没有的较长材料直接纳入正文。
- issue: זכרו לטובה 的表达
  choice: 用祝愿式“愿人永远怀念他”表达美好而蒙福的纪念。
  alternative: 较直译为“他的记念是为着美善”或“他的记念在祝福中”。
  rationale: 原文含纪念性的祝福意味，若机械直译为“为着好处”在现代汉语中晦涩且容易误解；正文传达其语用功能，脚注保留较直译形式和希腊语印证。
translation_notes:
  register: 采用现代、庄重、易懂的书面普通话。前半句保留原文的被动尊崇语气；后半句以自然的中文纪念祝语表达希伯来习语。所有脚注标记均置于正文相关词句之后。
