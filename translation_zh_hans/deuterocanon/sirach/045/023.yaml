base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/023.yaml
  text: And Phinehas son of Eleazar inherited a third place in might[c][b][a], because he was zealous for the God of all and stood in the breach for his people.
translation:
  language: zh_hans
  text: 以利亚撒的儿子非尼哈也在勇力上承继第三位[a]；因为他为万有的上帝大发热心，并为他的百姓站在破口中[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“在荣耀上第三”；希伯来文作“在勇力上承继第三位”。正文依现存希伯来文；希腊文显示此语也可带有尊荣、名位的意味。
    reason: textual_variant
  - marker: b
    text: “站在破口中”是希伯来语比喻，指百姓遭逢危难时挺身介入，带有保护或代求的意味。
    reason: cultural_note
  - marker: c
    text: 希腊文在此后续有“并且他为以色列赎罪”；现存希伯来文没有这句话。
    reason: textual_variant
lexical_decisions:
- source_word: נחל שלישי
  choice: 承受了第三位
  rationale: נחל可指承受、取得，שלישי为“第三”。结合祭司人物受称颂的语境，译作位次或尊位较自然；同时保留“承受”的隐喻，不把含义限定为产业继承。
- source_word: בגבורה
  choice: 凭勇力
  rationale: גבורה表示力量、英勇或勇武；“凭勇力”既简洁，也切合非尼哈果断行动的语境。希腊文作“在荣耀上第三”，属于值得注明的异文。
- source_word: בקנאו
  choice: 因为他……大发热心
  rationale: ב加不定式可表达原因或情境；此处与前句所述尊位相连，译出因果关系，同时“大发热心”自然传达 קנא 的强烈热忱。
- source_word: לאלוה כל
  choice: 为万有之上帝
  rationale: 直译为“为一切之上帝”。“万有之上帝”保留这一独特称号所表达的普世主权，不改换成其他传统称谓。
- source_word: ויעמוד בפרץ
  choice: 站在破口之中
  rationale: 保留希伯来语的危机隐喻，指在群体面临灾祸时挺身介入，带有保护或代求的意味。
- source_word: עמו
  choice: 为他的百姓
  rationale: 在“站在破口”这一习语中补出“为”，清楚表达非尼哈代表百姓采取行动；“他的”按原文保留指代关系。
theological_decisions:
- issue: 非尼哈的热心与所得尊位之间的关系
  choice: 把他的尊位表述为因他为上帝热心并为百姓挺身而得
  alternative: 也可较弱地理解为仅说明他获尊荣时的情境，而不突出直接因果
  rationale: 希伯来文 בקנאו 中的 ב 加不定式自然可有原因或时机之义；上下文较支持因果联系，但不补入《民数记》叙事中本节未明说的细节。
- issue: 希腊文末句的赎罪表述
  choice: 正文依现存希伯来文止于“他的百姓”，不加入“他为以色列赎罪”
  alternative: 希腊文续有“并且他为以色列赎罪”
  rationale: 主要依据高可信度的希伯来文见证；希腊文较长读法以异文脚注保留，避免将扩展内容无标记地并入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“非尼哈”“以利亚撒”沿用常见圣经人名译法；“万有之上帝”保留原文独特神称；“站在破口之中”保留诗性隐喻，并用脚注说明。
