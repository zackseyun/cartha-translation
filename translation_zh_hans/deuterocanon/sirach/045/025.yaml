base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/025.yaml
  text: 'And his covenant was with David son of Jesse, from the tribe of Judah: the inheritance of the king is from son to son alone, but the inheritance of Aaron is also for his offspring[a].'
translation:
  language: zh_hans
  text: 他也与犹大支派中耶西的儿子大卫立了约：王位的继承只沿一条父子相承的世系传递，亚伦的产业却也归他的后裔所有[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希伯来文见证较短，且似有压缩；希腊文平行本保存了较完整的对比：王位的继承沿单一王朝世系承传，而亚伦的产业则归他的后裔。
    reason: textual_variant
lexical_decisions:
- source_word: וגם בריתו עם דוד
  choice: 他也与……大卫立了约
  rationale: 希伯来文直译近于“他的约也与大卫”，其中代词所指按上下文是上帝；中文用主动表达更自然，并保留“也”所显示的并列关系。
- source_word: בן ישי למטה יהודה
  choice: 犹大支派中耶西的儿子
  rationale: 保留现存希伯来文中的父名“耶西”，并将מטה按族谱语境译为“支派”。
- source_word: κληρονομία βασιλέως
  choice: 君王的产业
  rationale: κληρονομία指承受所得的产业或基业；“产业”既能表达继承关系，也与后文亚伦所得的份形成具体平行。
- source_word: υἱοῦ ἐξ υἱοῦ μόνου
  choice: 只从儿子传给儿子
  rationale: 保留希腊文中父子相承及μόνου所表达的限定性，同时不把原文进一步解释成特定继承制度。
- source_word: κληρονομία Ἀαρὼν καὶ τῷ σπέρματι αὐτοῦ
  choice: 亚伦的产业却也归他的后裔所有
  rationale: σπέρμα在此指后裔；“却”显明与君王单线承继的对照，“也”反映希腊文καί，并与希伯来文所见亚伦后裔承受祭司职分的思想一致。
theological_decisions:
- issue: 希伯来见证压缩且与希腊平行经文存在重大差异
  choice: 以现存希伯来文的“大卫、耶西、犹大支派”为基础，并采用希腊文保存的君王与亚伦产业之完整对比
  alternative: 只译现存希伯来文，或完全依照希腊文而省去“耶西”
  rationale: 所给希伯来文本在本节交界处显得压缩，且标注为重大不匹配；希腊文保存了完整的对偶结构。综合二者既优先保留可靠的希伯来材料，也不遗漏希腊平行本所保存的本节内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“立了约”“支派”“后裔”是普通读者易懂且适合经文语体的表达；正文保留原文对继承方式的张力，不进一步规定其制度细节。
