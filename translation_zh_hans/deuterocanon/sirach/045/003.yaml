base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/003.yaml
  text: At his word the signs came quickly[a], and he strengthened him before a king. He commanded him concerning the people[c][b], and showed him his glory.
translation:
  language: zh_hans
  text: 他的话一出，神迹便迅速出现[a]；上帝使他在一位君王面前刚强[b]。上帝就百姓的事吩咐他，并让他看见上帝的荣耀[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“他借着自己的话止息了神迹”，与希伯来文“神迹便迅速出现”不同。
    reason: textual_variant
  - marker: b
    text: 希腊文作“他在众王面前荣耀了他”，而不是希伯来文的“使他在一位君王面前刚强”。
    reason: textual_variant
  - marker: c
    text: 这里的希伯来文本较难确定；按现存字形可理解为“他们看见了他的荣耀”，但希腊文支持“让他看见上帝的荣耀”，正文采用后者。
    reason: textual_variant
lexical_decisions:
- source_word: בדבריו
  choice: 他的话一出
  rationale: ב在这里可表凭借或伴随情形；译为“他的话一出”既自然，也保留神迹随其话语发生的关联。希腊文同样以“他的话语”为中心。
- source_word: האותות
  choice: 神迹
  rationale: אותות直译为“记号、征兆”，在此语境中指超自然的标记性作为；现代汉语用“神迹”较自然，同时不把它仅仅处理为一般奇事。
- source_word: מהרו
  choice: 迅速出现
  rationale: 该动词表达迅速、赶快；“神迹赶快了”在汉语中不自然，因此以“迅速出现”传达其动态意义。
- source_word: ויחזקהו
  choice: 使他……刚强
  rationale: חזק的使役式通常表示“使强壮、使刚强”；采用这一直接含义，不以希腊文的“使他得荣耀”替代。
- source_word: לפני מלך
  choice: 在一位君王面前
  rationale: 希伯来文“君王”没有冠词，且为单数，故译作“一位君王”；希腊文的复数异文另见脚注。
- source_word: ויצוהו אל העם
  choice: 吩咐他有关百姓的事
  rationale: צוה意为“吩咐、命令”；אל העם在此直译为“向百姓”会造成关系不明，译作“有关百姓的事”保留命令涉及百姓这一较可能的语意，同时不具体补出命令内容。
- source_word: ויראו את כבודו
  choice: 让他看见自己的荣耀
  rationale: 现存希伯来文本的形式较自然地读作“他们看见了他的荣耀”，但希腊文支持“让他看见自己的荣耀”。鉴于此处希伯来文本可能不稳定，正文采用希腊文所保存的较连贯读法，并以脚注说明。
theological_decisions:
- issue: 本节在希伯来文与希腊文之间存在重大差异
  choice: 正文以希伯来文为主；末句因希伯来文本疑难而采用希腊文支持的读法，所有重大差异均在脚注保留。
  alternative: 可严格按现存希伯来文字形译为“他们看见了他的荣耀”；也可全按希腊文译为“他借着他的话止息了神迹，使他在众王面前得荣耀”。
  rationale: 这样既尊重现存希伯来见证的优先地位，又不掩盖末句的文本困难，也避免把希腊传统与希伯来传统之间真实存在的张力静默消除。
- issue: 连续代词所指及隐含施事者
  choice: 首句的“他”指受赞颂的摩西，后两句明确补出“上帝”作为使他刚强、吩咐他并显明荣耀的施事者。
  alternative: 全用“他”，保留原文隐含主语的形式。
  rationale: 汉语若连续使用“他”，容易误解为摩西使自己刚强并向自己显明荣耀；补出语境明确的施事者是为消除语法歧义，并非增加特殊教义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他的话一出”较口语化但不轻浮，有助于自然表达希伯来文的紧凑句式；“君王”“刚强”“荣耀”保持经文语体。脚注分别紧随其所说明的正文，不交叉错置。
