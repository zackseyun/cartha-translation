  yaml_path: translation/deuterocanon/sirach/045/007.yaml
  text: He put splendor upon him and ministered to him with his glory[b][a]; he girded him with the horns of a wild ox and clothed him with bells.
translation:
  language: zh_hans
  text: 他把华美加在他身上，以自己的荣耀服事他；又以野牛的角给他束腰[b]，给他穿上铃铛。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“他与他立永远的约，把百姓的祭司职分赐给他；他以华饰赐福给他，以荣耀的袍服给他束腰。”此处希伯来文本与希腊文本差异很大。
    reason: alternative_reading
  - marker: b
    text: 也可能意为“以野牛高昂的力量”。希伯来语这一短语含义不易确定，其形象可能是比喻性的，并非指实际的角饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוד
  choice: 华美
  rationale: 该词表示可见的威仪、光彩或荣美；“华美”适合祭司授服的语境，也与下文כבוד所译的“荣耀”有所区别。
- source_word: וישרתהו
  choice: 服事他
  rationale: שרת的基本义是服事、供职。此处表达不寻常，却不宜为消除神服事人的张力而改写；因此保留原文的宾语关系。
- source_word: בכבודו
  choice: 以自己的荣耀
  rationale: 保留第三人称单数所属后缀，并用“荣耀”表达כבוד；“以”保留希伯来语介词可能表示方式或所用之物的开放性。
- source_word: ויאזרהו
  choice: 给他束腰
  rationale: אזר在衣着语境中指束腰、系带；“给他束腰”既贴近原文，也符合授服仪式的动作。
- source_word: בתועפות ראם
  choice: 以野牛的角
  rationale: 该短语含义艰深；תועפות可与角或高昂的力量相关，ראם指野牛。正文保留具体鲜明的“野牛的角”意象，另以脚注说明可能的比喻义。
- source_word: וילבישהו פעמונים
  choice: 使他穿戴上铃铛
  rationale: פעמונים明确指铃铛，呼应祭司礼服；中文用“穿戴上”保留לבש的穿戴动作，同时避免把原文未明说的衣物直接补入正文。
theological_decisions:
- issue: 希伯来文本与希腊平行文本在本节有重大差异
  choice: 正文以现存希伯来文本为主，并在脚注完整保存希腊平行文本的不同内容。
  alternative: 按希腊文译为：“他与他立永远的约，把百姓的祭司职分赐给他；他以华饰赐福给他，以荣耀的袍服给他束腰。”
  rationale: 现存希伯来文在此内容完整且可信度高，应作为正文依据；但希腊文并非细微异文，而是实质不同的见证，所以不可默默调和或省略。
- issue: “以自己的荣耀服事他”所呈现的神人关系张力
  choice: 保留原文动词“服事”及宾语关系。
  alternative: 译作“以自己的荣耀装饰他”或“把荣耀赐给他”，以消除神服事人的不寻常表达。
  rationale: 希伯来语שרת确实是“服事、供职”，即使此处表达罕见，也不应因神学上的不适而改换动作；希腊文本的“赐福/装饰”只在脚注中作为另一见证保留。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文尽量保留希伯来文授服动作的具体形象和不寻常的神学张力；“华美”与“荣耀”分别对应两个近义而不完全相同的希伯来词。
