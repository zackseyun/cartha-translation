base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/013.yaml
  text: Before him there had not been such garments[a], and no foreigner will ever wear them; only his sons and his descendants throughout their generations.
translation:
  language: zh_hans
  text: 在他以前，没有过这样的祭司礼服[a]；外人永远不得穿戴这些礼服；惟有他的儿子和世世代代的后裔可以穿戴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半的希伯来文本较为艰涩，按字面可近似译为：“他把这同样托付（或确认此事归给）他和他的儿子；他的儿子也世世代代如此。”希腊平行文本则明确说，外人不得穿这些礼服，只有他的儿子和后裔可以穿戴。
    reason: 说明希伯来文本后半的困难，并交代正文采用希腊平行文本所澄清的含义。
lexical_decisions:
- source_word: לפניו
  choice: 在他以前
  rationale: 这里最自然地表示时间上的先后，指亚伦以前；希腊文 πρὸ αὐτοῦ 也支持这一理解。
- source_word: לא היה כן
  choice: 从未有过这样的
  rationale: 希伯来语表达此前没有同类事物；“这样的”既保留其简洁，也自然承接上下文中的祭司服饰。
- source_word: כן / ὡραῖα（上下文所指的祭司服饰）
  choice: 礼服
  rationale: 现存希伯来文本没有明说宾语，但上下文清楚指大祭司的服饰；“礼服”补出所指而不过度加入希腊文 ὡραῖα 的“华美”含义。
- source_word: זר / ἀλλογενής
  choice: 外人
  rationale: 这里指不属于获授权祭司世系的人。“外人”比现代汉语中的“外国人”更准确，并由后句说明界线在亚伦的后裔。
- source_word: לעולם
  choice: 永远不得
  rationale: 与否定含义结合，表达持续有效的禁止，符合现代汉语习惯。
- source_word: ילבשם
  choice: 穿上
  rationale: לבש 指穿戴衣物；“穿上”简洁自然。
- source_word: האמין לו ולבניו כזה
  choice: 惟有他的儿子……可以穿
  rationale: 传世希伯来文此处艰涩，字面或可理解为“他把这同样托付给他和他的儿子”；正文参照较完整的希腊平行文本，表达只有其子孙可以穿戴，另以脚注保留希伯来文的不确定性。
- source_word: בניו לדורותם / τὰ ἔκγονα αὐτοῦ διὰ παντός
  choice: 世世代代的后裔
  rationale: 兼顾希伯来文“他们的世代”和希腊文“他的后裔，始终如此”，清楚表达世袭延续。
theological_decisions:
- issue: 大祭司礼服是否专属于亚伦的世系
  choice: 正文表达外人不得穿戴，只有亚伦的儿子及其历代后裔可以穿。
  alternative: 按艰涩的希伯来文本，可译为上帝把这事托付或确认给亚伦和他的儿子，并延及他们的世代，而不明确构成“惟有”的例外句。
  rationale: 希腊平行文本明确排除外人并只包括亚伦的子孙，且符合本段论述祭司服饰世袭传承的语境；脚注同时保留希伯来见证的措辞和歧义，避免把不确定处静默抹平。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“礼服”承接上下文中的大祭司服饰；“外人”避免误解为国籍意义上的外国人。分号保留原句前后两层陈述，脚注标记[a]已置于正文相应位置。
