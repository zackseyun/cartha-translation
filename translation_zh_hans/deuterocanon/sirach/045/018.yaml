base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/018.yaml
  text: Strangers grew angry with him[a], and in the wilderness they were jealous of him—men of Dathan and Abiram, and the company of Korah, in fury and wrath.
translation:
  language: zh_hans
  text: 外人向他发怒[a]，在旷野嫉妒他——就是大坍和亚比兰一伙，以及可拉一党；他们满怀烈怒和愤恨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 现存希伯来文见证较短，只作：“外人向他发怒，在旷野嫉妒他。”希腊文平行文本明确指出，这些人是大坍和亚比兰一伙，以及可拉一党，并补有“烈怒和愤恨”。
    reason: textual_variant
lexical_decisions:
- source_word: ויחרו בו
  choice: 向他发怒
  rationale: 希伯来语 חרה 与介词 ב 连用，表示怒气向某人发作；“向他发怒”自然、准确，也保留敌对指向。
- source_word: זרים
  choice: 外人
  rationale: 字面义为陌生人、外来者或不属其位分的人。这里所指的大坍、亚比兰和可拉均属以色列人，因此不用容易被理解为异族人的“外国人”；“外人”保留原文措辞及其语义张力。
- source_word: ויקנאו בו
  choice: 嫉妒他
  rationale: קנא 可表示嫉妒或热忱；在反抗亚伦、争夺职分的语境中，“嫉妒他”最为贴切。
- source_word: במדבר
  choice: 在旷野
  rationale: “旷野”是以色列出埃及叙事中 במדבר 的通行译法，符合圣经语境。
- source_word: ἄνδρες οἱ περὶ Δαθὰν καὶ Ἀβειρών
  choice: 大坍和亚比兰一伙的人
  rationale: 希腊语指围绕或跟随大坍和亚比兰的人；“一伙的人”自然表达其结党反叛的群体关系。
- source_word: ἡ συναγωγὴ Κόρε
  choice: 可拉的党众
  rationale: 此处 συναγωγή 指结集起来的群体；“党众”贴合反叛派系的语境，并避免“会众”可能产生的中性或敬拜性联想。
- source_word: ἐν θυμῷ καὶ ὀργῇ
  choice: 满怀烈怒和愤恨
  rationale: 保留希腊语两个近义词叠加强调的修辞力度；“烈怒和愤恨”在现代中文中庄重而易懂。
theological_decisions:
- issue: 现存希伯来文较短，而希腊文平行文本含有反叛者姓名及愤怒描写
  choice: 正文以希伯来文两个分句为骨架，并纳入希腊文所保存的大坍、亚比兰、可拉及“烈怒和愤恨”等内容；脚注明确说明文本差异。
  alternative: 只译现存希伯来文：“外人向他发怒，在旷野嫉妒他。”
  rationale: 现存希伯来文是首要证据，但此处已标为重大不一致；希腊文保存了连贯而具体的扩展。将其收入正文，同时用脚注透明标明希伯来见证较短，既不掩盖较完整的古代平行见证，也不消除文本不确定性。
translation_notes:
  register: 采用现代、庄重且通俗的书面中文。“外人”有意保留希伯来文 זרים 的含混性；破折号引出希腊文所载的具体身份。“党众”体现反叛群体，却不加入宗派性解释。
