  text: Therefore he also established for him a statute[a], an everlasting covenant, to sustain the sanctuary.
translation:
  language: zh_hans
  text: 因此，上帝也为非尼哈设立了一项定例[a]，就是永远的约，以维持圣所。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊平行文本作：“因此，和平之约为他确立，使他作圣所和其子民的领袖，好让祭司职分的尊荣永远归给他和他的后裔。”这里的希伯来文本较短，重点是为维持圣所而设立的定例和永远的约。
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: 因此
  rationale: 清楚表达本节与非尼哈先前行动之间的因果关系。
- source_word: גם לו הכין
  choice: 他也为他立下
  rationale: 保留“也”和“为他”的指向；“立下”自然适用于定例和约的法律、盟约语境。
- source_word: חק
  choice: 定例
  rationale: 表达固定、具有约束力的规定，同时避免把它过度限定为祭司所得的份额。
- source_word: ברית עולם
  choice: 永远的约
  rationale: 采用现代中文圣经语体中自然且庄重的盟约表达，保留 עולם 的持久含义。
- source_word: לכלכל
  choice: 为要维持
  rationale: 该动词可指供养、支持或维持；与圣所搭配时，“维持”涵盖其持续运作与供给，而不过度解释。
- source_word: מקדש
  choice: 圣所
  rationale: 准确保留圣洁场所的广义含义，避免将其时代背景过早限定为特定的圣殿建筑。
theological_decisions:
- issue: 希伯来文本与希腊平行文本对盟约内容的记载有显著差异
  choice: 正文依据现存希伯来文本，译为“定例……永远的约……维持圣所”。
  alternative: 希腊文本作“和平之约”，并提到他作圣物和百姓的守护者，以及他和后裔永远享有祭司职分的尊荣。
  rationale: 现存希伯来见证应作为正文首要依据；但希腊文本较长，且会实质影响读者对非尼哈所得应许的理解，因此在脚注中完整保留其重要异文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“立下定例”“永远的约”“圣所”保留法律与祭祀语域；脚注标记置于“定例”之后，以提示此处希伯来文本与希腊文本在盟约内容上的重大差异。
