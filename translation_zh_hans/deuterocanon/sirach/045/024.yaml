revisions:
- from: 因此，他也为他立下定例[a]，作为永远的约，为要维持圣所。
  to: 因此，上帝也为非尼哈设立了一项定例[a]，就是永远的约，以维持圣所。
  rationale: 修订仅消除中文代词歧义，并改善脚注中希腊平行文本的表达。正文仍以较短的希伯来见证为依据；脚注继续完整提示希腊文本关于和平之约、圣所及子民的领导权、以及世袭祭司尊荣的较长读法。
