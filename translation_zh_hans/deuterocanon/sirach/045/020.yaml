lexical_decisions:
- source_word: ויוסף
  choice: 又……增添
  rationale: 使役形在这里表示“加添、增加”；“又……增添”既保留原文的递加意味，也与希腊文 προσέθηκεν 相符。
- source_word: לאהרן
  choice: 给亚伦
  rationale: 介词 ל 表示受益或接受者；“给亚伦”符合现代汉语表达。
- source_word: כבודו
  choice: 尊荣
  rationale: כבוד 可指“荣耀”或“尊荣”；本节涉及亚伦所得的祭司身份与地位，“尊荣”更自然，同时保留庄重含义。
- source_word: ויתן לו
  choice: 把……赐给他
  rationale: נתן 的基本义是“给”；在神赐予祭司份额的语境中，“赐给”庄重而不额外引入解释。
- source_word: נחלתו
  choice: 他的产业
  rationale: נחלה 可指继承所得的产业、所分得的份或基业。“产业”保留其承受与分配的经文色彩；代词“他的”也保留希伯来文后缀在形式上的指代张力。
- source_word: κληρονομίαν
  choice: 产业
  rationale: 希腊文平行文本支持“继承之业、所分得的份”这一语义，印证希伯来文 נחלה 的理解。
theological_decisions:
- issue: 亚伦所得“产业”的性质
  choice: 他的产业
  alternative: 他所分得的份
  rationale: 这里可能特指神为亚伦安排的祭司份额，而不一定是土地。“产业”保留圣经中承受产业的神学共鸣，又不把具体性质解释得过窄。
- issue: “他的产业”中代词的指向
  choice: 保留“他的”
  alternative: 亚伦的产业
  rationale: 希伯来文 נחלתו 只有阳性单数后缀；上下文倾向指亚伦所得的产业，但形式上也可能让读者联想到赐予者所拥有并分赐的产业。译文不强行消除这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“尊荣”适合祭司身份语境；“产业”比“遗产”更能涵盖所分得的祭司份额，并保留经文用语的厚度。
