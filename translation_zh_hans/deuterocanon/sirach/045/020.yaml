translation:
  language: zh_hans
  text: 他又增添亚伦的尊荣，赐给他产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文续云：“他将头生之物的初熟果实分给他们；他为居首位的人预备了充足的食物。”此处的希伯来文见证较希腊文短。
