translation:
  language: zh_hans
  text: 上帝尊荣他[a]，又在高处使他刚强。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文的表述较为扩展：“他使他与圣者的荣耀相似，又在仇敌的恐惧中使他显为伟大。”希伯来文则作：“上帝尊荣他，又在高处使他刚强。”
    reason: textual_variant
lexical_decisions:
- source_word: ויכבדהו
  choice: 尊荣了他
  rationale: כבד在此为使某人得尊荣、受重视；“尊荣了他”既贴近希伯来文，也保留“荣耀”语义场，而不把语气过度强化为神化或天上荣耀。
- source_word: אלהים
  choice: 上帝
  rationale: 按上下文指独一的神；“上帝”是现代普通话中自然、庄重且明确的称呼。
- source_word: ויאמצהו
  choice: 使他刚强
  rationale: אמץ表达使之强壮、坚定的使役意义；“使他刚强”直接保留该语法力量。
- source_word: במרומים
  choice: 在高处
  rationale: מרומים直指高处、诸高处；“在高处”保留空间升高与地位升高两种可能，不擅自限定为天上或崇高身份。
theological_decisions:
- issue: 希伯来文与希腊文在整节措辞上存在重大差异
  choice: 正文采用现存且可信度高的希伯来文：“上帝尊荣了他，使他在高处刚强。”
  alternative: 希腊文意为：“他使他如同圣者的荣耀，又使他在仇敌的恐惧中显为尊大。”其中“恐惧”也可按语境理解为“令仇敌惊恐之事”。
  rationale: 《便西拉智训》的希伯来文在此完整且可信，故以其为正文；希腊文差异显著，不能静默合并或忽略，因此在脚注中完整交代，以保存文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尊荣”适合诗性颂赞语境；“在高处”有意保留原文可能兼具空间与身份意味的含混性。
