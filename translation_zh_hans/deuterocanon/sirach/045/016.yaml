  naturalness: “从一切有生命的当中”略显冗长生硬；“从一切生灵中”更自然且仍保留原文的宽泛性。“以祭司的身份侍奉他”清楚、庄重，也避免“侍奉／作他的祭司”的轻微搭配问题。
  terminology: “燔祭”准确；“脂油”可指祭牲须献于坛上的脂肪部分，较“脂油祭物”更贴近原文的祭祀术语，且不把它误作另一类独立祭物。脚注对希腊文较长读法的说明适当。
