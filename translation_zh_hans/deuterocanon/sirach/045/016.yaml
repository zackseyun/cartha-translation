  text: to minister and to serve as priest to him[a], and to bless his people in his name. He chose him from among all the living to present burnt offerings and fat portions.
translation:
  language: zh_hans
  text: 侍奉他，以祭司的身份侍奉他，并奉他的名祝福他的子民。上帝从一切生灵中拣选他，献上燔祭和脂油。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本较长：“向主献上供物、香和馨香，作为纪念，并为你的子民赎罪。”这里的希伯来文本较短。
    reason: textual_variant
lexical_decisions:
- source_word: לשרת
  choice: 侍奉
  rationale: 此处指圣所和礼仪中的神圣职事；“侍奉”既自然，也比一般的“服侍”更能体现敬拜语境。
- source_word: ולכהן לו
  choice: 作他的祭司
  rationale: כהן在这里明确指履行祭司职分；此译清楚保留祭司身份，并以“他的”表达לו。
- source_word: ולברך את עמו בשמו
  choice: 并奉他的名祝福他的子民
  rationale: “奉他的名”是现代汉语中自然的礼仪表达，保留祝福是在上帝之名下施行的含义。
- source_word: ויבחר בו מכל חי
  choice: 上帝从一切有生命的当中拣选了他
  rationale: 原文主语承接上下文而省略；汉语若连续使用“他”，主客体会含混，因此明确为“上帝”，同时以“一切有生命的”保留מכל חי的宽泛措辞，不限缩为“所有人”。
- source_word: להגיש
  choice: 让他献上
  rationale: 在献祭语境中，该词指把祭物带近并呈献；“献上”是现代汉语中自然且准确的祭祀用语。
- source_word: עלה
  choice: 燔祭
  rationale: 这是希伯来献祭制度中全然焚烧之祭的标准术语；“燔祭”准确且为中文读者熟悉。
- source_word: וחלבים
  choice: 脂油祭物
  rationale: 复数指献在坛上的祭牲脂油部分；加上“祭物”可避免被理解为普通食用油脂，并保留其礼仪含义。
- source_word: προσαγαγεῖν κάρπωσιν Κυρίῳ, θυμίαμα καὶ εὐωδίαν εἰς μνημόσυνον, ἐξιλάσκεσθαι περὶ τοῦ λαοῦ σου
  choice: 不纳入正文；在脚注中译出较长的希腊文本
  rationale: 现存希伯来文本在此较短，而希腊平行文本另有供物、香、馨香、纪念和赎罪等内容。正文以现存希伯来文为准，脚注则透明保存重要异文。
theological_decisions:
- issue: 在希伯来短读法与较长希腊平行文本之间取舍
  choice: 正文依照现存希伯来文本，希腊文增补内容列入脚注
  alternative: 以较长的希腊文本作为正文，或把两种文本合并
  rationale: 希伯来见证在本处确实存在，故不应把其没有的赎罪和香祭细节直接并入正文；但希腊见证的差异显著，也不应隐去，因此以脚注完整说明。
- issue: ויבחר的省略主语
  choice: 译为“上帝……拣选了他”
  alternative: 直译为“他……拣选了他”
  rationale: 希伯来文借上下文辨明主语，汉语连续两个“他”容易造成不必要的指代混乱。明确“上帝”只补明语境所指，并未改变谁拣选谁的神学关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“侍奉”“祭司”“燔祭”等保留礼仪语域，但避免古奥句式。因所给希伯来文本开头承接前文，正文也保留其承接性质；后半句为避免代词混淆，明确补出语境中的主语“上帝”。
