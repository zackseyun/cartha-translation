base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/011.yaml
  text: precious stones upon the breastpiece[a], engraved like a seal in their settings—every precious stone as a memorial[b], engraved with writing according to the number of the sons of Israel.
translation:
  language: zh_hans
  text: 胸牌上有珍贵的宝石，雕刻如印章，安在镶座中[a]；每一颗珍贵宝石上都刻有文字，作为纪念；宝石的数目按以色列众子而定[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文明确说是“安在金镶座中”；这里的希伯来文只表明宝石有镶嵌的座，并未明说是金的。
    reason: textual_variant
  - marker: b
    text: 希腊文作“按以色列各支派的数目”；希伯来文作“以色列众子”，很可能是指宝石所代表的各支派名称。
    reason: alternative_reading
lexical_decisions:
- source_word: אבני חפץ
  choice: 珍贵的宝石
  rationale: 该短语指贵重、令人珍爱的石头；希腊文 λίθοις πολυτελέσιν 也支持“珍贵”的含义。
- source_word: החשן
  choice: 胸牌
  rationale: 祭司服饰语境中的חשן指大祭司胸前镶有宝石的礼仪服饰；“胸牌”既清楚，又避免“胸甲”可能造成的军用护甲联想。
- source_word: פתוחי חותם
  choice: 按印章的式样雕刻
  rationale: 描述类似印章或印玺的雕刻工艺；希腊文 γλύμματος σφραγῖδος 同样指印章式雕刻。
- source_word: במלואים
  choice: 镶在托座中
  rationale: 在宝石语境中指镶嵌或承托宝石的座；希伯来文本身未明说材质，因此正文不补入希腊文所见的“金”。
- source_word: לזכרון
  choice: 用作纪念
  rationale: 保留其礼仪性的纪念功能，也与希腊文 εἰς μνημόσυνον 相符。
- source_word: בכתב חרות
  choice: 刻上文字
  rationale: 同时表达“文字”与“雕刻”两层意思，现代汉语自然简明。
- source_word: למספר בני ישראל
  choice: 按以色列众子的数目
  rationale: 依从现存希伯来文“以色列众子”；希腊文则作“以色列各支派”，故将该异文收入脚注而不在正文中调和。
theological_decisions:
- issue: 宝石铭刻所纪念的对象
  choice: 宝石按以色列众子的数目刻字，具有纪念作用
  alternative: 将其理解为按以色列各支派的数目刻字
  rationale: 希伯来文明确使用“纪念”并作“以色列众子”，正文据此翻译；希腊文“各支派”说明其所指可能是由众子而来的支派，但不应在正文中消除文本差异。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“按印章的式样雕刻”保留古代工艺意象；分号对应希伯来文两个紧密相连的描述单元。正文以希伯来文为主，并用脚注呈现希腊文关于金托座及“各支派”的差异。
