  source_fidelity: 正文基本忠实于现存希伯来文：保留了胸牌、珍贵宝石、印章式雕刻、镶座、纪念、刻字及“以色列众子”的读法；脚注也恰当地呈现希腊文的“金”与“各支派”异文。建议将末句的句法关系调整得更清楚，使“刻字”明确落在宝石上，并使“按……数目”不致误读为“文字的数目”。
