  text: His grain offering shall be burned up whole[a], every day, twice a day.
translation:
  language: zh_hans
  text: 他的素祭要全然焚献[a]，每日恒常两次。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“他的祭物要全然焚尽，每日恒常献上两次。”希伯来文所说的更具体，是“他的素祭”。
    reason: 保存希腊文较宽泛的异文，并说明正文采用希伯来文具体祭物名称的依据。
lexical_decisions:
- source_word: מנחתו
  choice: 他的素祭
  rationale: 在祭司礼仪语境中，מִנְחָה特指以谷物为主的祭物；“素祭”是现代中文圣经语体中清楚而简洁的对应，也保留了希伯来文单数及第三人称所有关系。
- source_word: כליל תקטר
  choice: 要全部焚烧献上
  rationale: כליל表示祭物被完全焚烧，תקטר源自קטר，在献祭语境中指使祭物在坛上焚烧、化为烟气上升。“全部焚烧献上”既表达完全焚尽，也避免误译成另一种特定祭类“燔祭”。
- source_word: בכל יום
  choice: 每天
  rationale: 直接表达逐日发生，符合现代汉语习惯。
- source_word: צמיד
  choice: 恒常
  rationale: 此处表示礼仪行动持续、定常地进行；“恒常”保留其连续性和规律性。希腊平行文本ἐνδελεχῶς也支持这一含义。
- source_word: פעמים
  choice: 两次
  rationale: 结合希腊平行文本δίς，此处明确表示每日两次。
theological_decisions:
- issue: 祭物名称应采用希伯来文的具体表述还是希腊文的宽泛表述
  choice: 按希伯来文译为“他的素祭”
  alternative: 按希腊文译为“他的祭物”或“他的祭牲”
  rationale: 现存希伯来文明确使用מנחתו，所指比希腊文θυσίαι αὐτοῦ更具体。以希伯来文为主要依据，同时用脚注保存希腊平行文本的异文，不把两种见证暗中合并。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“素祭”保留祭司礼仪语境中的技术含义；“全部焚烧献上”清楚表达完全焚尽，又不与“燔祭”混淆。句末“每天恒常献两次”有意同时保留בכל יום的逐日性与צמיד的持续、定常含义。
