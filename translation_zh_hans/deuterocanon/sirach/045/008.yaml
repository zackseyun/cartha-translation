  yaml_path: translation/deuterocanon/sirach/045/008.yaml
  text: He clothed him with perfect splendor[a], and adorned him with glory and strength, with trousers, tunics, and a robe[b]; and he encircled him with bells.
translation:
  language: zh_hans
  text: 他给他穿上华美齐备的礼服[a]，以荣耀和力量装点他；又给他穿上裤子、长衣和外袍[b]，并用铃铛环绕他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “华美齐备的礼服”也可译作“全备的华美”。希伯来语原句凝练而崇高，强调华美的完整、齐备或极致。
    reason: lexical_alternative
  - marker: b
    text: 现存希伯来文与希腊文在这里所列的祭司服饰细节不同。希伯来文列出“裤子、长衣和外袍”，随后提到铃铛；希腊文的次序不同，并包括以弗得。
    reason: textual_variant
lexical_decisions:
- source_word: וילבישהו כליל תפארת
  choice: 他给他披上极尽荣美的服饰
  rationale: וילבישהו是使役式，表示“给他穿上”；כליל תפארת是凝练而崇高的表达，强调荣美的完全或极致。“披上极尽荣美的服饰”在中文中自然，也保留礼仪性的庄严语气；“服饰”由“给他穿上”的语境引出，并未限定为某一件衣物。
- source_word: ויפארהו
  choice: 装饰他
  rationale: 该动词源于פאר，在此既有使之华美、尊荣之意，也与祭司服饰的具体语境相合。“装饰”保留了外在装束与尊荣之间的双重意味。
- source_word: בכבוד ועוז
  choice: 以荣耀和力量
  rationale: כבוד可指荣耀、尊荣，עוז可指力量、威势。直译为“荣耀和力量”既贴近希伯来文，也不把这对词过度解释为某种特定神学属性。
- source_word: מכנסים
  choice: 裤子
  rationale: 该词指遮盖下身的祭司衣物。“裤子”是清楚、现代的译法；本节没有明说材质，故不增译“细麻布”。
- source_word: כתנות
  choice: 长衣
  rationale: כתנת指古代贴身或基本的长衣，原文为复数。“长衣”比“衬衣”更庄重，也比笼统的“衣服”更具体。
- source_word: ומעיל
  choice: 和外袍
  rationale: מעיל是袍状的外层衣物，祭司服饰语境中译为“外袍”清楚自然。
- source_word: ויקיפהו פעמונים
  choice: 又用铃铛环绕他
  rationale: ויקיפהו表达围绕、环绕，פעמונים就是铃铛。译文保留原文的环绕意象，不增添本节未明说的“金”“衣边”或缝缀方式。
theological_decisions:
- issue: 希伯来文与希腊文在祭司服饰清单上的差异
  choice: 以现存且语意连贯的希伯来文为主，译出“裤子、长衣和外袍……铃铛”。
  alternative: 依希腊文译出不同次序，并包括“以弗得”，而不译希伯来文所列的“长衣”和“铃铛”。
  rationale: 本项目在《便西拉智训》希伯来文尚存时以希伯来文为主要依据；希腊文在此用作平行见证和一致性核查。两者的差异是真实的文本问题，故不将其悄然调和，而在脚注中说明。
- issue: כליל תפארת的高度凝练表达
  choice: 译为“极尽荣美”，保留其完全、极致和尊荣的张力。
  alternative: 译为“荣美的冠冕”或“全备的华美”。
  rationale: כליל在此可唤起完整、极致的意味，其与תפארת的组合十分凝练。上下文明确是穿戴礼服，但不宜把该短语武断限定为“冠冕”；“极尽荣美”既符合上下文，也保留原语的崇高感。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“披上”“荣美”“外袍”等词保持礼仪场景的尊严，同时避免古奥表达；不补入原文未明说的材质、颜色、金属或铃铛所在位置。
