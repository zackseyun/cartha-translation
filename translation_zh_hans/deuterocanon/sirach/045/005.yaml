base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/005.yaml
  text: He let him hear his voice[a], and brought him near into the dark cloud. He placed in his hand the commandment, a law of life and understanding, to teach Jacob his statutes[b], and Israel his testimonies and judgments.
translation:
  language: zh_hans
  text: 他使他听见自己的声音，又领他进入幽暗的云中。他把诫命[a]交在他手中，就是生命和悟性的律法，为要把自己的律例教导雅各，把自己的法度和典章教导以色列[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文作“诫命”（复数）。
    reason: textual_variant
  - marker: b
    text: 希腊文作：“为要把约教导雅各，把他的典章教导以色列。”希伯来文作“把自己的律例教导雅各，把自己的法度和典章教导以色列”。
    reason: alternative_reading
lexical_decisions:
- source_word: וישמיעהו את קולו
  choice: 他使他听见自己的声音
  rationale: שמע 的使役式表达“使……听见”；此译保留上帝主动使摩西得听神圣声音的含义，并以自然现代汉语表达。
- source_word: ויגישהו לערפל
  choice: 把他领近，进入幽暗的密云
  rationale: נגש 的使役式有“使靠近、领近”之意；ערפל 指西奈显现中浓密的黑暗或暗云。译文同时保留“靠近”与进入神显幽暗之中的意象。
- source_word: מצוה
  choice: 诫命
  rationale: 依现存希伯来文保留单数；希腊文为复数，列入脚注。
- source_word: תורת חיים ותבונה
  choice: 赐生命和悟性的律法
  rationale: תורה 在西奈语境中译作“律法”；חיים 可表达生命属性或功效，汉语以“赐生命”自然传达其关联而不过度限定；תבונה 译为“悟性”，保留理解与明辨之义。
- source_word: ללמד ביעקב חוקיו
  choice: 把自己的律例教导雅各
  rationale: 目的不定式译作“为要……教导”；ביעקב 按此处习惯用法将雅各作为受教对象；חוקים 译作“律例”。
- source_word: ועדותיו ומשפטיו לישראל
  choice: 把自己的法度和判例教导以色列
  rationale: עדותיו 在律法语境中译为“法度”，保留见证性规范的传统含义；משפטיו 译为“判例”，突出其司法裁断和法规意味。希腊文对此有较短的异文，另见脚注。
theological_decisions:
- issue: ערפל 的神显意象
  choice: 幽暗的密云
  alternative: 浓黑、幽暗
  rationale: 该词描绘西奈启示中遮蔽神临在的浓密黑暗。“幽暗的密云”兼顾黑暗与云状神显意象，不将神圣隐藏性解释掉。
- issue: 希伯来文与希腊文中律法术语的差异
  choice: 正文依希伯来文译为单数“诫命”，以及“律例……法度和判例”
  alternative: 依希腊文译为复数“诫命”，以及“约……判例”
  rationale: 现存希伯来文本在此完整且可信度高，故正文以之为主；希腊文的实质差异则以脚注保存，不将两种见证强行调和。
- issue: תורת חיים 的语义关系
  choice: 赐生命……的律法
  alternative: 生命的律法
  rationale: 希伯来语属格关系可以表达与生命相关、具有生命性质或带来生命；“赐生命”在现代汉语中通顺，但仍不进一步界定生命的具体神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。正文以现存高可信度希伯来文为主，并用脚注交代希腊平行文本的重要异读。代词“自己的”指前文施行启示并交付律法的上帝；“他”所指为摩西，由上下文确定。
