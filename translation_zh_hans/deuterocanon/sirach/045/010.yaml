  text: holy garments of gold[a], blue, and purple, the work of a designer; a breastpiece of judgment, an ephod and a sash, and scarlet yarn[b], the work of a weaver.
translation:
  language: zh_hans
  text: 圣衣以金线、蓝色线和紫色线制成，是巧匠的手艺；还有决断胸牌[a]、以弗得、腰带，以及朱红色线，是织工的手艺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “决断胸牌”沿用《出埃及记》中大祭司胸牌的用语；原文也可译作“审判胸牌”或“裁决胸牌”。
    reason: lexical_alternative_cross_reference
lexical_decisions:
- source_word: בגדי קודש
  choice: 圣衣
  rationale: 简洁保留祭司服饰的神圣、礼仪性质，也是现代中文中自然的专门表达。
- source_word: זהב תכלת, וארגמן
  choice: 金线、蓝色线和紫色线
  rationale: 上下文列举纺织材料；补出“线”使中文清楚自然。תכלת指蓝至蓝紫色的贵重染料，此处译作常用的“蓝色”。
- source_word: מעשה חשב
  choice: 巧匠的手艺
  rationale: 指圣所织物中经过巧思设计的精细工艺；不限定为刺绣，以免把具体技法说得过死。
- source_word: חשן משפט
  choice: 决断胸牌
  rationale: 保留出埃及记祭司术语中胸牌用于求取或承载裁决的含义；“决断”比一般性的“审判”更贴合此器物的功能。
- source_word: אפוד
  choice: 以弗得
  rationale: 这是无准确简短对应词的祭司礼服专名，采用通行音译。
- source_word: ואזור
  choice: 腰带
  rationale: 现代中文清楚自然地表达祭司束腰的带状服饰。
- source_word: ושני תולעת
  choice: 朱红色线
  rationale: 指祭司衣料所用的朱红或绯红染色纱线；“朱红色线”自然并保留色彩与纺织语境。
- source_word: מעשה אורג
  choice: 织工的手艺
  rationale: 原文明确提到织工，直译可保留它与前一句“巧匠的手艺”的区别。
theological_decisions:
- issue: 大祭司礼服的礼仪术语
  choice: 专名“以弗得”采用音译，其余器物和材料用清楚的现代中文表达
  alternative: 所有项目均作描述性意译
  rationale: 本节承接《出埃及记》的亚伦祭司礼服传统。“以弗得”没有简明而不误导的中文对应词，宜保留专名；其他词则可准确意译，兼顾可读性。
- issue: משפט在חשן משפט中的含义
  choice: 决断胸牌
  alternative: 审判胸牌／判决胸牌
  rationale: 原词可涵盖审判、裁决或决断；在大祭司胸牌的礼仪语境中，“决断”既保留裁决含义，也避免让读者误以为它只是司法审判用品。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用分号呈现原文两组衣料和器物的并列结构；对技术性礼仪词保留必要的专名，对纺织材料则适度补出“线”以符合中文表达。
