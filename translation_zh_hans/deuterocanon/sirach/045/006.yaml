base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/006.yaml
  text: He exalted Aaron[a], a holy one like himself, from the tribe of Levi[b], and made him an everlasting statute.
translation:
  language: zh_hans
  text: 他高举亚伦[a]——这位圣者与他相似，是他的兄弟，出自利未支派——又立他为永远的定例[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 所引希伯来文本没有希腊平行文本所载“与他相似，是他的兄弟”这几个词。希腊文的两个“他”按上下文通常理解为摩西，但正文保留原有代词的未明指向。
    reason: alternative_reading
  - marker: b
    text: 也可译作“永久的规例”或“长存的法定安排”。这一凝练说法可能指亚伦的任命具有恒久的法定地位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וירם
  choice: 他高举
  rationale: רום的使役形表示“使升高、尊崇”。“高举”既保留尊荣含义，也与希腊文ὕψωσεν相符；动词主语在本节未明说，因此只译作“他”。
- source_word: קדוש
  choice: 一位……圣者
  rationale: 希伯来文无冠词，קדוש在亚伦之后作同位语；译作“一位圣者”保留非特指的表语、同位语作用，不将其处理为专有称号。
- source_word: את אהרן
  choice: 亚伦
  rationale: את是直接宾语标记，אהרן为人名，按现代汉语通行译名译作“亚伦”。
- source_word: למטה לוי
  choice: 出自利未支派
  rationale: מַטֶּה在宗族谱系语境中指“支派”；介词ל可表示归属，希腊文ἐκ φυλῆς则明确表达来源，因此译作自然的“出自利未支派”。
- source_word: וישימהו
  choice: 又使他成为
  rationale: שׂים可表示安置、设立或使之成为。这里保留希伯来文与“定例”搭配的凝练表达，不增添原文没有明说的“祭司职分”。
- source_word: לחק עולם
  choice: 永远的定例
  rationale: חֹק指法定的规例、定例；עוֹלָם在此表示长久、恒常。此译保留法律与盟约语域，也保留原文把亚伦与“定例”直接联系起来的压缩表达。
- source_word: ὅμοιον αὐτῷ ἀδελφὸν αὐτοῦ
  choice: 与摩西相似……是摩西的兄弟
  rationale: 该短语见于希腊平行文本而不见于所引希伯来短句。上下文的先行人物是摩西，故将代词所指明示为“摩西”，避免现代汉语把“与他相似”误解为与施事者相似；同时保留“兄弟”这一希腊见证。
theological_decisions:
- issue: “他高举”中施事者的身份
  choice: 保留隐含的第三人称主语“他”，不在正文中补作“上帝”或“主”
  alternative: 译作“上帝高举亚伦”或“主高举亚伦”
  rationale: 希伯来文动词在本节没有明示主语；上下文可让读者辨认所指，但直接补入神名会超出本节字面。
- issue: 希腊文“与他相似”的所指
  choice: 依上下文译明为“与摩西相似”
  alternative: 保留为“与他相似”或译作“像他自己”
  rationale: 希腊文代词本身需要依上下文确定所指；本段此前所述人物为摩西。现代汉语若照字面使用“他”或“自己”，容易错误地指向高举亚伦的施事者，因此明示“摩西”，但以脚注交代这一内容来自较长的希腊见证。
- issue: לחק עולם与亚伦的关系
  choice: 译作“使他成为永远的定例”
  alternative: “立他承受永远的定例”或“设立他永远担任祭司”
  rationale: 希伯来语表达高度凝练，可能指亚伦及其祭司任命所具有的恒久法定地位。正文不补出“祭司职分”，以免消除原有的语义张力。
translation_notes:
  register: 采用现代、庄重而可懂的书面汉语。“高举”“圣者”“定例”保留经文的尊荣、礼仪与法律语域；破折号标示围绕“亚伦”的同位说明，使希伯来文主干清晰，同时容纳希腊平行文本保存的较长读法。
