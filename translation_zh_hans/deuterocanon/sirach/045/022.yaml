base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/022.yaml
  text: But in their land he will not inherit[a], and among them he will not be allotted an inheritance; the offerings of Yahweh are his portion and his inheritance among the sons of Israel.
translation:
  language: zh_hans
  text: 但在他们的土地上，他不会承受产业；在他们中间，也不会分得产业。耶和华的祭物，就是他在以色列子孙中所得的份和产业。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“因为他自己就是你的份和产业。”这反映了与现存希伯来文不同的末句；希伯来文作：“耶和华的祭物，就是他所得的份和产业。”
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: 但
  rationale: 承接上文赐给亚伦及其后裔的权利，并转出他们不得土地产业的对比；“但”自然保留转折语气。
- source_word: בארצם
  choice: 在他们的土地上
  rationale: 指以色列人的土地；“土地”既贴近原文，也适合承受产业的语境。
- source_word: לא ינחל
  choice: 不可承受产业
  rationale: 保留 נחל 的继承、得产业含义；单数主语延续以亚伦代表的祭司职分或谱系。
- source_word: ובתוכם לא יחלק נחלה
  choice: 在他们中间，也不会分得产业
  rationale: 按上下文表达祭司在以色列人中不获分配土地产业；“分得”自然呈现此处的分配结果。
- source_word: אשי יהוה
  choice: 耶和华的祭物
  rationale: אשי 指献给耶和华、通常经火献上的祭物；译作“祭物”简明易懂，又不加入原文未明说的具体祭类。
- source_word: חלקו ונחלתו
  choice: 他所得的份和产业
  rationale: 保留“份”与“产业”这一法律及祭祀供养语境中的并列表达；补出“所得的”使现代汉语关系清楚。
- source_word: בתוך בני ישראל
  choice: 在以色列子孙中
  rationale: 较直接保留 בני ישראל 的群体称谓，并使末句表达祭司在以色列群体中所得的供养。
theological_decisions:
- issue: 末句应采用现存希伯来文“耶和华的祭物是他的份和产业”，还是希腊平行文本“他自己是你的份、产业”。
  choice: 正文依现存希伯来文，表明耶和华的祭物构成祭司所得的份和产业。
  alternative: 可据希腊文理解为：“因为他自己就是你的份和产业。”
  rationale: 本节有可信度高的现存希伯来文本，应以其为正文依据；希腊文反映了实质不同且具有神学意义的异文，因此在脚注中明确保留，不将两者混合或静默协调。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“承受产业”“分得产业”保留土地分配与祭司制度的语义联系；称神为“耶和华”，与希伯来文 יהוה 对应。脚注标记置于相关整句之后。
