base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/015.yaml
  text: Moses ordained him and anointed him with holy oil[a]. It became for him an everlasting covenant, and for his offspring[c][b], for as long as the heavens endure.
translation:
  language: zh_hans
  text: 摩西授予他祭司职分，又用圣油膏立他[a]。这就成为赐给他和他后裔、如天长存的永远之约[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面为“摩西把他的手充满”；这是授予祭司职分、使人承接圣职的礼仪用语。希腊语平行文本同样作“充满双手”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语字面为“如同天的日子”，用来表达长久存续。
    reason: lexical_alternative
  - marker: c
    text: 希腊语平行文本在现存希伯来文本之后还有：“事奉他，担任祭司，并奉他的名祝福他的百姓。”正文以现存希伯来文本为主要依据。
    reason: alternative_reading
lexical_decisions:
- source_word: וימלא משה את ידו
  choice: 摩西授予他祭司职分
  rationale: 希伯来语字面为“摩西把他的手充满”，是授予祭司职分的专门用语；希腊语平行文本也保留“充满双手”的表达。正文采用意义清楚的现代汉语，字面形式收入脚注。
- source_word: וימשחהו
  choice: 又……膏立他
  rationale: משח指以油膏抹；在此礼仪语境中，“膏立”既保留实际动作，也表达正式设立之意，与希腊语ἔχρισεν相符。
- source_word: בשמן הקדש
  choice: 用圣油
  rationale: 直接表达礼仪所用的分别为圣之油，简洁自然，并与希腊语ἐν ἐλαίῳ ἁγίῳ一致。
- source_word: ברית עולם
  choice: 永远的约
  rationale: 该固定词组表达持续长存的盟约；“永远的约”庄重、自然，也对应希腊语διαθήκην αἰώνιον。
- source_word: ולזרעו
  choice: 和他后裔
  rationale: זרע是集合单数，可指后代群体；“后裔”比字面的“种子”更符合现代汉语，同时保留群体延续的意义。
- source_word: כימי שמים
  choice: 长久如天
  rationale: 字面为“如天的日子”，表示与诸天存续同样长久。“长久如天”保留天穹意象，也在汉语中清楚传达时间含义。
theological_decisions:
- issue: 祭司语境中盟约应许的范围
  choice: 按经文陈述，将永远的约同时关联于亚伦和他的后裔，不进一步界定其后世神学意义。
  alternative: 将其强化为关于祭司职分绝对且无条件永久延续的主张，或把约仅限于亚伦本人。
  rationale: 希伯来文本明确说“给他，也给他的后裔”，并以“如天的日子”描述其长久性；译文保留这一力度，却不添加经文本身未说明的教义条件或结论。
- issue: “充满手”这一祭司礼仪用语的译法
  choice: 正文译为“授予他祭司职分”。
  alternative: 直译为“充满他的手”，或译作“任命他”“使他承接圣职”。
  rationale: 直译在现代汉语中意义不明；正文明确其祭司就职含义，脚注则保留原文形象，以兼顾可读性和可核查性。
- issue: 希腊平行文本较希伯来存文更长
  choice: 正文以现存希伯来文本为主，不收入希腊文本增加的句子。
  alternative: 把希腊文本的续句纳入正文：“侍奉他，担任祭司，并奉他的名祝福他的百姓。”
  rationale: 所给希伯来见证在“如天的日子”处结束，而希腊平行文本另有续文。为避免把次要见证无标记地并入主体文本，译文依希伯来文止句，并在脚注说明差异。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“授予他祭司职分”解释原文礼仪习语；“膏立”保留膏油行动及正式设立的语气；“长久如天”保留原文宇宙性意象，避免过度释义。所有脚注标记均在正文出现。
