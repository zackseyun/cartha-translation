  text: splendor of glory and praise of strength[a], delight of the eyes and perfection of beauty.
translation:
  language: zh_hans
  text: 荣耀的光辉，力量的颂赞[a]；悦人眼目，美丽至极。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文平行文本作：“尊荣的夸耀，力量的杰作，悦目的装饰。”此处希伯来文见证的措辞与希腊文明显不同，但二者都以崇高的语言描写大祭司的服饰。
    reason: alternative_reading
lexical_decisions:
- source_word: הוד
  choice: 辉煌
  rationale: הוד可指威荣、华美或辉煌；译作“辉煌”既保留诗意，也避免与随后表示荣耀的כבוד混同。
- source_word: כבוד
  choice: 荣耀
  rationale: כבוד常指荣耀或尊荣；此处采用“荣耀”，与הוד组成凝练而庄重的诗性表达。
- source_word: ותהלת עז
  choice: 力量的颂赞
  rationale: תהלה意为颂赞，עז意为力量或能力。希伯来语结构简练，直译能保留其含义上的张力，不擅自确定究竟是对力量的赞美，还是力量所带来的美誉。
- source_word: מחמד עין
  choice: 悦人眼目
  rationale: מחמד指可喜爱、可悦之物，与“眼目”连用表示视觉上的赏心悦目；“悦人眼目”自然且庄重。
- source_word: ומכלל יופי
  choice: 美丽至极
  rationale: מכלל在这里表达完满、极致之意；“美丽至极”以现代汉语传达美丽达到完全程度的诗意。
theological_decisions:
- issue: 希伯来文见证与希腊文平行文本措辞明显不同
  choice: 正文以现存且语意连贯的希伯来文为准，希腊文异文置于脚注
  alternative: 按希腊文译作“尊荣的夸耀，力量的杰作，悦目的装饰”一类表达
  rationale: 本项目在《便西拉智训》希伯来文存留之处优先据希伯来文翻译。两种见证都以崇高语言描写大祭司的服饰，但不能视为逐词相同，因此不将希腊文措辞混入正文。
translation_notes:
  register: 采用现代、庄重而富有诗意的简体中文。正文保持希伯来诗句的并列结构；“美丽至极”较直译“美丽的完全”更符合现代汉语，同时保留其极致、完满之意。
