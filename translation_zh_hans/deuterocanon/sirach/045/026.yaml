  yaml_path: translation/deuterocanon/sirach/045/026.yaml
  text: And now[a], please bless Yahweh[b], the good one.
translation:
  language: zh_hans
  text: 现在[a]，请你们称颂耶和华[b]——那位良善者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作：“现在，请你们称颂耶和华——那位良善者。”希腊文见证在此有显著不同：“愿他赐给你们心中的智慧，使你们按公义审判他的百姓，好叫他们的美好事物不致消失，他们的荣耀传及世代。”
    reason: textual_variant
  - marker: b
    text: 希伯来文在此使用神名四字母YHWH；正文译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是承接上文并引出结语劝勉的话语标记；现代汉语用“现在”自然表达其推进作用。
- source_word: בָּרֲכוּ־נָא
  choice: 请你们称颂
  rationale: 复数命令式表明对象不止一人，נָא使语气带有恳请意味；“请你们称颂”兼顾命令、复数和礼貌语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用四字神名YHWH；“耶和华”是现代中文圣经传统中最通行、易识别的专名译法，并以脚注说明原文形式。
- source_word: הַטּוֹב
  choice: 美善的
  rationale: 带定冠词的形容词在神名后作同位性修饰，意为“那位美善者”；译作“美善的耶和华”简洁自然，也不额外限定这里所说的善。
- source_word: δόῃ ὑμῖν σοφίαν ...
  choice: 不纳入正文
  rationale: 希腊见证与现存希伯来文本差异显著。鉴于希伯来文本在本节完整且可信度高，正文依从希伯来文，希腊异文列入脚注。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用神的专名而非普通称号。正文采用中文读者最熟悉的专名形式“耶和华”，并在脚注交代其为YHWH，避免将其无说明地改成称号。
- issue: 希伯来文本与希腊文本的显著差异
  choice: 正文采用现存希伯来文的称颂劝勉，脚注保留希腊异文
  alternative: 以希腊文祝愿语作为正文；或把两种文本合并
  rationale: 本节希伯来文见证完整且可信度高，应优先作为正文依据；希腊文代表实质不同的文本形态，须透明记录，但不宜与希伯来文混合。
- issue: הַטּוֹב与神名的关系
  choice: 译作定语“美善的”
  alternative: 译作独立断言“他本为善”；或“那位美善者”
  rationale: 希伯来文可理解为神名后的同位性形容语。定语译法保留其紧密结构，同时避免把短语扩展为独立分句。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“称颂”符合敬拜语境且为普通读者熟悉；明示复数“你们”，保留希伯来语命令式的受话范围。正文短促有力，符合结语劝勉的语气。
