  text: Blessed are you in the temple of your holy glory, and highly praised and exceedingly glorious forever.
translation:
  language: zh_hans
  text: 你在你神圣荣耀的殿中当受称颂，受至高赞美，且极其荣耀，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος
  choice: 当受称颂
  rationale: 保留颂歌中对上帝的赞颂语气，也自然表达希腊文形容词的被动含义。
- source_word: ἐν τῷ ναῷ τῆς ἁγίας δόξης σου
  choice: 在你神圣荣耀的殿中
  rationale: 按原文属格结构直译，保留“殿”与“神圣荣耀”之间可能具有闪语色彩的紧密关系，不擅自改作“荣耀的圣殿”。
- source_word: ὑπερυμνητὸς
  choice: 至高的赞美
  rationale: ὑπερ-表示程度极高；置于“当受”结构中，译为“当受至高的赞美”，既传达强化意义，又符合现代汉语。
- source_word: ὑπερένδοξος
  choice: 极其荣耀
  rationale: 将形容词理解为主体本身极其荣耀，而非“被高度荣耀”，与希腊词义及修订后的英文审校层一致。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永
  rationale: 简洁表达“直到万世”的恒久意义，并使颂歌句式流畅庄重。
theological_decisions:
- issue: ὑπερένδοξος是指上帝本身极其荣耀，还是指上帝被人极力荣耀
  choice: 极其荣耀
  alternative: 大受荣耀
  rationale: 该词是描述性质的形容词，更直接表示“极其荣耀、荣耀无比”；避免将其改写成受造者施加于上帝的行为。
- issue: “神圣荣耀”的所属关系
  choice: 你神圣荣耀的殿
  alternative: 你荣耀的圣殿
  rationale: 原文是“你神圣荣耀的殿”，保留其不寻常但有意义的属格表达，不将“神圣”从“荣耀”移接到“殿”。
translation_notes:
  register: 采用庄重而易懂的现代普通话，保留原文三个并列赞颂成分；以分号改善中文节奏，并将共同的“当受”自然延续到后两项。
