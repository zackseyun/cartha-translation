  text: Bless the Lord, mountains and hills; sing praise and highly exalt him forever.
translation:
  language: zh_hans
  text: 群山和丘陵啊，要称颂主；要歌颂他，极力尊崇他，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，呼召受造界颂扬主；“称颂”既保留礼仪性，也比直译为“祝福”更符合现代汉语中受造物对上帝说话的语境。
- source_word: ὄρη καὶ βουνοί
  choice: 群山和丘陵
  rationale: 自然对应两类高地，并保留诗歌中的并列结构；“群山”使呼语在汉语中更自然。
- source_word: τὸν κύριον
  choice: 主
  rationale: 直接对应希腊语 κύριος；本节以希腊文本为源，不额外引入希伯来神名所采用的排版惯例。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 兼顾动词的歌唱和赞美含义，表达简洁而有诗歌色彩。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 保留复合动词所含的加强语气；相比单说“高举”，更清楚地表达极度尊崇之意。
- source_word: αὐτὸν
  choice: 他
  rationale: 指回前面的“主”，采用现代汉语通常的人称代词。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 在反复出现的礼仪性副歌中表达持续无尽，现代汉语自然简明。
theological_decisions:
- issue: 颂赞语境中 κύριος 的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 源文本明确使用希腊语 κύριος；译作“主”既忠于当前文本，也避免把希伯来语神名或特定宗派用语引入译文。
- issue: ὑπερυψοῦτε 的加强含义
  choice: 尊他为至高
  alternative: 极力高举他／尊崇他
  rationale: “尊他为至高”保留原词加强的高举、尊崇含义，同时不把句子解释成关于神本体状态变化的陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以“啊”和两个并列命令保持赞歌的呼召感与节奏；不使用生硬古语，也不添加原文没有的神学限定。
