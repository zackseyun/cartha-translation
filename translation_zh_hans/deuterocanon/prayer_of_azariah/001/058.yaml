base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/058.yaml
  text: Bless the Lord, four-footed animals and beasts of the earth; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 四足动物和地上的野兽啊，要称颂主；要歌颂他，极力高举他，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，呼吁受造物颂赞主；“称颂”在现代中文中自然庄重，并与后面的“歌颂”有所区别。
- source_word: τετράποδα
  choice: 走兽
  rationale: 原义为“四足之物”。“走兽”是自然的现代汉语总称，能传达陆生四足动物之意，又避免“四足动物”的生硬感。
- source_word: θηρία τῆς γῆς
  choice: 地上所有的……野兽
  rationale: θηρία常指野兽，τῆς γῆς修饰该词。“地上的野兽”保留其受造界背景；以“所有的”统摄并列项，使中文呼语流畅，不增添类别含义。
- source_word: τὸν κύριον
  choice: 主
  rationale: 在这首向上帝发出的赞歌中，κύριος按项目惯例译为“主”。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词带有吟唱赞美诗的意味；“歌颂”简洁地保留其礼仪和诗歌色彩。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 强意复合动词表示极力高举、尊崇。“尊他为至高”在中文赞歌语境中自然，并保留加强语气。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 此反复句中表达无尽延续；“永远”是清楚自然的现代中文对应。
theological_decisions:
- issue: 在次经赞歌中以κύριος称呼上帝
  choice: 主
  alternative: 主人／主宰
  rationale: “主”符合犹太希腊文敬拜语境及项目的一贯译法，不额外引入其他神学限定。
translation_notes:
  register: 采用现代、庄重而可诵唱的赞歌体。将两个动物类别合并在“地上所有的”这一中文结构下，使呼语自然；分号保留原文两组命令的节奏。
