  text: Give thanks to the Lord[a], for he is good, for his mercy endures forever.
translation:
  language: zh_hans
  text: 你们要称谢主，因为他本为善；因为他的怜悯永远长存。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的慈爱永远长存。”希腊文直译为“他的怜悯直到永远”；在这类礼仪性的颂赞套语中，也可能含有忠贞之爱的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: 称谢
  rationale: 此词在礼仪性的颂赞套语中表示向上主献上感谢和赞美，并非认罪；“称谢”既贴近传统诗歌语体，也清楚自然。
- source_word: τῷ κυρίῳ
  choice: 主
  rationale: 直接对应希腊文 κύριος；虽该句呼应希伯来诗篇的惯用语，译文仍以现存希腊文本为准，不另行还原神名。
- source_word: χρηστός
  choice: 本为善
  rationale: χρηστός 可指良善、仁慈或恩厚；在这一固定颂赞句式中，“本为善”简洁庄重，并表达主固有的良善。
- source_word: εἰς τὸν αἰῶνα
  choice: 永远长存
  rationale: 字面为“直到永世”；原句没有明示动词，汉语需补足谓语。“永远长存”自然表达持续不止的含义。
- source_word: τὸ ἔλεος αὐτοῦ
  choice: 他的怜悯
  rationale: ἔλεος 的直接意义是怜悯、慈悲；“怜悯”忠实保留希腊词义，不在正文中过度指定其背后的盟约内涵。
theological_decisions:
- issue: 诗篇式颂赞套语中 ἔλεος 的盟约意味
  choice: 他的怜悯永远长存
  alternative: 他的慈爱永远长存
  rationale: 正文优先呈现希腊文 ἔλεος 的直接词义“怜悯”；同时以脚注保留“慈爱”这一在圣经礼仪语境中可能体现忠贞之爱的译法，避免消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪性汉语。“称谢”“本为善”“永远长存”保留诗歌颂赞的节奏；分号清楚呈现劝勉与两个理由之间的结构。
