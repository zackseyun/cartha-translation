  text: Blessed are you in the firmament of heaven, and praised and glorified forever.
translation:
  language: zh_hans
  text: 你在天穹中当受称颂，永远当受赞美和荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογητὸς
  choice: 当受称颂
  rationale: 表达该形容词用于颂赞上帝时“配受称颂”的含义，也与后面的赞颂语形成自然的汉语排比。
- source_word: ἐν τῷ στερεώματι τοῦ οὐρανοῦ
  choice: 在天穹之上
  rationale: στερέωμα 指天空的穹苍；在这一祷歌语境中，用“天穹”保留古代宇宙图景，“之上”则自然表达上帝居于其间或其上的颂赞意象，同时不作过度具体化。
- source_word: ὑμνητὸς
  choice: 当受赞美
  rationale: 该词表示配得以诗歌或颂歌赞美；“当受赞美”在现代礼仪性汉语中清楚庄重。
- source_word: δεδοξασμένος
  choice: 当受尊崇
  rationale: 完成时被动分词在颂赞公式中表达被荣耀、受尊崇的状态；“尊崇”比直译“荣耀”更符合此处描述受颂赞者的现代汉语搭配。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是该固定表达在颂赞公式中的自然译法，传达无尽延续。
theological_decisions:
- issue: ἐν 与天穹的空间关系
  choice: 在天穹之上
  alternative: 在天穹中
  rationale: 希腊语 ἐν 本身通常是“在……中”，但本句承接圣所、宝座等上帝临在的颂赞语言，汉语“在天穹之上”较自然，也保留超越性的意象；不进一步解释为具体宇宙结构。
- issue: δεδοξασμένος 的语态与时态色彩
  choice: 当受尊崇
  alternative: 已经得了荣耀
  rationale: 在与 εὐλογητός、ὑμνητός 并列的礼仪性公式里，重点是持续的颂赞属性，而不是一次已完成的事件，因此采用平行的规范性表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保持三项颂赞的平行结构；不添加主语称谓或教派性解释。
