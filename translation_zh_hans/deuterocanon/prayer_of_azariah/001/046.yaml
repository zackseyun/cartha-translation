  text: Bless the Lord, frost and cold; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 寒霜和严寒啊，要称颂主；要歌颂他，永永远远地极力尊崇他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，在创造万物的赞歌中呼召寒霜与严寒赞美主；“称颂”兼顾礼仪性和颂赞意味。
- source_word: πάγος
  choice: 寒霜
  rationale: πάγος可指冰或霜；与ψῦχος并列时，取大气现象“寒霜”较贴切，也能与泛指低温的“严寒”区分。
- source_word: ψῦχος
  choice: 严寒
  rationale: 该名词指寒冷、寒气；此处拟人化呼告自然现象，“严寒”自然凝练，并与“寒霜”形成诗性对偶。
- source_word: τὸν κύριον
  choice: 主
  rationale: 忠实对应κύριον；在希腊文次经赞歌的语境中，用“主”自然庄重，且不额外引入专名形式。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含唱诗赞美之意；“歌颂”既保留歌唱色彩，也符合现代汉语赞歌语体。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 复合动词带强烈的高举、极力尊崇意味；“尊他为至高”在汉语中自然，并保留强化成分。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永永远远
  rationale: 在反复出现的赞歌句式中表示历世无尽；“永永远远”庄重且适合礼仪诗歌。
theological_decisions:
- issue: 次经希腊文赞歌中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 原文仅作κύριον；译为“主”直接保留希腊文本的称谓，避免把未明示的希伯来专名形式带入正文。
- issue: ὑπερυψοῦτε的宾语关系与强化意味
  choice: 尊他为至高
  alternative: 极力高举他
  rationale: 两者均可表达强化的“高举”；正文选择较自然庄重的“尊他为至高”，不把它解释为本体论陈述，而保留颂赞行为的语气。
translation_notes:
  register: 采用现代、庄重而可朗诵的赞歌语体。保留两个复数命令式所形成的平行结构，以“寒霜和严寒啊”呈现对受造界的拟人化呼告；本节无须脚注。
