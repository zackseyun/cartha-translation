  text: And you gave us into the hands of our lawless enemies, hateful rebels, and to an unjust and most wicked king in all the earth.
translation:
  language: zh_hans
  text: 你把我们交在不法的仇敌、最可憎的叛徒手中，又交给一位不义、比全地任何人都邪恶的王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比全地任何人都邪恶”较直译παρὰ πᾶσαν τὴν γῆν；此短语与最高级“最邪恶的”连用，强调这王的邪恶达到无与伦比的程度。
    reason: 说明παρά加宾格与最高级的比较功能，并避免将范围限缩为“所有王”。
lexical_decisions:
- source_word: παρέδωκας
  choice: 交在……手中／交给
  rationale: 结合后面的“εἰς χεῖρας”表达被交由敌人掌控，采用现代汉语自然说法，并保留同一动词支配两组对象的结构。
- source_word: ἐχθρῶν ἡμῶν ἀνόμων
  choice: 不法的仇敌
  rationale: 将ἀνόμων理解为修饰“我们的仇敌”，既保留“违背律法／无法无天”的含义，也避免增添原文没有的具体罪名。
- source_word: ἐχθίστων ἀποστατῶν
  choice: 可恨的叛徒
  rationale: ἀποστάτης表示背叛、反叛之人；ἐχθίστων是强烈的最高级评价，译作“可恨的”较自然，但最高级力度难在中文正文中完全呈现，故脚注说明。
- source_word: βασιλεῖ ἀδίκῳ
  choice: 不义的王
  rationale: 保留ἀδίκῳ的道德与司法双重色彩，不窄化为单纯“不公正”。
- source_word: πονηροτάτῳ παρὰ πᾶσαν τὴν γῆν
  choice: 全地最邪恶的王
  rationale: 按比较／最高级意义处理παρά加宾格：“比全地所有人更邪恶”，以简洁中文表达其极端程度，同时用脚注保留句法歧义。
theological_decisions:
- issue: ἀποστατῶν所指的背叛性质
  choice: 叛徒
  alternative: 背道者／反叛者
  rationale: 原文未明确限定为宗教背道或政治叛乱；“叛徒”保留较宽泛的背叛含义，避免导入特定教义判断。
- issue: παρὰ πᾶσαν τὴν γῆν的比较范围
  choice: 就是全地最邪恶的王
  alternative: 在全地之上极其邪恶／比全地所有人都邪恶
  rationale: 希腊语可表达相对于全地的极端程度；正文采用通顺的最高级译法，脚注交代较直译的可能理解，不强行消除语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“你”承接祷告中对上帝的直接称呼；不额外补出“上帝”或神名。句中重复“交”以清楚呈现两组受事，并使用“就是”避免将“全地最邪恶”误读为另一个人物。
