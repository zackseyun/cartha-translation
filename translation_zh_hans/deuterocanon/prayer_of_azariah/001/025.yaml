  text: and it swept through and burned up those Chaldeans whom it found around the furnace[a].
translation:
  language: zh_hans
  text: 那火焰横扫而过，把它在火窑周围遇到的迦勒底人都烧着了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那火焰穿行而过，点燃了它在火窑周围遇到的迦勒底人。”希腊语动词可作较为形式对应的翻译；正文按本段语境表达火焰猛烈而具有毁灭性的作用。
    reason: 词义有不同表达可能
lexical_decisions:
- source_word: διώδευσεν
  choice: 横扫过去
  rationale: 该动词本义是“穿行、经过”；结合上文火焰受驱动并造成毁灭的情景，“横扫过去”既表达穿行，也自然传达其猛烈势头。
- source_word: ἐνεπύρισεν
  choice: 烧灭了
  rationale: 该动词可指“点燃、使燃烧”。在此语境中，它描述火焰对窑边之人的毁灭性作用；“烧灭了”比单纯“点着了”更符合场景，同时不额外规定具体死伤细节。
- source_word: οὓς εὗρεν
  choice: 它……遇到的……都
  rationale: 保留关系从句的不定范围，表示火焰波及它在附近遇见的所有迦勒底人；“遇到”在现代汉语中比直译“找到”更自然。
- source_word: περὶ τὴν κάμινον
  choice: 在火窑周围
  rationale: περί加宾格在这里表达空间位置，“在火窑周围”准确、清楚。
- source_word: τῶν Χαλδαίων
  choice: 迦勒底人
  rationale: 按希腊文本直译族称Χαλδαῖοι，不以解释性的“巴比伦人”替换。
