  text: For you are righteous in all that you have done to us, and all your works are true, and your ways are straight, and all your judgments are true.
translation:
  language: zh_hans
  text: 因为你在向我们所做的一切事上都是公义的；你一切的作为都真实，你的道路都正直，你一切的审判都真实。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: 公义
  rationale: 表示上帝在其作为中的正直与公正；“公义”既保留圣经语境中的伦理和神学分量，也符合现代中文表达。
- source_word: πᾶσιν οἷς ἐποίησας ἡμῖν
  choice: 在向我们所做的一切事上
  rationale: 忠实保留希腊文所表达的直接施事关系，即这些事是“你向我们所做的”，不改写为较间接的容许关系。
- source_word: ἔργα
  choice: 作为
  rationale: 在谈论上帝的行动时，“作为”比“工作”自然，也能涵盖所行的一切事。
- source_word: ἀληθινὰ / ἀληθιναί
  choice: 真实
  rationale: 保留该词兼具真实、可靠的宽广含义；不统一解释为较窄的“信实”。
- source_word: ὁδοί
  choice: 道路
  rationale: 保留原文的道路隐喻，也是现代中文圣经语体中自然且易懂的说法。
- source_word: εὐθεῖαι
  choice: 正直
  rationale: 原义为“直的”；中文以“道路正直”保留其道德隐喻，同时避免“道路笔直”被理解为仅指空间形态。
- source_word: κρίσεις
  choice: 判决
  rationale: 此处指上帝所作的审判性裁断；“判决”清楚表达具体裁决之意，比可能指审判过程的“审判”更贴切。
theological_decisions:
- issue: 上帝的公义与说话者所受苦难之间的关系
  choice: 保留“你向我们所做”的直接表述，并宣认上帝在这一切事上都是公义的。
  alternative: 改为“你容许临到我们的一切事”，以弱化上帝的直接施事。
  rationale: 希腊文明确使用“你向我们所做”的表达。译文不以“容许”等解释性措辞缓和原文，而保留苦难经验与上帝公义并置所形成的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以三个并列分句呈现原文反复的“都”和“一切”，保留祷告式宣认的节奏；不用生僻或宗派化术语。
