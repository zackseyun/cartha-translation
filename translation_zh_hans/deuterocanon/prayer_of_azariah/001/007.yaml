  text: And we have not obeyed the commands of your law, nor kept them, nor done as you commanded us, so that it might go well with us.
translation:
  language: zh_hans
  text: 我们没有听从你律法的诫命，也没有谨守，也没有照你所吩咐我们的去行，好使我们得福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολῶν τοῦ νόμου σου
  choice: 你律法中的命令
  rationale: 保留“命令”与“律法”的属格关系，表达这些命令属于上帝的律法；现代汉语自然清楚。
- source_word: ὑπηκούσαμεν
  choice: 听从
  rationale: 既包含听取也包含服从之意，适合此处认罪语境。
- source_word: συνετηρήσαμεν
  choice: 谨守
  rationale: 表达认真遵守、持守命令，且与前面的“听从”有所区别。
- source_word: εὖ ἡμῖν γένηται
  choice: 让我们得享福祉
  rationale: 概括“使事情对我们而言顺遂、良好”的含义，避免将其局限为物质兴旺。
theological_decisions:
- issue: ἵνα从句所表达的目的或结果关系
  choice: 好让我们得享福祉
  alternative: 以致我们得享福祉
  rationale: ἵνα通常引出目的；此处最自然地表示上帝赐下命令并吩咐人遵行，是为使他们得福。译文保留这一关系，不进一步界定福祉的性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我们没有……也没有……没有……”保留希腊文层递并列的认罪语气；“福祉”涵盖安好、顺遂与蒙福，而不作宗派化解释。
