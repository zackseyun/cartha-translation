base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/044.yaml
  text: Bless the Lord[a], frost and cold; sing hymns and highly exalt him forever.
translation:
  language: zh_hans
  text: 寒霜和严寒啊，你们要称颂主[a]；要歌颂他，极力尊崇他，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“寒霜和严寒啊，你们要赞美主。”希腊语 εὐλογεῖτε 既可译为“称颂”，也可较宽泛地译为“赞美”；正文采用“称颂”，以保留本诗反复出现的颂赞句式。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，呼召受造之物赞美主；“称颂”既保留“说美言、祝颂”的语义，也适合本诗反复出现的礼仪性句式。
- source_word: ῥῖγος
  choice: 寒霜
  rationale: 指严寒、寒气或霜冻；译作“寒霜”可与后面的 ψῦχος 区分，并使自然现象的呼告清楚自然。
- source_word: ψῦχος
  choice: 严寒
  rationale: 表示寒冷、冷气；与“寒霜”并列时译作“严寒”，避免将两个希腊词合并为同一概念。
- source_word: τὸν κύριον
  choice: 主
  rationale: 按本项目对 κύριος 的通常译法处理；汉语在此无需表达希腊语冠词。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含有以诗歌或颂歌赞美之意；“歌颂”简洁自然，并保留其音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 复合动词带加强语气，意为极力高举、尊为至高；此译法比直译“极其高举”更符合现代汉语，同时保留强化意味。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 这是表示永久延续的惯用语；“直到永远”自然、庄重，也符合颂赞语体。
theological_decisions:
- issue: 次经希腊颂歌中 κύριος 的译法
  choice: 主
  alternative: 上主
  rationale: “主”直接对应 κύριος，符合现代汉语圣经语体，且不额外引入特定宗派的惯用称谓。
- issue: 受造物“称颂”主的拟人化命令
  choice: 保留直接呼告及复数命令的意味
  alternative: 意译为“愿寒霜和严寒赞美主”
  rationale: 原文直接呼告寒霜与严寒，并使用命令式；保留“啊，你们要……”可呈现诗歌的拟人手法和礼仪张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“寒霜和严寒啊”保留对自然现象的直接呼告；分号呈现原文两个并列命令。“歌颂”体现 ὑμνεῖτε 的歌唱意味，“尊他为至高”传达 ὑπερυψοῦτε 的加强语气。
