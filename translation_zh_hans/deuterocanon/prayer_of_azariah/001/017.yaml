base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/017.yaml
  text: As with whole burnt offerings of rams and bulls[a], and as with tens of thousands of fat lambs, so let our sacrifice be before you today and make atonement before you, for there is no shame for those who have put their trust in you[b], and let it be brought to completion before you.
translation:
  language: zh_hans
  text: 正如献上公绵羊和公牛作全燔祭，也如献上数万只肥美的羊羔，愿我们今天的祭物也这样呈在你面前，并在你面前成就赎罪[a][b]；因为信靠你的人不会蒙羞；愿这祭物在你面前得以成全[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“并在你面前蒙悦纳。”这里的希腊动词带有祭祀中的赎罪或平息之意。
    reason: alternative_reading
  - marker: b
    text: 这里译作“在你面前”的希腊语，字面通常是“在你后面”；同一短语在本节末尾再次出现。按本句语境，译作“在你面前”较为通顺。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώμασι
  choice: 全燔祭
  rationale: 指祭物完全被火焚烧的祭，保留专门的祭祀含义；“全燔祭”比泛称“燔祭”更充分体现“全部焚献”的语义。
- source_word: κριῶν καὶ ταύρων
  choice: 公绵羊和公牛
  rationale: 准确呈现两类用于献祭的雄性牲畜，也采用现代读者容易理解的名称。
- source_word: μυριάσιν ἀρνῶν πιόνων
  choice: 数万只肥羊羔
  rationale: μυριάσιν 是“万”的复数，表示以万计的巨大数目；“数万只”既贴近字面，又比生硬的“万万只”自然。πίονων 保留为“肥”，体现祭牲丰美贵重。
- source_word: θυσία
  choice: 祭物
  rationale: 上下文把说话者当下所献的与牲畜祭相比较；“祭物”在汉语中自然，并能指这项呈献本身。
- source_word: ἐξιλάσαι
  choice: 成就赎罪
  rationale: 该动词具有赎罪、平息之意；“成就赎罪”保留祭祀和神学分量，同时避免擅自补出原文没有明说的赎罪对象。
- source_word: ὄπισθέν σου
  choice: 在你面前
  rationale: 该短语字面通常是“在你后面”，但在这里若照字面翻译，会与祈求祭物蒙悦纳并奏效的语境难以衔接；正文按语境译作“在你面前”，并用脚注保留原文异样。
- source_word: αἰσχύνη
  choice: 蒙羞
  rationale: 表示羞耻或受辱；“蒙羞”庄重、简洁，也符合信靠上帝之人不致受辱的语境。
- source_word: τοῖς πεποιθόσιν ἐπὶ σοί
  choice: 信靠你的人
  rationale: 完成时分词表达已经把信赖寄托于上帝、并持续信靠的状态；现代汉语用“信靠”可自然涵盖这种持久状态。
- source_word: τελειῶσαι
  choice: 得以成全
  rationale: 该动词表示使之达到终点或完全实现。原句结构紧缩，采用被动式“得以成全”，保留祈愿祭物达到预期功效的含义，而不武断限定具体方式。
theological_decisions:
- issue: ἐξιλάσαι 的赎罪含义
  choice: 在你面前成就赎罪
  alternative: 在你面前蒙悦纳
  rationale: 希腊动词本身具有赎罪或平息的祭祀含义，因此正文不将其弱化为单纯“蒙悦纳”。但由于句法简缩，脚注说明也可能侧重祭物得蒙接纳。
- issue: 两次 ὄπισθέν σου 的解释
  choice: 在你面前
  alternative: 在你后面
  rationale: 传世希腊文在此使用了通常意为“在你后面”的异常表达。结合前面的 ἐνώπιόν σου（“在你面前”）和全句献祭祈愿的语境，正文采用合乎语境的“在你面前”，但以脚注明示字面形式，避免掩盖原文张力。
- issue: τελειῶσαι 的主语与功效
  choice: 愿这祭物在你面前得以成全
  alternative: 愿我们在你后面达到完全
  rationale: 原文不定式结构紧缩，主语并未重新明说。沿着本句“我们的祭物”的主线理解，译为祭物“得以成全”，同时不补入特定教义性功效。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“全燔祭”“祭物”“赎罪”保留献祭语境所需的专门色彩；句中用分号分开理由和末尾祈愿，以免长句难读。所有歧义均以正文中的脚注标记[a]、[b]明确呈现。
