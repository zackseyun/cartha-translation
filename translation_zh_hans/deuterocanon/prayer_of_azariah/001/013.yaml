  text: just as you spoke to them[a], saying that their offspring would be multiplied like the stars of heaven in number and like the sand by the shore of the sea.
translation:
  language: zh_hans
  text: 正如你曾对他们说，要使他们的后裔[a]增多，数目如天上的星，又如海边的沙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“种子”；这里是集合用语，指他们的子孙后代，并沿用赐给先祖之应许的措辞。
    reason: 说明σπέρμα的字面意义、集合用法及其与祖先应许的互文联系。
lexical_decisions:
- source_word: ἐλάλησας πρὸς αὐτοὺς
  choice: 你曾对他们说
  rationale: 准确表达向特定对象说话的方向，并以“曾”体现所回顾的是先前赐下的应许。
- source_word: λέγων
  choice: 说的：
  rationale: 用冒号自然引出所说的内容，避免在现代汉语中重复使用“说”。
- source_word: πολυπληθῦναι
  choice: 要使……增多
  rationale: 既保留使役和数量增长之意，也以“要”传达应许所具有的将来指向。
- source_word: τὸ σπέρμα αὐτῶν
  choice: 他们的后裔
  rationale: σπέρμα字面为“种子”，在祖先应许语境中是集合用语，指其子孙后代；“后裔”在现代汉语中自然、庄重，并保留群体性的所指。
- source_word: ὡς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: 数目如天上的星
  rationale: 将表范围或衡量的与格τῷ πλήθει明确译为“数目”，同时保留传统的“天上的星”这一经文意象。
- source_word: ὡς τὴν ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: 又如海边的沙
  rationale: χείλος在此按地貌习语指海的边缘；“海边的沙”简洁自然，准确传达比较意象。
theological_decisions:
- issue: 祖先应许语境中σπέρμα的圣约性措辞及集合意义
  choice: 正文译作“后裔”，脚注说明原文为“种子”
  alternative: 正文直译作“种子”或译作“子孙”
  rationale: “后裔”能让现代读者清楚理解此处指众多后代；脚注保留希腊文与祖先应许用语的互文联系，也不把集合名词的表达擅自限定为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而清楚的祷告语言。“正如你曾对他们说的”承接上下文，“你要使”体现应许语气；两个“如……”的比喻保持平行，读来简洁有力。
