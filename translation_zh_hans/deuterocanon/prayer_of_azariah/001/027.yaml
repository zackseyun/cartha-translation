base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/027.yaml
  text: And he made the inside of the furnace like a whistling dew-laden wind[a], and the fire did not touch them at all, nor did it distress or trouble them.
translation:
  language: zh_hans
  text: 他使炉内仿佛有一阵带着露水、呼啸而过的风[a]；火丝毫没有碰到他们，也没有使他们受苦或受扰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仿佛有一阵带露水的风”，或“仿佛有露水的灵”。希腊语 πνεῦμα 可指“风”、“气息”或“灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησε
  choice: 使……仿佛有
  rationale: 保留 ποιέω 表达使炉内形成某种状态的使役意义，同时使现代汉语自然流畅。
- source_word: τὸ μέσον τῆς καμίνου
  choice: 炉内
  rationale: μέσον 在这里指炉子的内部空间；“炉内”简洁、自然，也准确保留空间含义。
- source_word: ὡς πνεῦμα δρόσου
  choice: 仿佛有一股带着露气……的风
  rationale: πνεῦμα 可指风、气息或灵；在火炉这一物理场景中，“风”最合语境。“带着露气”保留 δρόσου 所表达的露水或清凉湿气意象，而不把 πνεῦμα 神学化。
- source_word: διασυρίζον
  choice: 呼呼吹过
  rationale: 该分词描绘风穿行时的吹动与声响；“呼呼吹过”兼顾动态和听觉形象，比单用“吹”更生动。
- source_word: οὐχ ἥψατο αὐτῶν τὸ καθόλου τὸ πῦρ
  choice: 火丝毫没有碰到他们
  rationale: “碰到”直接对应 ἥψατο，“丝毫没有”体现 τὸ καθόλου 对否定的加强。
- source_word: ἐλύπησεν
  choice: 使他们受苦
  rationale: 该词可指造成痛苦、忧伤或困扰；在烈火环境中，“受苦”既能涵盖身体痛楚，也不排除更广义的苦楚。
- source_word: παρηνώχλησεν
  choice: 受到搅扰
  rationale: 该动词表示烦扰、侵扰或造成麻烦；“受到搅扰”与前面的“受苦”形成有区分而不重复的双重否定。
theological_decisions:
- issue: ἐποίησε 的隐含主语所指
  choice: 译作“他”，不明说是上帝还是使者
  alternative: 明确译作“上帝使”或“使者使”
  rationale: 希腊文本仅以动词形态表达第三人称单数主语。本节自身没有明说主语，保留“他”可维持上下文指代及其可能张力，避免在译文中额外判定施行神迹者。
- issue: πνεῦμα 在神迹场景中的含义
  choice: 译作“风”
  alternative: 译作“灵”或“气息”
  rationale: πνεῦμα 确有“灵、气息、风”等义，但这里描述火炉内部出现带露气且吹过的现象，物理性的“风”最贴合语境；脚注保留其他词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“带着露气、呼呼吹过的风”保留原文中清凉湿润的意象以及 διασυρίζον 的动态声响；分号呈现前后两幅紧密相连的画面。
