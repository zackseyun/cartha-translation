base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/065.yaml
  text: Bless the Lord[a], Hananiah, Azariah, and Mishael; sing praise to him and highly exalt him forever. For he has delivered us from Hades, and saved us from the hand of death, and rescued us from the midst of the burning flame, and redeemed us from the fire.
translation:
  language: zh_hans
  text: 哈拿尼雅、亚撒利雅、米沙利啊，你们要称颂主；要歌颂他，高高尊崇他，直到永远。因为他把我们从阴间[a]救出，从死亡的手中拯救我们，从燃烧的烈焰中搭救我们，又把我们从火中救赎出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从坟墓”。希腊文作“从阴间”，指死者所在之境。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 此处是复数命令式，要求三人向主发出赞美和颂赞；“称颂”既保留礼仪语气，也比直译“祝福”更符合现代汉语中人对上帝说话的习惯。
- source_word: τὸν κύριον
  choice: 主
  rationale: 在犹太希腊文颂歌语境中，κύριος是对上帝的称号；译作“主”准确、自然，并符合经文体例。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含有唱诗赞美之意；“歌颂”简洁地保留了歌唱和赞美两层含义。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该复合动词强化“高举、尊崇”的含义；“尊他为至高”以自然中文表达其加强语气，并适合颂歌的反复句式。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是颂赞语中表示持续无尽的惯用表达；译作“永远”清楚自然。
- source_word: ἐξείλετο
  choice: 救出
  rationale: 该动词表示从危险境地中解救出来；“救出”保留了ἐξ所强调的“从……出来”，也与下文其他救援动词有所区别。
- source_word: ἐξ ᾅδου
  choice: 从阴间
  rationale: ᾅδης指死者所在之境；“阴间”比“坟墓”更能保留其空间性和神学张力，同时以脚注注明另一种理解。
- source_word: ἔσωσεν
  choice: 拯救
  rationale: 直陈从致命危险中得救；“拯救”是自然而准确的对应词，在此主要指具体的性命获救。
- source_word: ἐκ χειρὸς θανάτου
  choice: 从死亡的手中
  rationale: 保留原文“手”的拟人化意象，不将其平化为“死亡的权势”或“死亡的掌控”。
- source_word: ἐρρύσατο
  choice: 搭救
  rationale: ῥύομαι表示从迫近的危险中救援；“搭救”形象自然，也避免与前面的“救出”和“拯救”完全重复。
- source_word: ἐκ μέσου καιομένης φλογός
  choice: 从燃烧的烈焰中
  rationale: “中”体现ἐκ μέσου所指从火焰内部获救，“燃烧的烈焰”保留原文的强烈火焰意象。
- source_word: ἐλυτρώσατο
  choice: 救赎出来
  rationale: λυτρόω含释放、赎救之意；“救赎”保留其赎救色彩，加“出来”则使具体脱离火焰的语境在中文中更清楚。
theological_decisions:
- issue: 在从致命危险中蒙救的感恩语境里如何翻译ᾅδης
  choice: 从阴间
  alternative: 从坟墓；从冥府
  rationale: 原文明确使用ᾅδης，而不只是“死亡”或“坟墓”。正文采用“阴间”，以保留死者领域的含义及其神学张力；脚注列出较具解释性的“坟墓”。
- issue: 具体获救语境中λυτρόω的赎救色彩
  choice: 救赎出来
  alternative: 解救出来；释放出来
  rationale: 原文最后一个救援动词带有赎回、释放的语义色彩。“救赎”保留这一层次，但不把本节限定为某种特定的系统神学解释。
translation_notes:
  register: 采用现代、庄重而适合颂歌诵读的标准普通话。保留原文连续四个救援动词的层次，以“救出、拯救、搭救、救赎”呈现其修辞推进；人名采用常见圣经译名，并用呼语“啊”清楚表达希腊文呼格。
