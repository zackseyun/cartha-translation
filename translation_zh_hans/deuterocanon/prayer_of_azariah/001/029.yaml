base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/029.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and highly exalted forever; and blessed is your holy, glorious name, and supremely praised and highly exalted through all the ages.
translation:
  language: zh_hans
  text: 主啊，我们列祖的上帝，你当受称颂、赞美和高高尊崇，直到永远；你荣耀的圣名[a]也当受称颂，受极大的赞美和高高尊崇，直到万世。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你荣耀的名，就是那圣洁的名。”希腊语的表达较为紧凑，直译近似“你荣耀的名，那圣洁的”。
    reason: 说明压缩的希腊语属格与后置形容词结构，并保留较贴近原文形式的理解。
lexical_decisions:
- source_word: Εὐλογητὸς εἶ
  choice: 你当受称颂
  rationale: 这是直接称颂上帝的述谓式祝颂语。汉语用“当受称颂”自然表达配得称颂之意，而不把它误解为祈使式愿望。
- source_word: Κύριε ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 主啊，我们列祖的上帝
  rationale: 保留呼格“主啊”和传统圣经用语“列祖”，既反映 πατέρων 的阳性复数，也传达其家族与盟约背景。
- source_word: αἰνετὸς
  choice: 受赞美
  rationale: 采用动态述谓表达，与祝颂语境相称，并区别于前面的“受称颂”。
- source_word: ὑπερυψούμενος
  choice: 被尊为至高
  rationale: 表达复合词的加强意味；相较机械的“被高高举起”，更符合现代汉语中对上帝的颂赞用语。两处保持一致。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永
  rationale: 简洁自然地表达持续到万世的时间意义，同时与后一句较完整的 εἰς ἅπαντας τοὺς αἰῶνας 作出层次区别。
- source_word: τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον
  choice: 你那荣耀的圣名
  rationale: 希腊语字面结构为“你荣耀的名，那圣洁的”。译文保留“荣耀”与“圣”两项修饰，同时采用自然的现代汉语语序。
- source_word: ὑπεραινετὸν
  choice: 受至高的赞美
  rationale: 体现 ὑπερ- 的加强作用，并与普通的 αἰνετός“受赞美”有所区分；不译作“超乎赞美”，以免引入原文未明确表达的不可言喻含义。
- source_word: εἰς ἅπαντας τοὺς αἰῶνας
  choice: 世世无穷
  rationale: 明确反映 ἅπαντας“所有”的强化，并以庄重而易懂的汉语表达历世历代、永无止境之意。
theological_decisions:
- issue: 祝颂公式应译为陈述、祈愿，还是配得式表达
  choice: 你当受称颂
  alternative: 愿你受称颂；你是有福的
  rationale: Εὐλογητὸς εἶ 是第二人称述谓结构。在对上帝的颂赞中，“当受称颂”既保留直接宣告的力量，也避免汉语“有福”可能造成的受福者含义。
- issue: πατέρων 应译为“列祖”还是“祖先”
  choice: 列祖
  alternative: 祖先
  rationale: “列祖”准确保留阳性复数和传统盟约性表达，在现代汉语圣经语体中仍清楚可懂；“祖先”虽更日常，却会淡化该固定称谓的色彩。
- issue: τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον 的属格关系
  choice: 你那荣耀的圣名
  alternative: 你荣耀的名，就是那圣名；你荣耀之圣名
  rationale: 原文结构紧凑，可理解为“你荣耀的名，那圣洁的”。正文用自然汉语保留“荣耀”与“圣”而不强行界定其句法关系，脚注提供较贴近形式的译法。
translation_notes:
  register: 采用现代、庄重而可诵读的赞美诗体。“主啊”“列祖”“世世无穷”保留经文的礼仪感，但避免古奥虚词。两个加强词分别译为“尊为至高”和“至高的赞美”，尽量呈现原文重复与递进。
