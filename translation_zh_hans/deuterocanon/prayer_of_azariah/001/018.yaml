base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/018.yaml
  text: And now we follow after you with our whole heart[a], and we fear you, and we seek your face.
translation:
  language: zh_hans
  text: 现在，我们全心跟随你，惧怕你，寻求你的面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“寻求你的临在”。希腊文直译为“寻求你的面”，这是圣经中的惯用说法，可指寻求上帝的临在或恩惠。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: 现在
  rationale: 表达当前祈求的时间转折；汉语不必机械补出“并且”，语气更自然。
- source_word: ἐξακολουθοῦμεν
  choice: 跟随你
  rationale: 该复合动词表示跟随、追随；宾语在希腊文中省略，但由语境可明确补为“你”。不额外加入“继续”，以免把可能的持续意味说得过实。
- source_word: ἐν ὅλῃ καρδίᾳ ἡμῶν
  choice: 全心
  rationale: 这是表示完整、专一委身的圣经惯用语；“全心”简洁自然，并传达“用我们全部的心”。
- source_word: φοβούμεθά σε
  choice: 惧怕你
  rationale: 保留 φοβέομαι 的直接含义及其面对上帝时兼有敬畏意味的张力，不在正文中将其弱化为单纯的“尊崇”。
- source_word: ζητοῦμεν τὸ πρόσωπόν σου
  choice: 寻求你的面
  rationale: 按原文保留“面”的具体意象和圣经互文；其惯用含义可指寻求上帝的临在或恩惠，另以脚注说明。
theological_decisions:
- issue: φοβούμεθά σε 用于对上帝的态度
  choice: 惧怕你
  alternative: 敬畏你
  rationale: 原文明确使用“惧怕”的词语；正文保留畏惧与敬畏并存的神学张力，不将含义预先限定为尊敬。
- issue: ζητοῦμεν τὸ πρόσωπόν σου 的惯用含义
  choice: 寻求你的面
  alternative: 寻求你的临在
  rationale: 正文保留原文意象，不把惯用意义直接改写进正文；脚注提供自然的解释性译法。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。句中三个并列动词保持原文推进节奏；保留“惧怕”和“你的面”的直译色彩，以呈现原文的神学张力与意象。
