  text: but may we be accepted with a broken soul and a humbled spirit;[a]
translation:
  language: zh_hans
  text: 但愿我们以破碎的心灵和谦卑的灵蒙悦纳；[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但愿我们以痛悔的心灵和被降卑的灵蒙接纳。”
    reason: 保留συντετριμμένῃ可作“痛悔的”、τεταπεινωμένῳ较明确的被动状态，以及προσδέχομαι可作“接纳”的词义选择。
lexical_decisions:
- source_word: ἀλλʼ
  choice: 但愿
  rationale: ἀλλά承接上文形成转折；与愿望式动词合译为“但愿”，既显出转折，也自然表达祈愿。
- source_word: ἐν
  choice: 以
  rationale: 此处表示蒙悦纳时所具有的状态或方式；“以”在中文祷告语境中自然，也保留凭此状态来到上帝面前的意味。
- source_word: ψυχῇ
  choice: 心灵
  rationale: ψυχή在此指人的内在生命。“心灵”比单用“灵魂”更符合现代汉语的忏悔语境，同时不将其弱化为一般的“心情”。
- source_word: συντετριμμένῃ
  choice: 破碎的
  rationale: 完成时被动分词表示已经被击碎、压碎而处于破碎状态；“破碎”保留原文意象，未直接解释成“痛悔”。
- source_word: πνεύματι
  choice: 灵
  rationale: 与ψυχή形成诗性平行，又使用不同词项；译作“灵”保留二者的词汇区别。
- source_word: τεταπεινωμένῳ
  choice: 谦卑的
  rationale: 完成时被动分词表示被降卑后处于卑微状态；中文“谦卑”自然适合向上帝祈求的语域，虽不完全显出被动意味。
- source_word: προσδεχθείημεν
  choice: 愿我们……蒙悦纳
  rationale: 被动愿望式表达祈求被上帝接纳。“蒙悦纳”兼顾被动语态、神圣语境及有利接纳的含义。
theological_decisions:
- issue: ψυχή与πνεῦμα的人论并列
  choice: 分别译作“心灵”和“灵”
  alternative: 合并为泛指内在自我的表达，如“内心”
  rationale: 原文以两个不同名词构成平行结构；保留区分可维持诗歌与神学张力，但不据此断言二者必为可严格分割的实体。
- issue: συντετριμμένῃ的忏悔意象
  choice: 译作“破碎的”
  alternative: 译作“痛悔的”
  rationale: “破碎”更直接保留希腊文被击碎、压碎的形象；“痛悔”是合乎语境的解释，但会更明确地限定内在情感。
- issue: τεταπεινωμένῳ的状态与能动性
  choice: 译作“谦卑的”
  alternative: 译作“被降卑的”或“卑微的”
  rationale: “谦卑的灵”符合自然、庄重的现代中文；同时不把此状态明确归因于自我选择或外在羞辱。
translation_notes:
  register: 采用现代、庄重的祷告语体。“蒙悦纳”略带经文色彩，但普通读者仍可理解；正文保留“破碎”的原文意象，并用脚注列出较解释性的译法。
