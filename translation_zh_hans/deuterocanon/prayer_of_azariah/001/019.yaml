translation:
  language: zh_hans
  text: 求你不要使我们蒙羞，却要按你的宽厚，按你丰盛的怜悯，向我们施怜悯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ καταισχύνῃς ἡμᾶς
  choice: 求你不要使我们蒙羞
  rationale: καταισχύνω表示使人受羞辱、蒙羞；“使我们蒙羞”自然、庄重，并保留直接祈求的语气。汉语补出“求你”，以自然表达希腊语否定命令式在祷告中的恳求语气。
- source_word: ποίησον μεθʼ ἡμῶν ἔλεος
  choice: 向我们施怜悯
  rationale: 原文直译近于“与我们行怜悯”；“向我们施怜悯”保留ποιέω的行动性，也符合现代汉语祷告语体。
- source_word: ἐπιείκειάν
  choice: 宽厚
  rationale: ἐπιείκεια可指温和、宽容、仁厚或从宽相待；“宽厚”兼顾品格上的温和与处置上的宽容，且不与后面的“怜悯”混同。
- source_word: πλῆθος τοῦ ἐλέους σου
  choice: 你丰盛的怜悯
  rationale: πλῆθος表示数量或程度之多；“丰盛”与“怜悯”搭配自然，传达其充盈广大。
- source_word: ἔλεος
  choice: 怜悯
  rationale: 在悔罪祈求的语境中，“怜悯”准确表达向困苦或有罪之人所施的慈悲与恩待。
theological_decisions:
- issue: 如何区分并列的ἐπιείκεια与ἔλεος
  choice: 分别译为“宽厚”和“怜悯”
  alternative: 都归入“怜悯”或译为“仁慈”和“怜悯”
  rationale: 原文有意使用两个相关但不同的词：前者侧重温和、宽容的品格与处置，后者侧重实际施予的怜悯。分别翻译可保留祷告的层次与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。句式保留原文“不要……却要……”的对照，以及两次“按……”所表达的平行依据；为避免汉语累赘，将两个“按”协调为“按你的宽厚和你丰盛的怜悯”。
