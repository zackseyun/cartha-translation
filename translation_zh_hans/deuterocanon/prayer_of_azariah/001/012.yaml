base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/012.yaml
  text: And do not withdraw your mercy from us[a], for the sake of Abraham your beloved, and Isaac your servant[b], and Israel your holy one.
translation:
  language: zh_hans
  text: 求你不要从我们这里收回你的怜悯[a]；看在你所爱的亚伯拉罕、你的仆人以撒和你的圣者以色列的份上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你的怜悯不要离开我们。”
    reason: lexical_alternative
  - marker: b
    text: 这里的“以色列”指先祖雅各，是他后来所得的名字。
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: 收回
  rationale: 此处为及物、使动用法，以“你的怜悯”为宾语，表示不使怜悯离开众人；“收回”在现代汉语中自然，并保留关系性的语气。
- source_word: τὸ ἔλεός σου
  choice: 你的怜悯
  rationale: ἔλεος在祷告语境中指怜悯、慈悲；“怜悯”简洁庄重，不额外加入希腊文本未明说的盟约含义。
- source_word: διὰ
  choice: 看在……的份上
  rationale: διὰ加宾格在这里引出祈求所诉诸的依据；此译法符合现代汉语祷告表达，并保留“为了……的缘故”的申诉意味。
- source_word: τὸν ἠγαπημένον ὑπὸ σοῦ
  choice: 你所爱的
  rationale: 明确表达被动分词和ὑπὸ σοῦ所指的“蒙你所爱”，比单译“你亲爱的”更准确自然。
- source_word: τὸν δοῦλόν σου
  choice: 你的仆人
  rationale: δοῦλος也可指奴隶，但在先祖的尊称中重点是归属与忠心事奉；“仆人”较符合此处功能。
- source_word: τὸν ἅγιόν σου
  choice: 你的圣者
  rationale: ἅγιος为单数名词化用法，指分别归于上帝的人；“圣者”保留其称号性质，也避免译成带后世教会色彩的“圣徒”。
- source_word: Ἰσραήλ
  choice: 以色列
  rationale: 照希腊文本保留先祖雅各的盟约之名，不改写成“雅各”。
theological_decisions:
- issue: 先祖称号中δοῦλος的译法
  choice: 仆人
  alternative: 奴隶
  rationale: 此处列举先祖并以尊称同位说明，强调以撒对上帝的归属和事奉；译作“奴隶”会在现代汉语中不恰当地突出社会身份。
- issue: διὰ所引出的先祖申诉
  choice: 看在……的份上
  alternative: 因为……；为了……的缘故
  rationale: 经文以众先祖与上帝的关系作为继续施怜悯的申诉依据；此译法保留其代求和盟约性的语势，却不把隐含关系扩写为更明确的教义陈述。
- issue: “以色列”的所指
  choice: 正文保留“以色列”，脚注说明指先祖雅各
  alternative: 正文直接译作“雅各”
  rationale: 希腊文本有意使用Ἰσραήλ，应保留其原名形式及可能的盟约意味，同时用脚注帮助普通读者辨认。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”补出希腊文禁令式祈求在汉语中的自然语气；用分号区分祈求与申诉依据。所有脚注标记均已置于正文。
