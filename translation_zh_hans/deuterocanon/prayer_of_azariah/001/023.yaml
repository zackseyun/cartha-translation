  text: And the king’s attendants who threw them in did not stop feeding the furnace with naphtha and pitch and tow and brushwood[b][a], keeping it burning.
translation:
  language: zh_hans
  text: 那些把他们扔进去的王的侍从，没有停止用石脑油[a]、松脂、麻屑和葡萄藤枝[b]给火窑添燃料，仍不断使火窑燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “石脑油”或译“天然沥青”；希腊词指一种极易燃烧的石油类物质。
    reason: lexical_alternative
  - marker: b
    text: “葡萄藤枝”或译“枝柴”；这里可能特指剪下后用作燃料的葡萄藤枝。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διέλειπον
  choice: 一直没有停手，不断
  rationale: 否定词配合未完成时表达动作持续不止；采用两个相承的现代汉语短语，既呈现“不停止”，也自然引出持续添火的动作。
- source_word: οἱ ἐμβάλλοντες αὐτοὺς
  choice: 把他们扔进去的
  rationale: 分词短语指明这些侍从正是把三人投入火窑的人；“扔进去”保留动作的强制性和叙事语气。
- source_word: ὑπηρέται τοῦ βασιλέως
  choice: 王室侍从
  rationale: ὑπηρέται泛指服侍君王、听命行事的下属；“王室侍从”自然明确，又不把他们限定为具有特定官衔的官员。
- source_word: καίοντες τὴν κάμινον
  choice: 给火窑添火
  rationale: 字面近于“使火窑燃烧”；按汉语习惯译为“给火窑添火”，准确表达加入燃料、维持烈火的动作。
- source_word: ἀφθάλτῳ
  choice: 石脑油
  rationale: 此词指一种易燃的石油类物质；“石脑油”能体现其易燃液态燃料性质，并与后面的πίσσα区分。异译见脚注。
- source_word: πίσσῃ
  choice: 柏油
  rationale: 指可燃的焦油或树脂状黏稠物；“柏油”是普通读者易懂的对应词，也能与“石脑油”区别。
- source_word: στιππύῳ
  choice: 麻屑
  rationale: 指可作引火物的麻、亚麻等纤维废料；“麻屑”简明地传达其材质和碎屑形态。
- source_word: κληματίδα
  choice: 葡萄枝
  rationale: 该词可特指剪下后用作燃料的葡萄藤枝；上下文列举燃料，译作“葡萄枝”具体而贴合词义，同时以脚注保留较宽泛的理解。
