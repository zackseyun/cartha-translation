base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/034.yaml
  text: Bless the Lord[a], all the works of the Lord; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 主的一切作为啊，要称颂主；要歌颂他，高高尊崇他，直到永远。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到永远”希腊文直译为“进入诸世代”（或译“归于万世”），是表示颂赞永不止息的惯用语。
    reason: 说明 εἰς τοὺς αἰῶνας 的较直译形式及其在颂歌语境中的惯用含义。
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这是复数命令式。中文“称颂”兼具赞美与宣告美善的礼仪色彩，比直译“祝福”更自然，也适合受造之物向主发出的颂赞。
- source_word: πάντα τὰ ἔργα Κυρίου
  choice: 主的一切作为
  rationale: 保留属格关系以及对主全部 έργα 的呼唤。“作为”可指主所造、所成就的一切；原文在这里可能涵盖受造万物，因此不缩窄为“事迹”或径直改作“受造物”。
- source_word: Κυρίου / τὸν κύριον
  choice: 主
  rationale: 前者构成“主的一切作为”，后者是“称颂”的宾语。统一译作“主”，符合希腊文颂歌语境和现代中文圣经体例。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: ὑμνέω 带有以诗歌或颂歌赞美之意；“歌颂”简洁自然，并保留其歌唱性的礼仪语气。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该复合动词含强烈的高举、极度尊崇之意。“尊他为至高”在现代中文中自然庄重，也表达前缀 ὑπερ- 的加强作用。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 字面为“直到众世代／进入诸世代”，在这段反复出现的颂歌句式中表示持续无尽；“永远”是最自然的中文对应，脚注保留较直译的表达。
theological_decisions:
- issue: 次经希腊颂歌中 κύριος 的译法
  choice: 主
  alternative: 上主；耶和华；主人
  rationale: 原文使用 κύριος，并未在本节显明要求还原某一希伯来神名形式。“主”既保留敬称与礼仪功能，也避免把文本未明确给出的形式加入译文。
- issue: πάντα τὰ ἔργα Κυρίου 的指称范围
  choice: 主的一切作为
  alternative: 主所造的一切；主的一切受造物
  rationale: 本段语境很可能将万物人格化，召唤它们赞美主；但 έργα 本身可兼指作品、作为和所成就之事。译作“一切作为”保留这种语义张力，不在正文中将范围限定为受造物。
translation_notes:
  register: 采用现代、庄重而可诵唱的中文，保留原文三重复数命令式的呼召语气。以“啊”标明“主的一切作为”是直接呼语；分号维持两组平行颂赞动作。脚注标记置于其所解释的“永远”所在句末。
