base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/005.yaml
  text: And you have executed true judgments in all that you have brought upon us and upon your holy city[a], Jerusalem, the city of our fathers; for in truth and judgment you have done all these things because of our sins.
translation:
  language: zh_hans
  text: 对于你使这一切临到我们，也临到你的圣城耶路撒冷——我们列祖的城——，你所施行的审判都是真实的；因为你因我们的罪所做的这一切，都是本着真理和审判[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真理和审判”也可译为“真理和公正”。希腊语此处的词可含“审判、裁断”或“公正”之意；正文保留“审判”，以呼应本节前面的司法用语。
    reason: 保留κρίσει可译为司法裁断或公正的词义幅度，并维持本节重复的司法语汇。
lexical_decisions:
- source_word: κρίματα ἀληθείας
  choice: 真实的判决
  rationale: κρίματα是复数，指司法性的裁断或判决；ἀληθείας说明这些判决符合真实。译作“真实的判决”既保留司法语域，也避免把它泛化为抽象的“正义”。
- source_word: κατὰ πάντα ἃ ἐπήγαγες ἡμῖν καὶ ἐπὶ τὴν πόλιν σου τὴν ἁγίαν
  choice: 你使这一切临到我们，也临到你的圣城
  rationale: ἐπάγω在此表示使灾祸或惩罚临到。中文采用“使……临到”保留主动和惩戒意味，却不额外强化为“加害”或“摧毁”。κατὰ πάντα以“在这一切事上”承接，表达判决体现在所降下的一切事中。
- source_word: τὴν τῶν πατέρων ἡμῶν Ἰερουσαλήμ
  choice: 就是我们祖先的耶路撒冷
  rationale: 原文以同位结构进一步指明圣城是与祖先相连的耶路撒冷。“我们祖先的耶路撒冷”简洁保留其祖传、群体归属意味。
- source_word: ἐν ἀληθείᾳ καὶ κρίσει
  choice: 合乎真理和公正
  rationale: 该短语说明上帝行事的准则或性质。ἀλήθεια译为“真理”，κρίσις在这里可指审判或公正；正文用自然中文“合乎真理和公正”，脚注保留“审判”这一司法性更强的可能译法。
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: 因我们的罪
  rationale: διά加宾格表示原因。“因我们的罪”准确、简洁，并保留群体认罪的力度。
theological_decisions:
- issue: 如何保留上帝因群体之罪降罚，同时宣认其裁决真实公正的张力
  choice: 明确说灾祸是上帝使之临到，并称其为“真实的判决”，又说明这一切“因我们的罪”而发生
  alternative: 弱化为上帝容许灾祸发生，或只说上帝所做的是正确的
  rationale: 原文把临到人民与耶路撒冷的事直接归于上帝的作为，并以司法语言肯定其真实性和公正性。译文不回避神圣惩罚，也不增添关于其机制的解释。
- issue: κρίσις应译为“公正”还是“审判”
  choice: 正文译“公正”，脚注注明也可译“审判”
  alternative: 正文直译为“审判”
  rationale: “合乎真理和公正”在现代汉语中自然，并能表达行为符合正义；但κρίσις具有明确的裁判含义，因此用脚注保存这一真实的词义张力，并与前面的“判决”相呼应。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。为避免希腊语长句在中文中显得牵强，将前半句重组为先陈述所临到的事，再说明其中施行的判决；未改变因果关系。以“圣城”“祖先”“判决”等词保留经文的群体认罪和司法语域。
