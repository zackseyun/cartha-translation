  text: Bless the Lord, dews and showers; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 露水和雪啊，要称颂主；要歌颂他，永远高举他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δρόσοι
  choice: 露水
  rationale: 保留复数所表达的自然现象类别；现代汉语以集合名词“露水”自然表达。
- source_word: νιφετοί
  choice: 霜雪
  rationale: 该词指降雪、雪阵或夹带风势的雪天现象；“霜雪”在汉语诗歌语体中自然，并与“露水”形成凝练并列，同时避免过度限定为暴风雪或雨阵。
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 在受造物向主发出的赞美呼召中，“称颂”比字面“祝福”更符合现代汉语宗教语境。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 准确传达以颂歌赞美之意，并保持诗歌体的呼召语气。
- source_word: ὑπερυψοῦτε
  choice: 尊……为至高
  rationale: 体现加强式动词“极力高举、尊为至高”的含义，且避免生硬的“极度高举”。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 自然而准确地表达延续到万世的时间意义。
theological_decisions:
- issue: 受造界是否被拟人化为敬拜者
  choice: 保留直接呼语“露水和霜雪啊”及命令式呼召
  alternative: 改写为愿露水和霜雪显明主的荣耀
  rationale: 希腊文直接呼唤这些自然现象称颂主；译文保留诗歌性的拟人表达，不将其解释化。
- issue: ὑπερυψοῦτε的赞美强度
  choice: 译作“尊他为至高”
  alternative: 译作“极力高举他”
  rationale: 前者在现代汉语中更自然，同时保留对主至高地位的强烈宣认；不额外引入特定教义解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留赞歌中平行的命令句和自然界拟人化。句式凝练，适合礼仪诵读；“主”依照希腊文 τὸν κύριον，不另行补入神名。
