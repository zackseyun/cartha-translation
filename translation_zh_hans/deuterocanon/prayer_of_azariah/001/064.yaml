base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/064.yaml
  text: Bless the Lord[a], you holy and humble in heart; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 你们虔诚[a]、心里谦卑的人，要称颂主；要歌颂他，极力尊崇他，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虔诚”也可译为“圣洁”或“敬虔”。
    reason: ὅσιοι可指虔诚、敬虔或圣洁的人；脚注保留其词汇替代可能。
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这是复数命令式，在礼仪性的反复句中表示以言语颂赞上主；“称颂”比现代汉语中容易被理解为赐福他人的“祝福”更自然准确。
- source_word: ὅσιοι
  choice: 虔诚的人
  rationale: ὅσιος在此指对神虔敬、敬虔的人；译作“虔诚的人”既保留宗教含义，也避免把它与表示分别为圣的其他“圣洁”词汇完全等同。
- source_word: ταπεινοὶ τῇ καρδίᾳ
  choice: 心里谦卑的人
  rationale: 保留τῇ καρδίᾳ所指的内在心志，并以现代汉语常用表达传达ταπεινός的谦卑、卑微之意。
- source_word: τὸν κύριον
  choice: 主
  rationale: 在向神发出的礼仪颂赞中，κύριος自然译为“主”，不额外加入原文没有的称谓。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含唱诗赞美之意；“歌颂”兼顾音乐性与庄重的礼仪语域。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: ὑπερυψόω带有极力高举、尊为极高的加强意味；“尊他为至高”在汉语中自然，并保留其强化语气。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这一礼仪惯用语在此表达持续无尽；“永远”是清楚、自然的现代汉语对应表达。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 上下文是对神的敬拜与颂赞，“主”符合其称号功能；“主人”会引入不合本段礼仪语境的日常从属关系色彩。
- issue: ὅσιοι的语义范围
  choice: 虔诚的人
  alternative: 圣洁的人
  rationale: 该词可涵盖“圣洁、敬虔、虔诚”等含义；本译文选择“虔诚”以凸显对神忠敬的品格，同时不把它收窄为某种特定的成圣教义。
translation_notes:
  register: 采用庄重而明白的现代标准汉语，保留原文两个并列命令句及礼仪性节奏；用“你们这些……的人”明确复数呼语，以顿号连接两个并列品格。
