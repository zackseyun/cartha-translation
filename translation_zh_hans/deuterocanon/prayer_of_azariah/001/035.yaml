  text: Bless the Lord[a], angels of the Lord[b]; sing hymns and highly exalt him forever.
translation:
  language: zh_hans
  text: 主的众天使啊，当称颂主；当歌颂他，永远极力尊崇他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 颂赞
  rationale: 这是复数命令式。在敬拜语境中可表示“称颂、赞美”；“颂赞”既保留礼仪色彩，也符合现代汉语表达。
- source_word: ἄγγελοι
  choice: 众天使
  rationale: 宇宙颂歌的语境表明所指是天上的使者，而非人间信使；加“众”体现希腊语复数。
- source_word: Κυρίου / τὸν κύριον
  choice: 主
  rationale: κύριος在这里既用于“主的众天使”，又作颂赞的对象；译作“主”符合其敬拜语境。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: ὑμνέω带有以诗歌或颂歌赞美的含义；“歌颂”自然地保留了歌唱与赞美两层意思。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 复合动词带加强语气，意为极力高举、尊为至高；此译法比生硬的“极度高举”更符合现代汉语敬拜语言。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 该固定短语在本颂歌的反复句式中表达绵延不绝，译作“永远”简洁自然。
theological_decisions:
- issue: κύριος在希腊语敬拜颂歌中的译法
  choice: 主
  alternative: 主人
  rationale: 上下文是向上帝发出的宇宙性颂赞，“主”准确保留宗教称谓及经文语体；“主人”会带入人际主仆关系的日常含义。
- issue: εὐλογεῖτε用于受造者对上帝的行动
  choice: 颂赞
  alternative: 祝福
  rationale: 原词本身可直译为“祝福、称颂”，但当受造者以敬拜语言向主发出该行动时，现代汉语“颂赞”更准确；“祝福主”容易被理解为向主赐福，造成不必要的语义偏移。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，以呼语“主的众天使啊”体现直接召唤，并保留原文三个复数命令的诗歌推进。第二、第三个命令合并在同一分句中，以“歌颂他，永远尊他为至高”再现反复颂歌的节奏。
