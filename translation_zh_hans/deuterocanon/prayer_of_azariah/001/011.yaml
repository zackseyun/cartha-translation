  text: Do not give us over utterly for the sake of your name[b][a], and do not break your covenant.
translation:
  language: zh_hans
  text: 求你为你名的缘故，不要把我们彻底交出去[a]，也不要废弃你的约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要把我们交出去，直到尽头”；即，不要完全弃绝我们。
    reason: lexical_alternative
  - marker: b
    text: 原文动词字面指“使散开”或“驱散”；这里也可译作“不要破坏你的约”或“不要废除你的约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ παραδῷς ἡμᾶς
  choice: 不要将我们……交出去
  rationale: παραδίδωμι的基本义是“交出、交付”。“将我们交出去”保留了被交在敌人或毁灭权势之下的含义，又不额外说明接受者。
- source_word: εἰς τέλος
  choice: 彻底
  rationale: 该短语可直译为“直到尽头”，在此也可表示完全、最终的程度。“彻底”自然地传达祈求中“不被完全弃绝”的语气，同时以脚注保留其字面和时间性可能。
- source_word: διὰ τὸ ὄνομά σου
  choice: 为了你的名
  rationale: διά加宾格在此表达所诉诸的缘由或关切；“为了你的名”符合现代汉语宗教语境，指向上帝的名誉与所启示的身份，而不展开解释。
- source_word: μὴ διασκεδάσῃς
  choice: 不要使……分崩离散
  rationale: διασκεδάζω的具体意象是“使散开、驱散”。“分崩离散”虽与“约”搭配具有诗性张力，却能在汉语中保留原文不寻常的离散意象；“废弃、破坏”列于脚注。
- source_word: σου τὴν διαθήκην
  choice: 你的约
  rationale: διαθήκη在圣经语境中指上帝与其子民所立的约。“你的约”简洁、庄重，并准确保留属格关系。
theological_decisions:
- issue: εἰς τέλος在求怜悯祷告中的含义
  choice: 彻底
  alternative: 直到尽头；永远
  rationale: 上下文主要强调完全或最终被交出去，但原短语亦带有“到尽头”的字面可能；正文采用自然的程度表达，脚注保留歧义。
- issue: διασκεδάσῃς与“约”搭配时的译法
  choice: 使你的约分崩离散
  alternative: 废弃你的约；破坏你的约
  rationale: 原文使用通常表示“使散开”的动词，形成不寻常的比喻。正文保留这一意象，避免直接把它收窄为法律性的“废除”或惯用的“毁约”。
translation_notes:
  register: 采用现代、庄重而可诵读的祷告语体。“求你”补足汉语祈求句的自然语气；“交出去”保留原文动作而不补明交给谁；“分崩离散”刻意保留希腊文与“约”搭配时的鲜明且不寻常的比喻。
