  yaml_path: translation/deuterocanon/prayer_of_azariah/001/036.yaml
  text: Bless the Lord, O heavens; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 诸天哪，要称颂主；要歌颂他，极力高举他，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式；“称颂”既表达祝颂、赞美之意，也适合礼仪诗歌的反复句式。
- source_word: οὐρανοί
  choice: 诸天哪
  rationale: 复数呼格，指受呼召赞美主的诸天；“哪”明确保留直接呼语和诗体语气。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此是对上帝的称谓；希腊文本并未直接出现希伯来神名，故译作“主”。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含唱诗赞美之意；“歌颂”自然简洁，并保留音乐性的语义。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: ὑπερ-强化ὑψόω的高举含义；此译保留强烈程度，同时符合现代汉语的颂赞表达。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表示持续至万世的惯用语，“永远”是现代汉语中清楚自然的对应表达。
theological_decisions:
- issue: 在次经诗歌中如何翻译指向上帝的κύριος
  choice: 主
  alternative: 耶和华
  rationale: 源文本写作κύριον，而非希伯来神名；译作“耶和华”会引入希腊见证未直接呈现的形式。
- issue: ὑπερυψοῦτε的受事与神学表达
  choice: 尊他为至高
  alternative: 把他高举在万有之上
  rationale: 原文要求极度高举他，但未明说与“万有”比较；所选译法保留至高含义而不增添比较对象。
translation_notes:
  register: 采用现代、庄重而易懂的赞美诗体；两个并列命令句保留原文节奏，并以“诸天哪”呈现复数呼格。
