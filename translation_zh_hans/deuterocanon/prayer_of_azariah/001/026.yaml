base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/026.yaml
  text: But the angel of the Lord went down into the furnace together with those around Azariah[a], and drove the flame of the fire out of the furnace,
translation:
  language: zh_hans
  text: 但主的天使同亚撒利雅身边的人[a]一起下到火炉中，把火焰从火炉中赶了出去，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚撒利雅的同伴”。希腊文直译为“亚撒利雅周围的人”。
    reason: 词义替代：原文表达可按语境理解为亚撒利雅的同伴，但字面范围略宽。
lexical_decisions:
- source_word: ὁ δὲ
  choice: 然而
  rationale: δέ在这里承接叙事并带有轻微转折；“然而”能自然表现从先前危境转向神圣介入的意味，又不把对比说得过强。
- source_word: ἄγγελος Κυρίου
  choice: 主的使者
  rationale: ἄγγελος带定冠词，Κυρίου为属格；“主的使者”既准确，也符合现代汉语的庄重叙事语体。
- source_word: συνκατέβη ἅμα
  choice: 同……一起下到
  rationale: συν-与ἅμα都突出共同随行，译文以“同……一起”保留这一强调；“下到”则保留向下进入炉中的动作。
- source_word: τοῖς περὶ τὸν Ἀζαρίαν
  choice: 亚撒利雅身边的人
  rationale: 近按原文意为“围绕亚撒利雅的人”。“身边的人”在现代汉语中自然，并保留其范围较“同伴”略宽的表达。
- source_word: κάμινον
  choice: 炉
  rationale: κάμινος在本段指烈火窑炉；上下文已经明确其用途，简洁译作“炉”自然且准确。
- source_word: ἐξετίναξεν
  choice: 驱赶出去
  rationale: 该动词含用力抖出、逐出或排除之意；“驱赶出去”保留强力移除的动态感，又适合以火焰为宾语。
- source_word: τὴν φλόγα τοῦ πυρός
  choice: 火的烈焰
  rationale: 保留原文“火的火焰”这一属格结构的强调，同时用“烈焰”避免汉语中生硬的重复。
- source_word: ἐκ τῆς καμίνου
  choice: 从炉里
  rationale: ἐκ表示从内部向外；“从炉里”清楚呈现火焰被移出炉内的空间关系。
theological_decisions:
- issue: Κυρίου的译法
  choice: 主
  alternative: 上主；耶和华；主人
  rationale: 此处是希腊文叙事中的κύριος，译作“主”既忠实又不额外引入希伯来神名的特定排印或译名传统。
- issue: “主的使者”的身份
  choice: 保留“主的使者”，不进一步界定其身份
  alternative: 解释为神显；解释为普通受造天使
  rationale: 本节只称这位为“主的使者”，没有说明他究竟是受造的天使还是神显；译文保留这种神学上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“然而”表现轻微转折；“身边的人”贴近希腊文而不显生硬。句末保留逗号，以反映本节在原文中尚未结束、下节继续叙述的句法关系。
