base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/039.yaml
  text: Bless the Lord[a], sun and moon; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 太阳和月亮啊，要称颂主；要歌颂他，极力尊崇他，直到永远。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到永远”直译为“直到诸世代”。
    reason: 保留εἰς τοὺς αἰῶνας的复数形式及其礼仪性表达；此处按语境指无尽地延续。
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 颂赞
  rationale: 复数命令式，在本段礼仪性反复句中号召受造物称颂上主；“颂赞”兼具赞美与祝颂色彩，也适合现代汉语诗歌语体。
- source_word: ἥλιος καὶ σελήνη
  choice: 太阳和月亮啊
  rationale: 原文为直接呼语；加“啊”自然标明呼告，又不增添解释性内容。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此指以色列的上帝；译作“主”保留希腊文本的称谓形式，不引入原文未标示的小型大写惯例。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: ὑμνέω含以诗歌或颂歌赞美之意；“歌颂”在简体中文中简洁自然，并保留音乐性的语义。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该复合动词带强烈的高举、尊崇意味；“尊他为至高”既表达强化语气，也比生硬的“极度高举”更自然庄重。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表达无尽延续的惯用语；“永远”是现代汉语最清楚自然的对应，同时以脚注保留较直译的形式。
theological_decisions:
- issue: 次经赞歌语境中κύριος的译法
  choice: 主
  alternative: 上主；主人
  rationale: “主”准确保留神圣称谓及文本传统，又不把希腊文没有明示的专名形式强加给正文。
- issue: ὑπερυψοῦτε是否表达使上帝变得更高
  choice: 尊他为至高
  alternative: 极力高举他
  rationale: 此处是受造物承认并宣扬上帝至高，而非使上帝获得更高地位；所选译法保留尊崇力度，同时避免本体论上的误解。
translation_notes:
  register: 采用现代、庄重而可朗诵的赞歌语体；两个并列命令“颂赞／歌颂……尊……”保留原文反复推进的礼仪节奏。脚注标记置于所注释的“永远”之后。
