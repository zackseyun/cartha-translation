  yaml_path: translation/deuterocanon/prayer_of_azariah/001/002.yaml
  text: Then Azariah stood and prayed thus[a], and opening his mouth he gave thanks to the Lord together with his companions in the midst of the fire, while the furnace was being intensely heated by the Chaldeans. And they said,
translation:
  language: zh_hans
  text: 于是，亚撒利雅站着，这样祷告；他张开口，在火中同他的同伴们一起向主称谢[a]。当时，迦勒底人正猛烈地给炉子加火。他们说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“认罪”或“称颂”；这个希腊语动词可按语境表示承认，也可表示感谢或赞美。
    reason: 保留ἐξωμολογεῖτο的词义幅度及本段祷告中的神学张力。
lexical_decisions:
- source_word: στὰς δὲ Ἀζαρίας
  choice: 于是，亚撒利雅站起来
  rationale: 将不定过去时分词自然地译为先行动作，并用“于是”承接叙事。
- source_word: προσηύξατο οὕτως
  choice: 这样祷告
  rationale: 直接表达祷告行为，并保留 οὕτως 引出下文内容的功能。
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: 他张开口
  rationale: 保留原文庄重发言的惯用表达，不简化为“他说”。
- source_word: ἐξωμολογεῖτο τῷ κυρίῳ
  choice: 向主称谢[a]
  rationale: ἐξομολογέομαι 在七十士译本的敬拜语境中可指向神称谢、称颂，也可涉及承认罪过；正文采用自然且符合向主祷告语境的“称谢”，并以脚注保留其他语义。
- source_word: ἅμα τοῖς συνεταίροις αὐτοῦ
  choice: 与同伴们一同
  rationale: 准确表达共同参与，措辞简洁自然。
- source_word: ἐν μέσῳ τῷ πυρί
  choice: 在烈火中
  rationale: “烈火”自然传达身处火焰中央的险境，同时保持庄重。
- source_word: ὑποκαιομένης τῆς καμίνου ὑπὸ τῶν Χαλδαίων σφόδρα
  choice: 那时，迦勒底人正把炉火烧得极旺
  rationale: 把属格独立结构译为同时发生的背景动作；“烧得极旺”传达主动添火加热及 σφόδρα 的强烈程度。
- source_word: καὶ εἶπαν
  choice: 他们说
  rationale: 严格保留所据希腊文本的复数主语，并与前文亚撒利雅和同伴们共同祷告相呼应。
theological_decisions:
- issue: ἐξωμολογεῖτο 在兼有颂赞、感谢和认罪内容的祷告中的含义
  choice: 称谢
  alternative: 认罪；称颂
  rationale: 该动词在圣经希腊语中有承认、感谢和颂赞等相连的用法。正文以“称谢”呈现向主发出的敬拜言语，同时通过脚注保留祷告下文所显出的认罪意味，避免排除真实的语义张力。
- issue: καὶ εἶπαν 的复数与前文单数主体之间的转换
  choice: 他们说
  alternative: 他说
  rationale: 现有希腊文本明确使用复数，且前文提到亚撒利雅与同伴们一同祷告，因此不把复数改成单数。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“张开口”保留经文的郑重语气；末句使用复数“他们说”，忠实呈现原文虽显突然的主语转换。
