translation:
  language: zh_hans
  text: 让他们知道，惟有你是主上帝，并且你在整个有人居住的世界都大有荣耀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在全世界都大有荣耀。”希腊语οἰκουμένη可指“有人居住的世界／大地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώτωσαν
  choice: 让他们知道
  rationale: 第三人称复数不定过去时命令式；“让他们知道”自然保留祈愿、命令的语气。
- source_word: σὺ
  choice: 你
  rationale: 保留希腊文显式人称代词的强调作用，并与“惟有”自然结合。
- source_word: Κύριος θεὸς
  choice: 主上帝
  rationale: 作为对以色列上帝的神圣称号，译为现代汉语中庄重而通行的“主上帝”。
- source_word: μόνος
  choice: 惟有
  rationale: 表达排他性，并置于“你”之前，使汉语自然地呈现“只有你”的含义。
- source_word: ἔνδοξος
  choice: 你的荣耀遍及
  rationale: ἔνδοξος是谓语形容词，表示荣耀、显赫；结合ἐπί加宾格所表达的范围，以“你的荣耀遍及”形成自然汉语，同时保留与前一谓语由καί并列的关系。
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: 遍及整个有人居住的大地
  rationale: οἰκουμένη本义为有人居住的世界或大地；“遍及”体现ἐπί在此所指的普遍范围。
theological_decisions:
- issue: μόνος与Κύριος θεὸς所表达的神圣排他性
  choice: 惟有你是主上帝
  alternative: 你是独一的主上帝
  rationale: “惟有你”自然保留原文将排他性归于受呼告者的结构，也不把含义限定为一个复合称号。
- issue: καὶ ἔνδοξος与前一谓语的并列关系
  choice: 并且你的荣耀遍及整个有人居住的大地
  alternative: 并且你在整个有人居住的大地上满有荣耀
  rationale: 明确保留καί所连接的第二个谓语，同时以自然汉语表达ἔνδοξος及其范围；不将“荣耀”误作另一个主体。
translation_notes:
  register: 采用现代、庄重、易懂的祷告语言。“惟有”保留排他强调；“有人居住的大地”较形式地呈现οἰκουμένη，并以脚注给出自然替代译法。
