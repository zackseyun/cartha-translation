base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/040.yaml
  text: Bless the Lord, stars of heaven; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 天上的星辰啊，要称颂主；要歌颂他，极力尊崇他，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这是复数命令式；在向受造物发出的赞歌召唤中，译作“称颂”既保留“说美言、祝颂”的礼仪色彩，也比对神说“祝福”更符合现代汉语习惯。
- source_word: ἄστρα τοῦ οὐρανοῦ
  choice: 天上的星辰
  rationale: ἄστρα明确指星，τοῦ οὐρανοῦ说明其所属领域；“天上的星辰”自然、庄重，也保留原文的具体意象。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此是对神的称号；译作“主”忠实而简洁，不额外引入希伯来神名的排印惯例。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词带有以诗歌或赞美诗赞颂的含义；“歌颂”兼顾歌唱色彩和现代汉语的流畅性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 复合动词表达极力高举、尊崇之意；“尊他为至高”保留加强语气，并适合敬拜语境。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这一赞歌叠句中的惯用语表示持续无尽；“永远”是清楚、自然的现代汉语对应。
theological_decisions:
- issue: 次经赞歌中κύριος作为神圣称号的译法
  choice: 主
  alternative: 上主；主宰
  rationale: 希腊文本仅有κύριος。“主”直接反映该称号；“上主”可能带入特定传统的固定表达，“主宰”则偏向功能性释义。
- issue: ὑπερυψοῦτε是否陈述神被提升到更高地位
  choice: 尊他为至高
  alternative: 将他高高举起
  rationale: 这里是受造物以赞颂承认并宣扬神的至高，不宜让中文暗示神原先地位较低、后来才被提升；所选译法保留敬拜中的尊崇意义。
translation_notes:
  register: 采用现代、庄重而可诵读的赞歌体。两个分句均保留复数命令语气，以分号呈现平行结构；不添加原文没有的神名形式。
