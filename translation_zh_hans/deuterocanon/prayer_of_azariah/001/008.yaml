base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/008.yaml
  text: And now[a], all that you have brought upon us, and all that you have done to us, you have done in true judgment[b],
translation:
  language: zh_hans
  text: 如今[a]，你使一切临到我们身上，以及你向我们所做的一切，都是按着真实的审判所行的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如今”也可译作“现在”或“到了此时”。
    reason: lexical_alternative
  - marker: b
    text: “按着真实的审判”也可译作“以真实的审判”“按公义的审判”或“按公正的判断”。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: 如今
  rationale: 直接表达当前的承认与反思；比“现在”略显庄重，也符合祷告语体。
- source_word: πάντα ὅσα
  choice: 这一切……这一切
  rationale: 保留希腊文两个平行分句中重复出现的全面性表达，同时使现代汉语自然流畅。
- source_word: ἐπήγαγες
  choice: 你使……临到我们身上
  rationale: 保留神使灾祸或后果临到说话者的施事关系，不以“降罚”等词预先限定其性质。
- source_word: ἐποίησας ἡμῖν
  choice: 你向我们所做的
  rationale: 在此与“使……临到我们身上”平行，表示神对他们所行的事；“向我们”既能表达相关指向，又避免把与格过度解释为有利或不利。
- source_word: ἐν ἀληθινῇ κρίσει
  choice: 按真实的审判
  rationale: “真实”直接对应 ἀληθινῇ，“审判”对应 κρίσει；“按”自然表达行动所依循的判断或准则，又保留“公义的审判”等解释空间。
- source_word: ἐποίησας
  choice: 都是……而做的
  rationale: 呼应前面的“所做”，并总结两个平行分句；“都是”传达一切行动均属如此的全面断言。
theological_decisions:
- issue: 如何描述神使苦难临到众人的行动
  choice: 明确保留神的主动施事，并宣认这一切是按真实的审判而做的
  alternative: 译作“你公正地这样待我们”，以较概括、解释性的方式表达
  rationale: 原文明确把临到众人的事归于神，并以 ἐν ἀληθινῇ κρίσει 评价其行动。译文不淡化神的主动性，也不额外建立超出本节的报应理论。
- issue: ἀληθινῇ κρίσει 的神学语义
  choice: 真实的审判
  alternative: 公义的审判；公正的判断
  rationale: “真实”更直接对应 ἀληθινῇ，并保留该词可能涉及真实、可靠、正当等方面的张力；“公义”虽符合上下文，却更具解释性。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。保留原文两个 πάντα ὅσα 分句的平行与重复，并以“真实的审判”保存原文措辞及其神学张力。
