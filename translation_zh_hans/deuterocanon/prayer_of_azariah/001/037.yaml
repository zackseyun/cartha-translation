base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/037.yaml
  text: Bless the Lord[a], waters and all that are above the heavens; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 众水和天之上的一切[a]啊，你们要称颂主；要歌颂他，永远极力尊崇他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“天之上的一切”；“天”也可理解为“天空”或“天界”。该短语以集合方式指天之上的一切存在。
    reason: 说明οὐρανός的语义范围，并保留πάντα τὰ ἐπάνω的集合性和宇宙诗歌中的开放指涉。
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式呼召受造界颂扬主；“称颂”既保留礼仪诗歌的语气，也比单纯的“赞美”更贴近“宣告为有福、颂赞”的含义。
- source_word: ὕδατα
  choice: 众水
  rationale: 保留希腊文复数及对宇宙诸水的诗性呼告；“众水”在现代汉语中简洁而庄重。
- source_word: πάντα τὰ ἐπάνω τοῦ οὐρανοῦ
  choice: 天穹之上的万有
  rationale: 保留ἐπάνω“在……之上”的空间关系，并以“万有”表达中性复数的集合意义；“天穹”可指可见天空，也适合本段宇宙诗歌的语境。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此是神圣称号；译作“主”直接对应希腊文，不引入仅由希伯来神名所支持的特殊排印惯例。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含以诗歌或乐歌赞美之意；“歌颂”自然保留其音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 以“至高”传达复合动词的强化意义，表达极其尊崇，而非普通的高举。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 在颂赞诗的反复句中自然表达延续无尽的意义。
theological_decisions:
- issue: 次经希腊颂歌中κύριος的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 源文本直接使用希腊文κύριος，并未呈现希伯来神名；“主”忠实保留神圣称号，同时避免加入源文本不能单独确定的神名形式。
- issue: πάντα τὰ ἐπάνω τοῦ οὐρανοῦ所指的范围
  choice: 天穹之上的万有
  alternative: 诸天之上的一切；天上的万有
  rationale: 保留“在天穹之上”的宇宙空间表述，不将其限定为某一套具体的天界层级观；脚注说明“天穹”也可理解为“天”。
translation_notes:
  register: 采用现代、庄重且适合礼仪诗歌朗读的普通话。“众水……万有啊”明确呈现呼告结构；两个命令句保持原文排比。“尊他为至高”延续本诗反复句的崇高语气。
