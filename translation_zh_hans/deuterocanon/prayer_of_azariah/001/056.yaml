base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/056.yaml
  text: Bless the Lord[a], sea creatures and all that move in the waters; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 海里的巨兽[a]和水中一切活动的生物啊，要称颂主；要歌颂他，永远极力尊崇他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海里的巨兽”或可译作“巨大的海洋生物”、“鲸类”或“海怪”。希腊词κήτη泛指大型水生动物。
    reason: 保留κήτη可指大型海洋生物、鲸类或海怪的词义宽度，不将其限定为单一动物类别。
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，呼召受造物向主发出颂赞；“称颂”既保留祝颂意味，也符合现代汉语的敬拜语体。
- source_word: κήτη
  choice: 海中巨兽
  rationale: 该词广指大型海洋生物，也可指海怪或鲸类；“海中巨兽”保留其体型和类别色彩，又不限定为鲸。
- source_word: πάντα τὰ κινούμενα ἐν τοῖς ὕδασι
  choice: 水里一切游动之物
  rationale: 概括水域中所有活动的生物；“游动”在汉语中比直译“移动”更符合水生生物的语境。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此是对上帝的标准称号；希腊文本本身并未直接呈现希伯来四字神名。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含有以诗歌或歌唱赞美的意味，“歌颂”简洁地保留这一音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该词带强化的高举含义；此译自然表达持续尊崇并高举他的至高地位。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是反复出现的礼仪性短语，在此自然表示无穷无尽、直到永远。
theological_decisions:
- issue: 次经赞歌中κύριος的译法
  choice: 主
  alternative: 耶和华
  rationale: 原文为κύριος而非直接出现的希伯来四字神名，因此译作“主”，不反向补入特定神名。
translation_notes:
  register: 采用现代、庄重而可朗读的赞歌体。两个分句保留原文平行命令结构；“啊”明确呼语，“永远”置于末尾以维持反复吟唱的节奏。
