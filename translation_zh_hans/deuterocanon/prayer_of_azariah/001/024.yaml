  text: And the flame spread above the furnace to forty-nine cubits,[a]
translation:
  language: zh_hans
  text: 火焰在炉子上方延伸四十九肘[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肘”是古代常用的长度单位，大致相当于从手肘到指尖的距离。
    reason: cultural_note
lexical_decisions:
- source_word: διείχετο
  choice: 延伸
  rationale: 该未完成时形式描写火焰持续向外或向上伸展；“延伸”既保留空间幅度，也避免只表达单纯移动。
- source_word: ἡ φλὸξ
  choice: 火焰
  rationale: 对应希腊文明确的单数名词，保留原文鲜明具体的意象。
- source_word: ἐπάνω τῆς καμίνου
  choice: 向炉子上方
  rationale: ἐπάνω加属格表示在某物之上；结合表示延展的动词，用“向……上方”自然表达火焰伸展的方向和位置。
- source_word: ἐπὶ πήχεις τεσσαράκοντα ἐννέα
  choice: 高达四十九肘
  rationale: 此短语说明火焰延伸的高度或幅度；“高达”适合本处向上延伸的语境，并保留古代长度单位“肘”。
