base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/014.yaml
  text: For[a], Master, we have become smaller than all the nations[b], and today we are humbled in all the earth because of our sins.
translation:
  language: zh_hans
  text: 因为主宰啊，我们已经比万国都更衰微[a]；今天，我们因自己的罪，在全地[b]都处于卑微的境地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更衰微”也可译作“更卑微”或“被削弱到列国之下”。原文动词可指变小、削弱或地位降低；在此未必单指人数减少。
    reason: 保留 ἐσμικρύνθημεν 所含规模缩减、力量削弱及地位降低的语义范围。
  - marker: b
    text: “全地”也可译作“全境”或“全地的土地”。希腊文 γῆ 可指“地、土地”或“大地”；与“万国”并提时，较广的理解较为合适。
    reason: 保留 γῆ 可指土地、国境或大地的范围歧义。
lexical_decisions:
- source_word: δέσποτα
  choice: 主宰
  rationale: 此词是对绝对权威者的直接称呼，比通常译作“主”的 κύριος 语义更强；“主宰”既保留两者的区别，也适合庄重祷告语体。
- source_word: ἐσμικρύνθημεν
  choice: 我们已经……卑微
  rationale: 该动词表示变小、被削弱或地位降低；结合与“列国”的比较，此处主要指民族地位衰微卑下，而非单指人口减少。
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: 比列国都
  rationale: παρά 在含比较意义的表达之后应作“比”理解；πάντα τὰ ἔθνη 概括周围所有民族或列国。
- source_word: ταπεινοὶ
  choice: 受了屈辱
  rationale: 此形容词描述因审判而处于低下、受辱的境况；用结果性表达比“谦卑”更能避免误读为美德。
- source_word: ἐν πάσῃ τῇ γῇ
  choice: 在全地
  rationale: γῆ 可指“地、土地”或“大地、全地”；在与列国比较的广泛语境中采用“全地”，同时以脚注保留地域性理解。
- source_word: σήμερον
  choice: 今天
  rationale: 直接、自然地表达当前的时间处境。
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: 因自己的罪
  rationale: διά 加宾格表示原因；“因自己的罪”清楚保留共同认罪与责任归属。
theological_decisions:
- issue: 神圣称谓 δέσποτα 的译法
  choice: 主宰
  alternative: 主；主人
  rationale: 原文并非通常的 κύριος，而是强调所有权和绝对权威的 δεσπότης；“主宰”能保存这一词义差别，又不引入特定宗派解释。
- issue: 以色列变小与卑下的性质
  choice: 译为地位卑微并受屈辱
  alternative: 人数比列国更少；在品格上谦卑
  rationale: 上下文将这一境况归因于群体的罪，较可能指国家被削弱、地位降低和蒙受羞辱；不过动词本身也可含数量或规模缩减之意，故在脚注保留。
- issue: γῆ 的范围
  choice: 全地
  alternative: 全国；全境
  rationale: 与“列国”的比较支持较广义的“全地”，但希腊词本身容许地域性的“土地、国境”含义，因此不把另一理解排除。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“主宰啊”保留呼格直呼；用“受了屈辱”避免把受审判后的低下处境误译成主动的谦逊美德。脚注标记置于正文句末，涵盖本节两处真实词义歧义。
