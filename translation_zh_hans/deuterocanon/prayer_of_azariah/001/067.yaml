base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/067.yaml
  text: Bless the Lord[a], all you who fear the Lord, the God of gods; sing praise and give thanks, for his mercy is forever[b], even forever and ever.
translation:
  language: zh_hans
  text: 所有敬奉主[a]——万神之神——的人啊，你们要称颂他，歌颂他，感谢他；因为他的怜悯永远长存[b]，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬奉”也可译作“敬畏”、“敬拜”或“尊崇”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“因为他的慈爱永远长存”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 要称颂他
  rationale: 复数命令式，指以颂赞尊崇上帝。希腊文未明说宾语，但上下文清楚指向主；汉语补出“他”，使句意自然完整。
- source_word: πάντες οἱ σεβόμενοι τὸν κύριον
  choice: 所有敬奉主的人啊
  rationale: σέβομαι兼有尊崇、敬畏和敬拜之意。“敬奉”在现代汉语中既表达虔敬，也表达对上帝的尊奉，不把该词缩减为恐惧感或单指礼仪行为。
- source_word: τὸν θεὸν τῶν θεῶν
  choice: 万神之上帝
  rationale: 保留原文的称号和属格结构所表达的至高性；破折号表明这是对“主”的同位说明。
- source_word: ὑμνεῖτε
  choice: 歌颂他
  rationale: 保留动词以歌唱方式赞美的含义，并补出汉语中自然需要的宾语。
- source_word: ἐξομολογεῖσθε
  choice: 感谢他
  rationale: 在赞歌和颂赞语境中，该词可指公开颂谢或感恩；此处与歌颂及怜悯的宣告相连，“感谢”最符合语境。
- source_word: τὸ ἔλεος αὐτοῦ
  choice: 他的怜悯
  rationale: ἔλεος直接表示怜悯、慈悲；采用“怜悯”保持希腊词义的透明度。
- source_word: εἰς τὸν αἰῶνα … εἰς τὸν αἰῶνα τῶν αἰώνων
  choice: 永远长存……直到永永远远
  rationale: 前半句用自然的汉语表达持续不息，后半句保留原文层递加强的永恒措辞。
theological_decisions:
- issue: σέβομαι在敬拜语境中的译法
  choice: 敬奉主
  alternative: 敬畏主；敬拜主；尊崇主
  rationale: 原词不是通常译作“惧怕”的φοβέω，却涵盖对上帝的虔敬与尊奉。“敬奉”可保留敬畏和敬拜之间的语义张力。
- issue: ἔλεος的译法
  choice: 怜悯
  alternative: 慈爱；信实的慈爱
  rationale: 从现存希腊文本出发，“怜悯”最直接；“慈爱”也是赞歌语境中的可行表达，故列入脚注而不在正文中取代希腊词的基本含义。
- issue: εὐλογεῖτε省略宾语
  choice: 按上下文补出“他”
  alternative: 不补宾语，译作“你们要称颂”
  rationale: 希腊文命令式本身没有明说宾语，而“主”是σεβόμενοι的宾语；不过赞歌语境显然以主为称颂对象。汉语若完全省略宾语较显突兀，因此补出代词，但不把“主”误作εὐλογεῖτε在句法上明写的宾语。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“万神之上帝”保留经文称号的古典力度；“直到永永远远”保留赞歌结尾的层递节奏。正文中的脚注标记与脚注逐一对应。
