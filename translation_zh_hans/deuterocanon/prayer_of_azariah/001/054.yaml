  yaml_path: translation/deuterocanon/prayer_of_azariah/001/054.yaml
  text: Bless the Lord, rains and springs; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 雨水和泉源啊，要称颂主；要歌颂他，极力尊崇他，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，呼吁受造之物以颂赞尊崇主；“称颂”既保留礼仪性反复，也比直译“祝福”更符合现代汉语中受造物对上帝的颂赞语境。
- source_word: ὄμβροι
  choice: 雨水
  rationale: 该复数名词指从天而降的雨或阵雨；汉语通常不以复数形态表达，译作“雨水”自然且适合受造界的列举。
- source_word: πηγαί
  choice: 泉源
  rationale: 指天然涌出的水源；“泉源”兼具准确性与庄重诗歌色彩。
- source_word: τὸν κύριον
  choice: 主
  rationale: 作为命令式动词的宾语，指以色列的上帝；依希腊文本译作“主”，不另行引入希伯来文本中的专名排印惯例。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含唱诗赞美之意；“歌颂”简洁自然，并保留音乐性和颂赞色彩。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该强化动词表示极力高举、尊为极高；“尊他为至高”在现代汉语中自然庄重，并保留强烈的尊崇含义。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表达持续无尽的惯用语；“永远”最清楚、自然，也符合赞歌体裁。
theological_decisions:
- issue: 次经赞歌中 κύριος 的译法
  choice: 主
  alternative: 上主
  rationale: “主”直接对应希腊语 κύριος，保持赞歌反复句的简洁庄重，也不导入特定宗派习惯或希伯来神名的排印约定。
- issue: ὑπερυψοῦτε 的尊崇对象与程度
  choice: 尊他为至高
  alternative: 极力高举他
  rationale: 原文既有“高举”的动作意象，也有强化程度；所选译法突出至高尊位而不把句子解释为赋予上帝原本没有的地位。
translation_notes:
  register: 采用现代、庄重而可朗诵的赞歌语体。保留两个并列命令“称颂／歌颂”，并以“永远尊他为至高”呈现反复句的高昂节奏；汉语不机械复制希腊语名词复数。
