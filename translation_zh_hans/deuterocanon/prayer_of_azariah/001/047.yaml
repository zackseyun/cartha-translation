  yaml_path: translation/deuterocanon/prayer_of_azariah/001/047.yaml
  text: Bless the Lord[a], frost and snow[b]; sing hymns and highly exalt him forever.
translation:
  language: zh_hans
  text: 寒霜[a]和白雪啊，要称颂主；要歌颂他，极其尊崇他，直到永远。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寒霜”也可译作“白霜”。
    reason: lexical_alternative
  - marker: b
    text: “直到永远”直译为“直到诸世代”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这是复数命令式，呼唤受造之物颂扬主；“称颂”既保留礼仪性，也符合现代中文表达。
- source_word: πάχναι
  choice: 寒霜
  rationale: 指霜或白霜；“寒霜”自然清楚，并与“白雪”构成协调的诗歌并列。
- source_word: χιόνες
  choice: 白雪
  rationale: 希腊文为复数，但中文通常以集合名词表达；“白雪”自然且具有诗歌色彩。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此为称号，译作“主”简洁自然，不额外引入专名排印。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词带有以诗歌赞美之意；“歌颂”兼顾音乐意味和自然中文。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该强化动词表示极其高举、尊崇；“尊他为至高”保留强烈程度，同时避免生硬直译。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永永远远
  rationale: 字面为“直到众世代／诸世”；在反复出现的礼仪句式中，“永永远远”自然表达持续无尽之意。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 原文只有κύριος；译作“主”忠实保留希腊文本的称号，不进一步断定或显明其背后的神名。
- issue: ὑπερυψοῦτε的表达
  choice: 尊他为至高
  alternative: 极其高举他
  rationale: “尊他为至高”表达对上帝至高地位的颂扬；仍保留命令句的崇拜语气，而不把它解释成上帝地位发生改变。
translation_notes:
  register: 采用现代、庄重而适合公共诵读的诗歌语言；以“啊”标明对受造之物的呼唤，并保留原文连续命令式及两组平行结构。所有脚注标记均置于所解释词语或短语之后。
