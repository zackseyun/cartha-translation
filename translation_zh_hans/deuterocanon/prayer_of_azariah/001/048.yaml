  text: Bless the Lord, nights and days; sing praise and highly exalt him forever.
translation:
  language: zh_hans
  text: 黑夜和白昼啊，要称颂主；要歌颂并极力尊崇他，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这里是复数命令式，呼吁受造界称颂主。“称颂”既保留礼仪和圣经语体，也与后面的“歌颂”有所区别。
- source_word: νύκτες καὶ ἡμέραι
  choice: 黑夜和白昼啊
  rationale: 保留希腊文复数呼格所体现的直接呼唤和拟人化；汉语中以“啊”自然标示呼语。
- source_word: τὸν κύριον
  choice: 主
  rationale: 按希腊文 κύριος 直译为“主”，不擅自采用仅用于明确对应希伯来神名的特殊形式。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含以诗歌赞美之意；“歌颂”在现代汉语中简洁自然，并保留音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 复合动词带有加强语气，表示极力高举；“尊他为至高”比生硬的“极其高举他”更符合现代汉语，同时保留强烈程度。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这一礼仪副歌中的惯用语表达无尽的持续，译作“永远”自然准确。
theological_decisions:
- issue: 礼仪颂赞中 κύριος 的译法
  choice: 主
  alternative: 耶和华
  rationale: 原文是希腊语 κύριος，本节自身没有足够依据要求将其还原为希伯来神名；译作“主”既忠于现有文本，也避免加入源文未明示的信息。
translation_notes:
  register: 采用现代、庄重而可朗诵的诗歌体。“黑夜和白昼啊”保留受造界被直接呼唤的拟人手法；两个并列命令用分号分开，以呈现原文的礼仪节奏。
