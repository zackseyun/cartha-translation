base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/060.yaml
  text: Bless the Lord[a], Israel; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 以色列啊，要称颂[a]主；要歌颂他，极力尊崇他，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“赞美”。在这里，希腊文 εὐλογεῖτε 也可指在敬拜中赞美主。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这是复数命令式；在敬拜语境中，“称颂”既保留向上帝献上祝颂的圣经表达，也符合现代汉语宗教语体。
- source_word: Ἰσραήλ
  choice: 以色列啊
  rationale: 此处是直接呼语，指向以色列群体；“啊”自然地标明呼告语气，同时保持诗歌的庄重感。
- source_word: τὸν κύριον
  choice: 主
  rationale: 希腊文直接使用 κύριος；译为“主”既贴近原文，也不额外引入原文未明示的专名形式。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: ὑμνέω含有以诗歌或颂歌赞美之意；“歌颂”简洁地保留其音乐和礼仪色彩。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该复合动词带有强烈的高举意味；“尊他为至高”在现代汉语中自然，并保留其强化语气。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 在赞美诗的反复句式中，这一表达指持续无尽；“直到永远”庄重、清楚且符合汉语习惯。
theological_decisions:
- issue: 敬拜语境中 εὐλογεῖτε 的译法
  choice: 称颂
  alternative: 赞美
  rationale: “称颂”保留了向上帝“祝颂”的传统语义张力，而“赞美”也是此语境下成立的译法，因此以脚注注明。
- issue: 指称上帝的 κύριος
  choice: 主
  alternative: 上主
  rationale: 原文为 κύριος，并未直接呈现四字神名；采用通常对应词“主”，避免加入希腊文本本身未明确标示的区别。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌敬拜语体。以“以色列啊”明确呼语，以三个并列祈使表达保留原文的召唤和反复节奏。
