  yaml_path: translation/deuterocanon/prayer_of_azariah/001/032.yaml
  text: Blessed are you on the throne of your kingdom[a], and greatly praised and highly exalted forever.
translation:
  language: zh_hans
  text: 你在你国度的宝座上，当受称颂；你极受颂赞、极被高举，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος
  choice: 当受称颂
  rationale: 这是颂赞礼仪中的谓语形容词。译作“当受称颂”能自然表达希腊语的颂赞力量，又不把它误解为神从别处领受福分。
- source_word: ἐπὶ θρόνου
  choice: 坐在……宝座上
  rationale: ἐπί加属格在此表达位置。“坐在……宝座上”符合现代汉语习惯；所补出的“坐”只是使位置关系自然，并未采用含义更强的“登基”。
- source_word: τῆς βασιλείας σου
  choice: 你国度的
  rationale: βασιλεία可指国度、王权或统治。“国度”与“宝座”搭配自然，同时保留王权意涵；其他可能义以脚注说明。
- source_word: ὑπερυμνητός
  choice: 配受至高的赞美
  rationale: 该复合词表示极高程度的颂赞。“配受至高的赞美”既传达强化语气，也保持直接对神颂赞的礼仪语域。
- source_word: ὑπερυψωμένος
  choice: 至高无上
  rationale: 该词表示被高举到极高地位。汉语“至高无上”简洁、庄重，适合颂赞文体，并避免与前面的“至高的赞美”机械重复。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表达恒久不止的惯用语，现代汉语以“永远”最为清楚自然。
theological_decisions:
- issue: 直接颂赞与宝座意象
  choice: “你坐在你国度的宝座上，当受称颂”
  alternative: “在你王权的宝座上，你当受称颂”
  rationale: 保留对神的第二人称直接称颂和具体的宝座意象，不扩写为“登基”或加入原文没有明说的神学解释。
- issue: ὑπερυψωμένος的语态形式与颂赞意义
  choice: 译作状态性的“至高无上”
  alternative: 译作“被高举到至高之处”
  rationale: 希腊语形式可直译为“被高举”，但在颂赞语境中主要表达崇高状态。选择自然汉语，同时不明确指定高举者，以免加入原文未说明的施事者。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞体。分号呈现原文两个并列颂赞成分；保留“宝座—国度”的王权意象，并用脚注保存 βασιλεία 的词义幅度。
