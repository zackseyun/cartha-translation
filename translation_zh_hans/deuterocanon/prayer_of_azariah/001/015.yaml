base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/015.yaml
  text: And at this time there is no ruler or prophet or leader, no whole burnt offering or sacrifice or offering or incense, and no place to bring firstfruits before you and to find mercy.
translation:
  language: zh_hans
  text: 如今没有统治者，没有先知，也没有首领；没有全燔祭，没有祭物，没有供物，也没有香；也没有可在你面前献上初熟之物[a]、寻得怜悯的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“献上果实”，或“把出产呈献在你面前”。这里的希腊文表达并不常见；正文译作“献上初熟之物”，是依据上下文中的祭祀用语。
    reason: 保留罕见希腊表达 τοῦ καρπῶσαι 的词义不确定性，并说明正文采用礼仪性译法的语境依据。
lexical_decisions:
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: 如今
  rationale: 自然表达当前处境，保留哀叹的即时性。
- source_word: ἄρχων
  choice: 统治者
  rationale: 指掌握治理权柄的人；用“统治者”保留宽泛的政治和公共权力含义，避免过度限定为君王。
- source_word: προφήτης
  choice: 先知
  rationale: 现代汉语圣经语境中的标准对应词。
- source_word: ἡγούμενος
  choice: 首领
  rationale: 与前面的“统治者”有所区分，同时不把其职分过度具体化为总督或官长。
- source_word: ὁλοκαύτωσις
  choice: 全燔祭
  rationale: 明确表达祭物全部焚烧的特点，并与较宽泛的 θυσία 区分。
- source_word: θυσία
  choice: 祭牲
  rationale: 在这组祭祀术语中指献作祭物的牲祭；译作“祭牲”可与“全燔祭”和“供物”保持区别。
- source_word: προσφορά
  choice: 供物
  rationale: 表示呈献的礼物或供献物；“供物”简洁庄重，也避免与其他祭祀词重复。
- source_word: θυμίαμα
  choice: 香
  rationale: 在礼仪语境中自然指焚献的香；中文无需补出“香祭”也能清楚表达。
- source_word: τόπος
  choice: 地方
  rationale: 直接表达进行敬拜献祭行为的场所，不额外指定圣殿。
- source_word: τοῦ καρπῶσαι
  choice: 献上初熟之物
  rationale: 该表达罕见，词根与果实或出产相关；周围的祭祀词汇支持将其理解为献上农产，译文采用符合礼仪语境的“初熟之物”，并以脚注保留其他可能。
- source_word: ἐνώπιόν σου
  choice: 在你面前
  rationale: 保留原文关系性及礼仪性的空间表达。
- source_word: εὑρεῖν ἔλεος
  choice: 寻得怜悯
  rationale: 贴近希腊文“找到怜悯”的意象，同时在庄重的现代汉语中可以理解。
theological_decisions:
- issue: 流亡或失去圣殿背景中的礼仪术语序列
  choice: 逐项译出权柄与敬拜形式的缺失，不将祭祀术语压缩成概括语。
  alternative: 将相关词合并为“没有祭祀和供物”等概括表达。
  rationale: 逐项保留原文加强语势的列举，呈现政治、宗教领导和圣殿礼仪全面缺失的哀痛，不削弱经文张力。
- issue: τοῦ καρπῶσαι 的含义
  choice: 正文译为“献上初熟之物”，脚注列出“献上果实”和“呈献出产”等可能。
  alternative: 笼统译为“献祭”或直译为“献上果实”。
  rationale: 祭祀语境使农产或初熟供物的含义较为可能，但希腊表达本身罕见，因此不把这一语境判断绝对化，以脚注保存词义的不确定性。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。以分号划分权柄、祭祀和场所三组缺失项目，保留原文累积式哀叹的节奏；各祭祀术语尽量分别对应，不作宗派化解释。
