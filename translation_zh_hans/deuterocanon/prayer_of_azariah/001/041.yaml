base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/041.yaml
  text: Bless the Lord[a], all rain and dew; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 一切雨和露水啊，要称颂主[a]；要歌颂他，极力尊崇他，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一切雨和露水”也可按分配意义理解为“每一场雨和每一层露水”。希腊文πᾶς ὄμβρος καὶ δρόσος可作集合性或分配性理解。
    reason: 保留πᾶς在此可理解为“所有”或“每一”的词汇歧义，同时避免把δρόσος具体化为“每一滴露水”。
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这是复数命令式，呼召受造之物赞美、称颂主；“称颂”既保留“说美言、祝颂”的含义，也符合现代汉语的敬拜语境。
- source_word: πᾶς ὄμβρος καὶ δρόσος
  choice: 一切雨水和露水
  rationale: πᾶς 在此可作集合性或分配性理解；“一切”自然地保留整体范围，ὄμβρος 和 δρόσος 分别译为“雨水”和“露水”。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος 在此是命令式动词的宾语；译作“主”简洁自然，不额外引入原文未明示的专名形式。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词带有以诗歌赞美的意味；“歌颂”比单纯“赞美”更能传达这一音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 复合动词强化“高举”的意思；“尊他为至高”在现代汉语中庄重自然，并保留高度强化的语义。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表示无尽延续的惯用语，“永远”是清楚、自然的现代汉语表达。
theological_decisions:
- issue: κύριος 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 希腊文仅作 κύριος；“主”直接对应原文，并避免把神名或特定传统用语补入正文。
- issue: 受造物“称颂”主的拟人表达
  choice: 保留直接呼告和命令语气
  alternative: 意译为“愿一切雨水和露水都赞美主”
  rationale: 原文以复数命令式直接呼召雨与露；保留这种拟人化的礼仪诗歌形式，不将其弱化为愿望句。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪诗歌语体。“啊”明确直接呼告；两个“要”保留并列命令的节奏，“永远尊他为至高”对应强化动词与时间短语。
