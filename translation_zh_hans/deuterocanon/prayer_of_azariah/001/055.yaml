  yaml_path: translation/deuterocanon/prayer_of_azariah/001/055.yaml
  text: Bless the Lord, seas and rivers; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 大海和江河啊，你们要称颂主；要歌颂并极力高举他，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，呼召受造界赞美主；“称颂”既保留礼仪语气，也比对受造物使用“祝福主”更符合现代汉语习惯。
- source_word: θάλασσαι
  choice: 大海
  rationale: 保留复数所表达的各处海域这一诗意意象；汉语用集合性“大海”更自然，不影响拟人化呼召。
- source_word: ποταμοί
  choice: 江河
  rationale: 准确表达各类河流，并与“大海”构成自然、庄重的诗歌并列。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此是对上帝的称号；译作“主”直接、庄重，并忠于希腊文本。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含有以诗歌或颂歌赞美之意；“歌颂”自然保留其音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 复合动词含强烈的高举、极力尊崇之意；“尊他为至高”在现代汉语中自然，并保留强化意味。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是反复出现的礼仪性短语；“永远”简明自然地表达跨越万世、持续不止的含义。
theological_decisions:
- issue: κύριος作为神圣称号的译法
  choice: 主
  alternative: 上主；耶和华；主人
  rationale: 原文为κύριον，并未在此直接出现四字神名；“主”最贴近现存希腊文本，也不额外引入特定传统的称谓。
- issue: ὑπερυψοῦτε的受词及神学表达
  choice: 尊他为至高
  alternative: 极力高举他；使他升为至高
  rationale: 这里是受造界对上帝的尊崇，并非使上帝取得原本没有的地位；“尊他为至高”既保留命令的强度，也避免暗示受造物实际改变上帝的地位。
translation_notes:
  register: 采用现代、庄重而可诵读的赞歌体。以“啊”标明对大海和江河的直接呼告；两个分句保持原文并列命令的节奏。无脚注标记。
