base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/049.yaml
  text: Bless the Lord[a], light and darkness; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 光明和黑暗啊，你们要称颂主；要歌颂他，极力尊崇他，直到永远[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到万世”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，呼唤受造界中的光明和黑暗称颂主。“称颂”既保留祝颂、赞美的礼仪色彩，也比“祝福”更符合现代汉语中受造物对主的颂赞语境。
- source_word: φῶς καὶ σκότος
  choice: 光明和黑暗
  rationale: 按原文保留成对的宇宙性对立概念；单数名词在汉语中可自然表达为总体性的“光明”和“黑暗”。
- source_word: τὸν κύριον
  choice: 主
  rationale: 作为命令式动词的宾语，直接译为“主”，符合现代汉语基督教及礼仪文本的庄重表达。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含唱诗、以诗歌赞美之意；“歌颂”兼顾音乐礼仪意味与现代汉语的自然度。
- source_word: ὑπερυψοῦτε
  choice: 极力尊崇
  rationale: 前缀强化“高举、尊崇”的程度；“极力尊崇”保留其加强语气，又避免生硬的字面表达。
- source_word: αὐτὸν
  choice: 他
  rationale: 指回前文的“主”，按原文阳性单数代词直译。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 这是常见的颂赞公式；“直到永远”以自然、庄重的现代汉语表达持续无尽之意，脚注保留原文“诸世代”的字面形态。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主宰
  rationale: “主”直接对应κύριος，并保持礼仪传统与现代汉语的简洁庄重，不额外引入解释性称号。
- issue: εἰς τοὺς αἰῶνας的时间含义
  choice: 直到永远
  alternative: 直到万世
  rationale: 正文采用现代汉语中清楚自然的永恒表达，同时以脚注呈现希腊语复数“世代”的较直译形式，不削弱其颂赞性和持续性。
translation_notes:
  register: 采用现代、庄重而可诵唱的礼仪诗歌语体。以“啊，你们要……”明确原文对光明和黑暗的直接呼告，并维持两个复数命令式所形成的平行节奏。
