  yaml_path: translation/deuterocanon/prayer_of_azariah/001/001.yaml
  text: Thus Hananiah and Azariah and Mishael prayed[b][a], and they sang praise to the Lord when the king ordered them to be thrown into the furnace.
translation:
  language: zh_hans
  text: 于是，哈拿尼雅、亚撒利雅和米沙利[a]便如此祷告；王下令把他们扔进火炉[b]时，他们向主歌唱赞美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里使用的是三人的希伯来名字哈拿尼雅、亚撒利雅和米沙利，不是他们的巴比伦名字沙得拉、米煞和亚伯尼歌。
    reason: cross_reference
  - marker: b
    text: “扔进火炉”也可译作“投入火炉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως οὖν
  choice: 于是……这样
  rationale: οὕτως表示方式“这样”，οὖν承接上文；“于是……这样”在现代汉语中兼顾连接和方式含义。
- source_word: προσηύξατο
  choice: 祷告
  rationale: 该词直接表示祷告；原文没有明确表达“高声”等附加含义。
- source_word: Ἀνανίας καὶ Ἀζαρίας καὶ Μισαήλ
  choice: 哈拿尼雅、亚撒利雅和米沙利
  rationale: 采用这三个人希伯来名字的现代汉语通行音译，不改用他们的巴比伦名字。
- source_word: ὕμνησαν
  choice: 歌唱赞美
  rationale: ὑμνέω含有以歌声颂赞的意思；此译法保留音乐性，又符合现代汉语表达。
- source_word: τῷ κυρίῳ
  choice: 向主
  rationale: 在此犹太经文的祷告与赞美语境中，κύριος指上帝，译作“主”。
- source_word: ὅτε
  choice: ……时
  rationale: ὅτε表示时间关系；译作“……时”不额外限定为命令之后。
- source_word: προσέταξεν
  choice: 下令
  rationale: προστάσσω表示命令；王权语境中“下令”自然准确。
- source_word: ἐμβληθῆναι
  choice: 把他们扔进
  rationale: 被动不定式表示他们被投入火炉；汉语用“下令把他们扔进”自然地表达其受事关系。
- source_word: εἰς τὴν κάμινον
  choice: 进火炉
  rationale: κάμινος可指炉或窑；但以但以理书的叙事背景而言，“火炉”最贴切，且不增添原句没有的“烈火熊熊”等描写。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 这里的对象是接受祷告和歌唱赞美的上帝；“主”保留经文中的神学称谓，不将其弱化为一般社会身份。
- issue: 三位青年的名字形式
  choice: 哈拿尼雅、亚撒利雅和米沙利
  alternative: 沙得拉、米煞和亚伯尼歌
  rationale: 希腊文本在此使用三人的希伯来名字，而非巴比伦宫廷名字；正文据源文保留这一点。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是……这样”兼顾原文的承接词和方式副词；分号使祷告与歌唱赞美两个并列动作清晰可读。人名依现代中文圣经常见形式音译。
