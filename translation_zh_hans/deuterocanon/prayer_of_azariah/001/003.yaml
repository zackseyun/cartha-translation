base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/003.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and glorified is your name forever[b],
translation:
  language: zh_hans
  text: 主啊，我们列祖的上帝，你是当受颂赞的；你的名当受赞美、得着荣耀，直到永远。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “直到永远”直译为“进入诸世代”，是表示恒久无尽的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: 当受颂赞的
  rationale: 这是礼仪性颂赞公式中的表语形容词；译为“当受颂赞的”既表达配受称颂，也避免与下文 αἰνετόν 简单重复。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριος 的呼格，在向上帝祷告的语境中作神圣称号；“主啊”自然体现直接呼告。
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: 我们列祖的上帝
  rationale: “列祖”保留 πατέρων 的男性复数形式及其圣经盟约语感，同时比直译“父亲们”更符合现代汉语的经文表达。
- source_word: αἰνετὸν
  choice: 当受赞美
  rationale: 该形容词表示配受赞美；汉语以“当受赞美”自然表达其应得、配得之意，不把它弱化为仅仅已经受到赞美。
- source_word: δεδοξασμένον
  choice: 得荣耀
  rationale: 这是 δοξάζω 的完成时被动分词，作形容词使用；“得荣耀”保留被动及尊荣意味，并与“当受赞美”构成庄重的并列。
- source_word: τὸ ὄνομά σου
  choice: 你的名
  rationale: 保留圣经中以“名”指上帝所启示的身份与声誉的表达，不在正文中解释扩充。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表示持续无尽的惯用语；“永远”是现代汉语中自然、准确的对应表达。
theological_decisions:
- issue: τῶν πατέρων ἡμῶν 的盟约性称谓
  choice: 我们列祖的上帝
  alternative: 我们祖先的上帝
  rationale: 原文明确使用“父辈、列祖”的阳性名词。正文采用“列祖”，既忠实于形式，又保留这一传统盟约称谓；“祖先”虽较中性、易懂，却会淡化原文措辞。
- issue: αἰνετὸν 与 δεδοξασμένον 的语法及并列关系
  choice: 你的名永远当受赞美、得荣耀
  alternative: 你的名永远是可赞美、已得荣耀的
  rationale: 希腊文是无系词的颂赞性名词句，且第二项为完成时被动形式。正文以自然汉语保留“配受赞美”和“得荣耀”两层含义，不把它们合并，也不额外指定施动者。
- issue: εἰς τοὺς αἰῶνας 的时间范围
  choice: 永远
  alternative: 直到万世
  rationale: 原文直译为“进入诸世代”，是表达恒久延续的惯用语；“永远”准确传达其通常语义，脚注保留字面形象。
translation_notes:
  register: 采用庄重而可朗读的现代标准汉语，保留祷告中的直接呼告和颂赞语气。“列祖”延续圣经盟约语汇；分号呈现原文两部分颂赞的结构。
