  text: 'Then the three[a], as with one mouth, were singing hymns and glorifying and blessing God in the furnace, saying:'
translation:
  language: zh_hans
  text: 那时，三人仿佛同出一口[a]，在火窑中唱诗颂扬上帝，归荣耀给他，并称颂他，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“同声”。希腊文直译为“如同出于一张口”，强调三人的颂赞完全一致。
    reason: 说明原文意象及其惯用含义，并提供更自然的汉语替代译法。
lexical_decisions:
- source_word: Τότε
  choice: 那时
  rationale: 自然地承接前文并引出新的场景，保留希腊文的时间推进作用。
- source_word: οἱ τρεῖς
  choice: 三人
  rationale: 原文只说“这三位／三人”，未重复说明其身份；译作“三人”既简洁，也不增添本节未明说的内容。
- source_word: ὡς ἐξ ἑνὸς στόματος
  choice: 如同出于一口
  rationale: 保留原文“一张口”的鲜明意象，同时借脚注说明其表达三人完全一致、同声颂赞的含义。
- source_word: ὕμνουν
  choice: 唱诗颂扬
  rationale: 表达以诗歌进行颂赞的动作，并在汉语中自然呈现未完成时所描写的持续行动。
- source_word: ἐδόξαζον
  choice: 归荣耀给
  rationale: 保留“使之得荣耀／归荣耀”的专门含义，不与相邻的颂赞类动词混同。
- source_word: εὐλόγουν
  choice: 称颂
  rationale: 在以上帝为宾语时，“称颂”比字面上的“祝福”更符合现代汉语习惯，同时保留与“唱诗颂扬”“归荣耀”不同的词义。
- source_word: τὸν θεὸν
  choice: 上帝
  rationale: 采用现代汉语中自然、庄重且通行的称谓；后续并列动词以“他”回指，避免汉语中机械重复。
- source_word: ἐν τῇ καμίνῳ
  choice: 在火窑中
  rationale: κάμινος在本叙事中指烈火燃烧的窑炉；“火窑”准确贴合上下文，也比泛称“炉子”更明确。
- source_word: λέγοντες
  choice: 说
  rationale: 自然引出下文的直接引语，准确表达分词在句中的衔接功能。
