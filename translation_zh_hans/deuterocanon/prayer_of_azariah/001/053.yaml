translation:
  language: zh_hans
  text: 地上生长的一切啊，要称颂主；要歌颂他，极力尊崇他，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，呼召受造物称颂主。“称颂”既保留礼仪性反复句的庄重语气，也比单纯的“赞美”更贴近“说好话、祝颂”的词义。
- source_word: πάντα τὰ φυόμενα
  choice: 生长的万物
  rationale: φυόμενα是现在时中间/被动分词，泛指正在生长、萌发之物；译文保持范围宽泛，不限缩为某一类植物。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上
  rationale: ἐπί加属格在此表达位置，即“在地上”；置于呼语开头，符合现代汉语自然语序。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος按经文礼仪语境译作“主”；汉语不需要对应希腊语冠词另加量词或指示词。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含以诗歌、颂歌赞美之意；“歌颂”保留歌唱色彩，同时自然凝练。
- source_word: ὑπερυψοῦτε
  choice: 尊……为至高
  rationale: 复合动词带强化意味，表示极力高举、尊为至高；此译法比生硬的“高度高举”更符合现代汉语。
- source_word: αὐτὸν
  choice: 他
  rationale: 指回前文的“主”，依原文保留第三人称宾语。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这一礼仪惯用语表达持续无尽；“永远”是清楚自然的现代汉语对应。
theological_decisions:
- issue: 申命记正典外诗歌礼仪句中κύριος的译法
  choice: 主
  alternative: 上主
  rationale: 原文写作τὸν κύριον，并未直接出现四字神名；译作“主”既忠实于希腊文，也避免加入特定宗派惯用称谓。
- issue: ὑπερυψοῦτε的强化含义
  choice: 尊他为至高
  alternative: 极力高举他
  rationale: “尊他为至高”保存强化和崇高含义，并保持汉语颂歌体的自然庄重；不将其解释成额外的教义命题。
translation_notes:
  register: 采用现代、庄重而易懂的颂歌体。保留两个并列复数命令式，并以“啊”明确受呼告对象；不设脚注，因为本节不存在影响正文理解的重大文本或语义歧义。
