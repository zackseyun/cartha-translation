base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/063.yaml
  text: Bless the Lord[a], spirits and souls of the righteous[b]; sing hymns and highly exalt him forever.
translation:
  language: zh_hans
  text: 义人的灵与魂啊，你们要称颂主[a]；要歌颂他，并极力尊崇他，直到永远[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “称颂”或译“赞美”。
    reason: lexical_alternative
  - marker: b
    text: 希腊文直译“直到万世”；这是表示恒久、直到永远的常见颂赞用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 该词是复数命令式；“称颂”既保留礼仪性的祝颂、赞颂意味，也比“祝福”更自然地表达受造者对主的颂赞。
- source_word: πνεύματα καὶ ψυχαὶ
  choice: 灵与魂
  rationale: 分别译出两个并列名词，不将其合并或解释为特定的人论体系。
- source_word: δικαίων
  choice: 义人的
  rationale: 属格同时修饰“灵”与“魂”；“义人”简洁、自然，并保留其道德与宗教含义。
- source_word: τὸν κύριον
  choice: 主
  rationale: 符合犹太希腊语礼仪语境中 κύριος 的通常译法。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 既表达以诗歌颂赞的含义，又符合现代汉语的庄重礼仪语体。
- source_word: ὑπερυψοῦτε
  choice: 极其尊崇
  rationale: 保留复合动词所含的加强语气，表达高度尊荣、颂扬。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 这是常见的颂赞公式；此译法自然表达绵延无尽的时间意义。
theological_decisions:
- issue: “灵”与“魂”的人论并列
  choice: 保留“义人的灵与魂”两个不同用语
  alternative: 合译为“义人的灵魂”或意译为“义人”
  rationale: 希腊文明确并列 πνεύματα 与 ψυχαί。译文保留这种张力，但不据此建构或暗示某种特定的人性构成论。
translation_notes:
  register: 采用现代、庄重而可诵读的汉语；以“啊”明确呼语，以两个复数命令的连续结构保留原文礼仪性排比。
