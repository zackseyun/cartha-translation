  text: Bless the Lord[a], fire and heat; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 火和炎热啊，要称颂主；要歌颂他，永远高举他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 复数命令式，呼吁受造之物颂扬主；“称颂”既保留礼仪性反复句式，也比“祝福”更自然地表达受造物对上主的赞美。
- source_word: πῦρ
  choice: 火
  rationale: 直接指火，与后面的“热气”并列。
- source_word: καῦμα
  choice: 热气
  rationale: 指炽热或灼热；译作“热气”可与“火”区别，并保持现代汉语的自然表达。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此为神圣称号；译作“主”忠于希腊文本，又不额外引入原文未明示的希伯来神名。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含以诗歌或吟唱赞美之意，“歌颂”简洁保留这一音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 表达极力高举、尊崇；此译保留前缀所加强的程度，同时符合现代汉语敬拜语体。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表达持续到无穷世代的惯用语，“永远”自然简明。
theological_decisions:
- issue: 次经礼仪反复句中κύριος的译法
  choice: 主
  alternative: 上主；主宰
  rationale: “主”直接对应希腊文的神圣称号并符合现代汉语基督教通用表达；不使用“耶和华”等译法，以免把希腊文本未明确写出的希伯来神名带入译文。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体。保留两个并列命令和本歌反复出现的礼仪节奏；不增添主语解释，也不把受造物的拟人化呼召改写为陈述句。
