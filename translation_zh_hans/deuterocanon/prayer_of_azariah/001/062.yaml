base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/062.yaml
  text: Bless the Lord[a], servants[b]; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 仆人们[a]，要称颂主；要歌颂他，永永远远[b]极力尊崇他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奴仆们”或“奴隶们”。希腊语 δοῦλοι 既可泛指服事者，也可指处于奴属身份的人。
    reason: lexical_alternative
  - marker: b
    text: 直译“直到万世”；意为“直到永远”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这是复数命令式；在向敬拜者发出的礼仪性呼召中，“称颂”既保留向上帝说赞美之言的含义，也符合现代汉语宗教诗歌的庄重语体。
- source_word: δοῦλοι
  choice: 仆人们
  rationale: δοῦλοι 可指仆人、奴仆或处于奴属身份的人。此处是赞歌中的称呼，重点在服事和归属于主；“仆人们”自然得体，同时以脚注保留较强的奴属含义。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριον 在此为上帝的称号；译作“主”可保留其敬拜语境中的传统意义。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: ὑμνέω 含有唱诗赞美的意味；“歌颂”比单纯的“赞美”更能体现这一音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该复合动词带有加强语气，意为极其高举、尊崇；“尊他为至高”自然地表达其强化意味和崇高语调。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永永远远
  rationale: 这是表示持续到万世的惯用语；“永永远远”在现代汉语中清楚、庄重，也适合赞歌的节奏。
theological_decisions:
- issue: 赞歌中 δοῦλοι 对敬拜者身份的称呼
  choice: 仆人们
  alternative: 奴仆们／奴隶们
  rationale: 原词可包含受奴役或完全隶属的较强含义，但本节作为礼仪性呼召，未具体描述法律上的奴隶身份。“仆人们”避免把语境过度限定，同时脚注保留原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的赞歌语体。两个并列命令“称颂”“歌颂”保留原文的递进和音乐性；末句用“永永远远尊他为至高”维持全段反复句式的节奏。
