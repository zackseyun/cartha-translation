  yaml_path: translation/deuterocanon/prayer_of_azariah/001/010.yaml
  text: And now we cannot open our mouth[a]; shame and reproach have come upon your servants and those who revere you.
translation:
  language: zh_hans
  text: 如今，我们连口都不能开；羞耻和凌辱临到了你的奴仆[a]和敬畏你的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希腊语原词指“奴仆”，强调归属和从属。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι τὸ στόμα
  choice: 开口
  rationale: 保留“张开口”的希腊语意象，同时按现代汉语习惯表达无力或无颜说话；译作“说话”虽通顺，却会削弱原文意象。
- source_word: αἰσχύνη
  choice: 羞耻
  rationale: 直接表达因处境而蒙羞的状态，并与后面的“凌辱”形成自然搭配。
- source_word: ὄνειδος
  choice: 凌辱
  rationale: 体现公开受辱、遭人责难或讥诮的含义，比笼统的“耻辱”更能与 αἰσχύνη 区分。
- source_word: ἐγενήθη
  choice: 临到了
  rationale: 原义为“成了、发生了”；与“羞耻和凌辱”搭配时，“临到了”自然表达结果落在相关人身上，又不把希腊语的结果状态解释得过细。
- source_word: δούλων σου
  choice: 你的奴仆
  rationale: “奴仆”兼具从属、归属和服事之意，比单纯“仆人”更明显地保留 δοῦλος 的身份色彩，也比现代制度语境中的“奴隶”更适合祷告体的庄重语域。
- source_word: τῶν σεβομένων σε
  choice: 敬奉你的人
  rationale: σεβομένων 表示虔敬、尊崇和敬拜性的委身；“敬奉”兼顾内在敬意与实际事奉，避免把含义仅限于情绪性的“敬畏”或礼仪性的“敬拜”。
theological_decisions:
- issue: 向上帝祷告时如何译 δοῦλος
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 原文强调属于上帝并处于其权下的身份。“奴仆”保留这种从属与归属关系，同时符合现代汉语宗教祷告的庄重表达；脚注保留较温和的传统译法，并说明原词力度。
translation_notes:
  register: 采用现代、庄重而可朗读的祷告语言。“连口也不能开”自然传达因蒙羞而无言的语境；分号保留原文前后两部分的紧密因果关联，但不明说原文未明示的逻辑连接。
