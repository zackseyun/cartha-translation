  text: for we have sinned in all things[a], and we have acted lawlessly by turning away from you, and we have sinned greatly in all things.
translation:
  language: zh_hans
  text: 因为我们在一切事上都犯了罪；又背离你，行事不法；我们在一切事上都大大犯罪了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们在一切事上都罪孽深重。”原文末句的动词比前面的“犯了罪”语气更强。
    reason: 词义备选；说明原文两个相关动词之间的强度差异。
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: 犯了罪
  rationale: 用自然、庄重的认罪用语表达不定过去时，不额外限定时间层面的细微差别。
- source_word: ἐν πᾶσι
  choice: 在一切事上都
  rationale: 保留短语广泛而全面的范围，同时不武断限定为“在每一种方式上”。
- source_word: ἠνομήσαμεν
  choice: 行了不法
  rationale: 保留ἀνομέω所含违背律法、法度的意义，避免淡化为泛指的“做错了事”。
- source_word: ἀποστῆναι ἀπὸ σοῦ
  choice: 因背离你
  rationale: 将不定式理解为说明行不法的具体表现或方式；“背离”兼顾关系破裂和离弃的含义，不仅是空间上的离开。
- source_word: ἐξημάρτομεν
  choice: 犯了重罪
  rationale: 以“重罪”体现该复合动词相对于前文ἡμάρτομεν的加强语气，并保持现代汉语的自然表达。
theological_decisions:
- issue: 是否区分ἡμάρτομεν与语气更强的ἐξημάρτομεν
  choice: 分别译为“犯了罪”和“犯了重罪”
  alternative: 两处都译为“犯了罪”，或将后者译为“罪孽深重”
  rationale: 原文使用两个相关但不同的动词，后者具有加强意味；保留区别可呈现认罪语气的递进，又不加入特定教义解释。
- issue: ἀποστῆναι ἀπὸ σοῦ与ἠνομήσαμεν的句法关系
  choice: 译作“又因背离你而行了不法”
  alternative: 译作“又行了不法，离弃了你”
  rationale: 不定式较自然地说明行不法的表现或方式；用“因……而……”保留这一联系，同时不将其拆成两个彼此独立的罪项。
translation_notes:
  register: 采用现代、庄重而易懂的认罪语体。“一切事上”保留原文两次ἐν πᾶσι的重复；分号呈现三个认罪分句的递进。
