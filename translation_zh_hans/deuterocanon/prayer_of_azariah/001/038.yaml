base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/038.yaml
  text: Let every power bless the Lord[a]; sing praise and highly exalt him forever.
translation:
  language: zh_hans
  text: 愿一切权能称颂主[a]；你们要歌颂他，极力高举他，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿所有权能都称颂主。”希腊文用单数“权能”，既可按分配意义理解，也可按集合意义理解。
    reason: 保留 πᾶσα ἡ δύναμις 在单数形式下可能具有的分配性或集合性歧义。
lexical_decisions:
- source_word: εὐλογείτω
  choice: 愿……称颂
  rationale: 第三人称命令式在此表达礼仪性的劝勉；“愿……称颂”既保留祈愿兼命令的语气，也符合现代汉语颂歌体。
- source_word: πᾶσα ἡ δύναμις
  choice: 一切能力
  rationale: 希腊文以单数名词搭配 πᾶσα，可作集合性或分配性理解。“一切能力”保留其宽泛范围，并不擅自限定为天军、权势或力量的具体类别。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος 在这里是称号；汉语中作“称颂”的宾语时译作“主”自然庄重，无须补出定冠词。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词含以诗歌或歌声赞美之意；“歌颂”简洁自然，并保留音乐性的内涵。
- source_word: ὑπερυψοῦτε
  choice: 尊……为至高
  rationale: 复合动词带有强烈提升、极其高举之意；“尊他为至高”在现代汉语中自然，并保留加强语气。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表达无尽久远的惯用语；“永远”是现代汉语中清楚、自然的对应表达。
theological_decisions:
- issue: κύριος 的译法
  choice: 主
  alternative: 主宰
  rationale: 采用通行而不带额外教派色彩的称号“主”，不加入原文没有的解释性含义。
- issue: πᾶσα ἡ δύναμις 的范围
  choice: 一切能力
  alternative: 所有权能／一切天军
  rationale: 原文的 δύναμις 含义宽泛，且为单数集合或分配表达；译文不将其专门解释为天使权势或军旅群体，以保留原有歧义。
- issue: ὑπερυψοῦτε 的强意程度
  choice: 尊他为至高
  alternative: 极力高举他
  rationale: 所选译法传达强化的高举含义，同时避免让人误以为受造者能使主在本体上变得更高；这里表达的是颂赞与尊崇。
translation_notes:
  register: 采用现代、庄重、适合礼仪颂歌的普通话表达。分号对应两个连续的劝颂句；“你们”明示第二个动词的复数命令对象，而首句保留第三人称劝勉结构。
