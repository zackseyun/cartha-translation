base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/042.yaml
  text: Bless the Lord[a], all spirits; sing praise and highly exalt him forever.
translation:
  language: zh_hans
  text: 一切的灵[a]啊，要称颂主；要歌颂他，并永永远远极力尊崇他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切的风”；πνεύματα既可指“灵”，也可指流动的空气，即“风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这是复数命令式；在颂赞上帝的礼仪语境中，“称颂”既保留“祝颂”的含义，也符合现代汉语赞美诗体的自然表达。
- source_word: πάντα τὰ πνεύματα
  choice: 一切的灵
  rationale: 该短语在句中作呼语。“灵”是 πνεύματα 最直接的对应，并保留它可能指属灵存在或力量的开放性；其“风”的词义则收入脚注。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος 在这里是对上帝的尊称；“主”符合七十士译本的神圣称号用法，也简洁庄重。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 该动词带有以诗歌或赞美诗赞颂的意味；“歌颂”在现代汉语中自然地保留了音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该复合动词含强烈的高举、尊崇意味。“尊他为至高”保留了强化成分，又避免生硬直译。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永永远远
  rationale: 这是表达持续到万世的惯用语；“永永远远”适合赞歌的反复句式，并清楚表达永久性。
theological_decisions:
- issue: 颂歌中 κύριος 作为上帝称号的译法
  choice: 主
  alternative: 主人
  rationale: 此处是对上帝的礼仪性尊称，“主”最符合犹太希腊语经文的用法；“主人”会使语域偏向一般的人际主从关系。
- issue: πνεύματα 所指的是灵还是风
  choice: 正文译“一切的灵”，脚注保留“一切的风”
  alternative: 正文译“一切的风”
  rationale: πνεῦμα 本身兼有“灵、风、气息”等义，语法不能完全排除“风”。正文采用最直接的“灵”，但以脚注明示真实的词义歧义，不将其所指强行限定为某一类属灵存在。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，并保留颂歌的呼语、并列命令和反复句式。“永永远远”增强礼仪诗歌感；“尊他为至高”传达 ὑπερυψοῦτε 的强化语气。
