base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/031.yaml
  text: Blessed are you[a], who look upon the depths, seated upon the cherubim[b], and praised and highly exalted forever.
translation:
  language: zh_hans
  text: 你是当称颂的：你俯察诸深渊[a]，坐在基路伯之上[b]；你当受赞美，当受至高尊崇，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “诸深渊”原文为复数，也可译作“众深处”，带有宇宙深渊的意象。
    reason: lexical_alternative
  - marker: b
    text: 或译“坐在基路伯上面”。这里含有神圣宝座的意象，但希腊文没有明说“登基”。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος εἶ
  choice: 你是当称颂的
  rationale: 这是直接向上帝发出的礼仪性称颂。译为“你是当称颂的”，既保留谓语形容词的判断语气，也符合现代汉语敬拜用语。
- source_word: ὁ ἐπιβλέπων
  choice: 你俯察
  rationale: ἐπιβλέπω含有从上察看、注视之意。“俯察”简洁保留视觉和居高临下的意象，不额外解释为眷顾或治理。
- source_word: ἀβύσσους
  choice: 诸深渊
  rationale: 希腊文为复数，指深不可测的深处或宇宙性的深渊。“诸深渊”保留复数及宇宙意象，语体也与颂歌相称。
- source_word: καθήμενος ἐπὶ χερουβεὶν
  choice: 坐在基路伯之上
  rationale: 按字面保留“坐”与ἐπί所表达的空间关系，不在正文中增添希腊文未明说的“登基”。“基路伯”采用通行的圣经专名译法。
- source_word: αἰνετὸς
  choice: 当受赞美
  rationale: 该形容词表示配得赞美、应受赞美。“当受赞美”在现代汉语中自然，并避免仅表示事实上已经有人赞美。
- source_word: ὑπερυψούμενος
  choice: 当受至高尊崇
  rationale: 该词在颂赞语境中表达被极度高举、尊为至高。“当受至高尊崇”传达其强化含义，同时避免生硬的空间性直译。
- source_word: εἰς τοὺς αἰῶνας
  choice: 直到永远
  rationale: 这是颂赞文体中表示永久延续的惯用语。“直到永远”清楚自然，符合现代中文礼仪语体。
theological_decisions:
- issue: 上帝与基路伯相关的宝座意象
  choice: 坐在基路伯之上
  alternative: 在基路伯上方登基
  rationale: 原文明确说“坐在……之上”，但没有使用“登基”或“作王”的词。正文保留原有意象和空间关系，不把相关圣经传统中的完整宝座观念直接写入译文。
- issue: αἰνετός在颂赞中的语力
  choice: 当受赞美
  alternative: 受人赞美
  rationale: 原词可指“可赞美的、配受赞美的”。选择“当受赞美”表达上帝配得赞美，而不把它缩减为已经发生的被动事实。
- issue: ὑπερυψούμενος的被动形式与颂赞含义
  choice: 当受至高尊崇
  alternative: 被高举至上
  rationale: 原文形式带有被高举、被尊崇的表达色彩。汉语以“当受至高尊崇”保留受尊崇的方向和强化程度，又不暗示上帝原先地位较低而后来才被提升。
translation_notes:
  register: 采用庄重而可理解的现代标准汉语，保留颂歌的平行节奏。用“俯察”“诸深渊”“基路伯之上”维持经文的宇宙性和礼仪感，同时避免文言化过重。三个称颂成分以“当称颂、当受赞美、当受至高尊崇”并列，呈现原文连续的颂赞谓语。
