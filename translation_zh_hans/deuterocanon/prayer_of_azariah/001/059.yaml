  text: Bless the Lord[a], sons of men; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 世人哪[a]，要称颂主；要歌颂他，极力尊崇他，直到永远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希腊文直译为“人的众子”，这里泛指全体世人。
    reason: 保留原文的字面阳性复数表达，同时说明其在本节中的泛指意义。
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 要称颂
  rationale: 这是复数命令式；“称颂”既保留祝颂、颂赞的礼仪色彩，也符合现代汉语的敬拜语体。
- source_word: οἱ υἱοὶ τῶν ἀνθρώπων
  choice: 世人哪
  rationale: 希腊文直译为“人的众子”，在此是对全体人类的诗歌式呼唤；“世人哪”自然、庄重，并以脚注保留原文形式。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此指上帝；“主”是简体中文圣经语体中清楚而自然的对应词，且不额外改写为专名。
- source_word: ὑμνεῖτε
  choice: 要歌颂他
  rationale: ὑμνέω含有以诗歌或颂歌赞美之意；“歌颂”保留其音乐和敬拜色彩。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该复合动词带有强烈的高举、极度尊崇之意；“尊他为至高”在现代汉语中自然，并保留加强语气。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是颂赞文中表示绵延无尽的惯用语；“永远”准确且简洁。
theological_decisions:
- issue: κύριος的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 原文只有κύριος；译作“主”忠于现有希腊文本，也避免在正文中补入该词本身未明说的神名形式。
- issue: οἱ υἱοὶ τῶν ἀνθρώπων的性别与范围
  choice: 世人哪
  alternative: 人的众子哪；人类的子孙哪
  rationale: 该阳性复数短语在这里泛指人类。正文采用自然的集合称呼“世人”，脚注同时交代其字面形式，既不把对象限于男性，也不掩盖原文措辞。
- issue: ὑπερυψοῦτε的强化含义
  choice: 尊他为至高
  alternative: 极其尊崇他；将他高举在万有之上
  rationale: 所选译法保留动词的强化意味，却不额外引入“万有”等原文未出现的对象或宇宙论说明。
translation_notes:
  register: 采用现代、庄重而易懂的颂赞语体，以两个“要”呈现复数命令式的呼召。分号对应原文两个并列的命令组；保留诗歌式呼语“哪”，使本节适合诵读。
