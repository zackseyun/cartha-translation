  text: Let the earth bless the Lord; let it sing hymns and highly exalt him forever.
translation:
  language: zh_hans
  text: 愿大地称颂主，歌颂并极力尊崇他，直到永远。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογείτω
  choice: 愿……称颂
  rationale: 第三人称命令式，在礼仪性的呼召中用“愿”自然表达；“称颂”既保留向上帝发出的祝颂意味，也符合现代汉语敬拜语体。
- source_word: ἡ γῆ
  choice: 大地
  rationale: 本段是宇宙万物的赞歌，γῆ指受造界中的全地，而非某一片土地；“大地”自然且有诗歌感。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此是对上帝的称号；“主”是简体中文圣经语体中准确、自然的对应。
- source_word: ὑμνείτω
  choice: 愿……歌颂
  rationale: ὑμνέω含有以诗歌赞美之意；“歌颂”兼顾歌唱和赞美，较“唱赞美诗”更自然，也不把原文限定为特定体裁。
- source_word: ὑπερυψούτω
  choice: 尊……为至高
  rationale: 该复合动词带有强烈的高举意味；“尊他为至高”在汉语中自然地保留强化成分，避免生硬的“极其高举”。
- source_word: αὐτόν
  choice: 他
  rationale: 指回前面的“主”，以现代汉语人称代词表达。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是赞歌中反复出现的持续时间表达；“永远”准确传达跨越世代、无穷延续的意义。
theological_decisions:
- issue: 次经希腊赞歌中κύριος的译法
  choice: 主
  alternative: 主人
  rationale: 此处是敬拜上帝的颂赞语境，“主”既是传统而自然的神圣称号，也比表示社会身份的“主人”恰当。
- issue: ὑπερυψόω的强化语气
  choice: 尊他为至高
  alternative: 极力高举他
  rationale: 原文要求保留超越性的强化意味；“尊他为至高”避免暗示受造物使上帝变得更高，同时仍忠实表达颂扬者承认并宣告他的至高。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语，保留诗歌式平行结构。两个分句都明说“大地”，避免汉语中“它”指代大地时显得生硬；末句将两个并列命令自然组织为“歌颂他，永远尊他为至高”。
