  text: Bless the Lord, lightnings and clouds; sing praise to him and highly exalt him forever.
translation:
  language: zh_hans
  text: 闪电和云彩啊，要称颂主；要歌颂他，永永远远尊他为至高。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: 闪电
  rationale: 希腊语为复数，泛指闪电这一自然现象；现代汉语用集合性单数“闪电”最自然，无须生硬标明复数。
- source_word: νεφέλαι
  choice: 云彩
  rationale: 准确表达复数名词“云”，并与诗歌体呼语相称。
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 在向受造界发出的敬拜呼召中，“称颂”比一般的“祝福”更准确地表达赞美主。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: 保留以诗歌赞美、颂扬的含义。
- source_word: ὑπερυψοῦτε
  choice: 尊……为至高
  rationale: 体现该强化动词“极力高举、尊为至高”的含义，同时保持现代汉语自然。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永永远远
  rationale: 传达惯用语“直到万世”的持续、永恒含义，并符合庄重诗歌语体。
theological_decisions:
- issue: 受造物奉命称颂主的拟人化表达
  choice: 保留对“闪电和云彩”的直接呼语与命令语气
  alternative: 改写为愿闪电和云彩显明主的荣耀
  rationale: 原文直接召唤自然界称颂主；不将其解释性地弱化为间接彰显。
- issue: ὑπερυψοῦτε αὐτόν 的高举语言
  choice: 尊他为至高
  alternative: 极力高举他
  rationale: 既表达强化动词，也避免产生人能使主取得更高地位的误解；这里是承认并宣扬他的至高。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言；保留两组并列祈使句及反复颂赞的礼仪节奏。
