  text: Bless the Lord[a], priests[b]; sing hymns and highly exalt him forever.
translation:
  language: zh_hans
  text: 祭司们，要称颂主；要歌颂他，并永远极力尊崇他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 此处为复数命令式，带有礼仪性赞美意味。“称颂”既保留“祝颂”的语义色彩，又比“祝福主”更符合现代汉语对上帝的颂赞表达。
- source_word: ἱερεῖς
  choice: 祭司们
  rationale: 希腊文为呼格复数，直接呼唤祭司群体；“祭司们”清楚自然地体现这一称呼。
- source_word: τὸν κύριον
  choice: 主
  rationale: 按希腊文 κύριος 直译为“主”，不额外引入希伯来文神名的排印惯例。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: ὑμνέω 明确含有以诗歌或赞歌颂赞之意；“歌颂”在现代汉语中自然保留音乐性的含义。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 该复合动词含加强语气，表示极力高举、尊为至高；此译法比单纯“高举”更清楚地传达强化意味。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 在颂赞公式中自然表达持续无尽的时间意义。
theological_decisions:
- issue: 颂赞语境中 κύριος 的译法
  choice: 主
  alternative: 上主；耶和华
  rationale: 原文是希腊文 κύριος，并未直接呈现四字神名；译作“主”忠实于现有文本，也避免加入原文未明示的神名形式。
- issue: 人对主使用 εὐλογέω 的表达
  choice: 称颂主
  alternative: 祝福主；赞美主
  rationale: “称颂”保留该词的祝颂和礼仪色彩，同时避免现代读者把“祝福主”误解为人向上帝赐福；“赞美”虽自然，却会削弱本段反复用词的独特性。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪诗歌语体；保留两个并列命令和末尾反复出现的永恒颂赞公式。
