  naturalness: “祭司们，要称颂主”庄重自然。“要歌颂他，永远尊他为至高”虽可理解，但“永远”置于两个动词之间且“尊他为至高”略显书面生硬；以“并永远极力尊崇他”连接并列命令更流畅，也保留诗歌礼仪语体。
  terminology: “称颂主”恰当保留εὐλογεῖτε的礼仪性；“祭司们”准确对应呼格复数；“主”符合κύριον；“歌颂”保留ὑμνεῖτε的诗歌性；“极力尊崇”体现ὑπερυψοῦτε的加强意义。
