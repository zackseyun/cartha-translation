base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/021.yaml
  text: And let all who show evil to your servants be put to shame[a], and let them be disgraced from all their dominion[c][b], and let their strength be broken.
translation:
  language: zh_hans
  text: 愿所有向你的仆人[a]施行恶事的人都蒙羞；愿他们因自己的一切权势而蒙受羞辱[b]；愿他们的力量被粉碎。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”所译的希腊词也可指“奴隶”，在这里强调他们属于上帝。
    reason: lexical_alternative
  - marker: b
    text: “因自己的一切权势而蒙受羞辱”所对应的希腊语介词短语含义不完全确定；也可理解为“在他们的一切权势上受辱”。
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐντραπείησαν
  choice: 都蒙羞
  rationale: 这是祈愿语境中的不定过去被动祈愿式；“蒙羞”既表达被动、公开受辱，也保持庄重简洁。
- source_word: οἱ ἐνδεικνύμενοι … κακά
  choice: 向……施恶的人
  rationale: ἐνδείκνυμι 与 κακά 及间接宾语连用，指向某人显出或施行恶事。“施恶”保留其宽泛的道德含义，不把它限缩为身体伤害。
- source_word: τοῖς δούλοις σου
  choice: 你仆人
  rationale: δοῦλος 可指奴隶或仆役，并强调归属与服事关系；在对上帝的祷告中，“你仆人”符合现代汉语庄重语体，脚注补明更强的字面含义。
- source_word: καταισχυνθείησαν
  choice: 蒙受羞辱
  rationale: 与前面的“蒙羞”形成近义平行，同时以较完整的表达突出公开受辱之意。
- source_word: ἀπὸ πάσης τῆς δυναστείας
  choice: 丧尽一切权势
  rationale: ἀπό 与 δυναστεία 的组合较含混，可能表达从权势中被除去或在其权势方面受辱；正文采用符合上下文且自然的剥夺义，脚注保留其他可能。
- source_word: ἡ ἰσχὺς αὐτῶν
  choice: 他们的力量
  rationale: 直译 ἰσχύς，并与前面的“权势”有所区分。
- source_word: συντριβείη
  choice: 被粉碎
  rationale: 被动祈愿式延续全句的祈求；“粉碎”保存 συντρίβω 强烈、彻底破坏的形象。
theological_decisions:
- issue: δοῦλοι 用于上帝子民时的译法
  choice: 你仆人
  alternative: 你的奴仆／你的奴隶
  rationale: 此处强调他们属于并服事上帝，但现代汉语“奴隶”容易首先唤起社会制度意义；“仆人”更符合祷告语体，脚注则保留希腊词所含的隶属意味。
- issue: ἀπὸ πάσης τῆς δυναστείας 的关系
  choice: 将其理解为权势被剥夺
  alternative: 在他们的一切权势上受辱／虽有一切权势仍受辱
  rationale: 介词短语的句法和语义并不完全明确。正文依照与后句“力量被粉碎”的平行关系采用剥夺义，但不把这一解释说成唯一可能。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体，以三个“愿”分句呈现希腊文连续祈愿式的排比。避免生硬直译“显出恶事”，改用自然的“施恶”；对含混的介词短语在正文作审慎处理，并用脚注保留其语义张力。
