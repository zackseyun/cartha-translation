  text: And deliver us according to your wonders, and give glory to your name, O Lord;
translation:
  language: zh_hans
  text: 求你照着你奇妙的作为[a]搭救我们，使你的名得荣耀[b]，主啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照着你的奇事”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“将荣耀给你的名。”这里保留了圣经中尊崇上帝之“名”的表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελοῦ
  choice: 搭救
  rationale: 这是ἐξαιρέω的命令式，在祷告语境中指求上帝施行拯救。“搭救”自然、庄重，也保留从危难中救出的含义。
- source_word: κατὰ τὰ θαυμάσιά σου
  choice: 照着你奇妙的作为
  rationale: κατά加宾格在此表示“按照、与……相称”；θαυμάσια主要指上帝令人惊奇的作为，而不只是抽象的奇事。
- source_word: δὸς δόξαν τῷ ὀνόματί σου
  choice: 使你的名得荣耀
  rationale: 直译为“把荣耀给你的名”。中文采用“使……得荣耀”，既表达祈求上帝荣耀自己之名，又避免生硬表达，并保留“名”这一圣经意象。
- source_word: Κύριε
  choice: 主啊
  rationale: κύριε是直接称呼上帝的呼格；“主啊”准确传达祷告中的呼求语气。
theological_decisions:
- issue: 上帝之“名”与荣耀的关系
  choice: 使你的名得荣耀
  alternative: 将荣耀赐给你的名；荣耀你的名
  rationale: 保留“你的名”，不将其缩减为“你的声誉”；同时用自然中文表达δὸς δόξαν这一较为特殊的希腊语说法，而不判定荣耀具体借谁或以何种方式彰显。
- issue: κατὰ所表达的关系
  choice: 照着你奇妙的作为
  alternative: 借着你奇妙的作为；因你奇妙的作为
  rationale: “照着”保留准则或相称关系；不把κατά明确解释为工具或原因，从而避免消除原文可能具有的张力。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“求你”补明中文祈求语气；句末“主啊”保留希腊文呼格的位置和力度。
