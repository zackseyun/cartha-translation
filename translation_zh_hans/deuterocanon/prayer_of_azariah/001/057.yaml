base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/057.yaml
  text: Bless the Lord[a], all birds of the sky; sing hymns and highly exalt him forever.
translation:
  language: zh_hans
  text: 天空中所有的飞鸟[a]啊，你们要称颂主；要歌颂他，永远极力尊崇他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的一切飞鸟”；πετεινά也可广义理解为“天空中一切会飞的生物”。
    reason: 保留πετεινά所涵盖的“鸟类／飞行生物”范围，以及οὐρανός在“天空／天”之间的词义幅度。
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 称颂
  rationale: 这是复数命令式；在颂歌语境中，“称颂”既保留向主祝颂的礼仪色彩，也比泛指的“赞美”更能与后面的“歌颂”区分。
- source_word: πάντα τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 天空所有的飞鸟
  rationale: πετεινά可指鸟类，也可泛指会飞之物；此处创造万物的列举中，“飞鸟”自然清楚，τοῦ οὐρανοῦ译为“天空的”，避免让人误解为属天的灵体。
- source_word: τὸν κύριον
  choice: 主
  rationale: κύριος在此是受称颂的对象；译作“主”准确、庄重，不将希腊文本未明说的神名形式带入译文。
- source_word: ὑμνεῖτε
  choice: 歌颂
  rationale: ὑμνέω含以诗歌或颂歌赞美之意；“歌颂”简洁地保留其音乐性。
- source_word: ὑπερυψοῦτε
  choice: 尊他为至高
  rationale: 复合动词带有强烈的高举、极其尊崇之意；“尊他为至高”在现代汉语中自然，并保留加强语气。
- source_word: αὐτὸν
  choice: 他
  rationale: 代词回指前面的“主”；中文用“他”清楚自然，不额外加入源文没有的名词。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永远
  rationale: 这是表达恒久不止的惯用语；“永远”是现代汉语中最清楚自然的对应表达。
theological_decisions:
- issue: 颂歌中κύριος的译法
  choice: 主
  alternative: 上主／耶和华
  rationale: 希腊文本写的是κύριος，并未直接出现四字神名；“主”忠实保留其称号性质，也不额外强化特定的神名解释。
- issue: ὑπερυψοῦτε是否暗示提高上帝本有的地位
  choice: 尊他为至高
  alternative: 极力高举他
  rationale: 这里是受造物在赞颂中承认并宣扬主的至高，而不是使他获得原本没有的地位；“尊他为至高”保留颂赞张力，同时避免不必要的本体论误解。
translation_notes:
  register: 采用现代、庄重而适合礼仪诵读的表达。以呼语“啊”和复数命令“你们要”呈现原文对众飞鸟的直接召唤；分号保留两组命令之间的并列推进。
