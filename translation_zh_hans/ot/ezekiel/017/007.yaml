source:
  edition: WLC
  text: וַ/יְהִ֤י נֶֽשֶׁר אֶחָד֙ גָּד֔וֹל גְּד֥וֹל כְּנָפַ֖יִם וְ/רַב נוֹצָ֑ה וְ/הִנֵּה֩ הַ/גֶּ֨פֶן הַ/זֹּ֜את כָּֽפְנָ֧ה שָׁרֳשֶׁ֣י/הָ עָלָ֗י/ו וְ/דָֽלִיּוֹתָי/ו֙ שִׁלְחָה לּ֔/וֹ לְ/הַשְׁק֣וֹת אוֹתָ֔/הּ מֵ/עֲרֻג֖וֹת מַטָּעָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/007.yaml
  text: And there was another great eagle with great wings and much plumage[a]; and behold, this vine bent its roots toward him and sent out its branches to him[d][c][b], that he might water it from the beds where it was planted.
translation:
  language: zh_hans
  text: 又有一只大鹰[a]，有宽大的翅膀，羽毛繁多。看哪，这葡萄树把根转向他，又向他伸出枝条，好让他从栽种它的畦地浇灌它。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”所译的希伯来词也可指“秃鹫”或泛指大型猛禽。
    reason: lexical_alternative
  - marker: b
    text: “从栽种它的畦地”也可理解为与葡萄树“把根转向他、向他伸出枝条”相连：即葡萄树从自己栽种的畦地转向这鹰并向他伸枝。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נֶשֶׁר
  choice: 大鹰
  rationale: 该词可泛指大型猛禽，也可能指秃鹫；本章以王权和帝国为喻，“鹰”既符合语境，也承接传统意象。
- source_word: גָּדוֹל גְּדֹל כְּנָפַיִם
  choice: 一只大鹰，翅膀宽大
  rationale: 保留原文对“大”的重复强调，同时用自然的现代汉语表达其体形和双翼的宏大。
- source_word: רַב נוֹצָה
  choice: 羽毛丰满
  rationale: נוֹצָה指羽毛或翎羽；“羽毛丰满”自然地传达羽毛众多的形象，不额外引申成熟之意。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文突然引人注目的叙事标记及寓言的鲜明转折。
- source_word: כָּפְנָה שָׁרֳשֶׁיהָ עָלָיו
  choice: 把根转向那鹰
  rationale: כפן在这里表示转弯、倾向；על依上下文具有朝向之意，并非表示根实际压在鹰身上。
- source_word: דָלִיּוֹתָיו שִׁלְחָה לּוֹ
  choice: 把枝条伸向他
  rationale: 原文描绘葡萄树主动向第二只鹰伸展；“伸向”兼顾“发出、伸出”的动作和方向。原文“枝条”的代词形式有不规则之处，汉语不必强行复制性别形式。
- source_word: לְהַשְׁקוֹת אֹתָהּ
  choice: 要他浇灌自己
  rationale: 不定式表示目的，隐含施事是第二只鹰；“自己”明确受灌溉者是葡萄树，同时保持拟人化。
- source_word: מֵעֲרֻגוֹת מַטָּעָהּ
  choice: 从栽种它的畦地
  rationale: עֲרֻגוֹת是园圃中的畦或苗床，מַטָּעָהּ指它的栽种处。主文将该短语理解为葡萄树转根伸枝时所离开的地方，符合17:8的语境；其句法归属仍有歧义，另见脚注。
theological_decisions:
- issue: 末尾介词短语 מֵעֲרֻגוֹת מַטָּעָהּ 的句法归属
  choice: 将其与葡萄树转根、伸枝的动作相连，译为“从栽种它的畦地”
  alternative: 将其与“浇灌”相连，译为“让他从栽种它的畦地浇灌它”
  rationale: 原文词序容许后者，但前者更能表现葡萄树离开原有、且水源充足的栽种处而转向另一只鹰，也与下一节相呼应。鉴于句法确有歧义，脚注保留另一译法，不据寓意消除原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留先知寓言的修辞力度；“畦地”准确保留农业图景，虽略具书面色彩，但普通读者仍可理解。鹰以“他”指称，以配合寓言中的拟人化角色；葡萄树用“它／自己”。
