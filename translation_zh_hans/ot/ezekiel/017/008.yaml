lexical_decisions:
- source_word: שָׂדֶה טּוֹב
  choice: 良田
  rationale: שָׂדֶה通常指田地；“良田”既保留具体的农耕意象，也符合现代汉语表达，且不将其过度解释为“肥沃的土壤”。
- source_word: אֶל מַיִם רַבִּים
  choice: 靠近丰沛的水源
  rationale: 种植语境中的אֶל表示位置或临近；מַיִם רַבִּים强调水量充足。“靠近丰沛的水源”自然传达葡萄树所得的丰富水源，同时以脚注保留较直译的可能。
- source_word: שְׁתוּלָה
  choice: 被栽种
  rationale: 该被动分词表示已经被栽下或安置；“被栽种”保留原文的被动语态，又不采用语义更具体的“被移栽”。
- source_word: לַעֲשׂוֹת עָנָף
  choice: 为要长出枝条
  rationale: 此处不定式表达目的或预期结果；“长出枝条”符合现代汉语植物生长的自然说法，并保留עָנָף的植物意象。
- source_word: וְלָשֵׂאת פֶּרִי
  choice: 结出果实
  rationale: נשא与פְּרִי连用表示结果子；“结出果实”是准确、自然的现代汉语对应表达。
- source_word: לִהְיוֹת לְגֶפֶן אַדָּרֶת
  choice: 成为一棵壮美的葡萄树
  rationale: אַדָּרֶת含宏伟、华美或壮丽之意；“壮美”保留其抬高的评价色彩，又避免“高贵”可能引出的社会等级意味。
