  text: It was planted in a good field by abundant waters[a], to produce branches and bear fruit[b], to become a majestic vine.
translation:
  language: zh_hans
  text: 它被栽种在良田里，靠近丰沛的水源[a]，为要长出枝条，结出果实，成为一棵壮美的葡萄树[b]。
  philosophy: optimal-equivalence
