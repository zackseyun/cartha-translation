  yaml_path: translation/ot/ezekiel/017/014.yaml
  text: so that it might become a lowly kingdom[a], not lifting itself up, but keeping his covenant so as to stand.
translation:
  language: zh_hans
  text: 为要使这国成为低微的国，不自高，遵守他的约，使它得以存立。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约”在这里也可译作“条约”；这个希伯来词在本语境中可指有约束力的政治协议。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: 为要使……成为
  rationale: 带 ל 的不定式在上下文中表示目的；“成为”体现进入某种状态。
- source_word: מַמְלָכָה שְׁפָלָה
  choice: 弱小的国
  rationale: 此处描述国家被削弱后的政治地位；“弱小”自然清楚，也避免“卑微”可能带出的道德评价。
- source_word: לְבִלְתִּי הִתְנַשֵּׂא
  choice: 不再自高
  rationale: Hitpael 形式表达自我抬高；“自高”保留其反身含义，而“再”按语境表明不重新抬升国势。
- source_word: לִשְׁמֹר
  choice: 守住
  rationale: שׁמר 与“约”连用，指遵守约定及其义务；“守住”兼顾现代汉语的自然度与原文意象。
- source_word: בְּרִיתוֹ
  choice: 与他所立的约
  rationale: 代词指向前文的巴比伦王；这样表达可避免汉语“他的约”在归属关系上的含混，并保留 בְּרִית 的核心词义。
- source_word: לְעָמְדָהּ
  choice: 使这国得以立稳
  rationale: 阴性单数后缀回指“国”；“立稳”保留 עמד 的站立意象，也传达国家维持稳固的语境含义。
theological_decisions:
- issue: 政治语境中 בְּרִית 的译法
  choice: 约
  alternative: 条约
  rationale: 这里具体指附庸国与巴比伦王之间有誓言约束的政治协议。“约”保留希伯来词的重要语义联系与庄重色彩；脚注说明其政治语境下也可译作“条约”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“弱小的国”突出政治上的低微状态；末句明说“这国”，以清楚呈现阴性后缀的回指对象。
