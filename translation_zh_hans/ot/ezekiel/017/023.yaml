id: EZK.17.23
reference: Ezekiel 17:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/הַ֨ר מְר֤וֹם יִשְׂרָאֵל֙ אֶשְׁתֳּלֶ֔/נּוּ וְ/נָשָׂ֤א עָנָף֙ וְ/עָ֣שָׂה פֶ֔רִי וְ/הָיָ֖ה לְ/אֶ֣רֶז אַדִּ֑יר וְ/שָׁכְנ֣וּ תַחְתָּ֗י/ו כֹּ֚ל צִפּ֣וֹר כָּל כָּנָ֔ף בְּ/צֵ֥ל דָּלִיּוֹתָ֖י/ו תִּשְׁכֹּֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/023.yaml
  text: On the high mountain of Israel I will plant it[a], and it will put forth branches and bear fruit and become a majestic cedar. Under it every bird of every wing will dwell[b]; in the shade of its boughs they will dwell.
translation:
  language: zh_hans
  text: 在以色列的高山上，我要栽种它[a]；它必长出枝条，结出果子，成为一棵雄伟的香柏树。各样有翅的飞鸟都要栖居在它下面[b]；它们必栖居在它繁枝的荫下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“移栽它”。这个希伯来语动词也可着重表示把嫩枝栽到新的地方。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“每一只鸟、每一个翅膀”，是指各类飞鸟的诗意说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַר מְרוֹם יִשְׂרָאֵל
  choice: 在以色列的高山上
  rationale: מְרוֹם表示高度或高处；译为“高山”自然凝练，并保留地势高耸的意象。
- source_word: אֶשְׁתֳּלֶנּוּ
  choice: 我要栽种它
  rationale: שתל指栽种或把幼苗栽下；正文采用直接自然的“栽种”，另以脚注保留“移栽”的可能。
- source_word: וְנָשָׂא עָנָף
  choice: 它必长出枝条
  rationale: 原文直义近于“长出／承载枝条”；在树木生长的语境中，“长出枝条”最符合现代汉语，并可将单数 עָנָף理解为集合性表达。
- source_word: וְעָשָׂה פֶרִי
  choice: 结出果子
  rationale: 这是表示树木结果的常用搭配；“结出果子”既自然，也保留先知性比喻的力度。
- source_word: וְהָיָה לְאֶרֶז אַדִּיר
  choice: 成为一棵雄伟的香柏树
  rationale: אַדִּיר兼有强盛、尊贵和威严之意；“雄伟”贴合高大香柏树的形象，又不额外限定其象征意义。
- source_word: וְשָׁכְנוּ תַחְתָּיו
  choice: 都要栖居在它下面
  rationale: שׁכן表示居住、安居；用于鸟类时，“栖居”自然庄重，也保留安稳居处的意象。
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: 各样有翅的飞鸟
  rationale: 原文诗意地并列“每一只鸟、每一个翅膀”。“各样有翅的飞鸟”在现代汉语中清楚自然，同时保留“翅膀”的形象；直译形式列入脚注。
- source_word: בְּצֵל דָּלִיּוֹתָיו
  choice: 在它繁枝的荫下
  rationale: דָּלִיּוֹת指伸展或垂展的粗大枝条；“繁枝”与前面的“枝条”有所区分，并呈现大树枝叶成荫的画面。
- source_word: תִּשְׁכֹּנָּה
  choice: 它们必栖居
  rationale: 动词与集合性的鸟类主语呼应；汉语以复数代词“它们”表达分布性的复数含义最为清楚。
theological_decisions:
- issue: 飞鸟意象所指的范围
  choice: 正文保留各样飞鸟在树下栖居的比喻，不明说它们代表列国或万民。
  alternative: 把飞鸟直接解释为在复兴国度庇护下的列国或万民。
  rationale: 上下文可能使这一意象具有列国性的含义，但本节本身仍以树与飞鸟的图景表达。保留比喻可避免把解释写入正文，也保存其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“香柏树”沿用中文圣经语境中对 אֶרֶז 的通行称呼；以“枝条／繁枝”体现原文 עָנָף 与 דָּלִיּוֹת 的词汇变化。保留树、飞鸟与荫庇的完整意象，不在正文中加入寓意解释。
