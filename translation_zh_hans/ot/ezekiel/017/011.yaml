  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知启示的固定表达中，与“话”合译为“临到”，既符合希伯来语句式，也自然保留庄重的先知性语体。
- source_word: דְבַר
  choice: 话
  rationale: “话”直接对应该词在此处的意义，并保留“耶和华的话临到……”这一反复出现的先知公式；“信息”虽可表达大意，却削弱了原文的词汇联系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法“耶和华”，将四字神名作为专名呈现，而不以“主”这一称号替代。
- source_word: אֵלַי
  choice: 我
  rationale: 在汉语“临到我”中直接表达介词及第一人称后缀的含义，准确而自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 原词用于引出随后直接宣告的内容；译作“说”简洁自然，并保留原文的引语导入功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文以中文传统且广为人知的专名“耶和华”呈现，不用称号“主”取代；“雅威”更接近学界常见的拟音，但在普通现代中文圣经语境中不如“耶和华”通行。
translation_notes:
  register: 采用现代、庄重而易懂的先知叙事语体。“耶和华的话临到我，说”保留希伯来原文的固定启示公式，不添加原文没有的解释。
