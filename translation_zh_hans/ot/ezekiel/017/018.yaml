base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/018.yaml
  text: He despised the oath by breaking the covenant[a]; behold, he had given his hand, yet did all these things[b]. He will not escape.
translation:
  language: zh_hans
  text: 他藐视誓言[a]，背弃盟约；看哪，他已经作出承诺[b]，却做了这一切。他必不能逃脱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“咒诅”；这里的希伯来词可指带有违誓咒诅的誓言。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“给出他的手”，是作出承诺或缔结协议的惯用表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָזָה
  choice: 他藐视
  rationale: בזה表示轻蔑、蔑视；“藐视”简洁庄重，保留谴责的力度。
- source_word: אָלָה
  choice: 誓言
  rationale: אָלָה在盟约语境中指带有咒诅制裁的誓言；正文译作“誓言”最符合与“盟约”的平行关系，咒诅含义保留在脚注中。
- source_word: לְהָפֵר בְּרִית
  choice: 背弃盟约
  rationale: הפר ברית指破坏或违背盟约。“背弃盟约”自然表达故意违约，并保留其道德分量。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה用于强调并引人注意；“看哪”保留原文突出的修辞作用。
- source_word: נָתַן יָדוֹ
  choice: 伸手立约
  rationale: 原文直译为“交出他的手”，是作出承诺或缔结协议的动作性惯用语。“伸手立约”既保留意象，也让现代读者明白其含义。
- source_word: וְכָל אֵלֶּה עָשָׂה
  choice: 却做了这一切
  rationale: 上下文显示他虽已作出承诺，仍实施了上述背信行为；“却”自然呈现语境中的转折张力。
- source_word: לֹא יִמָּלֵט
  choice: 他必不能逃脱
  rationale: מלט的尼法勒式在此表示无法逃过审判或后果；“必不能逃脱”保留否定和确定语气。
theological_decisions:
- issue: 政治条约语境中的盟约用语
  choice: 保留“誓言”和“盟约”
  alternative: 译作“咒诅”和“条约”
  rationale: 本节所谴责的是政治上的背信，但原文同时赋予此事在上帝面前的盟约与道德分量。“誓言”和“盟约”保留这一层面，又不把政治背景属灵化。
- issue: נָתַן יָדוֹ的表达方式
  choice: 正文译作“伸手立约”
  alternative: 译作“作了承诺”或直译“交出了手”
  rationale: “伸手立约”保留原文可见的动作意象，同时明确其立约、承诺的功能；脚注说明其字面形式，以免掩盖希伯来语表达。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“藐视”“背弃”“逃脱”保持先知谴责的力度；“看哪”保留原文强调语气。“伸手立约”兼顾原文意象与现代可理解性。
