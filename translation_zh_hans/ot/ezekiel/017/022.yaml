reference: Ezekiel 17:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לָקַ֣חְתִּי אָ֗נִי מִ/צַּמֶּ֧רֶת הָ/אֶ֛רֶז הָ/רָמָ֖ה וְ/נָתָ֑תִּי מֵ/רֹ֤אשׁ יֹֽנְקוֹתָי/ו֙ רַ֣ךְ אֶקְטֹ֔ף וְ/שָׁתַ֣לְתִּי אָ֔נִי עַ֥ל הַר גָּבֹ֖הַ וְ/תָלֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/022.yaml
  text: 'Thus says the Lord GOD: I myself will take from the top of the lofty cedar and set it out[a]. From the tip of its young shoots I myself will pluck a tender one[b], and I myself will plant it on a high and lofty mountain.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“我必亲自从高大的香柏树树冠取下一枝，安放它[a]；我必从它嫩枝的梢头摘取一根幼嫩的枝条[b]，亲自把它栽种在一座高峻、突起的山上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“放置它。”
    reason: וְנָתַתִּי 的基本义是“放置、安放”；其具体安放方式在本节未明说。
  - marker: b
    text: 原文直译“一个幼嫩的”；按树木的上下文，指幼嫩的枝条或嫩芽。
    reason: רַךְ 是名词化形容词，原文没有重复“枝条”一词。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 这是现代中文中对该复合神圣称号自然、庄重的表达；“主”对应 אֲדֹנָי，“耶和华”明确呈现专名 יהוה。
- source_word: מִצַּמֶּרֶת הָאֶרֶז הָרָמָה
  choice: 从高大香柏树的树冠
  rationale: צַמֶּרֶת 指树的顶端或树冠；הָרָמָה 描写香柏树高大，保留原文的高耸意象。
- source_word: וְנָתַתִּי
  choice: 将它安置好
  rationale: 基本义为放置、安放。此处与后文明确的“栽种”有别，因此避免提前译成“栽下”。
- source_word: מֵרֹאשׁ יֹנְקוֹתָיו
  choice: 从它嫩枝的梢头
  rationale: רֹאשׁ 在此指顶端、梢头；יֹנְקוֹתָיו 指树长出的嫩枝或幼芽。
- source_word: רַךְ אֶקְטֹף
  choice: 折下一根幼嫩的枝条
  rationale: רַךְ 是名词化形容词，直译为“幼嫩的一个”；结合树木语境补出“枝条”，而 אֶקְטֹף 表示摘取、折下。
- source_word: וְשָׁתַלְתִּי
  choice: 把它栽
  rationale: שׁתל 是栽种的常用动词；宾语承接前述幼嫩枝条。
- source_word: עַל הַר גָּבֹהַ וְתָלוּל
  choice: 在一座高耸的山上
  rationale: גָּבֹהַ 与 תָלוּל 共同强化山的高峻、隆起；中文用“高耸”凝练保留叠加意象。
- source_word: אָנִי ... אָנִי
  choice: 我必亲自……亲自
  rationale: 独立人称代词与第一人称动词并用带有强调意味；以“亲自”体现神主动施行的语气，同时避免中文机械重复。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 采用中文读者熟悉的神名“耶和华”，使专名 יהוה 不被普通称谓取代；不借此加入任何宗派性解释。
- issue: 幼嫩枝条是否直接明说为弥赛亚
  choice: 保留香柏树枝条的比喻形象，不在正文中明说所指
  alternative: 译成带有弥赛亚解释的称号
  rationale: 本节原文只陈述寓意性的栽植行动；翻译应保留其象征张力，把解释留给上下文，而不把后续神学认定写入正文。
- issue: אָנִי 的强调
  choice: 译为“亲自”
  alternative: 仅译为普通第一人称“我”
  rationale: 原文两次明用独立代词，强调行动者正是神；中文“亲自”能自然传达这一重点。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。保留先知宣告公式、第一人称的强调以及树木栽植的连续意象；引号内适度调整中文语序，避免生硬直译。所有脚注标记均已置于正文。
