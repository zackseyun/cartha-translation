revisions:
- from: 我要把我的网撒在他身上，他必落入我的圈套；我要把他带到巴比伦，在那里因他对我背信的事，与他争讼[a]。他背信，正是背叛了我[b]。
  to: 我必将我的网张在他上面；他必被我的网罗捉住；我必把他带到巴比伦，在那里因他对我所行的背信，与他争讼[a]。
  rationale: 修订将末句恢复为一个对应原文名词及关系从句的汉语结构，保留“背信”的盟约／信义破坏含义和“对我”的对象。以“网罗”承接捕捉图像，并保留“与他争讼”及其脚注，以呈现原文不只是单纯宣告判决的司法语气。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:52:59Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确传达了撒网、被捕、带至巴比伦及上帝就背信之事施行司法追究的基本意义。不过，末句把希伯来文的同根强调拆成两个完整分句（“因他对我背信的事……他背信，正是背叛了我”），使一个原有的关系从句显得重复且略有增译。
  naturalness: “我要把我的网撒在他身上”及“他必落入我的圈套”可以理解，但“张开我的网在他上面／被我的网罗捉住”更贴近庄重的经文语体，也更清楚地区分网与捕捉器具。“与他争讼”在此法律语境中自然可用。
  terminology: “背信”适切表达 מַעַל 的失信、破约与背叛性质，不应再另加“背叛了我”作为独立断语。保留“对我所行的背信”即可同时表达行为及其对象。“争讼”保留 נִשְׁפַּטְתִּי אִתּוֹ 的司法交涉意味；脚注说明较简单的“审判他”译法。
  issues:
  - severity: medium
    issue: 末句将“他的背信，就是他对我所行的背信”扩展为两个分句。
    rationale: 原文 מַעֲלוֹ אֲשֶׁר מָעַל בִּי 是名词加关系从句的同根强调，不是两个独立陈述。合并为“他对我所行的背信”既保留强调，也避免汉语中的赘复。
  - severity: low
    issue: “圈套”较口语且主要指计谋。
    rationale: 此处与“网”平行的是实际捕捉意象；“网罗”更适合庄重经文语体，并可涵盖陷阱、罗网的含义。
  revised_text: 我必将我的网张在他上面；他必被我的网罗捉住；我必把他带到巴比伦，在那里因他对我所行的背信，与他争讼[a]。
  revised_footnotes:
