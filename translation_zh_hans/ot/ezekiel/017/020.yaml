  text: וּ/פָרַשְׂתִּ֤י עָלָי/ו֙ רִשְׁתִּ֔/י וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וַ/הֲבִיאוֹתִ֣י/הוּ בָבֶ֗לָ/ה וְ/נִשְׁפַּטְתִּ֤י אִתּ/וֹ֙ שָׁ֔ם מַעֲל֖/וֹ אֲשֶׁ֥ר מָֽעַל בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/020.yaml
  text: I will spread my net over him[a], and he will be caught in my snare; then I will bring him to Babylon[b], and there I will enter into judgment with him for his treachery by which he acted treacherously against me.
translation:
  language: zh_hans
  text: 我必将我的网张在他上面；他必被我的网罗捉住；我必把他带到巴比伦，在那里因他对我所行的背信，与他争讼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在那里审判他”。原文的表达也可指与某人进入司法审理或争讼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרַשְׂתִּי עָלָיו רִשְׁתִּי
  choice: 我要把我的网撒在他身上
  rationale: “撒网”自然保留פָרַשׂ与רֶשֶׁת构成的捕捉意象；“在他身上”对应עָלָיו，并保留上帝亲自行动的第一人称表达。
- source_word: וְנִתְפַּשׂ בִּמְצוּדָתִי
  choice: 他必落入我的圈套
  rationale: 上下文是捕猎意象，מְצוּדָה在此宜解作圈套而非堡垒；“落入”以自然汉语表达被捕获的被动结果。
- source_word: וַהֲבִיאוֹתִיהוּ בָבֶלָה
  choice: 我要把他带到巴比伦
  rationale: 使役形式译为“把他带到”，方向词尾以“到巴比伦”表达。
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ שָׁם
  choice: 在那里……与他争讼
  rationale: 该结构不只表示宣判，也可带有进入司法争辩、审理的含义；“与他争讼”既保留相互关联的句法色彩，也维持法律语域。
- source_word: מַעֲלוֹ אֲשֶׁר מָעַל בִּי
  choice: 他对我背信的事……他背信，正是背叛了我
  rationale: מַעַל及其同根动词强调违背信义，且在本章语境中涉及盟约与誓言。汉语用“背信”重复核心词，并以“背叛了我”明确其对象是上帝，尽量保留原文同根复沓的强调。
theological_decisions:
- issue: מַעַל / מָעַל所指罪行的性质
  choice: 译作“背信”，并说明这是“背叛了我”
  alternative: 不忠；干犯；犯罪
  rationale: 本章所述既是西底家违背誓言与盟约的政治行为，也被上帝认定为对他的冒犯。“背信”保留盟约破裂与政治背叛的双重张力，不把它局限为礼仪性罪过。
- issue: וְנִשְׁפַּטְתִּי אִתּוֹ的司法含义
  choice: 与他争讼
  alternative: 审判他；与他评理
  rationale: “审判他”较简明，却会削弱介词אִתּוֹ所体现的司法交锋色彩；“与他争讼”较准确地保留进入诉讼、审理的法律语气，同时不预先淡化上帝作为审判者的地位。
translation_notes:
  register: 采用现代、庄重而可懂的普通话。“圈套”承接撒网的捕猎图景；“争讼”稍具法律色彩，用以保存原文司法表达。正文调整脚注位置，使司法说明紧随“争讼”，盟约性词义说明紧随“背叛了我”。
