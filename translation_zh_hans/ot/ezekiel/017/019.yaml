  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֗א אָֽלָתִ/י֙ אֲשֶׁ֣ר בָּזָ֔ה וּ/בְרִיתִ֖/י אֲשֶׁ֣ר הֵפִ֑יר וּ/נְתַתִּ֖י/ו בְּ/רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/019.yaml
  text: 'Therefore thus says the Lord GOD: As I live[a], surely my oath that he despised and my covenant that he broke—I will place them on his own head.'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：“我指着我的永生起誓：他既藐视我的誓言[a]，又违背我的约，我必使这事归到他头上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓言”也可译作“咒诅”；希伯来语这个词可指带有违誓咒诅的誓言。
    reason: 保留 אָלָה 可指誓言及其所含违誓咒诅的词义范围。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 自然表达由前文罪状引出的审判结论。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知宣告的固定格式，并以“耶和华”呈现神名，避免“主主”的重复。
- source_word: חַי אָנִי אִם לֹא
  choice: 我指着我的永生起誓
  rationale: 这是庄严的神圣自誓公式；该译法在现代汉语中清楚传达其起誓效力，而非按字面译成条件句。
- source_word: אָלָתִי
  choice: 我的誓约
  rationale: 上下文着重于被藐视的宣誓义务；“誓约”也可与后面的“约”区分，同时脚注保留该词所含违誓招致咒诅的语义。
- source_word: בָּזָה
  choice: 藐视
  rationale: 准确表达带有轻蔑的拒绝，语气强而简洁。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: 保留 בְּרִית 的圣经核心用语；这里神把在他面前订立的政治盟约称为自己的约。
- source_word: הֵפִיר
  choice: 背弃
  rationale: 在汉语中自然搭配“约”，表达破坏、违犯盟约义务。
- source_word: וּנְתַתִּיו בְּרֹאשׁוֹ
  choice: 我必使这一切归到他自己头上
  rationale: 保留“在他头上”的责任与惩罚意象；“这一切”承接被藐视的誓约和被背弃的约，同时避免把希伯来文单数后缀生硬处理为仅指其中一项。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”既保留称号 אֲדֹנָי，也直接呈现四字神名 יְהוִה，是中文圣经语境中庄重而易懂的表达。
- issue: אָלָה 应突出“誓言”还是“咒诅”
  choice: 我的誓约
  alternative: 我的咒诅
  rationale: 本节直接聚焦君王所藐视的宣誓义务，但该词也可指带有违誓咒诅条款的誓言，因此在脚注中保留另一层含义。
- issue: וּנְתַתִּיו 的单数宾语如何承接前面的誓约与约
  choice: 这一切
  alternative: 这事
  rationale: 希伯来文用阳性单数后缀，却在前文并列提到誓约和约；译作“这一切”保留集合性所指，不武断限定为某一项，也传达责任与后果全归违约者本人。
translation_notes:
  register: 采用现代、庄重而清楚的先知宣告语体。“我指着我的永生起誓”明确传达神圣自誓；“归到他自己头上”保留原文具体而有力的审判意象。
