source:
  edition: WLC
  text: וְֽ/יָדְע֞וּ כָּל עֲצֵ֣י הַ/שָּׂדֶ֗ה כִּ֣י אֲנִ֤י יְהוָה֙ הִשְׁפַּ֣לְתִּי עֵ֣ץ גָּבֹ֗הַ הִגְבַּ֨הְתִּי֙ עֵ֣ץ שָׁפָ֔ל הוֹבַ֨שְׁתִּי֙ עֵ֣ץ לָ֔ח וְ/הִפְרַ֖חְתִּי עֵ֣ץ יָבֵ֑שׁ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/024.yaml
  text: 'And all the trees of the field shall know that I am Yahweh: I have brought low the high tree[a], I have raised up the low tree, I have dried up the green tree, and I have made the dry tree flourish. I am Yahweh; I have spoken[b], and I have done it.'
translation:
  language: zh_hans
  text: 田野中所有的树都必知道，我是雅威：我使高树降下，使低树升高；我使青翠的树枯干[a]，使枯干的树开花[b]。我是雅威；我已经说了，也已经成就了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “青翠”原文也可译作“鲜嫩”或“湿润”；所用形容词本指含有水分、新鲜。
    reason: lexical_alternative
  - marker: b
    text: “开花”也可译作“发芽”或“繁茂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 都必知道
  rationale: 该完成式在先知话语中表达将来而确定的结果；“必”体现宣告的确定性。
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: 田野所有的树
  rationale: 直接保留树木意象，不在正文中解释为君王或列国。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代。
- source_word: הִשְׁפַּלְתִּי עֵץ גָּבֹהַ
  choice: 我使高树降低
  rationale: 保留使役意义，并与下句形成高低反转的鲜明平行。
- source_word: הִגְבַּהְתִּי עֵץ שָׁפָל
  choice: 使矮树升高
  rationale: “矮”首先保持树木的形象，同时不排除其隐喻意义；“升高”对应使役形式。
- source_word: הוֹבַשְׁתִּי עֵץ לָח
  choice: 我使青翠的树枯干
  rationale: לָח本义为含水、新鲜；用于树木时，“青翠”以自然汉语表达其鲜活状态。
- source_word: וְהִפְרַחְתִּי עֵץ יָבֵשׁ
  choice: 使枯干的树开花
  rationale: פרח使役式可指使之发芽、开花；“开花”具体保留植物意象。
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: 我已经说了，也必成就
  rationale: 前一完成式表明宣告已经发出，后一完成式具有先知性确定语气；“必成就”自然传达雅威的话必付诸实现。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用专名，正文保留其专名性质，不以“主”这一称号替代。
- issue: 树木意象的指涉范围
  choice: 正文保留树木隐喻
  alternative: 直接译解为君王或列国
  rationale: 上下文可赋予树木政治及神学指涉，但本节仍以树木陈述；翻译不应替原文解开隐喻。
- issue: 完成式דִּבַּרְתִּי וְעָשִׂיתִי的时间与语气
  choice: 我已经说了，也必成就
  alternative: 我说了，也做了／我已经说了，也已经成就
  rationale: 保留宣告已发出与行动必然实现之间的张力，也符合先知话语以完成式表达确定将来之用法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。四个使役分句以“降低／升高、枯干／开花”构成对称，保留原文的反转结构。正文所有脚注标记均已对应列出。
