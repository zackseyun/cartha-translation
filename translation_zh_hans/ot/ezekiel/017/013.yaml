base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/013.yaml
  text: And he took one of the royal offspring and made a covenant with him[a], bringing him under an oath, and he took the mighty men of the land.
translation:
  language: zh_hans
  text: 他从王室后裔中取了一人，与他立约，使他受誓言约束[a]，又把国中的权贵带走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他受咒誓约束”；希伯来语所用的词可指带有咒诅的誓言，即违背誓言者将招致咒诅。
    reason: 保留אָלָה兼具誓言和违誓咒诅的词义范围。
lexical_decisions:
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: 从王室后裔中选了一个
  rationale: זֶרַע在谱系语境中指后裔；מִן具有部分义。此译自然表达“从王族后裔中取一人”，并保留王朝血统的含义。
- source_word: וַיִּכְרֹת אִתּוֹ בְּרִית
  choice: 与他立约
  rationale: כרת ברית是“立约”的固定表达；“立约”既符合现代汉语圣经语体，也保留其庄严、约束性的含义，不把它缩减为一般政治协定。
- source_word: וַיָּבֵא אֹתוֹ בְּאָלָה
  choice: 使他受誓言约束
  rationale: 字面结构是使他进入אָלָה。该词兼有誓言及违誓所招致之咒诅的色彩；正文用清楚自然的表达呈现其约束力，复合语义则见脚注。
- source_word: אֵילֵי הָאָרֶץ
  choice: 国中的权贵
  rationale: אֵילִים本义为公羊，此处比喻有权势和地位的人。“权贵”自然地传达其力量与社会地位，又不强行限定为某种正式官职。
- source_word: לָקָח
  choice: 带走
  rationale: לָקָח基本义为拿、取；在本节政治处置的语境中，“带走”清楚说明这些权贵被从本地移走，同时避免无根据地强化为“掳走”或“抓走”。
theological_decisions:
- issue: 政治语境中的בְּרִית
  choice: 立约
  alternative: 订立盟约；缔结条约
  rationale: 原文使用通常表示“约”的בְּרִית，随后又提到誓言。保留“立约”可呈现这种关系庄严而具有约束力的性质，不把它仅仅解释为世俗条约。
- issue: אָלָה的誓言与咒诅含义
  choice: 正文译为“使他受誓言约束”，脚注保留咒诅性制裁的含义
  alternative: 使他进入咒诅；使他立咒誓
  rationale: אָלָה可指誓言，也可突出违背誓言所招致的咒诅。正文采用通顺且不误解为单纯受咒诅的译法，脚注则保存原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“王室后裔”“立约”“权贵”兼顾原文的王朝、盟约和政治语境。正文中的脚注标记[a]与脚注完全对应。
