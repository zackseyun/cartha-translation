source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל מברח/ו בְּ/כָל אֲגַפָּי/ו֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/הַ/נִּשְׁאָרִ֖ים לְ/כָל ר֣וּחַ יִפָּרֵ֑שׂוּ וִ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/021.yaml
  text: And all his fugitives among all his troops will fall by the sword[a], and those who remain will be scattered to every wind. Then you will know that I, Yahweh[b], have spoken.
translation:
  language: zh_hans
  text: 他各支部队[b]中所有逃亡者[a]都必倒在刀下；剩下的人必被驱散到四面八方。这样，你们就必知道，是我——雅威——说了这话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“逃亡者”；一些古代译本和现代译本将此词理解为“精选的人”或类似意思。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“他的各翼”；这是军事意象，指各支部队或分队。
    reason: lexical_alternative
lexical_decisions:
- source_word: מברחו
  choice: 逃亡的人
  rationale: 该形式最自然地源自 ברח（逃跑），指逃跑或企图逃脱的人。译为“逃亡的人”既贴近希伯来文本，也符合本节审判场景；古代译本所反映的另一读法另见脚注。
- source_word: אֲגַפָּיו
  choice: 各支部队
  rationale: 字面义为“他的翅膀”，在军事语境中比喻部队、分队或两翼。“各支部队”自然传达其军事含义，同时以脚注保留原文意象。
- source_word: בַּחֶרֶב
  choice: 倒在刀下
  rationale: 这是战争与刑罚语境中的惯用表达，表示被兵器杀死；“倒在刀下”在现代汉语中庄重而自然。
- source_word: הַנִּשְׁאָרִים
  choice: 剩下的人
  rationale: 指杀戮之后仍留下的人。此处这些人随后还要被驱散，因此不采用可能带有正面神学意味的“余民”。
- source_word: לְכָל רוּחַ
  choice: 到四面八方
  rationale: 原文意象是“向每一阵风／各风向”，即散往各个方向。“四面八方”自然表达该希伯来习语的含义。
- source_word: יִפָּרֵשׂוּ
  choice: 必分散
  rationale: 该被动形式在此表示被分散、散布各处；“必分散”保留预言性审判宣告的力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代专名。
- source_word: דִּבַּרְתִּי
  choice: 说了这话
  rationale: 保留以西结书中神圣宣告的庄严公式；补出“这话”使现代汉语表达完整自然，并未增加实质内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留其专名性质，而不是用“主”等称号替代；“耶和华”是传统汉语音译，但较不贴近通常重构的读音。
- issue: הַנִּשְׁאָרִים 是否译作带神学色彩的“余民”
  choice: 剩下的人
  alternative: 余民
  rationale: 本节所说的是在刀剑之后存留下来、继而被分散的人，并未明说他们是蒙保守的忠信群体；因此避免加入原文没有明确表达的正面“余民”神学。
- issue: מברחו 的文本与释义歧义
  choice: 逃亡的人
  alternative: 精锐／精选的人
  rationale: 现存希伯来文本最自然地指逃跑者，但部分古代版本及相关文本传统似乎理解为“精选的人”。正文依马所拉文本，脚注保留另一古老理解。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“倒在刀下”保留审判宣告的圣经语体；“四面八方”自然传达“向各风向”的形象含义。脚注标记紧跟各自所解释的词语，避免英文咨询层中标记位置与注释内容错配的问题。
