language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱמֹ֗ר כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהֹוִ֖ה תִּצְלָ֑ח הֲ/לוֹא֩ אֶת שָׁרָשֶׁ֨י/הָ יְנַתֵּ֜ק וְ/אֶת פִּרְיָ֣/הּ יְקוֹסֵ֣ס וְ/יָבֵ֗שׁ כָּל טַרְפֵּ֤י צִמְחָ/הּ֙ תִּיבָ֔שׁ וְ/לֹֽא בִ/זְרֹ֤עַ גְּדוֹלָה֙ וּ/בְ/עַם רָ֔ב לְ/מַשְׂא֥וֹת אוֹתָ֖/הּ מִ/שָּׁרָשֶֽׁי/הָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/009.yaml
  text: 'Say[a], ‘Thus says the Lord GOD: Will it prosper? Will he not pull up its roots and cut off its fruit, so that it dries up? All the fresh leaves of its growth will wither[b]. And not by a great arm or by many people will it be lifted from its roots.’'
translation:
  language: zh_hans
  text: 你要说：‘主雅威如此说：它能茂盛吗？他岂不扯断它的根[a]，剪掉它的果子，使它枯干吗？它所长出的嫩叶全都要枯萎。不必用强大的膀臂[b]，也不必用许多的人，就能把它连根拔起。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “扯断”也可译作“扯离”或“拔起”；原文动词强调强力扯开、拉离。
    reason: lexical_alternative
  - marker: b
    text: “膀臂”也可引申指力量或权势。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: 你要说
  rationale: 阳性单数命令式，引出先知宣告；补出汉语所需的主语“你”。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主雅威如此说
  rationale: 保留先知使者公式，并将 אֲדֹנָי 译作“主”、圣名 יְהוִה 音译作“雅威”，避免把两个称号合并。
- source_word: תִּצְלָח
  choice: 它能茂盛吗
  rationale: 在葡萄树的语境中，此动词兼有成功与生长良好的含义；“茂盛”自然保留植物意象。
- source_word: הֲלוֹא
  choice: 岂不……吗
  rationale: 表达期待肯定答案的反问语气。
- source_word: יְנַתֵּק
  choice: 拔断
  rationale: 该动词表示扯开、拔离；“拔断”既体现强力扯离，也不预先把动作完全等同于后文的连根拔起。
- source_word: יְקוֹסֵס
  choice: 剪掉
  rationale: 表示剪除或削去，与葡萄树及果子的农作意象相称。
- source_word: וְיָבֵשׁ
  choice: 使它枯干
  rationale: 承接拔根、剪果后的结果；中文以使动结构清楚表达这连串行动导致葡萄树枯干。
- source_word: כָּל טַרְפֵּי צִמְחָהּ
  choice: 它所长出的嫩叶全都
  rationale: טַרְפֵּי 指新鲜叶片，צִמְחָהּ 指其萌生或长出的部分；译文具体保留植物图景。
- source_word: תִּיבָשׁ
  choice: 要枯萎
  rationale: 用于叶片时，“枯萎”比“枯干”更自然，同时保留与前一分句同属干枯语义场的呼应。
- source_word: וְלֹא בִזְרֹעַ גְּדוֹלָה וּבְעַם רָב
  choice: 无需强大的力量，也无需众多的人手
  rationale: זְרוֹעַ 字面为“膀臂”，在此喻指力量；עַם רָב 原文为众多的人，并未明说军队，因此译作“众多的人手”。
- source_word: לְמַשְׂאוֹת אוֹתָהּ מִשָּׁרָשֶׁיהָ
  choice: 就能把它从根上拔起来
  rationale: 保留“使它升起、离开其根”的动作，并用自然汉语呈现彻底拔离的植物意象。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主雅威
  alternative: 主耶和华；主上帝
  rationale: 分别呈现“主”和圣名 YHWH；“雅威”是现代汉语中较直接的圣名音译，也避免以普通称号取代专名。
- issue: 反问中施事者“他”的所指
  choice: 保留“他”而不在正文中解释
  alternative: 明确译作“那鹰”或“巴比伦王”
  rationale: 希伯来文本只用阳性单数动词，所指须由寓言上下文判断；正文不把寓意解释直接写入本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留葡萄树寓言的根、果子、嫩叶等具体意象，并以“岂不……吗”再现希伯来语期待肯定答案的反问。末句用“无需……就能……”表达原文“不凭强大膀臂和众多人民便可拔起”的力度，同时不把“众多的人”限定为军队。
