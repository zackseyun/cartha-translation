revisions:
- from: 你要说：‘主雅威如此说：它能茂盛吗？他岂不拔断它的根[a]，剪掉它的果子，使它枯干吗？它所长出的嫩叶全都要枯萎。无需强大的力量[b]，也无需众多的人手，就能把它从根上拔起来。’
  to: 你要说：‘主雅威如此说：它能茂盛吗？他岂不扯断它的根[a]，剪掉它的果子，使它枯干吗？它所长出的嫩叶全都要枯萎。不必用强大的膀臂[b]，也不必用许多的人，就能把它连根拔起。’
