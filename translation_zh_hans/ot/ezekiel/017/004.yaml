  yaml_path: translation/ot/ezekiel/017/004.yaml
  text: He plucked off the topmost of its young shoots and brought it to the land of Canaan[a]; he set it in a city of merchants.
translation:
  language: zh_hans
  text: 他摘下它嫩枝的顶梢，把它带到迦南地[a]，安置在一座商人之城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“商人之地”。“迦南”在这里也可带有经商的含义，尤其与下句“商人之城”相呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ יְנִיקוֹתָיו
  choice: 它嫩枝的梢头
  rationale: רֹאשׁ 在此指嫩枝最上端的部分；“梢头”既保留树木意象，也符合现代汉语表达。יְנִיקוֹתָיו 指树上新生、幼嫩的枝条，译作“它嫩枝的”。
- source_word: קָטָף
  choice: 掐了下来
  rationale: 该动词表示掐取、摘取或折取；“掐了下来”生动呈现从嫩枝上取下梢头的动作，又不额外指定是否使用工具。
- source_word: וַיְבִיאֵהוּ
  choice: 带到
  rationale: 该词表示把对象带往某处；宾语后缀在比喻画面中回指所取下的梢头，汉语可自然省略重复宾语。
- source_word: אֶרֶץ כְּנַעַן
  choice: 迦南之地
  rationale: 保留“迦南”这一名称，同时以脚注说明 כְּנַעַן 在本处也可能具有“商人、经商之地”的语义，与下句“商人的城”相呼应。
- source_word: בְּעִיר רֹכְלִים
  choice: 在一座商人的城里
  rationale: רֹכְלִים 指往来经商的人。“商人的城”保留原文领属结构及较庄重的语体，并凸显与“迦南”潜在商业含义的呼应。
- source_word: שָׂמוֹ
  choice: 安置
  rationale: 该动词意为放置、安放；“安置”在此自然表达有意把梢头放在该城中的动作。
