  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הַ/נֶּ֤שֶׁר הַ/גָּדוֹל֙ גְּד֤וֹל הַ/כְּנָפַ֨יִם֙ אֶ֣רֶךְ הָ/אֵ֔בֶר מָלֵא֙ הַ/נּוֹצָ֔ה אֲשֶׁר ל֖/וֹ הָֽ/רִקְמָ֑ה בָּ֚א אֶל הַ/לְּבָנ֔וֹן וַ/יִּקַּ֖ח אֶת צַמֶּ֥רֶת הָ/אָֽרֶז־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: The great eagle, great in wings, long in pinions, full of plumage, which had variegated feathers, came to Lebanon and took the top of the cedar.’'
translation:
  language: zh_hans
  text: 你要说：“主耶和华如此说：有一只大鹰，翅膀宽大，翎羽修长，羽毛丰满，色彩斑斓[a]。它来到黎巴嫩，取走了香柏树的树梢。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “色彩斑斓”原文直译可作“有彩纹（或刺绣般的纹样）”，在这里很可能是形容羽毛色彩丰富、纹理多样。
    reason: 保留רִקְמָה兼有彩纹、斑驳和刺绣图样等含义的词汇歧义。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 以现代中文圣经语体中自然且庄重的复合称号表达，既保留“主”的称谓，也音译神名יהוה，避免译成重复而生硬的“主上主”。
- source_word: הַנֶּשֶׁר הַגָּדוֹל
  choice: 一只大鹰
  rationale: נֶשֶׁר指大型猛禽，传统和上下文均宜译为“鹰”；“大”同时传达体形与威势。
- source_word: גְּדוֹל הַכְּנָפַיִם
  choice: 翅膀宽大
  rationale: 希伯来文直陈其翅膀之大；“宽大”在现代汉语中自然呈现其宏阔翼展，又不额外限定为精确的翼展数据。
- source_word: אֶרֶךְ הָאֵבֶר
  choice: 翎羽修长
  rationale: אֵבֶר在鸟类描写中指翅翼或飞羽；“翎羽修长”保留与前后羽翼描写的区别，并维持诗性节奏。
- source_word: מָלֵא הַנּוֹצָה
  choice: 羽毛丰满
  rationale: 准确表达“满有羽毛”，且“羽毛丰满”是自然、清楚的现代汉语。
- source_word: אֲשֶׁר לוֹ הָרִקְמָה
  choice: 色彩斑斓
  rationale: רִקְמָה本义涉及刺绣、彩纹或斑驳图案；置于鹰的描写中，很可能指羽毛具有多彩纹理。正文采用自然意译，脚注保留其具体词义范围。
- source_word: בָּא אֶל הַלְּבָנוֹן
  choice: 来到黎巴嫩
  rationale: 直接保留地名及动作，不预先解释其寓意。
- source_word: צַמֶּרֶת הָאָרֶז
  choice: 香柏树的树梢
  rationale: צַמֶּרֶת指树冠最上端或梢头；“树梢”清楚传达大鹰取走香柏树顶端的图像。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文明确保留יהוה这一神名；译作“主耶和华”既符合现代中文读者熟悉的庄重表达，也不把专名泛化为称号“上帝”。
- issue: 是否在正文解释鹰、黎巴嫩和香柏树的寓意
  choice: 不在正文解释，保留谜喻本身
  alternative: 直接标明其所象征的君王、国家或王室
  rationale: 本节属于后文将予解释的寓言性谜语；正文若提前落实象征对象，会消除原文有意保留的文学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续使用“翅膀宽大，翎羽修长，羽毛丰满，色彩斑斓”再现原文层叠的鹰之描写，同时避免过度文言化。脚注标记紧接其实际说明的词语，而非置于“你要说”之后。
