id: EZK.17.15
reference: Ezekiel 17:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּמְרָד בּ֗/וֹ לִ/שְׁלֹ֤חַ מַלְאָכָי/ו֙ מִצְרַ֔יִם לָֽ/תֶת ל֥/וֹ סוּסִ֖ים וְ/עַם רָ֑ב הֲ/יִצְלָ֤ח הֲ/יִמָּלֵט֙ הָ/עֹשֵׂ֣ה אֵ֔לֶּה וְ/הֵפֵ֥ר בְּרִ֖ית וְ/נִמְלָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/015.yaml
  text: But he rebelled against him by sending his messengers to Egypt[a], that they might give him horses and many people. Will he prosper? Will he escape[b], who does these things? Can he break a covenant and yet escape?
translation:
  language: zh_hans
  text: 可是，他背叛了那王，派遣使者到埃及，要埃及给他马匹和大批兵力[a]。他能成功吗？做这些事的人能逃脱吗？他违背盟约[b]，还能逃脱吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“马匹和众多人民”；这里指埃及提供的军事援助，也可译作“马匹和大批军队”。
    reason: lexical_alternative
  - marker: b
    text: 或译“破坏盟约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְרָד בּוֹ
  choice: 他背叛了那王
  rationale: מרד表示反叛宗主或统治者；בּוֹ在上下文中指那位王。用“那王”明确汉语代词所指，同时不增加身份说明。
- source_word: לִשְׁלֹחַ מַלְאָכָיו מִצְרַיִם
  choice: 派遣使者到埃及
  rationale: מַלְאָךְ在这里是执行外交任务的使者；“使者”保留比“使臣”或“大使”更宽的词义。
- source_word: לָתֶת לוֹ סוּסִים וְעַם רָב
  choice: 要埃及给他马匹和大批兵力
  rationale: לָתֶת表达派遣使者的目的。עַם רָב字面为“众多人民”，但此处所求是埃及的军事援助；“大批兵力”自然传达语境含义，字面形式则收入脚注。
- source_word: הֲיִצְלָח
  choice: 他能成功吗？
  rationale: צלח在此询问反叛行动能否得逞；“成功”比“兴旺”更贴合政治行动的语境。
- source_word: הֲיִמָּלֵט
  choice: 能逃脱吗？
  rationale: מלט表示从危险或惩罚中逃脱；重复译出，以保留原文连续反问的强调。
- source_word: הָעֹשֵׂה אֵלֶּה
  choice: 做这些事的人
  rationale: 按名词化分词的泛指单数表达，现代汉语自然且保留原文指控意味。
- source_word: וְהֵפֵר בְּרִית
  choice: 他违背盟约
  rationale: הפר ברית指破坏、违背盟约；“违背盟约”既适合政治关系，也保留其道德与神学分量。
- source_word: וְנִמְלָט
  choice: 还能逃脱吗？
  rationale: “还”传达末句反问中的不可置信语气，同时保留第二次出现的“逃脱”。
theological_decisions:
- issue: בְּרִית所指政治关系的性质
  choice: 盟约
  alternative: 条约；协定
  rationale: 上下文虽涉及国际政治，בְּרִית在本章也带有立誓与忠信的道德分量。“盟约”既符合君王间结盟的语境，又不把含义削弱为纯世俗协定。
- issue: בְּרִית是否应明确为特指
  choice: 不加“这”或“那个”，译作“盟约”
  alternative: 这盟约；所立的盟约
  rationale: 希伯来文没有冠词，但上下文显然涉及已知的盟约。汉语裸名词“盟约”可自然保留这种形式与语境之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。连续三个反问保留先知话语的审判力度；“那王”用于消除汉语中两个男性代词连续出现造成的指代含混。脚注标记均置于所解释的词组之后。
