- from: 主耶和华宣告：“我指着我的永生起誓：他必死在立他为王的那位王那里，就是巴比伦城中；那位王的誓言[a]，他藐视了；那位王的约[b]，他违背了。”
  to: 主雅威宣告：“我凭我的生命起誓：他藐视那王的誓言[a]，违背那王的约[b]；他必死在巴比伦中、在那立他为王的王那里。”
  rationale: 修订采用“我凭我的生命起誓”表达希伯来语自我起誓公式，保留“必”所表达的誓言式断言；以“在巴比伦中、在那立他为王的王那里”对应原文的地点及“与他”关系，且不把巴比伦限定为城市。正文保留“誓言—约”与“藐视—违背”的平行，脚注不变。
