source:
  edition: WLC
  text: חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א בִּ/מְקוֹם֙ הַ/מֶּ֨לֶךְ֙ הַ/מַּמְלִ֣יךְ אֹת֔/וֹ אֲשֶׁ֤ר בָּזָה֙ אֶת אָ֣לָת֔/וֹ וַ/אֲשֶׁ֥ר הֵפֵ֖ר אֶת בְּרִית֑/וֹ אִתּ֥/וֹ בְ/תוֹךְ בָּבֶ֖ל יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/016.yaml
  text: As I live[a], declares the Lord GOD, surely in the place of the king who made him king[b], whose oath he despised and whose covenant he broke—with him in the midst of Babylon he will die.
translation:
  language: zh_hans
  text: 主雅威宣告：“我凭我的生命起誓：他藐视那王的誓言[a]，违背那王的约[b]；他必死在巴比伦中、在那立他为王的王那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “誓言”也可译作“带咒诅的誓言”，即起誓者若违誓，便甘愿承受咒诅。
    reason: lexical_alternative
  - marker: b
    text: “约”在这里也可译作“条约”，指两位君王之间的政治盟约。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是希伯来语庄严的自我起誓公式。直译“我活着”在现代汉语中不易显出誓言功能；此译明确表达“以自己的永生为凭”的含义。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: נְאֻם是先知话语中常见的宣告公式；אֲדֹנָי译为“主”，יהוה按其专名译为“耶和华”。
- source_word: אִם לֹא
  choice: 必
  rationale: 在起誓语境中，这一结构表示强烈断言，并非普通的条件句；汉语用“必”自然传达其确定和庄严的语气。
- source_word: הַמֶּלֶךְ הַמַּמְלִיךְ אֹתוֹ
  choice: 立他为王的那位王
  rationale: 保留原文“王”与“使他作王”的呼应，也显明此人的王位由另一位王所立。
- source_word: אֲשֶׁר בָּזָה אֶת אָלָתוֹ
  choice: 那位王的誓言，他藐视了
  rationale: אָלָה可指带有咒诅约束的誓言；正文采用清楚自然的“誓言”，并以脚注保留更强的词义可能。
- source_word: וַאֲשֶׁר הֵפֵר אֶת בְּרִיתוֹ
  choice: 那位王的约，他违背了
  rationale: בְּרִית既可指盟约，也可在国际政治语境中指条约；“约”既保留原词的庄重含义，也不把政治背景排除在外。
- source_word: אִתּוֹ בְתוֹךְ בָּבֶל יָמוּת
  choice: 他必死在那位王那里，就是巴比伦城中
  rationale: אִתּוֹ回指立他为王的那位王；此译保留“在他那里”的关系，并以“就是”自然说明该地点位于巴比伦。בְתוֹךְ所含“在……之中”的强调由“城中”表达。
theological_decisions:
- issue: 神名יהוה及复合称谓אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文直接使用神的专名יהוה；译作“耶和华”保留专名性质，而“主耶和华”也准确反映אֲדֹנָי与יהוה并列的形式。
- issue: “约”在本节中的政治与神学色彩
  choice: 正文译“约”，脚注注明也可译“条约”
  alternative: 条约
  rationale: 上下文涉及附庸王与巴比伦王之间的政治协定，但原词בְּרִית具有更广的“约”之含义。正文不把它缩减为纯世俗协议，脚注则交代具体政治语境。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句首以“我指着我的永生起誓”显明希伯来语誓言公式，随后用分号和重复的“那位王”理清原文较密集的关系从句，同时保留“誓言—约”及“藐视—违背”的平行结构。
