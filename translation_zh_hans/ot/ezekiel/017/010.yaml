source:
  edition: WLC
  text: וְ/הִנֵּ֥ה שְׁתוּלָ֖ה הֲ/תִצְלָ֑ח הֲ/לוֹא֩ כְ/גַ֨עַת בָּ֜/הּ ר֤וּחַ הַ/קָּדִים֙ תִּיבַ֣שׁ יָבֹ֔שׁ עַל עֲרֻגֹ֥ת צִמְחָ֖/הּ תִּיבָֽשׁ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/010.yaml
  text: And look[a], though it is planted[c][b], will it prosper? Will it not completely wither when the east wind touches it? It will wither on the beds where it sprouted.
translation:
  language: zh_hans
  text: 看哪，它虽已栽种，能茂盛吗？东风[b]一吹到它，它岂不彻底枯干[a]？它必在自己生长的田畦[c]中枯干。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彻底枯干”也可译作“必定枯干”或“完全干枯”；希伯来文以同根的绝对不定式配合限定动词，加强语气。
    reason: lexical_alternative
  - marker: b
    text: “东风”指从东方旷野吹来的炎热而具破坏性的风，在圣经中常用来描写使植物枯萎的审判。
    reason: cultural_note
  - marker: c
    text: “田畦”也可译作“苗床”；希伯来文指经过耕作、供植物生长的畦地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意的语篇功能，同时采用现代、庄重而自然的表达。
- source_word: שְׁתוּלָה
  choice: 已栽种
  rationale: 该词是שתל的被动分词，描写葡萄树处于被栽植好的状态；“已栽种”准确体现其完成后的状态。
- source_word: הֲתִצְלָח
  choice: 能茂盛吗
  rationale: צלח可指成功、兴旺；在植物比喻中，“茂盛”自然传达生长兴旺之意，同时保留反问语气。
- source_word: כְגַעַת בָּהּ
  choice: 一吹到它
  rationale: 字面意义是“触及它时”；主语为风，汉语用“吹到”更自然，并表达风一触及便产生后果的时间—因果关系。
- source_word: רוּחַ הַקָּדִים
  choice: 东风
  rationale: 这是希伯来语中来自东方旷野、炎热而具破坏性的风的常用说法；“东风”简洁且保留原有意象。
- source_word: תִּיבַשׁ יָבֹשׁ
  choice: 彻底枯干
  rationale: 限定动词与同根绝对不定式连用，强化动作的确定性和程度；“彻底枯干”既体现强调，也符合植物意象。
- source_word: עַל עֲרֻגֹת צִמְחָהּ
  choice: 在自己生长的田畦中
  rationale: עֲרֻגוֹת指耕作的畦或苗床，צִמְחָהּ指它的生长；译文指出它就在原先生长之处枯干。
- source_word: תִּיבָשׁ
  choice: 必……枯干
  rationale: 末尾再次使用יבש，重申不可避免的结局；“必”在汉语中自然传达这一确定性。
