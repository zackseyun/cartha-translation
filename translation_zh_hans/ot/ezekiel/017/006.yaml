base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/006.yaml
  text: And it sprouted and became a spreading vine[a], low in stature, with its branches turned toward him and its roots beneath him[c][b]. So it became a vine and produced branches and sent out boughs.
translation:
  language: zh_hans
  text: 它就萌芽，成为一株蔓生、低矮的葡萄藤[a]；枝条向着它，根在它下面[c]。它便成了葡萄藤[b]，长出枝条，伸展枝梢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蔓生的”也可译作“繁茂的”或“枝条伸展的”。
    reason: lexical_alternative
  - marker: b
    text: 原文再次说它“成了葡萄藤”；这里保留这一重复，以体现强调和叙事推进。
    reason: lexical_alternative
  - marker: c
    text: 两处“它”所对应的原文都是阳性单数后缀，很可能指本寓言前文的大鹰（参17:3—4）；也有译法较含混地译作“它”。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּצְמַח
  choice: 它就萌芽
  rationale: צמח在此描写所栽之物开始生长；“萌芽”准确而形象地表达初生阶段。
- source_word: וַיְהִי לְגֶפֶן סֹרַחַת
  choice: 长成一棵蔓延的葡萄树
  rationale: “长成”表达结果变化；סֹרַחַת描写向外延伸，用“蔓延”既符合葡萄树形象，也不额外强调繁茂。
- source_word: שִׁפְלַת קוֹמָה
  choice: 矮矮伏地
  rationale: 原文直指形态低矮；结合葡萄藤横向生长的图景，用“矮矮伏地”比生硬的“身量低矮”更自然。
- source_word: לִפְנוֹת דָּלִיּוֹתָיו אֵלָיו
  choice: 它的枝条转向那只鹰
  rationale: ל加不定式可表达目的或结果；译文保留枝条朝向前述大鹰的方向性和依附意味。
- source_word: וְשָׁרָשָׁיו תַּחְתָּיו יִהְיוּ
  choice: 根也在鹰的下面
  rationale: 保留根位于同一阳性单数所指对象之下的空间关系；明确补出“鹰”可避免现代汉语代词歧义。
- source_word: וַתְּהִי לְגֶפֶן
  choice: 它就这样成了一棵葡萄树
  rationale: 保留希伯来文对“成为葡萄树”的重复，以呈现叙事推进和强调；“就这样”使重复在汉语中自然。
- source_word: וַתַּעַשׂ בַּדִּים
  choice: 长出枝子
  rationale: עשה与בַּדִּים搭配表示生出枝条；“长出枝子”是清楚自然的农业表达。
- source_word: וַתְּשַׁלַּח פֹּארוֹת
  choice: 伸展繁枝
  rationale: שׁלח表达向外伸出，פֹּארוֹת指枝梢或繁枝；此译区别于前面的普通“枝子”，也避免误解为仅指嫩芽。
theological_decisions:
- issue: 寓言中两个阳性单数后缀 אֵלָיו / תַּחְתָּיו 的所指
  choice: 在正文中明确译作“那只鹰／鹰”，指向前文的大鹰
  alternative: 用“它”作较含混的无生命指称，或理解为栽种之处
  rationale: 希伯来文后缀为阳性单数，语境中显著的先行词是前文的大鹰。明确译出“鹰”保留寓言中的拟人化及葡萄树对其依附的图景，同时以脚注承认语法与译法上的另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“萌芽、蔓延、伏地、伸展”维持连贯的植物图景；明确代词所指以避免汉语歧义，但用脚注保留原文指称可能存在的张力。所有脚注标记均置于正文相应位置。
