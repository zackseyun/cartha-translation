lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知反复使用的称呼。保留“人子”既传达希伯来语惯用表达，也维持全书的文学呼应；此处并非基督论称号。
- source_word: חוּד חִידָה
  choice: 出个谜语
  rationale: 希伯来语以同根动词和名词构成强调式表达，意为提出谜语或隐晦的话。“出个谜语”是现代汉语自然、清楚的说法。
- source_word: וּמְשֹׁל מָשָׁל
  choice: 讲个比喻
  rationale: 原文再次使用同根动词与名词。下文是展开的象征性叙述，因此译作“讲个比喻”比“说句箴言”更合语境，也避免生硬直译。
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: 向以色列家
  rationale: 介词 אֶל 在此标明话语所指向的对象；“以色列家”保留原文的民族兼圣约群体称谓。
theological_decisions:
- issue: 如何理解以西结所受称呼 בֶּן אָדָם
  choice: 人子
  alternative: 世人；必死的人
  rationale: 这里是上帝对先知的惯常称呼，强调其人的身份，不应自动理解为后来的基督论称号；正文保留传统且贴近原文的“人子”，脚注说明其语义。
- issue: מָשָׁל 的文体范围
  choice: 比喻
  alternative: 箴言；寓言；象征性的话
  rationale: 该词可指箴言、比喻或其他形象性言语；鉴于随后是一段展开的象征叙事，“比喻”最贴合本段，但以脚注保留词义范围。
translation_notes:
  register: 采用现代、庄重而口语自然的普通话。“出个谜语”和“讲个比喻”体现两组希伯来语同根动词—名词结构的力度，同时避免机械重复；“以色列家”保留经文惯用的群体称谓。
