  text: 人子啊[a]，你要向以色列家提出一个谜语，讲一个比喻[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”是《以西结书》中对先知反复使用的称呼，也可译为“凡人”或“必死的人”。
    reason: lexical_alternative
  - marker: b
