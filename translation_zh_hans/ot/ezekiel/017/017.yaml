  text: וְ/לֹא֩ בְ/חַ֨יִל גָּד֜וֹל וּ/בְ/קָהָ֣ל רָ֗ב יַעֲשֶׂ֨ה אוֹת֤/וֹ פַרְעֹה֙ בַּ/מִּלְחָמָ֔ה בִּ/שְׁפֹּ֥ךְ סֹלְלָ֖ה וּ/בִ/בְנ֣וֹת דָּיֵ֑ק לְ/הַכְרִ֖ית נְפָשׁ֥וֹת רַבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/017.yaml
  text: Pharaoh will not act for him in the war with a great army and a large assembly[b][a], when they cast up a siege ramp and build a siege wall to cut off many lives.
translation:
  language: zh_hans
  text: 当筑起攻城坡、建造围城工事[b]，为要夺去许多人的性命时，法老不会带着大军和庞大的队伍，在战争中为他采取行动[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为他采取行动”也可译作“帮助他”。希伯来文直译近似“为他做”，在这里指为他采取有效行动。
    reason: lexical_alternative
  - marker: b
    text: “攻城坡”和“围城工事”也可分别译作“攻城土垒”和“围城墙”或“攻城塔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחַיִל גָּדוֹל
  choice: 带着大军
  rationale: חַיִל在军事语境中指军力、军队；“大军”简明自然，并保留具体的军事含义。
- source_word: וּבְקָהָל רָב
  choice: 和庞大的队伍
  rationale: קָהָל本指聚集起来的群体；在军事语境中译作“庞大的队伍”，既避免误解为宗教性“会众”，也不把它过度限定为另一支军队。
- source_word: יַעֲשֶׂה אוֹתוֹ
  choice: 为他采取行动
  rationale: 这里的עשה加代词宾语用法简约而有歧义，语境指法老为他采取有效行动；此译法比单纯“帮助他”更能保留原动词的宽泛含义。
- source_word: בַּמִּלְחָמָה
  choice: 在战争中
  rationale: 保留定冠词所指的具体战争语境，同时符合现代汉语表达。
- source_word: בִּשְׁפֹּךְ סֹלְלָה
  choice: 当攻城坡筑起
  rationale: שׁפך字面为“倾倒”，与סֹלְלָה连用时指堆土筑起攻城坡；采用被动表达可保留希伯来文在此未明说实施者的特点。
- source_word: וּבִבְנוֹת דָּיֵק
  choice: 围城工事建成
  rationale: דָּיֵק可指围城墙、攻城塔或其他围城设施；“围城工事”自然且不过度限定其具体形制。
- source_word: לְהַכְרִית נְפָשׁוֹת רַבּוֹת
  choice: 要夺去许多人的性命
  rationale: הכרית意为“剪除、断绝”，נְפָשׁוֹת在此指人的生命；“夺去……性命”保留其严厉意味，又符合现代汉语习惯。
theological_decisions:
- issue: 围城工事的实施者
  choice: 采用“攻城坡筑起、围城工事建成”的无施事被动表达
  alternative: 明确译为“敌人筑起攻城坡、建造围城工事”
  rationale: 上下文可推知实施者，但本节希伯来文的两个不定式结构并未直接点明主语；不补出“敌人”可避免替原文消除句法上的含混。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。将时间状语前置，使长句关系清楚；对围城行动使用无施事被动句，以保留原文未明说行动者的特点。脚注标记按正文出现顺序设置为[b]、[a]，分别紧随相关词语。
