  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: וַיְהִי在此引出新的先知话语段落，并与后面的“耶和华的话”共同构成惯用公式。汉语以“耶和华的话临到”自然表达事件的发生和叙事推进，不必生硬译作“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: דָּבָר在先知书的固定表达中指来自上帝的话语或信息；译作“话”既保留启示性用语，也符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是以色列上帝的专名四字神名。采用现代中文读者熟悉的专名形式“耶和华”，而不以“主”这一称号代替。
- source_word: אֵלַי
  choice: 临到我
  rationale: אֵלַי字面为“向我／到我这里”；与“耶和华的话”搭配时，汉语惯用“临到我”，准确表达先知领受神谕。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文的直接话语。译作“说”简洁自然，并保留原文的引语引入功能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文保留其专名性质。现代简体中文圣经传统中“耶和华”辨识度最高；“雅威”更接近常见学术拟音，但两者都建立在对古代读音的重构上。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留先知书惯用公式“耶和华的话临到我，说”。本节无需脚注；原文וַיְהִי的叙事功能已由整句结构自然体现。
