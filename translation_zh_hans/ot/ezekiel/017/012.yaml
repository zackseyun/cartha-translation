review_pass:
  verdict: revise
  source_fidelity: “把他们带到巴比伦自己那里”在现代汉语中搭配不成立，且“自己”容易产生不必要的反身歧义。原文表达巴比伦王将耶路撒冷的王和首领带往巴比伦、归到自己管辖之下。另，“掳走”虽符合历史背景，但比לקח（“取、带走”）更具体；本节宜保留较宽的“带走”。
  naturalness: 其余译文庄重、清楚，适合现代标准汉语经文语体。“悖逆之家”“看哪”均可保留。修订后以“带到巴比伦王那里去”自然表达目的地与归属对象。
  terminology: “悖逆之家”忠实保留以西结书反复使用的集体称谓；“首领”适切涵盖שָׂרִים的政治领导者含义，未不当限定为王子或官员。
  issues:
  - severity: high
    issue: “把他们带到巴比伦自己那里”不合现代汉语语法和搭配。
    rationale: “巴比伦”是地点名词，不能自然地由“自己那里”修饰；原文的“到他那里，往巴比伦”须在中文中整合为巴比伦王所居、所掌控的目的地。
  - severity: low
    issue: “掳走了”较原文动词具体。
    rationale: לקח本身是宽泛的“取、带走”；强制迁徙由上下文可知，但不必由此动词额外明说。
