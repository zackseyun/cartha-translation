base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/012.yaml
  text: Say now to the rebellious house[a], ‘Do you not know what these things mean?’ Say, ‘Behold[c][b], the king of Babylon came to Jerusalem and took its king and its officials and brought them to him in Babylon.’
translation:
  language: zh_hans
  text: 你要对这悖逆之家说：“你们不知道这些事是什么意思吗？”你要说：“看哪，巴比伦王来到耶路撒冷，带走了耶路撒冷的王和首领，把他们带到巴比伦王那里去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵית הַמֶּרִי
  choice: 悖逆之家
  rationale: 保留以“家”指称群体的集体隐喻，也延续《以西结书》中这一反复出现的称呼；“悖逆”自然表达该属格结构所描述的群体特征。
- source_word: הֲלֹא יְדַעְתֶּם מָה אֵלֶּה
  choice: 你们不知道这些事是什么意思吗
  rationale: ידע在此语境中涉及领会前文寓言；“是什么意思”把希伯来语简略问句在语境中隐含的意义自然表达出来，同时保留反问语气。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为引人注意的叙述标记，“看哪”既保留指示和强调作用，也符合庄重的现代中文经文语体。
- source_word: בָּא
  choice: 来到
  rationale: 希伯来语完成式在寓言解释中叙述已经发生的行动；“来到”自然呈现其移动及叙事视角。
- source_word: וַיִּקַּח
  choice: 掳走了
  rationale: לקח本义较宽，可译“取走”；在君王和首领被押往巴比伦的历史语境中，“掳走”清楚表达强制带走，但不额外加入处决或囚禁等细节。
- source_word: מַלְכָּהּ
  choice: 其中的王
  rationale: 阴性后缀所指为耶路撒冷；中文用“其中的王”比“它的王”自然，并明确这是该城的王。
- source_word: שָׂרֶיהָ
  choice: 首领
  rationale: שׂרים可指诸侯、官长或统治阶层；“首领”保留其较宽泛的政治领导含义，不限定为王室子弟或特定官职。
- source_word: וַיְבֵא אוֹתָם אֵלָיו
  choice: 把他们带到……自己那里
  rationale: אֵלָיו直译为“到他那里”，所指为巴比伦王；中文以“自己那里”清楚回指主语，并保留人员被带到其掌控之下的表达。
- source_word: בָּבֶלָה
  choice: 到巴比伦
  rationale: 词尾方向式明确表示朝向巴比伦；中文直接译作“到巴比伦”，比改作静态处所更贴近原文运动方向。
