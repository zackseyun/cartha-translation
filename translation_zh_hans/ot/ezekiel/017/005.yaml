base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/005.yaml
  text: Then he took some of the seed of the land and planted it in fertile soil[a]; he placed it beside abundant waters, like a willow.
translation:
  language: zh_hans
  text: 他又从那地取了些种子，把它播在适于播种的田地里；他把它安置在水源充足之处，像栽种柳树那样[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“杨树”；希伯来语所指的植物不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הָאָרֶץ
  choice: 从本地取了一粒种子
  rationale: 保留 מִן 的部分义和全节的种植意象；“本地”自然表达“那地的”，而“一粒种子”符合现代汉语表达。
- source_word: וַיִּתְּנֵהוּ
  choice: 栽
  rationale: נתן 本义为“放置”，但在种子、田地和水源的农业语境中，“栽”自然传达其语境功能，同时不改变比喻画面。
- source_word: בִּשְׂדֵה זָרַע
  choice: 在适宜播种的田里
  rationale: 较贴近字面“播种之田”，又以现代汉语清楚表达这是一块适合播种的田地，避免把原文未明说的土壤肥力表达得过强。
- source_word: קָח עַל מַיִם רַבִּים
  choice: 安置在丰沛的水边
  rationale: 此处希伯来文罕见且句法困难；结合放置和灌溉意象，以“安置在丰沛的水边”表达位于充足水源旁的意思，而不把 קָח 单独译成不自然的命令式。
- source_word: צַפְצָפָה
  choice: 柳树
  rationale: 该植物名称不确定；柳树与水边环境相合，也是常见释义，同时在脚注保留“杨树”的可能。
- source_word: שָׂמוֹ
  choice: 把它安置……像一棵
  rationale: שׂים 表示“放置、安置”；汉语中将其与前面的水边位置连贯表达，并保留末尾植物比拟，而不强行消除原文句法上的困难。
