  text: וְ/הִקְרַבְתָּ֖/ם לִ/פְנֵ֣י יְהוָ֑ה וְ/הִשְׁלִ֨יכוּ הַ/כֹּהֲנִ֤ים עֲלֵי/הֶם֙ מֶ֔לַח וְ/הֶעֱל֥וּ אוֹתָ֛/ם עֹלָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/024.yaml
  text: You shall present them before Yahweh[a], and the priests shall throw salt on them and offer them up as a burnt offering to Yahweh.
translation:
  language: zh_hans
  text: 你要把它们带到雅威面前；祭司要把盐撒在它们身上[a]，然后把它们作为燔祭献给雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把盐投在它们身上”。希伯来文动词本义是“投、扔”，并非专指礼仪性的“洒”。
    reason: 保留原动词的字面力度及译法上的可能性。
lexical_decisions:
- source_word: וְהִקְרַבְתָּם
  choice: 你要把它们呈到
  rationale: קרב 的使役式表示“使靠近、带到面前、呈上”。“呈到”保留带到神面前的动作，也避免与后面的正式献祭动作混同。
- source_word: לִפְנֵי יְהוָה
  choice: 雅威面前
  rationale: לִפְנֵי 表示“在……面前、在……临在中”；此处采用简洁自然的祭祀语境表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: וְהִשְׁלִיכוּ
  choice: 撒
  rationale: שלך 的基本意思是“投、扔”。汉语在盐与祭牲的搭配中用“撒在……身上”最自然；脚注说明原文用词比“洒”更具投放意味，避免把动作过度限定为礼仪性的喷洒。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 符合圣殿献祭语境中的标准现代汉语称谓。
- source_word: עֲלֵיהֶם מֶלַח
  choice: 把盐撒在它们身上
  rationale: עַל 表明盐被施加在这些祭牲之上；“身上”在现代汉语中明确、自然。
- source_word: וְהֶעֱלוּ אֹתָם
  choice: 然后把它们献给
  rationale: עלה 的使役式在献祭语境中指“献上”，其字面意象是使祭物上升。“献给”自然表达祭献方向；“然后”清楚呈现连续动作。
- source_word: עֹלָה
  choice: 作燔祭
  rationale: עֹלָה 是整只焚烧献上的祭物之专门术语，中文传统且准确地译作“燔祭”。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词 לְ 表示献祭所指向或归属的对象；“献给雅威”符合现代汉语习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，也不把它改换为“主”这一称号。
- issue: וְהִשְׁלִיכוּ 所描述的施盐动作
  choice: 正文译“撒”，脚注保留“投、扔”的字面力度
  alternative: 投在；洒在
  rationale: 原动词通常指投掷，并非专门的礼仪术语；但现代汉语说“撒盐”最自然。正文与脚注结合，既通顺，也不把原文窄化为特定的喷洒动作。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“呈到……面前”与“献给……作燔祭”区分了带近祭牲和正式献上的两个动作；代词复数“它们”承接上下文中的祭牲。
