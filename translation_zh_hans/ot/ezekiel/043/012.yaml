id: EZK.43.12
reference: Ezekiel 43:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זֹ֖את תּוֹרַ֣ת הַ/בָּ֑יִת עַל רֹ֣אשׁ הָ֠/הָר כָּל גְּבֻל֞/וֹ סָבִ֤יב סָבִיב֙ קֹ֣דֶשׁ קָדָשִׁ֔ים הִנֵּה זֹ֖את תּוֹרַ֥ת הַ/בָּֽיִת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/012.yaml
  text: 'This is the law of the house: on the top of the mountain[a], all its surrounding territory is most holy. Behold[b], this is the law of the house.'
translation:
  language: zh_hans
  text: 这是殿的法则：在山顶上，其四围的整个范围[a]都是至圣的[b]。看哪，这就是殿的法则。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“其四围所有的边界。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“圣中之圣”，即“至圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת הַבָּיִת
  choice: 殿的法则
  rationale: תּוֹרָה可指律法、训诲或规范；此处概括圣殿及其范围所遵循的原则，译作“法则”自然且庄重。“殿”按上下文明确指圣殿，同时保留בַּיִת“房屋、殿宇”的基本意象。
- source_word: עַל רֹאשׁ הָהָר
  choice: 在山顶上
  rationale: רֹאשׁ字面为“头”，用于地形时指顶部或峰顶；“在山顶上”符合现代汉语表达。
- source_word: כָּל גְּבֻלוֹ סָבִיב סָבִיב
  choice: 其四围的整个范围
  rationale: גְּבוּל既可指边界，也可指边界以内的地域；这里所说的是山顶圣殿周围全部被分别为圣的区域，故正文采用“整个范围”。重复的סָבִיב强调周围各处，以“四围”体现。代词“其”保留希伯来文所指对象在表达上的一定含混。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 这是希伯来语以“圣中之圣”表达最高程度的结构；本句描述整个范围的神圣性质，并非专指名为“至圣所”的内室，因此译为形容词“至圣的”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 该词用于郑重提示并引人注意；“看哪”保留其庄严的强调作用。
- source_word: זֹאת ... זֹאת
  choice: 这是……这就是
  rationale: 保留首尾重复的指示语及其框架作用，后一句用“就是”自然地加强总结语气。
theological_decisions:
- issue: “至圣”所修饰的对象
  choice: 理解为山顶上四围的整个范围都是至圣的
  alternative: 把“圣中之圣”理解为对圣殿内至圣所的专名
  rationale: 句法上קֹדֶשׁ קָדָשִׁים是对前述整个周围范围的断定；译文因此不把它缩限为殿内某一房间。
- issue: 第三人称单数后缀“其”的指向
  choice: 正文保留“其”，不明确限定为山或殿
  alternative: 明确译为“殿四围”或“山四围”
  rationale: 希伯来文后缀在语法上可承接邻近的“山”，也可按全句主题关联“殿”；保留代词可避免过度消解原文含混。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“殿的法则”避免过于口语化，也不将תּוֹרָה狭义化为成文法规；“看哪”保留先知文学中的郑重提示语气。
