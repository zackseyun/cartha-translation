  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וַ/תְּבִיאֵ֕/נִי אֶל הֶֽ/חָצֵ֖ר הַ/פְּנִימִ֑י וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/005.yaml
  text: Then the Spirit lifted me up and brought me into the inner court[a], and behold[b], the glory of Yahweh filled the house.
translation:
  language: zh_hans
  text: 于是，灵[a]把我举起，带我进入内院。看哪，雅威的荣耀充满了殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译为“风”或“一个灵”；希伯来语 רוּחַ 可有这些含义，但在以西结的异象语境中，很可能指神的灵。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“房屋”，这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂאֵנִי
  choice: 把我举起
  rationale: נשׂא在此以“灵”为主语，描写异象中的抬升和运送；“把我举起”既保留向上的动作，也符合现代汉语表达。
- source_word: רוּחַ
  choice: 灵
  rationale: רוּחַ可指风、气息或灵；以西结异象中反复出现超自然运送的语境，使“灵”最为合适，但不在正文中额外加入原文没有的定冠限定。
- source_word: וַתְּבִיאֵנִי
  choice: 带我进入
  rationale: בוא的使役式表示“使进入、带入”；“带我进入”自然地表达了进入内院的方向和结果。
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: 内院
  rationale: חָצֵר在圣殿建筑语境中指院落；“内院”简洁、准确，并符合常用的圣殿建筑称谓。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה用于唤起注意，突出先知突然看见的景象；“看哪”保留庄重的先知文体和现场感。
- source_word: מָלֵא
  choice: 充满了
  rationale: 该形式在句中表达充满的状态；按希伯来语语序，荣耀在前、殿在后，“雅威的荣耀充满了殿”是自然且忠实的汉语表达。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: כָּבוֹד在此指上帝彰显的威荣与临在；属格结构译为“雅威的荣耀”，保留以西结书的重要神学用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其专名性质，不以称号替代。
- source_word: הַבָּיִת
  choice: 殿
  rationale: בַּיִת字面为“房屋”，但在本段圣殿异象的明确建筑语境中指圣殿主体；汉语“殿”既自然又能准确指明所指。
theological_decisions:
- issue: 以西结异象运送场景中רוּחַ的所指
  choice: 正文译作“灵”
  alternative: “风”或“一位灵”
  rationale: 该词本身具有多义性；上下文较可能指施行异象运送的神圣之灵。正文采用最符合语境的“灵”，脚注保留“风”或“一位灵”的可能性，避免消除原文张力。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华或“主”
  rationale: 原文使用四字神名；音译为“雅威”能保留其作为以色列之上帝专名的性质，而非改用称号。
- issue: הַבָּיִת在圣殿异象中的所指
  choice: 正文译作“殿”
  alternative: “房屋”
  rationale: 字面义为“房屋”，但语境明确指圣殿建筑。采用“殿”使现代读者立即明白所指，同时以脚注说明原文的字面表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是”承接前文叙事，“看哪”保留先知异象的突现感；句式简洁，避免生硬仿古。
