lexical_decisions:
- source_word: הָאֲרִיאֵל
  choice: 祭坛炉台
  rationale: 在以西结圣殿异象的建筑语境中，该词指祭坛顶部焚烧祭物的平台；“祭坛炉台”既表达其礼仪用途，也避免音译造成晦涩。
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: 十二
  rationale: 按其普通基数词义翻译。
- source_word: אֹרֶךְ
  choice: 长
  rationale: 采用现代汉语尺寸表达，与后面的“宽”平行。
- source_word: בִּשְׁתֵּים עֶשְׂרֵה רֹחַב
  choice: 宽十二肘
  rationale: 介词ב引出相应的宽度；译成自然的汉语尺寸句式。
- source_word: רָבוּעַ
  choice: 呈正方形
  rationale: 该词描述炉台的平面形状；“呈正方形”清楚而自然。
- source_word: אֶל אַרְבַּעַת רְבָעָיו
  choice: 四面
  rationale: 原文直译近于“向着它的四个方位”，在建筑语境中可指四面，也可能理解为四角；正文采用较贴近原表达且自然的“四面”，并以脚注保留另一可能。
- source_word: 肘（原文据上下文省略）
  choice: 肘
  rationale: 本节希伯来文没有重复计量单位，但上下文正在列举祭坛各部分以肘为单位的尺寸；为使汉语尺寸表达完整而补出。
