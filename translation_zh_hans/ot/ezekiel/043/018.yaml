  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֵ֚לֶּה חֻקּ֣וֹת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הֵעָֽשׂוֹת֑/וֹ לְ/הַעֲל֤וֹת עָלָי/ו֙ עוֹלָ֔ה וְ/לִ/זְרֹ֥ק עָלָ֖י/ו דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/018.yaml
  text: 'And he said to me[a], “Son of man, thus says the Lord GOD: These are the statutes of the altar on the day it is made[c][b], for offering burnt offerings on it and for sprinkling blood on it.”'
translation:
  language: zh_hans
  text: 他对我说：“人子啊，主耶和华如此说：以下是祭坛建成之日[a]的条例：为要在坛上献燔祭[b]，并把血泼[c]在坛上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“它被造之日”；也可理解为“祭坛建成时”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为单数，也可按集合意义理解为多次或多份燔祭。
    reason: lexical_alternative
  - marker: c
    text: 或译“洒”；原文动词可指比中文“洒”所暗示的动作更为有力地把血施在祭坛上。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；保留这一固定意象及其反复出现的文学作用。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי译作“主”，יהוה以现代中文圣经读者熟悉的音译“耶和华”表达，从而保留双重神圣称号而不造成“主主”的重复。
- source_word: חֻקּוֹת הַמִּזְבֵּחַ
  choice: 祭坛的条例
  rationale: חֻקּוֹת指规定、定例或条例；在祭祀规程的语境中，“条例”庄重、清楚且自然。
- source_word: בְּיוֹם הֵעָשׂוֹתוֹ
  choice: 祭坛建成之日
  rationale: 原文直译为“它被造之日”；中文以“建成之日”自然表达祭坛造好的时间，同时保留“日”的字面时间意味。
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה
  choice: 要在坛上献燔祭
  rationale: עלה的使役形在献祭语境中表示献上祭物；עוֹלָה是全烧于坛上的祭，传统而准确地译为“燔祭”。
- source_word: וְלִזְרֹק עָלָיו דָּם
  choice: 把血洒在坛上
  rationale: זרק在礼仪语境中指将血施于祭坛；“洒”是自然且为读者熟悉的表达，脚注保留其动作可能较为有力的语义。
- source_word: עָלָיו
  choice: 在坛上
  rationale: 明确重复所指的祭坛，避免连续使用代词在中文中产生歧义。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时包含“主”和四字神名。正文采用现代中文圣经传统中广为人知的“耶和华”，既保留专名性质，也使普通读者易于识别；“雅威”是按较常见学术重构发音所作的另一种音译。
- issue: עוֹלָה的单复数理解
  choice: 燔祭（可作集合性用语）
  alternative: 一只燔祭牲
  rationale: 希伯来文为单数，但在一般祭祀条例中可作类别或集合性表达；中文“献燔祭”本身不必明定一次只献一只，因而保留原文的数目弹性。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。“它的条例如下”使希伯来文指示句在中文中衔接自然；两次עָלָיו均明确译作“在坛上”，以保持指称清晰。所有脚注标记均紧随对应词句。
