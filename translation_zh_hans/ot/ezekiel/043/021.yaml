base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/021.yaml
  text: Then you shall take the bull of the sin offering and burn it in the appointed place of the house[b][a], outside the sanctuary.
translation:
  language: zh_hans
  text: 你要取那头赎罪祭的公牛[a]，把它在指定给殿宇的地方[b]，就是圣所外面，焚烧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”或译“洁净祭”。原文也可较直地译为“作赎罪祭的公牛”。
    reason: lexical_alternative
  - marker: b
    text: “殿宇”原文作“房屋”，这里指圣殿或圣殿建筑群。“指定给殿宇的地方”也可译为“殿宇指定的地方”。
    reason: lexical_alternative
  - marker: c
    text: 原文在此转为第三人称，直译为“他要把它焚烧”。这可能指另一个执行者，也可能是礼仪指示中的人称转换；正文按连续指示译出。
    reason: source_ambiguity
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要……带走
  rationale: 该形式在连续礼仪指示中带有命令意味；“你要”保留第二人称指令语气，“带走”也自然衔接随后在圣所外焚烧的动作。
- source_word: הַפָּר הַחַטָּאת
  choice: 那头作赎罪祭的公牛
  rationale: פַּר译为“公牛”；חַטָּאת在祭祀语境中指祭物，采用现代中文圣经读者较熟悉的“赎罪祭”，同时以脚注保留“洁净祭”的词义可能。
- source_word: וּשְׂרָפוֹ
  choice: 焚烧
  rationale: 希伯来文此处形式为第三人称阳性单数并带第三人称宾语后缀，直译近似“他要把它烧掉”；但处于对“你”的连续礼仪指示中，正文按程序语气自然承接为“焚烧”，不另行引入身份不明的新主语。
- source_word: בְּמִפְקַד הַבַּיִת
  choice: 在殿宇指定的地方
  rationale: מִפְקָד在此表示指定、划定之处；הַבַּיִת字面为“这房屋”，在异象语境中指圣殿建筑或殿区。“殿宇”既保留“房屋”的意象，又避免现代读者误解为普通住宅。
- source_word: מִחוּץ לַמִּקְדָּשׁ
  choice: 在圣所外面
  rationale: מִחוּץ明确表示“在……外面”，מִקְדָּשׁ指神圣之所或圣所；该译法清楚保留空间与礼仪上的界限。
theological_decisions:
- issue: 祭祀术语 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 此处该词与公牛构成祭物名称。“赎罪祭”是清楚且通行的译名；“洁净祭”也能体现该祭在祭司礼仪中的净化功能，故列入脚注，不在正文中排除这一词义层面。
- issue: וּשְׂרָפוֹ 的人称转换
  choice: 按连续指示译为“焚烧”
  alternative: 按语法形式译为“他要把它焚烧”
  rationale: 原文从第二人称“你要带走”转为第三人称“他要焚烧它”，可能暗示实际执行焚烧者另有其人，也可能是礼仪指示中的人称波动。正文采用自然的连续指示，脚注保存原文的人称变化，避免完全抹去其歧义。
- issue: הַבַּיִת 在圣殿异象中的指称范围
  choice: 殿宇
  alternative: 殿；圣殿建筑群
  rationale: “殿宇”贴近字面的“房屋”并在中文中自然指向圣殿，但原词在本段可能涵盖圣殿建筑或整个殿区，不宜将范围过度限定。
translation_notes:
  register: 采用庄重而现代的礼仪叙述。“殿宇”比直译“房屋”清楚，又比直接扩译“圣殿建筑群”少作范围判断；“就是在圣所外面”将末尾方位语自然解释为对指定地点的补充说明。
