source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶל הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֡ם אֲשֶׁ֣ר הֵם֩ מִ/זֶּ֨רַע צָד֜וֹק הַ/קְּרֹבִ֣ים אֵלַ֗/י נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה לְ/שָֽׁרְתֵ֑/נִי פַּ֥ר בֶּן בָּקָ֖ר לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/019.yaml
  text: And you shall give to the Levitical priests who are from the offspring of Zadok[a], who draw near to me to minister to me, declares the Lord GOD, a bull from the herd for a sin offering.
translation:
  language: zh_hans
  text: 你要把一头公牛[a]交给利未支派的祭司，就是撒督的后裔、亲近我并侍奉我的人——这是主耶和华的宣告——作为赎罪祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一头公牛，牛群之子”；也可译为“一头小公牛”或“一头牛群中的公牛”。
    reason: 保留 פַּר בֶּן־בָּקָר 的说明性表达及其关于年龄的非确定性，避免正文过度具体化。
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 你要……交给
  rationale: 连接词加完成式在这一礼仪指示中具有命令或将来指令的语气；中文用“要”自然表达其指令性。
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: 利未支派的祭司
  rationale: 既保留“祭司”和“利未”两个成分，也避免让读者误以为这里泛指所有利未人。
- source_word: אֲשֶׁר הֵם מִזֶּרַע צָדוֹק
  choice: 就是撒督的后裔
  rationale: מִזֶּרַע 表示出自某人的后代；“后裔”在现代中文中准确且庄重。
- source_word: הַקְּרֹבִים אֵלַי
  choice: 他们亲近我
  rationale: 保留 קרב 的接近意象及其祭司礼仪语境，不将其弱化为一般性的“来到”。
- source_word: לְשָׁרְתֵנִי
  choice: 侍奉我
  rationale: שׁרת 在祭司语境中指正式的礼仪服侍；“侍奉”兼顾宗教语义与现代可读性。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 是先知性宣告公式；“主耶和华”区分 אֲדֹנָי 与神名 יהוה，并符合通行现代中文圣经表达。
- source_word: פַּר בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: 该固定表达字面为“公牛，牛群之子”，实际指牛群中的幼公牛；“公牛犊”简洁保留其性别和幼龄含义。
- source_word: לְחַטָּאת
  choice: 作为赎罪祭
  rationale: 在献祭规程中 חַטָּאת 指祭物类别，即赎罪祭，而非抽象的罪。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时有尊称 אֲדֹנָי 和四字神名 יהוה。正文采用现代中文圣经读者熟悉的“主耶和华”，既避免重复作“主主”，也保留专名功能；“雅威”是依据可能发音的另一译法，但会显著改变既有中文宗教语域。
- issue: הַקְּרֹבִים אֵלַי 的祭司性含义
  choice: 亲近我
  alternative: 来到我面前
  rationale: “亲近我”保留原文可能同时具有空间接近和礼仪进前的双重意味，不把它完全解释成单一的仪式术语。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。破折号标出插入的神谕公式，使“作为赎罪祭”清楚承接“交给一头公牛犊”，同时不改变希伯来文各成分的关系。
