review_pass:
  verdict: revise
  source_fidelity: The directive, Zadokite/Levitical priestly identification, cultic approach and service, and sin-offering sense are substantially represented. However, “公牛犊” is not natural Modern Standard Mandarin and prematurely fixes the nuanced appositional Hebrew פַּר בֶּן־בָּקָר as a calf; the main text can use the clear generic “公牛,” with the more literal/age-related nuance retained in a footnote.
  naturalness: “利未支派的祭司” is clear, but the relative clauses read more naturally when integrated directly with their antecedent rather than resumed after a semicolon with “他们.” “公牛犊” is also awkward and semantically over-specific in contemporary Chinese.
  terminology: “赎罪祭,” “亲近我,” “侍奉我,” “撒督,” and “主耶和华” are suitable established Chinese biblical terminology. “利未支派的祭司” appropriately avoids equating the priests here with all Levites.
  issues:
  - severity: medium
    issue: “公牛犊”将 פַּר בֶּן־בָּקָר 过度具体化，且中文搭配不自然。
    rationale: 该希伯来语表达包含“公牛”和“牛群之子”的并列/说明性成分，可指牛群中的公牛或年轻公牛；“公牛犊”明确指雄性小牛，较原文更窄。正文宜用“公牛”，并以脚注保留字面表达及“小公牛”这一可能译法。
  - severity: low
    issue: “就是撒督的后裔；他们亲近我，侍奉我”中分号后的“他们”使限定性关系从句略显松散。
    rationale: 原文的“亲近我、侍奉我”继续限定这些祭司。将各限定成分并列置于“祭司”之后，能更清晰地反映句法关系，也更合现代中文。
  revised_text: 你要把一头公牛[a]交给利未支派的祭司，就是撒督的后裔、亲近我并侍奉我的人——这是主耶和华的宣告——作为赎罪祭。
