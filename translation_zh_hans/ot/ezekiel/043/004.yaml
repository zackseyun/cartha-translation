  yaml_path: translation/ot/ezekiel/043/004.yaml
  text: And the glory of Yahweh came into the house by way of the gate that faces east[a][b].
translation:
  language: zh_hans
  text: 耶和华的荣耀从朝东的门进入那殿[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“那房屋”；在这个异象中，所指的是圣殿建筑。
    reason: lexical_alternative
  - marker: b
    text: 或译：“经由那座朝东的门进入那殿。”
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְב֥וֹד
  choice: 耶和华的荣耀
  rationale: כָּבוֹד在这里指上帝显现的荣耀与临在，不只是抽象的“尊荣”。前缀连词וּ承接上下文；现代汉语中无需另加“并且”，句意仍然连贯。
- source_word: יְהוָ֖ה
  choice: 耶和华
  rationale: 以现代汉语圣经传统中通行、可辨识的专名“耶和华”表达四字神名，保留其作为上帝之名的性质。
- source_word: בָּ֣א אֶל הַ/בָּ֑יִת
  choice: 进入那殿
  rationale: בוא与אֶל在这里表示朝向并进入建筑物。בַּיִת字面是“房屋”，但在本异象的建筑语境中明确指圣殿主体，因此正文译作“殿”，并以脚注保留字面信息。
- source_word: דֶּ֣רֶךְ שַׁ֔עַר
  choice: 从……门
  rationale: דֶּרֶךְ表示所经过的路径。汉语用“从……门进入”自然地表达经由该门的路线；“经由”作为更贴近形式的译法列入脚注。
- source_word: אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֥רֶךְ הַ/קָּדִֽים
  choice: 朝东的
  rationale: 原文以“其正面朝向东方”的习语说明门的朝向；“朝东的”简洁、准确，也符合现代汉语建筑描述。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文读者最熟悉的专名“耶和华”，而不以“主”代替，从而保留经文使用立约神名这一点；“雅威”是较贴近学界重构发音的另一种音译。
- issue: “荣耀”的所指
  choice: 保留“荣耀”，让语境表明这是耶和华显现的荣耀与临在
  alternative: 耶和华荣耀的显现／耶和华的临在
  rationale: 原文只用כָּבוֹד，并未另加“显现”或“临在”。保留“荣耀”既延续本段的关键用语，也避免把其丰富的神学含义收窄为单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“进入那殿”清楚表达运动方向；“从朝东的门”符合普通读者的日常表达，同时由脚注提供更贴近原文结构的“经由”译法。
