source:
  edition: WLC
  text: וְ/אִֽם נִכְלְמ֞וּ מִ/כֹּ֣ל אֲשֶׁר עָשׂ֗וּ צוּרַ֣ת הַ/בַּ֡יִת וּ/תְכוּנָת֡/וֹ וּ/מוֹצָאָ֡י/ו וּ/מוֹבָאָ֣י/ו וְֽ/כָל צֽוּרֹתָ֡/ו וְ/אֵ֣ת כָּל חֻקֹּתָי/ו֩ וְ/כָל צורת/י וְ/כָל תורת/ו הוֹדַ֣ע אוֹתָ֔/ם וּ/כְתֹ֖ב לְ/עֵֽינֵי/הֶ֑ם וְ/יִשְׁמְר֞וּ אֶת כָּל צוּרָת֛/וֹ וְ/אֶת כָּל חֻקֹּתָ֖י/ו וְ/עָשׂ֥וּ אוֹתָֽ/ם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/011.yaml
  text: And if they are ashamed of all that they have done[a], make known to them the design of the house, its arrangement, its exits, its entrances, all its forms, all its statutes, and all its laws; and write it before their eyes[b], so that they may keep its whole design and all its statutes and do them.
translation:
  language: zh_hans
  text: 他们若因自己所做的一切感到惭愧，你就要把这殿的形制、布局、出口、入口、各种形态、所有条例、整个形制[a]和所有法则[b]告诉他们；并要当着他们的面写下这些，好使他们谨守这殿全部的形制和所有条例，并照着实行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“所有条例”之后再次使用与“形制”相关的词；此处为单数，直译可作“其全部的形制”或“其整体样式”。
    reason: lexical_alternative
  - marker: b
    text: “法则”也可译作“训诲”或“指示”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְלְמוּ
  choice: 惭愧
  rationale: 此处尼法勒词形表示人因先前所行之事感到羞愧；“惭愧”自然表达内在羞耻与悔悟的反应，同时不额外加入“悔改”等解释。
- source_word: צוּרַת הַבַּיִת
  choice: 殿的形制
  rationale: צוּרָה在圣殿异象中指建筑的形态、样式或构造；“形制”兼顾外形与整体设计，也与后文的规范性内容有所区别。
- source_word: תְכוּנָתוֹ
  choice: 布局
  rationale: 此词指经过度量、安排而形成的构造或配置；在建筑语境中译为“布局”清楚自然。
- source_word: מוֹצָאָיו / מוֹבָאָיו
  choice: 出口、入口
  rationale: 二词在建筑语境中彼此对应，分别表示出去和进入之处。
- source_word: כָל צוּרֹתָיו
  choice: 各种样式
  rationale: 保留צוּרָה词族所强调的建筑形态与模式；复数译作“各种样式”，并保留马所拉文本中的重复。
- source_word: חֻקֹּתָיו
  choice: 各项条例
  rationale: חֻקָּה表示规定、条例或定例；“条例”保留其规范和约束力。
- source_word: תּוֹרֹתָיו
  choice: 各项法则
  rationale: תּוֹרָה可指训诲、指示或律法；在与“条例”并列的语境中，“法则”既体现规范性，也不局限于现代成文法律。
- source_word: הוֹדַע אוֹתָם
  choice: 告诉他们
  rationale: 使役形表达“使他们知道”；现代汉语用“告诉他们”自然明确。
- source_word: וּכְתֹב לְעֵינֵיהֶם
  choice: 当着他们的面写下来
  rationale: 保留“在他们眼前”的公开、可见意味，同时采用自然现代汉语。
- source_word: וְיִשְׁמְרוּ ... וְעָשׂוּ אוֹתָם
  choice: 谨守……照着实行
  rationale: שׁמר表示谨慎遵守，עשׂה表示付诸实行；这一表达保留“守”与“行”的递进关系，并使复数所指在汉语中清楚自然。
theological_decisions:
- issue: 圣殿描述究竟是具体建筑蓝图，还是具有更广泛意义的异象模式
  choice: 采用“形制、布局、出口、入口”等建筑用语，同时保留“条例、法则”等规范性用语。
  alternative: 把全部词语统一处理成纯粹的建筑图样，或统一解释为象征性的敬拜规范。
  rationale: 原文有意并列建筑与规范词汇；译文保留二者之间的张力，不预先裁定异象如何应验。
- issue: 马所拉文本重复“各种样式”
  choice: 在正文中保留两次“各种样式”，并以脚注说明文本现象。
  alternative: 依部分古译本和现代译法省略第二次，或为流畅而合并两处。
  rationale: 所给WLC原文明确含有重复。虽有抄写重复的可能，也可能是修辞性强调；正文不应未经说明便删去。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“殿”承接本段圣殿语境；“形制”比“设计”更能涵盖形态与制度化构造。“当着他们的面写下来”保留原文的可见和公开意味。正文有意保留WLC中的重复，并用脚注交代相关文本差异。
