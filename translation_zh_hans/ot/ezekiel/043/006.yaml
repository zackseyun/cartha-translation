  yaml_path: translation/ot/ezekiel/043/006.yaml
  text: Then I heard one speaking to me from the house[b][a], while a man was standing beside me.
translation:
  language: zh_hans
  text: 于是，我听见有人从殿中对我说话[a][b]，同时有一个人站在我身旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我听见从殿中有声音对我说话”。希伯来文没有明确出现“声音”一词，也没有在本节指明说话者是谁。
    reason: lexical_alternative
  - marker: b
    text: 这里的“殿”指以西结异象中的圣殿建筑；希伯来文直译为“房屋”。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: 于是，我听见
  rationale: 未完成式连续体推进叙事；“于是”自然表达事件的先后，同时保留过去叙事语气。
- source_word: מִדַּבֵּר אֵלַי
  choice: 有声音……对我说话
  rationale: 此结构表示听见正在进行的言说。希伯来文没有明说“声音”或说话者身份；汉语若只译作“听见说话”略显生硬，因此补出不指明身份的“有声音”，并以脚注说明。
- source_word: מֵהַבָּיִת
  choice: 从殿中
  rationale: בַּיִת字面为“房屋”，但在本段异象中明确指圣殿建筑；“殿中”既符合语境，又是现代汉语自然表达。
- source_word: וְאִישׁ
  choice: 那时有一个人
  rationale: אִישׁ没有冠词，故不译为特指的“那个人”；连接词按并行情景译为“那时”，表达同时发生。
- source_word: הָיָה עֹמֵד
  choice: 站
  rationale: היה加分词表示持续状态；汉语“那时……站在”已自然体现当时持续的姿态，无须另加进行标记。
- source_word: אֶצְלִי
  choice: 在我身旁
  rationale: אֵצֶל表示近旁位置；“在我身旁”准确而自然。
theological_decisions:
- issue: 殿中说话者的身份
  choice: 不指明说话者身份，以“有声音……对我说话”表达
  alternative: “他从殿中对我说话”或直接指明为上帝
  rationale: 本节希伯来文没有明说说话者是谁；上下文虽可能暗示神圣说话者，译文仍保留本节自身的含混与神学张力。
- issue: אִישׁ所指之人的特指程度
  choice: 有一个人
  alternative: 那个人
  rationale: 原文没有冠词；不应仅凭上下文在本节加入确定指称。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“殿中”比“房屋中”更符合圣殿异象语境；脚注保留原词的字面信息。主句不确认说话者身份；“有一个人”保留原文非特指形式。
