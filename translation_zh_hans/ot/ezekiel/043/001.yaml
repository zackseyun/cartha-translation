base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/001.yaml
  text: Then he brought me to the gate[a], the gate that faces east.
translation:
  language: zh_hans
  text: 然后，他领我到那门，就是朝东的门。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  choice: 然后，他领我
  rationale: הלך的使役式带第一人称单数宾语后缀，表示使说话者前往，即“领我去／带我去”；此处由引导者带领先知继续察看，译作“领我”自然且准确。“然后”体现叙事推进。
- source_word: אֶל הַשָּׁעַר
  choice: 到那门
  rationale: אֶל表示趋向；带定冠词的שׁער指上下文中的特定门。现代汉语用“到那门”表达明确目的地。
- source_word: שַׁעַר אֲשֶׁר
  choice: 就是……的门
  rationale: 第二个“门”与前一个“门”构成同位说明。汉语以“就是……的门”保留原文重复所带来的具体限定，同时避免生硬直译。
- source_word: פֹּנֶה
  choice: 朝
  rationale: 该分词描述门的朝向；“朝东”是现代汉语表达建筑方位的自然说法。
- source_word: דֶּרֶךְ הַקָּדִים
  choice: 东
  rationale: דֶּרֶךְ加方位词在这里表示“向着东方／东面”；结合“朝”，简洁译作“朝东”。הַקָּדִים此处指东方，而非东风。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。原文两次出现“门”，译文以“那门，就是……的门”保留同位重复及强调，不另设脚注，因为这一结构在正文中已清楚呈现。
