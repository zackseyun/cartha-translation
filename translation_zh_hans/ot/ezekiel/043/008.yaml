id: EZK.43.8
reference: Ezekiel 43:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/תִתָּ֨/ם סִפָּ֜/ם אֶת סִפִּ֗/י וּ/מְזֽוּזָתָ/ם֙ אֵ֣צֶל מְזוּזָתִ֔/י וְ/הַ/קִּ֖יר בֵּינִ֣/י וּ/בֵֽינֵי/הֶ֑ם וְ/טִמְּא֣וּ אֶת שֵׁ֣ם קָדְשִׁ֗/י בְּ/תֽוֹעֲבוֹתָ/ם֙ אֲשֶׁ֣ר עָשׂ֔וּ וָ/אֲכַ֥ל אֹתָ֖/ם בְּ/אַפִּֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/008.yaml
  text: When they set their threshold beside my threshold and their doorposts beside my doorposts[a], with only the wall between me and them, they defiled my holy name by the abominations that they committed[c][b]; so I consumed them in my anger.
translation:
  language: zh_hans
  text: 当他们把自己的门槛[a]挨着我的门槛，把自己的门柱[b]挨着我的门柱，墙在我与他们之间时，他们以所行的可憎之事玷污了我的圣名；因此我在怒中吞灭了他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门槛”也可译作“门限”。希伯来语可指门口下方的门槛或门限。
    reason: lexical_alternative
  - marker: b
    text: “门柱”也可译作“门框侧柱”。
    reason: lexical_alternative
  - marker: c
    text: “吞灭”原文直译为“吃”；这里是审判用语，意为吞噬、消灭。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִתָּם
  choice: 他们把……挨着……
  rationale: ב加נתן的不定式构造引出时间或情境背景；汉语以“他们把……”自然承接上下文，不必生硬译出“当……时”。
- source_word: סִפָּם / סִפִּי
  choice: 自己的门槛／我的门槛
  rationale: סַף在建筑语境中指门槛或门限；“门槛”是现代汉语中最清楚自然的对应词。
- source_word: מְזוּזָתָם / מְזוּזָתִי
  choice: 自己的门柱／我的门柱
  rationale: מְזוּזָה指门柱、门框侧柱；“门柱”保留建筑意象，也便于普通读者理解。
- source_word: אֵצֶל
  choice: 挨着
  rationale: 该介词表示紧邻、在旁边；“挨着”准确表达近距离并符合现代汉语。
- source_word: וְהַקִּיר בֵּינִי וּבֵינֵיהֶם
  choice: 我与他们之间只隔着一道墙
  rationale: 希伯来语是无动词分句，描绘双方之间有墙相隔；“只隔着一道墙”自然表达墙是双方之间的唯一阻隔，同时保留原文逼近圣所的强烈画面。
- source_word: וְטִמְּאוּ אֶת שֵׁם קָדְשִׁי
  choice: 玷污了我的圣名
  rationale: טמא的Piel词形在圣洁语境中表示使之污秽；“玷污”与“圣名”搭配自然，并保留礼仪与道德层面的严重性。
- source_word: בְּתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ
  choice: 以所行的可憎之事
  rationale: ב表示手段，“所行的”对应אֲשֶׁר עָשׂוּ；“可憎之事”保留תּוֹעֵבָה强烈的宗教和道德评价。
- source_word: וָאֲכַל אֹתָם
  choice: 因此我……吞灭了他们
  rationale: אכל字面为“吃”，在审判语境中有吞噬、消灭之意；“吞灭”既保留原有隐喻力度，又避免被误解为字面进食。“因此”表达前后果效关系。
- source_word: בְּאַפִּי
  choice: 在怒中
  rationale: אַף本义与鼻孔有关，在此为“怒气”；“在怒中”简洁、庄重，并保留原文表达方式。
theological_decisions:
- issue: וָאֲכַל אֹתָם中的拟人化审判语言
  choice: 译作“我吞灭了他们”
  alternative: “我吃了他们”或“我消灭了他们”
  rationale: “吃”在此是神施行审判的隐喻。“吞灭”保留其强烈形象和审判含义，又不把隐喻误作粗糙的字面陈述；单译“消灭”则会削弱原文意象。
- issue: 圣所与邻近建筑之间的墙
  choice: 译作“我与他们之间只隔着一道墙”
  alternative: “墙在我与他们之间”
  rationale: 原文强调门槛和门柱彼此紧邻、双方中间有墙；“只隔着”明确呈现这种冒犯性的逼近，但不进一步判定这些建筑或行为的具体历史身份。
translation_notes:
  register: 采用现代、庄重而清楚的简体中文。“挨着”呈现建筑结构紧密相邻的画面；“可憎之事”“圣名”“吞灭”保留经文的圣洁与审判语域。句中使用分号区分罪行与审判结果。
