  text: עַתָּ֞ה יְרַחֲק֧וּ אֶת זְנוּתָ֛/ם וּ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם מִמֶּ֑/נִּי וְ/שָׁכַנְתִּ֥י בְ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/009.yaml
  text: Now let them put far from me their prostitution and the corpses of their kings[b][a], and I will dwell in their midst forever.
translation:
  language: zh_hans
  text: 如今，他们当使自己的淫行[a]和他们君王的尸首[b]远离我；我就必永远住在他们中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “淫行”也可译作“卖淫”或“淫乱”。在先知书中，这常是比喻，指百姓对上帝背约不忠，往往表现为敬拜偶像。
    reason: lexical_alternative
  - marker: b
    text: “他们君王的尸首”可能指君王实际的遗骸，也可能更广泛地涉及圣所附近造成玷污的王室墓葬设施或纪念物。
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 作为时间和话语转换标记，引出百姓此刻应有的改变；“现在”简洁自然。
- source_word: יְרַחֲקוּ
  choice: 要使……远离
  rationale: רחק 的使役形表达“使之远离、除去”；结合语境，以带要求意味的“要”体现近似祈使的语气，同时保持现代汉语自然。
- source_word: זְנוּתָם
  choice: 自己的淫乱
  rationale: 保留先知文学中以卖淫或淫乱比喻背约不忠、尤其偶像崇拜的强烈意象；“淫乱”比“卖淫”更能自然涵盖此处比喻性行为模式，又不直接解释成“偶像崇拜”。
- source_word: פִגְרֵי מַלְכֵיהֶם
  choice: 他们君王的尸首
  rationale: פגר 指尸体、尸首；直译保留具体而令人不安的亵渎意象，不在正文中裁定其究竟指王室遗骸、陵墓设施还是纪念物。
- source_word: מִמֶּנִּי
  choice: 远离我
  rationale: 该介词表示与上帝及其圣所临在分离；与“使……远离”搭配符合现代汉语。
- source_word: וְשָׁכַנְתִּי
  choice: 我就要……住
  rationale: שכן 是表达上帝临在的关键动词；“住”自然清楚，“就”呈现前项要求与后项应许之间的语篇承接，但不把它过度公式化为条件句。
- source_word: בְתוֹכָם
  choice: 在他们中间
  rationale: 既保留空间上的“在……当中”，也承载上帝与百姓同在的盟约意味。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 在复兴语境中表达持续、恒久的临在；“永远”是现代汉语最自然的对应。
theological_decisions:
- issue: זְנוּתָם 在先知语境中的性质
  choice: 译作“自己的淫乱”，保留以性不忠描绘背约和偶像崇拜的比喻
  alternative: 译作“他们的偶像崇拜”或“他们的卖淫”
  rationale: 直接译为“偶像崇拜”会消除原文比喻；“卖淫”虽更具体，却在现代汉语中容易仅被理解为字面的商业性行为。“淫乱”较自然地保存先知性隐喻，并由脚注说明。
- issue: יְרַחֲקוּ 的语气
  choice: 以“要使……远离”表达要求或劝令
  alternative: 译作预测性的“他们必除去”
  rationale: עַתָּה 引出的语境要求百姓作出改变，因此近似祈使或劝令的理解优于单纯未来预测。
- issue: “他们君王的尸首”的所指
  choice: 正文保留具体措辞，不作解释性扩写
  alternative: 直接译成“他们君王的陵墓”“纪念物”或“偶像遗物”
  rationale: 具体历史所指存在争议；原文明确使用“尸首”一词，翻译应保存其张力，把可能涉及王室遗骸、墓葬设施或纪念设施的说明放入脚注。
- issue: 前后分句的关系
  choice: 用“就”自然连接百姓除去污秽与上帝永远居住的应许
  alternative: 仅用“并且”，或明确改写成“如果……就……”
  rationale: 希伯来语以连接词衔接，两项在语境中有响应与结果关系；“就”可体现承接而不添加原文没有明说的完整条件结构。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“要使……远离我”保存使役结构和要求语气；分号清楚呈现人的回应与上帝临在应许之间的关系。所有解释性内容留在脚注中，正文保留原文的具体意象与未决含义。
