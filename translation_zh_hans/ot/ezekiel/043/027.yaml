  text: וִֽ/יכַלּ֖וּ אֶת הַ/יָּמִ֑ים וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁמִינִ֜י וָ/הָ֗לְאָה יַעֲשׂ֨וּ הַ/כֹּהֲנִ֤ים עַל הַ/מִּזְבֵּ֨חַ֙ אֶת עוֹלֽוֹתֵי/כֶם֙ וְ/אֶת שַׁלְמֵי/כֶ֔ם וְ/רָצִ֣אתִי אֶתְ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־ס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/027.yaml
  text: When the days are completed[a], then from the eighth day onward the priests shall offer on the altar your burnt offerings and your peace offerings, and I will accept you, declares the Lord GOD.
translation:
  language: zh_hans
  text: 这些日子满了以后，从第八天起，祭司要在祭坛上献你们的燔祭与平安祭[a]；我必悦纳你们。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”。
    reason: שְׁלָמִים兼有平安、完整及共同分享祭宴的语义联想；正文采用传统译名，脚注保留另一种强调团契层面的译法。
lexical_decisions:
- source_word: וִיכַלּוּ אֶת־הַיָּמִים
  choice: 这些日子满了以后
  rationale: 按上下文指前述使祭坛成圣的七日届满。中文用“日子满了”既保留完成之意，也自然引出后续礼仪。
- source_word: בַיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: 从第八天起
  rationale: 表达第八天为持续献祭的起点；“起”自然涵盖“从此以后”的延续意义。
- source_word: יַעֲשׂוּ ... עַל־הַמִּזְבֵּחַ
  choice: 要在祭坛上献
  rationale: יַעֲשׂוּ本义为“做、行”，在祭物语境中译作“献”最符合现代汉语，也准确表达祭司的礼仪行动。
- source_word: עוֹלֹתֵיכֶם
  choice: 你们的燔祭
  rationale: 燔祭是עֹלָה在中文圣经传统中准确且通行的祭祀术语，指全然焚烧献上的祭。
- source_word: שַׁלְמֵיכֶם
  choice: 你们的平安祭
  rationale: “平安祭”是שְׁלָמִים通行且可辨识的译法；其共享、相交层面不在正文中扩释，以免缩窄词义。
- source_word: וְרָצִאתִי אֶתְכֶם
  choice: 我必悦纳你们
  rationale: 希伯来文的宾语是“你们”，不是单指祭物。“悦纳你们”保留神接纳百姓的关系性含义。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知信息中庄重的宣告公式；“主耶和华”同时反映אֲדֹנָי与神圣四字名יהוה，并符合现代中文可识别的圣经称谓。
theological_decisions:
- issue: וְרָצִאתִי אֶתְכֶם所指的悦纳对象
  choice: 我必悦纳你们
  alternative: 我必悦纳你们的祭物
  rationale: 原文明确以第二人称复数“你们”为宾语。不可将其改为祭物，以免把人与神之间的关系性接纳缩减为对祭品的认可。
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在简体中文中庄重、通行，并保留复合称谓的两个成分；“主雅威”更直接按可能的读音音译神名，但其读音重构及中文接受度仍有差异，故不置入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式依次呈现七日礼仪完成、第八日起持续献祭、神悦纳百姓及神谕公式。脚注标记置于“平安祭”之后，与所解释的希伯来词准确对应。
