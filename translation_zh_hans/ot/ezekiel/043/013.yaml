base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/013.yaml
  text: 'And these are the measurements of the altar in cubits (the cubit being a cubit and a handbreadth): its gutter shall be one cubit[a], and one cubit its width, and its border on its rim all around shall be one span[c][b]. And this shall be the base of the altar.'
translation:
  language: zh_hans
  text: 以下是祭坛的尺寸，所用的肘是一肘加一掌：底槽为一肘，宽为一肘[a]；其边沿四周的边为一拃[b]。这就是祭坛的台座[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“底槽一肘，宽一肘”；前一个“一肘”所指的尺寸方向未明说。“底槽”所指的具体祭坛构件也不确定，也可理解为凹座、沟槽或底座。
    reason: lexical_alternative
  - marker: b
    text: “一拃”约为手掌完全张开时拇指尖到小指尖的距离。原文未明确这是一项高度、宽度或其他方向的尺寸。
    reason: cultural_note
  - marker: c
    text: “台座”所译的希伯来词通常可指“背”或隆起的部分；这里也可能指祭坛的背部结构、隆起部分或高度，确切含义不详。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹת
  choice: 尺寸
  rationale: 这里是祭坛建筑规格的说明；“尺寸”在现代汉语中自然、明确。
- source_word: בָּאַמּוֹת אַמָּה אַמָּה וָטֹפַח
  choice: 所用的肘是一肘加一掌
  rationale: 原文是在界定本段采用的较长之肘，即普通一肘另加一掌；译文保留其解释测量单位的作用。
- source_word: חֵיק
  choice: 底槽
  rationale: 该词本义与凹入、怀抱之处有关，在祭坛结构中所指部位并不确定；“底槽”既表达下部凹槽状构件，也避免把它说成一般意义的沟渠。
- source_word: רֹחַב
  choice: 宽
  rationale: 建筑尺寸语境中的常用对应词。
- source_word: גְּבוּלָהּ אֶל שְׂפָתָהּ סָבִיב
  choice: 槽口四周的边
  rationale: גְּבוּל表示边界或围边，שָׂפָה字面为“唇”，在器物结构中可指口沿；合译为“槽口四周的边”较符合现代汉语。
- source_word: זֶרֶת
  choice: 一拃
  rationale: 指手张开时拇指尖到小指尖的长度；“拃”是准确而简洁的汉语传统长度表达。
- source_word: גַּב
  choice: 台座
  rationale: 该词通常有“背、隆起部分”之义，此处是罕见的祭坛建筑术语；按上下文暂译为支承或隆起的底部结构“台座”，并以脚注保留其他可能。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 希伯来圣经中该祭祀设施的标准汉语译法。
theological_decisions:
- issue: 祭坛结构术语 חֵיק 与 גַּב 的确切所指不明
  choice: 正文分别译作“底槽”和“台座”，并用脚注标明不确定性
  alternative: חֵיק可理解为“凹座、沟槽或底座”；גַּב可理解为“背部、隆起部分或高度”
  rationale: 本节描述建筑结构，并非要确立教义；既给读者可理解的空间图像，又不把罕见词汇的具体工程含义说死。
- issue: חֵיק הָאַמָּה 中未明说“深”
  choice: 按尺寸描述的语境补出“深”
  alternative: 直译为“底槽一肘，宽一肘”
  rationale: 后句明确给出宽度，前一个一肘最自然地表示与宽度相对的深度或高度；补出“深”使汉语完整，但脚注说明原文省略了该维度名称。
translation_notes:
  register: 采用现代、庄重而清楚的建筑说明语体。“肘、掌、拃”保留古代身体尺度单位，其中较长之肘直接在正文解释。对两个罕见且有争议的祭坛结构术语不作过度确定，并以脚注保存替代理解。
