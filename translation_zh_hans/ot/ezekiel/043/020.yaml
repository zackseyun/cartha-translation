  to: 你要取它的一些血，抹在坛的四个角状突起上、坛台的四角上，以及四围的边缘上；这样，你就要洁净坛，并为坛行赎罪礼。
  rationale: 修订以“角状突起”明确祭坛之角（קַרְנֹת）并与坛台的“四角”（פִּנּוֹת）区分；同时删除完成体“了”，恢复原文连续命令的语气。其余译法和脚注均可保留。
