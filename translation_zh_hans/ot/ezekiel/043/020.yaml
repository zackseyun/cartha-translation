  text: וְ/לָקַחְתָּ֣ מִ/דָּמ֗/וֹ וְ/נָ֨תַתָּ֜ה עַל אַרְבַּ֤ע קַרְנֹתָי/ו֙ וְ/אֶל אַרְבַּע֙ פִּנּ֣וֹת הָ/עֲזָרָ֔ה וְ/אֶֽל הַ/גְּב֖וּל סָבִ֑יב וְ/חִטֵּאתָ֥ אוֹת֖/וֹ וְ/כִפַּרְתָּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/020.yaml
  text: And you shall take some of its blood and put it on its four horns[a], on the four corners of the ledge, and on the border all around; so you shall purify it and make atonement for it.
translation:
  language: zh_hans
  text: 你要取它的一些血，抹在坛的四个角状突起上、坛台的四角上，以及四围的边缘上；这样，你就要洁净坛，并为坛行赎罪礼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדָּמוֹ
  choice: 它的一些血
  rationale: 介词 מִן 在这里表示从整体中取一部分；“它的一些血”既体现部分义，也符合现代汉语表达。
- source_word: קַרְנֹתָיו
  choice: 坛的四个角
  rationale: קֶרֶן 在祭坛语境中指祭坛四角向上突出的角状部分；译作“坛的四个角”沿用清楚、通行的礼仪用语。
- source_word: פִּנּוֹת
  choice: 四角
  rationale: 该词指建筑结构的角或角端；“四角”简明地保留其空间含义。
- source_word: הָעֲזָרָה
  choice: 坛台
  rationale: 在以西结所见的祭坛结构中，此词并非通常意义上的院子，而是环绕祭坛的台状结构；“坛台”比古奥的建筑术语更易懂，并以脚注说明其所指。
- source_word: הַגְּבוּל סָבִיב
  choice: 四围的边缘
  rationale: גְּבוּל 指界边或边缘，סָבִיב 表明它环绕四周；“四围的边缘”自然且贴近原文。
- source_word: וְחִטֵּאתָ אֹתוֹ
  choice: 洁净了坛
  rationale: חטא 的 Piel 形式在献祭礼仪中指除去污秽或罪污，使对象洁净，并非“使它犯罪”。
- source_word: וְכִפַּרְתָּהוּ
  choice: 为坛行了赎罪礼
  rationale: כפר 是祭司礼仪中的赎罪用语；加入“行……礼”明确这里是对祭坛施行礼仪，又不预设某一种特定赎罪理论。
theological_decisions:
- issue: 如何区分相连的礼仪动词 חטא（Piel）与 כפר
  choice: 洁净了坛，并为坛行了赎罪礼
  alternative: 洁净坛，为坛除罪
  rationale: 原文用两个相关但不同的动词，前者突出礼仪上的洁净，后者保留赎罪用语；分别翻译可保留二者之间的张力和礼仪次序，而不将其合并成一个动作。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“抹在”表达把祭牲之血施于祭坛各部位的礼仪动作；末句用完成体“了”承接“这样”，表达执行这些动作所达到的礼仪结果。
