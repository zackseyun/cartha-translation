base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/022.yaml
  text: And on the second day you shall present a male goat without blemish for a sin offering[a], and they shall purify the altar just as they purified it with the bull.
translation:
  language: zh_hans
  text: 第二天，你要献上一只没有残疾的公山羊作赎罪祭[a]；他们要洁净祭坛，正如他们用公牛洁净祭坛一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作洁净祭”。希伯来语“חַטָּאת”既可指赎罪祭，也可着重指用来除去礼仪污秽的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: 第二天
  rationale: 该短语承接前文并标明礼仪次序；现代汉语无需硬译句首连接词“ו”，上下文的连续性仍然清楚。
- source_word: תַּקְרִיב
  choice: 你要献上
  rationale: קרב的使役式在献祭语境中指把祭牲呈献出来；“献上”自然、庄重，也明确保留祭祀含义。
- source_word: שְׂעִיר עִזִּים
  choice: 一只公山羊
  rationale: 这是指雄性山羊的常见祭祀用语；“公山羊”符合现代汉语表达。
- source_word: תָּמִים
  choice: 没有残疾的
  rationale: 在祭牲语境中指没有身体缺陷；“没有残疾”准确且易懂。
- source_word: לְחַטָּאת
  choice: 作赎罪祭
  rationale: 此处חַטָּאת指祭物或祭礼，而非抽象的罪；“赎罪祭”是汉语圣经传统中清楚而通行的名称，同时以脚注保留“洁净祭”的功能性译法。
- source_word: וְחִטְּאוּ אֶת־הַמִּזְבֵּחַ
  choice: 他们要洁净祭坛
  rationale: חטא的强意式用于礼仪对象时表示除去污秽、使之洁净，不是说祭坛犯了道德意义上的罪。
- source_word: כַּאֲשֶׁר חִטְּאוּ בַּפָּר
  choice: 像先前用公牛洁净祭坛一样
  rationale: כַּאֲשֶׁר表示与前一日礼仪的比较，ב在此表工具或凭借；补出宾语“祭坛”，使汉语指代明确。
theological_decisions:
- issue: 献祭洁净语境中חַטָּאת与חטא的译法
  choice: 名词译为“赎罪祭”，用于祭坛的动词译为“洁净”。
  alternative: 名词译为“洁净祭”，使名词和动词的礼仪功能更加显明。
  rationale: 希伯来文以同一词根表达祭物及其洁净功用。现代汉语若把用于祭坛的动词直译成“赎罪”或“除罪”，容易使人误以为祭坛承担道德罪责。因此正文保留通行的祭名“赎罪祭”，动词则按礼仪意义译作“洁净”，并用脚注保留另一种祭名译法，不消除原文的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“献上”“赎罪祭”“洁净祭坛”保持经文的祭祀语境；后半句重复“祭坛”而不只用代词，以确保汉语指向清楚。
