  yaml_path: translation/ot/ezekiel/043/015.yaml
  text: And the altar hearth shall be four cubits[a], and from the altar hearth and upward, four horns.
translation:
  language: zh_hans
  text: 坛顶高四肘[a]；坛顶以上有四个坛角。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这里有两个相关而罕见的祭坛术语，har'el 和 ari'el，含义尚有争议；本译文按上下文译作“坛顶”。它们也可较字面地理解为“神的炉床”，或（尤其 ari'el）音译为“亚利伊勒”。
    reason: 保留罕见祭坛术语的词义不确定性，并澄清主要替代译法与不同词形的关系。
lexical_decisions:
- source_word: הַרְאֵל / הָאֲרִאֵיל
  choice: 坛顶
  rationale: 这两个相关而罕见的祭坛术语在本段尺寸说明中指祭坛上部焚烧祭物的平台；“坛顶”既交代其位置和功用，又避免把它们误作专名。脚注保留其字面含义及音译的可能性。
- source_word: אַרְבַּע אַמּוֹת
  choice: 高四肘
  rationale: 保留古代长度单位“肘”；结合上下文的垂直尺寸，补出汉语所需的“高”。
- source_word: וּלְמַעְלָה
  choice: 向上
  rationale: 准确表达以坛顶为起点的垂直方向。
- source_word: הַקְּרָנוֹת אַרְבַּע
  choice: 四个角
  rationale: 指祭坛向上突出的四个角；“四个角”符合现代汉语量词习惯。
- source_word: מֵהָאֲרִאֵיל
  choice: 从坛顶
  rationale: 明确表达介词 מִן 的起点意义，并与前一相关术语保持译名一致。
