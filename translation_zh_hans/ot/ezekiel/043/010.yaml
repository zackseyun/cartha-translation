source:
  edition: WLC
  text: אַתָּ֣ה בֶן אָדָ֗ם הַגֵּ֤ד אֶת בֵּֽית יִשְׂרָאֵל֙ אֶת הַ/בַּ֔יִת וְ/יִכָּלְמ֖וּ מֵ/עֲוֺנֽוֹתֵי/הֶ֑ם וּ/מָדְד֖וּ אֶת תָּכְנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/010.yaml
  text: As for you[a], son of man, declare the temple to the house of Israel, so that they may be ashamed of their iniquities[b]; and let them measure the plan.
translation:
  language: zh_hans
  text: “你，人子啊，要向以色列家说明这殿[a]，使他们因自己的罪孽而羞愧；让他们量度这殿的格局[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”；这里指异象中的圣殿。
    reason: lexical_alternative
  - marker: b
    text: “格局”也可译作“样式”或“设计”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן־אָדָם
  choice: 人子
  rationale: 这是以西结书中上帝对先知一贯的称呼；保留固定表达及全书的文学连贯性。
- source_word: הַגֵּד
  choice: 说明
  rationale: 该命令式要求先知把异象中的殿清楚地告知以色列家；“说明”既自然，也能表达郑重传达之意。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书常见的群体性盟约称谓，同时在现代汉语中仍可理解。
- source_word: הַבַּיִת
  choice: 这殿
  rationale: 字面为“这房屋”，但在以西结书40—43章的语境中明确指异象里的圣殿；“这殿”简洁而准确。
- source_word: וְיִכָּלְמוּ
  choice: 使他们……羞愧
  rationale: 命令式之后的未完成式可表达目的或结果；此处译出目的关系，同时不将其弱化为单纯将来时。
- source_word: מֵעֲוֺנוֹתֵיהֶם
  choice: 因自己的罪孽
  rationale: 介词可表达羞愧的缘由；“罪孽”保留 עָוֹן 所含的道德过犯与罪责分量。
- source_word: וּמָדְדוּ
  choice: 让他们量一量
  rationale: 承接前面的命令，按祈使或指令性的语气处理；“量一量”符合实际测量格局的语境。
- source_word: תָּכְנִית
  choice: 格局
  rationale: 此词在这里指圣殿可供察看、测量的布局或构造；“格局”比抽象的“样式”更贴合建筑语境，又不把它限定为现代意义的图纸。
theological_decisions:
- issue: “房屋”的所指
  choice: 正文译作“这殿”
  alternative: 这房屋
  rationale: 上下文明确是以西结异象中的圣所建筑；译作“殿”消除现代读者可能产生的普通住宅联想，却不加入语境之外的教义解释。
- issue: 命令式以后两个动词的语气关系
  choice: 译为目的与劝令：“使他们……羞愧；让他们……”
  alternative: 并列陈述：“他们就会羞愧……并会量……”
  rationale: 希伯来语句法容许目的、结果或后续指令的理解。正文采用在语境中较自然的目的—劝令关系，但不把羞愧解释成某一特定悔改理论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你，人子啊”保留先知蒙召话语的郑重节奏；“以色列家”保留原文的先知书用语。脚注标记均放在相关词语之后，纠正了咨询层英文脚注标记与其所释词语错位的问题。
