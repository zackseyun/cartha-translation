base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/003.yaml
  text: And the appearance of what I saw was like the appearance that I had seen when I came to destroy the city[a], and the visions were like the appearance that I had seen by the Kebar Canal[b]; and I fell on my face.
translation:
  language: zh_hans
  text: 我所看见的景象的样子，正如我来毁灭那城时所看见的景象[a]；那些异象也正如我在迦巴鲁水道[b]旁所看见的景象。我便俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他来毁灭那城时”。希伯来文本作“我来”，这可能是指以西结在异象中参与了耶路撒冷受毁灭的场景，并不一定表示他亲自实施毁灭。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译“迦巴鲁河”；它很可能是巴比伦地区的一条重要运河，而不是天然河流。
    reason: cultural_note
lexical_decisions:
- source_word: מַרְאֶה / מַרְאוֹת
  choice: 景象／异象
  rationale: 单数用“景象”，复数用“异象”，既保留希伯来文由单数转为复数的变化，也尽量呈现本节反复使用同一词根所形成的视觉呼应。开头以“景象，样子就像……”表达原文密集重复而略显拗口的结构。
- source_word: רָאִיתִי
  choice: 我所见
  rationale: 采用简洁自然的现代汉语，保留先知第一人称回顾先前所见异象的语气。
- source_word: בְּבֹאִי
  choice: 我来……时
  rationale: 保留带第一人称单数词尾的不定式结构及其时间意义，不把主语改成第三人称。
- source_word: לְשַׁחֵת
  choice: 毁灭
  rationale: 直接表达שׁחת在本语境中的破坏、毁灭含义，不弱化审判行动。
- source_word: הָעִיר
  choice: 那城
  rationale: 原文只说“城”；汉语用“那城”自然指向上下文中的耶路撒冷，同时不在正文中直接补出城名。
- source_word: אֶל נְהַר כְּבָר
  choice: 在迦巴鲁水道旁
  rationale: אֶל在此结合地点语境译为“旁”；נְהַר כְּבָר传统上称河，但所指很可能是巴比伦地区的重要人工水道，因此采用较中性的“水道”。
- source_word: וָאֶפֹּל אֶל־פָּנַי
  choice: 于是我就俯伏在地
  rationale: 以自然庄重的汉语表达字面“仆倒在我的脸上”，保留面对神圣显现时敬畏和不胜承受的意味。
theological_decisions:
- issue: “我来毁灭那城时”所暗示的行动者
  choice: 正文保留第一人称“我来毁灭”
  alternative: “他来毁灭那城时”
  rationale: 马所拉文本明确为第一人称，可能表达以西结在毁灭耶路撒冷的异象中参与审判场景，而不一定表示他亲手实施毁灭。正文不应擅自消解这一困难和神学张力，另一种理解置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“我来毁灭”这一突兀的第一人称表述，并通过脚注说明歧义；“景象／异象”的搭配兼顾原文重复、数的变化和汉语可读性。
