  source_fidelity: 原文 בְּכַלּוֹתְךָ מֵחַטֵּא 是“当你完成洁净（之事）时”的时间从句；“你洁净完毕后”在汉语中较易理解为“你本人洁净完毕”，未能清楚表达施行礼仪洁净。פַּר בֶּן־בָּקָר 指一头公牛／年轻公牛；“公牛犊”在现代汉语中不够自然，且可能将年龄缩窄为牛犊。מִן־הַצֹּאן 仅说明公绵羊出自羊群（小牲畜群），不含“选出”的动作，故应删去该增译。
