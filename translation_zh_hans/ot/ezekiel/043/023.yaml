base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/023.yaml
  text: When you have finished making purification[c][b][a], you shall present a flawless young bull and a flawless ram from the flock.
translation:
  language: zh_hans
  text: 你完成洁净礼后[a]，要献上一头没有残疾的公牛[b]，以及一只从羊群中来的、没有残疾的公绵羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洁净礼”也可译作“除去罪污”或“行赎罪礼”。希伯来语动词在献祭语境中可指除去罪污、使之洁净。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“一头公牛，牛群之子”；也可译作“一头年轻公牛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכַלּוֹתְךָ
  choice: 你……完毕后
  rationale: 介词 בְּ 加 כלה 的不定式附属形及第二人称阳性单数词尾，构成时间从句；此译自然表达动作已经完成。
- source_word: מֵחַטֵּא
  choice: 洁净
  rationale: חטא 在此为礼仪语境中的强化词干用法，指除去罪污、使之洁净；“洁净”保留祭坛奉献礼中的礼仪含义，又不把意义局限为某一种赎罪理论。
- source_word: תַּקְרִיב
  choice: 要献上
  rationale: קרב 的使役形在献祭语境中指把祭物带近并呈献；“献上”在现代汉语中清楚而庄重。
- source_word: פַּר בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: 该短语直译近于“牛群之子的一头公牛”，实际指幼壮的公牛；“公牛犊”简洁保留其年龄和性别信息。
- source_word: תָּמִים
  choice: 没有残疾
  rationale: 祭祀语境中指祭牲完整、无身体缺陷；“没有残疾”比抽象的“完美”更准确。
- source_word: וְאַיִל
  choice: 以及一只……公绵羊
  rationale: אַיִל 是成年公绵羊的常用词；“公绵羊”清楚区别于泛称的羊。
- source_word: מִן הַצֹּאן
  choice: 从羊群中选出的
  rationale: צֹאן 是绵羊和山羊等小型牲畜的集合称谓；本处 אַיִל 已明确为公绵羊，因此译作“从羊群中选出的”自然表达来源关系。
- source_word: תָּמִים
  choice: 没有残疾
  rationale: 同一形容词再次修饰公绵羊，采用一致译法，以保留原文的重复和祭牲要求。
theological_decisions:
- issue: 圣殿奉献语境中 חטא 的礼仪含义
  choice: 洁净
  alternative: 献赎罪祭／除去罪污
  rationale: 上下文涉及祭坛的洁净与奉献。原词可表示除去罪污、行洁净礼，亦与赎罪相关；正文采用较宽而合乎语境的“洁净”，脚注保留其他可能，避免把经文提前限定为单一神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。“献上”符合献祭场景；两次“没有残疾”保留原文重复。脚注标记均置于相关正文之后。
