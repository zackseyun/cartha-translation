source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ אֶת מְק֣וֹם כִּסְאִ֗/י וְ/אֶת מְקוֹם֙ כַּפּ֣וֹת רַגְלַ֔/י אֲשֶׁ֧ר אֶשְׁכָּן שָׁ֛ם בְּ/ת֥וֹךְ בְּנֵֽי יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם וְ/לֹ֣א יְטַמְּא֣וּ ע֣וֹד בֵּֽית יִ֠שְׂרָאֵל שֵׁ֣ם קָדְשִׁ֞/י הֵ֤מָּה וּ/מַלְכֵי/הֶם֙ בִּ/זְנוּתָ֔/ם וּ/בְ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם בָּמוֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/007.yaml
  text: And he said to me[a], “Son of man, this is the place of my throne and the place of the soles of my feet, where I will dwell among the children of Israel forever. And the house of Israel shall no longer defile my holy name, neither they nor their kings, by their prostitution and by the corpses of their kings on their high places.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，这是我宝座所在之处，也是我脚掌所在之处；我要永远住在这里，在以色列人中间。以色列家和他们的君王必不再以自己的淫乱，以及他们君王在丘坛上的尸首[a]，玷污我的圣名。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句或译：“以及他们君王死亡时的尸首。”希伯来文末词按传统读法意为“他们的丘坛”，与祭祀玷污的语境相合；也有人将它理解为与“他们死亡”有关。
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的希伯来称呼语，简洁庄重，也不把其代表性的人类含义改写为解释性措辞。
- source_word: מְקוֹם כִּסְאִי
  choice: 我宝座所在之处
  rationale: 准确表达“我宝座的地方”，同时比生硬的所有格结构更符合现代汉语。
- source_word: מְקוֹם כַּפּוֹת רַגְלַי
  choice: 我脚掌所踏之处
  rationale: כַּפּוֹת רַגְלַי直指“脚掌”，不解释为原文未明说的“脚凳”；加“所踏”使汉语自然，并保留地点意象。
- source_word: אֲשֶׁר אֶשְׁכָּן שָׁם
  choice: 我要永远住在这里
  rationale: 未完成式在异象语境中自然指向将来；“这里”承接前述圣殿之地，并明确表达שָׁם。
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 在以色列人中间
  rationale: “中间”保留בְּתוֹךְ的空间与群体含义；“以色列人”是现代汉语对בְּנֵי יִשְׂרָאֵל自然且准确的表达。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 直接传达持续无尽的时间含义，符合本节上帝长久居住的宣告。
- source_word: יְטַמְּאוּ
  choice: 玷污
  rationale: 既保留טמא所含的污秽意象，又适合以“圣名”为宾语的现代汉语搭配。
- source_word: שֵׁם קָדְשִׁי
  choice: 我的圣名
  rationale: 自然、准确地表达“我神圣的名”，并保留“名”在经文中的圣约与尊荣含义。
- source_word: הֵמָּה וּמַלְכֵיהֶם
  choice: 以色列家和他们的君王
  rationale: 将希伯来语强调性的“他们和他们的君王”与前面的“以色列家”合并为清楚自然的汉语主语，不改变两者同受禁令约束的含义。
- source_word: בִּזְנוּתָם
  choice: 以自己的淫乱
  rationale: “淫乱”保留先知语言的强烈性及其可能兼具的肉体、敬拜和背约意涵，不把它窄化为单一解释。
- source_word: וּבְפִגְרֵי מַלְכֵיהֶם
  choice: 以及他们君王……的尸首
  rationale: פֶּגֶר指尸体或尸首；“尸首”直接传达死亡所造成的礼仪污秽，也符合庄重经文语体。
- source_word: בָּמוֹתָם
  choice: 在丘坛上
  rationale: 按马所拉传统元音读作“他们的丘坛”，与本段圣所受偶像崇拜及尸首玷污的语境相合；另一种与“死亡”相关的理解保留在脚注中。
theological_decisions:
- issue: 末句所指的玷污性质
  choice: 正文按马所拉传统理解为：以色列及其君王借淫乱和丘坛上君王的尸首玷污上帝的圣名。
  alternative: 末词也可能理解为“在他们死亡时”，全句相应译作“以及他们君王死亡时的尸首”。
  rationale: 传统元音及圣殿洁净、丘坛崇拜的上下文支持“丘坛”读法；但辅音形式容许与“死亡”相关的分析，因此用脚注保存真实的文本与解释张力，不在正文中武断消除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句首用“这是……所在之处”呈现希伯来语无系词名词句；“脚掌所踏之处”保留具体身体意象；“淫乱”不加“属灵”或“偶像崇拜”等限定，以保存先知语言本身的多重张力。脚注标记置于发生歧义的末句，而非无歧义的“他对我说”之后。
