id: EZK.43.2
reference: Ezekiel 43:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כְּבוֹד֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בָּ֖א מִ/דֶּ֣רֶךְ הַ/קָּדִ֑ים וְ/קוֹל֗/וֹ כְּ/קוֹל֙ מַ֣יִם רַבִּ֔ים וְ/הָ/אָ֖רֶץ הֵאִ֥ירָה מִ/כְּבֹדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/002.yaml
  text: And behold[a], the glory of the God of Israel was coming from the way of the east, and his voice was like the sound of many waters[b], and the earth shone from his glory.
translation:
  language: zh_hans
  text: 看哪，以色列上帝的荣耀从东方而来[a]；他的声音如同众水的响声[b]，大地因他的荣耀而发光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从东方的路而来”，也可译“从东边的方向而来”。
    reason: lexical_alternative
  - marker: b
    text: 也可译“如同众水的轰鸣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留异象叙事中突显眼前景象、引人注意的语气；现代中文虽略显庄重，却自然适合先知文学。
- source_word: כְּבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列上帝的荣耀
  rationale: “荣耀”保留כבוד在神显语境中的光辉与神学内涵；“以色列上帝”直接呈现原文的身份称谓。
- source_word: בָּא
  choice: 而来
  rationale: 原文以分词描写异象中正在临近的动态；“而来”在中文中简洁自然，并能呈现其行进方向。
- source_word: מִדֶּרֶךְ הַקָּדִים
  choice: 从东方而来
  rationale: דרך可指道路、方向；此处译成自然中文“从东方而来”，方向意义明确，字面表达另收入脚注。
- source_word: וְקוֹלוֹ
  choice: 他的声音
  rationale: 保留קוֹל的“声音”义，并按神显语境使用人格代词；同时不在正文中进一步界定代词究竟直接指上帝还是其荣耀的显现。
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: 如同众水的响声
  rationale: 前一处קוֹל译作“声音”，比较语中的同词译作“响声”，既保留水声意象，又避免中文重复生硬；“轰鸣”虽可能符合场景，但解释力度较强。
- source_word: וְהָאָרֶץ
  choice: 大地
  rationale: ארץ可指地或大地；神显照耀的宏阔场景中，“大地”比特定地域性的“那地”更合适。
- source_word: הֵאִירָה מִכְּבֹדוֹ
  choice: 因他的荣耀而发光
  rationale: Hiphil形式表达大地被照亮或呈现光辉；מן可表示来源或原因。“因……而发光”是自然中文，同时保留荣耀为光辉根源的关系。
theological_decisions:
- issue: “声音”和“荣耀”所带后缀的人格指向
  choice: 译作“他的声音……他的荣耀”
  alternative: 译作“它的响声……它的荣耀”
  rationale: 从语法衔接看，后缀可回指“荣耀”；但上下文呈现的是以色列上帝亲自临到的神显。使用“他的”符合中文对神圣位格显现的自然表达，同时不额外规定“荣耀”与上帝之间的本体关系。
- issue: 大地发光与荣耀之间的关系
  choice: 因他的荣耀而发光
  alternative: 从他的荣耀发出光来／被他的荣耀照亮
  rationale: 原文מן可表达来源，也可在中文中自然体现为原因。“因……而发光”不把主动发光或被动照亮限定得过死，保留原文意象的张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知文学语体。“看哪”保留异象的现场感；用分号组织三个连续画面。正文追求自然中文，脚注保存“东方的路”的字面表达及“轰鸣”的较强译法。
