  text: שִׁבְעַ֣ת יָמִ֗ים יְכַפְּרוּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/טִֽהֲר֖וּ אֹת֑/וֹ וּ/מִלְא֖וּ יד/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/026.yaml
  text: For seven days they shall make atonement for the altar and cleanse it[a], and they shall consecrate it.
translation:
  language: zh_hans
  text: 七日之内，他们要为祭坛行赎罪礼，洁净它，并使它正式投入圣用[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“填满它的手”。这是礼仪惯用语，可指奉献、设立或正式启用；这里的对象是祭坛。
    reason: 说明原文礼仪惯用语，并交代其用于祭坛时所表达的奉献、设立和启用意义。
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 一连七天
  rationale: 这是表示持续时间的短语；“一连七天”自然地表达这些礼仪持续七日。
- source_word: יְכַפְּרוּ אֶת הַמִּזְבֵּחַ
  choice: 他们要为祭坛行赎罪礼
  rationale: כפר在祭司礼仪语境中指施行赎罪、除罪或洁净的仪式。“行赎罪礼”保留其礼仪和神学分量，同时避免误解为祭坛本身实施赎罪。
- source_word: וְטִהֲרוּ אֹתוֹ
  choice: 使它洁净
  rationale: טהר在此指礼仪上的洁净；“使它洁净”简明自然，也保留与前一项赎罪礼相关而不完全等同的动作。
- source_word: וּמִלְאוּ יָדוֹ
  choice: 并使它承接圣用
  rationale: 原文是礼仪惯用语，字面为“填满它的手”。由于对象是祭坛，“承接圣用”比用于人的“承接圣职”更合适，并表达祭坛经奉献、设立后正式用于圣礼。
theological_decisions:
- issue: 如何翻译以祭坛为对象的礼仪惯用语 וּמִלְאוּ יָדוֹ
  choice: 使它承接圣用
  alternative: 使它分别为圣；奉献它；填满它的手
  rationale: 直译在现代汉语中难以理解；“分别为圣”可能只突出圣洁状态，“奉献它”则可能淡化正式设立并投入礼仪用途的含义。“承接圣用”保留启用、委任的意味，同时脚注交代原文意象和其他可能含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行赎罪礼”“洁净”“承接圣用”体现祭司礼仪语境，同时避免过度技术化；脚注保留原文惯用语的独特意象和解释空间。
