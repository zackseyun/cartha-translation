  naturalness: “一连七天”及“为祭坛行赎罪礼”自然、庄重。“使它承接圣用”生硬且语义不够明确；改为“使它正式投入圣用”更符合现代标准汉语，并保留正式礼仪启用的含义。
  terminology: “祭坛”“赎罪礼”“洁净”“圣用”均适合本段祭司礼仪语境。应避免将用于人的“就职”“圣职”直接用于祭坛；脚注可说明“填满它的手”这一希伯来文惯用语及其在此处指向祭坛的特殊用法。
