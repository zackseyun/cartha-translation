base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/025.yaml
  text: For seven days you shall offer a goat as a sin offering each day[a], and they shall offer a bull, a son of the herd, and a ram from the flock[b], without blemish.
translation:
  language: zh_hans
  text: 七天中，你每天要献一只公山羊作赎罪祭；他们[b]要献一头公牛[a]和一只出自羊群的公绵羊；这两种祭牲都要没有残疾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“公牛，牛群之子”。这是常见的献祭用语，也可译作“一头小公牛”或“牛群中的一头公牛”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在这里由单数的“你要献”转为复数的“他们要献”。正文保留了这个变化，没有将两个分句的主语统一。
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 七天之内
  rationale: 该短语表示持续七天的时段；“七天之内”自然地传达时间范围，并与“每天”配合。
- source_word: תַּעֲשֶׂה
  choice: 你……要献
  rationale: עשה本义为“做、制成”，但在献祭语境中指办理或献上祭物；译作“献”最符合本节礼仪语境。
- source_word: שְׂעִיר חַטָּאת
  choice: 一只公山羊作赎罪祭
  rationale: שְׂעִיר指公山羊；חַטָּאת在献祭语境中是赎罪祭，而非抽象的“罪”。
- source_word: לַיּוֹם
  choice: 每天
  rationale: 这里表示七天中每日重复献祭；“每天”简洁清楚。
- source_word: וּפַר בֶּן בָּקָר
  choice: 一头公牛，就是牛群中的公牛
  rationale: פַר是公牛，בֶּן בָּקָר是献祭用语，字面近于“牛群之子”。正文保留其同位说明的结构，同时避免生硬直译。
- source_word: וְאַיִל מִן הַצֹּאן
  choice: 以及羊群中的一只公绵羊
  rationale: אַיִל指公绵羊，מִן הַצֹּאן表示它出自羊群或属于羊群。
- source_word: תְּמִימִים
  choice: 都要没有残疾
  rationale: 在祭牲语境中，תמים表示没有缺陷、不带残疾；该译法清楚传达礼仪要求。
- source_word: יַעֲשׂוּ
  choice: 他们……要献
  rationale: 该动词在献祭语境中译为“献”；同时保留希伯来文由第二人称单数转为第三人称复数的变化。
theological_decisions:
- issue: 献祭指令中的语法主语转换
  choice: 正文保留“你……要献”转为“他们……要献”的变化。
  alternative: 将两处统一译成“你要献”，或统一译成“他们要献”。
  rationale: 希伯来文先用第二人称单数תַּעֲשֶׂה，后用第三人称复数יַעֲשׂוּ。经文本身没有明说转换原因，因此不把可能涉及以西结与祭司分工的解释写进正文。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“赎罪祭”“祭牲”“没有残疾”保留祭祀语境的准确性；用分号呈现两个分句，并通过脚注说明原文中不寻常的主语转换和固定献祭表达。
