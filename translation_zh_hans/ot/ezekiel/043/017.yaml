base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/017.yaml
  text: And the ledge was fourteen cubits long by fourteen cubits wide at its four sides, and the rim around it was half a cubit, and its base was a cubit all around; and its steps faced east.
translation:
  language: zh_hans
  text: 坛台长十四肘，宽十四肘，四面都是如此；四周的边缘宽半肘，四周的底座宽一肘；台阶朝东。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲזָרָה
  choice: 坛台
  rationale: 此词在本段指祭坛上层的方形平台；译作“坛台”既体现其祭坛语境，也比单纯的“台面”更明确。
- source_word: הַגְּבוּל
  choice: 边缘
  rationale: 指环绕坛台的窄边或缘饰；“边缘”保留其空间含义，同时避免把它误解为一般疆界。
- source_word: הַחֵיק
  choice: 底座
  rationale: 该词本义可涉及凹处、托座或基部；在祭坛结构语境中译作“底座”，与上下文尺寸描述相符，但不进一步限定具体构造。
- source_word: מַעֲלֹתָיו
  choice: 台阶
  rationale: 复数形式指登上祭坛的阶级，现代汉语自然译为“台阶”。
- source_word: פְּנוֹת קָדִים
  choice: 朝东
  rationale: 直译为“面向东方”，简洁译作“朝东”。
theological_decisions:
- issue: 祭坛构件术语的辨识
  choice: 将 הָעֲזָרָה 译为“坛台”，הַחֵיק 译为“底座”
  alternative: “台面／槽座”或“坛围／基部”
  rationale: 这些建筑术语含义并非全然确定；正文采用上下文中最易理解且与英文学术审校层一致的表达，不赋予其额外象征或礼仪意义。
translation_notes:
  register: 采用现代、庄重而清楚的说明性语言。重复“四周”以对应原文结构；“四面都是如此”自然表达方形坛台各边均为十四肘。
