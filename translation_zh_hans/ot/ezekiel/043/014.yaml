  yaml_path: translation/ot/ezekiel/043/014.yaml
  text: And from the ledge of the ground to the lower platform shall be two cubits[a], with a width of one cubit; and from the smaller platform to the larger platform shall be four cubits[c][b], with a width of one cubit.
translation:
  language: zh_hans
  text: 从地面的基座[a]到下层台座[b]，高二肘，宽一肘；从较小的台座到较大的台座，高四肘，宽一肘[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地面的基座”原文直译为“地的怀中”，可能指祭坛在地面处的底座、凹槽或凸缘。
    reason: lexical_alternative
  - marker: b
    text: 原文“台座”一词在本段指祭坛逐层的结构层级；译法有“台座”“平台”“凸缘”等，具体形制未能完全确定。
    reason: lexical_alternative
  - marker: c
    text: 本句末尾原文直译为“宽度是那一肘”，很可能与前一句平行，意思是宽一肘。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיק הָאָרֶץ
  choice: 地面的基座
  rationale: חֵיק本义可指“怀、凹处”，在祭坛尺寸的建筑语境中指地面处的底座、凹槽或凸缘。“地面的基座”自然清楚，同时以脚注保留具体形制的不确定性。
- source_word: עֲזָרָה
  choice: 台座
  rationale: 此词在以西结书43:13–17指祭坛逐层收进而形成的结构层级；“台座”比音译或古旧建筑术语更适合现代汉语，也不把它过度限定为狭窄凸缘。
- source_word: הַתַּחְתּוֹנָה
  choice: 下层
  rationale: 该形容词标示两个相关层级中的较低一层；“下层”自然表达其相对位置，不强解为绝对最低层。
- source_word: שְׁתַּיִם אַמּוֹת
  choice: 高二肘
  rationale: 原文直陈“二肘”，垂直方向由“从……到……”的结构描述得出；汉语补出“高”可避免误读，并未增加新的尺寸信息。
- source_word: וְרֹחַב אַמָּה אֶחָת
  choice: 台面宽一肘
  rationale: רֹחַב表示宽度；补出“台面”使汉语明确这里说的是该层横向伸出的宽度。
- source_word: הֳעֲזָרָה הַקְּטַנָּה
  choice: 较小的台座
  rationale: קְטַנָּה与后文גְּדוֹלָה相对，译为比较级可清楚表现两个台座的相对大小。
- source_word: הָעֲזָרָה הַגְּדוֹלָה
  choice: 较大的台座
  rationale: 在建筑描述中与“较小的台座”形成对应；“较大的”比“伟大的”更符合尺寸语境。
- source_word: אַרְבַּע אַמּוֹת
  choice: 高四肘
  rationale: 原文为“四肘”，其垂直维度由起止结构隐含；现代汉语补“高”有助于准确理解。
- source_word: וְרֹחַב הָאַמָּה
  choice: 台面宽一肘
  rationale: 字面为“宽度是那一肘”，定冠词很可能回指前述标准宽度，平行结构支持理解为一肘；正文作清楚表达，脚注说明原文字面形式。
