source:
  edition: WLC
  text: לִ/שְׁלֹ֥ל שָׁלָ֖ל וְ/לָ/בֹ֣ז בַּ֑ז לְ/הָשִׁ֨יב יָדְ/ךָ֜ עַל חֳרָב֣וֹת נוֹשָׁבֹ֗ת וְ/אֶל עַם֙ מְאֻסָּ֣ף מִ/גּוֹיִ֔ם עֹשֶׂה֙ מִקְנֶ֣ה וְ/קִנְיָ֔ן יֹשְׁבֵ֖י עַל טַבּ֥וּר הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/012.yaml
  text: to seize spoil and to carry off plunder[a], to turn your hand against ruins now inhabited and against a people gathered from the nations, who have acquired livestock and goods, who dwell at the center of the earth.
translation:
  language: zh_hans
  text: 为要抢夺财物，掳掠战利品；伸手攻击那些如今有人居住的荒废之地，又攻击那从列国招聚而来的百姓。他们置办了牲畜和财产，住在大地的中心[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“住在大地的肚脐上”；这是指大地或这片土地中央的比喻说法。
    reason: 保留 טַבּוּר 的字面意象，并说明其习语意义。
lexical_decisions:
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: 抢夺财物，掳掠战利品
  rationale: 两个“动词加同源宾语”的平行结构都强调劫掠行动。中文若机械重复会显得生硬，因此采用近义而有区别的表达，保留平行和强化效果。
- source_word: לְהָשִׁיב יָדְךָ
  choice: 伸手攻击
  rationale: 原文直译近于“使你的手转回/转向”，在此指把力量转向某个攻击目标；“伸手攻击”保留“手”的意象，也自然传达敌对行动。
- source_word: חֳרָבוֹת נוֹשָׁבוֹת
  choice: 重新有人居住的废墟
  rationale: 保留原文中“废墟”与“已有人居住”并置的张力，并以“重新”显明先前荒废、如今复居的状态。
- source_word: עַם מְאֻסָּף מִגּוֹיִם
  choice: 从列国招聚而来的民族
  rationale: 准确表达这个群体从多个国家中被聚集而来；“招聚”符合庄重的经文语体，却仍为现代读者所熟悉。
- source_word: עֹשֶׂה מִקְנֶה וְקִנְיָן
  choice: 置办了牲畜和财产
  rationale: 此处 עֹשֶׂה 并非字面“制造”，而是取得、积聚；“置办了”自然表达获得并积累产业。מִקְנֶה 泛指家畜，קִנְיָן 指所得的财物或产业，译作“财产”保持较宽泛的含义。
- source_word: יֹשְׁבֵי עַל טַבּוּר הָאָרֶץ
  choice: 住在大地的中心
  rationale: טַבּוּר 字面为“肚脐”，在此是表示中央位置的地理隐喻；正文采用自然的习语意义，字面意象收入脚注。
theological_decisions:
- issue: טַבּוּר הָאָרֶץ 的隐喻性地理表达
  choice: 大地的中心
  alternative: 大地的肚脐
  rationale: 原文以“肚脐”比喻中央位置。正文按习语译出，以免读者误解为人体化或宇宙论主张，同时用脚注保留原有隐喻。
- issue: עַם 的群体称谓
  choice: 民族
  alternative: 百姓
  rationale: 这里所说的是从列国聚集、共同居住并拥有产业的整体群体；“民族”较能呈现其群体身份，又不额外限定其政治或宗教性质。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号和两个句子梳理原文连续的不定式与分词结构；保留劫掠语句的平行感，以及“废墟重新有人居住”的反差。
