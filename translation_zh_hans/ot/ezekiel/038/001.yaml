lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知领受启示的固定表达 ויהי דבר־יהוה אלי 中，按整个短语译为“……的话临到我”，既符合现代汉语圣经语体，也准确表达神的话传给先知。
- source_word: דְבַר
  choice: 话
  rationale: דָּבָר 在此指来自神的话语或信息；“话”保留了原词与随后直接言说之间的联系，且不作不必要的解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代中文读者熟悉的专名“耶和华”翻译四字神名 YHWH，并以脚注说明其希伯来文形式及另一常见音译。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词 אֶל 加第一人称后缀表示朝向先知；结合整个希伯来语公式，自然译作“临到我”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文神的直接话语；汉语以“说”简洁、自然地承接冒号后的内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名 YHWH，而非“主”这一称号。正文采用中文圣经传统中最为人熟知的专名“耶和华”，同时在脚注保留原文形式并注明另一常见音译“雅威”，避免把有争议的发音处理成毫无疑问的结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华的话临到我”保留先知书中反复出现的启示公式；句末用“说：”引出下一节的直接引语。
