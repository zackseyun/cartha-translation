  yaml_path: translation/ot/ezekiel/038/009.yaml
  text: You will come up like a storm; you will be like a cloud covering the land—you and all your troops, and many peoples with you.
translation:
  language: zh_hans
  text: 你必上来，如暴风；你必如云彩，遮盖大地——你和你的各支部队[a]，以及同你一起的许多民族。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各支部队”原文直译为“你的翅膀”，在此军事语境中可指侧翼或各支部队。
    reason: 保留原文字面意象，并说明正文按军事语境所作的表达。
lexical_decisions:
- source_word: שׁוֹאָה
  choice: 暴风
  rationale: 该词在此与大军来袭的比喻相配，可指猛烈的风暴；译作“暴风”既保留自然景象，也传达突然而强猛的来势。
- source_word: אֲגַפֶּיךָ
  choice: 军队
  rationale: 字面义为“翅膀”，在军事语境中引申为侧翼、部队或军旅；正文采用现代读者易懂的“军队”，并以脚注保留原文意象。
- source_word: לְכַסּוֹת הָאָרֶץ
  choice: 遮盖大地
  rationale: 对应“遮盖这地/大地”，保留云层铺满地面的形象；“大地”在此不强行限定为全球或某一地区。
theological_decisions:
- issue: “地”（הָאָרֶץ）的范围
  choice: 大地
  alternative: 那地／全地
  rationale: 上下文可以指遭入侵之地，也可在修辞上呈现广阔地面；译作“大地”保留宏阔意象，不额外判定其地理范围。
translation_notes:
  register: 采用庄重、清晰的现代汉语；保留“上来—而至”和“暴风—云彩—遮盖大地”的推进关系。破折号引出与“你”同来的军队和众民族，使句法自然，同时维持原文的列举结构。
