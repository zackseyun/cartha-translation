  text: Be prepared[b][a], and prepare yourself—you and all your assembly who are gathered around you—and be a guard for them.
translation:
  language: zh_hans
  text: 你要预备好，也要为自己作好准备——你和所有聚集在你周围的会众——并要作他们的守卫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作他们的守卫”也可译作“为他们警戒”或“作他们的看守”。希伯来语可表示守护、警戒，或承担看管的职责。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֹּן
  choice: 你要预备好
  rationale: 该词为כון的尼法勒命令式，在此表达进入预备妥当的状态；译文保留命令语气，并采用现代汉语自然表达。
- source_word: וְהָכֵן לְךָ
  choice: 也要使自己准备妥当
  rationale: כון的希菲勒命令式加לְךָ，强调主动为自己作好准备；与前一命令并列形成加强语气，故不将两者合并。
- source_word: קְהָלֶךָ
  choice: 你的全部会众
  rationale: קהל指聚集起来的群体；“会众”保持原词的广义，不额外限定为军队，同时上下文仍可显出军事色彩。
- source_word: הַנִּקְהָלִים עָלֶיךָ
  choice: 聚集在你周围的
  rationale: 分词表示已经聚集的人群；עָלֶיךָ在此按语境自然译为“在你周围”，描写众人环绕歌革集结。
- source_word: וְהָיִיתָ לָהֶם לְמִשְׁמָר
  choice: 并要作他们的守卫
  rationale: מִשְׁמָר可指守卫、看守或监管职责。“作他们的守卫”保留名词结构及语义开放性，不明确限定为保护、警戒或统领。
theological_decisions:
- issue: 歌革对所聚集众人的角色
  choice: 作他们的守卫
  alternative: 为他们警戒／作他们的统领
  rationale: 希伯来语מִשְׁמָר本身可涉及守护、警戒或负责看管；正文采用较贴近形式且不过度解释的译法，并以脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的命令句。保留两个同根命令的重复加强效果；破折号标出“你和……全部会众”这一扩展主语，避免误读。
