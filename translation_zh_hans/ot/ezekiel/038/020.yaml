language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/רָעֲשׁ֣וּ מִ/פָּנַ֡/י דְּגֵ֣י הַ/יָּם֩ וְ/ע֨וֹף הַ/שָּׁמַ֜יִם וְ/חַיַּ֣ת הַ/שָּׂדֶ֗ה וְ/כָל הָ/רֶ֨מֶשׂ֙ הָ/רֹמֵ֣שׂ עַל הָֽ/אֲדָמָ֔ה וְ/כֹל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וְ/נֶהֶרְס֣וּ הֶ/הָרִ֗ים וְ/נָֽפְלוּ֙ הַ/מַּדְרֵג֔וֹת וְ/כָל חוֹמָ֖ה לָ/אָ֥רֶץ תִּפּֽוֹל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/020.yaml
  text: The fish of the sea[a], the birds of the heavens, the beasts of the field, every creeping thing that creeps on the ground, and every man who is on the face of the earth will quake at my presence; the mountains will be thrown down, the cliffs will fall, and every wall will fall to the ground.
translation:
  language: zh_hans
  text: 海里的鱼、天空的飞鸟、田野的走兽、地上一切爬行的活物，以及地上一切人，都必在我面前震颤；群山必崩塌，陡峭之处必倒塌，一切墙垣都必倒在地上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָעֲשׁוּ
  choice: 都必……震颤
  rationale: רעשׁ表示剧烈震动或战栗；“震颤”既适用于本句各类有生命的主语，也与下文山崩墙倒的震动意象相呼应。
- source_word: מִפָּנַי
  choice: 因我临到
  rationale: 字面为“从我面前／因我的面”；此处表达万物因耶和华的临在而震颤。“因我临到”在现代汉语中自然，并保留临在与致因含义。
- source_word: דְּגֵי הַיָּם
  choice: 海里的鱼
  rationale: 准确表达领属结构，同时比“海之鱼”更符合现代标准汉语。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天空的飞鸟
  rationale: שׁמים在此指鸟类活动的天空；“天空的飞鸟”自然、庄重，也保留希伯来语的范围表达。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的走兽
  rationale: 该固定表达通常指陆地上的野生动物；“走兽”与“飞鸟、爬行的生物”形成自然的类别并列。
- source_word: כָּל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאֲדָמָה
  choice: 地上一切爬行的生物
  rationale: 译出רמשׂ所指的爬行生物及其动作；汉语若机械重复为“爬行的爬物”不自然，因此以类别加动作表达其含义。
- source_word: כֹל הָאָדָם אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: 遍布地面的一切人
  rationale: אָדָם在这里是集合性用法，泛指全体人类，并非专指男性；“一切人”准确保留普遍范围，“遍布地面”自然表达“在地面之上”的希伯来语意象。
- source_word: וְנֶהֶרְסוּ הֶהָרִים
  choice: 群山必崩塌
  rationale: הרס的Niphal形表示被拆毁、倾覆；用于山体时，“崩塌”比“被拆毁”更自然，也不减弱灾变力度。
- source_word: הַמַּדְרֵגוֹת
  choice: 陡峭之处
  rationale: 此罕见词可指阶状、陡峭或有坡级的地形；“陡峭之处”保留词义的不确定性，避免过度限定为悬崖或人工梯田。
- source_word: כָל חוֹמָה לָאָרֶץ תִּפּוֹל
  choice: 一切城墙都必倒在地上
  rationale: חוֹמָה通常指防御性墙垣；“城墙”在本语境清楚自然，“倒在地上”直接表达לארץ תפל的彻底倾覆。
theological_decisions:
- issue: אָדָם的集合性所指
  choice: 一切人
  alternative: 每一个男人／全人类
  rationale: 带定冠词的אָדָם在此与海鱼、飞鸟、走兽等受造类别并列，集合性地指地上的人类。“一切人”既包含所有人，又不把本来泛指人类的词误限为男性。
- issue: מִפָּנַי所表达的神圣临在与致因关系
  choice: 因我临到
  alternative: 在我面前／因我的面
  rationale: 介词מן可带出震颤的原因，而פנים可表示亲自临在。“因我临到”同时传达神的出现与由此引起的震颤，不进一步规定显现的具体方式。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。保留全句由受造界列举推进到宇宙性崩塌的节奏；对罕见地形词הַמַּדְרֵגוֹת采取不过度具体化的译法。
