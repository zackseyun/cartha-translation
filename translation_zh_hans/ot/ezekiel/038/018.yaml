  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא בְּ/י֨וֹם בּ֥וֹא גוֹג֙ עַל אַדְמַ֣ת יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה תַּעֲלֶ֥ה חֲמָתִ֖/י בְּ/אַפִּֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/018.yaml
  text: And it will happen on that day[a], on the day when Gog comes against the land of Israel, declares the Lord GOD, that my wrath will rise up in my nostrils.
translation:
  language: zh_hans
  text: 到那日，就是歌革进犯以色列地的日子，主雅威宣告：我的烈怒必在我鼻中升腾[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“我的烈怒必在我鼻中升腾”；“鼻”在希伯来语中也常用来表达怒气。
    reason: 说明原文的具体身体意象及其惯用含义。
lexical_decisions:
- source_word: וְהָיָה
  choice: 到
  rationale: 这是先知话语中引出将来事件的惯用表达；与后面的“那日”合译为“到那日”，现代汉语自然，也保留未来指向。
- source_word: בַּיּוֹם הַהוּא
  choice: 那日
  rationale: 保留先知文体中具有特定指向的时间用语。
- source_word: בְּיוֹם בּוֹא גוֹג
  choice: 就是歌革进犯……的日子
  rationale: 将介词加不定词结构自然转化为时间说明；结合敌对语境，用“进犯”表达歌革来临的性质。
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: 以色列地
  rationale: אַדְמָה在此指以色列的土地或疆域；עַל结合敌对行动已由“进犯”表达。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: נְאֻם是先知话语中的神谕宣告格式；“主耶和华”区分称号אֲדֹנָי与神名יהוה。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: חֵמָה表示炽烈、燃烧般的忿怒；“烈怒”保留庄重而强烈的审判语气。
- source_word: תַּעֲלֶה ... בְּאַפִּי
  choice: 必在我鼻中升腾
  rationale: 保留עלה“上升”与אַף“鼻子”的具体意象，同时用“升腾”呈现怒气涌起的动态。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名יהוה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”是现代中文圣经语境中广为人知且庄重的表达，并清楚呈现“主”这一称号与יהוה这一专名的组合；不把二者都译成“主”。
- issue: 是否将בְּאַפִּי完全意译为“在我的怒气中”
  choice: 保留“鼻中”的具体意象
  alternative: 我的怒气必发作
  rationale: 原文把“烈怒”与“鼻子”并置，形成强烈的拟人化表达。正文保留这一张力，脚注说明其希伯来语习惯含义，避免悄然消除原文意象。
translation_notes:
  register: 采用现代、庄重的先知宣告语体。“到那日，就是……”清楚呈现重复的时间结构；“进犯”符合本章敌对来袭的语境；“在我鼻中升腾”刻意保留原文较突出的拟人化意象，并以脚注帮助普通读者理解。
