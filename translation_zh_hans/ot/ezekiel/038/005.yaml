  text: Persia[a], Cush, and Put are with them[b], all of them with shield and helmet.
translation:
  language: zh_hans
  text: 波斯、古实[a]和弗[b]都与他们同在，全都配备盾牌和头盔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实”有些译本传统上译作“埃塞俄比亚”。
    reason: lexical_alternative
  - marker: b
    text: “弗”在一些译本和历史地理考证中被认为与利比亚有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַס
  choice: 波斯
  rationale: 这是指波斯民族或地区的专名；采用现代中文通行名称。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 按希伯来语专名音译，避免直接译作“埃塞俄比亚”所可能带来的时代错置和过度地理限定。
- source_word: פּוּט
  choice: 弗
  rationale: 采用圣经中文传统中较简洁的音译，保留该民族地理名称本身的不确定性，不直接等同于“利比亚”。
- source_word: אִתָּם
  choice: 都与他们同在
  rationale: 原文介词加代词后缀意为“与他们同在”；中文补出判断关系，并以“都”自然衔接并列诸族。
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 明确保留原文对上述同盟者的概括和强调。
- source_word: מָגֵן
  choice: 盾牌
  rationale: 军事语境中的常用防御装备名称，现代中文清楚自然。
- source_word: כּוֹבָע
  choice: 头盔
  rationale: 此处指军事防护装备，译作“头盔”最符合上下文。
