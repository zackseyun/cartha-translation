  text: גֹּ֚מֶר וְ/כָל אֲגַפֶּ֔י/הָ בֵּ֚ית תּֽוֹגַרְמָ֔ה יַרְכְּתֵ֥י צָפ֖וֹן וְ/אֶת כָּל אֲגַפָּ֑י/ו עַמִּ֥ים רַבִּ֖ים אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/006.yaml
  text: Gomer and all its troops[b][a], the house of Togarmah from the far north and all its troops—many peoples are with you.
translation:
  language: zh_hans
  text: 歌篾和它所有的军队[a]，从极北而来的陀迦玛族和它所有的军队——许多民族都与你同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“所有的翼队”或“所有的支队”。原词可指翼、边缘，或附属的队伍；这里按军事语境译作“军队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֶר
  choice: 歌篾
  rationale: 这是族群或地域专名，采用现代中文圣经读者较熟悉的传统音译。
- source_word: אֲגַפֶּיהָ / אֲגַפָּיו
  choice: 它所有的军队
  rationale: אֲגַפִּים本可指“翼、边缘”或附属队伍；本节处于列举军事同盟的语境，用“军队”自然地表达所指，同时以脚注保留字面的其他可能。
- source_word: בֵּית תּוֹגַרְמָה
  choice: 陀迦玛族
  rationale: בֵּית字面为“家、家族”，在此构成族群地理称谓；译作“陀迦玛族”比直译“陀迦玛家”更符合现代汉语，并保留其族群含义。
- source_word: יַרְכְּתֵי צָפוֹן
  choice: 从极北而来的
  rationale: 该短语字面指“北方的尽头、偏远之处”；“极北”简洁保留其遥远北方的地理意味。
- source_word: עַמִּים רַבִּים
  choice: 许多民族
  rationale: עַמִּים主要表示多个族群或人民；“民族”比现代政治意义较强的“国家”更贴近原文。
- source_word: אִתָּךְ
  choice: 与你同在
  rationale: 直接表达介词及第二人称单数后缀的关系；原文阴性语法形式在中文中无需标示。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。专名沿用常见中文音译；将“陀迦玛家”意译为较易懂的“陀迦玛族”。破折号保留原句由盟军名单转入总结陈述的结构。英语咨询层的脚注标记次序疑似错置：有关“军队”的词义脚注应置于该词后，而“极北”若需脚注则应置于相应短语后；本稿依希伯来原文，仅为确有词义歧义的אֲגַפִּים设置[a]。
