  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל גּוֹג֙ אֶ֣רֶץ הַ/מָּג֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֣שֶׁךְ וְ/תֻבָ֑ל וְ/הִנָּבֵ֖א עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/002.yaml
  text: Son of man, set your face toward Gog, of the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him.
translation:
  language: zh_hans
  text: “人子啊，你要面向玛各地的歌革，就是米设和土巴的最高首领，发预言攻击他。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: 人子
  rationale: 以传统而自然的称呼保留先知书中上帝对以西结的固定称谓。
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: 面向
  rationale: 保留希伯来语“把脸朝向”的意象，同时采用简洁自然的现代汉语表达。
- source_word: גּוֹג אֶרֶץ הַמָּגוֹג
  choice: 玛各地的歌革
  rationale: 将歌革视为人物、玛各视为地域，贴合句法关系，又不额外判定其历史身份。
- source_word: נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל
  choice: 米设和土巴的最高首领
  rationale: 将רֹאשׁ按普通名词“首、最高”理解，修饰“首领”；米设、土巴并列为其辖属对象。
- source_word: וְהִנָּבֵא עָלָיו
  choice: 发预言攻击他
  rationale: עַל在敌对预言语境中表示“针对、攻击”；此译法清楚传达审判性的指向。
theological_decisions:
- issue: רֹאשׁ是头衔修饰语还是专名“罗施”
  choice: 译作“最高”，形成“最高首领”
  alternative: 译作专名：“罗施、米设和土巴的首领”
  rationale: 无元音辅音文本本身容许讨论，但在此句法中把רֹאשׁ理解为普通名词并构成最高级意义较为自然，也与所给审定层一致；不把它强行关联现代民族或国家。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语；保留先知宣告的命令语气和审判张力。人物、地域名称按常见圣经译名处理。
