  text: לָ/כֵן֙ הִנָּבֵ֣א בֶן אָדָ֔ם וְ/אָמַרְתָּ֣ לְ/ג֔וֹג כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הֲ/ל֣וֹא בַּ/יּ֣וֹם הַ/ה֗וּא בְּ/שֶׁ֨בֶת עַמִּ֧/י יִשְׂרָאֵ֛ל לָ/בֶ֖טַח תֵּדָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/014.yaml
  text: 'Therefore prophesy[a], son of man, and say to Gog, ‘Thus says the Lord GOD: On that day, when my people Israel dwell securely, will you not know it?’'
translation:
  language: zh_hans
  text: 因此，人子啊，你要说预言，并对歌革说：‘主雅威如此说：到那日，我的子民以色列安然[a]居住时，你岂会不知道吗？’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安然”也可译作“平安无忧”。
    reason: 希伯来语 לָבֶטַח 可表示安稳、安全或无所惧怕地居住。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文并引出由此而来的命令，保留原文的推论关系。
- source_word: הִנָּבֵא
  choice: 你要说预言
  rationale: 准确表达先知受命宣告神谕的含义，也符合现代汉语表达。
- source_word: בֶן אָדָם
  choice: 人子啊
  rationale: 保留《以西结书》中反复出现的固定称呼及其文学连贯性。
- source_word: וְאָמַרְתָּ לְגוֹג
  choice: 对歌革说
  rationale: 自然表达接续的命令，并明确话语的对象。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留庄重的先知使者宣告格式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 在复合神名中区分 אֲדֹנָי 与 יהוה，并以中文圣经读者熟悉的形式呈现神的专名。
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 符合现代汉语中的先知性时间表达。
- source_word: בְּשֶׁבֶת עַמִּי יִשְׂרָאֵל לָבֶטַח
  choice: 我的子民以色列安然居住时
  rationale: 将不定式结构译作时间从句，保留以色列处于安稳居住状态的含义。
- source_word: הֲלוֹא ... תֵּדָע
  choice: 你岂会不知道吗
  rationale: 保留期待肯定回答的反问语气，同时不补出原文未明说的宾语。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”既区分“主”与四字神名，又采用普通中文圣经读者较熟悉的庄重表达；不把二者合并为重复的“主主”。
- issue: 歌革所“知道”的内容或方式
  choice: 你岂会不知道吗
  alternative: 你岂不会察觉吗
  rationale: ידע 的宾语在希伯来文中省略，既可指知道以色列安然居住，也可含获悉、察觉之意；正文不擅自补明对象，以保留语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留先知宣告公式与反问句式，并将脚注标记置于其实际说明的“安然”之后。
