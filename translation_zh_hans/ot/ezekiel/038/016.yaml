source:
  edition: WLC
  text: וְ/עָלִ֨יתָ֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל כֶּֽ/עָנָ֖ן לְ/כַסּ֣וֹת הָ/אָ֑רֶץ בְּ/אַחֲרִ֨ית הַ/יָּמִ֜ים תִּֽהְיֶ֗ה וַ/הֲבִאוֹתִ֨י/ךָ֙ עַל אַרְצִ֔/י לְמַעַן֩ דַּ֨עַת הַ/גּוֹיִ֜ם אֹתִ֗/י בְּ/הִקָּדְשִׁ֥/י בְ/ךָ֛ לְ/עֵינֵי/הֶ֖ם גּֽוֹג־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/016.yaml
  text: And you will come up against my people Israel like a cloud to cover the land. In the latter days it will happen that I will bring you against my land[a], so that the nations may know me when I show myself holy through you before their eyes, O Gog.
translation:
  language: zh_hans
  text: 你必上来攻击我的子民以色列，如密云遮盖那地。在末后的日子，这事必发生；我必带你来攻击我的地，好让列国认识我——当我在他们眼前借着你显为圣[a]的时候，歌革啊！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着你显为圣”也可译作“在你身上使自己显为圣”。
    reason: 保留בְהִקָּדְשִׁי בְךָ中介词בְּ的词义范围及较直译表达。
lexical_decisions:
- source_word: וְעָלִיתָ עַל עַמִּי יִשְׂרָאֵל
  choice: 你必上来攻击我的子民以色列
  rationale: עלה与עַל用于军事行动时表示上来进犯；“上来攻击”既保留移动意象，也清楚表达敌对含义。“我的子民以色列”保留立约性的所属表达。
- source_word: כֶּעָנָן לְכַסּוֹת הָאָרֶץ
  choice: 如密云遮盖那地
  rationale: 保留明确的云彩比喻；“那地”依上下文指以色列之地。中文以“密云”自然表达云层覆盖之势，而不把范围扩大为全地球。
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: 末后的日子
  rationale: 保留先知性惯用语及其末世张力，同时不限定具体时间体系。
- source_word: תִּהְיֶה
  choice: 这事必发生
  rationale: 阴性单数动词在此概括前述事件；译为“这事必发生”符合现代汉语，也保留事件性的语义。
- source_word: וַהֲבִאוֹתִיךָ עַל אַרְצִי
  choice: 我必带你来攻击我的地
  rationale: בוא的使役式表达上帝使歌革来到；敌对语境中的עַל译为“攻击”。“我的地”保留上帝对该地的宣称。
- source_word: לְמַעַן דַּעַת הַגּוֹיִם אֹתִי
  choice: 好让列国认识我
  rationale: 明确表达目的；“认识我”保留ידע在此具有的启示性和关系性，不缩减为仅仅知道信息。
- source_word: בְּהִקָּדְשִׁי בְךָ
  choice: 当我借着你显为圣的时候
  rationale: 希伯来语表明上帝的圣洁借歌革身上所发生之事公开彰显。“显为圣”避免让人误以为上帝需要变得更加圣洁；בְךָ可有“在你身上”或“借着你”的表达空间，正文采用自然而未过度说明审判方式的译法。
- source_word: לְעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 保留公开、可见的意象，且为自然的现代汉语。
- source_word: גּוֹג
  choice: 歌革啊
  rationale: 句末名称具有呼语作用；用“啊”明确直接称呼。
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים的末世性表达
  choice: 末后的日子
  alternative: 日后；末日
  rationale: “末后的日子”保留该先知性短语的时间张力，却不把它强行纳入某一种末世时间表。“末日”在现代汉语中可能过度限定为世界终结的单一时点。
- issue: בְּהִקָּדְשִׁי בְךָ的上帝自显为圣语言
  choice: 当我借着你显为圣的时候
  alternative: 当我在你身上使自己显为圣的时候；当我在你身上被尊为圣的时候
  rationale: 正文传达上帝的圣洁在列国眼前公开彰显，而不是上帝的本质发生改善。同时以脚注保存בְךָ较直译的“在你身上”，避免消除其方式或范围上的真实歧义。
- issue: 上帝带歌革攻击其地的主权与责任张力
  choice: 我必带你来攻击我的地
  alternative: 我必使你来到我的地
  rationale: 译文保留使役动词和敌对介词，直接呈现上帝对事件的主权；不额外解释歌革的道德责任，也不替经文消解两者之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“上来攻击”“密云遮盖”“末后的日子”“显为圣”等表达兼顾原文意象、先知文体与普通读者的可理解性；不采用带有特定宗派末世体系的术语。
