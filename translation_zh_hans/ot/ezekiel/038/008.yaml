revisions:
- from: 过了许多日子，你必被召集[a]。在末后的年间[b]，你必来到以色列的群山，来到一片脱离刀剑、得以恢复的土地；这地的民众从许多民族中被招聚而来[c]。这些山曾长期荒凉；这地的民众从列族中被领出来，全都安然居住。
  to: 过了许多日子，你必被召集[a]；在末后的年间[b]，你必来到一片脱离刀剑、得以复兴的土地，就是以色列的群山。这地的居民从许多民族中被招聚归来[c]；这些山曾一直荒凉。这地又从列族中被领出来，他们全都安然居住。
  rationale: 修订保留原文的时间语、被动式和战争意象，并以“就是以色列的群山”恢复土地与群山的定位关系。为使中文可理解，正文两处明示“这地的居民／他们”，脚注则明确原文语法上仍以“土地”为阴性单数对象，避免将这种集合性表达误作无歧义的字面陈述。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:55:09Z'
review_pass:
  verdict: revise
  source_fidelity: 译文基本把握了“被召集”“末后的年间”和安然居住的意思，但将原文连续修饰“土地”的两个分词结构拆开后，句法关系不够清楚；且“这地的民众从列族中被领出来”之后直接接“全都安然居住”，代词所指在中文中略显突兀。应更清晰地交代“土地”与其居民的集合性表达，同时保留原文的语法张力。
  naturalness: 现有译文的“来到以色列的群山，来到一片……”重复“来到”，且“这些山曾长期荒凉；这地的民众……”使原文的修饰链和转折关系显得断裂。调整语序及指代后可更符合现代庄重书面汉语。
  terminology: “末后的年间”“刀剑”“列族”“安然居住”均适合先知文学语体。“被召集”可保留，既反映被动式也保留军事语境。
