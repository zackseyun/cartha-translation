  text: מִ/יָּמִ֣ים רַבִּים֮ תִּפָּקֵד֒ בְּ/אַחֲרִ֨ית הַ/שָּׁנִ֜ים תָּב֣וֹא אֶל אֶ֣רֶץ מְשׁוֹבֶ֣בֶת מֵ/חֶ֗רֶב מְקֻבֶּ֨צֶת֙ מֵ/עַמִּ֣ים רַבִּ֔ים עַ֚ל הָרֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר הָי֥וּ לְ/חָרְבָּ֖ה תָּמִ֑יד וְ/הִיא֙ מֵ/עַמִּ֣ים הוּצָ֔אָה וְ/יָשְׁב֥וּ לָ/בֶ֖טַח כֻּלָּֽ/ם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/008.yaml
  text: After many days you will be mustered[a]; in the latter years you will come into a land restored from the sword, gathered from many peoples, onto the mountains of Israel, which had been a continual waste; but it was brought out from the peoples[b], and all of them will dwell securely.
translation:
  language: zh_hans
  text: 过了许多日子，你必被召集[a]；在末后的年间[b]，你必来到一片脱离刀剑、得以复兴的土地，就是以色列的群山。这地的居民从许多民族中被招聚归来[c]；这些山曾一直荒凉。这地又从列族中被领出来，他们全都安然居住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你必被点召”“你必被召来”。原文在这里很可能指为行动而被召集或调集。
    reason: lexical_alternative
  - marker: b
    text: 原文是“末后的年间”，不是先知书中较常见的“末后的日子”。
    reason: source_wording
  - marker: c
    text: 原文在语法上以“土地”为“从许多民族中被招聚”和“从列族中被领出”的对象；这是一种以土地代表其居民的集合性表达。
    reason: referential_ambiguity
lexical_decisions:
- source_word: תִּפָּקֵד
  choice: 你必被召集
  rationale: 该词是פקד的Nifal未完成式。在出征语境中，表示被点召、召集或调集；“被召集”既保留被动语态和军事意味，也避免把含义限定为现代征兵制度。
- source_word: בְּאַחֲרִית הַשָּׁנִים
  choice: 在末后的年间
  rationale: 原文直指“年间的末后阶段”，有别于先知书中更常见的“末后的日子”；此译保留这种措辞差异。
- source_word: אֶרֶץ מְשׁוֹבֶבֶת מֵחֶרֶב
  choice: 一片脱离刀剑、得以恢复的土地
  rationale: מְשׁוֹבֶבֶת表达被恢复、被带回的状态；“刀剑”在此指战争与其毁坏。“脱离刀剑、得以恢复”兼顾意象和实际语义。
- source_word: מְקֻבֶּצֶת מֵעַמִּים רַבִּים
  choice: 这地的民众从许多民族中被招聚而来
  rationale: 希伯来文在语法上以阴性单数修饰“土地”，把土地及其居民作为整体来描写。中文若直说“土地被招聚”容易误解，因此在正文中明示民众，并以脚注说明原文表达。
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: 来到以色列的群山
  rationale: עַל与表示移动的תָּבוֹא连用，表示朝向并抵达山地；中文用“来到”自然体现方向和落点。
- source_word: אֲשֶׁר הָיוּ לְחָרְבָּה תָּמִיד
  choice: 这些山曾长期荒凉
  rationale: 关系代词的先行词最自然是复数的“以色列的群山”。תָּמִיד在此表达延续已久的状态，译作“长期”而非绝对意义的“永远”。
- source_word: וְהִיא מֵעַמִּים הוּצָאָה
  choice: 这地的民众从列族中被领出来
  rationale: 原文阴性单数代词回指“土地”，以土地代表其中的居民。中文显明“民众”，避免产生土地被实体搬运的错误印象，同时借脚注保留原文的整体化表达。
- source_word: וְיָשְׁבוּ לָבֶטַח כֻּלָּם
  choice: 全都安然居住
  rationale: יָשַׁב לָבֶטַח是安稳、安全居住的固定表达；“全都”保留כֻּלָּם的强调。
theological_decisions:
- issue: 末世性时间用语
  choice: 在末后的年间
  alternative: 在末后的日子／到了年岁的末期
  rationale: 本节用“年间”而不是更常见的“日子”。译文不把两种先知性表达强行等同，以保留原文措辞及其可能的时间张力。
- issue: 土地与居民的整体描写
  choice: 正文明确“这地的民众”，脚注说明原文把“土地”作为被招聚、被领出的对象
  alternative: 直译为“这地从许多民族中被招聚／被领出来”
  rationale: 原文的阴性形式确实回指“土地”，但语义包含居民。采用中文可理解的表达，同时不把原文的拟人化和集合性悄然抹去。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“刀剑”“列族”“安然居住”保留先知文学的语体；通过分句理清希伯来文较长的修饰结构，但不改变事件次序。
