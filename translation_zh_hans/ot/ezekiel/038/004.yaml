id: EZK.38.4
reference: Ezekiel 38:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שׁ֣וֹבַבְתִּ֔י/ךָ וְ/נָתַתִּ֥י חַחִ֖ים בִּ/לְחָיֶ֑י/ךָ וְ/הוֹצֵאתִי֩ אוֹתְ/ךָ֨ וְ/אֶת כָּל חֵילֶ֜/ךָ סוּסִ֣ים וּ/פָרָשִׁ֗ים לְבֻשֵׁ֤י מִכְלוֹל֙ כֻּלָּ֔/ם קָהָ֥ל רָב֙ צִנָּ֣ה וּ/מָגֵ֔ן תֹּפְשֵׂ֥י חֲרָב֖וֹת כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/004.yaml
  text: I will turn you around[a], put hooks in your jaws, and bring you out—you and all your army, horses and horsemen, all of them clothed in full armor, a great assembly with shield and buckler[b], all of them wielding swords.
translation:
  language: zh_hans
  text: 我要使你转向[a]，把钩子钩在你的两腮上[b]，并把你和你的全军带出来：马匹和骑兵，全都穿戴齐备；一大群人，持着大盾和小盾，人人手持刀剑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使你转向”也可译作“使你转回”或“使你掉转方向”。
    reason: lexical_alternative
  - marker: b
    text: “两腮”也可译作“颌部”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹבַבְתִּיךָ
  choice: 我要使你转回
  rationale: 该动词在此表达使对方转向或返回；译文保留方向含义及耶和华主动支配歌革行动的语气，而不具体断定行进路线。
- source_word: חַחִים
  choice: 钩子
  rationale: 指用来控制牲畜或俘虏的钩具，保留先知话语中强烈、具体的形象。
- source_word: בִּלְחָיֶיךָ
  choice: 钩住你的两腮
  rationale: לְחִי 可指腮或颌；与钩子搭配时，两者皆可成立。正文采用“两腮”以贴近身体部位的复数形式，并在脚注保留“颌骨”的可能。
- source_word: וְהוֹצֵאתִי אוֹתְךָ
  choice: 将你……带出来
  rationale: 使役形明确表示耶和华使歌革出来，故采用自然的现代汉语“带出来”。
- source_word: חֵילֶךָ
  choice: 你的全军
  rationale: חַיִל 在此军事语境中指军队或兵力，“全军”清楚自然。
- source_word: סוּסִים וּפָרָשִׁים
  choice: 马匹和骑兵
  rationale: 保留原文“马”和“骑乘者”的并列表达；“骑兵”符合现代军事语体。
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: 装备齐全
  rationale: 该短语可指穿戴完备，也可能带有华美之意；紧邻军事装备的语境支持译作全副配备，但避免将其狭义限定为某种特定铠甲。
- source_word: קָהָל רָב
  choice: 一支庞大的军队
  rationale: קָהָל 本义为聚集的群体；此处所聚集的是武装部队，译作“庞大的军队”比直译“大会众”更符合现代汉语语境。
- source_word: צִנָּה וּמָגֵן
  choice: 大盾和小盾
  rationale: 两个希伯来词指不同种类或大小的盾牌，通常前者较大、后者较小；明确译出区别，便于现代读者理解。
- source_word: תֹּפְשֵׂי חֲרָבוֹת
  choice: 挥舞刀剑
  rationale: 分词字面表示抓持、执拿刀剑；“挥舞”传达备战姿态，但比单纯“手持”略具动态性。
- source_word: כֻּלָּם
  choice: 全都；人人都
  rationale: 原文两次重复，强调这支军队无一例外；中文分别以“全都”和“人人都”保留强调而避免生硬重复。
theological_decisions:
- issue: 上帝在歌革出兵中的主动作用
  choice: 以“使你转回”“钩住”“带出来”保留耶和华强烈而直接的行动主体地位。
  alternative: 弱化为上帝仅仅容许或任凭歌革出兵。
  rationale: 连续的第一人称使役动词呈现明确的神圣主动性；译文不将其改写为许可，也不进一步解释这与歌革自身意图之间的关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“钩住你的两腮”保留先知性审判意象；“装备齐全”“庞大的军队”“大盾和小盾”避免古奥军事术语，同时维持原文的军阵气势。
