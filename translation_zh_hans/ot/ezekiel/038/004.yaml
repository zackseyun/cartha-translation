- from: 我要使你转回[a]，把钩子钩住你的两腮[b]，将你和你的全军都带出来；其中有马匹和骑兵，全都装备齐全，是一支庞大的军队，拿着大盾和小盾，人人都挥舞刀剑。
  to: 我要使你转向[a]，把钩子钩在你的两腮上[b]，并把你和你的全军带出来：马匹和骑兵，全都穿戴齐备；一大群人，持着大盾和小盾，人人手持刀剑。
  rationale: 修正钩子意象在中文中的施受关系，避免“挥舞”所增加的动作色彩，并收紧军队清单的句法。修订仍保留原文对歌革及其军队的神圣主动引导、两类盾牌的区分，以及重复“全都／人人”的全面性强调。
