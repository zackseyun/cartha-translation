  terminology: “全军”“马匹和骑兵”“大盾和小盾”均适切。“两腮”可用以表达该词的面颊／颌部范围；脚注宜保留“颌部”这一较中性的替代，而非过于具体的“颌骨”。“手持刀剑”比“挥舞刀剑”更贴合תֹּפְשֵׂי。
