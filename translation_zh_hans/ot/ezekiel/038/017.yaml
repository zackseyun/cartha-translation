source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַֽ/אַתָּה ה֨וּא אֲשֶׁר דִּבַּ֜רְתִּי בְּ/יָמִ֣ים קַדְמוֹנִ֗ים בְּ/יַד֙ עֲבָדַ/י֙ נְבִיאֵ֣י יִשְׂרָאֵ֔ל הַֽ/נִּבְּאִ֛ים בַּ/יָּמִ֥ים הָ/הֵ֖ם שָׁנִ֑ים לְ/הָבִ֥יא אֹתְ/ךָ֖ עֲלֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/017.yaml
  text: 'Thus says the Lord GOD: Are you the one of whom I spoke in former days by the hand of my servants the prophets of Israel[c][b][a], who prophesied in those days for years that I would bring you against them?'
translation:
  language: zh_hans
  text: 主耶和华如此说：“你就是我从前[b]借着我仆人——以色列的众先知[a]所说的那一位吗？那些先知在那些日子里多年[c]预言，说我要带你来攻击他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“借我仆人以色列众先知的手”；“借……的手”是表示“借着、通过”的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “从前”也可译为“古时”或“往昔的日子”。
    reason: lexical_alternative
  - marker: c
    text: 原文为“在那些日子，年”；措辞不寻常，强调这些预言延续了多年。
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 采用现代中文圣经语体中清楚、庄重的复合神名译法，既表达 אֲדֹנָי 的“主”，也保留 יְהוִה 作为专名的传统中文形式。
- source_word: הַאַתָּה הוּא
  choice: 你就是……那一位吗
  rationale: 两个独立代词构成强调性的问句；此译法自然传达带有指认意味的发问，而不额外加入“难道”等更强的语气。
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: 我……所说的
  rationale: 关系从句表示上帝先前曾说到这个人；中文用“所说的那一位”简明自然。
- source_word: בְּיָמִים קַדְמוֹנִים
  choice: 从前
  rationale: 表达昔日、古时的时间指向，符合现代中文，又避免过度古雅。
- source_word: בְּיַד
  choice: 借着
  rationale: 希伯来语直译为“借……的手”，在此是表示先知作为传话媒介的惯用语；正文采用自然中文“借着”，脚注保留原文意象。
- source_word: עֲבָדַי נְבִיאֵי יִשְׂרָאֵל
  choice: 我仆人以色列的众先知
  rationale: 保留“我的仆人”这一受差遣者称谓，并将“以色列的先知”处理为同位性身份说明。
- source_word: הַנִּבְּאִים
  choice: 那些先知……预言
  rationale: 分词说明这些先知持续从事的活动；中文另起一句并复指“那些先知”，使长句清楚而不改变施事者。
- source_word: בַּיָּמִים הָהֵם שָׁנִים
  choice: 在当时多年
  rationale: 保留原文“那些日子”与“年”的紧密并列及延续时间的含义，不擅自增添“许多”或确定具体年数。
- source_word: לְהָבִיא אֹתְךָ עֲלֵיהֶם
  choice: 我要带你来攻击他们
  rationale: 不定式在语境中表达先前预言的内容；עַל 在军事语境中译作“攻击”，末尾复数代词仍译为“他们”，避免把正文未明说的指称直接替换为专名。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”在现代简体中文中庄重且易识别，也避免把专名完全化为称号；脚注并非本节理解所必需，故不另加神名争议说明。
- issue: 问句语气是否强化为反问
  choice: 你就是……吗
  alternative: 难道你不就是……吗
  rationale: 原文确有强调和指认意味，但其形式仍可作为直接疑问理解；正文不加入“难道不”，以免把语用力度解释得过满。
- issue: עֲלֵיהֶם 中“他们”的指称
  choice: 保留代词“他们”
  alternative: 明确译作“以色列人”
  rationale: 上下文大体指向以色列，但本节希伯来文本只用代词。保留代词可避免在正文中消除原有的指称张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留先知宣告的正式语气，同时拆分过长的关系从句以提高可读性；不使用过度古雅的“昔日”“藉手”，也不把末尾代词解释性改写为“以色列人”。
