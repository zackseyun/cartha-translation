  to: 主耶和华如此说：“你就是我从前[b]借着我仆人——以色列的众先知[a]所说的那一位吗？那些先知在那些日子里多年[c]预言，说我要带你来攻击他们。”
  rationale: 修订仅改善现代汉语的句法清晰度和自然度：以破折号显明“我的仆人”与“以色列的众先知”的同位关系；将“在当时多年”改为“在那些日子里多年”，并以“说”清楚引出预言内容。保留原文的直接问句、时间上的模糊性、神名译法和末尾“他们”的未明指称。
