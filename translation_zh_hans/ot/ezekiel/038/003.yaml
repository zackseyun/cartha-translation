  text: וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ גּ֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֥שֶׁךְ וְ/תֻבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/003.yaml
  text: 'and say, ‘Thus says the Lord GOD: Behold, I am against you, Gog, chief prince of Meshech and Tubal.’'
translation:
  language: zh_hans
  text: 你要说：‘主耶和华如此说：看哪，歌革，我要与你为敌！你是米设和土巴的最高首领[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “最高首领”也可译作“罗施、米设和土巴的首领”；这里的希伯来词 רֹאשׁ 通常意为“头、首要”，也有人将其理解为专名“罗施”。
    reason: 原文在普通名词“首要”与专名“罗施”之间存在真实的词汇和句法解释差异，正文采用较可能的读法，脚注保留另一读法。
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你要说
  rationale: 该词是带连接词的第二人称阳性单数完成式，在连续命令语境中承担指令功能；译为“你要说”自然且准确。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留 אֲדֹנָי 的“主”与神圣名 יהוה 的传统中文音译“耶和华”，并避免把两个称谓合并。
- source_word: הִנְנִי אֵלֶיךָ
  choice: 看哪……我要与你为敌
  rationale: הִנְנִי 带有郑重宣告意味；אֵלֶיךָ 在此敌对审判语境中表示“针对你、与你为敌”，不宜机械译作“向着你”。
- source_word: גּוֹג
  choice: 歌革
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: 米设和土巴
  rationale: 采用这两个专名在现代中文圣经中的通行音译。
- source_word: נְשִׂיא רֹאשׁ
  choice: 最高首领
  rationale: 按马所拉重音和句法，将 רֹאשׁ 理解为修饰 נְשִׂיא 的“首要、最高”；同时以脚注保留将其视为专名“罗施”的可能性。
theological_decisions:
- issue: רֹאשׁ 是普通名词还是专名
  choice: 正文译作“最高首领”
  alternative: “罗施、米设和土巴的首领”
  rationale: 马所拉重音及希伯来语的自然句法较支持“米设和土巴的最高首领”；但古译本与后世解释中存在将 רֹאשׁ 视作地名“罗施”的传统，因此不应抹去该歧义。
- issue: 神向歌革所说 אֵלֶיךָ 的关系含义
  choice: “我要与你为敌”
  alternative: “我反对你”或较直译的“我面向你”
  rationale: 上下文是神针对歌革发出的审判宣告，“与你为敌”清楚表达敌对指向，同时不额外引入具体审判方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如此说”和“看哪”保留先知宣告的正式语气；用感叹号体现敌对宣告的力度，但不添加原文没有的内容。
