  text: וְ/אָמַרְתָּ֗ אֶֽעֱלֶה֙ עַל אֶ֣רֶץ פְּרָז֔וֹת אָבוֹא֙ הַ/שֹּׁ֣קְטִ֔ים יֹשְׁבֵ֖י לָ/בֶ֑טַח כֻּלָּ֗/ם יֹֽשְׁבִים֙ בְּ/אֵ֣ין חוֹמָ֔ה וּ/בְרִ֥יחַ וּ/דְלָתַ֖יִם אֵ֥ין לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/011.yaml
  text: and you will say[a], ‘I will go up against a land of unwalled villages; I will come against those who are at rest, who dwell securely, all of them dwelling without walls[d][c][b], and having no bars or gates.’
translation:
  language: zh_hans
  text: 你会说：‘我要上去攻打一片无城墙的乡村地区；我要去攻击那些安宁无扰、安稳居住的人。他们全都住在无城墙之处，也没有门闩和门。[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门”直译为“门”或“双扇门”；也可按防御设施的语境译为“城门”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 你心里会说
  rationale: 该动词本义为“你会说”；结合上一节“心里起意”的语境，汉语用“心里会说”自然承接内在谋划，但不把它弱化为单纯“想”。
- source_word: אֶעֱלֶה עַל
  choice: 我要上去攻打
  rationale: 保留עלה“上去”的方向意味；介词עַל结合敌对语境译作“攻打”。
- source_word: אֶרֶץ פְּרָזוֹת
  choice: 没有城墙的村庄之地
  rationale: פְּרָזוֹת指开放、无防御墙的乡村聚落；此译既表达聚落性质，也与后文没有城墙相呼应。
- source_word: אָבוֹא
  choice: 我要去攻击
  rationale: בוא本义是“来/去、进入”；敌对语境使“攻击”明确，但该敌对含义主要来自上下文。
- source_word: הַשֹּׁקְטִים
  choice: 安居无扰的人
  rationale: שקט表示安静、平稳、不受侵扰；“安居无扰”兼顾生活状态与未受搅扰的意味。
- source_word: יֹשְׁבֵי לָבֶטַח
  choice: 住得安稳的人
  rationale: 保留ישב的居住含义，并以“安稳”表达בֶטַח所指的安全、无所畏惧状态。
- source_word: כֻּלָּם יֹשְׁבִים בְּאֵין חוֹמָה
  choice: 他们全都住在没有城墙的地方
  rationale: 将希伯来语的独立说明性分句自然译出；חוֹמָה虽为单数，在此作集合性表达，汉语“没有城墙”无需标示数。
- source_word: וּבְרִיחַ וּדְלָתַיִם אֵין לָהֶם
  choice: 没有门闩，也没有城门
  rationale: בְרִיחַ是固定门或城门的闩；דְלָתַיִם字面为双扇门，在防御设施语境中译“城门”较自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。以两个相连的攻击意向句保留原文推进感，并把“他们全都……”处理为解释其易受攻击之处的独立分句。
