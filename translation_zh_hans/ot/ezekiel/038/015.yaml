revisions:
- from: 你必从自己的地方，从北方极远之处而来[a]；你和许多民族都与你同来。他们全都骑着马，是一大群会众，也是一支庞大的军队[b]。
  to: 你必从你的地方，从北方极远之处而来[a]；你和许多随你而来的民族，都骑着马；他们是一大群集，也是一支强大的军队[b]。
  rationale: 修订消除“都与你同来”的自指歧义，以“随你而来的民族”准确表达אִתָּךְ；将“会众”改为中性的“大群集”，以避免不必要的宗教联想；并调整脚注b，使其更符合军事语境及汉语习惯。分号后的“他们”回指你及随行民族这一整体，承接“全都骑马”和后续的群集、军队描述。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:54:10Z'
