  source_fidelity: 译文总体准确传达了将来性的来临、从北方最远处而来、许多族群随行、全都骑马，以及其为大群集和强大军力。惟“你和许多民族都与你同来”中“都”容易使“你”也被修饰为“与你同来”，形成轻微的自指不顺；原文的“全都”更直接修饰骑马者/随行群体。
  naturalness: “从自己的地方”略显冗余，现代汉语以“从你的地方”更自然。“一大群会众”在汉语中仍较强地带有宗教群体色彩，且与骑兵军势语境不够贴切；“大群集”或“大队人马”更自然。
  terminology: “民族”可对应עַמִּים，予以保留。“大群集”和“强大的军队”分别较中性、准确地表达קָהָל גָּדוֹל与חַיִל רָב，不引入“会众”的教会性联想。
