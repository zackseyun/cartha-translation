  text: וּ/בָ֤אתָ מִ/מְּקֽוֹמְ/ךָ֙ מִ/יַּרְכְּתֵ֣י צָפ֔וֹן אַתָּ֕ה וְ/עַמִּ֥ים רַבִּ֖ים אִתָּ֑/ךְ רֹכְבֵ֤י סוּסִים֙ כֻּלָּ֔/ם קָהָ֥ל גָּד֖וֹל וְ/חַ֥יִל רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/015.yaml
  text: And you will come from your place[a], from the far north—you and many peoples with you[b], all of them riding horses—a great assembly and a mighty army.
translation:
  language: zh_hans
  text: 你必从你的地方，从北方极远之处而来[a]；你和许多随你而来的民族，都骑着马；他们是一大群集，也是一支强大的军队[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “北方极远之处”也可译作“北方的尽头”或“极北之地”。希伯来语惯用语指北方最遥远的区域。
    reason: lexical_alternative
  - marker: b
    text: “一大群集，也是一支强大的军队”也可译作“一大队人马和一支庞大的军队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: 你必……而来
  rationale: 连词加Qal完成式第二人称阳性单数在先知话语中具有将来意味；“必……而来”既表达预告的确定性，也保留叙事承接。
- source_word: מִמְּקוֹמְךָ
  choice: 从自己的地方
  rationale: מָקוֹם基本义为“地方”；加“自己的”自然对应第二人称所有格，不把含义收窄为特定驻地。
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: 从北方极远之处
  rationale: יַרְכְּתֵי在地理表达中指边远、尽头之地；此译比单说“遥远的北方”更充分保留希伯来语的极远意味。
- source_word: אַתָּה וְעַמִּים רַבִּים אִתָּךְ
  choice: 你和许多民族都与你同来
  rationale: 保留独立代词“你”的强调，并以“民族”表达עַמִּים所指的多个族群；补出“同来”使现代汉语顺畅，但不增加新的行动。
- source_word: רֹכְבֵי סוּסִים כֻּלָּם
  choice: 他们全都骑着马
  rationale: 按字面呈现“骑马者”，并明确保留כֻּלָּם的总体范围。
- source_word: קָהָל גָּדוֹל
  choice: 一大群会众
  rationale: קָהָל指聚集起来的群体；“会众”保留集合性，配以“一大群”避免在军事语境中被误解为宗教专称。
- source_word: וְחַיִל רָב
  choice: 也是一支庞大的军队
  rationale: חַיִל在本节军事语境中自然指军队或武力；רָב在此侧重规模巨大，故译“庞大”。
theological_decisions: []
