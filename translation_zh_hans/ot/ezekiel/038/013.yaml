base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/013.yaml
  text: Sheba and Dedan and the merchants of Tarshish, with all her young lions, will say to you, ‘Have you come to take plunder? Have you assembled your company to seize silver and gold, to take livestock and goods, to take great plunder?’
translation:
  language: zh_hans
  text: 示巴、底但和他施的商人，以及他施所有的少壮狮子[a]，都要问你：‘你来是要夺取掠物吗？你召集这支队伍，是要夺取金银，掳走牲畜和财物，掠夺大批财物吗？’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “少壮狮子”可能是对他施所属的权贵或首领的比喻；原文所指并不确定。
    reason: 保留原文意象及其解释空间，同时帮助现代读者理解这并非必然指实际的狮子。
lexical_decisions:
- source_word: כְפִירֶיהָ
  choice: 他施所有的少壮狮子
  rationale: 保留马所拉文本鲜明而含义不完全确定的“少壮狮子”意象；阴性单数后缀在上下文中最自然地回指“他施”。另以脚注说明它可能比喻有权势的人。
- source_word: שָׁלָל / בַּז
  choice: 掠物／夺取
  rationale: 原文交替使用两个意义相近的掠夺词根；中文以“夺取掠物”“夺取”及末尾“大肆抢掠”自然再现其反复强调，而不机械重复。
- source_word: קְהָלֶךָ
  choice: 这支队伍
  rationale: קהל在这里指为进攻而召集起来的一群人；“队伍”既符合军事语境，也不把它过度限定为正规军。
- source_word: מִקְנֶה וְקִנְיָן
  choice: 牲畜和财物
  rationale: מִקְנֶה明确指牲畜，קִנְיָן泛指所得、产业或财物；此译简洁体现两者差别。
theological_decisions:
- issue: “少壮狮子”所指的身份
  choice: 正文保留字面意象，不确定具体身份
  alternative: 译作“权贵”“首领”或“村庄”
  rationale: 该表达可能比喻他施所属的强势人物或统治者，但原文没有明确说明；直译并加注可避免把一种解释写入正文。
- issue: 问句是否表达谴责或单纯询问
  choice: 保留直接问句，不增添动机判断
  alternative: 译成带明确谴责意味的反问
  rationale: 疑问词 הֲ 可构成带质询意味的问题，但经文本身未明说说话者是在谴责、惊讶还是盘问，因此不额外定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“大肆抢掠”自然表达末尾“抢掠大量掠物”的加强语气；标点采用中文全角引号和问号。
