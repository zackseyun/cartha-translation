  text: וּ/בְ/קִנְאָתִ֥/י בְ/אֵשׁ עֶבְרָתִ֖/י דִּבַּ֑רְתִּי אִם לֹ֣א בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ רַ֣עַשׁ גָּד֔וֹל עַ֖ל אַדְמַ֥ת יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/019.yaml
  text: 'For in my jealousy[a], in the fire of my wrath, I have spoken: surely on that day there will be a great earthquake upon the land of Israel.'
translation:
  language: zh_hans
  text: 因为我因忌邪，在烈怒之火中已经说过：那日，以色列的土地上必有一场大地震。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地震”也可译作“大震动”或“大震荡”。希伯来语 רַעַשׁ 的含义可以较宽泛，不过按本节语境译作“大地震”很合适。
    reason: 词义备选
lexical_decisions:
- source_word: וּבְקִנְאָתִי
  choice: 因为我满怀忌邪
  rationale: 句首连词按上下文译为“因为”，承接前文的神谕；קִנְאָה 译作“忌邪”，保留神因圣约关系而发的强烈、排他的愤慨，不弱化为一般的“热心”。
- source_word: בְאֵשׁ עֶבְרָתִי
  choice: 在烈怒之火中
  rationale: 保留“火”的比喻意象；עֶבְרָה 表达强烈、满溢的愤怒，译为“烈怒”庄重而清楚。
- source_word: דִּבַּרְתִּי
  choice: 已经说过
  rationale: 以完成体表达已经发出、如今仍然有效的郑重话语，同时不额外加入原文没有的说话者标签。
- source_word: אִם לֹא
  choice: 必
  rationale: 这里是誓言式的强烈肯定，并非普通的条件句；汉语以“必”自然表达其确定和郑重的语气。
- source_word: בַּיּוֹם הַהוּא
  choice: 那日
  rationale: 采用简洁庄重的现代汉语，保留先知话语中指向特定日子的表达。
- source_word: יִהְיֶה
  choice: 必有
  rationale: 按 היה 的存在用法译出，并与誓言式语气结合，表达事件必然发生。
- source_word: רַעַשׁ גָּדוֹל
  choice: 一场大地震
  rationale: רַעַשׁ 可指震动、震荡或地震；结合“以色列的土地上”及随后自然界剧烈动荡的语境，“大地震”最清楚自然，同时在脚注中保留较宽泛的词义。
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: 以色列的土地上
  rationale: אַדְמָה 可指土地、地面或土壤；此处译为“土地”最符合地理语境，עַל 则以方位词“上”表达。
theological_decisions:
- issue: 是否弱化神的情感性语言
  choice: 我满怀忌邪，在烈怒之火中
  alternative: 我大发热心，施行严厉审判
  rationale: 原文以强烈而具人格性的语言描述神的忌邪和烈怒；译文保留这种张力，不将其改写为抽象、非情感性的审判概念。
- issue: 是否补出神的说话者身份
  choice: 保留第一人称话语，不添加“主耶和华说”
  alternative: 补译“主耶和华说”
  rationale: 本节在上下文中延续神的直接发言，但本节希伯来文本没有新的说话者标签，因此不予增补。
- issue: אִם לֹא 的誓言式语气
  choice: 以“必”表达强烈肯定
  alternative: 按字面译为“若不”
  rationale: 此结构在这里具有誓言式断言功能；直译成条件句会误导读者，但译为“必”也不额外说明誓言的具体形式。
translation_notes:
  register: 采用现代、庄重而易懂的先知话语体。“满怀忌邪”使希伯来语介词结构在汉语中自然，同时保留其强烈情感；“烈怒之火”保留原文意象。“已经说过”表达完成而仍具效力的神圣宣告。
