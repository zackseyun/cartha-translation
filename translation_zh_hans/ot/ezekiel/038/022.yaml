base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/022.yaml
  text: And I will enter into judgment with him by pestilence and bloodshed[a]; and I will rain down on him, on his troops, and on the many peoples who are with him, torrential rain, hailstones, fire[c][b], and sulfur.
translation:
  language: zh_hans
  text: 我要以瘟疫和流血审判他；我要使暴雨、冰雹、火和硫磺降在他、他的部队[a]和与他同在的许多民族身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的队伍”或“他的军旅”；希伯来词在这里指随同他的武装力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: 我要……审判他
  rationale: 该尼法勒式配合介词 אֵת 表示对某人采取司法行动。中文直译为“与他争讼”虽能保留形式，却容易使人误解为双方对等诉讼；“审判他”自然地表达其司法和敌对含义。
- source_word: בְּדֶבֶר וּבְדָם
  choice: 以瘟疫和流血的事
  rationale: דֶּבֶר 指作为审判手段的瘟疫；דָּם 在此以“血”代指暴力死亡或流血事件。“流血的事”既保留血的意象，也符合现代汉语。
- source_word: וְגֶשֶׁם שׁוֹטֵף
  choice: 暴雨
  rationale: שׁוֹטֵף 描写冲刷、漫溢的强降雨。“暴雨”简洁自然，传达猛烈倾泻的雨势。
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: 冰雹
  rationale: 该词组字面为“冰雹之石”，通常指冰雹；现代汉语用“冰雹”即可清楚表达。
- source_word: אֵשׁ וְגָפְרִית
  choice: 火和硫磺
  rationale: 采用现代而直接的对应词，保留两种具体审判灾害，不将其抽象化。
- source_word: אַמְטִיר
  choice: 我要把……降在……身上
  rationale: 该使役形表示使雨或其他物体从天降下；中文以“把……降在……身上”自然涵盖整项降灾清单。
- source_word: אֲגַפָּיו
  choice: 他的部队
  rationale: 该词本可表示翼、侧翼或成队的军力，在此军事语境中指随同歌革的武装力量；“部队”清楚而不过度限定其组织形式。
- source_word: עַמִּים רַבִּים אֲשֶׁר אִתּוֹ
  choice: 与他同在的许多民族
  rationale: עַמִּים 指多个人民或民族群体，不必然是现代政治国家；“民族”比“国家”更贴近原词，并保留他们与歌革同行的关系。
theological_decisions:
- issue: 审判灾害是具体行动还是纯象征
  choice: 按经文表述为上帝将施行的具体审判灾害
  alternative: 在译文中将瘟疫、暴雨、冰雹、火和硫磺处理为纯粹象征
  rationale: 希伯来文直接列举上帝施行审判的方式。译文保留其具体性，同时不在措辞中裁定这些图像在预言应验层面的进一步解释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“审判”保留司法色彩；全句以分号区分审判宣告与降灾清单。避免古旧的“降与”和过度解释性的末世术语。
