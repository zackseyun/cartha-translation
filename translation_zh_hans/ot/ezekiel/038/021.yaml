id: EZK.38.21
reference: Ezekiel 38:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/קָרָ֨אתִי עָלָ֤י/ו לְ/כָל הָרַ/י֙ חֶ֔רֶב נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה חֶ֥רֶב אִ֖ישׁ בְּ/אָחִ֥י/ו תִּֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/021.yaml
  text: And I will summon a sword against him on all my mountains[a], declares the Lord GOD; every man's sword will be against his brother.
translation:
  language: zh_hans
  text: 我必在我的众山上召来刀剑攻击他[a]——这是主雅威的宣告。各人的刀剑必攻击自己的弟兄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必召刀剑来攻击他。”
    reason: 原文介词结构较为紧缩；“在我的众山上”可理解为行动发生的地点，而句子的核心也可较简略地表达为召刀剑攻击他。
lexical_decisions:
- source_word: וְקָרָאתִי
  choice: 我必……召来
  rationale: קרא在此表示召来或调动审判的工具；“召来”自然表达雅威使刀剑临到的主动作为。
- source_word: עָלָיו
  choice: 攻击他
  rationale: עַל在审判语境中表示敌对的指向；“攻击他”比直译“临到他”更清楚。
- source_word: לְכָל הָרַי
  choice: 在我的众山上
  rationale: 将审判的地点理解为雅威所属的众山，即以色列的山地；保留“我的”这一所有关系。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: חֶרֶב在本节指战争和杀戮的工具；汉语以“刀剑”表达这一集合性意象，无须强行区分定指与不定指。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主雅威的宣告
  rationale: נְאֻם采用先知书中庄重自然的宣告公式；אֲדֹנָי译为“主”，יהוה按其专名音译为“雅威”。
- source_word: חֶרֶב אִישׁ בְּאָחִיו תִּהְיֶה
  choice: 各人的刀剑必攻击自己的弟兄
  rationale: “各人”保留אִישׁ的逐一分配意味，“弟兄”保留原文所描绘同伙彼此残杀的具体关系。
theological_decisions:
- issue: 复合称号אֲדֹנָי יְהוִה中神名的译法
  choice: 主雅威
  alternative: 主耶和华
  rationale: 原文直接使用יהוה这一专名；“雅威”较直接地按其通常重构的读音音译，也避免把专名处理成普通称号。
- issue: 彼此相杀是否明说为神所诱发
  choice: 仅译作“各人的刀剑必攻击自己的弟兄”
  alternative: 各人必在神的驱使下自相残杀
  rationale: 上下文表明这是神的审判，但本句本身以刀剑彼此相向的意象表达；不把解释性因果关系添入正文，以保留原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“众山”略带经文风格，但能简洁保留复数及“我的”这一神学上重要的所有关系；破折号使宣告公式在汉语中自然衔接。
