  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יַעֲל֤וּ דְבָרִים֙ עַל לְבָבֶ֔/ךָ וְ/חָשַׁבְתָּ֖ מַחֲשֶׁ֥בֶת רָעָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/010.yaml
  text: 'Thus says the Lord GOD: On that day[a], things will come up in your heart[b], and you will devise an evil plan.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“到那日，必有事情[a]浮上你的心头[b]，你必谋划恶计。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事情”也可译作“话”或“意念”。原文 דְבָרִים 的含义较宽，在这里指内心浮现的内容。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“上到你的心上”。在希伯来语表达中，“心”是思想和意向的中心，并不只指情感。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传讯公式的庄重语气，也是现代中文圣经语体中自然、清楚的表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי 表示“主”，יהוה 是上帝的圣名；译作“主耶和华”既区分两者，也避免把复合称号简化为单一头衔。
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 自然表达该希伯来语结构所引出的未来时间情境，无须逐字译出“事情将会发生”。
- source_word: יַעֲלוּ דְבָרִים
  choice: 一些事情必浮上
  rationale: דְבָרִים 可指“话”或较广义的“事情”；与“上升”连用时描写内在意念浮现。正文采用“事情”以保留其词义宽度，并用脚注说明可能含义。
- source_word: עַל לְבָבֶךָ
  choice: 你的心头
  rationale: 保留希伯来文以“心”为思想和意向中心的表达；“浮上心头”在现代中文中自然，并与动词“上升”相呼应。
- source_word: וְחָשַׁבְתָּ
  choice: 你必谋划
  rationale: חשב 在此不只是一般思考，而是有意识地筹划；“谋划”准确传达蓄意制定计划的意味。
- source_word: מַחֲשֶׁבֶת רָעָה
  choice: 恶计
  rationale: 该名词与前面的动词同根，指带有邪恶性质的计划；“恶计”简洁地保留道德判断和筹谋色彩。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文直接包含圣名 יהוה；“主耶和华”保留圣名以及 אֲדֹנָי 的主权称号，不把两者合并或隐去。
- issue: “心”在本节中的含义
  choice: 保留“心头”，并以脚注说明其思想与意向层面
  alternative: 直接意译为“脑海”或“心思”
  rationale: 原文的“心”兼具思想、意志和意向的含义。正文保留原有意象，避免把它缩减为纯粹理智活动。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“如此说”保留先知宣告的正式语气；“浮上心头”使希伯来语的空间意象在中文中自然可懂。脚注标记按正文出现顺序排列，并分别说明 דְבָרִים 的词义范围和希伯来语“心”的文化含义。
