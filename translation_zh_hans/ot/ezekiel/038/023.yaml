  text: וְ/הִתְגַּדִּלְתִּי֙ וְ/הִתְקַדִּשְׁתִּ֔י וְ/נ֣וֹדַעְתִּ֔י לְ/עֵינֵ֖י גּוֹיִ֣ם רַבִּ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/023.yaml
  text: I will show myself great and show myself holy[a], and I will make myself known in the sight of many nations[b]. Then they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我要显出自己的伟大，显出自己的圣洁[a]，并要在许多民族眼前显明自己。这样，他们就会知道我是耶和华[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译作：“我要使自己为大，使自己为圣，并被人认识。”这些希伯来语动词的形态可带有反身或被动意味；正文按本节公开彰显的语境表达。
    reason: lexical_alternative
  - marker: b
    text: 原文为上帝的名字YHWH，中文通常译作“耶和华”，也有译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְגַּדִּלְתִּי
  choice: 我要显出自己的伟大
  rationale: 该词是גדל的Hitpael形式，在这里表达上帝借行动公开显明自己的伟大；此译保留反身意味，又避免“使自己变得伟大”的误解。
- source_word: וְהִתְקַדִּשְׁתִּי
  choice: 显出自己的圣洁
  rationale: 该词是קדשׁ的Hitpael形式，在《以西结书》中常指上帝在列国面前彰显其圣洁；“显出自己的圣洁”自然清楚，同时不过度解释为“维护”或“证明”。
- source_word: וְנוֹדַעְתִּי
  choice: 显明自己
  rationale: ידע的Niphal形式可理解为“被认识”或具有实际效果的反身意义“使自己被认识”。上下文是一连串第一人称的自我彰显行动，因此译作“显明自己”，并以脚注保留较形式对应的可能。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 直译并保留该习语所强调的公开、可见性质，现代汉语也自然可懂。
- source_word: גּוֹיִם רַבִּים
  choice: 许多民族
  rationale: 这里指多个民族或国家群体；“民族”既符合先知书语境，也避免引入后期“外邦人”一词可能带有的宗教对比。
- source_word: וְיָדְעוּ
  choice: 他们就会知道
  rationale: 保留ידע的直接含义及《以西结书》中反复出现的认识耶和华公式，不擅自具体说明这种认识是承认、体验还是信服。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，表明原文使用的是专名YHWH，而不是一般性的称号“主”。
theological_decisions:
- issue: 如何表达上帝使自己的伟大、圣洁和身份在列国面前显明
  choice: 采用“显出自己的伟大，显出自己的圣洁……显明自己”的公开自我彰显语言
  alternative: 较形式化地译作“使自己为大，使自己为圣，并被人认识”
  rationale: 原文三个动词兼有反身或被动形态与公开显现的语境。正文以自然汉语表达上帝主动彰显自己的含义，脚注则保留形式上更贴近原文的译法，不把经文进一步解释成自我抬高或某种特定的圣洁论。
- issue: 神名יהוה的翻译
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是普通现代中文读者最熟悉的YHWH专名译法，并能区别于称号“主”；脚注交代原文形式，以保持透明。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“显出自己的伟大／圣洁”保持两个平行动词的修辞结构；“在许多民族眼前”保留原文的视觉性和公开性；“这样”自然呈现末句在语义上的结果关系。
