base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/009.yaml
  text: The elders of Gebal and her skilled men were within you[a], repairing your damage[c][b]. All the ships of the sea and their sailors were within you to trade for your merchandise.
translation:
  language: zh_hans
  text: 迦巴勒[a]的长老和她的能工巧匠都在你中间，修补你的破损。海上所有的船只和船员都在你中间，从事你货物的交易。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦巴勒”是腓尼基的一座城，后来希腊人称它为“比布鲁斯”。
    reason: alternative_reading
  - marker: b
    text: “从事你货物的交易”也可译作“交换你的货物”；原文使用两个同根词，表达贸易或交换货物。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גְבַל
  choice: 迦巴勒的长老
  rationale: זִקְנֵי 在城邦语境中通常指有地位的长老或领袖；地名 גְבַל 按希伯来语音译为“迦巴勒”。
- source_word: חֲכָמֶיהָ
  choice: 其中有才干的人
  rationale: 这里不是强调抽象智慧，而是指具备修船等实用技能的人；“有才干的人”自然且不过度限定为某一种工匠。
- source_word: הָיוּ בָךְ
  choice: 都在你里面
  rationale: 保留介词的空间表达，并呼应本章把推罗同时描写为城和船的延伸比喻。
- source_word: מַחֲזִיקֵי בִּדְקֵךְ
  choice: 修补你的破损
  rationale: חזק 与 בֶּדֶק 连用表示加固、修复受损之处；“破损”保留裂口、缝隙或其他结构损坏的宽泛含义。
- source_word: כָּל אֳנִיּוֹת הַיָּם וּמַלָּחֵיהֶם
  choice: 海上所有的船只和船员
  rationale: 直接保留全称范围和航海图景；“船员”在现代汉语中自然，也可涵盖从事航行的水手。
- source_word: לַעֲרֹב מַעֲרָבֵךְ
  choice: 以你的货物进行交易
  rationale: 同根的动词和名词表达交易、交换货物；此译法清楚自然，并避免把交易方式过度限定为严格的以物易物。
