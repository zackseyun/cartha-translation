  text: בְּרוֹשִׁ֤ים מִ/שְּׂנִיר֙ בָּ֣נוּ לָ֔/ךְ אֵ֖ת כָּל לֻֽחֹתָ֑יִם אֶ֤רֶז מִ/לְּבָנוֹן֙ לָקָ֔חוּ לַ/עֲשׂ֥וֹת תֹּ֖רֶן עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/005.yaml
  text: With cypresses from Senir they built all your planking[b][a]; they took a cedar from Lebanon to make a mast for you.
translation:
  language: zh_hans
  text: 他们用示尼珥[b]的柏木[a]造了你所有的船板；又从黎巴嫩取来一棵香柏树，为你做桅杆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏木”所译的希伯来词具体指哪一种树并不确定，也可能指刺柏或冷杉一类的针叶树。
    reason: lexical_alternative
  - marker: b
    text: 示尼珥是与黑门山相关的地区名称（参申命记3:9）。
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוֹשִׁים
  choice: 柏木
  rationale: 该词指某种针叶树，但确切树种不明；“柏木”是现代中文圣经语境中自然、庄重且适合造船材料的译法，具体不确定性保留在脚注中。
- source_word: מִשְּׂנִיר
  choice: 示尼珥的
  rationale: 示尼珥是与黑门山相关的地名；按希伯来语专名音译，并以“的”自然表达木材来源。
- source_word: בָּנוּ לָךְ
  choice: 建造你
  rationale: בנה的基本义为“建造”；此处推罗被拟作船并以阴性单数第二人称受话，中文保留直接称呼“你”。
- source_word: אֵת כָּל לֻחֹתָיִם
  choice: 你所有的船板
  rationale: לוּחַ指板材；在造船语境中译作“船板”比泛称“木板”更明确自然，并保留第二人称所属关系。
- source_word: אֶרֶז מִלְּבָנוֹן
  choice: 黎巴嫩的一棵香柏树
  rationale: 原文为单数，具体指用来制作一根桅杆的树；“香柏树”是中文对黎巴嫩雪松的传统且易懂的圣经译名。
- source_word: לָקָחוּ
  choice: 取来
  rationale: לקח基本义为“取”；“取来”在中文中自然表达从黎巴嫩取得木材，同时不扩充为未经明说的运输细节。
- source_word: לַעֲשׂוֹת תֹּרֶן
  choice: 做桅杆
  rationale: תֹּרֶן明确指船的桅杆；“做”贴近עשה，并符合现代汉语搭配。
- source_word: עָלָיִךְ
  choice: 为你
  rationale: 介词短语字面可作“在你上面”，但在制作船体部件的语境中表示该桅杆供这艘拟人化的船使用；“为你”自然保留其关系义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的书面汉语。保留推罗作为船只被直接称作“你”的拟人表达；分号对应原文两组造船材料与用途。脚注标记均置于相关词语之后。
