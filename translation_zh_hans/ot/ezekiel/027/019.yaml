base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/019.yaml
  text: Dan and Javan from Uzal traded with you[a]; they exchanged wrought iron, cassia[c][b], and cane for your wares.
translation:
  language: zh_hans
  text: 但和来自乌萨的雅完[a][b]跟你交易；他们用熟铁、桂皮和香茎[c]换取你的货物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“但”；因原文艰涩，有人读作“威但”，也有人提出其他校改。
    reason: textual_variant
  - marker: b
    text: 也可理解为“雅完来自乌萨”。希伯来文中“雅完”与“乌萨”的关系在句法上并不明确。
    reason: alternative_reading
  - marker: c
    text: “香茎”也可译作“菖蒲”或“芳香芦苇”；这里所指芳香植物的确切种类不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדָן
  choice: 但
  rationale: 按马所拉文本保留为地名或商贸族群名“但”；因经文艰涩，其他读法收入脚注。
- source_word: וְיָוָן
  choice: 雅完
  rationale: 在商贸名录中按专名音译，避免直接解释为“希腊”或“爱奥尼亚人”。
- source_word: מְאוּזָּל
  choice: 来自乌萨
  rationale: 将带介词的形式理解为地名“乌萨”，与商贸伙伴名录相符；它与“雅完”的句法关系仍有困难，故加脚注。
- source_word: בְּעִזְבוֹנַיִךְ
  choice: 跟你交易
  rationale: 该词指商品或货物；结合动词，在现代汉语中用“跟你交易”自然表达商业活动。
- source_word: נָתָנּוּ
  choice: 用……换取
  rationale: 字面为“给”，但贸易语境表明是以所列商品交换推罗的货物。
- source_word: בַּרְזֶל עָשׁוֹת
  choice: 熟铁
  rationale: 指经过加工或锻造的铁，而非未经处理的原铁；“熟铁”简洁且符合商品名录语体。
- source_word: קִדָּה
  choice: 桂皮
  rationale: 通常指一种类似肉桂的芳香树皮，即 cassia；“桂皮”是普通现代读者较易理解的名称。
- source_word: וְקָנֶה
  choice: 香蒲
  rationale: 贸易语境中的 קָנֶה 很可能是芳香的蒲草或香茎；用“香蒲”表达其芳香商品性质，同时在脚注保留其他可能。
- source_word: בְּמַעֲרָבֵךְ
  choice: 换取你的货物
  rationale: 该词在本章指商品或交易货物；译成“你的货物”并与“换取”结合，可清楚呈现商业交换。
