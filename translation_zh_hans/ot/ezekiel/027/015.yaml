  text: בְּנֵ֤י דְדָן֙ רֹֽכְלַ֔יִ/ךְ אִיִּ֥ים רַבִּ֖ים סְחֹרַ֣ת יָדֵ֑/ךְ קַרְנ֥וֹת שֵׁן֙ ו/הובנים הֵשִׁ֖יבוּ אֶשְׁכָּרֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/015.yaml
  text: The sons of Dedan were your merchants[a]. Many coastlands were the market of your hand[c][b]; they brought back ivory tusks and ebony as your payment.
translation:
  language: zh_hans
  text: 底但人是你的商人。许多沿海地区[a]都是你贸易的市场；他们把象牙[b]和乌木[c]带来，作为给你的报酬。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“许多海岛”。
    reason: lexical_alternative
  - marker: b
    text: 字面为“象牙的角”，即象牙长牙。
    reason: lexical_alternative
  - marker: c
    text: 或译“乌木料”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דְדָן
  choice: 底但人
  rationale: 希伯来文直译为“底但的众子”，此处是族群或地域称谓；译作“底但人”既准确又符合现代汉语习惯。
- source_word: רֹכְלַיִךְ
  choice: 你的商人
  rationale: 该词指往来经商的人；“商人”符合本章贸易语境，也比“行商”更自然通俗。
- source_word: אִיִּים רַבִּים
  choice: 许多沿海地区
  rationale: אִיִּים 可指岛屿，也可广指隔海相望的沿海地区；正文采用涵盖面较广的“沿海地区”，脚注保留“海岛”的可能。
- source_word: סְחֹרַת יָדֵךְ
  choice: 都是你的市场
  rationale: 原文含“你手中的贸易／货物”这一具体但不易直译的表达；结合上下文译作“你的市场”，传达其商业关系，同时避免生硬的汉语。
- source_word: קַרְנוֹת שֵׁן
  choice: 象牙
  rationale: 字面为“牙的角”，实际指作为商品的象牙或象牙长牙；正文用自然的商品名称“象牙”，脚注说明字面形象。
- source_word: וְהוֹבְנִים
  choice: 乌木
  rationale: 该词传统上理解为乌木，与本章列举的贵重贸易品相符；也可明确译为“乌木料”。
- source_word: הֵשִׁיבוּ
  choice: 拿……来
  rationale: 使役形可表示“带回、交还”；在贸易语境中，“拿……来”自然表达对方带来货品作为偿付，同时不过度解释为特定交易制度。
- source_word: אֶשְׁכָּרֵךְ
  choice: 作给你的报酬
  rationale: 该名词表示报酬、酬金或偿付之物；“作给你的报酬”保留接受方为“你”，并适合这里以货物偿付的场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“底但人”避免直译“底但的众子”造成误解；“你的市场”保留贸易意象，并使汉语顺畅。所有第二人称阴性形式均按本章对推罗的拟人化称呼译为“你”，不在正文另加解释。
