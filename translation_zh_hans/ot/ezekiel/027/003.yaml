  text: וְ/אָמַרְתָּ֣ לְ/צ֗וֹר ה/ישבתי עַל מְבוֹאֹ֣ת יָ֔ם רֹכֶ֨לֶת֙ הָֽ/עַמִּ֔ים אֶל אִיִּ֖ים רַבִּ֑ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צ֕וֹר אַ֣תְּ אָמַ֔רְתְּ אֲנִ֖י כְּלִ֥ילַת יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/003.yaml
  text: 'and say to Tyre[a], who dwells at the entrances of the sea, trader of the peoples to many coastlands: Thus says the Lord GOD: Tyre, you have said, ‘I am perfect in beauty.’'
translation:
  language: zh_hans
  text: 你要对推罗说：“你这坐落在海的入口处、向许多沿海地区的万民经商的城啊，主耶和华如此说：推罗啊，你曾说：‘我是美丽的极致。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הישבתי
  choice: 坐落
  rationale: 阴性单数主动分词修饰拟人化的推罗，描述其持续的地理状态；“坐落”比直译“居住”更自然地用于城市。
- source_word: מְבוֹאֹת יָם
  choice: 海上门户
  rationale: 原词指入口、通道或门户；此处保留具体的海洋意象，也传达推罗扼守海路的地理位置。
- source_word: רֹכֶלֶת הָעַמִּים
  choice: 与各族通商
  rationale: 阴性分词把推罗描写为从事贸易者；汉语用动词结构较自然，“各族”保留复数群体含义。
- source_word: אֶל אִיִּים רַבִּים
  choice: 直到众多沿海之地
  rationale: אִיִּים可指岛屿，也可泛指海岛和沿海地区；正文采用涵盖面较广的“沿海之地”，并以脚注保留“岛屿”的可能。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神名中“主”与四字神名的区别；“耶和华”是现代中文圣经语境中广为人知的音译。
- source_word: כְּלִילַת יֹפִי
  choice: 我的美丽完美无缺
  rationale: 表达推罗自称美貌达到完整、极致的夸耀语气；加入领属成分使现代汉语自然，并未增添原文主张的内容。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文明确使用四字神名。正文采用中文读者较熟悉且庄重的“耶和华”，同时不把它泛化为“主”；“雅威”是可行的学术音译，但不宜在正文中强行排除传统译名。
- issue: 推罗“完美”宣称的范围
  choice: 我的美丽完美无缺
  alternative: 我是全然美丽的
  rationale: 将“完美”限定在“美丽”方面，避免把推罗的自夸扩大为道德或本体上的绝对完美。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。以“你这……的城啊”维持对拟人化推罗的直接呼告；“海上门户”保留原文的具体海洋意象。脚注标记[a]已置于正文相应词组之后。
