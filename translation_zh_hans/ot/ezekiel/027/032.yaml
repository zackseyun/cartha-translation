base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/032.yaml
  text: 'They will raise a lamentation over you in their wailing[a], and they will lament over you: ‘Who is like Tyre[b], silenced in the midst of the sea?’'
translation:
  language: zh_hans
  text: '他们必在哀号中为你唱起哀歌[a]；他们要为你哀悼，说：


    “有谁能与在海中归于沉寂的推罗相比[b]？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在哀号中”所对应的希伯来语难以确定；按马所拉文本的通常读法，也可理解为“与他们的儿子一起”或“在他们的儿子中”。哀悼的上下文支持这里指哀哭之声。
    reason: textual_variant
  - marker: b
    text: “归于沉寂”所对应的希伯来语也可译作“被止息”“变得无声”或“沦为荒废”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: 唱起哀歌
  rationale: נשא与קינה连用，表示发出、吟唱哀歌；“唱起哀歌”既传达这一惯用义，也保留哀歌作为诗歌的色彩。
- source_word: אֵלַיִךְ / עָלָיִךְ
  choice: 为你
  rationale: 两处介词不同，但在举哀语境中都指哀歌以推罗为哀悼对象；现代汉语用“为你”自然清楚。
- source_word: בְּנִיהֶם
  choice: 在哀号声中
  rationale: 马所拉文本的形式按通常元音可理解为“在他们的儿子中／与他们的儿子一起”，但此处文本和词义均有困难。上下文连续使用“哀歌”和“悲唱”，支持指哀哭之声的理解；以脚注保留另一可能。
- source_word: קִינָה
  choice: 哀歌
  rationale: 该词指正式吟唱的挽歌或哀悼诗；“哀歌”简洁、庄重，也符合现代汉语习惯。
- source_word: וְקוֹנְנוּ
  choice: 悲唱
  rationale: 该动词指吟唱哀歌。用“悲唱”避免与前句机械重复，同时保留出声吟咏和哀悼的含义。
- source_word: מִי כְצוֹר
  choice: 有谁像推罗
  rationale: 保留反问式比较；“推罗”是该地名在现代中文圣经传统中的通行译名。
- source_word: כְּדֻמָה
  choice: 归于沉寂
  rationale: 该形式可表达被止息、变得无声，也可能带有荒废、毁灭的意味。“归于沉寂”保持诗意，并不把含义限定为彻底毁灭。
- source_word: בְּתוֹךְ הַיָּם
  choice: 在海中
  rationale: 准确表达处于海之中的空间意象；汉语不必增译“中央”也能自然保留推罗的海洋背景。
