  yaml_path: translation/ot/ezekiel/027/026.yaml
  text: Into great waters your rowers brought you[b][a]; the east wind shattered you in the heart of the seas.
translation:
  language: zh_hans
  text: 你的划桨手把你带进浩瀚水域[a]；东风在众海之中击碎了你[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在浩瀚水域中”或“在众水之上”。希伯来语介词可有不同译法，但“带”所表达的移动含义支持译作“带进浩瀚水域”。
    reason: lexical_alternative
  - marker: b
    text: 直译“在众海的心”。也可译作“在众海的中央”或“在海洋深处”；这是指海中、海的内里的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַיִם רַבִּים
  choice: 带进浩瀚水域
  rationale: 介词 בְּ 可按语境表示“在、进入”等；由于 הֱבִיאוּךְ 表达移动，译作“带进”较合适。מַיִם רַבִּים 在此指广阔、深远的水域，“浩瀚水域”比字面的“许多水”更符合现代汉语。
- source_word: הֱבִיאוּךְ
  choice: 把你带进
  rationale: 这是 בוא 的使役式，基本义为“带来、带入”；过去时态由叙述语境自然体现，无须在汉语中另加标记。
- source_word: הַשָּׁטִים
  choice: 你的划桨手
  rationale: 该词在航海语境中指以桨推动船只的人。原文定冠词可译为“划桨手”；结合船被拟人化为第二人称，补出“你的”使所属关系清楚自然。
- source_word: רוּחַ הַקָּדִים
  choice: 东风
  rationale: 原文是特指的“东风”，在先知文学中常带有猛烈、毁坏性的意味；现代汉语不必用“那东风”也能表达其特定意象。
- source_word: שְׁבָרֵךְ
  choice: 击碎了你
  rationale: שׁבר 表示打破、摧毁；“击碎”既保留暴烈的破坏力，也适合船难的比喻。
- source_word: בְּלֵב יַמִּים
  choice: 在诸海的中心
  rationale: לֵב 字面为“心”，在此比喻内部或中央。“中心”在现代汉语中自然清楚，同时“诸海”保留 יַמִּים 的复数形式；脚注说明也可按习语理解为“海洋深处”。
theological_decisions: []
