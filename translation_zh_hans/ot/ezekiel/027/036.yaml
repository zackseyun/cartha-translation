  yaml_path: translation/ot/ezekiel/027/036.yaml
  text: Merchants among the peoples hiss at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: zh_hans
  text: 列邦的商人向你发出嘘声[a]；你成了令人恐惧的对象[b]，你将永远不复存在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向你吹哨”。希伯来语动词既可指吹哨，也可指发嘘声；这里表达惊异或讥嘲。
    reason: lexical_alternative
  - marker: b
    text: 或译“你成了种种恐怖”或“你成了令人惊骇的对象”。希伯来语名词在形式上是复数，也可按集合意义理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹחֲרִים
  choice: 商人
  rationale: 该词是סחר的分词，指从事贸易的人；“商人”自然贴合本章推罗贸易的语境。
- source_word: בָּעַמִּים
  choice: 万民中的
  rationale: עַמִּים为复数，泛指各族群；“万民中的”保留其广泛、跨族群的含义，又不将其限定为现代政治国家。
- source_word: שָׁרְקוּ
  choice: 发嘘声
  rationale: שׁרק可指吹哨或发嘘声，在先知审判语境中常表达惊异或讥嘲；“发嘘声”能自然传达针对推罗的鄙夷反应，同时以脚注保留词义幅度。
- source_word: עָלָיִךְ
  choice: 向你
  rationale: עַל在此标明发出嘘声所针对的对象；现代汉语以“向你”表达最自然。
- source_word: בַּלָּהוֹת
  choice: 令人惊骇之物
  rationale: 该名词形态为复数，可指种种恐怖，也可集合性地表示令人惊骇的对象；译文采用后者，同时以脚注保留复数形式的可能表达。
- source_word: הָיִית
  choice: 你成了
  rationale: 完成式在此概括审判所造成的结果状态；“成了”简洁传达进入这一境况。
- source_word: וְאֵינֵךְ
  choice: 不复存在
  rationale: 带第二人称阴性后缀的否定存在式，结合后面的עַד עוֹלָם，表达推罗从此不再存在；此译保持审判宣告的力度。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: 该惯用语表示持续而不可逆的久远；“永远”是清楚、庄重的现代汉语对应。
theological_decisions:
- issue: 先知审判宣告末句的力度
  choice: 译作“永远不复存在”
  alternative: “你永远不在了”或“你将永不再有”
  rationale: 希伯来语否定存在式与עַד עוֹלָם连用，表达不可逆转的终局。译文保留审判的严厉性，但不把这句话扩展为超出神谕直接语境的形而上主张。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“万民中的商人”保留原文语序与国际贸易背景；“发嘘声”传达公开的讥嘲反应；末句简洁有力，符合哀歌收束语气。
