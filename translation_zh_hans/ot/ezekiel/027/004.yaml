  text: בְּ/לֵ֥ב יַמִּ֖ים גְּבוּלָ֑יִ/ךְ בֹּנַ֕יִ/ךְ כָּלְל֖וּ יָפְיֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/004.yaml
  text: Your borders are in the heart of the seas[b][a]; your builders perfected your beauty.
translation:
  language: zh_hans
  text: 你的疆界在众海的中心[a]；建造你的人使你的美丽臻于完美[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在众海的腹心”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“建造你的人完成了你的美丽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֵב
  choice: 在……的中心
  rationale: לֵב本义为“心”，用于空间表达时指内部或中心。汉语“在……的中心”准确、自然；脚注保留更具意象色彩的“在……的腹心”。
- source_word: יַמִּים
  choice: 众海
  rationale: 保留希伯来文复数形式，并延续本章描绘推罗所处海域的宏阔意象。
- source_word: גְּבוּלַיִךְ
  choice: 你的疆界
  rationale: גְּבוּל可指边界或疆域；“疆界”既贴近原文，又适合拟人化称呼推罗的语境，不把它过度限定为海岸线。
- source_word: בֹּנַיִךְ
  choice: 建造你的人
  rationale: 忠实表达“你的建造者”，并保留推罗既像城又像船的复合比喻，不明确收窄为“造船匠”。
- source_word: כָּלְלוּ
  choice: 使……臻于完美
  rationale: 该动词表达完成、使达到完满的意思；“臻于完美”体现的不只是竣工，也包括把美推进到完满境地。
- source_word: יָפְיֵךְ
  choice: 你的美丽
  rationale: 直接呈现 יֹפִי 的“美丽、美”之义，并保留对推罗的诗性拟人。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。首句保留“众海”的复数海洋意象；次句避免使用仅指造船的称谓，以维持城与船之间有意交叠的比喻。
