base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/010.yaml
  text: Persia[a], Lud, and Put were in your army as your men of war. They hung shield and helmet in you[b]; they gave you splendor.
translation:
  language: zh_hans
  text: 波斯人、路德人和弗人在你的军队中，作你的战士。他们在你那里悬挂盾牌和头盔[a]；他们赋予你威荣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你那里悬挂”也可译作“悬挂在你身上”。所描绘的可能是军械陈列在推罗城墙上或城中。
    reason: lexical_alternative
  - marker: b
    text: “他们赋予你威荣”也可译作“他们成就了你的荣美”或“他们为你的荣耀增色”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַס
  choice: 波斯
  rationale: 这是指波斯的专名；采用现代汉语通行名称。
- source_word: לוּד
  choice: 路德
  rationale: 按希伯来语音译，保留其族名或地名的性质；译作“吕底亚”会加入尚不能完全确定的地域认定。
- source_word: פוּט
  choice: 弗
  rationale: 采用中文圣经传统中较为熟悉的族名译法，作为专名处理，不进一步确定其具体地域。
- source_word: בְחֵילֵךְ
  choice: 在你的军队中
  rationale: חַיִל 可指力量、财富或军队；下文“你的战士”明确支持军事含义。
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: 作你的战士
  rationale: 原文直译为“你战争中的人”；此处用现代汉语自然表达其军人、战士之意。
- source_word: מָגֵן וְכוֹבַע
  choice: 盾牌和头盔
  rationale: 分别是常见的防御性兵器和军用头具。
- source_word: תִּלּוּ בָךְ
  choice: 悬挂在你里面
  rationale: תלה 是“悬挂”，בָךְ 字面为“在你里面”；推罗被当作阴性单数对象称呼。正文保留这一不寻常但形象鲜明的空间表达。
- source_word: הֵמָּה נָתְנוּ הֲדָרֵךְ
  choice: 他们为你增添了威荣
  rationale: הָדָר 可指荣美、威严或华美。结合外族战士及所陈列军械的语境，“增添威荣”自然表达他们使推罗更显显赫的作用，同时不把该词窄化为单纯装饰。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。族名保留专名性质；军事术语直白明确。正文保留“在你里面”这一希伯来语意象，并以脚注说明更自然但解释性较强的译法。
