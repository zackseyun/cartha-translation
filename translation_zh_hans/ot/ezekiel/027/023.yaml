  text: Haran and Canneh and Eden[a], the merchants of Sheba, Asshur, and Kilmad[b], traded with you.
translation:
  language: zh_hans
  text: 哈兰、迦尼[a]和伊甸，以及示巴的商人、亚述[b]和基抹，都是你的商人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦尼”或译“迦勒尼”。
    reason: lexical_alternative
  - marker: b
    text: “亚述”也可理解为“亚述国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרָן
  choice: 哈兰
  rationale: 地名，采用现代中文圣经语境中自然、通行的音译。
- source_word: כַנֵּה
  choice: 迦尼
  rationale: 按本节马所拉文本的辅音形式音译；与传统上联系到其他经文的“迦勒尼”有所区别，故以脚注保留异译。
- source_word: עֶדֶן
  choice: 伊甸
  rationale: 此处是贸易名单中的地名，并非指伊甸园；保留通行音译。
- source_word: רֹכְלֵי
  choice: 商人
  rationale: רכל 的构词复数，指从事贸易的人；“示巴的商人”自然表达其属格关系。
- source_word: שְׁבָא
  choice: 示巴
  rationale: 在商业语境中是地名或族名，采用通行译名。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 该名称既可指亚述这个名号，也可在语境中指亚述地区或国家；中文“亚述”可保留这种开放性。
- source_word: כִּלְמַד
  choice: 基抹
  rationale: 罕见而定位不确定的专名，采用音译，不推断其具体地点。
- source_word: רֹכַלְתֵּךְ
  choice: 都与你通商
  rationale: 该动词在本章语境中表示商业往来；“与你通商”符合现代汉语，并保留其核心意义。因希伯来语谓语为阴性单数，可能将前列诸名视作集合性主语，但中文以“都”自然统摄名单。
