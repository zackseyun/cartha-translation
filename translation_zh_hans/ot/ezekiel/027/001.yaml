  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事连接形式与整句共同构成先知书中常见的启示引入语。汉语用“……的话临到……”自然表达事件的发生，无须另译成“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定先知性表达中，“话”既贴近原词，也保留神所发言语和信息的含义；“信息”则解释性较强。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用四字神名。现代中文圣经语境中，“耶和华”是最通行、最易识别的专名译法；不以“主”这一称号取代神名。
- source_word: אֵלַי
  choice: 我
  rationale: 介词及第一人称单数后缀表示话语所临到的对象。汉语固定说法“临到我”准确而自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式通常引出随后直接话语。译作“说”简洁、庄重，并与下一节内容自然衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名，应保留为专名而不是以“主”替代。“耶和华”是普通现代中文读者最熟悉的传统音译；“雅威”较接近学界常见的拟音，但原始读音不能完全确定。本节正文采用通行译名，不借此解决读音争议。
translation_notes:
  register: 采用现代、庄重且通顺的先知书叙述语体。“耶和华的话临到我，说”保留原文公式性结构，并自然引出下一节的直接言语。
