source:
  edition: WLC
  text: הוֹנֵ/ךְ֙ וְ/עִזְבוֹנַ֔יִ/ךְ מַעֲרָבֵ֕/ךְ מַלָּחַ֖יִ/ךְ וְ/חֹבְלָ֑יִ/ךְ מַחֲזִיקֵ֣י בִדְקֵ֣/ך וְֽ/עֹרְבֵ֣י מַ֠עֲרָבֵ/ךְ וְ/כָל אַנְשֵׁ֨י מִלְחַמְתֵּ֜/ךְ אֲשֶׁר בָּ֗/ךְ וּ/בְ/כָל קְהָלֵ/ךְ֙ אֲשֶׁ֣ר בְּ/תוֹכֵ֔/ךְ יִפְּלוּ֙ בְּ/לֵ֣ב יַמִּ֔ים בְּ/י֖וֹם מַפַּלְתֵּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/027.yaml
  text: Your wealth[a], your wares, your merchandise, your sailors, and your pilots, those who repair your damage, and those who trade in your merchandise, and all your men of war who are in you, with all your assembly that is in your midst[b], will fall into the heart of the seas on the day of your downfall.
translation:
  language: zh_hans
  text: 你的财富、货物和商品，你的水手和领航员，修补你破损之处的人[a]、从事你商品贸易的人，以及在你之中的所有战士，连同聚集在你中间的所有人，都必在你覆亡之日坠入众海的中心[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“填补你船体缝隙的人”，或“修复你裂口的人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“众海之心”，即海洋中央或海洋深处。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹנֵךְ
  choice: 你的财富
  rationale: הוֹן通常指财富、资财；“财富”符合推罗商业哀歌的语境，也自然易懂。
- source_word: עִזְבוֹנַיִךְ
  choice: 货物
  rationale: 本章处于航海贸易语境，该词指可供交易的物品；“货物”简明而贴切。
- source_word: מַעֲרָבֵךְ
  choice: 商品
  rationale: 该词在本章反复涉及贸易交换和商货；“商品”既保留商业含义，也与前面的“货物”有所区分。
- source_word: מַלָּחַיִךְ
  choice: 你的水手
  rationale: 该词指船上的水手；采用现代汉语最常用、清楚的对应词。
- source_word: חֹבְלָיִךְ
  choice: 领航员
  rationale: 在本章航海语境中，该词指掌管或引导船只航行的人；“领航员”比一般的“水手”更能体现其职分。
- source_word: מַחֲזִיקֵי בִדְקֵךְ
  choice: 修补你破损之处的人
  rationale: 原文直译近于“加固／修补你裂口的人”；主文本采用涵盖性表达，并在脚注保留船体缝隙或裂口的具体理解。
- source_word: עֹרְבֵי מַעֲרָבֵךְ
  choice: 经营你商品的人
  rationale: 分词在此具有商业含义，指从事其商品交易的人；译文避免把具体交易方式限定为以物易物。
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: 你里面所有的战士
  rationale: 该短语直指参与战争的人员；“战士”在现代汉语中凝练、庄重。
- source_word: קְהָלֵךְ
  choice: 聚集在你中间的所有人
  rationale: קהל指聚集起来的群体；语境中范围较广，不宜限定为宗教性“会众”，故译为自然的集合性表达。
- source_word: יִפְּלוּ
  choice: 都必……坠入
  rationale: 保留נפל“落下、倒下”的基本意象，而不直接释义为“沉没”。
- source_word: בְּלֵב יַמִּים
  choice: 海洋的中心
  rationale: 直译为“众海之心”，意指海的中央或深处；正文保留“心／中心”的空间隐喻，脚注说明其可能含义。
- source_word: מַפַּלְתֵּךְ
  choice: 你覆亡之日
  rationale: 该名词指坠落、倾覆或败亡；“覆亡”同时适合船只倾覆与推罗毁灭的双重图景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。保留原文把推罗描绘为商船的延展意象，并以并列结构呈现财富、船员、修船者、商人、战士和群体；不把“坠入”直接改写为“沉没”，以保留原文意象及其张力。
