base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/012.yaml
  text: Tarshish was your trader because of your abundant wealth[a]; with silver, iron, tin[c][b], and lead they paid for your wares.
translation:
  language: zh_hans
  text: 他施因你拥有极其丰富的各样财物，作你的贸易伙伴；他们用银、铁、锡和铅交换你的货物。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他施”可能指一个遥远的贸易地区；后来有人认为它就是西班牙的塔特苏斯。
    reason: cultural_note
  - marker: b
    text: “交换你的货物”所译的希伯来文动词直译为“给”。在这里的贸易语境中，指他们以这些金属交换你的货物。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְשִׁישׁ
  choice: 他施
  rationale: 按现代中文圣经地名的通行音译处理，不把可能的历史定位直接写入正文。
- source_word: סֹחַרְתֵּךְ
  choice: 与你通商
  rationale: 该词指从事贸易者或贸易伙伴；结合中文句法译为动词性表达更自然，同时保留他施与推罗进行贸易的含义。
- source_word: מֵרֹב כָּל הוֹן
  choice: 因你丰富的各样财富
  rationale: מִן在这里可表达原因；כָּל与הוֹן的组合保留为“各样财富”，不把财富仅限于金钱。
- source_word: בְּכֶסֶף בַּרְזֶל בְּדִיל וְעוֹפֶרֶת
  choice: 用银、铁、锡和铅
  rationale: 介词ב在贸易语境中具有手段或交换媒介的作用；各金属名称按其通常含义翻译。
- source_word: נָתְנוּ
  choice: 换取
  rationale: 动词本义是“给”，但在贸易语境中指交付这些金属作为交换；“换取”自然表达交易关系，脚注保留直译可能。
- source_word: עִזְבוֹנָיִךְ
  choice: 你的货物
  rationale: 本章中是商业用语，指交易的商品或货品；“货物”现代、清楚，也避免使用较生僻的“货财”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“与你通商”避免生硬的“是你的商人”；“换取”明确上下文中的交易功能，同时以脚注保留希伯来文动词“给”的简约表达。脚注标记均置于正文句末，分别对应地名背景和词义选择。
