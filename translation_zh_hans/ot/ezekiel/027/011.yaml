base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/011.yaml
  text: The sons of Arvad[a], along with your army, were on your walls all around, and the Gammadites were in your towers. They hung their shields on your walls all around; they perfected your beauty.
translation:
  language: zh_hans
  text: 亚瓦人和你的军队驻守在你四围的城墙上；迦玛底人[a]驻守在你的城楼里。他们把盾牌悬挂在你四围的城墙上；他们成全了你的美丽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦玛底人”所译的希伯来词含义不明。这里把它视为族名；也有人将它理解为“战士”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אַרְוַד
  choice: 亚瓦人
  rationale: 字面为“亚瓦之子”，是希伯来语常见的地域居民称谓；译作“亚瓦人”在现代汉语中自然、清楚。
- source_word: חֵילֵךְ
  choice: 你的军队
  rationale: חַיִל 在此军事防御语境中指军队或兵力；“你的军队”直接保留第二人称所属关系。
- source_word: עַל חוֹמוֹתַיִךְ סָבִיב
  choice: 在你四围的城墙上
  rationale: 表达守军遍布环城城墙；“四围”既保留诗体色彩，也为现代读者所理解。
- source_word: גַמָּדִים
  choice: 迦玛丁人
  rationale: 此词词义不明，很可能是族名或地域称谓；采用音译可避免武断地解释为某类战士，并以脚注保留其他可能。
- source_word: בְּמִגְדְּלוֹתַיִךְ
  choice: 驻守在你的城楼里
  rationale: 介词 בְּ 可表示“在……里/中”；结合军事场景补出“驻守”，使汉语关系清楚，而“城楼”比泛称“塔楼”更符合城防语境。
- source_word: שִׁלְטֵיהֶם
  choice: 他们的盾牌
  rationale: שִׁלְטֵיהֶם 指防御用盾牌；“盾牌”是准确且通行的现代汉语用词。
- source_word: תִּלּוּ
  choice: 悬挂
  rationale: 该动词表示把物件挂起；“悬挂”既准确，也符合城墙陈列盾牌的庄重场景。
- source_word: כָּלְלוּ יָפְיֵךְ
  choice: 使你的美丽臻于完美
  rationale: כָּלְלוּ 有完成、使完全之意；此译保留原文关于推罗之美被成全的诗性力度，不弱化为一般的“增添光彩”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。脚注标记置于其实际所说明的“迦玛丁人”之后。通过重复“四围的城墙”保留原文的诗性复沓，并用“正是他们”体现 הֵמָּה 的强调作用。
