base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/022.yaml
  text: The merchants of Sheba and Raamah—they were your merchants; with the finest of every spice[a], with every precious stone, and gold, they paid for your wares.
translation:
  language: zh_hans
  text: 示巴和拉玛的商人——他们是你的贸易伙伴；他们用各样最上等的香料、各样宝石和黄金换取你的货物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “换取”原文直译为“给出”或“交付”；这里用于商业交易的语境。
    reason: 保留希伯来语动词的字面意义，并说明正文采用商业语境中的自然译法。
lexical_decisions:
- source_word: רֹכְלֵי שְׁבָא וְרַעְמָה
  choice: 示巴和拉玛的商人
  rationale: רכל在本章贸易语境中指商人；两个地名按现代汉语圣经人名地名惯例音译。
- source_word: הֵמָּה רֹכְלָיִךְ
  choice: 他们就是与你做买卖的人
  rationale: 独立代词הֵמָּה带有强调意味；用“就是”加以体现，同时将第二个רכל自然表达为“与你做买卖的人”，避免汉语中生硬重复“商人”。第二人称阴性单数所指为推罗，译作“你”。
- source_word: בְּרֹאשׁ כָּל בֹּשֶׂם
  choice: 用各样上等香料
  rationale: רֹאשׁ在此为“上等、精选”的习语义，不取字面的“头”；בֹּשֶׂם指芳香的香料或香膏原料，“香料”适合本节奢侈品贸易的语境。
- source_word: וּבְכָל אֶבֶן יְקָרָה
  choice: 各样宝石
  rationale: 单数集合表达指各种贵重石料；现代汉语用“各样宝石”简洁自然。
- source_word: וְזָהָב
  choice: 和黄金
  rationale: 按其通常商品义直译。
- source_word: נָתְנוּ עִזְבוֹנָיִךְ
  choice: 换取你的货物
  rationale: נָתְנוּ字面为“给、交付”，但与表示交易媒介的介词短语及“货物”连用时具有商业交换含义；“换取”清楚表达交易关系。עִזְבוֹנָיִךְ在以西结书27章指货物或商品。
