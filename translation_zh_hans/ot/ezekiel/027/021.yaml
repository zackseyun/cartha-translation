source:
  edition: WLC
  text: עֲרַב֙ וְ/כָל נְשִׂיאֵ֣י קֵדָ֔ר הֵ֖מָּה סֹחֲרֵ֣י יָדֵ֑/ךְ בְּ/כָרִ֤ים וְ/אֵילִים֙ וְ/עַתּוּדִ֔ים בָּ֖/ם סֹחֲרָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/021.yaml
  text: Arabia and all the princes of Kedar—they were your traders[a]; in lambs, rams, and male goats[b], in these they traded with you.
translation:
  language: zh_hans
  text: 阿拉伯[a]和基达的所有首领，都是与你做生意的商人[b]；他们以羊羔、公绵羊和公山羊与你交易。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“阿拉伯人”。这个希伯来专名可以指阿拉伯地区，也可以指当地居民。
    reason: alternative_reading
  - marker: b
    text: 直译“你手边的商人”，这是指与你做生意之人的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲרַב
  choice: 阿拉伯
  rationale: 该专名在贸易名单中可指阿拉伯地区，也可指当地居民；“阿拉伯”在现代汉语中自然，并保留这种指称弹性。
- source_word: נְשִׂיאֵי
  choice: 首领
  rationale: 指部族的统治者或领袖；“首领”比“王子”更符合此处部族政治语境，也不削弱其权威地位。
- source_word: קֵדָר
  choice: 基达
  rationale: 按专名音译，并采用现代中文圣经语境中通行的形式。
- source_word: סֹחֲרֵי יָדֵךְ
  choice: 与你做生意的商人
  rationale: 字面为“你手下／你手边的商人”，是表示与推罗有商业往来的习语；此译自然表达关系，同时保留“商人”这一核心名词。
- source_word: כָרִים
  choice: 羊羔
  rationale: 指幼羊或育肥的幼羊；后面另有明确表示公绵羊的 אֵילִים，因此译作“羊羔”可保留类别区别。
- source_word: אֵילִים
  choice: 公绵羊
  rationale: 明确表示雄性的绵羊；此译与“羊羔”和“公山羊”清楚区分。
- source_word: עַתּוּדִים
  choice: 公山羊
  rationale: 专指雄性山羊；“公山羊”是清楚自然的现代汉语。
- source_word: בָּם
  choice: 以……
  rationale: 介词回指前列牲畜，表示交易所用的货物；汉语用“以”衔接简洁自然。
- source_word: סֹחֲרָיִךְ
  choice: 与你交易
  rationale: 将重复的商贸词根转为动词，以避免中文生硬重复；第二人称阴性单数指受话的推罗城。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“阿拉伯”保留地名与族群称谓之间的语义弹性；牲畜名称逐项区分。主句用“都是与你做生意的商人”，末句用“与你交易”，既体现原文商贸词根的重复，又避免中文过度拗口。
