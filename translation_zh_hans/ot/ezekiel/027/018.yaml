  text: דַּמֶּ֧שֶׂק סֹחַרְתֵּ֛/ךְ בְּ/רֹ֥ב מַעֲשַׂ֖יִ/ךְ מֵ/רֹ֣ב כָּל ה֑וֹן בְּ/יֵ֥ין חֶלְבּ֖וֹן וְ/צֶ֥מֶר צָֽחַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/018.yaml
  text: Damascus traded with you because of your many products[a], because of your abundant wealth, with wine of Helbon and white wool.
translation:
  language: zh_hans
  text: 大马士革因你的产品众多、各样财物丰盛，与你做生意[a]，以黑勒本的酒和洁白的羊毛交易。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大马士革作你的商人……以黑勒本的酒和光亮的羊毛交易。”
    reason: 保留 סֹחַרְתֵּךְ 可作名词性关系表达，以及 צָחַר 可译为“光亮”的词义选择。
lexical_decisions:
- source_word: דַּמֶּשֶׂק
  choice: 大马士革
  rationale: 按现代中文通行译名处理地名。
- source_word: סֹחַרְתֵּךְ
  choice: 与你做生意
  rationale: 该词源自商业语境中的 סחר，带第二人称阴性单数后缀，指向推罗；此译自然表达双方贸易关系，同时保留“作你的商人”的可能性于脚注。
- source_word: בְּרֹב מַעֲשַׂיִךְ
  choice: 因你众多的产品
  rationale: מַעֲשֶׂה 本义可指工作、所做之物；在本章贸易清单中指商品或产出。介词 בְּ 按原因理解。
- source_word: מֵרֹב כָּל הוֹן
  choice: 和丰富的各样财富
  rationale: הוֹן 指财富、资财；“各样”对应 כָּל，保留原文强化商业富足的表达。此短语与前一原因成分并列理解。
- source_word: בְּיֵין חֶלְבּוֹן
  choice: 用黑勒本的酒
  rationale: 黑勒本为地名；介词 בְּ 在贸易清单中标示交易货品，用“用”自然呈现。
- source_word: וְצֶמֶר צָחַר
  choice: 和洁白的羊毛
  rationale: צֶמֶר 是羊毛；צָחַר 在此通常理解为明亮、洁白。“洁白”兼顾颜色与光亮感。
theological_decisions: []
