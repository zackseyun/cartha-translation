  text: יְהוּדָה֙ וְ/אֶ֣רֶץ יִשְׂרָאֵ֔ל הֵ֖מָּה רֹכְלָ֑יִ/ךְ בְּ/חִטֵּ֣י מִ֠נִּית וּ/פַנַּ֨ג וּ/דְבַ֤שׁ וָ/שֶׁ֨מֶן֙ וָ/צֹ֔רִי נָתְנ֖וּ מַעֲרָבֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/017.yaml
  text: Judah and the land of Israel—they were your merchants; they traded for your merchandise with wheat of Minnith[a], pannag, honey, oil, and balm.
translation:
  language: zh_hans
  text: 犹大和以色列地的人都是你的商人；他们用米匿的小麦、帕拿格[a]、蜂蜜、油和香脂换取你的货物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帕拿格”原文含义不确定；有人认为是某种甜食、香料或糕饼。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלָיִךְ
  choice: 你的商人
  rationale: 该词指从事贸易的人；“商人”符合本章论推罗商业活动的语境，也自然简明。
- source_word: בְּחִטֵּי מִנִּית
  choice: 用米匿的小麦
  rationale: 介词表示用于交易的商品；“米匿的小麦”保留地名及原文的所属结构，可理解为产自米匿或以米匿著称的小麦。
- source_word: פַנַּג
  choice: 帕拿格
  rationale: 此词仅见于罕见语境，确切所指不明；采用音译可避免把某种推测写入正文，并以脚注说明可能含义。
- source_word: דְבַשׁ
  choice: 蜂蜜
  rationale: 采用该词通常且直接的词义。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原词泛指油，语境中可能是橄榄油，但原文没有明说，故不增加限定。
- source_word: צֹרִי
  choice: 香脂
  rationale: 该词指贵重的芳香树脂或药用香膏；“香脂”既保留物质属性，也避免误解为特定的乳香。
- source_word: נָתְנוּ מַעֲרָבֵךְ
  choice: 换取你的货物
  rationale: 字面结构近于“他们交出……作你的交换品”；在贸易清单中，以“用……换取你的货物”自然表达以所列商品进行交换的含义。
- source_word: יְהוּדָה וְאֶרֶץ יִשְׂרָאֵל
  choice: 犹大和以色列地的人
  rationale: 保留原文对“犹大”和“以色列地”的并列，同时补出“人”，使其作为“商人”的主语在现代汉语中顺畅明确。
theological_decisions: []
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。保留商业语境中的第二人称指称，并将不确定的罕见商品名音译；脚注标记紧随其实际所解释的“帕拿格”，而非“米匿”。
