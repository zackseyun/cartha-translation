  text: וְ/הִשְׁמִ֤יעוּ עָלַ֨יִ/ךְ֙ בְּ/קוֹלָ֔/ם וְ/יִזְעֲק֖וּ מָרָ֑ה וְ/יַעֲל֤וּ עָֽפָר֙ עַל רָ֣אשֵׁי/הֶ֔ם בָּ/אֵ֖פֶר יִתְפַּלָּֽשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/030.yaml
  text: They will make their voice heard over you and cry out bitterly[a]; they will throw dust on their heads[b]; they will roll in ashes.
translation:
  language: zh_hans
  text: 他们必为你放声，悲痛地呼喊；把尘土撒在自己头上，在灰中翻滚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在灰中辗转。”
    reason: 罕见动词 יִתְפַּלָּשׁוּ 可表达翻滚、辗转或扑卧于灰中的哀悼动作；具体姿态不能完全确定。
lexical_decisions:
- source_word: וְהִשְׁמִיעוּ עָלַיִךְ בְּקוֹלָם
  choice: 他们必为你放声
  rationale: הִשְׁמִיעוּ 是 שׁמע 的使役形，直指“使自己的声音被听见”；结合 עָלַיִךְ 的哀悼语境，译作“为你放声”既自然，也表明这是为推罗发出的哀声，而非敌对斥责。
- source_word: וְיִזְעֲקוּ מָרָה
  choice: 凄厉地呼号
  rationale: זעק 表示大声呼喊，מָרָה 在此作方式修饰，表达痛苦、悲切的呼号；“凄厉地呼号”保留强烈的哀悼色彩。
- source_word: וְיַעֲלוּ עָפָר עַל רָאשֵׁיהֶם
  choice: 把尘土撒在自己头上
  rationale: עלה 在这一哀悼动作中指把尘土扬起并落到头上；现代汉语用“撒在……头上”最清楚自然。“自己”明确反身所指，而不增加新含义。
- source_word: בָּאֵפֶר יִתְפַּלָּשׁוּ
  choice: 在灰中翻滚
  rationale: 罕见动词 פלשׁ 的 Hitpael 形在此描写哀悼者在灰中滚动或辗转；“翻滚”保留身体动作的具体形象，且避免把它弱化为仅仅“蒙灰”。
