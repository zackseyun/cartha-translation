base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/013.yaml
  text: Javan[a], Tubal, and Meshech—they were your traders; they exchanged human lives and articles of bronze for your wares.
translation:
  language: zh_hans
  text: 雅完、土巴和米设都是你的客商；他们以人[a]和铜器交换你的货物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“人的性命”；也可译为“人”。在这里很可能指被贩卖的人，即奴隶。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָוָן
  choice: 雅完
  rationale: 按希伯来族名音译，并采用现代中文圣经读者较熟悉的传统译名；不直接译作“希腊”，以免用后来的地理名称取代原文族名。
- source_word: תֻּבַל
  choice: 土巴
  rationale: 这是族群或地区的专名，采用中文传统音译。
- source_word: מֶשֶׁךְ
  choice: 米设
  rationale: 这是族群或地区的专名，采用中文传统音译。
- source_word: רֹכְלָיִךְ
  choice: 你的客商
  rationale: 该词指从事往来贸易的商人或贸易伙伴；“客商”简洁自然，也符合本章对推罗国际贸易的描写。
- source_word: בְּנֶפֶשׁ אָדָם
  choice: 人口
  rationale: 原文字面涉及“人的性命／人”，在贸易语境中指被当作商品交易的人。“人口”保留其物化而刺耳的表达，又不在正文中把其法律身份直接限定为“奴隶”。
- source_word: כְלֵי נְחֹשֶׁת
  choice: 铜器
  rationale: כְלֵי 泛指制成的器物，נְחֹשֶׁת 可指铜或青铜；“铜器”在中文中自然、概括，不把范围缩窄为容器。
- source_word: נָתְנוּ
  choice: 换取
  rationale: 该动词本义为“给”，但在此商业句式中表达以所列货品交换推罗货物；“换取”明确传达交易关系。
- source_word: מַעֲרָבֵךְ
  choice: 你的货物
  rationale: 本章语境指用于交换的商品；“货物”是自然、宽泛的现代中文表达。
theological_decisions: []
translation_notes:
