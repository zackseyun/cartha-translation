base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/029.yaml
  text: And all who handle the oar will come down from their ships[a]; the sailors, all the mariners of the sea[b], will stand on the land.
translation:
  language: zh_hans
  text: 所有掌桨的人[a]都要从他们的船上下来；水手，即所有从事海上航行的人[b]，都要站在陆地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掌桨的人”也可译作“划桨手”；希伯来文直译为“所有抓住桨的人”。
    reason: lexical_alternative
  - marker: b
    text: “从事海上航行的人”也可译作“海员”或“航海者”。原文在“水手”之后用了另一个泛指海上航行人员的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: 都要下来
  rationale: ירד的基本意思是“下去、下来”。本节描写船上人员离船登岸；在先知性哀歌的语境中，用“要下来”自然地表达这一场景的推进。
- source_word: מֵאָנִיּוֹתֵיהֶם
  choice: 从他们的船上
  rationale: אֳנִיָּה指海船，מן表示“从”。汉语说“从船上下来”既准确又自然。
- source_word: כֹּל תֹּפְשֵׂי מָשׁוֹט
  choice: 所有掌桨的人
  rationale: תפשׂ意为“抓住、拿着、操持”，משׁוט意为“桨”。“掌桨的人”保留原文具体形象，也不把它过早简化为职业名称“桨手”。
- source_word: מַלָּחִים
  choice: 水手
  rationale: 这是指船员或水手的常用词；“水手”是现代汉语中清楚自然的对应词。
- source_word: כֹּל חֹבְלֵי הַיָּם
  choice: 所有海上的航海者
  rationale: חֹבְלֵי הַיָּם泛指从事海上航行的人。“航海者”与前面的“水手”保持平行而不完全合并，保留哀歌中的铺陈和重复。
- source_word: אֶל הָאָרֶץ
  choice: 在陆地上
  rationale: 字面为“向着地面／陆地”，在船海语境中与船上相对。结合“站立”，汉语用“站在陆地上”最自然，同时避免把原文明确限缩为“岸边”。
- source_word: יַעֲמֹדוּ
  choice: 都要站
  rationale: עמד的基本义是“站立”。这里无需加入“列队”或“站定”等较强含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留原文“掌桨的人—水手—海上的航海者”的累积式并列，不因汉语中意义相近而将其合并；“陆地”保留海与陆的对照。
