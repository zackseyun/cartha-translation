base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/034.yaml
  text: At the time you were broken by the seas in the depths of the waters[b][a], your merchandise and all your assembly in your midst fell.
translation:
  language: zh_hans
  text: 当你在水深之处被众海击碎时，[a]你的货物和你里面所有聚集的人都倒下了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当你在水深之处被众海击碎时。”
    reason: lexical_alternative
  - marker: b
    text: “所有聚集的人”可广指聚集在推罗里面的所有人，包括居民、商人和航海人员。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: ……之时
  rationale: 保留时间名词所引出的时间情境，同时用现代汉语自然表达；也可理解为“当……时”。
- source_word: נִשְׁבֶּרֶת
  choice: 你被……击碎
  rationale: 该词为阴性单数被动式，与作为受话者的推罗相应。“击碎”保留 שבר 的破碎意象，又不直接限定为船只“失事”。
- source_word: מִיַּמִּים
  choice: 被众海
  rationale: 介词 מִן 在被动结构中可表示施事或原因；“众海”反映希伯来语复数形式，并保留海洋作为毁灭力量的意象。
- source_word: בְּמַעֲמַקֵּי מָיִם
  choice: 在深水之处
  rationale: 传达“水的深处”这一构造短语，措辞自然而庄重，并避免擅自将 מָיִם 限定为单数的“海”。
- source_word: מַעֲרָבֵךְ
  choice: 你的货物
  rationale: 在以西结书27章的贸易语境中指推罗的商品或船货；“货物”宽泛、清楚，也符合现代汉语。
- source_word: וְכָל קְהָלֵךְ
  choice: 你里面聚集的众人
  rationale: קהל 指聚集起来的群体；此译保留集合意义，而不把范围限缩为船员、商人或居民中的某一类。
- source_word: בְּתוֹכֵךְ
  choice: 你里面
  rationale: 保留城与船交叠的空间隐喻，表达所有人都在拟人化的推罗内部。
- source_word: נָפָלוּ
  choice: 都倒下了
  rationale: 按 נפל 的基本义翻译，不直接解释为“沉没”或“灭亡”，让海难语境自行呈现其含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。主句保留推罗作为阴性受话者及城—船隐喻；以“货物”和“聚集的众人”呈现商业财物与群体，又避免过度限定群体身份。所有脚注标记均置于正文相应位置。
