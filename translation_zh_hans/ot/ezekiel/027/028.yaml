  text: 你船员哀号的声音一响，城外的空地都要震动。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקוֹל
  choice: 听见……的声音
  rationale: לְקוֹל直译为“在……的声音下／因……的声音”，在本句中用“听见”自然表达声音响起时所引发的震动。
- source_word: זַעֲקַת
  choice: 哀号
  rationale: זְעָקָה表示在危难中的呼喊或哀号；本章是为推罗所作的哀歌，“哀号”贴合语境。
- source_word: חֹבְלָיִךְ
  choice: 你的船员
  rationale: 该词在航海语境中指操持绳索、驾船或划船的人；“船员”既自然，也保留较宽泛的含义，具体可能指水手、桨手或掌舵者。
- source_word: יִרְעֲשׁוּ
  choice: 都要震动
  rationale: רעש表示震动、摇撼；“震动”保留审判诗歌中强烈的物理意象。
- source_word: מִגְרֹשׁוֹת
  choice: 四周的牧场
  rationale: מִגְרָשׁ通常指城镇外围供放牧等用途的空地，并非现代意义的郊区；“四周的牧场”清楚呈现其位置和常见用途。
