base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/033.yaml
  text: When your wares went out from the seas[a], you satisfied many peoples[b]; with your abundant wealth and your merchandise you enriched the kings of the earth.
translation:
  language: zh_hans
  text: 当你的货物从海上运出时[a]，你使许多民族得满足；你借着丰厚的财富和商品，使地上的君王富足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从海上运出”原文直译为“从众海出来”；原文“海”为复数。
    reason: 保留原文复数形式，并说明介词短语与“出去”相连的表达。
  - marker: b
    text: “地上的君王”也可译作“这地的君王”；希伯来语 אֶרֶץ 可指“地上”或“这地、土地”。
    reason: 保留 אֶרֶץ 在此处范围上的词义歧义。
lexical_decisions:
- source_word: בְּצֵאת
  choice: ……运出时
  rationale: 介词 בְּ 与不定式组合构成时间从句；译为“……时”自然地保留“当……出去”的时间意义。
- source_word: עִזְבוֹנַיִךְ
  choice: 你的货物
  rationale: 此词在推罗哀歌的贸易语境中指运载交易的货品；“货物”清楚自然，并与后文“商品”略作区分。
- source_word: מִיַּמִּים
  choice: 从海上
  rationale: 原文为复数“从众海”；汉语“从海上运出”自然传达海运场景，脚注说明复数形式及另一种理解。
- source_word: הִשְׂבַּעַתְּ
  choice: 你使……得到饱足
  rationale: 使役形表达“使满足、使饱足”；此译保留原文丰富供应乃至满足需求的意象，而不缩减为单纯“供应”。
- source_word: עַמִּים רַבִּים
  choice: 许多民族
  rationale: עַמִּים 指不同族群或民族；“民族”比现代政治意义较强的“国家”更贴近原文。
- source_word: בְּרֹב הוֹנַיִךְ
  choice: 以丰厚的财富
  rationale: בְּ 表示凭借或手段，רֹב 表示丰盛、众多；“以丰厚的财富”简洁传达工具意义。
- source_word: וּמַעֲרָבַיִךְ
  choice: 和商品
  rationale: 在《以西结书》27章的贸易词汇中，此词指用于交易或交换的商品；“商品”符合现代汉语商贸语境。
- source_word: הֶעֱשַׁרְתְּ
  choice: 使……富足
  rationale: עשר 的使役形意为“使富有”；“使……富足”直接保留其使役意义。
- source_word: מַלְכֵי אָרֶץ
  choice: 地上的君王
  rationale: אֶרֶץ 可指“地、土地、全地”；国际贸易语境支持较广的“地上”，同时以脚注保留“当地君王”的可能性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留第二人称阴性单数对推罗的拟人称呼，但汉语不显语法性别；句式维持原文先供应众民、后使君王富足的平行推进。
