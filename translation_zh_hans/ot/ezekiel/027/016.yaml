  text: אֲרָ֥ם סֹחַרְתֵּ֖/ךְ מֵ/רֹ֣ב מַעֲשָׂ֑יִ/ךְ בְּ֠/נֹפֶךְ אַרְגָּמָ֨ן וְ/רִקְמָ֤ה וּ/בוּץ֙ וְ/רָאמֹ֣ת וְ/כַדְכֹּ֔ד נָתְנ֖וּ בְּ/עִזְבוֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/016.yaml
  text: Aram traded with you because of your many products[a], giving turquoise, purple, embroidered cloth, fine linen, coral[c][b], and rubies for your wares.
translation:
  language: zh_hans
  text: 亚兰因你的产品丰富，便与你通商；他们拿绿松石[a]、紫色布料、刺绣布、细麻布、珊瑚[b]和红宝石[c]换取你的货物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“绿宝石”或“红玉髓”；这个希伯来宝石名称所指的具体矿石不能确定。
    reason: lexical_alternative
  - marker: b
    text: 也可能指珍珠母一类的其他贵重材料；译作“珊瑚”的这个希伯来词含义不能确定。
    reason: lexical_alternative
  - marker: c
    text: 或译“玛瑙”“石榴石”，也可能是另一种宝石；这个希伯来词所指的具体宝石不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: 亚兰
  rationale: 保留希伯来地名，不以现代政治地名“叙利亚”替代；在本贸易语境中可泛指亚兰地区或其商人。
- source_word: סֹחַרְתֵּךְ
  choice: 与你通商
  rationale: 该词表示商贸活动；“与你通商”自然表达亚兰作为推罗贸易伙伴的关系。
- source_word: מֵרֹב מַעֲשָׂיִךְ
  choice: 因你的制品众多
  rationale: 原文直译近于“因你所造之物丰富”；贸易语境表明所指是推罗大量的产品或制成品。“制品”既保留“所作之物”的含义，也符合上下文。
- source_word: נֹפֶךְ
  choice: 绿松石
  rationale: 这种宝石的确切种类不明；正文采用一种常见而合乎奢侈品清单语境的译法，并以脚注保留不确定性。
- source_word: אַרְגָּמָן
  choice: 紫色料
  rationale: 该词可指紫色染料或紫色织物。“紫色料”在商品清单中简洁自然，同时避免过度限定其具体形态。
- source_word: רִקְמָה
  choice: 刺绣布
  rationale: 该名词指刺绣品或刺绣工艺；贸易清单中译为可交易的纺织品最为自然。
- source_word: בוּץ
  choice: 细麻布
  rationale: 指上等麻织物；“细麻布”是现代中文中清楚而庄重的对应表达。
- source_word: רָאמֹת
  choice: 珊瑚
  rationale: 此罕见词含义不确定，在本节通常理解为珊瑚一类的贵重材料；以脚注说明其他可能。
- source_word: כַדְכֹּד
  choice: 红宝石
  rationale: 该宝石名的确切所指不明；“红宝石”符合奢侈品贸易语境，但须以脚注保留其他辨认可能。
- source_word: נָתְנוּ
  choice: 他们拿……换取
  rationale: 原义为“他们给”；结合商贸语境及介词结构，译成“拿……换取”可清楚表达以所列物品进行交换，而不改变交易关系。
- source_word: בְּעִזְבוֹנָיִךְ
  choice: 换取你的货物
  rationale: 该名词指商品或货物；与“拿……换取”连用，清楚传达原文的交换含义。
theological_decisions: []
