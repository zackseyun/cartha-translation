base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/025.yaml
  text: The ships of Tarshish were your carriers for your merchandise[b][a], and you were filled and became very heavy in the heart of the seas.
translation:
  language: zh_hans
  text: 他施的船只为你运载货物[a]；你满载了，在众海深处[b]变得极其沉重。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你运载货物”所译的希伯来语较罕见，解释也有分歧；也可理解为“作你的货运船只”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“在众海之心”，指海洋当中或深处。
    reason: cultural_note
lexical_decisions:
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: 他施的船只
  rationale: 保留原文地名及其与远洋贸易相关的固定表达，不笼统译作“商船”或“远洋船”。
- source_word: שָׁרוֹתַיִךְ
  choice: 替你运载
  rationale: 结合本章贸易与航运语境，将这个较罕见且解释有分歧的词理解为船只为推罗承担运输服务；用动词表达可使现代汉语自然，并避免不合船舶意象的“商队”。
- source_word: מַעֲרָבֵךְ
  choice: 货物
  rationale: 本章中该词指贸易中交换、运输的商品；“货物”既准确又符合船运语境。
- source_word: וַתִּמָּלְאִי
  choice: 你装得满满的
  rationale: 保留“充满”的结果义，同时在船运隐喻中自然表达满载状态。
- source_word: וַתִּכְבְּדִי מְאֹד
  choice: 变得极其沉重
  rationale: 按海上满载货物的上下文取实际重量之义，而不取“尊贵”之义；也保留由满载而沉重的鲜明意象。
- source_word: בְּלֵב יַמִּים
  choice: 在海洋中心
  rationale: 直译“在众海之心”，保留希伯来语的“心”这一空间隐喻，同时用现代汉语可理解的表达呈现。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“替你运载”呈现商贸航运关系，以“装得满满的”“极其沉重”保留推罗如满载船只的拟人化意象；脚注说明罕见词和希伯来空间习语，不消除原文可见的词义张力。
