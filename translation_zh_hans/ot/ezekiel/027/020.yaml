  text: 底但是你的商人，经营供骑乘用的织物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“底但用供骑乘用的鞍布同你交易。”希伯来语所指的织物确切为何，不能确定。
    reason: 保留原文商业句法的另一种译法，并说明该专门织物术语的词义不确定；“鞍布”作为可能理解置于脚注，不在正文中加以确定。
lexical_decisions:
- source_word: דְּדָן
  choice: 底但
  rationale: 专有地名，采用现代中文圣经中通行的音译。
- source_word: רֹכַלְתֵּךְ
  choice: 与你交易
  rationale: 该词根在商业语境中表示经商、贸易；第二人称阴性单数后缀直接指向推罗，用“与你交易”自然保留这一关系。
- source_word: בְּבִגְדֵי
  choice: 用……布
  rationale: בגד通常指衣物或织物；在贸易清单中宜理解为一类纺织品，用“布”比“衣服”更贴合商品语境。
- source_word: חֹפֶשׁ
  choice: 鞍布
  rationale: 此词在这里可能是与骑乘装备有关的专门纺织品名称，确切含义不明；结合后面的לְרִכְבָּה，正文以“鞍布”表达最可能的所指。
- source_word: לְרִכְבָּה
  choice: 骑乘用的
  rationale: 源于רכב，泛指骑乘或乘驾；译文不限定为马匹或战车，以免超出原文。
