  text: 你，人子啊，要为推罗作一首哀歌[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要为推罗举哀。”希伯来语动词的字面意思是“举起”；它与“哀歌”连用时，是发出或作哀歌的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 至于你
  rationale: 连词与独立代词合用，既转换话题，又加强直接称呼。“至于你”自然保留这一篇章衔接和强调，不把 וְ 机械译为“和”。
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是以西结书中固定的神圣称呼。“人子”保留希伯来语的形式和全书的一致性，也符合中文圣经语体。
- source_word: שָׂא
  choice: 作
  rationale: 该动词字面义为“举起、承担”，与“哀歌”连用时是开始或发出哀歌的惯用表达。中文“作一首哀歌”准确传达其语境功能；字面意象另以脚注说明。
- source_word: עַל
  choice: 为
  rationale: 在哀歌语境中，עַל 标示哀悼所关涉的对象。“为推罗”在现代汉语中自然，并避免“攻击推罗”的歧义。
- source_word: צֹר
  choice: 推罗
  rationale: 采用该古代腓尼基城邦在现代中文圣经及历史文献中的通行译名。
- source_word: קִינָה
  choice: 一首哀歌
  rationale: 该词指正式的哀悼诗歌；量词“首”符合中文搭配，也保留其文学体裁含义。
