base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/008.yaml
  text: The inhabitants of Sidon and Arvad were your rowers; your wise men[a], O Tyre, were within you; they were your pilots.
translation:
  language: zh_hans
  text: 西顿和亚瓦底的居民作你的桨手；推罗啊，你中间的智慧人[a]，他们作你的掌舵者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“能人”或“技师”。这里的希伯来语既可指有智慧的人，也可指具备专门技能的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי צִידוֹן וְאַרְוַד
  choice: 西顿和亚发的居民
  rationale: יֹשְׁבֵי是ישׁב的构造式分词，指居住在某地的人；“居民”简洁自然。西顿、亚发采用现代中文圣经地名的通行译法。
- source_word: שָׁטִים לָךְ
  choice: 给你划桨
  rationale: שָׁטִים在船舶语境中指划桨者；将介词短语לָךְ译作“给你”，既保留服务对象，也比名词化的“作你的桨手”更自然。
- source_word: חֲכָמַיִךְ
  choice: 你自己的能人[a]
  rationale: חכם既可表示有智慧，也可表示具备专门技能的人；此处航海语境偏重才干。“能人”保留一定广度，不把其职能过早限定为水手或舵手；后缀译为“你自己的”，并与前句外地人员形成对照。
- source_word: צוֹר
  choice: 推罗啊
  rationale: 专名采用中文通行译名；原文为呼格式直接称呼，用“啊”自然标示。
- source_word: בָךְ
  choice: 在你里面
  rationale: 原文把推罗拟作船，בָךְ表示这些人员在其中；直译可保存城市与船只意象的叠合。
- source_word: הֵמָּה חֹבְלָיִךְ
  choice: 他们为你掌舵
  rationale: חֹבְלִים可泛指船员，也可指操船、领航者；在与“划桨”并列且由推罗能人担任的语境中，“掌舵”自然表达船舶管理和操控功能。הֵמָּה的强调以明确的“他们”体现。
