  yaml_path: translation/ot/ezekiel/027/035.yaml
  text: All the inhabitants of the coastlands are appalled at you[a], and their kings shudder with horror[c][b]; their faces are convulsed.
translation:
  language: zh_hans
  text: 所有沿海地区的居民都因你惊骇[a]；他们的君王惊恐战栗[b]，面容颤动[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沿海地区”或译“海岛”。希伯来语 אִיִּים 既可指海岛，也可泛指临海之地。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译近于“战栗着战栗”，这是用同根词加强语气的表达，表示极度惊恐。
    reason: lexical_alternative
  - marker: c
    text: 本句希伯来语含义较难确定；“面容颤动”也可译作“脸在颤抖”或“面容扭曲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יֹשְׁבֵי הָאִיִּים
  choice: 所有沿海地区的居民
  rationale: יֹשְׁבֵי是“居民”的构造式；אִיִּים既可指海岛，也可泛指临海之地。推罗神谕的航海语境支持译作“沿海地区”，同时在脚注保留“海岛”这一词义。
- source_word: שָׁמְמוּ עָלָיִךְ
  choice: 都因你惊骇
  rationale: שׁמם在此描述旁观者面对推罗遭遇时的震惊，而不是他们自身变为荒凉；עַל表示引发这种反应的对象或缘由。
- source_word: וּמַלְכֵיהֶם
  choice: 他们的君王
  rationale: 直译连接词、名词及第三人称阳性复数后缀，所指为上述沿海地区居民的君王。
- source_word: שָׂעֲרוּ שַׂעַר
  choice: 惊恐战栗
  rationale: 动词与同根名词构成同源宾语结构，加强剧烈震颤、惊恐不安的程度；“惊恐战栗”以自然中文传达这种强烈反应。
- source_word: רָעֲמוּ פָּנִים
  choice: 面容抽搐
  rationale: 该短语含义较难确定，似描写脸因恐惧而颤动或扭曲；“面容抽搐”保留鲜明的身体反应意象，其他可能译法列于脚注。
