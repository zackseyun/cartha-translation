base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/031.yaml
  text: They will make themselves bald for you[a], and put on sackcloth, and they will weep over you with bitterness of soul, with bitter mourning.
translation:
  language: zh_hans
  text: 他们为你剃成光头，腰束麻布；他们要怀着满心苦楚为你痛哭，发出凄苦的哀号。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיחוּ אֵלַיִךְ קָרְחָה
  choice: 他们为你剃成光头
  rationale: קרח 的使役式与 קָרְחָה 连用，指以剃秃头作为哀悼举动；“为你”表达推罗是哀悼的对象。
- source_word: וְחָגְרוּ שַׂקִּים
  choice: 腰束麻布
  rationale: 保留 חגר“束在腰间”的具体意象，同时用现代中文可理解的传统哀悼表达。
- source_word: וּבָכוּ אֵלַיִךְ
  choice: 他们为你痛哭
  rationale: בכה 表示哭泣；介词短语在此指向哀悼对象。“痛哭”符合庄重哀歌语境。
- source_word: בְּמַר נֶפֶשׁ
  choice: 心中苦楚
  rationale: 直译近于“在生命／心魂的苦楚中”；נפשׁ 此处指人的内在生命。“心中苦楚”自然地保留深层内在痛苦之意。
- source_word: מִסְפֵּד מָר
  choice: 哀号凄切
  rationale: מִסְפֵּד 是哀悼、哀号，מָר 表示苦痛深切；此译保留末尾加强哀恸的作用，并避免生硬重复“苦”。
