base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/024.yaml
  text: They were your merchants in choice wares[a], in wraps of blue and embroidered cloth, and in treasuries of multicolored fabrics, bound with cords and secured[b], among your merchandise.
translation:
  language: zh_hans
  text: 他们是在你的商品贸易中经营上等货品、蓝色布卷、刺绣布料，以及用绳索捆扎、妥为包扎的成箱彩色织物[a]的商人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句“成箱的彩色织物”所依据的希伯来文短语含义不确定；也可理解为贵重的储藏品、箱柜，或成捆的彩色织物。“妥为包扎”所依据的最后一个词也有人按“香柏木”理解，因而译作“装在香柏木箱中”或“以香柏木衬里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלַיִךְ
  choice: 与你交易
  rationale: 该词指参与推罗贸易网络的商人；结合介词结构，在汉语中译成“与你交易”比直译“是你的商人”更自然，也保持商业语境。
- source_word: מַכְלֻלִים
  choice: 上等货品
  rationale: 该词在贸易清单中指精选、精制或贵重的物品；“上等货品”自然地表达其品质优良，同时避免把词义限定为某一种奢侈品。
- source_word: גְלוֹמֵי תְּכֵלֶת
  choice: 蓝色布卷
  rationale: גְלוֹמֵי 在此可能指包裹或卷起的纺织品，而非必然指成衣；תְּכֵלֶת 指蓝色或蓝紫色染料所染的材料。“蓝色布卷”符合商品清单的语境。
- source_word: רִקְמָה
  choice: 刺绣布料
  rationale: 该词可指刺绣或刺绣制品；在纺织品贸易清单中译作“刺绣布料”，明确而自然。
- source_word: גִנְזֵי בְּרֹמִים
  choice: 成箱的彩色织物
  rationale: 这一短语含义不确定；גִנְזֵי 可指储藏处、箱柜或珍藏之物，בְּרֹמִים 常被理解为多彩或杂色的织物。“成箱的彩色织物”在汉语中简洁地呈现贵重纺织品被装存的图景，同时以脚注保留不确定性。
- source_word: חֲבָלִים חֲבֻשִׁים
  choice: 用绳索捆扎
  rationale: חֲבָלִים 指绳索，חֲבֻשִׁים 是“捆绑、扎住”的被动形式；合译为“用绳索捆扎”准确且符合汉语包装用语。
- source_word: אֲרֻזִים
  choice: 牢固
  rationale: 该形式疑难；依紧接“用绳索捆扎”的语境，将其理解为包装妥当、扎牢，译作“牢固”。另有从“香柏木”理解的读法，收入脚注。
- source_word: מַרְכֻלְתֵּךְ
  choice: 你的商品
  rationale: 本章中该词指推罗所经营的货物或贸易；此处清单具体列举货品，故“你的商品”最为贴切。
