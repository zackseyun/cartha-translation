- from: 他们用上等货品、蓝色布卷和刺绣布料，以及成箱的彩色织物与你交易；这些货物都用绳索捆扎牢固[a]，作为你的商品。
  to: 他们是在你的商品贸易中经营上等货品、蓝色布卷、刺绣布料，以及用绳索捆扎、妥为包扎的成箱彩色织物[a]的商人。
  rationale: 修订恢复“他们是你的商人”这一基本关系，并将商品和包装描述整合为汉语中清楚的定语结构。这样既不把捆扎语无根据地扩展到全部货品，也保留原文疑难词的暂定处理及脚注中的主要替代理解。
