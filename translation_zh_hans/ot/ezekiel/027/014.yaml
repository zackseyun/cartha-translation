  yaml_path: translation/ot/ezekiel/027/014.yaml
  text: From Beth-togarmah they traded horses[a], horsemen[b], and mules for your wares.
translation:
  language: zh_hans
  text: 陀迦玛人[a]以马、骑兵[b]和骡子交换你的货物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从伯陀迦玛”或“从陀迦玛之家”。希伯来语这一表达可指与陀迦玛相关的人群或地区，并非一定指实际的家庭。
    reason: lexical_alternative
  - marker: b
    text: “骑兵”也可译作“战马”或“骑兵用马”。该希伯来语词通常指骑马者或骑兵；但在这里与马和骡子同列为交易品，也可能指供骑兵使用的马。
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֵּית תּוֹגַרְמָה
  choice: 陀迦玛族的人
  rationale: בֵּית字面为“家、家族”，在此贸易伙伴名单中指与陀迦玛相关的族群或地区；译作“陀迦玛族的人”自然地表达来源与主体，同时避免理解为一个具体家庭。
- source_word: סוּסִים
  choice: 马
  rationale: 该词是“马”的常用复数形式，置于牲畜贸易清单中含义明确。
- source_word: וּפָרָשִׁים
  choice: 骑兵
  rationale: פָּרָשִׁים通常指骑马者或骑兵。虽然与牲畜并列的贸易语境可能支持“战马、骑兵用马”，但原词直接的人称意义宜保留，并以脚注说明另一可能。
- source_word: וּפְרָדִים
  choice: 骡子
  rationale: 该词通常指骡子，符合本节牲畜清单的语境。
- source_word: נָתְנוּ
  choice: 用……换取
  rationale: 字面为“给”，但在以西结书27章的商业语境中表示将货物交付作为交易或交换；“用……换取”清楚呈现这一关系。
- source_word: עִזְבוֹנָיִךְ
  choice: 你的货物
  rationale: 该词在本章指推罗的商品或货物；“货物”是现代汉语中自然、简洁的商业用语。
theological_decisions: []
