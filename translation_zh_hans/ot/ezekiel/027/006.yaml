  text: אַלּוֹנִים֙ מִ/בָּ֔שָׁן עָשׂ֖וּ מִשּׁוֹטָ֑יִ/ךְ קַרְשֵׁ֤/ךְ עָֽשׂוּ שֵׁן֙ בַּת אֲשֻׁרִ֔ים מֵ/אִיֵּ֖י כתים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/006.yaml
  text: They made your oars of oaks from Bashan[c][b][a]; they made your deck of ivory from the coasts of Kittim.
translation:
  language: zh_hans
  text: 他们用巴珊的橡树做你的桨；你的船板，他们用来自基提海岛的象牙和某种木材制成[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “船板”或译“甲板”。希伯来词通常指木板或板材，具体指船的哪一部分并不确定。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来原文艰涩。相关短语按字面可近似译为“象牙、亚述人之女”；其确切含义不明。有些译法将它理解为一种木材，如黄杨木或柏木，并认为象牙镶嵌在这种木材中。
    reason: alternative_reading
  - marker: c
    text: “基提”大概指塞浦路斯，也可能泛指附近的西方海岛或沿海地区。
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוֹנִים
  choice: 橡树
  rationale: 该词指大型硬木树木，也可能指笃耨香树；在巴珊木材和造船语境中译作“橡树”自然稳妥。
- source_word: מִבָּשָׁן
  choice: 巴珊的
  rationale: 保留地名，表达木材来自以林木著称的巴珊。
- source_word: מִשּׁוֹטָיִךְ
  choice: 你的桨
  rationale: 本章以船描绘推罗，此处明确指划船所用的桨。
- source_word: קַרְשֵׁךְ
  choice: 你的甲板
  rationale: 该词基本义为木板、板材；在船舶语境中可理解为甲板，但具体部件并不确定，故脚注保留“船板”的可能。
- source_word: שֵׁן
  choice: 象牙
  rationale: 字面为“牙”，用作材料名称时指象牙。
- source_word: בַּת אֲשֻׁרִים
  choice: 木料
  rationale: 希伯来语原文艰涩，字面近似“亚述林之女”；有解释认为它指黄杨木或柏木等木材。正文用较宽泛的“木料”维持船材语境，同时在脚注说明疑难，不武断指定树种。
- source_word: מֵאִיֵּי כִתִּים
  choice: 来自基提的海岛
  rationale: אִיִּים可指海岛或沿海地区；“基提”保留原地名，其范围大概包括塞浦路斯及附近西方海域。
