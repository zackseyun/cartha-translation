  text: שֵׁשׁ בְּ/רִקְמָ֤ה מִ/מִּצְרַ֨יִם֙ הָיָ֣ה מִפְרָשֵׂ֔/ךְ לִ/הְי֥וֹת לָ֖/ךְ לְ/נֵ֑ס תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן מֵ/אִיֵּ֥י אֱלִישָׁ֖ה הָיָ֥ה מְכַסֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/007.yaml
  text: Fine embroidered linen from Egypt was your sail[a], serving as your banner[b]; blue and purple from the coasts of Elishah was your covering.
translation:
  language: zh_hans
  text: 埃及的绣花细麻布作你的帆，成为你的旗号[b]；以利沙沿海地带[a]的蓝色和紫色布料作你的遮盖物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以利沙的岛屿”。希伯来语可指岛屿，也可指沿海地带。
    reason: lexical_alternative
  - marker: b
    text: 或译“成为你的旗帜”或“成为你的信号”。这里的希伯来语指远处可见的旗帜、标志或信号。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ בְּרִקְמָה
  choice: 绣花细麻布
  rationale: שֵׁשׁ指优质细麻布，רִקְמָה指刺绣或精工织成的花纹；合译为“绣花细麻布”，既体现贵重材质，也自然传达其工艺。
- source_word: מִמִּצְרַיִם
  choice: 埃及的
  rationale: 介词מִן表示来源；汉语用“埃及的”自然地表达这种布料产自埃及。
- source_word: מִפְרָשֵׂךְ
  choice: 你的帆
  rationale: 在全章以推罗为华美船只的比喻中，מִפְרָשׂ最适合译为船帆。
- source_word: לִהְיוֹת לָךְ לְנֵס
  choice: 成为你的旗号
  rationale: נֵס可指旗帜、标志或远处可见的信号；“旗号”既保留可识别的标志作用，也符合船只意象。
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: 蓝色和紫色布料
  rationale: 两个词既表示相应颜色，也常指用这些颜色染成的贵重织物；补出“布料”使其与“作你的篷盖”衔接自然。
- source_word: מֵאִיֵּי אֱלִישָׁה
  choice: 以利沙沿海地带的
  rationale: אִיִּים可指岛屿或沿海地带；正文采用适合海上贸易语境的“沿海地带”，并以脚注保留“岛屿”这一可能。
- source_word: מְכַסֵּךְ
  choice: 你的篷盖
  rationale: 该词指遮盖物；在船只语境中，“篷盖”比笼统的“遮盖物”自然，同时不把它限定为现代船舶的特定构件。
theological_decisions:
- issue: נֵס在船只比喻中的具体所指
  choice: 旗号
  alternative: 旗帜；标志；信号
  rationale: 原文强调帆成为远处可见、可供识别之物，但没有精确限定其功能；正文用“旗号”，脚注保留“旗帜或信号”的语义范围。
- issue: אִיִּים的地理含义
  choice: 沿海地带
  alternative: 岛屿
  rationale: 两种含义均有词汇依据，且都会影响对以利沙地理范围的理解；正文按贸易语境取“沿海地带”，不排除“岛屿”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保持推罗被描绘为华美船只的意象。“绣花细麻布”“帆”“篷盖”形成连贯的航海图景；对“沿海地带/岛屿”和“旗号/信号”的真实歧义用脚注保留。
