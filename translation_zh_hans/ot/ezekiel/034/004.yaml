  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶֽת הַ/נַּחְלוֹת֩ לֹ֨א חִזַּקְתֶּ֜ם וְ/אֶת הַ/חוֹלָ֣ה לֹֽא רִפֵּאתֶ֗ם וְ/לַ/נִּשְׁבֶּ֨רֶת֙ לֹ֣א חֲבַשְׁתֶּ֔ם וְ/אֶת הַ/נִּדַּ֨חַת֙ לֹ֣א הֲשֵׁבֹתֶ֔ם וְ/אֶת הָ/אֹבֶ֖דֶת לֹ֣א בִקַּשְׁתֶּ֑ם וּ/בְ/חָזְקָ֛ה רְדִיתֶ֥ם אֹתָ֖/ם וּ/בְ/פָֽרֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/004.yaml
  text: You have not strengthened the weak[a], and you have not healed the sick, and you have not bound up the broken, and you have not brought back the strayed, and you have not sought the lost[c][b]; but with force and with harshness you have ruled them.
translation:
  language: zh_hans
  text: 你们没有使软弱的[a]强壮，没有医治患病的，没有包扎折伤的，没有领回被赶散的[b]，也没有寻找失丧的；你们反倒用强力和严酷[c]辖制它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “软弱的”或译“患病的”。原词可表示患病或衰弱；这里译作“软弱的”，以便与下一句“患病的”有所区别。
    reason: lexical_alternative
  - marker: b
    text: “被赶散的”也可译作“走迷的”。原词既可强调被驱赶离开，也可描述偏离羊群。
    reason: lexical_alternative
  - marker: c
    text: “严酷”也可译作“残酷无情”。原词含有苛刻、压榨性的严厉意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּחְלוֹת
  choice: 软弱的
  rationale: 该词源于 חלה，可指患病或衰弱；下句另有 הַחוֹלָה“患病的”，故此处译作“软弱的”，既保留区别，也与“使……强壮”自然对应。
- source_word: חִזַּקְתֶּם
  choice: 使……强壮
  rationale: חזק 的 Piel 形式表示使强壮、坚固；如此翻译可明确表达使役意义，并保留牧养意象。
- source_word: הַחוֹלָה
  choice: 患病的
  rationale: חלה 的分词性形式，在此直接指患病的羊，与前面的“软弱的”构成递进。
- source_word: רִפֵּאתֶם
  choice: 医治
  rationale: רפא 的基本义是医治；既准确，又适合受忽视羊群的比喻语境。
- source_word: לַנִּשְׁבֶּרֶת
  choice: 折伤的
  rationale: שבר 的被动分词字面表示被折断的；“折伤的”在现代汉语中兼顾字面形象和受伤含义，并能自然搭配“包扎”。
- source_word: חֲבַשְׁתֶּם
  choice: 包扎
  rationale: חבש 在医治伤处的语境中指包裹、缠裹伤口；“包扎”是自然准确的现代汉语表达。
- source_word: הַנִּדַּחַת
  choice: 被赶散的
  rationale: נדח 可表示被赶走、驱散或流离；被动表达“被赶散的”保留了原文可能强调外力驱离的一面，也符合羊群意象。
- source_word: הֲשֵׁבֹתֶם
  choice: 领回
  rationale: שוב 的 Hiphil 形式表示使返回、带回来；羊群语境下“领回”自然，并保留牧人的动作。
- source_word: הָאֹבֶדֶת
  choice: 失丧的
  rationale: אבד 在此牧羊语境中指迷失、丢失；“失丧的”庄重而通顺，也保留经文中的牧养语汇。
- source_word: בִקַּשְׁתֶּם
  choice: 寻找
  rationale: בקש 表示寻求、寻找；与“失丧的”搭配自然。
- source_word: וּבְחָזְקָה
  choice: 用强力
  rationale: 该介词短语描述辖制的方式，表示凭强力或强暴；主文采用“用强力”，不过度限定为身体暴力。
- source_word: רְדִיתֶם
  choice: 辖制
  rationale: רדה 表示统治、管辖；上下文具有压迫意味，“辖制”可保留统治含义，而负面力度主要由“强力和严酷”表达。
- source_word: וּבְפָרֶךְ
  choice: 和严酷
  rationale: פֶרֶךְ 表示严厉、苛酷甚至摧残性的对待；“严酷”保留强烈谴责，又不擅自扩展具体暴行。
theological_decisions:
- issue: 牧人与羊群的比喻语域
  choice: 保留“强壮、医治、包扎、领回、寻找”等照料羊群的动作，不改写成纯政治语言。
  alternative: 直接解释为领袖没有扶助、保护和召回百姓。
  rationale: 本章借牧人和羊群谴责以色列的领袖。保留比喻可维持先知话语的形象、张力及其与圣经其他牧人经文的联系。
- issue: 被赶散与自行迷失之间的含混
  choice: 主文译作“被赶散的”，脚注注明也可理解为“走迷的”。
  alternative: 主文译作“走迷的”或“迷失的”。
  rationale: הַנִּדַּחַת 是被动形式，可能强调遭到驱赶，也可在羊群语境中描述偏离群体的结果；主文保留被动色彩，脚注保存另一种自然理解。
- issue: 末句压迫意味的表达位置
  choice: 用“强力和严酷”修饰“辖制”，不把动词本身强化为“残暴奴役”。
  alternative: 译作“残暴地统治”或“无情地压服”。
  rationale: 原文的负面力度主要由两个方式短语承担；保留这一结构可避免释义过度，同时清楚表达领袖的压迫。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。重复使用“没有”以保留原文连续控诉的节奏；末句用“反倒”显明转折。“它们”维持羊群比喻，不在正文中直接改称百姓。
