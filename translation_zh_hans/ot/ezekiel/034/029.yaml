base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/029.yaml
  text: And I will raise up for them a planting of renown[a], and they will no longer be consumed by famine in the land[b], nor will they bear the disgrace of the nations anymore.
translation:
  language: zh_hans
  text: 我必为他们兴起一片享有盛名的栽植[a]；他们在这地不再被饥荒吞噬[b]，也不再承受列国的羞辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一片为名声而设的栽植”；原文直译为“为名的栽植”，通常可理解为“享有盛名的栽植”。
    reason: lexical_alternative
  - marker: b
    text: “被饥荒吞噬”所译的原文短语含义较难确定，字面近于“饥荒所收聚的人”，可能指“饥荒的受害者”或“被饥荒夺去的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: 我必……兴起
  rationale: 使役形可表示“使之起来、兴起、设立”；此处保留上帝主动施行的语气，并自然搭配后面的栽植意象。
- source_word: מַטָּע
  choice: 一片……栽植
  rationale: 该名词可指所栽种之物、栽植或栽植之地。“一片栽植”保留农业意象，又不将其过度限定为园林、种植园或单株植物。
- source_word: לְשֵׁם
  choice: 有名的
  rationale: 字面为“为名”，在此表示有名声、享有声誉；“有名的”符合现代汉语，同时保留脚注说明其字面结构。
- source_word: אֲסֻפֵי רָעָב
  choice: 被饥荒吞噬
  rationale: 原文短语艰涩，אסף 的被动形式字面涉及“被收聚”，在语境中可能指因饥荒被除去或成为饥荒的受害者。“被饥荒吞噬”表达其结果义，疑难处留脚注说明。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 本段语境指向以色列所得之地；“这地”比泛指全球的“大地”更合适，同时没有额外明说“以色列地”。
- source_word: יִשְׂאוּ
  choice: 承受
  rationale: נשא 基本义为举起、携带、担当；与“羞辱”搭配时，“承受”自然地表达承担、忍受之意。
- source_word: כְּלִמַּת
  choice: 羞辱
  rationale: 该词可指羞耻、耻辱或公开的凌辱；“羞辱”兼顾外在侮辱和由此造成的蒙羞。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 先知书中通常指以色列周围的各国；“列国”简洁庄重，也避免将其限定为某一族群概念。
theological_decisions:
- issue: 所应许之“栽植”的性质
  choice: 保留农业性的“栽植”意象，不明确认定其为某位弥赛亚人物，也不把它仅解释为农业丰收。
  alternative: 可理解为弥赛亚式的枝条或人物，也可理解为著名的种植地、丰饶供应或复兴后的群体。
  rationale: מַטָּע לְשֵׁם 本身没有明确指定所栽之物究竟是人物、群体还是土地的丰饶。译文保留其开放性，不在正文中加入经文本身未明说的教义判断。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“我必”体现先知性应许的确定语气；分号划分供应与免受羞辱两层结果。所有疑难和神学开放性均通过正文措辞与脚注保留。
