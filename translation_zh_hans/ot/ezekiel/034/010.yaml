id: EZK.34.10
reference: Ezekiel 34:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י אֶֽל הָ/רֹעִ֜ים וְֽ/דָרַשְׁתִּ֧י אֶת צֹאנִ֣/י מִ/יָּדָ֗/ם וְ/הִשְׁבַּתִּי/ם֙ מֵ/רְע֣וֹת צֹ֔אן וְ/לֹא יִרְע֥וּ ע֛וֹד הָ/רֹעִ֖ים אוֹתָ֑/ם וְ/הִצַּלְתִּ֤י צֹאנִ/י֙ מִ/פִּי/הֶ֔ם וְ/לֹֽא תִהְיֶ֥יןָ לָ/הֶ֖ם לְ/אָכְלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/010.yaml
  text: 'Thus says the Lord GOD: Behold[a], I am against the shepherds, and I will require my flock from their hand, and I will stop them from shepherding the flock. The shepherds will no longer shepherd them, and I will rescue my flock from their mouth[c][b], and it will no longer be food for them.'
translation:
  language: zh_hans
  text: 主耶和华如此说：看哪，我要与这些牧人作对！我要从他们手中讨回我的羊群[a]，不再让他们牧养羊群；这些牧人也不再牧养它们。我要从他们口中救出我的羊群[b]，羊群不再作他们的食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从他们手中讨回”也可译作“为我的羊群向他们追责”；原文兼有追讨、问责和取回的意味。
    reason: 保留 דָּרַשׁ 与 מִיָּד 这一表达中司法问责和重新收回的语义张力。
  - marker: b
    text: 原文直译“从他们口中”，把本应保护羊群的牧人描绘成吞吃羊群的人。
    reason: 说明刻意保留的强烈比喻，避免读者误以为是普通的空间表达。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合称号的两个要素；“耶和华”是现代中文圣经语域中对四字神名的通行表达。
- source_word: הִנְנִי אֶל־הָרֹעִים
  choice: 看哪，我要与这些牧人作对
  rationale: “看哪”保留先知宣告的郑重语气；“与……作对”准确表达这里 אֶל 所表示的敌对立场。
- source_word: הָרֹעִים
  choice: 牧人
  rationale: 保留贯穿本章的牧羊隐喻，不直接解释为领袖或官长。
- source_word: וְדָרַשְׁתִּי אֶת־צֹאנִי מִיָּדָם
  choice: 我要从他们手中讨回我的羊群
  rationale: “讨回”兼顾 דָּרַשׁ 的追讨、问责与取回含义，“从他们手中”保留原文意象。
- source_word: וְהִשְׁבַּתִּים מֵרְעוֹת צֹאן
  choice: 不再让他们牧养羊群
  rationale: 自然表达使役性的“使他们停止”，并保留 רעה 的牧养主题。
- source_word: וְלֹא יִרְעוּ עוֹד הָרֹעִים אוֹתָם
  choice: 这些牧人也不再牧养它们
  rationale: 以“牧人／牧养”保留希伯来文同根词的重复和强调。
- source_word: וְהִצַּלְתִּי צֹאנִי מִפִּיהֶם
  choice: 我要从他们口中救出我的羊群
  rationale: 直译“从他们口中”，保留牧人反成吞吃者的尖锐意象。
- source_word: וְלֹא תִהְיֶיןָ לָהֶם לְאָכְלָה
  choice: 羊群不再作他们的食物
  rationale: “食物”直接对应 לְאָכְלָה，并与前句“口中”的吞吃意象相连；以集合名词“羊群”承接原文。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”兼顾原文复合称号与现代中文圣经读者的辨识度；不把神名省并为单一称谓。
- issue: 牧人意象是否直接解释为以色列领袖
  choice: 保留“牧人”
  alternative: 译作“领袖”或“官长”
  rationale: 本节本身持续运用牧养、羊群、口和食物等连贯意象；直接改译为领袖会削弱原文的比喻张力。
- issue: דָּרַשׁ 加 מִיָּד 的问责与取回双重含义
  choice: 从他们手中讨回我的羊群
  alternative: 为我的羊群向他们追责
  rationale: “讨回”在中文中可同时传达追索与重新取得，脚注说明其问责意味，避免只保留其中一面。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“如此说”“看哪”保留先知宣告的经文语域；其余句法力求清楚顺畅。保留“牧人／牧养／羊群／口／食物”的连贯意象，并避免将牧人直接释义为政治或宗教领袖。
