  text: הַ/מְעַ֣ט מִ/כֶּ֗ם הַ/מִּרְעֶ֤ה הַ/טּוֹב֙ תִּרְע֔וּ וְ/יֶ֨תֶר֙ מִרְעֵי/כֶ֔ם תִּרְמְס֖וּ בְּ/רַגְלֵי/כֶ֑ם וּ/מִשְׁקַע מַ֣יִם תִּשְׁתּ֔וּ וְ/אֵת֙ הַ/נּ֣וֹתָרִ֔ים בְּ/רַגְלֵי/כֶ֖ם תִּרְפֹּשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/018.yaml
  text: Is it too little for you to graze on the good pasture[a], that you must trample the rest of your pastures with your feet, and to drink clear water[b], that you must muddy what remains with your feet?
translation:
  language: zh_hans
  text: 你们在肥美的草场上吃草，还嫌不够吗？竟还要用脚践踏其余的草场；你们喝清澈的水，还嫌不够吗？竟还要用脚把剩下的水搅浑？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  choice: 还嫌不够吗
  rationale: 以自然的现代汉语表达反问和责备语气，表明已有的丰足本应足够。
- source_word: הַמִּרְעֶה הַטּוֹב
  choice: 肥美的草场
  rationale: מִרְעֶה指放牧、吃草之地；“肥美的草场”保留牧羊意象，也自然表达טוֹב在此处的优良、丰美之意。
- source_word: תִּרְעוּ
  choice: 吃草
  rationale: 此处以羊群为喻，“吃草”比抽象的“牧放”更准确地表现羊在草场取食。
- source_word: וְיֶתֶר מִרְעֵיכֶם
  choice: 其余的草场
  rationale: 保留יֶתֶר“其余、剩余”以及מִרְעֵיכֶם的复数含义。
- source_word: תִּרְמְסוּ בְּרַגְלֵיכֶם
  choice: 用脚践踏
  rationale: 明确保留原文所重复强调的工具“用脚”，并以“践踏”传达רמס。
- source_word: וּמִשְׁקַע מַיִם
  choice: 澄清的水
  rationale: מִשְׁקַע与沉降、静置有关，语境所指是泥沙沉淀后清澈的水；“澄清的水”兼顾词源意象与实际效果。
- source_word: הַנּוֹתָרִים
  choice: 剩下的水
  rationale: 原文为实词化的复数形式，依前文“水”补出中心语，使汉语指代清楚。
- source_word: תִּרְפֹּשׂוּן
  choice: 搅浑
  rationale: 该动词描述用脚扰动水而使其浑浊；“搅浑”同时表达动作及结果，形象而准确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的责问句式。将希伯来语较长的并列反问分成两个平行分句，并在第二分句补出“还嫌不够吗”，以清楚呈现两个对应的罪状，同时不改变责备内容。保留“用脚”的两次重复，以及草场的复数意义。
