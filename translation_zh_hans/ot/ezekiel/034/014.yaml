  text: בְּ/מִרְעֶה טּוֹב֙ אֶרְעֶ֣ה אֹתָ֔/ם וּ/בְ/הָרֵ֥י מְרֽוֹם יִשְׂרָאֵ֖ל יִהְיֶ֣ה נְוֵ/הֶ֑ם שָׁ֤ם תִּרְבַּ֨צְנָה֙ בְּ/נָ֣וֶה טּ֔וֹב וּ/מִרְעֶ֥ה שָׁמֵ֛ן תִּרְעֶ֖ינָה אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/014.yaml
  text: In good pasture I will pasture them[a], and on the high mountains of Israel their grazing place will be. There they will lie down in a good grazing place[b], and they will feed in rich pasture on the mountains of Israel.
translation:
  language: zh_hans
  text: 我要在美好的草场牧养它们；它们的草场必在以色列高耸的群山上[a]。它们必在那里，在美好的草场躺卧；它们必在以色列的群山上，在肥美的草场[b]吃草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “草场”也可译作“住处”。本节两处所用的这个希伯来词，既可指居住、安歇之处，也可指牧场。
    reason: lexical_alternative
  - marker: b
    text: “肥美”所译的希伯来词，字面意思是“肥的”，在这里形容草场丰饶茂盛。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְעֶה
  choice: 草场
  rationale: 指供羊群吃草的牧地；“草场”在现代汉语中自然，并保留本节具体的牧养图景。
- source_word: אֶרְעֶה
  choice: 我要……牧养
  rationale: 保留牧人的行动及其与“草场”的词义联系，不将比喻抽象化为一般性的“照料”。
- source_word: הָרֵי מְרוֹם יִשְׂרָאֵל
  choice: 以色列高耸的群山
  rationale: מְרוֹם突出高度；“高耸的群山”既传达地势，也符合现代汉语表达。
- source_word: נְוֵהֶם / בְּנָוֶה טּוֹב
  choice: 它们的草场 / 美好的草场
  rationale: נָוֶה可指住处，也可指牧场或羊群安歇吃草之地；上下文持续使用牧羊意象，因此正文译作“草场”，并用脚注保留“住处”的可能。
- source_word: תִּרְבַּצְנָה
  choice: 躺卧
  rationale: 具体描写牲畜安然卧下，较抽象的“休息”更能保存原文画面。
- source_word: מִרְעֶה שָׁמֵן
  choice: 肥美的草场
  rationale: שָׁמֵן字面与“肥”有关，在此表示丰饶、茂盛；“肥美”兼顾原文形象与现代汉语习惯。
- source_word: תִּרְעֶינָה
  choice: 吃草
  rationale: 羊群是主语，动词表示放牧中的取食；“吃草”清楚自然，并避免与上文牧人“牧养”的动作混淆。
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: 在以色列的群山上
  rationale: אֶל通常有“向、到”的意义，但此处描述吃草的地点，按语境译为处所性的“在……上”。
theological_decisions:
- issue: 上帝照料羊群的牧养意象
  choice: 全节保留草场、牧养、躺卧和吃草等具体意象
  alternative: 解释性地译为“照顾、供应、安然休息”
  rationale: 本节属于持续展开的牧人比喻；保留具体画面更贴近希伯来文，也避免把比喻预先解释为某一种神学概念。
- issue: נָוֶה兼有“草场”与“住处”的语义
  choice: 正文依牧养语境译作“草场”，脚注注明“住处”
  alternative: 正文译作“住处”
  rationale: 两义均有词汇依据；牧养语境支持“草场”，但“住处”这一真实歧义不应被隐去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现原文平行结构；重复“草场”与“群山”，以保留希伯来诗性散文的回环和牧养主题。
