source:
  edition: WLC
  text: כְּ/בַקָּרַת֩ רֹעֶ֨ה עֶדְר֜/וֹ בְּ/יוֹם הֱיוֹת֤/וֹ בְ/תוֹךְ צֹאנ/וֹ֙ נִפְרָשׁ֔וֹת כֵּ֖ן אֲבַקֵּ֣ר אֶת צֹאנִ֑/י וְ/הִצַּלְתִּ֣י אֶתְ/הֶ֗ם מִ/כָּל הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נָפֹ֣צוּ שָׁ֔ם בְּ/י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/012.yaml
  text: As a shepherd seeks out his flock on the day he is among his sheep when they have been scattered[a], so I will seek out my sheep[b], and I will rescue them from all the places where they were scattered on a day of clouds and thick darkness.
translation:
  language: zh_hans
  text: 牧人怎样在自己四散的羊群中间察看羊群，我也要照样察看我的羊[a]；我要把它们从它们在密云幽暗之日四散到的所有地方救出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “察看”也可译作“寻找”或“照料”；原文此词含仔细查看、关顾并寻回的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבַקָּרַת ... כֵּן אֲבַקֵּר
  choice: 怎样……一一察看，我也要照样察看
  rationale: 前后两处均来自 בקר，兼有仔细查看、照料和寻找之意。保留同根词的呼应，并以“一一”体现牧人对四散羊群的细心搜寻。
- source_word: רֹעֶה עֶדְרוֹ
  choice: 牧人……自己的羊群
  rationale: 按牧羊语境自然表达；עדר 可泛指畜群，但本节随后使用 צאן，因此译为“羊群”。
- source_word: בְּיוֹם הֱיוֹתוֹ בְתוֹךְ צֹאנוֹ נִפְרָשׁוֹת
  choice: 在自己的羊四散时……来到羊群中间
  rationale: 以自然汉语呈现牧人身处四散羊群中的时间和场景，同时不把分词与句中某一成分作过度限定。
- source_word: צֹאנִי
  choice: 我的羊
  rationale: 保留上帝亲自认领、寻找羊群的牧者意象。
- source_word: וְהִצַּלְתִּי אֶתְהֶם
  choice: 我要把它们……救出来
  rationale: Hiphil 形式表达从危险或困境中解救；“救出来”兼顾动作感和现代汉语可读性。
- source_word: מִכָּל הַמְּקוֹמוֹת אֲשֶׁר נָפֹצוּ שָׁם
  choice: 从各处救出来
  rationale: “各处”已自然涵盖 כָּל；前句补明“四散到各处”，使关系从句在汉语中清楚而不拖沓。
- source_word: בְּיוֹם עָנָן וַעֲרָפֶל
  choice: 在密云幽暗的日子
  rationale: עָנָן 指云，עֲרָפֶל 指浓重的黑暗或幽暗；此译保留灾难性场景的沉重感，并将时间短语明确连接到羊群四散。
theological_decisions:
- issue: 上帝作为牧人的意象
  choice: 直接保留上帝亲自察看并救回“我的羊”的表述
  alternative: 在译文中加入弥赛亚或后续经文的基督论解释
  rationale: 本节自身描绘耶和华施行牧养和拯救；译文保留这一意象，不把后来的正典关联预先写入正文。
- issue: “密云幽暗之日”的指向
  choice: 保留为羊群四散的灾难性日子，不具体认定某一历史或末世事件
  alternative: 明确解释为审判日、耶路撒冷陷落之日或末世事件
  rationale: 原文具有审判和灾难色彩，却未在本节中把该日限定为某一单一事件，故不在翻译中消除其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“一一察看”使牧人寻找四散羊群的画面自然清楚，同时脚注保留 בקר 的词义幅度。末句调整为两个汉语分句，以清楚表明“密云幽暗的日子”修饰羊群四散的时间。
