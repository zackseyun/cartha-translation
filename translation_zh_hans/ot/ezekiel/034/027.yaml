id: EZK.34.27
reference: Ezekiel 34:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָתַן֩ עֵ֨ץ הַ/שָּׂדֶ֜ה אֶת פִּרְי֗/וֹ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן יְבוּלָ֔/הּ וְ/הָי֥וּ עַל אַדְמָתָ֖/ם לָ/בֶ֑טַח וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה בְּ/שִׁבְרִ/י֙ אֶת מֹט֣וֹת עֻלָּ֔/ם וְ/הִ֨צַּלְתִּ֔י/ם מִ/יַּ֖ד הָ/עֹבְדִ֥ים בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/027.yaml
  text: The tree of the field will give its fruit[a], and the land will give its produce, and they will be secure on their land. Then they will know that I am Yahweh, when I break the bars of their yoke and deliver them from the hand of those who enslaved them.
translation:
  language: zh_hans
  text: 田野的树木必结出果实，土地必出产作物；他们必在自己的土地上安然居住。当我折断他们轭上的横木，救他们脱离奴役他们之人的手[a]时，他们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奴役他们之人”也可译作“役使他们的人”或“使他们服役的人”。希伯来文分词可作较为字面的翻译；但折断轭的上下文支持“奴役”这一较强的表达。
    reason: 保留该分词在此语境中的较弱译法，同时避免“利用”这一不够准确、语义过宽的替代说法。
lexical_decisions:
- source_word: וְנָתַן עֵץ הַשָּׂדֶה אֶת פִּרְיוֹ
  choice: 田野的树木必结出果实
  rationale: 希伯来文以单数“田野的树”作集合性表达；现代汉语用“树木”更自然，并保留泛指田野树木的含义。נתן直译为“给予”，在树木与果实的搭配中译作“结出”符合现代汉语习惯。
- source_word: וְהָאָרֶץ תִּתֵּן יְבוּלָהּ
  choice: 大地必出产作物
  rationale: יְבוּל指土地的出产或收成；“出产作物”清楚呈现农业语境，也保留土地作为主语的表达。
- source_word: וְהָיוּ עַל אַדְמָתָם לָבֶטַח
  choice: 他们必在自己的土地上安然居住
  rationale: 原文直译为“他们必在自己的土地上安稳”；汉语补出“居住”使地点与状态的关系自然清楚，但不改变其安居本土的意思。
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: 那时他们就知道我是雅威
  rationale: “那时……就”自然表达本句与随后בְּ加不定式结构之间的时间及结果关系；יהוה按其专名译为“雅威”。
- source_word: בְּשִׁבְרִי אֶת מֹטוֹת עֻלָּם
  choice: 我折断他们所负的轭条
  rationale: בְּ加不定式在此表示“当……时”。מֹטוֹת是轭的杆或条，“轭条”保留具体意象；“所负”使汉语明确这是加在他们身上的压迫之轭。
- source_word: וְהִצַּלְתִּים מִיַּד
  choice: 救他们脱离……之人的手
  rationale: 保留希伯来文“从某人的手中搭救”的权势意象；“脱离……之人的手”在现代汉语中仍清楚可懂。
- source_word: הָעֹבְדִים בָּהֶם
  choice: 奴役他们之人
  rationale: עבד的分词与介词ב连用，可指役使或利用他们的人；上下文有折断轭条和施行拯救的意象，因此“奴役”恰当地表达其压迫强度，同时以脚注保留较字面的可能译法。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名יהוה；译作“雅威”保留其作为以色列之神专名的性质，而不以称号“主”替代。
- issue: הָעֹבְדִים בָּהֶם所表达的压迫程度
  choice: 奴役他们之人
  alternative: 役使他们的人；利用他们的人
  rationale: “轭条”被折断的直接语境表明这里不是一般性的工作或服侍，而是受支配和压迫；不过该分词本身具有较宽的语义范围，因此在脚注中保留其他可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必”维持先知性应许的语气；分号区分土地蒙福与百姓安居，后一句按汉语信息结构先述雅威的拯救行动，再落在“知道我是雅威”的认信公式上。脚注标记置于其实际所解释的“奴役他们之人的手”之后，而非置于“果实”之后。
