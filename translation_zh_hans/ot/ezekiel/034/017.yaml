  text: וְ/אַתֵּ֣נָה צֹאנִ֔/י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י שֹׁפֵט֙ בֵּֽין שֶׂ֣ה לָ/שֶׂ֔ה לָ/אֵילִ֖ים וְ/לָ/עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/017.yaml
  text: 'And as for you[a], my flock, thus says the Lord GOD: Behold, I am judging between sheep and sheep, between the rams and the male goats.'
translation:
  language: zh_hans
  text: “至于你们，我的羊群，主耶和华如此说：看哪，我正在羊与羊之间[a]、公绵羊与公山羊之间施行审判。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在一只羊与一只羊之间”，意思是在羊群中逐一加以区分。
    reason: 说明希伯来语单数名词构成的分配式表达，避免读者误以为这里是在区分不同物种。
lexical_decisions:
- source_word: וְאַתֵּנָה
  choice: 至于你们
  rationale: 独立代词置于句首，标示话题转移并直接转向羊群；“至于你们”自然保留这种强调。
- source_word: צֹאנִי
  choice: 我的羊群
  rationale: צֹאן在此是集合名词，牧羊语境中译作“羊群”比逐只称作“羊”更自然。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重和简洁，同时符合现代中文圣经语体。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现אֲדֹנָי的主权称号和יהוה的专名，并采用普通中文读者熟悉的组合形式。
- source_word: הִנְנִי
  choice: 看哪，我
  rationale: 表达说话者郑重、自我呈现的强调语气；“看哪”保留先知宣告的力度。
- source_word: שֹׁפֵט
  choice: 正在……施行审判
  rationale: 分词可表达正在进行或已迫近的行动；该译法保留其动态和临近感，而不单纯处理为一般将来时。
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: 在羊与羊之间
  rationale: 贴近原文单数名词的分配式表达，指在同一羊群中的个体之间作出区分；不把שֶׂה过度限定为母羊。
- source_word: לָאֵילִים
  choice: 在公绵羊……之间
  rationale: אֵילִים本义为公绵羊；保留具体动物形象，也容许其力量方面的隐喻余韵。
- source_word: וְלָעַתּוּדִים
  choice: 和公山羊
  rationale: עַתּוּדִים特指雄性山羊；“公山羊”是清楚自然的现代中文。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在简体中文圣经语境中辨识度高，并避免将两个词合并成重复的“主主”；同时承认יהוה是神的专名，而非普通称号。
- issue: 审判对象之间的关系
  choice: 保留“羊与羊之间”，随后并列“公绵羊和公山羊之间”
  alternative: 解释为在弱羊与强羊之间审判
  rationale: 原文保持动物群体内部的区分，并未明说强弱或善恶；译文不先行释义，以保存后文才逐渐展开的伦理与神学张力。
- issue: שֹׁפֵט的时态体貌
  choice: 正在……施行审判
  alternative: 将要……施行审判
  rationale: 希伯来语分词可兼有当前进行和迫近行动的意味；选用“正在”突出神已临到并采取行动的宣告，而不把它压缩为纯粹未来。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“如此说”“看哪”保留原文公式化与郑重的语气；其余句法尽量顺应现代汉语。
