  text: חַי אָ֜נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם לֹ֣א יַ֣עַן הֱיֽוֹת צֹאנִ֣/י לָ/בַ֡ז וַ/תִּֽהְיֶינָה֩ צֹאנִ֨/י לְ/אָכְלָ֜ה לְ/כָל חַיַּ֤ת הַ/שָּׂדֶה֙ מֵ/אֵ֣ין רֹעֶ֔ה וְ/לֹֽא דָרְשׁ֥וּ רֹעַ֖/י אֶת צֹאנִ֑/י וַ/יִּרְע֤וּ הָֽ/רֹעִים֙ אוֹתָ֔/ם וְ/אֶת צֹאנִ֖/י לֹ֥א רָעֽוּ־׀־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/008.yaml
  text: As I live[a], declares the Lord GOD, surely because my flock has become plunder and my flock has become food for every wild beast of the field, since there was no shepherd, and my shepherds did not seek my flock[b], but the shepherds fed themselves and did not feed my flock—
translation:
  language: zh_hans
  text: “我凭我的永生起誓[a]，”主耶和华宣告说，“因我的羊群成了掠物，成了田野一切野兽的食物，因为没有牧人；我的牧人没有寻找我的羊群，牧人却喂养自己[b]，不喂养我的羊群——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我活着”；这是神庄严自誓的说法。
    reason: idiom_explanation
  - marker: b
    text: 或译“牧人牧养自己”。希伯来文这一说法指牧人顾念自己的利益，而不顾羊群。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是先知话语中庄严的神圣自誓公式；中文补出“起誓”，自然明确地传达其语用力量。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告说
  rationale: נְאֻם译为“宣告说”，符合先知体；复合神名直译为“主耶和华”，既区分称号与专名，也避免“主主”的生硬表达。
- source_word: אִם לֹא
  choice: 竟
  rationale: 在自誓公式之后，此语不是普通条件句，而是加强断言并引出审判理由；结合全句结构，用“竟”突出牧人失职所造成的事实，誓言的确定性则由“指着我的永生起誓”承载。
- source_word: יַעַן הֱיוֹת
  choice: 因……成了
  rationale: יַעַן引出审判的缘由，הֱיוֹת表达成为某种处境；中文依各分句的自然次序呈现因果关系。
- source_word: צֹאנִי
  choice: 我的羊群
  rationale: צֹאן是小型牲畜的集合名词；在持续的牧养比喻中，“羊群”自然且能保持反复用语。
- source_word: לָבַז
  choice: 掠物
  rationale: 该词指被强行夺取之物；“掠物”保留被掳掠的意象，也与下一句“食物”的吞吃意象有所区别。
- source_word: לְאָכְלָה
  choice: 食物
  rationale: 直陈羊群成为野兽吞吃之物，简洁并保留原文强烈意象。
- source_word: לְכָל חַיַּת הַשָּׂדֶה
  choice: 田野一切野兽
  rationale: 这是指野外动物的惯用语；“野兽”传达其危险性，“田野”保留原文空间意象。
- source_word: מֵאֵין רֹעֶה
  choice: 因无人牧养
  rationale: 字面为“由于没有牧人”；上下文并非绝对无人担任牧人，而是无人实际尽牧养之责，故译为“无人牧养”更能呈现控诉而不消除比喻。
- source_word: וְלֹא דָרְשׁוּ רֹעַי אֶת צֹאנִי
  choice: 我的牧人不寻找我的羊群
  rationale: דרשׁ保留为“寻找”，避免直接扩展成较宽泛的“照顾”；“我的牧人”保留他们对神所负的责任。
- source_word: וַיִּרְעוּ הָרֹעִים אוֹתָם
  choice: 只顾喂养自己
  rationale: רעה与后句构成刻意反衬，意为牧人以自身利益为念；“只顾”自然表达这种自利对比。
- source_word: וְאֶת צֹאנִי לֹא רָעוּ
  choice: 却不喂养我的羊群
  rationale: 重复“喂养”以保留同一希伯来词根的对照：牧人喂养自己，却不喂养羊群。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威／主上帝
  rationale: 采用现代中文读者熟悉且庄重的“耶和华”表示四字神名，并以“主”对应 אֲדֹנָי；不以普通称号完全取代专名。
- issue: “没有牧人”与随后“我的牧人”的表面张力
  choice: 因无人牧养
  alternative: 因为没有牧人
  rationale: 原文先说“没有牧人”，继而控诉实际存在的牧人不尽职责。译文以“无人牧养”保留其修辞意义：不是没有名义上的领袖，而是没有真正履行牧职者。
- issue: 牧人“牧养他们／自己”的指向
  choice: 只顾喂养自己
  alternative: 牧人牧养他们
  rationale: 宾语形式表面为第三人称复数，可指牧人自身；上下文与后句“却不喂养我的羊群”的对照强烈支持反身意义，但脚注保留形式上的可能性。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语，保留先知审判宣告的长句推进与末尾未完的破折号，以衔接下一节。“掠物／食物”“喂养自己／喂养羊群”形成原文的平行与反衬。注意：脚注[b]应在正文“只顾喂养自己”之后出现。
