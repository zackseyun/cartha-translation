id: EZK.34.3
reference: Ezekiel 34:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶת הַ/חֵ֤לֶב תֹּאכֵ֨לוּ֙ וְ/אֶת הַ/צֶּ֣מֶר תִּלְבָּ֔שׁוּ הַ/בְּרִיאָ֖ה תִּזְבָּ֑חוּ הַ/צֹּ֖אן לֹ֥א תִרְעֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/003.yaml
  text: You eat the fat[a], you clothe yourselves with the wool, you slaughter the fattened sheep[b], but you do not shepherd the flock.
translation:
  language: zh_hans
  text: 你们吃肥油[a]，拿羊毛给自己做衣服，宰杀肥壮的羊[b]，却不牧养羊群。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奶”。有些译本依据释义传统或古译本译为“奶”，但这里的希伯来词通常意为“脂肪、肥油”。
    reason: lexical_alternative
  - marker: b
    text: 或译“肥壮的那只”或“上好的牲畜”；希伯来语可能指羊群中喂养得肥壮的牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵלֶב
  choice: 肥油
  rationale: חֵלֶב通常指脂肪或肥油。译作“肥油”保留希伯来文本具体而尖锐的剥削意象；“奶”可能来自释义传统或古译本影响，列入脚注作为异译。
- source_word: הַצֶּמֶר
  choice: 羊毛
  rationale: צֶמֶר指羊毛；现代汉语中“羊毛”自然清楚，也符合牧人从羊群获取物质利益的图像。
- source_word: תִּלְבָּשׁוּ
  choice: 拿……给自己做衣服
  rationale: לבש表示穿上或以某物为衣。此译自然表达反身含义，并突出这些牧人利用羊毛供自己享用。
- source_word: הַבְּרִיאָה
  choice: 肥壮的羊
  rationale: בריא意为肥壮、喂养良好或健壮；阴性单数在此作名词使用，语境中指羊群里肥壮的牲畜。
- source_word: תִּזְבָּחוּ
  choice: 宰杀
  rationale: זבח可指献祭或宰杀；本节谴责牧人榨取羊群，并非明确描述礼仪献祭，因此“宰杀”更合语境。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: צֹאן统称羊、山羊等小型牲畜；在牧人隐喻中译作“羊群”最自然，也维持全章意象。
- source_word: תִרְעוּ
  choice: 牧养
  rationale: רעה涵盖放牧、照料和牧养。译作“牧养”比单译“喂养”更完整地表达牧人的整体职责。
theological_decisions:
- issue: 牧人语言对以色列领袖的隐喻作用
  choice: 保留“牧养羊群”的明确牧人意象
  alternative: “喂养羊群”或“照料羊群”
  rationale: 全章的谴责以牧人和羊群的隐喻为中心。“牧养”既保持文学与神学连贯性，也不额外引入后来的宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前三个分句以并列动词强化领袖不断索取的控诉，末句用“却”显出他们享用羊群与拒绝履责之间的强烈反差。
