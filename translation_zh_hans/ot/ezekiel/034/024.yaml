base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/024.yaml
  text: And I[a], Yahweh, will be their God, and my servant David will be prince among them. I, Yahweh, have spoken.
translation:
  language: zh_hans
  text: 我耶和华必作他们的神；我的仆人大卫[a]必在他们中间作首领。我耶和华已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的仆人大卫”可能以预表或预言的方式指将要来的大卫家统治者，即弥赛亚；希伯来文本本身写的是“大卫”。
    reason: 保留原文称呼，同时说明其公认的预表或预言性理解，而不在正文中断定其所指。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之神名字的功能，而不以“主”这一称号替代。
- source_word: אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: 必作他们的神
  rationale: 这是立约关系的惯用表达；“必作他们的神”既保留将来指向，也符合自然、庄重的现代汉语。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 在大卫王权和盟约语境中，此词是忠心事奉上帝者的尊称；“仆人”比“奴隶”更符合本节语域。
- source_word: דָוִד
  choice: 大卫
  rationale: 按现代汉语通行的圣经人名译法音译，并保留希伯来文本的直接称呼。
- source_word: נָשִׂיא
  choice: 领袖
  rationale: 该词可指首领、领袖或王侯；这里不用“王”，以保留以西结书在用词上的区别。“领袖”是自然且不过度限定政治身份的现代汉语。
- source_word: בְתוֹכָם
  choice: 在他们中间
  rationale: 直接表达群体内部的位置与同在，贴近希伯来语措辞。
- source_word: דִּבַּרְתִּי
  choice: 已经说了
  rationale: 希伯来语完成式用于庄严确认神谕已经宣告；此译简洁自然，并保留宣告的确定性。
theological_decisions:
- issue: “我的仆人大卫”的身份
  choice: 正文保留“大卫”，不作解释性替换
  alternative: 将其明确译作“大卫后裔的君王”或“弥赛亚”
  rationale: 希伯来文本本身写的是“大卫”。此称呼可能以预表或预言方式指向将来的大卫家统治者，即弥赛亚，但译文不应在正文中消除这一解释空间。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。分号呈现两个并列的立约应许，末句保留先知书中神圣宣告的郑重语气。脚注标记紧接与其对应的“大卫作领袖”陈述。
