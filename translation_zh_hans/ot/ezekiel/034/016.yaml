  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶת הָ/אֹבֶ֤דֶת אֲבַקֵּשׁ֙ וְ/אֶת הַ/נִּדַּ֣חַת אָשִׁ֔יב וְ/לַ/נִּשְׁבֶּ֣רֶת אֶחֱבֹ֔שׁ וְ/אֶת הַ/חוֹלָ֖ה אֲחַזֵּ֑ק וְ/אֶת הַ/שְּׁמֵנָ֧ה וְ/אֶת הַ/חֲזָקָ֛ה אַשְׁמִ֖יד אֶרְעֶ֥/נָּה בְ/מִשְׁפָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/016.yaml
  text: I will seek the lost[a], and I will bring back the strayed, and I will bind up the injured, and I will strengthen the sick; but the fat and the strong I will destroy. I will shepherd them with justice.
translation:
  language: zh_hans
  text: 迷失的，我必寻找；被赶散的，我必领回；受伤的，我必包扎；患病的，我必使它们强壮。肥壮的和强健的，我却要除灭。我必按公正牧养它们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “牧养”也可译作“喂养”或“放牧”；原文动词兼有这些含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹבֶדֶת
  choice: 迷失的
  rationale: 该阴性单数分词在羊群比喻中作集合用语；“迷失的”自然表达失落之羊，并与“寻找”搭配。
- source_word: אֲבַקֵּשׁ
  choice: 我必寻找
  rationale: בקש意为寻找、寻求；此处指牧人寻找迷失的羊。
- source_word: הַנִּדַּחַת
  choice: 被赶散的
  rationale: נדח可指被驱赶、被赶散；采用被动表达，保留羊并非只是自行走失、也可能遭驱散的含义。
- source_word: אָשִׁיב
  choice: 我必领回
  rationale: שוב的使役式表示使之返回；“领回”贴合牧人带羊归群的图景。
- source_word: לַנִּשְׁבֶּרֶת
  choice: 受伤的
  rationale: 字面为“破损的、折断的”；在羊群语境中，“受伤的”是自然且不过度限定伤势的表达。
- source_word: אֶחֱבֹשׁ
  choice: 我必包扎
  rationale: חבש在医治语境中指包扎伤处；现代汉语“包扎”准确清楚。
- source_word: הַחוֹלָה
  choice: 患病的
  rationale: חלה表示患病、软弱；“患病的”保留身体病弱的直接含义。
- source_word: אֲחַזֵּק
  choice: 我必使它强壮
  rationale: חזק的加强式表示使之强壮、加力量；译文明确保留使役意义。
- source_word: הַשְּׁמֵנָה
  choice: 肥壮的
  rationale: 字面为“肥的”；“肥壮的”保留羊群形象及其在本章中所带的优越、欺压意味。
- source_word: הַחֲזָקָה
  choice: 强健的
  rationale: 该形容词意为强壮；“强健的”与“肥壮的”形成自然并列，同时与病弱者构成反差。
- source_word: אַשְׁמִיד
  choice: 我却要除灭
  rationale: שמד的使役式有毁灭、除灭之意；“除灭”保留原词强烈的审判力度，“却”显明与前述医治行动的转折。
- source_word: אֶרְעֶנָּה
  choice: 我必牧养它们
  rationale: רעה可指喂养、放牧或牧养；全章持续使用牧人意象，“牧养”能够涵盖供应、带领和治理。
- source_word: בְמִשְׁפָּט
  choice: 按公正
  rationale: משפט可指公正、正义或审判；“按公正”保留牧养治理与施行审判两方面的张力。
theological_decisions:
- issue: 末句如何同时表达牧养照顾和审判
  choice: 我必按公正牧养它们
  alternative: 我必按审判喂养它们；我必以公义放牧它们
  rationale: 译作“牧养”延续全章的牧人主题；“按公正”既不把该句缩减为单纯喂食，也不把它限定为惩罚，从而保留上帝扶助弱者并审判强横者的张力。
- issue: 对肥壮和强健者的行动力度
  choice: 我却要除灭
  alternative: 我必看守；我必保护（依据不同文本传统或元音理解）
  rationale: WLC马所拉文本为אַשְׁמִיד，明确表示“我要除灭”。本稿依所给希伯来文本翻译，不以其他文本传统替换正文读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。四个救助动作保持整齐的排比结构；以“却”突出审判性转折。代词采用“它们”，维持羊群比喻。脚注标记置于相关末句之后。
