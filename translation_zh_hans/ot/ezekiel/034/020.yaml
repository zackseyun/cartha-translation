id: EZK.34.20
reference: Ezekiel 34:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה אֲלֵי/הֶ֑ם הִנְ/נִי אָ֕נִי וְ/שָֽׁפַטְתִּי֙ בֵּֽין שֶׂ֣ה בִרְיָ֔ה וּ/בֵ֥ין שֶׂ֖ה רָזָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/020.yaml
  text: 'Therefore thus says the Lord GOD to them: Behold[a], I myself will judge between the fat sheep and the lean sheep.'
translation:
  language: zh_hans
  text: 因此，主耶和华对他们如此说：“看哪，我亲自要在肥羊和瘦羊[a]之间施行审判。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在一只肥羊和一只瘦羊之间”；这里的单数名词很可能分别代表羊群中的两类羊。
    reason: 说明原文的代表性单数及正文采用数目中性表达的依据。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的指控并引出其结果，保留先知话语中的推论关系。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留希伯来先知传信公式的庄重语体，同时符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的“主”和四字神名 יְהוִה 的传统中文译名“耶和华”，避免将两个成分合并。
- source_word: אֲלֵיהֶם
  choice: 对他们
  rationale: 此处 אֶל 指神说话的对象，而非预先将其解释为审判所针对的对象。
- source_word: הִנְנִי אָנִי
  choice: 看哪，我必亲自
  rationale: “看哪”体现 הִנְנִי 的提示和强调作用，“亲自”传达重复第一人称 אָנִי 所加强的主语语气；与后面的将来行动合成自然汉语。
- source_word: וְשָׁפַטְתִּי
  choice: 我必……审判
  rationale: 在区分羊群中两类成员的语境里，“审判”保留 שׁפט 的裁断含义；“必”表达先知性宣告中确定将要发生的行动。
- source_word: בֵּין ... וּבֵין
  choice: 审判……和……
  rationale: 汉语中“审判甲和乙”可自然表达在两者之间作出裁断，无须机械重复“在……之间”。
- source_word: שֶׂה
  choice: 羊
  rationale: 原文虽用单数名词，却以代表性单数指羊群中的类别；汉语“羊”不强制标明单复数，能保留这一点。
- source_word: בִרְיָה
  choice: 肥
  rationale: 表示肥壮，与下文“瘦”形成直接对照，也呼应牧羊隐喻。
- source_word: רָזָה
  choice: 瘦
  rationale: 表示瘦弱，与“肥”构成清楚、自然的反义对照。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”保留复合称谓的两个要素，也是普通中文读者熟悉的庄重圣经用语；不以“上帝”取代原文实际出现的专名，也不据某一宗派立场扩展其含义。
- issue: 审判对象的类别性单数
  choice: 肥羊和瘦羊
  alternative: 一只肥羊和一只瘦羊；肥壮的羊群和瘦弱的羊群
  rationale: 原文的单数 שֶׂה 很可能是代表类别的单数。正文采用数目中性的汉语“羊”，既不误导为仅有两只个体，也不将原文明确改写成复数群体。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”保留原文提示语的郑重强调；“我必亲自”突出神本人施行审判。脚注标记已置于相关短语之后。
