  text: וַ/תְּפוּצֶ֖ינָה מִ/בְּלִ֣י רֹעֶ֑ה וַ/תִּהְיֶ֧ינָה לְ/אָכְלָ֛ה לְ/כָל חַיַּ֥ת הַ/שָּׂדֶ֖ה וַ/תְּפוּצֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/005.yaml
  text: So they were scattered for lack of a shepherd[a], and they became food for every beast of the field, and they were scattered.
translation:
  language: zh_hans
  text: 它们因没有牧人而四散，成了田野一切野兽的食物；它们又四散了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּפוּצֶינָה
  choice: 它们……四散
  rationale: פוץ在此表示羊群散开、流离的状态。“四散”是现代汉语中描写群体向各处散开的自然表达；末尾的重复照原文保留。
- source_word: מִבְּלִי רֹעֶה
  choice: 因没有牧人
  rationale: מִבְּלִי表达缺少或不存在，并在语境中带有原因意味；“因没有牧人”既传达这一因果关系，也保留“牧人”的核心比喻。
- source_word: וַתִּהְיֶינָה לְאָכְלָה
  choice: 成了……的食物
  rationale: היה加表语在此描述进入一种结果状态，אָכְלָה指供吞吃之物；“成了……的食物”准确而自然。
- source_word: לְכָל חַיַּת הַשָּׂדֶה
  choice: 田野一切走兽的
  rationale: חַיַּת הַשָּׂדֶה指野外的动物；“田野走兽”保留先知文学的意象，“一切”对应כָל的总括意义。
theological_decisions:
- issue: 牧人作为以色列领袖的比喻
  choice: 保留“牧人”意象
  alternative: 译作“领袖”或“照管者”
  rationale: 以西结书34章持续以牧人与羊群描写领袖和百姓；直接换成解释性称谓会削弱原文的先知性意象。
- issue: 末尾重复“四散”
  choice: 保留原文重复
  alternative: 因汉语修辞习惯省略末句
  rationale: 重复形成强调和收束，突出无人牧养所造成的持续离散，不宜当作赘语删去。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“它们”承接上文的羊群，避免在本节明说原文仅以阴性复数动词指代的“羊群”；分号呈现结果之后的强调性重复。
