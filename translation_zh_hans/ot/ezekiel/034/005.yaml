revisions:
- from: 它们因没有牧人而四散，成了田野一切走兽的食物；它们就四散了。
  to: 它们因没有牧人而四散，成了田野一切野兽的食物；它们又四散了。
  rationale: 将“走兽”改为“野兽”，避免不必要地缩小原文集合名词的指涉范围；将末句“就”改为“又”，在自然汉语中保留希伯来文末尾重复的强调，而不额外加强因果顺承。无须增设脚注。
