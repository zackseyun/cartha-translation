base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/028.yaml
  text: They will no longer be plunder for the nations[a], and the wild animals of the land will not devour them. They will dwell securely[c][b], with no one to make them afraid.
translation:
  language: zh_hans
  text: 他们不再成为列国的掠物[a]，地上的野兽[b]也不会吞吃他们。他们必安然居住[c]，无人使他们惊恐。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国的猎物”或“列国的战利品”。
    reason: lexical_alternative
  - marker: b
    text: “地上的野兽”也可译为“田野的走兽”。
    reason: lexical_alternative
  - marker: c
    text: “安然居住”也可译为“安全地生活”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּז
  choice: 掠物
  rationale: 该词指被强取之物或战利品。这里描述列国对以色列的掠夺，“掠物”既保留政治压迫的含义，也与下句野兽吞吃的意象有所区分。
- source_word: לַגּוֹיִם
  choice: 列国的
  rationale: גּוֹיִם在此指周围各国或各民族，并非后期意义上的专门术语；结合中文所属表达，译为“列国的掠物”自然清楚。
- source_word: חַיַּת הָאָרֶץ
  choice: 地上的野兽
  rationale: 该结构指陆地上的野生兽类。“野兽”保留威胁与捕食的具体意象，“地上的”则直接反映הָאָרֶץ的空间表达。
- source_word: תֹאכְלֵם
  choice: 吞吃他们
  rationale: 动词字面义为“吃”；在猛兽袭击人的语境中，“吞吃”自然且形象，同时保留原文用词的直接性。
- source_word: וְיָשְׁבוּ
  choice: 他们必……居住
  rationale: ישב可指坐、居住或定居；此处恢复应许的语境强调安定生活，故译“居住”。“必”表达预告语境中的将来确定性，并非另加命令含义。
- source_word: לָבֶטַח
  choice: 安然
  rationale: 该词表达安全、稳妥而无惧的状态。“安然居住”是自然、庄重的现代中文搭配。
- source_word: וְאֵין מַחֲרִיד
  choice: 无人使他们惊恐
  rationale: מַחֲרִיד是使役词干的分词，表示使人战栗、惊恐者。此译保留个人施事者和使役含义，也避免把恐惧弱化为一般担心。
- source_word: עוֹד
  choice: 不再
  rationale: 与否定词连用，表示先前状况的终止；“不再”最简洁准确。
theological_decisions:
- issue: 所应许之安全的性质
  choice: 按经文直陈为从列国掠夺、野兽侵害和恐吓中得安全的恢复应许，不进一步限定其实现方式。
  alternative: 把列国与野兽完全象征化，或将本节专门限定为某一种末世时期。
  rationale: 希伯来文并列呈现国际压迫、野兽威胁及安然居住。译文应保留这些具体意象和潜在的神学张力，而不引入文本未说明的体系性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“掠物”略具经文语体，但能准确表达被列国强取之物；“安然居住”自然凝练，并保留先知性恢复应许的语气。所有脚注标记均置于相关短语之后。
