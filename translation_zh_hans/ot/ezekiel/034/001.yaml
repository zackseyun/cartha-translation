lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事性连接形式与整句的先知公式共同表达新的启示来到；汉语用“临到”即可自然承载行文推进，无须另译为“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定先知用语中，“话”准确指来自上帝的特定启示，也保留原文“话语”的形式关联。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名；“耶和华”是现代中文圣经语境中通行、可辨识的专名形式。脚注说明其希伯来文形式及另一常见音译。
- source_word: אֵלַי
  choice: 我
  rationale: 介词及第一人称单数词尾意为“向我／到我这里”；在汉语固定搭配“临到我”中自然表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接引语；译作“说”简洁自然，并保留原文结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名而非称号。正文采用中文读者最熟悉的专名形式“耶和华”，同时不把它改译为“主”；“雅威”可作为更接近现代学界拟音的替代音译，但本节不必据此消除神名古代读音的不确定性。
translation_notes:
  register: 采用现代、庄重而简洁的先知叙事用语。“耶和华的话临到我，说”保留希伯来文公式化结构，在普通中文读者中也自然可懂。
