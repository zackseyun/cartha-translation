base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/026.yaml
  text: And I will make them and the places around my hill a blessing[a], and I will send down the rain in its season; they will be showers of blessing.
translation:
  language: zh_hans
  text: 我要使他们和我的山周围的地方成为福分[a]。我要按时降下雨来；这雨将是赐福的甘霖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要赐福给他们和我的山周围的地方。”原文的句法可理解为使他们及周围地区“成为福分”，也可理解为把福赐给他们及该地区。“我的山”很可能指上帝的圣山，常被理解为锡安。
    reason: 句法与词义存在可保留的不同理解，并需说明“我的山”的可能所指。
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要使……成为
  rationale: נתן在这里带宾语和表语“福分”，具有使役、结果含义；“使……成为”自然表达这一结构。
- source_word: אוֹתָם וּסְבִיבוֹת גִּבְעָתִי
  choice: 他们和我山周围的地方
  rationale: 保留“他们”与“我山周围”两个并列对象，并补出“地方”，使סביבות的空间含义在现代汉语中清楚自然。
- source_word: בְּרָכָה
  choice: 福分
  rationale: 保留单数表语的含义，表示他们及该区域将成为带来福惠之所在。
- source_word: וְהוֹרַדְתִּי
  choice: 我要……降下……来
  rationale: 体现ירד的使役形，明确雨由上帝使之降下。
- source_word: הַגֶּשֶׁם בְּעִתּוֹ
  choice: 按时降下雨来
  rationale: בְּעִתּוֹ指在合宜、规定的时候；“按时”简洁自然，又保留及时降雨之意。
- source_word: גִּשְׁמֵי בְרָכָה
  choice: 赐福的甘霖
  rationale: “甘霖”自然表达带来滋润和丰足的雨水，“赐福的”保留בְרָכָה的明确词义及与前句“福分”的呼应。
- source_word: יִהְיוּ
  choice: 那将是
  rationale: 将复数雨水作为整体情景回指，符合现代汉语表达，同时保留未来陈述。
theological_decisions:
- issue: “我山”的所指
  choice: 正文保留“我山”，不明确指定为锡安或圣所所在的山。
  alternative: 译作“我的圣山”或直接译作“锡安山”。
  rationale: 希伯来文本仅说“我山”。上下文可能使人联想到锡安及复兴后的圣所，但本节没有明说；直译可避免加入超出文本的特定神学认定。
- issue: “福分”与雨的关系
  choice: 保留前后两次“福”的词义联系，并把后一句译为“赐福的甘霖”。
  alternative: 将后一句解释性译为“带来丰收的雨水”或“丰沛的雨水”。
  rationale: 原文重复ברכה，既可指上帝所赐的福，也可描述雨所承载或带来的福；保留这一神学与修辞张力，不局限为农业丰收。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“福分”比“祝福”更适合作表语名词；“甘霖”虽略具文学色彩，但在现代汉语中通晓，并能凝练表达带来恩惠的及时雨。
