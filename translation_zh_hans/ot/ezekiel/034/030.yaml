  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֧י יְהוָ֛ה אֱלֹהֵי/הֶ֖ם אִתָּ֑/ם וְ/הֵ֗מָּה עַמִּ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/030.yaml
  text: And they will know that I[a], Yahweh their God, am with them, and that they, the house of Israel, are my people, declares the Lord GOD.
translation:
  language: zh_hans
  text: 他们将知道：我，耶和华他们的上帝，与他们同在[a]；他们，以色列家，是我的子民。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们中间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 他们就会知道
  rationale: 在先知性语境中表达将来的结果；“就会知道”自然地承接前文并保留结果意味。
- source_word: כִּי
  choice: （由“知道”引出宾语从句）
  rationale: 此处引出他们所知道的内容，汉语无需另译“因为”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中通行的神名音译，明确保留四字神名，而不以称号替代。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 准确表达构造关系及第三人称复数后缀，且符合现代汉语。
- source_word: אִתָּם
  choice: 与他们同在
  rationale: 直接保留“与他们在一起”的盟约临在用语；“在他们中间”亦为可能含义，列入脚注。
- source_word: וְהֵמָּה
  choice: 并且他们
  rationale: 保留显式且带强调意味的代词，并与前一认知内容并列。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留先知书中盟约公式的传统而自然的表达。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留该固定先知性称谓的整体与盟约色彩，不简化为“以色列人”。
- source_word: נְאֻם
  choice: 宣告
  rationale: 在先知公式中传达庄严、权威的发言性质。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别保留 אֲדֹנָי 的称号和 יְהוָה 的专名，符合中文传统且避免重复为“主主”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文现代标准语境中“耶和华”是广泛可识别的专名形式，能够保留其作为以色列上帝盟约之名的功能；不以“上主”等称号替换。
- issue: אִתָּם 的盟约临在含义
  choice: 与他们同在
  alternative: 在他们中间
  rationale: “与他们同在”较直接对应希伯来语介词结构，并与“他们是我的子民”构成盟约公式；同时以脚注保留空间性更强的另一可能。
- issue: 两个带强调成分的同位结构
  choice: 我耶和华—他们的上帝—……他们—以色列家—……
  alternative: 耶和华他们的上帝与他们同在，以色列家是我的子民
  rationale: 破折号保留“我”与“他们”的强调，并清楚呈现“他们的上帝”和“以色列家”两个同位说明，避免抹平原文的对应结构。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“以色列家”和“我的子民”保留先知书的盟约语域；破折号帮助普通读者辨认原文同位结构。脚注标记[a]已置于正文相应位置。
