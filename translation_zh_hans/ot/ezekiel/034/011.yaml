id: EZK.34.11
reference: Ezekiel 34:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִי אָ֕נִי וְ/דָרַשְׁתִּ֥י אֶת צֹאנִ֖/י וּ/בִקַּרְתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/011.yaml
  text: 'For thus says the Lord GOD: Behold[a], I myself will search for my sheep and seek them out.'
translation:
  language: zh_hans
  text: 因为主耶和华如此说：“看哪，我必亲自寻找我的羊，并看顾它们[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看顾”也可译作“察看”“寻找出来”或“照料”。希伯来语动词既可表示查找、察看，也可表示亲自照管。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号；“主耶和华”是现代中文圣经语体中自然且庄重的表达，也避免把两个称号合并为一个。
- source_word: הִנְנִי אָנִי
  choice: 看哪，我必亲自
  rationale: “看哪”保留先知宣告中 הִנְנִי 的提示和强调作用；“亲自”体现独立代词 אָנִי 所加强的上帝亲身介入。
- source_word: וְדָרַשְׁתִּי
  choice: 寻找
  rationale: 在牧羊语境中，דרש 表示主动寻找失散的羊；“寻找”清楚、自然，并保留行动意味。
- source_word: צֹאנִי
  choice: 我的羊
  rationale: צאן 可指羊群或小型牲畜的集合；此处译作“我的羊”，使牧者与羊的比喻更具体，也便于承接代词“它们”。
- source_word: וּבִקַּרְתִּים
  choice: 并看顾它们
  rationale: בקר 在此可包含察看、寻找和亲自照管的意思。“看顾”既与前面的“寻找”有所区别，又表达牧者找到羊后亲自关照它们；其词义幅度以脚注保留。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者广泛熟悉的音译“耶和华”，并与 אֲדֹנָי 合译为“主耶和华”；不把神名泛化为单纯的“主”，同时承认“雅威”是另一种更接近学界重构读音的译法。
- issue: 上帝亲自作牧者的强调
  choice: 我必亲自
  alternative: 我在这里，我自己要
  rationale: 希伯来文 הִנְנִי אָנִי 双重突出说话者本人。“我必亲自”以自然中文保留这种强调，不额外解释其神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留先知文学的宣告语气；“寻找……并看顾……”维持两个希伯来动词的并列，同时不把二者机械地译成近义重复。脚注标记置于其所说明的“看顾它们”之后。
