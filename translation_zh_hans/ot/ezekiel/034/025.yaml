language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם וְ/הִשְׁבַּתִּ֥י חַיָּֽה רָעָ֖ה מִן הָ/אָ֑רֶץ וְ/יָשְׁב֤וּ בַ/מִּדְבָּר֙ לָ/בֶ֔טַח וְ/יָשְׁנ֖וּ בַּ/יְּעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/025.yaml
  text: I will make with them a covenant of peace[a], and I will remove harmful wild animals from the land[b], so that they may dwell securely in the wilderness and sleep in the forests.
translation:
  language: zh_hans
  text: 我必与他们立平安之约[a]，并使有害的野兽不再在这地出没[b]；他们必安然住在旷野，睡在树林里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也包含完整、福祉和安稳之意，不仅指没有冲突。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使有害的野兽从这地消失。”原文直译为“使有害的野兽从这地止息”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: 立
  rationale: כרת ברית直译为“切约”，是“立约”的固定习语；中文用“立约”既自然，也保留正式的盟约表达。
- source_word: בְּרִית שָׁלוֹם
  choice: 平安之约
  rationale: “平安”保留שָׁלוֹם所涵盖的和平、安稳、健全与福祉，不把含义缩窄为仅仅没有战争。
- source_word: הִשְׁבַּתִּי
  choice: 使……绝迹
  rationale: 该使役式意为“使停止、不再有”；结合“从这地”与有害野兽的语境，“使……绝迹”自然表达它们不再出没造成威胁，但不必理解为全部灭绝。
- source_word: חַיָּה רָעָה
  choice: 害人的野兽
  rationale: חַיָּה指野生兽类，רָעָה在此强调其造成伤害或危险，而非动物具有道德上的邪恶；“害人的野兽”清楚自然。
- source_word: מִן הָאָרֶץ
  choice: 从这地
  rationale: הָאָרֶץ在本段指特定的土地，而非整个世界；中文以“这地”体现上下文所指的地域。
- source_word: וְיָשְׁבוּ
  choice: 他们就能……住
  rationale: 动词意为居住；结合前句除去威胁所产生的结果，用“就能”自然呈现目的或结果关系，同时不改变应许语气。
- source_word: בַמִּדְבָּר
  choice: 在旷野
  rationale: מִדְּבָּר可指荒野、草原地带，并不一定是完全无水的沙漠；“旷野”保留其宽广含义和本节反常而鲜明的安全图景。
- source_word: לָבֶטַח
  choice: 安然
  rationale: 该词表示安全、无惧地生活；“安然住”简洁自然。
- source_word: וְיָשְׁנוּ
  choice: 睡
  rationale: 按其直接意义译为“睡”，保留即使在危险之地也能毫无戒惧安睡的具体画面。
- source_word: בַּיְּעָרִים
  choice: 在树林里
  rationale: יְעָרִים指林地或森林；“树林里”是现代中文中自然、清楚的表达。
theological_decisions:
- issue: “平安之约”的应许范围
  choice: 在正文保留“平安之约”这一宽广的盟约表达
  alternative: 将其限定为政治上的和平，或在正文中扩写为完整的救恩体系
  rationale: 原文的שָׁלוֹם包含和平、安稳、健全与福祉等意涵，但本节没有把这些含义系统化；译文应保留其神学张力和丰富性，而不加以窄化或过度展开。
- issue: 野兽“不再有”的性质
  choice: 译作“使害人的野兽从这地绝迹”
  alternative: 理解为将所有野兽彻底灭绝，或仅把野兽象征化为敌对势力
  rationale: 原文直接描写有害野兽停止在这地造成威胁，重点是百姓得以安全居住；译文既不宣称普世性的动物灭绝，也不取消其具体的牧养与土地意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“立平安之约”保留盟约用语；“旷野”“树林”保留原文中在通常危险之地仍可安居熟睡的鲜明对照。脚注标记已按实际所注释的词语排列，避免将“平安之约”与“野兽止息”的说明错配。
