base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/023.yaml
  text: And I will raise up over them one shepherd[a], my servant David, and he will shepherd them; he himself will shepherd them[c][b], and he himself will be their shepherd.
translation:
  language: zh_hans
  text: “我要在他们之上兴起一位牧人[a]，就是我的仆人大卫[b]；他要牧养他们；他要亲自牧养他们，也要亲自作他们的牧人[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要在他们之上设立一位牧人。”
    reason: lexical_alternative
  - marker: b
    text: “大卫”可指历史上的大卫（作为理想化的君王形象），也可更广泛地指未来一位大卫王系的统治者。
    reason: alternative_reading
  - marker: c
    text: 希伯来语反复使用“牧养”的动词，也可译作“照料”或“喂养”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: 我要……兴起
  rationale: 使役形的 קום 可表示“兴起、设立、委任”。“兴起”既保留上帝使这位领袖出现并任职的含义，也不把经文过度限定为登基或某种具体任命仪式。
- source_word: עֲלֵיהֶם
  choice: 在他们之上
  rationale: עַל 在这里表达牧人被置于群体之上、承担带领职责；译文保留这一空间兼权柄意象，而不直接增译“治理”。
- source_word: רֹעֶה אֶחָד
  choice: 一位牧人
  rationale: 直译名词短语，并保留 אֶחָד 所强调的单一性。量词“位”符合现代汉语对人的尊称语感。
- source_word: וְרָעָה / יִרְעֶה
  choice: 牧养
  rationale: רעה 可指放牧、喂养、照料，也可在比喻中含带领之意。“牧养”保留牧人意象，并使原文动词的重复清楚可见。
- source_word: אֵת עַבְדִּי דָוִד
  choice: 就是我的仆人大卫
  rationale: 以同位语明确“一位牧人”就是“我的仆人大卫”，保留“仆人”这一约的称号，不将“大卫”解释性改写为“弥赛亚”或“大卫的后裔”。
- source_word: הוּא
  choice: 他要亲自
  rationale: 独立人称代词带有强调作用；第二个牧养分句用“亲自”显明这一强调，同时避免每个分句都机械重复“他自己”造成不自然。
- source_word: יִהְיֶה לָהֶן לְרֹעֶה
  choice: 作他们的牧人
  rationale: 该结构表达身份与关系。“作他们的牧人”是自然、庄重的现代汉语，并保留牧养关系。
theological_decisions:
- issue: 预言语境中“大卫”的身份
  choice: 正文保留“大卫”这一名字，不作解释性扩写。
  alternative: 将其理解或译解为未来的大卫王系君王、弥赛亚或大卫的后裔。
  rationale: 希伯来文本直接说“大卫”。其所指可能是理想化的大卫，也可能是未来的大卫王系统治者；翻译不应替读者消解这一具有神学意义的张力。
- issue: 独立代词 הוּא 的强调力度
  choice: 在重复的核心分句中译为“他要亲自牧养他们”。
  alternative: 各处仅译“他”，或每处都译成“他自己”。
  rationale: “亲自”体现希伯来语独立代词的强调；只在最显著的重复分句中明示，可兼顾原文重音与现代汉语的自然表达。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“在他们之上”略具原文色彩，用以保留牧人被置于群体之上的带领意象；“牧养”重复出现，以再现希伯来语的关键词复沓。标点将同位语及后续强调分句分开，使经文适合朗读。
