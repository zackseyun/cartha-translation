reference: Ezekiel 34:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵ֖א עַל רוֹעֵ֣י יִשְׂרָאֵ֑ל הִנָּבֵ֣א וְ/אָמַרְתָּ֩ אֲלֵי/הֶ֨ם לָ/רֹעִ֜ים כֹּ֥ה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה ה֤וֹי רֹעֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֤ר הָיוּ֙ רֹעִ֣ים אוֹתָ֔/ם הֲ/ל֣וֹא הַ/צֹּ֔אן יִרְע֖וּ הָ/רֹעִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/002.yaml
  text: 'Son of man[a], prophesy against the shepherds of Israel; prophesy and say to them, to the shepherds[b], ‘Thus says the Lord GOD: Woe to the shepherds of Israel who have been shepherding themselves! Should not the shepherds shepherd the flock?’'
translation:
  language: zh_hans
  text: “人子啊，你要向以色列的牧人说预言，斥责他们；你要说预言，对他们，就是对那些牧人说：‘主雅威如此说：以色列那些只牧养自己的牧人有祸了！牧人岂不应当牧养羊群[b]吗？’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文直译为“羊”；这里按集合意义译作“羊群”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝称呼先知的固定希伯来语表达及其单数呼格语气。
- source_word: הִנָּבֵא
  choice: 说预言
  rationale: 准确表达 נבא 的尼法勒命令式；原文重复两次，译文也保留重复以体现强调。
- source_word: עַל
  choice: 攻击
  rationale: 在审判性预言和随后的祸哉宣告中具有敌对、谴责的方向，不只是中性的“论到”。
- source_word: רוֹעֵי יִשְׂרָאֵל / לָרֹעִים / הָרֹעִים
  choice: 以色列的牧人／那些牧人／牧人
  rationale: 保留贯穿本句的牧人—羊群意象，不在正文中直接解释为“领袖”。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 用现代中文圣经语体清楚区分 אֲדֹנָי 与上帝的专名 יהוה，同时保留以西结书常见的宣告公式。
- source_word: הוֹי
  choice: 有祸了
  rationale: 体现审判宣告的谴责与警告力量，比单纯表示悲叹的“哀哉”更直接易懂。
- source_word: אֲשֶׁר הָיוּ רֹעִים אוֹתָם
  choice: 他们只牧养自己
  rationale: 将宾语代词按反身意义处理，并以“只”凸显他们照顾自己而不顾羊群的对比；同时保留“牧养”这一核心动词意象。
- source_word: הֲלוֹא
  choice: 岂不应当
  rationale: 自然表达预期肯定回答的反问，并保留责备意味。
- source_word: הַצֹּאן
  choice: 羊群
  rationale: 该名词具有集合意义；“羊群”在中文中自然，并与牧人意象相配。
- source_word: יִרְעוּ
  choice: 牧养
  rationale: 保留 רעה 在本节反复形成的词语呼应，也涵盖喂养、照管和引导的意义。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中上帝之名的译法
  choice: 主耶和华
  alternative: 主上帝／主雅威
  rationale: 原文同时使用“主”和四字神名。译作“主耶和华”既避免把两者合并，也采用普通中文读者较熟悉的专名形式；不据此引入额外的宗派解释。
- issue: 是否在正文中把“牧人”直接解释为以色列的领袖
  choice: 保留“牧人”的比喻
  alternative: 以色列的领袖
  rationale: 本节以牧人、牧养和羊群构成完整而有意的比喻链；直接改译为“领袖”会削弱原文的文学结构及神学张力。
- issue: אֹתָם 的反身理解
  choice: 他们只牧养自己
  alternative: 他们牧养他们
  rationale: 宾语回指前述牧人，在语境中自然形成反身意义，且下一问明确把他们自顾自己与本应牧养羊群相对照。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“说预言”保留原文命令的重复；“攻击”传达审判语境；“牧人—牧养—羊群”的意象链完整保留。所有脚注标记均已置于正文相应位置。
