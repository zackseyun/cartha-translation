  text: לָ/כֵ֣ן רֹעִ֔ים שִׁמְע֖וּ אֶת דְּבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/007.yaml
  text: 'Therefore[a], shepherds, hear the word of Yahweh:'
translation:
  language: zh_hans
  text: 因此，牧人哪，你们要听雅威[a]的话：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），通常音译为“雅威”；中文传统常译作“耶和华”。
    reason: 说明神名的原文形式及另一常见译法。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文对牧人的指控，引出由此而来的宣告；“因此”自然、庄重，并清楚表达推论关系。
- source_word: רֹעִים
  choice: 牧人
  rationale: 保留希伯来文的字面意象；本章以“牧人”比喻以色列的领袖，不直接释为“领袖”，也避免带有教会职分色彩的“牧师”。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 这是复数命令式；补出“你们”可在现代汉语中清楚传达复数对象和命令语气，同时保留先知宣告的庄重感。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是直接宾语标记，在汉语中没有对应的独立词语。
- source_word: דְּבַר
  choice: 的话
  rationale: 构成“雅威的话”这一先知性表达，既贴近原文“话/言语”，也符合自然的现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代；脚注说明其希伯来文字母形式及中文传统译法。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用较贴近学界常见复原读音 Yahweh 的“雅威”，保留其作为专名的性质；不以“主”替代，也在脚注中交代中文传统译名“耶和华”。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“牧人哪”保留直接呼告的先知语气；句末冒号表明下文将接续雅威的话。
