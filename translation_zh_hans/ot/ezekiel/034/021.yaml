  text: יַ֗עַן בְּ/צַ֤ד וּ/בְ/כָתֵף֙ תֶּהְדֹּ֔פוּ וּ/בְ/קַרְנֵי/כֶ֥ם תְּנַגְּח֖וּ כָּל הַ/נַּחְל֑וֹת עַ֣ד אֲשֶׁ֧ר הֲפִיצוֹתֶ֛ם אוֹתָ֖/נָה אֶל הַ/חֽוּצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/021.yaml
  text: Because you push with side and shoulder, and gore all the weak ones with your horns until you have scattered them outside,
translation:
  language: zh_hans
  text: 因为你们用身侧和肩膀推挤，又用你们的角抵撞所有瘦弱的羊，直到把它们驱散到外面，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצַד וּבְכָתֵף
  choice: 用肋旁和肩膀
  rationale: 按羊群争食、排挤的比喻直译身体部位；“肋旁”比抽象的“身侧”更具体，并与“肩膀”构成自然并列。
- source_word: תֶּהְדֹּפוּ
  choice: 推挤
  rationale: 表达反复以身体排挤弱羊的动作；比单纯“推”更符合羊群彼此拥挤的场景。
- source_word: תְּנַגְּחוּ
  choice: 顶撞
  rationale: 该动词指用角抵、顶；结合“用角”，译作“顶撞”清楚自然。
- source_word: כָּל הַנַּחְלוֹת
  choice: 所有瘦弱的羊
  rationale: נחלות 在此通常理解为体弱、患病或衰弱者；上下文明确以羊群作喻，补出“羊”以便中文读者理解。
- source_word: הֲפִיצוֹתֶם
  choice: 驱散
  rationale: 保留使役性的分散含义，也体现强羊以暴力迫使弱羊离群。
- source_word: אֶל הַחוּצָה
  choice: 到外面
  rationale: 直译其方向义，不把所指具体化为羊圈之外、境外或四方，以保留原文开放性。
theological_decisions:
- issue: 强羊与弱羊的寓意对象
  choice: 正文保留羊群图像，不直接改写为权贵与弱者
  alternative: 将比喻明说为有权势者欺压弱者
  rationale: 本节仍处于羊群比喻之中；直接解释寓意会缩窄经文本身的修辞张力。
- issue: “外面”的具体范围
  choice: 保留为“外面”
  alternative: 译作“羊圈外”“各地”或“境外”
  rationale: 原文只表达向外的方向，未明确限定地点；不应以解释代替翻译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言，保留牧羊比喻的身体动作与未完句式；句末逗号反映本节由“因为”引出的理由从句，其主句延续至下一节。
