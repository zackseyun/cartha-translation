  text: לָ/כֵן֙ הָֽ/רֹעִ֔ים שִׁמְע֖וּ דְּבַר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/009.yaml
  text: 'Therefore, shepherds, hear the word of Yahweh:'
translation:
  language: zh_hans
  text: 所以，牧人们，要听耶和华的话：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接前文对牧人的指控，引出由此而来的宣告；“所以”在现代汉语中自然、清楚。
- source_word: הָרֹעִים
  choice: 牧人们
  rationale: 保留本章贯穿始终的牧人隐喻，不直接解释为“领袖”，也避免带有教会职分色彩的“牧师”。
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数命令式；“要听”既保留先知宣告的郑重召唤，也符合现代汉语表达。
- source_word: דְּבַר
  choice: 话
  rationale: 在“耶和华的话”这一先知公式中，“话”自然且具有应有的庄重感，也比“信息”更贴近原文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经语境中通行的专名形式呈现四字神名，保留其作为以色列之神名字的功能，而不改作称号。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且可作为专名使用的“耶和华”；“雅威”更接近学界常见的拟音，但在普通现代中文读者中较不通行。
- issue: 是否把 הָרֹעִים 解释为领袖
  choice: 保留“牧人们”的隐喻
  alternative: 领袖们
  rationale: 以西结书34章持续运用牧人与羊群的意象；正文保留该核心隐喻，避免把解释直接写入译文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“所以”明确承接上文；呼语“牧人们”后加逗号，“要听”表达复数命令的力度；句末冒号表明后文将继续引述耶和华的话。
