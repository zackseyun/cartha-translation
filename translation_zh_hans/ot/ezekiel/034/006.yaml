base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/006.yaml
  text: My sheep wandered on all the mountains and on every high hill[a]; my sheep were scattered over the whole face of the earth[b], with no one searching or seeking for them.
translation:
  language: zh_hans
  text: 我的羊在群山中、在每一座高冈上走迷了[a]；我的羊分散在全地各处[b]，无人寻访，无人寻找。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “走迷了”也可译作“迷失了”或“偏离了正路”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“全地的表面”；这里的“地”也可理解为“土地”或“国土”，视所理解的范围而定。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁגּוּ
  choice: 迷失
  rationale: שׁגה表示走错、偏离正路；“迷失”既自然，也保留羊离开正途而失散的牧养意象。
- source_word: צֹאנִי
  choice: 我的羊
  rationale: 直译为“我的羊／羊群”；“我的羊”保留具体的牧羊比喻以及说话者与羊的归属关系。
- source_word: בְּכָל הֶהָרִים
  choice: 在群山
  rationale: 按现代汉语地点表达处理；“群山”自然传达原文“所有山岭”的广泛范围。
- source_word: וְעַל כָּל גִּבְעָה רָמָה
  choice: 和每一座高冈上
  rationale: 保留כָּל的逐一强调及רָמָה“高”的含义；“高冈”庄重而仍为现代读者所理解。
- source_word: וְעַל כָּל פְּנֵי הָאָרֶץ
  choice: 在全地各处
  rationale: 原文直指“全地的表面”；“全地各处”以自然汉语表达全面散布，同时让“地”保留可指大地或一片土地的范围歧义。
- source_word: נָפֹצוּ
  choice: 分散
  rationale: 该词的被动形态表示被分散、四散；“分散”清楚保留失群散布的状态。
- source_word: וְאֵין דּוֹרֵשׁ
  choice: 无人寻访
  rationale: דּרשׁ可表示寻求、查问或过问；“寻访”既有主动寻找之意，也隐含本应关切过问却无人履行。
- source_word: וְאֵין מְבַקֵּשׁ
  choice: 无人寻找
  rationale: בקש在此表示寻找、设法找到；与前面的“寻访”并列，保留原文两个近义分词的重复强调。
theological_decisions:
- issue: “我的羊”的所指
  choice: 保留为上帝所说的牧羊比喻，指属他的百姓
  alternative: 把它理解为不含盟约背景的一般牧羊图景
  rationale: 以西结书34章的语境表明说话者是上帝，羊群代表在失职牧人手下受害、四散的百姓；正文只保留比喻，不加入解释性称谓。
- issue: “全地”的范围
  choice: 保留“地”的范围弹性
  alternative: 明确译为“全世界”或“全国”
  rationale: הָאָרֶץ既可指大地，也可指特定土地；本节措辞广阔，但原文本身未强制限定为全球或本地范围，因此不在正文中消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“群山／每一座高冈”保留地势铺陈，“无人寻访，无人寻找”以简洁平行句式重现希伯来文两个近义表达的强调。所有脚注标记均置于对应正文之后。
