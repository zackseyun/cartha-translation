  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֣י/ם מִן הָ/עַמִּ֗ים וְ/קִבַּצְתִּי/ם֙ מִן הָ֣/אֲרָצ֔וֹת וַ/הֲבִיאֹתִ֖י/ם אֶל אַדְמָתָ֑/ם וּ/רְעִיתִי/ם֙ אֶל הָרֵ֣י יִשְׂרָאֵ֔ל בָּ/אֲפִיקִ֕ים וּ/בְ/כֹ֖ל מוֹשְׁבֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/013.yaml
  text: And I will bring them out from the peoples[a], and gather them from the lands, and bring them into their own land; and I will pasture them on the mountains of Israel, by the streams, and in all the inhabited places of the land.
translation:
  language: zh_hans
  text: 我必把他们从万民中领出来，从各地招聚他们，带他们进入自己的土地；我必在以色列的群山上、溪谷中[a]，以及这片土地上一切有人居住的地方牧养他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“水道中”“河床中”或“峡谷中”。希伯来词可指流水经过的沟道，也可指溪谷或峡谷。
    reason: 保留 בָּאֲפִיקִים 的地形与水文含义所具有的词义幅度。
lexical_decisions:
- source_word: וְהוֹצֵאתִים
  choice: 我必把他们……领出来
  rationale: 该词是 יצא 的使役形，表示使他们出来；“领出来”自然地保留了上帝亲自带领其民离开列邦的意味。
- source_word: הָעַמִּים
  choice: 万民
  rationale: 复数名词指不同的民族或民众；“万民”符合现代中文圣经语体，并与下文“各地”有所区别。
- source_word: וְקִבַּצְתִּים
  choice: 招聚他们
  rationale: קבץ 常用于招聚分散之民；“招聚”既准确表达聚集，也符合本段庄重的复兴语境。
- source_word: הָאֲרָצוֹת
  choice: 各地
  rationale: 此处复数指他们散居的不同地域；“各地”比“各国”更贴近地理含义，也避免与前面的“万民”重复。
- source_word: וַהֲבִיאֹתִים
  choice: 带他们回到
  rationale: בוא 的使役形表示带入。结合从外地招聚、归向其土地的语境，“回到”自然呈现复归含义，但不增添经文以外的地点说明。
- source_word: אַדְמָתָם
  choice: 自己的土地
  rationale: אדמה 可指土地、地土，附有第三人称复数所有格；“自己的土地”清楚保留所属关系和归回故土的语意。
- source_word: וּרְעִיתִים
  choice: 牧养他们
  rationale: רעה 可指放牧、喂养或牧养；本章以牧羊为主导意象，“牧养”既保留牧者形象，也能涵盖在指定地点放牧喂养。
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: 在以色列的群山上
  rationale: 介词 אֶל 在 רעה 之后可引出放牧的范围；中文用“在……上”自然表达群山作为牧养地点。
- source_word: בָּאֲפִיקִים
  choice: 溪谷中
  rationale: אפיקים 可指水道、河床、溪谷或峡谷。“溪谷”兼顾水流与地形含义，并以脚注保留其他可能译法。
- source_word: וּבְכֹל מוֹשְׁבֵי הָאָרֶץ
  choice: 这片土地上一切有人居住的地方
  rationale: מוֹשָׁב 可指居住之处或聚居地；此译法保持范围宽广，不将其局限为正式村镇。
theological_decisions:
- issue: אַדְמָתָם 的归属和复兴含义
  choice: 自己的土地
  alternative: 他们的土地
  rationale: 所有格后缀明确表达土地属于他们；“自己的土地”突出归回本土，却不把后来形成的神学或政治主张带入经文。
- issue: רעה 的牧者意象
  choice: 牧养他们
  alternative: 让他们吃草
  rationale: “牧养”保留本章上帝作为牧者的持续意象，同时没有排除该动词在本节具体指放牧、喂养的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“我必”呈现连续的神圣应许；句式保留“领出—招聚—带回—牧养”的动作推进。脚注标记置于其实际对应的“溪谷中”之后。
