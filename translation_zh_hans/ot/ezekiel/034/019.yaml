  text: וְ/צֹאנִ֑/י מִרְמַ֤ס רַגְלֵי/כֶם֙ תִּרְעֶ֔ינָה וּ/מִרְפַּ֥שׂ רַגְלֵי/כֶ֖ם תִּשְׁתֶּֽינָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/019.yaml
  text: And my flock must graze on what your feet have trampled[b][a], and drink what your feet have muddied.
translation:
  language: zh_hans
  text: 至于我的羊群，只得吃你们脚所践踏的草，喝你们脚所搅浑的水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצֹאנִי
  choice: 至于我的羊群
  rationale: צֹאן指成群的羊或羊群，在牧养语境中译作“羊群”自然，并保留第一人称单数所属关系。“至于”承接上文对肥羊的责问，凸显与“你们”的对照。
- source_word: מִרְמַס רַגְלֵיכֶם
  choice: 你们脚所践踏的草
  rationale: מִרְמַס可指践踏之物或践踏之处；与“吃草”搭配时，将语境隐含的草场内容表达为“草”，使中文通顺，同时保留被脚践踏的具体图景。
- source_word: תִּרְעֶינָה
  choice: 只得吃
  rationale: רעה在此为羊群吃草。未完成式本身可译为“要吃/将吃”，但上下文表明羊群因强壮者的破坏而被迫食用残余，故用“只得”表达结果性的无奈，不把它理解为命令。
- source_word: וּמִרְפַּשׂ רַגְלֵיכֶם
  choice: 你们脚所搅浑的水
  rationale: מִרְפָּשׂ表示被搅动、弄浑之物；后接“喝”使水明确可知。译文补出“水”，准确呈现污染饮水的意象。
- source_word: תִּשְׁתֶּינָה
  choice: 喝
  rationale: שׁתה意为“喝”。主语沿用前句“我的羊群”，并由“只得”自然统摄两个并列动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的中文。“吃……草，喝……水”形成清楚的平行结构；“践踏”与“搅浑”保留原文对羊群自私行为及其后果的鲜明意象。原文节末的ס为段落标记，不进入正文。
