source:
  edition: WLC
  text: וְ/אַתֵּ֥ן צֹאנִ֛/י צֹ֥אן מַרְעִיתִ֖/י אָדָ֣ם אַתֶּ֑ם אֲנִי֙ אֱלֹ֣הֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/031.yaml
  text: And you[a], my flock, the flock of my pasture—you are men, and I am your God, declares the Lord GOD.
translation:
  language: zh_hans
  text: 至于你们，我的羊群，我草场上的羊群，你们是人[a]；我是你们的上帝。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人类”。希伯来文 אָדָם 在这里泛指人，与前面的“羊群”这一比喻相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּן
  choice: 至于你们
  rationale: 连词加前置的第二人称复数代词带出直接称呼和对比重点；“至于你们”在现代汉语中自然地保留这一话语功能。
- source_word: צֹאנִי
  choice: 我的羊群
  rationale: 保留集合意义和全章持续使用的牧羊隐喻。
- source_word: צֹאן מַרְעִיתִי
  choice: 我草场上的羊群
  rationale: 保留与前语同位的复述，也清楚呈现“草场”的牧养图景。
- source_word: אָדָם
  choice: 人
  rationale: 原文以简短有力的“你们是人”揭明羊群实际是人；“人”既贴近该词，也不把泛指人类的含义限缩为男性。
- source_word: אַתֶּם
  choice: 你们是
  rationale: 汉语补出判断词“是”，使句子自然，同时保留第二人称复数的强调。
- source_word: אֲנִי אֱלֹהֵיכֶם
  choice: 我是你们的上帝
  rationale: 清楚保留第一人称强调和带领属关系后缀所表达的关系性。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 以庄重而易懂的现代汉语表达先知书中常见的神谕公式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 按现代中文圣经惯例区分并保留复合神名中“主”和四字神名的成分。
theological_decisions:
- issue: 牧羊隐喻中 אָדָם 的译法
  choice: 人
  alternative: 人类；世人；男人
  rationale: 此句以人的真实身份与“羊群”的隐喻相对照。希伯来词 אָדָם 在这里可泛指人或人类；译作“人”最能保留原句的简洁力度及其范围上的开放性，而不误导为仅指男性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“至于你们”体现开头的对比性称呼；分号保留“你们是人”与“我是你们的上帝”之间紧密而有张力的对应。
