  text: אֲנִ֨י אֶרְעֶ֤ה צֹאנִ/י֙ וַ/אֲנִ֣י אַרְבִּיצֵ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/015.yaml
  text: I myself will shepherd my flock[a], and I myself will make them lie down[c][b], declares the Lord Yahweh.
translation:
  language: zh_hans
  text: 我必亲自牧养我的羊群，也必亲自使它们躺卧。这是主耶和华的宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי / וַאֲנִי
  choice: 我必亲自……也必亲自
  rationale: 希伯来文两次明用独立人称代词，均带强调；“亲自”自然保留了这种重复和上帝亲自行动的语气。
- source_word: אֶרְעֶה
  choice: 牧养
  rationale: רעה 在本段延续牧人意象，含照管、带领和喂养，不宜缩减为单纯“喂养”。
- source_word: צֹאנִי
  choice: 我的羊群
  rationale: צֹאן 是集合名词，可泛指绵羊、山羊等小型牲畜；在牧养语境中，“羊群”既自然又保留集合意义。
- source_word: אַרְבִּיצֵם
  choice: 使它们躺卧
  rationale: רבץ 的使役形直接表达使羊群躺下安歇；这一译法保留牧人使羊安然躺卧的具体图景。
- source_word: נְאֻם
  choice: 宣告
  rationale: 这是先知话语中常见的权威发言公式；译作“宣告”简洁、庄重，并保留言说行为的权威性。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别对应 אֲדֹנָי 的“主”和神名 יְהוִה 的传统汉语形式“耶和华”，避免把两个词合并或遗漏。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”逐项体现称号与神名，且是现代中文圣经语境中广为人知、庄重而可理解的表达；不将专名泛化为“上帝”。
- issue: 重复的第一人称强调
  choice: 两处均译“亲自”
  alternative: 仅译“我必……我必……”
  rationale: 原文刻意重复 אֲנִי，强调牧养和安置羊群的是上帝自己；两处保留“亲自”不额外引入“唯独我”的排他含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留牧人语境中的具体动作与两次强调性代词，并以两个短句呈现神谕公式，使节奏自然清晰。
