  yaml_path: translation/ot/ezekiel/034/022.yaml
  text: I will save my flock[a], and they will no longer be prey[b], and I will judge between sheep and sheep.
translation:
  language: zh_hans
  text: 我必拯救我的羊群；它们必不再成为掠夺的对象[a]。我必在羊与羊之间施行审判[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不再任人掳掠”或“不再成为战利品”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“在羊与羊之间”，意思是在羊群中一只羊与另一只羊之间。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: 我必拯救
  rationale: ישׁע 的使役形在这里表示耶和华亲自使羊群脱离危险和欺压。“拯救”既自然凝练，也保留了神施行救援的神学分量。
- source_word: לְצֹאנִי
  choice: 我的羊群
  rationale: צֹאן 是羊等小型牲畜的集合称谓；在牧人意象中译作“羊群”最自然，并明确保留第一人称所属关系。
- source_word: וְלֹא תִהְיֶינָה עוֹד לָבַז
  choice: 使它们不再成为掠物
  rationale: לָבַז 直指成为抢掠之物。“成为掠物”保留原文的受掠意象；用“使”承接前句，在现代汉语中清楚表达拯救所带来的结果。
- source_word: וְשָׁפַטְתִּי
  choice: 我必……施行审判
  rationale: שׁפט 在此表示耶和华在群体成员之间作出司法和道德判断。“施行审判”比“管理”更充分保留其裁断意味。
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: 在羊与羊之间
  rationale: 原文采用单数分配式的重复，直译为“羊与羊之间”，强调羊群内部个体之间的审判，同时保留原句的修辞形式。
theological_decisions:
- issue: 牧人比喻中的神圣拯救
  choice: 我必拯救我的羊群
  alternative: 我必救援我的羊群；我必搭救我的羊群
  rationale: 经文以耶和华为拯救行动的直接施行者。“拯救”兼具现实救援和较广的圣经神学意蕴，却不把后来的具体教义强加于本节。
- issue: 耶和华在羊群内部的审判
  choice: 我必在羊与羊之间施行审判
  alternative: 我必在一只羊和另一只羊之间审判
  rationale: 经文不只描述从外来侵害中获救，也宣告羊群内部将受审判。所选译法保留拯救与审判并存的张力，并保留希伯来文的重复表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“掠物”略带书面色彩，但能准确保留原文意象；脚注提供更口语化的表达。“羊与羊之间”刻意保留原文的重复及其群体内部裁断的强调。
