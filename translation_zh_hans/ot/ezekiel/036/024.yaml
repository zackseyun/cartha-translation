revisions:
- from: 我要从列国中[a]把你们领出来，从各地[b]招聚你们，带你们到你们自己的土地上[c]。
  to: 我要从列国中把你们领出来，从所有土地招聚你们，带你们进入你们的土地。
  rationale: 修正脚注a不准确的替代译法；以“所有”明确保留כָּל的总括范围；以“你们的土地”直接而充分地表达所属后缀，避免中文“自己的”所增加的强调。其余动词序列和复兴语境均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:53:23Z'
review_pass:
  verdict: revise
  source_fidelity: 正文准确呈现三个第一人称神圣行动：从列国取出、从一切土地招聚、带到你们的土地。惟“从各地”虽通顺，但较弱地显出了כָּל（“一切／所有”）的总括性；“自己的”在中文中增添强调，原文的第二人称复数所属后缀以“你们的”已可充分表达。脚注a把可选译法写作“从列国那里”不合原文的来源／处所关系，也不符合英语审校轨迹所列“from among the nations”。
  naturalness: 修订后的“从所有土地”稍具庄重书面语色彩，适合先知书；“带你们进入你们的土地”自然，并避免“土地上”可能带来的表面方位感。全句仍保持现代普通话的清晰与庄重。
  terminology: “列国”适当地对应גּוֹיִם在此的诸民族／邦国含义；“招聚”适当地对应קבץ；“土地”适当地对应אַדָמָה。未加入“归回”或任何超出文本的神学限定。
  issues:
  - severity: medium
    issue: 脚注a的替代译法“从列国那里”不准确。
    rationale: מִן הַגּוֹיִם表示“从列国”或“从列国中／从列国当中”，不是中文“从……那里”所常表达的来源处。应改为“从列国当中”。
  - severity: low
    issue: “从各地”未明确表达כָּל的总括性。
    rationale: “各地”常可涵盖复数地域，但“从所有土地”更清楚保留“从一切土地”的范围。
  - severity: low
    issue: “你们自己的土地”及脚注c的说明略加强了所属语气。
    rationale: 希伯来语仅以所属后缀表达“你们的”；中文“你们的土地”已明确表达该后缀，无须添加“自己的”的强调。
  revised_text: 我要从列国中把你们领出来，从所有土地招聚你们，带你们进入你们的土地。
  revised_footnotes:
  - marker: a
    text: 也可译作“从列国当中”。
    reason: lexical_alternative
  - marker: b
    text: “所有土地”也可译作“各国各地”或“所有国家”。
    reason: lexical_alternative
  - marker: c
    text: 直译“到你们的土地”；“你们的”表达希伯来语的所属后缀。
    reason: lexical_alternative
  revision_rationale: 修正脚注a不准确的替代译法；以“所有”明确保留כָּל的总括范围；以“你们的土地”直接而充分地表达所属后缀，避免中文“自己的”所增加的强调。其余动词序列和复兴语境均予保留。
