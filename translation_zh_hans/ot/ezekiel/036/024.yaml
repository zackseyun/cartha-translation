  text: וְ/לָקַחְתִּ֤י אֶתְ/כֶם֙ מִן הַ/גּוֹיִ֔ם וְ/קִבַּצְתִּ֥י אֶתְ/כֶ֖ם מִ/כָּל הָ/אֲרָצ֑וֹת וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/024.yaml
  text: For I will take you from the nations[a], and gather you from all the lands[c][b], and bring you into your own land.
translation:
  language: zh_hans
  text: 我要从列国中把你们领出来，从所有土地招聚你们，带你们进入你们的土地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: 我要把你们领出来
  rationale: לקח的基本意思是“取、带走”；与表示来源的“从列国中”连用时，“领出来”自然表达上帝主动将流散之民带离列国的行动，同时没有加入原文未明说的“归回”。
- source_word: מִן הַגּוֹיִם
  choice: 从列国中
  rationale: גּוֹיִם在此主要指以色列人流散其间的各民族或邦国。“列国中”既保留复数的政治—民族含义，也清楚表达“从……当中”的关系。
- source_word: וְקִבַּצְתִּי אֶתְכֶם
  choice: 招聚你们
  rationale: קבץ常用于招聚四散之民。“招聚”比单纯的“集合”更能表达主动召集并聚拢的动作，也符合先知书庄重而自然的语体。
- source_word: מִכָּל הָאֲרָצוֹת
  choice: 从各地
  rationale: אֲרָצוֹת可指多片土地、地区或国家。此处“各地”简洁自然，并与流散的地理背景吻合；“各国”也是可能译法。
- source_word: וְהֵבֵאתִי אֶתְכֶם
  choice: 带你们到
  rationale: בוא的使役形表示“使来到、带到”。“带……到”保留使役和目的地关系；不译作“带回”，以免加入希伯来文本没有明说的“回”。
- source_word: אֶל אַדְמַתְכֶם
  choice: 到你们自己的土地上
  rationale: אַדָמָה可指土地、地土或故土，词尾明确表示“你们的”。“你们自己的土地”自然显出所属关系，但不进一步把它解释为特定的后世神学主张。
theological_decisions:
- issue: 复兴应许与土地归属
  choice: 到你们自己的土地上
  alternative: 到你们的土地上；到你们的故土
  rationale: 译文保留第二人称复数所属后缀所表达的归属关系，同时避免用“永远拥有”等措辞扩展经文本身。没有采用“故土”，因为它虽符合流亡归回的语境，却比אַדְמַתְכֶם更明确地加入“祖居之地”的解释。
- issue: 是否明说“归回”
  choice: 带你们到
  alternative: 带你们回到
  rationale: 流亡复兴的上下文确实暗示归回，但动词本身是“带到”，没有独立表达“回”的成分。因此正文采用较贴近原文的译法，把归回含义留在语境中。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个第一人称动作依次译为“领出来—招聚—带到”，保留原文连续、主动的应许语气；不照搬英语咨询层开头的“For”，因为希伯来文仅以连接词וְ起句，在本节中文中无需另加因果词。
