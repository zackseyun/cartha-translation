base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/034.yaml
  text: And the desolate land will be cultivated instead of being a desolation in the sight of all who pass by[a].
translation:
  language: zh_hans
  text: 那荒凉之地必被耕种，不再像从前那样，在所有过路人眼前是一片荒凉。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那荒凉之地必被耕种；它从前在所有过路人眼前是一片荒凉。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: 地
  rationale: 上下文所指是以色列的土地，而非全世界；“地”在本节中自然且准确。
- source_word: הַנְּשַׁמָּה
  choice: 荒凉
  rationale: 该被动分词作形容语，描述土地遭毁后荒废的状态；“荒凉”简洁保留这一状态。
- source_word: תֵּעָבֵד
  choice: 必被耕种
  rationale: עבד 的尼法勒式在此指土地被人耕作；被动表达保留原文语态，“耕种”明确呈现农业复兴的图景。
- source_word: תַּחַת אֲשֶׁר
  choice: 不再是
  rationale: 该结构将将来的耕种与从前的荒废相对照；中文以“不再是”自然表达状态的替换，同时脚注保留“从前却是”的另一种理解。
- source_word: הָיְתָה שְׁמָמָה
  choice: 是……一片荒场
  rationale: שְׁמָמָה 是名词；“一片荒场”保留其名词性质，并与前面的“荒凉”形成自然对照。
- source_word: לְעֵינֵי
  choice: 眼前
  rationale: 保留“在眼前”的具体视觉意象，也表达其荒废状态为公众所见。
- source_word: כָּל עוֹבֵר
  choice: 所有过路人
  rationale: 带 כָּל 的单数分词具有集合和泛指意义；“所有过路人”是自然、简明的现代汉语。
