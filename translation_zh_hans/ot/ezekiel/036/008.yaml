  text: וְ/אַתֶּ֞ם הָרֵ֤י יִשְׂרָאֵל֙ עַנְפְּ/כֶ֣ם תִּתֵּ֔נוּ וּ/פֶרְיְ/כֶ֥ם תִּשְׂא֖וּ לְ/עַמִּ֣/י יִשְׂרָאֵ֑ל כִּ֥י קֵרְב֖וּ לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/008.yaml
  text: But you[a], mountains of Israel, shall put forth your branches and bear your fruit for my people Israel, for they are about to come.
translation:
  language: zh_hans
  text: 但你们，以色列的群山哪，要长出枝条，为我子民以色列结出果实，因为他们快要来了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他们的来到近了。”
    reason: 保留 כִּי קֵרְבוּ לָבוֹא 可按“他们的来到近了”表达的替代句法，同时不在脚注中额外加入“归返”或“时候”的解释。
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: 以色列的群山
  rationale: 保留以西结书反复出现的地貌称呼和拟人化呼语；“群山”自然表达复数 הָרֵי。
- source_word: עַנְפְּכֶם תִּתֵּנוּ
  choice: 要长出枝条
  rationale: תִּתֵּנוּ 字面为“给出”，与“枝条”搭配时表示萌发、长出；此译符合现代汉语，同时保留农业意象。
- source_word: וּפֶרְיְכֶם תִּשְׂאוּ
  choice: 结出果实
  rationale: נָשָׂא 与“果实”连用表示承载、结出果实；“结出果实”是自然且贴合原文意象的汉语表达。
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: 为我的子民以色列
  rationale: לְ 表示受益对象；保留“我的子民”这一归属表达，并将“以色列”作为同位语理解。
- source_word: כִּי קֵרְבוּ לָבוֹא
  choice: 因为他们就要回来了
  rationale: קֵרְבוּ 与不定式 לָבוֹא 表达来临在即；结合流亡者返回土地的语境，用“就要回来”自然传达其紧迫性。“回来”比单纯“来”更清楚地表达百姓归返，但脚注保留另一种句法理解。
theological_decisions:
- issue: קֵרְבוּ לָבוֹא 的主语及表达方式
  choice: 将复数主语理解为紧邻的“我的子民以色列”，译作“他们就要回来了”
  alternative: 将其作较为非人称的时间表达：“他们归来的时候近了”
  rationale: 动词 קֵרְבוּ 为复数，最近且最自然的先行词是“我的子民以色列”；全段也在宣告土地将因被掳者即将归返而重新丰饶。不过，希伯来语结构也可在汉语中转述为“归来的时候近了”，故列入脚注以保留表达上的张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“以色列的群山哪”保留先知对土地的直接呼告；“长出枝条”和“结出果实”形成清晰平行。脚注标记置于所说明的末句之后。
