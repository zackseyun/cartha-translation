  yaml_path: translation/ot/ezekiel/036/009.yaml
  text: For behold[a], I am for you, and I will turn to you, and you will be cultivated and sown.
translation:
  language: zh_hans
  text: 因为，看哪，我眷顾你们[a]，必转向你们；你们将被耕作，也将被播种。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我向着你们。”希伯来语表达耶和华以恩惠转向这片土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明此前应许的根据；“因为”保留其因果连接作用。
- source_word: הִנְנִי
  choice: 看哪，我
  rationale: הִנְנִי 是引人注意的指示性表达；“看哪”保留先知话语的庄重和临场感，并与后面的第一人称陈述自然衔接。
- source_word: אֲלֵיכֶם
  choice: 眷顾你们
  rationale: 该介词短语在上下文中表示耶和华以恩惠转向以色列的群山和土地；“眷顾”在现代汉语中自然表达有利的关注，同时避免把空间方向误作单纯的移动。
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: 必转向你们
  rationale: 保留“转向”的原文意象，表达有利的关注与行动；“必”体现预告中的确定性，而不额外增加时态信息。
- source_word: וְנֶעֱבַדְתֶּם
  choice: 你们将被耕种
  rationale: עבד 的尼法勒形在此指土地被耕作；“被耕种”清楚保留农业语境和被动语态。
- source_word: וְנִזְרַעְתֶּם
  choice: 也将被撒种
  rationale: זרע 的尼法勒形意为土地被播种；“被撒种”直接保留被动农业意象，并与“被耕种”平行。
theological_decisions:
- issue: הִנְנִי אֲלֵיכֶם 所表达的神对土地的态度
  choice: 看哪，我眷顾你们
  alternative: 看哪，我向着你们／看哪，我帮助你们
  rationale: 上下文表明这是耶和华对以色列群山与土地的有利取向。“眷顾”表达恩惠性的关注，却不把原文扩展成更具体的盟约或救赎论断；脚注保留较贴近介词形式的译法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“看哪”保留先知宣告的肃穆语气；两个被动式保持土地作为受耕作、受播种对象的原文结构。代词“你们”承接上文对以色列群山的复数称呼。
