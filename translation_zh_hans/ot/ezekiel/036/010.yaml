  text: וְ/הִרְבֵּיתִ֤י עֲלֵי/כֶם֙ אָדָ֔ם כָּל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה וְ/נֹֽשְׁבוּ֙ הֶֽ/עָרִ֔ים וְ/הֶ/חֳרָב֖וֹת תִּבָּנֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/010.yaml
  text: And I will multiply people upon you—all the house of Israel[a], all of it. The cities will be inhabited[b], and the ruins will be rebuilt.
translation:
  language: zh_hans
  text: 我必使人丁在你们上面增多，就是以色列全家，全都如此。城邑必有人居住，废墟必被重建。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: 我必使……增多
  rationale: 这是 רבה 的使役形，表达“使之成为众多”；这一译法保留使役含义，又符合现代汉语。
- source_word: עֲלֵיכֶם
  choice: 你们上面
  rationale: 复数“你们”承接上下文中受呼告的以色列群山；“上面”保留人口遍布其上的空间意象。
- source_word: אָדָם
  choice: 人
  rationale: 此处 אָדָם 是集合用法，指居住在土地上的人口；汉语“人”自然且保留原词较宽泛的含义。
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: 以色列全家，所有的人
  rationale: 原文以 כָּל 和 כֻּלֹּה 双重强调整体性；译文保留重复强调，并按阴性代词所指的“家”理解为全体成员。
- source_word: וְנֹשְׁבוּ הֶעָרִים
  choice: 城邑必有人居住
  rationale: ישׁב 的被动形表示城邑重新处于有人居住的状态；这样表达比生硬的“被居住”更合乎现代汉语。
- source_word: וְהֶחֳרָבוֹת
  choice: 废墟
  rationale: חֳרָבוֹת 指遭毁坏、荒废之处；“废墟”简洁鲜明，并与下文重建相呼应。
- source_word: תִּבָּנֶינָה
  choice: 必被重建
  rationale: בנה 的被动形表示被建造；鉴于对象是已经毁坏之处，“重建”准确体现恢复语境。
theological_decisions:
- issue: 受话者及复兴应许所指
  choice: 保留对以色列群山／土地的直接呼告，以及人口、城邑和废墟得到具体恢复的图景。
  alternative: 将本节仅解释为脱离土地的属灵复兴。
  rationale: 直接语境以群山和土地为受话者，且使用人口、城邑、居住和重建等具体词汇；译文不将这些意象属灵化。
- issue: “以色列全家，所有的人”的范围与强调
  choice: 保留原文对以色列全家的双重整体性强调。
  alternative: 简化为“以色列全家”而省去第二重强调。
  rationale: כָּל 与 כֻּלֹּה 连用有意加强全体性；保留这一修辞力度，同时不额外界定其神学范围。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“城邑”保留先知书语体而不过分古奥；全节保持土地复兴的具体意象。
