id: EZK.36.26
reference: Ezekiel 36:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לָ/כֶם֙ לֵ֣ב חָדָ֔שׁ וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י אֶת לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשַׂרְ/כֶ֔ם וְ/נָתַתִּ֥י לָ/כֶ֖ם לֵ֥ב בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/026.yaml
  text: And I will give you a new heart[a], and I will put a new spirit within you; and I will remove the heart of stone from your flesh and give you a heart of flesh.
translation:
  language: zh_hans
  text: 我必赐给你们一颗新心，把一个新的灵[a]放在你们里面；我必从你们的肉体中除去石心，赐给你们肉心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “新的灵”也有人理解为“更新的灵”；另有人认为，这里的“灵”预示下一节所说神赐下自己的灵。
    reason: 保留“灵”的所指及“新”与“更新”之间的解释空间，不在正文中消除神学张力。
lexical_decisions:
- source_word: לֵב
  choice: 心
  rationale: “心”直接对应希伯来语的人论用法，涵盖思想、意志和内在倾向；译作“思想”或“内在自我”会过度限定其含义。
- source_word: חָדָשׁ / חֲדָשָׁה
  choice: 新
  rationale: 该形容词的基本义是“新的”；正文不译作“更新的”，以免加入原文未明说的解释。
- source_word: רוּחַ
  choice: 灵
  rationale: 在内在改变的语境中，“灵”最符合此处的含义；“风”或“气息”虽是该词在其他语境中的可能词义，却不适合本节。
- source_word: בְּקִרְבְּכֶם
  choice: 在你们里面
  rationale: 与“新心”和“新的灵”的内在转变意象相呼应，也保留复数受词；“在你们中间”会偏向群体空间意义。
- source_word: וַהֲסִרֹתִי
  choice: 我必……除去
  rationale: 准确表达使某物离开的含义，并与随后赐予新心的替换意象相配。
- source_word: לֵב הָאֶבֶן
  choice: 石心
  rationale: 以简洁而自然的现代汉语保留“石头之心”的具体比喻，且与“肉心”形成鲜明对应。
- source_word: מִבְּשַׂרְכֶם
  choice: 从你们的肉体中
  rationale: 保留בָּשָׂר“肉体”的具体身体意象；译作“身体”虽更顺口，却会减弱原文与“肉心”之间的词语联系。
- source_word: לֵב בָּשָׂר
  choice: 肉心
  rationale: 保留希伯来语与“石心”相对的具体比喻；“柔软的心”虽表达部分寓意，却把比喻直接解释掉了。
- source_word: וְנָתַתִּי ... אֶתֵּן ... וְנָתַתִּי
  choice: 赐给……放在……赐给
  rationale: 首尾用“赐给”体现神的赐予，中间配合“在你们里面”译为“放在”，符合现代汉语表达，同时保留同一动词的整体语义。
theological_decisions:
- issue: “新的灵”的所指
  choice: 正文以“新的灵”表达神所赐、被更新的人的内在之灵或倾向
  alternative: 直接理解为圣灵
  rationale: 本节中“新的灵”与“新心”平行，而下一节另明确说“我的灵”，因此正文不将两者直接等同；同时脚注保留它与下一节神之灵的赐予之间可能存在的预示关系。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。保留“石心／肉心”的具体对照及“肉体”的身体意象；“我必”呈现应许语气。脚注标记置于“新的灵”之后，使其与所注释的词直接对应。
