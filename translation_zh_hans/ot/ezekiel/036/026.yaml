  source_fidelity: 译文准确呈现希伯来文三个神主动施行的将来行动：赐下新心、将新的灵置于人里面、除去石心并赐下肉心。"从你们的肉体中"对应 מִבְּשַׂרְכֶם，保留了具体的身体性比喻；"石心／肉心"也忠实保留原文的对照。
  naturalness: 整体为庄重、清楚的现代标准普通话，符合先知应许的语体。“一颗新心”“把……放在你们里面”自然通顺；“石心／肉心”虽带有经文特有的凝练性，但在此比喻对照中明确且恰当。
  terminology: “心”恰当地保留 לֵב 所涵盖的内在思想、意志与倾向；“灵”对应 רוּחַ，未擅自具体化为圣灵。“新的灵”保留“新”的直义，脚注以审慎措辞说明“更新的灵”及与下一节“我的灵”的可能关联，没有把一种神学解释写入正文。脚注标记紧随所注词语，锚点正确。
