reference: Ezekiel 36:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/זְכַרְתֶּם֙ אֶת דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים וּ/מַעַלְלֵי/כֶ֖ם אֲשֶׁ֣ר לֹֽא טוֹבִ֑ים וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם עַ֚ל עֲוֺנֹ֣תֵי/כֶ֔ם וְ/עַ֖ל תּוֹעֲבֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/031.yaml
  text: Then you will remember your evil ways and your deeds that were not good[a], and you will loathe yourselves for your iniquities and your abominations.
translation:
  language: zh_hans
  text: 那时，你们必想起自己邪恶的道路和那些不好的行为，也必因自己的罪孽和可憎之事而厌恶自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厌恶自己”或译“在自己眼中厌恶自己”。
    reason: 保留בִּפְנֵיכֶם较为直译的词汇选择。
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  choice: 那时，你们必想起
  rationale: 该形式在上下文的先知性应许序列中指向将来；“那时”自然表达此事是神施行复兴之后的结果，“想起”保留词根的基本意义。
- source_word: דַּרְכֵיכֶם הָרָעִים
  choice: 自己邪恶的道路
  rationale: “道路”保留希伯来语以路径喻生活方式和品行的意象；“邪恶”准确传达其道德评价。
- source_word: וּמַעַלְלֵיכֶם אֲשֶׁר לֹא טוֹבִים
  choice: 和那些不好的行为
  rationale: מַעֲלָל译为“行为”，自然且具体；אֲשֶׁר לֹא טוֹבִים直译为“不好的”，不将原文强化成再次出现的“邪恶”。
- source_word: וּנְקֹטֹתֶם בִּפְנֵיכֶם
  choice: 厌恶自己
  rationale: 动词在此表达强烈的憎恶、嫌弃；与בִּפְנֵיכֶם合用时具有反身意义。“厌恶自己”在现代汉语中清楚而有力度。
- source_word: עַל עֲוֺנֹתֵיכֶם
  choice: 因自己的罪孽
  rationale: עַל在此自然表达原因；עָוֹן兼有罪行与罪责色彩，“罪孽”保留其道德和圣约语境中的分量。
- source_word: וְעַל תּוֹעֲבֹתֵיכֶם
  choice: 和可憎之事
  rationale: תּוֹעֵבָה指令人憎恶的事物或行为，常兼具礼仪与道德内涵；“可憎之事”语气庄重，又比名词化的“可憎恶”更符合现代汉语。
theological_decisions:
- issue: 复兴之后以色列人的回应性质
  choice: 译文呈现他们在神复兴工作之后忆起罪恶，并因此厌恶自己。
  alternative: 将其仅理解为心理上的懊悔，或直接扩展为一套完整的悔改教义。
  rationale: 本节描写记起过往罪恶及由此产生的自我厌恶；上下文表明这是神复兴工作的结果。译文保留这种神学关联，却不加入本节没有明说的后期教义术语。
- issue: בִּפְנֵיכֶם的表达
  choice: 正文按习语译作“厌恶自己”，脚注保留较贴近字面的“在自己眼中厌恶自己”。
  alternative: 仅译作“在自己眼中厌恶自己”。
  rationale: 前者符合现代汉语并传达反身含义；脚注让读者看见原文“在你们面前／眼中”的表达，避免掩盖词语层面的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“道路”保留圣经希伯来语的核心意象；“罪孽”和“可憎之事”保持道德与神学力度，同时避免生硬古奥。脚注标记置于全句末，所注内容对应“厌恶自己”。
