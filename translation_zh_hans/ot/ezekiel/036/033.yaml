base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/033.yaml
  text: 'Thus says the Lord GOD: On the day I cleanse you from all your iniquities[a], I will cause the cities to be inhabited[c][b], and the ruins will be rebuilt.'
translation:
  language: zh_hans
  text: 主雅威[a]如此说：“在我洁净你们、除去你们一切罪孽的那日，我必使各城有人居住，荒废之处也必被重建。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主雅威”对应希伯来语复合神圣称号 אֲדֹנָי יְהוִה；也可译作“主耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号中“主”与神名两个要素；“主耶和华”是现代中文读者熟悉且庄重的表达，并以脚注注明另一种音译。
- source_word: בְּיוֹם טַהֲרִי אֶתְכֶם
  choice: 我洁净你们……的那一天
  rationale: 保留בְּיוֹם的“在……那一天”结构，并将טהר的使之洁净之意译为自然的现代汉语“洁净”。
- source_word: מִכֹּל עֲוֹנוֹתֵיכֶם
  choice: 使你们脱离一切罪孽
  rationale: 介词מִן表达从罪孽中除去、分离；עָוֹן兼具罪恶与罪责的分量，“罪孽”较完整地保留其道德含义。
- source_word: וְהוֹשַׁבְתִּי אֶת הֶעָרִים
  choice: 我必使各城有人居住
  rationale: ישׁב的使役形表示使人居住或使城邑成为有人居住之地；此译保留使役意义，又符合汉语习惯。
- source_word: וְנִבְנוּ הֶחֳרָבוֹת
  choice: 废墟也必重建
  rationale: חֳרָבוֹת指遭毁坏、荒废之处；“废墟”简洁自然。נבנוּ为被动式，故译作“必重建”。
theological_decisions:
- issue: 复合称号אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文采用中文圣经传统中广为人知的形式，同时用脚注保留按学界常见方式音译神名的可能，避免把音译差异变成神学定论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我洁净你们……的那一天”保留原文时间表达；“使各城有人居住”明确呈现希伯来语使役语态，不额外指定居住者。
