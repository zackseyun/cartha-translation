- from: 所以，你要说预言，说：主耶和华如此说：因为，正因为他们使你们荒凉，从四面八方贪婪地扑向你们[a]，好叫你们成为列国余民的产业；你们也成了众人口中的话柄，遭到百姓毁谤[b]。
  to: 所以，你要传讲预言，说：主耶和华如此说：因为，正因为他们使你们荒凉，又从四面八方向你们张口[a]，好叫你们成为列国中其余的人的产业；你们成了人们舌头上的话题，遭受民众的毁谤[b]。
  rationale: 修订以原文的句法和语义范围为优先：保留双重因果、敌国取得产业的意图／结果，以及末句关于流言毁谤的并列意象。对词义有争议的שָׁאֹף采用较少限定的“向你们张口”，并以脚注呈现合理的词汇替代；同时提升现代普通话的流畅度，避免将“列国的余剩者”误读为专门神学术语。
