review_pass:
  verdict: revise
  source_fidelity: 原文以双重因果词יַעַן בְּיַעַן强调理由；“使你们荒凉”准确。שָׁאֹף词义困难，正文的“贪婪地扑向”虽可传达敌意，却把动作具体化，且“贪婪地”并非原文明确成分。改作“从四面八方向你们张口”保留其捕食性意象及词义的不确定性，并由脚注说明替代理解。לִשְׁאֵרִית הַגּוֹיִם宜译为“列国中其余的人”，避免“列国余民”在现代汉语中易被理解为以色列式的神学‘余民’。末句是两项并列的敌意言论，修订后更清楚地表达“成为谈论对象”及“遭受毁谤”。
  naturalness: “你要说预言，说”不够自然，改为“你要传讲预言，说”。“成了众人口中的话柄”可懂，但“话柄”常带可供取笑或攻击的语感，未必是原文习语唯一重点；“成了人们舌头上的话题”较贴近原文意象，也更自然。“遭到百姓毁谤”改为“遭受民众的毁谤”，使其与前项并列关系清楚。
  terminology: “主耶和华”忠实对应אֲדֹנָי יְהוִה，且符合现代中文圣经的庄重语域，可保留。“产业”适切表达מוֹרָשָׁה所指被占有的产业／遗产。“列国中其余的人”避免将שְׁאֵרִית神学化；“民众”对应עָם，在本处不强行限定为某一特定民族。
