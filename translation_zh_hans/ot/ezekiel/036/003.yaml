source:
  edition: WLC
  text: לָ/כֵן֙ הִנָּבֵ֣א וְ/אָמַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֣עַן בְּ/יַ֡עַן שַׁמּוֹת֩ וְ/שָׁאֹ֨ף אֶתְ/כֶ֜ם מִ/סָּבִ֗יב לִֽ/הְיוֹתְ/כֶ֤ם מֽוֹרָשָׁה֙ לִ/שְׁאֵרִ֣ית הַ/גּוֹיִ֔ם וַ/תֵּֽעֲל֛וּ עַל שְׂפַ֥ת לָשׁ֖וֹן וְ/דִבַּת עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/003.yaml
  text: 'Therefore prophesy and say[a], Thus says the Lord GOD: Because, indeed because they have made you desolate and have snapped at you from every side, so that you became a possession for the remnant of the nations, and you have come up on the lips of the tongue and in the slander of the people[b],'
translation:
  language: zh_hans
  text: 所以，你要传讲预言，说：主耶和华如此说：因为，正因为他们使你们荒凉，又从四面八方向你们张口[a]，好叫你们成为列国中其余的人的产业；你们成了人们舌头上的话题，遭受民众的毁谤[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向你们张口”所译的希伯来语动词含义较难确定，也可理解为“喘息着追赶”“觊觎”“企图吞下”或“张口攫取”；这里表达周围列国带有掠夺性的敌意。
    reason: lexical_alternative
  - marker: b
    text: “成了人们舌头上的话题”直译近于“上到舌头的唇边”，意思是成为人们议论的对象；“毁谤”所译的词也可指恶言、坏名声或诽谤性的传言。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出先知性的回应，符合现代汉语的自然推论表达。
- source_word: הִנָּבֵא וְאָמַרְתָּ
  choice: 你要说预言，说
  rationale: 保留命令式及随后“说”的双重结构，同时避免生硬的直译。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: “主”对应 אֲדֹנָי，“耶和华”采用现代中文圣经传统中对四字神名的常见音译。
- source_word: יַעַן בְּיַעַן
  choice: 因为，正因为
  rationale: 保留希伯来文重复因果表达的强调语气。
- source_word: שַׁמּוֹת
  choice: 使你们荒凉
  rationale: 对应使役性的荒废、毁坏之意，并适合本段所指的以色列众山。
- source_word: שָׁאֹף
  choice: 贪婪地扑向你们
  rationale: 该动词含义困难；此译兼顾喘求、吞噬或追逼等可能意象，表达周围列国掠夺性的敌意而不限定为实际吞食。
- source_word: מִסָּבִיב
  choice: 从四面八方
  rationale: 自然表达敌对行动来自周围各方。
- source_word: לִהְיוֹתְכֶם מוֹרָשָׁה
  choice: 好叫你们成为……的产业
  rationale: 保留目的或结果之间的开放性；“产业”体现被占有、承受为业的含义。
- source_word: לִשְׁאֵרִית הַגּוֹיִם
  choice: 列国余民
  rationale: 较形式地保留“列国的余剩者”，此处不把“余民”解释为特定神学群体。
- source_word: וַתֵּעֲלוּ עַל שְׂפַת לָשׁוֹן
  choice: 成了众人口中的话柄
  rationale: 以自然汉语传达字面“上到舌头的唇边”这一习语，即成为众人谈论的对象。
- source_word: וְדִבַּת עָם
  choice: 遭到百姓毁谤
  rationale: דִבָּה 可指恶言、谣言或毁谤；结合敌意语境，“毁谤”较为贴切。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”分别体现称号与专名，又符合简体中文读者熟悉的庄重圣经语域；不借此加入宗派性解释。
- issue: “列国余民”的身份
  choice: 保留为“列国余民”
  alternative: 其余各国；幸存的列国
  rationale: 原文 שְׁאֵרִית 可指剩余者，但本节并未要求将其神学化，也未明确只指灾后幸存者，因此保留其语义张力。
- issue: לִהְיוֹתְכֶם 的目的或结果关系
  choice: 好叫你们成为
  alternative: 以致你们成为
  rationale: 介词 לְ 加不定式可表达目的或结果；正文采用较贴近敌国意图的“好叫”，但不排除结果含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“你们”对应作为复数对象的以色列众山；保留“因为，正因为”的强调，以及“产业”“列国余民”等关键意象。
