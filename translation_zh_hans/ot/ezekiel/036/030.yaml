source:
  edition: WLC
  text: וְ/הִרְבֵּיתִי֙ אֶת פְּרִ֣י הָ/עֵ֔ץ וּ/תְנוּבַ֖ת הַ/שָּׂדֶ֑ה לְמַ֗עַן אֲ֠שֶׁר לֹ֣א תִקְח֥וּ ע֛וֹד חֶרְפַּ֥ת רָעָ֖ב בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/030.yaml
  text: And I will multiply the fruit of the tree and the produce of the field[a], so that you will no longer bear the reproach of famine among the nations.
translation:
  language: zh_hans
  text: 我必使树木的果子和田地的出产增多，使你们不再因饥荒而在列国中受辱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你们不再在列国中承受饥荒带来的羞辱。”
    reason: לקח 与 חֶרְפָּה 的搭配可较直译为“承受羞辱”；此译法也把“饥荒的羞辱”作为名词结构保留下来。
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: 我必使……增多
  rationale: 这是 רבה 的使役式完成时第一人称单数；在先知性的应许语境中表达上帝将来的作为。“使……增多”保留使役含义，也符合现代汉语。
- source_word: פְּרִי הָעֵץ
  choice: 树木的果子
  rationale: 原文“树”是集合性单数。汉语用“树木”自然表达这一集合意义，同时保留农业丰产的意象。
- source_word: וּתְנוּבַת הַשָּׂדֶה
  choice: 和田地的出产
  rationale: תְּנוּבָה 指土地的出产或收成；“田地的出产”准确、清楚，并与“树木的果子”构成自然对应。
- source_word: לְמַעַן אֲשֶׁר
  choice: 使
  rationale: 该组合引出目的或结果。“使”简洁自然，并保留农业增产与除去羞辱之间的目的—结果关系。
- source_word: לֹא תִקְחוּ עוֹד
  choice: 不再……受
  rationale: לקח 通常意为“拿、领受”，但与“羞辱”搭配时表示遭受或承受；“不再……受辱”是自然的汉语习语。
- source_word: חֶרְפַּת רָעָב
  choice: 因饥荒而……受辱
  rationale: 该结构指与饥荒相连、由饥荒招致的公开羞耻。“因饥荒而受辱”在汉语中自然，同时保留饥荒与羞辱的关联。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם 在此指周围各国或各族。“列国”符合先知文学语域；介词 בְּ 表明这羞辱发生在列国之中或列国面前。
theological_decisions:
- issue: 这项应许侧重农业繁荣，还是侧重在列国面前恢复尊荣
  choice: 同时保留两方面：上帝使果子和出产增多，从而除去以色列因饥荒在列国中所受的羞辱。
  alternative: 只理解为经济繁荣，或只理解为名誉与尊荣的恢复。
  rationale: 原文明确把农业增产与不再蒙受饥荒的羞辱联系起来，不应把其中任何一面消解掉。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“树木”和“田地”自然传达希伯来语集合性单数；“列国”保留《以西结书》的先知文学语感。
