reference: Ezekiel 36:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵן֙ הָרֵ֣י יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים וְ/לַ/גֵּאָי֗וֹת וְ/לֶ/חֳרָב֤וֹת הַ/שֹּֽׁמְמוֹת֙ וְ/לֶ/עָרִ֣ים הַ/נֶּעֱזָב֔וֹת אֲשֶׁ֨ר הָי֤וּ לְ/בַז֙ וּ/לְ/לַ֔עַג לִ/שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם אֲשֶׁ֥ר מִ/סָּבִֽיב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/004.yaml
  text: 'Therefore[a], mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys[b], to the desolate ruins and to the abandoned cities that have become plunder and mockery to the remnant of the nations that are all around:'
translation:
  language: zh_hans
  text: 所以，以色列的群山啊，要听主耶和华的话。主耶和华对山岭、丘陵、沟壑[a]、山谷、荒凉的废墟和被遗弃的城邑如此说：这些地方成了四周其余列国[b]掳掠和讥笑的对象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沟壑”或译“水道”、“河床”。
    reason: lexical_alternative
  - marker: b
    text: “其余列国”或译“列国的余民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接前文并引出结论；“所以”自然清楚，符合现代汉语先知宣告的语气。
- source_word: הָרֵי יִשְׂרָאֵל
  choice: 以色列的群山
  rationale: 保留对地貌的直接呼告及其拟人化表达。
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数祈使式；“要听”兼具命令语气和先知文体的庄重感。
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: 主耶和华的话
  rationale: “话”保留先知公式中的 דָּבָר；复合神名译为“主耶和华”，避免汉语中重复称“主”。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 采用传统而仍属现代可懂的先知使者公式。
- source_word: אֲפִיקִים
  choice: 沟壑
  rationale: 该词可指水道、河床或沟谷；在地貌并列中，“沟壑”自然且不过度限定是否常年有水。
- source_word: גֵּאָיוֹת
  choice: 山谷
  rationale: 与山岭、丘陵等地貌相配，使用普通读者易懂的广义表达。
- source_word: חֳרָבוֹת הַשֹּׁמְמוֹת
  choice: 荒凉的废墟
  rationale: 同时表达 חֳרָבוֹת 的废墟义和 הַשֹּׁמְמוֹת 的荒凉状态。
- source_word: עָרִים הַנֶּעֱזָבוֹת
  choice: 被弃的城邑
  rationale: 准确表达城市被遗弃的被动状态；“城邑”庄重而清楚。
- source_word: לְבַז וּלְלַעַג
  choice: 掳掠和讥笑的对象
  rationale: 希伯来语表示这些地方沦为可供掳掠之物并受人嘲弄；补出“对象”使中文搭配自然。
- source_word: שְׁאֵרִית הַגּוֹיִם אֲשֶׁר מִסָּבִיב
  choice: 四周其余列国
  rationale: שְׁאֵרִית 在此可指“余下的、其余的”，不必赋予救赎性“余民”含义；מִסָּבִיב 保留空间上的四周之意。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”在现代中文圣经语境中可辨识，并分别反映 אֲדֹנָי 与专名 יהוה；不把专名泛化为普通称号“上帝”。
- issue: שְׁאֵרִית 是否带有专门的“余民”神学含义
  choice: 其余列国
  alternative: 列国的余民
  rationale: 本节语境是在说周围剩余或其余的列国，并未明确赋予这一群体救赎性的余民身份，因此避免加入经文未要求的神学限定。
translation_notes:
  register: 采用现代、庄重、可朗读的先知文体。保留对“以色列的群山”的拟人化呼告，并用冒号引出神谕内容。所有脚注标记均置于正文对应位置。
