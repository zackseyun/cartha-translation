  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן אֹמְרִ֣ים לָ/כֶ֔ם אֹכֶ֥לֶת אָדָ֖ם אתי וּ/מְשַׁכֶּ֥לֶת גוי/ך הָיִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/013.yaml
  text: 'Thus says the Lord GOD: Because they say of you[b][a], ‘You devour people and have bereaved your nation,’'
translation:
  language: zh_hans
  text: 主耶和华如此说：因为人们议论你，说：“你吞吃人，又使你的国民丧子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה
  choice: 如此
  rationale: 这是先知宣告的惯用引语形式；“如此说”既贴近原文，也符合庄重的现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号的两个要素，并以现代中文圣经读者熟悉的形式表达。
- source_word: יַעַן
  choice: 因为
  rationale: 直接、自然地引出后续宣告的缘由。
- source_word: אֹמְרִים לָכֶם
  choice: 有人论到你说
  rationale: 介词 ל 在此语境表示针对这地而说；“论到你”比“对你”更符合这些话是在描述该地的事实。
- source_word: אֹכֶלֶת אָדָם
  choice: 你吞吃人
  rationale: אֹכֶלֶת 是阴性单数分词，与被拟人化的土地相应；אָדָם 在此为集合意义，中文“人”可自然涵盖众人，同时保留原文凝练而鲜明的意象。
- source_word: וּמְשַׁכֶּלֶת
  choice: 又使……丧子
  rationale: שׁכל 的使役形表达使人失去儿女、成为无子者；“使……丧子”保留这一具体而强烈的意义。
- source_word: גּוֹיִךְ
  choice: 你的国民
  rationale: גּוֹי 带有国家共同体的含义；“国民”既保留其群体和政治色彩，也适合土地作为阴性受话者的语境。
- source_word: הָיִית
  choice: （由整句谓语表达）
  rationale: 希伯来语句末的完成式系词与前面的分词共同构成对这地的既有评价；汉语用“你吞吃……又使……”自然表达，无需另译“你曾是”。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文基督教语境中庄重且广为理解，并明确保留称号与专名两个成分；不把二者简化为单一称谓。
- issue: 土地被拟人化为吞吃人并使国民丧子
  choice: 保留直接指控，不将其解释为具体灾害机制
  alternative: 你使居民死亡、使国民失去儿女
  rationale: 原文有意使用强烈的拟人化语言，没有说明究竟指战争、饥荒还是别的灾祸；直译可保存其神学张力和修辞力度。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。保留先知宣告的正式节奏与土地拟人化的强烈意象，同时避免生硬的欧化结构。
