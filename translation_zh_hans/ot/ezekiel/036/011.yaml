  text: וְ/הִרְבֵּיתִ֧י עֲלֵי/כֶ֛ם אָדָ֥ם וּ/בְהֵמָ֖ה וְ/רָב֣וּ וּ/פָר֑וּ וְ/הוֹשַׁבְתִּ֨י אֶתְ/כֶ֜ם כְּ/קַדְמֽוֹתֵי/כֶ֗ם וְ/הֵטִֽבֹתִי֙ מֵ/רִאשֹׁ֣תֵי/כֶ֔ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/011.yaml
  text: And I will multiply upon you man and beast[a], and they will multiply and be fruitful; and I will settle you as in your former times, and I will do better for you than at your beginnings[c][b]. Then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我必使人和牲畜在你们上面增多[a]；他们必增多、繁衍。我必使你们重新有人居住，像从前一样[b]；我必待你们比起初更好[c]。你们就知道我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人和牲畜”也可译作“人类和动物”。原文是先知书中常见的集合性配对，兼指人口和动物数量。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我必使你们居住”或“我必使你们重新定居”。原文为使役式；按上下文，“你们”指以色列众山，故可理解为使这些山地重新有人居住。
    reason: source_ambiguity
  - marker: c
    text: 直译：“我必待你们比起初更好。”也可译作“我必赐给你们比起初更多的福”。原文没有限定“好”的具体方面。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי עֲלֵיכֶם
  choice: 我必使你们上面的……增多
  rationale: הִרְבֵּיתִי 是 רבה 的使役式，表示“使增多”；עֲלֵיכֶם 直译为“在你们上面”，承接上下文中作为受话对象的以色列众山，因此保留空间意象。
- source_word: אָדָם וּבְהֵמָה
  choice: 人和牲畜
  rationale: אָדָם 在这里是集合名词，泛指人口；בְּהֵמָה 集合性地指动物，在土地复兴语境中特别适合译作“牲畜”。二者共同表达人口与畜群的恢复。
- source_word: וְרָבוּ וּפָרוּ
  choice: 他们必增多，繁衍兴旺
  rationale: רבה 表示数量增多，פרה 表示繁殖、结实；“繁衍兴旺”自然传达生育增长，并保留创造与盟约赐福用语的回响。
- source_word: וְהוֹשַׁבְתִּי אֶתְכֶם
  choice: 我必使你们重新有人居住
  rationale: ישב 的使役式可指使人居住、安置或使一地重新有人居住。因“你们”在上下文中指众山，“重新有人居住”比把山写成主动居住者更符合现代汉语，同时保留复兴含义。
- source_word: כְּקַדְמֹתֵיכֶם
  choice: 像从前一样
  rationale: קַדְמוֹת 指先前的时期或状态；“像从前一样”简洁自然，不把它限定为最初的某一时点。
- source_word: וְהֵטִבֹתִי מֵרִאשֹׁתֵיכֶם
  choice: 我必使你们的景况比起初更好
  rationale: יטב 的使役式表示使之良好或施予好处；比较介词 מִן 与 רִאשׁוֹת 构成“比先前/起初更好”。补出“景况”使中文通顺，但不限定福祉的具体形式。
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: 你们就知道我是耶和华
  rationale: 这是《以西结书》常见的认识公式；连接词在此自然表达结果，故译“就”。יהוה 译作通行的中文专名“耶和华”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文圣经读者最熟悉的专名“耶和华”，而非以“主”替代，从而保留其专名性质；“雅威”是较接近学术重建发音的可选译法。
- issue: וְהוֹשַׁבְתִּי אֶתְכֶם 的受词与居住含义
  choice: 我必使你们重新有人居住
  alternative: 我必安置你们／使你们居住
  rationale: 本章直接受话者是以色列众山，因此该表达可理解为使这些山地恢复有人居住。译文保留地理受话对象，避免把“你们”无提示地改成人民，也不排除使役动词所含的安置、复居意义。
- issue: 复兴后的福祉与先前状态的比较
  choice: 比起初更好
  alternative: 比先前更蒙福／我待你们比起初更好
  rationale: 原文只说使之更好或施予更多好处，没有具体界定物质、政治或属灵层面；译文保持宽泛，不将其系统化为某种特定末世论方案。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们”延续上下文对以色列众山的复数称呼；“你们上面”刻意保留希伯来文空间表达。用“重新有人居住”和“景况”作最低限度的汉语显化，以避免生硬，同时不消除原文的使役语义及福祉范围上的开放性。
