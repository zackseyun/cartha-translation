source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֲנִ֖י נָשָׂ֣אתִי אֶת יָדִ֑/י אִם לֹ֤א הַ/גּוֹיִם֙ אֲשֶׁ֣ר לָ/כֶ֣ם מִ/סָּבִ֔יב הֵ֖מָּה כְּלִמָּתָ֥/ם יִשָּֽׂאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/007.yaml
  text: 'Therefore thus says the Lord GOD: I have lifted up my hand in oath that surely the nations that are around you will bear their disgrace[a].'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：“我已经举手起誓[a]：你们周围的列国必担当自己的羞辱。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我举起了我的手”，这是起誓的惯用说法。
    reason: 说明希伯来语惯用语，并保留原文的身体动作意象。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神名的两个成分；“主耶和华”是现代中文圣经语体中清楚、庄重且易于辨认的表达。
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: 我已经举手起誓
  rationale: 原文直译为“我举起了我的手”，在此是起誓的惯用表达；译文兼顾原有意象和实际含义。
- source_word: אִם לֹא
  choice: 必
  rationale: 位于起誓公式之后，不是普通的条件句，而是加强所誓之事的确定性；中文用“必”自然传达其强调语气。
- source_word: הַגּוֹיִם אֲשֶׁר לָכֶם מִסָּבִיב
  choice: 你们周围的列国
  rationale: 准确表达邻近以色列、环绕其四境的外邦国家；“列国”符合先知书语境。
- source_word: כְּלִמָּתָם יִשָּׂאוּ
  choice: 担当自己的羞辱
  rationale: נשׂא表示承担、背负，כְּלִמָּה表示羞辱或耻辱；“自己的”明确反映第三人称复数所有后缀，并保留承担羞辱这一司法性、报应性的表达。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”保留称号与专名的区别，也符合庄重而通行的现代中文圣经表达；不把两个成分合并成单一称号。
- issue: 列国所承担之羞辱的归属
  choice: 自己的羞辱
  alternative: 羞辱
  rationale: 原文 כְּלִמָּתָם 明有第三人称复数所有后缀，故不省略其归属；译文不进一步解释羞辱的来源或具体性质，以保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“如此说”“列国”“担当”保持先知宣告的正式语气；句法简洁，不额外补入原文未明说的审判细节。
