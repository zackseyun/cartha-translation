  text: וָ/אָפִ֤יץ אֹתָ/ם֙ בַּ/גּוֹיִ֔ם וַ/יִּזָּר֖וּ בָּ/אֲרָצ֑וֹת כְּ/דַרְכָּ֥/ם וְ/כַ/עֲלִילוֹתָ֖/ם שְׁפַטְתִּֽי/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/019.yaml
  text: So I scattered them among the nations[a], and they were dispersed through the lands; I judged them according to their ways and according to their deeds.
translation:
  language: zh_hans
  text: 于是，我把他们分散在列国中；他们就散布在各地[a]。我照他们的行径和作为审判了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：他们分散在各国。
    reason: 对应וַיִּזָּרוּ בָּאֲרָצוֹת的词汇表达替代，保留英语审校轨迹所记录的“scattered through the countries”这一可能译法。
lexical_decisions:
- source_word: וָאָפִיץ
  choice: 我把他们分散
  rationale: 使役形明确表达上帝主动使他们分散；“分散”自然、准确，又不额外说明流亡的具体方式。
- source_word: בַּגּוֹיִם
  choice: 到列国中
  rationale: 这里指以色列人被放逐所到的外国民族或邦国；“列国”符合先知文学语体，也避免“外邦人”可能带入的后期关联。
- source_word: וַיִּזָּרוּ
  choice: 他们也散居
  rationale: 承接前句的被动结果，即他们因上帝使之分散而散布居住；“散居”避免机械重复“分散”，并适合流亡语境。
- source_word: בָּאֲרָצוֹת
  choice: 在各地
  rationale: 复数名词表示多个地域或国土；“各地”以现代汉语自然表达其分布性，不把含义限制为现代民族国家。
- source_word: כְּדַרְכָּם וְכַעֲלִילוֹתָם
  choice: 按他们的所作所为
  rationale: “道路”和“行为”在此共同指生活方式及实际行为。合译为“所作所为”简明自然，并保留道德评判色彩。
- source_word: שְׁפַטְתִּים
  choice: 我……审判了他们
  rationale: 保留שׁפט的司法性表达，不缩窄为仅仅“惩罚”；完成体以“了”表达已经施行的审判。
theological_decisions:
- issue: 流亡与上帝审判的关系
  choice: 明确由上帝使他们分散，并按其行为审判他们。
  alternative: 弱化上帝的主动性，只描述他们处于分散状态。
  rationale: 两个第一人称动词明确把分散和审判归于说话者上帝；译文保留这种神学陈述，但不进一步解释审判机制。
- issue: “道路”和“行为”之间的并列表达
  choice: 合译为“所作所为”。
  alternative: 直译为“道路和行为”。
  rationale: 两项在语义上重叠，共同概括其品行；现代汉语合译更自然，并未将审判依据缩减为单一行为类别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”保留先知书语感；“散居在各地”自然呈现分散的结果。原文在本节没有需要以脚注明示的实质歧义，因此不设脚注。
