base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/016.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知领受启示的固定表达“耶和华的话……临到”中，וַיְהִי 与介词 אֶל 共同表达神的话来到先知；“临到”准确、自然，也符合庄重的现代中文圣经语体。
- source_word: דְבַר
  choice: 话
  rationale: דָּבָר 在此指来自神的话语或信息。“话”既保留原文的基本词义，也无需在正文中解释性扩展为“信息”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文直接使用四字神名 יהוה；“耶和华”是现代汉语读者熟悉的专名形式，保留其作为以色列之神名字的功能，而不改译为称号。
- source_word: אֵלַי
  choice: 我
  rationale: 介词 אֶל 加第一人称单数后缀标明先知是话语所临到的对象；汉语“临到我”自然且准确。
- source_word: לֵאמֹר
  choice: 说
  rationale: לֵאמֹר 引出随后神谕的具体内容；“说”简洁保留这一引语衔接功能，句末用冒号承接下文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 正文保留原文的专有神名，不以“主”这一称号替代。“耶和华”在简体中文圣经传统和普通读者中辨识度最高；“雅威”是较接近学术重构读音的另一译法，但原始发音不能完全确定。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准汉语。“耶和华的话临到我”保留希伯来先知书的固定启示公式；“说：”承接下一节内容。
