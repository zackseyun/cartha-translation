  text: וְ/יָדְע֣וּ הַ/גּוֹיִ֗ם אֲשֶׁ֣ר יִֽשָּׁאֲרוּ֮ סְבִיבוֹתֵי/כֶם֒ כִּ֣י אֲנִ֣י יְהוָ֗ה בָּנִ֨יתִי֙ הַ/נֶּ֣הֱרָס֔וֹת נָטַ֖עְתִּי הַ/נְּשַׁמָּ֑ה אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/036.yaml
  text: Then the nations that remain around you will know that I[a], Yahweh, have rebuilt the ruined places and planted what was desolate. I, Yahweh, have spoken, and I will do it.
translation:
  language: zh_hans
  text: 那时，你们四围剩下的列国就会知道：是我——雅威——重建了被毁之处，栽种了荒废之地。我——雅威——已经说了，也必成就[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我——雅威——已经说了，也已经这样做了。”原文末一个动词在形式上是完成式；这里也可理解为以完成式强调雅威将要成就之事的确定性。
    reason: 保留希伯来语完成式在已成事实与确定将来之间的解释张力。
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 那时……就会知道
  rationale: 承接上文复兴的应许，表达随之而来的结果；“会知道”保留其将来指向。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 这里指以色列周围的各民族、各国；“列国”比带有后期宗教色彩的称呼更贴合上下文。
- source_word: אֲשֶׁר יִשָּׁאֲרוּ סְבִיבוֹתֵיכֶם
  choice: 你们四围剩下的
  rationale: 保留“被留下、仍存留”的含义，并明确复数第二人称所指的“你们”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译神的专名，而不以称号替代。
- source_word: בָּנִיתִי הַנֶּהֱרָסוֹת
  choice: 重建了被毁之处
  rationale: 动词本义为“建造”，但宾语是已经被拆毁之处，中文用“重建”自然地表达恢复之意。
- source_word: נָטַעְתִּי הַנְּשַׁמָּה
  choice: 栽种了荒废之地
  rationale: “栽种”紧贴动词本义；将单数集合性表达译为“荒废之地”，既自然又符合土地复兴的语境。
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: 已经说了，也必成就
  rationale: 前一完成式译作“已经说了”；后一完成式在先知性宣告中表达必然实现的行动，正文以“必成就”传达其确定的将来效力，同时用脚注保留形式上的另一种理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；“雅威”较直接地呈现其专名性质，不以称号“主”替代。
- issue: דִּבַּרְתִּי וְעָשִׂיתִי 中末一完成式的时态效力
  choice: 已经说了，也必成就
  alternative: 已经说了，也已经成就
  rationale: 末一动词在形态上是完成式，但在神谕公式及本段复兴应许中可表达将来成就的确定性。正文保留应许的指向，脚注说明形式上也可按已完成来译，避免掩盖原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“被毁之处”与“荒废之地”形成平行；末句用“必成就”传达神谕的确定性。脚注标记置于相关动词之后。
