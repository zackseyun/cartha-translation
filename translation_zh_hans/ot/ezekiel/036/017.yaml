source:
  edition: WLC
  text: בֶּן אָדָ֗ם בֵּ֤ית יִשְׂרָאֵל֙ יֹשְׁבִ֣ים עַל אַדְמָתָ֔/ם וַ/יְטַמְּא֣וּ אוֹתָ֔/הּ בְּ/דַרְכָּ֖/ם וּ/בַ/עֲלִֽילוֹתָ֑/ם כְּ/טֻמְאַת֙ הַ/נִּדָּ֔ה הָיְתָ֥ה דַרְכָּ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/017.yaml
  text: Son of man[a], when the house of Israel was dwelling on their own land, they defiled it by their way and by their deeds; their way before me was like the uncleanness of a menstruating woman.
translation:
  language: zh_hans
  text: “人子啊，以色列家住在自己的土地上时，以他们的行径和作为玷污了那地；他们在我面前的行径，就像妇人经期的不洁[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像月经期的不洁”，或“像月经所带来的不洁”。希伯来语把以色列的行径比作与月经相关的礼仪不洁。
    reason: 词义替代译法，并说明原文礼仪意象。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；保留希伯来语意象及全书的文学连贯性。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留该集体称谓所具有的宗族、盟约共同体色彩，而不泛化为“以色列人”。
- source_word: יֹשְׁבִים עַל אַדְמָתָם
  choice: 住在自己的土地上时
  rationale: 分词表达持续居住的背景；用“时”自然显明它与随后行动的时间关系，“自己的土地”则保留所有格和土地语境。
- source_word: וַיְטַמְּאוּ אוֹתָהּ
  choice: 玷污了那地
  rationale: “玷污”兼具礼仪与道德层面的不洁含义；“那地”明确代词所指。
- source_word: בְּדַרְכָּם
  choice: 以他们的行径
  rationale: “行径”保留“道路”所表达的行为方式这一隐喻性含义，也符合本句负面的道德语境。
- source_word: וּבַעֲלִילוֹתָם
  choice: 和作为
  rationale: “作为”自然表达具体行为，并与“行径”形成由行为方式到实际行动的搭配。
- source_word: כְּטֻמְאַת הַנִּדָּה
  choice: 就像妇人经期的不洁
  rationale: 明确保留月经所涉及的礼仪不洁意象，不将其弱化为笼统的“污秽”，同时避免暗示妇人的人格或道德本身不洁。
- source_word: הָיְתָה דַרְכָּם לְפָנָי
  choice: 他们在我面前的行径
  rationale: “在我面前”保留上帝临在、察看并评判其行为的关系性和审判意味。
theological_decisions:
- issue: 不洁意象的性质
  choice: 保留经期所关联的礼仪不洁，以此描述以色列在道德上玷污土地。
  alternative: 笼统译作“污秽”或“污染”，省略经期意象。
  rationale: 原文刻意采用礼仪不洁的比喻说明以色列的行为；译文应保存这一神学张力，不把它化约为一般性的厌恶用语，也不把经期本身说成道德过错。
- issue: 开头分词结构的时间关系
  choice: 译为“住在自己的土地上时”。
  alternative: 直译为“住在自己土地上的以色列家……”。
  rationale: 希伯来语分词为后续的玷污行为设置持续性的背景；中文补出“时”能自然表达该关系，而不额外限定其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“人子”“以色列家”“玷污”等措辞保留先知文学与礼仪语汇的色彩；脚注标记置于其实际说明的“不洁”意象之后。
