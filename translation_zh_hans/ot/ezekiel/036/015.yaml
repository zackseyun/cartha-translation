id: EZK.36.15
reference: Ezekiel 36:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹא אַשְׁמִ֨יעַ אֵלַ֤יִ/ךְ עוֹד֙ כְּלִמַּ֣ת הַ/גּוֹיִ֔ם וְ/חֶרְפַּ֥ת עַמִּ֖ים לֹ֣א תִשְׂאִי ע֑וֹד ו/גוי/ך לֹא תַכְשִׁ֣לִי ע֔וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/015.yaml
  text: And I will no longer let you hear the disgrace of the nations[a], and you will no longer bear the reproach of the peoples, and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: zh_hans
  text: 我不再让你听见列国的羞辱；你也不再承受万民的辱骂，不再使你的国民跌倒[a]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不再使你的国民败落”。另有一种解释传统译作“不再使你的国民丧子”。这里的希伯来辅音文本较难确定；马所拉读音支持“使……跌倒”。
    reason: 保留原文的文本与释义歧义，不在正文中静默消解。
lexical_decisions:
- source_word: אַשְׁמִיעַ
  choice: 让你听见
  rationale: 这是שׁמע的使役形，直指“使……听见”；结合上下文，用“让你听见”自然表达不再使所指对象听到列国羞辱的话。
- source_word: כְּלִמַּת
  choice: 羞辱
  rationale: 该词表示公开蒙受的羞耻、耻辱；“羞辱”既通顺，也适合列国讥诮的语境。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 这里指以色列周围的各国；“列国”保留先知文学的庄重语体，也避免引入后期“外邦人”的特定对照意味。
- source_word: חֶרְפַּת
  choice: 辱骂
  rationale: 该词可指凌辱、讥诮或责骂；译作“辱骂”能与前面的“羞辱”有所区别，并体现来自万民的言语攻击。
- source_word: עַמִּים
  choice: 万民
  rationale: 用“万民”保留其与前句גּוֹיִם“列国”的词汇区别，同时自然表达各族群体。
- source_word: תִשְׂאִי
  choice: 承受
  rationale: נשׂא在此为承担、忍受辱骂之意；“承受”符合现代汉语搭配。
- source_word: וְגוֹיִךְ
  choice: 你的国民
  rationale: 此处是带第二人称阴性单数后缀的单数גוי；所称呼者为这片地，故“你的国民”比生硬的“你的国”更清楚地表达其所属人民。
- source_word: תַכְשִׁלִי
  choice: 使……跌倒
  rationale: 按马所拉读音，这是כשל的使役形，通常表示“使跌倒”或“使失败”；正文保留这一形态所支持的读法，并在脚注交代文本难点。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知宣告公式；“宣告”庄重而清楚。אֲדֹנָי与יהוה并列时译作“主耶和华”，同时保留主权称号和专名。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名יהוה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时有אֲדֹנָי“主”和יהוה这一专名。正文采用现代中文读者较熟悉的“主耶和华”，不把两者合并为单一称号；“主雅威”则是较直接反映学界常用拟音的可选译法。
- issue: 土地使其国民“跌倒”的语义张力
  choice: 不再使你的国民跌倒
  alternative: 不再使你的国民丧子
  rationale: 马所拉读音支持כשל的使役形“使跌倒”，虽在土地与居民的关系中语义较为突兀，仍不在正文中擅自改成更顺畅的“使丧子”；另一解释传统在脚注中保留。
translation_notes:
  register: 采用现代、庄重而易懂的先知文学语体。以“列国／万民”和“羞辱／辱骂”分别对应原文两组近义词，避免完全抹平平行句中的词汇差异。第二人称阴性单数承接上下文中被拟人化的土地，中文不另加解释性主语。
