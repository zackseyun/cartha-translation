base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/021.yaml
  text: But I had pity for my holy name[a], which the house of Israel had profaned among the nations where they had gone.
translation:
  language: zh_hans
  text: 但我顾惜我的圣名[a]；以色列家在所到的列国中亵渎了这名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “顾惜”也可译作“怜惜”或“爱惜”。希伯来语动词可表示怜惜、顾惜或饶恕；这里的宾语是“我的圣名”，指主对自己圣名的关切。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶחְמֹל
  choice: 但我顾惜
  rationale: חמל可表示怜惜、顾惜或不加伤害；宾语在此是“我的圣名”，译为“顾惜”既保留原词的怜惜意味，也能自然表达耶和华维护其圣名的关切。连接词ו译为“但”，承接上文形成转折。
- source_word: עַל שֵׁם קָדְשִׁי
  choice: 我的圣名
  rationale: עַל与חמל连用，标明顾惜的对象；现代汉语中“顾惜我的圣名”无需另译介词。“我的圣名”准确保留以西结书中关于神之圣洁、身份与声誉的核心表达。
- source_word: אֲשֶׁר חִלְּלוּהוּ
  choice: 竟在那里亵渎了这名
  rationale: חלל的Piel词干指把圣洁之物当作凡俗、加以亵渎；“亵渎”保留本节与上下文的圣洁词汇。以“这名”明确关系代词及阳性单数宾语后缀所回指的“圣名”；“竟”自然传达行为与圣名之间的强烈反差，并未增加新的命题内容。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中反复出现的集体称谓，庄重且为现代中文读者所能理解。
- source_word: בַּגּוֹיִם אֲשֶׁר בָּאוּ שָׁמָּה
  choice: 到了列国中……在那里
  rationale: בוא与שמה直指他们所到之处；采用“到了列国中……在那里”保留空间关系，同时比生硬的“他们来到那里的列国”更符合现代汉语。גוים在流亡语境中译为“列国”。
theological_decisions:
- issue: 耶和华与“我的圣名”的关系在וָאֶחְמֹל中的含义
  choice: 译作“我顾惜我的圣名”，让圣名继续作为动词的直接关切对象。
  alternative: 可译“我怜惜我的圣名”或“我不容我的圣名受损”；也有人按语境理解为“我为我的圣名而顾惜”。
  rationale: 希伯来文明确以“我的圣名”为חמל所支配的对象，而36:20—23聚焦于耶和华在列国中使自己的圣名显为圣。“顾惜”既不把怜悯对象擅自改成以色列，也不把原文含蓄的习语完全解释成抽象的“维护声誉”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“顾惜”略带经典色彩，却仍属现行用语，并能保留希伯来原文的词义张力。分号与“在那里”使关系从句在中文中更清楚，避免误读为圣名本身到了列国。
