source:
  edition: WLC
  text: וָ/אֶשְׁפֹּ֤ךְ חֲמָתִ/י֙ עֲלֵי/הֶ֔ם עַל הַ/דָּ֖ם אֲשֶׁר שָׁפְכ֣וּ עַל הָ/אָ֑רֶץ וּ/בְ/גִלּוּלֵי/הֶ֖ם טִמְּאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/018.yaml
  text: So I poured out my wrath upon them for the blood that they had poured out on the land[a], and because they had defiled it with their idols.
translation:
  language: zh_hans
  text: 于是，我因他们在这地所流的血，也因他们用偶像[a]玷污了这地，就把我的烈怒倾倒在他们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来语带有强烈的鄙夷色彩，是以西结书常用的贬称。
    reason: 说明原词 גִּלּוּלִים 在正文“偶像”一词中不易完全体现的贬斥语气。
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: 就把……倾倒
  rationale: 该词是 שׁפךְ 的 Qal 连续式，描写把液体倒出，也常用于比喻上帝倾倒烈怒。“倾倒”在现代汉语中自然，并保留原文鲜明的意象。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: חֵמָה 在上帝施行审判的语境中指强烈、炽热的怒气。“烈怒”语体庄重，也符合本节的审判含义。
- source_word: עֲלֵיהֶם
  choice: 在他们身上
  rationale: 保留 עַל 所表达的方向和覆盖意象，与“倾倒”搭配自然。
- source_word: עַל הַדָּם אֲשֶׁר שָׁפְכוּ
  choice: 因他们……所流的血
  rationale: 这里的 עַל 表示审判的缘由；汉语习惯说“流血”或“所流的血”。原文两次使用 שׁפךְ，形成“倾倒烈怒”与“倾流鲜血”的呼应，但若在此直译为“倾倒的血”会显得生硬，因此优先采用自然而准确的表达。
- source_word: עַל הָאָרֶץ
  choice: 在这地
  rationale: 上下文所指是以色列之地，而非普世的“大地”。“这地”明确承接当前论述中的土地，并避免误解为全世界。
- source_word: וּבְגִלּוּלֵיהֶם
  choice: 也因他们用偶像[a]
  rationale: 介词 בְּ 可表达造成玷污的手段；连接词 וְ 与前一项并列。גִּלּוּלִים 是以西结常用、带强烈贬义的偶像称谓，正文采用清楚自然的“偶像”，贬斥色彩在脚注说明。
- source_word: טִמְּאוּהָ
  choice: 玷污了这地
  rationale: טמא 的 Piel 形式表示使之不洁或加以玷污；阴性单数后缀指向 הָאָרֶץ。“玷污”兼顾礼仪、道德与土地受污染的语义。
theological_decisions:
- issue: 上帝发怒与审判的性质
  choice: 译作“我的烈怒”，并明确列出流血与偶像崇拜所造成的玷污这两项审判缘由。
  alternative: 可译作“我的愤怒”或“我的震怒”。
  rationale: 本节把上帝的怒气置于针对流血和玷污土地的审判语境中；“烈怒”保留其强度，却不把经文解释成任意或失控的情绪。
- issue: הָאָרֶץ 的所指
  choice: 译作“这地”。
  alternative: 可译作“大地”或“土地”。
  rationale: 以西结书当前语境聚焦以色列之地及其被玷污，故采用地域性的译法，同时不在正文加入原文未明说的“以色列”。
- issue: 两个审判缘由的并列关系
  choice: 采用“因……也因……”的平行结构。
  alternative: 可把后半句处理为单纯的方式状语：“并用偶像玷污了这地”。
  rationale: 原文先以 עַל 引出所流之血，继而以 וּבְ 引出偶像所造成的玷污。汉语用“因……也因……”清楚呈现两方面根据，同时没有否认偶像是玷污土地的手段。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式以“因……也因……就……”呈现因果与并列关系；“这地”在前后两处重复，以清楚指明流血和玷污发生在同一片土地上。
