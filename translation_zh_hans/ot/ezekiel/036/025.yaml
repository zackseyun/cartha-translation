base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/025.yaml
  text: And I will sprinkle clean water on you[a], and you will be clean; from all your uncleannesses and from all your idols I will cleanse you.
translation:
  language: zh_hans
  text: 我必把洁净的水洒在你们身上，你们就必得洁净；我要洁净你们，使你们脱离一切污秽和一切偶像。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”原文是以西结常用的贬称，可能带有“粪偶像”的意味，刻意表达鄙弃。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַקְתִּי
  choice: 我必……洒
  rationale: זרק在礼仪洁净语境中表示把液体洒在对象身上；“洒”既自然，也符合本节的洁净意象。
- source_word: עֲלֵיכֶם
  choice: 在你们身上
  rationale: על与“洒”搭配，直译并自然表达水所及的对象。
- source_word: מַיִם טְהוֹרִים
  choice: 洁净的水
  rationale: טָהוֹר在此具有礼仪洁净的含义；“洁净的水”保留与后文טהר词根反复呼应的效果。
- source_word: וּטְהַרְתֶּם
  choice: 你们就洁净了
  rationale: 该形式描述洒水后产生的状态，与后面的第一人称使役性行动“我要洁净你们”有所区别。
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: 使你们脱离一切污秽
  rationale: 复数טֻמְאוֹת概括各种不洁、玷污状态；汉语以集合性的“一切污秽”表达更自然，同时保留广泛含义。
- source_word: וּמִכָּל גִּלּוּלֵיכֶם
  choice: 和一切偶像
  rationale: גִּלּוּלִים是以西结常用的蔑称，正文译作清楚自然的“偶像”，其刻意贬斥的语气在脚注说明。
- source_word: אֲטַהֵר אֶתְכֶם
  choice: 我要洁净你们
  rationale: Piel形式强调上帝主动使人洁净；此译也保留本节טהר词根的重复。
theological_decisions:
- issue: 洁净意象的性质
  choice: 保留礼仪与道德洁净兼具的语言，不在正文指定其圣礼机制。
  alternative: 将其限定为民族复兴的比喻，或在正文中直接解释为洗礼。
  rationale: 希伯来文本在复兴应许的语境中宣告上帝除去污秽与偶像；译文应保留其可供后续神学关联的开放性，而不把后来的特定教义读入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。用“我必”表达先知性应许的确定语气；以“洁净”贯穿同一希伯来词根的重复，并将不自然的复数“污秽之事”凝练为“一切污秽”。脚注标记置于“偶像”之后，使其明确对应受注词。
