base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/035.yaml
  text: And they will say, ‘This land that was desolate has become like the garden of Eden, and the cities that were ruined, desolate, and torn down are fortified and inhabited.’
translation:
  language: zh_hans
  text: 人们必说：“这片曾经荒凉的土地，如今已像伊甸园；那些曾经破败、荒凉、被拆毁的城邑，如今都有坚固的防御工事，也有人居住了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָרֶץ הַלֵּזוּ
  choice: 这片……土地
  rationale: הַלֵּזוּ带指示意味；“这片土地”符合现代汉语习惯，也保留所指地域的具体性。
- source_word: הַנְּשַׁמָּה
  choice: 荒凉
  rationale: 表示土地无人居住、荒芜的状态；译作“荒凉”自然，并与后文相关形容词形成呼应。
- source_word: כְּגַן עֵדֶן
  choice: 像伊甸园
  rationale: 直译比较结构，保留“伊甸园”这一专名及土地恢复繁盛的意象。
- source_word: הֶחֳרֵבוֹת וְהַנְּשַׁמּוֹת וְהַנֶּהֱרָסוֹת
  choice: 曾经荒废、凄凉、被拆毁
  rationale: 分别体现城邑遭破坏、陷于荒凉及被拆毁的三重描写，不将近义表达合并。
- source_word: בְּצוּרוֹת
  choice: 设防坚固
  rationale: 该词指城邑有防御工事、得到坚固防护；“设防坚固”比单说“坚固”更明确。
- source_word: יָשָׁבוּ
  choice: 有人居住了
  rationale: 此处指城邑重新成为有人居住之地；避免误解为居民执行“坐下”的动作。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“曾经……如今……”明确呈现荒凉与复兴的对照；保留三项并列的毁坏状态，同时使整句适合普通读者朗读和理解。
