base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/002.yaml
  text: 'Thus says the Lord GOD: Because the enemy said against you, ‘Aha!’ and, ‘The ancient heights have become our possession,’'
translation:
  language: zh_hans
  text: 主耶和华如此说：因为仇敌论到你们说：‘阿哈！那古老的高地已经成了我们的产业。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神名的传统而清晰的汉语表达，兼顾“主”的称号与专名。
- source_word: הָאוֹיֵב
  choice: 仇敌
  rationale: 原文为单数集合性称谓；汉语“仇敌”可自然涵盖敌对者整体，不必擅自改为复数。
- source_word: הֶאָח
  choice: 哈！
  rationale: 这是幸灾乐祸、得意的感叹；用简短感叹词保留其嘲弄语气。
- source_word: בָמוֹת עוֹלָם
  choice: 古老的高地
  rationale: במות指高处或高地；עולם在此结合土地语境宜表达久远、古老，而非必然指永恒。
- source_word: לְמוֹרָשָׁה הָיְתָה לָּנוּ
  choice: 已归我们为业了
  rationale: 准确表达土地成为可承受、占有之产业的含义，并保留敌人宣称既成事实的语气。
theological_decisions:
- issue: בָמוֹת是否应译作带有祭祀含义的“邱坛”
  choice: 高地
  alternative: 邱坛／高处
  rationale: 本节对象是以色列的山地，敌人宣称占有其疆土；不应无充分依据把该词限定为异教祭祀场所。
- issue: עוֹלָם的时间含义
  choice: 古老的
  alternative: 永远的／永久的
  rationale: 该词可表示久远的过去或无定限的时间；在修饰祖传山地的语境中，“古老的”较自然，也保留其悠久意味，避免导入形而上的永恒含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留先知宣告公式及仇敌直接引语的讥诮语气。
