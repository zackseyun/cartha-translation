source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר לְ/בֵֽית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֧א לְמַעַנְ/כֶ֛ם אֲנִ֥י עֹשֶׂ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל כִּ֤י אִם לְ/שֵׁם קָדְשִׁ/י֙ אֲשֶׁ֣ר חִלַּלְתֶּ֔ם בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אתֶם שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/022.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: It is not for your sake that I am acting, O house of Israel, but for my holy name[b], which you have profaned among the nations where you went.’'
translation:
  language: zh_hans
  text: 所以，你要对以色列家说：‘主耶和华如此说：以色列家啊，我这样做，不是为了你们，而是为了我的圣名；你们在所到的列国中亵渎了我的圣名。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出结论，符合现代汉语先知话语的自然表达。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 对以色列家
  rationale: 保留“家”所表达的整体、群体和盟约性称谓，不简化为“以色列”。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知传信公式，并以“主耶和华”分别体现 אֲדֹנָי 与神圣名号 יהוה，避免重复译作“主”。
- source_word: לֹא לְמַעַנְכֶם אֲנִי עֹשֶׂה
  choice: 我这样做，不是为了你们
  rationale: לְמַעַן 表示行动的缘由或所顾念的对象；“这样做”自然承接上下文所述的神圣行动，同时不擅自具体化。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 保留原文重复的直接呼语及其强调作用。
- source_word: כִּי אִם לְשֵׁם קָדְשִׁי
  choice: 而是为了我的圣名
  rationale: 准确呈现否定之后的强烈对比，并保留“圣名”的核心神学意象。
- source_word: אֲשֶׁר חִלַּלְתֶּם
  choice: 你们……亵渎了
  rationale: חלל 的 Piel 形式指把神圣之物当作俗物、使之受亵渎；“亵渎”在现代汉语中最能保留其宗教与伦理力度。
- source_word: בַּגּוֹיִם אֲשֶׁר בָּאתֶם שָׁם
  choice: 在所到的列国中
  rationale: 简洁表达“在你们来到那里的列国中”，保留流散至各国的空间含义。
theological_decisions:
- issue: 复兴行动的动机
  choice: 不是为了你们，而是为了我的圣名
  alternative: 不是因你们的缘故，乃是因我的圣名
  rationale: 保留神行动并非基于以色列功劳、而是关乎其圣名的鲜明张力，不加以缓和或扩展。
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”在简体中文圣经语域中清楚区分 אֲדֹנָי 和 יהוה，并保留原文的专名性质。
- issue: 圣名受亵渎的关系从句
  choice: 重复“我的圣名”作为宾语
  alternative: 而这名是你们……所亵渎的
  rationale: 汉语重复中心语更清楚，也准确表达关系代词 אֲשֶׁר 所指向的“我的圣名”，不改变责任归属。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“以色列家”的群体称谓和第二次出现时的呼语强调；句序略按自然汉语调整，但维持原文的否定—转折焦点。
