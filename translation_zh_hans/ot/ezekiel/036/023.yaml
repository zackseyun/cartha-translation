id: EZK.36.23
reference: Ezekiel 36:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֞י אֶת שְׁמִ֣/י הַ/גָּד֗וֹל הַֽ/מְחֻלָּל֙ בַּ/גּוֹיִ֔ם אֲשֶׁ֥ר חִלַּלְתֶּ֖ם בְּ/תוֹכָ֑/ם וְ/יָדְע֨וּ הַ/גּוֹיִ֜ם כִּי אֲנִ֣י יְהוָ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/הִקָּדְשִׁ֥/י בָ/כֶ֖ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/023.yaml
  text: I will sanctify my great name[a], which has been profaned among the nations, which you have profaned among them. Then the nations will know that I am Yahweh, declares the Lord GOD[b], when I show myself holy through you before their eyes.
translation:
  language: zh_hans
  text: 我要显明我伟大的名为圣[a]；这名在列国中被亵渎，就是你们在他们中间所亵渎的。当我借着你们[b]在他们眼前彰显为圣时，列国就会知道我是耶和华——这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使人承认我伟大之名的圣洁。”
    reason: 说明“显明……为圣”在这里指公开显明并维护神之名的圣洁，而不是使原本不圣洁的名变为圣洁。
  - marker: b
    text: “借着你们”也可译作“在你们中间”或“在你们身上”。
    reason: 希伯来语介词可表达工具、范围或关系；原文保留一定歧义。
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: 我要使……彰显为圣
  rationale: 此处的使役性表达不是说神的名原先不圣洁，而是指神要公开显明并维护其名的圣洁；“彰显为圣”兼顾希伯来语“分别为圣”的形式和本段公共彰显的语境。
- source_word: שְׁמִי הַגָּדוֹל
  choice: 我伟大的名
  rationale: 直接保留名词与形容词的结构，既表达神之名的尊荣，也保留其关乎身份与声誉的含义。
- source_word: הַמְחֻלָּל
  choice: 被亵渎
  rationale: חלל在此指把神圣之名当作俗物、损害其圣洁声誉；“亵渎”是现代汉语中准确而庄重的对应词。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גוים在以西结书中指以色列周围各民族；“列国”简洁、庄重，也不引入后期“犹太人／外邦人”的区分。
- source_word: אֲשֶׁר חִלַּלְתֶּם בְּתוֹכָם
  choice: 就是你们在他们中间所亵渎的
  rationale: 关系从句回指“这名”；“就是”清楚表明同一个名既在列国中被亵渎，也是以色列在他们中间所亵渎的。
- source_word: וְיָדְעוּ
  choice: 列国就会知道
  rationale: 连接词在此带出神行动的结果；“就”自然表达相继与结果，而不过度解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名音译，明确保留专名而非以“主”这一称号替代。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: נְאֻם是先知性宣告公式；中文用“宣告”自然庄重。“主耶和华”同时保留 אֲדֹנָי 的称号和 יהוה 的专名。
- source_word: בְּהִקָּדְשִׁי בָכֶם
  choice: 当我借着你们……彰显为圣时
  rationale: ב加不定式表示时间或情境；בָכֶם既可形式化译作“在你们中”，也可按语境理解为神借着对以色列的作为显明其圣洁。正文采用自然的工具性表达，脚注保留形式更贴近原文的译法。
- source_word: לְעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 保留原文公开、可见的意象，在现代汉语中也自然清楚。
theological_decisions:
- issue: 神使自己的名“为圣”的含义
  choice: 使我伟大的名彰显为圣
  alternative: 使我伟大的名成圣／使人承认我伟大之名的圣洁
  rationale: 原文并非暗示神的名本身缺少圣洁，而是说神要在列国面前公开显明其名为圣。所选译法避免“使之从不圣变为圣”的误解，同时保留 קדשׁ 的圣洁语义。
- issue: בְּהִקָּדְשִׁי בָכֶם 中介词 ב 的关系
  choice: 当我借着你们……彰显为圣时
  alternative: 当我在你们中间彰显为圣时／当我在你们身上被尊为圣时
  rationale: 希伯来语可有地点、关系或工具性的理解。上下文侧重神借着他对以色列的作为向列国显明圣洁，因此正文译“借着你们”；脚注保留较贴近形式的其他可能，避免抹平原文张力。
- issue: 重复神名与称号
  choice: 主耶和华宣告……我是耶和华
  alternative: 主上帝宣告……我是耶和华
  rationale: אֲדֹנָי יְהוִה 同时包含“主”的称号与神的专名。译作“主耶和华”保留两者，并与后文单独出现的 יהוה 对应。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“列国”“亵渎”“彰显为圣”保留先知文本的肃穆感，同时避免古奥句式。调整了希伯来语分句次序，将“主耶和华宣告”前置，使中文引语关系清楚。所有脚注标记均在正文出现。
