  text: וִ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֹֽתֵי/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/028.yaml
  text: You will dwell in the land that I gave to your fathers[a], and you will be my people, and I will be your God.
translation:
  language: zh_hans
  text: 你们必住在我赐给你们列祖[a]的地上；你们要作我的子民，我要作你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列祖”也可译作“祖先”。希伯来语字面为“父辈”，这里呼应赐地给列祖的圣约应许。
    reason: 说明词义替代及其圣约背景。
lexical_decisions:
- source_word: וִישַׁבְתֶּם
  choice: 你们必住
  rationale: ישׁב在此指居住、安居；置于先知性应许中表达将来，译作“必住”既自然，也保留应许的确定语气，而不额外强调定居过程。
- source_word: בָּאָרֶץ
  choice: 在……地上
  rationale: אֶרֶץ在这里是祖先应许中的特定土地；中文以“我赐给……的地上”自然表达其地理与圣约背景。
- source_word: אֲשֶׁר נָתַתִּי
  choice: 我赐给
  rationale: נָתַתִּי指已经完成的赐予。中文关系分句无需另加完成体标记；“赐给”符合上帝赐地的庄重语境。
- source_word: לַאֲבֹתֵיכֶם
  choice: 给你们列祖[a]
  rationale: אָבוֹת字面为“父辈”，在这里指承受应许的先祖。“列祖”保留男性祖辈及圣约应许的经文呼应；脚注说明现代汉语可译“祖先”。
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: 你们要作我的子民
  rationale: 这是典型的圣约公式。“作我的子民”是自然、庄重且具有经文共鸣的中文表达。
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: 我要作你们的上帝
  rationale: 按圣约公式译为自然中文。אָנֹכִי明确并略带强调第一人称；“我要”在对应句式中足以承载该重心，无须添加“我自己”。
theological_decisions:
- issue: 圣约公式的表达
  choice: “你们要作我的子民，我要作你们的上帝”
  alternative: “你们要归我作子民，我也要给你们作上帝”
  rationale: 所选译法忠实保留两句对称的圣约关系，又符合现代汉语习惯，不将关系进一步解释为归属过程或其他神学体系。
- issue: 祖辈称谓的性别与圣约背景
  choice: 正文采用“列祖”
  alternative: “祖先”
  rationale: 希伯来语明确使用阳性复数אָבוֹת，并呼应赐地给列祖的应许。“列祖”保留这一传统与文本联系；同时以脚注提供更通行的现代替代译法。
- issue: 应许语气
  choice: 首句用“必住”，后两句用“要作”
  alternative: 三句均用“将”或“必”
  rationale: 希伯来语三处在此都指向将来的应许。中文用“必住”突出返回并居住的确定性，用对称的“要作”自然呈现圣约公式，不改变其应许性质。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“列祖”略带经文语体，但在此有助于保留祖先应许的互文联系；分号呈现赐地应许与随后圣约公式之间的结构。
