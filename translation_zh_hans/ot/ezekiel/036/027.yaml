  text: וְ/אֶת רוּחִ֖/י אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וְ/עָשִׂ֗יתִי אֵ֤ת אֲשֶׁר בְּ/חֻקַּ/י֙ תֵּלֵ֔כוּ וּ/מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/027.yaml
  text: And I will put my Spirit within you[a], and I will cause you to walk in my statutes[b], and you will keep my judgments and do them.
translation:
  language: zh_hans
  text: 我要将我的灵放在你们里面，使你们照我的律例[a]行事；你们必谨守并实行我的典章[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律例”也可译作“规定”或“法令”。
    reason: lexical_alternative
  - marker: b
    text: “典章”也可译作“法令”或“规则”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: 我的灵
  rationale: 在赐新心、更新以色列的语境中，这里指上帝自己的灵，而不是“气息”或“风”。
- source_word: בְּקִרְבְּכֶם
  choice: 在你们里面
  rationale: 原文可指“在你们内部/中间”；结合上文的新心与新灵，这里侧重内在的更新，同时保留复数对象。
- source_word: וְעָשִׂיתִי אֵת אֲשֶׁר
  choice: 使你们……
  rationale: עָשָׂה通常意为“做、使成”，此处与后续分句连用，表达上帝促成百姓按其律例生活；译作“使”清楚呈现这一语义。
- source_word: בְּחֻקַּי תֵּלֵכוּ
  choice: 照我的律例行事
  rationale: “行走”在希伯来文中是生活与行为的盟约性隐喻；“照……行事”既保留行为方式的含义，也符合现代汉语表达。
- source_word: חֻקַּי
  choice: 我的律例
  rationale: חֹק/חֻקָּה指制定并要求遵守的规章；“律例”庄重而准确，并与后面的מִשְׁפָּטִים有所区别。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּט可指判决、法令或司法规范；在与חֻקִּים并列的律法语境中，“典章”保留其法律规范意味。
- source_word: תִּשְׁמְרוּ
  choice: 谨守
  rationale: שׁמר在律法语境中表示守护、遵守；“谨守”自然表达认真持守并遵从。
- source_word: וַעֲשִׂיתֶם
  choice: 并实行
  rationale: 末尾动词强调把所谨守的典章付诸行动；“实行”比单说“做”更清楚，又不增加额外解释。
theological_decisions:
- issue: 上帝的主动作为与人的顺服
  choice: 使你们照我的律例行事；你们必谨守并实行
  alternative: 我要促使你们照我的律例行事
  rationale: 原文把上帝的有效作为与百姓实际的顺服紧密相连。译文保留上帝主动促成顺服的力度，同时不借此裁定后世关于神人关系的宗派性争论。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“在你们里面”表达内在更新；“照……行事”自然传达希伯来文“行走”的生活行为隐喻。分号呈现上帝的作为与百姓顺服之间紧密而有层次的关系。脚注标记均紧跟所说明的词语。
