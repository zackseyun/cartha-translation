  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּב֗וֹא אֶל הַ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וַֽ/יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י בֶּ/אֱמֹ֤ר לָ/הֶם֙ עַם יְהוָ֣ה אֵ֔לֶּה וּ/מֵ/אַרְצ֖/וֹ יָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/020.yaml
  text: And when they came to the nations where they went[a], they profaned my holy name, in that people said of them, ‘These are the people of Yahweh[b], and yet they had to go out of his land.’
translation:
  language: zh_hans
  text: 他们到了所去的列国[a]，就亵渎了我的圣名；因为人们议论他们说[b]：“这些人是雅威的子民，却离开了他的土地。”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他们到了”：原文第一个动词在形式上是单数，可直译为“他／它到了”；但其后的相关动词，包括“到了那里”“亵渎了”和“出来了”，均为复数。这里按以色列这一集体来表达。
    reason: 语法形式
  - marker: b
    text: 原文形式上可直译为“有人对他们说”；按语境，这话是列国的人议论他们时所说。
    reason: 语义歧义
  - marker: c
    text: “却离开了”也可直译为“并且他们从他的土地出来了”。原文暗含流亡的羞辱，却没有明说是谁迫使他们离开。
    reason: 词义与语境
lexical_decisions:
- source_word: וַיָּבוֹא אֶל־הַגּוֹיִם אֲשֶׁר בָּאוּ שָׁם
  choice: 他们到了所去的列国
  rationale: 首个动词在形式上是第三人称阳性单数，但后面的“到了”和“亵渎”均为复数，语境中的集体主体是以色列。中文以复数“他们”表达集体含义较自然，同时用脚注保留形式上的单数现象。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 这里指以色列被分散所到的外国各族和国家；“列国”既符合以西结书的语域，也避免引入后期宗教分类意味较强的称呼。
- source_word: וַיְחַלְּלוּ
  choice: 就亵渎了
  rationale: חלל 的皮耶勒词干表示把神圣之物当作俗物、使之受亵渎；“亵渎”准确保留与神圣名号相对的宗教分量。
- source_word: שֵׁם קָדְשִׁי
  choice: 我的圣名
  rationale: 这是自然、庄重的现代汉语表达，也保留“名”所承载的身份、声誉和启示含义。
- source_word: בֶּאֱמֹר לָהֶם
  choice: 因为有人对他们说
  rationale: 介词 ב 加不定式可说明亵渎发生的情形或方式；לָהֶם 字面是“对他们”。中文用不定主语“有人”自然表达希伯来语未明说的说话者，并以脚注交代语境上也可理解为“谈到他们时说”。
- source_word: עַם יְהוָה אֵלֶּה
  choice: 这些人是雅威的子民
  rationale: 保留指示词“这些人”的强调和“子民”的盟约关系，并按项目规范将四字神名译作“雅威”。
- source_word: וּמֵאַרְצוֹ יָצָאוּ
  choice: 却离开了他的土地
  rationale: 原文只明说他们从他的土地出来，并未明确说是谁驱逐他们。“却”表达话语中因流亡而产生的反差和羞辱，但不把隐含施事者写进正文；脚注保留更直译的并列读法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，也使此处对上帝圣名的亵渎与引语中的盟约之名直接呼应。
- issue: 谁亵渎了上帝的圣名
  choice: 以复数“他们”为“亵渎”的主语，同时把列国之人的话写作亵渎发生的情形
  alternative: 把列国之人直接写成亵渎者
  rationale: 语法和上下文最自然地把“他们”指向流亡的以色列人，但亵渎又藉着人们议论或对他们说的话显明。译文不把这两个层面的责任合并为单一解释。
- issue: 离开土地是否明确为被驱逐
  choice: 译为“离开了”，不明说驱逐者
  alternative: “被赶出了”或“不得不离开”
  rationale: 流亡语境确实带有被迫和羞辱，但希伯来文使用主动动词“出来”，没有明说施事者。正文避免把隐含意义升级为明确陈述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亵渎”“圣名”“子民”保留经文的神学分量；句法尽量贴近希伯来文，同时通过脚注呈现单复数不一致、“对他们／谈到他们”以及并列词所含转折色彩等真实歧义。
