  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הִנָּבֵ֖א אֶל הָרֵ֣י יִשְׂרָאֵ֑ל וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/001.yaml
  text: And you[a], son of man, prophesy to the mountains of Israel, and say, ‘Mountains of Israel[c][b], hear the word of Yahweh.’
translation:
  language: zh_hans
  text: “至于你，人子[a]啊，要向以色列的群山[b]说预言。你要说：‘以色列的群山哪，要听雅威[c]的话。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”是《以西结书》中对先知反复使用的称呼；也可意译为“世人”或“必死的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“以色列山区”。原文直译为“以色列的群山”，正文保留群山被人格化、直接受呼唤的意象。
    reason: lexical_alternative
  - marker: c
    text: “雅威”音译希伯来文神名 YHWH；中文传统也常译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 连词与独立代词共同突出受命者；译作“至于你”既体现强调和话题转换，也符合现代汉语表达。
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中反复出现的称呼。保留固定语式有助于维持全书的文学连贯性，同时不把它在本处解释成基督论称号。
- source_word: הִנָּבֵא
  choice: 说预言
  rationale: 该词是先知受命的常用表达；“说预言”在现代汉语中清楚自然，并保留先知宣告的性质。
- source_word: אֶל
  choice: 向
  rationale: 本节表示说话所朝向的对象，即以色列的群山；经文本身没有明确要求译成敌对意味的“攻击”。
- source_word: הָרֵי יִשְׂרָאֵל
  choice: 以色列的群山
  rationale: 直译并保留群山被人格化、直接受呼唤的意象；“山区”虽可表达整体地貌，却会弱化这一修辞效果。
- source_word: וְאָמַרְתָּ
  choice: 你要说
  rationale: 承接前一命令，明确引出先知应当宣告的话；分成新句更符合自然现代汉语。
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 复数命令式呼唤被人格化的群山领受神谕；“要听”保留庄重的宣告语气。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: “话”保留先知书中“雅威的话”这一惯用神谕公式，也避免把原文过度释义为“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见中文音译呈现四字神名，保留其作为以色列之神专名的性质，而不是以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”，以音译保留专名性质；脚注说明中文传统中常见的另一音译，避免把某一种汉语形式当作没有争议的唯一读法。
- issue: 以西结书中 בֶן אָדָם 的译法
  choice: 人子
  alternative: 世人；必死的人
  rationale: “人子”保留本书反复出现的固定称呼及其文学联系。本处是对先知以西结的称呼，不在译文中额外赋予后世基督论含义。
- issue: 群山作为受话者
  choice: 保留人格化的直接呼语
  alternative: 解释为以色列山区的居民
  rationale: 原文两次明确说“以色列的群山”，并命令群山聆听。译文保留这种神学—诗性张力，不擅自把群山改成其居民。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于你”体现原文对受命者的强调；两个短句清楚呈现命令及其内容。保留“人子”“群山”和“雅威的话”等关键表达，以维持《以西结书》的重复结构、人格化意象和先知神谕语体。
