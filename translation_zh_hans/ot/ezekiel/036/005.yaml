source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֠א בְּ/אֵ֨שׁ קִנְאָתִ֥/י דִבַּ֛רְתִּי עַל שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם וְ/עַל אֱד֣וֹם כֻּלָּ֑/א אֲשֶׁ֣ר נָתְנֽוּ אֶת אַרְצִ֣/י לָ֠/הֶם לְ/מ֨וֹרָשָׁ֜ה בְּ/שִׂמְחַ֤ת כָּל לֵבָב֙ בִּ/שְׁאָ֣ט נֶ֔פֶשׁ לְמַ֥עַן מִגְרָשָׁ֖/הּ לָ/בַֽז־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/005.yaml
  text: 'Therefore thus says the Lord GOD: Surely in the fire of my jealousy I have spoken against the remnant of the nations and against all Edom[a], who gave my land to themselves as a possession with wholehearted joy and with contempt of soul[c][b], in order to make its pastureland plunder.'
translation:
  language: zh_hans
  text: 因此，主耶和华如此说：我指着我忌邪的烈火起誓，我已发言斥责其余的列国和整个以东；他们满心欢喜，心怀轻蔑，把我的地据为己有[a]，好掠夺那地的牧场[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把我的地归给自己作产业。”
    reason: מוֹרָשָׁה 可指产业、所有物；此译法更明显保留土地归属用语。
  - marker: b
    text: 原文末句含义较难确定；“牧场”也可译作“城外的空地”。整句也可能指为了使那地的牧场／空地成为掠物，或与使那地荒废、遭掠夺有关。
    reason: לְמַעַן מִגְרָשָׁהּ לָבַז 句法压缩，מִגְרָשׁ 的所指及其与 לָבַז 的关系存在真实歧义。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留“主”这一称号和耶和华的专名，采用现代中文圣经语体中清楚而庄重的表达。
- source_word: אִם לֹא
  choice: 我指着自己……起誓
  rationale: 此处是先知性誓言公式，并非普通条件句；中文显明其起誓语力，同时以“自己”承接随后第一人称的忌邪之火。
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: 自己忌邪的烈火
  rationale: 保留“火”的具体意象；“忌邪”表达神维护其独有权利、不能容忍敌对侵占的热忱，避免现代“嫉妒”可能产生的狭隘误解。
- source_word: דִבַּרְתִּי עַל
  choice: 我已经发言攻击
  rationale: 完成式译为带当前效力的“已经发言”，עַל 在敌对审判语境中译作“攻击”。
- source_word: שְׁאֵרִית הַגּוֹיִם
  choice: 列国中其余的人
  rationale: 此处 שְׁאֵרִית 可指剩余者或其余者；采用中性的“其余的人”，不赋予“余民”一词可能带有的正面神学意味。
- source_word: אֱדוֹם כֻּלָּהּ
  choice: 整个以东
  rationale: 自然表达该集合名词所指国家或地域的整体。
- source_word: נָתְנוּ אֶת אַרְצִי לָהֶם לְמוֹרָשָׁה
  choice: 把我的地据为己有
  rationale: 传达他们擅自将神的土地归给自己作产业的反身和侵占意味；脚注保留“产业”的词汇对应。
- source_word: בְּשִׂמְחַת כָּל לֵבָב
  choice: 满心欢喜
  rationale: 以自然现代中文表达“全心的喜乐”，并保留他们因侵占而欢喜的强烈情绪。
- source_word: בִּשְׁאָט נֶפֶשׁ
  choice: 心怀轻蔑
  rationale: שְׁאָט 表示轻蔑或藐视，נֶפֶשׁ 指内在生命或心志；“心怀轻蔑”兼顾两者且中文自然。
- source_word: לְמַעַן מִגְרָשָׁהּ לָבַז
  choice: 要使那地的牧场成为掠物
  rationale: 按名词 מִגְרָשׁ 的常见义译为城外空地或牧场，并把 לָבַז 理解为成为掠物；原文末句压缩且困难，故以脚注提示另一理解。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文明确包含四字神名；译作“耶和华”保留专名，与前面的主权称号“主”并列，不以普通称谓取代。
- issue: קִנְאָה 用于神时的译法
  choice: 忌邪
  alternative: 嫉妒／热忱
  rationale: “忌邪”既保留关系性的排他要求，也呈现审判性的热忱，且不把人的罪性嫉妒直接投射于神。
- issue: שְׁאֵרִית 是否译为带神学色彩的“余民”
  choice: 列国中其余的人
  alternative: 列国的余民
  rationale: 上下文指受审判的周边列国，并无肯定性的救赎余民含义；采用中性措辞以免增添原文未明说的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“主耶和华如此说”保留先知宣告格式；正文避免过度古雅的“藐视之心”等表达。誓言公式作有限度显化，但不补写誓言结果；困难的末句采取较形式对应的译法，并在脚注中保留歧义。
