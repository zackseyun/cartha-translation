  text: וְ/הוֹלַכְתִּי֩ עֲלֵי/כֶ֨ם אָדָ֜ם אֶת עַמִּ֤/י יִשְׂרָאֵל֙ וִֽ/ירֵשׁ֔וּ/ךָ וְ/הָיִ֥יתָ לָ/הֶ֖ם לְ/נַחֲלָ֑ה וְ/לֹא תוֹסִ֥ף ע֖וֹד לְ/שַׁכְּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/012.yaml
  text: And I will cause people—my people Israel—to walk upon you[a], and they will possess you, and you will be their inheritance[c][b], and you will no longer bereave them.
translation:
  language: zh_hans
  text: 我要使人，就是我的子民以色列，行走在你们之上[a]。他们必占有你[b]；你要成为他们的产业，不再使他们丧失儿女[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要把人，就是我的子民以色列，带到你们这里。”原文直译为“使人行走在你们之上”。
    reason: lexical_alternative
  - marker: b
    text: “占有”也可译作“承受你为业”；原文动词用于土地时兼有取得、占有和承受为业的含义。
    reason: lexical_alternative
  - marker: c
    text: 或译：“不再使他们失去孩子”或“不再使他们无儿无女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹלַכְתִּי עֲלֵיכֶם אָדָם
  choice: 我要使人……行走在你们之上
  rationale: הֹלִיךְ是הלך的使役形，保留“使……行走”的使役含义；אָדָם在此为集合用法，随后由“我的子民以色列”加以说明。山岭为复数受话者，故译“你们”。
- source_word: אֶת עַמִּי יִשְׂרָאֵל
  choice: 就是我的子民以色列
  rationale: 该短语具体说明前面的集合名词אָדָם所指何人；“就是”自然表达希伯来文中的同位解释关系。
- source_word: וִירֵשׁוּךָ
  choice: 他们必占有你
  rationale: ירשׁ用于土地时可指取得并占有，也可指承受为业；此处译“占有”，同时让下一分句的נַחֲלָה明确承载“产业”的用语。
- source_word: וְהָיִיתָ לָהֶם לְנַחֲלָה
  choice: 你要成为他们的产业
  rationale: נַחֲלָה常指所承受的产业；保留“产业”可呈现以色列与应许之地的关系，不简化为一般所有物。
- source_word: וְלֹא תוֹסִף עוֹד לְשַׁכְּלָם
  choice: 不再使他们丧失儿女
  rationale: שׁכל的强意形可指使人失去儿女或成为无子女者；“不再”自然表达תוסיף עוד所强调的不再发生。相较单译“使他们丧亲”，“丧失儿女”更清楚保留该动词在此处的具体含义。
theological_decisions:
- issue: 如何表达应许之地作为以色列产业的含义
  choice: 你要成为他们的产业
  alternative: 你要成为他们的所有物
  rationale: “产业”对应נַחֲלָה，保留承受土地为业的经文语义及其神学张力，而不把关系压缩为单纯所有权。
- issue: 土地使居民丧失儿女的拟人表达
  choice: 不再使他们丧失儿女
  alternative: 不再吞噬他们的居民
  rationale: 本节实际使用שׁכל而非“吞噬”，故保留土地被拟人化为使人丧失儿女的直接表达，不以邻近经文的措辞替代。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“你们”承接上下文中作为复数受话者的以色列众山；转为“你”则依照本节后半句对土地的阳性单数指称。用“就是”明确同位关系，用“产业”保留土地承受术语。
