source:
  edition: WLC
  text: כְּ/צֹ֣אן קָֽדָשִׁ֗ים כְּ/צֹ֤אן יְרוּשָׁלִַ֨ם֙ בְּ/מ֣וֹעֲדֶ֔י/הָ כֵּ֤ן תִּהְיֶ֨ינָה֙ הֶ/עָרִ֣ים הֶ/חֳרֵב֔וֹת מְלֵא֖וֹת צֹ֣אן אָדָ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/038.yaml
  text: Like the holy flock[a], like the flock of Jerusalem at her appointed feasts, so the ruined cities will be filled with flocks of people. Then they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 正如归为圣的羊群[a]，正如耶路撒冷在节期的羊群，荒废的城邑也必照样充满如羊群般的人[b]；他们就必知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “归为圣的羊群”也可译为“圣羊群”或“献祭的羊群”。这里结合耶路撒冷的节期，很可能指在节期聚集、归作祭祀之用的羊群。
    reason: 说明קָדָשִׁים在祭祀语境中的礼仪含义，并保留该词未明说“献祭”的语义幅度。
  - marker: b
    text: 原文这一不寻常短语字面为“人的羊群”。它描绘人数增多，如同节期耶路撒冷聚集的羊群一样。
    reason: 说明צֹאן אָדָם的字面形象及其比喻作用，避免将其误解为普通的“人群”。
lexical_decisions:
- source_word: כְּצֹאן קָדָשִׁים
  choice: 如同分别为圣的羊群
  rationale: צֹאן是集合名词，指羊群；קָדָשִׁים在耶路撒冷节期的祭祀语境中，最可能指归为圣、用作祭牲的羊。译作“分别为圣”既保留其礼仪含义，也避免把“圣洁”误解为道德品质。
- source_word: כְּצֹאן יְרוּשָׁלִַם בְּמוֹעֲדֶיהָ
  choice: 如同耶路撒冷在各节期的羊群
  rationale: מוֹעֵד在此礼仪语境中指规定的节期。中文用“在各节期”自然地表达复数及节庆场景；所属关系仍明确指向耶路撒冷。
- source_word: הֶעָרִים הֶחֳרֵבוֹת
  choice: 荒废的城邑
  rationale: חֳרֵבוֹת指遭毁坏后荒凉、无人居住的状态。“荒废”兼顾毁坏与荒凉，“城邑”符合先知书庄重语体。
- source_word: מְלֵאוֹת צֹאן אָדָם
  choice: 挤满羊群般的人
  rationale: 原文直译为“满了人的羊群”，把增多的人比作节期聚集的羊群。“羊群般的人”保留比喻，“挤满”则自然传达מְלֵאוֹת及数量众多的画面。
- source_word: וְיָדְעוּ
  choice: 他们就知道
  rationale: 连接词在此带出前述复兴所产生的结果；“就”比单纯的“并且”更自然地表现这一承接关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名作为以色列之神的专名，不以称号代替。
theological_decisions:
- issue: “圣羊群”的礼仪含义
  choice: 分别为圣的羊群
  alternative: 圣洁的羊群／献祭的羊群
  rationale: 上下文提到耶路撒冷的节期，明显带有祭祀背景；但原文没有明说“献祭”，所以正文保留较宽的“分别为圣”，并以脚注说明其很可能指祭牲。
- issue: צֹאן אָדָם中人与羊群的关系
  choice: 羊群般的人
  alternative: 人的羊群／成群的人
  rationale: 原文刻意保留“羊群”的祭祀与繁盛意象。译成“成群的人”较自然却会削弱意象，直译“人的羊群”又容易误解，因此采用明确而不失比喻的表达。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用神的专名，故正文以“雅威”音译，保留专名性质而不改为称号。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“城邑”保持先知书语体；“挤满羊群般的人”用较自然的中文保存希伯来文鲜明而略带张力的羊群比喻。
