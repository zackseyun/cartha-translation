  source_fidelity: 译文总体准确保留了两个比较结构、荒废城邑复兴、人与羊群的比喻，以及神名“雅威”。但“荒废的城邑也必这样挤满羊群般的人”在中文句法上不够顺畅；“这样”位置也使比较对应关系略显含混。改为“也必照样充满如羊群般的人”可更直接对应“如此……必满了人的羊群”。
  naturalness: “分别为圣的羊群”庄重且可理解；“挤满羊群般的人”略显生硬，尤其以“城邑”为主语时。采用“充满如羊群般的人”较符合现代汉语，同时保留原文刻意使用的羊群形象。
