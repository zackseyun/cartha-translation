  text: לֹ֧א לְמַעַנְ/כֶ֣ם אֲנִֽי עֹשֶׂ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה יִוָּדַ֖ע לָ/כֶ֑ם בּ֧וֹשׁוּ וְ/הִכָּלְמ֛וּ מִ/דַּרְכֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/032.yaml
  text: It is not for your sake that I am acting[a], declares the Lord GOD; let it be known to you. Be ashamed and humiliated because of your ways, O house of Israel.
translation:
  language: zh_hans
  text: 主耶和华宣告：我这样做，不是为了你们；你们要知道这一点。以色列家啊，要因你们所行的感到羞耻、蒙受羞辱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַנְכֶם
  choice: 为了你们
  rationale: לְמַעַן表示目的、缘故或利益；在否定句中，“不是为了你们”自然地保留原文所强调的：耶和华采取行动并非因以色列配得，也不以他们为最终根据。
- source_word: עֹשֶׂה
  choice: 我这样做
  rationale: עשה语义宽泛，可指“做、施行、行动”；“这样做”承接上文所述神的作为，同时符合现代汉语表达。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: נְאֻם是先知话语中庄重的宣告公式；“主耶和华”既区分אֲדֹנָי的尊称与יהוה的专名，也避免生硬重复。
- source_word: יִוָּדַע לָכֶם
  choice: 你们要知道这一点
  rationale: 该结构字面可作“要让你们知道/这要为你们所知”，具有被动或命令意味；汉语用“你们要知道这一点”清楚保留对以色列必须认清事实的强调。
- source_word: בֹּשׁוּ
  choice: 感到羞耻
  rationale: 该命令式要求以色列因自身行为而羞愧；“感到羞耻”在现代汉语中自然，并保留道德反省的力度。
- source_word: וְהִכָּלְמוּ
  choice: 蒙受羞辱
  rationale: כלם的尼法勒式表达受辱、蒙羞；此译与“感到羞耻”有所区分，同时保留两个近义命令并列加强的效果。
- source_word: מִדַּרְכֵיכֶם
  choice: 因你们所行的
  rationale: מן在羞耻类动词之后表示原因；דֶּרֶךְ在此指生活方式或行为，“所行的”比直译“道路”更清楚自然。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 保留集合性称呼和呼格语气；句末“啊”体现先知讲话的庄重直接。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 将אֲדֹנָי译为“主”，将יהוה译作中文圣经传统中广为人知的“耶和华”，既保留尊称与神名的区别，也不把二者合并成单一普通称号。
- issue: “不是为了你们”的神学张力
  choice: 保留原文直接否定，不增补“不是因为你们的功劳”等解释
  alternative: 不是因你们配得；不是为了你们的益处
  rationale: 原文否定לְמַעַנְכֶם，但没有在本节明确限定究竟是否定功劳、动机还是利益；正文保留其宽广而尖锐的表述，避免替原文消解张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保持先知宣告的直接语气，以分号和短句呈现原文的强调与命令。无脚注，因此正文不设脚注标记。
