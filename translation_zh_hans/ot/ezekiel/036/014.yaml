id: EZK.36.14
reference: Ezekiel 36:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן אָדָם֙ לֹא תֹ֣אכְלִי ע֔וֹד ו/גוי/ך לֹ֣א תכשלי ע֑וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/014.yaml
  text: Therefore you will no longer devour people[a], and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: zh_hans
  text: 所以，你必不再吞吃人，也必不再使你的国民跌倒[a]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按另一种读音或传统译作：“也必不再使你的国民丧失儿女。”
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出由此而来的应许；“所以”在现代汉语中自然、清楚地保留推论关系。
- source_word: אָדָם
  choice: 人
  rationale: 这里作集合性宾语，指人类或居民；译作“人”既简洁，也保留土地被拟人化为吞吃人的意象。
- source_word: תֹאכְלִי
  choice: 吞吃
  rationale: 字面义为“吃”，在土地吞噬居民的比喻中，“吞吃”既保留原有意象，又符合现代汉语表达。
- source_word: עוֹד
  choice: 不再
  rationale: 与否定词 לֹא 连用，表示从此停止某种情形；“不再”是自然且准确的汉语对应。
- source_word: וְגוֹיִךְ
  choice: 你的国民
  rationale: 名词在此为单数，阴性单数后缀指向被直接称呼的土地；“你的国民”保留其单数国家共同体及其居民的含义。
- source_word: תכשלי
  choice: 使你的国民跌倒
  rationale: 按所给辅音文本联系 כשל（跌倒、失足）理解，并依句法表达为土地使其国民跌倒；另一读音或文本传统所支持的“使……丧失儿女”收入脚注。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 是先知话语中标示神谕来源的固定表达；“宣告”庄重自然。אֲדֹנָי 译作“主”，יהוה 以中文圣经传统中明确的专名形式“耶和华”表达，二者均予保留。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时保留“主”这一称号和四字神名。译作“主耶和华”避免把神名泛化为普通称号，也采用普通中文读者熟悉的庄重表达。
- issue: 土地使国民“跌倒”还是“丧失儿女”
  choice: 正文采用“使你的国民跌倒”
  alternative: 使你的国民丧失儿女
  rationale: 所给辅音形式直接支持 כשל“跌倒”的理解，但另一种读音或传统与上下文中的丧子主题相符。为不消除真实的文本歧义，正文从所给辅音证据，另在脚注保留替代读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以第二人称阴性单数所指的土地为拟人化受话者；汉语不标语法性别，但通过“吞吃人”和“你的国民”维持这一修辞关系。平行分句均用“也必不再”，保留原文应许的力度和节奏。
