revisions:
- from: 主耶和华如此说：“为这事，我还要让以色列家求问我，好为他们成就：我要使他们人数增多，如同人群的羊群[a]。”
  to: 主耶和华如此说：“为这事，我还要让以色列家求问我，好让我为他们成就这事：我要使他们增多，如同人的羊群[a][b]。”
  rationale: 修订明确了“为他们做成”的内容，保留原文中神的应许与以色列向他求问之间的张力；并以“人的羊群”及脚注保留כַּצֹּאן אָדָם的异常措辞，避免把它误译为‘人群所属的羊群’或完全抹平为一般的‘许多人’。
