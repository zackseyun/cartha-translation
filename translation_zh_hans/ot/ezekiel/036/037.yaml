  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ע֗וֹד זֹ֛את אִדָּרֵ֥שׁ לְ/בֵֽית יִשְׂרָאֵ֖ל לַ/עֲשׂ֣וֹת לָ/הֶ֑ם אַרְבֶּ֥ה אֹתָ֛/ם כַּ/צֹּ֖אן אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/037.yaml
  text: 'Thus says the Lord GOD: Yet in this also I will let the house of Israel ask me to act for them: I will multiply them like a flock of men[a][b].'
translation:
  language: zh_hans
  text: 主耶和华如此说：“为这事，我还要让以色列家求问我，好让我为他们成就这事：我要使他们增多，如同人的羊群[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为这事，我还要被以色列家求问，好为他们成就这事。”
    reason: alternative_reading
  - marker: b
    text: “人的羊群”直译为“人之羊群”，是罕见的比喻说法，指人数众多，如同一大群羊；参见下一节。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号的两个成分；以“耶和华”呈现四字神名，避免译成不自然的“主主”。
- source_word: עוֹד זֹאת
  choice: 为这事，我还要
  rationale: “还”表达 עוֹד 的延续和附加意味，“为这事”则把 זֹאת 指向上文所应许的复兴之事。
- source_word: אִדָּרֵשׁ
  choice: 让以色列家求问我
  rationale: 该词为 דרש 的未完成式尼法勒形态，可指“被求问”或容许人前来求问；正文采用自然的使动式表达，同时以脚注保留较形式对应的译法。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来文带有群体和盟约色彩的固定称谓，而不简化为“以色列人”。
- source_word: לַעֲשׂוֹת לָהֶם
  choice: 好为他们成就
  rationale: לַעֲשׂוֹת לָהֶם 字面义较宽泛，即“为他们做”；结合 זֹאת 所指的应许，用“成就”自然表达神使此事实现，但不额外限定具体行动。
- source_word: אַרְבֶּה אֹתָם
  choice: 我要使他们人数增多
  rationale: 准确传达 רבה 的使役意义，并在现代汉语中明确这里所增加的是人口。
- source_word: כַּצֹּאן אָדָם
  choice: 如同人群的羊群
  rationale: 尽量保留原文把“羊群”与集合意义的“人”并置的特殊意象；脚注说明其含义，避免正文完全抹平这一措辞。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”既区分 אֲדֹנָי 与 יהוה，又沿用现代中文圣经读者熟悉的神名形式；不把神名悄然替换为称号。
- issue: אִדָּרֵשׁ 所体现的神之应许与以色列求问之间的关系
  choice: 我还要让以色列家求问我
  alternative: 我还要应允以色列家的求问
  rationale: 正文保留神已应许行动、同时仍让以色列家向他求问的张力，不把经文化约为单方面行动，也不暗示人的祈求支配神。
- issue: אָדָם 在 כַּצֹּאן אָדָם 中的集合意义
  choice: 人群
  alternative: 人
  rationale: 此处 אָדָם 虽为单数形式，却在比喻中泛指人类群体；“人群”在简体中文中能传达集合意义，又不把它限制为成年男性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“主耶和华”“以色列家”等经文体称谓；句法适度现代化，并用脚注解释原文罕见的“人的羊群”意象。
