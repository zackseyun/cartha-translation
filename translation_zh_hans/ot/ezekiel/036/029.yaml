base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/029.yaml
  text: I will save you from all your uncleannesses[a], and I will call for the grain and multiply it[b], and I will not bring famine upon you.
translation:
  language: zh_hans
  text: 我要拯救你们脱离一切污秽[a]；我要召来五谷[b]，使五谷丰盛，也不使饥荒临到你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “污秽”也可译作“不洁”或“玷污”。希伯来语的污秽用语可以同时涵盖礼仪和道德层面的不洁。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我要召唤五谷”。原文描绘上帝召唤五谷，强调他对农业丰收的主权。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: 我要拯救
  rationale: 使役形在此表示耶和华使百姓脱离污秽及其后果。“拯救”自然、庄重，也保留了神施行救助的神学分量，而不限定具体方式。
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: 脱离一切污秽
  rationale: טֻמְאָה 在以西结书中兼有礼仪和道德层面的含义。“污秽”保留这种范畴及其张力；汉语集合名词无需生硬表现希伯来语复数。
- source_word: וְקָרָאתִי אֶל הַדָּגָן
  choice: 我要召来五谷
  rationale: קרא אל 直译为“向……呼唤”，此处描绘神召唤粮食出产，彰显他对农业丰收的主权。“召来”既保留意象，又符合现代汉语。
- source_word: הַדָּגָן
  choice: 五谷
  rationale: דגן 泛指谷物、粮食作物，并非某一种特定作物。“五谷”在现代汉语中自然地表达各类谷物。
- source_word: וְהִרְבֵּיתִי אֹתוֹ
  choice: 使五谷丰盛
  rationale: רבה 的使役形意为使之增多或丰盛。重复“五谷”比使用可能指代不清的“它”更自然，也准确传达丰产之意。
- source_word: וְלֹא אֶתֵּן עֲלֵיכֶם רָעָב
  choice: 不再使饥荒临到你们
  rationale: נתן על 与“饥荒”连用，表示使饥荒加在某人身上。“使饥荒临到”清楚保留神的主动作​​用；“不再”符合应许语境，并自然表达对今后不再降灾的承诺。
theological_decisions:
- issue: 本节“拯救”的性质
  choice: 译作“拯救”，在上下文中首先指神使立约之民脱离污秽及其后果，同时保留更广泛的神学回响。
  alternative: 仅指从罪中得到属灵救恩；或仅指礼仪洁净。
  rationale: 以西结书36章把洁净、新心与新灵、土地复兴和农业赐福连在一起。译文不把含义局限于后来的教义范畴，也不将其压缩成单纯的礼仪概念。
- issue: 污秽的范畴
  choice: 保留“污秽”这一用语，不限定为道德或礼仪中的单一类别。
  alternative: 罪；不洁；玷污。
  rationale: 希伯来词在以西结书中可以涵盖礼仪和道德污染。保留“污秽”可维持原文有意留下的范围与张力。
- issue: 五谷丰盛与神的主权
  choice: 保留神“召来”五谷的拟人化图景。
  alternative: 仅意译为“赐下丰收”。
  rationale: 原文不仅应许丰产，也以召唤的语言表达神对土地出产的命令权；译文不将这一意象抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“召来五谷”保留希伯来文的召唤意象；“使五谷丰盛”避免代词歧义，并保持经文应许的节奏。所有脚注标记均已置于正文相应位置。
