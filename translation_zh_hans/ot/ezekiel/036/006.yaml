source:
  edition: WLC
  text: לָ/כֵ֕ן הִנָּבֵ֖א עַל אַדְמַ֣ת יִשְׂרָאֵ֑ל וְ/אָמַרְתָּ֡ לֶ/הָרִ֣ים וְ֠/לַ/גְּבָעוֹת לָ/אֲפִיקִ֨ים וְ/לַ/גֵּאָי֜וֹת כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י בְ/קִנְאָתִ֤/י וּ/בַ/חֲמָתִ/י֙ דִּבַּ֔רְתִּי יַ֛עַן כְּלִמַּ֥ת גּוֹיִ֖ם נְשָׂאתֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/006.yaml
  text: 'Therefore prophesy concerning the land of Israel, and say to the mountains and the hills, to the ravines and the valleys, ‘Thus says the Lord GOD: Look, I have spoken in my jealousy and in my wrath, because you have borne the disgrace of the nations.’'
translation:
  language: zh_hans
  text: 所以，你要向以色列的土地说预言，对群山、丘陵、沟壑和山谷说：‘主耶和华如此说：看哪，我在忌邪和烈怒中已经说了，因为你们承受了列国的羞辱。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: 以色列的土地
  rationale: אַדְמָה在这里指土地、国土；译作“土地”既贴近原文，也与随后拟人化受言的地貌相衔接。
- source_word: אֲפִיקִים
  choice: 溪谷
  rationale: 该词可指水道、河床或沟壑；此处与山岭地貌并列，采用较自然且能涵盖低洼水道地形的“溪谷”。
- source_word: גֵּאָיוֹת
  choice: 山谷
  rationale: 指谷地；与אֲפִיקִים并列时以“山谷”区别表达，保留原文的地貌列举。
- source_word: הִנְנִי
  choice: 看哪，我
  rationale: 保留引人注意并强调神亲自发言的语气，现代中文仍可理解且具有庄重感。
- source_word: קִנְאָתִי
  choice: 我的忌邪
  rationale: קִנְאָה可表示嫉妒、热忱或忌邪；在神为自己名誉及其土地发怒的语境中，“忌邪”较能表达盟约性的热忱，避免普通人际嫉妒的误解。
- source_word: כְּלִמַּת גּוֹיִם
  choice: 列国的羞辱
  rationale: 保留构造关系的歧义：既可理解为列国施加的羞辱，也可指来自列国的辱骂；不在正文中额外限定。
- source_word: נְשָׂאתֶם
  choice: 你们承受了
  rationale: 字面为“你们担当／背负”；这里土地及各地貌被拟人化为复数听者，“承受”自然表达其遭受羞辱。
theological_decisions:
- issue: 神的קִנְאָה如何表达
  choice: 忌邪
  alternative: 嫉妒／热忱
  rationale: “忌邪”保留神维护其名与所属之地的强烈、排他的热忱，同时避免将其化约为人的狭隘嫉妒。
- issue: 土地及地貌的拟人化复数称呼
  choice: 保留“你们”
  alternative: 改为单数“你”或明确解释为居民
  rationale: 动词נְשָׂאתֶם为阳性复数，直接呼应群山、丘陵、溪谷和山谷；保留拟人化，不将受言对象改释为居民。
- issue: 完成体דִּבַּרְתִּי的时态
  choice: 我……说话
  alternative: 我已经说了／我要说话
  rationale: 希伯来语完成体在宣告公式中强调言说的确定性；中文用“我……说话”随引语现场呈现，不强行解释为过去或将来。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“主耶和华如此说”沿用先知书常见宣告格式；保留“看哪”以传达הִנְנִי的强调语气。地貌词避免生僻术语，并保留土地被拟人化直接受言的诗性结构。
