  text: פַּאֲרֵ֤י פִשְׁתִּים֙ יִהְי֣וּ עַל רֹאשָׁ֔/ם וּ/מִכְנְסֵ֣י פִשְׁתִּ֔ים יִהְי֖וּ עַל מָתְנֵי/הֶ֑ם לֹ֥א יַחְגְּר֖וּ בַּ/יָּֽזַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/018.yaml
  text: Linen turbans shall be on their heads[a], and linen undergarments shall be on their loins; they shall not gird themselves with anything that causes sweat.
translation:
  language: zh_hans
  text: 他们头上要戴细麻布头巾，下身要穿细麻布内裤；不可束腰使人出汗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“不可束腰出汗”或“不可用汗束腰”。希伯来文表达简略；此处可能指不可穿戴或系束会使人出汗的衣物。
    reason: 保留末句的字面表达及其省略所造成的歧义，同时说明正文按上下文所作的自然表达。
lexical_decisions:
- source_word: פַּאֲרֵי
  choice: 头巾
  rationale: 此处指祭司戴在头上的礼仪服饰；“头巾”自然清楚，并与“戴在头上”的语境相配。
- source_word: פִשְׁתִּים
  choice: 细麻布
  rationale: 在衣着语境中指用亚麻制成的布料；“细麻布”符合圣经礼服用语，也保留本节两处重复。
- source_word: מִכְנְסֵי
  choice: 贴身裤
  rationale: 指祭司穿在下身、贴近身体的裤状内衣；“贴身裤”比古雅的“裤子/亵裤”更明确，也不把具体式样说得过细。
- source_word: מָתְנֵיהֶם
  choice: 腰间
  rationale: 希伯来语指腰胯部位；在中文衣着指示中，“腰间”自然且准确。
- source_word: יַחְגְּרוּ
  choice: 束上
  rationale: 该动词指把衣物或带子围腰束紧；“束上”保留了穿戴、系束的动作。
- source_word: בַּיָּזַע
  choice: 使身体出汗的衣物
  rationale: 原文直译近于“以汗束身”，表达简略。正文传达最可能的实际含义，即不可束上会导致出汗的衣物，同时用脚注保留原文的省略与歧义。
theological_decisions:
- issue: 祭司服装禁令及其隐含理由
  choice: 将末句译为不可束上使身体出汗的衣物
  alternative: 较直译为“不可带着汗束腰”；或明确解释为禁止羊毛腰带或羊毛衣物
  rationale: 希伯来文简短而有所省略，上下文强调供职时穿细麻布衣物。译文表达避免出汗的实际禁令，却不把原文没有明说的材料限定为羊毛。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“细麻布”延续礼仪服装语域；“贴身裤”清楚说明衣物功能而不过度限定式样。脚注标记置于其实际解释的末句之后。
