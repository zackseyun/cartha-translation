base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/027.yaml
  text: And on the day he enters the sanctuary[a], into the inner court, to minister in the sanctuary, he shall present his sin offering, declares the Lord GOD.
translation:
  language: zh_hans
  text: 在他进入圣所、进入内院，在圣所供职的那一天，他要献上自己的赎罪祭[a]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“自己的洁净祭”。希伯来语 חַטָּאת 在献祭语境中可指为罪或为洁净而献的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם בֹּאוֹ
  choice: 到他……的那一天
  rationale: 介词 בְ 与“日子”构成时间表达，后接带代词后缀的不定词“他进入”；译成现代汉语的“到他……的那一天”，既保留特定时间点，也使句法自然。
- source_word: אֶל־הַקֹּדֶשׁ
  choice: 进入圣所
  rationale: קֹדֶשׁ 在此指神圣的祭祀区域；“圣所”保留其空间和礼仪含义，同时不把它过度限定为某一特定房间。
- source_word: אֶל־הֶחָצֵר הַפְּנִימִית
  choice: 进内院
  rationale: 第二个 אֶל 进一步说明进入的地点；“进内院”自然表达向内院移动，并保留与前一短语的并列说明关系。
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: 在圣所供职
  rationale: שׁרת 在祭司礼仪语境中指履行圣职；“供职”比一般的“服事”更明确体现祭司职务，同时保留重复出现的“圣所”。
- source_word: יַקְרִיב חַטָּאתוֹ
  choice: 献上自己的赎罪祭
  rationale: יקרב 的使役形在献祭语境中表示呈献祭物；חַטָּאתוֹ 在此必指祭物，而非抽象的“罪”。“赎罪祭”是现代中文读者熟悉的祭名，所有格后缀以“自己的”表达。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 是庄严的神谕宣告公式；独立成句可保持其郑重语气。אֲדֹנָי יְהוִה 采用中文圣经语域中通行且自然的“主耶和华”，并避免生硬重复为“主主”。
theological_decisions:
- issue: חַטָּאת 在献祭语境中的功能性译名
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词既与罪有关，也可强调礼仪上的洁净。正文采用读者较熟悉的“赎罪祭”，但不把其功能仅限于代赎；脚注保留“洁净祭”这一有充分词义依据的译法。
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时含“主”这一称号和四字神名。正文采用现代中文圣经语境中广为人知的传统表达；“主雅威”能更直接音译神名，但在普通现代中文中较不通行。此选择不改变原文所指的神圣专名。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文“圣所”的重复，以呈现祭司进入并供职的礼仪重点；将神谕公式另起一句，使宣告语气鲜明。脚注标记置于实际存在词义差异的“赎罪祭”之后。
