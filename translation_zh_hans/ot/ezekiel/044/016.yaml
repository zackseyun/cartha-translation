- from: 他们要进入我的圣所；他们要近前来到我的桌前[a]，侍奉我，并履行我所交付的职守。
  to: 他们要进入我的圣所；他们要近前到我的桌子旁[a]，侍奉我，并谨守我所托付的职责。
  rationale: 修订“近前来到我的桌前”为“近前到我的桌子旁”，消除重复，并更准确保留原文祭司近前到神之桌子服事的方向性；“桌子”保留שֻׁלְחָן的字面用词，脚注说明其可能的礼仪性所指。末句以“谨守我所托付的职责”对应“守我的职守/charge”，在现代汉语中自然且保留祭司责任的庄重语域。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:53:17Z'
