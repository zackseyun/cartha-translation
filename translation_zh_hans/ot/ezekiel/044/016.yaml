base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/016.yaml
  text: They themselves shall enter my sanctuary[a], and they themselves shall come near to my table to minister to me, and they shall keep my charge.
translation:
  language: zh_hans
  text: 他们要进入我的圣所；他们要近前到我的桌子旁[a]，侍奉我，并谨守我所托付的职责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的祭坛”或“我的祭坛桌”；这里的“桌子”用于圣殿服事的语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: 他们要……；他们要……
  rationale: 希伯来文两次使用独立代词，带有强调意味。汉语若两次译作“他们自己”会显得生硬，因此以重复主语“他们”来体现强调和专属意味。
- source_word: יָבֹאוּ אֶל מִקְדָּשִׁי
  choice: 要进入我的圣所
  rationale: יָבֹאוּ 与 אֶל מִקְדָּשִׁי 连用，表示进入圣所；“圣所”准确而自然地表达 מִקְדָּשׁ。
- source_word: יִקְרְבוּ
  choice: 要近前来到
  rationale: 保留该动词在祭司礼仪语境中“接近、近前”的意味，同时符合现代汉语表达。
- source_word: שֻׁלְחָנִי
  choice: 我的桌前
  rationale: שֻׁלְחָן 的字面意义是“桌子”。这里虽处于圣殿礼仪语境，可能指祭坛或供桌，但正文不把其具体所指限定得超过原文。
- source_word: לְשָׁרְתֵנִי
  choice: 侍奉我
  rationale: שרת 在祭司语境中指神圣职事；“侍奉我”既保留礼仪色彩，也表达服事的对象是上帝。
- source_word: וְשָׁמְרוּ אֶת מִשְׁמַרְתִּי
  choice: 并履行我所交付的职守
  rationale: שׁמר 与 מִשְׁמֶרֶת 构成惯用搭配，指恪守或履行受托职责。“履行我所交付的职守”在现代汉语中清楚表达祭司受命承担的责任。
theological_decisions:
- issue: 圣殿服事语境中 שֻׁלְחָנִי 的具体所指
  choice: 我的桌前
  alternative: 我的祭坛前；我的供桌前
  rationale: 原词字面为“我的桌子”，但在献祭和圣殿服事语境中可能转指祭坛或献供物的桌子。正文保留较为直译的表达，脚注列出语境性解释，避免替原文消除其真实歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“近前来到”保留祭司接近圣物服事的礼仪意味；末句避免生硬直译为“看守我的看守之职”，改用普通读者易懂的“履行我所交付的职守”。
