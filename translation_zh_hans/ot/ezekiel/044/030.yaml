  text: וְ/רֵאשִׁית֩ כָּל בִּכּ֨וּרֵי כֹ֜ל וְ/כָל תְּר֣וּמַת כֹּ֗ל מִ/כֹּל֙ תְּרוּמ֣וֹתֵי/כֶ֔ם לַ/כֹּהֲנִ֖ים יִֽהְיֶ֑ה וְ/רֵאשִׁ֤ית עֲרִסֽוֹתֵי/כֶם֙ תִּתְּנ֣וּ לַ/כֹּהֵ֔ן לְ/הָנִ֥יחַ בְּרָכָ֖ה אֶל בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/030.yaml
  text: And the first of all the firstfruits of everything[a], and every contribution from all your contributions, shall belong to the priests. You shall give the first of your dough to the priest[c][b], to cause a blessing to rest on your house.
translation:
  language: zh_hans
  text: 一切初熟之物的首份，以及你们一切奉献中所分别出来的每一份，都要归给祭司。你们要把你们面团的头一份给祭司[a]，使福分停留在你家[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们面团的头一份”也可译作“你们每批揉好的面团的第一份”；原词可指面团，也可借指揉制的一批面。
    reason: lexical_alternative
  - marker: b
    text: “你家”也可理解为“你的家人”或“你的家室”；原文说福分得以停留在你的家上，未说明福分的具体形式。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית כָּל בִּכּוּרֵי כֹל
  choice: 一切初熟之物中最先献上的
  rationale: 保留 רֵאשִׁית 与 בִּכּוּרֵי 的层叠表达：前者是最先或首份，后者是初熟之物；同时避免生硬重复。
- source_word: תְּרוּמַת / תְּרוּמוֹתֵיכֶם
  choice: 分别献上的／奉献礼
  rationale: 该词指从所有物中分别出来作神圣用途的份额。译文既表达奉献，也保留“从……中取出一份”的希伯来语结构。
- source_word: לַכֹּהֲנִים יִהְיֶה
  choice: 都要归给祭司
  rationale: 自然表达归属与法定分配的语气；希伯来语为复数“祭司”。
- source_word: עֲרִסוֹתֵיכֶם
  choice: 你们初揉之面团
  rationale: 在献祭语境中，该词最可能指所揉的面团或一批面团，而非字面上的揉面盆。
- source_word: תִּתְּנוּ לַכֹּהֵן
  choice: 献给祭司
  rationale: 保留第二人称复数命令及单数、具有代表性的“祭司”；“献给”符合圣物奉献语境。
- source_word: לְהָנִיחַ בְּרָכָה אֶל בֵּיתֶךָ
  choice: 好使福分临到你家，安居其中
  rationale: 兼顾 נוח 使之停驻、安歇的意象及 אֶל 的趋向性；“家”也可涵盖家庭或家室。
theological_decisions:
- issue: 福分的性质
  choice: 笼统译作“福分”，不限定其具体形式
  alternative: 物质兴旺，或专指盟约性的属灵恩惠
  rationale: 原文只说福分停驻于家，并未说明是财富、健康或纯属灵恩惠，因此保留其广度。
- issue: 奉献与福分之间的关系
  choice: 译作目的或预期结果“好使”
  alternative: 译成机械性的因果保证
  rationale: לְ 加不定式表达目的或结果；译文不把本节扩展成脱离圣殿律例语境的普遍交易公式。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“初熟之物”“祭司”“福分”等沿用普通中文圣经读者熟悉的词汇；主文中的[a]、[b]均有对应脚注。
