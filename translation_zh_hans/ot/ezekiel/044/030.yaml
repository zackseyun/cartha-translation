  to: 一切初熟之物的首份，以及你们一切奉献中所分别出来的每一份，都要归给祭司。你们要把你们面团的头一份给祭司[a]，使福分停留在你家[b]。
  rationale: 修订保留原文中“初熟之物的首份”与“各种奉献中分别出来的每一份”的层叠表达，采用自然的现代汉语表达面团首份，并删除原文没有的“安居其中”。“使福分停留在你家”保留使役动词的安歇意象，也不将福分限定为任何特定种类。
