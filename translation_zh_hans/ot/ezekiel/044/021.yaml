  yaml_path: translation/ot/ezekiel/044/021.yaml
  text: No priest shall drink wine when entering the inner court[a].
translation:
  language: zh_hans
  text: 凡祭司进入内院时，都不可喝酒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַיִן
  choice: 酒
  rationale: יַיִן通常指葡萄酒；在本节圣殿礼仪禁令的语境中，现代汉语用“酒”自然准确。句首连接词 וְ 不必机械译作“并且”，以免割裂汉语行文。
- source_word: לֹא יִשְׁתּוּ
  choice: 不可喝
  rationale: 否定词与未完成时动词在律例语境中表达禁令；“不可喝”兼具明确的规范性和庄重自然的语体。
- source_word: כָּל כֹּהֵן
  choice: 凡祭司……都
  rationale: 原文形式上是“每一个祭司”，却以复数动词和复数代词把祭司视为一个群体；“凡……都”自然保留普遍适用的范围。
- source_word: בְּ/בוֹאָ/ם אֶל
  choice: 进入……时
  rationale: 介词 בְ 加不定式构造及第三人称复数词尾表示时间，即“当他们进入时”；汉语用“进入……时”简洁表达，并与集合性的“凡祭司”协调。
- source_word: הֶ/חָצֵר הַ/פְּנִימִית
  choice: 内院
  rationale: חָצֵר在圣殿建筑语境中指院落，פְּנִימִית表示内部的；“内院”是准确、简洁且通行的译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清晰的律例语体。“凡……都不可……”既传达原文禁令的普遍范围，也避免照搬希伯来语单数名词与复数动词、代词的结构而造成汉语不自然。
