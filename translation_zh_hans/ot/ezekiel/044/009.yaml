source:
  edition: WLC
  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כָּל בֶּן נֵכָ֗ר עֶ֤רֶל לֵב֙ וְ/עֶ֣רֶל בָּשָׂ֔ר לֹ֥א יָב֖וֹא אֶל מִקְדָּשִׁ֑/י לְ/כָל בֶּן נֵכָ֔ר אֲשֶׁ֕ר בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/009.yaml
  text: 'Thus says the Lord GOD: No foreigner[a], uncircumcised in heart and uncircumcised in flesh, shall enter my sanctuary[b], of any foreigner who is among the sons of Israel.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“凡心里未受割礼、肉身也未受割礼的外族人，都不可进入我的圣所——凡在以色列人中间的外族人都不可进入。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知信息中正式而权威的使者公式，同时符合现代汉语圣经文体。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达称号 אֲדֹנָי 与神名 יהוה，避免把二者合并，并沿用现代中文读者熟悉的表达。
- source_word: כָּל בֶּן נֵכָר
  choice: 凡……的外族人，都不可
  rationale: בֶּן נֵכָר 是指外族人的希伯来语习语，并非特指男性后裔；结合否定句，译为“凡……都不可”自然呈现其全称范围。
- source_word: עֶרֶל לֵב
  choice: 心里未受割礼
  rationale: 保留心之未受割礼这一内在、属灵层面的原文隐喻，不将其解释性改写为“不顺服”等。
- source_word: וְעֶרֶל בָּשָׂר
  choice: 肉身也未受割礼
  rationale: 保留与“心里未受割礼”的平行及具体身体含义；“也”清楚连接两个并列限定。
- source_word: לֹא יָבוֹא אֶל מִקְדָּשִׁי
  choice: 都不可进入我的圣所
  rationale: “进入”自然表达 יָבוֹא אֶל 的方向意义，“圣所”准确表达 מִקְדָּשׁ 的神圣空间。
- source_word: לְכָל בֶּן נֵכָר
  choice: 包括……任何外族人
  rationale: 将带 לְ 的重复语理解为补充、强调前述禁令的范围；中文用“包括”避免生硬重复，同时保留强调作用。
- source_word: אֲשֶׁר בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 住在以色列人中间的
  rationale: בְּתוֹךְ 表示“在……中间”；语境涉及以色列群体中的外族居民，“住在”使现代中文更自然，而“以色列人”准确传达集合性的 בְּנֵי יִשְׂרָאֵל。
theological_decisions:
- issue: “外族人”的排除范围
  choice: 把“心里未受割礼、肉身也未受割礼”作为修饰“外族人”的并列条件
  alternative: 理解为所有外族人一概不得进入，两个“未受割礼”短语只是对他们的一般描述
  rationale: 希伯来语把两个形容性短语直接置于“外族人”之后。译文保留这种限定关系，不扩大为超出本节措辞的普遍断言，也不替文本消解其张力。
- issue: 复述短语 לְכָל בֶּן נֵכָר 的功能
  choice: 译作“包括住在以色列人中间的任何外族人”
  alternative: 用破折号直译为“——任何住在以色列人中间的外族人”
  rationale: 该短语可能具有复述、强调或范围补充的作用。“包括”自然体现其对禁令适用范围的强化，不额外引入宗派性解释。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经传统中广为识别的专名形式；与 אֲדֹנָי 的“主”并列为“主耶和华”，既保留称号与神名之别，也避免只译作泛称“主”。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。句式保留先知宣告与法规性禁令的力度；不使用文言化的“凡外邦之子”，也不把“心里未受割礼”解释性改写，以保存原文的具体隐喻和神学张力。
