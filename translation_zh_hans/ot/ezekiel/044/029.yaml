  text: הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם הֵ֖מָּה יֹֽאכְל֑וּ/ם וְ/כָל חֵ֥רֶם בְּ/יִשְׂרָאֵ֖ל לָ/הֶ֥ם יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/029.yaml
  text: They shall eat the grain offering[a], the sin offering, and the guilt offering[b], and every devoted thing in Israel shall be theirs.
translation:
  language: zh_hans
  text: 他们要吃素祭、赎罪祭[a]和赎愆祭；以色列中一切永献之物[b]都要归他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。
    reason: lexical_alternative
  - marker: b
    text: “永献之物”所译的希伯来语，指不可撤回地分别归给上帝之物；在其他语境中也可指“当灭之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 在祭司礼仪语境中，מִנְחָה特指以谷物为主的祭物；“素祭”是现代中文圣经用语中简明且有辨识度的对应词。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 本节列举祭物类别，חַטָּאת在此指与罪及洁净有关的祭物。“赎罪祭”保留通行的礼仪术语；“洁净祭”作为可行替代译法列入脚注。
- source_word: הָאָשָׁם
  choice: 赎愆祭
  rationale: אָשָׁם在献祭法规中指涉及罪责、亏欠及赔偿责任的祭物。“赎愆祭”既区别于赎罪祭，也保留其专门礼仪类别。
- source_word: הֵמָּה יֹאכְלוּם
  choice: 他们要吃
  rationale: הֵמָּה带强调意味，动词后缀则以此前列举的祭物为宾语。中文在列举之后可自然省略“它们”，同时保留“他们”作为明确主语。
- source_word: חֵרֶם
  choice: 永献之物
  rationale: חֵרֶם指不可撤回地分别归给上帝之物；本节谈祭司所得，并非战争中的毁灭，因此“永献之物”能表达其礼仪和归属含义而不误导。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列中
  rationale: 表示这些永献之物出现和归属的范围；“以色列中”自然保留其群体性含义。
- source_word: לָהֶם יִהְיֶה
  choice: 都要归他们
  rationale: 此希伯来语结构表达所有权或应得份额；“归他们”符合本段祭司所得份额的法律语境。
theological_decisions:
- issue: 祭司所得中各类祭物的术语
  choice: 采用“素祭、赎罪祭、赎愆祭”等彼此有别的专门名称。
  alternative: 将它们笼统译作“供物”，或采用“洁净祭、赔偿祭”等较具解释性的名称。
  rationale: 原文逐项列出不同祭物，保留类别差异能呈现祭司制度的法律与礼仪结构，又不附加后来的教义解释。
- issue: חֵרֶם在本节的含义
  choice: 正文译作“永献之物”。
  alternative: “奉献之物”或“当灭之物”。
  rationale: 上下文关注归给祭司的物品，而非战争中的毁灭。“永献之物”保留其不可撤回地归给上帝的技术性含义；其他语境可能具有“当灭”之意，故在脚注说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“素祭、赎罪祭、赎愆祭”沿用普通读者较熟悉的礼仪术语；分号清楚区分祭司可食用的祭物与归他们所有的永献之物。脚注标记按其实际解释对象分别置于“赎罪祭”和“永献之物”之后。
