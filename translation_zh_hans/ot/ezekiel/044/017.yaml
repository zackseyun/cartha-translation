source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/בוֹאָ/ם֙ אֶֽל שַׁעֲרֵי֙ הֶ/חָצֵ֣ר הַ/פְּנִימִ֔ית בִּגְדֵ֥י פִשְׁתִּ֖ים יִלְבָּ֑שׁוּ וְ/לֹֽא יַעֲלֶ֤ה עֲלֵי/הֶם֙ צֶ֔מֶר בְּ/שָֽׁרְתָ֗/ם בְּ/שַׁעֲרֵ֛י הֶ/חָצֵ֥ר הַ/פְּנִימִ֖ית וָ/בָֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/017.yaml
  text: And when they enter the gates of the inner court[a], they shall wear linen garments[b]; no wool shall come upon them while they minister in the gates of the inner court and in the house.
translation:
  language: zh_hans
  text: 他们进入内院各门时，要穿细麻衣；他们在内院各门和殿内[b]供职时，身上不可有羊毛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不可穿羊毛衣服”。希伯来文直译为“羊毛不可上到他们身上”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“殿”指圣殿建筑。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּבוֹאָם
  choice: 他们进入……时
  rationale: וְהָיָה引出随后的规定，בְּ加不定式及复数后缀表示时间；合译为现代汉语的时间从句，既自然又保留时序关系。
- source_word: שַׁעֲרֵי הֶחָצֵר הַפְּנִימִית
  choice: 内院各门
  rationale: 该结构指内院的各个入口；“各门”简洁清楚，也体现复数形式。
- source_word: בִּגְדֵי פִשְׁתִּים
  choice: 细麻衣
  rationale: פִשְׁתִּים指亚麻及其织物；“细麻衣”是清楚、庄重且符合祭司服饰语境的现代汉语表达。
- source_word: יִלְבָּשׁוּ
  choice: 要穿
  rationale: לבשׁ可指穿上或穿着；此处是服饰规定，“要穿”自然表达规范性要求。
- source_word: וְלֹא יַעֲלֶה עֲלֵיהֶם צֶמֶר
  choice: 不可让羊毛披在身上
  rationale: 原文近乎直译为“羊毛不可上到他们身上”。“披在身上”保留其形象和禁令语气，同时避免擅自补出原文没有明说的“衣服”。
- source_word: בְּשָׁרְתָם
  choice: 供职时
  rationale: 此词在本节指祭司履行圣所职务；“供职”保留礼仪服事的语境，又比生硬的“事奉之时”更符合现代汉语。
- source_word: וָבָיְתָה
  choice: 殿内
  rationale: בַּיִת在异象语境中指圣殿建筑，词尾-ה带有方向或处所意味；“殿内”清楚表达其与内院各门相对的空间位置。
theological_decisions:
- issue: 祭司礼仪职务的措辞
  choice: 供职
  alternative: 服事
  rationale: “供职”能表达祭司在圣所履行职责的含义，不额外引入宗派化的神学用语。
- issue: “房屋”的所指
  choice: 殿内
  alternative: 屋内
  rationale: 以西结圣殿异象中的“这房”指圣殿建筑；译作“殿内”依据上下文明确所指，并保留空间含义。
- issue: 羊毛禁令的表达
  choice: 不可让羊毛披在身上
  alternative: 不可穿羊毛衣服
  rationale: 正文尽量保留原文“羊毛不可上到他们身上”的非典型表达，不把禁令范围悄然缩窄为某一种衣服；通顺的解释性译法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式按时间从句、正面服饰要求和反面禁令展开；“细麻衣”“供职”“殿内”保持圣所语境，但避免古奥或宗派化措辞。脚注标记均置于正文与其所解释的内容之后。
