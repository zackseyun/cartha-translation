source:
  edition: WLC
  text: וַ/יְבִיאֵ֜/נִי דֶּֽרֶךְ שַׁ֣עַר הַ/צָּפוֹן֮ אֶל פְּנֵ֣י הַ/בַּיִת֒ וָ/אֵ֕רֶא וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֣ית יְהוָ֑ה וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/004.yaml
  text: Then he brought me by way of the north gate to the front of the house[a], and I looked, and behold, the glory of Yahweh filled the house of Yahweh[b]; and I fell on my face.
translation:
  language: zh_hans
  text: 他带我经由北门[a]，来到殿前。我观看，看哪，雅威的荣耀充满了雅威的殿[b]；我就俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“穿过北门。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“雅威的房屋”；此处指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: 他带我
  rationale: 使役形态表示“他把我带来”。中文叙事中以“带我”自然表达，句序本身即可体现连续动作，无须机械增译“然后”。
- source_word: דֶּרֶךְ שַׁעַר הַצָּפוֹן
  choice: 从北门那条路
  rationale: דֶּרֶךְ 表示道路或所经路线；此译保留“路”的意象，也表达所走的是北门方向的路线。上下文也容许理解为“穿过北门”，故列入脚注。
- source_word: אֶל פְּנֵי הַבַּיִת
  choice: 来到殿前
  rationale: פְּנֵי 字面为“面”，此处惯用义为“前面”；בַּיִת 在异象中指圣殿，译作简洁自然的“殿”，而不作生硬的“房屋”。
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 我观看，看哪
  rationale: ראה 表示看见或观看；הִנֵּה 是唤起注意的视觉提示语。“看哪”保留异象叙述中的突显和庄重感。
- source_word: מָלֵא
  choice: 充满了
  rationale: 该形式表达“满”的状态；在此结构中用中文动词“充满了”自然呈现雅威荣耀遍满殿宇的意思。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: כָּבוֹד 在先知书的圣殿异象语境中译作“荣耀”；专名 יְהוָה 音译为“雅威”。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿宇
  rationale: 原文直译为“雅威的房屋”。“殿宇”既保留居所或建筑物的表达，又清楚表明此处所指为圣殿。
- source_word: וָאֶפֹּל אֶל פָּנָי
  choice: 我就面伏于地
  rationale: 原文惯用语字面为“我倒向我的脸”，表示俯伏敬畏。“面伏于地”准确、庄重，并保留脸朝地的具体姿态。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不以称号“主”代替；同时不在正文中引入特定传统译名。
- issue: 以 בַּיִת / בֵּית יְהוָה 指称圣殿
  choice: 殿／雅威的殿宇
  alternative: 房屋／雅威的房屋；圣殿／雅威的圣殿
  rationale: 上下文明确指圣殿，但原文反复采用“房屋、居所”的词汇。正文用“殿／殿宇”兼顾现代中文的清晰度和原文建筑、居所的措辞，并以脚注说明其字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留先知异象中突显所见之事的语气；“面伏于地”呈现敬畏俯伏的具体姿态。两个脚注标记均已置于正文对应位置。
