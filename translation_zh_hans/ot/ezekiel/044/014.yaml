  text: וְ/נָתַתִּ֣י אוֹתָ֔/ם שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/בָּ֑יִת לְ/כֹל֙ עֲבֹ֣דָת֔/וֹ וּ/לְ/כֹ֛ל אֲשֶׁ֥ר יֵעָשֶׂ֖ה בּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/014.yaml
  text: Yet I will appoint them to keep charge of the house[a], for all its service and for all that is done in it.
translation:
  language: zh_hans
  text: 但我要委派他们看守殿宇[a]，负责殿宇的一切事务，以及其中所做的一切事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“房屋”，这里指圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 但我要委派
  rationale: נתן本义为“给、安置”，在此与职责称谓连用，表示指派职务。连词וְ结合上文的惩处带有转折意味，因此译作“但”。
- source_word: אוֹתָם
  choice: 他们
  rationale: 作直接宾语，指上文所说的利未人。
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַבָּיִת
  choice: 看守殿宇
  rationale: 同根词组合שׁמרי משׁמרת强调受托看守并履行职责；“看守”在现代汉语中自然地表达这层责任。הבית直译“这房屋”，在异象语境中指圣殿，正文用“殿宇”兼顾所指与庄重语体。
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: 负责殿宇的一切事务
  rationale: עֲבֹדָה可指工作、服役或礼仪性事奉；“事务”保持范围宽泛，可涵盖实际与礼仪方面的职责。代词后缀所指为殿宇，汉语中明说以避免歧义。
- source_word: וּלְכֹל אֲשֶׁר יֵעָשֶׂה בּוֹ
  choice: 以及其中所做的一切事
  rationale: 保留被动表达和概括性，指殿中进行的各种事情，不进一步限定其性质。
theological_decisions:
- issue: הַבָּיִת的所指
  choice: 正文译作“殿宇”，指以西结异象中的圣殿
  alternative: 译作“房屋”或“圣殿”
  rationale: 上下文明指圣殿及其中的利未人职务。“殿宇”既自然显明所指，又未加入“神的”等原文没有的限定；脚注保留字面义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“委派”体现行政性的职责指派；避免把עֲבֹדָה窄化为仅礼仪性的“事奉”。
