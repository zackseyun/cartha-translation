id: EZK.44.19
reference: Ezekiel 44:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ֠/בְ/צֵאתָ/ם אֶל הֶ/חָצֵ֨ר הַ/חִיצוֹנָ֜ה אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָה֮ אֶל הָ/עָם֒ יִפְשְׁט֣וּ אֶת בִּגְדֵי/הֶ֗ם אֲשֶׁר הֵ֨מָּה֙ מְשָׁרְתִ֣ם בָּ֔/ם וְ/הִנִּ֥יחוּ אוֹתָ֖/ם בְּ/לִֽשְׁכֹ֣ת הַ/קֹּ֑דֶשׁ וְ/לָֽבְשׁוּ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וְ/לֹֽא יְקַדְּשׁ֥וּ אֶת הָ/עָ֖ם בְּ/בִגְדֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/019.yaml
  text: When they go out to the outer court[a], to the outer court where the people are, they shall take off their garments in which they minister and leave them in the holy chambers. Then they shall put on other garments[b], so that they may not make the people holy with their garments.
translation:
  language: zh_hans
  text: 他们出去到外院，就是到百姓那里的外院[a]时，要脱下供职时所穿的衣服，放在圣室里，再穿上别的衣服，免得他们借着自己的衣服使百姓分别为圣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文重复“到外院”，强调祭司从专属区域出去，进入百姓所在的院落。
    reason: cultural_note
  - marker: b
    text: “分别为圣”也可译作“使百姓成圣”。这里指礼仪上被归入神圣范围，并非道德上变得圣洁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצֵאתָם
  choice: 他们出去……时
  rationale: 前缀连词与带后缀的不定词构成时间从句；译为“……时”自然地表达“当他们出去时”。
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: 外院
  rationale: חָצֵר 在圣殿建筑语境中指院落，הַחִיצוֹנָה 表明是外部的院；“外院”简洁且符合中文圣殿语境。
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה אֶל הָעָם
  choice: 到外院，就是到百姓那里的外院
  rationale: 保留原文重复的“到外院”，并把“到百姓那里”理解为对该外院的进一步说明，显示祭司从专属区域走向百姓所在之处。
- source_word: יִפְשְׁטוּ אֶת בִּגְדֵיהֶם
  choice: 要脱下……衣服
  rationale: פשט 用于衣服时意为脱下；物主后缀通过下文“所穿的”自然体现。
- source_word: אֲשֶׁר הֵמָּה מְשָׁרְתִם בָּם
  choice: 供职时所穿的
  rationale: שרת 在此指祭司礼仪性的事奉；“供职”保留圣殿职事色彩，中文以“所穿的”自然表达介词 ב 与衣服的关系。
- source_word: וְהִנִּיחוּ אוֹתָם בְּלִשְׁכֹת הַקֹּדֶשׁ
  choice: 放在圣屋里
  rationale: הניח 在此指把衣服留置、安放；לשכה 是圣殿中的房间，“圣屋”既简明又体现这些房间的神圣用途。
- source_word: וְלָבְשׁוּ בְּגָדִים אֲחֵרִים
  choice: 再穿上别的衣服
  rationale: לבש 表示穿上，אֲחֵרִים 表示别的；“再”清楚呈现脱下、存放、换穿的次序。
- source_word: וְלֹא יְקַדְּשׁוּ אֶת הָעָם
  choice: 免得他们……使百姓成为圣
  rationale: קדש 的 piel 形在此为使役义，即使之成为圣或分别出来；“免得”表达该规定所要防止的结果，同时避免把礼仪性的圣误解为道德改善。
- source_word: בְּבִגְדֵיהֶם
  choice: 用自己的衣服
  rationale: 介词 ב 在此表工具或媒介；“用”自然表达衣服作为传递礼仪性神圣的媒介，物主后缀译作“自己的”。
theological_decisions:
- issue: 末句所说礼仪性神圣的传递
  choice: 译作“免得他们用自己的衣服使百姓成为圣”
  alternative: “不可穿着这些衣服使百姓分别为圣”或仅理解为维护礼仪秩序
  rationale: piel 形的 קדש 带直接宾语“百姓”，又有表示媒介的“用自己的衣服”，最自然地指圣服可能使接触者进入礼仪上分别为圣的状态。译文保留这种物质与空间层面的圣洁观念，不把它改写为道德圣化，也不引入后期教义框架。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“供职”保留祭司事奉语境；“圣屋”简洁表达圣殿内分别为圣的房间。原文对“外院”的重复予以保留，并用“就是”呈现其说明关系。
