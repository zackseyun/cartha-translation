- from: 他们出去到外院，就是到百姓那里的外院[a]时，要脱下供职时所穿的衣服，放在圣屋里，再穿上别的衣服，免得他们用自己的衣服使百姓成为圣[b]。
  to: 他们出去到外院，就是到百姓那里的外院[a]时，要脱下供职时所穿的衣服，放在圣室里，再穿上别的衣服，免得他们借着自己的衣服使百姓分别为圣[b]。
  rationale: 仅作两项安全的语言与术语修订：“圣屋”改为“圣室”，以准确表达圣殿中的房间；“使百姓成为圣”改为“使百姓分别为圣”，以采用自然的现代汉语礼仪表达。保留“外院”的重复、衣服的物主关系、衣服作为媒介的含义，以及末句所指礼仪性而非道德性的圣洁。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:53:51Z'
