  verdict: revise
  source_fidelity: 原文禁止祭司接近死去的人而沾染礼仪上的不洁，并列出可为之沾染不洁的近亲例外。草案的整体意思正确；但“免得”较易将不定式理解为单纯预防性后果，而末句“使自己不洁”略显人为造成。改为“而沾染不洁／可以……沾染不洁”更贴合礼仪不洁语境及反身动词的结果意义。
  naturalness: “接近死人”“沾染不洁”是现代汉语中庄重、清楚且自然的法规语体。“只是为了父亲、母亲……”比“但若是父亲……”更明确表达这些亲属是许可沾染不洁的缘由。
  terminology: “不洁”保留礼仪术语，避免误作一般卫生或道德污秽。“从未嫁人的姐妹”准确传达该姐妹尚未在婚姻中归属男子；脚注保留原文关系表达的歧义，而不将其过度限定为“处女”。
  issues:
