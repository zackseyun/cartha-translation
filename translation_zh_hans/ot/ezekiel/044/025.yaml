    issue: “免得使自己不洁”及末句“使自己不洁”的表达
    rationale: 原文在此描述接近尸体所带来的礼仪性沾染，末尾反身式在例外条款中表示许可。“沾染不洁”在汉语中更自然，也较少暗示主动、刻意地使自己变得不洁。
  - severity: low
    issue: “但若是父亲、母亲……”的例外连接
    rationale: “若是”可被理解为条件判断，却没有明确显示“为这些亲属”的许可理由。改为“只是为了父亲、母亲……”更直接对应原文的例外列表。
  - severity: low
