  text: וְ/אֶל מֵ֣ת אָדָ֔ם לֹ֥א יָב֖וֹא לְ/טָמְאָ֑ה כִּ֣י אִם לְ/אָ֡ב וּ֠/לְ/אֵם וּ/לְ/בֵ֨ן וּ/לְ/בַ֜ת לְ/אָ֗ח וּ/לְ/אָח֛וֹת אֲשֶֽׁר לֹא הָיְתָ֥ה לְ/אִ֖ישׁ יִטַּמָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/025.yaml
  text: And they shall not go near a dead person to make themselves unclean; but for father or mother[a], for son or daughter, for brother, or for a sister who has not belonged to a man, they may make themselves unclean.
translation:
  language: zh_hans
  text: 他们不可接近死人而沾染不洁；只是为了父亲、母亲、儿子、女儿、兄弟，或从未嫁人的姐妹[a]，他们可以沾染不洁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“未曾归于男人”；即未曾在婚姻中归属丈夫的姐妹，或可译“未婚的姐妹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת אָדָם
  choice: 死人
  rationale: 该短语直指死去的人，即尸体；现代汉语用“死人”既自然简洁，也不必把阳性单数形式强化为仅指男性。
- source_word: יָבוֹא אֶל
  choice: 走近
  rationale: 在祭司与尸体沾染不洁的语境中，指接近死者，而非单纯来到某处。
- source_word: לְטָמְאָה
  choice: 免得使自己不洁
  rationale: 不定式说明接近死者所导致的礼仪性不洁；结合禁令，用“免得”自然表达所禁止的结果。
- source_word: כִּי אִם
  choice: 但若是
  rationale: 引出禁令的例外，并与随后列举的亲属自然衔接。
- source_word: לְאָב וּלְאֵם וּלְבֵן וּלְבַת לְאָח וּלְאָחוֹת
  choice: 若是父亲、母亲、儿子、女儿、兄弟，或……姐妹
  rationale: 介词לְ标明可为之沾染不洁的近亲；汉语借“若是”引出例外名单，亲属关系中的所属可由上下文自然领会。
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: 尚未嫁人的
  rationale: 希伯来语字面为“尚未归于男人”，在此是婚姻关系的习语；“尚未嫁人”准确、自然，又避免“处女”这一过度具体的解释。
- source_word: יִטַּמָּאוּ
  choice: 他们可以……使自己不洁
  rationale: 在法律条文列举禁令例外的语境中，该未完成式表示许可，而非命令或单纯将来。
theological_decisions:
- issue: 末尾未完成式 יִטַּמָּאוּ 的法律语气
  choice: 许可：“他们可以……使自己不洁”
  alternative: 命令：“他们要使自己不洁”；或将来：“他们会使自己不洁”
  rationale: 本句先规定禁令，再列举例外，因此末句是在准许祭司为这些近亲接触死者所产生的不洁，并非要求他们必须如此。
- issue: 姐妹从句 אֲשֶׁר לֹא הָיְתָה לְאִישׁ 的含义
  choice: 尚未嫁人的姐妹
  alternative: 未婚的姐妹；处女姐妹；尚未归于男人的姐妹
  rationale: 原文的关系表达最自然地指她尚未与丈夫建立婚姻归属。“处女”超出原文字面所能确定的范围；“尚未嫁人”则保留婚姻指向且符合现代汉语。
translation_notes:
  register: 采用现代、庄重而通顺的法规语体。“不洁”保留祭司礼仪语境；末句补出“这些亲属”，使“为父母等而使自己不洁”的逻辑在汉语中清楚，但不增添新的亲属类别。
