  text: וְ/אָמַרְתָּ֤ אֶל מֶ֨רִי֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה רַב לָ/כֶ֛ם מִֽ/כָּל תּוֹעֲבֽוֹתֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/006.yaml
  text: 'And say to the rebellious house[a], to the house of Israel, ‘Thus says the Lord GOD: Enough of all your abominations, O house of Israel.’'
translation:
  language: zh_hans
  text: 你要对这悖逆的家[a]，就是以色列家说：‘主耶和华如此说：以色列家啊，你们所行的一切可憎之事，够了！’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“悖逆”；也可理解为“悖逆者”或集合意义的“悖逆的百姓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרִי
  choice: 悖逆者
  rationale: 该名词可指“悖逆”，也可转指悖逆的群体。此处作受话对象，并由后面的“以色列家”进一步说明；译作“悖逆者”既保留原文单数形式及含混性，也可作集合称谓。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留原文惯用的盟约性、民族性称谓，也与《以西结书》的表达保持一致。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的主权称号与 יהוה 的专名性质，采用现代中文圣经语域中清楚而庄重的表达。
- source_word: רַב לָכֶם
  choice: 够了
  rationale: 这是表示限度已过、必须停止的惯用语；“够了”简洁自然，并保留斥责的力度。
- source_word: מִכָּל תּוֹעֲבוֹתֵיכֶם
  choice: 你们所行的一切可憎之事
  rationale: 介词短语依附于“够了”，指出已经过分的行为。“所行”是为现代汉语通顺所作的轻度明示，并未限定具体行为类别。
- source_word: תּוֹעֲבוֹתֵיכֶם
  choice: 你们……一切可憎之事
  rationale: “可憎之事”保留该词在圣殿与礼仪语境中的强烈谴责色彩，同时比“憎恶”作为事件名词更符合现代汉语。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 译文既区别称号“主”与神的专名，又避免把 יהוה 仅处理为普通称号；“耶和华”在现代中文读者中具有广泛可识别性。
- issue: מֶרִי 是抽象的“悖逆”还是集合性的受话者
  choice: 悖逆者
  alternative: 悖逆；悖逆的百姓；悖逆之家
  rationale: 句法中的 אֶל 表明这是被直接告知的对象，后接“就是以色列家”作同位说明。保留单数集合称谓，不把原文未明说的“家”提前加入。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话书面语。“你要……说”保留先知受命的结构；“就是”自然表达两个介词短语之间的同位关系；末尾“够了”保留神谕中直接而强烈的斥责语气。
