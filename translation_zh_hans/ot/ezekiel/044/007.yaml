  text: בַּ/הֲבִיאֲ/כֶ֣ם בְּנֵֽי נֵכָ֗ר עַרְלֵי לֵב֙ וְ/עַרְלֵ֣י בָשָׂ֔ר לִ/הְי֥וֹת בְּ/מִקְדָּשִׁ֖/י לְ/חַלְּל֣/וֹ אֶת בֵּיתִ֑/י בְּ/הַקְרִֽיבְ/כֶ֤ם אֶת לַחְמִ/י֙ חֵ֣לֶב וָ/דָ֔ם וַ/יָּפֵ֨רוּ֙ אֶת בְּרִיתִ֔/י אֶ֖ל כָּל תּוֹעֲבוֹתֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/007.yaml
  text: when you brought in foreigners[a], uncircumcised in heart and uncircumcised in flesh, to be in my sanctuary, to profane it—my house—when you presented my food, the fat and the blood, and they broke my covenant[c][b], along with all your abominations.
translation:
  language: zh_hans
  text: 当你们把外族人[a]，就是心未受割礼、肉身也未受割礼的人，带进我的圣所，使他们留在我的圣所中，亵渎它——我的殿；当你们献上我的食物[b]，就是脂油和血时，他们便违背了我的约[c]，在你们一切可憎之事之外又加上一项罪责。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“异乡之子”或“外来者之子”，即外族人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“我的饼”；在献祭语境中，指献给上帝的食物或祭物。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文在这里转为“他们违背了我的约”，很可能指刚才提到的外族人；也有人把意思较宽泛地理解为继续指责“你们”。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּהֲבִיאֲכֶם
  choice: 你们把……带进
  rationale: ב 加不定式构词并带第二人称复数后缀，在此表达伴随或时间背景；“带进”保留 בוא 的使役含义。
- source_word: בְּנֵי נֵכָר
  choice: 外族人
  rationale: 字面为“异乡之子／外来者之子”，是指外族人的习语；“外族人”自然且保留其群体身份含义。
- source_word: עַרְלֵי לֵב
  choice: 心未受割礼
  rationale: 保留先知性比喻及其圣约色彩，不将其解释性改写为“内心悖逆”。
- source_word: וְעַרְלֵי בָשָׂר
  choice: 肉身也未受割礼
  rationale: 与“心未受割礼”构成平行，并明确指身体上的未受割礼。
- source_word: לִהְיוֹת בְּמִקְדָּשִׁי
  choice: 让他们留在其中
  rationale: 原文直译为“在我的圣所中存在／停留”；译文避免仅译作“进入”，保留他们身处圣所之中的重点。
- source_word: לְחַלְּלוֹ אֶת־בֵּיתִי
  choice: 亵渎它——我的殿
  rationale: חלל 的 Piel 形式在圣所语境中指使神圣之物成为俗污；“它”承接“我的圣所”，“我的殿”随后作强调性的同位说明。
- source_word: בְּהַקְרִיבְכֶם
  choice: 你们献上……时
  rationale: קרב 的 Hiphil 在献祭语境中意为呈献、献上；同时保留 ב 所表达的时间背景。
- source_word: לַחְמִי
  choice: 我的食物
  rationale: 字面是“我的饼”，但在祭祀语境中泛指献给上帝的祭物；“食物”传达该习语的实际范围，并以脚注保留字面信息。
- source_word: חֵלֶב וָדָם
  choice: 脂油和血
  rationale: 准确保留祭祀中所指的两类成分。
- source_word: וַיָּפֵרוּ אֶת־בְּרִיתִי
  choice: 他们便违背了我的约
  rationale: 动词为第三人称阳性复数，最近的复数先行对象是刚提到的外族人；הפר ברית 是“违背／破坏约”的固定搭配。
- source_word: אֶל כָּל־תּוֹעֲבוֹתֵיכֶם
  choice: 连同你们一切可憎之事
  rationale: 保留 אֶל 在此将破约行为与听众其他可憎之事并列、相加的语气，不强行细化其逻辑关系。
theological_decisions:
- issue: “亵渎它——我的殿”中代词的指向及同位关系
  choice: “它”指前面的“我的圣所”，“我的殿”作为同位语再次指明并强调同一神圣空间。
  alternative: 将短语直接合并为“亵渎我的殿”，或认为后面的“我的殿”只是代词的顺向解释。
  rationale: 第三人称阳性单数后缀最自然地回指紧邻的 מִקְדָּשִׁי；随后的 אֶת־בֵּיתִי 可作为强调性的同位成分。保留代词与同位语，较完整地呈现希伯来文结构。
- issue: “他们便违背了我的约”的主语
  choice: 按第三人称复数理解为刚提到的外族人。
  alternative: 按整个责备语境宽泛地理解为“你们”继续违背上帝的约。
  rationale: וַיָּפֵרוּ 明确转为第三人称阳性复数，最近的合适指称对象是外族人；但人称突然转换造成的解释张力应由脚注说明，而不应在正文中悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“心未受割礼／肉身未受割礼”的先知性平行表达，以及“它——我的殿”的代词加同位语结构；用破折号呈现强调，避免以解释性措辞消除原文的人称转换和句法张力。
