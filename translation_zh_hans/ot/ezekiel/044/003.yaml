source:
  edition: WLC
  text: אֶֽת הַ/נָּשִׂ֗יא נָ֥שִׂיא ה֛וּא יֵֽשֶׁב בּ֥/וֹ לֶ/אֱכָול לֶ֖חֶם לִ/פְנֵ֣י יְהוָ֑ה מִ/דֶּ֨רֶךְ אֻלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/מִ/דַּרְכּ֖/וֹ יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/003.yaml
  text: As for the prince[a], because he is the prince, he may sit in it to eat bread before Yahweh. He shall enter by way of the porch of the gate, and shall go out by the same way.
translation:
  language: zh_hans
  text: 至于君王，他既是君王，就可以坐在门内，在耶和华面前吃饭。他要从这门的门廊进来，也要从原路[a]出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “原路出去”或译“从他自己的路出去”。希伯来语直译为“从他的路出去”，很可能指沿刚才所说的同一路线出去。
    reason: 保留“从他的路出去”的字面形式，以及该短语所指的可能歧义。
lexical_decisions:
- source_word: אֶת הַנָּשִׂיא
  choice: 至于君王
  rationale: 前置的宾格标记与定冠词名词构成强调性话题，译作“至于君王”可保留其话题突出作用。
- source_word: נָשִׂיא הוּא
  choice: 因为他是君王
  rationale: 名词重复并加代词，既有强调意味，也在上下文中说明他获准使用此处的理由。
- source_word: יֵשֶׁב בּוֹ
  choice: 可以坐在门廊里
  rationale: 未完成式在此表示获准的行动；“里面”的所指依上下文落实为门廊，使中文清楚自然。
- source_word: לֶאֱכָל לֶחֶם
  choice: 吃饭
  rationale: 希伯来语直译为“吃饼”，在此是用餐的惯用表达；现代汉语用“吃饭”自然准确，也不额外限定食物。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 保留该礼仪性表达的空间与敬拜含义，并将神名 יְהוָה 音译为“耶和华”。
- source_word: מִדֶּרֶךְ אֻלָם הַשַּׁעַר
  choice: 从门的门廊进来
  rationale: אֻלָם 指门廊或前厅；按行进路线译为“从门的门廊进来”，符合现代汉语建筑与方向表达。
- source_word: וּמִדַּרְכּוֹ יֵצֵא
  choice: 也要原路出去
  rationale: “从他的路出去”较自然地回指刚提到的进入路线；“原路出去”简洁表达程序上的对称，同时用脚注保留字面歧义。
theological_decisions:
- issue: 以西结圣殿异象中 נָשִׂיא 的身份与地位
  choice: 中性译作“君王”，不在正文中认定他就是弥赛亚，也不把他限定为纯世俗官长。
  alternative: 可理解为弥赛亚君王，或理解为有别于弥赛亚的大卫家／民政统治者。
  rationale: 本节只说明这位 נָשִׂיא 所享有的特别权限，并未解决其完整身份；译文保留称号，避免导入经文本身未明说的教义结论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“君王”既体现 נָשִׂיא 在以西结书中的统治者身份，又避免“王子”在现代汉语中通常指君主之子的误解；“门的门廊”保留圣殿建筑术语，整体句式兼顾法规性语气与自然表达。
