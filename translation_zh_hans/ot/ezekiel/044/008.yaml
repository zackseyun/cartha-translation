source:
  edition: WLC
  text: וְ/לֹ֥א שְׁמַרְתֶּ֖ם מִשְׁמֶ֣רֶת קָדָשָׁ֑/י וַ/תְּשִׂימ֗וּ/ן לְ/שֹׁמְרֵ֧י מִשְׁמַרְתִּ֛/י בְּ/מִקְדָּשִׁ֖/י לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/008.yaml
  text: You have not kept charge of my holy things[a], but have appointed others to keep charge in my sanctuary for you.
translation:
  language: zh_hans
  text: 你们没有尽到看守我圣物[a]的职责，却指派人替你们在我的圣所看守我所托付的职守[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣物”也可理解为“神圣的事物”，涵盖圣所相关的圣务、礼仪和物件，并非只限于具体器物。
    reason: lexical_scope
  - marker: b
    text: “替你们”也可译为“为你们”或“代表你们”，指所指派的人承担本应由你们履行的圣所职守。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַרְתֶּם מִשְׁמֶרֶת
  choice: 尽责看守
  rationale: שׁמר与מִשְׁמֶרֶת构成祭司职务语境中的惯用表达，指忠实履行受托的看守职责；“尽责看守”兼顾职责与守护之意。
- source_word: קָדָשָׁי
  choice: 我的圣物
  rationale: 该复数形式可广指属于上帝的神圣事物、事务及礼仪；“圣物”简洁自然，但可能被理解为仅指物件，因此以脚注说明其宽泛范围。
- source_word: וַתְּשִׂימוּן
  choice: 指派
  rationale: שׂים本义为“放置、设立”，此处涉及安排人员承担圣所职务，译作“指派”符合语境。
- source_word: לְשֹׁמְרֵי מִשְׁמַרְתִּי
  choice: 尽看守之责
  rationale: 分词与מִשְׁמֶרֶת共同表达承担受托职守；译文保留“看守”和“职责”两层含义，同时避免生硬重复。
- source_word: בְּמִקְדָּשִׁי
  choice: 在我的圣所里
  rationale: מִקְדָּשׁ在以西结圣殿异象的语境中指神圣区域或圣所，“圣所”比宽泛的“圣殿”更准确。
- source_word: לָכֶם
  choice: 替你们
  rationale: 此处לָכֶם表示别人代表他们、代替他们承担职责；“替你们”自然呈现代行含义，而不将受益意味完全排除。
theological_decisions:
- issue: “我的圣物”的范围
  choice: 正文采用可涵盖圣所中神圣事物与相关事务的宽泛表达
  alternative: 仅指具体的神圣器物，或仅指抽象的圣职
  rationale: קָדָשָׁי语义宽泛，语境责备的是圣所托付上的失职，不宜将范围限定为物件或职分之一。
- issue: לָכֶם所表达的关系
  choice: 译作“替你们”，突出他人代行本应由他们承担的圣所职责
  alternative: “为你们”，可侧重代表或为其利益行事
  rationale: 上下文强调他们没有亲自履行托付，而安排别人承担，因此“替你们”更贴合责备语气；脚注保留“为你们”的可能。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“尽责看守”体现祭司职务语境；“反倒”传达前后行为的责备性转折。正文中的每个脚注均应有标记。
