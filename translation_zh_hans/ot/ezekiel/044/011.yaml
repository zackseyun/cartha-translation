id: EZK.44.11
reference: Ezekiel 44:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָי֤וּ בְ/מִקְדָּשִׁ/י֙ מְשָׁ֣רְתִ֔ים פְּקֻדּוֹת֙ אֶל שַׁעֲרֵ֣י הַ/בַּ֔יִת וּֽ/מְשָׁרְתִ֖ים אֶת הַ/בָּ֑יִת הֵ֠מָּה יִשְׁחֲט֨וּ אֶת הָ/עֹלָ֤ה וְ/אֶת הַ/זֶּ֨בַח֙ לָ/עָ֔ם וְ/הֵ֛מָּה יַעַמְד֥וּ לִ/פְנֵי/הֶ֖ם לְ/שָֽׁרְתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/011.yaml
  text: Yet they shall be ministers in my sanctuary[a], having oversight at the gates of the temple and ministering in the temple. They shall slaughter the burnt offering and the sacrifice for the people[c][b], and they shall stand before them to minister to them.
translation:
  language: zh_hans
  text: 然而，他们要在我的圣所中供职，负责殿门的职守[a]，并在殿[b]中供职。他们要为百姓[c]宰杀燔祭牲和祭牲，并要站在百姓面前，为他们服务。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “职守”也可译作“职务”或“职责”。
    reason: lexical_alternative
  - marker: b
    text: “殿”原文直译为“房屋”；在本段圣殿异象的语境中，所指的是圣殿。
    reason: lexical_alternative
  - marker: c
    text: “为百姓”也可理解为“代表百姓”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: 然而，他们要
  rationale: 结合上文对这些利未人的限制，连词在此带有转折意味；“然而”自然呈现这种语篇关系，又不改变命题内容。
- source_word: מְשָׁרְתִים
  choice: 供职／服役
  rationale: 该词表示圣所礼仪中的职务性服事。“供职”和“服役”既保留正式的圣所语境，也符合现代汉语表达。
- source_word: פְּקֻדּוֹת אֶל שַׁעֲרֵי הַבַּיִת
  choice: 负责殿门
  rationale: פְּקֻדּוֹת 可指受托的职责、管理或看守任务；简洁译为“负责”保留其职务性质，而不把具体职责过度限定为守卫。
- source_word: הַבַּיִת / שַׁעֲרֵי הַבַּיִת
  choice: 殿／殿门
  rationale: 在以西结的圣殿异象中，“房屋”明确指圣殿建筑或殿宇；“殿”在中文中清楚、自然，并保留庄重语体。
- source_word: הָעֹלָה
  choice: 燔祭牲
  rationale: עֹלָה 是整牲焚烧献上的祭，中文圣经传统中的“燔祭”准确；加入“牲”与“宰杀”搭配自然。
- source_word: הַזֶּבַח
  choice: 祭牲
  rationale: זֶבַח 在此是泛指被宰献的祭物，不宜擅自限定为平安祭；“祭牲”保留其动物祭物及宰杀的含义。
- source_word: לָעָם
  choice: 为百姓
  rationale: 介词 ל־ 可表示为某人的益处或代表某人；正文采用简洁自然的“为百姓”，并以脚注保留“代表百姓”的可能。
- source_word: יַעַמְדוּ לִפְנֵיהֶם
  choice: 站在百姓面前
  rationale: 保留原文“站在他们面前”的形象和侍候含义；为避免中文代词指向不清，明确补出“百姓”。
- source_word: לְשָׁרְתָם
  choice: 为他们服务
  rationale: 后缀明确指向百姓。这里是对百姓所作的受托礼仪服务，用现代中文“为他们服务”清楚表达，而不暗示他们获得祭司近前事奉的资格。
theological_decisions:
- issue: 这些受限制的利未人在圣所中的角色
  choice: 他们承担殿门、宰杀祭牲和侍候百姓等从属圣所职务，而非亲近耶和华的祭司职分。
  alternative: 把他们理解为继续履行完整的祭司职务。
  rationale: 上下文明确区分他们与可以亲近耶和华供职的祭司；本节列出的任务是殿门职责、替百姓宰杀祭牲及侍候百姓。译文不额外加入“从属”等解释词，但让原文所列职责本身呈现这种区别。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“圣所、殿门、燔祭牲、祭牲”保留礼仪语境所需的正式程度；后半句改用“为他们服务”，避免同一句中连续重复较生硬的“供职／服役”，同时忠实表达服务对象。所有代词所指均按希伯来语上下文明确处理。
