id: EZK.44.24
reference: Ezekiel 44:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַל רִ֗יב הֵ֚מָּה יַעַמְד֣וּ ל/שפט בְּ/מִשְׁפָּטַ֖/י ו/שפט/הו וְ/אֶת תּוֹרֹתַ֤/י וְ/אֶת חֻקֹּתַ/י֙ בְּ/כָל מוֹעֲדַ֣/י יִשְׁמֹ֔רוּ וְ/אֶת שַׁבְּתוֹתַ֖/י יְקַדֵּֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/024.yaml
  text: In a dispute[a], they shall stand to judge; they shall judge it according to my judgments. They shall keep my laws and my statutes at all my appointed times[b], and they shall keep my Sabbaths holy.
translation:
  language: zh_hans
  text: 遇有争讼[a]，他们要站出来审判，按我的典章审判这事。他们要在我一切指定的时节[b]遵守我的律法和条例，也要尊我的安息日为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “争讼”也可译作“案件”、“争端”或“诉讼”。
    reason: lexical_alternative
  - marker: b
    text: “我一切指定的时节”也可译作“我一切指定的节期”或“我一切定下的日期”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: 争讼
  rationale: 该词指争端，尤其可指进入司法裁断的案件；“争讼”既保留争议性，也切合本节审判语境。
- source_word: יַעַמְדוּ ל/שפט
  choice: 站出来审判
  rationale: 保留 עמד 的“站立”意象，同时用现代汉语“站出来”自然表达祭司就位履行审判职责。
- source_word: בְּ/מִשְׁפָּטַ/י
  choice: 按我的判例
  rationale: מִשְׁפָּט 在此紧接司法行为，可指裁断、判例或司法准则；“判例”保留其法律语境，并与后面的“律法、条例”有所区别。
- source_word: ו/שפט/הו
  choice: 作出裁决
  rationale: 宾语后缀回指争讼；汉语中“按我的判例作出裁决”比直译“审判它”自然，同时保留裁判含义。
- source_word: תּוֹרֹתַ/י
  choice: 我的律法
  rationale: תורה 可指教导或律法；在祭司、条例和遵守的语境中，“律法”最能体现规范性。
- source_word: חֻקֹּתַ/י
  choice: 我的条例
  rationale: חֻקָּה 指规定、律例或成文条例；“条例”与“律法”并列而不完全重合。
- source_word: בְּ/כָל מוֹעֲדַ/י
  choice: 在我一切指定的时间
  rationale: מוֹעֵד 可指指定的时间，也可特指节期；正文保留较宽泛的“指定的时间”，脚注说明礼仪性可能。
- source_word: שַׁבְּתוֹתַ/י יְקַדֵּשׁוּ
  choice: 尊我的安息日为圣
  rationale: קדש 的使役/宣告为圣含义在汉语中以“尊……为圣”表达自然，也避免只理解为一般的遵守。
theological_decisions:
- issue: 祭司司法职责中 מִשְׁפָּטַי 的含义
  choice: 按我的判例作出裁决
  alternative: 按我的典章审判这事
  rationale: 上下文重复使用 שפט，司法色彩明显；译为“判例”突出上帝所设的裁判标准，同时不把它与后面的 תורה 和 חקה 混同。
- issue: מוֹעֵד 是泛指指定时间还是特指节期
  choice: 正文译作“指定的时间”，脚注保留“节期”可能
  alternative: 在我一切指定的节期
  rationale: 该词具有真实的词义幅度；本节属于礼仪语境，但原词本身不限于汉语“节期”，因此不在正文中排除较广义理解。
- issue: 相关法律术语是否合并
  choice: 分别译作“判例、律法、条例”
  alternative: 统一译作“规定”
  rationale: 希伯来文本有意并列不同的法律词汇；分别翻译能保留其修辞和概念层次，而不附加宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。用“站出来审判”保留司法就位的画面；用“作出裁决”避免不自然的“审判它”。法律术语彼此区分，且以脚注保留 רִיב 和 מוֹעֵד 的词义幅度。
