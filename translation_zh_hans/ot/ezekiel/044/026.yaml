  text: וְ/אַחֲרֵ֖י טָֽהֳרָת֑/וֹ שִׁבְעַ֥ת יָמִ֖ים יִסְפְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/026.yaml
  text: And after his cleansing[a], they shall count seven days for him.
translation:
  language: zh_hans
  text: 在他得洁净之后，他们要为他数算七天。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他洁净之后”。这里指祭司语境中的礼仪洁净，而非一般清洗或道德净化。
    reason: 说明 טָהֳרָה 在本段的礼仪语境及可行译法，同时避免将原文未明确的具体仪式加入译文。
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: 以后
  rationale: אַחֲרֵי表示时间上的先后；中文用“以后”自然承接前文规定，无须机械译出句首连接词וְ。
- source_word: טָהֳרָתוֹ
  choice: 他洁净
  rationale: טָהֳרָה在本段祭司条例中指礼仪上的洁净或洁净过程；“他洁净”简明自然，并由脚注说明其礼仪语境。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 按原文直译这一数词与“日”的组合。
- source_word: יִסְפְּרוּ
  choice: 他们要数算
  rationale: ספר的Qal未完成式在此指计算规定的期限；“数算”保留正式条例语气，并保留原文复数主语。
- source_word: לוֹ
  choice: 为他
  rationale: 介词ל在此表示所关涉或受益的对象，七天是针对该祭司而计算的。
theological_decisions:
- issue: 洁净的性质
  choice: 以“洁净”表达祭司礼仪上的洁净，不引申为内在道德或属灵状态
  alternative: 译作“洁除不洁”或“净化”
  rationale: 上下文讨论祭司因接触死者而产生的礼仪程序；中性表达可避免加入原文未明说的神学含义。
- issue: 数算期限的执行者
  choice: 保留复数主语“他们”
  alternative: 用泛指的“要为他数算”或改成单数自数
  rationale: 希伯来语动词יִסְפְּרוּ为第三人称阳性复数；即使具体执行者在本节未说明，也不应擅自确定为该祭司本人。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“数算七天”略带正式色彩，适合规定礼仪期限的上下文；保留“他们”以反映希伯来语复数形式。
