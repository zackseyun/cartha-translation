  text: וְ/הָיְתָ֤ה לָ/הֶם֙ לְֽ/נַחֲלָ֔ה אֲנִ֖י נַֽחֲלָתָ֑/ם וַ/אֲחֻזָּ֗ה לֹֽא תִתְּנ֤וּ לָ/הֶם֙ בְּ/יִשְׂרָאֵ֔ל אֲנִ֖י אֲחֻזָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/028.yaml
  text: 'And this shall be their inheritance: I am their inheritance[a]. And you shall give them no possession in Israel[b]; I am their possession.'
translation:
  language: zh_hans
  text: 这要作他们的产业：我就是他们的产业。[a]你们不可在以色列中给他们地业[b]；我就是他们的地业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这要给他们作为产业：我就是他们的产业。”希伯来语开头省略了明确的主语。
    reason: lexical_alternative
  - marker: b
    text: “地业”也可译作“土地产业”或“永久持有的土地”，这里指在以色列境内固定持有的土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְנַחֲלָה
  choice: 这要归给他们作产业
  rationale: 希伯来语开头为阴性单数动词，主语有所省略；根据上下文补出“这”，既符合现代汉语，也保留法律宣告的语气。“归给他们作产业”反映 לָהֶם לְנַחֲלָה 的归属与承受含义。
- source_word: נַחֲלָה / נַחֲלָתָם
  choice: 产业／他们的产业
  rationale: נחלה 常指承受所得的份额，尤其是土地与盟约中的分。在本节中译为“产业”，能兼顾继承、分配和持有的含义，并保持前后复现。
- source_word: אֲנִי נַחֲלָתָם
  choice: 我就是他们的产业
  rationale: 无动词句简洁而强调；加入“就是”自然地传达强调，同时保留上文“产业”的词汇呼应。
- source_word: אֲחֻזָּה / אֲחֻזָּתָם
  choice: 地产／他们的地产
  rationale: אחזה 在这里指以色列境内可永久持有的土地产业。译作“地产”比笼统的“所有物”更清楚地表达土地占有，也与 נחלה 的“产业”保持词义区别。
- source_word: לֹא תִתְּנוּ לָהֶם בְּיִשְׂרָאֵל
  choice: 你们不可在以色列中给他们地产
  rationale: 第二人称复数未完成式在法规语境中表达禁令；“不可”体现规范效力，又不擅自限定受命者的具体身份。
- source_word: אֲנִי אֲחֻזָּתָם
  choice: 我就是他们的地产
  rationale: 直译保留原文鲜明而张力十足的比喻，也保留与前一分句“地产”的对应；不将其解释性改写为“我就是他们所得的份”。
theological_decisions:
- issue: 祭司所得的“产业”与“地产”之间的关系
  choice: 分别以“产业”译 נחלה，以“地产”译 אחזה，并在两个“我是……”句中保持各自用词。
  alternative: 将两词都译为“产业”或“所有”，使中文更平顺。
  rationale: 原文有意采用两个相关而不同的土地与持有术语。保留区别，使读者看见祭司没有以色列境内通常的土地持有，因为耶和华自己既是他们承受的产业，也是他们的地产；译文不进一步消解这一神学张力。
- issue: 开头省略主语的解释
  choice: 正文补出中性的“这”，并用脚注说明也可按省略结构理解为“这要给他们作为产业”。
  alternative: 不补主语，译为“要给他们作产业”。
  rationale: 现代汉语通常需要明确主语；“这”依据上下文作最低限度补足，而脚注保留希伯来语句法的省略性，避免把所指范围说得过死。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“产业”保留承受之份的法律—盟约色彩，“地产”明确土地持有含义。两个“我就是”形成平行和强调。所有脚注标记均已置于正文对应位置。
