base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/031.yaml
  text: The priests shall not eat any carcass or animal torn by beasts[a], whether from birds or from livestock.
translation:
  language: zh_hans
  text: 祭司不可吃任何鸟类或牲畜中未经宰杀而死的动物，也不可吃任何鸟类或牲畜中被撕裂的动物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“自然死亡或被野兽撕裂的动物。”
    reason: נְבֵלָה指动物尸体，尤其指未经正常宰杀而死的；טְרֵפָה通常指被野兽撕裂的动物。脚注提供较明确的常见词义，同时正文不补入未明说的施事者。
lexical_decisions:
- source_word: כָּל
  choice: 任何
  rationale: 在否定禁令中与单数名词连用，译为“任何”自然地保留全面禁止的语气。
- source_word: נְבֵלָה
  choice: 尸体
  rationale: 指动物的尸体，尤其是未经正常宰杀而死的动物；“尸体”简明且适合饮食条例的语境。
- source_word: טְרֵפָה
  choice: 被撕裂的动物
  rationale: 指遭撕裂、通常被野兽撕伤或撕死的动物；正文不明说施事者，以保留原文的简洁和语义范围。
- source_word: מִן הָעוֹף
  choice: 鸟类的
  rationale: עוֹף在此泛指鸟类；中文以“鸟类的尸体”自然表达来源或类别。
- source_word: וּמִן הַבְּהֵמָה
  choice: 牲畜的
  rationale: בְּהֵמָה与鸟类相对，在此主要指陆地家畜；“牲畜”比泛称“动物”更准确，也不像“牛”那样过窄。
- source_word: לֹא יֹאכְלוּ
  choice: 不可吃
  rationale: לֹא加未完成式在法规语境中表达禁令；“不可吃”兼具清楚、庄重和规范性。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 明确指本段圣殿条例中的祭司群体；现代中文无需另加定冠词。
