  text: וְ/אֶת עַמִּ֣/י יוֹר֔וּ בֵּ֥ין קֹ֖דֶשׁ לְ/חֹ֑ל וּ/בֵין טָמֵ֥א לְ/טָה֖וֹר יוֹדִעֻֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/023.yaml
  text: They shall teach my people the difference between the holy and the common[b][a], and make them know the difference between the unclean and the clean.
translation:
  language: zh_hans
  text: 他们要教导我的子民辨别圣与俗，并使他们辨明不洁净与洁净。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹרוּ
  choice: 教导
  rationale: 该词为ירה的使役式，在祭司律法语境中指施行教导；“教导”自然地体现祭司对百姓的训诲职责。
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: 分辨圣的和俗的
  rationale: קֹדֶשׁ与חֹל构成礼仪身份上的对比。“圣的”保留核心圣洁用语；“俗的”表示未分别为圣、属一般用途，并不必然含有道德邪恶之意。
- source_word: טָמֵא
  choice: 不洁净的
  rationale: 在祭司传统和《以西结书》的礼仪语境中，“不洁净的”能保留该词关于礼仪状态的含义。
- source_word: טָהוֹר
  choice: 洁净的
  rationale: 与“不洁净的”形成惯常而清楚的礼仪性对语。
- source_word: יוֹדִעֻם
  choice: 使他们知道怎样分辨
  rationale: 该词是ידע的使役式，直义为“使他们知道”；结合两个בֵּין结构，此处指使百姓认识并能辨别两种状态。
- source_word: וְאֶת עַמִּי
  choice: 我的子民
  rationale: את标明第一动词的直接宾语，前缀ו承接上文；中文在本节中无需另译句首连接词。
theological_decisions:
- issue: חֹל与קֹדֶשׁ相对时的礼仪术语
  choice: 俗的
  alternative: 普通的；非圣的；世俗的
  rationale: 这里所表达的是祭司必须教导的圣俗界线。“俗的”简洁保留技术性对比，又避免“世俗的”在现代汉语中可能带出的反宗教或道德贬义；脚注说明其基本含义是未分别为圣。
- issue: יוֹדִעֻם的使役含义及辨别意味
  choice: 使他们知道怎样分辨
  alternative: 使他们知道……的区别；使他们辨明
  rationale: 原文明确保留使役语气，但“知道”在汉语中单独搭配“不洁净的和洁净的”略显生硬；加入“怎样分辨”传达上下文中的辨识要求，同时脚注保留较贴近形式的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“圣的和俗的”“不洁净的和洁净的”保留祭司礼仪语境中的成对术语；两个“分辨”在中文中形成有意的平行，清楚表达祭司既教导界线，也使百姓获得辨识能力。
