  text: וְ/אַלְמָנָה֙ וּ/גְרוּשָׁ֔ה לֹֽא יִקְח֥וּ לָ/הֶ֖ם לְ/נָשִׁ֑ים כִּ֣י אִם בְּתוּלֹ֗ת מִ/זֶּ֨רַע֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה אַלְמָנָ֔ה מִ/כֹּהֵ֖ן יִקָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/022.yaml
  text: They shall not take for themselves as wives a widow or a divorced woman[a], but only virgins from the offspring of the house of Israel; however, they may take a widow who is the widow of a priest.
translation:
  language: zh_hans
  text: 他们不可娶寡妇或离了婚的妇人为妻，只可娶以色列家后裔中的处女；不过，他们可以娶祭司的遗孀。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“从祭司而成为寡妇的妇人。”即其已故丈夫是祭司。
    reason: 保留 מִכֹּהֵן（字面“从祭司”）的较直译表达，同时说明其在此处最自然的关系含义。
lexical_decisions:
- source_word: אַלְמָנָה
  choice: 寡妇／遗孀
  rationale: 前一处用现代汉语通称“寡妇”；末句涉及亡夫的祭司身份，用“遗孀”更自然地表达其丈夫已经去世，二者均对应同一希伯来词。
- source_word: גְרוּשָׁה
  choice: 被休的妇人
  rationale: 该词是被动形式，指遭丈夫休弃、处于离婚状态的女子；“被休的妇人”保留被动语态和法律婚姻背景。
- source_word: יִקְחוּ ... לְנָשִׁים
  choice: 娶……为妻
  rationale: 准确传达希伯来语“取来作妻子”的婚姻用语，同时符合现代汉语表达。
- source_word: כִּי אִם
  choice: 只可
  rationale: 清楚表达限制性的例外，与前面的禁令形成对照。
- source_word: בְּתוּלוֹת
  choice: 处女
  rationale: 保留该词所指的童贞身份，不泛化为“年轻女子”或“未婚女子”。
- source_word: מִזֶּרַע בֵּית יִשְׂרָאֵל
  choice: 以色列家后裔中的
  rationale: “后裔”自然表达 זֶרַע 的血统含义；“以色列家”保留原文的民族—盟约称谓。
- source_word: וְהָאַלְמָנָה אֲשֶׁר תִּהְיֶה אַלְמָנָה מִכֹּהֵן
  choice: 不过，他们可以娶祭司的遗孀
  rationale: 按上下文将“从祭司成为寡妇”理解为亡夫是祭司，并用自然汉语明确这种关系；“不过”标明这是前述禁令中的许可例外。
- source_word: מִן in מִכֹּהֵן
  choice: 的
  rationale: 介词字面为“从”，在此表达寡居身份源于与一名祭司的婚姻；汉语以所属关系“祭司的遗孀”最为自然。
theological_decisions:
- issue: 圣殿异象中婚姻条例的适用范围
  choice: 按祭司条例直译其禁令和例外，不在译文中扩展为普世婚姻规范。
  alternative: 将其处理为适用于所有人的永久婚姻规则，或弱化为一般性偏好。
  rationale: 本节语境是以西结圣殿异象中的祭司规章；译文应忠实保留法律限制及其例外，不额外引申或淡化。
- issue: 末句中 מִכֹּהֵן 的关系
  choice: 理解为“祭司的遗孀”，即亡夫为祭司的寡妇。
  alternative: 机械直译为“从祭司成为寡妇的妇人”，保留但不解释关系。
  rationale: 介词短语在此最自然地说明她因祭司丈夫去世而成为寡妇；正文采用清楚的现代汉语，脚注保留原文较直译的形式。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“被休的妇人”保留原文被动意味；“祭司的遗孀”避免“祭司的寡妇”可能产生的生硬感。正文中的脚注标记[a]与脚注相对应。
