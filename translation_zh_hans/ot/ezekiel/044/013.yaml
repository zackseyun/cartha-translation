  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹֽא יִגְּשׁ֤וּ אֵלַ/י֙ לְ/כַהֵ֣ן לִ֔/י וְ/לָ/גֶ֨שֶׁת֙ עַל כָּל קָ֣דָשַׁ֔/י אֶל קָדְשֵׁ֖י הַ/קְּדָשִׁ֑ים וְ/נָֽשְׂאוּ֙ כְּלִמָּתָ֔/ם וְ/תוֹעֲבוֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/013.yaml
  text: They shall not come near to me to serve as priests for me[a], nor to come near any of my holy things, the most holy things; but they shall bear their shame and the abominations that they have done.
translation:
  language: zh_hans
  text: 他们不可到我面前作祭司侍奉我，也不可接近我的任何圣物，就是至圣之物[a]；他们却要担当自己的羞辱，以及自己所行的可憎之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “至圣之物”或译“至圣所”。希伯来语短语既可指至圣的物件，也可指圣殿最里面的圣所；本节上下文较支持前一种理解。
    reason: 保留希伯来语短语在物件与地点之间的真实歧义。
lexical_decisions:
- source_word: יִגְּשׁוּ אֵלַי
  choice: 到我面前
  rationale: נגשׁ在祭司和圣所语境中指进入神圣临近范围；“到我面前”既自然，也保留朝向上帝的礼仪含义。
- source_word: לְכַהֵן לִי
  choice: 作祭司侍奉我
  rationale: כהן的动词形式表示履行祭司职分；此译兼顾身份与服侍功能。
- source_word: וְלָגֶשֶׁת
  choice: 也不可近前接触
  rationale: 再次保留נגשׁ的“近前”含义；结合其后圣物作宾语，用“接触”表达获准接近、经手之意，而不将其弱化为一般空间移动。
- source_word: עַל כָּל קָדָשַׁי
  choice: 我的任何圣物
  rationale: קָדָשַׁי是实体化复数，宜理解为属于上帝的分别为圣之物；“任何”体现כָּל在否定句中的全称范围。
- source_word: אֶל קָדְשֵׁי הַקְּדָשִׁים
  choice: 就是至圣之物
  rationale: 该短语可指至圣之物，也可能指至圣所；紧接“我的任何圣物”，本处以同位说明理解较顺，同时用脚注保留地点性读法。
- source_word: וְנָשְׂאוּ
  choice: 他们却要担当
  rationale: נשא与羞辱、罪责类词语连用时表示承受或承担；“担当”保留其负担及后果意味。
- source_word: כְּלִמָּתָם
  choice: 自己的羞辱
  rationale: כלמה表示羞耻、蒙羞或羞辱；“羞辱”在本句中适合可担当、承受的客观处境。
- source_word: וְתוֹעֲבוֹתָם
  choice: 自己所行的可憎之事
  rationale: תועבה是以西结书中强烈的道德与礼仪谴责用语；“可憎之事”庄重而易懂，也避免现代汉语中“可憎之物”可能造成的实体误解。
- source_word: אֲשֶׁר עָשׂוּ
  choice: 所行的
  rationale: עָשׂוּ为中性的“做、行”；“所行的”自然连接“可憎之事”，不额外加入“犯下”等解释性罪责措辞。
theological_decisions:
- issue: קָדְשֵׁי הַקְּדָשִׁים在本节所指
  choice: 正文译作“至圣之物”
  alternative: “至圣所”
  rationale: 前文刚提到“我的任何圣物”，因此将此短语看作对圣物范围的进一步强调更符合紧邻语境；但希伯来语也容许地点性理解，故不在正文中否定该可能，而以脚注保留。
- issue: “担当羞辱和可憎之事”的关系
  choice: 按原文并列结构直译，不扩展为明确的刑罚后果
  alternative: “承担因可憎之事而来的羞辱/后果”
  rationale: 原文将כְּלִמָּתָם与תוֹעֲבוֹתָם并列为נשא的宾语；虽可理解为承受行为后果，正文不宜替原文明确因果关系。
translation_notes:
  register: 采用现代、庄重且适合经文宣读的简体中文。“作祭司侍奉我”清楚表达祭司职分；“近前接触”使圣物作为宾语时语义自然。句中保留禁令与承担羞辱之间的转折张力，并避免加入宗派性术语。
