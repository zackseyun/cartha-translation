    rationale: הֵמָּה 是强调性独立代词，且上下文确有对比；但本节的词汇本身更直接表达“他们”而非“只有他们”。中文可借上下文和“至于”保留对比，避免将段落推论写成该节的明说内容。
  - severity: low
