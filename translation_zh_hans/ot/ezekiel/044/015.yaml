source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם בְּנֵ֣י צָד֗וֹק אֲשֶׁ֨ר שָׁמְר֜וּ אֶת מִשְׁמֶ֤רֶת מִקְדָּשִׁ/י֙ בִּ/תְע֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵֽ/עָלַ֔/י הֵ֛מָּה יִקְרְב֥וּ אֵלַ֖/י לְ/שָֽׁרְתֵ֑/נִי וְ/עָמְד֣וּ לְ/פָנַ֗/י לְ/הַקְרִ֥יב לִ/י֙ חֵ֣לֶב וָ/דָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/015.yaml
  text: But the Levitical priests[a], the sons of Zadok, who kept the charge of my sanctuary when the sons of Israel went astray from me—they shall come near to me to minister to me, and they shall stand before me to offer to me fat and blood[c][b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 至于利未祭司[a]，就是撒督的子孙，他们在以色列人[b]偏离我的时候，谨守我圣所的职守；他们必亲近我，侍奉我，并站在我面前，把脂肪和血献给我。这是主雅威[c]的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “利未祭司”也可译作“祭司，就是利未人”。希伯来语可理解为修饰结构，也可理解为同位结构。
    reason: lexical_alternative
  - marker: b
    text: “以色列人”原文直译为“以色列的儿子们”，这里是对以色列民的整体称呼。
    reason: lexical_alternative
  - marker: c
    text: 原文为“主YHWH”；YHWH是神的立约之名，本译本音译为“雅威”。
    reason: divine_name
lexical_decisions:
- source_word: וְהַכֹּהֲנִים הַלְוִיִּם
  choice: 但利未祭司
  rationale: וְ在这里承接上文对失职利未人的限制，并引出忠信祭司的对比，因此译为“但”。“利未祭司”是自然的现代汉语表达；希伯来语也可按同位结构理解，故以脚注保留。
- source_word: בְּנֵי צָדוֹק
  choice: 撒督的子孙
  rationale: בְּנֵי字面为“儿子们”，这里指祭司家系中的后代；“子孙”既保留血统语言，也避免误解为仅指撒督的亲生儿子。
- source_word: שָׁמְרוּ אֶת מִשְׁמֶרֶת מִקְדָּשִׁי
  choice: 仍谨守我圣所的职守
  rationale: מִשְׁמֶרֶת在祭司语境中指受托的职责或职分，不仅是看守建筑。“谨守……职守”保留其责任和忠信的含义；“仍”明示他们与背离者形成的语境对照。
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל מֵעָלַי
  choice: 在以色列人偏离我的时候
  rationale: ב加不定式表示时间或处境；תעה在此带有宗教与道德上的背离意味。“偏离我”自然地表达离弃耶和华。
- source_word: הֵמָּה יִקְרְבוּ אֵלַי
  choice: 惟有他们必亲近我
  rationale: 独立代词הֵמָּה带强调作用，在本段排除其他利未人的背景下译为“惟有他们”。“亲近”保留קָרַב在祭司礼仪中获准接近神的专门意味。
- source_word: לְשָׁרְתֵנִי
  choice: 侍奉我
  rationale: שׁרת在祭司语境中指在神面前履行礼仪职务；“侍奉”兼具服事与敬拜色彩。
- source_word: וְעָמְדוּ לְפָנַי
  choice: 站在我面前
  rationale: 直译该短语，保留祭司在神面前候命并履职的礼仪姿态。
- source_word: לְהַקְרִיב לִי חֵלֶב וָדָם
  choice: 把脂肪和血献给我
  rationale: קרב的使役式在献祭语境中意为呈献祭物；חֵלֶב和דָם指献祭中的脂肪与血，故采用具体直译。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知书常见的神谕公式，译为“宣告”。אֲדֹנָי יְהוִה为复合神名，正文采用现代中文圣经读者熟悉的“主耶和华”，并在脚注说明原文形式及另一种音译。
theological_decisions:
- issue: 忠信的撒督后裔是否独享亲近神并献祭的资格
  choice: 用“惟有他们”表达הֵמָּה的强调及上下文中的排他性
  alternative: “他们必亲近我”
  rationale: 本节与前文对偏离职守之利未人的限制形成明确对照。强调不来自外加的祭司制度理论，而来自希伯来语独立代词及段落语境。
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文沿用普通现代中文读者熟悉且庄重的表达，同时用脚注明确指出第二个词是神的立约之名YHWH，并保留“雅威”这一音译可能，不把读音传统冒充为无争议的原文发音。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“职守、亲近、侍奉、献给”保留祭司礼仪语域，但避免生硬仿古表达。分号划分身份与职责、所得特权两部分；“惟有”承载希伯来语代词的强调和上下文对比。
