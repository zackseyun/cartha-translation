  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהֹוָ֗ה בֶּן אָדָ֡ם שִׂ֣ים לִבְּ/ךָ֩ וּ/רְאֵ֨ה בְ/עֵינֶ֜י/ךָ וּ/בְ/אָזְנֶ֣י/ךָ שְּׁמָ֗ע אֵ֣ת כָּל אֲשֶׁ֤ר אֲנִי֙ מְדַבֵּ֣ר אֹתָ֔/ךְ לְ/כָל חֻקּ֥וֹת בֵּית יְהוָ֖ה וּ/לְ/כָל תורת/ו וְ/שַׂמְתָּ֤ לִבְּ/ךָ֙ לִ/מְב֣וֹא הַ/בַּ֔יִת בְּ/כֹ֖ל מוֹצָאֵ֥י הַ/מִּקְדָּֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/005.yaml
  text: And Yahweh said to me[a], “Son of man, set your heart, and see with your eyes, and hear with your ears all that I am speaking to you concerning all the statutes of the house of Yahweh and all its laws[b]. Set your heart on the entrance of the temple and on all the exits of the sanctuary.”
translation:
  language: zh_hans
  text: 耶和华对我说：“人子啊，你要留心[a]，用眼睛看，用耳朵听我向你所说的一切话，就是关于耶和华殿的一切律例和一切法则[b]。你要留心殿的入口，以及圣所的一切出口。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “留心”这一习语直译为“把心放在……上”，意思是专心注意并认真关切；本节中重复出现。
    reason: lexical_alternative
  - marker: b
    text: “法则”也可译作“训示”或“规定”；原词可指具有规范性的教导，不仅限于狭义的法律。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对神名 YHWH 的通行音译，明确保留专名性质，不以泛称“主”取代。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的固定称呼及其文学连贯性；在本处指受呼召的人类先知，不额外引入后来的基督论含义。
- source_word: שִׂים לִבְּךָ / וְשַׂמְתָּ לִבְּךָ
  choice: 你要留心
  rationale: 希伯来语直译为“把你的心放上”，表示集中注意、认真关切；“留心”是自然的现代汉语，并在两处保持重复。
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: 用眼睛看
  rationale: 保留原文具体而强调性的身体表达，并与下句“用耳朵听”构成平行。
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: 用耳朵听
  rationale: 保留原文感官表达的修辞力度以及与“用眼睛看”的平行结构。
- source_word: מְדַבֵּר אֹתָךְ
  choice: 向你所说
  rationale: 自然表达 דבר 与宾语代词构成的“对某人说话”；置于关系分句中，使整句符合现代汉语语序。
- source_word: לְכָל חֻקּוֹת בֵּית יְהוָה
  choice: 就耶和华殿的一切律例
  rationale: 将介词 ל 理解为话题或所涉及的事项；“耶和华殿”既保留所属关系，也在中文中清楚表明这是圣殿。
- source_word: תורתו
  choice: 一切法则
  rationale: 此处指圣殿相关的规范性教导或规定；“法则”兼顾法律和规章语境，又不把语义收窄为现代成文法律。
- source_word: לִמְבוֹא הַבַּיִת
  choice: 殿的入口
  rationale: מָבוֹא 指进入之处；在圣所建筑语境中，“殿的入口”自然明确。
- source_word: בְּכָל מוֹצָאֵי הַמִּקְדָּשׁ
  choice: 圣所的一切出口
  rationale: מוֹצָאִים 指出去的地方，故译“出口”；מִקְדָּשׁ 译作“圣所”，保留其神圣空间含义。
theological_decisions:
- issue: 神名 יְהֹוָה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: 原文使用以色列神的专名。译作“耶和华”可在现代中文读者熟悉的形式中保留专名，不把它化约为称号；“雅威”是另一种较贴近现代学界重构读音的译法。
- issue: 以西结书中 בֶּן אָדָם 的译法
  choice: 人子
  alternative: 世人／必死的人
  rationale: “人子”保留本书固定称呼及原文形式；此处首先突出先知作为人的身份，不在译文中预先解释为后期的弥赛亚称号。
- issue: תורתו 的规范性范围
  choice: 法则
  alternative: 训示／律法
  rationale: 该词在此可涵盖圣殿的规范、教导和条例。“法则”保留其规范性，同时避免把它限定为狭义立法或特定神学体系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“用眼睛看、用耳朵听”的感官平行和两次“留心”的重复，以呈现原文的强调；调整关系分句语序，使较长的希伯来语句式在中文中清楚可读。
