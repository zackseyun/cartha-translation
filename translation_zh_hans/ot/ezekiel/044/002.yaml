  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהוָ֗ה הַ/שַּׁ֣עַר הַ/זֶּה֩ סָג֨וּר יִהְיֶ֜ה לֹ֣א יִפָּתֵ֗חַ וְ/אִישׁ֙ לֹא יָ֣בֹא ב֔/וֹ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּ֣א ב֑/וֹ וְ/הָיָ֖ה סָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/002.yaml
  text: And Yahweh said to me[a], “This gate shall remain shut; it shall not be opened, and no one shall enter through it, because Yahweh, the God of Israel, has entered through it. Therefore it shall remain shut.”
translation:
  language: zh_hans
  text: 雅威对我说：“这门要保持关闭，不可打开；任何人都不可从这门进入[a]，因为雅威—以色列的上帝—已经从这门进入。因此，这门要保持关闭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文用阳性单数词，字面为“男人”，这里是泛指任何人。
    reason: 说明原文אִישׁ的阳性单数形式及其泛指功能。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用希伯来神名四字母词的常见中文音译，保留其作为专名的性质，不以称号替代。
- source_word: הַשַּׁעַר הַזֶּה
  choice: 这门
  rationale: הַזֶּה是近指“这”；在圣殿异象的语境中，שַׁעַר指可供出入的门。
- source_word: סָגוּר יִהְיֶה
  choice: 要一直关闭
  rationale: 谓语形容词与היה连用，表示持续处于关闭状态；“一直关闭”自然传达延续性。
- source_word: לֹא יִפָּתֵחַ
  choice: 不可开启
  rationale: פתח的Niphal形式具有被动意义；中文“不可开启”保留门不得被打开的含义。
- source_word: וְאִישׁ לֹא יָבֹא בוֹ
  choice: 任何人都不可从这里进入[a]
  rationale: אִישׁ虽为阳性单数，句中具有泛指作用；“任何人”在现代汉语中准确自然。介词短语בוֹ用于门时表达经由该处进入。
- source_word: כִּי
  choice: 因为
  rationale: 该连词引出门必须保持关闭的原因。
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: 雅威—以色列的上帝—
  rationale: 将“以色列的上帝”作为“雅威”的同位说明，并用破折号清楚标示。
- source_word: בָּא בוֹ
  choice: 已经从这里进入
  rationale: 完成式表示已发生的进入行动，并且这一行动与门当前和今后的关闭状态相关；“已经”体现其完成性。
- source_word: וְהָיָה סָגוּר
  choice: 因此，这门要一直关闭
  rationale: 末句在语境中重申由前述原因产生的结果；“因此”自然呈现承接关系，“一直关闭”保留重复强调。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”将四字神名作为专名音译，既不以称号替代，也不附加经文本身未表达的神学解释。
- issue: 泛指用法אִישׁ
  choice: 任何人
  alternative: 男人；任何男人
  rationale: 该阳性单数名词在否定句中具有泛指意义。译作“任何人”准确表达禁止所有人进入，并以脚注交代希伯来文的字面形式。
- issue: 末句连接词וְ的逻辑关系
  choice: 因此
  alternative: 并且；而
  rationale: 上下文表明末句是根据雅威已经从此门进入而重申其持续关闭；“因此”呈现此结果关系，但不扩展其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“要一直关闭”兼顾原文持续状态与自然汉语；分号保留禁令之间的并列层次。
