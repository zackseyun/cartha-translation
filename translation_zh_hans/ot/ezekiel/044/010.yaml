source:
  edition: WLC
  text: כִּ֣י אִם הַ/לְוִיִּ֗ם אֲשֶׁ֤ר רָֽחֲקוּ֙ מֵֽ/עָלַ֔/י בִּ/תְע֤וֹת יִשְׂרָאֵל֙ אֲשֶׁ֣ר תָּע֣וּ מֵֽ/עָלַ֔/י אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/010.yaml
  text: But the Levites who went far from me when Israel went astray[a], who went astray from me after their idols, shall bear their iniquity.
translation:
  language: zh_hans
  text: 但那些利未人，在以色列走迷的时候远离我，自己也随从他们的偶像而离弃我；他们必担当自己的罪责[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“承受自己的惩罚”或“担当自己的罪孽”。这个希伯来语习语既包含应负的罪责，也可包含由此而来的惩罚。
    reason: 说明希伯来语 עָוֺן 及“担当罪责”这一习语兼有罪咎和相应后果的含义。
lexical_decisions:
- source_word: כִּי אִם
  choice: 但
  rationale: 在上下文中引出与前文限制相对照的一类人；“但”自然地表达这一转折，不把该短语生硬译成条件句。
- source_word: הַלְוִיִּם
  choice: 那些利未人
  rationale: 原文明确指利未人；“那些”承接后面的限定从句，并与本章后文的撒督子孙祭司相区分。
- source_word: רָחֲקוּ מֵעָלַי
  choice: 远离了我
  rationale: 保留 רחק 所表达的距离与离开的意象，也传达人与上帝关系上的疏离。
- source_word: בִּתְעוֹת יִשְׂרָאֵל
  choice: 在以色列走迷的时候
  rationale: 介词 בְּ 加不定式在此表示伴随的时间情境；“走迷”既自然，又可与下句同根动词 תָּעוּ 的意义形成呼应。
- source_word: אֲשֶׁר תָּעוּ מֵעָלַי
  choice: 离开我
  rationale: 此处再次说明利未人的偏离。为避免现代汉语中连续两次“走迷”显得拗口，译作“离开我”，同时保留其背离上帝的方向性。
- source_word: אַחֲרֵי גִּלּוּלֵיהֶם
  choice: 去随从他们的偶像
  rationale: אַחֲרֵי 在此具有跟随之意；“随从”清楚表达宗教忠诚的转移。גִּלּוּלִים 是以西结书对偶像带贬义的称呼，但正文采用现代读者熟悉的“偶像”，避免释义过度。
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: 他们必担当自己的罪责
  rationale: “担当”保留 נשׂא 的负荷意象；“罪责”兼顾 עָוֺן 所包含的罪过、罪咎及其后果，不把含义单方面限定为刑罚。
theological_decisions:
- issue: 如何表达 וְנָשְׂאוּ עֲוֺנָם 中罪咎与惩罚后果并存的含义
  choice: 他们必担当自己的罪责
  alternative: 他们必承受自己的惩罚／他们必担当自己的罪孽
  rationale: 希伯来语习语既可指承担罪咎，也可包含承受由罪而来的后果。正文用“罪责”保留这层张力，脚注说明其他可能表达，不将本节仅仅解释为刑罚，也不引入后来的教义范畴。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“走迷”保留原文偏离正道的意象；分号呈现前半节的背离与后半节审判结果之间的关系。脚注标记已在正文相应词语后标出。
