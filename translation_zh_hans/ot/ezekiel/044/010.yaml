revisions:
- from: 但那些利未人，在以色列走迷的时候远离了我，离开我去随从他们的偶像；他们必担当自己的罪责[a]。
  to: 但那些利未人，在以色列走迷的时候远离我，自己也随从他们的偶像而离弃我；他们必担当自己的罪责[a]。
  rationale: 将第二个“走迷”的含义明确为“自己也……离弃我”，并以“随从他们的偶像而”表达原文所指的背离与偶像崇拜的关联。这样保留了与前面的“走迷”相呼应的重复，同时维持自然、庄重的现代汉语。罪责及脚注锚点均维持不变。
