reference: Ezekiel 44:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר יְשָׁרְת֤וּ אוֹתָ/ם֙ לִ/פְנֵ֣י גִלּֽוּלֵי/הֶ֔ם וְ/הָי֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/מִכְשׁ֣וֹל עָוֺ֑ן עַל כֵּן֩ נָשָׂ֨אתִי יָדִ֜/י עֲלֵי/הֶ֗ם נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/012.yaml
  text: Because they ministered to them before their idols and became a stumbling block of iniquity for the house of Israel[a], therefore I have raised my hand against them, declares the Lord GOD[b], and they will bear their iniquity.
translation:
  language: zh_hans
  text: 因为他们曾在他们的偶像面前服事他们，成了以色列家的罪孽绊脚石[a]，所以我向他们举手[b]；主耶和华说：他们必担当自己的罪孽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“成为以色列家的罪孽绊脚石。”这保留“绊倒”的隐喻，指他们成为使以色列家陷于罪恶和罪责的缘由。
    reason: 保留原文的绊倒隐喻，以及“罪孽”可涵盖罪行与罪责的语义范围。
  - marker: b
    text: 直译：“我向他们举起我的手。”这是可表示庄严誓言或司法行动的习语；在这里的审判语境中，表达上帝针对他们的宣告。“在他们的偶像面前服事他们”中的两个“他们”在原文中指代压缩：直接宾语可能指偶像，也可能指与偶像有关的人。
    reason: 说明“举手”习语的语义范围，并保留原文直接宾语的真实指代歧义。
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 明确表达本节审判宣告的原因，符合现代汉语因果句式。
- source_word: יְשָׁרְתוּ אוֹתָם
  choice: 服事他们
  rationale: שׁרת 在此具有礼仪服事色彩；保留代词“他们”，不武断判定其指偶像还是与偶像相关的人。
- source_word: לִפְנֵי גִלּוּלֵיהֶם
  choice: 在以色列人的偶像面前
  rationale: לִפְנֵי 表示“在……面前”；גִּלּוּלִים 是以西结书对偶像的贬称。补出代词所指的“以色列人”，使汉语自然；贬义色彩另见脚注。
- source_word: לְבֵית יִשְׂרָאֵל לְמִכְשׁוֹל עָוֺן
  choice: 使以色列家陷入罪孽
  rationale: מִכְשׁוֹל 的绊倒隐喻与 עָוֺן 的罪责含义合起来，表示使以色列家犯罪并招致罪责；正文采用自然汉语，脚注保留原文意象。
- source_word: נָשָׂאתִי יָדִי עֲלֵיהֶם
  choice: 我举手起誓要惩罚他们
  rationale: “举手”是庄严起誓的动作；עֲלֵיהֶם 在审判语境中带有针对、敌对的意味，以“要惩罚他们”表达其司法力度，同时由脚注说明直译。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华如此宣告
  rationale: נְאֻם 是先知宣告公式；אֲדֹנָי 译“主”，神名 יהוה 译“耶和华”，避免两个“主”连续出现。
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: 他们必担当自己的罪孽
  rationale: 保留“担当罪孽”的希伯来表达，兼含承担罪责及其后果之意。
theological_decisions:
- issue: אוֹתָם（“他们”）的指代
  choice: 正文保留“服事他们”
  alternative: 译作“服事那些偶像”或“为拜偶像的人供职”
  rationale: 原文代词的具体先行词并不完全明朗；保留代词，并在脚注说明可能指偶像或与偶像有关的人，以免消除真实歧义。
- issue: “绊脚石/罪孽”的关系
  choice: 使以色列家陷入罪孽
  alternative: 成为以色列家的罪孽绊脚石
  rationale: 原文浓缩地结合绊倒、犯罪和罪责；正文表达其结果，但脚注保留意象及语义张力。
- issue: “举手”动作的含义
  choice: 举手起誓要惩罚他们
  alternative: 向他们举手；举手起誓攻击他们
  rationale: 该习语可侧重起誓，也可在语境中表达司法敌对行动；这里兼顾两者，不将其仅化约为普通攻击。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经传统中最广为普通读者识别的专名译法；与 אֲדֹנָי 合译为“主耶和华”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“服事”“以色列家”“担当罪孽”保留祭司语境和先知文体；通过脚注说明原文隐喻、习语及代词歧义。所有脚注标记均已置于正文。
