  text: They shall not shave their heads[a], nor let their hair grow long; they shall surely trim the hair of their heads.
translation:
  language: zh_hans
  text: 他们不可剃光头，也不可放任头发长长；总要把头发修剪整齐。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句也可译作“务要剪短头发”。希伯来语的表达十分简练，可作几种意义相近的翻译。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלֵּחוּ
  choice: 剃光头
  rationale: 该词是 גלח 的加强词干形式，指剃头发。译作“剃光头”可清楚表明禁令所针对的是把头发剃去，而不是一般的修剪，并避免与末句相冲突。
- source_word: פֶרַע ... יְשַׁלֵּחוּ
  choice: 任由头发长长
  rationale: פֶרַע 在这里指不受约束、未经修剪的头发；יְשַׁלֵּחוּ 字面有“放开、任其发展”之意。合译为“任由头发长长”，符合祭司仪容规定的语境，也自然易懂。
- source_word: כָּסוֹם יִכְסְמוּ
  choice: 总要……修剪整齐
  rationale: 同源不定式与限定动词连用，强调动作确实必须实行；“总要”传达这一强调。קסם 在此指剪短、修整头发，“修剪整齐”自然表达其语境含义。
- source_word: רֹאשָׁם / רָאשֵׁיהֶם
  choice: 头／头发
  rationale: 希伯来文前后均以“头”为表达中心；中文前句用固定说法“剃光头”，末句明说“头发”，可避免“修剪头部”造成误解。
