  text: Then he brought me back by way of the outer gate of the sanctuary[a], the one facing east, and it was shut.
translation:
  language: zh_hans
  text: 随后，他带我回到圣所朝东的外门[a]；那门关着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“随后，他使我转回，来到圣所的外门。”希伯来语动词直译可作“使我返回”或“使我转回”；这里是指向导带以西结回到这座门前。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב אֹתִי
  choice: 他领我原路返回
  rationale: שוב的使役形表示使以西结返回；“领我……返回”既保留向导带领的使役含义，也符合现代汉语叙事。“原路”结合דֶּרֶךְ表达返回所循的路线，但不暗示已经穿门而过。
- source_word: דֶּרֶךְ
  choice: 原路
  rationale: 此处表示返回所经的路途或路线。与“返回”连用译作“原路”，汉语自然，也避免把动作明确说成“穿过”门。
- source_word: שַׁעַר
  choice: 门
  rationale: 在圣所建筑语境中指门或门道；“门”简明自然，并与后文“关闭”搭配。
- source_word: הַמִּקְדָּשׁ
  choice: 圣所
  rationale: מִקְדָּשׁ指分别为圣的场所或圣所范围；“圣所”保留其神圣性质，又不将所指限缩为最里面的房间。
- source_word: הַחִיצוֹן
  choice: 外门
  rationale: 该形容词用来区别外门与异象中的内门；合译为“外门”符合现代汉语建筑表达。
- source_word: הַפֹּנֶה קָדִים
  choice: 朝东的
  rationale: 分词短语说明门的朝向；“朝东的”准确、简洁，并限定所指的那座外门。
- source_word: וְהוּא סָגוּר
  choice: 那门是关闭的
  rationale: סָגוּר表示处于关闭状态。将代词明确为“那门”，避免汉语指代含混；连接词按顺承关系处理，不额外加入转折意味。
