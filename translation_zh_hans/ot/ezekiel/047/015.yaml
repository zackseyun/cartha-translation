base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/015.yaml
  text: 'And this shall be the boundary of the land: on the north side[d][c][b][a], from the Great Sea by the way of Hethlon to Lebo-zedad.'
translation:
  language: zh_hans
  text: “这就是那地的边界：北面从大海[a]起，沿希特伦的路[b]，往西达去。[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大海”指地中海。
    reason: cultural_note
  - marker: b
    text: “沿希特伦的路”也可译作“沿通往希特伦的路”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“到西达”或“到西达的入口”。希伯来语在此类边界描述中可表示通往某地的方向；“入口”的理解并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה גְּבוּל הָ/אָרֶץ
  choice: 这就是那地的边界
  rationale: 希伯来文没有明写系词；中文用“就是”自然表达名词句，并保留这是对异象中那地边界的界定。“边界”符合土地划界语境。
- source_word: לִ/פְאַת צָפוֹנָה
  choice: 北面
  rationale: 简洁表达土地的北侧或北界，并与后面的起点和路线自然衔接。
- source_word: מִן הַ/יָּם הַ/גָּדוֹל
  choice: 从大海起
  rationale: 保留圣经地理称谓“大海”，不在正文中直接以“地中海”取代；“起”明确其作为边界起点的功能。
- source_word: הַ/דֶּרֶךְ חֶתְלֹן
  choice: 沿希特伦的路
  rationale: הַדֶּרֶךְ可指道路或路线；此译法符合划界行文，同时不把希特伦与道路之间的具体地形关系说得过死。
- source_word: לְב֥וֹא צְדָֽדָ/ה
  choice: 直到西达入口
  rationale: 将לְבוֹא按“入口、进路”理解，并把方向词尾所表达的趋向自然译出。由于该短语也可理解为“往西达去”，另以脚注保留歧义。
theological_decisions: []
