  text: וַ/יְשִׁבֵ/נִי֮ אֶל פֶּ֣תַח הַ/בַּיִת֒ וְ/הִנֵּה מַ֣יִם יֹצְאִ֗ים מִ/תַּ֨חַת מִפְתַּ֤ן הַ/בַּ֨יִת֙ קָדִ֔ימָ/ה כִּֽי פְנֵ֥י הַ/בַּ֖יִת קָדִ֑ים וְ/הַ/מַּ֣יִם יֹרְדִ֗ים מִ/תַּ֜חַת מִ/כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/יְמָנִ֔ית מִ/נֶּ֖גֶב לַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/001.yaml
  text: Then he brought me back to the entrance of the house[a], and behold, water was coming out from under the threshold of the house eastward, because the front of the house faced east; and the water was flowing down from under the south side of the house[b], on the right side, south of the altar.
translation:
  language: zh_hans
  text: 他带我回到殿门口[a]。看哪，有水从殿的门槛下流出，向东而去，因为殿面朝东。水从殿的右侧下方流下，就是在祭坛以南[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”，在这里指以西结异象中的圣殿建筑。
    reason: lexical_alternative
  - marker: b
    text: “殿的右侧”原文直译为“殿的右肩”；“肩”在这里是指建筑物侧面的空间用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשִׁבֵנִי
  choice: 他带我回到
  rationale: 该词是שׁוב的使役式，带第一人称单数宾语后缀，意为“使我返回”；“带我回到”自然保留了使役含义。
- source_word: פֶּתַח הַבַּיִת
  choice: 殿门口
  rationale: פֶּתַח指入口或门口；הַבַּיִת字面为“这房屋”，在本异象中指圣殿建筑。正文用“殿”可避免现代读者误解为普通住宅，同时脚注保留字面信息。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示读者注意眼前景象的语篇功能，并维持庄重而易懂的叙事语体。
- source_word: מַיִם יֹצְאִים
  choice: 有水……流出
  rationale: מַיִם虽具复数形式，汉语自然表达用“水”；分词表示持续发生的动作，以“流出”准确呈现。
- source_word: מִתַּחַת מִפְתַּן
  choice: 从……门槛下
  rationale: 直接呈现水由门槛下方出来的空间关系；מִפְתָּן指门槛。
- source_word: קָדִימָה
  choice: 向东而去
  rationale: 该方向副词意为“向东”；结合水流语境译作“向东而去”，既明确方向又自然。
- source_word: כִּי פְנֵי הַבַּיִת קָדִים
  choice: 因为殿面朝东
  rationale: כִּי在此说明水向东流出的原因；“面朝东”简明表达建筑正面的朝向。
- source_word: יֹרְדִים
  choice: 流下
  rationale: 本义为“下去、下降”；以水为主语时，“流下”自然体现向下运动。
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית
  choice: 从殿的右侧下方
  rationale: כָּתֵף字面为“肩”，在建筑空间用语中指侧面；הַיְמָנִית明确为右侧。译文保留右侧方位，并用脚注交代“肩”的字面表达。
- source_word: מִנֶּגֶב לַמִּזְבֵּחַ
  choice: 在祭坛以南
  rationale: נֶגֶב在此为方位“南”；该短语说明水流相对于祭坛的位置。用“就是”连接，呈现原文后置的空间补充说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“看哪”保留原文的视觉提示和异象语气；正文以“殿”清楚传达语境所指，以脚注保留“房屋”的字面形式。末句不把“右侧”和“祭坛以南”合并成单一方位，而分别呈现原文两个空间说明。
