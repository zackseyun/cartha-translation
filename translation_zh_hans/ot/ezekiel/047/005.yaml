base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/005.yaml
  text: Again he measured a thousand[a], and it was a river that I could not cross, because the waters had risen—waters to swim in[b], a river that could not be crossed.
translation:
  language: zh_hans
  text: 他又量了一千肘[a]，那是一条我无法渡过的河，因为水势高涨，水深得可以游泳[b]，是一条无法渡过的河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只作“一千”；计量单位“肘”根据上文补出。
    reason: implicit_unit
  - marker: b
    text: 原文直译“游泳之水”，即深得足以游泳的水。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: 他又量了
  rationale: 承接前文连续量水的叙事；“又”自然体现希伯来语叙事时态在此处所表达的再次行动。
- source_word: אֶלֶף
  choice: 一千肘
  rationale: 原文只写“一千”，但计量单位由紧接的上文明确为“肘”；正文补出“肘”以便现代读者理解，并用脚注说明。
- source_word: נַחַל
  choice: 河
  rationale: 该词可指溪流、河谷或急流；本异象中水已深至可以游泳，译作“河”最符合此处景象。
- source_word: אֲשֶׁר לֹא אוּכַל לַעֲבֹר
  choice: 我无法渡过
  rationale: 保留第一人称及能力含义；“渡过”准确表达越过水流，又不把方式限定为步行涉水。
- source_word: גָאוּ הַמַּיִם
  choice: 水势高涨
  rationale: גאה在此表示水上涨、涨大；“水势高涨”既呈现水位上升，也符合现代汉语表达。
- source_word: מֵי שָׂחוּ
  choice: 深得可以游泳
  rationale: 直译为“游泳之水”，意思是水深已足以游泳；意译后自然清楚，同时以脚注保留原文表达。
- source_word: נַחַל אֲשֶׁר לֹא יֵעָבֵר
  choice: 一条无法渡过的河
  rationale: 尼法勒式表达被动或非人称意义，即河无法被渡过；重复“河”保留原文强调性的重述。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“这时水已成河”顺畅表达 נַחַל 在量过一千肘后形成的述谓关系；末尾保留原文重复，以突出河水已经无法渡过。
