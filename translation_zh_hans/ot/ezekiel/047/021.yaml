  yaml_path: translation/ot/ezekiel/047/021.yaml
  text: So you shall divide this land among yourselves according to the tribes of Israel[a].
translation:
  language: zh_hans
  text: 你们要按以色列各支派，把这地分给自己。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要为自己把这地分给以色列各支派。”
    reason: 介词 לְ 可理解为划分所依据的支派单位，也可理解为土地分配的对象；脚注保留后一种较贴近形式的读法。
lexical_decisions:
- source_word: וְחִלַּקְתֶּם
  choice: 你们要……分
  rationale: חלק 的 Piel 词干表示“划分、分配”。这里用“分”简洁自然；前缀 וְ 承接上文所述疆界，汉语无需机械译作“并且”，以保持自然连贯。
- source_word: אֶת
  choice: 不译（直接宾语标记）
  rationale: 希伯来语直接宾语标记在现代汉语中没有独立对应词。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: 直译为“这地”，符合本段分配土地的语境，也保留圣经叙事中庄重简洁的表达。
- source_word: לָכֶם
  choice: 给自己
  rationale: 该形式字面义为“给你们自己／为你们自己”。译作“给自己”保留受益或归属意味，不把它过度解释为彼此之间的分配。
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: 按以色列各支派
  rationale: 介词 לְ 在此可表达分配所依据或面向的对象。结合土地划分语境，“按以色列各支派”自然地传达按支派进行划分，同时脚注保留“给各支派”的可能读法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这地”比“这片土地”更简洁，也与先知书的领土语境相称；句序调整为自然汉语，同时保留原文两个 לְ 短语之间的解释张力。
