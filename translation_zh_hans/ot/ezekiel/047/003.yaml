  text: בְּ/צֵאת הָ/אִ֥ישׁ קָדִ֖ים וְ/קָ֣ו בְּ/יָד֑/וֹ וַ/יָּ֤מָד אֶ֨לֶף֙ בָּֽ/אַמָּ֔ה וַ/יַּעֲבִרֵ֥/נִי בַ/מַּ֖יִם מֵ֥י אָפְסָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/003.yaml
  text: As the man went out eastward with a measuring line in his hand[a], he measured a thousand cubits and led me through the water, water up to the ankles.
translation:
  language: zh_hans
  text: 那人手里拿着量绳向东走出去时，量了一千肘，领我从水中走过；水深到脚踝[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“脚踝之水”，即水深到脚踝。
    reason: 说明原文独特的构造表达及正文的意译。
lexical_decisions:
- source_word: בְּצֵאת
  choice: 走出去时
  rationale: 带介词 בְּ 的不定词结构表示时间关系；译作“……时”简洁自然。
- source_word: הָאִישׁ
  choice: 那人
  rationale: 此处指上文已经出现的男性人物；“那人”符合汉语叙事习惯，也保留原文的指称。
- source_word: קָדִים
  choice: 向东
  rationale: 该词在此表示方向；“向东”准确而自然。
- source_word: וְקָו בְּיָדוֹ
  choice: 手里拿着量绳
  rationale: קָו 在此是用于测量的绳线；将原文“绳在他手中”自然表达为“手里拿着量绳”。
- source_word: וַיָּמָד אֶלֶף בָּאַמָּה
  choice: 量了一千肘
  rationale: בָּאַמָּה 表示测量所用的长度单位；“肘”保留古代计量单位，不擅自换算。
- source_word: וַיַּעֲבִרֵנִי
  choice: 领我……走过
  rationale: עבר 的使役形表示“使我经过”；“领我走过”保留使役和引导意味，同时符合现代汉语。
- source_word: בַמַּיִם
  choice: 从水中
  rationale: מַיִם 形式上为复数，但在此通常表示水这一整体；“从水中走过”符合场景。
- source_word: מֵי אָפְסָיִם
  choice: 水深到脚踝
  rationale: 原文构造短语近于“脚踝之水”，表达水达到脚踝的深度；正文采用清楚自然的现代汉语。
theological_decisions: []
