source:
  edition: WLC
  text: וְ/הָיָ֣ה כָל נֶ֣פֶשׁ חַיָּ֣ה אֲֽשֶׁר יִשְׁרֹ֡ץ אֶ֣ל כָּל אֲשֶׁר֩ יָב֨וֹא שָׁ֤ם נַחֲלַ֨יִם֙ יִֽחְיֶ֔ה וְ/הָיָ֥ה הַ/דָּגָ֖ה רַבָּ֣ה מְאֹ֑ד כִּי֩ בָ֨אוּ שָׁ֜מָּ/ה הַ/מַּ֣יִם הָ/אֵ֗לֶּה וְ/יֵרָֽפְאוּ֙ וָ/חָ֔י כֹּ֛ל אֲשֶׁר יָ֥בוֹא שָׁ֖מָּ/ה הַ/נָּֽחַל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/009.yaml
  text: And every living creature that swarms[a], wherever the river goes, will live. And there will be very many fish, because these waters go there and are healed[b]; everything will live wherever the river goes.
translation:
  language: zh_hans
  text: 凡有生命、成群活动的活物，凡两股水流所到之处[a]，都必存活。鱼也必极其繁多，因为这些水到了那里，就得了医治[b]；河流所到之处，一切都必存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “两股水流”原文为双数形式，也可理解为“两条水道”或泛指“水道”；不少译本按上下文译作单数“河流”。
    reason: 保留原文罕见的双数形式及其解释空间。
  - marker: b
    text: 也可译作：“这些水到了那里，使那里的水得医治。”原文明说水“得医治”；句法上可理解为这些水本身或那里的水得到医治。
    reason: 说明代词所指的歧义，并保留原文明确的医治意象。
lexical_decisions:
- source_word: נֶפֶשׁ חַיָּה
  choice: 活物
  rationale: 该短语泛指有生命的受造物，并非特指人的“灵魂”；本节语境是水生动物。
- source_word: יִשְׁרֹץ
  choice: 成群游动
  rationale: 该动词描写生物大量群集、繁衍活动，尤常用于水中生物；此译既保留群集的动态，也符合现代汉语表达。
- source_word: נַחֲלַיִם
  choice: 双流
  rationale: 马所拉文本此处采用双数形式，译作“双流”保留其形态特征；具体是两股水流还是泛指诸水道，仍有解释空间，故加注说明。
- source_word: יִחְיֶה
  choice: 必存活
  rationale: 忠实表达“活着、存活”的基本意义，并以“必”体现异象宣告的确定语气。
- source_word: הַדָּגָה רַבָּה מְאֹד
  choice: 鱼也必极其繁多
  rationale: הַדָּגָה 是集合名词，指鱼类总体；רַבָּה מְאֹד 在此强调数量极多。
- source_word: וְיֵרָפְאוּ
  choice: 水就得医治
  rationale: 保留 רפא 的“医治”意象，不将其淡化为单纯的“变淡”或“变清”；同时避免在正文中过度限定究竟是哪部分水得医治。
- source_word: וָחָי כֹּל
  choice: 万物都必存活
  rationale: 概括河流带来生命的全面效果；“万物”在现代汉语中自然表达这里的总体性。
- source_word: הַנָּחַל
  choice: 河流
  rationale: 虽可指溪流或河谷水道，但本异象描写持续涌流并带来生命的水体，“河流”最清楚自然。
theological_decisions:
- issue: 水得医治的异象性表达
  choice: 保留“水就得医治”
  alternative: 译作“水就变得清新”或“那里的水就得到洁净”
  rationale: 原文明确使用“医治”一词，将水人格化地描写为得到恢复。保留这一张力可呈现异象中的复苏意象，而不预先限定其神学含义。
- issue: 双数形式与单一河流的关系
  choice: 前半句译“双流”，末句译“河流”
  alternative: 两处均统一译作“河流”
  rationale: 原文前处 נַחֲלַיִם 为双数形式，后处 הַנָּחַל 为单数。分别呈现其语法差异，不强行解释双流如何与单一河流相连。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“成群游动”呈现水生物群集活动的画面；“得医治”刻意保留异象的拟人化表达。正文中的[a]、[b]均与脚注对应。
