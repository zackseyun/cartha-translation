  text: וְ/הָיָ֣ה בַ/שֵּׁ֔בֶט אֲשֶׁר גָּ֥ר הַ/גֵּ֖ר אִתּ֑/וֹ שָׁ֚ם תִּתְּנ֣וּ נַחֲלָת֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/023.yaml
  text: And it shall be that in the tribe with which the sojourner resides[a], there you shall give him his inheritance, declares the Lord GOD.
translation:
  language: zh_hans
  text: 寄居者与哪一支派同住，你们就要在那里把他的产业分给他。这是主耶和华的宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: （以全句“就要”体现）
  rationale: 这是承接上文并引出将来法律规定的表达。汉语不另译作生硬的“事情将是”，而用条件句中的“就要”自然体现其未来和规定性。
- source_word: בַשֵּׁבֶט
  choice: 与哪个支派
  rationale: שֵׁבֶט在分地语境中指以色列的支派及其地域，不是杖或权杖；结合后面的אִתּוֹ译为“与哪个支派同住”，既保留关联关系，也符合现代汉语。
- source_word: אֲשֶׁר גָּר הַגֵּר אִתּוֹ
  choice: 寄居者与哪个支派同住
  rationale: גֵּר指在以色列群体中定居的外来者，并非仅仅路过的旅客。原文单数代词אִתּוֹ可按支派或其成员作集合性理解；译文不把这一关系过度具体化。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留地点上的强调：产业应在寄居者所同住的那个支派中分给他。
- source_word: תִּתְּנוּ
  choice: 你们就要……分给
  rationale: 第二人称复数，在法律分地语境中具有规定性；“分给”比单纯“给”更清楚地表达土地分配。
- source_word: נַחֲלָתוֹ
  choice: 他的产业
  rationale: נַחֲלָה在本章指所分得、可承受的土地份额；“产业”是简洁而庄重的圣经土地术语。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知信息中的权威宣告公式；אֲדֹנָי译作“主”，יהוה以“耶和华”音译，避免把两个称号合并。
theological_decisions:
- issue: 寄居者能否在支派中取得产业
  choice: 直译为“把他的产业分给他”
  alternative: 弱化为一般居住权或临时土地使用权
  rationale: 原文明确使用נַחֲלָה，并以第三人称属格称“他的产业”；译文保留寄居者获得支派土地份额这一具有神学张力的规定，不加限制性解释。
- issue: 神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时出现主权称号אֲדֹנָי与四字神名יהוה。“主耶和华”在简体中文圣经语体中清楚区分二者，并保留神名的专名性质。
translation_notes:
  register: 采用现代、庄重而易懂的法律—先知语体。条件结构“与哪个支派同住……就要在那里……”自然呈现原文规定性，并保留“寄居者”“产业”“宣告”等关键术语。
