  text: וּ/פְאַת יָם֙ הַ/יָּ֣ם הַ/גָּד֔וֹל מִ/גְּב֕וּל עַד נֹ֖כַח לְב֣וֹא חֲמָ֑ת זֹ֖את פְּאַת יָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/020.yaml
  text: And the west side shall be the Great Sea[a], from the border up to opposite Lebo-hamath[b]. This is the west side.
translation:
  language: zh_hans
  text: 西面的边界是大海[a]，从边界一直延伸到利波—哈马[b]对面。这是西面的边界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大海”指地中海。
    reason: cultural_note
  - marker: b
    text: 希伯来文“利波—哈马”传统上也理解为“哈马口”或“通往哈马的入口”；这里很可能是北部边界的一处地名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת יָם
  choice: 西面的边界
  rationale: פְּאַת יָם字面为“海的一面”，但在以色列的地理和边界描述中指朝向地中海的西面。“西面的边界”既传达方位，也符合本段划界语境。
- source_word: הַיָּם הַגָּדוֹל
  choice: 大海
  rationale: 该词组是希伯来语对地中海的常用称呼。保留“大海”这一原文称谓，并以脚注说明其所指。
- source_word: מִגְּבוּל
  choice: 从边界
  rationale: גְּבוּל意为“边界、界线”。原文没有进一步明确这里所指的具体界点，因此译文保留这种简略性，不擅自补充。
- source_word: עַד נֹכַח
  choice: 一直延伸到……对面
  rationale: עַד表示界限所至，נֹכַח表示空间上的“正对面、对面”。加入“延伸”使现代汉语边界描述自然，同时不改变空间关系。
- source_word: לְבוֹא חֲמָת
  choice: 利波—哈马
  rationale: 该表达在边界公式中很可能用作地名；音译可避免在正文中直接判定为普通名词短语。其传统理解和字面含义在脚注中交代。
- source_word: זֹאת פְּאַת יָם
  choice: 这是西面的边界
  rationale: 这是对刚才所述界线的总结句。按语境将“海的一面”译为“西面的边界”，并保留原文简洁的指示结构。
