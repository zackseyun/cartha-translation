  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יּוֹצִאֵ/נִי֮ דֶּֽרֶךְ שַׁ֣עַר צָפוֹנָ/ה֒ וַ/יְסִבֵּ֨/נִי֙ דֶּ֣רֶךְ ח֔וּץ אֶל שַׁ֣עַר הַ/ח֔וּץ דֶּ֖רֶךְ הַ/פּוֹנֶ֣ה קָדִ֑ים וְ/הִנֵּה מַ֣יִם מְפַכִּ֔ים מִן הַ/כָּתֵ֖ף הַ/יְמָנִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/002.yaml
  text: Then he brought me out by way of the north gate[a], and led me around by the outside way to the outer gate, the one facing east; and behold[b], water was trickling from the right side.
translation:
  language: zh_hans
  text: 他领我从北门出去，又带我从外面的路绕到朝东的外门。看哪，有水从右侧[b]涓涓流出[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“冒出来”或“流出来”；希伯来语动词描写水初初涌流或涓流的样子，并非已经形成大水流。
    reason: lexical_alternative
  - marker: b
    text: 直译“右肩”；“肩”在这里指建筑物或地形的侧面、侧翼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: 他领我……出去
  rationale: 使役形表达使说话者出去；在异象中有人引导以西结察看圣殿，用“领我出去”既保留使役方向，也符合现代汉语叙事。
- source_word: דֶּרֶךְ שַׁעַר צָפוֹנָה
  choice: 从北门
  rationale: דֶּרֶךְ标明所经路线，צָפוֹנָה指向北方；汉语用“从北门”自然表达经由北面的门出去。
- source_word: וַיְסִבֵּנִי
  choice: 又带我……绕到
  rationale: סבב的使役形表示使人绕行；“带我绕到”清楚表现引导者领先知沿外部迂回前往另一道门。
- source_word: דֶּרֶךְ חוּץ
  choice: 从外面的路
  rationale: חוּץ指外部；此处说明路线位于建筑群外面，“从外面的路”保留空间关系且通顺。
- source_word: אֶל שַׁעַר הַחוּץ
  choice: 到……外门
  rationale: 该短语指圣殿区域的外门；“外门”简洁保留内外层次。
- source_word: דֶּרֶךְ הַפּוֹנֶה קָדִים
  choice: 朝东的
  rationale: 分词הַפּוֹנֶה描述门的朝向，קָדִים为东方；译为“朝东的”自然明确。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה引导读者注意突然映入眼帘的景象；“看哪”保留先知异象的鲜明、庄重语气。
- source_word: מַיִם מְפַכִּים
  choice: 有水……涓涓流出
  rationale: 罕见动词פכה描写水刚开始流出，可理解为涓流、冒出或流出；“涓涓流出”表现此处水量尚小，并与后文水势渐深形成自然推进。
- source_word: מִן הַכָּתֵף הַיְמָנִית
  choice: 从右侧
  rationale: כָּתֵף本义为“肩”，在建筑或地形描述中可指侧面、侧翼；“右侧”在汉语中清楚自然，又不强行补出原文未明说的具体建筑部位。
theological_decisions:
- issue: 水所流出的具体建筑部位
  choice: 仅译“从右侧”，不补作“圣殿右侧”或“门的右侧”
  alternative: 从圣殿右侧／从门的右侧
  rationale: 希伯来文使用建筑性隐喻“右肩”，但本节没有在该短语中明说其所依附的名词；保持“右侧”可避免消除原文留下的指涉张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”保留先知异象的现场感；“涓涓流出”兼顾罕见希伯来动词的动态意象及本段水势由小变大的语境。脚注标记按其实际所注释的词语安放，纠正了咨询层中标记位置与脚注内容不相配的问题。
