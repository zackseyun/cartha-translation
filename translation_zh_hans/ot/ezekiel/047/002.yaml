  terminology: “北门”“外门”“朝东”“看哪”与本段圣殿异象的常用庄重表达相称。“右侧”避免了“右肩”的字面歧义；“涓涓流出”与脚注所说明的词义范围一致。脚注标记a置于“涓涓流出”、b置于“右侧”，均与各自说明正确对应。
