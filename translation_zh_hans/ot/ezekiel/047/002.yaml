  source_fidelity: 译文准确呈现了希伯来文的行动次序与空间路线：引导者领先知经北门出去，再沿外面的路线绕到朝东的外门；随后以“看哪”引出所见之水。将מְפַכִּים译作“涓涓流出”恰当地表达小股、初起的流动；“从右侧”也自然保留了כָּתֵף在此处指建筑侧面／侧翼而非人体肩膀的用法，且未擅自界定其具体所附的建筑物。
