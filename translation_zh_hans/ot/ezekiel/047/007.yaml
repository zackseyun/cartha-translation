  text: בְּ/שׁוּבֵ֕/נִי וְ/הִנֵּה֙ אֶל שְׂפַ֣ת הַ/נַּ֔חַל עֵ֖ץ רַ֣ב מְאֹ֑ד מִ/זֶּ֖ה וּ/מִ/זֶּֽה־׃
base_translation:
