  yaml_path: translation/ot/ezekiel/047/007.yaml
  text: When I returned[a], behold, on the bank of the stream were very many trees, on this side and on that side.
translation:
  language: zh_hans
  text: 我回来时，看哪，溪流岸边有许许多多的树，这边和那边都有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“溪流两岸都有”。希伯来语直译为“从这边和从那边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּבֵנִי
  choice: 我回来时
  rationale: שוב 的 Qal 不定式附属形带第一人称单数后缀，在此作时间状语，直指先知自己的返回；译为“我回来时”自然且贴合形态。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该提示词引出突然映入眼帘的景象；“看哪”保留先知文学中鲜明的指示和唤起注意之力。
- source_word: אֶל שְׂפַת הַנַּחַל
  choice: 溪流岸边
  rationale: שׂפה 在此指边缘或岸，נחל 在异象中有水流动，译作“溪流”比“干河谷”合乎语境，也避免用“河”过度限定水体规模。
- source_word: עֵץ רַב מְאֹד
  choice: 许许多多的树
  rationale: עֵץ 虽为单数形式，却可作集合名词；רַב מְאֹד 表示数量极多。“许许多多的树”以自然现代汉语传达集合性和强度。
- source_word: מִזֶּה וּמִזֶּה
  choice: 这边和那边都有
  rationale: 保留希伯来语“从这边和从那边”的空间分列感，同时用自然汉语清楚表达溪流两岸皆有树木。
