base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/018.yaml
  text: And the eastern side shall be from between Hauran and Damascus[a], and between Gilead and the land of Israel, the Jordan, from the border to the eastern sea; you shall measure the eastern side.
translation:
  language: zh_hans
  text: 东界：从浩兰和大马士革之间，又从基列和以色列地之间，沿约旦河，从边界直到东边的海[a]；你们要量度东界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或特指“死海”；希伯来文直译为“东边的海”。
    reason: 说明该描述性名称可能所指的具体水域，同时让正文保留原文措辞。
lexical_decisions:
- source_word: פְאַת
  choice: 面／边界
  rationale: 此处描述领土的一个方位边界；开头用“东面”自然引出方位，结尾用“东面的边界”明确其疆界含义。
- source_word: קָדִים / קָדִימָה
  choice: 东面／东面的
  rationale: 两个词都标明东方；译文保留首尾呼应的边界公式。
- source_word: מִבֵּין ... וּמִבֵּין ...
  choice: 在……之间，以及……之间
  rationale: 保留两组地域之间的对应关系，同时避免生硬照搬希伯来语介词结构。
- source_word: חַוְרָן
  choice: 浩兰
  rationale: 采用现代中文圣经地名的常见音译。
- source_word: דַּמֶּשֶׂק
  choice: 大马士革
  rationale: 采用现代中文通行地名。
- source_word: הַגִּלְעָד
  choice: 基列
  rationale: 采用中文圣经传统且通行的地区名称。
- source_word: אֶרֶץ יִשְׂרָאֵל
  choice: 以色列地
  rationale: 保留原文中“地”的成分，以区别于以色列民。
- source_word: הַיַּרְדֵּן
  choice: 约旦河
  rationale: 原文直接使用约旦之名；中文补出“河”可清楚表明这里所指的地理边界。
- source_word: מִגְּבוּל
  choice: 从边界
  rationale: 原文只说“边界”，未明说“北边界”；正文不补入方位，以保留其简略性。
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: 东边的海
  rationale: 按原文保留描述性名称，不在正文直接改成推定的地理名称“死海”。
- source_word: תָּמֹדּוּ
  choice: 你们要……量到
  rationale: 保留מדד“量”的基本意义，并与本章测量边界的语境相呼应。
theological_decisions: []
translation_notes:
  register: 采用庄重而明白的现代标准汉语。原文的边界句法较为压缩，译文以冒号和分号理清地域关系；“以约旦河为界”表达原文中“约旦河”作为边界线的同位功能，但不补出原文未明说的“北边界”。
