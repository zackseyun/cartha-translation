  - severity: low
    issue: 开头“在……之间”未明示原文重复的“从”。
    rationale: 现代汉语可作一定简化，但在此高度压缩且存在地理句法难点的边界描述中，保留“从……之间”有助于反映原文的两组起点／分界关系。
