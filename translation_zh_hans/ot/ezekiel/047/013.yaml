source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה גֵּ֤ה גְבוּל֙ אֲשֶׁ֣ר תִּתְנַחֲל֣וּ אֶת הָ/אָ֔רֶץ לִ/שְׁנֵ֥י עָשָׂ֖ר שִׁבְטֵ֣י יִשְׂרָאֵ֑ל יוֹסֵ֖ף חֲבָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/013.yaml
  text: 'Thus says the Lord GOD: This is the boundary by which you shall apportion the land as an inheritance among the twelve tribes of Israel[a]; Joseph shall have two portions.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“你们要按以下疆界，把这地分给以色列十二支派作为产业；约瑟要得两份[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“约瑟，份地”；这里指约瑟要得双份领地。
    reason: 原文仅用复数名词“份地”，译文依语境明确为“两份”。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 按现代中文圣经语体，将复合神名自然译为“主耶和华”，既保留“主”的称号，也音译四字神名。
- source_word: גֵּה גְבוּל
  choice: 按以下疆界
  rationale: 此短语引出下文将要划定的边界；“以下疆界”比孤立的“这是疆界”更符合现代中文，同时保留指示功能。
- source_word: תִּתְנַחֲלוּ אֶת־הָאָרֶץ
  choice: 把这地分……作为产业
  rationale: 该动词在本段不仅指承受，也涉及按产业分配土地；此译兼顾分配与继承产业两层含义。
- source_word: לִשְׁנֵי עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: 给以色列十二支派
  rationale: 介词在此表示土地分配的对象；“给”简洁自然。
- source_word: יוֹסֵף חֲבָלִים
  choice: 约瑟要得两份
  rationale: 马所拉文本直译近似“约瑟，份地”，未明说数词“二”；上下文及约瑟由两个支派承受土地的背景支持双份之意，但以脚注说明原文简略，避免掩盖其表达形式。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”是现代中文读者熟悉且庄重的表达，并保留专名性质；不以泛称“上帝”取代经文中的四字神名。
- issue: 约瑟所得份额的数目
  choice: 正文译作“两份”，并用脚注交代原文措辞
  alternative: 约瑟要得份地；约瑟要得各份土地
  rationale: 约瑟通过以法莲和玛拿西形成两个领地份额，这是语境所指；但希伯来文仅用复数“份地”，故用脚注保存原文的简略与潜在歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“按以下疆界”承接后文的土地划界；“作为产业”保留 נחל 的产业继承语义。
