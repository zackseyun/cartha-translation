base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/019.yaml
  text: And the south side[a], southward, shall be from Tamar to the waters of Meriboth-kadesh, to the wadi, to the Great Sea. This is the south side[c][b], southward.
translation:
  language: zh_hans
  text: 南面的边界，向南，要从他玛起，到米利波特·加低斯[a]的水域，到溪谷[b]，到大海[c]。这就是南面的边界，向南。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“米利巴·加低斯的水域”。本节希伯来文作“米利波特·加低斯”，是一个相关的地名形式。
    reason: alternative_reading
  - marker: b
    text: “溪谷”所译的希伯来词在这里指河床或水道，往往是季节性的。
    reason: lexical_alternative
  - marker: c
    text: 即地中海。
    reason: cultural_note
lexical_decisions:
- source_word: פְאַת
  choice: 边
  rationale: 在划定疆界的语境中，指土地的一边或边界；“边”简洁自然，也适合本节首尾重复的界线公式。
- source_word: נֶגֶב / תֵּימָנָה
  choice: 南边，就是朝南的一边
  rationale: 两个近义方向词并用，既指出南边，也重申朝南的方位；译文保留这种强调，而不把 נֶגֶב 处理成地名“南地”。
- source_word: מִתָּמָר
  choice: 从他玛起
  rationale: 作为地名音译；“起”符合现代汉语描述边界起点的习惯。
- source_word: מֵי מְרִיבוֹת קָדֵשׁ
  choice: 米利波·加低斯的水域
  rationale: 按本节马所拉文本的地名形式 מְרִיבוֹת 音译为“米利波”；מֵי 译为“水域”，避免擅自限定为泉、河或湖。
- source_word: נַחֲלָה
  choice: 溪谷
  rationale: 此处处于一连串地理界标中，指河谷或水道，而非“产业”；“溪谷”可涵盖常年或季节性水道，脚注补明其语义范围。
- source_word: הַיָּם הַגָּדוֹל
  choice: 大海
  rationale: 保留圣经惯用的地理称谓，不在正文中直接替换为解释性的“地中海”。
- source_word: וְאֵת פְּאַת תֵּימָנָה נֶגְבָּה
  choice: 这就是南边，朝南的一边
  rationale: 原文结尾是省略谓语的复述总结；补出“这就是”使现代汉语通顺，同时保留方向词的重复强调。
theological_decisions: []
