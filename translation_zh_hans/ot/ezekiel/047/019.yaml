  to: 南面的边界，向南，要从他玛起，到米利波特·加低斯[a]的水域，到溪谷[b]，到大海[c]。这就是南面的边界，向南。
  rationale: 修订地名音译以更完整反映马所拉文本的 Meriboth 形式；将界标串列改为重复“到”，避免增添“直达”的路线语气；并以“南面的边界，向南”使边界公式在现代标准汉语中更自然，同时保留原文的方向重复。
