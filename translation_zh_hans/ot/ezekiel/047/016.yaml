source:
  edition: WLC
  text: חֲמָ֤ת בֵּר֨וֹתָה֙ סִבְרַ֔יִם אֲשֶׁר֙ בֵּין גְּב֣וּל דַּמֶּ֔שֶׂק וּ/בֵ֖ין גְּב֣וּל חֲמָ֑ת חָצֵר֙ הַתִּיכ֔וֹן אֲשֶׁ֖ר אֶל גְּב֥וּל חַוְרָֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/016.yaml
  text: Hamath[a], Berothah, Sibraim—which is between the border of Damascus and the border of Hamath—Hazer-hattikon[c][b], which is toward the border of Hauran.
translation:
  language: zh_hans
  text: 哈马、比罗他[a]、西伯莲（位于大马士革边界与哈马边界之间）、哈洗·哈提干[b]（朝向浩兰边界[c]）。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“比罗他”；有人将其与《撒母耳记下》8:8的近似地名“比罗他伊”相比较。
    reason: alternative_reading
  - marker: b
    text: “哈洗·哈提干”很可能是地名；其组成部分直译大致为“中间的围场（或村落）”。
    reason: lexical_alternative
  - marker: c
    text: “朝向”也可理解为“靠近”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָת
  choice: 哈马
  rationale: 按希伯来语专名音译，并采用现代中文圣经地名中通行的形式；本处只有“哈马”，没有“哈马口”的完整表达。
- source_word: בֵּרוֹתָה
  choice: 比罗他
  rationale: 按马所拉文本此处的专名形式音译；相关经文另有近似地名“比罗他伊”，但不据此改写正文。
- source_word: סִבְרַיִם
  choice: 西伯莲
  rationale: 作为边界清单中的地名音译；关系从句在语法上最自然地修饰这一紧邻的地名。
- source_word: אֲשֶׁר בֵּין גְּבוּל דַּמֶּשֶׂק וּבֵין גְּבוּל חֲמָת
  choice: 位于大马士革边界与哈马边界之间
  rationale: 保留两个“边界”的重复意义，并用括号清楚显示此说明修饰“西伯莲”。
- source_word: חָצֵר הַתִּיכוֹן
  choice: 哈洗·哈提干
  rationale: 上下文是地名清单，因此将整个词组视为复合地名并音译，不在正文中直译为“中间的村落/围场”。
- source_word: אֲשֶׁר אֶל גְּבוּל חַוְרָן
  choice: 朝向浩兰边界
  rationale: אֶל在边界描述中可表示方向或邻近；正文采用“朝向”以避免断言该地恰在边界线上，并以脚注保留另一种理解。
- source_word: גְּבוּל
  choice: 边界
  rationale: 在划定土地范围的语境中，“边界”准确表达界线或界限，比“领土”更贴近原词。
theological_decisions: []
