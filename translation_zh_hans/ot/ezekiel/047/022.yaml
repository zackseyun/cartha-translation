source:
  edition: WLC
  text: וְ/הָיָ֗ה תַּפִּ֣לוּ אוֹתָ/הּ֮ בְּ/נַחֲלָה֒ לָ/כֶ֗ם וּ/לְ/הַ/גֵּרִים֙ הַ/גָּרִ֣ים בְּ/תוֹכְ/כֶ֔ם אֲשֶׁר הוֹלִ֥דוּ בָנִ֖ים בְּ/תֽוֹכְ/כֶ֑ם וְ/הָי֣וּ לָ/כֶ֗ם כְּ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אִתְּ/כֶם֙ יִפְּל֣וּ בְ/נַחֲלָ֔ה בְּ/ת֖וֹךְ שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/022.yaml
  text: And it shall be that you shall allot it as an inheritance for yourselves and for the sojourners who sojourn among you[a], who have fathered children among you; and they shall be to you like a native among the sons of Israel[c][b]. With you they shall receive an inheritance among the tribes of Israel.
translation:
  language: zh_hans
  text: 你们要把这地作为产业分配给自己，也分配给住在你们中间的寄居者[a]，就是在你们中间生有儿女的人[b]。他们在你们看来要如同以色列人中的本地人[c]；他们要和你们一同在以色列各支派中分得产业。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“外来居民”或“侨居者”；希伯来语指居住在以色列人中间、具有一定社会法律地位的非本地人。
    reason: lexical_alternative
  - marker: b
    text: 较直译为“生了儿子的人”。
    reason: lexical_alternative
  - marker: c
    text: “本地人”也可译作“本地出生的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפִּלוּ / יִפְּלוּ（נפל，与 נַחֲלָה 连用）
  choice: 分作产业 / 分得产业
  rationale: 前一处为使役形，指把土地分配出去；后一处为基本词干，指实际获得所分的产业。这样的译法既体现两处动词的呼应，也符合现代汉语表达。
- source_word: נַחֲלָה
  choice: 产业
  rationale: 本节处于土地分配的语境，指作为承继份额而取得的土地。“产业”兼顾土地权属与承继含义，也符合庄重的经文语体。
- source_word: הַגֵּרִים / הַגָּרִים בְּתוֹכְכֶם
  choice: 寄居在你们中间的寄居者
  rationale: גֵּר 指住在以色列群体中、具有一定社会法律地位的非本地人，并非短暂停留的旅客。重复“寄居”保留原文名词与分词的词根呼应。
- source_word: הוֹלִדוּ בָנִים
  choice: 生养儿女
  rationale: 该短语直译涉及“生了儿子”，但此处重点是这些寄居者已在群体中建立家庭并延续后代。“生养儿女”自然地表达这一社会法律背景；脚注保留形式上更直译的可能。
- source_word: כְּאֶזְרָח
  choice: 看作……本地人
  rationale: אֶזְרָח 指本地出生、属于当地共同体的人；介词 כְּ 保持比较或同等看待的语气，而不额外引入现代国籍制度中的“公民”概念。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: 以色列人中
  rationale: 这是自然的现代汉语表达；其希伯来语形式直译为“以色列的子孙中”，但此处指以色列共同体成员。
- source_word: אִתְּכֶם
  choice: 和你们一同
  rationale: 突出寄居者与以色列人共同参与土地分配，而不是仅获准居住。
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: 在以色列各支派中
  rationale: 准确表达所得产业位于以色列的支派分配体系之内。
theological_decisions:
- issue: 复兴之地中寄居者的身份与产业权
  choice: 明确表达已在群体中建立家庭的寄居者与以色列本地人一同获得土地产业。
  alternative: 仅理解为给予保护或居住权，而非土地产业；或仅作象征性陈述。
  rationale: 原文反复使用产业及分配、获得产业的词语，并称他们如同以色列人中的本地人，语义指向真实的产业份额。译文保留这一力度，但不把它纳入任何后来的神学体系。
- issue: בָנִים 的性别与范围
  choice: 正文译作“儿女”，表达后代这一整体概念。
  alternative: 按词形较直译为“儿子”。
  rationale: בָנִים 形式上可指“儿子们”，但在本节中重点是寄居者在当地形成有后代的家庭。“儿女”更准确传达语境功能，同时用脚注说明较直译的形式。
- issue: “如同本地人”的法律含义
  choice: 译为“把他们看作……本地人”，保留比较形式，并由下句具体说明其产业权。
  alternative: 直接译成“他们就是本地人”或使用现代政治法律词“公民”。
  rationale: 原文使用比较介词 כְּ，既赋予同等对待的地位，又没有抹去“寄居者”这一称谓；译文不应把这种张力静默消解。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“把这地分作产业”交代土地分配语境；“分作产业／分得产业”保留原文两处同源动词的呼应。正文按自然汉语避免生硬重复，但在“寄居者／寄居”处有意保留原文词根联系。
