  text: וּ/נְחַלְתֶּ֤ם אוֹתָ/הּ֙ אִ֣ישׁ כְּ/אָחִ֔י/ו אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/תִתָּ֖/הּ לַ/אֲבֹֽתֵי/כֶ֑ם וְ/נָ֨פְלָ֜ה הָ/אָ֧רֶץ הַ/זֹּ֛את לָ/כֶ֖ם בְּ/נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/014.yaml
  text: You shall inherit it[a], each like his brother, concerning which I raised my hand to give it to your fathers[c][b]; and this land shall fall to you as an inheritance.
translation:
  language: zh_hans
  text: 你们要承受这地，各人所得的要和他的弟兄一样；我曾举手起誓，要把这地赐给你们的祖先。这地必归你们作产业。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְחַלְתֶּם אוֹתָהּ
  choice: 你们要承受这地
  rationale: נחל在此指取得所分配的土地为产业；中文“承受这地”自然保留继承、领受产业的语境。阴性宾语后缀所指为“地”，故明确译出。
- source_word: אִישׁ כְּאָחִיו
  choice: 各人所得的要和他的弟兄一样
  rationale: 直译为“各人像他的弟兄”，语境表明各人所得份额相同；补出“所得的”使现代中文清楚，同时保留原文男性亲属称谓“弟兄”。
- source_word: אֲשֶׁר נָשָׂאתִי אֶת־יָדִי
  choice: 我曾举手起誓
  rationale: “举手”是起誓惯用语。译文兼顾原文的具体动作与其惯用含义，避免中文读者误解为普通举手。
- source_word: לְתִתָּהּ לַאֲבֹתֵיכֶם
  choice: 要把这地赐给你们的祖先
  rationale: נתן译为“赐给”符合上帝赐地的庄重语境；אבות在此指先祖，现代中文“祖先”比“父亲们”更准确自然。
- source_word: וְנָפְלָה הָאָרֶץ הַזֹּאת לָכֶם בְּנַחֲלָה
  choice: 这地必归你们作产业
  rationale: נפל在分地语境中是土地经拈阄或划分而“归给”某人的惯用表达；“归你们作产业”自然传达其含义及נחלה的产业意涵。
theological_decisions:
- issue: 举手的誓言惯用语
  choice: 我曾举手起誓
  alternative: 我曾举手，要把这地赐给你们的祖先
  rationale: 原文动作本身表达庄严誓言。中文若只保留字面形象，含义不够透明；将动作与含义并列，既保存意象，也明确这是上帝所立的誓言。
- issue: אִישׁ כְּאָחִיו所表达的分配关系
  choice: 各人所得的要和他的弟兄一样
  alternative: 各人如同他的弟兄
  rationale: 上下文是土地分配，短语表达同等份额。译文只补足语境隐含的“所得”，不进一步规定具体分配制度，并保留原文的男性表述。
- issue: “祖先”与“父辈”的选择
  choice: 你们的祖先
  alternative: 你们的父辈
  rationale: 此处指承受赐地应许的先祖群体。“祖先”涵盖准确，又不额外限定为紧邻的一代。
translation_notes:
  register: 采用现代、庄重而易懂的经文体。“承受”“产业”保留土地应许与继承语境；避免机械保留希伯来语“落到你们”这一在现代汉语中不自然的分地惯用语。
