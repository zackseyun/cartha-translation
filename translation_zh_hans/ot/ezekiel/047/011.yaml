  text: But its swamps and marshes will not be healed[b][a]; they are left for salt.
translation:
  language: zh_hans
  text: 但它的沼泽和水洼不得医治[a]；它们归给盐[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“不得被医治”；在这里延续本章水域得医治的意象，指水不被恢复为清新可用。
    reason: lexical_alternative
  - marker: b
    text: 或译：“它们被交给盐。”也可理解为“它们留作盐地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בצאתו
  choice: 其中的沼泽
  rationale: 该词在这里指水边低洼、积水或水流漫出的湿地。结合上下文，用“沼泽”自然地表达这种地貌；三单数后缀依上下文译作“其中的”。
- source_word: וגבאיו
  choice: 和洼地
  rationale: גבא可指坑洼、水池或低湿之处。它与前一词构成并列，用“洼地”既保留地形含义，也避免与“沼泽”完全同义。
- source_word: ולא
  choice: 不会
  rationale: 这是对后续未完成式动词的否定；“不会”符合本段预告性语境和现代汉语表达。
- source_word: ירפאו
  choice: 得到医治
  rationale: רפא的尼法勒式直译为“被医治”。这里所指虽是水域恢复清新，仍保留“医治”的意象，以呼应本章前文对水得医治的描述。
- source_word: למלח
  choice: 作盐地
  rationale: 介词ל在此可表达用途或结果；“作盐地”简洁地保留这些区域与盐有关的指定状态，而不额外断定具体是采盐、产盐还是保持咸碱。
- source_word: נתנו
  choice: 要留作
  rationale: 该动词为被动形式，基本义是“被给予、被交付”。结合未获医治的对比，“要留作”在现代汉语中自然，同时保留被指定为某种用途或状态的含义。
theological_decisions:
- issue: 是否把水域“得医治”的比喻直接解释为“变淡”或“变清新”
  choice: 保留“得到医治”
  alternative: 译作“变淡”或“恢复清新”
  rationale: 原文延续本段רפא的医治意象。直译能保留先知异象中的比喻张力；具体指水质恢复可由上下文和脚注说明，不在正文中提前消解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“沼泽和洼地”构成自然的地貌并列；保留“医治”这一贯穿上下文的原文意象，并以脚注说明其水文含义。“盐地”有意保持用途与结果之间的开放性。
