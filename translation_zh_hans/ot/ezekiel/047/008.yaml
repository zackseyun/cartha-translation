  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּ֤יִם הָ/אֵ֨לֶּה֙ יוֹצְאִ֗ים אֶל הַ/גְּלִילָה֙ הַ/קַּדְמוֹנָ֔ה וְ/יָרְד֖וּ עַל הָֽ/עֲרָבָ֑ה וּ/בָ֣אוּ הַ/יָּ֔מָּ/ה אֶל הַ/יָּ֥מָּ/ה הַ/מּֽוּצָאִ֖ים ו/נרפאו הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/008.yaml
  text: Then he said to me[a], “These waters flow out toward the eastern district and go down into the Arabah; then they enter the sea. and when they are brought out into the sea[c][b], the waters are healed.”
translation:
  language: zh_hans
  text: 他对我说：“这些水从这里流出，流向东部地区，往下流到亚拉巴，再流入海中；当这些水汇入那海[a]时，海水就得医治[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来语结构较难，直译大意为“进入那海，就是那被引出（或流出）的海”。按上下文，通常理解为水流汇入的海；一般认为是犹大东面的盐海（死海）。
    reason: 说明原文困难的句法和词义，不把有争议的分析或传统地理认定强加于正文。
  - marker: b
    text: “得医治”也可按语境译为“变为淡水”或“水质恢复”；希伯来语直译是“水得医治”。
    reason: 交代 רפא 的语境含义，同时保留原文的医治隐喻。
lexical_decisions:
- source_word: הַמַּיִם הָאֵלֶּה
  choice: 这些水
  rationale: 保留希伯来语复数形式及指示语，同时在现代汉语中仍清楚自然。
- source_word: יוֹצְאִים
  choice: 流向
  rationale: יצא的分词表示水持续流出、前往某处；按水流语境译为“流向”比直译“出去”自然。
- source_word: הַגְּלִילָה הַקַּדְמוֹנָה
  choice: 东边地区
  rationale: גְּלִילָה在这里指区域或地区；“东边地区”既反映地理意义，也避免误作后来的专名“加利利”。
- source_word: וְיָרְדוּ עַל הָעֲרָבָה
  choice: 下到亚拉巴
  rationale: 保留ירד“下去”的地势含义，并将עֲרָבָה作为约旦裂谷一带的地名音译。
- source_word: וּבָאוּ הַיָּמָּה
  choice: 再流入海中
  rationale: 带方向词尾的יָמָּה表示朝海而去；水流语境中“流入海中”自然准确。
- source_word: אֶל הַיָּמָּה הַמּוּצָאִים
  choice: 这些水被引入海里
  rationale: 该短语句法艰难；将הַמּוּצָאִים按יצא的使役被动分词处理，保留“被引出／被引入”的动作，不在正文中擅自改作“死海”或“死水之海”。
- source_word: וְנרפאו הַמָּיִם
  choice: 海水就得医治
  rationale: רפא本义为“医治”；保留水“得医治”的拟人隐喻，同时以“海水”明确此处所指。
theological_decisions:
- issue: 水得医治的表达
  choice: 保留“得医治”的隐喻
  alternative: 变为淡水／变得清新
  rationale: 原文使用רפא，而非直接表示淡化或变甜的词；保留隐喻可避免把异象的神学张力化约为水质说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“亚拉巴”保留地名性质；末句刻意保留原文重复和“医治”隐喻。脚注标记均置于正文相应位置。
