revisions:
- from: 在河边，河的两岸[a]，各样可作食物的树都要生长。树叶不会枯萎，果子也不会断绝；每月都要结出新熟的果子[b]，因为灌溉树木的水是从圣所流出来的。树上的果子可作食物，叶子可作医治之用[c]。
  to: 在这河两岸[a]，各样可作食物的树都必生长。树叶不会枯萎，果子也不会断绝；每月都结出初熟的果子[b]，因为这河的水从圣所流出来。树上的果子可作食物，叶子可作医治之用[c]。
  rationale: 修订仅处理一项实质性的源文忠实度问题：以“这河的水”直接对应原文“它的水”，不把水对树木的作用解释性地纳入正文。同时消除开头的中文重复，并使“初熟”的正文选择与脚注 b 一致。其余意象、因果关系、术语及脚注锚点均予保留。
