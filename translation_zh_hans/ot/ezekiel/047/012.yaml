language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַל הַ/נַּ֣חַל יַעֲלֶ֣ה עַל שְׂפָת֣/וֹ מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה כָּל עֵֽץ מַ֠אֲכָל לֹא יִבּ֨וֹל עָלֵ֜/הוּ וְ/לֹֽא יִתֹּ֣ם פִּרְי֗/וֹ לָֽ/חֳדָשָׁי/ו֙ יְבַכֵּ֔ר כִּ֣י מֵימָ֔י/ו מִן הַ/מִּקְדָּ֖שׁ הֵ֣מָּה יֽוֹצְאִ֑ים ו/היו פִרְי/וֹ֙ לְ/מַֽאֲכָ֔ל וְ/עָלֵ֖/הוּ לִ/תְרוּפָֽה־־׀׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/012.yaml
  text: Along the river[a], on its bank, on this side and on that side, every kind of tree for food will grow. Its leaf will not wither, and its fruit will not fail; every month it will bear fresh fruit, because its waters are coming out from the sanctuary. Its fruit will be for food[c][b], and its leaf for healing.
translation:
  language: zh_hans
  text: 在这河两岸[a]，各样可作食物的树都必生长。树叶不会枯萎，果子也不会断绝；每月都结出初熟的果子[b]，因为这河的水从圣所流出来。树上的果子可作食物，叶子可作医治之用[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从这边和从那边”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“新熟的果子。”原文动词含早熟或首先成熟之意。
    reason: lexical_alternative
  - marker: c
    text: 或译：“叶子可作药用”，或“可作治疗之用”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֶה
  choice: 生长
  rationale: 该动词本义为“上升”，用于树木时指长出、生长；现代汉语用“生长”自然，并保留未然语气。
- source_word: שְׂפָתוֹ
  choice: 河边
  rationale: 该词本义为“唇、边缘”，在河流语境中指河岸；“河边”符合现代汉语表达。
- source_word: מִזֶּה וּמִזֶּה
  choice: 河的两岸
  rationale: 希伯来语直译为“从这边和从那边”，意指河流两侧；正文采用自然的“两岸”，脚注保留原文的空间表达。
- source_word: כָּל עֵץ מַאֲכָל
  choice: 各样可作食物的树
  rationale: 既表达 כָּל 的周遍或种类丰富之意，也说明这些树所结之物可供食用，避免生硬的“食物树”。
- source_word: לֹא יִבּוֹל עָלֵהוּ
  choice: 树叶不会枯萎
  rationale: נבל 在植物语境中指枯萎、凋残；“树叶”将希伯来语集合单数自然地译成汉语。
- source_word: וְלֹא יִתֹּם פִּרְיוֹ
  choice: 果子也不会断绝
  rationale: תמם 表示完结、耗尽；“不会断绝”准确传达持续结果、不至穷尽的意思。
- source_word: לָחֳדָשָׁיו
  choice: 每月
  rationale: 该表达指按月、月月，译为“每月”简洁自然。
- source_word: יְבַכֵּר
  choice: 结出新熟的果子
  rationale: 该动词与初熟、早熟有关；结合每月持续结果的语境，“新熟”既保留初熟的词义色彩，也避免让人误解为一年只有一次的“初熟果子”。
- source_word: מֵימָיו
  choice: 灌溉树木的水
  rationale: 原文代词所指在汉语中可能含混；依上下文明确为供应这些树木的河水，不改变因果关系。
- source_word: מִן הַמִּקְדָּשׁ
  choice: 从圣所
  rationale: מקדש 指分别为圣之处，在本章圣殿异象中以“圣所”最直接妥当。
- source_word: לִתְרוּפָה
  choice: 作医治之用
  rationale: 该名词可指医治、疗效或药用；此译保留较宽的恢复与治疗含义，不限定为某种具体药物。
theological_decisions:
- issue: 圣所之水所带来的生命与丰盛
  choice: 按异象本身直译树木、果子和叶子的功用，并保留水从圣所流出的因果关系。
  alternative: 在正文中直接解释为末世、圣礼或其他象征体系。
  rationale: 原文呈现富有神学意义的异象，却未在本节明说其后来的系统性解释；译文不应把某一传统的诠释写入正文。
- issue: יְבַכֵּר 的初熟含义
  choice: 译作“结出新熟的果子”，并以脚注说明也可理解为“初熟的果子”。
  alternative: 只译作“结新鲜果子”或“结初熟果子”。
  rationale: “新熟”兼顾该词与早熟、初熟的词义联系及每月不断结果的上下文，同时用脚注保留更形式对应的译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保持异象叙述的节奏；“不会枯萎”“不会断绝”形成对应。“灌溉树木的水”用于消除中文代词指向不清的问题。所有脚注标记均置于相应正文之后。
