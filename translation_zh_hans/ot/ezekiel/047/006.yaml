base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/006.yaml
  text: Then he said to me[a], “Have you seen this[d][c][b], son of man?” Then he led me and brought me back to the bank of the stream.
translation:
  language: zh_hans
  text: 随后，他对我说：“人子啊，你看见了吗？”然后他领我，又带我回到河岸[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河岸”原文直译为“水道的边缘”（字面为“水道的唇边”）；“水道”也可译作“溪流”或“河谷水道”，须视语境而定。
    reason: 说明שׂפה的形象性字面意义，并保留נחל可指不同类型水道的词义幅度。
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 随后，他对我说
  rationale: 连续式叙事动词推进场景；“随后”自然表达先后关系，“对我说”准确保留受话者。
- source_word: הֲרָאִיתָ
  choice: 你看见了吗
  rationale: 疑问词与第二人称阳性单数完成式询问以西结是否已经看见；希伯来文未明说宾语，因此中文也不补出“这景象”，保留原文的简洁与语境含义。
- source_word: בֶן־אָדָם
  choice: 人子
  rationale: 这是《以西结书》中反复出现的固定称呼；“人子”保留原文形式及其文学和神学呼应。
- source_word: וַיּוֹלִכֵנִי
  choice: 他就领我走
  rationale: הלך的使役形在此表示使先知前行；“领我走”既体现引领，也避免生硬的“使我行走”。
- source_word: וַיְשִׁבֵנִי
  choice: 又把我带回
  rationale: שׁוב的使役形表示使人返回；“带回”自然传达回到先前地点的意思，并与前一动词分别对应。
- source_word: שְׂפַת הַנָּחַל
  choice: 河岸
  rationale: שׂפה本义为“唇、边缘”，用于水道时自然指岸边；נחל在本异象中指流动且逐渐增大的水道，因此译作“河”较合语境。
theological_decisions:
- issue: 称呼בֶן־אָדָם中אָדָם的译法
  choice: 人子
  alternative: 世人；凡人
  rationale: 此处并非泛指人类，而是上帝对以西结反复使用的先知性称呼。保留“人子”既贴近希伯来语构词，也维持全书的重复模式，不把其含义预先解释为某一特定神学立场。
- issue: 疑问句是否补出宾语
  choice: 不补宾语：“你看见了吗？”
  alternative: “你看见这景象了吗？”
  rationale: 原文动词没有明示宾语；上下文虽可推出所指，正文仍保留这种省略，以免把语境推断写成原文明说的内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“人子”保留全书固定称呼；“领我走，又把我带回”有意对应原文两个连续动词，不将其合并。
