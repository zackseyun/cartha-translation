base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/004.yaml
  text: Again he measured a thousand[a], and led me through the water—water up to the knees. Again he measured a thousand[b], and led me through water up to the waist.
translation:
  language: zh_hans
  text: 他又量了一千[a]，领我在水中走过，水深及膝。他又量了一千，领我在水中走过，水深及腰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一千”；根据上一节的语境，所指计量单位为“肘”，即“一千肘”。
    reason: cross_reference
  - marker: b
    text: 原文也可指腰间或腰胯部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: 他又量了
  rationale: 这是动词 מדד 的 Qal 叙事形式，表示异象中的那人继续丈量；“又量了”既直接，也自然承接上文。
- source_word: אֶלֶף
  choice: 一千
  rationale: 希伯来文本只写“一千”，计量单位由上一节的语境补足，因此正文保留原文的简略表达，并用脚注说明是“一千肘”。
- source_word: וַיַּעֲבִרֵנִי
  choice: 领我……走过
  rationale: עבר 的 Hiphil 形式带第一人称单数宾语后缀，字面为“使我经过”；“领我……走过”自然表达使役含义，并符合异象中那人引导先知涉水的情景。
- source_word: בַמַּיִם
  choice: 从水中
  rationale: 与“领我走过”连用时，此短语表达在水中穿行；“从水中走过”是现代汉语自然且准确的说法。
- source_word: מַיִם בִּרְכָּיִם
  choice: 水深及膝
  rationale: 原文以“水＋膝”表达水达到膝盖的高度；“水深及膝”简洁、庄重，并保留身体部位所指的水位。
- source_word: מֵי מָתְנָיִם
  choice: 水深及腰
  rationale: מָתְנַיִם 指腰部、腰胯或腰间区域；正文用现代读者清楚易懂的“及腰”，脚注保留“腰胯”的词义范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次丈量和两次涉水的平行结构；第一处“一千”附单位说明，第二处不重复脚注。正文将两个名词短语译为“水深及膝／及腰”，清楚呈现水位递增。
