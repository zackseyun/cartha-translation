  text: וְ/הָיָ֨ה גְב֜וּל מִן הַ/יָּ֗ם חֲצַ֤ר עֵינוֹן֙ גְּב֣וּל דַּמֶּ֔שֶׂק וְ/צָפ֥וֹן צָפ֖וֹנָ/ה וּ/גְב֣וּל חֲמָ֑ת וְ/אֵ֖ת פְּאַ֥ת צָפֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/017.yaml
  text: So the border shall be from the sea to Hazar-enon[a], at the border of Damascus; and on the north, northward, with the border of Hamath[b]. This shall be the north side.
translation:
  language: zh_hans
  text: 疆界要从海[a]直到哈萨·以难[b]，在大马士革的边界；北边再向北，是哈马的边界。这就是北界。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“海”；按上下文指地中海，但本节没有再次明确称为“大海”。
    reason: cross_reference
  - marker: b
    text: “哈萨·以难”也常写作“哈萨以难”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: 要
  rationale: 在本段划定疆界的语境中，希伯来语形式带有规定、描述将定疆界的作用；用“要”自然表达这一语气。
- source_word: גְבוּל
  choice: 疆界
  rationale: 本节谈论领土范围；“疆界”既准确又符合庄重的现代汉语地理表述，并可保持本节重复用词。
- source_word: מִן הַיָּם
  choice: 从海
  rationale: 原文只说“海”，没有在本节重述“大海”；正文保留这一简略表达，具体所指在脚注说明。
- source_word: חֲצַר עֵינוֹן
  choice: 哈萨·以难
  rationale: 作为地名按音译处理；中点帮助现代读者辨识复合地名的两个音节单位。
- source_word: גְּבוּל דַּמֶּשֶׂק
  choice: 就是大马士革的边界
  rationale: 该结构说明哈萨·以难与大马士革疆界的地理关系；“就是”使同位说明在汉语中清楚而不过度补充。
- source_word: וְצָפוֹן צָפוֹנָה
  choice: 北面向北
  rationale: 原文连续使用“北”及带方向词尾的“向北”，译文保留这种略显重复的方位表达，以免抹平原文结构。
- source_word: וּגְבוּל חֲמָת
  choice: 沿着哈马的边界
  rationale: 该短语进一步界定北部疆界；“沿着”在汉语中自然呈现疆界相接或循界延伸的地理关系，但不把它改写为新的独立断言。
- source_word: וְאֵת פְּאַת צָפוֹן
  choice: 这就是北面的疆界
  rationale: 原文末尾以“北面的边/侧”作总结；汉语补出判断结构，使其承接前文并明确这是北界。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的地理法规式语体。正文尽量保留希伯来文的重复方位表达，同时用汉语必要的判断词和介词使句法清楚。脚注标记按其实际说明对象分别置于“海”和“哈萨·以难”之后。
