  text: וְ/הָיָה֩ יעמדו עָלָ֜י/ו דַּוָּגִ֗ים מֵ/עֵ֥ין גֶּ֨דִי֙ וְ/עַד עֵ֣ין עֶגְלַ֔יִם מִשְׁט֥וֹחַ לַֽ/חֲרָמִ֖ים יִהְי֑וּ לְ/מִינָ/ה֙ תִּהְיֶ֣ה דְגָתָ֔/ם כִּ/דְגַ֛ת הַ/יָּ֥ם הַ/גָּד֖וֹל רַבָּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/010.yaml
  text: And it will happen that fishermen will stand beside it[a]; from En-gedi even to En-eglaim there will be a place for spreading nets. Their fish will be of many kinds, like the fish of the Great Sea[b], very many.
translation:
  language: zh_hans
  text: 必有渔夫站在水边；从隐·基底直到隐·以革莲，那里将成为铺开渔网的地方。鱼类繁多[a]，像大海[b]里的鱼一样，数量极多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鱼类繁多”直译为“鱼按其种类”；这里指鱼的种类多样。
    reason: lexical_alternative
  - marker: b
    text: “大海”指地中海。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: 必有
  rationale: 在预言性的未来结果场景中，引出必将出现的情形；中文用“必有”简洁自然，并保留确定的将来意味。
- source_word: יעמדו עָלָיו דַּוָּגִים
  choice: 必有渔夫站在水边
  rationale: עמד表示“站立、站定”，עָלָיו在水域语境中宜译为“在水边”，避免生硬地译作“在其上”。
- source_word: מֵעֵין גֶּדִי וְעַד עֵין עֶגְלַיִם
  choice: 从隐·基底直到隐·以革莲
  rationale: 保留מִן…וְעַד所表达的完整范围，并采用现代中文圣经地名中较为通行的音译。
- source_word: מִשְׁטוֹחַ לַחֲרָמִים
  choice: 铺开渔网的地方
  rationale: מִשְׁטוֹחַ指铺展之处，חֲרָמִים指捕鱼用的网；“铺开渔网”不额外限定为撒网或晒网。
- source_word: לְמִינָה תִּהְיֶה דְגָתָם
  choice: 其中的鱼各按其类
  rationale: 较直接地保留“按其类”的源文表达；将复数领属关系自然化为“其中的”，避免中文中指代不明。
- source_word: כִּדְגַת הַיָּם הַגָּדוֹל
  choice: 像大海的鱼一样
  rationale: 保留“大海”这一圣经地理称谓，不在正文中直接改写为“地中海”。
- source_word: רַבָּה מְאֹד
  choice: 极其繁多
  rationale: 同时表达鱼的数量丰盛，并与前面的种类表述自然衔接。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准书面汉语。“水边”承接上文的河水语境；“铺开渔网”保留动作的宽泛含义，不擅自解释为撒网或晒网。
