base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/029.yaml
  text: They will deal with you in hatred[a], and they will take all your wealth, and leave you naked and bare; and the nakedness of your prostitutions will be uncovered[c][b], your lewdness and your acts of prostitution.
translation:
  language: zh_hans
  text: 他们必怀着仇恨对待你，夺去你劳碌所得的一切，撇下你赤身露体；你卖淫的赤裸之态必被揭露——就是你的淫荡和卖淫行为。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּ אוֹתָךְ בְּשִׂנְאָה
  choice: 他们必带着仇恨对待你
  rationale: 保留“以仇恨”的方式状语和敌意色彩，同时采用自然的现代汉语表达。
- source_word: וְלָקְחוּ כָּל יְגִיעֵךְ
  choice: 夺走你劳碌所得的一切
  rationale: יְגִיעַ本指劳碌，也可指劳碌所得；本句语境是财物被夺，译出“劳碌所得”兼顾词源形象和实际所指。
- source_word: וַעֲזָבוּךְ עֵירֹם וְעֶרְיָה
  choice: 使你赤身露体
  rationale: 以常用四字表达传达希伯来语双词叠加强调的全然裸露与匮乏。
- source_word: וְנִגְלָה
  choice: 必被揭露
  rationale: 在连续的将来审判语境中按将来意义处理，并保留揭开、暴露的意象。
- source_word: עֶרְוַת זְנוּנַיִךְ
  choice: 你淫乱所显出的赤裸羞耻
  rationale: עֶרְוָה兼有赤裸与羞耻暴露之意；此译保留身体性意象，同时使汉语意义清楚。
- source_word: וְזִמָּתֵךְ
  choice: 你的淫荡
  rationale: 本语境中的זִמָּה指性方面的邪荡，而非一般的计谋。
- source_word: וְתַזְנוּתָיִךְ
  choice: 种种卖淫之举
  rationale: 保留明确的卖淫比喻，并以“种种……之举”体现复数和与前项近义累加的修辞。
theological_decisions:
- issue: 以卖淫描写耶路撒冷或撒马利亚的不忠
  choice: 保留露骨的卖淫、赤裸和淫荡意象
  alternative: 弱化为一般的“不忠”“败坏”或“淫乱”
  rationale: 以西结有意用强烈的性羞耻语言描绘盟约背叛及随之而来的公开羞辱；弱化会削减先知修辞的力度。
- issue: 末尾两个名词与“淫乱所显出的赤裸羞耻”的关系
  choice: 用破折号将“你的淫荡和种种卖淫之举”处理为解释性同位语
  alternative: 理解为另外一并被揭露的并列项目
  rationale: 动词וְנִגְלָה为单数，与单数中心词עֶרְוַת相应；末尾短语较自然地说明这种赤裸羞耻的具体内容，但原文连接词也容许并列理解，故以脚注保存另一可能。
translation_notes:
  register: 采用庄重而直接的现代标准汉语。保留以西结书刻意强烈的性羞耻比喻，不作委婉淡化；“劳碌所得”比单译“财富”更贴近原词，又符合被掠夺的语境。
