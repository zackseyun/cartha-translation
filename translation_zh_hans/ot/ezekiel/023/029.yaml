revisions:
- from: 他们必带着仇恨对待你，夺走你劳碌所得的一切，使你赤身露体；你淫乱所显出的赤裸羞耻[a]必被揭露——就是你的淫荡和种种卖淫之举。
  to: 他们必怀着仇恨对待你，夺去你劳碌所得的一切，撇下你赤身露体；你卖淫的赤裸之态必被揭露——就是你的淫荡和卖淫行为。
  rationale: 修订恢复“卖淫的赤裸之态”这一原文构词关系及裸露意象，并以破折号保留末尾近义词组对前项的解释性理解。脚注保留连接词所容许的并列句法可能，避免将争议完全消除。
