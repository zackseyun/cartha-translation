review_pass:
  verdict: revise
  source_fidelity: 首半节忠实传达了敌意对待、夺取劳碌所得及被遗弃而赤身露体的审判图像。“你淫乱所显出的赤裸羞耻”却将“你卖淫的赤裸/裸露”（עֶרְוַת זְנוּנַיִךְ）改写成由淫乱“显出”的羞耻，弱化并改变了原文构词关系及其具体的裸露意象。
  naturalness: “赤裸羞耻”在现代汉语中搭配生硬；“你卖淫的赤裸之态”更自然，也保留原文的裸露与公开受辱意象。将“使你”调整为“撇下你”可更直接对应“留下你”。
  terminology: “劳碌所得”“赤身露体”“淫荡”“卖淫行为”在此处保持庄重、直接，并保留以西结书的性化卖淫隐喻，未将其泛化为抽象的不忠。
  issues:
  - severity: medium
    issue: “你淫乱所显出的赤裸羞耻”对עֶרְוַת זְנוּנַיִךְ的关系处理不够准确。
    rationale: 原文是“你的卖淫的裸露/赤裸之态”，不是“淫乱所显出的羞耻”。现译添加了“所显出”的因果/表现关系，且以“羞耻”替换了具体的裸露意象。
  - severity: low
    issue: “赤裸羞耻”不符合自然现代汉语搭配。
    rationale: 改为“赤裸之态”可在不淡化羞辱语境的前提下使表述清楚自然。
  revised_text: 他们必怀着仇恨对待你，夺去你劳碌所得的一切，撇下你赤身露体；你卖淫的赤裸之态必被揭露——就是你的淫荡和卖淫行为。
  revised_footnotes:
