  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִי֙ נֹֽתְנָ֔/ךְ בְּ/יַ֖ד אֲשֶׁ֣ר שָׂנֵ֑את בְּ/יַ֛ד אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/028.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am giving you into the hand of those whom you hate, into the hand of those from whom your soul has turned away.'
translation:
  language: zh_hans
  text: 因为主耶和华如此说：“看哪，我要把你交在你所恨的人手中，交在那些你的心已与之疏远的人手中。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来语也可译作“那些你的心所厌恶的人”或“那些你的心已与之断绝的人”。原文用语强烈，可指深刻的疏离、厌恶，或如被扯离般的断绝。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 这个复合称谓兼有“主”和以色列上帝的专名；译作“主耶和华”符合现代中文圣经语域，也避免把两个成分合并。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 这是引出庄严宣告的指示语；“看哪”保留先知话语的郑重语气。
- source_word: נֹתְנָךְ
  choice: 我要把你交在
  rationale: הִנְנִי 加分词表达迫近而确定的行动；中文用“我要把你交在”自然呈现即将施行的审判。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语“手”的权势隐喻，同时现代中文也能清楚理解为落入他人控制之下。
- source_word: אֲשֶׁר שָׂנֵאת
  choice: 你所恨的人
  rationale: 动词为阴性单数第二人称，直接指向本章拟人化的阿荷利巴；中文无需标明语法性别。
- source_word: נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: 那些你心里已经厌弃的人
  rationale: נקע 在此可表达疏远、脱离或厌恶；“心里已经厌弃”保留 נֶפֶשׁ 的内在、切身意味，并在正文中自然表达强烈反感，同时以脚注保留词义张力。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”分别呈现称号与专名，是庄重且为普通中文读者熟悉的表达；此处不以普通称谓取代原文中的专名。
- issue: נָקְעָה נַפְשֵׁךְ מֵהֶם 所表达的关系状态
  choice: 你心里已经厌弃的人
  alternative: 你的心已经疏远的人；你的心已经与之断绝的人
  rationale: 上下文含有由亲近转为排斥的审判反讽，但这个少见表达兼有厌恶、疏离和被扯开的意象，因此正文采用通顺译法，脚注保留其他可能。
translation_notes:
  register: 采用庄重、现代而易懂的先知宣告语体。“看哪”保留原文的郑重提示；两次“交在……手中”保留平行结构和“手”所象征的控制权。
