  text: וְ/שָׁתִ֨ית אוֹתָ֜/הּ וּ/מָצִ֗ית וְ/אֶת חֲרָשֶׂ֛י/הָ תְּגָרֵ֖מִי וְ/שָׁדַ֣יִ/ךְ תְּנַתֵּ֑קִי כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/034.yaml
  text: You will drink it and drain it dry[a], and you will gnaw its shards, and tear off your breasts; for I have spoken, declares the Lord GOD.
translation:
  language: zh_hans
  text: 你必喝这杯，把它喝干；你必啃咬那杯的碎片[a]，扯下自己的乳房，因为我已经说了。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碎片”指陶制杯子破裂后留下的瓦片。
    reason: 说明חֲרָשֶׂיהָ所指的是陶器的破片；脚注标记紧随其所解释的词语。
lexical_decisions:
- source_word: וְשָׁתִית אוֹתָהּ
  choice: 你要喝那杯
  rationale: 该动词形式在先知性宣告中表达将来必然发生之事；阴性单数宾语代词按上下文明确指前文的杯，译出“那杯”比“喝它”更自然。
- source_word: וּמָצִית
  choice: 喝得一滴不剩
  rationale: מצה在此表示彻底吸尽、喝干；此译自然地传达连杯底残余也不留下的意思。
- source_word: חֲרָשֶׂיהָ
  choice: 杯的碎片
  rationale: חֶרֶשׂ指陶制器皿破裂后的碎片；补出“杯的”以明确所属关系，同时保留破杯的意象。
- source_word: תְּגָרֵמִי
  choice: 啃咬
  rationale: 该词的加强词干可表示啃、嚼硬物；“啃咬”保留原文刻意营造的骇人而粗粝的画面。
- source_word: וְשָׁדַיִךְ תְּנַתֵּקִי
  choice: 扯下自己的乳房
  rationale: נתק的加强词干表示强行扯开或扯下；原文意象极其强烈，不宜弱化。第二人称阴性主语与“你的乳房”表明动作落在自身，汉语用“自己的”清楚表达。
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: 因为我已经说了
  rationale: כִּי说明上述审判必然实现的根据；完成式强调神已经发言，所宣告的事因而确定。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知书常见的神谕宣告公式；“主耶和华”直接而庄重地呈现复合神名אֲדֹנָי יְהוִה。
theological_decisions:
- issue: אֲדֹנָי יְהוִה这一复合神名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”在现代中文圣经语境中能区分אֲדֹנָי与יהוה，并避免将专名的一面完全泛化为称号；正文不额外加入宗派性解释。
- issue: 审判意象中的自我伤害是否应弱化
  choice: 保留“扯下自己的乳房”的强烈直译
  alternative: 使自己的胸部受伤
  rationale: 原文以第二人称阴性动词明确描写剧烈的撕扯动作。这是审判比喻中有意令人震骇的语言，弱化会损失文本的力度；译文不对其象征意义作超出本节的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“一滴不剩”以自然表达传达彻底喝干；“啃咬”“扯下”则保留希伯来文粗粝、骇人的审判图景。句末采用现代中文先知书常用的宣告公式。
