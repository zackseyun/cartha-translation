  text: לָ/כֵ֣ן אָהֳלִיבָ֗ה כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מֵעִ֤יר אֶת מְאַהֲבַ֨יִ/ךְ֙ עָלַ֔יִ/ךְ אֵ֛ת אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶ֑ם וַ/הֲבֵאתִ֥י/ם עָלַ֖יִ/ךְ מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/022.yaml
  text: 'Therefore[a], Oholibah, thus says the Lord GOD: Behold, I am stirring up your lovers against you, those from whom your soul has turned away, and I will bring them against you from every side.'
translation:
  language: zh_hans
  text: 因此，阿荷利巴，主耶和华如此说：看哪，我要激起你的情人来攻击你，就是那些你心里已与之疏远[a]的人；我要使他们从四面八方来攻击你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与之疏远”也可译作“厌弃”或“离弃”。原文动词既可表达厌恶，也可表达关系破裂或疏离。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的控诉并引出审判后果；“所以”自然清楚，同时保留因果力度。
- source_word: אָהֳלִיבָה
  choice: 阿荷利巴
  rationale: 按专名音译，不把名字的词源意义直接译入正文。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知宣告的固定格式，并将 אֲדֹנָי 与神名 יְהוִה 分别译为“主”和“耶和华”。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”体现庄严的指示和宣告语气；后接“我要”符合汉语预告行动的表达。
- source_word: מֵעִיר
  choice: 激起
  rationale: 使役分词表示使人起来采取行动；在敌对语境中，“激起”准确而自然。
- source_word: מְאַהֲבַיִךְ
  choice: 你的情人
  rationale: 保留本章以不贞关系比喻政治结盟的意象及控诉色彩。
- source_word: אֵת אֲשֶׁר נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: 就是那些你心里已经厌弃的人
  rationale: “心里”自然对应 נַפְשֵׁךְ；נקע 在此可能含厌恶、疏离或离弃之意，正文采用符合上下文的“厌弃”，并以脚注保留歧义。
- source_word: וַהֲבֵאתִים עָלַיִךְ
  choice: 我要使他们来攻击你
  rationale: 将“带来临到你”按敌对军事语境译为“使他们来攻击你”，明确而不增添超出上下文的内容。
- source_word: מִסָּבִיב
  choice: 从四面八方
  rationale: 自然表达包围和各方来袭的含义。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文圣经语体中易于辨认，并保留 אֲדֹנָי 与四字神名的区别；不将二者合并为重复的“主”。
- issue: 情人意象应否解释为政治盟友
  choice: 正文保留“情人”的隐喻
  alternative: 直接译作“盟友”
  rationale: 原文有意维持性关系与政治关系交织的控诉意象，直接改为“盟友”会削弱本章的神学和修辞张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留“看哪”和“主耶和华如此说”的先知宣告语体，同时避免生硬直译。脚注标记置于整节末尾，但所注释的是“厌弃”。
