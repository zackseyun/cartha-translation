source:
  edition: WLC
  text: ע֥וֹד זֹ֖את עָ֣שׂוּ לִ֑/י טִמְּא֤וּ אֶת מִקְדָּשִׁ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/038.yaml
  text: 'Moreover, they did this to me: they defiled my sanctuary on that same day, and they profaned my Sabbaths.'
translation:
  language: zh_hans
  text: 此外，她们还这样对待我：就在那一天，她们玷污了我的圣所，又亵渎了我的安息日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד זֹאת
  choice: 此外，她们还这样
  rationale: 该短语引出追加的指控；“此外……还”自然表达其递进、增补作用，而不是误解为时间意义的“仍然”。
- source_word: עָשׂוּ לִי
  choice: 对待我
  rationale: לִי表明这些行为直接冒犯上帝。“这样对待我”保留个人受辱的意味，又不过度强化为原文未明说的“攻击我”。
- source_word: טִמְּאוּ
  choice: 玷污
  rationale: טמא的Piel词形在圣所语境中指使之成为不洁；“玷污”既自然，又保留礼仪与神圣空间受污损的分量。
- source_word: מִקְדָּשִׁי
  choice: 我的圣所
  rationale: “圣所”准确保留מקדש作为神圣空间的广义含义，不将其不必要地限缩为建筑意义上的“圣殿”。
- source_word: בַּיּוֹם הַהוּא
  choice: 就在那一天
  rationale: 该表达回指上下文所述恶行发生的那一天；“就在”传达同日发生的强调，同时保持自然。
- source_word: שַׁבְּתוֹתַי
  choice: 我的安息日
  rationale: 希伯来语为复数，表示一再被侵犯的安息圣日。现代汉语通常以“安息日”作类称，无须机械添加“各个”也能保留重复性。
- source_word: חִלֵּלוּ
  choice: 亵渎
  rationale: חלל的Piel词形表示把神圣之物当作凡俗。“亵渎”是现代汉语中表达侵犯神圣性的准确用语，并与“玷污圣所”形成合宜对应。
theological_decisions:
- issue: 神圣空间与神圣时间的礼仪用语
  choice: 采用“圣所”“安息日”，并以“玷污”“亵渎”明确表达对圣洁之物的侵犯。
  alternative: 采用较宽泛的“圣殿”“不尊重”等表达。
  rationale: 本节的重点是对属于上帝的神圣空间和神圣时间所实施的礼仪性、盟约性侵犯；宽泛措辞会削弱原文的神学张力。
- issue: 复数主语的性别表达
  choice: 译为“她们”。
  alternative: 译为“他们”。
  rationale: 动词形式本身只标示第三人称复数，但上下文的寓言人物是两名女性；采用“她们”使本节与直接语境衔接，同时不改变指控内容。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留原文先总述、后列举两项罪行的结构；“玷污／亵渎”维持礼仪语域及平行力度。
