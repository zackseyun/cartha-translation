  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 该叙事形式在先知书的固定引言中承接上下文；中文用“……临到”自然表达事件的发生与话语的到来，无须逐字译出“于是发生”。
- source_word: דְבַר
  choice: 话
  rationale: דָּבָר在先知启示公式中指来自上帝的话语或信息；“耶和华的话”既保留固定表达，也符合其与神名的结构关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝专名的功能，而不以一般称号替代。
- source_word: אֵלַי
  choice: 我
  rationale: 介词加第一人称单数后缀表示话语临到先知；在“临到我”中准确而自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节的直接话语；中文“说：”简洁地保留这一引语功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最通行、普通读者最易识别的专名“耶和华”，不以“主”替代；“雅威”是较接近学界常用拟音的另一选择，但原始发音并无完整确定性。
translation_notes:
  register: 采用现代、庄重而通顺的先知书引言句式。“耶和华的话临到我，说”保留希伯来文公式化结构，并以冒号自然引出下一节内容。
