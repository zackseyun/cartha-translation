  text: וַ/תַּרְבֶּ֖ה אֶת תַּזְנוּתֶ֑י/הָ לִ/זְכֹּר֙ אֶת יְמֵ֣י נְעוּרֶ֔י/הָ אֲשֶׁ֥ר זָנְתָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/019.yaml
  text: Yet she multiplied her prostitutions[a], remembering the days of her youth, when she prostituted herself in the land of Egypt.
translation:
  language: zh_hans
  text: 然而，她越发行淫[a]，追想她年轻时在埃及地行淫的日子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：她增多了她的淫行。
    reason: 原文直译为“她使她的淫行增多”；正文以“越发行淫”作自然的动词式表达，同时保留重复和加增的含义。
lexical_decisions:
- source_word: וַתַּרְבֶּה
  choice: 然而，她增多了
  rationale: רבה 的使役形在这里表示“使之增多、增加”。“增多了”保留原文的具体动词力度；结合上下文，以“然而”表达叙事中持续悖逆的转折意味，同时不把连词的语义限定得过死。
- source_word: תַּזְנוּתֶיהָ
  choice: 自己的淫行
  rationale: 该复数名词指反复发生的卖淫或淫乱行为。“淫行”在现代汉语中简洁、庄重，也能承接以卖淫比喻盟约及政治不忠的先知性意象；“自己的”清楚表达第三人称阴性所属关系。
- source_word: לִזְכֹּר
  choice: 追念
  rationale: 带 ל 的不定式可表达目的，也可表示伴随情形。“追念”既保留主动回想往日的意味，又自然连接她当前增加淫行与回忆早年行为，未强行判定为单一语法关系。
- source_word: יְמֵי נְעוּרֶיהָ
  choice: 她年轻时……的日子
  rationale: 保留“年轻时期的日子”这一希伯来语时间表达，并用现代汉语自然句式呈现；不采用较窄的“少女时代”。
- source_word: אֲשֶׁר זָנְתָה
  choice: 在……卖淫
  rationale: זנה 是本节核心动词。“卖淫”明确保留原文刻意而强烈的性意象，比泛化为“不忠”或“淫乱”更贴近此处措辞。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留希伯来语“埃及之地”的传统地理表达及其历史回响，在现代中文中仍然清楚自然。
theological_decisions:
- issue: 以卖淫喻指偶像崇拜及政治、盟约上的不忠
  choice: 正文明确保留“淫行”和“卖淫”的意象
  alternative: 弱化为“不忠”“背信”或泛称“淫乱”
  rationale: 以西结刻意使用强烈的性意象描述百姓在宗教和政治上的背叛。保留该意象可传达先知话语的冲击力，但不进一步加入原文未明说的教派性解释。
- issue: לִזְכֹּר 所表达的逻辑关系
  choice: 译作“追念”，保留可作伴随情形或带有目的意味的张力
  alternative: 明确译为“为了重温”或“因为她想起”
  rationale: 该不定式的句法关系并非只能作单一解释；简洁并列能避免将动机或因果关系解释得过满。
translation_notes:
  register: 采用现代、庄重而直白的普通话。保留以西结书有意使用的尖锐性意象，不以委婉语削弱；句式简洁，适合普通读者朗读和理解。
