  yaml_path: translation/ot/ezekiel/023/031.yaml
  text: You have walked in the way of your sister[a], so I will put her cup into your hand.
translation:
  language: zh_hans
  text: 你走上了你姐妹所走的路；因此，我要把她的杯[a]放在你手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“杯”象征审判，指分给你姐妹的那一份审判。
    reason: cultural_note
lexical_decisions:
- source_word: בְּדֶרֶךְ
  choice: 走了……所走的路
  rationale: דֶּרֶךְ本义为道路，也常比喻生活方式或行为模式。用“走了……所走的路”既保留希伯来文“行走—道路”的意象，也符合现代汉语表达。
- source_word: אֲחוֹתֵךְ
  choice: 你姐妹
  rationale: 原文为单数“你的姐妹”。上下文虽可确定其具体所指，但本节继续使用亲属关系的寓言意象，因此不改译为城邦或民族名称。
- source_word: הָלָכְתְּ
  choice: 你走了
  rationale: הלך在此既有“行走”的字面意象，也表示行为和生活方式；“走了”与“路”搭配，保留原文隐喻。
- source_word: וְנָתַתִּי
  choice: 因此我要……放
  rationale: נתן可指给予、放置；与“杯”和“手中”连用时，“放在……手中”自然准确。连接词译为“因此”，表达前后行为与审判之间的结果关系。
- source_word: כוֹסָהּ
  choice: 她的杯
  rationale: 保留原文的杯之隐喻及阴性单数所属后缀，不在正文中直接释为刑罚或忿怒。
- source_word: בְּיָדֵךְ
  choice: 在你手中
  rationale: בְּ字面为“在”，与“放”组合成现代汉语自然的“放在你手中”，表示使其落入对方手里并由其承受。
theological_decisions:
- issue: 审判之杯的隐喻
  choice: 正文保留“她的杯”，以脚注说明其审判含义。
  alternative: 她受审判的杯／她受罚的那一份
  rationale: 本节原文只说“她的杯”，而上下文赋予这杯审判的意义。保留隐喻可避免把解释直接写入正文，同时脚注帮助普通读者理解先知性意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你姐妹”保留单数亲属意象；“走了……所走的路”有意保留原文的重复和行为隐喻。
