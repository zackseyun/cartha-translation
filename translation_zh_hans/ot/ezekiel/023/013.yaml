  text: And I saw that she had become unclean[b][a]; both of them followed the same way.
translation:
  language: zh_hans
  text: 我看见她已经玷污了自己[a]；姐妹二人走的是同一条路[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她已经成为不洁”，或“她已经被玷污了”。希伯来语动词既可侧重她所处的不洁状态，也可表示她因自己的行为而招致玷污。
    reason: lexical_alternative
  - marker: b
    text: 直译：“二人共有一条路”，即二人所走的道路相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: 我看见
  rationale: 该词是ראה的Qal叙事式第一人称单数，承接前文叙事，并表达先知的观察；汉语以“我看见”自然呈现。
- source_word: כִּי
  choice: （不另译）
  rationale: 这里引出“看见”的内容；现代汉语中“我看见她……”无需加“看见的是”或“看见……已经”，省译连接词更自然。
- source_word: נִטְמָאָה
  choice: 已经玷污了自己
  rationale: 该词是טמא的Nifal完成式阴性第三人称单数，可表示“被玷污了”“成为不洁”或结果性的自我玷污。结合本章人物因自身行为招致污秽的语境，正文采用自然的反身表达，同时用脚注保留较被动或状态性的理解。
- source_word: דֶּרֶךְ אֶחָד
  choice: 同一条路
  rationale: 字面为“一条路”，在לשתיהן的限定下表示二人共有同一种行径；“同一条路”既保留道路隐喻，又符合现代汉语。
- source_word: לִשְׁתֵּיהֶן
  choice: 姐妹二人
  rationale: 原文意为“属于她们两人的／她们二人共有的”。语境明确指两姐妹；补出“姐妹”可使汉语指代清楚，而不增加新的解释。
theological_decisions:
- issue: 阿荷拉与阿荷利巴寓言中的玷污
  choice: 译为“她已经玷污了自己”，保留道德与礼仪不洁以及由自身行为招致玷污的含义。
  alternative: “她已经成为不洁”或“她已经被玷污了”。
  rationale: Nifal形式本身允许状态、被动或结果性理解；本章的婚姻与性不忠意象指向偶像崇拜和盟约不忠。正文不淡化这一严重性，但脚注保留原文的语法歧义，不额外引入宗派性阐释。
- issue: 两姐妹共有的行为道路
  choice: 译为“姐妹二人走的是同一条路”。
  alternative: 较字面的“她们二人只有一条路／二人是一条路”。
  rationale: 原文是省略式名词句，字面为“二人是一条路／二人共有一条路”；补出“走的是”使现代汉语通顺，并保存“道路”作为生活方式或行为模式的隐喻。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“玷污了自己”保留本章强烈的道德、礼仪和婚姻不忠意象；分号对应原文观察内容中的两项判断。所有脚注标记均置于正文相关词句之后。
