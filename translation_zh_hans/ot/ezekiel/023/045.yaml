source:
  edition: WLC
  text: וַ/אֲנָשִׁ֣ים צַדִּיקִ֗ם הֵ֚מָּה יִשְׁפְּט֣וּ אֽוֹתְ/הֶ֔ם מִשְׁפַּט֙ נֹֽאֲפ֔וֹת וּ/מִשְׁפַּ֖ט שֹׁפְכ֣וֹת דָּ֑ם כִּ֤י נֹֽאֲפֹת֙ הֵ֔נָּה וְ/דָ֖ם בִּֽ/ידֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/045.yaml
  text: But righteous men will judge them with the judgment of adulteresses and with the judgment of women who shed blood[a], because they are adulteresses[b], and blood is on their hands.
translation:
  language: zh_hans
  text: 但公义的人，他们要按淫妇和流人血的女人所当受的审判来审判她们[a]；因为她们是淫妇，血也在她们手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要以审判淫妇和流人血之女人的判例审判她们。”
    reason: 原文两处“审判”构成的短语可理解为这些人所当受的审判，也可理解为适用于她们的判例或审判方式。
  - marker: b
    text: 直译：“血在她们手中。”这里的说法表示她们与流血之罪有关，并负有罪责。
    reason: 说明希伯来文手中有血的隐喻及其罪责含义。
lexical_decisions:
- source_word: וַ/אֲנָשִׁים צַדִּיקִם הֵמָּה
  choice: 但公义的人，他们
  rationale: אֲנָשִׁים为阳性复数“人/男人”，在此司法意象中译作“人”自然且不抹去原文语法；צַדִּיקִם兼具道德和司法上的“公义”含义。独立代词הֵמָּה具有强调作用，以“他们”保留。连接词ו按语境译为转折性的“但”。
- source_word: יִשְׁפְּטוּ אוֹתְהֶם
  choice: 要审判她们
  rationale: 未完成式在预言语境中表达将来的行动；宾语所指为前文拟人化为两个姐妹的城，因此按中文语境用“她们”。
- source_word: מִשְׁפַּט נֹאֲפוֹת
  choice: 按淫妇所当受的审判
  rationale: 原文直译为“淫妇的审判”，可指对淫妇施行的判决或刑罚；“所当受的审判”使现代中文清楚，同时保留司法语气。
- source_word: וּמִשְׁפַּט שֹׁפְכוֹת דָּם
  choice: 和流人血的女人所当受的审判
  rationale: שֹׁפְכוֹת是阴性复数分词，直指“流血的女人”；译文保留其阴性指涉以及与上一项平行的法律表达。
- source_word: כִּי נֹאֲפֹת הֵנָּה
  choice: 因为她们是淫妇
  rationale: כִּי在此说明审判的理由；谓语分词为阴性复数，译作“淫妇”保留法律与道德类别。
- source_word: וְדָם בִּידֵיהֶן
  choice: 血也在她们手中
  rationale: 紧贴希伯来文“血在她们手中”的空间隐喻，不改写为解释性的“她们负有血债”，从而保留原文形象和一定的语义张力。
theological_decisions:
- issue: 施行审判者的身份
  choice: 保留为“公义的人”，即预言法律图景中的审判执行者
  alternative: 将其具体解释为天上的使者、理想化的代理者，或直接指上帝
  rationale: 希伯来文明说“公义的人”，却没有进一步界定其身份；译文不把这一形象扩展为特定神学认定。
- issue: “血在手中”的意义
  choice: 保留原文隐喻，让上下文表达她们与流血之罪的关系
  alternative: 直接意译为“她们负有血债”或“她们犯了杀人流血的罪”
  rationale: 直译既可唤起罪责，也保留手中沾血的生动形象，避免把隐喻完全解释掉。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“按……所当受的审判来审判”略带法律语体，以对应原文重复使用的שׁפט/מִשְׁפָּט。“公义的人，他们”有意保留独立代词的强调；分号呈现判决与理由之间的结构。
