  text: וְ/ק֣וֹל הָמוֹן֮ שָׁלֵ֣ו בָ/הּ֒ וְ/אֶל אֲנָשִׁים֙ מֵ/רֹ֣ב אָדָ֔ם מוּבָאִ֥ים סובאים מִ/מִּדְבָּ֑ר וַֽ/יִּתְּנ֤וּ צְמִידִים֙ אֶל יְדֵי/הֶ֔ן וַ/עֲטֶ֥רֶת תִּפְאֶ֖רֶת עַל רָאשֵׁי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/042.yaml
  text: And the sound of a carefree multitude was in her[a], and to the men from the mass of mankind were brought drunkards from the wilderness[c][b]; and they put bracelets on their hands and a beautiful crown on their heads.
translation:
  language: zh_hans
  text: 她那里有一群安逸之人的声音[a]；又有从旷野带来的酒徒，被带到那些出自芸芸众生的男人那里[b]。他们把手镯戴在她们的手上，又把华美的冠冕戴在她们头上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安逸之人”也可译作“无忧无虑的人”或“自满的人”。
    reason: lexical_alternative
  - marker: b
    text: 本句中间部分的希伯来文很难确定。也可理解为：“酒徒从旷野被带到那些出自芸芸众生的男人那里。”其中译作“酒徒”的词读法或词义有争议，也可译作“示巴人”。
    reason: textual_and_syntactical_alternative
  - marker: c
    text: “华美的冠冕”直译为“华美之冠”，也可译作“荣耀的冠冕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל הָמוֹן֮ שָׁלֵ֣ו
  choice: 安逸人群的喧声
  rationale: קוֹל是可听见的声音，הָמוֹן指众多人群，也可带喧闹意味；שָׁלֵו表示安逸、无忧或自满。“安逸人群的喧声”既保留结构，也呈现宴乐场面的听觉氛围。
- source_word: בָהּ
  choice: 在她那里
  rationale: 保留阴性单数代词及本章把城拟人化为女人的意象，同时比生硬的“在她里面”更符合现代汉语。
- source_word: אֲנָשִׁים
  choice: 男人
  rationale: 原文为阳性复数，语境指前来与两个女人交往的男性，故不泛化为“人”。
- source_word: מֵרֹב אָדָם
  choice: 从芸芸众生中
  rationale: רֹב אָדָם是压缩而含混的表达，可指众多的人或普通大众；此译保留“来自广大人群”的基本意象而不武断限定其社会身份。
- source_word: מוּבָאִים סובאים מִמִּדְבָּר
  choice: 有人把旷野来的酒徒带来
  rationale: מוּבָאִים为被动形式，סובאים按辅音传统可理解为酒徒；为使汉语通顺转为不定施事的主动句，同时用脚注保留文本及句法上的疑难。
- source_word: צְמִידִים
  choice: 手镯
  rationale: 指戴在手腕或手臂上的饰物；“手镯”是普通现代汉语中最清楚自然的对应词。
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: 华美的冠冕
  rationale: 直译为“华美／荣耀的冠冕”；“华美的冠冕”兼顾原文名词结构的意义和汉语的自然表达。
theological_decisions:
- issue: 中间分句的句法关系
  choice: 将“从芸芸众生中来的男人”与“被带来的旷野酒徒”呈现为并列进入场景的群体
  alternative: 译作“酒徒从旷野被带到那些来自芸芸众生的男人那里”
  rationale: 希伯来语中间分句高度压缩，介词短语与被动分词的关系不明确。正文采用较易读但仍不过度解释的分句方式，脚注保留更贴近表层句法的另一种理解；此处不涉及需要教派化处理的神学结论。
translation_notes:
  register: 采用现代、庄重而可理解的普通话。“芸芸众生”略带书面色彩，用来承载原文מֵרֹב אָדָם的压缩表达；其余措辞力求自然。正文保留“她”与“她们”的转换，对应原文由单数地点／女人意象转为两个女人的复数指代。
