revisions:
- from: 她那里有安逸人群的喧声[a]；又有男人从芸芸众生中来，也有人把旷野来的酒徒[b]带来。他们把手镯戴在她们手上，把华美的冠冕戴在她们头上[c]。
  to: 她那里有一群安逸之人的声音[a]；又有从旷野带来的酒徒，被带到那些出自芸芸众生的男人那里[b]。他们把手镯戴在她们的手上，又把华美的冠冕戴在她们头上[c]。
  rationale: 修订恢复原文中被动分词与“到那些男人那里”的连接，避免把句法上相连的成分拆成并列事件；同时保留“出自芸芸众生的男人”这一困难短语的宽泛性。首句改用较自然且不额外强化噪杂意味的“声音”。脚注保留并更准确地表明中间分句和“酒徒/示巴人”读法的争议。
