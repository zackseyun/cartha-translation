  yaml_path: translation/ot/ezekiel/023/026.yaml
  text: They will strip you of your garments and take your splendid ornaments[a].
translation:
  language: zh_hans
  text: 他们要剥去你的衣服，拿走你华美的饰物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“彰显你荣美的物件”；直译“你荣美的器物”。
    reason: 保留כְּלֵי תִפְאַרְתֵּךְ可指饰物，也可较宽泛地理解为与其荣美有关之物件的词义空间。
lexical_decisions:
- source_word: וְהִפְשִׁיטוּךְ
  choice: 他们要剥去你的衣服
  rationale: 使役形动词带第二人称阴性单数后缀，表示把某人身上的衣物脱去；结合后面的宾语“你的衣服”，译为“剥去你的衣服”直接自然，也不额外加入“赤身”等原文未明说的意思。
- source_word: בְּגָדָיִךְ
  choice: 你的衣服
  rationale: בגד是衣服、衣物的常用词；“衣服”符合现代汉语，同时保留此处受辱与审判的语境。
- source_word: וְלָקְחוּ
  choice: 拿走
  rationale: לקח基本义为“拿、取”；语境表明物品被夺去，“拿走”既自然，也不把动词强化为原文未明确表达的“抢夺”。
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: 你华美的饰物
  rationale: כְּלֵי泛指器物、物件，תִפְאַרְתֵּךְ表示“你的华美、荣美”；在描写女子妆饰的语境中，“华美的饰物”传达最可能的所指，同时脚注保留更贴近字面的表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“剥去”保留先知审判语言的力度；“饰物”比“珠宝”更宽泛，避免把原文所指限定为贵金属或宝石。
