  text: לָ/כֵ֥ן נְתַתִּ֖י/הָ בְּ/יַד מְאַֽהֲבֶ֑י/הָ בְּ/יַד֙ בְּנֵ֣י אַשּׁ֔וּר אֲשֶׁ֥ר עָגְבָ֖ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/009.yaml
  text: Therefore I gave her into the hand of her lovers[a], into the hand of the sons of Assyria[b], for whom she lusted.
translation:
  language: zh_hans
  text: 因此，我把她交在她的情人手中，交在她所淫恋的亚述人[a][b]手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“亚述之子”，即“亚述人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“痴迷他们”。原文动词表示强烈的欲念；在本章的淫乱隐喻中，含有情欲迷恋的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 标明本节是由前文罪状引出的审判后果，保留原文明确的推论关系。
- source_word: נְתַתִּיהָ
  choice: 我把她交在……手中
  rationale: נתן 与“在……手中”连用，表示把某人交由他者控制；中文用“交在……手中”既保留原文意象，也自然表达权柄转移。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语具体的“手”之意象，在现代中文中也能清楚表示落入对方掌控。
- source_word: מְאַהֲבֶיהָ
  choice: 她的情人
  rationale: 本章以淫乱比喻不忠的政治关系；“情人”保留这种越界亲密关系的隐喻，不改译为解释性的“盟友”。
- source_word: בְּנֵי אַשּׁוּר
  choice: 亚述人
  rationale: 原文字面为“亚述之子”，在希伯来语中是指亚述民族的惯用表达；“亚述人”是自然、准确的现代中文。
- source_word: עָגְבָה עֲלֵיהֶם
  choice: 她曾淫恋他们
  rationale: עגב 表达强烈而带有性意味的迷恋；“淫恋”保留本章通奸隐喻中的欲念和负面色彩，同时避免弱化为一般的“喜爱”。
theological_decisions:
- issue: 以性关系比喻撒马利亚与亚述的政治结盟及圣约不忠
  choice: 保留“情人”和“淫恋”的性隐喻
  alternative: 解释性地译作“盟友”和“渴望与他们结盟”
  rationale: 原文有意借淫乱和情欲描写不忠；直保留这一张力，既呈现先知话语的力度，也不额外加入宗派性解释。
- issue: “情人”与“亚述人”的同位关系
  choice: 用“就是交在……”明确亚述人即她的情人
  alternative: 只重复“交在……手中”而不加连接词
  rationale: 原文重复 בְיַד，使两者形成同位说明；中文加“就是”可自然呈现这一关系，而不改变所指。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“交在……手中”保留先知审判语言的具体意象；“淫恋”虽比日常用语凝练，却能让普通读者理解其不正当情欲之意，并与全章隐喻保持一致。所有脚注标记均置于正文相应词语之后。
