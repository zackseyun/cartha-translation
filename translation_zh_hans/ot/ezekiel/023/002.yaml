  yaml_path: translation/ot/ezekiel/023/002.yaml
  text: Son of man[a], there were two women, daughters of one mother.
translation:
  language: zh_hans
  text: “人子啊，有两个女人，是同一个母亲所生的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的呼称；“人子”既保留希伯来语表达，也符合现代中文圣经语体。
- source_word: שְׁתַּיִם נָשִׁים
  choice: 两个女人
  rationale: 按通常词义直译；本节只是引出两个女性形象，译作“妻子”会过早加入后文婚姻隐喻的解释。
- source_word: בְּנוֹת אֵם אַחַת
  choice: 是同一个母亲所生的
  rationale: 希伯来语直译为“一个母亲的女儿”；此处采用自然、明确的现代汉语，表达二人同母所生。
- source_word: הָיוּ
  choice: 有
  rationale: 这里的 היה 用于陈述存在，现代汉语以“有”表达最为自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“人子”保留本书具有辨识度的先知呼称；后半句避免生硬的“一个母亲的女儿”，以“同一个母亲所生”清楚传达亲属关系。
