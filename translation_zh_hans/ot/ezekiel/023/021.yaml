base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/021.yaml
  text: Thus you revisited the lewdness of your youth[a], when in Egypt they fondled your breasts[c][b], the breasts of your youth.
translation:
  language: zh_hans
  text: 这样，你又追念你年轻时的淫荡[a]：在埃及[b]，人因你青春时的乳房而抚弄你的乳房[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “追念”也可译作“重温”“想起”或“再次眷恋”。希伯来语动词可表示“探访、关注、想起”；在这里也可能含有重返从前行为的意味。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“从埃及”；这里按语境译作“在埃及”，也可能含有埃及人作为行为者的意思。
    reason: lexical_alternative
  - marker: c
    text: “抚弄”所译的希伯来语表达带有明确的性意味，指对乳房的情色触摸。
    reason: lexical_alternative
  - marker: d
    text: “因……而”译自一个通常表示“为了、因着”的希伯来语连接词。原文句法凝缩；此处也可理解为目的或相关关系，不宜断定为单纯同位语。
    reason: textual_or_syntactical_ambiguity
lexical_decisions:
- source_word: וַתִּפְקְדִי
  choice: 你又重温
  rationale: פקד可表示探访、关注或想起；结合上下文，“重温”既保留追忆往事的意味，也可暗示再次涉入从前的行为，避免只限定为思想上的回忆。
- source_word: זִמַּת נְעוּרָיִךְ
  choice: 年轻时的淫荡
  rationale: זִמָּה在本段的性行为语境中指淫荡、邪淫之事；“淫荡”保留先知控诉中明确的性与道德色彩。
- source_word: בַּעְשׂוֹת מִמִּצְרַיִם דַּדַּיִךְ
  choice: 那时在埃及，人抚弄你的乳房
  rationale: 希伯来语结构高度凝缩，מִן字面为“从”，但此处指向埃及这一地点或行为来源；中文补出泛指施事“人”，使句意通顺而不武断指定具体人物。
- source_word: דַּדַּיִךְ
  choice: 你的乳房
  rationale: 采用直接的身体用语，不以“姿色”等委婉词削弱原文刻意露骨的比喻。
- source_word: שְׁדֵי נְעוּרָיִךְ
  choice: 你青春时的胸脯
  rationale: 保留原文对青春时期身体意象的重复；与前面的“乳房”稍作措辞变化，使现代汉语自然，同时不改变所指。
theological_decisions:
- issue: 先知审判话语中露骨的性比喻
  choice: 保留“淫荡”“乳房”“胸脯”等直白意象
  alternative: 弱化为“淫乱”“姿色”或“魅力”
  rationale: 本节以刻意鲜明的性意象描绘耶路撒冷的背信；委婉化会削弱原文的控诉力度。
- issue: פקד所表达的是回忆还是重新涉入
  choice: 用“重温”保留回想与重新经历之间的张力
  alternative: 明确译作“想起”或“重新犯下”
  rationale: 该动词语义范围较宽，而上下文容许记起旧事和重返旧行两层意味；正文不宜替原文排除其中一层。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留先知话语的露骨冲击力，不作色情化发挥；以分号呈现前因后果，以“就是”连接末尾重复意象，并用脚注说明原文句法的不确定性。
