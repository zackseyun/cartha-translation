base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/005.yaml
  text: Oholah played the prostitute while under me[a], and she lusted after her lovers[c][b], the Assyrians who were nearby.
translation:
  language: zh_hans
  text: 阿荷拉仍归我时[a]就行淫；她恋慕[b]自己的情人，就是邻近的亚述人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在我之下”；这里的婚姻隐喻也可理解为“仍归我时”。
    reason: lexical_alternative
  - marker: b
    text: 或译“贪恋”“痴迷于”。原文动词表示强烈、带情欲色彩的欲求。
    reason: lexical_alternative
  - marker: c
    text: 或译“近处的亚述人”。原文也可较直译为“亚述，那些邻近的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזֶן
  choice: 行淫
  rationale: 保留זנה在本章婚姻隐喻中的露骨性与负面色彩，既可指卖淫般的行为，也在先知语境中刻画盟约不忠，不弱化为一般的“不忠”。
- source_word: אָהֳלָה
  choice: 阿荷拉
  rationale: 按现代中文圣经人名音译习惯处理专名，不把名字的可能含义译入正文。
- source_word: תַּחְתָּי
  choice: 还在我权下时
  rationale: תחת加第一人称单数后缀直指“在我之下”，在婚姻隐喻中兼有处于耶和华权下、保护下或归属关系中的意味；正文以自然中文表达其时间和关系色彩，脚注保留较直译形式。
- source_word: וַתַּעְגַּב
  choice: 恋慕
  rationale: עגב表达强烈而带情色意味的欲求。“恋慕”在本句“行淫、情人”的语境中能显出欲念，又比单纯“喜爱”更强；脚注说明可更强烈地译为“贪恋”。
- source_word: מְאַהֲבֶיהָ
  choice: 自己的情人
  rationale: 该分词在此作名词，指婚姻隐喻中的非法伴侣，也影射撒马利亚所依附的外邦势力；“情人”自然保留双重意象。
- source_word: אֶל־אַשּׁוּר
  choice: 就是……亚述人
  rationale: 介词אֶל本有朝向之意，但在“恋慕”之后中文无需重复方向介词；后接阳性复数קְרוֹבִים，故按群体理解为“亚述人”，并以同位说明连接“情人”。
- source_word: קְרוֹבִים
  choice: 邻近的
  rationale: 保留其复数形容词所表达的空间接近，不擅自限定为政治上的“邻邦”或关系上的“亲近者”。
theological_decisions:
- issue: 婚姻与淫乱隐喻所表达的盟约不忠
  choice: 明确译作“行淫”“恋慕”“情人”
  alternative: 译作“不忠”“寻求外援”
  rationale: 原文有意用强烈的性隐喻描述撒马利亚的偶像崇拜及对外邦势力的依附。正文保留该隐喻及其张力，不把它缩减为单纯的外交政策说明。
- issue: תַּחְתָּי所包含的关系含义
  choice: 译作“还在我权下时”，并以脚注保留直译和归属意味
  alternative: 译作“仍属我时”或仅作空间性的“在我下面”
  rationale: 该短语处于婚姻隐喻中，可能同时触及权柄、保护与归属；正文给出通顺而不过度具体化的表达，脚注承认原文的简约与多义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行淫”延续先知性婚姻隐喻的力度；分号呈现两个并列动作，“就是”使“她的情人”与“亚述人”的同位关系清楚。所有脚注标记均置于正文相应词语之后。
