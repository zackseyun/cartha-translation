  text: וּ/בָ֣אוּ עָלַ֡יִ/ךְ הֹ֠צֶן רֶ֤כֶב וְ/גַלְגַּל֙ וּ/בִ/קְהַ֣ל עַמִּ֔ים צִנָּ֤ה וּ/מָגֵן֙ וְ/קוֹבַ֔ע יָשִׂ֥ימוּ עָלַ֖יִ/ךְ סָבִ֑יב וְ/נָתַתִּ֤י לִ/פְנֵי/הֶם֙ מִשְׁפָּ֔ט וּ/שְׁפָט֖וּ/ךְ בְּ/מִשְׁפְּטֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/024.yaml
  text: They will come against you with troops, chariots, and wagons, and with an assembly of peoples. They will set shield and buckler and helmet against you on every side, and I will set judgment before them, and they will judge you by their judgments.
translation:
  language: zh_hans
  text: 他们必带着军队、战车和车辆，连同各族民众的集会，前来攻击你。他们必从四面带着大盾、小盾和头盔来对付你。我要把审判的事交给他们；他们必按自己的审判来审判你。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֹצֶן
  choice: 军队
  rationale: 此词罕见，具体含义不确定；结合并列的战车、车辆和各族军众，译作“军队”较符合军事语境，也与审定的英语咨询层一致。
- source_word: רֶכֶב וְגַלְגַּל
  choice: 战车和辎重车
  rationale: רֶכֶב指战车或车辆；גַלְגַּל本义为轮，语境中可能借指有轮车辆。为避免生硬的“轮子”，按攻城军队语境译为“辎重车”。
- source_word: קְהַל עַמִּים
  choice: 各族组成的大军
  rationale: 字面为“众民的集会/会众”；在军事来攻语境中，用“各族组成的大军”自然表达多民族军兵的集合。
- source_word: צִנָּה וּמָגֵן וְקוֹבַע
  choice: 大盾、小盾和头盔
  rationale: 保留两类盾牌的区别：צִנָּה通常指较大的盾，מָגֵן指较小的盾，קוֹבַע为头盔。
- source_word: וְנָתַתִּי לִפְנֵיהֶם מִשְׁפָּט
  choice: 我要把审判权交给他们
  rationale: 字面为“我要把审判放在他们面前”；这里表示上帝将此案交由他们裁断，中文以“把审判权交给他们”较清楚，同时保留他们作为审判执行者的含义。
- source_word: בְּמִשְׁפְּטֵיהֶם
  choice: 按自己的判例
  rationale: 复数מִשְׁפָּטִים可指判决、法规或司法惯例；“判例”保留他们依自身司法标准裁判的意味。
theological_decisions:
- issue: 上帝的审判与外邦审判者的关系
  choice: “我要把审判权交给他们，他们必按自己的判例审判你”
  alternative: “我要在他们面前提出判决，他们必照自己的法令审判你”
  rationale: 原文同时陈述上帝将审判置于他们面前，以及他们按自身的מִשְׁפָּטִים施行审判；译文不把两者调和成完全相同的标准，保留神圣主权与外邦司法方式之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“前来攻击你”“从四面围攻你”使军事行动清楚；避免古奥表达，同时保留审判语汇的严肃性。
