base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/040.yaml
  text: And moreover[a], they sent for men coming from far away, to whom a messenger had been sent; and behold, they came—to the one who had washed herself, painted her eyes, and adorned herself with jewelry.
translation:
  language: zh_hans
  text: 而且，她们还派使者去召从远方而来的男子；使者已经奉差遣到他们那里。看哪，他们来了，来到那已经沐浴、画了眼妆[a]、佩戴首饰的女子那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “画了眼妆”指用深色眼部化妆品勾画或涂饰眼睛，也可译作“用科尔粉描画眼睛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף כִּי
  choice: 而且……还
  rationale: 保留该组合推进并加强指控的附加、强调语气，同时符合现代汉语表达。
- source_word: תִשְׁלַחְנָה
  choice: 她们还派人去召
  rationale: 动词是第三人称阴性复数，与上下文中拟人化的两个姐妹／城相合；“召”表达向远方男子发出邀请之意。
- source_word: לַאֲנָשִׁים בָּאִים מִמֶּרְחָק
  choice: 那些从远方来的人
  rationale: 保留分词“来”和空间短语“从远方”；汉语的“人”已由语境表明为男子。
- source_word: אֲשֶׁר מַלְאָךְ שָׁלוּחַ אֲלֵיהֶם
  choice: 使者已经奉差遣到他们那里
  rationale: מַלְאָךְ在此指人的使者，并非天使；“奉差遣”反映被动分词，且不强行指定是谁差遣。
- source_word: וְהִנֵּה בָאוּ
  choice: 看哪，他们果然来了
  rationale: “看哪”保留先知话语中鲜明的指示语气，“果然”自然呈现使者受差后他们随即来到的强调效果。
- source_word: לַאֲשֶׁר
  choice: 来到那……的女子那里
  rationale: 明确表现原文由复数的来客转向单数阴性受话者的结构变化。
- source_word: רָחַצְתְּ
  choice: 洗净自己
  rationale: 在梳妆迎客的语境中，汉语以反身表达自然呈现动作落在本人身上。
- source_word: כָּחַלְתְּ עֵינַיִךְ
  choice: 描了眼睛
  rationale: 表达使用深色眼部化妆品修饰双眼；具体材料“眼影粉／科尔粉”不完全确定，置于脚注说明。
- source_word: וְעָדִית עֶדִי
  choice: 佩戴了首饰
  rationale: 自然表达动词与同根名词构成的“以饰物装饰自己”，适合现代庄重汉语。
theological_decisions:
- issue: 本节阴性复数与阴性单数之间的指称转换
  choice: 开头译为复数“她们”，梳洗装饰部分译为单数“女子”
  alternative: 为行文顺畅而全部译成单数或全部译成复数
  rationale: 原文先将两个拟人化的姐妹／城合说，随后转向单数阴性受话者；保留转换可维持先知修辞及其真实张力，避免替原文消解指称变化。
- issue: 使者的身份
  choice: 译作人的“使者”
  alternative: 译作“天使”
  rationale: 此处语境是召请远方男子，מַלְאָךְ指受差遣传信的人，不涉及超自然使者。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号和句号理清召请、差遣、来临及梳妆四层动作；保留“看哪”的先知性语体，并保留原文复数到单数的突转。
