  text: וְ/רָגְמ֨וּ עֲלֵי/הֶ֥ן אֶ֨בֶן֙ קָהָ֔ל וּ/בָרֵ֥א אוֹתְ/הֶ֖ן בְּ/חַרְבוֹתָ֑/ם בְּנֵי/הֶ֤ם וּ/בְנֽוֹתֵי/הֶם֙ יַהֲרֹ֔גוּ וּ/בָתֵּי/הֶ֖ן בָּ/אֵ֥שׁ יִשְׂרֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/047.yaml
  text: And the assembly will stone them with stones and cut them down with their swords. They will kill their sons and their daughters[a], and burn their houses with fire.
translation:
  language: zh_hans
  text: 会众要用石头砸她们，并用他们的刀剑砍她们[a]；又要杀死她们的儿子和女儿，并用火焚烧她们的房屋。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用他们的刀剑砍倒她们”或“用他们的刀剑把她们砍成碎块”。
    reason: 原文动词ברא在此用法罕见，可表示砍、劈；具体动作的程度存在词义上的不确定性。
lexical_decisions:
- source_word: וְרָגְמוּ עֲלֵיהֶן אֶבֶן קָהָל
  choice: 会众要用石头打她们
  rationale: רגם表示用石头攻击或处死；אבן虽为单数，在此作集合性、工具性用法。“用石头打”既贴近原文，也比在未明说处刑结果时译作“用石头打死”更谨慎。קהל译为“会众”，保留有组织之群体的正式意味。
- source_word: וּבָרֵא אוֹתְהֶן בְּחַרְבוֹתָם
  choice: 用刀剑砍倒她们
  rationale: 此处ברא的罕见用法指砍、劈或斩；“砍倒”保留暴力意象而不过度具体化为肢解。בְּ为工具用法，故译“用刀剑”。
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם יַהֲרֹגוּ
  choice: 又要杀死她们的儿女
  rationale: 原文分别说“儿子和女儿”，现代汉语以“儿女”自然涵盖二者；הרג直译为“杀死”。虽然马所拉文本此处代词词尾为阳性复数，语境仍将这些儿女与前述两名女性所象征的城邑相连。
- source_word: וּבָתֵּיהֶן בָּאֵשׁ יִשְׂרֹפוּ
  choice: 放火焚烧她们的房屋
  rationale: 保留“房屋”的具体意象；“放火焚烧”自然表达希伯来语“用火烧”的强调性说法。
theological_decisions:
- issue: 阴性复数代词的所指
  choice: 译作“她们”，不在正文中补明姓名或所象征的城邑
  alternative: 译作“这两个女人”或直接点明阿荷拉和阿荷利巴
  rationale: 原文以阴性复数代词承接寓言中的两个女人；保留代词可维持上下文衔接，并避免把解释直接写入正文。
- issue: “儿女”所属代词的性别形式
  choice: 依语境译为“她们的儿女”
  alternative: 机械反映马所拉文本阳性复数词尾，译为“他们的儿女”
  rationale: בְּנֵיהֶם וּבְנוֹתֵיהֶם的词尾形式为阳性复数，与本节其余指向两名女性的阴性复数形式不同；但上下文及平行结构表明这里仍指她们所属群体的儿女。中文正文按语境处理，同时不扩展其神学所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“会众”保持审判性、集体性的语气；分号呈现原文由针对两名女性转向其儿女和房屋的动作层次。脚注标记置于其实际说明的“砍倒她们”之后。
