  text: וְ/הִשְׁבַּתִּ֥י זִמָּ֖ה מִן הָ/אָ֑רֶץ וְ/נִֽוַּסְּרוּ֙ כָּל הַ/נָּשִׁ֔ים וְ/לֹ֥א תַעֲשֶׂ֖ינָה כְּ/זִמַּתְ/כֶֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/048.yaml
  text: Thus I will put an end to lewdness in the land[a], and all women will be warned and will not act according to your lewdness.
translation:
  language: zh_hans
  text: 这样，我必使这地的淫行止息；所有妇女都必受警戒，不再照你们的淫行而行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: 我必使……止息
  rationale: 使役式表达“使之停止”，既保留希伯来语的使役力量，也符合现代汉语的庄重语体。
- source_word: זִמָּה
  choice: 淫行
  rationale: 本章以淫乱和奸淫为核心意象；“淫行”兼顾性道德含义与具体行为色彩，并可在本节前后两处自然重复。
- source_word: מִן הָאָרֶץ
  choice: 从这地
  rationale: 直译介词 מִן 的离开、除去之意；“这地”在先知书语境中自然，也保留其所指范围可能是本地或全地的张力。
- source_word: וְנִוַּסְּרוּ
  choice: 都将受到警戒
  rationale: יסר 的被动式可涵盖因惩罚而受管教，以及因他人遭遇而得到警戒；正文采用“受到警戒”以突出本句的鉴戒效果，并用脚注保留管教、惩戒的可能。
- source_word: כָּל הַנָּשִׁים
  choice: 所有妇女
  rationale: 按希伯来语明确的阴性复数直译，不泛化为“所有人”，也不擅自限定为某一地区的妇女。
- source_word: וְלֹא תַעֲשֶׂינָה כְּזִמַּתְכֶנָה
  choice: 不再照你们的淫行而行
  rationale: “照……而行”保留比较介词 כְּ 和行为动词 עשה 的搭配；“你们”反映原文对两位女性形象的阴性复数称呼。“不再”自然表达审判所带来的结果。
theological_decisions:
- issue: 审判神谕中“所有妇女”的所指与修辞功能
  choice: 按原文译作“所有妇女”，让她们因两个女性形象所受的审判而得到警戒。
  alternative: 译为“这地所有的妇女”或将其泛化为“所有人”。
  rationale: 原文明确使用“所有妇女”，而本章以阿荷拉和阿荷利巴象征撒马利亚与耶路撒冷。译文保留这一性别明确的先知性修辞，不扩大或缩小其范围。
- issue: וְנִוַּסְּרוּ 所表达的是警戒还是惩戒
  choice: 正文译为“受到警戒”，脚注说明也可理解为“受到管教”或“受到惩戒”。
  alternative: 正文直接译作“受到管教”或“受到惩戒”。
  rationale: 后续“不再……而行”支持鉴戒、威慑的结果，但该词本身也可指借惩罚施行的纠正，因此不在正文中完全排除惩戒含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使……止息”和“照……而行”略带经文语体，但并不晦涩；分号清楚呈现神终止淫行与众妇女受到鉴戒之间的结果关系。
