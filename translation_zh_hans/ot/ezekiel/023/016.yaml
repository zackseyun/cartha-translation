  text: ו/תעגב עֲלֵי/הֶ֖ם לְ/מַרְאֵ֣ה עֵינֶ֑י/הָ וַ/תִּשְׁלַ֧ח מַלְאָכִ֛ים אֲלֵי/הֶ֖ם כַּשְׂדִּֽימָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/016.yaml
  text: At the sight of her eyes[b][a], she lusted after them and sent messengers to them in Chaldea.
translation:
  language: zh_hans
  text: 她一看见他们，就对他们起了淫欲，并派使者到迦勒底人那里去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到迦勒底人那里去”也可译作“往迦勒底去”。希伯来语词形带有表示方向的词尾。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגַּב עֲלֵיהֶם
  choice: 就对他们动了淫欲
  rationale: עגב在本章的性隐喻中表达强烈的情色欲望；“动了淫欲”保留先知话语刻意直白而尖锐的力度，也自然表达עַל所标示的欲望对象。
- source_word: לְמַרְאֵה עֵינֶיהָ
  choice: 她一看见他们
  rationale: 希伯来语直译近于“在她眼睛所见之下/一见之下”，在上下文中指她看见画像中的人；此译自然传达视觉触发欲望的关系，同时不把生硬的身体部位表达带入中文。
- source_word: וַתִּשְׁלַח מַלְאָכִים
  choice: 并派使者
  rationale: מַלְאָכִים的基本义是“使者”；语境可能涉及外交使团，但正文不把其正式身份说得过满。
- source_word: אֲלֵיהֶם כַּשְׂדִּימָה
  choice: 到迦勒底去见他们
  rationale: אֲלֵיהֶם表示使者前往这些人，כַּשְׂדִּימָה带方向词尾，表示“往迦勒底/迦勒底人那里”。此译同时保留目的地和收信对象，避免误解为他们只是身处某地而没有移动含义。
theological_decisions:
- issue: 以情色隐喻描写政治和宗教上的不忠
  choice: 保留明确的“动了淫欲”
  alternative: “迷恋他们”或“爱慕他们”
  rationale: 以西结书23章有意使用露骨而震撼的性语言谴责不忠；弱化措辞会削减原文的先知性力度。
- issue: 迦勒底方向形式所指的是地域还是族群
  choice: 正文译作“到迦勒底去”，脚注保留“迦勒底人那里”的可能
  alternative: “到迦勒底人那里去”
  rationale: כַּשְׂדִּים通常可指迦勒底人，其带方向词尾的形式也可按目的地表达；两种理解在此高度重叠，不宜无注释地排除其中一种。
translation_notes:
  register: 采用现代、庄重而直白的普通话。“动了淫欲”保留原文情色隐喻的冲击力；“她一看见他们”将希伯来语字面近于“在她眼睛所见之下”的说法转为自然中文。
