  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הַעֲלֵ֤ה עֲלֵי/הֶם֙ קָהָ֔ל וְ/נָתֹ֥ן אֶתְ/הֶ֖ן לְ/זַעֲוָ֥ה וְ/לָ/בַֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/046.yaml
  text: 'For thus says the Lord GOD: Bring up an assembly against them[a], and give them over to terror and plunder.'
translation:
  language: zh_hans
  text: 因为主耶和华如此说：要召集一群人来攻击她们，把她们交出来，使她们成为惊骇和掳掠的对象[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使她们遭受惊恐和掳掠”。希伯来语“惊骇”一词也可指恐惧或战栗的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 以现代中文圣经语体中的常见形式表达复合神圣称号，同时保留专名与“主”的区别。
- source_word: הַעֲלֵה
  choice: 召集……来
  rationale: 这是עלה的使役式命令形；在此语境中指调集一批人前来施行审判，比字面的“使上来”更符合现代汉语。
- source_word: קָהָל
  choice: 一群人
  rationale: 该词基本义为聚集起来的群体；上下文表明其带有敌对性质，但名词本身并未明确说是军队，故不作过度限定。
- source_word: וְנָתֹן
  choice: 把……交给
  rationale: 该形式承接前面的命令语气；“交给”自然表达使她们落入某种处境或结局。
- source_word: לְזַעֲוָה
  choice: 惊恐
  rationale: זַעֲוָה可指恐惧、惊骇，也可能表示成为令人惊骇的对象；正文保留较简洁的抽象表达，并用脚注说明另一种理解。
- source_word: לָבַז
  choice: 掳掠
  rationale: בַּז指战事中的战利品或被掠夺的状态；“掳掠”在审判语境中自然且庄重。
- source_word: עֲלֵיהֶם / אֶתְהֶן
  choice: 攻击她们……她们
  rationale: 根据本章俄荷拉和俄荷利巴两个女性拟人形象，以“她们”明确指代；希伯来文先用阳性复数后用阴性复数，这一语法转换难以在自然中文中直接再现。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”是现代中文读者熟悉且庄重的表达，并使复合称号的两个成分保持可辨；不借此引入任何宗派性解释。
- issue: לְזַעֲוָה所表达的是她们经历惊恐，还是成为令人惊骇的对象
  choice: 正文译作“交给惊恐”
  alternative: 使她们成为令人惊骇的对象
  rationale: 希伯来名词及介词结构容许结果、状态或对象化的理解；正文采用简洁译法，脚注保留另一种真实可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“一群人”避免把קָהָל过度具体化为军队；“来攻击”清楚表达עַל在敌对语境中的含义。脚注标记已在正文中出现。
