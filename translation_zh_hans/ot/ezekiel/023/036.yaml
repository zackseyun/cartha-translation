  source_fidelity: 原文的叙事推进、对以西结“人子”的称呼、疑问式“你要审判……吗？”以及随后命令“向她们宣告她们的可憎之事”均基本准确。惟神名 יְהוָה 的中文译名“耶和华”未与本项目英文审校轨迹所确定的“Yahweh”相一致；应译作“雅威”。
  naturalness: 整体庄重自然。“你要审判……吗？你要向她们宣告……”能保留原文疑问后接命令的句法张力；将第二个“你要”改为“并要”可使汉语衔接更自然，且不改变命令语气。
  terminology: “人子”“审判”“宣告”“可憎之事”均适合本节先知性语域。“阿荷拉、阿荷利巴”作为专名音译可保留。“雅威”对应英文审校轨迹的 Yahweh，避免将已决定音译为 Yahweh 的神名改用 Jehovah 的传统音译。
