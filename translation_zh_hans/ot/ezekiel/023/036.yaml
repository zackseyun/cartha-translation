base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/036.yaml
  text: Then Yahweh said to me, “Son of man, will you judge Oholah and Oholibah? Then declare to them their abominations.”
translation:
  language: zh_hans
  text: 雅威对我说：“人子啊，你要审判阿荷拉和阿荷利巴吗？并要向她们宣告她们那些可憎之事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对我说
  rationale: 叙事性连接词推进话语；现代汉语无需机械译出“然后”，以自然句序表达承接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中通行的神名音译，保留其专名性质，不以称号替代。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是以西结书中上帝对先知的固定称呼；“人子”简洁、庄重，并贴近希伯来语形式。
- source_word: הֲתִשְׁפּוֹט
  choice: 你要审判……吗
  rationale: 保留疑问形式及未完成体在先知受命语境中的意愿、使命色彩，不擅自改成纯命令句。
- source_word: אָהֳלָה וְאֶת אָהֳלִיבָה
  choice: 阿荷拉和阿荷利巴
  rationale: 按希伯来语专名音译，并与中文读音习惯协调。
- source_word: וְהַגֵּד
  choice: 你要……宣告
  rationale: 该词是使役词干命令式，意为使人知道、告知；“宣告”符合先知公开指出罪恶的语境。
- source_word: תוֹעֲבוֹתֵיהֶן
  choice: 她们那些可憎之事
  rationale: “可憎之事”既保留该词强烈的道德及敬拜层面谴责，也比抽象名词“可憎”更符合现代汉语。
theological_decisions:
- issue: 是否把 הֲתִשְׁפּוֹט 直接处理为命令
  choice: 保留“你要审判……吗？”的疑问形式
  alternative: 译为“你要审判……，要向她们宣告……”或“你审判她们吧”
  rationale: 希伯来文本明确带疑问词 הֲ；虽然上下文具有委任和催促意味，正文仍保留其修辞疑问所形成的张力。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，译文以中文传统且广为人知的专名音译“耶和华”呈现，而不以“主”这一称号替换。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个女性化拟人专名以“她们”回指；第二句补出“你要”，使疑问后的命令在中文中清楚自然。
