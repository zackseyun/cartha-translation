  text: וְ/אֶת תַּזְנוּתֶ֤י/הָ מִ/מִּצְרַ֨יִם֙ לֹ֣א עָזָ֔בָה כִּ֤י אוֹתָ/הּ֙ שָׁכְב֣וּ בִ/נְעוּרֶ֔י/הָ וְ/הֵ֥מָּה עִשּׂ֖וּ דַּדֵּ֣י בְתוּלֶ֑י/הָ וַ/יִּשְׁפְּכ֥וּ תַזְנוּתָ֖/ם עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/008.yaml
  text: Yet she did not abandon her prostitutions from Egypt[a], for in her youth they had lain with her[b], and they fondled her virgin breasts and poured out their prostitution upon her.
translation:
  language: zh_hans
  text: 然而，她并没有离弃从埃及而来的淫行[a]；因为她年轻时，埃及人曾与她同寝，抚弄她童贞时的乳房[b]，把他们的淫行倾倒在她身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她源自埃及的淫行”。原文在本节反复使用卖淫的意象，借此表现背约的不忠。
    reason: lexical_alternative
  - marker: b
    text: 直译近于“他们触弄她童贞时期的乳房”；这是明确的性意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּזְנוּתֶיהָ
  choice: 她的淫行
  rationale: 复数抽象名词指反复的淫乱行为；在本章比喻中也承载背约不忠之意。“淫行”保留先知话语直接而刺耳的力度。
- source_word: מִמִּצְרַיִם
  choice: 从埃及带来的
  rationale: 介词 מִן 表明来源。“带来的”是为现代汉语自然度所作的最小补足，并未改作仅表示地点的“在埃及”。
- source_word: עָזָבָה
  choice: 没有离弃
  rationale: 在此表示没有停止或摆脱从前的行为；“离弃”兼具庄重语体与持续不改的含义。
- source_word: שָׁכְבוּ אוֹתָהּ
  choice: 与她同寝
  rationale: שׁכב 在语境中是性交的委婉表达；“同寝”清楚保留性含义，同时符合庄重的现代汉语。
- source_word: בִּנְעוּרֶיהָ
  choice: 她年轻时
  rationale: 直接表达其人生早期；在整段寓意中对应以色列早期历史，但正文不将寓意明说。
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֶיהָ
  choice: 抚弄她处女的乳房
  rationale: 该短语是明确的性意象。“抚弄”自然表达触摸摆弄的动作，“处女的乳房”保留 בְתוּלֶיהָ 对童贞时期的强调。
- source_word: וַיִּשְׁפְּכוּ תַזְנוּתָם עָלֶיהָ
  choice: 把他们的淫行倾倒在她身上
  rationale: 保留“倾倒”这一强烈动词意象，并以“淫行”维持本节词汇的一致性；不擅自缩窄为“情欲”或具体体液。
theological_decisions:
- issue: 以性化的先知性比喻描写背约、偶像崇拜及政治纠葛
  choice: 正文保留明确而令人不适的性意象
  alternative: 统一淡化为“淫乱”“不忠”等抽象措辞
  rationale: 以西结有意使用露骨的性语言表现盟约不忠及受外邦势力利用的历史。淡化会削弱原文的震撼力，并过早替读者解释比喻。
- issue: 行为主体“他们”的所指
  choice: 译作“埃及人”以衔接前文，再以“他们”延续
  alternative: 全节只译为“他们”
  rationale: 希伯来文代词的先行语由“埃及”这一集体地域名称提供。现代汉语若直接以“他们”起句容易指代不明，因此首处明示为“埃及人”，但不进一步限定其具体身份。
translation_notes:
  register: 采用现代、庄重而直接的简体中文。保留原文刻意露骨的先知性修辞，不以抽象神学术语替换；同时避免添加原文没有明说的具体生理解释。
