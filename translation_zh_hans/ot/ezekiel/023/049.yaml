  text: וְ/נָתְנ֤וּ זִמַּתְ/כֶ֨נָה֙ עֲלֵי/כֶ֔ן וַ/חֲטָאֵ֥י גִלּוּלֵי/כֶ֖ן תִּשֶּׂ֑אינָה וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/049.yaml
  text: They will put your lewdness upon you[a], and you will bear the sins of your idols; then you will know that I am the Lord YHWH.
translation:
  language: zh_hans
  text: 他们必使你们为自己的淫行受报；你们必担当你们因偶像[a]所犯的罪。这样，你们就知道我是主雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“偶像”的希伯来词含有强烈的轻蔑意味，也可更形象地译为“污秽的偶像”或“粪偶像”。
    reason: 保留גִלּוּלִים的贬斥语气，同时避免在正文中使用可能妨碍流畅理解的生硬表达。
lexical_decisions:
- source_word: וְנָתְנוּ ... עֲלֵיכֶן
  choice: 他们必把……加在你们身上
  rationale: 保留נתן与עַל构成的具体表达及审判意味；“加在……身上”在现代汉语中比逐字的“放在……上”自然，又没有把结果过度解释为某一种刑罚。
- source_word: זִמַּתְכֶנָה
  choice: 你们的淫行
  rationale: 本章语境兼具性方面与属灵不忠的意象；“淫行”保留行为层面的淫乱和道德羞耻意味，不将其泛化为一般的“邪恶”。
- source_word: וַחֲטָאֵי גִלּוּלֵיכֶן
  choice: 你们那些偶像的罪
  rationale: 尽量保留原文“罪＋你们的偶像”这一关系结构，不擅自限定为“拜偶像所犯的罪”或单纯的“罪责”；“那些”使中文表达较自然。
- source_word: תִּשֶּׂאינָה
  choice: 你们也必担当
  rationale: נשא与“罪”连用时具有承担、背负罪责及其后果的司法意味；“担当”能保留这一分量。
- source_word: וִידַעְתֶּם
  choice: 这样，你们就知道
  rationale: 连接词在此表达审判所产生的结果；“这样……就……”符合现代汉语，同时保留先后与结果关系。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 采用现代中文圣经读者熟悉的复合称号，分别对应אֲדֹנָי与יהוה，并避免译成重复的“主主”。
theological_decisions:
- issue: זִמָּה在本章性隐喻与属灵不忠之间的张力
  choice: 淫行
  alternative: 淫乱；邪恶；无耻行径
  rationale: “淫行”既符合两姐妹寓言中的性语言，也容许该意象指向偶像崇拜和盟约不忠，不把两层含义拆开或消解。
- issue: “担当偶像的罪”所指是罪行、罪责还是后果
  choice: 保留“担当……罪”的开放表达
  alternative: 承受拜偶像的罪责；遭受拜偶像的惩罚
  rationale: 原文חטאים可指罪，而נשא可涵盖承担罪责及后果；直译式表达保留司法与神学张力，不把它缩减为仅仅受罚。
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威；主YHWH
  rationale: “主耶和华”是普通现代中文读者可辨识且庄重的表达，也明确保留称号与专名的区别；“雅威”更接近学术界常见拟音，“YHWH”则最透明，但二者对一般读者较不自然。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“你们”对应原文阴性复数，所指为本章寓言中的两姐妹；中文不另行标示阴性。分号呈现审判的两个并列层面，句号后以“这样”引出认识耶和华的结果。
