  text: וַ/תְּגַל֙ תַּזְנוּתֶ֔י/הָ וַ/תְּגַ֖ל אֶת עֶרְוָתָ֑/הּ וַ/תֵּ֤קַע נַפְשִׁ/י֙ מֵֽ/עָלֶ֔י/הָ כַּ/אֲשֶׁ֛ר נָקְעָ֥ה נַפְשִׁ֖/י מֵ/עַ֥ל אֲחוֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/018.yaml
  text: She uncovered her prostitutions and uncovered her nakedness[a]; then my soul was repulsed by her[c][b], just as my soul had been repulsed by her sister.
translation:
  language: zh_hans
  text: 她显露自己的淫行，也露出自己的赤身[a]；于是我的心厌弃了她[b]，正如我的心从前厌弃她姐姐[c]一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赤身”也可译作“裸露”；原文指性意味浓厚的赤裸暴露。
    reason: lexical_alternative
  - marker: b
    text: “我的心厌弃了她”也可译作“我的心疏远了她”；原文表达强烈的反感、退避和疏离。
    reason: lexical_alternative
  - marker: c
    text: 这里的“姐姐”指本章比喻中的撒马利亚（阿荷拉）。
    reason: cross_reference
lexical_decisions:
- source_word: וַתְּגַל
  choice: 公然显露／露出
  rationale: גלה表示揭开、显露。前半句用“公然显露”使“显露淫行”在现代汉语中自然，并传达毫不遮掩之意；与“下体”搭配时用更具体的“露出”，保留原文重复动词形成的平行结构。
- source_word: תַּזְנוּתֶיהָ
  choice: 自己的淫行
  rationale: זְנוּת为复数概念，指卖淫、淫乱行为；在本章比喻中也承载属灵和政治不忠的含义。“淫行”简洁有力，不把比喻直接解释成抽象的“不忠”。
- source_word: עֶרְוָתָהּ
  choice: 自己的下体
  rationale: עֶרְוָה可指赤裸状态或身体羞处，语境强调性方面的暴露。“下体”在现代汉语中明确而不粗俗，也不额外限定具体器官。
- source_word: וַתֵּקַע / נָקְעָה
  choice: 厌弃了／先前厌弃
  rationale: 此处动词表达强烈的疏离、反感和退避。“厌弃”既保留情感上的厌恶，也包含关系上的拒斥；第二处加“先前”表明对姐姐的厌弃在先。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נֶפֶשׁ在这里指说话者内在的自我、情感或意愿。汉语“我的心”比机械直译“我的灵魂”自然，同时保留原文富有情感的拟人表达，而没有简化成单纯的“我”。
- source_word: מֵעָלֶיהָ
  choice: 厌弃了她
  rationale: 字面有“从她那里离开”之意；按汉语“厌弃”的配价直接接“她”，自然表达因反感而疏离。
- source_word: כַּאֲשֶׁר
  choice: 正如……一样
  rationale: 清楚标示当前反应与先前对她姐姐之反应的对应关系。
- source_word: אֲחוֹתָהּ
  choice: 她姐姐
  rationale: 原词本身为“她的姊妹”；按本章人物关系，她是妹妹阿荷利巴，其姊为阿荷拉，因此译作“姐姐”准确而自然。
theological_decisions:
- issue: 如何翻译以性行为描绘盟约不忠的比喻
  choice: 正文保留“淫行”和“下体”等明确的性语言
  alternative: 弱化为“不忠”“羞耻”等抽象措辞
  rationale: 以西结刻意使用露骨而震撼的性意象来描绘偶像崇拜及政治上的不忠。若弱化措辞，就会削减先知话语的力度，并以解释取代翻译。
- issue: 如何表达上帝强烈而拟人化的反应
  choice: 保留“我的心厌弃了她”
  alternative: 简化为“我离开她”或仅译作“我疏远她”
  rationale: 原文以נַפְשִׁי表达上帝内在而强烈的排斥。“我的心厌弃”保留这种拟人化张力，也同时传达情感反感与关系断裂。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留原文两次“显露／露出”的平行、明确的性意象以及“我的心”这一内在自我表达；用“先前”自然体现比较句中对较早事件的回指。
