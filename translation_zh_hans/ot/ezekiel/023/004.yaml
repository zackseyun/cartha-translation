base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/004.yaml
  text: 'Their names were Oholah the elder and Oholibah her sister[a]. They became mine and bore sons and daughters. As for their names: Samaria is Oholah[b], and Jerusalem is Oholibah.'
translation:
  language: zh_hans
  text: 她们的名字是：姐姐阿荷拉，和她的妹妹阿荷利巴。[a]她们归了我，生了儿子和女儿。至于她们的名字：撒马利亚是阿荷拉，耶路撒冷是阿荷利巴。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阿荷拉”和“阿荷利巴”这两个名字可能分别与希伯来语“她的帐棚”和“我的帐棚在她里面”相呼应，以加强本章的寓意。
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמוֹתָן
  choice: 她们的名字是
  rationale: 按希伯来语引出两人的名字；中文以“她们的名字是”自然衔接上文。
- source_word: אָהֳלָה
  choice: 阿荷拉
  rationale: 作为专名音译；其可能包含的希伯来语双关放入脚注，不在正文中释义。
- source_word: הַגְּדוֹלָה
  choice: 姐姐
  rationale: 在两姐妹的语境中表示年长者，而非体形较大；现代汉语用“姐姐”自然明确。
- source_word: וְאָהֳלִיבָה אֲחוֹתָהּ
  choice: 妹妹叫阿荷利巴
  rationale: 原文称阿荷利巴为阿荷拉的姐妹；与前面的“姐姐”相配，中文用“妹妹”清楚表达姐妹间的长幼关系。
- source_word: וַתִּהְיֶינָה לִי
  choice: 她们归了我
  rationale: 保留“成为属我的”这一关系与状态变化，不在正文中增添原文未明说的“妻子”。
- source_word: וַתֵּלַדְנָה בָּנִים וּבָנוֹת
  choice: 为我生了儿女
  rationale: “生了”保留生育含义；“儿女”准确对应原文明确并列的儿子和女儿。“为我”结合上下文自然表达所生儿女与说话者的关系。
- source_word: וּשְׁמוֹתָן
  choice: 她们的名字所指的是
  rationale: 第二次出现具有复述并揭示寓意对应关系的作用；此译法使中文读者清楚看出名字与城市的对应。
- source_word: שֹׁמְרוֹן אָהֳלָה
  choice: 撒马利亚就是阿荷拉
  rationale: 原文为无系词的同位或等同结构，中文补出“就是”以清楚表达象征身份。
- source_word: וִירוּשָׁלִַם אָהֳלִיבָה
  choice: 耶路撒冷就是阿荷利巴
  rationale: 与前一分句平行，明确耶路撒冷和阿荷利巴的对应关系。
theological_decisions:
- issue: “她们归了我”在先知寓言中的关系含义
  choice: 她们归了我
  alternative: 她们作了我的妻子；她们属于我
  rationale: 本章整体采用婚姻寓言，但本节希伯来语本身只说“她们成为属我的”。正文不把婚姻关系明说得超过原文，同时保留归属和关系建立的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“姐姐……妹妹……”符合汉语姐妹称谓习惯；专名依通行圣经译名处理。正文保留寓言中的关系张力，不直接增译“妻子”。
