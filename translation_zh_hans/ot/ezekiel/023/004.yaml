revisions:
- from: 她们的名字是：姐姐叫阿荷拉，妹妹叫阿荷利巴。[a]她们归了我，为我生了儿女。她们的名字所指的是：撒马利亚就是阿荷拉，耶路撒冷就是阿荷利巴。
  to: 她们的名字是：姐姐阿荷拉，和她的妹妹阿荷利巴。[a]她们归了我，生了儿子和女儿。至于她们的名字：撒马利亚是阿荷拉，耶路撒冷是阿荷利巴。
  rationale: 修订删除“为我”对生育动词的显性增译，以保留原文连贯而未明说的关系；并将第二次名称引介改为较贴近原文且自然的“至于她们的名字”。其余名称、姐妹长幼、归属关系及寓言双关脚注均予保留。
