source:
  edition: WLC
  text: בְּנֵ֧י בָבֶ֣ל וְ/כָל כַּשְׂדִּ֗ים פְּק֤וֹד וְ/שׁ֨וֹעַ֙ וְ/ק֔וֹעַ כָּל בְּנֵ֥י אַשּׁ֖וּר אוֹתָ֑/ם בַּח֨וּרֵי חֶ֜מֶד פַּח֤וֹת וּ/סְגָנִים֙ כֻּלָּ֔/ם שָֽׁלִשִׁים֙ וּ/קְרוּאִ֔ים רֹכְבֵ֥י סוּסִ֖ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/023.yaml
  text: the sons of Babylon and all the Chaldeans[a], Pekod and Shoa and Koa, all the sons of Assyria with them—desirable young men, all of them governors and officials, officers and men of renown[b], all of them riding on horses.
translation:
  language: zh_hans
  text: 巴比伦人和所有迦勒底人，以及比割、书亚和哥亚[a]，还有与他们在一起的所有亚述人——全都是可爱慕的青年男子；他们全都是省长和官员、军官和名望之士[b]，全都骑着马。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “比割、书亚和哥亚”很可能是与巴比伦结盟的族群或地区名称；也有人把这些词理解为描述性的称号，如官员、贵族或战士。
    reason: alternative_reading
  - marker: b
    text: 或译“显赫之士”；更直译为“被召的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בָבֶל
  choice: 巴比伦人
  rationale: 希伯来语直译为“巴比伦之子”，在这里是族群称谓；译作“巴比伦人”更符合现代汉语，同时与后文“亚述人”保持自然对应。
- source_word: כַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留传统族名，不与“巴比伦人”合并，因为原文将其作为相关但可区分的群体列出。
- source_word: פְּקוֹד וְשׁוֹעַ וְקוֹעַ
  choice: 比割、书亚和哥亚人
  rationale: 按民族或地区名称处理，符合整段列举各族群的句法；因这些词也可能被理解为身份或阶层称号，另以脚注说明。
- source_word: כָּל בְּנֵי אַשּׁוּר אוֹתָם
  choice: 还有与他们同来的所有亚述人
  rationale: “亚述之子”按现代汉语族群表达译作“亚述人”；אוֹתָם 在此表示伴随关系，译为“与他们同来”。
- source_word: בַּחוּרֵי חֶמֶד
  choice: 令人倾慕的年轻人
  rationale: 兼顾 בַּחוּרֵי 的“年轻男子”和 חֶמֶד 的可爱、可欲、令人向往之意，保留本章比喻中带有欲望色彩的评价。
- source_word: פַּחוֹת
  choice: 省长
  rationale: 该词是帝国行政体系中的官衔，常指省级长官；“省长”简明且具体。
- source_word: סְגָנִים
  choice: 官员
  rationale: 与“省长”并列而级别不完全确定，采用范围较宽的“官员”，避免强加不确定的具体官阶。
- source_word: שָׁלִשִׁים
  choice: 军官
  rationale: 该词可指高级军事人员，原义和具体职能并不完全确定；“军官”既传达军事身份，又不过度细化。
- source_word: קְרוּאִים
  choice: 名望之士
  rationale: 字面为“被召者”或“受邀者”，在此荣衔列表中可能指因地位显赫而受召的人；正文采用自然的荣誉性表达，脚注保留较直译的可能。
- source_word: רֹכְבֵי סוּסִים
  choice: 骑着马
  rationale: 按分词短语直译其动作状态，既自然又保留描述性的行文。
- source_word: כֻּלָּם ... כֻּלָּם ... כֻּלָּם
  choice: 全都是……全都是……全都
  rationale: 重复“全”以再现原文三次 כֻּלָּם 的累积和强调效果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。族群称谓以现代汉语习惯表达，不机械保留“……之子”的希伯来语习语；同时保留原文三次“全都”的强调，并以破折号呈现后半句对这些人的集中描写。
