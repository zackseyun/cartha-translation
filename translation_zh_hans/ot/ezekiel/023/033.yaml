  text: You will be filled with drunkenness and grief, with a cup of horror and desolation, the cup of your sister Samaria.
translation:
  language: zh_hans
  text: 你必被醉意和悲痛充满；你姐姐撒马利亚的杯，就是那令人惊骇、带来荒凉的杯。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁכָּרוֹן
  choice: 醉意
  rationale: 指饮酒所致的醉态或醉乱；“醉意”在现代汉语中自然，并保留审判之杯带来的失控意象。
- source_word: יָגוֹן
  choice: 悲痛
  rationale: 该词表示深切的忧伤、愁苦；“悲痛”较“悲伤”更能表达强烈程度。
- source_word: שַׁמָּה
  choice: 令人惊骇
  rationale: 此词可指惊骇、恐怖，也可涉及荒废；与后面的 וּשְׁמָמָה 并列时，译为“令人惊骇”以保留两个词的区分。
- source_word: שְׁמָמָה
  choice: 使人荒凉
  rationale: 表示荒凉、毁坏；在“杯”的隐喻中采用致使表达，使汉语通顺，同时保留毁灭后果。
- source_word: כּוֹס אֲחוֹתֵךְ שֹׁמְרוֹן
  choice: 你姐姐撒马利亚的杯
  rationale: 依照希伯来语所属结构直译，保留姐妹隐喻及撒马利亚所受审判成为耶路撒冷之杯的含义。
theological_decisions:
- issue: 审判之杯的隐喻
  choice: 保留“杯”，并用“你必喝”明确汉语中隐含的承受动作
  alternative: 译作“你必被……的杯充满”
  rationale: 希伯来文本前半句用“你必被……充满”，后半句同位说明这杯；汉语若完全照搬会生硬。补出“喝”不改变意象，清楚表达她将亲受与撒马利亚相同的审判。
- issue: “惊骇”与“荒凉”的关系
  choice: 并列为“令人惊骇、使人荒凉”
  alternative: 合译为“恐怖荒凉”或将两词都理解为荒废
  rationale: 原文使用两个相关但不完全相同的名词；分别呈现可保留语义张力，避免将两者压缩为单一概念。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你必……”保留先知宣告的确定语气；分号呈现前后两部分的同位递进关系。未添加原文没有的专名解释或宗派性诠释。
