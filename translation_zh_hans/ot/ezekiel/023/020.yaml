  yaml_path: translation/ot/ezekiel/023/020.yaml
  text: She lusted after their paramours[a], whose flesh was like the flesh of donkeys[c][b], and whose emission was like the emission of horses.
translation:
  language: zh_hans
  text: 她贪恋那些情夫[a]；他们的肉体像驴的肉体[b]，精液像马的精液。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情夫”原文直译为“他们的妾”。这里一般理解为比喻性的性伴侣。
    reason: lexical_alternative
  - marker: b
    text: 这里的“肉体”很可能是委婉说法，指男性生殖器。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגְּבָה עַל
  choice: 她贪恋
  rationale: עגב 与 עַל 连用，在本节语境中表达强烈的性欲；“贪恋”自然、庄重，并保留欲望中放纵的意味。
- source_word: פִּלַגְשֵׁיהֶם
  choice: 他们的情人
  rationale: 该词形通常意为“妾”，但这里处于拟人化的淫乱比喻中，所指显然是她欲求的男性性伴侣；正文采用合乎语境的“情人”，脚注保留字面异常。
- source_word: בְּשַׂר חֲמוֹרִים בְּשָׂרָם
  choice: 这些人的肉体如驴的肉体
  rationale: בָּשָׂר 字面为“肉体”，在此很可能委婉指男性生殖器。正文保留希伯来文的委婉表达，不将隐喻直接解释掉。
- source_word: וְזִרְמַת סוּסִים זִרְמָתָם
  choice: 精液如马的精液
  rationale: זִרְמָה 本义涉及流出之物，在明确的性语境中指精液。现代汉语若译作“流出物”既生硬又含混，因此直接译明。
