  text: clothed in blue[a], governors and officials, all of them desirable young men[c][b], horsemen riding horses.
translation:
  language: zh_hans
  text: 他们都身穿蓝紫色衣服[a]，是总督和官员[b]，全都是俊美的青年男子[c]，全都是骑马的骑兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蓝色”或“紫蓝色”；希伯来语 תְכֵלֶת 可指蓝至蓝紫色的染色织物。
    reason: lexical_alternative
  - marker: b
    text: “官员”也可译作“副长官”或“地方长官”。
    reason: lexical_alternative
  - marker: c
    text: 或译“可爱的青年男子”或“出众的青年男子”；希伯来原文强调这些青年男子正值盛年，并且富有吸引力。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשֵׁי
  choice: 穿着……衣服
  rationale: 该词是动词 לבשׁ 的被动分词，描述这些人的衣着；译法自然地保留其修饰作用。
- source_word: תְכֵלֶת
  choice: 蓝紫色
  rationale: 该词指用特定染料染成的蓝至蓝紫色；“蓝紫色”既符合古代染色语境，也避免把色调限定为现代意义上的纯蓝。
- source_word: פַּחוֹת
  choice: 省长
  rationale: 指帝国体系中的地方长官；“省长”清楚表达行政职分，又不采用可能过度具体的历史术语。
- source_word: וּסְגָנִים
  choice: 官员
  rationale: 指较高等级的副职统治者或行政长官；“官员”保留职衔范围的不确定性。
- source_word: בַּחוּרֵי חֶמֶד
  choice: 俊美的青年
  rationale: בַּחוּרֵי 指正值盛年的青年男子，חֶמֶד 表示令人喜爱、悦目或可羡慕；结合本章情欲性的意象，“俊美”自然表达其吸引力。
- source_word: כֻּלָּם
  choice: 全都是
  rationale: 明确保留“他们全体”的强调，并使其与后面的身份描写自然衔接。
- source_word: פָּרָשִׁים
  choice: 骑士
  rationale: 此处指骑马者或骑兵；“骑士”在句中简洁自然，但不必然带入后世欧洲制度含义。
- source_word: רֹכְבֵי סוּסִים
  choice: 骑马的
  rationale: 保留希伯来文对“骑士”的进一步说明，而不完全省略原文略显重复的表达。
theological_decisions: []
