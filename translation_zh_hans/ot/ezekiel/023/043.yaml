base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/043.yaml
  text: Then I said of her, worn out by adulteries, ‘Now they will commit her prostitution with her, and she herself as well.’
translation:
  language: zh_hans
  text: 于是，我说到她——那个因多次奸淫而衰残的女人——说：“现在，他们还要同她行她的奸淫；她自己也要这样行。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节后半句的希伯来文本含义不很明确；也可理解为：“现在，他们还要与她行淫，连她也一样。”
    reason: 原文עת יזנה תזנותה והיא的语法和主语关系极为简略，古今译本处理不一；脚注提示这种真实歧义，同时正文保留其所有格和“她自己”的张力。
lexical_decisions:
- source_word: לַבָּלָה נִאוּפִים
  choice: 这因屡行淫乱而衰残的女人
  rationale: בָּלָה 表示耗损、衰残；נִאוּפִים 为复数，故以“屡行淫乱”体现反复的淫乱行为，同时保留她因之衰残的形象。
- source_word: תַזְנוּתֶהָ
  choice: 她的淫乱
  rationale: 保留原文的所有格表达，不将其解释性改写为单纯“把她当妓女”或“与她淫乱”。
- source_word: וָהִיא
  choice: 她自己也要行
  rationale: 直译其强调性的“她也／她自己”，并按上下文补出中文所需的谓语“要行”，但不进一步限定具体行为方式。
theological_decisions:
- issue: 末半句晦涩语法所表达的施事关系
  choice: 他们还要同她行她的淫乱，她自己也要行
  alternative: 他们还要把她当作妓女；她本来就是这样
  rationale: 希伯来文本在这里极为简略且语法困难。译文依现有辅音文本及经审核的英译保留“他们”和“她自己”都参与其中的张力，不把它单向解释为她纯粹受人利用，也不把她的责任抹去。
translation_notes:
  register: 采用现代、庄重而可懂的叙述语体。“衰残”比“精疲力尽”更贴近 בלה 的耗损意象；破折号帮助中文读者辨明“她”与同位说明。
