base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/032.yaml
  text: 'Thus says the Lord GOD: You will drink your sister’s cup[a], deep and wide; it will be for laughter and for mockery[b], for it holds much.'
translation:
  language: zh_hans
  text: '主耶和华如此说：


    “你要喝你姐姐的杯[a]，

    那杯又深又宽；

    它必成为人嗤笑和讥讽的对象[b]，

    因为它能容纳很多。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “又深又宽”也可译作“深而广”。
    reason: lexical_alternative
  - marker: b
    text: “杯”是先知书中常见的意象，表示一个人或群体所分得、必须承受的审判。
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 采用现代中文圣经语体中自然且庄重的表达；“主”对应称号 אֲדֹנָי，“耶和华”标示神名 יהוה，避免译成含混的“主神”。
- source_word: כּוֹס אֲחוֹתֵךְ
  choice: 你姐姐……的杯
  rationale: 保留“杯”的先知性意象，并按上下文将 אֲחוֹתֵךְ 译为“你姐姐”；此处指先前提到的姐姐撒马利亚，而非泛称姐妹。
- source_word: תִּשְׁתִּי
  choice: 你要喝
  rationale: 这是阴性单数第二人称未完成式；在宣告审判的语境中表达将要发生且不可避免的事，“要喝”简洁自然。
- source_word: הָעֲמֻקָּה וְהָרְחָבָה
  choice: 又深又宽
  rationale: 两个阴性形容词修饰“杯”，直译其尺寸，突出杯的巨大容量。
- source_word: תִּהְיֶה לִצְחֹק וּלְלַעַג
  choice: 你必受人嗤笑讥讽
  rationale: 将希伯来语“成为笑柄和讥讽对象”的表达译成自然中文。阴性动词既可能以受话者为主语，也可能回指阴性的“杯”；正文依上下文采用“你”，并以脚注保留语法歧义。
- source_word: מִרְבָּה לְהָכִיל
  choice: 这杯容量很大
  rationale: 该短语表示“能容纳很多、容量很大”；明确补出“这杯”，使中文衔接清楚，并与“又深又宽”相呼应。
theological_decisions:
- issue: “杯”的审判意象
  choice: 正文保留字面的“杯”，脚注说明它象征所分定的审判
  alternative: 直接意译为“你姐姐所受的审判”
  rationale: 原文刻意使用具体而有张力的先知性意象；保留“杯”可与其他经文中的审判之杯形成呼应，同时脚注帮助现代读者理解。
- issue: תִּהְיֶה 的主语
  choice: 正文译作“你必受人嗤笑讥讽”
  alternative: 译作“这杯必使人嗤笑讥讽”或“这杯必成为嗤笑讥讽的对象”
  rationale: 动词形式同时可与阴性受话者及阴性名词“杯”呼应，原文存在真实的句法含混。上下文更自然地指向受审判者成为笑柄，但脚注保留另一读法，不将歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。诗行保留宣告式节奏；“嗤笑讥讽”比“成为笑柄和讥诮”更自然，同时维持审判语境的严肃性。
