  text: וַ/יָּב֣וֹא אֵלֶ֔י/הָ כְּ/ב֖וֹא אֶל אִשָּׁ֣ה זוֹנָ֑ה כֵּ֣ן בָּ֗אוּ אֶֽל אָֽהֳלָה֙ וְ/אֶל אָ֣הֳלִיבָ֔ה אִשֹּׁ֖ת הַ/זִּמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/044.yaml
  text: They went in to her as men go in to a prostitute[a]; so they went in to Oholah and to Oholibah[b], women of depravity.
translation:
  language: zh_hans
  text: 他们与她交合，就像人与妓女交合[a]；他们就是这样与阿荷拉和阿荷利巴交合——这两个淫邪的女人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文开头直译为“他到她那里，如同人到妓女那里”，随后动词转为复数“他们到……那里”。这里的“到……那里”在本节语境中指发生性关系。
    reason: 说明原文由单数转为复数，并交代性委婉语。
  - marker: b
    text: “淫邪的女人”也可译作“淫乱的女人”；希伯来文直译为“淫邪之妇”。
    reason: 保留זִמָּה的词义幅度及原文所属结构。
lexical_decisions:
- source_word: וַיָּבֹא / בָּאוּ
  choice: 他们与她交合／他们就是这样……交合
  rationale: בוא אל在本节的性语境中是委婉说法，指发生性关系。译作“交合”清楚传达含义，同时避免粗俗措辞；正文按下半句的复数主体顺译，数的转换则在脚注说明。
- source_word: כְּבוֹא אֶל אִשָּׁה זוֹנָה
  choice: 就像人与妓女交合
  rationale: 比较结构כְּ表达“如同”；不定式本身没有明说主语，因此用泛指的“人”。זוֹנָה译作现代、明确而不过度贬损的“妓女”。
- source_word: כֵּן
  choice: 就是这样
  rationale: 保留前后比较所表达的对应关系，现代汉语中自然清楚。
- source_word: אָהֳלָה ... אָהֳלִיבָה
  choice: 阿荷拉……阿荷利巴
  rationale: 按汉语圣经传统对这两个专名作音译，不在正文中解释其名称含义。
- source_word: אִשֹּׁת הַזִּמָּה
  choice: 淫邪的女人
  rationale: זִמָּה在此兼有淫乱、邪恶和可耻行为的道德分量；“淫邪”保留其性方面的语境与强烈谴责，又比粗俗称谓更符合庄重的现代书面语。
theological_decisions:
- issue: 开头单数动词与后文复数动词的转换
  choice: 正文依上下文及后半句用复数“他们”，脚注保留希伯来文的形式差异
  alternative: 直译为“他到她那里……他们就是这样到阿荷拉和阿荷利巴那里”
  rationale: 马所拉文本开头的וַיָּבֹא是单数，随后בָּאוּ则是复数。上下文所指是成群的情人，故正文用复数较不致造成一个新单数人物的误解；但这种数的转换确实存在，不应静默抹去，因而列入脚注。
- issue: בוא אל的性含义
  choice: 正文明确译为“交合”
  alternative: 较形式对应地译为“到她那里”或“进去见她”
  rationale: 在妓女的明示语境中，该短语是表示性交的委婉表达。直译“到……那里”在现代汉语中容易只被理解为前往某处，无法可靠传达原文含义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“交合”明确但不粗俗，适合本节直指性行为的先知性谴责；破折号自然标示末尾同位说明。
