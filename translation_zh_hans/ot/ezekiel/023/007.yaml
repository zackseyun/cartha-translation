source:
  edition: WLC
  text: וַ/תִּתֵּ֤ן תַּזְנוּתֶ֨י/הָ֙ עֲלֵי/הֶ֔ם מִבְחַ֥ר בְּנֵֽי אַשּׁ֖וּר כֻּלָּ֑/ם וּ/בְ/כֹ֧ל אֲשֶׁר עָֽגְבָ֛ה בְּ/כָל גִּלּוּלֵי/הֶ֖ם נִטְמָֽאָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/007.yaml
  text: She lavished her prostitutions on them[a], all the choicest sons of Assyria; and with all those for whom she lusted[c][b], with all their idols she defiled herself.
translation:
  language: zh_hans
  text: 她把自己的淫行献给所有最优秀的亚述男子[a]；她贪恋所有的人[b]，又因他们的一切偶像[c]玷污了自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所有最优秀的亚述男子”也可译为“所有精选的亚述男子”“亚述人中的精英”或“亚述人中最优秀的人”。
    reason: lexical_alternative
  - marker: b
    text: 原文以“淫行”和“贪恋”等明确的性意象，比喻政治、宗教和盟约上的不忠。
    reason: cultural_note
  - marker: c
    text: 这里译作“偶像”的希伯来词带有强烈的鄙弃意味，也可意译为“污秽的偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן תַּזְנוּתֶיהָ עֲלֵיהֶם
  choice: 她把自己的淫行献给他们
  rationale: 直译为“把她的淫行给在他们身上”。“献给”在现代汉语中自然地表达主动给予，同时保留原文露骨的性隐喻；“淫行”兼顾 זנה 所指的卖淫、性不忠及本段的先知性比喻。
- source_word: מִבְחַר בְּנֵי אַשּׁוּר כֻּלָּם
  choice: 亚述人中所有最优秀的男子
  rationale: מִבְחַר 表示精选、上等或最优秀者；בְּנֵי אַשּׁוּר 字面是“亚述之子”，此处实际指男性亚述人。译作“男子”既保留性别指向，也比汉语“亚述之子”更自然。
- source_word: וּבְכֹל אֲשֶׁר עָגְבָה
  choice: 她贪恋的所有人
  rationale: עגב 表达带强烈情色意味的欲望。“贪恋”保留其过度、情欲性的语气，并与本章的拟人化淫乱意象协调。
- source_word: בְּכָל גִּלּוּלֵיהֶם
  choice: 他们的一切偶像
  rationale: גִּלּוּלִים 是以西结惯用的贬义偶像称呼，可能带有“污秽之物”的强烈轻蔑色彩；正文采用通顺明确的“偶像”，并以脚注说明其贬义力度。
- source_word: נִטְמָאָה
  choice: 使她玷污了自己
  rationale: Nifal 形式表示她成为不洁、受到玷污；结合她主动参与的上下文，汉语用“玷污了自己”自然呈现结果兼反身含义。“使”让前面的人员与偶像都可理解为造成玷污的关联因素。
theological_decisions:
- issue: 以性行为比喻政治、宗教和盟约上的不忠
  choice: 正文保留“淫行”和“贪恋”等明确的性语言
  alternative: 弱化为“不忠”“背信”或“迷恋”
  rationale: 原文刻意采用令人震动的情色语言，描绘撒马利亚与亚述结盟并崇拜其偶像。弱化措辞会消减先知修辞的力度，并过早替读者解释隐喻。
- issue: בְּנֵי אַשּׁוּר 的性别与习语表达
  choice: 译为“亚述人中……男子”
  alternative: 直译“亚述之子”或笼统译为“亚述人”
  rationale: 语境中的对象确为男性；“男子”保留这一指向，而“亚述人中”则用自然现代汉语传达希伯来语归属结构。
- issue: 玷污的施事关系
  choice: 保留“人”和“偶像”都与她的玷污相关的句法可能性
  alternative: 仅将偶像理解为玷污她的工具，或仅译为“她因偶像而成为不洁”
  rationale: 希伯来语连续使用 בְּ，句法可将她所贪恋的人和他们的偶像一并纳入玷污关系。译文不把这一关系收窄为单一解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留以西结书刻意露骨的性隐喻，但避免使用过度古雅或带现代粗俗口吻的词。脚注标记均在正文出现，并依相关内容安置。
