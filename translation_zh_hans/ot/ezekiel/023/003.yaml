base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/003.yaml
  text: They prostituted themselves in Egypt[a]; in their youth they committed prostitution there. There their breasts were fondled[c][b], and there their virgin bosoms were handled.
translation:
  language: zh_hans
  text: 她们在埃及卖淫；年轻时，她们就在那里卖淫。在那里，她们的乳房被揉捏；在那里，她们少女时期的乳房也被抚弄。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文后两分句的性意象十分露骨。也可较直译为：“在那里，她们的乳房被按压；在那里，她们少女时期的乳房被摆弄。”相关动词的准确动作，以及“少女时期的乳房”这一诗性表达，均有一定解释空间；原文没有明说施事者。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶינָה / זָנוּ
  choice: 卖淫
  rationale: זנה在此既有实际性行为的露骨意象，也承载先知所指的背信隐喻。“卖淫”是现代汉语中直接、清楚的表达；两次保留，以呈现希伯来文的重复强调。
- source_word: בְּמִצְרַיִם
  choice: 在埃及
  rationale: 按其地点义直译。
- source_word: בִּנְעוּרֵיהֶן
  choice: 年轻时
  rationale: 自然表达其青年时期，并保留时间含义。
- source_word: שָׁמָּה / שָׁם
  choice: 在那里
  rationale: 原文反复使用地点副词以加强语势；译文相应保留。
- source_word: מֹעֲכוּ שְׁדֵיהֶן
  choice: 她们的乳房被揉捏
  rationale: מעך含按压、挤压之意；“揉捏”保留动作的直接性与性意味，又符合现代汉语表达。
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֵיהֶן
  choice: 她们处女的胸脯……被抚弄
  rationale: 该短语露骨且语义有难度。דדים指乳房或胸脯，בתולים在此强调处女时期；“抚弄”表达性接触，但脚注保留更贴近字面的可能译法。
theological_decisions:
- issue: 先知隐喻中的露骨性语言
  choice: 在正文中保留明确的身体与性意象
  alternative: 淡化为“她们在那里受玷污”或笼统描述情欲关系
  rationale: 原文刻意使用令人不适的露骨意象来控诉早期的不忠；淡化会削弱先知话语的力度。
- issue: 行为的主动与被动张力
  choice: 前两句保留她们主动“卖淫”，后两句依希伯来语动词形态表达身体受到他人触弄
  alternative: 把全节统一改成主动或统一改成受害叙述
  rationale: 原文同时呈现主动的不忠和他人的性触弄，不宜替读者消解这种张力。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留原文“卖淫”的重复和露骨身体意象，不使用古雅的“行淫”“作妓女”，也不以委婉语消解先知控诉的冲击力。
