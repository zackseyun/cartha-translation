id: EZK.23.39
reference: Ezekiel 23:39
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּֽ/בְ/שַׁחֲטָ֤/ם אֶת בְּנֵי/הֶם֙ לְ/גִלּ֣וּלֵי/הֶ֔ם וַ/יָּבֹ֧אוּ אֶל מִקְדָּשִׁ֛/י בַּ/יּ֥וֹם הַ/ה֖וּא לְ/חַלְּל֑/וֹ וְ/הִנֵּה כֹ֥ה עָשׂ֖וּ בְּ/ת֥וֹךְ בֵּיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/039.yaml
  text: For when they slaughtered their sons for their idols, they came into my sanctuary on that same day to defile it. Look—this is what they did within my house.
translation:
  language: zh_hans
  text: 他们宰杀自己的儿子献给偶像，又在同一天进入我的圣所，亵渎它。看哪，他们竟在我的殿中这样行！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְשַׁחֲטָם
  choice: 他们宰杀
  rationale: 保留动词“宰杀”的强烈、具体含义；结合介词结构与后续叙述，以自然汉语表达他们所行之事。
- source_word: לְגִלּוּלֵיהֶם
  choice: 献给偶像
  rationale: לְ 表示对象或目的；“献给”在本段献祭语境中自然明确。“偶像”准确传达 גִּלּוּלִים 在先知谴责语境中的所指。
- source_word: מִקְדָּשִׁי
  choice: 我的圣所
  rationale: 采用“圣所”保留 מִקְדָּשׁ 作为分别为圣之处的宗教含义，并与下文“我的殿”相区别。
- source_word: לְחַלְּלוֹ
  choice: 亵渎它
  rationale: “亵渎”准确表达 חלל 的含义，即使圣所失去其神圣尊严或遭到玷污。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、带有震惊和控诉意味的提示语，语体庄重。
- source_word: בְּתוֹךְ בֵּיתִי
  choice: 在我的殿中
  rationale: בַּיִת 在此指上帝的殿；译作“殿”比泛称“房屋”更符合语境，同时保留“在……中”的空间强调。
theological_decisions:
- issue: 宰杀儿子与偶像崇拜的关系
  choice: 宰杀自己的儿子献给偶像
  alternative: 为自己的偶像宰杀儿子
  rationale: 两种译法都可表达 לְ 的对象或目的关系；“献给偶像”更符合献祭语境，也不额外指定具体仪式或神祇。
- issue: 同一天进入圣所的行为性质
  choice: 又在同一天进入我的圣所，亵渎它
  alternative: 就在那一天进入我的圣所，要亵渎它
  rationale: 不把亵渎弱化为单纯主观意图；原文不定式可表达行为结果或目的，而上下文明确判定他们的进入构成了亵渎。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“又”“竟”呈现他们一面献儿为祭、一面进入圣所的悖谬与控诉力度；“圣所”与“殿”分别对应原文不同词语。
