  text: כִּ֣י נִאֵ֗פוּ וְ/דָם֙ בִּֽ/ידֵי/הֶ֔ן וְ/אֶת גִּלּֽוּלֵי/הֶ֖ן נִאֵ֑פוּ וְ/גַ֤ם אֶת בְּנֵי/הֶן֙ אֲשֶׁ֣ר יָֽלְדוּ לִ֔/י הֶעֱבִ֥ירוּ לָ/הֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/037.yaml
  text: For they have committed adultery[a], and blood is on their hands; they have committed adultery with their idols, and they even made their sons, whom they bore to me[b], pass through the fire to them as food.
translation:
  language: zh_hans
  text: 因为她们犯了奸淫，手上沾着血；她们与自己的偶像行淫，甚至把她们为我所生的儿子使其经火[a]，献给那些偶像作食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使其经火”原文直译为“使……经过”；在这里，这一祭祀用语指把儿子献给偶像。“作食物”描绘他们在祭献中被偶像吞吃。
    reason: 说明“使……经过”的文化习语及紧随其后的祭献、吞吃意象；标记移至所解释的“经火”处。
lexical_decisions:
- source_word: נִאֵפוּ
  choice: 犯了奸淫／与……行淫
  rationale: 保留“奸淫”的本义及其在本节中指向拜偶像、背弃盟约的先知性比喻；两次出现采用相近措辞，以体现原文重复。
- source_word: דָם בִּידֵיהֶן
  choice: 手上沾满了血
  rationale: 这是自然的现代汉语表达，传达原文所指的流血罪责，而不只描述手上实际有血。
- source_word: גִּלּוּלֵיהֶן
  choice: 自己的偶像
  rationale: 清楚表达基本所指；原词带强烈鄙夷色彩，但若直译为“粪偶像”等，会在正文中显得生硬并可能喧宾夺主。
- source_word: בְּנֵיהֶן אֲשֶׁר יָלְדוּ לִי
  choice: 为我所生的儿子
  rationale: 保留 בָּנִים 的具体词义“儿子”，也保留 לִי 可表示归属或关系的简练措辞，不将其神学含义过度解释。
- source_word: הֶעֱבִירוּ
  choice: 经火献给
  rationale: 原文直译为“使……经过”，在这里是献儿女为祭的礼仪用语；补出“火”可让现代读者理解该习语，而“献给”交代其祭献性质。
- source_word: לָהֶם לְאָכְלָה
  choice: 给那些偶像作食物
  rationale: לָהֶם 回指前述偶像，לְאָכְלָה 意为“作食物／供吞吃”；译文保留原文令人震骇的献祭图像。
theological_decisions:
- issue: 是否在正文明确“使儿子经过”是经火献祭
  choice: 经火献给那些偶像作食物
  alternative: 使儿子经过，给它们作食物
  rationale: 本节的流血罪、偶像崇拜和“作食物”共同表明这是献儿女为祭的语境。“经火”虽未在本节明说，却是该固定祭祀用语所含的历史文化意义；脚注同时说明原文字面形式，避免把解释伪装成逐字直译。
- issue: “为我所生”所表达的关系
  choice: 保留“为我所生”
  alternative: 她们所生、归我的儿子
  rationale: 原文简洁而含有上帝对这些儿子的关系或归属主张；正文不进一步界定这种关系，以保留其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“犯奸淫／行淫”保留以婚姻不忠描写拜偶像的强烈比喻；“手上沾满了血”用现代习语表达流血罪责。代词按本章以两名女子为喻的语境译为“她们”。
