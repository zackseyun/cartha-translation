base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/011.yaml
  text: When her sister Oholibah saw this[a], she became more corrupt in her lust than her sister, and in her prostitutions more than the prostitutions of her sister.
translation:
  language: zh_hans
  text: 她的姐妹阿荷利巴看见这事[a]，就在情欲上比她的姐妹更为败坏；她卖淫的行为也比她姐妹的更多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的姐妹阿荷利巴看见了，就比她的姐妹更加放纵情欲；她卖淫的行为也比她姐妹的更多。”原文未明说“看见”的宾语，“这事”是按上下文补出；“败坏”也可理解为主动地使自己败坏或放纵自己。
    reason: 保留原文动词可作主动／反身理解的可能性，并说明补足的隐含宾语。
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 看见这一切
  rationale: 动词本义为“看见”；希伯来文未明说宾语，中文依上文补出“这一切”，使叙事衔接自然，同时不增添新的解释。
- source_word: אֲחוֹתָהּ אָהֳלִיבָה
  choice: 她的姐妹阿荷利巴
  rationale: 保留专名音译及同位关系；“姐妹”表达女性手足，不在本节另行明定长幼。
- source_word: וַתַּשְׁחֵת עַגְבָתָהּ מִמֶּנָּה
  choice: 就在情欲上比她更加败坏
  rationale: 使役形动词在此可表达败坏或行事败坏；结合比较结构，译为“更加败坏”最符合本节道德与性方面的语境。“情欲”保留 עַגְבָה 强烈欲念的含义。
- source_word: וְאֶת תַּזְנוּתֶיהָ
  choice: 卖淫的行为
  rationale: 保留原文直白的性隐喻及其行为层面，不弱化为笼统的“不忠”或直接释为“拜偶像”。
- source_word: מִזְּנוּנֵי אֲחוֹתָהּ
  choice: 比她姐妹的更多
  rationale: מִן 标明比较；中文承接前面的“卖淫的行为”，避免不必要的重复，同时保留与其姐妹相比的意思。
theological_decisions:
- issue: 以性不忠比喻盟约不忠
  choice: 保留“情欲”“卖淫”等明确的性用语
  alternative: 译成较抽象的“贪恋”“不忠”或“拜偶像”
  rationale: 先知刻意使用强烈而具体的性语言描绘撒马利亚和耶路撒冷的背约；保留这一隐喻，既维持修辞力度，也不把经文本身的多层含义过早化约为单一解释。
- issue: וַתַּשְׁחֵת 的语态与表达
  choice: 译作“更加败坏”
  alternative: 译作“使自己败坏”或“放纵自己的情欲”
  rationale: 该形式可带有使自己陷入败坏或表现得败坏的色彩；正文采用自然的比较表达，脚注保留较具主动、反身意味的可能译法。
translation_notes:
  register: 采用现代、庄重而直接的书面普通话。保留先知话语中尖锐的性隐喻；专名译作“阿荷利巴”。为避免无根据地在本节强调长幼关系，使用“姐妹”而非“姐姐”或“妹妹”。
