  text: וְ/יָשַׁבְתְּ֙ עַל מִטָּ֣ה כְבוּדָּ֔ה וְ/שֻׁלְחָ֥ן עָר֖וּךְ לְ/פָנֶ֑י/הָ וּ/קְטָרְתִּ֥/י וְ/שַׁמְנִ֖/י שַׂ֥מְתְּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/041.yaml
  text: You sat on a splendid couch[a], with a table set before it, and on it you placed my incense and my oil.
translation:
  language: zh_hans
  text: 你坐在华美的榻上，榻前摆好了一张桌子；你把我的香和我的油放在桌上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“在……面前”和“在……上面”的代词后缀都是阴性单数，指代略有歧义。前者可指“榻”，也可指这女子（即“在你〔她〕面前”）；正文按连贯的场景，将后者理解为指桌子。
    reason: alternative_reading
lexical_decisions:
- source_word: יָשַׁבְתְּ
  choice: 你坐
  rationale: 这是ישׁב的Qal完成式第二人称阴性单数；直译为“你坐”，符合本段对女性形象的直接指责和过去行动的叙述。
- source_word: מִטָּה כְבוּדָּה
  choice: 华美的榻
  rationale: מִטָּה可指床或供坐卧的榻；本节描绘铺陈华贵的场景，“榻”比“床”更贴合宴饮、倚卧的画面。כְבוּדָּה在此表示尊贵、华美。
- source_word: שֻׁלְחָן עָרוּךְ
  choice: 摆好了一张桌子
  rationale: עָרוּךְ表示已经安排、预备妥当；“摆好了一张桌子”是自然现代汉语，也保留场景已布置完毕的含义。
- source_word: קְטָרְתִּי
  choice: 我的香
  rationale: 名词带第一人称单数后缀，明确表示属于上帝或归给上帝的香；“我的香”简洁保留这一重要归属关系。
- source_word: שַׁמְנִי
  choice: 我的油
  rationale: 原文只说“油”，没有明说是膏油；重复“我的”保留希伯来文第一人称单数后缀及与“我的香”并列的强调。
- source_word: שַׂמְתְּ עָלֶיהָ
  choice: 你把……放在桌上
  rationale: שׂים配合עַל表示把物品放在某物之上；按最近且最自然的场景关系，将阴性后缀理解为桌子，并在汉语中明说“桌上”。
theological_decisions:
- issue: לְפָנֶיהָ和עָלֶיהָ中阴性单数后缀的指代
  choice: 正文分别理解为“榻前”和“桌上”，构成榻前设桌、桌上放香和油的连贯场景。
  alternative: 后缀也可能指那女子，即可理解为桌子摆在“她面前”，并可能使末句的指代产生不同关系。
  rationale: 希伯来文的阴性后缀本身不能完全排除不同先行词。正文采用空间关系最连贯的读法，但以脚注保留真实的语法歧义，不据此额外推导神学含义。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语体。“榻”保留华贵坐卧陈设的画面；“摆好”自然表达已预备妥当的状态。正文中的脚注标记[a]涵盖两个阴性后缀的指代问题。
