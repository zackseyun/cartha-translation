base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/035.yaml
  text: 'Therefore thus says the Lord GOD: Because you have forgotten me and cast me behind your back[a], you also must bear your lewdness and your prostitutions.'
translation:
  language: zh_hans
  text: 因此，主耶和华如此说：因你忘记了我，把我抛在背后[a]，你也要担当你的淫荡和淫行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“把我扔在你背后”。这是表示故意抛弃或置之不理的希伯来语说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神名中的两个成分；“主耶和华”是现代中文圣经语体中清楚而庄重的表达。
- source_word: יַעַן
  choice: 因为
  rationale: 直接引出审判宣告的原因，符合现代汉语。
- source_word: שָׁכַחַתְּ אֹתִי
  choice: 你忘记了我
  rationale: 表达已经发生并构成当前控告根据的行为。
- source_word: וַתַּשְׁלִיכִי אֹתִי אַחֲרֵי גַוֵּךְ
  choice: 把我抛在背后
  rationale: 尽量保留希伯来文刻意抛弃、置之不理的形象性说法，同时中文仍然自然可懂。
- source_word: וְגַם אַתְּ
  choice: 所以你也
  rationale: “也”保留对受话者的强调；“所以”明确呈现此处从罪行到后果的逻辑关系。
- source_word: שְׂאִי
  choice: 要担当
  rationale: 命令式在此构成司法性的后果宣告；“担当”既保留承担之义，也适合审判语境。
- source_word: זִמָּתֵךְ
  choice: 你的淫秽
  rationale: 本章的性行为隐喻与审判语境要求保留其强烈的道德和性含义。
- source_word: תַּזְנוּתָיִךְ
  choice: 你屡次的卖淫
  rationale: 用“屡次”体现希伯来文复数所指的反复行为；“卖淫”保留本章以不贞描写背约的尖锐意象。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在简体中文读者中较为熟悉，并保留专名与称号的区别；不把两个成分合并为一个泛称。
- issue: 卖淫语言的字面与隐喻张力
  choice: 保留“卖淫”
  alternative: 不忠／背约
  rationale: 本章以性方面的不贞承载属灵和盟约不忠的含义；直译保留两层意义，不在正文中只留下解释性的神学结论。
translation_notes:
  register: 采用现代、庄重而直接的审判宣告语体。保留原文第二人称阴性单数所指向的拟人化女性受话者，但汉语不额外标明语法性别。
