revisions:
- from: 因此，主耶和华如此说：因为你忘记了我，把我抛在背后[a]，所以你也要担当你的淫秽和你屡次的卖淫。
  to: 因此，主耶和华如此说：因你忘记了我，把我抛在背后[a]，你也要担当你的淫荡和淫行。
  rationale: 修订去除冗余的“所以”，并以“淫行”替换带有交易性限定且额外明示次数的“屡次的卖淫”。其余主要表达忠实保留原文的称号、控告、弃绝意象及司法性宣告。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:01:15Z'
review_pass:
  verdict: revise
  source_fidelity: “主耶和华”“忘记了我”“把我抛在背后”均准确传达原文；“担当”恰当地体现祈使式在审判宣告中的必然后果。原文以לכן引出神谕、以יען说明理由；中文不宜再在从句中加入“所以”，以免造成不必要的双重因果连接。“屡次的卖淫”把复数形式过度明示为“屡次”，且“卖淫”在现代汉语通常特指交易性行为，范围窄于此处的תזנות。
  naturalness: 修订后语句更紧凑自然，维持现代而庄重的先知审判语体。“淫荡和淫行”避免“淫秽”作为抽象品质与“屡次的卖淫”的生硬搭配。
  terminology: “主耶和华”保留复合神圣称号的两个成分，适合中文圣经语体。“淫荡”和“淫行”保留本章性化的谴责语言及其在上下文中的盟约不忠隐喻，既不淡化也不额外限定为金钱交易。
  issues:
  - severity: medium
    issue: “所以你也要”在“因为”从句之后额外增加因果连接。
    rationale: 原文结构为“因此，主耶和华如此说：因为……，你也要……”。“因此”已引出整个神谕；删去从句后的“所以”可更贴近句法并使中文更顺畅。
  - severity: medium
    issue: “你屡次的卖淫”对תזנות的处理过窄且加入了不必要的次数明示。
    rationale: 该复数名词指淫乱／娼妓式的不贞行为，在本章具有性化且隐喻性的用法；现代汉语“卖淫”通常指以金钱为交换的性交易，“屡次”也不是原文必须明示的语义。用“淫行”保留行为性和复数所蕴含的反复／多样行为，避免缩窄。
  - severity: low
    issue: 脚注替代译文“扔到你的背后”不够自然。
    rationale: “扔在你背后”更符合现代汉语，并仍说明原文的字面形象与故意弃绝之义。
