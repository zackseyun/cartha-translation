  text: אֶל בְּנֵי֩ אַשּׁ֨וּר עָגָ֜בָה פַּח֨וֹת וּ/סְגָנִ֤ים קְרֹבִים֙ לְבֻשֵׁ֣י מִכְל֔וֹל פָּרָשִׁ֖ים רֹכְבֵ֣י סוּסִ֑ים בַּח֥וּרֵי חֶ֖מֶד כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/012.yaml
  text: She lusted after the sons of Assyria—governors and officials[a], clothed in full attire, horsemen riding horses, all of them desirable young men.
translation:
  language: zh_hans
  text: 她贪恋亚述人——省长、官员和近臣[a]；他们都身穿华美服饰，都是骑着马的骑兵，全都是令人爱慕的年轻男子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “近臣”所译的希伯来词通常意为“亲近的人”或“在近旁的人”。本处含义和句法关系不确定，也可能指近旁随侍的人，或泛指贴身供职者；有人按军事语境理解为“战士”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָגָבָה
  choice: 贪恋
  rationale: 该动词在本章的性隐喻中表达强烈的情欲和迷恋；“贪恋”既保留负面的欲望色彩，也符合现代汉语表达。
- source_word: בְּנֵי אַשּׁוּר
  choice: 亚述人
  rationale: 字面为“亚述之子”，但在希伯来语中是表示族群成员的惯用说法；译作“亚述人”在现代汉语中更自然，不损失所指。
- source_word: פַּחוֹת
  choice: 省长
  rationale: 指治理辖区的高级行政长官；“省长”简明地传达其地方统治者身份，而不套用时代不完全相符的专门官衔。
- source_word: וּסְגָנִים
  choice: 官员
  rationale: 这是与地方长官并列的行政或军事职衔；“官员”保留其宽泛性，避免过度确定为副官、总督或统帅。
- source_word: קְרֹבִים
  choice: 近臣
  rationale: 按马所拉读音，基本义是“亲近的人、在近旁的人”；在此可指随侍权贵左右的人。“近臣”能自然融入人物清单，同时以脚注保留词义和句法上的不确定性。
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: 身穿全套华服
  rationale: 该短语描写完整、讲究而华美的服饰；此译同时表达衣着齐整与外观华贵。
- source_word: פָּרָשִׁים רֹכְבֵי סוּסִים
  choice: 是骑马的骑兵
  rationale: 原文先称“骑兵”，再以“骑马的”加以说明，带有强化性的重复；中文保留两项意象，同时使句子可读。
- source_word: בַּחוּרֵי חֶמֶד
  choice: 令人爱慕的年轻男子
  rationale: 该词组既指年轻男子，也带有可爱慕、可欲的评价；“令人爱慕”保留本节情色化的观看角度，而不限缩为单纯“英俊”。
- source_word: כֻּלָּם
  choice: 他们全都是
  rationale: 保留句末对整组人物的总括和强调。
theological_decisions:
- issue: 本节以淫欲比喻耶路撒冷对亚述权势的迷恋
  choice: 直译其强烈、带性意味的“贪恋”和“令人爱慕”
  alternative: 弱化为“喜欢”或“仰慕”
  rationale: 本章刻意使用露骨的婚姻不忠与情欲意象来描述政治依附；弱化措辞会削减先知话语的力度，但译文也不额外加入原文没有的道德解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。破折号引出亚述人的具体身份和外观；分号划分外在装束、骑兵身份与末尾总括。保留本章强烈的情色隐喻，但不使用生僻古语，也不把含混的 קְרֹבִים 武断限定为军事称谓。
