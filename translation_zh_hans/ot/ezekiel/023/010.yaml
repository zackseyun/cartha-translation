base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/010.yaml
  text: They uncovered her nakedness[a]; they took her sons and her daughters, and they killed her with the sword. So she became a byword among women[c][b], and they executed judgments on her.
translation:
  language: zh_hans
  text: 他们使她赤身露体[a]，掳走了她的儿子和女儿，又用刀杀了她。于是，她在众妇女中声名狼藉[b]；他们对她施行了审判[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“揭露了她的赤裸”；这个希伯来语说法也可含有使她当众蒙羞的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译：“她在众妇女中成了一个名”；也可译：“她在众妇女中成了笑柄。”
    reason: lexical_alternative
  - marker: c
    text: 或译：“他们对她执行了判决。”
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלּוּ עֶרְוָתָהּ
  choice: 使她赤身露体
  rationale: 该词组直指揭露赤裸，也含有公开羞辱的意味。“使她赤身露体”保留了先知性比喻的具体、强烈形象，同时符合现代汉语表达。
- source_word: בָּנֶיהָ וּבְנוֹתֶיהָ לָקָחוּ
  choice: 掳走了她的儿子和女儿
  rationale: לקח本义较宽泛，为“拿、带走”；在征服与审判的语境中指被俘带走。“掳走”自然呈现语境含义，并明确保留“儿子和女儿”。
- source_word: וְאוֹתָהּ בַּחֶרֶב הָרָגוּ
  choice: 又用刀杀了她
  rationale: 准确保留הרג的“杀”及בַּחֶרֶב的工具性表达；“用刀杀了”是清楚、庄重而不过分古雅的现代汉语。
- source_word: וַתְּהִי שֵׁם לַנָּשִׁים
  choice: 她在众妇女中声名狼藉
  rationale: 字面为“她在妇女中成了一个名”，此处的“名”表示负面的名声或典型。“声名狼藉”清楚传达其恶名远扬的语用意义；脚注保留较贴近字面的另一种理解。
- source_word: וּשְׁפוּטִים עָשׂוּ בָהּ
  choice: 他们对她施行了审判
  rationale: 保留שְׁפוּטִים的司法、审判语义，不将其仅仅化约为一般性的“惩罚”；“施行审判”也符合本段宣告刑罚的庄重语域。
theological_decisions:
- issue: 以性暴露描写撒马利亚／阿荷拉受审判
  choice: 保留“赤身露体”的具体意象
  alternative: 译为“公开羞辱她”
  rationale: 本章以带有性意味的暴露形象表现羞辱与审判。保留具体意象可维持原文的修辞力度及其盟约不忠、遭受审判的张力，而不将其抽象化。
- issue: 末句的司法性措辞
  choice: 译作“对她施行了审判”
  alternative: 译作“惩罚了她”或“拿她示众”
  rationale: 原文使用“审判／判决”一类的复数名词，重点不只是军事暴力，而是把她的遭遇呈现为审判；因此保留司法性语言。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。保留本节强烈的暴露意象和司法性措辞；叙事动作简洁有力。“儿子和女儿”明确对应原文两个亲属名词，“声名狼藉”则自然表达希伯来语中负面名声的习语。
