id: EZK.23.27
reference: Ezekiel 23:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֤י זִמָּתֵ/ךְ֙ מִמֵּ֔/ךְ וְ/אֶת זְנוּתֵ֖/ךְ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִשְׂאִ֤י עֵינַ֨יִ/ךְ֙ אֲלֵי/הֶ֔ם וּ/מִצְרַ֖יִם לֹ֥א תִזְכְּרִי עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/027.yaml
  text: So I will put an end to your lewdness from you[a], and your prostitution from the land of Egypt; and you will not lift up your eyes to them[b], and you will remember Egypt no more.
translation:
  language: zh_hans
  text: 这样，我必使你的淫行从你身上止息，也使你从埃及地开始的卖淫行为止息[b]。你必不再举目望他们[a]，也不再记念埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举目望他们”这一习语可含有渴想、关注或倚赖他们的意思。
    reason: 保留原文习语的多义性，避免正文过度限定。
  - marker: b
    text: “从埃及地开始的卖淫行为”也可按字面译作“从埃及地而来的卖淫行为”；此处可指这种行为在埃及地期间开始。
    reason: 原文使用“从埃及地”，表达来源或起始点；脚注保留其与埃及经历的关联，而不将其限定为单纯地点。
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: 我必使……止息
  rationale: 这是 שׁבת 的使役形，表示耶和华使这些行为停止；此译法保留使役语气，也符合庄重的现代汉语。
- source_word: זִמָּתֵךְ
  choice: 你身上的淫行
  rationale: זִמָּה 在本章的性隐喻和审判语境中指无耻、淫荡的行为，而非泛指邪恶；“淫行”直接而不过分古奥。
- source_word: מִמֵּךְ
  choice: 你身上的
  rationale: 原文表示从受话者那里除去或止住；汉语用“你身上的……止息”自然表达行为不再存在于她身上。
- source_word: וְאֶת זְנוּתֵךְ
  choice: 也使……卖淫行为止息
  rationale: זְנוּת 指卖淫或淫乱行为；“卖淫行为”保留先知话语中刻意鲜明的性隐喻，并与前一宾语并列受“使……止息”支配。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 源自埃及地的
  rationale: 保留原文“埃及地”以及介词所表达的来源关系，同时以脚注说明这一压缩短语也可理解为发生在埃及地的卖淫行为。
- source_word: לֹא תִשְׂאִי עֵינַיִךְ אֲלֵיהֶם
  choice: 你必不再举目望他们
  rationale: 保留“举目望”的希伯来语意象，不把其中可能包含的欲望、关注或倚赖单一化。
- source_word: אֲלֵיהֶם
  choice: 他们
  rationale: 阳性复数代词最自然地回指埃及人或以情人形象出现的对象。
- source_word: וּמִצְרַיִם לֹא תִזְכְּרִי עוֹד
  choice: 也不再想念埃及
  rationale: זכר 基本义是记得、想起；在本段语境中带有眷恋意味。“想念”自然传达这种语境色彩，而“不再”保留 עוֹד 的终止含义。
theological_decisions:
- issue: 先知话语中性语言的性质
  choice: 直接保留“淫行”和“卖淫行为”的性隐喻，以表现耶路撒冷在宗教和政治关系上的不忠。
  alternative: 弱化为“邪恶”“不忠”或“败坏行为”。
  rationale: 原文有意采用鲜明的性语言来控诉偶像崇拜及政治—宗教上的背约；泛化会削弱审判宣告的修辞力度。
- issue: “举目望他们”的含义
  choice: 在正文中保留原文习语，并在脚注中列出欲望、关注或倚赖等可能含义。
  alternative: 直接译为“仰赖他们”或“渴想他们”。
  rationale: 上下文容许欲望和倚赖等多重色彩，原文并未限定为其中一种，因此不在正文中消除这种张力。
- issue: “源自埃及地”的时间或地点关系
  choice: 正文按来源理解为“源自埃及地”，脚注保留“在埃及地”的地点性理解。
  alternative: 正文直接译为“你在埃及地的卖淫行为”。
  rationale: 介词 מִן 通常表达来源，而本章前文也说这种行为始于埃及；但压缩句法仍容许地点性表达，故以脚注保留。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留原文直率的性隐喻和“举目望”的具体意象；用“使……止息”的平行结构呈现同一使役动词统摄两个宾语。
