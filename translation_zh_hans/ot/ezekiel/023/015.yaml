  register: 采用庄重而通顺的现代标准汉语。保留腰带、下垂头巾等视觉细节，并以“个个……都”再现原文的总体强调。脚注标记置于实际涉及歧义的“军官”和“巴比伦之子”之后；末句在不消除“巴比伦/迦勒底”并置关系的前提下，按汉语习惯表达其故乡出处。
