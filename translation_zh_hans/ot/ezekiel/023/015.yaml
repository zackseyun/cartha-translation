revisions:
- from: 腰间束着腰带，头上戴着垂下的头巾；他们个个看起来都像军官[a]，都是巴比伦之子[b]的模样，是来自故乡迦勒底地的人。
  to: 腰间束着带子，头上戴着垂下的头巾；他们个个都有军官[a]的样子，形貌如同巴比伦之子[b]，就是迦勒底人；迦勒底是他们的出生之地。
  rationale: 将末句重组为现代汉语可理解的同位说明：所描绘的是巴比伦之子，即迦勒底人的形貌，并明说迦勒底为其出生之地。这样保留“巴比伦”与“迦勒底人”两个原文名称及其复杂并置关系，避免把族名未经说明改成地名。前半仅将“腰带”简化为“带子”，以避免“腰间束着腰带”的重复感，意义不变。
