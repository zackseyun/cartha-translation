base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/015.yaml
  text: with belts fastened at their waists[a], with flowing turbans on their heads, all of them having the appearance of officers, the likeness of the sons of Babylon, Chaldeans[b], the land of their birth.
translation:
  language: zh_hans
  text: 腰间束着带子，头上戴着垂下的头巾；他们个个都有军官[a]的样子，形貌如同巴比伦之子[b]，就是迦勒底人；迦勒底是他们的出生之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“将领”。希伯来语 שָׁלִשִׁים 可指精锐军人或高级军职人员；正文采用含义较宽的“军官”。
    reason: lexical_alternative
  - marker: b
    text: “巴比伦之子”是希伯来语的亲属式表达，意思是“巴比伦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגוֹרֵי אֵזוֹר
  choice: 束着腰带
  rationale: 保留“以带束身”的具体服饰形象，同时采用现代汉语的自然表达。
- source_word: בְּמָתְנֵיהֶם
  choice: 腰间
  rationale: מָתְנַיִם 指腰部或腰胯；“腰间”准确、简洁，也避免古奥的“腰胯”。
- source_word: סְרוּחֵי טְבוּלִים
  choice: 戴着垂下的头巾
  rationale: סְרוּחֵי 表示下垂、拖曳，טְבוּלִים 在此指头部饰物；译文保留其形态，同时不把具体样式过度确定为现代意义上的某一种头巾。
- source_word: בְּרָאשֵׁיהֶם
  choice: 头上
  rationale: 按原文保留明确的身体位置，表达自然。
- source_word: מַרְאֵה שָׁלִשִׁים
  choice: 看起来都像军官
  rationale: שָׁלִשִׁים 可指精锐军人或高级军职人员；“军官”传达身份和等级，又不武断限定具体古代军衔。
- source_word: כֻּלָּם
  choice: 个个……都
  rationale: 用汉语分举式表达保留原文“全都”的强调。
- source_word: דְּמוּת בְּנֵי בָבֶל
  choice: 都是巴比伦之子的模样
  rationale: “模样”体现 דְּמוּת 的形象、相似之意；“巴比伦之子”保留原文亲属式族群称谓，并以脚注说明。
- source_word: כַּשְׂדִּים
  choice: 迦勒底地
  rationale: 保留“迦勒底”这一与“巴比伦”并列而相关的专名；结合后面的“故乡/出生地”短语，在汉语中按地域理解，以形成通顺的出处说明。
- source_word: אֶרֶץ מוֹלַדְתָּם
  choice: 来自故乡……地的人
  rationale: 该短语直指他们出生、本源之地；“故乡”自然传达出生地和原乡含义，并与“来自”构成现代汉语习惯表达。
