source:
  edition: WLC
  text: וְ/נָתַתִּ֨י קִנְאָתִ֜/י בָּ֗/ךְ וְ/עָשׂ֤וּ אוֹתָ/ךְ֙ בְּ/חֵמָ֔ה אַפֵּ֤/ךְ וְ/אָזְנַ֨יִ/ךְ֙ יָסִ֔ירוּ וְ/אַחֲרִיתֵ֖/ךְ בַּ/חֶ֣רֶב תִּפּ֑וֹל הֵ֗מָּה בָּנַ֤יִ/ךְ וּ/בְנוֹתַ֨יִ/ךְ֙ יִקָּ֔חוּ וְ/אַחֲרִיתֵ֖/ךְ תֵּאָכֵ֥ל בָּ/אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/025.yaml
  text: I will set my jealousy against you[a], and they will deal with you in wrath. They will remove your nose and your ears, and your survivors will fall by the sword. They will take your sons and your daughters[b], and your remnant will be consumed by fire.
translation:
  language: zh_hans
  text: 我要把我的忌恨加在你身上，他们就必以烈怒对付你。他们必除掉你的鼻子和耳朵[a]；你余下的人[b]必倒在刀下。他们必掳去你的儿女，你剩下的必被火吞灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “除掉”也可按这里的残害语境译作“割掉”。希伯来语动词本义较宽，意为“移走、除去”。
    reason: lexical_alternative
  - marker: b
    text: “余下的人”所对应的希伯来语也可译作“你的结局”或“你剩下的”。本节后半再次使用同一个词，正文译作“你剩下的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי קִנְאָתִי בָּךְ
  choice: 我要把我的忌恨加在你身上
  rationale: נתן在此可表达“放置、加上”；קִנְאָה在婚姻不忠与审判的语境中带有强烈的关系性与排他性。“忌恨”保留这种张力，也不把它弱化为一般的“热心”。
- source_word: וְעָשׂוּ אוֹתָךְ בְּחֵמָה
  choice: 他们就必以烈怒对付你
  rationale: עשה带宾语并与בְּחֵמָה连用，表示在震怒中处置某人；“以烈怒对付”自然表达敌对行动及其强烈情绪。
- source_word: אַפֵּךְ וְאָזְנַיִךְ יָסִירוּ
  choice: 他们必除掉你的鼻子和耳朵
  rationale: Hifil形式יָסִירוּ的基本意思是“使离开、除掉”。正文不直接指定手段；语境所暗示的肢体残害在脚注中说明。
- source_word: וְאַחֲרִיתֵךְ
  choice: 你余下的人／你剩下的
  rationale: אַחֲרִית可指“结局、后来”或“剩余部分”。本节两次出现，并分别遭刀剑和火焚；依上下文译作灾祸之后所剩的人或事物，同时用脚注保留其较宽的词义。
- source_word: בַּחֶרֶב תִּפּוֹל
  choice: 必倒在刀下
  rationale: 这是希伯来语中描述死于刀剑的常见表达；中文“倒在刀下”保留其意象与结果。
- source_word: בָּנַיִךְ וּבְנוֹתַיִךְ יִקָּחוּ
  choice: 他们必掳去你的儿女
  rationale: לקח基本义为“取走”。征服语境表明儿女会被敌人带走，“掳去”比单纯“带走”更清楚，又未过度规定其后遭遇。
- source_word: תֵּאָכֵל בָּאֵשׁ
  choice: 必被火吞灭
  rationale: אכל的Nifal形式是被动，字面为“被吃掉”；“被火吞灭”保留拟人化的吞噬意象，并准确表达彻底毁灭。
theological_decisions:
- issue: קִנְאָה所表达的盟约性惩罚情感
  choice: 我的忌恨
  alternative: 我的热忱
  rationale: 全章以婚姻不忠描写背约，审判中的קִנְאָה具有因关系遭背叛而发的排他性愤怒。“忌恨”保留这种神学张力；“热忱”则容易淡化关系与审判色彩。
- issue: וְאַחֲרִיתֵךְ所指的对象
  choice: 你余下的人／你剩下的
  alternative: 你的结局／你的后代
  rationale: 紧邻的刀剑、掳掠和火焚支持“灾后余剩者或余剩部分”的理解，但原词也可表示“结局、后来”；因此正文按语境表达，脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而直接的审判用语。“烈怒”“倒在刀下”“被火吞灭”保留先知文学的强烈意象；“儿女”自然涵盖原文“儿子和女儿”。所有女性单数第二人称在现代汉语中统一表达为“你”，由全章语境辨明所指。
