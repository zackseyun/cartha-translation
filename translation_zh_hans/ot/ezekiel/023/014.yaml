base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/014.yaml
  text: Then she added to her acts of prostitution[a], and she saw men portrayed on the wall, images of Chaldeans portrayed in vermilion[b],
translation:
  language: zh_hans
  text: 她又增加了卖淫的行为；她看见墙上所刻画的男子，就是用朱红颜料绘成的迦勒底人像[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”指与巴比伦密切相关的族群；也可译为“巴比伦人”。“朱红颜料”指鲜红色颜料，具体也可能是朱砂。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶל תַּזְנוּתֶיהָ
  choice: 她又增添了她卖淫的行为
  rationale: 保留“增添”这一希伯来语表达及复数行为的意味，也不淡化以性交易比喻背约不忠的强烈措辞。
- source_word: וַתֵּרֶא אַנְשֵׁי מְחֻקֶּה עַל הַקִּיר
  choice: 看见墙上刻画的男人
  rationale: “刻画”兼顾该词可指刻出或描绘的含义，不武断限定制作方式；“墙上”自然传达介词短语。
- source_word: צַלְמֵי כשדיים
  choice: 迦勒底人像
  rationale: 保留族群名称“迦勒底人”，并以“人像”清楚表明所见是图像而非真人。
- source_word: חֲקֻקִים בַּשָּׁשַׁר
  choice: 用朱红颜料绘成
  rationale: “朱红颜料”表达鲜红色料而不强行鉴定为某一种矿物；“绘成”适合墙上彩色人像的语境，同时保留制作图像之意。
theological_decisions:
- issue: 以卖淫比喻圣约与政治上的不忠
  choice: 保留“卖淫的行为”
  alternative: 不忠的行为
  rationale: 原文刻意采用强烈而令人不适的性意象；直译可保存先知话语的冲击力和神学张力，避免将隐喻抽象化。
- issue: 迦勒底人与巴比伦人的称谓
  choice: 正文作“迦勒底人”
  alternative: 巴比伦人
  rationale: “迦勒底人”直接对应原文族群名称；在此语境中与巴比伦相关，但不在正文中将两者完全等同。
translation_notes:
  register: 采用现代、庄重而直白的普通话。“卖淫”保留原文的尖锐隐喻；“刻画”与“绘成”避免中文中不自然的重复，也不把两处相关词都过度限定为雕刻。
