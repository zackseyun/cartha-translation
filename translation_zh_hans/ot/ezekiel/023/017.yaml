  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ אֵלֶ֤י/הָ בְנֵֽי בָבֶל֙ לְ/מִשְׁכַּ֣ב דֹּדִ֔ים וַ/יְטַמְּא֥וּ אוֹתָ֖/הּ בְּ/תַזְנוּתָ֑/ם וַ/תִּ֨טְמָא בָ֔/ם וַ/תֵּ֥קַע נַפְשָׁ֖/הּ מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/017.yaml
  text: Then the sons of Babylon came to her[a], to the bed of love, and they defiled her with their prostitution; and she was defiled by them[c][b], and her soul was alienated from them.
translation:
  language: zh_hans
  text: 巴比伦人[a]来到她那里，上了欢爱之床[b]。他们以自己的淫行玷污她；她因他们而被玷污，她的心便与他们疏远了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“巴比伦之子”，也可译作“巴比伦的男人”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“同床欢爱”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“她便厌弃他们”或“她的心便厌恶他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בָבֶל
  choice: 巴比伦人
  rationale: 希伯来语字面为“巴比伦之子”，在此指来自巴比伦的人；现代汉语用“巴比伦人”自然清楚，脚注保留原文表达。
- source_word: לְמִשְׁכַּב דֹּדִים
  choice: 上了欢爱之床
  rationale: מִשְׁכָּב 指床榻或躺卧之处，דֹּדִים 在此有性爱意味；“欢爱之床”保留床的意象和含蓄而明确的性意味。
- source_word: וַיְטַמְּאוּ אוֹתָהּ
  choice: 他们……玷污她
  rationale: טמא 在这里兼有道德与礼仪上的污秽意味；“玷污”能自然承载这两层语义。
- source_word: בְּתַזְנוּתָם
  choice: 以自己的淫行
  rationale: זְנוּת 指卖淫、淫乱，也在本章寓意政治和宗教上的不忠；“淫行”保留先知刻意采用的性隐喻，同时符合现代庄重语体。
- source_word: וַתִּטְמָא בָם
  choice: 她因他们而被玷污
  rationale: 保留结果性和被动意味；介词 ב 在这里可表达原因、媒介或施事，“因他们”在汉语中自然且不过度限定。
- source_word: וַתֵּקַע נַפְשָׁהּ מֵהֶם
  choice: 她的心便与他们疏远了
  rationale: 保留 נֶפֶשׁ 所表达的内在自我，以及该习语中由亲近转为疏离、厌弃的意味；正文采用“疏远”以避免把情绪强度解释得过死，脚注列出更强的可能译法。
theological_decisions:
- issue: 先知寓言中的性与污秽意象
  choice: 保留“欢爱之床”“淫行”“玷污”等明确意象
  alternative: 淡化为纯粹的政治结盟或外交背叛
  rationale: 原文有意借性关系描绘阿荷利巴（耶路撒冷）的政治和属灵不忠；若改写为纯政治语言，会削弱先知修辞及其道德—礼仪张力。
- issue: 末句所表达的是疏离还是厌恶
  choice: 正文译为“她的心便与他们疏远了”
  alternative: “她厌恶他们”或“她对他们感到恶心”
  rationale: 该希伯来语习语可涵盖疏离、厌弃和反感。正文保留关系转变的含混性，不把它限定为单一情绪；更强烈的译法收入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上了……之床”保留希伯来语的床榻意象；分号呈现玷污行为及其结果之间的紧密联系。脚注标记依正文出现顺序排列。
