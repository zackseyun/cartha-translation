source:
  edition: WLC
  text: עָשֹׂ֥ה אֵ֖לֶּה לָ֑/ךְ בִּ/זְנוֹתֵ/ךְ֙ אַחֲרֵ֣י גוֹיִ֔ם עַ֥ל אֲשֶׁר נִטְמֵ֖את בְּ/גִלּוּלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/030.yaml
  text: These things are done to you because of your prostitution after the nations[a], because you defiled yourself with their idols.
translation:
  language: zh_hans
  text: 这些事临到你，是因你追随列国行淫，又因你以他们的偶像[a]玷污了自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来词带有强烈的蔑视意味；有时被意译为“污秽的偶像”或“粪偶像”。
    reason: 保留 גִּלּוּלִים 的贬斥语气，并将“粪”相关说法恰当地限定为意译。
lexical_decisions:
- source_word: עָשֹׂה אֵלֶּה לָךְ
  choice: 这些事临到你
  rationale: 这个简略的希伯来语结构回指上文所述的惩罚。译作“临到你”自然地表达这些事施加于她，却不补出原文没有明说的施事者。
- source_word: בִּזְנוֹתֵךְ
  choice: 因你……行淫
  rationale: בְּ 在此按原因理解。זנה 的性隐喻是本段刻意采用的表达，指向偶像崇拜和与列国纠缠所构成的不忠，因此正文保留“行淫”，不将其淡化为“不忠”。
- source_word: אַחֲרֵי גוֹיִם
  choice: 追随列国
  rationale: אַחֲרֵי 带有跟随、追逐之意；“追随列国”既保留这一动态，又符合现代汉语。“列国”也比“外邦人”更贴合本段兼具政治与宗教意味的语境。
- source_word: נִטְמֵאת
  choice: 被……玷污了
  rationale: טמא 的尼法勒式在此可有被动或状态变化的意味。“被……玷污了”保留语法上的被动色彩和礼仪不洁的概念；上下文仍清楚表明她主动追随列国，因而无需在此强行改成反身表达。
- source_word: בְּגִלּוּלֵיהֶם
  choice: 被他们的偶像玷污
  rationale: 介词 בְּ 可表达媒介或关联。“偶像”是清楚自然的正文译法；גִּלּוּלִים 所含的蔑视意味另在脚注说明，以免正文出现生硬的直译。
theological_decisions:
- issue: 是否保留以性行为描写盟约不忠的隐喻
  choice: 追随列国行淫
  alternative: 追随列国而不忠／敬拜列国的偶像
  rationale: 以西结有意用强烈的性隐喻揭露宗教和政治上的背叛。正文应翻译这一隐喻，而不是直接改写成对隐喻的解释。
- issue: נִטְמֵאת 的被动与反身含义
  choice: 被他们的偶像玷污了
  alternative: 你以他们的偶像玷污了自己／你因他们的偶像成了不洁净的
  rationale: 尼法勒式容许被动或状态变化的理解。采用被动表达可保留原文形式上的张力，同时前句“你追随”已呈现她的主动责任。
- issue: גִּלּוּלִים 的贬斥意味
  choice: 偶像，并以脚注说明其蔑称色彩
  alternative: 粪像／污秽的偶像
  rationale: 直译其贬义可能造成生硬或过度具体化。“偶像”适合正文，脚注则保留原词鲜明的鄙夷语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行淫”保留先知话语的冲击力；“这些事临到你”避免为省略式原文补入未经明说的施事者。脚注标记紧随其实际解释的“偶像”。
