base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/008.yaml
  text: And I saw that the house had a raised platform all around[a]; the foundations of the side chambers were a full reed of six cubits to the offset.
translation:
  language: zh_hans
  text: 我看见殿宇四周都有高起的台基；旁屋的根基高一整量竿，即六肘，直到外伸处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直到连接处”、“直到凸缘”，也可能是“在底部”。这里的希伯来语建筑术语含义不明确。
    reason: 保留אַצִּילָה这一罕见建筑术语的词义不确定性，避免正文对圣殿结构作过度具体的重构。
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: 我看见
  rationale: ראה的Qal完成式第一人称单数，按先知第一人称的观察直译；中文叙事中不必机械增添“于是”。
- source_word: לַבַּיִת
  choice: 殿宇
  rationale: בַּיִת在本段指圣殿主体建筑。“殿宇”既保留“房屋”的建筑含义，也比单说“房子”更符合庄重的圣殿语境。
- source_word: גֹּבַהּ סָבִיב סָבִיב
  choice: 四周都有高起的台基
  rationale: גֹּבַהּ字面为“高度、隆起”，重复的סָבִיב表示环绕四周。结合随后旁屋根基的尺寸，此处以“高起的台基”表达建筑上的抬高部分，同时避免仅译抽象的“高度”而造成中文费解。
- source_word: מיסדות הַצְּלָעוֹת
  choice: 旁屋的根基
  rationale: מיסדות指根基或基础结构；צְלָעוֹת在本段圣殿建筑语境中指附于主体建筑的侧屋。“旁屋”自然、简洁，并与主体殿宇相区分。
- source_word: מְלֹא הַקָּנֶה
  choice: 高足一整竿
  rationale: מְלֹא表示完整的量度，קָּנֶה为量竿。上下文在说明台基与根基的垂直尺度，故补出“高”使现代中文清楚；“一整竿”保留完整量竿之意。
- source_word: שֵׁשׁ אַמּוֹת
  choice: 就是六肘
  rationale: 这是对“一整竿”长度的同位说明；“就是”清楚显示一竿等于此处所说的六肘。
- source_word: אַצִּילָה
  choice: 直到外伸处
  rationale: 这是含义不确定的建筑术语，可能指连接处、凸缘、台阶式退进处或底部。“外伸处”在建筑语境中可读，又不把具体结构解释得过细；其他可能译法列入脚注。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑叙述。“殿宇”“旁屋”“根基”“量竿”保持本段术语的一致性；分号呈现观察结论与尺寸说明之间的紧密关系。
