base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/007.yaml
  text: And the side chambers became wider as they went around upward and upward[a], because the structure of the temple went around upward and upward all around the temple. Therefore the width of the temple increased upward[c][b], and so one went up from the lowest story to the highest by way of the middle story.
translation:
  language: zh_hans
  text: 侧室向上环绕延伸，越往上越宽[a]，因为殿的环绕构造[b]逐层向上，环绕着殿的四周。因此，殿越往上越宽；人从下层上到上层，要经过中层[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侧室”也可译作“旁屋”或“侧边房间”。希伯来语这个词可指附在主体建筑旁边的房间或侧部结构。
    reason: lexical_alternative
  - marker: b
    text: 本句所说的“环绕构造”在建筑意义上不易确定；也有人理解为环绕的凸台、走廊，或墙体逐层内收形成的退台。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语末句的语序十分紧缩，涉及下层、中层和上层；通常理解为由下层经中层上到上层。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲבָה
  choice: 越……越宽
  rationale: 该词为阴性单数，承接“两旁的房间”，表示随楼层上升而加宽的结果；用“越……越宽”自然表达渐进关系。
- source_word: וְנָסְבָה
  choice: 环绕
  rationale: 保留 סבב 所表达的环绕、周行之意，不将其弱化为单纯“上升”。
- source_word: לְמַעְלָה לְמַעְלָה
  choice: 越往上／逐层向上
  rationale: 希伯来文重复副词，强调不断向上的进程；中文以渐进式表达再现其力度，同时避免生硬重复。
- source_word: לַצְּלָעוֹת
  choice: 两旁的房间
  rationale: צלעות 在圣殿建筑语境中指附着于主体建筑的侧室；“两旁的房间”通俗清楚，并以脚注保留“侧室”的术语性译法。
- source_word: כִּי מוּסַב הַבַּיִת
  choice: 因为殿的环绕结构
  rationale: מוּסַב 是含义不确定的建筑术语。此译法保留环绕建筑的基本概念，却不武断指定为凸台、走廊或墙体退台。
- source_word: סָבִיב סָבִיב לַבַּיִת
  choice: 围绕着整座殿
  rationale: 以“整座”表达 סביב 的重复所加强的全面环绕之意，符合现代汉语习惯。
- source_word: עַל כֵּן רֹחַב לַבַּיִת לְמָעְלָה
  choice: 因此，殿越往上越宽
  rationale: 原句省略而紧缩；补出渐增关系，使中文明白，同时不超出上下文所述上层较宽的意思。
- source_word: וְכֵן הַתַּחְתּוֹנָה יַעֲלֶה עַל הָעֶלְיוֹנָה לַתִּיכוֹנָה
  choice: 人从底层上到顶层，要经过中层
  rationale: 原文句法紧缩，表达由下层经中层到上层的通行路线。“人”是不定主体，不另行指定身份。
- source_word: הַבַּיִת
  choice: 殿
  rationale: 在以西结的圣殿异象中指圣殿主体；“殿”比字面“房屋”更准确，也简洁庄重。
