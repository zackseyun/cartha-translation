  yaml_path: translation/ot/ezekiel/041/001.yaml
  text: 'Then he brought me into the nave and measured the jambs: six cubits wide on one side and six cubits wide on the other side—the width of the tent[a][b].'
translation:
  language: zh_hans
  text: 随后，他领我进入正殿[a]，量了门框：这边宽六肘，那边宽六肘——这是帐篷[b]的宽度。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正殿”也可译作“主殿”或“圣所”；希伯来语在这里指圣殿建筑的主要厅堂，不是整个圣殿建筑群。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语为“帐篷”。在这段圣殿异象中，有人认为这是建筑方面的专门用语，也可译作“会幕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכָל
  choice: 正殿
  rationale: 此处指圣殿建筑的主要厅堂，与内殿有别；“正殿”既自然易懂，又避免让“圣殿”被误解为整个建筑群。
- source_word: אֵילִים
  choice: 门框
  rationale: 在入口测量的建筑语境中，指门口两侧的结构部分；“门框”比“柱子”更能避免使人联想到独立柱。
- source_word: אַמּוֹת
  choice: 肘
  rationale: 保留古代长度单位，不擅自换算为现代单位。
- source_word: רֹחַב
  choice: 宽／宽度
  rationale: 按汉语习惯，在尺寸描述中译作“宽”，在末尾名词结构中译作“宽度”。
- source_word: מִפּוֹ ... מִפּוֹ
  choice: 这边……那边
  rationale: 原文成对的方位表达指入口相对的两侧；此译简洁自然，并保留指示意味。
- source_word: אֹהֶל
  choice: 帐幕
  rationale: 原词通常意为“帐棚、帐幕”；在圣殿异象语境中可能是建筑术语。“帐幕”保留其宗教与建筑联想而不把含义解释死。
- source_word: וַיְבִיאֵנִי
  choice: 随后，他领我进入
  rationale: 体现叙事的推进和先后次序；“领我进入”符合异象中引导者带领先知前行的语境。
- source_word: וַיָּמָד
  choice: 量了
  rationale: 直接表达测量动作，符合现代汉语叙事。
