lexical_decisions:
- source_word: וּ/שְׁתַּיִם
  choice: 两
  rationale: 阴性基数词修饰阴性复数名词“门”；现代汉语自然译为“两扇”以配合门的量词。
- source_word: דְּלָתוֹת
  choice: 扇门
  rationale: 复数名词基本义为“门”；原文没有明确要求译作“双扇门”或“门扇”，因此采用不作额外推断的表达。
- source_word: הֵיכָל
  choice: 正殿
  rationale: 在以西结圣殿异象的建筑语境中，指与内层圣所有别的主要殿堂；“正殿”简洁、庄重，也容易为现代读者理解。
- source_word: קֹּדֶשׁ
  choice: 圣所
  rationale: 此处指与正殿并列的神圣内室；“圣所”保留其神圣含义，又不擅自采用更细化的礼仪术语。
- source_word: לַ/הֵיכָל וְ/לַ/קֹּדֶשׁ
  choice: 正殿和圣所各有
  rationale: 希伯来文为无动词结构，直译近于“正殿和圣所有两扇门”；加入“各有”自然表达两处分别有两扇门的分配意义。
