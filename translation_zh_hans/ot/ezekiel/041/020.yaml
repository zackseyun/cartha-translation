base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/020.yaml
  text: From the floor to above the entrance[a], cherubim and palm trees were made[b], and on the wall of the nave.
translation:
  language: zh_hans
  text: 从地面[a]到门口上方，都有基路伯和棕树图案；圣殿主厅[b]的墙上也是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地面”也可较直译为“地”或“土地”；在这里的建筑语境中，所指应是室内的地面高度。
    reason: lexical_alternative
  - marker: b
    text: “圣殿主厅”所译的希伯来语在这里可能专指圣殿的主厅，而不是整个圣殿建筑群。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהָאָרֶץ
  choice: 从地面
  rationale: אֶרֶץ通常指“地、土地”，但在圣殿建筑场景中，这里表示装饰自室内最低平面向上延伸，译作“地面”自然且符合语境，同时以脚注保留较直译的可能。
- source_word: עַד מֵעַל הַפֶּתַח
  choice: 直到门口上方
  rationale: 保留该短语所表达的垂直范围；“门口上方”是自然、明确的现代汉语建筑用语。
- source_word: הַכְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经读者熟悉的传统音译，保留其作为圣殿中宝座护卫性灵界活物的专门称谓，避免译成容易引起幼童天使联想的普通词。
- source_word: וְהַתִּמֹרִים
  choice: 和棕树图案
  rationale: תִּמֹרִים指棕树形象；结合墙面装饰的上下文，加“图案”可使现代读者明确这里不是实际栽种的树。
- source_word: עֲשׂוּיִם
  choice: 都做有
  rationale: 该被动分词宽泛表示这些形象被制作出来；“做有”不把工艺过度限定为雕刻、镌刻或绘画。
- source_word: וְקִיר הַהֵיכָל
  choice: 殿堂的墙上也是这样
  rationale: 原文末尾是缺少明示谓语的简略短语。补出“墙上”和“也是这样”，承接前述装饰，使汉语通顺，却不增加具体制作工艺。הֵיכָל在此指圣殿主体的主厅，而非整个圣殿建筑群。
theological_decisions: []
