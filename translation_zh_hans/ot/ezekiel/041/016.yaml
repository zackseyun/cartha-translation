base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/016.yaml
  text: the thresholds[a], the recessed windows, and the galleries all around on their three sides, opposite the threshold, were paneled with wood all around, from the floor up to the windows[c][b]; and the windows were covered.
translation:
  language: zh_hans
  text: 门槛、封闭式窗户[a]，以及环绕三面的廊台[b]，在门槛对面，四周都镶有木板[c]；木板从地面一直镶到窗户，窗户也被遮盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“关闭的窗户”“有窗板的窗户”或“有格栅的窗户”。原文很可能描述一种固定的建筑式样，而不只是说窗户当时关着。
    reason: lexical_alternative
  - marker: b
    text: 译作“廊台”的希伯来语词十分罕见，也可能指凸台、柱廊或上层走廊。
    reason: lexical_alternative
  - marker: c
    text: 或译“木质覆面”“木护壁”。原文用词罕见，指某种木材覆盖或镶饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים / הַסַּף
  choice: 门槛 / 门槛
  rationale: סַף可指门槛、门框或窗台；在圣殿建筑语境中译作“门槛”最为具体自然，也保留前后重复的建筑指称。
- source_word: הַחַלּוֹנִים הָאֲטֻמוֹת
  choice: 封闭式窗户
  rationale: אֲטֻמוֹת字面有“封闭、闭合”之意；这里很可能指一种固定的建筑式样，而非窗户当时碰巧关着。“封闭式窗户”既贴近原词，也避免过度确定其具体构造。
- source_word: הָאַתִּיקִים
  choice: 廊台
  rationale: 这是以西结书中的罕见建筑术语，可能指凸台、柱廊或上层走廊。“廊台”能概括其建筑性质，同时以脚注保留不确定性。
- source_word: סָבִיב לִשְׁלָשְׁתָּם
  choice: 三面周围
  rationale: 该短语的空间关系较含混，可理解为环绕三面，而不必解释为三层。“三面周围”保留其空间性和原文略显压缩的表达。
- source_word: נֶגֶד הַסַּף
  choice: 正对门槛之处
  rationale: נֶגֶד可指“在……前面”或“正对……”。此处采用自然的建筑方位表达，不进一步推断具体墙面。
- source_word: שְׂחִיף עֵץ
  choice: 覆有木板
  rationale: שְׂחִיף是罕见词，可能表示木质覆面、护壁或镶板。“覆有木板”自然地表达木材覆盖建筑表面的基本含义。
- source_word: וְהָאָרֶץ עַד הַחַלּוֹנוֹת
  choice: 从地面直到窗户
  rationale: אֶרֶץ通常指地或土地，但室内建筑语境中指地面；עַד标明覆盖范围延伸到窗户。
- source_word: וְהַחַלּוֹנוֹת מְכֻסּוֹת
  choice: 窗户也被遮盖
  rationale: מְכֻסּוֹת意为“被覆盖、遮盖”；原文未说明遮盖物或方式，因此不作具体化。
