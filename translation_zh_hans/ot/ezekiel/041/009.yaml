  yaml_path: translation/ot/ezekiel/041/009.yaml
  text: The width of the wall that belonged to the side chambers on the outside was five cubits[a], and the open area between the side chambers of the house.
translation:
  language: zh_hans
  text: 靠外侧、属于旁屋的墙厚五肘；殿的旁屋建筑旁留有空地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句较难确定，也可理解为：“所留下的是属于殿的旁屋建筑（或旁屋所在之处）。”本节是在描述圣殿周围的建筑布局。
    reason: 保留原文末句在句法及建筑指向上的真实歧义。
lexical_decisions:
- source_word: רֹחַב הַקִּיר
  choice: 墙厚
  rationale: 直译为“墙的宽度”；在建筑语境中，现代汉语通常说墙“厚”，既准确又自然。
- source_word: אֲשֶׁר לַצֵּלָע
  choice: 属于旁屋的
  rationale: צֵלָע 在圣殿建筑语境中指附设在主体建筑旁的房间；单数在此可作集合意义，因此译为“旁屋”。
- source_word: אֶל הַחוּץ
  choice: 靠外侧
  rationale: 表达这面墙朝向建筑外部的位置，同时避免误解为墙位于整个建筑群之外。
- source_word: חָמֵשׁ אַמּוֹת
  choice: 五肘
  rationale: 保留异象建筑尺寸所用的原始长度单位，不作不确定的现代换算。
- source_word: וַאֲשֶׁר מֻנָּח
  choice: 留有空地
  rationale: מֻנָּח 的基本意思是“被留下、被搁置”；结合建筑布局，译为“留有空地”较为通顺，但其句法和确切所指仍有疑难，故加注说明。
- source_word: בֵּית צְלָעוֹת אֲשֶׁר לַבָּיִת
  choice: 殿的旁屋之间
  rationale: 按上下文理解为圣殿主体旁屋所关联的空地。“殿”清楚表明 בַּיִת 在此指圣殿建筑，而不是普通住宅。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑用语。“墙厚”比“墙的宽度”更符合现代汉语习惯；“旁屋”延续圣殿建筑语境中的专门称呼。将疑难末句的主要建筑性理解置于正文，同时用脚注保留更贴近字面的另一种分析。
