  yaml_path: translation/ot/ezekiel/041/003.yaml
  text: 'Then he went inside and measured the jambs of the entrance: two cubits[a]; the entrance: six cubits[b]; and the width of the entrance: seven cubits.'
translation:
  language: zh_hans
  text: 他进去，量了入口的门柱：二肘[a]；入口：六肘[b]；入口的宽度：七肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门柱”也可译作“门口的壁柱”或“门框侧柱”。
    reason: lexical_alternative
  - marker: b
    text: 本节各项尺寸所指的建筑部分并不完全明确。希伯来文后半句直译为：“入口，六肘；入口的宽度，七肘。”
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: וּבָא לִפְנִימָה
  choice: 他进去
  rationale: בוא 配合方向副词 לִפְנִימָה 表示向内部移动；译为“进去”自然简洁，不将其提前限定为某个特定内室。
- source_word: וַיָּמָד
  choice: 量了
  rationale: 在圣殿异象的测量语境中，直接表示量取尺寸。
- source_word: אֵיל הַפֶּתַח
  choice: 入口两边的门柱
  rationale: 建筑用语 אֵיל 可指门口突出的支撑、壁柱或门框侧柱；“门柱”通俗而庄重，“两边”依据此处双数尺寸表达及建筑语境予以明示。
- source_word: שְׁתַּיִם אַמּוֹת
  choice: 各宽二肘
  rationale: 数词为阴性双数，直译尺寸为二肘；“各宽”说明两侧构件分别量度，符合相邻建筑描述，但将术语另一理解保留于脚注。
- source_word: וְהַפֶּתַח שֵׁשׁ אַמּוֹת
  choice: 入口宽六肘
  rationale: 原文省略具体维度名，语境通常理解为入口开口的宽度；汉语补出“宽”以形成自然、可理解的尺寸陈述。
- source_word: וְרֹחַב הַפֶּתַח שֶׁבַע אַמּוֹת
  choice: 入口两侧各宽七肘
  rationale: 字面为“入口的宽度七肘”，但与前一项六肘并列造成建筑尺寸上的困难。结合古译本传统及本章相邻量度，可理解为入口两侧部分各七肘；正文采用较可理解的建筑表达，同时用脚注保留马所拉文本的字面歧义。
theological_decisions: []
