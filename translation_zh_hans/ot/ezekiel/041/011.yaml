base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/011.yaml
  text: And the doorway of the side chamber was toward the free space[a], one doorway toward the north and one doorway toward the south; and the width of the free space was five cubits all around.
translation:
  language: zh_hans
  text: 侧室通往空地[a]的门，一扇朝北，一扇朝南；空地的宽度在四周都是五肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空地”或译“留空之地”；希伯来语为 מֻנָּח，指建筑周围特意留出的区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶתַח
  choice: 门
  rationale: 在圣殿建筑描述中指可供出入的门口；现代汉语用“门”简洁自然，也保留具体的建筑含义。
- source_word: הַצֵּלָע
  choice: 侧室
  rationale: 在以西结所见圣殿的语境中，指附于主体建筑旁的房间；“侧室”准确且符合庄重的建筑用语。
- source_word: לַמֻּנָּח
  choice: 朝向空地
  rationale: מֻנָּח在此指建筑周围留出的空间，而非宗教意义上的“安息之处”；“朝向空地”也保留介词所表达的空间关系。
- source_word: פֶּתַח אֶחָד דֶּרֶךְ הַצָּפוֹן
  choice: 一扇门朝北
  rationale: דֶּרֶךְ在此表示方向；译文以自然汉语表达门的方位。
- source_word: וּפֶתַח אֶחָד לַדָּרוֹם
  choice: 一扇门朝南
  rationale: 与前一分句保持对称，并保留原文的方向意义。
- source_word: רֹחַב
  choice: 宽度
  rationale: 建筑测量语境中的标准现代汉语用词。
- source_word: מְקוֹם הַמֻּנָּח
  choice: 空地
  rationale: 该短语指建筑周围被留空的区域；译作“空地”自然明晰，具体词义差异置于脚注说明。
- source_word: חָמֵשׁ אַמּוֹת
  choice: 五肘
  rationale: 保留原文古代长度单位“肘”，以维持圣殿尺寸记载的形式准确性。
- source_word: סָבִיב סָבִיב
  choice: 四周
  rationale: 原文重复形式强调环绕各面；“四周”在现代汉语中自然表达完整环绕之意。
theological_decisions: []
