base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/026.yaml
  text: And there were shuttered windows and palm trees on this side and on that[a], along the sidewalls of the vestibule, and on the side chambers of the temple[c][b], and the canopies.
translation:
  language: zh_hans
  text: 门廊侧墙的这边和那边、殿的旁屋和挑檐[c]上，都有封闭的窗户[a]和棕榈树图案[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“关闭的窗户”；希伯来语表示这些窗户以某种方式被封住或遮住。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“棕榈树”，这里可能指圣殿建筑上的棕榈树装饰图案。
    reason: cultural_note
  - marker: c
    text: 原文最后一个建筑术语的含义不能确定，可能指挑出的屋顶、屋檐或其他悬挑构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים אֲטֻמוֹת
  choice: 封闭式窗户
  rationale: חַלּוֹנִים通常指建筑物的窗户；被动分词אֲטֻמוֹת表示窗户以某种方式封闭、遮住或装有屏障。“封闭式”保留其建筑特征，同时不武断说明具体构造。
- source_word: תִמֹרִים
  choice: 棕榈树图案
  rationale: 该词字面指棕榈树；在以西结所见圣殿的建筑语境中，所指显然是棕榈树形的装饰，译出“图案”可避免误解为栽种的树木。
- source_word: מִפּוֹ וּמִפּוֹ
  choice: 这边和那边都有
  rationale: 这个分配性表达强调两边均有；采用自然的现代汉语，同时保留希伯来语逐边陈述的意味。
- source_word: אֶל כִּתְפוֹת הָאוּלָם
  choice: 门廊两边的侧墙
  rationale: כָּתֵף本义为“肩”，用于建筑时指侧部或侧墙；אוּלָם在圣殿建筑中是门廊。
- source_word: צַלְעוֹת הַבַּיִת
  choice: 殿的旁屋
  rationale: צֵלָע在圣殿建筑语境中常指侧面的房间或附属结构；הַבַּיִת在此指圣殿主体，故译为“殿”。
- source_word: הָעֻבִּים
  choice: 挑檐
  rationale: 这是含义不确定的罕见建筑术语，可能指向外突出的屋顶、檐部或其他悬挑构件。“挑檐”是简洁而谨慎的建筑性译法，具体不确定性在脚注说明。
