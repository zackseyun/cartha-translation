base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/013.yaml
  text: 'Then he measured the temple: its length was a hundred cubits; and the separate area[a], the building, and its walls had a length of a hundred cubits.'
translation:
  language: zh_hans
  text: 他量了殿：长一百肘；隔开的区域[a]、建筑及其墙壁，长度也是一百肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“隔开的地方”。这个希伯来词指圣殿建筑群中划分出来的一处独立区域。
    reason: 保留 הַגִּזְרָה 的词义选择，因为它可指被分隔的区域或地方，而其确切建筑性质并不完全明确。
lexical_decisions:
- source_word: וּמָדַד
  choice: 他又量了
  rationale: ו־承接前文并推进叙事；“又”自然表达连续的测量动作，不过度强化时间先后。
- source_word: הַבַּיִת
  choice: 殿
  rationale: 在以西结的圣殿异象中，此词指圣殿主体；“殿”简洁庄重，也避免与本节后面的另一座建筑混淆。
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: 长一百肘
  rationale: 按现代汉语自然表达尺寸，并保留古代长度单位“肘”。
- source_word: הַגִּזְרָה
  choice: 隔开的区域
  rationale: 该词在本段指圣殿建筑群中划分出来的独立区域；此译法保留其“分隔、划出”的词义，又不武断限定具体用途。
- source_word: הַבִּנְיָה
  choice: 那座建筑
  rationale: 直译为所建的建筑物；加“那座”使汉语指称自然，并与“殿”区分。
- source_word: קִירוֹתֶיהָ
  choice: 它的墙
  rationale: 阴性单数后缀最自然地回指邻近的阴性名词“建筑”（הַבִּנְיָה），但原文所指仍可能按整体建筑区域理解；汉语“它”保留这种回指弹性。
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: 长也是一百肘
  rationale: 原文重复同一测量短语；“也是”清楚连接第二组对象与前面的相同长度，是符合汉语习惯的轻度补足。
