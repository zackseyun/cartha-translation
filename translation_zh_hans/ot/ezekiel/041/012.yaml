base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/012.yaml
  text: And the building that faced the separate area on the side toward the west was seventy cubits wide[a], and the wall of the building was five cubits wide all around, and its length was ninety cubits.
translation:
  language: zh_hans
  text: 在西边的那座面对分隔区的建筑，宽七十肘；建筑的墙四周厚五肘，长九十肘。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבִּנְיָן
  choice: 建筑
  rationale: בִּנְיָן指建造而成的房屋或构筑物；在圣殿建筑测量的语境中，“建筑”自然、准确。
- source_word: אֲשֶׁר אֶל־פְּנֵי הַגִּזְרָה
  choice: 朝着隔离区
  rationale: אֶל־פְּנֵי表达面对、朝向或位于对面的空间关系；“朝着”保留朝向关系，הַגִּזְרָה译作“隔离区”，反映该区域被划分、分隔的含义。
- source_word: פְּאַת דֶּרֶךְ הַיָּם
  choice: 位于西边
  rationale: 该短语直译涉及“海的方向”；在以色列地理方位中，海指西面的地中海，因此正文用现代汉语明确表达为“西边”，并以脚注保留原文意象。
- source_word: רֹחַב שִׁבְעִים אַמָּה
  choice: 宽七十肘
  rationale: רֹחַב表示宽度；“宽七十肘”简洁自然，并准确保留古代长度单位。
- source_word: קִיר הַבִּנְיָן חָמֵשׁ אַמּוֹת רֹחַב
  choice: 建筑的墙……厚五肘
  rationale: 原文以“宽”描述墙体尺寸；现代汉语通常用“厚”说明墙的横向尺寸，含义更清楚。
- source_word: סָבִיב סָבִיב
  choice: 四周
  rationale: 重复形式强调环绕各面；“四周”自然地传达完整环绕之意。
- source_word: וְאָרְכּוֹ תִּשְׁעִים אַמָּה
  choice: 建筑长九十肘
  rationale: 后缀所指在语法上可能是建筑，也可能因近接名词而略显含混；按整体测量结构，理解为建筑长度最为连贯，正文显明所指以免现代汉语代词歧义。
