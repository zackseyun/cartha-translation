base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/025.yaml
  text: And cherubim and palm trees were made on them[a], on the doors of the nave, just as they were made on the walls[c][b]; and there was a wooden canopy before the front of the vestibule outside.
translation:
  language: zh_hans
  text: 殿堂[b]的门上饰有[a]基路伯和棕树图案，如同墙上的一样；门廊正面外侧有木制檐棚[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饰有”直译可作“制作在……上”或“做在……上”；原文动词本身没有明确说明制作方式，这里按圣殿装饰的语境翻译。
    reason: lexical_alternative
  - marker: b
    text: “殿堂”也可译作“圣殿大厅”或“圣所”；这里指圣殿建筑的主厅。
    reason: lexical_alternative
  - marker: c
    text: 译作“檐棚”的希伯来语建筑术语含义不确定，也可能指木制的突出部分、挑檐或类似构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשׂוּיָה אֲלֵיהֶן
  choice: 门上也刻有
  rationale: 原文使用意为“制作”的宽泛被动形式，所指为门上的装饰；中文用“刻有”自然呈现这一建筑装饰语境，同时以脚注保留较宽泛的译法。
- source_word: דַּלְתוֹת הַהֵיכָל
  choice: 殿堂的门
  rationale: הֵיכָל在此指圣殿建筑的主厅，并非整个圣殿区域；“殿堂”简明且符合建筑语境。
- source_word: כְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指圣殿装饰中的有翼天上活物。
- source_word: וְתִמֹרִים
  choice: 和棕树
  rationale: 直译该名词；上下文已表明这里所说的是门上的棕树形装饰。
- source_word: כַּאֲשֶׁר עֲשׂוּיִם לַקִּירוֹת
  choice: 和墙上的一样
  rationale: 自然表达门上与墙上采用相同装饰的明确比较关系。
- source_word: וְעָב עֵץ
  choice: 木制的檐棚
  rationale: עָב是含义不确定的建筑术语；“檐棚”可表达门廊前部向外突出的木制构件，但不确定性在脚注中保留。
- source_word: אֶל פְּנֵי הָאוּלָם מֵהַחוּץ
  choice: 门廊正面外侧
  rationale: 将פְּנֵי理解为建筑的正面，将מֵהַחוּץ理解为其外侧；“门廊”准确表达אוּלָם在本段中的前厅或廊厅。
