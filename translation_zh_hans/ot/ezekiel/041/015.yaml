base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/015.yaml
  text: 'Then he measured the length of the building facing the separate area that was behind it[a], with its galleries on this side and on that side: one hundred cubits[b]; and the inner nave and the porches of the court.'
translation:
  language: zh_hans
  text: 他又量了那座面向其后方隔离区域的建筑，连同它两边的廊道[a]，长一百肘；以及内殿[b]和院子的门廊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “廊道”所译的希伯来语建筑术语含义不确定，也可译作“柱廊”，或指另一种附属结构。
    reason: lexical_alternative
  - marker: b
    text: “内殿”也可译作“里面的殿”或“内圣所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: 他又量了
  rationale: 叙事中的连续动词推进测量过程；“又”自然承接上文，同时保留连续性。
- source_word: אֹרֶךְ הַבִּנְיָן
  choice: 那座……建筑……长
  rationale: 按建筑测量语境表达其长度；中文将“长”置于度量数值前，使句子自然清楚。
- source_word: אֶל־פְּנֵי הַגִּזְרָה אֲשֶׁר עַל־אַחֲרֶיהָ
  choice: 朝向后面隔离地带的
  rationale: 保留建筑与其后方特定分隔区域之间的方位关系，不把该区域进一步解释为院子或禁区。
- source_word: וְאַתִּיקֶיהָ / וְאֲתִיקֶיהָ
  choice: 连同建筑两边的廊房
  rationale: 该罕见建筑术语含义不确定；“廊房”在现代中文中易懂，并能宽泛指称沿建筑两侧延伸的附属结构。代词所指在复杂句法中可能有歧义，因此用“建筑”明确最可能的所指。
- source_word: מִפּוֹ וּמִפּוֹ
  choice: 两边
  rationale: 成对的方位词表示这一边和那一边；中文以“两边”简洁自然地传达。
- source_word: מֵאָה אַמָּה
  choice: 一百肘
  rationale: 保留古代长度单位，不作现代换算，以免造成不必要的精确印象。
- source_word: הַהֵיכָל הַפְּנִימִי
  choice: 内殿
  rationale: הֵיכָל在此可指圣殿主体内部的大厅；“内殿”简洁庄重，但也可能理解为“里面的殿”或“内圣所”，故加注说明。
- source_word: וְאֻלַמֵּי הֶחָצֵר
  choice: 和院子的门廊
  rationale: אוּלָם表示门廊、前厅一类建筑空间；“门廊”通俗而符合建筑语境，复数意义由院子所属的多处门廊表达。
theological_decisions: []
