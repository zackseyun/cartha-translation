  yaml_path: translation/ot/ezekiel/041/017.yaml
  text: Above the doorway[a], and as far as the inner house, and outside, and on all the wall all around, in the inner part and in the outer part[b], were measurements.
translation:
  language: zh_hans
  text: 门口上方、直到内殿[a]、外面，以及内外四周所有墙面，都有量度[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内殿”直译为“里面的屋”或“内屋”；在本段圣殿异象中，“屋”可指殿宇。
    reason: lexical_alternative
  - marker: b
    text: “量度”也可译作“尺寸”或“尺度”。原文在这里十分简略，未说明这些量度以何种形式呈现。
    reason: textual_ambiguity
lexical_decisions:
- source_word: מֵעַל הַפֶּתַח
  choice: 门口上方
  rationale: מֵעַל 表示位于某物之上；“门口上方”自然地保留了建筑方位，且不把 פֶּתַח 过度限定为门扇。
- source_word: וְעַד הַבַּיִת הַפְּנִימִי
  choice: 直到内殿
  rationale: בַּיִת 在以西结的圣殿异象中常指殿宇；“内殿”符合语境，同时脚注保留较直译的“内屋”。
- source_word: וְלַחוּץ
  choice: 外面也是如此
  rationale: 原文只简略说“并在外面”；中文补出“也是如此”，使省略结构可读，又不增加具体装饰内容。
- source_word: וְאֶל כָּל הַקִּיר סָבִיב סָבִיב
  choice: 四周的所有墙面上
  rationale: אֶל 在此表示与墙面的关联；重复的 סָבִיב 强调环绕范围，用“四周”简洁表达。
- source_word: בַּפְּנִימִי וּבַחִיצוֹן
  choice: 内外
  rationale: 两个名词化形容词形成内部与外部的对举；中文“内外”保留其概括性，不强行指定具体房间。
- source_word: מִדּוֹת
  choice: 尺寸标记
  rationale: 该复数名词基本义为“尺寸、量度”；本句高度省略，“尺寸标记”既保留测量含义，也使其与墙面搭配较为自然，但不把它解释成后文的雕刻图案。
