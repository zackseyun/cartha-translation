base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/006.yaml
  text: And the side chambers were side chamber upon side chamber[a], three and thirty times; and they entered into the wall that belonged to the house for the side chambers all around, so that they might be supported[b], but they were not supported by the wall of the house.
translation:
  language: zh_hans
  text: 旁屋一间接一间[a]，共有三十三次；它们接入属于殿的墙中，作为环绕四周的旁屋，好使它们得以固定[b]；但它们并不固定在殿墙中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“三又三十次”。这可能指三十三间旁屋、三十三个排列位置，或一种建筑排列的计数，并非动作重复三十三次。
    reason: lexical_alternative
  - marker: b
    text: “固定”也可译为“扣牢”“抓牢”或“支承”；原文强调这些旁屋被稳固在适当位置。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּלָעוֹת / צֵלָע
  choice: 旁屋
  rationale: 在圣殿建筑语境中，צלע指主殿侧面的附属房间或结构；“旁屋”既简洁，也避免按字面译为“肋骨”。
- source_word: צֵלָע אֶל צֵלָע
  choice: 一间接一间
  rationale: 这是分配性的建筑排列用语；现代汉语“一间接一间”自然表达各旁屋彼此相接，而不强行断定是横向相邻还是纵向叠置。
- source_word: שָׁלוֹשׁ וּשְׁלֹשִׁים פְּעָמִים
  choice: 共有三十三处
  rationale: 马所拉文本直译为“三又三十次”。这里的 פְּעָמִים 更可能计算旁屋的处数或排列位置，而非表示动作重复的次数；正文采用自然汉语，并以脚注保留原文形式及解释上的不确定性。
- source_word: וּבָאוֹת בַּקִּיר
  choice: 嵌入……墙中
  rationale: 阴性复数形式与旁屋呼应，描写旁屋与墙体结构接合。“嵌入”在建筑语境中比“进入”自然，同时保留空间上的连接意象。
- source_word: בַּקִּיר אֲשֶׁר לַבַּיִת לַצְּלָעוֹת סָבִיב סָבִיב
  choice: 环绕四周，嵌入殿旁为旁屋而设的墙中
  rationale: 将重复的 סָבִיב 译为“环绕四周”，并把这道墙表述为殿旁供旁屋接合之用的墙，以保留其与末句“殿墙”的对照，但不进一步推定具体工程构造。
- source_word: לִהְיוֹת אֲחוּזִים
  choice: 好使它们得以固定
  rationale: אחז 的被动意义在此强调被抓牢、扣住或稳固；“固定”适合建筑语境，也比单译“支撑”更能保留“牢牢接合”的含义。
- source_word: וְלֹא יִהְיוּ אֲחוּזִים בְּקִיר הַבָּיִת
  choice: 却不固定在殿墙里
  rationale: 重复使用“固定”对应同一希伯来词，并以“在……里”表达 בְּ 的空间关系，保留经文所强调的结构区别。
