  text: And between the chambers was a width of twenty cubits all around the temple[a], all around.
translation:
  language: zh_hans
  text: 在那些房间之间，有二十肘宽的空间，围绕着殿，周围都是如此。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在本节三次使用“环绕、四周”一词，以加强语气。
    reason: 说明译文对希伯来语重复修辞的处理。
lexical_decisions:
- source_word: וּבֵין
  choice: 在……与……之间
  rationale: 希伯来语连接词兼介词引出下一项建筑细节；中文依句法将连接关系自然表达为“在……与……之间”。
- source_word: הַלְּשָׁכוֹת
  choice: 那些房间
  rationale: לְשָׁכוֹת 指建筑中的房间或厢房；本节没有明说其为附属房，采用“房间”较贴近词义，也避免加入原文未明确表达的建筑关系。
- source_word: רֹחַב
  choice: 有……宽的空地
  rationale: רֹחַב 表示宽度；结合“在房间与殿之间”的空间关系，中文补出“空地”使无动词的测量句清楚自然，但不改变其所描述的是间隔宽度。
- source_word: עֶשְׂרִים אַמָּה
  choice: 二十肘宽
  rationale: 保留原文古代长度单位“肘”，不换算为现代单位；“宽”明确其为横向尺度。
- source_word: לַבַּיִת
  choice: 殿
  rationale: בַּיִת 字面为“房屋”，但在以西结圣殿异象的语境中指圣殿建筑；“殿”准确且简洁。
- source_word: סָבִיב לַבַּיִת סָבִיב סָבִיב
  choice: 环绕着殿，四周都是如此
  rationale: 原文三次使用 סָבִיב，强调空间环绕整座殿。中文保留前后两层表达以传达这种强调，同时避免机械三重复造成不自然。
