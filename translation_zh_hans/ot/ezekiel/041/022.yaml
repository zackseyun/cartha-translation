  text: הַ/מִּזְבֵּ֡חַ עֵ֣ץ שָׁלוֹשׁ֩ אַמּ֨וֹת גָּבֹ֜הַּ וְ/אָרְכּ֣/וֹ שְׁתַּֽיִם אַמּ֗וֹת וּ/מִקְצֹֽעוֹתָי/ו֙ ל֔/וֹ וְ/אָרְכּ֥/וֹ וְ/קִֽירֹתָ֖י/ו עֵ֑ץ וַ/יְדַבֵּ֣ר אֵלַ֔/י זֶ֚ה הַ/שֻּׁלְחָ֔ן אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/022.yaml
  text: The altar was of wood[a], three cubits high and two cubits long; its corners, its length, and its sides were of wood. And he said to me, “This is the table that is before Yahweh.”
translation:
  language: zh_hans
  text: 祭坛是木制的[a]，高三肘，长二肘；它的角、长度和侧面都是木制的。他对我说：“这就是在雅威面前的桌子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文开头称它为“祭坛”，后面却说它是“桌子”；这可能反映这件器物兼有类似祭坛和桌子的性质或用途。
    reason: 说明原文两个不同称谓之间真实存在的词义张力。
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: 这祭坛
  rationale: 该名词通常指“祭坛”。后文虽称此物为“桌子”，此处仍保留原文用词，不将两者调和。
- source_word: עֵץ
  choice: 木制的
  rationale: 表达材料性质，符合本节对器物的描述，也适合现代汉语。
- source_word: שָׁלוֹשׁ אַמּוֹת גָּבֹהַּ
  choice: 高三肘
  rationale: 按希伯来文保留古代长度单位，并采用简洁自然的尺寸表达。
- source_word: וְאָרְכּוֹ שְׁתַּיִם אַמּוֹת
  choice: 长二肘
  rationale: 准确保留明确给出的长度，中文表达简练。
- source_word: וּמִקְצֹעוֹתָיו לוֹ
  choice: 它的角
  rationale: מִקְצֹעוֹת指角或角部；לוֹ在此带有归属或“它有”的意味，融入所有格表达。
- source_word: וְקִירֹתָיו
  choice: 它的侧面
  rationale: קִירֹת通常可指墙壁，但用于这件较小的木制祭坛或桌子时，“侧面”更自然，同时保留其结构表面的含义。
- source_word: וַיְדַבֵּר אֵלַי
  choice: 他对我说
  rationale: 自然呈现引出直接引语的叙事公式。
- source_word: זֶה הַשֻּׁלְחָן
  choice: 这就是……桌子
  rationale: שֻׁלְחָן明确意为“桌子”。保留原文由“祭坛”转称“桌子”的张力。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表达空间或临在关系；יהוה按其专名音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译呈现这一专名，不以称号替代。
- issue: 本节“祭坛”与“桌子”的关系
  choice: 在正文中保留两个不同称谓
  alternative: 统一译作“祭坛”；统一译作“桌子”；全篇译作“祭坛桌”
  rationale: 希伯来文先用מִזְבֵּחַ，后用שֻׁלְחָן。保留这种转换，可避免擅自判定器物的单一性质或功能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。尺寸使用传统圣经单位“肘”；句式尽量贴近希伯来文描述次序，同时避免生硬直译。
