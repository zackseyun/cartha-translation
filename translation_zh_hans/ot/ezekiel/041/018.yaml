  text: וְ/עָשׂ֥וּי כְּרוּבִ֖ים וְ/תִֽמֹרִ֑ים וְ/תִֽמֹרָה֙ בֵּין כְּר֣וּב לִ/כְר֔וּב וּ/שְׁנַ֥יִם פָּנִ֖ים לַ/כְּרֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/018.yaml
  text: Cherubim and palm trees were made on it[a], with a palm tree between cherub and cherub; and each cherub had two faces.
translation:
  language: zh_hans
  text: 上面雕有[a]基路伯和棕树；基路伯与基路伯之间有一棵棕树，每个基路伯都有两张脸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雕有”原文直译为“做成”；在这里的建筑装饰语境中，很可能指制作或雕刻出的图案。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּי
  choice: 上面雕有
  rationale: 该词是动词 עשה 的被动分词，字面义为“被做成”。结合圣殿墙面装饰的上下文，译作“雕有”自然地表达制作或雕刻出的图案；“上面”由上下文所述装饰表面补出。
- source_word: כְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，既适合异象与圣殿建筑的庄重语域，也不把这种形象解释为其他类别的灵体。
- source_word: וְתִמֹרִים / וְתִמֹרָה
  choice: 棕树 / 一棵棕树
  rationale: 此处指圣殿装饰中的棕树图案。复数先概述整体图案，随后用单数说明各基路伯之间的排列。
- source_word: בֵּין כְּרוּב לִכְרוּב
  choice: 基路伯与基路伯之间
  rationale: 保留原文单数分配式结构及重复表达，说明棕树图案排列在相邻的基路伯之间。
- source_word: וּשְׁנַיִם פָּנִים לַכְּרוּב
  choice: 每个基路伯都有两张脸
  rationale: 原文直译近似“基路伯有两张脸”，其中单数“基路伯”具概括、分配作用；现代中文用“每个”清楚表达所有图案皆如此，且与下一节的具体说明一致。
theological_decisions:
- issue: 圣殿装饰中基路伯形象的性质
  choice: 按建筑描写直译为基路伯和棕树图案，不附加寓意或预表解释。
  alternative: 把这些形象解释为某种象征或神学预表。
  rationale: 本节只描述圣殿的装饰与排列，译文不应加入原文没有明说的象征意义。
translation_notes:
  register: 采用现代、庄重而清楚的建筑描写用语。“基路伯与基路伯之间”略保留希伯来文的重复节奏；“每个基路伯”则以自然中文表达其分配意义。
