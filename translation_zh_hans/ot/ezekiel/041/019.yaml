revisions:
- from: 人的脸[a]朝着这边的棕榈树，少壮狮子的脸朝着那边的棕榈树。整座殿宇四周都刻有这样的图案。
  to: 棕榈树的一边是人脸[a]，另一边是幼狮的脸；这样的图案遍布整座殿宇四周。
  rationale: 修订明确两种面孔分别位于同一棕榈树图案的两侧，避免原稿可能造成的“两棵树”理解；同时以“人脸”“幼狮”提升现代汉语的自然度。末句仍以“这样的图案”总括单数被动分词所指的整体装饰布局，不武断规定其单复数指向。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:53:39Z'
