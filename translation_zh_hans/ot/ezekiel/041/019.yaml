  text: וּ/פְנֵ֨י אָדָ֤ם אֶל הַ/תִּֽמֹרָה֙ מִ/פּ֔וֹ וּ/פְנֵֽי כְפִ֥יר אֶל הַ/תִּֽמֹרָ֖ה מִ/פּ֑וֹ עָשׂ֥וּי אֶל כָּל הַ/בַּ֖יִת סָבִ֥יב סָבִֽיב־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/019.yaml
  text: with a human face toward the palm tree on one side[a], and a young lion’s face toward the palm tree on the other side. They were made all around the whole temple.
translation:
  language: zh_hans
  text: 棕榈树的一边是人脸[a]，另一边是幼狮的脸；这样的图案遍布整座殿宇四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“男人的脸”。
    reason: אָדָם 可指“人”，也可按较具体的男性含义译作“男人”；本处装饰语境更适合正文译“人”。
lexical_decisions:
- source_word: פְנֵי אָדָם
  choice: 人的脸
  rationale: 该构造短语直译为“人的脸”。在与狮脸相对的装饰图案中，所指是人类的面容；此译既贴近原文，也不暗示某个特定人物。
- source_word: הַתִּמֹרָה
  choice: 棕榈树
  rationale: 指上下文所述殿内雕刻的棕榈树图案。“棕榈树”是现代汉语中清楚而直接的表达。
- source_word: מִפּוֹ
  choice: 这边／那边
  rationale: 原文两次重复“从这边”，表示棕榈树图案相对的两侧；汉语用“这边／那边”自然地呈现这种对应关系。
- source_word: פְנֵי כְפִיר
  choice: 少壮狮子的脸
  rationale: כְפִיר 指年轻而有力的狮子；“少壮狮子”保留其年龄和力量色彩，比笼统的“狮子”更准确。
- source_word: עָשׂוּי
  choice: 刻有这样的图案
  rationale: 原文为阳性单数被动分词，可总括前述雕刻的装饰布局。结合上下文译为“刻有这样的图案”，既呈现制作方式，也避免在汉语中强行指定单数或复数主语。
- source_word: אֶל כָּל הַבַּיִת
  choice: 整座殿宇
  rationale: בַּיִת 在本段异象中指圣殿建筑；“殿宇”庄重、自然，也明确其语境所指。
- source_word: סָבִיב סָבִיב
  choice: 四周都
  rationale: 重复形式强调环绕和遍及；“四周都”以自然汉语表达其周遍范围。
theological_decisions:
- issue: 装饰异象中 אָדָם 的译法
  choice: 人
  alternative: 男人
  rationale: 此处 אָדָם 描述与狮脸相对的一类面容，重点在“人”与“狮子”的区别，并非明确强调男性个体；正文译“人”较符合语境，同时以脚注保留“男人”这一可能的字面理解。
- issue: עָשׂוּי 的单复数指向
  choice: 用无显式数目的“刻有这样的图案”总括装饰
  alternative: 它被制成／它们被制成
  rationale: 希伯来文形式为阳性单数，但具体所指可能是整体装饰工程或前述图案；汉语的总括表达保留这种指向上的张力，不武断改成复数。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“这边／那边”清楚表现两个面孔分处棕榈树两侧；末句以总括式表达承接上下文的雕刻图案，并保留原文单数形式所指的不确定性。
