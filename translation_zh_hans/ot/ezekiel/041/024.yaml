  text: 'And the doors had two leaves each[a], two turning leaves: two leaves for the one door and two leaves for the other.'
translation:
  language: zh_hans
  text: 这些门各有两扇门扇，是两扇可转动的[a]门扇：一扇门有两扇，另一扇也有两扇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可绕轴转动的”，也可能指“可折叠的”。希伯来语只表明门扇能够转动，没有说明具体构造。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּלָתוֹת / דֶּלֶת
  choice: 门／门扇
  rationale: 该名词可指整扇门，也可指门的活动扇片。上下文先说门的整体，随后按两片一组说明其组成，因此分别译为“门”和“门扇”。
- source_word: מוּסַבּוֹת
  choice: 可以转动的
  rationale: 该词说明门扇能够转动，但没有明确具体是绕轴转动、摆动还是折叠；“可以转动的”保留了这种建筑构造上的开放性。
- source_word: שְׁתַּיִם ... שְׁתַּיִם ... שְׁתַּיִם ... וּשְׁתֵּי
  choice: 两片……两片……两片……两片
  rationale: 明确保留重复的数词，以呈现希伯来文精确、逐项说明建筑结构的风格。
- source_word: לַדְּלָתוֹת
  choice: 每扇门都有
  rationale: 介词在这里表示归属或配置；译作“每扇门都有”符合现代汉语，也清楚表达各门的构造。
- source_word: לְדֶלֶת אֶחָת ... לָאַחֶרֶת
  choice: 一扇门……另一扇门
  rationale: 这组对应表达最自然地把两组门扇分别归给前文的两扇门，保留原文的分配关系。
