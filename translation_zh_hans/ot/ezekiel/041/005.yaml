    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: 他又量了
  rationale: 该词是מדד的连续叙事形式，承接异象中的下一项测量；“又量了”符合现代汉语叙事，也保留动作的连续性。
- source_word: קִיר הַבַּיִת
  choice: 殿墙
  rationale: קִיר指墙；הַבַּיִת在本段语境中指圣殿主体建筑。译作“殿墙”简洁自然，并准确表达建筑语境。
- source_word: שֵׁשׁ אַמּוֹת
  choice: 墙厚六肘
  rationale: 原文直陈殿墙“六肘”；在建筑测量语境中所测的是墙的厚度。补出“墙厚”使现代汉语意思完整，不改变所量尺寸。保留古代长度单位“肘”。
- source_word: הַצֵּלָע
  choice: 旁屋
  rationale: צֵלָע在圣殿建筑语境中指依附主体建筑侧面的房间或附属结构。此处虽为单数形式，但后文表明其环绕圣殿，具有集合意义，因此译作“旁屋”而不限定单数。
- source_word: אַרְבַּע אַמּוֹת
  choice: 宽四肘
  rationale: רֹחַב明确表示宽度；保留原有古代单位“肘”。
- source_word: סָבִיב סָבִיב לַבַּיִת סָבִיב
  choice: 环绕殿的四周
  rationale: 原文多次重复סָבִיב，强调旁屋围绕圣殿各面分布。“环绕……四周”以自然现代汉语保留这种全面环绕的强调。
