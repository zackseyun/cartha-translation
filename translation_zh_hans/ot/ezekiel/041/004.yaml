  text: וַ/יָּ֨מָד אֶת אָרְכּ֜/וֹ עֶשְׂרִ֣ים אַמָּ֗ה וְ/רֹ֛חַב עֶשְׂרִ֥ים אַמָּ֖ה אֶל פְּנֵ֣י הַֽ/הֵיכָ֑ל וַ/יֹּ֣אמֶר אֵלַ֔/י זֶ֖ה קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/004.yaml
  text: 'Then he measured its length: twenty cubits[a], and the width: twenty cubits, before the nave; and he said to me, “This is the Most Holy Place.”'
translation:
  language: zh_hans
  text: 随后他量了内室：长二十肘，宽二十肘，在正殿前。他对我说：“这是至圣所[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按传统译作“至圣之所”；直译作“圣中之圣”。
    reason: 保留希伯来语最高级构词及传统名称的可见性。
lexical_decisions:
- source_word: וַיָּמָד
  choice: 他又量了
  rationale: 未完成式连续体推进叙事；“又”自然承接上一项测量，不额外强化时间先后。
- source_word: אָרְכּוֹ
  choice: 那里的长度
  rationale: 三人称阳性单数后缀在语境中指上一节进入的内室；汉语用“那里”保持指代自然，也不把原文未重复的“内室”强行补入正文。
- source_word: עֶשְׂרִים אַמָּה
  choice: 二十肘
  rationale: 保留古代长度单位“肘”，既准确又符合中文圣经语体，不作推测性的现代单位换算。
- source_word: וְרֹחַב
  choice: 宽度也是二十肘
  rationale: רֹחַב意为宽度；补出“也是”使并列尺寸在现代汉语中清楚流畅。
- source_word: אֶל־פְּנֵי הַהֵיכָל
  choice: 就在正殿前方
  rationale: אֶל־פְּנֵי表达相对于הֵיכָל的空间方位；“正殿”在本段特指外面的主圣所房间，而非整个圣殿建筑群。“前方”保留原文空间关系，避免解释成建筑群之外。
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 采用自然、直接的现代汉语叙事表达。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 至圣所
  rationale: 这是希伯来语“圣中之圣”的最高级结构，指最里面的圣所；“至圣所”简洁、清楚，并保留与相关经文的术语连续性。
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים的译法
  choice: 至圣所
  alternative: 圣中之圣／最神圣的地方
  rationale: “至圣所”准确表达希伯来语最高级含义，也是现代中文读者容易识别的圣所名称；脚注保留较直译的形式，显明原文结构而不附加宗派解释。
- issue: אֶל־פְּנֵי הַהֵיכָל的空间关系
  choice: 就在正殿前方
  alternative: 朝着正殿／面对正殿
  rationale: 该短语可侧重位置或朝向。正文采用直接的方位表达，但不进一步推定具体建筑方向，以保留异象描述中的空间张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“肘”和“至圣所”保留必要的古代文化与圣所术语；句式简明，适合普通读者朗读。
