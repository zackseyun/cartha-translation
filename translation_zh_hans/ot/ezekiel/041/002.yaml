base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/002.yaml
  text: 'And the width of the entrance was ten cubits[a], and the sidewalls of the entrance were five cubits on this side and five cubits on that side. Then he measured its length: forty cubits, and the width: twenty cubits.'
translation:
  language: zh_hans
  text: 门口宽十肘；门口两侧的部分[a]，一边五肘，另一边五肘。他量了殿堂的长，是四十肘；宽是二十肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门口两侧的部分”原文直译为“门口的肩部”，指门口两旁的侧部结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹחַב
  choice: 宽／宽度
  rationale: 在建筑测量语境中，这是现代汉语最自然、明确的表达。
- source_word: הַפֶּתַח
  choice: 门口
  rationale: 指建筑物供出入的开口；“门口”自然易懂，也不局限于门扇本身。
- source_word: עֶשֶׂר אַמּוֹת
  choice: 十肘
  rationale: 保留原文长度单位，并贴近希伯来文简洁的测量表达。
- source_word: כִתְפוֹת
  choice: 两侧的墙体
  rationale: 原义为“肩部”，在这里指门口两旁的侧部结构；译作“两侧的墙体”既表达其建筑功能，又避免过于生硬。
- source_word: מִפּוֹ ... מִפּוֹ
  choice: 这边……那边
  rationale: 自然传达原文左右两侧分别测量的空间分布。
- source_word: וַיָּמָד
  choice: 他又量了
  rationale: 既体现叙事推进，也与连续进行的测量行动衔接自然。
- source_word: אָרְכּוֹ
  choice: 它的长度
  rationale: 保留原文代词所指的简洁性，不在本节中擅自补明具体建筑名称。
- source_word: אַרְבָּעִים אַמָּה
  choice: 四十肘
  rationale: 直接保留原文的数值和长度单位。
- source_word: וְרֹחַב עֶשְׂרִים אַמָּה
  choice: 宽度是二十肘
  rationale: 补出汉语所需的系词，使原文省略式的测量短语清楚自然。
