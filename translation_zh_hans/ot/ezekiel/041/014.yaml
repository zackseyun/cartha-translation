  language: zh_hans
  text: 圣殿正面和分隔区朝东一侧的宽度是一百肘[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宽度”也可译作“宽幅”。
    reason: lexical_alternative
  - marker: b
    text: “圣殿”原文作“房屋”；在这段圣殿异象中，指圣殿建筑。
    reason: lexical_alternative
  - marker: c
    text: “朝东”也可译作“向东”或“在东边”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹחַב
  choice: 宽度
  rationale: 该词表示横向尺度；在建筑测量语境中，“宽度”是现代汉语最自然、准确的表达。
- source_word: פְּנֵי
  choice: 一面
  rationale: 原义为“面”，在空间和建筑语境中指朝向某方的一面；与末尾“朝东”结合，译作“朝东一面”自然清楚。
- source_word: הַבַּיִת
  choice: 殿
  rationale: 字面为“房屋”，但在以西结的圣殿异象中指圣殿建筑；“殿”既简洁又符合上下文。
- source_word: הַגִּזְרָה
  choice: 隔离地
  rationale: 该词指与圣殿相邻、被划分出来的区域；“隔离地”保留其划出、分隔的含义，也与本段建筑描述相符。
- source_word: לַקָּדִים
  choice: 朝东
  rationale: 该短语标示东方朝向；“朝东”贴近希伯来文，并避免将其过度具体化为固定位置。
- source_word: מֵאָה אַמָּה
  choice: 一百肘
  rationale: 直接保留古代长度单位“肘”，不作推测性现代换算。
