base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/021.yaml
  text: The nave had a square doorframe[b][a], and the front of the sanctuary had the same appearance.
translation:
  language: zh_hans
  text: 殿堂的门框是方形的；圣所的正面也是同样的样式。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文末句直译近似“样式如同样式”，为省略性的重复表达，表示外观相同；所比较的具体对象未明，可能承接前述门框。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכָל
  choice: 殿堂
  rationale: 在以西结的圣殿异象中，此词指至圣所外面的主体厅室，而非整个圣殿建筑群。“殿堂”既自然庄重，也保留其建筑空间含义。
- source_word: מְזוּזַת
  choice: 门框
  rationale: 原词可指门柱或门框构件；因下文描述其整体形状为方形，译作“门框”在现代汉语建筑语境中更顺畅。
- source_word: רְבֻעָה
  choice: 方形的
  rationale: 该词表示四方或四角的形状，“方形的”准确而自然。
- source_word: וּפְנֵי
  choice: ……的前面
  rationale: פָּנִים本义为“面”，在此建筑语境中表示正面或前面；译作“前面”不额外限定是立面、入口或表面。
- source_word: הַקֹּדֶשׁ
  choice: 至圣所
  rationale: 结合本章第4节内室被称为“至圣所”以及此处殿堂与内侧圣所的对照，此处很可能指内殿；译作“至圣所”能清楚呈现空间关系，但原词本身也可较宽泛地指“圣所”，故加注说明。
- source_word: הַמַּרְאֶה כַּמַּרְאֶה
  choice: 也呈同样的样式
  rationale: 希伯来文直译近似“样式如同样式”，是省略且重复的表达。“也呈同样的样式”保留比较关系，同时符合现代汉语习惯。
theological_decisions:
- issue: הַקֹּדֶשׁ所指的圣所范围
  choice: 至圣所
  alternative: 圣所
  rationale: 上下文把殿堂与更内侧的神圣空间相对照，因此“至圣所”较可能；但词汇本身并非专门术语，脚注保留较宽泛的译法。
translation_notes:
  register: 采用现代、庄重而易懂的建筑用语。“殿堂”避免把הֵיכָל误解为整个圣殿；分号呈现两项建筑描述之间紧密但略显省略的关系。由于希伯来文末句所比较的具体对象没有明说，正文以“同样”保留其承接关系，并在脚注说明其省略性。
