  text: וַ/הֲשִׁמֹּתִי֙ אֶת פַּתְר֔וֹס וְ/נָתַ֥תִּי אֵ֖שׁ בְּ/צֹ֑עַן וְ/עָשִׂ֥יתִי שְׁפָטִ֖ים בְּ/נֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/014.yaml
  text: I will make Pathros desolate[a], and I will set fire in Zoan[c][b], and I will execute judgments on No.
translation:
  language: zh_hans
  text: 我要使巴忒罗荒凉[a]，我要在琐安燃起烈火[b]，并要在挪施行审判[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使巴忒罗成为荒场”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在琐安点燃烈火”。字面意思是“在琐安赐下火”。
    reason: lexical_alternative
  - marker: c
    text: “挪”是埃及的一座城市，又称“底比斯”。
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: 我要使……荒凉
  rationale: 该词是שׁמם的使役式，表示使一地成为荒凉；此译保留结果意味和审判宣告的庄重语气。
- source_word: פַּתְרוֹס
  choice: 巴忒罗
  rationale: 埃及地名Pathros，采用现代中文圣经语境中较易辨认的音译。
- source_word: וְנָתַתִּי אֵשׁ
  choice: 放火
  rationale: 字面为“赐下／放置火”，在此指使烈火临到并焚烧；“放火”自然简明，也保留直接施行毁灭的语气。
- source_word: בְּצֹעַן
  choice: 在琐安
  rationale: 介词ב在此自然表示火发生的地点；琐安为Zoan的常用中文音译。
- source_word: וְעָשִׂיתִי שְׁפָטִים
  choice: 施行审判
  rationale: 希伯来语“行审判”指实施惩罚性的司法行动；“施行审判”既符合现代中文表达，也保留司法与神学意味。
- source_word: בְּנֹא
  choice: 在挪
  rationale: 介词ב可表示审判发生之处；原文措辞允许理解为在该城施行审判，不必改写为较强的“攻击挪”。
theological_decisions:
- issue: 审判宣告中上帝行动的直接性
  choice: 三个第一人称动词均直译为说话者直接采取的行动：“我要使……”“放火”“施行审判”。
  alternative: 弱化为上帝仅容许灾祸发生。
  rationale: 希伯来文明确以上帝为这些审判行动的直接主语和施行者；译文不应把直接行动淡化为间接许可。
- issue: בְּנֹא中介词与审判对象的关系
  choice: 译为“在挪施行审判”。
  alternative: 译为“向挪施行审判”或“惩罚挪”。
  rationale: “在挪”紧贴介词ב的地点含义，并保留原文在地点与受审判对象之间的语义张力。
translation_notes:
  register: 采用现代、庄重而简洁的审判宣告语体。地名保留音译；句式维持原文三个并列第一人称行动的节奏。所有脚注标记均置于相应词句之后。
