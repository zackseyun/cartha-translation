  to: 我要使巴忒罗荒凉[a]，我要在琐安燃起烈火[b]，并要在挪施行审判[c]。
  rationale: 修订仅调整“放火”及其脚注，使中文避免“纵火”的不必要联想，并更准确反映“赐下火”这一希伯来语表达；增补“我要／并要”使三个并列的第一人称将来行动在中文中更清楚，未改变原文意义。
