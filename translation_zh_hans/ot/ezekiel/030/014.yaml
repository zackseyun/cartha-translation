    rationale: נתן的基本义为“给、赐下”，而非“放置”。应作“在琐安赐下火”，同时说明这是一种表达降下或引起毁灭性火灾的措辞。
  revised_text: 我要使巴忒罗荒凉[a]，我要在琐安燃起烈火[b]，并要在挪施行审判[c]。
