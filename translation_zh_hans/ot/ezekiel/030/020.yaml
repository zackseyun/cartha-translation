  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/שִׁבְעָ֣ה לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/020.yaml
  text: And it happened in the eleventh year, in the first month, on the seventh day of the month, that the word of Yahweh came to me, saying,
translation:
  language: zh_hans
  text: 第十一年正月初七，雅威的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这是承接上下文并引入带日期先知信息的叙事形式。现代汉语可直接以日期起句，无须生硬译作“事情发生了”。
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: 第十一年
  rationale: 希伯来语以基数词构成纪年表达，现代汉语自然译为序数“第十一年”。
- source_word: בָּרִאשׁוֹן
  choice: 正月
  rationale: 此处“第一”在纪年格式中指第一月；“正月”是现代汉语简明自然的表达。
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: 初七
  rationale: 原文意为“本月第七日”；与“正月”连用时，“初七”准确且符合汉语日期习惯。
- source_word: הָיָה דְבַר יְהוָה
  choice: 雅威的话临到
  rationale: 这是先知书常用的启示公式；“临到”既体现话语从神而来，也保留庄重的先知文体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按四字神名的读音作音译，保留其专名性质，不以称号替代。
- source_word: אֵלַי
  choice: 我
  rationale: 介词加第一人称单数后缀，在“临到我”中直接自然地表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下一节的直接话语；冒号符合现代汉语标点习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文明确使用四字神名。采用较贴近学界通常重构读音的“雅威”，以专名呈现，而不改译为“主”；同时不据此加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、简洁而庄重的先知书文体。保留“雅威的话临到我”这一公式化表达；日期依汉语习惯压缩为“第十一年正月初七”。本节在“说：”处保持开放，承接下一节内容。
