base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/017.yaml
  text: The young men of Aven and Pi-beseth will fall by the sword[b][a], and these cities will go into captivity.
translation:
  language: zh_hans
  text: 亚文[a]和比伯实[b]的青年必倒在刀下；这些城的人必被掳去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚文”很可能指安城，也就是埃及的希利奥波利斯。
    reason: alternative_reading
  - marker: b
    text: “比伯实”通常被认定为布巴斯提斯。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּח֥וּרֵי
  choice: 青年
  rationale: בַּחוּרִים通常指正值壮年的年轻男子；“青年”自然简洁，也符合战争审判的语境，同时不额外暗示他们是精锐或特选之人。
- source_word: אָ֛וֶן
  choice: 亚文
  rationale: 按希伯来语形式音译该地名；它很可能指埃及的安城，即希利奥波利斯，另在脚注说明。
- source_word: וּ/פִי בֶ֖סֶת
  choice: 和比伯实
  rationale: 按希伯来语形式音译地名，并在脚注保留其通常认定的历史名称布巴斯提斯。
- source_word: בַּ/חֶ֣רֶב
  choice: 倒在刀下
  rationale: 这是战争中被杀的惯用表达；与“倒下”连用，既保留原文意象，也符合现代汉语习惯。
- source_word: יִפֹּ֑לוּ
  choice: 必倒
  rationale: נפל的基本义是“倒下”，在战争语境中通常表示阵亡；译作“必倒”保留了原文意象和预告语气。
- source_word: וְ/הֵ֖נָּה
  choice: 这两座城
  rationale: 阴性复数代词回指刚提到的两个地名。汉语明确说“这两座城”，可避免误解为前面的青年，同时保留以城代居民的表达。
- source_word: בַּ/שְּׁבִ֥י
  choice: 被掳去
  rationale: 该词表示被俘、被掳的状态；结合הלך，汉语以“被掳去”自然表达进入被掳境地。
- source_word: תֵלַֽכְנָה
  choice: 去
  rationale: הלך本义为“去、行走”；在“被掳去”中仍保留其移动含义，同时清楚表达遭迁徙的结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“倒在刀下”的战争意象；将阴性复数代词明确为“这两座城”，但不进一步释为“居民”，以保留原文以城市代指其人口的修辞张力。
