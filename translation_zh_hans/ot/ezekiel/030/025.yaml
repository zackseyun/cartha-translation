source:
  edition: WLC
  text: וְ/הַחֲזַקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וּ/זְרֹע֥וֹת פַּרְעֹ֖ה תִּפֹּ֑לְנָה וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בְּ/תִתִּ֤/י חַרְבִּ/י֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/נָטָ֥ה אוֹתָ֖/הּ אֶל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/025.yaml
  text: I will strengthen the arms of the king of Babylon[a], but Pharaoh’s arms will fall. Then they will know that I am Yahweh[b], when I put my sword into the hand of the king of Babylon and he stretches it out against the land of Egypt.
translation:
  language: zh_hans
  text: 我必使巴比伦王的双臂强壮，法老的双臂却要倒下[a]。这样，他们就知道我是耶和华[b]；当我把我的刀交在巴比伦王手中，他就把它伸向埃及地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倒下”也可译作“衰败”。希伯来文直译为“双臂将落下”，描绘法老军事力量的崩溃。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”所对应的希伯来文是神的名字 YHWH。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲזַקְתִּי
  choice: 我必使……强壮
  rationale: 使役形表达耶和华赐予力量；与“双臂”的身体意象自然搭配，并保留军事能力得到增强的含义。
- source_word: זְרֹעוֹת
  choice: 双臂
  rationale: 保留希伯来文具体的身体意象；此处也喻指军事力量，并与法老双臂的垂落构成鲜明对照。
- source_word: וּזְרֹעוֹת פַּרְעֹה תִּפֹּלְנָה
  choice: 法老的双臂却要垂落
  rationale: 将连接词按上下文译为转折性的“却”；“垂落”既保留 נפל 的坠落意象，也能在现代汉语中表达无力和军事崩溃。
- source_word: וְיָדְעוּ
  choice: 这样，他们就知道
  rationale: 自然表达前述审判行动所带来的结果。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名 YHWH 的专名音译，不以称号替代。
- source_word: בְּתִתִּי חַרְבִּי בְּיַד מֶלֶךְ בָּבֶל
  choice: 因为我把我的刀交在巴比伦王手中
  rationale: 介词 ב 可在此引出使人认识耶和华的根据或情境；“交在……手中”保留神把自己的审判兵器授予巴比伦王的工具性意象。
- source_word: וְנָטָה אוֹתָהּ אֶל אֶרֶץ מִצְרָיִם
  choice: 他必挥刀攻击埃及地
  rationale: נטה 的基本意象是伸出、展开；在刀剑和敌对方向的语境中，“挥刀攻击”是自然中文，并清楚保留所指对象和军事行动。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文保留为专名；“耶和华”是现代普通中文读者最熟悉且可识别的形式，脚注说明其对应 YHWH。
- issue: 巴比伦在神审判中的施行者身份
  choice: 保留“我的刀”被交在巴比伦王手中的表述
  alternative: 概括为神借巴比伦惩罚埃及
  rationale: 原文同时陈明神的主权与巴比伦王的行动，不进一步解释或消解二者之间的神学张力。
- issue: בְּתִתִּי 的逻辑关系
  choice: 因为我把……交在……手中
  alternative: 当我把……交在……手中时
  rationale: 希伯来介词结构可表达时间或根据；正文采用较自然的因果表达，但不改变这一行动使列国认识耶和华的核心关系。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“双臂—双臂”和“我的刀—挥刀”维持原文连续的军事身体意象；句式适合普通读者朗读。
