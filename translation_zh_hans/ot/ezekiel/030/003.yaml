  text: כִּֽי קָר֣וֹב י֔וֹם וְ/קָר֥וֹב י֖וֹם לַֽ/יהוָ֑ה י֣וֹם עָנָ֔ן עֵ֥ת גּוֹיִ֖ם יִֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/003.yaml
  text: For the day is near[a], yes, the day of Yahweh is near; it will be a day of clouds[c][b], a time of nations.
translation:
  language: zh_hans
  text: 因为日子临近，雅威的日子也临近；那将是密云之日，是列国的时刻。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国的时刻”原文十分简短，也可理解为“关乎列国的时刻”；这里没有明说列国在这时刻将经历什么。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为哀号与宣告说明缘由；保留希伯来语的解释或因果连接作用。
- source_word: קָרוֹב
  choice: 临近
  rationale: 表达该日迫近的紧迫感，并在两次出现处保留原文的重复。
- source_word: יוֹם
  choice: 日子／日
  rationale: 前两处译作“日子”以合现代汉语，第三处在“密云之日”这一庄重结构中译作“日”；三次均保留原词的修辞性重复。
- source_word: לַיהוָה
  choice: 雅威的
  rationale: 此处的介词表示归属或关联，构成先知性表达“雅威的日子”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接呈现四字神名的通行现代音译，区别于作为称号的“主”。
- source_word: יוֹם עָנָן
  choice: 密云之日
  rationale: עָנָן为单数集合性名词，描绘阴暗、威严而不祥的云层；“密云之日”既贴近原文，又符合庄重的现代汉语。
- source_word: עֵת גּוֹיִם
  choice: 列国的时刻
  rationale: 保留原文简短而含混的属格式关系，不擅自限定为列国受审判、掌权或所得的期限。
- source_word: יִהְיֶה
  choice: 那将是
  rationale: 补出汉语所需的指代成分，指向前述临近的日子，并准确表达未然意义。
theological_decisions:
- issue: 先知性短语 יוֹם לַיהוָה 的译法
  choice: 雅威的日子
  alternative: 主的日子／归于雅威的日子
  rationale: 原文直接使用神名，并以介词表达该日与雅威的特殊关联；译文保留神名，也不进一步解释这一关联的具体性质。
- issue: עֵת גּוֹיִם 所指为何
  choice: 列国的时刻
  alternative: 列国受审判的时刻／给列国的时刻／列国的时期
  rationale: 希伯来语极为简练，只明确说这是与列国有关的时刻；正文不把可能隐含的审判意义明说，以保留原文的开放性和神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“临近”的重复再现原文的迫切节奏；“密云之日”保留先知文学的凝练意象；不将“列国的时刻”解释性扩写为审判，以免消除原文的含混。
