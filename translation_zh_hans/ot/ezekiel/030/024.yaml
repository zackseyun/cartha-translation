  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/חִזַּקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נָתַתִּ֥י אֶת חַרְבִּ֖/י בְּ/יָד֑/וֹ וְ/שָׁבַרְתִּי֙ אֶת זְרֹע֣וֹת פַּרְעֹ֔ה וְ/נָאַ֛ק נַאֲק֥וֹת חָלָ֖ל לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/024.yaml
  text: And I will strengthen the arms of the king of Babylon[a], and I will put my sword into his hand; but I will break the arms of Pharaoh, and he will groan before him with the groanings of a slain man.
translation:
  language: zh_hans
  text: 我必使巴比伦王的双臂强壮，把我的刀交在他手中；我却要折断法老的双臂，法老就必在他面前[a]发出被杀之人那样的呻吟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他面前”也可译作“在我面前”，即把末尾的代词理解为指耶和华，而不是巴比伦王。
    reason: alternative_reading
lexical_decisions:
- source_word: חִזַּקְתִּי
  choice: 我必使……强壮
  rationale: 连词连接的完成式在这一预言序列中表达将来的行动；“使……强壮”保留强化肢体、赋予军力的具体意象。
- source_word: זְרֹעוֹת
  choice: 双臂
  rationale: 原文为复数“臂膀”，既指身体部位，也象征军事力量；译作“双臂”可保留本节“使强壮”与“折断”的对应意象。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 按希伯来语属格结构自然翻译，不补入原文未出现的王名。
- source_word: נָתַתִּי אֶת חַרְבִּי בְּיָדוֹ
  choice: 把我的刀交在他手中
  rationale: 既保留“我的刀”和“在他手中”的形象，也以现代汉语自然表达耶和华将审判的兵器交给巴比伦王使用。
- source_word: שָׁבַרְתִּי
  choice: 我要折断
  rationale: 在预言语境中表达将来行动；“折断”准确延续上下文中法老断臂的主题。
- source_word: נָאַק נַאֲקוֹת
  choice: 发出……呻吟
  rationale: 原文以同源动词和名词加强语气。汉语不宜机械重复，译作“发出……呻吟”既自然，也保留痛苦呻吟的强烈意味。
- source_word: חָלָל
  choice: 被杀之人
  rationale: 该词通常指遭击杀、倒毙者；此处译作“被杀之人”比仅译“伤者”更贴近词义，同时与呻吟这一比喻性的描写相容。
- source_word: לְפָנָיו
  choice: 在他面前
  rationale: 就近承接巴比伦王，表现法老在征服者面前受辱；但代词也可能指耶和华，因此加注保存歧义。
theological_decisions:
- issue: לְפָנָיו中第三人称代词的指代
  choice: 正文理解为巴比伦王：法老在他面前呻吟
  alternative: 也可理解为耶和华：法老在我面前呻吟
  rationale: 最近的阳性单数先行词是巴比伦王，而且上下文着重描写耶和华借巴比伦王击败法老；不过希伯来语代词本身允许回指说话的耶和华，故以脚注保留这一真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“双臂”保留贯穿上下文的身体与军力双重意象；分号和“却”呈现巴比伦王得力与法老被折断之间的鲜明对照。
