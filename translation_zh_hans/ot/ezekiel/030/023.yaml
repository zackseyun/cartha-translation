  yaml_path: translation/ot/ezekiel/030/023.yaml
  text: And I will scatter Egypt among the nations[a], and I will disperse them among the lands.
translation:
  language: zh_hans
  text: 我要把埃及人分散到列国中，把他们驱散到各地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: 我要……分散
  rationale: פוץ 的使役式表示使之四散；“分散”在现代汉语中自然，也清楚保留上帝主动施行审判的含义。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 原文虽用国名“埃及”，下一分句却以阳性复数后缀“他们”回指，说明此处国名转指埃及民众。汉语译作“埃及人”可自然呈现这一所指。
- source_word: בַּגּוֹיִם
  choice: 到列国中
  rationale: גּוֹיִם 为“列国”；介词 ב 在散布语境中表达散布所及的范围，“到列国中”符合汉语表达。
- source_word: וְזֵרִיתִם
  choice: 把他们驱散
  rationale: זרה 可指扬散、撒散或驱散；此处与前句平行。“驱散”既保留动词变化，也显出强制性的审判行动。
- source_word: בָּאֲרָצוֹת
  choice: 到各地
  rationale: אֲרָצוֹת 是“地、国土”的复数；“各地”简洁自然地表达分散至不同地域，并与“列国中”形成平行而不机械重复。
theological_decisions:
- issue: 国名“埃及”与复数代词后缀之间的所指转换
  choice: 正文译作“埃及人”，并在下句以“他们”回指
  alternative: 保留“埃及”，译作“我要把埃及分散到列国中，把他们驱散到各地”，并用脚注解释国名代指人民
  rationale: 希伯来文的复数后缀明确指向组成埃及的民众。现代汉语若直接说“把埃及分散”容易被理解为国土被拆散，而不是人民流散；译明“埃及人”不改变审判对象，也避免不必要的歧义。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“列国”保留先知书常见的经文语域；“各地”则使后半句自然易懂。两个近义动词“分散／驱散”对应原文 פוץ／זרה 的平行变化。
