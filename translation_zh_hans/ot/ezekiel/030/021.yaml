base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/021.yaml
  text: Son of man[a], I have broken the arm of Pharaoh king of Egypt, and behold, it has not been bound up to apply remedies, to put on a bandage, to bind it, to strengthen it so that it may grasp the sword.
translation:
  language: zh_hans
  text: “人子啊，我已经折断了埃及王法老的臂膀。看哪，这臂膀还没有包扎，也没有为它敷药，或用绷带把它缠好，使它强壮得能握住剑。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中反复出现的先知称呼；保留希伯来语意象和全书用语的一致性。
- source_word: זְרוֹעַ
  choice: 臂膀
  rationale: 保留身体部位这一具体意象，同时在现代汉语中自然承载军事力量的隐喻。
- source_word: שָׁבָרְתִּי
  choice: 我已经折断了
  rationale: 完成式表示动作已经发生，其结果延续到当前未获医治的状态。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意的先知性话语标记及其鲜明语气。
- source_word: חֻבְּשָׁה
  choice: 还没有包扎
  rationale: 保留被动含义所描述的未处理状态；汉语按受事主语自然表达，无须机械使用被字句。
- source_word: לָתֵת רְפֻאוֹת
  choice: 敷药
  rationale: 复数名词 רְפֻאוֹת 在此指医治所用的药物或疗治措施；“敷药”切合断臂包扎的具体医疗语境。
- source_word: חִתּוּל
  choice: 绷带
  rationale: 指包裹伤处的布带；“绷带”是清楚、现代的医学用语。
- source_word: לְחָבְשָׁהּ
  choice: 包扎起来
  rationale: 表达用绷带裹扎伤处，与前面的名词“绷带”形成自然搭配，同时保留希伯来文重复的医疗动作。
- source_word: לְחָזְקָהּ
  choice: 使它复原有力
  rationale: 不仅表达增强，也体现治疗后恢复稳固、有力的目的。
- source_word: לִתְפֹּשׂ בֶּחָרֶב
  choice: 能够握住刀剑
  rationale: 保留“抓住、握住”的字面动作，以及恢复军事能力的隐喻；不扩展为较具解释性的“挥舞”。
theological_decisions:
- issue: 法老臂膀的含义
  choice: 保留“臂膀”的身体与军事隐喻
  alternative: 直接译作“势力”或“军力”
  rationale: 原文以断臂、敷药、包扎和握剑构成贯穿全句的意象；直译既保存修辞，也不替读者过早限定其政治军事所指。
translation_notes:
  register: 采用现代、庄重而易懂的先知文体。“人子”“看哪”保留《以西结书》的固定称呼和宣告语气；后半句适度调整汉语语序，使一连串医疗动作及其目的清楚连贯。
