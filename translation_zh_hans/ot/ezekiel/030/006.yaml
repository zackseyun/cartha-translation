  to: 耶和华如此说：扶持埃及的必倒下；她所夸耀的强盛必降下。从密夺到色弗尼，人[a]必在她境内倒在刀下。这是主耶和华的宣告。
  rationale: 只作两项安全的小修：以“必降下”更直接对应וְיָרַד，并将现有歧义脚注的锚点移至“人”后。其余译文保留原有的措辞、地名形式和审判语体。
