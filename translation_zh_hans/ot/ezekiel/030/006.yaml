  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה וְ/נָֽפְלוּ֙ סֹמְכֵ֣י מִצְרַ֔יִם וְ/יָרַ֖ד גְּא֣וֹן עֻזָּ֑/הּ מִ/מִּגְדֹּ֣ל סְוֵנֵ֗ה בַּ/חֶ֨רֶב֙ יִפְּלוּ בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/006.yaml
  text: 'Thus says Yahweh: The supporters of Egypt will fall[a], and the pride of her strength will come down. From Migdol to Syene they will fall by the sword within her[c][b], declares the Lord GOD.'
translation:
  language: zh_hans
  text: 耶和华如此说：扶持埃及的必倒下；她所夸耀的强盛必降下。从密夺到色弗尼，人[a]必在她境内倒在刀下。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”原文只用复数动词，未明说主语；也可理解为前文“扶持埃及的”。
    reason: 原文对末句复数动词的主语有所含混，脚注保留可能的承接关系。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信公式，并将神的专名 יְהוָה 译作“耶和华”。
- source_word: סֹמְכֵי מִצְרַיִם
  choice: 扶持埃及的
  rationale: 分词 סמך 表示扶持、支撑；不将其限缩为军事盟友。
- source_word: וְנָפְלוּ
  choice: 必倒下
  rationale: 在审判预言中以“必”表达确定的将来，同时保留“倒下”的意象。
- source_word: גְּאוֹן עֻזָּהּ
  choice: 她所夸耀的强盛
  rationale: גָּאוֹן 可指骄傲、威荣或所夸耀之物，עֹז 指力量、强盛；此译自然表达埃及因实力而自高的含义，又不把短语简化成单纯的“骄傲”。
- source_word: וְיָרַד
  choice: 必衰落
  rationale: 原文是不及物的“降下”；“衰落”在中文中自然呈现地位和威势降低，且不增添被动施事者。
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: 从密夺到色弗尼
  rationale: 按地名音译，并以“从……到……”表达埃及由北至南的地理范围。
- source_word: בַּחֶרֶב
  choice: 倒在刀下
  rationale: 符合希伯来语以刀剑表示战争杀戮的惯用法，也符合现代中文表达。
- source_word: יִפְּלוּ בָהּ
  choice: 人必在她境内倒下
  rationale: בָהּ 的阴性单数所指最自然是埃及；译作“她境内”保留国家的阴性指称，并避免中文“在她里面”的生硬。主语在原文中未明说，因此用泛指“人”而不武断限定为前句的扶持者。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: 保留先知宣告的确认公式，并区别于句首单独出现的神名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，保留这是神的名字，而非仅以头衔替代。
- issue: יִפְּלוּ 的隐含主语
  choice: 用泛指“人”，不明确限定所指
  alternative: 理解为前句“扶持埃及的”并译作“他们”
  rationale: 原文后一句只有复数动词，可能承接前句，也可能泛指从密夺到色弗尼境内的人；正文保留这种开放性。
- issue: 埃及的阴性代词 בָהּ
  choice: 她境内
  alternative: 其中；埃及境内
  rationale: 保留原文对埃及的阴性拟人指称，同时用“境内”使现代中文清楚自然。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两个预言分句以“必”呈现审判的确定性；地名保留音译。正文仅设一个确有必要的歧义脚注，标记已在相关句后出现。
