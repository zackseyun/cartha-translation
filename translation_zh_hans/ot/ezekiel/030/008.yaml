  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ/י אֵ֣שׁ בְּ/מִצְרַ֔יִם וְ/נִשְׁבְּר֖וּ כָּל עֹזְרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/008.yaml
  text: Then they will know that I am Yahweh[a], when I set fire to Egypt and all her helpers are broken.
translation:
  language: zh_hans
  text: “当我在埃及放火、她所有的帮助者[a]都被打垮时，他们就会知道我是雅威。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盟友”。希伯来文直译为“她所有的帮助者”，可能指支援埃及的国家或势力。
    reason: 说明“帮助者”的词义及“盟友”这一合乎上下文但较具体的替代译法。
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 他们就会知道
  rationale: 动词表示“知道、认识”；句首连接词在这里带出审判所产生的结果，译作“就”符合上下文语势。
- source_word: כִּי
  choice: （知道）我是
  rationale: כִּי引出“知道”的内容；现代汉语无需另译为“即/那就是”，直接组成“知道我是……”最自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其专名性质，而不以称号替代。
- source_word: בְּתִתִּי אֵשׁ בְּמִצְרַיִם
  choice: 当我在埃及燃起大火
  rationale: בְּ加不定词结构表示时间情境；介词בְּמִצְרַיִם按其位置意义译为“在埃及”，而不是解释性更强的“攻击埃及”。“燃起大火”自然表达字面的“放置火”。
- source_word: וְנִשְׁבְּרוּ
  choice: 都被打垮
  rationale: שׁבר的Nifal形式表示“被折断、被击碎”。用于埃及的支持者时，“被打垮”既保留毁败意象，也符合现代汉语。
- source_word: כָּל עֹזְרֶיהָ
  choice: 她所有的帮助者
  rationale: 直译为“她所有的帮助者”，保留这些对象究竟是盟国、军队还是其他支援势力的开放性；阴性代词所指为埃及。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的四字神名；采用较贴近通行学术重构读音的“雅威”，保留专名而不改译为“主”。
- issue: “帮助者”的具体身份
  choice: 保留宽泛的“帮助者”
  alternative: 盟友
  rationale: 原词本身只表示帮助、支援的一方；上下文可能指埃及的盟国或支援力量，但本节没有将其明确限定为正式盟友。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“当……时”统摄两个同时发生的审判行动，并将“就会知道”置于主句，清楚呈现时间与结果关系。脚注标记紧跟其实际解释的“帮助者”。
