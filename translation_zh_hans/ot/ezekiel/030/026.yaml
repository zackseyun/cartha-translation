  text: וַ/הֲפִצוֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצ֑וֹת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/026.yaml
  text: I will scatter Egypt among the nations[a], and I will disperse them through the lands. Then they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我必将埃及分散在列国中，把他们驱散到各地；他们就必知道我是雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文先说“埃及”，随后用复数“他们”指埃及人民。或译：“我必将他们分散在列国中，驱散到各地。”
    reason: 说明原文由集合性的国家名称转为复数代词的语法转换，并提供不改变意义的自然译法。
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: 我把……分散
  rationale: פוץ表示使人四散、分散；结合带第一人称后缀的不定式结构，译作“我把……分散……的时候”，自然表达本句的时间关系。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 原文形式是“埃及”，但随后用阳性复数代词“他们”回指，表明这里按集合意义指埃及人民；正文显明译为“埃及人”，脚注保留原文形式上的转换。
- source_word: בַּגּוֹיִם
  choice: 到列国之中
  rationale: גּוֹיִם通常指各国、列国；介词ב在分散语境中表示进入并处于列国之中。
- source_word: וְזֵרִיתִי
  choice: 把他们驱散
  rationale: זרה可指扬散、撒散或驱散；这里描述埃及人散居各地，以“驱散”既保留审判意味，也与前面的“分散”有所区别。
- source_word: בָּאֲרָצוֹת
  choice: 到各地
  rationale: אֲרָצוֹת直译为“诸地／各国土地”；“到各地”在现代汉语中自然地表达广泛地域性的离散。
- source_word: וְיָדְעוּ
  choice: 他们就会知道
  rationale: ו连接前述行动与随后的认识；“就”自然表达在这些事发生之后所得的结果，同时不把因果关系说得过强。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并清楚保留其专名性质。
- issue: 埃及与复数代词之间的转换
  choice: 正文译“埃及人……他们”，并用脚注说明原文形式
  alternative: 正文直译“埃及……他们”
  rationale: 原文由国家名称转用复数代词，按集合概念指其人民。正文采用自然汉语，同时以脚注保留这一真实的语法转换，避免把“他们”误解为别的对象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“列国”保留先知书的公共审判语域；“各地”避免过度古雅。句法依照希伯来文不定式结构处理为“……的时候……就……”，使时间与结果关系清楚。
