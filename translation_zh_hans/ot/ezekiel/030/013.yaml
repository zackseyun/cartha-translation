base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/013.yaml
  text: 'Thus says the Lord GOD: I will destroy the idols and put an end to the images from Noph[a], and there will no longer be a prince from the land of Egypt[b]; and I will put fear in the land of Egypt.'
translation:
  language: zh_hans
  text: '主耶和华如此说：


    “我必除灭偶像，


    使神像从挪弗[a]绝迹；


    埃及地不再有首领[b]。


    我必使恐惧临到埃及地。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “挪弗”是这座埃及城的希伯来名称；后来希腊语称为“孟菲斯”。
    reason: cross_reference
  - marker: b
    text: “首领”也可译作“统治者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 按希伯来文复合称谓直译；“主”表达 אֲדֹנָי，“耶和华”保留 יְהוָה 作为上帝专名的传统汉语形式。
- source_word: וְהַאֲבַדְתִּי גִלּוּלִים
  choice: 我必除灭偶像
  rationale: 使役形态表达彻底除去、毁灭；“除灭”既有审判力度，也符合庄重的现代汉语。גִלּוּלִים 本含贬斥意味，但译作“偶像”最清楚自然。
- source_word: וְהִשְׁבַּתִּי אֱלִילִים מִנֹּף
  choice: 使神像从挪弗绝迹
  rationale: וְהִשְׁבַּתִּי 表示“使停止、使不复存在”；“绝迹”自然地表达彻底止息。用“神像”与前面的“偶像”略作区分，同时保留 אֱלִילִים 所指虚假神祇之像的语境。
- source_word: מִנֹּף
  choice: 从挪弗
  rationale: 保留希伯来地名“挪弗”，并以脚注说明其即后来希腊语所称的孟斐斯。
- source_word: וְנָשִׂיא מֵאֶרֶץ מִצְרַיִם לֹא יִהְיֶה עוֹד
  choice: 埃及地不再有首领
  rationale: נָשִׂיא 可指首领、领袖或统治者；“首领”保留其较宽泛的政治含义，不把身份过度限定为君王或王子。
- source_word: וְנָתַתִּי יִרְאָה בְּאֶרֶץ מִצְרָיִם
  choice: 我必使恐惧临到埃及地
  rationale: 希伯来语直意为“把恐惧放在埃及地”；“使恐惧临到”在现代汉语中自然，并未将 יִרְאָה 过度强化为“惊骇”或“恐怖”。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文保留汉语圣经传统中广为人知的专名“耶和华”，同时明确呈现原文中的主权称谓与上帝专名，不以泛称“上帝”遮蔽该专名。
- issue: 埃及的 נָשִׂיא 身份是否应限定为君王
  choice: 首领
  alternative: 统治者；君王；王子
  rationale: 原词语义范围较宽，不能仅凭本节确定其正式头衔；因此正文保持宽泛，并以脚注提示另一种自然译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并按希伯来诗性预言的分句排行。正文保留“偶像／神像”两个近义词，以反映原文 גִלּוּלִים 与 אֱלִילִים 的用词变化；不额外加入“本国人”等原文未明说的限定。
