id: EZK.30.12
reference: Ezekiel 30:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י יְאֹרִים֙ חָֽרָבָ֔ה וּ/מָכַרְתִּ֥י אֶת הָ/אָ֖רֶץ בְּ/יַד רָעִ֑ים וַ/הֲשִׁמֹּתִ֞י אֶ֤רֶץ וּ/מְלֹאָ/הּ֙ בְּ/יַד זָרִ֔ים אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/012.yaml
  text: And I will make the Nile channels dry[a], and I will sell the land into the hand of evil men; and I will devastate the land and its fullness by the hand of foreigners. I am Yahweh[c][b]; I have spoken.
translation:
  language: zh_hans
  text: 我必使尼罗河的水道干涸[a]，又把这地卖给恶人[b]；我必借外族人的手使这地和其中的一切荒凉[c]。我，雅威，已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水道”也可译作“河流”或“渠道”；在埃及语境中，这个词很可能指尼罗河的各处水道。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“卖入恶人的手中”；“手”指权势或掌控。“卖”是审判的比喻，也可意译作“交给”。
    reason: lexical_alternative
  - marker: c
    text: “这地和其中的一切”直译为“这地和充满它的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְאֹרִים
  choice: 尼罗河的水道
  rationale: 在针对埃及的语境中，此复数名词指尼罗河水系，包括支流与渠道；译作“尼罗河的水道”既交代地域背景，也保留其复数范围。
- source_word: חָרָבָה
  choice: 干涸
  rationale: 与“使”构成结果表达，描述水道变干；“干涸”符合现代汉语对河渠断水的自然说法。
- source_word: וּמָכַרְתִּי
  choice: 把……卖在……手中
  rationale: 保留 מכר“卖”的字面审判意象，同时“在……手中”表达落入他人权势之下。
- source_word: בְּיַד רָעִים
  choice: 在恶人手中
  rationale: 既保留“手”这一权势惯用语，也不把 substantival masculine plural 过度具体化。
- source_word: וַהֲשִׁמֹּתִי
  choice: 使……荒凉
  rationale: 准确表达 שמם Hifil 的使役意义，并与先知书的审判语域相称。
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: 这地和其中的一切
  rationale: מְלֹאָהּ 字面为“充满它的”，在现代汉语中译作“其中的一切”清楚自然，也保留范围的概括性。
- source_word: בְּיַד זָרִים
  choice: 借外族人的手
  rationale: זָרִים 在这里指外来的侵略者；“借……的手”自然表达上帝以他们为施行审判的媒介。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确其为神的名字而非称号。
- source_word: דִּבַּרְתִּי
  choice: 已经说了
  rationale: 与“我耶和华”合成庄严的先知宣告公式，强调判语已经由神亲自发出，必然成立。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文用广为人知且自然的专名“耶和华”，避免以“主”这一称号替代神名；“雅威”是另一常见音译。
- issue: מכר 的审判意象
  choice: 卖在恶人手中
  alternative: 交在恶人手中
  rationale: 正文保留“卖”的强烈隐喻，不将其弱化为一般的交付；脚注说明其语境含义，以免被误解为普通商业交易。
- issue: 外族人在审判中的作用
  choice: 借外族人的手
  alternative: 由外族人使……荒凉
  rationale: 保留原文中上帝作为主语、外族人作为执行媒介的张力，不把最终施动者改成外族人。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。两次保留“手”的意象，但分别用“在……手中”和“借……的手”呈现受制与施行两个不同关系。结尾压缩为中文先知宣告惯用句“我耶和华已经说了”，避免生硬的“我是耶和华；我已经说了”。
