  text: וְ/נָשַׁ֕מּוּ בְּ/ת֖וֹךְ אֲרָצ֣וֹת נְשַׁמּ֑וֹת וְ/עָרָ֕י/ו בְּ/תוֹךְ עָרִ֥ים נַחֲרָב֖וֹת תִּֽהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/007.yaml
  text: They will be desolated among desolated lands[a], and its cities will be among ruined cities.
translation:
  language: zh_hans
  text: 他们必在荒凉的诸地中沦为荒凉[a]；埃及的城邑必在毁坏的城邑中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必在荒凉的诸地当中沦为荒凉；埃及的城邑必在毁坏的城邑当中。”
    reason: “בְּתוֹךְ”可较形式对应地译作“在……当中”；“אֲרָצוֹת”可指诸地或国家，未必专指政治意义上的列国。
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: 它必……变为荒凉
  rationale: 该词是שׁמם的尼法勒式，表达遭毁坏后陷入荒凉的状态。按上下文，复数形式所指仍是作为整体的埃及；汉语以单数“它”承接更自然，并保留结果状态。
- source_word: בְּתוֹךְ
  choice: 在……中／列在……中
  rationale: 表示处于一群对象之中。前半句直译为“在……中”，后半句用“列在……中”使现代汉语通顺，同时保留其置身同类之中的含义。
- source_word: אֲרָצוֹת נְשַׁמּוֹת
  choice: 荒凉的列国
  rationale: אֲרָצוֹת在此指诸地或诸国，不是土壤；נְשַׁמּוֹת描述其荒废状态。“荒凉”也保留了与前一动词同根的呼应。
- source_word: וְעָרָיו
  choice: 它的城邑
  rationale: 第三人称阳性单数后缀回指作为国家实体的埃及。用“它”符合现代汉语对国家的指称；“城邑”适合先知性宣告的庄重语域。
- source_word: עָרִים נַחֲרָבוֹת
  choice: 沦为废墟的城邑
  rationale: נַחֲרָבוֹת描述城市遭破坏、荒废的状态。“沦为废墟”清楚传达毁坏结果，并与前文“荒凉”避免机械重复。
- source_word: תִּהְיֶינָה
  choice: 必列在
  rationale: 这是היה的未完成式，在审判预言中表达将来的确定结果。汉语“必”体现宣告语气，“列在”自然连接城邑与其所在的一类废城。
