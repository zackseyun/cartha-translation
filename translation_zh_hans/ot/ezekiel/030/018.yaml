source:
  edition: WLC
  text: וּ/בִֽ/תְחַפְנְחֵס֙ חָשַׂ֣ךְ הַ/יּ֔וֹם בְּ/שִׁבְרִ/י שָׁם֙ אֶת מֹט֣וֹת מִצְרַ֔יִם וְ/נִשְׁבַּת בָּ֖/הּ גְּא֣וֹן עֻזָּ֑/הּ הִ֚יא עָנָ֣ן יְכַסֶּ֔/נָּה וּ/בְנוֹתֶ֖י/הָ בַּ/שְּׁבִ֥י תֵלַֽכְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/018.yaml
  text: And in Tahpanhes the day will grow dark when I break there the bars of Egypt[a], and the pride of her strength will cease in her. As for her, a cloud will cover her[b], and her daughters will go into captivity.
translation:
  language: zh_hans
  text: 在答比匿，白昼必昏暗；当我在那里折断埃及的轭杠[a]时，她力量所带来的骄傲必在其中止息。至于她，云必遮盖她；她的女儿们[b]必被掳去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “轭杠”也可译作“轭的横杠”或“杠”。这里的希伯来语比喻可能指支撑埃及权势的力量，也可能含有埃及辖制他人的意思。
    reason: lexical_alternative
  - marker: b
    text: 先知书常把一座城周围的附属城镇或居民点称为她的“女儿们”。
    reason: cultural_note
lexical_decisions:
- source_word: וּבִתְחַפְנְחֵס
  choice: 在答比匿
  rationale: 按现代中文圣经地名惯例音译；ב 表示地点，译作“在”。
- source_word: חָשַׂךְ הַיּוֹם
  choice: 白昼必昏暗
  rationale: חשׂך 在此表达日光转暗或白昼陷入黑暗的审判景象；“白昼必昏暗”自然凝练，也不额外说明成因。
- source_word: בְּשִׁבְרִי שָׁם
  choice: 那时，我要在那里折断
  rationale: 将介词 בְּ 与带第一人称后缀的不定式结构按时间关系译为“那时……”，并保留 שָׁם“在那里”的地点强调。
- source_word: מֹטוֹת מִצְרַיִם
  choice: 埃及的轭杠
  rationale: מֹטוֹת 可指杠、杆，尤其是轭上的横杠；“轭杠”保留具体物象及其可能蕴含的权势或辖制意味。
- source_word: וְנִשְׁבַּת בָּהּ
  choice: 必在她里面止息
  rationale: נשׁבת 为尼法勒式，表示停止、终止；不另加施动者，并保留地点性代词。
- source_word: גְּאוֹן עֻזָּהּ
  choice: 她强盛的骄傲
  rationale: 兼顾 גְּאוֹן 的“骄傲”与 עֹז 的“力量、强盛”，保留原文紧密而略带张力的名词关系。
- source_word: הִיא
  choice: 至于她
  rationale: 独立人称代词具有强调和转折聚焦作用；“至于她”在中文中显出这一语篇强调。
- source_word: עָנָן יְכַסֶּנָּה
  choice: 密云必遮盖她
  rationale: 保留“云遮盖”的审判意象；中文用“密云”体现遮蔽与昏暗，但不扩写为风暴。
- source_word: וּבְנוֹתֶיהָ
  choice: 她的女儿们
  rationale: 直译先知文学中的城市拟人隐喻；其所指可能是附属城镇，在脚注中说明。
- source_word: בַּשְּׁבִי תֵלַכְנָה
  choice: 都必被掳而去
  rationale: 原语字面为“走入被掳之中”；中文“被掳而去”自然表达遭俘并被迁走，同时保留移动意味。
theological_decisions:
- issue: 本节后半部分阴性单数代词的所指
  choice: 正文用“她”延续城市拟人，可首先指答比匿，同时不排除拟人化的埃及。
  alternative: 明确译成“答比匿”或“埃及”。
  rationale: 紧邻的地名及“她的女儿们”这一城市隐喻支持答比匿为近指，但整段审判对象是埃及；保留代词可避免过早消除这种指涉张力。
- issue: “女儿们”的具体含义
  choice: 正文保留拟人隐喻“她的女儿们”，脚注说明通常指附属城镇或周围居民点。
  alternative: 正文直接译作“她属下的城镇”。
  rationale: 直译保存先知文学的母城—女城意象，脚注则确保现代读者能够理解其常见地理政治含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“白昼必昏暗”“止息”“被掳而去”保持先知审判宣告的凝练语气；保留“至于她”的强调结构、阴性拟人和“女儿们”的原文意象，并用脚注帮助普通读者理解。
