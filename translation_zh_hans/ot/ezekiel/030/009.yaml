  text: בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֨וּ מַלְאָכִ֤ים מִ/לְּ/פָנַ/י֙ בַּ/צִּ֔ים לְ/הַחֲרִ֖יד אֶת כּ֣וּשׁ בֶּ֑טַח וְ/הָיְתָ֨ה חַלְחָלָ֤ה בָ/הֶם֙ בְּ/י֣וֹם מִצְרַ֔יִם כִּ֥י הִנֵּ֖ה בָּאָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/009.yaml
  text: On that day messengers will go out from before me in ships to terrify Cush[a], secure as she is, and trembling will come upon them on the day of Egypt, for behold[c][b], it is coming.
translation:
  language: zh_hans
  text: 那日，使者[a]要从我面前乘船出去，使安然无忧的古实[b]惊恐；埃及的日子一到[c]，他们就必战栗，因为看哪，这就要来到[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使者”也可译作“使臣”；这个希伯来词也能指“天使”，但这里更可能指乘船传报埃及败亡消息的人。
    reason: lexical_alternative
  - marker: b
    text: “古实”是希伯来地名，所指区域主要在古埃及南部，大致包括今天的苏丹北部；有些译本译作“埃塞俄比亚”。
    reason: cultural_note
  - marker: c
    text: 直译为“在埃及的日子”，指灾难或审判临到埃及的日子。
    reason: cultural_note
  - marker: d
    text: 原文没有明说所临到的究竟是“战栗”、灾祸，还是前述“埃及的日子”；阴性动词与阳性的“日子”也不直接一致，因此正文保留较开放的指代。
    reason: ambiguity
lexical_decisions:
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 该词可指一般的使者、使臣，也可指天使；本节处于列国受审判的语境，且使者乘船传出消息，最自然是指人间的报信者。“使者”保留了原词较宽的含义。
- source_word: מִלְּפָנַי
  choice: 从我面前
  rationale: 保留原文“从我面前”的临在意象，并明确延续上帝作为说话者的第一人称视角。
- source_word: בַּצִּים
  choice: 乘船
  rationale: 原词指船只；“乘船出去”是自然的现代汉语，也准确表达借船出行。
- source_word: לְהַחֲרִיד
  choice: 使……惊恐
  rationale: 使役形表达使人震惊、恐惧或战栗；“使……惊恐”既体现使役意义，也与下句的战栗相呼应。
- source_word: כּוּשׁ
  choice: 古实
  rationale: 采用希伯来地名的传统汉语音译，不直接以现代或古典地理名称“埃塞俄比亚”替代。
- source_word: בֶּטַח
  choice: 安然无忧
  rationale: 该词表达安全、安稳或自以为有保障的状态；此处修饰古实，突显其安稳将被惊恐打破的反差。
- source_word: חַלְחָלָה
  choice: 战栗
  rationale: 该名词兼有身体颤抖与内心痛苦、恐慌的意味；“战栗”简洁保留这两层力度。
- source_word: בָהֶם
  choice: 他们就必战栗
  rationale: 将“战栗必在他们里面/临到他们”自然转换为汉语主谓表达，不改变受影响者为古实人的含义。
- source_word: בְּיוֹם מִצְרַיִם
  choice: 埃及的日子一到
  rationale: 保留原文紧凑的“埃及的日子”措辞，同时以“一到”明确这是埃及遭遇灾难或审判的时刻。
- source_word: כִּי הִנֵּה בָּאָה
  choice: 因为看哪，这就要临到了
  rationale: “看哪”保留先知宣告的警示语气；“就要临到了”传达完成式在预言语境中的迫近与确定性，而“这”不强行限定其指代对象。
theological_decisions:
- issue: 审判宣告中说话者的身份与临在意象
  choice: 译作“从我面前”，保留上帝直接说话及使者由其面前出去的图景。
  alternative: 较宽泛地译作“从我这里”或“由我派出”。
  rationale: 希伯来文明确使用“面前”这一临在表达；保留它可呈现审判并非无主体的历史事件，而是从神的面前发出的行动，又不额外规定使者的超自然身份。
- issue: 末句阴性单数动词的指代
  choice: 用中性的“这”保留所临到之事的开放性。
  alternative: 明确译为“这日就要来到”或“这场灾祸就要临到”。
  rationale: 动词 בָאָה 为阴性单数，与阳性的“日子”并不直接一致，可能回指阴性的“战栗”，也可能指语境中隐含的灾祸；译文不把这一语法张力武断化解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“安然无忧”呈现古实原先自觉稳妥的状态；“惊恐—战栗”保留原文的语义呼应。句末使用“看哪”维持先知宣告的警醒语气，并以“这”保存原文指代上的含混。
