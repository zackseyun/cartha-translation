  text: וְ/עָשִׂ֥יתִי שְׁפָטִ֖ים בְּ/מִצְרָ֑יִם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/019.yaml
  text: Thus I will execute judgments on Egypt[a], and they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我要在埃及施行审判；他们就知道我是雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神名YHWH（יהוה）；传统中文译名为“耶和华”。
    reason: 说明神名的原文形式及传统中文译名。
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: 我要……施行
  rationale: עשה与复数宾语“审判”连用，意为执行、施行审判；前缀连接词在这里自然承接上文，无须机械译出“并且”。
- source_word: שְׁפָטִים
  choice: 审判
  rationale: 此处指上帝施行的惩罚性司法行动；“施行审判”既符合先知书语体，也保留原文的法律意象。
- source_word: בְּמִצְרָיִם
  choice: 在埃及
  rationale: 介词בְּ首先具有地点含义；结合上下文，表示审判在埃及境内施行，中文无需改译成“对埃及”。
- source_word: וְיָדְעוּ
  choice: 他们就知道
  rationale: 保留以西结书反复出现的认识公式；“就”自然表达前后结果关系，而“知道”保留ידע的启示与承认意味。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: כי引出所知道的内容；יהוה是上帝的专名YHWH，正文采用现代中文圣经读者熟悉的“耶和华”，脚注说明其形式及另一常见音译。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名YHWH。正文用普通中文读者较熟悉且庄重的“耶和华”，同时以脚注保留更接近学界重构发音的“雅威”，不把专名改写为称号“主”。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留以西结书典型的“他们就知道我是……”公式。原文段末符号פ表示一段结束，不进入正文。
