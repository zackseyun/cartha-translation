revisions:
- from: 他和跟随他的军民，就是列国中残暴的人，必被带来毁灭这地[a]。他们要拔刀攻击埃及，使遍地满是被杀的人。
  to: 他和随同他的民众，就是列国中残暴者，必被带来毁灭这地[a]。他们要拔刀攻击埃及，使这地满是被杀的人。
  rationale: 修订仅消除“军民”对“他的人民”的过度限定，并使土地的指涉前后一致；保留原文的被动语态、预言性将来意义、同位说明，以及对战事结果的庄重表达。
