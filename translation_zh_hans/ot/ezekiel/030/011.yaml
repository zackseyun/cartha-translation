review_pass:
  verdict: revise
  source_fidelity: “军民”将עַמּוֹ具体化为军人和百姓，既添加原文未明确的社会类别，也可能误导为包括非战斗平民。原文较稳妥地指“他的人民／随从者”，虽在语境中是征服者所带领的武装人众。修订为“随同他的民众”，保留群体性和“与他同在”的限定，不把它限定为军队或军民。其余主要语义均得当：מֽוּבָאִים的被动将来意义、毁坏土地、拔剑攻击埃及，以及使土地充满战死者，均得到保留。
  naturalness: “他和跟随他的军民”中的“跟随他的”略显生硬，且“军民”在现代汉语通常指军队与平民这一特定组合。改为“他和随同他的民众”更自然、庄重，也更贴近原文。将“使遍地满是被杀的人”改为“使这地满是被杀的人”，使两处הָאָרֶץ均明确指埃及国土，并避免“遍地”稍微泛化指涉范围。
  terminology: “列国中残暴的人”可准确表达עָרִיצֵי גוֹיִם，且不加入原文并未明示的最高级。为中文名词表达更简洁一致，正文和脚注采用“列国中残暴者”。“被杀的人”适切对应חָלָל，避免把原文直接收窄为“尸体”。
