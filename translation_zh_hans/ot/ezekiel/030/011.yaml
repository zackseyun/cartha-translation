  text: ה֠וּא וְ/עַמּ֤/וֹ אִתּ/וֹ֙ עָרִיצֵ֣י גוֹיִ֔ם מֽוּבָאִ֖ים לְ/שַׁחֵ֣ת הָ/אָ֑רֶץ וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל מִצְרַ֔יִם וּ/מָלְא֥וּ אֶת הָ/אָ֖רֶץ חָלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/011.yaml
  text: He and his people with him—the ruthless of the nations—will be brought in to destroy the land[a]. They will draw their swords against Egypt and fill the land with the slain.
translation:
  language: zh_hans
  text: 他和随同他的民众，就是列国中残暴者，必被带来毁灭这地[a]。他们要拔刀攻击埃及，使这地满是被杀的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列国中残暴者”也可译作“列国中的凶狠之徒”或“列国中可怕的人”。希伯来语强调这些入侵者残忍、令人畏惧的特性。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוֹ
  choice: 他的军民
  rationale: עַם本义为“人民”，在征战语境中也可指随同征服者的武装人众；译作“军民”既保留群体含义，也显明此处的军事语境，避免仅译“军队”而过度限定。
- source_word: עָרִיצֵי גוֹיִם
  choice: 列国中残暴的人
  rationale: עָרִיץ指残暴、凶狠或令人畏惧的人。该结构本身没有明确的最高级标记，因此不译作“最残暴的人”，以免增添原文未明说的程度。
- source_word: מוּבָאִים
  choice: 必被带来
  rationale: 这是בוא的使役被动分词，表达“被使之来到”；结合预言语境及后续动词，采用将来语气“必被带来”。
- source_word: לְשַׁחֵת
  choice: 毁灭
  rationale: שׁחת在此指对土地施行破坏、摧毁；“毁灭”直接而有力。
- source_word: הָאָרֶץ
  choice: 这地／遍地
  rationale: 上下文所指是埃及国土，而非全世界；首次译作“这地”，后一句按汉语自然表达译作“遍地”。
- source_word: וְהֵרִיקוּ חַרְבוֹתָם עַל
  choice: 他们要拔刀攻击
  rationale: ריק与“刀剑”连用，是拔剑出鞘、挥刀进攻的军事习语；“拔刀攻击”在现代汉语中清楚自然。
- source_word: מָלְאוּ אֶת־הָאָרֶץ חָלָל
  choice: 使遍地满是被杀的人
  rationale: חָלָל指战斗中遭杀戮者；“被杀的人”保留其人物指称及战场死亡含义，比“尸体”更庄重。
