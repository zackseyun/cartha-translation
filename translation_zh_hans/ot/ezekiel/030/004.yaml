  text: וּ/בָאָ֥ה חֶ֨רֶב֙ בְּ/מִצְרַ֔יִם וְ/הָיְתָ֤ה חַלְחָלָה֙ בְּ/כ֔וּשׁ בִּ/נְפֹ֥ל חָלָ֖ל בְּ/מִצְרָ֑יִם וְ/לָקְח֣וּ הֲמוֹנָ֔/הּ וְ/נֶהֶרְס֖וּ יְסוֹדֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/004.yaml
  text: And a sword will come against Egypt[a], and there will be anguish in Cush, when the slain fall in Egypt, and they take away her wealth[c][b], and her foundations are torn down.
translation:
  language: zh_hans
  text: 刀剑必临到埃及；被杀的人在埃及倒下时，古实[a]必陷入痛苦[b]。人必掳走埃及的财富[c]，她的根基也必被拆毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古实位于埃及以南，大致包括古代努比亚地区，不宜简单等同于现代国家埃塞俄比亚。
    reason: cultural_note
  - marker: b
    text: 或译：“必战栗。”原文一词可表示人在灾祸面前的颤抖、扭动或痛苦。
    reason: lexical_alternative
  - marker: c
    text: 或译：“众民”或“丰盛之物”。原文一词可指众多的人、丰富的物资或财富；这里按征服掳掠的语境译作“财富”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאָה חֶרֶב בְּמִצְרַיִם
  choice: 刀剑必临到埃及
  rationale: 先知性话语中的完成式在此指向将来的审判；保留“刀剑”这一战争、入侵的常用转喻。“临到”既符合介词的基本空间意义，也自然表达灾祸侵入埃及。
- source_word: וְהָיְתָה חַלְחָלָה
  choice: 必陷入痛苦
  rationale: חַלְחָלָה可指因灾难而战栗、扭动或痛苦；正文用“痛苦”兼顾身心煎熬，脚注保留“战栗”的可能。
- source_word: בְּכוּשׁ
  choice: 古实
  rationale: 采用圣经地名“古实”，避免用现代国家名“埃塞俄比亚”错误缩窄其古代地理范围。
- source_word: בִּנְפֹל חָלָל
  choice: 被杀的人……倒下时
  rationale: 将不定式结构译为时间从句；חָלָל在军事语境中通常指被杀者，保留“倒下”的鲜明图像。
- source_word: וְלָקְחוּ הֲמוֹנָהּ
  choice: 人必掳走埃及的财富
  rationale: 第三人称复数的施事者未明说，故用泛指“人”，不擅自补成特定敌军。הָמוֹן可指众民、丰盛或财富；征服与拆毁的语境支持“财富”，同时以脚注保留歧义。
- source_word: וְנֶהֶרְסוּ יְסוֹדֹתֶיהָ
  choice: 她的根基也必被拆毁
  rationale: 保留被动意义及“根基”的图像，使其既可指实际建筑基础，也可指埃及赖以维系的支柱；“她”对应希伯来文指向埃及的阴性代词。
