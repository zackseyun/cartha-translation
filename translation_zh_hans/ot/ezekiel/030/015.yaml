  text: וְ/שָׁפַכְתִּ֣י חֲמָתִ֔/י עַל סִ֖ין מָע֣וֹז מִצְרָ֑יִם וְ/הִכְרַתִּ֖י אֶת הֲמ֥וֹן נֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/015.yaml
  text: And I will pour out my wrath on Sin[a], the stronghold of Egypt[b], and I will cut off the multitude of No.
translation:
  language: zh_hans
  text: 我要把我的烈怒倾倒在欣[a]，埃及的堡垒上；我要剪除挪[b]的民众。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欣”通常被认为是培琉喜阿，即埃及东北边境的一座设防城市。
    reason: cross_reference
  - marker: b
    text: “挪”通常被认为是底比斯。
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: 我要……倾倒
  rationale: 保留שׁפך“倾倒”的先知性意象；在中文中把宾语“我的烈怒”置于动词前，使句子自然有力。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: חֵמָה指炽烈的愤怒；“烈怒”既传达强度，也符合庄重的审判语境。
- source_word: עַל
  choice: 在……之上
  rationale: 较直接地保留介词“在、临到……之上”的空间隐喻，避免提前解释为“攻击”。
- source_word: סִין
  choice: 欣
  rationale: 按希伯来语地名音译，不在正文中直接替换为通常的历史对应名称培琉喜阿。
- source_word: מָעוֹז מִצְרָיִם
  choice: 埃及的堡垒
  rationale: מָעוֹז在此指坚固据点或堡垒；以同位语说明欣在埃及的防御地位。
- source_word: וְהִכְרַתִּי
  choice: 我要剪除
  rationale: 保留כרת使役形“使断绝、剪除”的审判隐喻及行动的决绝性，不泛化为“毁灭”。
- source_word: אֶת הֲמוֹן
  choice: 民众
  rationale: הָמוֹן可指众多的人、群体、喧嚷或财富；此处“民众”贴合城市语境，同时不具体化为军队。
- source_word: נֹא
  choice: 挪
  rationale: 保留希伯来地名的音译；其通常与底比斯的对应关系置于脚注。
theological_decisions:
- issue: 如何呈现上帝直接施行审判的语言
  choice: 保留“我的烈怒”“倾倒”和“剪除”等直接、强烈的行动表述
  alternative: 弱化为“愤怒临到”或概括为“毁灭”
  rationale: 原文明确以第一人称描述上帝的审判行动；译文不淡化其力度，也不添加原文未说明的审判方式。
- issue: הֲמוֹן的语义范围
  choice: 译为“民众”
  alternative: 译为“众多的人”“财富”或“喧嚷”
  rationale: 在城市“挪”的语境中，人群义最为顺畅，但该词本身范围较宽；采用不带军事色彩的“民众”，避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“烈怒倾倒”保留原文鲜明意象；破折号标出“埃及的堡垒”与“欣”的同位关系。所有地名在正文按希伯来语音译，常见历史对应名称置于脚注。
