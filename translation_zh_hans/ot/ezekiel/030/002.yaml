id: EZK.30.2
reference: Ezekiel 30:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הֵילִ֖ילוּ הָ֥הּ לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/002.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Wail[b], “Alas for the day!”’'
translation:
  language: zh_hans
  text: “人子啊，你要说预言，说：‘主耶和华如此说：你们要哀号：“哀哉，这日！”’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: 人子
  rationale: 这是以西结书中上帝对先知惯用的称呼；保留希伯来语的固定表达及其在全书中的重复呼应。
- source_word: הִנָּבֵא
  choice: 说预言
  rationale: 该命令要求以西结传讲先知性信息；“说预言”在现代汉语中自然，也保留其先知职分语境。
- source_word: וְאָמַרְתָּ
  choice: 说
  rationale: 保留紧接前一命令的第二个吩咐，使原文“说预言并说”的双重结构清楚而不显累赘。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语体和可辨识形式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: “主”对应 אֲדֹנָי，“耶和华”在现代中文圣经传统中直接标示四字神名，避免译成重复的“主主”。
- source_word: הֵילִילוּ
  choice: 你们要哀号
  rationale: 复数命令式，指多人发出强烈的悲恸呼声；“哀号”比“哀叹”更能体现 ילל 的力度，也比直译为“嚎叫”更适合庄重的现代汉语。
- source_word: הָהּ
  choice: 哀哉
  rationale: 表达面对将临之日的悲痛或惊惧；“哀哉”简洁庄重，又不把它过度解释成正式的灾祸宣告。
- source_word: לַיּוֹם
  choice: 这日
  rationale: 与感叹词合译为“哀哉，这日”，保持原文简短而 ominous 的感叹；上下文指向临近的审判之日。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 原文同时有主权称号 אֲדֹנָי 与四字神名 יהוה。“主耶和华”分别保留二者，并符合广泛使用的中文圣经表达；不把神名泛化为普通称号。
- issue: הָהּ לַיּוֹם 是悲叹还是正式的灾祸公式
  choice: 哀哉，这日！
  alternative: 这日有祸了！；唉，这日啊！
  rationale: הָהּ 是悲痛或惊惧的感叹，未必等同于明确的“祸哉”宣告；采用“哀哉”保留其情感力度及一定语义张力，不额外断定公式性质。
translation_notes:
  register: 采用现代、庄重且可朗读的普通话书面语。保留“人子”“如此说”等以西结书的标志性先知表达；用“你们”明确 הֵילִילוּ 的复数命令形式。
