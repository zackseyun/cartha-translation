base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/022.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against Pharaoh king of Egypt, and I will break his arms, both the strong one and the broken one, and I will make the sword fall from his hand.'
translation:
  language: zh_hans
  text: 因此，主耶和华如此说：“看哪，我与埃及王法老为敌。我要折断他的双臂，就是那强壮的和那已经折断的，并使刀从他手中落下。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的审判宣告，清楚表达推论关系。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知传信公式的庄重语气；复合神名按现代中文圣经惯例译为“主耶和华”，既区分称号与专名，也避免不自然的重复。
- source_word: הִנְנִי אֶל
  choice: 看哪，我与……为敌
  rationale: “看哪”传达 הִנְנִי 的强调和庄严感；אֶל 在敌对语境中译为“与……为敌”。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老
  rationale: 以自然简洁的中文保留法老及其王号的同位关系。
- source_word: וְשָׁבַרְתִּי אֶת זְרֹעֹתָיו
  choice: 我要折断他的双臂
  rationale: 保留“手臂”这一军事力量的具体意象；下文两个阴性单数修饰语表明这里指两臂。
- source_word: אֶת הַחֲזָקָה וְאֶת הַנִּשְׁבָּרֶת
  choice: 就是那强壮的和那已经折断的
  rationale: 两个阴性单数形式回指“臂”；נִשְׁבָּרֶת 是被动分词，在上下文中自然表示其中一臂先前已经折断。
- source_word: וְהִפַּלְתִּי אֶת הַחֶרֶב מִיָּדוֹ
  choice: 并使刀从他手中落下
  rationale: 保留使役形式所表达的神主动施行审判，也保存武器脱手、力量尽失的生动图像。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是现代中文读者熟悉且庄重的神名形式；在 אֲדֹנָי יְהוִה 中译作“主耶和华”，可同时呈现称号与专名，而不把两者混同。
- issue: 法老双臂的意象
  choice: 保留为具体的“双臂”
  alternative: 解释为“两种力量”或“军事势力”
  rationale: 原文借手臂和刀描绘王权与军力的崩溃；直译意象能保存其诗性和神学张力，而不在正文中提前解释。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。“看哪”保留原文的强调色彩；“那强壮的和那已经折断的”让修饰语自然回指前面的“双臂”，无需另加脚注。
