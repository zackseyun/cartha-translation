base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/005.yaml
  text: Cush and Put and Lud and all the mixed people and Cub and the sons of the land of the covenant—with them they will fall by the sword[a][b][c].
translation:
  language: zh_hans
  text: 古实、弗、路德、所有混杂的人群[a]、古伯[b]和盟约之地的子民[c]，都必与他们一同倒在刀下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “混杂的人群”或译“全阿拉伯”“所有雇佣兵”或“所有混杂的群众”；希伯来语 עֶרֶב 在此的含义有争议。
    reason: lexical_alternative
  - marker: b
    text: “古伯”是一个罕见的地名，具体所指不明；也可音译为“库伯”。
    reason: lexical_alternative
  - marker: c
    text: 或译“盟约之地的人”。这个短语可能指凭条约结盟的人；也有人认为是指住在埃及的犹大人。
    reason: alternative_reading
lexical_decisions:
- source_word: כּוּשׁ
  choice: 古实
  rationale: 采用现代中文圣经读者较熟悉的希伯来地名音译，不以“埃塞俄比亚”替代，以免加入后世地理认定。
- source_word: פּוּט
  choice: 弗
  rationale: 按希伯来专名音译，并沿用中文圣经常见形式。
- source_word: לוּד
  choice: 路德
  rationale: 保留希伯来名称的音译，不直接认定为吕底亚或吕底亚人。
- source_word: כָל הָעֶרֶב
  choice: 所有混杂的民众
  rationale: עֶרֶב在此较可能指成分混杂的群体；译文保留其群体含义，同时在脚注列出“阿拉伯”等有争议的解释。
- source_word: כּוּב
  choice: 古伯
  rationale: 这是罕见且所指不明的地名，采用音译最少加入解释；异译“库伯”列于脚注。
- source_word: בְנֵי אֶרֶץ הַבְּרִית
  choice: 盟约之地的众子
  rationale: 较贴近原文“……之地的儿子们”，保留该短语究竟指当地居民、缔约者或其他群体的不确定性。
- source_word: אִתָּם
  choice: 与他们一同
  rationale: 直接表达关联或伴随关系，并在中文句法中自然连接前述名单与谓语。
- source_word: בַּחֶרֶב
  choice: 倒在刀下
  rationale: 与“倒下”组合为自然而庄重的中文战争意象，保留原文的刀剑图像。
- source_word: יִפֹּלוּ
  choice: 倒
  rationale: 保留נפל“倒下”的先知性表达；上下文清楚表明是战死，无须直译为“被杀”。
theological_decisions:
- issue: “盟约之地的众子”的身份
  choice: 主文采用形式贴近且不确定的“盟约之地的众子”
  alternative: 盟约之地的人民；因条约结盟的人；住在埃及的犹大人
  rationale: 原文没有明确其身份，不宜把某一种历史或神学解释写入主文。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。列举各族群时保留专名和原文的并列节奏；末句用“倒在刀下”自然再现“倒下”与“刀剑”的希伯来表达。
