lexical_decisions:
- source_word: וַיְהִי
  choice: 又临到
  rationale: 此处的叙事性连接形式引出先知接续领受的信息；汉语用“又……临到”自然承接上文，并与先知书常见宣告公式相合。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定先知用语中，“话”既保留原文的形式，又明确指特定的神圣启示。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不以头衔“主”替代。
- source_word: אֵלַי
  choice: 到我
  rationale: 与动词“临到”组合为自然现代汉语，准确表达信息朝向先知而来。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用于引出下一节神谕的具体内容，简洁保留希伯来语公式结构。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留神名而不改译为“主”；采用简体中文圣经传统中辨识度最高的“耶和华”，并以脚注说明原文形式及另一常见拟音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留先知书反复出现的宣告公式“耶和华的话又临到我，说”。脚注标记置于本节句末，避免割裂神名与谓语。
