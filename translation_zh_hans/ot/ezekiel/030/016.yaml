  yaml_path: translation/ot/ezekiel/030/016.yaml
  text: And I will set fire in Egypt[a]; Sin will writhe in anguish, and No will be broken open[d][c][b], and Noph will have enemies by day.
translation:
  language: zh_hans
  text: “我必使烈火在埃及燃起；训[a]必痛苦翻腾，挪[b]必被攻破，挪弗[c]白日必有仇敌[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “训”是埃及的一座城，通常被认为是培琉喜阿。
    reason: cross_reference
  - marker: b
    text: “挪”通常被认为是底比斯。
    reason: cross_reference
  - marker: c
    text: “挪弗”通常被认为是孟斐斯。
    reason: cross_reference
  - marker: d
    text: 或译：“挪弗白日必遭仇敌。”希伯来语这一短句十分简略，可能着重描写公开的或持续不断的攻击。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֵשׁ בְּמִצְרַיִם
  choice: 我必使烈火在埃及燃起
  rationale: נתן与“火”及地点连用，表示使火临到并燃起；译文保留“在埃及”的基本介词意义，并以自然的现代汉语表达其使动含义。
- source_word: חוּל תחיל
  choice: 必痛苦翻腾
  rationale: חול可描写因剧痛、恐惧或产痛而扭动、战栗；这里的同根形式加强语气。“痛苦翻腾”保留身体性和强烈痛楚的画面。
- source_word: סִין
  choice: 训
  rationale: 按希伯来语地名音译，并采用汉语圣经传统中通行的形式；与培琉喜阿的历史辨认置于脚注，不代入正文。
- source_word: וְנֹא
  choice: 挪
  rationale: 保留希伯来语地名的音译形式；其通常被认作底比斯，但历史辨认不取代源文名称。
- source_word: תִּהְיֶה לְהִבָּקֵעַ
  choice: 必被攻破
  rationale: בקע的Nifal形式表示被劈开、突破；用于城邑时，“被攻破”既自然，又保留防御被突破的具体含义。
- source_word: וְנֹף
  choice: 挪弗
  rationale: 采用希伯来地名的传统汉语音译；其与孟斐斯的通常对应关系放入脚注。
- source_word: צָרֵי יוֹמָם
  choice: 白日必遭仇敌
  rationale: צָרֵי取“仇敌、敌对者”之义，יוֹמָם为“白日、在白天”。原句极简，汉语补出“必遭”以成句，但不把攻击的方式或持续时间写死。
