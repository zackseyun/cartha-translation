base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/010.yaml
  text: 'Thus says the Lord GOD: I will put an end to the multitude of Egypt by the hand of Nebuchadnezzar king of Babylon[a][b].'
translation:
  language: zh_hans
  text: '主耶和华如此说：


    “我要借巴比伦王尼布甲尼撒的手[a]，使埃及的众民[b]止息。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“借……的手”，意思是“借着”或“通过”。
    reason: lexical_alternative
  - marker: b
    text: “众民”所译的希伯来词也可表示“群众、众多”或“丰盛”；这里可能泛指埃及庞大的民众或国力。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知宣告的固定引言；“如此说”既保留庄重语气，也符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי 的尊称“主”和四字神名 יְהוִה；这是简体中文圣经语境中清楚、庄重且广为人知的译法。
- source_word: וְהִשְׁבַּתִּי
  choice: 我要……使……止息
  rationale: 该词是 שׁבת 的使役形，表示“使停止、使不再继续”；此译保留使役意义，避免直接强化为原词未明说的“灭绝”。
- source_word: הֲמוֹן מִצְרַיִם
  choice: 埃及的众民
  rationale: הָמוֹן 可指众多的人、群众或丰盛之物；本节审判国家的语境及古代译本所反映的“众多”之义支持理解为埃及的大批民众，但以脚注保留词义范围。
- source_word: בְּיַד
  choice: 借……的手
  rationale: 保留希伯来语表示施行者或工具的常用比喻，同时在现代汉语中仍自然可懂。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文读者最熟悉的传统人名译法；希伯来文本此处的拼写差异不影响人物识别。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 自然表达该结构所指的王权与所属国。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的表达
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”既区分尊称与神名，也采用普通中文读者较熟悉的形式；“雅威”更接近一种常见的学术拟音，但并非希伯来文本明示的完整元音读法。
- issue: וְהִשְׁבַּתִּי 所描述审判的强度
  choice: 使……止息
  alternative: 除灭／使……灭绝
  rationale: 原文明确表达“使停止”，上下文虽含毁灭性审判，却不宜在正文中把动词的意义无提示地强化为“灭绝”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留先知宣告公式和“借……的手”这一可理解的希伯来意象；正文不把 הָמוֹן 的多义性完全消解，并以脚注说明其可能涵盖民众与国力。
