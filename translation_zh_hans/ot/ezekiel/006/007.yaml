  text: וְ/נָפַ֥ל חָלָ֖ל בְּ/תֽוֹכְ/כֶ֑ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/007.yaml
  text: The slain will fall in your midst[a], and you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 被杀的人必倒在你们中间；你们就会知道，我是雅威。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神圣名号YHWH，传统上也译作“耶和华”。
    reason: 说明神圣名号的原文形式及常见替代译法。
lexical_decisions:
- source_word: וְנָפַל
  choice: 必倒下
  rationale: 该动词为Qal完成式，在先知性审判宣告中表达将要发生的确定结果；“必倒下”兼顾未来指向、事件性和确定语气。
- source_word: חָלָל
  choice: 被杀的人
  rationale: 此名词在审判语境中指遭杀戮者，而非仅仅受伤的人；希伯来文单数可作集合性表达，汉语用“被杀的人”自然保留这一点。
- source_word: בְּתוֹכְכֶם
  choice: 在你们中间
  rationale: 直陈死者倒在听众群体当中，既准确又符合庄重的先知语体。
- source_word: וִידַעְתֶּם
  choice: 你们就会知道
  rationale: 这是《以西结书》常见的认识公式；“就”显明前述审判带来的结果，而没有加入原文以外的时间细节。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我是雅威
  rationale: כִּי在知觉动词之后引出所认识的内容；专名יְהוָה采用“雅威”，直接呈现神圣名号。
theological_decisions:
- issue: 神圣名号 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名YHWH。“雅威”较接近学界普遍接受的读音重构；脚注列出汉语读者熟悉的传统译名“耶和华”，不以“主”取代原文专名。
- issue: וִידַעְתֶּם 所表达的认识
  choice: 你们就会知道
  alternative: 你们就会承认
  rationale: 保留ידע的基本认知含义及审判所带来的确认意味，不将其限定为内心相信、敬拜或自愿认信。
translation_notes:
  register: 采用现代、庄重而清楚的先知宣告语体。“必倒下”体现审判的确定性；分号呈现审判事件与认识结果之间的紧密联系。脚注标记置于“雅威”之后，与注释内容准确对应。
