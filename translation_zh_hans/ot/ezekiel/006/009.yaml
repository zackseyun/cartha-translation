source:
  edition: WLC
  text: וְ/זָכְר֨וּ פְלִֽיטֵי/כֶ֜ם אוֹתִ֗/י בַּ/גּוֹיִם֮ אֲשֶׁ֣ר נִשְׁבּוּ שָׁם֒ אֲשֶׁ֨ר נִשְׁבַּ֜רְתִּי אֶת לִבָּ֣/ם הַ/זּוֹנֶ֗ה אֲשֶׁר סָר֙ מֵֽ/עָלַ֔/י וְ/אֵת֙ עֵֽינֵי/הֶ֔ם הַ/זֹּנ֕וֹת אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָקֹ֨טּוּ֙ בִּ/פְנֵי/הֶ֔ם אֶל הָֽ/רָעוֹת֙ אֲשֶׁ֣ר עָשׂ֔וּ לְ/כֹ֖ל תּוֹעֲבֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/009.yaml
  text: Then your survivors will remember me among the nations where they were taken captive[a], when I have broken their whoring heart that turned away from me, and their eyes that whored after their idols[c][b]; and they will loathe themselves for the evils they committed in all their abominations.
translation:
  language: zh_hans
  text: 那时，你们中逃脱的人，在他们被掳到的列国中必想起我；我折断了他们那背离我、行淫的心[a]，也折断了他们那随从自己的偶像[c]行淫的眼目[b]。他们必因自己在一切可憎之事上所行的恶而厌恶自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我因他们那背离我、行淫的心而伤痛。”有些解释者把这里的希伯来语动词理解为被动或反身用法，强调耶和华因他们不忠而忧伤。
    reason: alternative_reading
  - marker: b
    text: 原文以卖淫或行淫的意象——“行淫的心”和“行淫的眼目”——比喻对圣约不忠和敬拜偶像。
    reason: cultural_note
  - marker: c
    text: “偶像”所译的希伯来语是以西结常用的蔑称，带有污秽、可鄙的意味，也可译作“污秽的偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכְרוּ
  choice: 那时……必想起
  rationale: 连接词在这里承接审判后的结果；“那时”自然地表达叙事推进，而“想起”保留 זכר 的基本含义。
- source_word: פְלִיטֵיכֶם
  choice: 你们中逃脱的人
  rationale: 该词指从毁灭中逃脱、存留下来的人；这一译法在现代汉语中清楚自然，也保留“逃脱”的语义。
- source_word: בַּגּוֹיִם
  choice: 在……列国中
  rationale: 这里指被掳后所处的外邦各国；“列国”符合先知书语域，又不引入新约语境下“外邦人”的额外色彩。
- source_word: אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: 在他们被掳到的列国中
  rationale: נשבו 是 שבה 的尼法勒式，表示“被掳”；汉语将地点关系整合进句子，避免重复“那里”。
- source_word: אֲשֶׁר נִשְׁבַּרְתִּי אֶת־לִבָּם
  choice: 我折断了他们……的心
  rationale: 按马所拉读法，并结合直接宾语标记 אֶת，将上帝理解为施事者。中文“折断”保留原文强烈而具体的意象，不把它提前解释成“使他们悔改”。
- source_word: לִבָּם הַזּוֹנֶה
  choice: 他们……行淫的心
  rationale: זנה 以性不忠比喻对圣约的不忠和拜偶像；“行淫的心”保留原文令人不安的比喻力度，未淡化为一般的“不忠”。
- source_word: אֲשֶׁר סָר מֵעָלַי
  choice: 那背离我
  rationale: סר 表示转离、偏离；“背离我”自然表达关系和圣约层面的离弃。
- source_word: וְאֵת עֵינֵיהֶם הַזֹּנוֹת אַחֲרֵי גִּלּוּלֵיהֶם
  choice: 也折断了他们追随自己的偶像行淫的眼目
  rationale: 第二个 אֶת 与“心”并列，故补出“折断了”以使中文关系明确；同时保留“眼目行淫”的拟人化和淫乱意象。
- source_word: גִּלּוּלֵיהֶם
  choice: 自己的偶像
  rationale: “偶像”准确传达核心所指；该词在以西结书中带有强烈蔑称色彩，另用脚注说明，以免正文采用不自然或过度具体的译词。
- source_word: וְנָקֹטּוּ בִפְנֵיהֶם
  choice: 他们必……厌恶自己
  rationale: 该习语表达人在自己面前对自身产生憎恶、嫌恶；“厌恶自己”是简洁自然的现代汉语表达。
- source_word: אֶל הָרָעוֹת אֲשֶׁר עָשׂוּ לְכֹל תּוֹעֲבֹתֵיהֶם
  choice: 因自己在一切可憎之事上所行的恶
  rationale: “因”表达厌恶的缘由；“可憎之事”保留 תועבות 在圣约和偶像崇拜语境中的沉重道德色彩。
theological_decisions:
- issue: אֲשֶׁר נִשְׁבַּרְתִּי אֶת־לִבָּם 的施事者与含义
  choice: 正文采用“我折断了他们……的心”，以上帝为施事者。
  alternative: “我因他们那背离我、行淫的心而心碎”，把动词理解为被动或反身用法，强调耶和华因他们不忠而忧伤。
  rationale: 马所拉元音和其后的直接宾语标记 אֶת 较支持主动理解，也与流放、破碎、想起和自我厌恶的脉络相合。不过另一读法具有真实的语法与解释传统价值，因此不予抹去，而在脚注中保留。
- issue: 淫乱意象是否弱化
  choice: 保留“行淫的心”和“行淫的眼目”。
  alternative: 译作“不忠的心”和“贪恋偶像的眼目”。
  rationale: 原文刻意用 זנה 描绘圣约不忠；保留比喻才能呈现以西结书的修辞冲击力。脚注说明这是对拜偶像和圣约不忠的比喻，避免误解为仅指性行为。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“列国”“眼目”“可憎之事”维持先知书的庄严语域；句法作适度调整，使并列宾语及被掳地点在中文中清楚。正文保留“折断”和“行淫”的强烈意象，不以解释性措辞取代原文，也借脚注保存关键歧义。
