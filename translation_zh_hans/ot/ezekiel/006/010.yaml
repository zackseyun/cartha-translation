source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה לֹ֤א אֶל חִנָּם֙ דִּבַּ֔רְתִּי לַ/עֲשׂ֥וֹת לָ/הֶ֖ם הָ/רָעָ֥ה הַ/זֹּֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/010.yaml
  text: Then they will know that I am Yahweh[b][a]; I did not speak in vain when I said I would bring this disaster upon them.
translation:
  language: zh_hans
  text: 他们就会知道我是耶和华。我说要把这灾祸降在他们身上，并不是徒然的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不是徒然的”也可译作“不是无缘无故的”或“不是白说的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 他们就会知道
  rationale: 连词加完成式在先知性审判语境中表达结果和将来意义；“就会”自然呈现随审判而来的认识。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 保留以西结书反复出现的认识公式，并按项目惯例以“耶和华”呈现神名。
- source_word: לֹא אֶל חִנָּם דִּבַּרְתִּי
  choice: 我说……并不是徒然的
  rationale: “徒然”保留 חִנָּם 在此处所含的“不落空、并非空言”之意，同时不排除“并非无故”的可能含义。
- source_word: לַעֲשׂוֹת לָהֶם
  choice: 要把……降在他们身上
  rationale: 原文直译为“向他们施行”；结合宾语“这灾祸”，用“降在他们身上”符合现代汉语，并保留行动针对他们的含义。
- source_word: הָרָעָה הַזֹּאת
  choice: 这灾祸
  rationale: רָעָה 在这里指作为审判临到的灾难，而非道德意义上的邪恶；“灾祸”既清楚又保留严肃的审判色彩。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式，明确呈现神名，而不以“主”替代。
- issue: חִנָּם 在神发言语境中的含义
  choice: 不是徒然的
  alternative: 不是无缘无故的
  rationale: 此处可侧重神的话并非空言、必定实现，也可能包含“并非无故”的意味；正文采用最贴合言语效力的译法，并以脚注保存另一可能。
- issue: רָעָה 用于神的审判
  choice: 灾祸
  alternative: 祸患；灾难；恶事
  rationale: 上下文说的是神施行的惩罚性灾难，不是在断言神行道德之恶；“灾祸”避免误解，又不削弱审判的严厉。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我说要……”将 דִּבַּרְתִּי 与目的不定式连贯表达；句末脚注保留 חִנָּם 的真实词义张力。
