  text: הָ/רָח֞וֹק בַּ/דֶּ֣בֶר יָמ֗וּת וְ/הַ/קָּרוֹב֙ בַּ/חֶ֣רֶב יִפּ֔וֹל וְ/הַ/נִּשְׁאָר֙ וְ/הַ/נָּצ֔וּר בָּ/רָעָ֖ב יָמ֑וּת וְ/כִלֵּיתִ֥י חֲמָתִ֖/י בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/012.yaml
  text: The one far away will die by pestilence[a], and the one nearby will fall by the sword, and the one left and besieged will die by famine[b]; and I will spend my wrath on them.
translation:
  language: zh_hans
  text: 远处的人必死于瘟疫，近处的人必倒在刀下；剩下而被围困的人[a]，必死于饥荒。我要在他们身上发尽我的烈怒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“剩下而被关住的人”；这个希伯来词可指被围困、遭封锁的人，也有人理解为“被保全的”。这里下文提到饥荒，较支持“被围困的”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我要在他们身上耗尽我的烈怒”。希伯来语动词含有使烈怒达到尽头、将审判完全施行的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָחוֹק
  choice: 远处的
  rationale: 带定冠词的形容词作名词用，与“近处的”形成空间上的对照；中文简洁自然，并保留逐一指称的语气。
- source_word: בַּדֶּבֶר
  choice: 死于瘟疫
  rationale: דֶּבֶר常指作为审判灾祸的瘟疫；介词ב在此表示致死的原因或手段。
- source_word: הַקָּרוֹב
  choice: 近处的
  rationale: 与הָרָחוֹק平行，保留原文“远—近”的鲜明对照。
- source_word: בַּחֶרֶב יִפּוֹל
  choice: 倒在刀下
  rationale: 保留נפל“倒下”的战争意象；“倒在刀下”也是自然、庄重的现代汉语表达。
- source_word: הַנִּשְׁאָר
  choice: 剩下的
  rationale: 该被动分词指留下或剩余的人；避免用带有较强神学术语色彩的“余民”。
- source_word: הַנָּצוּר
  choice: 被围困的
  rationale: 在此审判与饥荒的语境中，理解为遭封锁、被围困最为贴切，同时以脚注保留词义上的另一种可能。
- source_word: בָּרָעָב
  choice: 死于饥荒
  rationale: 与“死于瘟疫”平行，表达饥荒是死亡的原因。
- source_word: וְכִלֵּיתִי חֲמָתִי בָּם
  choice: 我要向他们发尽我的烈怒
  rationale: כלה的Piel词形在这里表示使某事达到终点、彻底施行；“发尽”保留烈怒被完全施行的意味，而“烈怒”传达חֵמָה强烈、炽热的愤怒。
theological_decisions:
- issue: 如何表达上帝审判之怒被完全施行
  choice: 我要向他们发尽我的烈怒
  alternative: 我要在他们身上耗尽我的烈怒
  rationale: 原文强调审判达到尽头、充分执行；译文不弱化其严厉性，也不以“满足”等措辞加入原文未明说的神学解释。
- issue: הַנָּצוּר的语境含义
  choice: 被围困的
  alternative: 被留下、被保全的
  rationale: 与随后“死于饥荒”相连时，“被围困的”最符合围城导致饥荒的场景；但该词形存在被理解为受护卫或被保全者的可能，因此用脚注保存歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“远处的……近处的……”保留原文平行结构；分号划分三类死亡与总结性的神圣宣告。脚注标记均置于所说明的具体词语之后。
