  to: 那时，你们就会知道我是雅威：当他们被杀的人横陈在他们的偶像[a]中间、祭坛四周，在每一座高冈上、各处山顶上，在每一棵青翠的树下和每一棵枝叶茂密的笃耨香树[b]下——这些都是他们向自己的偶像献上馨香之气的地方。
  rationale: 修订仅消除重复且无明确原文依据的动作表达，并使“被杀的人”与其所在的全部地点保持同一修饰关系。“这些都是……的地方”明确回指前列各类地点，符合 מְקוֹם 的集合性用法。保留雅威专名、偶像一词的脚注贬义，以及“馨香之气”的祭祀反讽。
