source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּֽ/הְי֣וֹת חַלְלֵי/הֶ֗ם בְּ/תוֹךְ֙ גִּלּ֣וּלֵי/הֶ֔ם סְבִיב֖וֹת מִזְבְּחֽוֹתֵי/הֶ֑ם אֶל֩ כָּל גִּבְעָ֨ה רָמָ֜ה בְּ/כֹ֣ל רָאשֵׁ֣י הֶ/הָרִ֗ים וְ/תַ֨חַת כָּל עֵ֤ץ רַֽעֲנָן֙ וְ/תַ֨חַת֙ כָּל אֵלָ֣ה עֲבֻתָּ֔ה מְק֗וֹם אֲשֶׁ֤ר נָֽתְנוּ שָׁם֙ רֵ֣יחַ נִיחֹ֔חַ לְ/כֹ֖ל גִּלּוּלֵי/הֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/013.yaml
  text: Then you will know that I am Yahweh[a], when their slain lie among their idols, all around their altars, on every high hill, on all the mountaintops, and under every green tree and under every leafy terebinth—the places where they offered a pleasing aroma to all their idols.
translation:
  language: zh_hans
  text: 那时，你们就会知道我是雅威：当他们被杀的人横陈在他们的偶像[a]中间、祭坛四周，在每一座高冈上、各处山顶上，在每一棵青翠的树下和每一棵枝叶茂密的笃耨香树[b]下——这些都是他们向自己的偶像献上馨香之气的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来语带有强烈的鄙夷意味，也可直译为“粪偶像”或“污秽的偶像”。
    reason: 保留原词的贬斥性语气。
  - marker: b
    text: “笃耨香树”所译的希伯来语通常指一种枝叶繁茂的大树；具体树种不能完全确定，也常译作“橡树”。
    reason: 说明植物名称的词义与树种辨识存在不确定性。
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: 那时，你们就会知道
  rationale: 连词加完成式在先知审判语境中表达随审判实现而来的结果；“那时……就”自然传达这一后果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留原文所用的专名，而不以称号代替。
- source_word: בִּהְיוֹת חַלְלֵיהֶם
  choice: 他们被杀的人倒在……中间
  rationale: בִּהְיוֹת引出他们认识雅威时的情景；חַלְלֵיהֶם指遭暴力杀死的人。“倒在”补足汉语空间画面，但不改变原文判断。
- source_word: גִּלּוּלֵיהֶם
  choice: 自己的偶像
  rationale: 以现代汉语通行词“偶像”确保可读性，同时用脚注保存该希伯来词强烈鄙夷、污秽化的语气。
- source_word: סְבִיבוֹת מִזְבְּחוֹתֵיהֶם
  choice: 横陈在祭坛四周
  rationale: “四周”表达环绕祭坛的方位；“横陈”使被杀者遍布祭坛周围的审判图景在汉语中清楚自然。
- source_word: אֶל כָּל גִּבְעָה רָמָה בְּכֹל רָאשֵׁי הֶהָרִים
  choice: 在每一座高冈上、各处山顶上
  rationale: 按该串列中的地点用法处理介词；“山顶”自然表达希伯来语“山的头”。
- source_word: תַחַת כָּל עֵץ רַעֲנָן
  choice: 在每一棵青翠的树下
  rationale: 保留先知书中常见的祭祀地点意象，并以“青翠”表达树木鲜绿繁盛。
- source_word: תַחַת כָּל אֵלָה עֲבֻתָּה
  choice: 每一棵枝叶茂密的笃耨香树下
  rationale: אֵלָה较可能指笃耨香树，עֲבֻתָּה描写其枝叶浓密；脚注提示树种译名存在传统差异。
- source_word: מְקוֹם אֲשֶׁר
  choice: 就是……的地方
  rationale: 单数“地方”可集合性地回指前述各类地点；破折号与“就是”使汉语回指关系清晰。
- source_word: רֵיחַ נִיחֹחַ
  choice: 馨香之气
  rationale: 保留祭祀术语及其在此处用于偶像崇拜所产生的尖锐反讽，不把它解释性改写为单纯的香气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，正文采用现代汉语音译“雅威”，避免以称号“主”遮蔽专名。
- issue: גִּלּוּלִים 的贬斥意味
  choice: 正文译“偶像”，脚注说明其强烈鄙夷色彩
  alternative: 粪偶像；污秽偶像
  rationale: 直译成“粪偶像”虽能显出词源联想，却在现代汉语正文中生硬且可能过度锁定词源；脚注兼顾可读性与修辞力度。
- issue: 向偶像献上 רֵיחַ נִיחֹחַ 的神学张力
  choice: 保留“馨香之气”
  alternative: 焚香；香气
  rationale: 该表达通常带有祭物蒙悦纳的意味，而本节把它用于偶像，形成有意的反讽和控诉；不在翻译中消解这种张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“横陈”略带书面色彩，用来凝练呈现被杀者遍布祭坛周围的场面；其余措辞尽量直白。“馨香之气”保留圣经祭祀语汇在此处的反讽张力。
