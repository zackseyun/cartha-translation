id: EZK.6.3
reference: Ezekiel 6:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים ו/ל/גאית הִנְ/נִ֨י אֲנִ֜י מֵבִ֤יא עֲלֵי/כֶם֙ חֶ֔רֶב וְ/אִבַּדְתִּ֖י בָּמֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/003.yaml
  text: 'and say[a], ‘Mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys: Behold, I myself am bringing a sword upon you[b], and I will destroy your high places.’'
translation:
  language: zh_hans
  text: 你要说：‘以色列的众山哪，要听主耶和华的话。主耶和华对山岭、冈陵、沟壑[a]和谷地如此说：看哪，我必亲自使刀剑临到你们，并要毁灭你们的丘坛[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沟壑”也可译作“水道”或“溪谷”。
    reason: lexical_alternative
  - marker: b
    text: “丘坛”指设在高处的祭祀场所；在先知的斥责中，这类场所常与不合正道的敬拜或偶像崇拜有关。
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: 以色列的众山
  rationale: 这是对以色列山地的拟人化直接呼告；“众山”自然体现复数。
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 保留复数命令语气和先知宣告中郑重的召唤。
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: 主耶和华的话
  rationale: “话”对应单数 דְּבַר；“主耶和华”既表达 אֲדֹנָי，也以中文圣经语域中可辨识的形式呈现神名。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知使者公式的庄重和简洁。
- source_word: לֶהָרִים וְלַגְּבָעוֹת
  choice: 对山岭、冈陵
  rationale: 区分较大的山地与较低的丘陵，同时保持地貌列举的节奏。
- source_word: לָאֲפִיקִים
  choice: 沟壑
  rationale: 该词可指水道、溪谷或沟壑；此处处于地貌清单中，“沟壑”自然且不预设常年有水。
- source_word: וְלַגֵּאָיוֹת
  choice: 和谷地
  rationale: 采用宽泛自然的地形用语，并与“沟壑”有所区分。
- source_word: הִנְנִי אֲנִי
  choice: 看哪，我必亲自
  rationale: “看哪”保留提示语气，“亲自”自然传达重复第一人称所形成的强调。
- source_word: מֵבִיא עֲלֵיכֶם חֶרֶב
  choice: 使刀剑临到你们
  rationale: 表达即将施行的战争审判；“刀剑”在现代中文圣经语域中可兼指战争杀戮。
- source_word: וְאִבַּדְתִּי בָּמוֹתֵיכֶם
  choice: 并要毁灭你们的丘坛
  rationale: “丘坛”简洁保留 בָּמוֹת 的祭祀场所含义，不在正文中额外解释其合法性。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是现代汉语读者广泛辨识的神名形式，与“主”并列时也避免译成“主主”；不以普通称号取代专名。
- issue: בָּמוֹת 的宗教性质
  choice: 丘坛
  alternative: 邱坛上的神庙／高处祭坛
  rationale: 正文采用传统而准确的宗教术语，脚注说明其为设于高处的祭祀场所，并指出先知语境中常与不合正道或偶像崇拜相关，但不将每一处丘坛一概定性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留先知宣告公式、拟人化呼告及“我必亲自”的强调；地貌词力求彼此区分。所有脚注标记均置于其所解释的词语之后。
