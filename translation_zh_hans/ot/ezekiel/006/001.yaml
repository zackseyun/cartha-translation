  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事形式引出先知领受启示的惯用语。中文将其与“话”合译为“话临到”，既自然，也保留先知书的固定表达；本节开头不必机械译出“于是”。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一先知性公式中，“话”准确保留原文的正式表达，比解释性的“信息”更贴近原文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用四字神名。在现代简体中文圣经语境中，“耶和华”是普通读者最熟悉且可直接识别的专名译法。
- source_word: אֵלַי
  choice: 我
  rationale: 原文表示话语临到先知本人；中文“临到我”自然、准确地表达方向及第一人称单数。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节的直接话语。译作“说”保留原文结构，并自然承接后文。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用以色列之神的专名，而非称号。正文采用现代中文圣经传统中最广为人知的“耶和华”；“雅威”更接近学术界常见的拟音，但对普通中文读者较不熟悉。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语，并保留先知书惯用公式“耶和华的话临到我，说”。本节无需脚注。
