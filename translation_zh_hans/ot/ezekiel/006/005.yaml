source:
  edition: WLC
  text: וְ/נָתַתִּ֗י אֶת פִּגְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/זֵרִיתִי֙ אֶת עַצְמ֣וֹתֵי/כֶ֔ם סְבִיב֖וֹת מִזְבְּחוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/005.yaml
  text: And I will place the corpses of the sons of Israel before their idols[a], and I will scatter your bones around your altars.
translation:
  language: zh_hans
  text: 我要把以色列人的尸体放在他们的偶像[a]面前，把你们的骸骨撒在你们祭坛的四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来语是以西结惯用的蔑称，带有鄙夷色彩，也可理解为“污秽的偶像”，甚至“粪偶像”。
    reason: 说明原词的贬义色彩及词义选项。
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要把……放在
  rationale: נתן含义宽泛，可指“给、放、安置”；本句以尸体为宾语，并接“在……面前”，译作“把……放在”自然且具体。
- source_word: פִּגְרֵי
  choice: 尸体
  rationale: פגר指尸体或尸骸；此处明确指人，译作“尸体”准确，并保留审判场景的骇人力度。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在此是约定俗成的民族称谓；现代汉语用“以色列人”最自然，也不误导为仅指男性。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: לִפְנֵי表示“在……前面”；此译保留尸体被置于偶像前的具体画面及其反讽意味。
- source_word: גִּלּוּלֵיהֶם
  choice: 他们的偶像
  rationale: גִּלּוּלִים是以西结惯用的贬称，所指为偶像；正文用通顺明确的“偶像”，其鄙夷色彩在脚注说明。
- source_word: וְזֵרִיתִי
  choice: 把……撒在
  rationale: זרה可指扬散、撒散；以骸骨为宾语时，“撒在……四周”具体自然。
- source_word: עַצְמוֹתֵיכֶם
  choice: 你们的骸骨
  rationale: עֶצֶם意为骨头；在尸体与审判语境中，“骸骨”既准确又符合庄重书面语，并保留第二人称复数。
- source_word: סְבִיבוֹת
  choice: 四周
  rationale: 该词表示周围、环绕之处；与“撒在……祭坛的四周”搭配自然。
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: 你们的祭坛
  rationale: מִזְבֵּחַ意为祭坛；保留第二人称复数所属关系，表明这些祭坛属于受责备者并与其非法敬拜有关。
theological_decisions:
- issue: 如何处理בְּנֵי יִשְׂרָאֵל这一盟约民族称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 原文形式虽为“以色列的众子”，此处却是全民族的固定称谓。译为“以色列人”既保存所指，也避免现代读者误以为审判只涉及男性。
- issue: 如何呈现以西结对偶像的贬称גִּלּוּלִים
  choice: 正文译“偶像”，脚注交代鄙夷色彩
  alternative: 污秽的偶像／粪偶像
  rationale: 该词确有强烈蔑称色彩，但其具体词源意象及力度存在讨论。正文明确译出所指，脚注保留可能的污秽乃至粪秽意味，可避免把一种词源解释强行定入正文。
translation_notes:
  register: 采用现代、庄重而直接的普通话。用“尸体”保留原文的严酷，用“骸骨”避免重复且符合审判语境；前半句第三人称“以色列人”与后半句第二人称“你们”的人称转换按原文保留。
