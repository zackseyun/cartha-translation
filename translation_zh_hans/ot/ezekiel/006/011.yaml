  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַכֵּ֨ה בְ/כַפְּ/ךָ֜ וּ/רְקַ֤ע בְּ/רַגְלְ/ךָ֙ וֶֽ/אֱמָר אָ֔ח אֶ֛ל כָּל תּוֹעֲב֥וֹת רָע֖וֹת בֵּ֣ית יִשְׂרָאֵ֑ל אֲשֶׁ֗ר בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר יִפֹּֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/011.yaml
  text: 'Thus says the Lord GOD: Strike your hand and stamp your foot[a], and say, “Alas!” because of all the evil abominations of the house of Israel, who will fall by the sword, by famine[c][b], and by pestilence.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“你要拍手[a]跺脚，并说：‘哀哉！’要为以色列家一切邪恶可憎的事哀叹[b]；以色列家的人必倒在刀剑、饥荒和瘟疫之下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拍手”也可译作“用手击打”；希伯来语指以手掌作出有力的强调动作。
    reason: lexical_alternative
  - marker: b
    text: “要为……哀叹”也可译作“要针对……”或“因……而哀叹”。原文介词可表示感叹所针对的对象或引起感叹的原因。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留“主”这一称号与神圣名字的复合结构；“耶和华”是现代中文圣经语体中对四字神名的通行音译。
- source_word: הַכֵּה בְכַפְּךָ
  choice: 拍手
  rationale: 该短语描写以手掌击打的强调性动作；中文“拍手”自然简洁，同时以脚注保留“用手击打”的较直译可能。
- source_word: וּרְקַע בְרַגְלְךָ
  choice: 跺脚
  rationale: רקע在此指以脚顿地的强烈姿态；“跺脚”符合现代汉语并保留动作力度。
- source_word: וֶאֱמָר אָח
  choice: 说：‘哀哉！’
  rationale: אָח在此处结合将临的审判，主要表达悲叹，而非幸灾乐祸；“哀哉”兼具庄重和先知文体色彩。
- source_word: אֶל כָּל תּוֹעֲבוֹת רָעוֹת
  choice: 这是因……一切邪恶可憎之事
  rationale: אֶל接在感叹之后可指出悲叹所针对或由之引起的对象；“这是因”清楚表达原因，同时脚注保留“针对/论到”的句法可能。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留原文的群体及盟约性称谓，不简化为“以色列”。
- source_word: אֲשֶׁר ... יִפֹּלוּ
  choice: 他们必倒在……之下
  rationale: 将关系从句自然转为中文分句，并以“他们”回指“以色列家”；“必”传达未完成式在预告语境中的确定将来意味。
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: 倒在刀剑、饥荒和瘟疫之下
  rationale: 保留先知书常见的三重审判用语；“刀剑、饥荒、瘟疫”准确且为现代读者熟悉。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文明确使用四字神名。正文采用中文圣经传统中广为人知的“耶和华”，既区分称号“主”，也不把神名化约为普通头衔；“雅威”更接近常见学术重构读音，但在普通中文读者中通行度较低。
- issue: 先知动作与感叹的情感指向
  choice: 以“哀哉”表达面对审判的悲叹
  alternative: 以“啊”保留较宽泛的感叹，或理解为谴责性的喝彩
  rationale: 上下文指向以色列因可憎之事遭受刀剑、饥荒和瘟疫，悲叹最契合语境；但动作本身也可带谴责意味，因此不在正文额外说明情绪主体或将其限定为同情。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主耶和华如此说”保留先知宣告公式；“拍手跺脚”使动作鲜明，“哀哉”维持经文的肃穆感。正文避免生硬复制希伯来语关系从句，改用清楚的中文分句，同时通过脚注保存介词和动作表达的真实歧义。
