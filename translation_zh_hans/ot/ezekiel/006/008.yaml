base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/008.yaml
  text: Yet I will leave a remnant[a], when some of you become escapees from the sword among the nations, when you are scattered through the lands.
translation:
  language: zh_hans
  text: 然而，我要留下余民[a]：当你们分散在各地时，在列国中将有逃过刀剑的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必留下幸存者。”原文动词意为“留下、使存留”；后文说明这些人为在列国中逃过刀剑的人。
    reason: 词汇替代与句法关系说明
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: 然而，我要留下余民
  rationale: יתר的使役形表示“留下、使存留”。前文宣告毁灭，此处转入仍有人存留的结果；“然而”体现语境中的转折，“留下余民”则以自然、庄重的现代汉语表达，但不扩展其神学含义。
- source_word: בִּהְיוֹת לָכֶם
  choice: 你们中间会有人
  rationale: 字面为“为你们有”，是表示存在或领属的结构。译作“你们中间会有人”自然地表达被称呼群体中仍有一些人存留。
- source_word: פְּלִיטֵי חֶרֶב
  choice: 逃过刀剑
  rationale: פְּלִיטֵי指逃脱者或幸存者；与“刀剑”连用，指从战争杀戮中逃脱的人。“逃过刀剑”既保留动态意象，也符合现代汉语习惯。
- source_word: בַּגּוֹיִם
  choice: 到列国
  rationale: גּוֹיִם在此指以色列人被驱散所到的外邦各民族或国家。“列国”是庄重而通行的圣经语体表达。
- source_word: בְּהִזָּרוֹתֵיכֶם
  choice: 你们分散……时
  rationale: זרה意为“扬散、驱散”。带第二人称复数后缀的不定式结构在此构成时间背景；汉语采用“……时”，并不在本分句中额外明定施动者。
- source_word: בָּאֲרָצוֹת
  choice: 散居各地
  rationale: 复数אֲרָצוֹת指多个地域或邦国。“各地”避免赋予现代民族国家的过强色彩，“散居”自然表达分布于这些地方的状态。
theological_decisions:
- issue: 审判宣告中的余民观念
  choice: 然而，我要留下余民
  alternative: 但我要留下几个幸存者
  rationale: 经文在严厉审判中保留了存留者这一张力。“余民”准确概括“被留下的人”，但译文不进一步说明他们的属灵身份或终局，以免加入经文本身未明说的教义。
- issue: 逃脱者与存留者的关系
  choice: 以分号连接“留下余民”与“有人逃过刀剑”
  alternative: 把两者合并为“我要留下几个逃过刀剑的人”
  rationale: 希伯来文先说“我要留下”，随后以时间／存在结构说明有人逃过刀剑。分开表达既显示二者紧密相关，又保留原文句法略显悬置的特点，不把解释完全等同于语法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”“余民”保留圣经语体，但句法调整为自然汉语；分号用于保持原文两部分之间既承接又未完全合并的关系。
