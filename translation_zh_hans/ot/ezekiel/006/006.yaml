source:
  edition: WLC
  text: בְּ/כֹל֙ מוֹשְׁב֣וֹתֵי/כֶ֔ם הֶ/עָרִ֣ים תֶּחֱרַ֔בְנָה וְ/הַ/בָּמ֖וֹת תִּישָׁ֑מְנָה לְמַעַן֩ יֶחֶרְב֨וּ וְ/יֶאְשְׁמ֜וּ מִזְבְּחֽוֹתֵי/כֶ֗ם וְ/נִשְׁבְּר֤וּ וְ/נִשְׁבְּתוּ֙ גִּלּ֣וּלֵי/כֶ֔ם וְ/נִגְדְּעוּ֙ חַמָּ֣נֵי/כֶ֔ם וְ/נִמְח֖וּ מַעֲשֵׂי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/006.yaml
  text: In all your dwelling places[a], the cities will be laid waste and the high places will be desolated, so that your altars may be laid waste and desolated, and your idols broken and brought to an end, and your incense altars cut down[b], and your works wiped out.
translation:
  language: zh_hans
  text: 在你们一切住处，城邑必荒废，丘坛必荒凉；为要使你们的祭坛荒废、荒凉，你们的偶像[a]被打碎、废弃，你们的香坛[b]被砍倒，你们所做的一切被抹去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”原文是带有强烈鄙夷意味的称呼，可能含有“污秽”或“粪秽”的意味。
    reason: lexical_alternative
  - marker: b
    text: “香坛”所译的希伯来词所指不详；也可译作“太阳柱”或“太阳像”，可能是与太阳崇拜有关的祭祀物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתֵיכֶם
  choice: 你们所有居住的地方
  rationale: 该词泛指人居住或定居之处；此译自然、宽泛，不将其限缩为行政意义上的“聚落”。
- source_word: הֶעָרִים תֶּחֱרַבְנָה
  choice: 城邑都必荒废
  rationale: חרב在此表示遭毁坏而荒芜；“荒废”既传达审判造成的毁灭，也与本节反复出现的荒凉意象相称。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: 这是指设于高处或称为“邱坛”的祭祀场所；“丘坛”是简洁而明确的现代中文圣经术语。
- source_word: תִּישָׁמְנָה
  choice: 必凄凉
  rationale: 该动词表示变得荒凉、无人使用；“凄凉”保留其状态性，并与前句“荒废”形成对应而不机械重复。
- source_word: לְמַעַן
  choice: 这样
  rationale: 此处可表达目的或结果；“这样”在中文中自然地保留两者之间的张力，不强行限定为单一逻辑关系。
- source_word: יֶחֶרְבוּ וְיֶאְשְׁמוּ מִזְבְּחוֹתֵיכֶם
  choice: 你们的祭坛就必荒废凄凉
  rationale: 保留两个并列动词的加强作用；中文合用“荒废凄凉”，避免冗赘，同时没有省略第二层意思。
- source_word: גִּלּוּלֵיכֶם
  choice: 你们的偶像
  rationale: 正文用清楚自然的“偶像”；原词强烈鄙夷、可能涉及污秽或粪秽的色彩，置于脚注说明。
- source_word: וְנִשְׁבְּרוּ וְנִשְׁבְּתוּ
  choice: 必被打碎、废除
  rationale: “打碎”对应物理破坏，“废除”对应使之止息、不再存在或发挥作用，保留两个动词的不同力度。
- source_word: חַמָּנֵיכֶם
  choice: 你们的香坛
  rationale: 该词所指祭祀物件有争议，可能与焚香或太阳崇拜有关；正文采用符合上下文的“香坛”，脚注保留其他可能。
- source_word: וְנִמְחוּ מַעֲשֵׂיכֶם
  choice: 你们所造的也必被抹去
  rationale: מַעֲשֵׂיכֶם既可指行为，也可指人手制成之物；在偶像崇拜语境中，“所造的”自然指向制造的祭祀物件，同时仍略保留范围上的开放性。“抹去”准确表达消除、除净。
theological_decisions:
- issue: 如何呈现经文对偶像崇拜的贬斥而不额外强化
  choice: 正文直译具体祭祀场所和物件，并在脚注交代“偶像”一词的鄙夷色彩
  alternative: 在正文译为“污秽的偶像”或“粪偶像”
  rationale: 希伯来文确有强烈贬义，但具体词源意象并不完全确定。正文保持清晰庄重，脚注保存其修辞力度，可避免淡化经文，也避免将有争议的词源解释写死。
- issue: לְמַעַן在本句表达目的还是结果
  choice: 译作“这样”
  alternative: 译作“为要使”或“以致”
  rationale: 该连接词通常表示目的，也可能在此兼有结果意味。“这样”使中文顺畅，并保留目的与结果之间的真实张力。
- issue: חַמָּנִים所指的祭祀物件
  choice: 正文译“香坛”，脚注注明也可能是太阳柱或太阳像
  alternative: 正文直接译“太阳柱”或“太阳像”
  rationale: 其具体形制和崇拜关联仍有争议；不应在正文中把某一种解释绝对化。
translation_notes:
  register: 采用现代、庄重、易懂的书面普通话。保留希伯来文密集并列的审判节奏，但以中文标点和适度词序调整避免生硬。“城邑”“丘坛”“祭坛”“偶像”等词保持具体的祭祀与审判语境。
