  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָשַׁ֨מּוּ֙ מִזְבְּח֣וֹתֵי/כֶ֔ם וְ/נִשְׁבְּר֖וּ חַמָּֽנֵי/כֶ֑ם וְ/הִפַּלְתִּי֙ חַלְלֵי/כֶ֔ם לִ/פְנֵ֖י גִּלּוּלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/004.yaml
  text: Your altars will be desolated[a], and your incense altars will be broken[b]; and I will cast down your slain before your idols.
translation:
  language: zh_hans
  text: 你们的祭坛必荒废，你们的香坛[a]必被打碎；我要使你们被杀的人倒在你们的偶像[b]面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“日柱”。原文所指的是用于非法敬拜的祭祀设施，可能与焚香或太阳崇拜有关。
    reason: lexical_alternative
  - marker: b
    text: 原文是对偶像极具鄙夷意味的称呼，也可译作“污秽的偶像”，甚至“粪偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ
  choice: 必荒废
  rationale: 该词为שׁמם的尼法勒形式，表示陷入荒凉、遭到毁坏的状态；“必荒废”简洁保留结果状态和审判语气。
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: 你们的祭坛
  rationale: מִזְבֵּחַ通常指祭坛；此处无需进一步限定种类。
- source_word: נִשְׁבְּרוּ
  choice: 必被打碎
  rationale: שׁבר的尼法勒形式表示被折断或打碎；“被打碎”既保留被动意义，也符合摧毁祭祀设施的语境。
- source_word: חַמָּנֵיכֶם
  choice: 你们的香坛
  rationale: חַמָּנִים指与非法敬拜有关的祭祀设施，可能与焚香或太阳崇拜相关；正文采用较自然且符合祭祀语境的“香坛”，另以脚注保留“日柱”的可能。
- source_word: הִפַּלְתִּי
  choice: 我要使……倒在
  rationale: נפל的使役式意为“使之倒下”；此译明确表达上帝主动施行审判，同时与后面的空间短语自然衔接。
- source_word: חַלְלֵיכֶם
  choice: 你们被杀的人
  rationale: חָלָל指被杀或被刺死的人；此译不额外限定性别，也比单说“尸体”更贴近词义。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 该介词表示在某物之前或前方；“面前”保留了死者倒在偶像前的空间关系及讽刺意味。
- source_word: גִּלּוּלֵיכֶם
  choice: 你们的偶像
  rationale: גִּלּוּלִים是以西结书中对偶像带强烈鄙夷色彩的称呼。正文用现代读者清楚自然的“偶像”，脚注说明原词更尖锐的贬义。
theological_decisions:
- issue: 以西结对偶像所用称呼的强烈贬义
  choice: 正文译作“偶像”，并用脚注说明其鄙夷意味
  alternative: 污秽的偶像；粪偶像
  rationale: “偶像”准确交代审判所针对的对象，又不在正文中以生硬措辞过度解释；脚注保留原文刻意尖刻、侮蔑的修辞力量。
- issue: חַמָּנִים所指祭祀设施的具体性质
  choice: 正文译作“香坛”
  alternative: 日柱；祭祀柱
  rationale: 该词可能指与焚香或太阳崇拜有关的设施，具体形制并不完全确定。正文采用符合上下文且易懂的传统表达，并在脚注中保留另一主要解释，避免把词义争议完全抹平。
translation_notes:
  register: 采用现代、庄重而直接的普通话。两个“必”体现预言中确定的审判；分号保留原文前两项设施被毁与后半句人员被杀之间的推进。所有代词均用“你们”，对应希伯来文复数第二人称。
