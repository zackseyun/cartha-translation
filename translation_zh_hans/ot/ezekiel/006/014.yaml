  text: וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/נָתַתִּ֨י אֶת הָ/אָ֜רֶץ שְׁמָמָ֤ה וּ/מְשַׁמָּה֙ מִ/מִּדְבַּ֣ר דִּבְלָ֔תָ/ה בְּ/כֹ֖ל מוֹשְׁבֽוֹתֵי/הֶ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/014.yaml
  text: So I will stretch out my hand against them and make the land a desolation and a waste[a], from the wilderness toward Diblath, throughout all their settlements[b]. Then they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 所以，我必伸出手攻击他们，使这地从旷野朝第比拉的方向、在他们所有的住处，都成为荒凉废弃之地[a][b]。这样，他们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“从旷野第比拉”；此地名及短语的确切意思不能确定。也可理解为“从旷野到第比拉”；有些文本校勘建议将其与“利比拉”联系起来。
    reason: 文本与地名不确定
  - marker: b
    text: 或译：“在他们一切的住处”。
    reason: 词义的另一种译法
lexical_decisions:
- source_word: וְנָטִיתִי אֶת יָדִי עֲלֵיהֶם
  choice: 我必伸手攻击他们
  rationale: 保留“伸手”这一先知性意象，并用“攻击”明确 עַל 在审判语境中的敌对含义。
- source_word: וְנָתַתִּי אֶת הָאָרֶץ
  choice: 使这地……都
  rationale: נתן 与后面的表语连用，表达使土地成为某种状态；汉语以“使……都……”自然传达其使役义。
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: 荒凉废弃
  rationale: 两个近义词叠加强调彻底毁坏；“荒凉废弃”既保留双重表达，也符合现代汉语。
- source_word: מִמִּדְבַּר דִּבְלָתָה
  choice: 从旷野直到第比拉
  rationale: 按马所拉文本最直接理解为地理范围；保留不确定的地名音译，并在脚注交代文本及地点识别问题。
- source_word: בְּכֹל מוֹשְׁבוֹתֵיהֶם
  choice: 在他们一切居住的地方
  rationale: מוֹשָׁב 可指居所或居民点；此译法自然，并保留范围的广泛性。
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: 这样，他们就知道我是雅威
  rationale: “这样……就”自然表达审判所带来的结果；将神名直接音译为“雅威”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见形式音译四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 直接保留神的专名，符合源文本的身份宣告，也不以传统称号替代。
- issue: מִמִּדְבַּר דִּבְלָתָה 的解释
  choice: 理解为地理范围：“从旷野直到第比拉”
  alternative: 从旷野朝第比拉方向；按文本校勘联系“利比拉”；理解为极度荒凉的表达
  rationale: 马所拉文本最自然地指向一个地理终点，但地名及地点无法确定，因此正文采用直译，脚注保留不确定性。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“伸手攻击”保留先知审判语言的意象；“荒凉废弃”用双重表达呈现希伯来文的强化效果。正文不擅自修订疑难地名，相关歧义置于脚注。
