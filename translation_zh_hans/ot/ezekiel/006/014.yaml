revisions:
- from: 所以，我必伸手攻击他们，使这地从旷野直到第比拉[a]，在他们一切居住的地方[b]，都荒凉废弃。这样，他们就知道我是雅威。
  to: 所以，我必伸出手攻击他们，使这地从旷野朝第比拉的方向、在他们所有的住处，都成为荒凉废弃之地[a][b]。这样，他们就知道我是雅威。
  rationale: 修订避免把有争议的地理短语确定地译作“直到”，并以脚注说明不同理解及与利比拉相关的校勘建议。重组句法，令“使这地成为荒凉废弃之地”的使役结构及“在所有住处”的范围更清晰；不改变审判、毁坏和认识雅威的基本意义。
  reviewer_model: gpt-5.6-terra
