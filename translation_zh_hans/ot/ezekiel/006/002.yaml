  yaml_path: translation/ot/ezekiel/006/002.yaml
  text: Son of man[a], set your face toward the mountains of Israel, and prophesy to them.
translation:
  language: zh_hans
  text: “人子啊，你要面向以色列的群山，向它们说预言[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“向它们说预言。”这里的“向”在本段审判语境中带有针对它们的意味。
    reason: 保留 אֲלֵיהֶם 的中性方向义，同时说明上下文所赋予的针对性，而不把“攻击”误作介词的直接词义。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是上帝对以西结的固定称呼；保留希伯来语“人的儿子”这一惯用表达的形式与先知性语气。
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: 面向
  rationale: 原文直译为“把你的脸朝向”。“面向”在现代汉语中自然简洁，同时保留“脸朝着某处”的方向性意象。
- source_word: הָרֵי יִשְׂרָאֵל
  choice: 以色列的群山
  rationale: 保留具体的复数意象，不将其解释性地改写为“以色列山区”或“以色列全地”。
- source_word: וְהִנָּבֵא
  choice: 说预言
  rationale: 准确表达 נבא 的先知性发言含义，语言平实，避免添加原文没有明说的“宣判”等内容。
- source_word: אֲלֵיהֶם
  choice: 向它们
  rationale: 介词 אֶל 首先表示“向、对”；虽在本段审判语境中可带有敌对指向，但正文保留其较中性的基本意义，并用脚注说明语境性译法。
theological_decisions:
- issue: בֶּן אָדָם 作为对先知的称呼
  choice: 人子
  alternative: 世人／必死的人
  rationale: 原文在以西结书中以阳性单数称呼先知本人。“人子”既保留固定称呼，也不把其中的受造者身份或先知职分作过度解释。
- issue: אֲלֵיהֶם 在审判预言中的方向或敌对含义
  choice: 向它们
  alternative: 攻击它们／针对它们
  rationale: 介词本身可作中性的“向、对”，而上下文使预言具有审判和敌对的实际效果。正文不消除词义上的张力，脚注列出语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“面向”保留先知受命正面朝向审判对象的意象；代词“它们”与无生命的“群山”相应。脚注标记紧接存在译法分歧的预言短语。
