  text: You shall eat it as a barley cake, and you shall bake it over human dung in their sight.
translation:
  language: zh_hans
  text: 你要吃大麦饼；要当着他们的面，用人的粪便作燃料烤它。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֻגַת שְׂעֹרִים
  choice: 大麦饼
  rationale: 直译为“大麦饼”，准确保留食物的原料和形态。
- source_word: בְּגֶלְלֵי צֵאַת הָאָדָם
  choice: 用人的粪便作燃料
  rationale: 介词בְּ在此表达烘烤所借助的燃料；原文指以人粪作为火源，而不是把粪便混入食物。明确补出“作燃料”，可避免现代读者误解，同时保留令人不洁、受辱的意象。
- source_word: לְעֵינֵיהֶם
  choice: 当着他们的面
  rationale: 自然表达“在他们眼前、让他们看见”的公开行动。
- source_word: תְּעֻגֶנָה
  choice: 烤熟
  rationale: 该罕见词与“饼”同源，语境中指制作或烘烤成饼；译作“烤熟”符合具体动作。
theological_decisions:
- issue: 人粪与饼的关系
  choice: 人的粪便仅作烘烤燃料
  alternative: 在人的粪便上烤，可能被误解为饼直接接触粪便
  rationale: 上下文及古代燃料习惯支持“以粪便为燃料”；这样既不削弱不洁象征，也不凭译文暗示粪便是食材。
translation_notes:
  register: 采用现代、庄重而清楚的叙述。“你要……并且……”保留命令语气；“当着他们的面”自然传达公开示范的意味。
