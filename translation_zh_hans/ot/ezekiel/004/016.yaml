id: EZK.4.16
reference: Ezekiel 4:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ הִנְ/נִ֨י שֹׁבֵ֤ר מַטֵּה לֶ֨חֶם֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/אָכְלוּ לֶ֥חֶם בְּ/מִשְׁקָ֖ל וּ/בִ/דְאָגָ֑ה וּ/מַ֕יִם בִּ/מְשׂוּרָ֥ה וּ/בְ/שִׁמָּמ֖וֹן יִשְׁתּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/016.yaml
  text: Then he said to me[a], “Son of man, behold, I am breaking the staff of bread in Jerusalem, and they will eat bread by weight and with anxiety, and they will drink water by measure and with horror.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，看哪，我要在耶路撒冷折断粮食之杖[a]。他们必按重量吃粮食，忧心忡忡；按定量喝水，满心惊骇。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “粮食之杖”是希伯来语的比喻，指维持生命的粮食供应或食物保障。
    reason: 解释保留在正文中的希伯来语习语和隐喻。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝对先知的一贯称呼及希伯来语的庄重表达；此处是对人的称呼，并非基督论头衔。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留指示和强调语气；“我要”结合分词表达即将发生且确定的行动，比汉语直译为“我正在”更符合预告审判的语境。
- source_word: שֹׁבֵר
  choice: 折断
  rationale: 准确保留将支撑之杖折断的具体意象，以及审判行动的力度。
- source_word: מַטֵּה לֶחֶם
  choice: 粮食之杖
  rationale: 保留原文以杖象征支撑和供应的隐喻，并用脚注说明其习语含义。
- source_word: בִּירוּשָׁלִַם
  choice: 耶路撒冷的
  rationale: 在汉语中将地点自然地并入“粮食之杖”短语，表达上帝要在耶路撒冷断绝维生粮食的意思。
- source_word: וְאָכְלוּ לֶחֶם בְּמִשְׁקָל
  choice: 他们必按分量吃饼
  rationale: 保留粮食须经称量、限量供应的具体图景；“必”体现语境中的确定将来。
- source_word: וּבִדְאָגָה
  choice: 忧心忡忡
  rationale: 表达דְאָגָה所指的忧虑和不安，也符合现代汉语的庄重叙述语体。
- source_word: וּמַיִם בִּמְשׂוּרָה
  choice: 按定量喝水
  rationale: 自然表达水必须量取、配给的匮乏处境，并与前句“按分量吃饼”形成平行。
- source_word: וּבְשִׁמָּמוֹן
  choice: 满心惊恐
  rationale: 该词可涵盖惊骇、惶惑和因灾难而震恐的状态；此译法保留其强烈情感色彩，不将其窄化为单纯的“荒凉”。
- source_word: יִשְׁתּוּ
  choice: 喝水
  rationale: 按上下文译作确定的将来行动，并在汉语中与宾语“水”自然组合。
theological_decisions:
- issue: 是否保留מַטֵּה לֶחֶם的隐喻
  choice: 正文译作“粮食之杖”，脚注解释为维持生命的粮食供应。
  alternative: 正文直接译作“粮食供应”或“维生的粮食”。
  rationale: 原文把粮食描绘为支撑人的杖，强调上帝折断生存依靠的审判行动。保留隐喻可呈现先知语言的力度，脚注则保障普通读者理解。
- issue: הִנְנִי שֹׁבֵר的时间与体貌
  choice: 译作“看哪，我要折断”。
  alternative: 译作“看哪，我正在折断”或“看哪，我必折断”。
  rationale: 该结构可生动呈现即将发生或确定无疑的行动；“我要折断”在现代汉语中兼顾临近性、意向性和预告审判的语境，而不把行动误解为已经在进行。
translation_notes:
  register: 采用现代、庄重而易懂的先知叙事语体。“看哪”“人子”保留经文的郑重感；“忧心忡忡”“满心惊恐”自然呈现两组情绪描写。脚注标记紧随其实际解释的“粮食之杖”，避免误指前文。
