id: EZK.4.14
reference: Ezekiel 4:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הִנֵּ֥ה נַפְשִׁ֖/י לֹ֣א מְטֻמָּאָ֑ה וּ/נְבֵלָ֨ה וּ/טְרֵפָ֤ה לֹֽא אָכַ֨לְתִּי֙ מִ/נְּעוּרַ֣/י וְ/עַד עַ֔תָּה וְ/לֹא בָ֥א בְּ/פִ֖/י בְּשַׂ֥ר פִּגּֽוּל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/014.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I have never defiled myself. From my youth until now I have not eaten what dies of itself or what is torn by beasts[c][b], and no defiled meat has entered my mouth.”
translation:
  language: zh_hans
  text: 我就说：“哎，主耶和华啊！看哪，我没有沾染污秽[a]。从幼年直到如今，我没有吃过自然死亡的动物或被野兽撕裂的动物[b]，污秽的肉[c]也从未进过我的口。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我的生命／我本人没有受玷污”，这里是说“我没有沾染不洁”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“动物尸体或被撕裂的肉”，指自然死亡或被野兽撕裂、按以色列洁净条例不可食用的动物。
    reason: cultural_note
  - marker: c
    text: 也可译作“可憎的肉”。原词指在礼仪上不可接受或受到玷污的肉。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: 哎
  rationale: 这是表达惊惧、苦恼或恳求的感叹词；“哎”在现代汉语中自然，也保留了以西结急切申诉的语气。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留“主”这一称号和神圣名字“耶和华”的组合，符合现代中文圣经语体，也避免把两个成分合并。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为引起对方注意的语篇标记，“看哪”保留了申诉中的强调作用，并具有庄重而易懂的圣经语体。
- source_word: נַפְשִׁי לֹא מְטֻמָּאָה
  choice: 我从未玷污过自己
  rationale: 原文直译为“我的生命／我本人没有受玷污”；此处 נֶפֶשׁ 指说话者本人。采用自然的汉语反身表达，传达他一向谨守礼仪洁净的申明。
- source_word: נְבֵלָה
  choice: 自死的动物
  rationale: 指未经合规宰杀而死亡的动物尸体；“自死的动物”简明地表达其与正常宰杀之肉的区别。
- source_word: טְרֵפָה
  choice: 被野兽撕裂的动物
  rationale: 指被猛兽撕咬、因而不可食用的动物；补出原文所隐含的施动者，使现代读者容易理解。
- source_word: מִנְּעוּרַי וְעַד עַתָּה
  choice: 从幼年直到如今
  rationale: 保留原文强调终身一贯操守的时间范围，表达庄重自然。
- source_word: וְלֹא בָא בְּפִי
  choice: 也从未进过我的口
  rationale: 保留原文“进入我的口”的具体意象，同时在汉语中自然表达“从未吃过”。
- source_word: בְּשַׂר פִּגּוּל
  choice: 污秽的肉
  rationale: פִּגּוּל 指因礼仪或其他原因而令人厌恶、不可接受的肉。“污秽的肉”保留其礼仪色彩，同时不把具体成因说死。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时包含主权称号和四字神名；“主耶和华”在简体中文圣经语境中庄重、清楚，并保留两者的区别。
- issue: 以西结关于自身未受玷污的陈述
  choice: 我从未玷污过自己
  alternative: 我的生命没有受过玷污
  rationale: 这里谈的是礼仪上的洁净，并非宣称自己在一切道德意义上毫无罪污；反身译法准确表达其在饮食方面一贯未使自己成为不洁。
- issue: בְּשַׂר פִּגּוּל 所指范围
  choice: 污秽的肉
  alternative: 可憎的肉；不洁净的肉
  rationale: 该词含有礼仪上不可接受或令人厌恶的意味，但本节没有明确限定肉为何成为不可接受；因此不把它专门解释为某一种违法或腐坏情形。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。“哎……啊”和“看哪”保留先知急切而恭敬的申诉语气；其余句式力求自然，避免过度古雅。三个脚注分别说明 נֶפֶשׁ 的习语、自死或被撕裂之动物的律法背景，以及 פִּגּוּל 的语义范围。
