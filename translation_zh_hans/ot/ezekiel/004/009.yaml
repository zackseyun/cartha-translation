base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/009.yaml
  text: And you[a], take for yourself wheat and barley, beans and lentils, millet and spelt, and put them into one vessel, and make them into bread for yourself. For the number of the days that you lie on your side—three hundred and ninety days—you shall eat it.
translation:
  language: zh_hans
  text: “你要为自己取小麦、大麦、豆子、扁豆、小米和斯佩耳特小麦[a]，把它们放在一个容器里，用它们给自己做成饼。在你侧卧的三百九十天里，你要吃这饼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“二粒小麦”或“一种小麦”；古代谷物כֻסְּמִים的确切品种尚不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: 为自己取
  rationale: 保留命令式及受益与格所表达的‘为自己’之意，同时符合现代汉语表达。
- source_word: חִטִּין וּשְׂעֹרִים
  choice: 小麦、大麦
  rationale: 采用这两种谷物的标准现代汉语名称。
- source_word: פּוֹל וַעֲדָשִׁים
  choice: 豆子、扁豆
  rationale: פּוֹל可能更具体地指蚕豆，但原词的精确范围不宜在正文中过度限定；עֲדָשִׁים则通常指扁豆。
- source_word: דֹחַן
  choice: 小米
  rationale: 该词通常被认定为黍类谷物；‘小米’是普通读者易懂的现代汉语对应词。
- source_word: כֻסְּמִים
  choice: 斯佩耳特小麦
  rationale: 采用一种常见且具体的谷物认定，同时以脚注说明古代品种的确切认定仍有争议。
- source_word: בִּכְלִי אֶחָד
  choice: 放在一个容器里
  rationale: ‘容器’自然传达כְּלִי的宽泛含义，并保留‘一个’，凸显各样谷物混放在一起。
- source_word: וְעָשִׂיתָ אוֹתָם לְךָ לְלָחֶם
  choice: 用它们给自己做成饼
  rationale: 以自然汉语表达原文‘把它们为自己做成食物/饼’的转化与受益含义；‘饼’符合古代烤制谷物食品的语境。
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר אַתָּה שׁוֹכֵב עַל־צִדְּךָ שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: 你侧卧的那些日子，共三百九十天
  rationale: 清楚保留侧卧这一象征行动、日数范围及三百九十天的明确数值，避免生硬照搬希伯来语句序。
- source_word: תֹּאכֲלֶנּוּ
  choice: 都要吃这饼
  rationale: 单数宾语回指作为整体的饼/食物；‘都’自然表明这一要求贯穿上述全部日子。
