base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/015.yaml
  text: Then he said to me[a], “See, I have given you cow dung instead of human dung, and you shall prepare your bread over it.”
translation:
  language: zh_hans
  text: 他对我说：“看，我把牛粪给你，代替人粪；你要在牛粪上烤你的饼。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 承接上文叙事；主语“他”指上文说话的上帝。汉语无需机械译出连接词。
- source_word: רְאֵה
  choice: 看
  rationale: 这是引起注意的命令语；“看”简洁自然，并保留原文的直接语气。
- source_word: נָתַתִּי לְךָ
  choice: 我把……给你
  rationale: 完成式在此表达已经作出的准许和赐予；现代汉语用“把……给你”自然传达这一点。
- source_word: צפועי הַבָּקָר
  choice: 牛粪
  rationale: 指牛的粪便，在此作为燃料；“牛粪”具体、直接，也符合现代汉语习惯。
- source_word: תַּחַת
  choice: 代替
  rationale: 此处表示替换，而非空间上的“在……下面”。
- source_word: גֶּלְלֵי הָאָדָם
  choice: 人粪
  rationale: גֶּלֶל指粪便，הָאָדָם在此泛指人类，与牛形成对照；“人粪”准确而简洁。
- source_word: וְעָשִׂיתָ אֶת לַחְמְךָ
  choice: 你要……烤你的饼
  rationale: עשה本义较宽，但结合粪便作为燃料及עֲלֵיהֶם，语境明确涉及以火烤制食物；“烤”在中文中清楚自然。
- source_word: עֲלֵיהֶם
  choice: 在牛粪上
  rationale: 希伯来语为复数，回指一块块牛粪；中文将“牛粪”视为集合或物质名词，重复名词比使用可能含混的“它们”更清楚。“在……上”保留原文空间表达，并按语境理解为以其作燃料。
theological_decisions:
- issue: הָאָדָם的所指范围
  choice: 人
  alternative: 男人／亚当
  rationale: 此处与“牛”相对，泛指人类，并非特指某个男性或亚当；译作“人粪”保留一般性所指。
translation_notes:
  register: 采用现代、庄重而直白的叙事语言。保留“看”这一引起注意的命令语；对粪便不作委婉化处理。为避免“在它们上”在中文中生硬且指代不明，末句明确重复“牛粪”。
