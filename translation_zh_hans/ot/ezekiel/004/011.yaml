base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/011.yaml
  text: And you shall drink water by measure[a], a sixth of a hin; from time to time you shall drink.
translation:
  language: zh_hans
  text: 水也要按量喝，六分之一欣；要按时喝。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“隔一段时间喝一次。”
    reason: 原文מֵעֵת עַד עֵת可理解为按规定时间饮用，也可侧重间隔一段时间再饮用。
lexical_decisions:
- source_word: וּמַיִם
  choice: 水也
  rationale: מַיִם意为“水”；前缀ו承接上文的一连串吩咐，现代汉语以“也”自然表达这种接续和并列。
- source_word: בִּמְשׂוּרָה
  choice: 按量
  rationale: מְשׂוּרָה指量定的分量；“按量”简洁自然，并保留饮水受配给限制的含义。
- source_word: תִשְׁתֶּה
  choice: 要……喝
  rationale: 这是Qal未完成式第二人称阳性单数，在本段指令语境中表达命令；译作“要……喝”符合现代汉语的命令语气。
- source_word: שִׁשִּׁית הַהִין
  choice: 六分之一欣
  rationale: 直译原文所规定的分量，并保留古代容量单位“欣”，不以现代单位作不确定的换算。
- source_word: מֵעֵת עַד עֵת
  choice: 按时
  rationale: 该短语字面是“从一个时候到另一个时候”，在此表示饮水须按规定的时段进行；“按时”简明地传达其周期性和受管制性。
- source_word: תִּשְׁתֶּה
  choice: 喝
  rationale: 保留原文第二次出现的动词，以强调不仅饮水量受限，饮用时间也受限制。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“欣”保留圣经时代的容量单位；分号呈现原文先规定分量、再规定饮用时段的结构。
