  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כָּ֣כָה יֹאכְל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת לַחְמָ֖/ם טָמֵ֑א בַּ/גּוֹיִ֕ם אֲשֶׁ֥ר אַדִּיחֵ֖/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/013.yaml
  text: And Yahweh said[c][b][a], “Thus the sons of Israel will eat their bread unclean among the nations where I will drive them.”
translation:
  language: zh_hans
  text: 耶和华说：“以色列人[a]必在我将他们驱逐到的列国中这样吃不洁净[b]的饼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的儿子们”，这里指以色列全体人民，也可译作“以色列的子孙”。
    reason: lexical_alternative
  - marker: b
    text: 或译“受玷污的”。这个词带有礼仪上不洁的含义，在这里尤其与以色列人流亡列国有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经语境中广为人知的专名形式，明确呈现原文中的上帝圣名，而不以“主”替代。
- source_word: כָּכָה
  choice: 这样
  rationale: 保留指示方式的语气，承接前文以西结象征性烤饼的行动，也符合自然现代汉语。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的儿子们”，此处作为全民族的集合称谓；“以色列人”在现代汉语中准确、自然，并以脚注保留字面形式。
- source_word: לַחְמָם
  choice: 饼
  rationale: 保留 לֶחֶם 的具体食物意象；上下文所述正是烤饼的象征行动，不泛化为“食物”。汉语无需机械译出所属代词。
- source_word: טָמֵא
  choice: 不洁净
  rationale: 保留该词在祭仪与盟约语境中的不洁含义；比单纯的“不干净”更能传达宗教礼仪层面的意味。
- source_word: בַּגּוֹיִם
  choice: 在……列国中
  rationale: 指以色列被放逐后身处的外国民族或国家；“列国”简洁庄重，也避免把后期术语含义带入本节。
- source_word: אַדִּיחֵם
  choice: 将他们驱逐去
  rationale: 使役形表达使人离开、被赶往他处；“驱逐”保留强制放逐的力度，而“去”自然衔接目的地。
- source_word: שָׁם
  choice: 去的
  rationale: 原文直译为“那里”，在汉语关系从句中化为“驱逐去的列国”，既自然又保留目的地关系。
theological_decisions:
- issue: 如何译出圣名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字圣名，正文以汉语读者熟悉的专名“耶和华”呈现，不以称号“主”取代；“雅威”是另一种较接近学术拟音的译法。
- issue: בְנֵי יִשְׂרָאֵל 的集合性所指
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 此处所指是整个以色列民族，包括被放逐群体，并非只强调男性后代；正文采用自然的集合称谓，脚注注明原文字面形式，避免抹去其家族性表达。
- issue: טָמֵא 的礼仪含义
  choice: 不洁净
  alternative: 受玷污的
  rationale: “不洁净”保留原词与祭仪、盟约秩序相关的张力，同时不把这里的语法关系过度解释为饼已经“受玷污”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必这样”承接前文的象征行动；句序按汉语习惯调整，将地点成分置于谓语之前。所有脚注标记均放在所说明词语之后。
