revisions:
- from: 耶和华说：“以色列人[a]必这样在我将他们驱逐[c]去的列国中，吃不洁净[b]的饼。”
  to: 耶和华说：“以色列人[a]必在我将他们驱逐到的列国中这样吃不洁净[b]的饼。”
  rationale: 仅作安全的汉语句法调整：以“驱逐到的列国中”明确放逐的目的地，并将“这样”移至动词前以改善流畅性。脚注c仍锚定正文“驱逐”所对应的动词；原有三项脚注均予保留，未增添解释性或教派性内容。
