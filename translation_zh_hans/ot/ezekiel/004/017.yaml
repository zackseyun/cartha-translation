id: EZK.4.17
reference: Ezekiel 4:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְמַ֥עַן יַחְסְר֖וּ לֶ֣חֶם וָ/מָ֑יִם וְ/נָשַׁ֨מּוּ֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/נָמַ֖קּוּ בַּ/עֲוֺנָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/017.yaml
  text: so that they may lack bread and water[a], and each man and his brother may be appalled[b], and waste away in their iniquity.
translation:
  language: zh_hans
  text: 好使他们缺少饼和水，各人和自己的弟兄都惊骇[a]，并在自己的罪孽中渐渐衰残[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因荒凉而愕然”“惊呆”。希伯来语动词既可描述荒凉，也可描述荒凉所引起的震惊状态。
    reason: lexical_alternative
  - marker: b
    text: “罪孽”也可指“罪责”或“罪孽所招致的刑罚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 好使
  rationale: 引出前述象征行动所导致的目的或结果；“好使”自然保留希伯来语的目的—结果意味。
- source_word: יַחְסְרוּ
  choice: 缺少
  rationale: חסר 表示缺乏、不足；未完成式指向将要发生的结果。
- source_word: לֶחֶם וָמָיִם
  choice: 饼和水
  rationale: 保留原文具体的基本生存必需品，不泛化为“食物和水”。
- source_word: וְנָשַׁמּוּ
  choice: 都惊骇
  rationale: שמם 的尼法勒形可表达因灾难而惊骇、愕然，也可含荒凉之意；以人为主语时，“惊骇”最自然，同时用脚注保留其语义幅度。
- source_word: אִישׁ וְאָחִיו
  choice: 各人和自己的弟兄
  rationale: 保留原文阳性、分配性的表达及“弟兄”的具体关系，不改写为“邻舍”；“各人”体现 איש 的逐一分配作用。
- source_word: וְנָמַקּוּ
  choice: 渐渐衰残
  rationale: מקק 表示逐渐消耗、腐朽或衰败；“渐渐衰残”适用于人，也保留持续败坏、消亡的严重意味。
- source_word: בַּעֲוֺנָם
  choice: 在自己的罪孽中
  rationale: עָוֹן 可指罪孽、罪责或罪所招致的刑罚；直译式表达保留这些彼此关联而未完全收窄的含义。
theological_decisions:
- issue: אִישׁ וְאָחִיו 的阳性代表性语言
  choice: 各人和自己的弟兄
  alternative: 各人彼此；各人和自己的邻舍
  rationale: 原文使用阳性单数名词并具有分配作用。“弟兄”比“邻舍”更贴近 אָח，且不把原文的性别和亲属措辞中性化。
- issue: עָוֹן 的语义范围
  choice: 罪孽
  alternative: 罪责；罪孽所招致的刑罚
  rationale: 该词可同时涉及罪行、罪责及其后果。正文采用“罪孽”保留道德重量，脚注说明其他可能含义，避免把经文只解释为内在罪责或外在刑罚。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“饼和水”保留原文意象；“各人和自己的弟兄”略具经文语体，以忠实呈现原文结构；脚注标记均置于相关词语之后。
