  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָתַתָּ֨ה עָלֶ֜י/הָ מָצ֗וֹר וּ/בָנִ֤יתָ עָלֶ֨י/הָ֙ דָּיֵ֔ק וְ/שָׁפַכְתָּ֥ עָלֶ֖י/הָ סֹֽלְלָ֑ה וְ/נָתַתָּ֨ה עָלֶ֧י/הָ מַחֲנ֛וֹת וְ/שִׂים עָלֶ֥י/הָ כָּרִ֖ים סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/002.yaml
  text: And set a siege against it[a], and build a siege wall against it, and heap up a ramp against it, and set camps against it[b], and place battering rams against it all around.
translation:
  language: zh_hans
  text: 你要围困这城，修筑攻城壁垒[a]，堆起攻城坡道[b]，在城外安设营寨，并在四围架设撞城锤。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “攻城壁垒”或译“攻城塔”；希伯来语 דָּיֵק 泛指攻城设施，也可能指为进攻而筑起的高台或防护工事。
    reason: lexical_alternative
  - marker: b
    text: “攻城坡道”或译“土垒”，指向城墙堆筑的土坡。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצוֹר
  choice: 围困
  rationale: 该词在军事语境中指围城或封锁；用动词“围困”自然表达“对城施行围攻”的命令。
- source_word: דָּיֵק
  choice: 攻城壁垒
  rationale: 该词指为攻城而修筑的设施，具体形制并不完全确定；“攻城壁垒”保留其较宽泛的军事含义，另以脚注注明“攻城塔”的可能。
- source_word: סֹלְלָה
  choice: 攻城坡道
  rationale: 指堆筑起来、用于接近或攻打城墙的土坡；“攻城坡道”在现代汉语中明确而易懂。
- source_word: מַחֲנוֹת
  choice: 营寨
  rationale: 复数形式指围城军队所设的营地；“营寨”符合古代军事场景，并保持庄重自然。
- source_word: כָּרִים
  choice: 撞城锤
  rationale: 该词在围城语境中指撞击城墙或城门的攻城器械，并非普通的公羊；“撞城锤”清楚传达其军事用途。
- source_word: עָלֶיהָ
  choice: 围困这城／在城外
  rationale: 反复出现的介词短语表示各项敌对行动都针对所描绘的城；中文按语境分别自然表达，避免机械重复而不改变指向。
- source_word: סָבִיב
  choice: 在四围
  rationale: 表达从各面包围的景象，保留围城行动的全面性。
- source_word: וְנָתַתָּה / וּבָנִיתָ / וְשָׁפַכְתָּ / וְשִׂים
  choice: 围困／修筑／堆起／安设／架设
  rationale: 保留原文连续命令的具体动作，同时采用符合现代汉语军事叙述的动词搭配。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的军事用语。保留原文一连串命令所形成的紧迫节奏；对反复的“攻击它”按汉语习惯略作整合，并将两个词义存在不确定性的攻城设施分别用脚注说明。
