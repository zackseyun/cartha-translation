  text: וְ/אַתָּ֤ה קַח לְ/ךָ֙ מַחֲבַ֣ת בַּרְזֶ֔ל וְ/נָתַתָּ֤ה אוֹתָ/הּ֙ קִ֣יר בַּרְזֶ֔ל בֵּינְ/ךָ֖ וּ/בֵ֣ין הָ/עִ֑יר וַ/הֲכִינֹתָה֩ אֶת פָּנֶ֨י/ךָ אֵלֶ֜י/הָ וְ/הָיְתָ֤ה בַ/מָּצוֹר֙ וְ/צַרְתָּ֣ עָלֶ֔י/הָ א֥וֹת הִ֖יא לְ/בֵ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/003.yaml
  text: And you[a], take for yourself an iron griddle and set it as an iron wall between yourself and the city, and set your face toward it; and it will be under siege, and you shall besiege it. It is a sign for the house of Israel.
translation:
  language: zh_hans
  text: 你要拿一个铁煎盘[a]，把它放在你和那城之间，作为一道铁墙。你要面向那城；那城就会被围困，你也要围困那城。这是给以色列家的一个兆头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铁板”或“铁锅”。希伯来语所指的是一种金属炊具，可能是扁平的煎盘；这里被象征性地用作屏障。
    reason: 词义存在可成立的不同具体对应，且该器物的炊具属性与象征用途都应保留。
lexical_decisions:
- source_word: מַחֲבַת בַּרְזֶל
  choice: 铁煎盘
  rationale: מַחֲבַת 指用于烹调的扁平金属器具。“铁煎盘”保留炊具的本义，也便于理解它在象征行动中被立作屏障。
- source_word: קִיר בַּרְזֶל
  choice: 一道铁墙
  rationale: קִיר 的通常含义是“墙”。保留具体的“铁墙”意象，不将其解释性地改写为“铁屏障”。
- source_word: וַהֲכִינֹתָה אֶת־פָּנֶיךָ אֵלֶיהָ
  choice: 你要面朝那城
  rationale: 该表达指刻意使脸朝向某处。“面朝那城”在现代汉语中自然，同时保留先知象征行动的身体姿态。
- source_word: וְהָיְתָה בַמָּצוֹר
  choice: 那城就会被围困
  rationale: מָצוֹר 表示围城或受围困的状态；此译明确表达城所处的情形，并保留与下句主动围攻之间的呼应。
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: 你也要围攻它
  rationale: 此处 צור 是“围攻、围困”的动词。“围攻它”简洁地呈现先知所执行的象征行动。
- source_word: אוֹת הִיא
  choice: 这是……一个兆头
  rationale: אוֹת 指具有指示意义的记号或兆头。“这是”可概括前述整套象征行动，而不限定其只指某一件物品。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 给以色列家
  rationale: 介词 ל 在此表明兆头所针对的对象；“以色列家”保留原文的群体称谓。
theological_decisions:
- issue: 先知象征行动的意象
  choice: 保留“铁墙”“以色列家”和围城行动的具体表述
  alternative: 解释性地译作“铁屏障”“以色列人”，并说明其象征审判
  rationale: 原文让象征行动本身传达意义，并未在本节中完全解释各细节。保留具体意象可避免译文预先消解其神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“铁煎盘”比传统的“铁鏊”更容易为当代一般读者理解；句式保留命令、动作和结果之间的推进关系。
