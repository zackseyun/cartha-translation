  text: וְ/אַתָּ֤ה שְׁכַב֙ עַל צִדְּ/ךָ֣ הַ/שְּׂמָאלִ֔י וְ/שַׂמְתָּ֛ אֶת עֲוֺ֥ן בֵּֽית יִשְׂרָאֵ֖ל עָלָ֑י/ו מִסְפַּ֤ר הַ/יָּמִים֙ אֲשֶׁ֣ר תִּשְׁכַּ֣ב עָלָ֔י/ו תִּשָּׂ֖א אֶת עֲוֺנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/004.yaml
  text: And you[a], lie on your left side, and place the iniquity of the house of Israel upon it; for the number of the days that you lie on it, you shall bear their iniquity.
translation:
  language: zh_hans
  text: “你要向左侧卧，把以色列家的罪孽放在你的左侧；你在左侧躺卧多少天，就要担当他们的罪孽[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”或译“罪责”，也可指“罪孽所招致的惩罚”。希伯来语 עָוֹן 在本节两次出现，可包括罪本身、罪责或罪的后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכַב עַל צִדְּךָ הַשְּׂמָאלִי
  choice: 向左侧卧
  rationale: 这是吩咐身体姿势的命令；“向左侧卧”准确、自然地表达躺在左侧身体上的动作。
- source_word: וְשַׂמְתָּ
  choice: 放在
  rationale: שׂים可指放、置；此处采用“放在”，既符合象征行动的具体画面，也适合现代汉语。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: עָוֹן可涵盖罪行、罪责及罪所招致的后果。“罪孽”保留其道德含义，而脚注说明其语义张力。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来语的群体性、盟约性称谓，同时是中文圣经语体中可理解的表达。
- source_word: עָלָיו
  choice: 在这一侧上
  rationale: 代词最自然地回指前面的“左侧”；译出“这一侧”可避免中文代词指向含混，并保留空间意象。
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר תִּשְׁכַּב עָלָיו
  choice: 你在这一侧躺卧多少天
  rationale: 以自然现代汉语表达按所数日子计算的持续时间，保留מִסְפַּר的数量含义。
- source_word: תִּשָּׂא
  choice: 担当
  rationale: נשא与עָוֹן搭配时表示承受或负担罪孽、罪责或其后果。“担当”能保留道德负担的意象，且不自行加入赎罪解释。
- source_word: עֲוֺנָם
  choice: 他们的罪孽
  rationale: 复数后缀指以色列家这一群体；与本节前一处עָוֹן保持用词一致。
theological_decisions:
- issue: 以西结担当以色列家עָוֹן的含义
  choice: 译作“担当他们的罪孽”，视为先知的象征行动，不添加代赎性措辞
  alternative: 担当他们的罪责；承受他们因罪所受的惩罚
  rationale: 本节本身描述的是先知以行动表征以色列的罪孽负担。希伯来词可兼指罪、罪责和罪的后果，但经文没有在此明确界定其机制，因此正文保留张力，并在脚注列明语义范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“向左侧卧”简洁表达姿势命令；“以色列家”和“担当罪孽”保留原文的群体称谓及负担意象。为使中文指代清楚，将两个回指“侧”的代词译为“这一侧”。
