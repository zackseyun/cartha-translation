base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/005.yaml
  text: And I have assigned to you the years of their iniquity according to the number of days[a], three hundred and ninety days, and you shall bear the iniquity of the house of Israel.
translation:
  language: zh_hans
  text: 我已把他们罪孽的年数按日数指定给你，共三百九十日；你要担当以色列家的罪孽[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”或译“罪责”或“罪的刑罚”；这里的希伯来词可以指罪孽、罪责，也可以指罪责所招致的刑罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: 指定给
  rationale: 该动词字面义为“给”，但这里指上帝把一段具有象征意义的时日交付并规定给以西结；“指定给”既保留“给”的方向，也表达语境中的指派含义。
- source_word: שְׁנֵי עֲוֺנָם
  choice: 他们罪孽的年数
  rationale: 依照希伯来语结构直译为“他们罪孽的年数”，并由下文“按日数”说明以日代表年的象征关系；不把 עָוֹן 单一定义为刑罚。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: 该词可涵盖罪行、罪责以及罪所招致的刑罚。“罪孽”保留其道德含义，而“担当”一词同时让承担罪责或后果的意味自然呈现。
- source_word: לְמִסְפַּר יָמִים
  choice: 按日数
  rationale: 简洁表达年数依照相应日数计算的象征对应关系，符合现代汉语表达。
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: 三百九十日
  rationale: 按原文准确翻译数目；采用庄重而常见的“日”。
- source_word: וְנָשָׂאתָ
  choice: 你要担当
  rationale: נשא 与 עָוֹן 连用时表示承担罪孽、罪责或其后果；“担当”保留先知象征行动的庄重语气及原文的意义张力。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来语的群体称谓及其整体、立约共同体的意味。
theological_decisions:
- issue: 先知象征行动中 עָוֹן 的含义
  choice: 正文译作“罪孽”，不明确限定为罪行、罪责或刑罚中的一种
  alternative: 可译作“罪责”或“罪的刑罚”
  rationale: 原词的语义范围包括罪、由罪产生的罪责以及罪所带来的惩罚。正文保留“罪孽”，并借“担当”呈现承担罪责及后果的可能含义，避免消除原文的神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“按日数指定给你”清楚表达象征性的日年对应；保留“以色列家”和“担当罪孽”等圣经语域中的稳健表达。
