  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִלִּיתָ֣ אֶת אֵ֗לֶּה וְ/שָׁ֨כַבְתָּ֜ עַל צִדְּ/ךָ֤ ה/ימיני שֵׁנִ֔ית וְ/נָשָׂ֖אתָ אֶת עֲוֺ֣ן בֵּית יְהוּדָ֑ה אַרְבָּעִ֣ים י֔וֹם י֧וֹם לַ/שָּׁנָ֛ה י֥וֹם לַ/שָּׁנָ֖ה נְתַתִּ֥י/ו לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/006.yaml
  text: When you have finished these[a], you shall lie down a second time on your right side, and you shall bear the iniquity of the house of Judah for forty days. I have assigned you a day for each year.
translation:
  language: zh_hans
  text: “你完成这些事以后，要再向右侧卧，并担当犹大家的罪孽四十天。我给你规定：一日代表一年[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一日顶一年，一日顶一年”。重复的说法强调以西结侧卧的日数与其所代表的年数相对应。
    reason: 说明原文重复措辞及其象征对应关系。
lexical_decisions:
- source_word: וְכִלִּיתָ אֶת־אֵלֶּה
  choice: 你完成这些事以后
  rationale: 连接词加完成式在上下文中引出前一象征行动完成后的下一行动；“这些事”自然承接前文所述各项行动。
- source_word: וְשָׁכַבְתָּ עַל־צִדְּךָ הַיְמָנִי שֵׁנִית
  choice: 要再向右侧卧
  rationale: שֵׁנִית表示动作再次进行；“向右侧卧”简洁自然，也准确表达身体姿势。
- source_word: וְנָשָׂאתָ אֶת־עֲוֺן
  choice: 并担当……的罪孽
  rationale: נשא עון可涵盖承担罪责、罪孽及其后果。“担当……的罪孽”保留这一语义宽度，不把含义限缩为单纯受罚或仅有罪责。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: “犹大家”保留先知书中“某某家”的群体称谓，指犹大国及其人民。
- source_word: אַרְבָּעִים יוֹם
  choice: 四十天
  rationale: 汉语以时量补语直接表达持续时间，无须另加介词。
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: 一日代表一年
  rationale: 以现代汉语清楚表达象征行动中日与年的对应关系；原文的重复形式在脚注中注明。
- source_word: נְתַתִּיו לָךְ
  choice: 我给你规定
  rationale: נתן在此语境中表示上帝为以西结指定象征性的日年对应尺度；“规定”比泛泛的“给”更符合语境。
theological_decisions:
- issue: עָוֺן在象征行动中的含义
  choice: 译作“罪孽”并与“担当”搭配
  alternative: 译作“罪责”或“罪的刑罚”
  rationale: 该词在此可同时涉及百姓的罪恶、罪责及其后果；“担当……的罪孽”保留经文的神学张力，不将意义限定为其中一项。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“向右侧卧”“犹大家”“担当……的罪孽”兼顾普通读者的可懂度与先知书语体；用脚注保存希伯来文刻意重复的形式。
