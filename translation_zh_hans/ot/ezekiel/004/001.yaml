  text: וְ/אַתָּ֤ה בֶן אָדָם֙ קַח לְ/ךָ֣ לְבֵנָ֔ה וְ/נָתַתָּ֥ה אוֹתָ֖/הּ לְ/פָנֶ֑י/ךָ וְ/חַקּוֹתָ֥ עָלֶ֛י/הָ עִ֖יר אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/001.yaml
  text: And you[a], son of man, take for yourself a brick, set it before you, and engrave on it a city, Jerusalem.
translation:
  language: zh_hans
  text: “人子啊，你要拿一块砖，摆在自己面前，在上面刻画[a]一座城，就是耶路撒冷。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“刻上”或“画出”。希伯来语动词可指雕刻、铭刻；这里是要在砖上做出耶路撒冷的图样。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 直译为“人子”，是《以西结书》中上帝对先知反复使用的称呼；保留原文表达，不解释性地改作“凡人”或“必死的人”。
- source_word: לְבֵנָה
  choice: 一块砖
  rationale: 该名词通常指砖；量词“块”符合现代汉语习惯，同时不把它过度具体化为“砖板”或“泥版”。
- source_word: וְנָתַתָּה אוֹתָהּ לְפָנֶיךָ
  choice: 摆在自己面前
  rationale: 准确表达“把它放置在你面前”；“摆”自然地呈现为后续象征行动作准备的放置动作。
- source_word: וְחַקּוֹתָ עָלֶיהָ
  choice: 在上面刻画
  rationale: חקק可指雕刻或铭刻；“刻画”既保留在砖面刻制的具体动作，也适合表达制作城市图像的语境。脚注保留“刻上/画出”等可能理解。
- source_word: עִיר אֶת יְרוּשָׁלִָם
  choice: 一座城，就是耶路撒冷
  rationale: 原文先说“一座城”，继而以“耶路撒冷”加以说明；“就是”在现代汉语中自然地表达这种同位说明关系，并保留“一座城”的不定形式。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用该地名通行的现代中文译名。
theological_decisions:
- issue: בֶן אָדָם是否解释性翻译
  choice: 保留“人子”
  alternative: 凡人；必死的人
  rationale: 此处是《以西结书》特有的反复称呼。直译既保留其文学功能，也避免因新约用法或某种神学理解而提前消解其在本书中的含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人子啊”保留先知书称呼的正式感；“你要拿……摆……刻画……”清楚呈现连续命令。脚注标记紧随存在词义选择的“刻画”，避免误指其他词语。
