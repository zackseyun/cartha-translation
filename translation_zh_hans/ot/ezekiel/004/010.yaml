base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/010.yaml
  text: And your food that you shall eat shall be by weight[a], twenty shekels a day[b]; from time to time you shall eat it.
translation:
  language: zh_hans
  text: 你所吃的食物要按重量称量，每天二十舍客勒[a]；你要每隔一段时间吃一次[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “舍客勒”在这里是重量单位，不一定指钱币。
    reason: cultural_note
  - marker: b
    text: 原文直译为“从一个时刻到另一个时刻”，也可译作“按时吃”或“不时地吃”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכָלְךָ אֲשֶׁר תֹּאכֲלֶנּוּ
  choice: 你所吃的食物
  rationale: מַאֲכָל 指食物或所吃之物；用自然的关系从句保留原文对食物的限定。
- source_word: בְּמִשְׁקוֹל
  choice: 按重量配给
  rationale: מִשְׁקוֹל 明确指重量；结合围城定量供应的语境，“配给”自然表达食物须称量而食，但不改变其核心含义。
- source_word: עֶשְׂרִים שֶׁקֶל לַיּוֹם
  choice: 每天二十舍客勒
  rationale: 保留古代重量单位“舍客勒”，并以“每天”表达 לַיּוֹם 的每日配额含义。
- source_word: מֵעֵת עַד עֵת
  choice: 按规定的时间
  rationale: 该习语字面为“从一个时刻到另一个时刻”，在这里表示按间隔或指定时刻进食；正文采用清楚自然、又不过度限定具体时刻的表达，并以脚注保留字面形式。
- source_word: תֹּאכֲלֶנּוּ
  choice: 吃
  rationale: 宾语“食物”在中文语境中已清楚，省略重复代词更自然；命令语气由“要”承载。
