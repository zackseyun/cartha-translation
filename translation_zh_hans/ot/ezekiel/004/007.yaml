base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/007.yaml
  text: And toward the siege of Jerusalem you shall set your face[a], with your arm bared, and you shall prophesy against it.
translation:
  language: zh_hans
  text: 你要坚定地面向耶路撒冷的围城，露出你的膀臂，也要说预言攻击它[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “攻击它”也可译作“关于它说预言”。原文介词的含义可以较宽；但在围城和审判的语境中，“攻击它”更贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצוֹר
  choice: 围城
  rationale: 该名词指围困或受围的状态；这里是先知以行动预示耶路撒冷将遭围困，译作“围城”简洁自然，又不把含义过度具体化为攻城设施。
- source_word: תָּכִין פָּנֶיךָ
  choice: 板起脸来
  rationale: 原文是“使你的脸坚定／朝向”，表达坚定而严厉地面对目标。“板起脸来”是现代汉语中自然、庄重的表达，并保留审判语境中的决绝意味。
- source_word: זְרֹעֲךָ חֲשׂוּפָה
  choice: 露出膀臂
  rationale: 原文为无动词结构，直译是“你的膀臂露着”。“露出膀臂”保留行动意象，暗示准备施力，但不在正文中明说其象征意义。
- source_word: וְנִבֵּאתָ עָלֶיהָ
  choice: 向城说预言攻击它
  rationale: נבא 与 עַל 连用在审判语境中常有敌对指向。此处补出“城”以明确阴性代词所指的耶路撒冷；“说预言攻击它”既表达敌对力度，也保留这是先知宣告的性质。
theological_decisions:
- issue: 先知话语对耶路撒冷的指向
  choice: 译为“向城说预言攻击它”，体现审判语境中的敌对意味。
  alternative: 可较中性地译为“向城说关于它的预言”。
  rationale: 介词 עַל 的范围可以比“攻击”更广，但本段是预示耶路撒冷被围和受审判的象征行动，因此敌对、审判性的含义在上下文中更突出；脚注保留较中性的可能。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“围城”承接上文行动象征；“膀臂”比“胳膊”更适合经文庄重语体。正文中的脚注标记与脚注完全对应。
