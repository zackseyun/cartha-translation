base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/008.yaml
  text: And behold[a], I have put ropes on you[b], and you will not turn yourself from your side to your other side until you have completed the days of your siege.
translation:
  language: zh_hans
  text: 看哪，我已经把绳索[a]套在你身上；你将不能从你这一侧翻到另一侧[b]，直到你围城的日子满了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绳索”也可译作“粗绳”或“捆绑用的带子”。
    reason: lexical_alternative
  - marker: b
    text: 直译是“从你的这一侧到你的那一侧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意、带有先知宣告庄重感的提示语气。
- source_word: נָתַתִּי עָלֶיךָ
  choice: 我已把……加在你身上
  rationale: 以“已”体现完成式所呈现的既成行动；“加在你身上”在现代汉语中自然，也保留 עַל 的空间关系。
- source_word: עֲבוֹתִים
  choice: 绳索
  rationale: 该复数名词指用于捆绑的粗绳或索具；“绳索”清楚、庄重，并不预先限定具体材质。
- source_word: וְלֹא תֵהָפֵךְ
  choice: 你将不能……翻
  rationale: 既保留 וְלֹא 的直接否定和未来指向，也让汉语自然表达绳索造成的身体限制；避免译成“不得”而误成单纯禁令。
- source_word: מִצִּדְּךָ אֶל צִדֶּךָ
  choice: 从你这一侧翻到另一侧
  rationale: 保留两个带第二人称后缀的“侧”，同时用自然汉语表达身体由一侧翻向另一侧。
- source_word: עַד כַּלּוֹתְךָ יְמֵי
  choice: 直到你守满……的日子
  rationale: “守满”自然表达完成被指定的一段日子，并保留先知持续维持姿势这一行动背景。
- source_word: מְצוּרֶךָ
  choice: 围城
  rationale: 保留“围困、围城”的核心意义，不在正文中明确判定以西结是实际被围者还是象征性演示围城者。
theological_decisions:
- issue: “你的围城”所指为何
  choice: 正文译作“围城的日子”，让上下文说明这是以西结所演示的象征性围城。
  alternative: 译作“你被围困的日子”或“你围困城的日子”。
  rationale: 希伯来语名词加第二人称后缀本身没有明确标出主客关系；加上主动或被动会过早消除原文在语法上的含混。
- issue: 不能翻身是预告、禁令还是受制结果
  choice: 译作“你将不能……翻”。
  alternative: 译作“你不可翻”或“使你不能翻”。
  rationale: 原文以连接词加否定未完成式陈述；“将不能”既贴近形式，又在上下文中容许绳索导致受限的含义，而不把因果关系完全写死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知文本的标记性语气；分号呈现神施加绳索与以西结不能翻身之间紧密但未明说的逻辑关系。
