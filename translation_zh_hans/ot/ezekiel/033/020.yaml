  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י אִ֧ישׁ כִּ/דְרָכָ֛י/ו אֶשְׁפּ֥וֹט אֶתְ/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽלפ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/020.yaml
  text: Yet you say[a], ‘The way of the Lord is not just.’ I will judge each of you according to his ways[b], O house of Israel.
translation:
  language: zh_hans
  text: 然而，你们说[a]：“主的行事方式不公平。”以色列家啊，我必照你们各人所行的审判你们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“但你们说”。这里的连接词带有承接和转折意味。
    reason: discourse_alternative
  - marker: b
    text: 原文直译近于“各人按他的道路”。本节向整个以色列家说话，同时强调每个人都要按自己的行为受审判。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: 然而，你们说
  rationale: 连接词 ו 在此承接上文，并带出以色列人对上帝申辩的反驳；“然而”自然表达这种转折。
- source_word: לֹא יִתָּכֵן
  choice: 不公平
  rationale: תכן 的尼法勒形式在本语境中不是指道路未被“建立”，而是指以色列人认为主审判人的方式不公允。“不公平”是现代汉语中自然、清楚的表达，同时保留其道德和司法意味。
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: 主的道
  rationale: דֶּרֶךְ 可指道路，也可比喻行事方式；“主的道”保留原文意象和一定的语义张力。אֲדֹנָי 是神圣称号，译作“主”。
- source_word: אִישׁ כִּדְרָכָיו
  choice: 照你们各人所行的
  rationale: אִישׁ 在这里有逐一分配的作用，强调个人责任；复数 דְּרָכָיו 指一个人的种种行为或生活方式。汉语“各人所行的”自然表达这一点，又不必添加原文没有明确强调的性别信息。
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: 审判你们
  rationale: שׁפט 在此具有司法含义；复数宾语“你们”保留对整个群体的宣告，而前面的“各人”说明审判逐人施行。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 这是对立约群体的直接称呼；“以色列家”保留原文的集体称谓，“啊”自然标明呼语。
theological_decisions:
- issue: 以色列人对主审判方式的指控
  choice: 主的道不公平
  alternative: 主的道不公正／主的做法不对
  rationale: 上下文讨论上帝审判是否公允。“不公平”在现代汉语中最直接；保留“道”则避免把 דֶּרֶךְ 的比喻完全解释为“做法”。
- issue: 群体称呼中的个人责任
  choice: 以色列家啊，我必照你们各人所行的审判你们
  alternative: 以色列家啊，我必照各人的道路审判你们
  rationale: 原文同时使用群体性的复数宾语和分配性的单数表达。译文保留“以色列家／你们”的群体层面，也用“各人”清楚表达个人责任，不把其中任何一面消解掉。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主的道”保留先知文本的传统意象；“不公平”和“各人所行的”则使普通现代读者容易理解。所有脚注标记均已置于正文相应位置。
