source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹר֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֵּ֤ן אֲמַרְתֶּם֙ לֵ/אמֹ֔ר כִּֽי פְשָׁעֵ֥י/נוּ וְ/חַטֹּאתֵ֖י/נוּ עָלֵ֑י/נוּ וּ/בָ֛/ם אֲנַ֥חְנוּ נְמַקִּ֖ים וְ/אֵ֥יךְ נִֽחְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/010.yaml
  text: 'And you[a], son of man, say to the house of Israel, ‘Thus you have said: “Surely our transgressions and our sins are upon us, and in them we are wasting away; so how can we live?”’'
translation:
  language: zh_hans
  text: “你，人子啊，要对以色列家说：‘你们这样说道：“我们的过犯和罪恶都压在我们身上，我们就在其中日渐衰残[a]；我们怎能活下去呢？”’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “日渐衰残”也可译作“渐渐腐朽”或“日益消瘦”。希伯来语动词含有衰败、腐朽或在罪责与审判之下逐渐耗尽的意味。
    reason: 说明 נְמַקִּים 的词义范围及可行译法。
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 保留以西结书中固定的先知称呼及其希伯来语意象；在现代中文中庄重而且为读者熟悉。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留“家”的集体和盟约性意象，而不简化为“以色列人”。
- source_word: כֵּן אֲמַרְתֶּם
  choice: 你们这样说道
  rationale: 表达 כֵּן 的指示作用，并以自然中文引出下文所引用的话；不强行限定为一次已经结束的发言。
- source_word: פְשָׁעֵינוּ וְחַטֹּאתֵינוּ
  choice: 我们的过犯和罪恶
  rationale: 分别保留两个希伯来词；“过犯”体现 פשע 所含的越界、悖逆意味，“罪恶”自然表达 חטאות 的道德含义。
- source_word: עָלֵינוּ
  choice: 都压在我们身上
  rationale: 保留“在……之上”的负担意象，同时让现代中文读者感受到罪责及其后果的重压。
- source_word: וּבָם
  choice: 我们就在其中
  rationale: 尽量保留介词 ב 的范围或处境含义，不直接改译为纯粹因果性的“因它们”，从而保存原文可能兼具处境与原因的张力。
- source_word: נְמַקִּים
  choice: 日渐消亡
  rationale: 表达分词所呈现的持续衰败过程；正文采用自然、庄重且不过度形象化的说法，并以脚注交代“腐朽、衰残”等词义色彩。
- source_word: וְאֵיךְ נִחְיֶה
  choice: 我们怎能活下去呢？
  rationale: 自然传达在罪责和审判之下对存活可能性的绝望追问。
theological_decisions:
- issue: 百姓的话应主要呈现为认罪，还是呈现为审判之下的绝望
  choice: 译为既承认罪责，又带有深切绝望的陈述和追问
  alternative: 仅作为不带绝望色彩的认罪来表达
  rationale: “日渐消亡”和“怎能活下去”表明这不只是承认罪行，也包含对罪之重压及其后果的绝望；译文保留这一张力，不预先加入本节尚未明说的悔改或赦免结论。
- issue: וּבָם 是处境性还是因果性
  choice: “就在其中”
  alternative: “因这些罪”或“在这些罪的重压下”
  rationale: 希伯来介词可在语境中带出原因，但直译的处境性表达仍然可懂，也避免把原文的语义范围收窄为单一因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“人子”“以色列家”保留本书先知话语的固定表达；“压在我们身上”“日渐消亡”“活下去”则避免生硬仿古，同时维持原文沉重、绝望的语气。脚注标记 [a] 已置于其所说明的词语之后。
