  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: וַיְהִי在此引出新的叙事段落，并与后面的“耶和华的话”共同构成先知书常见的启示公式。现代汉语用“临到”自然表达事件的发生，无须另译为“于是发生了”。
- source_word: דְבַר
  choice: 话
  rationale: דְבַר־יְהוָה是先知书中的固定表达；译作“耶和华的话”既准确，又保留神圣启示公式的传统与神学分量，比“信息”更贴近原文形式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中通行的专名“耶和华”对应四字神名，明确保留其作为以色列之神名字的性质，而不改译为一般称号“主”。
- source_word: אֵלַי
  choice: 我
  rationale: אֵלַי直译为“向我／到我这里”；汉语固定表达“话临到我”已经清楚体现方向关系，因此无需机械加入介词。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接话语。汉语以“说”承接最自然，也保留原文公式化、庄重的语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列之神的四字神名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，保留专名性质；“雅威”是较接近学界常见拟音的可行译法，但不必据此把原文尚不能完全确定的古代读音定为正文唯一形式。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“耶和华的话临到我，说”保留希伯来文启示公式及其节奏；本节不设脚注，因为正文没有需要以异文或文本问题说明的歧义。
