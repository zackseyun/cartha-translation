source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם בְּנֵ֣י עַמְּ/ךָ֗ הַ/נִּדְבָּרִ֤ים בְּ/ךָ֙ אֵ֣צֶל הַ/קִּיר֔וֹת וּ/בְ/פִתְחֵ֖י הַ/בָּתִּ֑ים וְ/דִבֶּר חַ֣ד אֶת אַחַ֗ד אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר בֹּֽאוּ נָ֣א וְ/שִׁמְע֔וּ מָ֣ה הַ/דָּבָ֔ר הַ/יּוֹצֵ֖א מֵ/אֵ֥ת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/030.yaml
  text: And you[a], son of man, the sons of your people who talk about you beside the walls and in the doorways of the houses, each one speaking with another, each man with his brother, saying[b], ‘Come now and hear what the word is that comes from Yahweh.’
translation:
  language: zh_hans
  text: “至于你，人子啊，你本族的人在墙边和各家门口谈论你[a]。他们彼此交谈，各人对自己的弟兄说：‘来吧，听一听从雅威那里发出的是什么话[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“跟你谈话”；不过按上下文，更可能是他们彼此谈论以西结。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“从雅威那里出来的”；这里指从他而出的先知性话语。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；保留希伯来语意象及其反复出现的修辞作用。
- source_word: בְּנֵי עַמְּךָ
  choice: 你本族的人
  rationale: 希伯来语直译为“你人民的众子”；现代汉语用“你本族的人”自然表达同族群体，又不把范围缩限为实际儿子。
- source_word: הַנִּדְבָּרִים בְּךָ
  choice: 谈论你
  rationale: 介词 ב 与 דבר 连用在此较可能表示“以你为谈论对象”；上下文描写众人私下彼此议论，但脚注保留“跟你谈话”的语法可能。
- source_word: אֵצֶל הַקִּירוֹת וּבְפִתְחֵי הַבָּתִּים
  choice: 在墙边和各家门口
  rationale: 分别表达靠近墙壁及房屋入口的地点；“各家门口”符合现代汉语的日常场景。
- source_word: וְדִבֶּר חַד אֶת אַחַד אִישׁ אֶת אָחִיו
  choice: 他们彼此交谈，各人对自己的弟兄说
  rationale: 保留原文两个相近的相互表达，并以现代汉语可读的方式呈现；“弟兄”保留同族成员之间的亲属式称谓。
- source_word: בֹּאוּ נָא וְשִׁמְעוּ
  choice: 来吧，听一听
  rationale: נָא 带有邀请或催促语气，“吧”自然传达这种语气；“听一听”符合口头邀请。
- source_word: מָה הַדָּבָר
  choice: 是什么话
  rationale: דָּבָר 在这里指从上帝而来的先知性话语；“话”保留其基本词义和先知语境。
- source_word: הַיּוֹצֵא מֵאֵת יְהוָה
  choice: 从雅威那里发出的
  rationale: “发出”保留 יצא 所含“出来、发出”的动态意象，同时在汉语中自然地描述源自上帝的先知话语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代；“雅威”对应 Yahweh 的常见现代拟音。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文以“雅威”保留其专名性质，不用称号“主”代替；“耶和华”是传统汉语形式，但其发音依据较晚形成的混合读法。
- issue: הַנִּדְבָּרִים בְּךָ 所表达的关系
  choice: 他们谈论以西结
  alternative: 他们跟以西结谈话
  rationale: 本节随即描述这些人彼此交谈，并相互招呼去听先知的信息，因此“谈论你”更符合语境；不过介词结构本身容许另一理解，故以脚注保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于你，人子啊”保留先知书神谕开头的呼告感；正文避免生硬直译“你人民的众子”，但通过“你本族的人”保留群体归属。两个脚注标记均置于正文相应词组之后。
