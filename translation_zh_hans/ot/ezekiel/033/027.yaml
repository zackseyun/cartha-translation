language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כֹּֽה תֹאמַ֨ר אֲלֵ/הֶ֜ם כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֞א אֲשֶׁ֤ר בֶּֽ/חֳרָבוֹת֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וַֽ/אֲשֶׁר֙ עַל פְּנֵ֣י הַ/שָּׂדֶ֔ה לַ/חַיָּ֥ה נְתַתִּ֖י/ו לְ/אָכְל֑/וֹ וַ/אֲשֶׁ֛ר בַּ/מְּצָד֥וֹת וּ/בַ/מְּעָר֖וֹת בַּ/דֶּ֥בֶר יָמֽוּתוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/027.yaml
  text: 'Thus you shall say to them[a], ‘Thus says the Lord GOD: As I live, surely those who are in the ruins will fall by the sword, and whoever is on the face of the field I have given to the wild animals to be devoured[c][b], and those who are in the strongholds and in the caves will die by pestilence.’'
translation:
  language: zh_hans
  text: 你要对他们这样说：“主耶和华如此说：我指着我的永生起誓，在废墟[a]中的人必倒在刀下；在田野上的人，我已把他交给野兽吞吃[b]；在堡垒和洞穴中的人必死于瘟疫[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “废墟”也可译作“荒废之地”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“我已把他交给野兽作食物”；其中“他”是单数，可能表示田野上的人一个一个都包括在内。
    reason: source_ambiguity
  - marker: c
    text: “瘟疫”也可译作“疫病”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמַר ... כֹּה אָמַר
  choice: 你要……这样说……如此说
  rationale: 保留先知传信公式的重复与庄重语气，同时符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 兼顾复合神名的两个成分，并采用现代中文圣经读者熟悉而自然的形式。
- source_word: חַי אָנִי אִם לֹא
  choice: 我凭我的永生起誓……必
  rationale: 这是神以自己的生命起誓的固定公式；以“起誓”和“必”传达原文誓言结构及强烈肯定语气。
- source_word: בֶּחֳרָבוֹת
  choice: 在废墟中
  rationale: 指遭毁坏、荒废之处；“废墟”在本段灾后语境中具体清楚。
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: 必倒在刀下
  rationale: 保留“倒下”与“刀剑”的原文意象，又能自然表达死于兵刃。
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: 在田野上
  rationale: 较贴近原文“在田野表面/田野上”，并传达身处无遮蔽之地的情景，不额外改作“旷野”。
- source_word: לַחַיָּה נְתַתִּיו לְאָכְלוֹ
  choice: 我已把他交给野兽吞吃
  rationale: 保留原文阳性单数代词“他”，也以自然汉语表达交给野兽作为食物的结果。
- source_word: בַּמְּצָדוֹת וּבַמְּעָרוֹת
  choice: 在堡垒和洞穴中
  rationale: 分别表达防御性藏身处与天然洞穴，不把前者过度限定为特定建筑或山地据点。
- source_word: בַּדֶּבֶר יָמוּתוּ
  choice: 必死于瘟疫
  rationale: דֶּבֶר指造成广泛死亡的疫病，也是先知书常见的审判用语；“瘟疫”兼具准确性与庄重语体。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”在简体中文中庄重、易懂，并同时保留“主”与神名两个成分；不借译法引入特定宗派立场。
- issue: 神圣誓言 חַי אָנִי אִם לֹא 的表达
  choice: 我凭我的永生起誓……必
  alternative: 我活着；我指着我的永生起誓
  rationale: 原文是神以自身永生担保宣告的确定性。“凭我的永生起誓”显明誓言功能，但不扩展审判内容。
- issue: 单数代词 נְתַתִּיו 的指涉
  choice: 保留“他”，并注释其可能具有逐一概括的用法
  alternative: 译作复数“他们”；省去代词，译作“交给野兽吞吃”
  rationale: 原文在复数/泛指语境中突然使用阳性单数后缀，可能是分配性单数。正文保留这一张力，脚注说明，不武断改为复数。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留先知传信公式、神圣誓言和三重审判的平行结构；标点将长句分为三个对应分句。正文不回避原文单数代词在泛指语境中的不协调，而以脚注说明其可能的分配性用法。
