  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/אַתָּה כִּֽי הִזְהַ֨רְתָּ רָשָׁ֤ע מִ/דַּרְכּ/וֹ֙ לָ/שׁ֣וּב מִמֶּ֔/נָּה וְ/לֹא שָׁ֖ב מִ/דַּרְכּ֑/וֹ ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/009.yaml
  text: But if you warn a wicked man to turn from his way[a], and he does not turn from his way, he will die in his iniquity[b]; but you will have delivered your soul.
translation:
  language: zh_hans
  text: 但你若警告恶人，要他离开自己的道路，他却不离开自己的道路，他必死在自己的罪孽中[a]；至于你，你却救了自己的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “死在自己的罪孽中”也可理解为“因自己的罪孽而死”。
    reason: alternative_reading
  - marker: b
    text: “性命”所译的希伯来词也可译作“自己”或“生命”；这里不一定指与身体分离的“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: 警告
  rationale: 该词为זהר的使役形，在守望者语境中指发出警告；“警告”简洁自然。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 阳性单数形容词在此作名词用，指行为邪恶的人；“恶人”保留其道德含义和个体指称。
- source_word: מִדַּרְכּוֹ ... לָשׁוּב מִמֶּנָּה
  choice: 要他离开自己的道路
  rationale: “道路”保留先知文学中有关生活方式和道德行为的比喻；补出“要他”自然表达警告的内容和目的。
- source_word: וְלֹא שָׁב מִדַּרְכּוֹ
  choice: 他却不离开自己的道路
  rationale: 依照希伯来文重复“自己的道路”，不以代词替代，并以“却”体现预期与实际反应的转折。
- source_word: בַּעֲוֺנוֹ
  choice: 在自己的罪孽中
  rationale: 保留介词ב所表达的处境或范围，同时让其可能具有的原因含义保持开放。
- source_word: הִצַּלְתָּ
  choice: 救了
  rationale: 使役形表示搭救、救出；这里指守望者履行警告责任后保全自己，不额外引入超出上下文的救恩体系。
- source_word: נַפְשְׁךָ
  choice: 自己的性命
  rationale: נֶפֶשׁ在此主要指人的生命或本人，而非特指与身体分离的非物质灵魂；“性命”符合上下文，也庄重自然。
- source_word: וְאַתָּה ... וְאַתָּה
  choice: 但你若……至于你，你却……
  rationale: 重复的人称代词带有强调作用；此译法凸显恶人的结局与守望者责任之间的对照。
theological_decisions:
- issue: 末句נֶפֶשׁ的含义
  choice: 译为“自己的性命”，按上下文理解为生命或本人得以保全
  alternative: 译为“自己的灵魂”
  rationale: 上下文关注守望者因是否忠实警告而承担的流血责任及其生命后果，并不要求把该词限定为后期身心二分意义上的“灵魂”。
- issue: “死在自己的罪孽中”所表达的责任关系
  choice: 保留“在……中”的紧凑表达，使处境义与原因义并存
  alternative: 译为“因自己的罪孽而死”
  rationale: 希伯来文介词可表达身处罪孽之中，也可带有原因意味；正文不把这种张力化约为单一解释，同时明确死亡与恶人自己的罪孽相连。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“道路”的伦理比喻和原文的重复结构；用“至于你，你却”传达人称代词的强调与前后命运的鲜明对照。
