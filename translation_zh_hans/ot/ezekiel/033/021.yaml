base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/021.yaml
  text: And it happened in the twelfth year[a], in the tenth month, on the fifth day of the month of our exile, that the fugitive from Jerusalem came to me, saying[b], “The city has been struck down.”
translation:
  language: zh_hans
  text: 我们被掳的第十二年十月初五，有一个从耶路撒冷逃出来的人[a]到我这里，说：“城已经被攻破了[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从耶路撒冷来的幸存者”。
    reason: lexical_alternative
  - marker: b
    text: 或译“城已经陷落了”。希伯来文较直译为“城已经被击倒了”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 有
  rationale: 该叙事形式引出新的事件；中文通过日期之后的“有……”自然推进叙事，无须机械译出“事情发生了”。
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה בָּעֲשִׂרִי בַּחֲמִשָּׁה לַחֹדֶשׁ לְגָלוּתֵנוּ
  choice: 我们被掳后的第十二年十月初五
  rationale: 按现代汉语日期表达整合原文的纪年公式；“被掳”保留 גָּלוּת 所指的强制迁徙处境，“初五”自然表达该月第五日。
- source_word: הַפָּלִיט
  choice: 逃出来的人
  rationale: 指从灾难中逃脱者；此译既贴近词义，又避免“逃犯”在现代汉语中暗含犯罪意味，同时以脚注保留“幸存者”的可能理解。
- source_word: מִירוּשָׁלִַם
  choice: 从耶路撒冷
  rationale: 直接译出来源地点。
- source_word: לֵאמֹר
  choice: 说
  rationale: 以现代汉语常用的引语结构表达引出直接话语的不定式。
- source_word: הֻכְּתָה הָעִיר
  choice: 城已经被攻破了
  rationale: 保留动词的被动语态，并按城池遭军事打击的语境自然表达；脚注说明更直译的措辞及“陷落”的可选译法。
