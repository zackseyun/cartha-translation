source:
  edition: WLC
  text: כָּל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לֹ֥א תִזָּכַ֖רְנָה ל֑/וֹ מִשְׁפָּ֧ט וּ/צְדָקָ֛ה עָשָׂ֖ה חָי֥וֹ יִֽחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/016.yaml
  text: None of the sins that he committed will be remembered against him[a]; he has done justice and righteousness; he shall surely live.
translation:
  language: zh_hans
  text: 他所犯的一切罪都不会被记念[a]；他行了公平和公义，他必定存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译“不据此追究他”。希伯来文直译是“不被向他记念”，在这里含有司法性的意思。
    reason: 说明希伯来语表达的字面意象及其语境中的司法含义。
lexical_decisions:
- source_word: כָּל חטאתו אֲשֶׁר חָטָא
  choice: 他所犯的一切罪
  rationale: חטאתו 形式上是单数“他的罪”，但与 כָּל、关系从句以及复数动词 תִזָּכַרְנָה 配合，具有集合兼逐项的含义；中文用“一切罪”自然表达其分配性。
- source_word: לֹא תִזָּכַרְנָה לוֹ
  choice: 都不会被记念
  rationale: 保留 זכר 尼法勒式“被记念”的基本意象；上下文赋予 לֹא…לוֹ 司法性的“不记在他身上、不据此追究”含义，具体语义在脚注说明，以免正文过度解释。
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: 公平和公义
  rationale: 这一常见先知性并列语在此指合乎正道的行为；“公平和公义”既保留两个词的区别和神学分量，也符合现代中文圣经语体。
- source_word: עָשָׂה
  choice: 行了
  rationale: “行了公平和公义”贴近 עשה 的普通动作义，又比生硬的“做了公平和公义”自然庄重。
- source_word: חָיוֹ יִחְיֶה
  choice: 必定存活
  rationale: 不定词绝对式与未完成式同根连用表示强调和确定；“必定存活”简洁传达“确实要活”的强意。
theological_decisions:
- issue: 上帝不记念罪的司法含义
  choice: 正文译“不会被记念”，脚注说明“不据此追究他”
  alternative: 直接译“不再追究他”或“不算在他身上”
  rationale: 正文保留希伯来文“记念”的神学与修辞意象，同时借脚注交代本节司法—道德语境，既不削弱其后果，也不引入超出经文的后期教义表述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“记念”保留经文传统而不晦涩；“公平和公义”维持先知文献中的固定伦理并列；末句用“必定”体现希伯来语的强调结构。
