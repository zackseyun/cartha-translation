  text: בְּ/אָמְרִ֣/י לָ/רָשָׁ֗ע רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א דִבַּ֔רְתָּ לְ/הַזְהִ֥יר רָשָׁ֖ע מִ/דַּרְכּ֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/008.yaml
  text: When I say to the wicked[a], ‘Wicked one, you shall surely die,’ and you do not speak to warn the wicked from his way, that wicked man shall die in his iniquity, but I will require his blood from your hand.
translation:
  language: zh_hans
  text: 当我对恶人说：‘恶人哪，你必定死！’而你若不开口警告那恶人离开他的道路，那恶人必在自己的罪孽中死去；至于他的血，我要从你手中追讨[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要追究你对他的死所负的责任。”
    reason: 解释“从你手中追讨他的血”这一希伯来语司法性惯用表达。
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: 我……说
  rationale: בְּ 加不定式结构在此引出时间或情境从句；结合后句的条件关系，译文以“我……说……如果……”自然表达原文语势。
- source_word: לָרָשָׁע / רָשָׁע
  choice: 对恶人／恶人哪
  rationale: רָשָׁע 在本段指品行邪恶的人；第二处为呼格，译作“恶人哪”保留直接、郑重的警告。
- source_word: מוֹת תָּמוּת
  choice: 你必定死
  rationale: 不定式绝对形与未完成式连用，强调死亡的确定性；“必定死”简洁而庄重。
- source_word: וְלֹא דִבַּרְתָּ
  choice: 如果你不开口
  rationale: 该完成式处于条件性情境中，中文用“如果……不……”表达；“开口”自然体现实际发出警告的行动。
- source_word: לְהַזְהִיר
  choice: 警告
  rationale: זהר 的使役形在此意为发出警戒或劝诫；“警告”准确、通俗。
- source_word: מִדַּרְכּוֹ
  choice: 离开他的道路
  rationale: מִן 表示使人脱离其所行的方向；“道路”保留原文以道路喻生活方式和行为的意象。
- source_word: הוּא רָשָׁע
  choice: 那恶人
  rationale: 独立代词加名词带有重提和强调作用；“那恶人”在中文中自然承接前文。
- source_word: בַּעֲוֺנוֹ
  choice: 在自己的罪孽中
  rationale: עָוֹן 可指罪孽及其罪责；保留介词表达为“在……中”，不把其含义缩减为单纯的原因关系。“自己的”明确罪孽属于恶人本人。
- source_word: וְדָמוֹ
  choice: 至于他的血
  rationale: “血”是原文关于死亡责任的司法性意象；加“至于”突出转折后的另一个责任主体，同时保留该意象。
- source_word: מִיָּדְךָ אֲבַקֵּשׁ
  choice: 我要从你手中追讨
  rationale: 这是表示追究死亡责任的固定表达；直译保留“手”的意象和司法语气，脚注提供意义较明白的译法。
theological_decisions:
- issue: 恶人自身的罪责与守望者失职的责任
  choice: 保留“恶人在自己的罪孽中死去”与“他的血从你手中追讨”两个并列断言。
  alternative: 将守望者理解为代替恶人承担其罪，或把对守望者的追责仅视为没有实质意义的修辞。
  rationale: 原文同时确认恶人为自己的罪孽而死，也确认未尽警告责任者要为他的血被追讨；译文不消解这两方面之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“恶人哪”“必定死”“罪孽”“追讨”等措辞保留先知宣告的严肃力度；句法按中文习惯处理，同时保存“道路”“血”“手”等重要原文意象。
