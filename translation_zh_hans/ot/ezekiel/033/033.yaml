  text: וּ/בְ/בֹאָ֑/הּ הִנֵּ֣ה בָאָ֔ה וְ/יָ֣דְע֔וּ כִּ֥י נָבִ֖יא הָיָ֥ה בְ/תוֹכָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/033.yaml
  text: When it comes—and look, it is coming—then they will know that a prophet has been among them.
translation:
  language: zh_hans
  text: 这事临到的时候——看哪，这事要临到了——他们就会知道，他们中间曾有一位先知。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: 这事临到时
  rationale: 阴性代词所指承接上文的事；希伯来语表达“在它来到时”。译为“这事临到时”既明确又保留事件应验的语气。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示注意并加强断言的语用功能；“看哪”庄重且为现代读者所能理解。
- source_word: בָאָה
  choice: 这事必定临到
  rationale: 原文为完成式，在此以先知性的确定语气宣告尚未来到之事；加入“必定”自然传达其确定性，而不改作单纯现在时。
- source_word: נָבִיא הָיָה בְתוֹכָם
  choice: 他们中间曾有一位先知
  rationale: 贴近原文存在句结构，保留“先知”身份及其曾在他们中间的含义。
theological_decisions:
- issue: 预言之事的时间与确定性
  choice: “这事必定临到”
  alternative: “这事正在临到”或“这事来了”
  rationale: בָאָה 的完成式与上下文共同表达未来应验的确定性；译文不将其限定为已经开始发生，也不削弱其必然性。
- issue: 百姓后来所认识的内容
  choice: “他们中间曾有一位先知”
  alternative: “他们中间有先知”
  rationale: 保留 הָיָה 的过去指向，强调事件应验后，他们会承认先知此前确实在他们中间。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“临到”适合灾祸或预言之事的到来；破折号保留原文插入式强调。无脚注标记。
