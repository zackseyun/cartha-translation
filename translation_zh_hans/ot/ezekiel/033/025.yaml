source:
  edition: WLC
  text: לָ/כֵן֩ אֱמֹ֨ר אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה עַל הַ/דָּ֧ם תֹּאכֵ֛לוּ וְ/עֵינֵ/כֶ֛ם תִּשְׂא֥וּ אֶל גִּלּוּלֵי/כֶ֖ם וְ/דָ֣ם תִּשְׁפֹּ֑כוּ וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/025.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: You eat with the blood, and you lift up your eyes to your idols, and you shed blood[c][b]; shall you then possess the land?’'
translation:
  language: zh_hans
  text: 所以，你要对他们说：‘主耶和华如此说：你们带着血吃[a]，举目仰望自己的偶像[b]，又流人的血；难道你们还要得这地为业吗？[c]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“你们在血上吃”或“你们带着血吃”，大概是指吃血尚未放净的肉，违背不可吃血的禁令。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“偶像”的希伯来词带有强烈的鄙夷意味，是以西结书常用的贬称。
    reason: cultural_note
  - marker: c
    text: 末句也可按形式译作“而你们要得这地为业”；结合上下文，更可能是带愤慨语气的反问。
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出由此而来的责问，符合现代汉语先知宣告的语流。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知使者公式，并以“耶和华”呈现四字神名；אֲדֹנָי译作“主”。
- source_word: עַל הַדָּם תֹּאכֵלוּ
  choice: 你们吃带血的肉
  rationale: 原文直译近于“在血上／带着血吃”；这里很可能指食用血未放净的肉。正文采用自然且具体的汉语，脚注保留介词结构的歧义。
- source_word: וְעֵינֵיכֶם תִּשְׂאוּ אֶל גִּלּוּלֵיכֶם
  choice: 举目仰望自己的偶像
  rationale: 保留“举目向着”的形象；“仰望”在此可表达把敬奉和倚靠投向偶像，但不进一步界定其内涵。
- source_word: גִּלּוּלֵיכֶם
  choice: 自己的偶像
  rationale: גִּלּוּלִים是以西结常用、带鄙夷色彩的偶像称谓；正文用通顺的“偶像”，脚注说明其贬义。
- source_word: וְדָם תִּשְׁפֹּכוּ
  choice: 又杀人流血
  rationale: “流血”是希伯来语常见的暴力杀人表达；加入“杀人”使现代读者不会误解为一般出血。
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: 难道你们还要得这地为业吗
  rationale: 形式上为连接词加未完成式，语境中构成愤慨的反问。“得这地为业”兼顾ירשׁ所含占有、承受产业之义。
theological_decisions:
- issue: 先知公式中神名יהוה的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文为אֲדֹנָי יהוה。译作“主耶和华”既区分两个成分，也沿用现代中文圣经读者熟悉的神名表达，不以普通称号取代专名。
- issue: 末句וְהָאָרֶץ תִּירָשׁוּ的语气
  choice: 作为愤慨反问：“难道你们还要得这地为业吗？”
  alternative: 作为陈述：“而你们要得这地为业。”
  rationale: 希伯来文没有显式疑问词，形式歧义应予承认；但前后文在谴责百姓一面犯罪、一面声称拥有土地，因此反问最能传达语用力度。脚注明示形式上的另一可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主耶和华如此说”保留先知宣告的传统庄严感；其余措辞避免过度文言化。用分号连接罪状与反问，以呈现希伯来原句连续推进的力度。
