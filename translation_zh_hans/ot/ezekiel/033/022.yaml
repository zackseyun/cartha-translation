  text: וְ/יַד יְהוָה֩ הָיְתָ֨ה אֵלַ֜/י בָּ/עֶ֗רֶב לִ/פְנֵי֙ בּ֣וֹא הַ/פָּלִ֔יט וַ/יִּפְתַּ֣ח אֶת פִּ֔/י עַד בּ֥וֹא אֵלַ֖/י בַּ/בֹּ֑קֶר וַ/יִּפָּ֣תַח פִּ֔/י וְ/לֹ֥א נֶאֱלַ֖מְתִּי עֽוֹד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/022.yaml
  text: The hand of Yahweh had been upon me in the evening[a], before the fugitive came, and he opened my mouth until he came to me in the morning. So my mouth was opened, and I was no longer mute.
translation:
  language: zh_hans
  text: 在那逃脱的人[a]来到以前的晚上，雅威的手临到我；他开了我的口。到早晨那人来到我这里时，我的口已经开了，我也不再哑口无言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逃脱的人”也可译作“幸存者”；希伯来语指从灾难中逃出并存活的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַד יְהוָה הָיְתָה אֵלַי
  choice: 雅威的手……临到我
  rationale: 保留先知书中“雅威的手”这一表示上帝大能运行、临到先知的希伯来语惯用表达；“临到我”符合现代汉语的经文语体。
- source_word: בָּעֶרֶב
  choice: 在晚上
  rationale: 直接表达该时间状语，不擅自补入“那天”等原文没有的指示成分。
- source_word: הַפָּלִיט
  choice: 那逃脱的人
  rationale: 该词指从灾难中逃出并存活的人；“逃脱的人”既体现词根含义，又避免“逃犯”可能带来的犯罪意味。
- source_word: וַיִּפְתַּח אֶת־פִּי
  choice: 他开了我的口
  rationale: 保留“开口”的具体意象，并以“他”承接雅威的行动；这也与后半句重复的“我的口……开了”相呼应。
- source_word: עַד בּוֹא אֵלַי בַּבֹּקֶר
  choice: 到早晨那人来到我这里时
  rationale: 将 עַד 表达为达到某一时间点，既保留时间推进，也避免汉语“开了我的口直到……”可能产生‘随后又闭口’的误解。
- source_word: וַיִּפָּתַח פִּי
  choice: 我的口已经开了
  rationale: 用状态性表达呈现尼法勒形式，并借“已经”自然说明到逃脱者早晨抵达时，开口一事已成事实。
- source_word: וְלֹא נֶאֱלַמְתִּי עוֹד
  choice: 我也不再哑口无言
  rationale: 准确表达先知不再处于不能说话的状态；“哑口无言”比单说“哑了”更自然，也不暗示生理残疾。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 按希伯来语四字神名的通行学术复原音译为“雅威”，保留其作为以色列之神专名的性质，不以称号代替。
- issue: “他开了我的口”的施事者
  choice: “他”指雅威
  alternative: 不明确施事者，译作“我的口开了”
  rationale: 动词虽未重述主语，但前句最近且语义最连贯的施事者是雅威；上下文也表明以西结的缄默与恢复说话出于上帝的作为。
- issue: עַד 所表达的时间关系
  choice: 译为“到……时”，让后句表明届时口已经开了
  alternative: 译为“直到……”，或按语境译为“在……以前”
  rationale: 原文 עַד 通常标示时间终点，但此处若机械译为“直到”，汉语容易误解为开口状态届时终止；本译保留终点意义，同时不强行断定开口恰在逃脱者到达时才发生。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威的手”“开了我的口”保留先知书的重要意象；语序略作调整，使两个不同的“他”（雅威与逃脱者）在汉语中不致混淆。脚注标记置于整节末尾，所注词语在正文中明确出现。
