  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ֤/י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה עַ֥ל כָּל תּוֹעֲבֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/029.yaml
  text: Then they will know that I am Yahweh[b][a], when I make the land a desolation and a waste because of all the abominations that they have committed.
translation:
  language: zh_hans
  text: 那时，他们就会知道我是雅威[a]：当我因他们所行的一切可憎之事，使这地变得一片荒凉、令人惊骇时[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们也会知道。”希伯来文的连接词可以只表示“并且”，但在这里的上下文中很可能带有结果或承接的意味。
    reason: lexical_alternative
  - marker: b
    text: “令人惊骇”也可译作“尽都荒废”。这里第二个希伯来词既可强调彻底毁坏，也可强调这种毁坏所造成的震惊、恐怖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 那时，他们就会知道
  rationale: וְ在上文审判结果的语境中带出承接和结果；“那时”以自然汉语表达这一推进，同时保留“知道、认出”的含义。
- source_word: כִּי
  choice: 我是
  rationale: כִּי在此引出“知道”的内容；汉语在“知道”后无需另译“即/说”，直接接“我是雅威”最自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: בְּתִתִּי
  choice: 因为我必……使
  rationale: ב加不定词结构在这里交代他们认识雅威的时机，而上下文也呈现审判与认识之间的因果联系；汉语以“因为我必……使”自然衔接审判缘由和结果。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 语境所指是以色列之地，而非整个世界；“这地”符合先知书具体地域语境。
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: 一片荒凉，令人惊骇
  rationale: 前一词表达荒废毁坏的状态；后一词既可强化荒凉，也可包含使人震惊、骇异的效果。此译避免同义词机械重复，并保留后者的语义张力。
- source_word: עַל כָּל תּוֹעֲבֹתָם
  choice: 因他们所行的一切可憎之事
  rationale: עַל在此表示审判的原因；תּוֹעֵבָה译作“可憎之事”，既有先知谴责的分量，也较现代汉语的名词“可憎之物”自然。
- source_word: אֲשֶׁר עָשׂוּ
  choice: 所行的
  rationale: עשה与“可憎之事”搭配时译作“行”符合汉语圣经语体，又不显古奥。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名，音译为“雅威”直接保留其专名性质；“耶和华”是传统的混合读法。
- issue: 认识雅威与审判行动之间的关系
  choice: 保留结果与因果相连的表达
  alternative: 单纯译作“他们也会知道”
  rationale: וְ可仅作并列连接词，但本节承接上文时更可能表达审判所带来的认识结果；同时不把“知道”扩展解释为得救性的信靠。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“一片荒凉，令人惊骇”兼顾两个相近名词的并列与细微差别；整体保持先知审判宣告的凝重语气。
