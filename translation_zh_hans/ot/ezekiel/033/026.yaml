base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/026.yaml
  text: You stand on your sword[a], you commit abominations, and each of you defiles his neighbor’s wife[b]. Shall you then possess the land?
translation:
  language: zh_hans
  text: 你们凭刀剑立足[a]，行可憎的事；你们各人玷污自己邻舍的妻子。难道你们还要占有这地吗[b]？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你们站在自己的刀剑之上”；这句话很可能指倚仗暴力或武力。
    reason: lexical_alternative
  - marker: b
    text: “占有”也可译作“承受……为业”。希伯来文没有显式疑问词，也可按形式读作“你们还要占有这地”，但上下文表明这是反问。
    reason: lexical_and_discourse_ambiguity
lexical_decisions:
- source_word: עֲמַדְתֶּם עַל חַרְבְּכֶם
  choice: 你们凭刀剑立足
  rationale: 原文直译为“站在你们的刀剑之上”，在此很可能指倚仗暴力或武力。“凭刀剑立足”既保留“站立”的意象，也以现代汉语传达依靠武力的含义。
- source_word: חַרְבְּכֶם
  choice: 你们的刀剑
  rationale: חֶרֶב 特指刀剑，而非泛指武器；译作“刀剑”保留具体的暴力意象。
- source_word: עֲשִׂיתֶן תּוֹעֵבָה
  choice: 行可憎的事
  rationale: תּוֹעֵבָה 是单数形式，但在此可作集合性表达；“可憎的事”既贴近形式，也自然涵盖他们一贯所行的恶事。
- source_word: וְאִישׁ
  choice: 你们各人
  rationale: אִישׁ 在复数受话语境中具有逐一分配的含义；“你们各人”自然表达“每一个人”。
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: 邻舍的妻子
  rationale: רֵעַ 可指邻舍、同伴或身边的人；“邻舍”保留其社会关系含义，并与圣经常用语相协调。
- source_word: טִמֵּאתֶם
  choice: 玷污
  rationale: טמא 的 Piel 词干表示使之不洁或加以玷污；在奸淫语境中，“玷污”兼具礼仪与道德分量。
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: 难道你们还要占有这地吗
  rationale: ירש 可表示占有或承受产业。此处针对他们自称有权据有土地而发出责问，“占有这地”最直接；“难道……还……”清楚传达上下文中的反诘语气。
theological_decisions:
- issue: 末句的语气
  choice: 译作反问：“难道你们还要占有这地吗？”
  alternative: 译作陈述：“你们还要占有这地。”
  rationale: 希伯来文没有显式疑问词，但上下文是在驳斥作恶者对土地的权利主张，因此反问最符合先知责备的语势；脚注说明原文形式上的含混。
- issue: ירש 的土地神学含义
  choice: 正文译作“占有这地”
  alternative: “承受这地为业”
  rationale: “占有”切合眼前关于据有土地的争论；“承受为业”则更突出应许产业的背景。两者均为 ירש 的真实语义，故在脚注保留后者。
- issue: 分配性的男性表达
  choice: “你们各人……邻舍的妻子”
  alternative: “每个人……别人的配偶”
  rationale: 原文 אִישׁ 与“他邻舍的妻子”明确描写男性所犯的奸淫，故不将其性别中性化；同时“你们各人”保持复数直接呼语的自然性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凭刀剑立足”保留原文意象而避免生硬直译；分号划分暴力与奸淫两组指控，末句以反问呈现先知的强烈责备。
