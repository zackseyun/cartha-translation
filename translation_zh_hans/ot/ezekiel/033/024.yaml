  text: בֶּן אָדָ֗ם יֹ֠שְׁבֵי הֶ/חֳרָב֨וֹת הָ/אֵ֜לֶּה עַל אַדְמַ֤ת יִשְׂרָאֵל֙ אֹמְרִ֣ים לֵ/אמֹ֔ר אֶחָד֙ הָיָ֣ה אַבְרָהָ֔ם וַ/יִּירַ֖שׁ אֶת הָ/אָ֑רֶץ וַ/אֲנַ֣חְנוּ רַבִּ֔ים לָ֛/נוּ נִתְּנָ֥ה הָ/אָ֖רֶץ לְ/מוֹרָשָֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/024.yaml
  text: Son of man, the inhabitants of these ruins on the land of Israel are saying, ‘Abraham was only one man, yet he possessed the land; but we are many—the land has been given to us as a possession.’
translation:
  language: zh_hans
  text: 人子啊，以色列地上住在这些废墟中的人说：‘亚伯拉罕只有一人，尚且得了这地为业；我们人数众多，这地已经赐给我们作产业了。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי הֶחֳרָבוֹת הָאֵלֶּה
  choice: 住在这些废墟中的人
  rationale: 直译其居住状态，同时以现代汉语自然表达“这些废墟的居民”。
- source_word: וַיִּירַשׁ אֶת־הָאָרֶץ
  choice: 尚且得了这地为业
  rationale: ירשׁ可指取得、占有或承受产业；“得了……为业”保留产业语义。“尚且”传达说话者以亚伯拉罕一人与自己人数众多作对比的论证。
- source_word: לְמוֹרָשָׁה
  choice: 作产业
  rationale: מוֹרָשָׁה指可持有、承受的产业；“作产业”既准确又符合庄重的现代汉语。
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: 以色列地上
  rationale: אַדְמָה在此指以色列的土地或疆土；采用自然简洁的中文地理表达。
theological_decisions:
- issue: 亚伯拉罕与当时居民拥有土地的论证关系
  choice: 保留为废墟居民自己的宣称，并用“尚且”呈现其由一人到多人的推论
  alternative: 将其改写成上帝认可他们拥有土地的陈述
  rationale: 本节语法明确是居民在说话；译文不预先肯定其神学结论，也不消除后文对该主张的回应。
- issue: ירשׁ所表达的土地关系
  choice: 译为“得了这地为业”
  alternative: 译为“继承了这地”或“占有了这地”
  rationale: “继承”在现代汉语中容易暗示从前任所有者依法承继；“占有”则可能只强调实际控制。“得了……为业”较能涵盖原词取得并持有产业的语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“人子啊”沿用先知书中上帝对以西结的固定称呼；引语保持居民自信甚至带推论色彩的口吻，但不添加经文未明说的神学判断。
