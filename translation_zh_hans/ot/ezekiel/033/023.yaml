  text: וַ/יְהִ֥י דְבַר יְהֹוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/023.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH，传统上常译作“耶和华”；这里音译为“雅威”。
    reason: 说明神名的原文形式及主要汉语译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知书惯用公式中，וַיְהִי 与后面的“话”合起来表达“话临到”，比逐字译作“事情发生了”更符合现代汉语，同时保留叙事承接作用。
- source_word: דְבַר
  choice: 话
  rationale: דְבַר יְהוָה 是先知启示的固定表达；“话”既贴近原文，也能与全书反复出现的公式保持一致。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用上帝的专名 YHWH；“雅威”是现代汉语中依据其可能读音所作的音译，避免以称号代替专名。
- source_word: אֵלַי
  choice: 到我
  rationale: 介词 אֶל 加第一人称单数词尾，意为“到我／向我”；与“临到”搭配时，“到我”自然准确。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后直接话语；译作“说：”简洁自然，冒号表明内容见下一节。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 保留原文中的神圣专名，不以“上主”这一称号替代；脚注同时说明汉语传统译名，以便读者辨识。
translation_notes:
  register: 采用现代、庄重而简洁的先知书文体。“雅威的话临到我”保留原文固定启示公式；以冒号自然衔接下一节的直接引语。
