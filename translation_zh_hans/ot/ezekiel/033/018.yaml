id: EZK.33.18
reference: Ezekiel 33:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/שׁוּב צַדִּ֥יק מִ/צִּדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל וּ/מֵ֖ת בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/018.yaml
  text: When a righteous man turns from his righteousness and does injustice[b][a], he shall die because of them.
translation:
  language: zh_hans
  text: 义人若转离自己的义，行不义[a]，就必因这些事而死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义”也可译作“不公”“恶事”或“不正”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在这些事中”或“借着这些事”；这里的意思是，他因所行的这些不义之事而死。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: 若转离
  rationale: 介词 בְּ 加动词不定式构成时间兼条件性的从句；在本节概括性的警告中，“若……转离”自然表达“当……转离／在……转离时”的语义。
- source_word: צַדִּיק
  choice: 义人
  rationale: 阳性单数形容词在此作名词使用，指一个义人；“义人”简洁、自然，也符合上下文的伦理用语。
- source_word: מִצִּדְקָתוֹ
  choice: 转离自己的义
  rationale: צְדָקָה 在此可指此人的正直状态或正义行为；译作“自己的义”保留原文与“义人”的词根呼应，也不把含义限定为某一教义范畴。
- source_word: וְעָשָׂה
  choice: 行
  rationale: עָשָׂה 与 עָוֶל 搭配，意为行出或作出不义；汉语“行不义”凝练而庄重。
- source_word: עָוֶל
  choice: 不义
  rationale: 该词可表示不公、邪恶或不正当之事；“不义”与前面的“义”形成鲜明对应，并保留伦理及司法层面的分量。
- source_word: וּמֵת
  choice: 就必……死
  rationale: 完成式在这一条件句中表达随之而来的确定结果；“就必……死”既自然，也保留宣判般的严肃语气。
- source_word: בָּהֶם
  choice: 因这些事而
  rationale: 原文直译可作“在它们中／借着它们”；复数代词在语境中回指所行的不义之事，译作“因这些事而”清楚表达其归因意义，同时以脚注保留形式上的歧义。
theological_decisions:
- issue: 本节的“死”是否特指失去救恩，或仅指盟约处境中的现世审判
  choice: 不加限定地译为“必因这些事而死”
  alternative: 明确解释为永恒灭亡，或明确限定为肉身／现世死亡
  rationale: 希伯来文本只陈述义人转离其义、行不义及其死亡后果，并未采用后来教义体系的限定语；译文因此保留原有张力，不替读者裁定死亡的具体神学范围。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“义人—自己的义—不义”保留原文的词义对照；句式简洁，符合先知性警告的语气。
