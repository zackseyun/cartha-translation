  text: אֵת֩ ק֨וֹל הַ/שּׁוֹפָ֤ר שָׁמַע֙ וְ/לֹ֣א נִזְהָ֔ר דָּמ֖/וֹ בּ֣/וֹ יִֽהְיֶ֑ה וְ/ה֥וּא נִזְהָ֖ר נַפְשׁ֥/וֹ מִלֵּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/005.yaml
  text: He heard the sound of the trumpet and did not take warning[a]; his blood will be upon himself. But if he takes warning[b], he will save his life.
translation:
  language: zh_hans
  text: 他听见号角声，却不警醒[a]；他的血必归到自己头上。但他若警醒，就必保全自己的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不警醒”也可译作“不留意警告”或“不听从警告”。
    reason: lexical_alternative
  - marker: b
    text: “性命”原文也可译作“自己”或“魂”；这里指逃过死亡，保全生命。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל הַשּׁוֹפָר
  choice: 号角声
  rationale: קוֹל表示“声音”，שׁוֹפָר指用于示警的角号；“号角声”自然简洁，也保留守望者语境中的警报性质。
- source_word: שָׁמַע
  choice: 听见
  rationale: 此处首先表示实际听到警报声；“听见”准确保留听觉接受的基本含义，不预先加入顺从之意。
- source_word: נִזְהָר
  choice: 接受警告
  rationale: זהר的尼法勒式在此指受到警告并加以留意。译作“接受警告”既适用于前后两处，也突出人对警告作出回应的责任。
- source_word: דָּמוֹ בּוֹ יִהְיֶה
  choice: 他的血必归到自己头上
  rationale: 这是承担自身死亡责任的希伯来司法性惯用语。中文以“血归到……头上”保留血债与责任的形象及力度，同时“自己”明确责任由本人承担。
- source_word: נַפְשׁוֹ
  choice: 自己的性命
  rationale: נֶפֶשׁ可指生命、自身或魂；本段论及因听从警报而免于死亡，因此“性命”最合语境。
- source_word: מִלֵּט
  choice: 救了
  rationale: מלט的皮勒式表示使之逃脱、解救。与“性命”搭配时，“救了自己的性命”是自然且准确的现代汉语。
- source_word: וְהוּא נִזְהָר
  choice: 但他若接受警告
  rationale: וְ字面为“而/和”，此处与前句构成鲜明对比；“若”将上下文隐含的条件关系自然表达出来，而不改变其意义。
theological_decisions:
- issue: 审判语境中的责任公式
  choice: 他的血必归到自己头上
  alternative: 他要为自己的死负责
  rationale: 保留原文以“血”表达死亡责任的司法性比喻，不把它完全释义化，从而维持经文的道德与审判力度。
- issue: נֶפֶשׁ在本节中的含义
  choice: 自己的性命
  alternative: 自己的灵魂／自己
  rationale: 上下文所说的是听从警报而逃过实际死亡；“性命”最贴合此处所指，同时脚注注明原词也可译为“自己”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“号角声”符合守望者发出警报的语境；“他的血必归到自己头上”保留希伯来语责任公式的形象和司法意味。分号呈现拒绝警告与接受警告两种结果的对照。
