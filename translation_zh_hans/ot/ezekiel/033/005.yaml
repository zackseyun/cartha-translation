  to: 他听见号角声，却不警醒[a]；他的血必归到自己头上。但他若警醒，就必保全自己的性命[b]。
  rationale: 修订将“接受警告”统一改为“警醒”，以准确表达听到警报后应有的警戒性回应；并将“就救了”改为“就必保全”，使条件句的结果与本节的将来警告语境一致。保留“血必归到自己头上”，以维持原文关于个人死亡责任的司法性比喻。
