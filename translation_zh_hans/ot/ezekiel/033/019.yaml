base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/019.yaml
  text: And when a wicked man turns from his wickedness and does justice and righteousness[a], by them he shall live.
translation:
  language: zh_hans
  text: 当恶人转离自己的邪恶，实行公平和公义，他必因此存活[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借着这些”；直译“在这些之上”。原文这个短语回指“公平和公义”，表明这些是他得以存活的依据。
    reason: 原文介词短语可表达依据、原因或相关基础；脚注保留其可成立的表达范围及较字面的译法。
lexical_decisions:
- source_word: וּ/בְ/שׁוּב
  choice: 但……若转离
  rationale: 介词加不定式构成时间兼条件性的从句；结合上文对照关系，用“但……若”自然表达希伯来语的转折和条件意味。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 阳性单数形容词在此作名词使用，指一个具有代表性的恶人；“恶人”简洁、庄重，并保留其道德含义。
- source_word: מֵ/רִשְׁעָת/וֹ
  choice: 转离自己的恶行
  rationale: 该名词可指邪恶、恶行；在“恶人—恶行”的中文搭配中，“恶行”比重复“邪恶”更自然，也凸显实际行为。
- source_word: וְ/עָשָׂה
  choice: 施行
  rationale: עשה本义宽泛，为“做、行”；与“公平和正义”搭配时，“施行”符合现代汉语的先知性伦理语境。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 在与צדקה并列的伦理搭配中，指合乎公正的行为；“公平”可避免把它误解为一次司法“审判”。
- source_word: וּ/צְדָקָה
  choice: 和正义
  rationale: 指正直、合宜的伦理行为；与“公平”并列，既保留传统神学语汇的庄重感，也能被现代读者理解。
- source_word: עֲלֵי/הֶם
  choice: 因这些
  rationale: 复数代词回指“公平和正义”；על在此可表示依据、原因或基础。“因这些”通顺地保留其意义，同时以脚注说明原文也可直译为“靠着这些”或“在这些之上”。
- source_word: הוּא יִחְיֶה
  choice: 他就必……活
  rationale: 独立代词带有强调，未完成式在此表达确定结果；“就必活”保留先知宣告的确定语气。
theological_decisions:
- issue: 悔改、实行公平正义与得生之间的关系
  choice: 保留经文本身的陈述：恶人转离恶行并施行公平和正义，就必因这些而活。
  alternative: 可将“活”的依据解释为单独的悔改、广义的盟约忠诚，或其他后设神学框架。
  rationale: 译文不以较晚形成的教义体系化解经文张力，而保留伦理行动与得生之间在本节中明说的联系。
- issue: עֲלֵיהֶם所表达的关系
  choice: 正文译作“因这些”，并以脚注保留“靠着这些／在这些之上”等可能性。
  alternative: 只译作“靠着这些”或较直译的“在这些之上”。
  rationale: 原介词可表达基础、依据或原因；正文采用自然汉语，但不把语义范围缩减为单一、排他的神学因果关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“恶人”“施行公平和正义”“就必活”保持先知宣告的凝练力度；正文脚注标记[a]与脚注完全对应。
