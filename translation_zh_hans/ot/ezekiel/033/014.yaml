  text: וּ/בְ/אָמְרִ֥/י לָֽ/רָשָׁ֖ע מ֣וֹת תָּמ֑וּת וְ/שָׁב֙ מֵֽ/חַטָּאת֔/וֹ וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/014.yaml
  text: And when I say to the wicked man[a], ‘You shall surely die,’ and he turns from his sin and does justice and righteousness,
translation:
  language: zh_hans
  text: 我对恶人说：‘你必定死！’他若离开自己的罪，秉公行义，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秉公行义”或译“行公平和公义”。
    reason: 说明מִשְׁפָּט וּצְדָקָה可采用更形式对应的译法，并显明两个伦理名词。
lexical_decisions:
- source_word: וּבְאָמְרִי
  choice: 我对……说
  rationale: בְּ加不定式及第一人称后缀在此引出时间或情境从句；汉语结合后续条件关系，不必机械译出“当”。
- source_word: לָרָשָׁע
  choice: 对恶人
  rationale: רָשָׁע指邪恶、作恶的人；“恶人”简洁保留其道德含义和单数代表性，汉语无需另加“男人”。
- source_word: מוֹת תָּמוּת
  choice: 你必定死
  rationale: 同源不定式绝对形加强限定动词的语气，表示死亡的确定性；“必定”自然传达这种强调。
- source_word: וְשָׁב מֵחַטָּאתוֹ
  choice: 他若离开自己的罪
  rationale: שׁוּב与מִן表示从罪中回转、离开；“若”将本节希伯来语并列结构在语境中所表达的条件关系自然呈现出来，而不把它解释成单纯的时间先后。
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: 秉公行义
  rationale: 这是现代汉语中凝练而庄重的伦理表达，分别保留מִשְׁפָּט的公正含义与צְדָקָה的公义含义，并体现עָשָׂה所指的实际践行。
theological_decisions:
- issue: 恶人的单数代表性及性别表达
  choice: 恶人
  alternative: 邪恶的人／恶人男子
  rationale: 希伯来语为阳性单数，但此处代表一类作恶者；汉语“恶人”既保留单数代表性，也不额外凸显原文未着重强调的生理性别。
- issue: מִשְׁפָּט וּצְדָקָה这一伦理词组的区分
  choice: 秉公行义
  alternative: 行公平和公义
  rationale: “秉公行义”自然保留“公”与“义”两个相联而有别的概念，不将二者合并为笼统的“做正确的事”；脚注提供较形式对应的译法。
- issue: 回转行为与死亡宣告之间的句法关系
  choice: 他若离开
  alternative: 而他离开／他却离开
  rationale: 原文以וְ连接各分句，未使用显式条件词；但本段论述和句法整体构成条件情形。译作“若”使现代汉语清楚通顺，同时不增添“却”所带的强烈转折意味。
translation_notes:
  register: 采用现代、庄重而易懂的经文语体。“你必定死”保留原文强调；“秉公行义”简练自然。经节末尾保留逗号，因为本句在下一节继续。
