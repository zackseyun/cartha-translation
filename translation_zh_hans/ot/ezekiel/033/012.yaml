  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ צִדְקַ֣ת הַ/צַּדִּ֗יק לֹ֤א תַצִּילֶ֨/נּוּ֙ בְּ/י֣וֹם פִּשְׁע֔/וֹ וְ/רִשְׁעַ֤ת הָֽ/רָשָׁע֙ לֹֽא יִכָּ֣שֶׁל בָּ֔/הּ בְּ/י֖וֹם שׁוּב֣/וֹ מֵֽ/רִשְׁע֑/וֹ וְ/צַדִּ֗יק לֹ֥א יוּכַ֛ל לִֽ/חְי֥וֹת בָּ֖/הּ בְּ/י֥וֹם חֲטֹאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/012.yaml
  text: 'And you[a], son of man, say to the sons of your people: The righteousness of the righteous man will not deliver him in the day of his transgression, and the wickedness of the wicked man—he will not stumble by it in the day he turns from his wickedness[c][b]; and the righteous man will not be able to live by it in the day of his sin.'
translation:
  language: zh_hans
  text: 你，人子啊，要对你的同胞[a]说：义人的义，在他悖逆之日不能救他；恶人的恶，在他转离自己的恶之日，不会使他跌倒[b]；义人在他犯罪之日，也不能靠那义[c]存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“你百姓的儿子们”，意思是“你本族的人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语使用“跌倒”的比喻，也可译为“他不因那恶跌倒”或“他不被那恶绊倒”；原文的“它”在本分句中自然回指恶人的恶。
    reason: lexical_alternative
  - marker: c
    text: 原文为阴性单数代词“它”；按本节的平行结构，最自然是回指前面的“义人的义”。
    reason: ambiguity
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是以西结书中反复出现的固定称呼；保留希伯来语意象及全书的文学连贯性。
- source_word: בְּנֵי עַמְּךָ
  choice: 你的同胞
  rationale: 按现代汉语自然表达该短语所指的“你本族的人”；脚注保留其字面形式。
- source_word: צִדְקַת הַצַּדִּיק
  choice: 义人所行的义
  rationale: 既保留“义／义人”的词根呼应，也以自然汉语表达人的正直行为与状况，不将其限缩为后来的系统神学概念。
- source_word: תַצִּילֶנּוּ
  choice: 不能救他
  rationale: נצל 的使役式表示解救、搭救；“救他”简洁地传达在审判中免于灾祸的含义。
- source_word: בְּיוֹם פִּשְׁעוֹ
  choice: 在他悖逆之日
  rationale: פשע带有越界和反叛色彩；“悖逆”保留其道德及关系层面的力度，并保留“之日”的时间结构。
- source_word: רִשְׁעַת הָרָשָׁע
  choice: 恶人所行的恶
  rationale: 保留“恶／恶人”的修辞呼应，同时符合现代汉语表达。
- source_word: יִכָּשֶׁל בָּהּ
  choice: 使他因那恶跌倒
  rationale: 保留 כשל 的“跌倒”意象；阴性单数代词在本分句中最自然地回指“恶”。
- source_word: בְּיוֹם שׁוּבוֹ מֵרִשְׁעוֹ
  choice: 在他回转、离开自己的恶之日
  rationale: שוב 与 מן 连用表示转离原先的道路；“回转”保留先知性悔改用语，而“离开”明示方向。
- source_word: לֹא יוּכַל לִחְיוֹת בָּהּ
  choice: 不能靠那义存活
  rationale: 明确表达 יכל 的“能够”，并以“靠”传达凭借关系；“那义”按平行结构回指前文义人的义。
- source_word: בְּיוֹם חֲטֹאתוֹ
  choice: 在他犯罪之日
  rationale: 保留原文的时间结构，并以“犯罪”区别于前面的 פשע“悖逆”。
theological_decisions:
- issue: 本节是否断言某种特定的得救与持守教义
  choice: 只陈述经文自身的先知性原则：过去的义不能在义人悖逆时保护他，过去的恶也不能在恶人回转后使他跌倒。
  alternative: 将本节直接表述为失去救恩，或表述为圣徒必然坚忍的系统教义。
  rationale: 本节聚焦上帝按人当前的悖逆或回转施行审判；译文不加入后来的宗派性结论。
- issue: 末句 בָּהּ 的所指
  choice: 正文译作“那义”，按全句平行结构回指义人的义，并用脚注说明原文仅使用代词。
  alternative: 保留不明确的“它”，或宽泛理解为义人先前的身份。
  rationale: 阴性单数代词在语法上可与本节的抽象阴性名词呼应；末句与首句构成明显回环，因此“义”是最自然的所指，但脚注仍保留原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“人子”“义人”“恶人”“悖逆”“回转”等以西结书的重要用语，并以分号呈现原文三个彼此平衡的判断。
