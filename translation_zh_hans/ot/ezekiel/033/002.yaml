  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֶּן אָדָ֗ם דַּבֵּ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם אֶ֕רֶץ כִּֽי אָבִ֥יא עָלֶ֖י/הָ חָ֑רֶב וְ/לָקְח֨וּ עַם הָ/אָ֜רֶץ אִ֤ישׁ אֶחָד֙ מִ/קְצֵי/הֶ֔ם וְ/נָתְנ֥וּ אֹת֛/וֹ לָ/הֶ֖ם לְ/צֹפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/002.yaml
  text: Son of man[a], speak to the sons of your people and say to them, ‘If I bring a sword upon a land, and the people of the land take one man from among them and appoint him as their watchman,’
translation:
  language: zh_hans
  text: “人子啊，你要对你的同胞说：‘假如我使刀剑[a]临到一地，那地的百姓从他们中间选出一个人，立他作他们的守望者，’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“刀剑”是战争或审判的惯用意象；也可按其含义译作“战祸”。
    reason: 说明原文意象的惯用含义，同时让正文保留其具体形象和解释空间。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是以西结书中上帝对先知惯常的称呼；采用“人子”既保留希伯来语单数称谓的文学功能，也与中文圣经传统用语相衔接。
- source_word: בְּנֵי עַמְּךָ
  choice: 你的同胞
  rationale: 字面为“你百姓的众子”，在此泛指与先知同属一个民族的人。“你的同胞”在现代汉语中自然、明确，又不误解为只包括某些人的亲生儿子。
- source_word: אֶרֶץ כִּי אָבִיא עָלֶיהָ חָרֶב
  choice: 假如我使刀剑临到一地
  rationale: 无冠词的אֶרֶץ在假设情境中指任意一地；כִּי在这里引入条件。“刀剑”保留原文具体意象，而没有直接释为战争或审判。
- source_word: עַם הָאָרֶץ
  choice: 那地的百姓
  rationale: 这里是普通的集体称谓，并非技术性头衔；“那地的百姓”清楚承接前面的“一地”。
- source_word: אִישׁ אֶחָד מִקְצֵיהֶם
  choice: 从他们中间选出一个人
  rationale: מִקְצֵיהֶם在此表示从群体中取出一人；“选出”自然表达语境中的推举行动。“一个人”足以对应男性单数אִישׁ，且比“一个男子”更符合现代汉语叙述习惯。
- source_word: וְנָתְנוּ אֹתוֹ לָהֶם לְצֹפֶה
  choice: 立他作他们的守望者
  rationale: 原文直译近于“把他给自己作守望者”，实际表达任命；“立……作”保留正式意味，“守望者”也与本章核心比喻一致。
theological_decisions:
- issue: 刀剑意象所指
  choice: 正文保留“刀剑”
  alternative: 直接译为“战争”或“战祸”
  rationale: “刀剑”可指战争，也可能带有上帝审判的意味；正文保留意象，避免把其神学张力缩减为单一解释。
- issue: 上帝在假设情境中的主动作用
  choice: 译作“我使刀剑临到”
  alternative: 译作“刀剑临到”
  rationale: 原文第一人称使役动词אָבִיא明确以上帝为动作主体，译文不淡化这一点。
- issue: 原文的性别化表达
  choice: 将בְּנֵי עַמְּךָ译为“你的同胞”，将אִישׁ אֶחָד译为“一个人”
  alternative: 译为“你百姓的众子”和“一个男子”
  rationale: 希伯来语采用阳性形式，但前者是集体惯用语，后者在中文“一个人”中仍可由代词“他”体现其男性指称。这样既不改变所指，也避免生硬或引人误解的逐字表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“人子”“守望者”保留本书的重要文学术语；“同胞”“从他们中间选出”则避免不自然的希伯来语式直译。本节在原文中是后续条件句的一部分，译文以逗号收束，保留句法上的未完待续感。
