  text: וְ֠/הַ/צֹּפֶה כִּֽי יִרְאֶ֨ה אֶת הַ/חֶ֜רֶב בָּאָ֗ה וְ/לֹֽא תָקַ֤ע בַּ/שּׁוֹפָר֙ וְ/הָ/עָ֣ם לֹֽא נִזְהָ֔ר וַ/תָּב֣וֹא חֶ֔רֶב וַ/תִּקַּ֥ח מֵ/הֶ֖ם נָ֑פֶשׁ ה֚וּא בַּ/עֲוֺנ֣/וֹ נִלְקָ֔ח וְ/דָמ֖/וֹ מִ/יַּֽד הַ/צֹּפֶ֥ה אֶדְרֹֽשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/006.yaml
  text: But if the watchman sees the sword coming and does not blow the trumpet[a], and the people are not warned, and the sword comes and takes a life from among them, that one is taken away in his iniquity[b], but I will require his blood from the watchman's hand.
translation:
  language: zh_hans
  text: 但守望者若看见刀剑临到，却不吹角，百姓没有受到警告[a]；刀剑临到，从他们中夺去一人的性命，那人因自己的罪孽被取去；但我要从守望者手中追讨他的血[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓没有听从警告。”希伯来语既可理解为百姓没有受到警告，也可理解为他们没有留意警告；正文按守望者未吹角所形成的因果关系翻译。
    reason: lexical_alternative
  - marker: b
    text: “从守望者手中追讨他的血”是追究守望者对该人死亡所负责任的法律性表达。
    reason: cultural_note
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: 守望者
  rationale: 指负责警戒、瞭望的人；“守望者”自然保留了本章的先知性比喻。
- source_word: כִּי יִרְאֶה
  choice: 若看见
  rationale: 这里的 כִּי 引出假设性的责任案例，译作“若”符合上下文的条件关系。
- source_word: הַחֶרֶב בָּאָה
  choice: 刀剑临到
  rationale: 保留“刀剑”这一具体意象，不直接解释为战争或审判；“临到”表达逼近并将造成灾祸的动态。
- source_word: תָקַע בַּשּׁוֹפָר
  choice: 吹角发出警报
  rationale: שׁוֹפָר 是用于发出信号的角；“吹角”保留古代实物意象，加上“发出警报”明确本处功能。
- source_word: וְהָעָם לֹא נִזְהָר
  choice: 百姓就没有受到警告
  rationale: זהר 的尼法勒式既可指“受到警告”，也可指“听从警告”。此处守望者没有吹角，因果重点更适合被动理解；脚注保留另一可能。
- source_word: וַתִּקַּח מֵהֶם נָפֶשׁ
  choice: 夺去他们中一人的性命
  rationale: נֶפֶשׁ 此处指一个人或一条性命；该译法清楚表达从群体中有一人死亡。
- source_word: בַּעֲוֺנוֹ נִלְקָח
  choice: 因自己的罪孽被夺去
  rationale: עָוֹן 可涵盖罪孽、罪责及其后果；“罪孽”保留其道德分量。“因”在现代汉语中自然表达此处关系，但不消除原词的语义宽度。
- source_word: דָמוֹ מִיַּד הַצֹּפֶה אֶדְרֹשׁ
  choice: 我要从守望者手中追讨他的血
  rationale: 保留“手中”和“血”的希伯来法律意象；“追讨”传达 דרשׁ 所表达的追究死亡责任。
theological_decisions:
- issue: 死者自身的罪孽与守望者责任之间的关系
  choice: 同时保留“那人因自己的罪孽被夺去”和上帝向守望者追讨其血这两项宣告。
  alternative: 把死者的罪责转移给守望者，或把死者之死完全归因于守望者未警告。
  rationale: 希伯来文本并列强调死者自身的罪孽和守望者失职所招致的真实责任；译文不将这层神学张力化约为替代性担罪或单纯程序失误。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“守望者”“刀剑”“吹角”“从……手中追讨他的血”保留本节核心意象；“发出警报”用于说明吹角在语境中的功能。正文所有脚注标记均已对应列出。
