revisions:
- from: 但守望者若看见刀剑临到，却不吹角发出警报，百姓就没有受到警告[a]；刀剑来到，夺去他们中一人的性命，那人虽因自己的罪孽被夺去，我却要从守望者手中追讨他的血[b]。
  to: 但守望者若看见刀剑临到，却不吹角，百姓没有受到警告[a]；刀剑临到，从他们中夺去一人的性命，那人因自己的罪孽被取去；但我要从守望者手中追讨他的血[b]。
  rationale: 修订将“但”保留在上帝追讨守望者责任的分句上，避免以“虽”预先解释或强化原文的逻辑关系，同时维持死者自身罪孽与守望者责任并列的张力。删去“发出警报”以减少重复，且完整保留两处脚注锚点及其对应脚注。
