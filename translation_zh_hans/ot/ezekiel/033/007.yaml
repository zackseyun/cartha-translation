  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/007.yaml
  text: And you[a], son of man, I have made you a watchman for the house of Israel[b]; when you hear a word from my mouth, you shall warn them from me.
translation:
  language: zh_hans
  text: 至于你，人子，我已立你作以色列家的守望者；你听见我口中的话，就要替我警告他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 直译希伯来语惯用称呼，并保留其在《以西结书》中反复出现的文学和神学呼应；现代中文读者也熟悉这一传统表达。
- source_word: צֹפֶה
  choice: 守望者
  rationale: 指负责警戒并发出警告的人；“守望者”自然、庄重，也准确承载本章的先知职分比喻。
- source_word: נְתַתִּיךָ
  choice: 我已立你作
  rationale: 原义为“我已给/置你”，在此为委任某人担任一种职分；“立你作”既符合中文习惯，又保留任命的力度。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家的
  rationale: 这里的 ל 表示职分所指向的群体；与“守望者”组合成“以色列家的守望者”，简洁表达他对该群体所负的职责。
- source_word: וְשָׁמַעְתָּ
  choice: 你听见……就
  rationale: 将连续结构按上下文表达为条件—结果关系，说明每当先知领受神的话时便有警告的责任，同时不改变原文事件次序。
- source_word: מִפִּי
  choice: 我口中的
  rationale: 保留原文“从我口中”的具象表达，强调信息直接来自神。
- source_word: דָּבָר
  choice: 话
  rationale: 在先知语境中自然指神所说的话；比“信息”更贴近原词，也不作额外解释。
- source_word: וְהִזְהַרְתָּ
  choice: 就要……警告
  rationale: 使役词干表达使人受警戒；“警告”清楚体现先知受托发出告诫的责任，“要”保留委任语气。
- source_word: אֹתָם
  choice: 他们
  rationale: 直接指代前文的以色列家。
- source_word: מִמֶּנִּי
  choice: 替我
  rationale: 原文直译可作“从我”；在中文中“替我警告”自然表达警告出于神并由先知传达，也保留代理关系。
theological_decisions:
- issue: 是否保留 בֶן אָדָם 的传统称呼
  choice: 人子
  alternative: 世人；必死的人
  rationale: “人子”保留原文形式及其在全书中的重复模式，不把这一称呼的文学和神学张力简化为单纯强调人的必死性。
- issue: 如何表达先知听见神话语与发出警告之间的关系
  choice: 你听见……就要……
  alternative: 你要听见……并且警告……
  rationale: 希伯来语连续结构可在此自然理解为领受话语之后随即履行警告职责；中文用“……就……”清楚保留这一顺序，而不把“听见”误读成独立命令。
- issue: מִמֶּנִּי 所表示的警告来源或代理关系
  choice: 替我警告他们
  alternative: 从我警告他们；把我的警告告诉他们
  rationale: “替我”在现代中文中自然说明先知代表神发出警告，且不过度扩写警告的具体内容。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。“至于你”凸显 וְאַתָּה 的转折聚焦；分号保留委任与履职说明之间的结构。
