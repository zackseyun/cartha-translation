source:
  edition: WLC
  text: אֱמֹ֨ר אֲלֵי/הֶ֜ם חַי אָ֣נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם אֶחְפֹּץ֙ בְּ/מ֣וֹת הָ/רָשָׁ֔ע כִּ֣י אִם בְּ/שׁ֥וּב רָשָׁ֛ע מִ/דַּרְכּ֖/וֹ וְ/חָיָ֑ה שׁ֣וּבוּ שׁ֜וּבוּ מִ/דַּרְכֵי/כֶ֧ם הָ/רָעִ֛ים וְ/לָ֥/מָּה תָמ֖וּתוּ בֵּ֥ית יִשְׂרָאֵֽל־׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/011.yaml
  text: Say to them[a], ‘As I live,’ declares the Lord GOD, ‘I take no pleasure in the death of the wicked, but rather that the wicked turn from his way and live. Turn back, turn back from your evil ways! Why will you die[b], O house of Israel?’
translation:
  language: zh_hans
  text: 你要对他们说：‘主耶和华宣告：我凭着我的永生起誓，我绝不喜悦[a]恶人死亡；我所喜悦的，是恶人回头离开他的道路，得以存活。回头，回头，离开你们的恶道！[b]以色列家啊，你们为什么要死亡呢？’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我绝不乐意恶人死亡。”这里的希伯来语动词可表示喜悦、乐意或愿望。
    reason: lexical_alternative
  - marker: b
    text: “回头”连续出现两次，表示强烈而迫切的命令；原文与前面恶人“回头离开”所用的是同一个动词。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֣נִי
  choice: 我指着我的永生起誓
  rationale: 这是庄严的神圣起誓公式。此译明确表达希伯来语“我活着”在语境中的誓言功能，同时保持郑重而自然的现代汉语。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: נְאֻם是先知书常见的神谕宣告公式；“主耶和华”保留אֲדֹנָי与יהוה两个称谓，又符合中文圣经语体。
- source_word: אִם אֶחְפֹּץ בְּמוֹת הָרָשָׁע
  choice: 我绝不喜悦恶人死亡
  rationale: 在起誓结构中，אִם表达强烈否定；חפץ可指喜悦、乐意或愿望。“绝不喜悦”既体现誓言力度，也不把词义收窄为抽象意志。
- source_word: כִּי אִם
  choice: 却
  rationale: 该组合构成“不是……而是……”的鲜明对比；中文用“却”简洁自然地承接前面的强烈否定。
- source_word: בְּשׁוּב רָשָׁע מִדַּרְכּוֹ
  choice: 恶人回头离开他所行的道
  rationale: שׁוּב的核心意象是转回、回头；“回头离开”在中文中清楚表达从原有行为道路转离，并保留单数代表性人物与“道”的行为隐喻。
- source_word: וְחָיָה
  choice: 得以存活
  rationale: 表达恶人回头之后存活的结果，同时避免过度界定其神学机制。
- source_word: שׁוּבוּ שׁוּבוּ
  choice: 你们回头吧！回头
  rationale: 保留命令的重复及其强烈、迫切的劝告语气，并与前文恶人“回头”使用同一核心词。
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: 离开你们的恶道
  rationale: “恶道”自然保留先知话语中以道路比喻邪恶生活方式的表达。
- source_word: וְלָמָּה תָמוּתוּ
  choice: 你们为什么要死亡呢
  rationale: 以直接的反问表达将来结果和迫切劝告，不额外加入“执意”等原文没有明说的动机。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 保留“家”的群体性和先知书中的呼告形式。
theological_decisions:
- issue: 上帝对恶人死亡的态度
  choice: 译为“绝不喜悦恶人死亡”，并与恶人回头存活形成对比。
  alternative: 译为“不愿意恶人死亡”或“不以恶人死亡为乐”。
  rationale: 原文明确陈述上帝不以恶人之死为喜悦，却喜悦其回头存活；译文保留这项宣告，不借此解决有关神圣旨意或预定论的系统神学争议。
- issue: 恶人的代表性单数与听众的复数
  choice: 前半节用单数“恶人……他”，后半节转为复数“你们”。
  alternative: 全节统一改为复数，或用性别中性的泛称改写。
  rationale: 希伯来文先以代表性单数描述恶人，继而直接向以色列全家发出复数命令；保留这一转换可忠实呈现原文修辞。
- issue: שׁוּב的伦理与神学含义
  choice: 统一译为“回头”，并在命令中补明“离开……恶道”。
  alternative: 直接译为“悔改”。
  rationale: “回头”保留原文具体的转向意象以及前后词语呼应；“悔改”虽可表达语境意义，却可能将更完整的神学术语直接代入原词。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“主耶和华宣告”保持神谕公式的正式感；两个感叹句传达重复命令的迫切性。脚注标记均置于其实际说明的词句之后。
