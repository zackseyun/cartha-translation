  text: חֲבֹ֨ל יָשִׁ֤יב רָשָׁע֙ גְּזֵלָ֣ה יְשַׁלֵּ֔ם בְּ/חֻקּ֤וֹת הַֽ/חַיִּים֙ הָלַ֔ךְ לְ/בִלְתִּ֖י עֲשׂ֣וֹת עָ֑וֶל חָי֥וֹ יִֽחְיֶ֖ה לֹ֥א יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/015.yaml
  text: if the wicked man restores the pledge[a], repays what he has stolen, walks in the statutes of life without doing injustice, he shall surely live[b]; he shall not die.
translation:
  language: zh_hans
  text: 恶人若归还抵押物[a]，赔还所抢夺之物，遵行生命的律例[b]，不行不义，他就必定存活，必不死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“归还所收作担保的物件”；希伯来语指归还为贷款或债务作担保而收取的物品。
    reason: lexical_alternative
  - marker: b
    text: “生命的律例”也可理解为“使人得生命的律例”或“通向生命的律例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל
  choice: 抵押物
  rationale: 指为贷款或债务作担保而收取的物件；“抵押物”在现代汉语中清楚、准确，并保留法律经济语境。
- source_word: יָשִׁיב
  choice: 归还
  rationale: 与“抵押物”自然搭配，直接表达把所扣留之物交还原主。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词为单数实体化形容词；“恶人”简洁保留其道德判断及代表性个人的用法。
- source_word: גְּזֵלָה
  choice: 所抢夺的
  rationale: 该名词可指以暴力或不法手段夺取之物；此译法自然地把它处理为偿还的对象，又不局限为某一种具体财物。
- source_word: יְשַׁלֵּם
  choice: 偿还
  rationale: Piel词形在此有赔偿、补还之意；“偿还”保留补偿性和法律语气。
- source_word: בְּחֻקּוֹת הַחַיִּים
  choice: 遵行生命的律例
  rationale: “遵行”自然传达“行走于”律例中的生活方式；“生命的律例”保留原文属格结构的含混性，不断定律例是赋予生命、通向生命，还是以生命为特征。
- source_word: הָלַךְ
  choice: 遵行
  rationale: 原文“行走”是生活行为的惯用隐喻；汉语“遵行”与“律例”搭配自然，并准确表达按律例生活。
- source_word: לְבִלְתִּי עֲשׂוֹת עָוֶל
  choice: 不行不义
  rationale: 简洁保留原文避免作恶的意思，也维持先知性、法律性的庄重语体。
- source_word: עָוֶל
  choice: 不义
  rationale: 兼具错误、邪恶和不公正的含义；“不义”比单纯“不公”更能保留其道德与法律层面。
- source_word: חָיוֹ יִחְיֶה
  choice: 必定存活
  rationale: 原文不定式绝对形与限定动词连用以加强肯定；“必定”传达这种强调，“存活”也与后句“不死亡”形成直接对应。
- source_word: לֹא יָמוּת
  choice: 必不死亡
  rationale: 直接表达否定的未完成式，并以“必不”与前句的确定语气呼应。
theological_decisions:
- issue: “生命”与“死亡”在盟约警告和应许中的所指
  choice: 译作“他就必定存活，必不死亡”，不限定其为肉身存活、盟约复兴或末世生命。
  alternative: 明确解释为肉身免死、恢复盟约福分，或获得末世生命。
  rationale: 希伯来文本直接应许生命并否定死亡，其意义可能包含彼此重叠的现实、盟约及终末层面；正文保留这种神学张力，不作超出经文的限定。
- issue: חֻקּוֹת הַחַיִּים 中“生命”与“律例”的关系
  choice: 保留为“生命的律例”。
  alternative: 译作“使人得生命的律例”或“通向生命的律例”。
  rationale: 原文属格关系可有多种理解；较形式对应的译法避免提前断定律例是赐生命、维持生命，还是以生命为特征。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归还……偿还……遵行……不行”保留原文条件句中连续行动的节奏；“必定存活，必不死亡”再现原文强烈而直接的应许。所有脚注标记均已置于正文对应位置。
