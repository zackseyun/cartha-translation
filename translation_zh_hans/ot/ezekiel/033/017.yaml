  text: וְ/אָמְרוּ֙ בְּנֵ֣י עַמְּ/ךָ֔ לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י וְ/הֵ֖מָּה דַּרְכָּ֥/ם לֹֽא יִתָּכֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/017.yaml
  text: Yet the sons of your people say[a], ‘The way of the Lord is not just,’ though it is their own way that is not just.
translation:
  language: zh_hans
  text: 可是，你百姓中的人说：“主的道路不公正[a]；其实，他们自己的道路不公正。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不公正”也可译为“不正确”或“不公平”；本节下半句同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 可是……说
  rationale: וְ 在上下文中带有轻微转折意味；“可是”自然地表达百姓对上文神所阐明之原则的反驳。
- source_word: בְּנֵי עַמְּךָ
  choice: 你本族的人
  rationale: 该短语字面为“你百姓的儿子们”，实际指以西结所属百姓中的人；“你本族的人”既保留群体归属，也避免现代汉语中生硬或被误解为仅指男性后代的表达。
- source_word: לֹא יִתָּכֵן
  choice: 不公正
  rationale: תכן 的尼法勒式在此指不正当、不合公义；上下文涉及神审判人的公平性，因此“不公正”准确保留道德和司法层面的指控。两处采用同一译法，以呈现原文的反转。
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: 主的道路
  rationale: 直译该结构，并保留 דֶּרֶךְ 所兼有的行事方式、准则和作为之意，也与本节后半的“他们自己的道路”形成对应。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 此处是神圣称号 אֲדֹנָי，而非四字神名；译作“主”符合现代汉语圣经语体。
- source_word: וְהֵמָּה
  choice: 其实，是他们自己
  rationale: 独立代词 הֵמָּה 带有强调和对比作用；“其实，是他们自己”使指控反落到百姓身上的修辞转折清楚可见。
- source_word: דַּרְכָּם
  choice: 他们自己的道路
  rationale: “自己的”显明 וְהֵמָּה 的强调作用，并与“主的道路”构成鲜明对照。
theological_decisions:
- issue: 对神“道路”的道德评价
  choice: 两处都译为“不公正”
  alternative: “不正确”或“不公平”
  rationale: 上下文围绕神审判是否公义以及人是否应为自己的行为负责。“不公正”保留百姓对神所提出的严肃道德指控，又不额外加入教义性解释；后半重复同一词语，使原文将指控转回百姓自身的张力得以保留。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“道路”保留原文核心意象，并能在语境中理解为行事方式；用“其实，是他们自己”呈现原文强调，却不扩充其神学含义。
