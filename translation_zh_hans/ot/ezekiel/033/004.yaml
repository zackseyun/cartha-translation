    rationale: 该词在本节可指因听到警报而警醒、留意；“不警醒”更贴合守望者吹角的即时语境，也避免将重点偏向是否接受某项口头信息。
  - severity: low
    issue: “刀剑来到，将他夺去”句式略显生硬。
    rationale: 将“来到”改为“临到”，并以“把他夺去”承接，可使条件—结果的汉语句法更顺畅，意义不变。
  - severity: low
