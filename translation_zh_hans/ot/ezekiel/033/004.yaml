base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/004.yaml
  text: then if the one who hears hears the sound of the trumpet and does not take warning[a], and the sword comes and takes him away, his blood will be on his own head.
translation:
  language: zh_hans
  text: 若有人听见角声，却不警醒，刀剑临到，把他夺去，他的血必归在自己头上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他的血要在他头上”；这是说他要为自己的死亡承担责任。
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמַע הַשֹּׁמֵעַ
  choice: 听见……的人若
  rationale: 带冠词的分词作名词用，指“听见的人”；结合上文延续的条件句，汉语用“若”清楚表达条件关系。
- source_word: קוֹל הַשּׁוֹפָר
  choice: 角声
  rationale: שׁוֹפָר 指用于发出警报的号角；“角声”简洁自然，并保留古代号角的意象，避免将其泛化为现代小号。
- source_word: נִזְהָר
  choice: 接受警告
  rationale: 该尼法勒形式可表示受到警告或听从警戒；此处强调听见警报后仍未作出相应反应，“不接受警告”兼顾警告的临到与听者的责任。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 保留先知书中代表战争、侵袭与死亡的具体意象；“刀剑”在现代中文中比单用“剑”更自然地承载这一集体性灾祸意象。
- source_word: וַתִּקָּחֵהוּ
  choice: 将他夺去
  rationale: לקח 本义为“取、拿走”；在刀剑临到的语境中，“夺去”自然表达致命结果，同时不过度增添细节。
- source_word: דָּמוֹ בְרֹאשׁוֹ יִהְיֶה
  choice: 他的血就要归到自己头上
  rationale: 保留希伯来语以血归在某人头上来表达本人承担死亡责任的习语，并用“自己”明确其反身含义。
theological_decisions:
- issue: 审判语境中的责任习语
  choice: 他的血就要归到自己头上
  alternative: 他要为自己的死负责
  rationale: 正文保留原文具体而有力的血与头的意象，不把它完全抽象化；脚注说明其责任含义，既保持修辞张力，也不引入额外的教义术语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“那么”承接上一节所设的情形；句式保持条件—结果—责任归属的推进。脚注标记置于完整责任习语之后。
