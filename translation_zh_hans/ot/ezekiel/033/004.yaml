revisions:
- from: 那么，听见角声的人若不接受警告，刀剑来到，将他夺去，他的血就要归到自己头上。[a]
  to: 若有人听见角声，却不警醒，刀剑临到，把他夺去，他的血必归在自己头上。[a]
  rationale: 修订以“却不警醒”更贴切表达听见号角后未作警戒回应的含义，并调整“刀剑临到，把他夺去”的句法，使现代标准汉语更自然。责任习语及其脚注说明均予保留；脚注的直译则不在字面层面额外加入“自己”。
