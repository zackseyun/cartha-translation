  text: וְ/הִנְּ/ךָ֤ לָ/הֶם֙ כְּ/שִׁ֣יר עֲגָבִ֔ים יְפֵ֥ה ק֖וֹל וּ/מֵטִ֣ב נַגֵּ֑ן וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/עֹשִׂ֥ים אֵינָ֖/ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/032.yaml
  text: Look[a], you are to them like a sensual song, with a beautiful voice and skillful playing; they hear your words, but they do not do them.
translation:
  language: zh_hans
  text: 看哪，在他们眼中，你就像一首情欲之歌[a]，歌声优美、演奏娴熟。他们听你的话，却不照着去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“爱情之歌”。希伯来语可指强烈或感官性的爱欲；这里强调他们把先知的信息当作悦耳诱人的消遣。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְּךָ
  choice: 看哪……你
  rationale: הִנֵּה是引人注意的指示语，附加的二人称代词表明对象是“你”；“看哪”保留其郑重而直接的语气。
- source_word: לָהֶם
  choice: 在他们眼中
  rationale: ל在此表达听众如何看待以西结；译作“在他们眼中”比直译“对他们而言”更自然。
- source_word: כְּשִׁיר עֲגָבִים
  choice: 像一首情欲之歌[a]
  rationale: שִׁיר意为“歌”；עֲגָבִים可指强烈、感官性的爱欲。这里强调百姓把先知的信息当作诱人悦耳的消遣。“情欲之歌”保留其暧昧而带负面的意味，脚注列出较温和的可能译法。
- source_word: יְפֵה קוֹל
  choice: 歌声优美
  rationale: 该短语直指声音悦耳；“歌声优美”符合现代汉语音乐语境。
- source_word: וּמֵטִב נַגֵּן
  choice: 演奏动听
  rationale: יטב的使役分词与נגן连用，表示善于演奏或演奏得好；“演奏动听”既自然，也与前面的听觉吸引力相呼应。
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: 他们听你的话
  rationale: 保留שׁמע的基本听觉含义，并为下文“却不……做”的鲜明对比作铺垫。
- source_word: וְעֹשִׂים אֵינָם אוֹתָם
  choice: 却不照着去做
  rationale: 希伯来语是强调性的“他们并不做它们”，所指是先知的话；汉语用“照着去做”自然表达实行、遵行这些话，同时保留听与行的对照。
theological_decisions:
- issue: עֲגָבִים的道德与感官色彩
  choice: 情欲之歌
  alternative: 爱情之歌；艳情之歌
  rationale: 上下文责备听众只欣赏先知悦耳的信息，却不付诸实行。译作“情欲之歌”保留该词所含的强烈爱欲及负面色彩，又不像“艳情之歌”那样可能过度具体化。脚注保留“爱情之歌”这一较中性的词义可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知文体的郑重感；其余句式力求自然。“听……却不照着去做”清楚呈现原文的修辞与伦理张力。
