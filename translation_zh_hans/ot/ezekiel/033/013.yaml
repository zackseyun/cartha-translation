source:
  edition: WLC
  text: בְּ/אָמְרִ֤/י לַ/צַּדִּיק֙ חָיֹ֣ה יִֽחְיֶ֔ה וְ/הֽוּא בָטַ֥ח עַל צִדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל כָּל צדקת/ו לֹ֣א תִזָּכַ֔רְנָה וּ/בְ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה בּ֥/וֹ יָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/013.yaml
  text: When I say to the righteous man[a], ‘He shall surely live,’ and he trusts in his righteousness and does injustice, none of his righteous deeds will be remembered[b], but by the injustice that he has done he shall die.
translation:
  language: zh_hans
  text: 我对义人说：“他必定存活。”但他若倚仗自己的义，行了不义的事，他一切的义行[a]都不被记念；他必因自己所行的不义而死[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他一切的义”。希伯来语复数在这里也可集合性地指他所行的一切公义之事。
    reason: lexical_alternative
  - marker: b
    text: “因……而死”也可译作“死在其中”或“由于这事而死”；所指的是他所行的不义。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: 我……说
  rationale: בְּ 加带第一人称单数词尾的 אָמְרִי 引出时间情境；汉语以“我对……说”自然表达，同时保留上帝第一人称说话的语境。
- source_word: לַצַּדִּיק
  choice: 对义人
  rationale: צַדִּיק 指公义、正直的人；“义人”简洁庄重，也保留单数代表性用法。
- source_word: חָיֹה יִחְיֶה
  choice: 他必定存活
  rationale: 动词不定式绝对形与未完成式连用，具有强调作用；“必定”传达确定、加强的语气。
- source_word: בָטַח עַל צִדְקָתוֹ
  choice: 倚仗自己的义
  rationale: בָטַח עַל 表示把信赖或把握放在某事物上；“倚仗”准确表达这种依靠，也显明其所倚靠的是本人的义。
- source_word: וְעָשָׂה עָוֶל
  choice: 行了不义的事
  rationale: עָוֶל 可指不义、邪恶或不公；“行了不义的事”自然，并与后文同一词根的表述保持呼应。
- source_word: כָּל צִדְקֹתָו
  choice: 他一切的义行
  rationale: צִדְקֹתָו 是复数，可指各项公义行为，也可集合性地指他的义；正文采用自然且具体的“义行”，另以脚注保留“义”的可能。
- source_word: לֹא תִזָּכַרְנָה
  choice: 都不被记念
  rationale: זכר 的尼法勒形式在此为被动，意为“不被记得／记念”；“记念”保留司法性语境，而不额外解释为记账或抵偿。
- source_word: וּבְעַוְלוֹ אֲשֶׁר עָשָׂה בּוֹ יָמוּת
  choice: 他必因自己所行的不义而死
  rationale: בְּ 与后续 בּוֹ 可表达处于其中、凭借或由于该不义而死；正文采用自然的因果表达，脚注保留“死在其中”的形式可能。
theological_decisions:
- issue: 本节是否应被译成支持某一特定的坚忍、背道或称义体系
  choice: 把经文直译为对义人的真实条件性警告：若他倚仗自己的义并行不义，先前的义行不被记念，他要因所行的不义而死。
  alternative: 将警告弱化为纯属假设，或在译文中明确解释为丧失某种特定教义体系所定义的地位。
  rationale: 希伯来文本以审判性的语言直接陈述警告，却没有交代后世系统神学争论的全部范畴；译文因此保留其严肃性及神学张力，不作超出原文的裁断。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“义人、义行、不义、记念、存活”等用语保持经文的司法与伦理色彩；以“但……若……”理顺汉语条件关系，不把警告弱化为假设，也不加入特定宗派术语。所有脚注标记均置于正文相应位置。
