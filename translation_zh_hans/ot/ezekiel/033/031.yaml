  text: וְ/יָב֣וֹאוּ אֵ֠לֶי/ךָ כִּ/מְבוֹא עָ֞ם וְ/יֵשְׁב֤וּ לְ/פָנֶ֨י/ךָ֙ עַמִּ֔/י וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/אוֹתָ֖/ם לֹ֣א יַֽעֲשׂ֑וּ כִּֽי עֲגָבִ֤ים בְּ/פִי/הֶם֙ הֵ֣מָּה עֹשִׂ֔ים אַחֲרֵ֥י בִצְעָ֖/ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/031.yaml
  text: And they come to you as people come[a], and they sit before you as my people, and they hear your words, but they do not do them; for with their mouth they speak lustful things[b], while their heart goes after their unjust gain.
translation:
  language: zh_hans
  text: 他们来到你这里，像民众前来那样；他们作为我的子民坐在你面前，听你的话，却不去行。因为他们口中所表露的尽是情欲[a]，心却追逐自己的不义之财[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “情欲”所译的希伯来词十分罕见，也可指“爱恋”“柔情”，或可能指“情歌”。这里既可能指他们口中所说、所表现的欲望，也可能暗示他们把先知的话当作供人欣赏的情歌（参下一节）。
    reason: lexical_alternative
  - marker: b
    text: “不义之财”也可译作“利益”“贪利”或“贪得之财”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְבוֹא עָם
  choice: 像民众通常来聚集那样
  rationale: 保留כ־的比较意味和מבוא עָם所描写的公众前来场景；“通常来聚集”符合现代汉语，也不过度限定为特定礼仪集会。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留上帝与民之间的立约称谓，也让他们自居为上帝子民却不遵行其话语的反差自然显出。
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: 听你的话
  rationale: 直译שמע，并与下文“不去行”构成听见却不实践的鲜明对比。
- source_word: וְאוֹתָם לֹא יַעֲשׂוּ
  choice: 却不去行
  rationale: 保留希伯来语“行这些话”的具体表达；汉语省去可由语境明确指代的宾语，使句子自然。
- source_word: עֲגָבִים בְּפִיהֶם הֵמָּה עֹשִׂים
  choice: 他们口中表露的是爱欲
  rationale: עֲגָבִים是罕见词，涉及强烈、爱恋或感官性的欲望；“爱欲”保留其语义张力，“口中表露”兼顾בְּפִיהֶם与עֹשִׂים的施行、表现意味，避免把罕见词武断限定为淫秽言语或某种歌曲。
- source_word: בִצְעָם
  choice: 自己的不义之财
  rationale: בצע常指由贪婪或不正当手段所得的利益；“不义之财”保留其道德色彩，而脚注说明也可能侧重利益或贪欲。
- source_word: לִבָּם הֹלֵךְ אַחֲרֵי
  choice: 心却追逐
  rationale: 保留“心跟在……后面”的趋向和效忠意象；“追逐”是自然汉语，并清楚表达内心真正所向。
theological_decisions:
- issue: 百姓言语和欲望的道德刻画
  choice: 译作“口中表露的是爱欲”，描写他们外在听道、内在逐利的虚伪，同时保留该词可能涉及爱恋、感官欲望或娱乐化聆听的宽度。
  alternative: 可理解为说讨好的柔情话，或把先知的话当作爱歌来欣赏，而不一定专指淫欲言语。
  rationale: 本节重点是“听却不行”的矛盾，口与心的平行句揭示他们的欲望和真正忠向。译文不把罕见词收窄为单一形式，也不加入特定宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“子民”“不义之财”保留经文的立约及道德语气；分号和“因为……却……”清楚呈现外在听道与内心逐利的对照。所有脚注标记均置于其实际说明的词语之后。
