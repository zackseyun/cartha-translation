  text: וְ/נָתַתִּ֤י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה וְ/נִשְׁבַּ֖ת גְּא֣וֹן עֻזָּ֑/הּ וְ/שָֽׁמְמ֛וּ הָרֵ֥י יִשְׂרָאֵ֖ל מֵ/אֵ֥ין עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/028.yaml
  text: And I will make the land a desolation and a waste[a], and the pride of its strength will cease, and the mountains of Israel will be desolate[b], with no one passing through.
translation:
  language: zh_hans
  text: 我要使这地成为荒凉、令人惊骇之地[a]；它强盛的骄傲必止息[b]。以色列的群山必荒凉，无人经过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “令人惊骇之地”或译“荒废之地”。原文第二个词可指因严重毁坏而令人惊骇的景象。
    reason: lexical_alternative
  - marker: b
    text: “它强盛的骄傲”或译“它力量的威荣”。原文可带“骄傲”或较中性的“威荣”之意；在这里的审判语境中，译作“骄傲”较贴切。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要使
  rationale: נתן本义可指“给、置于”，但在“使这地成为……”的宾语补足结构中，译作“使”最符合现代汉语，也准确传达造成某种状态的意思。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 上下文所指是以色列／犹大之地，并非整个大地；“这地”自然且明确。
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: 荒凉，成为令人惊骇之处
  rationale: 两个近义名词都与毁坏有关，但第二词也可带有因惨状而令人惊骇的意味；如此翻译既保留并列层次，也避免机械重复。
- source_word: וְנִשְׁבַּת
  choice: 必止息
  rationale: 该动词表达停止、终止；“必止息”简洁庄重，并保留预言语气。
- source_word: גְּאוֹן עֻזָּהּ
  choice: 它所夸耀的强盛
  rationale: גְּאוֹן可指骄傲、威荣或高昂之物；在审判语境中，用“所夸耀的强盛”表达因力量而自夸的负面意味，同时保留“强盛”作为夸耀对象的短语关系。
- source_word: וְשָׁמְמוּ הָרֵי יִשְׂרָאֵל
  choice: 以色列的群山必然荒凉
  rationale: שׁמם在此描述地域遭废弃的状态，宜译为“荒凉”；“以色列的群山”保留以西结书中反复出现的地理表达。
- source_word: מֵאֵין עוֹבֵר
  choice: 无人经过
  rationale: 该短语描写完全荒废、没有行旅者经过的情形；“无人经过”自然凝练，不额外限定因果关系。
theological_decisions:
- issue: גְּאוֹן在审判语境中的褒贬色彩
  choice: 译为“所夸耀的”，体现负面的自恃与骄傲
  alternative: 译为中性的“威荣”或“威势”
  rationale: 上下文宣告这地及其倚仗遭审判，负面理解较符合修辞方向；脚注仍保留中性读法，避免把该词本身可能具有的意义范围完全封闭。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必止息”“群山”保留预言文本的凝练感；两个脚注标记均已在正文中出现，并分别说明近义词的语义范围及“骄傲／威荣”的真实歧义。
