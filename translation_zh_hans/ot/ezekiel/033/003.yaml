base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/003.yaml
  text: and he sees the sword coming against the land[a], and he blows the trumpet and warns the people,
translation:
  language: zh_hans
  text: 他看见刀剑正向这地袭来，就吹响号角[a]，警告百姓，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “号角”也可译为“号”或“公羊角号”；希伯来文为 shofar（שׁוֹפָר）。
    reason: 说明 שׁוֹפָר 的可行词汇替代译法及其具体器物性质，避免重复正文用词。
lexical_decisions:
- source_word: וְרָאָה
  choice: 他看见
  rationale: 该形式在此承接前文守望者职责的条件性叙述；汉语用“看见”自然表达一般情形，并保留动作次序。
- source_word: הַחֶרֶב
  choice: 刀剑
  rationale: 保留希伯来文的具体意象，不在正文中直接释为“战争”或“敌军”；在先知语境中可由读者领会其所指的战争与审判。
- source_word: בָּאָה עַל הָאָרֶץ
  choice: 正向这地袭来
  rationale: “向……袭来”传达 בוא + עַל 在本语境中的威胁和逼近感；“正”使正在来临的情景在现代汉语中清楚自然。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 此处指受到威胁的地域，并非全世界；“这地”比“地球”准确，也比“国家”更贴近原文的地域含义。
- source_word: וְתָקַע בַּשּׁוֹפָר
  choice: 就吹响号角
  rationale: “吹响”自然表达 תקע 的发声、报警作用；“就”清楚呈现看见危险后随即示警的次序。
- source_word: שׁוֹפָר
  choice: 号角
  rationale: שׁוֹפָר 是用于发出信号的角制吹奏器；“号角”既保留器物形象，也符合现代汉语的警报场景。较具体的“羊角号”置于脚注。
- source_word: וְהִזְהִיר
  choice: 警告
  rationale: 该词的使役形式在这里指向人发出警告；“警告”简洁、自然，足以表达其使役意义。
- source_word: הָעָם
  choice: 百姓
  rationale: 此处指作为整体接受警告的民众；“百姓”符合庄重的圣经叙事语体，同时易于现代读者理解。
theological_decisions:
- issue: 先知警告中“刀剑”的转喻含义
  choice: 正文保留“刀剑”这一具体意象，让上下文呈现其所指的入侵、战争或审判。
  alternative: 解释性译作“战争”或“入侵的军队”。
  rationale: 原文明确使用 חֶרֶב。保留原有意象可维持先知语言的力度与神学张力，避免译文替读者限定其指涉。
translation_notes:
  register: 采用现代、庄重且易懂的汉语。以“他看见……就……”自然表达上下文中的条件性、连续性动作；句末逗号保留与下一节相接的句法走向。
