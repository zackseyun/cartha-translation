  - severity: low
    issue: “躺卧”未明确保留 וְהֻשְׁכַּב 的被动形式。
    rationale: 该 Hophal 动词表示“被安放/被放置”。采用“必被安放”既自然，也避免把原文的被动弱化为单纯状态。
  - severity: low
    issue: “全体民众”可能过度现代化并带出全民含义。
    rationale: הֲמוֹנוֹ 指其群众、众多随从或人群；“所有的群众”保留其集合意义而不限定社会或军事身份。
