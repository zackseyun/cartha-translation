  naturalness: 现有正文基本庄重通顺，但“与未受割礼的人一同躺卧在被刀杀的人中间”略显结构拥挤。“被安放在……中间，与……同列”更自然，也更清楚保留死亡中的屈辱性归类。
  terminology: “活人之地”“未受割礼的人”“法老”“主耶和华”均合适。“全体民众”可被理解为现代政治意义的全民，较 הֲמוֹנוֹ 宽泛；“所有的群众”较贴近“他的全体/众多随从”，而不无据限定为军队。
