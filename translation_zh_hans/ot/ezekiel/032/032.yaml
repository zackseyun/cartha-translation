source:
  edition: WLC
  text: כִּֽי נָתַ֥תִּי אֶת חתית/ו בְּ/אֶ֣רֶץ חַיִּ֑ים וְ/הֻשְׁכַּב֩ בְּ/ת֨וֹךְ עֲרֵלִ֜ים אֶת חַלְלֵי חֶ֗רֶב פַּרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/032.yaml
  text: For I put his terror in the land of the living[a], and he will be laid among the uncircumcised, with those slain by the sword—Pharaoh and all his multitude, declares the Lord GOD.
translation:
  language: zh_hans
  text: 因为我曾把他的恐惧加在活人之地[a]；他必被安放在未受割礼的人中间，与被刀杀的人同列——就是法老和他所有的群众。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按一些古代译本：“我曾把我的恐惧加在活人之地。”希伯来文本作“他的恐惧”。
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的审判陈述说明缘由；现代汉语用“因为”自然保留其连接作用。
- source_word: נָתַתִּי אֶת חֲתִיתוֹ
  choice: 我曾使他……令人恐惧
  rationale: נָתַתִּי 在此有“使、置于”的作用，חֲתִיתוֹ 字面为“他的恐惧/可怖”，即他所造成的恐惧；采用动词化表达，使中文清楚自然，同时保留第三人称后缀。
- source_word: בְּאֶרֶץ חַיִּים
  choice: 在活人之地
  rationale: 这是与阴间和死人领域相对的希伯来语惯用表达；“活人之地”既贴近原文，也符合庄重的现代汉语。
- source_word: וְהֻשְׁכַּב
  choice: 他必……躺卧
  rationale: 该词为 שׁכב 的 Hophal 形式，语义上指被安置、躺卧在死亡之中；中文被动式“被放躺”不自然，因此以“必躺卧”表达结果，而不增添埋葬细节。
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: 与未受割礼的人一同……在……中间
  rationale: 保留 עֲרֵלִים 的字面和其在《以西结书》中所带的盟约羞辱意味。
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: 在被刀杀的人中间
  rationale: אֶת 在此表示伴随；חַלְלֵי חֶרֶב 指被刀剑杀死的人。“被刀杀的人”简洁而保留暴力死亡意象。
- source_word: וְכָל הֲמוֹנוֹ
  choice: 他的全体民众
  rationale: הָמוֹן 可指众人、群众或大队；此处“全体民众”避免无根据地限定为军队，同时保持集体含义。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 是先知性宣告公式；“主耶和华”在中文中区分 אֲדֹנָי 与专名 יהוה，并保持庄重自然。
theological_decisions:
- issue: חֲתִיתוֹ 的人称归属
  choice: 他所造成的恐惧（译作“使他……令人恐惧”）
  alternative: 我的恐惧/我所造成的恐惧
  rationale: 马所拉文本的第三人称阳性单数后缀支持“他的”，语境所指为法老；部分古代见证支持第一人称，故在脚注中保存这一重要异文。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者熟悉的专名形式，不将其与前置的 אֲדֹנָי 合并为重复的“主主”；因此译为“主耶和华”。
- issue: 未受割礼者的表达
  choice: 未受割礼的人
  alternative: 未受割礼者
  rationale: 保留原文的身体、盟约和羞辱意象，不将其泛化为“外邦人”或另作神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前半句将希伯来语名词结构动词化为“使他……令人恐惧”，以免“把他的恐惧放在”造成歧义；后半句保留死亡群体中的羞辱性排列，并用破折号引出“法老和他的全体民众”的总结说明。
