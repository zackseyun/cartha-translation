revisions:
- from: 因为我曾使他在活人之地令人恐惧[a]；他必与未受割礼的人一同躺卧在被刀杀的人中间——法老和他的全体民众都必如此。这是主耶和华的宣告。
  to: 因为我曾把他的恐惧加在活人之地[a]；他必被安放在未受割礼的人中间，与被刀杀的人同列——就是法老和他所有的群众。这是主耶和华的宣告。
  rationale: 修订保留马所拉文本“他的恐惧”及其所指法老的语义，并以脚注准确保存“我的恐惧”的古代异读。将“躺卧”改为“被安放”，保留原文被动语态；调整死亡群体的句法，使现代汉语更流畅，同时不添加埋葬、军事身份或神学解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T08:04:12Z'
