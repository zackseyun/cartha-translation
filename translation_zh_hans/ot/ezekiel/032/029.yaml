  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שָׁ֣מָּ/ה אֱד֗וֹם מְלָכֶ֨י/הָ֙ וְ/כָל נְשִׂיאֶ֔י/הָ אֲשֶׁר נִתְּנ֥וּ בִ/גְבוּרָתָ֖/ם אֶת חַלְלֵי חָ֑רֶב הֵ֛מָּה אֶת עֲרֵלִ֥ים יִשְׁכָּ֖בוּ וְ/אֶת יֹ֥רְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/029.yaml
  text: There is Edom[a], her kings and all her princes, who were laid among those slain by the sword despite their might[b]. They lie with the uncircumcised and with those who go down to the pit.
translation:
  language: zh_hans
  text: 以东在那里，她的君王和所有首领也都在那里；他们虽有勇力[a]，仍被安置在刀下被杀的人中。他们与未受割礼的人一同躺卧，也与下到深坑[b]的人同在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带着他们的勇力”或“在他们的勇力中”。希伯来语的介词关系可以这样直译；上下文则突出了他们虽有勇力，仍不免败亡的反讽。
    reason: 词义与句法存在可成立的其他理解。
  - marker: b
    text: “深坑”是希伯来语中常用的死亡意象，可指坟墓或死人所在之处。
    reason: 说明古代文化与文学意象。
lexical_decisions:
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 保留指示副词的空间指向，承接本章对阴间景象的反复描写；“在那里”简明自然。
- source_word: אֱדוֹם מְלָכֶיהָ וְכָל נְשִׂיאֶיהָ
  choice: 以东在那里，她的君王和所有首领也都在那里
  rationale: “以东”采用通行国名；阴性后缀直指被拟人化的以东，译作“她的”；נְשִׂיאֶיהָ 在政治语境中译作“首领”，兼顾范围与现代可懂性。补出第二个“在那里”以使中文结构清楚。
- source_word: אֲשֶׁר נִתְּנוּ
  choice: 仍被安置
  rationale: 保留 נתן 的被动意义；在死者场景中，“被安置”既能表达被放置于其中，又不过度限定为正式埋葬。
- source_word: בִגְבוּרָתָם
  choice: 虽有勇力
  rationale: 上下文显示其勇力未能免除败亡，中文以让步结构自然传达反讽；脚注同时保留介词短语较直译的其他可能。
- source_word: אֶת חַלְלֵי חָרֶב
  choice: 在刀下被杀的人中
  rationale: 表达 חַלְלֵי חָרֶב 所指遭兵刃杀死的人，并按上下文将 אֶת 的伴随关系自然译为置身其中。
- source_word: עֲרֵלִים
  choice: 未受割礼的人
  rationale: 直译这一兼具盟约身份与羞辱意味的用语，不将其弱化为泛称的“列国”或“受辱的死者”。
- source_word: יִשְׁכָּבוּ
  choice: 躺卧
  rationale: 按异象中持续呈现的死亡状态用现在性描述；“躺卧”保留原有意象和庄重语体。
- source_word: יֹרְדֵי בוֹר
  choice: 下到深坑的人
  rationale: 保留“下去”与“坑”的先知文学意象；“深坑”在中文中能自然指向坟墓或死人所在之处，同时不把隐喻直接释义掉。
theological_decisions:
- issue: 审判神谕中“未受割礼的人”的含义
  choice: 保留为“未受割礼的人”
  alternative: 受辱的死者；列国的人
  rationale: 原词在以西结针对列国的神谕中同时带有盟约界线和死后蒙羞的意味。直译可保存这些张力，而不将它单纯解释为民族或荣辱类别。
- issue: בִגְבוּרָתָם 与以东领袖败亡的关系
  choice: 正文译作让步性的“虽有勇力”，并以脚注保留较直译的关系
  alternative: 带着他们的勇力；在他们的勇力中
  rationale: 上下文具有强烈反讽：他们的勇力未能阻止其落入被杀者中；但希伯来介词本身并未明说“尽管”，故在脚注中明确其字面歧义，避免把语境推论说成唯一语法意义。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“刀下被杀的人”“躺卧”“下到深坑”保留哀歌式的死亡意象；以分号和两个短句整理希伯来语较长的结构。所有脚注标记均置于其所解释的词语之后。
