reference: Ezekiel 32:30
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שָׁ֣מָּ/ה נְסִיכֵ֥י צָפ֛וֹן כֻּלָּ֖/ם וְ/כָל צִֽדֹנִ֑י אֲשֶׁר יָרְד֣וּ אֶת חֲלָלִ֗ים בְּ/חִתִּיתָ֤/ם מִ/גְבֽוּרָתָ/ם֙ בּוֹשִׁ֔ים וַ/יִּשְׁכְּב֤וּ עֲרֵלִים֙ אֶת חַלְלֵי חֶ֔רֶב וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/030.yaml
  text: There are all the princes of the north[a], all of them, and all the Sidonians, who went down with the slain in the terror they caused by their might, ashamed. They lie uncircumcised with those slain by the sword[c][b], and they bear their disgrace with those who go down to the pit.
translation:
  language: zh_hans
  text: 北方的众首领全都在那里，所有的西顿人也在那里；他们在自己凭勇力所造成的恐惧中，与被杀的人一同下去，满怀羞愧。他们以未受割礼者的身份，与被刀剑杀死的人一同躺卧；他们与下坑的人一同担当自己的羞辱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 这是指示地点的副词，在本章阴间死者的列举中指出他们所在之处；“在那里”自然且保留指示意味。
- source_word: נְסִיכֵי צָפוֹן
  choice: 北方的众首领
  rationale: נְסִיךְ 指有权位的统治者或首领；“众首领”既保留政治地位，又不把他们过度限定为王室成员。
- source_word: כֻּלָּם
  choice: 全都
  rationale: 明确保留希伯来文的周全语气。
- source_word: וְכָל צִדֹנִי
  choice: 西顿人也全都
  rationale: 单数族称在这里具有集合意义，译作“西顿人”符合现代汉语习惯。
- source_word: יָרְדוּ אֶת חֲלָלִים
  choice: 与被杀的人一同下去
  rationale: 本章反复用“下去”表示下到死者所在之处；此处 אֶת 按语境表达伴随关系。
- source_word: בְּחִתִּיתָם מִגְבוּרָתָם
  choice: 曾凭自己的勇力使人恐惧
  rationale: 该短语表示与他们相关的恐惧源自其勇力；汉语用使动表达受其威势震慑的是别人，同时以脚注保留原文压缩而略有歧义的结构。
- source_word: בּוֹשִׁים
  choice: 如今却蒙受羞辱
  rationale: 分词描写他们在死者之地所处的羞耻状态；“如今”点明结果状态，“却”呈现昔日威势与现今蒙羞的反差。
- source_word: וַיִּשְׁכְּבוּ
  choice: 躺在一起
  rationale: 在坟墓和阴间语境中，这一动词描写死者持续躺卧的状态，现代汉语以当前状态表达更自然。
- source_word: עֲרֵלִים
  choice: 未受割礼的人
  rationale: 保留以西结审判语言中具体的盟约性羞辱用语，不释义为“盟约之外的人”。
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: 和被刀剑杀死的人
  rationale: 按上下文把 אֶת 译为伴随关系；“被刀剑杀死的人”清楚传达 חַלְלֵי חֶרֶב。
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: 担当自己的羞辱
  rationale: 保留“背负、承担”羞辱的形象，并与前面的蒙羞相呼应。
- source_word: אֶת יֹרְדֵי בוֹר
  choice: 与下坑的人一同
  rationale: “坑”保留 בּוֹר 的具体意象；אֶת 依语境作伴随理解。
theological_decisions:
- issue: 审判语境中 עֲרֵלִים 的译法
  choice: 未受割礼的人
  alternative: 盟约之外的人
  rationale: 原文使用具体身体与盟约标记作为羞辱语，直译可让神学含义由上下文显出，避免把解释直接写进正文。
- issue: 阴间名录中 וַיִּשְׁכְּבוּ 的时态与体貌
  choice: 以“躺在一起”描写持续状态
  alternative: 译为过去事件“躺下了”
  rationale: 虽然形式上属于叙事动词链，此处的篇章功能是展示死者目前在坑中的排列和处境；状态式汉语更贴合异象名录的表达。
- issue: בְּחִתִּיתָם מִגְבוּרָתָם 所指的恐惧
  choice: 他们凭勇力使别人恐惧
  alternative: 他们自己因勇力而处于恐惧中
  rationale: 本章的审判语境通常指强国昔日加给活人之地的震慑；不过原文名词结构高度凝缩，因此以脚注呈现其较直译形式，不抹去语言张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“下去”“下坑”保留本章反复出现的死亡领域意象；句序略作调整，使昔日使人恐惧与如今蒙羞的对照在汉语中清楚，同时不把“未受割礼”解释性改写。
