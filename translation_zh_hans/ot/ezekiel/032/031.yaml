  text: אוֹתָ/ם֙ יִרְאֶ֣ה פַרְעֹ֔ה וְ/נִחַ֖ם עַל כָּל המונ/ה חַלְלֵי חֶ֨רֶב֙ פַּרְעֹ֣ה וְ/כָל חֵיל֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/031.yaml
  text: Pharaoh will see them and be comforted over all his multitude[a], Pharaoh and all his army, slain by the sword, declares the Lord GOD.
translation:
  language: zh_hans
  text: 法老必看见他们，便因他所有的众人而得到安慰[a]；法老和他的全军，都是被刀剑杀死的。这是主雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得到安慰”也可译作“得到宽慰”。这个希伯来语动词在其他语境中也可表示“后悔”或“回心转意”；但这里大概是说，法老看见别人也与他一同败亡，便从中得到一种阴森的慰藉。
    reason: 保留נחם的词义幅度，并说明本语境中最可能的含义。
lexical_decisions:
- source_word: אוֹתָם
  choice: 他们
  rationale: 作“看见”的直接宾语，回指上文阴间中的列国及其死者；中文用普通复数代词即可自然承接。
- source_word: יִרְאֶה
  choice: 必看见
  rationale: 未完成式在先知性语境中指向将来；“必”也体现宣告中的确定性。
- source_word: וְנִחַם
  choice: 便……得到安慰
  rationale: 此处最自然的意思是法老看见别国也遭遇同样结局，因而得到一种阴森而反讽的慰藉；同时以脚注保留该词在其他语境中的语义幅度。
- source_word: עַל כָּל הֲמוֹנוֹ
  choice: 因自己的全体民众
  rationale: עַל在此表示安慰的缘由或所关涉的对象；הָמוֹן指法老麾下庞大的人群，可涵盖民众与军势。“全体民众”比“群众”庄重，也避免把范围过早限定为军队。
- source_word: חַלְלֵי חֶרֶב
  choice: 被刀剑杀死的
  rationale: 这是指战争中遭刀剑杀戮而死的常见希伯来语表达；现代中文如此译法清楚自然。
- source_word: פַּרְעֹה וְכָל חֵילוֹ
  choice: 法老和他的全军
  rationale: חַיִל在本段指军事力量，“全军”简洁准确。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知书中的权威宣告公式；“主耶和华”既表达אֲדֹנָי，也保留神名יהוה的传统中文形式。
theological_decisions:
- issue: 法老“得到安慰”的含义
  choice: 保留“得到安慰”，并用脚注说明其阴森、反讽的语境
  alternative: 译作“后悔”或“回心转意”
  rationale: נחם确有后悔、改变心意等语义，但本句的结构和阴间列国共同败亡的上下文更支持“得安慰”：法老因并非独自遭受覆亡而获得冷酷的慰藉。正文不额外加入解释，以免消解原文张力。
- issue: אֲדֹנָי יְהוִה中神名的表达
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是现代中文圣经传统中对四字神名的通行专名，普通读者易于识别；与אֲדֹנָי合译为“主耶和华”，避免重复成“主主”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必看见……便……”呈现先知性将来及动作衔接；分号保留后半句与前句紧密相连的同位、总结关系，同时避免中文句子过度拖长。脚注标记[a]已置于正文相应词语之后。
