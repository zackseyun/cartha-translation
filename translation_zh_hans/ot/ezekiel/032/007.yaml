  text: וְ/כִסֵּיתִ֤י בְ/כַבּֽוֹתְ/ךָ֙ שָׁמַ֔יִם וְ/הִקְדַּרְתִּ֖י אֶת כֹּֽכְבֵי/הֶ֑ם שֶׁ֚מֶשׁ בֶּ/עָנָ֣ן אֲכַסֶּ֔/נּוּ וְ/יָרֵ֖חַ לֹא יָאִ֥יר אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/007.yaml
  text: When I extinguish you[a], I will cover the heavens and darken their stars; I will cover the sun with a cloud, and the moon will not give its light.
translation:
  language: zh_hans
  text: 你熄灭的时候[a]，我必遮蔽天空，使天上的众星昏暗；我必用云遮住太阳，月亮也必不发光。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“我使你熄灭的时候”。希伯来文采用灯火被熄灭的意象，短语本身没有明说是谁使其熄灭。
    reason: 保留原文在施事者方面的含混，并说明“熄灭”的比喻意象。
lexical_decisions:
- source_word: בְכַבּוֹתְךָ
  choice: 你熄灭的时候
  rationale: כבה表示“熄灭、被熄灭”，此处是不定式附第二人称单数后缀。译文保留如灯火熄灭的意象，也不在正文中强行判定是自行熄灭、被熄灭，还是上帝使其熄灭。
- source_word: וְכִסֵּיתִי
  choice: 我必遮蔽
  rationale: כסה意为“遮盖、遮蔽”。先知性审判语境中的连续动词指向将来的行动，故用“必”表达。
- source_word: שָׁמַיִם
  choice: 天空
  rationale: 该词可指“天、诸天、天空”。此处与星辰、太阳、月亮并列，“天空”在现代汉语中自然清楚，同时保留宇宙变暗的图景。
- source_word: וְהִקְדַּרְתִּי אֶת כֹּכְבֵיהֶם
  choice: 使天上的众星昏暗
  rationale: קדר的使役式表示“使变暗”。后缀按语法回指שָׁמַיִם；汉语用“天上的众星”比直译“它们的星”自然。
- source_word: שֶׁמֶשׁ בֶּעָנָן אֲכַסֶּנּוּ
  choice: 我必用云遮住太阳
  rationale: 介词ב可表工具，译作“用”；宾语后缀指太阳。“遮住”自然呈现云遮蔽太阳的画面。
- source_word: וְיָרֵחַ לֹא יָאִיר אוֹרוֹ
  choice: 月亮也不再发出光辉
  rationale: אור的使役式在此表示发光、放出其光。“不再发出光辉”符合现代汉语，也传达审判后光明止息的意味。
theological_decisions:
- issue: 宇宙变暗语言的性质
  choice: 按经文直接呈现天空、星辰、太阳和月亮变暗的审判图景，不说明其究竟是字面的宇宙事件还是象征性的政权倾覆。
  alternative: 明确限定为字面宇宙灾变，或明确解释为法老和埃及败亡的政治隐喻。
  rationale: 原文采用先知书常见的宇宙性审判意象；翻译应保留其张力和力度，而不替文本作排他性解释。
- issue: 熄灭动作的施事者
  choice: 正文译作“你熄灭的时候”，并以脚注说明也可按语境理解为“我使你熄灭的时候”。
  alternative: 在正文中直接译作“我使你熄灭的时候”。
  rationale: 希伯来语形式字面上是“在你熄灭之时”，没有在该短语内明说施事者；但上下文中的第一人称审判行动容许使役性理解。正文与脚注共同保留语法和语境之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“昏暗”“光辉”保持先知性诗歌的力度，但避免古奥表达；分号保留经文两组平行的宇宙变暗画面。
