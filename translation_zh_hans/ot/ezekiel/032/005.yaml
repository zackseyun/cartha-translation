  text: וְ/נָתַתִּ֥י אֶת בְּשָׂרְ/ךָ֖ עַל הֶֽ/הָרִ֑ים וּ/מִלֵּאתִ֥י הַ/גֵּאָי֖וֹת רָמוּתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/005.yaml
  text: And I will put your flesh on the mountains[a], and I will fill the valleys with your carcass.
translation:
  language: zh_hans
  text: 我必将你的肉置于群山上，用你庞大的身躯[a]填满山谷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的尸身”；较字面可作“你的高度”或“你高大的身躯”。这里的希伯来语词义难定；上下文所描绘的是法老如巨兽般倒下，其庞大的身躯横陈大地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要把……放在
  rationale: נתן在此表示“放置、安放”；直陈上帝施行审判的行动，并与尸身横陈地面的语境相合。
- source_word: בְּשָׂרְךָ
  choice: 你的肉
  rationale: בשר直指“肉、血肉”；保留原文刻意呈现的具体而惨烈的审判图景，不弱化为较含蓄的“身体”。
- source_word: הֶהָרִים
  choice: 群山
  rationale: הרים通常指山岳；“群山”自然体现复数，也与下句“山谷”构成地貌上的对应。
- source_word: וּמִלֵּאתִי
  choice: 填满
  rationale: מלא的皮勒式在这里意为“使充满”；“填满”简明有力。
- source_word: הַגֵּאָיוֹת
  choice: 山谷
  rationale: גיא可指谷地或峡谷；这里与“群山”并列，“山谷”是现代汉语中自然且宽泛的表达。
- source_word: רָמוּתֶךָ
  choice: 你高大的躯体
  rationale: 该词形式罕见，字面与“高、高大”有关；语境则指法老所象征的巨兽倒下后的庞大躯体。正文保留“高大”这一词源线索，同时以“躯体”传达上下文所指，避免无注释地直接确定为“尸体”。
theological_decisions:
- issue: 暴力审判意象的表达
  choice: 保留“肉”被放在群山上、庞大躯体填满山谷的具体图景。
  alternative: 为缓和语气而译作“身体”或“遗骸”。
  rationale: 本节是先知性的审判宣告，借惨烈意象表现法老的败亡与受辱；淡化这些词会削弱原文力度。
- issue: רָמוּתֶךָ的语义张力
  choice: 正文译作“你高大的躯体”，脚注说明也可按语境理解为尸身。
  alternative: 直接译作“你的尸体”或拘泥字面译作“你的高度”。
  rationale: 希伯来语本身难解；兼顾词形所含的“高大”概念和上下文中倒毙巨兽的躯体，较能保存原文歧义，而不把一种解释绝对化。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“群山—山谷”保持诗性地貌对照；“肉”保留审判图景的强烈质感。“高大的躯体”虽略显非常规，却有意保存原词的困难与语义张力，并由脚注辅助理解。
