id: EZK.32.4
reference: Ezekiel 32:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/נְטַשְׁתִּ֣י/ךָ בָ/אָ֔רֶץ עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה אֲטִילֶ֑/ךָ וְ/הִשְׁכַּנְתִּ֤י עָלֶ֨י/ךָ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/הִשְׂבַּעְתִּ֥י מִמְּ/ךָ֖ חַיַּ֥ת כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/004.yaml
  text: I will cast you onto the land[a]; I will throw you down on the open field, and I will cause every bird of the heavens to settle on you[b], and I will satisfy the beasts of all the earth with you.
translation:
  language: zh_hans
  text: 我要把你抛在陆地上[a]，把你扔在田野上；我要使空中各样的飞鸟都栖落在你身上，并让全地的野兽以你为食，吃得饱足[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抛在”也可译作“丢弃在”或“撇弃在”；原文动词可表达离弃、丢下或抛弃。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“我要使全地的野兽从你得饱足”，意思是野兽以你为食，吃得饱足。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: 我要把你抛在陆地上
  rationale: נטשׁ 可指丢下、离弃或抛弃；此处与随后“扔在田野上”及任凭飞鸟野兽吞食的审判图景相连，“抛在”既体现弃置，也保留强烈动作感。
- source_word: בָאָרֶץ
  choice: 在陆地上
  rationale: אֶרֶץ 可指地、土地或大地；这里与田野平行，并与前文水中巨兽的意象形成对照，因此译作“陆地”较明确。
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: 在田野上
  rationale: עַל־פְּנֵי 字面为“在……表面上”；现代汉语以“在田野上”自然表达尸身暴露于野外的图景，无须生硬译作“田野表面”。
- source_word: אֲטִילֶךָ
  choice: 把你扔在
  rationale: טול 的使役式表达投掷、扔下；“扔”保留暴力弃置之意，并避免与前句“抛”完全重复。
- source_word: וְהִשְׁכַּנְתִּי עָלֶיךָ
  choice: 我要使……栖落在你身上
  rationale: שׁכן 的使役式意为使居住、停留；针对食腐飞鸟，“栖落在”在现代汉语中自然，也保留其停驻于尸身之上的画面。
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: 空中各样的飞鸟
  rationale: עוֹף 是飞禽的集合称谓，הַשָּׁמַיִם 在此指天空；“空中各样的飞鸟”兼顾总体范围和自然汉语表达。
- source_word: וְהִשְׂבַּעְתִּי מִמְּךָ
  choice: 让……以你为食，吃得饱足
  rationale: שׂבע 的使役式指使其饱足，מִמְּךָ 字面为“从你”；展开为“以你为食，吃得饱足”可清楚传达野兽因吞食其尸体而饱足的含义。
- source_word: חַיַּת כָּל הָאָרֶץ
  choice: 全地的野兽
  rationale: חַיָּה 在食腐语境中指野兽；כָּל הָאָרֶץ 可理解为全地或整个大地，译作“全地”保留其广阔范围及原文可能的地域性。
theological_decisions:
- issue: אֶרֶץ／הָאָרֶץ 在审判宣告中的范围
  choice: 首处译作“陆地”，末处译作“全地”
  alternative: 两处均译作“大地”或“土地”
  rationale: 首处由“田野”限定，并与水中巨兽被拖到干地的意象相应，故“陆地”贴切；末处“全地的野兽”是范围较广的概括。如此处理保留上下文差异，而不武断判定末处是全球性还是地域性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“抛”“扔”保留先知审判话语的力度；“栖落”“吃得饱足”使食腐场景明确，但不增加原文没有的细节。所有脚注标记均已置于正文。
