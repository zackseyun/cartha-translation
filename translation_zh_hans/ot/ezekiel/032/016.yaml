  text: קִינָ֥ה הִיא֙ וְ/ק֣וֹנְנ֔וּ/הָ בְּנ֥וֹת הַ/גּוֹיִ֖ם תְּקוֹנֵ֣נָּה אוֹתָ֑/הּ עַל מִצְרַ֤יִם וְ/עַל כָּל הֲמוֹנָ/הּ֙ תְּקוֹנֵ֣נָּה אוֹתָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/016.yaml
  text: This is a lamentation[a], and the daughters of the nations will lament over her. They will lament over Egypt and over all her multitude[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 这是一首哀歌[a]；列国的女子[b]要哀唱这首哀歌。她们要为埃及及其所有的众民哀唱这首哀歌。这是主雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哀歌”也可译作“挽歌”；希伯来语指为死亡或覆亡而唱的哀悼之歌。
    reason: lexical_alternative
  - marker: b
    text: 直译“列国的女儿们”，这里可理解为列国中的女子。
    reason: literal_rendering
lexical_decisions:
- source_word: קִינָה
  choice: 哀歌
  rationale: 指为死者或覆亡者所作、所唱的哀悼之歌；“哀歌”既保留歌曲性质，也符合本节正式、庄重的语体。
- source_word: וְקֹנְנוּהָ
  choice: 人要吟唱它
  rationale: קונן表示唱出或吟咏哀歌，阴性单数后缀指前面的“哀歌”，不是埃及。希伯来语此处没有明说主语，因此用泛指的“人”，避免误把后面的“列国的女子”强行当作这个动词的语法主语。
- source_word: בְּנוֹת הַגּוֹיִם
  choice: 列国的女子
  rationale: 直译为“列国的女儿们”，语境中指列国中的女子，可能是承担哀唱的人；正文采用现代汉语较自然的“女子”，脚注保留字面表达。
- source_word: תְּקוֹנֵנָּה אוֹתָהּ
  choice: 要吟唱它
  rationale: 阴性复数动词与“列国的女子”一致；宾语“它”仍指哀歌。重复“吟唱”保留原文刻意反复的哀歌节奏。
- source_word: עַל מִצְרַיִם וְעַל כָּל הֲמוֹנָהּ
  choice: 为埃及和她所有的众民
  rationale: 哀悼语境中的עַל标示哀唱对象，译作“为”。הָמוֹן在以西结书中可指一国庞大的人群、群众或军旅；“众民”在此不把含义限缩为军队或财富。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主雅威的宣告
  rationale: נְאֻם是先知性宣告公式；“雅威”音译四字神名יהוה，并以“主雅威”对应אֲדֹנָי יְהוִה，避免译成重复的“主主”。
theological_decisions:
- issue: יהוה在“אֲדֹנָי יְהוִה”中的译法
  choice: 主雅威
  alternative: 主耶和华；主上帝
  rationale: 原文直接使用神的专名יהוה；“雅威”较直接地保留专名性质，“主”对应אֲדֹנָי。此译法不把专名改写为称号，也避免“主主”的重复。
- issue: 哀歌中阴性宾语后缀的所指
  choice: “它”指哀歌
  alternative: 把后缀理解为埃及，并译作“为她哀哭”
  rationale: 语法上，紧邻的阴性单数名词קִינָה自然是וְקֹנְנוּהָ和אוֹתָהּ的先行词；后文另以עַל引出埃及和她的众民，作为哀歌所哀悼的对象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文三次使用קונן所形成的反复，以“吟唱”凸显这是实际唱出的哀歌；用“众民”保留הָמוֹן可能涵盖群众、人口或大批随从的宽泛含义。
