  naturalness: 原文总体庄重通顺，但“人要吟唱它；列国的女子要吟唱它”在现代汉语中显得突兀且重复。改为由“列国的女子”统领两个哀唱动作，既符合希伯来语后置主语，也更自然。
  terminology: “哀歌”“列国的女子”“众民”和“主雅威”均可保留。“哀唱”比单用“吟唱”更明确表达קונן的哀悼性，同时保留其作为唱出的哀歌这一性质。
