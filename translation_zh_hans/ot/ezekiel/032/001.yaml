  text: וַֽ/יְהִי֙ בִּ/שְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה בִּ/שְׁנֵי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/001.yaml
  text: And it happened in the twelfth year[a], in the twelfth month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: zh_hans
  text: 第十二年十二月初一，耶和华的话临到我说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这是叙事性日期公式的引入语；现代汉语以日期起句并接“临到我说”，已自然表达事件发生，无须生硬增译“事情发生了”。
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: 第十二年
  rationale: 忠实保留原文纪年；原文未明说以何事为纪元，因此不补入“被掳”等解释。
- source_word: בִּשְׁנֵי עָשָׂר חֹדֶשׁ
  choice: 十二月
  rationale: 对应原文“第十二个月”，按现代汉语日期表达译为“十二月”。
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: 初一
  rationale: 这是希伯来语表示当月第一日的日期惯用语；“初一”在现代汉语中简洁清楚。
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: 耶和华的话临到我
  rationale: 保留先知书常用启示公式；“临到”自然表达话语来到先知那里的动态含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中对四字神名最通行、最易识别的音译，不以“主”这一称号代替专名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 引出下一节的直接话语；汉语“临到我说”简洁自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。中文正文采用广为人知的“耶和华”，同时不把神名改译为称号；“雅威”是较贴近学术重构读音的另一音译。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。日期压缩为汉语惯用的“第十二年十二月初一”；保留“耶和华的话临到我”这一清晰、熟悉的先知书公式。英文资料所列脚注标记与正文不一致，且脚注内容实际涉及神名而非年份；本稿不沿用这一错置脚注。
