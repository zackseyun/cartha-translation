  text: 你比谁更华美呢？下去吧，与未受割礼的人一同躺卧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמִּי נָעָמְתָּ
  choice: 你比谁更华美呢
  rationale: מִן与疑问代词מִי构成比较问句；נעם在此哀歌语境中指令人欣悦的美好、华美。译成反问式比较，既自然又保留原文的修辞意味。
- source_word: רְדָה
  choice: 下去吧
  rationale: 这是ירד的命令式，语境指下到死人所在之处；“下去吧”简洁地保留命令语气及空间意象。
- source_word: וְהָשְׁכְּבָה
  choice: 一同躺卧
  rationale: שכב在死亡语境中可指躺卧于坟墓或死人中间。采用“躺卧”而不译作“安息”，避免加入原文没有明说的安宁意味；“一同”也自然表达后接אֶת的伴随关系。
- source_word: אֶת עֲרֵלִים
  choice: 与未受割礼的人
  rationale: אֶת在שכב之后表达伴随或同处；עֲרֵלִים具体指未受割礼者。直译保留以色列文化中的盟约标记和此处的羞辱意味，不泛化为“异教徒”或“不洁净的人”。
theological_decisions:
- issue: עֲרֵלִים在审判与死亡语境中的含义
  choice: 未受割礼的人
  alternative: 异教徒；不洁净的人
  rationale: 原文明确诉诸是否受割礼这一具体身份标记。保留该表达，既保存其盟约及羞辱意象，也避免把它解释成更宽泛的宗教或礼仪类别。
- issue: שכב的死亡意涵
  choice: 躺卧
  alternative: 安息；被安葬
  rationale: 上下文使“躺卧”带有死亡和坟墓意涵，但该动词本身没有明确表达安宁或完整的埋葬动作；较直接的译法保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“华美”适合针对埃及的哀歌语境；“未受割礼的人”保留原文具体文化意象。脚注说明命令结构也可理解为两个并列动作。
