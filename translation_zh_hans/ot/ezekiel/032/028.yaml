  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֗ה בְּ/ת֧וֹךְ עֲרֵלִ֛ים תִּשָּׁבַ֥ר וְ/תִשְׁכַּ֖ב אֶת חַלְלֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/028.yaml
  text: But you[a], in the midst of the uncircumcised, will be broken and will lie with those slain by the sword.
translation:
  language: zh_hans
  text: 然而你也必在未受割礼的人中间被摧毁，和被刀剑杀死的人一同躺卧。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: 然而你也
  rationale: 连词加独立代词形成强调性的直接称呼，并从前述列国转向法老；“然而你也”既体现语境中的转折，也保留“你同样如此”的含意。
- source_word: בְּ/ת֧וֹךְ
  choice: 在……中间
  rationale: 准确表达置身某一群体之中的意思，同时保持哀歌庄重的语气。
- source_word: עֲרֵלִים
  choice: 未受割礼的人
  rationale: 保留希伯来文具体的身体和盟约文化用语；在本章语境中，这也是死后蒙羞的标记，不泛化为“不洁的人”或“不敬虔的人”。
- source_word: תִּשָּׁבַר
  choice: 必……被打碎
  rationale: 该词为שבר的尼法勒未完成式，表达被动的摧毁和败亡；“被打碎”比单说“败亡”更能保留原文意象。
- source_word: וְ/תִשְׁכַּב
  choice: 一同躺卧
  rationale: שׁכב在此死亡和坟墓语境中指躺卧；加入“一同”自然呈现随后אֶת所表达的伴随关系，但不明说“埋葬”或“死亡”，以免过度解释。
- source_word: אֶת חַלְלֵי חָרֶב
  choice: 与被刀剑杀死的人
  rationale: 此处אֶת按伴随意义理解；חַלְלֵי חָרֶב直指遭刀剑杀死的人，译文既自然又保留暴力审判的图像。
theological_decisions:
- issue: 列国哀歌中“未受割礼的人”的含义
  choice: 保留字面的文化和盟约性称谓“未受割礼的人”
  alternative: 不洁的人；不敬虔的人；异教徒
  rationale: 原文明确使用割礼这一身体和盟约文化术语；在《以西结书》32章中，它带有死后受辱的意味。直译可保存原文的神学张力，避免把它解释成经文并未明说的普遍道德或宗教类别。
- issue: וְאַתָּה在上下文中的衔接力度
  choice: 译作“然而你也”
  alternative: 而你；你也
  rationale: 该表达既可能是一般承接，也在语境中形成对法老的转折性强调。“然而你也”同时传达对比和法老将与前述列国同遭命运的意味。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“刀剑”保留先知性审判语域；“躺卧”含蓄保留死亡和阴间场景，不增译为“埋葬”。本节无需脚注；所给英文脚注内容与其正文及标记位置不一致，且中文正文已直接、自然地表达希伯来文伴随结构。
