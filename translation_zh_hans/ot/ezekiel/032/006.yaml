source:
  edition: WLC
  text: וְ/הִשְׁקֵיתִ֨י אֶ֧רֶץ צָפָתְ/ךָ֛ מִ/דָּמְ/ךָ֖ אֶל הֶֽ/הָרִ֑ים וַ/אֲפִקִ֖ים יִמָּלְא֥וּ/ן מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/006.yaml
  text: I will drench the land with your flowing blood up to the mountains[c][b][a], and the ravines will be filled with you.
translation:
  language: zh_hans
  text: 我必用你涌流的血浸透大地，直到山岭[a]；沟谷[b]都必被你充满[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文较难理解。也可译作：“我必用你的血浇灌你所漫溢之地，直到山岭。”
    reason: lexical_alternative
  - marker: b
    text: “沟谷”也可译作“水道”或“河床”。
    reason: lexical_alternative
  - marker: c
    text: “被你充满”直译为“从你而充满”，在上下文中可能指被你的血或残骸充满。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקֵיתִי
  choice: 浸透
  rationale: 使役形字面意为“使喝、浇灌”。在血漫遍地的审判图景中，“浸透”既传达土地被血浸湿，也避免过强的农耕色彩。
- source_word: אֶרֶץ
  choice: 大地
  rationale: 此处指埃及境内的地面和地貌；“大地”与后面的山岭、沟谷自然衔接。
- source_word: צָפָתְךָ מִדָּמְךָ
  choice: 你涌流的血
  rationale: צָפָתְךָ是罕见而难解的形式，可能指涌出、漫溢之物；紧接的מִדָּמְךָ明确涉及“你的血”。正文以“涌流的血”表达上下文中血液倾泻的可能含义，同时用脚注保留原文的不确定性。
- source_word: אֶל הֶהָרִים
  choice: 直到山岭
  rationale: אֶל在此可表达蔓延所及的范围；“直到山岭”比单纯“到山岭”更清楚地呈现血漫大地的景象。
- source_word: וַאֲפִקִים
  choice: 沟谷
  rationale: אֲפִיקִים可指水道、河床或谷沟。此处与山岭并列描绘地貌，“沟谷”自然且形象。
- source_word: יִמָּלְאוּן מִמֶּךָּ
  choice: 都必被你充满
  rationale: יִמָּלְאוּן为被动意义“被充满”；מִמֶּךָּ字面是“从你”，正文保留第二人称的直接性，不把所充满之物限定为血或尸骸。
theological_decisions: []
translation_notes:
  register: 采用庄重而清晰的现代书面汉语。“浸透大地”“直到山岭”“沟谷”构成连贯的地貌图景；正文保留“被你充满”的骇人直述，脚注说明其可能所指，避免在难解原文上作过度确定的解释。
