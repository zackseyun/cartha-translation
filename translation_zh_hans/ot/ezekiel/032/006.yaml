  source_fidelity: 译文准确传达了审判图景：神以受审者的血浸透土地，范围直到山岭，沟谷也因受审者而充满。对罕见且语义有争议的“צָפָתְךָ”采用“涌流的血”属于有上下文依据的解释性译法，并以脚注保留其困难和替代理解；“被你充满”保留了原文第二人称及“מִמֶּךָּ”（从你而来／由你所出）的刻意未明说的指向，没有在正文中擅定为血或残骸。
  naturalness: 现代汉语庄重、清晰且顺畅。“浸透大地，直到山岭；沟谷都必被你充满”具有适合先知审判诗歌的凝练和强烈意象。“被你充满”在汉语中可自然表达沟谷为“你”所充满，虽保有原文令人不安的直接性。
  terminology: “大地”“山岭”“沟谷”在此地貌语境中恰当；“浸透”很好地对应使役式“使喝／浇灌”在血腥审判语境中的效果，避免了“浇灌”可能带来的农耕语感。脚注所列“水道”“河床”适切保留了“אֲפִיקִים”的词义范围。
