source:
  edition: WLC
  text: אֲשֶׁ֨ר נִתְּנ֤וּ קִבְרֹתֶ֨י/הָ֙ בְּ/יַרְכְּתֵי ב֔וֹר וַ/יְהִ֣י קְהָלָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֤/ם חֲלָלִים֙ נֹפְלִ֣ים בַּ/חֶ֔רֶב אֲשֶׁר נָתְנ֥וּ חִתִּ֖ית בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/023.yaml
  text: whose graves were set in the remotest parts of the pit[a], and her assembly was around her grave—all of them slain, fallen by the sword[b], who spread terror in the land of the living.
translation:
  language: zh_hans
  text: 她的坟墓安置在坑的深处[a]；她的会众围绕着她的坟墓。他们全都是被杀的、倒在刀下的，曾在活人之地使人恐惧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坑的隐密处”或“坑的最里面”。
    reason: יַרְכְּתֵי可指最里面、边远或隐密的区域；“深处”保留其空间意象而不限定为单纯的垂直深度。
  - marker: b
    text: 或译：“在活人之地造成恐怖”。
    reason: נָתְנוּ חִתִּית为惯用表达，意为使人恐惧或造成恐怖。
lexical_decisions:
- source_word: נִתְּנוּ
  choice: 设在
  rationale: 此处是 נתן 的被动式，表示坟墓被安置在某处；“设在”在现代汉语中自然，并保留被动含义。
- source_word: קִבְרֹתֶיהָ
  choice: 她的坟墓
  rationale: 阴性单数后缀指向上下文中被拟人化的国家；用“她”保留先知文学中的拟人手法。
- source_word: בְּיַרְכְּתֵי בוֹר
  choice: 在坑的最深处
  rationale: יַרְכְּתֵי 表示尽头、深处或隐密之处；“最深处”贴合地下深坑的空间意象，而“坑”准确对应 בוֹר，未将其解释性地改作“阴间”。
- source_word: קְהָלָהּ
  choice: 她的众人
  rationale: קהל 在这里指聚集在一起的一群人；“众人”比“会众”更自然，也避免在该军事与丧葬语境中引入宗教聚会色彩。
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: 围绕着她的坟墓
  rationale: 直接表达其空间关系，并与前句的坟墓意象保持一致。
- source_word: כֻּלָּם חֲלָלִים
  choice: 他们全都是被杀的人
  rationale: חֲלָלִים 常指遭暴力杀害者，尤其是战死者；“被杀”保留其暴力意味。
- source_word: נֹפְלִים בַּחֶרֶב
  choice: 倒在刀下的人
  rationale: 该分词在此作描述性同位语；“倒在刀下”既保留军事语域，也符合现代汉语表达。
- source_word: נָתְנוּ חִתִּית
  choice: 散布恐怖
  rationale: נתן 与 חִתִּית 构成惯用表达，指使别人恐惧或造成震慑；“散布恐怖”保留其施加于他人的效果。
- source_word: בְּאֶרֶץ חַיִּים
  choice: 在活人之地
  rationale: 这是与坑和死者领域相对照的希伯来语惯用表达；直译为“活人之地”可保留这一鲜明对比。
theological_decisions:
- issue: 国家或群体的阴性拟人化
  choice: 用“她”表达阴性单数后缀
  alternative: 用“它”强调政治实体的非人格性质
  rationale: 希伯来文连续使用阴性单数后缀，符合先知书将国家拟人化的写法；“她”保留文学效果而不增加额外教义解释。
- issue: בוֹר 的地下世界意象
  choice: 译为“坑”
  alternative: 译为“阴间”或“坟墓”
  rationale: 原文使用 בוֹר，而非 שְׁאוֹל；译作“坑”保留原有意象，也避免把词义限定为更具体的神学概念。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“坑—活人之地”的上下对照、国家的阴性拟人化，以及“被杀、倒在刀下”的并列军事措辞；不把 בוֹר 神学化为“阴间”。
