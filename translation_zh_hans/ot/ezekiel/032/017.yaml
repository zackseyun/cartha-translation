base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/017.yaml
  text: And it happened in the twelfth year[a], on the fifteenth day of the month, that the word of Yahweh came to me, saying,
translation:
  language: zh_hans
  text: 第十二年，某月十五日，雅威的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这是希伯来叙事中承接上下文并引入事件的常用形式；现代汉语以日期起句，再用“临到”自然表达事件发生，无须生硬译作“事情发生了”。
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: 第十二年
  rationale: 准确保留原文的纪年格式，符合现代汉语表达。
- source_word: בַּחֲמִשָּׁה עָשָׂר לַחֹדֶשׁ
  choice: 某月十五日
  rationale: 原文只说“该月十五日”，没有注明月份；汉语补出“某”可避免误以为前文已明确月份，同时保留文本信息的不完整性。
- source_word: דְבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书中固定的启示公式，并以现代中文圣经语域中通行的专名“耶和华”表达四字神名。
- source_word: אֵלַי
  choice: 临到我
  rationale: “临到”自然、庄重地表达神的话向先知而来，是该先知公式在汉语中的清晰对应。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用于引出下文直接话语；比逐字译为“如此说”更符合现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用读者较熟悉且有专名功能的“耶和华”；“雅威”是较接近现代学界拟音的替代译法，但原始发音并不能完全确定。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留先知书日期公式和“耶和华的话临到我”的传统而自然的经文语域。原文未载月份，正文以“某月”明确反映这一缺省信息，不擅自据古译本补足。
