source:
  edition: WLC
  text: בֶּן אָדָ֗ם שָׂ֤א קִינָה֙ עַל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וְ/אָמַרְתָּ֣ אֵלָ֔י/ו כְּפִ֥יר גּוֹיִ֖ם נִדְמֵ֑יתָ וְ/אַתָּה֙ כַּ/תַּנִּ֣ים בַּ/יַּמִּ֔ים וַ/תָּ֣גַח בְּ/נַהֲרוֹתֶ֗י/ךָ וַ/תִּדְלַח מַ֨יִם֙ בְּ/רַגְלֶ֔י/ךָ וַ/תִּרְפֹּ֖ס נַהֲרוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/002.yaml
  text: 'Son of man[a], raise a lament over Pharaoh king of Egypt, and say to him: You compared yourself to a young lion among the nations, but you were like the monster in the seas; you burst forth in your rivers, and muddied the waters with your feet[c][b], and fouled their rivers.'
translation:
  language: zh_hans
  text: '“人子啊，你要为埃及王法老作一首哀歌，对他说：

    ‘你自比为列国中的少壮狮子[a]，

    却像海中的巨兽[b]；

    你在自己的河流中横冲直撞[c]，

    用脚把水搅浑，

    把他们的河流踩得污浊[d]。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你被比作列国中的少壮狮子。”希伯来语动词既可按反身理解，也可按被动理解。
    reason: alternative_reading
  - marker: b
    text: “巨兽”所译的希伯来语在这里可能指巨大的水生怪兽，也可译作“海怪”或“巨龙”。
    reason: lexical_alternative
  - marker: c
    text: “横冲直撞”所译的希伯来语动词可表示冲出、冲撞或用角抵撞；本句的确切水中动作不完全确定。
    reason: lexical_alternative
  - marker: d
    text: 直译：“践踏他们的河流。”“他们”所指的对象在本句中没有明说，可能承接前文的列国。
    reason: ambiguity
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留希伯来语对以西结一贯使用的称呼，简洁庄重，也符合现代中文圣经语体。
- source_word: שָׂא קִינָה
  choice: 作一首哀歌
  rationale: 这是先知文学中发起哀悼之歌的固定表达；“作一首哀歌”在现代中文中自然，并保留其丧歌性质。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老
  rationale: 按希伯来语头衔次序直译，表达清楚自然。
- source_word: כְּפִיר גּוֹיִם
  choice: 列国中的少壮狮子
  rationale: כְּפִיר 指年轻而有力量的狮子；“列国中的”较自然地呈现其关系范围。
- source_word: נִדְמֵיתָ
  choice: 你自比为
  rationale: 该词的 Niphal 形式可作被动或反身理解；本句的讥讽语境允许反身译法，但在脚注保留被动可能。
- source_word: כַּתַּנִּים בַּיַּמִּים
  choice: 像海中的巨兽
  rationale: 在海与河流的水域语境中，תַּנִּים 最可能指巨大可怖的水生物；“巨兽”避免过度限定为某种动物，也保留神话性意象的张力。
- source_word: וַתָּגַח בְּנַהֲרוֹתֶיךָ
  choice: 你在自己的河流中横冲直撞
  rationale: 动词含冲出、冲撞或以角抵撞的猛烈动作；“横冲直撞”在水域意象中传达其扰动和暴烈，同时“自己的河流”明确保留第二人称单数所属后缀。
- source_word: וַתִּדְלַח מַיִם בְּרַגְלֶיךָ
  choice: 用脚把水搅浑
  rationale: דלח 表示使水浑浊；此译简明地保留动作、工具和结果。
- source_word: וַתִּרְפֹּס נַהֲרוֹתָם
  choice: 把他们的河流踩得污浊
  rationale: רפס 的核心意象是践踏；结合河流作宾语，“踩得污浊”兼顾字面动作及其水中效果，并保留第三人称复数所属后缀。
theological_decisions:
- issue: נִדְמֵיתָ 的语态与法老形象
  choice: 正文译作“你自比为”，呈现反身理解
  alternative: “你被比作”或“你仿佛是”
  rationale: Niphal 在此可理解为被动或反身。哀歌的讥讽语气支持法老自我夸耀的反身读法，但语法并不排除被动，因此以脚注明确保留另一可能，不把神学或修辞判断绝对化。
- issue: תַּנִּים 的生物身份
  choice: 巨兽
  alternative: 海怪、巨龙、鳄鱼
  rationale: 上下文明确是水域中的巨大生物，却不足以唯一确定其物种或是否带有神话色彩；采用较宽泛的“巨兽”，避免将其专断地认定为鳄鱼或神话巨龙。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。诗行排列保留哀歌的节奏和意象推进；避免生硬照搬希伯来语词序，同时不消除动词语态、海中巨兽身份及复数代词所指的真实歧义。
