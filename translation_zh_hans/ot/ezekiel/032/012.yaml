  text: בְּ/חַרְב֤וֹת גִּבּוֹרִים֙ אַפִּ֣יל הֲמוֹנֶ֔/ךָ עָרִיצֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם וְ/שָֽׁדְדוּ֙ אֶת גְּא֣וֹן מִצְרַ֔יִם וְ/נִשְׁמַ֖ד כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/012.yaml
  text: By the swords of mighty men I will make your multitude fall— all of them the ruthless ones of the nations[a]. They will plunder the pride of Egypt[b], and all her multitude will be destroyed.
translation:
  language: zh_hans
  text: 我必借勇士的刀使你的众民倒下；这些勇士全是列国中残暴的人[a]。他们必掳掠埃及所夸耀的[b]，她的众民都必被毁灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国中的强暴者”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“埃及的骄傲”或“埃及的威荣”；希伯来词既可指骄傲，也可指威严、荣华。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַרְבוֹת גִּבּוֹרִים
  choice: 借勇士的刀
  rationale: 介词 בְּ 在此表示手段；“借……的刀”自然地保留了战争意象。גִּבּוֹרִים 在语境中指强悍的战士，译作“勇士”简洁而庄重。
- source_word: אַפִּיל
  choice: 我必使……倒下
  rationale: 这是 נפל 的使役式，明确表达使其倒下，既保留使役意义，也符合现代汉语。
- source_word: הֲמוֹנֶךָ / כָּל הֲמוֹנָהּ
  choice: 你的众民 / 她的众民
  rationale: הָמוֹן 可指众多的人、喧嚷的群体或军众。此处以“众民”兼顾人口与军众的可能性，并保留首尾重复；阴性“她”回指埃及。
- source_word: עָרִיצֵי גוֹיִם כֻּלָּם
  choice: 他们全是列国中残暴的人
  rationale: עָרִיץ 指残暴、强横或施行暴虐的人。“残暴的人”不把他们限定为政治统治者，并以独立分句自然表达希伯来文的同位结构。
- source_word: וְשָׁדְדוּ
  choice: 他们必掳掠
  rationale: שׁדד 在军事语境中表示抢掠、劫掠；“掳掠”保留其暴力夺取的意味。
- source_word: גְּאוֹן מִצְרַיִם
  choice: 埃及所夸耀的
  rationale: גָּאוֹן 可指骄傲、威荣或引以为荣之物。“所夸耀的”在汉语中既可涵盖埃及的骄傲，也可指她引以为荣的威势与荣华，避免过早消解原文张力。
- source_word: וְנִשְׁמַד
  choice: 必被毁灭
  rationale: שׁמד 的被动式表达遭到毁灭；此译法清楚有力，又不额外强化为“彻底灭绝”。
theological_decisions:
- issue: 审判语境中 גְּאוֹן 的含义
  choice: 埃及所夸耀的
  alternative: 埃及的骄傲；埃及的威荣
  rationale: 原词兼有骄傲、尊荣和威势之义。审判语境突出埃及被降卑，但经文也可能指她所自豪的荣华与强盛；“所夸耀的”保留这两方面。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现诗句推进，并保留“众民”的重复。脚注标记均置于相关词句之后。
