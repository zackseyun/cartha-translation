  text: בְּ/ת֥וֹךְ חַלְלֵי חֶ֖רֶב יִפֹּ֑לוּ חֶ֣רֶב נִתָּ֔נָה מָשְׁכ֥וּ אוֹתָ֖/הּ וְ/כָל הֲמוֹנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/020.yaml
  text: They will fall among those slain by the sword[a]. The sword is given; drag her away[b], and all her multitude.
translation:
  language: zh_hans
  text: 他们必倒在被刀剑杀的人中。刀剑已被交付[a]；拖走她[b]和她所有的民众。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“刀剑已被指定。”希伯来语这一短句十分简略，也可能表示刀剑已被指定用来施行审判。
    reason: alternative_reading
  - marker: b
    text: “她”指人格化的埃及；她所有的民众也一同被拖走。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ חַלְלֵי חֶרֶב
  choice: 在被刀剑杀死的人中间
  rationale: בְּתוֹךְ 表示“在……中间”；חַלְלֵי חֶרֶב 指在战争中被刀剑刺杀、击杀的人。此译自然，并保留他们被列入阵亡者之中的含义。
- source_word: יִפֹּלוּ
  choice: 必倒
  rationale: 未完成式在预言语境中表达将来的确定事件；“必倒”既简洁，又保留审判宣告的力度。
- source_word: חֶרֶב נִתָּנָה
  choice: 刀剑已经交付
  rationale: 直译被动式 נִתָּנָה，并保留原文突兀、压缩的表达，不擅自补出刀剑交给谁或具体如何执行。
- source_word: מָשְׁכוּ
  choice: 拖走吧
  rationale: 复数命令式表示强行拉走；结合下到阴间的上下文，“拖走”比一般的“拉”更能传达暴力行动。句末“吧”使现代汉语命令句自然，但不削弱其命令性质。
- source_word: אוֹתָהּ
  choice: 她
  rationale: 阴性单数代词按上下文最自然地指人格化的埃及；保留阴性代词可维持先知性哀歌的拟人意象。
- source_word: וְכָל הֲמוֹנֶיהָ
  choice: 和她所有的众民
  rationale: הָמוֹן 在《以西结书》中可指一国庞大而喧嚷的人群、民众或军众。“众民”保持集合性，又不把范围限定为军队；“和”直接体现连接词 וְ。
theological_decisions:
- issue: 命令句中阴性代词所指
  choice: 将“她”理解为人格化的埃及
  alternative: 也可能在这一困难句法中作较抽象的理解，或尝试与前面的“刀剑”联系
  rationale: 上下文集中论到法老和埃及，并反复把国家人格化。保留“她”既符合语法和语境，也不抹平先知讽歌的形象。
- issue: חֶרֶב נִתָּנָה 的解释
  choice: 较直译为“刀剑已经交付”
  alternative: “刀剑已经指定”或“刀剑已经交出”
  rationale: 希伯来语短句高度压缩且有所省略。正文不补明接受者或用途，以保留原文的歧义和审判宣告中的张力；脚注列出合理替代译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必倒”保持先知审判宣告的力度；“刀剑已经交付”刻意保留原文的突兀和省略；“众民”兼顾集合名词的广度与丧歌语境。
