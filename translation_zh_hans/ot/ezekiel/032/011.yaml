  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה חֶ֥רֶב מֶֽלֶךְ בָּבֶ֖ל תְּבוֹאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/011.yaml
  text: 'For thus says the Lord GOD: The sword of the king of Babylon will come upon you[a].'
translation:
  language: zh_hans
  text: 因为主耶和华如此说：巴比伦王的刀必临到你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“巴比伦王的刀必来到你那里”；在本段审判语境中，意思是敌对地临到或攻击你。
    reason: 说明“临到”所保留的原文基本意象及其语境中的敌对含义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前述审判宣告说明根据；“因为”自然保留了原文的因果衔接。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中固定的使者公式，同时符合庄重、清楚的现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי 的“主”和神名 יהוה 的传统中文音译“耶和华”，避免将两个成分合并。
- source_word: חֶרֶב מֶלֶךְ בָּבֶל
  choice: 巴比伦王的刀
  rationale: 直接呈现原文的属格结构；这里的“刀”也可借代巴比伦王发动的军事杀戮。
- source_word: תְּבוֹאֶךָ
  choice: 必临到你
  rationale: 直译其“来到你那里”的基本意象，并由审判语境显明其敌对性质；避免在正文中过度限定为“攻击你”。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”在现代中文圣经语境中可辨识度高，并保留“主”与神名两个要素；不借此加入特定宗派解释。
- issue: “刀临到你”的主体与含义
  choice: 保留“巴比伦王的刀”作为句法主体
  alternative: 巴比伦王必挥刀攻击你
  rationale: 原文以“刀”为主体，既可指兵器，也可借代战争和杀戮；保留这一形象可避免把诗性审判语言解释得过窄。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“如此说”保留先知宣告的正式语气；“必临到你”兼顾原文意象和审判语境。
