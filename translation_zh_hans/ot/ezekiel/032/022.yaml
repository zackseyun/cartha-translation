base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/022.yaml
  text: There is Assyria and all her assembly[a], with his graves all around him; all of them are slain, fallen by the sword.
translation:
  language: zh_hans
  text: 那里有亚述和她所有的会众[a]；在他四围都是他的坟墓。他们全都被杀，倒在刀下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文的人格化指称发生转换：“亚述”和“她所有的会众”之后，“他的坟墓”和“在他四围”改用阳性形式。译文保留了这一转换。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: 在那里
  rationale: 作为地点副词，引出阴间景象中的下一方势力；“在那里”直接保留其指示和空间作用。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 此处指作为整体并被人格化的亚述帝国；采用现代中文通行译名。
- source_word: וְכָל־קְהָלָהּ
  choice: 和她所有的会众
  rationale: קהל 指聚集成群的人，未必只限军队，故译“会众”；阴性单数后缀以“她”保留亚述在此处的阴性人格化。
- source_word: קִבְרֹתָיו
  choice: 他的坟墓
  rationale: קבר 直译为“坟墓”；阳性单数后缀译作“他”，保留原文从阴性人格化转为阳性指称的变化。
- source_word: סְבִיבוֹתָיו
  choice: 在他四围
  rationale: 复数形式在此作方位表达；“在他四围”自然而庄重，也保留阳性单数后缀。
- source_word: כֻּלָּם
  choice: 他们全都
  rationale: 概括亚述及其群体中的死者；“他们全都”清楚表达总括意义。
- source_word: חֲלָלִים
  choice: 被杀的人
  rationale: 在战争语境中指遭暴力杀死者；“被杀”比单纯“死者”更准确。
- source_word: הַנֹּפְלִים
  choice: 倒下的人
  rationale: 分词继续描述这些死者；结合“刀下”译为“倒在刀下的人”，保留战争中的倒毙意象。
- source_word: בֶּחָרֶב
  choice: 在刀下
  rationale: 这是表示死于兵刃的惯用表达；现代中文“倒在刀下”自然传达因刀剑而死。
theological_decisions:
- issue: 亚述人格化指称中的性别转换
  choice: 先用“她”，随后用“他”
  alternative: 全句统一用“她”，或避免人称代词
  rationale: 马所拉文本先以阴性单数后缀修饰“会众”，随后在“坟墓”和“四围”使用阳性单数后缀。译文保留这一真实而突出的转换，不替原文消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“会众”保留集合体含义，不擅自限定为军队；“倒在刀下”保持先知书战争与死亡场景的凝重语气。
