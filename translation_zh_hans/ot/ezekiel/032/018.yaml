  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֶּן אָדָ֕ם נְהֵ֛ה עַל הֲמ֥וֹן מִצְרַ֖יִם וְ/הוֹרִדֵ֑/הוּ א֠וֹתָ/הּ וּ/בְנ֨וֹת גּוֹיִ֧ם אַדִּרִ֛ם אֶל אֶ֥רֶץ תַּחְתִּיּ֖וֹת אֶת י֥וֹרְדֵי בֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/018.yaml
  text: Son of man[a], wail over the multitude of Egypt, and bring her down, her and the daughters of mighty nations, to the land beneath[c][b], with those who go down to the pit.
translation:
  language: zh_hans
  text: “人子啊，你要为埃及的众民[a]哀号；把她[d]和强盛列国的女子[b]一同带到下方之地[c]，与那些下坑的人为伴。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众民”也可译作“群众”或“大群人”；希伯来词可表示众多的人或喧嚷的人群。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文作“强盛列国的女子”，是拟人化说法，可能指与埃及有关联的国家或人民。
    reason: cultural_note
  - marker: c
    text: 也可译作“地下之地”或“下界”；原文指下方与死者相关的领域。
    reason: alternative_reading
  - marker: d
    text: 希伯来文本在“带下去”所带的代词上使用阳性形式，随后重述宾语时却用阴性“她”；本译文依照后者及埃及被拟人化的语境译作“她”。
    reason: textual_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；采用传统而透明的译法，保留原文的先知性称谓。
- source_word: נְהֵה
  choice: 哀号
  rationale: 该动词指发出哀声、唱哀歌式的悲悼；“哀号”既体现可听见的悲声，也符合本段审判哀歌的语境。
- source_word: הֲמוֹן מִצְרַיִם
  choice: 埃及的众民
  rationale: הָמוֹן可指众多的人、群体或喧嚷的人群；本节主要指埃及的大批民众，而不是明确指财富。
- source_word: וְהוֹרִדֵהוּ
  choice: 把她……带下去
  rationale: 这是使役意义的命令式，意为“使……下去”。“带下去”在现代汉语中自然，并保留向死者领域下降的图像。
- source_word: אוֹתָהּ
  choice: 她
  rationale: 此处明确使用阴性单数形式，以女性形象拟人化埃及；汉语用“她”保留这一表达。
- source_word: וּבְנוֹת גּוֹיִם אַדִּרִם
  choice: 强盛列国的女子
  rationale: 保留原文“女子／女儿”的形象，不直接把它解释为附属民族；אַדִּירִם在这里表达强大、威盛，译作“强盛”较自然。
- source_word: אֶרֶץ תַּחְתִּיּוֹת
  choice: 下方之地
  rationale: 原文直指较低、在下的地方。“下方之地”保留空间性的地下世界图像，而不把它限定为后期教义中的特定名词。
- source_word: אֶת יֹרְדֵי בוֹר
  choice: 与那些下坑的人同在
  rationale: 这里的אֶת按伴随关系理解；这句话指出埃及将加入下到坑中之死者的行列。“同在”使这一关系在汉语中清楚。
- source_word: בּוֹר
  choice: 坑
  rationale: “坑”直接保留原文的葬地和死亡领域意象，不径直解释为“地狱”。
theological_decisions:
- issue: אֶרֶץ תַּחְתִּיּוֹת与בּוֹר所描绘的死者领域
  choice: 译作“下方之地”和“坑”，保留具体的下降意象
  alternative: 阴间、冥府、地狱
  rationale: 原文以诗性的审判语言描绘死者所在的下方领域，并未在本节给出后期系统化的来世教义；因此不将其具体等同于“地狱”。
- issue: “强盛列国的女子”所指为何
  choice: 在正文保留拟人化的“女子”，脚注说明可能指与埃及有关联的民族或人民
  alternative: 直接译作“强国的附属民族”或“各强国的人民”
  rationale: 原文的比喻有一定开放性；正文保留形象可避免把“女子”的关系过早限定为政治上的附属关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀号”“带下去”“下坑”保留哀歌的力度和连续下降的意象；“强盛列国的女子”略带诗性，以忠实呈现原文拟人化表达，并借脚注帮助普通读者理解。
