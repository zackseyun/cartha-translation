  text: וְ/הִ֨כְעַסְתִּ֔י לֵ֖ב עַמִּ֣ים רַבִּ֑ים בַּ/הֲבִיאִ֤/י שִׁבְרְ/ךָ֙ בַּ/גּוֹיִ֔ם עַל אֲרָצ֖וֹת אֲשֶׁ֥ר לֹֽא יְדַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/009.yaml
  text: And I will trouble the hearts of many peoples when I bring your ruin among the nations[c][b][a], into lands that you have not known.
translation:
  language: zh_hans
  text: 当我把你的败亡[a]带到列国中，带到你素不认识的各地[b]时，我必使许多民族心中不安[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的毁灭”。原词可指破裂、崩溃、毁坏或败亡。
    reason: lexical_alternative
  - marker: b
    text: “带到你素不认识的各地”也可理解为“传到你素不认识的各地”，指你所不熟悉的异邦。
    reason: lexical_alternative
  - marker: c
    text: 或译“使许多民族心中恼怒”，也可译“使许多民族心中悲伤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְעַסְתִּי
  choice: 我必使……心中不安
  rationale: כעס 的使役形可指使人恼怒、忧伤或烦扰；与“心”搭配时，“心中不安”保留了内在扰动的广义，没有把反应限定为愤怒或悲伤。
- source_word: לֵב עַמִּים רַבִּים
  choice: 许多民族心中
  rationale: 原文“心”为单数，但在集合性结构中指许多民族各自的内心；现代汉语用“许多民族心中”自然地表达这一集合意义。
- source_word: עַמִּים רַבִּים
  choice: 许多民族
  rationale: 译作“民族”以区别后文 גּוֹיִם 所指的“列国”，并保留其群体、族群层面的含义。
- source_word: בַּהֲבִיאִי
  choice: 当我……带到……时
  rationale: 带 ב 前缀的不定式结构在此表示时间情境；“当……时”准确而自然。
- source_word: שִׁבְרְךָ
  choice: 你的败亡
  rationale: שֶׁבֶר 可表示破裂、毁坏、崩溃或灾祸；在针对法老和埃及的审判语境中，“败亡”兼顾毁灭过程与结局。
- source_word: בַּגּוֹיִם
  choice: 列国中
  rationale: 保留其在众国之中的空间或公开呈现之意，同时不擅自补入原文没有明说的“消息”。
- source_word: עַל אֲרָצוֹת
  choice: 带到……各地
  rationale: עַל 基本义可为“在……之上”，但在本句移动结构中可表达延伸所至；汉语以重复“带到”使句意清楚。
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: 你素不认识的
  rationale: ידע 在此指以往的认识或接触；“素不认识”简洁表达从来不熟悉的地域。
theological_decisions:
- issue: 列国因埃及败亡而产生何种内在反应
  choice: 译为“心中不安”，表示上帝使许多民族内心受到扰动。
  alternative: “心中恼怒”或“心中悲伤”。
  rationale: כעס 的使役形涵盖激怒、使忧伤和使烦扰等语义；原文未把反应明确限定为单一情绪，因此正文采用较宽的表达，并在脚注保留其他可能。
- issue: “把你的败亡带到列国中”的具体含义
  choice: 保留“带到”的意象，不明确补成传播败亡的消息。
  alternative: “把你败亡的消息传到列国”或“使你在列国中毁灭”。
  rationale: 原文可使人联想到败亡被带到异邦、在异邦中显露，或其消息传开；正文不补出“消息”，以保留其表达张力。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“列国”保留先知文学的语体，“许多民族”则与之区分。句式按汉语习惯把时间从句置前；不补入“消息”等解释性成分，以保持原文的含混与审判语境中的张力。
