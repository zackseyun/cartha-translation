source:
  edition: WLC
  text: וְ/לֹ֤א יִשְׁכְּבוּ֙ אֶת גִּבּוֹרִ֔ים נֹפְלִ֖ים מֵ/עֲרֵלִ֑ים אֲשֶׁ֣ר יָרְדֽוּ שְׁא֣וֹל בִּ/כְלֵֽי מִלְחַמְתָּ/ם֩ וַ/יִּתְּנ֨וּ אֶת חַרְבוֹתָ֜/ם תַּ֣חַת רָאשֵׁי/הֶ֗ם וַ/תְּהִ֤י עֲוֺֽנֹתָ/ם֙ עַל עַצְמוֹתָ֔/ם כִּֽי חִתִּ֥ית גִּבּוֹרִ֖ים בְּ/אֶ֥רֶץ חַיִּֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/027.yaml
  text: And they do not lie with the mighty, the fallen from among the uncircumcised[a], who went down to Sheol with their weapons of war, whose swords were placed under their heads, and whose iniquities were upon their bones[e][d][c][b]; for the terror of the mighty was in the land of the living.
translation:
  language: zh_hans
  text: 他们不与勇士同卧[a]，就是未受割礼者中倒下的那些人[b]；这些人带着作战的兵器下到阴间[c]，他们的刀剑放在他们的头下，他们的罪孽在他们的骸骨上[d]；因为勇士在活人之地所造成的恐惧[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必不与勇士同卧。”这哀歌中的希伯来动词也可带将来语气。
    reason: lexical_alternative
  - marker: b
    text: 或译：“与未受割礼者中倒下的勇士同卧。”希伯来文结构较难，有人把“勇士”和“倒下的人”结合得更紧密。
    reason: alternative_reading
  - marker: c
    text: “阴间”指死者所在之境；也可译作“坟墓”或“地下世界”。
    reason: lexical_alternative
  - marker: d
    text: “罪孽”也可理解为“罪责”或“罪孽所受的惩罚”。
    reason: lexical_alternative
  - marker: e
    text: 末句的希伯来文结构较难；或译：“因为他们作为勇士，曾在活人之地散布恐惧。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא יִשְׁכְּבוּ
  choice: 他们不……同卧
  rationale: שׁכב在葬埋语境中指死者躺卧或安葬；用“同卧”保留坟墓中的躺卧意象。否定式未完成体在哀歌的生动描述中译为现在时，同时在脚注保留将来语气。
- source_word: אֶת גִּבּוֹרִים
  choice: 与勇士
  rationale: 此处אֶת的句法较难，按关联意义处理为“与”。גִּבּוֹרִים译作宽泛而庄重的“勇士”，不额外限定为某一类军人。
- source_word: נֹפְלִים מֵעֲרֵלִים
  choice: 未受割礼者中倒下的人
  rationale: נֹפְלִים作名词性用法，意为“倒下的人”；מֵעֲרֵלִים按部分意义译为“未受割礼者中”。直译“未受割礼”以保留本章反复出现、具有神学分量的类别。
- source_word: שְׁאוֹל
  choice: 阴间
  rationale: שְׁאוֹל指死者所在之境。“阴间”是现代中文圣经语境中清楚且不过度等同于坟墓或后期“地狱”概念的对应词。
- source_word: בִּכְלֵי מִלְחַמְתָּם
  choice: 带着兵器
  rationale: כְּלֵי מִלְחָמָה指战争装备或武器；“带着兵器”自然凝练，并保留武士葬埋的画面。
- source_word: וַיִּתְּנוּ אֶת חַרְבוֹתָם תַּחַת רָאשֵׁיהֶם
  choice: 他们的刀剑被放在头下
  rationale: 希伯来文用连续叙事形式；中文采用被动表达，使其自然承接死者的葬埋状态，又不武断指定是谁放置刀剑。
- source_word: וַתְּהִי עֲוֺנֹתָם עַל עַצְמוֹתָם
  choice: 罪孽落在骸骨上
  rationale: עָוֹן可指罪孽、罪责或罪的惩罚。“罪孽落在骸骨上”保留原文凝练而阴沉的意象，不把含义收窄为其中一种。
- source_word: כִּי חִתִּית גִּבּוֹרִים בְּאֶרֶץ חַיִּים
  choice: 因为勇士所带来的恐惧曾存在于活人之地
  rationale: 原句省略且结构困难。“勇士所带来的恐惧”把חִתִּית理解为由勇士引起的恐惧；“活人之地”保留与阴间相对的固定意象，同时脚注列出另一种句法理解。
theological_decisions:
- issue: 审判语境中עָוֹן的含义
  choice: 正文译作“罪孽”，不判定重点究竟是罪、罪责还是罪的惩罚。
  alternative: “罪责”或“罪孽所受的惩罚”
  rationale: 该词在希伯来文中可兼有这些意义，本节可能有意把道德过犯及其后果压缩在同一个词中；保留张力可避免替原文作神学裁断。
- issue: שְׁאוֹל的概念范围
  choice: 译作“阴间”，指死者所在之境。
  alternative: “坟墓”或“地下世界”
  rationale: 避免把此词缩减为具体墓穴，也避免导入后期关于“地狱”的完整教义体系。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。“同卧”“骸骨”“活人之地”保留哀歌的葬埋意象与诗性；以短句和分号理清原文绵长结构，但不消除其关键歧义。
