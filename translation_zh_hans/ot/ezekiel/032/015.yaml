revisions:
- from: 我使埃及地荒凉，使这地失去其中所充满的一切；我击打其中所有居民的时候，他们就知道我是耶和华。[a]
  to: 当我使埃及地成为荒凉之地，使这地荒废，除尽其中所充满的一切，并击打其中所有居民时，他们就知道我是雅威[a]。
  rationale: 修订将“当……时”统摄原文连续的审判行动，补足土地既荒废又被清空的双重意象，并将神名统一为“雅威”，以对应英文审计轨迹的 Yahweh；没有把“击打”不必要地强化为“击杀”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:52:16Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以两个由 בְּ 加不定式构成的时间性审判动作（“当我使……”“当我击打……”）及其结果为骨架。草稿准确保留了“使埃及地荒凉／清除其充满之物／击打居民／他们就知道”的基本意义；但开头未明确标出统摄前两项的时间关系，且“失去其中所充满的一切”未充分表达第二层荒废、除尽的意象。
  naturalness: 草稿总体通顺、语体庄重；但“我使埃及地荒凉，使这地失去其中所充满的一切；我击打……的时候”在句法上把前两项与“……的时候”分开，时间结构不够清楚。将各动作并列置于“当……时”之内更自然，也更贴近原文。
  terminology: “耶和华”是中文传统译名，但本项目的英文审计轨迹将 יהוה 明确译作 Yahweh。中文正文宜相应采用“雅威”，并可在脚注交代“耶和华”为传统中文译法；这既保持神名而非称号，也与项目术语政策一致。
  issues:
  - severity: medium
    issue: 时间性从句的统摄范围不清楚
    rationale: 原文先以“当我使埃及地成为荒凉”开启时间框架，并以“当我击打其中所有居民”完成该框架；草稿只在末项使用“……的时候”，使首两项看似独立陈述。
  - severity: low
    issue: 第二个荒废／清空意象表达不足
    rationale: וּנְשַׁמָּה 与“从其充满之物”连用，不仅表示失去内容，也再次强调土地被毁坏、被清空。译为“使这地荒废，除尽其中所充满的一切”可保留两层意象而不显得机械重复。
  - severity: medium
    issue: 神名译法与项目英文审计术语不一致
    rationale: 英文 POB 明定 יהוה 译为 Yahweh。中文采用“雅威”与之对应；“耶和华”可保留在脚注中作为传统中文译名说明。
