source:
  edition: WLC
  text: בְּ/תִתִּ/י֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם שְׁמָמָ֣ה וּ/נְשַׁמָּ֗ה אֶ֚רֶץ מִ/מְּלֹאָ֔/הּ בְּ/הַכּוֹתִ֖/י אֶת כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/015.yaml
  text: When I make the land of Egypt a desolation[a], and the land is stripped of all that fills it, when I strike down all who dwell in it, then they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 当我使埃及地成为荒凉之地，使这地荒废，除尽其中所充满的一切，并击打其中所有居民时，他们就知道我是雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的音译；传统中文圣经常译作“耶和华”。
    reason: 说明神名的中文音译及传统译法，并与英文 POB 对 Yahweh 的译法一致。
lexical_decisions:
- source_word: בְּתִתִּי
  choice: 我使……的时候
  rationale: 介词 בְּ 加 נתן 的不定式构造在此引出时间从句；结合结果补语“荒凉”，נתן 宜译为“使……成为”，而非直译“赐予”。
- source_word: אֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 这是地名与“地”的自然组合；“埃及地”简洁、庄重，也符合现代汉语圣经语体。
- source_word: שְׁמָמָה
  choice: 荒凉
  rationale: 该名词表示遭毁坏后的荒废状态；汉语“使……荒凉”自然表达其结果性含义。
- source_word: וּנְשַׁמָּה אֶרֶץ מִמְּלֹאָהּ
  choice: 使这地失去其中所充满的一切
  rationale: נְשַׁמָּה 描写地被毁坏、被掏空的状态，而 מִמְּלֹאָהּ 指从其“充满之物”中被剥离。此译避免机械重复“荒凉”，同时保留地被清空的意象。
- source_word: בְּהַכּוֹתִי
  choice: 我击打……的时候
  rationale: 介词 בְּ 加不定式构造再次表示时间；נכה 在审判语境中可含致命打击，但原文此处只明说“击打”，正文不额外限定为“击杀”。
- source_word: כָּל יֹשְׁבֵי בָהּ
  choice: 其中所有居民
  rationale: 准确而自然地表达“所有住在其中的人”。
- source_word: וְיָדְעוּ
  choice: 他们就知道
  rationale: 连接词在这里承接前述审判并表示结果，汉语用“就”清楚呈现这种后果关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的传统专名形式音译四字神名，保留其作为专有名字而非普通称号的性质。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对神名的中文音译。“耶和华”在现代中文中辨识度最高，并保留专名性质；脚注注明“雅威”这一较贴近学界常见重建读音的形式，不把有争议的元音重建绝对化。
- issue: “击打”是否明确译为“击杀”
  choice: 击打
  alternative: 击杀
  rationale: 上下文是严厉审判，动词可暗含致命后果；但本节词形本身仍是“击打”，故正文保留较宽的表达，不把语境推论写成唯一词义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号区分两个相连的时间性审判描述与其结果；保留“荒凉”和“失去其中所充满的一切”两层意象，避免生硬重复。
