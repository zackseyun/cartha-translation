  text: וְ/הַֽאֲבַדְתִּי֙ אֶת כָּל בְּהֶמְתָּ֔/הּ מֵ/עַ֖ל מַ֣יִם רַבִּ֑ים וְ/לֹ֨א תִדְלָחֵ֤/ם רֶֽגֶל אָדָם֙ ע֔וֹד וּ/פַרְס֥וֹת בְּהֵמָ֖ה לֹ֥א תִדְלָחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/013.yaml
  text: And I will destroy all its beasts from beside its abundant waters[a], and no human foot will muddy them anymore[b], nor will the hooves of beasts muddy them.
translation:
  language: zh_hans
  text: 我要除灭它在众水旁的一切牲畜[a]；人的脚不再把这些水搅浑[b]，牲畜的蹄子也不再把这些水搅浑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “众水”也可译为“丰沛的水”。
    reason: lexical_alternative
  - marker: b
    text: “搅浑”原文指脚或蹄踩动水，使水变得混浊。
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: 我要……除灭
  rationale: 该词是 אבד 的使役形，表示使之灭亡或从当地消失；“除灭”既保留审判语气，也适合这里将牲畜从水边清除的语境。
- source_word: בְּהֶמְתָּהּ
  choice: 它所有的牲畜
  rationale: בְּהֵמָה 可泛指走兽，也常指家畜；本节提到它们在水边饮水、以蹄搅水，“牲畜”最自然。阴性单数后缀译作“它的”，所指承接上文拟人化的埃及。
- source_word: מֵעַל מַיִם רַבִּים
  choice: 从丰沛的水边
  rationale: מֵעַל 字面可指“从……上面”，在此表示从水域所在之处移除；רַבִּים 修饰水，可表示水量丰盛。“从丰沛的水边”兼顾方位和水源丰富之意。
- source_word: תִדְלָחֵם
  choice: 把水搅浑
  rationale: דלח 在此指脚或蹄踩动水，使水混浊；“搅浑”准确表达动作及结果。宾语后缀回指前面的“水”，汉语中明说“水”更清楚。
- source_word: רֶגֶל אָדָם
  choice: 人的脚
  rationale: אָדָם 在这里泛指人类，而非专名或特指男性；“人的脚”自然、简洁，并保留原文单数集合式表达。
- source_word: עוֹד
  choice: 不再
  rationale: 在否定的将来语境中，עוֹד 表示某事从此不再发生。
- source_word: וּפַרְסוֹת בְּהֵמָה
  choice: 牲畜的蹄子也不再
  rationale: פַּרְסוֹת 指蹄；此句与“人的脚”构成平行。“也不再”自然传达希伯来语连接词在否定平行句中的递进关系。
theological_decisions:
- issue: אָדָם 在 רֶגֶל אָדָם 中是泛指还是特指男性
  choice: 人的脚
  alternative: 男人的脚
  rationale: 此处 אָדָם 是泛指人类的普通名词，重点在人的脚与牲畜的蹄形成对照；译为“人的脚”不把范围无端缩限为男性。
- issue: “它”的所指
  choice: 保留代词“它”，承接上文拟人化的埃及
  alternative: 明译为“埃及的”
  rationale: 本节自身以阴性单数后缀回指上文对象。保留“它”维持篇章衔接，同时不替原文进一步限定为国家、土地或城市。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“除灭”保留先知审判宣告的力度；“搅浑”则具体呈现人脚和兽蹄践踏水面的图景。两处脚注标记均置于正文中，并保持两组否定分句的诗体平行。
