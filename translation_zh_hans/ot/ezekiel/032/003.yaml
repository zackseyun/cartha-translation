base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/003.yaml
  text: 'Thus says the Lord GOD: I will spread my net over you with an assembly of many peoples[b][a], and they will haul you up in my dragnet.'
translation:
  language: zh_hans
  text: '主耶和华如此说：


    “我要借着众多民族组成的群集，

    把我的网撒在你身上[a]；

    他们要在我的拖网中把你拉上来[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着众多民族组成的群集”也可译作“在众多民族组成的群集之中”。原文介词既可能表示这些民族是上帝撒网所借助的力量，也可能描述撒网发生的场合。
    reason: lexical_alternative
  - marker: b
    text: 原文这里用了另一个表示捕鱼用网的词，与本节前面的“网”不同；整句也可译作“他们要用我的拖网把你拉上来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号：אֲדֹנָי 译作“主”，四字神名 יְהוָה 按现代中文圣经语体音译为“耶和华”，避免译成重复的“主主”。
- source_word: וּפָרַשְׂתִּי
  choice: 我要……撒
  rationale: פרשׂ 的基本义是“展开、铺开”；用于网时，现代汉语自然说“撒网”，同时保留原文的捕捉意象。
- source_word: רִשְׁתִּי
  choice: 我的网
  rationale: רֶשֶׁת 是一般性的“网”，明确保留第一人称所属关系。
- source_word: בִּקְהַל עַמִּים רַבִּים
  choice: 借着众多民族聚集的会众
  rationale: קהל 指聚集起来的群体；ב 在语境中可表工具或伴随。正文采用通顺且符合上下文的工具性理解，同时用脚注保留“在……中”的可能性。עַמִּים 的复数译作“民族”。
- source_word: וְהֶעֱלוּךָ
  choice: 他们要……把你拉上来
  rationale: עלה 的使役形表示“使上来”；在捕鱼图像中，“拉上来”准确而自然，并保留复数主语“他们”。
- source_word: בְּחֶרְמִי
  choice: 在我的拖网中
  rationale: חֶרֶם 在此是捕鱼用网，与前面的 רֶשֶׁת 并非同一个词；译作“拖网”可保留原文的词汇变化与捕获意象。介词译为“在……中”，贴近希伯来文表达。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文采用现代中文读者熟悉且庄重的“主耶和华”，既区分 אֲדֹנָי 与四字神名，也避免把两者都译成“主”。“雅威”是较接近学术重构读音的另一选择，但并非此处正文所采用的通行中文形式。
- issue: 众多民族与撒网行动之间的关系
  choice: 民族的会众是上帝施行捕捉的媒介
  alternative: 网撒在众多民族聚集的会众之中
  rationale: 介词 ב 可表示工具，也可表示处境或范围。上下文及后续复数动词“他们要……拉”支持工具性理解，但原文仍有句法张力，因此在脚注中保留地点或处境性的读法。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体，并以分行呈现诗性神谕。保留“网／拖网”两个不同词项及捕鱼隐喻；不把“众多民族”窄化为特定国家，也不消除介词 ב 所造成的真实歧义。
