id: EZK.32.10
reference: Ezekiel 32:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/הֲשִׁמּוֹתִ֨י עָלֶ֜י/ךָ עַמִּ֣ים רַבִּ֗ים וּ/מַלְכֵי/הֶם֙ יִשְׂעֲר֤וּ עָלֶ֨י/ךָ֙ שַׂ֔עַר בְּ/עוֹפְפִ֥/י חַרְבִּ֖/י עַל פְּנֵי/הֶ֑ם וְ/חָרְד֤וּ לִ/רְגָעִים֙ אִ֣ישׁ לְ/נַפְשׁ֔/וֹ בְּ/י֖וֹם מַפַּלְתֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/010.yaml
  text: I will make many peoples appalled at you[a], and their kings will shudder over you when I brandish my sword before them; and they will tremble every moment, each man for his own life[c][b], on the day of your downfall.
translation:
  language: zh_hans
  text: 我必使许多民族因你而惊骇；我使我的刀在他们面前飞舞时[a]，他们的君王必因你惊恐万状[b]。在你倾覆的日子，他们必时时战栗，各人为自己的性命担忧[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我使我的刀在他们面前飞”。
    reason: lexical_alternative
  - marker: b
    text: “惊恐万状”原文用一个动词和同根名词连用，加强恐惧、震骇的程度。
    reason: lexical_alternative
  - marker: c
    text: “时时”也可译作“每时每刻”或“片刻又片刻”；“各人为自己的性命担忧”直译为“各人为自己的性命”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמּוֹתִי
  choice: 我必使……惊骇
  rationale: 使役形在此以许多民族为宾语，结合下文君王惊恐、众人战栗的反应，表达使人震惊骇怕；“使……惊骇”既贴合语境，也避免误译为使这些民族荒凉。
- source_word: עַמִּים רַבִּים
  choice: 许多民族
  rationale: עַמִּים指许多群体或族民；“民族”比现代政治意义较强的“国家”更贴近原文。
- source_word: יִשְׂעֲרוּ ... שַׂעַר
  choice: 惊恐万状
  rationale: 动词与同根名词连用，构成加强语气，描写强烈的恐惧和震骇；用“惊恐万状”自然地传达这种强调。
- source_word: בְּעוֹפְפִי חַרְבִּי
  choice: 我使我的刀在他们面前飞舞时
  rationale: 原文直译为“我使我的刀飞”；“飞舞”保留鲜明意象，同时在现代汉语中可理解为挥动刀剑。
- source_word: עַל־פְּנֵיהֶם
  choice: 在他们面前
  rationale: 保留原文的空间表达，表明审判之刀公开显现在众王眼前。
- source_word: וְחָרְדוּ
  choice: 他们必……战栗
  rationale: חרד兼有因恐惧而发抖的身体与心理含义，“战栗”准确而庄重。
- source_word: לִרְגָעִים
  choice: 时时
  rationale: 该复数结构表示一个接一个的时刻，可理解为“每时每刻”或“片刻又片刻”；“时时”简洁地表达持续、反复的恐惧。
- source_word: אִישׁ לְנַפְשׁוֹ
  choice: 各人为自己的性命担忧
  rationale: נֶפֶשׁ在死亡威胁的语境中指性命；原文省略具体的心理谓语，汉语补出“担忧”，使其与“战栗”自然衔接而不改变含义。
- source_word: בְּיוֹם מַפַּלְתֶּךָ
  choice: 在你倾覆的日子
  rationale: מַפָּלָה表示受审判而倒下、覆亡；“倾覆”适合对埃及这一政治实体的称呼，并保留灾难性意味。
theological_decisions:
- issue: 审判中的神圣行动主体
  choice: 保留第一人称“我必使”及“我的刀”，直接呈现上帝施行审判。
  alternative: 可将刀理解为上帝借巴比伦等历史工具施行审判。
  rationale: 原文明确使用第一人称动词和“我的刀”；译文保持直接的神圣行动，同时不排除其在历史中通过代理者实现。
- issue: 君王恐惧与埃及倾覆的关系
  choice: 将两处עָלֶיךָ均译作“因你”，表示众民族和君王因埃及遭遇而惊骇。
  alternative: 可译作“对你”或“在你身上”，较直接保留介词的空间色彩。
  rationale: 在此反应语境中，עַל带受惊原因或所针对对象的含义；“因你”在汉语中自然，并未具体限定他们恐惧的机制。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。“民族”“惊骇”“战栗”“倾覆”保留先知审判宣告的严肃语体；以脚注说明原文的飞刀意象、同根词加强结构及末句的省略表达。
