  text: בְּ/ת֣וֹךְ חֲ֠לָלִים נָתְנ֨וּ מִשְׁכָּ֥ב לָ/הּ֙ בְּ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתֶ֑/הָ כֻּלָּ֣/ם עֲרֵלִ֣ים חַלְלֵי חֶ֡רֶב כִּֽי נִתַּ֨ן חִתִּיתָ֜/ם בְּ/אֶ֣רֶץ חַיִּ֗ים וַ/יִּשְׂא֤וּ כְלִמָּתָ/ם֙ אֶת י֣וֹרְדֵי ב֔וֹר בְּ/ת֥וֹךְ חֲלָלִ֖ים נִתָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/025.yaml
  text: Among the slain they made a bed for her with all her multitude[a]; her graves are all around her. All of them are uncircumcised, slain by the sword, because their terror was set in the land of the living. So they bore their disgrace with those who go down to the pit[c][b]; she was placed among the slain.
translation:
  language: zh_hans
  text: 在被杀的人中，他们为她和她所有的众人安置了床榻；她的坟墓都在他四周。[a]他们全是未受割礼、被刀剑杀死的，因为他们曾在活人之地施加威吓。[b]他们便与下到坑里的人一同担当自己的羞辱；她被安置在被杀的人中。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里从阴性的“她／她的”转为阳性的“他”，可能是在拟人化的国家与其代表人物之间转换；有些译法统一作“她的坟墓都在她四周”。
    reason: alternative_reading
  - marker: b
    text: 原文较字面地说：“因为他们的恐怖曾被置于活人之地。”也可译作：“因为他们曾在活人之地散布恐怖。”
    reason: lexical_alternative
  - marker: c
    text: 末句原文的单数被动动词为阳性形式，也可译作：“他被安置在被杀的人中。”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתוֹךְ חֲלָלִים
  choice: 在被杀的人中
  rationale: 保留“在……中间”的空间含义；חֲלָלִים在本章战争与墓穴语境中指被杀者。
- source_word: נָתְנוּ מִשְׁכָּב לָהּ
  choice: 人给她……安置了床榻
  rationale: 保留原文以床榻描绘坟墓或阴间安卧之处的隐喻；未将不定复数主语具体化。
- source_word: בְּכָל הֲמוֹנָהּ
  choice: 和她所有的群众
  rationale: הָמוֹן指与这个拟人化国家相属的众人；“群众”比“军队”更少加入军事限定。
- source_word: סְבִיבוֹתָיו קִבְרֹתֶהָ
  choice: 她的坟墓都在他四周
  rationale: 原文“坟墓”带阴性单数所属后缀，而“在……四周”带阳性单数后缀；译文保留这一性别转换。
- source_word: כֻּלָּם עֲרֵלִים
  choice: 他们全是未受割礼
  rationale: 保留以西结审判宣告中明确而具体的盟约外群体标记，不改写为抽象的“不洁外族人”。
- source_word: חַלְלֵי חֶרֶב
  choice: 被刀剑杀死的
  rationale: 自然表达常见的战争死亡短语，并与本节重复出现的“被杀的人”呼应。
- source_word: כִּי נִתַּן חִתִּיתָם
  choice: 因为他们的威势曾被置于
  rationale: 保留נִתַּן的被动表达及原文未说明施事者的特点；חִתִּיתָם在此指使人恐惧的威势。
- source_word: בְּאֶרֶץ חַיִּים
  choice: 在活人之地
  rationale: 保留与坑和阴间相对的固定意象，指仍然活着的人所在之地。
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: 他们便……担当自己的羞辱
  rationale: נשא与כְלִמָּה组合表示承受或背负羞耻；“担当羞辱”庄重而清楚。
- source_word: אֶת יֹרְדֵי בוֹר
  choice: 与下坑的人一同
  rationale: 按语境将אֶת理解为伴随关系；“坑”保留通往死亡领域的诗性图像。
- source_word: בְּתוֹךְ חֲלָלִים נִתָּן
  choice: 她被安置在被杀的人中
  rationale: 末句动词为阳性单数，形式上也可译作“他被安置”；正文依段落中拟人化国家的阴性指称译作“她”，并以脚注保留另一可能。
theological_decisions:
- issue: 审判宣告中的“未受割礼”
  choice: 他们全是未受割礼
  alternative: 他们全是污秽的外族人
  rationale: 希伯来文使用具体的עֲרֵלִים，具有盟约身份和受辱色彩；不以解释性抽象词替代。
- issue: 坟墓图像中的阴阳性转换
  choice: 她的坟墓都在他四周……她被安置在被杀的人中
  alternative: 她的坟墓都在她四周……她被安置在被杀的人中
  rationale: 马所拉文本在阴性拟人化国家与阳性代表人物或集体代表之间发生转换。正文保留中段明确的阳性后缀，同时以脚注说明末句单数被动式的歧义。
- issue: 恐惧被“置于”活人之地的施事者
  choice: 他们的威势曾被置于活人之地
  alternative: 他们曾在活人之地散布恐怖
  rationale: 被动式没有明说是谁使这威势临到活人之地；采用被动表达以免把施事者和行动方式强加给原文。
translation_notes:
  register: 采用现代、庄重而可读的普通话。“床榻”“活人之地”“下坑”保留先知诗歌的墓穴和阴间意象；正文有意保留原文中突出的阴阳性转换，并用脚注解释而不加以消除。
