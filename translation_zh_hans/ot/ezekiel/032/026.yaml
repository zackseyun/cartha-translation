source:
  edition: WLC
  text: שָׁ֣ם מֶ֤שֶׁךְ תֻּבַל֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרוֹתֶ֑י/הָ כֻּלָּ֤/ם עֲרֵלִים֙ מְחֻ֣לְלֵי חֶ֔רֶב כִּֽי נָתְנ֥וּ חִתִּיתָ֖/ם בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/026.yaml
  text: There are Meshech and Tubal[a], and all her multitude; their graves are all around him. All of them are uncircumcised, slain by the sword, because they spread their terror in the land of the living.
translation:
  language: zh_hans
  text: 那里有米设、土巴，以及她所有的民众；她的坟墓环绕着他。[a]他们全都是未受割礼、被刀剑杀死的人，因为他们在活人之地施加恐怖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“和她所有的民众；她的坟墓环绕着他”；这句诗中阴性和阳性单数代词并置，指代未明。
    reason: 保留并说明原文代词后缀的真实歧义，避免正文强行统一。
lexical_decisions:
- source_word: שָׁם
  choice: 那里有
  rationale: 此处是指向阴间景象的地点副词；汉语补出“有”，使无动词句自然，并可统摄“米设、土巴和她所有的众民”。
- source_word: מֶשֶׁךְ תֻּבַל
  choice: 米设、土巴
  rationale: 两者是民族或地域的专名，采用现代中文圣经传统中通行的音译。
- source_word: וְכָל הֲמוֹנָהּ
  choice: 和她所有的众民
  rationale: הָמוֹן 指与该民族相属的大群民众；“众民”保留集合意义，又不把它限定为军队。“她”照应希伯来文阴性单数后缀。
- source_word: סְבִיבוֹתָיו קִבְרוֹתֶיהָ
  choice: 她的坟墓环绕着他
  rationale: 按马所拉文本保留“她的”与“他”的性别后缀转换，不在正文中擅自统一所指；中文仍能表达其压缩的诗体结构。
- source_word: כֻּלָּם
  choice: 他们全都是
  rationale: 恢复前述群体为复数主语，并引出后续两个并列描述。
- source_word: עֲרֵלִים
  choice: 未受割礼
  rationale: 直译这一具有盟约身份与受辱意味的词，避免用“污秽”等解释性词语削弱原文意象。
- source_word: מְחֻלְלֵי חֶרֶב
  choice: 倒在刀下的人
  rationale: 此固定语境指被刀剑击杀者；“倒在刀下”在现代汉语中自然、庄重，并清楚表达死亡结果。
- source_word: כִּי נָתְנוּ חִתִּיתָם
  choice: 因为他们曾……散布自己的恐怖
  rationale: כִּי 表原因；“施加／放置恐怖”的希伯来语表达在此指使别人惧怕。“散布自己的恐怖”保留其致使与扩散意味。
- source_word: בְּאֶרֶץ חַיִּים
  choice: 在活人之地
  rationale: 保留与阴间相对的希伯来语惯用表达，指人在世生活的领域。
theological_decisions:
- issue: 埋葬审判中的盟约性羞辱用语
  choice: 未受割礼
  alternative: 污秽；未入盟约者
  rationale: 原文明确使用 עֲרֵלִים。直译既保留以西结书反复出现的修辞和神学张力，也不把其意义缩减为一般道德污秽或加入解释性身份判断。
- issue: 诗句中代词性别与所指的转换
  choice: 保留“她的坟墓环绕着他”
  alternative: 将代词统一为“他们的坟墓环绕着他们”
  rationale: 马所拉文本确有阴性单数与阳性单数后缀并置。正文保留这种真实歧义，脚注说明其诗体转换，而不强行确定中心人物或集合体的所指。
- issue: 恐怖与受审判结果之间的关系
  choice: 因为
  alternative: 原来；确实
  rationale: כִּי 在此最自然地说明他们蒙受羞辱性死亡处境的原因；译作“因为”保留经文明确的因果关系，不额外界定神学机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“众民”“未受割礼”“活人之地”保留先知性审判语体；分号呈现原文压缩的诗行结构。
