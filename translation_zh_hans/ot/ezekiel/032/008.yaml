  text: כָּל מְא֤וֹרֵי אוֹר֙ בַּ/שָּׁמַ֔יִם אַקְדִּירֵ֖/ם עָלֶ֑י/ךָ וְ/נָתַ֤תִּי חֹ֨שֶׁךְ֙ עַֽל אַרְצְ/ךָ֔ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/008.yaml
  text: All the lights of light in the heavens I will darken over you[a], and I will put darkness over your land, declares the Lord GOD.
translation:
  language: zh_hans
  text: 我要使天上所有的发光体[a]在你上方变暗；我要使黑暗笼罩你的国土。这是主雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发光体”原文直译为“光的发光体”，指天上发光的天体。
    reason: 说明希伯来语强化性的组合表达及其所指。
lexical_decisions:
- source_word: כָּל מְאוֹרֵי אוֹר
  choice: 所有的发光体
  rationale: מְאוֹרֵי אוֹר直译为“光的发光体”，指发光的天体；现代汉语用“发光体”既自然，也保留其作为光源的含义。כָּל译作“所有的”。
- source_word: בַּשָּׁמַיִם
  choice: 天上
  rationale: 指诸天或天空领域；“天上”符合现代汉语习惯，也适合本节宇宙性审判意象。
- source_word: אַקְדִּירֵם
  choice: 使……暗淡无光
  rationale: קדר的使役形表达使这些发光体变暗；“暗淡无光”自然传达其结果，同时避免误解为只是颜色变深。
- source_word: עָלֶיךָ
  choice: 在你上方
  rationale: 保留עַל的空间图景：天体在受话者上方变暗。这里的“你”承接上下文所针对的法老。
- source_word: וְנָתַתִּי חֹשֶׁךְ
  choice: 我要使黑暗笼罩
  rationale: נתן本义为放置、施加；汉语若直译“放置黑暗”不自然，“使黑暗笼罩”保留黑暗临到并覆盖的具体意象。
- source_word: עַל אַרְצְךָ
  choice: 你的国土
  rationale: אֶרֶץ在此指受审判者所辖的土地，即埃及；“国土”比“地”更明确，又不扩大为全地。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 庄重地表达先知文献中神谕结语公式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达אֲדֹנָי的“主”和神名יהוה；采用现代中文圣经读者熟悉的“主耶和华”，避免将两个称号合并。
theological_decisions:
- issue: 神名יהוה在复合称号אֲדֹנָי יְהוִה中的译法
  choice: 主耶和华
  alternative: 主上帝／主雅威
  rationale: “主耶和华”在现代中文基督教语境中庄重且易于辨认，并保留“主”与神名两个成分；不借译法引入特定宗派解释。
- issue: 黑暗意象应否解释为具体灾祸或政治覆亡
  choice: 保留宇宙性黑暗意象，不在正文中释义
  alternative: 译成灾难、覆亡或哀伤
  rationale: 原文以天体变暗和黑暗覆盖国土描绘审判，并未在本节明确限定其象征所指，因此不应在翻译中消除其诗性张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前半句略保留希伯来语的空间结构，“在你上方”承接对法老的第二人称称呼；后半句用“笼罩”使汉语流畅，同时维持审判意象。脚注标记[a]已置于相关词句之后。
