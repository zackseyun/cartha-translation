  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָ֚ז אַשְׁקִ֣יעַ מֵֽימֵי/הֶ֔ם וְ/נַהֲרוֹתָ֖/ם כַּ/שֶּׁ֣מֶן אוֹלִ֑יךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/014.yaml
  text: Then I will let their waters settle[a], and I will make their rivers flow like oil[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 那时，我要使他们的水沉静下来[a]，使他们的河流如油般流淌[b]。这是主雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们的水下沉”或“消退”。希伯来语动词可指使水下沉、退落，也可表示使水静定下来。
    reason: lexical_alternative
  - marker: b
    text: 或译：“带领他们的河流如油而行”，意思是使河水像油一样平稳、顺滑地流动。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 表示预言中随之而来的时刻；现代汉语自然庄重。
- source_word: אַשְׁקִיעַ
  choice: 使……沉静下来
  rationale: שקע 的使役式可指使水下沉、消退或静定；此译保留水从扰动转为平静的意象，同时以脚注注明其他可能。
- source_word: מֵימֵיהֶם
  choice: 他们的水
  rationale: 按原文保留第三人称复数所属关系；汉语中“水”通常不作形态上的复数。
- source_word: וְנַהֲרוֹתָם
  choice: 他们的河流
  rationale: נְהָרוֹת 可指河流或溪流；上下文涉及埃及及尼罗河意象，译作“河流”较合适。
- source_word: כַּשֶּׁמֶן
  choice: 如油般
  rationale: 保留简洁的明喻，不擅自补出“橄榄”；传达平滑、缓稳的流动意象。
- source_word: אוֹלִיךְ
  choice: 使……流淌
  rationale: הלך 的使役式意为使之行进；用于河流时，现代汉语自然译为“使……流淌”。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 保留先知话语中庄严的神谕公式，同时符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי 的“主”和四字神名 יְהוִה 的传统中文形式“耶和华”，避免重复为“主主”。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 原文直接使用四字神名。中文采用广为人知且庄重的“耶和华”，并保留 אֲדֹנָי 的“主”；不以泛称“上帝”取代专名，也不借此引入宗派性解释。
- issue: 水与河流意象的状态
  choice: 使水沉静、使河流如油般流淌
  alternative: 使水下沉或消退、带领河流如油而行
  rationale: 原文动词容许“下沉、消退、静定”等语义，而“如油”可能着重平滑缓流。正文采用自然且符合上下文的表达，脚注保留真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留预言体的第一人称神谕和“这是主耶和华的宣告”这一公式；正文简洁，借脚注呈现希伯来语动词的词义范围。
