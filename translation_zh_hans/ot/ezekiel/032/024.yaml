language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שָׁ֤ם עֵילָם֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֣/ם חֲלָלִים֩ הַ/נֹּפְלִ֨ים בַּ/חֶ֜רֶב אֲֽשֶׁר יָרְד֥וּ עֲרֵלִ֣ים אֶל אֶ֣רֶץ תַּחְתִּיּ֗וֹת אֲשֶׁ֨ר נָתְנ֤וּ חִתִּיתָ/ם֙ בְּ/אֶ֣רֶץ חַיִּ֔ים וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/024.yaml
  text: There is Elam and all her multitude[a], all around her grave, all of them slain, fallen by the sword, who went down uncircumcised to the land below, who spread their terror in the land of the living; and they bore their shame with those who go down to the pit.
translation:
  language: zh_hans
  text: 那里有以拦和她的全体民众，都在她的坟墓四周；他们全是被杀、倒在刀下的人，以未受割礼者的身分下到地的深处[a]。他们曾在活人之地散布恐怖，和下坑的人一同担当自己的羞辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“下方之地”或“阴间”。希伯来文直译为“低下之地”，以空间图像指死者所在的领域。
    reason: 说明אֶרֶץ תַּחְתִּיּוֹת的字面空间图像及可能含义，避免正文将其过度解释为特定的来世观。
lexical_decisions:
- source_word: שָׁם עֵילָם
  choice: 那里有以拦
  rationale: שָׁם承接阴间场景并引出以拦；“那里有”保留指示意味，也符合现代汉语叙述。专名עֵילָם按通行译名作“以拦”。
- source_word: וְכָל הֲמוֹנָהּ
  choice: 和她的全体民众
  rationale: הָמוֹן在此指与以拦相属的大批人民或军众；“全体民众”保持范围宽广，不把含义限定为军队。保留阴性代词“她”，以呼应原文将以拦人格化的阴性后缀。
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: 都在她的坟墓四周
  rationale: 准确表达众死者环绕以拦坟墓的空间布局；“坟墓”直白自然。
- source_word: כֻּלָּם חֲלָלִים הַנֹּפְלִים בַּחֶרֶב
  choice: 他们全是被杀、倒在刀下的人
  rationale: חֲלָלִים指遭暴力杀害者，“被杀”保留战死意味；“倒在刀下”贴近原文的军事意象，而不泛化为普通死亡。
- source_word: יָרְדוּ עֲרֵלִים
  choice: 未受割礼就下到
  rationale: 直译עֲרֵלִים的身体与盟约羞辱意涵，不用“污秽”等解释性词语替代；“就下到”自然连接其状态与下降动作。
- source_word: אֶל אֶרֶץ תַּחְתִּיּוֹת
  choice: 下到地下之地
  rationale: 保留原文“较低之地／下方之地”的空间图像，同时让中文读者可理解为死者所在的领域；脚注交代可选译法。
- source_word: נָתְנוּ חִתִּיתָם בְּאֶרֶץ חַיִּים
  choice: 曾在活人之地散布恐怖
  rationale: נָתְנוּ חִתִּיתָם字面为“给予／置下他们的恐怖”，“散布恐怖”是自然汉语，并准确表达其使活人惧怕的作用。
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: 如今却……担当自己的羞辱
  rationale: נשא与כְלִמָּה表达承受羞辱；“担当”保留持续承受后果的意味。“如今却”明示上下文中昔日威势与当前受辱的对照，但不增添新的事件。
- source_word: אֶת יֹרְדֵי בוֹר
  choice: 和下坑的人一同
  rationale: 此处אֶת按伴随意义处理；“下坑的人”保留בוֹר兼具坟墓和阴间领域的意象。
theological_decisions:
- issue: 审判语境中的עֲרֵלִים
  choice: 未受割礼
  alternative: 污秽的／未入约的
  rationale: 保留原词具体而带羞辱性的称谓，让以西结书对列国的盟约性修辞保持可见；不以抽象解释消解其张力。
- issue: אֶרֶץ תַּחְתִּיּוֹת所指的死者领域
  choice: 地下之地
  alternative: 阴间／地的深处
  rationale: 原文以垂直空间图像描写与“活人之地”相对的死者领域，但没有在本节系统说明来世结构；因此正文保留图像，脚注说明含义而不作教义化限定。
- issue: 以拦的阴性人格化表达
  choice: 她
  alternative: 它／以拦的
  rationale: 原文连续使用阴性单数后缀指以拦，表现国家或群体的人格化；中文保留“她”以呈现这一修辞，而非把它解释成特定女性形象。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。分为三句，以免希伯来文长句在中文中显得滞重；保留“刀下”“活人之地”“下坑”等先知文学意象，并用“她”维持原文对以拦的国家人格化。
