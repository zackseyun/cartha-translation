  to: 那里有以拦和她的全体民众，都在她的坟墓四周；他们全是被杀、倒在刀下的人，以未受割礼者的身分下到地的深处[a]。他们曾在活人之地散布恐怖，和下坑的人一同担当自己的羞辱。
