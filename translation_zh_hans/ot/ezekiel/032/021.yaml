source:
  edition: WLC
  text: יְדַבְּרוּ ל֞/וֹ אֵלֵ֧י גִבּוֹרִ֛ים מִ/תּ֥וֹךְ שְׁא֖וֹל אֶת עֹֽזְרָ֑י/ו יָֽרְד֛וּ שָׁכְב֥וּ הָ/עֲרֵלִ֖ים חַלְלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/021.yaml
  text: 'The mighty among the chiefs will speak to him from the midst of Sheol[a], with his helpers: ‘They have gone down; they lie still, the uncircumcised[c][b], slain by the sword.’'
translation:
  language: zh_hans
  text: 勇士中的强者[b]要同他的帮手一起[c]，从阴间[a]深处向他说：“他们已经下来了；这些未受割礼、被刀剑杀死的人躺在那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”是希伯来语“示奥勒”的译称，指死者所在的领域，不等同于“地狱”。
    reason: cultural_note
  - marker: b
    text: 这处希伯来语较难确定；也可译作“勇士中的首领”或“勇士中的大能者”。
    reason: lexical_alternative
  - marker: c
    text: “帮手”也可译作“盟友”。此处的句法关系不完全明确；可理解为强者同他的帮手一起发话，也可指与他一同进入死亡的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבְּרוּ לּוֹ
  choice: 要……向他说
  rationale: 将Piel未完成式按先知异象中的将来场景表达；לּוֹ自然理解为话语所指向的间接受词。
- source_word: אֵלֵי גִבּוֹרִים
  choice: 勇士中的强者
  rationale: 该短语结构和词义均有难度；上下文描写阴间里的阵亡战士，因此采用指精锐勇士的理解，同时以脚注保留“勇士中的首领”等可能译法，不译作神明。
- source_word: מִתּוֹךְ שְׁאוֹל
  choice: 从阴间深处
  rationale: “深处”传达מִתּוֹךְ的内部空间意象；“阴间”在现代中文圣经语境中可指死者领域，并以脚注排除将其直接等同于“地狱”。
- source_word: אֶת עֹזְרָיו
  choice: 他的帮手也与他在一起
  rationale: 把אֶת取为伴随用法，表达法老的帮手与他一同在阴间；脚注说明也可理解为盟友或陪他同死的人。
- source_word: יָרְדוּ
  choice: 已经下来了
  rationale: 完成式表示下到阴间这一动作已经完成，并突出其当前结果。
- source_word: שָׁכְבוּ
  choice: 躺在那里
  rationale: 在死亡语境中，该动词指死人躺卧；此译自然呈现死亡状态，又不额外加入原文没有的神学解释。
- source_word: הָעֲרֵלִים
  choice: 未受割礼的人
  rationale: 保留以西结书中该称谓所带有的民族、圣约和羞辱色彩，不将其泛化为“不洁的人”。
- source_word: חַלְלֵי חָרֶב
  choice: 被刀剑杀死的人
  rationale: 采用现代中文清楚自然的战争死亡表达，保留刀剑造成死亡的具体意象。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；地狱；死者的领域
  rationale: 该希伯来词指死者所在的领域，既不只是单个坟墓，也不应直接套入后期关于地狱的特定教义；中文正文采用“阴间”，并用脚注界定其含义。
- issue: אֵלֵי גִבּוֹרִים所指
  choice: 阴间里的强大战士
  alternative: 勇士的首领；勇士之神
  rationale: 本章上下文列举下到阴间的列国及阵亡战士，较支持人类精锐战士的理解；同时借脚注承认这一希伯来短语难解，不把有争议的“神明”解释写入正文。
- issue: אֶת עֹזְרָיו的句法关系
  choice: 他的帮手与他一同在阴间
  alternative: 强者与他的帮手一起发言；向他和他的帮手说
  rationale: אֶת可有伴随意义，但其与句中人物的确切关系并不完全明朗；正文采用符合场景的一种读法，脚注保留“盟友／陪同死去者”的语义范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“阴间深处”保留原文鲜明的空间图景；引语使用自然的完成体表达。正文避免古奥的“被杀之人”“下在阴府”等措辞，也不以“地狱”引入原文未明确表达的后期神学含义。
