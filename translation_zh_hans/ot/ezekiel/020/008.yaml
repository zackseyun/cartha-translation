source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֗/י וְ/לֹ֤א אָבוּ֙ לִּ/שְׁמֹ֣עַ אֵלַ֔/י אִ֣ישׁ אֶת שִׁקּוּצֵ֤י עֵֽינֵי/הֶם֙ לֹ֣א הִשְׁלִ֔יכוּ וְ/אֶת גִּלּוּלֵ֥י מִצְרַ֖יִם לֹ֣א עָזָ֑בוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֤וֹת אַפִּ/י֙ בָּ/הֶ֔ם בְּ/ת֖וֹךְ אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/008.yaml
  text: But they rebelled against me and refused to listen to me. None of them cast away the detestable things before their eyes[a] or abandoned the idols[b] of Egypt. So I said that I would pour out my wrath on them, bringing my anger against them to its full measure in the midst of the land of Egypt.
translation:
  language: zh_hans
  text: 可是，他们悖逆我，不肯听从我。他们谁也没有丢弃自己眼前的可憎之物[a]，也没有离弃埃及的偶像[b]。于是我说，我要把烈怒倾倒在他们身上，在埃及地境内向他们彻底发尽我的怒气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们眼目所注视的可憎之物。”原文既可指摆在他们眼前的可憎之物，也可能暗示他们的目光执著于这些偶像。
    reason: alternative_reading
  - marker: b
    text: 原文译作“偶像”的词带有强烈的鄙夷意味，可使人联想到污秽、令人厌恶之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: 他们悖逆我
  rationale: מרה 与介词 ב 连用，表示对某人的反叛、违抗；“悖逆我”直接保留其强烈的关系性和立约语境。
- source_word: וְלֹא אָבוּ לִשְׁמֹעַ אֵלַי
  choice: 不肯听从我
  rationale: אָבוּ 的否定表达意志上的拒绝；“不肯”体现主动拒绝，“听从”同时传达聆听与顺服。
- source_word: אִישׁ
  choice: 他们谁也没有
  rationale: 此处单数名词具有逐一分配的作用；现代汉语用“谁也没有”自然表达群体中无一例外。
- source_word: שִׁקּוּצֵי עֵינֵיהֶם
  choice: 眼前可憎之物
  rationale: 该结构可指眼前所见的可憎之物，也可能暗示他们目光所依恋的对象；正文采用简洁而不过度解释的表达，并以脚注保留歧义。
- source_word: הִשְׁלִיכוּ
  choice: 丢弃
  rationale: 此动词在这里表示抛掉、弃绝偶像；“丢弃”在现代汉语中自然有力。
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: 埃及的偶像
  rationale: גִּלּוּלִים 是以西结常用的贬斥性偶像称谓；正文以清楚自然的“偶像”表达所指，脚注说明原词的鄙夷色彩。
- source_word: עָזָבוּ
  choice: 离弃
  rationale: עזב 表示离开、弃绝；“离弃”适合表达不肯与埃及偶像断绝关系。
- source_word: וָאֹמַר
  choice: 于是我说
  rationale: 叙事性的连接形式推进事件；“于是”自然呈现神因他们悖逆而作出的宣告。
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: 把烈怒倾倒在他们身上
  rationale: 保留“倾倒”这一鲜明意象；“烈怒”传达 חֵמָה 的强度。
- source_word: לְכַלּוֹת אַפִּי בָּהֶם
  choice: 向他们发尽我的怒气
  rationale: כלה 表示使之达到终点或完全施行；“发尽”保留审判执行到底的完成意味，而不把它弱化为一般的发怒。
- source_word: בְּתוֹךְ אֶרֶץ מִצְרָיִם
  choice: 在埃及地境内
  rationale: בְּתוֹךְ 强调处于埃及地之内；“境内”以自然现代汉语保留这一空间意味。
theological_decisions:
- issue: 神施行审判时的拟人化愤怒语言
  choice: 分别译作“烈怒”和“怒气”
  alternative: 两者都译作“愤怒”，或淡化为“惩罚／审判”
  rationale: 原文相邻使用 חֵמָה 与 אַף，形成修辞上的加强。分别保留两种怒语，既不削弱神反对偶像崇拜的审判，也不强加经文本身没有建立的系统性区分。
- issue: אִישׁ 的逐一分配作用
  choice: 译作“他们谁也没有”
  alternative: 译作“没有一个男人”或“无人”
  rationale: 此处阳性单数形式在群体中作分配用，并非特别强调男性；“他们谁也没有”准确传达无一例外，同时避免不必要的性别限定。
- issue: 神所说之话与内在定意的关系
  choice: 译作“于是我说，我要……”
  alternative: 译作“于是我心里决定要……”
  rationale: 原文明确使用“说”，但没有说明是对谁说，也没有明说是内心独语；正文保留“说”，不补入推测。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“悖逆”“离弃”“烈怒”等词保留先知审判宣告的力度；句法尽量自然，不以古雅措辞遮蔽原意。正文中的[a]、[b]均与脚注对应。
