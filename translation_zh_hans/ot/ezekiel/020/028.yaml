  text: וָ/אֲבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לָ/הֶ֑ם וַ/יִּרְאוּ֩ כָל גִּבְעָ֨ה רָמָ֜ה וְ/כָל עֵ֣ץ עָבֹ֗ת וַ/יִּזְבְּחוּ שָׁ֤ם אֶת זִבְחֵי/הֶם֙ וַ/יִּתְּנוּ שָׁם֙ כַּ֣עַס קָרְבָּנָ֔/ם וַ/יָּשִׂ֣ימוּ שָׁ֗ם רֵ֚יחַ נִיח֣וֹחֵי/הֶ֔ם וַ/יַּסִּ֥יכוּ שָׁ֖ם אֶת נִסְכֵּי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/028.yaml
  text: So I brought them into the land that I had lifted up my hand to give to them[a], and they saw every high hill and every leafy tree, and there they sacrificed their sacrifices, and there they presented the provocation of their offering, and there they set their pleasing aromas[c][b], and there they poured out their drink offerings.
translation:
  language: zh_hans
  text: 我就领他们进入我曾举手起誓要赐给他们的那地[a]。他们看见各处高冈和枝叶茂密的树[b]，就在那里宰牲献祭，献上他们那惹怒人的供物[c]；又在那里摆上他们的馨香之气，在那里倾倒他们的奠酒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举手起誓”直译为“举起我的手”，是立誓的动作，意思是上帝曾起誓要把那地赐给他们。
    reason: lexical_alternative
  - marker: b
    text: 传统译法常作“各高山、各青翠树”。这里的希伯来语直指高冈和枝叶浓密的树，并未使用专指祭祀场所的“邱坛”一词。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近似“他们供物的惹怒之物”，以压缩的说法表明他们所献的供物冒犯并激怒了上帝；原文没有明说“上帝”这一受事。
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲבִיאֵם
  choice: 我就领他们进入
  rationale: 使役形表达“带入、领入”；“就”自然承接上文的叙事进程。
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: 我曾举手起誓
  rationale: 这是起誓的惯用语。译文兼顾“举手”的原文意象和“起誓”的实际含义，避免现代汉语读者误解。
- source_word: כָל גִּבְעָה רָמָה
  choice: 各处高冈
  rationale: 保留地貌描写，不把原文并未使用的专门术语“邱坛”直接译入。
- source_word: וְכָל עֵץ עָבֹת
  choice: 枝叶茂密的树
  rationale: עָבֹת表示浓密、繁茂；此译具体自然，也呈现这些地点适合异教祭仪的环境。
- source_word: וַיִּזְבְּחוּ שָׁם אֶת־זִבְחֵיהֶם
  choice: 就在那些地方宰牲献祭
  rationale: זבח兼有宰杀祭牲和献祭之意；汉语合译为“宰牲献祭”既准确又自然。
- source_word: כַּעַס קָרְבָּנָם
  choice: 那惹怒我的供物
  rationale: 原文是高度压缩的“他们供物的惹怒之物”，意指其供物冒犯并激怒上帝；汉语明确补出语境中隐含的对象“我”。
- source_word: רֵיחַ נִיחוֹחֵיהֶם
  choice: 他们所献的馨香之气
  rationale: 保留祭祀用语“馨香之气”及其反讽张力：他们自以为献上馨香，实际却惹上帝发怒。
- source_word: וַיַּסִּיכוּ שָׁם אֶת־נִסְכֵּיהֶם
  choice: 又在那里浇奠他们的奠祭
  rationale: 动词表示倾倒，名词指奠酒或奠祭；“浇奠……奠祭”保留原文同源祭祀语汇的强调。
theological_decisions:
- issue: 举手惯用语是否直译
  choice: 举手起誓
  alternative: 举手；起誓
  rationale: 单译“举手”在现代汉语中无法清楚表达立誓含义，单译“起誓”则失去原文意象；合译兼顾二者。
- issue: 偶像祭物惹怒谁
  choice: 惹怒我的供物
  alternative: 惹怒人的供物；成为忿怒的供物
  rationale: 原文未明说宾语，但说话者是上帝，语境清楚表明这些供物惹他发怒。正文采用自然汉语，脚注说明原文的压缩表达，避免把补足成分冒充显式原文。
- issue: רֵיחַ נִיחוֹחַ在偶像祭祀中的表达
  choice: 馨香之气
  alternative: 悦人的香气
  rationale: 保留固定祭祀用语及其有意形成的神学反讽，不把它改写成上帝悦纳这些祭物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。重复“在那里”以呼应希伯来文反复出现的שָׁם，突出百姓在各处进行偶像祭祀；同时适度调整句式，使长串并列动作符合现代汉语节奏。
