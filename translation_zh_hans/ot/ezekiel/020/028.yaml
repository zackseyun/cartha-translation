  to: 我就领他们进入我曾举手起誓要赐给他们的那地[a]。他们看见各处高冈和枝叶茂密的树[b]，就在那里宰牲献祭，献上他们那惹怒人的供物[c]；又在那里摆上他们的馨香之气，在那里倾倒他们的奠酒。
  rationale: 修订删除正文中对“惹怒谁”的显式补足，借“惹怒人的”保留原文的压缩表达，并由脚注说明其在语境中指向上帝。将“使……升”改为“摆上”，以对应“放置”的原文动词；将“浇奠他们的奠祭”改为“倾倒他们的奠酒”，以改善现代汉语自然度而不改变祭祀语义。
