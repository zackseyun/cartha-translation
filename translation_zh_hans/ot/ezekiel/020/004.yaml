  text: הֲ/תִשְׁפֹּ֣ט אֹתָ֔/ם הֲ/תִשְׁפּ֖וֹט בֶּן אָדָ֑ם אֶת תּוֹעֲבֹ֥ת אֲבוֹתָ֖/ם הוֹדִיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/004.yaml
  text: Will you judge them? Will you judge[b][a], son of man? Make known to them the abominations of their fathers.
translation:
  language: zh_hans
  text: 你要审判他们吗？人子[a]啊，你要审判吗？要使他们知道他们父辈[b]的可憎之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”是《以西结书》中对以西结惯常的称呼；也可理解为“世人”或“必死的人”。
    reason: lexical_alternative
  - marker: b
    text: “父辈”也可译作“祖先”；希伯来语直译为“父亲们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁפֹּט / הֲתִשְׁפּוֹט
  choice: 你要审判……吗
  rationale: שׁפט在此具有司法性的“审判”之意；保留原文连续两次的反问，不将其弱化为一般的管理或裁决。第二次依原文不补出宾语“他们”。
- source_word: אֹתָם
  choice: 他们
  rationale: 这是直接宾语代词，按上下文指前来求问的以色列长老。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯常的称呼。“人子”既保留希伯来语的形式和男性表达，也符合中文圣经语体；本节不据此引入后来的弥赛亚称号含义。
- source_word: תּוֹעֲבוֹת
  choice: 可憎之事
  rationale: 该词在《以西结书》中常指在宗教和道德上令人憎恶、玷污的行为。“可憎之事”保留其强烈贬义，又比生硬的“可憎物”更符合此处语境。
- source_word: אֲבוֹתָם
  choice: 他们父辈
  rationale: 希伯来语直指“他们的父亲们”。“父辈”在现代中文中自然地表达前代男性祖先，并保留原文的父系家族措辞。
- source_word: הוֹדִיעֵם
  choice: 要让他们知道
  rationale: ידע的使役式表示“使他们知道”。此译保留使役意义，并以中文祈使语气自然表达。
theological_decisions:
- issue: בֶּן אָדָם的称呼含义
  choice: 人子
  alternative: 世人；必死的人
  rationale: 这里是上帝对以西结的先知性称呼，强调其人的身份；保留原有称呼，但不将本节直接解释为弥赛亚称号。
- issue: אֲבוֹתָם的家族与世代指向
  choice: 他们父辈
  alternative: 他们祖先
  rationale: “祖先”可表达广义先人，但原文使用阳性、父系的“父亲们”；正文保留这一具体措辞，同时以脚注说明较宽泛的译法。
- issue: 重复反问是否表示定罪
  choice: 保留“你要审判吗”的开放式反问
  alternative: 译作“你要定他们的罪吗”
  rationale: שׁפט可在语境中涉及宣判或定罪，但原文用较宽的“审判”，且重复反问本身具有张力；不在译文中预先限定审判结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两次“审判”的强调性重复及第二问未明说宾语的结构；“可憎之事”传达先辈在信仰和行为上的严重悖逆，不擅自限定为某一种罪。
