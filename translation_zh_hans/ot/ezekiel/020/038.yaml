  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בָרוֹתִ֣י מִ/כֶּ֗ם הַ/מֹּרְדִ֤ים וְ/הַ/פּֽוֹשְׁעִים֙ בִּ֔/י מֵ/אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ אוֹצִ֣יא אוֹתָ֔/ם וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָב֑וֹא וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/038.yaml
  text: I will purge from among you the rebels and those who transgress against me[a]. I will bring them out of the land where they sojourn, but they will not enter the land of Israel[c][b]. Then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我要从你们中间剔除那些悖逆的人和违背我的人[a]。我要把他们从他们寄居之地领出来[b]，但他们不得进入以色列地[c]。这样，你们就会知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “剔除”也可译作“筛出”；原文动词含有拣别并除去不合格者的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译：“从他们寄居之地。”
    reason: lexical_alternative
  - marker: c
    text: 原文“进入”的动词为单数形式，可按集合或逐一分配的意义理解，即这群人中没有一个能进入。
    reason: grammar
lexical_decisions:
- source_word: וּבָרוֹתִי מִכֶּם
  choice: 我要从你们中间清除
  rationale: ברר在此表示通过拣别而除去；“清除”既体现审判和净化的意味，也保留从群体中分离出去的语义。מִכֶּם译为“从你们中间”，明确其群体内部的分离含义。
- source_word: הַמֹּרְדִים
  choice: 那些悖逆的人
  rationale: 分词作名词用，指持续处于反叛状态的人；“悖逆”适合庄重的先知性语境。
- source_word: וְהַפּוֹשְׁעִים בִּי
  choice: 得罪我的人
  rationale: פשע可指反叛或严重过犯；前文已有“悖逆”，故以“得罪”保留对神的个人性冒犯，同时避免两个词完全同义重复。
- source_word: מֵאֶרֶץ מְגוּרֵיהֶם
  choice: 从寄居之地
  rationale: מָגוּר指寄居、侨居状态；此译简洁地保留他们居于异地而非本土的意味。
- source_word: אוֹצִיא אוֹתָם
  choice: 我要把他们……领出来
  rationale: יצא的使役式意为使其出来；“领出来”在现代汉语中自然，并保留由神主动带出的含义。
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל
  choice: 但……进入以色列地
  rationale: 连接词在此形成转折；אַדְמָה虽可直译为土地、土壤，此处是疆域称谓，译作“以色列地”自然准确。
- source_word: לֹא יָבוֹא
  choice: 他们必不能进入
  rationale: 原文动词为第三人称阳性单数，但针对前面的复数组群具有集合或逐一分配的用法；汉语按所指群体译为复数。“必不能”体现明确的否定结果。
- source_word: וִידַעְתֶּם
  choice: 这样，你们就知道
  rationale: 承接前述审判的结果，“这样……就……”自然表达其结果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文常见音译呈现四字神名，保留其专名性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为其现代汉语音译，以专名呈现，不用“主”等称号替代。
- issue: וּבָרוֹתִי所表达的审判力度
  choice: 清除
  alternative: 筛出
  rationale: 上下文描写神把悖逆者从群体中分别并排除；“清除”保留审判与净化的力度，“筛出”则更突出拣别的动作。
- issue: לֹא יָבוֹא的单数形式
  choice: 他们必不能进入
  alternative: 他必不能进入
  rationale: 虽然动词形态是单数，但其先行对象为复数，适宜理解为集合性或逐一分配的单数；译作复数最符合现代汉语，同时不改变任何成员都不能进入的含义。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语言。“悖逆”保留经文语体的严肃感；“得罪我的人”避免与前词机械重复。正文中的脚注标记均紧随对应语句。
