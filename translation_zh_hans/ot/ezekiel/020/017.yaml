  terminology: “旷野”适合此处出埃及语境；“灭尽”恰当表达“作完全的毁灭”。“顾惜”能表达 חוס 的怜惜、保全和不予毁灭，且较“怜悯”更直接保留“饶恕／不毁灭”的语义。
