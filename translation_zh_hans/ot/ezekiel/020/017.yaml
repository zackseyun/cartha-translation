  yaml_path: translation/ot/ezekiel/020/017.yaml
  text: But my eye spared them from destroying them[a], and I did not make a complete end of them in the wilderness.
translation:
  language: zh_hans
  text: 但我的眼[a]顾惜他们，没有毁灭他们；我也没有在旷野把他们灭尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我的眼顾惜他们”。这是希伯来语的表达，指上帝怜惜他们，克制而没有毁灭他们。
    reason: 说明原文以“我的眼”为主语的拟人化习语，并保留正文的具体意象。
lexical_decisions:
- source_word: וַתָּחָס עֵינִי עֲלֵיהֶם
  choice: 我眼中怜惜他们
  rationale: 保留希伯来文以“我的眼”为主语的拟人化意象，同时用现代汉语自然的“眼中怜惜”表达因怜悯而克制、不予毁灭之意。
- source_word: מִשַּׁחֲתָם
  choice: 没有毁灭他们
  rationale: 介词 מִן 加 שׁחת 的不定式结构表示“没有去毁灭他们”；在汉语中与前面的怜惜关系自然衔接。
- source_word: וְלֹא עָשִׂיתִי אוֹתָם כָּלָה
  choice: 也没有……把他们灭尽
  rationale: עשה כלה 是“彻底除灭、灭尽”的惯用表达；“灭尽”既体现完全毁灭，也避免与前一分句机械重复。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是出埃及叙事语境中 מדבר 的自然且通行译法。
theological_decisions:
- issue: 上帝怜悯的拟人化表达
  choice: 保留“我眼中怜惜他们”
  alternative: “我怜惜他们”或“我看见他们就怜悯”
  rationale: 原文刻意以“我的眼”作主语，描绘上帝以怜悯相待并抑制毁灭；译文保留该身体意象，不把它抽象化，也不额外解释其神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“然而”承接上文的审判宣告并形成转折；两个“没有”清楚呈现原文中怜惜而不毁灭、未予灭尽的平行关系。
