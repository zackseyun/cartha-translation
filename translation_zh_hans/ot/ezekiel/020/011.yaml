  text: וָ/אֶתֵּ֤ן לָ/הֶם֙ אֶת חֻקּוֹתַ֔/י וְ/אֶת מִשְׁפָּטַ֖/י הוֹדַ֣עְתִּי אוֹתָ֑/ם אֲשֶׁ֨ר יַעֲשֶׂ֥ה אוֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֥י בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/011.yaml
  text: I gave them my statutes[a], and I made my judgments known to them, which, if a man does them, he will live by them.
translation:
  language: zh_hans
  text: 我把我的律例赐给他们，也使他们知道我的典章；人若遵行这些，就必靠这些活着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “靠这些活着”也可译作“在这些之中活着”；原文介词可表达凭借或关联。这里所说“活着”的具体范围，原文没有进一步说明。
    reason: 保留介词בָּהֶם的语义幅度，以及生命应许在时间与神学范围上的开放性。
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: 我……赐给
  rationale: נתן在此表示给予；“赐给”自然体现上帝向百姓颁赐律例的语境。
- source_word: חֻקּוֹתַי
  choice: 我的律例
  rationale: חֻקִּים指颁定的法规或律令；“律例”保留盟约法律语域，并与“典章”形成常见而清楚的搭配。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּטִים在法律语境中指判例、法则或规章；“典章”既保留法律色彩，也与“律例”有所区别。
- source_word: הוֹדַעְתִּי אוֹתָם
  choice: 使他们知道
  rationale: ידע的使役形直译为“使……知道”；避免用“教导”或“启示”增添原文未明说的方式。
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם
  choice: 若遵行这些
  rationale: עשה用于律法时不只是一般的“做”，而是实行、遵守；“遵行”符合现代汉语法律与盟约语境。“若”自然表达该关系所含的条件意味。
- source_word: הָאָדָם
  choice: 人
  rationale: 带冠词的单数אָדָם在这里具有代表性、泛指作用；汉语“人”可自然涵盖任何人，无须强加男性限定。
- source_word: וָחַי בָּהֶם
  choice: 就必因此活着
  rationale: 保留生命与遵行律例典章之间的关联；“因此”表达בָּהֶם可能具有的凭借或关联意义，而不把“活着”的范围限定为今世、民族性或永恒生命。
theological_decisions:
- issue: 遵行与生命之间关系的神学范围
  choice: 译为“就必因此活着”，保留原文的生命—顺服公式
  alternative: 明确解释为守律法得永生，或解释为盟约之下现世与民族的兴盛
  rationale: 原文没有在本节界定“活着”的全部范围。译文不预先裁定它仅指个人、群体、现世或末世生命。
- issue: הָאָדָם的代表性范围
  choice: 译为泛指的“人”
  alternative: 译为“那人”“一个男人”或“人类”
  rationale: 希伯来语使用带冠词的单数代表形式；现代汉语“人”最自然地保留其普遍适用性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“律例／典章”保持法律—盟约语域；句式简洁，适合公众阅读。脚注标记置于整句末尾，对生命公式作必要而不过度的说明。
