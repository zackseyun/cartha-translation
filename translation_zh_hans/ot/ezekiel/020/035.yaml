  text: וְ/הֵבֵאתִ֣י אֶתְ/כֶ֔ם אֶל מִדְבַּ֖ר הָֽ/עַמִּ֑ים וְ/נִשְׁפַּטְתִּ֤י אִתְּ/כֶם֙ שָׁ֔ם פָּנִ֖ים אֶל פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/035.yaml
  text: I will bring you into the wilderness of the peoples[b][a], and there I will enter into judgment with you face to face.
translation:
  language: zh_hans
  text: 我必把你们带到列国的旷野[b]；我必在那里同你们面对面地进行审判[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必在那里面对面地审判你们。”原文动词可较简洁地译为“审判”，但其与“同/与”连用的结构也可表达与人进行司法审理或争讼的意味。
    reason: lexical_alternative
  - marker: b
    text: “列国的旷野”可能指以色列人分散在列国期间所处的一个如同旷野的地方。
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: 我要把……带到
  rationale: 使役式在此表示“使来到、带到”；采用现代汉语自然的处置式，明确上帝是行动者。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 对应第二人称阳性复数直接宾语。
- source_word: אֶל מִדְבַּר
  choice: 到……的旷野
  rationale: אֶל 表示趋向目的地；מִדְבָּר 指荒野或未开垦之地，“旷野”既准确，也保留与出埃及传统的呼应。
- source_word: הָעַמִּים
  choice: 万民
  rationale: עַמִּים 是“民、族群”的复数；“万民”在庄重现代汉语中自然，并保留其复数群体含义。“列国”亦可能，但更偏重政治实体。
- source_word: וְנִשְׁפַּטְתִּי אִתְּכֶם
  choice: 与你们……审判
  rationale: שׁפט 的尼法勒式与表示“同、与”的介词连用，带有与对方进入审理或争讼的意味。“与你们审判”保留这种司法相对关系，而不只表达宣布判决。
- source_word: שָׁם
  choice: 在那里
  rationale: 地点副词回指前述“万民的旷野”。
- source_word: פָּנִים אֶל פָּנִים
  choice: 面对面地
  rationale: 直译该固定表达，突出直接、亲自相对的审判场景。
theological_decisions:
- issue: 上帝行动的司法含义
  choice: 与你们面对面地审判
  alternative: 面对面地审判你们
  rationale: 原文的尼法勒式及其介词结构不只是单方面宣判，也可呈现直接进入审理或争讼的意味。正文保留“与你们”的关系结构，并以脚注说明更简洁的译法，避免把经文限定为过度技术化的法庭程序。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“万民的旷野”保留原文不寻常的意象及潜在含混；“面对面”保留直接相遇的力度。脚注标记按其在正文中的对应位置排列。
