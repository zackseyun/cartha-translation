  text: וַ/הֲשִׁבֹ֨תִי֙ אֶת יָדִ֔/י וָ/אַ֖עַשׂ לְמַ֣עַן שְׁמִ֑/י לְ/בִלְתִּ֤י הֵחֵל֙ לְ/עֵינֵ֣י הַ/גּוֹיִ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/022.yaml
  text: But I held back my hand[a], and I acted for the sake of my name, so that it would not be profaned in the sight of the nations[b], before whose eyes I had brought them out.
translation:
  language: zh_hans
  text: 然而，我收回了我的手[a]，为我名的缘故行事，免得我的名[b]在列国眼前受亵渎；我曾在这些列国眼前把他们领出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我转回了我的手”“我止住了我的手”。这是希伯来语惯用表达，指克制自己，不施行所说的审判。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“免得亵渎”，宾语承接前面的“我的名”。原文没有说明是谁实施亵渎。
    reason: implicit_object_and_ambiguity
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי אֶת־יָדִי
  choice: 我收回了我的手
  rationale: 原文直译为“使我的手返回”，在上下文中表示上帝克制自己，没有施行先前所说的审判。译文保留“手”的比喻，同时用现代汉语可理解的表达呈现其含义。
- source_word: וָאַעַשׂ
  choice: 而行
  rationale: עָשָׂה含义宽泛，可指“做、行”。此处不具体补入原文没有明说的行动内容，以保留其概括性。
- source_word: לְמַעַן שְׁמִי
  choice: 为我的名
  rationale: 保留“我的名”这一原文表达，不改写为“我的名誉”或“我的荣耀”，从而保存其圣经神学内涵以及公开声誉的含义。
- source_word: לְבִלְתִּי הֵחֵל
  choice: 免得我的名受亵渎
  rationale: הֵחֵל在这里表示“亵渎、使之成为俗物”。希伯来文省略宾语，宾语由前面的“我的名”补足；汉语明说“我的名”可避免歧义。
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: 在列国眼前
  rationale: 较直接地保留“在……眼前”的空间和见证意象，强调事情公开发生在列国面前。
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם לְעֵינֵיהֶם
  choice: 我曾在这些列国眼前把他们领出来
  rationale: הוֹצֵאתִי是使役形式，意为“领出、带出”。“这些列国”明确承接前面的列国，并保留原文重复的“眼前”意象；“他们”则保留原文代词，不在正文中额外指定其身份。
theological_decisions:
- issue: 上帝在所宣告的审判面前收手
  choice: 译作“我收回了我的手”，并以脚注说明这是克制、不施行审判的惯用表达。
  alternative: 我止住了我的手；我转回了我的手；我收手了
  rationale: 正文保留原文“手”的比喻及“返回”的动作，同时不把其神学意义扩展为原文未明说的系统性解释。
- issue: “我的名”的所指与功能
  choice: 正文保留“我的名”，并在后句补出它是“受亵渎”的宾语。
  alternative: 我的名誉；我的荣耀；免得有人亵渎它
  rationale: “我的名”既是原文明确措辞，也承载上帝在列国面前公开尊荣的含义。保留原词可避免把它缩减为单纯的社会声誉。
- issue: 亵渎的语态与隐含宾语
  choice: 译为“免得我的名在列国眼前受亵渎”。
  alternative: 免得我在列国眼前亵渎我的名；免得人亵渎我的名
  rationale: 原文不明说施事者，因此采用汉语被动表达，既补足宾语又不擅自确定是谁实施亵渎，保存原文的含混与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“列国眼前”有意保留原文两次出现的“眼前”意象；“为我的名而行”略带圣经语体，但在现代汉语中仍清楚可懂。
