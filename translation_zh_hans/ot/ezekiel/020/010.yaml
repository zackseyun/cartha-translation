  yaml_path: translation/ot/ezekiel/020/010.yaml
  text: So I brought them out from the land of Egypt and brought them into the wilderness.
translation:
  language: zh_hans
  text: 于是，我把他们从埃及地领出来，带到旷野。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹוצִיאֵם
  choice: 于是，我把他们……领出来
  rationale: יצא的使役形表达“使出去、领出”。“领出来”自然地保留使役和带领之意；句首ו承接上文的叙事次序，译作“于是”。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 原文明确含有אֶרֶץ（地），故保留为“埃及地”，也呼应圣经中常见的出埃及表述。
- source_word: וָאֲבִאֵם
  choice: 带到
  rationale: בוא的使役形在此意为“使来到、带到”。中文用“带到”简洁自然，并与前面的“领出来”构成连贯的移动过程。
- source_word: אֶל הַמִּדְבָּר
  choice: 到旷野
  rationale: מִדְבָּר指旷野、荒野或干旱草原；“旷野”是自然且符合出埃及语境的译法。介词אֶל表示趋向，结合“带到”译出抵达之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“于是”连接上下文；“从埃及地领出来，带到旷野”保留原文由离开埃及到进入旷野的平行推进，同时避免中文中机械重复“带”。
