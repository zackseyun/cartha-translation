  text: וָ/אֶעֱשֶׂ֖ה לְמַ֣עַן שְׁמִ֑/י לְ/בִלְתִּ֤י הֵחֵל֙ לְ/עֵינֵ֣י הַ/גּוֹיִ֔ם אֲשֶׁ֥ר הוֹצֵאתִ֖י/ם לְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/014.yaml
  text: But I acted for the sake of my name[a], so that it would not be profaned in the sight of the nations[b], in whose sight I had brought them out.
translation:
  language: zh_hans
  text: 但我为自己的名而行[a]，免得我的名在列国眼前被亵渎[b]；我曾在这些列国眼前把以色列人领出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为了我名的缘故。”
    reason: lexical_alternative
  - marker: b
    text: “亵渎”所译的动词，可指把圣洁的事物当作普通之物，损害其神圣性。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱשֶׂה
  choice: 但我……而行
  rationale: עשה含义宽泛，可指“做、行、采取行动”。这里承接前文所宣告的审判并形成转折，用“但我……而行”既保留动词的概括性，也表达上帝实际采取了行动。
- source_word: לְמַעַן שְׁמִי
  choice: 为自己的名
  rationale: לְמַעַן表示“为了……的缘故”。“名”保留希伯来语的重要意象，涉及上帝公开显明的身份、圣洁与尊荣，而不把含义缩减为一般的名声。
- source_word: לְבִלְתִּי הֵחֵל
  choice: 免得我的名……被亵渎
  rationale: 该结构表达防止某事发生的目的。חלל在此指使圣洁之物受到亵渎；按中文表达补出由上文确定的宾语“我的名”，并采用被动式，以避免误读为上帝亲自亵渎自己的名。
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: 在列国眼前
  rationale: 直译“在列国眼中／眼前”，强调事情是公开可见的。“列国”比“外邦人”更贴近以西结书中周围各民族和国家的语境。
- source_word: אֲשֶׁר הוֹצֵאתִים
  choice: 我曾……把以色列人领出来
  rationale: 使役词形表示“使他们出来、把他们领出来”。代词所指是以色列人；中文为指代清楚而明说“以色列人”。“曾”表明这行动先于本节所述的顾虑。
- source_word: לְעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 保留原文第二次出现的“眼前”意象，突出上帝领出以色列是列国亲眼可见的公开行动。
theological_decisions:
- issue: 上帝“为自己的名”而行动的含义
  choice: 保留“为自己的名”这一圣经惯用语，表明上帝维护其名的圣洁和公开尊荣。
  alternative: 解释为上帝只是为了维护表面的声誉。
  rationale: 以西结书中的“名”关乎上帝所显明的身份、圣洁和信实，并非虚荣。正文保留原文张力，不加入超出本节的教义性阐释。
- issue: “被亵渎”的语法宾语
  choice: 在中文正文中补明为“我的名”。
  alternative: 译成“免得被亵渎”，保留希伯来语中未明说宾语的形式。
  rationale: 希伯来语可从紧邻的“我的名”自然确定宾语；中文若完全省略，容易造成语义不清。补明宾语不改变原意，也保留被动表达所呈现的主体开放性。
translation_notes:
  register: 采用现代、庄重而清晰的书面普通话。“列国”保留先知文学语域；两次使用“眼前”对应原文的重复，突出公开见证。分号帮助读者辨明末句对“列国”的回指关系。
