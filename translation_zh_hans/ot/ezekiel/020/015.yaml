  text: וְ/גַם אֲנִ֗י נָשָׂ֧אתִי יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/בִלְתִּי֩ הָבִ֨יא אוֹתָ֜/ם אֶל הָ/אָ֣רֶץ אֲשֶׁר נָתַ֗תִּי זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/015.yaml
  text: Yet I myself also raised my hand to them in the wilderness[a], that I would not bring them into the land that I had given them, flowing with milk and honey[b], the glory of all lands.
translation:
  language: zh_hans
  text: 然而，我也曾在旷野向他们举手[a]，起誓不把他们领进我赐给他们的地；那地流奶与蜜，是万地的荣耀[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“举起我的手”；这是起誓的惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “荣耀”也可译作“荣美”“华美”，或按比较意味译作“万地中最荣美的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: 然而，我也曾
  rationale: 保留וְגַם的递进、附加语气，并用“然而”承接上文的转折发展；“我”保留原文显式主语所带的强调。
- source_word: נָשָׂאתִי יָדִי
  choice: 向他们举手
  rationale: 保留希伯来语起誓时举手的具体惯用动作；下文以“起誓不……”清楚表达该动作的语用含义。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是现代中文圣经语境中自然且准确的表达，不把地貌局限为沙漠。
- source_word: לְבִלְתִּי הָבִיא אוֹתָם
  choice: 起誓不领他们进入
  rationale: 将不定式结构理解为所起誓言的内容；“领……进入”自然表达使他们进入该地的意思。
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי
  choice: 我赐给他们的那片地
  rationale: “赐”符合上帝赐地的语境；中文无需以过去完成时形式标记先时关系。“他们”按上下文补明受赐者，使句意完整。
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: 流奶与蜜
  rationale: 保留希伯来语形象及中文读者熟悉的圣经表达，指土地丰饶。
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: 是万地中最荣美的
  rationale: צְבִי在此表示可喜爱、荣美或华美；该谓语结构在比较诸地时具有卓越意味。“最荣美”既自然又保留庄重语体。
theological_decisions:
- issue: 是否在正文中明说נָשָׂאתִי יָדִי的起誓含义
  choice: 同时保留“举手”的具体意象，并以“起誓不……”明示其含义
  alternative: 只译作“举手”或只译作“起誓”
  rationale: 这样既不抹去原文的身体动作，也避免现代普通读者不明白这是起誓惯用语；没有额外规定誓言的神学性质。
- issue: נָתַתִּי所指赐地行为的时间与性质
  choice: 译作“我赐给他们的”
  alternative: 译作“我曾赐给他们的”或“我应许赐给他们的”
  rationale: 原文直接使用“给、赐”的完成式；中文关系从句已能自然表达该赐予先于当时誓言，无须把“赐”解释性改写为单纯“应许”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那片地；那地……”保留原文先指明土地、后补述其特征的结构。脚注标记均置于其所解释的词语之后。
