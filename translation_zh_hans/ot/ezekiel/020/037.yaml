base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/037.yaml
  text: I will make you pass under the rod[b][a], and I will bring you into the bond of the covenant.
translation:
  language: zh_hans
  text: 我要使你们从杖下经过[a]，使你们进入盟约的约束之中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从杖下经过”可能借用牧人让羊逐只从杖下经过，以便点数或察看的做法。
    reason: cultural_note
  - marker: b
    text: “约束”所译的希伯来词十分罕见，也可理解为“捆绑”“拘束”或“义务”；这里表达人在盟约之下受到约束。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: 我要使……经过
  rationale: עבר的使役式表达使役含义；“使……经过”保留这一语法力量，并与“从杖下”自然搭配。
- source_word: תַּחַת הַשָּׁבֶט
  choice: 从杖下
  rationale: שֵׁבֶט可指杖、牧杖或权杖；此处“从杖下经过”最自然地保留牧人点数或察看羊群的意象，同时不排除管辖与审察的意味。
- source_word: וְהֵבֵאתִי
  choice: 使……进入
  rationale: בוא的使役式通常意为“带入、使进入”；结合介词ב，此译法在现代汉语中比直译“带到……中”更顺畅。
- source_word: בְּמָסֹרֶת
  choice: 进入……的约束之中
  rationale: מָסֹרֶת是罕见词，含捆绑、拘束或约束之意。“约束”既保留受约束的比喻，又避免将其限定为实体的锁链。
- source_word: הַבְּרִית
  choice: 盟约
  rationale: בְּרִית在此指上帝与其子民之间具有约束力的约；“盟约”是现代中文圣经语境中庄重且易懂的表达。
theological_decisions:
- issue: 盟约意象侧重惩罚还是恢复
  choice: 译文同时保留审察、管束以及重新置于盟约义务之下的可能意味。
  alternative: 明确译成惩罚性的拘禁，或明确译成恢复盟约团契。
  rationale: “从杖下经过”和“盟约的约束”可兼具清点审察、施行管辖和归入盟约约束的意味；本节本身没有把重点单独限定为惩罚或恢复，因此不在译文中消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从杖下经过”保留原文具体意象；“盟约的约束”刻意保留罕见词所具有的捆绑感及其神学张力。脚注标记按正文出现顺序排列。
