lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 此处是先知书中常见的叙事引介公式；与דְבַר יְהוָה合译为“耶和华的话临到”，既自然又保留原文的公式性。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定先知性表达中，“话”准确指从神而来的具体启示，也与全书惯用语保持一致。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，而不是以“主”这一称号替代专名。
- source_word: אֵלַי
  choice: 我
  rationale: 在“临到我”中自然表达介词加第一人称单数后缀的意义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用“说”引出下一节的直接话语，简洁保留希伯来语公式的结构。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知且庄重的专名“耶和华”，不以“主”替代；“雅威”是更接近常见学术拟音的可行译法。
translation_notes:
  register: 采用现代、庄重而自然的中文，并保留先知书启示公式“耶和华的话临到我，说”。本节无需脚注。
