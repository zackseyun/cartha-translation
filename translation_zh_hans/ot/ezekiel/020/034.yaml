  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפוֹצֹתֶ֖ם בָּ֑/ם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/חֵמָ֖ה שְׁפוּכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/034.yaml
  text: I will bring you out from the peoples and gather you from the lands where you have been scattered[c][b][a], with a strong hand and an outstretched arm and with wrath poured out.
translation:
  language: zh_hans
  text: 我要把你们从各族中带出来[a]，从你们被分散到的各地把你们聚集起来；我要用强有力的手[b]、伸出的臂，并以倾泻而出的烈怒[c]行这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各族”或译“列国”。
    reason: lexical_alternative
  - marker: b
    text: 传统圣经用语常译作“大能的手”。
    reason: cross_reference
  - marker: c
    text: “倾泻而出的烈怒”或译“倾泻而出的盛怒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: 我要把……带出来
  rationale: 希伯来语是 יצא 的使役形，意为“使出来、带出来”；“带出来”自然清楚，也保留与出埃及事件相呼应的意味。
- source_word: הָעַמִּים
  choice: 各族
  rationale: עַמִּים 指多个民族或民群。“各族”既符合现代汉语，也能与下文表示地域的“各地”形成区别；“列国”亦属可能译法。
- source_word: וְקִבַּצְתִּי
  choice: 把你们聚集起来
  rationale: קבץ 是描述流散者重新聚集的常用动词；“聚集起来”准确表达重新归拢的动作。
- source_word: הָאֲרָצוֹת
  choice: 各地
  rationale: 此处复数 אֲרָצוֹת 指流散所到的不同地域。“各地”自然且不过度套用现代民族国家概念。
- source_word: אֲשֶׁר נְפוֹצֹתֶם בָּם
  choice: 你们被分散到的
  rationale: פוץ 的尼法勒形表达被动的“被分散”；这一关系从句保留流散到多地的方向和结果。
- source_word: בְּיָד חֲזָקָה
  choice: 以强有力的手
  rationale: 直译为“以强壮/有力的手”。“强有力的手”贴近原文，并保留出埃及传统中的固定意象。
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: 伸出的臂
  rationale: 这是表示上帝决定性行动的固定圣经意象；“伸出的臂”贴近字面，又避免补入原文未明说的解释。
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: 倾泻而出的烈怒
  rationale: חֵמָה 表示强烈的愤怒，שְׁפוּכָה 意为“被倾倒、倾泻的”。此译保留鲜明的审判图像及其力度。
theological_decisions:
- issue: 拯救性的出埃及意象与审判性的烈怒并置
  choice: 保留“强有力的手、伸出的臂”这一出埃及式表达，同时直译“倾泻而出的烈怒”。
  alternative: 把全句处理为单纯的拯救或归回语言，弱化其中的审判意味。
  rationale: 本节有意把重新聚集与上帝的审判行动交织在一起。译文不应把这种神学张力化约为纯粹的拯救或纯粹的惩罚。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“这样做”补明句末三个介词短语修饰前述带出和聚集的行动，未增加新的实质含义。标点用分号突出行动与其方式之间的关系。
