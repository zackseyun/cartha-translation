source:
  edition: WLC
  text: יַ֜עַן מִשְׁפָּטַ֤/י לֹֽא עָשׂוּ֙ וְ/חֻקּוֹתַ֣/י מָאָ֔סוּ וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וְ/אַחֲרֵי֙ גִּלּוּלֵ֣י אֲבוֹתָ֔/ם הָי֖וּ עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/024.yaml
  text: because they did not practice my judgments[a], and they rejected my statutes, and they profaned my Sabbaths, and their eyes were after the idols of their fathers.
translation:
  language: zh_hans
  text: 因为他们不遵行我的典章，厌弃我的律例，亵渎我的安息日；他们的眼目追随他们父辈的偶像。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来词带有强烈的鄙夷意味；也可译作“可憎的偶像”，甚至“粪偶像”。
    reason: 说明 גִּלּוּלִים 的贬斥语气及可选译法。
lexical_decisions:
- source_word: יַעַן
  choice: 因为
  rationale: 引出前述神采取行动或施行审判的原因；“因为”自然保留因果关系。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: 该词在此指盟约中的法令和裁断；“典章”保留正式的律法语域，并与“律例”有所区分。
- source_word: עָשׂוּ
  choice: 不遵行
  rationale: 与律法要求搭配时，“遵行”比直译“做”更符合现代汉语，同时保留付诸实行之意。
- source_word: חֻקּוֹתַי
  choice: 我的律例
  rationale: 这是常见的盟约律法用语；“律例”准确、庄重，也与 מִשְׁפָּטַי 的“典章”形成词汇区分。
- source_word: מָאָסוּ
  choice: 厌弃
  rationale: 该动词表示拒斥、弃绝，并可带轻蔑意味；“厌弃”在本节的悖逆语境中自然且有力度。
- source_word: שַׁבְּתוֹתַי
  choice: 我的安息日
  rationale: 复数指神所设立、当守的安息日；汉语通常以单数形式“安息日”作类别性表达。
- source_word: חִלֵּלוּ
  choice: 亵渎
  rationale: 该词在礼仪和盟约语境中表示使圣物俗化、不以为圣；“亵渎”保留其神学分量。
- source_word: אַחֲרֵי
  choice: 追随
  rationale: 与“眼目”及系词连用，表达目光和欲望转向某对象；“追随”自然呈现这种趋向。
- source_word: גִּלּוּלֵי
  choice: 偶像
  rationale: 基本所指是偶像；原词特有的强烈鄙夷色彩在脚注中说明，以免正文过度释义。
- source_word: אֲבוֹתָם
  choice: 他们父辈的
  rationale: 原文为阳性复数“父辈”；保留具体的家族和世代用语，不泛化为“祖先”。
- source_word: הָיוּ עֵינֵיהֶם
  choice: 他们的眼目追随
  rationale: 原文图像是“他们的眼目在……之后”，表示内心倾向和注目；此译保留“眼目”意象，同时使汉语通顺。
theological_decisions:
- issue: אֲבוֹתָם 的男性亲属称谓
  choice: 他们父辈的
  alternative: 他们祖先的
  rationale: 原文明确使用阳性复数“父辈”；正文保留这一世代与亲属称谓，而不将其扩大为性别中性的“祖先”。
- issue: גִּלּוּלִים 的贬斥色彩
  choice: 正文译“偶像”，脚注说明其强烈鄙夷意味
  alternative: 可憎的偶像／粪像
  rationale: 该词是以西结常用的强烈蔑称。正文采用清楚而不过度扩展的“偶像”，脚注则保留原词的修辞力度和可供审查的词义信息。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“典章／律例”保留盟约律法词汇的区分，以“亵渎”体现圣俗语境，并保留“眼目”这一希伯来意象。
