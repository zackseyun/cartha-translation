  text: וּ/זְכַרְתֶּם שָׁ֗ם אֶת דַּרְכֵי/כֶם֙ וְ/אֵת֙ כָּל עֲלִיל֣וֹתֵי/כֶ֔ם אֲשֶׁ֥ר נִטְמֵאתֶ֖ם בָּ֑/ם וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם בְּ/כָל רָעוֹתֵי/כֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/043.yaml
  text: There you will remember your ways and all your deeds by which you defiled yourselves[b][a], and you will loathe yourselves in your own sight for all the evils that you have done.
translation:
  language: zh_hans
  text: 在那里，你们必想起自己的行径和一切作为，就是你们借此玷污了自己的；你们又必因所行的一切恶事，在自己眼中厌恶自己[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在自己眼中”直译为“在你们面前／脸前”；此处指对自身的看法或自我审视。“厌恶自己”也可译作“对自己感到恶心”或“憎恶自己”。希伯来语动词表达强烈的自我憎恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכַרְתֶּם שָׁם
  choice: 在那里，你们必想起
  rationale: 连词加完成式在这一预言语境中指向将来；“想起”自然表达 זכר 的回顾含义，שָׁם 则承接上文所说的复兴之地。
- source_word: דַּרְכֵיכֶם
  choice: 自己的所作所为
  rationale: דֶּרֶךְ 在先知书的道德语境中常指生活方式或行为表现；此处译为“所作所为”既自然，也保留其总体行为取向。
- source_word: כָּל עֲלִילוֹתֵיכֶם
  choice: 一切行径
  rationale: עֲלִילוֹת 指行为、作为；“行径”在此带有合乎语境的道德贬义，并与前面的总体行为表达有所区分。
- source_word: אֲשֶׁר נִטְמֵאתֶם בָּם
  choice: 使自己沾染污秽的
  rationale: נטמא 的尼法勒式可表示成为不洁或受玷污；“使自己沾染污秽”传达反身意味和行为责任，同时保留礼仪与道德污秽均可能涉及的语义。
- source_word: וּנְקֹטֹתֶם
  choice: 你们必……厌恶自己
  rationale: קוט 表达强烈的憎恶、嫌恶；“厌恶自己”准确呈现这里因回想罪恶而产生的自我憎恶。
- source_word: בִּפְנֵיכֶם
  choice: 自己
  rationale: 字面为“在你们面前／脸上”，在此表示对自身的看法。中文以“厌恶自己”自然传达其反身、自我审视的含义，无须机械直译。
- source_word: בְּכָל רָעוֹתֵיכֶם אֲשֶׁר עֲשִׂיתֶם
  choice: 因自己所行的一切恶事
  rationale: 介词 בְּ 在此可表原因；רָעוֹת 指恶事或邪恶行为。“因……一切恶事”清楚说明自我厌恶的缘由。
theological_decisions:
- issue: 复兴之后以色列人的回应性质
  choice: 译文将其呈现为回想罪恶并因此厌恶自己，体现强烈的悔罪反应。
  alternative: 可较弱地理解为羞愧、懊悔或对自己感到恶心。
  rationale: קוט 的词义力度超过一般的遗憾或羞愧；同时译文不加入本节未明说的完整悔改教义体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“必”保留预言语境中的将来确定性；句式避免生硬照搬希伯来语。“所作所为／行径”分别表达总体生活行为与具体作为。
