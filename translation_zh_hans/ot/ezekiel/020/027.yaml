base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/027.yaml
  text: 'Therefore speak to the house of Israel[a], son of man, and say to them, ‘Thus says the Lord Yahweh: In this also your fathers blasphemed me[b], by acting treacherously against me.’'
translation:
  language: zh_hans
  text: 所以，人子啊，你要对以色列家说：‘主耶和华如此说：在这件事上，你们的祖先还亵渎我；他们以背信弃义[a]背叛我。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背信弃义”也可译作“对我不忠”或“背叛我”。原文使用同根词语加强语气，强调破坏信义、背弃盟约。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的论述并引出结论，符合现代汉语先知话语的自然衔接。
- source_word: דַּבֵּר אֶל בֵּית יִשְׂרָאֵל
  choice: 对以色列家说
  rationale: 保留“以色列家”这一集体性、盟约性的称谓，不泛化为“以色列人”。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是以西结书中上帝对先知的固定称呼；沿用简洁而为中文读者熟悉的传统译法。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知传信公式，并以“耶和华”呈现神名；“主耶和华”自然对应两个不同的希伯来语成分。
- source_word: עוֹד זֹאת
  choice: 还在这件事上
  rationale: “还”体现 עוֹד 的附加意味，“这件事”保留 זֹאת 对后述事件的指示。
- source_word: גִּדְּפוּ אוֹתִי
  choice: 亵渎我
  rationale: 该动词在此表达对上帝的侮辱与冒犯；“亵渎”准确传达其宗教和道德分量。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们的祖先
  rationale: 此处指以色列人的先辈群体；“祖先”在现代汉语中自然准确，也不额外限定为直接父辈。
- source_word: בְּמַעֲלָם בִּי מָעַל
  choice: 就是背信弃义地对待我
  rationale: 希伯来语同根结构强化了不忠和毁约的行为；“背信弃义”传达其盟约背叛色彩，“就是”表明后句说明亵渎的具体方式。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文明确含有四字神名；译作“耶和华”保留专名性质，同时用“主”对应 אֲדֹנָי。
- issue: בֶּן אָדָם 在以西结书中的译法
  choice: 人子
  alternative: 凡人
  rationale: 保留全书反复出现的固定称呼及其字面形式；在本处不将其解释为基督论称号，也不把其含义单一化为“必死的人”。
- issue: 亵渎与背信行为之间的关系
  choice: 用“就是”将后句表达为前句的具体说明
  alternative: 用“因……而”表达原因或方式
  rationale: 介词 בְּ 可表达方式或关联；这里视后半句为说明他们如何亵渎上帝，同时脚注保留“背叛/不忠”的词义幅度。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“以色列家”“人子”“主耶和华如此说”等以西结书的关键表达；用“祖先”避免现代读者把“父辈”误解为仅上一代。脚注标记置于其所解释的完整分句之后。
