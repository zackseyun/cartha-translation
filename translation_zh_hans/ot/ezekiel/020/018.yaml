id: EZK.20.18
reference: Ezekiel 20:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֤ר אֶל בְּנֵי/הֶם֙ בַּ/מִּדְבָּ֔ר בְּ/חוּקֵּ֤י אֲבֽוֹתֵי/כֶם֙ אַל תֵּלֵ֔כוּ וְ/אֶת מִשְׁפְּטֵי/הֶ֖ם אַל תִּשְׁמֹ֑רוּ וּ/בְ/גִלּוּלֵי/הֶ֖ם אַל תִּטַּמָּֽאוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/018.yaml
  text: And I said to their children in the wilderness[a], ‘Do not walk in the statutes of your fathers, and do not keep their judgments, and do not defile yourselves with their idols.’
translation:
  language: zh_hans
  text: 我在旷野对他们的儿女说：“不要遵行你们父辈的律例，不要谨守他们的典章，也不要因他们的偶像[a]玷污自己。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“偶像”一词带有强烈的鄙弃意味，也可译作“污秽的偶像”，甚至“粪像”。
    reason: 保留גִּלּוּלִים在普通“偶像”之外的强烈贬义。
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我……说
  rationale: 该叙事形式承接上文，表示随后发生的言说；中文语境无需机械补出“于是”或“并且”。
- source_word: בְּנֵיהֶם
  choice: 他们的儿女
  rationale: בנים在此指上一代以色列人的下一代，不必限定为男性；“儿女”自然表达群体性的后代。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר在出埃及传统的语境中指旷野地带；“旷野”是准确且庄重的常用译法。
- source_word: בְּחֻקֵּי
  choice: 遵行……律例
  rationale: חֻקִּים指规定下来的律例；将希伯来语“行在……中”的习语译为“遵行”，符合现代汉语，同时保留行为方式的含义。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们父辈
  rationale: 该词在此指听众的上一代；“父辈”既保留原文的阳性祖辈用语，也比笼统的“祖先”更清楚地表达代际对比。
- source_word: מִשְׁפְּטֵיהֶם
  choice: 他们的典章
  rationale: מִשְׁפָּטִים在这里具有规范、法令之意；“典章”与前面的“律例”保持词汇区分。
- source_word: תִּשְׁמֹרוּ
  choice: 谨守
  rationale: שׁמר用于法令时表示留意并遵守；“谨守”简洁地传达这种 covenantal/legal 的认真遵行语气。
- source_word: גִּלּוּלֵיהֶם
  choice: 他们的偶像
  rationale: גִּלּוּלִים指偶像，并带强烈蔑称色彩。正文采用清楚自然的“偶像”，其贬斥意味在脚注中说明。
- source_word: תִּטַּמָּאוּ
  choice: 玷污自己
  rationale: 该反身形式表示使自己陷入污秽；“玷污自己”同时容纳礼仪与道德污秽的语义，不将两者强行拆开。
theological_decisions:
- issue: אֲבוֹתֵיכֶם的代际与性别表达
  choice: 你们父辈
  alternative: 你们祖先
  rationale: 原文为阳性复数，并在上下文中特指上一代。“父辈”保留这一形式和代际对照，又不额外引入教派性解释。
- issue: גִּלּוּלִים的贬斥力度
  choice: 正文译“偶像”，脚注交代强烈蔑称色彩
  alternative: 污秽的偶像／粪像
  rationale: 直用高度贬斥的复合词可能使现代中文正文显得生硬或过度解释；脚注可保留原词真实而强烈的鄙弃语气。
- issue: 偶像所导致的污秽性质
  choice: 玷污自己
  alternative: 使自己成为不洁／沾染污秽
  rationale: 原文可同时触及礼仪性和道德性的污秽；“玷污自己”保留这种张力，不把含义限制在单一神学范畴。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“遵行……律例／谨守……典章”保留原文两个法律术语的区分；脚注标记置于其实际所解释的“偶像”之后。
