  to: 况且，我亲自把不好的律例和他们不能借以存活的典章给了他们。[a][b]
  rationale: 以“给了”取代“赐给了”，避免加入原文未明说的恩惠性语义；以“他们不能借以存活的典章”恢复原文中人的主语及“借着／凭着”的关系。脚注a保留解释性替代读法而不将其写入正文；脚注b补足利未记18:5的“律例和典章”对应语汇。
