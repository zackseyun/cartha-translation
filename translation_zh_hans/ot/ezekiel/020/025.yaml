  text: וְ/גַם אֲנִי֙ נָתַ֣תִּי לָ/הֶ֔ם חֻקִּ֖ים לֹ֣א טוֹבִ֑ים וּ/מִ֨שְׁפָּטִ֔ים לֹ֥א יִֽחְי֖וּ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/025.yaml
  text: Moreover[b][a], I myself gave them statutes that were not good and ordinances by which they could not live.
translation:
  language: zh_hans
  text: 况且，我亲自把不好的律例和他们不能借以存活的典章给了他们。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可按解释译作：“我把他们交给了不好的律例。”这种理解强调这是审判性的任凭，而不是说上帝颁布了道德上有缺陷的律法。
    reason: alternative_reading
  - marker: b
    text: “借以存活”呼应盟约中的说法：人若遵行上帝的律例和典章，便可借此存活（参利未记18:5）；这里却刻意反转了这一说法。
    reason: cross_reference
lexical_decisions:
- source_word: וְגַם
  choice: 况且
  rationale: 兼顾附加与强调作用，并自然承接上文；比生硬的“并且也”更符合现代汉语。
- source_word: אֲנִי
  choice: 我也
  rationale: 希伯来语独立代词带有强调；与前面的 וְגַם 合译为“我也”，在汉语中自然保留强调和对照。
- source_word: נָתַתִּי
  choice: 赐给了
  rationale: 保留 נתן 的基本义“给”，不在正文中改译为“任凭”或“交付”，从而不预先消解经文的神学张力。
- source_word: חֻקִּים לֹא טוֹבִים
  choice: 不好的律例
  rationale: “律例”符合盟约与法律语域；“不好”直接对应否定表达 לֹא טוֹבִים，避免加强为“邪恶”。
- source_word: וּמִשְׁפָּטִים
  choice: 典章
  rationale: “典章”是庄重而可懂的法律用语，并可与“律例”形成传统且清楚的搭配。
- source_word: לֹא יִחְיוּ בָּהֶם
  choice: 不能使他们借以存活
  rationale: 保留 ב 的凭借意义和“遵行而得生”的盟约表达，同时以“不能”体现此处否定所表达的结果或无能为力；“存活”比单独的“活”更自然。
theological_decisions:
- issue: 上帝“赐给”不好的律例是否应在正文中弱化为许可或任凭
  choice: 正文直译为“我也把不好的律例……赐给了他们”
  alternative: “我任凭他们遵从不好的律例”或“我把他们交给不好的律例”
  rationale: 原文明确以 נתן（给、赐给）为谓语，以上帝为主语。正文保留直接措辞，不以解释性译法消除张力；司法性“任凭”的理解列入脚注。
- issue: 本节与圣经其他地方所说上帝律法良善之间的张力
  choice: 正文直接保留“不好的”
  alternative: 将其解释为外邦或偶像崇拜的律例，或说明为审判性地交付于有害习俗
  rationale: 本节本身用鲜明措辞制造张力。翻译不应把某种协调解释写入正文，而应让脚注提供可能理解。
- issue: “借以存活”的盟约背景
  choice: 保留“借以存活”的反转表达
  alternative: 概括为“有害的典章”
  rationale: 原文呼应利未记18:5中遵行律例便可“借此存活”的表达，此处刻意加以否定；保留这一结构有助于呈现经文间的联系。
translation_notes:
  register: 采用现代、庄重且普通读者可理解的汉语。“律例／典章”保留法律与盟约语域；正文不将“赐给”解释性改写为“任凭”，以保存原文真实的神学张力。脚注标记均在正文出现。
