source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֨/י בֵֽית יִשְׂרָאֵ֜ל בַּ/מִּדְבָּ֗ר בְּ/חֻקּוֹתַ֨/י לֹא הָלָ֜כוּ וְ/אֶת מִשְׁפָּטַ֣/י מָאָ֗סוּ אֲשֶׁר֩ יַעֲשֶׂ֨ה אֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם וְ/אֶת שַׁבְּתֹתַ֖/י חִלְּל֣וּ מְאֹ֑ד וָ/אֹמַ֞ר לִ/שְׁפֹּ֨ךְ חֲמָתִ֧/י עֲלֵי/הֶ֛ם בַּ/מִּדְבָּ֖ר לְ/כַלּוֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/013.yaml
  text: But the house of Israel rebelled against me in the wilderness[a]. They did not walk in my statutes, and they rejected my judgments, which if a person does them, he will live by them. They greatly profaned my Sabbaths. Then I said I would pour out my wrath on them in the wilderness[c][b], to put an end to them.
translation:
  language: zh_hans
  text: 可是，以色列家在旷野背叛了我；他们不遵行我的律例，弃绝了我的典章。人若遵行这些，就必因此活着。[a]他们又大大亵渎了我的安息日。于是我说，我要在旷野向他们倾倒我的烈怒，把他们灭尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的说法呼应《利未记》18:5。“人”是泛指，意思是任何遵行这些律例典章的人。
    reason: cross_reference_and_lexical_clarification
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: 背叛了我
  rationale: מרה与介词ב连用，表示以悖逆、反抗敌对上帝；“背叛了我”自然且保留盟约语境中的严重性。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中的集体称谓和“家”的整体性，不简化为“以色列人”。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是מִדְבָּר在出埃及传统语境中的常用译法，也保留以色列受考验的历史背景。
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: 不遵行我的律例
  rationale: 希伯来文直译为“不行在我的律例中”；汉语用“遵行”自然表达行为和生活方式，同时保留盟约顺服的含义。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּטִים可指判例、法令或规章；“典章”与“律例”搭配自然，并保留法律—盟约色彩。
- source_word: מָאָסוּ
  choice: 弃绝了
  rationale: 表达主动拒斥而非仅仅忽视，也不过度强化为纯粹情绪性的蔑视。
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם וָחַי בָּהֶם
  choice: 人若遵行这些，就必因此活着
  rationale: “人”自然表达הָאָדָם的泛指单数；“因此活着”保留בָּהֶם所表达的凭借或关联，同时不把“活着”的性质限定为某一种神学解释。
- source_word: שַׁבְּתֹתַי
  choice: 我的安息日
  rationale: 汉语“安息日”作为类别名称无需机械添加复数标记，语境仍可涵盖多个安息日。
- source_word: חִלֵּלוּ מְאֹד
  choice: 大大亵渎了
  rationale: חלל的Piel词形表示使之成为俗污、亵渎；“大大”对应מְאֹד的强调。
- source_word: לִשְׁפֹּךְ חֲמָתִי
  choice: 倾倒我的烈怒
  rationale: 保留“倾倒”这一鲜明隐喻；“烈怒”传达חֵמָה的强烈审判意味。
- source_word: לְכַלּוֹתָם
  choice: 把他们灭尽
  rationale: כלה在此表示彻底终结或消灭；“灭尽”准确保留其强度。
theological_decisions:
- issue: הָאָדָם在生命公式中的泛指单数
  choice: 人若遵行这些，就必因此活着
  alternative: 谁遵行这些，谁就必因此活着；一个人若遵行这些，他就必因此活着
  rationale: 希伯来文使用带冠词的单数אָדָם，具有代表全人类的泛指作用。现代汉语用“人”既保留单数概括性，也避免无依据地限定为男性。
- issue: וָחַי בָּהֶם所指的“活”及ב的关系
  choice: 就必因此活着
  alternative: 就必靠这些活着；就必在这些事上存活
  rationale: 原文可表达因遵行这些而得以活着，且呼应利未记18:5。译文保留生命应许及其盟约张力，不把“活”窄化为今世长寿、属灵生命或永生中的任何单一解释。
- issue: 对以色列安息日的亵渎
  choice: 他们又大大亵渎了我的安息日
  alternative: 他们彻底污辱了我的安息日
  rationale: “我的安息日”保留上帝所有和盟约记号的意味；“亵渎”准确呈现圣俗范畴，不额外引入特定宗派的安息日教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“律例／典章”保留先知书的盟约法律语域；“倾倒我的烈怒”“灭尽”保留原文审判意象和力度。脚注标记置于所解释的生命公式之后。
