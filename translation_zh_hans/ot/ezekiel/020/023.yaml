base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/023.yaml
  text: Moreover[a], I also raised my hand to them in the wilderness, to scatter them among the nations and disperse them through the lands.
translation:
  language: zh_hans
  text: 我也在旷野向他们举手起誓[a]：要把他们驱散到列国中，使他们分散在各地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“向他们举手”；这是起誓的惯用表达。
    reason: 说明希伯来语惯用语的字面形式及其含义。
lexical_decisions:
- source_word: גַּם
  choice: 也
  rationale: 承接上下文，表示这是另一次附加的郑重宣告；现代汉语用“也”自然简洁。
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: 举手起誓
  rationale: 既保留希伯来语“举手”的具体形象，也明确表达该惯用语在本处的起誓含义，避免现代读者误解。
- source_word: לָהֶם
  choice: 向他们
  rationale: 介词指明起誓所面对的对象，“向他们”符合现代汉语搭配。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是以色列历史叙事中自然且庄重的常用表达。
- source_word: לְהָפִיץ
  choice: 驱散
  rationale: 使役形式表达使其散开；“驱散”也体现本节审判行动的力度。
- source_word: בַּגּוֹיִם
  choice: 到列国中
  rationale: “列国”准确表达以色列以外的众民族，不引入后期宗教术语。
- source_word: וּלְזָרוֹת
  choice: 使他们分散
  rationale: 与前一动词构成近义平行，同时用不同措辞保留两个希伯来动词之间的区别。
- source_word: בָּאֲרָצוֹת
  choice: 在各地
  rationale: 体现原文复数“诸地”，并以自然现代汉语表达散布于多个地域。
theological_decisions:
- issue: 是否将举手的誓言惯用语仅按字面翻译，或明确译出起誓含义
  choice: 正文译为“举手起誓”
  alternative: “举手”；或“起誓”
  rationale: 原文的动作形象与誓言含义在此同时重要。“举手起誓”兼顾形式和功能；脚注说明原文直译，以保持文本透明度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列国”“旷野”保留圣经历史语境；冒号自然引出誓言的内容。
