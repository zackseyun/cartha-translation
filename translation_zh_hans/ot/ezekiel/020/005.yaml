source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/יוֹם֙ בָּחֳרִ֣/י בְ/יִשְׂרָאֵ֔ל וָ/אֶשָּׂ֣א יָדִ֗/י לְ/זֶ֨רַע֙ בֵּ֣ית יַֽעֲקֹ֔ב וָ/אִוָּדַ֥ע לָ/הֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אֶשָּׂ֨א יָדִ֤/י לָ/הֶם֙ לֵ/אמֹ֔ר אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/005.yaml
  text: 'And say to them[a], ‘Thus says the Lord GOD: On the day when I chose Israel, I lifted up my hand to the offspring of the house of Jacob and made myself known to them in the land of Egypt; I lifted up my hand to them, saying, “I am Yahweh your God.”’'
translation:
  language: zh_hans
  text: 你要对他们说：‘主雅威如此说：我拣选以色列的那日，曾向雅各家的后裔举起我的手[a]，并在埃及地让他们认识我；我向他们举起我的手，说：“我是雅威——你们的上帝。”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举起我的手”是希伯来语惯用语，在这里表示起誓或作出郑重承诺；本节后面同样的说法也是如此。
    reason: 说明保留在正文中的希伯来语誓言惯用语，并涵盖本节两次出现的相同表达。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: 保留复合神圣称号的两个成分：אֲדֹנָי译作“主”，יהוה按专名译作“雅威”，避免把二者合并为一个称谓。
- source_word: בְּיוֹם בָּחֳרִי בְיִשְׂרָאֵל
  choice: 我拣选以色列的那日
  rationale: 保留בְּיוֹם的时间表达和בחר的拣选含义，同时不额外引入后来的系统神学解释。
- source_word: וָאֶשָּׂא יָדִי
  choice: 我……举起手来
  rationale: 正文保留希伯来语具体意象；该动作在本语境中具有起誓或郑重承诺的惯用含义，置于脚注说明。
- source_word: לְזֶרַע בֵּית יַעֲקֹב
  choice: 向雅各家的后裔
  rationale: זֶרַע在此表示血脉相承的人群；“后裔”是现代汉语中自然且准确的表达，“雅各家”则保留原文家族—民族称谓。
- source_word: וָאִוָּדַע לָהֶם
  choice: 让他们认识我
  rationale: 该词形在此表达上帝主动使自己被他们认识；这一译法比单纯“他们认识我”更能体现神的自我显明，同时保持自然汉语。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留原文明确出现的אֶרֶץ“地”，并维持叙事的地理背景。
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: 我是雅威，是你们的上帝
  rationale: 清楚呈现יהוה这一名字及其与“你们的上帝”的同位关系，符合现代汉语表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名；音译“雅威”保留其作为专名的性质，不把它改写为普通称号。
- issue: 是否把וָאֶשָּׂא יָדִי直接意译为起誓
  choice: 正文保留“举起手来”，脚注说明起誓含义
  alternative: 我起誓；我郑重承诺
  rationale: 该短语确有起誓的惯用作用，但保留其具体意象能使译文更可核查，也避免正文替原文消除意象与功能之间的张力。
- issue: וָאִוָּדַע לָהֶם所表达的自我显明
  choice: 让他们认识我
  alternative: 向他们显现；为他们所认识
  rationale: 译文体现行动出于上帝主动的自我启示，同时不把“认识”限缩为可见的显现。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“主雅威如此说”保留先知宣告的正式语气；“举起手来”保留原文意象，并以脚注帮助普通读者理解其誓言功能。
