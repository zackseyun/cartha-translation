base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/029.yaml
  text: Then I said to them, ‘What is this high place where you are going?’ So its name is called Bamah to this day.
translation:
  language: zh_hans
  text: 我对他们说：“你们所去的那丘坛是什么？”于是，那地方直到今日仍叫作“巴玛”。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴玛”音译自希伯来语，和前面的“丘坛”是同一个词。
    reason: 原文以同一词兼作普通名词和名称，中文无法在正文中同时保留其含义与同音关系。
lexical_decisions:
- source_word: הַבָּמָה
  choice: 丘坛
  rationale: במה在本段语境中指设在高处或高地的祭祀场所；“丘坛”既保留“高处”的意象，也明确其宗教用途。
- source_word: הַבָּאִים שָׁם
  choice: 你们去的那地方
  rationale: 按希伯来语直译为“你们正去那里的”；中文用地点化表达更自然，同时不额外说明他们前往的目的。
- source_word: בָּמָה
  choice: 巴玛
  rationale: 末句把该词当作地名使用，采用音译以保留原文在普通名词“丘坛”和名称“巴玛”之间的文字关联。
- source_word: וַיִּקָּרֵא שְׁמָהּ
  choice: 那地方名叫
  rationale: 这是希伯来语常见的命名表达；采用自然中文，不强行保留被动句式。
theological_decisions:
- issue: “丘坛”与“巴玛”之间的双关
  choice: 正文分别译为“丘坛”和音译“巴玛”，并以脚注说明二者对应同一希伯来词
  alternative: 两处都译作“丘坛”，或两处都音译为“巴玛”
  rationale: 这样既让读者明白先知所问的是祭祀场所，又保留该词后来成为地名所形成的讽刺性命名。
- issue: מָה הַבָּמָה疑问句的语气
  choice: 译为“究竟是什么丘坛？”
  alternative: 译为“这丘坛是什么？”或把“מה”解释成地名词源
  rationale: 原句可能带有修辞性责问，也可能涉及词语游戏；“究竟”传达责问语气，但不替原文补出具体神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“丘坛”是较为凝练的经文用语，脚注帮助普通读者理解末句的希伯来语文字关联。
