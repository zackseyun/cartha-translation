  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הַ/בְּ/דֶ֥רֶךְ אֲבֽוֹתֵי/כֶ֖ם אַתֶּ֣ם נִטְמְאִ֑ים וְ/אַחֲרֵ֥י שִׁקּוּצֵי/הֶ֖ם אַתֶּ֥ם זֹנִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/030.yaml
  text: 'Therefore say to the house of Israel[a], Thus says the Lord Yahweh: Are you defiling yourselves in the way of your fathers[b], and whoring after their detestable things?'
translation:
  language: zh_hans
  text: 所以，你要对以色列家说：主耶和华如此说：你们在你们祖先的道路上玷污自己，又随从他们可憎之物[a]行淫吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎之物”也可译为“可憎之事”或“憎恶之物”；在此处的语境中可指偶像。
    reason: 说明 שִׁקּוּצִים 的词义范围及其在本节偶像崇拜语境中的可能所指，而不在正文中将其限定为“偶像”。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的指控并引出结论，符合现代汉语先知宣告的语气。
- source_word: אֱמֹר אֶל־בֵּית יִשְׂרָאֵל
  choice: 你要对以色列家说
  rationale: 保留命令语气和“以色列家”这一群体性、盟约性的称谓。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知使者公式，并以“耶和华”呈现四字神名；“主耶和华”也避免把两个神圣称号合并。
- source_word: הַבְּדֶרֶךְ אֲבוֹתֵיכֶם
  choice: 照着祖先所行的
  rationale: דרך在此指行为方式或生活道路；此译自然表达效法祖先行为模式的含义。
- source_word: אַתֶּם נִטְמְאִים
  choice: 你们还要……玷污自己吗
  rationale: Nifal分词在疑问语境中表示正在延续的自取污秽；“玷污自己”保留礼仪及道德污秽的双重可能。“还要”体现上下文责问语气，但不改变命题内容。
- source_word: וְאַחֲרֵי שִׁקּוּצֵיהֶם
  choice: 追随他们可憎之物
  rationale: “追随”表达אַחֲרֵי的跟从、追逐意味；“可憎之物”保留词义范围，不直接窄化为偶像。
- source_word: אַתֶּם זֹנִים
  choice: 行淫
  rationale: 保留先知文学以性不忠比喻拜偶像和背约的强烈措辞，避免弱化为一般的“不忠”。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文同时出现“主”和四字神名；“主耶和华”在中文中可清楚保留两者，并呈现盟约之名。
- issue: זנה 的先知性隐喻
  choice: 行淫
  alternative: 不忠／卖淫
  rationale: 本节以性方面的不忠指向以色列追随可憎之物的属灵背叛；“行淫”既保留隐喻力度，也不额外规定其为职业性卖淫。
- issue: שִׁקּוּצִים 的具体所指
  choice: 可憎之物
  alternative: 偶像
  rationale: 上下文强烈指向偶像崇拜，但该词本身范围较宽；正文保留概括表达，脚注说明语境中的可能特指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们还要……吗”传达原文疑问句的责问力度；保留“以色列家”“主耶和华如此说”等先知书惯用表达。
