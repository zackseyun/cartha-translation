base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/032.yaml
  text: What is coming up in your mind will certainly not happen—that you say[a], ‘We will be like the nations, like the clans of the lands[d][c][b], serving wood and stone.’
translation:
  language: zh_hans
  text: 你们所说“我们要像列国，像各地的宗族一样，服事木头和石头”[b]的这种念头，绝不会实现[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绝不会实现”也可译作“决不会成就”；希伯来文用不定式绝对形加强否定语气。
    reason: lexical_alternative
  - marker: b
    text: “服事木头和石头”指服事或敬拜木石所造的偶像。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָעֹלָה עַל רוּחֲכֶם
  choice: 你们心里所起的念头
  rationale: 此处“上到/临到你们的רוּחַ”是指内心产生的想法或意图。“心里所起的念头”既自然表达希伯来语习语，也保留“兴起”的意象；不把רוּחַ专门解释为人的“灵”。
- source_word: הָיוֹ לֹא תִהְיֶה
  choice: 绝不会实现
  rationale: 不定式绝对形与限定动词连用，加强否定语气；“绝不会实现”体现强烈断言，并与前面的“念头”自然衔接。
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: 就是你们所说的
  rationale: 引出以色列人所表达之意图的具体内容，中文衔接清楚自然。
- source_word: נִהְיֶה
  choice: 我们要像
  rationale: 第一人称复数未完成式在此表达意愿或打算；“要”保留未来取向，也自然传达他们的意图。
- source_word: כַגּוֹיִם
  choice: 像列国
  rationale: גּוֹיִם在此指周围各国；“列国”庄重且符合先知书语域，又不引入后期“外邦人”的特定色彩。
- source_word: כְּמִשְׁפְּחוֹת הָאֲרָצוֹת
  choice: 像各地的宗族一样
  rationale: מִשְׁפָּחוֹת指亲族或宗族群体，הָאֲרָצוֹת为复数“各地/各国之地”；此译避免把它缩小为现代核心家庭。
- source_word: לְשָׁרֵת
  choice: 服事
  rationale: 该词基本义为“服事、侍奉”；上下文具有宗教敬拜含义，但正文保留较直接的词义，不把解释完全并入翻译。
- source_word: עֵץ וָאָבֶן
  choice: 木头和石头
  rationale: 直译物质名称，保留先知话语将偶像揭露为普通材料的讽刺与批判力度。
theological_decisions:
- issue: 对木头和石头的宗教性服事
  choice: 服事木头和石头
  alternative: 敬拜木头和石头；服事木石偶像
  rationale: 希伯来动词本义是“服事”，语境明确涉及偶像崇拜。正文保留原文用词及其张力，脚注说明所指，而不直接增添原文没有的“偶像”。
- issue: רוּחַ所指的内在官能
  choice: 心里
  alternative: 灵里；心思中
  rationale: 这里的רוּחַ处于表达念头或意图兴起的习语中，并非要界定“灵”的神学或人论意义；“心里”在现代汉语中准确而自然。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留先知话语的断然否定和引语结构；“列国”“宗族”“服事”维持经文语域，但避免生僻古奥。所有脚注标记均置于正文相关句末。
