source:
  edition: WLC
  text: בֶּן אָדָ֗ם דַּבֵּ֞ר אֶת זִקְנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/לִ/דְרֹ֥שׁ אֹתִ֖/י אַתֶּ֣ם בָּאִ֑ים חַי אָ֨נִי֙ אִם אִדָּרֵ֣שׁ לָ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/003.yaml
  text: 'Son of man[a], speak to the elders of Israel and say to them, Thus says the Lord GOD: Is it to inquire of me that you have come? As I live, I will not be inquired of by you[b], declares the Lord GOD.'
translation:
  language: zh_hans
  text: “人子啊，你要对以色列的长老说：‘主耶和华如此说：你们来，是要向我求问[a]吗？我凭自己的生命起誓，绝不容你们向我求问[b]。’这是主耶和华的宣告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求问”也可译作“求取指示”。这里的动词可指向上帝寻求神谕或裁决。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为：“我活着，若我受你们求问……”这是誓言格式，以未说出的后果表达强烈否定，意思是“我绝不容你们向我求问”。
    reason: source_form_and_idiom
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝称呼先知的固定希伯来表达；“人子”庄重、简明，也能体现人与上帝之间的区别。
- source_word: דַּבֵּר אֶת זִקְנֵי יִשְׂרָאֵל
  choice: 对以色列的长老说
  rationale: 自然表达命令语气，并将“以色列的长老”作为一个公认的领袖群体。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知传信公式“如此说”，并以“主耶和华”分别体现 אֲדֹנָי 的主权称号和 יהוה 的专名。
- source_word: הֲלִדְרֹשׁ אֹתִי אַתֶּם בָּאִים
  choice: 你们来，是要向我求问吗
  rationale: דרשׁ 在此指向上帝寻求指示或神谕，而非泛指敬虔地寻求；这一译法也自然传达来访目的。
- source_word: חַי אָנִי
  choice: 我凭我的永生起誓
  rationale: 将希伯来语直译为“我活着”会使现代汉语读者难以辨认其功能；此处明确表达庄严的神圣起誓公式。
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: 绝不容你们向我求问
  rationale: 誓言之后的 אִם 表示强烈否定；“绝不容”既传达否定力度，也以自然汉语反映 Niphal 形式所表达的上帝拒绝成为他们求问对象。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: 体现 נְאֻם 作为权威性先知宣告公式的功能，并与前面的传信公式有所区别。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”在现代中文圣经语境中可辨识度高，同时保留“主”这一称号与四字神名之间的区别；不将两者合并为单一泛称。
- issue: 誓言加 אִם 结构的语气
  choice: 我凭我的永生起誓，绝不容你们向我求问
  alternative: 我凭我的永生起誓，我岂会让你们求问我呢
  rationale: 该结构不是开放式条件句，而是誓言中的强烈否定。直陈式否定最清楚地传达原文力度，同时脚注保留其字面形式。
- issue: 上帝拒绝“受求问”的含义范围
  choice: 绝不容你们向我求问
  alternative: 绝不回答你们的求问
  rationale: 原文强调上帝拒绝成为他们求问的对象，不只说明他不作回答；因此避免把含义缩窄为单纯的“不回答”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人子啊”“如此说”“宣告”保留先知文体；“我凭我的永生起誓”和“绝不容”则使古代希伯来誓言的功能对普通读者清楚可懂。
