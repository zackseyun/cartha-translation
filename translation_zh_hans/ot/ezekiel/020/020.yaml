  text: וְ/אֶת שַׁבְּתוֹתַ֖/י קַדֵּ֑שׁוּ וְ/הָי֤וּ לְ/אוֹת֙ בֵּינִ֣/י וּ/בֵֽינֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/020.yaml
  text: Keep my Sabbaths holy[a], and let them be a sign between me and you, so that you may know that I am Yahweh your God.
translation:
  language: zh_hans
  text: 要尊我的安息日为圣；它们要作我与你们之间的记号，使你们知道，我是耶和华[a]你们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”译自希伯来文神名 יהוה（YHWH）；其古代确切读音不能完全确定，也常音译为“雅威”。
    reason: 说明神名的原文形式及音译选择，同时保留读音上的不确定性。
lexical_decisions:
- source_word: שַׁבְּתוֹתַי
  choice: 我的安息日
  rationale: 原文是带第一人称单数词尾的复数，指一再临到的安息日。现代汉语通常以“安息日”表达这一制度及其反复出现；后文用复数代词“它们”保留原文的复数意味。
- source_word: קַדֵּשׁוּ
  choice: 尊……为圣
  rationale: piel命令式要求以神圣的方式看待并持守这些安息日。“尊……为圣”既保留“分别为圣”的含义，也比“使……成圣”更自然，且不暗示人赋予安息日本来没有的圣洁。
- source_word: וְהָיוּ לְאוֹת
  choice: 它们要作……记号
  rationale: 承接前面的命令，可表达所要求或预期的结果。“作……记号”自然地传达 אוֹת 的标志、凭据之意。
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: 我与你们之间
  rationale: 忠实表达立约关系中的双方；原文“你们”为复数。
- source_word: לָדַעַת
  choice: 使你们知道
  rationale: 带 ל 的不定式在此表示目的或结果；“使你们知道”清楚呈现安息日作为记号的作用。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 虽为复数形态，此处以单数指以色列的神；第二人称复数词尾表达他与群体的立约关系。
theological_decisions:
- issue: 如何翻译神名 יהוה
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文采用汉语中广为人知的专名“耶和华”，既与称号“主”有别，也在脚注中说明其希伯来文形式，避免把对具体读音的判断说得过满。
- issue: 安息日作为“记号”的功能
  choice: 使你们知道
  alternative: 为要知道
  rationale: 将 לָדַעַת 理解为目的或结果，保留安息日作为立约记号、使百姓认识神与他们关系的功能；不进一步规定这种“知道”仅是认知还是包含关系性的承认。
- issue: 命令之后 וְהָיוּ 的语气
  choice: 它们要作
  alternative: 让它们作；它们必作
  rationale: 该形式既可看作命令后的劝令性延续，也可陈述相应结果。“要作”在汉语中保留规范性和预期结果之间的张力，不将其单纯处理成许可或无条件预言。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“尊……为圣”体现命令语气；分号呈现原文两个相连分句。“你们”保留原文复数对象，“它们”则明确回指反复出现的安息日。
