source:
  edition: WLC
  text: וּ/בִ/שְׂאֵ֣ת מַתְּנֹֽתֵי/כֶ֡ם בְּֽ/הַעֲבִיר֩ בְּנֵי/כֶ֨ם בָּ/אֵ֜שׁ אַתֶּם֩ נִטְמְאִ֤֨ים לְ/כָל גִּלּֽוּלֵי/כֶם֙ עַד הַ/יּ֔וֹם וַ/אֲנִ֛י אִדָּרֵ֥שׁ לָ/כֶ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם אִדָּרֵ֖שׁ לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/031.yaml
  text: And when you present your gifts[a], when you make your sons pass through the fire, you defile yourselves with all your idols to this day. And shall I be inquired of by you, O house of Israel? As I live, declares the Lord GOD[c][b], I will not be inquired of by you.
translation:
  language: zh_hans
  text: 当你们献上礼物[a]，使你们的儿子经火[b]时，你们因一切偶像玷污自己，直到今日。以色列家啊，我还会让你们来求问我吗？主耶和华说：“我指着我的永生起誓，我绝不让你们来求问我[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”也可译作“供物”。这里指祭祀语境中的呈献之物。
    reason: lexical_alternative
  - marker: b
    text: “使儿子经火”是与偶像崇拜有关的献童祭说法。正文保留希伯来文的表达，没有进一步说明仪式的具体方式。
    reason: cultural_note
  - marker: c
    text: 希伯来文在誓言中直译为“如果我让你们求问我……”，省略了违誓的后果；这种结构表示强烈否定，即“我绝不让你们来求问我”。
    reason: source_idiom
lexical_decisions:
- source_word: וּבִשְׂאֵת מַתְּנֹתֵיכֶם
  choice: 你们献上礼物
  rationale: נשׂא 与“礼物”连用，在祭祀语境中指呈献；“礼物”直接对应 מַתְּנוֹת，同时以脚注保留“供物”这一祭祀性译法。
- source_word: בְּהַעֲבִיר בְּנֵיכֶם בָּאֵשׁ
  choice: 使自己的儿子经火
  rationale: 保留希伯来文“使……经过火”的表达及 בנים 的阳性复数“儿子”，不在正文中进一步断定仪式的具体方式；脚注说明其献童祭背景。
- source_word: אַתֶּם נִטְמְאִים
  choice: 玷污自己
  rationale: 该 Niphal 形式表示陷入污秽或被玷污；上下文强调他们因自身行为招致污秽，汉语反身表达兼顾结果与责任。
- source_word: לְכָל גִּלּוּלֵיכֶם
  choice: 因你们所有的偶像
  rationale: גִּלּוּלִים 是以西结书中带强烈贬义的偶像称呼；“因”自然表达这些偶像及相关行为是玷污的缘由。
- source_word: וַאֲנִי אִדָּרֵשׁ לָכֶם
  choice: 我岂会让你们求问我呢
  rationale: דרשׁ 的 Niphal 在求问神谕的语境中指“被求问、受咨询”；用反问表达原文紧接否定誓言的修辞力量。
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 将希伯来语直译为“我活着”的神圣誓言公式转为清楚而庄重的现代汉语，同时保留以神自身生命起誓的含义。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华说
  rationale: נְאֻם 译作“说”符合先知宣告公式；אֲדֹנָי 译“主”，四字神名 יְהוִה 译作现代中文圣经传统中通行的“耶和华”。
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: 我绝不让你们求问我
  rationale: 誓言后的 אִם 是省略式誓言否定，并非普通条件句；“绝不”准确传达其强烈否定语力。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文明确保留四字神名，而非以“上主”代替；采用简体中文读者较熟悉且庄重的“耶和华”。“雅威”是可能的音译，但不影响本节神名所指。
- issue: בְּנֵיכֶם 的性别表达
  choice: 你们自己的儿子
  alternative: 你们的孩子
  rationale: 原文明确使用阳性复数“儿子”，正文不将其泛化为“孩子”。
- issue: 末尾 אִם 誓言结构的语力
  choice: 我绝不让你们求问我
  alternative: 如果我让你们求问我
  rationale: 原文以未明说的咒诅后果构成强烈否定；直译成条件句会使现代读者误解。译出否定语力，不补入原文省略的咒诅内容。
- issue: “经火”是否直接译为焚烧献祭
  choice: 正文保留“经火”，脚注说明献童祭
  alternative: 把你们的儿子烧在火中
  rationale: “使……经火”确与偶像崇拜中的献童祭有关，但原句本身采用固定表达。保留其措辞可避免对仪式机制做超过原文的具体化，同时不借脚注淡化其严重性。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“以色列家啊”保留直接呼告；问句与誓言的递进关系清楚。避免使用过度文言的“岂容”“断不”等措辞，也不把“经火”在正文中解释性改写为某一种具体焚献方式。
