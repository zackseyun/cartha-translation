source:
  edition: WLC
  text: וַ/יַּמְרוּ בִ֣/י הַ/בָּנִ֗ים בְּ/חֻקּוֹתַ֣/י לֹֽא הָ֠לָכוּ וְ/אֶת מִשְׁפָּטַ֨/י לֹא שָׁמְר֜וּ לַ/עֲשׂ֣וֹת אוֹתָ֗/ם אֲשֶׁר֩ יַעֲשֶׂ֨ה אוֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֥וֹת אַפִּ֛/י בָּ֖/ם בַּ/מִּדְבָּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/021.yaml
  text: But the children rebelled against me[a]. They did not walk in my statutes, and they did not keep my judgments so as to do them—the judgments that, if a man does them, he will live by them. They profaned my Sabbaths. So I said I would pour out my wrath on them[b], to spend my anger against them in the wilderness.
translation:
  language: zh_hans
  text: 可是，儿女背叛了我。他们不遵行我的律例，也不谨守、实行我的典章；人[a]若实行这些典章，就必因这些典章而活[b]。他们亵渎了我的安息日。于是我说，我要在旷野把我的烈怒倾倒在他们身上，在他们身上发尽我的怒气。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用单数“人”作泛指，意思是任何人，并非只指男性。
    reason: lexical_alternative
  - marker: b
    text: 这句话呼应《利未记》18:5。
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: 背叛了我
  rationale: מָרָה与介词ב连用，表示以神为对象的悖逆；“背叛”保留其盟约与权柄层面的力度，不弱化为一般的“不听从”。
- source_word: הַבָּנִים
  choice: 子孙
  rationale: 字面为“儿子们”，但上下文指以色列的下一代；“子孙”自然表达世代对比，也不限定为男性。
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: 不遵行我的律例
  rationale: “行走于”在希伯来语中是生活与顺服的惯用表达；现代汉语用“遵行”传达其实际含义，同时保留律例用语。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּטִים在此指神所颁布的法令和规范；“典章”庄重、清楚，并适合本段的律法语境。
- source_word: לֹא שָׁמְרוּ לַעֲשׂוֹת אוֹתָם
  choice: 不谨守、实行
  rationale: שׁמר加עשׂה不定式兼有谨守和付诸实行之意；并列两动词避免把原文压缩成单纯的“遵守”。
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם וָחַי בָּהֶם
  choice: 人若实行这些典章，就必因它们而活
  rationale: 条件句式自然呈现关系从句的含义；“因它们而活”保留ב的凭借或关联意味，也保留原文关于遵行与生命之间关系的神学张力。
- source_word: אֶת שַׁבְּתוֹתַי חִלֵּלוּ
  choice: 他们亵渎了我的安息日
  rationale: חִלֵּל的强意形表示使圣物成为俗物、予以亵渎；“亵渎”准确保留圣与俗的对照。
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: 把我的烈怒倾倒在他们身上
  rationale: 保留原文“倾倒”的形象；“烈怒”体现חֵמָה所含的炽烈怒气。
- source_word: לְכַלּוֹת אַפִּי בָּם
  choice: 在他们身上发尽我的怒气
  rationale: כּלה与אַף搭配，表示使怒气充分发作或达到尽头；“发尽”既自然又保留其完全施行审判的力度。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”符合出埃及叙事背景，也是מִדְבָּר在此语境中的常用准确译法。
theological_decisions:
- issue: הָאָדָם在“因它们而活”句中的泛指用法
  choice: 人
  alternative: 一个人；世人
  rationale: 希伯来语带冠词的单数名词在此泛指任何人，并非专指男性；现代汉语“人”既保留单数泛指功能，也不会产生男性限定。
- issue: וָחַי בָּהֶם中遵行典章与生命的关系
  choice: 就必因它们而活
  alternative: 就必靠它们存活；就必在其中得生
  rationale: ב可表达凭借或关联；“因它们而活”不预先界定生命仅指今世存活还是具有更广的神学意义，从而保留原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“律例、典章、安息日、旷野”等保留圣经法律与叙事语域；句法适度拆分，使长句清楚而不削弱原文的重复、警告和审判力度。
