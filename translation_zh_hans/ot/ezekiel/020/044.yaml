  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/עֲשׂוֹתִ֥/י אִתְּ/כֶ֖ם לְמַ֣עַן שְׁמִ֑/י לֹא֩ כְ/דַרְכֵי/כֶ֨ם הָ/רָעִ֜ים וְ/כַ/עֲלִילֽוֹתֵי/כֶ֤ם הַ/נִּשְׁחָתוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/044.yaml
  text: Then you will know that I am Yahweh[a], when I deal with you for the sake of my name, not according to your evil ways or according to your corrupt deeds, O house of Israel[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 那时，你们就会知道我是雅威[a]：当我为我名的缘故[b]对待你们[c]，不照你们邪恶的行径，也不照你们败坏的作为时，以色列家啊，这是主雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה的拟音。
    reason: divine_name
  - marker: b
    text: “为我名的缘故”意为维护他名的尊荣和声誉。
    reason: cultural_note
  - marker: c
    text: 或译“向你们行事”。希伯来文用语宽泛，在这里没有具体说明神将以何种方式行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: 那时，你们就知道
  rationale: 连词加完成式在先知话语中表达随之发生的结果；“那时”自然传达结果关系，同时保留“知道雅威”的认知公式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通常拟音译出其专名性质，不以一般称号代替。
- source_word: בַּעֲשׂוֹתִי אִתְּכֶם
  choice: 我……待你们
  rationale: 原文“做”与宾语标记连用，宽泛指神对以色列采取行动；“待你们”在现代汉语中自然，并不限定这是惩罚、复兴，还是两者兼有。
- source_word: לְמַעַן שְׁמִי
  choice: 为了我的名
  rationale: 保留“名”的具体意象；在此指雅威之名的尊荣和声誉。
- source_word: לֹא כְדַרְכֵיכֶם הָרָעִים
  choice: 并不照你们邪恶的行径
  rationale: דֶּרֶךְ在道德语境中指生活方式或行为；“行径”简洁而有明确的道德色彩。
- source_word: וְכַעֲלִילוֹתֵיכֶם הַנִּשְׁחָתוֹת
  choice: 也不照你们败坏的作为
  rationale: עֲלִילוֹת指行为、作为；הַנִּשְׁחָתוֹת描述这些行为已经败坏。“败坏的作为”保留原文强烈的道德判断。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: “啊”明确表达原文直接呼语，庄重而不古奥。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主雅威的宣告
  rationale: נְאֻם是标准先知宣告公式；אֲדֹנָי保留为称号“主”，יְהוָה则保留为专名“雅威”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质；不以称号替代，也不把后期形成的混合读音放入正文。
- issue: בַּעֲשׂוֹתִי אִתְּכֶם所指行动的性质
  choice: 我……待你们
  alternative: 我向你们施行这一切；我处置你们
  rationale: 希伯来文没有在此限定行动是惩罚、恢复，还是二者兼具；“待你们”保留这种开放性和上下文中的神学张力。
- issue: 神按其名而非按以色列行为行事
  choice: 并不照你们邪恶的行径，也不照你们败坏的作为
  alternative: 不按你们的恶行和败坏行为报应你们
  rationale: 原文作比较，却没有明说“报应”；正文不补入这一解释，以免把神行动的性质缩窄为单一的刑罚逻辑。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行径／作为”对应原文两个不同的行为词；“主雅威”保留称号与神名并列的结构。标点突出“知道雅威”与其原因之间的关系，并保留对“以色列家”的直接呼告。
