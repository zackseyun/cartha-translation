source:
  edition: WLC
  text: וָ/אַ֨עַשׂ֙ לְמַ֣עַן שְׁמִ֔/י לְ/בִלְתִּ֥י הֵחֵ֛ל לְ/עֵינֵ֥י הַ/גּוֹיִ֖ם אֲשֶׁר הֵ֣מָּה בְ/תוֹכָ֑/ם אֲשֶׁ֨ר נוֹדַ֤עְתִּי אֲלֵי/הֶם֙ לְ/עֵ֣ינֵי/הֶ֔ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/009.yaml
  text: But I acted for the sake of my name[a], so that it should not be profaned in the sight of the nations among whom they were[c][b], to whom I had made myself known in their sight by bringing them out of the land of Egypt.
translation:
  language: zh_hans
  text: 但我为了我的名[a]而行事，免得我的名在以色列人所处的列国眼前被亵渎[b]；我曾在这些列国眼前向他们显明自己[c]，借着把以色列人从埃及地领出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为我的名的缘故”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“被玷污”。
    reason: lexical_alternative
  - marker: c
    text: “向他们显明自己”或译“让他们认识我”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ
  choice: 但我……采取行动
  rationale: עשה含义宽泛；结合上文以色列的悖逆，此处指上帝作出决定性的行动。连接词在语境中表达转折，译作“但”。
- source_word: לְמַעַן שְׁמִי
  choice: 为了我的名
  rationale: 保留希伯来语习语，表达上帝顾念其名所代表的公开尊荣与启示出来的品格。
- source_word: לְבִלְתִּי הֵחֵל
  choice: 免得我的名……被亵渎
  rationale: חלל在此具有使圣物落入俗用、使之受辱的宗教含义；补出隐含宾语“我的名”，使中文明确自然。
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: 在……列国眼前
  rationale: 保留“眼前”的视觉和公开性意象，也与后文 לְעֵינֵיהֶם 的重复相呼应。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 指以色列之外的各民族；“列国”符合先知文学的庄重语域，又避免“外邦人”可能带入的后期色彩。
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: 他们所处的列国
  rationale: 自然表达以色列人在这些民族中间的状态，不额外限定为长期“居住”。
- source_word: אֲשֶׁר נוֹדַעְתִּי אֲלֵיהֶם
  choice: 我曾……向他们显明自己
  rationale: ידע的尼法勒式在此可表示“被认识／使自己为人所知”；正文采用符合语境的自我显明表达，脚注保留“让他们认识我”的可能译法。
- source_word: לְעֵינֵיהֶם
  choice: 在那些列国眼前
  rationale: 保留原文与前一“在列国眼前”的重复，强调这一启示具有公开可见性。
- source_word: לְהוֹצִיאָם
  choice: 要把他们……领出来
  rationale: לְ加使役不定式可表示上帝显明自己的意向或相关行动；译作“要把”保留目的／意向色彩，不强行改成已经完成的“借着领出”。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 采用中文圣经语域中自然且贴近原文的地名表达。
theological_decisions:
- issue: 上帝“为了我的名”而行动的含义
  choice: 保留“为了我的名”的表达，让“名”承载上帝公开的尊荣和启示出来的品格
  alternative: 意译为“为了维护我的声誉”
  rationale: 意译为“声誉”会缩窄“名”的圣约与启示内涵，并可能造成仅仅维护形象的印象。
- issue: חלל用于上帝之名时的力度
  choice: 译作“亵渎”
  alternative: 译作“玷污”或“羞辱”
  rationale: “亵渎”最能保留圣俗界限及上帝圣名遭轻慢的神学意味；脚注列出较一般的替代译法。
- issue: נוֹדַעְתִּי的语态与自我启示含义
  choice: 译作“向他们显明自己”
  alternative: 译作“让他们认识我”或“为他们所认识”
  rationale: 原式容许“被认识／显明自己”的张力；正文采用自然的中间／反身理解，脚注提示另一种不必然强调启示动作的表达。
- issue: לְהוֹצִיאָם与自我显明之间的关系
  choice: 译作“要把他们……领出来”，保留目的或意向关系
  alternative: 译作“借着把他们……领出来”，理解为工具或方式
  rationale: 希伯来语不定式可有目的或说明作用；不把出埃及在本句中明确处理为已经完成的手段，更切合本章回顾上帝在埃及宣告领出的叙述流程。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国眼前”保留以西结书反复强调的公开见证意象；分号帮助读者辨认两个相关但各自完整的从句。所有脚注标记均紧随其所说明的词语或短语。
