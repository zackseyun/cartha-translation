revisions:
- from: 但我为了我的名[a]采取行动，免得我的名在他们所处的列国眼前被亵渎[b]；我曾在那些列国眼前向他们显明自己[c]，要把他们从埃及地领出来。
  to: 但我为了我的名[a]而行事，免得我的名在以色列人所处的列国眼前被亵渎[b]；我曾在这些列国眼前向他们显明自己[c]，借着把以色列人从埃及地领出来。
  rationale: 修订以明确名词替代会混淆指代的代词，并将末尾不定式译作“借着把……领出来”，以反映其对上帝公开自我显明之行动的说明作用。保留“名”“亵渎”“列国”等关键术语和原文的公开可见意象；同时删除脚注b中会错误暗示上帝亵渎自己名的主动式替代译文。
