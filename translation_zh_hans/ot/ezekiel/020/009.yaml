  timestamp: '2026-07-14T08:00:09Z'
review_pass:
  verdict: revise
  source_fidelity: 正文基本准确传达了“为我的名而行事”、圣名不在列国面前被亵渎，以及上帝在列国眼前自我显明的意思。但末尾“要把他们从埃及地领出来”容易使人理解为“显明自己”的目的，且未能清楚表达该不定式与出埃及行动的说明／方式关系；在本节回顾出埃及的语境中，译为“借着把……领出来”更准确。
  naturalness: “他们所处的列国”及连续使用“他们”会造成指代不够清晰：前者的“他们”指以色列人，随后“向他们显明自己”的“他们”则指列国。明确写出“以色列人”和“这些列国”，中文更自然易懂，也保留原文两组不同指代。
  terminology: “名”“亵渎”“列国”“埃及地”均符合庄重而现代的中文圣经语域。“采取行动”可简化为更凝练自然的“行事”。脚注b中“免得我亵渎我的名”的主动式替代译法不宜保留：它将原文的圣名遭亵渎表述为上帝亵渎自己的名，中文语义和语用均易误导。
  issues:
  - severity: medium
    issue: 末尾“要把他们从埃及地领出来”将不定式处理为目的，关系不够准确。
    rationale: לְהוֹצִיאָם在此说明上帝向列国显明自己的出埃及行动；结合本节的回顾性叙述，中文以“借着把以色列人从埃及地领出来”最清楚地表达方式／相关行动，避免误解为尚未实施的计划。
  - severity: medium
    issue: “他们”在相邻分句中分别指以色列人和列国，指代含混。
    rationale: 原文的关系代词及人称后缀可依句法区分，但中文连续使用代词不易辨认。补出“以色列人”与“这些列国”属于必要的指代澄清，不改变意义。
  - severity: medium
    issue: 脚注b的主动式替代译法“免得我亵渎我的名”不安全。
    rationale: 该说法使上帝成为亵渎自己名的直接施事，与正文及本处通常的被动结果理解冲突，并会在中文中产生不必要的神学和语义误导。
