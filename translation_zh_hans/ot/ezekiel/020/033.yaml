base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/033.yaml
  text: As I live[a], declares the Lord GOD, surely with a strong hand and an outstretched arm and with wrath poured out, I will reign over you.
translation:
  language: zh_hans
  text: 主耶和华宣告：“我指着我的永生起誓：我必以大能的手、伸出的臂和倾泻而出的烈怒，在你们之上作王[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“统治你们”或“作你们的王”。希伯来文动词含有明确的君王意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֕נִי
  choice: 我指着我的永生起誓
  rationale: 这是先知话语中庄严的起誓公式。汉语若直译为“我活着”不易表达其功能；“我指着我的永生起誓”既传达誓言性质，也保留上帝以自己的永生作保证的含义。
- source_word: נְאֻ֖ם אֲדֹנָ֣י יְהוִ֑ה
  choice: 主耶和华宣告
  rationale: נְאֻם是标准的先知宣告用语；אֲדֹנָי יְהוִה按名称与称号的组合译为“主耶和华”，庄重而符合现代中文圣经语体。
- source_word: אִם לֹא
  choice: 必
  rationale: 在誓言结构中并非普通条件句，而是强烈保证；“必”自然传达其确定和强调的语气。
- source_word: בְּיָד חֲזָקָה
  choice: 用大能的手
  rationale: 保留与出埃及叙事相呼应的身体意象和施行大能的工具性含义，避免抽象化为单纯的“能力”。
- source_word: וּבִזְר֧וֹעַ נְטוּיָ֛ה
  choice: 和伸出的臂
  rationale: 保留希伯来文固定意象，并与“大能的手”形成并列；前置词“用”的作用自然延续到本短语。
- source_word: וּבְחֵמָ֥ה שְׁפוּכָ֖ה
  choice: 倾泻烈怒
  rationale: חֵמָה表达强烈忿怒，שְׁפוּכָה保留液体被倒出、倾泻的形象；中文以动宾结构表达更自然有力。
- source_word: אֶמְל֥וֹךְ עֲלֵיכֶֽם
  choice: 作王统治你们
  rationale: מלך具有明确的君王语义。“作王统治”既呈现王权色彩，也清楚表达对其对象实施统治，避免仅译“管理”而削弱审判语境中的强制意味。
theological_decisions:
- issue: 神名与称号אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 译文区分“主”这一称号与耶和华这一盟约之名，不使用“主主”式重复，也不把专名泛化为普通称谓。
- issue: 经由审判彰显王权的张力
  choice: 作王统治你们
  alternative: 掌管你们；在你们之上作王
  rationale: 原文把上帝的王权与大能、伸臂和倾泻烈怒并置。译文保留这种令人不安却真实存在的神学张力，不将其弱化为一般的治理或保护。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。句式保留先知宣告的力度以及“手—臂—烈怒”的递进意象；以“我指着我的永生起誓”说明希伯来誓言公式的交际功能。脚注标记置于其实际说明的“作王统治你们”之后。
