source:
  edition: WLC
  text: בְּ/רֵ֣יחַ נִיחֹחַ֮ אֶרְצֶ֣ה אֶתְ/כֶם֒ בְּ/הוֹצִיאִ֤/י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצֹתֶ֖ם בָּ֑/ם וְ/נִקְדַּשְׁתִּ֥י בָ/כֶ֖ם לְ/עֵינֵ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/041.yaml
  text: I will accept you like a pleasing aroma when I bring you out from the peoples and gather you from the lands where you have been scattered, and I will show myself holy through you before the eyes of the nations.
translation:
  language: zh_hans
  text: 我必如同悦纳馨香之气一样悦纳你们；当我把你们从万民中领出来、从你们所分散的各地聚集起来时，我必在列国眼前，在你们身上显为圣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你们身上”也可译为“在你们中间”或“借着你们”。
    reason: 希伯来文介词 בָכֶם 在此可表达地点、关联范围或媒介；脚注保留其语义余地，不预先裁定一种神学性理解。
lexical_decisions:
- source_word: בְּרֵיחַ נִיחֹחַ אֶרְצֶה אֶתְכֶם
  choice: 我必悦纳你们，如同悦纳馨香之气
  rationale: רֵיחַ נִיחֹחַ 是献祭语汇，指蒙悦纳的馨香；אֶרְצֶה אֶתְכֶם 直指神悦纳百姓。用“如同悦纳”保留馨香与百姓蒙悦纳之间的比拟关系，同时使中文自然。
- source_word: בְּהוֹצִיאִי אֶתְכֶם מִן הָעַמִּים
  choice: 那时，我必把你们从万民中领出来
  rationale: בְּ 加不定式结构在此表达时间背景；“那时”比机械译作“在我领出时”更符合现代汉语。הָעַמִּים 译作“万民”，与后文“列国”有所区分。
- source_word: וְקִבַּצְתִּי אֶתְכֶם מִן הָאֲרָצוֹת אֲשֶׁר נְפֹצֹתֶם בָּם
  choice: 从你们被分散到的各地聚集你们
  rationale: 保留被动式 נְפֹצֹתֶם 所表达的分散处境；“各地”自然传达复数 הָאֲרָצוֹת，避免误解为若干现代国家。
- source_word: וְנִקְדַּשְׁתִּי בָכֶם
  choice: 我要……借着你们显为圣
  rationale: Nifal 形式可表达“被尊为圣／显为圣”，בָכֶם 可理解为“在你们身上”或“借着你们”。正文采用“借着你们”，突出神以聚集和复兴百姓的作为在列国前彰显自己的圣洁。
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: 在列国眼前
  rationale: 较为贴近原文“在列国的眼中／眼前”，并保留公开可见的意味。
theological_decisions:
- issue: 神“显为圣”与以色列的关系
  choice: 借着你们显为圣
  alternative: 在你们身上显为圣／在你们中间显为圣
  rationale: 希伯来介词 ב 可涵盖“借着、在……身上、在……中间”等关系。结合本节神领出并聚集百姓、且此事发生在列国眼前的语境，“借着你们”最清楚表达列国因神在其百姓身上的作为而认识他的圣洁，但不将其他语义可能性提升为教义定论。
- issue: 馨香是否直接等同于百姓
  choice: 如同悦纳馨香之气
  alternative: 我必因馨香之气悦纳你们／我必以你们为馨香而悦纳
  rationale: 原文介词结构简练，既承接献祭中的“馨香”意象，又以 אֶרְצֶה אֶתְכֶם 明说悦纳对象是“你们”。采用明喻式表达，避免把百姓与祭物完全等同，也避免擅自补出具体祭献。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“馨香之气”保留以西结书的祭祀语域；“万民／列国”形成自然变化。“那时”将前半句的希伯来时间结构顺畅地带入中文。
