  naturalness: “都要在那里、在这地侍奉我”在现代汉语中地点成分重复且停顿不自然。改为“在那里，以色列全家，就是在这地的全体百姓，都必侍奉我”可保留原文的强调和两个地点限定，语序更顺畅。
  terminology: “悦纳”“供物”“分别为圣之物”均符合庄重的先知与礼仪语体。将第二类献物译为“你们所献之物中首先献上的部分”，避免把未明确为农产初熟物的词语窄化，同时保留其“首先”的含义。
