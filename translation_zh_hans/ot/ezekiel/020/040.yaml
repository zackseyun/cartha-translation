reference: Ezekiel 20:40
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י בְ/הַר קָדְשִׁ֞/י בְּ/הַ֣ר מְר֣וֹם יִשְׂרָאֵ֗ל נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה שָׁ֣ם יַעַבְדֻ֜/נִי כָּל בֵּ֧ית יִשְׂרָאֵ֛ל כֻּלֹּ֖/ה בָּ/אָ֑רֶץ שָׁ֣ם אֶרְצֵ֔/ם וְ/שָׁ֞ם אֶדְר֣וֹשׁ אֶת תְּרוּמֹֽתֵי/כֶ֗ם וְ/אֶת רֵאשִׁ֛ית מַשְׂאוֹתֵי/כֶ֖ם בְּ/כָל קָדְשֵׁי/כֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/040.yaml
  text: For on my holy mountain[a], on the high mountain of Israel, declares the Lord GOD, there all the house of Israel, all of them in the land, will serve me. There I will accept them, and there I will require your contributions and the firstfruits of your offerings[c][b], with all your holy things.
translation:
  language: zh_hans
  text: 因为在我的圣山上，就是以色列的高山上——主耶和华宣告——在那里，以色列全家，就是在这地的全体百姓，都必侍奉我。我必在那里悦纳他们，也必在那里要求你们献上供物[a]、你们所献之物中首先献上的部分[b]，以及你们一切分别为圣之物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供物”也可译作“奉献之物”；原词指分别出来献给神的份。
    reason: lexical_alternative
  - marker: b
    text: “你们所献之物中首先献上的部分”也可译作“你们献物中的初献之物”。
    reason: lexical_alternative
  - marker: c
    text: “一切分别为圣之物”也可译作“一切圣洁的供物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְהַר קָדְשִׁי
  choice: 在我的圣山上
  rationale: בְ在此表示地点；“在……山上”符合现代汉语，也保留敬拜场景。
- source_word: בְהַר מְרוֹם יִשְׂרָאֵל
  choice: 在以色列的高山上
  rationale: מְרוֹם强调高度；译作“高山”并与前句“圣山”保持平行。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: נְאֻם是先知话语中的宣告公式；“主耶和华”既保留 אֲדֹנָי，也明确呈现神名。
- source_word: יַעַבְדֻנִי
  choice: 侍奉我
  rationale: עבד兼有服侍和敬拜之意；“侍奉”保留较宽含义，并契合下文献礼物的礼仪语境。
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: 以色列全家，他们所有的人
  rationale: 原文以两个总体性表达加强语气；译文保留这种重复强调。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 此处定冠词所指是在语境中已知的以色列之地；“这地”比泛指的“国内”更自然。
- source_word: אֶרְצֵם
  choice: 我必悦纳他们
  rationale: רצה在献祭及关系语境中指有恩惠地接纳；“悦纳”兼顾接纳与喜悦之意。
- source_word: אֶדְרוֹשׁ
  choice: 我要你们献上
  rationale: דרש在此指神要求或索取当献之物；采用自然汉语表达，同时避免“索要”可能带来的负面色彩。
- source_word: תְּרוּמֹתֵיכֶם
  choice: 你们献上的供物
  rationale: תְּרוּמָה指分别出来献给神的份；“供物”简明，并以动词“献上”显明其用途。
- source_word: רֵאשִׁית מַשְׂאוֹתֵיכֶם
  choice: 所献礼物中初熟的部分
  rationale: רֵאשִׁית可指最初或初熟之物；מַשְׂאוֹת指带来、举献的礼物。此译保留二者关系，不把“礼物”过窄地限定为某一种祭物。
- source_word: בְּכָל קָדְשֵׁיכֶם
  choice: 以及你们一切分别为圣之物
  rationale: קָדְשֵׁיכֶם范围宽泛，指归为圣的各种东西；译文保留这种广度。
theological_decisions:
- issue: 神名 יְהוָה 在 אֲדֹנָי יְהוִה 组合中的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文明确使用四字神名；“主耶和华”在现代中文圣经语体中可辨识，并避免把神名完全替换为称号。
- issue: עבד 在礼仪语境中的含义
  choice: 侍奉
  alternative: 敬拜
  rationale: “敬拜”符合本节献礼物的语境，但“侍奉”更能保留该词既含敬拜又含服事的语义张力。
- issue: רצה 对人的关系性与礼仪性含义
  choice: 悦纳他们
  alternative: 接纳他们
  rationale: “悦纳”能表达有恩惠地接纳，同时与本节献礼物的礼仪背景相呼应，但不把对象误解为祭物，因为原文宾语是百姓。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主耶和华宣告”以破折号嵌入，保留先知宣告公式；保留“以色列全家，他们所有的人”的强调性复述，并以“分别为圣之物”维持末句所指范围的宽广性。
