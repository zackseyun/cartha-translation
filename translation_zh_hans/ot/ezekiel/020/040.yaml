  to: 因为在我的圣山上，就是以色列的高山上——主耶和华宣告——在那里，以色列全家，就是在这地的全体百姓，都必侍奉我。我必在那里悦纳他们，也必在那里要求你们献上供物[a]、你们所献之物中首先献上的部分[b]，以及你们一切分别为圣之物[c]。
