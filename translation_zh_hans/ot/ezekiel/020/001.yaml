  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ית בַּֽ/חֲמִשִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ בָּ֧אוּ אֲנָשִׁ֛ים מִ/זִּקְנֵ֥י יִשְׂרָאֵ֖ל לִ/דְרֹ֣שׁ אֶת יְהוָ֑ה וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/001.yaml
  text: And it happened in the seventh year[a], in the fifth month, on the tenth day of the month, that some of the elders of Israel came to inquire of Yahweh[b], and they sat before me.
translation:
  language: zh_hans
  text: 第七年五月初十，有几位以色列的长老来求问雅威[a]，坐在我面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求问雅威”也可译作“寻求雅威”或“向雅威求指示”；这里指正式寻求神的指引或答复。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （以日期句式表达，不单独译出）
  rationale: 希伯来语常用的叙事起始公式；现代汉语以“第七年五月初十”直接开启新段落，更自然，也保留事件发生的叙事功能。
- source_word: בַּשָּׁנָה הַשְּׁבִיעִית
  choice: 第七年
  rationale: 原文没有明说纪年所依据的事件，因此不在正文中补入“被掳”或“约雅斤被掳”。
- source_word: בַּחֲמִשִׁי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 五月初十
  rationale: 准确而自然地表达“第五月、本月第十日”的正式日期。
- source_word: בָּאוּ אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: 有几位以色列的长老来
  rationale: 原文直译为“以色列长老中的一些人”，表示从长老群体中来的若干代表；“有几位……长老”在现代汉语中自然清楚。
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: 求问雅威
  rationale: 此处指借着先知正式寻求神的指示或答复；“求问”比一般性的“寻求”更符合语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质。
- source_word: וַיֵּשְׁבוּ לְפָנַי
  choice: 坐在我面前
  rationale: 既保留具体坐姿，也自然表达他们来到先知面前等候答复的正式场景。
theological_decisions:
- issue: 是否在第七年后补明纪年背景
  choice: 正文只译“第七年”
  alternative: 第七年，即约雅斤王被掳后的第七年
  rationale: 虽然全书的年代框架很可能以约雅斤被掳为基准，但本节并未明说；不把推定的历史说明写入正文。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而非普通称号；音译可以直接保留这一点，同时避免用“主”取代专名。
- issue: 长老来访人数和代表性质
  choice: 有几位以色列的长老
  alternative: 以色列长老中的一些代表
  rationale: מִזִּקְנֵי 表明来者出自长老群体，但原文没有明确使用“代表”一词，因此正文不把代表身份绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。日期用汉语常见的“五月初十”；不机械译出希伯来语叙事公式“事情发生了”。“有几位以色列的长老”兼顾原文的部分性与自然汉语。
