source:
  edition: WLC
  text: וָ/אֲטַמֵּ֤א אוֹתָ/ם֙ בְּ/מַתְּנוֹתָ֔/ם בְּ/הַעֲבִ֖יר כָּל פֶּ֣טֶר רָ֑חַם לְמַ֣עַן אֲשִׁמֵּ֔/ם לְמַ֨עַן֙ אֲשֶׁ֣ר יֵֽדְע֔וּ אֲשֶׁ֖ר אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/026.yaml
  text: And I defiled them through their gifts[a], by making every firstborn pass through the fire, so that I might devastate them[d][c][b], so that they might know that I am Yahweh.
translation:
  language: zh_hans
  text: 我借着他们的供物使他们不洁[a]，就是使一切头生的经火而过[b]，好使他们荒凉[c]，好让他们知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“玷污他们”或“使他们成为不洁”。
    reason: lexical_alternative
  - marker: b
    text: “头生的”原文直译为“初开母腹的”。原文只说“使一切初开母腹的经过”，未明说“火”；“经火而过”是根据本书相关语境所作的补足。这可能指使儿女经火的仪式，并暗指献子为祭。
    reason: cultural_note
  - marker: c
    text: 也可译作“好使他们毁坏”或“好使他们惊骇”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲטַמֵּא אוֹתָם
  choice: 我……使他们玷污自己
  rationale: 使役形明确保留上帝的直接施事作用；“玷污”兼具礼仪和道德色彩。加“自己”体现玷污借着他们所献礼物发生，但不把直接陈述弱化为单纯许可。
- source_word: בְּמַתְּנוֹתָם
  choice: 因他们所献的礼物
  rationale: מַתָּנוֹת 的基本义是“礼物”，语境表明这些是献上的礼物；“因”表达工具或媒介关系。
- source_word: בְּהַעֲבִיר כָּל פֶּטֶר רָחַם
  choice: 就是使一切初开母腹的都经火而过
  rationale: 保留“初开母腹”的希伯来表达，并按以西结书相关语境明确“经火而过”。原文此处未明说“火”，故以脚注注明补足。
- source_word: לְמַעַן אֲשִׁמֵּם
  choice: 好使他们荒凉
  rationale: שׁמם 的使役形可指使之荒凉、毁坏，也可指使之惊骇；“使他们荒凉”保留审判性及原词的多义空间。
- source_word: לְמַעַן אֲשֶׁר יֵדְעוּ
  choice: 好让他们知道
  rationale: 自然表达目的关系，并保留以西结书常见的审判启示公式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现上帝的专名，而不以称号替代。
theological_decisions:
- issue: 上帝在以色列受玷污之事中的施事作用
  choice: 保留“我……使他们玷污自己”的直接第一人称使役表述
  alternative: 译作“我任凭他们受玷污”或仅表达许可
  rationale: 希伯来文明确以第一人称使役形陈述神的行动。译文不消解其中的神学张力，同时指出玷污是借他们自己的献礼及相关仪式发生的。
- issue: “使初开母腹的经过”与献子仪式的关系
  choice: 正文按上下文译作“经火而过”，并用脚注说明原文未出现“火”字及可能涉及献子
  alternative: 严格只译“使……经过”，或直接译成“献上每个头生的孩子为祭”
  rationale: 单译“经过”在现代汉语中含义不明，直接译成“献子为祭”又会把语境推断写成原文明言；正文结合书内用语传达仪式，脚注保留证据层级。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一切初开母腹的”有意保留经文的古老意象；借脚注解释其为头生者。“好使……好让……”保持原文连续两个目的从句。
