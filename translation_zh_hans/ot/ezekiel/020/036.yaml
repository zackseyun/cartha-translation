base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/036.yaml
  text: Just as I entered into judgment with your fathers in the wilderness of the land of Egypt[a], so I will enter into judgment with you, declares the Lord GOD.
translation:
  language: zh_hans
  text: “我怎样在埃及地的旷野审判你们的祖先，也必照样与你们进行审判[a]；这是主耶和华的宣告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我怎样在埃及地的旷野与你们的祖先进行审判，也必照样与你们进行审判。”希伯来语的审判动词可指正式的司法交涉；首句的句法也可较直接地译为“审判你们的祖先”。
    reason: 词义与句法：保留该动词正式司法意味的可成立译法，同时说明首句可按直接宾语结构理解。
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: 我怎样……也必照样……
  rationale: 清楚保留原文前后对应的比较结构，并自然呈现过去之事与将来之事的平行。
- source_word: נִשְׁפַּטְתִּי ... אִשָּׁפֵט
  choice: 进行审判
  rationale: 两个动词均采用相同译法，以保留严格的平行关系；“进行审判”比单说“审判”更能体现尼法勒形式在此处所带有的正式司法交涉意味。
- source_word: אֶת אֲבוֹתֵיכֶם ... אִתְּכֶם
  choice: 与你们的祖先……与你们
  rationale: 在这一审判用语中译作“与”可保留司法双方相对而立的表达，又不把原文进一步限定为“攻击”或“敌对”。
- source_word: בְּמִדְבַּר אֶרֶץ מִצְרָיִם
  choice: 在埃及地的旷野
  rationale: 保留מִדְבָּר“旷野”和אֶרֶץ מִצְרָיִם“埃及地”的全部词义，不擅自改写该地理短语。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: “宣告”自然表达先知书中的神谕公式；“主耶和华”同时保留אֲדֹנָי的称号和יהוה的专名，并符合现代中文圣经语体。
theological_decisions:
- issue: 尼法勒形式נִשְׁפַּטְתִּי和אִשָּׁפֵט所表达的审判关系
  choice: 与你们的祖先进行审判……与你们进行审判
  alternative: 审判了你们的祖先……也必审判你们
  rationale: 正文保留正式司法交涉及双方对质的意味，同时不将它解释成某一特定的盟约诉讼理论；脚注列出较简洁的可能译法。
- issue: 神名יהוה在אֲדֹנָי יהוה组合中的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在简体中文读者中庄重而通行，也避免把两个词合并为一个称号；同时明确保留יהוה为神的专名，而非普通的“主”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“进行审判”略带正式法律语域，符合本节反复而严肃的神谕语气；“祖先”比“列祖”更符合当代通用表达。
