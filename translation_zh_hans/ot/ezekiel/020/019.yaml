  yaml_path: translation/ot/ezekiel/020/019.yaml
  text: I am Yahweh your God; walk in my statutes[a], and keep my judgments and do them.
translation:
  language: zh_hans
  text: 我是雅威，你们的上帝。你们要遵行我的律例，谨守并实行我的典章[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “典章”也可译作“法令”或“条例”。
    reason: מִשְׁפָּטַי指上帝所规定、应当谨守和实行的法令或条例；此处不宜限缩为现代法律意义上的“判例”。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保存上帝的圣约之名，而不以“主”这一称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 在雅威向以色列群体说话的语境中，אֱלֹהִים 与第二人称阳性复数后缀表达单数意义“你们的上帝”。
- source_word: בְּחֻקּוֹתַי לֵכוּ
  choice: 遵行我的律例
  rationale: 希伯来语字面为“行在我的律例中”，是指按这些律例安排生活的圣约用语；“遵行”在现代汉语中自然地保留行为导向。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּטִים 在此指具有法律约束力的裁定或规章；“典章”与“律例”搭配自然，也保留法律语感。
- source_word: שִׁמְרוּ
  choice: 谨守
  rationale: שׁמר 在法律和圣约语境中指留心持守、遵守；“谨守”体现命令中的慎重意味。
- source_word: וַעֲשׂוּ אוֹתָם
  choice: 并实行
  rationale: עשה 强调把所命令的内容付诸行动；“实行”避免与前面的“遵行”机械重复，并保留实际执行之意。
- source_word: אֲנִי
  choice: 我是
  rationale: 独立人称代词带有强调作用，在无系词的名词句中用“我是”自然表达。
theological_decisions:
- issue: 圣约之名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以音译保留其作为专名的性质；不以称号“主”代替。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“遵行”自然传达希伯来语“行在……中”的生活方式含义；“谨守并实行”保留原文从持守到付诸行动的并列强调。
