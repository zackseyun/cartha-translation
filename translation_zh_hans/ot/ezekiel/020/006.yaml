base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/006.yaml
  text: On that day I raised my hand to them[a], to bring them out from the land of Egypt into a land that I had searched out for them, flowing with milk and honey[c][b]; it is the glory of all lands.
translation:
  language: zh_hans
  text: 那日，我向他们举手起誓[a]，要把他们从埃及地领出来，带到我为他们探察的地；那地流奶与蜜，是万地中最荣美的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“向他们举起我的手”，即向他们起誓。
    reason: lexical_alternative
  - marker: c
    text: 或译“是万地的荣美（或华美）”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשָׂאתִי יָדִי
  choice: 举手起誓
  rationale: 该短语字面为“举起我的手”，在本段语境中是起誓的惯用表达。正文兼顾具体动作和实际含义，脚注保留更贴近字面的译法。
- source_word: לָהֶם
  choice: 向他们
  rationale: 表示誓言所面向的对象；现代汉语中与“举手起誓”搭配自然。
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: 要把他们从埃及地领出来
  rationale: 使役形态表示使他们出去；“领出来”自然表达出埃及的行动，也保留引领意味。
- source_word: אֲשֶׁר תַּרְתִּי לָהֶם
  choice: 我为他们探定的
  rationale: תור有探察、寻访之意；“探定”保留原文拟人化的探察意象，同时在汉语中暗含为他们择定该地，避免仅译“拣选”而抹去词汇特色。
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: 流奶与蜜
  rationale: 沿用清楚而庄重的圣经意象，表达土地丰饶。
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: 是万地中最荣美的
  rationale: צְבִי可指荣美、华美或荣耀；此处结构表达该地在众地之中的卓越。“最荣美”在现代汉语中自然，并保留先知文体的崇高色彩。
theological_decisions:
- issue: תַּרְתִּי对上帝的拟人化描写
  choice: 我为他们探定的
  alternative: 我为他们选定的
  rationale: 保留原文“探察、寻访”的拟人化表达，不将其抽象化为单纯的拣选；这属于先知性的表达方式，并不需要译文自行解释为上帝缺乏知识。
- issue: 举手动作与誓言含义的关系
  choice: 举手起誓
  alternative: 向他们举手
  rationale: 上下文表明举手是立誓的动作。正文明确其惯用含义，同时通过“举手”保留原文形象，避免普通读者误解为问候或施行其他手势。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“举手起誓”兼顾希伯来语具体形象与惯用含义；“探定”略带书面色彩，但能简洁保留原文的拟人化探察意象。“万地中最荣美的”自然表达比较意义，脚注则保留更形式对应的名词结构。
