source:
  edition: WLC
  text: וְ/אַתֶּ֨ם בֵּֽית יִשְׂרָאֵ֜ל כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אִ֤ישׁ גִּלּוּלָי/ו֙ לְכ֣וּ עֲבֹ֔דוּ וְ/אַחַ֕ר אִם אֵינְ/כֶ֖ם שֹׁמְעִ֣ים אֵלָ֑/י וְ/אֶת שֵׁ֤ם קָדְשִׁ/י֙ לֹ֣א תְחַלְּלוּ ע֔וֹד בְּ/מַתְּנֽוֹתֵי/כֶ֖ם וּ/בְ/גִלּוּלֵי/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/039.yaml
  text: 'But as for you[a], house of Israel, thus says the Lord GOD: Go, each man, serve his idols—if afterward you will not listen to me[b]; but you shall no longer profane my holy name with your gifts and with your idols.'
translation:
  language: zh_hans
  text: “至于你们，以色列家，主耶和华如此说：去吧，各人去服侍自己的偶像[a]；以后，若你们仍不听从我[b]，也不可再借着你们的供物和偶像亵渎我的圣名。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”原文是一个带强烈鄙夷意味的词，也可译作“污秽的偶像”或“粪秽般的偶像”。
    reason: lexical_alternative
  - marker: b
    text: 本句的希伯来文句法较难，也可断句为：“去吧，各人服侍自己的偶像；但以后，如果你们不听从我……”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתֶּם
  choice: 至于你们
  rationale: 独立代词带出转折性的直接称呼；中文用“至于你们”自然表达话锋转向，而不额外加强为绝对对立。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留“家”的群体和盟约称谓色彩，也是庄重而通行的中文表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 按现代中文圣经语域处理复合神名，既保留“主”的称号，也明确呈现专名。
- source_word: אִישׁ גִּלּוּלָיו
  choice: 各人……自己的偶像
  rationale: אִישׁ在这里具有逐一分配的作用；“各人”保留个体责任，所有格则以自然中文表达。
- source_word: גִּלּוּלִים
  choice: 偶像
  rationale: 正文采用清楚通顺的“偶像”；原词强烈鄙夷、与污秽或粪秽相关的语气留在脚注说明。
- source_word: לְכוּ עֲבֹדוּ
  choice: 去吧……服侍
  rationale: 保留两个命令形式及其尖锐语气；“服侍”也保留宗教敬奉的含义。
- source_word: וְאַחַר אִם אֵינְכֶם שֹׁמְעִים אֵלָי
  choice: 以后若仍不听从我
  rationale: 保留אַחַר的时间意味和אִם的条件意味；“听从”兼顾听见与顺服，不把句法难点过度解释。
- source_word: שֵׁם קָדְשִׁי
  choice: 我的圣名
  rationale: 这是自然、庄重的中文表达，保留神名的圣洁及盟约意义。
- source_word: לֹא תְחַלְּלוּ עוֹד
  choice: 不可再……亵渎
  rationale: 在涉及神的圣名时，“亵渎”准确表达חלל使之失去圣洁、视为俗常的含义；“不可再”体现强烈禁令。
- source_word: בְּמַתְּנוֹתֵיכֶם
  choice: 用你们的供物
  rationale: מַתָּנוֹת字面为礼物，此处处于祭祀语境，“供物”既保留礼物性质，也使中文读者明白其宗教用途。
- source_word: וּבְגִלּוּלֵיכֶם
  choice: 和偶像
  rationale: 与“供物”并列，表示他们借这些事物亵渎神的圣名；中文共用介词“用”较自然。
theological_decisions:
- issue: 开头命令“去吧……服侍”的性质
  choice: 保留命令形式，将其理解为审判性的任凭或带反讽意味的让步，而非认可偶像崇拜
  alternative: 把它改写为单纯禁止拜偶像，或理解为神赞同他们继续服侍偶像
  rationale: 希伯来文确实使用命令式，正文不抹平其尖锐张力；后文禁止继续亵渎圣名，表明这并非对偶像崇拜的认可。
- issue: “以后若仍不听从我”与前后句的连接
  choice: 以破折号和分号保留不完整、突兀的条件结构
  alternative: 补出“就尽管去服侍吧”等隐含成分，或译为“从今以后”
  rationale: 原文句法困难，且אַחַר与אִם的关系可有不同断句。正文尽量保留时间、条件和转折，不擅自补足隐含结论。
- issue: 神名复合称号 אֲדֹנָי יְהוִה
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”在现代中文中庄重、明确，并避免把两个成分合并成一个泛称。
translation_notes:
  register: 采用现代、庄重而可朗读的简体中文。“以色列家”“主耶和华”“圣名”“亵渎”等词保持先知宣告的宗教语域；破折号和分号有意保留原文中条件句的突兀与未尽感。
