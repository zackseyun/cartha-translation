id: EZK.20.12
reference: Ezekiel 20:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/גַ֤ם אֶת שַׁבְּתוֹתַ/י֙ נָתַ֣תִּי לָ/הֶ֔ם לִ/הְי֣וֹת לְ/א֔וֹת בֵּינִ֖/י וּ/בֵֽינֵי/הֶ֑ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/012.yaml
  text: I also gave them my Sabbaths to be a sign between me and them[a], so that they might know that I am Yahweh who sanctifies them.
translation:
  language: zh_hans
  text: 我也把我的安息日赐给他们，作为我与他们之间的记号，使他们知道，我是使他们分别为圣的耶和华。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: 我也
  rationale: 连接词与副词在上下文中增添另一项赐予；“我也”自然地保留其递加作用。
- source_word: שַׁבְּתוֹתַי
  choice: 我的安息日
  rationale: 保留第一人称所有关系；希伯来语虽为复数，但现代汉语“安息日”本身可统指历次安息日及其制度，无须生硬标出复数。
- source_word: נָתַתִּי לָהֶם
  choice: 赐给他们
  rationale: 准确表达“给他们”；“赐给”符合上帝赐予的语境，庄重而自然。
- source_word: לִהְיוֹת לְאוֹת
  choice: 作为……记号
  rationale: 表达不定式结构的目的或功能，清楚呈现安息日作为关系标志的作用。
- source_word: בֵּינִי וּבֵינֵיהֶם
  choice: 我与他们之间
  rationale: 直接保留双方关系的表达，不额外限定其性质。
- source_word: לָדַעַת
  choice: 使他们知道
  rationale: 该带介词的不定式表达目的；此译法在汉语中简洁自然，并保留目的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不以“主”等称号替代。
- source_word: מְקַדְּשָׁם
  choice: 使他们分别为圣
  rationale: 使役分词表示耶和华使他们成为圣洁、归他所有；“分别为圣”兼顾其圣洁与归属层面，并保留持续性或特征性行动的开放含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文采用广为人知且具有专名功能的“耶和华”，不以称号“主”取代；“雅威”是较接近学术重构读音的可行替代。
- issue: קדשׁ 在圣约语境中的含义
  choice: 使他们分别为圣
  alternative: 使他们成为圣洁
  rationale: 原文强调是耶和华使以色列成圣。所选译法既可表达使其圣洁，也可表达将其分别归属上帝，同时不说明具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式贴近原文逻辑，同时避免复制希伯来语复数形式而造成不自然的“安息日们”。本节无需脚注；原英文脚注所列“使他们成为圣洁”在中文正文“使他们分别为圣”中已得到充分涵盖。
