  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֲלֵ/הֶ֗ם אִ֣ישׁ שִׁקּוּצֵ֤י עֵינָי/ו֙ הַשְׁלִ֔יכוּ וּ/בְ/גִלּוּלֵ֥י מִצְרַ֖יִם אַל תִּטַּמָּ֑אוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/007.yaml
  text: And I said to them[a], ‘Each man, throw away the detestable things before his eyes, and do not defile yourselves with the idols of Egypt[b]. I am Yahweh your God.’
translation:
  language: zh_hans
  text: 我对他们说：‘你们各人都要丢弃自己眼中可憎之物[a]，不可因埃及的偶像玷污自己[b]。我是耶和华你们的上帝。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他眼中的可憎之物”，是一种习语，可指各人所注目、贪恋或崇奉的可憎之物；在此上下文中很可能指偶像。
    reason: 说明希伯来习语，保留正文未加限定的表达及其在上下文中的可能所指。
  - marker: b
    text: 这里译作“偶像”的希伯来词是以西结书常用的强烈鄙称；也可译作“污秽的偶像”，并可能带有“粪像”一类的贬称联想。
    reason: 说明原词的强烈轻蔑色彩，而不在正文中过度固定其具体词源或修辞形象。
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我对他们说
  rationale: 未显译连接词ו，以符合现代汉语叙事习惯；过去叙事语境已清楚表达时序。
- source_word: אִישׁ
  choice: 你们各人
  rationale: 这里是分配用法，强调群体中的每一个人；结合复数命令，用“你们各人”自然明确。
- source_word: שִׁקּוּצֵי עֵינָיו
  choice: 自己眼中可憎之物
  rationale: 较贴近“他眼睛的可憎之物”这一希伯来表达，保留其可能指人所注目、贪恋或崇奉之物的含混性；上下文暗示偶像崇拜。
- source_word: הַשְׁלִיכוּ
  choice: 丢弃
  rationale: 表达命令中坚决除去、弃绝的力度，同时是自然的现代汉语。
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: 埃及的偶像
  rationale: “偶像”清楚传达核心所指；原词在以西结书中的强烈鄙称意味留在脚注说明，以免正文采用生硬且过度具象的译法。
- source_word: אַל תִּטַּמָּאוּ
  choice: 不可……玷污自己
  rationale: 保留动词的反身意味，也兼顾偶像崇拜所造成的礼仪与道德污秽。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、最易识别的音译，而不以称号替代专名。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 在“耶和华”为主语的盟约宣告中，该形式明确作单数，译作“你们的上帝”。
theological_decisions:
- issue: שִׁקּוּצֵי עֵינָיו这一习语的理解
  choice: 自己眼中可憎之物
  alternative: 自己所注目的可憎偶像
  rationale: 正文保留“眼”这一意象及其语义张力，不把对象完全限定为视觉所见或所贪恋的偶像；脚注交代上下文所暗示的偶像崇拜含义。
- issue: 以西结书中גִּלּוּלִים的鄙称色彩
  choice: 偶像
  alternative: 污秽的偶像／粪像
  rationale: “偶像”在正文中清楚自然；“粪像”虽能凸显蔑视，却可能将词源性或修辞性的联想过度固定，因此以脚注保留这种强烈贬义。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: “耶和华”是简体中文普通读者最熟悉的专名形式，可保留经文的神名性质；不以“上主”等称号取代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你们各人都要”体现分配性的命令；“自己眼中可憎之物”刻意保留原文意象和一定歧义。正文中的脚注标记[a]、[b]均与脚注对应。
