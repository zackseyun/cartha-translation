id: EZK.20.16
reference: Ezekiel 20:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֜עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֗סוּ וְ/אֶת חֻקּוֹתַ/י֙ לֹא הָלְכ֣וּ בָ/הֶ֔ם וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ כִּ֛י אַחֲרֵ֥י גִלּוּלֵי/הֶ֖ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/016.yaml
  text: because they rejected my judgments[a], and did not walk in my statutes, and profaned my Sabbaths; for their heart went after their idols.
translation:
  language: zh_hans
  text: 因为他们厌弃我的典章，不遵行我的律例，又亵渎我的安息日；因为他们的心追随自己的偶像。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”原文是一个带强烈鄙夷意味的词，可能含有“污秽之物”或“粪像”的意味。
    reason: 保留 גִלּוּלִים 的强烈贬义色彩，而不使正文显得生硬。
lexical_decisions:
- source_word: יַעַן
  choice: 因为
  rationale: 引出上下文中施行审判的原因，是现代汉语中自然明确的因果连接词。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: 保留其法令、裁断的含义，并与本句中的“律例”相区别。
- source_word: מָאָסוּ
  choice: 厌弃
  rationale: 既表达拒绝，也保留该动词可能具有的轻蔑、嫌弃色彩。
- source_word: חֻקּוֹתַי
  choice: 我的律例
  rationale: 以常见圣经法律用语表达既定条例，并与“典章”保持词汇区分。
- source_word: לֹא הָלְכוּ בָהֶם
  choice: 不遵行
  rationale: 将希伯来语“行在其中”的行为隐喻自然转化为现代汉语，同时保留实际践行之义。
- source_word: שַׁבְּתוֹתַי
  choice: 我的安息日
  rationale: 中文“安息日”可作集合性称谓，能够自然涵盖希伯来语复数所指的各安息日。
- source_word: חִלֵּלוּ
  choice: 亵渎
  rationale: 准确表达把神圣之物当作俗物对待的圣俗语境。
- source_word: אַחֲרֵי גִלּוּלֵיהֶם
  choice: 追随自己的偶像
  rationale: הלך אחרי构成“跟随、追随”的惯用表达；“自己的”明确反身领属关系。
- source_word: גִלּוּלֵיהֶם
  choice: 自己的偶像
  rationale: 正文采用清楚自然的通用称呼，其强烈贬义另以脚注保存。
- source_word: לִבָּם הֹלֵךְ
  choice: 他们的心追随
  rationale: 保留单数集合名词“心”及内在倾向的拟行动表达；汉语现在式“追随”可承载分词所表达的持续倾向。
theological_decisions:
- issue: 区分盟约律法术语 מִשְׁפָּטַי 与 חֻקּוֹתַי
  choice: 分别译为“我的典章”和“我的律例”
  alternative: 两者均泛译为“我的律法”或“我的法令”
  rationale: 原文刻意使用两个不同法律术语；保留区分可避免抹平盟约语言的层次。
- issue: 保留 לִבָּם הֹלֵךְ 的人论隐喻
  choice: 他们的心追随自己的偶像
  alternative: 他们沉迷于自己的偶像；他们追随自己的偶像
  rationale: 原文把偶像崇拜的倾向置于“心”这一意志与内在生命的中心；保留该表达，不把它仅化约为外在行为。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。以“典章／律例”保留法律术语差异；“不遵行”比直译“没有行在其中”更符合现代汉语；分号呈现原因链条。“安息日”在中文中自然用单数形式作集合称谓。
