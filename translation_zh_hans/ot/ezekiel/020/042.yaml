id: EZK.20.42
reference: Ezekiel 20:42
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/הֲבִיאִ֥/י אֶתְ/כֶ֖ם אֶל אַדְמַ֣ת יִשְׂרָאֵ֑ל אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לַ/אֲבֽוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/042.yaml
  text: Then you will know that I am Yahweh[a], when I bring you into the land of Israel, into the land that I lifted up my hand to give to your fathers.
translation:
  language: zh_hans
  text: 你们就会知道我是耶和华；那时，我要把你们领进以色列地，就是我曾举手起誓要赐给你们祖先的那片土地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: 你们就会知道
  rationale: 连词加完成式在此承接前述神的行动，表达随之而来的结果；“就会”自然体现这一后果关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行、最易识别的专名译法，不以“主”替代原文神名。
- source_word: בַּהֲבִיאִי
  choice: 那时，我要把你们领进
  rationale: 介词 בְּ 加不定式结构表示时间或情境；结合先知话语，以“那时……要”自然表达将来的时间关系。
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: 以色列地
  rationale: אַדְמָה 在复兴归回的语境中指地域，而非单指土壤；“以色列地”准确且自然。
- source_word: הָאָרֶץ
  choice: 那片土地
  rationale: 特指应许之地；保留原文对“地”的重复，同时用指示词使现代汉语衔接自然。
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: 我曾举手起誓
  rationale: 原文直译为“我举起我的手”，是起誓动作的惯用表达；译出“起誓”可避免中文读者误解，同时保留举手的具体意象。
- source_word: לָתֵת אוֹתָהּ
  choice: 要赐给
  rationale: נתן 表示给予；用于神把土地交给祖先的语境，“赐给”庄重自然。
- source_word: לַאֲבוֹתֵיכֶם
  choice: 你们祖先
  rationale: אָבוֹת 字面为“父辈”，在此指以色列的先祖；“祖先”在现代汉语中比“父辈”更准确地传达历史性群体所指。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名，应以专名呈现而不译作“主”。“耶和华”是现代中文读者最熟悉的标准形式；“雅威”较接近学界常见的拟音，但中文宗教语境中的普及度较低。
- issue: 是否按字面翻译举手誓言的习语
  choice: 译作“举手起誓”
  alternative: 仅译作“举手”或“起誓”
  rationale: “举手起誓”同时保留原文的具体动作和习语所表达的誓言含义，清楚呈现神所立应许的约束力，而不把动作误解为普通举手。
- issue: 归回与认识神之间的关系
  choice: 以“就会知道……；那时……”保留结果兼时间关系
  alternative: 单纯译作“当……时，你们就知道……”
  rationale: 原文先陈述“你们必知道”，再以 בַּהֲבִיאִי 说明这一认识发生的情境。当前译法不把认识神完全缩减为单一时间点，也保持神主动领回百姓所产生的确认作用。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“领进”突出神带领归回的行动；“举手起誓”兼顾原文意象与中文可理解性。句中用分号避免长句层级含混，并保留“以色列地／那片土地”的希伯来语重复结构。
