id: EZK.26.5
reference: Ezekiel 26:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִשְׁטַ֨ח חֲרָמִ֤ים תִּֽהְיֶה֙ בְּ/ת֣וֹךְ הַ/יָּ֔ם כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָיְתָ֥ה לְ/בַ֖ז לַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/005.yaml
  text: She will become a place for spreading nets in the midst of the sea[a], for I have spoken, declares the Lord GOD, and she will become plunder for the nations.
translation:
  language: zh_hans
  text: 她必成为海中晾晒渔网的地方[a]；因为我已经说了——这是主耶和华的宣告。她必成为列国的掠物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“铺开渔网的地方。”
    reason: מִשְׁטַח可侧重“铺开之处”或“铺开的表面”；正文按语境表达渔网铺开晾晒的用途，脚注保留较形式对应的译法。
lexical_decisions:
- source_word: מִשְׁטַח חֲרָמִים
  choice: 晾晒渔网的地方
  rationale: מִשְׁטַח表示铺开用的地方或表面，与“网”连用时，指铺开渔网的场所；“晾晒”自然传达此处实际用途，同时保留海上废墟成为晒网场的意象。
- source_word: בְּתוֹךְ הַיָּם
  choice: 海中
  rationale: 简洁、直接地表达“在海的当中”，符合现代汉语，也保留推罗位于海中的地理意象。
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: 因为我已经说了
  rationale: 保留完成式所表达的既成宣告，并表明预言必然实现的根据是上帝亲自发言。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: 将先知性宣告公式译为自然而庄重的现代汉语；“主耶和华”既避免重复称号，也明确保留神名。
- source_word: וְהָיְתָה לְבַז
  choice: 她必成为……掠物
  rationale: “掠物”准确表达בַּז所指战争中被夺取之物；“成为”保留结果性的语义。
- source_word: לַגּוֹיִם
  choice: 列国
  rationale: גּוֹיִם在本审判语境中泛指各国，不加入后期宗教意义上的“外邦人”。
- source_word: תִּהְיֶה ... וְהָיְתָה
  choice: 她必成为……她必成为
  rationale: 两个阴性单数动词回指被人格化的推罗；用“她”保留原文的城市人格化表达。
theological_decisions:
- issue: 复合称号אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”直接保留יהוה作为专名的功能，同时是现代中文圣经语体中清楚、庄重且易懂的表达；不把神名化约为普通称号。
- issue: 上帝宣告与审判实现之间的关系
  choice: 因为我已经说了——这是主耶和华的宣告
  alternative: 主耶和华说：因为我已经说了
  rationale: 保留כִּי所表示的因果关系：预言确定实现，是因为上帝已经发言；破折号使宣告公式在中文中归属清楚，而不额外解释其神学机制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“海中”“列国”“掠物”保留先知文学的凝练语气；用“她”延续推罗作为阴性城市的拟人化。正文脚注标记[a]与脚注对应。
