  text: בֶּן אָדָ֗ם יַ֠עַן אֲשֶׁר אָ֨מְרָה צֹּ֤ר עַל יְרוּשָׁלִַ֨ם֙ הֶאָ֔ח נִשְׁבְּרָ֛ה דַּלְת֥וֹת הָ/עַמִּ֖ים נָסֵ֣בָּה אֵלָ֑/י אִמָּלְאָ֖ה הָחֳרָֽבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/002.yaml
  text: Son of man[a], because Tyre said concerning Jerusalem, ‘Aha! The gateway of the peoples is broken; it has turned to me. I will be filled[b], now that she is laid waste,’
translation:
  language: zh_hans
  text: “人子啊，因为推罗论到耶路撒冷说：‘哈！众民的门户[a]破碎了，已经转到我这里来了。耶路撒冷既已荒凉，我必变得充盈[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众民的城门”或“众民的门扇”。希伯来语表达较为紧缩，可能把耶路撒冷描绘成许多民族往来的入口。
    reason: lexical_alternative
  - marker: b
    text: 意思是：推罗期待耶路撒冷陷落后，原先流向耶路撒冷的往来或利益转到自己这里。
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的希伯来语称呼及其一致性；在现代中文圣经语境中也自然、庄重。
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 准确表达引出神谕缘由的因果关系，也符合现代汉语表达。
- source_word: צֹּר
  choice: 推罗
  rationale: 采用该古城名称通行的中文译名。
- source_word: עַל יְרוּשָׁלִַם
  choice: 论到耶路撒冷
  rationale: עַל在言说动词之后可表示“论到”或“攻击”；这里正文保留“论到”的直接语义，而敌意由所说内容显明。
- source_word: הֶאָח
  choice: 哈！
  rationale: 表现推罗幸灾乐祸、嘲弄式的感叹，比中性的“啊”更贴合语境。
- source_word: נִשְׁבְּרָה
  choice: 破了
  rationale: 简洁表达Nifal被动兼结果状态，即门户已经遭到破坏。
- source_word: דַּלְתוֹת הָעַמִּים
  choice: 众民的门户
  rationale: דַּלְתוֹת形式上是复数“门扇／门”，但在此可整体指城门或通道；“门户”既保留意象，也可表达耶路撒冷作为各民通路或枢纽的功能。
- source_word: נָסֵבָּה אֵלַי
  choice: 已经转到我这里来了
  rationale: 保留“转向／转到”的空间隐喻，不在正文中把所转移的对象明确限定为贸易、财富或交通。
- source_word: אִמָּלְאָה
  choice: 我就必充盈
  rationale: 保留“被充满、变得丰足”的隐喻及推罗预期得利的含义，同时避免在正文中过度具体化为商业利润。
- source_word: הָחֳרָבָה
  choice: 她既已荒废
  rationale: 阴性单数在语境中指耶路撒冷；“荒废”自然表达城市遭毁后的状态，并保留其与推罗得利之间的逻辑联系。
theological_decisions:
- issue: דַּלְתוֹת הָעַמִּים对耶路撒冷的隐喻性描述
  choice: 众民的门户
  alternative: 众民的门扇；列国的城门
  rationale: 原文表达紧缩，可能把耶路撒冷描绘为许多民族往来的入口或枢纽。“门户”保留这一形象，却不把它缩减为单一的贸易解释。
- issue: נָסֵבָּה אֵלַי的主语和所指
  choice: 已经转到我这里来了
  alternative: 她转向我了；贸易转到我这里了
  rationale: 希伯来语的阴性动词可承接前面的“门／门户”，但实际所表达的优势、往来或利益并未明说。译文保留这种含混，不擅自补出“贸易”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哈”传达幸灾乐祸的语气；“门户”“转到我这里”“充盈”共同保留原文连续的隐喻，没有在正文中把它们限定为贸易术语。所有脚注标记均置于对应正文词语之后。
