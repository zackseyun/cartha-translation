id: EZK.26.1
reference: Ezekiel 26:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֛י בְּ/עַשְׁתֵּֽי עֶשְׂרֵ֥ה שָׁנָ֖ה בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/001.yaml
  text: And it happened in the eleventh year[a], on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: zh_hans
  text: 第十一年，某月初一[a]，耶和华的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“在该月的一日”，是指该月初一；本节没有注明月份编号。
    reason: textual_clarity
lexical_decisions:
- source_word: וַיְהִי
  choice: （不另译）
  rationale: 这是叙事性的承接形式，用来引入带日期的先知事件。现代汉语若再译成“事情发生了”会显得累赘；以日期直接起句，仍保留自然的叙事推进。
- source_word: בְּעַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: 第十一年
  rationale: 介词与序数日期短语在现代汉语中自然译为“第十一年”；原文没有在本节重述纪年所依据的事件。
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: 那月初一
  rationale: 这是希伯来语日期表达，直义近于“在那月的一日”，即该月初一。原文没有说明月份，故不补出具体月份。
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: 耶和华的话临到我
  rationale: 这是先知书常用的启示公式。虽然 הָיָה 的基本义是“有、成为”，汉语以“临到我”自然表达话语的启示性到来。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，将四字神名作为专名呈现，而不以“主”这一称号替代。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节的直接引语；汉语用“说：”简洁自然，并以冒号提示下文。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文采用“耶和华”可保留专名性质，也符合普通现代中文读者较熟悉的表达；不以“主”替代，避免把专名化为称号。
- issue: 日期中月份未注明
  choice: 保留“那月”的未定性，并加注说明
  alternative: 补作“某月”或推定具体月份
  rationale: 马所拉文本只写“那月初一”，没有给出月份数目。译文不依据上下文或其他文本传统擅自补定，以保留原文的缺省与不确定性。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。日期置于句首，省去希伯来语叙事起句 וַיְהִי 的机械直译；“临到我说”保留先知书公式化语气。脚注标记放在其实际说明的日期短语之后。
