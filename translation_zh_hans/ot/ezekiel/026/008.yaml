revisions:
- from: 他必用刀杀死你野外的属城[a]，筑起围城墙来攻打你，堆筑攻城坡道，又架起大盾牌来攻击你[b]。
  to: 他必用刀剑杀戮你在乡间附属城镇的居民，筑起攻城垒攻打你，堆起攻城坡道，又竖起大盾牌对付你[a]。
  rationale: 修订使“杀戮”的受事在汉语中明确，同时在脚注保留“女儿们”的字面表达及其所指的不确定性。以“攻城垒”避免把 דָּיֵק 定为特定的“围城墙”，并删去对举盾动作所附加的“攻击”目的语。脚注锚点置于“附属城镇”后更合适，故正文中的标记应改为“附属城镇[b]”；完整正文应为：他必用刀剑杀戮你在乡间附属城镇[b]的居民，筑起攻城垒攻打你，堆起攻城坡道，又竖起大盾牌对付你[a]。
