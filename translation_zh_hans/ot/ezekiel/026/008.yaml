base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/008.yaml
  text: He will kill your daughters in the field with the sword[a], set up a siege wall against you, throw up a siege ramp against you[b], and raise a large shield against you.
translation:
  language: zh_hans
  text: 他必用刀剑杀戮你在乡间附属城镇的居民，筑起攻城垒攻打你，堆起攻城坡道，又竖起大盾牌对付你[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大盾牌”也可能特指攻城时保护士兵的盾障或带遮蔽的防护设施。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹתַיִךְ
  choice: 你的属城
  rationale: 字面为“你的女儿们”，但在先知书和军事语境中常指隶属于一座主城的周边居民点。正文用现代汉语较易理解的“属城”，脚注保留字面表达及“村镇”的可能含义。
- source_word: בַּשָּׂדֶה
  choice: 野外
  rationale: 基本义为田野、旷野或乡间。针对推罗的语境可能特指大陆上的附属居民点，但正文不把这一推断绝对化。
- source_word: בַּחֶרֶב יַהֲרֹג
  choice: 必用刀杀死
  rationale: 忠实表达战争中以刀剑杀戮的工具性用法；“必”体现预言语境中的将来指向。
- source_word: דָּיֵק
  choice: 围城墙
  rationale: 这是围城设施的技术用语，具体形制并不完全确定；依单数形式译为“围城墙”，既符合上下文，也避免译成多个泛称的“工事”。
- source_word: סֹלְלָה
  choice: 攻城坡道
  rationale: 指围城时堆筑的土堤或斜坡；“堆筑攻城坡道”自然表达其建造方式和军事用途。
- source_word: צִנָּה
  choice: 大盾牌
  rationale: 该词通常指大型盾牌；在围城语境中也可能指供攻城人员使用的防护遮蔽物，因此正文保留基本词义，并在脚注说明具体可能性。
- source_word: וְנָתַן ... וְשָׁפַךְ ... וְהֵקִים
  choice: 筑起……堆筑……架起
  rationale: 这些动词在连续的预言叙述中具有将来指向；分别采用符合现代汉语攻城场景的动作词，并保留动作的连续性。
