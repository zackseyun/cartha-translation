source:
  edition: WLC
  text: וּ/נְתַתִּ֞י/ךְ לִ/צְחִ֣יחַ סֶ֗לַע מִשְׁטַ֤ח חֲרָמִים֙ תִּֽהְיֶ֔ה לֹ֥א תִבָּנֶ֖ה ע֑וֹד כִּ֣י אֲנִ֤י יְהוָה֙ דִּבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/014.yaml
  text: I will make you a bare rock[a], a place for spreading nets. You will not be rebuilt again, for I, Yahweh, have spoken[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 我必使你成为光秃的磐石，成为铺开渔网的地方[a]。你必不再被建造，因为我——耶和华——已经说了。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“铺晒渔网的地方。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךְ
  choice: 我必使你成为
  rationale: נתן后接表语时表示使受词成为某种状态；这样既符合希伯来语句法，也自然衔接后面的两个表语。
- source_word: לִצְחִיחַ סֶלַע
  choice: 光秃的磐石
  rationale: צְחִיחַ在此描写被剥蚀、无遮盖的岩面；“光秃”准确传达荒凉裸露的景象。
- source_word: מִשְׁטַח חֲרָמִים
  choice: 晾晒渔网的地方
  rationale: מִשְׁטַח指铺开东西的场所，חֲרָמִים在此指捕鱼用的网；“晾晒渔网”是自然的现代汉语，并保留具体图景。
- source_word: תִּהְיֶה
  choice: 成为
  rationale: 与前一分句合并表达第二个表语，避免汉语重复而不损失语义。
- source_word: לֹא תִבָּנֶה עוֹד
  choice: 你必不再被建造
  rationale: 保留בנה的尼法勒被动意义和עוֹד“不再、再也不”的时间意味，没有把措辞额外强化为抽象的绝对断言。
- source_word: כִּי אֲנִי יְהוָה דִּבַּרְתִּי
  choice: 因为我耶和华已经说了
  rationale: כִּי表达原因，完成式דִּבַּרְתִּי在宣告公式中强调话已经发出、必然成立；直接音译神名以区别于称号。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知书常见的神谕宣告公式；“主耶和华”分别体现אֲדֹנָי的称号和יְהוִה的神名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用现代中文读者最熟悉且明确作为专名的“耶和华”，避免以普通称号取代原文神名；同时不把特定宗派解释带入正文。
- issue: אֲדֹנָי יְהוִה的双重表达
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时含称号אֲדֹנָי和神名יְהוִה；“主耶和华”保留两者，不将其合并为单一称号。
- issue: “不再被建造”的预言力度
  choice: 保留被动式和“不再”的原文措辞
  alternative: 永远不得重建
  rationale: 原文明确说“不再被建造”，但没有在本分句另加“永远”一词；译文不额外扩大或削弱预言的力度。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留对推罗的第二人称直陈和先知宣告的确定语气；“光秃的磐石”“晾晒渔网的地方”保持具体、可见的毁灭图景。
