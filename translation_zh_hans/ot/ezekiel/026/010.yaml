  text: מִ/שִּׁפְעַ֥ת סוּסָ֖י/ו יְכַסֵּ֣/ךְ אֲבָקָ֑/ם מִ/קּוֹל֩ פָּרַ֨שׁ וְ/גַלְגַּ֜ל וָ/רֶ֗כֶב תִּרְעַ֨שְׁנָה֙ חֽוֹמוֹתַ֔יִ/ךְ בְּ/בֹא/וֹ֙ בִּ/שְׁעָרַ֔יִ/ךְ כִּ/מְבוֹאֵ֖י עִ֥יר מְבֻקָּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/010.yaml
  text: From the abundance of his horses their dust will cover you[a]; at the sound of horsemen and wheel and chariot your walls will quake when he enters your gates[b], as one enters a city that has been breached.
translation:
  language: zh_hans
  text: 因他的马匹众多，所扬起的尘土必遮盖你；骑兵、车轮和战车的响声，必使你的城墙震动。他进入你的城门时，如同进入一座已被攻破的城[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近似为“如同一座已被攻破之城的入口（或进入）”。“进入”一词在原文为复数形式，且此处句法含混；上下文所指是进入一座防线已被破开的城。
    reason: 保留מְבוֹאֵי的复数形式以及其“入口／进入”之间的词义、句法含混，不将未明示的主语确定为“人们”。
lexical_decisions:
- source_word: מִשִּׁפְעַת סוּסָיו
  choice: 因他的马匹众多
  rationale: שִׁפְעָה表示“丰盛、众多”；מִן在此表达原因。译文以现代汉语自然表达马匹数量之多是尘土扬起的原因。
- source_word: יְכַסֵּךְ אֲבָקָם
  choice: 扬起的尘土必遮盖你
  rationale: כסה直译为“遮盖”，אֲבָקָם为“它们的尘土”。补出“扬起的”说明尘土由大群马匹造成，但保留“遮盖你”的鲜明意象和对推罗的第二人称称呼。
- source_word: מִקּוֹל פָּרַשׁ וְגַלְגַּל וָרֶכֶב
  choice: 骑兵、车轮和战车的响声
  rationale: קוֹל译为“响声”；פָּרַשׁ虽为单数形式，在军事声响的列举中可作集合意义，故译“骑兵”。גַּלְגַּל和רֶכֶב也可有集合用法，汉语分别译作“车轮”和“战车”，不强行限定具体数量。
- source_word: תִּרְעַשְׁנָה חוֹמוֹתַיִךְ
  choice: 必使你的城墙震动
  rationale: רעשׁ表示震动、摇撼。希伯来语以“你的城墙”为主语；汉语采用使动句式，使响声与城墙震动的因果关系清楚，同时不改变语义。
- source_word: בְּבֹאוֹ בִּשְׁעָרַיִךְ
  choice: 他进入你的城门时
  rationale: 介词ב加不定式结构在此表示时间，“他进入……时”自然保留其时态关系；“你的”继续对应对推罗的阴性单数称呼。
- source_word: כִּמְבוֹאֵי עִיר מְבֻקָּעָה
  choice: 就像人们进入一座已被攻破的城
  rationale: מְבוֹאֵי字面为复数“入口／进入之处（或进入）”，结构较含混；上下文表达敌军进入已被突破防御的城。译作“人们进入”保留复数所暗示的多路或多人进入，又使汉语比直译“如被攻破之城的入口”更通顺。
- source_word: מְבֻקָּעָה
  choice: 已被攻破
  rationale: 该被动分词源于בקע，意为劈开、破开；用于城池时指防线或城墙已被打开缺口，译为“已被攻破”符合攻城语境。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。军事图景使用普通读者易懂的“骑兵、车轮和战车”；保留对推罗的第二人称“你”。分句重排为符合汉语信息流的三句，并用脚注呈现末尾比喻在希伯来语中的字面难点。
