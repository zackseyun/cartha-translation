base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/018.yaml
  text: Now the coastlands will tremble on the day of your downfall[b][a], and the islands that are in the sea will be terrified at your departure.
translation:
  language: zh_hans
  text: 如今，沿海各地[a]必在你倾覆的日子战栗；海中的众岛屿必因你的离去[b]而惊惶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“众岛屿”。希伯来语אִיִּים既可指岛屿，也可泛指沿海地区或海上地区。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“由于你出去”或“自你出去时起”。这里可能指推罗在审判中消失。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: 如今
  rationale: 表示推罗倾覆所带来的当前或紧接而来的结果；“如今”自然庄重，也保留先知话语的推进感。
- source_word: יֶחְרְדוּ
  choice: 必……战栗
  rationale: חרד表达因恐惧而发抖；“战栗”兼具身体反应与内心惧怕的意味。
- source_word: הָאִיִּן
  choice: 众海岸之地
  rationale: אִי的复数既可指岛屿，也可泛指沿海或海上地区。第一处没有“在海中”的限定，故采用范围较广的“海岸之地”，并以脚注保留另一可能。
- source_word: יוֹם מַפַּלְתֵּךְ
  choice: 在你倾覆的日子
  rationale: 直译该时间性结构，保留“日子”的先知性表达；“倾覆”适合描述推罗的败落和毁灭。
- source_word: וְנִבְהֲלוּ
  choice: 必……惊惶
  rationale: בהל的尼法勒式表示受惊、慌乱或惊恐；“惊惶”与前句“战栗”相应，同时保留两个希伯来动词的差别。
- source_word: הָאִיִּים אֲשֶׁר בַּיָּם
  choice: 海中的众岛屿
  rationale: 第二处有“在海中”的明确限定，因此译作“岛屿”比泛称“海岸之地”更贴合上下文。
- source_word: מִצֵּאתֵךְ
  choice: 因你的离去
  rationale: 字面为“因你出去”或“从你出去”；语境暗示推罗从历史舞台消失，但正文用“离去”保留原文隐喻及其一定程度的含混。
theological_decisions:
- issue: “离去”是否应明确解释为推罗在审判中灭亡或消失
  choice: 正文保留“离去”，脚注说明其语境含义
  alternative: 直接译为“消亡”或“从此消失”
  rationale: 原文使用普通动词יצא（出去），在本章审判语境中很可能指推罗的消失，但不宜在正文中把隐喻完全解释掉。
translation_notes:
  register: 采用现代、庄重而易懂的先知文学语体。“必……战栗／必……惊惶”保留预言的确定语气；第一处אִיִּים译为较宽泛的“海岸之地”，第二处因有“海中”限定而译为“岛屿”，从而反映原文语境差异。
