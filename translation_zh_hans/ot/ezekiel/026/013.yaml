  text: וְ/הִשְׁבַּתִּ֖י הֲמ֣וֹן שִׁירָ֑יִ/ךְ וְ/ק֣וֹל כִּנּוֹרַ֔יִ/ךְ לֹ֥א יִשָּׁמַ֖ע עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/013.yaml
  text: And I will put an end to the noise of your songs[a], and the sound of your lyres will be heard no more.
translation:
  language: zh_hans
  text: 我必使你歌声的喧嚣止息；你里拉琴的声音也必不再被听见。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: 我必使……止息
  rationale: שׁבת的使役形在此表示“使停止、使止息”；这一译法保留其使役含义和判决语气。
- source_word: הֲמוֹן שִׁירָיִךְ
  choice: 你歌声的喧响
  rationale: הֲמוֹן在歌曲和乐器的语境中指嘈杂、喧闹的声响，而非人数众多；“歌声的喧响”既保留名词结构，也符合现代汉语。
- source_word: וְקוֹל
  choice: 声音也
  rationale: קוֹל用于乐器时宜译为“声音”；“也”自然承接前一分句的并列关系。
- source_word: כִּנּוֹרַיִךְ
  choice: 你的里拉琴
  rationale: כִּנּוֹר指古代弦乐器，通常较准确地辨认为里拉琴；保留第二人称阴性单数所属关系，即对推罗的直接称呼。
- source_word: לֹא יִשָּׁמַע עוֹד
  choice: 必不再被听见
  rationale: שׁמע的Niphal形在此为被动意义“被听见”，עוֹד与否定词连用表示“不再”；“必”体现预言性宣告的确定语气。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“喧响止息”传达审判中繁华欢乐彻底终止的意味，同时没有把原文的声响名词结构改写得过于自由。
