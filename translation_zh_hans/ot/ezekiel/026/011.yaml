  text: בְּ/פַרְס֣וֹת סוּסָ֔י/ו יִרְמֹ֖ס אֶת כָּל חֽוּצוֹתָ֑יִ/ךְ עַמֵּ/ךְ֙ בַּ/חֶ֣רֶב יַהֲרֹ֔ג וּ/מַצְּב֥וֹת עֻזֵּ֖/ךְ לָ/אָ֥רֶץ תֵּרֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/011.yaml
  text: With the hoofs of his horses he will trample all your streets[a]; he will kill your people with the sword[b], and the pillars of your strength will come down to the ground.
translation:
  language: zh_hans
  text: 他必用马蹄践踏你所有的街道[a]；他必用刀杀死你的人民；你力量的柱石[b]必倒在地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “街道”也可译作“空地”或“广场”。
    reason: lexical_alternative
  - marker: b
    text: “你力量的柱石”也可译作“你力量的纪念柱”。希伯来语可能指与推罗权势有关的显著石柱或竖立的纪念物。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפַרְסוֹת סוּסָיו
  choice: 用马蹄
  rationale: 介词בְּ表示手段；“用马蹄”自然、准确地表达攻击者借其战马践踏城中的情景。
- source_word: יִרְמֹס
  choice: 践踏
  rationale: רמס指踩踏、蹂躏；“践踏”既保留具体动作，也符合军事毁灭的语境。
- source_word: כָּל חוּצוֹתָיִךְ
  choice: 你所有的街道
  rationale: חוּצוֹת可指街道、城中空地或广场；正文采用语境中较宽泛自然的“街道”，并以脚注保留其他可能。
- source_word: עַמֵּךְ בַּחֶרֶב יַהֲרֹג
  choice: 他必用刀杀死你的人民
  rationale: 直译其施事、工具和受事关系；“用刀杀死”保留希伯来文的具体战争意象。
- source_word: וּמַצְּבוֹת עֻזֵּךְ
  choice: 你那象征力量的柱石
  rationale: מַצֵּבוֹת可指竖立的石柱、柱石或纪念物；“象征力量的柱石”保留其实体性及与推罗力量的关联，避免具体化为军事设施。
- source_word: לָאָרֶץ תֵּרֵד
  choice: 必倒在地上
  rationale: ירד本义为下去、降下；用于柱石被毁的语境时，“倒在地上”是自然汉语，并未强加希伯来文没有明说的被动施事。
