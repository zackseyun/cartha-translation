  terminology: “主耶和华”“推罗”“尼布甲尼撒”“诸王之王”均可接受；“诸王之王”在此作对尼布甲尼撒帝王地位的称号，不应延伸为神学断言。脚注正确说明本节较接近“尼布甲尼利撒”的拼写。
