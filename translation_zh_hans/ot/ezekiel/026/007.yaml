source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֧י מֵבִ֣יא אֶל צֹ֗ר נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל מִ/צָּפ֖וֹן מֶ֣לֶךְ מְלָכִ֑ים בְּ/ס֛וּס וּ/בְ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים וְ/קָהָ֥ל וְ/עַם רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/007.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am bringing against Tyre Nebuchadnezzar king of Babylon from the north, king of kings, with horses and chariots and horsemen, and an assembly and a numerous people.'
translation:
  language: zh_hans
  text: 因为主耶和华如此说：“看哪，我必使巴比伦王尼布甲尼撒[a]，诸王之王，从北方来攻击推罗；他带着马匹、战车、骑兵、大军和众多的民众。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文的人名拼写更接近“尼布甲尼利撒”；正文采用中文通行的“尼布甲尼撒”。
    reason: 说明原文拼写与传统通行人名形式的差异。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并引出审判宣告的理由，保留希伯来语的因果衔接。
- source_word: כֹה אָמַר
  choice: 如此说
  rationale: 采用庄重而清楚的先知传信公式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的“主”和神名 יהוה 的传统中文译法“耶和华”。
- source_word: הִנְנִי מֵבִיא אֶל
  choice: 看哪，我要使……来攻击
  rationale: הִנְנִי 表示郑重提示和即将采取的行动；军事语境中的 אֶל 表示针对、攻击。
- source_word: צֹר
  choice: 推罗
  rationale: 采用现代中文圣经与历史地名的通行译名。
- source_word: נְבוּכַדְרֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用中文读者熟悉的通行人名形式，同时以脚注说明本节希伯来文的拼写差异。
- source_word: מִצָּפוֹן
  choice: 从北方
  rationale: 直接表达军队来袭的方向和来源。
- source_word: מֶלֶךְ מְלָכִים
  choice: 诸王之王
  rationale: 保留希伯来语的叠属结构，按此处上下文表示尼布甲尼撒的帝王权势，不将其扩展为绝对神学称号。
- source_word: בְּסוּס וּבְרֶכֶב וּבְפָרָשִׁים
  choice: 带着马匹、战车、骑兵
  rationale: 将军事集合名词按自然现代汉语表达，并保留三类军力。
- source_word: וְקָהָל וְעַם רָב
  choice: 以及大批人马和众多军兵
  rationale: 保留两个并列群体用语；“人马”表达集结的大队，“军兵”依军事语境具体化 עם，避免生硬的“众多人民”。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”在现代中文中既区分称号与专名，也保持庄重和可辨识性；不把神名泛化为普通称谓。
- issue: מֶלֶךְ מְלָכִים 是否应作绝对神学称号
  choice: 诸王之王
  alternative: 众王中的一王；统治众王的王
  rationale: 此处短语同位修饰巴比伦王，表达其帝国地位。译文保留原有强烈称号，但不额外加入定冠或神性解释。
translation_notes:
  register: 采用现代、庄重、易懂的先知宣告语体。“看哪”保留郑重提示；引号明确神谕内容。整体尽量贴近希伯来语句法，同时用“大批人马和众多军兵”避免逐词直译造成的生硬。
