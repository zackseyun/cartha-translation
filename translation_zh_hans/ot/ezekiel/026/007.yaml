revisions:
- from: 因为主耶和华如此说：“看哪，我要使巴比伦王尼布甲尼撒[a]从北方来攻击推罗；他是诸王之王，带着马匹、战车、骑兵，以及大批人马和众多军兵。”
  to: 因为主耶和华如此说：“看哪，我必使巴比伦王尼布甲尼撒[a]，诸王之王，从北方来攻击推罗；他带着马匹、战车、骑兵、大军和众多的民众。”
  rationale: 修订仅处理末尾两个并列群体名词：以“大军”对应军事语境中的קָהָל，以“众多的民众”对应עַם רָב，避免重复前面的马匹／骑兵，也不将“民众”限定为军兵。将“诸王之王”保留为与巴比伦王同位的称号，并以标点使结构更明晰。
