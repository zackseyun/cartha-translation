base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/004.yaml
  text: They will destroy the walls of Tyre and tear down her towers[a], and I will scrape her dust away from her and make her a bare rock.
translation:
  language: zh_hans
  text: 他们必毁坏推罗的城墙，拆毁她的塔楼；我也要刮去她的尘土[a]，使她成为光秃的岩石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尘土”或译“泥土”。希伯来语 עָפָר 可指尘土、松散的土或土壤；这里描写城址被彻底刮除，直到岩石裸露。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁחֲתוּ
  choice: 他们必毁坏
  rationale: שׁחת在围城语境中指毁坏防御工事；“毁坏”自然准确，并与下句“拆毁”有所区分。
- source_word: חֹמוֹת צֹר
  choice: 推罗的城墙
  rationale: חֹמוֹת是城防墙的复数；צֹר按现代中文通行译名译作“推罗”。
- source_word: וְהָרְסוּ מִגְדָּלֶיהָ
  choice: 拆毁她的塔楼
  rationale: הרס指拆除、推倒建筑物；מִגְדָּלֶיהָ直译为“她的塔楼”，保留城市的阴性拟人表达。
- source_word: וְסִחֵיתִי
  choice: 我也要刮去
  rationale: 此处动词表达从城址表面清除物质，直到岩层显露；“刮去”保留了彻底剥除的具体意象。
- source_word: עֲפָרָהּ מִמֶּנָּה
  choice: 她的尘土
  rationale: עָפָר可指尘土、松土或土壤；“尘土”较贴近基本词义，结合“刮去”清楚表达将城址表层清除。中文无需重复译出מִמֶּנָּה的“从她身上”，以免句式累赘。
- source_word: וְנָתַתִּי אוֹתָהּ
  choice: 使她成为
  rationale: נתן加表语在此表示使某物进入某种状态；“使她成为”自然地表达结果。
- source_word: לִצְחִיחַ סָלַע
  choice: 光秃的岩石
  rationale: 该短语描绘表层被剥尽、完全裸露的岩石；“光秃的岩石”清楚保留荒凉和暴露的形象。
