id: EZK.26.20
reference: Ezekiel 26:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הוֹרַדְתִּי/ךְ֩ אֶת י֨וֹרְדֵי ב֜וֹר אֶל עַ֣ם עוֹלָ֗ם וְ֠/הוֹשַׁבְתִּי/ךְ בְּ/אֶ֨רֶץ תַּחְתִּיּ֜וֹת כָּ/חֳרָב֤וֹת מֵֽ/עוֹלָם֙ אֶת י֣וֹרְדֵי ב֔וֹר לְמַ֖עַן לֹ֣א תֵשֵׁ֑בִי וְ/נָתַתִּ֥י צְבִ֖י בְּ/אֶ֥רֶץ חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/020.yaml
  text: Then I will bring you down with those who go down to the pit[a], to the people of long ago; and I will make you dwell in the land below, like ruins from ancient times, with those who go down to the pit, so that you will not be inhabited[c][b]. But I will set beauty in the land of the living.
translation:
  language: zh_hans
  text: 那时，我必使你与下坑的人一同下去，归到远古的人们[a]那里；我必使你住在地下深处[b]，与下坑的人同在，如同亘古的废墟，使你不再有人居住。我却要使活人之地有荣美[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “远古的人们”也可译作“古时的民”“上古之民”。
    reason: lexical_alternative
  - marker: b
    text: “地下深处”也可译作“地的低处”或“地下的最深处”。
    reason: lexical_alternative
  - marker: c
    text: “荣美”也可译作“华美”“荣光”或“荣耀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַדְתִּיךְ
  choice: 我必使你……一同下去
  rationale: 保留使役形式和向下运动的意象；阴性单数“你”在上下文中指推罗城。
- source_word: יֹרְדֵי בוֹר
  choice: 下坑的人
  rationale: 保留“坑”的具体意象，以及它在本段中兼有坟墓和阴间领域的含义。
- source_word: עַם עוֹלָם
  choice: 古时的民
  rationale: 此处 עוֹלָם 表示遥远的古代，而不是无穷的将来；译文保持该短语的凝练和古远感。
- source_word: וְהוֹשַׁבְתִּיךְ
  choice: 我必使你住
  rationale: 保留 ישׁב 使役词形的意义，也符合神对城发出审判宣告的语境。
- source_word: בְּאֶרֶץ תַּחְתִּיּוֹת
  choice: 在地下之地
  rationale: 直译其“下方之地／低处之地”的空间意象，不把它限定为后期神学术语。
- source_word: כָּחֳרָבוֹת מֵעוֹלָם
  choice: 如同亘古的废墟
  rationale: 同时表达比较词 כְּ、废墟意象和 מֵעוֹלָם 的久远时间含义。
- source_word: לְמַעַן לֹא תֵשֵׁבִי
  choice: 使你不再有人居住
  rationale: 动词字面为“你不居住”，但受话者是城市，汉语自然表达为该城不再有人居住。
- source_word: וְנָתַתִּי צְבִי
  choice: 我却要使……有荣美
  rationale: “却”呈现与前文下坑审判的语义对照；“荣美”保留 צְבִי 可指美丽、华美或荣耀的宽泛语义。
- source_word: בְּאֶרֶץ חַיִּים
  choice: 活人之地
  rationale: 保留希伯来语惯用表达，与“坑”和地下之地形成鲜明对照。
theological_decisions:
- issue: 末句 וְנָתַתִּי צְבִי בְּאֶרֶץ חַיִּים 的所指和含义
  choice: 译为“我却要使活人之地有荣美”，不具体说明这荣美指什么。
  alternative: 我却要把荣耀安置在活人之地／我却要恢复活人之地的华美
  rationale: 希伯来文简短，צְבִי 的具体所指并不明确。正文保留从下坑到活人之地的对照，而不擅自解释为某一特定对象或复兴事件。
- issue: לֹא תֵשֵׁבִי 对城市的表述
  choice: 按城市无人居住的意义译出。
  alternative: 使你不得居住／使你不得安居
  rationale: 语法上是第二人称阴性单数，神学与修辞上仍是直接对推罗城说话；意译为“无人居住”可避免现代汉语误以为城市本身像人一样居住。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。重复“下坑的人”以保存原文的环绕结构；“亘古的废墟”和“活人之地”保留先知文学的肃穆意象。所有脚注标记均置于正文相应词语之后。
