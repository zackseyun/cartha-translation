  text: וְ/שָׁלְל֣וּ חֵילֵ֗/ךְ וּ/בָֽזְזוּ֙ רְכֻלָּתֵ֔/ךְ וְ/הָֽרְסוּ֙ חוֹמוֹתַ֔יִ/ךְ וּ/בָתֵּ֥י חֶמְדָּתֵ֖/ךְ יִתֹּ֑צוּ וַ/אֲבָנַ֤יִ/ךְ וְ/עֵצַ֨יִ/ךְ֙ וַֽ/עֲפָרֵ֔/ךְ בְּ/ת֥וֹךְ מַ֖יִם יָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/012.yaml
  text: They will plunder your wealth and loot your merchandise. They will tear down your walls and demolish your splendid houses. They will throw your stones[a], your timbers, and your dust into the midst of the waters.
translation:
  language: zh_hans
  text: 他们要抢掠你的财富，劫夺你的货物；拆毁你的城墙，夷平你华美的房屋；把你的石头、木料和尘土[a]都投入水中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尘土”也可译作“土”；在这里也可能泛指城被拆毁后留下的碎屑。
    reason: 保留 עָפָר 的基本词义及其在拆城语境中的可能所指。
lexical_decisions:
- source_word: שָׁלְלוּ
  choice: 抢掠
  rationale: 该动词指在战争中夺取战利品；“抢掠”自然地保留了暴力掠夺的军事语境。
- source_word: חֵילֵךְ
  choice: 你的财富
  rationale: חַיִל 可指力量、军队或财富；本句与“货物”并列，且背景是商业城市推罗，因此经济含义最合适。
- source_word: בָזְזוּ
  choice: 劫夺
  rationale: 该词也表示强行夺取；用“劫夺”既保留暴力意味，又避免与前一动词机械重复。
- source_word: רְכֻלָּתֵךְ
  choice: 你的货物
  rationale: 此词指贸易货品；作为被夺取的对象，“货物”比抽象的“贸易”更贴合语境。
- source_word: הָרְסוּ חוֹמוֹתַיִךְ
  choice: 拆毁你的城墙
  rationale: הרס 用于毁坏、拆除建筑物；“拆毁”准确而自然。
- source_word: בָתֵּי חֶמְדָּתֵךְ
  choice: 你华美的房屋
  rationale: 该短语直指令人喜爱、珍视或称心的房屋；“华美”在推罗富庶的语境中传达其精美贵重，但不作过度发挥。
- source_word: יִתֹּצוּ
  choice: 夷平
  rationale: נתץ 常指拆毁或捣毁建筑；“夷平”与房屋搭配自然，并体现彻底毁坏。
- source_word: אֲבָנַיִךְ
  choice: 你的石头
  rationale: 直译为城市建筑遭毁后留下的石材。
- source_word: עֵצַיִךְ
  choice: 你的木料
  rationale: 字面为木材；在石头和拆城材料的语境中，“木料”比泛称“木头”更合适。
- source_word: עֲפָרֵךְ
  choice: 你的尘土
  rationale: עָפָר 的基本义为尘土、土；正文保留较贴近原文的“尘土”，并以脚注说明在此也可能涵盖拆毁后的碎屑。
- source_word: בְּתוֹךְ מַיִם יָשִׂימוּ
  choice: 投入水中
  rationale: 原文直译为“放在众水之中”；结合移动和倾倒拆城材料的语境，“投入水中”是自然准确的汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。三个分句以分号相连，保留原文连续推进的掠夺、拆毁和投入水中的动作。第二人称阴性单数均按对推罗城的拟人称呼译作“你”。
