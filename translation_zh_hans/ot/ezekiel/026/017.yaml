  to: '他们必为你唱起哀歌，对你说：


    “你怎么竟灭亡了！

    你这从众海而有人居住的城啊，[a]

    这受人称颂、在海中强盛的城！[b]

    你和你的居民，

    曾使所有住在她那里的人惊恐。[c]”'
  rationale: 修订恢复了原文的句法关系：受称颂且在海中强盛的是该城；“你和你的居民”则是“使人惊恐”的施事。对“从众海”的困难短语采用更通顺但不消除歧义的译法，并保留说明性脚注。末句依照马所拉文本保留“她”的回指及其不协调感。
