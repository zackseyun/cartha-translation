  text: וְ/נָשְׂא֨וּ עָלַ֤יִ/ךְ קִינָה֙ וְ/אָ֣מְרוּ לָ֔/ךְ אֵ֣יךְ אָבַ֔דְתְּ נוֹשֶׁ֖בֶת מִ/יַּמִּ֑ים הָ/עִ֣יר הַ/הֻלָּ֗לָה אֲשֶׁר֩ הָיְתָ֨ה חֲזָקָ֤ה בַ/יָּם֙ הִ֣יא וְ/יֹשְׁבֶ֔י/הָ אֲשֶׁר נָתְנ֥וּ חִתִּיתָ֖/ם לְ/כָל יוֹשְׁבֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/017.yaml
  text: They will raise a lament over you and say to you[a], ‘How you have perished, you who were inhabited from the seas, the praised city, which was strong in the sea, she and her inhabitants[c][b], who imposed their terror on all her inhabitants.’
translation:
  language: zh_hans
  text: '他们必为你唱起哀歌，对你说：


    “你怎么竟灭亡了！

    你这从众海而有人居住的城啊，[a]

    这受人称颂、在海中强盛的城！[b]

    你和你的居民，

    曾使所有住在她那里的人惊恐。[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从众海而有人居住”直译原文一个含义不易确定的短语；可能指居民来自各海域，或城从海上各地获得人口或供应。有些译本意译为“坐落在海口”。
    reason: lexical_alternative
  - marker: b
    text: “受人称颂”也可译为“著名”或“享有盛名”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“把他们的恐怖加给所有住在她那里的人”。末尾“她”在现有希伯来文本中最自然地指这座城，因此句意颇为困难；也有人理解为使海上或周围各地的居民惧怕。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: 唱起哀歌
  rationale: 这是希伯来语中表示发出、唱出哀歌的惯用结构；“唱起哀歌”既自然，也保留哀悼诗歌的语气。
- source_word: אָבַדְתְּ
  choice: 你怎么竟灭亡了
  rationale: אָבַד表示灭亡、毁灭；配合感叹词אֵיךְ译作“怎么竟……”，传达哀歌中的震惊与悲叹。
- source_word: נוֹשֶׁבֶת מִיַּמִּים
  choice: 从众海得居民的
  rationale: 原文是一个意义困难的被动分词短语，字面涉及“从众海被居住／得居民”。正文尽量保留其海上来源的意象，不擅自改成“坐落在海口”或单一定义为海运供应。
- source_word: הָעִיר הַהֻלָּלָה
  choice: 受人称颂的城
  rationale: הֻלָּלָה是הלל的被动形式，基本意义为“受称颂、受赞誉”；此译比单纯“著名”更贴近词形，同时在现代汉语中自然。
- source_word: חֲזָקָה בַיָּם
  choice: 在海中强盛
  rationale: 直译בַיָּם的“在海中”，并以“强盛”表达חזק所指的实力与势力。
- source_word: הִיא וְיֹשְׁבֶיהָ
  choice: 你和你的居民
  rationale: 希伯来文以阴性代词指回该城。汉语不必反复使用阴性第三人称，以第二人称承接哀歌对城的直接呼告，更为清楚自然。
- source_word: נָתְנוּ חִתִּיתָם
  choice: 使……都惊恐
  rationale: 字面为“把他们的恐怖给出”，实际表达造成恐惧、使人惊恐；此译保留主动致惧的含义。
- source_word: לְכָל יוֹשְׁבֶיהָ
  choice: 所有住在她那里的人
  rationale: 严格保留阴性单数后缀所指向的城市，不用补入原文没有明说的“沿海各地”或“全地”；由于按马所拉文本理解会形成语义张力，另加脚注说明。
theological_decisions:
- issue: 推罗城的拟人化
  choice: 在直接呼告中用“你”，在末句用“她”显明阴性城市拟人
  alternative: 全程按无生命地点译为“它”
  rationale: 原文对该城使用阴性形式，先知哀歌也常把城市人格化。中文以“你”承接呼告，并在有歧义的后缀处用“她”，既保留诗歌拟人，也不引入额外神学解释。
- issue: 末句恐惧对象的语义张力
  choice: 按马所拉文本译为“所有住在她那里的人”
  alternative: 解释为“所有海上的居民”或“全地的居民”
  rationale: 现有辅音文本的阴性单数后缀最直接地回指该城，尽管这会让句意显得困难。译文不依据推测性省略或校勘静默改写，而用脚注保留问题。
translation_notes:
  register: 采用现代、庄重而可诵读的先知哀歌体。分行呈现平行结构，以“怎么竟”表达אֵיךְ的感叹语气；对意义困难的短语保持适度直译，并以脚注说明可能解释，不在正文中消除原文张力。
