  yaml_path: translation/ot/ezekiel/026/009.yaml
  text: He will direct the blow of his battering ram against your walls[a], and with his axes he will tear down your towers.
translation:
  language: zh_hans
  text: 他必用攻城锤撞击你的城墙，用他的刀剑[a]拆毁你的塔楼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刀剑”也可能按这里的攻城语境理解为“斧头”或泛指“铁制工具”；但希伯来文本通常意为“刀剑”。
    reason: 说明传承文本的通常词义与围城语境所提示的工具性解释之间的张力。
lexical_decisions:
- source_word: מְחִי
  choice: 打击
  rationale: 该名词表示击打或撞击；“打击”既贴近原文，也符合攻城语境。
- source_word: קָבַלּוֹ
  choice: 他的攻城锤
  rationale: 此词在围城语境中指撞击城墙的攻城器械；“攻城锤”能让现代读者清楚理解具体意象。
- source_word: יִתֵּן
  choice: 要把……对准
  rationale: 字面义为“给、放、置”，这里表示将攻城锤的打击施加于城墙；“对准”在中文中自然地表达这一动作。
- source_word: בְּחֹמוֹתַיִךְ
  choice: 你的城墙
  rationale: 介词在击打语境中表示攻击所针对的对象；配合“对准”自然译作“你的城墙”。
- source_word: וּמִגְדְּלֹתַיִךְ
  choice: 你的城楼
  rationale: 该名词指城市防御工事中的塔楼；“城楼”准确而自然。
- source_word: יִתֹּץ
  choice: 拆毁
  rationale: 该动词表示打破、拆除或摧毁；“拆毁”保留了使建筑倒塌的动作感。
- source_word: בְּחַרְבוֹתָיו
  choice: 用他的刀剑
  rationale: 马所拉文本的辅音与读音均指向 חֶרֶב 的复数“刀剑”。尽管用刀剑拆毁城楼在语境上形成张力，正文仍直接保留传承文本，并在脚注说明可能的语境性理解。
