  yaml_path: translation/ot/ezekiel/026/019.yaml
  text: 'For thus says the Lord GOD: When I make you a ruined city[a], like the cities that are not inhabited, when I bring up the deep over you and the great waters cover you[b],'
translation:
  language: zh_hans
  text: 因为主耶和华如此说：“当我使你成为荒废的城，如同那些无人居住的城；当我使深渊涌上来，漫过你，大水淹没你时，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 以现代中文圣经读者熟悉的复合称号表达“主”与神的专名，同时避免译成不自然的“主主”。
- source_word: בְּתִתִּי אֹתָךְ עִיר נֶחֱרֶבֶת
  choice: 当我使你成为一座荒废的城
  rationale: נתן在此与宾语补语连用，表达“使……成为”；נֶחֱרֶבֶת表示遭毁坏后荒废的状态。
- source_word: כֶּעָרִים אֲשֶׁר לֹא נוֹשָׁבוּ
  choice: 像那些无人居住的城
  rationale: 自然表达ישב的被动式含义，即这些城没有居民，并保留与前句的比较结构。
- source_word: בְּהַעֲלוֹת עָלַיִךְ אֶת תְּהוֹם
  choice: 当我使深渊涌上来漫过你
  rationale: 保留עלה的上涌动态、עַל的压临意象以及תְּהוֹם所指的深渊或深海，不将其缩减为普通水流。
- source_word: וְכִסּוּךְ הַמַּיִם הָרַבִּים
  choice: 大水淹没你
  rationale: רַבִּים修饰“水”时可表示众多、浩大或强盛；“大水”既简洁自然，也保留洪水般的审判意象。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文中庄重且广为人知，也明确保留专名与称号的复合结构；正文不借此扩展任何宗派性解释。
- issue: תְּהוֹם的意象
  choice: 深渊
  alternative: 深海
  rationale: “深渊”保留该词可能具有的深海、洪涛乃至宇宙性深水意象，不把经文限定为单纯的海水上涨。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。原文是延续到下一节的句法结构，因此末尾保留逗号和未完语势；两个“当”对应原文两个介词性不定式结构，并维持审判宣告逐步推进的节奏。
