source:
  edition: WLC
  text: וְֽ/יָרְד֞וּ מֵ/עַ֣ל כִּסְאוֹתָ֗/ם כֹּ֚ל נְשִׂיאֵ֣י הַ/יָּ֔ם וְ/הֵסִ֨ירוּ֙ אֶת מְעִ֣ילֵי/הֶ֔ם וְ/אֶת בִּגְדֵ֥י רִקְמָתָ֖/ם יִפְשֹׁ֑טוּ חֲרָד֤וֹת יִלְבָּ֨שׁוּ֙ עַל הָ/אָ֣רֶץ יֵשֵׁ֔בוּ וְ/חָֽרְדוּ֙ לִ/רְגָעִ֔ים וְ/שָׁמְמ֖וּ עָלָֽיִ/ךְ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/016.yaml
  text: Then all the princes of the sea will come down from their thrones[a], remove their robes, and strip off their embroidered garments. They will clothe themselves with trembling, sit on the ground, tremble moment by moment[b], and be appalled at you.
translation:
  language: zh_hans
  text: 那时，海上的所有首领都要从自己的宝座上下来[a]，脱去长袍，除下刺绣的衣服。他们要以战兢为衣，坐在地上，不住地颤抖，并因你而惊骇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “海上的首领”也可译作“海上的王侯”，指掌管海上或沿海势力的统治者。
    reason: lexical_alternative
  - marker: b
    text: “因你而惊骇”也可译作“为你而震惊”或“因你而目瞪口呆”；希伯来语在这里兼有惊骇与震愕之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ מֵעַל כִּסְאוֹתָם
  choice: 都要从自己的宝座上下来
  rationale: “下来”自然表达 ירד；“从……宝座上”保留 מֵעַל 的空间关系，也凸显统治者离位受辱的意味。
- source_word: כֹּל נְשִׂיאֵי הַיָּם
  choice: 海上的所有首领
  rationale: נָשִׂיא 可指首领、领袖或王侯；“首领”在现代汉语中自然且不把其身份限定得过窄。הַיָּם 直译为“海”，此处指海上或沿海势力的统治者。
- source_word: מְעִילֵיהֶם
  choice: 长袍
  rationale: מְעִיל 指外袍或披袍；“长袍”清楚、庄重，并符合统治者服饰的语境。
- source_word: בִּגְדֵי רִקְמָתָם יִפְשֹׁטוּ
  choice: 除下刺绣的衣服
  rationale: רִקְמָה 表示刺绣或彩绣工艺；פשט 用于衣物时指脱下。“除下”与前句“脱去”形成自然平行，同时保留动作力度。
- source_word: חֲרָדוֹת יִלְבָּשׁוּ
  choice: 他们要以战兢为衣
  rationale: 原文直译近于“穿上战兢”，将恐惧描绘成衣服。“以战兢为衣”保留这一鲜明隐喻，也符合庄重的现代汉语。
- source_word: עַל הָאָרֶץ יֵשֵׁבוּ
  choice: 坐在地上
  rationale: 在身体姿态的语境中，הָאָרֶץ 译为“地上”最自然，并表达降卑、哀恸的姿态。
- source_word: וְחָרְדוּ לִרְגָעִים
  choice: 不住地颤抖
  rationale: לִרְגָעִים 字面为“在各个片刻”，可表达反复或持续发生；“不住地”以自然汉语传达这种连续、反复的颤抖。
- source_word: וְשָׁמְמוּ עָלָיִךְ
  choice: 并因你而惊骇
  rationale: שׁמם 在审判语境中可指惊骇、震惊或因荒凉而愕然；“因你而惊骇”保留 עַל 的因由关联，且不把语义过度限定为单纯惊讶。
