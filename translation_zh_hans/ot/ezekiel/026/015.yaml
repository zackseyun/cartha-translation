base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/015.yaml
  text: 'Thus says the Lord GOD to Tyre: Will not the coastlands quake at the sound of your fall[a], when the wounded groan[b], when the slaughter is carried out in your midst?'
translation:
  language: zh_hans
  text: 主耶和华对推罗如此说：“因你倾覆的轰响，因伤者的呻吟[a]，又因你城中进行的杀戮，众沿海地区[b]岂不都要震动吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伤者”也可译作“被杀者”；原文此词可指被刺伤或受致命伤的人。这里因与“呻吟”相连，正文译作“伤者”。
    reason: lexical_alternative
  - marker: b
    text: 原文此词也可译作“海岛”；在先知书中也常可泛指沿海地区或海上诸地。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 以现代中文圣经中清楚而庄重的复合称谓表达原文，同时保留神的专名“耶和华”。
- source_word: לְצוֹר
  choice: 对推罗
  rationale: 采用该腓尼基城市在现代标准中文中的通行译名。
- source_word: הֲלֹא
  choice: 岂不……吗
  rationale: 保留原文预期肯定回答的反问语气。
- source_word: מִקּוֹל מַפַּלְתֵּךְ
  choice: 因你倾覆的轰响
  rationale: מִן在此表示引发震动的原因；“轰响”自然呈现קוֹל在城池倾覆语境中的巨大声响，而“倾覆”保留מַפֶּלֶת的毁灭性意象。
- source_word: בֶּאֱנֹק חָלָל
  choice: 因伤者的呻吟
  rationale: חָלָל可指被刺伤者或被杀者；因其与“呻吟”相连，正文译作仍能呻吟的“伤者”，并以脚注保留“被杀者”的词义可能。
- source_word: בֵּהָרֵג הֶרֶג
  choice: 因……进行的杀戮
  rationale: 原文为动词不定式与同根名词的强化结构；“进行的杀戮”兼顾强调效果与中文自然度。
- source_word: בְּתוֹכֵךְ
  choice: 你城中
  rationale: 推罗被拟人化为阴性单数；中文明确为城中，可自然表达事件发生在推罗内部。
- source_word: יִרְעֲשׁוּ
  choice: 震动
  rationale: 既可表达实际震颤，也可表达因恐惧和巨变而受震撼，保留原词的双重力度。
- source_word: הָאִיִּים
  choice: 众海岛和沿海之地
  rationale: אִיִּים可指海岛，也可广指沿海或海上地区；正文并列两层含义，避免在推罗的海洋地缘语境中将范围不必要地缩窄。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文明确含四字神名；译作“主耶和华”既保留专名，又避免“主主”的重复，不以普通称号取代专名。
- issue: חָלָל 与呻吟相连时的理解
  choice: 伤者
  alternative: 被杀者
  rationale: 该词本可指被刺伤乃至被杀的人，但“呻吟”更直接支持尚存生命的伤者；以脚注保留较致命的词义范围，不消除原文张力。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。以三个“因”对应原文连续的情境成分，使反问句主干清楚；“你城中”明确推罗作为城市的拟人化指称。所有脚注标记均已置于正文相应位置。
