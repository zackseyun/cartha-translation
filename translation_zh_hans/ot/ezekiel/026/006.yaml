base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/006.yaml
  text: And her daughters who are in the field will be killed by the sword[b][a], and they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 她在野外的女儿[a][b]必被刀剑杀死；他们就会知道，我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女儿”也可译作“附属城镇”或“村庄”，指隶属于推罗的居民点。
    reason: lexical_alternative
  - marker: b
    text: 直译为“在野外”；这里可能指大陆上或乡间的居民点。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנוֹתֶיהָ
  choice: 她那些……女儿
  rationale: 保留希伯来文“她的女儿”这一城市拟人化表达；在先知性及地理语境中，它可指隶属于母城的居民点，具体含义用脚注说明。
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: 在野外的
  rationale: 直译为“在田野/野外的”。在推罗的语境中，很可能指海岛城以外、位于大陆或乡间的附属居民点；正文保留原文意象，脚注补充语境含义。
- source_word: בַּחֶרֶב
  choice: 被刀剑
  rationale: 这是表示战争中遭杀戮的常见工具性表达；“被刀剑杀死”既自然，也保留原文意象。
- source_word: תֵּהָרַגְנָה
  choice: 必……杀死
  rationale: הרג 的尼法勒未完成式第三人称阴性复数，具有被动意义；“必被……杀死”清楚表达预告中的将来结果。
- source_word: וְיָדְעוּ
  choice: 他们就会知道
  rationale: 保留以西结书常见的认识公式，并用“就会”体现审判所产生的结果。希伯来文阳性复数主语可泛指相关众人，不强行与前面的阴性复数“女儿”作语法同化。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 针对推罗的宣告中“她的女儿”所指为何
  choice: 正文保留“她的女儿”，理解为隶属于推罗的居民点，并在脚注中说明。
  alternative: 直指拟人化城市的女性后代；或直接译作“附属城镇/村庄”。
  rationale: 上下文谈论推罗及其附属地区受审判；希伯来文常以“女儿”称依附母城的社区。保留比喻并加注，能避免把一种解释直接写入正文。
- issue: “在野外”所指的地理范围
  choice: 正文直译“在野外”，脚注说明可能指大陆或乡间的居民点。
  alternative: 直接译为“在大陆上”或“在乡间”。
  rationale: בַּשָּׂדֶה 本身是“在田野/野外”，但推罗是海岛城，语境可能突出其大陆附属地。正文不消除这一真实的解释空间。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 音译神名可保留原文专名性质；“雅威”是现代学术及普通话语境中较直接的音译。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。正文保留“女儿”和“野外”两个希伯来语意象，以脚注解释其地理与城市拟人化用法；分号呈现审判及其结果之间的关系。
