source:
  edition: WLC
  text: בַּלָּה֥וֹת אֶתְּנֵ֖/ךְ וְ/אֵינֵ֑/ךְ וּֽ/תְבֻקְשִׁ֗י וְ/לֹֽא תִמָּצְאִ֥י עוֹד֙ לְ/עוֹלָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/021.yaml
  text: I will make you a terror[a], and you will be no more. Though you are sought, you will never again be found[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 我必使你成为令人惊骇之物，你将不复存在。人虽寻找你，却永远也找不到你[a]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“人将寻找你，却永远也找不到你。”原文各分句也可理解为并列的将来陈述，而不明确表达“虽……却……”的让步关系。
    reason: 句法歧义
lexical_decisions:
- source_word: בַּלָּהוֹת
  choice: 令人惊骇之物
  rationale: 该复数名词在此可作抽象或加强意义，描述推罗将成为引起惊骇的对象；此译法比直译“恐怖”更符合现代汉语，也保留审判语气。
- source_word: אֶתְּנֵךְ
  choice: 我必使你成为
  rationale: נתן本义为“给”，但与表语名词连用时，语义是“使……成为”或“立为”。
- source_word: וְאֵינֵךְ
  choice: 你就不复存在
  rationale: 否定存在句表达不再存在；“不复存在”自然、庄重，并符合此处对推罗的审判语境。
- source_word: וּתְבֻקְשִׁי
  choice: 人虽寻找你
  rationale: 原文是未完成式被动，可直译为“你将被寻找”。汉语用泛指主语“人”表达被动更自然；“虽”呈现与下句之间合理的让步关系，但另以脚注保留并列读法。
- source_word: וְלֹא תִמָּצְאִי
  choice: 却……找不到你
  rationale: מצא的尼法勒式为被动“被找到”。为配合前句的汉语主动表达，译为“找不到你”，不增添具体寻找者。
- source_word: עוֹד לְעוֹלָם
  choice: 永远再也
  rationale: עוד与לעולם合用，加强此后永不再发生的永久性；“永远再也找不到”在现代汉语中兼顾两个成分，且不显重复。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נאם是先知话语的宣告公式；אֲדֹנָי יְהוִה保留“主”这一称号及神名“耶和华”，按中文圣经传统作“主耶和华”。
theological_decisions:
- issue: 复合神圣称号אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时包含“主”和四字神名。中文读者普遍熟悉“耶和华”，可明确保留专名而避免将其仅译作普通称号；“雅威”是可能的音译，但不宜在正文中武断确定古代发音。
- issue: 寻找与找不到之间的句法关系
  choice: 让步关系：“人虽寻找你，却……”
  alternative: 并列未来句：“人将寻找你，却……”
  rationale: 希伯来语各分句由ו连接，本身未明确标示让步。上下文允许从语义上理解为让步，但并列读法同样成立，因此正文采用自然汉语的让步表达，并在脚注保留形式上更直接的读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“令人惊骇之物”保留原文将推罗变为恐怖对象的意象；全节以阴性单数“你”指推罗，中文不另作性别标记。
