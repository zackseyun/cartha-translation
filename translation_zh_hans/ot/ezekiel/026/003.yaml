  to: 所以，主雅威[a]如此说：“看哪，推罗，我必与你为敌；我要使许多国上来攻击你，好像海使波浪涌起一样。”
  rationale: 修订仅统一复合神名的译法，并将神的敌对审判宣告表达得更明确。其余措辞保留原稿对“使许多国上来”及海浪涌起意象的对应，未将“许多国”具体化为任何特定民族或历史事件。
