  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ צֹ֑ר וְ/הַעֲלֵיתִ֤י עָלַ֨יִ/ךְ֙ גּוֹיִ֣ם רַבִּ֔ים כְּ/הַעֲל֥וֹת הַ/יָּ֖ם לְ/גַלָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/003.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against you, Tyre, and I will bring up many nations against you, as the sea brings up its waves.'
translation:
  language: zh_hans
  text: 所以，主雅威[a]如此说：“看哪，推罗，我必与你为敌；我要使许多国上来攻击你，好像海使波浪涌起一样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文是“主雅威”（אֲדֹנָי יְהוִה）；“雅威”对应神的专名 יהוה（YHWH）。“主”对应 אֲדֹנָי。
    reason: 说明复合神名的原文构成及正文对四字神名的译法。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出审判宣告，保留其因果推论作用，同时符合现代汉语表达。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知书中庄重而固定的使者宣告格式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的“主”和 יהוה 的神圣专名；采用中文圣经读者熟悉的庄重形式，并以脚注说明。
- source_word: הִנְנִי עָלַיִךְ
  choice: 看哪……我与你为敌
  rationale: “看哪”传达 הִנְנִי 的强调和引人注意功能；在审判语境中，עַל 表示敌对立场，因此译作“与你为敌”。
- source_word: צֹר
  choice: 推罗
  rationale: 采用该古代腓尼基城邦在现代中文中的通行名称。
- source_word: וְהַעֲלֵיתִי עָלַיִךְ
  choice: 我要使……上来攻击你
  rationale: 保留 עלה 使役形“使上来”的运动意象，并用“攻击你”明确 עַל 在此处的敌对含义。
- source_word: גּוֹיִם רַבִּים
  choice: 许多国
  rationale: 在多国进军的语境中，גּוֹיִם 指众多国家或民族政治群体；“许多国”简洁准确。
- source_word: כְּהַעֲלוֹת הַיָּם לְגַלָּיו
  choice: 好像海使波浪涌起一样
  rationale: 保留海浪接连升起的比喻，并以“使……涌起”呼应前句使役形的动态意象。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时包含“主”这一称号与四字神名 יהוה。正文采用中文传统且广为人知的“主耶和华”，不把两个要素合并或省略；脚注提示其原文结构及神名性质。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”略带典雅色彩，但能自然承载原文的强调功能；句式保留“上来”与海浪“涌起”之间的意象呼应。
