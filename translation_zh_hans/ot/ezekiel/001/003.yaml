id: EZK.1.3
reference: Ezekiel 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָיֹ֣ה הָיָ֣ה דְבַר יְ֠הוָה אֶל יְחֶזְקֵ֨אל בֶּן בּוּזִ֧י הַ/כֹּהֵ֛ן בְּ/אֶ֥רֶץ כַּשְׂדִּ֖ים עַל נְהַר כְּבָ֑ר וַ/תְּהִ֥י עָלָ֛י/ו שָׁ֖ם יַד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/003.yaml
  text: the word of Yahweh came indeed to Ezekiel son of Buzi[a], the priest, in the land of the Chaldeans by the Kebar River[c][b], and there the hand of Yahweh came upon him.
translation:
  language: zh_hans
  text: 雅威的话确实临到布西的儿子以西结，就是那位祭司[a]，在迦勒底人之地、迦巴河边[b]；雅威的手在那里临到他[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “就是那位祭司”也可理解为“布西是祭司”。此外，希伯来文重复动词以加强语气，因此译作“确实临到”。
    reason: 句法歧义与希伯来文强调结构
  - marker: b
    text: “迦勒底人之地”也可译作“巴比伦地”；迦巴河可能是一条运河。
    reason: 地名与水道性质的译法说明
  - marker: c
    text: “雅威的手临到他”保留原文意象，表示雅威有力地作用在先知身上；也可译作“雅威的手在那里在他身上”。
    reason: 先知性习语与译法选择
lexical_decisions:
- source_word: הָיֹה הָיָה
  choice: 确实临到
  rationale: 希伯来文以同一动词的不定式绝对形配合限定动词，加强语气；用“确实”自然传达这种强调，而不机械重复动词。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留先知文献中“雅威的话”这一固定表达及其启示意义，不将其解释性地弱化为“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以头衔替代。
- source_word: יְחֶזְקֵאל בֶּן בּוּזִי הַכֹּהֵן
  choice: 布西的儿子以西结——他是祭司
  rationale: 按现代汉语习惯表达父子关系，并将“祭司”理解为对以西结的同位说明；脚注保留其所指在句法上的可能歧义。
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: 在迦勒底人之地
  rationale: 直译民族名称“迦勒底人”，同时用“之地”保留原文地域表达；“巴比伦地”作为语境化译法列入脚注。
- source_word: עַל נְהַר כְּבָר
  choice: 迦巴河边
  rationale: עַל在此表示临近水道的位置；“河边”是自然的现代汉语。“迦巴”按通行圣经地名音译，水道也可能是运河，见脚注。
- source_word: וַתְּהִי עָלָיו שָׁם יַד יְהוָה
  choice: 雅威的手在那里临到他
  rationale: 保留“雅威的手”这一先知性习语和“在那里”的地点成分；“临到”体现动态叙事形式，又不把该经历窄化解释为能力、默示或控制中的某一种。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其作为以色列之神专名的性质，避免以称号取代。
- issue: “雅威的手”这一先知性习语
  choice: 保留为“雅威的手在那里临到他”
  alternative: 雅威的能力临到他；雅威在那里抓住他；雅威的手在那里覆庇他
  rationale: 直保留身体隐喻，使神主动、有力地作用于先知的含义仍然开放，不限定为某一种神学解释。
- issue: “祭司”所修饰的对象
  choice: 正文理解为以西结是祭司，并以脚注说明另一种句法理解
  alternative: 理解为布西是祭司
  rationale: “祭司”紧随完整姓名与父称之后，通常被视为以西结的身份说明；但线性句法也容许其与布西相连，故不应隐去歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“临到”适合先知文献语体，并有意在前后两句重复，以呼应原文中神言与神手临及先知的结构。破折号明确正文所取的同位关系，脚注则保留潜在句法歧义。
