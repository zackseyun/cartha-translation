base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/025.yaml
  text: And there was a sound from above the expanse that was over their heads[a]; when they stood still[b], they let down their wings.
translation:
  language: zh_hans
  text: 于是，有声音从那在活物头顶上方的穹苍上面传来[a]；活物站住时，它们的翅膀就垂下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “声音”也可译作“话音”。希伯来语קוֹל可指“声音”或“话音”；本句尚未说明这是否是清楚说出的话。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 那时，有
  rationale: 该叙事形式引出一个随即出现的现象。“那时，有”既承接上文，又避免使用古奥的套语。
- source_word: קוֹל
  choice: 声音
  rationale: קוֹל既可指一般的声音，也可指说话的声音；此句尚未明说是言语，因此正文用较宽泛的“声音”，并以脚注保留“话音”的可能。
- source_word: מֵעַל לָרָקִיעַ
  choice: 从……穹苍之上传来
  rationale: מֵעַל表示声音来自穹苍以上；“穹苍”保留异象中的空间图景，而“传来”使现代汉语表达自然。
- source_word: אֲשֶׁר עַל רֹאשָׁם
  choice: 活物头顶上方的
  rationale: 关系从句修饰“穹苍”。补出“活物”以明确复数代词所指，避免汉语中的指代含混。
- source_word: בְּעָמְדָם
  choice: 活物站住时
  rationale: 介词ב与不定式结构表示时间情境；结合上下文活物行进与停下的对比，“站住”比单纯“站立”更准确。
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  choice: 翅膀就垂下
  rationale: רפה的使役形在此表达松弛、放低或垂落。希伯来语中阴性复数动词与随后出现的“翅膀”一致，因此译作翅膀自行“垂下”，不额外指定活物有意放下翅膀。
theological_decisions:
- issue: 穹苍上方传来的是一般声音还是可辨识的话音
  choice: 正文译为“声音”，脚注注明也可理解为“话音”
  alternative: 正文直接译为“话音”
  rationale: 本句的קוֹל本身容许两种理解，而明确的话语要到后文才出现；不宜在此提前消除原文的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“穹苍”保留以西结异象独特的空间意象；句中重复“活物”，使脱离上下文单独诵读时指代仍然清楚。
