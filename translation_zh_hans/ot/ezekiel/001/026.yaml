  text: וּ/מִ/מַּ֗עַל לָ/רָקִ֨יעַ֙ אֲשֶׁ֣ר עַל רֹאשָׁ֔/ם כְּ/מַרְאֵ֥ה אֶֽבֶן סַפִּ֖יר דְּמ֣וּת כִּסֵּ֑א וְ/עַל֙ דְּמ֣וּת הַ/כִּסֵּ֔א דְּמ֞וּת כְּ/מַרְאֵ֥ה אָדָ֛ם עָלָ֖י/ו מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/026.yaml
  text: And above the expanse that was over their heads was the likeness of a throne[a], in appearance like sapphire stone; and above the likeness of the throne was a likeness with the appearance of a man above it.
translation:
  language: zh_hans
  text: 在它们头上的穹苍之上，有宝座的形像，样子仿佛蓝宝石[a]；在那宝座形像之上，有一个形像，样子像人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能指“青金石”；希伯来语 sappir 所指的古代宝石究竟是哪一种，不能确定。
    reason: 词义可能项
lexical_decisions:
- source_word: רָקִיעַ
  choice: 穹苍
  rationale: 保留其作为展开之物的空间意象，并符合以西结异象中活物头上平台般穹苍的语境；比“穹顶”更少预设具体形状。
- source_word: כְּמַרְאֵה
  choice: 看起来仿佛／看起来像
  rationale: 保留异象描述中“所见外观近似于”的措辞，不把比拟直接等同于实体。
- source_word: אֶבֶן סַפִּיר
  choice: 蓝宝石
  rationale: 采用传统且通行的名称；原文已有“石”之义，现代汉语中“蓝宝石”本身已明确是宝石，避免重复成“蓝宝石石”。古代所指矿石未必等同于现代蓝宝石，故加注说明。
- source_word: דְּמוּת
  choice: 形像
  rationale: 反复译作“形像”，保留先知谨慎表达相似形态、而非直接认定本体的语言层次。
- source_word: כִּסֵּא
  choice: 宝座
  rationale: 异象具有明确的王权场景，“宝座”比一般的“座位”更符合语境。
- source_word: אָדָם
  choice: 人
  rationale: 此处指单一的人形样貌；现代汉语“人”自然准确，又不额外加入原文没有明说的身份。
- source_word: עָלָיו מִלְמָעְלָה
  choice: 在……上方
  rationale: 表达该人形形像位于宝座形像之上；汉语中不机械重复两个方位词，以自然方式保留空间关系。
theological_decisions:
- issue: 宝座之上形像的拟人描述
  choice: “有一个形像，看起来像人”
  alternative: “有一位像人的”／“有一个人的形体”
  rationale: 原文叠用 דְּמוּת 与 כְּמַרְאֵה，既报告人形显现，又避免将其直接等同于具有普通人体者。译文保留“形像”与“看起来像”的双重缓冲，不消解异象中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“穹苍”和“形像”以维持异象叙事的庄严感及关键词复现，同时以“看起来仿佛／像”自然呈现原文反复使用的比拟语言。
