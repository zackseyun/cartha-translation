id: EZK.1.13
reference: Ezekiel 1:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/דְמ֨וּת הַ/חַיּ֜וֹת מַרְאֵי/הֶ֣ם כְּ/גַחֲלֵי אֵ֗שׁ בֹּֽעֲרוֹת֙ כְּ/מַרְאֵ֣ה הַ/לַּפִּדִ֔ים הִ֕יא מִתְהַלֶּ֖כֶת בֵּ֣ין הַ/חַיּ֑וֹת וְ/נֹ֣גַהּ לָ/אֵ֔שׁ וּ/מִן הָ/אֵ֖שׁ יוֹצֵ֥א בָרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/013.yaml
  text: And as for the likeness of the living creatures[a], their appearance was like burning coals of fire, like the appearance of torches; it was moving about among the living creatures, and the fire had brightness[c][b], and from the fire lightning was coming forth.
translation:
  language: zh_hans
  text: 至于那些活物的形象，它们看上去好像燃烧的火炭[a]，又像火把的景象；它在活物中间往来[b]。火有光辉[c]，闪电从火中发出。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像发光的火炭”，或“像正在燃烧的炭火”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在活物中间四处移动”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译：“光辉归于火”；意思是火放射光辉。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת הַחַיּוֹת
  choice: 至于那些活物的形象
  rationale: דְּמוּת 表示“形象、样式、相像之状”；“形象”既保留异象语言，也不把它简化为一般的外观。句首用“至于”自然呈现希伯来语名词短语作为话题的结构。
- source_word: מַרְאֵיהֶם
  choice: 它们看上去
  rationale: מַרְאֶה 带第三人称复数后缀，说明这些活物呈现出的样子；译为“它们看上去”符合现代汉语，同时与前面的“形象”相区别，避免重复生硬。
- source_word: כְּגַחֲלֵי אֵשׁ בֹּעֲרוֹת
  choice: 好像燃烧的火炭
  rationale: גַּחֲלֵי אֵשׁ 是火炭，בֹּעֲרוֹת 描写其正在燃烧；“燃烧的火炭”保留名词意象和持续燃烧的动态。
- source_word: כְּמַרְאֵה הַלַּפִּדִים
  choice: 又像火把的景象
  rationale: לַפִּידִים 通常指火把；保留“景象”以对应 מַרְאֵה，并重现原文连续两次视觉比较的结构。
- source_word: הִיא
  choice: 它
  rationale: 阴性单数代词的确切所指可能是火、火一般的景象，或前述整体异象。“它”不强行锁定先行词，保留原文的含混。
- source_word: מִתְהַלֶּכֶת בֵּין הַחַיּוֹת
  choice: 在活物中间往来
  rationale: הלך 的 Hitpael 形式表达反复或四处活动；“往来”简洁地传达持续、反复的移动，בֵּין 与复数对象连用译作“中间”自然。
- source_word: וְנֹגַהּ לָאֵשׁ
  choice: 火有光辉
  rationale: נֹגַהּ 是光辉、亮光，לָאֵשׁ 表明它与火的所属或关联；此译贴近“火有光辉”的原句关系，又符合现代汉语。
- source_word: וּמִן הָאֵשׁ יוֹצֵא בָרָק
  choice: 闪电从火中发出
  rationale: בָּרָק 是闪电，יֹצֵא 为分词，描绘闪电不断从火中出来的鲜活场景；汉语现在态的“发出”可承载这一异象描写。
theological_decisions:
- issue: 阴性单数代词 הִיא 的所指
  choice: 译作不明确先行词的“它”，让它可指火或火一般的景象
  alternative: 明确译作“那火”，或明确译作“那景象”
  rationale: 上下文随后继续描写火的光辉和从火中发出的闪电，但语法上代词的具体先行词并非毫无疑义；使用“它”既维持连贯，也不替原文消除含混。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“活物”延续《以西结书》异象语境中的传统且清楚的称呼；句式保留原文层层推进的视觉描写，同时以分号和句号避免汉语长句过度拖沓。所有脚注标记均放在其实际说明的词组之后。
