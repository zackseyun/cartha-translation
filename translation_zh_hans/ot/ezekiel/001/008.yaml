  text: And they had human hands under their wings on their four sides[b][a]; and the four of them had their faces and their wings.
translation:
  language: zh_hans
  text: 它们四面，在翅膀下面，都有人的手[a]；这四个活物都有脸和翅膀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文句法十分紧缩，近直译为：“人的手在它们翅膀下面，位于它们四面；它们的脸和翅膀，归于它们四个。”本译文按上下文补明各部分之间的关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדוֹת אָדָם
  choice: 都有人的手
  rationale: יָדוֹת意为“手”，אָדָם在此说明手属于人的形态。希伯来文是无动词的压缩结构，汉语补出“有”，并用“人的手”自然表达。
- source_word: מִתַּחַת כַּנְפֵיהֶם
  choice: 翅膀下面
  rationale: מִתַּחַת表示位于某物之下；“翅膀下面”准确、自然。
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶם
  choice: 它们四面的
  rationale: רִבְעֵיהֶם在异象的空间描述中指四个方位或侧面；与上下文合并为“它们四面的翅膀下面”，表达手分布于四面。
- source_word: וּפְנֵיהֶם וְכַנְפֵיהֶם לְאַרְבַּעְתָּם
  choice: 这四个活物都有各自的脸和翅膀
  rationale: 原文句法省略且紧缩，לְאַרְבַּעְתָּם表明所述特征适用于四者。“各自”避免误解为四者共同拥有一组脸和翅膀；“活物”由紧接的上下文所指对象补明。
theological_decisions: []
