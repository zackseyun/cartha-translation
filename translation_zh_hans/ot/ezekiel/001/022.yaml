base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/022.yaml
  text: And above the heads of the living creatures there was the likeness of an expanse[a], like the appearance of awe-inspiring ice[b], stretched out above their heads from above.
translation:
  language: zh_hans
  text: 活物[a]的头顶上方有一片穹苍的形像；它看起来仿佛令人敬畏的冰[b]，从上方铺展在它们的头顶上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里使用单数集合形式，后面则以复数“它们”指这些活物。
    reason: lexical_alternative
  - marker: b
    text: 传统译作“水晶”；这个希伯来词通常意为“冰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: 有……的形像
  rationale: דְּמוּת表示“形像、样式、相似之物”。保留“形像”，以维持异象描述中的类比性质，而不把所见之物直接等同于穹苍。句首连接词按汉语叙述习惯不机械译出。
- source_word: הַחַיָּה
  choice: 活物
  rationale: 原文使用单数集合形式，后文却用复数词尾指向它们。“活物”在汉语中可作集合性称呼，并能与后面的“它们”自然衔接。
- source_word: רָקִיעַ
  choice: 穹苍
  rationale: 该词指铺展开来的广阔之物。采用现代圣经语境中仍通行的“穹苍”，既保留头顶上方铺展的空间意象，也避免把它过度具体化为实体穹顶。
- source_word: כְּעֵין
  choice: 看起来仿佛
  rationale: 原文强调视觉上的相似，而非直接认定其本体；“看起来仿佛”自然地保留这一层类比表达。
- source_word: הַקֶּרַח
  choice: 冰
  rationale: קֶרַח通常意为“冰”，因此正文采用其直接词义；传统译法“水晶”列入脚注。
- source_word: הַנּוֹרָא
  choice: 令人敬畏的
  rationale: 该词源于“惧怕／敬畏”，可表达使人震慑、畏惧的观感。“令人敬畏”兼顾异象中的威严与可畏性，避免只译成单纯的恐怖。
- source_word: נָטוּי
  choice: 铺展
  rationale: 这是נטה的被动分词，描绘某物在上方延伸展开；“铺展”符合穹苍的视觉形态，也较为自然。
- source_word: מִלְמָעְלָה
  choice: 从上面
  rationale: 依照原文保留垂直方位的强调；尽管与“头顶上”略有重复，这种重复正反映希伯来文的空间描写。
theological_decisions:
- issue: 异象中的类比语言
  choice: 保留“形像”和“看起来仿佛”两层相似性表达
  alternative: 简化为“它们头顶上有一片令人敬畏、如冰般的穹苍”
  rationale: 以西结谨慎地用דְּמוּת和כְּעֵין描述异象，并未直接断言所见之物的本体。保留层叠的类比语言，可避免把先知的描述说得比原文更确定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“穹苍”“形像”保留异象文本的圣经语体，但整句按现代汉语调整语序。正文中的[a]、[b]均与脚注对应。
