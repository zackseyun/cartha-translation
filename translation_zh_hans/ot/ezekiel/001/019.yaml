id: EZK.1.19
reference: Ezekiel 1:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְ/לֶ֨כֶת֙ הַֽ/חַיּ֔וֹת יֵלְכ֥וּ הָ/אוֹפַנִּ֖ים אֶצְלָ֑/ם וּ/בְ/הִנָּשֵׂ֤א הַֽ/חַיּוֹת֙ מֵ/עַ֣ל הָ/אָ֔רֶץ יִנָּשְׂא֖וּ הָ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/019.yaml
  text: When the living creatures moved[a], the wheels moved beside them; and when the living creatures were lifted up from the earth[b], the wheels were lifted up.
translation:
  language: zh_hans
  text: 活物行进[a]时，轮子也在它们旁边行进；活物从地上升起[b]时，轮子也一同升起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“走”；原文用同一个动词描述活物和轮子协调一致的运动。
    reason: lexical_alternative
  - marker: b
    text: 以西结后来说明这些“活物”是基路伯（见以西结书10:20）。
    reason: cross_reference
lexical_decisions:
- source_word: וּבְלֶכֶת
  choice: ……行进时
  rationale: 介词 בְּ 加动词 הלך 的不定式构造在此引出时间背景；“行进时”既自然，也保留运动含义。
- source_word: הַחַיּוֹת
  choice: 活物
  rationale: 此词在异象中指有生命的宝座活物，而非普通动物；“活物”准确、简洁，并未提前点明其后来揭示的基路伯身份。
- source_word: יֵלְכוּ
  choice: 行进
  rationale: הלך 基本义为“走、去”；此处同时描述活物和轮子的协调运动，“行进”适用于二者，并保留希伯来文重复同一动词的效果。
- source_word: הָאוֹפַנִּים
  choice: 轮子
  rationale: אופן 直接指“轮子”，复数形式对应异象中与活物相伴的多个轮子。
- source_word: אֶצְלָם
  choice: 在它们旁边
  rationale: אצל 表示靠近、在旁；该译法自然地传达轮子与活物之间紧密并行的位置关系。
- source_word: וּבְהִנָּשֵׂא
  choice: ……升起时
  rationale: נשׂא 的尼法勒不定式在此表示被举起或升起；中文“升起”可保留施动者未明的含混，不强行判定为自发还是受外力。
- source_word: מֵעַל הָאָרֶץ
  choice: 从地上
  rationale: 该短语字面为“从地面之上”；“从地上”以自然现代汉语表达离开地面的意思。
- source_word: יִנָּשְׂאוּ
  choice: 升起
  rationale: 与前面的 הִנָּשֵׂא 统一译作“升起”，保留原文词根重复以及轮子与活物同步运动的关系。
theological_decisions:
- issue: 异象中 הַחַיּוֹת 的身份
  choice: 正文泛称“活物”
  alternative: 基路伯
  rationale: 虽然以西结书10:20后来确认这些活物是基路伯，本节本身仍使用较宽泛的 חַיּוֹת；正文保留本节措辞，不以较后的揭示取代它。
- issue: “升起”的施动关系
  choice: 使用不明确施动者的“升起”
  alternative: 被举起／自行升起
  rationale: 尼法勒形式容许被动或中间态色彩，原文没有在本节明确施动者；中文不额外断定是外力举起还是自行上升。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语体。“行进”比“行走”更适合同时描述活物与轮子；两处“升起”保持原文重复和同步感。“它们”依现代普通话用于非人活物。
