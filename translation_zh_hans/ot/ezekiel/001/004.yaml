  text: וָ/אֵ֡רֶא וְ/הִנֵּה֩ ר֨וּחַ סְעָרָ֜ה בָּאָ֣ה מִן הַ/צָּפ֗וֹן עָנָ֤ן גָּדוֹל֙ וְ/אֵ֣שׁ מִתְלַקַּ֔חַת וְ/נֹ֥גַֽהּ ל֖/וֹ סָבִ֑יב וּ/מִ֨/תּוֹכָ֔/הּ כְּ/עֵ֥ין הַ/חַשְׁמַ֖ל מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/004.yaml
  text: And I looked[a], and behold, a storm wind was coming from the north, a great cloud with fire flashing continually, and brightness all around it; and from its midst was something like the appearance of glowing metal[c][b], from the midst of the fire.
translation:
  language: zh_hans
  text: 我观看，看哪，一股暴风从北方刮来；一片大云，火焰不断翻腾[a]，四围有光辉；从其中显出仿佛有发光金属[b]的样子，是从火中显出来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “火焰不断翻腾”：原文的表达含义较难确定；也可理解为火焰不断闪动、卷动，或按传统译法作“火焰自行卷聚”。
    reason: lexical_alternative
  - marker: b
    text: “发光的金属”：原文为罕见词，确切含义不明；可能指琥珀般的光彩，或金银合金（electrum）一类发亮的金属。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 我观看，只见
  rationale: ראה本义为“看、看见”；与הִנֵּה连用时，以“我观看，只见”自然保留先知主动观看和景象骤然呈现的语气。
- source_word: רוּחַ סְעָרָה
  choice: 一股暴风
  rationale: 该短语指猛烈的风暴；“暴风”不限定为旋转的龙卷风，也符合现代汉语习惯。
- source_word: בָּאָה מִן הַצָּפוֹן
  choice: 从北方刮来
  rationale: 结合主语“风”，用“刮来”表达景象正在逼近的动态。
- source_word: עָנָן גָּדוֹל
  choice: 一大片云
  rationale: 表达云体庞大，同时避免“大云”在现代汉语中的生硬感。
- source_word: אֵשׁ מִתְלַקַּחַת
  choice: 火焰不断翻腾
  rationale: 该反身形式含义困难，可能描写火不断卷动、闪动或自行炽盛；正文采用可读而不过度具体化的视觉表达，并以脚注保留不确定性。
- source_word: וְנֹגַהּ לוֹ סָבִיב
  choice: 四围光辉灿烂
  rationale: נֹגַהּ表示亮光或光辉；“四围”对应סָבִיב，并保留围绕整个云火景象的辉光。
- source_word: כְּעֵין הַחַשְׁמַל
  choice: 仿佛有发光的金属
  rationale: כְּעֵין是谨慎的外观类比；חַשְׁמַל为罕见且意义不确定的词，正文传达明亮金属般的视觉效果而不武断指定材质。
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: 在火焰中间
  rationale: 清楚表达该明亮物象显现在火中，同时在汉语中避免连续重复“从……中间”。
theological_decisions:
- issue: 异象中发光物质的具体身份
  choice: 用“仿佛有发光的金属”作现象性的近似描述
  alternative: 琥珀、琥珀金或某种明确合金
  rationale: 原文以类比措辞描述神显异象，且חַשְׁמַל词义不确定；译文不把视觉近似断定为特定物质，以保留原文的神秘性和张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我观看，只见”保留异象叙事的现场感；分号呈现由风暴云团到火中核心景象的层层推进。正文中的[a]、[b]均与脚注对应。
