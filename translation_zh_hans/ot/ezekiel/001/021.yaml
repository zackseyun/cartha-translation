id: EZK.1.21
reference: Ezekiel 1:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/לֶכְתָּ֣/ם יֵלֵ֔כוּ וּ/בְ/עָמְדָ֖/ם יַֽעֲמֹ֑דוּ וּֽ/בְ/הִנָּשְׂאָ֞/ם מֵ/עַ֣ל הָ/אָ֗רֶץ יִנָּשְׂא֤וּ הָ/אֽוֹפַנִּים֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/021.yaml
  text: When they went[a], these went; and when they stood, these stood; and when they were lifted up from above the earth, the wheels were lifted up alongside them[c][b], for the spirit of the living creatures was in the wheels.
translation:
  language: zh_hans
  text: 它们行走时，轮子也行走；它们站住时，轮子也站住；活物从地面上被举起时，轮子也在它们身旁一同被举起[b]，因为活物的灵[a][c]在轮子里面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“风”或“气息”。
    reason: lexical_alternative
  - marker: b
    text: “在它们身旁一同”也可译作“与它们相对”或“与它们相应”。
    reason: lexical_alternative
  - marker: c
    text: 原文“活物”是单数，可能以集合意义指众活物所构成的整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתָּם ... יֵלֵכוּ
  choice: 它们行走时，轮子也行走
  rationale: ב 加不定词构成时间从句；根据上下文补出后句主语“轮子”，使中文指代清楚，同时保留 הלך 的“行走”意象。
- source_word: וּבְעָמְדָם יַעֲמֹדוּ
  choice: 它们站住时，轮子也站住
  rationale: עמד 在此与行走相对，译作“站住”既保留“站立”含义，也自然表达停止移动。
- source_word: וּבְהִנָּשְׂאָם מֵעַל הָאָרֶץ
  choice: 活物从地面升起时
  rationale: נשׂא 的尼法勒式表示升起或被举起；中文“升起”自然且不强行指定施动者。מֵעַל הָאָרֶץ 在动态语境中译为“从地面”，表达离开地面而升起。
- source_word: יִנָּשְׂאוּ הָאוֹפַנִּים
  choice: 轮子也随它们升起
  rationale: 用“升起”与前句形成原文的动词呼应，并以“也”体现同步动作。
- source_word: לְעֻמָּתָם
  choice: 随它们
  rationale: 该词可表示与之相对、对应或在其旁边；在本节协调运动的语境中，“随它们”最自然地表达轮子与活物同步，但以脚注保留空间关系的其他可能。
- source_word: רוּחַ
  choice: 灵
  rationale: רוּחַ 可指灵、风或气息；此处说明轮子得以与活物同步行动的内在动力，“灵”最贴合语境，同时不将其明确等同于圣灵。
- source_word: הַחַיָּה
  choice: 活物
  rationale: 原文为带定冠词的单数，可能是集合用法，指异象中的众活物作为一个整体；汉语“活物”本身不强制标明单复数，可保留这一含混。
- source_word: בָּאוֹפַנִּים
  choice: 在轮子里面
  rationale: ב 表示处所；“在轮子里面”清楚呈现该灵位于轮子之内。
theological_decisions:
- issue: 异象中 רוּחַ 的含义
  choice: 灵
  alternative: 风；气息
  rationale: “灵”较符合使活物与轮子协调行动的生命动力之意，但原词具有多义性，因此在脚注中保留“风”和“气息”，且不进一步认定为圣灵。
- issue: הַחַיָּה 的数与集合意义
  choice: 活物
  alternative: 那个活物；众活物
  rationale: 原文形式为单数，却可能集合性地指前文多个活物。“活物”在中文中可不显明单复数，能较好保留原文张力。
- issue: לְעֻמָּתָם 所表达的关系
  choice: 随它们
  alternative: 在它们旁边；与它们相对；与它们相应
  rationale: 上下文强调同步运动，正文采用自然的“随它们”；脚注保留该词可能含有的空间或对应关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免连续代词造成歧义，在前两组平行句中明确补出“轮子”；保留原文行走、站住、升起的紧密重复。所有脚注标记均置于与其内容直接相关的词语之后。
