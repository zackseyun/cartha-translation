base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/016.yaml
  text: The appearance of the wheels and their workmanship was like the gleam of beryl[a], and the four of them had the same likeness; and their appearance and their workmanship were as if a wheel were within a wheel.
translation:
  language: zh_hans
  text: 轮子的外观和构造，如他施石[a]的光彩；四个轮子的形状都相同。它们的外观和构造，仿佛一个轮子在另一个轮子之中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“他施”，所指的具体宝石尚不能确定；传统上也译作“绿柱石”或“橄榄石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה הָאוֹפַנִּים
  choice: 轮子的外观
  rationale: מַרְאֶה指可见的外貌或形态；译作“外观”自然，并符合异象描写。
- source_word: וּמַעֲשֵׂיהֶם
  choice: 和构造
  rationale: מַעֲשֶׂה在这里可指制作、结构或构造；“构造”既说明轮子的制成形态，也适合现代汉语。两处采用同一译法，以保留原文的重复。
- source_word: כְּעֵין תַּרְשִׁישׁ
  choice: 闪耀如他施石
  rationale: כְּעֵין字面涉及“眼、外观”，在宝石语境中指可见的色泽或光彩；“闪耀如”传达其视觉效果。תַּרְשִׁישׁ所指宝石无法确定，因此正文音译并加注。
- source_word: וּדְמוּת אֶחָד לְאַרְבַּעְתָּן
  choice: 四个轮子的形状相同
  rationale: 原文为压缩表达，近于“四者有同一个形状”；此译清楚表达四轮一致，同时不增加具体结构细节。
- source_word: כַּאֲשֶׁר יִהְיֶה הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: 仿佛轮中套轮
  rationale: 保留比拟语气及“一个轮在另一个轮之中”的奇特构型；“轮中套轮”凝练、自然，且未进一步解释其机械关系。
