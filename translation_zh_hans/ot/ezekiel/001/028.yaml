revisions:
- from: 那光景好像雨天云中出现的虹[a]；周围光辉的景象也是这样。这就是耶和华荣耀之形像的显现[b]。我一看见，就俯伏在地，随后听见有一位说话的声音[c]。
  to: 雨天云中虹的景象怎样，周围光辉的景象也是怎样。这就是耶和华荣耀之形像的景象[b]。我看见这景象，就俯伏在地，听见一个声音在说话[c]。
  rationale: 修订以“景象”一致对应本节反复出现的视觉名词，并以平行句式清楚表达彩虹与周围光辉之间的比较。末句改为“一个声音在说话”，消除不自然的“有一位……的声音”结构，同时不对说话者作任何身份判断。脚注a在修订正文中没有对应的“弓／虹”歧义标记，故不置入正文；其内容仍完整保留于脚注集供词汇说明。
