language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּ/מַרְאֵ֣ה הַ/קֶּ֡שֶׁת אֲשֶׁר֩ יִֽהְיֶ֨ה בֶ/עָנָ֜ן בְּ/י֣וֹם הַ/גֶּ֗שֶׁם כֵּ֣ן מַרְאֵ֤ה הַ/נֹּ֨גַהּ֙ סָבִ֔יב ה֕וּא מַרְאֵ֖ה דְּמ֣וּת כְּבוֹד יְהוָ֑ה וָֽ/אֶרְאֶה֙ וָ/אֶפֹּ֣ל עַל פָּנַ֔/י וָ/אֶשְׁמַ֖ע ק֥וֹל מְדַבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/028.yaml
  text: Like the appearance of the rainbow that is in the cloud on a day of rain[a], so was the appearance of the brightness all around. This was the appearance of the likeness of the glory of Yahweh. When I saw it, I fell on my face[d][c][b], and I heard the voice of one speaking.
translation:
  language: zh_hans
  text: 雨天云中虹的景象怎样，周围光辉的景象也是怎样。这就是耶和华荣耀之形像的景象[b]。我看见这景象，就俯伏在地，听见一个声音在说话[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文逐层表述为“耶和华荣耀之形像的景象”，保留了以西结异象叙述中的多重限定。
    reason: cultural_note
  - marker: c
    text: 或译：“我听见一个说话的声音。”原文在本句没有明确说明说话者是谁。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמַרְאֵה הַקֶּשֶׁת
  choice: 好像……虹
  rationale: מַרְאֶה指可见的景象或外观；כְּ引出比喻。קֶשֶׁת本义为“弓”，但云雨语境明确指虹。
- source_word: אֲשֶׁר יִהְיֶה בֶעָנָן בְּיוֹם הַגֶּשֶׁם
  choice: 雨天云中出现的
  rationale: 以自然、现代的汉语表达虹在下雨之日出现于云中的情景，同时不增添原文以外的解释。
- source_word: מַרְאֵה הַנֹּגַהּ סָבִיב
  choice: 周围光辉的景象
  rationale: נֹגַהּ可指光辉、明亮或光芒；“光辉”兼顾可懂性和异象语体，סָבִיב译为“周围”。
- source_word: מַרְאֵה דְּמוּת כְּבוֹד יְהוָה
  choice: 耶和华荣耀之形像的显现
  rationale: 保留“显现—形像—荣耀”的层层限定，避免把异象直接等同于上帝本体；“显现”在此表达可见的外观。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代中文圣经读者熟悉的专名形式呈现四字神名，而非以“主”这一称号替代。
- source_word: וָאֶפֹּל עַל פָּנַי
  choice: 就俯伏在地
  rationale: 希伯来语直译为“仆倒在我的脸上”，是表示敬畏或降服的惯用语；“俯伏在地”自然传达动作。
- source_word: וָאֶשְׁמַע קוֹל מְדַבֵּר
  choice: 听见有一位说话的声音
  rationale: קוֹל在此宜作“声音”；分词מְדַבֵּר没有明说说话者身份，“有一位”保留其不确定性。
theological_decisions:
- issue: 如何翻译描述神圣显现的多层限定语
  choice: 耶和华荣耀之形像的显现
  alternative: 耶和华荣耀的形像；耶和华荣耀的显现
  rationale: 原文连续使用“显现/景象、形像、荣耀”，体现以西结叙述异象时的谨慎。保留三层概念，不把所见直接简化成耶和华的荣耀或耶和华本身。
- issue: 是否明确末句说话者的身份
  choice: 听见有一位说话的声音
  alternative: 听见他说话的声音；听见一个声音在说话
  rationale: 本节的希伯来文只用阳性单数分词“说话的”，没有明确指认说话者；译文因此不作进一步的神学认定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“光景—景象—显现”适度重现原文מַרְאֶה的反复，又避免中文机械重复；以“之”维持核心叠加短语的紧密和庄严。所有脚注标记均置于正文相应位置。
