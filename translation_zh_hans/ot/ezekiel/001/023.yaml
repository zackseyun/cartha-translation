base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/023.yaml
  text: And under the expanse their wings were straight[a], each one toward her sister. Each had two covering them[b], and each had two covering their bodies.
translation:
  language: zh_hans
  text: 在穹苍下面，它们的翅膀直展，彼此相对。每一个都有两只翅膀遮盖着它们，又有两只翅膀遮盖着它们的身体。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתַחַת הָרָקִיעַ
  choice: 在穹苍下面
  rationale: 直接表达空间关系；“穹苍”保留רָקִיעַ在异象中如穹顶般展开之物的具体意象。
- source_word: כַּנְפֵיהֶם יְשָׁרוֹת
  choice: 它们的翅膀平直伸展
  rationale: יְשָׁרוֹת表示平直或排列整齐；结合下句所述朝向，译作“平直伸展”自然且保留视觉形象。
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: 彼此相对
  rationale: 希伯来文直译为“一个女人朝向她的姊妹”，阴性形式与“翅膀”的语法性别一致；这里用现代汉语表达各翼互相对应的意思，并以脚注保留原文特色。
- source_word: לְאִישׁ שְׁתַּיִם מְכַסּוֹת לָהֵנָּה
  choice: 每一个都有两只翅膀遮着自己
  rationale: לְאִישׁ为分配用法，意为“每一个”；补出“都有”和“翅膀”以符合汉语表达。לָהֵנָּה所指略显含混，按上下文译为遮着各活物自己。
- source_word: אֵת גְּוִיֹּתֵיהֶם
  choice: 身体
  rationale: גְּוִיָּה可指身体或尸体；此处描述活物，故应为“身体”。
