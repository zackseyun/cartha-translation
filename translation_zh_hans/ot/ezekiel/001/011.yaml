  text: And their faces and their wings were separated above[a]; each had two joined to one another[b], and two covering their bodies.
translation:
  language: zh_hans
  text: 它们的脸和翅膀在上方分开[a]；每个活物都有两只翅膀相接[b]，另有两只遮盖自己的身体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按原文在“它们的脸”后的重音停顿，将“它们的脸”理解为承接上一节；也可译为“它们的翅膀在上方分开”。“分开”一词也可能在上下文中指向上伸展或展开。
    reason: syntactical_ambiguity
  - marker: b
    text: 原文较直译为：“每一个有两只相接，每一个……”。上下文可能指各活物的两只翅膀与别的活物的翅膀相接。
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: וּפְנֵיהֶם
  choice: 它们的脸就是这样
  rationale: 原文仅说“它们的脸”，语句简略；结合上一节对四张脸的描述，并参考“它们的脸”之后的强停顿符号，译出承接上文的省略意思。
- source_word: וְכַנְפֵיהֶם פְּרֻדוֹת מִלְמָעְלָה
  choice: 它们的翅膀在上方分开
  rationale: פְּרֻדוֹת源自“分开、分离”，保留其基本词义；מִלְמָעְלָה表示上方或向上的方位。上下文也可能指翅膀向上展开，故列入脚注。
- source_word: לְאִישׁ
  choice: 每个活物各有
  rationale: אִישׁ在这里具有逐一分配的意思；补出“活物”和“有”，使中文清楚自然。
- source_word: שְׁתַּיִם חֹבְרוֹת אִישׁ
  choice: 两只翅膀与另一个活物的翅膀相接
  rationale: חבר表示连接或相接；原文以重复的אִישׁ简略表达各活物与另一活物之间的关系，中文补明被省略的“翅膀”。
- source_word: וּשְׁתַּיִם מְכַסּוֹת אֵת גְּוִיֹתֵיהֶנָה
  choice: 另有两只遮盖身体
  rationale: 分词מְכַסּוֹת表达持续的描写；גְּוִיָּה在此指活物的身体，不宜限定为背部。
