base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/009.yaml
  text: Their wings were joined[a], each to her sister. As they moved, they did not turn[b]; each one went straight ahead.
translation:
  language: zh_hans
  text: 它们的翅膀彼此相连[a]。它们行进时并不转向；各自都朝着自己面向的方向前行[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一个女子对着她的姊妹”，这里是指对应的翅膀彼此相连。
    reason: lexical_alternative
  - marker: b
    text: 或译：“各自都一直向前走。”
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבְרֹת
  choice: 相连
  rationale: 该词是חבר的阴性复数被动分词，表示处于连接、联结的状态；“相连”自然保留了其状态和被动含义。
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: 彼此
  rationale: 字面为“一个女子对着她的姊妹”，在这里是对应部分互相配合或连接的惯用表达；中文用“彼此”可自然传达分配与相互关系，字面意象则收入脚注。
- source_word: כַּנְפֵיהֶם
  choice: 它们的翅膀
  rationale: 直接译出所属关系；所指为前文的活物，现代中文用“它们”恰当。
- source_word: לֹא יִסַּבּוּ
  choice: 并不转向
  rationale: סבב在运动语境中表示转弯或改变方向；“并不转向”既准确又符合异象叙事的庄重语体。
- source_word: בְּלֶכְתָּן
  choice: 行进时
  rationale: 介词ב加不定式附属形表示伴随或同时发生的动作；“行进时”简洁地表达“在它们行走之时”。
- source_word: אִישׁ
  choice: 各自
  rationale: 阳性单数אִישׁ在此作分配用法，指每一个活物，而非强调男性；“各自”保留分配意义。
- source_word: אֶל עֵבֶר פָּנָיו
  choice: 朝着自己面向的方向
  rationale: 字面涉及“脸所朝的一边／方向”；此译保留“脸面所向”的具体含义，不额外加入原文未明说的“笔直”。
- source_word: יֵלֵכוּ
  choice: 前行
  rationale: הלך是“走、去、行进”；在此与运动方向连用，“前行”自然且保持叙事连续性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彼此相连”避免生硬照搬希伯来语的阴性惯用语；末句保留“面向的方向”这一原文意象，并以脚注列出更简洁的惯用译法。
