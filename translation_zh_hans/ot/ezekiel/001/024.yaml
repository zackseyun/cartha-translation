id: EZK.1.24
reference: Ezekiel 1:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֣ע אֶת ק֣וֹל כַּנְפֵי/הֶ֡ם כְּ/קוֹל֩ מַ֨יִם רַבִּ֤ים כְּ/קוֹל שַׁדַּי֙ בְּ/לֶכְתָּ֔/ם ק֥וֹל הֲמֻלָּ֖ה כְּ/ק֣וֹל מַחֲנֶ֑ה בְּ/עָמְדָ֖/ם תְּרַפֶּ֥ינָה כַנְפֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/024.yaml
  text: And I heard the sound of their wings[a], like the sound of many waters, like the sound of the Almighty when they went, a sound of tumult like the sound of an army camp. When they stood still[b], they lowered their wings.
translation:
  language: zh_hans
  text: 我听见它们的翅膀的响声，像众水的声音，像全能者[a]的声音；它们行走时，那喧嚷声像军营[b]的声音。它们站住时，就垂下翅膀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全能者”的希伯来文是שַׁדַּי（可音译为“沙代”），是神的称号。
    reason: 说明神圣称号的原文形式和音译可能，同时保留正文的传统语义译法。
  - marker: b
    text: “军营”也可译作“营地”。
    reason: 原词מַחֲנֶה可泛指营地，但在许多语境中指军队的营盘。
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: 我听见
  rationale: 该词是שׁמע的第一人称单数叙事形式，承接异象叙述；现代汉语无须机械加入“于是”，句序本身即可表达推进。
- source_word: קוֹל
  choice: 响声／声音
  rationale: קוֹל可指声音、嗓音或声响。本节主要描写翅膀及其他事物发出的巨大声响；首次译作“响声”较自然，在比喻中用“声音”保持流畅。
- source_word: כַּנְפֵיהֶם
  choice: 它们翅膀
  rationale: 直译带第三人称复数后缀的复数名词；所指承接前文的活物，故用“它们”。
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: 像众水的声音
  rationale: 保留原文“许多／浩大众水”的圣经意象，不具体化为原文未明说的浪涛或急流。
- source_word: שַׁדַּי
  choice: 全能者
  rationale: 这是神的称号；译出其传统语义，且不把比较限定为神亲口说话。
- source_word: בְּלֶכְתָּם
  choice: 它们行走时
  rationale: 介词ב加不定式结构表示伴随的时间情境；此译清楚呈现翅膀发声与活物行进的关系。
- source_word: הֲמֻלָּה
  choice: 喧嚷声
  rationale: 该名词表示嘈杂、激荡的巨大声响；“喧嚷声”自然且不额外指定声响来源。
- source_word: כְּקוֹל מַחֲנֶה
  choice: 像军营的声音
  rationale: מַחֲנֶה基本义为营地，语境中通常指军队驻营；正文采用自然的“军营”，脚注保留较宽泛的译法。
- source_word: בְּעָמְדָם
  choice: 它们站住时
  rationale: 与“它们行走时”形成明确对照；“站住”比单说“站立”更能表达停止行进。
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  choice: 就垂下翅膀
  rationale: רפה的使役形式在此表示使翅膀松下、下垂；“垂下”符合现代汉语对翅膀停止展开或振动的表达。
theological_decisions:
- issue: 神圣称号שַׁדַּי的译法
  choice: 全能者
  alternative: 沙代
  rationale: 正文翻译称号的传统语义，便于普通读者理解；脚注保留音译，避免掩盖希伯来文在词源和称号性质上的讨论空间。
- issue: “全能者的声音”的所指
  choice: 保持为“全能者的声音”
  alternative: 全能者说话的声音
  rationale: 原文仅作声音上的比较，并未明确说这是神发出的言语，因此不补入“说话”。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“众水”这一凝练的圣经意象；用“喧嚷声”“军营”“垂下”等普通读者易懂的词语，避免古奥措辞和过度解释。
