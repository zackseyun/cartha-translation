  source_fidelity: 原文首句的主语是“那灵”，其后“他们”指活物；现译“灵要往哪里去”基本准确。但“轮也随着它们升起”将 לְעֻמָּתָם 所表达的与活物相应、并行的位置关系弱化为单纯随同，并且“升起”较未充分保留 יִנָּשְׂאוּ 的被动义。
  naturalness: “那灵要往哪里去，活物就往那里去”符合现代汉语且庄重自然。“轮也被举起，与它们一同上升”更清晰地表达轮与活物的对应同步，避免“随着”可能暗示轮只是跟随而非同受举起。
  terminology: “灵”“活物”“轮”均适切，并保留 רוּחַ 是否指神之灵的开放性。为避免把集合单数 הַחַיָּה 误解为单一活物，正文的“它们”可由上下文自然指向活物群；脚注维持原有神学歧义。
