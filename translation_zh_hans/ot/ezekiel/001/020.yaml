  text: עַ֣ל אֲשֶׁר֩ יִֽהְיֶה שָּׁ֨ם הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ שָׁ֥מָּ/ה הָ/ר֖וּחַ לָ/לֶ֑כֶת וְ/הָ/אוֹפַנִּ֗ים יִנָּשְׂאוּ֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/020.yaml
  text: Wherever the spirit wanted to go[a], they went there; and the wheels were lifted up alongside them[c][b], because the spirit of the living creature was in the wheels.
translation:
  language: zh_hans
  text: 那灵要往哪里去[a][c]，活物就往那里去；轮也被举起，与它们一同上升[b]，因为活物的灵在轮中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“风”或“气息”；希伯来语 רוּחַ 可有这些含义。这里指异象中赋予行动并加以引导的灵。
    reason: lexical_alternative
  - marker: b
    text: “与它们一同上升”也可译作“在它们对面”或“与它们相应”。
    reason: lexical_alternative
  - marker: c
    text: 有些读者认为这里的“灵”是指神的灵；希伯来原文并未明确作出这一认定。
    reason: alternative_reading
lexical_decisions:
- source_word: הָרוּחַ / רוּחַ
  choice: 灵
  rationale: רוּחַ可指“风”“气息”或“灵”。本节中它表示支配异象中活物与轮行动的内在动力或导向；译作“灵”既符合语境，也不擅自明确为“神的灵”。
- source_word: עַל אֲשֶׁר יִהְיֶה שָּׁם
  choice: 往哪里
  rationale: 这一结构引出不定处所关系，表达“无论在哪里／往哪里”的意思；结合运动动词，译作“往哪里”自然清楚。
- source_word: לָלֶכֶת ... יֵלֵכוּ
  choice: 要往……去……就往……去
  rationale: 不定式与未完成式共同表达受灵导向的行动意向及随后的行动；“要……就……”在现代汉语中自然体现这种对应关系。
- source_word: שָׁמָּה
  choice: 那里
  rationale: 该方向副词表示“到那里”；汉语运动动词“往那里去”自然保留其方向意义。
- source_word: הָאוֹפַנִּים
  choice: 轮
  rationale: 指异象中所见的轮；汉语以“轮”表达复数时无需强加复数标记。
- source_word: יִנָּשְׂאוּ
  choice: 升起
  rationale: 原文是נשׂא的尼法勒式，含被举起或升起之意；“升起”简洁自然，并符合异象场景。
- source_word: לְעֻמָּתָם
  choice: 随着它们
  rationale: 该词表示与活物相对、对应或并行的位置关系；在移动语境中，“随着它们”清楚表达轮与活物同步升起。
- source_word: הַחַיָּה
  choice: 活物
  rationale: 原文为单数形式，但在上下文中可作集合性表达；“活物”既保留以西结异象中的惯用称呼，也不必在汉语中硬加复数形式。
theological_decisions:
- issue: רוּחַ是否应明确译为指圣灵的“神的灵”
  choice: 灵
  alternative: 神的灵／圣灵
  rationale: 经文本身没有明确把这里的רוּחַ认定为神的灵。译作“灵”保留原文的神学张力，避免加入超出希伯来文本的明确认定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“活物”“轮”延续本章异象的核心术语；“要……就……”呈现灵的导向与活物行动之间的紧密对应。所有歧义均在脚注中保留，正文不作宗派性限定。
