  text: As they went[a], they went in any of their four directions; they did not turn as they went.
translation:
  language: zh_hans
  text: 它们行进时，朝着四方中的任何一方前行[a]；行进时，它们并不转向。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它们行进时，朝着它们四面的任何一面前行；行进时，它们并不转向。”希伯来语“它们的四边／四方”可指空间上的边或方位，也可指行进的方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶן
  choice: 向四边中的任何一边
  rationale: 该短语直译近于“在它们的四边上”，在运动语境中表示可朝四边之一行进。“四边”保留 רִבְעֵיהֶן 的空间意象，“任何一边”则使现代汉语自然，同时不把它单纯限定为抽象的“四个方向”。
- source_word: בְּלֶכְתָּם
  choice: 行进时
  rationale: 介词 בְּ 加不定词表达同时发生的动作；“行进时”简洁而符合异象叙述语体。
- source_word: יֵלֵכוּ
  choice: 能……直行
  rationale: 未完成式在此描述异象中反复或特征性的行动。“能”体现其运动能力；“直行”结合下句“不转向”表达行进方式，但不增添具体路线。
- source_word: לֹא יִסַּבּוּ
  choice: 并不转向
  rationale: יִסַּבּוּ 在这里指行进中转身或改变朝向；“转向”比“转弯”更能对应物体本身无需旋转便可往另一边移动的异象。
- source_word: בְּלֶכְתָּן
  choice: 行进时
  rationale: 同样是表示同时性的 בְּ 加不定词结构。原文后缀由阳性复数转为阴性复数，可能随邻近的阴性所指变化；现代汉语不必强行标出这一性别转换。
