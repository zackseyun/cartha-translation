base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/015.yaml
  text: As I looked at the living creatures[a], behold, one wheel was on the earth beside the living creatures, for each of their four faces.
translation:
  language: zh_hans
  text: 我观看活物的时候，看哪，地上有一个轮子在活物旁边，对着各自的四张脸。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文这一短语十分简练，也可译作“对应着它四张脸”或理解为每个活物旁边各有一个轮子。这里“脸”后所附的单数代词后缀，可能按分配式分别指每一个有四张脸的活物。
    reason: 准确说明单数后缀及其可能的分配式指代，并保留轮子与活物四张脸之间关系的歧义。
lexical_decisions:
- source_word: וָאֵרֶא
  choice: 我观看
  rationale: 该叙事形式推进异象中的所见。“我观看”保留第一人称视觉报告，也自然引出下文新出现的景象。
- source_word: הַחַיּוֹת
  choice: 那些活物
  rationale: חַיּוֹת在本章指异象中有生命的受造者。“活物”准确、简洁，并避免提前断定其身份；“那些”承接上文已出现的活物。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: הִנֵּה使注意力突然转向异象中的新事物。“只见”在现代汉语叙事中自然地保留这种引人注目的效果。
- source_word: אוֹפַן אֶחָד
  choice: 一个轮子
  rationale: 明确保留名词与数词的单数形式，不因后文的分配式关系而直接改写为复数。
- source_word: בָּאָרֶץ
  choice: 地上
  rationale: 此处表示轮子位于地面；“地上”比“在大地上”更符合现代汉语的空间表达，同时忠实于אֶרֶץ在本语境中的意义。
- source_word: אֵצֶל
  choice: 在……旁边
  rationale: 准确表达空间上的邻近关系，语言自然清楚。
- source_word: לְאַרְבַּעַת פָּנָיו
  choice: 与各自的四张脸相对应
  rationale: 该短语十分紧凑，单数后缀跟在复数“活物”之后，可作分配式理解。“各自”表明每个活物都有四张脸，“相对应”保留介词לְ所表达的关系，而不把具体空间结构说得过于确定。
theological_decisions:
- issue: לְאַרְבַּעַת פָּנָיו中单数后缀的指代及数的关系
  choice: 按分配式表达为“与各自的四张脸相对应”
  alternative: “每个活物旁边各有一个轮子”或较直译的“在它四张脸那里”
  rationale: 原文先说复数的“活物”，随后使用单数后缀，按希伯来语可理解为分别指每一个活物。正文保留“四张脸”以及轮子与之相关联的说法，不把异象的确切布局完全解释出来；脚注则说明另一种自然理解。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“只见”传达突现感；正文保留“一个轮子”的单数形式，并以脚注交代可能的分配式理解，避免过度整理原文刻意紧凑的结构。
