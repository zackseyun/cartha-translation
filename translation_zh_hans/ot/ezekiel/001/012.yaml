id: EZK.1.12
reference: Ezekiel 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵ֑כוּ אֶ֣ל אֲשֶׁר֩ יִֽהְיֶה שָׁ֨מָּ/ה הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/012.yaml
  text: And each one went straight ahead[a]. Wherever the spirit was to go, they went[b]; they did not turn as they went.
translation:
  language: zh_hans
  text: 各自径直向前走[a]。那灵[b]要往哪里去，他们就往哪里去；行进时并不转向。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“朝着自己脸所向的方向”。
    reason: lexical_alternative
  - marker: b
    text: “灵”也可译作“风”，也可能指“圣灵”；希伯来语רוּחַ可表示“灵”“风”或“气息”，本节没有明确说明其所指。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ
  choice: 各自
  rationale: 在异象语境中，אִישׁ按个体分指四个活物；“各自”保留逐一分述的含义，又不暗示它们是人。
- source_word: אֶל עֵבֶר פָּנָיו
  choice: 径直向前
  rationale: 原文直译为“朝着自己脸所向的方向”；这里表达每个活物都沿其面朝的方向前进。“径直向前”自然简洁，直译信息收入脚注。
- source_word: יֵלֵכוּ
  choice: 走／去
  rationale: 未完成式在异象叙述中描述持续或反复出现的行动；按汉语语境分别译作“走”和“去”，不强加将来时含义。
- source_word: אֶל אֲשֶׁר יִהְיֶה שָׁמָּה הָרוּחַ לָלֶכֶת
  choice: 那灵要往哪里去
  rationale: 以自然汉语表达行动的方向与趋向；不把所指明确限定为圣灵或风。
- source_word: הָרוּחַ
  choice: 那灵
  rationale: 定冠词表明是特定的所指；רוּחַ可指灵、风或气息。正文用“那灵”贴合异象中引导行动的力量，同时以脚注保留词义与所指的歧义。
- source_word: לֹא יִסַּבּוּ
  choice: 并不转向
  rationale: סבב的Niphal形式在这里指转身或改变方向；“不转向”准确呼应上下文中一直朝前行进的描写。
- source_word: בְּלֶכְתָּן
  choice: 行进时
  rationale: 介词ב加不定式结构表示同时发生的动作；“行进时”是自然、庄重的现代汉语。
theological_decisions:
- issue: רוּחַ是否应明确译为圣灵
  choice: 那灵
  alternative: 那风；圣灵
  rationale: 原文没有明确把所指认定为圣灵，而רוּחַ本身可指灵、风或气息。正文不作过度限定，脚注保留可能的理解，以维持原文的神学张力。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“各自……他们……”符合汉语中先分指、后合指的表达。“那灵”保留定指意味，却不借助英文式大小写预先判定其神学身份。
