  text: And the living creatures were running back and forth[a], like the appearance of lightning.
translation:
  language: zh_hans
  text: 那些活物来回奔跑[a]，景象如同闪电。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“那些活物跑去又返回，景象如同闪电。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחַיּוֹת
  choice: 那些活物
  rationale: חַיּוֹת意为“活物、生物”。“那些活物”既自然，也保留异象中的描述性称呼，不提前引入以西结书10:20的身份认定。句首וְ在此承接上下文，中文无需机械译出“并且”。
- source_word: רָצוֹא וָשׁוֹב
  choice: 来回奔跑
  rationale: 两个不定词独立式分别源于“跑”和“返回”，组合起来描绘迅速、反复的往返运动。“来回奔跑”用现代汉语自然表达其反复性，同时保留“跑”的直接含义。
- source_word: כְּמַרְאֵה
  choice: 看起来如同
  rationale: מַרְאֶה可指外观、景象或所见之形。“看起来如同”保留视觉比较和异象语言，又比生硬的“如同……的外观”更符合现代汉语。
- source_word: הַבָּזָק
  choice: 闪电
  rationale: בָּזָק指闪电或闪电的光芒；“闪电”简洁自然，并准确传达迅疾明亮的视觉形象。
