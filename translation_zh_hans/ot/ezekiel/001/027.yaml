base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/027.yaml
  text: And I saw something like the appearance of glowing metal[a], like the appearance of fire all around within it, from the appearance of his waist and upward; and from the appearance of his waist and downward I saw something like the appearance of fire[b], and brightness all around him.
translation:
  language: zh_hans
  text: 我观看，看见一种仿佛发光的金属[a]的景象，又仿佛有火在其中四围显现[b]；从他腰部的样子往上，是这样；从他腰部的样子往下，我看见仿佛有火的景象，又有光辉环绕着他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文 חַשְׁמַל（hashmal）的确切含义不明，也可译作“琥珀”或“琥珀金”（一种明亮的金属合金）。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语短语较难理解；也可能是说，火显在某种四面包围它的光亮或外层之中。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵין
  choice: 仿佛有
  rationale: 该比较结构不是直接认定所见之物，而是引出近似描述；“仿佛有”保留异象语言的谨慎和不确定性。
- source_word: חַשְׁמַל
  choice: 发光的金属
  rationale: 此罕见词的确切含义不明，可能指琥珀色物质或琥珀金一类明亮合金。“发光的金属”传达其明亮、似金属的视觉效果，同时在脚注中保留其他可能。
- source_word: כְּמַרְאֵה
  choice: 好像……的景象／仿佛是……的景象
  rationale: מַרְאֶה强调所见的外观。中文依句法略作变化，但始终保留“看起来像”而非直接等同的异象表达。
- source_word: בֵּית לָהּ סָבִיב
  choice: 里面四围都有火
  rationale: 原短语十分困难，字面涉及“里面／内部”和“四围”。此译尽量保留空间关系，不把它确定解释成外壳或封闭结构。
- source_word: מָתְנָיו
  choice: 看起来像他腰部的地方
  rationale: “腰部”是自然的现代汉语；加入“看起来像”承接 מַרְאֶה，避免将异象中的人形特征表述为未经限定的实体。
- source_word: וְנֹגַהּ לוֹ סָבִיב
  choice: 又有光辉环绕着他
  rationale: נֹגַהּ指明亮的光辉；阳性单数代词按原文译为“他”，并用“环绕”表达 סָבִיב。
theological_decisions:
- issue: 异象中拟人形象的指称
  choice: 使用“他腰部”和“环绕着他”
  alternative: 使用“它的腰部”和“环绕着它”
  rationale: 希伯来文使用阳性单数后缀，上文又描述仿佛人的形状。译作“他”忠实反映语法和拟人意象，但不进一步断定这形象的身份。
- issue: 火与内部、四围关系的困难短语
  choice: 译作“里面四围都有火”，并以脚注说明不确定性
  alternative: 译作“火被包裹在其中”或“火四面封闭”
  rationale: בֵּית לָהּ סָבִיב语义和句法均困难。正文保留“里面”和“四围”两个核心空间成分，不以某种外壳理论消解原文的含混。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。通过“仿佛”“好像”“看起来像”保留原文反复出现的异象性、近似性表达；保留上下对称结构和阳性单数指称，同时避免给异象人物作超出经文的身份认定。
