base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/005.yaml
  text: 'And from within it came the likeness of four living creatures[b][a]. And this was their appearance: they had the likeness of a man.'
translation:
  language: zh_hans
  text: 从其中显出四个活物的形象[a]。它们的样貌是这样：都有人的形象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “活物”或译“有生命的存在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתּוֹכָהּ
  choice: 从其中
  rationale: 保留“从它里面／当中”的空间意义；阴性后缀承接上文的异象景象，中文不必补明所指。
- source_word: דְּמוּת
  choice: 形像
  rationale: 表达相似、形态对应而非直接等同，保留以西结异象语言的审慎和间接性。
- source_word: אַרְבַּע חַיּוֹת
  choice: 四个活物
  rationale: “活物”准确表达有生命的受造存在，也是现代中文圣经语境中自然且不预先将其解释为动物或天使的称呼。
- source_word: וְזֶה מַרְאֵיהֶן
  choice: 它们的样貌是这样
  rationale: 自然表达可见的外观，并符合希伯来文“这就是它们的样貌”的指示结构。
- source_word: דְּמוּת אָדָם
  choice: 人的形像
  rationale: אָדָם在此着重人的形态，不必限定为男性；“人的形像”既保留单数集合意义，也避免把异象中的活物直接认定为人。
- source_word: לָהֵנָּה
  choice: 都有
  rationale: 希伯来文直译为“对它们／属于它们”；中文以“都有”自然呈现其表语性领有关系，并明确适用于四个活物。
theological_decisions:
- issue: 如何呈现异象中活物的本体身份
  choice: 重复使用“形像”，并称为“活物”
  alternative: 直接称作“受造物”或解释为天使
  rationale: 原文以דְּמוּת反复强调相似性，而未在本节进一步界定这些存在的身份；译文保留这种异象性的含蓄与神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“显出”使“从其中”与所见对象自然衔接，但不额外说明其移动方式；“样貌”比“外貌”更适合异象叙述。
