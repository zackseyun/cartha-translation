  text: וּ/דְמ֣וּת פְּנֵי/הֶם֮ פְּנֵ֣י אָדָם֒ וּ/פְנֵ֨י אַרְיֵ֤ה אֶל הַ/יָּמִין֙ לְ/אַרְבַּעְתָּ֔/ם וּ/פְנֵי שׁ֥וֹר מֵֽ/הַ/שְּׂמֹ֖אול לְ/אַרְבַּעְתָּ֑/ן וּ/פְנֵי נֶ֖שֶׁר לְ/אַרְבַּעְתָּֽ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/010.yaml
  text: 'As for the likeness of their faces: each had a human face; the four had a lion’s face on the right side[a], the four had an ox’s face on the left side, and the four had an eagle’s face.'
translation:
  language: zh_hans
  text: 至于它们各自脸的样式：每一个都有人的脸；每一个的右边都有狮子的脸，左边都有牛的脸；每一个都有鹰的脸[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”或译“秃鹫”；希伯来语 nesher 可泛指大型猛禽。
    reason: 保留 נֶשֶׁר 的词义范围及其翻译上的真实不确定性。
lexical_decisions:
- source_word: וּדְמוּת פְּנֵיהֶם
  choice: 至于它们脸的形状
  rationale: דְּמוּת表示“形状、样式、相似之处”；此处引出对各张脸外观的描述。“至于……的形状”既自然，也保留了异象叙述的描述性。
- source_word: פְּנֵי אָדָם
  choice: 人的脸
  rationale: אָדָם在这里指人类，与狮、牛和鹰形成类别上的对照，并不特别强调男性，因此译为“人的脸”。
- source_word: אֶל הַיָּמִין לְאַרְבַּעְתָּם
  choice: 四个的右边都有
  rationale: 原文说明狮子的脸位于右边，并以“对四个而言”表明这一特征适用于四个活物；用“都有”自然表达其分配性。
- source_word: שׁוֹר
  choice: 牛
  rationale: שׁוֹר指牛类，也可具体理解为公牛或役牛；现代汉语在此异象列表中译作“牛”最自然稳妥，且不增加原文未明确强调的性别或用途。
- source_word: מֵהַשְּׂמֹאול
  choice: 左边
  rationale: 介词字面可作“从”，但在此与右边相对，功能是标明脸所在的方位，故译为“左边”。
- source_word: נֶשֶׁר
  choice: 鹰
  rationale: נֶשֶׁר泛指大型猛禽，传统且合乎上下文的译法是“鹰”；其也可能指秃鹫，故以脚注保留词义范围。
theological_decisions:
- issue: 异象中的 אָדָם 是否应带男性限定
  choice: 人的脸
  alternative: 男人的脸
  rationale: 上下文强调人类与动物种类的对照，而非男性身份；“人的脸”准确保留类别意义，避免加入原文在此处没有突出的男性限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“四个……都有”清楚表达原文反复出现的分配性短语；保留各脸方位的视觉结构，不对异象作解释性扩充。
