  yaml_path: translation/ot/ezekiel/001/018.yaml
  text: As for their rims[a], they were high and fearsome, and the rims of all four were full of eyes all around.
translation:
  language: zh_hans
  text: 至于轮辋，它们又高又令人畏惧[a]；四个轮的轮辋上都布满了眼睛，遍及周围。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“可畏”；希伯来词表示使人产生惧怕或恐惧。
    reason: 保留 יִרְאָה 在“令人畏惧”“可畏”等表达之间的词义幅度，避免将其弱化为一般性的赞叹。
lexical_decisions:
- source_word: גַבֵּיהֶן / גַבֹּתָם
  choice: 轮辋
  rationale: 在本段车轮的语境中，גַּב指车轮外缘的结构；“轮辋”准确、简明，也能保留前后两次用词的对应。
- source_word: גֹבַהּ
  choice: 高
  rationale: 该名词表示“高度”；按现代汉语的述谓方式译为“它们又高”，比直译“它们有高度”自然。
- source_word: יִרְאָה
  choice: 令人畏惧
  rationale: 该词表示惧怕、恐惧；此处描述轮辋给人的感受。“令人畏惧”既保留使人害怕的意味，又不将其限定为道德或宗教上的敬畏。
- source_word: מְלֵאֹת עֵינַיִם
  choice: 布满了眼睛
  rationale: 忠实保留原文奇异而鲜明的意象；“布满”在描述轮辋表面时比生硬的“充满”更符合现代汉语。
- source_word: סָבִיב
  choice: 周围
  rationale: 自然表达眼睛遍及轮辋四周的范围。
- source_word: לְאַרְבַּעְתָּן
  choice: 四个轮的
  rationale: 所指为前文的四个轮；这样表达清楚说明四个轮的轮辋都有同样特征。
