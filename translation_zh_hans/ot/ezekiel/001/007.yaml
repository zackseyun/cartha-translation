  text: וְ/רַגְלֵי/הֶ֖ם רֶ֣גֶל יְשָׁרָ֑ה וְ/כַ֣ף רַגְלֵי/הֶ֗ם כְּ/כַף֙ רֶ֣גֶל עֵ֔גֶל וְ/נֹ֣צְצִ֔ים כְּ/עֵ֖ין נְחֹ֥שֶׁת קָלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/007.yaml
  text: Their legs were straight[a], and the soles of their feet were like the sole of a calf’s foot[b], and they gleamed like the appearance of polished bronze.
translation:
  language: zh_hans
  text: 它们的腿是直的，脚掌像牛犊的脚掌[a]；它们闪闪发光，如同磨亮的铜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更符合汉语习惯地译作“像牛犊的蹄”。原文直译是“像牛犊的脚掌”。
    reason: lexical_alternative
  - marker: b
    text: 或译“擦亮的铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: 它们的腿
  rationale: רֶגֶל 可指“脚”或“腿”；下句另说“脚掌”，此处译作“腿”能保留原文的部位区别。
- source_word: רֶגֶל יְשָׁרָה
  choice: 腿是直的
  rationale: 原文以单数名词和形容词作集合性、分配性描述，意为它们各自的腿都是直的；“直的”不额外推断姿态。
- source_word: כַּף רַגְלֵיהֶם
  choice: 脚掌
  rationale: כַּף 用于身体部位时可指手掌或脚掌；这里与 רֶגֶל 连用，自然译为“脚掌”。
- source_word: כְּכַף רֶגֶל עֵגֶל
  choice: 像牛犊的脚掌
  rationale: 紧贴原文对“脚掌”的重复比较，同时在脚注中列出更符合汉语习惯、但解释性更强的“像牛犊的蹄”。
- source_word: וְנֹצְצִים
  choice: 闪闪发光
  rationale: 该分词描写明亮闪耀的视觉效果；此译自然、鲜明，适合异象语境。
- source_word: כְּעֵין
  choice: 如同
  rationale: 该结构表达外观上的相似；中文用“如同”配合后面的金属形象，已自然传达“看起来像”的意思。
- source_word: נְחֹשֶׁת קָלָל
  choice: 磨亮的铜
  rationale: נְחֹשֶׁת 可指铜或铜合金，קָלָל 在此大概形容经处理而明亮闪耀的金属；“磨亮的铜”清楚且不过度限定具体合金或加工方法。
