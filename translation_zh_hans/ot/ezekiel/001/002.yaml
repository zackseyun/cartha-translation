lexical_decisions:
- source_word: בַּ/חֲמִשָּׁה
  choice: 初五
  rationale: 希伯来语介词加数词“五”在日期格式中指该月第五日；现代汉语以“初五”表达自然、简洁。
- source_word: לַ/חֹדֶשׁ
  choice: 那月
  rationale: 此短语与前面的数词共同构成日期。“那月”既承接上一节所述月份，也符合现代汉语日期表达。
- source_word: הִיא
  choice: 当时是
  rationale: 独立代词在这里具有复指和说明作用；译作“当时是”可自然引出纪年说明。
- source_word: הַ/שָּׁנָה הַ/חֲמִישִׁית
  choice: 第五年
  rationale: 按原文直译序数纪年表达。
- source_word: לְ/גָלוּת
  choice: 被掳的
  rationale: גָלוּת可指被迁徙的事件或流亡状态。“被掳”是简明而常见的圣经历史用语，也保留了原词可涵盖放逐与流亡的宽度；另一译法见脚注。
- source_word: הַ/מֶּלֶךְ
  choice: 王
  rationale: 汉语中君王称号通常置于人名之后，译为“约雅斤王”自然准确。
- source_word: יוֹיָכִין
  choice: 约雅斤
  rationale: 采用现代中文圣经语境中通行的人名音译。
