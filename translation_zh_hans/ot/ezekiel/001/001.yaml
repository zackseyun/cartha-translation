    rationale: “第三十年[a]四月初五”在脚注标记后直接连接两个日期成分，阅读上略显黏连；加入逗号不改变含义。
  - severity: low
    issue: “天开了”可能带有天气语义
    rationale: 原文为“诸天被开启”，是异象叙述中的庄严表达。“诸天开了”在现代汉语中更能维持该语境，且仍不强行补出施事者。
