reference: Ezekiel 1:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֣י בִּ/שְׁלֹשִׁ֣ים שָׁנָ֗ה בָּֽ/רְבִיעִי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ וַ/אֲנִ֥י בְ/תֽוֹךְ הַ/גּוֹלָ֖ה עַל נְהַר כְּבָ֑ר נִפְתְּחוּ֙ הַ/שָּׁמַ֔יִם וָ/אֶרְאֶ֖ה מַרְא֥וֹת אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/001.yaml
  text: It happened in the thirtieth year[a], in the fourth month, on the fifth day of the month, while I was among the exiles by the Kebar River, the heavens were opened[b], and I saw visions of God.
translation:
  language: zh_hans
  text: 第三十年[a]，四月初五，我在迦巴鲁河[b]边的被掳者中间时，诸天开了；我看见了上帝的异象[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有说明“第三十年”从何时起算。
    reason: chronological_ambiguity
  - marker: b
    text: “迦巴鲁河”也可能译作“迦巴鲁运河”；原文称它为“河”，但它可能是巴比伦的一条大型运河。
    reason: cultural_note
  - marker: c
    text: “上帝的异象”也可理解为“来自上帝的异象”“神圣的异象”，或以上帝为内容的异象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入日期句，不另译连接语）
  rationale: 这是叙事开篇常见的 wayyiqtol 形式。现代汉语直接从日期起笔最自然，无须添加原文没有明确表达的“如今”或采用古雅的“有一天”。
- source_word: בִּשְׁלֹשִׁים שָׁנָה
  choice: 第三十年
  rationale: 介词加数词和“年”在此构成纪年表达；原文没有说明这一纪年的起算点，因此正文保持简洁，并以脚注提示其不确定性。
- source_word: בָּרְבִיעִי בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: 四月初五
  rationale: 希伯来文直译为“第四月，本月第五日”。“四月初五”是自然、明确的现代汉语日期表达，不表示公历四月。
- source_word: וַאֲנִי בְתוֹךְ הַגּוֹלָה
  choice: 我正在……被掳的人中间
  rationale: וַאֲנִי 引出伴随日期背景的处境。“被掳的人”准确表达流亡群体因强制迁徙而形成的身份，也比单用“流亡者”更贴近历史语境。
- source_word: עַל נְהַר כְּבָר
  choice: 在迦巴鲁河边
  rationale: עַל 在水道名称前表示“在……边”；נְהַר 通常为“河”，但该水道可能实际是巴比伦的一条运河，故正文从原词译“河”，脚注保留历史地理上的可能性。专名 כְּבָר 音译为“迦巴鲁”。
- source_word: נִפְתְּחוּ הַשָּׁמַיִם
  choice: 天开了
  rationale: 原文是被动式“诸天被打开”。汉语“天开了”自然凝练，并保留异象启示的庄严色彩；“天”在汉语中无须机械标示希伯来文的复数形式。
- source_word: וָאֶרְאֶה
  choice: 我看见了
  rationale: 忠实表达随后发生的视觉经验，并以“了”体现叙事中的事件推进。
- source_word: מַרְאוֹת אֱלֹהִים
  choice: 上帝的异象
  rationale: 构造短语可指以上帝为内容的异象、来自上帝的异象，或神圣的异象。“上帝的异象”最贴近原文，并避免在正文中排除任何一种合理理解。
theological_decisions:
- issue: מַרְאוֹת אֱלֹהִים 中属格关系的含义
  choice: 上帝的异象
  alternative: 来自上帝的异象；神圣的异象；关于上帝的异象
  rationale: 希伯来文没有明确限定上帝是异象的来源、内容，还是用来说明异象的神圣性质。正文采用同样开放的属格表达，脚注列出主要可能理解，不替原文消除神学张力。
- issue: “第三十年”的起算点
  choice: 保持未说明
  alternative: 明确解释为以西结三十岁、约西亚改革后第三十年，或某一王朝纪年
  rationale: 本节原文没有交代起算点，各种具体解释均超出经文本身；因此只在脚注说明其不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。日期用“第四月”的自然汉语形式“四月”，但不将其误作公历月份；以分号区分处境背景与异象主体。正文中的[a]、[b]、[c]均有对应脚注。
