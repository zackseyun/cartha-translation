  to: 他们看见虚假的异象，又行骗人的占卜；他们说：“雅威宣告[a]。”其实雅威并没有差遣他们；他们却还指望这话得到证实[b]。
  rationale: 修订仅作低风险的文体与表述调整：以“又行”替代“作出”，使中文更自然，并较好地反映本节对假先知异象和占卜活动的双重谴责；规范直接引语的标点。神名、公式、末句的未明示所有格及全部脚注锚点均予保留。
