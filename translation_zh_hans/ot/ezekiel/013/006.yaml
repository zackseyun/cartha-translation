  source_fidelity: 首句把两个希伯来语宾语分别译作“看见……异象，作出……占卜”，基本传达假先知的虚假异象与欺骗性占卜；但“作出”相对弱化了原文以“看见”为核心的先知性宣称。将其调整为“看见虚假的异象，又行骗人的占卜”，在现代汉语中更顺畅，也仍清楚保留两项被谴责的活动。末句“指望这话得到证实”准确保留了他们期待某句话成立／应验的含义，且未擅自明确所有格。
  naturalness: 原译整体庄重、清楚。引号中的“雅威宣告”作为公式性话语可理解；将引文结束后的句号置于引号内，符合中文直接引语的常规标点。首句改用“又行”使两个并列成分更凝练自然。
  terminology: “雅威”一致对应 יהוה，且保留专名。“宣告”恰当呈现 נְאֻם 的庄严公式性质；“占卜”“证实”均符合本节语境。脚注的替代译法与锚点均合适。
