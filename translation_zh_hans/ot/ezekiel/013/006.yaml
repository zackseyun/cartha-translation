  text: חָ֤זוּ שָׁוְא֙ וְ/קֶ֣סֶם כָּזָ֔ב הָ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַֽ/יהוָ֖ה לֹ֣א שְׁלָחָ֑/ם וְ/יִֽחֲל֖וּ לְ/קַיֵּ֥ם דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/006.yaml
  text: They have seen falsehood and lying divination[a], those who say, ‘Declaration of Yahweh,’ though Yahweh has not sent them[b]; yet they hope for the fulfillment of the word.
translation:
  language: zh_hans
  text: 他们看见虚假的异象，又行骗人的占卜；他们说：“雅威宣告[a]。”其实雅威并没有差遣他们；他们却还指望这话得到证实[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是雅威的宣告”或“雅威说”。
    reason: 保留 נְאֻם יְהוָה 这一先知宣告公式的可译方式。
  - marker: b
    text: 或译：“等候这话应验”或“期待这话成立”。
    reason: יחל兼有等候、盼望之意；קַיֵּם דָּבָר可指使一句话成立、得到证实或应验。
lexical_decisions:
- source_word: חָזוּ שָׁוְא
  choice: 看见虚假的异象
  rationale: חָזוּ是先知语境中“看见、见异象”的用语；שָׁוְא在这里指虚假、落空之物。译文明确其异象语境，同时保留对其虚假性质的谴责。
- source_word: קֶסֶם כָּזָב
  choice: 骗人的占卜
  rationale: קֶסֶם指占卜，כָּזָב指虚假或谎言。“骗人的”既表达内容虚假，也保留其欺骗性的道德意味。
- source_word: הָאֹמְרִים
  choice: 他们说
  rationale: 该实词化分词指这些假先知惯常声称的话；汉语用“他们说”自然承接前句。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留庄严的先知公式及神名，使这些人冒用神圣权威的反讽清楚可见。
- source_word: וַיהוָה לֹא שְׁלָחָם
  choice: 其实雅威并没有差遣他们
  rationale: 直译否定式“雅威没有差遣他们”；“其实”自然表达前后声称与事实之间的反差。
- source_word: וְיִחֲלוּ לְקַיֵּם דָּבָר
  choice: 他们却还指望这话得到证实
  rationale: יחל可指等候、盼望或期待；קַיֵּם דָּבָר意为使话成立、得到证实或应验。译文保留他们期待所说之话成立的含义，不武断补入原文未明说的所有格。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其作为以色列之神专名的功能，而不以称号替代。
- issue: 假先知使用 נְאֻם יְהוָה 公式
  choice: 雅威宣告
  alternative: 这是雅威的宣告；雅威说
  rationale: 保留公式化表达，使经文中的张力不被消解：他们声称话语来自雅威，雅威却没有差遣他们。
- issue: 末句所期待得到证实的“话”属于谁
  choice: 这话
  alternative: 他们的话；雅威的话
  rationale: 原文只说דָּבָר（话），没有明示所有格。“这话”让上下文自然指向他们刚才所宣称的话，同时避免把隐含关系写死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用分号呈现原文三个紧密相连的分句；“其实”与“却还”显出假先知的声称、未受差遣的事实及其期待之间的反差。所有脚注标记均已置于正文对应位置。
