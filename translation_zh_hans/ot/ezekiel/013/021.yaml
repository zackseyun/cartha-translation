  source_fidelity: 译文准确传达了原文的主要断言：雅威将毁去/除去妇女的相关物件，将自己的子民从她们手中救出，使子民不再受其捕获或控制，并使她们认识雅威。保留了“从你们的手中”与“在你们手中”的重复控制意象；“法术带”和脚注也恰当地反映了 מִסְפְּחֹתֵיכֶם 的罕见及所指不明。
