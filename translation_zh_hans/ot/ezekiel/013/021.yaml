id: EZK.13.21
reference: Ezekiel 13:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/קָרַעְתִּ֞י אֶת מִסְפְּחֹֽתֵי/כֶ֗ם וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וְ/לֹֽא יִהְי֥וּ ע֛וֹד בְּ/יֶדְ/כֶ֖ן לִ/מְצוּדָ֑ה וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/021.yaml
  text: I will tear off your magic bands[a], and I will deliver my people from your hand, and they will no longer be in your hand as prey[b]; then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我要撕掉你们的法术带[a]，救我的子民脱离你们的手；他们不再落在你们手中，任你们捕获[b]。这样，你们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“带子”“护符”，也可能指“面纱”；这个希伯来词十分罕见，确切所指不能确定。
    reason: lexical_alternative
  - marker: b
    text: 或译“作猎物”或“供你们猎取”；原文用词可表达猎捕或捕获，具体意象不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַעְתִּי
  choice: 撕掉
  rationale: קרע的基本义是“撕裂、撕开”；此处宾语似为佩戴或使用的物件，用“撕掉”自然地表达强行除去。
- source_word: מִסְפְּחֹתֵיכֶם
  choice: 你们的法术带
  rationale: 该词罕见，所指物件不确定；结合13:18、20中妇女借物件施行操控的语境，“法术带”既提示其用途，也不过度限定具体形制。
- source_word: הִצַּלְתִּי
  choice: 救……脱离
  rationale: נצל在此指从他人的控制中解救；“救……脱离你们的手”符合现代汉语，也保留具体的解救意象。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留其盟约群体意味，并采用庄重而通行的圣经汉语表达。
- source_word: מִיֶּדְכֶן / בְּיֶדְכֶן
  choice: 脱离你们的手 / 落在你们手中
  rationale: 保留原文“手”的重复及其支配、控制的隐喻；“落在……手中”在现代汉语中清楚自然。
- source_word: לִמְצוּדָה
  choice: 任你们捕获
  rationale: מצודה可涉及网罗、猎捕或捕获，确切语法意象有歧义；此译在句中自然，并表达子民不再受其掠取控制。
- source_word: וִידַעְתֶּן
  choice: 这样，你们就知道
  rationale: 将连接词及完成式在预言语境中的结果关系自然表达出来；阴性复数由上下文中的“你们”承载。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不以称号替代专名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近通行学术重构的现代汉语音译，保留其专名性质。
- issue: 妇女所用物件的性质
  choice: 法术带
  alternative: 带子、护符或面纱
  rationale: 上下文明确涉及欺骗和操控性的仪式活动，但该罕见名词的具体所指不明；正文提示其法术功能，脚注保留物件形制上的不确定性。
- issue: לִמְצוּדָה的捕猎意象
  choice: 任你们捕获
  alternative: 作猎物、供你们猎取
  rationale: 该词可指网罗、猎捕或捕获。译文保留掠夺性控制的含义，而不武断认定具体是“网罗”还是“猎物”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“手”的重复隐喻和“你们”的复数指向；以脚注呈现两个罕见或多义词的真实不确定性，避免把法术物件的形制及捕猎意象解释得过细。
