  terminology: “雅威”一致保留四字神名的专名性质；“我的子民”适合庄重的先知书语体；“法术带”在正文中说明其语境功能，而脚注保留“带子、护符、面纱”等物件形制的不确定性，处理审慎。脚注b也适当地保留 לִמְצוּדָה 的词义与意象歧义。
