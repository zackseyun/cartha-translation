base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为神名 YHWH（יהוה）；传统中文常译作“耶和华”。
    reason: 说明正文“雅威”所对应的希伯来神名，并交代传统中文译名。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事性连接形式与整句构成先知书常用引言；汉语以“……的话临到……”自然表达，无须另译为“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在固定短语“耶和华的话”中，“话”既保留神言说的具体意味，也符合现代中文圣经语体；“信息”虽可表达大意，却削弱原文用词的对应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文为四字神名יהוה。简体中文采用读者熟悉且具有专名功能的传统音译“耶和华”，并用脚注说明原文及另一常见拟音“雅威”。
- source_word: אֵלַי
  choice: 我
  rationale: 介词加第一人称单数后缀表示话语所临到的对象；在“临到我”中准确自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接引语。中文公式“临到我说”简洁保留其引语导入功能，不额外补出原文没有的限定。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名，而非“主”这一称号。正文采用现代中文读者最熟悉的专名形式“耶和华”，同时在脚注中说明原文为YHWH及另一常见拟音，以免掩盖文本证据或将称号混同于专名。
translation_notes:
  register: 采用庄重、简洁而自然的现代标准汉语，保留先知书反复出现的启示引言公式“耶和华的话临到我说”。脚注标记置于引语导入语之后，避免误解为只注释“我”或“说”。
