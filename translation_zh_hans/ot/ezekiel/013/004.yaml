  text: כְּ/שֻׁעָלִ֖ים בָּ/חֳרָב֑וֹת נְבִיאֶ֥י/ךָ יִשְׂרָאֵ֖ל הָיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/004.yaml
  text: Your prophets, O Israel, have been like foxes[a] among ruins.
translation:
  language: zh_hans
  text: 以色列啊，你的先知好像废墟中的狐狸[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胡狼”。这里的希伯来语也可能泛指一种与狐狸相似的野生犬科动物。
    reason: 原词所指的具体动物存在真实的词义不确定性。
lexical_decisions:
- source_word: כְּשֻׁעָלִים
  choice: 好像……狐狸
  rationale: 该词指狐狸，也可能泛指与狐狸相似的野生犬科动物。“狐狸”是现代汉语中自然且常见的对应词；动物种类上的不确定性留在脚注中说明。
- source_word: בָּחֳרָבוֹת
  choice: 废墟中
  rationale: 复数名词表示遭毁坏、荒废之处。“废墟中”既保留这一场景，也与狐狸出没的意象自然搭配。
- source_word: נְבִיאֶיךָ
  choice: 你的先知
  rationale: 保留复数名词及第二人称单数所属后缀，不因上下文的谴责而在正文中增添“假”字。
- source_word: יִשְׂרָאֵל
  choice: 以色列啊
  rationale: 按呼语处理，以“啊”自然传达先知直接向以色列发言的语气。
- source_word: הָיוּ
  choice: 好像
  rationale: 希伯来语完成式系词与比较结构合用，陈述这些先知已经显出的性质。汉语以“好像”自然表达整句判断，不另行硬译系词。
theological_decisions:
- issue: 是否把“你的先知”明确译成“你的假先知”
  choice: 保留“你的先知”
  alternative: 你的假先知
  rationale: 上下文虽明确谴责这些先知，本节希伯来文本却只说“你的先知”。不增添“假”字，可避免把上下文判断直接写入正文，并保留原文措辞所具有的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以色列啊”保留直接呼告；“废墟中的狐狸”保持原文鲜明而简洁的比喻。
