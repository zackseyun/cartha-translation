base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/012.yaml
  text: And look[a], when the wall falls, will it not be said to you, ‘Where is the plaster with which you plastered it?’
translation:
  language: zh_hans
  text: 看哪，墙倒塌的时候，岂不有人会对你们说：‘你们抹的灰泥[a]在哪里呢？’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灰泥”也可译作“白灰”或“涂层”，指抹在墙上的材料；在本章的比喻中，这种表面涂层带有掩饰、欺骗的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意、使场景鲜明呈现的作用；在庄重而易懂的现代中文中，“看哪”比单纯的“看”更适合先知话语。
- source_word: נָפַל
  choice: 一倒塌
  rationale: 该词虽为完成式，但此处处于面向将来的情景中；用“一倒塌”自然表达条件兼时间关系，并体现墙体坍塌的语义。
- source_word: הַקִּיר
  choice: 墙
  rationale: 采用 קִיר 在此建筑意象中的通常含义，不额外限定为隔墙。
- source_word: הֲלוֹא יֵאָמֵר אֲלֵיכֶם
  choice: 岂不会有人对你们说
  rationale: הֲלוֹא 引出预期肯定答案的反问；尼法勒式 יֵאָמֵר 是非人称被动，中文补出泛指的“有人”较自然，同时不指定具体说话者。
- source_word: אַיֵּה
  choice: 在哪里呢
  rationale: 直接询问墙倒塌后涂层何在；句末“呢”自然传达质问意味，而不增添解释。
- source_word: הַטִּיחַ
  choice: 灰泥
  rationale: 指涂抹在墙面的材料。“灰泥”在现代中文中既具体又自然；上下文中的欺骗性表面处理意象则通过脚注保留“粉饰层”这一解释性可能。
- source_word: אֲשֶׁר טַחְתֶּם
  choice: 你们抹的
  rationale: 以简洁自然的中文表达关系从句；被涂抹的对象“墙”已由上下文明确，无须重复补出。
theological_decisions:
- issue: 墙面涂层是否应直接译成带有欺骗意味的“粉饰”
  choice: 正文译作“灰泥”
  alternative: 粉饰层／粉刷料
  rationale: 原词首先指墙面涂料或灰泥；本章语境确有掩饰、不可靠表面处理的象征意义，但正文不宜把隐含评价直接写入词义，因此在脚注中提示。
translation_notes:
  register: 采用现代、庄重且口语可懂的先知性表达。“看哪”和“岂不会”保留原文的强调与反问力度；“有人”仅用于自然呈现希伯来语的非人称被动，不指明特定主体。
