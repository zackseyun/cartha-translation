source:
  edition: WLC
  text: הֲ/ל֤וֹא מַֽחֲזֵה שָׁוְא֙ חֲזִיתֶ֔ם וּ/מִקְסַ֥ם כָּזָ֖ב אֲמַרְתֶּ֑ם וְ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַ/אֲנִ֖י לֹ֥א דִבַּֽרְתִּי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/007.yaml
  text: Have you not seen a false vision and spoken a lying divination[a], when you say, ‘Declares Yahweh,’ though I have not spoken?
translation:
  language: zh_hans
  text: 你们不是看见了虚假的异象，说了虚假的占卜之言[a]吗？你们还说：‘这是雅威的宣告’，我却没有说过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虚假的异象”也可译作“虚空的异象”；“虚假的占卜之言”也可译作“谎言的占卜之言”。原文相关词语可含虚空、虚假或谎言之意；“占卜之言”也可指占卜所得的谕言。
    reason: 保留שָׁוְא、כָּזָב及מִקְסָם的词义幅度。
lexical_decisions:
- source_word: הֲלוֹא
  choice: 不是……吗
  rationale: 引出预期肯定回答的反问；现代汉语用“不是……吗”自然保留其责问语气。
- source_word: מַחֲזֵה שָׁוְא
  choice: 虚假的异象
  rationale: מַחֲזֶה指异象、所见之启示，שָׁוְא兼有虚假、虚空之意；上下文着重揭露冒称来自上帝的启示，因此正文采用“虚假的异象”，脚注保留“虚空”的词义空间。
- source_word: חֲזִיתֶם
  choice: 看见了
  rationale: 对应第二人称阳性复数完成式，直译其“看见异象”的动作，并以“你们”明确复数对象。
- source_word: וּמִקְסַם כָּזָב
  choice: 说了谎诈的占卜之言
  rationale: מִקְסָם指占卜或占卜所得的谕言，כָּזָב指谎言、虚假；加入“之言”使其与支配该短语的אָמַרְתֶּם自然搭配，同时保留“占卜”的负面宗教语义。
- source_word: אֲמַרְתֶּם
  choice: 说了
  rationale: 按其基本义译出，并与前面的完成式“看见了”形成平行。
- source_word: וְאֹמְרִים
  choice: 你们还说
  rationale: 分词表达持续或伴随的言说；“还说”既自然，也突出他们在虚假启示之外进一步冒称雅威发言。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告
  rationale: 保留先知性宣告公式的简洁力度，并直接音译神名יהוה。
- source_word: וַאֲנִי לֹא דִבַּרְתִּי
  choice: 其实我并没有说话
  rationale: 显明主语“我”与假先知的声称形成强烈反差；“其实……并没有”自然表达希伯来语连接词在此处的对照意味。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近通常学术重构读音的音译，不以称号“主”取代专名。
- issue: 假先知言论与雅威发言之间的关系
  choice: 以“其实我并没有说话”保留直接否定
  alternative: 译作“但我并未吩咐他们”
  rationale: 原文否定的是“我说话”，不是更具体的差遣或吩咐；正文不增添原文没有明说的神学解释。
- issue: מִקְסָם的性质
  choice: 占卜之言
  alternative: 预言；神谕
  rationale: “占卜”保留该词与非法或虚假求问活动的联系；“之言”则体现本句中它是被说出的内容，而不把它中性化为一般预言。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不是……吗”保留责问语气；“异象”“占卜之言”“宣告”延续先知文学语域，但避免古奥句法。引语“雅威宣告”刻意简短，以体现冒用神圣宣告公式的突兀和严重性。
