  text: בֶּן אָדָ֕ם הִנָּבֵ֛א אֶל נְבִיאֵ֥י יִשְׂרָאֵ֖ל הַ/נִּבָּאִ֑ים וְ/אָֽמַרְתָּ֙ לִ/נְבִיאֵ֣י מִ/לִּבָּ֔/ם שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/002.yaml
  text: Son of man[a], prophesy against the prophets of Israel who are prophesying, and say to those who prophesy from their own hearts, ‘Hear the word of Yahweh.’
translation:
  language: zh_hans
  text: “人子啊，你要针对以色列那些说预言的先知说预言；要对那些凭自己的心说预言的先知[a]说：‘你们要听耶和华的话！’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语较直译为“出于他们自己内心的先知”。这浓缩的表达指他们所说的预言出于自己，而非来自耶和华。
    reason: 说明希伯来语浓缩结构，并保留“心”作为信息来源的比喻。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝称呼先知的固定希伯来表达及全书的文学连贯性；此处指受造的人，并非在本节中引入后来的称号含义。
- source_word: הִנָּבֵא אֶל
  choice: 说预言攻击
  rationale: הִנָּבֵא 是命令式，意为说预言；介词 אֶל 通常可译“向”，但本段内容是谴责，因此用“攻击”传达此处敌对、审判性的语境力量。
- source_word: נְבִיאֵי יִשְׂרָאֵל הַנִּבָּאִים
  choice: 以色列那些正在说预言的先知
  rationale: 保留“以色列的先知”这一带有反讽张力的称谓，并以“正在”体现分词所表达的持续或当前行为。
- source_word: לִנְבִיאֵי מִלִּבָּם
  choice: 对那些从自己心里说预言的人
  rationale: 希伯来语措辞浓缩，直译近于“对从他们心里的先知”；这里以自然汉语表达其信息源于他们自己，同时保留“心”的意象。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 复数命令式要求这些先知留心领受；加入“你们要”使现代汉语中的命令语气清楚。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书的固定公式“……的话”，并将神名 יהוה 音译为传统且通行的中文形式“耶和华”。
theological_decisions:
- issue: 审判语境中介词 אֶל 的语力
  choice: 译作“攻击”
  alternative: “向”
  rationale: 下文是针对假先知的谴责。“攻击”反映该先知使命在上下文中的对抗性质，但没有增添希伯来文本之外的审判内容。
- issue: 假先知信息的来源
  choice: “那些从自己心里说预言的人”
  alternative: “从自己的心意说预言的人”或较直译的“从他们心里的先知”
  rationale: 译文表明预言出自他们自身而非耶和华，同时保留希伯来语“心”的比喻及其思想、意愿等宽广含义，不将其缩窄为单纯的情感或理智。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“说预言”比单用“预言”更清楚地表达先知发言的动作；保留重复，以呈现原文对真假先知话语来源的强调。脚注标记置于其实际说明的短语之后。
