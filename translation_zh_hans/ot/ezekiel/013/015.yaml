  text: וְ/כִלֵּיתִ֤י אֶת חֲמָתִ/י֙ בַּ/קִּ֔יר וּ/בַ/טָּחִ֥ים אֹת֖/וֹ תָּפֵ֑ל וְ/אֹמַ֤ר לָ/כֶם֙ אֵ֣ין הַ/קִּ֔יר וְ/אֵ֖ין הַ/טָּחִ֥ים אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/015.yaml
  text: So I will spend my wrath against the wall and against those who plastered it with whitewash[a], and I will say to you, ‘The wall is no more, and those who plastered it are no more,’
translation:
  language: zh_hans
  text: 所以，我要向那墙和那些用灰泥[a]涂抹它的人倾尽我的烈怒，并要对你们说：‘墙没有了，涂抹它的人也没有了。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灰泥”也可译作“白垩涂料”或“粉饰层”；传统译作“未调和的灰浆”。希伯来词在此指涂在墙上的一种表面覆盖物，其具体材料含义不完全确定。
    reason: 保留 תָּפֵל 的词义不确定性，并说明传统译法。
lexical_decisions:
- source_word: וְכִלֵּיתִי אֶת־חֲמָתִי
  choice: 我要……发尽我的烈怒
  rationale: כִּלָּה 与“烈怒”连用，表示使其达到尽头、完全倾发；“发尽我的烈怒”在现代汉语中自然，也保留审判完全施行的力度。
- source_word: בַּקִּיר וּבַטָּחִים אֹתוֹ
  choice: 向这墙和那些……抹墙的人
  rationale: 介词 ב 在此标明烈怒所针对的对象，译作“向……发怒”符合汉语搭配；טוח 是涂抹、抹灰。
- source_word: תָּפֵל
  choice: 灰泥
  rationale: 该词在本段指涂在脆弱墙体上的劣质或不牢靠覆盖物。正文用较具体而不过度解释的“灰泥”，并以脚注保留“未调和的灰浆”等词义可能。
- source_word: וְאֹמַר לָכֶם
  choice: 并要对你们说
  rationale: 直接对应原文第一人称未完成式及其承接连词，保持宣告语气。
- source_word: אֵין הַקִּיר וְאֵין הַטָּחִים אֹתוֹ
  choice: 墙没有了，抹墙的人也没有了
  rationale: אֵין 表示不再存在；重复“没有了”保留两个平行分句及庄严的审判语气。
theological_decisions:
- issue: 墙和涂抹材料的比喻意义
  choice: 正文保留墙与抹墙的具体意象，不直接解释为虚假预言或欺骗性的平安保证。
  alternative: 在正文中明确增译为假先知及其虚假的保证。
  rationale: 上下文揭示了比喻所指，但本节本身继续用具体意象陈述审判；不作解释性增译可避免消除原文的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“发尽我的烈怒”保留先知审判语言的力度；“墙没有了……也没有了”保持原文平行结构。
