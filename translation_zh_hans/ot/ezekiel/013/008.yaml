  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן דַּבֶּרְ/כֶ֣ם שָׁ֔וְא וַ/חֲזִיתֶ֖ם כָּזָ֑ב לָ/כֵן֙ הִנְ/נִ֣י אֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/008.yaml
  text: 'Therefore thus says the Lord GOD: Because you have spoken falsehood and seen a lie[a], therefore behold, I am against you, declares the Lord GOD.'
translation:
  language: zh_hans
  text: 所以，主耶和华[a]如此说：“因为你们说虚假的话，所见的是谎言，所以，看哪，我与你们为敌。”这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主耶和华”原文由“主”的称号与神名“耶和华”组成。
    reason: 说明复合神名的构成，并避免读者把“耶和华”误解为另一个称号。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 原文在本节两次使用该因果连接词；两处均译为“所以”，保留宣告中的因果呼应，同时符合现代汉语表达。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知书常见的使者宣告公式，庄重而易懂。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的主权称号与 יהוה 的神名，也符合现代中文圣经语体。
- source_word: יַעַן דַּבֶּרְכֶם שָׁוְא
  choice: 因为你们说虚假的话
  rationale: יַעַן 引出审判缘由；שָׁוְא 在此指虚假、无实质的言论，译法直接自然。
- source_word: וַחֲזִיתֶם כָּזָב
  choice: 所见的是谎言
  rationale: חזה 在此属于异象语境；保留“见”的意象，不径直释作“预言”，而 כָּזָב 直译为“谎言”。
- source_word: הִנְנִי אֲלֵיכֶם
  choice: 看哪，我与你们为敌
  rationale: “看哪”保留 הִנְנִי 的郑重提示作用；“与你们为敌”准确表达 אֲלֵיכֶם 在此处的敌对含义，而不额外规定行动形式或时间。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 体现先知信息末尾的神圣认证公式及其权威性，较“说”更能与前面的 כֹּה אָמַר 区分。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”同时保留称号与专名的区别，不造成“主主”的重复，也不把神名泛化为普通称谓。
- issue: הִנְנִי אֲלֵיכֶם 所表达的神圣敌对
  choice: 看哪，我与你们为敌
  alternative: 看哪，我要对付你们
  rationale: 所选译法保留原文概括而严厉的敌对宣告，不把它具体化为某一种惩罚行动，也不将语法张力完全改写为单纯将来时。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。保留两次“所以”、先知公式“如此说”、提示词“看哪”和结尾的“宣告”，以呈现原文严整而有权威的审判语气；同时避免把“所见”解释性扩写为“所预言”或“所看见的异象”。
