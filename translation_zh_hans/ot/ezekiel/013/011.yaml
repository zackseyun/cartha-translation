base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/011.yaml
  text: Tell those who plaster it with whitewash that it will fall[a]. There will be a flooding rain, and you, O hailstones, will fall[b], and a windstorm will break it open.
translation:
  language: zh_hans
  text: 你要对那些给墙抹劣质灰泥的人说：‘墙必倒塌！’必有暴雨倾泻而下；冰雹啊，你们必降下；狂风必把墙劈裂。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָחֵי תָפֵל
  choice: 给墙抹劣质灰泥的人
  rationale: טוח意为“涂抹、抹灰”；תָפֵל在本段指不牢靠、不能加固墙体的灰泥。“劣质灰泥”既保留建筑语境，也表达其虚假而脆弱的性质。宾语“墙”由上文明确，汉语中补出可使句意自然。
- source_word: וְיִפֹּל
  choice: 墙必倒塌
  rationale: 动词的主语由上文的墙承接而来；补出“墙”避免现代汉语中的指代含混。“必”传达审判宣告的确定性。
- source_word: גֶּשֶׁם שׁוֹטֵף
  choice: 暴雨倾泻而下
  rationale: שׁוֹטֵף含有冲刷、漫溢的破坏性；“暴雨倾泻而下”兼顾雨势猛烈与冲击墙体的画面。
- source_word: וְאַתֵּנָה אַבְנֵי אֶלְגָּבִישׁ תִּפֹּלְנָה
  choice: 冰雹啊，你们必降下
  rationale: 保留独立复数代词אַתֵּנָה所形成的直接呼语和强调，不把生动的拟人化表达改写成普通陈述。
- source_word: וְרוּחַ סְעָרוֹת
  choice: 狂风
  rationale: 该短语指猛烈的风暴之风；“狂风”是简洁、自然且有力度的现代汉语表达。
- source_word: תְּבַקֵּעַ
  choice: 必把墙劈裂
  rationale: בקע的加强词干表达劈开、裂开的动作；从上下文补出受事“墙”，并用“劈裂”保留结构被强力破坏的具体形象。
