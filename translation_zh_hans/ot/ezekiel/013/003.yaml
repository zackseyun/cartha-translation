  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ה֖וֹי עַל הַ/נְּבִיאִ֣ים הַ/נְּבָלִ֑ים אֲשֶׁ֥ר הֹלְכִ֛ים אַחַ֥ר רוּחָ֖/ם וּ/לְ/בִלְתִּ֥י רָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/003.yaml
  text: 'Thus says the Lord GOD: Woe to the foolish prophets[a], who follow their own spirit and have seen nothing.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“那些愚妄的先知有祸了！他们随从自己的灵[a]，其实什么也没有看见。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “随从自己的灵”也可意译为“随从自己的冲动”；希伯来语直译是“走在自己的灵之后”。
    reason: 说明希伯来语习语，并保留 רוּחַ 在“灵”与内在冲动之间的语义幅度。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 采用庄重而自然的先知传信公式，贴合希伯来语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 在现代中文圣经语域中以“主”表达 אֲדֹנָי，以“耶和华”标示神的专名 יהוה，保留称号与专名并列的结构。
- source_word: הוֹי עַל
  choice: 有祸了
  rationale: 表达 הוֹי 在审判宣告中的警告和哀叹力量，比单纯感叹更符合本节语境。
- source_word: הַנְּבִיאִים הַנְּבָלִים
  choice: 愚妄的先知
  rationale: “愚妄”不仅指智力不足，也保留 נבל 所含的道德与属灵悖谬意味。
- source_word: הֹלְכִים אַחַר רוּחָם
  choice: 随从自己的灵
  rationale: “随从”自然表达“走在……之后”的习语意义；“自己的灵”保留 רוּחַ 的原文意象及其可指内在冲动或自发灵感的含义。
- source_word: וּלְבִלְתִּי רָאוּ
  choice: 其实什么也没有看见
  rationale: 这里的“看见”具有先知领受异象的语境意义；“其实”使中文清楚呈现其自称受感与未见异象之间的反差，而不增添异象的具体内容。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是普通现代中文读者较熟悉的神名形式，并能区别称号“主”与专名 יהוה；脚本层面不以“主上帝”取代专名。
- issue: “自己的灵”的所指
  choice: 保留“灵”的表述
  alternative: 自己的冲动／自己的心意
  rationale: 原文 רוּחָם 可指他们自己的灵、内在冲动或自生的感动。正文不把它过度限定为心理冲动，以保留先知语境中的神学张力。
- issue: “没有看见”的先知性含义
  choice: 沿用“看见”，不明说“没有领受异象”
  alternative: 没有看见异象／没有领受启示
  rationale: 原文只用“看见”，在上下文中暗含异象经验；直保此措辞可避免把隐含信息扩写成明确命题。
translation_notes:
  register: 采用现代、庄重且易懂的先知宣告语体。“愚妄”保持道德和属灵批判色彩；引号内用感叹句传达 הוֹי 的审判力度。脚注标记紧接其所解释的短语。
