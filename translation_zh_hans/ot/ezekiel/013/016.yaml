  text: נְבִיאֵ֣י יִשְׂרָאֵ֗ל הַֽ/נִבְּאִים֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַ/חֹזִ֥ים לָ֖/הּ חֲז֣וֹן שָׁלֹ֑ם וְ/אֵ֣ין שָׁלֹ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/016.yaml
  text: the prophets of Israel who prophesy concerning Jerusalem and who see for her a vision of peace[a], when there is no peace, declares the Lord GOD.
translation:
  language: zh_hans
  text: 就是那些向耶路撒冷说预言、为她看见平安[a]的异象的以色列先知；却没有平安。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安康”；希伯来语“沙龙”（shalom）可包括和平、完整和福祉。
    reason: 说明 שָׁלוֹם 的语义范围，同时保留正文中的修辞重复。
lexical_decisions:
- source_word: נְבִיאֵי יִשְׂרָאֵל
  choice: 以色列先知
  rationale: 按构造链直译为与以色列归属或相关的先知；现代汉语不必另加所有格虚词。
- source_word: הַנִּבְּאִים אֶל יְרוּשָׁלַםִ
  choice: 向耶路撒冷说预言
  rationale: 分词表示这些先知持续或惯常的活动；אֶל 保留其基本方向义“向”，不把它过度限定为“论到”或“攻击”。
- source_word: וְהַחֹזִים לָהּ
  choice: 为她看见
  rationale: חזה 保留异象语境中的“看见”，לָהּ 译作“为她”，所指为前面的耶路撒冷，并保留与格或受益意味。
- source_word: חֲזוֹן שָׁלוֹם
  choice: 平安的异象
  rationale: חֲזוֹן 译为“异象”；שָׁלוֹם 译为“平安”，以保留下句重复同词所形成的鲜明反差。
- source_word: וְאֵין שָׁלוֹם
  choice: 其实并没有平安
  rationale: “其实”自然表达该分句对假先知异象的现实否定；“并没有平安”保留原文简洁而断然的陈述。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 采用庄重而清楚的现代汉语先知宣告公式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 按现代中文圣经传统处理复合神名，既区分 אֲדֹנָי，也明确呈现专名 יהוה。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代汉语圣经语域中庄重、清楚且广为理解，并保留专名形式；不借译法加入宗派性解释。
- issue: שָׁלוֹם 在假预言中的含义范围
  choice: 平安
  alternative: 安康／福祉
  rationale: “平安”既是该词的核心含义，也能与“并没有平安”构成原文刻意的重复；脚注说明其较宽的语义范围，不在正文中消解张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句首“就是”承接上一节的判语，反映本节在上下文中的同位说明功能；分号凸显假异象与现实之间的反差。
