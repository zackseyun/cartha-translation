base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/017.yaml
  text: And you[a], son of man, set your face against the daughters of your people who prophesy out of their own hearts[b], and prophesy against them.
translation:
  language: zh_hans
  text: “你，人子啊，要面向你百姓中那些出于自己心意说预言的女儿们[a]；你要向她们说预言，攻击她们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你百姓的女儿们”；也可按语境译为“你百姓中的女子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；保留固定表达“人子”，可传达全书反复出现的修辞力量。
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: 面向
  rationale: 希伯来语直译为“把脸朝向”。此处虽有敌对语境，但句末“攻击她们”已明确表达对抗关系，因此这里保留该短语本身可有的“朝向”含义，避免重复强化。
- source_word: בְּנוֹת עַמְּךָ
  choice: 你同胞中的女子
  rationale: בְּנוֹת 字面为“女儿们”，在此指本族群中的女性。“你同胞中的女子”在现代汉语中自然，也保留了性别与群体归属；脚注说明字面措辞。
- source_word: הַמִּתְנַבְּאוֹת
  choice: 说预言的人
  rationale: 阴性复数分词表示这些女子持续或惯常从事说预言的活动；不擅自加入“假”或“冒充”等判断。
- source_word: מִלִּבְּהֶן
  choice: 凭自己的心意
  rationale: לֵב 可涵盖内在思想、意愿和谋划。汉语“凭自己的心意”自然表达信息出于她们自身，同时用脚注交代其与耶和华启示的对比。
- source_word: וְהִנָּבֵא עֲלֵיהֶן
  choice: 你要说预言攻击她们
  rationale: 命令式要求以西结对她们发出预言；עַל 在审判语境中具有敌对方向，译作“攻击”清楚而有力。
theological_decisions:
- issue: 这些女子所从事的预言活动的性质
  choice: 译作“说预言”，正文不增添“虚假地”或“假装”等词。
  alternative: “说假预言”或“冒充先知说话”
  rationale: 上下文确实定罪她们，但本节直接指出的是她们凭自己的心意说预言。让这一措辞本身承担批判作用，比把上下文判断增补进动词更忠于原文。
- issue: “面向”是否应直接译成敌对动作
  choice: 正文译“面向”，由末句“攻击她们”明确敌意。
  alternative: “面向……与她们为敌”或“转脸攻击”
  rationale: שִׂים פָּנֶיךָ אֶל 的介词基本含义是“朝向”，而敌对含义由语境产生。保留这一张力可避免把同一句中的敌意表达两次。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“人子”保留《以西结书》的固定称呼；“你同胞中的女子”避免现代汉语中“你百姓的女儿们”可能造成的误解。所有脚注标记均已在正文中出现。
