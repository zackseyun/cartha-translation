  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָ֨רַסְתִּ֜י אֶת הַ/קִּ֨יר אֲשֶׁר טַחְתֶּ֥ם תָּפֵ֛ל וְ/הִגַּעְתִּ֥י/הוּ אֶל הָ/אָ֖רֶץ וְ/נִגְלָ֣ה יְסֹד֑/וֹ וְ/נָֽפְלָה֙ וּ/כְלִיתֶ֣ם בְּ/תוֹכָ֔/הּ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/014.yaml
  text: I will tear down the wall that you plastered with whitewash[a], and bring it down to the ground, so that its foundation is laid bare. It will fall, and you will perish within it. Then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我要拆毁你们用白灰粉饰的那堵墙[a]，使它倒在地上，露出根基。墙必倒塌，你们也必在其中灭亡。这样，你们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用白灰粉饰”也可译作“用劣质灰浆涂抹”。希伯来词可着重表示表面的粉饰，也可指不牢靠的涂层；这里含有以虚假外表掩盖脆弱实质的意思。
    reason: 保留תָּפֵל在表面粉饰与劣质灰浆之间的词义可能性。
lexical_decisions:
- source_word: וְהָרַסְתִּי
  choice: 我要拆毁
  rationale: הרס表示拆除、毁坏建筑物；“拆毁”自然有力，并保留墙被摧毁的具体意象。
- source_word: הַקִּיר
  choice: 那堵墙
  rationale: קִיר指墙；加量词“堵”符合现代汉语，也保留先知话语中的具体比喻。
- source_word: טַחְתֶּם תָּפֵל
  choice: 你们用灰泥粉饰
  rationale: 该短语描写以不可靠或表面性的涂层覆盖墙体。“用灰泥粉饰”既传达涂抹墙面的动作，也保留掩饰性表象；תָּפֵל具体可指粉饰材料或劣质灰浆，故以脚注说明歧义。
- source_word: וְהִגַּעְתִּיהוּ אֶל־הָאָרֶץ
  choice: 使它倒在地上
  rationale: 使役式表达使墙到达地面的结果；汉语“使它倒在地上”清楚自然，并与下句墙倒塌的图景连贯。
- source_word: וְנִגְלָה יְסֹדוֹ
  choice: 露出根基
  rationale: גלה的被动形式表示原先隐藏的根基显露；简洁保留结构弱点被揭开的意象。
- source_word: וְנָפְלָה
  choice: 墙必倒塌
  rationale: 阴性单数动词回指墙；汉语重复“墙”可避免代词指向不清，“倒塌”适用于建筑物。
- source_word: וּכְלִיתֶם בְּתוֹכָהּ
  choice: 你们也必在其中灭亡
  rationale: כלה在此表示遭毁灭、灭亡；בְּתוֹכָהּ的空间含义以“在其中”保留，不额外解释灭亡的方式。
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: 这样，你们就知道我是雅威
  rationale: 保留以审判引向认识的结果关系；יהוה按专名音译为“雅威”，不以称号替代。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，并避免以称号代替；同时不主张重建发音具有绝对确定性。
- issue: בְּתוֹכָהּ所指及灭亡图景
  choice: 在其中灭亡
  alternative: 在墙内灭亡；在废墟中灭亡
  rationale: 阴性代词在语法上回指“墙”，但具体图景可理解为墙倒塌时身处其中。译文保留原文空间表达，不增补“废墟”等解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式短促，以配合审判宣告的力度；保留“墙—根基—倒塌”的具体意象及原文的神学张力。
