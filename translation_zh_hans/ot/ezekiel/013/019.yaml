reference: Ezekiel 13:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תְּחַלֶּלְ֨נָה אֹתִ֜/י אֶל עַמִּ֗/י בְּ/שַׁעֲלֵ֣י שְׂעֹרִים֮ וּ/בִ/פְת֣וֹתֵי לֶחֶם֒ לְ/הָמִ֤ית נְפָשׁוֹת֙ אֲשֶׁ֣ר לֹֽא תְמוּתֶ֔נָה וּ/לְ/חַיּ֥וֹת נְפָשׁ֖וֹת אֲשֶׁ֣ר לֹא תִֽחְיֶ֑ינָה בְּ/כַ֨זֶּבְ/כֶ֔ם לְ/עַמִּ֖/י שֹׁמְעֵ֥י כָזָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/019.yaml
  text: And you have profaned me among my people for handfuls of barley and for pieces of bread[a], putting to death persons who should not die and keeping alive persons who should not live, by your lying to my people[b], who listen to lies.
translation:
  language: zh_hans
  text: 你们为几把大麦和几块饼[a]，竟在我的子民中亵渎我；你们向我那些听信谎言的子民撒谎，使本不该死的人死，使本不该活的人活[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “几块饼”也可译作“几小块饼”；原文强调她们所得的报酬十分微薄。
    reason: lexical_alternative
  - marker: b
    text: “人”原文作“生命”或“性命”，两处相同，指活着的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחַלֶּלְנָה
  choice: 竟……亵渎
  rationale: חלל 的皮耶勒词干在此指把神圣者当作凡俗、损害其圣名；“亵渎”保留宗教与盟约语境中的力度。“竟”传达谴责语气，但不另加事实内容。
- source_word: אֹתִי אֶל־עַמִּי
  choice: 在我的子民中亵渎我
  rationale: אֶל 在此表达她们的行为在神子民当中、在他们面前使神受亵渎；现代汉语用“在……中”自然明确。
- source_word: בְּשַׁעֲלֵי שְׂעֹרִים
  choice: 为几把大麦
  rationale: שַׁעֲלֵי 指手抓的少量，即“几把”；介词 בְּ 在上下文中表示代价或报酬，“为”体现她们因微薄酬劳而行事。
- source_word: וּבִפְתוֹתֵי לֶחֶם
  choice: 和几块饼
  rationale: פְּתֹתֵי 指掰开的小块或少量食物；“几块饼”简洁自然，并保留报酬微不足道的意味。
- source_word: לְהָמִית נְפָשׁוֹת
  choice: 使……人死
  rationale: נְפָשׁוֹת 在此指具体的人或性命，而非与身体分离的“灵魂”；使役式译法与 לְהָמִית 的语法和后半句的平行结构相称。
- source_word: אֲשֶׁר לֹא תְמוּתֶנָה
  choice: 本不该死的
  rationale: “本不该死”保留司法、道德或神所定结局的张力，不把原文限定为单纯预言或特定的预定论解释。
- source_word: וּלְחַיּוֹת נְפָשׁוֹת
  choice: 使……人活
  rationale: חיה 在此为使役意义，与“使……死”形成刻意对照；中文采用对称表达。
- source_word: אֲשֶׁר לֹא תִחְיֶינָה
  choice: 本不该活的
  rationale: 与前句“本不该死”平行，既表达对正当结局的颠倒，又不额外说明这种生死是实际、司法还是预言层面的结果。
- source_word: בְּכַזֶּבְכֶם
  choice: 你们……撒谎
  rationale: בְּ 表示手段；כַזֶּבְכֶם 指她们的虚假言说。“撒谎”是自然现代汉语，并明确其行为方式。
- source_word: שֹׁמְעֵי כָזָב
  choice: 听信谎言的
  rationale: שׁמע 在此不只是听见，也含接受、听从之意；“听信”准确表现子民对谎言的接纳。
theological_decisions:
- issue: נְפָשׁוֹת 在审判语境中的含义
  choice: 人
  alternative: 灵魂／性命
  rationale: 此处指遭受生死裁断的人。“灵魂”容易引入原文未要求的身灵二分；“人”在现代汉语中最直接，同时脚注说明原文字面范围。
- issue: “不该死／不该活”两句的语气
  choice: 司法—道德性的“本不该”
  alternative: 纯预测性的“本不会死／本不会活”
  rationale: 上下文责备假女先知颠倒正确的生死判定。“本不该”保留规范性和神圣审判的张力，而不把句子限定为单纯预测。
- issue: “使死／使活”的作用范围
  choice: 保留直接使役措辞
  alternative: 宣告该死／宣告可活
  rationale: 原文使用使死和使活的使役形式。虽然语境可能涉及虚假神谕所造成的裁断或后果，正文不应把它缩减为仅仅口头宣告。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“子民”保留“我的百姓”所表达的归属与盟约色彩；整体句式维持原文从微薄报酬、亵渎神，到颠倒生死并以谎言欺骗听众的推进。所有脚注标记均已置于正文。
