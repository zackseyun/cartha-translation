  terminology: “平安”“我的百姓”“走迷”“筑起一道墙”均合适。“白灰”与“涂抹”搭配自然，并避免把תָּפֵל预先限定成“劣质灰浆”。脚注保留“未调和的灰泥”的传统理解及材料细节的不确定性。
