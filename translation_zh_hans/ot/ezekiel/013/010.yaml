reference: Ezekiel 13:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֣עַן וּ/בְ/יַ֜עַן הִטְע֧וּ אֶת עַמִּ֛/י לֵ/אמֹ֥ר שָׁל֖וֹם וְ/אֵ֣ין שָׁל֑וֹם וְ/הוּא֙ בֹּ֣נֶה חַ֔יִץ וְ/הִנָּ֛/ם טָחִ֥ים אֹת֖/וֹ תָּפֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/010.yaml
  text: Because[a], yes, because they have led my people astray, saying, ‘Peace,’ when there is no peace, and when someone builds a wall, behold, they plaster it with whitewash.
translation:
  language: zh_hans
  text: 这实在是因为他们使我的百姓走迷，说：‘平安！’其实并没有平安。有人筑起一道墙，看哪，他们就用白灰[a]涂抹这墙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“未调和的灰泥”。希伯来语此词所指的具体涂抹材料及其技术含义不完全确定；“白灰”表现其涂在墙面、带有粉饰意味的形象。
    reason: 保留תָּפֵל在“白灰/粉饰性涂层”与“未调和的灰泥”等理解之间的词义及技术细节不确定性，避免主文将其限定为劣质砂浆。
lexical_decisions:
- source_word: יַעַן / וּבְיַעַן
  choice: 正因为，实在是因为
  rationale: 保留希伯来文重复的因果表达及其加强语气；现代汉语中用“实在是”承接重复，比机械地两次说“因为”更自然。
- source_word: הִטְעוּ
  choice: 使……走迷
  rationale: 该使役动词表示使人偏离、迷失；“使……走迷”保留行路隐喻及道德、信仰层面的意味。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 保留原文简洁的归属和圣约性称谓，不作解释性扩充。
- source_word: לֵאמֹר שָׁלוֹם וְאֵין שָׁלוֹם
  choice: 说：‘平安！’其实并没有平安
  rationale: שָׁלוֹם可指平安、安宁和福祉；此处“平安”既符合先知语境，也保留虚假安全感与真实处境之间的鲜明反差。
- source_word: וְהוּא בֹּנֶה
  choice: 有人筑起
  rationale: 单数代词与分词在语境中具有泛指性质；“有人”自然表达代表性的建造者，不误指某个已知人物。
- source_word: חַיִץ
  choice: 一道墙
  rationale: 按普通词义译作“墙”，不把“单薄”“不牢”等由上下文推知的性质提前加入名词。
- source_word: וְהִנָּם
  choice: 看哪，他们竟
  rationale: “看哪”保留 הִנֵּה 引人注目、使画面突现的先知性语气；“竟”自然传达此处带有谴责意味的突显。
- source_word: טָחִים אֹתוֹ
  choice: 把墙抹上
  rationale: 动词指在墙面涂抹或抹灰；汉语建筑语境中的“抹上”具体自然，并与灰浆搭配。
- source_word: תָּפֵל
  choice: 劣质灰浆
  rationale: 该词在此指不合用、未经妥善调制或仅作表面遮盖的抹墙材料。主文用“劣质灰浆”呈现其负面性质和建筑意象，同时以脚注保留“未调和的灰泥”及“白灰粉饰”等理解。
theological_decisions:
- issue: 先知谴责中筑墙和抹墙的比喻意义
  choice: 在主文中保留“筑墙—用灰浆抹墙”的具体图像，不直接解释其象征意义。
  alternative: 扩译为“筑起一堵不牢的墙”，或把抹墙直接解释为“用谎言掩盖”。
  rationale: 原文在本节先呈现比喻画面，其解释由上下文逐步显明。保留张力可避免把译者对虚假保障或欺骗性遮掩的理解直接写入经文。
- issue: תָּפֵל所指材料的性质
  choice: 主文译作“劣质灰浆”，脚注列出其他可能表达。
  alternative: “未调和的灰泥”“白灰”“粉饰材料”。
  rationale: 该词的具体材料和技术含义并不完全确定，但明显带有不合用或虚浮的贬义。译文既不把它限定为特定配方，也不抹去墙体表面处理的具体意象。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“正因为，实在是因为”保留原文强调性的重复；“看哪”保留先知宣告的修辞突显。主文不解释墙的比喻，以免消解原文的形象与神学张力。
