source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הוֹי֩ לִֽ/מְתַפְּר֨וֹת כְּסָת֜וֹת עַ֣ל כָּל אַצִּילֵ֣י יָדַ֗/י וְ/עֹשׂ֧וֹת הַ/מִּסְפָּח֛וֹת עַל רֹ֥אשׁ כָּל קוֹמָ֖ה לְ/צוֹדֵ֣ד נְפָשׁ֑וֹת הַ/נְּפָשׁוֹת֙ תְּצוֹדֵ֣דְנָה לְ/עַמִּ֔/י וּ/נְפָשׁ֖וֹת לָ/כֶ֥נָה תְחַיֶּֽינָה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/018.yaml
  text: 'And say, ‘Thus says the Lord GOD: Woe to the women who sew magic bands on every wrist and make veils for the head of persons of every height, to hunt souls! Will you hunt the souls of my people and keep your own souls alive?'
translation:
  language: zh_hans
  text: 你要说：‘主耶和华如此说：那些在每个人的手腕上缝制法术带、为各种身量的人制作头巾，以猎取性命的女人有祸了！你们猎取我子民的性命，却要保全自己的性命吗？’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּסָתוֹת
  choice: 法术带
  rationale: 该词罕见，具体物件不明；上下文涉及女先知以神秘手段“猎取性命”。译作“法术带”既保留带状物的理解，也明示其仪式性用途，但不进一步断定具体形制。
- source_word: עַל כָּל אַצִּילֵי יָדַי
  choice: 在人的每个手腕上
  rationale: אַצִּילֵי יָד 字面涉及手臂的关节或连接处，常被理解为手腕；第一人称词尾在此很可能是异常形式或具有分配意义。用“人的每个手腕”传达所指部位并避免误读成耶和华自己的手腕。
- source_word: הַמִּסְפָּחוֹת
  choice: 蒙巾
  rationale: 此词也是罕见词，语境明确为置于头部的织物；“蒙巾”自然且不过度限定为面纱、头巾或特定法器。
- source_word: עַל רֹאשׁ כָּל קוֹמָה
  choice: 按各人的身量为头
  rationale: קוֹמָה通常指身量、身高；此短语含义不寻常，可能表示为各种身量的人制作，也可能涉及不同长度或尺寸。正文采用前者，同时保留“身量”这一原文意象。
- source_word: לְצוֹדֵד נְפָשׁוֹת
  choice: 以猎取性命
  rationale: נֶפֶשׁ在这里兼有生命、性命与人本身的意味；“猎取性命”保留原文强烈而重复的捕猎隐喻。
- source_word: וּנְפָשׁוֹת לָכֶנָה תְחַיֶּינָה
  choice: 倒要保全自己的性命吗
  rationale: 句法可理解为使归于自己的性命存活，或使自己的性命存活。结合与“我子民的性命”的对照，译为“保全自己的性命”，并以“倒”呈现反诘张力。
theological_decisions:
- issue: 这些物件是否明确属于巫术
  choice: 在“带”前加“法术”，表明上下文中的神秘操控功能
  alternative: 只译“带子”或“垫带”
  rationale: 原词本身的精确含义不确定，但本节的猎取性命及全段对假女先知的谴责显示这些物件具有仪式性、操控性用途。“法术”描述语境功能，不引入特定宗派解释。
- issue: נְפָשׁוֹת应译为“灵魂”还是“性命”
  choice: 性命
  alternative: 灵魂
  rationale: 这里的对照是猎取、存活或保全人的生命，译作“性命”更符合希伯来语נֶפֶשׁ的整体人格和生命含义，也避免把经文收窄为后世身心二分意义上的“灵魂”。
- issue: 末句的施事与受益者
  choice: 理解为这些女人以牺牲百姓为代价保全自己
  alternative: 理解为她们让归附自己的人存活
  rationale: לָכֶנָה可表示“为你们自己”或“属于你们”；上下文的直接对照支持“自己的性命”，但原文仍存在一定句法张力，正文不额外说明她们如何获利或保命。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“主耶和华如此说”“有祸了”保留先知宣告的固定语体；避免生硬逐词对应。两个罕见名词以可理解但不过度具体的“法术带”“蒙巾”表达。
