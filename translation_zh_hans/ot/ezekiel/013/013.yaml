source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וּ/בִקַּעְתִּ֥י רֽוּחַ סְעָר֖וֹת בַּֽ/חֲמָתִ֑/י וְ/גֶ֤שֶׁם שֹׁטֵף֙ בְּ/אַפִּ֣/י יִֽהְיֶ֔ה וְ/אַבְנֵ֥י אֶלְגָּבִ֖ישׁ בְּ/חֵמָ֥ה לְ/כָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/013.yaml
  text: 'Therefore thus says the Lord GOD: I will unleash a storm wind in my wrath[a], and there will be a flooding rain in my anger, and hailstones in fury to bring complete destruction.'
translation:
  language: zh_hans
  text: 所以，主雅威如此说：“我要在烈怒中使暴风骤起[a]；在我的怒气中，必有倾泻而下的暴雨；在盛怒中，必有冰雹降下，造成彻底的毁灭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“我要劈开风暴之风”；这里的意思是，上帝使猛烈的暴风突然爆发。
    reason: 说明 בקע 的字面图像及其在此处的语境意义。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: 将 אֲדֹנָי 译为“主”，并以“雅威”音译上帝的专名 יהוה；这样既保留复合称号，也避免译成不自然的“主主”。
- source_word: וּבִקַּעְתִּי
  choice: 使……骤起
  rationale: בקע 的基本义是“劈开、破开”；在这里以“暴风”为宾语，表达上帝使其猛烈暴发。“使……骤起”在现代汉语中自然，并保留上帝主动施行的含义。
- source_word: רוּחַ סְעָרוֹת
  choice: 暴风
  rationale: 该结构指猛烈的风暴；译作“暴风”简洁自然，也能传达复数 סְעָרוֹת 所强化的狂烈意味。
- source_word: בַּחֲמָתִי
  choice: 在烈怒中
  rationale: חֵמָה 表示炽烈的愤怒；“烈怒”符合先知审判宣告的庄重语域。
- source_word: גֶּשֶׁם שֹׁטֵף
  choice: 倾泻的暴雨
  rationale: שֹׁטֵף 有冲刷、泛滥之意；“倾泻的暴雨”自然地表现雨势猛烈及其破坏力。
- source_word: בְּאַפִּי
  choice: 在我的怒气中
  rationale: אַף 本义为“鼻子”，在此按常见转义表示愤怒；译作“怒气”准确且符合现代汉语习惯。
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: 冰雹
  rationale: 希伯来语字面为“冰雹之石”，指降下的冰雹；汉语通常直接称“冰雹”，无需生硬保留“石头”。
- source_word: בְּחֵמָה
  choice: 在盛怒中
  rationale: 再次表达炽烈愤怒；用“盛怒”既保留与前文的语义呼应，也使汉语避免机械重复。
- source_word: לְכָלָה
  choice: 造成彻底的毁灭
  rationale: כָּלָה 在此表示完全终结、毁灭，לְ 带有结果或目的意味；此译法清楚传达审判的彻底性，同时不擅自添加具体毁灭对象。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主雅威
  alternative: 主耶和华／主上帝
  rationale: 原文明确使用神圣专名 יהוה。音译为“雅威”可保留其专名性质；אֲדֹנָי 则译为称号“主”，不把两者混同。
- issue: 三重愤怒措辞的处理
  choice: 烈怒／怒气／盛怒
  alternative: 三处统一译作“愤怒”
  rationale: 原文交替使用 חֵמָה、אַף、חֵמָה，三者语义重叠却措辞有别。译文以相近而不同的汉语词保留这种强化与变化，不赋予三者额外的神学区别。
- issue: לְכָלָה 所表达的毁灭程度
  choice: 彻底的毁灭
  alternative: 灭绝一切
  rationale: 原文强调终结和毁灭的完全性，却没有在本短语中明说“一切”作为宾语；因此保留彻底性而不补入可能缩窄或扩大范围的对象。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。以分号呈现暴风、暴雨和冰雹三重并列的审判图景；保留神圣专名和原文愤怒措辞的递进张力。
