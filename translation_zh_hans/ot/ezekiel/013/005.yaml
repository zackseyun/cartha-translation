  text: לֹ֤א עֲלִיתֶם֙ בַּ/פְּרָצ֔וֹת וַ/תִּגְדְּר֥וּ גָדֵ֖ר עַל בֵּ֣ית יִשְׂרָאֵ֑ל לַ/עֲמֹ֥ד בַּ/מִּלְחָמָ֖ה בְּ/י֥וֹם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/005.yaml
  text: You have not gone up into the breaches or built up a wall for the house of Israel[a], so that it might stand in the battle on the day of Yahweh.
translation:
  language: zh_hans
  text: 你们没有上到破口处，也没有为以色列家筑起一道墙，好使以色列家在耶和华的日子临到时，能在战斗中站立得住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלִיתֶם
  choice: 上到
  rationale: 保留עלה“上去、登上”的具体动作，并与登上防御工事缺口的图景自然衔接。
- source_word: בַּפְּרָצוֹת
  choice: 城墙的缺口
  rationale: פרצות指墙垣或防线上的破口；补出“城墙”可使现代汉语读者明确其防御工事意象，而不把它抽象化。
- source_word: וַתִּגְדְּרוּ גָדֵר
  choice: 筑起围墙
  rationale: 同根动词与名词的组合强调筑墙设防；“筑起围墙”既自然，又保留具体军事意象。
- source_word: עַל בֵּית יִשְׂרָאֵל
  choice: 为以色列家
  rationale: 介词עַל在此可表达为了以色列家的保护；“为”避免把比喻过度落实为一堵实际环绕全家的墙。
- source_word: לַעֲמֹד
  choice: 使他们能……站立得住
  rationale: 不定式表达目的；“站立得住”传达在战斗中抵挡、存立的语境意义。以色列家是集合体，汉语用“他们”指其成员较自然。
- source_word: בַּמִּלְחָמָה
  choice: 在战斗中
  rationale: 保留战争对抗的具体画面；“战斗”比宽泛的“战争”更贴合此处一次迎战的情境。
- source_word: בְּיוֹם יְהוָה
  choice: 耶和华的日子临到时
  rationale: 保留先知书中固定的“耶和华的日子”表达；加入“临到时”使中文时间关系自然清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，明确其为专名而非称号。
theological_decisions:
- issue: 用军事防御比喻责备先知失职
  choice: 保留缺口、围墙、战斗和站立得住等具体意象
  alternative: 意译为“你们没有保护以色列，使他们能熬过审判”
  rationale: 原文借修补防线描绘先知本应承担的责任；保留比喻可让读者自行把握其先知性含义，避免把解释直接写入正文。
- issue: “耶和华的日子”的性质
  choice: 保留原有专门表达，不在正文中明说是审判之日
  alternative: 译作“耶和华施行审判的日子”
  rationale: 该短语在先知传统中常带审判意味，但本节没有显式添加“审判”；保留张力更忠于原文。
- issue: 以色列家作为集合名词的指代
  choice: 用复数“他们”指以色列家的成员
  alternative: 用单数“它”指整个以色列家
  rationale: 希伯来语的目的结构未明示代词；现代汉语用“他们”更自然，同时仍可理解为整个群体在争战中存立。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留城防与战斗的连贯比喻，不改写成抽象的属灵解释；“以色列家”和“耶和华的日子”沿用中文圣经语域中清楚且熟悉的表达。
