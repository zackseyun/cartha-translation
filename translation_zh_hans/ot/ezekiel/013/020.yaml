- from: 所以，主耶和华如此说：“看哪，我要对付你们那些带子[a]；你们在那里用它们猎取性命，如同捕鸟[b]。我要把那些带子从你们的膀臂上撕下来，释放你们所猎取的性命[c]，使他们如鸟飞去[b]。”
  to: 所以，主耶和华如此说：“看哪，我要与你们的带子[a]作对；你们借着它们在那里猎取性命，如同猎取飞鸟[b]。我要把它们从你们的膀臂上撕下来，并释放那些被你们猎取、如飞鸟般的性命[c][b]。”
  rationale: 修订保留原文的审判、撕裂和释放三重动作，以及两次出现的飞翔意象；同时避免将有争议的表达定为“捕鸟”这一具体动作。脚注 b 相应说明受害者可能被比作飞鸟，也可能涉及“使其飞去”的理解。
