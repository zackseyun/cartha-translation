source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י אֶל כִּסְּתוֹתֵי/כֶ֨נָה֙ אֲשֶׁ֣ר אַ֠תֵּנָה מְצֹדְד֨וֹת שָׁ֤ם אֶת הַ/נְּפָשׁוֹת֙ לְ/פֹ֣רְח֔וֹת וְ/קָרַעְתִּ֣י אֹתָ֔/ם מֵ/עַ֖ל זְרוֹעֹֽתֵי/כֶ֑ם וְ/שִׁלַּחְתִּי֙ אֶת הַ/נְּפָשׁ֔וֹת אֲשֶׁ֥ר אַתֶּ֛ם מְצֹדְד֥וֹת אֶת נְפָשִׁ֖ים לְ/פֹרְחֹֽת־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against your magic bands with which you hunt the lives there like birds, and I will tear them from your arms[c][b], and I will let the lives go free—the ones you hunt like birds.'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：“看哪，我要与你们的带子[a]作对；你们借着它们在那里猎取性命，如同猎取飞鸟[b]。我要把它们从你们的膀臂上撕下来，并释放那些被你们猎取、如飞鸟般的性命[c][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带子”所译的希伯来词十分罕见，确切所指不明；也可能指垫子、护符，或假女先知使用的某种仪式用品。
    reason: lexical_alternative
  - marker: b
    text: 原文两处都含有“飞”的意思，句法较难确定；可能是把受害者比作被猎取的飞鸟，也可能表示使他们飞去。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“魂”或“性命”；这里指作为有生命之人的性命，并非必然特指与身体分离的灵魂。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 采用现代中文圣经语体中自然且有区分度的复合称谓，分别体现主权称号与神名。
- source_word: הִנְנִי אֶל
  choice: 看哪，我要对付
  rationale: “看哪”保留提示和强调语气；“我要对付”自然表达神明确敌对并施行审判的姿态。
- source_word: כִּסְּתוֹתֵיכֶנָה
  choice: 你们那些带子
  rationale: 该词罕见，所指不明，语境显示是戴在膀臂上的某种仪式用品。“带子”保留形态上的开放性，不把“魔法”这一解释直接写入正文；不确定性由脚注说明。
- source_word: מְצֹדְדוֹת
  choice: 猎取
  rationale: 保留狩猎、捕捉的形象，并与后文飞鸟意象相连。
- source_word: הַנְּפָשׁוֹת / נְפָשִׁים
  choice: 性命
  rationale: 这里指遭猎取并获释放的人作为有生命的个体；“性命”保留生命受威胁的意味，又避免把 נֶפֶשׁ 限定为与身体分离的“灵魂”。
- source_word: לְפֹרְחוֹת / לְפֹרְחֹת
  choice: 如同捕鸟／使他们如鸟飞去
  rationale: 原文语法和意象晦涩，但 פרח 明确涉及飞翔。译文保留捕鸟与飞去的双重可能联系，并用脚注呈现直译与解释上的不确定性。
- source_word: וְקָרַעְתִּי אֹתָם מֵעַל זְרוֹעֹתֵיכֶם
  choice: 我要把那些带子从你们的膀臂上撕下来
  rationale: 保留动作的强烈程度，并明确复数代词指前述带子；“膀臂”符合庄重而易懂的经文语体。
- source_word: וְשִׁלַּחְתִּי
  choice: 释放
  rationale: 结合被猎取、受束缚的上下文，表达使其脱离掌控，同时不增添超出原文的救赎机制。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留希伯来文副词，虽其具体所指和句法归属并不完全清楚。
theological_decisions:
- issue: נֶפֶשׁ 在巫术式猎取人的语境中如何译出
  choice: 性命
  alternative: 灵魂／人
  rationale: “性命”既可指具体的人命，也突显其生命受到威胁；它不预设原文在此提出灵魂与身体二分的人论，从而保留经文自身的语义范围。
- issue: 晦涩的“飞翔”表达是否应完全化解为捕鸟明喻
  choice: 正文保留捕鸟和飞去两个相关意象，并以脚注说明
  alternative: 只译作“像捕鸟一样猎取人”
  rationale: 希伯来文两次出现与“飞”有关的形式，结构异常且解释有争议。完全平滑化会掩盖原文张力，因此在可读性与形式保留之间取平衡。
- issue: 罕见名词 כִּסְּתוֹת 是否应明确译为巫术用品
  choice: 带子，并脚注说明可能是仪式或巫术用品
  alternative: 魔法带／靠垫／护符
  rationale: 上下文支持仪式或巫术用途，却不足以确定物件的具体形制；正文不作过度确定的教义化或物质文化判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“看哪”和“主耶和华”的经文语体；对罕见仪式用品及“飞翔”意象不作过度解释，通过脚注公开原文的不确定性。所有脚注标记均已置于正文。
