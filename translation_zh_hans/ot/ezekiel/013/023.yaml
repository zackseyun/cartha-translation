  source_fidelity: 译文准确传达了 לכן所引出的审判结果、两个阴性复数第二人称动词（不再见异象／不再行占卜）、耶和华将其子民从这些女子手中救出的行动，以及其结果“你们必知道我是耶和华”。“虚假的异象”对应 שָׁוְא，且没有把其虚妄性质过度具体化。
  naturalness: 整体庄重、清楚，适合先知宣告体。“行占卜”虽可理解，但现代普通话中“占卜”本身即可作动词；改为“不再占卜”更自然简洁，且不损失原文同源宾语所表达的施行之意。
  terminology: “异象”“占卜”“救出”“耶和华”均恰当。“从你们手中救出”保留 מִיָּדְכֶן 的具体意象和权势含义，不需释义化。
