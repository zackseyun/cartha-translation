source:
  edition: WLC
  text: לָ/כֵ֗ן שָׁ֚וְא לֹ֣א תֶחֱזֶ֔ינָה וְ/קֶ֖סֶם לֹא תִקְסַ֣מְנָה ע֑וֹד וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/023.yaml
  text: Therefore you will no longer see false visions or practice divination anymore, and I will deliver my people from your hand. Then you will know that I am the LORD.
translation:
  language: zh_hans
  text: 因此，你们必不再看见虚假的异象，也不再占卜；我要从你们手中救出我的子民。你们就知道我是耶和华。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁוְא
  choice: 虚假的异象
  rationale: 该词本义涉及虚妄、虚假；与“看见”搭配时，译作“虚假的异象”自然，并准确指明受责备的启示声称。
- source_word: קֶסֶם / תִקְסַמְנָה
  choice: 行占卜
  rationale: 名词与同根动词构成强调性的宾语结构，指施行占卜；现代汉语以“行占卜”简洁传达。
- source_word: וְהִצַּלְתִּי
  choice: 我要……救出
  rationale: 使役完成式在先知话语中表达耶和华确定将采取的拯救行动；“救出”保留从控制或危险中解救之意。
- source_word: מִיַּדְכֶן
  choice: 从你们手中
  rationale: 保留希伯来语“手”的权势、控制含义，也与中文惯用表达相合；第二人称为阴性复数，按上下文译作“你们”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，区别于普通称谓“主”。
theological_decisions:
- issue: 惩罚与认识耶和华之间的关系
  choice: “你们就知道我是耶和华”
  alternative: “这样，你们便会承认我是主”
  rationale: 原文 וִידַעְתֶּן 表示因神的行动而认识或确知，未明确限定为自愿承认；直译保留审判性认识与关系性认识之间的张力。
- issue: 神的子民受假女先知控制的表述
  choice: “从你们手中救出我的子民”
  alternative: “使我的子民脱离你们的权势”
  rationale: 保留原文具体的“手”这一意象，不进一步解释其控制方式或神学性质。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。保留先知宣告的因果推进：“因此”引出停止虚假异象与占卜，继而宣告拯救，最后以认识耶和华作结。原文第二人称动词均为阴性复数，中文由上下文中的“你们”承接，不另加解释。
