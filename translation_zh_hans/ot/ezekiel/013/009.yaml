id: EZK.13.9
reference: Ezekiel 13:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיְתָ֣ה יָדִ֗/י אֶֽל הַ/נְּבִיאִ֞ים הַ/חֹזִ֣ים שָׁוְא֮ וְ/הַ/קֹּסְמִ֣ים כָּזָב֒ בְּ/ס֧וֹד עַמִּ֣/י לֹֽא יִהְי֗וּ וּ/בִ/כְתָ֤ב בֵּֽית יִשְׂרָאֵל֙ לֹ֣א יִכָּתֵ֔בוּ וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָבֹ֑אוּ וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/009.yaml
  text: And my hand will be against the prophets who see falsehood and who practice lying divination[a]. They will not be in the council of my people, nor will they be written in the register of the house of Israel, nor will they enter the land of Israel[c][b]. Then you will know that I am the Lord Yahweh.
translation:
  language: zh_hans
  text: 我的手必攻击那些看见虚假景象、作虚假占卜的先知。他们必不得列在我子民的会中[a]，不得记在以色列家的名册[b]上，也不得进入以色列地。这样，你们就知道我是主耶和华[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “会”所译的希伯来词也可指“议事会”“亲密圈子”或“秘密议会”。
    reason: lexical_alternative
  - marker: b
    text: “名册”也可译作“记录”或“登记册”。
    reason: lexical_alternative
  - marker: c
    text: “主耶和华”原文为 אֲדֹנָי יְהוִה，即“主”与以色列上帝的专名 יהוה 连用；神名也常音译为“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה יָדִי אֶל
  choice: 我的手必攻击
  rationale: 保留“我的手”这一审判性意象，并按上下文把介词短语所表达的敌对含义译为“攻击”，而非仅译作方向性的“临到”。
- source_word: הַחֹזִים שָׁוְא
  choice: 看见虚假景象
  rationale: 保留 חזה 的“看见”意象；שָׁוְא 可指虚假、虚空或徒然，此处指先知所见并不真实。“景象”使现代读者明白这是先知声称看见的内容，又不把它过度限定为某一种异象形式。
- source_word: וְהַקֹּסְמִים כָּזָב
  choice: 作虚假占卜
  rationale: קֹסְמִים 表示从事占卜，כָּזָב 表示虚假或谎言；译文既保留这种受谴责的活动，也清楚表明其内容不实。
- source_word: בְּסוֹד עַמִּי
  choice: 列在我子民的会中
  rationale: סוֹד 可指亲密圈子、议事会或集会。正文用较宽泛自然的“会中”保留歧义，并以“列在”表达他们将被排除在公认群体之外。
- source_word: וּבִכְתָב בֵּית יִשְׂרָאֵל לֹא יִכָּתֵבוּ
  choice: 不得记在以色列家的名册上
  rationale: כְּתָב 在这里很可能指正式记录或登记册；“记在……名册上”自然表达 נכתב 的被动含义和被除名的审判。
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל לֹא יָבֹאוּ
  choice: 也不得进入以色列地
  rationale: אֲדָמָה 字面可指土地或土壤；此处关乎被排除、不能归回，因此“以色列地”最符合语境。
- source_word: וִידַעְתֶּם
  choice: 这样，你们就知道
  rationale: 将连接词按结果关系译为“这样……就”，并保留希伯来文第二人称复数。
- source_word: אֲנִי אֲדֹנָי יְהוִה
  choice: 我是主耶和华
  rationale: אֲדֹנָי 译为“主”，יהוה 以汉语中通行且能区别于普通称号的专名形式“耶和华”表达，避免译成重复的“主主”。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时保留“主”这一称号与四字神名。正文采用现代中文圣经读者熟悉的“主耶和华”，脚注说明神名形式，不以一般称号取代专名。
- issue: 三个排除语句的关系
  choice: 保留并列递进的三重排除
  alternative: 将三项合并解释为失去国民或盟约身份
  rationale: 原文依次提到不得在群体中、不得登记、不得进入土地；译文不把这些具体审判预先归结为某一系统神学概念。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“我的手”这一原文意象和三项平行审判，不使用过度古雅的“尔等”“必不入”等表达；“会中”配脚注以保存 סוֹד 的词义张力。
