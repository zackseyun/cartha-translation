  text: יַ֣עַן הַכְא֤וֹת לֵב צַדִּיק֙ שֶׁ֔קֶר וַ/אֲנִ֖י לֹ֣א הִכְאַבְתִּ֑י/ו וּ/לְ/חַזֵּק֙ יְדֵ֣י רָשָׁ֔ע לְ/בִלְתִּי שׁ֛וּב מִ/דַּרְכּ֥/וֹ הָ/רָ֖ע לְ/הַחֲיֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/022.yaml
  text: Because you have disheartened the heart of the righteous with falsehood[a], though I had not caused him grief, and because you have strengthened the hands of the wicked so that he does not turn from his evil way to preserve his life[b],
translation:
  language: zh_hans
  text: 因为你们用虚假使义人的心忧伤[a]，我却没有使他忧伤；又因为你们使恶人的手有力，使他不回头离开自己的恶道，好叫他得以存活[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用谎言”。希伯来语名词既可指抽象的“虚假”，也可较具体地指“谎言”。
    reason: lexical_alternative
  - marker: b
    text: 或较直译为“使他不从自己的恶道回头，以使他存活”或“使他……而存活”。末尾短语可表达生命的目的或结果；上下文表明，生命与从恶道回转有关。
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: 因为
  rationale: 引出上下文中审判的理由，保留明确的因果关系。
- source_word: הַכְאוֹת לֵב צַדִּיק
  choice: 使义人的心忧伤
  rationale: 使役形式直译为“使……忧伤”，既保留“心”这一宾语，也与后句同根动词相呼应。
- source_word: שֶׁקֶר
  choice: 用虚假
  rationale: 按抽象名词处理，并以“用”表达其工具性；具体译作“谎言”也成立。
- source_word: וַאֲנִי לֹא הִכְאַבְתִּיו
  choice: 其实我并没有使他忧伤
  rationale: 保留第一人称对照、否定和使役含义；“其实”自然呈现希伯来语中的反差。
- source_word: וּלְחַזֵּק יְדֵי רָשָׁע
  choice: 又因为你们使恶人的手有力
  rationale: 保留希伯来语“使手有力”的形象，同时用第二个“因为”清楚呈现与前项并列的定罪理由。
- source_word: לְבִלְתִּי שׁוּב מִדַּרְכּוֹ הָרָע
  choice: 使他不回头离开自己的恶道
  rationale: 保留 שוב 的“回转”意象和 דרך 的伦理性“道路”表达，不把悔改含义过度解释。
- source_word: לְהַחֲיֹתוֹ
  choice: 因而得以存活
  rationale: 将末尾使役不定式理解为回转本可带来的存活结果，并保留“生命”所指范围的开放性。
theological_decisions:
- issue: 末尾 לְהַחֲיֹתוֹ 与“不回头”的逻辑关系
  choice: 使他不回头离开自己的恶道，因而得以存活
  alternative: 使他不回头离开自己的恶道，好保全他的性命
  rationale: 这里的生命与从恶道回转相关。译文避免误读为恶人不回转反而得以存活，也不限定为永生或仅指今世性命；脚注保留较贴近形式的另一种表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“义人”“恶人”“恶道”保留先知文学的伦理用语；“使……的手有力”保留原文意象。经文在希伯来语中是审判理由句，后文尚未结束，因此以逗号收束。
