- from: 随后，他领我从大门旁边的入口进去，来到供祭司使用、朝北的圣屋；看哪，在这些屋子西边的尽头[a]有一个地方。
  to: 随后，他领我从大门旁边的入口进去，来到供祭司使用、朝北的圣室；看哪，在这些圣室最西端[a]有一个地方。
  rationale: 仅作术语和方位表达的安全性修订：“圣室”更符合圣殿建筑语境；“最西端”明确表示前述圣室本身的远西端，并保留原文三复数后缀所指。其余句法、叙事推进和“看哪”的异象性提示均维持不变。
