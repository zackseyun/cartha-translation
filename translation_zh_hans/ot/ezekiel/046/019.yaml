  text: וַ/יְבִיאֵ֣/נִי בַ/מָּבוֹא֮ אֲשֶׁ֣ר עַל כֶּ֣תֶף הַ/שַּׁעַר֒ אֶל הַ/לִּשְׁכ֤וֹת הַ/קֹּ֨דֶשׁ֙ אֶל הַ/כֹּ֣הֲנִ֔ים הַ/פֹּנ֖וֹת צָפ֑וֹנָ/ה וְ/הִנֵּה שָׁ֣ם מָק֔וֹם ב/ירכת/ם יָֽמָּ/ה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/019.yaml
  text: Then he brought me through the entrance that was beside the gate to the holy chambers for the priests[a], which faced north; and behold, there was a place there at their far western end.
translation:
  language: zh_hans
  text: 随后，他领我从大门旁边的入口进去，来到供祭司使用、朝北的圣室；看哪，在这些圣室最西端[a]有一个地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“在它们的尽头，向西。”
    reason: 说明原文将“尽头”和“向西”并列，并保留三复数后缀“它们”；正文按自然汉语表达为“这些圣室最西端”。
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: 随后，他领我
  rationale: 该词是בוא的使役形叙事式，并带第一人称单数宾语后缀；“随后”体现叙事推进，“领我”自然表达被带领移动。
- source_word: בַמָּבוֹא
  choice: 从……入口进去
  rationale: מָבוֹא指入口或通道；介词ב在此表示经由该入口移动，用“从……入口进去”既保留路径意义，也符合现代汉语表达。
- source_word: אֲשֶׁר עַל כֶּתֶף הַשַּׁעַר
  choice: 大门旁边的
  rationale: כֶּתֶף本义为“肩”，在建筑方位中指侧边；译作“旁边”清楚而不生硬。
- source_word: אֶל הַלִּשְׁכוֹת הַקֹּדֶשׁ אֶל הַכֹּהֲנִים
  choice: 来到供祭司使用的圣屋
  rationale: לִשְׁכוֹת是圣殿建筑中的房间；הַקֹּדֶשׁ表明其神圣用途，第二个אֶל表明这些房间与祭司的关系。译文不把该关系过度限定为所有权。
- source_word: הַפֹּנוֹת צָפוֹנָה
  choice: 朝北的
  rationale: פנה的分词复数形式修饰这些房间，צָפוֹנָה表示向北；“朝北”准确传达建筑朝向。
- source_word: וְהִנֵּה שָׁם מָקוֹם
  choice: 看哪，……有一个地方
  rationale: 保留הִנֵּה引人注意的视觉和异象语气；מָקוֹם按其普通意义译为“地方”。
- source_word: בְּיַרְכְתָם יָמָּה
  choice: 在这些屋子西边的尽头
  rationale: יַרְכָה表示后部、深处或远端，三复阳后缀指回前述房间；יָמָּה在此为“向西、西边”。译文保留了后缀所表达的所属关系和方位。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“圣屋”延续圣殿建筑语境；“看哪”保留以西结异象叙述中引人注目的语气。脚注标记紧随其所解释的方位短语。
