  text: They shall provide the lamb, the grain offering, and the oil, morning by morning, as a regular burnt offering.
translation:
  language: zh_hans
  text: 每天早晨，他们都要为常献的燔祭预备那只羊羔、素祭和油。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: 他们都要预备
  rationale: 该动词基本义为“做、办理”，在献祭物的语境中自然译为“预备”；复数主语保持原文未明说具体身份的特点。
- source_word: הַכֶּבֶשׂ
  choice: 那只羊羔
  rationale: 保留定冠词的指称作用，与上文所规定的每日羊羔相呼应。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 这是摩西律法献祭体系中的常用术语，指以谷物为主要祭物的供献。
- source_word: הַשֶּׁמֶן
  choice: 油
  rationale: 按原文直译；结合上文可知用于素祭，但本节不额外补明。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 每天早晨
  rationale: 希伯来语重复“早晨”表达逐日、每早晨之意，现代汉语以“每天早晨”自然传达。
- source_word: עֹלַת תָּמִיד
  choice: 常献的燔祭
  rationale: עֹלָה采用通行礼仪术语“燔祭”；תָּמִיד表示持续、定常，译为“常献的”以体现每日固定献上的性质。
theological_decisions:
- issue: 羊羔、素祭和油与“燔祭”的句法关系
  choice: 译作“作为常献的燔祭”
  alternative: 译作“为常献的燔祭”或仅将羊羔称为燔祭
  rationale: 原文末尾的עֹלַת תָּמִיד概括整项每日供献；“作为”保留其表语或功能关系，同时不另行断定素祭和油本身都属于燔祭的祭物类别。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语；语序稍作汉语化处理，将“每天早晨”前置以突出每日持续性。
