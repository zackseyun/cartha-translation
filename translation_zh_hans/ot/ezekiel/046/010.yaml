base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/010.yaml
  text: And the prince shall be among them[a]; when they enter, he shall enter, and when they go out[b], he shall go out.
translation:
  language: zh_hans
  text: 首领要在他们中间[a]；他们进来时，他也要进来；他们出去时，也要一同出去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们当中”。
    reason: lexical_alternative
  - marker: b
    text: 原文末句动词为复数：“他们要出去”；按上下文，这复数可指首领与众人一同出去。
    reason: textual_grammar_clarification
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: 君王
  rationale: נָשִׂיא在《以西结书》40—48章中是特定称号，指参与圣殿礼仪的民政领袖。“君王”保留其尊贵而具治理权的身份，同时不进一步断定其弥赛亚或王室性质。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 直译为“在他们当中／中间”，表明君王与百姓同处，而非与他们隔开；中文自然且贴近原文。
- source_word: בְּבוֹאָם
  choice: 他们进来时
  rationale: 介词加不定词结构及第三人称复数词尾表达时间背景，译为“他们进来时”自然准确。
- source_word: יָבֹוא
  choice: 他也要进来
  rationale: 未完成式处于礼仪规程语境，译作“要进来”表达规定或应有的行动；“也”体现君王随众人行动的关系。
- source_word: וּבְצֵאתָם
  choice: 他们出去时
  rationale: 该结构与בְּבוֹאָם平行，表达“当他们出去的时候”，并保留进出动作的对称。
- source_word: יֵצֵאוּ
  choice: 也要一同出去
  rationale: 马所拉文本为第三人称阳性复数“他们要出去”，不是单数“他要出去”。结合前文君王“在他们中间”，译文用“一同”自然表达众人共同出去，但以脚注说明原文形式，避免把复数主语静默改成单数。
theological_decisions:
- issue: 以西结圣殿异象中君王的身份
  choice: 采用“君王”这一称号，不在译文中把他明确等同于弥赛亚或某位特定历史君主。
  alternative: 译作“首领”或“统治者”，或明确作弥赛亚式解释。
  rationale: 本节只规定这位人物与敬拜者一同进出的程序。译文应保留其称号和身份张力，不加入经文本身未明说的神学认定。
- issue: 末句复数动词的主语与含义
  choice: 保留复数意义，译作“也要一同出去”，并用脚注交代原文。
  alternative: 按上下文将其解释性地改译为单数“他也要出去”。
  rationale: יֵצֵאוּ在WLC中明确为第三人称阳性复数。上下文很可能表达君王随众人出去，但不应把原文复数静默改成单数；“一同”兼顾语法形式与语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的规程性表达。“要”传达异象中礼仪规定的语气；句式保持“进来／出去”的平行。末句遵从希伯来文复数形式，同时以脚注保留其所指可能产生的解释张力。
