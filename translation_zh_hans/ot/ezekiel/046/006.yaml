base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/006.yaml
  text: And on the day of the new moon[a], there shall be an unblemished young bull from the herd, and six lambs and a ram; they shall be unblemished.
translation:
  language: zh_hans
  text: 在新月之日[a]，当有一头无残疾的公牛、六只羔羊和一只公羊；它们都要无残疾。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在月份之日”；在这里的祭祀语境中，指新月的礼仪日。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: 在新月之日
  rationale: 字面为“在月日”，但在此祭祀与历法语境中指每月的新月节期；译作“新月之日”既自然，也准确呈现其礼仪含义。
- source_word: פַּר בֶּן־בָּקָר
  choice: 一头小公牛
  rationale: 这是献祭用语，指牛群中的幼公牛。现代汉语以“小公牛”表达最自然，无须直译为“牛之子”。
- source_word: תְּמִימִם
  choice: 没有残疾
  rationale: 在献祭语境中指祭牲无缺陷、无残损；“没有残疾”清楚易懂，并避免将其泛化为道德意义上的“完全”。
- source_word: וְשֵׁשֶׁת כְּבָשִׂים
  choice: 六只羔羊
  rationale: כְּבָשִׂים在祭牲清单中通常指羔羊；汉语量词用“只”。原文的阳性形式在此不必额外明译。
- source_word: וָאַיִל
  choice: 一只公绵羊
  rationale: אַיִל特指成年公羊；“公绵羊”比单说“公羊”更明确地区别于山羊，也符合现代汉语。
- source_word: יִהְיוּ
  choice: 这些祭牲都要没有残疾
  rationale: 复数动词承接清单，并使无残疾的要求落在所列祭牲上。补出“这些祭牲”符合汉语表达，也保留法规性的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的法规性表达。“要献”根据祭牲清单的语境补出，使汉语句意完整；分号保留原文先列祭牲、再总述无残疾要求的结构。
