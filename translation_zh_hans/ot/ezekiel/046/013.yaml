  text: וְ/כֶ֨בֶשׂ בֶּן שְׁנָת֜/וֹ תָּמִ֗ים תַּעֲשֶׂ֥ה עוֹלָ֛ה לַ/יּ֖וֹם לַֽ/יהֹוָ֑ה בַּ/בֹּ֥קֶר בַּ/בֹּ֖קֶר תַּעֲשֶׂ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/013.yaml
  text: And you shall offer a year-old male lamb without blemish as a burnt offering to Yahweh daily[a]; morning by morning you shall offer it.
translation:
  language: zh_hans
  text: 你要每天献一只一岁的、没有瑕疵的公羊羔，作燔祭献给雅威；每天早晨[a]都要献上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“早晨，早晨”，表示一个早晨接一个早晨地重复；也可译为“每天早晨”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶבֶשׂ
  choice: 公羊羔
  rationale: 该词指羊羔，在献祭语境中通常为公羊；译作“公羊羔”可清楚表达祭牲的种类与性别。
- source_word: בֶּן שְׁנָתוֹ
  choice: 一岁的
  rationale: 希伯来语习语直译为“它那一年的儿子”，实际指一岁或处于第一年内的牲畜；“一岁的”符合现代汉语表达。
- source_word: תָּמִים
  choice: 没有残疾的
  rationale: 在献祭语境中指祭牲完整、无缺陷；“没有残疾的”通俗、准确。
- source_word: תַּעֲשֶׂה
  choice: 献
  rationale: 动词本义为“做、制作”，但在祭物语境中表示预备并献上，汉语译作“献”最自然。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 这是指祭物全部焚烧献上的固定祭祀术语；“燔祭”准确且为中文圣经传统中通行的表达。
- source_word: לַיּוֹם
  choice: 每天
  rationale: 此处作时间副词，表示每日例行献祭；“每天”简洁自然。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词表示祭物献祭的对象；“献给”符合汉语搭配，并将神名 יהוה 音译为“雅威”。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 每天早晨
  rationale: “早晨”一词的重复具有逐次、分配意义，表示一个早晨接一个早晨，即每日早晨。
- source_word: אֹתוֹ
  choice: 献上
  rationale: 原文代词指前述公羊羔；汉语承前省略宾语更自然，动词“献上”仍清楚表达其所指。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”这一常见音译，以保留其作为上帝盟约之名的性质，而不以称号“主”替代。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“公羊羔”“燔祭”保留献祭制度所需的准确性；后半句以“每天早晨”自然表达希伯来语重复结构，并用脚注说明其字面形式。
