    rationale: 该词基本义为“首领、领袖、君长”。在以西结异象中通常以“首领”译之，既保留原文职称，也不将其无条件等同于王。
  - severity: medium
    issue: 末句加入“王赐给”和“永远”
    rationale: 希伯来文直陈“只是他的产业，他的儿子——要归他们”。与仆人的暂时持有形成对比确实暗示儿子的持续权利，但“赐给”和“永远”都不是原文明说的成分；应让正文保留其简洁与一定句法歧义。
