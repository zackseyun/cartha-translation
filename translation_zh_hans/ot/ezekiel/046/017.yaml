id: EZK.46.17
reference: Ezekiel 46:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִֽי יִתֵּ֨ן מַתָּנָ֜ה מִ/נַּחֲלָת֗/וֹ לְ/אַחַד֙ מֵֽ/עֲבָדָ֔י/ו וְ/הָ֤יְתָה לּ/וֹ֙ עַד שְׁנַ֣ת הַ/דְּר֔וֹר וְ/שָׁבַ֖ת לַ/נָּשִׂ֑יא אַ֚ךְ נַחֲלָת֔/וֹ בָּנָ֖י/ו לָ/הֶ֥ם תִּהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/017.yaml
  text: But if he gives a gift from his inheritance to one of his servants[a], it shall belong to him until the year of liberty; then it shall return to the prince. Only his inheritance belongs to his sons; it shall be theirs.
translation:
  language: zh_hans
  text: 但首领若把自己产业中的一份赐给他的一个仆人，这份产业就归那仆人，直到自由之年[a]；随后要归还首领。只是首领的产业要归他的儿子，属于他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自由之年”也可译作“释放之年”。这里可能指一种类似禧年的产业复归之年，不过原文用的是“自由”一词，而不是通常译作“禧年”的词。
    reason: 说明 דְּרוֹר 的词义及其与禧年制度的可能关系，同时避免把两者直接等同。
lexical_decisions:
- source_word: וְכִי
  choice: 但……若
  rationale: 引出与上一节相对的条件情形，兼顾连接词和条件语气。
- source_word: מַתָּנָה מִנַּחֲלָתוֹ
  choice: 把自己产业中的一份赐给
  rationale: מַתָּנָה 指赠与，נַחֲלָה 在此指可承继的土地产业；译文以动词结构自然表达赠与行为，并用“一份”表明是产业中的部分。
- source_word: לְאַחַד מֵעֲבָדָיו
  choice: 给他的一个仆人
  rationale: עֶבֶד 可指仆人或奴仆；本节重在仆人与儿子的继承权差异，“仆人”既自然，也保留其从属身份。
- source_word: וְהָיְתָה לּוֹ
  choice: 这份产业就归那仆人
  rationale: 明确阴性动词所指的是所赠的产业份额，也清楚表达其暂时归属，避免中文代词歧义。
- source_word: עַד שְׁנַת הַדְּרוֹר
  choice: 直到自由之年
  rationale: דְּרוֹר 的基本义是自由、释放；直译保留原词措辞，不直接以通常表示禧年的 יוֹבֵל 取代。
- source_word: וְשָׁבַת לַנָּשִׂיא
  choice: 之后要归还王
  rationale: שׁוב 表示返回、归还；נָשִׂיא 在以西结异象的制度语境中译作“王”，符合现代中文圣经语体，并与上下文统治者身份相称。
- source_word: אַךְ נַחֲלָתוֹ בָּנָיו לָהֶם תִּהְיֶה
  choice: 惟有王赐给儿子的产业才归他的儿子，要永远属于他们
  rationale: אַךְ 表限制；希伯来语省略了赠与关系中的部分成分，结合上一节和本节的对比补出“赐给”。“要永远”表达与仆人仅持有到自由之年相对的永久世袭效力。
theological_decisions:
- issue: עֶבֶד 在土地赠与法规中的译法
  choice: 仆人
  alternative: 奴仆／奴隶
  rationale: 原词涵盖不同程度的隶属身份。本节的焦点是受赠者没有儿子那样的永久继承权，而非具体界定其奴役状态，因此正文采用较宽泛的“仆人”。
- issue: שְׁנַת הַדְּרוֹר 的性质
  choice: 自由之年
  alternative: 释放之年／禧年
  rationale: 该年显然涉及产业复归，功能类似禧年，但原文使用 דְּרוֹר（自由、释放），不是通常的“禧年”一词 יוֹבֵל；正文保留词义，脚注说明其制度背景。
- issue: 末句的永久归属含义
  choice: 要永远属于他们
  alternative: 要属于他们
  rationale: “永远”不是独立对应某个明说的副词，而是由本节对比产生：赐给仆人的产业届时归还，赐给儿子的则作为世袭产业留给他们。译文将这一法律对比明示出来。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。重复“产业”和“仆人”以消除中文代词可能造成的指代不明；“惟有……才……”突出原文的限制和儿子与仆人之间的法律对比。
