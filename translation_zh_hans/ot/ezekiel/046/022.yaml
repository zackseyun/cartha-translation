base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/022.yaml
  text: In the four corners of the court there were enclosed courts[a], forty long and thirty wide[c][b]; the four of them had the same measurement.
translation:
  language: zh_hans
  text: 院子的四角都有围合的小院[a]，长四十，宽三十[b]；这四个小院[c]的尺寸相同。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有墙围住的小院”或“封闭的小院”。希伯来语形容词很可能表示这些小院是围合的空间。
    reason: lexical_alternative
  - marker: b
    text: 本节希伯来原文没有明说计量单位；根据上下文中圣殿的尺寸，通常理解为“肘”。
    reason: cultural_note
  - marker: c
    text: 此处对应的希伯来语末词罕见且难解；它也可能再次强调这些小院设在院子的四角。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֹעוֹת
  choice: 四角
  rationale: 在圣殿建筑语境中指院子的四个角或角落区域；“四角”简洁自然。
- source_word: חֲצֵרוֹת
  choice: 小院
  rationale: 指大院内较小的院落；译作“小院”能清楚区别于前面的整个院子。
- source_word: קְטֻרוֹת
  choice: 围起来的
  rationale: 该形容词表示封闭、围住；此译法保留空间被围合的含义，又不武断说明是用墙围成。
- source_word: אַרְבָּעִים אֹרֶךְ וּשְׁלֹשִׁים רֹחַב
  choice: 长四十，宽三十
  rationale: 原文省略计量单位，按现代汉语习惯表达长宽，同时不在正文补入原文未明说的“肘”。
- source_word: מִדָּה אַחַת
  choice: 尺寸都一样
  rationale: 该短语说明四个小院具有同一量度；“尺寸都一样”自然准确。
- source_word: לְאַרְבַּעְתָּם
  choice: 这四个
  rationale: 所带代词回指四个角落里的小院；中文用“这四个”衔接清楚。
- source_word: מְהֻקְצָעוֹת
  choice: 角院
  rationale: 这是罕见且难解的被动形式，可能再次强调这些院落位于四角。正文以“角院”保留这一空间信息，并用脚注说明不确定性。
