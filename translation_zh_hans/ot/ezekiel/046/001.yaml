source:
  edition: WLC
  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ שַׁ֜עַר הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ הַ/פֹּנֶ֣ה קָדִ֔ים יִהְיֶ֣ה סָג֔וּר שֵׁ֖שֶׁת יְמֵ֣י הַֽ/מַּעֲשֶׂ֑ה וּ/בְ/י֤וֹם הַ/שַּׁבָּת֙ יִפָּתֵ֔חַ וּ/בְ/י֥וֹם הַ/חֹ֖דֶשׁ יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/001.yaml
  text: 'Thus says the Lord GOD: The gate of the inner court that faces east shall be shut during the six working days[a], but on the Sabbath day it shall be opened, and on the day of the new moon it shall be opened.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“内院朝东的门，在六个工作日都要关闭；但在安息日要打开，在新月之日[a]也要打开。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文指每月举行新月礼仪的日子。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传达神谕的固定使者公式，庄重而符合现代汉语圣经语体。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי 的“主”和四字神名 יהוה；“主耶和华”也是中文读者熟悉且不显累赘的复合称号。
- source_word: שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: 内院……的门
  rationale: 准确表达附属关系；“内院”简洁地对应圣殿建筑语境中的内层院落。
- source_word: הַפֹּנֶה קָדִים
  choice: 朝东
  rationale: 自然表达分词短语所说明的门之朝向。
- source_word: יִהְיֶה סָגוּר
  choice: 要关闭
  rationale: 表达 היה 加被动分词所指的持续关闭状态，同时保持规章性语气。
- source_word: שֵׁשֶׁת יְמֵי הַמַּעֲשֶׂה
  choice: 六个工作日
  rationale: 该短语指与安息日相对的日常劳作之日；现代汉语“工作日”清楚简洁，但可能被现代五日工作周误读，故保留“六个”限定。
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: 但在安息日
  rationale: 连接词在上下文中形成关闭与打开的对比，用“但”自然显明这一关系。
- source_word: יִפָּתֵחַ
  choice: 要打开
  rationale: 对应 פתח 的尼斐勒未完成式，表达门被打开；中文无需生硬使用被动标记。
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: 在初一
  rationale: 在祭祀历法语境中，חֹדֶשׁ 指新月之日及其礼仪；“初一”是自然的现代汉语表达，并以脚注说明其文化含义。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”既区分称号 אֲדֹנָי 与四字神名 יהוה，也延续广为人知的中文圣经称法；不以“主上帝”抹去专名性质，也不在正文采用对神名读音仍有讨论的音译。
- issue: הַחֹדֶשׁ 在礼仪历法中的含义
  choice: 初一
  alternative: 新月日；月朔
  rationale: 上下文将其与安息日并列，所指不是泛泛的“月份”，而是每月新月出现时的礼仪日。“初一”最易为现代读者理解，脚注保留其新月礼仪背景。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。保留先知宣告公式和规章语气；避免“月朔”等较生僻旧词，并以脚注补充古代以新月为月首的礼仪背景。
