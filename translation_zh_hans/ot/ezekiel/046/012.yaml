source:
  edition: WLC
  text: וְ/כִֽי יַעֲשֶׂה֩ הַ/נָּשִׂ֨יא נְדָבָ֜ה עוֹלָ֣ה אֽוֹ שְׁלָמִים֮ נְדָבָ֣ה לַֽ/יהוָה֒ וּ/פָ֣תַֽח ל֗/וֹ אֶת הַ/שַּׁ֨עַר֙ הַ/פֹּנֶ֣ה קָדִ֔ים וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו כַּ/אֲשֶׁ֥ר יַעֲשֶׂ֖ה בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/יָצָ֛א וְ/סָגַ֥ר אֶת הַ/שַּׁ֖עַר אַחֲרֵ֥י צֵאתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/012.yaml
  text: But when the prince makes a freewill offering to Yahweh[a], either a burnt offering or peace offerings, the gate that faces east shall be opened for him, and he shall offer his burnt offering and his peace offerings as he does on the Sabbath day. Then he shall go out[b], and after he goes out the gate shall be shut.
translation:
  language: zh_hans
  text: 但首领若向雅威献甘心祭，无论是燔祭还是平安祭，朝东的门要为他打开；他要献上燔祭和平安祭，照他在安息日所行的那样献上。随后他要出去；他出去后，门要关上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: 但……若
  rationale: 在连续的礼仪条例中转入一种特别情形，兼具承接、转折与条件意味；现代汉语用“但……若”自然清楚。
- source_word: הַנָּשִׂיא
  choice: 王
  rationale: נָשִׂיא在《以西结书》圣殿条例中指具有政治及礼仪职责的领袖；中文圣经传统多译“王”。此处不译“君王”，以免强化其为绝对君主的意味。
- source_word: נְדָבָה
  choice: 自愿……供物
  rationale: 表示不是按固定义务献上的自愿奉献；结合动词译为“自愿献上供物”，避免生硬重复“自愿祭”。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 这是整只焚烧献上的标准祭祀术语；“燔祭”准确且为中文读者熟知。
- source_word: שְׁלָמִים
  choice: 平安祭
  rationale: 保留该词与完整、安康、平安的词义联系，也符合中文圣经中的通行祭祀术语。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词表示供物献给雅威；“向雅威献上”符合现代汉语习惯，并直接呈现神名。
- source_word: וּפָתַח לוֹ
  choice: 就要有人为他打开
  rationale: 希伯来语动词为第三人称阳性单数，但主语未明说。中文用“有人”保留执行者未指明这一点，又比无主被动句更自然。
- source_word: הַשַּׁעַר הַפֹּנֶה קָדִים
  choice: 朝东的门
  rationale: 简洁自然地表达该门朝向东方。
- source_word: וְעָשָׂה
  choice: 他要献上
  rationale: עָשָׂה在献祭语境中表示办理或献上祭物；“献上”比字面的“做”更符合现代汉语。
- source_word: כַּאֲשֶׁר יַעֲשֶׂה בְּיוֹם הַשַּׁבָּת
  choice: 照安息日所行的办理
  rationale: 指照前文已经规定的安息日程序而行，保留礼仪程序的比较关系。
- source_word: וְיָצָא
  choice: 随后他要出去
  rationale: 明确表达礼仪步骤的先后次序。
- source_word: וְסָגַר אֶת־הַשַּׁעַר אַחֲרֵי צֵאתוֹ
  choice: 他出去后，就要有人把门关上
  rationale: 关门动词同样没有明说执行者；用“有人”保留这种未指明性，并清楚表示关门发生在王出去之后。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”力求呈现其专名性质，不以称号代替，也不采用较晚形成的混合读音。
- issue: שְׁלָמִים所指祭物的译法
  choice: 平安祭
  alternative: 团契祭；酬恩祭
  rationale: 该词可强调福祉、完整以及共享祭餐等不同层面。“平安祭”保留较宽的语义范围，不把本节限定为某一种解释。
- issue: 开门和关门者的身份
  choice: 有人为他开门并关门
  alternative: 门要为他打开并关上；他亲自开门并关门
  rationale: 希伯来语使用未明说主语的第三人称单数动词。上下文没有明确执行者，因此不认定是王本人或某一特定圣职人员。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪法规文体。保留“燔祭、平安祭、安息日”等必要且通行的圣经术语；句序按程序推进。原文开门、关门的执行者未明，正文以“有人”自然呈现，不另加脚注。
