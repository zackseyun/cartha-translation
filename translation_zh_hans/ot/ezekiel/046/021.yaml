base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/021.yaml
  text: Then he brought me out to the outer court and led me past the four corners of the court[a], and behold, in each corner of the court there was a court.
translation:
  language: zh_hans
  text: 他带我到外院，又领我经过院子的四个角。看哪，院子的每个角落都有一个院子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在提到四个角之后重复说：“院子的角落里有一个院子，院子的角落里有一个院子。”这里的意思是四个角落各有一个院子。
    reason: 说明原文重复结构及其分配性含义。
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: 他带我出去，来到
  rationale: יצא的使役式带第一人称单数后缀，意为“使我出去、带我出去”；补出“来到”使汉语自然呈现移动的目的地，而不改变原意。
- source_word: הֶחָצֵר הַחִיצֹנָה
  choice: 外院
  rationale: חָצֵר在圣殿建筑语境中指院子，הַחִיצֹנָה指外部；“外院”是简明、通行的建筑称谓。
- source_word: וַיַּעֲבִירֵנִי
  choice: 又领我经过
  rationale: עבר的使役式表示使人经过、穿过或从旁走过；在察看院落的空间语境中，“领我经过”既保留移动意味，也避免误解为只抵达某处。
- source_word: אַרְבַּעַת מִקְצוֹעֵי הֶחָצֵר
  choice: 院子的四个角
  rationale: מִקְצוֹעַ指建筑空间的角或角落；“四个角”准确而自然。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留该提示词引导注意、突出异象所见之物的功能，也符合庄重的经文语体。
- source_word: חָצֵר בְּמִקְצֹעַ הֶחָצֵר חָצֵר בְּמִקְצֹעַ הֶחָצֵר
  choice: 院子的每个角落里都有一个小院
  rationale: 原文在已经提到四角后重复“院角有院”，语义上具有逐一分配的作用。“每个角落里”自然表达四角各有一院；用“小院”与作为整体的外院相区别，但不额外规定其用途。
