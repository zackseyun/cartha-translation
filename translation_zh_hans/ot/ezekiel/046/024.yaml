source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י אֵ֚לֶּה בֵּ֣ית הַֽ/מְבַשְּׁלִ֔ים אֲשֶׁ֧ר יְבַשְּׁלוּ שָׁ֛ם מְשָׁרְתֵ֥י הַ/בַּ֖יִת אֶת זֶ֥בַח הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/024.yaml
  text: Then he said to me[b][a], “These are the kitchens where the ministers of the temple shall boil the people's sacrifice.”
translation:
  language: zh_hans
  text: 他对我说：“这些是煮祭肉的房间[a]；殿里的侍从[b]要在这里煮百姓的祭牲。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“煮食者的房屋”；也可译“烹煮房”。
    reason: lexical_alternative
  - marker: b
    text: 或译“殿里的服事人员”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַמְבַשְּׁלִים
  choice: 煮祭肉的房间
  rationale: 字面是“煮食者的房屋”。在圣殿建筑语境中，所指是专供烹煮祭肉的处所；译作“煮祭肉的房间”既自然，也明确其用途。
- source_word: מְבַשְּׁלִים / יְבַשְּׁלוּ
  choice: 煮
  rationale: בשׁל可指煮或烹调，且本节名词性分词和限定动词同根。以“煮”重复呈现，可保留原文的词根呼应及祭牲烹制语境。
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: 殿里的侍从
  rationale: מְשָׁרְתֵי指履行职务、服侍的人；הַבַּיִת在本异象中指圣殿。译作“殿里的侍从”保留职务性服侍的含义，同时不额外指定其祭司身份。
- source_word: זֶבַח הָעָם
  choice: 百姓的祭牲
  rationale: זֶבַח指经宰杀献上的祭物，而非一般礼物。“祭牲”准确表达其祭祀及牲畜性质；属格结构保留为“百姓的”。
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 连续式叙事动词承接上文。现代汉语无需机械加入“然后”，简洁的“他对我说”即可自然推进叙事。
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 按汉语判断句习惯补出系词“是”，清楚表达指认。
- source_word: שָׁם
  choice: 在这里
  rationale: 原义为“在那里”。因说话者正在指示眼前这些房间，汉语用“在这里”自然地表达该处所关系。
theological_decisions:
- issue: מְשָׁרְתֵי הַבַּיִת是否特指祭司
  choice: 殿里的侍从
  alternative: 殿里的祭司／圣殿的服事人员
  rationale: 原文只称其为在殿中供职者，并未在本节明确使用“祭司”一词；因此不把身份范围收窄，以保留原文的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“殿”承接以西结圣殿异象的语境；“祭牲”比泛称“祭物”更贴近 זֶבַח。“煮祭肉的房间”避免把希伯来语形式上的单数集合结构误解为仅一个房间。
