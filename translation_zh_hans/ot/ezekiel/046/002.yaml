  text: וּ/בָ֣א הַ/נָּשִׂ֡יא דֶּרֶךְ֩ אוּלָ֨ם הַ/שַּׁ֜עַר מִ/ח֗וּץ וְ/עָמַד֙ עַל מְזוּזַ֣ת הַ/שַּׁ֔עַר וְ/עָשׂ֣וּ הַ/כֹּהֲנִ֗ים אֶת עֽוֹלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו וְ/הִֽשְׁתַּחֲוָ֛ה עַל מִפְתַּ֥ן הַ/שַּׁ֖עַר וְ/יָצָ֑א וְ/הַ/שַּׁ֥עַר לֹֽא יִסָּגֵ֖ר עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/002.yaml
  text: And the prince shall enter by way of the porch of the gate from outside[a], and shall stand by the doorpost of the gate. Then the priests shall offer his burnt offering and his peace offerings, and he shall bow down in worship at the threshold of the gate. Then he shall go out, but the gate shall not be shut until evening.
translation:
  language: zh_hans
  text: 首领要从外面经由这门的廊子进入，站在门柱旁。祭司要献上他的燔祭和平安祭[a]；他要在这门的门槛处俯伏敬拜，然后出去。这道门直到晚上都不可关闭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”或译“团契祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: 首领
  rationale: 该词指具有特定地位的民政或王室人物，却不等同于“王”；“首领”既自然，也避免预先认定其为君王或弥赛亚。
- source_word: דֶּרֶךְ אוּלָם הַשַּׁעַר מִחוּץ
  choice: 从外面经由门廊进入
  rationale: 保留“从外面”的起点和“经由门廊”的路线，同时采用现代汉语中清楚自然的空间表达。
- source_word: מְזוּזַת הַשַּׁעַר
  choice: 门柱旁
  rationale: מְזוּזָה指门框两侧的立柱；“门柱”简明而保留建筑细节。
- source_word: וְעָשׂוּ הַכֹּהֲנִים אֶת עֹלָתוֹ
  choice: 祭司要献上他的燔祭
  rationale: עָשָׂה用于祭物时表示办理或献上祭物；“献上”符合现代汉语的献祭语境。
- source_word: שְׁלָמָיו
  choice: 他的平安祭
  rationale: שְׁלָמִים传统且直接的译法为“平安祭”，并保留该词与完整、平安的词义联系；“团契祭”列入脚注作为可能译法。
- source_word: וְהִשְׁתַּחֲוָה
  choice: 俯伏敬拜
  rationale: 同时传达身体俯伏的动作和向神敬拜的含义。
- source_word: מִפְתַּן הַשַּׁעַר
  choice: 门槛处
  rationale: מִפְתָּן指门槛或门下的横木；上下文已明确所指是该门，因此译为“门槛处”自然简洁。
- source_word: לֹא יִסָּגֵר עַד הָעָרֶב
  choice: 直到晚上才可关闭
  rationale: 准确表达门在傍晚以前不得关闭；“关闭”用于门，符合现代标准汉语。
theological_decisions:
- issue: 以西结圣殿异象中הַנָּשִׂיא的身份和地位
  choice: 译为“首领”，不加入弥赛亚或君王身份的解释
  alternative: 王、君王、弥赛亚君王
  rationale: 本节只说明此人在圣殿礼仪中的特权与限制，并未明确称他为王或弥赛亚；译文应保留其身份的开放性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“燔祭”和“平安祭”保留常用的圣经祭祀术语；句法按希伯来文的行动顺序展开，同时避免生硬直译。脚注标记置于其实际说明的“平安祭”之后。
