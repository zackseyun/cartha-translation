base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/004.yaml
  text: And the burnt offering that the prince presents to Yahweh on the Sabbath day shall be six unblemished lambs and one unblemished ram[a].
translation:
  language: zh_hans
  text: 安息日那天，首领献给[a]雅威的燔祭是六只没有残疾的羊羔和一只没有残疾的公绵羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献给”所译的希伯来语动词，字面意思是“带到近前”，在献祭语境中也可译作“呈献”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹלָה
  choice: 燔祭
  rationale: עֹלָה在献祭语境中指整只焚烧献上的祭物；“燔祭”是中文圣经传统中准确而简洁的对应词。
- source_word: אֲשֶׁר יַקְרִב
  choice: 献给
  rationale: קרב的使役形在献祭语境中本义为“使靠近、带到近前”，实际指呈献祭物；“献给”自然清楚，同时保留祭物归向雅威的含义。
- source_word: הַנָּשִׂיא
  choice: 领袖
  rationale: נָשִׂיא指有正式地位的民政统治者，但不必然是王；“领袖”避免中文“王子”所暗示的王室血缘，也符合以西结异象中的职分。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词ל表示祭物呈献的对象；专名יהוה音译为“雅威”，保留经文中的神圣名字。
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: 安息日那天
  rationale: 准确表达指定的时间，现代汉语自然明白。
- source_word: שִׁשָּׁה כְבָשִׂים
  choice: 六只羊羔
  rationale: כְבָשִׂים在献祭清单中通常指羔羊；量词“只”符合现代汉语。
- source_word: תְּמִימִם / תָּמִים
  choice: 没有残疾的
  rationale: תמים用于祭牲时指身体完整、无可见缺陷；“没有残疾”比一般性的“完全”更准确地传达礼仪语境。
- source_word: וְאַיִל
  choice: 和一只公绵羊
  rationale: אַיִל明确指成年公羊；“公绵羊”在现代汉语中比单说“公羊”更明确，并补出“一只”以配合计数结构。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，保留其作为专名的性质，不以称号替代。
- issue: הַנָּשִׂיא 的身份称谓
  choice: 领袖
  alternative: 王子；君王；首领
  rationale: 此词在以西结圣殿异象中指具有治理和礼仪职责的人物，却未明确称其为王；采用“领袖”可避免额外断定其王室身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“燔祭”这一必要的礼仪术语；句序调整为自然汉语时间—主语—谓语结构。脚注说明קרב的字面意义及可选译法。
