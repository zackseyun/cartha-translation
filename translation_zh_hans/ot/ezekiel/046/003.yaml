  text: וְ/הִשְׁתַּחֲו֣וּ עַם הָ/אָ֗רֶץ פֶּ֚תַח הַ/שַּׁ֣עַר הַ/ה֔וּא בַּ/שַּׁבָּת֖וֹת וּ/בֶ/חֳדָשִׁ֑ים לִ/פְנֵ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/003.yaml
  text: And the people of the land shall bow down at the entrance of that gate[a], before Yahweh[b], on the Sabbaths and on the new moons.
translation:
  language: zh_hans
  text: 这地的百姓要在那门的入口处、在耶和华面前，每逢安息日和新月节俯伏下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为神名 יהוה（YHWH），传统译作“耶和华”，也常拟音为“雅威”。
    reason: divine_name
lexical_decisions:
- source_word: וְהִשְׁתַּחֲווּ
  choice: 俯伏敬拜
  rationale: 该动词既指俯身下拜的身体动作，也在此处表达敬拜；“俯伏敬拜”兼顾具体动作和宗教语境。
- source_word: עַם הָאָרֶץ
  choice: 这地的百姓
  rationale: 保留该短语的字面构造及其群体称谓；在本段语境中，它指有别于君王和祭司的一般民众。
- source_word: פֶּתַח הַשַּׁעַר הַהוּא
  choice: 在那门的入口处
  rationale: “入口处”自然表达 פֶּתַח 的空间含义，“那门”保留指示词 הַהוּא 对上文特定门的回指。
- source_word: בַּשַּׁבָּתוֹת
  choice: 在安息日
  rationale: 希伯来文为复数，表示每逢安息日的周期性场合；汉语通常以单数形式概括反复出现的节期。
- source_word: וּבֶחֳדָשִׁים
  choice: 和新月节
  rationale: חֹדֶשׁ 在祭祀历法语境中指新月时的节期，而非泛指月份。
- source_word: לִפְנֵי יְהוָה
  choice: 敬拜耶和华
  rationale: לִפְנֵי 表示在耶和华面前；汉语将其与“俯伏敬拜”连用，可自然传达在神面前敬拜的关系。神名 יְהוָה 音译为“耶和华”，并以脚注说明其形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者最熟悉的传统专名“耶和华”，同时用脚注指出原文为四字神名，并列出学界常用的拟音“雅威”，不把元音重构视为毫无疑义。
- issue: וְהִשְׁתַּחֲווּ 的动作与敬拜含义
  choice: 俯伏敬拜
  alternative: 下拜
  rationale: 上下文明确涉及在耶和华面前的圣礼活动；译文保留身体动作，同时不抹去其敬拜意义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“这地的百姓”保留原文社会群体称谓；“新月节”明确其礼仪历法含义。调整语序，把时间短语提前，使“在那门的入口处”与“俯伏敬拜耶和华”关系清楚。
