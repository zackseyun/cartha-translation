  text: וּ/מִנְחָה֩ תַעֲשֶׂ֨ה עָלָ֜י/ו בַּ/בֹּ֤קֶר בַּ/בֹּ֨קֶר֙ שִׁשִּׁ֣ית הָֽ/אֵיפָ֔ה וְ/שֶׁ֛מֶן שְׁלִישִׁ֥ית הַ/הִ֖ין לָ/רֹ֣ס אֶת הַ/סֹּ֑לֶת מִנְחָה֙ לַֽ/יהוָ֔ה חֻקּ֥וֹת עוֹלָ֖ם תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/014.yaml
  text: And you shall prepare with it[a], morning by morning, a grain offering of a sixth of an ephah, and a third of a hin of oil to moisten the fine flour—a grain offering to Yahweh[c][b], a perpetual statute continually.
translation:
  language: zh_hans
  text: 每天早晨，你要为它预备素祭[a]：一伊法的六分之一细面，和三分之一欣的油，用油润湿细面[b]。这是献给雅威的素祭；作为永远的定例，要不断地这样办理[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为它”也可译作“连同它”或“在它之上”；这里很可能指这素祭要与上一节每日所献的羊羔一同献上。
    reason: alternative_reading
  - marker: b
    text: “润湿”也可译作“调和”。这里的希伯来语动词很少见，表示用油使细面湿润。
    reason: lexical_alternative
  - marker: c
    text: 原文直译近似“永远的定例，常常如此”，以累积措辞强调这是长久而有规律的要求。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָה
  choice: 素祭
  rationale: 在祭祀语境中，מִנְחָה 指以细面和油为材料的谷物祭；“素祭”是现代中文圣经语体中清楚而通行的对应词。
- source_word: תַעֲשֶׂה
  choice: 你要……献上
  rationale: 该动词为第二人称阳性单数；结合祭祀语境，用“献上”比直译“制作”自然，并保留命令性质。
- source_word: עָלָיו
  choice: 连同它
  rationale: 介词短语很可能回指前一节每日所献的羊羔，表示素祭伴随该燔祭献上；“连同它”保留所指对象依赖上下文的特点。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 每天早晨
  rationale: 希伯来语重复表达分配、反复之意；现代汉语以“每天早晨”自然传达其规律性。
- source_word: שִׁשִּׁית הָאֵיפָה
  choice: 一伊法的六分之一
  rationale: 保留古代容量单位及原文精确比例。
- source_word: וְשֶׁמֶן שְׁלִישִׁית הַהִין
  choice: 油一欣的三分之一
  rationale: 保留古代容量单位“欣”，并按自然中文调整语序。
- source_word: לָרֹס אֶת־הַסֹּלֶת
  choice: 用来润和细面
  rationale: 罕见动词 רוס 表示以液体润湿，可能也含调和之意；“润和”既体现加油润湿，又不武断规定具体操作方式。
- source_word: מִנְחָה לַיהוָה
  choice: 献给雅威的素祭
  rationale: 重复“素祭”保留原文的复述与强调；יהוה 按其专名译为“雅威”。
- source_word: חֻקּוֹת עוֹלָם תָּמִיד
  choice: 是永远的定例，要常常献上
  rationale: 将原文累积表达的持久性与规律性分别译出，避免把 תָּמִיד 的持续、定期含义吞并在“永远”之中。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较直接地音译该名，避免以称号替代专名。
- issue: חֻקּוֹת עוֹלָם תָּמִיד 所表达的持续性
  choice: 永远的定例，要常常献上
  alternative: 永远常存的定例
  rationale: 原文同时使用 עוֹלָם 和 תָּמִיד，既强调定例的长久有效，也强调献祭的持续规律；分开表达可保留这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“素祭、伊法、欣、定例”等保留必要的祭祀与度量术语；句法适度拆分，使普通读者易于理解，同时保留原文末尾对持续性的双重强调。
