  text: וּ/בְ/ב֖וֹא הַ/נָּשִׂ֑יא דֶּ֣רֶךְ אוּלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/בְ/דַרְכּ֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/008.yaml
  text: When the prince enters[a], he shall enter by way of the porch of the gate, and he shall go out by the same way.
translation:
  language: zh_hans
  text: 首领进来时，要经由这门的廊子进入，也要沿原路出去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/ב֖וֹא
  choice: 进来的时候
  rationale: 介词 בְּ 加 בוא 的不定词构造在此表达时间关系；译为“进来的时候”符合现代汉语，也保留原文的时间意味。
- source_word: הַ/נָּשִׂיא
  choice: 君王
  rationale: נָשִׂיא 在以西结异象中指具有治理身份的人物，但未必是“国王”；“君王”沿用中文圣经语境中较为熟悉的称呼，同时不在本节中断定其弥赛亚身份。
- source_word: דֶּרֶךְ אוּלָם הַ/שַּׁעַר
  choice: 从门廊进入
  rationale: 原文直译为“经由门的廊子进入”。现代汉语用“从门廊进入”简洁自然，并保留建筑路径的含义。
- source_word: יָב֔וֹא
  choice: 要……进入
  rationale: 未完成式在本段礼仪规程中带有程序性指示语气；“要”能表达规定，而不把它弱化为单纯将来时。
- source_word: וּ/בְ/דַרְכּ֖/וֹ
  choice: 也要从原路
  rationale: 字面为“并从他的路”。上下文所指是他进入时所走的路线；“原路”以自然汉语表达这种往返路径的一致性。
- source_word: יֵצֵֽא
  choice: 出去
  rationale: יצא 的基本含义是“出去”；此处与“进入”形成清楚对应。
theological_decisions:
- issue: 以西结圣殿异象中 הַנָּשִׂיא 的身份
  choice: 译作“君王”，不进一步说明其身份
  alternative: 领袖；统治者；弥赛亚君王
  rationale: 本节只规定此人物进出圣殿区域的路线，并未要求判断他是否为弥赛亚或国王；译文不引入本节未明说的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式简洁，突出礼仪规程中的进入路线与出去路线相同。正文没有脚注标记，因此不附脚注。
