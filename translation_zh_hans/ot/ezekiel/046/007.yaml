  text: וְ/אֵיפָ֨ה לַ/פָּ֜ר וְ/אֵיפָ֤ה לָ/אַ֨יִל֙ יַעֲשֶׂ֣ה מִנְחָ֔ה וְ/לַ֨/כְּבָשִׂ֔ים כַּ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/007.yaml
  text: And he shall provide as a grain offering an ephah for the bull and an ephah for the ram[a], and for the lambs whatever his hand can afford, and a hin of oil with each ephah.
translation:
  language: zh_hans
  text: 他要献上素祭：为公牛献一伊法，为公绵羊献一伊法；为羊羔，则按他的能力所及献上[a]；每一伊法要配一欣油。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“按他的手所能达到的”，意思是按他的财力或能力所能供给的。
    reason: 说明希伯来语习语，并保留正文未直接呈现的“手”这一具体意象。
lexical_decisions:
- source_word: אֵיפָה
  choice: 伊法
  rationale: 保留古代希伯来干量单位的名称，不换算成近似的现代容量，以保存祭祀条例的具体度量表达。
- source_word: פַּר
  choice: 公牛
  rationale: 按祭牲语境译为“公牛”；介词所带冠词表明这是本条例所说的那头公牛。
- source_word: אַיִל
  choice: 公绵羊
  rationale: 译出作为祭牲的成年雄性绵羊，并保留原文的确定指称。
- source_word: יַעֲשֶׂה מִנְחָה
  choice: 献上素祭
  rationale: מִנְחָה在此祭祀语境中指以谷物为主的供物，汉语传统且清楚的对应为“素祭”；יַעֲשֶׂה在此按献祭行为自然译为“献上”。
- source_word: כְּבָשִׂים
  choice: 羊羔
  rationale: 采用自然的集合性表达“羊羔”，不额外加入原文此处未明说的性别限定。
- source_word: כַּאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: 按他的能力所及
  rationale: 原文直译为“按他的手所能达到的”，是指其财力或能力所能供给的数量；正文采用自然现代汉语，脚注保留具体的“手”这一意象。
- source_word: שֶׁמֶן הִין לָאֵיפָה
  choice: 每一伊法要配一欣油
  rationale: 表达油与素祭面粉的比例关系；“每一伊法”体现分配含义，并保留古代液量单位“欣”。
theological_decisions: []
