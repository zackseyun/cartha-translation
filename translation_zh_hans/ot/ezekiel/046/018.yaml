source:
  edition: WLC
  text: וְ/לֹא יִקַּ֨ח הַ/נָּשִׂ֜יא מִ/נַּחֲלַ֣ת הָ/עָ֗ם לְ/הֽוֹנֹתָ/ם֙ מֵ/אֲחֻזָּתָ֔/ם מֵ/אֲחֻזָּת֖/וֹ יַנְחִ֣ל אֶת בָּנָ֑י/ו לְמַ֨עַן֙ אֲשֶׁ֣ר לֹֽא יָפֻ֣צוּ עַמִּ֔/י אִ֖ישׁ מֵ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/018.yaml
  text: The prince shall not take any of the people's inheritance[a], thrusting them out of their property. He shall give his sons an inheritance out of his own property, so that my people may not be scattered[b], each man from his property.
translation:
  language: zh_hans
  text: 首领不可夺取百姓的产业，欺压他们，使他们失去自己的地业。[a] 他要从自己的地业中分产业给儿子，免得我的百姓四散，各人离开自己的地业。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欺压他们，使他们失去自己的地业”也可译作“亏负他们，夺走他们的地业”或“诈取他们的地业”。
    reason: 希伯来语 ינה 的使役形可表示欺压、亏负或剥削；它与“地业”的介词结构如何衔接，存在翻译上的表达差异。
  - marker: b
    text: 原文为“各人”，是分配性的说法，指百姓中的每一个人。
    reason: 说明希伯来语单数 אִישׁ 在此处的分配性功能。
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: 首领
  rationale: 在《以西结书》的这一异象中，该词是对民政领袖的特定称呼，不等同于“王”；“首领”自然且保留这种区别。
- source_word: יִקַּח מִנַּחֲלַת הָעָם
  choice: 夺取百姓的产业
  rationale: לקח 与 מן 表示从百姓所有之物中取走；结合土地权属语境，“夺取”体现这种行为的强制性，“产业”也保留 נַחֲלָה 的承继含义。
- source_word: לְהוֹנֹתָם מֵאֲחֻזָּתָם
  choice: 欺压他们，使他们失去自己的地业
  rationale: ינה 的使役形表示欺压、亏负或剥削；与后面的土地用语合起来，指借欺压使百姓丧失其土地。“欺压”保留较宽的词义，“使他们失去”则使希伯来语介词结构在中文中清楚自然。
- source_word: מֵאֲחֻזָּתוֹ יַנְחִל אֶת־בָּנָיו
  choice: 他要从自己的地业中分产业给儿子
  rationale: נחל 的使役形意为使人承受产业或把产业分给人；译文清楚呈现首领自己的地业与百姓地业之间的对比。
- source_word: לֹא יָפֻצוּ
  choice: 免得……四散
  rationale: פוץ 的基本意象是分散、四散；此处虽暗含被迫离开土地，译文仍保留原文的形象，不把原因说得过满。
- source_word: עַמִּי אִישׁ מֵאֲחֻזָּתוֹ
  choice: 我的百姓四散，各人离开自己的地业
  rationale: איש 在这里作分配性用法，指百姓中的每一个人；“各人”准确而自然。אֲחֻזָּה 译为“地业”，突出可持有并承继的土地。
theological_decisions:
- issue: 分配性单数 אִישׁ 是否必须明确译为男性
  choice: 各人
  alternative: 各个男子
  rationale: אִישׁ 此处紧接“我的百姓”，作分配性表达，重点是百姓中每一个人，而非限定男性。现代汉语“各人”忠实表达该语法功能；译成“各个男子”反会添加原文在此语境中没有强调的性别限制。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“首领”避免误译为君王；“产业／地业”分别呈现承继份额与土地持有的语境。句式保留原文的禁令、正面规定及目的从句，并避免把欺压、夺地与四散之间的关系解释得超过原文。
