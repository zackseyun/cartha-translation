  text: וּ/בַ/חַגִּ֣ים וּ/בַ/מּוֹעֲדִ֗ים תִּהְיֶ֤ה הַ/מִּנְחָה֙ אֵיפָ֤ה לַ/פָּר֙ וְ/אֵיפָ֣ה לָ/אַ֔יִל וְ/לַ/כְּבָשִׂ֖ים מַתַּ֣ת יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/011.yaml
  text: At the festivals and the appointed times[a], the grain offering shall be one ephah for the bull and one ephah for the ram, and for the lambs as much as he is able to give, with a hin of oil to each ephah.
translation:
  language: zh_hans
  text: 在各节期和指定的日子，素祭的分量是：每头公牛一伊法，每只公绵羊一伊法；羊羔则按他所能献的[a]；每一伊法要配一欣油。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“他手的赠物”，意思是按他的能力或财力所能献上的。
    reason: 说明希伯来语惯用语的字面形式及实际含义。
lexical_decisions:
- source_word: וּבַחַגִּים וּבַמּוֹעֲדִים
  choice: 在各节期和指定的日子
  rationale: 分别保留 חַגִּים 的节庆含义和 מוֹעֲדִים 的指定时间含义，避免把两个词合并为同一概念；“指定的日子”符合现代汉语宗教历法语境。
- source_word: תִּהְיֶה הַמִּנְחָה
  choice: 素祭的分量是
  rationale: 祭祀语境中的 מִנְחָה 指素祭；补出“分量”可自然引出后文所规定的量，同时不增加实质内容。
- source_word: אֵיפָה לַפָּר
  choice: 每头公牛一伊法
  rationale: אֵיפָה 是干量单位，采用通行音译“伊法”；单数祭牲在法规句式中具有分配意义，译为“每头”使汉语清楚自然。
- source_word: וְאֵיפָה לָאַיִל
  choice: 每只公绵羊一伊法
  rationale: אַיִל 在此指献祭用的成年公绵羊；保持与公牛条款平行的计量结构。
- source_word: וְלַכְּבָשִׂים מַתַּת יָדוֹ
  choice: 羊羔则按他所能献的
  rationale: מַתַּת יָדוֹ 直译为“他手的赠物”，在此是按献祭者能力或财力而献的惯用表达；正文传达其语用意义，脚注保留字面形象。
- source_word: וְשֶׁמֶן הִין לָאֵיפָה
  choice: 每一伊法要配一欣油
  rationale: הִין 是液量单位，采用通行音译“欣”；לָאֵיפָה 表明每伊法素祭所配油的比例，译文明确其分配关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法规式表达；保留“伊法”“欣”这两个古代度量单位，并以量词和分号清楚呈现各项祭物的配比。脚注标记置于其实际所解释的“按他所能献的”之后。
