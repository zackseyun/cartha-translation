  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֶ֣ה הַ/מָּק֗וֹם אֲשֶׁ֤ר יְבַשְּׁלוּ שָׁם֙ הַ/כֹּ֣הֲנִ֔ים אֶת הָ/אָשָׁ֖ם וְ/אֶת הַ/חַטָּ֑את אֲשֶׁ֤ר יֹאפוּ֙ אֶת הַ/מִּנְחָ֔ה לְ/בִלְתִּ֥י הוֹצִ֛יא אֶל הֶ/חָצֵ֥ר הַ/חִֽיצוֹנָ֖ה לְ/קַדֵּ֥שׁ אֶת הָ/עָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/020.yaml
  text: Then he said to me[a], “This is the place where the priests shall boil the guilt offering and the sin offering, and where they shall bake the grain offering, so as not to bring them out into the outer court to make the people holy.”
translation:
  language: zh_hans
  text: 他对我说：“这里是祭司煮赎愆祭和赎罪祭，并烤素祭的地方；以免祭司把这些祭物带到外院，使百姓成为圣洁[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使百姓分别为圣”。希伯来语动词的意思是“使成为圣洁”；在这里，可能是指百姓接触神圣的祭物而承受圣洁。
    reason: 说明“使成为圣洁”的另一种自然汉语译法，并谨慎保留本节在礼仪语境中可能涉及接触圣物而传递圣洁的含义。
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 叙事中的连续式推进场景；现代汉语无需另加“然后”，即可自然表达顺承。
- source_word: זֶה הַמָּקוֹם
  choice: 这里是……的地方
  rationale: 既保留指示语气，也符合现代汉语介绍地点功能时的自然句式。
- source_word: יְבַשְּׁלוּ
  choice: 煮
  rationale: בשל在献祭语境中通常指以水煮熟，比宽泛的“烹调”更具体。
- source_word: הָאָשָׁם
  choice: 赎愆祭
  rationale: 这是该祭类在中文圣经传统中清楚而通行的名称，也保留其与罪责、补偿有关的含义。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 采用该献祭类别的通行名称；虽有学者强调其洁净功能，本节主要是在列举祭类，不宜在正文中改作解释性译名。
- source_word: יֹאפוּ אֶת הַמִּנְחָה
  choice: 烤素祭祭物
  rationale: אפה是“烤”，מִנְחָה在祭司礼仪语境中指素祭；加“祭物”使其作为“烤”的宾语在汉语中更自然。
- source_word: לְבִלְתִּי הוֹצִיא
  choice: 免得把这些祭物带到
  rationale: 表达לְבִלְתִּי加不定式所含的防止、避免之意；“这些祭物”补明希伯来文省略但语境清楚的宾语。
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: 外院
  rationale: 采用以西结圣殿异象中相应建筑区域的简洁通行译法。
- source_word: לְקַדֵּשׁ אֶת הָעָם
  choice: 使百姓成为圣洁
  rationale: 直译קדש使役形“使成为圣洁”，不在正文中把它限定为某一种礼仪机制；脚注说明此处可能涉及因接触圣物而承受圣洁。
theological_decisions:
- issue: לְקַדֵּשׁ אֶת הָעָם所表达的圣洁及其传递方式
  choice: 正文译作“使百姓成为圣洁”，保留使役意义及礼仪上的张力。
  alternative: 译作“使百姓分别为圣”，或明确解释为百姓因接触圣物而承受圣洁。
  rationale: 指定烹煮场所的上下文很可能是在防止至圣祭物被带入外院，致使百姓因接触而进入圣洁状态；但希伯来文本身只明说“使百姓成为圣洁”，故正文不把这种机制写死，改由脚注交代。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。祭礼术语沿用读者较熟悉的“赎愆祭、赎罪祭、素祭”，句法则按现代汉语调整；脚注标记紧接其所解释的“成为圣洁”。
