revisions:
- from: 主雅威如此说：“首领若把一份礼物赐给他的一个儿子[a]，这礼物就是他的产业；以后要归他的众子所有，成为他们承继的产业[b]。”
  to: 主雅威如此说：“首领若把礼物赐给他儿子中的一个[a]，这礼物就成为他的产业；这产业要归他的儿子们所有，作为他们承继的产业[b]。”
  rationale: 修订脚注[b]以删除原文没有的“所有／全部”含义，并使替代译法自然准确。正文作两处轻微措辞调整：“他的儿子们”较自然；删除“以后”以免将原文的后续法律归属具体化为特定时间进程。其余保留原译的神名、法律语体与谨慎的代词指代。
