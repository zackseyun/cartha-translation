source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה כִּֽי יִתֵּ֨ן הַ/נָּשִׂ֤יא מַתָּנָה֙ לְ/אִ֣ישׁ מִ/בָּנָ֔י/ו נַחֲלָת֥/וֹ הִ֖יא לְ/בָנָ֣י/ו תִּֽהְיֶ֑ה אֲחֻזָּתָ֥/ם הִ֖יא בְּ/נַחֲלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/016.yaml
  text: 'Thus says the Lord GOD: If the prince gives a gift to any one of his sons[a], it is his inheritance[b]; it shall belong to his sons as their property by inheritance.'
translation:
  language: zh_hans
  text: 主雅威如此说：“首领若把礼物赐给他儿子中的一个[a]，这礼物就成为他的产业；这产业要归他的儿子们所有，作为他们承继的产业[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“给他众子中的一个人”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“成为他们凭继承持有的产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中常见的使者公式，在现代汉语中庄重而自然。
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: אֲדֹנָי译作“主”，יהוה按其专名形式译作“雅威”，既保留复合称号，也避免译成重复的“主”。
- source_word: כִּי
  choice: 若
  rationale: 本节属于法规式个案说明，כִּי在此引出条件，而非表示原因。
- source_word: הַנָּשִׂיא
  choice: 首领
  rationale: נָשִׂיא在以西结的圣殿法规中是民政领袖的专称；“首领”比现代汉语中的“王子”更准确，也保留其领袖身份。
- source_word: מַתָּנָה
  choice: 一份礼物
  rationale: 该词指所赠之物；量词“一份”符合产业赠与的语境。
- source_word: לְאִישׁ מִבָּנָיו
  choice: 给他的一个儿子
  rationale: 字面为“给他众子中的一人”，其中אִישׁ用于指众人中的一个个体；正文采用自然的现代汉语表达。
- source_word: נַחֲלָתוֹ הִיא
  choice: 这礼物就是他的产业
  rationale: נַחֲלָה指可世代承继的产业；补出“这礼物”使汉语指代清楚，同时保留“他的”在语法上的指代形式。
- source_word: לְבָנָיו תִּהְיֶה
  choice: 以后要归他的众子所有
  rationale: 表达该产业将继续归受赠者的后代；“以后”自然体现未完成式所指向的后续归属。
- source_word: אֲחֻזָּתָם הִיא בְּנַחֲלָה
  choice: 成为他们承继的产业
  rationale: אֲחֻזָּה指实际持有的地产或产业，בְּנַחֲלָה说明其世袭承继的性质；合译可避免汉语中“产业、所有物、继承”机械堆叠。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主雅威
  alternative: 主耶和华；主上帝
  rationale: 采用神名的专名音译“雅威”，不把יהוה改写为普通称谓；同时以“主”对应אֲדֹנָי。
- issue: 三个第三人称所有格的指代
  choice: 正文保留“他的／他的／他们”的原文指代形式
  alternative: 明确译为“受赠儿子的产业；归这儿子的众子所有”
  rationale: 上下文最自然地指向受赠的儿子及其众子，但希伯来语所有格本身没有明说先行词；正文不以解释性增译消除这种形式上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“首领”避免“王子”在现代汉语中容易产生的血缘误解；分号体现赠与成为个人产业并继续传给其后代这两个相连层次。
