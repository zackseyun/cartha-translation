source:
  edition: WLC
  text: וּ/בְ/ב֨וֹא עַם הָ/אָ֜רֶץ לִ/פְנֵ֣י יְהוָה֮ בַּ/מּֽוֹעֲדִים֒ הַ/בָּ֡א דֶּרֶךְ שַׁ֨עַר צָפ֜וֹן לְ/הִֽשְׁתַּחֲוֺ֗ת יֵצֵא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב וְ/הַ/בָּא֙ דֶּרֶךְ שַׁ֣עַר נֶ֔גֶב יֵצֵ֖א דֶּרֶךְ שַׁ֣עַר צָפ֑וֹנָ/ה לֹ֣א יָשׁ֗וּב דֶּ֤רֶךְ הַ/שַּׁ֨עַר֙ אֲשֶׁר בָּ֣א ב֔/וֹ כִּ֥י נִכְח֖/וֹ יצאו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/009.yaml
  text: And when the people of the land come before Yahweh at the appointed times[a], whoever enters by way of the north gate to worship shall go out by way of the south gate, and whoever enters by way of the south gate shall go out by way of the north gate. He shall not return by way of the gate through which he entered[c][b], but shall go out straight ahead.
translation:
  language: zh_hans
  text: 那地的百姓在节期[a]来到耶和华面前时，凡从北门进来敬拜[b]的，要从南门出去；凡从南门进来的，要从北门出去。不可从自己进来的那道门返回，却要直向前出去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “节期”也可译作“指定的日期”或“节庆”。
    reason: lexical_alternative
  - marker: b
    text: “敬拜”原文直译为“俯伏下拜”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译：“因为他们要朝着正对面出去。”末句由前面的单数转为复数；意思是不可从原门折返，而要继续向前，从相对的一边出去。
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: 地上的百姓
  rationale: 保留以西结书圣殿规章中的群体称谓，并与君王和祭司相区别；不将其解释性地缩窄为“平民”。
- source_word: לִפְנֵי יְהוָה
  choice: 来到耶和华面前
  rationale: “面前”保留到上帝临在之处朝见的礼仪含义；יהוה按其专名译作“耶和华”。
- source_word: בַּמּוֹעֲדִים
  choice: 在节期
  rationale: 在圣殿礼仪语境中，מוֹעֵד指规定的节庆时日；“节期”自然简洁，同时以脚注保留“指定的日期”等较宽词义。
- source_word: הַבָּא ... לְהִשְׁתַּחֲוֺת
  choice: 进来敬拜的
  rationale: 分词表达一般性规定；השתחוה本指俯伏、下拜，在此礼仪语境中以“敬拜”表达其功能，并用脚注说明动作本义。
- source_word: דֶּרֶךְ שַׁעַר צָפוֹן / דֶּרֶךְ שַׁעַר נֶגֶב
  choice: 从北门／从南门
  rationale: 现代汉语以“从……门”自然表达经由某门进出，并保留方向对照。
- source_word: יֵצֵא
  choice: 要……出去
  rationale: 未完成式在规章中具有指令性；“要”清楚表达规定而不过度强化为命令语气。
- source_word: לֹא יָשׁוּב
  choice: 不可……返回
  rationale: 准确表达禁止沿原路折返的规定。
- source_word: אֲשֶׁר בָּא בוֹ
  choice: 进来的那道门
  rationale: 以自然汉语表达“他从其中进来的门”，所指明确。
- source_word: כִּי נִכְחוֹ יֵצֵאוּ
  choice: 而要从对面的门出去
  rationale: נִכְחוֹ可指在其正前方或相对之处；结合南北门对向通行的上下文，译出从对面出口离开的实际含义，同时脚注保留原文较直译的表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且明确作为专名的“耶和华”，不以“主”替代，从而保留圣约之名；“雅威”是较贴近学界重构发音的另一译法。
- issue: השתחוה 是身体动作还是概括性的敬拜
  choice: 正文译“敬拜”，脚注注明“俯伏下拜”
  alternative: 正文直译“俯伏下拜”
  rationale: 圣殿语境表明该动作具有敬拜功能，但原词具体的身体姿态不应丢失，因此正文求自然，脚注保存字面层次。
- issue: 末句单复数变化
  choice: 按一般性规章译作省略主语的“要……出去”
  alternative: 按复数直译“他们要出去”
  rationale: 前文用单数分词描述两类一般个体，末句却用复数 יֵצֵאוּ。汉语省略主语既顺畅，也避免武断判定该复数是集合性转换、笼统指众人，还是文本层面的不一致。
translation_notes:
  register: 采用现代、庄重而易懂的规章语体。以“要／不可”呈现礼仪规定；避免生硬重复“经由……门”。正文保留“地上的百姓”这一以西结书特有称谓，并用脚注呈现节期、俯伏动作及末句方向和数变化的原文张力。
