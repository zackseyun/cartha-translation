base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/005.yaml
  text: And the grain offering shall be an ephah with the ram[a], and with the lambs a grain offering as much as his hand can give[b], and a hin of oil with each ephah.
translation:
  language: zh_hans
  text: 素祭：为公绵羊要献一伊法[a]；羊羔的素祭，则按他所能献的献上[b]。每一伊法配一欣的油。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与公绵羊一同献”；这里的希伯来介词在献祭规定中可表示关联或配属。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“他手的馈赠”，是指按他所能献的。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在献祭条例中通常专指以谷物为主的祭物；“素祭”是现代中文圣经语境中清楚而简洁的对应词。
- source_word: אֵיפָה
  choice: 伊法
  rationale: 希伯来干量单位，采用音译，以保留原文献祭规定的计量方式。
- source_word: לָאַיִל
  choice: 献公绵羊时
  rationale: 介词 ל 将规定的一伊法素祭与公绵羊相联系；此译自然表达伴随或配属关系，同时以脚注保留“为公绵羊”的可能。
- source_word: לַכְּבָשִׂים
  choice: 献羊羔时
  rationale: 介词 ל 表明素祭与羊羔相关联；后文规定数量按献祭者能力而定，因此不暗示固定份量。
- source_word: מַתַּת יָדוֹ
  choice: 照他手所能献的
  rationale: 原文直译为“他手的馈赠”，是表示个人能力或财力的习语；译文既保留“手”的具体意象，也传达按能力献上的含义。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 献祭语境中的标准对应词；原文未进一步注明油的种类。
- source_word: הִין
  choice: 欣
  rationale: 希伯来液量单位，采用音译，保留原文技术性计量名称。
- source_word: לָאֵיפָה
  choice: 每一伊法要配
  rationale: 这里说明油与素祭干量的比例；“每一伊法要配”自然表达分配比例。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“公绵羊”用于区别后面的“羊羔”；计量单位“伊法”“欣”沿用音译，不作现代容量换算。句式略作拆分，以清楚呈现公绵羊所配的固定份量、羊羔所配的弹性份量，以及油与每伊法的比例。
