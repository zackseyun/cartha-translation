  text: A row ran around within them[a], around all four of them, and hearths had been made beneath the rows all around.
translation:
  language: zh_hans
  text: 四个院子里面，都有一圈构造[a]环绕；在这些构造下面，四周设有烹煮处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “构造”（下文同）所译的希伯来语建筑术语含义不确定；也可理解为“排”“围隔”“凸缘”或“墙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוּר
  choice: 一排建筑
  rationale: 该词指环绕院子的成排或成层构造；译作“一排建筑”既保留“排”的基本意义，也使现代汉语读者明白这是建筑构件，而非普通队列。
- source_word: סָבִיב ... סָבִיב
  choice: 环绕一周……四周
  rationale: 保留原文反复出现的环绕表达，突出四面围绕的空间布局，同时避免汉语过于生硬。
- source_word: בָּהֶם
  choice: 四个院子里面
  rationale: 代词承接上一节的四个小院；在本节独立呈现时补出“院子”，使所指清楚。
- source_word: לְאַרְבַּעְתָּם
  choice: 各
  rationale: 表达这一构造存在于四个院子中的每一个，体现希伯来语所强调的四者皆然。
- source_word: מְבַשְּׁלוֹת
  choice: 灶台
  rationale: 该词源于“煮、烹调”，在圣殿厨房的建筑语境中指烹煮设施；“灶台”比抽象的“烹煮处”自然明确，又不限定具体燃料或形制。
- source_word: עָשׂוּי
  choice: 建有
  rationale: 以自然汉语表达被动分词所表示的已经建成并存在的状态。
- source_word: מִתַּחַת
  choice: 下面
  rationale: 直接表达垂直空间关系，符合现代汉语建筑描述。
- source_word: הַטִּירוֹת
  choice: 这些排状建筑
  rationale: 该词确切的建筑含义不明，可能指围墙、围隔或凸缘；正文采用能与前面的טוּר形成词义联系、又不过度具体化的表达，并以脚注保留其他可能。
