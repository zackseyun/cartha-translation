  text: All the people of the land shall give this contribution to the prince in Israel[a][b].
translation:
  language: zh_hans
  text: 这地所有的百姓都要为以色列的首领交纳这份奉献[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “都要为……交纳”较直译为“都要归于这项奉献”；这里的特殊说法大概是指，全体百姓都应交纳这项规定的份额。
    reason: lexical_alternative
  - marker: b
    text: “奉献”所译的希伯来语指分别出来交纳的一份，也可译作“供物”或“贡物”。原文“以色列的首领”较直译为“在以色列中的首领”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעָם הָאָרֶץ
  choice: 这地所有的百姓
  rationale: 保留“这地的百姓”这一先知和律法语境中的群体称谓，同时用现代汉语自然表达其全体性。
- source_word: יִהְיוּ אֶל
  choice: 都要把……交给
  rationale: 原文直译近于“都要归向/用于”，在本段规定奉献份额的语境中，表达百姓应把指定份额交付给领袖；意译出隐含动作，并以脚注保留原文形式。
- source_word: הַתְּרוּמָה הַזֹּאת
  choice: 这份奉献
  rationale: תְּרוּמָה 指分别出来交纳的份额，可兼具礼仪和公共义务色彩；“奉献”在中文中自然，并与上下文的敬拜用途相合，同时不把含义限定为祭物。
- source_word: לַנָּשִׂיא
  choice: 交给……领袖
  rationale: נָשִׂיא 在《以西结书》中指承担治理职责的人，并不等同于“王”；“领袖”比现代汉语中的“王子”或“亲王”更准确。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列的领袖
  rationale: 原文形式为“在以色列中的领袖”。正文采用自然汉语所属结构，脚注说明较直译的表达，以保留介词可能强调其领域或所在范围的细微差别。
theological_decisions:
- issue: 奉献是给领袖本人，还是供其履行公共和礼仪职责使用
  choice: 正文译作“交给……领袖”，不进一步说明用途
  alternative: 为领袖交纳，供他履行献祭职责
  rationale: 本节只表明奉献与领袖的关系；其具体职责由下一节交代。译文不把上下文信息提前写入本节，以免消除原文的简洁和张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“百姓”保留经文的群体和律法语域；“领袖”避免把 נָשִׂיא 误解为君主之子。正文力求顺畅，脚注则保留 יִהְיוּ אֶל 的特殊句法及 תְּרוּמָה 的礼仪—公共双重色彩。
