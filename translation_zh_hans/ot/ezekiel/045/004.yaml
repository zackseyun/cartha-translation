source:
  edition: WLC
  text: קֹ֣דֶשׁ מִן הָ/אָ֜רֶץ ה֗וּא לַ/כֹּ֨הֲנִ֜ים מְשָׁרְתֵ֤י הַ/מִּקְדָּשׁ֙ יִֽהְיֶ֔ה הַ/קְּרֵבִ֖ים לְ/שָׁרֵ֣ת אֶת יְהוָ֑ה וְ/הָיָ֨ה לָ/הֶ֤ם מָקוֹם֙ לְ/בָ֣תִּ֔ים וּ/מִקְדָּ֖שׁ לַ/מִּקְדָּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/004.yaml
  text: It is a holy portion of the land; it shall be for the priests[a], the ministers of the sanctuary, who draw near to minister to Yahweh. And it shall be for them as a place for houses and as a holy place for the sanctuary.
translation:
  language: zh_hans
  text: 这是从这地划出的圣地，要归给在圣所供职、亲近雅威并事奉他的祭司。这地要作为他们的房屋用地，也作为圣所的圣地[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也作为圣所的圣处。”希伯来语此处将两个同根词紧凑相连，关系不完全确定；可指为圣所预留或属于圣所的一片分别为圣之地。
    reason: 原文 וּמִקְדָּשׁ לַמִּקְדָּשׁ 的首词可指圣处或分别为圣之地，后一词指圣所；脚注保留其关系的歧义，避免具体化。
lexical_decisions:
- source_word: קֹדֶשׁ מִן־הָאָרֶץ
  choice: 这片地是圣地
  rationale: קֹדֶשׁ 在土地划分的语境中指从全地划出、分别为圣的区域，并非抽象的“圣洁”。译文以“这片地”承接上下文所量定的地块。
- source_word: לַכֹּהֲנִים מְשָׁרְתֵי הַמִּקְדָּשׁ
  choice: 归给在圣所供职的祭司
  rationale: לַכֹּהֲנִים 表示分配或归属；מְשָׁרְתֵי 表示履行礼仪职务的人。“供职”既自然，又保留祭司在圣所正式事奉的含义。
- source_word: הַקְּרֵבִים לְשָׁרֵת אֶת־יְהוָה
  choice: 那些亲近雅威、事奉他的祭司
  rationale: “亲近”保留 הַקְּרֵבִים 在祭司礼仪语境中的专门意味；“事奉”表达 לְשָׁרֵת 的正式宗教服事含义。补出“他的祭司”使中文指代清楚，但不增加新的身份信息。
- source_word: מָקוֹם לְבָתִּים
  choice: 他们建造房屋的地方
  rationale: 直译为“房屋的地方”在现代汉语中生硬；“建造房屋的地方”自然表达这一区域供祭司居住建房之用。
- source_word: וּמִקְדָּשׁ לַמִּקְדָּשׁ
  choice: 也要作圣所的圣地
  rationale: 原文简短且两个同根词相连，含义有一定歧义。此译保留“圣所”并将前一个 מִקְדָּשׁ 理解为分别为圣的区域，避免擅自具体化为某种建筑或空地。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式保留其作为盟约之名的性质，不以称号代替。
- issue: 祭司“亲近”雅威的礼仪含义
  choice: 保留“亲近”
  alternative: 来到近前；接近
  rationale: “亲近”既忠实于 הַקְּרֵבִים，又保留以西结书中祭司获准近前事奉的礼仪张力，不将其弱化为一般空间移动。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“供职”“亲近”“事奉”保留祭司礼仪语域；句法适度展开，以避免希伯来语名词串在中文中显得晦涩。脚注标记置于相关歧义短语之后。
