  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה רַב לָ/כֶם֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל חָמָ֤ס וָ/שֹׁד֙ הָסִ֔ירוּ וּ/מִשְׁפָּ֥ט וּ/צְדָקָ֖ה עֲשׂ֑וּ הָרִ֤ימוּ גְרֻשֹֽׁתֵי/כֶם֙ מֵ/עַ֣ל עַמִּ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/009.yaml
  text: 'Thus says the Lord GOD: Enough from you[a], princes of Israel! Remove violence and plunder, and do justice and righteousness. Put away your evictions from my people, declares the Lord GOD.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“以色列的首领啊，你们够了！要除掉暴行和掠夺，实行公正和公义；要停止驱逐我的百姓[a]。这是主耶和华的宣告。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要除去你们加在我百姓身上的驱逐。”原文指赶出、驱逐的行为；在本章土地分配的语境中，也可包括强迫人离开土地或剥夺其产业。
    reason: 保留 גְרֻשֹׁתֵיכֶם 的较宽语义范围，避免正文加入“家园”这一原文未明说的限定，同时说明相关上下文。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 以现代中文圣经语体呈现复合神圣称谓；“主”对应 אֲדֹנָי，“耶和华”标示专名 יְהוִה，并避免不自然的“主主”。
- source_word: רַב לָכֶם
  choice: 你们够了
  rationale: 保留 לָכֶם 所指向的责斥对象和“到此为止”的强烈语气，比单说“够了”更充分。
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: 以色列的首领
  rationale: 此处指掌权阶层；“首领”既保留政治身份，也比现代汉语中的“王子”更准确。
- source_word: חָמָס וָשֹׁד
  choice: 暴行和掠夺
  rationale: 分别呈现暴力压迫与抢夺财物的含义，不将两者合并为笼统的“不义”。
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: 公平和公义
  rationale: 保留希伯来文伦理词组中两个彼此相关而有区别的概念；前者侧重公正治理，后者侧重合乎正义的行为。
- source_word: גְרֻשֹׁתֵיכֶם
  choice: 把……赶离家园
  rationale: 该词源于“赶出、驱逐”，本章土地分配的语境使被迫离开土地或产业的含义较突出；采用动词短语比生硬的名词“驱逐行为”自然。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: 清楚保留先知宣告公式及其神圣权威，语言庄重而通顺。
theological_decisions:
- issue: 复合称谓 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文采用中文读者熟悉且庄重的圣经称谓，同时分别体现“主”和神的专名；另一种音译可行，但不必在本节正文中更换传统中文形式。
- issue: מִשְׁפָּט וּצְדָקָה 的区分
  choice: 公平和公义
  alternative: 正义和公正
  rationale: 保留原文并列的伦理张力，不把两词归并为一个概念；“施行”也符合治理者受命实践正义的语境。
- issue: גְרֻשֹׁתֵיכֶם 的具体范围
  choice: 正文按土地语境译作“赶离家园”，脚注保留较广义的驱逐与剥夺产业
  alternative: 驱逐
  rationale: 上下文涉及土地与掌权者的侵夺，具体译法能传达实际危害；但原词本身不限于现代法律意义的逐户，因此用脚注保存语义宽度。
translation_notes:
  register: 采用现代、庄重而直接的先知责斥语体。“你们够了”保留当面对统治者的尖锐谴责；“不要再”自然表达停止持续恶行的命令。
