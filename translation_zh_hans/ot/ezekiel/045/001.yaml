  text: וּ/בְ/הַפִּֽילְ/כֶ֨ם אֶת הָ/אָ֜רֶץ בְּ/נַחֲלָ֗ה תָּרִימוּ֩ תְרוּמָ֨ה לַ/יהוָ֥ה קֹדֶשׁ֮ מִן הָ/אָרֶץ֒ אֹ֗רֶךְ חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ אֹ֔רֶךְ וְ/רֹ֖חַב עֲשָׂ֣רָה אָ֑לֶף קֹדֶשׁ ה֥וּא בְ/כָל גְּבוּלָ֖/הּ סָבִֽיב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/001.yaml
  text: 'And when you divide the land as an inheritance[a], you shall set apart a contribution to Yahweh, a holy portion from the land: twenty-five thousand cubits in length and ten thousand in width[b]. It shall be holy within all its surrounding boundary.'
translation:
  language: zh_hans
  text: 你们分配这地作产业时[a]，要从地中划出一份献给雅威，作为圣地：长二万五千肘，宽一万肘[b]。这块地在四围边界以内都要为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们拈阄分配这地作产业时。”
    reason: 希伯来语在分地语境中可含借拈阄使各份土地落定之意。
  - marker: b
    text: 原文直译为“长二万五千，宽一万”，没有明说计量单位；按本异象的丈量语境补出“肘”。
    reason: 说明正文为清楚起见补出的古代长度单位。
lexical_decisions:
- source_word: וּבְהַפִּילְכֶם
  choice: 你们分配……时
  rationale: 该词是 נפל 的使役式，在分地语境中指使地块“落定”，即分配土地；正文采用自然的现代汉语“分配”，并在脚注保留“拈阄分配”的可能含义。
- source_word: בְּנַחֲלָה
  choice: 作产业
  rationale: נַחֲלָה 指承受而得的地业或产业；“作产业”既简洁，也保留土地承受关系，而不把含义局限为现代法律意义上的遗产。
- source_word: תָּרִימוּ תְרוּמָה
  choice: 划出一份献给
  rationale: רום 与 תְּרוּמָה 构成的表达在此指从土地中划出并奉献一份；译为“划出一份献给”比祭物语境中的“举祭”更符合本节的土地分配背景。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词表示这一地块是奉献给 יהוה 的；神名按其专名译作“雅威”。
- source_word: קֹדֶשׁ מִן הָאָרֶץ
  choice: 从地中……作为圣地
  rationale: קֹדֶשׁ 在这里实体化地指分别为圣的土地部分；因下文给出长宽，译作“圣地”自然明确。
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ וְרֹחַב עֲשָׂרָה אָלֶף
  choice: 长二万五千肘，宽一万肘
  rationale: 原文未明说计量单位，正文依异象中的丈量语境补出“肘”，并以脚注说明；希伯来文重复“长”，汉语中无需机械重复。
- source_word: קֹדֶשׁ הוּא בְכָל־גְּבוּלָהּ סָבִיב
  choice: 四围界内全都为圣
  rationale: 译文保留整片区域在其四周边界以内皆为圣的完整范围，并符合汉语表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地音译其通行学术重构读音，也与所提供审定层采用 Yahweh 一致。
- issue: 土地作为 קֹדֶשׁ 的性质
  choice: 圣地
  alternative: 圣洁的一份
  rationale: 上下文的尺寸表明所指是一片分别出来的土地；“圣地”表达其奉献归属，但不进一步解释其礼仪或制度性质。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“划出一份献给”兼顾土地划拨与奉献含义；“四围界内全都为圣”保持法律指令式语气及范围的完整性。
