id: EZK.45.23
reference: Ezekiel 45:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שִׁבְעַ֨ת יְמֵֽי הֶ/חָ֜ג יַעֲשֶׂ֧ה עוֹלָ֣ה לַֽ/יהוָ֗ה שִׁבְעַ֣ת פָּ֠רִים וְ/שִׁבְעַ֨ת אֵילִ֤ים תְּמִימִם֙ לַ/יּ֔וֹם שִׁבְעַ֖ת הַ/יָּמִ֑ים וְ/חַטָּ֕את שְׂעִ֥יר עִזִּ֖ים לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/023.yaml
  text: During the seven days of the feast he shall provide as a burnt offering to Yahweh seven bulls and seven rams without blemish each day for the seven days[b][a], and as a sin offering one male goat each day.
translation:
  language: zh_hans
  text: 在节期[a]的七天中，他要为雅威备办燔祭：七天之中，每天献上七头无残疾的公牛和七只无残疾的公绵羊；又要每天献一只公山羊作赎罪祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “节期”也可译作“节庆”。
    reason: lexical_alternative
  - marker: b
    text: “赎罪祭”也可译作“洁净祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָג
  choice: 节期
  rationale: חַג指宗教性的节庆或朝圣节期；“节期”符合本段礼仪语境，也比现代汉语中的“筵席”更准确。
- source_word: יַעֲשֶׂה
  choice: 备办
  rationale: עָשָׂה本义为“做、办理”，在献祭语境中可指备办祭物或举行献祭；这里主体承担供应祭物的责任，因此用“备办”，同时以随后“献上”说明其祭祀用途。
- source_word: עוֹלָה
  choice: 燔祭
  rationale: 这是献祭术语，指全牲焚烧献上的祭；“燔祭”是准确且通行的现代中文圣经用语。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל表明祭物献予或归于雅威；“为雅威”自然表达祭物的归属与奉献方向，并保留神名。
- source_word: פָּרִים
  choice: 公牛
  rationale: פַּר在献祭语境中指公牛；原文未明确强调年龄，因此不加“幼”。
- source_word: אֵילִים
  choice: 公绵羊
  rationale: אַיִל在祭牲语境中指成年的雄性绵羊；“公绵羊”比单说“公羊”更明确。
- source_word: תְּמִימִם
  choice: 无残疾
  rationale: 该词在礼仪语境中表示祭牲完整、没有缺陷；“无残疾”清楚传达献祭资格要求。
- source_word: לַיּוֹם
  choice: 每天
  rationale: 这里具有按日分配的用法；“每天”自然表达七日内逐日相同的祭牲数目。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: חַטָּאת在祭祀法规中指与罪及洁净有关的祭；采用通行的“赎罪祭”，并以脚注保留“洁净祭”这一重要替代译法。
- source_word: שְׂעִיר עִזִּים
  choice: 一只公山羊
  rationale: 该短语指雄性山羊；单数在逐日列举祭牲的语境中自然表示一只。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的功能。
- issue: חַטָּאת的祭祀含义
  choice: 正文译“赎罪祭”
  alternative: 洁净祭
  rationale: 该词兼有处理罪与礼仪洁净的语义张力；正文采用读者熟悉的传统术语，脚注注明另一种能突出净化功能的译法，不将二者强行合并。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留原文“七天”与“每天”的重复强调；用冒号和分号理清逐日祭牲安排。正文中的“他”不擅自改为“王子”，以保留本节代词形式及其对上文的依赖。
