  yaml_path: translation/ot/ezekiel/045/024.yaml
  text: And as the grain offering[a], he shall provide an ephah for each bull and an ephah for each ram, and a hin of oil for each ephah.
translation:
  language: zh_hans
  text: 至于素祭，他要为每头公牛预备[a]一伊法，为每只公绵羊预备一伊法；每一伊法配一欣油。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “预备”直译为“做”或“制作”；在献祭语境中，也可理解为“备办”或“供给”所规定的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: 素祭
  rationale: 在献祭条例的语境中，此词特指以谷物为主的祭物；“素祭”是现代中文圣经语体中清楚而通行的术语。
- source_word: אֵיפָה
  choice: 伊法
  rationale: 这是干量单位。保留音译可保存原文礼仪计量的技术性，避免用不确定的现代近似值取代。
- source_word: לַפָּר
  choice: 为每头公牛
  rationale: 介词表示配给；在此礼仪规定中，带冠词的名词具有类指、分配含义，译作“每头”最清楚。
- source_word: לָאַיִל
  choice: 为每只公绵羊
  rationale: 与“为每头公牛”平行，表达每只祭牲所配素祭的数量；“公绵羊”也明确区别于泛称的羊。
- source_word: יַעֲשֶׂה
  choice: 预备
  rationale: 该动词字面为“做、制作”，在献祭语境中可指备办所规定的祭物；“预备”自然且保留这一语义范围，另在脚注注明字面和其他可能译法。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原文只说“油”，虽然当时通常可能是橄榄油，但正文不增添原文没有明说的信息。
- source_word: הִין
  choice: 欣
  rationale: 这是液量单位；保留音译既符合原文，也避免以有争议的现代换算值替代。
- source_word: לָאֵיפָה
  choice: 每一伊法要配
  rationale: 此短语规定油与谷物干量的比例；这样译成自然中文，并清楚表达逐单位配给的意思。
