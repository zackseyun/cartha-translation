reference: Ezekiel 45:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כֵ֤ן תַּֽעֲשֶׂה֙ בְּ/שִׁבְעָ֣ה בַ/חֹ֔דֶשׁ מֵ/אִ֥ישׁ שֹׁגֶ֖ה וּ/מִ/פֶּ֑תִי וְ/כִפַּרְתֶּ֖ם אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/020.yaml
  text: And so you shall do on the seventh day of the month for anyone who sins unintentionally or through simplicity[b][a]; thus you shall make atonement for the temple.
translation:
  language: zh_hans
  text: 本月初七，也要照样办理；因误犯者和愚蒙者[a]的缘故，你们要为圣殿[b]赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “误犯者和愚蒙者”也可理解为“任何无意犯错或因愚蒙而犯错的人”。希伯来语可能区分两类人；“愚蒙者”也可译作“单纯的人”或“天真的人”。
    reason: 保留重复介词所可能表明的两类人，以及将两项理解为同一类人之不同情形的歧义；说明פֶּתִי的词义范围。
  - marker: b
    text: 希伯来语为“那房屋／这房屋”（字面“房屋”）；在这里指圣殿或圣所。
    reason: 说明הַבָּיִת的字面表达及其在以西结圣殿异象中的所指，避免将定冠词误作明确的指示词。
lexical_decisions:
- source_word: וְכֵן
  choice: 也要照样
  rationale: 承接上一节所规定的洁净礼仪，既保留连接关系，也符合现代汉语表达。
- source_word: תַּעֲשֶׂה
  choice: 办理
  rationale: 这里指执行所规定的礼仪；“办理”比单说“做”更自然庄重，又不额外限定具体动作。
- source_word: בְּשִׁבְעָה בַחֹדֶשׁ
  choice: 本月初七
  rationale: 希伯来语省略“日”，意为该月第七日；汉语用“初七”简洁清楚。
- source_word: מֵאִישׁ שֹׁגֶה
  choice: 因误犯的人
  rationale: שׁגה在礼仪和律法语境中指无意、非故意的过犯；“误犯”保留其非蓄意性质。介词מִן按缘由理解为“因”。
- source_word: וּמִפֶּתִי
  choice: 和愚蒙人
  rationale: פֶּתִי指缺乏判断、阅历浅或容易受诱的人。“愚蒙人”既保留人物类别的表达，也避免把它过度解释为一般性的“无知犯罪”。
- source_word: וְכִפַּרְתֶּם
  choice: 你们要……赎罪
  rationale: כפר在圣所礼仪语境中表示施行赎罪或洁除污秽。采用传统而透明的“赎罪”，同时由直接宾语说明对象是圣殿。
- source_word: הַבָּיִת
  choice: 圣殿
  rationale: 字面为“这殿／房屋”，在以西结的异象语境中明确指圣殿；译作“圣殿”可避免现代读者误解为普通住宅。
theological_decisions:
- issue: 赎罪礼的对象与缘由
  choice: 人的误犯或愚蒙引发礼仪，但经文直接说要为圣殿赎罪。
  alternative: 将本句理解为直接替误犯者和愚蒙人赎罪。
  rationale: כפר的直接宾语是“圣殿”，因此不把赎罪对象改成人；同时保留前半句所说礼仪与这些人的关联。
- issue: “误犯的人”和“愚蒙人”的关系
  choice: 正文保留为两个并列称谓。
  alternative: 理解为同一类人犯罪的两种描述，即“任何无意或因愚蒙而犯罪的人”。
  rationale: 介词מִן重复出现，且פֶּתִי本身是人物称谓，支持两个类别；但上下文也容许将二者合并理解，因此在脚注中保留另一可能。
- issue: אִישׁ的范围
  choice: 译作“人”，按泛指理解。
  alternative: 译作“男人”。
  rationale: 这里的阳性单数具有泛指功能，没有证据表明礼仪只涉及男性。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“本月初七”符合现代汉语日期表达；“误犯”“愚蒙人”“赎罪”保留经文的礼仪与伦理张力。分号反映前半句礼仪缘由与后半句圣殿赎罪结果之间紧密但不完全等同的关系。
