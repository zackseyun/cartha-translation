  text: לָ/אָ֛רֶץ יִֽהְיֶה לּ֥/וֹ לַֽ/אֲחֻזָּ֖ה בְּ/יִשְׂרָאֵ֑ל וְ/לֹא יוֹנ֨וּ ע֤וֹד נְשִׂיאַ/י֙ אֶת עַמִּ֔/י וְ/הָ/אָ֛רֶץ יִתְּנ֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/שִׁבְטֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/008.yaml
  text: This land shall belong to him as a possession in Israel. And my princes shall no longer oppress my people[a], but they shall give the land to the house of Israel according to their tribes.
translation:
  language: zh_hans
  text: 这片土地要归他，在以色列中作他的产业。我的众首领不可再欺压我的百姓，而要把土地分给以色列家，按他们的支派分配。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָאָרֶץ
  choice: 这片土地
  rationale: 介词 לְ 加定冠词并置于句首，使“土地”成为强调的话题；结合上文所划定的地段，译作“这片土地”自然地体现其语境指向。
- source_word: יִהְיֶה לּוֹ
  choice: 要归他
  rationale: 希伯来语“对他而有”的结构表达归属关系；“要归他”简洁、自然，并保留代词所指由上下文确定。
- source_word: לַאֲחֻזָּה
  choice: 作他的产业
  rationale: אֲחֻזָּה 指可持有的土地或产业；“产业”符合本段土地划分的语境，也保留稳定占有之意。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列中
  rationale: 按其处所意义直译，说明这份产业位于以色列境内。
- source_word: יוֹנוּ
  choice: 欺压
  rationale: ינה 的使役形在此表示掌权者压迫或剥削百姓；“欺压”符合政治权力滥用的语境。
- source_word: נְשִׂיאַי
  choice: 我的众首领
  rationale: 原文为复数，指居领导地位者；“众首领”既保留复数，也避免把称号过度限定为某一种政体。
- source_word: וְהָאָרֶץ יִתְּנוּ
  choice: 而要……把土地分给
  rationale: 原文直译为“而土地，他们要给”；汉语用“把”字句表达自然，“分给”结合各支派承受土地的语境，传达分配之意。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中常见的整体称谓“以色列家”，不改写为较宽泛的“以色列人”。
- source_word: לְשִׁבְטֵיהֶם
  choice: 按以色列家的各支派
  rationale: 介词短语在这里具有分配标准的意义；“按……各支派”清楚表达土地依支派划分。
theological_decisions:
- issue: “他”所指的对象
  choice: 保留单数代词“他”，由上下文指向本章所说的首领
  alternative: 明说“首领”或理解为统治职位的集合称谓
  rationale: 原文仅用第三人称单数代词；保留代词可避免把上下文所暗示的对象过度明文化。
- issue: 后半句与“不再欺压”的关系
  choice: 译为“而要”，表达停止欺压与按支派分地之间的对照
  alternative: 仅译为并列的“并且要”
  rationale: 连接词 וְ 本身可表示简单并列，但语境形成明显对照；“而要”不额外引入因果关系，同时使现代汉语通顺。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“产业”“以色列家”保留先知书的土地与群体称谓；句式避免仿古，也不把“他”的身份解释性写入正文。
