  text: וְ/לַ/נָּשִׂ֡יא מִ/זֶּ֣ה וּ/מִ/זֶּה֩ לִ/תְרוּמַ֨ת הַ/קֹּ֜דֶשׁ וְ/לַ/אֲחֻזַּ֣ת הָ/עִ֗יר אֶל פְּנֵ֤י תְרֽוּמַת הַ/קֹּ֨דֶשׁ֙ וְ/אֶל פְּנֵי֙ אֲחֻזַּ֣ת הָ/עִ֔יר מִ/פְּאַת יָ֣ם יָ֔מָּ/ה וּ/מִ/פְּאַת קֵ֖דְמָ/ה קָדִ֑ימָ/ה וְ/אֹ֗רֶךְ לְ/עֻמּוֹת֙ אַחַ֣ד הַ/חֲלָקִ֔ים מִ/גְּב֥וּל יָ֖ם אֶל גְּב֥וּל קָדִֽימָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/007.yaml
  text: And for the prince there shall be land on both sides of the holy district and the property of the city[a], adjoining the holy district and adjoining the property of the city, from the west side westward and from the east side eastward; and in length corresponding to one of the tribal portions[b], from the western border to the eastern border.
translation:
  language: zh_hans
  text: 至于首领，他的地要在圣区和城的产业两边[a]，紧邻圣区和城的产业：从西边向西延伸，从东边向东延伸；其长度与一个支派的地段相对应，从西部边界直到东部边界[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣区”原文也可直译为“圣别的奉献地”或“神圣的划拨地”；这里指分别出来的一片土地。
    reason: lexical_alternative
  - marker: b
    text: 原文用“海”表示西方；在以西结的领土描述中，海所在的一侧就是西边。
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּשִׂיא
  choice: 至于君王
  rationale: נָשִׂיא在《以西结书》中通常指承担民政权柄的统治者；“君王”符合本书语境，也比泛称“领袖”更具体。
- source_word: מִזֶּה וּמִזֶּה
  choice: 两边
  rationale: 该习语表示土地分处圣区和城邑产业的两侧；“两边”自然简洁。
- source_word: תְרוּמַת הַקֹּדֶשׁ
  choice: 圣区
  rationale: תְרוּמָה本义可指奉献之物，但本节指分别出来的一片土地；“圣区”既表达其神圣用途，也清楚表明是地域。
- source_word: אֲחֻזַּת הָעִיר
  choice: 城的产业
  rationale: אֲחֻזָּה指占有的地产或产业；“城的产业”保留土地权属意味。
- source_word: אֶל פְּנֵי ... וְאֶל פְּנֵי
  choice: 与……和……相接
  rationale: 在划界语境中，此短语表示面对、沿着或毗邻相关地块；“相接”准确表达空间邻接关系，同时避免过度限定具体形状。
- source_word: מִפְּאַת יָם יָמָּה וּמִפְּאַת קֵדְמָה קָדִימָה
  choice: 从西边向西延伸，从东边向东延伸
  rationale: 在土地描述中，יָם（海）惯指西方，קֵדְמָה指东方；加入“延伸”使中文边界说明完整自然。
- source_word: לְעֻמּוֹת אַחַד הַחֲלָקִים
  choice: 与一个支派的地段相当
  rationale: לְעֻמּוֹת可表达对应、平行或相当；上下文的חֲלָקִים是各支派所得的横向地段，明示“支派”有助于普通读者识别所指。
- source_word: מִגְּבוּל יָם אֶל גְּבוּל קָדִימָה
  choice: 从西部边界直到东部边界
  rationale: 按领土划界语境将“海”译作“西”，清楚表达这片土地横贯东西的范围。
theological_decisions:
- issue: נָשִׂיא的身份称谓
  choice: 君王
  alternative: 首领／统治者
  rationale: 原文指以西结异象中具有治理职能的人物，但本节并未进一步界定其终末或弥赛亚身份；译文采用稳定称谓，不加入身份解释。
- issue: לְעֻמּוֹת所表达的空间或尺寸关系
  choice: 相当
  alternative: 平行于／与……对应
  rationale: 原词可侧重对应或并列；结合“长度”和东西边界，译作“相当”表达其与一个支派地段相应，又不擅自给出具体数值。
translation_notes:
  register: 采用现代、庄重而易懂的土地划界用语。保留原文东西两向的重复结构，并以分号梳理长句。正文中的[a]、[b]均与脚注对应。
