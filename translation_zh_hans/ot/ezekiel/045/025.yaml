id: EZK.45.25
reference: Ezekiel 45:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/שְּׁבִיעִ֡י בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בֶּ/חָ֔ג יַעֲשֶׂ֥ה כָ/אֵ֖לֶּה שִׁבְעַ֣ת הַ/יָּמִ֑ים כַּֽ/חַטָּאת֙ כָּ/עֹלָ֔ה וְ/כַ/מִּנְחָ֖ה וְ/כַ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/025.yaml
  text: 'In the seventh month[a], on the fifteenth day of the month, at the feast, he shall provide the same offerings for seven days: the sin offering, the burnt offering, the grain offering[b], and the oil.'
translation:
  language: zh_hans
  text: 七月[a]十五日，在节期中，他要一连七天照样预备[b]赎罪祭、燔祭、素祭和油。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“在第七”，按日期格式指第七月。
    reason: 原文省略了“月”，译文为清楚起见补出。
  - marker: b
    text: “照样预备”原文直译“做像这些”；意思是按前述规定办理同样的祭物。
    reason: 说明宽泛动词与回指短语的合译，并保留原文表达的余地。
lexical_decisions:
- source_word: בַּשְּׁבִיעִי
  choice: 七月
  rationale: 原文直译为“在第七”，结合随后“本月十五日”的日期格式，所指是第七月；现代汉语补出“月”才自然清楚。
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: 十五日
  rationale: 这是希伯来语常见的历法日期表达；“七月十五日”在现代汉语中已完整表达其含义，无须重复“本月”。
- source_word: בֶּחָג
  choice: 在节期中
  rationale: חָג 指宗教节期或节庆；“节期”符合本段礼仪语境，“在……中”也可表达该祭礼持续于节期期间。
- source_word: יַעֲשֶׂה כָאֵלֶּה
  choice: 照样预备
  rationale: עשה 本义宽泛，可指“做、办理”；כָאֵלֶּה 回指前述规定。结合本章君王负责供应祭物的语境，“照样预备”既自然，又不把他具体说成亲自执行祭司的献祭职务。
- source_word: שִׁבְעַת הַיָּמִים
  choice: 一连七天
  rationale: 该短语表示整个七日节期的持续时间；“一连七天”简洁自然。
- source_word: כַּחַטָּאת
  choice: 赎罪祭
  rationale: חַטָּאת 在献祭语境中是赎罪祭；前缀 כ 在此引出照前例办理的祭物类别，不必逐项生硬译作“像”。
- source_word: כָעֹלָה
  choice: 燔祭
  rationale: עֹלָה 是全部焚烧献上的祭，采用现代中文圣经读者熟悉且准确的“燔祭”。
- source_word: וְכַמִּנְחָה
  choice: 素祭
  rationale: מִנְחָה 在祭祀律例中指以谷物等献上的祭物；“素祭”是准确、简洁的中文礼仪术语。
- source_word: וְכַשָּׁמֶן
  choice: 和油
  rationale: 原文有定冠词，指前文规定配用的油；中文并不借冠词表达定指，直译为“油”最自然。
theological_decisions:
- issue: יַעֲשֶׂה 的隐含主语是谁
  choice: 保留为“他”，按上下文指君王
  alternative: 指未明确身份的敬拜者或礼仪执行者
  rationale: 紧接的上下文持续以君王为负责供应祭物者；译文保留原文的代词“他”，不在正文额外补入身份，也以“预备”避免暗示君王亲自行使祭司职分。
- issue: כַּחַטָּאת כָעֹלָה 等连续 כ 前缀的功能
  choice: 将其理解为照前述规定办理各类祭物，并自然列出祭名
  alternative: 逐项译为“像赎罪祭、像燔祭……”
  rationale: 这些 כ 前缀承接“照这些”的比较关系，汉语若逐项重复“像”会含混生硬；列出祭物类别既保留所指，也不额外规定各祭的具体数量。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“赎罪祭、燔祭、素祭”保留必要的礼仪术语；句式简洁，适合普通读者朗读。
