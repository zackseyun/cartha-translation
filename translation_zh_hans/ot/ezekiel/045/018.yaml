source:
  edition: WLC
  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ תִּקַּ֥ח פַּר בֶּן בָּקָ֖ר תָּמִ֑ים וְ/חִטֵּאתָ֖ אֶת הַ/מִּקְדָּֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/018.yaml
  text: 'Thus says the Lord GOD: In the first month[a], on the first day of the month, you shall take a bull from the herd without blemish, and you shall purify the sanctuary.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“正月初一，你要从牛群中取一头没有残疾的公牛，洁净圣所[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“为圣所赎罪”。这里的希伯来语动词是礼仪用语，可指除去罪污，使之洁净。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 这是复合神圣称号；“主耶和华”符合现代中文圣经语体，也避免把两个称号混同。
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: 正月初一
  rationale: “第一”在后续月份日期表达的限定下指第一月；“初一”自然准确地表达每月第一日。
- source_word: תִּקַּח
  choice: 你要……取
  rationale: 未完成式在礼仪法规语境中具有指令作用；“你要”既清楚又符合现代中文规范语体。
- source_word: פַּר בֶּן בָּקָר
  choice: 从牛群中取一头……公牛
  rationale: 该短语指牛类中的公牛；此译法不对年龄作原文没有明确要求的过度限定。
- source_word: תָּמִים
  choice: 没有残疾
  rationale: 在献祭语境中表示祭牲完整、无缺陷；“没有残疾”是普通读者易懂的礼仪表达。
- source_word: וְחִטֵּאתָ
  choice: 洁净
  rationale: חטא 的皮埃勒式在礼仪语境中表示除去罪污、使之洁净；“洁净”保留其礼仪功能，同时不把圣所说成犯罪主体。
- source_word: הַמִּקְדָּשׁ
  choice: 圣所
  rationale: מקדש 指神圣的场所或圣域；“圣所”简洁且能涵盖此处所指的神圣空间。
theological_decisions:
- issue: 以圣所为宾语时，礼仪动词 חטא 的译法
  choice: 洁净圣所
  alternative: 为圣所赎罪
  rationale: 原文描写施于圣所的除罪污礼仪。“洁净”直接表达其结果和功能，又以脚注保留传统且可成立的“赎罪”译法，不消除原文的礼仪与神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“正月初一”简明表达希伯来日期格式；句式保留神谕引言与法规指令的正式感。脚注标记紧随存在词义分歧的“圣所”之后，而不是置于月份之后。
