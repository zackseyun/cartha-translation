  text: וּ/מִן הַ/מִּדָּ֤ה הַ/זֹּאת֙ תָּמ֔וֹד אֹ֗רֶךְ חמש וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֣רֶת אֲלָפִ֑ים וּ/בֽ/וֹ יִהְיֶ֥ה הַ/מִּקְדָּ֖שׁ קֹ֥דֶשׁ קָדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/003.yaml
  text: From this measured area you shall measure a length of twenty-five thousand and a width of ten thousand[a], and in it shall be the sanctuary, the most holy place.
translation:
  language: zh_hans
  text: 你要从这片量定的地中，量出长二万五千、宽一万；其中将有圣所，这圣所是至圣的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这圣所是至圣的”也可译作“圣所，就是至圣之处”；传统译法作“至圣所”。
    reason: קֹדֶשׁ קָדָשִׁים是表示最高程度圣洁的短语；在此可理解为对“圣所”的描述，也可按传统理解为圣域名称。
lexical_decisions:
- source_word: וּמִן הַמִּדָּה הַזֹּאת
  choice: 从这片量定的地中
  rationale: מִדָּה在这段土地划分的语境中指量定的区域，不只是抽象的尺寸；“这片量定的地”自然承接上文，并保留מִן“从……中”的含义。
- source_word: תָּמֹד
  choice: 你要……量出
  rationale: 这是מדד的Qal未完成式第二人称阳性单数，在程序性指示中译为“你要量出”，保留直接吩咐的语气。
- source_word: אֹרֶךְ חמש וְעֶשְׂרִים אֶלֶף
  choice: 长二万五千
  rationale: 按现代汉语表达数字，并简洁呈现第一项尺寸。
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: 宽一万
  rationale: רֹחַב译为“宽”，与“长”构成自然的尺寸对应。
- source_word: וּבוֹ
  choice: 要设在其中
  rationale: “其中”明确回指所量出的地块；补入“设”使汉语句子通顺，但不增添地点以外的实质信息。
- source_word: הַמִּקְדָּשׁ
  choice: 圣所
  rationale: מִקְדָּשׁ指分别为圣的圣域或圣所；“圣所”是现代中文中准确、庄重且不把范围过度限定为某一建筑部分的译法。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣之处
  rationale: 该短语是希伯来语最高级表达，可指“至圣”；译作“至圣之处”既体现地点语境，也避免直接采用可能被理解为特定内室专名的传统术语。
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים在圣殿语境中的所指
  choice: 至圣之处
  alternative: 至圣所；是至圣的
  rationale: 原文可把该短语理解为对圣所的同位说明，也可理解为对其圣洁程度的最高级描述。正文用“就是至圣之处”保留同位关系和地点含义；脚注说明另一种较少限定空间范围的理解，以免把歧义静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“量定的地”“量出”保持土地丈量语境；数字不擅自补入原文未明说的长度单位。正文中的脚注标记置于相关整句之后。
