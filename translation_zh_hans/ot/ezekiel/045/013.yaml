base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/013.yaml
  text: 'This is the contribution that you shall offer: one-sixth of an ephah from each homer of wheat[a], and one-sixth of an ephah from each homer of barley.'
translation:
  language: zh_hans
  text: “你们当献的供物如下：每贺梅珥的小麦中，献上六分之一伊法[a]；每贺梅珥的大麦中，也献上六分之一伊法。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伊法”和“贺梅珥”都是古代的干量单位；本节规定，每贺梅珥小麦或大麦献上六分之一伊法。
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמָה
  choice: 供物
  rationale: 本词指分别出来并呈献的一份；这里兼具敬拜与规章征收的语境。“供物”自然、庄重，又不把含义局限为某一种特定祭物。
- source_word: תָּרִימוּ
  choice: 要献上
  rationale: 使役形与תְּרוּמָה连用，惯用义是把分别出来的一份呈献上去；译作“献上”比直译“举起”更符合现代汉语。
- source_word: שִׁשִּׁית
  choice: 六分之一
  rationale: 上下文明确是在规定粮食的固定比例，现代汉语用“六分之一”最清楚。
- source_word: אֵיפָה
  choice: 伊法
  rationale: 保留古代干量单位的音译，避免以不确定的现代容积数值替换原文。
- source_word: חֹמֶר
  choice: 贺梅珥
  rationale: 保留原文古代容量单位的音译，以维持度量规定的技术性和准确性。
- source_word: מֵחֹמֶר
  choice: 每一贺梅珥……要献
  rationale: 介词表示从一贺梅珥总量中取出规定份额；“每一”自然表达规章中隐含的逐单位分配意义。
- source_word: הַחִטִּים
  choice: 小麦
  rationale: 现代汉语在度量公式中通常不需译出定冠词。
- source_word: וְשִׁשִּׁיתֶם
  choice: 也要献六分之一伊法
  rationale: 该词形较特殊，但在句法和语义上显然与前面的六分之一平行；译文保留这一平行关系而不对异常词形作过度解释。
- source_word: הַשְּׂעֹרִים
  choice: 大麦
  rationale: 采用现代标准粮食名称，并按汉语习惯不另译定冠词。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句首以“如下”引出规章内容，并用两个平行分句清楚呈现小麦和大麦的相同份额。古代单位保留音译，并以脚注说明，不换算为存在争议的现代容量。
