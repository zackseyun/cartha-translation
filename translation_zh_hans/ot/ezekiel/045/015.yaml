source:
  edition: WLC
  text: וְ/שֶׂה אַחַ֨ת מִן הַ/צֹּ֤אן מִן הַ/מָּאתַ֨יִם֙ מִ/מַּשְׁקֵ֣ה יִשְׂרָאֵ֔ל לְ/מִנְחָ֖ה וּ/לְ/עוֹלָ֣ה וְ/לִ/שְׁלָמִ֑ים לְ/כַפֵּ֣ר עֲלֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/015.yaml
  text: and one sheep from every two hundred from the well-watered pastures of Israel[a], for a grain offering and for a burnt offering and for peace offerings, to make atonement for them, declares the Lord GOD.
translation:
  language: zh_hans
  text: 以色列水草丰美之地[a]的羊群，每二百只要献一只，作素祭、燔祭和平安祭，为他们赎罪。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水草丰美之地”也可译作“有水灌溉之地”或“肥美的牧场”。原文用词与饮水、供水有关，在这里很可能指水源充足的放牧地。
    reason: 说明מִמַּשְׁקֵה יִשְׂרָאֵל的词义范围及语境判断。
lexical_decisions:
- source_word: וְשֶׂה אַחַת מִן־הַצֹּאן מִן־הַמָּאתַיִם
  choice: 羊群，每二百只要献一只
  rationale: שֶׂה可指绵羊或山羊中的一只，并不限定年龄或性别；汉语“羊”保留这种宽泛性。מִן־הַמָּאתַיִם在此表达征收比例，译成“每二百只……一只”清楚自然。
- source_word: מִמַּשְׁקֵה יִשְׂרָאֵל
  choice: 以色列水草丰美之地
  rationale: מַשְׁקֶה与饮水、灌溉有关；在羊群的语境中，很可能指水源充足、适宜放牧之地。“水草丰美之地”符合汉语表达，同时以脚注保留其他可能理解。
- source_word: לְמִנְחָה
  choice: 作素祭
  rationale: מִנְחָה虽可泛指礼物或贡物，但与燔祭和平安祭并列时，通常是专门的祭祀术语，译作“素祭”。
- source_word: וּלְעוֹלָה
  choice: 燔祭
  rationale: עוֹלָה指祭物全部焚烧献上的祭，是标准祭祀术语；“燔祭”准确而简洁。
- source_word: וְלִשְׁלָמִים
  choice: 平安祭
  rationale: שְׁלָמִים指与平安、福祉相关的祭。“平安祭”保留其词义关联，也是不额外限定其功能的通行译法。
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: 为他们赎罪
  rationale: כפר在祭祀语境中指施行赎罪；“为他们赎罪”保留代词所指，不擅自把“他们”具体化。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是庄重的神谕宣告公式；“主耶和华”同时表达אֲדֹנָי与神名יהוה，避免重复译成“主主”。
theological_decisions:
- issue: לְכַפֵּר的祭祀及神学含义
  choice: 赎罪
  alternative: 洁净／遮盖
  rationale: “赎罪”在此最能传达祭祀语境中的核心作用，同时不说明赎罪如何生效，因而不引入特定赎罪理论。
- issue: 复合称号אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文圣经语境中清楚可识别，并同时呈现“主”这一称号与יהוה这一专名；正文不把两者合并成单一称号。
- issue: עֲלֵיהֶם所指对象
  choice: 他们
  alternative: 百姓
  rationale: 本节希伯来文本使用第三人称复数代词，具体所指需由上下文判断；正文保留代词，以免消除原文的指代空间。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“每二百只要献一只”明示原文比例关系；祭祀术语使用中文读者较熟悉的“素祭、燔祭、平安祭”。正文保留“他们”的歧义，并以脚注交代“水草丰美之地”的词汇替代译法。
