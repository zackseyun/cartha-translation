  text: וְ/עַֽל הַ/נָּשִׂ֣יא יִהְיֶ֗ה הָ/עוֹל֣וֹת וְ/הַ/מִּנְחָה֮ וְ/הַ/נֵּסֶךְ֒ בַּ/חַגִּ֤ים וּ/בֶ/חֳדָשִׁים֙ וּ/בַ/שַּׁבָּת֔וֹת בְּ/כָֽל מוֹעֲדֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֽוּא יַעֲשֶׂ֞ה אֶת הַ/חַטָּ֣את וְ/אֶת הַ/מִּנְחָ֗ה וְ/אֶת הָֽ/עוֹלָה֙ וְ/אֶת הַ/שְּׁלָמִ֔ים לְ/כַפֵּ֖ר בְּעַ֥ד בֵּֽית יִשְׂרָאֵֽל־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/017.yaml
  text: And the burnt offerings[a], the grain offering, and the drink offering at the feasts, at the new moons, and at the Sabbaths—at all the appointed times of the house of Israel—shall be the prince’s responsibility. He shall provide the sin offering, the grain offering, the burnt offering, and the peace offerings[b], to make atonement for the house of Israel.
translation:
  language: zh_hans
  text: 在各节期、月朔和安息日，即以色列家一切规定的节期，燔祭、素祭和奠祭都由君王负责。他要供给赎罪祭[a]、素祭、燔祭和平安祭[b]，为以色列家赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”或译“洁净祭”。
    reason: lexical_alternative
  - marker: b
    text: “平安祭”或译“团契祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַנָּשִׂיא יִהְיֶה
  choice: 都由君王负责
  rationale: עַל与היה连用在此表示责任或义务落在某人身上；译为“由……负责”自然地传达这一含义，又不暗示君王必须亲手执行祭司职分。
- source_word: הַנָּשִׂיא
  choice: 君王
  rationale: נָשִׂיא在《以西结书》的异象语境中指民政领袖。现代汉语“君王”既保留其尊贵统治者身份，也避免译成经文未明说的“国王”；相较“王子”，又不易被误解为君主之子。
- source_word: הָעוֹלוֹת / הָעוֹלָה
  choice: 燔祭
  rationale: עוֹלָה指全部焚烧献上的祭物；“燔祭”是准确而通行的中文祭祀术语。前一处希伯来文为复数，中文类名词无需机械标出复数。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: מִנְחָה在祭祀语境中专指以谷物等献上的祭。“素祭”是简洁且为普通中文读者熟悉的对应词。
- source_word: הַנֵּסֶךְ
  choice: 奠祭
  rationale: נֶסֶךְ指倾倒献上的液体祭物；“奠祭”准确保留其礼仪性质。
- source_word: בַּחַגִּים וּבֶחֳדָשִׁים וּבַשַּׁבָּתוֹת
  choice: 在各节期、月朔和安息日
  rationale: 依次保留以色列礼仪历法中的节期、新月之日和安息日。“月朔”简洁准确，且是现代中文圣经语体中可理解的固定用语。
- source_word: בְּכָל מוֹעֲדֵי בֵּית יִשְׂרָאֵל
  choice: 以色列家一切指定的日子
  rationale: מוֹעֵד泛指指定的时间或聚会日期。译作“指定的日子”保留其广度，并避免与前面的“节期”重复。
- source_word: הוּא יַעֲשֶׂה
  choice: 他要供给
  rationale: עשה在献祭语境中可表示预备、办理或献上。结合本节先说责任归于君王，“供给”最能表达他负责提供祭物，同时不把他明确塑造成亲自献祭的祭司。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: חַטָּאת在祭祀语境中指相应祭物；“赎罪祭”是通行译法。其也可强调洁净功能，故以脚注保留“洁净祭”。
- source_word: הַשְּׁלָמִים
  choice: 平安祭
  rationale: שְׁלָמִים与完整、福祉、和平及共享祭筵有关。“平安祭”是简洁而传统的译法，其他可能侧重以脚注说明。
- source_word: לְכַפֵּר בְּעַד
  choice: 为……赎罪
  rationale: כפר在祭祀语境中表示施行遮盖、洁净或赎罪的礼仪功效。“为……赎罪”保留经文的礼仪神学用语，而不附加后来的特定赎罪理论。
theological_decisions:
- issue: 君王在献祭礼仪中的角色
  choice: 译为君王“负责”并“供给”祭物
  alternative: 译为君王亲自“献上”或“办理”各祭
  rationale: 希伯来文把责任放在君王身上，并用宽泛的עשה描述其行动；上下文支持他承担供应责任，却未明确说他亲手履行祭司礼仪。译文不把这一含混处过度确定化。
- issue: 祭祀中的赎罪含义
  choice: 保留“为以色列家赎罪”
  alternative: 按后来的系统神学范畴具体解释赎罪机制
  rationale: 本节所说的是《以西结书》圣殿异象中的礼仪性赎罪。译文保留原有祭祀语言，不引入经文没有明说的理论。
translation_notes:
  register: 采用现代、庄重而清晰的标准普通话。“月朔、燔祭、素祭、奠祭、赎罪祭、平安祭”等为该段礼仪语境所需的规范术语；句首重排时间状语，并加入“所需的”，使希伯来文责任结构在中文中自然明确。所有脚注标记均置于相应术语之后。
