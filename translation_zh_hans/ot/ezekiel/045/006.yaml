  text: וַ/אֲחֻזַּ֨ת הָ/עִ֜יר תִּתְּנ֗וּ חֲמֵ֤שֶׁת אֲלָפִים֙ רֹ֔חַב וְ/אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ לְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/006.yaml
  text: And as the city's property[a], you shall give an area five thousand wide and twenty-five thousand long, alongside the holy contribution[b]; it shall belong to the whole house of Israel.
translation:
  language: zh_hans
  text: “你们要划出一块地作为城的产业，宽五千，长二万五千，与圣供地相对应[a]；这地要归以色列全家所有[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “相对应”也可译作“沿着”或“与……平行”。希伯来语表达既可指空间上的排列，也可指彼此对应。
    reason: lexical_alternative
  - marker: b
    text: “以色列全家”是对以色列全体百姓的集体称呼。
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֻזַּת הָעִיר
  choice: 城的产业
  rationale: אֲחֻזָּה指所拥有或划定的地产。译作“城的产业”保留其归属与土地产业的含义；在句法上用“作为城的产业”使现代汉语自然清楚。
- source_word: תִּתְּנוּ
  choice: 你们要划出
  rationale: נתן本义为“给”。在土地分配的语境中，“划出”准确表达把一块地指定出来的动作，同时比直译“给出”更符合现代汉语。
- source_word: חֲמֵשֶׁת אֲלָפִים רֹחַב
  choice: 宽五千
  rationale: 紧贴原文简洁的尺寸表达。原文本节未明说计量单位，因此正文不擅自补入。
- source_word: וְאֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: 长二万五千
  rationale: 以自然简练的汉语对应原文的长度说明，并与“宽五千”保持平行。
- source_word: לְעֻמַּת
  choice: 相对应
  rationale: 该词可表示空间上的相对、沿着或平行，也可表达对应关系。“相对应”保留关系性而不把具体空间布局限定得过死，并以脚注说明其他可能。
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: 圣供地
  rationale: תְּרוּמָה通常指献上或分别出来的份额；本章特指划出的神圣土地。“圣供地”兼顾礼仪上的分别为圣和土地份额这一语境。
- source_word: לְכָל בֵּית יִשְׂרָאֵל יִהְיֶה
  choice: 这地要归以色列全家所有
  rationale: היה在此与介词结构共同表达归属。“归……所有”是自然汉语，并保留“以色列全家”这一集体称谓和כָל所表达的整体性。
theological_decisions:
- issue: 城的土地与圣供地之间的关系
  choice: 译作“相对应”，并用脚注保留空间关系的多种可能
  alternative: 译作“沿着圣供地”或“与圣供地平行”
  rationale: 原词可涵盖空间上的并列、相对或对应；正文不把尚存的词义张力固定为某一种精确布局。
translation_notes:
  register: 采用现代、庄重而易懂的土地划分用语。句式按汉语习惯重组为“划出一块地作为……”，尺寸保持原文的简洁表达，不补出本节未注明的计量单位；脚注用于保留לְעֻמַּת的真实歧义。
