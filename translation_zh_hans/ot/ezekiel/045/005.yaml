base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/005.yaml
  text: And an area twenty-five thousand long and ten thousand wide shall be for the Levites[a], the ministers of the house, for their possession[b], with twenty chambers.
translation:
  language: zh_hans
  text: 又有一块地，长二万五千，宽一万，要归给利未人，就是在殿[b]中供职的人，作他们的产业，并有二十间房室[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “并有二十间房室”原文末句的句法较难确定；也可理解为“作他们的产业，用于二十间房室”。
    reason: alternative_reading
  - marker: b
    text: “殿”原文直译为“房屋”，这里指圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: וַחֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ
  choice: 长二万五千肘
  rationale: 希伯来语直译为“五又二十千”，现代汉语自然表达为“二万五千”。原文承接上下文省略计量单位；依据本段尺寸语境补出“肘”，使普通读者能够理解。
- source_word: וַעֲשֶׂרֶת אֲלָפִים רֹחַב
  choice: 宽一万肘
  rationale: רֹחַב表示宽度，与前面的长度尺寸构成对应；同样按上下文补出计量单位“肘”。
- source_word: יהיה לַלְוִיִּם
  choice: 要归给利未人
  rationale: 未完成式יהיה在异象中的分地规定里表达指定或安排；“要归给”既自然，也保留规范性的语气。
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: 在殿中供职的人
  rationale: מְשָׁרְתֵי指执行礼仪服事者；译作“供职的人”避免引入后世教会职衔。הַבַּיִת字面为“这房屋”，在此指圣殿，正文采用自然明确的“殿”，并以脚注说明。
- source_word: לָהֶם לַאֲחֻזָּה
  choice: 作他们的产业
  rationale: אֲחֻזָּה指获分配并持有的地产或产业；“作他们的产业”符合土地分配语境。
- source_word: עֶשְׂרִים לְשָׁכֹת
  choice: 并有二十间房
  rationale: לְשָׁכֹת指房间、厢房或内室。末尾短语与前文的句法关系不明确；正文用“并有”作最少限度的衔接，同时在脚注保留另一种理解。
theological_decisions:
- issue: “房屋”在本节中的所指
  choice: 正文译为“殿”
  alternative: 直译为“房屋”
  rationale: 以西结书这一段明确谈圣所及其中的供职者，因此所指是圣殿；译为“殿”澄清现代汉语中可能产生的误解，并不增加宗派性解释。
- issue: 末句“二十间房”与“产业”的句法关系
  choice: 译为附加说明“并有二十间房”
  alternative: 理解为“作他们二十间房的产业”
  rationale: 希伯来语末句结构压缩且难解，正文采取较顺畅但不过度解释的连接方式，脚注保留另一种可能，避免消除原文歧义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“另有一块地”自然承接上一节的分地说明；尺寸采用“长……宽……”的常用表达。正文避免使用带有后世教会制度色彩的“圣职人员”等称谓，并通过脚注保留末句真实的句法难点。
