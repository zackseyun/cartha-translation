  text: וְ/חֹ֨ק הַ/שֶּׁ֜מֶן הַ/בַּ֣ת הַ/שֶּׁ֗מֶן מַעְשַׂ֤ר הַ/בַּת֙ מִן הַ/כֹּ֔ר עֲשֶׂ֥רֶת הַ/בַּתִּ֖ים חֹ֑מֶר כִּֽי עֲשֶׂ֥רֶת הַ/בַּתִּ֖ים חֹֽמֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/014.yaml
  text: And the fixed due of oil shall be one bath of oil from each cor[a], from ten baths, that is, one homer[c][b], for ten baths are one homer.
translation:
  language: zh_hans
  text: 油的定额如下：按巴特计，每一柯珥[a]要交十分之一巴特的油；十巴特为一贺梅珥[b]，因为十巴特就是一贺梅珥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“从柯珥中取十分之一巴特”。柯珥与贺梅珥在这里作为等量单位使用，因此应交的是一柯珥的百分之一，而不是十分之一。
    reason: 说明原文压缩的计量表达，避免将税额误解为每柯珥一巴特。
  - marker: b
    text: 巴特、柯珥和贺梅珥都是古代以色列的容量单位；本节说明十巴特等于一贺梅珥。
    reason: 提供理解古代计量单位所需的文化背景。
lexical_decisions:
- source_word: חֹק
  choice: 定额
  rationale: 这里指按规定应交的份额，而不是抽象的“律例”；“定额”兼顾固定数额与缴纳义务。
- source_word: שֶּׁמֶן
  choice: 油
  rationale: 原文只说“油”；虽在当地通常指橄榄油，但不在正文中增添“橄榄”。
- source_word: בַּת
  choice: 巴特
  rationale: 古代液量单位，采用音译，以保留原文计量体系；经文随后说明它与贺梅珥的换算关系。
- source_word: מַעְשַׂר הַבַּת
  choice: 十分之一巴特
  rationale: מַעְשַׂר明确表示“十分之一”；不能译成“每柯珥一巴特”，否则会把应交数额扩大十倍。
- source_word: כֹּר
  choice: 柯珥
  rationale: 古代容量单位，采用较通行的中文音译，不擅自换算成现代单位。
- source_word: עֲשֶׂרֶת הַבַּתִּים
  choice: 十巴特
  rationale: 直接保留原文给出的数值和单位。
- source_word: חֹמֶר
  choice: 贺梅珥
  rationale: 古代容量单位，采用音译；原文明确说明一贺梅珥等于十巴特。
- source_word: כִּי
  choice: 因为
  rationale: 保留连接词通常的解释兼因由作用，也保留原文重复说明单位换算的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的说明性句式。“油的定额如下”自然引出后面的计量规定；保留“十巴特为一贺梅珥，因为十巴特就是一贺梅珥”的重复，以反映希伯来原文的强调或解释性复述。
