  text: וְ/עָשָׂ֤ה הַ/נָּשִׂיא֙ בַּ/יּ֣וֹם הַ/ה֔וּא בַּעֲד֕/וֹ וּ/בְעַ֖ד כָּל עַ֣ם הָ/אָ֑רֶץ פַּ֖ר חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/022.yaml
  text: On that day the prince shall provide[a], for himself and for all the people of the land, a bull as a sin offering.
translation:
  language: zh_hans
  text: 在那一天，君王要为自己和这地所有的百姓预备一头公牛，作赎罪祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作洁净祭”。希伯来语“חַטָּאת”可指为除去罪或不洁而献的祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 要……预备
  rationale: עָשָׂה本义为“做、制作”，在献祭语境中可指备办或献上祭牲；本章强调王所承担的礼仪职责，因此译作“预备”自然且不过度解释。
- source_word: הַנָּשִׂיא
  choice: 王
  rationale: נָשִׂיא在《以西结书》的圣殿异象中指特定的民政统治者。现代汉语圣经语境中“王”比泛称“领袖”更能体现其统治身份，同时避免生硬的“亲王”。
- source_word: בַּיּוֹם הַהוּא
  choice: 在那一天
  rationale: 直接、自然地表达时间，保留原文的指示意味。
- source_word: בַּעֲדוֹ
  choice: 为自己
  rationale: בְּעַד加代词后缀表示为某人或代表某人；此处译作“为自己”简洁明确。
- source_word: וּבְעַד כָּל עַם הָאָרֶץ
  choice: 和这地所有的百姓
  rationale: 保留祭物为全体民众而备的代表性；עַם הָאָרֶץ在此按广义理解为当地全体百姓，而非特定社会阶层。
- source_word: פַּר
  choice: 一头公牛
  rationale: פַּר在献祭语境中指公牛；原文没有明确表达“幼”，故不增译“牛犊”。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 此处因前有祭牲“公牛”，确定是祭物名称。“赎罪祭”是现代汉语读者熟悉的礼仪术语；其也可理解为处理罪或不洁的“洁净祭”，故以脚注保留该词的语义张力。
theological_decisions:
- issue: 礼仪语境中חַטָּאת的译法
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: 该词可涉及罪，也可指除去礼仪性不洁的祭。正文采用熟悉的“赎罪祭”，但不把其功能限定为只处理道德过犯；脚注保留“洁净祭”这一有文本依据的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“预备”体现王在本章中的礼仪职责；“这地所有的百姓”避免把该短语误解为特定阶层。正文保留传统祭祀术语，并用脚注说明其可表达洁净功能。
