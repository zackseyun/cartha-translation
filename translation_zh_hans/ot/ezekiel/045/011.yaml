  text: הָ/אֵיפָ֣ה וְ/הַ/בַּ֗ת תֹּ֤כֶן אֶחָד֙ יִֽהְיֶ֔ה לָ/שֵׂ֕את מַעְשַׂ֥ר הַ/חֹ֖מֶר הַ/בָּ֑ת וַ/עֲשִׂירִ֤ת הַ/חֹ֨מֶר֙ הָֽ/אֵיפָ֔ה אֶל הַ/חֹ֖מֶר יִהְיֶ֥ה מַתְכֻּנְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/011.yaml
  text: The ephah and the bath shall be of one measure[a], so that the bath may hold a tenth of a homer, and the ephah a tenth of a homer[c][b]; their standard shall be according to the homer.
translation:
  language: zh_hans
  text: 伊法和罢特要有同一规定的容量[a]：罢特可容纳贺梅珥的十分之一，伊法也可容纳贺梅珥的十分之一[b]；它们的计量标准要以贺梅珥为准。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“伊法和罢特要有同一个固定的标准。”
    reason: 保留תֹּכֶן אֶחָד可指统一的规定容量或固定计量标准这一词义。
  - marker: b
    text: 贺梅珥是较大的容量标准单位；伊法用于量干物，罢特用于量液体，二者都等于贺梅珥的十分之一。“贺梅珥”传统上也称“歌珥”。
    reason: 说明古代度量衡关系，并保留传统替代名称。
lexical_decisions:
- source_word: אֵיפָה
  choice: 伊法
  rationale: 古代干量单位，现代汉语没有准确对应单位；采用通行音译，并由脚注说明其用途。
- source_word: בַּת
  choice: 罢特
  rationale: 古代液量单位，采用音译，以免用现代容量单位作不可靠的折算。
- source_word: תֹּכֶן אֶחָד
  choice: 容量要相同
  rationale: 在度量衡语境中指两种单位具有同一容量；这样译比直译为“一个量”更自然清楚。
- source_word: לָשֵׂאת
  choice: 是
  rationale: 原词有“容纳、盛载”之意；汉语用系词表达单位与其容量比例，简洁而不损失计量含义。
- source_word: מַעְשַׂר / עֲשִׂירִת
  choice: 十分之一
  rationale: 两个词在平行结构中都表示数量上的十分之一，并非礼仪意义的“十一奉献”。
- source_word: חֹמֶר
  choice: 贺梅珥
  rationale: 较大的古代容量标准单位；按希伯来语音译，避免与现代单位混同。
- source_word: אֶל הַחֹמֶר
  choice: 以“一贺梅珥”为准
  rationale: 介词结构表明贺梅珥是规定较小单位容量的参照标准。
- source_word: מַתְכֻּנְתּוֹ
  choice: 它们的计量标准
  rationale: 原文为单数形式并带第三人称单数后缀，但语义上概括前述两种量器或单位的规定比例；汉语复数“它们”自然承接伊法和罢特。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。古代度量单位一律音译，不作存在争议的现代数值换算；用引号帮助读者识别陌生单位名称。原文先总述伊法与罢特同量，再分别说明二者各为贺梅珥的十分之一，译文保留这一结构和重复所产生的法规语气。
