  to: 伊法和罢特要有同一规定的容量[a]：罢特可容纳贺梅珥的十分之一，伊法也可容纳贺梅珥的十分之一[b]；它们的计量标准要以贺梅珥为准。
  rationale: 修订以“同一规定的容量”表达两种单位受同一计量规定约束，并用“可容纳”对应原文的容量动词；同时删除单位名称周围不自然的引号。脚注a改为直接说明首句可侧重“固定标准”的含义，未增加原文没有的解释。
