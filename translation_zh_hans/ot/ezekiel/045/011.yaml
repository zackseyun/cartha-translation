  - severity: medium
    issue: “一罢特是……十分之一，一伊法也是……”将לָשֵׂאת简化为系词。
    rationale: לָשֵׂאת在容量语境表示“容纳、盛载”。以“可容纳”译出，既自然也更贴近原文。
