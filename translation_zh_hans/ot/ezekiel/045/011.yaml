  source_fidelity: 草稿正确保留了伊法和罢特各为贺梅珥十分之一、并以贺梅珥为基准的核心计量关系。但“容量要相同”较为口语化，且弱化了תֹּכֶן אֶחָד所指的统一规定容量／标准；“一罢特是……”也没有表达לָשֵׂאת（容纳、盛载）的句法意象。
  naturalness: “一罢特是‘一贺梅珥’的十分之一”中对单位名称加引号不合现代汉语计量表述，连续使用“一”亦显得生硬。改为“罢特可容纳贺梅珥的十分之一”自然、清楚，并与原文平行句式相符。
  terminology: “伊法”“罢特”“贺梅珥”可保留为音译技术单位；脚注说明干量、液量及“歌珥”这一传统别称是恰当的。
