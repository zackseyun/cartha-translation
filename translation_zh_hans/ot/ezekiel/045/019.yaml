language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֣ם הַ/חַטָּ֗את וְ/נָתַן֙ אֶל מְזוּזַ֣ת הַ/בַּ֔יִת וְ/אֶל אַרְבַּ֛ע פִּנּ֥וֹת הָ/עֲזָרָ֖ה לַ/מִּזְבֵּ֑חַ וְ/עַ֨ל מְזוּזַ֔ת שַׁ֖עַר הֶ/חָצֵ֥ר הַ/פְּנִימִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/019.yaml
  text: And the priest shall take some of the blood of the sin offering and put it on the doorposts of the temple[a], on the four corners of the altar ledge, and on the doorposts of the gate of the inner court.
translation:
  language: zh_hans
  text: 祭司要取些赎罪祭[a]的血，抹在殿的门柱上、祭坛台座[b]的四角上，以及内院门的门柱上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”或“净化祭”。希伯来语原词在献祭语境中既与罪有关，也强调礼仪上的洁净。
    reason: 保留חַטָּאת在祭祀语境中的重要词义选择。
  - marker: b
    text: 这里译作“台座”的希伯来语词所指的精确祭坛构件并不完全确定；也可能指祭坛周围的台面、边座或围构。
    reason: 说明עֲזָרָה在本处祭坛建筑语境中的技术性不确定。
lexical_decisions:
- source_word: וְלָקַח
  choice: 要取
  rationale: 此处承接礼仪条例中的连续动作，用“要”表达规定性的将来或义务语气，自然且不失原文程序性。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 对应带定冠词的单数名词；汉语无需另加定冠词，仍保留单数角色指称。
- source_word: מִדַּם
  choice: 取些……的血
  rationale: 介词מִן表示从血中取一部分；“取些”比直译“从血中取”更符合现代汉语。
- source_word: הַחַטָּאת
  choice: 赎罪祭牲
  rationale: 在本节中指献祭之物，其血被取用；加“牲”明确这里是祭牲而非抽象的罪，同时保留传统且易懂的“赎罪祭”称谓。
- source_word: וְנָתַן
  choice: 抹在
  rationale: נתן基本义为放置、施加；在把祭血施于建筑部位的礼仪语境中，“抹在”自然明确，又不过度规定具体手法。
- source_word: אֶל מְזוּזַת הַבַּיִת
  choice: 在殿的门柱上
  rationale: מְזוּזָה为门柱；הַבַּיִת在以西结圣殿异象中指殿宇。原文形式为单数，汉语“门柱”可作集合性结构名称，不必擅自改成复数。
- source_word: אַרְבַּע פִּנּוֹת
  choice: 四角
  rationale: פִּנּוֹת通常指角或角隅；原文不是祭坛的“角状突起”专门用词，故不译作“四角翘”。
- source_word: הָעֲזָרָה לַמִּזְבֵּחַ
  choice: 祭坛台座
  rationale: עֲזָרָה在这里最可能指祭坛周围的台面、边座或基座结构；“台座”适合建筑语境，但原词所指的精确构件仍有不确定性，故附注说明。
- source_word: וְעַל מְזוּזַת שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: 以及内院门的门柱上
  rationale: 按原文结构直译为内院之门的门柱；“内院”是圣殿建筑语境中自然、通行的表达。
theological_decisions:
- issue: 献祭语境中חַטָּאת的译法
  choice: 赎罪祭牲
  alternative: 洁净祭牲
  rationale: 该词在献祭条例中可按传统译作“赎罪祭”，也可强调礼仪洁净功能而译作“洁净祭”。正文采用现代中文读者较熟悉的“赎罪祭牲”，脚注保留另一种具有实质意义的理解，避免把词义的礼仪功能单一化。
- issue: 祭血施用动作的表达
  choice: 抹在
  alternative: 放在／涂在
  rationale: “抹在”符合祭血施于门柱和祭坛构件的语境，但不引入超出经文的神学解释。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪条例语体。句式依原文顺序展开，以“要”体现规定性；避免生硬逐词翻译。脚注标记置于全句末尾，使其同时涵盖“赎罪祭牲”和“祭坛台座”两处说明。
