lexical_decisions:
- source_word: מֹאזְנֵי
  choice: 天平
  rationale: 该词为复数或双数构造形式，指称称量器具；“天平”是现代汉语中自然、准确的表达。
- source_word: צֶדֶק
  choice: 公正
  rationale: 该词连续三次修饰天平、伊法和罢特，在商贸与法律语境中强调衡量公平、合乎正直；重复译作“公正”保留原文的修辞与伦理力度。
- source_word: אֵיפַת
  choice: 伊法
  rationale: 这是古代希伯来人的特定干量单位；采用音译以保留原有度量制度，并用脚注说明。
- source_word: בַת
  choice: 罢特
  rationale: 这是古代希伯来人的特定液量单位；采用常见圣经音译，并用脚注说明其用途。
- source_word: יְהִי
  choice: 要有
  rationale: 未完成式在此带指令意味；“要有”既体现规范性要求，也贴近“归你们所有／供你们使用”的原文结构。
- source_word: לָכֶם
  choice: 你们
  rationale: 第二人称阳性复数，指向整个受命群体；在汉语中与“要有”组合即可自然表达。
