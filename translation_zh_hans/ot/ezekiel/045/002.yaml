base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/002.yaml
  text: From this there shall be for the holy place a square of five hundred by five hundred all around[b][a], with fifty cubits of open land for it all around.
translation:
  language: zh_hans
  text: 从这地中，要划出一块归作圣地[a]的区域，五百乘五百，为方形；周围有五十肘的空地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圣所”。这里的“圣地”（קֹדֶשׁ）可以泛指神圣区域，不一定只指圣所建筑本身。
    reason: lexical_alternative
  - marker: b
    text: 或译“牧场”或“公用地”。此词（מִגְרָשׁ）指场所周围划出的开放地带。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/זֶּה
  choice: 从这地中
  rationale: 该短语回指上一节所说的地业，表示从其中划出一部分；补出“地”使现代汉语指代清楚。
- source_word: אֶל הַ/קֹּדֶשׁ
  choice: 归圣地
  rationale: 介词在这里表示用途或归属，并非空间移动；“圣地”保留 קֹדֶשׁ 的神圣区域之义，又不把它限缩为某一座建筑。
- source_word: חֲמֵשׁ מֵאוֹת בַּ/חֲמֵשׁ מֵאוֹת
  choice: 五百乘五百
  rationale: 这是尺寸表达式。原文此处没有明说“肘”，因此正文不擅自补出单位；单位可由本节后半句和上下文得知。
- source_word: מְרֻבָּע סָבִיב
  choice: 四面成方
  rationale: 表达该区域各边构成正方形，兼顾 מְרֻבָּע 的方形含义和 סָבִיב 的周边、四面含义。
- source_word: וַ/חֲמִשִּׁים אַמָּה
  choice: 还要……五十肘
  rationale: 连接词引入附加的尺寸规定；“还要”自然表达其增补关系，“肘”则对应原文明说的 אַמָּה。
- source_word: מִגְרָשׁ
  choice: 空地
  rationale: 该词指场所周围划出的开放地带；“空地”在现代汉语中清楚自然，也避免旧式“郊野”可能造成的距离误解。
- source_word: ל֖/וֹ
  choice: 给它
  rationale: 代词回指圣地或该方形区域，表示这片周边空地是为其保留的。
