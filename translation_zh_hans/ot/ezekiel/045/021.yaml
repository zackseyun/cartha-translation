  text: בָּ֠/רִאשׁוֹן בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֔דֶשׁ יִהְיֶ֥ה לָ/כֶ֖ם הַ/פָּ֑סַח חָ֕ג שְׁבֻע֣וֹת יָמִ֔ים מַצּ֖וֹת יֵאָכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/021.yaml
  text: In the first month[a], on the fourteenth day of the month, you shall have the Passover, a feast of seven days[b]; unleavened bread shall be eaten.
translation:
  language: zh_hans
  text: 正月十四日，你们要守逾越节。这节期为期七天[a]，要吃无酵饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“逾越节，一个七天的节期”。其他经文有时区分逾越节和无酵节，但本节将二者结合起来表达。
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרִאשׁוֹן
  choice: 正月
  rationale: 在历法语境中指第一月；现代汉语以“正月”简洁自然地表达。
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: 十四日
  rationale: 这是希伯来语标准日期表达；与前面的“正月”合并为自然的汉语日期格式。
- source_word: יִהְיֶה לָכֶם
  choice: 你们要守
  rationale: 该结构表示这节期归听众遵守；译为“要守”符合节期语境，也保留指令意味。
- source_word: הַפָּסַח
  choice: 逾越节
  rationale: 采用现代中文圣经语境中通行且准确的节期名称。
- source_word: חָג
  choice: 这节期
  rationale: חָג指宗教节庆；用“这节期”承接“逾越节”，在现代汉语中自然清楚。
- source_word: שְׁבֻעוֹת יָמִים
  choice: 为期七天
  rationale: 该表达字面近于“日子的一个七数”，在此指七天的期限；“为期七天”准确表达持续时间。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 指未发酵的饼；“无酵饼”是准确且通行的中文表达。
- source_word: יֵאָכֵל
  choice: 要吃
  rationale: 原文是尼法勒未完成式，形式上为被动“要被吃”；中文节期规定通常用主动泛指表达，语义不变且更自然。
theological_decisions:
- issue: 逾越节与七日节期的关系
  choice: 将“这节期为期七天”紧接“逾越节”，保留原文把二者结合呈现的方式。
  alternative: 明确区分逾越节当日与随后七天的无酵节。
  rationale: 希伯来文以同位结构说“逾越节，一个七天的节期”，本节将二者合在一起表达；译文不借其他经文强行作更严格的区分。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“正月十四日”符合中文日期习惯；“你们要守”体现礼仪规定的指令语气。脚注说明原文同位结构及其保留的张力。
