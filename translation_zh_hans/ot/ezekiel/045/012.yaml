base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/012.yaml
  text: And the shekel shall be twenty gerahs[a]; twenty shekels, twenty-five shekels[b], and fifteen shekels shall be your mina.
translation:
  language: zh_hans
  text: 一舍客勒应为二十季拉；二十舍客勒、二十五舍客勒和十五舍客勒，应作为你们的弥那[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文逐项列出“二十舍客勒、二十五舍客勒和十五舍客勒”，总计六十舍客勒。这与古代其他弥那计量标准不同，可能是以西结圣殿条例所采用的特定标准。
    reason: cultural_note
  - marker: b
    text: “弥那”也音译作“玛内”，是古代较大的重量单位，也可用作货币计量单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁקֶל
  choice: 舍客勒
  rationale: 采用这一古代重量兼货币单位的通行音译；定冠词在汉语中不必机械译出，而“要按……计算”表明这是规定的标准。
- source_word: גֵּרָה
  choice: 季拉
  rationale: 保留古代最小重量单位的音译，不换算成现代单位，以免造成虚假的精确对应。
- source_word: שְׁקָלִים / שֶׁקֶל
  choice: 舍客勒
  rationale: 复数与数词搭配时，现代汉语无需改变词形；末项希伯来文使用单数形式，也按汉语习惯译为“十五舍客勒”。
- source_word: חֲמִשָּׁה וְעֶשְׂרִים
  choice: 二十五
  rationale: 按现代汉语的自然数词顺序表达。
- source_word: עֲשָׂרָה וַחֲמִשָּׁה
  choice: 十五
  rationale: 按现代汉语的自然数词顺序表达。
- source_word: הַמָּנֶה
  choice: 弥那
  rationale: 采用较大重量兼货币单位的通行音译，并以脚注说明其性质。
- source_word: יִהְיֶה לָכֶם
  choice: 合为你们的一弥那
  rationale: 既表达三个数额合计构成一弥那，也保留לָכֶם所表示的、适用于受话者的规定标准。
