  source_fidelity: 需作小幅修订。כָל זֹנוֹת明确指“所有/每个妓女”，草稿的“人都给妓女嫖资”虽表达一般惯例，却未充分呈现该量词。“与你行淫”可表达本节的淫乱隐喻，但应将“从四面八方来到你这里”与其目的关系表述得更清楚。
  naturalness: “嫖资”在现代汉语中可懂，但较口语化且容易将重点限于嫖客支付的价钱；“报酬”更适合本句对一般妓女所得与耶路撒冷反而馈赠、收买情人的对比。修订后保持现代、直接而庄重的先知语体。
  terminology: 保留“妓女”“情人”“贿赂”“行淫”，这些词忠实保留本节婚姻不忠／性交易的尖锐比喻，且不将其具体化为某一种偶像崇拜或政治关系。
