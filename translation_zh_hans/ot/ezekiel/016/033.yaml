  text: לְ/כָל זֹנ֖וֹת יִתְּנוּ נֵ֑דֶה וְ/אַ֨תְּ נָתַ֤תְּ אֶת נְדָנַ֨יִ/ךְ֙ לְ/כָל מְאַֽהֲבַ֔יִ/ךְ וַ/תִּשְׁחֳדִ֣י אוֹתָ֗/ם לָ/ב֥וֹא אֵלַ֛יִ/ךְ מִ/סָּבִ֖יב בְּ/תַזְנוּתָֽיִ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/033.yaml
  text: Men give a prostitute her payment, but you gave your gifts to all your lovers, and you bribed them to come to you from all around for your prostitutions.
translation:
  language: zh_hans
  text: 所有妓女都有人给她们报酬，你却把礼物给了你所有的情人，又贿赂他们从四面八方来到你这里，与你行淫。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵדֶה
  choice: 嫖资
  rationale: 此词在本节与妓女所得的报酬有关；译作“嫖资”能以现代汉语简洁表达性交易的付款，并与下半节反常的倒付礼物形成鲜明对比。
- source_word: נְדָנַיִךְ
  choice: 礼物
  rationale: 该词指女子所赠之物或馈赠；上下文强调耶路撒冷反而给情人财物，因此采用范围较宽且自然的“礼物”。
- source_word: מְאַהֲבַיִךְ
  choice: 情人
  rationale: 在婚姻与淫乱的比喻语境中，指与她发生不贞关系的对象；“情人”保留关系性及讽刺意味。
- source_word: וַתִּשְׁחֳדִי
  choice: 贿赂
  rationale: 希伯来语明确含收买、行贿之意，凸显她付钱招徕对方的反常行为。
- source_word: בְּתַזְנוּתָיִךְ
  choice: 与你行淫
  rationale: 复数形式可表示反复或多次的淫乱行为；汉语用动词结构更自然，并保留比喻的强烈措辞。
theological_decisions:
- issue: 淫乱比喻是否具体化为偶像崇拜或政治结盟
  choice: 保留“行淫”的原比喻，不在正文中具体解释
  alternative: 译为“参与你的偶像崇拜”或“与你结盟”
  rationale: 本节原文维持性与婚姻不忠的比喻表达；直接具体化会消除其可同时指向宗教和政治不忠的张力。
- issue: 主语 כָל זֹנוֹת 与隐含施事的表达
  choice: 译为“人都给妓女嫖资”
  alternative: 译为“所有妓女都有人付钱”
  rationale: 原文以“所有妓女”为受款对象，动词为无特定主语的复数形式；此译自然表达一般惯例，同时不把施事限定为某一群体。
translation_notes:
  register: 采用现代、庄重而直接的叙述。保留先知话语中刻意尖锐的“妓女”“嫖资”“行淫”，不以委婉语削弱责备；用“从四面八方”自然呈现 מִסָּבִיב。
