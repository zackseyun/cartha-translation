  text: בִּ/בְנוֹתַ֤יִ/ךְ גַּבֵּ/ךְ֙ בְּ/רֹ֣אשׁ כָּל דֶּ֔רֶךְ וְ/רָמָתֵ֥/ךְ עשיתי בְּ/כָל רְח֑וֹב וְ/לֹא הייתי כַּ/זּוֹנָ֖ה לְ/קַלֵּ֥ס אֶתְנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/031.yaml
  text: When you built your mound at the head of every road and made your high place in every square[a], you were not like a prostitute[c][b], in that you scorned payment.
translation:
  language: zh_hans
  text: 你在各条道路的起头筑起高台，在每个广场建造高处[a]；你却不像妓女[b]，因为你轻看妓女的酬金。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高处”也可译作“高台”或“高起的房室”；希伯来语所指的具体建筑形制不确定，是与本章卖淫意象相关的高起场所。
    reason: lexical_alternative
  - marker: b
    text: 意思是：她不像普通妓女那样收取酬金；下文说明，她反倒送礼给情人。
    reason: cross_reference
lexical_decisions:
- source_word: בִּבְנוֹתַיִךְ
  choice: 你……筑起
  rationale: 介词 בְּ 加不定式构造在此引出伴随或时间情境；汉语以连续动作表达，比直译“当你建造时”更自然。
- source_word: גַּבֵּךְ
  choice: 高台
  rationale: 该词在本章指与淫乱比喻相关的高起建筑；“高台”保留其升高、公开的空间形象，同时避免断定具体建筑形制。
- source_word: בְּרֹאשׁ כָּל־דֶּרֶךְ
  choice: 在每条路口
  rationale: 字面为“在每条路的头部”；现代汉语“路口”自然表达道路起点或交会处的显眼公共位置。
- source_word: וְרָמָתֵךְ
  choice: 高处
  rationale: רָמָה 在这里可能指高起的平台或祭祀场所；采用圣经语境中自然的“高处”，保留其空间及宗教含义。
- source_word: בְּכָל רְחוֹב
  choice: 在每个广场
  rationale: רְחוֹב 通常指宽阔的公共空间或广场，不只是狭窄街道。
- source_word: וְלֹא הָיִית כַּזּוֹנָה
  choice: 你却不像妓女
  rationale: 保留 כ 所表达的明确比较和原文刻意造成的反常张力；“却”凸显与普通妓女的对比。
- source_word: לְקַלֵּס
  choice: 因为你轻看
  rationale: 该不定式说明她在哪一点上不像普通妓女，含轻蔑、不屑之意；“轻看”既简洁又保留评价色彩。
- source_word: אֶתְנָן
  choice: 嫖资
  rationale: 该词特指娼妓所得的酬金；“嫖资”比泛称“报酬”更准确地维持本节的性交易意象。
theological_decisions:
- issue: 以卖淫比喻耶路撒冷的不忠
  choice: 直接保留“妓女”和“嫖资”的性化比喻
  alternative: 译作“淫妇／不忠的女子”和“报酬”，或改写为偶像崇拜
  rationale: 本章刻意采用尖锐、令人震撼的卖淫意象来控诉耶路撒冷；淡化为纯宗教术语会削弱先知言辞的力度。
- issue: 末句与“不像妓女”的关系
  choice: 译作“因为你轻看嫖资”
  alternative: 译作“你不像索取嫖资的妓女”或“你不收取嫖资”
  rationale: 原文以不定式说明其不同之处，重点是她轻蔑妓女通常所得的酬金；后文进一步说明她反而送礼。此译法保留反讽，也不把后文信息全部提前写入。
translation_notes:
  register: 采用现代、庄重而直白的普通话。保留先知原有的强烈性意象及反讽。“路口”自然呈现“每条路的头部”，“高台／高处”则避免过度确定两种罕见建筑用语的具体形制。
