base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/051.yaml
  text: And Samaria did not sin half as much as you; you multiplied your abominations more than they[a], and by all your abominations that you committed, you made your sisters appear righteous.
translation:
  language: zh_hans
  text: 撒玛利亚犯罪还不到你所犯之罪的一半；你所行的可憎之事比她们更多，并且因你所行的这一切可憎之事，你使你的姐妹显得为义。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你使你的姐妹为义。”这里的意思是：耶路撒冷的恶行更为严重，使她的姐妹相形之下显得为义。
    reason: 保留希伯来语较直译的表达，并说明其在上下文中的比较意义。
lexical_decisions:
- source_word: שֹׁמְרוֹן
  choice: 撒玛利亚
  rationale: 标准中文地名；本节将城人格化，并以她代表北国。
- source_word: כַּחֲצִי חַטֹּאתַיִךְ לֹא חָטָאָה
  choice: 所犯的罪，还不到你的一半
  rationale: 保留“罪”这一明说的名词，并以自然汉语表达否定性的半数比较。
- source_word: וַתַּרְבִּי אֶת־תּוֹעֲבוֹתַיִךְ מֵהֵנָּה
  choice: 你所行的可憎之事比她们更多
  rationale: רבה 表示数量增多；תועבה 在以西结书中带有强烈的道德和宗教谴责意味。“她们”按上下文指撒玛利亚和所多玛。
- source_word: וַתְּצַדְּקִי אֶת־אֲחוֹתַיִךְ
  choice: 你使你的姐妹显得为义
  rationale: צדק 的使役性用法在此表达比较效果：耶路撒冷罪恶更甚，因而使姐妹相形之下显得为义；“显得”避免误解为真正宣告无罪。
- source_word: בְּכָל־תּוֹעֲבוֹתַיִךְ אֲשֶׁר עָשִׂית
  choice: 因你所行的这一切可憎之事
  rationale: 将 ב 理解为手段或原因；按语境采用第二人称阴性单数“你所行的”，修饰全部可憎行为。
theological_decisions:
- issue: “使你的姐妹为义”的含义
  choice: 表达比较之下显得为义，而非实际蒙宣告无罪
  alternative: 直译为“你称你的姐妹为义”或“你使你的姐妹为义”
  rationale: 上下文以反讽性的比较谴责耶路撒冷：她的恶行更重，使撒玛利亚和所多玛相形之下仿佛为义。译文既保留“为义”的司法色彩，又用“显得”说明这种比较关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“可憎之事”保留先知话语的强烈谴责；“姐妹”延续本章把撒玛利亚和所多玛人格化为耶路撒冷姐妹的比喻。
