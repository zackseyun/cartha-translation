  yaml_path: translation/ot/ezekiel/016/018.yaml
  text: You took your embroidered garments and covered them[a], and you set my oil and my incense before them.
translation:
  language: zh_hans
  text: 你拿了你有刺绣的衣服，遮盖它们[a]，又把我的油和香摆在它们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“给它们穿上这些衣服。”希伯来语动词的基本意思是“遮盖”；在这里也可能指用这些衣服装扮偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי רִקְמָתֵךְ
  choice: 绣花的衣服
  rationale: בֶּגֶד 指衣服、衣裳；רִקְמָה 指刺绣或精工织成的华美布料。“绣花的衣服”自然易懂，也保留其华美意味。
- source_word: וַתְּכַסִּים
  choice: 盖在它们身上
  rationale: כסה 的基本义是“遮盖”。加上“身上”使现代汉语自然，同时不直接把动作限定为“给偶像穿衣”。
- source_word: וְשַׁמְנִי
  choice: 我的油
  rationale: שֶׁמֶן 泛指油，在以色列背景中常为橄榄油，但本句没有明说，因此不增译为“橄榄油”。
- source_word: וּקְטָרְתִּי
  choice: 我的香
  rationale: קְטֹרֶת 指献祭礼仪中焚烧的香；“香”是现代汉语圣经语境中简洁、准确的表达。
- source_word: נתתי לִפְנֵיהֶם
  choice: 摆在它们面前
  rationale: 结合上下文，该动词表达把油和香放置于这些对象面前；“摆在……面前”既自然，也传达供奉场景，而不额外加入“献给”。
- source_word: לִפְנֵיהֶם
  choice: 在它们面前
  rationale: לִפְנֵי 的基本义为“在……面前”；保留第三人称复数代词，让上下文说明其所指。
theological_decisions:
- issue: 阳性复数后缀“它们”的所指
  choice: 保留“它们”，由上下文指向前文所述的偶像或像
  alternative: 直接译成“偶像”
  rationale: 上下文清楚指向偶像，但希伯来文本本节只用代词。保留代词既忠于形式，也避免把解释直接写入正文。
- issue: 油和香的处置是否明确称为献祭
  choice: 译为“摆在它们面前”
  alternative: 译为“献在它们面前”
  rationale: 语境具有供奉含义，但原文动作本身主要是放置；正文保留这一表达，让献祭意味由上下文呈现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“绣花的衣服”“盖在它们身上”“摆在它们面前”保持叙述流畅；不把代词明译为“偶像”，也不把“油”具体化为橄榄油。
