base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/039.yaml
  text: I will give you into their hand[a], and they will tear down your vaulted chamber and demolish your high places. They will strip you of your clothes, take your beautiful jewelry[b], and leave you naked and bare.
translation:
  language: zh_hans
  text: 我必把你交在他们手中；他们要拆毁你的拱顶建筑[a]，毁掉你的高台；他们要剥去你的衣服，夺走你华美的饰物[b]，使你赤身裸体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拱顶建筑”所译的希伯来词十分罕见，也可理解为“土台”“神龛”或“拱形建筑”，可能指本章非法敬拜意象中的一种建筑设施。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你华美的物件”或“你华丽的装饰品”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָךְ בְּיָדָם
  choice: 我必把你交在他们手中
  rationale: 保留“在他们手中”的希伯来意象，同时自然表达被交付于他人权势之下的审判含义。
- source_word: וְהָרְסוּ
  choice: 拆毁
  rationale: 该动词常指拆除或毁坏建筑物；“拆毁”与后面的建筑性宾语相配。
- source_word: גַּבֵּךְ
  choice: 你的拱台
  rationale: 此词罕见，在本章语境中很可能指与非法敬拜及淫乱意象有关的某种建筑设施；“拱台”保留建筑色彩，又避免把具体形制说得过于确定。
- source_word: וְנִתְּצוּ רָמֹתַיִךְ
  choice: 毁掉你的高台
  rationale: נתץ表示猛烈拆毁；רמות在先知文献中通常指祭祀用的高台。“高台”是清楚且惯用的对应词。
- source_word: וְהִפְשִׁיטוּ אוֹתָךְ בְּגָדָיִךְ
  choice: 他们要剥去你的衣服
  rationale: 准确传达强行除去衣物及公开羞辱的具体意象，中文简洁自然。
- source_word: וְלָקְחוּ כְּלֵי תִפְאַרְתֵּךְ
  choice: 夺走你华美的饰物
  rationale: כלי可指器物、物件；结合本章先前所述的装饰品，“饰物”最合语境。“夺走”体现敌对掠取，תפארת译为“华美的”。
- source_word: וְהִנִּיחוּךְ עֵירֹם וְעֶרְיָה
  choice: 使你赤身裸体
  rationale: הניח在此表示让某人留在某种状态；希伯来文两个近义词叠用，加强完全裸露的含义。汉语成语“赤身裸体”自然保留这种强化效果。
theological_decisions:
- issue: 以淫妇喻耶路撒冷的身体羞辱与祭祀建筑意象
  choice: 保留拆毁建筑、剥去衣服和赤裸的具体意象
  alternative: 概括译为耶路撒冷将遭毁灭和羞辱
  rationale: 原文借延续性的女性拟人和祭祀意象揭露耶路撒冷的偶像崇拜与背约；直陈这些具体图像可保存先知话语的力度，不以抽象解释取代经文本身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“交在他们手中”保留原文习语；“拱台”配脚注呈现罕见词的不确定性；“赤身裸体”以自然汉语重现原文近义复表达成的强化。
