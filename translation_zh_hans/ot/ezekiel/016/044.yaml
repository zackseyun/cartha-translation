    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意的提示作用；“看哪”庄重而简明，也符合现代中文圣经语体。
- source_word: כָּל הַמֹּשֵׁל
  choice: 凡拿你来说俗语的
  rationale: 分词与“凡”搭配，表达“每一个这样的人”；משל在此指说或引用俗语，并非“统治”。
- source_word: עָלַיִךְ
  choice: 拿你来说
  rationale: על在此标明俗语所针对或谈论的对象；“拿你来说”自然地表达“以你为话题”，同时与上下文的贬斥意味相容，却不把敌意强加给介词本身。
- source_word: יִמְשֹׁל לֵאמֹר
  choice: 都要用这句俗语说
  rationale: 再次出现的משל仍取“说／使用俗语”义；“这句”根据紧随其后的俗语内容补出，使中文通顺。
- source_word: כְאִמָּה בִּתָּהּ
  choice: 有其母，必有其女
  rationale: 采用简洁有力的汉语俗语形式，传达原文“母亲怎样，女儿也怎样”的对应关系与讽刺力度。
