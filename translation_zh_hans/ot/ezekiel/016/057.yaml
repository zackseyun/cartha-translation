  text: בְּ/טֶרֶם֮ תִּגָּלֶ֣ה רָעָתֵ/ךְ֒ כְּמ֗וֹ עֵ֚ת חֶרְפַּ֣ת בְּנוֹת אֲרָ֔ם וְ/כָל סְבִיבוֹתֶ֖י/הָ בְּנ֣וֹת פְּלִשְׁתִּ֑ים הַ/שָּׁאט֥וֹת אוֹתָ֖/ךְ מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/057.yaml
  text: before your wickedness was uncovered[a], as at the time of the reproach of the daughters of Aram and all those around her, the daughters of the Philistines[c][b], who despise you from every side.
translation:
  language: zh_hans
  text: 在你的恶行暴露[a]以前，正如你受亚兰的众女儿[b]、她周围所有的人，以及非利士人的众女儿[c]羞辱的时候一样；非利士人的众女儿从四面八方藐视你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暴露”也可译作“显露”或“揭露”。
    reason: lexical_alternative
  - marker: b
    text: “亚兰”传统上也译作“叙利亚”。原文直译为“亚兰的众女儿”。
    reason: alternative_reading
  - marker: c
    text: “非利士人的众女儿”是希伯来语习语，可指非利士的民众或城邑；同类表达也见于本节的“亚兰的众女儿”。
    reason: cultural_note
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: 在……以前
  rationale: 准确表达时间上的先后关系，并自然引出“恶行暴露”这一从句。
- source_word: תִּגָּלֶה
  choice: 暴露
  rationale: 该词为גלה的尼法勒形态，表示被揭开、显露于众；“暴露”保留公开显明及蒙羞的语境。
- source_word: רָעָתֵךְ
  choice: 你的恶行
  rationale: 此处指耶路撒冷在道德上的邪恶行为；“恶行”既表达伦理罪责，也比抽象的“邪恶”更符合现代汉语。
- source_word: כְּמוֹ עֵת
  choice: 正如……的时候一样
  rationale: 保留原文比较兼时间的结构，也不擅自补足本节与上文之间略显悬接的句法。
- source_word: חֶרְפַּת
  choice: 受……羞辱
  rationale: חרפה可指羞耻、辱骂或责难；按上下文将其表达为来自周边群体的公开羞辱，同时保留蒙羞和受蔑视的意味。
- source_word: בְּנוֹת אֲרָם
  choice: 亚兰的众女儿
  rationale: 保留希伯来语“女儿们”的群体性比喻和“亚兰”这一历史名称，不直接扁平化为“叙利亚人”或“亚兰诸城”。
- source_word: וְכָל סְבִיבוֹתֶיהָ
  choice: 和她周围所有的人
  rationale: 阴性单数后缀最自然地回指亚兰；原文的“周围”在汉语中补出所指的人群，使表达清楚而不过度具体化。
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: 非利士人的众女儿
  rationale: 保留“女儿们”指群体或所属城邑的希伯来习语，并按辅音文本译出“非利士人”。
- source_word: הַשָּׁאטוֹת
  choice: 藐视你
  rationale: 该分词表达持续的轻蔑和鄙弃；“藐视”比“嘲笑”更完整地传达其态度含义。
- source_word: מִסָּבִיב
  choice: 从四面八方
  rationale: 自然表达敌意环绕而来的加强语气。
theological_decisions: []
