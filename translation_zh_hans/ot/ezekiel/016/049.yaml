source:
  edition: WLC
  text: הִנֵּה זֶ֣ה הָיָ֔ה עֲוֺ֖ן סְדֹ֣ם אֲחוֹתֵ֑/ךְ גָּא֨וֹן שִׂבְעַת לֶ֜חֶם וְ/שַׁלְוַ֣ת הַשְׁקֵ֗ט הָ֤יָה לָ/הּ֙ וְ/לִ/בְנוֹתֶ֔י/הָ וְ/יַד עָנִ֥י וְ/אֶבְי֖וֹן לֹ֥א הֶחֱזִֽיקָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/049.yaml
  text: 'Look[a], this was the guilt of your sister Sodom: pride, fullness of bread, and prosperous ease belonged to her and to her daughters[c][b], but she did not strengthen the hand of the poor and needy.'
translation:
  language: zh_hans
  text: 看哪[a]，你姊妹所多玛的罪孽在于：她和她的众城[b]骄傲，食物丰足，安逸无忧；她却没有扶持贫穷困苦的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”用来引起注意，并强调下文的说明。
    reason: discourse_note
  - marker: b
    text: 原文直译为“她的女儿们”，指与所多玛相关或隶属于她的城镇。
    reason: cultural_note
  - marker: c
    text: 原文直译为“没有使贫穷困苦者的手坚强”，意思是没有支持或帮助他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה זֶה
  choice: 看哪……就是这样
  rationale: 保留原文引人注意并着重说明的语气，同时采用现代中文仍能自然理解的庄重表达。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: 此词可指罪责、罪恶或应受追究的过犯；本节随后列举所多玛的恶行，用“罪孽”兼顾行为及其罪责。
- source_word: אֲחוֹתֵךְ
  choice: 你姊妹
  rationale: 保留以城市为女性亲属的明确比喻，这是本章将耶路撒冷与所多玛相比较的重要表达。
- source_word: גָּאוֹן
  choice: 骄傲
  rationale: 在此指负面的自高与傲慢；“骄傲”直接、自然，适合罪行清单的语境。
- source_word: שִׂבְעַת לֶחֶם
  choice: 食物丰足
  rationale: 原文直译为“饼的饱足”，实指粮食充裕；“食物丰足”既传达物质富足，又避免现代读者误解为只拥有大量面饼。
- source_word: שַׁלְוַת הַשְׁקֵט
  choice: 安逸无忧
  rationale: 该短语兼有安适、平静和不受搅扰之意；在上下文中也带出富足中的安逸状态，而不额外加入原文未明说的定罪词。
- source_word: בְנוֹתֶיהָ
  choice: 她的众城
  rationale: 字面为“她的女儿们”，先知书的城市拟人语言中指附属城镇；正文以“众城”清楚传意，并用脚注保留原有比喻。
- source_word: יָד ... לֹא הֶחֱזִיקָה
  choice: 没有扶持
  rationale: 希伯来语字面为“没有使……的手坚强”，是帮助、支持的惯用语；“扶持”在中文中自然，也部分保留原文的形象。
- source_word: עָנִי וְאֶבְיוֹן
  choice: 贫穷困苦的人
  rationale: 这一常见词组指贫穷、匮乏且处境弱势的人；译文保留两个近义成分所形成的强调。
theological_decisions:
- issue: 本节如何描述所多玛的罪
  choice: 照原文列出骄傲、食物丰足、安逸无忧，以及不扶持贫穷困苦者等社会与道德罪行。
  alternative: 在译文中借暗示突出其他关于所多玛之罪的后世解释。
  rationale: 本节明确点出的正是傲慢、富足安逸和忽视弱势者；翻译不应缩窄、扩展或以其他神学争论取代经文本身的陈述。
- issue: “女儿们”的城市比喻
  choice: 正文译作“众城”，脚注说明原文为“女儿们”。
  alternative: 正文直译为“女儿们”。
  rationale: “众城”使普通现代读者立即明白这是所多玛所属或相关的城镇，而脚注保留原文拟人化的亲属意象，避免误读为实际女性后代。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留先知话语的强调语气；其余措辞避免过度古雅。“你姊妹”保留本章的城市亲属比喻，“众城”则优先保障当代读者的清晰理解。
