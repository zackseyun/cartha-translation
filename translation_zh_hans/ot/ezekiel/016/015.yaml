  text: וַ/תִּבְטְחִ֣י בְ/יָפְיֵ֔/ךְ וַ/תִּזְנִ֖י עַל שְׁמֵ֑/ךְ וַ/תִּשְׁפְּכִ֧י אֶת תַּזְנוּתַ֛יִ/ךְ עַל כָּל עוֹבֵ֖ר ל/וֹ יֶֽהִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/015.yaml
  text: But you trusted in your beauty[a], and you prostituted yourself because of your name, and you poured out your prostitutions on every passerby[b]; they became his.
translation:
  language: zh_hans
  text: 可是，你倚仗自己的美貌，凭着自己的名声行淫；你向每一个过路的人倾倒你的淫行，都归他所有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句希伯来文十分简短，直译近于“归他所有”或“为他而有”。所指可能是她所倾倒的淫行，也可能更宽泛地指她所交付的一切。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְטְחִי בְיָפְיֵךְ
  choice: 你倚仗自己的美貌
  rationale: בטח 与介词 ב 表示信赖、倚靠；“倚仗”自然地传达因自身美貌而产生错误依恃的责备语气。
- source_word: וַתִּזְנִי
  choice: 行淫
  rationale: זנה 在本章的先知性比喻中明确保留卖淫和盟约不忠的双重意象；不淡化为仅仅“背信”。
- source_word: עַל שְׁמֵךְ
  choice: 凭着自己的名声
  rationale: שֵׁם 字面为“名”，在上下文中指因美貌所得的名声或声望；中文“名声”比“名字”更准确且自然。
- source_word: וַתִּשְׁפְּכִי אֶת תַּזְנוּתַיִךְ
  choice: 你……倾倒你的淫行
  rationale: 保留 שׁפך“倾倒”的强烈具体意象；תַּזְנוּתַיִךְ 为复数形式，指反复的淫乱行为，译作“淫行”兼顾简洁与可读性。
- source_word: עַל כָּל עוֹבֵר
  choice: 向每一个过路的人
  rationale: 按语境表达毫无选择地把淫行给予每个过客；中文以“向”承接“倾倒”较自然。
- source_word: לוֹ יֶהִי
  choice: 任他占有
  rationale: 希伯来语末句极其简短，直译近于“归他所有／任他得着”；此译保留交付给每个过客的含义，同时在脚注注明其歧义。
theological_decisions:
- issue: 以性交易比喻耶路撒冷在盟约上的不忠
  choice: 正文保留明确的“行淫／淫行”意象
  alternative: 弱化为“背信”或“对我不忠”
  rationale: 原文刻意使用露骨的性意象，同时指向偶像崇拜与政治不忠；译文不把比喻直接解释成抽象神学陈述。
- issue: לוֹ יֶהִי 的所指与语气
  choice: 译为“任他占有”，并以脚注保存字面形式和解释空间
  alternative: “就归他所有”或“都成了他的”
  rationale: 原文未明说被占有的究竟是她的淫行、美貌还是她自己，且动词形式简短突兀；正文应可读，但不可无声地限定唯一所指。
translation_notes:
  register: 采用现代、庄重而直接的普通话。保留以“倾倒”表达的先知性强烈意象，并保留原文露骨的“行淫”措辞；避免古奥的“倚恃姿色”以及过度解释性的盟约术语。
