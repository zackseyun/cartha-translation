base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/055.yaml
  text: And your sisters[a], Sodom and her daughters, will return to their former state, and Samaria and her daughters will return to their former state, and you and your daughters will return to your former state.
translation:
  language: zh_hans
  text: 你的姐妹所多玛和她的女儿们，必回到从前的境况；撒玛利亚和她的女儿们，必回到从前的境况；你和你的女儿们，也必回到从前的境况。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחוֹתַיִךְ
  choice: 你的姐妹
  rationale: 保留城市被拟人化为姐妹的亲属比喻，不改写为解释性的“姐妹城”。
- source_word: סְדֹם
  choice: 所多玛
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: בְנוֹתֶיהָ / בְנוֹתַיִךְ
  choice: 她的众女儿 / 你的众女儿
  rationale: 原文直译为“女儿”，在先知书语境中可指附属城镇或群体；保留该词可延续本章城市拟人化及亲属关系的意象。
- source_word: תָּשֹׁבְנָה / תְּשֻׁבֶינָה
  choice: 必回到
  rationale: שוב的基本义是“返回、回到”；如此翻译既保留三小句的重复结构，也不把经文的恢复含义解释得过满。
- source_word: לְקַדְמָתָן / לְקַדְמַתְכֶן
  choice: 从前的境况
  rationale: 该表达指较早、原先的状态；“从前的境况”在现代中文中自然，同时保留其所指状态的开放性。
- source_word: וְ
  choice: 和 / 也 / 同样
  rationale: 按中文并列句的自然表达处理连接词，并借“也、同样”显明原文三个平行分句的对应关系，不增添时间先后含义。
- source_word: שֹׁמְרוֹן
  choice: 撒玛利亚
  rationale: 采用现代中文圣经传统中通行的地名译法。
theological_decisions:
- issue: 所多玛、撒玛利亚和耶路撒冷所经历之逆转的性质
  choice: 译作“回到从前的境况”，不说明其实现机制或更广泛的神学含义。
  alternative: 较具解释性地译作“恢复到从前的境况”。
  rationale: 原文以“回到”及“从前的境况”陈述逆转或恢复。鉴于所多玛得恢复的神学含义存在争议，译文保留原文措辞及张力，不代替经文作进一步裁定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“姐妹—女儿”的城市拟人化意象，并用三个平行分句重现希伯来文的反复结构。未添加脚注，因为正文已能自然保留原文的字面表达与语义开放性。
