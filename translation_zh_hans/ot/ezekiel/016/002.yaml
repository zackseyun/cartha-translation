  yaml_path: translation/ot/ezekiel/016/002.yaml
  text: Son of man[a], make known to Jerusalem her abominations.
translation:
  language: zh_hans
  text: “人子啊，你要使耶路撒冷知道她的那些可憎之事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 直译为“人之子”，在《以西结书》中是上帝反复用来称呼先知的称谓；“人子”既保留原文形式，也符合现代中文圣经语体。
- source_word: הוֹדַע
  choice: 使……知道
  rationale: 这是ידע的使役式命令，表达“使其知道”的意思；此译法保留使役语气，也对应原文的双宾语结构。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文通行的地名译法。
- source_word: תּוֹעֲבֹתֶיהָ
  choice: 她那些可憎之事
  rationale: תּוֹעֵבָה指令人厌恶、可憎的事，在先知书中常带有强烈的盟约、宗教和道德意味；“可憎之事”保留其力度，复数含义由“那些”表达，阴性单数后缀译作“她”。
theological_decisions:
- issue: 耶路撒冷的女性人格化
  choice: 译作“她那些可憎之事”
  alternative: “它那些可憎之事”
  rationale: 原文采用阴性单数后缀，并在本章中持续把耶路撒冷人格化为女子；译作“她”可保留随后寓喻叙事的文学铺垫。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人子啊”保留先知书中的固定称谓；“使……知道”略带正式色彩，但准确体现希伯来语使役命令，并避免把命令弱化为一般性的“告诉”。
