- from: 所以，看哪，我要聚集你所有的情人，就是那些让你得到欢愉的人[a]；我要把所有你爱过的人，连同所有你恨过的人，全都从四面八方聚集来攻击你[b]。我要当着他们使你赤身露体[c]，他们就会看见你全身赤裸。
  to: 所以，看哪，我要聚集你所有的情人，就是你所喜悦的；也要聚集所有你所爱的，连同所有你所恨的。我必从四面八方把他们聚集来攻击你[b]；我要在他们面前揭露你的赤身露体[c]，他们必看见你一切的赤身露体。
