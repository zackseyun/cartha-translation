id: EZK.16.37
reference: Ezekiel 16:37
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ֠/כֵן הִנְ/נִ֨י מְקַבֵּ֤ץ אֶת כָּל מְאַהֲבַ֨יִ/ךְ֙ אֲשֶׁ֣ר עָרַ֣בְתְּ עֲלֵי/הֶ֔ם וְ/אֵת֙ כָּל אֲשֶׁ֣ר אָהַ֔בְתְּ עַ֖ל כָּל אֲשֶׁ֣ר שָׂנֵ֑את וְ/קִבַּצְתִּי֩ אֹתָ֨/ם עָלַ֜יִ/ךְ מִ/סָּבִ֗יב וְ/גִלֵּיתִ֤י עֶרְוָתֵ/ךְ֙ אֲלֵ/הֶ֔ם וְ/רָא֖וּ אֶת כָּל עֶרְוָתֵֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/037.yaml
  text: Therefore[a], behold, I am gathering all your lovers with whom you found pleasure, and all whom you loved, along with all whom you hated; and I will gather them against you from every side, and I will uncover your nakedness to them[c][b], and they will see all your nakedness.
translation:
  language: zh_hans
  text: 所以，看哪，我要聚集你所有的情人，就是你所喜悦的；也要聚集所有你所爱的，连同所有你所恨的。我必从四面八方把他们聚集来攻击你[b]；我要在他们面前揭露你的赤身露体[c]，他们必看见你一切的赤身露体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 这里包括她非法交往的各类对象，也包括她的仇敌；他们都被召来面对这审判。
    reason: cultural_note
  - marker: c
    text: “揭露你的赤身露体”是先知书中表示公开揭露、羞辱的审判用语。
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 这是承接前文指控、引出审判后果的推论词；“所以”在现代汉语中自然，同时保留先知宣告的司法语气。
- source_word: הִנְנִי מְקַבֵּץ
  choice: 看哪，我要聚集
  rationale: הִנְנִי 与分词连用，强调行动迫近且确定；“看哪”保留庄严的宣告语气，“我要聚集”比直译成进行体更符合现代汉语。
- source_word: מְאַהֲבַיִךְ
  choice: 你所有的情人
  rationale: 本章以婚姻和性关系比喻耶路撒冷的不忠；“情人”保留非法亲密关系的指控色彩，不将其抽象化为政治盟友。
- source_word: אֲשֶׁר עָרַבְתְּ עֲלֵיהֶם
  choice: 那些让你得到欢愉的人
  rationale: ערב 在这里涉及愉悦、欢喜；此译符合关系语境，并保留原文可能具有的性爱意味。
- source_word: וְאֵת כָּל אֲשֶׁר אָהַבְתְּ עַל כָּל אֲשֶׁר שָׂנֵאת
  choice: 所有你爱过的人，连同所有你恨过的人
  rationale: 保留“爱”与“恨”的鲜明对照，并把介词短语按包举关系处理，表明两类人都包括在内。
- source_word: וְקִבַּצְתִּי אֹתָם עָלַיִךְ מִסָּבִיב
  choice: 把他们全都从四面八方聚集来攻击你
  rationale: 在审判语境中，עָלַיִךְ 表示敌对方向，故译为“攻击你”；מִסָּבִיב 译为自然的“四面八方”。
- source_word: וְגִלֵּיתִי עֶרְוָתֵךְ אֲלֵהֶם
  choice: 我要当着他们使你赤身露体
  rationale: 以自然汉语表达公开剥露身体的审判图像；“当着他们”传达 אֲלֵהֶם 在此处的公开展示含义。
- source_word: וְרָאוּ אֶת כָּל עֶרְוָתֵךְ
  choice: 他们就会看见你全身赤裸
  rationale: 保留原文对“裸露”的重复及 כָּל 的完整、彻底意味，同时避免生硬的“看见你所有的赤裸”。
theological_decisions:
- issue: 以性羞辱图像描述耶路撒冷受审判
  choice: 保留“情人”“赤身露体”“全身赤裸”等具体图像
  alternative: 抽象译为“盟友”“羞耻”或“耻辱”
  rationale: 本章有意借婚姻不忠和公开裸露描绘圣约背叛及审判。保留原有比喻才能维持其神学张力与修辞冲击，同时不把比喻仅仅解释为政治事件。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“看哪”保留先知宣告的肃穆感；其余句法按现代汉语调整。性与羞辱的意象不作淡化，但避免不必要的粗俗措辞。
