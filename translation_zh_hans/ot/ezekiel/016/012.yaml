  text: וָ/אֶתֵּ֥ן נֶ֨זֶם֙ עַל אַפֵּ֔/ךְ וַ/עֲגִילִ֖ים עַל אָזְנָ֑יִ/ךְ וַ/עֲטֶ֥רֶת תִּפְאֶ֖רֶת בְּ/רֹאשֵֽׁ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/012.yaml
  text: And I put a ring on your nose[a], earrings on your ears[b], and a splendid crown on your head.
translation:
  language: zh_hans
  text: 我又把鼻环戴在你鼻子上[a]，把耳环戴在你耳朵上，又把华美的冠冕戴在你头上。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把环放在你鼻子上”；这里的希伯来词通常指鼻饰，因此译作“鼻环”。
    reason: lexical_alternative
  - marker: b
    text: “华美的冠冕”原文也可直译为“华美之冠”或“荣美之冠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: 我又把……戴在
  rationale: נתן基本义为“给、放置”；在为人佩戴饰物的语境中，译作“戴在”自然、具体。“又”承接上文连续的装饰行动。
- source_word: נֶזֶם
  choice: 鼻环
  rationale: נֶזֶם指环状饰物，此处由עַל אַפֵּךְ“在你鼻子上”明确为鼻饰；译作“鼻环”简洁清楚。
- source_word: עַל אַפֵּךְ
  choice: 在你鼻子上
  rationale: אַף在此指“鼻子”，עַל直译为“在……上”；保留原文对佩戴部位的明确说明。
- source_word: וַעֲגִילִים
  choice: 耳环
  rationale: עֲגִילִים在此指佩于耳部的环形饰物，现代汉语用“耳环”最为自然。
- source_word: עַל אָזְנָיִךְ
  choice: 在你耳朵上
  rationale: 保留原文עַל“在……上”和双数名词“耳朵”的身体部位表达。
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: 华美的冠冕
  rationale: עֲטֶרֶת为“冠冕”，תִּפְאֶרֶת表达美丽、华美或荣美；“华美的冠冕”既自然又保留其华丽尊荣之意。
- source_word: בְּרֹאשֵׁךְ
  choice: 戴在你头上
  rationale: 介词ב在冠冕语境中表示位于头上；汉语以“戴在你头上”最自然，并与本节佩戴饰物的动作一致。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。重复“戴在”以清楚呈现原文逐件放置饰物的动作；“冠冕”比日常的“王冠”更能保留原文的庄重感，且不额外限定冠的类型。
