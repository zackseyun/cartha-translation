  yaml_path: translation/ot/ezekiel/016/050.yaml
  text: They became haughty and committed abomination before me[b][a], so I removed them when I saw it.
translation:
  language: zh_hans
  text: 她们心高气傲，在我面前行了可憎之事；我看见时[a]，就把她们除去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我看见时”也可译作“正如我所看见的”。原文没有明说“看见”的宾语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְבְּהֶינָה
  choice: 她们心高气傲
  rationale: גבהּ在此按道德语境指骄傲自高；“心高气傲”自然、庄重，也保留负面的自高含义。
- source_word: וַתַּעֲשֶׂינָה תוֹעֵבָה
  choice: 行了可憎的事
  rationale: עשה与תועבה连用，直指实施在上帝看来可憎之事；此译比生硬的“做了可憎”更合现代汉语。
- source_word: לְפָנָי
  choice: 在我面前
  rationale: 保留原文空间性表达及“在上帝鉴察之下”的审判意味。
- source_word: וָאָסִיר אֶתְהֶן
  choice: 就除掉了她们
  rationale: סור的使役含义是使之离开、移除；“除掉”符合本段审判语境，同时不额外说明具体方式。
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: 我看见后
  rationale: כַּאֲשֶׁר可表达“当……时/在……之后”的时间关系；中文无需补出宾语即可自然承接前句，并保留原文未明说宾语的特点。
theological_decisions:
- issue: 上帝审判行动的措辞
  choice: 就除掉了她们
  alternative: 于是我使她们离开；我一看见，就把她们除去
  rationale: 直接保留上帝对所指群体施行审判的陈述，不将“除掉”具体化为毁灭、杀死或放逐。
- issue: כַּאֲשֶׁר רָאִיתִי的句法关系
  choice: 我看见后
  alternative: 正如我所看见的；当我看见时
  rationale: 在上下文中采用自然的时间关系，但不补入原文没有明说的“这事”；脚注提示另一种较贴近形式的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“她们”承接上下文中以女性形象指称的城邑；分号呈现罪行与审判之间紧密的承接关系。
