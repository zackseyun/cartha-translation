reference: Ezekiel 16:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/תַּעְדִּ֞י זָהָ֣ב וָ/כֶ֗סֶף וּ/מַלְבּוּשֵׁ/ךְ֙ ששי וָ/מֶ֨שִׁי֙ וְ/רִקְמָ֔ה סֹ֧לֶת וּ/דְבַ֛שׁ וָ/שֶׁ֖מֶן אכלתי וַ/תִּ֨יפִי֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַֽ/תִּצְלְחִ֖י לִ/מְלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/013.yaml
  text: You adorned yourself with gold and silver[a], and your clothing was fine linen, silk, and embroidered cloth. You ate fine flour, honey, and oil[b], and you became exceedingly beautiful and prospered to royalty.
translation:
  language: zh_hans
  text: 你用金银装饰自己；你穿的是细麻布、华贵织物[a]和刺绣布。你吃细面、蜂蜜和油。你变得极其美丽，并兴盛起来，达到王后的尊荣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里所指织物的确切种类不能确定；传统上也译作“丝绸”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“达到王权的地位”或“进入王室的尊荣地位”。原文可较宽泛地表示成功进入王室或王权地位；因上下文将耶路撒冷拟作女子，正文译作“王后的尊荣”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּעְדִּי
  choice: 你用……装饰自己
  rationale: 该动词在此表示以饰物装扮自己；结合“金银”作相关成分及全段婚姻意象，采用自然的反身表达。
- source_word: זָהָב וָכֶסֶף
  choice: 金银
  rationale: 直接保留两种贵重材料，符合汉语并列习惯。
- source_word: וּמַלְבּוּשֵׁךְ
  choice: 你的衣服是
  rationale: 原文为带第二人称阴性单数后缀的集合性单数；“衣服”自然引出后面的三类贵重织物。
- source_word: ששי
  choice: 细麻布
  rationale: 通常指优质细麻织物，在奢华和礼仪语境中尤其常见。
- source_word: מֶשִׁי
  choice: 华贵织物
  rationale: 这种织物的确切材质难以确定；避免把有争议的词过度具体化为“丝绸”，同时保留奢华含义。
- source_word: רִקְמָה
  choice: 刺绣布
  rationale: 指带刺绣的织物；此译法适合衣着清单，并保留工艺特征。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指精制的优质面粉；“细面”是自然且凝练的现代圣经用语。
- source_word: דְבַשׁ
  choice: 蜂蜜
  rationale: 按字面译出食物名称。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原文仅作“油”，不擅自限定为橄榄油。
- source_word: אכלתי
  choice: 你吃的是
  rationale: 马所拉文本为第二人称阴性单数完成式，采用主动义；“吃的是”自然突出所享用的佳肴。
- source_word: וַתִּיפִי בִּמְאֹד מְאֹד
  choice: 你变得极其美丽
  rationale: 重复的 מְאֹד 构成强烈程度表达，“极其”在现代汉语中自然传达其强调作用。
- source_word: וַתִּצְלְחִי לִמְלוּכָה
  choice: 并且兴盛，达到了王后的尊位
  rationale: צלח 含成功、兴盛之意；在把耶路撒冷拟作女子的语境中，מְלוּכָה 可指进入王后身份或王室尊位。译文保留“兴盛”的动态，也使女性拟人意象清楚。
theological_decisions:
- issue: 婚约—王室意象中耶路撒冷地位的提升
  choice: 兴盛，达到了王后的尊位
  alternative: 兴盛，成为王国；达到王权地位
  rationale: 上下文把耶路撒冷拟作一名被装饰的女子，因此“王后的尊位”贴合语法与意象；但希伯来语 לִמְלוּכָה 也可较宽泛地表示进入王权、王国或王室地位，故以脚注保留歧义，不引入额外教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以分号和短句呈现衣饰、饮食、美貌与地位提升的递进。保留第二人称女性拟人语气，并用脚注呈现织物名称及末句王室地位表达的真实歧义。
