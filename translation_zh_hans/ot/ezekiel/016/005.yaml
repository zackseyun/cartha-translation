base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/005.yaml
  text: No eye pitied you enough to do for you even one of these things[a], to have compassion on you; instead, you were thrown out into the open field in loathing of your life on the day you were born.
translation:
  language: zh_hans
  text: 没有一双眼睛怜惜你，肯为你做这些事中的任何一件，向你施怜悯；反而在你出生的那天，你因受人厌恶[a]被扔在田野上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因厌恶你的生命。”希伯来语 בְּגֹעַל נַפְשֵׁךְ 十分凝练，直译近于“因对你生命的厌恶”；其中“生命”也可指这新生儿本人。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסָה עָלַיִךְ עַיִן
  choice: 没有一只眼睛怜惜你
  rationale: 保留希伯来文以“眼睛”为主语的拟人习语，同时在现代汉语中清楚自然；此处上下文是婴儿无人照料，“怜惜”比“饶过”更合适。
- source_word: לַעֲשׂוֹת לָךְ אַחַת מֵאֵלֶּה
  choice: 肯为你做这些事中的任何一件
  rationale: 承接上一节所列的照料行为。“任何一件”传达 אַחַת מֵאֵלֶּה 所强调的最低限度；“肯”自然体现怜惜本应引出的行动。
- source_word: לְחֻמְלָה עָלָיִךְ
  choice: 向你表示怜悯
  rationale: 将目的或结果性的表达译出，并以“怜悯”对应 חֻמְלָה，不额外加入盟约等神学含义。
- source_word: וַתֻּשְׁלְכִי
  choice: 被扔
  rationale: 准确体现 Hophal 被动形态，并保留弃婴场景中动作的粗暴感；现代汉语也自然。
- source_word: אֶל־פְּנֵי הַשָּׂדֶה
  choice: 在田野上
  rationale: פְּנֵי 在此表示田野的表面或开阔处；“在田野上”简洁呈现婴儿暴露、被遗弃的处境。
- source_word: בְּגֹעַל נַפְשֵׁךְ
  choice: 因你的生命遭人厌恶
  rationale: גֹעַל 表示厌恶、嫌恶；נֶפֶשׁ 在这里可指生命，也可代指婴儿本人。正文保留“生命”这一词义，同时用脚注说明可更直接理解为对她本人的嫌恶。
- source_word: בְּיוֹם הֻלֶּדֶת אֹתָךְ
  choice: 在出生那天
  rationale: 直接、自然地表达原文的时间短语，并保留事情发生于出生当日的强烈即时感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留“没有一只眼睛”这一鲜明的希伯来语意象，并避免用过度传统化的措辞。句序略作调整，把“在出生那天”置于被遗弃动作之前，使汉语流畅，同时不改变各分句的逻辑关系。
