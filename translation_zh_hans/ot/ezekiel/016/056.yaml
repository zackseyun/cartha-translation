  text: 在你骄傲的日子，所多玛——你的妹妹——岂不是你口中谈论的话题吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谈论的话题”或译“传闻”“所听闻的事”，也可理解为“话柄”。这里可能是指所多玛在耶路撒冷口中成为一个臭名昭著、常被提及的例子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: 岂不是
  rationale: 句首连词加否定词在此引出带责问意味的反问；“岂不是”自然保留先知话语的诘问力度。
- source_word: הָיְתָה
  choice: 是
  rationale: 此处是היה的Qal完成式，表达过去的状态；汉语反问句中用“是”即可自然承载。
- source_word: סְדֹם
  choice: 所多玛
  rationale: 采用现代简体中文圣经语境中通行的专名译法。
- source_word: אֲחוֹתֵךְ
  choice: 你妹妹
  rationale: 保留以姐妹关系比喻城邑的核心意象；结合本章前文所多玛被称为耶路撒冷的妹妹，译作“妹妹”比泛称“姐妹”更具体。
- source_word: לִשְׁמוּעָה
  choice: 谈论的对象
  rationale: שְׁמוּעָה可指听闻、消息或被人谈论之事；与“你口中”连用时，重点在所多玛成为耶路撒冷口头谈论的对象。正文采用不预先限定为嘲讽性“笑柄”的表达，并以脚注保留词义幅度。
- source_word: בְּפִיךְ
  choice: 你口中
  rationale: 贴近希伯来语身体意象，也符合自然汉语表达。
- source_word: בְּיוֹם
  choice: 在……的日子
  rationale: 保留希伯来语“在……之日”的时间表达，同时使现代中文流畅。
- source_word: גְּאוֹנָיִךְ
  choice: 你骄傲的日子
  rationale: גָּאוֹן在此指自高和骄傲；“骄傲”简明自然，并符合责备语境。
theological_decisions:
- issue: 本节关于所多玛的话是反问还是平直陈述
  choice: 译为反问：“岂不是……吗？”
  alternative: 译为否定陈述：“所多玛并不是你口中谈论的对象。”
  rationale: 句首וְלֹא配合完成式在先知责问的上下文中可自然读作反问；这一译法保留话语的对质力度，同时不加入额外教义解释。
- issue: לִשְׁמוּעָה是否明确含有贬斥意味
  choice: 正文译作较中性的“谈论的对象”
  alternative: 译作“笑柄”“话柄”或“传闻”
  rationale: 该词本身可指消息、听闻或谈论对象。上下文可能带有轻蔑意味，但原词并不必然等同于“笑柄”，故正文保留语义张力，脚注说明可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“妹妹”“你口中”等本章的重要比喻和希伯来语意象；以“岂不是……吗”呈现先知责问的语气，并用脚注交代שְׁמוּעָה的真实词义范围。
