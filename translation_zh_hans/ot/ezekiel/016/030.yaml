base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/030.yaml
  text: How weak your heart is[a], declares the Lord GOD, when you do all these things, the deeds of a brazen prostitute,
translation:
  language: zh_hans
  text: 你的心何其衰弱[a]啊！这是主雅威的宣告。你竟做这一切事，如同一个专横[b]的妓女所做的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “衰弱”也可译为“病弱”“萎靡”或“虚弱”。
    reason: 保留אֲמֻלָה所涵盖的衰弱、病弱和萎靡等词义范围。
  - marker: b
    text: “专横”也可译为“放肆的”或“无耻的”；原词可表达强势、盛气凌人或毫无羞耻的行为。
    reason: שַׁלָּטֶת语义较宽；正文采用其支配性、强势的一面，脚注保留其放肆大胆的可能。
lexical_decisions:
- source_word: מָה אֲמֻלָה לִבָּתֵךְ
  choice: 你的心何其衰弱
  rationale: מָה在这里引出程度感叹；אֲמֻלָה表示衰弱、萎靡或病弱。保留“心”的原文意象和责备中耐人寻味的张力，不擅自解释为意志薄弱或欲火中烧。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主雅威如此宣告
  rationale: נְאֻם是先知宣告公式；אֲדֹנָי译为“主”，יהוה按其专名译为“雅威”，并用“如此宣告”构成自然庄重的现代汉语。
- source_word: בַּעֲשׂוֹתֵךְ אֶת כָּל אֵלֶּה
  choice: 你竟做这一切事
  rationale: ב加不定式在此表达伴随或时间关系；“竟”自然传达责备语气，但不改变“做这一切事”的基本内容。
- source_word: מַעֲשֵׂה אִשָּׁה זוֹנָה
  choice: 行……妓女所行的事
  rationale: מַעֲשֵׂה在此把前述行为刻画为妓女的行径；“妓女”准确、现代，也避免古奥或过分粗俗的措辞。
- source_word: שַׁלָּטֶת
  choice: 专横的
  rationale: 该词可表示强势、支配人、盛气凌人，也可在语境中呈现放肆无耻的意味。“专横”较贴近词的支配性核心，同时以脚注保留其他可能。
theological_decisions:
- issue: 神名יהוה在אֲדֹנָי יְהוִה中的译法
  choice: 主雅威
  alternative: 主耶和华
  rationale: 原文直接使用四字神名；“雅威”以专名形式保留其身份，并避免把אֲדֹנָי与יהוה都处理成普通称谓。
- issue: “心衰弱”与下文大胆行径之间的张力
  choice: 直译为“你的心何其衰弱”
  alternative: 你的心多么放荡／欲火何其炽盛
  rationale: אֲמֻלָה的基本意义是衰弱、萎靡。虽然上下文可能带有讽刺或特殊语用色彩，译文不以解释性措辞消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“何其”保留先知责备的感叹力度；引语与宣告公式的安排使汉语流畅，同时保持原文先感叹、再宣告并说明行为的次序。
