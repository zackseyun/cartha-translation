  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֨ר אֲדֹנָ֤/י יְהוִה֙ לִ/יר֣וּשָׁלִַ֔ם מְכֹרֹתַ֨יִ/ךְ֙ וּ/מֹ֣לְדֹתַ֔יִ/ךְ מֵ/אֶ֖רֶץ הַֽ/כְּנַעֲנִ֑י אָבִ֥י/ךְ הָ/אֱמֹרִ֖י וְ/אִמֵּ֥/ךְ חִתִּֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD to Jerusalem: Your origin and your birth are from the land of the Canaanite; your father was an Amorite, and your mother a Hittite.’'
translation:
  language: zh_hans
  text: 你要说：“主耶和华对耶路撒冷如此说：你的根源和出生都来自迦南人的土地[a]；你父亲是亚摩利人，你母亲是赫人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“迦南地”。希伯来文更直译为“迦南人的土地”，保留了这里对族属的强调。
    reason: 说明较顺畅的地名译法，同时交代正文为何保留原文的民族称谓。
lexical_decisions:
- source_word: וְאָמַרְתָּ ... כֹּה אָמַר
  choice: 你要说……如此说
  rationale: 以“你要说”表达先知奉命传话，并以现代中文常见的先知宣告格式“如此说”保留原文公式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: “主”对应 אֲדֹנָי，“耶和华”对应神名 יהוה；二者并列，避免漏译其中任何一个成分，也符合现代中文圣经语体。
- source_word: לִירוּשָׁלִַם
  choice: 对耶路撒冷
  rationale: 介词 ל 标明话语的对象；译作“对耶路撒冷”自然清楚。
- source_word: מְכֹרֹתַיִךְ
  choice: 你的根源
  rationale: 该词表示来源、起源；“根源”既自然，又能配合本节比喻性的家世描述，而不误解为买卖。
- source_word: מוֹלְדֹתַיִךְ
  choice: 你的出生
  rationale: 该词指诞生、出生；译作“出生”简明，并与“根源”构成原文的并列关系。
- source_word: מֵאֶרֶץ הַכְּנַעֲנִי
  choice: 来自迦南人的土地
  rationale: 原文采用族称单数“迦南人”，而非地名“迦南”；保留“迦南人”的民族色彩，也为下文“亚摩利人”和“赫人”作铺垫。
- source_word: אָבִיךְ הָאֱמֹרִי
  choice: 你父亲是亚摩利人
  rationale: 希伯来文为无系词句，中文补出“是”以表达自然；直陈式亲属语言保留其尖锐的比喻性指控。
- source_word: וְאִמֵּךְ חִתִּית
  choice: 你母亲是赫人
  rationale: 补出“是”使中文句式完整；“赫人”是 חִתִּית 的通行中文族名。
theological_decisions:
- issue: 耶路撒冷的比喻性家世
  choice: 在正文中直接保留“父亲是亚摩利人、母亲是赫人”的家世说法
  alternative: 明说这是指耶路撒冷在道德或属灵上像迦南诸族
  rationale: 原文以震撼的亲属比喻指控耶路撒冷，却没有在本句内解释这种关系的具体性质；译文不应把某一种阐释加入正文，也不应弱化其张力。
- issue: אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”分别体现称号 אֲדֹנָי 与神名 יהוה，并沿用普通中文读者熟悉的庄重表达。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留先知宣告公式和原文尖锐的家世隐喻；“迦南人的土地”略带刻意的族属色彩，这是为忠实呈现希伯来文措辞，并以脚注提供更顺畅的替代译法。
