  text: וַ/תִּקְחִ֞י כְּלֵ֣י תִפְאַרְתֵּ֗/ךְ מִ/זְּהָבִ֤/י וּ/מִ/כַּסְפִּ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וַ/תַּעֲשִׂי לָ֖/ךְ צַלְמֵ֣י זָכָ֑ר וַ/תִּזְנִי בָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/017.yaml
  text: You took your beautiful jewels from my gold and my silver[a], which I had given to you, and made for yourself male images[c][b], and you prostituted yourself with them.
translation:
  language: zh_hans
  text: 你拿了你那些华美的饰物[a]——用我赐给你的金银制成的——为自己造了男性形像[b]，并与它们行淫[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你那些华美的器物”。这里的希伯来语可泛指物件或器具；按上下文，很可能指用金银制成的装饰品。
    reason: lexical_alternative
  - marker: b
    text: 或译“男性偶像”或“男性模样的形像”。
    reason: alternative_reading
  - marker: c
    text: “行淫”是先知书中反复出现的隐喻，以性不忠描写背弃与上帝所立的约，尤其指拜偶像。
    reason: cultural_note
lexical_decisions:
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: 华美饰物
  rationale: כְּלִי 可泛指器物、物件，תִפְאֶרֶת 表示华美、荣美；结合金银和上下文中的装饰，译作“华美饰物”自然且不过度限定为珠宝。
- source_word: מִזְּהָבִי וּמִכַּסְפִּי אֲשֶׁר נָתַתִּי לָךְ
  choice: 我赐给你的金银所制成的
  rationale: מִן 在此表明材料来源；译文保留“我的金银”由说话者赐下的含义，并以现代汉语自然表达饰物与金银材料的关系。
- source_word: וַתַּעֲשִׂי לָךְ
  choice: 为自己造了
  rationale: 保留 לָךְ 的自为、反身意味，突出耶路撒冷把所得之物用于自己的悖逆目的。
- source_word: צַלְמֵי זָכָר
  choice: 男性形像
  rationale: צֶלֶם 是形像、塑像，זָכָר 明指男性；“男性形像”保留原文直白而令人震惊的性化表达，不在正文中先行解释为偶像。
- source_word: וַתִּזְנִי בָם
  choice: 并与它们行淫
  rationale: זנה 是以性不忠描写背约和拜偶像的先知性隐喻；“行淫”保留其强烈修辞和性意味，בָם 译为“与它们”。
theological_decisions:
- issue: 以性不忠比喻拜偶像和背约
  choice: 正文保留明确的“与它们行淫”
  alternative: 译作“因它们而不忠”或“用它们拜偶像”
  rationale: 原文有意采用强烈的性隐喻谴责耶路撒冷的背约；弱化为一般的不忠会损失修辞力度，直接改成拜偶像则会以解释取代原有意象。
- issue: צַלְמֵי זָכָר 的性质
  choice: 译作“男性形像”
  alternative: 译作“男性偶像”或“男性模样的偶像”
  rationale: 上下文确有偶像崇拜含义，但 צֶלֶם 本身是“形像”；正文保留词义及其可能形成的性与祭祀双重联想，脚注再说明语境。
translation_notes:
  register: 采用现代、庄重而直接的书面汉语。保留原文第二人称女性单数对耶路撒冷的拟人化指责；汉语不显语法性别。用“形像”而非“形象”，以突出可制作的塑像或偶像性物件；“行淫”保留先知话语的冲击力。
