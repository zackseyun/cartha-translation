source:
  edition: WLC
  text: וַ/הֲנִחֹתִ֤י חֲמָתִ/י֙ בָּ֔/ךְ וְ/סָ֥רָה קִנְאָתִ֖/י מִמֵּ֑/ךְ וְ/שָׁ֣קַטְתִּ֔י וְ/לֹ֥א אֶכְעַ֖ס עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/042.yaml
  text: So I will satisfy my wrath against you[a], and my jealousy will turn away from you[b]; then I will be quiet and no longer be angry.
translation:
  language: zh_hans
  text: 这样，我要使我的烈怒在你身上止息[a]，我的妒忌也要离开你[b]；我要平静下来，不再发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使我的烈怒在你里面（或在你身上）安歇”。这里是指烈怒施行后归于止息。
    reason: lexical_alternative
  - marker: b
    text: “妒忌”也可译作“热忱”；本章以婚姻和不贞为比喻，因此正文采用“妒忌”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲנִחֹתִי
  choice: 我要使……止息
  rationale: נוח 的使役形在这里以“我的烈怒”为宾语，表示使烈怒安歇、平息。译作“使……止息”既保留使役结构，也自然表达烈怒施行完毕而平息的语境含义。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: חֵמָה 指强烈、炽热的愤怒；“烈怒”保留其强度及审判意味，同时符合现代汉语的庄重经文语体。
- source_word: בָּךְ
  choice: 在你身上
  rationale: 介词 בְּ 的字面空间关系是“在……里面／身上”；结合烈怒的语境，“在你身上”可表达怒气临到并施行于对方，又不把它完全改写成单纯的方向性“向你”。
- source_word: וְסָרָה
  choice: 也要离开
  rationale: סור 表示离去、转离。“离开”清楚保留妒忌从受话者身上撤去的分离意象。
- source_word: קִנְאָתִי
  choice: 我的妒忌
  rationale: קִנְאָה 可指“妒忌”或“热忱”。以西结书16章持续采用婚姻与不贞的比喻，因此“妒忌”更贴合当前语境，同时以脚注保留另一词义。
- source_word: מִמֵּךְ
  choice: 离开你
  rationale: מִן 标明从受话者那里分离；汉语用“离开你”简洁自然。
- source_word: וְשָׁקַטְתִּי
  choice: 我要平静下来
  rationale: שקט 表示骚动之后归于安静、安歇或平稳。“平静下来”自然承接烈怒止息和妒忌离开的过程。
- source_word: וְלֹא אֶכְעַס עוֹד
  choice: 不再发怒
  rationale: כעס 在此表示发怒；עוֹד 与否定词连用表示“不再”。此译简明、准确，并构成全句的收束。
theological_decisions:
- issue: 盟约审判语境中的神圣情感用语
  choice: 保留“烈怒”和“妒忌”等真实而强烈的盟约关系用语
  alternative: 将其弱化为“不悦”，或把“妒忌”译作“热忱”
  rationale: 本章以婚姻和不贞描写盟约背叛，也以审判语言描述上帝的回应。“妒忌”保留配偶关系的比喻张力，“烈怒”则保留其道德与审判分量；两者都不应被抽象化或淡化。
- issue: 烈怒“止息”的方式与含义
  choice: 译作“使我的烈怒在你身上止息”，保留烈怒施行后归于止息的表达
  alternative: 译作“消除我对你的烈怒”或“向你息怒”
  rationale: 原文使用 נוח 的使役形，并以 בָּךְ 与“烈怒”相连。所选译法不预先把这句话仅解释为宽恕或情绪自然消散，而保留审判临到并最终止息的语境张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“烈怒”保持审判语境的力度；“平静下来”比“静默”更符合现代汉语，也准确表达风波之后归于安静。主文中的脚注标记与相应词语紧邻，且脚注顺序按希伯来原文的词序排列。
