id: EZK.16.43
reference: Ezekiel 16:43
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר לֹֽא זכרתי אֶת יְמֵ֣י נְעוּרַ֔יִ/ךְ וַ/תִּרְגְּזִי לִ֖/י בְּ/כָל אֵ֑לֶּה וְ/גַם אֲנִ֨י הֵ֜א דַּרְכֵּ֣/ךְ בְּ/רֹ֣אשׁ נָתַ֗תִּי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לֹ֤א עשיתי אֶת הַ/זִּמָּ֔ה עַ֖ל כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/043.yaml
  text: Because you did not remember the days of your youth[a], but enraged me with all these things, therefore I also have put your way on your own head, declares the Lord GOD, and you have not committed lewdness beyond all your abominations.
translation:
  language: zh_hans
  text: 因为你没有记念你年轻时的日子，反倒因这一切事惹我发怒，所以，看哪，我也要把你的所作所为归到你自己头上。这是主耶和华的宣告。难道你不是在这一切可憎之事之上又行了淫乱吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句的希伯来文难以确定。也可译作：“你并没有在这一切可憎之事之上行淫乱。”其中“在……之上”也可理解为“连同”或“超过”。希伯来文本的书写形式作“我做了”，诵读传统作“你做了”；本译文按诵读传统，并把否定词理解为反问。
    reason: 说明末句介词短语的歧义、陈述式替代译法，以及书写形式与诵读传统的动词差异。
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 自然表达因果关系，引出耶路撒冷受审判的缘由。
- source_word: לֹא זכרתי אֶת יְמֵי נְעוּרַיִךְ
  choice: 你没有记念你幼年的日子
  rationale: 按上下文将异常形式理解为对耶路撒冷的阴性单数称呼；“记念”既保留“记得”的基本义，也带出忘恩负义的道德意味。
- source_word: וַתִּרְגְּזִי לִי
  choice: 反倒以……惹我发怒
  rationale: רגז在此表示使上帝受到激怒；“反倒”把忘记昔日与后来的悖逆形成的对比自然表达出来。
- source_word: וְגַם אֲנִי הֵא
  choice: 所以，看哪，我也
  rationale: 保留回应性的“也”和 הֵא 的强调、指示语气；“所以”清楚呈现审判与前述罪行的因果联系。
- source_word: דַּרְכֵּךְ בְּרֹאשׁ נָתַתִּי
  choice: 使你的所作所为归到你自己头上
  rationale: 保留“归到头上”的司法性比喻，同时用“所作所为”自然表达 דֶּרֶךְ 在此所指的行为和生活方式。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: 按希伯来文同时表达 אֲדֹנָי“主”和圣名 יהוה“耶和华”，并以现代中文常用的先知宣告公式呈现。
- source_word: הַזִּמָּה
  choice: 淫乱
  rationale: 本章以婚姻和性不忠为核心意象；“淫乱”保留该词在此处强烈的性伦理含义。
- source_word: עַל כָּל תּוֹעֲבֹתָיִךְ
  choice: 在这一切可憎之事以外，又
  rationale: 将 עַל 理解为附加意义，即在已有一切可憎之事之上再增添淫乱；用脚注注明该困难短语的其他理解。
theological_decisions:
- issue: 末句究竟是陈述句还是反问句
  choice: 你不是在这一切可憎之事以外，又行了淫乱吗？
  alternative: 你并没有行超过这一切可憎之事的淫乱。
  rationale: 上下文是在累述并谴责耶路撒冷的罪，故反问式更符合语境，也能理解为 וְלֹא 的反问用法；但希伯来文句法困难，陈述式仍属真实可能，故在脚注中保留。
- issue: אֲדֹנָי יְהוִה 中圣名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文明确并列“主”与四字圣名；“主耶和华”在现代中文中可辨识且保留圣名，不把两个称谓合并。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“看哪”的先知性强调和“归到头上”的审判比喻；避免用过度古雅的文言结构。
