  text: וַ/תַּרְבִּ֧י אֶת תַּזְנוּתֵ֛/ךְ אֶל אֶ֥רֶץ כְּנַ֖עַן כַּשְׂדִּ֑ימָ/ה וְ/גַם בְּ/זֹ֖את לֹ֥א שָׂבָֽעַתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/029.yaml
  text: You multiplied your prostitution to the land of Canaan[a], to Chaldea; yet even with this you were not satisfied.
translation:
  language: zh_hans
  text: 你把你的淫行扩展到迦南地，到迦勒底[a]；即使这样，你仍不满足。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译：“向迦南地，向迦勒底”，或“到迦南地——迦勒底”。希伯来文句法十分简略；这句话可能把“迦南地”比喻性地指为迦勒底（巴比伦），也可能表示淫行从迦南扩展到迦勒底。
    reason: 保留原文中“迦南地”与“迦勒底”之间关系的句法歧义，且避免把地点词直接改作“迦勒底人”。
lexical_decisions:
- source_word: וַתַּרְבִּי
  choice: 你又把……扩展
  rationale: 该词是 רבה 的使役形，表示使某事增多、扩大。结合后面的地名，用“扩展”自然表达淫行不断增加并延伸到更远之处。
- source_word: תַּזְנוּתֵךְ
  choice: 你的淫行
  rationale: 该词指卖淫、淫乱，在本章中用作耶路撒冷背约、不忠的鲜明比喻。“淫行”保留了原文直接而强烈的性意象，同时符合庄重的现代汉语表达。
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: 到迦南地
  rationale: אֶל 表示方向，אֶרֶץ 明说“地”。此译保留地理表达，又与汉语中的“扩展到”自然衔接。
- source_word: כַּשְׂדִּימָה
  choice: 直到迦勒底
  rationale: 词尾带方向意义，可表示向着或到迦勒底。译作“直到迦勒底”表达范围的延伸，但原句结构高度压缩，其他可能关系在脚注中保留。
- source_word: וְגַם בְּזֹאת
  choice: 即使这样
  rationale: 该短语承接前述进一步扩大的淫行，并带有强调和让步意味；“即使这样”符合现代汉语，也凸显仍未满足的反常程度。
- source_word: לֹא שָׂבָעַתְּ
  choice: 你仍不满足
  rationale: שׂבע 表示吃饱、得到满足。这里比喻欲望无法餍足；“仍不满足”清楚自然，并保留其强调语气。
theological_decisions:
- issue: 以性行为比喻耶路撒冷在信仰和盟约上的不忠
  choice: 保留“淫行”这一明确而强烈的比喻
  alternative: 译为“背信”或“不忠”
  rationale: 原文刻意采用令人震动的性意象，描绘耶路撒冷的偶像崇拜及政治宗教上的背叛。若概括成“背信”或“不忠”，就会削弱先知话语的修辞力度，并把比喻提前解释掉。
- issue: 迦南地与迦勒底之间的句法关系
  choice: 正文译为范围延伸：“到迦南地，直到迦勒底”
  alternative: “向迦南地，向迦勒底人”或“到迦南地——迦勒底”
  rationale: 希伯来文结构简略，既可能描述淫行延伸至迦勒底，也可能将“迦南地”与迦勒底并置或作带有修辞意味的指认。正文采用顺畅且合乎语境的范围表达，同时以脚注保留真实歧义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“淫行”保留先知话语的尖锐性，又避免使用生僻或过度古雅的措辞；分号呈现前后两层意思的转折关系。
