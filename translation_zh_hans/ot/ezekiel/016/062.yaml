source:
  edition: WLC
  text: וַ/הֲקִימוֹתִ֥י אֲנִ֛י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וְ/יָדַ֖עַתְּ כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/062.yaml
  text: And I myself will establish my covenant with you, and you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我必亲自与你坚立我的约；你就会知道我是雅威。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: 我必……立定
  rationale: קום的使役式在此表示使约确立、站立得住；“立定”既贴近原意，也符合现代汉语中的立约语境。上下文赋予其将来意义。
- source_word: אֲנִי
  choice: 亲自
  rationale: 动词已包含第一人称，另加独立代词אֲנִי具有强调作用；译作“亲自”自然地保留上帝主动施行此事的强调。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: בְּרִית是圣经中神人关系的常用立约词。“约”简洁、庄重，并保留其盟约含义。
- source_word: אִתָּךְ
  choice: 与你
  rationale: 准确表达立约关系；原文为阴性单数，所指是拟人化的耶路撒冷，中文无需在代词形态上另作标示。
- source_word: וְיָדַעַתְּ
  choice: 你就知道
  rationale: 在先知话语中，此处完成式带有将来或结果意义。“就”自然呈现前句行动所带来的结果，但不把“知道”的内涵进一步解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并较贴近学界通常重构的读音；不以“主”这一称号取代。
- issue: 独立代词אֲנִי的强调
  choice: 我必亲自
  alternative: 我必；我实在必
  rationale: “亲自”在现代汉语中清楚保留独立代词带来的强调，突出行动主体，同时不额外规定该约与前文诸约之间的神学关系。
- issue: בְּרִיתִי所指之约的性质
  choice: 我的约
  alternative: 我与你所立的约；我的盟约
  rationale: 沿用原文简洁表达，不在正文中断定这是更新旧约、确认既有之约，还是另立新约，从而保留上下文中的解释空间。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“立定我的约”保留希伯来语使约成立、稳固的意味；“你”承接上下文中被拟人化为女性的耶路撒冷。全节不设脚注。
