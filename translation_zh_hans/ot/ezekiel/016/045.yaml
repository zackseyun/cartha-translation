base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/045.yaml
  text: You are the daughter of your mother[a], who loathed her husband and her children; and you are the sister of your sisters, who loathed their husbands and their children. Your mother was a Hittite, and your father an Amorite.
translation:
  language: zh_hans
  text: 你是你母亲的女儿；她厌弃[a]自己的丈夫和儿女。你是你众姐妹的姐妹；她们厌弃自己的丈夫和儿女。你们的母亲是赫人；你们的父亲是亚摩利人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厌弃”也可译作“憎恶”或“厌恶”；希伯来语 גָּעַל 表示强烈的反感和拒斥。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת אִמֵּךְ
  choice: 你真是你母亲的女儿
  rationale: 保留希伯来文以母女关系表达行为相似的说法；加入“真是”使这种指责性的认同比较符合现代汉语，同时不改变其谱系隐喻。
- source_word: גֹּעֶלֶת / גָּעֲלוּ
  choice: 厌弃
  rationale: געל 表达强烈的反感与拒斥。“厌弃”兼有憎厌和弃绝之意，适合本节的控诉语气，并在两处保持一致。
- source_word: אִישָׁהּ / אַנְשֵׁיהֶן
  choice: 自己的丈夫
  rationale: אישׁ 在家庭和婚姻语境中指丈夫；“自己的”自然呈现所属关系，并避免汉语代词指向含混。
- source_word: וּבָנֶיהָ / וּבְנֵיהֶן
  choice: 和儿女
  rationale: בנים 虽可直译为“儿子们”，但常泛指后代；此处译作“儿女”保留集合性的家庭含义，不无根据地限于男性子女。
- source_word: וַאֲחוֹת אֲחוֹתֵךְ
  choice: 你也是你姐妹们的姐妹
  rationale: 尽量保留原文重复“姐妹”的强调结构，表达耶路撒冷与象征性姐妹之间的亲属关系及行为相似性。
- source_word: אִמְּכֶן חִתִּית וַאֲבִיכֶן אֱמֹרִי
  choice: 你们的母亲是赫人，你们的父亲是亚摩利人
  rationale: 第二人称复数后缀指向被称作姐妹的众者，故译为“你们的”；保留两个族名及原文简洁、对称的断言。
theological_decisions:
- issue: “母亲是赫人，父亲是亚摩利人”的族裔亲属语言
  choice: 按原文保留其直陈式家族隐喻，不在正文中解释为实际族谱
  alternative: 将其释义为“你们的行为如同赫人和亚摩利人”，或理解为字面的族裔血统陈述
  rationale: 以西结书16章整体运用出生、婚姻和姐妹关系构成对耶路撒冷的先知性控诉。译文应保存其尖锐而可能带张力的原始措辞，不把隐喻直接改写成解释，也不额外断言历史血统。
translation_notes:
  register: 采用现代、庄重且口语可懂的普通话。以分号划分母亲与姐妹的平行指控，并用短句保留原文的控诉力度。脚注标记置于“女儿”之后，服务于本句随后出现的关键词“厌弃”。
