base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/038.yaml
  text: And I will judge you with the judgments of women who commit adultery and who shed blood[b][a], and I will give you over to blood in wrath and jealousy.
translation:
  language: zh_hans
  text: 我要按淫妇[a]和流人血的妇女所受的刑罚审判你；我要在烈怒和嫉妒中，使你遭受流血之刑[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行奸淫的妇女”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“把血给你”，并把这“血”与烈怒、嫉妒相连；可能指在烈怒和嫉妒中施加的流血惩罚或血腥结局。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁפַטְתִּיךְ
  choice: 审判你
  rationale: שׁפט在此指上帝对耶路撒冷施行司法审判；“审判”保留了法律语义，也与下文“刑罚”相呼应，而不把含义局限于宣判。
- source_word: מִשְׁפְּטֵי
  choice: 按……所受的刑罚
  rationale: 构造复数在此表示审判的准则或方式。结合淫乱与流血之罪的司法语境，译作“所受的刑罚”比生硬的“审判”更自然，同时保留惩治含义。
- source_word: נֹאֲפוֹת
  choice: 淫妇
  rationale: 阴性复数分词指犯奸淫的妇女。“淫妇”简洁保留本章婚姻寓意中的女性形象；脚注提供较展开的现代说法。
- source_word: וְשֹׁפְכֹת דָּם
  choice: 流人血的妇女
  rationale: 该阴性复数分词短语与“淫妇”平行，指犯流血之罪的妇女。“流人血”保留圣经司法语境中非法杀人的严重性。
- source_word: וּנְתַתִּיךְ דַּם
  choice: 使你遭受流血之刑
  rationale: 直译近于“把你交给血”或“使你成为血”，汉语均不够自然。结合前文刑罚语境，此处表达使她落入流血的结局；“遭受流血之刑”保留上帝施行审判的主体性，却不把含义过度限定为某一种处刑方式。
- source_word: חֵמָה
  choice: 烈怒
  rationale: חֵמָה表示炽烈的怒气；“烈怒”符合先知审判话语，也比古雅或口语化的选项更庄重自然。
- source_word: וְקִנְאָה
  choice: 和嫉愤
  rationale: קִנְאָה在本章婚姻与圣约不忠的语境中，是受背叛所激起的嫉妒和愤慨。“嫉愤”兼顾这两层含义，并避免将其弱化为一般的热心。
theological_decisions:
- issue: 如何表达上帝因圣约与婚姻式背叛而发的嫉妒及审判
  choice: 在烈怒和嫉愤中，使你遭受流血之刑
  alternative: 把烈怒和嫉妒的血归给你；使你在烈怒和忌恨中流血
  rationale: 本节把司法审判、婚姻不忠和流血报应并置。“嫉愤”保留受背叛配偶的婚姻隐喻；“使你遭受”明确审判的神圣主体，同时没有消除原文中严厉而紧张的神学表达。
- issue: “血”在末句中是字面血、流血事件，还是血债刑罚
  choice: 正文译为“流血之刑”，脚注保留原文紧缩表达及可能理解
  alternative: 血；血债；血腥的死亡
  rationale: 原文“给你血”高度凝缩，可能指流血的刑罚、血腥结局或与血债相应的报应。正文需用自然汉语表达，但脚注保留其真实歧义，不把它限定为单一处刑方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按……所受的刑罚审判你”保留法律语气；“淫妇”和“流人血的妇女”维持原文的女性复数及本章婚姻寓意；末句以自然汉语呈现，同时用脚注保存希伯来文的凝缩与歧义。
