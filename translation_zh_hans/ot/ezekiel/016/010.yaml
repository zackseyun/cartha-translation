base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/010.yaml
  text: I clothed you with embroidered cloth[a], put fine leather sandals on you, wrapped you in fine linen[b], and covered you with silk.
translation:
  language: zh_hans
  text: 我给你穿上刺绣织物[a]，给你穿上上等皮料的凉鞋[b]，用细麻布裹你，又用丝绸遮盖你[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刺绣织物”也可译作“绣花布”或“刺绣品”；原文没有说明具体衣服款式。
    reason: lexical_alternative
  - marker: b
    text: “上等皮料”所译的希伯来词，其所指动物或材料来源不确定；这里指用来制作上等鞋履的材料。
    reason: lexical_alternative
  - marker: c
    text: “丝绸”所译的希伯来词较罕见，也可泛指一种贵重织物，具体材质不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: רִקְמָה
  choice: 绣花衣服
  rationale: 该名词指刺绣的织物或绣品；在这一连串穿戴动作中译作“绣花衣服”自然，也不限定具体款式。
- source_word: תָּחַשׁ
  choice: 精皮
  rationale: 其所指动物或材料来源无法确定；语境明确是制作高档鞋履的皮料，译作“精皮”既传达贵重质感，又避免臆断动物种类。
- source_word: וָאֶנְעֲלֵךְ תָּחַשׁ
  choice: 给你穿上精皮凉鞋
  rationale: נעל的使役式表示给人穿鞋；“凉鞋”符合古代鞋履语境，使现代中文清楚自然。
- source_word: שֵׁשׁ
  choice: 细麻布
  rationale: 该词通常指优质细麻织物，在尊贵服饰和礼仪语境中常见；“细麻布”保留其材质与贵重意味。
- source_word: וָאֶחְבְּשֵׁךְ בַּשֵּׁשׁ
  choice: 用细麻布裹住你
  rationale: חבש可指束上、缠裹或包裹；此处处于穿戴描写中，“裹住”贴近原文而不误导为医疗包扎。
- source_word: מֶשִׁי
  choice: 丝绸
  rationale: 该罕见词在本节指贵重织物；传统常译“丝绸”，但具体材质仍有不确定性，因此正文采用通行译法并加注说明。
- source_word: וָאֲכַסֵּךְ
  choice: 覆盖你
  rationale: כסה的基本意思是遮盖、覆盖；直译可保留它与前面“穿上”“裹住”不同的动作层次。
theological_decisions: []
