id: EZK.16.19
reference: Ezekiel 16:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לַחְמִ/י֩ אֲשֶׁר נָתַ֨תִּי לָ֜/ךְ סֹ֣לֶת וָ/שֶׁ֤מֶן וּ/דְבַשׁ֙ הֶֽאֱכַלְתִּ֔י/ךְ וּ/נְתַתִּ֧י/הוּ לִ/פְנֵי/הֶ֛ם לְ/רֵ֥יחַ נִיחֹ֖חַ וַ/יֶּ֑הִי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/019.yaml
  text: And my bread that I gave you—fine flour[a], oil, and honey with which I fed you—you set before them as a pleasing aroma, and so it was[c][b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 我赐给你的食物[a]——细面、油和蜜，就是我用来喂养你的；你却把它摆在它们面前，作为馨香之气[b]。事情就是这样——这是主耶和华[c]的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “食物”直译为“饼”；希伯来文“饼”有时可泛指食物。
    reason: lexical_alternative
  - marker: b
    text: “馨香之气”是献祭的惯用语；这里用来描述献给偶像的东西，带有反讽意味。
    reason: cultural_note
  - marker: c
    text: “主耶和华”对应希伯来文 אֲדֹנָי יְהוִה；其中“耶和华”是神圣四字名 יְהוָה 的传统中文译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחְמִי
  choice: 我的食物
  rationale: לֶחֶם本义常为“饼”，也可泛指食物；下文列出细面、油和蜜，因此正文采用自然的统称“食物”，并在脚注保留直译。
- source_word: סֹלֶת
  choice: 细面
  rationale: 指精制的上等面粉，也是献祭语境中的常用物品；“细面”简洁并保留礼仪色彩。
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原文只说“油”；虽很可能是橄榄油，但不在正文中增添原文未明说的信息。
- source_word: דְבַשׁ
  choice: 蜜
  rationale: 保留该词通常的含义，同时不武断判定是蜂蜜还是果蜜、糖浆。
- source_word: הֶאֱכַלְתִּיךְ
  choice: 我用来喂养你的
  rationale: 使役形直译为“我使你吃”，汉语以“喂养”自然表达上帝供应食物的意思。
- source_word: וּנְתַתִּיהוּ
  choice: 你却把它摆在
  rationale: 语境表明主语转为受责备的耶路撒冷；“却”体现把上帝所赐之物转献偶像的反差，而不另加具体行为。
- source_word: לִפְנֵיהֶם
  choice: 在它们面前
  rationale: 保留原文代词，不在正文中直接改写为“偶像”；中文用“它们”与无生命的偶像相称。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 作为馨香之气
  rationale: 保留旧约献祭用语及其在此处针对偶像崇拜的反讽意味。
- source_word: וַיֶּהִי
  choice: 事情果然如此
  rationale: 表达对前述指控的确认，比单纯“事情发生了”更符合此处简短而强调的语气。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知宣告公式；“主耶和华”在中文中区分 אֲדֹנָי 与神圣四字名，并避免“主主”的生硬重复。
theological_decisions:
- issue: 祭祀用语被用于偶像崇拜
  choice: 作为馨香之气
  alternative: 作为令人悦纳的香气
  rationale: 沿用献祭术语，让原文尖锐的反讽自行显明，不在正文中解释或淡化。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文读者最熟悉的传统音译，同时以脚注说明这是希伯来文神圣四字名；不将 אֲדֹנָי יְהוִה 简化为普通称号。
- issue: וַיֶּהִי 的确认作用
  choice: 事情果然如此
  alternative: 事情就是这样
  rationale: 保留这句对指控真实性的郑重确认，不把它解释为新的事件或结果。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“细面”“馨香之气”“宣告”保留先知文体与祭祀语域；句法适度拆分，使指控、确认和神谕公式层次清楚。
