  text: וְ/הִנֵּ֨ה נָטִ֤יתִי יָדִ/י֙ עָלַ֔יִ/ךְ וָ/אֶגְרַ֖ע חֻקֵּ֑/ךְ וָ/אֶתְּנֵ֞/ךְ בְּ/נֶ֤פֶשׁ שֹׂנְאוֹתַ֨יִ/ךְ֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים הַ/נִּכְלָמ֖וֹת מִ/דַּרְכֵּ֥/ךְ זִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/027.yaml
  text: And behold[a], I stretched out my hand against you, and I reduced your allotted portion, and gave you over to the desire of those who hate you, the daughters of the Philistines[c][b], who are ashamed of your lewd way.
translation:
  language: zh_hans
  text: 看哪，我伸手攻击你，削减了你所得的份额[a]，又把你交给恨你的非利士众女儿[b]，任凭她们随意处置[c]；她们因你淫荡的行径而羞愧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你所得的份额”也可译作“你应得的”“你的供给”或“你的定额”；希伯来语原词可指规定或分配所得之物。
    reason: lexical_alternative
  - marker: b
    text: “非利士众女儿”保留了先知书把民族或城邑人格化为女儿的说法。
    reason: cultural_note
  - marker: c
    text: “任凭她们随意处置”直译为“交给恨你的人的欲望（或意愿）”；希伯来语表达中有“魂”一词，在这里指欲望或意愿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意的指示语气，并采用庄重而通行的现代汉语圣经表达。
- source_word: נָטִיתִי יָדִי עָלַיִךְ
  choice: 我伸手攻击你
  rationale: 保留希伯来文“伸手”的审判意象；“攻击”明确表达介词所示的敌对方向，而不具体化为某一种惩罚。
- source_word: וָאֶגְרַע חֻקֵּךְ
  choice: 削减了你所得的份额
  rationale: גרע 表示减少、削减；חק 在此可指规定或分配所得之物。“所得的份额”保留其范围，不将其限定为口粮、土地或贡赋。
- source_word: וָאֶתְּנֵךְ
  choice: 把你交给
  rationale: 在惩罚语境中，נתן 不只是一般的“给”，而有交付于敌对者的含义。
- source_word: בְּנֶפֶשׁ שֹׂנְאוֹתַיִךְ
  choice: 任凭她们随意处置
  rationale: נפש 在此可表达愿望、欲求或意志；该译法自然呈现受制于仇敌意愿的意思，同时以脚注保留直译可能。
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: 非利士众女儿
  rationale: 保留先知文学把民族或城邑人格化为“女儿”的表达，避免误解为仅指个别非利士妇女。
- source_word: הַנִּכְלָמוֹת מִדַּרְכֵּךְ זִמָּה
  choice: 她们尚且因你淫荡的行径而羞愧
  rationale: נכלמות 表示感到羞愧；דרך זמה 指带有淫乱及道德败坏色彩的行为方式。“尚且”传达连敌对的非利士众女儿也以此为耻的反衬，但不改变命题内容。
theological_decisions:
- issue: 先知性寓言中的审判和淫乱意象
  choice: 保留上帝第一人称的敌对行动，以及指控耶路撒冷淫乱的性—道德隐喻
  alternative: 将其泛化为抽象的惩罚与一般邪恶
  rationale: 本节属于以婚姻不忠描绘圣约背叛的连续寓言。保留两类意象才能维持原文的控诉力度，又不额外引入特定宗派解释。
- issue: בְּנֶפֶשׁ 的语义关系
  choice: 正文译作“任凭她们随意处置”，脚注注明“照恨你的人的欲望/意愿”
  alternative: 译作“交在恨你的人的权下”
  rationale: 原词明确涉及 נפש（欲望、意愿），却不直接使用“权力”一词；因此不把敌方控制这一语境推论提升为词面意义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留先知宣告的提示力；“淫荡的行径”保持原文强烈的性与道德指控。“众女儿”略带文学色彩，但为保存原有拟人意象所必需，并以脚注解释。
