source:
  edition: WLC
  text: וְ/שָׂרְפ֤וּ בָתַּ֨יִ/ךְ֙ בָּ/אֵ֔שׁ וְ/עָשׂוּ בָ֣/ךְ שְׁפָטִ֔ים לְ/עֵינֵ֖י נָשִׁ֣ים רַבּ֑וֹת וְ/הִשְׁבַּתִּי/ךְ֙ מִ/זּוֹנָ֔ה וְ/גַם אֶתְנַ֖ן לֹ֥א תִתְּנִי עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/041.yaml
  text: They will burn your houses with fire and execute judgments against you before the eyes of many women[a]. I will put a stop to your prostitution[c][b], and you will no longer give payment.
translation:
  language: zh_hans
  text: 他们要放火焚烧你的房屋，在许多妇女眼前对你施行审判。我要使你不再卖淫[a]，你也不再给出卖淫的酬金[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不再作妓女。”
    reason: 希伯来语形式既可从行为角度理解为停止卖淫，也可从身份或角色角度理解为不再作妓女。
  - marker: b
    text: “卖淫的酬金”指与卖淫有关的报酬。这里是她把钱给别人，而不是收钱。
    reason: 说明אֶתְנַן的专门含义，并保留本章语境中特意呈现的角色倒置。
lexical_decisions:
- source_word: וְשָׂרְפוּ בָתַּיִךְ בָּאֵשׁ
  choice: 他们要放火焚烧你的房屋
  rationale: 动词在先知审判的语境中表示将发生的行动；“放火焚烧”自然表达 בָּאֵשׁ 的工具意义，并保留具体的毁灭图景。
- source_word: וְעָשׂוּ בָךְ שְׁפָטִים
  choice: 对你执行判罚
  rationale: עשה 与 שְׁפָטִים 构成司法性表达，指实施判决所定的惩罚；“执行判罚”兼顾法律色彩和现代汉语的自然度。
- source_word: לְעֵינֵי נָשִׁים רַבּוֹת
  choice: 在许多妇女眼前
  rationale: 较为直接地保留“在……眼前”的表达以及公开受辱的意象。
- source_word: וְהִשְׁבַּתִּיךְ מִזּוֹנָה
  choice: 我要使你不再卖淫
  rationale: 使役式动词表达“使……停止”，后面的形式可理解为停止卖淫或不再作妓女；正文采用自然且不淡化原有性隐喻的表达。
- source_word: אֶתְנַן
  choice: 淫资
  rationale: 该词特指与卖淫有关的酬金。此处耶路撒冷反常地把这种钱给别人，因此用较概括的“淫资”，避免误写成她收取报酬。
- source_word: לֹא תִתְּנִי עוֹד
  choice: 你也不再给人
  rationale: 否定词与 עוֹד 表示此后停止该行为；补出“人”使汉语宾语关系清楚，同时不具体限定收款者身份。
theological_decisions:
- issue: 以卖淫比喻耶路撒冷对上帝的不忠
  choice: 在正文中明确保留“卖淫”的隐喻
  alternative: 弱化为“不忠”或“拜偶像”
  rationale: 本节有意使用强烈的性隐喻描写盟约背叛；抽象化会削弱原文修辞，也会提前替读者解释其神学指向。
- issue: 耶路撒冷反常地向情人支付淫资
  choice: 保留“给人淫资”这一反常方向
  alternative: 按通常卖淫情形译为“收取卖淫所得”
  rationale: 希伯来文明确使用第二人称阴性单数的“给”，承接本章前文所强调的角色倒置，不应按常见社会情形加以改写。
translation_notes:
  register: 采用现代、庄重而直白的书面汉语。保留以阴性第二人称指向耶路撒冷的语境，不另加解释性称谓；性隐喻不作委婉淡化。“执行判罚”保留司法意味，“淫资”则以脚注说明其专门语义及此处反常的支付方向。
