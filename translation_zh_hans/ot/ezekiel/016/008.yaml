  text: וָ/אֶעֱבֹ֨ר עָלַ֜יִ/ךְ וָ/אֶרְאֵ֗/ךְ וְ/הִנֵּ֤ה עִתֵּ/ךְ֙ עֵ֣ת דֹּדִ֔ים וָ/אֶפְרֹ֤שׂ כְּנָפִ/י֙ עָלַ֔יִ/ךְ וָ/אֲכַסֶּ֖ה עֶרְוָתֵ֑/ךְ וָ/אֶשָּׁ֣בַֽע לָ֠/ךְ וָ/אָב֨וֹא בִ/בְרִ֜ית אֹתָ֗/ךְ נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה וַ/תִּ֥הְיִי לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/008.yaml
  text: When I passed by you and saw you[a], behold, your time was the time for love. So I spread the edge of my garment over you and covered your nakedness. I swore myself to you and entered into a covenant with you, declares the Lord GOD[b], and you became mine.
translation:
  language: zh_hans
  text: “我从你身旁经过，看见你。看哪，你正到了情爱之时[b]。我便把衣襟搭在你身上[a]，遮盖你的赤身。我向你起誓，与你立约——这是主雅威的宣告——你就归了我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“衣襟”的希伯来语词，字面义为“翅膀”，也可指衣服的边缘；把衣襟搭在某人身上，在这里含有婚姻中的保护和认领之意。
    reason: lexical_alternative
  - marker: b
    text: “情爱之时”也可译作“爱抚之时”或“欢爱之时”；希伯来语在这个婚姻比喻中带有浪漫和性爱意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: 我从你身旁经过
  rationale: עבר על表示从某人身旁经过；原文没有明确表达“再次”，因此不补入。
- source_word: וָאֶרְאֵךְ וְהִנֵּה
  choice: 看见你。看哪
  rationale: ראה直译为“看见”；הִנֵּה用“看哪”保留引人注意的鲜明语气。
- source_word: עִתֵּךְ עֵת דֹּדִים
  choice: 你的年华正是爱情萌发之时
  rationale: עֵת表示时候、时期；דֹּדִים兼有爱情、爱抚及性爱意味。此处以婚姻为喻，“爱情萌发之时”自然地表达女子已到婚恋阶段，同时不消除原文的情爱意味。
- source_word: וָאֶפְרֹשׂ כְּנָפִי עָלַיִךְ
  choice: 我便把我的衣襟铺在你身上
  rationale: כָּנָף本义为“翅膀”，也指衣服的边缘、衣襟；在婚姻语境中，铺衣襟于其上象征保护与婚姻认领。正文采用现代汉语较易理解的“衣襟”，脚注保留字面意象。
- source_word: וָאֲכַסֶּה עֶרְוָתֵךְ
  choice: 遮盖你的赤身
  rationale: עֶרְוָה指赤身、裸露，也带有羞耻意味；“遮盖你的赤身”保留具体形象。
- source_word: וָאֶשָּׁבַע לָךְ
  choice: 我向你起誓
  rationale: 这是向某人起誓的常用表达；译文自然，也保留婚约语境中的郑重承诺。
- source_word: וָאָבוֹא בִבְרִית אֹתָךְ
  choice: 与你立约
  rationale: 希伯来语字面为“与你进入盟约”；现代汉语以“与你立约”最为自然、准确。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知性宣告公式；אֲדֹנָי יְהוִה译为传统且清楚的“主耶和华”。
- source_word: וַתִּהְיִי לִי
  choice: 你就归了我
  rationale: 原文直译为“你就成了属我的”；“归了我”简洁保留婚姻盟约中的归属关系，不额外明说“妻子”。
theological_decisions:
- issue: 婚姻盟约意象与情爱语言
  choice: 保留爱情、遮盖赤身、起誓和立约等婚姻盟约意象
  alternative: 淡化为一般关爱，或强化为明确的性交描写
  rationale: 本节以婚姻描绘耶和华与耶路撒冷所立的约。译文既不应抹去其中的情爱和身体意象，也不应使其比原文更露骨。
- issue: כָּנָף在婚姻语境中的多义性
  choice: 正文译“衣襟”，脚注注明字面可作“翅膀”
  alternative: 正文直译“翅膀”
  rationale: “衣襟”使现代读者能理解具体动作及婚姻象征；脚注保留原词所唤起的庇护意象。
- issue: 神圣称号אֲדֹנָי יְהוִה
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”既区分אֲדֹנָי与יהוה，又符合现代中文圣经语体；不在正文中额外解释神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“看哪”和“这是主耶和华的宣告”保留先知文本的郑重语气；正文不过度古雅，也不回避原文的婚姻和身体意象。脚注标记均紧随所解释的词语。
