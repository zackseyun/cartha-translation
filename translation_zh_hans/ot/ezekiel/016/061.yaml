source:
  edition: WLC
  text: וְ/זָכַ֣רְתְּ אֶת דְּרָכַיִ/ךְ֮ וְ/נִכְלַמְתְּ֒ בְּ/קַחְתֵּ֗/ךְ אֶת אֲחוֹתַ֨יִ/ךְ֙ הַ/גְּדֹל֣וֹת מִמֵּ֔/ךְ אֶל הַ/קְּטַנּ֖וֹת מִמֵּ֑/ךְ וְ/נָתַתִּ֨י אֶתְ/הֶ֥ן לָ֛/ךְ לְ/בָנ֖וֹת וְ/לֹ֥א מִ/בְּרִיתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/061.yaml
  text: Then you will remember your ways and be ashamed when you receive your sisters[a], those older than you along with those younger than you; and I will give them to you as daughters[b], but not because of your covenant.
translation:
  language: zh_hans
  text: 那时，当你接纳你的姐妹[a]——比你年长的和比你年幼的——时，你必想起自己所行的，并感到羞愧；我要把她们赐给你作女儿，却不是出于你的约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当你领受你的姐妹，就是那些比你年长的和比你年幼的。”
    reason: בְּקַחְתֵּךְ可按时间关系理解为“当你领受时”，而לקח也可较直译为“领受、取来”。
  - marker: b
    text: “不是出于你的约”表明，这些姐妹被赐给耶路撒冷作女儿，并非源自或根据耶路撒冷自己的约；原文没有进一步说明这里具体指哪一约。
    reason: 说明末句的来源或根据含义，同时保留所指之约的含混性。
lexical_decisions:
- source_word: וְזָכַרְתְּ אֶת־דְּרָכַיִךְ
  choice: 那时，你必想起自己所行的
  rationale: וְזָכַרְתְּ在预言语境中表达随前文而来的将来结果；“那时”体现承接关系。“自己所行的”自然传达דְּרָכַיִךְ的道德行为含义，同时不削弱其概括性。
- source_word: וְנִכְלַמְתְּ
  choice: 并且羞愧
  rationale: נכלם表示蒙羞、惭愧；此处既包含因过往行为而羞愧，也可带有受辱意味。“羞愧”简洁自然，并保留语义张力。
- source_word: בְּקַחְתֵּךְ אֶת־אֲחוֹתַיִךְ
  choice: 因为你接纳了你的姐妹
  rationale: ב加不定式可表示时间或伴随情境，也可在上下文中呈现引发羞愧的缘由；לקח基本义为“取、领受”。“接纳”符合恢复关系的语境，脚注保留“当你领受”这一较形式对应的可能。
- source_word: הַגְּדֹלוֹת מִמֵּךְ אֶל־הַקְּטַנּוֹת מִמֵּךְ
  choice: 那些比你年长的和比你年幼的
  rationale: גדלות和קטנות字面为“较大的”和“较小的”；在姐妹隐喻中，以“年长、年幼”表达最自然。אֶל在此连接两组对象，译作“和”。
- source_word: וְנָתַתִּי אֶתְהֶן לָךְ לְבָנוֹת
  choice: 我要把她们赐给你作女儿
  rationale: 保留神主动赐予以及姐妹转为女儿的家族隐喻；“作女儿”自然对应לְבָנוֹת。
- source_word: וְלֹא מִבְּרִיתֵךְ
  choice: 却不是出于你的约
  rationale: מִ可表达来源或根据。“出于”贴近该含义，又避免把这句话展开为特定的系统神学解释；“却”明确其与神赐予行动之间的转折。
theological_decisions:
- issue: 末句“你的约”的含义
  choice: 不是出于你的约
  alternative: 不是凭你的约／不在你的约之内
  rationale: 原文否定这些姐妹被赐作女儿是从耶路撒冷之约而来或以此为根据。译文保留这种否定，不进一步断定该约具体指哪一约，也不引入功德论等经文本身未明说的体系。
- issue: “姐妹”成为“女儿”的隐喻张力
  choice: 按原文保留姐妹与女儿两个不同关系称谓
  alternative: 解释为附属于耶路撒冷的城邑或民众
  rationale: 本章的家族隐喻具有修辞和神学意义；直接解释会消除原文刻意形成的关系变化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“自己所行的”比直译“你的道路”更符合当代汉语的道德语境；家族称谓“姐妹、女儿”则按原文保留。句法以分号和解释性短语呈现希伯来文连续结构，避免过度拆解。
