  text: וָ/אֶעֱבֹ֤ר עָלַ֨יִ/ךְ֙ וָֽ/אֶרְאֵ֔/ךְ מִתְבּוֹסֶ֖סֶת בְּ/דָמָ֑יִ/ךְ וָ/אֹ֤מַר לָ/ךְ֙ בְּ/דָמַ֣יִ/ךְ חֲיִ֔י וָ/אֹ֥מַר לָ֖/ךְ בְּ/דָמַ֥יִ/ךְ חֲיִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/006.yaml
  text: And I passed by you and saw you wallowing in your blood[a], and I said to you, ‘In your blood, live!’ Yes, I said to you, ‘In your blood[b], live!’
translation:
  language: zh_hans
  text: 我从你身旁经过，看见你在你的血中挣扎。于是我对你说：‘在你的血中，要活下去！’[a] 我又对你说：‘在你的血中，要活下去！’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按语境译：“你虽在血中，仍要活下去！”希伯来语介词在此可理解为处境性用法，也可能带有让步意味。
    reason: alternative_reading
  - marker: b
    text: “在你的血中，要活下去！”这句话在希伯来原文中重复了一遍，以加强语气。
    reason: repetition
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: 我从你身旁经过
  rationale: עבר与על连用，在这里描写从弃婴身旁经过；这样翻译自然地保留了叙事中的移动场景。
- source_word: וָאֶרְאֵךְ
  choice: 看见你
  rationale: 直译ראה的普通意义，不加入“察看”等额外意味。
- source_word: מִתְבּוֹסֶסֶת
  choice: 挣扎
  rationale: 该词描绘新生儿倒卧血中、无助地扭动；“挣扎”在现代汉语中形象自然，又避免“打滚”可能带来的主动或贬斥意味。
- source_word: בְּדָמָיִךְ
  choice: 在自己的血中／在血中
  rationale: 希伯来语复数形式在此自然译作单数“血”；保留介词所表达的处境和鲜明意象，不明确限定为产血或流血。
- source_word: וָאֹמַר לָךְ
  choice: 于是我对你说／我又对你说
  rationale: 保留אמר加间接宾语的基本意义；第二次用“又”清楚呈现原文重复。
- source_word: בְּדָמַיִךְ חֲיִי
  choice: 你虽在血中，仍要活下去！
  rationale: 介词ב在这一紧缩语境中可带让步意味；汉语若机械译作“在血中，活吧”容易被误解为命令其继续留在血中，因此正文采用自然而有力的让步表达，同时脚注保留较形式对应的译法。
theological_decisions:
- issue: ב在בְּדָמַיִךְ חֲיִי中的语义作用
  choice: 正文按语境译为让步：“你虽在血中，仍要活下去！”
  alternative: 较形式对应地译为：“你在血中，要活下去！”
  rationale: 希伯来语结构简短，介词既可保留处境性的“在……中”，也可在语境中理解为让步。正文选用现代汉语较清楚的让步表达，但用脚注呈现另一译法，以保留原文的张力而不把歧义隐藏起来。
- issue: 命令语气חֲיִי所表达的神圣宣告
  choice: 译作“仍要活下去！”
  alternative: “活吧！”或“存活！”
  rationale: 该阴性单数祈使式既是命令，也是赋予生命的有力宣告；“要活下去”在现代汉语中兼具命令力度和生命延续之意，不额外规定其系统神学含义。
- issue: 整句的重复
  choice: 完整重复神的话，并以“又”连接
  alternative: 合并为一句或写作“我再三说”
  rationale: 原文逐字重复核心宣告，具有强烈的修辞和神学分量；完整保留优于概括或删减。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“从你身旁经过”保持叙事自然；“挣扎”传达弃婴在血中的无助动作。“仍要活下去”有力但不古奥。所有第二人称均为女性单数所指的拟人化耶路撒冷，汉语正文不强行标出语法性别。
