base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/040.yaml
  text: They will bring up an assembly against you[b][a], and they will stone you and cut you down with their swords.
translation:
  language: zh_hans
  text: 他们必召集一群人来攻击你，用石头打死你，又用他们的刀剑把你砍成碎块。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “砍成碎块”也可译作“用刀剑猛烈地劈砍你”；原文动词表示强烈、反复的砍切。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלוּ עָלַיִךְ קָהָל
  choice: 他们要召集一群人来攻击你
  rationale: 使役形态的עלה与עַל在此表达聚集一群人对受审者采取敌对行动。“召集……来攻击你”符合现代汉语，也保留公开聚众施罚的场景；קָהָל译为“一群人”，避免赋予宗教性“会众”的意味。
- source_word: וְרָגְמוּ אוֹתָךְ בָּאָבֶן
  choice: 用石头打死你
  rationale: רגם指以石头击打，语境是致死性的公开刑罚；汉语“用石头打死”比“用石头击打”更自然，并明确该动词在此处的处决意味。
- source_word: וּבִתְּקוּךְ
  choice: 把你砍碎
  rationale: בתק表示猛烈劈砍、砍裂，力度强于一般的“砍倒”。“砍碎”保留其残酷的肢解意味，同时不额外指定身体部位。
- source_word: בְּחַרְבוֹתָם
  choice: 用刀剑
  rationale: 介词בְּ标示工具，复数חַרְבוֹת及复数物主后缀表示他们所持的刀剑；现代汉语以“用刀剑”自然表达。
theological_decisions:
- issue: 惩罚场景兼具司法处决和军事暴力色彩
  choice: 保留聚众、用石头处死和刀剑砍杀的连续意象
  alternative: 笼统译成军队围攻或杀害
  rationale: 本节既让人联想到群体执行刑罚，也带有攻城杀戮的色彩；译文不把这种张力单方面归为纯司法或纯军事场景。
translation_notes:
  register: 采用庄重而直白的现代标准汉语。保留第二人称女性化耶路撒冷所承受的公开暴力审判，但汉语代词不标性别；避免宗派术语和不必要的委婉化。
