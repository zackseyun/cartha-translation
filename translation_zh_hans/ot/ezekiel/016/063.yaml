id: EZK.16.63
reference: Ezekiel 16:63
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְמַ֤עַן תִּזְכְּרִי֙ וָ/בֹ֔שְׁתְּ וְ/לֹ֨א יִֽהְיֶה לָּ֥/ךְ עוֹד֙ פִּתְח֣וֹן פֶּ֔ה מִ/פְּנֵ֖י כְּלִמָּתֵ֑/ךְ בְּ/כַפְּרִ/י לָ/ךְ֙ לְ/כָל אֲשֶׁ֣ר עָשִׂ֔ית נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/063.yaml
  text: so that you may remember and be ashamed[a], and no longer have any opening of the mouth because of your disgrace, when I make atonement for you for all that you have done[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 好使你回想起来，感到羞愧，并且因自己的耻辱再也无从开口[a]；当我为你的一切所作所为施行赎罪时[b]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“再也没有开口之处”。这是一个希伯来语习语，可指再没有理由、余地或胆量开口。
    reason: 保留原文“开口”的具体意象，并避免把习语限缩为仅指辩解。
  - marker: b
    text: 也可译作“当我为你赎罪时”。这里的希伯来语使用“赎罪”的词，不只是泛指赦免。
    reason: 说明时间性表达的另一种简译，并保留כפר的赎罪与和好含义。
lexical_decisions:
- source_word: לְמַעַן תִּזְכְּרִי
  choice: 好使你回想起来
  rationale: לְמַעַן引出目的或结果；阴性单数动词所指的是被拟人化的耶路撒冷。“回想起来”自然表达对既往行为的追忆。
- source_word: וָבֹשְׁתְּ
  choice: 感到羞愧
  rationale: בוש在此表示因自己的行为而羞愧，不必强化为被别人羞辱。
- source_word: פִּתְחוֹן פֶּה
  choice: 无言可辩
  rationale: 该希伯来语习语直译为“开口之处”，在语境中指没有开口辩解或自我申诉的余地；正文采用自然汉语，脚注保留原有意象。
- source_word: מִפְּנֵי כְּלִמָּתֵךְ
  choice: 因自己的耻辱
  rationale: מִפְּנֵי在此取原因义；כְּלִמָּה指羞耻、受辱或蒙羞的处境，“耻辱”保留其公开蒙羞的色彩。
- source_word: בְּכַפְּרִי לָךְ
  choice: 在我……为你赎罪时
  rationale: בְּ加不定式结构按时间关系处理。כפר保留赎罪、除罪及关系修复的分量，不弱化成一般性的“原谅”。
- source_word: לְכָל אֲשֶׁר עָשִׂית
  choice: 就你所做的一切
  rationale: 介词לְ在这里标明赎罪所关涉的范围；这一表达既涵盖全部过犯，又不在正文额外补入原文没有明说的名词。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知书常见的神谕宣告公式；אֲדֹנָי יְהוִה译为“主耶和华”，既区分称号与专名，也符合庄重而易懂的现代中文。
theological_decisions:
- issue: כפר在上帝恢复耶路撒冷的语境中如何表达
  choice: 为你赎罪
  alternative: 赦免你；遮盖你；除去你的罪
  rationale: 原词带有赎罪及修复关系的宗教分量。正文保留“赎罪”，却不说明本节未交代的具体机制，也不把它简化为一般的宽恕。
- issue: בְּכַפְּרִי所表达的逻辑关系
  choice: 在……时
  alternative: 因为；借着
  rationale: 该结构可承载时间或伴随关系；上下文适合时间性理解。脚注提示其表述方式，避免把赎罪与人的羞愧之间的神学关系解释得过满。
- issue: 神名与复合称号אֲדֹנָי יְהוִה
  choice: 主耶和华
  alternative: 主雅威；至高的主
  rationale: “主耶和华”在现代汉语圣经语体中庄重且可辨认，同时呈现אֲדֹנָי的称号与יהוה的专名，不将二者合并为单一称号。
translation_notes:
  register: 采用现代、庄重、易懂的简体中文。对被拟人化的耶路撒冷使用第二人称“你”；正文以“无言可辩”自然传达习语，同时用脚注保留字面意象。“你必如此”补明前面目的从句在中文中的落点，所指仍严格限于回想、羞愧和无言可辩，不增加新的事件。
