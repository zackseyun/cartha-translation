  text: הָ/אִשָּׁ֖ה הַ/מְּנָאָ֑פֶת תַּ֣חַת אִישָׁ֔/הּ תִּקַּ֖ח אֶת זָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/032.yaml
  text: The adulterous wife takes strangers instead of her husband[a].
translation:
  language: zh_hans
  text: 这通奸的妻子，竟接纳陌生男子来代替自己的丈夫。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这犯奸淫的女人，接纳别的男人，取代自己的丈夫。”
    reason: “妻子”也可译为“女人”；分词可译作“犯奸淫的”。“陌生男子”所译 זָרִים 也可按语境译为“别的男人”；“来代替”表达 תַּחַת 的替代关系。
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: 妻子
  rationale: 该词既可指“女人”，也可指“妻子”；下文明确提到“自己的丈夫”，因此婚姻语境中的“妻子”最准确自然。
- source_word: הַמְּנָאָפֶת
  choice: 通奸的
  rationale: 分词修饰“妻子”，表示她实施通奸；“通奸的妻子”直接、庄重，并保留原文的定性与指控力度。
- source_word: תַּחַת
  choice: 撇下……而
  rationale: 此处表示替代，即以别的男人取代丈夫。中文采用“撇下自己的丈夫，接纳……”自然呈现这种取代关系及背叛意味；脚注保留较形式对应的译法。
- source_word: אִישָׁהּ
  choice: 自己的丈夫
  rationale: 在婚姻语境中 אִישׁ 加第三人称阴性单数后缀意为“她的丈夫”；译作“自己的丈夫”也使中文所指清楚。
- source_word: תִּקַּח
  choice: 接纳
  rationale: לקח 基本义为“拿、取”，在此以男人为宾语并处于通奸语境，中文“接纳”比直译“拿”自然，同时不额外具体化行为。
- source_word: זָרִים
  choice: 别的男人
  rationale: זָרִים 指丈夫之外的陌生人或外人；本节性与婚姻语境表明所指为其他男人。“别的男人”现代自然，且避免“外邦人”所可能带入的族裔限定。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是希伯来语直接宾语标记，现代汉语无需对应的独立词语。
theological_decisions:
- issue: 以婚姻不忠描绘耶路撒冷的背约
  choice: 直接保留“通奸的妻子”“丈夫”“别的男人”等婚姻与性不忠意象。
  alternative: 将意象解释性改写为耶路撒冷背弃上帝、转向别神或列国。
  rationale: 本节处于以婚姻关系比喻盟约关系的长篇言说中。正文应保留先知原有的尖锐比喻，不把隐喻提前解释为单一的神学所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“竟”传达本句谴责语境中的反常与震惊感；不使用较陈旧且带标签色彩的“淫妇”。脚注标记已在正文中列出。
