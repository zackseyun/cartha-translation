  text: וַ/יֵּ֨צֵא לָ֥/ךְ שֵׁ֛ם בַּ/גּוֹיִ֖ם בְּ/יָפְיֵ֑/ךְ כִּ֣י כָּלִ֣יל ה֗וּא בַּֽ/הֲדָרִ/י֙ אֲשֶׁר שַׂ֣מְתִּי עָלַ֔יִ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/014.yaml
  text: And your fame went out among the nations because of your beauty[a], for it was perfect through my splendor that I had set upon you, declares the Lord GOD.
translation:
  language: zh_hans
  text: 你的名声[a]因你的美丽传遍列国；你的美丽因我加在你身上的华美而完美无缺。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你的名传遍列国”，意思是你的声誉或名声广为传播。
    reason: 说明原文保留“名出去”的希伯来语意象，而正文采用自然汉语表达其习语含义。
lexical_decisions:
- source_word: וַיֵּצֵא לָךְ שֵׁם
  choice: 你的名声传遍
  rationale: 字面是“你的名出去”，这是指名声或声誉传播开来。“名声传遍”既表达该习语的含义，也保留向列国广传的动态。
- source_word: בַּגּוֹיִם
  choice: 列国
  rationale: 这里泛指周围各国；“列国”简洁、庄重，也避免引入后期带特定宗教含义的“外邦人”。
- source_word: בְּיָפְיֵךְ
  choice: 因你的美丽
  rationale: 介词 ב 在此表示原因：名声是由于她的美丽而传播。
- source_word: כָּלִיל הוּא
  choice: 你的美丽……完美无缺
  rationale: כָּלִיל 表示完整、完美。希伯来语阳性代词 הוּא 最自然地回指阳性名词 יֹפִי（美丽）；在中文中补出“你的美丽”，使指代清楚而不改变意义。
- source_word: בַּהֲדָרִי
  choice: 因……我的华美
  rationale: הָדָר 可指华美、荣美或威荣；本段描写上帝赐给耶路撒冷的装饰与美貌，因此“华美”最贴合语境。介词 ב 表明她的完美源于上帝的华美。
- source_word: אֲשֶׁר שַׂמְתִּי עָלַיִךְ
  choice: 我加在你身上的
  rationale: שׂים עַל 字面为“放在……之上”。“加在你身上”保留上帝把华美赋予她的具体意象，同时符合现代汉语表达。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 是先知书常见的神谕宣告格式；“宣告”庄重而清楚。אֲדֹנָי יְהוִה 译作“主耶和华”，既区分“主”这一称号与神名，也符合现代中文圣经语体。
theological_decisions:
- issue: 耶路撒冷之美的来源
  choice: 你的美丽因我加在你身上的华美而完美无缺
  alternative: 我加在你身上的华美使它完美无缺
  rationale: 原文强调她的美并非自身独有，而是因上帝所赋予的华美才达到完全。译文保留这种赐予关系，不把“华美”解释成某一种特定恩赐。
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时有称号 אֲדֹנָי 与神名 יהוה。采用现代中文读者较熟悉的“主耶和华”，保留两者的区别；“雅威”是另一种可能的音译。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文以“名声传遍”自然呈现希伯来语习语，并用分号连接名声传播与美丽来源这两个紧密相关的分句。“完美无缺”表达 כָּלִיל 的完整性含义，但不额外引入道德无罪的解释。
