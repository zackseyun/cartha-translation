  text: וַ/יְהִי בָ֨/ךְ הֵ֤פֶךְ מִן הַ/נָּשִׁים֙ בְּ/תַזְנוּתַ֔יִ/ךְ וְ/אַחֲרַ֖יִ/ךְ לֹ֣א זוּנָּ֑ה וּ/בְ/תִתֵּ֣/ךְ אֶתְנָ֗ן וְ/אֶתְנַ֛ן לֹ֥א נִתַּן לָ֖/ךְ וַ/תְּהִ֥י לְ/הֶֽפֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/034.yaml
  text: 'And in your prostitution you were the opposite of other women: no one solicited you[a], but you gave payment, and no payment was given to you; so you became the opposite.'
translation:
  language: zh_hans
  text: 你在卖淫的事上与别的女人正好相反：没有人来找你卖淫[a]；反倒是你给人报酬，却没有人给你报酬；你就成了反常的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“在你之后，没有人卖淫”。这里指与通常的妓女不同，没有人主动来寻求你；反倒是你付给人报酬。
    reason: 说明希伯来文不寻常的表达及其在上下文中的含义。
lexical_decisions:
- source_word: הֵפֶךְ / לְהֶפֶךְ
  choice: 正好相反 / 相反的情形
  rationale: 该词表示颠倒、反转。首尾都保留“相反”，重现原文的重复框架，并突出通常卖淫交易被倒置的讽刺。
- source_word: תַזְנוּתַיִךְ
  choice: 你卖淫的做法
  rationale: 原词指卖淫行为；这里处于以性不忠描写耶路撒冷背信的延伸隐喻中。此译保留原文直白而尖锐的性意象，同时符合现代汉语表达。
- source_word: וְאַחֲרַיִךְ לֹא זוּנָה
  choice: 没有人追着你行淫
  rationale: 较直译为“在你后面，没有人卖淫”。结合上下文，意思是没有人像寻求普通妓女那样主动追求她。正文保留原句异常的表达力度，脚注说明其语境含义。
- source_word: אֶתְנָן
  choice: 嫖资
  rationale: 该名词专指与卖淫有关的报酬。“嫖资”在现代汉语中明确、简洁，并能在给予和收取两个分句中维持同一词语的对照。
- source_word: וּבְתִתֵּךְ אֶתְנָן
  choice: 反倒是你付给别人嫖资
  rationale: 介词加不定式说明造成反常局面的情形：她不但没有收钱，反而向对方付钱。“反倒是”自然呈现上下文的逆转。
- source_word: וְאֶתְנַן לֹא נִתַּן לָךְ
  choice: 却没有人付嫖资给你
  rationale: 以主动式自然表达希伯来文的被动句，同时重复“嫖资”，保留原文刻意形成的交易对照。
- source_word: וַתְּהִי
  choice: 你就成了
  rationale: 该动词引出由前述行为导致的结果；“就”清楚而自然地体现结果关系。
theological_decisions:
- issue: 用卖淫的性意象描写耶路撒冷的不忠
  choice: 在正文中直接保留卖淫隐喻
  alternative: 在正文中弱化为“不忠”或“拜偶像”
  rationale: 以西结有意采用令人震动的性意象描绘耶路撒冷的背信。翻译应保留这种修辞张力，不把它解释性地化约成较温和的抽象说法。
translation_notes:
  register: 采用现代、庄重而直白的标准普通话。保留本节刻意尖锐的卖淫与付费意象，并以“正好相反……相反的情形”重现原文首尾呼应。
