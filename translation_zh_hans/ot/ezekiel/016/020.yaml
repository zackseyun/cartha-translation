base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/020.yaml
  text: And you took your sons and your daughters, whom you had borne to me, and sacrificed them to them as food. Was your prostitution too small a thing?
translation:
  language: zh_hans
  text: 你又把你给我生的儿子和女儿献给那些偶像，作它们的食物。你的淫乱难道还算小事吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּזְבָּחִים
  choice: 献给
  rationale: 该词在此指献祭、宰献；结合儿女被给偶像作食物的语境，用“献给”自然表达祭献含义，同时避免补入原文未明说的方式。
- source_word: לָהֶם לֶאֱכוֹל
  choice: 给它们作食物
  rationale: 直译为“给它们吃”；这里表示儿女作为祭物供偶像吞吃。“作食物”贴近原文，也保留其骇人的拟人化意象。
- source_word: תזנתך
  choice: 你的淫乱
  rationale: 本章以婚姻隐喻描写耶路撒冷的属灵不忠；“淫乱”既保留性隐喻，也不把含义缩窄为一般的“背叛”。
- source_word: הַמְעַט
  choice: 还算小事吗
  rationale: 反问句字面意为“岂是小事吗”；加“还”承接前文罪行不断升级的语势。
- source_word: לִי
  choice: 为我
  rationale: 保留儿女属于说话者、是“为我所生”的婚姻隐喻，不改写成较解释性的“属于我”。
theological_decisions:
- issue: לָהֶם 的指称对象
  choice: 那些偶像／它们
  alternative: 他们／它们
  rationale: 希伯来语仅用第三人称复数代词，指向前文受崇拜的偶像。中文若只说“他们”容易误解为人，因此在首次出现处明示“那些偶像”，随后用“它们”；这是语境所需的指称澄清，并未引入额外神学判断。
- issue: 儿女“为我所生”的归属含义
  choice: 保留“为我所生”
  alternative: 你给我生的／本属于我的
  rationale: 原文处于耶和华与耶路撒冷的婚姻隐喻中。“为我所生”保留亲属关系及归属张力，不进一步解释其教义含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“儿女”简洁涵盖“儿子和女儿”；反问句保留原文的控诉力度。原文末句抄本形式略有拼写现象，但词义“你的淫乱”清楚，无需脚注。
