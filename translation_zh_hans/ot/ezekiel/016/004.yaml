source:
  edition: WLC
  text: וּ/מוֹלְדוֹתַ֗יִ/ךְ בְּ/י֨וֹם הוּלֶּ֤דֶת אֹתָ/ךְ֙ לֹֽא כָרַּ֣ת שָׁרֵּ֔/ךְ וּ/בְ/מַ֥יִם לֹֽא רֻחַ֖צְתְּ לְ/מִשְׁעִ֑י וְ/הָמְלֵ֨חַ֙ לֹ֣א הֻמְלַ֔חַתְּ וְ/הָחְתֵּ֖ל לֹ֥א חֻתָּֽלְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/004.yaml
  text: And as for your birth[a], on the day you were born your cord was not cut, and you were not washed with water for cleansing; you were not rubbed with salt[c][b], and you were not wrapped in cloths.
translation:
  language: zh_hans
  text: 至于你的出生：你诞生的那一天，没有人剪断你的脐带，也没有人用水洗净你[a]；没有人用盐擦你[b]，也没有人用布把你裹起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洗净你”所据的希伯来语词十分少见，也可理解为“把你擦洗干净”或“使你的皮肤平滑”。
    reason: lexical_alternative
  - marker: b
    text: 这是古代照料新生儿的一种做法，即用盐擦婴儿的身体。
    reason: cultural_note
lexical_decisions:
- source_word: מוֹלְדוֹתַיִךְ
  choice: 你的出生
  rationale: 该复数形式在这里惯用地指向出生及其情形；上下文随即描写诞生当天，因此译为“你的出生”最自然，也不扩大为较宽泛的“你的来历”。
- source_word: בְּיוֹם הוּלֶּדֶת אֹתָךְ
  choice: 你诞生的那一天
  rationale: 准确表达时间从句，同时以现代汉语自然的方式保留出生叙事的庄重语气。
- source_word: שָׁרֵךְ
  choice: 你的脐带
  rationale: 此词在新生儿语境中指脐带；汉语若只译“带子”会含混，因此明确译作“脐带”。
- source_word: לֹא כָרַּת שָׁרֵּךְ
  choice: 没有人剪断你的脐带
  rationale: 希伯来语字面结构近于“你的脐带没有被剪断”。汉语用无定施事“没有人”统摄连续的被忽略照料动作，更自然，且不指定具体责任人。
- source_word: רֻחַצְתְּ בְמַיִם לְמִשְׁעִי
  choice: 没有人用水洗净你
  rationale: 保留“用水洗”的动作，并将罕见词 לְמִשְׁעִי 在正文中按清洁义处理；其也可能强调擦洗或使皮肤平滑，故以脚注保留歧义。
- source_word: הָמְלֵחַ ... הֻמְלַחַתְּ
  choice: 没有人用盐擦你
  rationale: 这里指古代照料新生儿时以盐擦身的做法。“用盐擦”比“给你加盐”自然，也避免现代汉语中的烹饪联想。
- source_word: הָחְתֵּל ... חֻתָּלְתְּ
  choice: 没有人用布把你裹起来
  rationale: 该动词指用布包裹或襁褓新生儿；此译法通俗清楚，又保留具体的照料图景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“没有人”串联四项缺失的出生照料，使汉语流畅，同时不增添特定施事者。保留新生儿遭弃置、无人照料的强烈意象；罕见词的真实语义不确定性置于脚注中。
