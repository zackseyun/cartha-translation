  yaml_path: translation/ot/ezekiel/016/058.yaml
  text: You have borne your lewdness and your abominations[a], declares Yahweh.
translation:
  language: zh_hans
  text: 你的淫行和可憎之事，你已经担当了[a]。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“担当了自己的罪责”，或“承受了自己的刑罚”。这里的希伯来语动词在上下文中可以带有司法审判的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמָּתֵךְ
  choice: 自己的淫行
  rationale: זִמָּה在《以西结书》的语境中常指带有性意味、无耻败坏的行为；“淫行”既呼应本章淫乱与卖淫的延伸意象，也比泛称“恶行”更准确。
- source_word: תּוֹעֲבוֹתַיִךְ
  choice: 一切可憎之事
  rationale: תּוֹעֵבָה指在道德或敬拜层面令人憎恶之事；用“一切可憎之事”自然表达复数，并保留先知话语的强烈谴责色彩。
- source_word: אַתְּ
  choice: 你
  rationale: 独立人称代词带有强调作用；现代汉语以句首“你”直接指出责任主体即可，若译作“你自己”则显得刻意且可能过度强调。
- source_word: נְשָׂאתִם
  choice: 担当了
  rationale: נשׂא基本义为“承担、背负”，在审判语境中也可涉及承担罪责或刑罚。“担当了”保留动作及其司法意味，而不把原文的紧凑表达限定为罪责或刑罚之一。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 以自然、庄重的现代汉语表达先知宣告公式；将圣约之名יְהוָה音译为“雅威”。
theological_decisions:
- issue: 圣约之名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”以通行的学术音译保留其作为专名的性质，不以称号替代。
- issue: 是否明确说明נשׂא所指的是承担罪责或刑罚
  choice: 保留为“担当了”
  alternative: “担当了自己的罪责”或“承受了自己的刑罚”
  rationale: 在审判语境中，该动词可有司法含义，但原文直接以“淫行”和“可憎之事”为宾语；正文不补出“罪责”或“刑罚”，以保存原文的歧义和神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“淫行”呼应全章的性与婚约意象；“一切可憎之事”比生硬的“可憎之物”更符合现代汉语。句式简洁直接，保留责备和审判的力度。
