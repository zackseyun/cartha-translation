  text: לָ/כֵ֣ן זוֹנָ֔ה שִׁמְעִ֖י דְּבַר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/035.yaml
  text: Therefore[a], prostitute, hear the word of Yahweh.
translation:
  language: zh_hans
  text: 所以，妓女啊[a]，要听耶和华的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“娼妓”；希伯来语名词在这里是对耶路撒冷不忠的直接而严厉的比喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的指控，引出由此而来的宣告；“所以”简洁自然。
- source_word: זוֹנָה
  choice: 妓女
  rationale: 该阴性单数名词直指以性交易为业的女子，此处作为对耶路撒冷不忠的严厉隐喻；“妓女”现代、明确，并保留原文的冲击力。
- source_word: שִׁמְעִי
  choice: 要听
  rationale: 这是阴性单数命令式；“要听”既表达命令语气，也符合中文先知宣告的庄重语体。
- source_word: דְּבַר
  choice: 话
  rationale: 在“耶和华的话”这一先知性表达中，“话”自然且保留 דָּבָר 的基本意义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，明确其为上帝的名字，而非仅用称号替代。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的专名“耶和华”，保留其专名性质；“雅威”是按学界常见拟音的可行译法。
- issue: 对耶路撒冷的性不忠隐喻
  choice: 妓女
  alternative: 淫妇
  rationale: 原词 זוֹנָה 通常指妓女；直译保留本节严厉而具体的比喻，不将其弱化为泛指不贞的“淫妇”。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“妓女啊”保留呼语形式和先知责斥的力度；正文简短，以对应原文凝练的宣告。
