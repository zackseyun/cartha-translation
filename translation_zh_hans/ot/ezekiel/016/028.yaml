base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/028.yaml
  text: You prostituted yourself with the sons of Assyria because you were not satisfied[a]; you prostituted yourself with them[b], and even then you were not satisfied.
translation:
  language: zh_hans
  text: 你因不满足，就与亚述人[a]行淫；你又与他们行淫，却仍不满足。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“亚述之子”，可指亚述人。
    reason: lexical_alternative
  - marker: b
    text: 本章反复以行淫的比喻描写耶路撒冷在偶像崇拜和对外关系上的不忠。
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: 卖淫
  rationale: זנה在本章持续以强烈的性交易意象描写耶路撒冷在宗教和政治上的不忠；“卖淫”自然、明确，并保留先知话语的冲击力。
- source_word: אֶל
  choice: 向
  rationale: אֶל本义为“向、到”；与זנה连用时指向发生淫乱关系的对象。中文用“向……卖淫”既保留方向性，也符合本章拟人化修辞。
- source_word: בְּנֵי אַשּׁוּר
  choice: 亚述人
  rationale: 字面为“亚述之子”，在此是对亚述人的集合称呼；正文译作“亚述人”更符合现代汉语，并以脚注保留原文形式。
- source_word: מִבִּלְתִּי שָׂבְעָתֵךְ
  choice: 因不满足
  rationale: 该短语把未得饱足表达为行动的缘由或伴随状况；“因不满足”简洁保留其因果意味。
- source_word: וַתִּזְנִים
  choice: 跟他们卖淫
  rationale: 动词后的第三人称阳性复数后缀回指亚述人；“跟他们”明确呈现原文的复数宾语。
- source_word: וְגַם לֹא שָׂבָעַתְּ
  choice: 却仍不满足
  rationale: וְגַם在语境中加强反差：即使如此，她依旧未得饱足；“却仍”自然传达这一递进兼转折的效果。
theological_decisions:
- issue: 是否保留卖淫意象来表达耶路撒冷的宗教及政治不忠
  choice: 在正文中保留明确的“卖淫”意象
  alternative: 弱化为“行事不忠”或直接解释为“寻求结盟”
  rationale: 以西结书16章有意采用令人不适的性意象，控诉耶路撒冷的偶像崇拜和对外依附。弱化或直接释义会削减原文的先知性冲击，也会替文本预先限定政治与宗教两方面的张力。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“卖淫”保留原文刻意强烈的比喻；句中重复“不满足”和“卖淫”，对应希伯来文的修辞重复。所有脚注标记均置于正文。
