  text: וְ/זָכַרְתִּ֨י אֲנִ֧י אֶת בְּרִיתִ֛/י אוֹתָ֖/ךְ בִּ/ימֵ֣י נְעוּרָ֑יִ/ךְ וַ/הֲקִמוֹתִ֥י לָ֖/ךְ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/060.yaml
  text: But I myself will remember my covenant with you in the days of your youth[b][a], and I will establish for you an everlasting covenant.
translation:
  language: zh_hans
  text: 但我自己必记念我与你在你幼年时的约[b]，并要为你立一个永远的约[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永恒的约”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作“我与你在你幼年时的约”，回顾先前的立约关系，但本节并未具体说明所指的是哪一类约。
    reason: cross_reference
lexical_decisions:
- source_word: וְ/זָכַרְתִּי
  choice: 但……必记念
  rationale: 连词在上下文中标示从审判与羞愧转向上帝施恩，译为“但”；完成式在此具有将来指向，译为“必记念”。
- source_word: אֲנִי
  choice: 我自己
  rationale: 独立人称代词强化主语，故以“我自己”保留强调。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: 保留בְּרִית的标准圣约用语及第一人称所有关系；在汉语句法中融入“我……所立的约”。
- source_word: אֶת ... אוֹתָךְ
  choice: 与你所立
  rationale: 两个宾格标记所表达的关系在汉语中自然呈现为“与你”；补出“所立”使“我的约与你”的希伯来语结构成为通顺汉语，而不改变其关系含义。
- source_word: בִּימֵי נְעוּרַיִךְ
  choice: 在你幼年时
  rationale: 准确表达“在你幼年的日子里”的时间含义，同时采用自然、庄重的现代汉语。
- source_word: וַהֲקִמוֹתִי
  choice: 并要……立
  rationale: קום的使役式用于约时可指建立或坚立；“立约”是自然且准确的汉语搭配，并保留将来指向。
- source_word: לָךְ
  choice: 为你
  rationale: 保留介词的与格、受益含义，不将其同化为“与你”。
- source_word: בְּרִית עוֹלָם
  choice: 一个永远的约
  rationale: 表达该约持续长久、恒久有效；“永远的约”是现代中文圣经语域中清楚自然的说法，同时以脚注提示“永恒的约”这一词义选择。
theological_decisions:
- issue: 复兴语境中的约
  choice: 保留“我的约”与“永远的约”，不具体认定为某一约的制度或神学体系
  alternative: 将前者具体解释为摩西之约，或将后者具体解释为新约
  rationale: 本节回顾耶路撒冷幼年时期的约，并宣告将为她立永远的约，却未在本节中明确界定其制度归属；译文保留这一神学张力。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“但我自己”保留转折和主语强调；“立约”符合自然汉语及圣经语域。脚注标记均置于相关词句之后。
