  text: so that you may bear your disgrace and be ashamed because of all that you have done[a], becoming a comfort to them.
translation:
  language: zh_hans
  text: 好使你担当自己的耻辱，并因你所做的一切而羞愧；当你安慰她们时[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着安慰她们”，或“成为她们的安慰”。希伯来语这一表达可按时间、伴随或方式作彼此相近的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 好使
  rationale: 引出目的或结果；“好使”简洁自然，并保留原文的目的意味。
- source_word: תִּשְׂאִי כְלִמָּתֵךְ
  choice: 担当自己的耻辱
  rationale: נשׂא与כְּלִמָּה连用，表示承受、背负耻辱；“担当”保留了承受重担的意象。
- source_word: וְנִכְלַמְתְּ
  choice: 并……羞愧
  rationale: כלם的Niphal形式在此表示感到羞愧或蒙羞；“羞愧”与前面的客观“耻辱”有所区分。
- source_word: מִכֹּל אֲשֶׁר עָשִׂית
  choice: 因你所做的一切
  rationale: 羞愧类动词后的מִן可标示原因；“因”清楚表达她羞愧的缘由。
- source_word: בְּנַחֲמֵךְ אֹתָן
  choice: 成为她们的安慰
  rationale: 该结构可表达伴随、时间或方式关系；正文采用结果性的自然汉语表达，同时以脚注保留其他密切相关的理解。
theological_decisions:
- issue: 在复兴语境中，耶路撒冷与其他城邑的关系
  choice: 耶路撒冷在担当耻辱、为所行之事羞愧之际，成为她们的安慰。
  alternative: 也可理解为“当你安慰她们时”或“借着安慰她们”。
  rationale: 以西结书16:53-55展望耶路撒冷与所多玛、撒玛利亚一同复兴。原文介词结构有意涵上的弹性，译文不把时间、方式或结果关系限定得过死。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“担当耻辱”保留原文负重式意象；“成为她们的安慰”自然表达语境中的反转，同时用脚注呈现原文结构的歧义。
