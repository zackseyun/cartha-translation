source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ו/עשית אוֹתָ֖/ךְ כַּ/אֲשֶׁ֣ר עָשִׂ֑ית אֲשֶׁר בָּזִ֥ית אָלָ֖ה לְ/הָפֵ֥ר בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/059.yaml
  text: 'For thus says the Lord GOD: I will deal with you as you have done[a], because you despised the oath by breaking the covenant.'
translation:
  language: zh_hans
  text: 因为主耶和华如此说：我要照你所行的对待你，因为你藐视誓言[a]，破坏了盟约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“咒诅”。这里的希伯来词可指誓言，尤其是附有违约咒诅的立约誓言。
    reason: 保留 אָלָה 在立约语境中“誓言”与“咒诅”之间的词义张力。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 既保留“主”的称号，也以现代中文圣经读者熟悉的“耶和华”表达神名，避免将两个成分合并。
- source_word: וְעָשִׂית אוֹתָךְ
  choice: 我要……待你
  rationale: 此处“עשה + 宾语”是“对某人施行、待某人”的表达；译为“待你”自然简洁，并保留审判语气。
- source_word: כַּאֲשֶׁר עָשִׂית
  choice: 照你所做的
  rationale: 保留比较结构，表明神将按耶路撒冷自己的行为待她。
- source_word: בָּזִית
  choice: 你藐视
  rationale: 准确表达 בזה 所含轻蔑、不当回事之意，语气强而庄重。
- source_word: אָלָה
  choice: 誓言
  rationale: 在立约语境中可指带有咒诅制裁的誓言；正文采用自然且贴合句法的“誓言”，另在脚注保留“咒诅”的可能。
- source_word: לְהָפֵר בְּרִית
  choice: 背弃了约
  rationale: הפר ברית 是破坏、违背盟约的固定表达；“背弃了约”符合现代中文习惯，也清楚表达违约行为。
theological_decisions:
- issue: 复合称谓 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是现代中文圣经传统中广为人知的神名形式；同时保留前面的“主”，使原文复合称谓的两个成分都得到表达，不把神名泛化为普通称号。
- issue: 立约语境中 אָלָה 的含义
  choice: 誓言
  alternative: 咒诅；带咒诅的誓言
  rationale: 该词既可指誓言，也可指誓言所附带的咒诅制裁。正文不把两者混成解释性译文，而以“誓言”承接“背弃了约”，并用脚注保存词义张力。
- issue: לְהָפֵר 所表达的逻辑关系
  choice: 因为你藐视誓言，背弃了约
  alternative: 因为你藐视誓言，为要背弃约
  rationale: 希伯来语不定式可表示结果、说明或目的。上下文首先指控实际违约；中文采用并列承接，避免过度断定她藐视誓言的主观目的。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“照你所做的待你”保持原文报应式对应关系；“背弃了约”比生硬的“破坏盟约”更符合自然中文。脚注标记已在正文中以[a]出现。
