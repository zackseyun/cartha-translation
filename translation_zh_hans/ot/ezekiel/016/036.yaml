source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן הִשָּׁפֵ֤ךְ נְחֻשְׁתֵּ/ךְ֙ וַ/תִּגָּלֶ֣ה עֶרְוָתֵ֔/ךְ בְּ/תַזְנוּתַ֖יִ/ךְ עַל מְאַהֲבָ֑יִ/ךְ וְ/עַל֙ כָּל גִּלּוּלֵ֣י תוֹעֲבוֹתַ֔יִ/ךְ וְ/כִ/דְמֵ֣י בָנַ֔יִ/ךְ אֲשֶׁ֥ר נָתַ֖תְּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/036.yaml
  text: 'Thus says the Lord GOD: Because your bronze was poured out[a], and your nakedness was uncovered in your prostitutions with your lovers, and because of all the idols of your abominations, and because of the blood of your children whom you gave to them[c][b],'
translation:
  language: zh_hans
  text: 主耶和华如此说：“因为你的铜被倾倒出来[a]，你的赤身露体在你同情人行淫时被暴露出来；又因为你一切可憎的偶像[b]，以及你交给他们的儿女之血[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜”也可能比喻你挥霍的钱财；另有人认为这是淫乱暴露的形象说法。希伯来原文在此的确切含义不确定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“你那些可憎之物的偶像”；“偶像”一词本身带有鄙夷、贬抑的意味。
    reason: lexical_alternative
  - marker: c
    text: “交给他们”在上下文中指把儿女献给偶像为祭。
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 采用现代中文圣经语体中对这一固定称号组合的通行译法，既保留“主”的尊称，也明确呈现神名。
- source_word: יַעַן
  choice: 因为
  rationale: 引出下文审判的原因；本节是延续到下一节的原因从句。
- source_word: הִשָּׁפֵךְ נְחֻשְׁתֵּךְ
  choice: 你的铜被倾倒出来
  rationale: 保留 נְחֻשֶׁת 的通常词义“铜”，并保留 שפך 的被动意象，不在正文中把含混的隐喻限定为钱财、情欲或身体暴露。
- source_word: וַתִּגָּלֶה עֶרְוָתֵךְ
  choice: 露出了下体
  rationale: 自然呈现希伯来语关于裸体和性羞耻的具体意象；中文主动表达比机械的“下体被揭露”更顺畅。
- source_word: בְּתַזְנוּתַיִךְ עַל מְאַהֲבָיִךְ
  choice: 你在跟情人行淫时
  rationale: “行淫”兼顾卖淫意象和属灵不忠的语境；“跟”自然表达 עַל 在此处所指的对象关系。
- source_word: גִּלּוּלֵי תוֹעֲבוֹתַיִךְ
  choice: 你一切可憎的偶像
  rationale: 以自然中文表达“你那些可憎之物的偶像”；גִּלּוּלִים 在以西结书中是带蔑视色彩的偶像用语。
- source_word: וְכִדְמֵי בָנַיִךְ אֲשֶׁר נָתַתְּ לָהֶם
  choice: 以及你交给那些偶像的儿女之血
  rationale: 保留“血”“儿女”和“交给”这些原文要素，同时用中文关系结构清楚表明儿女是被交出的对象；所指是献给偶像，但正文不另加原文没有明说的“献祭”。
theological_decisions:
- issue: נְחֻשְׁתֵּךְ 在行淫与偶像崇拜语境中的隐喻含义
  choice: 正文直译为“你的铜”，以脚注说明可能指挥霍的钱财或淫乱暴露。
  alternative: 译作“你的财富”“你的淫欲”或其他解释性表达。
  rationale: 该词通常指铜，但此处显然具有隐喻性，而隐喻的确切指向存在争议。保留具体源语意象可避免把某一种解释写入正文。
- issue: 儿女被“交给”偶像的含义
  choice: 正文保留“交给”，并在脚注说明语境指献儿女为祭。
  alternative: 直接译作“献给那些偶像”或“杀了献祭”。
  rationale: 上下文明确涉及献儿女为祭及流血之罪，但本节动词本身是“给、交给”；直译与注释结合，既保留措辞，也让现代读者理解其文化背景。
- issue: 本节未完的句法
  choice: 以逗号结束引语，让“因为……”的原因从句延续到下一节。
  alternative: 补出判断或以完整句号结束。
  rationale: 希伯来文本在本节只列出审判原因，主句在下一节展开；不应在本节擅自补足结论。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行淫”“下体”“儿女之血”保留先知控诉的强烈和具体，不以委婉语削弱原文。由于本节的“因为”从句在下一节才得到主句，末尾保留逗号，不把第36节误作独立完整句。
