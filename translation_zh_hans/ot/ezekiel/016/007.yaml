  rationale: 修订使中文更自然，并删除原文未明说的“渐渐”。对有争议的短语改为“华美妆饰的阶段”，保留其妆饰和成熟的意象，而不在正文中决定其是否指婚龄、初潮或新娘装饰。脚注继续呈现相关歧义。
