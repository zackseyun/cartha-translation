  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רְבָבָ֗ה כְּ/צֶ֤מַח הַ/שָּׂדֶה֙ נְתַתִּ֔י/ךְ וַ/תִּרְבִּי֙ וַֽ/תִּגְדְּלִ֔י וַ/תָּבֹ֖אִי בַּ/עֲדִ֣י עֲדָיִ֑ים שָׁדַ֤יִם נָכֹ֨נוּ֙ וּ/שְׂעָרֵ֣/ךְ צִמֵּ֔חַ וְ/אַ֖תְּ עֵרֹ֥ם וְ/עֶרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/007.yaml
  text: I made you countless like the growth of the field[a], and you multiplied and grew up and came to full adornment. Your breasts were formed and your hair had grown[d][c][b], yet you were naked and bare.
translation:
  language: zh_hans
  text: 我使你多如田野的草木[a]。你增多，长大，到了华美妆饰的阶段[b]；你的乳房发育成形[c]，毛发也长了出来。然而，你仍赤身裸体，毫无遮蔽[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像田野的植物”，也可理解为“像田野所萌生的草木”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文近似“来到妆饰的妆饰”。这个罕见短语也可能指达到最美或成熟的阶段，或到了可以佩戴妆饰的年龄。
    reason: alternative_reading
  - marker: c
    text: 或译：“你的乳房发育了。”
    reason: lexical_alternative
  - marker: d
    text: 原文用两个近义词并列，强调她完全裸露、毫无遮蔽。
    reason: literary_feature
lexical_decisions:
- source_word: רְבָבָה
  choice: 繁多
  rationale: 该词表示极大的数量；“繁多”既保留数量增长的含义，也不把它机械地限定为具体的“一万”。
- source_word: כְּצֶמַח הַשָּׂדֶה
  choice: 像田野的草木
  rationale: צֶמַח可指萌生之物、植物或生长；“田野的草木”自然保留农业意象，并与少女成长的比喻相呼应。
- source_word: נְתַתִּיךְ
  choice: 我使你
  rationale: נתן本义为“给、置”，但在此与表示众多的רְבָבָה连用，表达使之成为繁多的状态。
- source_word: וַתִּרְבִּי
  choice: 你渐渐增多
  rationale: 保留רבה的数量增长义；“渐渐”使连续成长的叙述在现代汉语中更流畅。
- source_word: וַתִּגְדְּלִי
  choice: 长大成人
  rationale: 上下文描写从婴孩到女性成熟的过程，因此译作“长大成人”，而非仅指体积变大。
- source_word: וַתָּבֹאִי בַּעֲדִי עֲדָיִים
  choice: 到了盛妆之美
  rationale: 希伯来语近似“到了妆饰中的妆饰”，含义存在争议。“盛妆之美”保留妆饰意象及最高程度，同时不在正文中明确断定婚龄、初潮或新娘装饰。
- source_word: שָׁדַיִם נָכֹנוּ
  choice: 你的乳房发育成形
  rationale: כון的尼法勒词形可表示被建立、预备或成形；在青春期语境中，“发育成形”自然明确。
- source_word: וּשְׂעָרֵךְ צִמֵּחַ
  choice: 毛发也长了出来
  rationale: צמח意为萌发、生长；原文只说“你的毛发”，正文不进一步限定为哪一部位。
- source_word: עֵרֹם וְעֶרְיָה
  choice: 赤身裸体，毫无遮蔽
  rationale: 两个近义词连用，加强完全裸露的形象；此译保留其强化作用，又符合现代汉语表达。
theological_decisions:
- issue: בַּעֲדִי עֲדָיִים在女性成熟比喻中的具体所指
  choice: 译为“到了盛妆之美”，保留妆饰和成熟之美的意象
  alternative: 到了佩戴妆饰的年龄；发育成熟；到了新娘盛装的阶段
  rationale: 本节把耶路撒冷人格化为长大成熟的女子，但这个希伯来短语罕见且有争议。正文不把它限定为婚嫁、月经初潮或某个特定生理阶段，以保留原文的歧义和张力。
- issue: 成长意象兼具群体增多与少女发育两层含义
  choice: 保留“繁多、增多”与“长大成人、乳房发育”的并置
  alternative: 把前半全部统一译为身体成长或人口增长
  rationale: 原文有意把民族或城市的兴盛与女子成长的拟人意象交织在一起；不应为求单一连贯而消除这种复合比喻。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文从田野草木、数量增长到少女发育的复合意象；对罕见短语不作过度具体化。
