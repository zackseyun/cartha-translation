  text: אֶל כָּל רֹ֣אשׁ דֶּ֗רֶךְ בָּנִית֙ רָֽמָתֵ֔/ךְ וַ/תְּתַֽעֲבִי֙ אֶת יָפְיֵ֔/ךְ וַ/תְּפַשְּׂקִ֥י אֶת רַגְלַ֖יִ/ךְ לְ/כָל עוֹבֵ֑ר וַ/תַּרְבִּ֖י אֶת תזנת/ך־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/025.yaml
  text: At every street corner you built your high place[a], and you made your beauty detestable[b]. You spread your legs to every passerby and multiplied your prostitution.
translation:
  language: zh_hans
  text: 你在每个路口[a]建造高台[b]，使你的美貌变得可憎。你向每个过路的人张开双腿，使你的淫行越发增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “路口”直译为“道路的头端”，也可译作“每条道路的起头”。
    reason: lexical_alternative
  - marker: b
    text: “高台”也可译作“高处”；这里可能特指用于祭祀的高处。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ דֶּרֶךְ
  choice: 路口
  rationale: 字面为“道路的头端”，在本处指道路交会或显眼之处。“路口”自然简明，也保留其公开、醒目的场景。
- source_word: רָמָה
  choice: 高台
  rationale: 该词指筑起的高处，并在本段偶像崇拜的语境中带有祭祀场所的含义。“高台”既保留其高起的形象，也比直接译作“神龛”少作一层解释。
- source_word: תְּתַעֲבִי אֶת יָפְיֵךְ
  choice: 使你的美貌变得可憎
  rationale: 动词在此以“你的美貌”为宾语，表示她使自己的美貌成为可憎之物，而不只是自己厌恶美貌。
- source_word: תְּפַשְּׂקִי אֶת רַגְלַיִךְ
  choice: 张开双腿
  rationale: 原文使用直接而羞辱性的性意象；直译能保留先知话语刻意造成的冲击，不以委婉语弱化。
- source_word: לְכָל עוֹבֵר
  choice: 向每个过路的人
  rationale: 分词 עוֹבֵר 指经过的人；此译符合现代汉语，同时保留“每一个”的全面性。
- source_word: וַתַּרְבִּי אֶת תַּזְנוּתֵךְ
  choice: 使自己淫乱的事越来越多
  rationale: רבה 的使役形式表达增多，תַּזְנוּת 指卖淫、淫乱行为。此译在自然汉语中保留行为不断增加的含义及原文强烈的性比喻。
theological_decisions:
- issue: 如何呈现耶路撒冷不忠于上帝的性—偶像崇拜比喻
  choice: 正文保留“张开双腿”和“淫乱”等直接措辞
  alternative: 采用“献上自己”“行邪淫”等较含蓄或传统化的表达
  rationale: 原文刻意借公开而露骨的性行为描写耶路撒冷的偶像崇拜和背约不忠。保留其直白与冒犯感，既不把比喻仅仅解释成偶像崇拜，也不削弱先知责备的力度。
translation_notes:
  register: 采用庄重而现代的标准普通话。句法简洁，保留原文第二人称阴性所指耶路撒冷的直接斥责；汉语不标语法性别。性意象不作委婉化处理，但“使自己淫乱的事越来越多”兼顾原文“增多”的使役含义与现代汉语可读性。
