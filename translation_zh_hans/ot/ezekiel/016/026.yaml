base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/026.yaml
  text: You prostituted yourself with the sons of Egypt[a], your neighbors, great of flesh[b], and multiplied your prostitution to provoke me to anger.
translation:
  language: zh_hans
  text: 你又与埃及人[a]——那些肉体硕大的邻舍[b]——行淫；你增多自己的淫乱，惹我发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“埃及之子”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“肉体硕大的”，是一种粗俗的性描写；也有人较为解释性地译作“好色的”或“性器硕大的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: 你又……行淫
  rationale: 保留先知话语中直白的性隐喻；“行淫”庄重而清楚，也能表达其所象征的背约不忠。连接词依上下文译作“又”。
- source_word: אֶל
  choice: 跟
  rationale: 字面可作“向、到”，但与“行淫”连用时，现代汉语用“跟”能自然表达行为所涉及的对象。
- source_word: בְּנֵי מִצְרַיִם
  choice: 埃及人
  rationale: 希伯来语字面为“埃及之子”，实际指埃及人；正文采用自然的现代汉语，字面形式收入脚注。
- source_word: שְׁכֵנַיִךְ
  choice: 你那些……邻舍
  rationale: 表达这些人地理上与耶路撒冷邻近；“邻舍”保留原文较为庄重的语体。
- source_word: גִּדְלֵי בָשָׂר
  choice: 肉体硕大的
  rationale: 尽量保留希伯来语“肉体硕大”的粗俗性暗示，不将其完全解释为“好色”或直接限定为某个身体部位。
- source_word: וַתַּרְבִּי אֶת תַּזְנֻתֵךְ
  choice: 你不断增多淫乱的事
  rationale: רבה 的使役形表示使之增多；将抽象的“你的淫乱”译作“淫乱的事”，更符合现代汉语，同时保持与前句性隐喻的词义联系。
- source_word: לְהַכְעִיסֵנִי
  choice: 惹我发怒
  rationale: 准确表达使役意义和愤怒的结果，且是自然、凝练的现代汉语。
theological_decisions:
- issue: 以卖淫或淫乱比喻偶像崇拜和对外结盟
  choice: 正文保留明确的“行淫、淫乱”意象
  alternative: 译作“对我不忠”或“背叛我”
  rationale: 本章刻意使用强烈而令人不适的性语言描绘耶路撒冷背约；若只译出其象征意义，就会削弱原文修辞力度。
- issue: גִּדְלֵי בָשָׂר 的具体所指
  choice: 译作“肉体硕大的”，保留一定含混性
  alternative: 译作“性欲旺盛的”或“性器硕大的”
  rationale: 原文带有粗俗的性暗示，但“肉体”究竟泛指身体还是委婉指男性性器，并未完全明说；正文不替原文消除这种含混。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留本节刻意露骨的先知性谴责，同时以脚注说明希伯来语字面形式及其未完全确定的性暗示。
