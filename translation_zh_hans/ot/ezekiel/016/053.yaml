  text: וְ/שַׁבְתִּי֙ אֶת שְׁבִ֣יתְ/הֶ֔ן אֶת שבית סְדֹם֙ וּ/בְנוֹתֶ֔י/הָ וְ/אֶת שבית שֹׁמְר֖וֹן וּ/בְנוֹתֶ֑י/הָ ו/שבית שְׁבִיתַ֖יִ/ךְ בְּ/תוֹכָֽ/הְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/053.yaml
  text: And I will restore their fortunes—the fortunes of Sodom and her daughters[a], and the fortunes of Samaria and her daughters—and your fortunes among them[b],
translation:
  language: zh_hans
  text: “我必恢复所多玛和她的众女儿们[b]的境况[a]，恢复撒玛利亚和她的众女儿们的境况，也恢复你在她们中间的境况。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恢复……的境况”也可译作“使被掳的状态复原”或“使被掳的人归回”。这是希伯来语惯用语，常指一个民族的处境得到逆转和恢复。
    reason: lexical_alternative
  - marker: b
    text: “女儿们”在这里通常指与中心城市相关或从属于它的周边城镇。
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: 我必扭转
  rationale: 此处שׁוב与שְׁבִית构成复兴惯用语，表达使现状逆转、恢复，而非仅指空间上的返回。“扭转”既自然，也保留了从审判转向复兴的动态含义。
- source_word: שְׁבִיתְהֶן / שבית / שְׁבִיתַיִךְ
  choice: 境况
  rationale: 该词在שׁוב שְׁבוּת／שְׁבִית这一惯用语中可指被掳状态、被掳者，或更广义的命运与境况。鉴于经文也提到所多玛，“境况”较适合表达整体处境的恢复，同时不把实现方式限定为历史性的归回。
- source_word: סְדֹם
  choice: 所多玛
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: וּבְנוֹתֶיהָ
  choice: 她众女儿城
  rationale: 原文直译为“她的女儿们”，在先知书的地理用语中指从属于中心城市的周边城镇。“女儿城”保留亲属隐喻，也使现代读者较容易看出其地理所指。
- source_word: שֹׁמְרוֹן
  choice: 撒玛利亚
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: בְּתוֹכָהְנָה
  choice: 在她们中间
  rationale: 保留原文“在她们当中”的空间及群体关系，并与全章把这些城市拟人化为姐妹的表达相协调。
theological_decisions:
- issue: 审判—复兴宣告中שׁוב שְׁבוּת／שְׁבִית惯用语的含义
  choice: 译为“扭转……的境况”，表达整体处境得到逆转和恢复。
  alternative: “使被掳的人归回”或“使被掳的状态复原”。
  rationale: 这个希伯来语惯用语常泛指命运或处境的逆转。因本节把所多玛包括在内，若只译成历史性的被掳归回，会过度限定经文所说的复兴方式。脚注保留较字面的可能译法。
- issue: 所多玛和撒玛利亚之“女儿”的所指
  choice: 正文保留亲属隐喻，译作“女儿城”。
  alternative: 直接译作“附属城镇”或“周围村镇”。
  rationale: 原文以女性城市为拟人化主体，并用“女儿”指相关或从属的居民点。“女儿城”既保存全章的姐妹—女儿意象，又避免读者误解为真实人物。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我必”体现先知宣告的确定语气；分号呈现三个平行复兴对象之间的结构。以“女儿城”保留原文拟人和亲属隐喻，同时借脚注澄清其地理含义。
