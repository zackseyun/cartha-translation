base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/016.yaml
  text: You took some of your garments and made for yourself colorful high places[a], and you prostituted yourself on them—such things should not come[b], nor should they be.
translation:
  language: zh_hans
  text: 你拿了自己的一些衣服，为自己做了五彩的丘坛[a]，又在上面卖淫。这样的事本不该发生[b]，也不该存在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “五彩的丘坛”也可译作“拼接的丘坛”“斑驳的丘坛”或“多彩的神龛”。这里的希伯来语形容词较难确定，可能是指用衣服装饰后呈现的外观。
    reason: lexical_alternative
  - marker: b
    text: 本节末句的希伯来文很难理解。也可较直译为：“这样的事不该来，也不该有。”
    reason: alternative_reading
lexical_decisions:
- source_word: מִבְּגָדַיִךְ
  choice: 自己的一些衣服
  rationale: 介词 מִן 在这里有部分义，表示从她的衣服中取出一些；这样译既自然，也保留了原文的细微含义。
- source_word: בָּמוֹת
  choice: 丘坛
  rationale: בָּמָה 在先知书中通常指用于敬拜的高处或祭祀场所；“丘坛”是简洁而符合经文语境的表达。
- source_word: טְלֻאוֹת
  choice: 五彩的
  rationale: 该词含有拼接、斑驳或杂色之意；结合用衣服制作丘坛的语境，“五彩的”自然地呈现其装饰性外观，同时以脚注保留其他可能。
- source_word: וַתִּזְנִי
  choice: 卖淫
  rationale: זנה 在本章以露骨的性隐喻谴责耶路撒冷的背约和偶像崇拜；直译保留了先知话语刻意造成的冲击力。
- source_word: עֲלֵיהֶם
  choice: 在上面
  rationale: עַל 指回前述丘坛；“在上面”保留原文鲜明而令人不适的空间意象。
- source_word: לֹא בָאוֹת וְלֹא יִהְיֶה
  choice: 这样的事本不该发生，也不该存在
  rationale: 末句希伯来文艰涩且省略成分。此译保留其否定和谴责语气，又避免把语法上的不确定性误说成单一确定含义；脚注注明较直译的可能。
theological_decisions:
- issue: 以卖淫比喻偶像崇拜和背约
  choice: 保留“卖淫”这一明确措辞
  alternative: 弱化为“不忠”或“背叛”
  rationale: 以西结有意使用强烈的性意象来揭露耶路撒冷的宗教背叛；弱化措辞会削减原文的修辞力度。
- issue: 末句表达事实、将来还是不应发生
  choice: 按谴责性的情态译为“本不该发生，也不该存在”
  alternative: 较直译为“它们没有来，也不会有”或“这样的事不该来，也不该有”
  rationale: 原句形式和所指都很困难；正文给出符合上下文的可读译法，脚注保留字面结构与不确定性，不将其提升为额外的神学断言。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“丘坛”保留先知书的祭祀语境；“卖淫”不作淡化，以保持原文强烈的控诉。末句正文重在自然可懂，脚注则明确其文本困难和较直译的读法。
