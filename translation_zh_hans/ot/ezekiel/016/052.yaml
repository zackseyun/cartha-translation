source:
  edition: WLC
  text: גַּם אַ֣תְּ שְׂאִ֣י כְלִמָּתֵ֗/ךְ אֲשֶׁ֤ר פִּלַּלְתְּ֙ לַֽ/אֲחוֹתֵ֔/ךְ בְּ/חַטֹּאתַ֛יִ/ךְ אֲשֶׁר הִתְעַ֥בְתְּ מֵ/הֵ֖ן תִּצְדַּ֣קְנָה מִמֵּ֑/ךְ וְ/גַם אַ֥תְּ בּ֨וֹשִׁי֙ וּ/שְׂאִ֣י כְלִמָּתֵ֔/ךְ בְּ/צַדֶּקְתֵּ֖/ךְ אַחְיוֹתֵֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/052.yaml
  text: You also[a], bear your disgrace, because you pronounced judgment in favor of your sisters. By your sins in which you acted more abominably than they, they have become more righteous than you. So you too, be ashamed and bear your disgrace[b], because you made your sisters appear righteous.
translation:
  language: zh_hans
  text: 你也要担当你的耻辱；你因所犯的罪，为你的姐妹作出了有利的裁断[a]。你的行为比她们更可憎，她们就比你更为义[b]。所以，你也要羞愧，担当你的耻辱，因为你使你的姐妹显为义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你替你的姐妹申辩”或“你为你的姐妹说情”。希伯来语带有反讽意味：耶路撒冷的罪比她姐妹的更可憎，因而使她的姐妹在比较中得到有利的裁断。
    reason: lexical_alternative
  - marker: b
    text: 这里说的是相比较而言更为义，并不是说她们在绝对意义上是义的。也可译“她们比你更显为义”。
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאִי
  choice: 担当
  rationale: נשׂא与“耻辱”连用时，表示承受、担当耻辱及其后果；“担当”既自然，也保留了审判语境中的分量。
- source_word: כְלִמָּתֵךְ
  choice: 自己的耻辱
  rationale: כְּלִמָּה指羞耻、受辱或不光彩；译作“耻辱”可与下文表示羞愧反应的בּוֹשִׁי有所区别。
- source_word: פִּלַּלְתְּ לַאֲחוֹתֵךְ
  choice: 为自己的姐妹作了有利的判断
  rationale: פלל的Piel词形配合ל可有介入判断、为某人判断或申辩之意。这里带有反讽：耶路撒冷更严重的罪行，实际上使她的姐妹在比较中得到有利判断。
- source_word: בְּחַטֹּאתַיִךְ
  choice: 你所犯的罪
  rationale: 介词ב在此具有凭借或原因色彩；汉语通过后面的“因此”明确表达这些罪造成的比较结果。
- source_word: הִתְעַבְתְּ מֵהֵן
  choice: 比她们的更可憎
  rationale: 该比较结构说明耶路撒冷所行的比她的姐妹更为可憎；结合“你所犯的罪”处理为自然的现代汉语。
- source_word: תִּצְדַּקְנָה מִמֵּךְ
  choice: 她们比你更为义
  rationale: 直译并保留צדק的比较性措辞，不把它弱化为单纯的“看起来较好”，也不将其解释成绝对无罪。
- source_word: בּוֹשִׁי
  choice: 要羞愧
  rationale: בוש的命令式要求耶路撒冷面对自己的罪而感到羞愧；“要羞愧”简洁而庄重。
- source_word: בְּצַדֶּקְתֵּךְ אַחְיוֹתֵךְ
  choice: 因为你使自己的姐妹显为义
  rationale: 此处表达耶路撒冷使姐妹在比较中被视为较义的结果；“显为义”保留司法和评价层面的张力，同时避免生硬的名词化表达。
theological_decisions:
- issue: 所多玛、撒马利亚与耶路撒冷之间的比较性“义”
  choice: 保留“她们比你更为义”的比较表述，并用脚注说明不是绝对意义上的义。
  alternative: 译成姐妹绝对为义，或仅译为正式的法律宣告无罪。
  rationale: 本章的修辞重点是：耶路撒冷的恶行更为可憎，以致她的姐妹在对比之下反而显得较义。译文保留这一震撼性的比较和神学张力，不把姐妹说成毫无罪恶，也不把צדק限制为单一的法庭术语。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“担当耻辱”“显为义”保留先知审判话语的力度；句法略作调整，使罪行、比较和结果之间的关系清楚，同时不消除原文在פלל和צדק上的司法性含义与反讽张力。
