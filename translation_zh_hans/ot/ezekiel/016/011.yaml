base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/011.yaml
  text: I adorned you with jewelry[c][b][a], and I put bracelets on your hands and a necklace on your neck.
translation:
  language: zh_hans
  text: 我用首饰装扮你[a]，在你手上给你戴上镯子[b]，在你颈上给你戴上项链[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “首饰”或译“饰物”或“华美的装饰”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“在你双手上”；镯子通常戴在手腕或手臂上。
    reason: lexical_alternative
  - marker: c
    text: “项链”或译“链子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעְדֵּךְ עֶדִי
  choice: 我用首饰装扮你
  rationale: 动词 עדה 表示以装饰物妆饰，名词 עֶדִי 表示装饰、饰物；结合下文所列的镯子和颈饰，译作“用首饰装扮”既具体自然，也保留原文的动作与意象。
- source_word: צְמִידִים
  choice: 镯子
  rationale: 该复数名词指戴在手臂或手腕上的环状饰物；“镯子”是现代汉语中清楚而自然的对应词。
- source_word: עַל יָדַיִךְ
  choice: 戴在你双手上
  rationale: יָדַיִךְ 是双数形式，字面指“两手”，而 יָד 也可涵盖手腕或手臂。正文保留“双手”的原文表达，脚注说明实际佩戴部位可能是手腕或手臂。
- source_word: רָבִיד
  choice: 项链
  rationale: 该词指戴在颈部的饰物，也可指链子；“项链”最符合此处连续列举首饰的语境。
- source_word: עַל גְּרוֹנֵךְ
  choice: 戴在你颈项上
  rationale: גָּרוֹן 可指喉咙或颈项；谈及首饰时，“颈项”庄重自然，也不致让读者误解为喉咙内部。
theological_decisions:
- issue: 上帝把耶路撒冷描绘成受装扮的女子
  choice: 正文保留具体的装扮和首饰意象，不作寓意性扩写。
  alternative: 在正文中解释为盟约赐福、新娘装扮或其他神学象征。
  rationale: 本节属于以女子象征耶路撒冷的延展比喻；翻译应呈现原文图像，同时避免把特定神学解释加入经文本身。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“装扮”比生硬的“妆饰”更通顺；“颈项”则与本段诗性、寓言性的语体相称。正文保留“你”的女性单数指向所形成的拟人意象，但汉语无需另行标示语法性别。
