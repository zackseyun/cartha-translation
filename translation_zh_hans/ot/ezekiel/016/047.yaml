  text: וְ/לֹ֤א בְ/דַרְכֵי/הֶן֙ הָלַ֔כְתְּ וּ/בְ/תוֹעֲבֽוֹתֵי/הֶ֖ן עשיתי כִּ/מְעַ֣ט קָ֔ט וַ/תַּשְׁחִ֥תִי מֵ/הֵ֖ן בְּ/כָל דְּרָכָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/047.yaml
  text: Yet you did not walk in their ways or act according to their abominations[a]; as if that were too little[b], you became more corrupt than they in all your ways.
translation:
  language: zh_hans
  text: 然而，你没有随从她们的行径，也没有照她们那些可憎之事去做[a]；仿佛那还算小事[b]，你在你一切行径上竟比她们更加败坏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“也做她们那些可憎之事。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来语惯用语直译近于“像一件极小的事”。这里带有反讽意味：仿效她们的罪仿佛还不够，耶路撒冷竟在败坏上超过了她们。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַרְכֵיהֶן ... הָלַכְתְּ
  choice: 按她们的行径而行
  rationale: 保留希伯来语“在道路中行走”的生活行为隐喻；“行径”在现代汉语中自然表达人的行为模式。
- source_word: וּבְתוֹעֲבוֹתֵיהֶן עשיתי
  choice: 也没有照她们那些可憎之事去做
  rationale: 依上下文按第二人称阴性理解动词，并把前面的否定连及这个并列分句。“可憎之事”保留 תּוֹעֵבָה 在以西结书中强烈的宗教与道德谴责意味；较直译的表达收入脚注。
- source_word: כִּמְעַט קָט
  choice: 仿佛那还算小事
  rationale: 这是省略而带反讽色彩的惯用语，在上下文中引出罪恶程度的升级；此译法比逐字译为“像极小的一件事”更清楚。
- source_word: וַתַּשְׁחִתִי
  choice: 竟……更加败坏
  rationale: שׁחת 在这里描述道德上的败坏，并与 מֵהֵן 构成比较；“竟”传达先知责斥中的递进语气。
- source_word: מֵהֵן
  choice: 比她们
  rationale: 介词 מִן 在此具有比较功能，表明耶路撒冷的败坏超过前述对象。
- source_word: בְּכָל דְּרָכָיִךְ
  choice: 在一切所行的事上
  rationale: 表达行为范围的全面性，同时以“所行”呼应前半句的道路与行走意象，避免生硬重复“道路”。
theological_decisions:
- issue: 耶路撒冷相对于撒马利亚和所多玛的罪责程度
  choice: 译为耶路撒冷在一切行为上比她们更加败坏
  alternative: 理解为耶路撒冷只在短时间内偏离，或仅以不同方式败坏
  rationale: כִּמְעַט קָט 后接 וַתַּשְׁחִתִי מֵהֵן，最自然地形成反讽式递进：仿效她们仿佛还不够，耶路撒冷甚至超过她们。译文保留先知性控诉，不引入后来的教义范畴。
- issue: 前半句否定与后半句超越之间的张力
  choice: 保留“没有……；仿佛那还算小事……反而更加败坏”的表面张力
  alternative: 释义为“你不只照她们而行”或“不过片刻你便超过她们”
  rationale: 希伯来语措辞高度凝练，既可被理解为并非仅仅仿效，也可按表层否定来读。正文不擅自消除这种修辞张力，脚注说明其递进含义。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。以“可憎之事”表达强烈谴责，以“行径—所行”维持 דרך 的贯穿意象；保留原文否定与随后比较升级之间的修辞张力。
