base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/046.yaml
  text: Your older sister is Samaria[a], she and her daughters, who dwell to your left; and your younger sister, who dwells to your right, is Sodom and her daughters.
translation:
  language: zh_hans
  text: 你的姐姐是撒玛利亚[a]，她和她的女儿们住在你的左边；你的妹妹是所多玛和她的女儿们，她比你小，住在你的右边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 从耶路撒冷的方位来看，撒玛利亚在北面，所多玛在南面。
    reason: 文化与地理说明：解释古代面向东方时以左为北、以右为南的方位表达，同时不改动正文意象。
lexical_decisions:
- source_word: אֲחוֹתֵךְ
  choice: 你的姐姐／你的妹妹
  rationale: 按上下文分别译为“姐姐”和“妹妹”，保留以城市为姐妹的家族隐喻；不译作泛化的“亲族”。
- source_word: הַגְּדוֹלָה
  choice: 姐姐
  rationale: 该词基本义为“大”，用于姐妹关系时可自然表达年长者；“姐姐”既符合现代汉语，也保留比较性的家族意象。
- source_word: שֹׁמְרוֹן
  choice: 撒玛利亚
  rationale: 采用现代中文圣经及地名使用中通行的译名。
- source_word: וּבְנוֹתֶיהָ
  choice: 和她的众女儿
  rationale: 直译“女儿们”，保留本章贯穿的家族隐喻；在城市语境中可指其属城或附属居民点，但不在正文中将隐喻解释掉。
- source_word: הַיּוֹשֶׁבֶת
  choice: 住在
  rationale: ישׁב 的分词在此表示居住、坐落；“住在”自然易懂，并可延续城市人格化表达。
- source_word: עַל שְׂמֹאולֵךְ
  choice: 在你的左边
  rationale: 贴近希伯来文身体方位表达，不直接改译为“北边”；地理含义置于脚注说明。
- source_word: הַקְּטַנָּה מִמֵּךְ
  choice: 你的妹妹
  rationale: 字面为“比你小的”，在姐妹关系中现代汉语自然说“妹妹”；所属词“你的”亦保留 מִמֵּךְ 所表达的相对关系，无须生硬译作“比你小的妹妹”。
- source_word: מִימִינֵךְ
  choice: 在你的右边
  rationale: 保留原文的身体方位说法，不在正文中解释为“南边”。
- source_word: סְדֹם
  choice: 所多玛
  rationale: 采用现代中文圣经传统中通行且易识别的地名译法。
theological_decisions:
- issue: 相对于耶路撒冷的左右方位
  choice: 正文保留“在你的左边”和“在你的右边”
  alternative: 译为“在你的北边”和“在你的南边”
  rationale: 原文使用身体取向的空间词，而非明确的罗盘方向。正文保留原有意象，地理所指则由脚注交代，避免把解释直接并入经文。
- issue: 城市及其属城的家族人格化
  choice: 保留“姐姐／妹妹”和“众女儿”
  alternative: 译为“同类城市”和“附属城镇”
  rationale: 本章以婚姻和家族关系构成核心寓意；保留亲属称谓能呈现原文的修辞与神学张力，而不把隐喻提前化解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“众女儿”略带文学色彩，但有意保留城市家族隐喻；分作两句，以免希伯来文并列结构在中文中显得拖沓。脚注标记[a]已置于正文相应位置。
