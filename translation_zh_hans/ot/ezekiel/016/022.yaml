base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/022.yaml
  text: And in all your abominations and your prostitutions[a], you did not remember the days of your youth, when you were naked and bare[c][b], wallowing in your blood.
translation:
  language: zh_hans
  text: 在你一切可憎之事和卖淫之事[a]中，你竟没有想起你年轻时的日子；那时你赤身露体[b]，在自己的血中辗转[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“种种淫乱之事”。原文以卖淫的意象描写耶路撒冷在盟约和敬拜上的不忠。
    reason: lexical_alternative
  - marker: b
    text: 或译“赤裸无遮”。原文用两个近义词加强赤裸、暴露的意味。
    reason: lexical_alternative
  - marker: c
    text: 或译“在自己的血中挣扎”或“在自己的血中打滚”。原文动词描绘她浑身是血、无助地翻动的情形。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבֹתַיִךְ
  choice: 你这一切可憎之事
  rationale: “可憎之事”保留该词在先知文献中强烈的道德和敬拜层面的谴责意味，同时符合现代汉语表达。
- source_word: תַזְנֻתַיִךְ
  choice: 种种卖淫之事
  rationale: 保留原文具体而尖锐的卖淫意象及复数意味，不将其抽象化为“不忠”或直接解释为“拜偶像”。
- source_word: לֹא זכרתי
  choice: 竟没有想起
  rationale: 按上下文和传统读法理解为第二人称阴性单数“你没有记得”；“竟”自然传达责备语气，但不改变命题内容。
- source_word: יְמֵי נְעוּרָיִךְ
  choice: 你幼年的日子
  rationale: 贴近原文时间性表达，并与本章把耶路撒冷拟人为女子的成长叙事相衔接。
- source_word: עֵרֹם וְעֶרְיָה
  choice: 赤身露体
  rationale: 用自然、庄重的四字表达再现两个近义词叠加强调的赤裸与暴露状态。
- source_word: מִתְבּוֹסֶסֶת בְּדָמֵךְ
  choice: 在自己的血中辗转
  rationale: “辗转”保留原动词所描绘的在血中翻动、挣动或打滚的生动画面，同时避免过度确定其具体动作。
- source_word: וְאֵת כָּל ... וְ...
  choice: 你行这一切……和种种……时
  rationale: 原句开头句法省略且较难；以伴随时间结构译出，表达她在行这些事时没有回想幼年处境，中文连贯而不过度扩充。
theological_decisions:
- issue: 以卖淫描写耶路撒冷在盟约和敬拜上的不忠
  choice: 保留“卖淫”的具体比喻
  alternative: 译作“不忠”或“拜偶像”
  rationale: 先知有意使用尖锐的性意象控诉耶路撒冷；抽象化或直接释义会削弱原文力度，并把解释写入正文。
- issue: 耶路撒冷幼年时的血污无助状态
  choice: 译作“在自己的血中辗转”
  alternative: 译作“在自己的血中打滚”或“在自己的血中挣扎”
  rationale: 原动词的具体动作存在词义幅度；正文采用能涵盖翻动而不强行断定动作目的的表达，注释列出主要可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知话语中“可憎之事”和“卖淫”的强烈控诉，也保留末句动作词的词义幅度。代词“你”承接本章拟人化的耶路撒冷；正文不额外加入性别标记。
