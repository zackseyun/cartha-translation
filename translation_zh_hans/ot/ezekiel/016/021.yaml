    rationale: 希伯来文只有一个主要动词“给了/交出了他们”，其后的不定式短语说明交出的方式。“把他们献给……使他们……归给它们”在中文中形成两个类似的交付动作，模糊原句结构。
  - severity: low
    issue: 脚注的“直译”未充分反映介词ב所引出的方式性短语
    rationale: בְהַעֲבִיר可译为“借着/藉着使他们经过”，而非单纯并列的“使他们经过，给它们”。脚注应同时说明本节未明说“火”。
