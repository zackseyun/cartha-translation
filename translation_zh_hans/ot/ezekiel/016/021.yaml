revisions:
- from: 你宰杀了我的儿子，把他们献给那些偶像，使他们经火归给它们。[a]
  to: 你宰杀了我的儿子，把他们交给那些偶像，叫他们经火。[a]
  rationale: 修订以“交给”直接对应נתן，以“叫他们经火”表达בְהַעֲבִיר的方式，并删除中文中重复且不自然的“归给”。“那些偶像”依据相邻上下文释明לָהֶם的所指；脚注保留本节未明载“火”的事实及该惯用语的语境含义。
