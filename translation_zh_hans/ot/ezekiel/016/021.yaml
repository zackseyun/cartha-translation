  yaml_path: translation/ot/ezekiel/016/021.yaml
  text: You slaughtered my sons and gave them up to them by making them pass through the fire[a].
translation:
  language: zh_hans
  text: 你宰杀了我的儿子，把他们交给那些偶像，叫他们经火。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “叫他们经火”所对应的希伯来语直译为“借着使他们经过，把他们交给它们”。本节没有明说“火”；但按这里及相关经文的祭仪语境，“使儿女经过”是指使他们经火，作为献给偶像的祭献。
    reason: 说明原文的方式性表达、复数代词所指及正文根据语境补出的“火”。
lexical_decisions:
- source_word: וַתִּשְׁחֲטִי
  choice: 你宰杀了
  rationale: שׁחט常指宰杀，尤其带有献祭语境；“宰杀”比一般的“杀死”更能保留原文暴力而祭仪性的意味。
- source_word: בָּנָי
  choice: 我的儿子
  rationale: 原文明确使用阳性复数“儿子”，并以第一人称所有格表达上帝对他们的归属主张。
- source_word: וַתִּתְּנִים
  choice: 把他们献给
  rationale: נתן在此表示交出或给予；结合献祭和偶像崇拜的上下文，“献给”自然地表达交付对象及祭献意味。
- source_word: בְּהַעֲבִיר אוֹתָם
  choice: 使他们经火
  rationale: 字面是“使他们经过”；在以西结书相关的祭仪语境中，这是使儿女经火献祭的惯用表达。正文补出“火”，使现代读者明白其所指。
- source_word: לָהֶם
  choice: 归给它们
  rationale: 代词回指上下文中的偶像；用“它们”而非“他们”符合现代汉语对无生命偶像的通常指称。“归给”保留方向或受益关系，同时避免与前面的“献给”生硬重复。
theological_decisions:
- issue: 是否在正文中明说“经火”这一祭献含义
  choice: 在正文译作“使他们经火”
  alternative: 使他们经过，归给它们
  rationale: “火”并未明见于本节希伯来语，但“使儿女经过”在本书及相关先知语境中是指经火献祭的固定表达。正文补明其语境意义，同时以脚注交代字面形式，以免掩盖原文措辞。
- issue: לָהֶם所指对象
  choice: 按上下文理解为那些偶像
  alternative: 仅译作“给它们”，不明说所指
  rationale: 本节本身只用复数代词，但前文明确谈到偶像。正文用“那些偶像”帮助读者识别指代，并非引入额外神学判断。
translation_notes:
  register: 采用现代、庄重而直接的指控语气。“宰杀”保留祭仪性暴力；“我的儿子”忠实保留原文的性别和所属表达。正文补出惯用语所隐含的“火”，并以脚注保留字面上的歧义。
