  text: וַ/יְהִ֕י אַחֲרֵ֖י כָּל רָעָתֵ֑/ךְ א֣וֹי א֣וֹי לָ֔/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/023.yaml
  text: And it came about[a], after all your wickedness—woe[b], woe to you! declares the Lord GOD—
translation:
  language: zh_hans
  text: 在你这一切恶行之后——你有祸了！你有祸了！这是主耶和华的宣告——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 以后
  rationale: 该形式承接上文并引出后续发展；结合 אַחֲרֵי，在汉语中以“……以后”自然表达叙事推进，避免生硬直译为“事情发生了”。
- source_word: אַחֲרֵי כָּל רָעָתֵךְ
  choice: 你行了这一切恶事以后
  rationale: אַחֲרֵי 表时间上的“以后”；כָּל 保留“一切”的总括力；רָעָה 在本段指道德恶行，译作“恶事”既准确又自然。
- source_word: אוֹי אוֹי לָךְ
  choice: 你有祸了！有祸了！
  rationale: 保留两次 אוֹי 的重复及其强烈的哀叹、审判意味；分成两个感叹句符合现代汉语先知性宣告的力度。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 该词用于先知公式，标明话语出自神；“宣告”庄重且比“话语”更能体现权威性的神谕。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现 אֲדֹנָי 的“主”和四字神名 יהוה 的传统汉语形式“耶和华”，避免合并或遗漏其中一个称号。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”在简体中文圣经语域中清楚、庄重，并同时保留“主”的称号与 יהוה 这一专名；不以“主上帝”取代专名，也不借译法引入宗派性解释。
- issue: אוֹי 的哀叹与审判张力
  choice: 你有祸了！有祸了！
  alternative: 哀哉，哀哉！；你真可悲！
  rationale: “有祸了”同时容纳悲叹和审判警告，不把该词单纯解释为同情或咒诅，并保留原文重复所加强的语势。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。原文句末破折式悬接下一节，译文保留末尾破折号，以显示第23节的句法尚未完结。
