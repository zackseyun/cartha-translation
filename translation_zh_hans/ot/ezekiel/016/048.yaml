base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/048.yaml
  text: As I live[a], declares the Lord GOD, your sister Sodom, she and her daughters[b], has not done as you and your daughters have done.
translation:
  language: zh_hans
  text: “我凭我的永生起誓[a]，”主耶和华宣告，“你的姊妹所多玛和她的众城[b]，绝没有做过你和你的众城所做的事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是一种起誓格式，直译近似：“我活着……如果你的姊妹所多玛做过……。”这种结构表达强烈的否定。
    reason: lexical_alternative
  - marker: b
    text: “众城”原文为“女儿们”，指与所多玛和耶路撒冷相属的城镇或群体。
    reason: cultural_note
lexical_decisions:
- source_word: חַי אָנִי
  choice: 我凭我的永生起誓
  rationale: 这是庄严的神圣起誓用语；该译法在现代汉语中自然清楚，并保留誓言以神永活为凭据的含义。
- source_word: נְאֻם
  choice: 宣告
  rationale: 先知书中常见的神谕引介语；“宣告”庄重而符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的主权称谓和 יהוה 的专名性质，且符合中文圣经语域。
- source_word: אִם
  choice: 绝没有
  rationale: 在 חַי־אני 引出的省略式誓言结构中，אִם 表达强烈否定；译出“绝没有”可清楚传达其语用力量。
- source_word: סְדֹם אֲחוֹתֵךְ
  choice: 你的姊妹所多玛
  rationale: 保留本章把所多玛与耶路撒冷称为姊妹的家族隐喻。
- source_word: הִיא וּבְנוֹתֶיהָ
  choice: 所多玛和她的众城
  rationale: 显明代词所强调的所多玛本身，并按先知文学中的地域隐喻，将“女儿们”理解为附属城镇或相关群体；脚注保留字面说法。
- source_word: כַּאֲשֶׁר עָשִׂית אַתְּ וּבְנוֹתָיִךְ
  choice: 你和你的众城所做的事
  rationale: 保留对耶路撒冷的阴性单数直接称呼及其与相关城镇共同受责的比较结构。
theological_decisions:
- issue: 神名 יהוה 在复合称号 אֲדֹנָי יְהוִה 中的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”在现代中文圣经语境中是可识别的神名形式，并与“主”区分称谓和专名；不以普通称号取代原文神名。
- issue: 誓言结构 חַי־אני ... אִם 的解释
  choice: 译作庄严的强烈否定：“我凭我的永生起誓……绝没有”
  alternative: 按表层句法译作“我活着……如果所多玛做过……”
  rationale: 这里的 אִם 属于希伯来誓言中的省略结构，语义为强调否定；直译成条件句会使现代读者误解。
- issue: “女儿们”在本节地域隐喻中的所指
  choice: 正文译作“众城”
  alternative: 正文直译“女儿们”
  rationale: 上下文把所多玛和耶路撒冷人格化，并以“女儿们”指与其相属的城镇或群体；正文传达所指，脚注保存原有隐喻和可能范围。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“姊妹”保留城市人格化和亲属隐喻；“众城”避免现代读者把“女儿们”误解为实际亲生女儿，同时以脚注注明原文字面表达。
