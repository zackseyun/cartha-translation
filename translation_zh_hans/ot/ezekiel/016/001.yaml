  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为四字神名“YHWH”（יהוה）；其古代读音不能完全确定。“雅威”为常见拟音，中文也常译作“耶和华”。
    reason: 说明神名的原文形式、拟音的不确定性及常见中文译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知领受启示的固定表达“耶和华的话临到……”中，“临到”准确传达事件的发生及话语朝向先知而来，也符合现代中文圣经语体。
- source_word: דְבַר
  choice: 话
  rationale: 此处指来自上帝的启示性话语；译作“话”既保留先知书的固定表达，也不把含义过度解释为“信息”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名יהוה；中文采用广为人知的传统音译“耶和华”，将专名与“主”这一称号区分开来。
- source_word: אֵלַי
  choice: 我
  rationale: 介词אֶל加第一人称单数词尾表示话语所临到的对象；中文“临到我”自然、准确。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文的直接言语；中文叙事公式以“说”简洁自然地承接。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名יהוה，而非“主”这一称号。现代中文存在“耶和华”和“雅威”两种常见形式；正文采用中文读者最熟悉且仍作为专名使用的“耶和华”，脚注说明原文形式与另一拟音，避免把有争议的古代发音表述为确定事实。
translation_notes:
  register: 采用自然、庄重而简洁的现代标准普通话，保留先知书常见公式“耶和华的话临到我，说”。脚注标记置于引语导语之后，以免割裂神名及句法结构。
