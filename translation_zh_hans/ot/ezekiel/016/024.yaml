  language: zh_hans
  text: 你为自己建造了高台[a]，又在每个广场为自己设立了丘坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高台”所译的希伯来词十分罕见，含义不确定；也可理解为“拱顶小室”“平台”，或可能指与卖淫有关的设施。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּב
  choice: 高台
  rationale: 此词罕见，所指建筑形式不确定。“高台”保留人工建造、可能高起的平台意象，同时避免直接译作妓院或庙宇而过度解释。
- source_word: רָמָה
  choice: 丘坛
  rationale: 该词在先知文献中常指用于祭祀的高处或坛场；“丘坛”既体现其高度，也传达本节语境中的宗教用途。
- source_word: רְחֹוב
  choice: 广场
  rationale: 该词常指城中的开阔公共空间，而不只是道路；“广场”符合本段强调公开、遍布各处的语境。
- source_word: וַתִּבְנִי לָךְ / וַתַּעֲשִׂי לָךְ
  choice: 你为自己建造……为自己筑了
  rationale: 两处 לָךְ 均保留受益或为己用途的含义；中文稍作句式变化，以自然表达希伯来文的平行结构。
- source_word: בְּכָל
  choice: 在各
  rationale: 表达分布性，即这些设施设于城中各个公共场所。
theological_decisions:
- issue: 是否在正文中将建筑用语明确译成淫乱或祭偶像的场所
  choice: 正文采用相对具体但不过度限定的建筑用语“高台”和“丘坛”
  alternative: 将 גֶּב 译为“妓院”“淫所”或“淫祠”
  rationale: 本章以淫乱比喻偶像崇拜，但 גֶּב 本身罕见且含义不确定。正文不把上下文中的性隐喻直接写入这个词，以保留词义上的不确定性；脚注说明其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两个并列动作及两次“为自己”的强调；将“在各广场”放入第二分句，使中文语序自然。
