base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/009.yaml
  text: Then I washed you with water[a], rinsed your blood off you[b], and anointed you with oil.
translation:
  language: zh_hans
  text: 于是，我用水给你洗身[a]，把你身上的血冲洗掉[b]，又用油涂抹你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用水给你沐浴。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“把你的血从你身上冲洗掉。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְחָצֵךְ
  choice: 给你洗身
  rationale: רחץ表示洗或沐浴；“给你洗身”自然地表达对身体的清洗，也保留本节照料弃婴的具体图景。
- source_word: בַּמַּיִם
  choice: 用水
  rationale: 介词ב在这里表示洗涤所用的媒介；现代汉语以“用水”最自然。
- source_word: וָאֶשְׁטֹף
  choice: 冲洗掉
  rationale: שטף在此指冲去、洗去；“冲洗掉”既体现动作，也与后面的血从身上被除去相配。
- source_word: דָּמַיִךְ
  choice: 你的血
  rationale: 原文虽为血的复数形式，但此处宜按希伯来语惯用法译作集合意义的“血”，不解释为“血迹”。
- source_word: מֵעָלָיִךְ
  choice: 你身上的
  rationale: 该短语直译为“从你上面”；结合冲洗动作，译作“把你身上的血……掉”符合现代汉语，同时保留血附在身体上的图景。
- source_word: וָאֲסֻכֵךְ
  choice: 膏抹你
  rationale: סוך指用油涂抹身体，也可译为膏抹；此处“膏抹”兼顾具体护理动作及庄重语体，不额外赋予礼仪含义。
- source_word: בַּשָּׁמֶן
  choice: 用油
  rationale: שמן仅指油，原文未明确是橄榄油，因此不增添具体种类。
theological_decisions:
- issue: 寓意中洁净行动的性质
  choice: 按寓意画面译为具体的身体清洗和膏抹，不在正文中加入圣礼、礼仪或盟约解释。
  alternative: 把洗身和膏抹明确译成带有盟约或宗教礼仪意味的行动。
  rationale: 本节本身描写的是洗身、除血和用油膏抹；神学寓意应由以西结书第16章的上下文显明，而不应预先写入译文。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“洗身”比单说“洗你”明确自然；“膏抹”保留圣经语体，同时仍清楚指用油涂抹身体。所有第二人称均为女性单数，但现代汉语不在形式上标示。
