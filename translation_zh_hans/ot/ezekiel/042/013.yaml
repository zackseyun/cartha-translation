  text: וַ/יֹּ֣אמֶר אֵלַ֗/י לִֽשְׁכ֨וֹת הַ/צָּפ֜וֹן לִֽשְׁכ֣וֹת הַ/דָּרוֹם֮ אֲשֶׁ֣ר אֶל פְּנֵ֣י הַ/גִּזְרָה֒ הֵ֣נָּה לִֽשְׁכ֣וֹת הַ/קֹּ֗דֶשׁ אֲשֶׁ֨ר יֹאכְלוּ שָׁ֧ם הַ/כֹּהֲנִ֛ים אֲשֶׁר קְרוֹבִ֥ים לַֽ/יהוָ֖ה קָדְשֵׁ֣י הַ/קֳּדָשִׁ֑ים שָׁ֞ם יַנִּ֣יחוּ קָדְשֵׁ֣י הַ/קֳּדָשִׁ֗ים וְ/הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם כִּ֥י הַ/מָּק֖וֹם קָדֹֽשׁ־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/013.yaml
  text: Then he said to me[a], “The north chambers, the south chambers, which are opposite the separate area—they are the holy chambers, where the priests who draw near to Yahweh shall eat the most holy things. There they shall place the most holy things, the grain offering, the sin offering, and the guilt offering[d][c][b], for the place is holy.”
translation:
  language: zh_hans
  text: 他对我说：“北面的房间和南面的房间，就是隔离区对面的那些圣房[a]。可以亲近雅威的祭司要在那里吃至圣之物[b]。他们要把至圣之物，就是素祭、赎罪祭[c]和赎愆祭[d]，放在那里，因为这地方是圣的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“面对隔离区的”。原文表示这些房间位于圣殿建筑群中划分出来的特定区域对面。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“圣中之圣的东西”；这里指圣洁等级最高的祭物，并不是称为“至圣所”的内殿。
    reason: lexical_alternative
  - marker: c
    text: “赎罪祭”也可译作“洁净祭”，后者强调这种祭所具有的洁净作用。
    reason: alternative_reading
  - marker: d
    text: “赎愆祭”也可译作“赔偿祭”，后者强调这种祭所涉及的赔偿或补偿。
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁכוֹת
  choice: 房间
  rationale: 在以西结的圣殿异象中，此词指供圣殿事务使用的建筑空间。“房间”是现代汉语中自然、清楚的建筑用语。
- source_word: הַצָּפוֹן / הַדָּרוֹם
  choice: 北边和南边
  rationale: 两词在此标明房间的方位；与“那些房间”连用，既忠实又符合现代汉语表达。
- source_word: אֶל־פְּנֵי הַגִּזְרָה
  choice: 朝向隔离区
  rationale: אֶל־פְּנֵי 表示空间上的面对、朝向；הַגִּזְרָה 是本异象中的特定分隔区域。“隔离区”保留其受划分、受限制的含义，不擅自将其具体化为院子。
- source_word: לִשְׁכוֹת הַקֹּדֶשׁ
  choice: 圣洁的房间
  rationale: 该短语说明这些房间是分别为圣的空间；译作“圣洁的”也与本节反复出现的 קדשׁ 语汇相呼应。
- source_word: קְרוֹבִים לַיהוָה
  choice: 亲近雅威
  rationale: 此处不是单指位置接近，而是指祭司在礼仪事奉中获准来到雅威面前；“亲近”保留这种祭司性含义。
- source_word: קָדְשֵׁי הַקֳּדָשִׁים
  choice: 至圣之物
  rationale: 这里指圣洁等级最高的祭物，并非称为“至圣所”的内殿；下文列出的素祭、赎罪祭和赎愆祭明确了所指。
- source_word: יַנִּיחוּ
  choice: 放在那里
  rationale: 使役词形在此表示把物品安放于指定地点；“放”自然准确，也适合上下文中的存放用途。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 在祭司礼仪语境中，מִנְחָה 是由细面等献上的特定祭类；“素祭”是简洁且通行的中文术语。
- source_word: הַחַטָּאת
  choice: 赎罪祭
  rationale: 这是该祭类通行且易懂的中文名称；脚注保留“洁净祭”这一强调洁净功能的译法。
- source_word: הָאָשָׁם
  choice: 赎愆祭
  rationale: 该译名既表示罪责，也保留此祭常涉及补偿或赔偿的背景；脚注列出“赔偿祭”作为功能性译法。
- source_word: כִּי הַמָּקוֹם קָדֹשׁ
  choice: 因为这地方是圣的
  rationale: כִּי 引出祭物应安放于此的理由；“因为”在现代汉语中清楚表达这一因果关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较有根据的读音音译，保留神的专名性质。
- issue: קָדְשֵׁי הַקֳּדָשִׁים 的所指
  choice: 至圣之物
  alternative: 至圣的祭物
  rationale: 该表达在此指最高圣洁等级的祭物，而不是内殿“至圣所”；译文保留“之物”的广度，同时由后面的祭物清单加以说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句法依照希伯来文的说明次序，同时拆分长句以提高可读性；保留圣洁等级、祭司亲近神以及各类祭物之间的礼仪张力，不作宗派化解释。
