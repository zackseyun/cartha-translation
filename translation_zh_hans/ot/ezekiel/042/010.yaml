  yaml_path: translation/ot/ezekiel/042/010.yaml
  text: Along the width of the court wall toward the east[a], facing the separate area and facing the building[b], were chambers.
translation:
  language: zh_hans
  text: 沿着院墙的宽度[a]，朝东，正对着分隔区[b]和那座建筑的是房间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在院子围墙的宽度范围内”或“沿着院墙的宽度”。希伯来原文是高度压缩的建筑方位描述。
    reason: lexical_alternative
  - marker: b
    text: “分隔区”译自以西结圣殿异象中的专门用语，指从周围建筑中划分出来的一块特定区域。
    reason: cultural_note
lexical_decisions:
- source_word: בְּרֹחַב
  choice: 沿着……的宽面
  rationale: בְּ加רֹחַב表达相对于宽度的方位或延伸；此处建筑描写高度压缩，用“沿着……的宽面”保留空间关系而不强行具体化。
- source_word: גֶּדֶר הֶחָצֵר
  choice: 院墙
  rationale: גֶּדֶר可指墙、篱笆或围障；在圣殿建筑语境中，“院墙”自然简洁，也保留围界之意。
- source_word: דֶּרֶךְ הַקָּדִים
  choice: 朝东
  rationale: דֶּרֶךְ与方位词连用可表示方向或所在一侧；“朝东”保留方向性，不将其过度限定为“东边”。
- source_word: אֶל פְּנֵי
  choice: 正对着
  rationale: 在建筑方位描写中，该短语表示面向或处于某物前方；“正对着”适合两次并列所表达的朝向关系。
- source_word: הַגִּזְרָה
  choice: 隔开之地
  rationale: 此词在以西结的圣殿异象中指被划分、隔开的特定区域；采用“隔开之地”保留其技术性及词根所含的分隔意味。
- source_word: הַבִּנְיָן
  choice: 那座建筑
  rationale: 该名词泛指建筑或构筑物；定冠词表明是上下文所指的特定建筑，故译作“那座建筑”。
- source_word: לְשָׁכוֹת
  choice: 有一些房间
  rationale: לְשָׁכוֹת指圣殿建筑群中的房间或厢房；原文为无动词的省略句，中文补出“有”，并用“房间”保持现代易懂的表达。
