base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/011.yaml
  text: And before them was a passage[a], like the appearance of the chambers that faced north; as was their length, so was their width, and all their exits, their arrangements[b], and their entrances were alike.
translation:
  language: zh_hans
  text: 在这些房间前面有一条通道[a]，样式与北面那些房间相同；这些房间的长宽都与北面那些房间相同，所有的出口、布局[b]和入口也都相同。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这些房间前面有一条通道，其样式与北面那些房间相对应。”“北面”也可译为“朝北”。
    reason: 原文对北面房间的表述可按方位或朝向理解；正文采用较中性的“北面”。
  - marker: b
    text: 译作“布局”的希伯来词也可指“规例”“规定”或“规定的方式”；此处可能指房间按规定形成的格局或构造。
    reason: 该词既有规范、规例方面的含义，也可在建筑语境中表示规定的形制或安排。
lexical_decisions:
- source_word: וְדֶרֶךְ
  choice: 有一条通道
  rationale: דֶּרֶךְ通常指道路、路径；在圣殿建筑语境中指房间前供人通行的通道。“通道”自然且不过度限定其具体构造。
- source_word: לִפְנֵיהֶם
  choice: 在这些房间前面
  rationale: 该短语表示空间位置；补出“这些房间”以明确代词所指，同时不改变原意。
- source_word: כְּמַרְאֵה הַלְּשָׁכוֹת
  choice: 样式与……那些房间相同
  rationale: מַרְאֶה本指外观、形态；此处比较建筑的整体形制，用“样式”比直译“外观”更符合汉语建筑语境。
- source_word: אֲשֶׁר דֶּרֶךְ הַצָּפוֹן
  choice: 朝北的
  rationale: 原文表达朝向或方位，可理解为“朝北”或“在北边”；正文采用简洁的方向性表达。
- source_word: כְּאָרְכָּן כֵּן רָחְבָּן
  choice: 长度怎样，宽度也怎样
  rationale: 保留希伯来文对应式结构，并表达这一组房间在长宽尺度上与北边房间相同。
- source_word: וְכֹל מוֹצָאֵיהֶן
  choice: 所有的出口
  rationale: מוֹצָא在建筑语境中可指出去之处或出口；“出口”清楚自然。
- source_word: וּכְמִשְׁפְּטֵיהֶן
  choice: 布局
  rationale: מִשְׁפָּט常指判例、规例或规定的方式；在建筑描述中更可能指规定的形制、安排或格局，故译“布局”，并以脚注保留其词义张力。
- source_word: וּכְפִתְחֵיהֶן
  choice: 入口
  rationale: פֶּתַח指开口、门口或入口；此处“入口”符合建筑语境。
- source_word: 末尾省略的比较关系
  choice: 也都相同
  rationale: 希伯来文末段没有明说限定动词，但延续前面的比较结构；汉语补出“也都相同”，使句意完整。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑叙述语体。“房间”比传统的“厢房”更通俗，也不额外限定用途；分号保留原文先总述样式、再列举尺寸与出入口等细节的层次。
