  text: לְ/אַרְבַּ֨ע רוּח֜וֹת מְדָד֗/וֹ ח֤וֹמָה ל/וֹ֙ סָבִ֣יב סָבִ֔יב אֹ֚רֶךְ חֲמֵ֣שׁ מֵא֔וֹת וְ/רֹ֖חַב חֲמֵ֣שׁ מֵא֑וֹת לְ/הַבְדִּ֕יל בֵּ֥ין הַ/קֹּ֖דֶשׁ לְ/חֹֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/020.yaml
  text: He measured it on the four sides[a]; it had a wall all around, five hundred cubits long and five hundred cubits wide[b], to make a separation between the holy and the common.
translation:
  language: zh_hans
  text: 他从四面量了它[a]；周围有墙，长五百，宽五百[b]，为要分隔圣与俗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从四面”也可译作“向四个方向”；原文直译为“四风”。
    reason: lexical_alternative
  - marker: b
    text: 原文在两个“五百”之后都没有明说计量单位；可依据上下文理解为肘。
    reason: textual_clarity
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: 四面
  rationale: רוּחוֹת本义可指“风”或“方向”；在建筑测量语境中，指四个方向，也就是四面。
- source_word: מְדָדוֹ
  choice: 他量了
  rationale: 这是Qal完成式第三人称阳性单数，带第三人称阳性单数宾语后缀；宾语承接上下文所述的整个区域，中文可自然省略代词宾语。
- source_word: חוֹמָה לוֹ סָבִיב סָבִיב
  choice: 四周都有围墙
  rationale: חוֹמָה意为“墙”；重复的סָבִיב强调环绕四周，译文用自然的现代汉语表达其周遍之意。
- source_word: אֹרֶךְ חֲמֵשׁ מֵאוֹת וְרֹחַב חֲמֵשׁ מֵאוֹת
  choice: 长五百，宽五百
  rationale: 原文只明说长、宽各五百，本节没有明示计量单位；因此正文不补入“肘”，保留原文的省略。
- source_word: לְהַבְדִּיל
  choice: 为要……分开
  rationale: 不定式表达目的；“为要……分开”清楚保留这一目的关系。
- source_word: בֵּין הַקֹּדֶשׁ לְחֹל
  choice: 把圣地和俗地分开
  rationale: 在此空间语境中，定冠词形式的“圣”指分别为圣的区域，חֹל指未分别为圣的普通区域；“俗地”比“亵渎之地”更准确地表达礼仪类别的对比。
theological_decisions:
- issue: קֹדֶשׁ与חֹל的礼仪性对比
  choice: 圣地和俗地
  alternative: 圣的和普通的；圣地和非圣之地；圣地和亵渎之地
  rationale: 本节区分分别为圣的空间与普通、未分别为圣的空间，并非断言后者在道德上邪恶或遭到亵渎。“圣地和俗地”既适合建筑语境，也保留圣俗范畴的张力。
- issue: 五百的计量单位
  choice: 正文不补明单位
  alternative: 五百肘
  rationale: 本节希伯来文没有出现“肘”；虽然上下文可帮助读者推知单位，翻译正文仍保留原文的省略，并以脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“四周都有围墙”避免生硬重复，却传达סָבִיב סָבִיב的周遍强调；“俗地”在圣殿空间语境中表示普通、未分别为圣之地，不含“庸俗”或道德败坏之意。
