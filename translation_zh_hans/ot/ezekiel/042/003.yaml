base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/003.yaml
  text: Opposite the twenty cubits that belonged to the inner court[a], and opposite the pavement that belonged to the outer court[b], gallery faced gallery in the third story.
translation:
  language: zh_hans
  text: 这排房间与内院那二十肘宽的空地相对，也与外院的铺石地相对；在第三层[b]，廊道[a]彼此相对。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “廊道”所译的希伯来词是罕见的建筑术语，也可能指柱廊、门廊或类似的上层结构。
    reason: lexical_alternative
  - marker: b
    text: 或译“在第三级”；这里的希伯来语很可能是指建筑的第三层。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגֶד
  choice: 与……相对
  rationale: 表示建筑物在空间上正对某处；“与……相对”简洁自然，并保留两者隔开相望的关系。
- source_word: הָעֶשְׂרִים
  choice: 那二十肘宽的空地
  rationale: 原文只说“那二十”，但结合本段建筑测量和上下文，所指是内院旁二十肘宽的地带；补出“肘”和“宽的空地”使现代读者易于理解。
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: 内院……的
  rationale: 这里的介词ל表示该二十肘地带与内院的所属或关联关系，用“内院……的”自然表达。
- source_word: רִצְפָה
  choice: 铺石地
  rationale: 该词在圣殿建筑语境中指铺砌的地面；“铺石地”具体且符合现代汉语。
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: 外院的
  rationale: 介词ל在这里表示铺石地与外院的关联，译为“外院的”最简明。
- source_word: אַתִּיק
  choice: 廊道
  rationale: 这是罕见的建筑术语，确切形制不明；“廊道”可指沿建筑上层延伸的结构，同时不把它过度限定为柱廊或门廊。
- source_word: אֶל־פְּנֵי
  choice: 彼此相对
  rationale: 该短语描述一处建筑结构面向另一处；在重复结构中译为“彼此相对”符合汉语表达。
- source_word: בַּשְּׁלִשִׁים
  choice: 在第三层
  rationale: 建筑语境表明它很可能指第三层或第三级，而不是孤立的序数；“在第三层”清楚表达主要理解。
- source_word: （承接上文的省略主语）
  choice: 这排房间
  rationale: 本节原文延续前文对房间的描述而省略主语；汉语补出“这排房间”，使独立经节通顺，同时不改变所指。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的建筑叙述。“这排房间”承接上文补足汉语主语；分号区分房间所面对的区域与第三层廊道之间的关系。脚注标记分别紧随“廊道”和“第三层”，与注释内容准确对应。
