  text: And below these chambers was the entrance from the east[a], as one enters them from the outer court.
translation:
  language: zh_hans
  text: 在这些房间下方，有一处从东边进入的入口[a]；从外院进入这些房间时，人就由此进入。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“从东边”；这句话既可能表示入口位于东侧，也可能表示人从东边来到入口。
    reason: 保留 מֵהַקָּדִים 在建筑方位描述中的两种可能理解。
lexical_decisions:
- source_word: וּמִתַּחְתֶּה
  choice: 下方
  rationale: 表达相对于前述房间或建筑的垂直空间关系，同时不擅自补充具体建筑构造。
- source_word: לְשָׁכוֹת הָאֵלֶּה
  choice: 这些房间
  rationale: לְשָׁכוֹת在圣殿建筑语境中指附属房间；“房间”是现代汉语中自然、清楚而不过度古雅的说法。
- source_word: הַמָּבוֹא
  choice: 入口
  rationale: 该词指进入之处或通道口；“入口”准确且符合现代建筑描述。
- source_word: מֵהַקָּדִים
  choice: 从东边
  rationale: 贴近希伯来语介词מִן与“东边”的字面组合，保留它既可表示由东而来、也可能指入口位于东侧的空间含混。
- source_word: בְּבֹאוֹ לָהֵנָּה
  choice: 人……进入这些房间时
  rationale: 将带第三人称单数后缀的不定式结构按语境作泛指表达，避免在中文中无根据地限定为某一男性。
- source_word: מֵהֶחָצֵר הַחִיצֹנָה
  choice: 从外院
  rationale: “外院”是圣殿建筑语境中简洁清楚的对应语，也保留与内院相对的术语关系。
theological_decisions: []
