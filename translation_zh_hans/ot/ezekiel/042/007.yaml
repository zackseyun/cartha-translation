  yaml_path: translation/ot/ezekiel/042/007.yaml
  text: And the wall that was outside[a], alongside the chambers, toward the outer court, in front of the chambers—its length was fifty cubits.
translation:
  language: zh_hans
  text: 外面有一道墙，与房间相对[a]，朝向外院，位于房间前面；长五十肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与房间对应”或“沿着房间”。希伯来文介词可表示相对、对应或并列的空间关系。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָדֵר
  choice: 墙
  rationale: 该词指围合或分隔的构筑物；在圣殿建筑语境中译作“墙”最自然。
- source_word: לַחוּץ
  choice: 外面
  rationale: 表示这道墙位于相关房间的外侧，简明保留空间关系。
- source_word: לְעֻמַּת
  choice: 与……相对
  rationale: 该介词表示对应或面对的位置；原文并未明确限定为严格平行，故采用较为开放的“相对”。
- source_word: לְּשָׁכוֹת
  choice: 房间
  rationale: 指圣殿建筑群内有特定用途的房室；“房间”是现代汉语中自然清楚的建筑用语。
- source_word: דֶּרֶךְ הֶחָצֵר הַחִיצוֹנָה
  choice: 朝向外院
  rationale: 此处 דֶּרֶךְ 表示方位，整体说明墙与外院之间的方向关系。
- source_word: אֶל־פְּנֵי הַלְּשָׁכוֹת
  choice: 横在房间前面
  rationale: אֶל־פְּנֵי 表示位于或面向某物之前；加入“横在”使墙体的空间位置在汉语中更清楚，但不改变其基本关系。
- source_word: אָרְכּוֹ
  choice: 墙长
  rationale: 阳性单数后缀回指前面的墙；汉语明确重复“墙”，可避免代词所指含混。
- source_word: חֲמִשִּׁים אַמָּה
  choice: 五十肘
  rationale: 保留原文古代长度单位“肘”，不在正文中换算为现代单位。
