base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/001.yaml
  text: Then he brought me out into the outer court by the way toward the north[b][a], and he brought me to the chamber that was opposite the separate area and opposite the building to the north.
translation:
  language: zh_hans
  text: 他领我出来，沿着朝北的路[a]到了外院；又领我到那房间。那房间与分隔区[b]相对，也与北边的建筑物相对。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“那路，北方的路”，是表示路线和方向的强调说法。
    reason: lexical_alternative
  - marker: b
    text: 或译“隔开之地”。原词指圣殿异象中一处被划分出来的区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: 他领我出来
  rationale: 使役形表示使“我”出去；“领我出来”自然体现引导者带先知离开原处，也承接异象叙事。
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: 外院
  rationale: חָצֵר在圣殿建筑语境中指院落，הַחִיצוֹנָה限定为外面的院；“外院”简洁、通行。
- source_word: הַדֶּרֶךְ דֶּרֶךְ הַצָּפוֹן
  choice: 沿着朝北的路走
  rationale: 希伯来文重复דֶּרֶךְ，构成强调路线和方向的表达；中文不机械重复，以“沿着……的路走”保留行进路线之意。
- source_word: וַיְבִאֵנִי
  choice: 又领我到
  rationale: בוא的使役形可指带到或领到某处；此处不明确说进入房间内部，因此用“领我到”避免过度说明。
- source_word: הַלִּשְׁכָּה
  choice: 那房间
  rationale: לִשְׁכָּה在圣殿建筑中指房间或厢房；按马所拉文本的单数译为“那房间”。
- source_word: נֶגֶד
  choice: 在……对面
  rationale: 此词在这里描述建筑物之间相对的位置；两个实例一致译作“对面”。
- source_word: הַגִּזְרָה
  choice: 分隔区
  rationale: 该词在以西结的圣殿异象中指被划分、隔开的区域；“分隔区”保留其空间分隔含义而不额外赋予礼仪性质。
- source_word: הַבִּנְיָן
  choice: 那座建筑物
  rationale: בִּנְיָן泛指建筑或建筑物；“建筑物”在本段空间说明中清楚自然。
- source_word: אֶל הַצָּפוֹן
  choice: 北边
  rationale: 末尾短语标示北方位置。其具体修饰关系在原文中略有压缩，正文按最自然的句法将其理解为北边的建筑物。
theological_decisions:
- issue: הַגִּזְרָה所指区域的性质
  choice: 分隔区
  alternative: 隔离地／特定区域
  rationale: 原词强调被划开或分隔的空间，但并未在本节明确其神学或礼仪功能，因此不译成带有更强宗派或礼制解释的术语。
translation_notes:
  register: 采用现代、庄重而清楚的建筑叙述用语。为避免长串关系从句造成歧义，将后半句拆为两句；保留单数“房间”，并用脚注说明两个较生硬或有词义选择空间的希伯来语表达。
