base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/012.yaml
  text: And corresponding to the doorways of the chambers that were toward the south[a], there was a doorway at the head of the way, the way in front of the protective wall, toward the east[b], as one enters them.
translation:
  language: zh_hans
  text: 与朝南房间的各个入口相对应，也有一个入口，在通道的起头；这通道在围护墙[b]前面，在东边；进入这些房间时，便可来到这入口[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在进入它们时”。原文在这一段多次使用“道路、通路”一词，具体建筑布局及末句与前文的连接方式不十分确定。
    reason: lexical_alternative
  - marker: b
    text: 译作“围护墙”的希伯来语组合较罕见，也可理解为护墙、隔墙或遮蔽用的墙。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְפִתְחֵי
  choice: 与……各入口相对应
  rationale: 介词 כְּ 表示比较或对应关系；结合上文的对称建筑布局，译为“相对应”比单纯译作“像”更清楚，同时保留复数“入口”。
- source_word: הַלְּשָׁכוֹת
  choice: 房间
  rationale: לִשְׁכָּה 在圣殿建筑语境中指附属房间；“房间”是现代汉语中自然、易懂且不过度限定用途的表达。
- source_word: אֲשֶׁר דֶּרֶךְ הַדָּרוֹם
  choice: 朝南的
  rationale: 该短语说明方位；“朝南”保留方向意义，又不强行判定这些房间是在南侧还是仅入口面向南方。
- source_word: פֶּתַח
  choice: 一个入口
  rationale: פֶּתַח 指开口或入口，不一定指有门扇的实体门，因此采用“入口”。
- source_word: בְּרֹאשׁ דָּרֶךְ
  choice: 设在通道的起头
  rationale: רֹאשׁ 与 דֶּרֶךְ 连用表示道路或通道的起点；“起头”较贴近原文的空间意象，具体建筑含义则留在脚注说明。
- source_word: דֶּרֶךְ
  choice: 通道
  rationale: 本节的 דֶּרֶךְ 多次指建筑群中的进出路线；“通道”比泛称“道路”更符合建筑语境。
- source_word: בִּפְנֵי הַגְּדֶרֶת הֲגִינָה
  choice: 在护墙前面
  rationale: בִּפְנֵי 表示“在……前面”；גְּדֶרֶת 指墙、篱或隔障，罕见修饰语 הֲגִינָה 很可能表达保护、围护或遮隔作用，正文以简洁的“护墙”呈现，并用脚注保留不确定性。
- source_word: דֶּרֶךְ הַקָּדִים
  choice: 朝向东边
  rationale: 该方向短语说明通道或入口的朝向；“朝向东边”自然且不额外指定其确切位置。
- source_word: בְּבוֹאָן
  choice: 人由此进入这些房间
  rationale: בוא 的不定式结构带阴性复数后缀，最自然地回指“房间”；采用无人称“人”表达进入动作，“由此”使汉语句法连贯，但不添加特定进入者。
