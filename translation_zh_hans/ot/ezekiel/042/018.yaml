  text: 他用量度的竿量了南面，共五百竿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些抄本和古代译本在这处量度的语境中作“肘”而非“竿”；马所拉文本作“竿”。
