lexical_decisions:
- source_word: ר֥וּחַ הַ/דָּר֖וֹם
  choice: 南面
  rationale: רוּחַ可指风、方向或一面；在四周边界依次测量的建筑语境中，指建筑区域的南面，而非南风。
- source_word: מָדָ֑ד
  choice: 他量了
  rationale: מדד意为“量、测量”；主语承接上文持量竿的测量者，汉语明确补出“他”。
- source_word: חֲמֵשׁ מֵא֥וֹת
  choice: 五百
  rationale: 按希伯来文基数词结构直译。
- source_word: קָנִ֖ים
  choice: 竿
  rationale: קָנֶה本义为芦苇或竿，在本异象中用作长度单位。马所拉文本明确为复数“竿”，不在正文中改作异文“肘”。
- source_word: בִּ/קְנֵ֥ה הַ/מִּדָּֽה
  choice: 是用量度的竿量的
  rationale: 介词ב表示工具，说明五百竿的尺度是按该标准量竿测得；此译法也避免把“竿”误解为未经界定的普通长度。
