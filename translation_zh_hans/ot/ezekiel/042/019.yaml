  text: He turned to the west side and measured five hundred reeds with the measuring reed[a][b].
translation:
  language: zh_hans
  text: 他转向西边[a]，用量度竿量了五百竿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向海的方向”，这是希伯来语表示西方的一种说法。
    reason: cultural_note
  - marker: b
    text: 有些译本和解释者在此测量语境中作“五百肘”，但这里的希伯来文本作“五百竿”。
    reason: alternative_reading
lexical_decisions:
- source_word: סָבַב
  choice: 转向
  rationale: 该动词可表示“转、绕行”。在逐边测量的语境中，是转到下一方位，并不明确表示绕行一周，因此译作“转向”。
- source_word: אֶל רוּחַ הַיָּם
  choice: 向西边
  rationale: 字面为“向海的方向”；在希伯来地理表达中，“海”通常指西面的地中海，故正文按实际方位译为“西边”，并以脚注保留原文意象。
- source_word: מָדַד
  choice: 量了
  rationale: 这是测定长度或范围的常用动词；现代汉语中“量了”简洁自然，也与本段连续测量的叙述相符。
- source_word: חֲמֵשׁ מֵאוֹת קָנִים
  choice: 五百竿
  rationale: 马所拉文本明确写“竿”的复数，而不是“肘”。保留原文计量单位，不把解释性换算放入正文。
- source_word: בִּקְנֵה הַמִּדָּה
  choice: 用量度的竿
  rationale: 介词在此表示工具；该短语指作为标准量具的竿。译作“用量度的竿”既贴近原文，又能与前面的计量单位“五百竿”相呼应。
theological_decisions: []
translation_notes:
