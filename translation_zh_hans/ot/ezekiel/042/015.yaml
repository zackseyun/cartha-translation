base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/015.yaml
  text: When he had finished measuring the inner house[a], he brought me out by way of the gate that faced east[b], and he measured it all around.
translation:
  language: zh_hans
  text: 他量完内殿后，就领我从那朝东的门出去，又测量了四周。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内殿”原文直译为“里面的房屋”；在本段圣殿异象中，“房屋”指殿宇。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“其面朝向东方的门”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה אֶת מִדּוֹת
  choice: 他量完……的尺寸
  rationale: כִּלָּה表示“完成”，מִדּוֹת是“尺寸、测量所得的数据”；译作“量完……的尺寸”既保留名词含义，也符合现代汉语叙事。
- source_word: הַבַּיִת הַפְּנִימִי
  choice: 内殿
  rationale: בַּיִת本义为“房屋”，但在本段圣殿异象的建筑语境中指殿宇；“内殿”简洁自然，并保留其位于内部的空间含义。
- source_word: וְהוֹצִיאַנִי
  choice: 就领我……出去
  rationale: יצא的使役式表示使人出去，可译“带出”或“领出”；此处“领我……出去”符合引导者带先知察看建筑的语境。
- source_word: דֶּרֶךְ הַשַּׁעַר
  choice: 从……门
  rationale: דֶּרֶךְ在这里表示所经路线；现代汉语用“从……门出去”比直译“经由……门”更自然。
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: 朝东的
  rationale: 原文直译为“其面朝向东方”；“朝东的门”准确表达门的朝向，并在脚注保留原文的具象说法。
- source_word: וּמְדָדוֹ
  choice: 又量了殿
  rationale: 阳性单数后缀所指对象并未完全明说，最可能回指殿宇；正文补出“殿”以使汉语明确，脚注说明原文只作代词，保留指代上的可能张力。
- source_word: סָבִיב סָבִיב
  choice: 四周
  rationale: 重复的סָבִיב强调周围各面；“四周”在现代汉语中自然地表达环绕各边的意思。
theological_decisions:
- issue: וּמְדָדוֹ中代词后缀的指代
  choice: 正文理解为“殿”，即量殿的四周
  alternative: 可理解为量整个建筑群或其外围
  rationale: 最近且语境最合适的先行词是“内殿/殿宇”，但原文仅用阳性单数代词，范围并未进一步限定，因此以脚注提示其字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“内殿”体现圣殿建筑语境；“领我从……出去”保持动作顺序清楚。正文所有脚注标记均已对应列出。
