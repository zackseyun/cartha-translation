  rationale: רֹחַב指横向尺寸；采用简洁的无系词测量句式，与现代汉语建筑描述相符。
- source_word: חֲמִשִּׁים אַמּוֹת
  choice: 五十肘
  rationale: 直接保留数值及古代单位，并与前面的“一百肘”保持一致。
