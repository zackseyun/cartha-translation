- source_word: אֶל פְּנֵי
  choice: 朝着……的一面
  rationale: 这一紧凑的空间表达表示相对于所量建筑的朝向或位置；译法力求自然，同时保留原文可能兼具“面对”和“在前面”的含义。
- source_word: אֹרֶךְ
  choice: 长
  rationale: 在建筑尺寸语境中指纵向长度；与数值连用时译作“长一百肘”符合现代汉语习惯。
- source_word: אַמּוֹת הַמֵּאָה
  choice: 一百肘
