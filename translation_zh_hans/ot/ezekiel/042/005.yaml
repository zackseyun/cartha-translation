  text: וְ/הַ/לְּשָׁכ֥וֹת הָ/עֶלְיוֹנֹ֖ת קְצֻר֑וֹת כִּֽי יוֹכְל֨וּ אַתִּיקִ֜ים מֵ/הֵ֗נָה מֵֽ/הַ/תַּחְתֹּנ֛וֹת וּ/מֵ/הַ/תִּֽכֹנ֖וֹת בִּנְיָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/005.yaml
  text: And the upper chambers were narrower[a], because the galleries took away from them, more than from the lower and the middle parts of the building.
translation:
  language: zh_hans
  text: 上层的房间较窄[a]，因为廊道占用了它们的空间，比占用下层和中层房间的空间更多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “廊道”也可译作“平台”、“柱廊”或“凸台”。这里的希伯来语 אַתִּיקִים 是罕见的建筑术语，具体所指不能确定。
    reason: 保留罕见建筑术语的词义不确定性。
lexical_decisions:
- source_word: הַלְּשָׁכוֹת
  choice: 房间
  rationale: 在圣殿建筑语境中指附属房室；“房间”是现代汉语中自然、清楚的建筑用语。
- source_word: הָעֶלְיוֹנוֹת
  choice: 上层的
  rationale: 与本节后面的下层和中层形成三层空间对照。
- source_word: קְצֻרוֹת
  choice: 较窄
  rationale: 该词本义可指短小或缩减；在这里因廊道占用空间，宜理解为横向尺度较小，但不排除“较短”的可能。
- source_word: כִּי
  choice: 因为
  rationale: 明确表达后半句对上层房间较窄的原因说明。
- source_word: יוֹכְלוּ
  choice: 占去了……空间
  rationale: 字面为“吃掉、消耗”；此处是建筑空间上的比喻，译作“占去空间”符合现代汉语。
- source_word: אַתִּיקִים
  choice: 廊道
  rationale: 这是罕见而含义不确定的建筑术语；“廊道”可读性强，同时以脚注保留其他可能。
- source_word: מֵהֵנָה
  choice: 它们
  rationale: 回指上层房间，表示廊道从这些房间所占用的空间。
- source_word: מֵהַתַּחְתֹּנוֹת וּמֵהַתִּכֹנוֹת
  choice: 比占去整座建筑下层和中层的空间更多
  rationale: 依上下文将连续的介词结构理解为比较，清楚呈现上层与下层、中层受空间侵占程度的差异。
- source_word: בִּנְיָן
  choice: 整座建筑
  rationale: 指所描述的建筑结构整体；“整座建筑”使中文中的层级归属更明确。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。主句保持建筑描述的层次关系；为避免生硬直译“吃掉”，用“占去了……空间”表达其空间效应。
