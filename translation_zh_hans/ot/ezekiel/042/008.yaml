base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/008.yaml
  text: For the length of the chambers that were by the outer court was fifty cubits, and behold, the part facing the temple was a hundred cubits.
translation:
  language: zh_hans
  text: 因为靠外院的房室长五十肘；看哪，朝向圣殿的那一面长一百肘[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朝向圣殿的那一面”原文直译可作“在圣殿前面”；句中没有明说长一百肘的具体对象。
    reason: 保留希伯来文省略主语所造成的空间指代歧义，同时说明正文为求通顺所作的补足。
lexical_decisions:
- source_word: הַלְּשָׁכוֹת
  choice: 房室
  rationale: 指圣殿建筑群中的附属房间；“房室”既保留建筑语境，也比过于专门化的译词更易懂。
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: 靠外院
  rationale: 介词 לְ 在此表达这些房室与外院的空间关系；“靠”自然地传达邻接或朝向关系，而不强行限定其精确位置。
- source_word: אַמָּה
  choice: 肘
  rationale: 保留古代长度单位“肘”，避免用现代单位作未经文本明确支持的精确换算。
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: 朝向圣殿的那一面
  rationale: 结合本节对两侧长度的比较，将省略的空间主语自然补出；“朝向”保留该短语所表达的相对方位。
- source_word: הַהֵיכָל
  choice: 圣殿
  rationale: 此处指圣殿主体建筑；译作“圣殿”符合现代汉语宗教建筑语境，并与整个异象的场景一致。
theological_decisions: []
