  text: 'He measured the east side with the measuring reed: five hundred reeds by the measuring reed[a], all around.'
translation:
  language: zh_hans
  text: 他用量杆量东面；按量杆计，周围共五百杆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本字面作“五肘，杆”，措辞有疑难。结合上下文四面的尺寸（16—19节），通常理解为“五百杆”；有些抄本和古代译本也更明确地反映这一读法。
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  choice: 量
  rationale: 这是动词 מדד 的 Qal 完成式第三人称阳性单数，在连续叙事中表示执行测量。现代汉语用“量”简洁自然。
- source_word: רוּחַ הַקָּדִים
  choice: 东面
  rationale: 在建筑测量语境中，רוּחַ 与方位词连用指某一侧或方向，而非“东风”；“东面”符合本段空间描写。
- source_word: בִּקְנֵה הַמִּדָּה
  choice: 用量杆；按量杆计
  rationale: בְּ 首次表示工具，即“用量杆”；重复出现时表明所报数值以该量杆为尺度，译作“按量杆计”既保留重复，又符合现代汉语。
- source_word: חֲמֵשׁ אמות קָנִים
  choice: 五百杆
  rationale: 马所拉文本字面形式异常，含“五、肘、杆”等成分；结合16—19节平行尺寸及部分抄本和古译本的证据，正文采用通常理解的“五百杆”，并以脚注保留文本疑难。
- source_word: סָבִיב
  choice: 共
  rationale: 此词通常表示“周围、四面”。在16—19节逐面测量的句式中，它可能提示整个四周的测量；本节单独译作“共”避免误导为同一东面本身‘环绕’，并让其总结性语气自然呈现。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“量杆”清楚表达用于测量的杆具；“按量杆计”保留原文第二次出现的尺度说明。正文不强行展开 סָבִיב 的空间含义，以免造成东面环绕建筑的误解；相关总体意义由本段上下文呈现。
