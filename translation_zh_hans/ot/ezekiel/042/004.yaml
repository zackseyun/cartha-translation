  yaml_path: translation/ot/ezekiel/042/004.yaml
  text: Before the chambers was a walkway ten cubits wide toward the inner court[a], and a passage one cubit wide[b]; and their entrances faced north.
translation:
  language: zh_hans
  text: 房间前面有一条宽十肘、通向内侧的走道[a]，另有一条宽一肘的通路[b]；房间的入口都朝北。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“通向里面的／内侧的”，没有明说所指的名词。有些译本补作“通向内院”。
    reason: alternative_reading
  - marker: b
    text: 这一短语的希伯来文本较难理解。可按现有读法理解为“一肘宽的通路”；另有不同的读音或文本传统作“一百肘”。
    reason: textual_variant
lexical_decisions:
- source_word: לִפְנֵי הַלְּשָׁכוֹת
  choice: 房间前面
  rationale: לִפְנֵי表示空间上的“在……前面”；לְשָׁכוֹת在圣殿建筑语境中指房间或厢房。采用现代汉语“房间”，清楚自然且不过度古雅。
- source_word: מַהֲלַךְ
  choice: 走道
  rationale: 该词指供人行走之处或通道；“走道”既体现用途，也不强行把它解释为封闭的走廊。
- source_word: עֶשֶׂר אַמּוֹת רֹחַב
  choice: 宽十肘
  rationale: 忠实保留原文的长度单位和宽度表达，并符合现代汉语建筑描述习惯。
- source_word: אֶל הַפְּנִימִית
  choice: 通向内侧
  rationale: 原文只有阴性单数的“里面的／内侧的”，所修饰的名词被省略。“内侧”保留方向意义，不在正文中擅自补出“院子”。
- source_word: דֶּרֶךְ
  choice: 通路
  rationale: 在此建筑语境中表示道路或通行路径；译作“通路”可与前面的מַהֲלַךְ“走道”略作区分。
- source_word: אַמָּה אֶחָת
  choice: 宽一肘
  rationale: 原文直译为“一肘”；依据前句的宽度结构补出“宽”，使汉语清楚，但以脚注说明本句的文本和解释困难。
- source_word: וּפִתְחֵיהֶם
  choice: 房间的入口
  rationale: פֶּתַח可指开口、门口或入口；复数附属代词回指房间。汉语明确说“房间的入口”，避免代词指向含混。
- source_word: לַצָּפוֹן
  choice: 都朝北
  rationale: 该短语表示入口的朝向；“朝北”是自然明确的现代汉语建筑用语，“都”对应复数入口的整体陈述。
