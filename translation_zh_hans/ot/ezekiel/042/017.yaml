  text: 'He measured the north side: five hundred reeds[a], by the measuring reed all around.'
translation:
  language: zh_hans
  text: 他用量度竿量北面，四围共五百竿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“五百竿”。有些抄本和古代译本所反映的读法，被一些译本译为“五百肘”。正文在此遵从马所拉希伯来文本。
    reason: textual_variant
lexical_decisions:
- source_word: מָדַד
  choice: 他量了
  rationale: 这是动词 מדד 的 Qal 完成式第三人称阳性单数，在异象叙事中承接前文，表示那人完成量度的动作。
- source_word: רוּחַ הַצָּפוֹן
  choice: 北面
  rationale: רוּחַ 可指风、方向或一面；在建筑测量语境中，意指北侧，而非北风。
- source_word: חֲמֵשׁ מֵאוֹת
  choice: 五百
  rationale: 按马所拉文本直译该基数词结构。
- source_word: קָנִים
  choice: 竿
  rationale: קָנֶה 本义为芦苇或竿，这里用作量度单位；“竿”既符合测量语境，也保留希伯来文本不同于“肘”的读法。
- source_word: בִּקְנֵה הַמִּדָּה
  choice: 按量度竿计算
  rationale: 介词 ב 表示量度所用的工具或标准；此译法自然表达以量度竿为计量标准。
- source_word: סָבִיב
  choice: 共
  rationale: 本词通常表示“周围、四围”；结合相邻各边依次测量的语境，此处概括该面的完整量度。译文以“共”表达全长，但其周界含义可由上下文体现。
theological_decisions: []
