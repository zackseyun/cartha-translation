base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/006.yaml
  text: For they were in three stories[a], and they had no pillars like the pillars of the courts; therefore the upper stories receded more than the lower and middle ones from the ground.
translation:
  language: zh_hans
  text: 因为这些房间有三层，又没有像院子那样的柱子；所以从地面起，上层比下层和中层更向内收缩[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向内收缩”或译“被削减”“逐渐收窄”；这里的希伯来语动词罕见，确切的建筑含义不能确定。
    reason: 保留罕见动词 נֶאֱצַל 在此处的词义和建筑形态上的不确定性。
lexical_decisions:
- source_word: כִּי
  choice: 因为／说明性地译为“这些……却……”的句式
  rationale: 本词承接上文，说明建筑形成该形态的原因；中文以分号前的陈述自然表达这种解释关系，无须机械保留“因为”。
- source_word: מְשֻׁלָּשׁוֹת הֵנָּה
  choice: 这些房间共有三层
  rationale: 该形式在建筑语境中表示三重、分为三层；“这些房间”承接上下文所述房间，使中文指代清楚。
- source_word: וְאֵין לָהֶן עַמּוּדִים
  choice: 却没有……柱子
  rationale: 希伯来语存在句加 ל 表示领有；“没有柱子”是自然、准确的现代汉语。
- source_word: כְּעַמּוּדֵי הַחֲצֵרוֹת
  choice: 院子那样的柱子
  rationale: 保留与院中柱子的明确比较；“院子”符合圣殿建筑语境。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 明确表达没有柱子所造成的建筑后果。
- source_word: נֶאֱצַל
  choice: 向内退缩
  rationale: 该罕见动词在此建筑语境中大概表示被削减、后退或内收；正文采用最能呈现空间关系的“向内退缩”，并以脚注保留不确定性。
- source_word: מֵהַתַּחְתּוֹנוֹת וּמֵהַתִּיכֹנוֹת
  choice: 比下层和中层更
  rationale: 两个阴性复数名词化形式指下层和中层；介词 מִן 在此按比较关系处理。
- source_word: מֵהָאָרֶץ
  choice: 从地面往上
  rationale: 在建筑描述中指以地面为起点；此译法比“从地上退缩”更符合自然汉语，同时不把它扩展为额外的建筑细节。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“房间、三层、柱子、地面”等普通建筑词汇帮助读者理解，同时用脚注避免把不确定的建筑结构解释定死。
