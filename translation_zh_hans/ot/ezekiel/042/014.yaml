source:
  edition: WLC
  text: בְּ/בֹאָ֣/ם הַ/כֹּהֲנִ֗ים וְ/לֹֽא יֵצְא֤וּ מֵ/הַ/קֹּ֨דֶשׁ֙ אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָ֔ה וְ/שָׁ֞ם יַנִּ֧יחוּ בִגְדֵי/הֶ֛ם אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ן כִּֽי קֹ֣דֶשׁ הֵ֑נָּה ילבשו בְּגָדִ֣ים אֲחֵרִ֔ים וְ/קָרְב֖וּ אֶל אֲשֶׁ֥ר לָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/014.yaml
  text: When the priests enter[a], they shall not go out from the holy place into the outer court, but there they shall leave their garments in which they minister, for they are holy. They shall put on other garments, and then approach what belongs to the people.
translation:
  language: zh_hans
  text: 祭司进去的时候，不可从圣处出去到外院；他们要把供职时所穿的衣服留在那里，因为那些衣服是圣洁的。他们要穿上别的衣服，然后才可走近那为百姓而设的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“那为百姓的”，其中省略了名词；按上下文，可能指为百姓而设或百姓可以进入的区域，也可能泛指与百姓有关的事物。
    reason: 说明希伯来文省略表达及其可能所指，避免把空间解释或其他具体名词当作原文明说。
lexical_decisions:
- source_word: בְּבֹאָם הַכֹּהֲנִים
  choice: 祭司进去的时候
  rationale: 介词 בְּ 加带后缀的不定词结构构成时间从句；原文未明说进入何处，因此不补出宾语。
- source_word: וְלֹא יֵצְאוּ
  choice: 不可……出去
  rationale: 未完成式在圣殿规例中具有指令意味；“不可”符合现代汉语的规章语体。
- source_word: מֵהַקֹּדֶשׁ
  choice: 从圣处
  rationale: קֹדֶשׁ 在此指与外院相对的神圣区域；“圣处”保留空间含义，又不将其过度限定为某一具体建筑。
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: 进入外院
  rationale: 表达从神圣区域向外院的移动，简洁自然。
- source_word: וְשָׁם יַנִּיחוּ בִגְדֵיהֶם
  choice: 他们要把……衣服留在那里
  rationale: נוּחַ 的使役式在此指放置、留下；结合更衣语境，“留在那里”最清楚。
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶן
  choice: 供职时所穿的
  rationale: שׁרת 在祭司语境中指礼仪性的职事；介词 בָהֶן 表明他们穿着这些衣服供职。
- source_word: כִּי קֹדֶשׁ הֵנָּה
  choice: 因为那些衣服是圣的
  rationale: 阴性复数代词明确回指衣服；在汉语中重述“那些衣服”，可避免误解所指，同时保留“圣”的直陈。
- source_word: יִלְבְּשׁוּ בְּגָדִים אֲחֵרִים
  choice: 他们要穿上别的衣服
  rationale: 直接表达离开神圣区域前更换衣服的要求。
- source_word: וְקָרְבוּ
  choice: 然后才可走近
  rationale: קרב 意为靠近、走近；“才可”自然呈现更衣之后方能接近的次序与规例意味。
- source_word: אֶל אֲשֶׁר לָעָם
  choice: 百姓所在之处
  rationale: 原文是省略表达，直译近于“属于／为百姓的”；正文按空间语境补出“所在之处”，脚注说明原文的省略与其他可能理解。
theological_decisions:
- issue: 祭司衣服的圣洁及圣俗空间的区分
  choice: 明确说供职所穿的衣服是圣的，并保留祭司更衣后方可接近百姓区域的次序
  alternative: 把本句仅理解为实用性的更衣规定，或将末句理解为接近属于百姓的事物
  rationale: 经文把衣服的圣洁作为不得直接穿入外院的原因；译文不把“圣”弱化为一般礼仪程序，也不进一步引申其神学机制。
- issue: אֶל אֲשֶׁר לָעָם 的省略性质
  choice: 正文译作“百姓所在之处”，并以脚注保留“为百姓的／属于百姓的”这一较宽泛理解
  alternative: 百姓的事物；为百姓而设的区域
  rationale: 上下文主要涉及空间移动，但希伯来文没有明说“地方”或“区域”；因此正文提供可读的空间表达，脚注则保留原文未决之处。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“供职”体现祭司职事语境；“圣处”避免把 קֹדֶשׁ 过度限定为某一建筑；句式保持规例性的清晰与节奏。
