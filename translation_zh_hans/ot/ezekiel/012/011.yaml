base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/011.yaml
  text: 'Say[a], ‘I am a sign to you: just as I have done, so it shall be done to them; into exile[b], into captivity they shall go.’'
translation:
  language: zh_hans
  text: 你要说：‘我是给你们的记号[a]；我怎样做，这事也必照样临到他们身上。他们必流亡，被掳而去[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记号”也可译作“预兆”或“象征性的奇事”。原文词语可指记号、预兆或具有象征意义的奇事。
    reason: lexical_alternative
  - marker: b
    text: 原文将“流亡”和“被掳”并列，强调他们将离乡并落入被俘的处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: 你要说
  rationale: 单数祈使式，吩咐以西结宣告下文；现代汉语用“你要说”既自然，也保留命令语气。
- source_word: מוֹפֶתְכֶם
  choice: 给你们的预兆
  rationale: מוֹפֵת可指记号、预兆或具有象征意义的奇事。这里以西结本人及其行动预示将临之事；“预兆”较“神迹”更贴合审判语境，并保留其指向未来的象征功能。
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: 我怎样做
  rationale: 比较结构把先知已经完成的象征行动与百姓即将经历的事相连；汉语无需明示完成体，也能由上下文表达。
- source_word: כֵּן יֵעָשֶׂה לָהֶם
  choice: 他们也必怎样遭遇
  rationale: 原文为被动形式，焦点在临到他们身上的事，而没有明说施事者。“遭遇”以自然汉语保留这一焦点；“必”表达预告的确定性。
- source_word: בַּגּוֹלָה
  choice: 流亡
  rationale: גּוֹלָה在此表示离乡被放逐的状态或经历；与后面的“被掳”并列，译作“流亡”可保留两词差异。
- source_word: בַשְּׁבִי
  choice: 被掳
  rationale: שְׁבִי指被俘、被掳的状态。译作“被掳”既符合圣经历史语境，也不与前面的“流亡”合并。
- source_word: יֵלֵכוּ
  choice: 而去
  rationale: הלך表示“去、走”。置于“流亡，被掳”之后，译为“而去”自然表达朝向流亡与被掳境地而去。
theological_decisions:
- issue: 以西结所扮演之象征角色的性质
  choice: 我就是给你们的预兆
  alternative: 我就是给你们的记号
  rationale: 本节不仅说以西结传递信息，也说他本人及其行动象征将要临到百姓的事。“预兆”保留מוֹפֵת在此所带的预示性，又不把它限定为超自然神迹。
- issue: 审判行动的施事者
  choice: 他们也必怎样遭遇
  alternative: 也必照样行在他们身上
  rationale: 希伯来文采用被动形式，没有在本句明说施事者。译文不补出“上帝”或其他主体，以保留原文的表达重点和含蓄性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们”对应复数后缀；“必”保留先知宣告的确定语气。主文保留“流亡／被掳”的并列，但按自然汉语调整句法。
