  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/נָּשִׂ֨יא אֲשֶׁר בְּ/תוֹכָ֜/ם אֶל כָּתֵ֤ף יִשָּׂא֙ בָּ/עֲלָטָ֣ה וְ/יֵצֵ֔א בַּ/קִּ֥יר יַחְתְּר֖וּ לְ/ה֣וֹצִיא ב֑/וֹ פָּנָ֣י/ו יְכַסֶּ֔ה יַ֗עַן אֲשֶׁ֨ר לֹא יִרְאֶ֥ה לַ/עַ֛יִן ה֖וּא אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/012.yaml
  text: And the prince who is among them will lift his baggage onto his shoulder in the dark and go out[a]. They will dig through the wall to bring him out through it[c][b]. He will cover his face so that he may not see the land with his eyes.
translation:
  language: zh_hans
  text: 他们中间的首领必在黑暗中[a]把行囊[b]扛在肩上出去。人必把墙挖通，好从那里把他带出去。他必蒙住脸，因为他不能亲眼看见这地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在暮色中”。原词可指黑暗或昏暗，并含有隐蔽行事的意味。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“抬到肩上”，没有明说所抬的东西；“行囊”是根据上下文所述的迁徙行装补出的。
    reason: contextual_supplied_object
  - marker: c
    text: 也可按上下文译为“使他不能亲眼看见这地”或“以致他不能亲眼看见这地”。原文连接语通常表示原因，亦有学者在此按目的或结果理解。
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: 首领
  rationale: 该词指身居高位的统治者或领袖；本节没有使用“王”一词，因此译作“首领”，既保留政治身份，也避免过度具体化。
- source_word: בְּתוֹכָם
  choice: 他们中间的
  rationale: 直译为“在他们中间”，此处作定语译为“他们中间的”，自然且忠实。
- source_word: אֶל כָּתֵף יִשָּׂא
  choice: 把行囊扛在肩上
  rationale: 原文直译为“抬到肩上”，本节未明说宾语；“行囊”依据上下文反复出现的迁徙行装补出，使中文语意完整，并以脚注说明。
- source_word: בָּעֲלָטָה
  choice: 在黑暗中
  rationale: 该词可指黑暗、昏暗，且在此带有隐蔽逃离的意味；“在黑暗中”最贴合语境，同时脚注保留“暮色中”的可能。
- source_word: וְיֵצֵא
  choice: 出去
  rationale: 直接表达从所在之处离开的动作，简洁自然。
- source_word: בַּקִּיר יַחְתְּרוּ
  choice: 人必把墙挖通
  rationale: חתר 描写挖穿或凿穿墙壁；复数主语未明指，中文用泛指“人”表达。
- source_word: לְהוֹצִיא בוֹ
  choice: 好从那里把他带出去
  rationale: 使役式表达“带出去”；בוֹ 指借着所挖通之处出去，中文“从那里”自然承接前面的墙洞。
- source_word: פָּנָיו יְכַסֶּה
  choice: 他必蒙住脸
  rationale: 准确保留遮盖面部的具体动作；“蒙住脸”符合现代汉语表达。
- source_word: יַעַן אֲשֶׁר לֹא יִרְאֶה
  choice: 使自己不能看见
  rationale: 按动作与后果的顺序理解为目的或结果；原连词也可能表原因，故在脚注中保留另一读法。
- source_word: לַעַיִן
  choice: 亲眼
  rationale: 原文意为“用眼睛”；“亲眼”在中文中凝练而具体地保留视觉含义。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 此处指首领将要离开的那片土地，而非单指地面；“这地”符合先知书语境。
theological_decisions:
- issue: “扛在肩上”的隐含宾语
  choice: 正文根据近邻语境补出“行囊”
  alternative: 不补宾语，译作“扛在肩上”
  rationale: 希伯来文本本节没有明示宾语，但上下文的象征行动明确涉及迁徙行装。补出“行囊”可使中文完整，同时用脚注公开说明这一补充。
- issue: יַעַן אֲשֶׁר 在末句中的语义关系
  choice: 按目的或结果译为“使自己不能……”
  alternative: 按原因译为“因为他不能……”
  rationale: “蒙住脸”之后接“不能看见”，最自然地呈现动作的目的或结果；但原连接语可有因果含义，因此不排除另一理解，并在脚注中注明。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“首领”保留原文政治称谓的宽度；“行囊”作为上下文补语明确标注；末句保留目的／结果与原因两种句法可能。
