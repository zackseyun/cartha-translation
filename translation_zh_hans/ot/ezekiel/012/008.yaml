  yaml_path: translation/ot/ezekiel/012/008.yaml
  text: And in the morning the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 早晨，雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”；中文传统译作“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了
  rationale: 此处的 wayyiqtol 推进叙事并引出先知领受话语的惯用公式；结合时间短语译作“到了早晨”，比直译“事情发生了”更自然。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留 דָּבָר 的“话”及先知书惯用公式的呼应，不将其解释性地改译为“信息”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名 YHWH，明确保留原文中的专名。
- source_word: אֵלַי
  choice: 临到我
  rationale: “临到我”是现代中文圣经语体中自然、庄重的先知话语公式，也准确表达话语朝向说话者而来。
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 直接表达神的话临到先知的时间。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下一节的直接话语；中文用“说：”自然衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文音译为“雅威”可保留其专名性质，脚注同时交代中文传统译法，不把神名替换为称号。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“临到我”保留先知书公式化语感；冒号表明下文将出现直接引语。
