  text: בֶּן אָדָ֗ם הִנֵּ֤ה בֵֽית יִשְׂרָאֵל֙ אֹֽמְרִ֔ים הֶ/חָז֛וֹן אֲשֶׁר ה֥וּא חֹזֶ֖ה לְ/יָמִ֣ים רַבִּ֑ים וּ/לְ/עִתִּ֥ים רְחוֹק֖וֹת ה֥וּא נִבָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/027.yaml
  text: Son of man, look, the house of Israel is saying, ‘The vision that he sees is for many days from now, and he prophesies about distant times.’
translation:
  language: zh_hans
  text: “人子啊，看哪，以色列家说：‘他所看见的异象，是关乎许多日子以后的事；他所说的预言，是关乎遥远的时期。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝对先知的一贯称呼，既贴近希伯来语形式，也符合中文圣经传统。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者留意的语气，庄重而简明。
- source_word: בֵית יִשְׂרָאֵל
  choice: 以色列家的人
  rationale: “以色列家”保留群体称谓，加“的人”使现代汉语句法自然，并明确说话主体。
- source_word: הֶחָזוֹן אֲשֶׁר הוּא חֹזֶה
  choice: 他所看见的异象
  rationale: 保留 חזה 的同根表达所涉及的“看见”，同时避免生硬重复。
- source_word: לְיָמִים רַבִּים
  choice: 要到许多日子以后才会实现
  rationale: 该短语字面为“关乎许多日子”，在语境中是百姓声称异象离应验尚远；补出“实现”传达其语用含义。
- source_word: וּלְעִתִּים רְחוֹקוֹת הוּא נִבָּא
  choice: 他所说的预言，是指着遥远的将来
  rationale: 将 נבא 译作“说预言”，将“遥远的时期”自然表达为“遥远的将来”，保留百姓把预言推至远期的意思。
theological_decisions:
- issue: 百姓的话是否被叙述者认可
  choice: 完整保留为引语，不加入评价
  alternative: 在译文中加上“他们以为”等否定性提示
  rationale: 本节只引述以色列家的说法；其错误由上下文纠正，不应在本句中预先解释。
- issue: 异象与预言的时间关系
  choice: 表达为百姓认为异象许久以后才实现、预言指向遥远将来
  alternative: 解释为异象本身持续许多日子
  rationale: 介词短语与上下文指向应验时间遥远，但仍以引语形式保留这是百姓的判断。
translation_notes:
  register: 采用现代、庄重、可朗读的普通话。“人子”“看哪”“异象”“预言”保留经文语体；其余句法尽量自然清楚。
