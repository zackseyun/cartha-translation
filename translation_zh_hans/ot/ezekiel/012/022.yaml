  source_fidelity: 译文准确传达了神对以西结的称呼、在以色列地流传的俗语，以及该俗语对异象不会实现的怀疑。惟引语中“日子拖长了”使用完成体“了”，容易使中文读者理解为日子已经结束性地被拖长；希伯来文此处表达持续延宕的概括性说法，宜避免完成态。
  naturalness: 整体庄重、通顺。“你们在以色列地流传的这句俗语”自然地表达了该俗语在民间通行。将“日子拖长了”改为“日子一再拖延”，更符合现代汉语，也更能表达持续未实现的语境。
  terminology: “人子”恰当地保留了《以西结书》中固定的称呼形式；“俗语”“异象”“落了空”均合乎语境和现代经文语体。脚注中的“消失了”虽可对应אָבַד的部分词义，但在此会弱化异象未应验、归于无效的语境含义，宜改作“归于无有”。
