revisions:
- from: 人子啊，你们在以色列地流传的这句俗语是什么意思？它说：“日子拖长了，一切异象都落了空。”[a]
  to: 人子啊，你们在以色列地流传的这句俗语是什么意思？它说：“日子一再拖延，一切异象都落了空。”[a]
  rationale: 修订仅调整引语的时体和脚注替代译法：以“一再拖延”避免“了”所造成的完成态理解，并以“归于无有”更完整保留אָבַד在预言语境中的消亡、落空或失效的语义空间。其余译文忠实、自然，无须改动。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:30:33Z'
