  text: בֶּן אָדָ֗ם מָֽה הַ/מָּשָׁ֤ל הַ/זֶּה֙ לָ/כֶ֔ם עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַֽאַרְכוּ֙ הַ/יָּמִ֔ים וְ/אָבַ֖ד כָּל חָזֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/022.yaml
  text: Son of man[a], what is this proverb that you have in the land of Israel, saying, ‘The days drag on, and every vision comes to nothing’?”
translation:
  language: zh_hans
  text: 人子啊，你们在以色列地流传的这句俗语是什么意思？它说：“日子一再拖延，一切异象都落了空。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“日子延长，每个异象都归于无有。”
    reason: 原文中的两个动词可较直译为“延长”和“归于无有”；在本语境中，这句俗语带有预言迟延且不会应验的意味。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中反复出现的先知称呼。采用“人子”可保留原文的固定形式和全书的文学一致性；此处强调以西结作为人的身份，并不把后来的基督论含义强加于经文。
- source_word: מָה הַמָּשָׁל הַזֶּה
  choice: 这句俗语是什么意思
  rationale: מָשָׁל在此指民间流传、带有讥讽意味的固定说法，并非叙事性的比喻；“俗语”比“寓言”更切合语境。
- source_word: לָכֶם
  choice: 你们……流传的
  rationale: 介词与复数代词在这里表示这俗语为百姓所使用或持有；译作“你们……流传的”符合现代汉语表达，也呈现其在群体中通行的意思。
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: 在以色列地
  rationale: אַדְמָה本义为土地、土壤，此处指以色列境内，译作“以色列地”准确而自然。
- source_word: יַאַרְכוּ הַיָּמִים
  choice: 日子拖长了
  rationale: 该动词表示变长或延长；“拖长了”既保留时间延宕之意，也传达说这话之人认为预言迟迟不应验的轻蔑语气。
- source_word: וְאָבַד כָּל חָזוֹן
  choice: 一切异象都落了空
  rationale: אָבַד可表示灭亡、消失或归于无效；在预言应验的语境中，“落了空”自然表达他们断言所有先知异象终将失败的意思，同时保留其否定性的力度。
theological_decisions:
- issue: 先知称呼בֶּן אָדָם中אָדָם的译法
  choice: 人子
  alternative: 凡人；世人
  rationale: 此处是上帝对以西结惯用的称呼，而不是直接使用后世具有特定基督论意义的称号。“人子”保留原文形式、全书一致性及经文间的呼应，同时不额外作神学判定。
- issue: 百姓对异象结局的断言
  choice: 一切异象都落了空
  alternative: 一切异象都消失了；一切异象都失效了
  rationale: 原文אָבַד具有消失、灭亡和归于无效的语义空间。上下文表明这句俗语是在否定预言会应验，但译文不进一步限定他们究竟认为异象虚假、失效，还是已经消逝。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“流传的这句俗语”使לָכֶם的群体用语含义自然呈现；引语保持简洁有力，以符合民间口号的语感。脚注标记置于所说明的整句俗语之后。
