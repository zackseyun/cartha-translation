  - severity: low
    issue: 脚注替代译文的“消失了”语境指向不足
    rationale: אָבַד可指消失或毁灭，但在“每个异象”这一搭配中，该俗语所否定的是异象的实现。以“归于无有”保留较直译的消亡／失效空间，且不把其限定为单纯视觉上的消失。
  revised_text: 人子啊，你们在以色列地流传的这句俗语是什么意思？它说：“日子一再拖延，一切异象都落了空。”[a]
