source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה אֲדַבֵּר֙ אֵת֩ אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה לֹ֥א תִמָּשֵׁ֖ךְ ע֑וֹד כִּ֣י בִֽ/ימֵי/כֶ֞ם בֵּ֣ית הַ/מֶּ֗רִי אֲדַבֵּ֤ר דָּבָר֙ וַ/עֲשִׂיתִ֔י/ו נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/025.yaml
  text: For I am Yahweh[a]; the word that I speak will be done. It will no longer be delayed, for in your days, O rebellious house, I will speak a word and do it[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 因为我是耶和华；我所说的任何话都必成就[a]，这话不再迟延[b]。悖逆之家啊，在你们的日子，我必说话，也必成就所说的话。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我所说的话必成就。”原文的关系结构带有强调语气。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不再延续下去”或“不再拖延下去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，不以“上主”等称号替代专名；结尾的复合称谓 אֲדֹנָי יְהוִה 则译作“主耶和华”。
- source_word: אֵת אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: 我无论说什么话，那话
  rationale: 用“无论……什么……都……”传达希伯来语关系结构的强调语气，同时保留 דָּבָר 的“话”，突出神的发言及其实现之间的联系。
- source_word: וְיֵעָשֶׂה
  choice: 都必成就
  rationale: 以“成就”表达被动式所指的实现，并与后文神亲自“成就它”形成呼应；“必”体现语境中的确定性。
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: 不再迟延
  rationale: 这是自然的现代汉语表达，指所说之话或其应验不再被拖延，同时在脚注保留“延续下去”的较形式对应。
- source_word: בֵּית הַמֶּרִי
  choice: 悖逆之家
  rationale: 保留“家”的群体性和圣约语境，也保留原文直接称呼的严肃语气。
- source_word: וַעֲשִׂיתִיו
  choice: 也必成就它
  rationale: 原文形式在此表达将来且确定的行动；译文保留代词和前后平行，避免把神言语的实现弱化为一般事件。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: “宣告”自然地呈现先知公式 נְאֻם；“主耶和华”同时保留 אֲדֹנָי 的称号和 יְהוָה 的专名。
theological_decisions:
- issue: 神名与复合称谓的译法
  choice: 前段 יְהוָה 译为“耶和华”，末尾 אֲדֹנָי יְהוִה 译为“主耶和华”
  alternative: 前段译“上主”，末尾译“主上主”；或采用较新的音译“雅威”
  rationale: 这样既把四字神名作为专名呈现，又清楚区分末尾由称号与神名组成的庄严公式；“耶和华”也是普通现代中文读者最易识别的既有形式。
- issue: 神说话与事情成就之间的关系
  choice: 译作“那话都必成就……我必说出一句话，也必成就它”
  alternative: 译作“那事必发生……我说了就去做”
  rationale: 保留原文 דָּבָר 可指“话／事情”的张力，但在本节反复使用“说”的语境中以“话”为主，并用“成就”表达这话成为事实，不额外界定其实现机制。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“悖逆之家”刻意保留先知文学中的群体称呼；“就在你们的日子里”保留原文时间表达的开放性，不擅自限定为某一代或解释为“有生之年”。
