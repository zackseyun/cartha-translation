base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/004.yaml
  text: And you shall bring out your baggage like the baggage of exile by day before their eyes[b][a], and you yourself shall go out in the evening before their eyes like those going out into exile.
translation:
  language: zh_hans
  text: 你要在白天，当着他们的面，把你的行装带出去，像流亡者的行装[a]；到了傍晚，你自己要当着他们的面出去，如同流亡者离去那样[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像流亡时所用的行装。”原文既可泛指与流亡有关的行装，也可理解为一个流亡者的行装。
    reason: lexical_alternative
  - marker: b
    text: 或译：“像人们出去流亡那样。”原文直译近于“像流亡者的出去／离去”，是指被迁离时离去的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: 你要……搬出去
  rationale: 这是 יצא 的使役形，表示使物品出去；结合“行装”，译作“搬出去”自然地表达把物品带出，同时不额外限定搬运方式。
- source_word: כֵלֶיךָ
  choice: 你的行装
  rationale: כְּלִי 可指器具、物件或装备；在象征流亡的行动中，所指是离去时随身携带的物品。“行装”简洁、自然，也符合语境。
- source_word: כִּכְלֵי גוֹלָה
  choice: 像流亡时带的行装
  rationale: 原文是紧凑的属格结构，可指与流亡相关的行装，也可理解为某个流亡者的行装。正文采用自然中文概括这种关联，并以脚注保留个体性读法。
- source_word: גּוֹלָה
  choice: 流亡
  rationale: 该词可表示流亡的状态、迁徙流亡之事，也可指流亡者群体。“流亡”能维持全节主题，并避免把含义局限为监禁式的“被囚”。
- source_word: יוֹמָם
  choice: 在白天
  rationale: 明确表示白昼，与后半句“在晚上”形成原文中的时间对照。
- source_word: לְעֵינֵיהֶם
  choice: 当着他们的面
  rationale: 这是表示公开、可见行动的惯用语。译文两次重复，以保留原文刻意强调他们亲眼观看的效果。
- source_word: וְאַתָּה
  choice: 你自己
  rationale: 独立人称代词带有强调作用，“你自己”凸显先搬行装、后本人出去的对比。
- source_word: תֵּצֵא
  choice: 要……出去
  rationale: יצא 的基本义是出去；在本节的行动指令中，用“要……出去”清楚自然。
- source_word: בָּעֶרֶב
  choice: 在晚上
  rationale: 与前面的“在白天”相对，表达第二项行动发生的时间。
- source_word: כְּמוֹצָאֵי גּוֹלָה
  choice: 像流亡的人出去一样
  rationale: מוֹצָאֵי 是“出去、离去”的复数构造形式，短语可理解为流亡者出去的方式。正文将隐含的人称对象明说，使现代中文通顺；脚注保留较抽象的字面表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事指令语体。“当着他们的面”比直译“在他们眼前”更符合现代汉语，同时保留两次重复；“行装”和“流亡”贯穿象征行动的语境，不把 גּוֹלָה 的集合、状态与人物含义过早固定为单一解释。
