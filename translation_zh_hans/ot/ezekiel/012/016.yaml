reference: Ezekiel 12:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הוֹתַרְתִּ֤י מֵ/הֶם֙ אַנְשֵׁ֣י מִסְפָּ֔ר מֵ/חֶ֖רֶב מֵ/רָעָ֣ב וּ/מִ/דָּ֑בֶר לְמַ֨עַן יְסַפְּר֜וּ אֶת כָּל תּוֹעֲבֽוֹתֵי/הֶ֗ם בַּ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/016.yaml
  text: But I will spare from among them a few men from the sword[a], from famine, and from pestilence, so that they may recount all their abominations among the nations where they go; and they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 不过，我要使他们中间少数几个人从刀剑、饥荒和瘟疫中存留下来，好让他们在他们所到的列国中讲述自己一切可憎之事；他们就会知道我是雅威。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: 我要使……存留下来
  rationale: יתר的使役形在此表示使一部分人存留、成为余民；此译既保留“留下”的基本意义，也表达主动保存的语气。
- source_word: מֵהֶם אַנְשֵׁי מִסְפָּר
  choice: 他们中间少数几个人
  rationale: מֵהֶם具有从整体中选出的部分意义；אַנְשֵׁי מִסְפָּר是指人数很少、可以数算的人。现代汉语用“少数几个人”自然明确，不必机械保留希伯来语的阳性形式。
- source_word: מֵחֶרֶב מֵרָעָב וּמִדָּבֶר
  choice: 从刀剑、饥荒和瘟疫中
  rationale: 保留以西结书中常见的审判三联语。“刀剑”是战争或暴力死亡的转喻；רָעָב指饥荒；דֶּבֶר指瘟疫。
- source_word: לְמַעַן יְסַפְּרוּ
  choice: 好让他们……讲述
  rationale: לְמַעַן引出目的；ספר的加强词干在此指详加讲说或叙述。
- source_word: אֵת כָּל תּוֹעֲבוֹתֵיהֶם
  choice: 自己一切可憎之事
  rationale: תּוֹעֵבָה在以西结书中是强烈的道德—宗教用语，常涉及偶像崇拜等罪行；“可憎之事”保留其谴责力度。反身代词“自己”清楚表明这些事属于存留下来的人。
- source_word: בַּגּוֹיִם אֲשֶׁר בָּאוּ שָׁם
  choice: 在所去的列国中
  rationale: בַּגּוֹיִם指在外邦列国之中。בָּאוּ形式上是完成式，但在此面向将来的流亡语境中可表达他们将到达的地方；“所去的”是自然的汉语表达，另在脚注保留形式上的另一译法。
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: 那些人就会知道我是耶和华
  rationale: 这是以西结书反复出现的认识公式。主语在语境中可能指列国的人，而非存留者；译作“那些人”保留其指向外邦听众的自然理解，并避免与前面存留者混淆。יְהוָה按现代中文圣经惯例音译为“耶和华”。
theological_decisions:
- issue: וְיָדְעוּ的主语所指
  choice: 那些人就会知道
  alternative: 他们就会知道
  rationale: 希伯来语第三人称复数主语可以延续前面的存留者，也可按临近的“列国”理解为外邦人。以西结书的认识公式常以受审判或见证的旁观列国为认识者；“那些人”在中文中自然指向列国之人，同时原文的代词指向仍有一定含混性。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知、庄重且便于普通读者识别的“耶和华”，而不以“主”替代专名。
- issue: אַנְשֵׁי מִסְפָּר中的语法性别
  choice: 少数几个人
  alternative: 少数几个男人
  rationale: 此成语的重点是人数稀少；אַנְשֵׁי虽为阳性复数构词，但上下文并不要求仅限成年男性。现代汉语“人”准确传达所指，避免无根据地缩窄范围。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“刀剑、饥荒和瘟疫”保留先知书审判公式；“存留下来”兼顾原文的使役结构和余民语义。脚注标记置于全节末尾，所注释的是前文“所去的”。
