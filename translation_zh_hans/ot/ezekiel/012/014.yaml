  yaml_path: translation/ot/ezekiel/012/014.yaml
  text: And all who are around him—his helpers and all his troops—I will scatter to every wind[b][a], and I will draw out a sword after them.
translation:
  language: zh_hans
  text: 我要把他周围所有的人、他的助手[a]和所有部队，都驱散到四面八方[b]；我还要拔刀追赶他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用集合性表达，直译可作“他的帮助”，这里指协助他的人。
    reason: lexical_alternative
  - marker: b
    text: 直译“到每一风”，意思是向各个方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתָיו
  choice: 在他周围
  rationale: 保留该词表示围绕某人、处于其周边的关系含义，并用现代汉语自然表达。
- source_word: עֶזְרָה
  choice: 支援他的人
  rationale: 该表达在本语境中具有集合意义，指在首领身边协助、支持他的人；译作具体的人比抽象的“帮助”更符合上下文。
- source_word: אֲגַפָּיו
  choice: 他的所有部队
  rationale: 该词本可指“翼、侧翼”，但在军事政治语境中指隶属的队伍或部队；“部队”清楚而自然。
- source_word: אֱזָרֶה
  choice: 我要把他们分散
  rationale: זרה的加强词干可表示扬散、驱散；宾语为人时，“分散”准确表达使他们散开的意思。
- source_word: לְכָל רוּחַ
  choice: 到各风所向
  rationale: 保留“各风”这一先知性意象，同时“所向”使汉语读者能够理解为向各个方向。
- source_word: חֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: 我还要拔刀追赶他们
  rationale: ריק与“刀”连用表示拔刀；אַחֲרֵיהֶם含有在后追赶的意味，因此不弱化为单纯“攻击他们”。
