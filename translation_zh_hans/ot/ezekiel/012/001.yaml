base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（四字神名）；中文传统译作“耶和华”。
    reason: 说明正文“雅威”所对应的希伯来文神名及传统中文译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 此处是先知书中常见的叙事引入公式；与“耶和华的话”合译为“耶和华的话临到”，既符合希伯来语句法功能，也符合现代汉语的庄重表达。句首的连接成分不必机械译作“于是”或“并且”。
- source_word: דְבַר
  choice: 话
  rationale: 在固定短语 דְבַר יְהוָה 中，“话”保留了启示由言语传达的含义，比解释性的“信息”更贴近原文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH。正文采用现代中文圣经读者熟悉的专名“耶和华”，并以脚注说明其形式及另一种音译。
- source_word: אֵלַי
  choice: 我
  rationale: 与“临到”搭配即可自然表达希伯来语介词短语“到我这里／向我”；无需添加“这里”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出后续直接引语。译作“说：”简明、自然，并保留先知宣告公式的结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名而非“主”这一称号。正文保留中文传统且广为人知的专名“耶和华”，脚注同时交代希伯来文形式及“雅威”这一可能更接近古代读音的音译，避免把神名改译为称号，也不把读音争议隐去。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“耶和华的话临到我，说”保留先知书固定启示公式；冒号明确后文将出现直接引语。
