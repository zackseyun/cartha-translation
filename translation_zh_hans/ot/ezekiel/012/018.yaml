  text: בֶּן אָדָ֕ם לַחְמְ/ךָ֖ בְּ/רַ֣עַשׁ תֹּאכֵ֑ל וּ/מֵימֶ֕י/ךָ בְּ/רָגְזָ֥ה וּ/בִ/דְאָגָ֖ה תִּשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/018.yaml
  text: Son of man[a], eat your bread with trembling[b], and drink your water with quaking and anxiety.
translation:
  language: zh_hans
  text: “人子啊，你要战战兢兢地吃你的饼，惶恐忧虑地喝你的水。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是以西结书中上帝对先知惯用的称呼；采用传统而直译的“人子”，保留其反复出现的先知性称谓。
- source_word: לַחְמְךָ
  choice: 你的饼
  rationale: לֶחֶם可泛指食物，但此处是具体的象征性行动；“饼”保留原文的具体形象。
- source_word: בְּרַעַשׁ
  choice: 战战兢兢地
  rationale: רַעַשׁ表示震动、摇撼或颤抖；此处描述进食时因恐惧而发抖，用现代汉语“战战兢兢地”自然且具身体感。
- source_word: תֹּאכֵל
  choice: 你要……吃
  rationale: 未完成式在这一神谕命令中具有指令语气，译为“你要……吃”。
- source_word: וּמֵימֶיךָ
  choice: 你的水
  rationale: 原文为复数形式“你的水”，在此指饮用的水；汉语自然采用单数集合表达“水”。
- source_word: בְּרָגְזָה
  choice: 惶恐
  rationale: רָגְזָה可指震颤、骚动或惊惧；“惶恐”兼顾内在惊慌及由此而来的不安，与前句的身体颤抖有所区分。
- source_word: וּבִדְאָגָה
  choice: 忧虑
  rationale: דְאָגָה表示焦虑、挂虑或忧惧；“忧虑”是清楚、庄重而通行的现代汉语。
- source_word: תִּשְׁתֶּה
  choice: 喝
  rationale: 未完成式在上下文中有命令意味，直译为“喝”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“战战兢兢”呈现吃饼时明显的颤抖，“惶恐忧虑”呈现喝水时交叠的惊惧与焦虑；不强行把三个近义名词解释成彼此截然不同的心理状态。
