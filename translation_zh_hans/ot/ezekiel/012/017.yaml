  yaml_path: translation/ot/ezekiel/012/017.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为四字神名 YHWH；中文传统多译作“耶和华”。
    reason: 说明神名的原文形式及中文传统译名。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事性连接形式与整句的先知公式结合，现代汉语通常无需另译“于是发生”；用“临到”自然表达神的话向先知发出。
- source_word: דְבַר
  choice: 话
  rationale: 在固定表达“耶和华的话”中，“话”既贴近原文，又指向一项具体的神圣启示；比“信息”更能保留先知书反复出现的公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”来对应四字神名，保留其作为名字而非称号的性质。
- source_word: אֵלַי
  choice: 我
  rationale: 与“临到”搭配为“临到我”，准确表达先知以西结是这项启示的领受者。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文的直接话语；“说”简洁自然，并保留原文的引语导入结构。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的专名“耶和华”，脚注同时说明原文形式及另一常见音译，不将其替换为“主”这一称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留先知书中反复出现的启示公式。“耶和华的话临到我”符合中文表达习惯；句末“说”承接下一节的直接话语。
