  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事形式 היה 与后面的“耶和华的话”共同构成先知书常用的启示引入语。汉语用“临到”自然承载“来到、发生”的语义，无须另译为“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: דָּבָר 在这一先知公式中指上帝所赐的言语或信息。“话”既保留具体的言语意象，也符合现代汉语圣经语体。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以汉语中通行且可辨识的专名“耶和华”音译四字神名，避免以“主”这一称号代替原文的专名。
- source_word: אֵלַי
  choice: 我
  rationale: 介词 אֶל 加第一人称单数后缀表示“向我、到我这里”；在“话临到我”这一自然汉语结构中译为“我”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接引语。译作“说”简洁清楚，并保留本节指向下一节神谕内容的开放结构。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非“主”这一称号。正文采用现代简体中文读者最熟悉的专名形式“耶和华”；“雅威”更接近学界常见的拟音，但原始发音并不能完全确定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留先知书反复出现的公式“耶和华的话临到我，说”，并以冒号提示下一节将出现直接话语。
