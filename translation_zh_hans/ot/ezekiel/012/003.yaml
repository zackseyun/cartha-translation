base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/003.yaml
  text: And you, son of man, prepare for yourself baggage for exile, and go into exile by day before their eyes. You shall go into exile from your place to another place before their eyes. Perhaps they will see, though they are a rebellious house.
translation:
  language: zh_hans
  text: “人子啊，你要为自己预备流亡的行装，白天当着他们的面流亡。你要当着他们的面从你住的地方流亡到别处。或许他们会看见，尽管他们是悖逆之家。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尽管”所译的希伯来语连接词通常也可译为“因为”或“确实”；这里的句法关系存在歧义。
    reason: 保留 כִּי 的真实语义和句法张力，说明正文的让步式理解并非唯一可能。
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: 流亡用的行装
  rationale: כְּלִי 可指器具、物品或行装；与 גּוֹלָה 连用时，指流亡者迁移时携带的用品。“行装”既自然，也保留这是一场象征性流亡行动的含义。
- source_word: וּגְלֵה / וְגָלִיתָ
  choice: 迁徙／迁到
  rationale: 两处均源于 גלה，在本节语境中表示离开原处、模拟被掳流亡。用“迁徙／迁到”比单用“流亡”更能表达可见的实际行动，同时上下文的“流亡用的行装”明确其性质。
- source_word: יוֹמָם
  choice: 白天
  rationale: 直接表达在日间进行，强调行动公开可见。
- source_word: לְעֵינֵיהֶם
  choice: 当着他们的面
  rationale: 希伯来语直义为“在他们眼前”；现代汉语以“当着他们的面”自然表达公开展示、让他们亲眼看见。
- source_word: יִרְאוּ
  choice: 看明白
  rationale: 基本义是“看见”，此处既涉及观看先知的象征行动，也可能含有领会其警告之意。“看明白”保留视觉背景并自然传达潜在的领悟。
- source_word: בֵּית מְרִי
  choice: 悖逆之家
  rationale: 保留 בַּיִת 的群体性称呼和 מְרִי 的持续反抗意味；“悖逆之家”庄重且符合先知书反复出现的称谓。
theological_decisions:
- issue: 末句 כִּי 与前句“或许他们会看明白”的逻辑关系
  choice: 译作让步关系“尽管”
  alternative: 可译作“因为”或“他们是悖逆之家”
  rationale: כִּי 通常可表示“因为、确实、那”等关系，但此处若机械译为因果，汉语逻辑较突兀。结合“或许”所表达的希望与“悖逆之家”形成的阻力，正文采用让步式“尽管”，同时以脚注保留原文连接词的多义性，不把解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“流亡用的行装”明确象征行动的背景；“当着他们的面”两次重复，以保留原文刻意强调的公开性；末句保留“悖逆之家”这一以色列先知传统中的群体称谓。
