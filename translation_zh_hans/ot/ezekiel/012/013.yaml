  text: וּ/פָרַשְׂתִּ֤י אֶת רִשְׁתִּ/י֙ עָלָ֔י/ו וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וְ/הֵבֵאתִ֨י אֹת֤/וֹ בָבֶ֨לָ/ה֙ אֶ֣רֶץ כַּשְׂדִּ֔ים וְ/אוֹתָ֥/הּ לֹֽא יִרְאֶ֖ה וְ/שָׁ֥ם יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/013.yaml
  text: I will spread my net over him[a], and he will be caught in my snare. Then I will bring him to Babylon, the land of the Chaldeans; yet he will not see it[b], and there he will die.
translation:
  language: zh_hans
  text: 我必把我的网撒在他身上[a]，他必被我的罗网捕获。然后，我必把他带到巴比伦，就是迦勒底人之地；然而，他必看不见那地[b]，并且必死在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罗网”也可译作“陷阱”。希伯来文在这里用了两个相关的捕猎用语：“我的网”和“我的罗网”。
    reason: lexical_alternative
  - marker: b
    text: 关于他被带到巴比伦却看不见那地，可参列王纪下25:7；耶利米书39:7；52:11。
    reason: cross_reference
lexical_decisions:
- source_word: וּפָרַשְׂתִּי
  choice: 我要……撒
  rationale: פָּרַשׂ的核心义是“铺开、展开”；用于网时，现代汉语自然表达为“撒网”，同时保留捕猎意象。
- source_word: רִשְׁתִּי
  choice: 我的网
  rationale: רֶשֶׁת通常指捕猎所用的网；直译为“我的网”清楚自然。
- source_word: עָלָיו
  choice: 在他身上
  rationale: עַל在此具有空间含义，与撒网捕人的图像相合。
- source_word: וְנִתְפַּשׂ
  choice: 他必被……捕获
  rationale: Niphal词形表达被动结果；“被捕获”既准确又延续网罗的意象。
- source_word: בִּמְצוּדָתִי
  choice: 被我的罗网捕获
  rationale: מְצוּדָה可指网罗或陷阱。采用“罗网”与前面的“网”形成相关而不完全重复的捕猎用语；脚注保留“陷阱”这一可能译法。
- source_word: וְהֵבֵאתִי אֹתוֹ
  choice: 然后，我要把他带到
  rationale: בוא的Hiphil词形意为“带来、带到”；“然后”自然呈现事件次序，但不增加因果解释。
- source_word: בָבֶלָה
  choice: 到巴比伦
  rationale: 方向词尾表示朝向巴比伦的移动，汉语以“到巴比伦”表达。
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: 迦勒底人之地
  rationale: 直接保留כַּשְׂדִּים的历史族群称谓，并以同位说明指出巴比伦所在之地。
- source_word: וְאוֹתָהּ לֹא יִרְאֶה
  choice: 然而，他必看不见那地
  rationale: 阴性代词呼应אֶרֶץ“地”；“然而”传达被带到那里却看不见那地的反差，同时不在正文解释原因。
- source_word: וְשָׁם יָמוּת
  choice: 并且要死在那里
  rationale: 按原文保留事件衔接及地点强调；“死在那里”是直接、庄重的现代汉语。
theological_decisions:
- issue: “他必看不见那地”所含的历史反差
  choice: 正文保留字面陈述，不说明他为何看不见。
  alternative: 在正文增译为“因眼睛被剜去，所以看不见那地”。
  rationale: 本节只预告他将被带到巴比伦，却看不见那地。虽然列王纪下25:7及耶利米书39:7；52:11提供历史背景，译文仍应保留本节自身的张力，不把后文解释并入正文。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“撒在他身上”保留原文空间图像；“必”呈现预言语气；保留“迦勒底人”这一历史称谓。所有脚注标记均已置于正文对应位置。
