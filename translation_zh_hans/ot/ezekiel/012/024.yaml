id: EZK.12.24
reference: Ezekiel 12:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֠י לֹ֣א יִֽהְיֶ֥ה ע֛וֹד כָּל חֲז֥וֹן שָׁ֖וְא וּ/מִקְסַ֣ם חָלָ֑ק בְּ/ת֖וֹךְ בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/024.yaml
  text: For there will no longer be any false vision or flattering divination within the house of Israel[a].
translation:
  language: zh_hans
  text: 因为在以色列家中，必不再有任何虚假的异象和谄媚的占卜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“圆滑的占卜”。希伯来语这个形容词字面意思是“光滑的”，这里可能指讨好人或以悦耳之言使人受骗。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，表达原因或解释关系；现代汉语用“因为”自然清楚。
- source_word: לֹא ... עוֹד
  choice: 必不再
  rationale: 表达从此止息；“不再”准确传达持续性的否定，“必”也与本句宣告性的语气相称。
- source_word: יִהְיֶה
  choice: 有
  rationale: 此处为存在句，汉语以“有”自然表达。
- source_word: כָּל
  choice: 任何
  rationale: 在否定范围内，כָּל 表示无一例外，译作“任何”符合现代汉语习惯。
- source_word: חֲזוֹן שָׁוְא
  choice: 虚假的异象
  rationale: שָׁוְא 可指虚假、空妄或无价值；在先知语境中，“虚假的异象”清楚表明这类异象并不真实。
- source_word: מִקְסַם
  choice: 占卜
  rationale: 指求取兆示或预言的占卜行为；“占卜”是现代汉语直接而通行的对应词。
- source_word: חָלָק
  choice: 谄媚的
  rationale: 该词字面为“光滑的”，用于言语时可表示圆滑、讨好或以悦耳之言欺哄；正文采用自然的语境义，同时以脚注保留字面意象与歧义。
- source_word: בְּתוֹךְ
  choice: 在……中
  rationale: 表示位于群体内部；汉语“在以色列家中”简洁自然。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中把以色列民族称为“家”的集体称谓和源文意象。
theological_decisions:
- issue: 受谴责的启示性言论之性质
  choice: 经文并列谴责虚假的异象与带有谄媚、欺哄性质的占卜之言。
  alternative: 将 חָלָק 更按字面译为“圆滑的占卜”或“悦耳的占卜”。
  rationale: 源文确实并列两种不正当的启示宣称；“谄媚的”传达圆滑言语所含的讨好与欺骗意味，脚注则保留其字面意义，避免把语义完全固定为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的先知性宣告语体。“以色列家”保留源文的集体称谓；语序调整为自然汉语，同时保留因果连接、完全否定及两项并列谴责。
