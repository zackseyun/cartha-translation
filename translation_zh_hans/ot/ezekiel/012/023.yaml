base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/023.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: I will put an end to this proverb, and they will no longer use it as a proverb in Israel. But say to them, “The days have drawn near, and the word of every vision.”’'
translation:
  language: zh_hans
  text: 所以，你要对他们说：“主耶和华如此说：我要使这句俗语止息；以色列中不再有人用它作俗语。相反，你要对他们说：‘日子近了，各异象的话也近了。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 自然表达承接上文的推论关系。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知使者宣告公式，并以“耶和华”呈现神名；语序符合庄重的现代汉语圣经文体。
- source_word: הִשְׁבַּתִּי אֶת־הַמָּשָׁל הַזֶּה
  choice: 我要使这句俗语止息
  rationale: 使役形式表达“使……停止”；完成式在此宣告中带有将要落实的意味。מָשָׁל指上文流传于民间的俗语。
- source_word: וְלֹא יִמְשְׁלוּ אֹתוֹ עוֹד בְּיִשְׂרָאֵל
  choice: 以色列中不再有人用它作俗语
  rationale: 这里的动词意为说或使用俗语，并非“统治”；用无人称表达使汉语自然。
- source_word: כִּי אִם
  choice: 却
  rationale: 表示以新的宣告取代将被废止的俗语，简洁呈现转折对照。
- source_word: קָרְבוּ הַיָּמִים
  choice: 日子近了
  rationale: 忠实表达有关日期或时机已经临近的完成式语义，同时保持自然简洁。
- source_word: וּדְבַר כָּל־חָזוֹן
  choice: 各异象所说的也要实现
  rationale: דָּבָר可指话、内容或事情；上下文针对异象迟迟不应验的嘲讽，因此正文自然表达其话语将成为事实，并以脚注保留原文较直译的形式。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 直接保留专名“耶和华”，同时用“主”对应אֲדֹנָי，避免把经文本身没有明说的宗派性解释带入译文。
- issue: וּדְבַר כָּל־חָזוֹן是否明确译为应验
  choice: 各异象所说的也要实现
  alternative: 各异象的话
  rationale: 上下文强调预言不再延迟，故“实现”是有语境依据的自然表达；脚注同时说明原文较为含蓄，避免掩盖其词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“俗语”比“箴言”更符合本段民间流行说法的语境；引语层次用单双引号区分。
