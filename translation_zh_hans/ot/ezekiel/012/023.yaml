revisions:
- from: 所以，你要对他们说：‘主耶和华如此说：我要使这句俗语止息，以色列中不再有人用它作俗语。你却要对他们说：“日子近了，各异象所说的也要实现。[a]”’”
  to: 所以，你要对他们说：“主耶和华如此说：我要使这句俗语止息；以色列中不再有人用它作俗语。相反，你要对他们说：‘日子近了，各异象的话也近了。’”
  rationale: 修订末句以保留希伯来文名词性、省略式表达及其语义开放性；将“应验”的语境性理解移至脚注。同步修正引号结构，并以“相反”清晰表达 כִּי אִם 所引出的对照性命令。
