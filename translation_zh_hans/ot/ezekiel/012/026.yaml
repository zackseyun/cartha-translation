  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 又临到
  rationale: 此处是先知叙事中常见的承接公式；结合整句译为“又……临到”，既表达上下文的延续，也符合现代汉语表达。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定先知公式中，“话”直接保留该词的基本含义及其神学分量，比“信息”更少解释性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中通行的专名“耶和华”表达四字神名，而不以“主”这一称号替代。
- source_word: אֵלַי
  choice: 临到我
  rationale: 希伯来文直义为“到我这里”；与“话”搭配时，现代庄重汉语惯用“临到我”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出随后神所说的话；译作“说”自然、简洁，并保留引语导入功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用读者最熟悉且作为专名使用的“耶和华”，保留其为神之名而非称号；“雅威”是较贴近学界重构读音的可行替代。
translation_notes:
  register: 采用现代、庄重且自然的先知叙事用语。“又”承接前文反复出现的启示公式；冒号提示下一节将进入直接引语。
