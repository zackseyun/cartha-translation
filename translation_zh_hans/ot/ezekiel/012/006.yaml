source:
  edition: WLC
  text: לְ/עֵ֨ינֵי/הֶ֜ם עַל כָּתֵ֤ף תִּשָּׂא֙ בָּ/עֲלָטָ֣ה תוֹצִ֔יא פָּנֶ֣י/ךָ תְכַסֶּ֔ה וְ/לֹ֥א תִרְאֶ֖ה אֶת הָ/אָ֑רֶץ כִּֽי מוֹפֵ֥ת נְתַתִּ֖י/ךָ לְ/בֵ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/006.yaml
  text: Before their eyes you shall carry it on your shoulder[a]; in the dark you shall bring it out. You shall cover your face so that you do not see the land[b], for I have made you a sign for the house of Israel.
translation:
  language: zh_hans
  text: 你要在他们眼前把行囊扛在肩上；要在黑暗中[a]把它带出去。你要蒙住脸，以致看不见这地；因为我已使你成为以色列家的一个记号[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在暮色中”。希伯来词可指黑暗、幽暗，也可能指光线昏暗的时刻。
    reason: lexical_alternative
  - marker: b
    text: 或译“预兆”或“异兆”。这个词所指的象征性记号也可能带有不祥的预示意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 保留希伯来语“在他们眼中／眼前”的鲜明可见性，表明这象征性行动要当众进行。
- source_word: עַל כָּתֵף תִּשָּׂא
  choice: 把行囊扛在肩上
  rationale: נשׂא与“肩”连用表示负重携带；宾语在本句中省略，按上文所说迁徙用的行囊补出，使中文指代清楚。
- source_word: בָּעֲלָטָה
  choice: 在黑暗中
  rationale: עֲלָטָה主要指黑暗、幽暗；“在黑暗中”准确自然，同时以脚注保留“暮色中”的可能理解。
- source_word: תוֹצִיא
  choice: 带出去
  rationale: 这是יצא的使役式，意为把某物带出；所带之物承接前文的行囊。
- source_word: פָּנֶיךָ תְכַסֶּה
  choice: 蒙住脸
  rationale: 直译这一象征性动作，不限定具体使用面纱或其他遮盖物。
- source_word: וְלֹא תִרְאֶה אֶת הָאָרֶץ
  choice: 不看这地
  rationale: 保留与前句并列而又含结果意味的表达；“这地”自然指语境中的当地，却不把“以色列地”明文加入经文。
- source_word: מוֹפֵת
  choice: 记号
  rationale: מוֹפֵת可指具有象征作用的记号，也可带有预兆意味；正文用通俗且不过度解释的“记号”，脚注保留另一可能。
- source_word: נְתַתִּיךָ
  choice: 我已使你成为
  rationale: 字面为“我已把你给作”，在此谓语结构中自然表示设立或使之成为某种身份。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中“以色列家”这一整体性称谓，前置于“一个记号”符合现代汉语语序。
theological_decisions:
- issue: “这地”的具体所指
  choice: 正文译作“这地”，不明说“以色列地”
  alternative: 以色列地；地面；大地
  rationale: 上下文很可能指将要离开的本土，但希伯来文本仅作הָאָרֶץ。译文保留其措辞范围，不以解释性扩展消除其开放性。
- issue: מוֹפֵת的象征及不祥意味
  choice: 正文译作“记号”
  alternative: 预兆；异兆
  rationale: 本节首先把以西结本人及其行动描述为给以色列家的象征性记号；该词也可能含预示灾祸的意味，因此在脚注中保留“预兆／异兆”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“扛在肩上”“蒙住脸”保持动作具体鲜明；“以色列家”保留先知书传统称谓。脚注标记均放在其实际对应的词语之后。
