  text: וְ/הֶ/עָרִ֤ים הַ/נּֽוֹשָׁבוֹת֙ תֶּחֱרַ֔בְנָה וְ/הָ/אָ֖רֶץ שְׁמָמָ֣ה תִֽהְיֶ֑ה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/020.yaml
  text: And the inhabited cities will be laid waste[a], and the land will become a desolation; then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 有人居住的城邑必荒废，这地必变得荒凉；你们就知道我是耶和华[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），是上帝的名；中文传统常译作“耶和华”，也有译作“雅威”的。
    reason: 说明神名的原文形式及主要中文译法，保留其专名性质与读音重构上的差异。
lexical_decisions:
- source_word: הֶעָרִים הַנּוֹשָׁבוֹת
  choice: 有人居住的城邑
  rationale: הֶעָרִים 指城或城镇，הַנּוֹשָׁבוֹת 是 ישׁב 的分词，修饰这些城邑，表示其中有人定居。译为“有人居住的城邑”，既保留限定成分，也与随后的荒废形成鲜明对照。
- source_word: תֶּחֱרַבְנָה
  choice: 必荒废
  rationale: 该词在此表示成为废墟、陷入荒凉。“荒废”简洁自然，保留预告审判的结果性；“必”体现先知话语中的确定将来含义。
- source_word: הָאָרֶץ
  choice: 遍地
  rationale: אֶרֶץ 可指土地、国土或地区。此处与各城邑并列，所指是相关地域整体；“遍地”自然表达全境受灾，而不是泛指整个地球。
- source_word: שְׁמָמָה תִהְיֶה
  choice: 必变得荒凉
  rationale: שְׁמָמָה 是名词，表示荒凉、废墟般的状态；היה 在语境中可表达进入某种状态。汉语以“变得荒凉”自然传达这种转变，虽未机械保留名词形式，却保留其语义。
- source_word: וִידַעְתֶּם
  choice: 你们就知道
  rationale: 连词加动词在此承接前述审判结果，具有后果或随后发生的意味。“就”比单纯的“并且”更清楚地呈现这种关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式“耶和华”译出四字神名，避免仅以称号“主”代替专名；脚注说明其希伯来文形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，而非“主”的称号。正文采用中文传统且广为人知的专名“耶和华”，同时用脚注交代原文为 YHWH；不据此加入任何宗派性解释。
- issue: “你们就知道”与审判的关系
  choice: 保留结果性衔接
  alternative: 译作“并且你们会知道”
  rationale: וִידַעְתֶּם 可顺接前述事件，也可在语境中表达由此而知。译作“就知道”呈现自然的结果关系，但不进一步解释这种认识的性质或得救意义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“城邑”具有适度的经文语体色彩，但普通读者易懂；“荒废／荒凉”对应原文两个相关而不完全相同的表达。分号呈现审判与认识耶和华之间的紧密后果关系。
