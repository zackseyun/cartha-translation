source:
  edition: WLC
  text: וָ/אַ֣עַשׂ כֵּן֮ כַּ/אֲשֶׁ֣ר צֻוֵּיתִי֒ כֵּ֠לַ/י הוֹצֵ֜אתִי כִּ/כְלֵ֤י גוֹלָה֙ יוֹמָ֔ם וּ/בָ/עֶ֛רֶב חָתַֽרְתִּי לִ֥/י בַ/קִּ֖יר בְּ/יָ֑ד בָּ/עֲלָטָ֥ה הוֹצֵ֛אתִי עַל כָּתֵ֥ף נָשָׂ֖אתִי לְ/עֵינֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/007.yaml
  text: 'So I did as I was commanded: by day I brought out my baggage like the baggage of exile[a], and in the evening I dug through the wall by hand. In the dark I brought it out[b]; I carried it on my shoulder before their eyes.'
translation:
  language: zh_hans
  text: 于是我照着所受的吩咐做了：白天，我把自己的行李像流亡者的行装那样拿出来[a]；晚上，我亲手挖穿了墙。在黑暗中[b]，我把行李拿出去，扛在肩上，让他们看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“像被掳者的行李。”希伯来语这一短语指为流亡或被掳离境而预备的随身物品。
    reason: lexical_alternative
  - marker: b
    text: “在黑暗中”也可译作“在幽暗中”或“在暮色中”。原词表示黑暗，也可能含有借昏暗遮掩行动的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ כֵּן כַּאֲשֶׁר צֻוֵּיתִי
  choice: 于是我照着所受的吩咐做了
  rationale: 保留叙事承接、顺从行动和被动受命之意；现代汉语自然庄重。
- source_word: כֵּלַי
  choice: 自己的行李
  rationale: כְּלִי 语义宽泛；在模拟被掳离境的行动中，指便于携带的个人物品，译作“行李”最贴切。
- source_word: כִּכְלֵי גוֹלָה
  choice: 作为流亡的行装
  rationale: 该短语指为流亡、被迁徙而预备的物品；“流亡的行装”保留原文意象，同时避免提前把语法限定为某一个流亡者。
- source_word: יוֹמָם וּבָעֶרֶב
  choice: 白天……晚上
  rationale: 清楚保留原文从白昼到晚间的时间推进。
- source_word: חָתַרְתִּי לִי בַקִּיר בְּיָד
  choice: 我亲手挖穿了墙
  rationale: חתר 在此表示挖通或凿穿墙壁；“亲手”体现 בְּיָד，并以自然汉语表达主体亲自完成此事。לִי 不必机械译出。
- source_word: בָּעֲלָטָה
  choice: 在黑暗中
  rationale: עֲלָטָה 表示黑暗或幽暗；正文采用最直接的意义，脚注保留“暮色中”的可能性及隐蔽意味。
- source_word: הוֹצֵאתִי
  choice: 我把行李拿出去
  rationale: 根据前文补出宾语“行李”，使现代汉语指代清楚，同时保留动词重复所表达的实际行动。
- source_word: עַל כָּתֵף נָשָׂאתִי לְעֵינֵיהֶם
  choice: 当着他们的面扛在肩上
  rationale: 保留肩扛的身体动作和公开展示的性质；“当着他们的面”自然传达“在他们眼前”。
theological_decisions:
- issue: 以西结象征行动的性质
  choice: 具体叙述他拿行李、挖墙和肩扛的公开行动，不在本节内增添寓意解释
  alternative: 直接译入“象征被掳”等解释性措辞
  rationale: 上下文会解释这场先知性象征行动；本节应保留行动本身，让经文自行展开其含义。
- issue: גּוֹלָה 所指的流亡或被掳含义
  choice: 正文译作“流亡”，脚注注明也可理解为被迁徙、被掳者的行装
  alternative: 正文直接限定为“被掳者”
  rationale: 原词可指流亡、被迁徙的处境或群体；保留一定语义张力，避免在正文中作过窄限定。
translation_notes:
  register: 采用现代标准普通话和简体中文，语气庄重而易懂。用“行李／行装”区分实际物品与流亡情境中的用途；用“亲手挖穿了墙”避免生硬直译 לִי，同时保留动作的亲自性。所有脚注标记均已置于正文相应位置。
