  text: בֶּן אָדָ֕ם הֲ/לֹ֨א אָמְר֥וּ אֵלֶ֛י/ךָ בֵּ֥ית יִשְׂרָאֵ֖ל בֵּ֣ית הַ/מֶּ֑רִי מָ֖ה אַתָּ֥ה עֹשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/009.yaml
  text: Son of man[a], has not the house of Israel, that rebellious house, said to you, ‘What are you doing?’
translation:
  language: zh_hans
  text: 人子啊，以色列家——就是那悖逆之家——不是对你说过：“你在做什么？”吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼。“人子”既保留希伯来语“人的儿子”的固定表达及全书的文学连贯性，也比“必死的人”等解释性译法更少预先限定含义。
- source_word: הֲלֹא
  choice: 不是……吗
  rationale: 该词引出预期肯定回答的反问；现代汉语以“不是……吗”自然传达这种语气。
- source_word: אָמְרוּ אֵלֶיךָ
  choice: 对你说过
  rationale: אָמְרוּ 是普通的“说”，אֵלֶיךָ 表示话语指向以西结；“说过”在汉语反问句中也自然体现完成的言说行为，而不把动词改译为更具体的“问”。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知文献中具有群体和盟约色彩的固定称谓，不简化为“以色列人”或“以色列”。
- source_word: בֵּית הַמֶּרִי
  choice: 就是那悖逆之家
  rationale: 该短语与“以色列家”构成同位关系。“悖逆之家”保留“家”的意象和 מֶרִי 的强烈责备意味；“就是”与破折号使同位关系在现代汉语中清楚自然。
- source_word: מָה אַתָּה עֹשֶׂה
  choice: 你在做什么？
  rationale: 代词与分词结构在这里表示正在进行的动作；“在做什么”准确而自然，并保留 עשה 的宽泛含义。
theological_decisions:
- issue: בֶּן אָדָם 在本节作为对以西结的称呼是否应解释性译为“必死的人”
  choice: 人子
  alternative: 必死的人
  rationale: 原文强调受话者是人，但并未在该词组本身明确加入“必死”的限定；采用传统而形式对应的“人子”，可保留该称呼在全书中的重复效应及潜在语义张力，避免加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以破折号标示“以色列家”与“悖逆之家”的同位关系；保留“人子”“以色列家”“悖逆之家”等先知书核心表达，同时用“不是……吗”和“在做什么”形成自然的现代汉语问句。
