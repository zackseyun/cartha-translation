  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹא תִמָּשֵׁ֥ךְ ע֖וֹד כָּל דְּבָרָ֑/י אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/028.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: None of my words will be delayed any longer, but the word that I speak will be done,’ declares the Lord GOD.'
translation:
  language: zh_hans
  text: 所以，你要对他们说：‘主耶和华如此说：我的一切话都不再迟延[a]；我所说的话必然成就。这是主耶和华的宣告。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迟延”原文也可译作“拖长”或“延续下去”。
    reason: 保留 נמשך 在本语境中既可表示时间被拖长、也可表示应验被推迟的词义幅度。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 表达承接上文并引出结论的推论关系，符合现代汉语习惯。
- source_word: אֱמֹר אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 保留第二人称单数命令语气及间接宾语，清楚呈现先知受命传话。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 沿用庄重而通行的先知使者公式，既贴近原文，也为普通读者所熟悉。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 用现代中文圣经语域中熟悉的复合称号表达 אֲדֹנָי 与神圣之名 יְהוִה，同时避免重复成“主主”。
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: 不再迟延
  rationale: 该动词的被动词干可指被拉长、延续；结合本段有关预言应验迟迟未到的语境，“迟延”自然准确。
- source_word: כָּל דְּבָרָי
  choice: 我的一切话
  rationale: 保留原文“我的所有话”处于否定范围内的整体表达，不改写为较自由的“没有一句”。
- source_word: אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: 我所说的话
  rationale: 以自然汉语表达原文同根语义的关系结构；未强行限定为只指过去或将来的言语。
- source_word: וְיֵעָשֶׂה
  choice: 必然成就
  rationale: 表达被动形式所指的实现、落实；“成就”比单纯“发生”更能保留神所说之话得到实行的力度。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: 以庄重而清楚的现代汉语呈现先知书常见的权威确认公式。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文读者中具有广泛辨识度，并明确保留专名与称号的组合；正文不采用“主神”来遮蔽原文中的神圣之名。
- issue: 神的话与应验之间的确定关系
  choice: 必然成就
  alternative: 将会成就
  rationale: 原文语境以不再迟延为重点，表明应验的确定性；“必然”传达这种强调，但不额外规定成就的具体方式或时间。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话；保留先知宣告公式和原文两次出现的神圣称号，同时避免生硬直译。
