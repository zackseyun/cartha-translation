  text: בֶּן אָדָ֕ם בְּ/ת֥וֹךְ בֵּית הַ/מֶּ֖רִי אַתָּ֣ה יֹשֵׁ֑ב אֲשֶׁ֣ר עֵינַיִם֩ לָ/הֶ֨ם לִ/רְא֜וֹת וְ/לֹ֣א רָא֗וּ אָזְנַ֨יִם לָ/הֶ֤ם לִ/שְׁמֹ֨עַ֙ וְ/לֹ֣א שָׁמֵ֔עוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/002.yaml
  text: Son of man[a], you dwell in the midst of a rebellious house, who have eyes to see but do not see, ears to hear but do not hear[b], for they are a rebellious house.
translation:
  language: zh_hans
  text: 人子啊，你住在悖逆之家[a]中间。他们有眼可看，却看不见；有耳可听，却听不见[b]，因为他们是悖逆之家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “家”在这里指整个群体，也可译作“悖逆的家”或“悖逆的人民”。
    reason: 说明“家”的集合性用法，并提供不重复正文的可行译法，避免读者误解为单一家庭。
  - marker: b
    text: 直译：“他们有眼睛用来看，却没有看见；有耳朵用来听，却没有听见。”
    reason: 交代希伯来文的句法形式和完成式表达；正文采用更自然的汉语概括其持续性特征。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝称呼先知的固定形式及其互文意义；在此指作为人的先知，不额外引入后来的称号含义。
- source_word: בְּתוֹךְ
  choice: 在……中间
  rationale: 准确表达先知身处这一群体之中，同时保留先知话语的庄重语气。
- source_word: בֵּית הַמֶּרִי / בֵּית מְרִי
  choice: 悖逆之家
  rationale: “家”在此是指整个群体的集合性用语；保留原文两次出现的“家”及其重复修辞。“悖逆”也符合先知文学语域。
- source_word: יֹשֵׁב
  choice: 住
  rationale: 该词可指坐、停留或居住；这里描述以西结身处这群人当中，“住”最符合上下文。
- source_word: עֵינַיִם לָהֶם לִרְאוֹת וְלֹא רָאוּ
  choice: 他们有眼可看，却看不见
  rationale: 以自然、凝练的现代汉语再现原文“有眼睛用来看，却没有看见”的对照，不把“看见”解释性扩展为“领悟”。
- source_word: אָזְנַיִם לָהֶם לִשְׁמֹעַ וְלֹא שָׁמֵעוּ
  choice: 有耳可听，却听不见
  rationale: 与前一分句保持平行，并保留“听”的基本意义及其可能包含的回应性含义，不在正文中消解这种张力。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出他们不能看见、不能听见的原因，现代汉语用“因为”清楚自然。
theological_decisions:
- issue: “家”作为以色列群体的集合性比喻
  choice: 正文保留“悖逆之家”
  alternative: 悖逆的人民／悖逆的族群
  rationale: 原文的“家”指整体群体，而不只是一个家庭；保留这一比喻可维持以西结书的关键词和本节首尾重复，同时以脚注防止误解。
- issue: “看”与“听”的属灵及伦理含义
  choice: 正文直译为“看不见”“听不见”
  alternative: 不肯领悟／不肯听从
  rationale: 上下文可能包含不愿领悟和不肯回应，但原文仍使用基本感官动词；不将隐含意义写入正文，以保留其修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知文学语体。“人子啊”和“悖逆之家”保留原文的固定称呼及核心意象；“有眼可看……有耳可听……”以简洁对偶呈现原文节奏。脚注标记均置于相关正文之后。
