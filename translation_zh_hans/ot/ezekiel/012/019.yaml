language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֶל עַ֣ם הָ/אָ֡רֶץ כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לְ/יוֹשְׁבֵ֤י יְרוּשָׁלִַ֨ם֙ אֶל אַדְמַ֣ת יִשְׂרָאֵ֔ל לַחְמָ/ם֙ בִּ/דְאָגָ֣ה יֹאכֵ֔לוּ וּ/מֵֽימֵי/הֶ֖ם בְּ/שִׁמָּמ֣וֹן יִשְׁתּ֑וּ לְמַ֜עַן תֵּשַׁ֤ם אַרְצָ/הּ֙ מִ/מְּלֹאָ֔/הּ מֵ/חֲמַ֖ס כָּֽל הַ/יֹּשְׁבִ֥ים בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/019.yaml
  text: 'And say to the people of the land[a], ‘Thus says the Lord GOD concerning the inhabitants of Jerusalem in the land of Israel: They will eat their bread with anxiety and drink their water with horror[b], so that her land may be made desolate of its fullness because of the violence of all who dwell in it.’'
translation:
  language: zh_hans
  text: 你要对这地的百姓说：‘主耶和华论到住在以色列地的耶路撒冷居民如此说：他们必忧虑地吃自己的饼，惊骇地喝自己的水[a]，以致那地因其中所有居民的暴行而荒凉，失去其中的一切[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惊骇地”也可译作“在荒凉中”或“惶恐地”；原文用词既可表示惊骇、错愕，也可带有荒凉毁坏的意味。
    reason: lexical_alternative
  - marker: b
    text: “失去其中的一切”直译作“失去其所充满的”；也可译作“她的地荒凉，不再有其中原有的一切”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: 这地的百姓
  rationale: 保留“地”和“百姓”的具体含义；在本节语境中指当地民众，不把它限定为某一社会阶层。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 采用现代中文圣经语体中自然、庄重的复合神名表达，同时保留专名所指。
- source_word: לְיוֹשְׁבֵי יְרוּשָׁלַם אֶל אַדְמַת יִשְׂרָאֵל
  choice: 论到住在以色列地的耶路撒冷居民
  rationale: 此话是对“这地的百姓”说的，内容则涉及耶路撒冷居民；“论到”自然表达介词在此可能具有的相关、指向意义。
- source_word: לַחְמָם בִּדְאָגָה יֹאכֵלוּ
  choice: 他们必忧虑地吃饼
  rationale: 保留“饼”的具体意象，并以“忧虑地”自然表达伴随进食的焦虑和恐惧。
- source_word: וּמֵימֵיהֶם בְּשִׁמָּמוֹן יִשְׁתּוּ
  choice: 惊骇地喝水
  rationale: שִׁמָּמוֹן可指惊骇、错愕，也与荒凉毁坏相关；正文采用符合情绪平行结构的“惊骇”，脚注保留另一层含义。
- source_word: לְמַעַן תֵּשַׁם אַרְצָהּ מִמְּלֹאָהּ
  choice: 好使这地荒凉，失去其中的一切
  rationale: לְמַעַן保留目的或结果张力；以自然中文传达土地变得荒凉并被剥夺其充盈之物的图像。
- source_word: מֵחֲמַס כָּל הַיֹּשְׁבִים בָּהּ
  choice: 这是因其中所有居民的暴行
  rationale: חָמָס在此指暴力、强暴和压迫性的恶行；“暴行”兼具道德和社会层面的力度。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”在现代中文中能清楚区分称号与神名，并避免把复合称谓压缩为单一称号。
- issue: לְמַעַן 所表达的目的与结果关系
  choice: 好使
  alternative: 以致；因此
  rationale: 希伯来语可涉及目的及其结果；正文保留较直接的目的/结果连接，不进一步断定这是居民主观追求的目的。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。保留先知宣告的因果力度及“吃饼／喝水”的具体意象；对 שִׁמָּמוֹן 和 מִמְּלֹאָהּ 的多义性以脚注说明，不在正文中强行消除。
