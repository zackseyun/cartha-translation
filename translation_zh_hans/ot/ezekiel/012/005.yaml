- from: 你要在他们眼前[a]亲自凿穿墙壁，再从那里搬出去。
  to: 你要当着他们的面[a]，在墙上为自己凿一个洞，然后从洞中把行装搬出去。
  rationale: 修订使与格 לְךָ、墙洞的回指以及使役动词“带出／搬出”的隐含受事在中文中得到准确、自然的表达。“行装”是紧承12:4的明确语境，不是任意增添的物件；“洞”则是凿穿墙壁必然形成、并由“通过它”所指的通道。
