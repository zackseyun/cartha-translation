  source_fidelity: “亲自”未充分表达 לְךָ 的“为自己／给自己”的与格、反身意味；“从那里”弱化了 בּוֹ 对所凿墙洞的明确回指。且“搬出去”在现代汉语中省略宾语略显悬空。结合上一节已出现的“行装”，补出该隐含宾语可使命令的对象清楚，同时不改变本节所指的行动。
  naturalness: “当着他们的面”及“在墙上为自己凿一个洞”符合现代汉语，也保留了公开执行象征行动的语气。“然后从洞中把行装搬出去”自然完整。
  terminology: “凿一个洞”恰当地表达 חתר 在墙上挖掘、凿开通道的动作；“行装”承接12:4的语境，用于呈现 הוֹצֵאתָ 未明说但语境明确的受事。“为自己”保留 לְךָ，避免以“亲自”替代其语义。
