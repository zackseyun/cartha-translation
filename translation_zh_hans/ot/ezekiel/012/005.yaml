  text: Before their eyes[a], dig through the wall, and bring out through it.
translation:
  language: zh_hans
  text: 你要当着他们的面[a]，在墙上为自己凿一个洞，然后从洞中把行装搬出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在他们眼前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 这是希伯来语惯用表达，指当着众人的面、在他们看得见的地方；译文保留“眼前”的具体意象和这一象征行动的公开性质。
- source_word: חֲתָר
  choice: 凿穿
  rationale: 该动词可指挖掘或破墙而入；与“墙壁”连用时，“凿穿”自然地表达在墙上开出通道的动作。
- source_word: לְךָ
  choice: 亲自
  rationale: 此处与格代词强调受命者本人实施这一行动。直译“为自己”在现代汉语中容易被理解为谋取个人利益，因此用“亲自”传达其反身和亲身施行的意味。
- source_word: בַקִּיר
  choice: 墙壁
  rationale: 原文带定冠词，指场景中已知的墙；现代汉语在此不必另加“那面”，直接译作“墙壁”自然明确。
- source_word: וְהוֹצֵאתָ
  choice: 再……搬出去
  rationale: 使役形表示“带出、搬出”。原文没有明说宾语，宾语可由上文的行装补足；中文保留省略，并用“搬出去”承接上文。
- source_word: בּוֹ
  choice: 从那里
  rationale: 代词回指墙壁，实际所指是刚凿出的通道。译作“从那里”既自然，也不额外加入原文未明说的“洞口”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的命令语气。“亲自凿穿”突出以西结本人公开实施象征行动；末句保留原文宾语省略，由上文“行装”的语境自然补足。
