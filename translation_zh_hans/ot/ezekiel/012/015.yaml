source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בַּ/הֲפִיצִ֤/י אוֹתָ/ם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/015.yaml
  text: And they will know that I am Yahweh when I scatter them among the nations and disperse them through the lands[a].
translation:
  language: zh_hans
  text: 我把他们驱散到列国、分散在各地时，他们就会知道我是雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译自希伯来文神名יהוה（YHWH）；传统上也译作“耶和华”，有些译本译作“主”。
    reason: 说明神名的原文形式及常见译法。
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 他们就会知道
  rationale: 在先知性话语中，此处完成式带连接词表达将来的结果；“就会知道”既自然，也保留以西结书常见的认知公式。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我是雅威
  rationale: כִּי引出他们所认识的内容；יְהוָה是上帝的专名，采用“雅威”音译，以区别于称号“主”。
- source_word: בַּהֲפִיצִי
  choice: 我把他们驱散……时
  rationale: 介词בְּ加使役式不定词及第一人称单数词尾，在此具有时间意义；“驱散”体现使役式“使分散”的含义。
- source_word: בַּגּוֹיִם
  choice: 到列国
  rationale: גּוֹיִם在这里指以色列人被掳后所处的外邦各国；“列国”符合希伯来圣经语境，也避免新约色彩较强的“外邦人”。
- source_word: וְזֵרִיתִי
  choice: 分散
  rationale: זרה可指扬散、吹散或分散；此处与前一动词并列，译作“分散”保留广泛散布之意，而不强加具体的扬场意象。
- source_word: בָּאֲרָצוֹת
  choice: 在各地
  rationale: אֲרָצוֹת是复数，可指各地或各国；“各地”既保留复数范围，也与前面的“列国”形成自然而不过度重复的表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名יְהוָה。正文音译为“雅威”，保留这是专名的性质；脚注说明传统译名，避免把专名无提示地改成称号。
- issue: 分散与认识雅威之间的关系
  choice: 以“……时，他们就会知道”保留时间兼结果关系
  alternative: 因为我驱散他们，他们便知道
  rationale: בַּהֲפִיצִי首先可作时间结构理解，而וְיָדְעוּ在语境中带结果意味；译文不把这种关系收窄为单纯因果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首先交代时间背景，再落到“他们就会知道”的结果，符合中文信息推进习惯；“驱散／分散”和“列国／各地”分别对应原文两组近义而不完全相同的词。
