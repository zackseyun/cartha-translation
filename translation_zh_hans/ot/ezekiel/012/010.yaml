  text: אֱמֹ֣ר אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/נָּשִׂ֞יא הַ/מַּשָּׂ֤א הַ/זֶּה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל אֲשֶׁר הֵ֥מָּה בְ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/010.yaml
  text: 'Say to them[a], ‘Thus says the Lord GOD: This burden concerns the prince in Jerusalem and all the house of Israel who are in their midst.’'
translation:
  language: zh_hans
  text: 你要对他们说：‘主耶和华如此说：这则神谕[a]是关于在耶路撒冷的首领和以色列全家，就是那些在他们中间的人。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神谕”也可译作“担子”或“宣告”。末句也可译作“这则神谕是关于在耶路撒冷的首领和在他们中间的以色列全家”；“他们”所指在原文中并不完全明确。
    reason: 说明מַשָּׂא的词义范围，并保留末尾复数代词指向的歧义。
lexical_decisions:
- source_word: אֱמֹר אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 用自然的现代汉语表达命令式及其间接宾语，同时保留直接引语的引入功能。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知使者公式的庄重语气，并按中文圣经传统明确呈现复合神名。
- source_word: הַנָּשִׂיא
  choice: 首领
  rationale: נָשִׂיא在以西结书中是政治领袖的称号；“首领”比“王子”更少引入血统含义，也比泛称“领袖”更具称号色彩。
- source_word: הַמַּשָּׂא הַזֶּה
  choice: 这个担子
  rationale: מַשָּׂא既可指所负的担子，也可指神谕；上下文涉及以西结肩负行装的象征行动，译作“担子”保留具体意象及其先知性双关。
- source_word: בִּירוּשָׁלִַם
  choice: 耶路撒冷的
  rationale: 按介词בְּ的地点义，把该短语理解为修饰“首领”，即身在耶路撒冷的首领。
- source_word: וְכָל בֵּית יִשְׂרָאֵל
  choice: 也指以色列全家
  rationale: 保留“以色列家”这一群体性、盟约性的圣经表达；“全家”在中文中自然体现整体。
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: 就是那些在他们中间的人
  rationale: 尽量保留希伯来文复数代词所造成的指代张力，不擅自把后缀改成指向单数的耶路撒冷。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”既区分אֲדֹנָי与יהוה，也直接保留盟约之名，符合庄重而通行的现代中文表达。
- issue: מַשָּׂא在本节中的含义
  choice: 担子
  alternative: 神谕／宣告
  rationale: 该词确可表示先知性宣告，但本章的象征行动包括肩负行装；“担子”保留可见行动与其信息之间的联系，而脚注说明另一种词义。
- issue: 末尾复数代词的指向
  choice: 保留“他们中间”的复数形式
  alternative: 译为“耶路撒冷城中的”，将其明确指向耶路撒冷
  rationale: 原文אֲשֶׁר הֵמָּה בְתוֹכָם包含复数主语和复数后缀，指向并不完全明朗；正文不把这种歧义静默化解。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“主耶和华如此说”保留先知宣告的固定语体；末句略显紧缩，是为避免消除原文代词指向的真实歧义。
