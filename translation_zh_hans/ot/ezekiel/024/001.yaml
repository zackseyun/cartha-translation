  text: וַ/יְהִי֩ דְבַר יְהוָ֨ה אֵלַ֜/י בַּ/שָּׁנָ֤ה הַ/תְּשִׁיעִית֙ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י בֶּ/עָשׂ֥וֹר לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/001.yaml
  text: And the word of Yahweh came to me in the ninth year[a], in the tenth month, on the tenth day of the month, saying,
translation:
  language: zh_hans
  text: 第九年[a]十月初十，雅威的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文只说“第九年”；以西结书的纪年通常以约雅斤王被掳为起点。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: 雅威的话临到我
  rationale: 这是先知书中常见的领受启示公式。“临到”自然传达事件性，又保留“话”的正式和神学分量；句首的 וַ 作为叙事衔接，在中文单节中不必机械译为“并且”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号替代。
- source_word: בַּשָּׁנָה הַתְּשִׁיעִית
  choice: 第九年
  rationale: 原文没有在本节明说以什么事件为纪年起点，因此正文不增补“被掳”等解释。
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 十月初十
  rationale: 准确表达“第十月、该月第十日”，并采用自然、庄重而简洁的现代汉语日期说法。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下一节的直接话语；中文以“说：”比保留分词式结构更自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名。译作“雅威”既保留专名性质，也避免以称号代替；“耶和华”是传统形式，“上主”则属于称号化翻译。
- issue: “第九年”的纪年参照
  choice: 正文仅译“第九年”，以脚注说明通常理解
  alternative: 第九年（指约雅斤王被掳后第九年）
  rationale: 本节希伯来文本本身没有明示纪年起点。为保留原文的省略和语境依赖，不把解释直接写入正文。
translation_notes:
  register: 采用现代标准汉语，句式简洁庄重。“十月初十”符合汉语日期习惯；“雅威的话临到我”保留先知启示公式的正式色彩。
