  yaml_path: translation/ot/ezekiel/024/019.yaml
  text: And the people said to me, “Will you not tell us what these things mean for us, that you are doing them?”
translation:
  language: zh_hans
  text: 百姓对我说：“你不告诉我们吗？你所做的这些事对我们有什么意义？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא תַגִּיד לָנוּ
  choice: 请你告诉我们……不好吗
  rationale: 保留原文带有期待肯定答复的反问语气，同时使现代汉语表达自然。
- source_word: מָה אֵלֶּה לָנוּ
  choice: 这些事对我们有什么意义
  rationale: לָנוּ表明这些行动与百姓的关联；结合先知象征性行动的语境，译为“对我们有什么意义”比字面“这些对我们是什么”更清楚。
- source_word: כִּי אַתָּה עֹשֶׂה
  choice: 你所做的
  rationale: 将关系含混而紧凑的希伯来语从句自然地嵌入汉语，同时不额外判定其逻辑关系为原因或时间。
theological_decisions:
- issue: 以西结的行动与百姓之间的关系
  choice: 对我们有什么意义
  alternative: 给我们预示什么
  rationale: 原文询问这些事“对我们是什么”，暗示象征意义，但没有明说“预示”；因此避免加入原文未明示的预言术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和直接引语；用“百姓”对应集体名词 הָעָם。
