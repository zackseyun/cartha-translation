source:
  edition: WLC
  text: הֵאָנֵ֣ק דֹּ֗ם מֵתִים֙ אֵ֣בֶל לֹֽא תַֽעֲשֶׂ֔ה פְאֵֽרְ/ךָ֙ חֲב֣וֹשׁ עָלֶ֔י/ךָ וּ/נְעָלֶ֖י/ךָ תָּשִׂ֣ים בְּ/רַגְלֶ֑י/ךָ וְ/לֹ֤א תַעְטֶה֙ עַל שָׂפָ֔ם וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/017.yaml
  text: Groan silently[a]; do not make mourning for the dead. Bind your turban on yourself, and put your sandals on your feet. Do not cover over your mustache[b], and do not eat the bread of men.
translation:
  language: zh_hans
  text: 要默默地叹息；不可为死人举行哀悼。要把头巾缠在头上，把鞋穿在脚上；不可蒙住上唇[a]，也不可吃人的饼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上唇”也可译为“胡须”或“髭须所在的部位”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“人的饼”。这很可能指别人给哀悼者送来的食物，即哀悼期间的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאָנֵק דֹּם
  choice: 要默默地叹息
  rationale: הֵאָנֵק表示因悲痛而叹息或呻吟；דֹּם要求保持静默。译文保留“发出悲叹”与“静默”并置所形成的张力，不将其改写成完全不出声。
- source_word: מֵתִים אֵבֶל לֹא תַעֲשֶׂה
  choice: 不可为死人举行哀悼
  rationale: עָשָׂה אֵבֶל指实行哀悼及相关礼俗。“举行哀悼”在现代汉语中自然，也保留了行为和礼仪层面的含义。
- source_word: פְאֵרְךָ חֲבוֹשׁ עָלֶיךָ
  choice: 要把头巾缠在头上
  rationale: פְאֵר在此指戴在头上的头饰，חבש表示缠上或扎上。“头巾”比泛称“头饰”更具体，又不额外赋予祭司身份等解释。
- source_word: וּנְעָלֶיךָ תָּשִׂים בְּרַגְלֶיךָ
  choice: 把鞋穿在脚上
  rationale: 直译该命令，并以自然现代汉语表达，反映不可赤脚哀悼的具体动作，而不把背景解释写入正文。
- source_word: וְלֹא תַעְטֶה עַל שָׂפָם
  choice: 不可蒙住上唇
  rationale: שָׂפָם可指上唇或髭须所在区域；“上唇”保留身体部位的核心意义，并以脚注注明“髭须部位”的可能理解。
- source_word: וְלֶחֶם אֲנָשִׁים לֹא תֹאכֵל
  choice: 也不可吃别人送来的饼
  rationale: לֶחֶם אֲנָשִׁים字面为“人的饼/众人的食物”，语境很可能指他人给哀悼者送来的食物。“别人送来的饼”使隐含关系在中文中可懂，同时用脚注保留字面形式及语境解释的不确定性。
theological_decisions:
- issue: 如何呈现受禁止的哀悼习俗
  choice: 把各项命令译为对具体哀悼行为的禁止，不在正文中说明其祭司性、洁净意义或后期礼制背景。
  alternative: 将这些动作明确解释为祭司条例，或一概解释为避免礼仪不洁。
  rationale: 经文本身列出以西结不得实行的哀悼举动，重点在先知的象征行动；逐项赋予特定教义或礼制意义会超出本节明说的内容。
- issue: “默默地叹息”的表面张力
  choice: 保留“叹息”与“默默地”的并置。
  alternative: 解释为“不要出声叹息”或“只可低声呻吟”。
  rationale: 原文两个词相邻，既要求悲叹，又要求静默；保留这种张力比替作者决定具体音量更忠实。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“死人”贴近מֵתִים，语气直接但不粗俗；“举行哀悼”体现礼俗行为。“饼”保留古代主食意象，脚注说明其可能泛指哀悼食物。所有脚注标记均已置于正文对应位置。
