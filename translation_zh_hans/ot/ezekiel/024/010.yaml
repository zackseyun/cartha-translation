  text: הַרְבֵּ֤ה הָ/עֵצִים֙ הַדְלֵ֣ק הָ/אֵ֔שׁ הָתֵ֖ם הַ/בָּשָׂ֑ר וְ/הַרְקַח֙ הַ/מֶּרְקָחָ֔ה וְ/הָ/עֲצָמ֖וֹת יֵחָֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/010.yaml
  text: Pile up the wood[a], kindle the fire, cook the flesh thoroughly, and boil the broth[d][c][b]; and let the bones be charred.
translation:
  language: zh_hans
  text: 多添柴[a]，把火点旺，把肉煮透[b]，熬煮那混合物[c]，让骨头烧焦[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“堆上许多柴。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使肉完全”。这里指把肉彻底煮熟。
    reason: lexical_alternative
  - marker: c
    text: 或译：“调制那混合物”或“熬煮那锅汤。”原文的动词和名词同根，含有调和、配制之意。
    reason: lexical_alternative
  - marker: d
    text: 或译：“让骨头被烧灼。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה הָעֵצִים
  choice: 多添柴
  rationale: 使役命令式 הַרְבֵּה 表示增加数量；与“柴”连用时，“多添柴”既自然，也保留不断加添燃料的动作。עֵצִים 在此宜按集合意义译为“柴”，不具体化为“木头”或“木柴段”。
- source_word: הַדְלֵק הָאֵשׁ
  choice: 点旺火
  rationale: הַדְלֵק 是使火燃烧起来的命令式；“点旺火”比单说“点火”更贴合持续加柴、猛烈烹煮的语境。
- source_word: הָתֵם הַבָּשָׂר
  choice: 把肉煮透
  rationale: הָתֵם 的核心意思是使之完成、彻底；在烹煮语境中译为“煮透”自然准确。בָּשָׂר 可直译“肉体”，但此处是锅中之物，正文用“肉”较符合现代汉语，同时不削弱审判意象。
- source_word: וְהַרְקַח הַמֶּרְקָחָה
  choice: 熬煮那混合物
  rationale: רקח 与 מֶרְקָחָה 同根，涉及调和、配制混合物；在锅与火的语境中，“熬煮那混合物”保留烹煮动作，也避免把含义过早限定为“汤”或“炖菜”。
- source_word: וְהָעֲצָמוֹת יֵחָרוּ
  choice: 让骨头烧焦
  rationale: חרר 的尼法勒未完成式在此表示骨头因烈火而被烧灼；“烧焦”传达高温造成的结果，并保留可译作“烧灼”的余地。
theological_decisions: []
