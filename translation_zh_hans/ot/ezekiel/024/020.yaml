  text: וָ/אֹמַ֖ר אֲלֵי/הֶ֑ם דְּבַ֨ר יְהוָ֔ה הָיָ֥ה אֵלַ֖/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/020.yaml
  text: So I said to them[a], “The word of Yahweh came to me, saying,”
translation:
  language: zh_hans
  text: 于是我对他们说：“耶和华的话临到我说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: 于是我……说
  rationale: 该连续叙事形式承接上文并引出以西结的回答；“于是”在现代汉语中自然表达事件推进。
- source_word: אֲלֵיהֶם
  choice: 对他们
  rationale: 介词与第三人称阳性复数词尾明确指出说话对象是“他们”。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留先知书中固定的启示用语及原文的“话”，避免用更具解释性的“信息”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不是以称号“主”替代。
- source_word: הָיָה אֵלַי
  choice: 临到我
  rationale: 该表达直译近于“到了/在我这里”，但在先知蒙受神谕的固定公式中，“临到我”既准确又符合庄重自然的现代中文。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出后续直接引语；中文用“说”可保留原文的公式结构与未完待续的语势。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文传统且广为人知的专名“耶和华”，以保留其专名性质；不以“上主”这一称号代替。
translation_notes:
  register: 采用现代、庄重而易懂的先知叙事语体。“耶和华的话临到我说”有意保留希伯来语先知公式；本节句子在冒号处延续至下一节，因此不补写原文没有的内容。
