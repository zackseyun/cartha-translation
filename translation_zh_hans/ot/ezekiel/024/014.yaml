id: EZK.24.14
reference: Ezekiel 24:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֲנִ֨י יְהוָ֤ה דִּבַּ֨רְתִּי֙ בָּאָ֣ה וְ/עָשִׂ֔יתִי לֹֽא אֶפְרַ֥ע וְ/לֹא אָח֖וּס וְ/לֹ֣א אֶנָּחֵ֑ם כִּ/דְרָכַ֤יִ/ךְ וְ/כַ/עֲלִילוֹתַ֨יִ/ךְ֙ שְׁפָט֔וּ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/014.yaml
  text: I[a], Yahweh, have spoken; it is coming[b], and I will do it. I will not hold back, nor will I spare, nor will I relent. According to your ways and according to your deeds they will judge you[c], declares the Lord GOD.
translation:
  language: zh_hans
  text: “我—耶和华—已经说了：这事必临到，我必施行。我必不收回[a]，不顾惜，也不改变心意[b]。他们必按你的道路和作为审判你[c]。”这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不收回”也可译作“不撤回”或“不松懈”。
    reason: lexical_alternative
  - marker: b
    text: “不改变心意”也可译作“不回心转意”。
    reason: lexical_alternative
  - marker: c
    text: 原文是“他们必审判你”，但没有说明“他们”是谁，可能指执行耶和华审判的人。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，保留其作为名字而非称号的功能。
- source_word: דִּבַּרְתִּי
  choice: 已经说了
  rationale: 完成式表示话已经说出并持续有效；“已经说了”自然且有宣告的分量。
- source_word: בָּאָה
  choice: 这事必临到
  rationale: 阴性单数动词的主语未明说，语境指所宣告的灾祸或审判；“这事”不额外限定所指，“必临到”表达其确定及将临。
- source_word: וְעָשִׂיתִי
  choice: 我也必实行
  rationale: 在预言性的语序中具有将来和确定实现的含义；“实行”承接上文已经说出的宣告。
- source_word: אֶפְרַע
  choice: 收手
  rationale: 此处指不停止或不撤回审判行动；“不收手”简洁自然，同时保留动作意象。
- source_word: אָחוּס
  choice: 顾惜
  rationale: 在审判语境中表示不因怜惜而免除惩罚；“顾惜”庄重且不显生硬。
- source_word: אֶנָּחֵם
  choice: 改变心意
  rationale: נחם在此可表示转意、不再执行已经宣布的审判；直译为“改变心意”保留原文有关神是否转意的张力，不解释成道德意义上的悔罪。
- source_word: כִּדְרָכַיִךְ וְכַעֲלִילוֹתַיִךְ
  choice: 照你的所行所为
  rationale: 把“道路”和“行为”这一并列表达译成自然的中文固定语，同时保留按其行为受审判的司法含义。
- source_word: שְׁפָטוּךְ
  choice: 人必……审判你
  rationale: 保留希伯来文未指定主体的第三人称复数，不改成神亲自审判，也不完全化为被动。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别保留אֲדֹנָי的称号“主”和יהוה的专名“耶和华”，符合中文圣经语体。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 中文基督教传统中“耶和华”辨识度最高，并明确作为神的专名；“雅威”更接近常见学术拟音，但普通读者熟悉度较低。
- issue: 神的נחם如何表达
  choice: 不改变心意
  alternative: 不后悔／不回心转意
  rationale: “改变心意”保留可能停止已宣告审判的语义，又不把该词误解为因犯罪而悔改；脚注列出“不回心转意”以呈现词义范围。
- issue: שְׁפָטוּךְ的未定复数施事者
  choice: 人必……审判你
  alternative: 你必受审判
  rationale: 主动表达保留原文复数施事者未明确的特点；不指认具体执行审判的人，也不把语法上的施事者消去。
- issue: בָּאָה所指为何
  choice: 这事必临到
  alternative: 它已经来到／灾祸必临到
  rationale: 原文没有明说主语；“这事”保留指代的开放性，避免直接补入“灾祸”，同时按上下文表达审判确定将临。
translation_notes:
  register: 采用现代、庄重而易懂的宣告体。以“我耶和华”保留原文开头的强调；结尾用“这是主耶和华的宣告”对应先知书公式。正文所有脚注标记均与脚注对应。
