id: EZK.24.8
reference: Ezekiel 24:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְ/הַעֲל֤וֹת חֵמָה֙ לִ/נְקֹ֣ם נָקָ֔ם נָתַ֥תִּי אֶת דָּמָ֖/הּ עַל צְחִ֣יחַ סָ֑לַע לְ/בִלְתִּ֖י הִכָּסֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/008.yaml
  text: To stir up wrath[a], to take vengeance, I have set her blood on a bare rock[b], so that it would not be covered.
translation:
  language: zh_hans
  text: 为要激起烈怒，彻底报仇[a]，我把她的血[b]放在光秃的磐石上，使血不被遮盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以“报仇”的动词和同根名词连用，借此加强语气。
    reason: lexical_alternative
  - marker: b
    text: “她的血”按原文直译；在本段语境中，也可包含“她所流的血”或“她的血债”之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת חֵמָה
  choice: 为要激起烈怒
  rationale: העלה为使役形，与חֵמָה连用，表示使烈怒升起。“激起烈怒”自然地保留了使役含义和审判语境。
- source_word: לִנְקֹם נָקָם
  choice: 彻底报仇
  rationale: 原文以动词נקם和同根名词נקם连用，加强语气；“彻底报仇”既符合现代汉语，也体现强调作用。
- source_word: נָתַתִּי
  choice: 我把……放在
  rationale: נתן基本义为“给”，在这里带位置补语，意为“放置”；译文保留第一人称主语所表达的主动、有意的行动。
- source_word: דָּמָהּ
  choice: 她的血
  rationale: 按希伯来文的具体意象直译为“她的血”，同时以脚注说明语境中也可指流血之罪或血债。
- source_word: צְחִיחַ סָלַע
  choice: 光秃的磐石
  rationale: 该短语指裸露、无覆盖的岩石表面；“光秃的磐石”与后文“不被遮盖”形成清晰呼应。
- source_word: לְבִלְתִּי הִכָּסוֹת
  choice: 使血不被遮盖
  rationale: 该结构表达目的或预期结果；明确重复“血”，使中文指代清楚，并保留血被公开暴露的意象。
theological_decisions:
- issue: 暴露耶路撒冷之血的行动主体和审判目的
  choice: 说话者有意把她的血放在裸露的磐石上，以激起烈怒并施行报复。
  alternative: 仅描述她的血处于暴露状态，而不突出上帝有意如此安排。
  rationale: 第一人称动词נָתַתִּי（“我放置”）以及两个表示目的的动词不定式，都表明这是说话者有意实施的审判行动；译文保留这一点，却不添加本节没有明说的内容。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“烈怒”“报仇”“磐石”适合先知审判语境，同时普通读者易于理解。两个脚注标记均置于正文相应词语之后。
