  to: “人子啊，你要为自己记下这一天的日期，正是这一天：巴比伦王在这一天围攻耶路撒冷。”
  rationale: 将“今天这个日子”统一调整为“这一天”，避免现代汉语中不必要的当下时间指向，并以“正是这一天／在这一天”保留希伯来文对同日性的重复强调。补出“为自己”以对应לְךָ；同时修订脚注中不自然的替代译法。
