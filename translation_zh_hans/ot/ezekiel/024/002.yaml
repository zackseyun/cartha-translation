base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/002.yaml
  text: 'Son of man[a], write down for yourself the name of the day[c][b], this very day: the king of Babylon has laid siege against Jerusalem on this very day.'
translation:
  language: zh_hans
  text: “人子啊，你要为自己记下这一天的日期，正是这一天：巴比伦王在这一天围攻耶路撒冷。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝对先知的一贯称呼及希伯来语表达，不将其释为较泛的“凡人”。
- source_word: כתוב לְךָ
  choice: 你要记下
  rationale: כתוב是“写、记录”的命令式；לְךָ带有为自己留存记录的意味。现代汉语以“你要记下”自然传达该命令。
- source_word: אֶת שֵׁם הַיּוֹם
  choice: 这个日子的日期
  rationale: 字面为“日子的名称”，语境所指是标明该日的日期；正文采用自然现代汉语，并以脚注保留字面表达。
- source_word: אֶת עֶצֶם הַיּוֹם הַזֶּה
  choice: 就是今天这个日子
  rationale: עֶצֶם在此加强确指，表示“正是这一天”。此译法保留原文郑重强调的语气。
- source_word: סָמַךְ
  choice: 围攻了
  rationale: 该动词基本意象是靠近、压住；与巴比伦王和耶路撒冷的军事语境结合，表示兵临城下并开始围城。用“围攻了”清楚传达语境含义，同时脚注注明较贴字面的可能译法。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 自然、直接地对应希伯来语属格结构。
- source_word: אֶל יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: אֶל通常表示“向、到”，在敌对军事语境中构成围攻的目标；汉语动词“围攻”可直接带宾语。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在今天这个日子
  rationale: 保留原文对同一强调短语的重复，突出命令记录日期与围城事件发生在同一天。
theological_decisions: []
