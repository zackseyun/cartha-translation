source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִפָּ֤תַח פִּ֨י/ךָ֙ אֶת הַ/פָּלִ֔יט וּ/תְדַבֵּ֕ר וְ/לֹ֥א תֵֽאָלֵ֖ם ע֑וֹד וְ/הָיִ֤יתָ לָ/הֶם֙ לְ/מוֹפֵ֔ת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/027.yaml
  text: On that day your mouth will be opened when the fugitive comes to you[a], and you will speak and no longer be mute. So you will be a sign to them, and they will know that I am Yahweh.
translation:
  language: zh_hans
  text: “那日，逃脱者来到你这里时，你的口必被打开[a]；你必说话，不再哑口。你必成为他们的征兆，他们就知道我是雅威。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此短语的句法较难确定，也可理解为“你的口向那逃脱者打开”或“你的口与那逃脱者一同打开”。按上下文，可能指逃脱者带着消息来到之时。
    reason: 保留 אֶת הַפָּלִיט 的句法歧义及其与逃脱者抵达相关的上下文理解。
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 那日
  rationale: 自然保留先知话语中特定日期的指向，也与上文所说消息传来的日子衔接。
- source_word: יִפָּתַח פִּיךָ
  choice: 你的口必得开
  rationale: 保留尼法勒式的被动意味和原文意象，呼应以西结先前不能说话的状态及其解除。
- source_word: אֶת הַפָּלִיט
  choice: 逃脱的人来到你这里时
  rationale: 结合24:26及33:21-22，将此难解结构理解为逃脱者抵达、带来耶路撒冷消息之时；“逃脱的人”保留 פָּלִיט 指逃出灾难者的基本词义。
- source_word: וּתְדַבֵּר וְלֹא תֵאָלֵם עוֹד
  choice: 你必开口说话，不再哑口
  rationale: אלם 表示不能说话或哑口，并非仅仅选择沉默；“开口说话”则自然呈现言语恢复。
- source_word: וְהָיִיתָ לָהֶם לְמוֹפֵת
  choice: 你必成为给他们的一个征兆
  rationale: מוֹפֵת 在此指具有象征和预示作用的记号；“征兆”兼顾可理解性与先知性语境。
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: 他们就知道我是雅威
  rationale: 保留以西结书反复出现的认识公式，并以音译“雅威”呈现四字神名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用专名四字神名；“雅威”是现代汉语中对 Yahweh 的常见音译，可避免以称号代替专名。
- issue: 以西结恢复说话的性质
  choice: 与逃脱者抵达相连的实际恢复
  alternative: 泛指结束沉默；纯粹象征性地获得发言能力
  rationale: 本节承接先前关于以西结哑口的预告，并在叙事上把解除哑口与逃脱者带来消息相连，同时不进一步推断其具体机制。
- issue: מוֹפֵת 的神学语气
  choice: 征兆
  alternative: 神迹；记号
  rationale: 此处重点是以西结本人及其经历对百姓所具有的象征和印证作用；“征兆”不把该词过度限定为超自然奇迹。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“必得开”保留被动意味，“哑口”呼应前文的先知性状态；句式简洁，适合经文诵读。
