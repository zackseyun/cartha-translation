base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/003.yaml
  text: 'And speak a proverb to the rebellious house[a], and say to them, ‘Thus says the Lord GOD: Set on the pot; set it on, and also pour water into it.’'
translation:
  language: zh_hans
  text: 要向悖逆之家讲一个比喻[a]，对他们说：‘主耶和华如此说：把锅架上，架好锅，也要往锅里倒水。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“箴言”。希伯来语 מָשָׁל 可指箴言、比喻或比喻性的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשֹׁל ... מָשָׁל
  choice: 讲一个比喻
  rationale: 动词与同根名词连用，表示说出一个箴言、譬喻或比喻性言论；本节开启锅的扩展性象征，译作“讲一个比喻”自然且保留其修辞性质。
- source_word: בֵּית הַמֶּרִי
  choice: 这悖逆之家
  rationale: 保留以“家”称呼群体的以西结书先知性惯用语，同时用“悖逆”表达其顽抗、不顺服的性质。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的“主”和神圣名号 יהוה；“主耶和华”也是庄重、清楚的现代中文表达。
- source_word: שְׁפֹת הַסִּיר שְׁפֹת
  choice: 把锅架上，架上锅
  rationale: שׁפת 在此指把炊具安放在火上；保留希伯来文重复命令所产生的强调和紧迫感。
- source_word: וְגַם יְצֹק בּוֹ מָיִם
  choice: 也要往锅里倒水
  rationale: “倒”准确表达 יצק 的倾倒动作；不译成“装满”，以免加入原文没有明说的程度。
theological_decisions:
- issue: 神圣名号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 采用中文读者熟悉的专名形式“耶和华”，同时保留 אֲדֹנָי 与 יהוה 的组合，不将二者合并为泛称“主”。
- issue: מָשָׁל 在锅的象征言论中的体裁含义
  choice: 比喻
  alternative: 箴言
  rationale: 此处随后展开锅的象征图景，“比喻”较贴合上下文；脚注保留该词也可指箴言或譬喻性言论的语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“悖逆之家”有意保留以西结书反复出现的先知性称谓；两个“架上”保留原文的重复强调。
