  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אוֹי֮ עִ֣יר הַ/דָּמִים֒ סִ֚יר אֲשֶׁ֣ר חֶלְאָתָ֣/ה בָ֔/הּ וְ/חֶ֨לְאָתָ֔/הּ לֹ֥א יָצְאָ֖ה מִמֶּ֑/נָּה לִ/נְתָחֶ֤י/הָ לִ/נְתָחֶ֨י/הָ֙ הוֹצִיאָ֔/הּ לֹא נָפַ֥ל עָלֶ֖י/הָ גּוֹרָֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/006.yaml
  text: 'Therefore thus says the Lord GOD: Woe to the city of bloodshed[a], the pot whose rust is in it, and whose rust has not gone out from it! Bring it out piece by piece[b]; no lot has fallen on it.'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：祸哉，这流人血的城！这锅污垢附在其中，污垢仍未从锅里除去。把其中的肉一块一块取出来[a]，没有为它拈阄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一块一块”直译为“按它的块，按它的块”；意思是锅里的肉逐块取出。末句直译为“没有阄落在它上面”，表明取出时不经拈阄挑选。
    reason: 说明希伯来语重复结构及拈阄意象。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 自然表达由前文象征行动引出的审判结论。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知传信公式，并分别体现 אֲדֹנָי 的尊称与 יהוה 的圣名。
- source_word: אוֹי עִיר הַדָּמִים
  choice: 祸哉，这流人血的城
  rationale: “祸哉”保留哀叹兼宣判的力度；复数 דמים 在此表示流血之罪。
- source_word: סִיר
  choice: 锅
  rationale: 承接本章的烹煮比喻，简明具体。
- source_word: חֶלְאָה
  choice: 污垢
  rationale: 该词指黏附于锅内的污秽沉积或腐蚀物；“污垢”能涵盖词义的不确定性，避免武断限定为铁锈。
- source_word: לֹא יָצְאָה מִמֶּנָּה
  choice: 仍未从锅里除去
  rationale: 按中文习惯表达污垢没有离开锅，同时保留未被清除的意象。
- source_word: לִנְתָחֶיהָ לִנְתָחֶיהָ הוֹצִיאָהּ
  choice: 把其中的肉一块一块取出来
  rationale: 重复短语具有逐块、无一遗漏的分配意味；上下文表明“块”是锅中的肉块，中文予以适度明示。
- source_word: לֹא נָפַל עָלֶיהָ גּוֹרָל
  choice: 不必为它拈阄
  rationale: 保留拈阄的文化意象，并在语境中表达各块不经挑选、依次取出的命令。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”在现代中文圣经语域中可辨识，并保留尊称与专名两个成分，不把二者合并。
- issue: 锅中污垢的象征是否在正文中直接解释为罪
  choice: 保留“污垢”的锅之比喻
  alternative: 译作“罪污”以直接解释
  rationale: 原文维持锅与附着物的象征张力，正文不越过经文本身作神学释义。
- issue: 末句拈阄的语气
  choice: 不必为它拈阄
  alternative: 没有为它拈阄；阄没有落在它上面
  rationale: 上下文是命令性的审判宣告；此译表达无需选择、逐块取出，但不进一步限定具体执行方式。
translation_notes:
  register: 采用庄重而可懂的现代标准普通话。“祸哉”保留先知审判宣告的强度；其余句法按现代汉语调整。正文唯一脚注标记[a]已置于相应短语之后。
