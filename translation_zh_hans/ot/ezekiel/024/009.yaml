  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה א֖וֹי עִ֣יר הַ/דָּמִ֑ים גַּם אֲנִ֖י אַגְדִּ֥יל הַ/מְּדוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/009.yaml
  text: 'Therefore thus says the Lord Yahweh: Woe to the city of bloodshed! I also will make the firewood pile great[a][b].'
translation:
  language: zh_hans
  text: 所以，主雅威这样说：“祸哉，这流人血的城！我也要把柴堆堆得更大[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流人血的城”原文直译为“血的城”，指一座充斥流血暴行或背负血债的城。
    reason: lexical_alternative
  - marker: b
    text: “把柴堆堆得更大”也可译为“增大这燃料堆”。这里指为焚烧而堆积的燃料。
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文所宣告的审判缘由，清楚表达推论关系，符合现代汉语习惯。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中固定的传信公式，同时用语庄重简明。
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: “主”对应 אֲדֹנָי，“雅威”直接呈现专名 יהוה，保留复合称谓的两个组成部分。
- source_word: אוֹי
  choice: 有祸了
  rationale: 既表达哀叹，也保留审判宣告的强烈语气；比单纯的“哀哉”更易为现代读者理解。
- source_word: עִיר הַדָּמִים
  choice: 流人血的城
  rationale: 希伯来文直译为“血的城”，复数“血”在此指流血暴行或血债；此译自然地传达对这城的道德控诉。
- source_word: גַּם אֲנִי
  choice: 我也要
  rationale: 保留 גַּם 所表达的呼应和强调，指出雅威亲自采取相应行动。
- source_word: אַגְדִּיל
  choice: 加大
  rationale: 准确表达使役形“使之增大”，并与“柴堆”自然搭配。
- source_word: הַמְּדוּרָה
  choice: 柴堆
  rationale: 结合本章以锅、柴和烈火为核心的审判意象，理解为供火焚烧的燃料堆；译法具体、易懂，也不额外引入丧葬含义。
theological_decisions:
- issue: 复合神名称谓 אֲדֹנָי יְהוִה 的译法
  choice: 主雅威
  alternative: 主耶和华；主上帝
  rationale: 原文同时包含称号“主”和神的专名 יהוה。译作“主雅威”保留两者，不以普通称号取代专名。
- issue: גַּם אֲנִי 所表达的神亲自回应
  choice: 我也要
  alternative: 连我也要；我同样要
  rationale: “也”保留原文与城中流血行为相呼应的审判张力，但不进一步解释这种对应关系，以免消解原文的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“有祸了”保留先知审判宣告的力度；“柴堆”延续上下文具体的锅、柴与火的意象。引号标明雅威直接发言。
