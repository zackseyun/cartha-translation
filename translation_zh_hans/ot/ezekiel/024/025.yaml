  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/ל֗וֹא בְּ/י֨וֹם קַחְתִּ֤/י מֵ/הֶם֙ אֶת מָ֣עוּזָּ֔/ם מְשׂ֖וֹשׂ תִּפְאַרְתָּ֑/ם אֶת מַחְמַ֤ד עֵֽינֵי/הֶם֙ וְ/אֶת מַשָּׂ֣א נַפְשָׁ֔/ם בְּנֵי/הֶ֖ם וּ/בְנוֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/025.yaml
  text: And you[a], son of man, will it not be that on the day when I take from them their stronghold, the joy of their glory, the delight of their eyes[b], and the desire of their soul—their sons and their daughters—
translation:
  language: zh_hans
  text: 至于你，人子啊，到了我从他们中间夺去他们的保障、他们荣耀中的喜乐、他们眼中所珍爱的[a]、他们心里所向往的[b]——他们的儿子和女儿——的那一天，岂不是——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们眼目所喜爱的”。
    reason: lexical_alternative
  - marker: b
    text: 或译“他们心所系念的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知反复使用的称呼；采用惯常译法，既贴近原文，也保留其贯穿全书的称谓功能。
- source_word: הֲלוֹא
  choice: 岂不是
  rationale: 该词引出预期肯定回答的反问；“岂不是”保留反问语气，并让句子自然承接下一节。
- source_word: בְּיוֹם
  choice: 到了……的那一天
  rationale: 保留明确的时间表达，同时符合现代汉语长句的行文方式。
- source_word: קַחְתִּי מֵהֶם
  choice: 我从他们中间夺去
  rationale: 这里表示从他们那里取走；“夺去”体现审判性和失去的强烈意味，但不把具体方式限定为毁灭或掳掠。
- source_word: מָעוּזָּם
  choice: 他们的保障
  rationale: מָעוֹז可指坚固之处、避难所或力量所倚；“保障”兼顾具体与比喻含义，也能表达他们所倚靠的对象。
- source_word: מְשׂוֹשׂ תִּפְאַרְתָּם
  choice: 他们荣耀中的喜乐
  rationale: 保留原文由“喜乐”和“荣耀／华美”构成的紧凑关系，不将其完全解释为单一的“骄傲”或“荣美”。
- source_word: מַחְמַד עֵינֵיהֶם
  choice: 他们眼中所珍爱的
  rationale: 该短语指眼目所喜爱、所珍视之物；“所珍爱的”在现代汉语中自然，并保留情感色彩。
- source_word: מַשָּׂא נַפְשָׁם
  choice: 他们心里所向往的
  rationale: 该短语在此可理解为人的心所举向、所系念的对象；“所向往的”符合上下文中一连串珍爱对象的描述，同时以脚注保留“心所系念的”这一较贴近字面的可能表达。
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: 他们的儿女
  rationale: “儿女”简洁而准确地涵盖原文明确列出的儿子和女儿，没有泛化为其他亲属。
theological_decisions:
- issue: 所夺去之物与圣殿／耶路撒冷的关系
  choice: 正文保留“保障、荣耀中的喜乐、眼中所珍爱的、心里所向往的”这一组描述，不直接补明“圣殿”或“耶路撒冷”。
  alternative: 将这些称呼明确译解为“圣殿”或“耶路撒冷”。
  rationale: 上下文很可能以这些称呼指向圣所或耶路撒冷，但本节没有直接点名；不补出具体所指，可保留原文的修辞层次和指代张力。
- issue: 第25节句法在本节末尾未完结
  choice: 以破折号结束，保留悬而未决的反问结构。
  alternative: 从第26节补入谓语，使本节成为完整句。
  rationale: 希伯来文本的句意继续到下一节；不擅自移入下一节内容，可忠实呈现本节边界和延续关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于你，人子啊”保留先知称谓的郑重感；主体部分维持原文层叠的诗性列举，并用破折号显示句意延续至下一节。
