  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知领受启示的固定表达“耶和华的话临到……”中，וַיְהִי 不宜生硬译作“发生了”，而与后面的 דְבַר יְהוָה אֵלַי 合译为现代汉语惯用且庄重的“耶和华的话临到我”。
- source_word: דְבַר
  choice: 话
  rationale: דָּבָר 在此指来自上帝的言语性启示；译作“话”直接保留原文措辞及先知文学语体，也比“信息”少一层解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用四字神名；“耶和华”是现代中文圣经语境中通行、易识别的专名形式，不以“主”等称号替代。
- source_word: אֵלַי
  choice: 临到我
  rationale: אֶל 加第一人称单数后缀表示启示朝向并交付给先知；与 וַיְהִי 组成自然的中文表达“临到我”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文的直接话语；中文以“说”简洁承接下一节，忠实而自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用以色列上帝的专名，而非一般称号。正文采用中文读者最熟悉且具有专名功能的“耶和华”；“雅威”更接近部分学界所重建的读音，但该读音并非绝对确定。
translation_notes:
  register: 采用现代、庄重而易懂的先知叙事语体。保留中文圣经中成熟的启示公式“耶和华的话临到我”，并以冒号自然引出下一节的直接引语。原文信息清楚，无需脚注。
