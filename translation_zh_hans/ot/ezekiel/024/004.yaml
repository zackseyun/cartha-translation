  text: אֱסֹ֤ף נְתָחֶ֨י/הָ֙ אֵלֶ֔י/הָ כָּל נֵ֥תַח ט֖וֹב יָרֵ֣ךְ וְ/כָתֵ֑ף מִבְחַ֥ר עֲצָמִ֖ים מַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/004.yaml
  text: Gather its pieces into it[a], every good piece—the thigh and the shoulder[b]; fill it with choice bones.
translation:
  language: zh_hans
  text: 把所有好肉块[a]——大腿和肩肉[b]——都放进锅里；用精选的骨头把锅装满。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉块”也可译作“切下的肉”；希伯来语指屠宰后分割成的部分。
    reason: lexical_alternative
  - marker: b
    text: “好肉块”也可译作“上好的肉块”；这里的“好”含有优良、可取的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹף
  choice: 放进去
  rationale: 该命令式本义为“收集、聚拢”；与后面的方向短语“到锅里”结合，在现代汉语烹煮语境中译为“放进去”自然明白，也保留命令语气。
- source_word: נְתָחֶיהָ
  choice: 锅的肉块
  rationale: נֶתַח 指分割后的块，尤其是屠宰所得的肉块。希伯来语阴性代词在上下文中回指锅；汉语明确译出“锅的”，避免含混。
- source_word: אֵלֶיהָ
  choice: 进去
  rationale: 方向短语指把肉块放入锅内；用“进去”准确表达动态方向，符合现代汉语习惯。
- source_word: כָּל נֵתַח טוֹב
  choice: 每一块好肉
  rationale: 保留 כָּל 的逐一、全数意味以及 טוֹב 的“好”这一基本义；在此指优良、可取的肉块，但正文不把这一含义强化为最高级。
- source_word: יָרֵךְ וְכָתֵף
  choice: 大腿和肩肉
  rationale: 分别对应动物的大腿部位和肩部；加“肉”使中文读者清楚这是锅中的肉块，而非抽象身体部位。
- source_word: מִבְחַר עֲצָמִים
  choice: 精选的骨头
  rationale: 该结构字面为“骨头中的精选部分/所选骨头”，表达优选的骨头，但未必是最高级；“精选的骨头”兼顾准确与自然。
- source_word: מַלֵּא
  choice: 把锅装满
  rationale: 命令式意为“装满”。原文宾语由语境补足；汉语明确补出“锅”，使句子完整，并保留锅喻的连贯性。
theological_decisions: []
