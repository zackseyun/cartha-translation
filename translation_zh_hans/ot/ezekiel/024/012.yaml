  text: With toil she has wearied herself[a], yet her abundant corrosion does not go out from her[b]; her corrosion remains in the fire.
translation:
  language: zh_hans
  text: 她劳碌得疲乏了；然而，她那大量的锈垢仍没有从她里面出来；她的锈垢仍在火中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句的希伯来文是省略句，直译为“在火中，她的锈垢”。译文补出“仍在”，使句意在汉语中完整。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאֻנִים הֶלְאָת
  choice: 她劳碌得疲乏了
  rationale: תְּאֻנִים表示劳苦、辛劳，הֶלְאָת是阴性单数形式，承接锅或城的阴性拟人形象。译文保留劳作导致疲乏的结果，同时采用自然现代汉语。
- source_word: וְלֹא תֵצֵא מִמֶּנָּה
  choice: 然而……仍未从她里面除去
  rationale: 原文直译为“没有从她出来”。结合清除锅中锈垢的语境，“除去”传达其隐含意义；“从她里面”保留容器及阴性拟人的意象。
- source_word: רַבַּת חֶלְאָתָהּ
  choice: 她那厚厚的锈垢
  rationale: רַבַּת表达锈垢数量多、积层厚；חֶלְאָה指锅上附着的污垢或腐蚀层。“厚厚的锈垢”在汉语中自然，并具体呈现金属锅上积垢的形象。
- source_word: בְּאֵשׁ חֶלְאָתָהּ
  choice: 她的锈垢仍在火中
  rationale: 原文末尾是省略结构，字面为“在火中，她的锈垢”。补出“仍在”使汉语完整，同时保留原文强调：即使置于火中，锈垢也没有消失。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“她”延续原文对锅或城的阴性拟人，不改作中性的“它”；“锈垢”兼顾金属腐蚀与附着污秽的比喻意义。
