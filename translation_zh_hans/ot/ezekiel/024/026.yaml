  text: On that day the fugitive will come to you to make your ears hear[a].
translation:
  language: zh_hans
  text: 那日，逃脱的人必到你这里来，使你亲耳听到这消息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使你的耳朵听见”。希伯来语采用带“耳朵听见”意象的惯用表达；此处指逃脱者带来消息，使你直接听到报告。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 那日
  rationale: 指向一个特定的将来时日；“那日”简洁自然，也保留了指示语气。
- source_word: יָבֹוא
  choice: 必到……来
  rationale: 未完成式在此语境中表达将来；“必”体现预告的确定性，“到你这里来”自然表达朝向以西结的动作。
- source_word: הַפָּלִיט
  choice: 逃脱的人
  rationale: 该词指从灾难中逃出、存留下来的人；“逃脱的人”保留具体的逃生含义，又不额外暗示其法律身份或长期难民身份。
- source_word: אֵלֶיךָ
  choice: 到你这里
  rationale: 准确表达朝向第二人称阳性单数对象，即以西结。
- source_word: לְהַשְׁמָעוּת אָזְנָיִם
  choice: 让你亲耳听见
  rationale: 原文是带有“耳朵听见”意象的惯用表达。“亲耳听见”在现代汉语中自然，并保留直接听到报告的强调；脚注说明更顺畅的释义。
theological_decisions: []
