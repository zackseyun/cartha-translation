  text: וְ/הָיָ֨ה יְחֶזְקֵ֤אל לָ/כֶם֙ לְ/מוֹפֵ֔ת כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה תַּעֲשׂ֑וּ בְּ/בֹאָ֕/הּ וִֽ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/024.yaml
  text: And Ezekiel will be a sign for you; according to all that he has done, you will do. When it comes, then you will know that I am the Lord GOD.
translation:
  language: zh_hans
  text: 以西结必成为你们的预兆；他所做的一切，你们都要照样做。这事来到时，你们就知道我是主耶和华。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹפֵת
  choice: 预兆
  rationale: 此词指具有警示和预示作用的象征性记号；“预兆”既保留其指向将来事件的作用，也符合本段以先知行动预示百姓遭遇的语境。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: 他怎样行
  rationale: 自然表达“按照他所做的一切”，并与下句“照样行”形成清楚对应。
- source_word: בְּבֹאָהּ
  choice: 这事来到时
  rationale: 阴性代词所指在句内并不完全明确，可能回指灾祸或先前宣告之事；译作“这事”保留指代的开放性，不擅自具体化。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 区分 אֲדֹנָי 与神名 יהוה，同时采用现代中文圣经读者熟悉且庄重的表达。
theological_decisions:
- issue: 以西结作为 מוֹפֵת 的性质
  choice: 预兆
  alternative: 神迹／记号
  rationale: 本节重点是以西结的经历和行动预示百姓将要照样经历的事，并非强调超自然奇迹；“预兆”更贴合此处功能。
- issue: בְּבֹאָהּ 的指代对象
  choice: 这事来到时
  alternative: 它来到时／灾祸来到时
  rationale: 原文只有阴性单数代词，具体先行词存在一定含混；“这事”在中文中自然，又不把它限定为某一种解释。
- issue: 神圣称谓 אֲדֹנָי יְהוִה
  choice: 主耶和华
  alternative: 主上帝／主雅威
  rationale: “主耶和华”保留复合称谓的两个要素，并避免把专名 יהוה直接泛化为称号“上帝”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“他怎样行，你们也要照样行”保持原文的对应结构；全句保留宣告式语气与结尾的认识公式。
