base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/018.yaml
  text: So I spoke to the people in the morning[a], and my wife died in the evening. Then in the morning I did as I had been commanded.
translation:
  language: zh_hans
  text: 早晨，我向百姓说话；晚上，我妻子死了。第二天早晨，我就照所吩咐我的去做[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“第二天早晨，我就照我所受的命令去做。”原文为被动形式，直译为“照我所被吩咐的（去做）”，没有明说发出命令者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: 于是，我……说话
  rationale: 前接叙事性ו，推进事件进程；译作“于是”比连续重复“然后”更符合现代汉语叙事，同时不把因果关系说得过强。
- source_word: אֶל הָעָם
  choice: 向百姓
  rationale: עָם在此指以西结所面对的民众；“百姓”自然、庄重，也保留其集合意义。
- source_word: בַּבֹּקֶר
  choice: 早晨／第二天早晨
  rationale: 首次按字面译为“早晨”；末次依叙事时间顺序明确为“第二天早晨”，避免中文读者误解为同一早晨。
- source_word: וַתָּמָת
  choice: 死了
  rationale: מות是普通而直接的“死”；不以“去世”等委婉表达弱化原文。
- source_word: אִשְׁתִּי
  choice: 我妻子
  rationale: 带第一人称单数后缀的אִשָּׁה在婚姻语境中明确指“我的妻子”。
- source_word: בָּעָרֶב
  choice: 晚上
  rationale: 准确表达时间，与前后的“早晨”形成清楚对照；现代汉语中“晚上”比“在晚间”更自然。
- source_word: וָאַעַשׂ
  choice: 我就……去做
  rationale: עשה在此指执行先前所吩咐的事；保留宽泛表达，不擅自补出具体行动。“就”体现叙事推进及遵命而行。
- source_word: כַּאֲשֶׁר
  choice: 照
  rationale: 表达行动与所受命令相符；“照……去做”是自然、准确的现代汉语。
- source_word: צֻוֵּיתִי
  choice: 所受的命令
  rationale: 被动式表明以西结是命令的承受者；名词化表达简洁自然，并保留命令先于执行的时间关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直白的叙事语言。以分号呈现同一天早晚的强烈对照；末句加“第二天”是依据事件顺序作出的汉语明示。保留“说话”和“去做”的概括性，不补充上下文中的具体话语或行动。
