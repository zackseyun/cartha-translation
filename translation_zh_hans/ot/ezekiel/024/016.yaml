  text: בֶּן אָדָ֕ם הִנְ/נִ֨י לֹקֵ֧חַ מִמְּ/ךָ֛ אֶת מַחְמַ֥ד עֵינֶ֖י/ךָ בְּ/מַגֵּפָ֑ה וְ/לֹ֤א תִסְפֹּד֙ וְ/לֹ֣א תִבְכֶּ֔ה וְ/ל֥וֹא תָב֖וֹא דִּמְעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/016.yaml
  text: Son of man[a], behold, I am taking from you the delight of your eyes with a blow, yet you shall not mourn or weep[c][b], nor shall your tears come.
translation:
  language: zh_hans
  text: “人子啊，看哪，我要以灾祸[a]从你那里夺去你眼中所珍爱的[b]；你却不可哀悼，不可哭泣，也不可流泪[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“打击”或“瘟疫”。原文用词可指沉重的一击，也可指灾害或疫病。
    reason: lexical_alternative
  - marker: b
    text: “你眼中所珍爱的”指以西结最珍爱的人；从下文可知，这是他的妻子。
    reason: contextual_clarification
  - marker: c
    text: 原文直译：“你的泪不可来。”
    reason: literal_rendering
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中对先知的固定称呼；保留希伯来语惯用表达及其庄重语感。
- source_word: הִנְנִי לֹקֵחַ
  choice: 看哪，我要……夺去
  rationale: הִנְנִי 加分词表达郑重宣告及迫近的行动；现代汉语以“看哪，我要”兼顾庄重和自然。
- source_word: מַחְמַד עֵינֶיךָ
  choice: 你眼中所珍爱的
  rationale: 保留“眼中”这一原文意象，同时用“所珍爱的”自然表达最宝贵、最令人喜爱之意；不在正文中提前明说是妻子。
- source_word: בְּמַגֵּפָה
  choice: 用灾击
  rationale: מַגֵּפָה 可指击打、灾害或瘟疫。“灾击”保留突然而沉重的打击含义，又不武断限定为疾病。
- source_word: תִסְפֹּד
  choice: 哀悼
  rationale: 指哀悼行为，可能包括正式的丧礼表现；“哀悼”比单纯“悲伤”更贴近其社会礼仪色彩。
- source_word: תִבְכֶּה
  choice: 哭泣
  rationale: 与“哀悼”区分，表达实际哭出声或哭泣的行为。
- source_word: וְלֹא תָבוֹא דִּמְעָתֶךָ
  choice: 也不可流泪
  rationale: 原文直译为“你的泪不可来”；正文采用自然汉语表达，脚注保留其字面意象。
theological_decisions:
- issue: 是否在正文中明说“你眼中所珍爱的”是以西结的妻子
  choice: 保留原文含蓄说法，不在正文中明说妻子
  alternative: 译作“你所爱的妻子”或加同位说明“就是你的妻子”
  rationale: 上下文表明所指是以西结的妻子，但本节本身使用含蓄的珍爱表达。保留这一措辞可避免把上下文信息直接增入本句。
- issue: בְּמַגֵּפָה 的具体性质
  choice: 译作“用灾击”，保留击打、灾祸或疫病之间的语义张力
  alternative: 译作“用瘟疫”“一击之下”或“使她暴亡”
  rationale: 原词语义范围较宽，单节不足以确定具体死因；不应将其专门化为瘟疫、医学意义的中风或单纯的突然死亡。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的郑重语气；“人子”沿用本书固定称呼。正文保持原文三重禁令的递进：不可哀悼、不可哭泣、不可流泪。所有脚注标记均置于对应词句之后。
