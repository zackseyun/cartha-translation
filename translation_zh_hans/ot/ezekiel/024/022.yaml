  text: וַ/עֲשִׂיתֶ֖ם כַּ/אֲשֶׁ֣ר עָשִׂ֑יתִי עַל שָׂפָם֙ לֹ֣א תַעְט֔וּ וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/022.yaml
  text: 'And you will do as I have done: you will not cover your mustache[b][a], and you will not eat the bread of men.'
translation:
  language: zh_hans
  text: 你们必照我所做的去做：不蒙住上唇[a]，也不吃人的饼[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 蒙住上唇是当时表示哀悼或不洁的一种习俗。
    reason: cultural_note
  - marker: b
    text: 原文直译为“人的饼”，也可能特指“哀悼者的饼”，即别人送来安慰哀悼者的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: 你们必……去做
  rationale: 该形式在上下文中承接先知的预告与指示，指百姓将要采取的行动；用“必”自然表达其确定的将来意味。
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: 照我所做的
  rationale: 指百姓将仿照以西结先前的象征行动，简洁保留比较关系。
- source_word: עַל שָׂפָם לֹא תַעְטוּ
  choice: 不蒙住上唇
  rationale: שָׂפָם 指上唇或胡须所在部位；“蒙住上唇”比直译为“蒙住胡须”更自然，也保留哀悼习俗中的具体动作。
- source_word: לֶחֶם אֲנָשִׁים
  choice: 别人送来的食物
  rationale: 字面为“人的饼”，在哀悼语境中通常指别人送给哀悼者的食物。正文采用自然且符合语境的表达，脚注保留字面形式及其可能的专门含义。
- source_word: לֹא תֹאכֵלוּ
  choice: 也不吃
  rationale: 与前一否定分句平行，表达预告中的将来行为；中文无需重复主语或另加将来标记。
