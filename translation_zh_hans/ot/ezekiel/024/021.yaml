reference: Ezekiel 24:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֱמֹ֣ר לְ/בֵ֣ית יִשְׂרָאֵ֗ל כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מְחַלֵּ֤ל אֶת מִקְדָּשִׁ/י֙ גְּא֣וֹן עֻזְּ/כֶ֔ם מַחְמַ֥ד עֵֽינֵי/כֶ֖ם וּ/מַחְמַ֣ל נַפְשְׁ/כֶ֑ם וּ/בְנֵי/כֶ֧ם וּ/בְנֽוֹתֵי/כֶ֛ם אֲשֶׁ֥ר עֲזַבְתֶּ֖ם בַּ/חֶ֥רֶב יִפֹּֽלוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/021.yaml
  text: 'Say to the house of Israel[a], ‘Thus says the Lord GOD: Behold, I am about to profane my sanctuary, the pride of your strength, the delight of your eyes, and the desire of your soul[c][b]; and your sons and your daughters whom you left behind will fall by the sword.’'
translation:
  language: zh_hans
  text: 你要对以色列家说：‘主耶和华如此说：看哪，我要亵渎我的圣所，就是你们力量所夸耀的、你们眼中所珍爱的、你们心里所怜惜的[a]；你们所留下的儿子和女儿必倒在刀剑之下。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你们心里所怜惜的”：原文是罕见表达，也可理解为“你们心里所珍爱的”或“你们心里所渴望的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לְבֵית יִשְׂרָאֵל
  choice: 你要对以色列家说
  rationale: 保留“以色列家”这一立约群体称谓，并用现代汉语自然表达单数命令语气。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知宣告的固定公式；以“耶和华”呈现四字神名，并以“主”对应 אֲדֹנָי。
- source_word: הִנְנִי מְחַלֵּל
  choice: 看哪，我必使……被亵渎
  rationale: “看哪”保留庄严的神圣自我宣告；分词结构在此指即将发生的行动。“使……被亵渎”既表明上帝宣告并促成此事，也避免让汉语读者误解为上帝亲自施行不敬礼仪。
- source_word: מִקְדָּשִׁי
  choice: 我的圣所
  rationale: “圣所”准确保留其神圣空间含义；上下文虽指耶路撒冷圣殿，却不把原词窄化为“圣殿”。
- source_word: גְּאוֹן עֻזְּכֶם
  choice: 你们力量的荣耀
  rationale: גָּאוֹן 可指骄傲、威荣或荣耀；此处描述圣所是百姓因自身力量而引以为荣之物。“力量的荣耀”保留原有紧凑和可能的张力。
- source_word: מַחְמַד עֵינֵיכֶם
  choice: 你们眼中的珍爱
  rationale: 表达圣所是他们眼中可爱、宝贵、渴慕之物，并与本章16节的情感用语呼应。
- source_word: וּמַחְמַל נַפְשְׁכֶם
  choice: 你们心灵所珍惜的
  rationale: מַחְמַל 是罕见词，与怜惜、不忍毁坏和珍爱有关；此译保留情感意义而不武断限定为“欲望”。
- source_word: וּבְנֵיכֶם וּבְנוֹתֵיכֶם
  choice: 你们……的儿女
  rationale: 现代汉语“儿女”自然涵盖原文明确并列的儿子和女儿。
- source_word: אֲשֶׁר עֲזַבְתֶּם
  choice: 你们所留下的
  rationale: 保留“留下、留在后方”的基本意义；不采用“抛弃”，以免加入原文未必具有的道德谴责。
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: 必倒在刀下
  rationale: 保留希伯来语表示战争中遭杀的固定意象，也符合庄严的先知文体。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用普通简体中文圣经读者熟悉的专名“耶和华”，同时明确其为神的立约之名；不以“主”完全替代，因 אֲדֹנָי 已另译为“主”。
- issue: 上帝“亵渎”自己圣所的表达
  choice: 我必使我的圣所被亵渎
  alternative: 我要亵渎我的圣所
  rationale: 原文使役主动形式把行动归于上帝，形成刻意的神学张力：他将圣所交付毁坏，使其失去圣洁地位。中文用使役式保留上帝主权，又避免暗示上帝实施不敬崇拜行为。
- issue: מַחְמַל נַפְשְׁכֶם 的含义
  choice: 你们心灵所珍惜的
  alternative: 你们心灵所怜惜的／你们心灵所渴望的
  rationale: 该罕见名词可涉及怜惜或珍爱；平行结构指百姓对圣所的深切依恋。正文采用较自然的“珍惜”，脚注保留词义的不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的先知文体。“看哪”“如此说”“倒在刀下”保留原文宣告的肃穆节奏；其余措辞避免过度古雅。正文中的脚注标记[a]与脚注完全对应。
