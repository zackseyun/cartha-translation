revisions:
- from: 你要对以色列家说：‘主耶和华如此说：看哪，我必使我的圣所被亵渎；那是你们力量的荣耀、你们眼中的珍爱，也是你们心灵所珍惜的[a]。你们所留下的儿女必倒在刀下。’
  to: 你要对以色列家说：‘主耶和华如此说：看哪，我要亵渎我的圣所，就是你们力量所夸耀的、你们眼中所珍爱的、你们心里所怜惜的[a]；你们所留下的儿子和女儿必倒在刀剑之下。’
  rationale: 修订直接呈现原文中神对圣所施行“亵渎／使其失去圣洁地位”的主动宣告，同时不添加对其具体方式的解释。将“力量的荣耀”调整为更清楚自然的“力量所夸耀的”，并明确译出“儿子和女儿”。脚注保留 מַחְמַל נַפְשְׁכֶם 的词义余地。
