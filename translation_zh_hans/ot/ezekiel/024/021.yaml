review_pass:
  verdict: revise
  source_fidelity: 草稿整体忠实呈现了命令、对“以色列家”的称呼、神谕公式、圣所及儿女将死于刀剑的预告。惟“我必使我的圣所被亵渎”将希伯来文主动使役语态弱化为间接的被动结果；原文明确由神说“我将亵渎／使……失去圣洁地位”。此外，原文明确列出儿子和女儿，正文宜予保留。
  naturalness: “你们力量的荣耀”在现代汉语中意义不够清晰，改为“你们力量所夸耀的”更自然，也更能表达该短语所指的、百姓倚仗并引以为傲的对象。“倒在刀剑之下”保留先知性战争意象，表达自然庄重。
  terminology: “主耶和华”“圣所”“以色列家”均合适。“亵渎”可保留其礼仪性、神学性的语义；以“我要亵渎我的圣所”直译虽带有刻意的震撼，正体现原文的主动语态和神谕张力，不应改写为仅是容许他人亵渎。
  issues:
  - severity: medium
    issue: “我必使我的圣所被亵渎”弱化了原文的主动语态。
    rationale: מְחַלֵּל 是第一人称神圣自我宣告中的主动分词；被动使役说法虽可解释神如何施行审判，却没有完整保留原文将此行动直接归于神的措辞。
  - severity: low
    issue: “儿女”概括了原文的“儿子和女儿”。
    rationale: “儿女”汉语自然，但原文特意并列 בְנֵיכֶם 和 בְנוֹתֵיכֶם；正文可无负担地明确译出二者。
  - severity: low
    issue: “你们力量的荣耀”语义生硬且关系不明。
    rationale: 可译为“你们力量所夸耀的”，既符合上下文中圣所为百姓自豪、倚靠之物，也更合现代标准汉语。
