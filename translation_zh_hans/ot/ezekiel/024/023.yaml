  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/פְאֵרֵ/כֶ֣ם עַל רָאשֵׁי/כֶ֗ם וְ/נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם לֹ֥א תִסְפְּד֖וּ וְ/לֹ֣א תִבְכּ֑וּ וּ/נְמַקֹּתֶם֙ בַּ/עֲוֺנֹ֣תֵי/כֶ֔ם וּ/נְהַמְתֶּ֖ם אִ֥ישׁ אֶל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/023.yaml
  text: Your turbans will be on your heads and your sandals on your feet[a]; you will not mourn and you will not weep[c][b], but you will waste away in your iniquities and groan to one another.
translation:
  language: zh_hans
  text: 你们头上戴着头巾[a]，脚上穿着鞋；你们不会哀悼，也不会哭泣，却要在自己的罪孽中[b]衰残，各人向自己的弟兄呻吟[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头巾”也可译作“头饰”或“华美的头饰”。原词指装饰性的头部服饰；在本段丧礼语境中，很可能是头巾一类的头饰。
    reason: lexical_alternative
  - marker: b
    text: “在自己的罪孽中”也可理解为“因自己的罪孽”或“在自己的罪责中”；“罪孽”一词也可包含罪所带来的后果。
    reason: lexical_and_theological_ambiguity
  - marker: c
    text: 原文直译：“各人向他的弟兄”；按句意也可译作“彼此呻吟”。
    reason: literal_expression
lexical_decisions:
- source_word: פְאֵרֵיכֶם
  choice: 你们的头巾
  rationale: פְּאֵר可指华美的头饰；本节与“在头上”及丧礼习俗相连，具体译为“头巾”最合语境，也比泛称“装饰”更清楚。
- source_word: נַעֲלֵיכֶם
  choice: 鞋
  rationale: נַעַל泛指脚上所穿的鞋履；“鞋”在现代汉语中自然简洁，也不必把古代形制限定为某一种凉鞋。
- source_word: תִסְפְּדוּ
  choice: 哀悼
  rationale: ספד常指为死者举行或表达哀悼；“哀悼”既涵盖正式举哀，也符合本段丧礼背景。
- source_word: תִבְכּוּ
  choice: 哭泣
  rationale: בכה直接表示哭泣；此译庄重、自然，并与“哀悼”形成原文中的并列。
- source_word: נְמַקֹּתֶם
  choice: 衰残
  rationale: מקק有消损、腐坏、渐渐衰败之意；“衰残”保留持续败坏的力度，同时避免在此处过度具体化为肉体腐烂。
- source_word: בַּעֲוֺנֹתֵיכֶם
  choice: 在自己的罪孽中
  rationale: 保留介词ב的紧凑表达，并以“罪孽”呈现עָוֹן的核心意义，不在正文中单方面限定为原因、罪责或刑罚。
- source_word: נְהַמְתֶּם
  choice: 呻吟
  rationale: נהם表示因痛苦发出的低沉声音；“呻吟”符合受压、悲痛而发声的语境。
- source_word: אִישׁ אֶל אָחִיו
  choice: 各人向自己的弟兄
  rationale: 原文直译为“各人向他的弟兄”，明确使用阳性个体和亲属称谓；正文保留这一措辞，不直接化约为“彼此”。
theological_decisions:
- issue: עָוֹן在审判语境中的含义
  choice: 罪孽
  alternative: 罪责；罪孽所招致的惩罚
  rationale: 该词可同时涉及罪行、罪责及其后果。正文采用语义核心“罪孽”，脚注提示介词结构的其他理解，以免把原文的神学张力缩减为单一因果解释。
- issue: אִישׁ אֶל אָחִיו的性别及关系用语
  choice: 各人向自己的弟兄
  alternative: 彼此；各人向同伴
  rationale: 希伯来文明确为“各人”与“他的弟兄”。保留“弟兄”可呈现原文的男性亲属措辞；脚注说明其在句中的相互指向功能。
- issue: 否定未完成式的语气
  choice: 不会哀悼，也不会哭泣
  alternative: 不可哀悼，也不可哭泣
  rationale: 本节延续先知之举将成为百姓遭遇之预兆的语境，因此将לֹא加未完成式译作预告性的将来，而非仅仅当作命令；语境仍含有这种行为受限制的意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“仍戴着／仍穿着”突显他们不按通常丧礼除去头饰和鞋履；“衰残”与“呻吟”保留审判中的压抑和消损感。分号维持原文由外在举止转向内在败坏与痛苦的结构。
