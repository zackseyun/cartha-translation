base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/005.yaml
  text: Take the choicest of the flock[a], and also pile the bones under it; bring it to a boil, boil it well[b], and let its bones be cooked in it.
translation:
  language: zh_hans
  text: 要取羊群中上好的羊，又要把骨头堆[a]在锅下；使锅滚沸，充分沸腾[b]，连锅里的骨头也要煮熟。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“堆”所译的希伯来词罕见，确切含义不完全确定；结合上下文，较可能是指把骨头堆放或排列在锅下。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“使它的沸腾沸腾”，是同根词构成的强调说法，表示使锅充分沸腾。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְחַר הַצֹּאן
  choice: 羊群中最好的
  rationale: מִבְחַר 表示精选、上好的部分；这一译法自然表达从羊群中取其精良者，同时不强行限定单数或复数。
- source_word: לָקֹוחַ
  choice: 要取
  rationale: 此形式在命令序列中具有祈使作用；译作“要取”既保留指令语气，也与上下文庄重的宣告体协调。
- source_word: וְגַם דּוּר הָעֲצָמִים תַּחְתֶּיהָ
  choice: 又要把骨头堆在锅底下
  rationale: דּוּר 罕见且含义不完全确定；结合 תַּחְתֶּיהָ，较可能指把骨头堆放在锅下。正文采用符合烹煮场景的译法，并以脚注保留词义的不确定性。
- source_word: רַתַּח רְתָחֶיהָ
  choice: 使锅滚沸，沸腾不止
  rationale: 原文以动词和同根名词构成强调表达，意为让锅充分、持续沸腾；中文用重复而自然的措辞传达加强语气。
- source_word: גַּם בָּשְׁלוּ עֲצָמֶיהָ בְּתוֹכָהּ
  choice: 连锅里的骨头也要煮熟
  rationale: 保留 גַּם 的递进意味，并将 בְּתוֹכָהּ 明确为“锅里”。动词形式虽为完成式，但处于生动的命令序列中，可理解为所要求或预期达到的状态；“也要煮熟”不额外加入明确的目的或结果连词。
