  text: וְ/הַעֲמִידֶ֥/הָ עַל גֶּחָלֶ֖י/הָ רֵקָ֑ה לְמַ֨עַן תֵּחַ֜ם וְ/חָ֣רָה נְחֻשְׁתָּ֗/הּ וְ/נִתְּכָ֤ה בְ/תוֹכָ/הּ֙ טֻמְאָתָ֔/הּ תִּתֻּ֖ם חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/011.yaml
  text: Then set it empty on its coals[a], so that it may become hot and its bronze may glow, and its uncleanness within it may be melted, and its corrosion consumed.
translation:
  language: zh_hans
  text: 再把空锅放在炭火上，使它烧热，连锅的铜也烧得通红，使其中的污秽熔化，锅垢[a]烧尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锈蚀”或“浮渣”。希伯来语这个词可指金属上的腐蚀物，也可泛指污垢；在这里又象征耶路撒冷道德上的污秽。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמִידֶהָ
  choice: 再把……放在
  rationale: 使役式命令语气，宾语为阴性单数的锅；结合上下文，以“再”表达连续动作，以“放在”保持现代汉语自然。
- source_word: עַל גֶּחָלֶיהָ
  choice: 在炭火上
  rationale: גֶּחָלִים 指燃烧的炭或余火；汉语“炭火”比直译“它的炭”自然，也清楚呈现加热场景。
- source_word: רֵקָה
  choice: 空锅
  rationale: 该阴性形容词描述锅已倒空；将其与“锅”合译为“空锅”，简洁明确。
- source_word: לְמַעַן תֵּחַם
  choice: 使锅烧热
  rationale: 保留目的句和逐渐受热的过程；补出“锅”以免汉语代词所指不清。
- source_word: וְחָרָה נְחֻשְׁתָּהּ
  choice: 铜也烧得火烫
  rationale: חָרָה 在此表示炽热、灼热；“火烫”适合铜锅受强热的情景，又避免说金属本身燃烧。
- source_word: נְחֻשְׁתָּהּ
  choice: 铜
  rationale: נְחֹשֶׁת 可指铜或青铜；此处保留较宽泛且自然的“铜”，指锅的金属材质。
- source_word: וְנִתְּכָה
  choice: 熔化
  rationale: נתך 可表达熔化或倾流；在强火炼除锅内污秽的意象中，“熔化”最贴切，同时保留其异常而强烈的先知性图像。
- source_word: בְתוֹכָהּ טֻמְאָתָהּ
  choice: 其中的污秽
  rationale: טֻמְאָה 兼有礼仪和道德上的不洁含义；“污秽”既可指锅中实物，也保留象征耶路撒冷罪污的力度。
- source_word: תִּתֻּם
  choice: 烧尽
  rationale: 此动词表达终结、耗尽；结合炭火和炼除的语境，“烧尽”自然地呈现其被彻底除去。
- source_word: חֶלְאָתָהּ
  choice: 锅垢
  rationale: חֶלְאָה 可指锈蚀、渣滓或污垢。正文采用“锅垢”，既切合器皿表面的积垢，也不把含义过早限定为纯粹的锈或浮渣；脚注保留其他可能。
theological_decisions:
- issue: 如何同时保留字面的铜锅炼净图像与耶路撒冷道德污秽的象征意义
  choice: 正文并用具体的“铜、熔化、锅垢”与带道德色彩的“污秽”
  alternative: 全用烹饪词汇如“浮渣”，或直接解释为“罪恶、罪责”
  rationale: 希伯来文让锅及其污垢的实物图像承载对耶路撒冷的审判。译文不应把它缩减成清洗炊具，也不应跳过比喻而直接改写为抽象神学判断。
- issue: חֶלְאָה 的具体所指
  choice: 正文译“锅垢”，脚注列出“锈蚀、浮渣”等可能
  alternative: 确定译作“锈”或“浮渣”
  rationale: 该词在本段可兼指金属腐蚀物和污浊残渣；原文并未要求读者只选一种，因此译文保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保持命令后的目的关系，并用“好让”自然连接炼除污秽的结果。正文中的脚注标记[a]与脚注完全对应。
