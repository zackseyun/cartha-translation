base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/007.yaml
  text: For her blood is in her midst[a]; she set it on a bare rock[b]. She did not pour it out on the ground to cover it with dust.
translation:
  language: zh_hans
  text: 因为她的血[a]就在她中间；她把这血放在光秃的岩石上[b]，没有把血倒在地上，好用尘土把它掩盖起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “她的血”也可理解为“她的血债”；希伯来文以具体的“血”表达暴力流血所带来的罪责。
    reason: lexical_alternative
  - marker: b
    text: 用土掩盖所流的血，与不可任由血暴露在外的观念有关；这里血留在光秃的岩石上，公开显露。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明审判意象的缘由，保留原文的因果、解释作用。
- source_word: דָמָהּ
  choice: 她的血
  rationale: 原文直译为“她的血”。上下文虽包含流血罪责之意，但本节以暴露而未掩盖的血为核心意象，因此保留具体说法。
- source_word: בְּתוֹכָהּ הָיָה
  choice: 在她中间
  rationale: 保留耶路撒冷被拟人化并作为城体空间的表达；汉语不必另译系词也能自然表达状态。
- source_word: עַל צְחִיחַ סֶלַע
  choice: 在光秃的岩石上
  rationale: צְחִיחַ 表示裸露、无土覆盖的表面；此译凸显血无法渗入土中、公开暴露的画面。
- source_word: שָׂמָתְהוּ
  choice: 她把血放在
  rationale: 直接表达 שׂים 的放置义，并以“血”复指宾语，使现代汉语清楚自然。
- source_word: לֹא שְׁפָכַתְהוּ עַל הָאָרֶץ
  choice: 没有倒在地上
  rationale: שׁפך 在这里着重把血倾倒于可覆盖的地面，而不只是杀戮行为；“倒”准确保留这一具体动作。
- source_word: לְכַסּוֹת עָלָיו עָפָר
  choice: 用尘土掩盖
  rationale: 简洁保留用土覆盖所流之血的古代意象；“尘土”对应 עָפָר，也与岩石的裸露形成对照。
theological_decisions:
- issue: 暴露之血意象的解释
  choice: 正文保留“血”这一具体意象，以未被尘土掩盖、公开留在岩石上的血暗示耶路撒冷的流血罪责。
  alternative: 在正文中直接译作“血债”或“流血之罪”。
  rationale: 原文借具体的血表达暴力及其罪责，并刻意发展血被放置、倾倒和覆盖的画面。保留这种张力，既不削弱道德含义，也不把解释提前写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留耶路撒冷的阴性拟人称呼“她”，并用“光秃的岩石”“尘土掩盖”维持原文鲜明的物质意象。
