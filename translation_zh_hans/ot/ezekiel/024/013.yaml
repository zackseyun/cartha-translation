source:
  edition: WLC
  text: בְּ/טֻמְאָתֵ֖/ךְ זִמָּ֑ה יַ֤עַן טִֽהַרְתִּי/ךְ֙ וְ/לֹ֣א טָהַ֔רְתְּ מִ/טֻּמְאָתֵ/ךְ֙ לֹ֣א תִטְהֲרִי ע֔וֹד עַד הֲנִיחִ֥/י אֶת חֲמָתִ֖/י בָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/013.yaml
  text: In your uncleanness is lewdness[a]. Because I cleansed you, but you were not cleansed from your uncleanness[b], you will not be cleansed anymore until I have satisfied my wrath against you.
translation:
  language: zh_hans
  text: 你的污秽中有淫行[a]。因为我使你洁净，你却没有从自己的污秽中得洁净，所以你不再得洁净，直到我在你身上发尽我的烈怒[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “淫行”也可译作“无耻的恶行”或“邪淫”。这里的希伯来词常指可耻、淫荡的恶行。
    reason: lexical_alternative
  - marker: b
    text: 直译为“直到我使我的烈怒安歇在你身上”，意思是烈怒完全施行之后才止息。
    reason: idiom
lexical_decisions:
- source_word: בְּטֻמְאָתֵךְ
  choice: 你的污秽中
  rationale: 保留介词 ב 所表达的范围或状态；“污秽”也保留《以西结书》中礼仪与道德含义彼此交叠的特点。
- source_word: זִמָּה
  choice: 淫行
  rationale: 该词在《以西结书》中常指可耻而带有性意味的恶行；“淫行”比泛称“邪恶”更具体，也符合先知谴责的语气。
- source_word: יַעַן
  choice: 因为
  rationale: 按通常用法引出审判的原因，现代汉语自然清楚。
- source_word: טִהַרְתִּיךְ
  choice: 我洁净你
  rationale: 紧贴希伯来语使役完成式，不在正文中擅自加入“试图”或“愿意”等原文未明说的情态；其与下句形成的张力予以保留。
- source_word: וְלֹא טָהַרְתְּ
  choice: 你却没有……洁净
  rationale: 表达未达到洁净状态，并以“却”清楚呈现与上句之间的反差。
- source_word: מִטֻּמְאָתֵךְ
  choice: 脱离自己的污秽
  rationale: “脱离”体现 מן 的分离意义，并重复“污秽”以保持原文词汇呼应。
- source_word: לֹא תִטְהֲרִי עוֹד
  choice: 你不再得洁净
  rationale: “不再”对应 עוֹד，“得洁净”自然表达将来持续不能洁净的审判宣告。
- source_word: עַד הֲנִיחִי
  choice: 直到我……发尽
  rationale: נוח 的使役式与“烈怒”连用，意为让怒气在完全施行后止息；“发尽”在汉语中准确表达这一结果。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: “烈怒”体现 חֵמָה 在先知审判语境中的强烈程度与庄重语气。
- source_word: בָּךְ
  choice: 向你
  rationale: 在发怒的语境中自然表达怒气所针对的对象，同时避免生硬直译为“在你里面”。
theological_decisions:
- issue: 前一洁净分句指已经完成的洁净，还是尝试或提供洁净
  choice: 我洁净你
  alternative: 我曾想洁净你／我试图洁净你
  rationale: 希伯来语本身直陈“我洁净你”，随后又说“你却没有洁净”，形成刻意而真实的张力。正文不替原文消解这种张力；脚注说明可按语境理解为施行、寻求或提供洁净而未产生结果。
- issue: 如何表达“使我的烈怒在你身上安歇”
  choice: 直到我向你发尽我的烈怒
  alternative: 直到我使我的烈怒停在你身上
  rationale: 这是审判语境中的惯用表达，指烈怒充分施行之后止息。“发尽”传达完成性，又不引入献祭或赎罪方面的技术性概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“我洁净你，你却没有……洁净”的原文张力，不用解释性增译消除；“发尽我的烈怒”则以自然汉语传达希伯来语审判惯用语。
