  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כִּ֤י הִרְחַקְתִּי/ם֙ בַּ/גּוֹיִ֔ם וְ/כִ֥י הֲפִֽיצוֹתִ֖י/ם בָּ/אֲרָצ֑וֹת וָ/אֱהִ֤י לָ/הֶם֙ לְ/מִקְדָּ֣שׁ מְעַ֔ט בָּ/אֲרָצ֖וֹת אֲשֶׁר בָּ֥אוּ שָֽׁם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/016.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: Though I removed them far off among the nations, and though I scattered them among the lands, yet I became for them a little sanctuary in the lands where they had gone.’'
translation:
  language: zh_hans
  text: 所以你要说[a]：‘主耶和华如此说：我虽把他们远远迁到列国中，又把他们分散到各地，却在他们所到的各地作了他们的小圣所[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你要说”的对象是先知以西结；“所以”承接上文的审判与应许。
    reason: clarification
  - marker: b
    text: “小圣所”也可译作“暂时的圣所”或“在短时间内作他们的圣所”。希伯来语可指小或有限，也可能指时间短暂。
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן אֱמֹר
  choice: 所以你要说
  rationale: לָכֵן承接上文作推论，译为“所以”；命令式אֱמֹר明确以先知为受命者，汉语补出“你要”自然清楚。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知使者公式，并以“主耶和华”同时表达אֲדֹנָי的称号和יהוה的圣名，避免两个“主”并列。
- source_word: כִּי הִרְחַקְתִּים בַּגּוֹיִם
  choice: 我虽使他们远离本土，流落列国
  rationale: 配对的כִּי从句在语境中有让步作用。הִרְחַקְתִּים保留上帝使其远离的主动性；“本土”为汉语中使空间关系完整所作的语境性补足，“流落列国”自然表达身处万邦之中的流散状态。
- source_word: וְכִי הֲפִיצוֹתִים בָּאֲרָצוֹת
  choice: 又把他们分散到各地
  rationale: 保留פוץ使役形所表达的神圣行动；“各地”传达אֲרָצוֹת的复数以及多个流散地域。
- source_word: וָאֱהִי לָהֶם
  choice: 却……作了他们……
  rationale: ו在语境中表达转折；וָאֱהִי为叙事过去形式，译作“作了”保留事件性，不改写为单纯持续状态。
- source_word: לְמִקְדָּשׁ מְעַט
  choice: 小小的圣所
  rationale: מְעַט最直接修饰“圣所”，可表小或有限；“小小的”自然而庄重地保留这种限定，同时以脚注保存可能的时间义。
- source_word: בָּאֲרָצוֹת אֲשֶׁר בָּאוּ שָׁם
  choice: 在他们所到的各地
  rationale: 保留אֲרָצוֹת的复数范围和בָּאוּ שָׁם的到达意义；中文关系结构简洁自然，不强加不必要的时态解释。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”在现代汉语圣经语域中可辨识，同时保留称号与专名两个成分，不将יהוה消隐为普通称号。
- issue: לְמִקְדָּשׁ מְעַט中מְעַט的范围
  choice: 小小的圣所
  alternative: 暂时作他们的圣所
  rationale: 主文采用较直接的程度或规模义，但希伯来语也容许时间义；用脚注保留该歧义，不把经文的神学张力单向定死。
- issue: וָאֱהִי所表达的时态与体貌
  choice: 作了他们……圣所
  alternative: 一直作他们……圣所
  rationale: 该词形是wayyiqtol，首先呈现过去叙事中的行动或进入某种关系；不以完成时或持续副词将其解释为明确延续至说话时。
translation_notes:
  register: 采用现代标准普通话和庄重的经文语体。句法尽量贴近希伯来语的让步—转折结构，同时避免生硬直译；“流落列国”使放逐语境对普通读者清楚。“小小的圣所”保留原文异常而富张力的表达，并用脚注呈现时间义的可能性。
