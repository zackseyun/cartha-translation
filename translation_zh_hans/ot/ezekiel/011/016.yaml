revisions:
- from: 所以你要说[a]：‘主耶和华如此说：我虽使他们远离本土，流落列国，又把他们分散到各地，却在他们所到的各地作了他们小小的圣所[b]。’
  to: 所以你要说[a]：‘主耶和华如此说：我虽把他们远远迁到列国中，又把他们分散到各地，却在他们所到的各地作了他们的小圣所[b]。’
  rationale: 删除“本土”这一不必要的补足，并将“流落列国”改为“远远迁到列国中”，以更直接呈现原文中神使他们远离并在列国中的意思，且与随后“分散到各地”保持清晰区分。将“小小的圣所”调整为“小圣所”，改善庄重语体，同时不改变主文对מְעַט的有限／小之理解；脚注保留其可能的时间义。
