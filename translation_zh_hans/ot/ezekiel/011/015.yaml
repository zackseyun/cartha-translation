id: EZK.11.15
reference: Ezekiel 11:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֶּן אָדָ֗ם אַחֶ֤י/ךָ אַחֶ֨י/ךָ֙ אַנְשֵׁ֣י גְאֻלָּתֶ֔/ךָ וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה אֲשֶׁר֩ אָמְר֨וּ לָ/הֶ֜ם יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם רַֽחֲקוּ֙ מֵ/עַ֣ל יְהוָ֔ה לָ֥/נוּ הִ֛יא נִתְּנָ֥ה הָ/אָ֖רֶץ לְ/מוֹרָשָֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/015.yaml
  text: Son of man[a], your brothers, your brothers, the men of your redemption, and all the house of Israel, all of it—these are the ones to whom the inhabitants of Jerusalem have said, ‘Go far away from Yahweh[b]; this land has been given to us as a possession.’
translation:
  language: zh_hans
  text: “人子啊，你的弟兄，你的弟兄，就是你那些负有赎回责任的至亲[a]，以及以色列全家，全部——耶路撒冷的居民曾对他们说：‘你们远离雅威吧！这地已经赐给我们作产业[b]了。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文较难确定，直译近于“你赎回的人”。也可译作“你的同族”“与你一同被掳的人”，或“对你有赎回权的亲属”。原词涉及亲属关系及亲属赎回人的权利或责任。
    reason: lexical_alternative
  - marker: b
    text: “作产业”也可译作“归为所有”或“作基业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝称呼先知的固定用语，也维持原文“人之子”的惯用表达。
- source_word: אַחֶיךָ אַחֶיךָ
  choice: 你的弟兄，你的弟兄
  rationale: 原文有意重复，不予合并；这样保留其强调作用，并让后面的同位说明自然展开。
- source_word: אַנְשֵׁי גְאֻלָּתֶךָ
  choice: 与你有亲属赎回关系的人
  rationale: גְאֻלָּה兼含亲属关系以及亲属所负赎回权利或责任；此译保留“赎回”的词根联系，同时避免把含义限定为“同被掳的人”等单一解释。
- source_word: וְכָל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: 以及以色列全家所有的人
  rationale: 保留“以色列家”这一集体称谓及随后“全体”的加强语气；中文加“所有的人”使表达自然清楚。
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: 耶路撒冷的居民
  rationale: 自然表达分词结构，并清楚呈现城内居民与被他们排斥者之间的对照。
- source_word: רַחֲקוּ מֵעַל יְהוָה
  choice: 离耶和华远远的吧
  rationale: 按复数命令式理解，保留耶路撒冷居民直接驱斥对方的语气；“远远的”传达 רחק 的距离强调。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，避免用普通称号取代专名。
- source_word: לָנוּ הִיא נִתְּנָה הָאָרֶץ
  choice: 这地已经赐给我们
  rationale: 保留原文被动语态以及城内居民声称土地归己的重点。
- source_word: לְמוֹרָשָׁה
  choice: 作产业
  rationale: “产业”在中文中可表达承受而得、归人持有之地，兼顾“产业、基业、所有之地”等语义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文圣经传统中最通行的专名形式，同时承认“雅威”是更贴近学界常见拟音的选择。
- issue: אַנְשֵׁי גְאֻלָּתֶךָ 所指的亲属与赎回关系
  choice: 与你有亲属赎回关系的人
  alternative: 你的同族；与你一同被掳的人；对你有赎回权的亲属
  rationale: 该短语艰深，可能着重同族亲属，也可能涉及亲属赎回人的权利和责任。正文不把它缩减为单一社会身份，而保留亲属与赎回两层联系。
- issue: רַחֲקוּ מֵעַל יְהוָה 的语气
  choice: 按命令式译为“离耶和华远远的吧”
  alternative: 他们远离了耶和华
  rationale: 马所拉文本的形式最自然地理解为复数命令式，也符合随后土地归属宣称中的排斥语气；另解会把引语改成对被掳者状态的陈述。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留“你的弟兄”的原文重复和引语中的强烈排斥语气；对艰深的亲属赎回用语在正文中适度明示，并用脚注保存其他可能解释。
