  text: הִ֗יא לֹֽא תִהְיֶ֤ה לָ/כֶם֙ לְ/סִ֔יר וְ/אַתֶּ֛ם תִּהְי֥וּ בְ/תוֹכָ֖/הּ לְ/בָשָׂ֑ר אֶל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפֹּ֥ט אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/011.yaml
  text: It will not be for you as a pot[a], and you will not be within it as meat; at the border of Israel I will judge you.
translation:
  language: zh_hans
  text: 这城不会成为你们的锅，你们也不会在其中作肉[a]；我要在以色列的边界审判你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉”所译的原文词也可指“肉身”；但在这里的锅的比喻中，指锅里的肉。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִיא
  choice: 这城
  rationale: 阴性代词回指上文的耶路撒冷。汉语若直译为“她”不自然，明示为“这城”可清楚保留所指对象。
- source_word: לְסִיר
  choice: 作你们的锅
  rationale: סִיר指烹煮用的锅；此处沿用上下文的锅与肉之比喻，采用简洁自然的“锅”。
- source_word: וְאַתֶּם תִּהְיוּ בְתוֹכָהּ לְבָשָׂר
  choice: 你们也不会作其中的肉
  rationale: 希伯来文第二分句形式上没有重复否定词，但在并列结构中承接前面的否定范围；译为“也不会”符合汉语表达，并与上下文中他们将被带出城外的宣告一致。“其中”保留空间意象。
- source_word: בָשָׂר
  choice: 肉
  rationale: 该词本义为“肉、肉体”，在烹锅比喻中指锅里的肉；正文用“肉”最自然，同时用脚注说明其字面意义。
- source_word: אֶל גְּבוּל יִשְׂרָאֵל
  choice: 在以色列的边界
  rationale: אֶל在此语境中可表达朝向边界并在该处发生审判；“在……边界”自然呈现审判地点，同时不扩展为更宽泛的“境内”。
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: 我要……审判你们
  rationale: שׁפט在先知审判宣告中具有明确的司法含义，“审判”准确而庄重。
theological_decisions:
- issue: 耶路撒冷作为保护性烹锅的比喻
  choice: 保留“锅”和“肉”的意象，不在正文中解释为安全或保护
  alternative: 意译为“这城不能保护你们”
  rationale: 本节反转领袖先前所用的俗语。保留原有比喻，可维持先知话语的修辞张力，避免把解释直接写入经文。
- issue: 第二分句否定词的作用范围
  choice: 将前一分句的否定理解为延续至并列的第二分句，译作“也不会”
  alternative: 按动词表面形式译作“你们却会作其中的肉”
  rationale: 希伯来语并列结构可以共享前置否定；上下文明确宣告他们将被带出耶路撒冷，并在以色列边界受审，因此共享否定既合语法，也保持本段论述连贯。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“这城”明确代词所指；分号保留两个审判宣告之间紧密而有层次的关系。
