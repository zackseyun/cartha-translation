source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לָ/הֶם֙ לֵ֣ב אֶחָ֔ד וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשָׂרָ֔/ם וְ/נָתַתִּ֥י לָ/הֶ֖ם לֵ֥ב בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/019.yaml
  text: And I will give them one heart[a], and I will put a new spirit within them[b]. I will remove the heart of stone from their flesh and give them a heart of flesh.
translation:
  language: zh_hans
  text: 我要赐给他们一颗心[a]，把新的灵放在他们里面[b]；我要从他们的肉体中除掉石心，赐给他们肉心。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一颗心”也可理解为“专一的心”，强调不分裂的忠诚。
    reason: lexical_alternative
  - marker: b
    text: 此处所给希伯来文本的字面形式是“在你们里面”；正文依照本节前后的人称，并参照以西结书36:26的近似平行经文，译作“在他们里面”。
    reason: textual_variant
lexical_decisions:
- source_word: לֵב אֶחָד
  choice: 一颗心
  rationale: לֵב指人的内在，包括意志、思想和倾向，不只是情感；אֶחָד直译为“一”。译作“一颗心”保留希伯来文的比喻和可能的含义，不在正文中径直解释为“专一的心”或“同心”。
- source_word: רוּחַ חֲדָשָׁה
  choice: 新的灵
  rationale: רוּחַ可指灵、风或气息；在内在更新的语境中，“灵”最合适，也避免用“心态”等解释性较强的词取代原文意象。
- source_word: בְּקִרְבְּכֶם
  choice: 在他们里面
  rationale: 所给文本的字面形式带第二人称复数后缀，可译“在你们里面”；但本节前后均用第三人称复数指“他们”，且以西结书36:26的近似平行经文也支持“他们”。正文按语境译为“在他们里面”，字面异读保留在脚注中。
- source_word: וַהֲסִרֹתִי
  choice: 除掉
  rationale: סור的使役式表示使某物离去或被移除；“除掉”自然地保留了使役意义。
- source_word: לֵב הָאֶבֶן
  choice: 石心
  rationale: 原文为“石头之心”。“石心”在现代汉语中简洁而有力，保留石头坚硬、无生命的具体比喻。
- source_word: מִבְּשָׂרָם
  choice: 从他们的肉体中
  rationale: בָּשָׂר本义为“肉、肉体”。此处处于石与肉的具体对比中，因此保留“肉体”，不泛化为“身体”。
- source_word: לֵב בָּשָׂר
  choice: 肉心
  rationale: 直译并保留“石心”与“肉心”的鲜明对照，不将其解释性改写为“柔软的心”或“顺服的心”，从而留下活力、柔软和可回应性等多重意蕴。
theological_decisions:
- issue: 内在更新的人论比喻
  choice: 正文分别保留“心”和“灵”两个相关但不相同的词。
  alternative: 把二者合并或改写为“思想”“态度”等心理学表达。
  rationale: 经文以“心”和“灵”描写上帝所施行的内在更新。保留两者可维持原文的神学层次，而不武断界定二者之间的关系。
- issue: “肉心”的比喻
  choice: 保留“肉心”这一具体比喻。
  alternative: 解释为“柔软的心”“有回应的心”或“顺服的心”。
  rationale: 原文有意把石头与肉相对照。直译能保留其张力和丰富意象，不把含义缩减为单一解释。
- issue: 上帝主动施行更新
  choice: 连续保留“我要赐给”“把……放在”“我要……除掉”“赐给”等第一人称主动表达。
  alternative: 改写为人自行改变心态，或以被动句弱化行动者。
  rationale: 原文反复以第一人称动词突出说话者主动施行更新；译文照此呈现，不进一步引申任何特定宗派的救恩论体系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保持原文连续的上帝第一人称行动；用“一颗心”“新的灵”“石心”“肉心”保存核心意象。脚注标记按其实际所注释的词语重新对应：关于“一颗心”的词义说明标为[a]，关于“在他们里面／你们里面”的文本问题标为[b]。
