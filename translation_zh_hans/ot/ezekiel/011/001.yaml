  text: וַ/תִּשָּׂ֨א אֹתִ֜/י ר֗וּחַ וַ/תָּבֵ֣א אֹ֠תִ/י אֶל שַׁ֨עַר בֵּית יְהוָ֤ה הַ/קַּדְמוֹנִי֙ הַ/פּוֹנֶ֣ה קָדִ֔ימָ/ה וְ/הִנֵּה֙ בְּ/פֶ֣תַח הַ/שַּׁ֔עַר עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ וָ/אֶרְאֶ֨ה בְ/תוֹכָ֜/ם אֶת יַאֲזַנְיָ֧ה בֶן עַזֻּ֛ר וְ/אֶת פְּלַטְיָ֥הוּ בֶן בְּנָיָ֖הוּ שָׂרֵ֖י הָ/עָֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/001.yaml
  text: Then the Spirit lifted me up and brought me to the east gate of the house of Yahweh[a], which faces eastward. And behold, at the entrance of the gate were twenty-five men, and I saw among them Jaazaniah son of Azzur and Pelatiah son of Benaiah[c][b], leaders of the people.
translation:
  language: zh_hans
  text: 随后，灵[a]把我举起，带我到雅威殿的东门，就是朝东的那门[b]。看哪，门口有二十五个人；我看见其中有亚述的儿子雅撒尼亚和比拿雅的儿子毗拉提，他们是百姓的首领[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一个灵把我举起”。希伯来词也可指“风”；但在以西结异象的上下文中，这里最可能指神圣之灵。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“雅威之家的门”，即圣殿的门。
    reason: cultural_note
  - marker: c
    text: “首领”也可译作“官长”或“统治者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: 灵
  rationale: 在以西结异象中，这个词最自然地指施行举起和运送的神圣之灵；中文用“灵”既符合上下文，也不以“上帝的灵”等增补彻底消除原词仍可能有的歧义。
- source_word: וַתִּשָּׂא אֹתִי
  choice: 把我举起
  rationale: 保留נשא所表达的向上动作及异象场景的鲜明感。
- source_word: וַתָּבֵא אֹתִי
  choice: 带我到
  rationale: 使役式בוא在这里表示“带到”，自然呈现运送的目的地。
- source_word: שַׁעַר בֵּית יְהוָה
  choice: 雅威殿的门
  rationale: “殿”在现代中文中自然指向圣殿，同时保留这是雅威之殿的关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现希伯来文本中的神圣名字。
- source_word: הַקַּדְמוֹנִי הַפּוֹנֶה קָדִימָה
  choice: 朝东的东门
  rationale: 保留原文对方位略显重复却具有空间强调的描述。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留先知叙事中引人注意、增强现场感的语篇标记。
- source_word: בְּפֶתַח הַשַּׁעַר
  choice: 门口
  rationale: 这是现代中文对该地点最自然简洁的表达。
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: 二十五个人
  rationale: 按语境所指为男性群体；现代中文“人”在计数结构中自然，并不改变其实际所指。
- source_word: בְּתוֹכָם
  choice: 其中
  rationale: 简洁自然地表达二人在这群人之中。
- source_word: שָׂרֵי הָעָם
  choice: 百姓的首领
  rationale: “首领”可涵盖统治者或官长的意思，又不暗示世袭王族身份。
theological_decisions:
- issue: 以西结异象中רוּחַ的身份
  choice: 正文译作“灵”，按上下文理解为神圣之灵
  alternative: 一个灵；风
  rationale: 异象上下文反复把רוּחַ描写为运送或推动先知的施事者，因此神圣之灵是最可能的理解；但中文正文不增添“上帝的”，并用脚注保留该词的词义幅度。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“看哪”保留先知异象叙事的现场感；人名采用通行圣经汉语形式。脚注标记依相关词语在正文中的出现顺序排列。
