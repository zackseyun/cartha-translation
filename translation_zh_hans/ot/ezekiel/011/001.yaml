revisions:
- from: 随后，灵[a]把我举起，带我到雅威殿朝东的东门[b]。看哪，门口有二十五个人；我看见其中有押朔的儿子雅撒尼亚和比拿雅的儿子毗拉提，二人都是百姓的首领[c]。
