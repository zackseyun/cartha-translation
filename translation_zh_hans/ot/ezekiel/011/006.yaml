  yaml_path: translation/ot/ezekiel/011/006.yaml
  text: You have multiplied your slain in this city and filled its streets with the slain[a][b].
translation:
  language: zh_hans
  text: 你们使这城中被杀的人增多，又使城里的街道满是被杀的人[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被杀的人”也可译作“死者”或“尸首”；原文所用的词特指遭暴力杀害的人。
    reason: lexical_alternative
  - marker: b
    text: “街道”也可译作“广场”或“公共空地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּיתֶם
  choice: 使……增多
  rationale: 这是רבה的使役形完成式，表达“使之变多”。“使……增多”保留使役和既成结果，也符合现代汉语表达。
- source_word: חַלְלֵיכֶם
  choice: 你们……被杀的人
  rationale: חָלָל指遭暴力杀害的人，不只是一般意义上的死者。希伯来语的第二人称复数所属后缀通过“你们使……被杀的人增多”体现为这些死者是他们造成的；若直译作“你们的被杀者”，现代汉语容易误解为他们自己一方的死者。
- source_word: בָּעִיר הַזֹּאת
  choice: 这城中
  rationale: 准确保留地点和指示语气，措辞简洁自然。
- source_word: וּמִלֵּאתֶם
  choice: 又使……满是
  rationale: מלא的加强形在这里表示“使充满”。“使……满是”自然呈现及物和结果含义，并与前句的使役表达协调。
- source_word: חוּצֹתֶיהָ
  choice: 城里的街道
  rationale: חוּצוֹת在城市语境中可指街道、广场或公共空地。“街道”最符合现代读者的通常理解；用“城里的”明确其第三人称阴性单数所属所指为这城。
- source_word: חָלָל
  choice: 被杀的人
  rationale: 单数形式在此作集合用语，与前面的同词复数保持词义呼应；译为“被杀的人”既自然，也保留暴力致死之意。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为避免“你们的被杀者”被误解为属于受责者一方的死者，将所属关系按语境自然表达为“你们使……被杀的人增多”；重复“被杀的人”以保留希伯来原文的词汇呼应。
