  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֨עַל֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל תּ֣וֹךְ הָ/עִ֑יר וַֽ/יַּעֲמֹד֙ עַל הָ/הָ֔ר אֲשֶׁ֖ר מִ/קֶּ֥דֶם לָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/023.yaml
  text: And the glory of Yahweh went up from the midst of the city and stood on the mountain that is east of the city[a][b].
translation:
  language: zh_hans
  text: 雅威的荣耀从城中央的上空升起[a]，停驻在城东面的那座山上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “升起”也可译作“上升”或“上去”。
    reason: lexical_alternative
  - marker: b
    text: “东面”原文也可能表示“前面”，具体取决于所采用的空间朝向。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 升起
  rationale: עלה表示“上去、上升”。“升起”既保留荣耀向上移动的具体图景，也符合异象叙事的庄严语气。
- source_word: כְּבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: 保留原文的所属结构；“荣耀”表达כָּבוֹד在本段中可见、彰显的神圣临在。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按原文直接音译四字神名，而不以“主”这一称号替代。
- source_word: מֵעַל תּוֹךְ הָעִיר
  choice: 从城中央的上空
  rationale: מֵעַל含“从……上方”，תּוֹךְ指“中间、中央”；此译保留了荣耀原在城中央上方的空间关系，较单译“从城中”更充分。
- source_word: וַיַּעֲמֹד
  choice: 停驻
  rationale: עמד基本义为“站立”；主语是移动中的荣耀，译作“停驻”自然表达其来到山上并停在那里，而不额外说明停留时长。
- source_word: עַל הָהָר
  choice: 在……那座山上
  rationale: הַר指山；定冠词表明是一座特定的山，但原文未在本节点名，故不补作专名。
- source_word: אֲשֶׁר מִקֶּדֶם לָעִיר
  choice: 城东面的
  rationale: 在地理描述中，מִקֶּדֶם最自然地指“在……以东”；同时以脚注保留其可能表示“在……前面”的空间含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；“雅威”是对应YHWH的现代汉语音译，可保留其作为专名的性质，避免用称号“主”取代。
- issue: “荣耀”的空间性与神圣临在
  choice: 按异象中的可移动显现来直译，不抽象化
  alternative: 将“荣耀”解释性改译为“同在”或“荣光”
  rationale: כְּבוֹד在上下文中作为行动主体升起并停驻；保留“荣耀”既忠于原文，也不预先限定这一显现的具体形态。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从城中央的上空”保留原文介词所表达的垂直位置；“停驻”比单纯的“站立”更适合以“荣耀”为主语，同时不增添原文没有的解释。
