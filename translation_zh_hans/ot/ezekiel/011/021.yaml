reference: Ezekiel 11:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶל לֵ֧ב שִׁקּוּצֵי/הֶ֛ם וְ/תוֹעֲבוֹתֵי/הֶ֖ם לִבָּ֣/ם הֹלֵ֑ךְ דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/021.yaml
  text: But as for those whose heart goes after their detestable things and their abominations[a], I have brought their way upon their own heads[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 至于那些心里追随自己可憎之物和可厌之事的人[a]，我必使他们所行的归到自己头上[b]。这是主雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“他们的心走向自己可憎之物和可厌之事的心”，表示他们从内心趋附这些事物。“可憎之物”一词常特指可憎的祭祀物或偶像。
    reason: 说明希伯来语特殊习语，并保留名词可能特指偶像的词义范围。
  - marker: b
    text: “归到自己头上”是指使他们亲自承担自己行为的后果。原文动词采用完成式，也可译作“我已经使……归到自己头上”；这里按上下文译为确定将要施行的审判。
    reason: 解释报应习语，并交代希伯来语完成式在先知语境中的时态歧义。
lexical_decisions:
- source_word: וְאֶל
  choice: 至于……的人
  rationale: 结合上文，本短语转而引出与蒙应许者相对的一类人；译作“至于”既体现话题转换，也保留语境中的对比意味。
- source_word: לֵב ... לִבָּם הֹלֵךְ
  choice: 一心追随
  rationale: 原文重复“心”，并使用“走向”的动态表达，表示内在倾向与忠诚。“一心追随”在现代汉语中自然，也保留心志主动趋附的意味；原文特殊结构另以脚注说明。
- source_word: שִׁקּוּצֵיהֶם
  choice: 自己可憎之物
  rationale: 该词常指令人憎恶的祭祀物或偶像，但词义不只限于偶像，因此采用较宽的“可憎之物”，避免把所指过早限定。
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: 可厌之事
  rationale: 该先知性用语涵盖礼仪和道德上令人厌恶的事物或行为。译作“可厌之事”，既与前项有所区别，也保留其强烈否定色彩。
- source_word: דַּרְכָּם
  choice: 他们所行的
  rationale: “道路”在希伯来语中常比喻人的行为方式；汉语“所行的”自然表达这里的行为含义，同时仍较为简洁。
- source_word: בְּרֹאשָׁם נָתַתִּי
  choice: 我必使……归到自己头上
  rationale: 这是报应临到行为者本人的惯用表达。“归到自己头上”保留原文的身体意象，并在汉语中清楚传达后果由本人承担。完成式在预言语境中的时态功能另以脚注说明。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主雅威说的
  rationale: נְאֻם是先知宣告公式；“这是……说的”庄重而自然。אֲדֹנָי译作“主”，יהוה按其专名性质音译为“雅威”，从而保留两个称谓的区别。
theological_decisions:
- issue: לֵב ... לִבָּם הֹלֵךְ所表达的内在归属
  choice: 一心追随
  alternative: 心走向……的心
  rationale: 不把该表达解释成某一特定心理学或宗教体系中的术语，而按希伯来习语表达内在趋向和忠诚；脚注保留其不寻常的字面形式。
- issue: שִׁקּוּצֵיהֶם是否明确译作“偶像”
  choice: 可憎之物
  alternative: 偶像
  rationale: 该词在以西结书中常有偶像崇拜背景，但其词义范围较“偶像”宽。正文保留较宽措辞，脚注提示其常见具体所指。
- issue: נָתַתִּי的时态与审判确定性
  choice: 我必使
  alternative: 我已经使
  rationale: 希伯来语采用完成式，既可突出行动的确定性，也可在先知话语中指向将来的执行。上下文偏向将来的审判，因此正文用“必”；脚注保留形式上的另一可能。
- issue: 复合称号אֲדֹנָי יְהוִה中的神名
  choice: 主雅威
  alternative: 主耶和华／主上帝
  rationale: 将יהוה作为专名音译，可与אֲדֹנָי“主”明确区分，并避免把两个不同的希伯来称谓合并。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“可憎之物／可厌之事”保留原文两个近义词的区分；“一心追随”使特殊的希伯来语心志习语在汉语中自然。“归到自己头上”保留原文鲜明意象，但以脚注明确其报应含义。
