source:
  edition: WLC
  text: וַ/תִּפֹּ֣ל עָלַ/י֮ ר֣וּחַ יְהוָה֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אֱמֹר֙ כֹּה אָמַ֣ר יְהוָ֔ה כֵּ֥ן אֲמַרְתֶּ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל וּ/מַעֲל֥וֹת רֽוּחֲ/כֶ֖ם אֲנִ֥י יְדַעְתִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/005.yaml
  text: 'And the Spirit of Yahweh fell upon me[a], and he said to me, “Say, ‘Thus says Yahweh: So you have said, O house of Israel, and I know the things that come up in your spirit.’”'
translation:
  language: zh_hans
  text: 耶和华的灵降在我身上，他对我说：“你要说：‘耶和华如此说：以色列家啊，你们是这样说的；你们灵里涌现的事[a]，我都知道。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们心里浮现的念头”；希伯来文直译“你们灵里升上来的事”。
    reason: 说明רוּחֲכֶם在此可按内在思想理解，同时交代מַעֲלוֹת的字面上升意象。
lexical_decisions:
- source_word: וַתִּפֹּל עָלַי
  choice: 降在我身上
  rationale: 保留נפל与עַל所呈现的“落下、降在……之上”的鲜明意象，同时符合中文先知叙事的表达习惯；比单纯译作“临到我”更能体现原文力度。
- source_word: רוּחַ יְהוָה
  choice: 耶和华的灵
  rationale: 在以西结的异象和先知受感语境中，רוּחַ指上帝的灵，而非自然界的风。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文圣经传统中通行的专名“耶和华”表达四字神名，保留其专名性质。
- source_word: אֱמֹר
  choice: 你要说
  rationale: 准确表达对先知的直接命令，现代中文自然清楚。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信公式的庄重形式，也贴近原文语序和措辞。
- source_word: כֵּן אֲמַרְתֶּם
  choice: 你们的确这样说了
  rationale: כֵּן承接并确认他们先前的话；“的确这样说了”既保留指回作用，也不额外判定其话是否正确。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 保留“家”这一具有群体和盟约色彩的称呼，并用“啊”明确呼语功能。
- source_word: וּמַעֲלוֹת רוּחֲכֶם
  choice: 你们灵里涌上来的事
  rationale: מַעֲלוֹת含“上升、升起”之意；“涌上来”保留这一空间隐喻。“灵”对应רוּחַ，避免直接将其解释为“思想”或“心思”。
- source_word: אֲנִי יְדַעְתִּיהָ
  choice: 我都知道
  rationale: 中文以“都”自然概括前面的复数性内容；不强行复制希伯来语阴性单数后缀的形式，却保留上帝对这些内在之事全然知晓的语义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；正文采用现代中文读者最熟悉、且明确作为专名的“耶和华”，不以“主”替代。
- issue: 首句רוּחַ的含义
  choice: 灵
  alternative: 风
  rationale: 本节处于先知异象和受感发言的语境，“耶和华的灵”最符合上下文；译作自然界的“风”会削弱这里的施动者和先知性功能。
- issue: “他对我说”中施动者的指向
  choice: 保留代词“他”
  alternative: 明确译作“耶和华对我说”或“灵对我说”
  rationale: 希伯来文动词只有阳性单数形式而未明说主语；中文保留“他”，不替原文消除“耶和华”与“耶和华的灵”之间可能存在的指称张力。
translation_notes:
  register: 采用庄重而明白的现代标准普通话。保留“降在我身上”“耶和华如此说”“以色列家”等先知文学的鲜明和正式色彩；正文不过度解释“灵”为“心思”，以脚注提供自然的语义替代。
