id: EZK.11.22
reference: Ezekiel 11:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׂא֤וּ הַ/כְּרוּבִים֙ אֶת כַּנְפֵי/הֶ֔ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/022.yaml
  text: Then the cherubim lifted up their wings[a], with the wheels beside them[b], and the glory of the God of Israel was above them.
translation:
  language: zh_hans
  text: 于是，基路伯举起翅膀，轮子也在它们旁边[a]；以色列上帝的荣耀在它们上方[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“轮子与它们相对”。这里的方位词可表示“在旁边”“相对”或“与之对应”；上下文表明轮子与基路伯一同移动。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在它们之上，从上面”，是强调荣耀位于它们上方的空间表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: 举起
  rationale: נשׂא在此以“翅膀”为宾语，表示基路伯把翅膀举起；“举起”自然且贴合上下文中的上升动作。
- source_word: הַכְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指异象中的复数天上活物；中文名词本身不标复数。
- source_word: כַּנְפֵיהֶם
  choice: 翅膀
  rationale: 直接表达“它们的翅膀”；中文可由主语明确所属，无须重复代词。
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: 轮子也在它们旁边
  rationale: 将וְ所连接的名词性描述明确译出；לְעֻמָּתָם在协调移动的异象中表示轮子处于与基路伯相应、相邻的位置。
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列上帝的荣耀
  rationale: 保留כבוד的标准神学用语“荣耀”，不扩写为“荣耀的临在”，并直接表达原文的属格结构。
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: 在它们上方
  rationale: 以自然中文表达荣耀位于基路伯和轮子上方；脚注说明原文附加的מִלְמָעְלָה所形成的强调。
theological_decisions:
- issue: 以西结宝座异象中כבוד所指的神圣显现
  choice: 以色列上帝的荣耀
  alternative: 以色列上帝荣耀的临在
  rationale: “荣耀”保留原词在以西结书及更广泛经文中的互文和神学分量，同时不把“可见的临在”这一语境含义直接加入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“于是”承接叙事进程；分号区分基路伯与轮子的动作场景和上帝荣耀的位置描述。代词“它们”用于非人的基路伯群体，也与轮子的异象语境相协调。
