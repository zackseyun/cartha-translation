  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִ/תּוֹכָ֔/הּ וְ/נָתַתִּ֥י אֶתְ/כֶ֖ם בְּ/יַד זָרִ֑ים וְ/עָשִׂ֛יתִי בָ/כֶ֖ם שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/009.yaml
  text: And I will bring you out from its midst[a], and I will give you into the hand of foreigners[b], and I will execute judgments on you.
translation:
  language: zh_hans
  text: 我要把你们从城中[a]带出去，把你们交在外族人的手中，并在你们身上施行审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从她中间”；阴性代词按上下文指耶路撒冷。
    reason: 说明代词所指及正文为清晰起见所作的显化。
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: 我要……带出去
  rationale: יצא的使役形表示“使出去、带出去”；译作“带出去”既保留使役含义，也符合现代汉语表达。
- source_word: מִתּוֹכָהּ
  choice: 从城中
  rationale: תּוֹךְ表示“内部、中间”，阴性单数后缀按上下文指耶路撒冷。汉语明确译出“城”，可避免“从她中间”造成误解。
- source_word: וְנָתַתִּי אֶתְכֶם בְּיַד
  choice: 把你们交在……的手中
  rationale: נתן与בְּיַד连用，表示把人交由另一方掌控；此译保留“手中”的希伯来语意象，也清楚表达受制于人的含义。
- source_word: זָרִים
  choice: 外族人
  rationale: זָרִים在此指异族或外国势力，而非仅仅陌生的人；“外族人”符合征服与审判的语境。
- source_word: וְעָשִׂיתִי בָכֶם שְׁפָטִים
  choice: 并在你们身上施行审判
  rationale: עשה + ב + שְׁפָטִים表示对某人实施审判性的处置。“在你们身上施行审判”保留介词意象与司法、惩罚色彩，又不把具体刑罚过度明说。
theological_decisions:
- issue: מִתּוֹכָהּ中阴性后缀的所指
  choice: 按上下文理解为耶路撒冷，并在正文译作“城中”
  alternative: 较形式对应地译作“从其中”或“从她中间”
  rationale: 前后文以耶路撒冷为所论之城。明确译出“城”没有改变所指，并能使独立诵读本节的现代读者准确理解。
- issue: שְׁפָטִים的复数及其惩罚含义
  choice: 译作“施行审判”
  alternative: 译作“施行刑罚”或“执行判决”
  rationale: “审判”保留原词既可指司法裁断、也可指审判行动或结果的语义张力；“刑罚”会更明确地限定为惩处结果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。重复“把你们”以对应原文连续的第一人称宣告，并保留“交在……手中”的希伯来语权势意象。
