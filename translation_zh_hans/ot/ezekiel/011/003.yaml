  text: הָ/אֹ֣מְרִ֔ים לֹ֥א בְ/קָר֖וֹב בְּנ֣וֹת בָּתִּ֑ים הִ֣יא הַ/סִּ֔יר וַ/אֲנַ֖חְנוּ הַ/בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/003.yaml
  text: who say[a], ‘It is not near to build houses. This city is the pot[b], and we are the meat.’
translation:
  language: zh_hans
  text: 他们说：“建造房屋还不是眼前的事[a]。这城是锅，我们就是肉。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文表达简略，也可译作“建造房屋的日子还没有临近”或“不会很快建造房屋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: 他们说
  rationale: 带定冠词的分词作名词用，承接上文所说的那些人；译作“他们说”符合现代汉语叙事表达。
- source_word: לֹא בְקָרוֹב
  choice: 还不是眼前的事
  rationale: 原文表达简略，字面意思为“不在近处／不临近”。此译保留对迫近性的否定，同时避免补入原文没有明说的“时候”。
- source_word: בְּנוֹת בָּתִּים
  choice: 建造房屋
  rationale: 直接表达不定式结构及其宾语；原文没有明确的反身含义，因此不增译“为自己”。
- source_word: הִיא הַסִּיר
  choice: 这城是锅
  rationale: 阴性代词按上下文指耶路撒冷城；明确译出“这城”可使比喻在汉语中清楚，而“锅”准确、自然。
- source_word: וַאֲנַחְנוּ הַבָּשָׂר
  choice: 我们就是肉
  rationale: בָּשָׂר在烹煮的比喻中自然译为“肉”；“就是”体现原句判断语气，又不额外解释比喻。
theological_decisions:
- issue: “锅与肉”这句俗语的用意
  choice: 保留比喻本身，不在正文中判定它是安全感的夸口还是对警告的讥讽。
  alternative: 明确解释为耶路撒冷像锅保护其中的肉，或明确解释为人们轻看审判迫近。
  rationale: 原句的比喻具有张力，其具体语用需由上下文呈现；译文不应替读者预先消解这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“眼前的事”自然表达“不临近”的意思；保留“锅”和“肉”的鲜明比喻，不作教派性解释。
