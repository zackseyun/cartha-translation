  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֕ם אֵ֣לֶּה הָ/אֲנָשִׁ֞ים הַ/חֹשְׁבִ֥ים אָ֛וֶן וְ/הַ/יֹּעֲצִ֥ים עֲצַת רָ֖ע בָּ/עִ֥יר הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/002.yaml
  text: And he said to me[a], “Son of man[b], these are the men who devise iniquity and give evil counsel in this city.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，这些人就是在这城里图谋罪孽[a]、献恶计[b]的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “图谋罪孽”或译“图谋邪恶”，也可理解为“图谋祸患”。
    reason: lexical_alternative
  - marker: b
    text: “献恶计”或译“提出邪恶的谋议”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 以现代汉语自然的叙事表达传达 wayyiqtol 的承接作用及间接宾语，不机械添加“然后”。
- source_word: בֶּן־אָדָם
  choice: 人子啊
  rationale: 这是《以西结书》中上帝对先知反复使用的称呼；保留希伯来语的形式及呼格语气，也与中文圣经传统相衔接。
- source_word: אֵלֶּה הָאֲנָשִׁים
  choice: 这些人就是……的人
  rationale: 指上下文中特定的一群男子；汉语“这些人”已能自然指明群体，无须生硬译作“这些男人”。判断句式保留 אֵלֶּה 的指认作用。
- source_word: הַחֹשְׁבִים אָוֶן
  choice: 图谋罪孽
  rationale: חשב 在此与 אָוֶן 连用，表示有意谋划，而不只是心中思想；“罪孽”保留其主要的道德含义，同时以脚注呈现“邪恶／祸患”的词义空间。
- source_word: וְהַיֹּעֲצִים עֲצַת־רָע
  choice: 出恶谋
  rationale: 希伯来语以动词与同根名词相连，强调主动谋划、献策；“出恶谋”简洁自然，并保留“谋”这一重复语义及负面性质。
- source_word: בָּעִיר הַזֹּאת
  choice: 在这城里
  rationale: 直接传达地点短语；置于两个并列分词结构之前，使其在汉语中自然地修饰整组行为，同时不排除原文末置短语主要贴近后一行为的句法可能。
theological_decisions:
- issue: 称呼 בֶּן־אָדָם 中 אָדָם 的译法
  choice: 人子啊
  alternative: 世人哪；凡人哪
  rationale: 在《以西结书》中这是贯穿全书的先知称呼。“人子”既贴近原文形式，又保留其反复出现所产生的文学与神学张力；译成“凡人”虽能凸显人的有限性，却会提前解释该称呼。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“人子啊”保持先知书呼语的传统与尊严；“图谋罪孽、出恶谋”形成紧凑的并列结构，传达原文两个分词短语的持续、主动行为。脚注标记均紧随其所说明的词组。
