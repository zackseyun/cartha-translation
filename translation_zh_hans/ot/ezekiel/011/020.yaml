  text: לְמַ֨עַן֙ בְּ/חֻקֹּתַ֣/י יֵלֵ֔כוּ וְ/אֶת מִשְׁפָּטַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֣וּ אֹתָ֑/ם וְ/הָיוּ לִ֣/י לְ/עָ֔ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/020.yaml
  text: so that they may walk in my statutes and keep my judgments and do them[a], and they will be my people, and I will be their God.
translation:
  language: zh_hans
  text: 使他们遵行我的律例，谨守并实行我的典章[a]。他们要作我的子民，我要作他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “典章”也可译作“裁断”或“法令”。希伯来语 מִשְׁפָּטִים 在盟约语境中可指司法裁断或规定的法令。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 使
  rationale: 引出目的或结果；结合前文，现代汉语用“使他们……”自然地保留其目的性。
- source_word: בְּחֻקֹּתַי יֵלֵכוּ
  choice: 遵行我的律例
  rationale: 直译“行在我的律例中”在现代汉语中较生硬；“遵行”传达הלך在盟约语境中按某种规范生活行事的含义，“律例”对应חֻקּוֹת。
- source_word: וְאֶת מִשְׁפָּטַי יִשְׁמְרוּ
  choice: 谨守我的典章
  rationale: שׁמר与法令连用表示遵守、持守；“谨守”兼顾慎重守持的语气。מִשְׁפָּטִים在此指盟约中的裁定或规定，译作“典章”，并以脚注保留“判例”的词义可能。
- source_word: וְעָשׂוּ אֹתָם
  choice: 并实行
  rationale: 保留原文在“谨守”之后另加强调实际履行；汉语省去宾语代词可避免与两个不同复数名词所指关系不清，同时仍表达付诸行动。
- source_word: וְהָיוּ לִי לְעָם
  choice: 他们要作我的子民
  rationale: 保留圣经中彼此归属的盟约公式；“要作”既自然又可表达未然的宣告。
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: 我要作他们的上帝
  rationale: 与前半句形成对称，忠实呈现盟约公式；אֱלֹהִים在此为单数意义。
theological_decisions:
- issue: 盟约公式的表达
  choice: 他们要作我的子民，我要作他们的上帝
  alternative: 他们必成为我的子民，我必成为他们的上帝
  rationale: 采用简洁对称的传统圣经表达，保留双方归属关系，不加入关于盟约性质或实现方式的额外解释。
- issue: לְמַעַן所表达的目的与结果
  choice: 使他们……
  alternative: 好叫他们……
  rationale: “使”自然承接前文上帝赐新心、新灵的行动，同时保留目的/结果之间原有的语义张力，不特别限定为纯目的或必然结果。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“律例—典章”保留原文两个法律术语的区别；“遵行—谨守—实行”再现原文从生活方式、持守到实际履行的递进。脚注标记[a]置于相关词语之后。
