source:
  edition: WLC
  text: חֶ֖רֶב יְרֵאתֶ֑ם וְ/חֶ֨רֶב֙ אָבִ֣יא עֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/008.yaml
  text: You have feared the sword[a], and I will bring the sword upon you[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 你们惧怕刀剑[a]，我必使刀剑临到你们[b]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“刀剑”；这里也可能广义指战争、杀戮或暴力的审判。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“你们惧怕刀剑，我就要把刀剑带到你们身上。”
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 该词本义为刀、剑，在先知审判语境中也可借指战争、杀戮或暴力审判。正文保留具体意象，并在前后两句重复，以再现希伯来文的修辞强调。
- source_word: יְרֵאתֶם
  choice: 你们惧怕
  rationale: 这是 ירא 的 Qal 完成式第二人称阳性复数。汉语“惧怕”自然表达其恐惧状态；时态由上下文体现，无须机械加入“已经”。
- source_word: וְחֶרֶב אָבִיא עֲלֵיכֶם
  choice: 我必使刀剑临到你们
  rationale: אָבִיא 是 בוא 的 Hiphil 未完成式第一人称单数，与 עַל 连用表示使某事临到某人。译作“使刀剑临到你们”既保留因果性的审判语气，也维持“刀剑”的重复。连接词 וְ 在汉语中可由上下句关系自然表达，不必硬译为“而且”。
- source_word: נְאֻם
  choice: 宣告
  rationale: 在先知公式中表示庄严的神谕或发言，以“这是……的宣告”呈现正式而自然。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי 译作“主”，四字神名 יְהוִה 依现代中文圣经传统译作“耶和华”，避免重复成“主主”，并保留复合称号。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”直接区分 אֲדֹנָי 与 יְהוִה，保留经文中的称号与专名，不以泛称“上帝”取代四字神名；同时采用普通中文读者较熟悉的形式。
- issue: “刀剑”是否解释为战争或暴力审判
  choice: 正文保留“刀剑”
  alternative: 战争；杀戮
  rationale: 原文有意重复 חֶרֶב。正文保留具体形象及其神学张力，不把可能的转喻义限定为某一种历史实现；脚注说明较广含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惧怕”保持先知责告的严肃语气；“使……临到”自然呈现审判公式。两次重复“刀剑”，对应希伯来文的显著重复。
