  text: לָ/כֵ֖ן הִנָּבֵ֣א עֲלֵי/הֶ֑ם הִנָּבֵ֖א בֶּן אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/004.yaml
  text: Therefore prophesy against them[a]; prophesy[b], son of man.
translation:
  language: zh_hans
  text: 因此，你要针对他们说预言[a]；人子啊，要说预言！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“论到他们”。希伯来文介词的含义可以更宽泛；但在本段责备和审判的语境中，“针对他们”更合适。
    reason: lexical_alternative
  - marker: b
    text: “人子”是《以西结书》中神对以西结一再使用的称呼，也可意译为“世人”或“必死的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的指控与审判，保留原文表示推论和结果的作用。
- source_word: הִנָּבֵא
  choice: 说预言
  rationale: 这是动词 נבא 的命令式；译作“说预言”自然清楚，也准确表达先知受命传达神谕。
- source_word: עֲלֵיהֶם
  choice: 攻击他们
  rationale: 介词 עַל 与“说预言”连用时既可表示“论到”，也可带有“攻击、反对”的意思；本段是责备和审判语境，因此正文采用“攻击他们”。
- source_word: הִנָּבֵא（重复）
  choice: 你要说预言
  rationale: 保留希伯来文的重复，以传达命令的强调和迫切性，不将其合并或省略。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中神对先知一贯的称呼；“人子”保留原文形式及经文之间的用语连贯性。
theological_decisions:
- issue: 如何翻译《以西结书》中的称呼 בֶּן אָדָם
  choice: 人子
  alternative: 世人；必死的人
  rationale: 该称呼突出先知作为人的身份。正文采用中文圣经传统且简洁的“人子”，以保留原文形式和互文连贯性；其他释义放入脚注，避免在正文中消解原文用语的张力。
- issue: עֲלֵיהֶם 的方向性
  choice: 攻击他们
  alternative: 论到他们
  rationale: 希伯来介词本身容许较宽泛的“论到”，但上下文是对耶路撒冷首领的责备和审判，因此“攻击他们”更符合本处语用；脚注保留另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两次“说预言”的重复和命令语气；末句加感叹号以体现强调。脚注标记均置于正文相关位置。
