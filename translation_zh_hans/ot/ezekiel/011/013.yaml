source:
  edition: WLC
  text: וַֽ/יְהִי֙ כְּ/הִנָּ֣בְאִ֔/י וּ/פְלַטְיָ֥הוּ בֶן בְּנָיָ֖ה מֵ֑ת וָ/אֶפֹּ֨ל עַל פָּנַ֜/י וָ/אֶזְעַ֣ק קוֹל גָּד֗וֹל וָ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כָּלָה֙ אַתָּ֣ה עֹשֶׂ֔ה אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/013.yaml
  text: And it happened[a], as I was prophesying, that Pelatiah son of Benaiah died. Then I fell on my face and cried out with a loud voice and said, “Ah, Lord GOD[b], will you make a complete end of the remnant of Israel?”
translation:
  language: zh_hans
  text: 我正说预言的时候，毗拉提——比拿雅的儿子——死了。于是我俯伏在地，放声呼喊说：“唉！主雅威[a]啊，你要把以色列的余民灭绝净尽吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“主 YHWH”；YHWH 是以色列之神的专名，常音译作“雅威”，传统译本也常作“耶和华”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“你正在把以色列的余民灭绝净尽吗？”原文可表达正在发生或即将发生的行动；原句也没有明写疑问词，其疑问语气由上下文判断。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּהִנָּבְאִי
  choice: 我正说预言的时候
  rationale: כְּ 加不定式构造及第一人称后缀表示时间关系；“正……的时候”自然呈现死亡发生在先知持续说预言期间。
- source_word: וּפְלַטְיָהוּ בֶן־בְּנָיָה מֵת
  choice: 毗拉提——比拿雅的儿子——死了
  rationale: מֵת 在这里叙述死亡事件；以插入语标明父子关系，既贴近希伯来语次序，也使现代汉语清楚自然。
- source_word: וָאֶפֹּל עַל־פָּנַי
  choice: 于是我俯伏在地
  rationale: “俯伏在地”是现代汉语对“倒在自己脸上”的自然表达，保留震惊、哀恸和恳求的姿态。
- source_word: וָאֶזְעַק קוֹל גָּדוֹל
  choice: 放声呼喊
  rationale: זעק 表示因危急或悲痛而强烈呼叫；“放声呼喊”简洁传达 קוֹל גָּדוֹל 的高声和情感力度。
- source_word: אֲהָהּ
  choice: 唉
  rationale: 该感叹词表达悲痛与惊惧；“唉”庄重而不古奥。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现 אֲדֹנָי“主”和神名 יהוה；“主耶和华”是普通中文读者熟悉且能区分两者的表达。
- source_word: כָּלָה ... עֹשֶׂה
  choice: 灭绝净尽
  rationale: 这是“造成彻底终结”的习语；“灭绝净尽”保留完全毁灭的力度，又符合本处关乎余民存亡的语境。
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: 以色列的余民
  rationale: “余民”保留 שְׁאֵרִית 所指灾后剩余、存留之人的重要语义和神学张力。
theological_decisions:
- issue: 复合称谓 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文采用中文圣经传统中广为人知的“耶和华”，同时用脚注说明原文是“主 YHWH”，避免把专名无声化为一般称号。
- issue: 末句是疑问、陈述还是惊叹
  choice: 你要把以色列的余民灭绝净尽吗？
  alternative: 你正在把以色列的余民灭绝净尽吗？／你竟要把以色列的余民灭绝净尽！
  rationale: 希伯来文没有显式疑问词，但在向神发出的惊惧哀求中，疑问读法最自然；“要”表达将临或迫近之事，而脚注保留现在进行意义的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“俯伏在地”“放声呼喊”避免生硬直译；破折号清楚标示“比拿雅的儿子”是对毗拉提身份的补充。末句保留先知在审判与余民存续之间的惊惧和恳求，不把原文含蓄的时态与疑问语气解释得过死。
