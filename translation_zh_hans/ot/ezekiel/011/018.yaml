base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/018.yaml
  text: They will come there and remove from it all its detestable things and all its abominations[a].
translation:
  language: zh_hans
  text: 他们必来到那里，除去其中一切可憎之物和一切可憎恶之事。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎之物”或译“偶像”；这个希伯来词常指可憎的偶像或与偶像崇拜有关的物品。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: 他们要来到
  rationale: 带连接词的Qal完成式在此先知性复兴语境中表达将来的结果；译为“要来到”自然地承接前文。
- source_word: שָׁמָּה
  choice: 那里
  rationale: 方向副词表示“那里／到那里”；与“来到”搭配时用“那里”符合现代汉语习惯，同时不明说其所指是地、城或境内。
- source_word: וְהֵסִירוּ
  choice: 除掉
  rationale: סור的Hiphil词形在此意为使某物离开，即清除、移除；“除掉”既自然，也体现彻底清除的语气。
- source_word: אֶת כָּל שִׁקּוּצֶיהָ
  choice: 其中一切可憎之物
  rationale: שִׁקּוּץ常指令人憎恶之物，并常用于偶像或拜偶像之物；正文保留较宽泛的“可憎之物”，避免把语义过早限定为偶像。“其中”自然表达阴性单数后缀所指的地点。
- source_word: וְאֶת כָּל תּוֹעֲבוֹתֶיהָ
  choice: 和一切可厌之事
  rationale: תּוֹעֵבָה是强烈的盟约与宗教伦理用语，可指可憎、可厌的事物或行为；“可厌之事”保留其分量，并与前面的具体“可憎之物”有所区分，而不擅自限定为行为。
- source_word: מִמֶּנָּה
  choice: 其中
  rationale: 介词加阴性单数后缀回指上下文中的地点；汉语以“除掉其中……”最为自然，准确传达“从它那里除去”的关系。
theological_decisions:
- issue: 是否将שִׁקּוּצִים明确译为偶像
  choice: 正文采用较宽泛的“可憎之物”
  alternative: 偶像；可憎的偶像
  rationale: 上下文强烈涉及偶像崇拜，因此“偶像”很可能是具体所指；但该希伯来词本身范围更广。正文不缩窄原文，脚注说明其常见的偶像含义。
- issue: 如何区分שִׁקּוּצֶיהָ与תּוֹעֲבוֹתֶיהָ
  choice: 分别译为“可憎之物”和“可厌之事”
  alternative: “可憎之物”和“可憎之事”；“偶像”和“可憎之事”
  rationale: 两个近义而不完全相同的强烈词语并列。译文既保持并列和语义重叠，也以“物／事”体现可能的侧重差异，但不把后一词硬性限定为某类罪行。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“他们要来到那里”保留原文的方向表达；“除掉其中……”避免生硬重复“从那里”。脚注标记已在正文中以[a]呈现。
