  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ וְ/קִבַּצְתִּ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/אָסַפְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצוֹתֶ֖ם בָּ/הֶ֑ם וְ/נָתַתִּ֥י לָ/כֶ֖ם אֶת אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/017.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: I will gather you from the peoples and assemble you from the lands where you have been scattered[b], and I will give you the land of Israel.’'
translation:
  language: zh_hans
  text: 所以你要说：“主耶和华[a]如此说：我要从万民[b]中招聚你们，从你们被分散到的各地把你们聚集起来，并把以色列的土地赐给你们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主耶和华”原文由“主”和神名יהוה组成；神名也可音译为“雅威”，作“主雅威”。
    reason: alternative_reading
  - marker: b
    text: “万民”也可译作“列国”或“各族之民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן אֱמֹר
  choice: 所以你要说
  rationale: לָכֵן承接上文并引出结论，译作“所以”；命令式אֱמֹר直译为“你要说”，保留对先知的直接吩咐。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留希伯来先知宣告中固定的使者公式，同时符合庄重、自然的现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达אֲדֹנָי“主”和神名יהוה；采用“主耶和华”可避免将两个词合并为单一称号。
- source_word: וְקִבַּצְתִּי אֶתְכֶם מִן הָעַמִּים
  choice: 我要从万民中招聚你们
  rationale: קבץ表示把分散的人招聚起来；עַמִּים是“诸民、万民”，此处不必强制解释为现代民族国家。
- source_word: וְאָסַפְתִּי אֶתְכֶם מִן הָאֲרָצוֹת
  choice: 从……各地把你们聚集起来
  rationale: אסף与前面的קבץ近义，译作“聚集起来”；אֲרָצוֹת在流散语境中指多个地域，译作“各地”比“各国”更贴近地理含义。
- source_word: אֲשֶׁר נְפֹצוֹתֶם בָּהֶם
  choice: 你们被分散到的
  rationale: 保留被动形式，不补明使人分散的行动者；“被分散到”也自然表达בָּהֶם所指的流散地点。
- source_word: וְנָתַתִּי לָכֶם אֶת אַדְמַת יִשְׂרָאֵל
  choice: 并把以色列的土地赐给你们
  rationale: נתן译作庄重但通俗的“赐给”；אַדְמָה在本段归回故土的语境中指土地，而不只是泥土或土壤。
theological_decisions:
- issue: 复合神圣称号אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 正文同时表达“主”这一称号和יהוה这一专名，不将二者压缩为一个普通称谓；脚注列出另一常见处理，避免把译名选择当作神学解释。
- issue: 流散的行动者
  choice: 保留“被分散”的无行动者被动表达
  alternative: 你们被上帝驱散
  rationale: 希伯来文本在本句未明说行动者；虽然上下文可能暗示神的审判，译文不在本节中擅自补明，以保留原文张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“招聚／聚集”保留原文两个近义动词的轻微变化；“各地”避免把古代地域概念过度现代化为民族国家。
