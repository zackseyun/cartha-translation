source:
  edition: WLC
  text: וְ/ר֣וּחַ נְשָׂאַ֗תְ/נִי וַ/תְּבִיאֵ֤/נִי כַשְׂדִּ֨ימָ/ה֙ אֶל הַ/גּוֹלָ֔ה בַּ/מַּרְאֶ֖ה בְּ/ר֣וּחַ אֱלֹהִ֑ים וַ/יַּ֨עַל֙ מֵֽ/עָלַ֔/י הַ/מַּרְאֶ֖ה אֲשֶׁ֥ר רָאִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/024.yaml
  text: Then the Spirit lifted me up and brought me to the exiles in Chaldea[a], in the vision by the Spirit of God[d][c][b]; and the vision that I had seen went up from me.
translation:
  language: zh_hans
  text: 随后，灵把我举起，在异象中，借着上帝的灵[b]将我带到迦勒底的被掳之民那里[a]；我所见的异象就从我身上升去了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被掳之民”原文为集合性单数，也可译作“被掳的群体”。
    reason: lexical_alternative
  - marker: b
    text: “借着上帝的灵”也可译作“在上帝的灵里”；原文介词既可表示媒介，也可表示所处的范围。
    reason: alternative_reading
  - marker: c
    text: “升去了”也可意译为“离开了我”；原文直译为“从我身上上升”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְר֣וּחַ
  choice: 随后，灵
  rationale: רוּחַ可指灵、风或气息；本节处于以西结受异象带领的语境，且下文明确说“上帝的灵”，故译作“灵”。连接词按叙事推进译作“随后”。
- source_word: נְשָׂאַתְנִי
  choice: 把我举起
  rationale: נשא兼有举起、携带之义；“举起”保留异象中向上移动的具体意象。
- source_word: וַתְּבִיאֵנִי
  choice: 将我带到
  rationale: בוא的使役形表示使之来到，即“带到”。
- source_word: כַשְׂדִּימָה
  choice: 到迦勒底
  rationale: 方向词尾表明朝向迦勒底地区移动；采用传统且准确的地名“迦勒底”，不改释为“巴比伦尼亚”。
- source_word: אֶל הַגּוֹלָה
  choice: 被掳之民那里
  rationale: הַגּוֹלָה可指被掳状态，也可集合性地指被掳群体；此处是以西结所归回的群体，故译为“被掳之民”。
- source_word: בַּמַּרְאֶה
  choice: 在异象中
  rationale: מַרְאֶה在先知叙事中指异象经历；介词ב表达所处范围。
- source_word: בְּרוּחַ אֱלֹהִים
  choice: 借着上帝的灵
  rationale: 介词ב在此可表示媒介或所处范围；正文采用较符合异象运作语境的媒介义“借着”，同时以脚注保留“在……灵里”的可能。
- source_word: וַיַּעַל מֵעָלַי
  choice: 就从我身上升去了
  rationale: עלה与מֵעָלַי共同保留异象从先知身上向上离去的空间图像；“升去了”比单纯“离开”更贴近原文。
- source_word: הַמַּרְאֶה אֲשֶׁר רָאִיתִי
  choice: 我所见的异象
  rationale: 自然表达关系从句，同时保留מַרְאֶה与ראה的“异象—看见”联系。
theological_decisions:
- issue: רוּחַ应译作非人格性的“风”，还是与上帝有关的“灵”
  choice: 两处均译为“灵”，第二处明确译为“上帝的灵”
  alternative: 风；气息
  rationale: 上下文描述先知在异象中被带走，并以“上帝的灵”说明这一经历；译作“灵”最符合近处语境，但不进一步加入原文没有说明的位格性称谓。
- issue: בְּרוּחַ אֱלֹהִים中的介词ב表示媒介还是范围
  choice: 借着上帝的灵
  alternative: 在上帝的灵里
  rationale: 媒介义与灵带领先知的叙事情境相合；但希伯来语也容许范围义，因此在脚注中保留另一读法。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“被掳之民”兼顾集合含义与中文自然度；“从我身上升去了”刻意保留原文略显奇特的异象空间意象，不将其平化为单纯“异象结束了”。
