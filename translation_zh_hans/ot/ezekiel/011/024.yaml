  naturalness: 原文“；这是在异象中，借着上帝的灵。”在现代汉语中是一个较突兀且不完整的独立分句；改为状语置于“将我带到”之前，行文自然、庄重。删去“然后”也避免与开头“随后”重复推进。
  terminology: “灵”“上帝的灵”“迦勒底”“被掳之民”“异象”均适切，并保留了原文对首个“灵”与“上帝的灵”的措辞差异。“从我身上升去了”忠实保留向上离去的空间意象。
