  to: 随后，灵把我举起，在异象中，借着上帝的灵[b]将我带到迦勒底的被掳之民那里[a]；我所见的异象就从我身上升去了[c]。
  rationale: 仅作句法与行文调整：把原本突兀的独立分句并入其所修饰的“带到”动作，删除重复的叙事连接语。其余关键词、异象的空间意象及全部脚注均保留。
