  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 又临到
  rationale: וַיְהִי在这里引出叙事中的下一次启示；与דְבַר־יְהוָה合译为汉语先知书中自然而庄重的公式“耶和华的话又临到……”，既表达承接关系，也避免生硬译作“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在构词词组דְבַר יְהוָה中，指来自耶和华的启示性言语；“话”准确保留先知性公式及其与言说的联系，比“信息”更贴近原文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法“耶和华”，将四字神名作为专名呈现，而不以“主”这一称号替代。
- source_word: אֵלַי
  choice: 到我
  rationale: 介词אֶל加第一人称单数词尾表示话语临到先知；汉语在“临到我”中已自然表达其方向。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接引语；译作“说”简洁自然，并以冒号提示下文内容。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文以中文长期通行且普通读者易识别的专名“耶和华”呈现，不用称号“上主”代替；“雅威”则是另一种较接近学术重构发音的音译。
translation_notes:
  register: 采用现代、庄重且易懂的先知书语体。“耶和华的话又临到我”保留希伯来文固定启示公式；句末用“说：”自然衔接下一节的直接引语。
