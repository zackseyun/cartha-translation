id: EZK.11.10
reference: Ezekiel 11:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/חֶ֣רֶב תִּפֹּ֔לוּ עַל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפּ֣וֹט אֶתְ/כֶ֑ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/010.yaml
  text: You will fall by the sword; I will judge you at the border of Israel[a], and you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 你们必倒在刀下；我要在以色列的边界[a]审判你们，你们就会知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在以色列的边界上。”希伯来语可指在以色列边界所在之处。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: 倒在刀下
  rationale: 介词 בְּ 在这里表示手段；“倒在刀下”既保留“刀”的具体意象，也以自然汉语表达被杀的含义。
- source_word: תִּפֹּלוּ
  choice: 必倒下
  rationale: נפל 的基本义是“倒下”；译文用“必倒在刀下”，保留原文意象，不直接改释为“死亡”。
- source_word: עַל גְּבוּל יִשְׂרָאֵל
  choice: 在以色列的边界
  rationale: גְּבוּל 可指边界、疆界或地域；与 עַל 连用时，此处最自然地表示在边界处。译文保留地点含义，并以脚注提示“边界上”这一同样可能的表达。
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: 我要审判你们
  rationale: שׁפט 在此直接表示施行审判；上下文已显明惩罚性质，无须扩译。
- source_word: וִידַעְתֶּם
  choice: 你们就会知道
  rationale: 连接词与该动词形式在本语境中有将来及结果意味；“就会知道”是自然汉语，也显出审判所带来的认识结果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为专名的性质，而不以“主”等称号替代。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近现代学界对该名的常见拟音，也明确将其作为专名呈现。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“倒在刀下”保留先知审判宣告的具体意象；分号呈现两个紧密相连的审判行动。
