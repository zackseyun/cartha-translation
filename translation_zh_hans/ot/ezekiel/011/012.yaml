source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֤ר בְּ/חֻקַּ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וּ/מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם עֲשִׂיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/012.yaml
  text: Then you will know that I am Yahweh[a], in whose statutes you have not walked, and whose judgments you have not carried out, but you have acted according to the judgments of the nations that are around you.
translation:
  language: zh_hans
  text: 这样，你们就必知道我是雅威：你们没有按我的律例行事，也没有实行我的典章，反倒照着你们周围各国的典章[a]行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“反倒照着你们周围各国的习俗行事。”这里译作“典章”的希伯来词，在此语境中也可指那些国家所遵循的惯例或习俗。
    reason: 保留 מִשְׁפָּט 在末一分句中可能具有“惯例、习俗”之义的词汇歧义。
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: 这样，你们就知道
  rationale: 该词是带连接词的第二人称复数完成式；在先知宣告审判后果的语境中具有将来及结果意味。“这样……就”自然表达了这一承接关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神圣约名字的专名性质。
- source_word: בְּחֻקַּי לֹא הֲלַכְתֶּם
  choice: 你们没有按我的律例行事
  rationale: “按……行事”自然传达希伯来语“在律例中行走”的生活行为含义，同时保留其圣约伦理色彩。
- source_word: חֻקַּי
  choice: 我的律例
  rationale: “律例”适合表达 חֹק 在法律与圣约语境中的既定规定，并与下文 מִשְׁפָּט 的“典章”有所区分。
- source_word: וּמִשְׁפָּטַי לֹא עֲשִׂיתֶם
  choice: 也没有实行我的典章
  rationale: “实行”对应 עשה 的施行、履行之意；“典章”表达 מִשְׁפָּט 在此处所指的法律规范。
- source_word: מִשְׁפָּטַי / כְמִשְׁפְּטֵי
  choice: 典章
  rationale: 两处采用同一译词，以保留原文 מִשְׁפָּט 的词汇重复；末一处也可能指各国通行的习俗，故以脚注说明。
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם
  choice: 反倒照着……各国的典章行事
  rationale: 连接词在上下文中构成转折，对比百姓不遵行雅威的规定、却仿效列国；“照着……行事”自然表达 כְּ 与 עשה 的组合。
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: 你们周围各国
  rationale: 简洁而完整地表达“在你们四周的列国”，所指是邻近的外邦民族。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按现代学界通常重构的读音音译，保留其专名与圣约意义。
- issue: אֲשֶׁר 与后续指控的句法关系
  choice: 以冒号引出对百姓行为的说明
  alternative: 译作“因为你们没有……”或“你们没有遵行其律例的那一位”
  rationale: אֲשֶׁר 在此可理解为关系性、说明性或带因由意味。冒号既让中文通顺，也避免把其功能过度限定为单一因果解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“按……行事”避免生硬直译“在律例中行走”，同时保留生活实践的含义；两次“典章”保留原文关键词的重复，并用脚注呈现末次用词的语义弹性。
