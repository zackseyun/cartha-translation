  text: וָ/אֲדַבֵּ֖ר אֶל הַ/גּוֹלָ֑ה אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֥ר הֶרְאָֽ/נִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/025.yaml
  text: Then I spoke to the exiles all the words of Yahweh that he had shown me[a].
translation:
  language: zh_hans
  text: 于是，我把雅威指示我的一切话都告诉了被掳的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“被掳者”，是单数集合名词，指被掳流亡的群体。
    reason: 说明原文集合单数的用法。
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: 于是，我……告诉了
  rationale: 连词加未完成式连续形推动叙事向前；“于是”自然表达承接关系。דבר 与 אֶל 在此译作“告诉”，比逐字译为“对……说”更符合现代汉语，同时保留传达信息的含义。
- source_word: הַגּוֹלָה
  choice: 被掳的人
  rationale: 该阴性单数名词在这里是集合用法，指被迁徙、流亡的群体；“被掳的人”既符合以西结书的历史处境，也便于普通读者理解。
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: 雅威……的一切话
  rationale: 保留“话”的复数整体含义及启示、宣告的性质；中文语序把所属关系与后面的关系从句合并处理。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号代替。
- source_word: אֲשֶׁר הֶרְאַנִי
  choice: 指示我的
  rationale: ראה 的使役形直义为“使我看见、给我看”；在异象启示的语境中，“指示”既自然，又保留神让先知看见并领受内容的意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以专名音译呈现，不用“主”这一称号替代；“耶和华”虽为传统译名，但较不贴近通常重建的读音。
- issue: “话”与“指示”搭配所表达的启示方式
  choice: 雅威指示我的一切话
  alternative: 雅威让我看见的一切事；雅威给我看的这一切话
  rationale: 原文确实把“话”与“使看见”连用，可能涵盖异象中所启示的信息。译文保留“话”，并用“指示”避免生硬，却不把内容限定为单纯言语或单纯景象。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”衔接前文叙事；“告诉了被掳的人”清楚呈现先知向流亡群体转述启示的行动。
