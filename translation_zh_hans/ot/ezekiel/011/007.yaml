revisions:
- from: 所以，主耶和华如此说：“你们放在城中的被杀之人就是肉[a]，这城就是锅；至于你们，他必把你们从城中带出去。”
  to: 所以，主耶和华如此说：“你们所放在城中的被杀之人就是肉[a]，这城就是锅；至于你们，我必把你们从城中带出去[b]。”
  rationale: 修订仅处理末句的人称表达和一个中文修饰关系。正文依照神谕语境译为“我必”，同时用脚注明确保留希伯来语动词表面第三人称形式这一语法难点；其余比喻、神名和空间指称均维持原意。
