base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/007.yaml
  text: 'Therefore thus says Lord Yahweh: Your slain whom you have placed in its midst—they are the meat[a], and it is the pot; but you I will bring out from its midst.'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：“你们所放在城中的被杀之人就是肉[a]，这城就是锅；至于你们，我必把你们从城中带出去[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “肉”也可译作“血肉”或“肉身”；在这里“肉”更贴合“锅”的烹煮比喻。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本此动词的形式为第三人称阳性单数；在“主耶和华如此说”的神谕中，通常理解为说话者的自指行动，故译为“我必”。
    reason: textual_grammar
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: “主”对应 אֲדֹנָי，“耶和华”采用现代中文读者熟悉的神名形式来对应四字神名 יְהוִה，并避免译成重复的“主主”。
- source_word: חַלְלֵיכֶם
  choice: 你们……的被杀之人
  rationale: 保留该词特指遭杀戮者的含义，不泛化为一般的“死人”，同时使中文表达庄重自然。
- source_word: בְּתוֹכָהּ / מִתּוֹכָהּ
  choice: 在城中／从城中
  rationale: 阴性单数后缀所指为耶路撒冷。中文直接点明“城”，既消除不自然的阴性代词，又保持空间关系和锅的比喻。
- source_word: הֵמָּה הַבָּשָׂר
  choice: 就是肉
  rationale: בָּשָׂר 可指肉或血肉；“肉”在中文中自然承接烹煮之锅的意象，同时仍保留原词的基本语义。
- source_word: הַסִּיר
  choice: 锅
  rationale: 采用简明常用的烹饪器皿名称，直接保留上下文中的锅与肉之比喻。
- source_word: הוֹצִיא
  choice: 他必把你们……带出去
  rationale: 希伯来语为使役词干第三人称阳性单数，直译为“他必使你们出去／带你们出去”。中文保留其第三人称形式，不将其默改为第一人称。
theological_decisions:
- issue: 锅与肉的比喻
  choice: 直接保留“被杀之人就是肉，这城就是锅”
  alternative: 将比喻解释为城内死者受到保护或被困其中
  rationale: 原文借此回应前文领袖所说的锅与肉之喻，但本节本身不展开全部含义；直译能保留其反转效果和神学张力。
- issue: 末句主语的人称
  choice: 他必把你们从城中带出去
  alternative: 我必把你们从城中带出去
  rationale: 马所拉文本 הוֹצִיא 的形态是第三人称阳性单数。即使神谕语境可使读者理解行动者为耶和华，译文仍保留原文显明的人称，不替原文消解这一转换。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“放在城中”比“置于其中”更自然；分号和“至于你们”突出被杀者与仍活着的领袖之间的对照。
