source:
  edition: WLC
  text: לָ/כֵן֩ הִנָּבֵ֨א וְ/אָמַרְתָּ֜ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י פֹתֵ֜חַ אֶת קִבְרֽוֹתֵי/כֶ֗ם וְ/הַעֲלֵיתִ֥י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּ֑/י וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/012.yaml
  text: 'Therefore prophesy and say to them[a], ‘Thus says the Lord GOD: Behold, I am opening your graves and will bring you up from your graves, my people[b], and I will bring you into the land of Israel.’'
translation:
  language: zh_hans
  text: 因此，你要说预言，对他们说：“主耶和华如此说：看哪，我要打开你们的坟墓，并要使你们从坟墓中上来[a]，我的子民啊[b]；我要领你们进入以色列地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使你们从坟墓中升上来”。希伯来文直译为“使你们从坟墓中上去”。
    reason: lexical_alternative
  - marker: b
    text: “打开坟墓”的图像在本段首先指向以色列从被掳和民族死亡般的处境中复兴归回，同时也与后来关于复活的盼望彼此呼应；本节本身没有把两者之间的关系完全说明。
    reason: cross_reference
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接前面的异象和命令，保留推论关系，同时符合现代汉语表达。
- source_word: הִנָּבֵא
  choice: 说预言
  rationale: 这是对以西结所用的命令式；“说预言”直接表达先知受命宣告信息的行动。
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 对他们说
  rationale: 忠实保留先知宣告的引介语，措辞自然清楚。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留希伯来先知信息中惯用而庄重的使者公式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 同时呈现 אֲדֹנָי 与神名 יהוה，并采用简体中文圣经语境中清楚、庄重且广为人知的表达。
- source_word: הִנֵּה אֲנִי
  choice: 看哪，我要
  rationale: “看哪”保留强调和庄严语气；结合后续行动，以“我要”自然表达即将实施的神圣作为。
- source_word: פֹתֵחַ
  choice: 打开
  rationale: 准确传达开启坟墓的具体图像；与“我要”连用，体现分词在 הִנֵּה 结构中的鲜明、临近意味。
- source_word: קִבְרוֹתֵיכֶם
  choice: 你们的坟墓
  rationale: “坟墓”是 קבר 在本段图像中最直接、自然的现代汉语对应词。
- source_word: וְהַעֲלֵיתִי אֶתְכֶם מִקִּבְרוֹתֵיכֶם
  choice: 我要使你们从坟墓中上来
  rationale: 保留使役词形和“向上”的具体空间意象，不用“复活”来提前限定其神学含义。
- source_word: עַמִּי
  choice: 我的子民啊
  rationale: 按呼格处理，既表达直接称呼，也保留盟约群体的亲属和归属意味。
- source_word: וְהֵבֵאתִי אֶתְכֶם
  choice: 领你们进入
  rationale: ביא 的使役式表示带领或带到某地；在中文中与“进入以色列地”搭配自然。
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: 进入以色列地
  rationale: 这里的 אֲדָמָה 指以色列的土地或疆土；“以色列地”准确且符合复归语境。
theological_decisions:
- issue: 打开坟墓并从坟墓中上来的意象性质
  choice: 正文保留具体、近似复活的坟墓意象，同时不把它限定为单纯的民族复归或完整的末日肉身复活教义。
  alternative: 可理解为纯粹比喻性的被掳归回，或理解为对个人肉身复活的直接预言。
  rationale: 本节位于以色列复兴的神谕中，却有意使用打开坟墓和从中上来的鲜明语言。直译核心意象能保存文本本身的神学张力。
- issue: עַמִּי 的位置与功能
  choice: 译作呼语“我的子民啊”，置于相关应许之前，使现代汉语自然清楚。
  alternative: 按希伯来语序译为“使你们从坟墓中上来，我的子民啊”。
  rationale: 希伯来文可视为呼格或同位称呼。调整到汉语自然位置，不改变神对以色列的盟约称谓，也避免生硬歧义。
translation_notes:
  register: 采用现代、庄重、易懂的普通话书面语。“主耶和华如此说”和“看哪”保留先知宣告的典雅节奏；其余句法尽量自然。“我的子民啊”前置到应许内部较自然的位置，以清楚呈现呼语功能。
