  text: וְ/נָתַתִּ֨י רוּחִ֤/י בָ/כֶם֙ וִ/חְיִיתֶ֔ם וְ/הִנַּחְתִּ֥י אֶתְ/כֶ֖ם עַל אַדְמַתְ/כֶ֑ם וִ/ידַעְתֶּ֞ם כִּי אֲנִ֧י יְהוָ֛ה דִּבַּ֥רְתִּי וְ/עָשִׂ֖יתִי נְאֻם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/014.yaml
  text: I will put my Spirit within you[a], and you will live, and I will settle you on your own land. Then you will know that I am Yahweh. I have spoken, and I have done it, declares Yahweh.
translation:
  language: zh_hans
  text: 我要把我的灵放在你们里面[a]，你们就会活过来；我要使你们安居在自己的土地上。这样，你们就知道我是雅威。我已经说了，也已经做成了。这是雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“气息”或“风”。这里的希伯来词兼有这些含义；以西结书第37章有意让这些意思彼此呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: 我的灵
  rationale: רוּחַ可指风、气息或灵；本章有意运用这一语义范围。此处带第一人称单数后缀“我的”，且由雅威赐下，译作“我的灵”最自然，同时用脚注保留“气息”和“风”的回响。
- source_word: וִחְיִיתֶם
  choice: 你们就会活过来
  rationale: חיה可表示活着或恢复生命。上下文是枯骨复生，“活过来”在现代汉语中自然清楚，也不排除民族复兴的象征意义。
- source_word: וְהִנַּחְתִּי אֶתְכֶם עַל אַדְמַתְכֶם
  choice: 我要使你们安居在自己的土地上
  rationale: 使役形式表达使其停歇、安置或定居；“使你们安居”兼顾被安置与安稳居住的含义，符合复兴归回的语境。
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: 这样，你们就知道我是雅威
  rationale: 连接词在这里带结果和次序意味；“这样……就”符合现代汉语，并清楚呈现复兴行动所带来的认识。
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: 我说了，也必成就
  rationale: 两个完成式以已然措辞强调神言语和行动的确定性。汉语用“我说了，也必成就”自然表达先知性确定，同时避免让尚待实现的应许听来已经在历史中完成。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: 这是标准的先知宣告公式；该译法庄重、清楚，并保留其权威性。
theological_decisions:
- issue: רוּחִי应译为较具神学位格意味的“我的灵”，还是较具生命气息意味的“我的气息”
  choice: 我的灵
  alternative: 我的气息；我的风
  rationale: 本章刻意让רוּחַ的“风、气息、灵”诸义彼此回响。此处的“我的”及赐予行动支持“我的灵”，但脚注明确保留其他可能，避免消除原文张力。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，不以称号取代。
- issue: 完成式דִּבַּרְתִּי וְעָשִׂיתִי所表达的时间与确定性
  choice: 我说了，也必成就
  alternative: 我已经说了，也已经成就了；我说过，也做成了
  rationale: 希伯来语完成式可将雅威必然实行之事表述为确定事实。中文采用“必成就”突出应许的确定性，又不武断断定听者所处时点上事情已经全部实现。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“活过来”呼应枯骨复生的直接图景；“安居”兼顾安置和安稳。神名统一译作“雅威”。
