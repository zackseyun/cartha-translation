source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ הַ/גּוֹיִ֔ם כִּ֚י אֲנִ֣י יְהוָ֔ה מְקַדֵּ֖שׁ אֶת יִשְׂרָאֵ֑ל בִּ/הְי֧וֹת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/028.yaml
  text: Then the nations will know that I am Yahweh who sanctifies Israel[c][b][a], when my sanctuary is in their midst forever.
translation:
  language: zh_hans
  text: 当我的圣所永远在他们中间[c]时，列国就会知道[a]：我是使以色列成圣的雅威[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“列国也会知道”。原文句首的连词可直译为“并且”，但在这里也可带有承接前文应许、表示结果的意味。
    reason: lexical_alternative
  - marker: b
    text: 或译“使以色列分别为圣”。
    reason: lexical_alternative
  - marker: c
    text: 或译“在他们当中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 就会知道
  rationale: 连词与完成式在先知性语境中表达前述复兴应许所带来的结果；“就会知道”自然呈现其将来及结果意味。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 此词在《以西结书》中通常指以色列以外的各民族；“列国”简洁而符合先知文学语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按原文将四字神名作为专名音译，避免以称号取代名字。
- source_word: מְקַדֵּשׁ
  choice: 使……成为圣洁的那一位
  rationale: 分词表达雅威持续而具特征性的作为；此译保留“使之圣洁”的使役含义，也与本节的圣所主题相呼应。
- source_word: מִקְדָּשִׁי
  choice: 我的圣所
  rationale: מִקְדָּשׁ指神圣之处或圣所，范围不必限定为某一种建筑，故不译作较具体的“圣殿”。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 表达雅威的圣所在群体当中的临在，保留具体的群体性和空间性。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 在复兴应许的语境中，这是自然直接的时间表达。
- source_word: בִּהְיוֹת
  choice: 当……时
  rationale: 介词ב与动词היה的不定词构式表示列国认识雅威时所处的时间或情境；“当……时”保留这一关系而不强行改作因果关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其作为以色列之神立约名字的性质，而不以称号替代。
- issue: מְקַדֵּשׁ 对以色列所表达的作用
  choice: 使以色列成为圣洁
  alternative: 使以色列分别为圣／将以色列分别出来归为圣
  rationale: 选择通顺的现代汉语，同时保留使役意义及圣洁主题，不将其缩限为礼仪性的奉献或祝圣。
- issue: בִּהְיוֹת 所表达的逻辑关系
  choice: 当……时
  alternative: 因为／由于
  rationale: 该构式可表达时间或伴随情境；采用“当……时”避免把原文未明确规定的因果关系强加于经文。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“列国”“圣所”保留先知文学及圣洁主题所需的经文语感；调整从句次序，使“当……时”的结构在现代汉语中自然，同时不改变原文各成分的关系。
