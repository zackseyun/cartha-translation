  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַבְדִּ֤/י דָוִד֙ מֶ֣לֶךְ עֲלֵי/הֶ֔ם וְ/רוֹעֶ֥ה אֶחָ֖ד יִהְיֶ֣ה לְ/כֻלָּ֑/ם וּ/בְ/מִשְׁפָּטַ֣/י יֵלֵ֔כוּ וְ/חֻקֹּתַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֥וּ אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/024.yaml
  text: My servant David will be king over them[a], and there will be one shepherd for all of them. They will walk in my judgments[b], and they will keep my statutes and do them.
translation:
  language: zh_hans
  text: 我的仆人大卫必作他们的王[a]；他们众人必有一位牧者[b]。他们必遵行我的典章，谨守并实行我的律例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“大卫”可以按字面理解为大卫，也可以指将来的大卫家君王，或按预表理解为弥赛亚；译文保留原文称呼，不在正文中判定。
    reason: alternative_reading
  - marker: b
    text: 或译：“他必作他们众人的一位牧者。”希伯来文也可理解为“牧者”一句直接指前述的大卫。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: עֶבֶד可指仆人或奴仆；在此作为上帝对大卫的尊称，强调其受委任和归属关系。“我的仆人”既自然庄重，也不额外突出奴役身份。
- source_word: דָוִד
  choice: 大卫
  rationale: 按现代汉语圣经人名的通行译法音译，并保留原文人名，不在正文中加入解释。
- source_word: מֶלֶךְ עֲלֵיהֶם
  choice: 作他们的王
  rationale: מֶלֶךְ明确指“王”；עַל加代词后缀表达治理他们。汉语“作他们的王”自然地传达王权关系。
- source_word: וְרֹעֶה אֶחָד יִהְיֶה לְכֻלָּם
  choice: 他们众人必有一位牧者
  rationale: 保留רֹעֶה“牧者”的牧养及君王意象，并以自然汉语表达所有人同属一位牧者。希伯来语也可能理解为前述大卫“作他们众人的一位牧者”，故以脚注说明。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּט在立约和律法语境中可指判例、法令或规范。“典章”保留法律性，也能与下文“律例”形成相关但有区别的搭配。
- source_word: יֵלֵכוּ
  choice: 遵行
  rationale: הלך字面为“行走”，在此比喻生活行为。现代汉语“遵行我的典章”清楚传达按其规范而行，比直译“行走在……中”更自然。
- source_word: חֻקֹּתַי
  choice: 我的律例
  rationale: חֻקּוֹת指制定的法规或条例；“律例”庄重易懂，并保留其立约法律色彩。
- source_word: יִשְׁמְרוּ
  choice: 谨守
  rationale: שׁמר在律法语境中指持守、遵守。“谨守”既表达持续遵守，也保留认真看守的语感。
- source_word: וְעָשׂוּ אוֹתָם
  choice: 并实行
  rationale: עשה加宾语代词强调把律例付诸行动。“实行”在汉语中自然承接“谨守”，也保留实际履行之意。
theological_decisions:
- issue: 复兴预言中“大卫”的身份
  choice: 正文保留“大卫”，不作解释性扩写。
  alternative: 可理解为历史上的大卫、将来的大卫后裔或君王，也可按预表理解为弥赛亚。
  rationale: 希伯来文直接使用“大卫”。译文不把任何一种神学解释写入正文，以保留原文的开放性和神学张力。
- issue: “一位牧者”与“大卫”的句法关系
  choice: 正文译作独立存在句“他们众人必有一位牧者”。
  alternative: 也可译作“他必作他们众人的一位牧者”，使“牧者”直接指前句的大卫。
  rationale: 希伯来语谓语结构允许存在式表达，也可能承接前句主语。正文采用自然且不强行指定主语的译法，脚注保留另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“王”“牧者”“典章”“律例”保留原文的君王、牧养和立约法律意象；句式避免生硬照搬希伯来语，同时不消解“大卫”身份及牧者句法上的真实歧义。
