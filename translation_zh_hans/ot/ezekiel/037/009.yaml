  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א אֶל הָ/ר֑וּחַ הִנָּבֵ֣א בֶן אָ֠דָם וְ/אָמַרְתָּ֨ אֶל הָ/ר֜וּחַ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה מֵ/אַרְבַּ֤ע רוּחוֹת֙ בֹּ֣אִי הָ/ר֔וּחַ וּ/פְחִ֛י בַּ/הֲרוּגִ֥ים הָ/אֵ֖לֶּה וְ/יִֽחְיֽוּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/009.yaml
  text: 'Then he said to me[a], “Prophesy to the breath; prophesy, son of man, and say to the breath, ‘Thus says the Lord GOD: Come from the four winds, O breath, and breathe on these slain, so that they may live.’”'
translation:
  language: zh_hans
  text: 他对我说：“你要向气息[a]说预言。人子啊，你要说预言，对气息说：‘主耶和华如此说：气息啊，要从四方而来，吹在这些被杀的人身上，使他们活过来。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 רוּחַ 可指“气息”“风”或“灵”。本节单数译作“气息”，在“四方”中则译作“风”；这里也可理解为“灵”，从而保留原文多层的意象。
    reason: 词义选择
lexical_decisions:
- source_word: הִנָּבֵא
  choice: 说预言
  rationale: 这是对以西结发出的命令，指他奉上帝之命宣告信息。“说预言”保留先知宣告的言语行为，同时符合现代汉语表达。
- source_word: הָרוּחַ / רוּחוֹת
  choice: 气息 / 风
  rationale: רוּחַ兼有“气息、风、灵”等义。单数在本节直接使被杀者复生，译作“气息”最贴合动作和结果；复数短语מֵאַרְבַּע רוּחוֹת则自然译作“四方之风”。脚注保留“灵”的可能含义，避免消除异象有意形成的多层意象。
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼，强调他是人；“人子”简洁，并延续中文圣经读者熟悉的表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 以中文圣经中通行而庄重的形式表达复合神名，既体现אֲדֹנָי的“主”，也明确保留יהוה的专名。
- source_word: בֹּאִי
  choice: 要……而来
  rationale: 阴性单数命令式，与רוּחַ呼应；“气息啊，要从……而来”自然呈现呼唤和命令语气。
- source_word: וּפְחִי
  choice: 吹在……身上
  rationale: נפח表示吹气或吹风，介词ב指向承受动作的对象；这一译法保留风吹与气息赋予生命之间的意象联系。
- source_word: בַּהֲרוּגִים הָאֵלֶּה
  choice: 在这些被杀的人身上
  rationale: הֲרוּגִים指遭杀害的人；“被杀的人”直接保留其被杀状态，也符合战场异象的语境。
- source_word: וְיִחְיוּ
  choice: 使他们活过来
  rationale: 此处未完成式在命令之后表达目的或结果；“使他们活过来”清楚传达气息临到后的复生。
theological_decisions:
- issue: 山谷异象中רוּחַ的多义性
  choice: 单数译作“气息”，复数译作“风”，并在脚注说明也可理解为“灵”。
  alternative: 把各处统一译作“灵”，或统一译作“风”。
  rationale: 本节借同一希伯来词交织风、气息与灵的意象。按具体搭配分别译作“气息”和“风”可使现代读者理解句意，而脚注保留“灵”的神学与文学回响，不把原文的张力归结为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你要……说预言”呈现重复命令的强调；“气息啊”保留原文直接呼告。句式尽量贴近希伯来文推进次序，同时避免生硬直译。
