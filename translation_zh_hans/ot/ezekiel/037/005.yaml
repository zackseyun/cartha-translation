  yaml_path: translation/ot/ezekiel/037/005.yaml
  text: 'Thus says the Lord GOD to these bones: Behold[a], I am bringing breath into you, and you shall live.'
translation:
  language: zh_hans
  text: 主雅威对这些骸骨如此说：“看哪，我要使气息[a]进入你们里面，你们就必活过来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “气息”所译的希伯来语也可指“灵”或“风”。这里直接描写没有生命的骸骨因气息进入而活过来；但这个词在本章中更广的多重含义也很重要。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知宣告中常见的传信公式；“如此说”既保留庄重语气，也符合现代汉语圣经文体。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号中“主”与四字神名的区别，并采用中文读者熟悉且庄重的“耶和华”来音译神名。
- source_word: לָעֲצָמוֹת הָאֵלֶּה
  choice: 对这些骸骨
  rationale: 介词 ל 在此标明说话对象；“骸骨”比“骨头”更适合异象中遍地枯骨的庄重语境。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示注意和郑重宣告的功能；“看哪”虽属书面表达，但在现代宗教叙事中仍清楚自然。
- source_word: מֵבִיא בָכֶם
  choice: 我要使……进入你们里面
  rationale: 分词与 הִנֵּה、אֲנִי 连用，表达即将施行之事；汉语用“我要使……进入”自然呈现临近的行动及进入的方向。
- source_word: רוּחַ
  choice: 气息
  rationale: 此处直接描写无生命的骸骨得着生命，“气息”最贴合当前图像；该词也可指“风”或“灵”，其多义性在脚注中保留。
- source_word: וִחְיִיתֶם
  choice: 你们就必活过来
  rationale: 表达前一行动所带来的确定结果；“活过来”比单说“活着”更清楚呈现由死亡进入生命。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”既区分 אֲדֹנָי 与 יהוה，又采用普通中文读者较熟悉的神名形式，不把神名泛化为称号“上帝”。
- issue: רוּחַ 的语义选择
  choice: 气息
  alternative: 灵；风
  rationale: 骸骨得生命的直接场景支持“气息”，但本章后文利用该词“气息／风／灵”的语义关联，因此不在正文中武断消除其更广的神学张力，而以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“骸骨”“看哪”“就必”保留先知宣告的肃穆感；句法则尽量自然流畅。脚注标记置于与多义词相关的整句之后。
