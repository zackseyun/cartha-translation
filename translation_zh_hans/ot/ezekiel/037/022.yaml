base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/022.yaml
  text: And I will make them one nation in the land[a], on the mountains of Israel, and one king will be king over all of them. They will no longer be two nations[b], and they will no longer be divided into two kingdoms.
translation:
  language: zh_hans
  text: 我要使他们在这地，在以色列的群山上[a]，成为一个国家；必有一位王作他们众人的王[b]。他们不再是两个国家，也不再分裂为两个王国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列的群山”也可译作“以色列山地”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“一位王必为他们众人作王”，原文重复“王”以加强语气。
    reason: source_form
lexical_decisions:
- source_word: וְעָשִׂיתִי אֹתָם לְגוֹי אֶחָד
  choice: 我要使他们……成为一个国家
  rationale: עשה与宾语及לְ连用，在这里表示“使……成为”。“国家”前后一致地对应גּוֹי，并保留上帝主动促成合一的含义。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 这里所指是以色列之地，而非泛指全地或世界；“这地”在现代汉语中自然，也保留特定地域的语境。
- source_word: בְּהָרֵי יִשְׂרָאֵל
  choice: 在以色列的群山上
  rationale: 直译该短语，并保留以西结书中具有特色的地理表达；“以色列山地”作为自然的地形性译法列入脚注。
- source_word: וּמֶלֶךְ אֶחָד יִהְיֶה לְכֻלָּם לְמֶלֶךְ
  choice: 必有一位王作他们众人的王
  rationale: 保留原文两次出现“王”所形成的强调，同时符合现代汉语表达。
- source_word: וְלֹא יִהְיֶה עוֹד לִשְׁנֵי גוֹיִם
  choice: 他们不再是两个国家
  rationale: 按集体所指译为复数主语“他们”；“不再”准确表达עוֹד在否定句中的持续性终止。
- source_word: וְלֹא יֵחָצוּ עוֹד לִשְׁתֵּי מַמְלָכוֹת
  choice: 也不再分裂为两个王国
  rationale: חצה的尼法勒形态在此具有被动或状态意义；“分裂为”清楚表达政治实体被划分的含义。
theological_decisions:
- issue: 以色列重新合一这一应许的性质
  choice: 按经文本身译为一个国家、这地和一位王，不在正文中增加明确的弥赛亚称谓
  alternative: 在正文中直接说明这位王是弥赛亚，或把国家与土地完全灵意化
  rationale: 本节直接陈述民族、地域和王权的合一；更广的上下文虽可能引出弥赛亚理解，本节却没有直接使用“弥赛亚”一词，因此不以解释取代翻译。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这地”体现特定的应许之地语境；分号呈现国家合一与王权合一之间的紧密并列。脚注标记均置于正文中相应词句之后。
