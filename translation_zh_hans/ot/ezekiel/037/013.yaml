  text: וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/פִתְחִ֣/י אֶת קִבְרֽוֹתֵי/כֶ֗ם וּ/בְ/הַעֲלוֹתִ֥/י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/013.yaml
  text: Then you will know that I am Yahweh[a], when I open your graves and bring you up from your graves[b], O my people.
translation:
  language: zh_hans
  text: 我的子民啊，当我打开你们的坟墓、把你们从你们的坟墓中带上来[b]时，你们就知道我是雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的音译；传统上也常音译作“耶和华”，或以“上主”等称号替代。
    reason: 说明神名的译法及常见替代译法。
  - marker: b
    text: “带上来”也可译作“使你们上来”。希伯来文动词的字面意思是“使上去”或“带上来”。
    reason: 保留使役动词的字面方向感及可能译法。
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: 你们就知道
  rationale: 该形式在先知话语中表达未来及结果；“就”自然体现前述行动所带来的结果，同时保留“知道”的基本意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，以保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: בְּפִתְחִי
  choice: 当我打开……时
  rationale: 介词 בְּ 与带第一人称后缀的不定式连用，在此具有时间意义；译为“当……时”符合现代汉语。
- source_word: קִבְרוֹתֵיכֶם
  choice: 你们的坟墓
  rationale: קֶבֶר 指坟墓或埋葬之处；“坟墓”直接、自然，并保留异象中的具体图景。
- source_word: וּבְהַעֲלוֹתִי
  choice: 把你们……带上来
  rationale: עלה 的使役形基本义为“使上来、带上来”；此译保留从坟墓向上出来的具体动作，又不把经文限定为某一种神学解释。
- source_word: מִקִּבְרוֹתֵיכֶם
  choice: 从坟墓里
  rationale: 介词 מִן 表示动作的起点；“从……里”在汉语中清楚表达由坟墓内部出来。
- source_word: עַמִּי
  choice: 我的子民啊
  rationale: 这是直接称呼；“啊”体现呼语语气，“我的子民”保留关系性和盟约性的意味。
theological_decisions:
- issue: 本节的开坟与从坟墓中上来，是应被限定为民族复兴的比喻，还是明确解释为身体复活
  choice: 直接保留开坟和从坟墓中被带上来的具体图景，不作解释性限定
  alternative: 可意译为从被掳或民族死亡中复兴，也可明确译成身体复活
  rationale: 希伯来文本在复兴异象中使用具体而带有复活意味的语言。直译其图景能够保留民族复兴与身体复活意象之间的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准汉语。为使长句自然，将呼语“我的子民啊”前置，并将两个时间性动作置于主句之前；没有把坟墓图景解释为纯粹比喻或明确的末世身体复活。
