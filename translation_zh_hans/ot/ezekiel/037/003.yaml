id: EZK.37.3
reference: Ezekiel 37:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִחְיֶ֖ינָה הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וָ/אֹמַ֕ר אֲדֹנָ֥/י יְהוִ֖ה אַתָּ֥ה יָדָֽעְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/003.yaml
  text: And he said to me[a], “Son of man, can these bones live?” And I said, “Lord GOD, you know.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，这些骸骨能活过来吗？”我说：“主耶和华[a]啊，你知道。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是“阿多奈·耶和华”，即“主耶和华”；“耶和华”代表神名 יהוה（YHWH）。
    reason: 说明复合神圣称号及神名的原文形式。
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 未完成式连续结构推进叙事；现代汉语无需机械译出连接词。“对我说”直接表达 אֵלַי。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；保留希伯来语习语及其文学呼应，不在本处加入后来的基督论含义。
- source_word: הֲתִחְיֶינָה
  choice: 能活过来吗
  rationale: 疑问词与未完成式在这里询问这些骸骨恢复生命的可能性。“活过来”比单说“活”更自然，也没有像“复活”那样预先限定神学含义。
- source_word: הָעֲצָמוֹת הָאֵלֶּה
  choice: 这些骸骨
  rationale: 准确保留“这些骨头”的指示意义；“骸骨”符合异象场景且语言庄重。本节原文没有“枯干”，故不增译。
- source_word: וָאֹמַר
  choice: 我说
  rationale: 连续式继续叙事，汉语以简洁的“我说”自然承接，无须另加“于是”。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי（主）和神名 יְהוִה（耶和华），既保留复合称号，也避免把神名笼统化为普通称谓。
- source_word: אַתָּה יָדָעְתָּ
  choice: 你知道
  rationale: 完成式在此表达现时状态。“你知道”忠实原文；不增添原文没有的“惟有你”。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文明确包含神名 יהוה；正文保留“耶和华”，比以“上帝”替代更透明，同时用脚注说明其希伯来语构成。
- issue: בֶּן אָדָם 在《以西结书》中的译法
  choice: 人子
  alternative: 凡人
  rationale: “人子”保留反复出现的称呼形式和原文意象；本处不将其解释成专有的弥赛亚称号，也不把它改写为只强调必死性的“凡人”。
- issue: הֲתִחְיֶינָה 所问的是能力还是将来结果
  choice: 能活过来吗
  alternative: 会活过来吗
  rationale: 希伯来语未完成式在疑问句中可兼有可能性和将来展望。“能”贴合先知把答案交托给上帝的回应，但不排除后文所揭示的实际结果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“骸骨”适合异象语境；“活过来”避免过度神学化。称呼“人子”及复合称号“主耶和华”保持全书术语的一致性。
