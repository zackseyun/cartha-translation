  text: וְ/נִבֵּ֖אתִי כַּ/אֲשֶׁ֣ר צֻוֵּ֑יתִי וַֽ/יְהִי ק֤וֹל כְּ/הִנָּֽבְאִ/י֙ וְ/הִנֵּה רַ֔עַשׁ וַ/תִּקְרְב֣וּ עֲצָמ֔וֹת עֶ֖צֶם אֶל עַצְמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/007.yaml
  text: So I prophesied as I was commanded[a], and as I prophesied, there was a sound, and behold, a rattling, and the bones came together[b], bone to its bone.
translation:
  language: zh_hans
  text: 于是，我照着所受的命令说预言。我正说预言的时候，就有声音；看哪，一阵响动[a]，骨头便彼此靠近，骨头归向自己的骨头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “响动”或译“震动”或“地震”。希伯来语 רַעַשׁ 可指响动、震动或地震；这里枯骨正在聚拢，正文采用较符合场景的表达。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“骨头归向自己的骨头”。这是一种分配式表达，意指每根骨头都归向与它相对应的骨头。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבֵּאתִי
  choice: 于是，我……说了预言
  rationale: נבא 的尼法勒式在《以西结书》中通常指先知受命发言；“说了预言”既保留先知性言说，也符合现代汉语表达。
- source_word: כַּאֲשֶׁר צֻוֵּיתִי
  choice: 照着所受的命令
  rationale: 保留 צוה 被动式所表达的受命含义，同时避免生硬的“照我被命令的”。
- source_word: וַיְהִי קוֹל
  choice: 就有声音
  rationale: קוֹל 泛指可听见的声音；此处不先行规定声音性质，让后面的 רַעַשׁ 加以说明。
- source_word: כְּהִנָּבְאִי
  choice: 正说预言时
  rationale: 带 כ 前缀的不定式结构表达两个动作同时发生；“正……时”自然呈现进行中的时间关系。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注目并增强现场感的功能，也符合庄重的先知文学语体。
- source_word: רַעַשׁ
  choice: 一阵喀啦声
  rationale: 该词可指震动、震响或地震；在枯骨重新组合的场景中，“喀啦声”最自然地呈现骨头移动碰合的听觉效果，同时以脚注保留其他可能。
- source_word: וַתִּקְרְבוּ עֲצָמוֹת
  choice: 骨头便靠拢
  rationale: קרב 的基本义是靠近；在此指骨头彼此移近并接合。“靠拢”兼顾字面动作和上下文结果。
- source_word: עֶצֶם אֶל עַצְמוֹ
  choice: 一根接上与它相配的那一根
  rationale: 希伯来文单数分配式表达每根骨头都与各自对应的骨头接合；此译法在自然汉语中明确保留“各归其位”的含义。
