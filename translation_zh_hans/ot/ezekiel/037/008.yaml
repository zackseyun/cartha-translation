base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/008.yaml
  text: And I looked[a], and behold, there were sinews on them, and flesh had come up, and skin covered them from above; but there was no breath in them.
translation:
  language: zh_hans
  text: 我观看，见有筋长在骸骨上，肉也长了出来，皮肤从上面覆盖着它们；只是它们里面还没有气息[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“רוּחַ”（ruach）可指“气息”、“风”或“灵”。这里说身体尚未活过来，所以正文译作“气息”；但上下文有意交织这三层含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: 我观看
  rationale: ראה在此延续先知异象中的观察动作；“观看”比单纯“看见”更能体现主动注视，又符合庄重的叙事语体。
- source_word: וְהִנֵּה
  choice: 见
  rationale: הִנֵּה用于引导读者注意眼前突然呈现的景象；现代汉语用“见”既保留视觉上的鲜明感，也避免“看哪”在本句中过于生硬。
- source_word: גִּדִים
  choice: 筋
  rationale: 此词指筋腱等连接组织；“筋”自然、通俗，并适合骸骨重新组成身体的图景。
- source_word: וּבָשָׂר עָלָה
  choice: 肉也长了出来
  rationale: בָּשָׂר在此是身体的肉，עלה描写肉在骸骨上生长、出现；“长了出来”准确而自然。
- source_word: וַיִּקְרַם עֲלֵיהֶם עוֹר מִלְמָעְלָה
  choice: 皮从上面把它们包住
  rationale: קרם表示形成表层或覆盖，מִלְמָעְלָה说明皮在外面覆于其上；此译保留覆盖方向，又符合现代汉语。
- source_word: וְרוּחַ אֵין בָּהֶם
  choice: 只是它们里面还没有气息
  rationale: רוּחַ可指气息、风或灵；在身体已成形却仍无生命的直接语境中，“气息”最贴切。“只是”表达与身体已经复原之间的转折，“还”呼应后续将得生命的叙事发展。
theological_decisions:
- issue: 枯骨异象中רוּחַ的译法
  choice: 气息
  alternative: 风；灵
  rationale: 本句直接描写已经具备筋、肉、皮却仍未活过来的身体，因此正文采用“气息”。但本章有意运用该词“气息、风、灵”的多重含义，脚注保留其语义张力，不把异象单独限定为某一种神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我观看，见……”保留异象叙述的现场感；“骸骨”承接本段语境，避免重复解释。“筋、肉、皮、气息”用普通读者熟悉的身体词汇。脚注标记置于与其所释“气息”相关的句末。
