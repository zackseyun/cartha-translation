base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/002.yaml
  text: And he led me around among them[a], all around; and behold, there were very many on the surface of the valley, and behold[b], they were very dry.
translation:
  language: zh_hans
  text: 他领我在骸骨中间绕来绕去[a]。看哪，谷地表面[b]有极多的骸骨；看哪，它们都非常干枯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使我在它们上方四围经过。”原文可较形式化地译为“使我经过它们上面，四围四围”；正文按异象中的空间关系采用较自然的表达。
    reason: lexical_alternative
  - marker: b
    text: 直译：“在谷地的面上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִירַנִי
  choice: 他领我……走过
  rationale: עבר的使役式表示使人经过或移动；在异象语境中译为“领我……走过”，既保留引导和使动意味，也符合现代汉语表达。
- source_word: עֲלֵיהֶם
  choice: 从骸骨中间
  rationale: 该介词本义可指“在……之上／越过”，但与移动动词连用时也可表示相对于这些骸骨的行进范围；“从骸骨中间”自然表达先知被带到遍布骸骨之处察看的空间关系，又不暗示他凌空飞过。
- source_word: סָבִיב סָבִיב
  choice: 四处
  rationale: 原文重复表示周遍、环绕的强调；“四处”简洁传达在各处巡行察看的意思，脚注保留较形式对应的可能译法。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该词在先知异象叙事中引人注意，并增强现场感；“看哪”保留其修辞作用。
- source_word: רַבּוֹת מְאֹד
  choice: 极多
  rationale: 阴性复数形容词承接上节的“骸骨”，加上程度副词表示数量甚多；“极多”准确而凝练。
- source_word: עַל־פְּנֵי הַבִּקְעָה
  choice: 谷地表面
  rationale: 较贴近“在谷地的面上”这一希伯来语意象，同时比直译“谷地的脸上”自然，并避免把地貌具体限定为平坦谷底。
- source_word: יְבֵשׁוֹת מְאֹד
  choice: 非常干枯
  rationale: 形容词阴性复数与所指的骸骨一致；“非常干枯”保留程度强调，而不强化为“完全干透”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“骸骨”从上一节语境补出，使中文指称明确；两次“看哪”保留异象叙事的鲜明现场感。所有脚注标记均已置于正文。
