source:
  edition: WLC
  text: דַּבֵּ֣ר אֲלֵ/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י לֹקֵ֜חַ אֶת עֵ֤ץ יוֹסֵף֙ אֲשֶׁ֣ר בְּ/יַד אֶפְרַ֔יִם וְ/שִׁבְטֵ֥י יִשְׂרָאֵ֖ל חבר/ו וְ/נָתַתִּי֩ אוֹתָ֨/ם עָלָ֜י/ו אֶת עֵ֣ץ יְהוּדָ֗ה וַֽ/עֲשִׂיתִ/ם֙ לְ/עֵ֣ץ אֶחָ֔ד וְ/הָי֥וּ אֶחָ֖ד בְּ/יָדִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/019.yaml
  text: 'tell them[a], ‘Thus says the Lord GOD: Behold, I am taking the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel associated with him, and I will place them with it, with the stick of Judah, and make them one stick[b], and they will be one in my hand.’'
translation:
  language: zh_hans
  text: 你要对他们说：‘主耶和华如此说：看哪，我要取约瑟的木杖，就是以法莲手中的那根，以及与他联合的以色列众支派[a]；我要把它们放在那根上，连同犹大的木杖[b]，使它们成为一根木杖；它们在我手中要合而为一。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“作他同伴的以色列众支派”或“归附他的以色列众支派”。这里大概指与约瑟／以法莲相关联的各支派。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“我要把它们放在它上面，连同犹大的木杖。”这里的措辞描绘两根木杖被结合成一根的象征行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֲלֵהֶם
  choice: 你要对他们说
  rationale: 保留命令语气，并以自然的现代汉语引出先知宣告。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 采用庄重而通行的先知使者公式；“主”对应 אֲדֹנָי，“耶和华”对应神的专名 יהוה。
- source_word: הִנֵּה אֲנִי לֹקֵחַ
  choice: 看哪，我要取
  rationale: “看哪”保留 הִנֵּה 的郑重提示作用；分词 לֹקֵחַ 在此表达即将施行且生动呈现的行动，译作“我要取”符合汉语表达。
- source_word: עֵץ
  choice: 木杖
  rationale: 本段描述可拿在手中并用于象征行动的木质物件；“木杖”既保留材质和手持意象，也避免误解为活树。
- source_word: אֲשֶׁר בְּיַד אֶפְרַיִם
  choice: 就是以法莲手中的那根
  rationale: 保留“在……手中”的字面图像，使之与句末“在我手中”形成呼应。
- source_word: וְשִׁבְטֵי יִשְׂרָאֵל חברו
  choice: 以及与他联合的以色列众支派
  rationale: חבר 表达联合、结伴或归属关系；“与他联合”自然地呈现众支派同约瑟／以法莲的关联，同时不把具体政治关系解释得过窄。
- source_word: וְנָתַתִּי אוֹתָם עָלָיו אֶת עֵץ יְהוּדָה
  choice: 我要把他们放在那根上，与犹大的木杖合在一起
  rationale: 基本保留“放在其上”的空间图像，同时借“合在一起”说明象征动作所指的两杖结合，避免汉语句法含混。
- source_word: וַעֲשִׂיתִם לְעֵץ אֶחָד
  choice: 使它们成为一根木杖
  rationale: 准确表达 עשה + ל 的“使成为”含义，并保留两件象征物成为一根的图像。
- source_word: וְהָיוּ אֶחָד בְּיָדִי
  choice: 它们在我手中要合而为一
  rationale: 保留“在我手中”的核心意象，并以“合而为一”自然表达复数主语配单数谓语“一个／一体”的希伯来语张力。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”分别对应 אֲדֹנָי 与 יהוה，既保留神的专名，也符合现代中文圣经语体；不将专名泛化为称号。
- issue: “成为一”所表达的统一性质
  choice: 合而为一
  alternative: 成为一个；成为同一个国家
  rationale: 原文只陈述象征物在上帝手中成为“一”，本节本身未明确加上“国家”等解释性名词，因此保留象征和神学张力，不提前限定其含义。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语，保留先知宣告的正式语气和“手中—木杖—成为一”的重复意象。代词在民族群体与象征木杖之间有意保持一定弹性，以免消除原文的转指现象。
