source:
  edition: WLC
  text: וְ/לֹ֧א יִֽטַמְּא֣וּ ע֗וֹד בְּ/גִלּֽוּלֵי/הֶם֙ וּ/בְ/שִׁקּ֣וּצֵי/הֶ֔ם וּ/בְ/כֹ֖ל פִּשְׁעֵי/הֶ֑ם וְ/הוֹשַׁעְתִּ֣י אֹתָ֗/ם מִ/כֹּ֤ל מוֹשְׁבֹֽתֵי/הֶם֙ אֲשֶׁ֣ר חָטְא֣וּ בָ/הֶ֔ם וְ/טִהַרְתִּ֤י אוֹתָ/ם֙ וְ/הָיוּ לִ֣/י לְ/עָ֔ם וַ/אֲנִ֕י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/023.yaml
  text: They will no longer defile themselves with their idols[a], with their detestable things, or with any of their transgressions. I will save them from all their dwelling places in which they sinned, and I will cleanse them. Then they will be my people[b], and I will be their God.
translation:
  language: zh_hans
  text: 他们不再因自己的偶像[a]、可憎之物和一切过犯玷污自己。我要把他们从他们曾犯罪的一切居所[b]中拯救出来，并洁净他们。他们要作我的子民，我要作他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来语带有强烈的轻蔑意味，是对假神的贬称。
    reason: lexical_alternative
  - marker: b
    text: 或可理解为“从他们犯罪的一切住处（或聚居地）中”；也有人把这句话较宽泛地理解为：从一切与他们犯罪有关的地方或处境中拯救他们。原文在此不易解释。
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַמְּאוּ
  choice: 玷污自己
  rationale: 希伯来语动词形态带有反身意味；“玷污自己”兼顾礼仪与道德上的不洁，也符合现代汉语表达。
- source_word: גִּלּוּלֵיהֶם
  choice: 自己的偶像
  rationale: 该词是以西结书对偶像所用的强烈贬称；正文采用清楚自然的“偶像”，其轻蔑色彩在脚注中说明。
- source_word: שִׁקּוּצֵיהֶם
  choice: 可憎之物
  rationale: 该词指令人厌恶之物，尤其涉及偶像崇拜的对象或行为；“可憎之物”保留其强烈否定意味而不缩窄所指。
- source_word: פִּשְׁעֵיהֶם
  choice: 过犯
  rationale: 该词可表达悖逆、侵犯正当权柄；“过犯”简洁庄重，并保留盟约语境中的背叛意味。
- source_word: וְהוֹשַׁעְתִּי
  choice: 我要……拯救出来
  rationale: ישׁע可指拯救或解救；此处既涉及脱离犯罪环境，也引向洁净和盟约关系的恢复。
- source_word: מוֹשְׁבֹתֵיהֶם
  choice: 他们……的一切居所
  rationale: 按马所拉文本直译为居住之处，不以“背道”等解释性词语替代；句意上的困难留给脚注说明。
- source_word: אֲשֶׁר חָטְאוּ בָהֶם
  choice: 他们曾犯罪的
  rationale: 关系从句按最自然的句法修饰“居所”；“曾”符合所述过去犯罪及将来复兴的语境。
- source_word: וְטִהַרְתִּי
  choice: 并洁净他们
  rationale: “洁净”可同时承载礼仪和道德层面的净化含义。
- source_word: וְהָיוּ לִי לְעָם
  choice: 他们要作我的子民
  rationale: 采用自然庄重的汉语表达，保留标准的盟约公式。
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: 我要作他们的上帝
  rationale: 与前句构成相应的盟约公式，不额外引入后来的神学体系。
theological_decisions:
- issue: 拯救所针对的是犯罪之地、流亡之地，还是背道行为
  choice: 正文依马所拉文本译作从他们曾犯罪的一切“居所”中拯救他们
  alternative: 理解为从他们犯罪的各处境中解救，或依据另一种解释译为从一切背道行为中拯救
  rationale: מוֹשְׁבֹתֵיהֶם按现有马所拉文本通常意为“居所”，但在此语境中不易解释。正文保留原文形象，脚注提示较宽泛的理解，不把救恩限定为仅脱离流亡，也不将文本直接改释为“背道”。
- issue: 拯救、洁净与盟约关系的次序
  choice: 保留上帝主动拯救、洁净，继而恢复“我的子民／他们的上帝”关系的行文次序
  alternative: 把此处系统化为某一特定宗派的救恩次序
  rationale: 原文清楚强调上帝的行动及盟约关系的恢复，但没有展开完整的教义体系，因此不作超出经文的界定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“玷污自己”“可憎之物”“洁净”“子民”等词保留本节的礼仪、道德和盟约色彩。脚注标记均放在所说明的词句之后，并纠正了咨询层中脚注内容与正文标记位置不相配的问题。
