  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הָיְתָ֣ה עָלַ/י֮ יַד יְהוָה֒ וַ/יּוֹצִאֵ֤/נִי בְ/ר֨וּחַ֙ יְהוָ֔ה וַ/יְנִיחֵ֖/נִי בְּ/ת֣וֹךְ הַ/בִּקְעָ֑ה וְ/הִ֖יא מְלֵאָ֥ה עֲצָמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/001.yaml
  text: The hand of Yahweh was upon me[a], and he brought me out by the Spirit of Yahweh and set me down in the middle of the valley[b]; it was full of bones.
translation:
  language: zh_hans
  text: 耶和华的手临到我；他借着耶和华的灵[a]把我带出去，将我安置在谷地[b]中央；谷地里满是骸骨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在耶和华的灵里。”希伯来语可表示以灵为施行媒介，也可表示处于灵里的状态。
    reason: lexical_alternative
  - marker: b
    text: “谷地”也可译作“平原”或“宽阔的山谷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד יְהוָה
  choice: 耶和华的手
  rationale: 保留希伯来文具体而鲜明的先知性惯用语，表达耶和华临到先知的能力与驱使，不抽象改写为“能力”或“同在”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不是用头衔“主”替代。
- source_word: וַיּוֹצִאֵנִי
  choice: 把我带出去
  rationale: 体现 יצא 的使役词形，且自然衔接先知被神的灵带领、转移的场景。
- source_word: בְּרוּחַ יְהוָה
  choice: 借着耶和华的灵
  rationale: 此处先知性经历与神主动施行的语境支持将 רוּחַ 译为“灵”；介词 בְּ 译作“借着”表达工具或施动媒介，同时在脚注保留“在……的灵里”这一状态或领域的可能性。
- source_word: וַיְנִיחֵנִי
  choice: 将我安置
  rationale: נוח 的使役形表示使先知停驻在某处；“安置”既体现使役意义，又比“使我休息”更符合空间移动的上下文。
- source_word: בְּתוֹךְ הַבִּקְעָה
  choice: 在谷地中央
  rationale: בִּקְעָה 指谷间平地、宽谷或平原；“谷地”兼顾低洼地形和开阔平地的语义，בְּתוֹךְ 则译作“中央”。
- source_word: מְלֵאָה עֲצָמוֹת
  choice: 满是骸骨
  rationale: “满是”简洁保留原文的突兀画面；“骸骨”在异象中的死亡语境下比一般性的“骨头”更庄重自然。
theological_decisions:
- issue: 先知被带出去时 רוּחַ 的含义及介词关系
  choice: 借着耶和华的灵
  alternative: 在耶和华的灵里；借着耶和华的风
  rationale: 上下文描述耶和华临到并带领先知，因而“灵”较“风”更切合先知性经历；然而 בְּ 可表达工具，也可表达所处的状态或领域，所以用脚注保留“在……的灵里”的真实歧义，不把异象经历的方式解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现连续动作和末尾的场景说明；保留“耶和华的手”这一具体意象，并用“骸骨”维持异象画面的肃穆与冲击力。
