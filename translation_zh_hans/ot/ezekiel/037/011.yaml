  text: וַ/יֹּאמֶר֮ אֵלַ/י֒ בֶּן אָדָ֕ם הָ/עֲצָמ֣וֹת הָ/אֵ֔לֶּה כָּל בֵּ֥ית יִשְׂרָאֵ֖ל הֵ֑מָּה הִנֵּ֣ה אֹמְרִ֗ים יָבְשׁ֧וּ עַצְמוֹתֵ֛י/נוּ וְ/אָבְדָ֥ה תִקְוָתֵ֖/נוּ נִגְזַ֥רְנוּ לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/011.yaml
  text: Then he said to me, “Son of man, these bones are the whole house of Israel. Look, they are saying, ‘Our bones have dried up, and our hope has perished; we are cut off.’”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，这些骸骨就是以色列全家。看哪，他们说：‘我们的骨头枯干了，我们的希望破灭了；我们被剪除了[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们被剪除了”：希伯来文末句的确切含义不完全确定；也可理解为“我们被彻底剪除了”或“我们已经完了”。
    reason: 保留 נִגְזַרְנוּ לָנוּ 的语法和语义歧义，不在正文中加入“独自无依”的解释性含义。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝对先知的固定称呼，既贴近原文，也符合中文圣经传统。
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: בֵּית 在这里指作为整体的家族或民族共同体；“全家”简洁保留这一群体意象。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 体现原文引人注意、引出其话语的语用功能，并保持庄重语体。
- source_word: יָבְשׁוּ עַצְמוֹתֵינוּ
  choice: 我们的骨头枯干了
  rationale: 保留与异象中枯骨直接呼应的身体意象，不将其抽象化。
- source_word: וְאָבְדָה תִקְוָתֵנוּ
  choice: 我们的希望破灭了
  rationale: אָבַד 表示失去、灭亡；“破灭”自然传达希望已归于无有的绝望感。
- source_word: נִגְזַרְנוּ לָנוּ
  choice: 我们被剪除，独自无依
  rationale: נִגְזַרְנוּ 的核心意象是被割断或剪除；לָנוּ 的作用较难确定，正文以“独自无依”表达其可能的孤立、任凭自身之意，并以脚注保留歧义。
theological_decisions:
- issue: 枯骨所指的范围
  choice: 这些骸骨就是以色列全家
  alternative: 这些骸骨代表以色列全家
  rationale: 原文使用直接判断句“他们是”，正文不弱化为单纯象征说明，保留异象解释的鲜明同一性表达。
- issue: 末句是否表达最终灭亡
  choice: 被剪除
  alternative: 彻底完了／灭绝了
  rationale: 采用原文的切断意象，不把以色列人的绝望自述提升为上帝对其最终结局的裁定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“骸骨”承接本章异象语境；引语保留重复的“我们”，呈现被掳群体哀叹的节奏。脚注标记已置于主文本。
