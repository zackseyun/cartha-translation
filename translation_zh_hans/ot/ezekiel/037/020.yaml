  text: And the sticks on which you write will be in your hand before their eyes[a].
translation:
  language: zh_hans
  text: 你所写过字的那些木杖，要拿在你手中，让他们亲眼看见。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木杖”或译“木片”。希伯来语这个词可泛指木头或木制物；在这里的象征行动中，指以西结拿着并在上面题字的木制物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: 要拿在
  rationale: 连词加完成式在这段先知行动指示中表达随后应有的状态；结合“在你手中”，译为“要拿在”较符合现代汉语，也明确表现木杖被持于手中的情景。
- source_word: הָעֵצִים
  choice: 那些木杖
  rationale: עֵץ 可指树、木材或木制物；本段是以两件可题写并合在手中的木制物施行象征行动，因此正文采用“木杖”，并以脚注保留较宽泛的“木片”可能。
- source_word: אֲשֶׁר תִּכְתֹּב עֲלֵיהֶם
  choice: 你所题写的
  rationale: 准确表达关系从句及“在其上书写”的意思；“题写”自然包含写在物件上的含义，行文简洁庄重。
- source_word: בְּיָדְךָ
  choice: 拿在手中
  rationale: 希伯来文为单数“在你手中”，这里表示实际持有，而非借某人的手施行；汉语“拿在手中”清楚呈现动作与状态。
- source_word: לְעֵינֵיהֶם
  choice: 给他们亲眼看见
  rationale: 该表达直译为“在他们眼前”，强调这象征行动公开可见；“给他们亲眼看见”在现代汉语中自然，并保留“眼”的鲜明意象。
