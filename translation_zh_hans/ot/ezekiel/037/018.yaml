  text: וְ/כַֽ/אֲשֶׁר֙ יֹאמְר֣וּ אֵלֶ֔י/ךָ בְּנֵ֥י עַמְּ/ךָ֖ לֵ/אמֹ֑ר הֲ/לֽוֹא תַגִּ֥יד לָ֖/נוּ מָה אֵ֥לֶּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/018.yaml
  text: And when the sons of your people say to you[a], ‘Will you not tell us what these things are to you?’
translation:
  language: zh_hans
  text: 当你的同胞对你说：“你不告诉我们，这些东西对你有什么意义吗？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“这些对你是什么？”这是在询问以西结这一象征性动作的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר
  choice: 当……时（由全句“当……”表达）
  rationale: וְ 加时间连接词引出随后发生的情形；现代汉语用“当”即可自然承接上下文，不必机械译出“和”。
- source_word: יֹאמְרוּ אֵלֶיךָ
  choice: 对你说
  rationale: אָמַר 的基本义是“说”。虽然引语内容是问题，仍保留原文的言说表达，而不直接改译为“问你”。
- source_word: בְּנֵי עַמְּךָ
  choice: 你的同胞
  rationale: 该短语直译为“你百姓的众子”，在这里指与以西结同属一个民族的人；“你的同胞”在现代汉语中自然、准确，也避免把希伯来语惯用的阳性复数误解为仅指男性。
- source_word: לֵאמֹר
  choice: 由冒号和直接引语表达
  rationale: 这是引出话语内容的公式性不定式；汉语直接引语前用冒号即可，无须重复译作“说”。
- source_word: הֲלוֹא
  choice: 不……吗
  rationale: 该组合引出带有期待的反问；“不……吗”保留说话者期待以西结作出解释的语气。
- source_word: תַגִּיד לָנוּ
  choice: 告诉我们
  rationale: נגד 的使役式在此意为告知、说明；“告诉我们”符合现代口语，同时保留向众人披露信息的意思。
- source_word: מָה אֵלֶּה לָּךְ
  choice: 这些东西对你有什么意义
  rationale: 字面结构是“这些对你是什么”，语境中众人是在询问以西结手中物件及其象征性动作的含义。“有什么意义”清楚传达该希伯来语问法的语用功能，并以脚注保留字面形式。
theological_decisions: []
