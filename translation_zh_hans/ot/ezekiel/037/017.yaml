  yaml_path: translation/ot/ezekiel/037/017.yaml
  text: Then bring them near to each other for yourself as one stick[b][a], so that they may become one in your hand.
translation:
  language: zh_hans
  text: 你要把这两根木杖彼此靠拢，使它们成为一根[a]，使它们在你手中合而为一[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作为一根”。希伯来语可表示结果“成为一根”，也可表示状态“作为一根”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于：“它们要在你手中成为‘一’（原文用复数形式）。”这是表达它们合一的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַב
  choice: 你要……靠拢
  rationale: 该词为第二人称阳性单数使役命令，基本义是“使靠近”。用“靠拢”既保留先知主动执行象征动作的含义，也避免直接译成解释性更强的“接合”。
- source_word: אֹתָם
  choice: 这两根木杖
  rationale: 原文为“它们”，指上一节的两根木杖。中文补明所指，使单节阅读自然清楚。
- source_word: אֶחָד אֶל אֶחָד
  choice: 彼此
  rationale: 原文直译为“一个向着一个”，是相互关系的表达；“彼此”准确而自然。
- source_word: לְךָ
  choice: 由“你要”体现，不另行硬译
  rationale: 此处与先知本人执行动作有关。若机械译作“为你自己”，现代汉语容易误解为受益意义；主语“你”及命令结构已自然体现其亲自参与。
- source_word: לְעֵץ אֶחָד
  choice: 成为一根
  rationale: עֵץ在本段指木杖；לְ可表达动作所达成的结果，也可理解为所处状态。正文采用合乎语境的结果义，同时以脚注保留“作为一根”的可能。
- source_word: וְהָיוּ לַאֲחָדִים
  choice: 使它们……合而为一
  rationale: 该结构直译近于“它们就成为一体/成为一”，表达动作的结果。中文“合而为一”保留统一的结果，并避免把具体象征过早解释为政治或神学上的联合。
- source_word: בְיָדֶךָ
  choice: 在你手中
  rationale: 直译自然，并保留可见的象征动作场景。
theological_decisions:
- issue: 两根木杖所象征的合一性质
  choice: 只陈述两根木杖在先知手中合而为一的象征动作
  alternative: 直接译为“把它们联合起来”，或在本节明说以色列政治、民族或神学上的重新统一
  rationale: 本节本身描述先知要执行的具体动作；其象征意义由后文解释。正文不提前加入后文的诠释，也不引入任何宗派性理解。
- issue: לְעֵץ אֶחָד的结果义与状态义
  choice: 正文译作“成为一根”
  alternative: 译作“作为一根”
  rationale: 希伯来语介词לְ在此可指动作结果，也可描述状态。上下文较支持结果义，但原文的语法张力值得以脚注保存。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“木杖”承接上下文中用于题字的木质物件；“靠拢”保留קרב的基本动作义，“合而为一”自然表达结果。所有脚注标记均置于正文相应位置。
