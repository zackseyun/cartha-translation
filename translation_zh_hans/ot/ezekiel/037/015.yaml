  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在固定的先知启示公式 ויהי דבר־יהוה 中，与 דְבַר 合译为“耶和华的话临到”，既符合现代汉语习惯，也保留原文所表达的神圣话语来到先知的意味。
- source_word: דְבַר
  choice: 话
  rationale: 此处指耶和华所赐的言语或启示；“话”比“信息”更贴近原文，也保留先知书公式的庄重感。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名的通行音译“耶和华”，将其作为专名而非以“主”这一称号替代。
- source_word: אֵלַי
  choice: 到我
  rationale: 与“临”构成自然的现代汉语表达“临到我”，准确体现话语朝向先知而来。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用于引出随后神谕的内容；“说”简洁自然，并忠实反映原文引语公式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列神的四字神名。中文正文采用读者最熟悉且仍作为专名使用的“耶和华”；“雅威”是按学界常见拟音的另一译法，但正文不以称号“主”取代神名。
translation_notes:
  register: 采用现代、庄重而自然的先知书表达。“耶和华的话临到我，说”保留希伯来文启示公式，同时避免逐字译成生硬的“于是发生了”。
