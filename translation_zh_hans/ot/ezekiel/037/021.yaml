id: EZK.37.21
reference: Ezekiel 37:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/דַבֵּ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֨ה אֲנִ֤י לֹקֵ֨חַ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/בֵּ֥ין הַ/גּוֹיִ֖ם אֲשֶׁ֣ר הָֽלְכוּ שָׁ֑ם וְ/קִבַּצְתִּ֤י אֹתָ/ם֙ מִ/סָּבִ֔יב וְ/הֵבֵאתִ֥י אוֹתָ֖/ם אֶל אַדְמָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/021.yaml
  text: 'Then say to them[a], ‘Thus says the Lord GOD: Behold, I am taking the children of Israel from among the nations where they have gone[b], and I will gather them from all around and bring them to their own land.’'
translation:
  language: zh_hans
  text: 你要对他们说：“主耶和华如此说：看哪，我要把以色列子民[a]从他们所到的列国中领出来，从四面八方[b]聚集他们，把他们带到他们自己的土地上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的儿子们”，这里指以色列子民。
    reason: 说明希伯来语群体称谓的字面形式。
  - marker: b
    text: 或译“从四围”。
    reason: 保留 מִסָּבִיב 较贴近字面的表达。
lexical_decisions:
- source_word: וְדַבֵּר אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 该连词加祈使式延续上文的先知指示；中文以“你要……说”自然表达命令，毋须机械译出句首连接词。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代中文圣经语体。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的“主”和四字神名 יְהוִה；“主耶和华”是中文读者熟悉且庄重的复合称号。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意并加强宣告力度的功能；虽属较庄重语体，现代读者仍容易理解。
- source_word: אֲנִי לֹקֵחַ
  choice: 我要……领出来
  rationale: 分词与 הִנֵּה 连用，生动表达即将施行的行动；“我要”在中文中自然承载这种确定、临近的将来意义。“领出来”按语境表达从列国中取出并带离。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子民
  rationale: 原文字面是“以色列的儿子们”，在此为全体以色列人的群体称谓；“子民”既自然，也保留其族群与承继关系。
- source_word: מִבֵּין הַגּוֹיִם אֲשֶׁר הָלְכוּ שָׁם
  choice: 从他们所到的列国中
  rationale: 忠实表达以色列人散居于他们曾去到的各国之中；“列国”避免把 גּוֹיִם 限定为后期意义上的“外邦人”。
- source_word: וְקִבַּצְתִּי אֹתָם מִסָּבִיב
  choice: 从四面八方聚集他们
  rationale: מִסָּבִיב 表示从周围各方向而来；“四面八方”自然传达聚集的全面性。
- source_word: וְהֵבֵאתִי אוֹתָם אֶל אַדְמָתָם
  choice: 把他们带到他们自己的土地上
  rationale: אַדְמָתָם 明确是“他们的土地”；重复“他们”可避免中文“自己的”误指主语上帝，并以“到……上”贴近 אֶל 所表达的目的地。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 译出 אֲדֹנָי 的主权称号，并用中文传统形式“耶和华”呈现 יְהוִה，既避免把两词合并成单一称号，也不凭本节解决神名读音的历史争议。
- issue: 复归应理解为行动正在进行还是确定的将来
  choice: 我要……领出来
  alternative: 我正在……领出来
  rationale: הִנֵּה 加分词具有生动、临近的行动意味，但其后两个完成式在预言语境中承载确定的将来应许；中文用“我要”保持两者之间的张力，不断言行动在说话当时已经开始。
translation_notes:
  register: 采用现代、庄重而清楚的先知宣告语体。“如此说”“看哪”保留原文公式性和强调作用；其余句法按现代普通话调整，避免生硬直译。
