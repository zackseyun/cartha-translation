  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֤ה מִשְׁכָּנִ/י֙ עֲלֵי/הֶ֔ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵֽ/אלֹהִ֑ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/027.yaml
  text: My dwelling place will be over them[a], and I will be their God, and they will be my people.
translation:
  language: zh_hans
  text: 我的居所必在他们之上[a]；我要作他们的上帝，他们要作我的子民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的帐幕必在他们之上”，或“我的住处必在他们之上”。
    reason: 词义备选：מִשְׁכָּן既可指居所、住处，也可指帐幕；正文采用较自然且不过度限定的“居所”。
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: 我的居所
  rationale: מִשְׁכָּן可指居所或帐幕。“居所”在现代汉语中自然庄重，也保留上帝住在其民中间的具体意象，而不把所指过早限定为摩西时代的帐幕。
- source_word: עֲלֵיהֶם
  choice: 在他们之上
  rationale: עַל的直接空间意义是“在……上面／之上”。保留“在他们之上”这一不寻常的原文意象，不顺译成“与他们同在”，以免消除原文可能包含的遮蔽、护佑或临在张力。
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: 我要作他们的上帝
  rationale: 这是希伯来圣经中典型的盟约表达；此译法符合现代汉语习惯，并保留其熟悉而庄重的经文形式。
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: 他们要作我的子民
  rationale: 这是与前句对应的盟约表达。“作我的子民”自然地传达归属关系，也保留整句的圣经共鸣。
- source_word: וְהָיָה
  choice: 必在
  rationale: 此处在先知性语境中表达将来的确定事实；“必”体现确定性，并与后面的“在他们之上”自然衔接。
theological_decisions:
- issue: 盟约公式的表达
  choice: 保留“我要作他们的上帝，他们要作我的子民”这一经典结构。
  alternative: “我要成为他们的上帝，他们也要成为我的人民。”
  rationale: 原文采用固定而重要的盟约公式。所选译法既保持其可识别的经文形式和相互归属关系，又不加入文本之外的宗派性解释。
- issue: 居所与百姓的空间关系
  choice: 译作“在他们之上”，保留原文עַל的直接意象。
  alternative: “在他们中间”或“与他们同在”。
  rationale: 上下文可能使读者联想到同住或临在，但本节原文实际使用עַל，而不是通常表示“在……中间”的表达。直译可保存其真实的空间意象及解释张力。
translation_notes:
  register: 采用现代、庄重、易懂的标准普通话。“居所”比“帐幕”宽泛，适合本节先知性语境；“在他们之上”虽略显不寻常，却有意忠实保留希伯来文的空间表达。分号划分上帝居所的宣告与盟约公式，后半句保持平行结构。
