  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם קַח לְ/ךָ֙ עֵ֣ץ אֶחָ֔ד וּ/כְתֹ֤ב עָלָי/ו֙ לִֽ/יהוּדָ֔ה וְ/לִ/בְנֵ֥י יִשְׂרָאֵ֖ל חבר/ו וּ/לְקַח֙ עֵ֣ץ אֶחָ֔ד וּ/כְת֣וֹב עָלָ֗י/ו לְ/יוֹסֵף֙ עֵ֣ץ אֶפְרַ֔יִם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל חבר/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/016.yaml
  text: And you[a], son of man, take for yourself one stick and write on it, ‘For Judah and for the sons of Israel, his companions.’ Then take one stick and write on it, ‘For Joseph, the stick of Ephraim, and all the house of Israel[c][b], his companions.’
translation:
  language: zh_hans
  text: “你，人子，要为自己取一根木条[a]，在上面写：‘归犹大和与他联合的以色列子孙[b][c]。’又取一根木条，在上面写：‘归约瑟——以法莲的木条——和与他联合的以色列全家。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木条”也可译作“木块”或“木片”；若按用途作较解释性的翻译，可译作“木版”。
    reason: lexical_alternative
  - marker: b
    text: “以色列子孙”，原文直译为“以色列的众子”，也可译作“以色列的儿女”或“以色列人”。
    reason: lexical_alternative
  - marker: c
    text: “与他联合的”也可译作“他的同伴”“与他结伴的”或“他的盟友”。此说法在两处都出现。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；“人子”保留希伯来语的固定表达及其反复出现的先知性语气。
- source_word: קַח לְךָ
  choice: 要为自己拿
  rationale: 保留לְךָ所带的亲身、反身意味，同时符合现代汉语表达。
- source_word: עֵץ
  choice: 木条
  rationale: 这里指可拿在手中并可在其上书写的木制物件。“木条”既保留材质和形态上的开放性，也比“树”合乎语境，并避免直接断定为“木版”。
- source_word: וּכְתֹב עָלָיו
  choice: 在上面写
  rationale: 直接表达先知在该物件上题写文字的动作，简明自然。
- source_word: לִיהוּדָה / לְיוֹסֵף
  choice: 归犹大 / 归约瑟
  rationale: 介词ל在此引出木条上的归属题字；“归”比单列名字更清楚地呈现归属含义。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留“以色列之子”的家族与群体意象，同时采用现代中文圣经语境中自然、可涵盖后裔群体的表达。
- source_word: חברו（按马所拉读法理解为חֲבֵרָיו）
  choice: 与他联合的
  rationale: 该词表示同伴、同伙或与某方联合的人；在两个王国群体的语境中，“与他联合的”自然呈现关系含义，又不把它限定为军事同盟。
- source_word: עֵץ אֶפְרַיִם
  choice: 以法莲的木条
  rationale: 保留原文的属格结构，并清楚显示约瑟与以法莲在题字中的对应关系。
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: 保留先知书中“以色列家”的整体性与家族性表达；“全家”对应כָּל的范围。
theological_decisions:
- issue: 象征行动中南北两个群体的区分
  choice: 保留“犹大”与“约瑟——以法莲”两组名称，并分别保留与其联合的以色列群体。
  alternative: 将两组统称为“以色列人”，或把“约瑟”和“以法莲”视为没有修辞作用的重复。
  rationale: 原文有意并列犹大与约瑟/以法莲，反映分裂后的两个群体，并为下文合一的象征行动铺垫；译文不加入超出本段的后世教义解释。
- issue: חברו中单数代词所指及群体关系
  choice: 译为“与他联合的”，保留单数所指和联合关系。
  alternative: 译为“他们的同伴”“盟友”或省略代词。
  rationale: 单数代词最自然地回指犹大及约瑟这两个代表性名称；“联合”保留关联含义而不强行规定关系性质。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。题字用引号标示，并以破折号保留“约瑟”与“以法莲的木条”之间略显压缩的原文结构。避免把象征物过度具体化为书写板，也避免把联合关系限定为政治或军事同盟。
