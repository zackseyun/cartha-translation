id: EZK.37.26
reference: Ezekiel 37:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם בְּרִ֥ית עוֹלָ֖ם יִהְיֶ֣ה אוֹתָ֑/ם וּ/נְתַתִּי/ם֙ וְ/הִרְבֵּיתִ֣י אוֹתָ֔/ם וְ/נָתַתִּ֧י אֶת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/026.yaml
  text: I will make with them a covenant of peace[a]; it will be an everlasting covenant with them. And I will place them and multiply them[c][b], and I will set my sanctuary in their midst forever.
translation:
  language: zh_hans
  text: 我要与他们立平安之约；这将是与他们所立的永约[a]。我要安置他们[b]，使他们人数增多；我要把我的圣所永远设在他们中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这将是赐给他们的永约。”
    reason: 原文יִהְיֶה אוֹתָם可表示此约“与他们”同在，也可侧重此约“为他们”而设。
  - marker: b
    text: “安置”原文也可译作“放置”；在这里也有人理解为“使他们安定”或“坚立他们”。
    reason: נתן以百姓为宾语的用法较为特殊；直译与语境化译法各自强调其“放置”或“使之稳定”的一面。
lexical_decisions:
- source_word: וְכָרַתִּי לָהֶם בְּרִית
  choice: 我要与他们立……之约
  rationale: כרת与בְּרִית连用是“立约”的固定表达；中文用“立约”自然、庄重，并保留明确的盟约含义。
- source_word: בְּרִית שָׁלוֹם
  choice: 平安之约
  rationale: “平安”既是常用的圣经用语，也可涵盖שָׁלוֹם所表达的和平、安稳与完整福祉，不将其窄化为仅仅没有战争。
- source_word: בְּרִית עוֹלָם
  choice: 永约
  rationale: “永约”简洁而符合现代中文圣经语体，保留עוֹלָם在盟约语境中的持久、永久含义。
- source_word: יִהְיֶה אוֹתָם
  choice: 这将是与他们所立的
  rationale: 原文表达此约与他们之间的关系；中文补出“所立”以承接前句，同时以脚注保留“为他们”的可能理解。
- source_word: וּנְתַתִּים
  choice: 我要安置他们
  rationale: נתן的基本义为“给、放置”；以人为宾语并处于复兴语境时，“安置”既较贴近动词，又能自然表达使他们有稳定居所，避免过度解释为“坚立”。
- source_word: וְהִרְבֵּיתִי אוֹתָם
  choice: 使他们人数增多
  rationale: רבה的使役式表示使之众多；补出“人数”使现代中文清楚自然，并保留人口繁衍、增多的含义。
- source_word: מִקְדָּשִׁי
  choice: 我的圣所
  rationale: “圣所”准确对应מִקְדָּשׁ，且不像“圣殿”那样过早限定具体建筑形态。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 该短语首先表达上帝的圣所在群体当中，不应译成容易暗示个人内在居住的“在他们里面”。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: “永远”是自然的现代汉语，准确传达持续不止的时间含义。
theological_decisions:
- issue: 复兴应许中的盟约性质
  choice: 保留“平安之约”和“永约”的明确盟约措辞
  alternative: 意译为上帝赐下永久的平安或福祉
  rationale: 本节的结构与内容都以盟约为中心；明确保留“约”可避免把上帝所立的关系淡化为一般性的赐福。
- issue: 圣所所在之处
  choice: 译为“在他们中间”，表达上帝在群体中的临在
  alternative: 译为“在他们里面”，主要理解为个人内在的临在
  rationale: בְּתוֹכָם在此最自然地指圣所设于百姓群体当中；这样既保留圣所意象，也不引入原文未明确表达的后期神学范畴。
- issue: וּנְתַתִּים在复兴语境中的含义
  choice: 译为“安置他们”
  alternative: 译为“坚立他们”或按字面译为“放置他们”
  rationale: “安置”保留נתן的放置义及复兴后的稳定意味，但不把稳定、坚固等推论提升为唯一明说的含义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“立……之约”“永约”“圣所”等保留经文的盟约和敬拜语汇；句式简洁，避免古奥表达。
