  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א עַל הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם הָ/עֲצָמוֹת֙ הַ/יְבֵשׁ֔וֹת שִׁמְע֖וּ דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/004.yaml
  text: Then he said to me[a], “Prophesy over these bones, and say to them, ‘Dry bones, hear the word of Yahweh.’”
translation:
  language: zh_hans
  text: 他又对我说：“你要对这些骸骨说预言，对它们说：‘枯干的骸骨啊，要听雅威[a]的话！’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה）；传统上常以“主”代读，也有译作“耶和华”的。
    reason: 说明神名的原文字形、传统代读方式及常见替译。
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他又对我说
  rationale: וַ־推动叙事向前；“又”自然承接上文，同时保留动作次序。
- source_word: הִנָּבֵא עַל הָעֲצָמוֹת הָאֵלֶּה
  choice: 你要对这些骸骨说预言
  rationale: הִנָּבֵא是נבא的命令式，译为“说预言”；עַל在此指预言所针对或面对的对象，译作“对”既自然，也不误导为谴责性的“攻击”。
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 对它们说
  rationale: 直译אמר的普通言说义，并清楚保留骸骨作为受话对象。
- source_word: הָעֲצָמוֹת הַיְבֵשׁוֹת
  choice: 枯干的骸骨啊
  rationale: 保留形容词“枯干”和直接呼语；“啊”在现代汉语中自然标明呼格。
- source_word: שִׁמְעוּ
  choice: 要听
  rationale: 保留复数命令语气及先知话语中的庄重意味；“要听”比单独“听”更清楚表达命令。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: דָּבָר在先知公式中译作“话”；יהוה按其专名性质音译为“雅威”，不以称号取代。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。音译“雅威”保留其专名性质；脚注说明希伯来字形及传统替代读法，避免把有争议的发音呈现为毫无说明的定论。
- issue: 对无生命骸骨发出命令
  choice: 保留直接呼语和命令：“枯干的骸骨啊，要听”
  alternative: 意译为让以西结向以色列人宣告
  rationale: 异象本身刻意让先知直接向骸骨说话；不提前把骸骨解释为其象征对象，以保留经文的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“骸骨”比“骨头”更符合异象语境和经文语体；句式保留原文连续命令与直接引语的结构。
