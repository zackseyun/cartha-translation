  text: וְ/נָתַתִּי֩ עֲלֵי/כֶ֨ם גִּדִ֜ים וְֽ/הַעֲלֵתִ֧י עֲלֵי/כֶ֣ם בָּשָׂ֗ר וְ/קָרַמְתִּ֤י עֲלֵי/כֶם֙ ע֔וֹר וְ/נָתַתִּ֥י בָ/כֶ֛ם ר֖וּחַ וִ/חְיִיתֶ֑ם וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/006.yaml
  text: I will put sinews on you[a], and I will bring flesh up over you, and I will cover you with skin, and I will put breath in you, and you will live. Then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我必在你们身上加上筋腱，使肉长在你们身上，又用皮肤覆盖你们；我必将气息[a]放在你们里面，你们就会活过来。你们就知道我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灵”或“风”。希伯来语רוּחַ兼有这三种含义；以西结书37章有意运用了这个词的多重含义。
    reason: 保留原词在本章中的词义双关和神学张力。
lexical_decisions:
- source_word: גִּדִים
  choice: 筋腱
  rationale: 指连接骸骨、使身体重新成形的组织。“筋腱”在现代汉语中自然明确，也比单用“筋”更准确。
- source_word: וְהַעֲלֵתִי עֲלֵיכֶם בָּשָׂר
  choice: 使肉长在你们上面
  rationale: 保留עלה使役形所表达的“使……长上来”这一动态过程，呈现身体逐步重构的画面。
- source_word: וְקָרַמְתִּי עֲלֵיכֶם עוֹר
  choice: 用皮覆盖你们
  rationale: 准确表达קרם在此处铺覆、包裹的意思，并与筋腱、肉、皮的重构次序相合。
- source_word: רוּחַ
  choice: 气息
  rationale: 紧接着的结果是“你们就会活过来”，因此此处以使身体获得生命的“气息”最贴合局部语境；该词也可指“灵”或“风”，其多义性由脚注保留。
- source_word: וִחְיִיתֶם
  choice: 你们就会活过来
  rationale: 在枯骨恢复生命的语境中，“活过来”比单说“活着”更自然地表达由死寂转为有生命的结果。
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: 你们就知道我是耶和华
  rationale: “就”自然体现前述复生之后产生的结果，同时保留原文认知公式的简洁力度。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名形式，使其与普通名词性的“主”有所区别。
theological_decisions:
- issue: רוּחַ在本章可指气息、灵或风
  choice: 正文译作“气息”，脚注保留“灵”和“风”
  alternative: 正文可译作“灵”或“风”
  rationale: 本句从筋腱、肉、皮推进到生命的恢复，且随后说“你们就会活过来”，局部语境偏向“气息”；但以西结书37章有意运用该词的多重含义，因此不在译文中排除其他读法。
- issue: וִחְיִיתֶם所表达的是持续存活还是恢复生命
  choice: 译作“活过来”
  alternative: 译作“活着”
  rationale: 受话对象是枯骨，整段描绘它们重新获得身体和生命；“活过来”明确传达此处的结果而不额外引入复活教义术语。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语；以短句和并列结构保留原文逐步重构身体的节奏。脚注标记紧随“气息”，即实际存在词义歧义之处。
