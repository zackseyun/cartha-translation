  text: וְ/הִנַּבֵּ֖אתִי כַּ/אֲשֶׁ֣ר צִוָּ֑/נִי וַ/תָּבוֹא֩ בָ/הֶ֨ם הָ/ר֜וּחַ וַ/יִּֽחְי֗וּ וַ/יַּֽעַמְדוּ֙ עַל רַגְלֵי/הֶ֔ם חַ֖יִל גָּד֥וֹל מְאֹד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/010.yaml
  text: So I prophesied as he commanded me[a], and the breath entered into them, and they lived and stood on their feet, an exceedingly great army.
translation:
  language: zh_hans
  text: 于是，我照他所吩咐我的去说预言；气息[a]就进入他们里面，他们便活了，都站立起来，成为一支极其庞大的军队。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灵”；也可指“风”。希伯来语“רוּחַ”可指“气息”、“风”或“灵”。
    reason: 保留原词“רוּחַ”的多义性，不将本段的气息／风／灵意象单向限定。
lexical_decisions:
- source_word: הִנַּבֵּאתִי
  choice: 我……说了预言
  rationale: 此处נבא的Hitpael形式指以先知身份按命令发言；“说了预言”在现代汉语中自然，也与上下文的先知行动相符。
- source_word: כַּאֲשֶׁר צִוָּנִי
  choice: 照他所吩咐我的
  rationale: 直接保留比较关系及隐含主语“他”；不擅自补成“耶和华”，因为希伯来文本在本句中没有明说。
- source_word: וַתָּבוֹא בָהֶם
  choice: 就进入他们里面
  rationale: בוא与介词ב共同表达进入其内；此译保留动作方向，也符合现代汉语表达。
- source_word: הָרוּחַ
  choice: 气息
  rationale: רוּחַ可指气息、风或灵；本句中它进入尸体并使其活过来，直接叙事功能偏向赋予生命的“气息”，同时以脚注保留“灵”的可能。
- source_word: וַיִּחְיוּ
  choice: 他们便活了
  rationale: 贴近חיה的基本含义，并自然表达从死亡转为有生命的状态。
- source_word: וַיַּעַמְדוּ עַל רַגְלֵיהֶם
  choice: 站在自己的脚上
  rationale: 保留希伯来语具体而鲜明的身体意象，不扩充为原文未明说的“起身”。
- source_word: חַיִל
  choice: 军队
  rationale: חַיִל在此异象中指集结站立的军事力量；“军队”比“群众”或“队伍”更准确。
- source_word: גָּדוֹל מְאֹד מְאֹד
  choice: 极其庞大
  rationale: 重复的מְאֹד表示强烈加强；汉语用“极其庞大”自然地传达高度强化，避免生硬重复“非常非常大”。
theological_decisions:
- issue: 山谷异象中רוּחַ的多义性
  choice: 正文译作“气息”
  alternative: 也可译作“灵”；该词还可指“风”
  rationale: 紧邻语境强调它进入被杀者并使他们活过来，故“气息”最能表达其叙事作用；然而全段有意交织风、气息与灵的意象，因此用脚注保存“灵”等语义可能，不把神学张力单向定死。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“于是……便……”保持叙事推进；“极其庞大的军队”既自然，也传达原文双重加强语气。
