  text: וְ/יָשְׁב֣וּ עַל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָתַ֨תִּי֙ לְ/עַבְדִּ֣/י לְ/יַֽעֲקֹ֔ב אֲשֶׁ֥ר יָֽשְׁבוּ בָ֖/הּ אֲבֽוֹתֵי/כֶ֑ם וְ/יָשְׁב֣וּ עָלֶ֡י/הָ הֵ֠מָּה וּ/בְנֵי/הֶ֞ם וּ/בְנֵ֤י בְנֵי/הֶם֙ עַד עוֹלָ֔ם וְ/דָוִ֣ד עַבְדִּ֔/י נָשִׂ֥יא לָ/הֶ֖ם לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/025.yaml
  text: They will dwell in the land that I gave to my servant Jacob[a], where your fathers dwelt; and they will dwell on it, they and their sons and their sons' sons, forever[c][b]. And David my servant will be prince for them forever.
translation:
  language: zh_hans
  text: 他们必居住在我赐给我仆人雅各的那地，就是你们祖先曾居住的地方；他们、他们的子孙和子孙的子孙都必居住在那里，直到永远。我的仆人大卫[a]必永远作他们的首领[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大卫”可能指应许中的大卫家统治者；本节没有说明这是历史上的大卫复起，还是未来的一位大卫后裔统治者。
    reason: 保留“我的仆人大卫”所指的解释开放性，不在正文中预先确定其为历史人物或未来大卫家人物。
  - marker: b
    text: 或译“领袖”或“统治者”。原文是“首领”，不是“王”。
    reason: 说明נָשִׂיא的词义范围，并保留其与“王”这一不同称号之间的区别。
lexical_decisions:
- source_word: וְיָשְׁבוּ
  choice: 必住
  rationale: ישב在此表示居住；“必”自然表达预言语境中的将来确定性，并保留全节重复的动词。
- source_word: עַל הָאָרֶץ
  choice: 在……那地
  rationale: עַל字面可作“在……之上”，但与“居住”和“地”连用时，现代汉语自然表达为“住在那地”。
- source_word: לְעַבְדִּי לְיַעֲקֹב
  choice: 赐给我仆人雅各
  rationale: 两个ל分别配合“赐给”和同位说明，保留“我仆人雅各”这一盟约性称谓。
- source_word: אֲבוֹתֵיכֶם
  choice: 你们祖先
  rationale: 希伯来语字面为“你们的父辈”，在此指历代先祖；“祖先”在现代汉语中准确、自然，不把所指范围误限于直接父亲。
- source_word: וְיָשְׁבוּ עָלֶיהָ
  choice: 必住在那里
  rationale: 以汉语处所代词自然承接“那地”，同时保留居住动作的重复与强调。
- source_word: הֵמָּה וּבְנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: 他们和他们的子孙，世世代代
  rationale: 原文逐字为“他们、他们的儿子和他们儿子的儿子”；“子孙，世世代代”简洁传达连续后代，并避免现代汉语中生硬冗长的表达。
- source_word: עַד עוֹלָם
  choice: 直到永远
  rationale: 保留עַד“直到”与עוֹלָם所表达的长久、永久之意。
- source_word: וְדָוִד עַבְדִּי
  choice: 我的仆人大卫
  rationale: 采用自然汉语语序，并保留“大卫”这一名称，不在正文中解释其身份。
- source_word: נָשִׂיא
  choice: 领袖
  rationale: נָשִׂיא指治理者、首领；“领袖”既表达统治职能，又避免误译成原文未使用的“王”。
- source_word: לָהֶם
  choice: 作他们的
  rationale: 希伯来语介词ל字面为“给/为”；汉语“作他们的领袖”自然表达其与群体之间的领导关系，而不额外强化为另一介词结构。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 与前句的永久性表述呼应，保留全节对恒久性的强调。
theological_decisions:
- issue: “我的仆人大卫”的身份
  choice: 正文直译为“我的仆人大卫”，不作解释性扩写。
  alternative: 历史上的大卫复起，或未来的大卫后裔/应许中的大卫式统治者。
  rationale: 原文只说“大卫”，没有在本节明确界定其所指；译文应保留这一末世性和弥赛亚性解释空间。
- issue: נָשִׂיא的统治称号
  choice: 领袖
  alternative: 首领；君王
  rationale: 原文用נָשִׂיא而非מֶלֶךְ“王”；译作“领袖”保留治理含义，同时不擅自升级为“君王”。
- issue: 后代延续与永久居住
  choice: “他们和他们的子孙，世世代代……直到永远”
  alternative: 逐字译为“他们、他们的儿子和他们儿子的儿子”。
  rationale: 现代汉语惯用“子孙，世世代代”表达连续后裔；这不限定应许的实现方式，也不消解“直到永远”的神学张力。
translation_notes:
  register: 采用现代、庄重且便于朗读的标准普通话。“那地”“直到永远”保留圣经应许语体；避免文言化。“祖先”按实际所指自然翻译。唯一脚注标记[a]已置于相关句末，合并说明“大卫”和נָשִׂיא两项紧密相关的歧义。
