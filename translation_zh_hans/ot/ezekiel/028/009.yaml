  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֶ/אָמֹ֤ר תֹּאמַר֙ אֱלֹהִ֣ים אָ֔נִי לִ/פְנֵ֖י הֹֽרְגֶ֑/ךָ וְ/אַתָּ֥ה אָדָ֛ם וְ/לֹא אֵ֖ל בְּ/יַ֥ד מְחַלְלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/009.yaml
  text: Will you still say[a], ‘I am a god,’ before the one who kills you? But you are a man, and not a god[c][b], in the hand of those who wound you.
translation:
  language: zh_hans
  text: 在杀你的人面前，你还会说[a]‘我是神’吗？然而，你不过是人，并不是神；你落在亵渎你的人手中。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用同一动词的不定式绝对形和限定动词连用，以加强语气；也可译作“你真还会说”或“你竟还要说”。
    reason: 说明希伯来语强调结构及可行译法。
  - marker: b
    text: “亵渎你的人”也可译作“玷辱你的人”“杀伤你的人”或“刺透你的人”；原词在这里可能兼有羞辱与施加致命伤害的意味。
    reason: 保留 מחלליך 在本语境中的词义歧义。
lexical_decisions:
- source_word: הֶאָמֹר תֹּאמַר
  choice: 你还会说
  rationale: 希伯来语以不定式绝对形配合同根未完成式，加强“说”的语气；“还会说”自然表达审判临到时仍如此声称的反诘意味。
- source_word: אֱלֹהִים / אֵל
  choice: 神
  rationale: 两词在本节分别用于君王自称为神及先知否定其神性。汉语“神”无需借助冠词区分，既保留对应关系，也不把这项狂妄自称擅自等同于以色列之神的专名。
- source_word: לִפְנֵי הֹרְגֶךָ
  choice: 在杀你的人面前
  rationale: 保留 לִפְנֵי 的临场关系和 הֹרְגֶךָ 的主动施事含义，呈现君王面对杀他之人时所受的反诘。
- source_word: אָדָם
  choice: 人
  rationale: 这里强调推罗君王只是人类，与神形成直接对照；现代汉语用“人”最自然，也不额外加入“必死之人”等解释。
- source_word: בְּיַד
  choice: 落在……手中
  rationale: 保留希伯来语“在手中”的权势意象，同时用现代汉语“落在……手中”清楚表达受制于人的处境。
- source_word: מְחַלְלֶיךָ
  choice: 亵渎你的人
  rationale: 按 חלל 的“亵渎、使为俗、玷辱”义翻译，保留讽刺张力：自称为神的人将遭人亵渎和羞辱；其在本语境中也可能指杀伤或刺透他的人，故以脚注注明。
theological_decisions:
- issue: 推罗君王自称为神的表达
  choice: “我是神”……“你不过是人，并不是神”
  alternative: “我是上帝”……“你是凡人，不是上帝”
  rationale: 本节是在讥讽一个人的自我神化，并非明确把他的自称写成以色列之神的专名。汉语“神”既忠实表达神性宣称，也保留原文的对照。
- issue: מְחַלְלֶיךָ 的审判意象
  choice: 亵渎你的人
  alternative: 杀伤你的人／刺透你的人／玷辱你的人
  rationale: “亵渎”保留了这位自称为神者反遭降卑、被当作凡俗之物的神学反讽，同时以脚注承认该词在此处可能偏重身体上的杀伤。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你不过是人，并不是神”保持原文尖锐的人神对照；分号使末句“落在……手中”既延续对照，又避免生硬照搬希伯来语词序。
