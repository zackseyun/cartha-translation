  yaml_path: translation/ot/ezekiel/028/004.yaml
  text: By your wisdom and by your understanding you made wealth for yourself[a], and you put gold and silver into your treasuries.
translation:
  language: zh_hans
  text: 你凭自己的智慧和聪明，为自己积聚了财富[a]，又将金银存入自己的宝库。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为自己积聚了力量、实力或资源”。希伯来语“חַיִל”可指财富、力量、实力或资源；本节提到金银和宝库，因此正文译作“财富”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָתְךָ
  choice: 凭自己的智慧
  rationale: 介词 בְּ 在此表示凭借或手段；“凭”自然地传达工具意义。
- source_word: וּבִתְבוּנָתְךָ
  choice: 和聪明
  rationale: תְּבוּנָה 可指理解力、洞察力或明辨；“聪明”与“智慧”搭配自然，同时保留二者的区别。
- source_word: עָשִׂיתָ לְךָ חָיִל
  choice: 为自己积聚了财富[a]
  rationale: חַיִל 语义范围包括财富、实力和资源；下文的金银与宝库支持“财富”。“积聚”比直译“制造”更符合现代汉语的经济语境。
- source_word: וַתַּעַשׂ
  choice: 又把……收入
  rationale: עָשָׂה 基本义为“做、造”，但与金银及宝库连用时，表示将财物积存其中；“收入”自然呈现这一结果。
- source_word: זָהָב וָכֶסֶף
  choice: 金银
  rationale: 准确而简洁地对应“金和银”，也是现代汉语中自然的固定并列表达。
- source_word: בְּאוֹצְרוֹתֶיךָ
  choice: 自己的宝库
  rationale: אוֹצָר 可指库房或宝库；因所存的是金银，“宝库”最切合语境。介词短语与“收入”结合，表达存入其中的方向和结果。
theological_decisions:
- issue: 推罗统治者讽喻中 חַיִל 的含义
  choice: 财富
  alternative: 实力、权势或资源
  rationale: 紧接着提到金银和宝库，主要所指显然是物质财富；但该词本身较宽的语义范围通过脚注保留，避免把潜在的“实力/资源”意味完全抹去。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“智慧和聪明”保留原文近义并列；“积聚”“收入宝库”使财富累积的语境自然明白，同时不添加原文没有的因果或道德判断。
