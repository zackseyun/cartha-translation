base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/008.yaml
  text: They will bring you down to the pit[c][b][a], and you will die the death of one slain in the heart of the seas.
translation:
  language: zh_hans
  text: 他们必使你下到坑中[a]；你必死在众海的中心，像被杀的人一样惨死[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”也可译作“坟墓”或“毁灭”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“被杀者的死亡”（“死亡”为复数），是一种强调暴力而惨烈死亡的表达。
    reason: lexical_alternative
  - marker: c
    text: “众海的中心”也可译作“众海之中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשַּׁחַת
  choice: 下到坑中
  rationale: שַׁחַת 可指坑、坟墓或毁灭；与“使……下去”连用时，具体的“坑”保留了下沉与死亡的意象，又不把它限定为某种特定的阴间概念。
- source_word: יוֹרִדוּךָ
  choice: 他们必使你下到
  rationale: 这是 ירד 的使役式，并带第二人称阳性单数后缀；“使你下到”明确保留其使役意义。
- source_word: וָמַתָּה
  choice: 你必……惨死
  rationale: 在先知性宣告中表达确定将来的死亡；结合后面的死亡方式译出，符合现代汉语表达。
- source_word: מְמוֹתֵי חָלָל
  choice: 像被杀的人一样惨死
  rationale: 原文直译为“被杀者的诸般死亡”，其中复数“死亡”具有强化意味，指暴力、惨烈的死亡；此译既传达惯用义，也保留“被杀的人”的形象。
- source_word: חָלָל
  choice: 被杀的人
  rationale: חָלָל 通常指被杀或受致命伤的人；“被杀的人”在本语境中自然且准确。
- source_word: בְּלֵב יַמִּים
  choice: 在众海的中心
  rationale: לֵב 字面为“心”，作空间用语时指中央或深处；“众海的中心”保留 יַמִּים 的复数形式以及推罗语境中的海洋意象。
theological_decisions:
- issue: 是否把 שַׁחַת 译成带有特定来世观念的术语
  choice: 坑
  alternative: 坟墓；深渊；毁灭之地
  rationale: 本节明确涉及审判和死亡，但 שַׁחַת 在此并不要求某种特定的阴间或来世教义。“坑”保留具体意象和词义张力，避免附加后期神学含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”体现先知宣告的确定性；分号保留两个并列审判动作。正文中的脚注标记按其所注释内容放置。
