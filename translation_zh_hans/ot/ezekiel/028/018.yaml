language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מֵ/רֹ֣ב עֲוֺנֶ֗י/ךָ בְּ/עֶ֨וֶל֙ רְכֻלָּ֣תְ/ךָ֔ חִלַּ֖לְתָּ מִקְדָּשֶׁ֑י/ךָ וָֽ/אוֹצִא אֵ֤שׁ מִ/תּֽוֹכְ/ךָ֙ הִ֣יא אֲכָלַ֔תְ/ךָ וָ/אֶתֶּנְ/ךָ֤ לְ/אֵ֨פֶר֙ עַל הָ/אָ֔רֶץ לְ/עֵינֵ֖י כָּל רֹאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/018.yaml
  text: By the abundance of your iniquities[a], in the unrighteousness of your trade, you profaned your sanctuaries[c][b]; so I brought out fire from your midst—it consumed you—and I turned you to ashes on the earth in the sight of all who saw you.
translation:
  language: zh_hans
  text: 因你罪孽众多，又因你贸易中的不义，你亵渎了你的圣所[a]。因此，我使火从你中间出来；火吞灭了你。我使你在地上化为灰烬，在所有看见你的人眼前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣所”原文为复数，也可译作“你的众圣所”或“你的神圣处所”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב עֲוֺנֶיךָ
  choice: 因你罪孽众多
  rationale: מִן与רֹב在此表达原因；“因……众多”自然传达因果关系，并保留עָוֹן所含的罪行与罪责分量。
- source_word: בְּעֶוֶל רְכֻלָּתְךָ
  choice: 又因你贸易不义
  rationale: עֶוֶל指不义、不公；רְכֻלָּה在以西结书27—28章的语境中指商业贸易。此译简洁地保留两者的修饰关系。
- source_word: חִלַּלְתָּ
  choice: 你就亵渎了
  rationale: חלל的Piel词形表示亵渎、玷污神圣之物；“亵渎”符合圣所语境及先知文体。
- source_word: מִקְדָּשֶׁיךָ
  choice: 你的圣所
  rationale: 原文为复数形式，所指可能是多处圣所或作为集合概念的神圣处所；现代汉语中“圣所”本身不显数，正文保持自然表达，并以脚注注明原文复数。
- source_word: וָאוֹצִא אֵשׁ מִתּוֹכְךָ
  choice: 因此，我使火从你中间出来
  rationale: 顺承式动词在此推进审判结果；“因此”显明语境中的后果关系，“从你中间出来”保留火由受审者内部发出的意象。
- source_word: הִיא אֲכָלַתְךָ
  choice: 将你吞灭
  rationale: 阴性代词回指阴性名词“火”；汉语无须标示语法性。“吞灭”保留אָכַל兼有吞吃与毁灭的强烈意象。
- source_word: וָאֶתֶּנְךָ לְאֵפֶר עַל הָאָרֶץ
  choice: 我使你……化为地上的灰烬
  rationale: 原文直译近于“把你交为灰烬”，这里表达被火烧成灰的结果；“化为地上的灰烬”在汉语中自然且保留地点意象。
- source_word: לְעֵינֵי כָּל רֹאֶיךָ
  choice: 在所有看见你的人眼前
  rationale: 保留“在……眼前”的可见性与公开受审意味，也贴近原文结构。
theological_decisions:
- issue: 推罗王哀歌中“你的圣所”的所指
  choice: 保留“你的圣所”这一祭祀性词语，不判定它专指历史统治者、推罗城及其宗教场所，还是具有超自然或预表层面的对象。
  alternative: 译成“你神圣的地位”等隐喻性表达，或明确解释为天上的圣所。
  rationale: מִקְדָּשֶׁיךָ本义明确涉及神圣处所且形态为复数，但上下文所指存在争议；直译能够保留经文本身的神学张力。
- issue: 火“从你中间出来”的审判意象
  choice: 保留火从受审者中间出来、继而将其吞灭的表述。
  alternative: 泛化为“我降火毁灭你”，不再保留火的来源。
  rationale: 原文明言מִתּוֹכְךָ“从你中间”，这可能具有内在败坏导致毁灭的修辞意味，但译文不进一步教义化解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“罪孽众多”“贸易不义”“亵渎”“吞灭”等措辞保留先知审判宣告的力度；句法适度调整，以明确因果和行动次序。所有脚注标记均置于正文相应词句之后。
