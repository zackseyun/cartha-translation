  yaml_path: translation/ot/ezekiel/028/015.yaml
  text: You were blameless in your ways from the day you were created[a], until unrighteousness was found in you.
translation:
  language: zh_hans
  text: 你从受造之日起，在所行的道路上无可指摘[a]，直到在你里面发现了不义。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“完全”。希伯来语可表示完整、纯全或无可指摘；这里因上下文谈到行为，译作“无可指摘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: 无可指摘
  rationale: 该词在这里修饰“道路”，侧重品行完整、无可责难，并非形而上意义的绝对完美；“无可指摘”自然地传达其道德语境。
- source_word: בִּדְרָכֶיךָ
  choice: 在所行的一切道路上
  rationale: 保留希伯来语“道路”的意象，同时用“所行的”明确它指生活方式和行为；复数形式以“一切道路”体现。
- source_word: מִיּוֹם הִבָּרְאָךְ
  choice: 从受造之日起
  rationale: 准确表达介词 מִן 的起点意义和被动的“受造”，并采用庄重而简洁的现代汉语。
- source_word: עַד
  choice: 直到
  rationale: 保留时间界限以及此后状态发生转变的语气。
- source_word: נִמְצָא
  choice: 发现了
  rationale: 汉语主动式无主句自然表达希伯来语被动意义，也保留“不义”究竟是后来产生还是后来显露的开放性。
- source_word: עַוְלָתָה
  choice: 不义
  rationale: 该词可指错误、不公或邪恶；“不义”既涵盖广泛的道德偏差，又不把含义限缩为社会层面的不公。
- source_word: בָּךְ
  choice: 在你里面
  rationale: 直接保留介词短语所表达的内在位置。
theological_decisions:
- issue: 是否把 תָּמִים 译为绝对意义的“完美”，从而引入关于推罗王身份与本体状态的更强神学主张
  choice: 无可指摘
  alternative: 完美
  rationale: 本节评价的是其“道路”即行为和生活方式；“无可指摘”保留道德完整之意，而不超出希伯来文，断言其在所有意义上绝对完美。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“受造之日”保留经文语体；“所行的一切道路”既保留原文意象，也让普通读者容易理解为行为和生活方式。脚注保留 תָּמִים 的词义幅度。
