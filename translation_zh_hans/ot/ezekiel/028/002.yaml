  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֶּן אָדָ֡ם אֱמֹר֩ לִ/נְגִ֨יד צֹ֜ר כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן גָּבַ֤הּ לִבְּ/ךָ֙ וַ/תֹּ֨אמֶר֙ אֵ֣ל אָ֔נִי מוֹשַׁ֧ב אֱלֹהִ֛ים יָשַׁ֖בְתִּי בְּ/לֵ֣ב יַמִּ֑ים וְ/אַתָּ֤ה אָדָם֙ וְֽ/לֹא אֵ֔ל וַ/תִּתֵּ֥ן לִבְּ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/002.yaml
  text: 'Son of man[a], say to the prince of Tyre, ‘Thus says the Lord GOD: Because your heart is proud, and you say, “I am a god; I sit in the seat of gods in the heart of the seas,” yet you are a man and not a god[b], though you set your heart like the heart of gods.”'
translation:
  language: zh_hans
  text: “人子啊，你要对推罗的领袖说：‘主耶和华如此说：因为你心里高傲，说：“我是神明；我坐在众神的座位上，在众海的中心。”[a] 然而，你不过是人，并不是神明；你却使自己的心如同众神的心。[b]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我是神；我坐在神的座位上，在众海的中心。”这里的希伯来语 אֵל／אֱלֹהִים 也可按单数理解。
    reason: alternative_reading
  - marker: b
    text: 或译：“你却使自己的心如同神的心。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中耶和华对先知的惯常称呼；保留希伯来语的固定表达及其文学连贯性。
- source_word: לִנְגִיד צֹר
  choice: 对推罗的领袖
  rationale: נָגִיד 指领袖、统治者或首领。译作“领袖”既自然，也保留本节与后文 מֶלֶךְ（王）在用词上的区别。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 按现代中文圣经的通行表达，同时译出 אֲדֹנָי 与神的专名 יהוה，避免将两者合并。
- source_word: יַעַן גָּבַהּ לִבְּךָ
  choice: 因你心高气傲
  rationale: 希伯来语直译为“你的心高举”；“心高气傲”自然传达其骄傲自大的含义，并保留 יַעַן 的因果关系。
- source_word: אֵל אָנִי
  choice: 我是神明
  rationale: 此处是异教统治者自称具有神性。“神明”能表达泛指的神祇身份，而不必然等同于以色列独一的神；单数“神”的读法仍在脚注中保留。
- source_word: מוֹשַׁב אֱלֹהִים
  choice: 众神的座位
  rationale: מוֹשָׁב 可指座位或居所；此处“座位”与统治者自我神化的语境贴合。אֱלֹהִים 按复数理解为“众神”，但其单数读法见脚注。
- source_word: בְּלֵב יַמִּים
  choice: 在海洋中心
  rationale: 希伯来语字面为“在众海之心”；“海洋中心”保留中心位置的意象，同时符合自然现代汉语。
- source_word: וְאַתָּה אָדָם וְלֹא אֵל
  choice: 然而，你不过是人，并不是神明
  rationale: 清楚呈现 אָדָם 与 אֵל 之间的人神对比；“不过”传达神谕对其狂妄宣称的驳斥。
- source_word: וַתִּתֵּן לִבְּךָ כְּלֵב אֱלֹהִים
  choice: 却把自己的心当作众神的心
  rationale: 保留重复出现的“心”及“如同／当作”的比较关系，不把希伯来人观中的“心”径直改释为“思想”或“智慧”。אֱלֹהִים 的单数读法另见脚注。
theological_decisions:
- issue: 统治者夸口中的 אֵל／אֱלֹהִים 应理解为泛指或复数神祇，还是独一的神
  choice: 正文译作“神明／众神”，表达统治者泛称神性并自我神化。
  alternative: “我是神；我坐在神的座位上”；末句也可译作“把自己的心当作神的心”。
  rationale: אֵל 可泛指一位神，אֱלֹהִים 则可按语境作复数“众神”或单数“神”。推罗统治者的自高和海洋背景支持正文的泛指／复数理解，但原文并未排除单数读法，因此用脚注保留神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“人子”“主耶和华”保留先知文学的传统辨识度；其余措辞避免古奥。正文保留“心”的重复和人神对照，并以脚注明示 אֵל／אֱלֹהִים 的单复数歧义。
