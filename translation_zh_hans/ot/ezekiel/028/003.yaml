  yaml_path: translation/ot/ezekiel/028/003.yaml
  text: Look[a], you are wiser than Danel; no hidden thing is obscure to you.
translation:
  language: zh_hans
  text: 看哪，你比达内尔[a]更有智慧；没有任何隐秘的事能使你感到困惑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“达内尔”；传统译作“但以理”。这里的拼写少了较常见形式中的字母 yod，因此正文保留希伯来文的形式，同时注明传统认定。
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 用于引出带强调意味的宣告，既保留原文的指示和提醒语气，也符合庄重而易懂的现代中文表达。
- source_word: חָכָם
  choice: 更有智慧
  rationale: 该词本身意为“有智慧”，但后接比较介词 מ־，因此在中文中明确译出比较义“比……更有智慧”。
- source_word: מ/דנאל
  choice: 比达内勒
  rationale: 马所拉文本的辅音形式是 דנאל（Danel），不同于较常见的“但以理”所对应的拼写；正文按此形式音译为“达内勒”，传统认定则收入脚注。
- source_word: כָּל סָתוּם
  choice: 没有任何隐秘的事
  rationale: 该短语指一切被隐藏、封闭而不显明的事。“隐秘的事”保留其具体语义，又是自然的现代中文。结合后面的否定词 לֹא，整体译作“没有任何……”。
- source_word: לֹא עֲמָמוּךָ
  choice: 对你是晦暗的
  rationale: 动词表达昏暗、模糊不明，而不只是被隐藏。译作“晦暗”可与前面的“隐秘”保持语义区别，并保留原文“隐秘之事对你并不模糊”的表达张力。
theological_decisions:
- issue: דנאל所指人物的身份
  choice: 正文保留文本形式，译作“达内勒”
  alternative: 直接译作“但以理”
  rationale: 本节的拼写缺少较常见人名“但以理”中的 yod；此人究竟是否就是较熟悉的但以理，文本本身没有明确解决，因此不在正文中替读者作出认定，而以脚注说明传统译法。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“看哪”保留先知宣告的强调语气；分号呈现两分句之间紧密的解释关系。末句略带形式对应，以保留“隐秘”与“晦暗”两个不同希伯来词之间的区别，避免将其简化为同一概念。
