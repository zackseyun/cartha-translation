source:
  edition: WLC
  text: בְּ/רֹ֣ב רְכֻלָּתְ/ךָ֗ מָל֧וּ תוֹכְ/ךָ֛ חָמָ֖ס וַֽ/תֶּחֱטָ֑א וָ/אֶחַלֶּלְ/ךָ֩ מֵ/הַ֨ר אֱלֹהִ֤ים וָֽ/אַבֶּדְ/ךָ֙ כְּר֣וּב הַ/סֹּכֵ֔ךְ מִ/תּ֖וֹךְ אַבְנֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/016.yaml
  text: By the abundance of your trade[a], your midst was filled with violence, and you sinned; so I cast you as profane from the mountain of God, and I destroyed you, O guardian cherub[c][b], from the midst of the stones of fire.
translation:
  language: zh_hans
  text: 因你的贸易繁多[a]，你里面充满了强暴，你也犯了罪。因此，我视你为不洁，将你从上帝的山上逐出[b]；护卫的基路伯啊[c]，我使你从火焰之石中消失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因你经商众多”或“因你贸易兴盛”；希伯来词也可指贩运。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“我使你失去圣洁”。这里的希伯来动词意为使之不再圣洁、视为不洁；结合“从上帝的山上”，语境很可能包含从圣地逐出的意思。
    reason: lexical_alternative
  - marker: c
    text: 或译“遮盖的基路伯”。希伯来词的字面意思是“遮盖、荫庇”，在这里可表达守护的职能。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב רְכֻלָּתְךָ
  choice: 因你的贸易繁多
  rationale: בְּרֹב在这里表达原因或伴随情形；רְכֻלָּה可指贸易、经商或贩运。“因你的贸易繁多”既保留因果关系，也不把贸易预设为非法活动。
- source_word: מָל֧וּ תוֹכְךָ חָמָס
  choice: 你里面就充满了强暴
  rationale: מָל֧וּ在形态上是复数主动形式，但施事者没有明说；用汉语结果式表达，可避免武断补出主语，同时保留“内部充满强暴”的意象。
- source_word: חָמָס
  choice: 强暴
  rationale: 该词常指暴力及残酷不义。“强暴”是简洁而具有圣经语体的对应词，同时涵盖暴力性恶行。
- source_word: וַתֶּחֱטָא
  choice: 你也犯了罪
  rationale: 直接表达动词“犯罪”，并以“也”承接前句的发展，不额外强化希伯来文没有明说的逻辑关系。
- source_word: וָאֶחַלֶּלְךָ מֵהַר אֱלֹהִים
  choice: 我把你当作污秽的，从上帝的山驱逐出去
  rationale: חלל的加强词干表示使之不再圣洁、当作俗污之物；与“从……山”连用时含有从圣地逐出的语境意义。此译兼顾礼仪性的失圣与实际驱逐。
- source_word: וָאַבֶּדְךָ
  choice: 我把你……除灭
  rationale: אבד的使役/加强用法可表示毁灭、使消亡或除去。“除灭”保留其强烈程度，又适合从某处移除的上下文。
- source_word: כְּרוּב הַסֹּכֵךְ
  choice: 护卫的基路伯
  rationale: כְּרוּב采用现代中文圣经常用名称“基路伯”；סכך本义为遮盖、荫庇，在此描述基路伯的守护职能，正文译作“护卫的”，并以脚注保留字面选择。
- source_word: מִתּוֹךְ אַבְנֵי אֵשׁ
  choice: 从火焰之石中
  rationale: 保留“石”与“火”的神秘意象，不将其解释为某种具体宝石或自然现象；“火焰之石”也避免把“火石”误解为燧石。
theological_decisions:
- issue: 受话者究竟是人间君王、基路伯，还是具有超自然或预表意义的形象
  choice: 保留第二人称直称和“基路伯”的伊甸园/圣所意象，不进一步认定其身份
  alternative: 将整段完全化约为君王隐喻，或明确译成撒但及其远古堕落
  rationale: 本节本身直接称受话者为“基路伯”，却处在针对推罗君王的预言语境中。翻译应保存这种张力，不把某一神学解释写进正文。
- issue: וָאֶחַלֶּלְךָ是否仅表示亵渎，还是包含逐出圣地
  choice: 译为“把你当作污秽的，从上帝的山驱逐出去”
  alternative: 仅译为“我亵渎了你”或“我使你成为俗污”
  rationale: 动词具有使之失去神圣地位的礼仪含义，而מֵהַר אֱלֹהִים又明确指出与上帝之山分离；正文兼顾两面，并用脚注说明字面语义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“强暴”“除灭”保留先知文学的力度；“火焰之石”维持原文刻意神秘的意象。脚注按正文出现次序标为[a]、[b]、[c]。
