reference: Ezekiel 28:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹֽא יִהְיֶ֨ה ע֜וֹד לְ/בֵ֣ית יִשְׂרָאֵ֗ל סִלּ֤וֹן מַמְאִיר֙ וְ/ק֣וֹץ מַכְאִ֔ב מִ/כֹּל֙ סְבִ֣יבֹתָ֔/ם הַ/שָּׁאטִ֖ים אוֹתָ֑/ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/024.yaml
  text: And the house of Israel will no longer have a brier that causes bitterness or a thorn that causes pain from all those around them who despise them[a]. Then they will know that I am the Lord GOD.
translation:
  language: zh_hans
  text: 以色列家必不再有从四围所有藐视他们的人而来的、使人愁苦的荆棘和使人痛苦的刺。[a]这样，他们就知道我是主雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使人愁苦的荆棘”也可译作“令人苦毒的刺”；希伯来文以尖锐、伤人的植物比喻四围敌对、藐视以色列的人。
    reason: 说明סִלּוֹן מַמְאִיר的可译幅度，并保留其植物比喻及与周围藐视者的关联。
lexical_decisions:
- source_word: סִלּוֹן
  choice: 荆棘
  rationale: 指带刺、能伤人的植物；与后面的“蒺藜”构成近义平行，同时保留两个不同的植物意象。
- source_word: מַמְאִיר
  choice: 扎人
  rationale: 该词修饰סִלּוֹן，强调尖刺造成伤害或刺激的作用；译为“扎人”既具体又符合汉语植物意象。
- source_word: קוֹץ
  choice: 蒺藜
  rationale: 指刺人的植物或尖刺；采用“蒺藜”以区别于前面的“荆棘”，保留希伯来文的平行结构。
- source_word: מַכְאִב
  choice: 伤人
  rationale: 该分词具有使人疼痛、造成伤害的含义；“伤人”简洁地传达其使动效果。
- source_word: מִכֹּל סְבִיבֹתָם
  choice: 来自四围一切……的人
  rationale: 这里所指的是以色列四周敌对的人群，而不只是地理环境；此译法保留“从/来自”和“一切四围”的范围。
- source_word: הַשָּׁאטִים אוֹתָם
  choice: 藐视他们的人
  rationale: 该分词表达轻蔑、鄙弃的敌对态度；“藐视”庄重、明确，也符合现代汉语。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留这一具有群体和盟约色彩的固定称谓，不简化为“以色列”。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי译为“主”，四字神名以汉语圣经传统中通行的专名“耶和华”表达，避免把组合称号译成重复的“主”。
- source_word: וְיָדְעוּ כִּי אֲנִי
  choice: 这样，他们就知道我是
  rationale: 连接词在此承接前述应许并表达结果；“这样……就……”自然呈现其后果关系。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 原文明确使用四字神名。正文采用现代中文读者熟悉且能作为专名识别的“耶和华”，同时以“主”对应אֲדֹנָי；不把神名泛化为普通称号，也不借此加入宗派性解释。
- issue: 荆棘与蒺藜所指的关系
  choice: 保留植物比喻，并以“来自……之人”表明这些伤害源于周围藐视以色列的人
  alternative: 直接释义为“敌对的邻国不再伤害以色列”
  rationale: 原文将周围敌对者比作带刺伤人的植物。保留比喻可维持其诗性和审判语境中的张力，不将“周围的人”过度限定为国家或民族。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“以色列家”和“主耶和华”保留经文的正式称谓；“扎人荆棘、伤人蒺藜”形成简洁平行，并避免生硬照搬希伯来语序。
