  yaml_path: translation/ot/ezekiel/028/005.yaml
  text: By your great wisdom in your trade you increased your wealth[c][b][a], and your heart became proud because of your wealth.
translation:
  language: zh_hans
  text: 你凭着丰富的智慧，借着贸易[a]增加了你的财富[b]；你的心便因你的财富而骄傲[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “贸易”也可译作“经商”或“商业活动”；希伯来语指商业往来。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“财富”的希伯来词也可指“资财”“资源”，在其他语境中还可指“力量”或“实力”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“你的心升高了”，这是表示变得骄傲的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב חָכְמָתְךָ
  choice: 凭丰富的智慧
  rationale: בְּ加רֹב可表示凭借或方式；“凭丰富的智慧”自然地保留“借着丰盛的智慧”这一含义。חָכְמָה在商业语境中也可含实际才干或精明之意，但译作“智慧”可保留其基本词义及上下文中的讽刺张力。
- source_word: בִּרְכֻלָּתְךָ
  choice: 在贸易中
  rationale: רְכֻלָּה在《以西结书》中常指经商、贸易活动。“在贸易中”既贴近原文介词结构，也符合推罗商业语境。
- source_word: הִרְבִּיתָ
  choice: 增加了
  rationale: רבה的使役式表示使之增多或增大；“增加了”准确表达这一使役意义。
- source_word: חֵילֶךָ / בְּחֵילֶךָ
  choice: 自己的财富 / 因财富
  rationale: חַיִל可指力量、能力、资源或财富；本节处于贸易致富的语境，译作“财富”最为贴切。第二处的בְּ按原因理解，译作“因”。
- source_word: וַיִּגְבַּהּ לְבָבְךָ
  choice: 你的心……高傲
  rationale: 原文直译为“你的心高了”，是表示骄傲自大的习语。“心……高傲”既清楚传达含义，也部分保留原文关于内心升高的形象。
theological_decisions:
- issue: חַיִל在本节应理解为财富还是力量
  choice: 财富
  alternative: 力量、权势、资源
  rationale: 上下文集中描写推罗借贸易获得富足，因此“财富”最符合直接语境；脚注保留该词较宽的语义范围，避免排除“资源”乃至由财富产生的“实力”这一层潜在意味。
- issue: “心升高”这一骄傲习语应直译还是意译
  choice: 你的心因财富而高傲
  alternative: 你的心因财富而升高
  rationale: 正文采用现代汉语可直接理解的习语意义，同时由脚注说明希伯来文的字面形象，不额外引入神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在贸易中增加了自己的财富”紧贴原文商业语境；分号呈现致富与骄傲之间的结果推进。所有词义上的真实余地均在脚注中保留。
