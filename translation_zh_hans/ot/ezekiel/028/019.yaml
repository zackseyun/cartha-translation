  text: כָּל יוֹדְעֶ֨י/ךָ֙ בָּֽ/עַמִּ֔ים שָׁמְמ֖וּ עָלֶ֑י/ךָ בַּלָּה֣וֹת הָיִ֔יתָ וְ/אֵינְ/ךָ֖ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/019.yaml
  text: All who know you among the peoples are appalled at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: zh_hans
  text: 万民[a]中所有认识你的，都因你而惊骇；你成了可怖之物[b]，你将永远不复存在。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国中”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你成了恐怖”或“你成了令人恐惧的对象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יוֹדְעֶיךָ
  choice: 所有认识你的
  rationale: 保留כָּל的全称范围，并将ידע的复数分词自然译为对这些人的一般描述，不限定为过去认识。
- source_word: בָּעַמִּים
  choice: 各族中
  rationale: עַמִּים指多个民族或族群；“各族中”既保留复数和范围关系，也比政治意味较强的“列国中”更贴近原词。
- source_word: שָׁמְמוּ עָלֶיךָ
  choice: 都因你而惊骇
  rationale: שמם在此表示面对审判结局时震惊、骇异；על可表示这种反应所针对的对象或原因。“因你而惊骇”自然表达两者，同时保留原因与对象之间的一定弹性。
- source_word: בַּלָּהוֹת הָיִיתָ
  choice: 你成了令人恐惧之物
  rationale: בַּלָּהוֹת形式为复数，但在谓语位置可表达极度恐怖的状态或成为恐怖对象；此译法避免生硬的“众恐怖”，并保留客观引发恐惧的含义。
- source_word: וְאֵינְךָ עַד־עוֹלָם
  choice: 永远不复存在
  rationale: 存在否定式אֵינְךָ与עַד־עוֹלָם共同强调不可逆转的终局；“不复存在”符合本段审判宣告的结果意味，而不把经文扩展为超出本神谕范围的系统教义。
theological_decisions:
- issue: 末句在审判哀歌中的终结力度
  choice: 译为“永远不复存在”，表达彻底且不可逆的消失。
  alternative: “你永远不再有了”或“你直到永远都不存在”
  rationale: 原文以存在否定式加“直到永远”形成强烈的终结宣告。译文保留这项修辞力度，但不据此断定经文所指对象之外的灵魂、末世或永刑教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“各族”对应复数עַמִּים；“惊骇”传达שמם在灾难与审判语境中的震惊恐惧；末句简洁有力，呼应神谕的终结语气。
