  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神名 YHWH；传统中文译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事连接形式与整句共同构成先知书常见的启示引介语；中文以“……的话临到……”自然表达，无须另译为“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在先知性公式中，דָּבָר指上帝传给先知的话语或信息；“话”既保留固定表达，也符合现代中文习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，并用脚注说明其希伯来文形式及另一常见音译。
- source_word: אֵלַי
  choice: 我
  rationale: 介词 אֶל 加第一人称单数后缀表示方向；在“临到我”中准确、自然地体现这一关系。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文的直接话语；“说”是简洁而惯常的中文表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最通行、辨识度最高的专名“耶和华”，不以“主”这一称号代替；脚注保留“雅威”这一较接近学界重构发音的译法。
translation_notes:
  register: 采用现代、庄重而自然的先知书引介语。“耶和华的话临到我”保留希伯来文公式的结构；句末“说”承接下一节的直接引语。
