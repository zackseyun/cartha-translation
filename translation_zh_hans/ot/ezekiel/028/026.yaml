base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/026.yaml
  text: They will dwell on it securely, and they will build houses and plant vineyards. They will dwell securely when I execute judgments on all those who treat them with contempt all around them. Then they will know that I am the LORD their God.
translation:
  language: zh_hans
  text: 他们必安然居住在那地，建造房屋，栽种葡萄园。当我向他们四围一切蔑视他们的人施行审判时，他们必安然居住。这样，他们就知道我是耶和华他们的神。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשְׁבוּ עָלֶיהָ לָבֶטַח
  choice: 他们必安然居住在那地
  rationale: לָבֶטַח表达安全、无惧的居住状态；עָלֶיהָ的阴性单数所指由上文的土地而来，汉语用“那地”自然补明。
- source_word: בַּעֲשׂוֹתִי שְׁפָטִים
  choice: 我……施行审判时
  rationale: 保留神亲自执行司法性裁决的含义，并以“时”表达בּ加不定式结构的时间关系。
- source_word: הַשָּׁאטִים אֹתָם
  choice: 蔑视他们的人
  rationale: שׁאט表示轻蔑、藐视；“蔑视”准确而符合现代庄重汉语。
- source_word: מִסְּבִיבוֹתָם
  choice: 四周所有……的人
  rationale: 保留敌对者环绕以色列的空间含义，修饰“人”而非蔑视这一动作。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，区别于一般称号“主”。
theological_decisions:
- issue: 安居与审判的关系
  choice: 译为“我……施行审判时，他们必安然居住”
  alternative: 译为“因为我……施行审判，他们必安然居住”
  rationale: 原文בַּעֲשׂוֹתִי可表达时间或情境关系；正文保留较直接的时间表达，不把因果关系说得强于原文。
- issue: 认识耶和华的结果句
  choice: “这样，他们就知道”
  alternative: “他们必知道”
  rationale: וְיָדְעוּ在语境中承接神的审判与安居，兼具结果和将来意味；“这样……就”自然呈现这一联系。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文；保留原文两次“安然居住”的强调，不为避免重复而删减。
