id: EZK.28.7
reference: Ezekiel 28:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא עָלֶ֨י/ךָ֙ זָרִ֔ים עָרִיצֵ֖י גּוֹיִ֑ם וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל יְפִ֣י חָכְמָתֶ֔/ךָ וְ/חִלְּל֖וּ יִפְעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/007.yaml
  text: Therefore[a], behold, I am bringing strangers against you, the most ruthless of the nations; they will draw their swords against the beauty of your wisdom[c][b], and they will defile your splendor.
translation:
  language: zh_hans
  text: 所以，看哪，我要使外族人[a]来攻击你，就是列国中凶残的人；他们必拔出刀剑[b]，攻击你智慧的华美，并玷污你的光彩[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族人”或译“陌生人”“外人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“倒空他们的刀剑”，是指拔剑出鞘。
    reason: idiom_explanation
  - marker: c
    text: “玷污你的光彩”或译“亵渎你的光辉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 表达由上文罪状引出的审判后果，简洁自然，也保留清楚的推论关系。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留先知宣告的郑重提示作用；与后面的分词连用时，“我要”自然表达迫近而确定的行动。
- source_word: מֵבִיא עָלֶיךָ
  choice: 使……来攻击你
  rationale: 该结构表示把敌人带来对付受话者；中文如此表达既自然，又保留敌对方向。
- source_word: זָרִים
  choice: 外族人
  rationale: זָרִים可指陌生人、外人或外国人；本节军事入侵的语境支持“外族人”，同时在脚注保留“陌生人”的可能。
- source_word: עָרִיצֵי גּוֹיִם
  choice: 列国中凶残的人
  rationale: עָרִיץ指强暴、凶狠、令人畏惧的压迫者。译作“凶残的人”符合审判语境，但不把希伯来语构造强行解释成明确的最高级。
- source_word: וְהֵרִיקוּ חַרְבוֹתָם
  choice: 他们必拔出刀剑
  rationale: ריק基本义为“倒空”，与“刀剑”连用时是拔剑出鞘、准备攻击的形象化说法。正文采用现代汉语惯用表达，字面意象收入脚注。
- source_word: עַל יְפִי חָכְמָתֶךָ
  choice: 攻击你智慧的华美
  rationale: 保留“智慧的华美”这一属格式诗性表达，也保留受称颂的智慧如今成为攻击对象的反讽。
- source_word: וְחִלְּלוּ
  choice: 玷污
  rationale: piel词形表示使之俗化、亵渎或败坏其尊荣。对象是君王的光彩，并非明确的礼仪圣物，因此正文用“玷污”；“亵渎”的较强宗教色彩作为脚注备选。
- source_word: יִפְעָתֶךָ
  choice: 你的光彩
  rationale: 该词指光辉、灿烂的外观或荣美。“光彩”在现代汉语中自然，并能兼顾可见的辉耀与王者尊荣。
theological_decisions:
- issue: 推罗君王审判预言的指涉与语气
  choice: 按本节直接语境译为上帝借外族武力审判受话者的历史性先知宣告，不在正文加入其他身份认定。
  alternative: 把本节措辞进一步解释为某种宇宙性堕落或撒但堕落的暗示。
  rationale: 本节明说外族人、刀剑、智慧和光彩，直接描绘对推罗统治者的军事审判。任何更广的预表性理解均有争议，不应写入译文本身。
- issue: עָרִיצֵי גּוֹיִם是否表达最高级
  choice: 译作“列国中凶残的人”，保留构造本身的开放性。
  alternative: 译作“列国中最凶残的人”。
  rationale: 该短语可在语境中产生“列国中最凶残者”的强化效果，但希伯来语并无明示最高级形式；正文避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。“看哪”保留宣告的肃穆感；分号呈现来敌与其行动之间的推进关系。正文避免生硬直译，同时保留“智慧的华美”这一诗性张力。所有脚注标记均紧随相应词语或短语。
