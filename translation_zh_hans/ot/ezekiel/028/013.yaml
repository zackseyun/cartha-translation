source:
  edition: WLC
  text: בְּ/עֵ֨דֶן גַּן אֱלֹהִ֜ים הָיִ֗יתָ כָּל אֶ֨בֶן יְקָרָ֤ה מְסֻכָתֶ֨/ךָ֙ אֹ֣דֶם פִּטְדָ֞ה וְ/יָהֲלֹ֗ם תַּרְשִׁ֥ישׁ שֹׁ֨הַם֙ וְ/יָ֣שְׁפֵ֔ה סַפִּ֣יר נֹ֔פֶךְ וּ/בָרְקַ֖ת וְ/זָהָ֑ב מְלֶ֨אכֶת תֻּפֶּ֤י/ךָ וּ/נְקָבֶ֨י/ךָ֙ בָּ֔/ךְ בְּ/י֥וֹם הִבָּרַאֲ/ךָ֖ כּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/013.yaml
  text: 'You were in Eden[a], the garden of God; every precious stone was your covering: ruby, topaz, and diamond; beryl, onyx, and jasper; sapphire, turquoise, and emerald; and gold. The workmanship of your tambourines and your sockets was in you; on the day you were created[b], they were prepared.'
translation:
  language: zh_hans
  text: 你曾在伊甸，在上帝的园中；各样宝石作你的遮盖：红宝石、黄玉、钻石，绿柱石、缟玛瑙、碧玉，蓝宝石、绿松石、祖母绿，还有黄金。[a]你身上的手鼓和孔槽，都经过精工制作；在你受造之日，它们就预备好了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节若干宝石的确切种类不能确定；古代宝石名称与现代名称并非总能一一对应。例如，“红宝石”也可作“红玉髓”，“黄玉”或“绿柱石”也可能指贵橄榄石，“蓝宝石”可能指青金石，“绿松石”或“祖母绿”也可能指红榴石等。
    reason: lexical_alternative
  - marker: b
    text: 这几个希伯来词的组合含义难定。也可译作：“你身上的镶座和嵌槽都经过精工制作”，即把它们理解为珠宝制作术语，而不是手鼓及其孔槽。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵדֶן גַּן אֱלֹהִים
  choice: 在伊甸，在上帝的园中
  rationale: 保留“伊甸”这一专名及同位说明“上帝的园”，不把两者合并为较弱的意译。
- source_word: כָּל אֶבֶן יְקָרָה
  choice: 各样宝石
  rationale: 在宝石清单的语境中，“各样宝石”比逐字的“每一块贵重石头”更自然，同时保留范围广泛之意。
- source_word: מְסֻכָתֶךָ
  choice: 作你的遮盖
  rationale: 保留源于“遮盖”的基本意象，不擅自限定为衣服、首饰或防护层。
- source_word: אֹדֶם פִּטְדָה וְיָהֲלֹם
  choice: 红宝石、黄玉、钻石
  rationale: 采用现代读者熟悉的传统对应名称；古代宝石名称与现代矿物分类并不完全相合，故以脚注说明不确定性。
- source_word: תַּרְשִׁישׁ שֹׁהַם וְיָשְׁפֵה
  choice: 绿柱石、缟玛瑙、碧玉
  rationale: 采用常见的宝石译名，并避免在正文中加入无法确定的矿物学细分。
- source_word: סַפִּיר נֹפֶךְ וּבָרְקַת
  choice: 蓝宝石、绿松石、祖母绿
  rationale: 选用通行且易懂的名称；具体所指仍有争议，相关替代名称收入脚注。
- source_word: מְלֶאכֶת תֻּפֶּיךָ וּנְקָבֶיךָ
  choice: 鼓和孔槽的制作工艺
  rationale: 尽量反映马所拉元音所支持的“鼓”以及“孔、槽”之义，同时保留原文搭配的异常，不在正文中完全改写为首饰镶嵌术语。
- source_word: בְּיוֹם הִבָּרַאֲךָ כּוֹנָנוּ
  choice: 在你受造之日就预备好了
  rationale: 准确表达被动的“受造”和复数谓语“它们被预备妥当”，并以自然汉语呈现。
theological_decisions:
- issue: 以西结书28:13中受话者的身份及伊甸意象
  choice: 按原文直译伊甸、上帝的园和受造等崇高意象，不在译文中指明受话者究竟是推罗王、神话性人物还是撒但。
  alternative: 将本节明确解释为只指推罗王，或明确解释为兼指撒但或堕落的基路伯。
  rationale: 本节本身没有明说这些系统性身份判断；保留上下文中的诗性张力，可避免把特定教义解释写进经文。
- issue: “鼓和孔槽”是否属于乐器或珠宝工艺
  choice: 正文保留马所拉文本中可辨认的“鼓”和“孔槽”，脚注列出珠宝镶嵌工艺的读法。
  alternative: 正文译作“镶座和嵌槽”，完全按珠宝制作语境理解。
  rationale: 希伯来语组合艰涩，语境支持珠宝解释，而马所拉元音又支持乐器相关理解；正文与脚注共同保存这一真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“你曾在……”保持回顾性的诗歌语气；宝石清单以常用名称增强可读性，并用脚注诚实交代古代矿物名称的不确定性。末句保留原文略显突兀的工艺表达，不以流畅为由消除文本难点。
