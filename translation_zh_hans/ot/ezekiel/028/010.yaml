  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מוֹתֵ֧י עֲרֵלִ֛ים תָּמ֖וּת בְּ/יַד זָרִ֑ים כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/010.yaml
  text: You will die the death of the uncircumcised by the hand of foreigners[a], for I have spoken, declares the Lord GOD.
translation:
  language: zh_hans
  text: 你必像未受割礼的人一样，死于外族人之手[a]；因为我已经说过。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你必死未受割礼之人的众死”；这是以复数名词与同词根动词连用、强调死亡方式的表达，意思是“你必像未受割礼的人一样死”。
    reason: 说明原文复数名词与同词根动词连用的特殊表达。
lexical_decisions:
- source_word: מוֹתֵי עֲרֵלִים תָּמוּת
  choice: 你必像未受割礼的人一样死
  rationale: 原文直译为“你必死未受割礼之人的众死”，以同词根名词和动词连用来说明死亡的方式。中文用“像……一样死”自然传达其比较和羞辱意味，并避免生硬的复数表达。
- source_word: עֲרֵלִים
  choice: 未受割礼的人
  rationale: 该形容词在此作名词使用；译文保留“未受割礼”所带的身份及盟约背景，不泛化为“异教徒”。
- source_word: בְּיַד זָרִים
  choice: 在外族人手中
  rationale: בְּיַד是表示施事者的惯用语；“在……手中”既保留原文意象，也符合现代汉语。זָרִים在本审判语境中指外族人。
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: 因为我已经说了
  rationale: 保留כִּי所表达的理由，并以“已经”传达完成式所强调的确定性。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是庄严的先知宣告公式；现代中文以完整句表达较自然。אֲדֹנָי יְהוִה译为传统且清楚的“主耶和华”，既避免重复“主”，也保留神名。
theological_decisions:
- issue: “未受割礼的人之死”的含义
  choice: 保留“未受割礼”并明确为“像……一样死”
  alternative: 译作“你必死得像不洁的人”或仅作“你必受羞辱而死”
  rationale: 原文明确使用割礼用语，并借此描写死亡的方式及其羞辱性；不应把其盟约和文化意涵改写成解释性神学结论。
- issue: אֲדֹנָי יְהוִה中的神名
  choice: 主耶和华
  alternative: 主雅威／主上帝
  rationale: “主耶和华”在现代简体中文圣经语域中庄重且易懂，并将专名יהוה与称号אֲדֹנָי区分出来；不采用会抹去专名的“主上帝”。
translation_notes:
  register: 采用现代、庄重而通顺的普通话书面语。“外族人”比“陌生人”更准确地体现本段军事审判语境；分号连接判决与其神圣保证。
