base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/021.yaml
  text: Son of man[a], set your face toward Sidon, and prophesy against her.
translation:
  language: zh_hans
  text: “人子[a]啊，你要面向西顿，预言攻击她。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人”或“必死的人”。希伯来语直译为“人的儿子”，是上帝对以西结常用的称呼；此处并非基督论头衔。
    reason: 说明该希伯来惯用称呼的字面形式和语义范围，并避免将其误解为基督论头衔。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留希伯来语惯用称呼及其在《以西结书》中的反复用法；此处是对以西结的称呼，意为属世的人，并非基督论头衔。
- source_word: שִׂים פָּנֶיךָ
  choice: 面向
  rationale: 希伯来语直译为“把你的脸朝向”；现代汉语用“面向”既自然，又保留先知受命定向某地的具体意象。
- source_word: אֶל צִידוֹן
  choice: 西顿
  rationale: 介词 אֶל 在此表示朝向；“西顿”采用通行中文地名译法。
- source_word: וְהִנָּבֵא
  choice: 发预言
  rationale: 准确表达 נבא 的尼法勒命令式，在先知受命语境中简洁明确。
- source_word: עָלֶיהָ
  choice: 攻击她
  rationale: 在审判性预言语境中，על 与“发预言”连用具有敌对意义；阴性后缀指拟人化的西顿城，译作“她”以保留原文形式。
theological_decisions:
- issue: 如何翻译以西结所受的称呼 בֶּן אָדָם
  choice: 人子
  alternative: 世人；必死的人
  rationale: “人子”保留原文表达及全书的文学一致性。此处并非赋予以西结弥赛亚身份，而是强调他作为人的身份；脚注说明其语义范围，以免误解。
- issue: עָלֶיהָ 的关系含义
  choice: 攻击她
  alternative: 论到她
  rationale: 上下文是针对西顿的审判宣告，因此采用敌对义；同时不在正文中额外说明审判内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“面向”比逐字的“把脸朝向”更自然；“发预言攻击她”保留先知审判宣告的力度。
