base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/014.yaml
  text: You were an anointed guardian cherub[a], and I placed you on the holy mountain of God[b]; you walked in the midst of stones of fire.
translation:
  language: zh_hans
  text: 你曾是受膏、护卫的基路伯[a]；我曾把你安置在上帝的圣山上；你在火的石头之间行走。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护卫的”直译可作“遮盖的”或“荫庇的”；传统也译作“受膏、遮盖的基路伯”。
    reason: lexical_alternative
  - marker: b
    text: 本节开头“你”的希伯来语形式是阴性单数，而本节其余动词和后缀则是阳性单数；所指仍是单数的“你”。
    reason: textual_variant
lexical_decisions:
- source_word: כְּרוּב
  choice: 基路伯
  rationale: 采用现代中文圣经读者熟悉的专名，保留作为圣所与宝座护卫者的特定天上活物意象，不泛化为“天使”。
- source_word: מִמְשַׁח
  choice: 受膏
  rationale: 该词与膏立有关，在此与“基路伯”构成描述关系；译作“受膏”既自然，也保留分别为圣、受委任的意味。
- source_word: הַסּוֹכֵךְ
  choice: 护卫的
  rationale: 词根 סכך 的基本意象是遮盖、荫庇；在基路伯的圣所意象中具有护卫功能。正文用自然的“护卫”，脚注保留较直译的“遮盖”。
- source_word: וּנְתַתִּיךָ
  choice: 我把你安置
  rationale: נתן 在地点语境中可指放置、安置；“安置”准确表达上帝把受话者置于圣山这一动作，又不额外引入“任命”的含义。
- source_word: בְּהַר קֹדֶשׁ אֱלֹהִים
  choice: 在上帝的圣山上
  rationale: 按中文领属结构自然表达该希伯来语短语，并保留神圣山岳的崇高意象。介词 ב 在山岳语境中自然译为“在……上”。
- source_word: אַבְנֵי אֵשׁ
  choice: 火石
  rationale: 用简洁的偏正式结构保留“火之石”的奇异诗性意象，不解释为宝石、燃烧的石头或其他特定对象。
- source_word: הִתְהַלָּכְתָּ
  choice: 行走
  rationale: 保留 הלך 的基本动作意义；反身词干可能含来回走动之意，但正文不作过度具体化。
- source_word: אַתְּ
  choice: 你
  rationale: 希伯来语书写形式为阴性单数，但本节其余动词和后缀为阳性单数；现代汉语不标示第二人称语法性别，因此正文自然译作“你”，并以脚注说明形式异常。
theological_decisions:
- issue: 对推罗王的哀歌中受话者的身份
  choice: 保留“受膏的基路伯”“上帝的圣山”和“火石”等崇高的伊甸—圣所意象，不判定其仅为王权隐喻，也不明确断言其为王背后的超自然存在。
  alternative: 可理解为对推罗王的纯粹象征性描写、对某个超自然存在的描写，或兼具历史与原型意义的双重指涉。
  rationale: 希伯来文本本身采用高度象征性的神圣空间语言，却未在本节明确解释各意象与推罗王的对应关系；译文应保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“基路伯”沿用通行圣经术语；“火石”刻意保留原文简洁而含混的诗性意象。脚注标记均置于正文中，其中形式差异说明置于整节末尾，以免打断首句。
