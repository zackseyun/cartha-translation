  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּי בָ֞/הּ דֶּ֤בֶר וָ/דָם֙ בְּ/ח֣וּצוֹתֶ֔י/הָ וְ/נִפְלַ֤ל חָלָל֙ בְּ/תוֹכָ֔/הּ בְּ/חֶ֥רֶב עָלֶ֖י/הָ מִ/סָּבִ֑יב וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/023.yaml
  text: And I will send pestilence into her[a], and blood into her streets; the slain will fall in her midst by the sword all around her. Then they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我要使瘟疫临到她，使血流在她的街上[a]；被杀的人必在她中间倒下，刀剑从四面临到她。这样，他们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使她的街上发生流血事件”。原文直译为“血”，在这里可能指城中的暴力杀戮。
    reason: 说明 דָּם 的字面意义及其语境中的转喻含义。
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: 我要使……临到
  rationale: 该形式在先知审判宣告中表达将来的行动；这样译成现代汉语自然，也保留上帝主动施行审判的含义。
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 此词在先知书的审判语境中通常指作为灾祸临到的疫病；“瘟疫”准确而通俗。
- source_word: וָדָם בְּחוּצוֹתֶיהָ
  choice: 使她的街上有鲜血
  rationale: 保留 דָּם“血”的具体意象，同时用自然汉语表达城中出现暴力死亡的景象；脚注说明也可理解为“流血事件”。
- source_word: וְנִפְלַל חָלָל
  choice: 被杀的人必倒下
  rationale: 尽管动词形式较不寻常，חָלָל 在此指遭刀剑杀害的人；译文保留“倒下”的战争图像。
- source_word: בְּתוֹכָהּ
  choice: 在她中间
  rationale: 指城内，保留原文把西顿视为阴性单数的表达方式，并与上下文衔接。
- source_word: בְּחֶרֶב עָלֶיהָ מִסָּבִיב
  choice: 刀剑要从四面攻击她
  rationale: 将“刀剑”按希伯来语常见转喻理解为武力杀戮，并清楚表达 מִסָּבִיב 所描绘的四面围攻。
- source_word: וְיָדְעוּ
  choice: 这样，他们就知道
  rationale: 连接词在这里带结果意味；“这样……就……”符合现代汉语，也未加入原文没有的因果细节。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其作为上帝专名的功能音译，不以“主”等称号代替；“雅威”对应较通行的 Yahweh 读法。
theological_decisions:
- issue: 如何翻译上帝的专名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”，以对应学界通常重构的 Yahweh 读音，并明确保留其专名性质；“耶和华”是中文传统译法，但其语音形式主要承袭 Jehovah。
- issue: “刀剑”与倒下之人的句法关系
  choice: 刀剑要从四面攻击她，被杀的人必倒在她中间
  alternative: 被杀的人必因四围攻击她的刀剑倒在她中间
  rationale: 原文明确把死亡、刀剑和四面围攻连在一起，但修饰关系在译入汉语时可有不同组织方式。正文采用两个紧密相连的分句，保存图像和关联而不把句法关系解释得过死。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“她”延续上下文对西顿城的拟人化指称；分号区分灾祸宣告与其具体后果。
