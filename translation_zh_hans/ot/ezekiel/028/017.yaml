source:
  edition: WLC
  text: גָּבַ֤הּ לִבְּ/ךָ֙ בְּ/יָפְיֶ֔/ךָ שִׁחַ֥תָּ חָכְמָתְ/ךָ֖ עַל יִפְעָתֶ֑/ךָ עַל אֶ֣רֶץ הִשְׁלַכְתִּ֗י/ךָ לִ/פְנֵ֧י מְלָכִ֛ים נְתַתִּ֖י/ךָ לְ/רַ֥אֲוָה בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/017.yaml
  text: Your heart was lifted up because of your beauty[a]; you corrupted your wisdom because of your splendor. I cast you to the earth; I set you before kings[c][b], for them to look at you.
translation:
  language: zh_hans
  text: 你的心因你的美丽而高傲[a]；你因你的光彩败坏了你的智慧。我把你摔在地上，把你摆在列王面前[b]，让他们观看你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“你的心因你的美丽而高起来”。
    reason: 保留 גָּבַהּ לִבְּךָ 的空间隐喻及其“骄傲”含义。
  - marker: b
    text: 或译“使你在列王面前成为供人观看的对象”。
    reason: לִפְנֵי מְלָכִים נְתַתִּיךָ לְרַאֲוָה בָךְ 也可整体理解为在列王面前公开示众；该译法不扩大原文所明示的场景。
lexical_decisions:
- source_word: גָּבַהּ לִבְּךָ
  choice: 你的心……高傲
  rationale: 希伯来语直译为“你的心高起来了”，是表示骄傲的惯用说法；中文用“心……高傲”自然传达其道德含义，脚注保留原有空间意象。
- source_word: בְּיָפְיֶךָ
  choice: 因你的美丽
  rationale: 此处介词 ב 在上下文中表示原因；译为“因”清楚表达美丽成为高傲的缘由。
- source_word: שִׁחַתָּ חָכְמָתְךָ
  choice: 败坏了你的智慧
  rationale: שׁחת 表示损坏、败坏；与“智慧”搭配时，“败坏”既自然，又保留道德和才智受损的意味。
- source_word: עַל יִפְעָתֶךָ
  choice: 因自己的光彩
  rationale: עַל 在此表示原因；יִפְעָה 指耀眼的外观、光辉或华美。“光彩”与前句“美丽”形成对应，同时保留发光的意象。
- source_word: עַל אֶרֶץ הִשְׁלַכְתִּיךָ
  choice: 我把你摔在地上
  rationale: אֶרֶץ 可指地、地面或大地；在被抛落的审判语境中，“摔在地上”是自然有力的现代汉语，并体现 הִשְׁלִיךְ 的强制动作。
- source_word: לִפְנֵי מְלָכִים נְתַתִּיךָ
  choice: 把你摆在列王面前
  rationale: 原文直义是“把你置于列王面前”；“摆在”保留公开陈列的画面，又不先行加入“示众”等解释。
- source_word: לְרַאֲוָה בָךְ
  choice: 让他们观看你
  rationale: לְ 加不定式表达目的或结果；译文明确列王是观看者，并保留 ראה“看”的动词含义。
theological_decisions:
- issue: 本节受话者的身份
  choice: 按经文以第二人称单数呈现推罗王在骄傲中堕落的先知性哀歌，不在译文中进一步界定其身份。
  alternative: 可理解为单指人间君王，或人间君王的形象兼有对超自然叛逆者的象征性暗示。
  rationale: 本节本身没有明确作出后一种身份认定；译文应保留其高举、败坏和坠落的张力，避免加入经文未明说的神学结论。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“高傲”“败坏”“摔在地上”“列王”兼顾先知审判语气、原文意象和普通读者的可理解性；分号呈现两组因果关系，后半句则保留神主动施行审判的连续动作。
