base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/006.yaml
  text: 'Therefore thus says the Lord GOD: Because you have made your heart like the heart of a god,[a]'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：因为你使自己的心如同神明的心，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“如同神的心。”希伯来语 אֱלֹהִים 按语境可指“神”、“神明”或“众神”。
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 引出基于上文指控而来的结论；“所以”在现代汉语中自然清楚。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重和公式化表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 同时保留“主”这一称号和神的专名“耶和华”，并符合现代中文圣经语体。
- source_word: יַעַן
  choice: 因为
  rationale: 清楚表达引出神谕缘由的因果关系。
- source_word: תִּתְּךָ אֶת לְבָבְךָ
  choice: 你把自己的心当作
  rationale: 原文直译为“放置/设定你的心”；结合比较补语，汉语用“把……当作”可自然表达统治者对自己的内在认定，同时保留“心”的意象。
- source_word: לְבָבְךָ
  choice: 自己的心
  rationale: 保留希伯来文“心”的隐喻，涵盖思想、意志和内在自我。
- source_word: כְּלֵב אֱלֹהִים
  choice: 神明的心
  rationale: “神明”在此可表达某一神性存在，符合推罗君王自我神化的语境，又避免与“神的心”在汉语中被自然理解为独一真神；原文可能指“神”的歧义在脚注中保留。
theological_decisions:
- issue: 短语 כְּלֵב אֱלֹהִים 中 אֱלֹהִים 的理解
  choice: 神明
  alternative: 神
  rationale: 上下文谴责人的骄傲和自我神化；“神明”较自然地传达“一个神性存在”的意思，而不暗示经文肯定其内心真像以色列的神。由于希伯来词形也可指“神”，脚注保留这一可能。
translation_notes:
  register: 采用现代、庄重而易懂的先知书语体。“主耶和华如此说”保留神谕公式；“神明”用于呈现自我神化语境，并以脚注保存原文词义歧义。
