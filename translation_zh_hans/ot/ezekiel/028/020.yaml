  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为神名 YHWH；传统中文译作“耶和华”。
    reason: 说明正文“雅威”所对应的四字神名及其传统中文译名。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知书固定表达“耶和华的话临到……”中，“临到”自然、庄重，也准确传达话语来到先知的意思。
- source_word: דְבַר
  choice: 话
  rationale: 这里指来自上帝的先知性话语；“话”保留了希伯来文先知公式的传统表达及其神学分量，而不提前解释为“信息”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”表示四字神名，并用脚注说明原文形式及常见译法。
- source_word: אֵלַי
  choice: 我
  rationale: “临到我”自然表达介词短语所标明的领受者，即以西结。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节的直接神谕；中文用“说”简洁自然，并保留与下文的衔接。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最广为人知的专名“耶和华”，同时在脚注注明原文为 YHWH 及另一常见音译“雅威”，避免把专名仅处理为称号。
translation_notes:
  register: 采用现代、庄重而易懂的先知书表达。“耶和华的话临到我”保留固定神谕公式；句末“说”用于承接下一节。
