  text: 耶和华的话又临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 又临到
  rationale: 在先知书的固定表达“耶和华的话临到……”中，用“临到”自然传达神的话被赐下；“又”体现句首连接词在连续启示中的承接作用。
- source_word: דְבַר
  choice: 话
  rationale: 这里指来自神的言语性启示。“话”既保留先知公式的传统庄重感，也比“信息”更少解释性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法“耶和华”，作为四字神名的音译性表达，而不以“主”这一称号替代。
- source_word: אֵלַי
  choice: 到我
  rationale: 与“临到”搭配构成自然的现代中文表达，清楚表明以西结是领受神话语的人。
- source_word: לֵאמֹר
  choice: 说
  rationale: 引出随后神谕的具体内容；中文以“说”简洁、准确地再现这一引语公式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文保留中文传统且广为理解的专名“耶和华”，不以称号“主”取代；“雅威”是较接近现代学界拟音的另一选择，但会降低普通中文读者的熟悉度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留先知书反复出现的启示公式。“又”承接上文，“说”后的冒号符合现代中文引出后续直接话语的标点习惯。
