  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/קַבְּצִ֣/י אֶת בֵּ֣ית יִשְׂרָאֵ֗ל מִן הָֽ/עַמִּים֙ אֲשֶׁ֣ר נָפֹ֣צוּ בָ֔/ם וְ/נִקְדַּ֥שְׁתִּי בָ֖/ם לְ/עֵינֵ֣י הַ/גּוֹיִ֑ם וְ/יָֽשְׁבוּ֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לְ/עַבְדִּ֥/י לְ/יַעֲקֹֽב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/025.yaml
  text: 'Thus says the Lord GOD: When I gather the house of Israel from the peoples among whom they were scattered[a], and I show myself holy among them in the sight of the nations, then they will dwell on their own land that I gave to my servant Jacob.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“当我把以色列家从他们被分散在其中的各民族中招聚起来，并在列国眼前、在他们中间显为圣时，他们就必住在自己的土地上，就是我赐给我仆人雅各的那地。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号的两个要素；“耶和华”是现代中文圣经语域中对圣名的通行表达。
- source_word: בְּקַבְּצִי
  choice: 当我……招聚起来
  rationale: 介词 בְּ 加带第一人称后缀的不定词在此表示时间；“招聚”既贴近原义，也符合先知书复兴语境。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留原文的群体与盟约性称谓，不泛化为“以色列人”。
- source_word: הָעַמִּים
  choice: 各民族
  rationale: 与后文 הַגּוֹיִם“列国”作适度区分，并自然表达多个族群。
- source_word: נָפֹצוּ בָם
  choice: 他们所分散到的
  rationale: 反映 פוץ 的被动意义，并把 בָם 按处所关系自然译出。
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: 在他们中间显为圣
  rationale: 保留尼法勒式“被尊为圣／显为圣”的语义，并将 בָם 首先按处所理解；脚注保留工具性解释的可能。
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: 在列国眼前
  rationale: 保留原文视觉性和公开性的表达。
- source_word: וְיָשְׁבוּ עַל אַדְמָתָם
  choice: 他们就必住在自己的土地上
  rationale: יָשַׁב 在此指安定居住；“自己的”明确表达第三人称复数所有后缀。
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: 就是我赐给我仆人雅各的土地
  rationale: 自然衔接关系从句，并保留“我仆人雅各”这一称谓。
theological_decisions:
- issue: וְנִקְדַּשְׁתִּי בָם 中上帝“显为圣”的含义
  choice: 在他们中间显为圣
  alternative: 借着他们显为圣；在他们身上被尊为圣
  rationale: 此句强调上帝的圣洁在列国面前得到公开彰显，并非暗示上帝本身经历道德上的改善。בָם 可有处所或工具色彩，正文采用较直接的处所读法，脚注保存其他可能。
- issue: 复合称号 אֲדֹנָי יְהוִה 的表达
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”同时保留 אֲדֹנָי 的主权称号与 יהוה 的专名性质，符合中文先知书的庄重语域。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“以色列家”“列国”“显为圣”等用语保留原文的盟约性与神学张力；标点和句序按现代普通话调整。
