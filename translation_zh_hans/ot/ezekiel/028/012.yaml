  text: בֶּן אָדָ֕ם שָׂ֥א קִינָ֖ה עַל מֶ֣לֶךְ צ֑וֹר וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אַתָּה֙ חוֹתֵ֣ם תָּכְנִ֔ית מָלֵ֥א חָכְמָ֖ה וּ/כְלִ֥יל יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/012.yaml
  text: 'Son of man[a], raise a lament over the king of Tyre, and say to him, ‘Thus says the Lord GOD: You were the seal of perfection[b], full of wisdom and perfect in beauty.’'
translation:
  language: zh_hans
  text: “人子啊，你要为推罗王作哀歌，对他说：‘主耶和华如此说：你是完美的封印[a]，满有智慧，全然美丽。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完美的封印”所译的希伯来语短语含义较难确定；也可译作“完美的印章”“完美的典范”，或“封住蓝图的那一位”。原文为名词句，没有明示“是”或“曾是”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是耶和华对以西结的固定称呼；保留希伯来语意象及其文学呼应，也符合中文圣经传统。
- source_word: שָׂא קִינָה
  choice: 作一首哀歌
  rationale: 该习语指发出或吟咏哀歌；中文以“作一首哀歌”自然表达，同时保留其诗歌体裁。
- source_word: עַל מֶלֶךְ צֹר
  choice: 为推罗王
  rationale: 在哀歌语境中，עַל标明哀悼或吟咏的对象；“为”比“攻击”更符合此处语义。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 分别呈现אֲדֹנָי的称号与יהוה的专名，避免含混或重复为“主主”。
- source_word: אַתָּה חוֹתֵם תָּכְנִית
  choice: 你是完美的印记
  rationale: 原文没有明示系词，也没有语法时态；正文用中文自然的“是”，不因上下文擅自限定为过去。חוֹתֵם תָּכְנִית含义困难，“完美的印记”保留其核心隐喻，其他可能义见脚注。
- source_word: מָלֵא חָכְמָה
  choice: 满有智慧
  rationale: 直接而自然地表达智慧充盈。
- source_word: וּכְלִיל יֹפִי
  choice: 全然美丽
  rationale: כְלִיל表示完整、完满；“全然美丽”既自然又保留哀歌的庄重诗意。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主上帝／主雅威
  rationale: “主耶和华”区分称号与神名，保留原文复合表达，并采用现代中文读者熟悉而庄重的形式。
- issue: אַתָּה所需系词的时态
  choice: 你是
  alternative: 你曾是
  rationale: 希伯来语名词句没有明示系词和时态。虽然后文及哀歌语境可支持过去意义，正文保留形式上的未限定性，不把上下文推断写死。
- issue: 推罗王的形象是否指向超自然存在
  choice: 不在译文中作身份判定
  alternative: 将称谓或描述明确解释为撒但
  rationale: 本节明说对象是“推罗王”；其高度诗化的描述不应在翻译中被预先化约为某一教义身份。
translation_notes:
  register: 采用现代、庄重、可朗读的普通话书面语。保留“人子”“哀歌”“主耶和华”等经文语域中的固定表达；对核心疑难短语不作过度释义，并以脚注呈现词义及时态歧义。
