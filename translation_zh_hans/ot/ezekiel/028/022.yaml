  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֤י עָלַ֨יִ/ךְ֙ צִיד֔וֹן וְ/נִכְבַּדְתִּ֖י בְּ/תוֹכֵ֑/ךְ וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בַּ/עֲשׂ֥וֹתִ/י בָ֛/הּ שְׁפָטִ֖ים וְ/נִקְדַּ֥שְׁתִּי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/022.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Sidon, and I will be glorified in your midst[b]. And they will know that I am Yahweh when I execute judgments in her and show myself holy in her.’'
translation:
  language: zh_hans
  text: 你要说：“主耶和华如此说：西顿啊，看哪，我与你为敌！我要在你中间得荣耀[a]。当我在她中间施行审判、在她中间显为圣[b]时，人们就知道我是耶和华。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我要在你中间彰显荣耀”或“我要在你中间受尊崇”。希伯来文动词既可强调神得到尊荣，也可强调他借审判彰显自己的荣耀。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在她中间被尊为圣”或“在她中间彰显我的圣洁”。这句话表示耶和华借审判的行动公开显明并证实自己的圣洁。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号中“主”与神名“耶和华”的区别，同时符合现代汉语圣经语体。
- source_word: הִנְנִי עָלַיִךְ
  choice: 看哪，我与你为敌
  rationale: “看哪”保留 הִנְנִי 在先知宣告中的郑重强调；עַל 在此具有敌对含义。
- source_word: צִידוֹן
  choice: 西顿
  rationale: 采用该地名通行的现代汉语译名。
- source_word: וְנִכְבַּדְתִּי
  choice: 我要……得荣耀
  rationale: כבד 的尼法勒式在此表示耶和华借审判彰显并获得荣耀；“得荣耀”既自然，也保留受尊崇与彰显荣耀之间的语义张力。
- source_word: בְּתוֹכֵךְ
  choice: 在你中间
  rationale: 保留对城市西顿所用的阴性单数第二人称称呼及其空间含义。
- source_word: וְיָדְעוּ
  choice: 人们就知道
  rationale: 希伯来文为复数而未明说主语；汉语用泛指“人们”自然表达这一点，不擅自限定具体群体。
- source_word: בַּעֲשׂוֹתִי בָהּ שְׁפָטִים
  choice: 当我在她那里施行审判
  rationale: בַּעֲשׂוֹתִי 按时间关系译为“当……时”；“施行审判”体现 שְׁפָטִים 的审判行动，并以“她”保留城市拟人化及阴性代词。
- source_word: וְנִקְדַּשְׁתִּי בָהּ
  choice: 在她那里显为圣
  rationale: קדש 的尼法勒式可指神借历史行动公开显明并证实自己的圣洁；“显为圣”保留被尊为圣与彰显圣洁之间的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以汉语传统音译呈现四字神名，使神名与称号“主”保持区别。
theological_decisions:
- issue: 如何表达神借审判得荣耀并显为圣
  choice: 我要在你中间得荣耀……并在她那里显为圣
  alternative: 我要在你中间彰显荣耀……并在她那里被尊为圣
  rationale: 原文两个尼法勒式既可突出神受到尊崇，也可突出神借审判彰显自己的荣耀与圣洁。正文采用简洁而保留张力的表达，不把含义缩减为人的主观承认。
- issue: “人们就知道我是耶和华”与审判行动的关系
  choice: 以“当……时”连接认识耶和华与神施行审判、显为圣
  alternative: 因为我在她那里施行审判……人们就知道
  rationale: 前缀 בְּ 与不定词结构首先具有时间含义；译作“当……时”避免把原文关系过度限定为单一因果解释。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“看哪”保留先知宣告的郑重语气；“她”承接希伯来文对西顿这座城的阴性拟人化。标点强化神谕的口语层次，但不增加原文没有的信息。
