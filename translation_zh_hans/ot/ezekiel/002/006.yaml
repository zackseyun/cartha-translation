id: EZK.2.6
reference: Ezekiel 2:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָ֠דָם אַל תִּירָ֨א מֵ/הֶ֜ם וּ/מִ/דִּבְרֵי/הֶ֣ם אַל תִּירָ֗א כִּ֣י סָרָבִ֤ים וְ/סַלּוֹנִים֙ אוֹתָ֔/ךְ וְ/אֶל עַקְרַבִּ֖ים אַתָּ֣ה יוֹשֵׁ֑ב מִ/דִּבְרֵי/הֶ֤ם אַל תִּירָא֙ וּ/מִ/פְּנֵי/הֶ֣ם אַל תֵּחָ֔ת כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/006.yaml
  text: But you[a], son of man, do not fear them, and do not fear their words, though briers and thorns are with you and you sit among scorpions. Do not fear their words, and do not be dismayed by their faces[b], for they are a rebellious house.
translation:
  language: zh_hans
  text: 但你，人子啊，不要怕他们，也不要怕他们的话。虽有荆棘[a]和蒺藜在你身旁，你又坐在蝎子中间，也不要怕他们的话；不要因他们的面容[b]而惊惶，因为他们是悖逆之家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此词词义困难；按上下文与“蒺藜”“蝎子”相连的意象，译为“荆棘”。也有人理解为“悖逆者”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“不要因他们的脸而惊惶”，指不要被他们吓人的神情或气势震慑。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的称呼及原文阳性单数形式；“人子”在现代中文圣经语体中简洁、庄重且辨识度高。
- source_word: תִּירָא
  choice: 不要怕
  rationale: 直接表达禁令，并保留本节三次出现“怕”的重复修辞。
- source_word: דִּבְרֵיהֶם
  choice: 他们的话
  rationale: 保留具体的复数名词和原文重复，不改写为较抽象的“他们所说的”。
- source_word: סָרָבִים וְסַלּוֹנִים
  choice: 荆棘和蒺藜
  rationale: 与后文“蝎子”共同构成危险、敌对的形象；首词语义困难，但上下文较支持带刺植物的理解。
- source_word: אוֹתָךְ
  choice: 与你作对
  rationale: 此处结构简略；结合敌对意象，以“与你作对”自然表达其不利处境，同时避免把空间关系解释得过细。
- source_word: עַקְרַבִּים
  choice: 蝎子
  rationale: 采用直接、清楚的中文对应，保留危险意象。
- source_word: יוֹשֵׁב
  choice: 坐在……中间
  rationale: 保留动词“坐”的具体形象，并以“中间”自然表达 בְּ 的环境含义。
- source_word: מִפְּנֵיהֶם
  choice: 因他们的面容
  rationale: 保留原文“脸、面容”的具体表达；其语境意义是对方令人畏惧的神情或气势，另以脚注说明。
- source_word: תֵּחָת
  choice: 不要……惊惶
  rationale: 表达 Niphal 词形所含的受挫、惊恐或丧胆之意，并与反复的“不要怕”形成自然搭配。
- source_word: בֵּית מְרִי
  choice: 悖逆之家
  rationale: 保留以西结书具有标志性的“家”这一群体比喻，也准确传达 מְרִי 的顽抗和悖逆。
theological_decisions:
- issue: בֶן אָדָם 这一称呼的表达
  choice: 人子
  alternative: 世人；必死的人
  rationale: 这是上帝对以西结反复使用的阳性单数称呼；保留“人子”可维持全书的互文一致性，而不把它扩展为神学称号或改成中性释义。
- issue: 敌对者的比喻形象
  choice: 保留“荆棘、蒺藜、蝎子”的具体意象
  alternative: 概括为“敌对、伤害你的人”
  rationale: 这些形象构成本节先知性言辞的张力，指向以西结身处的危险和敌意；保留比喻比抽象化处理更贴近原文。
- issue: בֵּית מְרִי 的群体比喻
  choice: 悖逆之家
  alternative: 悖逆的百姓
  rationale: “家”在这里指整体群体，保留这一表达既不限定为现代家庭，也不抹去以西结书反复使用的原文称谓。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留“人子”“悖逆之家”等全书关键称谓，也保留三次“不要怕”的重复。将植物意象译作“荆棘和蒺藜”；由于 סָרָבִים 的词义存在争议，正文按上下文采用带刺植物之义，但不在正文中消除其文本难点。
