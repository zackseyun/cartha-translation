  text: וָ/אֶרְאֶ֕ה וְ/הִנֵּה יָ֖ד שְׁלוּחָ֣ה אֵלָ֑/י וְ/הִנֵּה ב֖/וֹ מְגִלַּת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/009.yaml
  text: Then I looked[a], and behold, a hand was stretched out toward me, and behold, in it was a scroll.
translation:
  language: zh_hans
  text: 我观看，看哪，有一只手向我伸来；看哪，手中有一卷书[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“书的一卷”，指卷轴形式的书或文书。
    reason: 说明 מְגִלַּת סֵפֶר 的字面结构及其自然含义。
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: 我观看
  rationale: 叙事性的连接形式推进异象场景；“我观看”保留先知主动看见新景象的第一人称表达。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该提示词两次引人注意眼前突然出现的景象；“看哪”保留异象叙述的鲜明感和庄重语气。
- source_word: יָד
  choice: 一只手
  rationale: 原文只说“手”，没有说明属于上帝、天使或其他人物，因此不补出其主人。
- source_word: שְׁלוּחָה אֵלָי
  choice: 向我伸来
  rationale: 被动分词在此描绘手朝以西结伸展；汉语用主动形态描述“一只手向我伸来”更自然，同时保留方向和画面感。
- source_word: בּוֹ
  choice: 手中
  rationale: 按可见场景译作“手中”，自然表达书卷随那只伸来的手呈现；不进一步说明持手者的身份。
- source_word: מְגִלַּת סֵפֶר
  choice: 一卷书卷
  rationale: 这是指卷轴式书籍或文书的组合词。“书卷”是现代汉语可懂且庄重的对应表达；保留“一卷”也呈现其具体形态。
theological_decisions:
- issue: 那只手的主人是谁
  choice: 不说明那只手属于谁
  alternative: 译为“上帝的手”或“天使的手”
  rationale: 希伯来文仅呈现“一只手”，没有点明其主人；补出上帝或天使会消除原文有意保留的未明之处。
translation_notes:
  register: 采用现代、庄重而易懂的异象叙事语体。“看哪”保留先知文学的现场感；分号对应两次 וְהִנֵּה 所引出的连续画面。
