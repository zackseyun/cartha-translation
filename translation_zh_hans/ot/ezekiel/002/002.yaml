  text: וַ/תָּ֧בֹא בִ֣/י ר֗וּחַ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר אֵלַ֔/י וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וָ/אֶשְׁמַ֕ע אֵ֖ת מִדַּבֵּ֥ר אֵלָֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/002.yaml
  text: And the Spirit entered into me when he spoke to me[a], and set me on my feet[b]; and I heard the one speaking to me.
translation:
  language: zh_hans
  text: 当他对我说话时，灵进入我里面[a]，使我站立起来；我就听见那位正在对我说话的。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”也可译作“一个灵”、“风”或“气息”；这里的上下文倾向于指神那使以西结得力的灵。
    reason: alternative_reading
  - marker: b
    text: 原文直译：“我听见那位正在对我说话的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֗וּחַ
  choice: 灵
  rationale: 该词可指“灵、风、气息”。在以西结蒙召的语境中，最自然是指使先知得力的神之灵；但希伯来文没有冠词，因此正文用“灵”而不添加“圣”或明确所有格，并以脚注保留“一个灵”等可能。
- source_word: וַתָּבֹא בִי
  choice: 进入我里面
  rationale: בוא 与介词 ב 及第一人称后缀连用，表达进入先知之内；此译保留内在进入并赋能的意象。
- source_word: כַּאֲשֶׁר דִּבֶּר אֵלַי
  choice: 他对我说话时
  rationale: כַּאֲשֶׁר 在此表示同时发生的时间关系；“说话时”比完成式的“说了以后”更贴合语境。
- source_word: וַתַּעֲמִדֵנִי עַל רַגְלָי
  choice: 使我站立起来
  rationale: עמד 的使役式表示使先知站立；现代汉语无须直译“站在我的脚上”，即可自然保留其使役意义。
- source_word: וָאֶשְׁמַע
  choice: 我也听见
  rationale: 承接希伯来文叙事序列；“也”自然标明动作推进，而不强加明显的因果关系。
- source_word: אֵת מִדַּבֵּר אֵלָי
  choice: 那位对我说话者的声音
  rationale: 希伯来文直译近于“我听见那位对我说话者”，其中分词作名词使用。汉语“听见某人”可能含混，正文补出符合听觉语境的“声音”，并在脚注保留原文结构。
theological_decisions:
- issue: רוּחַ 的所指
  choice: 正文译作“灵”，按上下文理解为神那使先知得力的灵
  alternative: 一个灵；风；气息
  rationale: 本章异象与差遣的上下文支持神之灵这一理解，但原文没有冠词，也未在本节明说“神的”，故不在正文中扩写为“圣灵”或“神的灵”，以免消除原文保留的词义空间。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“进入我里面”有意保留原文的空间意象；“使我站立起来”自然表达使役含义。正文与脚注标记一一对应。
