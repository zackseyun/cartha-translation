  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֵ֨מָּה֙ אִם יִשְׁמְע֣וּ וְ/אִם יֶחְדָּ֔לוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵ֑מָּה וְ/יָ֣דְע֔וּ כִּ֥י נָבִ֖יא הָיָ֥ה בְ/תוֹכָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/005.yaml
  text: And whether they listen or refuse—for they are a rebellious house—they will know that a prophet has been among them[a][b].
translation:
  language: zh_hans
  text: 他们或听从，或拒绝听从——因为他们是悖逆之家——都必知道，在他们中间曾有一位先知[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从……拒绝听从”或译“听……止息”；希伯来文直译对举“听”与“停止／罢休”，这里指拒绝理会所传的信息。
    reason: lexical_alternative
  - marker: b
    text: “在他们中间曾有”或译“曾在他们当中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: 他们或听从，或拒绝听从
  rationale: 句首代词带有强调意味，用“他们”保留；两个 אִם 构成不影响结果的两种可能。יִשְׁמְעוּ 在先知信息的语境中指听取、听从；יֶחְדָּלוּ 字面为“停止、罢休”，此处指不肯听从，故译为“拒绝听从”。
- source_word: כִּי בֵּית מְרִי הֵמָּה
  choice: 因为他们是悖逆之家
  rationale: 保留以“家”表达群体身份的希伯来隐喻及以西结书的惯用语，同时用“悖逆”自然表达 מְרִי。
- source_word: וְיָדְעוּ
  choice: 都必知道
  rationale: 在让步性的两种回应之后，此形式表达确定的将来结果；“都”说明无论采取哪一种回应，结果不变，并未把范围扩展到每个个体。
- source_word: נָבִיא
  choice: 一位先知
  rationale: 准确表达不定指的单数名词。
- source_word: הָיָה בְתוֹכָם
  choice: 在他们中间曾有
  rationale: הָיָה 表示已经发生的存在事实，בְתוֹכָם 为“在他们中间”；“曾有”兼顾过去事实及其在日后被认识的意义。
theological_decisions:
- issue: 百姓回应的性质
  choice: 将 יִשְׁמְעוּ 译为“听从”，将 יֶחְדָּלוּ 译为“拒绝听从”，表明无论他们是否理会先知的信息，都必认出先知曾在他们中间。
  alternative: 可较字面地译为“听见……止息”，或译为“听……不听”。
  rationale: 上下文关注的不是声音能否被听见，而是百姓是否接受并理会信息；如此翻译保留先知话语的伦理张力，又不额外规定他们将在何时、以何种方式承认先知。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“悖逆之家”刻意保留以西结书反复出现的群体性称谓；破折号保留插入说明的结构。脚注标记均置于正文对应句末。
