  source_fidelity: 忠实呈现了 וְהֵמָּה 的前置“他们”、双重条件结构“或……或……”、בֵּית מְרִי 的群体隐喻，以及结果句“都必知道”。“听从／拒绝听从”在本段先知语境中恰当地表达 יִשְׁמְעוּ 与 יֶחְדָּלוּ 的对比；“在他们中间曾有一位先知”准确表达 הָיָה בְתוֹכָם，且未不当地强化时态或认知方式。
