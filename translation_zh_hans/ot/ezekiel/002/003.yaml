  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ שׁוֹלֵ֨חַ אֲנִ֤י אֽוֹתְ/ךָ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל גּוֹיִ֥ם הַ/מּוֹרְדִ֖ים אֲשֶׁ֣ר מָרְדוּ בִ֑/י הֵ֤מָּה וַ/אֲבוֹתָ/ם֙ פָּ֣שְׁעוּ בִ֔/י עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/003.yaml
  text: And he said to me[a], “Son of man, I am sending you to the sons of Israel, to the rebellious nations that have rebelled against me; they and their fathers have transgressed against me to this very day.”
translation:
  language: zh_hans
  text: 他对我说：“人子[a]，我正差遣你到以色列子民那里，到那些悖逆的列国，就是背叛我的；他们和他们的祖先都违逆我，直到今日。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人”或“必死的人”。
    reason: 说明 בֶּן אָדָם 在此处可表达人的身份与必死性，同时保留正文的传统固定译法。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留希伯来语反复用于称呼以西结的固定形式及其经卷间呼应；此处是对先知的称呼，并非基督论头衔。其他可能译法列入脚注。
- source_word: שׁוֹלֵחַ אֲנִי אֹתְךָ
  choice: 我要差派你
  rationale: 显明代词与分词结构带有鲜明、临近的差遣意味；现代汉语用“我要差派你”自然地传达正在宣告的使命。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子民
  rationale: 既反映“以色列之子”的群体含义，也比逐字译作“以色列的儿子们”更符合现代汉语。
- source_word: גּוֹיִם הַמּוֹרְדִים
  choice: 那些悖逆列国
  rationale: 保留 גּוֹיִם 的复数“列国”，不将其弱化为“民”；“那些”体现定冠词，“悖逆”表达持续的反叛性质。
- source_word: מָרְדוּ בִי
  choice: 背叛我的
  rationale: 以关系从句修饰“悖逆列国”，保留针对上帝的反叛含义；同时与后面的 פשע 使用不同词语，避免抹平两个希伯来动词。
- source_word: פָּשְׁעוּ בִי
  choice: 违逆我
  rationale: 表达蓄意冒犯、越轨和反抗的含义，并与前面的“背叛”有所区分。
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是强调时间延续至当日的惯用语；“直到今日”在现代汉语中简洁、庄重且自然。
theological_decisions:
- issue: 是否淡化以 גּוֹיִם（“列国”）称呼以色列所形成的审判性冲击
  choice: 保留“列国”，并用“就是到”表明它与“以色列子民”同位
  alternative: 译作“百姓”或直接译作“以色列人”
  rationale: 希伯来文刻意把通常指各国的词用于悖逆的以色列。保留“列国”可维持原文的修辞张力；“就是到”则避免汉语读者误以为另有第二组受差遣对象。
- issue: 如何理解 בֶּן אָדָם
  choice: 正文译作“人子”
  alternative: “世人”或“必死的人”
  rationale: 此处是上帝对以西结惯常的称呼，不应在本节中直接赋予后来的基督论意义；但保留固定形式，最能体现本书内部重复及正典呼应，词义替代方案置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“就是到”清楚标示两个介词短语为同位关系；“背叛”与“违逆”分别承载 מרד 与 פשע，避免将两个近义但不同的控诉合并。
