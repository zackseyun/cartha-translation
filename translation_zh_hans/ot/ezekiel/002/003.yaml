  to: 他对我说：“人子[a]，我正差遣你到以色列子民那里，到那些悖逆的列国，就是背叛我的；他们和他们的祖先都违逆我，直到今日。”
  rationale: 修订“我要差派”为“我正差遣”，以更贴近原文分词所表达的即时差遣；重组“悖逆／背叛”的汉语句法以保留原文重复而提升可读性；并校正脚注中不合单数称呼的“世人”。其余措辞保留原有的庄重现代书面语风格及对以色列被称为“列国”的修辞张力。
