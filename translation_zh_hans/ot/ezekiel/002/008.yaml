source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שְׁמַע֙ אֵ֤ת אֲשֶׁר אֲנִי֙ מְדַבֵּ֣ר אֵלֶ֔י/ךָ אַל תְּהִי מֶ֖רִי כְּ/בֵ֣ית הַ/מֶּ֑רִי פְּצֵ֣ה פִ֔י/ךָ וֶ/אֱכֹ֕ל אֵ֥ת אֲשֶׁר אֲנִ֖י נֹתֵ֥ן אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/008.yaml
  text: But you[a], son of man, hear what I am speaking to you. Do not be rebellious like the rebellious house. Open your mouth and eat what I am giving you.
translation:
  language: zh_hans
  text: 但你，人子[a]，要听我正在对你说的话。不要像那悖逆之家一样悖逆。张开你的口，吃下我给你的东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”或译“必死的人”或“人”。此处是以西结书中反复出现的称呼。
    reason: 说明 בֶן־אָדָם 的词义范围，并提示其在以西结书中作为重复称呼的文学功能。
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的固定称呼及其文学联系；脚注说明该词组在此强调受造而必死的人。
- source_word: שְׁמַע
  choice: 要听
  rationale: 保留动词“听”的基本意义，同时命令语气自然带出留心领受的含义，不直接收窄为“顺服”。
- source_word: מְדַבֵּר אֵלֶיךָ
  choice: 我对你所说的话
  rationale: 按现代汉语习惯表达当下正在进行的说话行为，并使“听”的宾语清楚自然。
- source_word: אַל תְּהִי מֶרִי
  choice: 不要悖逆
  rationale: 原文以“悖逆”这一名词作表语；汉语用动词性表达更自然，也保留其反抗、抗命的力度。
- source_word: כְּבֵית הַמֶּרִי
  choice: 像那悖逆之家一样
  rationale: 保留以西结书中反复出现的集体性“家”之隐喻和关键词“悖逆”，不擅自将其解释性改写为某一民族名称。
- source_word: פְּצֵה פִיךָ
  choice: 张开你的口
  rationale: 表达原动词“张开、张大”的具体动作，并与随后象征性的吃相衔接。
- source_word: וֶאֱכֹל
  choice: 吃下
  rationale: 直陈象征行动的命令；“下”使现代汉语表达更自然，并未将其隐喻化解释。
- source_word: אֵת אֲשֶׁר אֲנִי נֹתֵן אֵלֶיךָ
  choice: 我给你的东西
  rationale: 反映分词所表达的当前、即时动作；“东西”保留本节尚未明说所给之物为何物的指代开放性。
theological_decisions:
- issue: 先知称呼 בֶן אָדָם 的译法
  choice: 人子
  alternative: 必死的人；人
  rationale: “人子”保留以西结书固定称呼的重复性、文学力度和跨经文联系；同时用脚注提示其希伯来语普通人、必死之人的语义，避免读者只按后来的称号含义理解。
- issue: “悖逆之家”的集体所指
  choice: 保留“之家”的隐喻
  alternative: 悖逆的家族；悖逆的民族
  rationale: 原文用 בַּיִת 表示一个集体。本节不必在正文中将其解释性具体化，保留原有隐喻及以西结书中的固定表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“悖逆之家”略带经文式庄重色彩，用以维持全书反复出现的固定措辞；其余句法尽量简明直接。
