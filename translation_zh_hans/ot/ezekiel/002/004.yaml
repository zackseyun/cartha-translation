  text: וְ/הַ/בָּנִ֗ים קְשֵׁ֤י פָנִים֙ וְ/חִזְקֵי לֵ֔ב אֲנִ֛י שׁוֹלֵ֥חַ אוֹתְ/ךָ֖ אֲלֵי/הֶ֑ם וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֥/י יְהֹוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/004.yaml
  text: And the children are hard-faced and hard-hearted[a]; I am sending you to them, and you shall say to them[b], ‘Thus says the Lord GOD.’
translation:
  language: zh_hans
  text: 这些子民厚颜顽固[a]；我差你到他们那里去，你要对他们说：‘主耶和华如此说。’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“脸面刚硬、内心强硬”，是形容人厚颜、悖逆而顽梗的说法。
    reason: lexical_alternative
  - marker: b
    text: “主耶和华”也可译作“主雅威”；希伯来文称号为 אֲדֹנָי יְהוִה。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבָּנִים
  choice: 这些子民
  rationale: בָּנִים 字面为“儿子们”，但在本段承接以色列民这一群体；译作“这些子民”既保留群体和归属意味，也避免现代汉语中“儿子们”可能造成的误解。
- source_word: קְשֵׁי פָנִים וְחִזְקֵי לֵב
  choice: 厚颜顽固
  rationale: 两个短语字面分别为“脸面刚硬”和“心里强硬”，在这里合指厚颜、悖逆和内心顽梗。“厚颜顽固”以自然简洁的现代汉语传达其负面含义，具体意象置于脚注。
- source_word: אֲנִי שׁוֹלֵחַ אוֹתְךָ אֲלֵיהֶם
  choice: 我差你到他们那里去
  rationale: 显式代词加分词表达当前或即将实行的差遣；“差你……去”符合庄重的差遣语境，也准确表达方向。
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 完成式在差遣语境中带命令或预期结果的语气；“你要”自然表达所授使命。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知传信的固定公式；保留“如此说”可呈现其庄重、公式化的语气。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי 为“主”，יהוה 为神名；“主耶和华”在中文中清楚保留复合称谓的两个成分。
theological_decisions:
- issue: 复合神名称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时使用“主”和四字神名。正文采用中文读者熟悉的“主耶和华”，既不把两个成分合并，也不以解释性称号替换神名；脚注提示另一种音译。
- issue: “脸硬、心强”的伦理含义
  choice: 厚颜顽固
  alternative: 脸面刚硬、内心强硬
  rationale: 上下文表明这不是勇敢坚定的褒义描述，而是指对神悖逆、无耻和顽梗；但不进一步加入原文未明说的定罪术语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留先知宣告公式“主耶和华如此说”，并以脚注说明希伯来语的具体意象和神名音译。
