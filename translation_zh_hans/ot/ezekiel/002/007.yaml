  text: וְ/דִבַּרְתָּ֤ אֶת דְּבָרַ/י֙ אֲלֵי/הֶ֔ם אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּ֑לוּ כִּ֥י מְרִ֖י הֵֽמָּה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/007.yaml
  text: You shall speak my words to them[a], whether they listen or whether they refuse, for they are rebellious.
translation:
  language: zh_hans
  text: 你要把我的话告诉他们[a]；无论他们听，还是拒绝听，因为他们是悖逆的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无论他们听，还是不听。”希伯来语这一表达把听取回应与拒绝理会相对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ
  choice: 你要……告诉
  rationale: 带连接词的完成式在委任语境中表达指令。“你要……告诉”符合现代汉语，也保留神对以西结的明确差遣。
- source_word: אֶת דְּבָרַי
  choice: 我的话
  rationale: 保留דָּבָר复数及第一人称单数后缀的具体表达，不将其概括为解释性更强的“我的信息”。
- source_word: אֲלֵיהֶם
  choice: 他们
  rationale: 与“告诉”搭配时，希伯来语方向介词自然融入现代汉语双宾语结构“把我的话告诉他们”。
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: 无论他们听从，还是拒绝听
  rationale: 重复的אִם在这里构成“不论……还是……”结构。שׁמע兼有听、听取、听从之意；“听从”保留回应含义，却不直接强化为“顺服”。חדל本义为停止、克制，在此惯用对举中指拒绝理会，译作“拒绝听”使对比清楚，并以脚注保存较直译的可能。
- source_word: כִּי
  choice: 因为
  rationale: 引出先知不论听众反应都必须传话的理由，现代汉语用“因为”最清楚。
- source_word: מְרִי הֵמָּה
  choice: 他们是悖逆的
  rationale: מְרִי表示悖逆、反叛；本节没有“家”一词，因此不从上下文补入。“他们是悖逆的”自然且忠实地保留谓语性质。
theological_decisions:
- issue: שׁמע应译为“听见”、“听从”还是“顺服”
  choice: 听从
  alternative: 听见；顺服
  rationale: 该动词可涵盖听见、听取和顺服。这里与“拒绝听”相对，“听从”既表达实际回应，又不把语义完全限定为更强的“顺服”，从而保留原文的语义张力。
- issue: יֶחְדָּלוּ应保留字面“停止”还是表达惯用语中的拒绝回应
  choice: 拒绝听
  alternative: 停止；不听；罢休
  rationale: 若孤立地译作“停止”，现代读者不易明白停止什么。结合与יִשְׁמְעוּ的对举，将其译为“拒绝听”表达该惯用语的功能，同时在脚注中注明字面可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把我的话告诉他们”比“向他们说我的话”更符合普通读者的表达习惯；“悖逆”保留经文的严肃语气，又不补入本节没有的“家”。
