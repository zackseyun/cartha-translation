  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָם֙ עֲמֹ֣ד עַל רַגְלֶ֔י/ךָ וַ/אֲדַבֵּ֖ר אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/001.yaml
  text: And he said to me[a], “Son of man, stand on your feet, and I will speak to you.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，你站起来，我要向你说话[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“同你说话。”这里的希伯来语结构既可表示“向你说”，也可表示“同你说”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 叙事中的 wayyiqtol 用现代汉语自然承接；אמר 在此具体表示“说”，介词 אֶל 表明话语朝向“我”。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留希伯来语的字面结构及其在《以西结书》中反复出现的特定称呼；不在本节中擅自解释为“凡人”或引入后来的基督论含义。
- source_word: עֲמֹד עַל רַגְלֶיךָ
  choice: 你站起来
  rationale: 原文直译为“站在你的脚上”，意思是从俯伏状态起身站立；“站起来”是现代汉语最自然、准确的表达。
- source_word: וַאֲדַבֵּר
  choice: 我要……说话
  rationale: 在命令之后，此未完成式表达随即要发生的行动；“我要”既自然，也保留说话者接下来将发言的次序。
- source_word: אֹתָךְ
  choice: 对你
  rationale: דבר 与 אֵת 连用在这里可理解为话语以对方为对象，也可带有“与对方交谈”的意味；正文采用较贴合本段单向宣告语境的“对你”，并用脚注保留另一可能。
theological_decisions:
- issue: 《以西结书》中 בֶּן־אָדָם 的译法
  choice: 人子
  alternative: 凡人；世人
  rationale: “人子”保留原文独特而反复的先知称谓及其文学张力，同时不把后世对这一称号的理解预先带入本节。
- issue: דבר אֹתָךְ 所表达的说话关系
  choice: 对你说话
  alternative: 跟你说话
  rationale: 本段主要呈现上帝向先知发出话语，因此正文采用“对你”；但希伯来语结构也可表达“跟你说话”，故以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“人子啊”保留先知书中特有的呼语；“你站起来”避免生硬照译“站在你的脚上”。脚注标记紧接存在词义歧义的短语。
