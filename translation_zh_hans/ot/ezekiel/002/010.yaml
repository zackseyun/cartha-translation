reference: Ezekiel 2:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּפְרֹ֤שׂ אוֹתָ/הּ֙ לְ/פָנַ֔/י וְ/הִ֥יא כְתוּבָ֖ה פָּנִ֣ים וְ/אָח֑וֹר וְ/כָת֣וּב אֵלֶ֔י/הָ קִנִ֥ים וָ/הֶ֖גֶה וָ/הִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/010.yaml
  text: And he spread it out before me[a], and it was written on the front and on the back[b]; and written on it were lamentations and mourning and woe.
translation:
  language: zh_hans
  text: 他在我面前把书卷展开；书卷正反两面都写着字[a]，其上所写的是哀歌、哀吟[b]和祸哉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“里外两面都写着字。”原文直译为“前面和后面”。
    reason: lexical_alternative
  - marker: b
    text: “哀吟”或译“呻吟”或“哀叹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: 把书卷展开
  rationale: פרשׂ表示铺开、展开。上下文对象是书卷；“展开”自然地表达动作，又不限定具体的卷动方式。
- source_word: לְפָנַי
  choice: 在我面前
  rationale: 直接保留空间含义，也符合异象叙事的现代汉语表达。
- source_word: כְתוּבָה
  choice: 写着字
  rationale: כתב的被动分词表示书卷上已有文字；“写着字”简明自然。
- source_word: פָּנִים וְאָחוֹר
  choice: 正反两面
  rationale: 原文直译为“前面和后面”，在书卷语境中指正反两面；这样既贴近原文，也让现代读者容易理解。
- source_word: וְכָתוּב אֵלֶיהָ
  choice: 其上所写的是
  rationale: 保留被动书写的含义，并自然引出书卷的内容。
- source_word: קִנִים
  choice: 哀歌
  rationale: קִינָה的复数，指哀悼之歌或挽歌；“哀歌”庄重、清楚，并适合先知文学语境。
- source_word: הֶגֶה
  choice: 哀吟
  rationale: 该词可指呻吟、低吟或哀叹。“哀吟”保留声音与悲痛两方面的含义，并与“哀歌”有所区分。
- source_word: הִי
  choice: 祸哉
  rationale: 这是表达悲叹或灾祸的词；“祸哉”保留先知性宣告和哀号的语气，避免仅将其抽象化为“灾祸”。
theological_decisions:
- issue: 如何表达书卷上三项悲哀与审判性的内容
  choice: 哀歌、哀吟和祸哉
  alternative: 哀歌、呻吟和灾祸
  rationale: 保留原文三个彼此相关但不完全相同的词，以及逐项累加的沉重语势；不进一步解释这些内容所指的具体审判。
- issue: 书卷两面有字的空间表述
  choice: 正反两面都写着字
  alternative: 里外两面都写着字
  rationale: 原文是“前面和后面”；“正反两面”在现代汉语中更透明，同时脚注保留传统的“里外”表达，不对古代书卷的具体构造作过度判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“其上所写的是”略带书面色彩，以配合异象和先知文学的语体；三项内容保留重复连接所形成的累加语势。
