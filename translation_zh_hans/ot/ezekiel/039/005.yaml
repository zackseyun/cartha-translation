source:
  edition: WLC
  text: עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה תִּפּ֑וֹל כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/005.yaml
  text: You will fall on the open field[a], for I have spoken[c][b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 你必倒在田野上[a]，因为我已经说过。这是主雅威[b]的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在田野的表面上”；此处是指倒在露天的田野或野地上。
    reason: lexical_alternative
  - marker: b
    text: “主雅威”对应希伯来文 אֲדֹנָי יְהוִה；其中第二个词是神的专名 YHWH，“雅威”是其常用中文音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: 在旷野
  rationale: 字面为“在田野表面上”，此处是表示暴露于野外的惯用语。“在旷野”简洁自然，也保留了倒毙于露天野地的场景。
- source_word: תִּפּוֹל
  choice: 你必倒
  rationale: 这是 נפל 的第二人称阳性单数未完成式，承接上文对歌革的单数称呼。语境是确定的预告，因此用“必倒”，既体现将来指向，也传达宣告的确定性。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述结果的根据：这事必发生，因为耶和华已经说了。“因为”在现代汉语中清楚自然。
- source_word: דִבַּרְתִּי
  choice: 我已经说了
  rationale: 完成式在这里强调神的话已经发出，因而事情确定无疑。“已经说了”自然地保留其完成性和终局意味。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 这是先知书中常见的神谕公式。译作“这是……的宣告”既符合现代汉语，又保留话语的神圣权威。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי 是“主”，יהוה 是神的专名 YHWH。中文圣经语域中“主耶和华”清楚区分二者，并避免把复合称号误作两个普通头衔。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”是现代中文读者熟悉且庄重的表达，同时保留原文中“主”与神之专名 YHWH 的区别；脚注说明“耶和华”所对应的原文，避免掩盖其专名性质。
- issue: תִּפּוֹל 所表达的确定性与语气
  choice: 你必倒
  alternative: 你将倒下
  rationale: 未完成式本身可表达将来事件；在神谕语境中，“必”恰当地传达宣告的确定性，但不把它解释为独立于上下文的命令语气。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“必倒”保留先知宣告的力度；将 נְאֻם 公式独立成句，使中文清晰流畅，同时不削弱原文的权威语气。
