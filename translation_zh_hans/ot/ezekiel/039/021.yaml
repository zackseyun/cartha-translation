source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִ֑ם וְ/רָא֣וּ כָל הַ/גּוֹיִ֗ם אֶת מִשְׁפָּטִ/י֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/אֶת יָדִ֖/י אֲשֶׁר שַׂ֥מְתִּי בָ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/021.yaml
  text: And I will set my glory among the nations[a], and all the nations will see my judgment that I have executed[b], and my hand that I have laid on them.
translation:
  language: zh_hans
  text: 我要在列国中彰显我的荣耀；列国都必看见我所施行的审判[a]，也必看见我加在他们身上的手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “审判”也可理解为“我所施行的公正”或“我所执行的判决”。
    reason: lexical_alternative
  - marker: b
    text: “我的手”是希伯来语意象，表示上帝主动施展的能力或行动；在这里尤指他施行审判。
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要……彰显
  rationale: נתן的基本义是“给予、放置”。与“我的荣耀”搭配时，译作“彰显”能以自然现代汉语表达上帝使自己的荣耀显明于列国之中的含义，同时保留主动施行的语气。
- source_word: כְּבוֹדִי
  choice: 我的荣耀
  rationale: כבוד可指荣耀、尊荣或威荣；本节指上帝借审判向列国显明的威荣，“荣耀”既准确又符合现代汉语圣经语体。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גוים在此统指各外邦国家或民族；“列国”简洁庄重，也避免带入新约语境下“外邦人”的特定联想。
- source_word: וְרָאוּ כָל־הַגּוֹיִם
  choice: 列国都必看见
  rationale: 在预言语境中表达将来的确定事件；“都必看见”自然地传达全体列国和必然实现的语气。
- source_word: מִשְׁפָּטִי
  choice: 我的审判
  rationale: משפט可指审判、公正、判决或司法行动。上下文强调上帝对敌对者所执行的惩治性司法行动，因此正文采用“审判”，并以脚注保留“公正作为”的可能侧重。
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: 我所施行的
  rationale: עשה本义宽泛，为“做、施行”；汉语常说“施行审判”，既自然，又没有超出原文司法语境。
- source_word: יָדִי
  choice: 我的手
  rationale: יד字面为“手”，在此比喻上帝主动施展的能力，尤其是审判行动。正文保留鲜明的身体意象，不直接释为“能力”。
- source_word: אֲשֶׁר שַׂמְתִּי בָהֶם
  choice: 我加在他们身上的
  rationale: שׂים与“手”连用，表达把手加于某人身上，此处具有施行审判的意味。“加在他们身上”保留希伯来语意象，具体含义由脚注说明。
theological_decisions:
- issue: 上帝在列国中彰显“荣耀”的含义
  choice: 上帝借其审判行动使自己的威荣在列国中显明
  alternative: 仅指上帝抽象意义上的尊荣
  rationale: 本节紧接着说列国将看见上帝的审判和他的手，表明这里的荣耀是借历史中的司法行动显明出来的，而非仅指抽象属性。
- issue: “我的手”的解释力度
  choice: 正文保留“手”的比喻，并由脚注说明其指向上帝主动施展的能力和审判行动
  alternative: 在正文中直接译为“我的能力”或“我惩治他们的行动”
  rationale: 保留原文意象可避免把含义过早收窄；上下文足以显示其审判性质，脚注则帮助现代读者理解这一希伯来语表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“彰显”使“把荣耀置于列国中”的希伯来式表达在汉语中自然通顺；后半句重复“必看见”，使两个并列宾语层次清楚。正文保留“手”的原文意象，并以脚注解释，兼顾形式与可理解性。
