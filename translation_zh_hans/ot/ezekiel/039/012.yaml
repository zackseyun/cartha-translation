  text: וּ/קְבָרוּ/ם֙ בֵּ֣ית יִשְׂרָאֵ֔ל לְמַ֖עַן טַהֵ֣ר אֶת הָ/אָ֑רֶץ שִׁבְעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/012.yaml
  text: The house of Israel will bury them for seven months[a], in order to cleanse the land.
translation:
  language: zh_hans
  text: 以色列家要埋葬他们，历时七个月，为要使那地洁净[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使……洁净”也可译作“净化”。希伯来语动词可指使某物在礼仪意义上成为洁净。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְבָרוּם
  choice: 要埋葬他们
  rationale: קבר的Qal完成式带连接词及第三人称阳性复数宾语后缀，在此预言语境中表达将来的行动；“他们”保留了指向上文敌军尸首的宾语。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中常见的群体称谓及其整体性；现代中文读者也能自然理解。
- source_word: לְמַעַן
  choice: 为要
  rationale: 清楚表达目的关系，同时保持简洁、庄重的经文语体。
- source_word: טַהֵר
  choice: 使……洁净
  rationale: 该词在Piel词干中表示使之洁净，可兼顾尸体所造成的实际污秽与礼仪性不洁，不把含义局限于单一层面。
- source_word: אֶת־הָאָרֶץ
  choice: 那地
  rationale: 定冠词所指的是语境中以色列的土地，而非整个世界；“那地”也承接具体语境。
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: 历时七个月
  rationale: 该短语作时长宾格；“历时”自然明确地表示埋葬工作持续七个月。
theological_decisions:
- issue: 土地得洁净的性质
  choice: 使那地洁净
  alternative: 净化那地；除净那地的污秽
  rationale: 保留尸体玷污土地所涉及的实际与礼仪双重维度，不引入后来的教义范畴，也不将原文收窄为单纯的环境清理。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“以色列家”保留先知书的固定群体称谓；“历时七个月”避免中文把时长误读为等待七个月之后才开始埋葬。
