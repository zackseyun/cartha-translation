base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/006.yaml
  text: And I will send fire on Magog and on those who live securely in the coastlands[a], and they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我必向玛各和安然居住在众海岛[a]的人降火；他们必知道我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“沿海地区”。希伯来语这个词既可指海岛，也可在先知书中较广泛地指沿海或远方海域一带。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי אֵשׁ
  choice: 我必降火
  rationale: שׁלח在使役形中本义为“差遣、发出”；以“火”为宾语时，现代汉语用“降火”自然地表达神使火临到审判对象，同时不把“火”解释性扩展为“审判”。
- source_word: בְּמָגוֹג
  choice: 在玛歌
  rationale: 介词ב在这里标示火所临到的范围或对象；“在玛歌”保留其地点色彩，也符合汉语表达。מָגוֹג按专名音译为“玛歌”。
- source_word: וּבְיֹשְׁבֵי הָאִיִּים לָבֶטַח
  choice: 和安然居住在众海岛的人中间
  rationale: יֹשְׁבֵי是“居住者”；לָבֶטַח最自然地修饰居住状态，译作“安然居住”。אִיִּים可指海岛，也可泛指沿海地带；正文采用直观而传统的“众海岛”，脚注保留另一可能。
- source_word: וְיָדְעוּ
  choice: 他们就知道
  rationale: 连续结构在这里表达审判后的认识结果；“就”符合现代汉语叙述，但不额外规定具体时间间隔。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名；采用现代中文圣经读者熟悉的专名形式“耶和华”，不以称号“主”取代原文中的名字。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 正文保留其专名性质。中文语境中“耶和华”辨识度高且庄重；不用“主”，以免把名字改成称号。
- issue: לָבֶטַח的修饰范围
  choice: 修饰众海岛居民的居住状态：“安然居住”
  alternative: 较宽泛地理解为全句所述对象处于安全之中
  rationale: 从词序和句法看，该词紧随“众海岛的居民”，最自然地描述这些人的居住状态。
- issue: אִיִּים所指的地理范围
  choice: 正文译“众海岛”，脚注注明也可译“沿海地区”
  alternative: 正文译“沿海地区”
  rationale: 该词既可指岛屿，也可在先知文学中泛指海滨或远方海域之地；正文不应把这一真实的词义幅度完全消除。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“降火”保留先知性审判意象；“安然居住”准确连接לָבֶטַח与居民。脚注标记[a]已置于正文相应词语之后。
