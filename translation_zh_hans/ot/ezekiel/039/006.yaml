  source_fidelity: 原文意为神将火降在（即针对）玛各，以及安然居住在海岛／沿海地带的居民身上。草稿的“降火在……人中间”把施加对象表述为地点范围，且“中间”并非原文所有；应改为“向……降火”，以清楚表达审判所临到的对象。לָבֶטַח修饰海岛居民，译作“安然居住在……的人”准确。
  naturalness: “我必降火在玛歌和……人中间”在现代汉语中不自然，也容易被理解为火只落在他们当中而非临到他们。改为“我必向玛各……降火”简洁、庄重且符合先知书语体。
  terminology: 建议将Magog译为较通行的圣经中文专名“玛各”，而非“玛歌”。“耶和华”正确保留了神名的专名性质。“海岛”保留原文主要词义，脚注说明可广指沿海地区，处理恰当。
