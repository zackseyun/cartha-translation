  text: וְ/נָשׂוּ֙ אֶת כְּלִמָּתָ֔/ם וְ/אֶת כָּל מַעֲלָ֖/ם אֲשֶׁ֣ר מָעֲלוּ בִ֑/י בְּ/שִׁבְתָּ֧/ם עַל אַדְמָתָ֛/ם לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/026.yaml
  text: They will bear their shame and all their unfaithfulness by which they were unfaithful to me[a], when they dwell securely on their land with no one to make them afraid.
translation:
  language: zh_hans
  text: 他们要担当自己的羞辱，和他们一切对我所行的不忠；当他们安然住在自己的土地上，无人使他们惊惶时。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָשׂוּ
  choice: 要担当
  rationale: נשׂא的直接含义是“抬起、承载、担当”。与“羞辱”和“不忠”连用时，“担当”既保留原文用词，也表达承受其羞耻或后果之意；不因复兴语境而直接改译为“忘却”。
- source_word: כְּלִמָּתָם
  choice: 自己的羞辱
  rationale: כְּלִמָּה指羞耻、耻辱或蒙羞的处境。“羞辱”自然庄重，并可兼顾主观羞耻与客观耻辱。
- source_word: מַעֲלָם / מָעֲלוּ
  choice: 他们对我所犯的一切不忠
  rationale: 名词与同源动词מעל表达破坏信义、背信，常带关系或盟约色彩。“不忠”保留这一核心，并以“所犯的”使中文句法自然，同时反映原文名词与动词的重复关系。
- source_word: בִי
  choice: 对我
  rationale: 在מעל的搭配中，ב标明背信所针对的对象。“对我”突出关系性的背信；“得罪我”虽可行，却会弱化“不忠”的词根呼应。
- source_word: בְּשִׁבְתָּם
  choice: 那时，他们……住
  rationale: ב加不定式构词表示时间或伴随情形，即“当他们居住时”。译作“那时”使中文顺畅，并把安全居住作为担当羞辱之时的处境，而不强行说明两者之间更具体的逻辑关系。
- source_word: עַל אַדְמָתָם
  choice: 在自己的土地上
  rationale: אֲדָמָה可指土地、地土或土壤。这里涉及以色列归回并居住，译作“自己的土地”清楚自然，也保留归土主题。
- source_word: לָבֶטַח
  choice: 安然
  rationale: 该副词性结构表达安全、无忧地居住。“安然住”是现代汉语中简洁自然且庄重的搭配。
- source_word: וְאֵין מַחֲרִיד
  choice: 无人使他们惊惶
  rationale: מַחֲרִיד是使人战栗、惊恐者。此译保留施事者“无人”，并采用自然的现代书面汉语。
theological_decisions:
- issue: 复兴语境中וְנָשׂוּ的含义
  choice: 按马所拉希伯来文本的通常词义译为“要担当”
  alternative: “要忘却自己的羞辱和一切不忠”
  rationale: 现存希伯来文本最直接表示承载或担当，而不是忘记。虽然复兴与安居的上下文以及古代译本传统促使一些译本采用“忘却”，但正文保留“担当”可忠实呈现原文，也不消解神恢复子民之后，他们仍与昔日羞辱和不忠相关这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“担当自己的羞辱”略带源语张力，属有意保留；后半句用“安然住……无人使他们惊惶”形成流畅、适合经文宣读的节奏。
