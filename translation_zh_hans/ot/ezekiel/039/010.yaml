id: EZK.39.10
reference: Ezekiel 39:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹֽא יִשְׂא֨וּ עֵצִ֜ים מִן הַ/שָּׂדֶ֗ה וְ/לֹ֤א יַחְטְבוּ֙ מִן הַ/יְּעָרִ֔ים כִּ֥י בַ/נֶּ֖שֶׁק יְבַֽעֲרוּ אֵ֑שׁ וְ/שָׁלְל֣וּ אֶת שֹׁלְלֵי/הֶ֗ם וּ/בָֽזְזוּ֙ אֶת בֹּ֣זְזֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/010.yaml
  text: They will not carry wood from the field[a], nor cut it from the forests, because they will make fires with the weapons. They will plunder those who plundered them and loot those who looted them[b], declares the Lord Yahweh.
translation:
  language: zh_hans
  text: 他们必不从田野搬木柴，也不从树林砍伐木头，因为他们要用兵器生火[a]。他们要掳掠那些掳掠他们的人，抢夺那些抢夺他们的人[b]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作“因为他们要用兵器烧火”；意思是他们要把入侵者留下的兵器当作燃料。
    reason: 说明希伯来文较为具体而不合现代汉语习惯的表达，并交代“用兵器生火”的含义。
  - marker: b
    text: 希伯来文连续使用两组同根词，近似“掳掠他们的掳掠者，抢夺他们的抢夺者”，强调局势的逆转和报偿。
    reason: 说明译文刻意保留的同根词重复及其修辞作用。
lexical_decisions:
- source_word: יִשְׂאוּ עֵצִים
  choice: 搬取木柴
  rationale: נשא在这里指把木料搬来作燃料；“搬取木柴”保留具体动作，也符合现代汉语表达。
- source_word: מִן הַשָּׂדֶה
  choice: 从田野
  rationale: שׂדה虽为带冠词的单数，在此可作集合性地域理解；“田野”比“田地”更能涵盖野外之意。
- source_word: יַחְטְבוּ מִן הַיְּעָרִים
  choice: 从树林砍柴
  rationale: חטב表示砍伐，尤其指砍木头；יערים是复数。“从树林砍柴”自然简明，并承接前面的“木柴”。
- source_word: כִּי בַנֶּשֶׁק יְבַעֲרוּ אֵשׁ
  choice: 因为他们要用兵器生火
  rationale: כִּי表达原因，בַּנֶּשֶׁק为工具或材料用法；译文既保留因果关系，也清楚表达兵器将被用作燃料。
- source_word: וְשָׁלְלוּ אֶת שֹׁלְלֵיהֶם
  choice: 他们要掳掠那些掳掠过他们的人
  rationale: 以重复“掳掠”再现希伯来文同根词结构，突出局势逆转与报偿。
- source_word: וּבָזְזוּ אֶת בֹּזְזֵיהֶם
  choice: 抢夺那些抢夺过他们的人
  rationale: 用重复“抢夺”保留第二组同根词修辞，同时与前一组“掳掠”相区分。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知书常见的权威宣告公式；“耶和华”在简体中文传统中是神圣四字名的通行音译，且避免把专名降为普通称号。
theological_decisions:
- issue: 如何翻译 אֲדֹנָי יְהוִה 中的神圣名字
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: אֲדֹנָי是“主”，יְהוִה是神圣名字。采用中文读者熟悉的“耶和华”保留专名性质，不将两者合并为一个普通称号；“雅威”虽更接近部分现代学界的拟音，但在普通中文读者中较不通行。
- issue: 两组同根词所表达的逆转
  choice: 分别重复“掳掠”和“抢夺”
  alternative: 概括为“他们要夺回仇敌抢走的财物”
  rationale: 原文没有明确说只是夺回原有财物，而是说他们将对掳掠、抢夺他们的人施行相应行动；保留重复可避免缩窄含义，并呈现报偿性的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“不再……也不再……”符合上下文所指将来不必继续取柴的情形；“要”表达预告而非命令。句末用“这是……的宣告”保留先知性公式的权威感。
