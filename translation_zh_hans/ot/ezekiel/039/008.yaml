source:
  edition: WLC
  text: הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה ה֥וּא הַ/יּ֖וֹם אֲשֶׁ֥ר דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/008.yaml
  text: Behold[a], it is coming, and it will happen, declares the Lord GOD. This is the day of which I have spoken.
translation:
  language: zh_hans
  text: 看哪，这事就要临到，也必定实现[a]。这是主雅威的宣告。这就是我所说的那一天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较贴近原文形式译为：“这事已经临到，也已经实现。”希伯来语使用完成式，可以把将来的事说成已经实现，以强调它必然发生。
    reason: 保留希伯来语动词形式在时间指向上的真实张力，并说明正文采用将来表达的依据。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中唤起注意、强调眼前性与确定性的感叹语气；用语庄重，也为现代读者所熟悉。
- source_word: בָאָה
  choice: 这事就要临到
  rationale: 原文为阴性单数完成式，但未明说主语；上下文指所预告之事。译文以“这事”避免误译为女性主体，并以“就要临到”自然表达先知性话语中把未来事件视为确定的用法。
- source_word: וְנִהְיָתָה
  choice: 也必定成就
  rationale: 动词 היה 在此表示事情发生、成为事实；“必定成就”既传达事件必然发生，也保留神谕庄重而确定的语气。
- source_word: נְאֻם
  choice: 宣告
  rationale: 这是典型的先知性神谕公式；“这是……的宣告”比口语化的“说”更能保留其正式语域。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别对应尊称 אֲדֹנָי 与神名 יהוה，是简体中文圣经语境中自然、可辨识且不重复为“主主”的表达。
- source_word: הוּא הַיּוֹם
  choice: 这就是……那一天
  rationale: הוּא 带有强调和指认作用；“这就是”凸显眼前应验之事与先前所说之日完全对应，“那一天”则由后续关系从句加以限定。
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: 我所说的
  rationale: 简洁保留“说/讲论”的基本意义，并自然修饰“那一天”，不额外限定神先前说话的具体方式。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”同时保留尊称与专名的区别，在现代中文圣经语境中通顺且广为理解；不以泛称“上帝”取代原文专名，也不借译名加入宗派性解释。
- issue: 完成式所指的时间与先知性确定语气
  choice: 正文译作将来而确定的“就要临到，也必定成就”，脚注保留完成式的形式可能性
  alternative: 已经临到，也已经成就
  rationale: 上下文把它指向神所预告之日，故正文用将来表达更符合汉语；但希伯来语完成式可把尚未来到的事说成已经完成，以突出其确定性，因此不应隐去这一张力。
- issue: בָאָה 的阴性形式与未明说的主语
  choice: 以中性的“这事”承接
  alternative: 她已经临到；灾祸临到
  rationale: 原文没有明说阴性名词所指为何；“这事”避免把语法性别实体化，也避免擅自确定为“灾祸”或“审判”。
translation_notes:
  register: 采用现代、庄重而易懂的先知性语体。“看哪”和“这是主耶和华的宣告”保留神谕的正式感；其余句式力求自然简明。脚注标记置于两个相关动词之后，使其清楚涵盖整组表达。
