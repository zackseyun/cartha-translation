  text: בְּ/שׁוֹבְבִ֤/י אוֹתָ/ם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֹתָ֔/ם מֵֽ/אַרְצ֖וֹת אֹֽיְבֵי/הֶ֑ם וְ/נִקְדַּ֣שְׁתִּי בָ֔/ם לְ/עֵינֵ֖י הַ/גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/027.yaml
  text: when I bring them back from the peoples and gather them from the lands of their enemies[a], and I am shown holy through them before the eyes of many nations.
translation:
  language: zh_hans
  text: 当我把他们从万民中带回、从他们仇敌的各地招聚他们时，我必在他们身上显为圣，在许多列国眼前。 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必在他们中间显为圣”或“我必借着他们显为圣”。原文也可较形式地译为“我必在他们身上被尊为圣”。意思是，耶和华借着他为他们所行的事，在列国面前公开彰显自己的圣洁。
    reason: 保留וְנִקְדַּשְׁתִּי בָם的被动／反身色彩，以及בם可译“在他们身上、在他们中间、借着他们”的歧义。
lexical_decisions:
- source_word: בְּשׁוֹבְבִי
  choice: 我把他们……带回来时
  rationale: שוב的使役义为“使返回、带回来”；介词בְּ加带第一人称单数词尾的不定式在此表示时间。上下文明确涉及从流亡之地归回。
- source_word: הָעַמִּים
  choice: 各族
  rationale: 用“各族”表达עמים，并与后文גוים所译的“国”保持词汇区别。
- source_word: וְקִבַּצְתִּי אֹתָם
  choice: 从……聚集他们
  rationale: קבץ意为“聚集、招聚”；在时间从句中与“带回来”构成相连的行动。
- source_word: מֵאַרְצוֹת אֹיְבֵיהֶם
  choice: 从仇敌的各地
  rationale: אַרְצוֹת是复数，可指诸地或诸国；“仇敌的各地”保留复数地理范围和所属关系，同时符合现代汉语。
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: 就要借着他们……显为圣
  rationale: קדש的Nifal形态在上帝为主语时表示其圣洁被公开彰显，而非获得圣洁；בם可表示“在他们身上”或“借着他们”。正文采用自然且能传达公开彰显之意的表达。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 保留希伯来语“在眼前”的可见性意象，表示公开显明。
- source_word: הַגּוֹיִם רַבִּים
  choice: 许多国的人
  rationale: גוים在此指国际意义上的诸国；译作“许多国的人”与前面的“各族”有所区别，也自然表达见证者是各国民众。
theological_decisions:
- issue: 上帝“被尊为圣／显为圣”的表述
  choice: 借着他们……显为圣
  alternative: 在他们身上被尊为圣；在他们中间显为圣
  rationale: 原文Nifal保留被动或反身色彩，重点是上帝的圣洁因他对以色列所行之事而在列国面前公开显明，并非上帝本身发生变化。“借着他们”表达בם的工具性理解，但脚注保留更形式对应的译法与介词歧义。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“各族”与“许多国的人”适度保留עמים和גוים的词汇区别；“显为圣”兼顾原文语态和汉语可懂度。
