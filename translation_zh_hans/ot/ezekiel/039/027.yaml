revisions:
- from: 我把他们从各族中带回来，从仇敌的各地聚集他们时，就要借着他们，在许多国的人眼前显为圣。[a]
  to: 当我把他们从万民中带回、从他们仇敌的各地招聚他们时，我必在他们身上显为圣，在许多列国眼前。 [a]
  rationale: 修订“许多国的人”为“许多列国”，以对应原文的国家／列国而非其民众；并将“借着他们”改为“在他们身上”，避免在正文中预先排除介词的其他合理理解。同步调整句式，使时间从句和预言性主句在现代庄重普通话中更清楚自然。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:53:06Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以时间性结构引出耶和华的行动：“当我把他们从万民中带回，并从他们仇敌的各地招聚他们时”。结尾的“在许多列国眼前”所指的是列国本身，而不只是“许多国的人”。נִקְדַּשְׁתִּי בָם应保留上帝的圣洁在以色列身上／借以色列而公开显明的含义；正文采用“在他们身上显为圣”较稳妥地保留介词的基本范围。
  naturalness: 原译总体庄重通顺，但“许多国的人”不够凝练，且将“列国”转换为其中的民众。“当……时，我必……”比“……时，就要……”更清晰地呈现时间结构及预言语境。“显为圣”在此类先知书语境中自然。
  terminology: 以“万民”译עמים、以“许多列国”译גוים，可在现代庄重汉语中保留两组词的适度区别。“在他们身上显为圣”避免把בם单一限定为工具性“借着他们”，同时不造成上帝获得圣洁的误解。
  issues:
  - severity: medium
    issue: “许多国的人”将“许多列国”具体化为其民众。
    rationale: הַגּוֹיִם רַבִּים的中心名词是“列国／国家”，而非“人”；“在许多列国眼前”既忠实保留原文意象，也更符合汉语圣经体表达。
  - severity: low
    issue: 正文把בָם单一解释为“借着他们”。
    rationale: 该介词可有“在他们身上／在他们中间／借着他们”等相关理解。正文改作“在他们身上显为圣”，并在脚注保留替代译法，更能保留原文的解释空间。
