  text: וְ/הָיָ֣ה בַ/יּ֣וֹם הַ/ה֡וּא אֶתֵּ֣ן לְ/גוֹג֩ מְקֽוֹם שָׁ֨ם קֶ֜בֶר בְּ/יִשְׂרָאֵ֗ל גֵּ֤י הָ/עֹֽבְרִים֙ קִדְמַ֣ת הַ/יָּ֔ם וְ/חֹסֶ֥מֶת הִ֖יא אֶת הָ/עֹֽבְרִ֑ים וְ/קָ֣בְרוּ שָׁ֗ם אֶת גּוֹג֙ וְ/אֶת כָּל הֲמוֹנֹ֔/ה וְ/קָ֣רְא֔וּ גֵּ֖יא הֲמ֥וֹן גּֽוֹג׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/011.yaml
  text: And it will be in that day that I will give Gog a burial place there in Israel[a], the Valley of the Travelers, east of the sea; and it will block the travelers. There they will bury Gog and all his multitude[c][b], and they will call it the Valley of Hamon-gog.
translation:
  language: zh_hans
  text: “到那日，我必在以色列给歌革一处葬地，就是海东面的过路者谷[a][b]；这谷必阻挡过路的人。他们要在那里埋葬歌革和他所有的众人，并称那地为‘哈们歌革谷’[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “过路者谷”也可译作“经过者之谷”或“过路人之谷”。
    reason: lexical_alternative
  - marker: b
    text: “海东面”也可译作“海前面”或“面向海的地方”；希伯来语可表示相对方位，不一定严格指正东。
    reason: lexical_alternative
  - marker: c
    text: “哈们歌革”大意是“歌革的众多随从”或“歌革的人众”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: 到那日
  rationale: 这是常见的先知性时间公式；译为“到那日”简洁自然，同时保留预告将来之事的庄重语气。
- source_word: מְקוֹם שָׁם קֶבֶר
  choice: 一处坟地
  rationale: “坟地”自然表达供埋葬使用的地点；“在那里”的方位信息随后由“就是……过客谷”及下句“在那里”明确呈现，避免生硬重复。
- source_word: גֵּי הָעֹבְרִים
  choice: 过客谷
  rationale: עֹבְרִים是עבר的分词实体化用法，指经过或过路的人。“过客谷”适合作为简洁的中文地名，同时保留其描述性含义。
- source_word: קִדְמַת הַיָּם
  choice: 海东面
  rationale: 在地理语境中，קִדְמַת通常可表示“在……东面”；译文保留较自然的方位理解，并以脚注注明也可能表示朝向或位于海前。
- source_word: וְחֹסֶמֶת הִיא אֶת הָעֹבְרִים
  choice: 这谷必阻挡过路的人
  rationale: חסם表示阻挡、堵住；补出“这谷”以清楚呈现阴性动词所指的先行词，但不增添希伯来文没有说明的阻挡方式。
- source_word: הֲמוֹנוֹ
  choice: 他的全部军众
  rationale: הָמוֹן可指众多的人、群体；上下文是歌革的军队。“军众”符合语境，又比“军团”或“部队”更少加入组织化含义。
- source_word: גֵּיא הֲמוֹן גּוֹג
  choice: 哈蒙歌革谷
  rationale: 该短语在此作为新命名的地名，主文采用音译，以保留专名性质；其构词含义在脚注中说明。
- source_word: אֶתֵּן לְגוֹג
  choice: 我必……给歌革
  rationale: נתן加לְ表示给予或指定给某人；“给歌革”直接保留原文表达，由宾语“坟地”说明所给之物。
theological_decisions:
- issue: 末尾地名应意译还是音译
  choice: 主文音译为“哈蒙歌革谷”
  alternative: 译为“歌革军众谷”或“歌革众人谷”
  rationale: 原文明确把该表达作为所起的地名。音译保留其专名功能，也避免把הָמוֹן在此处的语义范围限定得过窄；脚注说明其大意。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“必”保留先知预告的确定语气；地名“过客谷”兼具专名感和可理解性。所有脚注标记均紧随其所解释的词语。
