  text: וְ/אַתָּ֤ה בֶן אָדָם֙ הִנָּבֵ֣א עַל גּ֔וֹג וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ גּ֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֥שֶׁךְ וְ/תֻבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/001.yaml
  text: 'And you[a], son of man, prophesy against Gog, and say: Thus says the Lord GOD: Behold, I am against you, Gog, prince of Rosh, Meshech, and Tubal.'
translation:
  language: zh_hans
  text: “你，人子啊，要向歌革说预言，攻击他，说：‘主耶和华如此说：看哪，歌革，米设和土巴的大首领啊，我与你为敌。[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“罗施、米设和土巴的首领。”希伯来语“罗什”既可表示“居首的、最高的”，也可理解为专名“罗施”。
    reason: 保留 רֹאשׁ 作为普通名词或专名的两种可能读法。
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知一贯的称呼；保留原文意象和全书用语的一致性。
- source_word: הִנָּבֵא עַל
  choice: 说预言攻击
  rationale: הִנָּבֵא 表示奉命说预言；在审判语境中，介词 עַל 带有敌对指向，因此译作“攻击”。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的尊称“主”和神名 יהוה，在现代中文圣经语体中庄重而清楚。
- source_word: הִנְנִי אֵלֶיךָ
  choice: 看哪，我与你为敌
  rationale: “看哪”保留 הִנְנִי 的强调和先知宣告语气；在审判公式中 אֵלֶיךָ 表达敌对之意。
- source_word: נְשִׂיא
  choice: 首领
  rationale: 该词指有权柄的统治者或领袖；“首领”自然庄重，又不把其身份限定为王族。
- source_word: רֹאשׁ
  choice: 大
  rationale: 在 נְשִׂיא רֹאשׁ 这一结构中，רֹאשׁ 可作普通名词，表示居首、最高，故用“大首领”表达；把它视为专名“罗施”的读法保留在脚注。
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: 米设和土巴
  rationale: 两者均为专名，采用现代中文圣经中通行的音译。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”既体现复合神圣称号，又采用普通中文读者熟悉的神名形式；不把两个词合并为单一称号。
- issue: רֹאשׁ 是表示“最高”的普通名词，还是专名“罗施”
  choice: 米设和土巴的大首领
  alternative: 罗施、米设和土巴的首领
  rationale: 希伯来语结构自然允许 רֹאשׁ 修饰 נְשִׂיא，表达“大首领”或“最高首领”；但专名读法历史悠久且语文学上仍有可能，故以脚注保留真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“你，人子啊”保留原文直接呼告；“看哪”保留神谕的强调色彩。脚注标记紧随存在歧义的称号之后。
