  naturalness: 原译整体庄重通顺，但“全地的百姓”有不必要的全球性歧义；“那地所有的百姓”更自然且合乎上下文。脚注b的锚点不应置于句末的宣告公式之后，而应紧邻其所说明的“我彰显荣耀”。
  terminology: 将אֲדֹנָי יְהוִה译为“主雅威”，保留“主”及四字神名的专名性质，并与项目对YHWH采用“Yahweh／雅威”的术语决定一致。
