base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/013.yaml
  text: All the people of the land will bury them[a], and it will be to their renown on the day I glorify myself[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 那地所有的百姓都要埋葬他们；这事要使他们得名声。在我彰显荣耀的日子[a]，这是主雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我彰显荣耀”也可译作“我得荣耀”或“我使自己得荣耀”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָבְרוּ
  choice: 都要埋葬
  rationale: 该完成式在预言语境中指向将来；“要埋葬”既自然，又保留具体行动。
- source_word: כָּל עַם הָאָרֶץ
  choice: 全地的百姓
  rationale: 此处语境是当地居民参与埋葬，并非泛指全人类；“全地的百姓”保留集合意义和地域限定。
- source_word: וְהָיָה לָהֶם לְשֵׁם
  choice: 这事必使他们得名声
  rationale: 字面为“这要成为他们的名”，是指名望或声誉的希伯来语习语；“得名声”传达其意义，同时由“这事”明确承接埋葬行动。
- source_word: יוֹם הִכָּבְדִי
  choice: 在我彰显荣耀的日子
  rationale: 该形式可表达上帝的荣耀得到彰显，既可能带有自我彰显，也可理解为受荣耀；正文采用自然且不过度限定语态的表达，并以脚注保留其他理解。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知书常见的宣告公式；אֲדֹנָי译作“主”，יהוה以现代中文圣经中易懂且庄重的“耶和华”音译呈现。
theological_decisions:
- issue: יוֹם הִכָּבְדִי的语态及上帝荣耀的彰显
  choice: 在我彰显荣耀的日子
  alternative: 在我得荣耀的日子；在我使自己得荣耀的日子
  rationale: 希伯来文可体现上帝荣耀的显明，并容许中间/反身或被动色彩。正文避免把动作方式限定得过窄，脚注保留真实歧义。
- issue: 神名יהוה在אֲדֹנָי יְהוִה中的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 原文直接使用四字神名。采用“耶和华”可与普通现代中文读者熟悉的传统表达衔接，也避免用泛称“上帝”抹去专名性质；“雅威”是可据学术重构采用的另一音译。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“全地的百姓”承接当地埋葬场景；分号呈现行动与结果的关系。所有脚注标记均置于正文中。
