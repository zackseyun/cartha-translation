source:
  edition: WLC
  text: בְּשַׂ֤ר גִּבּוֹרִים֙ תֹּאכֵ֔לוּ וְ/דַם נְשִׂיאֵ֥י הָ/אָ֖רֶץ תִּשְׁתּ֑וּ אֵילִ֨ים כָּרִ֤ים וְ/עַתּוּדִים֙ פָּרִ֔ים מְרִיאֵ֥י בָשָׁ֖ן כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/018.yaml
  text: You will eat the flesh of mighty men[a], and you will drink the blood of the princes of the earth—rams, lambs, male goats, and bulls[b], all of them fattened ones of Bashan.
translation:
  language: zh_hans
  text: 你们要吃勇士的肉，喝全地首领的血——公绵羊、羊羔、公山羊和公牛[a]，都是巴珊的肥畜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的牲畜名称——公绵羊、羊羔、公山羊和公牛——是献祭性的比喻，指被杀的首领和勇士。
    reason: cultural_note
  - marker: b
    text: “肥畜”也可译作“肥育的牲畜”或“肥壮的牲畜”。巴珊以牧场肥美、牲畜壮肥著称。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר
  choice: 肉
  rationale: 此处指身体的肉；“肉”在现代汉语中自然直接，也保留献祭筵席意象的骇人力度。
- source_word: גִּבּוֹרִים
  choice: 勇士
  rationale: 在战败军队的语境中指强悍的战士；“勇士”简洁庄重，并保留阳性复数所指的人群。
- source_word: תֹּאכֵלוּ
  choice: 你们要吃
  rationale: 未完成式在先知宣告中带有将来性和召请意味；“要吃”兼顾宣告与命令般的语气。
- source_word: דַם
  choice: 血
  rationale: 保留战争献祭图景中的字面血腥意象，不作弱化。
- source_word: נְשִׂיאֵי הָאָרֶץ
  choice: 地上首领
  rationale: נְשִׂיאֵי 可指首领、领袖或王侯；“首领”避免限定为世袭王公。הָאָרֶץ 在此语境具有广泛地域意义，译作“地上”较“本地”更合适。
- source_word: תִּשְׁתּוּ
  choice: 喝
  rationale: 与前面的“要吃”并列，共同承载先知性宣告；汉语可省略第二个“要”而不损失语气。
- source_word: אֵילִים
  choice: 公绵羊
  rationale: 该词在这里属于献祭牲畜清单，采用字面动物义；“公绵羊”清楚区别于后面的肥羊羔。
- source_word: כָּרִים
  choice: 肥羊羔
  rationale: 可指幼羊或肥育的羊；结合巴珊肥畜意象，译作“肥羊羔”，既避免与 אֵילִים 重复，也呈现其肥育色彩。
- source_word: עַתּוּדִים
  choice: 公山羊
  rationale: 明确表达雄性山羊，符合现代汉语习惯。
- source_word: פָּרִים
  choice: 公牛
  rationale: 在献祭牲畜清单中指雄性牛类；“公牛”直接自然。
- source_word: מְרִיאֵי בָשָׁן
  choice: 巴珊的肥畜
  rationale: מְרִיאֵי 指肥育、壮肥的牲畜；“肥畜”保留畜群意象，并自然关联以丰美牧场闻名的巴珊。
- source_word: כֻּלָּם
  choice: 个个都是
  rationale: 概括前列各类动物意象，也使其与“巴珊的肥畜”顺畅衔接。
theological_decisions:
- issue: 动物清单应只按字面牲畜理解，还是作为被杀首领和勇士的隐喻同位语
  choice: 正文保留各动物名称，并以“他们如”显明这些牲畜形象比拟前述勇士和首领。
  alternative: 完全按字面并置，不补出“他们如”；或直接意译为各类统治者和战士。
  rationale: 希伯来文以牲畜清单延展献祭筵席的隐喻，所指仍是前述人类死者。明示“他们如”可避免现代读者误以为经文突然转指另有一批真实牲畜，同时不把生动的动物意象扁平化为解释。
- issue: הָאָרֶץ 的范围
  choice: 译作“地上”，保留广泛、跨地域的理解。
  alternative: 译作“那地”或“本地”。
  rationale: 本段描写列国军旅遭审判，不宜无根据地把所指限定为以色列地；同时“地上”保留原词可能具有的宽广范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“吃……肉，喝……血”保留原文强烈的献祭与战场筵席意象；用破折号展开动物比喻，并以“他们如”使汉语指代清楚。所有脚注标记均已置于正文。
