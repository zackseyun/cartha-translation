  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַנְשֵׁ֨י תָמִ֤יד יַבְדִּ֨ילוּ֙ עֹבְרִ֣ים בָּ/אָ֔רֶץ מְקַבְּרִ֣ים אֶת הָ/עֹבְרִ֗ים אֶת הַ/נּוֹתָרִ֛ים עַל פְּנֵ֥י הָ/אָ֖רֶץ לְ/טַֽהֲרָ֑/הּ מִ/קְצֵ֥ה שִׁבְעָֽה חֳדָשִׁ֖ים יַחְקֹֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/014.yaml
  text: And they will set apart men continually[a], who will pass through the land burying those who pass through, those left on the surface of the land, to cleanse it[c][b]. At the end of seven months they will make a search.
translation:
  language: zh_hans
  text: 他们要派定常任人员[a]，在这地巡行，埋葬那些经过者，即那些遗留在地面上的人[b]，为要洁净这地。七个月结束时，他们要进行仔细搜查[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们要不断委派人员”。原文直译为“常续之人”，指持续或固定承担这项任务的人。
    reason: lexical_alternative
  - marker: b
    text: 原文在“巡行”和“经过者”两处使用同一个“经过、穿行”的词。这里的措辞较难理解；按上下文，所指是遗留在地面上、需要埋葬的死者，但译文保留了原文的重复。
    reason: lexical_alternative
  - marker: c
    text: “仔细搜查”也可译作“详加查找”或“彻底调查”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי תָמִיד
  choice: 常设专人
  rationale: 原文直译为“常续之人”，表示持续受派承担这项任务的人员。“常设专人”以自然的现代汉语表达长期、固定的委派。
- source_word: יַבְדִּילוּ
  choice: 要常设
  rationale: בדל 的使役式本义是“分别出来、划分出来”；在这里指为特定任务选定人员。“常设”结合上下文表达这种分别委派，同时避免生硬直译。
- source_word: עֹבְרִים בָּאָרֶץ
  choice: 巡遍全境
  rationale: עבר 表示经过、穿行；这里的分词描写受派人员在全地来回查找。“巡遍全境”准确传达有组织地走遍该地的行动。
- source_word: מְקַבְּרִים
  choice: 埋葬
  rationale: קבר 的分词表示巡行人员同时从事的持续行动；汉语用并列谓语“埋葬”简洁自然。
- source_word: הָעֹבְרִים
  choice: 那些经过的人
  rationale: 原文再次使用 עבר，语义颇为困难。正文保留“巡遍／经过”的词根呼应，不直接把它解释成“死者”，并由后面的同位说明限定其所指。
- source_word: הַנּוֹתָרִים עַל פְּנֵי הָאָרֶץ
  choice: 遗留在地面上的人
  rationale: נותרים 指留下、遗留者；עַל־פְּנֵי הָאָרֶץ 在此指暴露于土地表面。译文保留“人”的表达，并让埋葬语境表明这是遗留的尸体。
- source_word: לְטַהֲרָהּ
  choice: 好洁净这地
  rationale: טהר 可涵盖礼仪上的洁净与实际清除污秽。“洁净”保留这两方面，不把意义缩减为单纯卫生处理或礼仪程序。
- source_word: מִקְצֵה שִׁבְעָה חֳדָשִׁים
  choice: 七个月结束后
  rationale: מן 与 קצה 的组合标明下一行动开始的时间点；此译符合上下文的时间顺序，也适合现代汉语。
- source_word: יַחְקֹרוּ
  choice: 还要仔细搜查
  rationale: חקר 指深入查找、彻底调查。“仔细搜查”体现有组织而周密的搜索；“还”连接前面的七个月埋葬工作与后续检查。
theological_decisions:
- issue: 这地得洁净的性质
  choice: 采用“洁净”，同时保留礼仪除污与实际清理的含义
  alternative: 仅译作礼仪上的“使之成为洁净”，或仅译作实际的“清理干净”
  rationale: 尸体使土地受污的背景具有礼仪含义，埋葬遗骸又是实际行动；原文没有要求把其中一面排除。
- issue: “那些经过的人”的身份
  choice: 在正文保留原文重复使用“经过”的困难措辞，并以脚注说明
  alternative: 直接释为“死者”“阵亡者”或“路旁遗骸”
  rationale: 上下文显然涉及待埋葬的遗骸，但 הָעֹבְרִים 的准确语义存在困难。保留词语呼应可避免以解释替代原文本身。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“常设专人”传达行政性的持续委派；“巡遍全境”比逐字译作“经过这地”更符合汉语习惯。正文保留 הָעֹבְרִים 的语义难点，并用脚注解释，而不武断地将其改写为某一类死者。所有脚注标记均置于相关词句之后。
