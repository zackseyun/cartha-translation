  text: And I will strike your bow from your left hand[a], and I will make your arrows fall from your right hand.
translation:
  language: zh_hans
  text: 我必击落你左手中的弓，又必使你右手中的箭掉落。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: 我必击落
  rationale: נכה的使役式在此表示击打武器，使其脱手或失去作用。“击落”以自然简洁的中文传达这一动作及其结果；句首连接词与后半句以“又”体现并列关系。
- source_word: קַשְׁתְּךָ
  choice: 你的弓
  rationale: קֶשֶׁת通常指武器“弓”，第二人称阳性单数后缀译为“你的”。结合介词短语，表述为“你左手中的弓”。
- source_word: מִיַּד שְׂמֹאולֶךָ
  choice: 你左手中的
  rationale: 原文直译近于“从你的左手”。中文用“你左手中的弓”并以“击落”表达弓从手中脱落，保留具体的身体意象。
- source_word: וְחִצֶּיךָ
  choice: 又……你的箭
  rationale: חֵץ的复数形式意为“箭”，第二人称阳性单数后缀译为“你的”；连接词译作“又”，保持两分句的平行。
- source_word: מִיַּד יְמִינְךָ
  choice: 你右手中的
  rationale: 原文意为“从你的右手”。采用“你右手中的箭……掉落”，既符合现代汉语，也保留左右手的平行结构。
- source_word: אַפִּיל
  choice: 必使……掉落
  rationale: נפל的使役式明确表示“使……落下”，不是单纯的不及物“落下”。“使……掉落”保留使役含义，并呈现箭从手中落下的画面。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“必”体现预告性语气；“击落”与“使……掉落”分别保留两个希伯来动词的差别及左右手之间的平行意象。无需脚注，因为使役意义可直接在正文中清楚表达。
