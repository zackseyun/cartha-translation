id: EZK.39.24
reference: Ezekiel 39:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כְּ/טֻמְאָתָ֥/ם וּ/כְ/פִשְׁעֵי/הֶ֖ם עָשִׂ֣יתִי אֹתָ֑/ם וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/024.yaml
  text: According to their uncleanness and according to their transgressions I dealt with them[a], and I hid my face from them.
translation:
  language: zh_hans
  text: 我照着他们的污秽和过犯对待他们[a]，并且向他们掩面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我按着他们的不洁和悖逆处置他们。”
    reason: 词义及措辞的可行替代译法：טֻמְאָה可译“不洁”，פֶּשַׁע可突出“悖逆”，עשה אֹתָם可译“处置他们”。
lexical_decisions:
- source_word: כְּטֻמְאָתָם
  choice: 照着他们的污秽
  rationale: 前缀כְּ表示相称或依据，即“照着、按着”。טֻמְאָה在以西结书中兼具礼仪与道德层面的不洁含义；“污秽”自然且保留其广泛的先知性语域。
- source_word: וּכְפִשְׁעֵיהֶם
  choice: 和过犯
  rationale: פֶּשַׁע可指越界犯罪，也常含悖逆上帝之意。“过犯”保留道德及圣约层面的力度，又不把每一处都限定为公开叛逆。
- source_word: עָשִׂיתִי אֹתָם
  choice: 对待他们
  rationale: 此处עשה加宾语是“对待、处置”的惯用表达，并非“造了他们”。“对待他们”简明自然，并保留原文未明说具体惩罚方式的特点。
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: 并且向他们掩面
  rationale: 保留希伯来语“掩面”的形象，表达上帝在审判中收回眷顾或同在，而不在正文中将隐喻化约为单一解释。
- source_word: פָּנַי
  choice: 面
  rationale: 原文“我的面”具有重要的神学意象；汉语“向他们掩面”已由主语清楚表达为上帝的面，措辞也较自然庄重。
theological_decisions:
- issue: 是否把“向他们掩面”释义为上帝收回眷顾
  choice: 正文保留“向他们掩面”的隐喻
  alternative: 转脸不顾他们；收回对他们的恩宠
  rationale: 这一意象在先知书中承载圣约审判的含义，同时可涉及同在、眷顾和保护；保留隐喻可避免只落实为其中一个层面。
- issue: טֻמְאָה在先知语境中的含义
  choice: 译为“污秽”
  alternative: 不洁
  rationale: 该词在以西结书中可同时涵盖礼仪不洁与道德玷污。“污秽”在现代汉语中较易懂，也没有排除其礼仪背景；脚注补列“不洁”。
- issue: כְּ在两组罪名前所表达的关系
  choice: 理解为上帝照着他们的行为对待他们
  alternative: 因他们的污秽和过犯而处置他们
  rationale: 原文强调行动与其污秽、过犯相称，不只是一般性的因果关系；因此保留“照着”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“照着……对待”贴近希伯来语结构；“向他们掩面”保留经文意象。正文中的[a]与脚注对应。
