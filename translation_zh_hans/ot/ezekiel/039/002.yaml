  text: וְ/שֹׁבַבְתִּ֨י/ךָ֙ וְ/שִׁשֵּׁאתִ֔י/ךָ וְ/הַעֲלִיתִ֖י/ךָ מִ/יַּרְכְּתֵ֣י צָפ֑וֹן וַ/הֲבִאוֹתִ֖/ךָ עַל הָרֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/002.yaml
  text: I will turn you around[a], lead you on, bring you up from the far north[b], and bring you against the mountains of Israel.
translation:
  language: zh_hans
  text: 我要使你转向，领你前行[a]，使你从北方极远之地上来，带你攻打以色列的群山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个疑难动词也有译本理解为“只留下你的六分之一”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֹׁבַבְתִּיךָ
  choice: 我要使你转向
  rationale: 该形式在这里表达上帝使歌革改变行进方向。译作“使你转向”既体现上帝对其行动的支配，也避免把方向过度限定为返回原处。
- source_word: וְשִׁשֵּׁאתִיךָ
  choice: 领你前行
  rationale: 这是一个释义困难的动词。按表示引领或驱动前行的动词理解，最符合本句一连串移动动作的语境；“领你前行”在现代汉语中自然，并保留行动受上帝支配之意。另一个有翻译传统的理解收入脚注。
- source_word: וְהַעֲלִיתִיךָ
  choice: 使你……上来
  rationale: עלה的使役式通常表示“使上来”或“带上来”，保留原文的方向性和使役含义。
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: 从北方极远之地
  rationale: 该结构指北方遥远的边缘或尽头；“北方极远之地”比单说“远北方”更完整地传达原文。
- source_word: וַהֲבִאוֹתִיךָ עַל
  choice: 带你攻打
  rationale: 介词עַל在军事语境中表示朝向并攻击某处；“攻打”比中性的“带到”更能体现敌对进军的含义。
- source_word: הָרֵי יִשְׂרָאֵל
  choice: 以色列的群山
  rationale: 这是《以西结书》中常见的地域表达；“群山”自然地体现复数形式。
theological_decisions:
- issue: 对疑难动词וְשִׁשֵּׁאתִיךָ的理解
  choice: 按移动动词理解为“领你前行”
  alternative: 按数量或余民意义理解为“只留下你的六分之一”
  rationale: 上下文连续使用“使你转向”“使你上来”“带你”等移动动词，因此移动义最符合句法和语意流程。由于“只留下六分之一”的理解具有悠久翻译传统，但其词汇依据并不确定，故列入脚注而不写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文连续使役动作的节奏，并用“攻打”明确军事语境；不以特定教派解释消除疑难动词本身的不确定性。
