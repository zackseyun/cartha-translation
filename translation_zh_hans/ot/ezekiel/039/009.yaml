  text: וְֽ/יָצְא֞וּ יֹשְׁבֵ֣י עָרֵ֣י יִשְׂרָאֵ֗ל וּ/בִעֲר֡וּ וְ֠/הִשִּׂיקוּ בְּ/נֶ֨שֶׁק וּ/מָגֵ֤ן וְ/צִנָּה֙ בְּ/קֶ֣שֶׁת וּ/בְ/חִצִּ֔ים וּ/בְ/מַקֵּ֥ל יָ֖ד וּ/בְ/רֹ֑מַח וּ/בִעֲר֥וּ בָ/הֶ֛ם אֵ֖שׁ שֶׁ֥בַע שָׁנִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/009.yaml
  text: Then the inhabitants of the cities of Israel will go out and make fires with the weapons and burn them—the small shield and the large shield[a], the bow and the arrows[c][b], the hand-club and the spear—and they will make fires with them for seven years.
translation:
  language: zh_hans
  text: 以色列各城的居民必出去，用兵器生火焚烧：小盾牌和大盾牌[a]、弓和箭、手杖[b]和长矛；他们必用这些兵器生火七年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用了两个不同的“盾牌”用词，通常分别理解为较小的盾牌和较大的护身盾。
    reason: cultural_note
  - marker: b
    text: 或译“手持棍棒”。原文直译为“手中的杖”；在这份兵器清单中，可能指手持的击打武器。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: 将出去
  rationale: 保留יצא“出去”的基本意义，并符合先知性未来叙事。
- source_word: יֹשְׁבֵי עָרֵי יִשְׂרָאֵל
  choice: 以色列各城的居民
  rationale: 自然表达构造链“以色列众城的居住者”，且明确所指为城市居民。
- source_word: וּבִעֲרוּ וְהִשִּׂיקוּ בְּנֶשֶׁק
  choice: 用兵器生火焚烧
  rationale: 两个动词均涉及燃烧或点火，第二个动词的具体句法较难确定；结合下文，兵器显然被当作燃料。译文保留“生火”和“焚烧”两个动作而不作过细限定。
- source_word: נֶשֶׁק
  choice: 兵器
  rationale: 该词在此为集合名词，指各种武器装备；“兵器”适合后续军事器具清单。
- source_word: מָגֵן וְצִנָּה
  choice: 小盾牌、大盾牌
  rationale: 两词均指盾牌，但通常有尺寸或用途上的区别；正文以大小区分，并用脚注提示这一判断并非绝对。
- source_word: קֶשֶׁת וּבְחִצִּים
  choice: 弓箭
  rationale: 现代汉语中“弓箭”自然涵盖原文分别列出的弓与箭。
- source_word: מַקֵּל יָד
  choice: 手杖
  rationale: 字面为“手中的杖/手杖”；在兵器清单中很可能是手持击打武器，但原词未明确说是“棍棒”，故正文保留较形式对应的“手杖”并加注。
- source_word: רֹמַח
  choice: 长矛
  rationale: 常见军事用语，现代汉语明确自然。
- source_word: וּבִעֲרוּ בָהֶם אֵשׁ שֶׁבַע שָׁנִים
  choice: 他们要用这些生火，烧上七年
  rationale: 保留בָהֶם的工具意义，即以这些兵器作燃料；“烧上七年”自然表达持续时间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“用兵器生火焚烧”传达这些兵器被当作燃料，同时避免把较难确定的וְהִשִּׂיקוּ解释得过窄。脚注标记均置于对应正文词语之后。
