source:
  edition: WLC
  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אֱמֹר֩ לְ/צִפּ֨וֹר כָּל כָּנָ֜ף וּ/לְ/כֹ֣ל חַיַּ֣ת הַ/שָּׂדֶ֗ה הִקָּבְצ֤וּ וָ/בֹ֨אוּ֙ הֵאָסְפ֣וּ מִ/סָּבִ֔יב עַל זִבְחִ֗/י אֲשֶׁ֨ר אֲנִ֜י זֹבֵ֤חַ לָ/כֶם֙ זֶ֣בַח גָּד֔וֹל עַ֖ל הָרֵ֣י יִשְׂרָאֵ֑ל וַ/אֲכַלְתֶּ֥ם בָּשָׂ֖ר וּ/שְׁתִ֥יתֶם דָּֽם־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/017.yaml
  text: 'And you[a], son of man, thus says the Lord GOD: Say to every bird of every wing and to every beast of the field, ‘Gather yourselves and come; assemble from all around to my sacrifice that I am sacrificing for you, a great sacrifice on the mountains of Israel[b], and you shall eat flesh and drink blood.’'
translation:
  language: zh_hans
  text: “人子啊，主雅威如此说：你要对一切飞鸟[a]和田野的一切野兽说：‘你们要聚集前来，从四面八方集合，到我为你们宰献的祭牲那里来；这是在以色列众山上的大祭牲[b]。你们必吃肉、喝血。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“各样翅膀的鸟”，是指所有飞鸟。
    reason: lexical_alternative
  - marker: b
    text: “祭牲”也可理解为“祭宴”；原文以同根的名词和动词表达“宰献祭牲”，强化了献祭的场景。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是以西结书中反复出现的先知称谓；译作“人子”既贴近原文，也保留全书的用语一致性。
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: 分别体现“主”和神的专名YHWH，避免把两个成分合并为同一个称号。
- source_word: צִפּוֹר כָּל כָּנָף
  choice: 各类飞鸟
  rationale: 原文直译近似“各样翅膀的鸟”，是涵盖所有飞鸟的表达；中文用“各类飞鸟”自然传达其普遍范围。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的一切走兽
  rationale: 保留“田野”的意象，并以“一切走兽”表达野外陆生动物及其全称范围。
- source_word: הִקָּבְצוּ ... הֵאָסְפוּ
  choice: 聚集……集合起来
  rationale: 原文连续使用两个近义命令，译文用两个相关动词保留命令的叠加强调。
- source_word: מִסָּבִיב
  choice: 从四面八方
  rationale: 自然表达从周围各处前来的全面性。
- source_word: עַל זִבְחִי אֲשֶׁר אֲנִי זֹבֵחַ לָכֶם
  choice: 到我的祭牲这里来，就是我为你们宰献的
  rationale: 保留זבח名词与同根动词的重复及献祭场景；“到……这里来”按聚集语境表达עַל的方向意义。
- source_word: זֶבַח גָּדוֹל
  choice: 大祭牲
  rationale: “祭牲”保持献祭和宰杀的鲜明意象；下文的吃肉喝血同时显出祭宴层面。
- source_word: וַאֲכַלְתֶּם בָּשָׂר וּשְׁתִיתֶם דָּם
  choice: 你们必吃肉、喝血
  rationale: 直陈飞鸟和走兽将吞吃血肉，保留审判图景的强烈和骇人效果。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主雅威
  alternative: 主耶和华／主上帝
  rationale: 原文明确使用神的专名YHWH；音译为“雅威”保留其专名性质，同时以“主”对应אֲדֹנָי。
- issue: זֶבַח兼具祭牲与祭宴含义
  choice: 正文译“祭牲”，脚注说明“祭宴”可能
  alternative: 祭宴
  rationale: 本节把敌军尸体描绘成神所宰献之物，因此“祭牲”保留审判与献祭的张力；飞鸟走兽吃喝的语境又允许将其理解为祭宴，故不在正文中排除这一层含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“人子”“主雅威”等经文称谓；以短促命令和“吃肉、喝血”的直接措辞维持先知宣告的力度。
