  to: “人子啊，主雅威如此说：你要对一切飞鸟[a]和田野的一切野兽说：‘你们要聚集前来，从四面八方集合，到我为你们宰献的祭牲那里来；这是在以色列众山上的大祭牲[b]。你们必吃肉、喝血。’”
  rationale: 修订明确“一切飞鸟”的全称范围，将“走兽”改为更自然准确的“野兽”，并重组祭牲短语，消除中文修饰歧义。保留“主雅威”、祭祀语言、原文两项聚集命令，以及末句直接的审判意象。脚注锚点保留在“大祭牲”之后，使其所解释的祭牲／祭宴含义有明确依附对象。
