  text: וְ/לֹֽא אַסְתִּ֥יר ע֛וֹד פָּנַ֖/י מֵ/הֶ֑ם אֲשֶׁ֨ר שָׁפַ֤כְתִּי אֶת רוּחִ/י֙ עַל בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/029.yaml
  text: And I will no longer hide my face from them, when I have poured out my Spirit on the house of Israel, declares the Lord GOD.
translation:
  language: zh_hans
  text: 我不再向他们隐藏我的脸；当我已将我的灵浇灌在以色列家时，主耶和华如此宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַסְתִּיר ... פָּנַי
  choice: 向他们掩面
  rationale: 保留希伯来语“隐藏我的脸”的惯用意象，以“向他们掩面”表达撤回眷顾与同在，庄重而自然。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 此关系词可有关系、时间或因果色彩；结合完成式“我已浇灌”和“不再掩面”的宣告，译作“因为”较自然，也保留圣灵倾注作为不再掩面的依据。
- source_word: שָׁפַכְתִּי
  choice: 我已……浇灌
  rationale: 以完成体“已”对应希伯来语完成式，并保留“倾倒、浇灌”的具体意象。
- source_word: רוּחִי
  choice: 我的灵
  rationale: רוּחִי 在此指属于上帝的灵；不额外加入原文未明说的称号。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中“家”作为群体、民族共同体的传统表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 与神圣四字名，采用现代中文圣经读者熟悉的庄重表达。
theological_decisions:
- issue: אֲשֶׁר 所表达的逻辑关系
  choice: 因为
  alternative: 当我将……浇灌时／我将……浇灌以后
  rationale: 希伯来语关系词 אֲשֶׁר 本身具有弹性。这里采用因果理解，使“已浇灌我的灵”成为“不再掩面”的根据；不把它扩展为超出原文的系统性教义说明。
- issue: 圣灵倾注的时态
  choice: 我已将我的灵浇灌
  alternative: 我将把我的灵浇灌
  rationale: 原文 שָׁפַכְתִּי 是完成式，直译为“我已浇灌”；可视为先知性语境中对确定行动的完成式陈述，但译文不自行改成将来时。
translation_notes:
  register: 采用现代、庄重、易懂的书面普通话；保留“掩面”“浇灌”“以色列家”等先知文学意象，句末以“主耶和华如此宣告”自然呈现神谕公式。
