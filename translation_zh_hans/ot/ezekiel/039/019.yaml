base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/019.yaml
  text: You will eat fat until you are full[a], and you will drink blood to drunkenness, from my sacrifice that I have sacrificed for you.
translation:
  language: zh_hans
  text: 你们要吃脂油，吃到饱足；喝血，喝到醉；这些都出自我的祭物[a]，就是我为你们所宰献的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我为你们预备的祭宴。”原文直译为“我的祭物，就是我为你们所宰献的”；上下文表明，这是以被杀者为食的筵席。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: 你们要吃
  rationale: 在先知性宣告中，这个第二人称复数形式承接上文对飞鸟和野兽的吩咐与预告，用“要吃”自然表达将来的行动。
- source_word: חֵלֶב
  choice: 脂油
  rationale: 直接保留祭牲脂肪的含义和献祭意象；“脂油”比泛指肥肉的“肥肉”更贴近祭祀语境。
- source_word: לְשָׂבְעָה
  choice: 直到饱足
  rationale: 表达吃到完全满足的程度，并与下句“直到醉倒”构成平行。
- source_word: וּשְׁתִיתֶם דָּם
  choice: 要喝血
  rationale: 按原文直译，保留审判筵席刻意造成的强烈、骇人意象。
- source_word: לְשִׁכָּרוֹן
  choice: 直到醉倒
  rationale: 表示喝到醉酒的程度；“醉倒”在现代汉语中自然有力，也保持与“直到饱足”的结构平行。
- source_word: מִזִּבְחִי
  choice: 出自……祭
  rationale: מִן 表示所吃所喝之物来自上帝的祭牲；采用“出自”避免汉语中“从祭吃喝”的生硬表达。
- source_word: אֲשֶׁר זָבַחְתִּי לָכֶם
  choice: 我为你们献上的祭，就是我所宰献的
  rationale: 保留 זֶבַח 与 זָבַח 的名词—动词重复及献祭措辞。“宰献”兼顾宰杀与献祭，保留这场审判被描绘为祭牲筵席的严峻反讽。
theological_decisions:
- issue: 以献祭意象描写上帝的审判
  choice: 正文明确保留“祭”和“宰献”的献祭语言
  alternative: 译作“我为你们预备的祭宴”
  rationale: 原文刻意重复“祭／宰献”，把歌革军队遭杀戮描绘成供飞鸟走兽享用的祭牲。正文不以较柔和的“宴席”取代这一神学张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以分号呈现“吃脂油／喝血”的平行结构；保留原文献祭用语及其刻意重复，同时用脚注说明按上下文意译为“祭宴”的可能性。
