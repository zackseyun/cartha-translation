  text: וְ/יָדְע֣וּ הַ֠/גּוֹיִם כִּ֣י בַ/עֲוֺנָ֞/ם גָּל֣וּ בֵֽית יִשְׂרָאֵ֗ל עַ֚ל אֲשֶׁ֣ר מָֽעֲלוּ בִ֔/י וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶ֑ם וָֽ/אֶתְּנֵ/ם֙ בְּ/יַ֣ד צָרֵי/הֶ֔ם וַ/יִּפְּל֥וּ בַ/חֶ֖רֶב כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/023.yaml
  text: And the nations will know that the house of Israel went into exile for their iniquity[a], because they acted unfaithfully against me; so I hid my face from them and gave them into the hand of their adversaries[b], and they all fell by the sword.
translation:
  language: zh_hans
  text: 列国必知道：以色列家因自己的罪孽[a]而流亡，正是因为他们对我不忠；所以我向他们掩面，把他们交在他们仇敌手中[b]，他们都倒在刀下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可译作“罪责”；原词兼有罪恶及其所带来罪责的含义。
    reason: lexical_alternative
  - marker: b
    text: “交在……手中”是希伯来语表达，意思是把他们交在对方的权势之下。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ הַגּוֹיִם
  choice: 列国就会知道
  rationale: 在先知话语中，带连接词的完成式具有将来及结果意味；“就会知道”自然地承接上下文，并保留《以西结书》的认识主题。הַגּוֹיִם在此指以色列以外的各国，译作“列国”庄重而清楚。
- source_word: כִּי בַעֲוֺנָם גָּלוּ בֵית יִשְׂרָאֵל
  choice: 以色列家被掳，是因他们的罪孽
  rationale: גלה表示离开本土进入流亡状态；结合历史语境译作“被掳”最符合现代中文圣经语体。בֵית יִשְׂרָאֵל保留为“以色列家”，维持其群体与盟约色彩。עָוֺן兼有罪恶与罪责意味，“罪孽”保留其道德和审判分量。
- source_word: עַל אֲשֶׁר מָעֲלוּ בִי
  choice: 因为他们对我不忠
  rationale: מעל指背信、失信或不忠，尤其可用于与上帝关系中的信义破裂。“对我不忠”通顺明确，又不把经文本身未明说的盟约术语加入正文。
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: 所以我向他们掩面
  rationale: 保留“掩面”这一重要的希伯来语圣经意象，表达上帝撤回眷顾与保护；“所以”清楚呈现前后果效关系。
- source_word: וָאֶתְּנֵם בְּיַד צָרֵיהֶם
  choice: 把他们交在敌人手中
  rationale: 保留“在……手中”的原文意象，表示落入对方权势之下。צָרֵיהֶם在此指敌对者，译作“敌人”自然准确。
- source_word: וַיִּפְּלוּ בַחֶרֶב כֻּלָּם
  choice: 他们便都倒在刀下
  rationale: “倒在刀下”自然传达死于刀剑或战争审判的希伯来表达；“都”保留כֻּלָּם的总体性。
theological_decisions:
- issue: 以色列的罪、上帝掩面与被掳受败之间的因果关系
  choice: 正文明确呈现以色列因罪孽和对上帝不忠而被掳，并呈现上帝掩面、把他们交给敌人的主动作为。
  alternative: 只把被掳描述为一般历史事件，弱化其作为上帝审判的意义。
  rationale: 希伯来文明确把被掳归因于以色列的罪孽和不忠，也明确以上帝为掩面并交付他们的主语；译文同时保留人的责任和上帝的审判行动，不加以淡化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以色列家”“掩面”“倒在刀下”保留原文的重要圣经意象；句法则适度调整为自然中文。所有脚注标记均已置于正文相应位置。
