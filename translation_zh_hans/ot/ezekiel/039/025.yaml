id: EZK.39.25
reference: Ezekiel 39:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עַתָּ֗ה אָשִׁיב֙ אֶת שבית יַֽעֲקֹ֔ב וְ/רִֽחַמְתִּ֖י כָּל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/קִנֵּאתִ֖י לְ/שֵׁ֥ם קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/025.yaml
  text: 'Therefore thus says the Lord GOD: Now I will restore the fortunes of Jacob[a], and I will have compassion on the whole house of Israel[b], and I will be jealous for my holy name.'
translation:
  language: zh_hans
  text: 因此，主雅威如此说：“现在，我要恢复雅各的境况[a]，怜悯以色列全家，并为我的圣名发热心[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使雅各的被掳者归回。”这个希伯来语习语既可特指从被掳中归回，也可泛指恢复一个民族的境况。
    reason: alternative_reading
  - marker: b
    text: 或译：“为我的圣名怀有妒忌。”这里的“妒忌”指对圣名所怀的强烈、排他的维护，并非出于贪羡。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文并引出结论，清楚保留原文的推论关系。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中惯用的使者公式，同时符合庄重、自然的现代汉语。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי 的主权称号和 יהוה 的专名，并采用现代中文圣经读者熟悉的组合形式。
- source_word: עַתָּה
  choice: 现在
  rationale: 标示上帝行动的决定性转折，简洁而直接。
- source_word: אָשִׁיב אֶת שבית יַעֲקֹב
  choice: 我要扭转雅各的境遇
  rationale: 该希伯来习语既可特指使被掳者归回，也可泛指使一个民族脱离灾祸、恢复景况；“扭转……的境遇”保留较宽的语义范围。
- source_word: יַעֲקֹב
  choice: 雅各
  rationale: 忠实保留原文所用的族长之名，不将其直接同化为“以色列”。
- source_word: וְרִחַמְתִּי
  choice: 怜悯
  rationale: 准确表达 רחם 所含深切的慈悲与怜爱，措辞自然庄重。
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: 保留“家”这一整体性、盟约性的群体称谓，并用“全”表达 כָּל。
- source_word: וְקִנֵּאתִי
  choice: 并……大发妒忌
  rationale: קנא 在这里表达上帝为其圣名所怀的强烈、排他的维护之情；“大发妒忌”较直接地保留其盟约性力度，而不把它弱化为一般的热诚。
- source_word: לְשֵׁם קָדְשִׁי
  choice: 为我的圣名
  rationale: 表达这份妒忌或热忱所关切、所维护的对象，即上帝自己的圣名。
theological_decisions:
- issue: 如何译出 יהוה
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是现代中文读者广泛熟悉的神名形式，也使 אֲדֹנָי 与 יהוה 在组合称号中得到区分；“雅威”是较贴近学界常见重构发音的替代译法。
- issue: אֶת שבית יעקב 所表达的复兴范围
  choice: 扭转雅各的境遇
  alternative: 使被掳的雅各人归回
  rationale: 此习语可能指从被掳中归回，也可能更广泛地指民族景况得到恢复。正文不将其限制为单一历史机制，较具体的被掳含义收入注释。
- issue: 上帝的 קנאה 应译为妒忌还是热心
  choice: 为我的圣名大发妒忌
  alternative: 为我的圣名大发热心
  rationale: 原词兼有妒忌与热忱的语义色彩；正文保留其排他而强烈的盟约含义，注释则给出较自然、较少引起负面联想的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“扭转……的境遇”避免把含义过早限定为政治昌盛或单纯的被掳归回；“大发妒忌”有意保留原文的神学张力，并借脚注说明其含义。所有脚注标记均置于正文相应词组之后。
