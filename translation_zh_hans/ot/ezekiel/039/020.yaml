base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/020.yaml
  text: And you will be filled at my table with horse and chariot[a], mighty man and every man of war[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 你们必在我的筵席上，以马和战车[a]、勇士[b]和所有作战的人为食，吃得饱足。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“马和战车”；两个词均为单数，在这里很可能具有集合意义，泛指战马和战车等军力装备。
    reason: lexical_alternative
  - marker: b
    text: “勇士”也可译作“强者”或“英勇的战士”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂבַעְתֶּם
  choice: 你们必……吃饱
  rationale: שׂבע在这里指进食达到饱足；“吃饱”自然明确，也契合上下文中献祭筵席的意象。
- source_word: עַל שֻׁלְחָנִי
  choice: 在我的席上
  rationale: עַל字面为“在……上”，与שֻׁלְחָן连用时译作“在我的席上”既保留桌席意象，也符合庄重的现代汉语。
- source_word: סוּס וָרֶכֶב
  choice: 马和战车
  rationale: 按马所拉文本保留两个单数名词；此处很可能作集合性用法，泛指军事力量及装备，但正文不直接复数化。
- source_word: גִּבּוֹר
  choice: 勇士
  rationale: גִּבּוֹר可指强者或英勇的战士；“勇士”与后面的“作战的人”保持一定词义区别。
- source_word: וְכָל אִישׁ מִלְחָמָה
  choice: 和所有作战的人
  rationale: 该短语直指参与战争的人；“所有作战的人”准确、自然，并保留כָל的整体范围。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: נְאֻם是庄严的先知宣告公式；此译法在现代汉语中清楚并保留其神谕语气。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现אֲדֹנָי的“主”和四字神名יהוה的传统中文译名“耶和华”，避免把两个称谓合并。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 原文明确使用四字神名；“主耶和华”在简体中文圣经语境中可辨识度高，并同时保留“主”这一称号和专名，不将其简化为泛称。
- issue: 宴席意象中的受食者与食物
  choice: 保留“你们……吃饱马和战车、勇士和所有作战的人”的强烈表述
  alternative: 解释性改写为“你们必吃尽战马、驾车者和众战士”
  rationale: 本节承接前文对飞鸟和走兽的召唤，形成审判筵席的意象；正文保留原文列举方式，不把受食者明说为鸟兽，也不将“战车”改成文本未明说的“驾车者”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“席”比“桌子”更能传达筵席和献祭宴席的语境；“吃饱”清楚表达饱足结果。正文严格保留所有脚注标记[a]、[b]。
