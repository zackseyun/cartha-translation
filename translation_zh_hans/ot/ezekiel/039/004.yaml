  text: עַל הָרֵ֨י יִשְׂרָאֵ֜ל תִּפּ֗וֹל אַתָּה֙ וְ/כָל אֲגַפֶּ֔י/ךָ וְ/עַמִּ֖ים אֲשֶׁ֣ר אִתָּ֑/ךְ לְ/עֵ֨יט צִפּ֧וֹר כָּל כָּנָ֛ף וְ/חַיַּ֥ת הַ/שָּׂדֶ֖ה נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/004.yaml
  text: On the mountains of Israel you will fall—you and all your troops and the peoples who are with you[b][a]. I have given you as food to every kind of bird of prey and to the wild animals of the field.
translation:
  language: zh_hans
  text: 你必倒在以色列众山上——你和你的全部军队[a]，以及与你同在的各族。我已把你交给各类猛禽[b]和田野的走兽作食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你的所有翅膀”，这里可能比喻歌革的各支军队、侧翼或附属部队。
    reason: lexical_alternative
  - marker: b
    text: 或译“各样有翅膀的鸟中的猛禽”；希伯来文的表达强调各类食腐飞鸟。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפּוֹל
  choice: 你必倒
  rationale: נפל的基本义是“倒下”。审判语境暗含战败和死亡，但正文保留具体意象，不直接扩译为“灭亡”或“倒毙”。
- source_word: אֲגַפֶּיךָ
  choice: 你的全部军队
  rationale: 该词字面与“翼”有关，在这里比喻歌革的军队、侧翼或附属部队；“全部军队”在现代汉语中清楚自然，字面意象收入脚注。
- source_word: עַמִּים אֲשֶׁר אִתָּךְ
  choice: 跟随你的各族
  rationale: עַמִּים是复数，通常指多个民族或族群，不宜缩窄为普通士兵；“各族”保留其群体与族群含义。
- source_word: לְעֵיט צִפּוֹר כָּל כָּנָף
  choice: 交给各类猛禽
  rationale: עֵיט指猛禽或食腐鸟，צִפּוֹר כָּל־כָּנָף以“各种翅膀”的表达强调所有类别；“各类猛禽”自然地传达这一总括意义。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的走兽
  rationale: 这是指野外陆生动物的惯用表达；“田野的走兽”保留圣经意象，同时在现代汉语中庄重易懂。
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: 我已把你交给……作食物
  rationale: 该结构表示将对象交出去供吞食；“交给……作食物”既自然，也保留审判中被弃置供野兽吞吃的严厉图景。
theological_decisions:
- issue: 神在审判中的主动作为及先知性完成式
  choice: 我已把你交给……作食物
  alternative: 我必把你交给……作食物
  rationale: נְתַתִּיךָ是第一人称单数完成式，字面为“我已经把你交给”。在先知话语中可用完成式表达未来审判的确定性；保留“已”能呈现判决仿佛已经落实的语气，而不消解其指向未来的张力。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。“你必倒”保留原文简洁有力的审判宣告；破折号呈现随后对“你”的扩展说明。正文所有脚注标记均与脚注对应。
