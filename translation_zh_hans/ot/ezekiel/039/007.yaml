source:
  edition: WLC
  text: וְ/אֶת שֵׁ֨ם קָדְשִׁ֜/י אוֹדִ֗יעַ בְּ/תוֹךְ֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/לֹֽא אַחֵ֥ל אֶת שֵׁם קָדְשִׁ֖/י ע֑וֹד וְ/יָדְע֤וּ הַ/גּוֹיִם֙ כִּי אֲנִ֣י יְהוָ֔ה קָד֖וֹשׁ בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/007.yaml
  text: And I will make my holy name known in the midst of my people Israel[a], and I will no longer let my holy name be profaned; and the nations will know that I am Yahweh[b], the Holy One in Israel.
translation:
  language: zh_hans
  text: 我要使我的圣名在我子民以色列中为人所知；我不再让我的圣名被亵渎[a]。列国就会知道，我是雅威，在以色列中为圣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我不再亵渎我的圣名。”希伯来语动词可这样直译；按上下文，也可理解为雅威不再容许他的名受亵渎。
    reason: 保留原文使役形在主动义与许可义之间的歧义。
  - marker: b
    text: 或译：“我是雅威，是在以色列中的圣者。”
    reason: 保留קָדוֹשׁ בְּיִשְׂרָאֵל可能的名词性称谓读法；正文采用较直接的谓语性读法。
lexical_decisions:
- source_word: שֵׁם קָדְשִׁי
  choice: 我的圣名
  rationale: 该结构是希伯来语惯用表达，指上帝彰显出来的名、声誉与圣洁；“我的圣名”简洁自然。
- source_word: אוֹדִיעַ
  choice: 使……为人所知
  rationale: ידע的使役形表达“使人知道、使……被认识”；其直接宾语是“我的圣名”，故不译作“使人认识我自己”。
- source_word: בְּתוֹךְ עַמִּי יִשְׂרָאֵל
  choice: 在我以色列民中
  rationale: 既保留“在……中”的空间和群体意象，也自然表达以色列是上帝之民。
- source_word: אַחֵל
  choice: 让……被亵渎
  rationale: חלל的使役形在此可作主动“亵渎”，也可表达容许之意。结合本段上帝维护其圣名的语境，正文采用“让……被亵渎”，并以脚注保留较直译的可能。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 此词泛指以色列以外的各国；“列国”符合先知书语域，又不引入后期“外邦人”的特定对照。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现上帝的专名，而不以称号替代。
- source_word: קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: 在以色列中的圣者
  rationale: 希伯来文可理解为名词性称谓“在以色列中的圣者”，也可作谓语“在以色列中是圣洁的”；正文采用前者，并在脚注保留后者。
theological_decisions:
- issue: וְלֹא אַחֵל אֶת שֵׁם קָדְשִׁי עוֹד中上帝行动的语态含义
  choice: 我不再让我的圣名被亵渎
  alternative: 我不再亵渎我的圣名
  rationale: 原文使役形容许主动和许可性两种理解。上下文强调上帝终止其名在列国中受辱的局面，故正文采用许可性表达，但不抹去原文较直接读法。
- issue: קָדוֹשׁ בְּיִשְׂרָאֵל的句法
  choice: 是在以色列中的圣者
  alternative: 在以色列中是圣洁的
  rationale: “圣者”的读法在汉语中庄重自然，也体现称谓性；然而希伯来文没有明确冠词，谓语性理解仍属可能，因此列入脚注。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名，音译“雅威”较直接地保留其专名性质，不用称号取代。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“为人所知”体现使役含义；“列国”和“圣者”保持先知文学的庄严语感。所有歧义均以正文加脚注呈现，未将解释性结论伪装成唯一译法。
