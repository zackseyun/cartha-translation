  text: And the name of the city will also be Hamonah[a]. Thus they will cleanse the land.
translation:
  language: zh_hans
  text: 那城也要名叫“哈摩拿”[a]。这样，他们就会洁净那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈摩拿”是地名，可能与希伯来语中表示“众多”或“大群”的词有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 承接上文并补充另一项命名信息；现代汉语用“也”即可自然表达附加语气。
- source_word: שֵׁם עִיר
  choice: 那城……名叫
  rationale: 原文直译为“城的名字”；结合特指语境，汉语用“那城也要名叫”更自然，并保留命名含义。
- source_word: הֲמוֹנָה
  choice: 哈摩拿
  rationale: 作为城名按希伯来语音译，不在正文中直接意译；其与“众多、群聚”一词的关联置于脚注说明。
- source_word: וְטִהֲרוּ
  choice: 这样，他们就洁净了
  rationale: Piel完成式带连接词；在此可表达前述埋葬与命名行动所达成的结果。译作“这样……就……”体现结果关系，同时以完成体“了”保留原文完成式的形式张力。
- source_word: הָאָרֶץ
  choice: 那地
  rationale: 指上下文中以色列境内因尸体而受污秽的土地，并非全世界；“那地”符合特指语境。
theological_decisions:
- issue: וְטִהֲרוּ 的时态与逻辑关系
  choice: 这样，他们就洁净了那地
  alternative: 于是他们将洁净那地／并且他们洁净了那地
  rationale: 希伯来语形式是连接词加Piel完成式，而预言语境容许结果性或将来性理解。正文保留完成式色彩，并用“这样”表明与前述行动的结果关系，不将其明确限定为单纯将来时。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“洁净”保留土地因尸体而受污秽、随后得到清除的礼仪及实际双重语感；城名使用引号帮助读者识别命名结构。
