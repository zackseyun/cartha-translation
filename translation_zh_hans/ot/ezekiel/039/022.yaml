  text: וְ/יָֽדְעוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם מִן הַ/יּ֥וֹם הַ/ה֖וּא וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/022.yaml
  text: And the house of Israel will know that I am Yahweh their God from that day onward[a].
translation:
  language: zh_hans
  text: 从那日起[a]，以色列家必一直知道我是耶和华——他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从那日以后”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 就会知道
  rationale: 在先知性话语中，此处动词表达将来的结果；“会知道”自然地保留认识与承认的含义，“就”承接上文所述事件。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来语的集体称谓及其群体性，同时是现代中文圣经语体中可理解的表达。
- source_word: כִּי
  choice: （由“知道”直接引出宾语从句）
  rationale: 此处引出所知道的内容；现代汉语在“知道”之后无需另译“that”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文通行的专名音译呈现四字神名，而不以“主”这一称号替代。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 准确表达带第三人称阳性复数后缀的盟约关系，并采用自然的现代汉语领属结构。
- source_word: מִן הַיּוֹם הַהוּא
  choice: 从那日起
  rationale: 标明持续状态开始的时间点，表达简洁自然。
- source_word: וָהָלְאָה
  choice: 直到永远
  rationale: 表达从所指之日起向前延续的时间范围；正文采用流畅中文，脚注保留更贴近字面的译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且明确作为专名的“耶和华”，不以称号“主”替代；脚注提示另一种常见拟音。
- issue: “知道”的内涵
  choice: 会知道
  alternative: 会承认
  rationale: 原文 ידע 可在盟约语境中兼含认识和承认；译作“知道”保留其语义宽度，避免把含义限定为公开承认。
- issue: 时间延续范围
  choice: 直到永远
  alternative: 从那时起／此后
  rationale: וָהָלְאָה 表示从该时间点往后延续，并不单独明确哲学意义上的无穷时间；正文用中文习惯表达长期持续，脚注提供更贴近形式且较少强化的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以色列家”保留原文的群体称谓；整体语序按中文习惯将时间短语前置。
