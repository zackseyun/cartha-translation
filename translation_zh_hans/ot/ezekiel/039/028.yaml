  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם בְּ/הַגְלוֹתִ֤/י אֹתָ/ם֙ אֶל הַ/גּוֹיִ֔ם וְ/כִנַּסְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹֽא אוֹתִ֥יר ע֛וֹד מֵ/הֶ֖ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/028.yaml
  text: Then they will know that I am Yahweh their God[a], when I exiled them among the nations and then gathered them onto their own land, and I will leave none of them there any longer.
translation:
  language: zh_hans
  text: 当我使他们流亡到列国，又把他们招聚回他们自己的土地时，他们就会知道我是雅威他们的上帝[a]。我不再把他们中的任何一个留在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必知道我是雅威他们的上帝，因为我使他们流亡到列国，又把他们招聚回他们自己的土地；我不再把他们中的任何一个留在那里。”
    reason: 希伯来语介词ב所引的不定式短语既可表示时间，也可表示方式或依据。
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 他们就知道
  rationale: 动词表示“知道、认识”；“就”自然体现上下文中上帝行动所带来的结果，同时保留其将来指向。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为上帝专名的性质，不以称号代替。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 准确表达带第三人称复数后缀的属有关系，现代汉语自然清楚。
- source_word: בְּהַגְלוֹתִי אֹתָם אֶל־הַגּוֹיִם
  choice: 我使他们流亡列国……时
  rationale: גלה在此为使役意义，指上帝使他们遭受流亡；“列国”比“外邦人”更符合此处地理与民族群体的含义。介词ב连于不定式，可作时间或方式、依据理解；正文采用时间读法，另一读法见脚注。
- source_word: וְכִנַּסְתִּים עַל אַדְמָתָם
  choice: 又把他们招聚回自己的土地
  rationale: כנס表示招聚、收集；“招聚回”自然呈现从列国返回故土的复归语境。אַדְמָה指他们所属的土地，“自己的土地”明确表达后缀。
- source_word: וְלֹא אוֹתִיר עוֹד מֵהֶם שָׁם
  choice: 我不再把他们任何一个留在那里
  rationale: הותיר的使役形表示“留下、使剩余”；“任何一个”传达部分介词מ与否定结合所表达的“一个也不”，而“在那里”回指列国或流亡之地。
theological_decisions:
- issue: 介词ב所引不定式短语与“知道”的关系
  choice: 正文按时间理解：当上帝使他们流亡并招聚他们时，他们便知道。
  alternative: 可按方式或依据理解：他们借着上帝使其流亡并招聚的作为，知道他是雅威。
  rationale: 希伯来语ב加不定式结构容许时间和方式两种理解；正文采用语境顺畅的时间读法，并以脚注保留真实歧义。
- issue: “在那里”（שָׁם）的所指
  choice: 指列国，即流亡之地。
  alternative: 仅作一般处所副词，不明确限定先行词。
  rationale: 本节把流亡列国与招聚回故土相对照，因此最近且最自然的所指是列国；句子应许无人继续滞留在流亡之地。
- issue: 末句的时间指向
  choice: 译为将来应许：“我不再……留在那里”。
  alternative: 按完成体的叙述视角译作已经没有留下任何人。
  rationale: אוֹתִיר是不完成式，在本段预言性的复归语境中自然表达将来或持续有效的应许；汉语“不再”既保留将来指向，也避免生硬添加“将要”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“流亡列国”“招聚回自己的土地”兼顾先知书语体与当代可读性；句末另起一句，使“不留下任何人”的应许清晰有力。
