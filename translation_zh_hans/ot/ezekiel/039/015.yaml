  text: וְ/עָבְר֤וּ הָ/עֹֽבְרִים֙ בָּ/אָ֔רֶץ וְ/רָאָה֙ עֶ֣צֶם אָדָ֔ם וּ/בָנָ֥ה אֶצְל֖/וֹ צִיּ֑וּן עַ֣ד קָבְר֤וּ אֹת/וֹ֙ הַֽ/מְקַבְּרִ֔ים אֶל גֵּ֖יא הֲמ֥וֹן גּֽוֹג־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/015.yaml
  text: And those who pass through the land will pass through[a], and when one sees a human bone[b], he will set up a marker beside it until the buriers have buried it in the Valley of Hamon-gog.
translation:
  language: zh_hans
  text: 那些巡行这地的人要在这地巡行；若有人看见一根人的骨头[a]，就要在它旁边立一个标记，直到负责埋葬的人把它埋葬在哈们歌革谷中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个男人的骨头。”希伯来语אָדָם在这里可泛指“人”；按收殓遗骨的语境，译作“人的”。
    reason: lexical_alternative
  - marker: b
    text: “哈们歌革”按希伯来语可能意为“歌革的群众”或“歌革的众多之人”；这里保留为地名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ הָעֹבְרִים בָאָרֶץ
  choice: 那些走遍这地的人要巡行各处
  rationale: 保留עבר与分词同词根的强调意味，同时用自然汉语表达受派之人在境内遍行搜寻，而非机械重复“经过的人经过”。
- source_word: וְרָאָה
  choice: 若有人看见
  rationale: 原文虽为阳性单数，承接前面的复数群体时表示其中任何一人；译为泛指的“有人”，并体现程序性条件。
- source_word: עֶצֶם אָדָם
  choice: 人的骨头
  rationale: עֶצֶם意为骨头，אָדָם在此泛指人类遗骸，不限定男性；“人的骨头”自然且准确。
- source_word: וּבָנָה אֶצְלוֹ צִיּוּן
  choice: 就在旁边立一个标记
  rationale: בנה本义为建造，但与ציון搭配并处于收殓程序语境中，指设立可辨识的标记；אצלו译为“在旁边”。
- source_word: עַד קָבְרוּ אֹתוֹ הַמְקַבְּרִים
  choice: 等负责埋葬的人把它埋到
  rationale: הַמְקַבְּרִים指承担埋葬工作的人；汉语以“负责埋葬的人”表达其指定职能，并保留“等……埋”的程序关系。
- source_word: אֶל גֵּיא הֲמוֹן גּוֹג
  choice: 哈מון歌革谷
  rationale: 将其作为前文已经命名的地名处理；介词אֶל保留向该谷迁葬的方向意味，因此用“埋到”。
theological_decisions:
- issue: אָדָם在遗骨语境中的范围
  choice: 人
  alternative: 男人
  rationale: 这里描述发现并收殓人的遗骨，语境没有限定死者为男性；采用泛指的“人”既符合词义，也避免无根据地缩窄范围。
- issue: הֲמוֹן גּוֹג作为地名还是释义
  choice: 保留音译地名“哈מון歌革谷”
  alternative: 译作“歌革群众之谷”或“歌革大军之谷”
  rationale: 本节把该短语当作已命名地点使用；正文保留地名可避免把הָמוֹן的具体所指过早固定，词义信息置于脚注。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“巡行各处”传达有组织地遍行全地的行动；“标记”和“负责埋葬的人”符合现代读者易懂的行政、收殓语境。正文所有脚注标记均已对应。
