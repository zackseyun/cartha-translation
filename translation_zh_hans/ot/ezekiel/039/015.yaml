  to: 那些巡行这地的人要在这地巡行；若有人看见一根人的骨头[a]，就要在它旁边立一个标记，直到负责埋葬的人把它埋葬在哈们歌革谷中[b]。
  rationale: 修订保留原文巡行相关词语的重复，并以“在这地巡行”表达בָּאָרֶץ而不额外断言“走遍各处”。“一根人的骨头”对应单数עֶצֶם אָדָם；“在它旁边立一个标记”对应设立标记于骨旁。末句改为现代汉语中完整的“直到……把它埋葬在……中”，同时保留指定埋葬者及谷名作为地名的处理。
