  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH，是上帝的名；传统中文常译“耶和华”。
    reason: 说明神名的原文形式及传统译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 该结构在这里引出新的先知信息单元；与“话”合译为“临到”，既符合希伯来先知书的固定表达，也自然承接上下文。
- source_word: דְבַר
  choice: 话
  rationale: דָּבָר 在先知宣告公式中指来自上帝的话语或信息；译作“话”保留这一庄重而透明的惯用表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名 YHWH；音译为“雅威”，以保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词 אֶל 加第一人称单数后缀意为“到我/向我”；结合汉语中先知领受启示的惯用说法，译为“临到我”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式常用于引出随后出现的直接引语；汉语用“说：”简洁自然，并清楚预告下一节的内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 本节使用的是神的专名 YHWH。正文采用较贴近学界通行发音的“雅威”，避免把专名默默替换为“主”这一称号；同时以脚注提示传统中文译名。
translation_notes:
  register: 采用现代、庄重且易懂的先知书语体。“雅威的话临到我”保留原文公式化表达；句末用冒号引出下一节的直接宣告。
