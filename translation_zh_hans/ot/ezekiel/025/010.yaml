  text: לִ/בְנֵי קֶ֨דֶם֙ עַל בְּנֵ֣י עַמּ֔וֹן וּ/נְתַתִּ֖י/הָ לְ/מֽוֹרָשָׁ֑ה לְמַ֛עַן לֹֽא תִזָּכֵ֥ר בְּנֵֽי עַמּ֖וֹן בַּ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/010.yaml
  text: to the people of the east[a], against the Ammonites; and I will give it as a possession[b], so that the Ammonites may no longer be remembered among the nations.
translation:
  language: zh_hans
  text: 我必将这地交给东方各族[a]，让他们对付亚扪人[b]；我必把它赐给他们作为产业[c]，使亚扪人在列国中不再被人记念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“东方之子”，是对东方民族或部族的称呼。
    reason: lexical_alternative
  - marker: b
    text: “让他们对付亚扪人”或译“连同亚扪人”。原文介词可表示针对、敌对，也可能表示附加或并列。
    reason: textual_ambiguity
  - marker: c
    text: “作为产业”或译“作为承受的地业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קֶדֶם
  choice: 东方各族
  rationale: 这是指东方民族或部族的惯用族群—地域称谓；译为“东方各族”既自然，也避免把“众子”误解为实际血缘关系。
- source_word: עַל בְּנֵי עַמּוֹן
  choice: 使他们攻击亚扪人
  rationale: עַל 在审判和领土转交的语境中可表达敌对、针对或凌驾于其上的关系；正文采用自然汉语表达其敌对含义，同时以脚注保留“连同亚扪人”的句法可能。
- source_word: וּנְתַתִּיהָ
  choice: 我必把这地赐给他们
  rationale: 阴性单数后缀回指上下文中的土地；汉语补出“这地”和领受者，使这个承接上节的残句清楚可读。
- source_word: לְמוֹרָשָׁה
  choice: 作产业
  rationale: מוֹרָשָׁה 指所占有或承受之物；“产业”保留土地归属与长期占有的含义，也符合庄重的经文语体。
- source_word: לְמַעַן לֹא תִזָּכֵר
  choice: 使……不再被人记念
  rationale: 保留目的或结果关系以及 זכר 的被动语态；“不再”自然表达亚扪作为民族不复在列国中享有记忆或地位。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: 此处指周围各民族或国家，不采用带有后期神学色彩的“外邦人”。
theological_decisions:
- issue: 亚扪“不再被记念”的审判力度
  choice: 译作“在列国中不再被人记念”
  alternative: 译作亚扪被彻底消灭，或仅仅不再出名
  rationale: 原文描述亚扪作为民族在列国记忆或地位中的消失；译文保留严厉的国家性审判，却不扩展为形而上的彻底抹除，也不弱化为单纯失去名声。
- issue: עַל בְּנֵי עַמּוֹן 与前后文的关系
  choice: 正文表达东方各族针对亚扪的敌对行动，并以脚注注明另一种句法理解
  alternative: 理解为摩押“连同亚扪人”一并交给东方各族
  rationale: 介词 עַל 在此可有“针对、攻击”之意，也可能承接上下文表示附加或并列。由于原文存在真实歧义，不在正文和注释中将其静默消除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“东方各族”“列国”“产业”保持先知审判宣告的正式语气；因本节承接上一节，适度补出“这地”和领受者，使中文独立呈现时仍通顺。
