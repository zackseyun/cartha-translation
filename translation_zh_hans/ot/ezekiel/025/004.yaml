base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/004.yaml
  text: Therefore, look, I am giving you to the sons of the east as a possession, and they will set their encampments in you and place their dwellings in you. They will eat your fruit, and they will drink your milk.
translation:
  language: zh_hans
  text: 因此，看哪，我要把你交给东方人作为产业；他们要在你那里安设他们的营寨，在你那里搭起他们的住处。他们要吃你的果子，喝你的奶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי קֶדֶם
  choice: 东方人
  rationale: 字面为“东方之子”，是希伯来语中指来自东方之人的惯用表达；译作“东方人”自然且准确。
- source_word: מוֹרָשָׁה
  choice: 产业
  rationale: 指可占有、承受的领地或财产；“产业”保留其占有和归属意味。
- source_word: טִירוֹתֵיהֶם
  choice: 营寨
  rationale: 此词可指营地、圈围的驻地或寨落；结合入侵者进驻亚扪之境的语境，“营寨”较为贴切，同时不将其过度具体化为宫殿。
- source_word: מִשְׁכְּנֵיהֶם
  choice: 住处
  rationale: 泛指居所；“住处”与前面的“营寨”形成区别，又不额外限定为永久建筑。
- source_word: פִרְיֵךְ
  choice: 你的果子
  rationale: 保留原文对亚扪的阴性单数拟人称呼及土地出产的形象。
- source_word: חֲלָבֵךְ
  choice: 你的奶
  rationale: 按原文直译，指其畜牧产物；不擅自改为更宽泛的“乳品”。
theological_decisions:
- issue: 上帝审判行动的直接性
  choice: 我要把你交给
  alternative: 我要让你落入……手中
  rationale: 原文 נֹתְנָךְ 直接表达上帝将亚扪交出；现译保留上帝作为审判施行者的明确性，不弱化其主动作用。
- issue: 对亚扪的第二人称阴性单数称呼
  choice: 全节持续使用“你”
  alternative: 改称“亚扪”或“你们”
  rationale: 原文把亚扪地或亚扪整体拟人化为阴性单数对象；保留“你”可维持先知话语的直接性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“看哪”对应 הִנְנִי 的提示和强调作用，并与先知文学语体相称；两次“在你境内”清楚表达 בָּךְ 的地点含义。
