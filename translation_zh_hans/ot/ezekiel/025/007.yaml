id: EZK.25.7
reference: Ezekiel 25:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֡ן הִנְ/נִי֩ נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וּ/נְתַתִּ֤י/ךָֽ ל/בג לַ/גּוֹיִ֔ם וְ/הִכְרַתִּ֨י/ךָ֙ מִן הָ֣/עַמִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךָ מִן הָ/אֲרָצ֑וֹת אַשְׁמִ֣ידְ/ךָ֔ וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/007.yaml
  text: Therefore[a], behold, I have stretched out my hand against you, and I will give you as plunder to the nations. I will cut you off from the peoples and destroy you from the lands; I will annihilate you, and you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 所以，看哪，我已伸手攻击你，要把你交给列国作掠物[a]。我要把你从万民中剪除，使你从各地消亡；我要灭绝你，你就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作掠物”或译“任列国抢掠”或“作列国的战利品”。
    reason: 原词 לְבַג 罕见，语境指被征服者掠夺之物；不同表达可分别突出被抢掠的状态或战利品的结果。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上一节的罪状，引出相应的审判后果，符合该推论连词的作用。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留先知宣告中引人注意、加强庄严语气的指示性表达。
- source_word: נָטִיתִי אֶת־יָדִי עָלֶיךָ
  choice: 我已伸手攻击你
  rationale: 保留“伸手”这一审判隐喻，并以“已”体现希伯来语完成式所表达的确定行动；“攻击”自然传达 עַל 在此处的敌对含义。
- source_word: וּנְתַתִּיךָ לְבַג לַגּוֹיִם
  choice: 要把你交给列国作掠物
  rationale: “掠物”保留军事征服后被夺取之物的意象；“交给”自然表达 נתן 在此处的处置含义。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指周围各外邦国家；“列国”既准确又符合先知书的庄重语体。
- source_word: וְהִכְרַתִּיךָ מִן־הָעַמִּים
  choice: 我要把你从万民中剪除
  rationale: 保留 כרת“剪除”的强烈比喻，并用“万民”与前面的“列国”保持希伯来语词汇上的区别。
- source_word: וְהַאֲבַדְתִּיךָ מִן־הָאֲרָצוֹת
  choice: 使你从各地消亡
  rationale: 以自然汉语表达使役形式“使之灭亡”，同时保留 מן־הארצות 所含从诸地消失、被除去的空间意味。
- source_word: אַשְׁמִידְךָ
  choice: 我要灭绝你
  rationale: שׁמד 是强烈的毁灭用语；“灭绝”体现本句在连续审判动词中的高潮。
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: 你就知道我是雅威
  rationale: 保留《以西结书》反复出现的认识公式，并以“就”自然呈现审判导致认识的结果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，以区别于称号“主”，并保留其作为立约之名的功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译，不以“主”替代，也不额外加入解释性称号。
- issue: 连续毁灭措辞的力度与递进
  choice: “剪除—消亡—灭绝”
  alternative: 三处均译作“毁灭”
  rationale: 原文依次使用 כרת、אבד、שׁמד 三个不同词根；采用不同汉语表达，既保留词义区别，也呈现审判宣告逐步加强的张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”“剪除”“雅威”保留经文的肃穆感；其余句法尽量符合现代普通话，避免生硬照搬希伯来语结构。
