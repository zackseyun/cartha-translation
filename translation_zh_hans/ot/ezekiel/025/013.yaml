  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָטִ֤תִי יָדִ/י֙ עַל אֱד֔וֹם וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֣ם וּ/בְהֵמָ֑ה וּ/נְתַתִּ֤י/הָ חָרְבָּה֙ מִ/תֵּימָ֔ן וּ/דְדָ֖נֶ/ה בַּ/חֶ֥רֶב יִפֹּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/013.yaml
  text: 'Therefore thus says the Lord GOD: I will stretch out my hand against Edom[a], and I will cut off from it man and beast, and I will make it a desolation; from Teman even to Dedan they will fall by the sword.'
translation:
  language: zh_hans
  text: 因此，主耶和华如此说：我必伸手攻击以东，从以东剪除人和牲畜；我必使它荒凉，从提幔直到底但，他们必倒在刀下。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 以现代中文圣经语体中自然而庄重的固定表达呈现复合神圣称号，并保留专名“耶和华”，避免译成重复的“主主”。
- source_word: וְנָטִתִי יָדִי
  choice: 我必伸手攻击
  rationale: 保留“伸手”的希伯来意象；结合介词 עַל 及审判语境补出“攻击”，清楚表达敌对性的介入。
- source_word: וְהִכְרַתִּי
  choice: 剪除
  rationale: “剪除”贴近 כרת 的切断、除灭意象，也保留审判用语的庄重力度，未将其泛化为单纯的“毁灭”。
- source_word: אָדָם וּבְהֵמָה
  choice: 人和牲畜
  rationale: אָדָם 在此泛指居民；בְהֵמָה 通常指陆生家畜或大型动物。译作“人和牲畜”自然地保留二者的对举。
- source_word: וּנְתַתִּיהָ חָרְבָּה
  choice: 我必使它荒凉
  rationale: 准确表达使以东成为荒废之地的使役结构；中文以形容词谓语表达比“使它成为荒凉”更自然。
- source_word: מִתֵּימָן וּדְדָנֶה
  choice: 从提幔直到底但
  rationale: 将两者按地名音译；方向后缀 -ָה 与 מִן 构成范围表达，中文用“从……直到……”清楚呈现毁灭所及的地理跨度。
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: 他们都必倒在刀下
  rationale: 保留“倒下”的原文意象，并以中文惯用的“倒在刀下”表达死于战争；“都”呼应复数主语及全境审判语境。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文明确使用四字神名。正文采用现代中文读者较熟悉且庄重的“耶和华”，同时不把专名弱化为普通称号；“雅威”是更接近学术重构读音的可行替代。
- issue: 末句复数主语“他们”的所指
  choice: 保留“他们”，不明确限定为某一类人
  alternative: 其居民都必倒在刀下
  rationale: יִפֹּלוּ 为阳性复数，但邻近的地名和前文的人畜并不能无歧义地提供单一语法先行词。保留代词可维护原文的概括性与轻微含混。
translation_notes:
  register: 采用现代、庄重而易懂的先知审判语体；保留“伸手”“剪除”“倒在刀下”等原文意象。原文没有“看哪”（הִנֵּה），故正文不应增译该词。
