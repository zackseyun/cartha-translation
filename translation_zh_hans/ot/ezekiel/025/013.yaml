  to: 因此，主耶和华如此说：我必伸手攻击以东，从以东剪除人和牲畜；我必使它荒凉，从提幔直到底但，他们必倒在刀下。
  rationale: 删除原文没有的“看哪”，并删除使末句语气额外加强的“都”。将“从那里”改为“从以东”，使中文指代明确，忠实对应 מִמֶּנָּה（从它／从以东），不改变意义。其余表达保留原稿的原文意象、地名和庄重语体。
