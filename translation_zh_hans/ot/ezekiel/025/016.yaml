  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֨י נוֹטֶ֤ה יָדִ/י֙ עַל פְּלִשְׁתִּ֔ים וְ/הִכְרַתִּ֖י אֶת כְּרֵתִ֑ים וְ/הַ֣אֲבַדְתִּ֔י אֶת שְׁאֵרִ֖ית ח֥וֹף הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am stretching out my hand against the Philistines, and I will cut off the Cherethites, and I will destroy the remnant of the seacoast.'
translation:
  language: zh_hans
  text: 因此，主耶和华如此说：看哪，我必伸手攻击非利士人，剪除基利提人[a]，灭尽沿海剩下的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“克里特人”；这个希伯来族名可能指与克里特有关的族群，正文按族名音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 这是复合神圣称号；用现代中文圣经语体中自然庄重的“主耶和华”，既体现 אֲדֹנָי 的“主”，也保留专名 יהוה 的传统中文形式。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 该词用于唤起注意，并引出迫近的神圣行动；“看哪”保留先知宣告的庄严语气。
- source_word: נוֹטֶה יָדִי
  choice: 我必伸手
  rationale: הִנְנִי 加分词表达即将发生且带有鲜明临场感的行动；中文以“必伸手”自然地表达迫近和确定性。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用该族群在现代中文圣经传统中的通行译名。
- source_word: וְהִכְרַתִּי
  choice: 剪除
  rationale: כרת 在审判语境中有“切断、除灭”之意；“剪除”既保留词的形象，也符合庄重中文表达。
- source_word: כְּרֵתִים
  choice: 基利提人
  rationale: 正文按族名音译，不把其与克里特人的可能关联直接定论化。
- source_word: וְהַאֲבַדְתִּי
  choice: 灭尽
  rationale: 使役形在这里表示使之灭亡；结合后面的“剩余者”，“灭尽”清楚表达彻底毁灭的审判。
- source_word: שְׁאֵרִית
  choice: 剩余的人
  rationale: 该词直指余剩者；这里用中性表达，避免把别处可能具有正面神学意义的“余民”概念带入本节。
- source_word: חוֹף הַיָּם
  choice: 沿海
  rationale: 原文意为“海岸”；“沿海”简洁自然，并符合非利士地区的地理语境。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文圣经语境中庄重、易懂，并区分称号“主”与神名；“雅威”更接近学术界常见的神名拟音，但正文不必以一个无法完全确定的古代读音取代通行中文形式。
- issue: כְּרֵתִים 所指族群的身份
  choice: 正文译作“基利提人”
  alternative: 克里特人
  rationale: 希伯来文呈现的是族名；它可能与克里特有关，但这一识别并不确定，因此正文保留音译，并在脚注说明另一可能。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，保留先知审判宣告的力度。“看哪”维持原文的提示语气；两个并列动词分别译为“剪除”和“灭尽”，避免抹平原文的措辞变化。
