  text: וְ/נָתַתִּ֤י אֶת רַבָּה֙ לִ/נְוֵ֣ה גְמַלִּ֔ים וְ/אֶת בְּנֵ֥י עַמּ֖וֹן לְ/מִרְבַּץ צֹ֑אן וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/005.yaml
  text: And I will make Rabbah a pasture for camels[a], and the Ammonites a resting place for flocks[c][b]; then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我要使拉巴成为骆驼的牧场[a]，使亚扪人成为羊群安歇之处[c][b]；这样，你们就知道我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“骆驼的住处”或“骆驼栖居之地”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“亚扪之子”，即“亚扪人”。
    reason: lexical_alternative
  - marker: c
    text: 或译“羊群躺卧之处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要使……成为
  rationale: 动词字面义为“给”，但在此处与地点及结果补语连用，表达使某地变成某种用途；译作“使……成为”符合现代汉语，也保留结果含义。
- source_word: רַבָּה
  choice: 拉巴
  rationale: 这是亚扪首都的专名，采用现代中文圣经中通行的音译。
- source_word: לִנְוֵה
  choice: 成为……的牧场
  rationale: 该词可指居所、住处或牧放之地；受“骆驼”限定时，“牧场”最符合上下文，同时用脚注保留其他可能。
- source_word: גְמַלִּים
  choice: 骆驼
  rationale: 直接表达原文复数类称；汉语不必另加复数标记。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人的地方
  rationale: 原文直译为“亚扪之子”，在这里以居民代指其地域。补出“地方”使“成为羊群安歇之处”的地点关系在汉语中自然清楚，并以脚注注明原文字面形式。
- source_word: לְמִרְבַּץ
  choice: 成为……安歇之处
  rationale: 该名词指牲畜躺卧、休息的地方；“安歇之处”既准确又保留牧野意象，不额外暗示有围栏。
- source_word: צֹאן
  choice: 羊群
  rationale: 该词泛指成群的小型牲畜，通常包括绵羊和山羊；“羊群”是简明自然的集合称呼。
- source_word: וִידַעְתֶּם
  choice: 这样，你们就知道
  rationale: 连接词与完成式在先知话语中表达随前述行动而来的结果；“这样……就……”自然呈现这一关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经传统中最通行的专名形式呈现四字神名，不用“主”这一称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用的是神的专名而非“主”的称号，因此正文保留专名。中文采用广为人知且庄重的“耶和华”；“雅威”是按现代学界常见拟音而来的另一译法，但原始读音不能完全确定。
- issue: בְּנֵי עַמּוֹן 是居民还是地域
  choice: 按转喻译为“亚扪人的地方”
  alternative: 直译“亚扪人”或“亚扪之子”
  rationale: 谓语“羊群安歇之处”需要地点作承载者，语境显示居民名称在此转指其土地。正文补明“地方”，脚注保留希伯来语的字面表达，避免误以为人本身成了牲畜躺卧之所。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。平行句式“使……成为……，使……成为……”保留原文结构；“安歇之处”维持审判预言中的牧野图景。所有脚注标记均置于相应词语之后。
