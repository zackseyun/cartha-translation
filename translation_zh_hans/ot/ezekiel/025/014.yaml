  text: וְ/נָתַתִּ֨י אֶת נִקְמָתִ֜/י בֶּ/אֱד֗וֹם בְּ/יַד֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/עָשׂ֣וּ בֶ/אֱד֔וֹם כְּ/אַפִּ֖/י וְ/כַ/חֲמָתִ֑/י וְ/יָֽדְעוּ֙ אֶת נִקְמָתִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/014.yaml
  text: And I will set my vengeance on Edom by the hand of my people Israel[a], and they will deal with Edom according to my anger and according to my wrath; and they will know my vengeance[c][b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 我要借着我子民以色列的手[a]，向以东施行我的报复[b]；他们必按着我的怒气和烈怒对付以东[c]，也必知道我的报复[d]。这是主雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “借着……的手”是希伯来语惯用表达，意思是“通过”或“借助”我子民以色列。
    reason: lexical_alternative
  - marker: b
    text: “向以东施行”也可译作“把……加在以东身上”。希伯来语介词在敌对行动的语境中可表示施加对象或针对的对象。
    reason: lexical_alternative
  - marker: c
    text: “对付以东”直译可作“在以东做”或“向以东行事”；原文动词含义宽泛，并未具体说明所做的事。
    reason: lexical_alternative
  - marker: d
    text: “他们”在原文中没有明说所指，可能指以东人，也可能承接前文指以色列人；“知道”在这里也可含亲身经历而认识之意。
    reason: ambiguity
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־נִקְמָתִי
  choice: 使我的报应临到
  rationale: נתן本义为“给、放置”，与“报应”连用时，译作“使……临到”既保留施加审判的具体意味，也符合现代汉语表达。
- source_word: נִקְמָתִי
  choice: 我的报应
  rationale: נקמה指报复、复仇或施行报应；这里是上帝对以东施行审判，“报应”能表达公义追讨，又避免把词义缩减为私人泄愤。
- source_word: בֶּאֱדוֹם
  choice: 临到以东
  rationale: 介词ב在敌对行动的语境中可表示“在……身上”或“针对……”。配合“使……临到”译为“临到以东”，自然地表达以东是报应的承受者。
- source_word: בְּיַד עַמִּי יִשְׂרָאֵל
  choice: 借着我子民以色列的手
  rationale: ביד是表示工具或媒介的惯用语。保留“手”的意象，同时用“借着”清楚表明以色列是上帝施行报应的工具。
- source_word: וְעָשׂוּ בֶאֱדוֹם
  choice: 他们必……对付以东
  rationale: עשה是宽泛的“做、行”，在此敌对语境中译作“对付”，不额外限定具体行动，也比直译“在以东做”自然。
- source_word: כְּאַפִּי וְכַחֲמָתִי
  choice: 照着我的怒气和烈怒
  rationale: אף与חמה在此并列，均表达震怒；分别译为“怒气”和“烈怒”，保留重复加强的效果。
- source_word: וְיָדְעוּ אֶת־נִקְמָתִי
  choice: 也必知道我的报应
  rationale: ידע在《以西结书》中常含亲身经历而认识之意。正文保留简洁的“知道”，不把体验性的含义过度解释进正文。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נאם是先知信息中的宣告公式；“主耶和华”直接保留אֲדֹנָי与神名יהוה的组合，是简体中文圣经语体中清楚而庄重的表达。
theological_decisions:
- issue: 上帝的报应与以色列的行动之间的关系
  choice: 上帝借以色列之手施行自己的报应
  alternative: 以色列独立采取报复行动，或上帝不借任何人的手直接行动
  rationale: 经文明说“我的报应”并同时说“借着我子民以色列的手”，因此既保留上帝的主导权，也保留以色列作为人间执行者的角色。
- issue: וְיָדְעוּ中复数主语所指
  choice: 正文保留“他们”的指代开放性
  alternative: 明确译为“以东人”或“以色列人”
  rationale: 希伯来文动词只标明复数，没有明说主语；上下文可能理解为承受报应的以东人，也可能沿用前句行动者以色列。正文不擅自消除这一语法张力，脚注说明歧义。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威、上主或以特殊字体写“主”
  rationale: “耶和华”是现代简体中文读者广泛识别的神名形式，并能在“主耶和华”中保留אֲדֹנָי יהוה两个称谓的区别；此处不以宗派性解释扩充经文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“手”的希伯来语意象、“怒气和烈怒”的并列加强，以及末句复数主语的真实歧义；不把宽泛的עשה具体化为某一种军事或司法行动。
