lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי（主）与神的专名 יהוה（耶和华），也符合现代中文圣经语体。
- source_word: יַעַן
  choice: 因为
  rationale: 自然、清楚地引出下文审判的缘由。
- source_word: בִּנְקֹם נָקָם
  choice: 施行报复
  rationale: 以自然中文表达同源词叠用所强调的蓄意报复行为；其强调形式在脚注中说明。
- source_word: לְבֵית יְהוּדָה
  choice: 向犹大家
  rationale: 保留“家”这一民族及群体称谓；结合敌对语境，以“向”引出报复对象。
- source_word: וַיֶּאְשְׁמוּ אָשׁוֹם
  choice: 因而罪责深重
  rationale: 希伯来文以动词和同源词强化有罪及担罪的程度；“罪责深重”兼顾罪咎状态与庄重语体。
- source_word: וְנִקְּמוּ בָהֶם
  choice: 报复他们
  rationale: 直接表达针对犹大家的报复行动，并保留本节反复出现的“报复”主题。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文同时使用“主”与 יהוה；译作“主耶和华”保留两个成分及盟约专名，不把二者合并。
- issue: 以东的罪责与报复行为之间的关系
  choice: 因而罪责深重
  alternative: 并且大大有罪
  rationale: “因而”顺应句法所呈现的行为与罪责关系，但不把后半句的报复改写为新的独立罪名；同时保留原文强调性的罪咎表达。
translation_notes:
  register: 采用现代、庄重而易懂的中文。保留“犹大家”这一群体称谓，并以两次“报复”再现原文的重复主题。经文在本节末尾仍属未完句，故以逗号收束，与后续审判宣告相接。
