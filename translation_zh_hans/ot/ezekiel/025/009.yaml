translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看哪”保留先知宣告的强调语气；“城邑”较“城市”更适合古代设防聚落。用冒号引出三个地名，并以“就是”与重复的“开始”显明原文连续介词短语的层递关系。
