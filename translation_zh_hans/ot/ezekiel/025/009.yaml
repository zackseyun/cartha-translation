  text: לָ/כֵן֩ הִנְ/נִ֨י פֹתֵ֜חַ אֶת כֶּ֤תֶף מוֹאָב֙ מֵ/הֶ֣/עָרִ֔ים מֵֽ/עָרָ֖י/ו מִ/קָּצֵ֑/הוּ צְבִ֗י אֶ֚רֶץ בֵּ֣ית הַיְשִׁימֹ֔ת בַּ֥עַל מְע֖וֹן ו/קריתמ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/009.yaml
  text: 'Therefore behold[a], I am opening the flank of Moab from its cities, from its frontier cities, the glory of the land: Beth-jeshimoth, Baal-meon[c][b], and Kiriathaim.'
translation:
  language: zh_hans
  text: 所以，看哪，我要敞开摩押的侧翼[a]，从它的城邑开始，就是从它边境的城邑——那地的荣美[b]，即伯耶西末、巴力免和基列亭[c]——开始。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“摩押的一侧”；直译“摩押的肩头”。
    reason: lexical_alternative
  - marker: b
    text: 或译“那地的华美”或“那地的荣耀”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文本在此末一地名使用一种较特殊的拼写形式；所指对应已知的摩押城邑“基列亭”。
    reason: textual_variant
lexical_decisions:
- source_word: לָכֵן הִנְנִי
  choice: 所以，看哪，我要
  rationale: “所以”承接上文的审判缘由；“看哪”保留 הִנְנִי 的提示与先知性临近感。“我要”以自然汉语表达该结构所指向的即将发生之事。
- source_word: פֹתֵחַ
  choice: 敞开
  rationale: 该分词与 הִנְנִי 连用，表达迫近的行动；“敞开”既保留“打开”的基本意象，也能自然表达使一片领土暴露出来。
- source_word: כֶּתֶף מוֹאָב
  choice: 摩押的侧翼
  rationale: כֶּתֶף 字面为“肩”，用于地理或军事语境可指一地的侧面、侧翼；“侧翼”保留其身体隐喻及暴露于攻击的含义。
- source_word: מֵהֶעָרִים מֵעָרָיו מִקָּצֵהוּ
  choice: 从它的城邑开始，就是从它边境的城邑……开始
  rationale: 连续的 מן 短语指出敞开的起点，后一句进一步限定前一句；补出“开始”和“就是”使希伯来语的层递关系在现代汉语中清楚而不改变内容。
- source_word: צְבִי אֶרֶץ
  choice: 那地的荣美
  rationale: צְבִי 可指美丽、华美、荣耀；“荣美”兼顾美丽与尊荣，适合这些著名边城的同位性描述。
- source_word: בֵּית הַיְשִׁימֹת
  choice: 伯耶西末
  rationale: 按现代中文圣经地名惯例音译，不将地名的词源意义另行翻译。
- source_word: בַּעַל מְעוֹן
  choice: 巴力免
  rationale: 采用通行的中文圣经地名音译，便于读者辨认。
- source_word: וקריתמה
  choice: 和基列亭
  rationale: 按马所拉传统所指的已知摩押城邑 Kiriathaim 采用通行中文音译；正文保留其作为第三个地名的功能。
