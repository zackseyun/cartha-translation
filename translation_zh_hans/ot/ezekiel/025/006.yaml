  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן מַחְאֲ/ךָ֣ יָ֔ד וְ/רַקְעֲ/ךָ֖ בְּ/רָ֑גֶל וַ/תִּשְׂמַ֤ח בְּ/כָל שָֽׁאטְ/ךָ֙ בְּ/נֶ֔פֶשׁ אֶל אַדְמַ֖ת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/006.yaml
  text: 'For thus says the Lord GOD: Because you clapped your hands and stamped your feet[a], and rejoiced with all the contempt in your soul against the land of Israel,'
translation:
  language: zh_hans
  text: 主耶和华如此说：“因为你拍手跺脚，并且怀着满心对以色列地的轻蔑而欢喜[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “满心”直译为“以你全然的轻蔑、在内心中”。“轻蔑”也可译作“鄙夷”或“敌意”；末尾短语可理解为这种轻蔑是针对以色列地的。
    reason: 保留 שָׁאט（轻蔑、鄙夷，亦可含敌意）及其与“内心”和“以色列地”之间修饰关系的合理歧义，不将“欢喜”解释为更具体的“幸灾乐祸”。
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留“主”这一称号和耶和华的专名，也符合庄重、通行的现代中文表达。
- source_word: יַעַן
  choice: 因为
  rationale: 明确引出下文审判的原因，保留原文的因果关系。
- source_word: מַחְאֲךָ יָד
  choice: 你拍手
  rationale: 原文是击掌的动作；“拍手”是自然的中文说法，并能表现因他人遭难而得意的姿态。
- source_word: וְרַקְעֲךָ בְּרָגֶל
  choice: 跺脚
  rationale: 准确传达用脚顿地的动作；中文无需机械保留原文单数。
- source_word: וַתִּשְׂמַח
  choice: 幸灾乐祸
  rationale: 动词本义为欢喜；结合拍手、跺脚、轻蔑及敌对对象的语境，“幸灾乐祸”自然地表达这种恶意的欢喜。
- source_word: בְּכָל שָׁאטְךָ בְּנֶפֶשׁ
  choice: 满心轻蔑地
  rationale: שָׁאט表示轻蔑、鄙夷，נֶפֶשׁ指人的内在生命或自我；“满心”兼顾“全然”和内心层面。
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: 对以色列地
  rationale: אֶל可表示朝向、针对；在敌意语境中用“对”既自然，又不把方向性过度解释为纯粹的敌对介词。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”同时保留 אֲדֹנָי 的称号和四字神名的专名性质，也是普通中文读者熟悉的庄重表达；不以“主上帝”替代专名。
- issue: 恶意欢喜的表达强度
  choice: 幸灾乐祸
  alternative: 欢喜
  rationale: 原词本身是“欢喜”，但整句的动作和“轻蔑”明确赋予其恶意色彩；“幸灾乐祸”传达语境含义，同时脚注保留较直译的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“拍手跺脚”简洁有力；“满心轻蔑地对……幸灾乐祸”在中文中自然呈现原文所描写的恶意庆幸。保留句末逗号，以衔接下一节尚未说完的审判宣告。
