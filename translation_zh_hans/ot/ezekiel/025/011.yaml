  text: וּ/בְ/מוֹאָ֖ב אֶעֱשֶׂ֣ה שְׁפָטִ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/011.yaml
  text: And in Moab I will execute judgments[a], and they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我必在摩押施行审判，他们就知道我是耶和华。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/מוֹאָב
  choice: 在摩押
  rationale: בְּ的基本意义是“在……中”；这里指施行审判的地域或范围。中文“在摩押”既贴近原文，也不必额外加入“攻击”的解释。句首וּ在中文中无需机械译出，承接关系由上下文自然体现。
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: 我必……施行审判
  rationale: עָשָׂה与复数שְׁפָטִים构成司法语境中的搭配，意为执行或施行审判。“施行审判”符合现代汉语习惯，并保留其司法及惩罚意味；汉语中不必刻意标示复数。
- source_word: וְיָדְעוּ
  choice: 他们就知道
  rationale: 此处连接词与完成式在预言语境中表达将来的结果。“就”自然呈现审判所带来的结果关系，而不把它过度改写为单纯的时间先后。
- source_word: כִּי
  choice: （知道）……
  rationale: כִּי引出“知道”的内容。现代汉语在“知道”后通常无需另译“即/那”，直接接宾语从句最自然。
- source_word: אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 保留原文显明的第一人称代词所带的强调，并将四字神名音译为中文传统且通行的“耶和华”，使其作为专名呈现，而非以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。中文“耶和华”是现代汉语圣经传统中最广为人知的专名形式，能保留这是神名而非普通称号；“雅威”更接近常见学术重构的发音，但在普通中文读者中较不通行，且原始发音不能完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。保留以审判使人认识耶和华这一因果张力，不补入原文未明说的对象或方式。原文段落结束标记不译入正文。
