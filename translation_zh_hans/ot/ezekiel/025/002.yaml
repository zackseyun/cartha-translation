  text: Son of man[a], set your face toward the sons of Ammon, and prophesy against them.
translation:
  language: zh_hans
  text: “人子啊，你要面向亚扪人，向他们说预言攻击他们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；“人子”保留希伯来语表达及全书的一致性。
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: 面向
  rationale: 原文直译为“把你的脸朝向”；现代汉语用“面向”既保留“脸朝向”的意象，也自然简洁。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 原文按字面是“亚扪之子”，在此为民族称谓；“亚扪人”是现代汉语清楚自然且不误限于男性的表达。
- source_word: וְהִנָּבֵא
  choice: 发预言
  rationale: 准确表达 נבא 的先知性宣告含义，并符合现代汉语圣经语体。
- source_word: עֲלֵיהֶם
  choice: 攻击他们
  rationale: 在审判预言的语境中，עַל 具有敌对指向；“攻击他们”清楚传达这篇预言针对他们的不利性质。
theological_decisions:
- issue: 民族称谓 בְּנֵי עַמּוֹן 的译法
  choice: 亚扪人
  alternative: 亚扪之子
  rationale: 这里指亚扪民族整体，而不是只指男性后裔；采用汉语常规族名可准确传意，同时避免字面译法造成性别范围误解。
- issue: עֲלֵיהֶם 的语义取向
  choice: 攻击他们
  alternative: 论到他们
  rationale: 本段是对亚扪的审判宣告，介词在此自然带有敌对含义；译为“攻击”保留审判锋芒，但不额外说明审判的具体形式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人子”保留全书关键称呼；“面向”保存先知行动的源语意象；句式简洁有命令语气。
