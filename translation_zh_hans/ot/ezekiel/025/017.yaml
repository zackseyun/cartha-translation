  text: וְ/עָשִׂ֤יתִי בָ/ם֙ נְקָמ֣וֹת גְּדֹל֔וֹת בְּ/תוֹכְח֖וֹת חֵמָ֑ה וְ/יָֽדְעוּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/תִתִּ֥/י אֶת נִקְמָתִ֖/י בָּֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/017.yaml
  text: And I will execute great acts of vengeance on them with wrathful rebukes[a], and they will know that I am Yahweh when I lay my vengeance on them.
translation:
  language: zh_hans
  text: 我要向他们施行重大的报复，以烈怒的责罚惩治他们[a]。我向他们施行报复的时候，他们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以烈怒斥责他们”，或“以烈怒惩罚他们”。希伯来语这一短语把“斥责／管教”与“烈怒”结合起来，语义可能兼有言语谴责和惩治责罚。
    reason: 原文תּוֹכְחוֹת在此既可保留“斥责、管教”的基本含义，也可在审判语境中指带惩罚性的责罚；正文采用后一较突出的含义，但不应消除其语义幅度。
lexical_decisions:
- source_word: וְעָשִׂיתִי בָם נְקָמוֹת גְּדֹלוֹת
  choice: 我要向他们施行严厉的报复
  rationale: עָשָׂה与“报复”连用，表示实行、施行；נְקָמוֹת虽为复数，但现代汉语通常以不可数的“报复”自然表达，不勉强添加“多次”。גְּדֹלוֹת在审判语境中译为“严厉的”，传达报复的重大与强烈程度。
- source_word: בְּתוֹכְחוֹת חֵמָה
  choice: 以烈怒责罚他们
  rationale: תּוֹכֵחוֹת可指斥责、管教或带惩罚性的责罚，חֵמָה指烈怒、震怒。正文采用“责罚”以保留言语谴责与惩治之间的语义张力，并用脚注列出其他可能译法。
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: 他们就知道我是雅威
  rationale: 这是《以西结书》常见的认识公式；“就”自然表达前述行动所带来的结果。神名四字母词按项目方针音译为“雅威”。
- source_word: בְּתִתִּי אֶת נִקְמָתִי בָּם
  choice: 我向他们施行报复的时候
  rationale: 介词בְּ加不定词结构表示时间；נָתַן与“我的报复”连用，在汉语中自然译为“施行报复”，既贴近原意，又避免生硬的“把报复放在他们身上”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 正文采用希伯来神名的现代汉语音译“雅威”，使其作为专名呈现，而不以“主”等称号替代。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“施行报复”“烈怒责罚”符合先知审判宣告的力度；句法分为两句，使认识公式清晰自然，同时保留原文行动、结果和时间关系。
