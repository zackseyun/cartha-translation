  text: 'Thus says the Lord GOD: Because the Philistines acted in vengeance and took revenge with contempt in the soul[a], to destroy with everlasting enmity[b],'
translation:
  language: zh_hans
  text: 主耶和华如此说：“因为非利士人以报复行事，以满心的轻蔑施行报复，怀着长久的仇恨，意图毁灭，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 以现代中文圣经中自然庄重的固定表达呈现神圣称号，同时保留专名耶和华。
- source_word: יַעַן
  choice: 因为
  rationale: 清楚保留引出审判缘由的因果功能。
- source_word: עֲשׂוֹת פְּלִשְׁתִּים בִּנְקָמָה
  choice: 非利士人怀着报复之心行事
  rationale: 既保留“行事”的动作，也以自然中文表达 בִּנְקָמָה 所指的报复动机。
- source_word: וַיִּנָּקְמוּ נָקָם
  choice: 施行报复
  rationale: 希伯来文同根动词与名词连用具有强调作用；中文用“施行报复”简洁表达实际报复行动。
- source_word: בִּשְׁאָט בְּנֶפֶשׁ
  choice: 心存蔑视
  rationale: נֶפֶשׁ 在此指内在、全人的态度；“心存蔑视”自然地保留内心轻蔑和敌意，脚注提示较直译表达。
- source_word: לְמַשְׁחִית
  choice: 要……毁灭人
  rationale: 保留不定式所表达的目的或结果；补出中文所需的泛指宾语“人”，不限定具体对象。
- source_word: אֵיבַת עוֹלָם
  choice: 长久的仇恨
  rationale: אֵיבָה 表示仇恨或敌意；עוֹלָם 在此可指自古以来或持续不息，正文采用不把歧义推至极端的“长久”，并用脚注说明。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文同时含“主”和四字神名；译作“主耶和华”可在中文中保留这一区别，又避免不自然的重复。
- issue: עוֹלָם 所表达的是古老起源还是持续时间
  choice: 长久的仇恨
  alternative: 自古以来的仇恨；永久的敌意
  rationale: 原词可涵盖久远过去或绵延不止；正文采用较宽泛的译法，脚注保留两种可能，不替经文消除其时间含义上的张力。
- issue: לְמַשְׁחִית 的语义关系
  choice: 目的表达“要……毁灭人”
  alternative: 结果表达“以致毁灭人”
  rationale: לְ 加不定式可表达目的或结果；此处目的义在语境中较顺，但不对毁灭对象作超出本节的具体限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子承接下一节的审判宣告，因此保留末尾逗号。正文避免生硬的“在魂里”，以“心存”表达内在倾向，并由脚注保存原文措辞的范围。
