  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֗עַן אֲמֹ֤ר מוֹאָב֙ וְ/שֵׂעִ֔יר הִנֵּ֥ה כְּ/כָֽל הַ/גּוֹיִ֖ם בֵּ֥ית יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/008.yaml
  text: 'Thus says the Lord GOD: Because Moab and Seir say, ‘Look, the house of Judah is like all the nations,’'
translation:
  language: zh_hans
  text: 主耶和华如此说：“因为摩押和西珥说：‘看哪，犹大家跟列国并没有什么两样。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神名的传统而清晰的汉语表达；“主”对应 אֲדֹנָי，“耶和华”对应四字神名。
- source_word: יַעַן אֲמֹר
  choice: 因为……说
  rationale: 准确表达审判宣告中的因由结构；希伯来语不必在汉语中机械保留不定式形式。
- source_word: מוֹאָב וְשֵׂעִיר
  choice: 摩押和西珥
  rationale: 按通常地名音译；并列的单数动词可自然译为汉语复数主语后的“说”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意及带有轻蔑评断意味的感叹语气，比单纯“看”更符合庄重的先知文本语域。
- source_word: כְּכָל הַגּוֹיִם
  choice: 跟列国并没有什么两样
  rationale: כְּ 表示相同或相似；此处自然汉语用“没有什么两样”传达摩押和西珥宣称犹大不具独特地位的意味，同时不额外解释其神学原因。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: “家”既可指王朝、族群或共同体，保留原文范围上的开放性，避免窄化为“犹大国”或仅指某个家庭。
theological_decisions:
- issue: 摩押和西珥之言所否定的内容
  choice: 仅译出犹大家“跟列国并没有什么两样”
  alternative: 明确译为“犹大不再是上帝特别的子民”
  rationale: 原文只陈述比较，并未明说被否定的是圣约身份、蒙拣选地位还是政治命运；译文保留这一神学张力，不把解释写入正文。
- issue: “犹大家”的所指范围
  choice: 保留“家”这一较宽泛称谓
  alternative: 译作“犹大国”或“犹大民族”
  rationale: בֵּית 可涵盖王朝、民族和共同体；采用“犹大家”可避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。正文无脚注，因此不设脚注标记。引语层级用中文全角标点清楚呈现。
