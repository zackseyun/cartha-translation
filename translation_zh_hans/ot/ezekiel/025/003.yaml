  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לִ/בְנֵ֣י עַמּ֔וֹן שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה יַעַן֩ אָמְרֵ֨/ךְ הֶאָ֜ח אֶל מִקְדָּשִׁ֣/י כִֽי נִחָ֗ל וְ/אֶל אַדְמַ֤ת יִשְׂרָאֵל֙ כִּ֣י נָשַׁ֔מָּה וְ/אֶל בֵּ֣ית יְהוּדָ֔ה כִּ֥י הָלְכ֖וּ בַּ/גּוֹלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/003.yaml
  text: 'And say to the sons of Ammon[a], ‘Hear the word of the Lord GOD. Thus says the Lord GOD: Because you said, “Aha!” against my sanctuary when it was profaned, and against the land of Israel when it was made desolate[c][b], and against the house of Judah when they went into exile,’'
translation:
  language: zh_hans
  text: 你要对亚扪人说：“要听主雅威的话。主雅威如此说：因为你针对我的圣所遭到亵渎[b]，以色列地变得荒凉，以及犹大人被掳去[c]，竟说：‘哈！’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈！”也可译作“啊哈！”；原文是表示幸灾乐祸或恶意得意的感叹声。
    reason: lexical_alternative
  - marker: b
    text: “亵渎”也可译作“玷污”或“渎犯”。
    reason: lexical_alternative
  - marker: c
    text: “被掳去”直译可作“进入流亡”；也可译作“进入被掳之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 原文直译为“亚扪的子孙”，在这里是民族称谓；“亚扪人”是现代汉语中自然、准确的表达。
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: 主雅威的话
  rationale: 保留 אֲדֹנָי 的“主”以及 יהוה 的专名性质，用“雅威”避免把圣名仅处理成头衔。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主雅威如此说
  rationale: 保留先知传信公式的庄重节奏，同时符合现代中文表达。
- source_word: הֶאָח
  choice: 哈！
  rationale: 该感叹词在本语境中表达恶意的欢呼和幸灾乐祸；“哈！”简短有力，并由脚注说明其语气。
- source_word: אֶל
  choice: 冲着
  rationale: 原词基本义为“向、对着”；上下文带敌意，因此“冲着”既保留方向性，也自然传达嘲弄语气。
- source_word: מִקְדָּשִׁי
  choice: 我的圣所
  rationale: “圣所”准确保留该词“神圣之地”的含义，又不把词义过度限定为某一建筑称呼。
- source_word: נִחָל
  choice: 遭到亵渎
  rationale: 该动词在此为被动意义，指圣所失去神圣不可侵犯的地位并受到污辱；“遭到亵渎”适合祭祀与神学语境。
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: 以色列地
  rationale: 在国家和地域语境中，“以色列地”比“以色列的土壤”自然，也保留原文的地域含义。
- source_word: נָשַׁמָּה
  choice: 变得荒凉
  rationale: 表达毁坏之后成为荒废之地的结果状态，不额外指定造成荒凉的行动者。
- source_word: בֵּית יְהוּדָה
  choice: 犹大家
  rationale: 保留“家”这一集体和宗族性称谓；这里所指是犹大的国民整体。
- source_word: הָלְכוּ בַגּוֹלָה
  choice: 被掳走
  rationale: 原文较直译为“进入流亡”；“被掳走”在中文中自然表达因战败而被迫离境的处境。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主雅威
  alternative: 主耶和华；至高的主
  rationale: 原文同时包含“主”的称号和 יהוה 的圣名。译作“主雅威”保留两者，既不重复作“主主”，也不把专名解释性地改写为“至高的主”。
- issue: 亚扪发言的对象和语气
  choice: 冲着他们幸灾乐祸地说
  alternative: 对这一切说；攻击他们说
  rationale: 原文三次使用 אֶל，分别引出圣所、以色列地和犹大家，表达针对这些对象的恶意欢呼。“冲着他们”保留指向性，“幸灾乐祸”显明 הֶאָח 在语境中的语用力量，却不把它扩大为实际攻击。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留先知宣告公式“主雅威如此说”和集体称谓“犹大家”；民族称谓则自然译作“亚扪人”。以单数“你”承接希伯来文对亚扪这一民族整体的阴性单数称呼。脚注标记集中置于相关引语句末，但三条脚注分别解释该句中的“哈”“亵渎”和“被掳走”。
