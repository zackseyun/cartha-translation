source:
  edition: WLC
  text: וַ/יִּכְרְתֻ֧/הוּ זָרִ֛ים עָרִיצֵ֥י גוֹיִ֖ם וַֽ/יִּטְּשֻׁ֑/הוּ אֶל הֶ֠/הָרִים וּ/בְ/כָל גֵּ֨אָי֜וֹת נָפְל֣וּ דָלִיּוֹתָ֗י/ו וַ/תִּשָּׁבַ֤רְנָה פֹֽארֹתָי/ו֙ בְּ/כֹל֙ אֲפִיקֵ֣י הָ/אָ֔רֶץ וַ/יֵּרְד֧וּ מִ/צִּלּ֛/וֹ כָּל עַמֵּ֥י הָ/אָ֖רֶץ וַֽ/יִּטְּשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/012.yaml
  text: Foreigners[a], the ruthless of the nations, cut it down and left it. Its branches fell on the mountains and in every valley, and its boughs were broken in all the channels of the land[c][b]. Then all the peoples of the earth went down from its shade and left it.
translation:
  language: zh_hans
  text: 列国中残暴的外族人把它砍倒，丢弃了它[a]。它的枝条倒落在群山上和所有山谷中；它的大枝在地上一切水道中折断[b]。地上万民都从它的荫下离去，丢弃了它[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丢弃了它”也可译作“撇下了它”或“离弃了它”；同一希伯来语动词在本节末尾再次出现。
    reason: lexical_alternative
  - marker: b
    text: “水道”也可译作“河床”或“沟谷”。
    reason: lexical_alternative
  - marker: c
    text: 本节的“它”直接承接树的比喻；若突出树所象征的亚述及其统治者，也可理解为“他”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתֻהוּ
  choice: 把它砍倒
  rationale: כרת在树木隐喻中自然指砍倒；用“它”延续本节香柏树的直接意象。
- source_word: זָרִים עָרִיצֵי גוֹיִם
  choice: 列国中残暴的外族人
  rationale: זָרִים指外族人，עָרִיצֵי גוֹיִם指列国中残暴、凶暴的人；原文没有明确的最高级，因此不译作“最残暴的”。
- source_word: וַיִּטְּשֻׁהוּ
  choice: 丢弃了它
  rationale: נטש可指离弃、撇下或丢弃；这里既描述砍倒后弃置树木，也在末句重复，故两处保持一致。
- source_word: דָלִיּוֹתָיו / פֹארֹתָיו
  choice: 枝条 / 大枝
  rationale: 用两个不同的现代汉语词保留原文近义树木词汇之间的区别；后者较适合指较粗大的枝干。
- source_word: אֲפִיקֵי הָאָרֶץ
  choice: 地上所有的水道
  rationale: אֲפִיקִים可指水道、河床或沟谷；“水道”简明，并保留地形意象。
- source_word: וַיֵּרְדוּ מִצִּלּוֹ
  choice: 都从它的荫下离去
  rationale: 直译含“下来”的空间动作，但汉语“从荫下下来”不自然；“离去”清楚表达万民不再处于其遮蔽之下，同时不额外解释其政治含义。
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: 地上万民
  rationale: עַמִּים是各民、万民；本章语境范围广，“地上万民”自然且庄重。
theological_decisions:
- issue: 阳性单数后缀所指的是树，还是树所象征的亚述及其统治者
  choice: 正文用“它”，保持香柏树的直接隐喻
  alternative: 用“他”，突出树背后的政治人物或国家
  rationale: 本节持续描写被砍倒的树及其枝条和荫蔽；“它”最贴合近距离语境，同时上下文仍容许读者识别其政治所指。
- issue: וַיֵּרְדוּ是否须明确译出“下来”
  choice: 译作“从它的荫下离去”
  alternative: 译作“从它的荫下下来”
  rationale: 保留离开荫蔽这一核心图景，并避免不自然的汉语；不把动作神学化为背叛或审判。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“外族人”比“异邦人”更日常，又保留国际军事语境；以分号组织枝条散落与大枝折断的平行画面。
