base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/013.yaml
  text: On its fallen trunk all the birds of the heavens will dwell[b][a], and on its boughs will be all the beasts of the field.
translation:
  language: zh_hans
  text: 天空中的飞鸟都要栖息在它倒下的树干上[a]；田野的走兽都要在它的枝上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在它的倾覆之上”。这个希伯来词也可较抽象地指它的倒下或倾覆；上下文的树木意象支持正文的具体译法“倒下的树干”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“较大的枝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפַּלְתּוֹ
  choice: 它倒下的躯干
  rationale: 该词源于 נפל，可指“倒下、倾覆”或倒下之物。上下文以被砍倒的香柏树比喻亚述，因此正文采用具体的树木意象，同时以脚注保留抽象理解。
- source_word: יִשְׁכְּנוּ
  choice: 要栖息
  rationale: שׁכן 可指居住、安顿；用于飞鸟时，“栖息”自然地表达在倒木上停居的图景。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 天上所有的飞鸟
  rationale: 保留“天上的飞鸟”这一希伯来表达的空间意象，也符合现代汉语习惯。
- source_word: פֹּארֹתָיו
  choice: 它的枝条
  rationale: 该词指树木伸展的枝杈或大枝；“枝条”通顺易懂，并由脚注提示“大枝”这一可能的具体含义。
- source_word: הָיוּ
  choice: 都要待在
  rationale: 虽为完成式，在此与前句未完成式并列，描述树倒之后的情景；用“要”表达预示意味，用“待在”自然呈现动物占据枝条。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野所有的走兽
  rationale: “田野的走兽”是庄重而易懂的圣经语体，既保留固定搭配，也不把 חַיָּה 过度限定为某一类野生动物。
- source_word: עַל ... וְאֶל
  choice: 在……上；在……上
  rationale: עַל 明确表示“在……上”；אֶל 字面为“向、到”，但与 הָיוּ 连用并置于树枝意象中，汉语以“在……上”表达其空间关系最自然。
