source:
  edition: WLC
  text: בִּ/סְעַפֹּתָ֤י/ו קִֽנְנוּ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/תַ֤חַת פֹּֽארֹתָי/ו֙ יָֽלְד֔וּ כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/בְ/צִלּ/וֹ֙ יֵֽשְׁב֔וּ כֹּ֖ל גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/006.yaml
  text: In its branches all the birds of the heavens nested[a], and under its boughs all the beasts of the field gave birth, and in its shade all the many nations dwelt.
translation:
  language: zh_hans
  text: 天上所有的飞鸟都在它的枝杈间筑巢，田野的一切走兽都在它的枝条下产仔，许多民族都住在它的荫下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荫下”也可译作“影下”。
    reason: 希伯来语 צֵל 兼有“荫”和“影”之义；在树木语境中，“荫”较自然，但“影”也是可成立的直译。
lexical_decisions:
- source_word: בִּסְעַפֹּתָיו
  choice: 在它的枝杈间
  rationale: סְעַפּוֹת指树的分枝或粗大枝干；“枝杈间”既符合鸟类筑巢的空间意象，也与后文פֹּארֹתָיו略作词义区分。阳性单数后缀所指的是树，因此用“它”。
- source_word: קִנְנוּ
  choice: 筑巢
  rationale: 该动词特指鸟类营巢；“筑巢”准确、自然，并保留具体意象。
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: 天上所有的飞鸟
  rationale: עוֹף是集合名词，指飞禽；“天上所有的飞鸟”保留希伯来语惯用表达的范围与诗性。
- source_word: תַחַת פֹּארֹתָיו
  choice: 在它的枝条下
  rationale: פֹּארֹת指伸展或带叶的树枝；“枝条”自然易懂，并与前面的“枝杈”形成适度区别。
- source_word: יָלְדוּ
  choice: 产仔
  rationale: ילד在此指野兽生育幼崽；“产仔”比泛化的“生养”更明确地保留分娩含义。
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: 田野所有的走兽
  rationale: חַיַּת הַשָּׂדֶה是野外陆生动物的常用表达；“田野所有的走兽”符合经文语体，也能与飞鸟相对。
- source_word: וּבְצִלּוֹ
  choice: 在它的荫下
  rationale: צֵל可指阴影或荫蔽；树木语境中的“荫下”自然体现遮蔽和庇护意象，同时不把隐喻直接解释出来。
- source_word: יֵשְׁבוּ
  choice: 住
  rationale: ישב在此表示居住、安居，而非字面的“坐”；“住”简洁自然。
- source_word: כֹּל גּוֹיִם רַבִּים
  choice: 众多民族全都
  rationale: 原文以כֹּל配合גּוֹיִם רַבִּים，兼有数量众多和范围周全之意；“众多民族全都”在现代汉语中自然保留这两层强调。
theological_decisions:
- issue: 大树作为帝国庇护的隐喻
  choice: 正文直接保留树、飞鸟、走兽、树荫和民族的意象，不在本节中明说这棵树所代表的帝国。
  alternative: 在译文中直接把树解释为亚述或帝国。
  rationale: 本节属于延展的大树隐喻；翻译应保存意象及其张力，让上下文承担解释功能，避免把释义写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句子保留原文三段并列结构，以“飞鸟—走兽—民族”逐层展开；“枝杈／枝条”体现两个不同的希伯来语树枝词，同时避免生硬的古雅表达。
