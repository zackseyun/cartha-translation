  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בַּ/שְּׁלִישִׁ֖י בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/001.yaml
  text: And it happened in the eleventh year[a], in the third month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: zh_hans
  text: 十一年三月初一，雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH（יהוה）；传统上常译作“耶和华”或“主”。
    reason: 说明神名的原文形式及常见译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入日期句式）
  rationale: 这里引出先知书常见的日期与启示公式。现代汉语无需另译为“事情发生了”，直接以日期起句更自然，同时不损失叙事功能。
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: 十一年
  rationale: 按希伯来文纪年表达直译；原文未在本节说明所依据的纪年起点，因此不擅自补充。
- source_word: בַּשְּׁלִישִׁי
  choice: 三月
  rationale: “月”在希伯来文日期格式中为隐含成分；汉语补出“月”，形成清楚自然的日期表达。
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: 初一
  rationale: 这是每月第一日的希伯来历法表达。“初一”是现代汉语简洁、明确的对应说法。
- source_word: הָיָה דְבַר יְהוָה
  choice: 雅威的话临到
  rationale: “临到”符合中文先知文学的庄重语体，也准确表达神的话向先知发出的启示公式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的汉语音译呈现四字神名，避免将专名改作称号。
- source_word: אֵלַי
  choice: 我
  rationale: 置于“临到我”中，清楚标明启示的领受者。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出下一节的直接话语，并保留原文的引语过渡。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名。正文采用“雅威”以保留其专名性质；脚注说明希伯来文字形及传统译法，不把某一传统译名绝对化。
translation_notes:
  register: 采用现代、简洁而庄重的先知书语体。日期译作“十一年三月初一”，不补入原文未明说的纪年依据；以“临到我”保留先知启示公式。
