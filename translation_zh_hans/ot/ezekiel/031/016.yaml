source:
  edition: WLC
  text: מִ/קּ֤וֹל מַפַּלְתּ/וֹ֙ הִרְעַ֣שְׁתִּי גוֹיִ֔ם בְּ/הוֹרִדִ֥/י אֹת֛/וֹ שְׁא֖וֹלָ/ה אֶת י֣וֹרְדֵי ב֑וֹר וַ/יִּנָּ֨חֲמ֜וּ בְּ/אֶ֤רֶץ תַּחְתִּית֙ כָּל עֲצֵי עֵ֔דֶן מִבְחַ֥ר וְ/טוֹב לְבָנ֖וֹן כָּל שֹׁ֥תֵי מָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/016.yaml
  text: At the sound of his fall I made nations quake[a], when I brought him down to Sheol with those who go down to the pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water[c][b], were comforted in the earth beneath.
translation:
  language: zh_hans
  text: 我因他倒下的声响，使列国震动；当我把他和下到坑里的人一同降到阴间[a]时，在地下深处[b]，伊甸所有的树，就是黎巴嫩最上等、最美好的一切饮水之树，都得了安慰[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”原文为“示奥尔”，指死者所在之境；也可译作“坟墓”或“死者之境”。
    reason: lexical_alternative
  - marker: b
    text: 直译“较低的地”或“下层之地”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“都受了安慰”或“都感到宽慰”。这里可能是说，其他已经倾覆的强权见这棵大树也降下来了，便得到一种冷峻的安慰。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל מַפַּלְתּוֹ
  choice: 因他倒下的声响
  rationale: 既保留巨树轰然倒下的具体意象，也容纳所象征强权覆亡的政治含义；“因”自然表达此处介词的因果意味。
- source_word: הִרְעַשְׁתִּי גוֹיִם
  choice: 使列国震动
  rationale: 准确体现使役语态；“列国”符合以西结书列国审判的语境，“震动”兼具实际震撼与惊惧之感。
- source_word: בְּהוֹרִדִי אֹתוֹ
  choice: 那时，我把他……降到
  rationale: 将介词加不定式结构按时间关系自然译出，同时以“降到”保留使役意义和向下运动的意象。
- source_word: שְׁאוֹלָה
  choice: 到阴间
  rationale: “阴间”在现代中文圣经语境中可理解为死者所在之境，比单译“坟墓”范围更广；脚注保留希伯来概念及其他可能译法。
- source_word: אֶת יֹרְדֵי בוֹר
  choice: 和下坑的人一同
  rationale: 按上下文将 אֶת 理解为伴随关系；“下坑的人”保留诗歌中死亡之坑的传统意象，而不把它缩减为实际水池。
- source_word: וַיִּנָּחֲמוּ
  choice: 都得了安慰
  rationale: 保留 Niphal 的被动或承受意味，也保留其他已倾覆权势因这棵大树同样坠落而得到冷峻安慰的反讽张力。
- source_word: בְּאֶרֶץ תַּחְתִּית
  choice: 在下方之地
  rationale: 接近原文空间表达，不直接用带有较强后世宇宙观色彩的术语；脚注说明其字面意义。
- source_word: כָּל עֲצֵי עֵדֶן
  choice: 伊甸所有的树
  rationale: 保留全章核心的树木隐喻及伊甸意象，不提前把“树”解释成列国或君王。
- source_word: מִבְחַר וְטוֹב לְבָנוֹן
  choice: 黎巴嫩最上等、最美好的树
  rationale: 以自然中文表达其精选、优美的最高程度，并把原文省略而由上下文明确的“树”补出。
- source_word: כָּל שֹׁתֵי מָיִם
  choice: 所有饱饮水分的树
  rationale: 保留“饮水”的拟人化树木意象；“饱饮水分”在中文中自然地表现这些树水源充足、长势繁茂。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死者之境；音译“示奥尔”
  rationale: 原词所指不止一座坟墓，而是死者所在之境。“阴间”简洁可懂，同时借脚注避免把它等同于某一套后世的来世教义。
- issue: 众树“得了安慰”的含义
  choice: 直译为“都得了安慰”
  alternative: 解释性译为“因他的降下而感到安慰”或“得到冷酷的慰藉”
  rationale: 原文以树象征已倾覆的权势，并诗意地描绘它们在下方之地得安慰。正文保留其反讽和有关死后状态的张力，不把诗歌拟人化强行转化为系统性的来世主张。
- issue: אֶת יֹרְדֵי בוֹר 的句法关系
  choice: 与下坑的人一同
  alternative: 把“下坑的人”理解为另一个直接宾语
  rationale: 在“把他降到阴间”的框架中，伴随理解最符合语境和平行意象，但不进一步界定这些死者的具体状态。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“列国”“阴间”“下坑”等词保留先知文学的肃穆感；句子适度分开，以便普通读者把握因果、时间和结果关系。树木意象贯穿全句，不在正文中直接改写为国家或权势。
