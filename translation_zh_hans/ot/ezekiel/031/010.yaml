revisions:
- from: 因此，主耶和华如此说：“因你身量高大，使树梢伸入茂密的枝叶间[a]，他的心就因自己的高大而骄傲。”
  to: 因此，主耶和华如此说：“因为你身量高大，他的树梢伸入茂密的枝叶中，他的心因自己的高大而骄傲。”
  rationale: 修订仅将中间分句改为“他的树梢伸入茂密的枝叶中”，以明确反映希伯来文本从第二人称转为第三人称的形式，并避免“使”所引入的使役色彩。其余译法及脚注的歧义处理可保留。
