source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֕עַן אֲשֶׁ֥ר גָּבַ֖הְתָּ בְּ/קוֹמָ֑ה וַ/יִּתֵּ֤ן צַמַּרְתּ/וֹ֙ אֶל בֵּ֣ין עֲבוֹתִ֔ים וְ/רָ֥ם לְבָב֖/וֹ בְּ/גָבְהֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/010.yaml
  text: 'Therefore thus says the Lord GOD: Because you grew tall in stature[a], and set your top among the thick boughs, and his heart was lifted up in his height,'
translation:
  language: zh_hans
  text: 因此，主耶和华如此说：“因为你身量高大，他的树梢伸入茂密的枝叶中，他的心因自己的高大而骄傲。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号的两个要素，并采用现代中文圣经语体中清楚、庄重的表达。
- source_word: יַעַן אֲשֶׁר
  choice: 因
  rationale: 自然表达引出审判缘由的因果关系。
- source_word: גָּבַהְתָּ בְּקוֹמָה
  choice: 你身量高大
  rationale: 保留树木高耸的具体意象，同时可承载所象征权势的尊荣与自高。
- source_word: וַיִּתֵּן צַמַּרְתּוֹ
  choice: 使树梢伸入
  rationale: צַמֶּרֶת指树的顶部；结合高度意象，用“树梢”明确树喻。“伸入”自然表达נתן在此处使其顶部置于某处的结果。
- source_word: אֶל בֵּין עֲבוֹתִים
  choice: 茂密的枝叶间
  rationale: עֲבוֹתִים在本章树木语境中可指浓密枝叶或粗密枝条；本译优先保留直接的树木意象，同时以脚注交代“云层间”的可能理解。
- source_word: וְרָם לְבָבוֹ
  choice: 他的心就……骄傲
  rationale: 将希伯来语“心高举”的习语译为现代中文可直接理解的“心……骄傲”，而不削弱自高之意。
- source_word: בְּגָבְהוֹ
  choice: 因自己的高大
  rationale: 介词短语可表达其骄傲所缘由的高度；该译法也维系外在高大与内在自高之间的联系。
theological_decisions:
- issue: 本节人称由第二人称转为第三人称
  choice: 保留“你……他的心”的转换
  alternative: 统一译作第二人称“你的心”，或统一译作第三人称
  rationale: 马所拉文本先以第二人称直接称呼，随后用第三人称描述其心；保留转换可忠实呈现先知话语的张力，避免擅自校平。
- issue: עֲבוֹתִים的意象
  choice: 正文译作“茂密的枝叶间”
  alternative: 译作“云层间”
  rationale: 词语更直接的树木语义与上下文中的香柏树比喻相合；“云层间”能突出极高之意，但属语境性理解，故置于脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留树喻及原文人称转换；用“主耶和华”呈现神圣称号。
