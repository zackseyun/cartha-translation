source:
  edition: WLC
  text: אֲרָזִ֣ים לֹֽא עֲמָמֻ/הוּ֮ בְּ/גַן אֱלֹהִים֒ בְּרוֹשִׁ֗ים לֹ֤א דָמוּ֙ אֶל סְעַפֹּתָ֔י/ו וְ/עַרְמֹנִ֥ים לֹֽא הָי֖וּ כְּ/פֹֽארֹתָ֑י/ו כָּל עֵץ֙ בְּ/גַן אֱלֹהִ֔ים לֹא דָמָ֥ה אֵלָ֖י/ו בְּ/יָפְיֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/008.yaml
  text: Cedars did not overshadow it in the garden of God[a]; cypresses did not compare with its boughs, and plane trees were not like its branches[b]. No tree in the garden of God compared with it in its beauty.
translation:
  language: zh_hans
  text: 在上帝的园中[a]，香柏树不能遮蔽它；柏树比不上它的枝干，悬铃木也不及它的枝条[b]。上帝的园中没有一棵树能在美丽上与它相比。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在上帝的园中”；这一说法使人联想到伊甸园。
    reason: lexical_alternative
  - marker: b
    text: “悬铃木”是较可能的含义；传统译本常译作“栗树”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָזִים
  choice: 香柏树
  rationale: אֶרֶז的标准中文译法；复数在此泛指同类树木。
- source_word: עֲמָמֻהוּ
  choice: 不能遮蔽它
  rationale: 该动词含使昏暗、遮掩之意；在树木意象中，“遮蔽”具体呈现树冠无法盖过它，同时不将其抽象化为“胜过”。
- source_word: בְּגַן אֱלֹהִים
  choice: 在上帝的园中
  rationale: 贴近希伯来语措辞，保留其伊甸园式联想，却不在正文中直接认定为伊甸园。
- source_word: בְּרוֹשִׁים
  choice: 柏树
  rationale: 树种的精确所指有争议；“柏树”是现代中文中自然且常见的对应词。
- source_word: דָמוּ / דָמָה אֵלָיו
  choice: 比不上／与它相比
  rationale: דמה表达相似或比较；依上下文分别采用自然中文措辞，并保留其他树木无法与它匹敌的含义。
- source_word: סְעַפֹּתָיו
  choice: 它的粗枝
  rationale: 该词较偏向较大的枝干；译作“粗枝”，与后面的פֹארֹתָיו“枝条”形成适度区分。
- source_word: עַרְמֹנִים
  choice: 悬铃木
  rationale: 现代词典研究通常支持plane tree，即悬铃木；传统的“栗树”作为脚注备选保留。
- source_word: פֹארֹתָיו
  choice: 它的枝条
  rationale: 指枝条或繁茂的枝叶；“枝条”自然，并与前面的“粗枝”区分。
- source_word: כָּל עֵץ
  choice: 树木，没有一棵
  rationale: 将希伯来语全称加否定重组为符合现代汉语习惯的全称否定。
- source_word: בְּיָפְיוֹ
  choice: 在美丽上
  rationale: 保留介词所表达的比较方面，即没有树能在美丽这一点上与它相比。
theological_decisions:
- issue: “上帝的园”的所指
  choice: 正文直译为“上帝的园”，不明确写作“伊甸园”
  alternative: 伊甸园／上帝的乐园
  rationale: 该短语强烈使人联想到伊甸园，但希伯来文本只明说“上帝的园”；直译可保留先知意象及其开放性。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。以“粗枝／枝条”体现两个希伯来语枝条名词的差别；保留树木诗歌意象和原文比较结构。
