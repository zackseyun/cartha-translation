  yaml_path: translation/ot/ezekiel/031/007.yaml
  text: So it was beautiful in its greatness[a], in the length of its branches, because its root was by abundant waters.
translation:
  language: zh_hans
  text: 它因高大、枝条修长而显得美丽，因为它的根伸向众水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְּיִף
  choice: 显得美丽
  rationale: 该词为יפה的Qal叙事式，描写树木外观优美；“显得美丽”在现代汉语中自然，也保留这里对其状态的描述。
- source_word: בְּגָדְלוֹ
  choice: 因高大
  rationale: גדל在此指宏大、高大；介词ב可表达树显得美丽所凭借或体现的特征。译作“因高大”符合汉语表达，并与后面的枝条长度并列。
- source_word: בְּאֹרֶךְ דָּלִיּוֹתָיו
  choice: 枝条修长
  rationale: אֹרֶךְ指长度，דָּלִיּוֹתָיו指它的枝条或大枝。“枝条修长”自然凝练地再现其枝条之长，避免生硬的“在枝条的长度上”。
- source_word: כִּי
  choice: 因为
  rationale: 明确保留原文的因果关系：水源充足是这树高大美丽的原因。
- source_word: הָיָה שָׁרְשׁוֹ אֶל
  choice: 它的根伸向
  rationale: 原文直译近于“它的根向着”。“伸向”保留方向含义，也符合树根朝水源延伸的自然图景；不弱化为单纯的邻近关系。
- source_word: מַיִם רַבִּים
  choice: 丰沛的水源
  rationale: 字面为“众水/许多水”。在树木生长语境中，“丰沛的水源”自然表达水量充足，同时保留其供养树木的意象。
