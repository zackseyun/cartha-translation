  yaml_path: translation/ot/ezekiel/031/002.yaml
  text: 'Son of man, say to Pharaoh king of Egypt and to his multitude: Whom are you like in your greatness?'
translation:
  language: zh_hans
  text: '“人子啊，你要对埃及王法老和他的众民说：

    ‘你这样伟大，究竟像谁呢？’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: 人子
  rationale: 保留以西结书中上帝对先知的一贯称呼；“人子”简洁庄重，也保持其字面意象。
- source_word: הֲמוֹנוֹ
  choice: 他的众民
  rationale: 该词可指群众、众多的人或喧闹的群体；此处与埃及王并列，译作“他的众民”自然，也不把所指过度限定为军队或财富。
- source_word: בְגָדְלֶךָ
  choice: 你这样伟大
  rationale: 介词短语表达法老所具有的宏大、尊荣或强盛；用“你这样伟大”承接反问，并保留其含义的宽度。
theological_decisions:
- issue: 反问所指及其悬念
  choice: “你这样伟大，究竟像谁呢？”
  alternative: “在你的伟大中，你像谁呢？”
  rationale: 本节以反问引出后文的比较。采用自然汉语语序，但不提前揭示比较对象，也不把“伟大”解释成单一的政治权势或荣耀。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人子啊”保留先知书语体；引语以自然反问呈现。原文“法老”与“他的众民”都由后面的命令“说”支配，译文予以明确保留。
