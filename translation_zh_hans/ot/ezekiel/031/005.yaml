  text: עַל כֵּן֙ גָּבְהָ֣א קֹמָת֔/וֹ מִ/כֹּ֖ל עֲצֵ֣י הַ/שָּׂדֶ֑ה וַ/תִּרְבֶּ֨ינָה סַֽרְעַפֹּתָ֜י/ו וַ/תֶּאֱרַ֧כְנָה פארת/ו מִ/מַּ֥יִם רַבִּ֖ים בְּ/שַׁלְּחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/005.yaml
  text: Therefore its height rose above all the trees of the field[a], and its boughs multiplied, and its branches grew long because of abundant waters as it spread out.
translation:
  language: zh_hans
  text: 因此，它的高度超过田野中所有的树；它的大枝增多，枝条因水丰沛而伸长，在它向外伸展时。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当它伸出枝条时。”希伯来文直译为“当它发出时”，宾语没有明说。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהָא קֹמָתוֹ מִכֹּל
  choice: 它高过……所有的树
  rationale: 该结构表达高度上的比较。现代汉语用“高过”自然地兼顾其高大及超过其他树木的意思，无须机械重复“它的高度”。
- source_word: עֲצֵי הַשָּׂדֶה
  choice: 田野所有的树
  rationale: “田野的树”直接保留先知性树木意象；与“所有的”组合后语序自然。
- source_word: סַרְעַפֹּתָיו
  choice: 它的大枝
  rationale: 该词指较大的分枝；译作“大枝”可与随后较一般的 פארתו“枝条”有所区分。
- source_word: וַתִּרְבֶּינָה
  choice: 增多
  rationale: 保留 רבה 表示数量增加的基本意义，且符合树枝生长的语境。
- source_word: פארתו
  choice: 枝条
  rationale: 此词可指枝、嫩枝或带叶的枝叶；“枝条”在树木比喻中清楚自然，也适合与“伸长”搭配。
- source_word: וַתֶּאֱרַכְנָה
  choice: 伸长
  rationale: 准确表达 ארך“变长”的动态意义，同时符合现代汉语描述枝条生长的习惯。
- source_word: מִמַּיִם רַבִּים
  choice: 因为水源丰沛
  rationale: מן在此可表示原因或来源；结合上下文，译为原因关系较自然。“水源丰沛”传达大量水的持续滋养。
- source_word: בְּשַׁלְּחוֹ
  choice: 它不断向外伸展
  rationale: 希伯来文直指“它发出／伸出”而宾语省略。正文用不明说宾语的“向外伸展”保存这种含蓄，同时表现树枝扩展的动态。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。用“大枝／枝条”区分相邻的两个枝干词；保留全节树木生长的连续意象。脚注标记置于其所说明的末句之后。
