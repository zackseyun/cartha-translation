base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/003.yaml
  text: Behold[a], Assyria was a cedar in Lebanon, beautiful in branches and a forest giving shade, and lofty in height[b]; its top was among the clouds.
translation:
  language: zh_hans
  text: 看哪，亚述曾是黎巴嫩的一棵香柏树[a]，枝叶秀美，浓荫成片，树身高耸；树梢在云间[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一棵黎巴嫩香柏树”。
    reason: lexical_alternative
  - marker: b
    text: “云间”或译：“茂密的枝叶间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中引人注意、使景象跃然眼前的指示语气；用语庄重而仍为现代读者熟悉。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 按上下文指亚述这一帝国实体，也是现代汉语圣经与历史叙述中的通行名称。
- source_word: אֶרֶז בַּלְּבָנוֹן
  choice: 黎巴嫩的一棵香柏树
  rationale: 以自然汉语表达树位于黎巴嫩这一主要理解，同时保留其可理解为“黎巴嫩香柏树”的可能性于脚注。
- source_word: יְפֵה עָנָף
  choice: 枝条秀美
  rationale: 将单数集合名词 עָנָף 自然地译作“枝条”，并以“秀美”保留赞叹其外观的诗意。
- source_word: וְחֹרֶשׁ מֵצַל
  choice: 林叶成荫
  rationale: חֹרֶשׁ 可指树林、浓密树丛，מֵצַל 表达遮蔽成荫；此译简洁呈现树木繁茂、提供浓荫的图景，避免生硬地把一棵树等同于整片森林。
- source_word: וּגְבַהּ קוֹמָה
  choice: 树身高耸
  rationale: 用现代汉语自然表达其身量高大，并维持香柏树比喻的雄伟感。
- source_word: וּבֵין עֲבֹתִים הָיְתָה צַמַּרְתּוֹ
  choice: 树梢直入云间
  rationale: 按高耸意象将 עֲבֹתִים 理解为云团；“直入”自然传达树梢位于云间的夸张诗意，而脚注保留“茂密枝叶”的词义可能。
