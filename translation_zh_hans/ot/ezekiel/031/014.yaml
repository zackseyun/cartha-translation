reference: Ezekiel 31:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לְמַ֡עַן אֲשֶׁר֩ לֹא יִגְבְּה֨וּ בְ/קוֹמָתָ֜/ם כָּל עֲצֵי מַ֗יִם וְ/לֹֽא יִתְּנ֤וּ אֶת צַמַּרְתָּ/ם֙ אֶל בֵּ֣ין עֲבֹתִ֔ים וְ/לֹֽא יַעַמְד֧וּ אֵלֵי/הֶ֛ם בְּ/גָבְהָ֖/ם כָּל שֹׁ֣תֵי מָ֑יִם כִּֽי כֻלָּ/ם֩ נִתְּנ֨וּ לַ/מָּ֜וֶת אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֛וֹךְ בְּנֵ֥י אָדָ֖ם אֶל י֥וֹרְדֵי בֽוֹר־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/014.yaml
  text: so that all the trees by the waters may not grow tall in their height[a], and may not set their treetop among the clouds, and that none of the water-drinkers may stand over them in their height; for all of them are given over to death, to the land below, among the sons of man[b], with those who go down to the pit.
translation:
  language: zh_hans
  text: 为要使水边的一切树木不因自己的高大而自高，也不把树梢伸入云中[a]；又使所有饮水者不因高大而站在它们之上[b]。因为它们全都被交给死亡，归到下方之地，在世人中，与下坑者一同。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “云中”或译“浓密的枝叶中”。希伯来词 עֲבֹתִים 可理解为云团，也可指茂密的枝叶。
    reason: lexical_alternative
  - marker: b
    text: 本句的希伯来语较难确定。“饮水者”可能指水源充足的树木；后半句也可能是说，没有别的水源充足的树木应当在高度上与它们并立，或高过它们。
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: 为要使
  rationale: 表达目的或结果，承接上文的审判行动；现代汉语自然，同时保留目的色彩。
- source_word: כָּל עֲצֵי מַיִם
  choice: 水边的一切树木
  rationale: 字面为“水之树木”，指受水滋养的树；此译保留树木与水域的意象，又不提前把它们明确解释为列国或君王。
- source_word: לֹא יִגְבְּהוּ בְקוֹמָתָם
  choice: 不再因自己的高大而自高
  rationale: גבהּ兼有高耸与自高之意；译文保留树木高度和骄傲自大的双重意象。
- source_word: וְלֹא יִתְּנוּ אֶת צַמַּרְתָּם
  choice: 也不把树梢伸入
  rationale: צַמֶּרֶת指树冠或树梢；“伸入”在汉语中自然呈现高树把顶端置于某处的动态画面。
- source_word: אֶל בֵּין עֲבֹתִים
  choice: 云中
  rationale: עֲבֹתִים可理解为云团，也可指浓密枝叶；正文采用与高耸意象相合的“云中”，脚注保留另一词义。
- source_word: כָּל שֹׁתֵי מָיִם
  choice: 一切饮水的树木
  rationale: 字面为“一切饮水者”；上下文以树木作比喻，补出“树木”使现代汉语清楚，但不进一步明确其政治指涉。
- source_word: וְלֹא יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם
  choice: 不因高大而在它们之上站立
  rationale: 希伯来语句法简缩且含义有争议；正文尽量贴近“站立”“在它们之上/向着它们”和“高大”等成分，脚注说明其他可能理解。
- source_word: כִּי כֻלָּם נִתְּנוּ לַמָּוֶת
  choice: 因为它们全都被交给死亡
  rationale: נתן的被动式表达被交付或注定的意思；“被交给死亡”保留原文庄重而强烈的措辞。
- source_word: אֶל אֶרֶץ תַּחְתִּית
  choice: 归到下方之地
  rationale: 直译为“下方的地”；此译保留下降和地下领域的空间意象，不把它固定为某种系统化的来世术语。
- source_word: בְּתוֹךְ בְּנֵי אָדָם
  choice: 置身于世人中
  rationale: בְּנֵי אָדָם字面为“亚当之子/人的众子”，在此强调必死的人类；“世人”自然表达普遍人类，不限于男性。
- source_word: אֶל יֹרְדֵי בוֹר
  choice: 与下坑的人同在
  rationale: בּוֹר是“坑”，常用于死亡和阴间意象；保留“坑”而不直接改译为“坟墓”，以保存原文的比喻和互文联系。
theological_decisions:
- issue: 树木意象与列国、统治者的指涉
  choice: 正文持续使用树木意象，不直接改写为列国或君王
  alternative: 把树木明确译作列国、君王或权势者
  rationale: 本章的树木具有政治寓意，但本节仍通过水、树梢、高度和饮水等意象说话；保留比喻可避免把具体指涉解释得过满。
- issue: בְּנֵי אָדָם所表达的人类范围
  choice: 世人
  alternative: 人的众子；凡人
  rationale: 该短语在这里强调所有人共有的必死性，而非仅指男性；“世人”既符合现代汉语，也保留高大树木最终落入普通人死亡命运的张力。
- issue: אֶרֶץ תַּחְתִּית与בּוֹר的死后领域意象
  choice: 下方之地；坑
  alternative: 阴间；坟墓
  rationale: 原文使用空间性和诗性表达，并未在本句中给出完整的死后世界教义；因此不以更技术化的术语替代。
translation_notes:
  register: 采用现代、庄重而可朗读的书面汉语。正文保留树木、水、高度、死亡、下方之地和坑等连续意象；对有争议的 עֲבֹתִים 及简缩难解的 וְלֹא יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם 以脚注保存真实歧义。
