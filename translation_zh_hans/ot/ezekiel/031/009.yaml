base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/009.yaml
  text: I made it beautiful with its many branches[a], and all the trees of Eden that were in the garden of God envied it.
translation:
  language: zh_hans
  text: 我以它繁多的枝条使它显得美丽[a]；在上帝园中的所有伊甸树木都嫉妒它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我以他繁多的枝条使他显得美丽；在上帝园中的所有伊甸树木都嫉妒他。”这种译法突出树木比喻背后所指的亚述或其君王。
    reason: 说明第三人称阳性单数后缀可随树木意象译为“它”，也可将其政治／人物所指前景化而译为“他”。
lexical_decisions:
- source_word: יָפֶה
  choice: 美丽
  rationale: 作谓语形容词，描述这棵树的美丽与华美；“美丽”自然、庄重，也不增加原文没有的含义。
- source_word: עֲשִׂיתִיו
  choice: 我使它……美丽
  rationale: 该形式为第一人称单数完成式，带第三人称阳性单数宾语后缀；主语是上帝。中文以“它”承接当前的树木意象，同时保留其背后所指的亚述。
- source_word: בְּרֹב דָּלִיּוֹתָיו
  choice: 因繁多的枝条
  rationale: בְּרֹב 表示枝条的繁多与美丽之间的关联，可理解为凭借或由于；“因繁多的枝条”在现代中文中简洁自然，并保留一定语义弹性。
- source_word: דָּלִיּוֹתָיו
  choice: 枝条
  rationale: 指树上伸展或下垂的枝杈；“枝条”是清楚、通行的现代中文表达。
- source_word: וַיְקַנְאֻהוּ
  choice: 都嫉妒它
  rationale: קנא 在此表达嫉妒、艳羡；“嫉妒”准确保留原文较强的情感色彩，以“它”延续树木比喻。
- source_word: כָּל עֲצֵי עֵדֶן
  choice: 所有的伊甸树木
  rationale: 保留“伊甸”及树木群体的诗性图景；“所有的”自然表达 כָּל 的整体范围。
- source_word: אֲשֶׁר בְּגַן הָאֱלֹהִים
  choice: 上帝园中
  rationale: 将关系从句自然压缩为中文处所短语，同时完整保留“上帝的园”这一以西结书中的崇高意象。
theological_decisions:
- issue: 比喻语境中第三人称阳性单数后缀的所指
  choice: 正文用“它”，持续呈现香柏树的比喻形象。
  alternative: 用“他”，突出树木意象背后的亚述或其君王。
  rationale: 希伯来语阳性后缀可同时承接语法上为阳性的树木及其政治所指；中文正文用“它”更连贯地保持本段树木寓喻，而脚注说明“他”的可能表达，避免消除原文的双重指向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“上帝园中”保留圣经诗歌的凝练感；分号呈现上帝使其美丽与众树嫉妒之间的结果推进。
