source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה בְּ/י֨וֹם רִדְתּ֤/וֹ שְׁא֨וֹלָ/ה֙ הֶאֱבַ֜לְתִּי כִּסֵּ֤תִי עָלָי/ו֙ אֶת תְּה֔וֹם וָֽ/אֶמְנַע֙ נַהֲרוֹתֶ֔י/הָ וַ/יִּכָּלְא֖וּ מַ֣יִם רַבִּ֑ים וָ/אַקְדִּ֤ר עָלָי/ו֙ לְבָנ֔וֹן וְ/כָל עֲצֵ֥י הַ/שָּׂדֶ֖ה עָלָ֥י/ו עֻלְפֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/015.yaml
  text: 'Thus says the Lord GOD: On the day he went down to Sheol[a], I caused mourning; I covered the deep because of him, and I restrained its rivers, and the many waters were stopped. I made Lebanon grow dark because of him[c][b], and all the trees of the field fainted because of him.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“他下到阴间[a]的那一天，我使人哀悼；我因他遮盖深渊，拦住深渊的江河，许多水都被阻住了。我因他使黎巴嫩昏暗[b]，田野的一切树木也因他而衰弱[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “阴间”指死者所在之境；也可译作“坟墓”或“死人之境”，并非专指后期观念中的“地狱”。
    reason: lexical_alternative
  - marker: b
    text: “使……昏暗”也可译作“使……忧郁”或“使……披上幽暗”；原词兼有黑暗、阴郁之意。
    reason: lexical_alternative
  - marker: c
    text: “衰弱”也可译作“昏厥”或“萎靡”。原文以衰颓、近乎昏倒的形象描写树木。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留称号与神名两个成分，并采用现代中文圣经语体中自然、庄重的组合。
- source_word: בְּיוֹם רִדְתּוֹ שְׁאוֹלָה
  choice: 他下到阴间的那一天
  rationale: 明确保留时间结构和下降意象；“阴间”在中文中可指死人所在之境，较“坟墓”宽泛，也避免译成带有后期刑罚观念的“地狱”。
- source_word: הֶאֱבַלְתִּי
  choice: 我使万物哀悼
  rationale: 保留Hiphil使役意义。“万物”是为补足中文中未明说的受事者，但不把哀悼限定为某一个自然对象。
- source_word: כִּסֵּתִי עָלָיו אֶת תְּהוֹם
  choice: 我因他遮盖深渊
  rationale: כסה按通常意义译为“遮盖”；עליו依上下文取原因义“因他”，保留原文略显奇峭的宇宙性哀悼图景。
- source_word: וָאֶמְנַע נַהֲרוֹתֶיהָ
  choice: 拦住深渊的江河
  rationale: מנע表达阻拦、扣住；阴性后缀回指“深渊”，为避免中文代词指向含混而明说“深渊的”。
- source_word: וַיִּכָּלְאוּ מַיִם רַבִּים
  choice: 于是众水都止住了
  rationale: 传达Niphal的受阻、被禁闭结果；“众水”保留诗歌性和水量浩大的意象。
- source_word: וָאַקְדִּר עָלָיו לְבָנוֹן
  choice: 我因他使黎巴嫩昏暗
  rationale: קדר的Hiphil表示使之阴暗、忧郁；“昏暗”兼顾外在黑暗与哀伤气氛，不把黎巴嫩的转喻意义直接解释进正文。
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: 田野的一切树木
  rationale: 直接保存树木群体的寓言意象，不在正文中将其解码为列国或统治者。
- source_word: עָלָיו עֻלְפֶּה
  choice: 也因他而衰弱
  rationale: עֻלְפֶּה表示昏厥、衰弱或萎靡；“衰弱”既可自然描述树木，也保留人格化哀恸的张力。
theological_decisions:
- issue: שְׁאוֹל的译法
  choice: 阴间
  alternative: 坟墓；死人之境；音译“示奥”；地狱
  rationale: “阴间”较自然地表达希伯来观念中死者所在之境，不局限于实体坟墓，也不引入后期关于“地狱”的特定刑罚含义；脚注说明其语义范围。
- issue: 宇宙性哀悼意象
  choice: 按诗性人格化图景保留
  alternative: 解释为纯粹自然灾变；在正文中完全解码为政治寓言
  rationale: 原文让深渊、黎巴嫩和田野树木共同响应那位大树般统治者的倾覆；译文保存这种神学与诗歌张力，不替作者把比喻单一化。
- issue: הֶאֱבַלְתִּי未明示的受事者
  choice: 译作“我使万物哀悼”
  alternative: 我使人哀悼；我使深渊哀悼；我使其哀悼
  rationale: 原文使役动词未明确写出谁哀悼，后文却展开自然界的响应。“万物”提供可懂的中文句法，同时避免限定为人或深渊单一对象。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。正文保留先知宣告的节奏、自然界人格化的哀悼意象及原文若干语义张力；仅在代词可能含混处适度明示所指。所有脚注标记均已置于相应正文词语之后。
