  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶ֨תְּנֵ֔/הוּ בְּ/יַ֖ד אֵ֣יל גּוֹיִ֑ם עָשׂ֤וֹ יַֽעֲשֶׂה֙ ל֔/וֹ כְּ/רִשְׁע֖/וֹ גֵּרַשְׁתִּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/011.yaml
  text: I gave him into the hand of a mighty one of the nations; he will surely deal with him[a]. According to his wickedness I drove him out.
translation:
  language: zh_hans
  text: 我把他交在列国中的一位强者手中；那人必定处置他[a]。我照他的邪恶把他赶了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国的一位统治者必定处置他。”原文称此人为列国中的强者，也可理解为列国中的强大统治者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵהוּ
  choice: 我把他交
  rationale: נתן在此带第一人称单数主语和第三人称阳性单数宾语。结合审判语境，按完成性陈述处理；“交”自然表达交付、交出的意思。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语“在某人手中”的常见权力意象，同时符合现代汉语表达，表示置于对方掌控之下。
- source_word: אֵיל גּוֹיִם
  choice: 列国中的一位强者
  rationale: אֵיל在这里指强有力者，不宜按字面译作“公绵羊”。此译保留泛指和所属关系，不在正文中擅自确定为某位君王。
- source_word: עָשׂוֹ יַעֲשֶׂה לוֹ
  choice: 那人必定处置他
  rationale: 不定式绝对形与未完成式同用，加强动作的确定性；“必定”传达强调，“处置”保留עשה在审判语境中的概括性，而不具体补出惩罚方式。
- source_word: כְּרִשְׁעוֹ
  choice: 照他的邪恶
  rationale: כְּ表达对应或相称关系，表明所受处置与其邪恶相应；避免简化成仅表示原因的“因他的邪恶”。
- source_word: גֵּרַשְׁתִּהוּ
  choice: 把他赶了出去
  rationale: גרש意为赶出、驱逐；此译自然、形象，并保留从原有位置或地位被逐出的意味。
theological_decisions:
- issue: אֵיל גּוֹיִם所指的审判执行者身份
  choice: 正文泛译为“列国中的一位强者”，不点名具体历史人物。
  alternative: “列国的统治者”或直接认定为巴比伦王。
  rationale: 原文在本节没有点名，只以概括性称谓描述上帝所使用的审判工具。译文因此保留其开放性，不把可能的历史认定写入正文。
- issue: כְּרִשְׁעוֹ与驱逐之间的关系
  choice: 译作“照他的邪恶”，保留审判与邪恶相称的表达。
  alternative: “因他的邪恶”，仅突出因果关系。
  rationale: 介词כְּ更直接表达对应、相称，而不只是原因；译文不进一步阐释这种相称关系的神学机制。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“交在……手中”保留原文权力意象；“必定处置”传达强调结构，同时避免补出原文未明说的具体行动。脚注标记[a]已置于相关分句之后。
