  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֶל מִ֨י דָמִ֥יתָ כָּ֛כָה בְּ/כָב֥וֹד וּ/בְ/גֹ֖דֶל בַּ/עֲצֵי עֵ֑דֶן וְ/הוּרַדְתָּ֨ אֶת עֲצֵי עֵ֜דֶן אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֨וֹךְ עֲרֵלִ֤ים תִּשְׁכַּב֙ אֶת חַלְלֵי חֶ֔רֶב ה֤וּא פַרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/018.yaml
  text: Whom were you like in glory and greatness among the trees of Eden? Yet you shall be brought down with the trees of Eden to the land below; you shall lie among the uncircumcised, with those slain by the sword. This is Pharaoh and all his multitude[a], declares the Lord GOD.
translation:
  language: zh_hans
  text: “你在荣耀和伟大上，能与伊甸树木中的谁相比呢？然而，你必同伊甸的树木一起被降到下界[a]；你必与被刀剑杀死的人一同躺卧在未受割礼的人中。这就是法老和他所有的众民。”主耶和华这样宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“地的低处”或“阴间”。希伯来语指下方的领域，即死者所在之处。
    reason: 说明אֶרֶץ תַּחְתִּית的词义范围，并保留其空间意象与死者领域之间的张力。
lexical_decisions:
- source_word: דָמִיתָ כָּכָה
  choice: 你究竟像谁呢
  rationale: דמה表达相像、可比；ככה加强比较语气。中文用“究竟”使反问自然有力，同时不把比较关系改写为陈述。
- source_word: כָבוֹד וּבְגֹדֶל
  choice: 论荣耀和伟大
  rationale: “荣耀”保留王者威仪和显赫之意；“伟大”兼顾规模与地位。以“论”自然引出比较的方面。
- source_word: עֲצֵי עֵדֶן
  choice: 伊甸的树木
  rationale: 直译并保留本章持续使用的树木隐喻，不将其直接解释为列国或君王。
- source_word: וְהוּרַדְתָּ
  choice: 你必……被降到
  rationale: Hophal词形表达使役被动；在审判预言中，此完成式具有确定的将来意味。
- source_word: אֶת עֲצֵי עֵדֶן
  choice: 同伊甸的树木一起
  rationale: 此处אֶת按伴随意义理解，与上下文所说众树一同下到死者领域相合。
- source_word: אֶרֶץ תַּחְתִּית
  choice: 下界
  rationale: 简洁表达下方的领域、死者所在之处，同时避免把希伯来空间意象细化为后期系统化的阴间地理。
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: 在未受割礼的人中
  rationale: 保留以西结审判话语中该称谓所带的盟约区别与受辱意味。
- source_word: תִּשְׁכַּב אֶת חַלְלֵי חֶרֶב
  choice: 你必躺在……中，与被刀杀的人同卧
  rationale: “躺／同卧”保留死亡与坟墓的委婉图像；“被刀杀的人”自然传达חַלְלֵי חֶרֶב。
- source_word: הוּא פַרְעֹה וְכָל הֲמוֹנוֹ
  choice: 这就是法老和他的所有军众
  rationale: הוּא在此总结并指认前述图景；הָמוֹן指法老庞大的群体或军众，“所有军众”避免现代汉语“群众”的歧义，也不缩减为单一人物。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现אֲדֹנָי的“主”和יהוה的专名性质，并避免重复为“主主”。
theological_decisions:
- issue: אֶרֶץ תַּחְתִּית所指的领域
  choice: 下界
  alternative: 地的低处；阴间
  rationale: 上下文明确涉及死者，但原文采用空间性的“下方之地”表达。“下界”既传达死者领域，也不强行规定其完整神学地理。
- issue: 未受割礼者的表达
  choice: 未受割礼的人
  alternative: 未受割礼者
  rationale: 保留原文的盟约性、族群性和受辱色彩，不将其泛化为“恶人”或其他神学判断。
- issue: 神名אֲדֹנָי יְהוִה
  choice: 主耶和华
  alternative: 主雅威
  rationale: 采用现代中文圣经读者熟悉且庄重的组合称谓，同时明确区分“主”与神的专名；不据此加入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留全章的树木隐喻、第二人称审判宣告和末句指认；标点划分反问、判词与神谕公式。脚注标记置于其实际解释的“下界”之后。
