id: EZK.31.4
reference: Ezekiel 31:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מַ֣יִם גִּדְּל֔וּ/הוּ תְּה֖וֹם רֹֽמְמָ֑תְ/הוּ אֶת נַהֲרֹתֶ֗י/הָ הֹלֵךְ֙ סְבִיב֣וֹת מַטָּעָ֔/הּ וְ/אֶת תְּעָלֹתֶ֣י/הָ שִׁלְחָ֔ה אֶ֖ל כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/004.yaml
  text: Waters made it grow[a]; the deep made it rise high. Its rivers flowed all around its planting place[b], and it sent out its channels to all the trees of the field.
translation:
  language: zh_hans
  text: 水使它长大；深渊使它高耸[a]。深渊的河流在它的栽植之地四围流淌；它又把水渠通到田野所有的树木那里[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使它升高”或“高举它”。
    reason: 原词既可描写树木长得高大，也可带有抬高、尊崇的意味。
  - marker: b
    text: “栽植之地”也可译为“种植园”或“栽植之处”。
    reason: 希伯来语名词可指栽种的地点，也可指成片栽植的园地。
lexical_decisions:
- source_word: מַיִם
  choice: 水
  rationale: 希伯来语虽为复数形式，但通常作集合性物质名词；现代汉语用“水”最自然，也保留滋养树木的意象。
- source_word: גִּדְּלוּהוּ
  choice: 使它长大
  rationale: גדל在此为使役意义，并带第三人称阳性单数后缀；“使它长大”贴合树木生长的直接意象。
- source_word: תְּהוֹם
  choice: 深渊
  rationale: 指地下或原初的深水；“深渊”简洁庄重，并保留本词在圣经中的宏阔意象。
- source_word: רֹמְמָתְהוּ
  choice: 使它高耸
  rationale: רום的使役形式兼有抬高、使高大之意；“高耸”既符合树木形象，也不排除其象征性的尊荣含义。
- source_word: נַהֲרֹתֶיהָ
  choice: 深渊的河流
  rationale: 阴性后缀回指阴性名词“深渊”；汉语明示所指，可避免“它的”被误解为树木的河流。
- source_word: הֹלֵךְ סְבִיבוֹת
  choice: 环绕……流淌
  rationale: 字面为“在四周行走”；以河流为语境时译作“环绕……流淌”更符合现代汉语。
- source_word: מַטָּעָהּ
  choice: 它栽种之地
  rationale: 该词可指栽种处或种植园；此译保留农业意象及原文代词关系，而不将地点过度具体化。
- source_word: תְּעָלֹתֶיהָ
  choice: 水渠
  rationale: 指分流的水道或灌溉沟渠；“水渠”清楚呈现水流输送到其他树木的画面。
- source_word: שִׁלְחָה
  choice: 引到
  rationale: שלח基本义为“送出”；对水渠而言，汉语“引到”自然表达使水道伸展、通往某处的动作。
- source_word: אֶל כָּל עֲצֵי הַשָּׂדֶה
  choice: 到田野所有的树木那里
  rationale: 直译并保留“田野的树木”这一集体性景象；“那里”使“引到”的目标在汉语中更顺畅。
theological_decisions:
- issue: 混合隐喻中的代词所指
  choice: 树木用“它”，并将阴性后缀的所指明确译为“深渊的河流”
  alternative: 把代词直接译成象征对象亚述或法老，或一律使用“它的”而不明确所指
  rationale: 本节首先呈现树木受水滋养的图景；保留“它”可避免过早拆解政治象征。与此同时，希伯来语阴性后缀自然回指“深渊”，明译能减少汉语歧义。
- issue: רֹמְמָתְהוּ兼具高度与尊崇含义
  choice: 译为“使它高耸”
  alternative: 译为“高举它”或“使它尊大”
  rationale: 上下文以树木为核心意象，“高耸”优先表达实际高度，同时仍容许读者领会其象征性的兴盛与尊荣，不将含义限缩为纯政治术语。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。句式保留希伯来诗性平行：“水使它长大；深渊使它高耸。”后半句以自然汉语呈现河流环绕、水渠外引的连续画面；不把树木隐喻提前解释为具体帝国或君王。
