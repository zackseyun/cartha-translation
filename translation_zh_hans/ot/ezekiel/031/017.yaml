  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: גַּם הֵ֗ם אִתּ֛/וֹ יָרְד֥וּ שְׁא֖וֹלָ/ה אֶל חַלְלֵי חָ֑רֶב וּ/זְרֹע֛/וֹ יָשְׁב֥וּ בְ/צִלּ֖/וֹ בְּ/ת֥וֹךְ גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/017.yaml
  text: They too went down with it to Sheol[a], to those slain by the sword; its arm dwelt in its shade among the nations.
translation:
  language: zh_hans
  text: 他们也与它一同下到阴间，归到那些被刀杀的人那里；他们就是它的膀臂[a]，是在列国中住在它荫下的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “膀臂”直译；也可理解为“力量”或“盟友、助力者”。
    reason: 原词保留身体意象；其单数集合名词与复数动词相配，在此也可能比喻其势力或支持它的群体。
lexical_decisions:
- source_word: גַּם הֵם
  choice: 他们也
  rationale: 保留“也”的递进关系，表明这些人同样遭受前文所述的审判。
- source_word: אִתּוֹ
  choice: 和它一同
  rationale: 上下文以香柏树比喻亚述；用中性代词“它”维持树木意象，不额外人格化。
- source_word: יָרְדוּ שְׁאוֹלָה
  choice: 下到阴间
  rationale: “阴间”在现代中文圣经语境中可指死者所在之境，既不缩减为坟墓，也不强行等同于后期教义中的地狱。
- source_word: אֶל חַלְלֵי חָרֶב
  choice: 到那些被刀杀的人那里
  rationale: 自然表达原文的构造短语，并保留其死于刀剑的含义。
- source_word: וּזְרֹעוֹ
  choice: 它的膀臂
  rationale: 正文保留“膀臂”的具体意象；结合复数动词，该词在此可能集合性地指它的力量、支持者或盟友，故用脚注说明。
- source_word: יָשְׁבוּ בְצִלּוֹ
  choice: 曾在它荫下的
  rationale: “住在荫下”表达长期处于其保护或势力之下；“曾”符合本节回顾其先前处境的语境，但不采用较重的过去完成表达。
- source_word: בְתוֹךְ גּוֹיִם
  choice: 在列国中
  rationale: “列国”简洁而庄重，适合以西结书国际审判的语境。
theological_decisions:
- issue: שְׁאוֹל 的译法
  choice: 阴间
  alternative: 坟墓；死者之境
  rationale: “阴间”保留希伯来语所指向的死者领域，不将它窄化为埋葬地点，也不把后期关于地狱的观念强加于经文。
- issue: זְרֹעוֹ 的所指
  choice: 正文直译为“膀臂”，并在句法上按集合性群体处理
  alternative: 力量；盟友；助力者
  rationale: 单数名词“膀臂”后接复数动词，暗示它可能比喻依附亚述的群体。正文保留意象，脚注保留解释空间，不把具体所指定死。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“荫下”延续树木比喻；末尾补出“也下去了”，使中文清楚呈现前面动词对后一组人的统摄关系，同时不改变原文判断。
