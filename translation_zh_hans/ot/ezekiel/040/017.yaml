  rationale: 保留 הִנֵּה 引导观看、唤起注意的指示功能，也符合异象叙述的庄重语体。
- source_word: לְשָׁכוֹת
  choice: 房间
  rationale: לִשְׁכָּה 在圣殿建筑中指供特定用途使用的房室；“房间”比“厢房”更通俗，且不额外限定其结构或用途。
- source_word: וְרִצְפָה
  choice: 和铺石地面
  rationale: רִצְפָה 指铺砌的地面或铺石区域；“铺石地面”清楚表达其建筑性质。
- source_word: עָשׂוּי לֶחָצֵר סָבִיב סָבִיב
  choice: 院子四周都建有
  rationale: 按中文自然语序整合被动分词与空间短语；“四周都”体现 סָבִיב סָבִיב 的环绕与强调功能，而不生硬重复。
- source_word: שְׁלֹשִׁים לְשָׁכוֹת
  choice: 共有三十个房间
  rationale: 准确保留数量，并以“共有”自然总结前述环绕布局。
- source_word: אֶל הָרִצְפָה
  choice: 铺石地面上
  rationale: 在本节建筑布局中将 אֶל 理解为房间与铺石区域的位置关联；不过该介词也可能表达邻接或朝向，因此以脚注保留歧义。
