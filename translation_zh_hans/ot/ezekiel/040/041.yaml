base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/041.yaml
  text: Four tables on this side and four tables on that side[a], by the side of the gate—eight tables[c][b]; on them they slaughtered.
translation:
  language: zh_hans
  text: 在门的侧边[b]，这边有四张桌子，那边有四张桌子[a]，共八张桌子；人们在这些桌子上宰杀祭牲[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一边……另一边”。
    reason: lexical_alternative
  - marker: b
    text: 直译“在门的肩部”；这是建筑方位用语，指门结构的侧边或侧翼。
    reason: cultural_note
  - marker: c
    text: 也可理解为“人们要在那里宰杀”或“人们常在那里宰杀”；希伯来语未完成式既可指将来的动作，也可说明这些桌子的预定或惯常用途。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה
  choice: 四
  rationale: 直接译出基数，说明第一组桌子的数目。
- source_word: שֻׁלְחָנוֹת
  choice: 桌子
  rationale: 该名词本身指“桌子”；其宰杀用途由末句说明，不在名词中增添“宰牲”等限定。
- source_word: מִפֹּה ... מִפֹּה
  choice: 这边……那边
  rationale: 这组对应的指示表达表示两个相对的方位；“这边……那边”自然地保留了空间对照。
- source_word: לְכֶתֶף הַשָּׁעַר
  choice: 在门的侧面
  rationale: כָּתֵף 字面义为“肩”，用于建筑或空间时指侧边、侧翼；正文采用现代汉语中清楚自然的表达。
- source_word: שְׁמוֹנָה
  choice: 共八张
  rationale: 这是对前述两组各四张桌子的总数概括；加入量词“张”符合现代汉语习惯。
- source_word: אֲלֵיהֶם
  choice: 在这些桌子上
  rationale: 介词与代词在此最自然地表示宰杀活动所在的桌面；明确复指桌子，避免汉语代词指向不清。
- source_word: יִשְׁחָטוּ
  choice: 人们……宰杀
  rationale: 希伯来语第三人称复数未明说主语；以泛指“人们”表达。汉语无标记的“宰杀”不强行限定为过去、将来或惯常动作，从而保留未完成式在此处的语义张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。“这边……那边”保留异象描写中的空间指示；“共八张桌子”清楚呈现总数。末句不添加原文未明说的“祭牲”，也不以时态词强行消除希伯来语动词的歧义。
