lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: 他又领我
  rationale: 该叙事动词表示承接前文的连续动作；“又”自然体现进程，“领我”保留使某人进入的含义。
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: 内院
  rationale: חָצֵר 在圣殿建筑语境中指院落，הַפְּנִימִי 表明是内层的院；“内院”简洁且符合现代汉语建筑用语。
- source_word: דֶּרֶךְ הַקָּדִים
  choice: 从东边
  rationale: דֶּרֶךְ 在此表示进入的路线，הַקָּדִים 指东方或东侧；“从东边”自然表达经由东侧进入，同时不把原文过度具体化为某条道路。
- source_word: וַיָּמָד
  choice: 并……量了
  rationale: מדד 在建筑语境中意为测量；“并”承接连续叙事。
- source_word: הַשַּׁעַר
  choice: 那座门
  rationale: שַׁעַר 可指门本身，也可指较完整的门楼或门道结构；正文采用常用的“门”，并以量词“座”适应建筑语境，词义歧义留在脚注说明。
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: 照先前那些尺寸
  rationale: 介词 כְּ 表示依照或与之相同，מִדּוֹת 指尺寸；语境表明这是比照前面已经量得的尺寸。“先前”将篇章指向自然呈现出来，而“那些”在现代汉语中更顺畅。
