base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/027.yaml
  text: 'And there was a gate to the inner court toward the south[a], and he measured from gate to gate toward the south: one hundred cubits.'
translation:
  language: zh_hans
  text: 内院有一座在南边的门[a]。他量了南边这座门到那座门之间的距离，共一百肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在南边”也可译为“朝南”；希伯来文直译为“经由南方”。
    reason: 原短语 דֶּרֶךְ הַדָּרוֹם 可表示朝向南方，也可在建筑描述中指位于南侧。
lexical_decisions:
- source_word: וְשַׁעַר
  choice: 有一座门
  rationale: 希伯来文是无动词句；中文补出“有”，使建筑描述自然清楚。“门”直接对应 שַׁעַר。
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: 内院
  rationale: 介词 לְ 表示这门与内院的归属或通达关系；在中文中以“内院有一座……门”自然表达，不把关系限定得过细。
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: 朝南
  rationale: 该短语字面涉及“南方的方向/路径”，在此建筑语境中表示门的朝向及量度的方向；“朝南”简洁保留方向意味。
- source_word: וַיָּמָד
  choice: 他又……量
  rationale: 连续叙事形式推进动作；主语承接上下文中的量度者。“又”符合中文叙事衔接。
- source_word: מִשַּׁעַר אֶל הַשַּׁעַר
  choice: 从一座门量到另一座门
  rationale: 保留两门之间量度的关系，同时用现代中文自然区分起点和终点。
- source_word: מֵאָה אַמּוֹת
  choice: 一百肘
  rationale: 保留原文的古代长度单位，不作未经文本说明的现代换算。
theological_decisions: []
