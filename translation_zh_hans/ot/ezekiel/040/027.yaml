- from: 内院有一座朝南的门[a]。他又朝南从一座门量到另一座门，共一百肘。
  to: 内院有一座在南边的门[a]。他量了南边这座门到那座门之间的距离，共一百肘。
  rationale: 以“在南边”处理首处建筑方位；第二处明确为南边两门之间的量度，既保留原文的方位关联，也避免中文将“朝南”误附于“他”。“这座门到那座门”对应“从门到门”，在上下文的相应南门框架内自然表达，未擅自界定具体门名。
