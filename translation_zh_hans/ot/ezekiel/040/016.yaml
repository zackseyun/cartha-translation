base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/016.yaml
  text: And there were recessed windows toward the guardrooms and toward their side pillars[a], inward, all around the gate; and likewise for the porticos. And windows were all around on the inside[c][b], and on each pillar were palm-tree decorations.
translation:
  language: zh_hans
  text: 卫房和卫房两侧的壁柱[b]上都有凹进式窗户[a]，朝向门道里面，沿着门道四周都有；门廊[c]也是如此。门道里面四周都有窗户；每根壁柱上都有棕榈树纹饰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“封闭式窗户”“窄窗”，也可能指“带凹框的窗户”。希伯来语形容词很可能描述一种特殊的窗体结构，并不一定表示窗户完全不能透光。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“壁柱”的希伯来语建筑术语含义较难确定，也可理解为“门框侧柱”或“附壁柱”。本节末尾的“壁柱”也是同一个词。
    reason: lexical_alternative
  - marker: c
    text: “门廊”或译“前厅”“廊子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלֹּנוֹת
  choice: 窗户
  rationale: 这是该词通常的含义；在这段建筑描写中，比泛称“开口”更具体。
- source_word: אֲטֻמוֹת
  choice: 凹进式
  rationale: 该形容词所指的具体窗体结构并不确定，可能表示窗框内凹、窗口收窄或封闭固定。“凹进式”既体现建筑特征，也避免让读者误以为窗户完全不透光；其他可能译法列入脚注。
- source_word: הַתָּאִים
  choice: 卫房
  rationale: 在以西结书40章的门楼语境中，指门内两侧的小室，功能上可理解为卫房。
- source_word: אֵלֵיהֶמָה
  choice: 卫房两侧的壁柱
  rationale: איל在这里属于含义较难确定的建筑术语，可能指门框侧柱、壁柱或凸出的支撑构件；“两侧的壁柱”较清楚地表达其位置和结构性质。
- source_word: לִפְנִימָה
  choice: 朝向门道里面／里面
  rationale: 保留这个副词表示朝内或位于内侧的空间取向，并按两处汉语语流分别处理。
- source_word: לַשַּׁעַר
  choice: 门道
  rationale: 此处所描写的是有卫房、壁柱和门廊的整座门楼结构；“门道”比单纯的“门”更能表达其内部空间。
- source_word: סָבִיב סָבִיב
  choice: 四周都是／四周都有
  rationale: 希伯来文重复该词以加强环绕各面的意思；汉语用“四周都”自然表达。
- source_word: וְכֵן
  choice: 也同样
  rationale: 表明前述窗户这一特征同样适用于门廊。
- source_word: אֵלַמּוֹת
  choice: 门廊
  rationale: 指门口带顶的廊式结构；“前厅”“廊子”等译法也有可能。
- source_word: אַיִל
  choice: 壁柱
  rationale: 末句的单数在语境中具有逐一分配的含义，因此译作“每根壁柱”；该建筑术语也可能指门框侧柱。
- source_word: תִּמֹרִים
  choice: 棕榈树纹饰
  rationale: 建筑语境表明这里不是栽种的树木，而是刻画或制作在柱上的棕榈树装饰图案。
