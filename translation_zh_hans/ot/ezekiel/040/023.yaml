  text: And a gate to the inner court was opposite the gate on the north and on the east[a]; and he measured from gate to gate one hundred cubits.
translation:
  language: zh_hans
  text: 通往内院的门，正对着北边和东边的门[a]；他从门到门量了一百肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与北边和东边的门相对”。
    reason: 原词 נֶגֶד 可表达“正对着”或“相对”的空间关系。
lexical_decisions:
- source_word: שַׁעַר
  choice: 门
  rationale: 此词指圣殿建筑群中的门或门道；“门”自然简洁，也符合本段建筑测量的语境。
- source_word: חָצֵר הַפְּנִימִי
  choice: 内院
  rationale: 指圣殿范围内较里面的院落；“内院”是清楚、凝练的现代汉语表达。
- source_word: נֶגֶד
  choice: 正对着
  rationale: 此处表示空间上隔院相对、彼此相向的关系；“正对着”适合建筑方位描写，同时脚注保留“相对”的译法。
- source_word: לַצָּפוֹן וְלַקָּדִים
  choice: 北边和东边
  rationale: 这两个方向词标明相应门的位置；译为“北边和东边”自然，并保留原文并列的方位。
- source_word: וַיָּמָד
  choice: 他量了
  rationale: 动词表示测量，主语承接异象中负责测量的人；汉语需明确补出“他”。
- source_word: מִשַּׁעַר אֶל שַׁעַר
  choice: 从这门到那门
  rationale: 原文直译为“从门到门”，表示两门之间的跨度；“从这门到那门”在现代汉语中更自然清楚。
- source_word: מֵאָה אַמָּה
  choice: 一百肘
  rationale: 保留古代长度单位“肘”，不作现代单位换算，以符合圣殿尺寸记述的历史语境。
theological_decisions: []
