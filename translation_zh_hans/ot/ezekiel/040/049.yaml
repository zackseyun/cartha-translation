base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/049.yaml
  text: The length of the vestibule was twenty cubits, and the width was twelve cubits, and by the steps by which one went up to it; and pillars were beside the sidewalls, one on this side and one on that side.
translation:
  language: zh_hans
  text: 门廊长二十肘，宽十一肘[a]；有台阶通上门廊。门柱两旁各有一根柱子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “十一肘”依希伯来文本；有古译本作“十二肘”。
    reason: 所给WLC作“十一肘”；部分古代译本见证“十二肘”。脚注保留数值异文，避免以英文审校轨迹的取值取代希伯来底本。
lexical_decisions:
- source_word: הָאֻלָם
  choice: 门廊
  rationale: 指圣殿正殿前的廊子；“门廊”既符合建筑语境，也便于现代读者理解。
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: 十一
  rationale: WLC的辅音组合及马所拉读法在此表达“十一”；虽有古译本及部分文本传统支持“十二”，正文优先依照所给希伯来文本。
- source_word: וּבַמַּעֲלוֹת אֲשֶׁר יַעֲלוּ אֵלָיו
  choice: 人从台阶上到门廊
  rationale: 希伯来原句在此句法略显省略；按空间关系自然表达，避免机械保留不通顺的并列结构。
- source_word: אֵילִים
  choice: 门柱
  rationale: 在以西结圣殿建筑描述中通常指门口两侧的壁柱或门柱；此处用“门柱”简洁明确。
- source_word: עַמֻּדִים
  choice: 柱子
  rationale: 与אֵילִים“门柱”区分，指另设于其旁的独立柱体。
