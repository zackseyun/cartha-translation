  language: zh_hans
  text: 他又量了门的前厅；从殿[b]那边量，长一竿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一根苇竿”。希伯来语这个词可指用来丈量的芦苇竿。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“从殿”。在以西结的圣殿异象中，“殿”常指圣殿建筑；这里“从”所表达的确切空间关系不易确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: 他又量了
  rationale: 叙事性连接形式推动场景继续发展；“又”自然承接前文连续的丈量动作。
- source_word: אֻלָם
  choice: 前厅
  rationale: 指门内类似门廊或入口厅的建筑空间；“前厅”在现代汉语中清楚、自然，也保留其建筑功能。
- source_word: הַשַּׁעַר
  choice: 门
  rationale: 直接对应门及其建筑结构；上下文已明确这是圣殿异象中的门楼。
- source_word: מֵהַבַּיִת
  choice: 从殿那边
  rationale: בַּיִת在本异象中常指圣殿，而介词מִן的具体空间关系不易确定；“从殿那边”保留方向或参照点的含混性，不径直改释为“里面”。
- source_word: קָנֶה אֶחָד
  choice: 一竿
  rationale: קָנֶה既是芦苇，也指用作丈量工具的长竿；“一竿”在此可同时表达量具及长度单位。
