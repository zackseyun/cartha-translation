base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/033.yaml
  text: And its guardrooms[a], its side pillars, and its portico were according to these measurements; and it and its side pillars had windows all around. Its length was fifty cubits[b], and its width twenty-five cubits.
translation:
  language: zh_hans
  text: 它的卫房、壁柱[a]和门廊[b]，尺寸都与上述相同；门楼和门廊四周都有窗户。门楼长五十肘，宽二十五肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “壁柱”所译的希伯来语建筑术语含义不十分确定，也可指“门柱”或“附墙柱”。
    reason: lexical_alternative
  - marker: b
    text: “门廊”也可译作“前厅”或“廊子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: 卫房
  rationale: 本章中指门楼内的小房间；“卫房”既符合门楼语境，也比“房室”更具体，同时不把功能解释得过细。
- source_word: אַיִל
  choice: 壁柱
  rationale: 此建筑术语指门楼的竖向结构构件，确切形制不明；“壁柱”较自然，也保留其可能是门柱或附墙柱的空间。
- source_word: אֵילָם
  choice: 门廊
  rationale: 指门楼入口处的廊式结构；“门廊”在现代汉语中清楚、庄重，并适合圣殿建筑语境。
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: 尺寸都与上述相同
  rationale: 表达这些部分与前述门楼相应部分尺寸一致，中文自然且准确。
- source_word: חַלּוֹנוֹת
  choice: 窗户
  rationale: 采用该词通常的建筑含义；上下文没有必要弱化为“窗口”。
- source_word: לוֹ וּלְאֵלַמָּו
  choice: 门楼和门廊
  rationale: 介词短语表明窗户设在该门楼及其门廊；补出“门楼”比直译为“它”更符合中文指代习惯。
- source_word: סָבִיב סָבִיב
  choice: 四周都
  rationale: 重叠形式强调周围各处，“四周都”保留其周遍含义。
- source_word: אֹרֶךְ חֲמִשִּׁים אַמָּה
  choice: 门楼长五十肘
  rationale: 补出所量对象，使中文维度说明清楚；“肘”保留原有古代长度单位。
- source_word: רֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: 宽二十五肘
  rationale: 直接表达第二项尺寸，与前句形成自然对偶。
