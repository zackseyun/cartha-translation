base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/005.yaml
  text: 'And behold[a], there was a wall outside the house, all around, and in the hand of the man was a measuring reed of six cubits, each cubit being a cubit and a handbreadth. And he measured the width of the structure: one reed[b], and the height: one reed.'
translation:
  language: zh_hans
  text: 看哪，殿外四围有一道墙；那人手中拿着一根量度竿，长六肘，每肘为一肘加一掌[a]。他量了这建筑物[b]的宽度，宽为一竿；高也为一竿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“六肘，按一肘加一掌的肘”；这里采用的是比普通肘多一掌的长肘。
    reason: cultural_note
  - marker: b
    text: “建筑物”也可译为“建筑结构”；按上下文，可能指这道墙。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留异象叙事中引导读者注意新景象的指示语气；用现代汉语中庄重而可懂的“看哪”。
- source_word: חוֹמָה
  choice: 一道墙
  rationale: 准确表达环绕建筑群的实体墙垣，不额外赋予防御工事的含义。
- source_word: מִחוּץ לַבַּיִת
  choice: 殿外
  rationale: בַּיִת字面为“房屋”，但在本章圣殿异象的语境中指殿宇；“殿外”比“房屋外”自然，也未扩大为整个建筑群。
- source_word: סָבִיב סָבִיב
  choice: 四围
  rationale: 希伯来语重复用词强调环绕各面；“四围”简洁自然地传达这一强化意义。
- source_word: וּבְיַד הָאִישׁ
  choice: 那人手中有
  rationale: 以自然汉语保留具体的持物画面，并承接上文已经出现的异象向导。
- source_word: קְנֵה הַמִּדָּה
  choice: 量度的苇竿
  rationale: קָנֶה本指芦苇或苇竿，在此用作量具；“量度的苇竿”既说明用途，也保留古代器物形态。
- source_word: שֵׁשׁ אַמּוֹת בָּאַמָּה וָטֹפַח
  choice: 长六肘；这里每肘是一肘加一掌
  rationale: 清楚表达苇竿总长六个长肘，而每个长肘由普通一肘加一掌构成；保留古代单位，不作可能失准的现代换算。
- source_word: רֹחַב הַבִּנְיָן
  choice: 墙体的宽度
  rationale: בִּנְיָן可指所建成的结构或建筑；紧接前述环墙时，“墙体”最符合指代和测量语境，同时以脚注保留较宽泛的词义。
- source_word: קָנֶה אֶחָד
  choice: 一竿
  rationale: 沿用刚说明的量度单位，简洁表达宽度和高度各等于一根量竿。
- source_word: וְקוֹמָה
  choice: 高度
  rationale: 在建筑测量语境中自然表达垂直尺寸。
theological_decisions: []
