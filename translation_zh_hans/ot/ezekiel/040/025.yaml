  yaml_path: translation/ot/ezekiel/040/025.yaml
  text: And it had windows all around[a], and its porch also had windows all around, like these windows. The length was fifty cubits, and the width twenty-five cubits.
translation:
  language: zh_hans
  text: 门楼和它的门廊四周都有窗户，和这些窗户一样。门楼长五十肘，宽二十五肘。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַלּוֹנִים
  choice: 窗户
  rationale: 该词在这里指门楼结构中的窗或开口；“窗户”自然、清楚，也符合本章反复出现的建筑描写。
- source_word: לוֹ
  choice: 门楼……都有
  rationale: 希伯来语字面为“它有”；依上文将代词所指明确为门楼，更符合现代汉语表达。
- source_word: וְלְאֵילָמָו
  choice: 和门廊
  rationale: אֵילָם指门楼前部的廊式空间；“门廊”既保留建筑含义，也比“前厅”更贴合此处圣殿异象的结构描写。
- source_word: סָבִיב סָבִיב
  choice: 四周都有
  rationale: 重复形式加强环绕、各面的意思；“四周都有”以自然汉语传达这一强调。
- source_word: כְּהַחֲלֹּנוֹת הָאֵלֶּה
  choice: 和先前那些窗户一样
  rationale: 直译可作“像这些窗户”；这里的指示语承接前文已描述的同类窗户，译作“先前那些”使汉语指向清楚而不改变比较关系。
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: 长五十肘
  rationale: 采用现代汉语常见的建筑尺寸表达，并保留古代长度单位“肘”。
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: 宽二十五肘
  rationale: 准确传达宽度数值，并与前句“长五十肘”形成简洁对称的表达。
