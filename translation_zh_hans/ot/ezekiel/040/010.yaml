  text: וְ/תָאֵ֨י הַ/שַּׁ֜עַר דֶּ֣רֶךְ הַ/קָּדִ֗ים שְׁלֹשָׁ֤ה מִ/פֹּה֙ וּ/שְׁלֹשָׁ֣ה מִ/פֹּ֔ה מִדָּ֥ה אַחַ֖ת לִ/שְׁלָשְׁתָּ֑/ם וּ/מִדָּ֥ה אַחַ֛ת לָ/אֵילִ֖ם מִ/פֹּ֥ה וּ/מִ/פּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/010.yaml
  text: And the guardrooms of the gate facing east were three on this side and three on that side[a]; the three of them had one measure[b], and the side pillars had one measure on this side and on that side.
translation:
  language: zh_hans
  text: 朝东的门有卫房[a]，这边三间，那边三间；三间的尺寸相同，两边的壁柱[b]尺寸也相同。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“侧室”。希伯来语所指的是设在门楼结构内的小房间。
    reason: lexical_alternative
  - marker: b
    text: 或译“门柱”或“壁柱式立柱”。在以西结的圣殿异象中，这个建筑术语的确切所指仍有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָאֵי
  choice: 卫房
  rationale: 指设在门楼结构内的小房间；“卫房”在现代汉语中简洁自然，也体现其在城门设施中可能具有的守卫用途，但不把这一用途写入正文之外。
- source_word: הַשַּׁעַר דֶּרֶךְ הַקָּדִים
  choice: 朝东的门
  rationale: 结合建筑语境，将字面为“东边方向的门”的表达译为自然、明确的方位说明。
- source_word: שְׁלֹשָׁה מִפֹּה וּשְׁלֹשָׁה מִפֹּה
  choice: 这边三间，那边三间
  rationale: 保留原文对称的指示表达和空间布局，并补出汉语所需的量词“间”。
- source_word: מִדָּה אַחַת לִשְׁלָשְׁתָּם
  choice: 三间的尺寸相同
  rationale: 原文直译为“三者有同一个量度”，这里用现代汉语清楚表达三间卫房规格一致。
- source_word: אֵילִם
  choice: 壁柱
  rationale: 该词在以西结的圣殿建筑异象中指门楼两侧的竖直建筑构件；“壁柱”较能涵盖柱状构件，同时以脚注保留“门柱”等可能译法。
- source_word: וּמִדָּה אַחַת לָאֵילִם מִפֹּה וּמִפּוֹ
  choice: 两边的壁柱尺寸也相同
  rationale: 自然呈现两侧对应构件量度一致的意思，并保留本句与前一分句在结构和意义上的平行。
