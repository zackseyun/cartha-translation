id: EZK.40.3
reference: Ezekiel 40:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֵ֨יא אוֹתִ֜/י שָׁ֗מָּ/ה וְ/הִנֵּה אִישׁ֙ מַרְאֵ֨/הוּ֙ כְּ/מַרְאֵ֣ה נְחֹ֔שֶׁת וּ/פְתִיל פִּשְׁתִּ֥ים בְּ/יָד֖/וֹ וּ/קְנֵ֣ה הַ/מִּדָּ֑ה וְ/ה֥וּא עֹמֵ֖ד בַּ/שָּֽׁעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/003.yaml
  text: He brought me there[a], and behold, there was a man whose appearance was like the appearance of bronze, with a linen cord in his hand and a measuring reed[c][b]; and he was standing in the gateway.
translation:
  language: zh_hans
  text: 他带我到了那里。看哪，有一个人，他的形貌仿佛铜一般[a]，手里拿着一条亚麻绳[b]和一根量度竿，正站在门楼里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他的形貌如同铜的形貌。”希伯来文重复“形貌”一词以加强描述；“铜”也可理解为“青铜”。
    reason: 说明原文的重复表达及金属名称的词义范围。
  - marker: b
    text: 也可译作“一条亚麻线”或“一条亚麻量绳”。
    reason: פְּתִיל פִּשְׁתִּים 可指亚麻制成的绳或线，语境暗示其可能用于量测。
  - marker: c
    text: 或译：“在门口”或“在门道中”。这里的词可指门，也可指包括门道在内的门楼建筑。
    reason: 保留 שַׁעַר 在建筑语境中的范围歧义。
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: 他带我到了那里
  rationale: 连续叙事形式推进异象场景；“到了那里”自然表达朝向前文所述地点的移动，并保留由上文人物作主语。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意、呈现异象中新景象的语篇功能，也符合庄重的先知文学语体。
- source_word: אִישׁ
  choice: 一个人
  rationale: 原文只称其为“人”，不进一步认定为天使或神显人物。
- source_word: מַרְאֵהוּ כְּמַרְאֵה נְחֹשֶׁת
  choice: 他的形貌仿佛铜一般
  rationale: 以自然现代汉语表达金属般的外观；נְחֹשֶׁת 可指铜或青铜，正文采用涵盖性较强的“铜”，并在脚注说明原文重复“形貌”。
- source_word: פְּתִיל פִּשְׁתִּים
  choice: 一条亚麻绳
  rationale: 该词组指用亚麻纤维制成的绳或线；“亚麻绳”准确、清楚，也适合作为量测工具。
- source_word: בְּיָדוֹ
  choice: 手里拿着
  rationale: 原文明确为单数“他的手中”；汉语用“手里拿着”自然呈现持有状态。
- source_word: קְנֵה הַמִּדָּה
  choice: 一根量度竿
  rationale: 指用于量测的芦苇竿；“量度竿”既保留器具性质，也清楚说明用途。
- source_word: וְהוּא עֹמֵד
  choice: 正站着
  rationale: 分词表达持续姿态，“正站着”保留场景中的进行状态。
- source_word: בַּשָּׁעַר
  choice: 在门楼里
  rationale: 在圣殿异象的建筑语境中，שַׁעַר 可指整个门楼或门道区域；介词 בְּ 适合译作“在……里”。
theological_decisions:
- issue: 异象中“那个人”的身份
  choice: 仅译作“一个人”，不界定其身份
  alternative: 译作天使、使者或神显人物
  rationale: 本节原文只称其为“人”，并描述其形貌与量测工具；译文不加入经文本身没有明说的身份判断。
- issue: 人物如铜的形貌所暗示的性质
  choice: 只保留视觉比喻，不补入发光、荣耀或超自然性质
  alternative: 译作“闪耀的铜”或明确解释为神圣荣光
  rationale: 原文只有“如铜的形貌”，没有在本句中使用“闪耀”等修饰语；应保留其开放性。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“看哪”保留先知异象的呈现感；量词“条”“根”和“手里拿着”使句子自然。“门楼”贴合以西结圣殿异象的建筑背景，同时用脚注保留“门口／门道”的可能理解。
