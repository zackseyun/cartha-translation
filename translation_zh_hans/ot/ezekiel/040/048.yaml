base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/048.yaml
  text: 'Then he brought me to the vestibule of the house[a], and he measured the jambs of the vestibule: five cubits on this side and five cubits on that side[c][b]; and the width of the gate was three cubits on this side and three cubits on that side.'
translation:
  language: zh_hans
  text: 他带我到殿的门廊[a]，量了门廊的门柱[b]：这边五肘，那边五肘；门的宽度：这边三肘，那边三肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门廊”也可译作“前廊”或“廊厅”。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来语是罕见的建筑用语，也可译作“壁柱”或“侧柱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֻלָם
  choice: 门廊
  rationale: 指圣殿主体建筑前的入口廊厅；“门廊”既符合建筑语境，也自然易懂。
- source_word: הַבַּיִת
  choice: 殿
  rationale: 原文直译为“房屋”，但在本异象的明确语境中指圣殿主体；译作“殿”能准确、简洁地传达所指。
- source_word: אֵל אֻלָם
  choice: 门廊两边的壁柱
  rationale: אֵל 在此是罕见的建筑术语，指入口两侧的结构，可理解为壁柱、门柱或侧柱；结合两边分别量度的语境，译作“壁柱”较为贴切。
- source_word: חָמֵשׁ אַמּוֹת ... מִפֹּה וְחָמֵשׁ אַמּוֹת מִפֹּה
  choice: 这边五肘，那边五肘
  rationale: 保留原文对称、简洁的指示表达，清楚呈现入口两侧各自的尺寸。
- source_word: רֹחַב הַשַּׁעַר
  choice: 门口宽度
  rationale: שַׁעַר 通常指门或门道；此处量度的是入口区域，译作“门口宽度”较符合现代汉语建筑表述。
- source_word: שָׁלֹשׁ אַמּוֹת מִפּוֹ וְשָׁלֹשׁ אַמּוֹת מִפּוֹ
  choice: 门口宽度的两侧，这边三肘，那边三肘
  rationale: 马所拉文本明确说两侧各三肘，但这与“宽度”如何对应在建筑解释上并不完全清楚；译文保留两侧量度，不擅自合并为总宽。
- source_word: וַיְבִאֵנִי ... וַיָּמָד
  choice: 他带我……量了
  rationale: 以自然的现代汉语承接异象叙事，同时保留两个连续动作及同一未明说身份的男性主语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。尺寸表达保留原文“这边……那边……”的对称结构；“肘”沿用常见圣经度量单位。主语“他”不额外指明身份，以保留上下文所具有的指代方式。
