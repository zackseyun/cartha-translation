base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/021.yaml
  text: 'Its guardrooms were three on this side and three on that side[a], and its side pillars and its portico had the same measurements as the first gate: its length was fifty cubits[b], and the width twenty-five cubits.'
translation:
  language: zh_hans
  text: 它的卫房，这边有三间，那边有三间；它的侧柱[a]和门廊[b]，尺寸都与第一座门相同。门长五十肘，宽二十五肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侧柱”所译的希伯来语建筑术语含义不完全确定，也可理解为“门柱”或“壁柱”。
    reason: lexical_alternative
  - marker: b
    text: “门廊”也可译作“前廊”或“廊厅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: 卫房
  rationale: 在以西结书40章的门楼结构中，指设于通道两侧的小房间；“卫房”既体现其可能的守卫用途，也比泛称“房间”更贴合上下文。
- source_word: שְׁלוֹשָׁה מִפּוֹ ... וּשְׁלֹשָׁה מִפּוֹ
  choice: 这边有三间，那边有三间
  rationale: 保留原文对称分布的空间表达，同时符合现代汉语习惯。
- source_word: אֵיל
  choice: 侧柱
  rationale: 该建筑术语所指并不完全确定，可能是门柱、壁柱或凸出的结构支撑；正文采用易懂且不过度具体的“侧柱”，并以脚注保留其他可能。
- source_word: אֵלָם
  choice: 门廊
  rationale: 指门楼中类似廊厅或前廊的部分；“门廊”在现代汉语中清楚自然，并保留其建筑空间属性。
- source_word: הָיָה כְּמִדַּת הַשַּׁעַר הָרִאשׁוֹן
  choice: 尺寸都与第一座门相同
  rationale: 自然表达原文与先前那座门在尺度上的比较，并由复合主语采用“都”使句意清楚。
- source_word: הַשַּׁעַר הָרִאשׁוֹן
  choice: 第一座门
  rationale: 指异象叙述中先前首先量过的门；“第一座门”直接保留顺序意义。
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ
  choice: 门长五十肘
  rationale: 简洁保留明确的长度数值，并补出“门”作为汉语句法所需的指称。
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים בָּאַמָּה
  choice: 宽二十五肘
  rationale: 与前面的长度表达形成自然、紧凑的平行结构。
- source_word: אַמָּה
  choice: 肘
  rationale: 保留贯穿本段异象的古代长度单位，不擅自换算为现代单位。
