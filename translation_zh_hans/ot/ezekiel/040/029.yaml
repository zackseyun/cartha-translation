  text: And its guardroom[a], its side pillars, and its porch were according to these measurements; and it had windows, and its porch had windows, all around. The length was fifty cubits[b], and the width twenty-five cubits.
translation:
  language: zh_hans
  text: 它的卫房、侧柱[a]和门廊[b]都与先前所说的尺寸相同；它和门廊四周都有窗户。门楼长五十肘，宽二十五肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侧柱”或译“门框柱”、“壁柱”或“柱子”。
    reason: lexical_alternative
  - marker: b
    text: “门廊”或译“前厅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: 卫房
  rationale: 本词在以西结所见圣殿异象中指门楼内的小房间；“卫房”既体现其门卫设施的语境，也比“斗室”或泛称“房间”更清楚。
- source_word: אַיִל
  choice: 侧柱
  rationale: 这里指门楼结构中的竖直构件；“侧柱”通俗而保留建筑含义，具体形态也不作过度限定。
- source_word: אֵילָם
  choice: 门廊
  rationale: 指门楼入口处有遮蔽的廊状空间；“门廊”符合现代汉语建筑用语。
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: 都与先前所说的尺寸相同
  rationale: 指这些部分符合上文已经列出的尺寸；补出“先前所说的”可自然表达希伯来语指示语的回指作用。
- source_word: חַלּוֹנוֹת
  choice: 窗户
  rationale: 采用本词通常意义；本节没有充分依据进一步译成“格窗”或“窗洞”。
- source_word: סָבִיב סָבִיב
  choice: 四周都有
  rationale: 希伯来语重复强调周围各处；“四周都有”自然传达这一强化语气。
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ וְרֹחַב עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: 门楼长五十肘，宽二十五肘
  rationale: 保留原文的建筑尺寸和“肘”这一古代长度单位；根据上下文补出受量度的门楼，避免汉语中主语悬空。
- source_word: לּוֹ וּלְאֵילָמוֹ
  choice: 它和门廊……都有窗户
  rationale: 按原文分别关联主体及其门廊，同时保留代词所指依赖上下文的特点。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。建筑术语尽量明确，但对 אַיִל 和 אֵילָם 的具体构造保留词义上的开放性；度量单位沿用“肘”，不在正文中换算。
