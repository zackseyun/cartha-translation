  text: Then he brought me to the north gate and measured it according to these measurements[a].
translation:
  language: zh_hans
  text: 随后，他带我到北门，照这些尺寸量了那门。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用这些尺寸量了那门”，意思是采用前文所述的相同尺寸。
