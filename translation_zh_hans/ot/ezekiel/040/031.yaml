  text: Its portico faced the outer court[a], and palm trees were on its jambs, and eight steps went up to it.
translation:
  language: zh_hans
  text: 它的门廊朝向外院[a]；门柱上有棕榈树雕饰；有八级台阶通上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“它的前厅朝向外院”；本章所用的希伯来语建筑术语较为专门。“门廊”也可译为“前厅”，“门柱”也可译为“壁柱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלַמּוֹ
  choice: 它的门廊
  rationale: אֵלָם在以西结的圣殿异象中指入口处向外伸出的建筑结构；“门廊”自然、庄重，也符合本章建筑语境。
- source_word: אֶל חָצֵר הַחִיצוֹנָה
  choice: 朝向外院
  rationale: 介词אֶל在这一名词句中表示方位；“朝向”准确表达该门廊相对于外院的方向。
- source_word: תִמֹרִים
  choice: 棕榈树的雕饰
  rationale: 该词本义为棕榈树或棕榈形象；在建筑构件上显然指装饰图案，译出“雕饰”可避免读者误以为是真树。
- source_word: אֵילָו
  choice: 门柱
  rationale: אֵיל在本章指门口两侧的结构构件，可理解为壁柱、门框侧柱或门柱；“门柱”通俗而能保留一定的建筑术语宽度。
- source_word: מַעֲלוֹת שְׁמוֹנֶה
  choice: 八级台阶
  rationale: 该短语表示八级阶梯；“八级台阶”是现代汉语中自然且精确的表达。
- source_word: מַעֲלוֹ
  choice: 登上去
  rationale: 马所拉文本此处形式较难，整体语义是借八级台阶上到该处；“登上去有八级台阶”以自然汉语表达通往建筑入口的上行路径，同时不指定未明说的主语。
