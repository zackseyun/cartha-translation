source:
  edition: WLC
  text: בְּ/עֶשְׂרִ֣ים וְ/חָמֵ֣שׁ שָׁנָ֣ה לְ֠/גָלוּתֵ/נוּ בְּ/רֹ֨אשׁ הַ/שָּׁנָ֜ה בֶּ/עָשׂ֣וֹר לַ/חֹ֗דֶשׁ בְּ/אַרְבַּ֤ע עֶשְׂרֵה֙ שָׁנָ֔ה אַחַ֕ר אֲשֶׁ֥ר הֻכְּתָ֖ה הָ/עִ֑יר בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה הָיְתָ֤ה עָלַ/י֙ יַד יְהוָ֔ה וַ/יָּבֵ֥א אֹתִ֖/י שָֽׁמָּ/ה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/001.yaml
  text: In the twenty-fifth year of our exile[a], at the beginning of the year, on the tenth day of the month, in the fourteenth year after the city had been struck down, on that very day the hand of Yahweh was upon me[b], and he brought me there.
translation:
  language: zh_hans
  text: 我们被掳的第二十五年，年初[a]，本月初十日，那城遭击破[b]后第十四年；就在那一天，雅威的手临到我，他把我带到那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“年头”；可能指新年时点，但具体所指并不确定。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“那城被攻陷”或“那城陷落”。原文更直译是“那城被击打”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגָלוּתֵנוּ
  choice: 我们被掳
  rationale: גָּלוּת指流亡、被迁徙离乡；“我们被掳”保留第一人称复数和被迫离乡的历史处境，也符合中文圣经语体。
- source_word: בְּרֹאשׁ הַשָּׁנָה
  choice: 年初
  rationale: 原文直译为“年头”；“年初”自然、简洁，并避免直接断定这是某个特定的新年节日。
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 月初十日
  rationale: 明确表达该月第十日，符合现代中文日期说法。
- source_word: הֻכְּתָה
  choice: 被击破
  rationale: 这是נכה的被动式，含受打击、被攻破之意；用于城邑时，“被击破”既保留暴力性的被动含义，也比生硬的“被击打”自然。
- source_word: הָעִיר
  choice: 城
  rationale: 原文只说“城”，未明说耶路撒冷；正文不把上下文所指直接补入，以免过度解释。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 正是在那一天
  rationale: 表达עֶצֶם在此强调日期完全相同、确切无误的作用。
- source_word: יַד יְהוָה
  choice: 雅威的手
  rationale: 保留以西结书反复出现的先知性惯用语，不将“手”解释性改写为“能力”或“驱使”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文音译呈现四字神名，区别于将其替换为称号“主”。
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: 他把我带到那里
  rationale: “那里”准确对应שָׁמָּה，不在本节中提前说明异象的目的地；代词所指依上下文为雅威。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重建的读音，并保留专名性质。
- issue: “雅威的手临到我”的含义
  choice: 保留身体隐喻“手”
  alternative: 雅威的能力临到我／雅威驱使我
  rationale: 该短语可涉及神的能力、控制或先知经验，正文保留原有隐喻及其神学张力，不限定为其中一种解释。
- issue: “年初”是否特指新年节期
  choice: 正文译“年初”，不确定具体节期
  alternative: 新年那天
  rationale: בְּרֹאשׁ הַשָּׁנָה字面为“在年头”；它可能指新年时点，但本节没有明说具体历法或节期，因此不在正文中加以断定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。日期结构按中文习惯稍作整理，以分号分开时间说明与主要事件；保留“雅威的手”这一核心先知性意象，并避免把“城”明确增译为“耶路撒冷”。
