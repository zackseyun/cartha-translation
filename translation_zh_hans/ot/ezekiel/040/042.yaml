  text: וְ/אַרְבָּעָה֩ שֻׁלְחָנ֨וֹת לָ/עוֹלָ֜ה אַבְנֵ֣י גָזִ֗ית אֹרֶךְ֩ אַמָּ֨ה אַחַ֤ת וָ/חֵ֨צִי֙ וְ/רֹ֨חַב אַמָּ֤ה אַחַת֙ וָ/חֵ֔צִי וְ/גֹ֖בַהּ אַמָּ֣ה אֶחָ֑ת אֲלֵי/הֶ֗ם וְ/יַנִּ֤יחוּ אֶת הַ/כֵּלִים֙ אֲשֶׁ֨ר יִשְׁחֲט֧וּ אֶת הָ/עוֹלָ֛ה בָּ֖/ם וְ/הַ/זָּֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/042.yaml
  text: And four tables for the burnt offering were of cut stone[a], a cubit and a half long, a cubit and a half wide, and one cubit high[b]. On them they placed the implements with which they slaughtered the burnt offering and the sacrifice.
translation:
  language: zh_hans
  text: 又有四张供燔祭使用的桌子，是用凿好的石头制成的[a]，长一肘半，宽一肘半，高一肘。他们把用来宰杀燔祭和祭牲[b]的器具放在这些桌子上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用凿成的石头制成的”。
    reason: 保留אַבְנֵי גָזִית“经凿削、修整的石头”的另一自然译法。
  - marker: b
    text: “祭牲”原文可泛指献上的祭物；在某些语境中也可特指平安祭的祭牲。
    reason: 保留זֶבַח在一般祭物与特定祭类之间的词义开放性。
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: 桌子
  rationale: 该词指桌子或桌状台面；本节已说明其祭祀用途，无须增译为“宰牲桌”。
- source_word: לָעוֹלָה
  choice: 供燔祭使用的
  rationale: עוֹלָה是“燔祭”的常用术语，前缀ל在此表示用途或归属。
- source_word: אַבְנֵי גָזִית
  choice: 用凿好的石头制成的
  rationale: 该短语指经过凿削、修整的石材；此译自然地表达材质与加工状态。
- source_word: אַמָּה אַחַת וָחֵצִי
  choice: 一肘半
  rationale: 保留古代长度单位“肘”，不作不确定的现代换算。
- source_word: וְגֹבַהּ אַמָּה אֶחָת
  choice: 高一肘
  rationale: 以现代汉语简洁自然地表达“其高度为一肘”。
- source_word: אֲלֵיהֶם
  choice: 在这些桌子上
  rationale: 介词表示器具被放置在前述桌子的台面上。
- source_word: וְיַנִּיחוּ
  choice: 他们把……放在
  rationale: 使役词干在此表示使器具安放、搁置；结合异象中的设施说明，用一般陈述表达其惯常用途。
- source_word: הַכֵּלִים
  choice: 器具
  rationale: כֵּלִים含义较广，在本语境中指宰杀祭牲所用的工具或器械；“器具”准确而不过度具体。
- source_word: אֲשֶׁר יִשְׁחֲטוּ ... בָּם
  choice: 宰杀……所用的
  rationale: 将关系从句和工具意义合并为自然的汉语定语结构。
- source_word: הָעוֹלָה
  choice: 燔祭
  rationale: 与本节前半相同，保持祭祀术语一致。
- source_word: וְהַזָּבַח
  choice: 其他祭牲
  rationale: זֶבַח可泛指经宰杀献上的祭物，也可能在特定语境中指平安祭；“祭牲”与动词“宰杀”搭配自然，加“其他”表达连接词所列的另一项而不把它限定为某一类祭。
theological_decisions:
- issue: זֶבַח所指祭物类别的具体程度
  choice: 正文译作“其他祭牲”，不限定具体祭类。
  alternative: 平安祭的祭牲
  rationale: זֶבַח既可泛指宰杀献上的祭物，也可在某些语境中专指平安祭；本节本身没有充分限定，故保留较宽泛的含义，并以脚注说明另一可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留“肘”“燔祭”等必要的古代度量及祭祀术语。中文正文中的脚注标记均紧随相关内容。
