  yaml_path: translation/ot/ezekiel/040/026.yaml
  text: And its ascent had seven steps[a], with its vestibule before them; and it had palm-tree ornaments, one on this side and one on that side[b], on its jambs.
translation:
  language: zh_hans
  text: 上到这门有七级台阶，门廊[a]在台阶前面；门柱[b]上有棕榈树纹饰，这边一个，那边一个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门廊”也可译作“前廊”。
    reason: lexical_alternative
  - marker: b
    text: “门柱”也可译作“侧柱”或“门框”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת שִׁבְעָה עֲלוֹתוֹ
  choice: 登上这门有七级台阶
  rationale: 原文以“台阶”和“上升、登上”构成略显重复的建筑描述；译文保留登临方向和七级台阶，同时采用自然的现代汉语表达。
- source_word: וְאֵילַמּוֹ
  choice: 门廊
  rationale: 在以西结的圣殿异象中，此词指门口突出的入口建筑；“门廊”简明、庄重，也符合上下文。
- source_word: לִפְנֵיהֶם
  choice: 在台阶前面
  rationale: 复数代词所指最自然是前述台阶；明确译出所指，避免汉语中的代词含混。
- source_word: וְתִמֹרִים
  choice: 棕榈树纹饰
  rationale: 建筑语境表明这里不是活的树，而是棕榈树形的雕刻或装饰图案；“纹饰”自然表达这一含义。
- source_word: אֶחָד מִפּוֹ וְאֶחָד מִפּוֹ
  choice: 这边一个，那边一个
  rationale: 保留原文对称、逐边分述的空间表达，不压缩为较概括的“两边各一个”。
- source_word: אֵילָו
  choice: 门柱
  rationale: 此处指门口两侧的结构构件；“门柱”比专业性较强的“门框侧柱”更便于普通读者理解，同时保留建筑意义。
