  yaml_path: translation/ot/ezekiel/040/011.yaml
  text: 'Then he measured the width of the entrance of the gate: ten cubits[b][a], and the length of the gate: thirteen cubits.'
translation:
  language: zh_hans
  text: 他量了门口的宽度：十肘；门道[a]的长度：十三肘。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门道”或译“门”；希伯来语 שַׁעַר 可以指整个门道建筑，不只是门的开口。
    reason: lexical_alternative
  - marker: b
    text: 有些译本较为解释性地把第二个尺寸译作门道的“进深”或“跨度”，但希伯来原文只说“门道的长度”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: 他又量了
  rationale: 连续叙事形式承接异象中的下一项测量；“又”在现代汉语中自然体现动作推进。
- source_word: רֹחַב
  choice: 宽度
  rationale: 这是表示横向尺寸的常用词，“宽度”准确而自然。
- source_word: פֶּתַח
  choice: 门口
  rationale: 指门的开口或入口；“门口”简明地表达此处受测量的开口。
- source_word: הַשַּׁעַר
  choice: 门道
  rationale: 本章语境中的 שַׁעַר 可指整体门道建筑，而不只是一扇门；译作“门道”有助于区别其结构长度与“门口”的宽度，同时以脚注保留“门”的直译可能。
- source_word: עֶשֶׂר אַמּוֹת
  choice: 十肘
  rationale: 保留古代长度单位，不作现代单位换算。
- source_word: אֹרֶךְ
  choice: 长度
  rationale: 按该词通常意义直译为“长度”，不根据建筑推测改成“进深”或“跨度”。
- source_word: שְׁלֹשׁ עֶשְׂרֵה אַמּוֹת
  choice: 十三肘
  rationale: 直接保留原文的数值和古代长度单位。
