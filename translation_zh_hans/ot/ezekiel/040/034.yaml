  yaml_path: translation/ot/ezekiel/040/034.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: zh_hans
  text: 门廊朝向外院，门框[b]两边都有棕榈树[a]；上去有八级台阶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“棕榈树形雕刻”。原词字面意思是“棕榈树”，但在这里的建筑语境中，很可能指装饰图案。
    reason: lexical_alternative
  - marker: b
    text: “门框”或译“侧柱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַמּוֹ
  choice: 门廊
  rationale: אֵלָם在圣殿门楼的建筑语境中指向外伸出的廊子或前室；“门廊”自然、明确，也与本章语境相符。句首连接词按现代汉语行文省略。
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: 朝向外院
  rationale: 介词ל在这里表达建筑物的方位；“朝向外院”准确而自然，不把空间关系误解为归属关系。
- source_word: וְתִמֹרִים
  choice: 棕榈树
  rationale: תִמֹרִים字面意为“棕榈树”。在建筑语境中很可能指棕榈树形的雕刻或装饰，但原文没有明说，因此正文保留字面表达，并以脚注说明。
- source_word: אֶל־אֵילָיו
  choice: 门框
  rationale: 此处复数附属形式所指的是门楼两侧的结构构件；“门框”通俗且适合建筑语境，同时以脚注保留“侧柱”这一可能译法。
- source_word: מִפֹּה וּמִפֹּה
  choice: 两边
  rationale: 该习语表示两侧分别都有。现代汉语用“两边”简洁自然，并保留其对称分布之意。
- source_word: וּשְׁמֹנֶה מַעֲלוֹת
  choice: 八级台阶
  rationale: מַעֲלוֹת在这里指供人登上的阶梯；“八级台阶”符合现代汉语对台阶数量的表达。
- source_word: מַעֲלוֹ
  choice: 通到那里
  rationale: 原文末语表达通往该门廊的上行阶梯。译作“通到那里”在汉语中补足其功能关系，又避免重复“上去”。
