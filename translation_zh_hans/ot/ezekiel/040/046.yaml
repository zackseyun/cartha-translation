source:
  edition: WLC
  text: וְ/הַ/לִּשְׁכָּ֗ה אֲשֶׁ֤ר פָּנֶ֨י/הָ֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן לַ/כֹּ֣הֲנִ֔ים שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ הֵ֣מָּה בְנֵֽי צָד֗וֹק הַ/קְּרֵבִ֧ים מִ/בְּנֵֽי לֵוִ֛י אֶל יְהוָ֖ה לְ/שָׁרְתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/046.yaml
  text: And the chamber whose front faces north is for the priests who keep charge of the altar. They are the sons of Zadok[a], who from among the sons of Levi come near to Yahweh to minister to him.
translation:
  language: zh_hans
  text: 那朝北的房间，是给负责看守祭坛的祭司的。他们是撒督的子孙[a]，是利未子孙中亲近雅威、事奉他的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “子孙”直译为“儿子们”，这里指撒督一系的后裔。
    reason: 说明希伯来语宗族表达，避免现代读者误以为仅指撒督的亲生儿子。
lexical_decisions:
- source_word: לִּשְׁכָּה
  choice: 房间
  rationale: 指圣殿建筑群中有特定用途的房室；“房间”符合现代汉语建筑语境，也不额外限定其规模或形制。
- source_word: פָּנֶיהָ דֶּרֶךְ הַצָּפוֹן
  choice: 朝北
  rationale: 原文以“面”表达建筑物的朝向；现代汉语用“朝北”自然、准确。
- source_word: לַכֹּהֲנִים
  choice: 是给……祭司的
  rationale: 介词 ל 表示分配或用途；汉语补出判断结构，使句意完整。
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַמִּזְבֵּחַ
  choice: 负责看守祭坛
  rationale: שמר משמרת 表示履行守护、值守或受托职责；“负责看守”保留职责意味，不把它缩减为单纯防卫。
- source_word: בְנֵי צָדוֹק
  choice: 撒督的子孙
  rationale: בנים 在宗族谱系语境中可指后裔；“子孙”既自然，又清楚表达祭司家系。脚注保留其形式上也可直译为“儿子们”。
- source_word: הַקְּרֵבִים
  choice: 亲近
  rationale: קרב 在祭司礼仪语境中指来到神面前执行圣职；“亲近”保留原文的礼仪性和关系性，不泛化为普通的“走近”。
- source_word: מִבְּנֵי לֵוִי
  choice: 利未子孙中
  rationale: מן 具有部分、选取意味，表明撒督子孙属于更大的利未宗族。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见汉语音译，保留专名性质，而不以称号替代。
- source_word: לְשָׁרְתוֹ
  choice: 事奉他
  rationale: שרת 在祭司语境中表示在神面前供职；“事奉”是现代汉语中庄重而易懂的宗教用语。
theological_decisions:
- issue: 撒督子孙在利未支派中的特定祭司职责
  choice: 将他们表述为利未子孙中的一个特定群体，承担亲近雅威并看守祭坛的职责。
  alternative: 把本句宽泛地理解为所有利未人都无差别地承担该职责。
  rationale: 原文“撒督的子孙……利未子孙中”明确呈现较大群体中的特定家系；译文保留这一限定，但不引申出经文没有说明的后续教义。
- issue: “亲近雅威”的礼仪含义
  choice: 保留“亲近”，使其既可表达来到神面前，也带有祭司履职的礼仪色彩。
  alternative: 明确改写为“到雅威面前献祭”。
  rationale: 原文未在此动词中直接说明具体行动是献祭；不应以较窄的礼仪行为消除其语义张力。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“负责看守”传达受托职责；“亲近雅威、事奉他”保留祭司礼仪语言，不作过度解释。
