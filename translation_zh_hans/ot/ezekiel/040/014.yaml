  yaml_path: translation/ot/ezekiel/040/014.yaml
  text: And he made the jambs sixty cubits, and to the jamb of the court the gate extended all around.
translation:
  language: zh_hans
  text: 他又造了门柱，六十肘；门楼四周都延到院子的门柱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节的希伯来文较难理解。“六十肘”未说明量度方向；通常理解为门柱的高度。后半句直译近于“门楼四周到院子的门柱”；“院子的门柱”在原文为单数，其与门楼的具体关系也可理解为“院子的门柱环绕着门楼”。
    reason: 说明原文未明说测量方向，并保留后半句的单数形式、句法关系及建筑所指的不确定性。
lexical_decisions:
- source_word: אֵילִים / אֵיל
  choice: 门柱
  rationale: 在圣殿建筑语境中指门口两侧的柱状构件，可译为门柱或壁柱；此处前后分别用复数和单数，中文按语境自然表达。
- source_word: שִׁשִּׁים אַמָּה
  choice: 六十肘高
  rationale: 原文只说“六十肘”，未明说测量方向；结合建筑构件通常理解为高度，但以脚注说明“高”为补足。
- source_word: הַשַּׁעַר
  choice: 门楼
  rationale: 此章所描写的是有门洞、门柱和门房的整体门楼结构，译作“门楼”比单纯的“门”更符合建筑语境。
- source_word: סָבִיב סָבִיב
  choice: 四周
  rationale: 希伯来语重复表示环绕各处，现代汉语以“四周”自然传达。
theological_decisions:
- issue: 本节后半句的句法关系不明
  choice: 门楼四周延伸到院子的门柱
  alternative: 院子的门柱环绕着门楼／门楼周围直到院子的门柱
  rationale: 希伯来文本极为简略，且介词与名词之间的关系存在歧义；正文尽量保留“到院子的门柱”及“四周”两个要素，不据特定建筑复原方案强行确定其结构。
translation_notes:
  register: 采用现代、庄重而易懂的建筑用语；正文保持简洁，借脚注交代原文的不确定性，避免以某一种圣殿建筑复原方案消除歧义。
