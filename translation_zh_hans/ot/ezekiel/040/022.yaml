base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/022.yaml
  text: Its windows[a], its porch, and its palm-tree decorations had the same measurements as the gate that faced east. People would go up to it by seven steps[c][b], and its porch was in front of them.
translation:
  language: zh_hans
  text: 它的窗户、门廊和棕榈树装饰，其尺寸与那座朝东的门相同。人经由七级台阶上去[a]；门廊就在他们前面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用复数动词，直译为“他们上去”；这里也可理解为无定主语，即“人上去”。
    reason: lexical_alternative
  - marker: b
    text: “他们”所指的对象在原文中并不完全明确，也可能与前述台阶或前来的人有关。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְחַלּוֹנוֹ
  choice: 它的窗户
  rationale: חַלּוֹן 指窗户或窗洞；此处在建筑描述中用集合意义的“窗户”自然清楚。
- source_word: וְאֵלַמּוֹ / וְאֵילַמּוֹ
  choice: 门廊
  rationale: אֵילָם/אוּלָם 指入口处向外伸出的建筑空间；“门廊”符合现代汉语建筑用语，并在两处保持一致。
- source_word: וְתִמָּרוֹ
  choice: 棕榈树装饰
  rationale: 在本章建筑语境中，תִּמָּרָה 更可能指棕榈树形的雕饰或图案，而非实际栽种的树木。
- source_word: כְּמִדַּת
  choice: 其尺寸与……相同
  rationale: 介词 כ 与 מִדָּה 表示尺寸上的一致；此译准确而符合现代汉语表达。
- source_word: הַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: 那座朝东的门
  rationale: פָּנָיו ... דֶּרֶךְ הַקָּדִים 是表示朝向的说法，简洁译作“朝东”。
- source_word: וּבְמַעֲלוֹת שֶׁבַע יַעֲלוּ בוֹ
  choice: 人要登上七级台阶才到那里
  rationale: 第三人称阳性复数动词可作无定主语的泛指表达，故译作“人要”；ב 表示登临所经的台阶。
- source_word: לִפְנֵיהֶם
  choice: 就在他们前面
  rationale: לִפְנֵי 表示“在……前面”；保留复数代词的形式，也保留其所指对象在希伯来文中的压缩与轻微含混。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“门廊”避免过度技术化；“棕榈树装饰”明确建筑装饰语境。正文保留末句代词所指的含混，并以脚注说明。
