  text: And hooks[a], a handbreadth long, were fastened all around inside the house, and on the tables was the flesh of the offering.
translation:
  language: zh_hans
  text: 殿内四周都固定着一掌长的钩子[a]；桌上放着供物的肉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“钩子”的希伯来词词义不确定，也可能指“凸缘”或宰杀祭牲区域内的另一种装置。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁפַתַּיִם
  choice: 钩子
  rationale: 此词罕见且词义不确定。在宰杀祭牲、摆放祭肉的语境中，译作“钩子”较为连贯，但其他器具或凸缘之义保留在脚注中。
- source_word: טֹפַח אֶחָד
  choice: 一掌长
  rationale: טֹפַח 是以手掌宽度为准的小型长度单位；“一掌长”既具体又符合现代汉语表达。
- source_word: מוּכָנִים
  choice: 固定着
  rationale: 该词在此表示器物被安置稳固；与“钩子”搭配时，“固定着”比泛指“预备好”更贴合语境。
- source_word: בַּבַּיִת סָבִיב סָבִיב
  choice: 殿内四周都
  rationale: בַּיִת 在此指圣殿建筑或其中的房屋空间；叠用的 סָבִיב 强调周围各处，故译为“殿内四周都”。
- source_word: וְאֶל הַשֻּׁלְחָנוֹת
  choice: 桌上
  rationale: אֶל 通常表示“向、到”，但在此省略而紧凑的描述中表达与桌子的空间关系；结合后面的名词句，译作“桌上”最为通顺。
- source_word: בְּשַׂר הַקָּרְבָן
  choice: 供物的肉
  rationale: בְּשַׂר 指肉，קָרְבָן 指献上的供物；译文保留祭祀语境，同时避免加入原文未明确指定的祭类。
