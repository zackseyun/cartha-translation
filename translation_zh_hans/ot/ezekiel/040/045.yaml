base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/045.yaml
  text: 'Then he spoke to me: “This chamber[a], whose front faces south, is for the priests who keep charge of the temple.”'
translation:
  language: zh_hans
  text: 他对我说：“这间屋子朝南，是给那些负责看守圣殿的祭司用的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָי
  choice: 他对我说
  rationale: 该叙事形式推进情节并引出直接引语；现代汉语用“他对我说”自然、准确，无须机械译出连接词。
- source_word: זֹה הַלִּשְׁכָּה
  choice: 这间屋子
  rationale: לִשְׁכָּה在圣殿建筑语境中指附属房间；“屋子”比“密室”准确，也比“房间”略具建筑实体感。
- source_word: אֲשֶׁר פָּנֶיהָ דֶּרֶךְ הַדָּרוֹם
  choice: 朝南
  rationale: 原文以“它的正面”为具体空间表达；汉语建筑方位通常简洁说“朝南”，已自然包含正面朝向之意。
- source_word: לַכֹּהֲנִים
  choice: 是给……祭司用的
  rationale: 介词ל־表示用途或分配；此译法不把指定使用过度解释为所有权。
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: 负责看守
  rationale: 同源词组合表示履行受托职责；“负责看守”既保留职责含义，也符合现代汉语。
- source_word: הַבָּיִת
  choice: 圣殿
  rationale: בַּיִת字面可作“殿”或“房屋”，但在以西结的圣殿异象中明确指圣殿建筑，译为“圣殿”可清楚传达语境所指。
theological_decisions:
- issue: הַבָּיִת在圣殿异象中的所指
  choice: 圣殿
  alternative: 殿／房屋
  rationale: 上下文明确是圣殿建筑群；译为“圣殿”澄清所指而不增添宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“这间屋子朝南”符合汉语建筑描述习惯；“负责看守圣殿”保留祭司受托履职的含义。
