  yaml_path: translation/ot/ezekiel/040/009.yaml
  text: 'Then he measured the portico of the gate: eight cubits[a], and its side pillars two cubits[b]; and the portico of the gate was toward the temple.'
translation:
  language: zh_hans
  text: 他又量门廊：八肘；两旁的柱子[a]：二肘。门廊朝向圣殿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个建筑术语也可译作“门框”、“壁柱”或“门柱”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“那房子”；在这个圣殿异象中，指圣殿建筑本身。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָד
  choice: 他又量
  rationale: 该叙事形式承接前文，表示接下来的测量动作；“又”自然体现连续推进。
- source_word: אֻלָם הַשַּׁעַר
  choice: 门的廊子
  rationale: אֻלָם指门内相连的门廊、前厅一类建筑空间；“廊子”通俗而不失庄重，也能与本章的建筑语境相合。
- source_word: שְׁמֹנֶה אַמּוֹת
  choice: 宽八肘
  rationale: 保留古代长度单位“肘”；按建筑测量语境补出“宽”，使汉语完整自然。
- source_word: וְאֵילוֹ
  choice: 两旁的柱子
  rationale: אֵיל在此是门道旁突出的支撑或边柱，确切形制不能确定；正文采用易懂的“两旁的柱子”，并在脚注保留其他可能。
- source_word: שְׁתַּיִם אַמּוֹת
  choice: 各宽二肘
  rationale: 阴性双数与前面的两侧结构相配；“各”明确表示两边柱体的尺寸，符合此处建筑描述。
- source_word: מֵהַבָּיִת
  choice: 朝向殿宇
  rationale: 在异象中的空间描述里，该短语表示门廊位于朝圣殿建筑的一侧或朝向圣殿；“朝向殿宇”保留方向关系，并避免误解为普通住宅。
