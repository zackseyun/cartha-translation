lexical_decisions:
- source_word: אֵלַמּוֹת
  choice: 门廊
  rationale: 该复数建筑术语在圣殿与门楼语境中指门廊、前廊一类的结构；“门廊”自然易懂，也符合本段建筑描写。
- source_word: סָבִיב סָבִיב
  choice: 四周都有，四周都有
  rationale: 保留希伯来语的重复，以传达其强调和周遍意味，而不压缩为单一的“四周”。
- source_word: אֹרֶךְ
  choice: 长
  rationale: 与尺寸数字组合为现代汉语自然的“长二十五肘”。
- source_word: חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: 二十五肘
  rationale: 按现代汉语数词顺序表达，并保留古代长度单位“肘”。
- source_word: רֹחַב
  choice: 宽
  rationale: 与“长”平行，用现代汉语尺寸表达“宽五肘”。
- source_word: חָמֵשׁ אַמּוֹת
  choice: 五肘
  rationale: 直接表达宽度，并保留原文的古代长度单位。
