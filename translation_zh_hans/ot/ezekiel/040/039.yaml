  text: וּ/בְ/אֻלָ֣ם הַ/שַּׁ֗עַר שְׁנַ֤יִם שֻׁלְחָנוֹת֙ מִ/פּ֔וֹ וּ/שְׁנַ֥יִם שֻׁלְחָנ֖וֹת מִ/פֹּ֑ה לִ/שְׁח֤וֹט אֲלֵי/הֶם֙ הָ/עוֹלָ֔ה וְ/הַ/חַטָּ֖את וְ/הָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/039.yaml
  text: And in the portico of the gate were two tables on this side and two tables on that side[a], on which they slaughtered the burnt offering, the sin offering[b], and the guilt offering.
translation:
  language: zh_hans
  text: 门廊里，两边各有两张桌子[a]，用来宰杀燔祭牲、赎罪祭牲[b]和赎愆祭牲[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文以重复的空间指示语描写两侧各有两张桌子。
    reason: 准确说明原文的对称空间表达，避免将两个同形空间指示语表述为不同词语的逐字直译。
  - marker: b
    text: “赎罪祭”也可译作“洁净祭”；这个希伯来词可指与罪或不洁得洁净有关的祭。
    reason: 保留חַטָּאת在祭祀语境中的词义幅度。
  - marker: c
    text: “赎愆祭”也可译作“赔偿祭”。
    reason: 保留אָשָׁם所含的赔偿、补偿意味。
lexical_decisions:
- source_word: וּבְאֻלָם הַשַּׁעַר
  choice: 门廊里
  rationale: אֻלָם指门楼前部的廊厅或前厅；结合所属关系，现代汉语用“门廊”即可自然表达“门的廊厅”，并保留建筑语境。
- source_word: שְׁנַיִם שֻׁלְחָנוֹת ... וּשְׁנַיִם שֻׁלְחָנוֹת מִפּוֹ ... מִפֹּה
  choice: 两边各有两张桌子
  rationale: 原文重复“两张桌子”，并用מִפּוֹ…מִפֹּה标示相对两侧；“两边各有两张”简明保留对称布局和数量。
- source_word: לִשְׁחֹט אֲלֵיהֶם
  choice: 用来宰杀
  rationale: לִשְׁחֹט是不定式，表达这些桌子的用途；אֲלֵיהֶם字面为“在它们上面”。汉语以“用来宰杀”自然呈现用途，所指仍是前述桌子。
- source_word: הָעוֹלָה
  choice: 燔祭牲
  rationale: עוֹלָה是全部焚烧献上的祭类；“燔祭”是准确且通行的名称，加“牲”明确此处是在桌上宰杀的祭牲。
- source_word: הַחַטָּאת
  choice: 赎罪祭牲
  rationale: חַטָּאת在祭祀语境中指与罪及洁净相关的祭；“赎罪祭”通行且易懂，而洁净层面的可能含义以脚注保留。
- source_word: הָאָשָׁם
  choice: 赎愆祭牲
  rationale: אָשָׁם指因罪责、亏欠而献的祭，常含补偿意味；“赎愆祭”是传统而明确的祭类名称，补偿含义以脚注说明。
theological_decisions:
- issue: 祭祀术语的译法不应预先消解其罪责、洁净与补偿层面的张力
  choice: 正文采用“燔祭牲、赎罪祭牲、赎愆祭牲”
  alternative: “全烧祭牲、洁净祭牲、赔偿祭牲”
  rationale: 正文采用中文圣经语境中较为通行、可辨识的祭类名称，不引入后来的教义阐释；חַטָּאת的洁净意味和אָשָׁם的补偿意味则以脚注保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“两边各有”适合建筑测绘语境；三个祭名后加“牲”，使“宰杀”的直接宾语在汉语中清楚，避免把抽象祭礼本身说成被宰杀。所有脚注标记均置于正文相应位置。
