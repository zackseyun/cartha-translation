  yaml_path: translation/ot/ezekiel/040/028.yaml
  text: Then he brought me into the inner court by way of the south gate[b][a], and he measured the south gate according to these measurements.
translation:
  language: zh_hans
  text: 他又领我经由南门[a]进入内院，并按这些尺寸量了南门[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从南门进入内院。”希伯来语介词可表示以这门为进入的路径。
    reason: lexical_alternative
  - marker: b
    text: 意思是：这门的尺寸与先前所述的相同。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: 他又领我
  rationale: 使役形在此表示“带领、领入”；“又”自然承接异象中连续的行动。
- source_word: חָצֵר הַפְּנִימִי
  choice: 内院
  rationale: 采用圣殿建筑语境中简明而通行的称呼。
- source_word: בְּשַׁעַר הַדָּרוֹם
  choice: 从南门进入
  rationale: 介词 בְּ־ 在此最自然地表示进入内院所经由的门；正文明确表达路线，脚注保留较贴近形式的译法。
- source_word: וַיָּמָד
  choice: 并……量了
  rationale: 保留 מדד“量、测量”的明确动作，并用“并”衔接后续事件。
- source_word: אֶת הַשַּׁעַר הַדָּרוֹם
  choice: 南门
  rationale: 作为测量动作的直接宾语，指刚刚提到的同一座南门。
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: 照先前那些尺寸
  rationale: כְּ־ 表示对应或相同；“先前”依据近文所述尺寸，使中文指代清楚，同时由脚注说明其含义。
