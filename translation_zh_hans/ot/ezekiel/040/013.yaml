base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/013.yaml
  text: 'Then he measured the gateway from the roof of one guardroom to the roof of the other: twenty-five cubits wide[b][a], doorway opposite doorway.'
translation:
  language: zh_hans
  text: 随后，他量了门楼：从一间卫房[a]的房顶到另一间卫房的房顶，宽二十五肘；门口与门口相对[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卫房”也可译作“侧室”。原文这一短语直译为“从房间的房顶到它的房顶”；这里理解为门楼两侧彼此对应的房间。
    reason: lexical_alternative
  - marker: b
    text: 直译为“门口对着门口”，指门楼两侧的入口彼此相对。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: 随后，他量了
  rationale: 叙事性连续形式推进动作；“随后”自然表达先后次序，同时不增加因果含义。
- source_word: הַשַּׁעַר
  choice: 门楼
  rationale: 本章所指是包含房间、门口和廊道的整体门构筑物，并非单指门扇；“门楼”符合本段建筑语境。
- source_word: מִגַּג הַתָּא לְגַגּוֹ
  choice: 从一间卫房的房顶到另一间卫房的房顶
  rationale: 原文后半直译为“到它的房顶”，所量的宽度和下文两门口相对的说明表明是横跨门楼、由一侧对应房间的房顶量到另一侧；译文补出“另一间”以使空间关系清楚，但在脚注保留原文形式。
- source_word: רֹחַב
  choice: 宽
  rationale: 该名词说明所量的是宽度；汉语用“宽二十五肘”简洁自然。
- source_word: עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: 二十五肘
  rationale: 采用现代汉语数词形式，并保留古代长度单位“肘”。
- source_word: פֶּתַח נֶגֶד פָּתַח
  choice: 门口与门口相对
  rationale: 保留原文名词重复和彼此正对的建筑对称关系；“门口”既可指开口，也可指入口。
