  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: zh_hans
  text: 它的门廊[b]朝向外院；它的门柱上，这边和那边都有棕榈树[a]；有八级台阶通上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“棕榈树”在建筑语境中可能指棕榈树形的雕刻或装饰图案，而不是实际栽种的树。
    reason: lexical_alternative
  - marker: b
    text: “门廊”或译“前廊、门厅”。原文这一建筑术语的具体构件存在解释上的不确定性；后句同源词在此按语境译为“门柱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵילָו / אֵילָיו
  choice: 它的门柱
  rationale: 该词在本节后半句再次出现，并与棕榈树相连；结合以西结异象中的门楼建筑语境，译作承载或装饰门口的“门柱”较为连贯。希伯来语形式及相近建筑术语之间存在解释空间，因此另以脚注保留“门廊”的可能。
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: 朝向外院
  rationale: 介词ל在这里表示建筑构件的方向或所在一侧；“朝向”符合现代汉语建筑描写，也不额外规定其精确位置。
- source_word: תִמֹרִים
  choice: 棕榈树
  rationale: 原词明确是复数“棕榈树”。在建筑语境中很可能指雕刻或装饰图案，但正文保留原文的具体名词，不把隐含意义直接写死。
- source_word: אֶל אֵילָו
  choice: 门柱……都有
  rationale: אֶל在此表示棕榈树位于或附着于门柱上。汉语用处所结构自然表达，具体是雕刻、浮饰还是其他附着方式则不在正文中强行限定。
- source_word: מִפּוֹ וּמִפּוֹ
  choice: 这边和那边
  rationale: 保留希伯来语对称而重复的表达，说明两侧都有相应装饰。
- source_word: שְׁמֹנֶה מַעֲלוֹת מַעֲלָו
  choice: 登上去的台阶有八级
  rationale: מַעֲלוֹת指向上的台阶，末词表达通往其上的上升关系；此译法清楚呈现八级台阶通向该门楼建筑。
