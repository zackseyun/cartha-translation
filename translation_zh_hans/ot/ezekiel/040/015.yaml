  text: And from the front of the outer gateway to the front of the vestibule of the inner gate was fifty cubits[a][b][c].
translation:
  language: zh_hans
  text: 从外门的前面到内门门廊的前面，共五十肘[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外门”：原文此处用词罕见，含义不易确定；许多解释者根据上下文的测量关系理解为外门。
    reason: textual_variant
  - marker: b
    text: “门廊”也可译作“前廊”或“廊厅”。
    reason: lexical_alternative
  - marker: c
    text: 本章的“门”常指包括门房、廊子等部分的整座门楼建筑，而不只是门扇。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 从
  rationale: 在建筑测量语境中，此处介词短语表示距离的起点；汉语用“从”最自然。句首连接词不必机械译出，避免生硬。
- source_word: פְּנֵי
  choice: 前面
  rationale: פָּנִים在建筑空间语境中指正面或前侧，译为“前面”清楚自然。
- source_word: הַשַּׁעַר
  choice: 门
  rationale: 本章中的词可指整个门楼建筑群；正文采用简洁、符合汉语建筑叙述习惯的“门”，并以脚注说明其范围。
- source_word: היאתון
  choice: 外
  rationale: 原词形式罕见且经文有难处；依据上下文的测量次序，正文采用“外”，但在脚注保留文本上的不确定性。
- source_word: לִפְנֵי
  choice: 到……的前面
  rationale: 该短语标明测量终点，以“到……的前面”准确呈现空间关系。
- source_word: אֻלָם
  choice: 门廊
  rationale: 该词指门前有顶的廊厅或入口空间；“门廊”在现代汉语中自然明确，也与门楼建筑语境相称。
- source_word: הַשַּׁעַר הַפְּנִימִי
  choice: 内门
  rationale: 直译空间方位关系，表达简洁，并与“外门”形成清楚对应。
- source_word: חֲמִשִּׁים אַמָּה
  choice: 五十肘
  rationale: “肘”是圣经古代长度单位的通行译法，适合保留原有度量体系。
