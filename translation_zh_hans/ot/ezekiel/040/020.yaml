  yaml_path: translation/ot/ezekiel/040/020.yaml
  text: As for the gate whose front faced north toward the outer court[a], he measured its length and its width.
translation:
  language: zh_hans
  text: 至于外院那座正面朝北[a]的门，他量了它的长和宽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它的面朝向北方”。
    reason: 说明建筑用语פָּנָיו的字面表达，并保留原文以“面”描述朝向的形象。
lexical_decisions:
- source_word: וְהַשַּׁעַר
  choice: 至于……门
  rationale: 连接词与定冠词名词在连续的建筑描述中引出下一项；“至于”自然体现话题转换，同时保留特指意味。
- source_word: אֲשֶׁר פָּנָיו
  choice: 那座正面……的
  rationale: פָּנִים本义为“脸、面”，用于建筑物时译作“正面”自然且准确；关系从句处理为现代汉语定语结构。
- source_word: דֶּרֶךְ הַצָּפוֹן
  choice: 朝北
  rationale: דֶּרֶךְ与方位词连用表示朝向；“朝北”简洁地表达其方向意义。
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: 外院那座
  rationale: 此处לְ表示该门与外院的空间或归属关系；结合圣殿建筑语境，用“外院那座”自然说明这是外院的门，同时不另加原文没有的细节。
- source_word: מָדַד
  choice: 他量了
  rationale: 动词表示测量；主语沿用上下文中执行测量的人，汉语补出“他”以使句意清楚。
- source_word: אָרְכּוֹ וְרָחְבּוֹ
  choice: 它的长和宽
  rationale: 两个带第三人称单数后缀的建筑尺寸词分别表示该门的长度和宽度；“长和宽”是现代汉语中自然明确的说法。
