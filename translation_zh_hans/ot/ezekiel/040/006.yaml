base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/006.yaml
  text: 'Then he came to the gate that faced east[a], and he went up its steps and measured the threshold of the gate: one reed wide. And the other threshold was one reed wide.'
translation:
  language: zh_hans
  text: 他来到朝东的门，登上门的台阶，量了门槛，宽一竿；另一个门槛[a]也宽一竿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个门槛。”希伯来原文作“一个门槛”，但按上下文，这很可能是指门另一侧相对应的门槛。
    reason: 词义与上下文所指存在可保留的翻译选择。
lexical_decisions:
- source_word: שַׁעַר
  choice: 门
  rationale: 此处指异象中正在测量的门及其入口建筑；“门”是现代汉语中自然、简明的建筑用语，也能由上下文涵盖整个门楼结构。
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִימָה
  choice: 朝东的
  rationale: 原文直述门的正面朝向东方；译作“朝东的”简洁自然，并准确保留方位。
- source_word: במעלותיו
  choice: 门的台阶
  rationale: 复数名词在此指通往门的阶梯；补出“门的”可在汉语中清楚交代所属关系，避免代词指向含混。
- source_word: סַף הַשַּׁעַר
  choice: 门槛
  rationale: סַף 指门口的门槛或槛石；“门槛”是现代汉语最通行且符合建筑语境的表达。
- source_word: קָנֶה אֶחָד רֹחַב
  choice: 宽一竿
  rationale: קָנֶה 是本段使用的量竿，也作为长度单位；“宽一竿”简洁保留原有度量单位和宽度概念。
- source_word: וְאֵת סַף אֶחָד
  choice: 另一个门槛
  rationale: אֶחָד 字面为“一个”，但在此成对建筑构件的描述中很可能指相对应的另一个门槛；正文采用自然汉语，并以脚注保留字面可能性。
- source_word: וַיָּבֹא ... וַיַּעַל ... וַיָּמָד
  choice: 他来到……登上……量了
  rationale: 连续叙事动词表达依次发生的动作；汉语用顺承排列即可自然呈现叙事进展。
theological_decisions: []
