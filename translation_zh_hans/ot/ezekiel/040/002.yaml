  text: בְּ/מַרְא֣וֹת אֱלֹהִ֔ים הֱבִיאַ֖/נִי אֶל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יְנִיחֵ֗/נִי אֶל הַ֤ר גָּבֹ֨הַּ֙ מְאֹ֔ד וְ/עָלָ֥י/ו כְּ/מִבְנֵה עִ֖יר מִ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/002.yaml
  text: In visions of God he brought me into the land of Israel and set me down on a very high mountain[a]; on it, to the south[b], was something like the structure of a city.
translation:
  language: zh_hans
  text: 在上帝的异象中，他把我带到以色列地，把我安置在一座极高的山上[a]；山上南边[b]有一处仿佛一座城的建筑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在上帝的异象中”也可译作“在神圣的异象中”或“在从上帝而来的异象中”。
    reason: lexical_alternative
  - marker: b
    text: “南边”也可译作“朝向南方”；希伯来文在此可能表示南侧的位置或南向的方位。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: 在上帝的异象中
  rationale: 保留原文“异象”复数的集合意义及“上帝”的属格表达；中文用“在……中”自然呈现先知经历异象的情境，也不排除“从上帝而来的异象”或“神圣的异象”之意。
- source_word: הֱבִיאַנִי
  choice: 他把我带到
  rationale: 使役形在此通常表示“带来、带到”。主语在希伯来文中未明说，译作“他”保留原文的含蓄，由上下文指向上帝。
- source_word: אֶל אֶרֶץ יִשְׂרָאֵל
  choice: 到以色列地
  rationale: אֶל 表示移动的目标；现代汉语“带到”已清楚表达进入目的地，无须增添原文没有的说明。
- source_word: וַיְנִיחֵנִי
  choice: 把我安置
  rationale: נוח 的使役形可指放置、安顿；“安置”适合异象中被带到并置于山上的场景，又避免误译成单纯“使我休息”。
- source_word: אֶל הַר גָּבֹהַּ מְאֹד
  choice: 在一座极高的山上
  rationale: 与“安置”搭配时，中文以“在……山上”自然表达落点；“极高”准确传达 גָּבֹהַּ מְאֹד。
- source_word: וְעָלָיו
  choice: 山上
  rationale: 明确回指前述的山；中文重复“山上”比直译“在它上面”更自然清楚。
- source_word: כְּמִבְנֵה עִיר
  choice: 有一片建筑，仿佛一座城
  rationale: מִבְנֶה 指建筑物、建筑群或建筑形态，כְּ 表示近似。“一片建筑，仿佛一座城”既保留所见并非直接断定为城市的谨慎语气，也符合现代汉语视觉描写。
- source_word: מִנֶּגֶב
  choice: 朝南之处
  rationale: 该短语可能表示南边的位置或朝南的方位；正文采用兼具位置与朝向意味的表达，并以脚注保留歧义。
theological_decisions:
- issue: 异象中施行带领与安置者的隐含主语
  choice: 译作“他”，不在正文中明确补作“上帝”
  alternative: “上帝把我带到……并把我安置……”
  rationale: 希伯来文动词仅以第三人称阳性单数标示主语，并未在本节明说其名。译作“他”保留原文简约与上下文所形成的神圣主体指向，避免无必要地补明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“以色列地”沿用圣经地理称谓；“一片建筑，仿佛一座城”力求让普通读者容易理解，同时保留先知异象描述中的比较性与不确定性。
