source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלַ֜/י הָ/אִ֗ישׁ בֶּן אָדָ֡ם רְאֵ֣ה בְ/עֵינֶי/ךָ֩ וּ/בְ/אָזְנֶ֨י/ךָ שְּׁמָ֜ע וְ/שִׂ֣ים לִבְּ/ךָ֗ לְ/כֹ֤ל אֲשֶׁר אֲנִי֙ מַרְאֶ֣ה אוֹתָ֔/ךְ כִּ֛י לְמַ֥עַן הַרְאוֹתְ/כָ֖ה הֻבָ֣אתָה הֵ֑נָּה הַגֵּ֛ד אֶת כָּל אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/004.yaml
  text: And the man said to me[a], “Son of man, see with your eyes, and hear with your ears, and set your heart on all that I show you, for you were brought here so that I might show you these things. Declare to the house of Israel all that you see.”
translation:
  language: zh_hans
  text: 那人对我说：“人子啊[a]，你要用眼看，用耳听，并要把我向你展示的一切放在心上；因为你被带到这里来，正是为要向你展示这些。你所看见的一切，都要告诉以色列家。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”也可按其语义理解为“人”或“必死的人”；这是《以西结书》中对先知惯用的称呼。
    reason: 说明希伯来语固定称呼的语义范围，避免读者在本处自动将其理解为专有头衔。
lexical_decisions:
- source_word: הָאִישׁ
  choice: 那人
  rationale: 指向上一节已经出现的男性形象；“那人”既自然，也保留定指关系。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中对先知惯用的称呼。保留固定表达及全书的文学连贯性，同时用脚注说明其普通人、必死之人的语义。
- source_word: רְאֵה בְעֵינֶיךָ וּבְאָזְנֶיךָ שְּׁמָע
  choice: 你要用眼看，用耳听
  rationale: 保留原文“眼—看、耳—听”的平行结构和强调语气，现代汉语也清楚自然。
- source_word: וְשִׂים לִבְּךָ
  choice: 放在心上
  rationale: 原文直译为“把你的心放在……上”；“放在心上”保留心的意象，并自然表达专心留意、牢记之意。
- source_word: לְכֹל אֲשֶׁר אֲנִי מַרְאֶה אוֹתָךְ
  choice: 我所指示你的一切
  rationale: ראה的使役式表示“使看见、展示”。“指示”在异象语境中兼顾展示和使其观看的含义。
- source_word: כִּי לְמַעַן הַרְאוֹתְכָה הֻבָאתָה הֵנָּה
  choice: 因为你被带到这里来，正是为了让你看见这些
  rationale: 保留被动形式与目的关系；原文在“使你看见”之后未明说宾语，“这些”自然回指正在展示的全部异象内容。
- source_word: הַגֵּד
  choice: 告诉
  rationale: 该使役命令式意为使人知道、报告。“告诉”在现代汉语中庄重而自然，不会额外强化为公开宣告。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中反复出现的固定群体称谓和文学质感。
- source_word: כָּל אֲשֶׁר אַתָּה רֹאֶה
  choice: 你所看见的一切
  rationale: 直接体现异象内容的总体范围，并与前文“我所指示你的一切”形成呼应。
theological_decisions:
- issue: 《以西结书》中反复出现的称呼 בֶּן אָדָם
  choice: 人子
  alternative: 世人；必死的人
  rationale: 这里是对以西结的先知性称呼，并非在此直接作为基督论头衔使用。“人子”保留全书重复公式及其文学张力，脚注则交代其希伯来语义域。
- issue: 使役式 ראה 的主语含义
  choice: 为了让你看见这些
  alternative: 为了给你看这些
  rationale: 原文动词可表达“使看见、展示”。译文不进一步明确那人自身的身份或异象的神学机制，以免消解经文保留的叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“用眼看，用耳听”的希伯来式平行和“以色列家”的先知书用语；将“放在心上”作为兼顾原文意象与汉语习惯的表达。
