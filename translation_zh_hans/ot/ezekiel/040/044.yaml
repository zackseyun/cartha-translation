base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/044.yaml
  text: And outside the inner gate were chambers for singers in the inner court[a], which were beside the shoulder of the north gate, with their front toward the south; one was beside the shoulder of the east gate[c][b], facing toward the north.
translation:
  language: zh_hans
  text: 内门外，在内院有供歌唱者使用的房间。这些房间在北门的侧旁[a]，正面朝南；另有一间在东门的侧旁[b]，正面朝北。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侧旁”直译为“肩”；希伯来语以“肩”比喻建筑物的侧面。
    reason: lexical_alternative
  - marker: b
    text: 这里也使用“肩”一词，意思是东门的侧面或侧旁。
    reason: lexical_alternative
  - marker: c
    text: 本节的希伯来语句式十分简略，关于房间的分组和布局也可作不同的顺句处理；经文所描述的是内院中靠近北门和东门的歌唱者房间，分别朝南和朝北。
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִחוּצָה לַשַּׁעַר הַפְּנִימִי
  choice: 内门外
  rationale: 保留连接和空间关系；简洁地表达房间位于内门之外，不额外推断具体距离。
- source_word: לִשְׁכוֹת שָׁרִים
  choice: 供歌唱者使用的房间
  rationale: לִשְׁכוֹת 指圣殿建筑群中的房间；שָׁרִים 按马所拉元音是“歌唱者”。加“供……使用”使汉语中的所属或用途关系自然明确，同时不增添礼仪身份。
- source_word: בֶּחָצֵר הַפְּנִימִי
  choice: 在内院
  rationale: חָצֵר 在此是建筑意义上的院落；“内院”符合上下文，也简明自然。
- source_word: אֶל כֶּתֶף שַׁעַר הַצָּפוֹן
  choice: 在北门的侧旁
  rationale: כֶּתֶף 字面为“肩”，用于建筑方位时指侧面或侧旁；正文采用自然现代汉语，脚注保留其形象用法。
- source_word: וּפְנֵיהֶם דֶּרֶךְ הַדָּרוֹם
  choice: 正面朝南
  rationale: פָּנִים 用于建筑时指正面、朝向；译文保留明确的方位信息。
- source_word: אֶחָד אֶל כֶּתֶף שַׁעַר הַקָּדִים
  choice: 另有一间在东门的侧旁
  rationale: אֶחָד 是单数“一个”；汉语补出量词“间”和承接词“另有”，使省略谓语的希伯来语压缩句式清楚可读。
- source_word: פְּנֵי דֶּרֶךְ הַצָּפוֹן
  choice: 正面朝北
  rationale: 与前面的朝南结构形成对应，准确表达第二处房间的朝向。
theological_decisions: []
