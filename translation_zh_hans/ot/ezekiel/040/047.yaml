  text: וַ/יָּ֨מָד אֶת הֶ/חָצֵ֜ר אֹ֣רֶךְ מֵאָ֣ה אַמָּ֗ה וְ/רֹ֛חַב מֵאָ֥ה אַמָּ֖ה מְרֻבָּ֑עַת וְ/הַ/מִּזְבֵּ֖חַ לִ/פְנֵ֥י הַ/בָּֽיִת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/047.yaml
  text: 'Then he measured the court: one hundred cubits long and one hundred cubits wide[a], square[b]; and the altar was before the house.'
translation:
  language: zh_hans
  text: 他量了院子[a]：长一百肘，宽一百肘，呈正方形；祭坛在殿[b]前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “院子”也可译作“院庭”。
    reason: lexical_alternative
  - marker: b
    text: 原文作“房屋”；这里指异象中圣殿的主体建筑。
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּמָד
  choice: 他量了
  rationale: 叙事性连续式推动叙事；汉语用简洁的过去事件陈述即可自然表达其顺序，不必机械添加“然后”或“又”并引入原文未强调的语气。
- source_word: הֶחָצֵר
  choice: 院子
  rationale: חָצֵר指围合的院落或院庭；“院子”是普通现代读者易懂的表达，同时适合本段建筑场景。
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: 长一百肘
  rationale: 按汉语描述尺寸的自然语序表达，并保留古代长度单位“肘”，不作推测性换算。
- source_word: וְרֹחַב מֵאָה אַמָּה
  choice: 宽一百肘
  rationale: 与“长一百肘”形成清楚平行，准确表达宽度。
- source_word: מְרֻבָּעַת
  choice: 呈正方形
  rationale: 该词在这里说明院子的形状；长宽相等，译作“呈正方形”准确而自然。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 这是מִזְבֵּחַ在献祭及圣殿语境中的标准现代汉语译法。
- source_word: לִפְנֵי הַבָּיִת
  choice: 在殿前
  rationale: לִפְנֵי表达空间上的“在……前面”；本异象的建筑语境表明הַבָּיִת指圣殿主体建筑，简洁译作“殿”既保留建筑所指，也避免误解为普通住宅。
theological_decisions:
- issue: הַבָּיִת在圣殿异象中的所指
  choice: 殿
  alternative: 房屋／圣殿
  rationale: 原词通常意为“房屋”，在本段则指异象中的圣殿主体建筑。“殿”保留具体建筑含义；脚注交代原文字面，避免把其含义扩大为整个圣殿区域。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。尺寸表达简洁、对称；保留“肘”这一原有度量单位。“殿前”符合建筑语境，脚注同时保留בַּיִת的字面信息。
