  yaml_path: translation/ot/ezekiel/040/007.yaml
  text: And each guardroom was one reed long and one reed wide[a], and between the guardrooms was five cubits[c][b]. And the threshold of the gate beside the portico of the gate on the inside was one reed.
translation:
  language: zh_hans
  text: 每间守卫室长一竿，宽一竿[a]；守卫室之间相隔五肘。门的门槛，即门廊[b]内侧的那一道[c]，长一竿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守卫室”或译“侧室”或“房间”；希伯来语 תָּא 是以西结圣殿异象中的建筑术语。
    reason: lexical_alternative
  - marker: b
    text: “门廊”或译“廊厅”或“前廊”；希伯来语 אוּלָם 指门口的廊式空间。
    reason: lexical_alternative
  - marker: c
    text: “内侧”所译的希伯来语字面为“从房屋（或殿）那边”；这里可能指门楼靠建筑内部的一侧。
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: הַתָּא
  choice: 守卫室
  rationale: 该词在本段指门楼结构中的小房间；“守卫室”符合城门建筑语境，也便于现代读者理解。其具体用途并非由词形本身完全确定，故以脚注保留“侧室、房间”等可能。
- source_word: קָנֶה אֶחָד
  choice: 一竿
  rationale: קָנֶה 在上下文中是已经界定的长度单位，即量度用的竿；译作“一竿”简洁，并保留异象建筑测量的术语。
- source_word: אֹרֶךְ / רֹחַב
  choice: 长／宽
  rationale: 分别以自然的现代汉语尺寸表达“长度”和“宽度”，并保持原文的平行结构。
- source_word: בֵּין הַתָּאִים
  choice: 守卫室之间相隔
  rationale: 延续 תָּא 的统一译法，并补出汉语中自然的“相隔”，不增加新的尺寸信息。
- source_word: חָמֵשׁ אַמּוֹת
  choice: 五肘
  rationale: אַמָּה 是古代标准长度单位，传统且准确地译作“肘”，不擅自换算为现代单位。
- source_word: סַף הַשַּׁעַר
  choice: 门的门槛
  rationale: סַף 在建筑语境中指入口底部的门槛；保留与“门”的所属关系。
- source_word: מֵאֵצֶל אוּלָם הַשַּׁעַר
  choice: 靠近门廊
  rationale: מֵאֵצֶל 表示空间上的邻近；אוּלָם 指门的廊厅或前廊，译作“门廊”自然而明确。
- source_word: מֵהַבַּיִת
  choice: 朝内侧
  rationale: 字面可理解为“从房屋／殿的一侧”，在门楼测量语境中很可能标示朝向建筑内部的一侧；正文采用自然的空间表达，并用脚注保留字面歧义。
