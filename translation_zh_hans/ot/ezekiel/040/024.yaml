base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/024.yaml
  text: Then he led me by way of the south[a], and behold, there was a gate facing south[b]. He measured its side pillars and its porch according to these measurements.
translation:
  language: zh_hans
  text: 他又领我往南边去。看哪，有一座朝南的门；他按这些尺寸量了它的壁柱[a]和门廊[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “壁柱”也可译作“门框侧柱”。这里的希伯来语建筑术语可能指门两侧的支撑结构。
    reason: lexical_alternative
  - marker: b
    text: “这些尺寸”指前面所述各部分的尺寸；也就是说，这座门的尺寸与先前量过的门相同。
    reason: cross_reference
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  choice: 他又领我……去
  rationale: 使役形表达“使……行走、领去”；“又”承接异象中连续察看的叙事次序。
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: 往南边去
  rationale: 原文直译近于“南边的方向/道路”，此处表示移动方向；采用自然的现代汉语，同时保留空间指向。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留先知异象叙事中提示读者注意眼前景象的语用力量。
- source_word: שַׁעַר דֶּרֶךְ הַדָּרוֹם
  choice: 一座朝南的门
  rationale: 在建筑语境中，这一短语说明门的朝向；“朝南”简明自然。
- source_word: אֵילוֹ
  choice: 门的壁柱
  rationale: אֵיל在本段门楼建筑描写中指门侧的支撑结构；“壁柱”既保留建筑含义，也比生僻的纯技术译名更易懂。
- source_word: וְאֵילַמּוֹ
  choice: 和门廊
  rationale: אֵילָם指门楼的廊厅、前廊或门厅；“门廊”在现代汉语中清楚且符合此建筑语境。
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: 都是照这些尺寸量的
  rationale: 保留原文“按这些尺寸”的指示性和比较意义，不在正文中把“这些”过度明确化。
