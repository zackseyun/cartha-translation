base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/040.yaml
  text: And on the outer side[a], by the ascent to the entrance of the north gate, were two tables; and on the other side, which belonged to the porch of the gate[c][b], were two tables.
translation:
  language: zh_hans
  text: 在外侧[a]、通往北门入口的上行处[b]，有两张桌子；在另一侧，即门廊所在的那一边[c]，也有两张桌子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “侧”原文直译为“肩”；在这里是建筑用语，指侧面或侧边区域。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在上行处”或“在上到北门入口的通道旁”。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“属于门廊的那一边”；原文介词表示这一侧与门廊有关或相邻。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתֵף
  choice: 侧
  rationale: 本义为“肩”，在建筑描写中指侧面或侧边区域；译作“侧”既符合语境，也自然易懂。
- source_word: מִחוּצָה
  choice: 外侧
  rationale: 表示在外面、朝外的一侧；与建筑方位描写相符。
- source_word: לָעוֹלֶה
  choice: 上到……的地方
  rationale: 源自动词“上去”的分词形式，可指上行的人、上去之处或上升通道；正文采用自然的空间表达，同时以脚注保留“上行处”的可能性。
- source_word: פֶּתַח
  choice: 入口
  rationale: 在门的建筑语境中，译作“入口”比“开口”更自然明确。
- source_word: שַׁעַר
  choice: 门
  rationale: 圣殿建筑描写中的常用对应词，简洁且符合现代汉语。
- source_word: הַצָּפוֹנָה
  choice: 北门
  rationale: 表示朝北或北面的门；现代汉语自然表达为“北门”。
- source_word: שְׁנַיִם שֻׁלְחָנוֹת
  choice: 两张桌子
  rationale: 数词与名词的直接对应；在本段预备祭牲的语境中，“桌子”准确自然。
- source_word: הָאַחֶרֶת
  choice: 另一侧
  rationale: 指与前述一侧相对应的另一边。
- source_word: אֲשֶׁר לְאֻלָם הַשַּׁעַר
  choice: 就是靠门廊的那一边
  rationale: 介词לְ所表达的具体空间关系略有弹性；“靠门廊”自然呈现其与门廊相邻或相关的关系，又不作过度限定。
- source_word: אֻלָם
  choice: 门廊
  rationale: 指门内外相连的廊厅或前廊；“门廊”在现代汉语中清楚且适合建筑语境。
