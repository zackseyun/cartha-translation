base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/019.yaml
  text: 'Then he measured the width from the front of the lower gate to the front of the inner court outside: one hundred cubits[b][a], to the east and to the north.'
translation:
  language: zh_hans
  text: 他又从外面量了从下门[a]前面到内院前面的宽度，共一百肘[b]；东面和北面都是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“下门楼”。这里的希伯来语“门”可以指整座门的建筑结构，不仅是门口。
    reason: lexical_alternative
  - marker: b
    text: 意思是：东面和北面的这段距离都为一百肘。
    reason: clarification
lexical_decisions:
- source_word: וַיָּמָד
  choice: 他又量了
  rationale: 未完成式连续形推进异象叙事；“又”自然承接上一项测量，也保留连续动作的意味。
- source_word: רֹחַב
  choice: 宽度
  rationale: 指所测量的横向间距；“宽度”是现代建筑语境中自然、清楚的表达。
- source_word: מִלִּפְנֵי הַשַּׁעַר הַתַּחְתּוֹנָה
  choice: 从下门前面
  rationale: לִפְנֵי在这里表示空间上的起点；“前面”比直译“面前”更符合建筑测量语境。“门”可兼指整座门楼，另以脚注说明。
- source_word: לִפְנֵי הֶחָצֵר הַפְּנִימִי מִחוּץ
  choice: 到内院外面前沿
  rationale: 将לִפְנֵי理解为测量终点处的前沿，מִחוּץ说明该点位于内院外侧；此译法尽量保留原文空间关系，同时避免生硬的“到内院面前、在外面”。
- source_word: מֵאָה אַמָּה
  choice: 一百肘
  rationale: 保留原有古代长度单位和精确数值，不作现代单位换算。
- source_word: הַקָּדִים וְהַצָּפוֹן
  choice: 东面和北面都是这样
  rationale: 原文以简略的方向名词收束，结合上下文表示东、北两面均有同一测量；译文以自然汉语表达，并用脚注交代其所指。
