  text: And there was a barrier of one cubit in front of the side rooms[a], and a barrier of one cubit on the other side[b]; and each side room was six cubits on this side and six cubits on that side.
translation:
  language: zh_hans
  text: 小室[a]前面有一肘宽的分界带；另一边也有一肘宽的分界带[b]。每间小室这边六肘，那边也六肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “小室”也可译作“守卫室”“房间”或“壁龛”；希伯来语 תָּאוֹת 指门楼结构中的小型房室。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文重复使用指示性方位语，字面均近于“从这里”；译文按上下文用“这边、那边”表示相对的两侧。具体空间布局并未完全说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּל
  choice: 界带
  rationale: 此处是建筑测量语境，指小房间前划定边界或起分隔作用的一肘宽地带。“界带”既保留“边界”的基本含义，也不武断地把它具体化为墙或栏杆。
- source_word: לִפְנֵי
  choice: 在……前面
  rationale: 这里表达具体的空间方位，译为“在……前面”自然、明确。
- source_word: הַתָּאוֹת / הַתָּא
  choice: 小房间 / 每个小房间
  rationale: תָּא指门楼结构中的小室，其具体用途未明。“小房间”比“警卫室”更中性；后一个单数按上下文作分配性理解，译作“每个小房间”。
- source_word: אַמָּה אֶחָת / שֵׁשׁ אַמּוֹת
  choice: 一肘 / 六肘
  rationale: 保留古代长度单位，以符合本段反复测量的叙述方式，并避免不确定的现代单位换算。
- source_word: מִפֹּה ... מִפּוֹ
  choice: 另一边……这边……那边
  rationale: 希伯来文反复使用指示方位语，字面近于“从这里”。中文用“这边、那边”呈现两侧对称关系，同时保留原文方位参照的含混性。
