  yaml_path: translation/ot/ezekiel/040/018.yaml
  text: And the pavement was beside the side of the gates[a], corresponding to the length of the gates—the lower pavement.
translation:
  language: zh_hans
  text: 铺石地在各门楼的旁边，与各门楼的长度相对应。[a]这就是下层铺石地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“与各门楼的长度相对。”希伯来语 לְעֻמַּת 可表示空间上的对应，也可表示位于对面。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִצְפָה
  choice: 铺石地
  rationale: 该词指铺设石材的地面；“铺石地”既自然，也符合圣殿建筑异象的语境。
- source_word: אֶל כֶּתֶף
  choice: 沿着……的侧面
  rationale: אֶל 与 כֶּתֶף 结合，在这里描述相邻的空间位置；“沿着……的侧面”能自然表达铺石地与门楼侧边的关系。
- source_word: הַשְּׁעָרִים
  choice: 各门楼
  rationale: 此处复数在异象建筑语境中不只指门扇，而指门及其附属结构；“各门楼”可避免现代汉语读者误解为单纯的门。
- source_word: לְעֻמַּת אֹרֶךְ
  choice: 与……的长度相称
  rationale: לְעֻמַּת 可表达对应、相对或对面的空间关系；正文采用“相称”表达其与门楼长度相对应的建筑关系，同时以脚注保留另一可能。
- source_word: הָרִצְפָה הַתַּחְתּוֹנָה
  choice: 下层铺石地
  rationale: תַּחְתּוֹנָה 表明这片铺石地处于较低层级，并与上下文中的其他区域相区别。
