  text: There was a chamber with its doorway by the gateposts of the gates[a]; there they would rinse the burnt offering.
translation:
  language: zh_hans
  text: 有一间屋子，入口在各门的门柱旁[a]；他们在那里冲洗燔祭牲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 译作“门柱”的希伯来语建筑术语，也可能指“门廊”“凸出的柱子”，或门楼建筑群中类似的结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁכָּה
  choice: 一间屋子
  rationale: 该词指圣殿或门楼建筑群内的房间；“屋子”自然易懂，也保留其建筑空间之义。
- source_word: וּפִתְחָהּ
  choice: 入口
  rationale: פֶּתַח 加阴性单数后缀，指这间屋子的入口；汉语借上下文自然表达所属关系。
- source_word: בְּאֵילִים
  choice: 在各门的门柱旁
  rationale: אֵילִים 是以西结异象中的建筑术语，具体所指存在争议；正文采用清楚易懂的“门柱”，并在脚注保留其他可能。介词 בְּ 在此按位置关系译为“旁”。
- source_word: הַשְּׁעָרִים
  choice: 各门的
  rationale: 保留原文复数，指异象中诸门或门楼结构。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接表达地点副词，回指刚描述的屋子或入口一带。
- source_word: יָדִיחוּ
  choice: 冲洗
  rationale: דוח 的使役词干在这里指祭牲处理中的洗涤；“冲洗”比一般的“洗”更具体。未完成式在异象规制性描述中表达惯常用途，汉语无需另加时态词。
- source_word: הָעֹלָה
  choice: 燔祭牲
  rationale: עֹלָה 是标准祭祀术语“燔祭”；此处作为被冲洗的对象，“燔祭牲”更清楚地指献作燔祭的牲畜。
