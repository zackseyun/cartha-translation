base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/036.yaml
  text: Its guardrooms[a], its side pillars, and its portico, with windows all around[b], had a length of fifty cubits and a width of twenty-five cubits.
translation:
  language: zh_hans
  text: 其门卫房[a]、侧柱[b]和门廊[c]，四围都有窗户。它长五十肘，宽二十五肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门卫房”也可译作“房间”或“小室”；原文并未明说其用途。
    reason: lexical_alternative
  - marker: b
    text: “侧柱”所译的希伯来语是建筑术语，也可理解为“门框”或“壁柱”。
    reason: lexical_alternative
  - marker: c
    text: “门廊”也可译作“前厅”或“廊子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּאָיו
  choice: 其门卫房
  rationale: תָּא在本章城门建筑的语境中指门内的小房间，可能供守卫使用；“门卫房”既交代建筑位置和可能用途，也符合本章的上下文。
- source_word: אֵלָיו
  choice: 侧柱
  rationale: 这是城门建筑的技术性用语，指入口两侧的结构构件；“侧柱”比“壁柱”或“门框”更易为普通读者理解，同时保留建筑含义。
- source_word: אֵלַמּוֹ
  choice: 门廊
  rationale: 该词在圣殿建筑语境中指入口处凸出的廊式结构；“门廊”是自然、清楚的现代汉语表达。
- source_word: וְחַלּוֹנוֹת לוֹ סָבִיב סָבִיב
  choice: 四围都有窗户
  rationale: 译出该结构各面设窗的意思；“四围”体现סָבִיב的重复所表达的环绕、遍及之意。
- source_word: אֹרֶךְ חֲמִשִּׁים אַמָּה
  choice: 它长五十肘
  rationale: 以自然简洁的汉语表达原文的长度公式，并保留古代计量单位“肘”。
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: 宽二十五肘
  rationale: 忠实表达宽度数据，并与前半句形成自然对称。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的建筑叙述。“其”承接上文所述城门；第二句用“它”明确尺寸属于整个门体。保留“肘”而不换算，以免制造虚假的精确度。原文列举式句法在中文中略作顺整，但不消除建筑术语本身的歧义。
