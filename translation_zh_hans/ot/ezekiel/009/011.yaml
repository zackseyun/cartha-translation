base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/011.yaml
  text: And behold[a], the man clothed in linen, who had the writing case at his waist, brought back word, saying, “I have done as you commanded me.”
translation:
  language: zh_hans
  text: 看哪，那身穿细麻衣、腰间带着书写器具盒[a]的人回来禀报说：“你怎样吩咐我，我就怎样做了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书写器具盒”也可译作“墨盒”，指系在腰间、盛放书写用品或墨的器具。
    reason: 词义存在传统译法及器物形态上的表达差异；脚注帮助读者理解古代书写用具。
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留先知叙事中引人注意、使场景顿时鲜明的篇章标记；现代中文虽略庄重，却自然且符合经文语体。
- source_word: הָאִישׁ
  choice: 那……的人
  rationale: 保留阳性单数所指，并以“那”回指上文已经出现的人物。
- source_word: לְבֻשׁ הַבַּדִּים
  choice: 身穿细麻衣
  rationale: 准确表达其衣着；“细麻衣”既符合圣经语境，也不进一步断定此人的身份或性质。
- source_word: הַקֶּסֶת
  choice: 文具盒
  rationale: 此词指盛放书写用品或墨的器具；“文具盒”让现代读者容易理解，同时保留其为随身容器的具体含义。
- source_word: בְּמָתְנָיו
  choice: 腰间带着
  rationale: 以自然现代汉语表达器具位于腰部并随身携带。
- source_word: מֵשִׁיב דָּבָר
  choice: 回来禀报
  rationale: 表达受命者完成任务后回复、报告的含义；“禀报”适合向发令者复命的语境，并保留庄重感。
- source_word: לֵאמֹר
  choice: 说
  rationale: 直接、自然地引出后面的引语。
- source_word: עָשִׂיתִי
  choice: 我……做了
  rationale: 表达已完成的行动，并在复命语境中具有当前关联。
- source_word: כַּאֲשֶׁר צִוִּיתָנִי
  choice: 你怎样吩咐我，我就怎样做了
  rationale: 用自然的对应句式清楚表达完全依照命令行事，未添加“完全”等原文没有的强化词。
theological_decisions:
- issue: 身穿细麻衣者的性质与身份
  choice: 只按经文描述为“那身穿细麻衣……的人”
  alternative: 明确称为天使、祭司性人物或神显人物
  rationale: 本节仅按外貌和职分指称此人，并未明确说明其本体身份；译文不越过希伯来文本作神学判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留先知文本的现场感；“禀报”体现复命关系。脚注标记置于“看哪”之后，与所附词义说明虽不相邻，但依照所给咨询层的标记位置保留。
