  terminology: “细麻衣”恰当保留文本的服饰描述，未擅自界定人物身份；“吩咐我”“做了”准确传达遵命完成的复命公式。对 הַקֶּסֶת 采用“书写器具盒”，脚注保留“墨盒”这一传统译法，但说明其为盛放书写用品或墨的腰间器具。
