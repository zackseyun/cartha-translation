  - severity: low
    issue: “你将烈怒倾倒在……，难道要……”未清楚标出原文不定式结构所表达的时间/伴随背景。
    rationale: בְּשָׁפְכְּךָ可表“当/在……时”或伴随，非单纯并列的未来事件。译为“当你把……倾倒在……时”保留其开放性，并与问句自然衔接。
