  text: וַֽ/יְהִי֙ כְּ/הַכּוֹתָ֔/ם וְ/נֵֽאשֲׁאַ֖ר אָ֑נִי וָ/אֶפְּלָ֨/ה עַל פָּנַ֜/י וָ/אֶזְעַ֗ק וָֽ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/מַשְׁחִ֣ית אַתָּ֗ה אֵ֚ת כָּל שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל בְּ/שָׁפְכְּ/ךָ֥ אֶת חֲמָתְ/ךָ֖ עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/008.yaml
  text: And it happened, while they were striking them down, and I alone was left, that I fell on my face and cried out, and I said, “Ah, Lord GOD, will you destroy all the remnant of Israel as you pour out your wrath on Jerusalem?”
translation:
  language: zh_hans
  text: 他们击杀那些人时，只剩下我一人。我就俯伏在地，呼喊说：“唉！主耶和华啊，当你把烈怒倾倒在耶路撒冷时，难道要毁灭以色列所有的余民吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּהַכּוֹתָם
  choice: 他们击杀众人的时候
  rationale: 介词כְּ与不定式结构表示同时发生的背景；宾语代词在上下文中指遭击杀的人群，汉语用“众人”自然补出。
- source_word: וְנֵאשֲאַר אָנִי
  choice: 只剩下我一人
  rationale: נשׁאר意为“留下、剩下”；代词אָנִי后置带强调意味，因此译出“我一人”。
- source_word: וָאֶפְּלָה עַל־פָּנַי
  choice: 我就俯伏在地
  rationale: 字面为“我伏在脸上”，是俯伏姿态的希伯来表达；按现代汉语惯用语译为“俯伏在地”。
- source_word: אֲהָהּ אֲדֹנָי יְהוִה
  choice: 唉！主耶和华啊
  rationale: 保留哀叹语气；אֲדֹנָי译“主”，神名四字母按中文圣经传统音译为“耶和华”，并避免与“主”重复混同。
- source_word: כָּל־שְׁאֵרִית יִשְׂרָאֵל
  choice: 以色列所有的余民
  rationale: 保留כָּל的全称范围和שְׁאֵרִית“余剩者、余民”的群体含义。
- source_word: בְּשָׁפְכְּךָ אֶת־חֲמָתְךָ
  choice: 你将烈怒倾倒在……
  rationale: 保留“倾倒”这一具体隐喻；חֵמָה在审判语境中译“烈怒”。בְּ加不定式可表达伴随或时间关系，正文用并列背景呈现，不强行限定为单纯时间或因果。
theological_decisions:
- issue: 以西结问句是否断言神必将灭尽余民
  choice: 译作“难道要毁灭……吗？”
  alternative: “你要毁灭……吗？”
  rationale: 疑问词הֲ表明这是先知在惊惧中的恳求性疑问，并非对结果的确定断言；“难道”自然传达其震惊和哀求。
- issue: “余民”的范围
  choice: 保留“以色列所有的余民”
  alternative: “以色列剩下的所有人”
  rationale: “余民”保留该词在先知书中的重要群体概念，但不据此预断这些人的最终命运或属灵身份。
- issue: 倾怒与毁灭之间的语义关系
  choice: 以并列背景“你将烈怒倾倒在……，难道要……”表达
  alternative: “当你把烈怒倾倒在……时”或“因你把烈怒倾倒在……”
  rationale: 希伯来语בְּשָׁפְכְּךָ可有时间或伴随意味；避免将其窄化为明确因果，同时保持自然汉语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“主耶和华”“余民”“倾倒烈怒”等具有文本辨识度的表达；叙述部分适度压缩希伯来语连续连接词，以符合现代汉语节奏，同时保留动作顺序和先知强烈的哀恳语气。
