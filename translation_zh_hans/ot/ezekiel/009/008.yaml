  source_fidelity: 需作小幅修订。“众人”在本节希伯来文中并无明示对应词，原文的宾语由上下文承接；译为“那些人”可保留这一指代而不扩大为不受限定的“所有人”。בְּשָׁפְכְּךָ表达倾倒烈怒时的伴随/时间背景，宜明确保留为“当……时”。其余动作次序、先知独自留下的强调、俯伏与呼喊，以及恳求式问句均忠实。
  naturalness: 修订后采用“他们击杀那些人时”及“当你把烈怒倾倒在耶路撒冷时”，在现代标准汉语中更顺畅，也更清楚呈现原文的时间/伴随关系。
  terminology: “主耶和华”“烈怒”“余民”均庄重、通行，并适合以西结书的审判语境。“余民”保留原文שְׁאֵרִית的群体用语，不额外界定其神学身份。
