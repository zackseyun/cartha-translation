  rationale: 修正“在我耳中”的听觉意义，并以“我听见他……说”作自然、准确的现代汉语表达。命令部分按希伯来语次序保留跟随、穿行和击打，避免“走遍”及“击杀”所带来的不必要语义收窄或扩展。
