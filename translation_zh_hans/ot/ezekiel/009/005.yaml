  text: וּ/לְ/אֵ֨לֶּה֙ אָמַ֣ר בְּ/אָזְנַ֔/י עִבְר֥וּ בָ/עִ֛יר אַחֲרָ֖י/ו וְ/הַכּ֑וּ על תָּחֹ֥ס עיני/כם וְ/אַל תַּחְמֹֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/005.yaml
  text: And to the others he said in my hearing[a], “Pass through the city after him and strike; do not let your eye spare, and do not show pity.”
translation:
  language: zh_hans
  text: 我听见他又对其余的人说[a]：“跟在他后面，穿行这城，击打；你们的眼不可顾惜，也不可怜悯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“在我耳中。”即以西结亲耳听见他说话。
    reason: 保留原文的听觉习语，并说明正文采用自然汉语表达。
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: 又……对其余的人
  rationale: 这里指与前一节身穿细麻衣之人相对的其余行刑者。“其余的人”自然表达上下文中的对比；连接词按汉语叙事习惯译作“又”。
- source_word: אָמַר בְּאָזְנַי
  choice: 当着我的面……说
  rationale: 希伯来语字面为“在我耳中说”，表示以西结亲耳听见。“当着我的面”在现代汉语中自然地传达先知在场并直接听见，注中保留原文意象。
- source_word: עִבְרוּ בָעִיר אַחֲרָיו
  choice: 跟在他后面，走遍城中
  rationale: עִבְרוּ בָעִיר 命令他们穿行全城；אַחֲרָיו 指跟随前述之人。“走遍城中”比生硬的“经过城中”更清楚地表达执行行动的范围。
- source_word: וְהַכּוּ
  choice: 击杀
  rationale: נכה 可指击打或击杀；本章审判与杀戮的语境表明这里是致命行动。“击杀”兼顾动词的击打意象与语境中的死亡结果。
- source_word: עַל תָּחֹס עֵינֵיכֶם
  choice: 你们的眼不可顾惜
  rationale: 保留希伯来语以“眼”表达不予宽免或同情的鲜明习语；“顾惜”在庄重而可懂的现代汉语中能承载此义。
- source_word: וְאַל תַּחְמֹלוּ
  choice: 也不可怜悯
  rationale: חמל 表示怜惜、怜悯。译为“怜悯”既与前句“眼不可顾惜”形成近义递进，又不把两个平行表达完全合并。
theological_decisions:
- issue: 审判命令的严厉性
  choice: 直接译出击杀命令以及禁止顾惜、怜悯的双重命令
  alternative: 以较含蓄的措辞弱化暴力或补入解释来缓和命令
  rationale: 原文刻意呈现严厉而不妥协的审判场景。译文应保留这种神学张力，不以委婉表达削弱，也不添加原文没有的辩护。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“走遍城中击杀”保持命令的急迫与严厉；“眼不可顾惜”有意保留原文习语，并以脚注说明另一处听觉习语。
