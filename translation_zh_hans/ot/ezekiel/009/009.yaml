id: EZK.9.9
reference: Ezekiel 9:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲוֺ֨ן בֵּֽית יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ גָּדוֹל֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַ/תִּמָּלֵ֤א הָ/אָ֨רֶץ֙ דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֣ה מֻטֶּ֑ה כִּ֣י אָמְר֗וּ עָזַ֤ב יְהוָה֙ אֶת הָ/אָ֔רֶץ וְ/אֵ֥ין יְהוָ֖ה רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/009.yaml
  text: Then he said to me[a], “The iniquity of the house of Israel and Judah is exceedingly great, and the land is filled with bloodshed, and the city is full of perversion. For they say, ‘Yahweh has forsaken the land, and Yahweh does not see.’”
translation:
  language: zh_hans
  text: 他对我说：“以色列家和犹大家的罪孽极其深重；遍地都是流血的事，城中充满了颠倒是非的事[a]。因为他们说：‘雅威已经离弃这地，雅威看不见。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“歪曲公正的事”或“不公不义”。这个希伯来词含有偏离、扭曲正道的意思，可能也包括司法不公。
    reason: 说明罕见词 מֻטֶּה 的语义范围，并保留它既可泛指败坏、又可能特指枉法的歧义。
lexical_decisions:
- source_word: עֲוֺן
  choice: 罪孽
  rationale: 此处概括以色列家和犹大家的道德败坏与罪责；“罪孽”既保留伦理意味，也没有误解为罪的刑罚。
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: 以色列家和犹大家
  rationale: 保留“家”这一群体性、盟约性的表达，同时符合中文圣经语体。
- source_word: גָּדוֹל בִּמְאֹד מְאֹד
  choice: 极其深重
  rationale: 两个 מְאֹד 构成强烈加强语气；与“罪孽”搭配时，“极其深重”比直译“非常非常大”更自然而庄重。
- source_word: וַתִּמָּלֵא הָאָרֶץ דָּמִים
  choice: 遍地都是流血的事
  rationale: 复数 דָּמִים 在此指流血暴行或血债，不只是作为物质的血；该译法清楚保留暴力犯罪的含义。
- source_word: מֻטֶּה
  choice: 颠倒是非的事
  rationale: 该词含偏离、扭曲正道之意；此译保留广义的道德与社会败坏，同时可涵盖司法不公。
- source_word: עָזַב
  choice: 已经离弃
  rationale: 完成式表达他们认定雅威已弃置这地；“离弃”保留关系性和神学分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神名，而不以称号替代。
- source_word: רֹאֶה
  choice: 看不见
  rationale: 直接表达他们否认雅威察看并关注地上之事；同时保留原文简洁措辞。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保存其专名性质，避免用称号取代。
- issue: דָּמִים 与 מֻטֶּה 在审判语境中的含义
  choice: 流血的事……颠倒是非的事
  alternative: 血债……不公不义；血腥……歪曲公正
  rationale: 前者指暴力流血，后者指对正道的扭曲，并可能特别涉及司法不公；正文不把后者限定为纯司法术语，以保留原文语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“罪孽极其深重”自然传达强烈程度；“遍地都是流血的事”避免把复数 דָּמִים 误作单纯的物质之血；脚注标记紧随其实际解释的词组，而不置于“对我说”之后。
