  text: וַ/יֹּ֤אמֶר יְהוָה֙ אל/ו עֲבֹר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר בְּ/ת֖וֹךְ יְרֽוּשָׁלִָ֑ם וְ/הִתְוִ֨יתָ תָּ֜ו עַל מִצְח֣וֹת הָ/אֲנָשִׁ֗ים הַ/נֶּֽאֱנָחִים֙ וְ/הַ/נֶּ֣אֱנָקִ֔ים עַ֚ל כָּל הַ/תּ֣וֹעֵב֔וֹת הַֽ/נַּעֲשׂ֖וֹת בְּ/תוֹכָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/004.yaml
  text: And Yahweh said to him[a], “Pass through the midst of the city, through the midst of Jerusalem, and put a mark on the foreheads of the men who sigh and groan over all the abominations being done in her midst.”
translation:
  language: zh_hans
  text: 耶和华对他说：“你要从这城中、从耶路撒冷中穿行，在那些因城中所行的一切可憎之事而叹息、哀号之人的额上作记号[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 taw；这里可能指用希伯来字母 ת 作记号。
    reason: 保留 תָּו 既可泛指“记号”、也可能指字母名称 taw 的词汇可能性。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来对应四字神名 YHWH，而不以“主”替代，从而保留原文使用专名这一点。
- source_word: עֲבֹר
  choice: 走遍
  rationale: 此处命令受话者穿行城中；“走遍”在现代中文中自然，并能表达执行标记任务所需的巡行范围。
- source_word: בְּתוֹךְ ... בְּתוֹךְ
  choice: 城中……耶路撒冷
  rationale: 原文重复“在……当中”形成强调；译文以“走遍城中，走遍耶路撒冷”保留重复与节奏，同时避免生硬的“当中”。
- source_word: וְהִתְוִיתָ תָּו
  choice: 画一个记号
  rationale: 动词与名词同根，指在额上作出辨识标记。“画一个记号”符合中文搭配；תָּו 也可能特指字母 taw，此可能性收入脚注。
- source_word: מִצְחוֹת
  choice: 额上
  rationale: 准确对应复数“额头”，放在介词结构中译为“人额上”更符合现代中文表达。
- source_word: הָאֲנָשִׁים
  choice: 人
  rationale: 原词为阳性复数，在此指耶路撒冷中将受标记者；中文“那些……的人”自然涵盖这群具体人物，不额外限定为成年男性。
- source_word: הַנֶּאֱנָחִים וְהַנֶּאֱנָקִים
  choice: 叹息哀号
  rationale: 保留两个并列分词所表达的低沉叹息与痛苦呼号，不将其概括为较抽象的“悲伤”。
- source_word: עַל כָּל הַתּוֹעֵבוֹת
  choice: 因……一切可憎之事
  rationale: עַל 在此表示悲叹所针对或缘由；“因”最自然地表达这种关系。“可憎之事”保留 תּוֹעֵבוֹת 在先知谴责语境中的强烈道德与宗教意味。
- source_word: הַנַּעֲשׂוֹת
  choice: 所行的
  rationale: 被动分词表示这些事正在城中发生；中文“所行的”简洁自然，并保留行为层面的含义。
- source_word: בְּתוֹכָהּ
  choice: 城中
  rationale: 阴性后缀回指城或耶路撒冷。现代汉语通常不以阴性代词拟人化城市，因此明确译作“城中”，避免指代含混。
theological_decisions:
- issue: תָּו 是否特指希伯来字母 taw 及其象征意义
  choice: 正文按功能译为“一个记号”
  alternative: 译为“一个 taw 字”或“字母 taw”
  rationale: 本节明确的是用于区分人的额上标记，并未解释其形状或赋予后来的象征意义。正文不作超出原文的神学推断，脚注保留字母名称这一词汇可能性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“走遍”的重复以反映希伯来文强调；用“叹息哀号”呈现两个并列的哀痛动作。脚注标记紧接“记号”，与其所释词对应。
