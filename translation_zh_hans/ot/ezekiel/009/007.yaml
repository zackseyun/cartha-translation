  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם טַמְּא֣וּ אֶת הַ/בַּ֗יִת וּ/מַלְא֧וּ אֶת הַ/חֲצֵר֛וֹת חֲלָלִ֖ים צֵ֑אוּ וְ/יָצְא֖וּ וְ/הִכּ֥וּ בָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/007.yaml
  text: And he said to them[a], “Defile the house, and fill the courts with the slain[b]. Go out.” So they went out and struck down people in the city.
translation:
  language: zh_hans
  text: 他对他们说：“要玷污这殿[a]，使院中满了被杀的人[b]。出去！”于是他们出去，在城中击杀人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“那房屋”，在这里指圣殿。
    reason: lexical_alternative
  - marker: b
    text: 或译：“使院中满了尸体。”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַמְּאוּ
  choice: 玷污
  rationale: 该词为皮勒式祈使语气，表示使圣殿在礼仪上成为不洁；“玷污”既自然，又保留这道审判命令的强烈和震撼。
- source_word: הַבַּיִת
  choice: 这殿
  rationale: 原文直译为“这房屋”，但在本章异象中明确指圣殿；中文以“这殿”自然传达所指，同时脚注保留字面形式。
- source_word: הַחֲצֵרוֹת
  choice: 各院子
  rationale: 指圣殿建筑群的院落。复数用“各院子”表达，符合现代中文，也不额外限定内院或外院。
- source_word: חֲלָלִים
  choice: 被杀的人
  rationale: 该名词指遭击杀者；此译保留受杀的含义，并与后文的击杀行动形成呼应。
- source_word: צֵאוּ
  choice: 出去吧
  rationale: 直接表达复数祈使语气；句末“吧”使现代汉语命令自然，但不削弱其命令性质。
- source_word: וְיָצְאוּ
  choice: 于是他们出去
  rationale: 连接词推进叙事，译作“于是”清楚表达命令之后随即执行的顺序。
- source_word: וְהִכּוּ
  choice: 击杀人
  rationale: נכה在此审判语境中指致命击打；“击杀”明确表达结果，宾语“人”按上下文补出，使中文完整自然。
- source_word: בָעִיר
  choice: 在城中
  rationale: 忠实表达地点意义，不扩展为“遍及全城”，从而避免过译可能的分布含义。
theological_decisions:
- issue: 是否弱化玷污圣殿的命令
  choice: 直接译为“要玷污这殿”
  alternative: 译为“使这殿不洁”或采用较弱措辞
  rationale: 异象明确呈现上帝发出的审判命令，其结果使圣殿遭到礼仪性玷污；译文应保留这种神学上的震撼，不加以缓和。
- issue: הַבַּיִת在正文中译作“房屋”还是明确为圣殿
  choice: 正文译作“这殿”，脚注说明原文直译
  alternative: 正文译作“这房屋”
  rationale: 现代中文的“房屋”在此容易被理解为普通建筑，不能像希伯来语“这家／这殿”那样自然指向圣殿；“这殿”准确传达语境所指，脚注则保留原文字面信息。
- issue: חֲלָלִים强调被杀者还是尸体
  choice: 正文译作“被杀的人”
  alternative: 译作“尸体”
  rationale: 该词可着重指遭杀戮者，也可在本语境中指其尸体。正文保留“被杀的人”的动作含义，脚注注明“尸体”，避免消除词义张力。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。命令句简洁有力；“玷污”“击杀”保留审判场景的严肃性。“各院子”体现复数，“在城中”保持原文地点表达而不作范围扩张。
