  text: זָקֵ֡ן בָּח֣וּר וּ/בְתוּלָה֩ וְ/טַ֨ף וְ/נָשִׁ֜ים תַּהַרְג֣וּ לְ/מַשְׁחִ֗ית וְ/עַל כָּל אִ֨ישׁ אֲשֶׁר עָלָ֤י/ו הַ/תָּו֙ אַל תִּגַּ֔שׁוּ וּ/מִ/מִּקְדָּשִׁ֖/י תָּחֵ֑לּוּ וַ/יָּחֵ֨לּוּ֙ בָּ/אֲנָשִׁ֣ים הַ/זְּקֵנִ֔ים אֲשֶׁ֖ר לִ/פְנֵ֥י הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/006.yaml
  text: Old man[a], young man, and virgin, and little children, and women—you shall kill them utterly. But do not come near anyone on whom is the mark, and begin at my sanctuary[b]. So they began with the old men who were before the house.
translation:
  language: zh_hans
  text: “老人、青年男子、处女、幼童和妇女，都要杀尽；只是凡身上有记号[a]的，你们不可近前。要从我的圣所开始。”于是，他们就从殿前的那些老人[b]开始。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记号”所译的希伯来词也可指希伯来字母“塔夫”（taw）；这里指第4节画在忠信者额上的保护记号。
    reason: lexical_alternative
  - marker: b
    text: “老人”也可译作“长老”。“殿”指圣殿。
    reason: alternative_reading
lexical_decisions:
- source_word: זָקֵן
  choice: 老人
  rationale: 此处与青年男子、处女、幼童和妇女并列，主要指年龄类别；汉语“老人”可自然表达希伯来语单数的类别性用法。末句同一词也可指“长老”，故以脚注保留歧义。
- source_word: בָּחוּר
  choice: 青年男子
  rationale: 指正值青春年华的男子；“青年男子”比“战士”更符合本节按年龄和性别列举人群的语境。
- source_word: בְתוּלָה
  choice: 处女
  rationale: 保留该词通常而明确的词义，不弱化为泛指的“年轻女子”。
- source_word: טַף
  choice: 幼童
  rationale: 该词指年幼的孩子或小孩子；“幼童”简洁地保留其年龄特征。
- source_word: נָשִׁים
  choice: 妇女
  rationale: 此处泛指女性群体，并无必须译作“妻子”的关系含义。
- source_word: תַּהַרְגוּ לְמַשְׁחִית
  choice: 都要杀尽
  rationale: “杀尽”既保留杀戮命令的严厉，也自然传达 לְמַשְׁחִית 所强调的彻底毁灭。
- source_word: הַתָּו
  choice: 记号
  rationale: 上下文表明这是第4节所画、使人得以保全的标记；正文用自然的“记号”，脚注说明其字面关联。
- source_word: אַל תִּגַּשׁוּ
  choice: 不可近前
  rationale: 准确表达“不要靠近、不要接近”，不把动作过度解释为“不可触碰”。
- source_word: וּמִמִּקְדָּשִׁי תָּחֵלּוּ
  choice: 要从我的圣所开始
  rationale: 此处 חלל 的使役式意为“开始”，מִקְדָּשִׁי 指“我的圣所”；“从……开始”清楚保留审判的起点。
- source_word: הַבָּיִת
  choice: 殿
  rationale: 在本段圣所异象的语境中指圣殿；译作“殿”比一般的“房屋”准确自然。
theological_decisions:
- issue: הַתָּו 应译作字母名称还是具有保护作用的标记
  choice: 记号
  alternative: 陶字记号（希伯来字母 taw）
  rationale: 叙事重点是第4节所画记号的识别与保护作用。正文采用功能清楚的“记号”，脚注保留希伯来词与字母名称的关联，不对其形状或神学象征作额外推断。
- issue: 末句 הַזְּקֵנִים 指老人还是担任职分的长老
  choice: 老人
  alternative: 长老
  rationale: 本节开头已按年龄和性别列举受审判者，末句重复 זקן，译作“老人”形成自然呼应；但他们位于殿前，职分意义“长老”仍有可能，因此以脚注保存歧义。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。“老人、青年男子、处女”等汉语裸名词自然具有类别性，既避免生硬复刻希伯来语单数，也不抹去其逐类点名的修辞效果。用“杀尽”直面原文的严厉，不加缓和性解释。脚注标记置于各自真正对应的词后：记号[a]、老人[b]。
