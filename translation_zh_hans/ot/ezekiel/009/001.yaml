  text: וַ/יִּקְרָ֣א בְ/אָזְנַ֗/י ק֤וֹל גָּדוֹל֙ לֵ/אמֹ֔ר קָרְב֖וּ פְּקֻדּ֣וֹת הָ/עִ֑יר וְ/אִ֛ישׁ כְּלִ֥י מַשְׁחֵת֖/וֹ בְּ/יָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/001.yaml
  text: Then he cried out in my ears with a loud voice[a], saying, “Draw near, you executioners of the city[b], each with his weapon of destruction in his hand.”
translation:
  language: zh_hans
  text: 他在我耳中高声呼喊，说：“这城受命的人[a]，近前来！各人手里拿着毁灭的兵器[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这城受命的人”所对应的原文含义较难确定，也可译作“监管这城的人”或“察访这城的人”。该词可能指受委派负责监管、察访或施行审判的人；也有人理解为临到这城的惩罚或察访。
    reason: alternative_reading
  - marker: b
    text: 原文直译：“各人手里有他毁灭的器具。”原词可泛指器具；这里按上下文译作“兵器”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼喊
  rationale: קרא在此指高声呼叫；与“在我耳边”和“大声”相配，表达强烈而公开的召唤。
- source_word: בְאָזְנַי
  choice: 在我耳边
  rationale: 保留希伯来语具体而生动的表达，在现代汉语中也自然可懂。
- source_word: קוֹל גָּדוֹל
  choice: 大声
  rationale: 这是表达高声说话的常用结构；译作“大声”简洁自然。
- source_word: קָרְבוּ
  choice: 你们近前来
  rationale: 保留复数命令语气；“近前来”具有庄重、明确的召唤意味。
- source_word: פְּקֻדּוֹת הָעִיר
  choice: 负责惩罚这城的人
  rationale: 该词源于פקד，可涉及委派、监管、察访或施行惩罚。上下文显示所召者携带毁灭兵器执行审判，因此用功能性表达呈现其身份，同时以脚注保留词义张力。
- source_word: וְאִישׁ
  choice: 各人
  rationale: 希伯来语单数“人”在此具有逐一分配的含义，汉语“各人”准确自然。
- source_word: כְּלִי מַשְׁחֵתוֹ
  choice: 毁灭的兵器
  rationale: כְּלִי泛指器具，在审判语境中译作“兵器”最清楚；מַשְׁחֵת表达毁坏、毁灭之意。
- source_word: בְּיָדוֹ
  choice: 手里都要拿着
  rationale: 将“在他手中”的具体图景转成自然汉语，并以“都”配合“各人”的分配关系；“要拿着”体现召集时对装备状态的要求。
theological_decisions:
- issue: פְּקֻדּוֹת הָעִיר在审判语境中的所指
  choice: 负责惩罚这城的人
  alternative: 这城的受命者／监管者；临到这城的惩罚（或察访）
  rationale: 该形式在词法与句法上较难确定，可指受委派执行监管或察访的人，也可能以抽象名词表达临到城的惩罚。后文的复数命令、各人持毁灭兵器及实际执行审判的场景，支持将其理解为执行惩罚的人员；但不进一步称其为天使，以免加入经文未明说的身份。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“在我耳边大声呼喊”保留原文的听觉现场感；直接引语使用明确的复数命令。“负责惩罚这城的人”结合上下文表达执行审判的角色，同时借脚注保存פְּקֻדּוֹת的词义与语法歧义。
