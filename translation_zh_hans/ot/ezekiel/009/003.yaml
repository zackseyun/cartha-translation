  text: וּ/כְב֣וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נַעֲלָה֙ מֵ/עַ֤ל הַ/כְּרוּב֙ אֲשֶׁ֣ר הָיָ֣ה עָלָ֔י/ו אֶ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּקְרָ֗א אֶל הָ/אִישׁ֙ הַ/לָּבֻ֣שׁ הַ/בַּדִּ֔ים אֲשֶׁ֛ר קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/003.yaml
  text: And the glory of the God of Israel went up from above the cherub on which it had been[a], to the threshold of the house. And he called to the man clothed in linen[c][b], who had the scribe’s writing case at his waist.
translation:
  language: zh_hans
  text: 以色列上帝的荣耀从基路伯上方，就是它原先所在之处，升起，来到殿[a]的门槛。便呼唤[b]那身穿细麻衣、腰间带着书记的书写盒的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”原文直译为“房屋”；在这里指圣殿建筑。
    reason: lexical_alternative
  - marker: b
    text: 原文的动词未明说主语，语法上也可理解为“荣耀呼唤”；这里以省略主语的方式保留这一可能。
    reason: alternative_reading
lexical_decisions:
- source_word: כְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列上帝的荣耀
  rationale: “荣耀”是כָּבוֹד在以西结异象语境中的常见对应，既可指可见的威荣，也承载上帝临在的含义；不以“临在”或“光辉”缩窄其意义。
- source_word: נַעֲלָה מֵעַל
  choice: 从……上方……升到
  rationale: 保留עלה的向上移动和מֵעַל所表达的从上方离开；“升到”符合异象叙事的空间感。
- source_word: הַכְּרוּב
  choice: 基路伯
  rationale: 原文为单数，故不译作复数“基路伯们”。
- source_word: אֲשֶׁר הָיָה עָלָיו
  choice: 就是先前所在之处
  rationale: 在中文中自然交代荣耀此前位于该基路伯上方，同时避免添加“停驻”等原文未明说的姿态。
- source_word: מִפְתַּן הַבָּיִת
  choice: 殿的门槛
  rationale: מִפְתָּן为“门槛”；בַּיִת字面为“房屋”，但本段明确指圣殿建筑，译作“殿”自然且准确。
- source_word: וַיִּקְרָא
  choice: 上帝呼唤
  rationale: 原文动词为阳性单数，表面可承接“荣耀”；上下文却呈现以色列的上帝借其荣耀亲自行动。明示“上帝”可避免中文用“它”造成非人格化，但以脚注保留语法上的另一可能。
- source_word: הַלָּבֻשׁ הַבַּדִּים
  choice: 身穿细麻衣
  rationale: “细麻衣”自然传达בַּדִּים所指的麻布衣着，并保留庄重、近于祭司服饰的色彩。
- source_word: קֶסֶת הַסֹּפֵר
  choice: 书记文具盒
  rationale: 该词组指书记携带的书写用具容器；“文具盒”比“墨角”通俗现代，也不把器物过度限定为仅盛墨的容器。
- source_word: בְּמָתְנָיו
  choice: 腰间带着
  rationale: 以现代中文自然表达物件佩带在腰部的位置，避免古奥的“腰胯”。
theological_decisions:
- issue: וַיִּקְרָא的行动主体与“以色列上帝的荣耀”的关系
  choice: 正文译作“上帝呼唤”，表达人格性的神圣行动
  alternative: 译作“荣耀呼唤”或以代词“它呼唤”，在语法上承接“荣耀”
  rationale: 希伯来文的阳性单数动词可由阳性名词“荣耀”作主语，但异象中的荣耀是以色列上帝临在和行动的显现。正文采用自然中文表达个人行动，同时用脚注保留原文可能的句法理解，不将二者的关系作教义化界定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“基路伯”为通行圣经术语；“书记文具盒”避免古旧的“墨角”。正文中的所有脚注标记均置于相关句末。
