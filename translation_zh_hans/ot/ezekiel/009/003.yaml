revisions:
- from: 以色列上帝的荣耀从基路伯上方，就是先前所在之处，升到殿的门槛那里。上帝呼唤那身穿细麻衣、腰间带着书记文具盒的人。[a][b]
  to: 以色列上帝的荣耀从基路伯上方，就是它原先所在之处，升起，来到殿[a]的门槛。便呼唤[b]那身穿细麻衣、腰间带着书记的书写盒的人。
  rationale: 修订避免把“呼唤”的主语在正文中明确为上帝，从而保留希伯来文及审校轨迹所承认的句法歧义；同时以更贴切的“书记的书写盒”替换带有不当现代联想的“书记文具盒”。脚注锚点移至所注词语之后，且完整保留“殿”的字面义和动词主语的替代理解。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:30:19Z'
