  naturalness: “书记文具盒”容易让现代读者联想到学校文具盒，且“文具”比原文所指的书记书写器具容器宽泛、时代感不合。改为“书记的书写盒”较自然、准确。将脚注紧邻相关词语，也使行文和注释指向更清楚。
  terminology: “以色列上帝的荣耀”“基路伯”“细麻衣”均庄重、通行且适合本段异象叙事。“殿”可保留，并以注释交代原文的字面义。“书记的书写盒”比“书记文具盒”更恰当地表达 קֶסֶת הַסֹּפֵר，且不采用过时的“墨角”。
