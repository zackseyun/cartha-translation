  text: וְ/גַ֨ם אֲנִ֔י לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל דַּרְכָּ֖/ם בְּ/רֹאשָׁ֥/ם נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/010.yaml
  text: And as for me[a], my eye will not spare, nor will I show pity[b]; I have brought their way upon their heads.
translation:
  language: zh_hans
  text: 至于我，我的眼必不顾惜，我也不怜悯；我已经使他们的所作所为[a]归到他们头上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“他们的道路”，这里指他们的行为或生活方式。
    reason: lexical_alternative
  - marker: b
    text: “归到他们头上”是希伯来语的表达；在这里的审判语境中，指他们行为所招致的报应临到他们自己。
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: 至于我
  rationale: 独立代词 אֲנִי 带有强调和对比意味；“至于我”以自然的现代汉语表达这种语气。וְגַם 在上下文中的承接、递进作用已由句式体现，不另译“也”，以免生硬或与后句的“也”混淆。
- source_word: לֹא תָחוֹס עֵינִי
  choice: 我的眼必不顾惜
  rationale: 保留希伯来语以“眼”为主语的具体意象；“不顾惜”在审判语境中自然表达不予宽免、不施怜恤。未显式标记的未完成式在此语境中表达确定将施行的行动，故译“必不”。
- source_word: וְלֹא אֶחְמֹל
  choice: 我也不怜悯
  rationale: חמל 表示怜悯、顾惜；译作“不怜悯”既与前一分句构成平行，又避免完全重复“顾惜”。
- source_word: דַּרְכָּם
  choice: 他们的所作所为
  rationale: דֶּרֶךְ 字面为“道路”，此处惯用来指人的生活方式或行为。现代汉语用“所作所为”能清楚传达其伦理含义；脚注保留字面意象。
- source_word: בְּרֹאשָׁם נָתָתִּי
  choice: 我要使……归到他们自己头上
  rationale: 字面结构为“我把……放在他们头上”，是恶行报应临到行为者自身的表达。“归到他们自己头上”保留头部意象并自然呈现报应回归之义。尽管 נָתַתִּי 为完成式，在先知审判宣告中可表达已经决定、确定将成就的行动；结合前两分句的将来指向，译作“我要使”。
theological_decisions:
- issue: 神施行审判与不予怜悯的严厉表述
  choice: 直译为“我的眼必不顾惜，我也不怜悯”，并保留行为归到本人头上的审判意象。
  alternative: 可解释性地译为“我绝不宽容，也不怜悯；我要让他们承担自己行为的后果”。
  rationale: 原文刻意以强烈的平行否定宣告神不再宽免，并用“头上”的意象陈明报应。正文不软化其严厉性，也不增添关于审判机制的教义说明。
- issue: נָתַתִּי 的时间指向
  choice: 按先知性完成式理解为确定将施行的审判，译作“我要使”。
  alternative: 按普通完成时译作“我已经使……归到他们头上”。
  rationale: 前面的两个未完成式指向即将执行的审判，而完成式可把未来之事表述为已经确定。中文采用将来表达可保持语篇连贯；同时承认其形式上也可理解为已施行。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于我”体现主语强调；“我的眼必不顾惜”有意保留原文意象；“所作所为”使“道路”的伦理含义对普通读者清楚，字面形式置于脚注。正文中的[a]、[b]均与脚注对应。
