reference: Ezekiel 9:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה שִׁשָּׁ֣ה אֲנָשִׁ֡ים בָּאִ֣ים מִ/דֶּרֶךְ שַׁ֨עַר הָ/עֶלְי֜וֹן אֲשֶׁ֣ר מָפְנֶ֣ה צָפ֗וֹנָ/ה וְ/אִ֨ישׁ כְּלִ֤י מַפָּצ/וֹ֙ בְּ/יָד֔/וֹ וְ/אִישׁ אֶחָ֤ד בְּ/תוֹכָ/ם֙ לָבֻ֣שׁ בַּדִּ֔ים וְ/קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָ֑י/ו וַ/יָּבֹ֨אוּ֙ וַ/יַּ֣עַמְד֔וּ אֵ֖צֶל מִזְבַּ֥ח הַ/נְּחֹֽשֶׁת׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/002.yaml
  text: And behold[a], six men were coming from the direction of the upper gate, which faces north, each with his weapon for smashing in his hand; and one man among them was clothed in linen, with a scribe’s writing case at his waist[b]. And they came and stood beside the bronze altar.
translation:
  language: zh_hans
  text: 看哪，六个人正从那朝北的上门方向而来，各人手中都拿着一件毁坏用的兵器[a]；他们中间有一个人身穿细麻衣，腰间带着书记的书写用具盒[b]。他们来到，站在铜祭坛旁边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“毁灭的兵器”。原文指用来击破、砸碎的器具，但究竟是哪一种兵器不能确定。
    reason: lexical_alternative
  - marker: b
    text: 传统译作：“书记的墨盒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留异象叙事中突然引人注目的指示语气，也符合现代中文圣经文体。
- source_word: שִׁשָּׁה אֲנָשִׁים
  choice: 六个人
  rationale: 原文明确为阳性复数，描写异象中具有人形的行动者；中文“六个人”自然且不预先判定其本质。
- source_word: בָּאִים מִדֶּרֶךְ
  choice: 从……方向走来
  rationale: 分词表达正在接近的动态场景；“从……方向走来”自然传达路径和方向。
- source_word: שַׁעַר הָעֶלְיוֹן אֲשֶׁר מָפְנֶה צָפוֹנָה
  choice: 朝北的上门
  rationale: 简明保留圣殿门的方位和名称，不额外解释其建筑位置。
- source_word: וְאִישׁ כְּלִי מַפָּצוֹ בְּיָדוֹ
  choice: 每个人手里都拿着击碎人的兵器
  rationale: מַפָּץ指用来击破、砸碎的器具，但具体形制不明；译作“击碎人的兵器”保留其毁灭性用途而不武断指定为某种武器。
- source_word: וְאִישׁ אֶחָד בְּתוֹכָם
  choice: 他们中间有一个人
  rationale: 忠实表达此人处在这群人之中，同时不把他解释为天使或其他特定身份。
- source_word: לָבֻשׁ בַּדִּים
  choice: 身穿细麻衣
  rationale: “细麻衣”准确、自然，也保留这种服饰可能具有的礼仪色彩而不加解释。
- source_word: קֶסֶת הַסֹּפֵר
  choice: 书记的文具盒
  rationale: קֶסֶת是书记携带的书写用具容器；“文具盒”比传统的“墨盒”更宽泛，避免把器具结构限定得过窄。
- source_word: בְּמָתְנָיו
  choice: 腰间带着
  rationale: 清楚自然地表达器具佩带在腰部的位置。
- source_word: וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: 他们进来，站在
  rationale: 两个连续动词推进异象场景；“进来”结合圣殿门的语境自然表达进入并站定。
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: 铜祭坛
  rationale: 直译祭坛的材质称谓，保持与圣殿器物用语一致。
theological_decisions:
- issue: 六个人及穿细麻衣者的身份和性质
  choice: 按异象所见译作“人”，不在正文中称其为天使。
  alternative: 译作“六位行刑天使”和“一位天使书记”。
  rationale: 希伯来文本以现象性的语言称他们为“人”；上下文虽可使读者理解为属天执行者，译文仍应保留原文描述及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以“看哪”保留先知异象的鲜明现场感；避免古奥的“腰际”“砸碎之器”等表达，也不把异象人物直接解释为天使。
