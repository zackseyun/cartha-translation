  text: כִּ֡י לֹא֩ אֶל עַ֨ם עִמְקֵ֥י שָׂפָ֛ה וְ/כִבְדֵ֥י לָשׁ֖וֹן אַתָּ֣ה שָׁל֑וּחַ אֶל בֵּ֖ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/005.yaml
  text: For you are not being sent to a people of obscure speech and difficult language[a], but to the house of Israel.
translation:
  language: zh_hans
  text: 因为你不是被差遣到一个言语晦涩、语言难懂的民族那里去，而是被差遣到以色列家那里去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“嘴唇深、舌头重”，是形容言语难以理解的希伯来语习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明先知使命的缘由；“因为”自然保留了解释和因果作用。
- source_word: עַם
  choice: 民族
  rationale: 这里指具有共同语言的族群，并非现代政治国家；“民族”符合上下文。
- source_word: עִמְקֵי שָׂפָה
  choice: 言语晦涩
  rationale: 原文直译为“嘴唇深”，是指言语不易领会的希伯来语习语；译文传达其实际含义，同时在脚注保留原有意象。
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: 话语难懂
  rationale: 原文直译为“舌头重”，在此与前一短语并列，表示语言难以理解；避免译成现代汉语中容易让人联想到口齿不清的“舌头沉重”。
- source_word: שָׁלוּחַ
  choice: 受差遣
  rationale: 被动分词在当前委任语境中说明以西结是奉命而去；“受差遣”简洁、庄重，并保留被动意义。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中这一固定的群体和盟约性称谓，不泛化为“以色列人”。
theological_decisions:
- issue: 否定对象与目的地之间的对比
  choice: 译出“不是……而是……”
  alternative: 按照原文表层次序直译为“不是到……；到以色列家”
  rationale: 希伯来文后半句没有明写转折连词，但句法形成明确对比；中文补出“而是”使关系清楚，并未增添新的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“言语晦涩、话语难懂”保留两个平行短语的结构；脚注说明其希伯来语身体意象，避免正文生硬或产生“口吃”的误解。
