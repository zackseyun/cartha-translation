id: EZK.3.19
reference: Ezekiel 3:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּה֙ כִּֽי הִזְהַ֣רְתָּ רָשָׁ֔ע וְ/לֹא שָׁב֙ מֵֽ/רִשְׁע֔/וֹ וּ/מִ/דַּרְכּ֖/וֹ הָ/רְשָׁעָ֑ה ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/019.yaml
  text: But if you warn a wicked man and he does not turn from his wickedness or from his wicked way[a], he will die in his iniquity[b], but you will have delivered your life.
translation:
  language: zh_hans
  text: 但你若警告恶人，他仍不从自己的罪恶和邪恶的道路上转离，他必死在自己的罪孽中[a]；你却救了自己的性命[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必因自己的罪孽而死。”
    reason: 介词 בְּ 在此既可表示处于罪孽之中，也可理解为因罪孽而死。
  - marker: b
    text: “自己的性命”也可译作“自己”或“自己的生命”。
    reason: נֶפֶשׁ 在此可指人的生命或本人，不必理解为狭义的“灵魂”。
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: 警告
  rationale: 该词是 זהר 的使役式，在本段守望者的语境中指发出警告；“警告”简洁自然。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 形容词在此作名词使用，指一个行恶的人；“恶人”保留单数指称，也符合现代汉语圣经语体。
- source_word: שָׁב
  choice: 离开
  rationale: שׁוּב 的基本意象是转回、回转；与介词 מִן 连用时，“离开”自然表达从恶和恶道转离，同时不直接加入“悔改”这一解释性术语。
- source_word: מֵרִשְׁעוֹ
  choice: 离开自己的恶
  rationale: רֶשַׁע 可指邪恶、恶行或罪恶；“自己的恶”保留原文与后句“自己的恶道”的重复和区分。
- source_word: וּמִדַּרְכּוֹ הָרְשָׁעָה
  choice: 也不离开自己的恶道
  rationale: דֶּרֶךְ 在此比喻人的生活道路或行为方式。“恶道”保留道路意象；否定结构中以“也不”连接，比直译为“和/或”更符合汉语，同时保留两项都未转离的意思。
- source_word: בַּעֲוֺנוֹ
  choice: 在自己的罪孽中
  rationale: בְּ 可表达所处状态，也可能带有原因意味；“在自己的罪孽中”保留这种语义张力，不将其单一定为因果关系。
- source_word: הִצַּלְתָּ אֶת־נַפְשְׁךָ
  choice: 救了自己的性命
  rationale: נֶפֶשׁ 在此指人的生命或本人，而不必专指非物质的“灵魂”；“救了自己的性命”自然表达希伯来语习语，并避免加入永恒救恩的限定。
theological_decisions:
- issue: 恶人“死在自己的罪孽中”是否明确指永恒定罪
  choice: 按原文译为“死在自己的罪孽中”，不界定死亡的全部范围
  alternative: 译为“因自己的罪而死”，并理解为现世审判或永恒定罪
  rationale: 经文说明恶人要在其罪孽中死，却没有在本节明确规定这种死亡的完整神学范围；译文保留原文的道德责任和开放性。
- issue: נַפְשְׁךָ 应译为“灵魂”“自己”还是“性命”
  choice: 自己的性命
  alternative: 自己的灵魂；自己
  rationale: 这里谈的是守望者因尽到警告责任而保全自己的生命或本人。“性命”既符合语境，也避免现代读者将“灵魂”误解为仅指非物质部分。
- issue: 两个“离开”对象之间的关系
  choice: 用“也不”并列“自己的恶”和“自己的恶道”
  alternative: 不离开自己的恶或自己的恶道
  rationale: 希伯来文以 וְ 连接第二项；在共同受否定词支配的结构中，汉语“也不”最自然，并不强行把逻辑关系解释成排他性的“或”。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“恶—恶道”的原文重复和“道路”的伦理隐喻；用“也不”处理否定范围内的并列，使句意自然但不消解原文结构。
