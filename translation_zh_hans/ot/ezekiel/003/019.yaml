revisions:
- from: 但你若警告恶人，他却不离开自己的恶，也不离开自己的恶道，他必死在自己的罪孽中[a]；你却救了自己的性命[b]。
  to: 但你若警告恶人，他仍不从自己的罪恶和邪恶的道路上转离，他必死在自己的罪孽中[a]；你却救了自己的性命[b]。
  rationale: 修订仅改善现代汉语的自然度和清晰度：以“从……转离”更直接呈现 שׁוּב 与 מִן 的转向意象；以“罪恶”和“邪恶的道路”替换较生硬的“恶”和“恶道”。保留“仍不”所表达的受警告后依旧不转离，保留两个并列对象及“死在自己的罪孽中”的语义开放性。脚注锚点及内容均保留并与正文对应。
