  text: וּ/לְשֽׁוֹנְ/ךָ֙ אַדְבִּ֣יק אֶל חִכֶּ֔/ךָ וְ/נֶֽאֱלַ֔מְתָּ וְ/לֹא תִֽהְיֶ֥ה לָ/הֶ֖ם לְ/אִ֣ישׁ מוֹכִ֑יחַ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/026.yaml
  text: And I will make your tongue cling to the roof of your mouth[a], and you will be mute and will not be for them a man who rebukes[d][c][b], for they are a rebellious house.
translation:
  language: zh_hans
  text: 我要使你的舌头贴住上腭[a]，你就不能说话[b]，不能作他们的责备者[c]，因为他们是悖逆之家[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上腭”也可译作“口腔上部”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“你将缄默”或“你将成为哑的”。
    reason: lexical_alternative
  - marker: c
    text: 原文为“一个责备的人”；也可指规劝或纠正他们的人。
    reason: lexical_alternative
  - marker: d
    text: “悖逆之家”是以西结书常用的说法，把百姓称为一个整体的家族或群体。
    reason: cultural_note
lexical_decisions:
- source_word: אַדְבִּיק
  choice: 我要使……紧贴
  rationale: 该词为דבק的使役形，表示上帝使以西结的舌头贴住；“使……紧贴”既保留使役意义，也符合现代汉语。
- source_word: לְשׁוֹנְךָ
  choice: 你的舌头
  rationale: 保留具体的身体意象，这是本节受制而不能说话之描写的核心。
- source_word: אֶל חִכֶּךָ
  choice: 上膛
  rationale: חֵךְ指口腔上部，即上膛或腭；“上膛”简明自然，同时保留身体部位的具体性。
- source_word: וְנֶאֱלַמְתָּ
  choice: 使你哑口无言
  rationale: 该被动形表达陷入不能说话的状态；结合前句，汉语用“使你哑口无言”自然地呈现这是上帝所施加的缄默。
- source_word: וְלֹא תִהְיֶה לָהֶם
  choice: 不能作……他们的人
  rationale: 在汉语中将关系结构自然整合为“不能作责备他们的人”，避免生硬直译，同时不额外解释其职分范围。
- source_word: לְאִישׁ מוֹכִיחַ
  choice: 作责备他们的人
  rationale: מוֹכִיחַ是יכח的使役分词，可指责备、规劝或纠正的人；“责备”保留先知言辞的对抗力度，“人”也对应אִישׁ。
- source_word: בֵּית מְרִי
  choice: 悖逆之家
  rationale: 保留以西结书中常见的“家”这一群体性称呼；“悖逆”准确传达持续反抗的意味，并具有庄重的先知文体。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出以西结受缄默限制的原因，符合现代汉语因果表达。
theological_decisions:
- issue: 以西结不能说话的性质
  choice: 由上帝施加的缄默，使他不能自行责备百姓
  alternative: 纯粹比喻性的沉默，或仅指缺乏说服力
  rationale: “舌头”和“上膛”的具体身体意象支持真实受限的表达；译文保留这种具体性，但不超出本节说明其持续时间或全部机制。
- issue: בֵּית מְרִי的表达
  choice: 悖逆之家
  alternative: 悖逆的百姓
  rationale: “家”是以西结书的重要群体性用语。保留这一意象可避免把原文的立约共同体色彩扁平化。
- issue: אִישׁ的性别表达
  choice: 人
  alternative: 男人
  rationale: 此处虽具体指男性先知以西结，但汉语“作……的人”是最自然的个体职能表达，并不抹去其性别；译作“男人”反而会不当地强调生理性别。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“舌头紧贴上膛”的具体身体意象和“悖逆之家”的以西结式表达；以“哑口无言”传达不能说话的结果，以“不能作责备他们的人”自然呈现希伯来语关系结构。
