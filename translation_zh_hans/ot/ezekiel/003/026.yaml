  source_fidelity: 草案准确保留了神使先知舌头黏住口腔上部、因而不能向悖逆群体施行责备的基本意象和因果关系。但“使你哑口无言”把原文随后以第二人称表达的结果状态再次改作使役结构；且“哑口无言”在现代汉语中也常指因无话可说而语塞，较难明确传达身体性失语。
  naturalness: “不能作责备他们的人”可以理解，但语序略显滞涩。“不能作他们的责备者”在现代庄重汉语中更顺畅，也保留了“对他们／为他们”的关系。以“上腭”替代“上膛”可更明确对应口腔的腭部。
  terminology: “悖逆之家”恰当地保留以西结书的固定群体意象，不宜改作单纯的“悖逆百姓”。“责备者”足以表达מוֹכִיחַ的责备、谴责或纠正功能；脚注可说明该词的含义范围。
