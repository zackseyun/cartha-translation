  yaml_path: translation/ot/ezekiel/003/002.yaml
  text: So I opened my mouth[a], and he fed me this scroll.
translation:
  language: zh_hans
  text: 于是我张开口，他就使我吃下这书卷。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就叫我吃下这书卷”或“他就让我吃下这书卷”。
    reason: 保留וַיַּאֲכִלֵנִי的使役式在较自然、较口语表达中的译法。
lexical_decisions:
- source_word: וָאֶפְתַּח
  choice: 于是我张开
  rationale: 该词为פתח的Qal连续式，推进叙事中的下一动作；“于是”自然表达承接关系。
- source_word: אֶת־פִּי
  choice: 口
  rationale: 宾语标记后接“我的口”；汉语以“我张开口”自然表达所属关系，无须重复“我的”。
- source_word: וַיַּאֲכִלֵנִי
  choice: 他就把……给我吃了
  rationale: 该词是אכל的Hiphil使役式，带第一人称单数宾语后缀，意为“使我吃”；此译既符合现代汉语，又保留使役含义，而不弱化为仅仅递交书卷。
- source_word: אֵת־הַמְּגִלָּה הַזֹּאת
  choice: 这书卷
  rationale: מְגִלָּה指卷起的书写载体，现代中文圣经语境中“书卷”准确、清楚；הַזֹּאת译为“这”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“张开口”比“开口”更明确地对应动作；“把这书卷给我吃了”是自然汉语，同时保留原文使役结构。脚注标记置于完整句后。
