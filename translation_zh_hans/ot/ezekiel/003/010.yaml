  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֕ם אֶת כָּל דְּבָרַ/י֙ אֲשֶׁ֣ר אֲדַבֵּ֣ר אֵלֶ֔י/ךָ קַ֥ח בִּֽ/לְבָבְ/ךָ֖ וּ/בְ/אָזְנֶ֥י/ךָ שְׁמָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/010.yaml
  text: Then he said to me[a], “Son of man, receive in your heart all my words that I speak to you, and hear with your ears.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，凡我对你所说的一切话，你要把它们收在心里[a]，也要用耳朵听。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“放在心上”。“收”所对应的希伯来语字面意思是“拿取”，这里指从内心接受这些话。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中对先知一贯使用的称呼；“人子”保留希伯来语的字面结构和反复出现的称呼形式，不将其解释性地改写为“凡人”或“世人”。
- source_word: אֶת כָּל דְּבָרַי
  choice: 我的一切话
  rationale: דְּבָרַי 在此具体指上帝所说的话；保留“话”的表达，使它仍是“收进心里”和“听”的对象。
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: 我要对你说
  rationale: 未完成体在此可表达即将或持续要说的话；结合上下文，译作“我要对你说”自然地保留其前瞻意味。
- source_word: קַח בִּלְבָבְךָ
  choice: 收进心里
  rationale: קַח 字面为“拿、取”，在这里表示从内心接受；“收进心里”既保留接纳动作，也符合现代汉语习惯，并保留“心”所表达的内在思想与意志。
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: 也要用耳朵听
  rationale: 保留原文对“耳朵”的明确提及和身体性的强调，不简化为单独的“听从”或“留心听”。
theological_decisions:
- issue: 称呼 בֶּן אָדָם 中 אָדָם 的译法
  choice: 人子
  alternative: 凡人；世人
  rationale: “人子”保存以西结书中反复出现的希伯来语称呼形式，突出先知作为人的身份，同时不在本节中引入后来的基督论解释。
- issue: “心”所指的内在功能
  choice: 保留“心”
  alternative: 思想；头脑
  rationale: 希伯来语 לֵבָב 可涵盖思想、意志和内在生命；译作“心”能保存这一较宽的语义范围，避免只限定为理智活动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“收进心里”避免过度教会化的“领受于心”，同时传达内在接受；“用耳朵听”有意保留原文略带强调的具体表达。
