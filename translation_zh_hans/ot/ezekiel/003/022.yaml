base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/022.yaml
  text: And there the hand of Yahweh was upon me[a], and he said to me, “Rise, go out to the valley[b], and there I will speak with you.”
translation:
  language: zh_hans
  text: 在那里，耶和华的手在我身上。他对我说：“起来，出去，到平原[a]去；我要在那里对你说话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“山谷”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“跟你说话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עָלַי שָׁם
  choice: 在那里……临到我身上
  rationale: שָׁם译为“在那里”，保留经文的空间强调；היה + על在这里表达上帝的手加在先知身上的状态或作用。“临到我身上”既保留希伯来语意象，也符合现代汉语先知叙事的表达。
- source_word: יַד יְהוָה
  choice: 耶和华的手
  rationale: 保留“手”这一具体比喻，不直接释为“能力”或“影响”；יהוה按其专名译为“耶和华”。
- source_word: ק֥וּם צֵא֙
  choice: 起来，到……去
  rationale: קוּם是命令式“起来”；צֵא本义为“出去”。结合汉语中前往开阔地带的自然说法，译作“到……去”，避免生硬的“出去到……”。
- source_word: הַבִּקְעָה
  choice: 平原
  rationale: בִּקְעָה可指宽阔的谷地、平原或盆地；本处选“平原”，符合该词所描绘的开阔低地，同时以脚注保留“山谷”这一可能译法。
- source_word: אֲדַבֵּר אוֹתָךְ
  choice: 我要……对你说话
  rationale: דבר + את可表达“对某人说话”或“与某人说话”。正文采用现代汉语更自然的“对你说话”，脚注保留“跟你说话”，不把原文强行限定为单向传话或双向交谈。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名יהוה。中文正文采用读者最熟悉且明确作为专名使用的“耶和华”，不以“主”这一称号替代神名；“雅威”是另一种音译。
- issue: “耶和华的手”所表达的神圣作用
  choice: 保留“手”的比喻
  alternative: 释译为“耶和华的能力”
  rationale: 原文以“耶和华的手”描述上帝临到并推动先知的力量或掌控。保留比喻可避免把其含义缩减为抽象的“能力”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留两次“在那里”，以呈现原文首尾呼应的空间重点；神名用“耶和华”，叙述不使用古雅而生硬的句式。
