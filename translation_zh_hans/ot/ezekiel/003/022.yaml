revisions:
- from: 在那里，耶和华的手临到我身上。他对我说：“起来，到平原[a]去，我要在那里对你说话[b]。”
  to: 在那里，耶和华的手在我身上。他对我说：“起来，出去，到平原[a]去；我要在那里对你说话[b]。”
  rationale: 修订首句以‘在我身上’对应希伯来语‘手……在我身上’的状态性叙述，避免‘临到’可能引入的瞬时或起始含义；在命令中补出‘出去’以反映צֵא。其余措辞、神名译法及脚注均可保留。
