id: EZK.3.20
reference: Ezekiel 3:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְק/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל וְ/נָתַתִּ֥י מִכְשׁ֛וֹל לְ/פָנָ֖י/ו ה֣וּא יָמ֑וּת כִּ֣י לֹ֤א הִזְהַרְתּ/וֹ֙ בְּ/חַטָּאת֣/וֹ יָמ֔וּת וְ/לֹ֣א תִזָּכַ֗רְןָ צִדְקֹתָ/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/020.yaml
  text: And when a righteous man turns from his righteousness and does injustice[a], and I place a stumbling block before him, he will die. Because you did not warn him, he will die in his sin, and his righteous deeds that he did will not be remembered[d][c][b]; and I will require his blood from your hand.
translation:
  language: zh_hans
  text: 义人若离弃自己的义，行不义，我又将绊脚石放在他面前，他必死。因为你没有警告他，他必死在自己的罪中；他所行的义行必不被记念[a]。他的血，我要向你追讨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义行”也可译作“所行的义”或“正义的行为”。
    reason: 说明复数 צִדְקֹתָיו 在这里指先前所行的具体正义行为。
  - marker: b
    text: “向你追讨他的血”是司法性的说法，意思是上帝要追究守望者对这人死亡所负的责任。
    reason: 帮助现代读者理解希伯来语“从你手中追讨血”的责任表达。
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: 若转离
  rationale: ב加不定式结构表示情境，可兼具时间与条件意味；“若”在本段警告语境中自然，也不把它硬性限定为纯时间关系。
- source_word: צַדִּיק מִצִּדְקוֹ
  choice: 义人……转离自己的义
  rationale: 保留“义人”与“义”的词根呼应；这里的“义”可涵盖正直状态和正义行为，不缩减为单纯的法庭地位。
- source_word: וְעָשָׂה עָוֶל
  choice: 行了不义
  rationale: עָוֶל指错误、不义或不公；“行了不义”保留其道德与司法分量，同时符合现代汉语圣经文体。
- source_word: וְנָתַתִּי מִכְשׁוֹל לְפָנָיו
  choice: 而我把绊脚石放在他面前
  rationale: 直译核心意象，并明确保留上帝作为动作主体，不将经文中的神学张力解释掉。
- source_word: בְּחַטָּאתוֹ יָמוּת
  choice: 他必死在自己的罪中
  rationale: 保留介词ב所表达的处境或范围，呈现他死时处于罪中的意思，而不改写为单一因果表述。
- source_word: צִדְקֹתָיו אֲשֶׁר עָשָׂה
  choice: 他曾行的义举
  rationale: 复数צִדְקֹתָיו在此指具体的正义、正直行为；“义举”简洁地表达其复数行动性质。
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: 他的血，我要向你追讨
  rationale: 保留血债与司法追讨的希伯来表达；汉语无需逐字译出“从你手中”，仍能清楚表达守望者要为其血负责。
theological_decisions:
- issue: 上帝把“绊脚石”放在义人面前的神圣能动性
  choice: 保留“我把绊脚石放在他面前”的直接陈述
  alternative: 解释为“我容许障碍临到他”或“我使后果临到他”
  rationale: 希伯来文本明确以上帝为放置者；译文不弱化其能动性，也不进一步断言绊脚石如何使人犯罪。
- issue: 义人转离义后，先前义行“不被记念”的含义
  choice: 按审判语境译作“他曾行的义举都不再被记念”
  alternative: 解释为失去救恩、失去盟约地位，或仅是一种修辞警告
  rationale: 经文明确陈述先前义行不被记念，却没有在本节系统说明救恩论结论；译文应保留警告及其张力。
- issue: 义人的责任与守望者未警告的责任并存
  choice: 同时保留“死在自己的罪中”与“他的血，我要向你追讨”
  alternative: 只突出犯罪者自身责任，或只突出守望者责任
  rationale: 原文并列两方面责任，不能用其中一项消解另一项。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“义人、义、不义、绊脚石、记念、追讨”等词保留先知书的司法与盟约语感；句式经过汉语化处理，但不消除原文在神圣能动性、人的罪责和守望者责任之间的张力。
