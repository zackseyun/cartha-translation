base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/004.yaml
  text: Then he said to me[a], “Son of man, go to the house of Israel and speak my words to them.”
translation:
  language: zh_hans
  text: 他对我说：“人子[a]啊，你去以色列家那里，把我的话告诉他们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”也可译作“人”或“必死的人”。这是《以西结书》中反复出现的称呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 叙事性连接词推动情节发展；现代汉语无需机械译出“于是”或“又”，上下文中的先后关系仍然清楚。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留希伯来语字面形式及其在《以西结书》中反复作为称呼的文学特色；此处首先强调受造之人的身份，不额外引入后世语境中的基督论含义。
- source_word: לֶךְ בֹּא
  choice: 你去，到……那里
  rationale: 希伯来语连续使用两个命令式，字面为“去，来/到”；汉语用“去，到……那里”既体现两个动词，又避免生硬的“去，来”。
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: 到以色列家那里
  rationale: 保留先知书惯用的“以色列家”，所指是以色列民整体；加“那里”使现代汉语表达自然。
- source_word: וְדִבַּרְתָּ בִדְבָרַי
  choice: 把我的话告诉
  rationale: 该结构表示奉命将上帝的话传给听众；“把我的话告诉他们”自然地传达命令和内容，同时不把复数“话”概括成较宽泛的“信息”。
- source_word: אֲלֵיהֶם
  choice: 他们
  rationale: 代词回指“以色列家”，汉语以“他们”自然表达群体对象。
theological_decisions:
- issue: 称呼 בֶּן אָדָם 中 אָדָם 的译法
  choice: 人子
  alternative: 必死的人；人类之子
  rationale: “人子”最能保留原文形式及《以西结书》中反复称呼先知的用法；脚注列出强调人的有限性或人类身份的译法，以免把原文在此处的含义限定为后世专门称号。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“以色列家”保留先知文学的传统表达；“你去，到……那里”有意呈现原文相连的两个命令式，但按汉语习惯调整句法。
