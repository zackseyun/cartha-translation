  text: בֶּן אָדָ֕ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אוֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/017.yaml
  text: Son of man[a], I have made you a watchman for the house of Israel[b]; and you shall hear a word from my mouth and warn them from me.
translation:
  language: zh_hans
  text: 人子[a]啊，我立你作以色列家的守望者；你要从我口中听见话语，并把出于我的警告传给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人子”是本书中上帝反复用来称呼以西结的说法；也可译为“凡人”。
    reason: 说明希伯来语惯用称呼及可成立的词义替代。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留希伯来语直译及其在《以西结书》中反复用来称呼先知的固定形式；这里是对男性先知以西结的单数称呼。
- source_word: צֹפֶה
  choice: 守望者
  rationale: 此词指负责观察并在危险来临时发出警告的人；“守望者”兼顾守望和警戒两方面的职能。
- source_word: נְתַתִּיךָ
  choice: 我立你作
  rationale: 动词字面为“我把你给出/安置”，与身份名词连用时表示设立或任命；“立你作”在现代汉语中简洁而庄重。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家的
  rationale: לְ 表明以色列家是先知受命守望的对象；汉语以“作以色列家的守望者”自然表达这种职责关系。
- source_word: וְשָׁמַעְתָּ
  choice: 你要……听到
  rationale: 保留命令性委任语境，并与后面的警告行动构成并列顺序；不把连接词进一步解释为明确的条件关系。
- source_word: מִפִּי דָּבָר
  choice: 从我口中听到话
  rationale: 保留“从我口中”这一具体而有力的神人同形表达，并以“话”对应含义宽泛的 דָּבָר。
- source_word: וְהִזְהַרְתָּ אוֹתָם
  choice: 并向他们发出……警告
  rationale: הזהיר 的使役词形在这里表示使人警觉、警告；宾语“他们”回指作为整体的以色列家。
- source_word: מִמֶּנִּי
  choice: 来自我的
  rationale: 直接保留警告的来源是上帝这一含义，避免仅译为“替我”而弱化来源关系。
theological_decisions:
- issue: 两个连续动词之间是并列顺序还是时间条件关系
  choice: 你要从我口中听到话，并……警告
  alternative: 当你从我口中听到话时，就要……警告
  rationale: 希伯来文以两个带连接词的完成式动词依次陈述先知的职责。上下文容许时间性的理解，但原句没有明示条件词，因此正文保留较形式化的并列顺序，不将其限定为“当……时”。
- issue: 是否保留“人子”这一称呼
  choice: 人子
  alternative: 世人；凡人
  rationale: בֶּן אָדָם 是本书中上帝反复用来称呼以西结的固定表达。“人子”保留原文形式及经文间的呼应；脚注说明此处强调受称呼者是人，不在正文中消解这一惯用语的张力。
- issue: מִמֶּנִּי 所表达的警告来源
  choice: 向他们发出来自我的警告
  alternative: 替我警告他们
  rationale: 原文可自然理解为先知代表上帝警告百姓，但介词首先标明警告“来自我”。正文保留来源意义，同时不排除受托代表上帝发言的含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立你作”“守望者”适合先知受命的语境；后半句刻意保留原文的并列结构和“从我口中”“来自我的”两处来源表达。
