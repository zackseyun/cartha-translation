source:
  edition: WLC
  text: וָ/אָקוּם֮ וָ/אֵצֵ֣א אֶל הַ/בִּקְעָה֒ וְ/הִנֵּה שָׁ֤ם כְּבוֹד יְהוָה֙ עֹמֵ֔ד כַּ/כָּב֕וֹד אֲשֶׁ֥ר רָאִ֖יתִי עַל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל עַל פָּנָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/023.yaml
  text: So I arose and went out to the valley[a], and behold, the glory of Yahweh was standing there, like the glory that I had seen by the Kebar River; and I fell on my face.
translation:
  language: zh_hans
  text: 于是我起身，往谷地[a]去。看哪，耶和华的荣耀站在那里，就像我先前在迦巴鲁河边所看见的那荣耀一样；我就俯伏在地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷地”或译“平原”。希伯来词可指宽阔的谷地或平坦低地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקוּם וָאֵצֵא
  choice: 于是我起来，出去到了
  rationale: 两个连续叙事形式表示先后动作；“于是……起来，出去到了”既保留推进关系，也符合现代汉语叙事习惯。
- source_word: הַבִּקְעָה
  choice: 谷地
  rationale: בִּקְעָה可指宽阔的谷地或平原；正文采用兼具低洼、开阔含义的“谷地”，并以脚注保留“平原”这一可能译法。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该词用于引人注意、凸显眼前异象；“看哪”保留先知叙事的突显作用和庄重语气。
- source_word: כְּבוֹד יְהוָה
  choice: 耶和华的荣耀
  rationale: כָּבוֹד在此指异象中显现的神圣荣耀；采用属有结构，不进一步解释为“临在”，以免超出原文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 用现代简体中文圣经语境中广为人知的专名“耶和华”呈现四字神名，而不以称号代替。
- source_word: עֹמֵד
  choice: 站在那里
  rationale: 分词描绘持续呈现的姿态；汉语“站在那里”自然保留场景性的静态描写。
- source_word: כַּכָּבוֹד אֲשֶׁר רָאִיתִי
  choice: 正如我……所看见的荣耀
  rationale: כ־表达比较；关系从句译为“我……所看见的”，清楚指向此前的异象，同时不额外添加解释。
- source_word: עַל נְהַר כְּבָר
  choice: 在迦巴鲁河边
  rationale: עַל在河流语境中表示临近、在旁；“河边”符合自然汉语。כְּבָר按希伯来语辅音和马所拉读音音译为“迦巴鲁”。
- source_word: וָאֶפֹּל עַל פָּנָי
  choice: 我就俯伏在地
  rationale: 该惯用语直指面朝下伏地；“俯伏在地”在现代汉语中自然、庄重，并保留敬畏性的身体动作。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。正文保留专名，并采用普通现代中文读者最熟悉的“耶和华”；“雅威”是较接近学术重构发音的另一常见译法。
- issue: כְּבוֹד יְהוָה 的理解
  choice: 耶和华的荣耀
  alternative: 耶和华荣耀的显现／耶和华的临在
  rationale: 直译保留“荣耀”这一重要且含义丰富的表达，不把异象中的可见显现直接等同或扩展为某一种系统性的“临在”解释。
- issue: 荣耀“站立”的拟人化表达
  choice: 耶和华的荣耀站在那里
  alternative: 耶和华的荣耀显现在那里
  rationale: 原文明确使用“站立”的分词。保留这一不寻常的形象，避免将其平滑改写为“显现”而丢失原文的神学与异象张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“看哪”保留先知异象叙事的郑重和突显功能；“俯伏在地”比逐字的“脸伏在地上”更符合中文习惯。“站在那里”刻意保留原文对“荣耀”的拟人化描写。
