id: EZK.3.11
reference: Ezekiel 3:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֵ֨ךְ בֹּ֤א אֶל הַ/גּוֹלָה֙ אֶל בְּנֵ֣י עַמֶּ֔/ךָ וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/011.yaml
  text: And go[a], come to the exiles, to the sons of your people, and speak to them and say to them[b], ‘Thus says the Lord GOD,’ whether they hear or whether they refuse.
translation:
  language: zh_hans
  text: 你要去，到被掳的人那里，就是你本族的子民[a]那里；你要向他们说话，对他们说：“主耶和华如此说：不论他们听从，还是拒绝听从[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你百姓的众子”，是指同属你百姓的群体，并非只指男性。
    reason: lexical_alternative
  - marker: b
    text: “拒绝听从”所译的希伯来语字面意思是“停止”或“不再”；在这里与“听从”相对，表示不肯听从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֵךְ בֹּא
  choice: 你要去，到……那里
  rationale: 两个相连的行动命令分别表达“去”和“来到／到达”。中文保留其推进关系，但不机械译成不自然的“去，来”。
- source_word: הַגּוֹלָה
  choice: 被掳的人
  rationale: 此处是集合名词，指被迁徙流放的群体，而非抽象的“流亡”状态。
- source_word: בְּנֵי עַמֶּךָ
  choice: 你本族的子民
  rationale: 该短语直译为“你百姓的众子”，是表示同族群体的亲属称谓；“本族的子民”在现代汉语中自然，并保留群体归属关系，脚注注明字面形式。
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要向他们说话，对他们说
  rationale: 保留原文两个言说动词的重复及命令语气，不将其合并。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 采用庄重、通行的先知传信公式，同时准确反映希伯来语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现称号 אֲדֹנָי 与神名 יהוה；“主耶和华”是简体中文圣经语域中清楚而庄重的传统表达。
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: 不论他们听从，还是拒绝听从
  rationale: 成对的 אִם 表示两种可能，即“不论……还是……”。“听从”传达 שׁמע 在此不只是听见，更是留心遵从；חדל 字面为“停止／不再”，在此与听从相对，语境义为拒绝听从，脚注保留其字面张力。
theological_decisions:
- issue: 复合称谓 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时包含“主”这一称号与四字神名。正文采用现代中文读者熟悉的“主耶和华”，并未将两者压缩为单一称谓。
- issue: בְּנֵי עַמֶּךָ 的性别与群体含义
  choice: 你本族的子民
  alternative: 你百姓的众子
  rationale: “众子”较贴近字面阳性形式，却容易在现代汉语中被误解为只指男性后代；上下文所指是以色列被掳群体。正文表达其代表性的群体含义，脚注保存字面亲属称谓。
- issue: יִשְׁמְעוּ 与 יֶחְדָּלוּ 的对立
  choice: 听从／拒绝听从
  alternative: 听／停止
  rationale: 这里的神学张力在于先知无论受众是否回应都必须传话。“听从／拒绝听从”清楚呈现回应与抗拒的对立，同时以脚注说明后者的字面意义，避免掩盖原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。保留先知使命中连续命令和重复言说动词的节奏；标点划分目的地说明、传话命令和信息内容，使长句清晰。
