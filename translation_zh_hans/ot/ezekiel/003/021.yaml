id: EZK.3.21
reference: Ezekiel 3:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֞ה כִּ֧י הִזְהַרְתּ֣/וֹ צַדִּ֗יק לְ/בִלְתִּ֥י חֲטֹ֛א צַדִּ֖יק וְ/ה֣וּא לֹא חָטָ֑א חָי֤וֹ יִֽחְיֶה֙ כִּ֣י נִזְהָ֔ר וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/021.yaml
  text: But if you warn a righteous man not to sin[a], and he does not sin, he will surely live because he took warning, and you will have delivered your life.
translation:
  language: zh_hans
  text: 但你若警告义人不可犯罪，他也没有犯罪，他必定活着，因为他听从了警告[a]；你也救了自己的性命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因为他受了警告”，也可译“因为他留意了警告”。希伯来语动词既可侧重领受警告，也可侧重对警告作出回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 在本节与上下文的条件句中引出前件；“若”自然对应假设情形。
- source_word: הִזְהַרְתּוֹ
  choice: 你警告义人
  rationale: זהר 的使役式表示警告、告诫；宾语后缀所指的义人已直接表达。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该词在此作名词用，指一个公义的人；“义人”是准确、简洁且为现代中文读者熟悉的表达。
- source_word: לְבִלְתִּי חֲטֹא
  choice: 不可犯罪
  rationale: 该不定式结构表达警告的内容及预防目的；中文用“警告……不可犯罪”自然明确。
- source_word: וְהוּא לֹא חָטָא
  choice: 他也没有犯罪
  rationale: 在条件—结果结构中陈述义人实际未犯罪；“没有犯罪”保留希伯来语完成式的结果性，同时符合中文。
- source_word: חָיוֹ יִחְיֶה
  choice: 他必定活着
  rationale: 不定式绝对形与未完成式连用加强语气；“必定”体现强调。
- source_word: נִזְהָר
  choice: 听从了警告
  rationale: זהר 的受动式在此既可侧重受到警告，也可指留意、听从警告；正文采用符合结果语境的回应性表达，并以脚注保留词义歧义。
- source_word: נַפְשְׁךָ
  choice: 自己的性命
  rationale: נֶפֶשׁ 在守望者语境中指本人的生命，不宜在此译成后期意义上的非物质“灵魂”。
- source_word: הִצַּלְתָּ
  choice: 救了
  rationale: נצל 的使役式表示搭救、保全；中文完成表达与条件结果相配，又不额外解释其具体机制。
theological_decisions:
- issue: “救了自己的性命”的含义
  choice: 保留经文本身关于守望者履责后保全性命的措辞
  alternative: 明确解释为免除流血之罪、属灵自救或仅保存肉身生命
  rationale: 上下文涉及先知在上帝面前的守望责任和血债追究，但本节没有把该短语完全限定为某一种系统神学解释；直译其庄重含义，避免导入因个人功德得救的观念，也不消除其司法与生命层面的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“义人”“必定活着”“自己的性命”保留先知性语体的分量；分号清楚呈现义人的结果与守望者的结果。
