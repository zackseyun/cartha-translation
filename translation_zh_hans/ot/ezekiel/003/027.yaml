id: EZK.3.27
reference: Ezekiel 3:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּֽ/בְ/דַבְּרִ֤/י אֽוֹתְ/ךָ֙ אֶפְתַּ֣ח אֶת פִּ֔י/ךָ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/שֹּׁמֵ֤עַ יִשְׁמָע֙ וְ/הֶ/חָדֵ֣ל יֶחְדָּ֔ל כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־׀׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/027.yaml
  text: 'But when I speak with you[a], I will open your mouth, and you shall say to them, ‘Thus says the Lord GOD: The one who hears, let him hear; and the one who refrains, let him refrain[b], for they are a rebellious house.’'
translation:
  language: zh_hans
  text: 但我对你说话时，我必使你开口；你要对他们说：‘主耶和华如此说：听的人，任他听；不听的人，任他不听[a]，因为他们是悖逆之家[b]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“听的人必听，不听的人必不听。”这里的希伯来语形式既可表示许可或任凭，也可表示将要发生的事。
    reason: alternative_reading
  - marker: b
    text: “悖逆之家”是以西结书反复用来称呼以色列民的说法，指出他们顽梗地背叛上帝。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְדַבְּרִי אוֹתְךָ
  choice: 但我对你说话时
  rationale: בְּ加不定式构成时间从句“当……时”；连接词按上文以西结受禁言、此处重新开口的对比译作“但”。אֹתְךָ在现代汉语中自然表达为“对你”。
- source_word: אֶפְתַּח אֶת־פִּיךָ
  choice: 我必使你开口
  rationale: 直译为“我必打开你的口”；汉语用“使你开口”既自然，也保留上帝使先知恢复发言能力的主动意义。
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 承接前面的将来行动，同时表达先知受命传话，故以“要”体现委任语气。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重节奏，不改写为较口语的“这样说”。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达אֲדֹנָי“主”和四字神名יהוה；“主耶和华”是简体中文圣经语域中清楚且庄重的复合称号。
- source_word: הַשֹּׁמֵעַ יִשְׁמָע
  choice: 听的人，任他听
  rationale: 保留分词与同根动词形成的重复结构；“任他”呈现许可或任凭语气，同时不把“听”扩充为“顺服”。
- source_word: וְהֶחָדֵל יֶחְדָּל
  choice: 不听的人，任他不听
  rationale: חדל本义为停止、罢休或不再做；在与“听”平行的语境中，译作“不听”最自然，也避免“拒绝”过度强调主观动机。原文形式也可作陈述性将来，另见脚注。
- source_word: כִּי בֵּית מְרִי הֵמָּה
  choice: 因为他们是悖逆之家
  rationale: 保留以西结书反复出现的“家”这一群体隐喻和“悖逆”的盟约性指控，不淡化为一般的“不听话的人”。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 至高的主；主上帝
  rationale: 原文明确含有יהוה，不宜只用称号取代神名；“主耶和华”同时保留复合称谓的两个成分。
- issue: יִשְׁמָע与יֶחְדָּל的语气
  choice: 按许可或任凭语气译作“任他听……任他不听”
  alternative: 按预测语气译作“听的人必听，不听的人必不听”
  rationale: 希伯来语未完成式在这种结构中可有意愿、许可或预测色彩。正文采用符合先知宣告语境的任凭语气，脚注保留预测读法，避免消除原文歧义。
- issue: “听”是否应解释为“顺服”
  choice: 保留“听”
  alternative: 听从；顺服
  rationale: שׁמע在语境中可能含回应和顺服之意，但原文仍用普通的“听”。正文不把潜在含义直接写成明确的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如此说”“悖逆之家”保留先知文学的正式语感；“使你开口”和“任他……”则避免生硬的逐字翻译。正文中的[a]、[b]均与脚注对应。
