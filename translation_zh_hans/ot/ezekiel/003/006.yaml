  to: 也不是差你到许多言语晦涩、语言难懂的民族那里[a]，你听不懂他们的话；若我差你到他们那里，他们倒会听你的话。
  rationale: 补出承接上文且由本节后半印证的“差你”，使中文句法完整；同时调整语序并校正脚注的字面释义。其余措辞保留原稿对复数族群、难懂言语及反讽性假设的忠实表达。
