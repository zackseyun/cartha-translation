  text: לֹ֣א אֶל עַמִּ֣ים רַבִּ֗ים עִמְקֵ֤י שָׂפָה֙ וְ/כִבְדֵ֣י לָשׁ֔וֹן אֲשֶׁ֥ר לֹֽא תִשְׁמַ֖ע דִּבְרֵי/הֶ֑ם אִם לֹ֤א אֲלֵי/הֶם֙ שְׁלַחְתִּ֔י/ךָ הֵ֖מָּה יִשְׁמְע֥וּ אֵלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/006.yaml
  text: not to many peoples of obscure speech and difficult language[a], whose words you cannot understand; surely, if I had sent you to them, they would listen to you.
translation:
  language: zh_hans
  text: 也不是差你到许多言语晦涩、语言难懂的民族那里[a]，你听不懂他们的话；若我差你到他们那里，他们倒会听你的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“嘴唇深、舌头沉重”，是形容言语难以理解的说法。
    reason: 说明原文的身体意象及其惯用含义；正文采用现代汉语中更易懂的表达。
lexical_decisions:
- source_word: עַמִּים רַבִּים
  choice: 许多……民族
  rationale: עַמִּים为复数，指多个族群或人民共同体；“民族”在现代汉语中自然，并保留其群体多元性。
- source_word: עִמְקֵי שָׂפָה
  choice: 言语晦涩
  rationale: 原文直译为“嘴唇深奥”，在此形容言语难以领会；“言语晦涩”既传达意义，也略微保留“深奥”的意象。
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: 语言难懂
  rationale: 原文直译为“舌头沉重”，与前句并列表达语言难以理解；采用自然现代汉语，避免误解为生理上的口吃。
- source_word: אֲשֶׁר לֹא תִשְׁמַע דִּבְרֵיהֶם
  choice: 他们的话是你听不懂的
  rationale: שׁמע在外语语境中指听而理解，不只是听见声音；“听不懂”准确而自然。
- source_word: אִם לֹא
  choice: 我若……倒会
  rationale: 这里引出带强调意味的假设；汉语以“若……倒会”表达反事实或对比性的语气，而不机械译作“若不”。
- source_word: שְׁלַחְתִּיךָ
  choice: 差你
  rationale: “差”简洁表达奉差遣前往，符合先知受派的语境，并保持庄重。
- source_word: הֵמָּה יִשְׁמְעוּ אֵלֶיךָ
  choice: 他们倒会听你的话
  rationale: שׁמע אֶל表示听从或认真听某人；“听你的话”保留回应性的含义，又不强化为完全“顺服”。
theological_decisions:
- issue: 外族是否必然顺服先知
  choice: 译作“他们倒会听你的话”
  alternative: 他们倒会顺服你
  rationale: 原文表达听取并有所回应，但并未明确断言完全顺服；避免加入超出原文的神学结论。
translation_notes:
  register: 采用现代、庄重且口语可懂的书面汉语。“也不是到……”承接上一节的差遣对象；分号保留原文前后对比。“倒会”自然呈现以色列与外族之间的反差和强调语气。
