  text: הִנֵּ֨ה נָתַ֧תִּי אֶת פָּנֶ֛י/ךָ חֲזָקִ֖ים לְ/עֻמַּ֣ת פְּנֵי/הֶ֑ם וְ/אֶֽת מִצְחֲ/ךָ֥ חָזָ֖ק לְ/עֻמַּ֥ת מִצְחָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/008.yaml
  text: Behold[a], I have made your face strong against their faces, and your forehead strong against their foreheads.
translation:
  language: zh_hans
  text: 看哪[a]，我已使你的脸刚硬，抵挡他们的脸；使你的额头刚硬，抵挡他们的额头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刚硬”所译的希伯来词也可译为“强韧”或“坚硬”；两处使用同一词根，表达先知面对反对时从上帝所得的坚定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 引出上帝郑重而强调的宣告，保留提醒听者注意的语气，也符合现代中文圣经文体。
- source_word: נָתַתִּי
  choice: 我已使
  rationale: 该动词本义为“给”，但在身体部位与形容词的结构中表达使之具有某种性质；译作“使”自然且贴近语义。
- source_word: פָּנֶיךָ
  choice: 你的脸
  rationale: 原词形态上为复数形式，却常指单数的“脸”；保留具体身体意象。
- source_word: חֲזָקִים
  choice: 刚强
  rationale: 此处可表示强韧、坚硬；“刚强”凸显上帝赐予先知面对敌意的坚定，又不带“顽梗”的负面判断。
- source_word: לְעֻמַּת
  choice: 好面对
  rationale: 表示面对面、与之相对；中文用“面对”既保留空间意象，也自然传达对抗情境。
- source_word: פְּנֵיהֶם
  choice: 他们的脸
  rationale: 保留原文复数所指的众人及其具体意象，并维持平行结构。
- source_word: מִצְחֲךָ
  choice: 你的额头
  rationale: 采用直接、通行的身体部位名称，保留原文有关坚定与对峙的形象。
- source_word: חָזָק
  choice: 坚硬
  rationale: 同一词根在此可指强韧或坚硬；配合“额头”译作“坚硬”较自然，并呈现本节刻意涉及硬度的语义张力。
- source_word: מִצְחָם
  choice: 他们的额头
  rationale: 保留原文具体比喻和两分句之间整齐的对应关系。
theological_decisions:
- issue: 上帝使先知的脸和额头强硬这一身体意象
  choice: 保留“脸”和“额头”的具体措辞，以“刚强／坚硬”表达上帝赐予的抗衡能力。
  alternative: 意译为“我使你比他们更顽强”或“我使你也同样顽梗”。
  rationale: 原文用身体意象描写先知在对抗中所得的坚定，并与上下文百姓的刚硬形成张力。保留意象可避免把上帝赐予的坚毅直接解释为带罪性的顽梗。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“看哪”保留宣告的郑重感；两分句尽量维持原文的脸／脸、额头／额头平行结构，同时用“刚强／坚硬”体现同一希伯来词在不同搭配中的自然中文表达。
