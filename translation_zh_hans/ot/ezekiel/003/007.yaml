reference: Ezekiel 3:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בֵ֣ית יִשְׂרָאֵ֗ל לֹ֤א יֹאבוּ֙ לִ/שְׁמֹ֣עַ אֵלֶ֔י/ךָ כִּֽי אֵינָ֥/ם אֹבִ֖ים לִ/שְׁמֹ֣עַ אֵלָ֑/י כִּ֚י כָּל בֵּ֣ית יִשְׂרָאֵ֔ל חִזְקֵי מֵ֥צַח וּ/קְשֵׁי לֵ֖ב הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/007.yaml
  text: But the house of Israel will not be willing to listen to you[a], because they are not willing to listen to me[b]; for all the house of Israel are hard of forehead and stubborn of heart.
translation:
  language: zh_hans
  text: 但以色列家不肯听你，因为他们不肯听我；因为以色列全家都是额头刚硬[a]、心里顽梗[b]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“额头刚硬”；这是形容厚颜、固执抗拒的希伯来语意象。
    reason: lexical_alternative
  - marker: b
    text: 或译“心里刚硬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֵית יִשְׂרָאֵל
  choice: 但以色列家
  rationale: ו 在上下文中表示转折，与前文可能肯听的外族人形成对比；“以色列家”保留原文的群体性和盟约性称谓。
- source_word: יֹאבוּ / אֹבִים
  choice: 不肯
  rationale: אָבָה 表示愿意或同意；“不肯”自然地保留意志上的抗拒，且未把含义扩展为行动层面的公然反叛。
- source_word: לִשְׁמֹעַ אֵלֶיךָ / לִשְׁמֹעַ אֵלָי
  choice: 听你／听我
  rationale: שׁמע 与 אֶל 连用表示听取某人的话；用同一表达保留先知与上帝之间的修辞平行，也避免直接译成“顺服”而过度解释。
- source_word: כִּי
  choice: 因为
  rationale: 两处 כִּי 均按因果或解释关系处理，使论证层次清楚，同时保留原文重复推进的结构。
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: 保留 כָּל 的整体性及“家”的集体表达，不擅自缩小为某些人或领袖。
- source_word: חִזְקֵי מֵצַח
  choice: 额头刚硬
  rationale: 直译原文“额头强硬／刚硬”的鲜明身体意象；该习语表达厚颜而固执的抗拒。
- source_word: וּקְשֵׁי לֵב
  choice: 心里顽梗
  rationale: 保留“心”作为意志和内在倾向所在的意象；“顽梗”清楚表达内心固执抗拒，避免与前句机械重复“刚硬”。
- source_word: הֵמָּה
  choice: 都是……的人
  rationale: 以汉语判断结构体现独立代词所加强的断言语气，并使两个并列描述自然落在全体之上。
theological_decisions:
- issue: 对以色列的整体性评断
  choice: 保留“以色列全家”的全面性说法
  alternative: 以色列家中许多人／以色列的领袖
  rationale: 原文明确使用 כָּל 作整体性的先知性定罪；译文不把范围缩小到经文没有点明的群体，也不消解其神学张力。
- issue: 不听先知与不听上帝的关系
  choice: 以完全平行的“不肯听你／不肯听我”呈现
  alternative: 不顺服你／不顺服我
  rationale: 原文将拒听先知直接归因于拒听差遣他的上帝；保留“听”的词义范围，使听闻与顺服之间的关系仍保持原文的含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以色列家”保留先知书的群体称谓；“额头刚硬、心里顽梗”兼顾原文平行结构、身体意象和现代可理解性。
