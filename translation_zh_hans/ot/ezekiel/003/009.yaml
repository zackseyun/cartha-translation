  text: כְּ/שָׁמִ֛יר חָזָ֥ק מִ/צֹּ֖ר נָתַ֣תִּי מִצְחֶ֑/ךָ לֹֽא תִירָ֤א אוֹתָ/ם֙ וְ/לֹא תֵחַ֣ת מִ/פְּנֵי/הֶ֔ם כִּ֛י בֵּֽית מְרִ֖י הֵֽמָּה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/009.yaml
  text: Like diamond[a], harder than flint, I have made your forehead. Do not fear them, and do not be dismayed before them, for they are a rebellious house.
translation:
  language: zh_hans
  text: 我已使你的额头像金刚石[a]，比燧石更坚硬。不要怕他们，也不要在他们面前惊惶，因为他们是悖逆之家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“坚石”；希伯来语“שָׁמִיר”可指一种极坚硬的石头或物质，确切所指不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמִיר
  choice: 金刚石
  rationale: 本节以硬度与燧石作比较，所指应是极坚硬的石质或物质，而非荆棘。“金刚石”在现代汉语中自然传达极高硬度，同时以脚注保留词义的不确定性。
- source_word: חָזָק מִצֹּר
  choice: 比燧石更坚硬
  rationale: 形容词与介词מִן构成比较，重点是硬度胜过燧石；此译准确保留比较关系及上下文意象。
- source_word: צֹר
  choice: 燧石
  rationale: 该词可指燧石或坚硬岩石；在硬度比喻中，“燧石”较为具体准确。
- source_word: מִצְחֶךָ
  choice: 你的额头
  rationale: 直译身体部位，保留上文所形成的刚强、不屈的身体意象。
- source_word: לֹא תִירָא אוֹתָם
  choice: 不要怕他们
  rationale: 未完成式在差遣语境中表达命令或保证；“不要怕他们”简洁自然。
- source_word: וְלֹא תֵחַת
  choice: 也不要……惊惶
  rationale: חתת的尼法勒形可表达被击垮、惊惶或丧胆；与“不要怕”并列时，“惊惶”兼顾心理冲击与现代可读性。
- source_word: מִפְּנֵיהֶם
  choice: 在他们面前
  rationale: 保留“在其面前／面对其临在”的希伯来语空间性表达，体现当面受威吓的处境。
- source_word: בֵּית מְרִי
  choice: 悖逆之家
  rationale: 保留以“家”指称群体的先知性、宗族性表达；“悖逆之家”比改译为“悖逆的百姓”更贴近原文的固定称谓。
theological_decisions:
- issue: 先知责备中对以色列的群体称谓
  choice: 悖逆之家
  alternative: 悖逆的百姓；反叛之家
  rationale: 原文使用“家”这一具有群体、家族与约民色彩的称谓。保留“家”可避免把这一重要意象解释性地弱化为一般的“百姓”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“额头”“燧石”“惊惶”保留先知书鲜明意象；“悖逆之家”略带经文语体，以保存以西结书反复出现的群体称谓。
