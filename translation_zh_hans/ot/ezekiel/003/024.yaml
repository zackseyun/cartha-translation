base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/024.yaml
  text: Then the Spirit entered into me and set me on my feet[a], and he spoke to me and said to me, “Go[b], shut yourself inside your house.”
translation:
  language: zh_hans
  text: 于是，灵进入我里面，使我站立起来[a]。他向我说话，说：“去[b]，把自己关在屋里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有一个灵进入我里面。”
    reason: 原文“灵”没有冠词，形式上可作不定理解；上下文则较支持指上帝的灵。
  - marker: b
    text: 原文直译：“来。”
    reason: 希伯来语 בּוֹא 的字面意思是“来”，但在本处命令的语境中，汉语说“去”更自然。
lexical_decisions:
- source_word: ר֔וּחַ
  choice: 灵
  rationale: 本节及《以西结书》的相近语境表明，这里最可能是指使先知得力的上帝之灵。中文“灵”既自然，也不必借助英文式大写来预先消除原文形式上的不确定性。
- source_word: וַ/תָּבֹא בִ֣/י
  choice: 进入我里面
  rationale: בוא 与介词 ב 连用，表示进入某人里面；此译法直接保留了原文的空间意象。
- source_word: וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י
  choice: 使我站立起来
  rationale: עמד 的使役式明确表达使先知站立；“使我站立起来”在现代汉语中庄重清楚，并保留使役含义。
- source_word: וַ/יְדַבֵּ֤ר אֹתִ/י֙ וַ/יֹּ֣אמֶר אֵלַ֔/י
  choice: 他向我说话，对我说
  rationale: 保留原文两个连续的言说表达及其对以西结说话的指向；虽略有重复，却符合先知文学的叙述语气。
- source_word: בֹּ֥א
  choice: 去
  rationale: 该词字面通常是“来”，但在这里引出进入自己房屋并闭门独处的命令，现代汉语用“去”更符合说话场景；脚注保留其字面形式。
- source_word: הִסָּגֵ֖ר
  choice: 把自己关在
  rationale: 该尼法勒式命令在此具有反身意味，命令以西结将自己闭居起来；“把自己关在”清楚自然。
- source_word: בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ
  choice: 屋里
  rationale: בְּתוֹךְ 在这里指房屋内部；“屋里”是准确、简洁且符合现代汉语习惯的表达。
theological_decisions:
- issue: ר֔וּחַ 的身份
  choice: 正文译作“灵”，按上下文理解为上帝的灵
  alternative: “有一个灵”或“某种灵”进入我里面
  rationale: 《以西结书》相邻段落反复描述灵使先知站立并推动先知行动，因此上帝的灵是最合语境的理解；不过希伯来文没有冠词，正文用不带额外限定的“灵”，并以脚注保留不定理解的可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“他向我说话，对我说”有意保留希伯来文的重复结构；引语中的命令则用自然汉语表达。所有脚注标记均已置于正文。
