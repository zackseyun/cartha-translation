base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/012.yaml
  text: 'Then the Spirit lifted me up, and I heard behind me a sound of a great rumbling: “Blessed be the glory of the LORD from his place.”'
translation:
  language: zh_hans
  text: 随后，灵[a]将我举起；我听见身后传来巨大的轰鸣声：“愿耶和华的荣耀从他的所在之处得称颂！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灵”所译的希伯来词也可译作“风”。
    reason: 保留 רוּחַ 在本节中的真实词义歧义。
lexical_decisions:
- source_word: רוּחַ
  choice: 灵
  rationale: 该词可指“灵”或“风”；本段叙事中它作为行动者将先知举起，因此正文译作“灵”，同时以脚注保留原词的语义幅度。
- source_word: קוֹל רַעַשׁ גָּדוֹל
  choice: 巨大的轰鸣声
  rationale: קוֹל 表示可听见的声音，רַעַשׁ 可指轰响、震动或喧响；“轰鸣声”自然传达强烈而宏大的听觉效果，又不具体限定声音来源。
- source_word: בָּרוּךְ
  choice: 愿……得称颂
  rationale: 这是颂赞式表达；用“愿……得称颂”保留希伯来语省略系词的祝颂语气，避免改写为单纯事实陈述。
- source_word: מִמְּקוֹמוֹ
  choice: 从他的所在
  rationale: 直译介词“从”和“他的所在”，保留这句话在空间关系及修饰归属上的凝练与张力。
theological_decisions:
- issue: רוּחַ 是否明确指上帝的灵
  choice: 正文译“灵”，不增添“上帝的”
  alternative: 译作“上帝的灵”或“风”
  rationale: 上下文支持具有行动能力的“灵”，但本节原文没有明说“上帝的”；因此不补入所有格，并用脚注说明“风”的词义可能。
- issue: 祝颂句中“从他的所在”的句法关系
  choice: 保留在句末，译作“愿耶和华的荣耀从他的所在得称颂”
  alternative: 解释为“从耶和华所在之处传来：‘他的荣耀当受称颂’”
  rationale: 原文没有显式说明声音由何处发出，也没有消除该介词短语与祝颂内容之间的紧密关系；本译文避免替原文作过度判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“随后”承接前文；分号区分先知被举起与听见声音两项动作。神名按中文圣经通行形式译作“耶和华”。
