base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/014.yaml
  text: And the Spirit lifted me up and took me away[a], and I went in bitterness, in the heat of my spirit[b], while the hand of Yahweh was strong upon me.
translation:
  language: zh_hans
  text: 灵把我举起，带走了我；我心中苦涩，灵里愤激地前行，雅威的手有力地临到我身上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרוּחַ
  choice: 灵
  rationale: רוּחַ可指“灵、风、气息”。上下文是异象中的先知被带走，正文以“灵”表达最为贴切，同时不加“圣”字，以免引入原文未明说的后期术语；脚注保留“一股灵”或“风”的可能。
- source_word: נְשָׂאַתְנִי
  choice: 将我举起
  rationale: נשׂא兼有举起、承载之意；“将我举起”保留具体的上举意象，并符合异象移动的语境。
- source_word: וַתִּקָּחֵנִי
  choice: 把我带走
  rationale: לקח基本义为“取、带”。与前面的“举起”连用时，“带走”自然呈现移动方向，又避免用“攫住”过度强化强制意味。
- source_word: וָאֵלֵךְ
  choice: 前行
  rationale: הלך通常指行走、前往；此处译作“前行”，自然衔接先知被带走后的行动。
- source_word: מַר
  choice: 心里苦涩
  rationale: מַר为“苦、苦涩”，在此作状态描述。“心里苦涩”以自然中文表达先知内在的痛苦，同时不把它限定为悲伤或怨愤。
- source_word: בַּחֲמַת רוּחִי
  choice: 灵里激愤
  rationale: חֵמָה可指热气、烈怒或激愤；“灵里激愤”传达强烈的内在激荡，并由脚注保留“怒气腾腾”等更偏愤怒的理解。רוּחִי译作“我的灵/灵里”，保持与句首רוּחַ的词汇呼应。
- source_word: וְיַד יְהוָה עָלַי חָזָקָה
  choice: 雅威的手强有力地按在我身上
  rationale: 保留“雅威的手”这一先知文学惯用意象，表达神强大的能力或驱使；“按在我身上”自然表达עַלַי，并体现חָזָקָה所含的强力。
theological_decisions:
- issue: 句首רוּחַ所指
  choice: 灵，按上下文主要理解为神的灵
  alternative: 一股灵；风
  rationale: 前后文描述异象中的超自然运送，神的灵是最连贯的理解；但希伯来词本身没有定冠词，且也可指风，因此正文不添加“神的”，并在脚注保留真实歧义。
- issue: בַּחֲמַת רוּחִי表达的情绪性质
  choice: 灵里激愤
  alternative: 我的灵怒气腾腾；我的灵炽热激荡
  rationale: 短语可表示怒气、愤激或炽烈的内在扰动。正文避免明确判定以西结是在向谁发怒，也不消除其苦涩与神强力驱使之间的张力。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译为“雅威”可保留专名性质，避免以称号替代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。正文保留“灵”在句首与“灵里”的词汇呼应，也保留“雅威的手”这一具体意象。标点将希伯来语连续叙事分为两句，以提升中文可读性而不改变事件顺序。
