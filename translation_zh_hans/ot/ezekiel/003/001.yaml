  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם אֵ֥ת אֲשֶׁר תִּמְצָ֖א אֱכ֑וֹל אֱכוֹל֙ אֶת הַ/מְּגִלָּ֣ה הַ/זֹּ֔את וְ/לֵ֥ךְ דַּבֵּ֖ר אֶל בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/001.yaml
  text: Then he said to me[a], “Son of man, eat what you find; eat this scroll, and go, speak to the house of Israel.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，吃你所找到的[a]；吃这书卷，然后去，向以色列家说话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凡你找到的”。这句话随即由“这书卷”具体说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 顺应希伯来叙事次序承接上文；中文无需机械译出连接词“然后”，语序本身即可自然推进叙事。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中这一反复出现的希伯来称呼及其“属人的一位”之意；“人子”也是中文圣经传统中透明而简洁的对应语。
- source_word: אֵת אֲשֶׁר תִּמְצָא
  choice: 把你找到的
  rationale: 贴近“你所找到的”这一关系结构，并在中文中自然地与“吃下去”搭配。语境表明所指是摆在先知面前的书卷。
- source_word: אֱכֹל אֱכוֹל
  choice: 吃下去；吃下
  rationale: 保留原文连续两次命令“吃”的重复和强调，不把它压缩成单一命令；同时采用自然现代汉语表达。
- source_word: מְגִלָּה
  choice: 书卷
  rationale: 准确指古代卷轴式书写载体；“书卷”比单说“卷”明确，也符合庄重而通俗的现代中文。
- source_word: וְלֵךְ
  choice: 然后去
  rationale: 表达命令的先后次序：吃下书卷，继而前去说话；不添加“离开”等原文没有的含义。
- source_word: דַּבֵּר
  choice: 说话
  rationale: 直接对应“说”，保留先知受命发言的基本含义，不增添“宣告”可能带入的解释性力度。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来文的集体性、盟约性惯用语“以色列家”，而不释义为“以色列百姓”。
theological_decisions:
- issue: 称呼 בֶּן אָדָם 中 אָדָם 的表达
  choice: 人子
  alternative: 凡人／世人之子
  rationale: 采用传统而贴近字面的“人子”，既保留原文意象，也不把这里的称呼直接解释成某一后期神学称号；在以西结书语境中，它突出受称呼者的人性。
- issue: 重复命令 אֱכֹל אֱכוֹל 的力度
  choice: 分别译出两次“吃”
  alternative: 合并为“务要吃下”
  rationale: 原文重复同时构成命令链条的一部分；保留重复可维持修辞力度及先泛指、后明确指向“这书卷”的张力。
translation_notes:
  register: 采用现代、庄重、易懂的简体中文。“人子”“书卷”“以色列家”保留关键希伯来意象和书卷传统用语；其余句法按自然汉语调整。原文 אֵת אֲשֶׁר תִּמְצָא 可理解为“把你找到的”或较概括的“凡你找到的”，但本句紧接“这书卷”，正文所选表达已能保留这一范围，故不另设脚注。
