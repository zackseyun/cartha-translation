  rationale: 作两处纯语言层面的润色：“放在你身上”更自然地表达原文“把绳索置于你身上”；“到他们中间去”更合现代汉语，并保留原文所表达的、不得进入众人中间的方向。其余关键含义、语体和原文的施事者含混均予保留。
