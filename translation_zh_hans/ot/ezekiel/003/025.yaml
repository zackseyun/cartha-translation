id: EZK.3.25
reference: Ezekiel 3:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנֵּ֨ה נָתְנ֤וּ עָלֶ֨י/ךָ֙ עֲבוֹתִ֔ים וַ/אֲסָר֖וּ/ךָ בָּ/הֶ֑ם וְ/לֹ֥א תֵצֵ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/025.yaml
  text: But you[a], son of man, behold, they will put ropes on you and bind you with them[b], so that you will not go out among them.
translation:
  language: zh_hans
  text: 至于你，人子啊，看哪，他们必把绳索放在你身上，又用这些绳索捆绑你，使你不能到他们中间去。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 以话题转换表达希伯来语的强调性连接结构，既承接上文，也突出对以西结本人的转向。
- source_word: בֶן אָדָם
  choice: 人子啊
  rationale: 这是书中对以西结一贯的称呼；保留希伯来语惯用表达及全书文学一致性，并用“啊”自然标示呼格。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知话语中郑重的引人注意标记，语体庄重而为现代读者所熟悉。
- source_word: נָתְנוּ
  choice: 他们必把……加在
  rationale: 该形式虽为完成式，但在预告语境及הִנֵּה之后可表达将来发生之事；保留未明确指认的复数施事者“他们”。
- source_word: עֲבוֹתִים
  choice: 绳索
  rationale: 指用于捆绑的粗绳或绳索；“绳索”清楚、庄重，也与后面的“捆绑”自然搭配。
- source_word: וַאֲסָרוּךָ
  choice: 捆绑你
  rationale: 直接表达אסר的基本意义，不扩大解释为“囚禁”。
- source_word: בָּהֶם
  choice: 用绳索
  rationale: 介词在此最自然地表示工具；为避免中文代词指向含混，复述“绳索”。
- source_word: וְלֹא תֵצֵא
  choice: 使你不能出去
  rationale: 在中文中自然表达捆绑所造成的结果；这里的“不能”呈现行动受阻，不额外说明其主观意愿。
- source_word: בְּתוֹכָם
  choice: 到他们中间
  rationale: 原义为“在他们中间／在他们当中”；与移动动词搭配时，“出去到他们中间”准确呈现方向，避免误译成“从他们中间出去”。
theological_decisions:
- issue: 未指明的复数主语是谁
  choice: 译作“他们”，不说明具体身份
  alternative: 明确译为百姓、上帝的使者，或采用无施事者的被动表达
  rationale: 希伯来文仅用第三人称复数，并未明确施事者；保留这一含混，避免把神圣代理或人的敌对行动强加给经文。
- issue: 捆绑造成的结果
  choice: 译作“使你不能出去到他们中间”
  alternative: 译作并列的“你也不出去”，或目的式“好叫你不出去”
  rationale: 上下文最自然地表明捆绑导致行动受限；“使”表达结果关系，但不进一步断定施事者的最终动机。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。“至于你，人子啊，看哪”保留先知话语的强调和郑重感；后半句使用自然汉语语序，同时避免明确希伯来文未说明的施事者身份。
