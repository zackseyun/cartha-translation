  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ בִּטְנְ/ךָ֤ תַֽאֲכֵל֙ וּ/מֵעֶ֣י/ךָ תְמַלֵּ֔א אֵ֚ת הַ/מְּגִלָּ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן אֵלֶ֑י/ךָ וָ/אֹ֣כְלָ֔/ה וַ/תְּהִ֥י בְּ/פִ֖/י כִּ/דְבַ֥שׁ לְ/מָתֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/003.yaml
  text: And he said to me[a], “Son of man, feed your belly and fill your inward parts with this scroll that I am giving you.” So I ate it, and it was in my mouth as sweet as honey.
translation:
  language: zh_hans
  text: 他对我说[a]：“人子啊，要把我赐给你的这书卷吃进肚腹，用它充满你的内里。”我就吃了；它在我口中甜如蜜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“人”“必死者”。希伯来语字面为“人的儿子”；这里保留“人子”，因为这是以西结书中对先知反复使用的称呼。
    reason: 说明希伯来语固定称呼的可能译法及其在以西结书中的功能，避免将“世人”误作本处单数称呼的对应译法。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的固定称呼，并贴近希伯来语“人的儿子”这一表达；这里强调先知是人，而不是神。
- source_word: בִּטְנְךָ תַאֲכֵל
  choice: 让你的肚腹吃下
  rationale: תַאֲכֵל 是使役形，译作“让……吃下”保留其使役意味；“肚腹”也维持吞吃书卷的具体身体意象。
- source_word: וּמֵעֶיךָ תְמַלֵּא
  choice: 使你的内里充满它
  rationale: מֵעֶה 指身体内部或内脏；“内里”在现代汉语中自然而不显粗俗，并与前面的“肚腹”形成对应。补出“它”以明确书卷是所充满的内容。
- source_word: הַמְּגִלָּה
  choice: 书卷
  rationale: 准确表示卷轴形式的书写载体，也是现代中文圣经语境中清楚、庄重的说法。
- source_word: נֹתֵן
  choice: 赐给
  rationale: 分词表达当下正在给予的行动；在神对先知说话的语境中，“赐给”自然体现给予者与领受者的关系。
- source_word: וָאֹכְלָה
  choice: 我就吃了
  rationale: “就”自然推进叙事，并表现以西结随即遵命；宾语由上文可知，中文无需重复。
- source_word: וַתְּהִי בְּפִי
  choice: 它在我口中
  rationale: 贴近原文的空间和感官表达，并以“它”明确指向书卷。
- source_word: כִּדְבַשׁ לְמָתוֹק
  choice: 甜如蜜
  rationale: 简洁自然地传达原文“像蜜一样甘甜”的比较及味觉感受。
theological_decisions:
- issue: 称呼 בֶּן אָדָם 中 אָדָם 的理解
  choice: 人子
  alternative: 世人；必死的人
  rationale: 本处是神对以西结反复使用的称呼，指出他的属人身份和有限性。“人子”既保留原文形式，也避免把 אָדָם 专名化为“亚当”；脚注列出功能性译法，以防读者将其直接等同于新约中的专称。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“肚腹—内里—口中”的身体意象和“甜如蜜”的鲜明味觉比喻；“让你的肚腹吃下”略带陌生感，是为保留希伯来语使役结构及其刻意具体的表达。
