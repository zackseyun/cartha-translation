reference: Ezekiel 3:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/אָמְרִ֤/י לָֽ/רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א הִזְהַרְתּ֗/וֹ וְ/לֹ֥א דִבַּ֛רְתָּ לְ/הַזְהִ֥יר רָשָׁ֛ע מִ/דַּרְכּ֥/וֹ הָ/רְשָׁעָ֖ה לְ/חַיֹּת֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/018.yaml
  text: When I say to the wicked man[a], ‘You shall surely die,’ and you do not warn him, and you do not speak to warn the wicked man from his wicked way so that he may live, that wicked man shall die in his iniquity[b], but I will require his blood from your hand.
translation:
  language: zh_hans
  text: 当我对恶人说：‘你必定死！’时，你若不警告他，也不开口警告那恶人离开他的恶道，使他可以存活，那恶人必死在自己的罪孽中[a]；但我要从你手中追讨他的血[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必死在自己的罪孽中”也可译作“必因自己的罪孽而死”或“必因自己的罪而死”。
    reason: lexical_alternative
  - marker: b
    text: “从你手中追讨他的血”是表示追究死亡责任的司法性说法，也可意译为“我要追究你对他死亡的责任”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: 我……说
  rationale: בְּ 加不定式结构在此引出时间或情境从句；中文用“我……说”配合后面的“如果”自然呈现这一关系。
- source_word: לָרָשָׁע
  choice: 对恶人
  rationale: רָשָׁע 指邪恶或有罪的人。中文“恶人”简洁、庄重，并保留单数个体指向。
- source_word: מוֹת תָּמוּת
  choice: 你必定死
  rationale: 不定式绝对形与未完成式连用，强化死亡的确定性；“必定死”准确而自然。
- source_word: הִזְהַרְתּוֹ
  choice: 警告他
  rationale: זהר 的使役形在本段表示发出警告；“警告”是现代汉语中最直接的对应表达。
- source_word: דִבַּרְתָּ לְהַזְהִיר
  choice: 开口警告
  rationale: 原文同时含“说话”和“警告”的目的关系。“开口警告”保留未发言这一层强调，又避免生硬重复。
- source_word: מִדַּרְכּוֹ הָרְשָׁעָה
  choice: 离开他的恶道
  rationale: 介词 מִן 表示从某处离开；דֶּרֶךְ 比喻行为方式。“恶道”保留道路意象，也与“恶人”形成词义呼应。
- source_word: לְחַיֹּתוֹ
  choice: 使他可以存活
  rationale: 该不定式可表达目的或结果；此译法保留“使其活着”的意向，不限定为纯肉体或纯属灵生命。
- source_word: בַּעֲוֺנוֹ
  choice: 在自己的罪孽中
  rationale: בְּ 可表示所处状态，也可能带有原因意味；直译“在……中”保留这种歧义，עָוֹן 译作“罪孽”兼顾罪行与罪责。
- source_word: דָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: 我要从你手中追讨他的血
  rationale: 保留“血”和“从你手中追讨”的司法性意象；中文“追讨”能传达要求承担责任的严肃含义。
theological_decisions:
- issue: 死亡与存活的范围
  choice: 直接译为“死”和“存活”，不限定为肉体或属灵意义
  alternative: 明确解释为肉体死亡，或明确解释为属灵死亡
  rationale: 原文没有在本节内作此限定；保留宽度可避免消解其盟约性、道德性和审判性的张力。
- issue: 恶人死亡与其罪孽的关系
  choice: 译作“必死在自己的罪孽中”
  alternative: 译作“必因自己的罪孽而死”
  rationale: 介词 בְּ 既可表达处境，也可能暗含原因。正文采用较贴近形式的译法，并以脚注提示因果性译法。
- issue: 守望者对恶人之血的责任
  choice: 保留“从你手中追讨他的血”的司法隐喻
  alternative: 明说“我要追究你对他死亡的责任”
  rationale: 具体的血债与手的意象构成本节神学和司法语言的重要部分，不宜在正文中完全释义化。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“恶人、恶道、罪孽、追讨他的血”保留原文反复、道路意象和司法色彩；标点与句法经过汉语化处理，以避免逐词硬译。
