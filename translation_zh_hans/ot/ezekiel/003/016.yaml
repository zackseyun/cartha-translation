base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/016.yaml
  text: And at the end of seven days[a], the word of Yahweh came to me, saying[b],
translation:
  language: zh_hans
  text: 七天期满的时候[a]，雅威的话[b]临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在此有“事情发生了”这一推进叙事的常用公式；正文按自然汉语译出。
    reason: lexical_alternative
  - marker: b
    text: 或译：“有从雅威而来的话临到我。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ……的时候；……临到
  rationale: 两个 וַיְהִי 都推进叙事。第一次与时间短语合译为自然的汉语结构，第二次由“临到”表达事件发生，避免生硬重复“事情发生了”。
- source_word: מִקְצֵה שִׁבְעַת יָמִים
  choice: 七天期满的时候
  rationale: מִקְצֵה 表示一段时期走到尽头；“期满的时候”既准确表达时间界点，也符合现代汉语叙事习惯。
- source_word: דְבַר יְהוָה
  choice: 雅威的话
  rationale: 保留希伯来语属格结构和先知书中的固定启示公式；同时用脚注注明也可按来源关系理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: אֵלַי
  choice: 临到我
  rationale: 与 דְבַר 和 היה 构成先知书常见表达，汉语“话临到我”庄重、简洁，并保留启示主动来到先知那里的意象。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文的直接话语；汉语以“说：”自然承接下一节内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”旨在保留专名，并较贴近通常重构的读音，不以“主”等称号替换。
- issue: דְבַר יְהוָה 的关系
  choice: 雅威的话
  alternative: 从雅威而来的话
  rationale: 正文保留原文名词构造的简洁和传统先知公式，同时用脚注保留将其理解为来源关系的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“七天期满的时候”自然表达希伯来语的时间界点；“雅威的话临到我”保留先知书启示公式。句末用冒号，因为 לֵאמֹר 引出下一节的直接话语。
