  text: and the sound of the wings of the living creatures touching one another[a], and the sound of the wheels beside them[c][b], and the sound of a great rumbling.
translation:
  language: zh_hans
  text: 又听见活物的翅膀彼此相接[a]的声音，以及活物旁边轮子的声音[b]，还有一阵巨大的轰鸣声[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“各自挨着她的姐妹”；这是表达彼此对应或接触的希伯来语惯用说法。
    reason: lexical_alternative
  - marker: b
    text: “旁边”也可译为“对面”或“相对之处”。
    reason: lexical_alternative
  - marker: c
    text: “轰鸣声”也可译作“巨响”或“震响”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: 声音
  rationale: 本节三次出现，指异象中听见的响声而非言语；译作“声音”自然且涵盖面适当。
- source_word: כַּנְפֵי הַחַיּוֹת
  choice: 活物翅膀
  rationale: 构造关系明确，指异象中那些活物的翅膀；“活物”也与《以西结书》上下文相符。
- source_word: מַשִּׁיקוֹת
  choice: 相碰
  rationale: 此处词义为接触、相接；用于翅膀时，“相碰”清楚传达画面，同时不采用容易误解的字面义“亲吻”。
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: 彼此
  rationale: 字面为“一个对着她的姐妹”，是表达相互对应或接触的希伯来语惯用说法；所指为翅膀，故以现代汉语“彼此”表达。
- source_word: הָאוֹפַנִּים
  choice: 轮子
  rationale: 在以西结的宝座异象中，该词指与活物相伴的轮子。
- source_word: לְעֻמָּתָם
  choice: 它们旁边
  rationale: 该短语描述轮子与活物的空间关系；可表示“在它们旁边”或“与它们相对”，正文采用较自然且符合异象画面的“旁边”，并以脚注保留另一可能。
- source_word: רַעַשׁ גָּדוֹל
  choice: 巨大的轰鸣声
  rationale: רַעַשׁ可指震动、隆隆声或喧响；在此听觉语境中，“轰鸣声”体现强烈而震撼的声响，又不限定为地震。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“又听见……的声音”承接异象叙述，并用“以及……还有……”清楚呈现原文三次קוֹל所引出的三重声响。所有词义不确定处均在脚注中保留。
