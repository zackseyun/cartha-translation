base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/015.yaml
  text: Then I came to the exiles at Tel-abib[a], who were living by the Kebar River, where they were living; and I sat there among them for seven days, appalled.
translation:
  language: zh_hans
  text: 于是，我来到提勒·亚毕的被掳之人那里，就是那些住在基巴河边、住在那里的人的地方；我在那里，在他们中间坐了七天，惊骇不已[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“震惊失神”或“惊愕”。这个希伯来词表示人因强烈冲击而陷入震骇的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹלָה
  choice: 被掳的人
  rationale: 这里指被迁徙到异地的群体，而不是抽象的“被掳”状态；“被掳的人”符合现代汉语圣经语境，也便于普通读者理解。
- source_word: תֵּל אָבִיב
  choice: 提勒·亚毕
  rationale: 作为古代地名按读音转写；中点标明复合地名，并避免与现代城市“特拉维夫”混同。
- source_word: הַיֹּשְׁבִים אֶל־נְהַר כְּבָר
  choice: 他们住在基巴河边
  rationale: יֹשְׁבִים表示定居、居住，אֶל在这里表达临近河道的位置关系；“住在……河边”自然清楚。כְּבָר按希伯来语音译为“基巴”。
- source_word: וַאֲשֶׁר הֵמָּה יוֹשְׁבִים שָׁם
  choice: 就住在那里
  rationale: 原文句法不顺且重复前面的“居住”；译文保留这种回环重复，不添加原文没有的“我看见”等内容。
- source_word: וָאֵשֵׁב שָׁם
  choice: 我……坐了
  rationale: 保留动词“坐”的具体姿态，而不解释性地改成“停留”；这也与先知受震骇而静坐的场景相合。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 在“坐了七天”的结构中自然表达持续时间。
- source_word: מַשְׁמִים
  choice: 惊骇不已
  rationale: 该词描述人受到强烈冲击、震骇甚至近乎失神的状态；“惊骇不已”比单纯的“惊讶”力度更强，同时不把具体原因或表现写死。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 准确表达身处这群人当中的空间和群体关系，现代汉语也自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文关于“住在那里”的明显重复，以反映希伯来文本的句法张力；地名采用音译。“惊骇不已”旁加注，呈现原词从震惊到失神的语义幅度。
