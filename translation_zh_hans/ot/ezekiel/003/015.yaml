  to: 于是，我来到提勒·亚毕的被掳之人那里，就是那些住在基巴河边、住在那里的人的地方；我在那里，在他们中间坐了七天，惊骇不已[a]。
  rationale: 修订以“提勒·亚毕的被掳之人”明确地名与群体的关系，并以“那些住在基巴河边、住在那里的人的地方”保留希伯来文居住语汇的重复和句法张力，同时使“我在那里”明确承接该地点。脚注改用现代书面语且不添加原文未明示的外在表情。
