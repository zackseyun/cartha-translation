    rationale: “他们住在基巴河边，就住在那里”中“就”无明确所承接的条件或转折，且“那里”指向不明。应将其处理为对提勒·亚毕／被掳者所在地的重复指示，并使“我在那里坐下”与之相连。
  - severity: low
    issue: 脚注替代译法的语体与语义偏窄
    rationale: “目瞪口呆”较口语，并暗示特定外显动作；原词可指震骇、惊愕或受冲击而失神，采用中性书面语更稳妥。
