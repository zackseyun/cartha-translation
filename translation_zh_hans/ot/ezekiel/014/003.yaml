base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/003.yaml
  text: Son of man[a], these men have set up their idols in their hearts and have placed the stumbling block of their iniquity before their faces[b]. Should I indeed let myself be consulted by them?
translation:
  language: zh_hans
  text: “人子啊，这些人把自己的偶像[a]立在心中，又把他们罪孽的绊脚石摆在自己面前。我岂真会让他们来求问我吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来词带有强烈的鄙夷和厌恶意味。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“我岂真会被他们求问吗？”希伯来文用重复词根的结构加强这个反问，暗示否定的答案。
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝称呼先知的固定用语；采用传统而自然的译法，以保留全书反复出现的先知性称谓。
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: 这些人
  rationale: 原文指上下文中的男性长老；现代汉语用“这些人”指称明确、自然，也不改变其上下文所指。
- source_word: הֶעֱלוּ
  choice: 立
  rationale: 该动词本义为“使上升、举起”，在此与偶像和“心中”连用，表达在内心设立、安置偶像；“立在心中”既简洁又保留原文意象。
- source_word: גִלּוּלֵיהֶם
  choice: 自己的偶像
  rationale: 该词是以西结常用、带强烈鄙夷色彩的偶像称谓。正文以清楚自然的“偶像”传达所指，并用脚注说明其贬斥语气。
- source_word: עַל לִבָּם
  choice: 在心中
  rationale: 介词字面可作“在……之上”，但这里表达内在的效忠和执着；现代汉语以“在心中”最为自然。
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: 使他们陷入罪孽的绊脚石
  rationale: מִכְשׁוֹל指使人绊倒或走向败亡之物，עָוֹן可指罪孽或罪责。此译保留“绊脚石”的鲜明比喻，并表达它与罪孽之间的紧密关系。
- source_word: נָתְנוּ נֹכַח פְּנֵיהֶם
  choice: 摆在自己面前
  rationale: 保留原文空间意象，表现他们有意将导致犯罪和败亡之物置于眼前、以之为念。
- source_word: הַאִדָּרֹשׁ אִדָּרֵשׁ לָהֶם
  choice: 我岂真会让他们来求问我吗？
  rationale: דרש的尼法勒式在此指上帝受人求问；同词根的不定式绝对形与未完成式连用，加强反问语气。“岂真会”传达其强调和预期的否定答案，却不把反问改写成原文没有明说的直接拒绝。
theological_decisions:
- issue: 上帝是否回应心存偶像却前来求问的人
  choice: 以加强的反问“我岂真会让他们来求问我吗？”表达预期的否定回答
  alternative: 我会让他们来求问我吗？／我岂会被他们求问呢？
  rationale: 原文用不定式绝对形加强尼法勒未完成式，形成强烈反问；译文保留上帝拒绝受其求问的含义，同时不擅自增添一个明说的“不”。
- issue: מִכְשׁוֹל与עָוֹן之间的关系
  choice: 译为“使他们陷入罪孽的绊脚石”
  alternative: 他们罪孽的绊脚石／使他们担当罪责的绊脚石
  rationale: 原文的属格结构可涉及罪孽、罪责及导致败亡的关联。正文采用现代汉语可理解的表达，但仍以“绊脚石”保留其道德危险和败亡意象，不将其等同于某一套特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“人子”“绊脚石”等贯穿先知书的重要意象；反问句保持原文的强调和神学张力。脚注标记按其实际说明对象分别置于“偶像”和末句反问之后。
