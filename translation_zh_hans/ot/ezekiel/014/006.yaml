language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה שׁ֣וּבוּ וְ/הָשִׁ֔יבוּ מֵ/עַ֖ל גִּלּֽוּלֵי/כֶ֑ם וּ/מֵ/עַ֥ל כָּל תּוֹעֲבֹתֵי/כֶ֖ם הָשִׁ֥יבוּ פְנֵי/כֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/006.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: Turn back, and turn away from your idols[b], and turn your faces away from all your abominations.’'
translation:
  language: zh_hans
  text: 所以，你要对以色列家说：‘主耶和华如此说：你们要回转，离开你们的偶像；要转脸离开你们一切可憎之物。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的责备并引出结论；“所以”在现代汉语中自然清楚。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留原文作为圣约群体和民族整体的称谓，不简化为“以色列人”。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 采用庄重而通行的先知宣告句式，并将 אֲדֹנָי 与神名 יהוה 的组合分别表达为“主”和“耶和华”。
- source_word: שׁוּבוּ
  choice: 回转
  rationale: 保留 שׁוב 的方向性意象，同时在先知语境中自然传达悔改、归回之意。
- source_word: וְהָשִׁיבוּ מֵעַל גִּלּוּלֵיכֶם
  choice: 离开你们的偶像
  rationale: 该使役形式表达使自己转离；现代汉语以“离开”简洁传达与偶像断绝的要求。
- source_word: גִּלּוּלֵיכֶם
  choice: 你们的偶像
  rationale: 表达该词在本节中的稳定所指；其贬斥色彩由先知语境和后文“可憎之物”共同体现，避免以过度字源化的译法干扰理解。
- source_word: תּוֹעֲבֹתֵיכֶם
  choice: 你们一切可憎之物
  rationale: 兼顾该词所含宗教与道德上的厌恶意味，并保留原文较宽泛的所指，不限缩为行为或器物。
- source_word: הָשִׁיבוּ פְנֵיכֶם
  choice: 要转脸离开
  rationale: 保留“脸”的具象表达，呈现有意改变朝向、彻底弃绝的动作。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”在现代中文圣经语域中庄重且易懂，既区分称号 אֲדֹנָי 与专名 יהוה，也避免将神名泛化为普通称谓。
- issue: שׁוּבוּ 的悔改含义
  choice: 回转
  alternative: 悔改；归回
  rationale: “回转”保留原文的空间性比喻及其圣约语境中的悔改意味，不把词义收窄为抽象的宗教术语。
translation_notes:
  register: 采用现代、庄重而清楚的先知文体。“回转—离开—转脸离开”保留原文反复出现的转向意象；句法略作汉语化处理，但维持命令的力度和并列推进。
