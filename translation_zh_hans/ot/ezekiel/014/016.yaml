base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/016.yaml
  text: Even if these three men were in its midst[a], as I live, declares the Lord GOD, they would deliver neither sons nor daughters; they alone would be delivered, and the land would become a desolation.
translation:
  language: zh_hans
  text: 即使这三个人在其中，主雅威说：“我指着我的永生起誓，他们也不能救儿子或女儿[a]；只有他们自己必蒙拯救，那地必成为荒凉之地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“若儿子，若女儿，他们也不能救。”在此自誓语境中，这一表达意为他们不能救任何儿子或女儿。
    reason: 说明自誓结构中重复“若”的惯用否定意义，避免将其误解为普通条件句。
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: 这三个人
  rationale: 准确保留数目和指示含义；上下文所指是三位男性人物，但现代汉语用“人”比“三个男人”更自然庄重，且不改变所指。
- source_word: בְּתוֹכָהּ
  choice: 在其中
  rationale: 保留阴性单数后缀对前文所述地方的回指，同时不擅自限定为城或地。
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是先知文体中的庄严自誓公式；如此译法比直译“我活着”更清楚地表达其誓言功能。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם译作“宣告”以保留先知性的发言公式；יְהוִה音义传统处理为“耶和华”，并以“主耶和华”自然对应复合称号。
- source_word: אִם בָּנִים וְאִם בָּנוֹת יַצִּילוּ
  choice: 他们也不能救出儿子或女儿
  rationale: 两个אִם位于否定性誓言结构中，表达断然否定，而非普通条件句；“救出”适合灾难审判语境，也与下句同一词根的被动形式保持联系。
- source_word: הֵמָּה לְבַדָּם יִנָּצֵלוּ
  choice: 只有他们自己能获救
  rationale: “只有……自己”传达独立代词与לְבַדָּם的双重强调；“获救”自然表达Niphal被动意义。
- source_word: וְהָאָרֶץ תִּהְיֶה שְׁמָמָה
  choice: 而那地必变为荒场
  rationale: “变为”保留תִּהְיֶה的结果性，“荒场”保留שְׁמָמָה的名词性质及审判后荒废的图景。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是现代中文圣经语境中广为识别的专名形式，可保留盟约之名与אֲדֹנָי“主”的区别；不以“上帝”替代专名。
- issue: 义人能否使儿女免受审判
  choice: 直陈他们不能救出儿子或女儿，只有自己获救
  alternative: 将儿女泛化为任何其他人
  rationale: 原文明确提到儿子和女儿，并强调个人获救的界限；译文保留这一尖锐张力，不进一步推定这些儿女是否必为他们亲生，也不扩展为系统教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。破折号标明插入的神谕宣告公式，使长句层次清晰；不添加原文没有的脚注标记。
