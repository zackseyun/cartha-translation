  text: וְ/הַ/נָּבִ֤יא כִֽי יְפֻתֶּה֙ וְ/דִבֶּ֣ר דָּבָ֔ר אֲנִ֤י יְהוָה֙ פִּתֵּ֔יתִי אֵ֖ת הַ/נָּבִ֣יא הַ/ה֑וּא וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עָלָ֔י/ו וְ/הִ֨שְׁמַדְתִּ֔י/ו מִ/תּ֖וֹךְ עַמִּ֥/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/009.yaml
  text: And if the prophet is deceived and speaks a word[a], I, Yahweh, have deceived that prophet; and I will stretch out my hand against him and destroy him from the midst of my people Israel.
translation:
  language: zh_hans
  text: 若那先知受迷惑而说了话[a]，我——耶和华——使那先知受迷惑；我必伸手攻击他，将他从我民以色列中除灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使那先知受迷惑”也可译作“引诱那先知”。有人按许可的意义理解为“任凭那先知受迷惑”。
    reason: פתה在本节可含“迷惑、引诱”之义；“任凭”是基于语境的解释，并非动词形式本身所明说，故列作备选而不置于正文。
lexical_decisions:
- source_word: יְפֻתֶּה
  choice: 受了迷惑
  rationale: פתה的Pual被动式表示先知陷入迷惑或诱惑之中。“受了迷惑”在现代汉语中自然，并保留被动含义及审判语境。
- source_word: וְדִבֶּר דָּבָר
  choice: 说出话来
  rationale: 原文直译为“说一个话/言语”。此处用“说出话来”保留简洁的先知性措辞，不擅自把דָּבָר限定为某种特定信息。
- source_word: אֲנִי יְהוָה
  choice: 是我耶和华
  rationale: 独立代词אֲנִי与神名并用，带有强调意味；“是我耶和华”在汉语中明确保留这一强调。
- source_word: פִּתֵּיתִי
  choice: 迷惑了
  rationale: 这里是פתה的Piel完成式，主语为耶和华，与前面的同根被动动词相呼应。正文保留直接施事表达，不将其弱化为“容许受迷惑”。
- source_word: וְנָטִיתִי אֶת יָדִי עָלָיו
  choice: 我必伸手攻击他
  rationale: 保留“伸手”的圣经意象，同时以“攻击”表达עַל在审判语境中的敌对方向。
- source_word: וְהִשְׁמַדְתִּיו
  choice: 把他……除灭
  rationale: שׁמד的Hiphil表示毁灭、消灭；“除灭”力度充分，也与下文从群体中除去的语境相称。
- source_word: מִתּוֹךְ עַמִּי יִשְׂרָאֵל
  choice: 从我的以色列民中
  rationale: 自然表达“从……中间”的含义，并保留“我的民以色列”这一归属关系；汉语调整为“我的以色列民”以求流畅。
theological_decisions:
- issue: 耶和华在先知受迷惑之事上的主动作用
  choice: 正文直译为“是我耶和华迷惑了那先知”
  alternative: “是我耶和华引诱了那先知”或“是我耶和华任凭那先知受迷惑”
  rationale: 希伯来文明确以耶和华为פתה之Piel动词的主语，且与上半句的同根被动式呼应。正文保留这种直接陈述及其神学张力，不用许可性解释取代原文；可能的词义差别放入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“耶和华”“伸手”等经文用语和意象；正文以直接措辞保存原文有关神圣审判与主动作用的张力。
