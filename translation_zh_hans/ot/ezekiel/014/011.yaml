source:
  edition: WLC
  text: לְ֠מַעַן לֹֽא יִתְע֨וּ ע֤וֹד בֵּֽית יִשְׂרָאֵל֙ מֵ/אַֽחֲרַ֔/י וְ/לֹֽא יִטַּמְּא֥וּ ע֖וֹד בְּ/כָל פִּשְׁעֵי/הֶ֑ם וְ/הָ֥יוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/011.yaml
  text: so that the house of Israel may no longer go astray from me[a], and may no longer defile themselves with all their transgressions, but may be my people, and I may be their God, declares the Lord GOD.
translation:
  language: zh_hans
  text: 好使以色列家不再偏离我[a]，不再因他们的一切悖逆玷污自己，得以作我的子民，我也作他们的神。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从我之后迷失（走偏）”；“在……之后”是表示跟从某人的习语。
    reason: 保留希伯来语“从我之后”的字面表达及其“离开跟从我”的习语含义，同时使中文说明自然准确。
lexical_decisions:
- source_word: לְמַעַן
  choice: 好使
  rationale: 引出目的或预期结果；“好使”既保留目的意味，也符合现代汉语经文语体。
- source_word: יִתְעוּ מֵאַחֲרַי
  choice: 不再偏离我
  rationale: תעה表示迷失、走偏，מֵאַחֲרַי直译为“离开在我之后”，在此指偏离对耶和华的跟从；正文采用自然简洁的汉语，并以脚注保留其跟从意象。
- source_word: יִטַּמְּאוּ
  choice: 玷污自己
  rationale: 该动词形态表达主体使自己沾染污秽；“玷污自己”保留其反身意义，也兼容礼仪与道德层面的污秽。
- source_word: בְּכָל פִּשְׁעֵיהֶם
  choice: 因他们的一切悖逆
  rationale: פשע常含反叛、越界之意；“悖逆”保留其强烈的背约色彩，介词译作“因”表明这些行为是自我玷污的缘由或手段。
- source_word: וְהָיוּ לִי לְעָם
  choice: 他们要作我的子民
  rationale: 采用自然的汉语盟约公式，保留神与子民之间的归属关系；“要”在目的结构中表达预期结果。
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: 我也要作他们的神
  rationale: 与前句构成对称的盟约公式；“也”自然呈现双方关系，而不额外扩充神学含义。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知性宣告公式；“宣告”庄重而清楚。אֲדֹנָי译作“主”，专名יהוה按中文传统音译作“耶和华”，避免把两个称号合并。
theological_decisions:
- issue: 盟约公式的表达
  choice: 他们要作我的子民，我也要作他们的神
  alternative: 他们要成为归我的民，我要成为归他们的神
  rationale: 选文保留希伯来语标准盟约公式的相互归属意义，同时采用现代汉语中自然、庄重的表达，不加入文本以外的教义说明。
- issue: 目的结构与盟约应许之间的语气
  choice: 好使……他们要……我也要……
  alternative: 使他们可以作……我也可以作……
  rationale: לְמַעַן统摄本节，带有目的或结果意味；汉语以“好使”明确这一关系，而后用“要”避免“可以”可能带来的仅表许可之意，并保留应许语气与目的语气之间的张力。
- issue: 神名与尊称的并列
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时有尊称אֲדֹנָי和神名יהוה；正文将两者分别译出，不把神名泛化为普通称号。采用现代中文读者熟悉的“耶和华”，同时不改变原文的双重称谓结构。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句首“好使”承接上文并保持本节作为目的陈述的性质；分号划分除去悖逆与恢复盟约关系两个层面。正文避免生硬照搬“从我后面迷失”，脚注则保留原文意象。
