id: EZK.14.14
reference: Ezekiel 14:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/הָיוּ שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ בְּ/תוֹכָ֔/הּ נֹ֖חַ דנאל וְ/אִיּ֑וֹב הֵ֤מָּה בְ/צִדְקָתָ/ם֙ יְנַצְּל֣וּ נַפְשָׁ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/014.yaml
  text: even if these three men were in its midst—Noah[a], Daniel, and Job—they would deliver only themselves by their righteousness, declares the Lord GOD.
translation:
  language: zh_hans
  text: 即使这三个人——挪亚、但以理[a]和约伯——身在其中，他们也只能凭自己的义保全自己的性命。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “但以理”：希伯来文作 דנאל，也可音译为“达内勒”。有人认为这里指古代近东文献中的人物达内勒，而不是圣经中的但以理。
    reason: 保留希伯来文拼写及人物身份上的真实歧义。
lexical_decisions:
- source_word: וְהָיוּ
  choice: 即使……身在
  rationale: 结合上下文的审判条件句，将 waw + qatal 译为让步假设“即使”，比直译“并且他们在”更准确自然。
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: 这三个人
  rationale: 忠实保留数目与指示意义；现代汉语中“人”自然且无需刻意标示语法性别。
- source_word: בְּתוֹכָהּ
  choice: 身在其中
  rationale: 阴性单数后缀指上下文中受审判之地；“身在其中”自然表达处于该地之内。
- source_word: נֹחַ
  choice: 挪亚
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: דנאל
  choice: 但以理
  rationale: 正文采用中文圣经传统上熟悉的名称；辅音拼写可能对应“达内勒”的问题由脚注保留。
- source_word: וְאִיּוֹב
  choice: 和约伯
  rationale: 采用通行中文人名，并保留连接词。
- source_word: הֵמָּה
  choice: 他们
  rationale: 独立代词带强调；其强调作用与后文“只能……自己的”共同体现。
- source_word: בְצִדְקָתָם
  choice: 凭自己的义
  rationale: צְדָקָה 此处指个人的正直、公义；“凭”准确表达工具或依据关系，不额外引入系统神学含义。
- source_word: יְנַצְּלוּ
  choice: 救出
  rationale: נצל 表示从危险或审判中解救、搭救；“救出”保留具体脱险含义，也避免不必要地扩大为完整的救恩概念。
- source_word: נַפְשָׁם
  choice: 自己的性命
  rationale: נֶפֶשׁ 在此指他们本人或生命；“自己的性命”兼顾词义和上下文中不能救别人的排他重点。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 是先知性宣告公式；אֲדֹנָי 译“主”，神名 יהוה 按中文通行形式译“耶和华”，并避免含混的“主主”。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 分别体现 אֲדֹנָי 的“主”和 יהוה 的专名性质；“主耶和华”在现代中文圣经语境中庄重而易懂，也没有把神名消隐为普通称号。
- issue: דנאל 所指人物的身份
  choice: 正文译“但以理”，脚注保留“达内勒”及另一种身份理解
  alternative: 正文直接译“达内勒”
  rationale: 希伯来文此处的拼写缺少通常见于“但以理”的 yod，存在指向古代近东人物达内勒的可能；正文沿用读者熟悉的传统译名，同时用脚注保存真实的文本与身份歧义。
- issue: 人的义所能施救的范围
  choice: 他们也只能凭自己的义救出自己的性命
  alternative: 他们必因自己的义救自己的性命
  rationale: 上下文强调三位义人不能救别人，只有自己得以脱险；“只能”明确表达这一语境中的限制，却不把经文扩展为关于称义或永恒救恩机制的命题。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“即使……也只能……”清楚呈现让步条件和限制关系；“这是主耶和华的宣告”保留先知宣告公式。脚注标记已在正文“但以理[a]”处对应出现。
