base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/002.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 此处是先知书常见的叙事承接形式；与后面的“话”合译为“话临到”，既自然，也完整表达事件的发生。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定先知性表达中，“话”保留了原词的词汇与神学分量，比“信息”更少解释性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，避免改作泛称“主”。
- source_word: אֵלַי
  choice: 到我
  rationale: 结合中文固定表达“临到我”，准确传达介词加第一人称单数后缀的方向意义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出随后直接言语的惯用形式；中文以“说”简洁、自然地保留其功能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最通行、最易识别的专名“耶和华”，同时不以“主”这一称号替代神名。
translation_notes:
  register: 采用现代、庄重而清晰的先知书叙述语体。“耶和华的话临到我，说”是自然且广为理解的中文公式表达；不添加原文没有的解释，也不使用古雅的“有……的话说”等句式。
