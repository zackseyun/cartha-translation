id: EZK.14.21
reference: Ezekiel 14:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר אֲדֹנָ֣/י יְהֹוִ֗ה אַ֣ף כִּֽי אַרְבַּ֣עַת שְׁפָטַ֣/י הָ/רָעִ֡ים חֶ֠רֶב וְ/רָעָ֞ב וְ/חַיָּ֤ה רָעָה֙ וָ/דֶ֔בֶר שִׁלַּ֖חְתִּי אֶל יְרוּשָׁלִָ֑ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/021.yaml
  text: 'For thus says the Lord GOD: How much more when I send my four disastrous judgments against Jerusalem—sword and famine and wild beasts and plague—to cut off from it man and beast![a][b]'
translation:
  language: zh_hans
  text: 因为主耶和华如此说：“何况我把我的四项带来灾祸的审判——刀剑、饥荒、凶恶的野兽和瘟疫——降在耶路撒冷，要从其中剪除人和牲畜呢！[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带来灾祸的审判”也可译作“严厉的审判”。这里的希伯来语形容词可表示“有害的”或“造成灾难的”，并非指上帝的审判在道德上邪恶。
    reason: lexical_alternative
  - marker: b
    text: “瘟疫”也可译作“疫病”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号，并以现代中文圣经语体中自然、庄重的形式音译上帝的圣名。
- source_word: אַף כִּי
  choice: 何况……呢
  rationale: 本句承接上文较轻的情形，构成由轻到重的推论；“何况”准确传达加强语气，而非普通条件句。
- source_word: אַרְבַּעַת שְׁפָטַי הָרָעִים
  choice: 我的四样灾难性审判
  rationale: שְׁפָטַי 指上帝施行的刑罚性审判；הָרָעִים 在此表示带来灾祸、伤害，而非道德上的邪恶。“灾难性”保留其后果与力度。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 保留先知审判用语的具体意象，不将其抽象化为“战争”。
- source_word: רָעָב
  choice: 饥荒
  rationale: 符合盟约审判语境，也比“饥饿”更准确地指群体性的灾难。
- source_word: חַיָּה רָעָה
  choice: 凶猛的野兽
  rationale: 该短语指会伤害人的危险野兽；如此译法避免把动物说成具有道德上的“邪恶”。
- source_word: דֶבֶר
  choice: 瘟疫
  rationale: 现代中文自然且符合先知书灾祸语境；也可译为“疫病”。
- source_word: שִׁלַּחְתִּי
  choice: 降在
  rationale: 虽为完成式，但在 אַף כִּי 引出的宣告中表达设想或将要施行的行动；“降在”自然体现灾祸由上帝发出并临到耶路撒冷。
- source_word: לְהַכְרִית
  choice: 剪除
  rationale: 保留希伯来语审判和盟约语境中的强烈惯用表达，含彻底除灭之意。
- source_word: אָדָם וּבְהֵמָה
  choice: 人和牲畜
  rationale: 这是固定的全面审判表达，涵盖人类与驯养动物；中文“人和牲畜”简洁自然。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中上帝圣名的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: 原文明确使用四字神名；译作“耶和华”保留其专名性质，同时“主耶和华”在中文中庄重而易懂。
- issue: הָרָעִים 是否暗示上帝的审判具有道德邪恶
  choice: 灾难性
  alternative: 严厉的；有害的
  rationale: 此处形容审判所带来的灾祸，不是在评价上帝的道德属性；因此避免直译为“邪恶的”，同时保留原词负面而强烈的语义。
- issue: אַף כִּי 的逻辑关系
  choice: 何况
  alternative: 即使；诚然，当
  rationale: 上下文由上一节的土地审判推进到耶路撒冷所受的四重审判，是由轻到重的加强论证；“何况”既保留修辞张力，也不将其误解为让步条件。
translation_notes:
  register: 采用现代、庄重而清晰的普通话书面语。以破折号列出四样审判，保存原文的累积力度；用“何况……呢”连接上文的由轻到重推论。保留“刀剑”“剪除”等先知书审判意象，但避免过度古雅。
