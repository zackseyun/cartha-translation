  text: לֽוּ חַיָּ֥ה רָעָ֛ה אַעֲבִ֥יר בָּ/אָ֖רֶץ וְ/שִׁכְּלָ֑תָּ/ה וְ/הָיְתָ֤ה שְׁמָמָה֙ מִ/בְּלִ֣י עוֹבֵ֔ר מִ/פְּנֵ֖י הַ/חַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/015.yaml
  text: If I cause dangerous wild animals to pass through the land[a], and they bereave it, and it becomes a desolation, without anyone passing through because of the animals[b],
translation:
  language: zh_hans
  text: 假如我使凶猛的野兽[a]经过那地，使那地丧子[b]，那地就成为荒凉之地，因这些野兽无人经过，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“危险的野兽”。原文直译为“恶的兽”，是指各种会伤害人的野兽的集合表达。
    reason: lexical_alternative
  - marker: b
    text: 或译“使那地失去儿女”。原文把那地人格化，描写它失去其中的居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֽוּ
  choice: 假如
  rationale: 引出这一审判段落中的假设条件；“假如”在现代汉语中自然，也保留了未完条件句的语气。
- source_word: חַיָּה רָעָה
  choice: 凶猛的野兽
  rationale: 阴性单数在此作集合表达，指会伤害人的野生兽类；“凶猛”清楚传达其危险性，又避免把 רָעָה 误解为动物具有道德上的邪恶。
- source_word: אַעֲבִיר בָּאָרֶץ
  choice: 我使……遍行那地
  rationale: 保留 עבר 的使役形所表达的上帝主动施行审判，并以“遍行”自然呈现穿行全地的动态意象。
- source_word: וְשִׁכְּלָתָּהּ
  choice: 使那地丧失儿女
  rationale: שׁכל 的核心意象是丧子、失去后代；这里把土地人格化为失去其居民者。译文保留这一意象，不直接弱化为“使其无人居住”。
- source_word: וְהָיְתָה שְׁמָמָה
  choice: 以致那地荒凉
  rationale: 准确表达先知审判语境中的荒废状态；“以致”使结果关系符合现代汉语表达。
- source_word: מִבְּלִי עוֹבֵר
  choice: 无人经过
  rationale: 自然表达完全没有过路之人的情形。
- source_word: מִפְּנֵי הַחַיָּה
  choice: 因这些野兽
  rationale: מִפְּנֵי 在此表示原因；“这些”回指前文作为集合概念的野兽。
theological_decisions:
- issue: 上帝在审判中的主动作用
  choice: “我使凶猛的野兽遍行那地”
  alternative: “我容许凶猛的野兽进入那地”或“我把野兽派到那地”
  rationale: 希伯来文使用使役形，明确以上帝为行动主体；译文不将其淡化为单纯许可，同时以“使……遍行”保留原文动作意象。
- issue: 土地丧子的拟人表达
  choice: “使那地丧失儿女”
  alternative: “使那地人口断绝”或“使那地无人居住”
  rationale: 原文把土地描写成丧失儿女，具有鲜明的拟人和审判张力；正文保留该意象，并由脚注说明其所指。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文假设条件尚未结束的结构，因此句末使用逗号；“丧失儿女”刻意保留土地被人格化的先知性意象，并通过脚注帮助普通读者理解。
