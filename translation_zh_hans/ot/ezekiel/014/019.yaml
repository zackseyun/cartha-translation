id: EZK.14.19
reference: Ezekiel 14:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: א֛וֹ דֶּ֥בֶר אֲשַׁלַּ֖ח אֶל הָ/אָ֣רֶץ הַ/הִ֑יא וְ/שָׁפַכְתִּ֨י חֲמָתִ֤/י עָלֶ֨י/הָ֙ בְּ/דָ֔ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/019.yaml
  text: Or if I send a plague against that land and pour out my wrath on it with blood[a], to cut off from it man and beast,
translation:
  language: zh_hans
  text: 或者，我若使瘟疫临到那地，以血[a]把我的烈怒倾倒在那地，从其中除灭人和牲畜，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以流血杀戮”。希伯来文直译为“以血”或“在血中”。
    reason: 说明בְּדָם的介词关系和“血”的具体含义存在真实的词义与句法含混。
lexical_decisions:
- source_word: אוֹ
  choice: 或者，我若
  rationale: 本节继续13、15、17、19节的一系列假设性审判情形；“或者，我若”既表达另一个选项，也在现代汉语中明确条件意味。
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 指作为神审判而临到的疫病；“瘟疫”准确、自然，也保留其严重性。
- source_word: אֲשַׁלַּח אֶל הָאָרֶץ הַהִיא
  choice: 使瘟疫临到那地
  rationale: אֶל本义为“向、到”；结合“差遣”瘟疫的语境，译作“使……临到”符合现代汉语，并保留灾祸指向那地的含义。
- source_word: וְשָׁפַכְתִּי חֲמָתִי עָלֶיהָ
  choice: 把我的烈怒倾倒在那地
  rationale: 保留“倾倒烈怒”的鲜明意象；重复“那地”比代词“其上”更自然，也清楚指明所指。
- source_word: בְּדָם
  choice: 以血
  rationale: 希伯来文措辞简短，介词的具体关系存在解释空间。“以血”贴近原文，并用脚注说明可理解为流血杀戮，避免在正文中完全消解其含混性。
- source_word: לְהַכְרִית מִמֶּנָּה
  choice: 从其中除灭
  rationale: כרת的使役形在审判语境中表示使之断绝或消灭；“除灭”自然庄重，“从其中”准确对应从那地除去。
- source_word: אָדָם וּבְהֵמָה
  choice: 人和牲畜
  rationale: 这是表示人类与动物一同遭受全面灾难的固定搭配；“人”是泛指全人类，“牲畜”符合בְּהֵמָה在此类对举中的通常范围。
theological_decisions:
- issue: אָדָם在审判套语中的泛指意义
  choice: 人
  alternative: 人类
  rationale: 此处אָדָם与בְּהֵמָה对举，泛指所有人，并非专指男性。“人和牲畜”简洁自然，也保留希伯来语套语的力度。
- issue: בְּדָם与神烈怒的关系
  choice: 正文译“以血”，保留其压缩而含混的表达
  alternative: 以流血杀戮／借着血腥屠杀
  rationale: 原文只写“以／在血中”，可能表示烈怒借流血施行，但没有明说“杀戮”。正文不把解释直接写死，脚注提供较明确的语义可能。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“倾倒烈怒”保留先知性审判语言的形象与力度；“以血”虽较凝练，但由脚注辅助理解。句末保留逗号，因为本节在后续经文中继续展开条件句。
