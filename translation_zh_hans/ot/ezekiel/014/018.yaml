source:
  edition: WLC
  text: וּ/שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֥א יַצִּ֖ילוּ בָּנִ֣ים וּ/בָנ֑וֹת כִּ֛י הֵ֥ם לְ/בַדָּ֖/ם יִנָּצֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/018.yaml
  text: And if these three men were in its midst[a], as I live, declares the Lord GOD, they would not deliver sons or daughters[b]; they alone would be delivered.
translation:
  language: zh_hans
  text: 即使这三个人在那地中间，我凭自己的生命起誓——这是主雅威的宣告——他们也不能搭救儿子或女儿；只有他们自己必蒙搭救。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: 即使这三个人
  rationale: 原文连接词承接14、16、18、20节反复出现的假设结构；“即使”自然表达上下文隐含的条件和让步意味。“三个人”也准确指向上文提到的三位男性人物。
- source_word: בְּתוֹכָהּ
  choice: 在其中
  rationale: 保留“在它中间”的空间含义，同时以自然现代汉语表达；阴性单数所指对象由上下文确定。
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是庄严的神圣誓言公式；此译法虽不逐字，却准确传达“我活着”的起誓功能和郑重语气。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知信息中的宣告公式；“主耶和华”沿用现代中文圣经读者熟悉的复合称号，并保留专名与称号的区别。
- source_word: לֹא יַצִּילוּ
  choice: 他们也救不了
  rationale: נצל的使役式表示使别人脱离灾祸；“救不了”自然表达在这场审判中无法救出他人的意思，不把它限定为永恒救恩。
- source_word: בָּנִים וּבָנוֹת
  choice: 任何儿子或女儿
  rationale: 原文明确并列男性和女性后代。否定句中用“任何……或……”符合现代汉语习惯，也完整保留其范围。
- source_word: כִּי הֵם לְבַדָּם
  choice: 只有他们自己
  rationale: כִּי在这里引出鲜明的限制性对比；“只有……自己”突出三人之外无人能因他们而脱险。
- source_word: יִנָּצֵלוּ
  choice: 能获救
  rationale: נצל的被动式与前面的使役式构成词根呼应；“获救”表达他们本人从临到的审判中蒙拯救，未额外解释其具体方式。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”是现代中文普通读者熟悉且庄重的表达，并避免把专名完全化为一般称号；原文确实同时含有“主”和四字神名。
- issue: 本节“拯救”的范围
  choice: 救不了／能获救
  alternative: 不能使……逃脱／只有他们能逃脱
  rationale: 上下文所说的是从临到土地的审判中获救，并未明确讨论永恒救恩；译文保留拯救用语，同时不加入超出本节的救恩论限定。
- issue: 三位义人的代求或义行能否惠及家人
  choice: 他们不能救出儿女，只有自己获救
  alternative: 将此理解为否定一切形式的代求功效
  rationale: 原文只断言在这次审判中，即便这三人在场，也不能救出自己的儿女；译文不把这一具体宣告扩展为对所有代求或群体关系的普遍神学结论。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“即使……也……”呈现上下文的假设让步结构；破折号标出插入的神谕公式，分号强化“不能救别人／只有自己获救”的对照。
