revisions:
- from: 即使这三个人在其中，我指着我的永生起誓——这是主耶和华的宣告——他们也救不了任何儿子或女儿；只有他们自己能获救。
  to: 即使这三个人在那地中间，我凭自己的生命起誓——这是主雅威的宣告——他们也不能搭救儿子或女儿；只有他们自己必蒙搭救。
  rationale: 修订明确上下文中阴性后缀所指的受审之地，采用“凭自己的生命起誓”贴近神圣誓言公式，并用“搭救／蒙搭救”保留 נצל 在两分句中的词汇呼应。依英文 POB 已记录的神名政策，将“耶和华”改为“雅威”。未添加脚注，因为本节的词义和所指可由正文自然表达，且不存在需以脚注保留的文本异读。
  reviewer_model: gpt-5.6-terra
