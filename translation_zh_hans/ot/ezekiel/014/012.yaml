  text: 雅威的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事形式与后面的主语“耶和华的话”共同构成先知书常见的启示引入语。中文用“临到”自然承载事件的发生和话语来到先知的意思，无须直译为“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在先知启示公式中，דָּבָר指上帝所传达的话语。“话”既保持传统先知文体，也比“信息”少一层解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”对应四字神名，保留其作为以色列之上帝专名的功能，而不改译为称号“主”。
- source_word: אֵלַי
  choice: 我
  rationale: 介词 אֶל 加第一人称单数后缀表示话语所到的对象；中文“临到我”准确而自然。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接发表的神谕。中文先知文体中“说”简洁自然，并明确提示下文内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应译作专名而非以“主”代替。中文稿采用广为人知且具有固定专名功能的“耶和华”；“雅威”是按现代学界常见拟音所作的另一可行译法。
translation_notes:
  register: 采用现代、庄重而通顺的先知书公式用语。“耶和华的话临到我，说”紧贴希伯来语结构，同时符合现代标准汉语的经文语体。
