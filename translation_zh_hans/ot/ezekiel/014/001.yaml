  yaml_path: translation/ot/ezekiel/014/001.yaml
  text: Then some of the elders of Israel came to me and sat before me[a].
translation:
  language: zh_hans
  text: 于是，以色列的几位长老到我这里来，坐在我面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有几个人从以色列的长老中来到我这里。”希伯来文的表达强调这些人是从长老群体中来的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּב֤וֹא
  choice: 于是……来
  rationale: 叙事性的 waw 推进情节，译作“于是”；动词虽为单数形式，却位于复数主语之前，这是希伯来语常见结构，汉语不需体现数的一致。
- source_word: אֵלַי
  choice: 到我这里来
  rationale: 自然表达 אֶל 加第一人称单数词尾所表示的趋向。
- source_word: אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: 以色列的几位长老
  rationale: אֲנָשִׁים 明指男性，而 מן 表明这些人出自以色列长老群体，并非全体长老；现代汉语用“几位长老”既自然，也保留部分成员之意。
- source_word: וַיֵּשְׁבוּ
  choice: 坐
  rationale: 按 ישׁב 在此处的基本身体姿态义直译，不额外引入久留等含义。
- source_word: לְפָנָי
  choice: 在我面前
  rationale: 保留希伯来语表示在某人面前或其临在中的惯用表达，也符合先知接见来访者的语境。
theological_decisions: []
