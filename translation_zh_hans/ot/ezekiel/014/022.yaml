    issue: “我降在耶路撒冷的灾祸”及“我所降在她身上的”搭配不完整。
    rationale: 汉语中“降在”可用于灾祸落在某地，但当主语为“我”时，应明确为“我降给……的灾祸”或改为“我使……遭受的灾祸”。末句则可自然说“我降在她身上的一切”。这属于表达和句法修订，不改变原文的神圣施事或灾祸含义。
  - severity: low
    issue: “他们正出来到你们这里”不够自然。
    rationale: “从那里出来，来到你们这里”更符合现代普通话，同时保留原文“出来”和“向你们”的方向。
  - severity: low
    issue: “所行所为”将原文两个并列词压缩为固定四字格。
    rationale: 该表达并非不忠实，但“行径和作为”能更清楚呈现“道路／行为方式”与“作为／行动”的并列，并保留先知语境中行为受谴责的色彩。
