- from: 然而，看哪[a]，其中必有一批逃脱的人留下，就是被带出来的儿子和女儿[b]。看哪，他们正出来到你们这里；你们看见他们的所行所为，就会因我降在耶路撒冷的灾祸[c]，因我所降在她身上的这一切，而得到安慰。
  to: 然而，看哪[a]，其中还会留下一群逃脱者，就是那些被带出来的儿子和女儿[b]。看哪，他们正从那里出来，来到你们这里；你们看见他们的行径和作为，就会因我降给耶路撒冷的灾祸[c]，就是我降在她身上的一切，而得安慰。
  rationale: 修订消除两处“降在”的汉语搭配问题，改善“出来到”的不自然表达，并以“行径和作为”保留原文两个并列的行为词。其余保留原稿的“然而，看哪”、余民／逃脱者、明确的“儿子和女儿”、审判性“灾祸”及脚注锚点。
