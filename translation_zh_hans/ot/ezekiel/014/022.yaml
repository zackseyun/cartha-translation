source:
  edition: WLC
  text: וְ/הִנֵּ֨ה נֽוֹתְרָה בָּ֜/הּ פְּלֵטָ֗ה הַֽ/מּוּצָאִים֮ בָּנִ֣ים וּ/בָנוֹת֒ הִנָּ/ם֙ יוֹצְאִ֣ים אֲלֵי/כֶ֔ם וּ/רְאִיתֶ֥ם אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וְ/נִחַמְתֶּ֗ם עַל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר הֵבֵ֖אתִי עָלֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/022.yaml
  text: Yet behold[a], a remnant will be left in it—those brought out, sons and daughters. Behold, they are coming out to you, and you will see their way and their deeds; and you will be comforted concerning the disaster that I brought upon Jerusalem[c][b], all that I brought upon it.
translation:
  language: zh_hans
  text: 然而，看哪[a]，其中还会留下一群逃脱者，就是那些被带出来的儿子和女儿[b]。看哪，他们正从那里出来，来到你们这里；你们看见他们的行径和作为，就会因我降给耶路撒冷的灾祸[c]，就是我降在她身上的一切，而得安慰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中还会留下一群逃脱者”也可译作“其中还会留下幸存者”或“其中还会留下逃脱的余民”。
    reason: lexical_alternative
  - marker: b
    text: 原文明确说“儿子和女儿”，没有笼统地说“孩子”。
    reason: lexical_alternative
  - marker: c
    text: 这里的“灾祸”指降在耶路撒冷的灾难和审判，不是指道德上的恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 然而，看哪
  rationale: 承接前文严厉的审判宣告并引出转折，同时保留 הִנֵּה 的强调和指示作用。
- source_word: נוֹתְרָה בָּהּ פְּלֵטָה
  choice: 其中必有一批逃脱的人留下
  rationale: פְּלֵטָה 可指逃脱、幸存者或幸存群体；此译结合 נוֹתְרָה 的“留下”之意，既自然又保留词义范围。
- source_word: הַמּוּצָאִים
  choice: 被带出来的
  rationale: 这是 יצא 的使役被动分词，表示这些人并非仅仅自行出来，而是被带出。
- source_word: בָּנִים וּבָנוֹת
  choice: 儿子和女儿
  rationale: 保留希伯来文明确并列的两类称谓，不泛化为“儿女”或“孩子”。
- source_word: הִנָּם יוֹצְאִים אֲלֵיכֶם
  choice: 看哪，他们正出来到你们这里
  rationale: 保留第二个 הִנֵּה 的强调，也体现 יוֹצְאִים 的持续动作及 אֲלֵיכֶם 朝向听众的方向。
- source_word: דַּרְכָּם וְאֶת עֲלִילוֹתָם
  choice: 他们的所行所为
  rationale: דֶּרֶךְ 在此指生活道路或行为方式，עֲלִילוֹת 指具体作为；汉语“所行所为”自然地涵盖两者，同时保持行为层面的道德意味。
- source_word: וְנִחַמְתֶּם
  choice: 就会……得到安慰
  rationale: Nifal 在此最自然地表示因看见幸存者的行为、明白审判有其缘由而得到安慰；不采用语境较不相称的“后悔”或“转意”。
- source_word: עַל הָרָעָה
  choice: 因……灾祸
  rationale: רָעָה 在神施行审判的语境中指灾难、祸患，而非道德上的恶；עַל 可表达安慰所关乎或所针对之事，汉语用“因”衔接自然。
- source_word: אֵת כָּל אֲשֶׁר הֵבֵאתִי עָלֶיהָ
  choice: 因我所降在她身上的这一切
  rationale: 保留原文对全部审判的概括性复述和强调；以“她”呼应耶路撒冷在希伯来文中的阴性指代，也符合汉语对城市的拟人表达。
theological_decisions:
- issue: הָרָעָה 指神降在耶路撒冷之事的性质
  choice: 灾祸
  alternative: 恶事
  rationale: 上下文所指是审判性的灾难，而不是说道德之恶由神施行；译为“灾祸”既保留神主动施行审判的陈述，也避免错误的伦理含义。
- issue: 人们看见幸存者行为后 וְנִחַמְתֶּם 的含义
  choice: 得到安慰
  alternative: 转意／后悔
  rationale: 本节及下节的语境表明，听众会因明白耶路撒冷受审判并非无缘无故而获得安慰；译文不进一步解释这种安慰的全部神学机制。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“看哪”保留先知文体的强调色彩；“所行所为”使两个相关的行为词在汉语中自然成对。“她”用于耶路撒冷，保留原文阴性指代和城市拟人感。所有脚注标记均置于正文相应位置。
