  source_fidelity: 译文总体准确反映了余民、被带出者、儿子和女儿、看见其道路和作为，以及听者因耶路撒冷所遭灾祸而得安慰的结构。惟“我降在耶路撒冷的灾祸”和“我所降在她身上的”在现代汉语中搭配不完整，宜改为“我降给耶路撒冷的灾祸／我降在她身上的一切”，以清楚保留神主动施行灾祸及末句的总括复述。
  naturalness: “出来到你们这里”不合现代普通话的自然表达；“从那里出来，来到你们这里”既保留主动分词的“出来”及朝向听者的方向，也更顺畅。“一批逃脱的人”略显口语和松散，改为“一群逃脱者”更庄重凝练。
  terminology: “灾祸”适合此处审判性的 רָעָה，不应译为道德意义的“恶”。“所行所为”可自然涵盖“道路”和“作为”，但略合并原文的双重表达；改作“他们的行径和作为”可保留两个并列词的分别及其负面道德色彩。保留“儿子和女儿”，不泛化为“孩子”。
