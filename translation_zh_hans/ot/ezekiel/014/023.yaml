reference: Ezekiel 14:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נִחֲמ֣וּ אֶתְ/כֶ֔ם כִּֽי תִרְא֥וּ אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וִֽ/ידַעְתֶּ֗ם כִּי֩ לֹ֨א חִנָּ֤ם עָשִׂ֨יתִי֙ אֵ֣ת כָּל אֲשֶׁר עָשִׂ֣יתִי בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/023.yaml
  text: And they will comfort you when you see their ways and their deeds[a], and you will know that I have not done without cause all that I did in it[c][b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 当你们看见他们的行径和所作所为时，他们就会使你们得到宽慰[a]；你们也会知道，我在城中所做的一切，并非无缘无故[b]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们就会因他们得到宽慰。”原文形式也可表达他们因其行径和作为被看见，成为你们得宽慰的缘由。
    reason: 保留 וְנִחֲמוּ אֶתְכֶם 在语态及表达关系上的弹性。
  - marker: b
    text: “城中”指耶路撒冷；也可译：“我向她所做的一切。”
    reason: 说明阴性代词 בָהּ 的指代，并保留介词关系的另一种理解。
lexical_decisions:
- source_word: וְנִחֲמוּ אֶתְכֶם
  choice: 他们就会使你们得到宽慰
  rationale: 将幸存者理解为主语、听众为宾语；这种表达保留了他们因其行为被看见而成为宽慰之由的含义，同时避免把宽慰写成单纯的情感安慰。
- source_word: כִּי תִרְאוּ
  choice: 当你们看见……时
  rationale: 这里的 כִּי 可表示原因或情境；按上下文译为时间兼情境关系最自然，并与随后“你们也会知道”的结果相衔接。
- source_word: דַּרְכָּם וְאֶת עֲלִילוֹתָם
  choice: 他们的所作所为
  rationale: 两个词分别指生活行径和具体行为。中文合译为惯用叠语“所作所为”，自然且保留整体的道德意味；脚注说明较直译的表达。
- source_word: וִידַעְתֶּם
  choice: 你们也会知道
  rationale: 保留将来及结果意味；“也”自然承接前半句，而不额外强化为明确推论词。
- source_word: לֹא חִנָּם
  choice: 并非无缘无故
  rationale: חִנָּם 在此意为并非毫无缘由、并非任意而行；“无缘无故”是现代汉语中自然且准确的对应。
- source_word: עָשִׂיתִי אֵת כָּל אֲשֶׁר עָשִׂיתִי
  choice: 我……所做的一切
  rationale: 中文若机械重复两次“做”会显得拗口；“所做的一切”保留了行动的总体性和强调作用。
- source_word: בָהּ
  choice: 在城中
  rationale: 阴性单数代词回指耶路撒冷。中文单独译作“在其中”指向不够清楚，因此以“城”明示所指而不直接把专名加入正文。
- source_word: נְאֻם אֲדֹנָי יְהוָה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 采用庄重而自然的先知公式“宣告”；אֲדֹנָי יְהוָה 译为“主耶和华”，既区分称号与神名，也符合现代中文圣经语域。
theological_decisions:
- issue: 幸存者如何使被掳者得到宽慰
  choice: 他们的行为被看见后，会使听众明白耶路撒冷受审判并非无故，从而得到宽慰。
  alternative: 幸存者仅因存活本身成为安慰；或听众看见他们以后自我安慰。
  rationale: 经文把“看见他们的行径和行为”与“知道上帝并非无故如此行”紧密相连；正文保留这种司法与神学意义上的宽慰，但不进一步解释其心理机制。
- issue: 神名 אֲדֹנָי יְהוָה 的表达
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时含有称号 אֲדֹנָי 与神名 יהוה；“主耶和华”保留二者的区别，并采用普通中文读者熟悉的庄重形式。
- issue: 上帝对耶路撒冷所行之事的正当性
  choice: 并非无缘无故
  alternative: 不是徒然；不是任意而为
  rationale: 经文否定的是审判毫无根据或任意发生，并未在本节展开全部理由；因此不在译文中额外补入“公义”“罪有应得”等解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使你们得到宽慰”比单说“安慰你们”更能表达幸存者因其行为被看见而产生的间接作用；结句采用中文先知文体常见的“这是……的宣告”。
