base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/010.yaml
  text: And they will bear their punishment[a]; the punishment of the one who inquires will be the same as the punishment of the prophet.
translation:
  language: zh_hans
  text: 他们必承受自己的惩罚[a]；求问者所受的惩罚如何，先知所受的惩罚也必如何。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们必担当自己的罪责（或罪孽）；求问者的罪责如何，先知的罪责也必如何。”希伯来语这个词可指罪孽、罪责，也可指罪责所招致的惩罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: 他们必担当
  rationale: נשא与עון连用时，可指担当罪责或承受罪所招致的惩罚。“担当”保留希伯来语的表达方式，在现代汉语中也自然庄重。
- source_word: עֲוֺנָם
  choice: 自己的惩罚
  rationale: עון可表示罪孽、罪责，也可指罪责所带来的惩罚。本节处于审判宣告中，译作“惩罚”较清楚地表达后果层面的含义；脚注保留“罪责／罪孽”的可能。
- source_word: כַּעֲוֺן ... כַּעֲוֺן
  choice: 所受的惩罚怎样……所受的惩罚也必怎样
  rationale: 前缀כ表示比较。采用对应句式，清楚呈现求问者与先知承担相应后果的对称关系，同时不把比较扩展为原文没有明说的细节。
- source_word: הַדֹּרֵשׁ
  choice: 求问者
  rationale: דרש在此指向先知求问、寻求神谕的人。“求问者”简洁并符合上下文。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: נביא的标准现代汉语译法。
- source_word: יִהְיֶה
  choice: 也必怎样
  rationale: 在比较结构中，יִהְיֶה充当将来时系词；汉语用“也必怎样”自然表达将来的确定性及双方对应关系。
theological_decisions:
- issue: 审判公式中עון的含义
  choice: 正文译为“惩罚”
  alternative: 可译为“罪责”或“罪孽”：他们必担当自己的罪责；求问者的罪责怎样，先知的罪责也必怎样。
  rationale: עון兼有罪孽、罪责及罪所招致之惩罚等语义。在“担当עון”的审判语境中，承受罪责后果的意思突出，因此正文用“惩罚”；但原文仍保留道德罪责层面的意味，故在脚注中明确说明，避免消除其真实的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“求问者”准确承接本章向先知求问的语境；比较句式保持原文的对称性。
