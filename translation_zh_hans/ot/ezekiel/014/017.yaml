  text: א֛וֹ חֶ֥רֶב אָבִ֖יא עַל הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אָמַרְתִּ֗י חֶ֚רֶב תַּעֲבֹ֣ר בָּ/אָ֔רֶץ וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/017.yaml
  text: Or if I bring a sword against that land and say[a], ‘Let a sword pass through the land,’ and I cut off from it man and beast,
translation:
  language: zh_hans
  text: 或者，我若使刀剑临到那地，并说：‘刀剑要经过那地’，从其中剪除人和牲畜[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“人和牲畜”，是概括那地上一切人和动物生命都被剪除的常用说法；“人”在此泛指人，不仅指男性。
    reason: 说明固定搭配的概括范围，避免将“人”误解为仅指男性，或将“牲畜”理解为单一动物类别。
lexical_decisions:
- source_word: א֛וֹ
  choice: 或者，我若
  rationale: 本词引出本段一连串审判情形中的另一种假设；结合上下文补出“若”，使汉语条件关系清楚自然。
- source_word: חֶ֥רֶב
  choice: 刀剑
  rationale: “刀剑”在先知性审判语境中可转指战争或暴力灾祸，同时保留原文的具体意象。
- source_word: אָבִ֖יא עַל הָאָרֶץ הַהִיא
  choice: 使刀剑临到那地
  rationale: 使役形表达上帝主动使灾祸来到；“临到”既符合现代庄重语体，也传达 עַל 在此审判语境中的针对性。
- source_word: וְאָמַרְתִּי
  choice: 并说
  rationale: 承接条件句中的连续行动，简洁保留上帝发令的直接性。
- source_word: חֶרֶב תַּעֲבֹר בָּאָרֶץ
  choice: 让刀剑横行那地
  rationale: “让”体现命令或谕令色彩；“横行”表达刀剑遍及全地所带来的毁灭，同时保留其行经全地的动态意象。
- source_word: וְהִכְרַתִּי
  choice: 剪除
  rationale: כרת 在审判公式中指除灭、断绝；“剪除”保留其本有的切断意象和庄重的经文语感。
- source_word: מִמֶּנָּה
  choice: 从其中
  rationale: 所指为阴性名词“那地”；汉语用“其中”自然回指，并保留从该地除去的空间关系。
- source_word: אָדָם וּבְהֵמָה
  choice: 人和牲畜
  rationale: 这是概括地上人类与动物生命一并被除去的固定搭配；“人”具泛指性，“牲畜”在此类与土地荒废相关的审判语境中自然准确。
theological_decisions:
- issue: אָדָם 在概括性审判公式中的所指
  choice: 人
  alternative: 人类；众人
  rationale: 此处不是特指男性个体，而是与“牲畜”并列，泛指居住在地上的人；“人”既简洁贴近原文，也不额外限定性别。
- issue: “刀剑”是实物还是战争的转喻
  choice: 保留“刀剑”意象
  alternative: 战争；战祸
  rationale: 原文以具体的“刀剑”描写上帝的审判，并让它“横行那地”；译文不把这一意象直接解释成抽象的“战争”，从而保留其诗性张力与可能的转喻含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语；保留先知审判话语中的“刀剑”“剪除”等核心意象。经节在原段落中属于尚未结束的条件结构，因此末尾保留逗号。
