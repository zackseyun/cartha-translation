reference: Ezekiel 14:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נֹ֨חַ דנאל וְ/אִיּוֹב֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בֵּ֥ן אִם בַּ֖ת יַצִּ֑ילוּ הֵ֥מָּה בְ/צִדְקָתָ֖/ם יַצִּ֥ילוּ נַפְשָֽׁ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/020.yaml
  text: Even if Noah[a], Daniel, and Job were in it, as I live, declares the Lord GOD, they would deliver neither son nor daughter; by their righteousness they would deliver only themselves.
translation:
  language: zh_hans
  text: 即使挪亚、但以理[a]和约伯在其中，主雅威宣告：“我凭我的永生起誓，他们一个儿子或女儿也救不了；他们只能凭他们的义救自己的性命。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来文是 דנאל，也可读作“达内尔”；这可能指另一位以公义著称的古代人物，不一定是较为人熟知的但以理。
    reason: 保留人名读法及人物身份的不确定性。
lexical_decisions:
- source_word: בְּתוֹכָהּ
  choice: 在其中
  rationale: 阴性单数后缀回指上下文中受审判之地；“在其中”自然保留其方位意义，而不在本节擅自补明所指。
- source_word: חַי אָנִי נְאֻם אֲדֹנָי יְהוִה
  choice: 主雅威宣告：“我指着我的永生起誓”
  rationale: 这是庄严的神圣起誓公式。“我指着我的永生起誓”在现代汉语中清楚表达 חַי אָנִי 的誓言效力；“主雅威”分别对应 אֲדֹנָי 与神名 יְהוִה。
- source_word: אִם בֵּן אִם בַּת יַצִּילוּ
  choice: 他们连儿子或女儿也救不了
  rationale: 誓言公式后的 אִם…אִם 在此表达强烈否定的范围；“连……也救不了”自然传达无论儿子还是女儿都不能获救。
- source_word: יַצִּילוּ
  choice: 救不了／救
  rationale: נצל 的使役式在审判语境中指使人逃脱、救出。汉语“救”简洁自然，并在两次出现处保留原文的重复。
- source_word: הֵמָּה
  choice: 他们只能
  rationale: 独立代词带有强调作用，突出这三位义人所能救的仅是自己；“只能”把这层排他性明确而自然地表达出来。
- source_word: בְצִדְקָתָם
  choice: 凭自己的义
  rationale: 介词 ב 在此可表示凭借或依据；“凭”保留这种语义，而“自己的”使其与三人的义明确对应。
- source_word: נַפְשָׁם
  choice: 自己的性命
  rationale: נֶפֶשׁ 在此指人的生命或本人，并非专指非物质的灵魂；“自己的性命”符合从审判中保全生命的语境。
- source_word: דנאל
  choice: 但以理
  rationale: 正文采用读者熟悉的传统人名“但以理”；但希伯来文拼写 דנאל 与但以理书中常见的 דניאל 不同，因此以脚注保留“达内勒”的可能读法。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主雅威
  alternative: 主耶和华；主上帝
  rationale: 原文直接使用专名 יְהוִה；译作“雅威”使专名与称号 אֲדֹנָי（“主”）保持区别，也不以普通称号取代神名。
- issue: דנאל 所指人物的身份
  choice: 正文作“但以理”，脚注保留“达内勒”的读法
  alternative: 正文直接作“达内勒”，理解为另一位古代义人
  rationale: 该词的辅音拼写容许不同辨认，单凭本节无法确定所指是否就是较为人熟知的但以理。正文沿用传统称名，同时用脚注保留真实的文本与身份歧义。
- issue: 义在拯救中的范围
  choice: “凭自己的义”只能救“自己的性命”
  alternative: 将三人的义理解为也能使亲属或群体免受审判
  rationale: 本节以“儿子或女儿也救不了”明确限制其义的效力范围。译文保留这种个人获救与他人不能借此获救之间的张力，不扩展为一般性的教义结论。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我指着我的永生起誓”传达神圣誓言的力度；分号保留原文先否定能救儿女、再限定只能救自己的对照。脚注标记紧随存在异读的人名“但以理”，避免误指“挪亚”。
