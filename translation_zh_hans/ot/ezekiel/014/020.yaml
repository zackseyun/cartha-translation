  naturalness: “我指着我的永生起誓”虽可理解，但现代汉语中略显生硬，也可能使“永生”被误解为抽象名词。用“我凭我的永生起誓”较自然、庄重，并保留神圣誓言的力度。“连儿子或女儿也救不了”可改为“一个儿子或女儿也救不了”，更明确表达两者皆不得救。
  terminology: “主雅威”能分别体现 אֲדֹנָי 与 יהוה，且与项目将神名译为“雅威”的方针一致。“义”“性命”适合本节审判语境。脚注中的另一读法宜音译作“达内尔”，并明确其为可能的古代义人，而不将身份定论化。
