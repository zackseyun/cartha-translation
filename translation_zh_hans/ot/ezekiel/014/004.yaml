id: EZK.14.4
reference: Ezekiel 14:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֣ן דַּבֵּר א֠וֹתָ/ם וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה אִ֣ישׁ אִ֣ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֡ל אֲשֶׁר֩ יַעֲלֶ֨ה אֶת גִּלּוּלָ֜י/ו אֶל לִבּ֗/וֹ וּ/מִכְשׁ֤וֹל עֲוֺנ/וֹ֙ יָשִׂים֙ נֹ֣כַח פָּנָ֔י/ו וּ/בָ֖א אֶל הַ/נָּבִ֑יא אֲנִ֣י יְהוָ֗ה נַעֲנֵ֧יתִי ל֦/וֹ ב/ה בְּ/רֹ֥ב גִּלּוּלָֽי/ו־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/004.yaml
  text: 'Therefore speak to them and say to them[a], ‘Thus says the Lord GOD: Any man of the house of Israel who brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet—I, Yahweh[c][b], will answer him according to the multitude of his idols.’'
translation:
  language: zh_hans
  text: 所以，你要对他们说：‘主耶和华如此说：以色列家中，凡[a]把自己的偶像高举在心中[b]，把自己罪孽的绊脚石摆在自己面前，又到先知那里来的人，我——耶和华——必照着他众多的偶像回答他。[c]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡……的人”原文直译为“人，人”，是分配式说法，意思是每一个符合下述情形的人。
    reason: 说明希伯来语重复结构及其分配意义。
  - marker: b
    text: “高举在心中”也可译作“使偶像升到心里”或“把偶像放在心上”；原文以生动的方向性语言描写人在内心尊崇偶像。
    reason: 保留עלה使役形式的形象，并列出较直译的可能表达。
  - marker: c
    text: 本句后半在希伯来语中较难确定，尤其是译文未单独表达的בָּהּ；它也可理解为“藉着它”或“在这事上”。因此末句也可译作：“我——耶和华——必藉着它，照着他众多的偶像回答他。”
    reason: 交代难解介词短语及其替代读法，保留原文的真实歧义。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文作推论，现代汉语中自然地表达因果转折。
- source_word: דַּבֵּר אוֹתָם וְאָמַרְתָּ אֲלֵיהֶם
  choice: 你要对他们说
  rationale: 希伯来语使用两个近义言说动词；汉语若逐字重复会显得累赘，因此合并为自然的宣告引语。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知宣告的固定庄重格式，并分别体现 אֲדֹנָי 与神名 יהוה。
- source_word: אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל
  choice: 以色列家中，凡……的人
  rationale: 重复的 אִישׁ 是分配式用法；“凡……的人”准确涵盖每一个符合条件的个体，同时保留“以色列家”的盟约家庭意象。
- source_word: יַעֲלֶה אֶת גִּלּוּלָיו אֶל לִבּוֹ
  choice: 把自己的偶像高举在心中
  rationale: עלה 的使役形式带有“使之上升”的形象；“高举在心中”既保留其动态和尊崇意味，也符合现代汉语。
- source_word: וּמִכְשׁוֹל עֲוֺנוֹ יָשִׂים נֹכַח פָּנָיו
  choice: 把使自己陷入罪孽的绊脚石摆在面前
  rationale: 保留“绊脚石”和“摆在面前”的具体意象，并以关系结构自然表达 עֲוֺנוֹ 与绊脚石之间的关联。
- source_word: וּבָא אֶל הַנָּבִיא
  choice: 又到先知那里来
  rationale: “又”表现此人在内心尊崇偶像之后仍来求问先知的递进情形，但不额外判定其动机。
- source_word: אֲנִי יְהוָה
  choice: 我耶和华
  rationale: 将独立代词与神名连用，保留主语的强调，而非改作单纯的身份判断句。
- source_word: נַעֲנֵיתִי לוֹ
  choice: 必……回应他
  rationale: 该完成式在先知性法律宣告中表达确定的神圣回应；“必”传达其确定性。
- source_word: בְּרֹב גִּלּוּלָיו
  choice: 照他众多的偶像
  rationale: בְּ 可表达准则或对应关系；此译保留神的回应与此人众多偶像相对应的司法意味。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 采用现代中文圣经读者广泛识别的专名“耶和华”，并在 אֲדֹנָי יְהוִה 中译作“主耶和华”，不把两个称谓混同。
- issue: נַעֲנֵיתִי לוֹ בָהּ בְּרֹב גִּלּוּלָיו 的难解句法
  choice: 我耶和华必照他众多的偶像回应他
  alternative: 我耶和华必藉着它回应他；我耶和华必在这事上照他众多的偶像回应他
  rationale: 正文表达上下文中神按照拜偶像者的偶像作出相称回应的主要理解，同时用脚注说明 בָהּ 的指向和功能并不确定，避免掩盖原文难点。
- issue: 偶像与罪孽之“绊脚石”的关系
  choice: 使自己陷入罪孽的绊脚石
  alternative: 自己罪孽的绊脚石；使自己担当罪责的绊脚石
  rationale: 原文属格关系可有不同理解；正文选用符合上下文且在汉语中清楚的结果性表达，但不将其扩展为特定宗派教义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“以色列家”“绊脚石”“主耶和华如此说”等先知文学与盟约语汇；对汉语中不自然的近义动词重复作适度整合，并以脚注保存关键的希伯来语形式和歧义。
