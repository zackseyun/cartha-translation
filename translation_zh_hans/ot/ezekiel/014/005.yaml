  yaml_path: translation/ot/ezekiel/014/005.yaml
  text: so that I may seize the house of Israel by their heart[b][a], because all of them have turned away from me through their idols.
translation:
  language: zh_hans
  text: 为要在他们心中抓住以色列家，因为他们全都因自己的偶像与我疏远了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译：“为要藉着他们的心抓住以色列家。”希伯来文“在他们心中”的介词关系较难确定，也可表示所用的途径。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 为要
  rationale: 引出目的，简洁保留希伯来文的目的意味。
- source_word: תְּפֹשׂ
  choice: 抓住
  rationale: 保留 תפשׂ 强而有力的“抓住、拿住”意象；第一人称由上下文中的上帝发言补足。
- source_word: אֶת בֵּית יִשְׂרָאֵל
  choice: 以色列家众人
  rationale: 保留“以色列家”这一群体性、盟约性的称谓，并用“众人”使后接的“心”在现代汉语中自然。
- source_word: בְּלִבָּם
  choice: 以色列家众人的心
  rationale: 原文介词 ב 可表示范围或凭借，表达较难确定；正文以自然汉语呈现上帝抓住其内心这一意象，同时用脚注保留“在心里”或“藉着心”的可能。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 在此说明上述行动的原因或背景，用“因为”清楚自然。
- source_word: נָזֹרוּ
  choice: 疏远了
  rationale: 该词的 Niphal 形式表达离开、隔绝或变得疏远；“疏远了”兼顾结果状态与关系破裂。
- source_word: מֵעָלַי
  choice: 我
  rationale: 与“疏远”搭配为“疏远了我”，自然表达原文的分离关系。
- source_word: בְּגִלּוּלֵיהֶם
  choice: 因自己的偶像
  rationale: 介词 ב 在此可指媒介或缘由；“因”在汉语中自然表达偶像是他们与上帝疏远的途径或缘由。גִּלּוּלִים 是以西结书对偶像带贬义的常用词。
- source_word: כֻּלָּם
  choice: 全都
  rationale: 明确保留原文对总体性的强调。
theological_decisions:
- issue: 上帝抓住以色列内心的比喻
  choice: 抓住以色列家众人的心
  alternative: 在他们心里抓住以色列家；藉着他们的心抓住以色列家
  rationale: 保留上帝强力抓住以色列的司法性、盟约性意象，但不把难解的介词结构定死为单一解释；其他可能由脚注说明。
- issue: 以色列背道的性质
  choice: 他们全都因自己的偶像而疏远了我
  alternative: 他们全都藉着自己的偶像转离了我
  rationale: “疏远”较贴近 Niphal 所表达的隔绝或异化状态；脚注保留主动转离的理解，避免消除原文的语态张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“抓住”保留原文力度；“以色列家”保留群体性称谓；脚注呈现 בְּלִבָּם 与 נָזֹרוּ 的真实歧义，不以教派性解释消解张力。
