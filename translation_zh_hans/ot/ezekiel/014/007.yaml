  text: כִּי֩ אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מֵ/הַ/גֵּר֮ אֲשֶׁר יָג֣וּר בְּ/יִשְׂרָאֵל֒ וְ/יִנָּזֵ֣ר מֵֽ/אַחֲרַ֗/י וְ/יַ֤עַל גִּלּוּלָי/ו֙ אֶל לִבּ֔/וֹ וּ/מִכְשׁ֣וֹל עֲוֺנ֔/וֹ יָשִׂ֖ים נֹ֣כַח פָּנָ֑י/ו וּ/בָ֤א אֶל הַ/נָּבִיא֙ לִ/דְרָשׁ ל֣/וֹ בִ֔/י אֲנִ֣י יְהוָ֔ה נַֽעֲנֶה לּ֖/וֹ בִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/007.yaml
  text: For any man from the house of Israel[a], or from the foreigner who sojourns in Israel, who separates himself from following me and brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet to inquire of me through him, I, Yahweh[d][c][b], will answer him myself.
translation:
  language: zh_hans
  text: 因为以色列家中的任何人[a]，或寄居在以色列的外族人[b]，若离开我，不再跟从我[c]，把自己的偶像放在心里，又把使他陷入罪孽的绊脚石摆在面前，然后来到先知那里，要借着他求问我，我雅威必亲自回答他[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文重复“人”一词，表示逐一强调，也可译作“每一个人”。
    reason: lexical_alternative
  - marker: b
    text: 指住在以色列人中间、却不属于以色列本族的人；传统上也称“寄居者”。
    reason: cultural_note
  - marker: c
    text: 希伯来文直译为“使自己从我后面分离”，意思是离开雅威，不再跟从他。
    reason: lexical_alternative
  - marker: d
    text: 希伯来文末句凝练，末尾“凭我自己／由我自己”的含义和句法关系有讨论；也可译作“我雅威自己必回答他”或“我雅威必亲自回答他”。重点是雅威本人作答。
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: 任何人
  rationale: 名词重复具有逐一、无一例外的分配性强调。现代汉语用“任何人”自然传达此义；上下文中的“自己的”仍保留单数个体视角。
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: 以色列家中的
  rationale: 保留“以色列家”这一具有民族和盟约色彩的表达，同时用“中的”自然表达来源或归属。
- source_word: הַגֵּר ... יָגוּר
  choice: 寄居在以色列的外族人
  rationale: גֵּר 指居住在以色列群体中的非本族居民。“外族人”说明其身份，“寄居”保留该词的社会文化含义。
- source_word: וְיִנָּזֵר מֵאַחֲרַי
  choice: 离开我，不再跟从我
  rationale: נזר 的尼法勒形表达自我疏离，מֵאַחֲרַי 字面为“从我后面离开”。译文兼顾疏离和停止跟随两层意思。
- source_word: וְיַעַל גִּלּוּלָיו אֶל לִבּוֹ
  choice: 把自己的偶像放在心里
  rationale: עלה 原有“使上升、带上来”之意，但此处指在内心抬举或安置偶像。“放在心里”保留内在崇奉的意象而符合现代汉语。
- source_word: מִכְשׁוֹל עֲוֺנוֹ
  choice: 使自己陷入罪孽的绊脚石
  rationale: 保留 מִכְשׁוֹל 的“绊脚石”意象，并以“使自己陷入”显明它与当事人罪孽的关系；עָוֹן 译为“罪孽”，保留道德过犯及罪责的分量。
- source_word: יָשִׂים נֹכַח פָּנָיו
  choice: 摆在面前
  rationale: 自然地保留“放置在自己脸前”的鲜明画面，表现其明知而主动设置。
- source_word: לִדְרָשׁ לוֹ בִי
  choice: 要借着他求问我
  rationale: דרשׁ ב 表达求问，לוֹ 指该人自身的求问需要；在语境中先知充当中介，因此译作“借着他”。
- source_word: אֲנִי יְהוָה
  choice: 我雅威
  rationale: 独立代词 אֲנִי 带有强调，紧接神名；译作“我雅威”使其成为后续“必亲自回答”的强调主语。
- source_word: נַעֲנֶה לוֹ בִּי
  choice: 必亲自回答他
  rationale: 原文结构凝练且存在语法难点；末尾 בִּי 强调回答出于雅威本人。译文保留“亲自”的重点，而不武断规定其更细的工具性或方式含义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近学界常见重建读音的音译，保留专名性质，而不把它改成称号。
- issue: אִישׁ אִישׁ 的性别与分配性
  choice: 任何人
  alternative: 任何男子；每一个人
  rationale: 本节涵盖以色列家及寄居者中的逐一个体，重点是分配性而非性别对比。汉语“任何人”准确自然，也不把希伯来语语法阳性误解为仅限男性。
- issue: 雅威如何作答
  choice: 我雅威必亲自回答他
  alternative: 我雅威必凭自己回答他；我雅威必以自己回答他
  rationale: נַעֲנֶה לוֹ בִּי 的形式和末尾 בִּי 含义紧凑而有歧义。正文表达确定的核心，即雅威本人作答；脚注保留更贴近字面的其他可能。
translation_notes:
  register: 采用现代、庄重且口语可懂的书面汉语。句式保持原文层层累积的条件结构，但用逗号和“若、又、然后”理清逻辑。保留“以色列家、偶像、罪孽、绊脚石、先知、求问”等圣经语汇，同时避免生硬逐字翻译。所有脚注标记均置于对应正文位置。
