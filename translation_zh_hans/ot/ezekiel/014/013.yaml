  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֶּן אָדָ֗ם אֶ֚רֶץ כִּ֤י תֶחֱטָא לִ/י֙ לִ/מְעָל מַ֔עַל וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/הָ וְ/שָׁבַ֥רְתִּי לָ֖/הּ מַטֵּה לָ֑חֶם וְ/הִשְׁלַחְתִּי בָ֣/הּ רָעָ֔ב וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/013.yaml
  text: Son of man[a], if a land sins against me by acting unfaithfully, and I stretch out my hand against it and break its supply of bread, and send famine upon it, and cut off from it man and beast[b],
translation:
  language: zh_hans
  text: 人子啊，若有一地得罪我，行事对我极其不忠，我就伸手攻击它，断绝它的粮食供应[a]，使饥荒临到其上，从其中剪除人和牲畜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“折断那里的饼杖”。这是希伯来语的说法，指断绝赖以维生的粮食供应。
    reason: lexical_alternative
  - marker: b
    text: “人和牲畜”是概括性的固定表达，指当地的人类和动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝称呼先知的固定用语；“人子”保留了原文的先知性表达和直接语气。
- source_word: אֶרֶץ
  choice: 一个地方
  rationale: 此处无冠词，用于概括性的条件句。“一个地方”比“这地”更能表达泛指，同时在现代汉语中比“一个地”自然。
- source_word: תֶחֱטָא לִי
  choice: 得罪我
  rationale: חטא 后接 לִי 表示罪行针对上帝；“得罪我”简明自然地传达这一关系。
- source_word: לִמְעָל מַעַל
  choice: 对我背信弃义
  rationale: 动词不定式与同根名词连用，强化了失信、背叛的含义；“背信弃义”保留其关系性和约约性的严重程度，而不把具体罪行限定得过窄。
- source_word: וְנָטִיתִי יָדִי עָלֶיהָ
  choice: 我就伸手攻击那里
  rationale: 保留“伸手”的审判意象，并以“攻击”明确 עַל 在此处的敌对方向。
- source_word: וְשָׁבַרְתִּי לָהּ מַטֵּה לָחֶם
  choice: 断绝那里的粮食供应
  rationale: 原文直译为“折断那里的饼杖”，是指摧毁赖以维生的食物来源。正文采用现代汉语可理解的意义表达，原始意象放入脚注。
- source_word: וְהִשְׁלַחְתִּי בָהּ רָעָב
  choice: 使饥荒临到那里
  rationale: רָעָב 在审判语境中指饥荒；此译自然表达饥荒被上帝差遣到该地。
- source_word: וְהִכְרַתִּי מִמֶּנָּה
  choice: 从那里剪除
  rationale: “剪除”保留 כרת 所表达的彻底移除及其审判语气。
- source_word: אָדָם וּבְהֵמָה
  choice: 人和牲畜
  rationale: 这是审判语境中的固定并列表达，概括当地的人类与动物；“人和牲畜”既贴近原文，也符合庄重的现代汉语。
theological_decisions:
- issue: מַעַל 所描述的过犯性质
  choice: 对上帝背信弃义
  alternative: 一般性犯罪，或狭义法律意义上的背叛
  rationale: “得罪我”与同根强化结构 לִמְעָל מַעַל 连用，表明这不只是普通错误，而是对上帝的严重失信。译文保留这种关系性和约的背景，但不擅自限定背叛的具体形式。
- issue: 审判的条件句与结果
  choice: 保留“若……我就……”的直接因果结构
  alternative: 改写为一般性的神学陈述
  rationale: 原文以概括性的条件句说明上帝对背信之地施行审判。直陈结构保留了经文的警告力度，没有扩大或缓和其适用范围。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“人子”“伸手”“剪除”保留《以西结书》的先知性语域；对难以直接理解的“饼杖”意象则在正文中意译，并用脚注保存字面表达。
