source:
  edition: WLC
  text: וְ/נָתַתִּ֨י פָנַ֜/י בָּ/אִ֣ישׁ הַ/ה֗וּא וַ/הֲשִֽׂמֹתִ֨י/הוּ֙ לְ/א֣וֹת וְ/לִ/מְשָׁלִ֔ים וְ/הִכְרַתִּ֖י/ו מִ/תּ֣וֹךְ עַמִּ֑/י וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/008.yaml
  text: And I will set my face against that man[a], and I will make him a sign and a proverb, and I will cut him off from the midst of my people. Then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我要定意与那人为敌，使他成为警示和笑谈[a]；我要把他从我的子民中剪除。这样，你们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “笑谈”或译“俗语”“谚语”或“讥诮人的话”。希伯来语此词可指众人谈论某人时所说的谚语、讥诮或公开流传的话。
    reason: 保留 מְשָׁלִים 可指谚语、俗语、讥诮或公开谈论的语义范围；正文根据审判语境采用“笑谈”。
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּאִישׁ הַהוּא
  choice: 我要向那人变脸
  rationale: 保留希伯来语“脸”的具体意象，并以现代汉语可理解的“变脸”表达雅威坚决敌对、施行审判的意思。
- source_word: הָאִישׁ הַהוּא
  choice: 那人
  rationale: 原文为阳性单数，指本段所说的特定个人；“那人”准确、自然。
- source_word: וַהֲשִׂמֹתִיהוּ לְאוֹת
  choice: 使他成为警戒
  rationale: אוֹת 基本义为“记号、兆头”；在审判语境中，此人将成为让众人引以为戒的公开标志。“警戒”自然传达其语境功能，又不把它弱化为单纯的教训。
- source_word: וְלִמְשָׁלִים
  choice: 沦为人们的谈资
  rationale: מָשָׁל 在此可指关于某人的俗语、讥诮或众人口中的话。原文虽为复数，汉语用集合性的“谈资”更自然；“沦为”体现审判所带来的羞辱，但不限定为某一种固定谚语。
- source_word: וְהִכְרַתִּיו מִתּוֹךְ עַמִּי
  choice: 我要把他从我的子民中剪除
  rationale: “剪除”保留 כרת 的强烈判断及其希伯来语意象；“从我的子民中”准确表达 מִתּוֹךְ עַמִּי。
- source_word: וִידַעְתֶּם
  choice: 这样，你们就知道
  rationale: 连接词在此带结果意味；“这样……就……”清楚表达审判导致认识雅威这一结果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 神“向某人变脸”的审判表达
  choice: 向那人变脸
  alternative: 定意与那人为敌
  rationale: 所选译法保留原文拟人化的“脸”及主动敌对的审判张力；备选译法较明确，却会抹去原文意象。
- issue: מְשָׁלִים 在审判语境中的含义
  choice: 沦为人们的谈资
  alternative: 成为俗语／笑谈
  rationale: 这里可能兼有公开传说、羞辱和讥诮的意味。“谈资”在现代汉语中自然，也保留一定语义宽度；其他可能译法列入脚注，不把原文限定为正式谚语或单纯嘲笑。
- issue: כרת 是否明确等同于处死或毁灭
  choice: 从我的子民中剪除
  alternative: 从我的子民中消灭
  rationale: 原文强调被彻底除去，但本句本身未明说具体执行方式；“剪除”保留这种严厉性及一定程度的开放性，避免擅自明确为某一种死亡方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“变脸”“警戒”“谈资”“剪除”兼顾可读性与原文意象；避免过度古雅，也不把审判的具体方式或“谈资”的羞辱程度解释得超出原文。
