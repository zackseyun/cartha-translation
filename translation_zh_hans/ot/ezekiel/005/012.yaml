  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׁלִשִׁתֵ֞/יךְ בַּ/דֶּ֣בֶר יָמ֗וּתוּ וּ/בָֽ/רָעָב֙ יִכְל֣וּ בְ/תוֹכֵ֔/ךְ וְ/הַ֨/שְּׁלִשִׁ֔ית בַּ/חֶ֖רֶב יִפְּל֣וּ סְבִיבוֹתָ֑יִ/ךְ וְ/הַ/שְּׁלִישִׁית֙ לְ/כָל ר֣וּחַ אֱזָרֶ֔ה וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/012.yaml
  text: A third of you will die by pestilence and be consumed by famine in your midst[a], and a third will fall by the sword all around you, and a third I will scatter to every wind[b], and I will draw out a sword after them.
translation:
  language: zh_hans
  text: 你的人中有三分之一必死于瘟疫，并在你中间因饥荒而灭尽；三分之一必在你四围倒在刀下；还有三分之一，我必把他们驱散到四面八方[a]，并且拔刀追赶他们[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“向每一风”，是指向各个方向。
    reason: cultural_note
  - marker: b
    text: “拔刀”也可译作“使刀出鞘”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁתֵיךְ / הַשְּׁלִשִׁית / הַשְּׁלִישִׁית
  choice: 三分之一
  rationale: 三次重复同一分数，构成三部分审判的清晰结构；现代汉语以“三分之一”表达准确自然。
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 在先知书的审判语境中指流行性疫病；“瘟疫”既准确又保留庄重而具体的灾祸意象。
- source_word: רָעָב
  choice: 饥荒
  rationale: 这里指造成死亡的饥荒灾情，不只是个人的饥饿感。
- source_word: יִכְלוּ
  choice: 被……灭尽
  rationale: 该动词有耗尽、除灭、终结之意；“被饥荒灭尽”保留其强烈程度，也符合汉语搭配。
- source_word: בְתוֹכֵךְ
  choice: 在你中间
  rationale: 保留对人格化城市的第二人称直接称呼，并说明灾祸发生在城内。
- source_word: חֶרֶב
  choice: 刀
  rationale: 原文以具体兵器代指战争中的杀戮；“倒在刀下”是自然、庄重且保留意象的汉语表达。
- source_word: סְבִיבוֹתָיִךְ
  choice: 在你四围
  rationale: 表达围绕受话者各处的分布意义，并与先知性语体相称。
- source_word: לְכָל רוּחַ
  choice: 到四面八方
  rationale: 该短语字面为“向每一阵风／各风”，惯用意义是向各个方向；正文采用清楚的现代汉语，脚注保留其字面意象。
- source_word: אֱזָרֶה
  choice: 驱散
  rationale: 该动词表示撒散、扬散或驱散；此处对象是余下的一部分人，“驱散”清楚表达他们被迫流散。
- source_word: אָרִיק חֶרֶב
  choice: 拔刀
  rationale: 字面涉及使刀剑出鞘或抽出；“拔刀”在现代汉语中简洁地保留动作意象。
- source_word: אַחֲרֵיהֶם
  choice: 追赶他们
  rationale: 介词短语字面为“在他们后面”，与拔刀连用时表达追击；译作“追赶他们”使关系明确而不削弱威胁。
theological_decisions:
- issue: 受话者的人格化及审判对象
  choice: 保留第二人称“你”，不在经文中补入“耶路撒冷”
  alternative: 在正文中明确写作“耶路撒冷”
  rationale: 希伯来文以阴性单数形式直接称呼人格化的城市。汉语不在“你”上标示性别，但保留直接称呼可维持原有的先知性修辞，也避免添加本节未出现的专名。
- issue: 具体审判意象与惯用语的平衡
  choice: 保留“瘟疫”“饥荒”“刀”等具体意象，同时把“向每一风”译成其自然含义“四面八方”
  alternative: 在正文直译为“向每一阵风”或把全部意象抽象化为疾病、饥饿和战争
  rationale: 具体灾祸和兵器意象在汉语中清楚有力，应予保留；“向每一风”若机械直译则不自然，因此正文传达惯用意义，并以脚注保存字面形式。
- issue: 拔刀追赶的威胁
  choice: 译为“拔刀追赶他们”
  alternative: 译为“使刀出鞘跟在他们后面”或抽象化为“继续追杀他们”
  rationale: 原文把出鞘的刀与“在他们后面”并置，既可理解为持刀追击，也保留持续审判的形象；所选译文不额外说明追击结果。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三次重复“三分之一”以呈现原文结构；分号划分三组审判。正文保留对人格化城市的“你”，并以“倒在刀下”“拔刀追赶”维持先知宣告的具体力度。
