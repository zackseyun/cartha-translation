source:
  edition: WLC
  text: בְּֽ/שַׁלְּחִ֡/י אֶת חִצֵּי֩ הָ/רָעָ֨ב הָ/רָעִ֤ים בָּ/הֶם֙ אֲשֶׁ֣ר הָי֣וּ לְ/מַשְׁחִ֔ית אֲשֶׁר אֲשַׁלַּ֥ח אוֹתָ֖/ם לְ/שַֽׁחֶתְ/כֶ֑ם וְ/רָעָב֙ אֹסֵ֣ף עֲלֵי/כֶ֔ם וְ/שָׁבַרְתִּ֥י לָ/כֶ֖ם מַטֵּה לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/016.yaml
  text: When I send against them the deadly arrows of famine[a], which are for destruction, which I will send to destroy you[b], then I will add famine upon you and break for you the staff of bread.
translation:
  language: zh_hans
  text: 当我把致命的饥荒之箭[a]射向他们时——这些箭是为毁灭而设的，我要射出它们来毁灭你们——我还要加重临到你们的饥荒，并折断你们的粮食之杖[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “致命的”或译“带来灾祸的”。
    reason: lexical_alternative
  - marker: b
    text: “粮食之杖”是希伯来语的说法，指维持生命的粮食供应或保障。
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּשַׁלְּחִי
  choice: 当我……射……时
  rationale: 介词 בְּ 加不定式结构在此引出时间从句；译作“当……时”自然地保留其时间和前瞻意味。
- source_word: חִצֵּי הָרָעָב
  choice: 饥荒之箭
  rationale: 保留希伯来语结构链的武器隐喻，呈现饥荒如同上帝射出的箭。
- source_word: הָרָעִים
  choice: 致命的
  rationale: רַע 在这里修饰造成灾祸和毁灭的饥荒之箭；“致命的”传达其破坏后果，同时以脚注保留“带来灾祸的”等词义可能。
- source_word: בָּהֶם
  choice: 射向他们
  rationale: 在“射出／发出”箭的语境中，בָּהֶם 表示箭所针对的对象；“射向他们”符合汉语习惯。
- source_word: לְמַשְׁחִית
  choice: 用来毁灭人的
  rationale: 保留该词所表达的毁灭作用或目的；补出泛指宾语“人”，使汉语完整，但不限定具体毁灭对象。
- source_word: לְשַׁחֶתְכֶם
  choice: 来毁灭你们
  rationale: 直接表达 שׁחת 不定式及第二人称复数后缀所表示的目的和对象。
- source_word: וְרָעָב אֹסֵף עֲלֵיכֶם
  choice: 我还要加重临到你们的饥荒
  rationale: 将 אָסַף 的使役义译为“加重”，并保留 עַל 所含“临到／压在……之上”的审判意象。
- source_word: מַטֵּה לָחֶם
  choice: 粮食之杖
  rationale: 保留原文以杖象征支撑和供应的意象，并用脚注说明其惯用含义。
theological_decisions:
- issue: 审判中的神圣主动性
  choice: 保留第一人称的直接行动：“我……射”“我要……加重”“折断”
  alternative: 改用“饥荒将临到”等非人格表达
  rationale: 希伯来文反复把这场审判明确归于说话者上帝的行动；译文不削弱这一神学张力。
- issue: 审判意象的保留
  choice: 正文保留“饥荒之箭”和“粮食之杖”两个隐喻
  alternative: 完全意译为“致命的饥荒”和“粮食供应”
  rationale: 原文借武器和支撑物描绘饥荒及粮食断绝；保留意象更贴近源文，“粮食之杖”的惯用意义则由脚注说明。
- issue: 第三人称“他们”与第二人称“你们”的转换
  choice: 按原文保留人称转换
  alternative: 统一译作“你们”
  rationale: 原文先用 בָּהֶם“他们”，随后用 לְשַׁחֶתְכֶם“毁灭你们”；即使语境中所指可能重合，也不在译文中擅自消除这一形式上的转换。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以破折号容纳原文连续的关系从句，既保持重复和强调，又避免主句结构难以辨认；“粮食之杖”刻意保留较陌生的源文意象，并由脚注释义。
