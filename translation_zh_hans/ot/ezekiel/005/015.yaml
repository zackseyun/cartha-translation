  verdict: revise
  source_fidelity: 原文在时间从句中以“怒气、烈怒和震怒的责备”作为施行审判的伴随方式。草稿的“震怒的责罚”在该语境虽可理解，但将תּוֹכְחוֹת较明确的“责备／斥责”直接窄化为“责罚”；“在……责罚中，对你施行审判”的搭配也稍改变了原文的表达关系。另，“令人惊骇”较易表示耶路撒冷使人害怕，未充分呈现其作为列国所见之惊愕对象的名词性并列功能。
  naturalness: 草稿总体庄重自然。“周围列国羞辱、讥诮的对象”可更明确为“周围列国的羞辱和讥诮”；将四个并列名词统一置于“对周围列国”的范围内，并把时间从句直接连接，句法更清楚、现代汉语也更顺畅。
  terminology: “雅威”“施行审判”“鉴戒”均可取。“责备”较贴合תּוֹכְחוֹת，且保留审判宣告中言语斥责与惩戒并存的余地；“惊骇”保留מְשַׁמָּה所表达的骇异反应，脚注说明其亦可涉及荒凉。
