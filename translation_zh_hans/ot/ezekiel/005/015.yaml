  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה חֶרְפָּ֤ה וּ/גְדוּפָה֙ מוּסָ֣ר וּ/מְשַׁמָּ֔ה לַ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ בַּ/עֲשׂוֹתִ/י֩ בָ֨/ךְ שְׁפָטִ֜ים בְּ/אַ֤ף וּ/בְ/חֵמָה֙ וּ/בְ/תֹכְח֣וֹת חֵמָ֔ה אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/015.yaml
  text: And you shall become a reproach and a taunt[a], a warning and a horror, to the nations that are around you, when I execute judgments on you in anger and in wrath and with wrathful rebukes. I am Yahweh[c][b]; I have spoken.
translation:
  language: zh_hans
  text: 你必成为周围列国的羞辱和讥诮、鉴戒[a]和惊骇[b]；当我以怒气、烈怒和震怒的责备[c]向你施行审判时，必是这样。我是雅威；我已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鉴戒”也可译作“管教”“训诲”“纠正”或“警告”；这里指耶路撒冷受审判后，成为周围列国引以为戒的实例。
    reason: lexical_alternative
  - marker: b
    text: “惊骇”也可理解为“令人惊骇的对象”“荒凉”或“惊愕”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“震怒的责备”；也可理解为“带着震怒的斥责”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 你必成为
  rationale: 动词为阴性单数，承接被直接称呼的耶路撒冷；现代汉语用“你必成为”自然保留第二人称和结果意味。
- source_word: חֶרְפָּה וּגְדוּפָה
  choice: 羞辱、讥诮的对象
  rationale: 前者侧重蒙羞和受蔑视，后者侧重辱骂、嘲弄；补出“的对象”使汉语清楚表达耶路撒冷将成为列国羞辱讥诮的对象。
- source_word: מוּסָר
  choice: 鉴戒
  rationale: 该词可指管教、训诲或纠正；此处耶路撒冷受审判而成为周围列国的反面教材，“鉴戒”兼顾警示和教训作用。
- source_word: מְשַׁמָּה
  choice: 令人惊骇
  rationale: 该词可表示荒凉，也可表示由荒凉引起的震惊、恐怖；在列举耶路撒冷对列国所产生的作用时，“令人惊骇”较自然。
- source_word: לַגּוֹיִם אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: 周围列国
  rationale: 简洁保留列国与耶路撒冷相邻的地理关系，并与全句搭配自然。
- source_word: בַּעֲשׂוֹתִי בָךְ שְׁפָטִים
  choice: 那时，我要……对你施行审判
  rationale: ב加不定式结构在此表示时间；“施行审判”保留שְׁפָטִים的司法色彩，不直接窄化为刑罚。
- source_word: בְּאַף וּבְחֵמָה
  choice: 在怒气、烈怒……中
  rationale: 分别译出两个近义怒词，以“怒气”和“烈怒”保留原文的递进和强度。
- source_word: וּבְתוֹכְחוֹת חֵמָה
  choice: 和震怒的责罚
  rationale: 形式上保留“震怒的……”这一属格式关系；תּוֹכְחוֹת可指责备、惩戒或责罚，在实际施行审判的语境中“责罚”较合适，同时脚注交代直译可能。
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: 我是雅威；我已经说了
  rationale: 直陈神的名并以完成式宣告话语已经发出；分号保留两个强调短句的庄重力度。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”按其通行学术复原音译，避免以称号替代专名。
- issue: מוּסָר 在审判语境中的作用
  choice: 鉴戒
  alternative: 管教；训诲；警告
  rationale: 原文容许管教、教训等含义；这里耶路撒冷成为列国所见的反面实例，“鉴戒”既符合语境，也不把词义仅限于口头警告。
- issue: מְשַׁמָּה 的语义重心
  choice: 令人惊骇
  alternative: 荒凉；惊愕的对象
  rationale: 此词兼有荒凉和骇异的语义范围；句法上它与耶路撒冷“对列国”成为什么并列，故正文突出列国的惊骇反应，并以脚注保留荒凉义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。前半句补出一次“的对象”，避免四个抽象名词连续堆叠；后半句保留怒气词汇的累加强调和司法性的“施行审判”。神名译为“雅威”。所有脚注标记均已置于正文相应词语之后。
