source:
  edition: WLC
  text: וְ/עָשִׂ֣יתִי בָ֗/ךְ אֵ֚ת אֲשֶׁ֣ר לֹֽא עָשִׂ֔יתִי וְ/אֵ֛ת אֲשֶֽׁר לֹֽא אֶעֱשֶׂ֥ה כָמֹ֖/הוּ ע֑וֹד יַ֖עַן כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/009.yaml
  text: And I will do in you what I have not done[a], and the like of which I will never do again, because of all your abominations.
translation:
  language: zh_hans
  text: 因你这一切可憎之事，我要在你中间行我从未行过的事；这样的事，我以后也绝不再行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: 我要……行
  rationale: עשה是含义宽泛的“做、行”；此处保留其简洁而严厉的审判语气，不另行具体化。
- source_word: בָךְ
  choice: 在你中间
  rationale: ב字面为“在……里面”。“在你中间”既贴近原文，也自然表达审判将在耶路撒冷城内施行；不解释性地改作“攻击你”。
- source_word: אֵת אֲשֶׁר לֹא עָשִׂיתִי
  choice: 我从未行过的事
  rationale: 完成式否定此前曾有这样的行动；现代汉语以“从未行过”自然表达截至当时未曾发生，并保留原文的绝对力度。
- source_word: וְאֵת אֲשֶׁר לֹא אֶעֱשֶׂה כָמֹהוּ עוֹד
  choice: 这样的事，我以后也绝不再行
  rationale: כָמֹהוּ与עוֹד共同强调以后不会再有同类之事；此译法清楚保留比较和不再重复的含义。
- source_word: יַעַן כָּל תּוֹעֲבֹתָיִךְ
  choice: 因你这一切可憎之事
  rationale: יַעַן引出审判原因；תּוֹעֵבָה指在宗教与道德上令人憎恶的行为或事物，“可憎之事”庄重自然，且不把所指限制为单一类别。
theological_decisions:
- issue: 审判前所未有、后无同类的绝对表述
  choice: 直接保留“从未”与“以后也绝不再”的强烈措辞
  alternative: 弱化为“极其严厉的事”
  rationale: 原文有意强调此次审判没有先例，未来也不会再有同类；翻译不应将其缩减为一般程度上的严重。
- issue: 神的行动与בָךְ的关系
  choice: 译为“在你中间”
  alternative: “攻击你”或“向你施行”
  rationale: 原文介词首先表达“在……里面”；保留这一空间意象，使读者看见审判发生在城中，同时避免加入原文没有明说的敌对介词含义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“行……之事”保留先知宣告的凝练力度；将原因短语前置，使整句在汉语中自然，并不改变原文的因果关系。
