  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א יַ֚עַן אֶת מִקְדָּשִׁ֣/י טִמֵּ֔את בְּ/כָל שִׁקּוּצַ֖יִ/ךְ וּ/בְ/כָל תּוֹעֲבֹתָ֑יִ/ךְ וְ/גַם אֲנִ֤י אֶגְרַע֙ וְ/לֹא תָח֣וֹס עֵינִ֔/י וְ/גַם אֲנִ֖י לֹ֥א אֶחְמֽוֹל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, surely because you have defiled my sanctuary with all your detestable things and with all your abominations, I also will diminish you; my eye will not spare, and I also will show no pity.
translation:
  language: zh_hans
  text: 所以，主耶和华宣告：“我指着我的永生起誓：你既用你一切可憎之物和一切可憎之事玷污了我的圣所，我也必削减你[a]。我的眼必不顾惜，我也绝不怜悯。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我也必减损。”原文措辞简短，没有明说动词的宾语。
    reason: 保留 אֶגְרַע 的词义范围及其宾语省略所造成的歧义。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出审判的结论，符合现代汉语表达。
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是上帝庄严的自我起誓公式；意译出誓言性质，比逐字译作“我活着”更清楚自然。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: 保留预言宣告公式，并以“耶和华”呈现四字神名；“主耶和华”也保留两个称谓。
- source_word: אִם לֹא
  choice: 必
  rationale: 在誓言结构中是加强断言的惯用表达，不按字面译为条件句。
- source_word: מִקְדָּשִׁי
  choice: 我的圣所
  rationale: 准确表达分别为圣的敬拜场所，又不把词义过度限定为整座圣殿建筑。
- source_word: טִמֵּאת
  choice: 玷污了
  rationale: 兼具礼仪与道德上的污秽含义，适合圣所语境。
- source_word: שִׁקּוּצַיִךְ
  choice: 你一切可憎之物
  rationale: 该词常指可憎的偶像或物件；如此翻译既保留广义，也与随后表示行为的词区别开来。
- source_word: תּוֹעֲבֹתָיִךְ
  choice: 你一切可憎之事
  rationale: 表示宗教或道德上令人厌恶的行为；与“可憎之物”形成有意义的词汇对应。
- source_word: אֶגְרַע
  choice: 我也必削减你们
  rationale: 动词含削减、减损之意，原文宾语省略。根据上下文补出受审判的群体，但以脚注保留原文的简约与歧义。
- source_word: לֹא תָחוֹס עֵינִי
  choice: 我的眼必不顾惜
  rationale: 保留希伯来语“我的眼”的鲜明意象和审判语体。
- source_word: לֹא אֶחְמוֹל
  choice: 我也绝不怜悯
  rationale: 表达不施怜悯，并以“绝不”传达并列结构的强调语气。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝
  rationale: “主耶和华”既区分并保留 אֲדֹנָי 与四字神名 יְהוִה，也符合中文圣经庄重而易懂的传统表达。
- issue: אֶגְרַע 所表达的审判性质
  choice: 我也必削减你们
  alternative: 我也必减损／撤回
  rationale: 词义确有削减、减损或撤去的范围，且原文没有明说宾语。正文采用符合本段毁灭审判语境的“削减你们”，脚注说明宾语隐含，避免把其具体方式解释得过细。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。引号清楚标示上帝的直接宣告；保留“我的眼必不顾惜”的希伯来意象，同时避免不必要的古奥措辞。
