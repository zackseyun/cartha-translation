  text: And you shall take from there a few in number and bind them in the folds of your garment[a].
translation:
  language: zh_hans
  text: 你要从那里取少数几根，把它们包在你衣服的边角里[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“包在你的衣摆里”或“包在你袍子的褶裥中”。希伯来语字面为“在你的翅膀／边缘中”；用于衣物时，这个词指衣服的边、角或下摆。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要……取出
  rationale: 带连接词的Qal完成式在这一连串先知行动指令中具有命令性的将来语气；“你要”自然保留指令力度。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 按字面保留地点副词；上下文表明是从先前处理的头发中取出，但本节不明说，以保留原文指代方式。
- source_word: מְעַט בְּמִסְפָּר
  choice: 少数几根
  rationale: 该词组强调数量很少；结合所指的头发，用量词“根”使现代汉语自然，同时保留数量上的强调。
- source_word: וְצַרְתָּ
  choice: 包在……里
  rationale: 该动词可表达包裹、束住或围住；在把少量头发置于衣服边角中的象征动作里，“包在……里”清楚自然，也不额外指定捆绑方式。
- source_word: אוֹתָם
  choice: （几根）
  rationale: 希伯来语宾语代词回指少数几根头发；汉语通过前置宾语“少数几根”承接，避免不自然地重复“它们”。
- source_word: בִּכְנָפֶיךָ
  choice: 在你衣服的边角里
  rationale: כָּנָף本义可为“翅膀”，用于衣物时指衣服的边、角或下摆。“衣服的边角”准确而易懂；以脚注保留其他可能表达。
