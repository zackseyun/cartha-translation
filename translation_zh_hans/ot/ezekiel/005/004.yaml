base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/004.yaml
  text: And from them you shall take some more[a], and throw them into the midst of the fire and burn them in the fire. From it a fire will go out to all the house of Israel.
translation:
  language: zh_hans
  text: 你要再从这些头发中取一些，扔进火中，在火里焚烧。火必从其中[a]出来，临到以色列全家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从其中”也可译作“从那里”；原文的单数后缀很可能指刚才提到的火。有人理解为“从这些头发中”，但可能性较小。
    reason: 说明 מִמֶּנּוּ 的单数指代及其可能的理解；标记紧随“其中”。
lexical_decisions:
- source_word: וּמֵהֶם עוֹד תִּקָּח
  choice: 你还要从这些头发中再取一些
  rationale: מֵהֶם 是部分意义的“从它们中”，所指承接上文的头发；עוֹד 表示进一步、另外再取。明说“头发”可使现代汉语指代清楚，又不改变意象。
- source_word: וְהִשְׁלַכְתָּ אֹתָם אֶל תּוֹךְ הָאֵשׁ
  choice: 扔进火中
  rationale: שלך 的使役形表示“扔、投”；אֶל־תּוֹךְ 强调进入火的内部，汉语“进火中”自然保留这一方向和位置。
- source_word: וְשָׂרַפְתָּ אֹתָם בָּאֵשׁ
  choice: 在火里烧掉
  rationale: שרף 表示焚烧；“烧掉”切合头发被焚毁的完成性意象，בָּאֵשׁ 直译为“在火里”。
- source_word: מִמֶּנּוּ
  choice: 从其中
  rationale: 希伯来文为阳性单数后缀，最自然地回指紧邻的“火”或整个焚烧情景；“其中”保留所指的一定开放性，不误译成复数“从它们”。
- source_word: תֵצֵא אֵשׁ
  choice: 必有火……出来
  rationale: יצא 的基本图像是“出来”；未完成式在预告审判的语境中用“必”表达确定的将来。
- source_word: אֶל כָּל בֵּית יִשְׂרָאֵל
  choice: 烧向以色列全家
  rationale: אֶל 表示朝向、到达；“烧向”既保留方向性，又使火的运动在汉语中自然。בֵּית יִשְׂרָאֵל 保留为圣约群体称谓“以色列全家”。
theological_decisions:
- issue: 从焚烧中出来之火的来源及方向
  choice: 译作“必有火从其中出来，烧向以色列全家”
  alternative: “必有火从它们中出来，攻击以色列全家”
  rationale: מִמֶּנּוּ 是单数，较自然地指向火或焚烧情景，而非复数头发；אֶל 本身表达方向，不必额外强化为“攻击”。译文保留审判意象，却不限定象征机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“扔”比“投掷”更直接，“以色列全家”保留原文群体称谓。
