language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה יַ֤עַן הֲמָנְ/כֶם֙ מִן הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִיבֽוֹתֵי/כֶ֔ם בְּ/חֻקּוֹתַ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וְ/אֶת מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם לֹ֥א עֲשִׂיתֶֽם־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/007.yaml
  text: 'Therefore thus says the Lord GOD: Because you have been more turbulent than the nations that are around you[a], you have not walked in my statutes, and you have not carried out my judgments; and you have not even acted according to the judgments of the nations that are around you.'
translation:
  language: zh_hans
  text: 因此，主耶和华如此说：“因为你们比周围的列国更加骚乱[a]，没有遵行我的律例，没有实行我的典章，甚至也没有照周围列国的典章行事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “更加骚乱”所译的希伯来词词义疑难，也可理解为“更加喧嚷”“更加悖乱”，或可能指“人数更多”。正文依上下文采用表示过度失序的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号：אֲדֹנָי 译作“主”，四字神名 יְהוִה 采用现代中文圣经语境中通行且庄重的音译“耶和华”。
- source_word: יַעַן
  choice: 因为
  rationale: 清楚表达本句为随后审判宣告提供的原因。
- source_word: הֲמָנְכֶם
  choice: 你们……更加骚乱
  rationale: 此词词义疑难，可能指喧嚷、躁动、悖乱，也可能与众多有关；正文采用符合上下文的“骚乱”，表达超过周围列国的失序状态，又不把含义过度限定为某一种道德罪名。
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: 比周围的列国
  rationale: מִן 在这里表达比较关系，“比”使现代中文读者容易把握句法。
- source_word: בְּחֻקּוֹתַי לֹא הֲלַכְתֶּם
  choice: 没有遵行我的律例
  rationale: “遵行”自然传达希伯来语“行在……中”的生活实践含义；חֻקּוֹת 译作“律例”。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: מִשְׁפָּט 在本节前后重复出现，统一译作“典章”，保留上帝的典章与列国典章之间的词汇对应。
- source_word: לֹא עֲשִׂיתֶם
  choice: 没有实行
  rationale: 在“典章”的搭配中，“实行”自然表达 עשה 所指的付诸行动与遵守。
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם... לֹא עֲשִׂיתֶם
  choice: 甚至也没有照周围列国的典章行事
  rationale: כְּ 表示依照或符合；“照……行事”符合现代汉语。“甚至”体现递进性的责备语气：他们不但没有遵行上帝的典章，连列国的规范也没有照行。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: “主耶和华”既区分 אֲדֹנָי 与 יְהוִה，又以普通中文读者熟悉的形式保留专名性质；不把四字神名直接泛化为称谓“上帝”。
- issue: 末句是否表示以色列没有遵照列国的典章
  choice: 按马所拉文本译为“甚至也没有照周围列国的典章行事”
  alternative: 译为“反倒照周围列国的典章行事”
  rationale: WLC 的马所拉文本明确含否定词 לֹא，应保留其较尖锐的修辞张力，不依据其他古代文本传统或上下文推测删去否定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“律例／典章”保留先知书的法律语域；句法略作汉语化处理，同时保留原文的因果关系、三重否定和末句的神学张力。
