base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/014.yaml
  text: And I will make you a ruin and a reproach among the nations that are around you[b][a], in the sight of everyone who passes by.
translation:
  language: zh_hans
  text: 我要使你在你周围的列国中成为荒凉[a]和羞辱[b]，使所有过路的人都亲眼看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒凉”或译“废墟”。
    reason: lexical_alternative
  - marker: b
    text: “羞辱”或译“被讥讽的对象”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵךְ
  choice: 我要使你
  rationale: נתן与表示结果状态的介词短语连用，在这里是“使……成为”的意思；保留对耶路撒冷的第二人称阴性单数称呼，并自然表达致使含义。
- source_word: לְחָרְבָּה
  choice: 成为废墟
  rationale: חָרְבָּה指遭毁坏、荒废的状态；“成为废墟”既具体又符合城市受审判的语境。
- source_word: וּלְחֶרְפָּה
  choice: 受人羞辱
  rationale: חֶרְפָּה可指羞辱、耻辱或被讥诮的对象；“受人羞辱”在现代汉语中自然，并保留公开蒙羞的含义。
- source_word: בַּגּוֹיִם
  choice: 在……列国中
  rationale: גּוֹיִם在此指耶路撒冷周围的各国，并非强调犹太人与外邦人的神学对比。
- source_word: אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: 周围的
  rationale: 简洁表达关系从句“在你周围的”，所修饰的是列国。
- source_word: לְעֵינֵי
  choice: 亲眼看见
  rationale: 该习语直译为“在……眼前”，强调审判公开可见；结合כָּל עוֹבֵר译为“让……都亲眼看见”，符合现代汉语表达。
- source_word: כָּל עוֹבֵר
  choice: 所有过路的人
  rationale: עֹבֵר为分词，指经过的人；כָּל赋予全称、总括意味。
theological_decisions:
- issue: 以阴性单数第二人称将耶路撒冷人格化
  choice: 保留“你”，不在正文中补出“耶路撒冷”
  alternative: 在正文中明确写作“耶路撒冷”
  rationale: 希伯来文延续对这座城的直接人格化称呼。保留“你”能维持神谕审判的修辞力度，也避免添加本节没有明说的名词。
- issue: חֶרְפָּה所表达的羞辱性质
  choice: 译为“受人羞辱”
  alternative: 译为“成为讥讽的对象”或“蒙受耻辱”
  rationale: 原词同时涵盖羞辱、耻辱和受讥诮的语义。“受人羞辱”不限定羞辱的具体形式，保留其语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。语序略作汉语化处理，把“在所有过路的人眼前”表达为“让所有过路的人都亲眼看见”，同时保留审判公开可见的含义。
