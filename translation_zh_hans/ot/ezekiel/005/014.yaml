  timestamp: '2026-07-14T07:33:48Z'
review_pass:
  verdict: revise
  source_fidelity: 原文以第二人称阴性单数称呼耶路撒冷，表示“使你成为荒凉/毁坏之境和羞辱”，范围是在其周围的列国中，并强调这事公开地发生在一切过路者眼前。草稿的“让所有过路的人都亲眼看见”基本传达公开可见，但“受人羞辱”将名词性结果“成为羞辱（或受辱的对象）”改成了被动经历，且“周围的列国”未明确其为“你周围的”列国。
  naturalness: 修订后的句子保持现代普通话的庄重自然；“成为荒凉和羞辱”是中文圣经语体中清楚且简洁的并列结果表达。“使所有过路的人都亲眼看见”自然地表达“在一切过路者眼前”的公开性。
  terminology: “荒凉”准确涵盖חָרְבָּה所指被毁、荒废的状态；“羞辱”保留חֶרְפָּה的名词性审判结果，不预先限定为某一种讥讽或羞耻方式。保留“列国”，适合此处周边民族国家的语境。
  issues:
  - severity: medium
    issue: “受人羞辱”弱化并改变了“成为……羞辱”的句法与语义。
    rationale: וּלְחֶרְפָּה与“成为废墟”并列，都是神使该城成为的状态或对象；译作被动的“受人羞辱”更侧重遭受一个动作，未充分保留其作为列国中羞辱/受讥诮对象的结果。
  - severity: low
    issue: “周围的列国”没有明示“你周围的”关系。
    rationale: אֲשֶׁר סְבִיבוֹתָיִךְ的第二人称后缀指向受称呼的城；补出“你”可保留原文直接称呼及地理关系。
  - severity: low
    issue: 脚注a的“荒场”不够现代且不如原词义明确。
    rationale: “荒场”在现代普通话中较少使用，且容易指空地；“废墟”是更清楚的词汇替代。
  revised_text: 我要使你在你周围的列国中成为荒凉[a]和羞辱[b]，使所有过路的人都亲眼看见。
