revisions:
- from: 我要使你在周围的列国中成为废墟[a]，受人羞辱[b]，让所有过路的人都亲眼看见。
  to: 我要使你在你周围的列国中成为荒凉[a]和羞辱[b]，使所有过路的人都亲眼看见。
  rationale: 将“受人羞辱”改为“羞辱”，以保留希伯来文中与“荒凉”并列的名词性结果；补出“你周围的”，反映原文第二人称所属关系；将脚注a改为现代、清楚的词汇替代。其余语序按现代汉语调整，同时保留审判公开可见的含义。
