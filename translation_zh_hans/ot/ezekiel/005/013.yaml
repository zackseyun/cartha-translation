  text: וְ/כָלָ֣ה אַפִּ֗/י וַ/הֲנִחוֹתִ֧י חֲמָתִ֛/י בָּ֖/ם וְ/הִנֶּחָ֑מְתִּי וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה דִּבַּ֨רְתִּי֙ בְּ/קִנְאָתִ֔/י בְּ/כַלּוֹתִ֥/י חֲמָתִ֖/י בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/013.yaml
  text: So my anger will be spent[a], and I will cause my wrath to rest on them, and I will be comforted. Then they will know that I, Yahweh, have spoken in my jealousy[b], when I spend my wrath against them.
translation:
  language: zh_hans
  text: 这样，我的怒气必发尽；我要使我的烈怒落在他们身上，我便得到安慰[a]。我向他们发尽烈怒时，他们就知道，我耶和华曾在我的嫉妒[b]中说过话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我便得以纾解”。希伯来语动词既可表示得到安慰，也可表示审判完成后获得纾解。
    reason: lexical_alternative
  - marker: b
    text: 或译“热忱”。希伯来语词既可指嫉妒，也可指热忱；这里的“嫉妒”保留了关系和盟约层面的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָלָה אַפִּי
  choice: 我的怒气就发尽了
  rationale: כלה与אַף连用，表示怒气完全发泄、走到尽头；“发尽”既保留完成之意，也符合现代汉语表达。
- source_word: וַהֲנִחוֹתִי חֲמָתִי בָּם
  choice: 我要使我的烈怒落在他们身上
  rationale: נוח的使役式直指使烈怒停落于审判对象；“落在他们身上”保留原文的空间意象和בם的指向，避免提前解释为“平息”或“满足”。
- source_word: וְהִנֶּחָמְתִּי
  choice: 我便得了安慰
  rationale: נחם的Niphal在此可指受安慰或审判完成后得到纾解；正文采用较贴近形式的“得了安慰”，并以脚注保留“平息下来”的语义可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中最通行、易识别的神名音译，而不以头衔替代专名。
- source_word: בְּקִנְאָתִי
  choice: 在妒忌中
  rationale: קִנְאָה兼有妒忌与热忱之意；此处保留关系性、盟约性的“妒忌”，同时以脚注说明“热忱”的可能。
- source_word: בְּכַלּוֹתִי חֲמָתִי בָּם
  choice: 我向他们发尽烈怒时
  rationale: ב加不定式结构表达时间或情境；“……时”自然呈现其时间关系，“向他们”表达בם作为审判目标。
theological_decisions:
- issue: 如何表达上帝审判中的情感语言
  choice: 直接保留“怒气”“烈怒”“妒忌”和“得了安慰”
  alternative: 改写为“义愤”“公义得到满足”等较抽象的司法语言
  rationale: 原文刻意使用强烈而具人格性的情感词汇；直译保留先知话语的力度及其中的神学张力，不用后来的系统性解释消解它。
- issue: וְהִנֶּחָמְתִּי所表达的审判后状态
  choice: 我便得了安慰
  alternative: 我便平息下来／我便得到纾解
  rationale: “得了安慰”较直接对应此动词的Niphal形态和基本语义；脚注保留在审判完成后平息、纾解的语境含义。
- issue: 神名יהוה的汉译
  choice: 耶和华
  alternative: 雅威／主
  rationale: “耶和华”在现代中文普通读者中辨识度最高，并且作为专名呈现，不以称号“主”取代原文神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“发尽”前后呼应，呈现原文כלה的重复；“使……落在……身上”保留原文意象。所有脚注标记均置于正文相应词语之后。
