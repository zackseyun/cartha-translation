  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ גַּם אָ֑נִי וְ/עָשִׂ֧יתִי בְ/תוֹכֵ֛/ךְ מִשְׁפָּטִ֖ים לְ/עֵינֵ֥י הַ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I myself am against you, and I will execute judgments in your midst before the eyes of the nations.'
translation:
  language: zh_hans
  text: 所以，主雅威[a]如此说：“看哪，我亲自与你为敌；我要在你中间施行审判，当着列国的面。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：אֲדֹנָי יְהוִה，意为“主雅威”；“雅威”是神的名字。
    reason: 说明复合神圣称号中“主”与神名雅威两个成分。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 这是承接上文罪状并引出后果的推论连词；“所以”在现代汉语中自然、清楚。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知信息中庄重而固定的使者宣告格式。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的“主”和神名 יהוה；这是现代中文圣经语境中庄重且容易识别的复合称号。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 该词引人注意并标示郑重的神圣宣告；“看哪”保留先知话语的庄严感。
- source_word: עָלַיִךְ
  choice: 与你为敌
  rationale: 在审判语境中并非单纯表示方位，而表示敌对和攻击；“与你为敌”准确传达其语用力量。
- source_word: גַּם אֲנִי
  choice: 我亲自
  rationale: 该组合强调神本人介入审判；“我亲自”比逐字译作“我也”更自然地表达强调作用。
- source_word: וְעָשִׂיתִי ... מִשְׁפָּטִים
  choice: 我要……施行审判
  rationale: 希伯来语直译为“行审判”；中文“施行审判”既自然，也保留司法与惩罚行动的含义。
- source_word: בְתוֹכֵךְ
  choice: 在你中间
  rationale: 受话者是以阴性单数拟人化的耶路撒冷，指审判发生在城内。
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: 当着列国的面
  rationale: 传达审判公开发生、被周围列国目睹的意思，同时符合现代汉语表达。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文采用中文读者广泛熟悉的神名形式“耶和华”，并保留 אֲדֹנָי 与 יהוה 两个成分；脚注说明原文结构，使读者看见这里使用的是专名 יהוה，而非重复两个普通称号。
- issue: גַּם אֲנִי 所强调的神亲自介入
  choice: 我亲自与你为敌
  alternative: 我也与你为敌
  rationale: 语境强调神本人站出来审判耶路撒冷；“亲自”保留强调，却不额外解释神为何如此行动。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语，并保留先知宣告的节奏。“看哪”有意保留经文的郑重提示语；“当着列国的面”自然表达审判的公开可见性。
