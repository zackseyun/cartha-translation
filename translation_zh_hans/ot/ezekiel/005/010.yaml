source:
  edition: WLC
  text: לָ/כֵ֗ן אָב֞וֹת יֹאכְל֤וּ בָנִים֙ בְּ/תוֹכֵ֔/ךְ וּ/בָנִ֖ים יֹאכְל֣וּ אֲבוֹתָ֑/ם וְ/עָשִׂ֤יתִי בָ/ךְ֙ שְׁפָטִ֔ים וְ/זֵרִיתִ֥י אֶת כָּל שְׁאֵרִיתֵ֖/ךְ לְ/כָל רֽוּחַ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/010.yaml
  text: Therefore fathers will eat sons in your midst[a], and sons will eat their fathers[b]; and I will execute judgments on you and scatter all your remnant to every wind.
translation:
  language: zh_hans
  text: 因此，在你中间，父亲要吃儿子，儿子也要吃自己的父亲。我要在你身上施行审判，把你所有的余民[a]分散到四面八方[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你所有的幸存者”或“你所余剩的一切”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“到每一风”，意为向各个方向彻底分散。
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的控诉与审判宣告，清楚保留因果推论关系。
- source_word: אָבוֹת ... בָנִים
  choice: 父亲……儿子
  rationale: 原文使用具体的男性亲属称谓；直译既准确，也保留家庭关系彻底颠倒所带来的震撼。
- source_word: יֹאכְלוּ
  choice: 要吃
  rationale: אכל是普通的“吃”；在饥荒与审判语境中指食人惨剧，无须改译为解释性更强的“吞吃”。
- source_word: בְּתוֹכֵךְ
  choice: 在你中间
  rationale: 自然表达事情发生在这座被以阴性单数称呼的城及其群体内部，同时不擅自把所指对象补入正文。
- source_word: וְעָשִׂיתִי בָךְ שְׁפָטִים
  choice: 我要在你身上施行审判
  rationale: 保留עשה与שפטים构成的司法性表达，也传达审判临到受话者的惩罚意味。
- source_word: כָּל שְׁאֵרִיתֵךְ
  choice: 你所有的余民
  rationale: “余民”保留שְׁאֵרִית在圣经语境中的关键词联系；本节明确说他们仍将被分散，因此不赋予该词本节未明说的得救含义。
- source_word: וְזֵרִיתִי
  choice: 分散
  rationale: זרה在这里表示驱散、散布，与流亡和审判图景相合；“分散”在现代汉语中清楚自然。
- source_word: לְכָל רוּחַ
  choice: 到四面八方
  rationale: 这是表示向各个方向彻底分散的希伯来语表达；正文采用自然汉语，脚注保留其“每一阵风”的字面意象。
theological_decisions:
- issue: 审判语境中שְׁאֵרִית的译法
  choice: 余民
  alternative: 幸存者；你所剩下的人
  rationale: “余民”可保留该词较广的圣经用语联系，但不把别处可能具有的复兴或蒙拯救含义带入本节；这里的余民仍是被审判和分散的对象。
- issue: 父子相食的陈述是否弱化处理
  choice: 保留“父亲要吃儿子，儿子也要吃自己的父亲”的直接措辞
  alternative: 以“家人彼此残害”等委婉语概括
  rationale: 原文有意用具体而骇人的饥荒后果宣告审判；委婉化会削弱先知话语的力度，也会抹去双向亲属关系的对应结构。
translation_notes:
  register: 采用现代、庄重而直接的普通话。以两个句子呈现审判宣告，避免过度文言化；保留“父亲—儿子—父亲”的对应结构和“余民”的关键词意义，同时用“四面八方”自然传达希伯来习语，并在脚注说明原文意象。
