source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּ֣י עֲ֠לֵי/כֶם רָעָ֞ב וְ/חַיָּ֤ה רָעָה֙ וְ/שִׁכְּלֻ֔/ךְ וְ/דֶ֥בֶר וָ/דָ֖ם יַעֲבָר בָּ֑/ךְ וְ/חֶ֨רֶב֙ אָבִ֣יא עָלַ֔יִ/ךְ אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/017.yaml
  text: And I will send famine and wild beasts against you[a], and they will bereave you; and pestilence and bloodshed will pass through you, and I will bring a sword upon you. I, Yahweh[d][c][b], have spoken.
translation:
  language: zh_hans
  text: 我必差遣饥荒和凶恶的野兽[a]攻击你们；它们必使你丧失儿女[b]。瘟疫和流血[c]必从你中间经过；我也必使刀剑临到你。是我——雅威[d]——说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“恶兽”，也可译“危险的野兽”或“凶猛的野兽”。
    reason: lexical_alternative
  - marker: b
    text: 也可译“使你失去儿女”或“使你丧子”。原文只用一个动词，常指因儿女死亡而遭受丧子之痛，未另行写出“儿女”一词。
    reason: lexical_alternative
  - marker: c
    text: 原文为“血”；在此审判语境中，很可能指流血或杀戮。
    reason: lexical_alternative
  - marker: d
    text: “雅威”是神名 יהוה 的音译；中文传统也常译作“耶和华”，或以“上主”代称。
    reason: divine_name
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי עֲלֵיכֶם
  choice: 我必使……临到你们
  rationale: 该动词在审判宣告的连续语境中具有将来含义；介词带有敌对、降罚的意味。中文用“使……临到”既自然，也保留主动施行审判的语气。
- source_word: רָעָב
  choice: 饥荒
  rationale: 在先知性审判语境中，所指是灾害性的粮食匮乏，而不只是个人感到饥饿。
- source_word: חַיָּה רָעָה
  choice: 凶猛的野兽
  rationale: 字面为“坏的／恶的兽”，语境指构成威胁并带来审判的野兽。“凶猛”在现代中文中能自然表达其危险性，同时脚注保留其他理解。
- source_word: וְשִׁכְּלֻךְ
  choice: 它们必使你丧失儿女
  rationale: שׁכל在此词形中常指使人遭受丧子之痛。正文明确其通常隐含的对象，使中文含义完整；脚注注明原文未明说“儿女”。
- source_word: וְדֶבֶר
  choice: 瘟疫
  rationale: 该词在审判清单中通常指流行性致命疾病；“瘟疫”符合庄重的先知文体。
- source_word: וָדָם
  choice: 流血的事
  rationale: 原文直译为“血”，但在瘟疫与刀剑并列的审判语境中，很可能指暴力造成的流血。此译保持中文自然，并以脚注保存字面形式。
- source_word: יַעֲבָר בָּךְ
  choice: 必横行在你中间
  rationale: 耶路撒冷在此被拟人化为阴性单数。“横行在你中间”表达灾祸穿行全城的动态和严重性，但没有强化为原文未明说的彻底毁灭。
- source_word: וְחֶרֶב אָבִיא עָלַיִךְ
  choice: 我也必使刀剑临到你
  rationale: 保留“刀剑”这一具体的审判意象，不概括成“战争”；“临到你”自然对应原文的方向性介词。
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: 是我——雅威——说了这话
  rationale: 保留独立代词的强调作用和神名雅威，并以庄严的中文句式表达神谕已经说出、必然兑现的语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为较贴近其通常重构读音的音译，不以称号代替专名；脚注提供中文读者熟悉的传统形式。
- issue: שׁכל 是否明确译出丧失儿女
  choice: 使你丧失儿女
  alternative: 使你丧失亲人；使你丧亡
  rationale: 该动词常专指丧失儿女，但本节没有另列宾语。正文呈现其常见词义，脚注同时说明“儿女”是词义所含而非独立出现的名词，避免掩盖原文的简约和可能范围。
- issue: דָם 的语境含义
  choice: 流血的事
  alternative: 血
  rationale: 在饥荒、野兽、瘟疫、刀剑的审判系列中，“血”很可能转喻暴力流血。译文作适度释义，脚注保留字面读法。
- issue: 单复数人称变化
  choice: 先译“你们”，随后译“你”
  alternative: 全节统一译作“你们”
  rationale: 原文 עֲלֵיכֶם 为阳性复数“你们”，但后续后缀转为阴性单数“你”，指向拟人化的耶路撒冷。保留这一变化，以免抹平原文修辞。
translation_notes:
  register: 采用现代、庄重而易懂的先知性宣告文体。保留原文从复数“你们”转为阴性单数“你”的变化，后者把耶路撒冷视为一个整体并加以拟人化。分号与破折号用于呈现审判项目的层次和末句对说话者身份的强调。
