id: EZK.5.2
reference: Ezekiel 5:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שְׁלִשִׁ֗ית בָּ/א֤וּר תַּבְעִיר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר כִּ/מְלֹ֖את יְמֵ֣י הַ/מָּצ֑וֹר וְ/לָֽקַחְתָּ֣ אֶת הַ/שְּׁלִשִׁ֗ית תַּכֶּ֤ה בַ/חֶ֨רֶב֙ סְבִ֣יבוֹתֶ֔י/הָ וְ/הַ/שְּׁלִשִׁית֙ תִּזְרֶ֣ה לָ/ר֔וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/002.yaml
  text: A third you shall burn in the fire in the midst of the city[a], when the days of the siege are completed; and you shall take a third and strike it with the sword all around the city, and a third you shall scatter to the wind[c][b], and I will draw out a sword after them.
translation:
  language: zh_hans
  text: 当围城的日子满了[a]，你要把三分之一放在城中，用火焚烧；你要拿三分之一，在城的四围用刀砍；再把三分之一扬散到风中[b]。我要拔刀追赶他们[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当围城的日子结束时。”
    reason: 时间结构既可突出规定期限达到足数，也可表达该期限结束。
  - marker: b
    text: 或译：“向风扬散”；希伯来语“风”是单数。
    reason: 保留介词表达和单数形式的另一种直译可能。
  - marker: c
    text: 这里的“拔刀”指拔刀出鞘；原文所用动词本有“倒空、倾出”的意思。
    reason: 说明希伯来语习语的字面背景及其在本句中的含义。
lexical_decisions:
- source_word: שְׁלִשִׁית / הַשְּׁלִשִׁית
  choice: 三分之一
  rationale: 该阴性单数词在这里作名词使用，指上一节分开的头发中的一份；“三分之一”自然清楚，也保留三等份的重复结构。
- source_word: בָּאוּר תַּבְעִיר
  choice: 用火焚烧
  rationale: בער的使役式表示使其燃烧；“用火焚烧”既体现火的工具性，也以庄重而通行的现代汉语传达动作。
- source_word: בְּתוֹךְ הָעִיר
  choice: 在城中
  rationale: 准确保留空间意象，比单说“城里”稍显庄重，同时不显古奥。
- source_word: כִּמְלֹאת יְמֵי הַמָּצוֹר
  choice: 围城的日子满了
  rationale: כ加不定词结构表达时间情境；“满了”保留指定时期达到足数或终点的含义，没有把它仅仅弱化为一般性的结束。
- source_word: תַּכֶּה בַחֶרֶב
  choice: 用刀砍
  rationale: נכה在此指以武器击打；“用刀砍”比“击打”更具体自然，并保留工具性的介词。
- source_word: סְבִיבוֹתֶיהָ
  choice: 在城的四围
  rationale: 阴性后缀指向“城”；明确译出“城”可避免中文代词指代含混，“四围”传达环绕各处的加强意味。
- source_word: תִּזְרֶה לָרוּחַ
  choice: 扬散在风中
  rationale: זרה可指簸扬或散播；上下文对象是剪下的头发，因此“扬散”兼顾动作形象和分散结果，并保留希伯来语单数的“风”。
- source_word: וְחֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: 我要拔刀追赶他们
  rationale: אריק在拔剑语境中表示使剑出鞘；“拔刀”是自然的汉语表达。“追赶他们”保留אַחֲרֵיהֶם所含敌意追击的方向感，也保留第一人称的说话者转换。
theological_decisions:
- issue: 末句说话者转为第一人称
  choice: 保留神直接说“我要拔刀追赶他们”
  alternative: 改成无人称的“必有刀剑追赶他们”
  rationale: 希伯来语אָרִיק是第一人称单数，刻意从给以西结的命令转为神亲自施行的行动；保留这一转换，避免淡化审判行动的主体。
- issue: 末句复数代词的指向
  choice: 译作“他们”
  alternative: 按表层的头发译作“它们”
  rationale: 记号动作中的头发象征将受审判的人群，而希伯来语使用阳性复数代词；“他们”保留由象征物转向其所代表之人的文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。以“焚烧、四围、扬散”保留先知性记号动作的鲜明画面，但避免过度文言化；分号和句号帮助呈现三个三分之一的平行结构及末句神直接发言的转折。
