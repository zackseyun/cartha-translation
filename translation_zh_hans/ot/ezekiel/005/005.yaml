  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה זֹ֚את יְר֣וּשָׁלִַ֔ם בְּ/ת֥וֹךְ הַ/גּוֹיִ֖ם שַׂמְתִּ֑י/הָ וּ/סְבִיבוֹתֶ֖י/הָ אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/005.yaml
  text: 'Thus says the Lord GOD: This is Jerusalem. I have set her in the midst of the nations[a], with lands all around her.'
translation:
  language: zh_hans
  text: 主耶和华[a]如此说：“这就是耶路撒冷。我把她安置在列国之中，四围都是各邦的土地。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“阿多奈 יהוה”；“主”对应尊称“阿多奈”，יהוה 为神名，通常译作“耶和华”。
    reason: 准确说明复合神名的原文构成，并说明正文译名，避免将“雅威”误称为希伯来文直译。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 这是先知宣告的固定引语格式；“如此说”既保留庄重语气，也符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的尊称“主”和 יהוה 的专名“耶和华”，避免把两个词合并为单一称号。
- source_word: זֹאת יְרוּשָׁלִַם
  choice: 这就是耶路撒冷
  rationale: 补出汉语判断词“就是”，保留指示词的强调和辨认作用。
- source_word: בְּתוֹךְ הַגּוֹיִם
  choice: 在列国之中
  rationale: “之中”体现中心位置，强于泛指的“在列国中间”；“列国”符合先知文学的庄重语域。
- source_word: שַׂמְתִּיהָ
  choice: 我把她安置
  rationale: “安置”准确表达“放置、设立”；“她”承接被拟人化并带阴性后缀的耶路撒冷。
- source_word: וּסְבִיבוֹתֶיהָ אֲרָצוֹת
  choice: 四围都是各邦的土地
  rationale: 保留耶路撒冷被周边诸地环绕的空间图景；“各邦的土地”既反映 אֲרָצוֹת 的本义“土地、地域”，也传达此处的地缘语境。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”在简体中文圣经语境中庄重而易懂，并使尊称 אֲדֹנָי 与神的专名 יהוה 都得到表达；脚注说明原文构造，不把它简化为泛称。
- issue: 耶路撒冷位于“列国之中”的含义
  choice: 按空间意象直译，不增添神学解释
  alternative: 译作“列国的中心”
  rationale: 原文表达置于列国之中，但并未明确说明这是地理中心、宗教中心还是象征性中心，因此保留其开放性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“列国”“四围”保留先知文体色彩，但句式简明，普通读者易于理解。
