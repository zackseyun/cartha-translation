source:
  edition: WLC
  text: וַ/תֶּ֨מֶר אֶת מִשְׁפָּטַ֤/י לְ/רִשְׁעָה֙ מִן הַ/גּוֹיִ֔ם וְ/אֶ֨ת חֻקּוֹתַ֔/י מִן הָ/אֲרָצ֖וֹת אֲשֶׁ֣ר סְבִיבוֹתֶ֑י/הָ כִּ֤י בְ/מִשְׁפָּטַ/י֙ מָאָ֔סוּ וְ/חֻקּוֹתַ֖/י לֹא הָלְכ֥וּ בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/006.yaml
  text: And she rebelled against my judgments with wickedness more than the nations[a], and against my statutes more than the lands that are around her; for they rejected my judgments[b], and they did not walk in my statutes.
translation:
  language: zh_hans
  text: 她背叛我的典章，比列国更为邪恶；又背叛我的律例，比她四围的各地更甚；因为他们厌弃我的典章，也不遵行我的律例[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 原文直译为“没有行在其中”；这是希伯来语惯用说法，意思是按这些律例生活、行事。
    reason: cultural_note
lexical_decisions:
- source_word: וַתֶּמֶר
  choice: 背叛了
  rationale: 按 מרה 在盟约语境中的常见意义，表达悖逆、不服从；“她”保留耶路撒冷作为女性形象的人格化写法。
- source_word: מִשְׁפָּטַי
  choice: 我的典章
  rationale: 保留 מִשְׁפָּט 的司法和盟约规范色彩，并与“律例”相区别。
- source_word: לְרִשְׁעָה
  choice: 更邪恶地
  rationale: 在“背叛”这一理解下，将介词短语自然地表达为行为方式；另一种可能是把动词理解为“更改”，见脚注。
- source_word: מִן הַגּוֹיִם
  choice: 比列国更
  rationale: 此处 מִן 具有比较意义，说明耶路撒冷的邪恶悖逆超过列国。
- source_word: חֻקּוֹתַי
  choice: 我的律例
  rationale: 用“律例”表达 חֻקִּים 的成文规定含义，并维持它与“典章”的词义区分。
- source_word: מִן הָאֲרָצוֹת אֲשֶׁר סְבִיבוֹתֶיהָ
  choice: 比她四围的各地更
  rationale: 保留复数“各地”及指向人格化耶路撒冷的阴性代词，不将其现代化为民族国家概念。
- source_word: מָאָסוּ
  choice: 厌弃
  rationale: מאס 不只是拒绝，也常含轻视、弃绝之意；“厌弃”保留这一较强语气。
- source_word: לֹא הָלְכוּ בָהֶם
  choice: 不遵行我的律例
  rationale: 将希伯来语“行在其中”的行为隐喻转为自然现代汉语，意思是依照律例生活和行事。
theological_decisions:
- issue: 人格化城市的阴性单数主语
  choice: 保留“她”，指人格化的耶路撒冷
  alternative: 直接写“耶路撒冷”或用“它”
  rationale: 希伯来语动词及后文代词均为阴性单数；“她”保留先知话语中城市女性化的文学形象。
- issue: וַתֶּמֶר 的词义歧义
  choice: 正文采用“背叛”
  alternative: “更改”或“变更”上帝的典章，使之成为邪恶
  rationale: מרה 在盟约指控中通常表示悖逆，但当前辅音形式亦可能引出“更改”的理解，因此在脚注保留该真歧义。
- issue: 两组盟约法律术语的区分
  choice: מִשְׁפָּטַי 译“典章”，חֻקּוֹתַי 译“律例”
  alternative: 两者统一译作“律法”或“法令”
  rationale: 原文刻意使用两个不同的法律术语；分别翻译可避免抹平其平行结构和法理层次。
- issue: 主语由阴性单数转为复数
  choice: 前句用“她”，解释句用“他们”
  alternative: 全节统一为“她”
  rationale: 原文先以阴性单数人格化城市，后用复数指其中的居民；保留转换可呈现城市与民众之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“典章／律例”保留盟约法律语域；正文避免生硬照搬“行在……中”，但以脚注说明原文隐喻。比较结构在第二分句补出“悖逆”，使中文完整清楚，同时不改变原意。
