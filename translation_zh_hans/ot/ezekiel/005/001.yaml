revisions:
- from: “你，人子啊，要拿一把锋利的刀剑，拿来当作剃头匠的剃刀，从你的头上和胡须上刮过。然后，你要拿一副天平来称量，把剃下的毛发分开。”
  to: “你，人子啊，要为自己拿一把锋利的剑，把它当作理发师的剃刀，用它剃你的头和胡须。然后，要为自己拿一架天平来称量，把剃下的毛发分开。”
  rationale: 修订仅改善原文单数“剑”的对应和现代汉语的表达：保留“拿”的重复、剑作为剃刀的比喻性用途、剃头和胡须、称量，以及将隐含所指明示为剃下的毛发。未添加解释性神学或改变分配动作的含义。
