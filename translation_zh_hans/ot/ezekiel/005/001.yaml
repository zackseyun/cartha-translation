  timestamp: '2026-07-14T07:30:07Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的命令序列、重复的“拿”、以剑作剃刀、剃头和胡须、取称量用的天平，以及分配所剃毛发，均已基本表达。不过“一把锋利的刀剑”将单数“剑”模糊成汉语中常指两类兵器并称的“刀剑”；“从你的头上和胡须上刮过”也不够自然，且“从……上”容易使动作方向含混。
  naturalness: 建议采用“用它剃你的头和胡须”，在保留剃刀语境和原文动作的同时更符合现代汉语。“理发师的剃刀”较“剃头匠的剃刀”更为现代自然。“一架天平”是较恰当的量词。
  terminology: “人子”保留以西结书一贯的称呼，恰当。“锋利的剑”准确对应חֶרֶב חַדָּה；不宜译作“刀剑”。“天平”可准确表达מֹאזְנֵי מִשְׁקָל。
  issues:
  - severity: medium
    issue: “一把锋利的刀剑”
    rationale: חֶרֶב为单数“剑”；现代汉语“刀剑”通常是刀与剑的并称，且与“一把”搭配不够稳妥。
  - severity: low
    issue: “从你的头上和胡须上刮过”
    rationale: 原文是使该器具经过头和胡须；汉语以“用它剃你的头和胡须”更自然清晰，并准确体现剃刀的功能。
  - severity: low
    issue: “剃头匠”“一副天平”
    rationale: 前者略显陈旧，后者量词不够自然；“理发师”“一架天平”更合现代标准汉语。
  revised_text: “你，人子啊，要为自己拿一把锋利的剑，把它当作理发师的剃刀，用它剃你的头和胡须。然后，要为自己拿一架天平来称量，把剃下的毛发分开。”
