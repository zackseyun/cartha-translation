  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם קַח לְ/ךָ֣ חֶ֣רֶב חַדָּ֗ה תַּ֤עַר הַ/גַּלָּבִים֙ תִּקָּחֶ֣/נָּה לָּ֔/ךְ וְ/הַעֲבַרְתָּ֥ עַל רֹאשְׁ/ךָ֖ וְ/עַל זְקָנֶ֑/ךָ וְ/לָקַחְתָּ֥ לְ/ךָ֛ מֹאזְנֵ֥י מִשְׁקָ֖ל וְ/חִלַּקְתָּֽ/ם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/001.yaml
  text: And you[a], son of man, take for yourself a sharp sword; take it as a barber’s razor, and pass it over your head and over your beard[b]. Then take for yourself scales for weighing and divide the hair.
translation:
  language: zh_hans
  text: “你，人子啊，要为自己拿一把锋利的剑，把它当作理发师的剃刀，用它剃你的头和胡须。然后，要为自己拿一架天平来称量，把剃下的毛发分开。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的先知称呼，也贴近希伯来语“人的儿子”这一惯用表达。
- source_word: חֶרֶב חַדָּה
  choice: 一把锋利的刀剑
  rationale: חֶרֶב通常指刀或剑；“刀剑”既保留武器意象，又能自然衔接下文将其当作剃刀使用的象征性动作。
- source_word: תַּעַר הַגַּלָּבִים
  choice: 剃头匠的剃刀
  rationale: 按原文领属结构直译其核心意象；“剃头匠”是现代汉语中清楚、自然的职业称谓。
- source_word: תִּקָּחֶנָּה לָּךְ
  choice: 拿来当作
  rationale: 保留原文再次使用“拿”的表达，同时在汉语中自然说明要把前述刀剑当作剃刀。
- source_word: וְהַעֲבַרְתָּ עַל רֹאשְׁךָ וְעַל זְקָנֶךָ
  choice: 从你的头上和胡须上刮过
  rationale: 保留“使之经过”的动作，并根据剃刀语境以“刮过”表达，不把动作弱化为静态描述。
- source_word: מֹאזְנֵי מִשְׁקָל
  choice: 一副天平来称量
  rationale: 该短语指用于称重的天平；此译清楚保留称量和分配毛发的具体动作。
- source_word: וְחִלַּקְתָּם
  choice: 把剃下的毛发分开
  rationale: 原文宾语是复数代词“它们”，语境所指是刚剃下的头发和胡须。汉语明示“剃下的毛发”可避免代词指向不明，并未增加新的事件内容。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体；保留命令的连续性、刀剑与剃刀之间的强烈意象，以及称量后分开的象征性动作。
