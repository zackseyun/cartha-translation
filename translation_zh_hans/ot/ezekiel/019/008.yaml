base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/008.yaml
  text: Then nations from the provinces set themselves against him all around[a], and they spread their net over him[b]; he was caught in their pit.
translation:
  language: zh_hans
  text: 于是，列国从各省而来，四面攻击他[a]；他们向他撒下他们的网，他就在他们的陷坑[b]中被捉住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国从四周的各省来攻击他。”原文中“四面／四围”可与“攻击他”相连，也可理解为修饰“各省”。
    reason: lexical_alternative
  - marker: b
    text: “陷坑”很可能指捕猎时用作陷阱的坑。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: 来攻击他
  rationale: 此处“נתן על”表达针对某人采取敌对行动。译作“来攻击他”符合现代汉语，也保留围猎和审判语境中的敌意；原文较直译的表达及句法歧义在脚注中说明。
- source_word: גּוֹיִם
  choice: 列国
  rationale: גּוֹיִם在这里指多个国家或民族政治势力。“列国”简洁庄重，也不会额外引入“外邦人”的神学对比。
- source_word: סָבִיב מִמְּדִינוֹת
  choice: 从四周各省
  rationale: סָבִיב强调四面包围，מְדִינוֹת可指行政辖区或省份。此译保留“各省”这一政治地理含义，同时自然表达来自四周的围攻；其与前后成分的连接存在一定歧义，故加脚注。
- source_word: וַיִּפְרְשׂוּ עָלָיו רִשְׁתָּם
  choice: 他们向他张开网罗
  rationale: פרשׂ意为铺开、张开，רֶשֶׁת指网。译文保持捕猎狮子的比喻，并用现代汉语常见的“张开网罗”表达。
- source_word: בְּשַׁחְתָּם
  choice: 在他们的陷坑中
  rationale: שַׁחַת可指坑，在捕猎语境中尤可能是用作陷阱的坑。“陷坑”既简练又显明捕猎功能。
- source_word: נִתְפָּשׂ
  choice: 被捉住
  rationale: 该被动形式表示被捕获或捉住。“被捉住”与网和陷坑的围猎意象紧密呼应。
