  yaml_path: translation/ot/ezekiel/019/001.yaml
  text: And you[b][a], raise a lamentation over the princes of Israel.
translation:
  language: zh_hans
  text: 至于你，要为以色列的众首领[b]作[a]一首哀歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“唱起一首哀歌”或“吟起一首挽歌”。
    reason: lexical_alternative
  - marker: b
    text: “首领”在这里可能特指以色列或犹大的王室统治者，而不只是一般的领袖。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 连词加独立人称代词承接上文，同时突出对以西结的直接吩咐；“至于你”自然表达这一轻度强调。
- source_word: שָׂא קִינָה
  choice: 唱起一首哀歌
  rationale: שָׂא本义为“举起、承担”，与קִינָה连用时构成开始或发出哀歌的惯用表达。“唱起”在现代汉语中自然，也保留了发声吟唱的意象。
- source_word: קִינָה
  choice: 哀歌
  rationale: 该词指为死亡或灾祸所作的挽歌、哀悼之歌；“哀歌”简洁庄重，并符合本章的诗歌体裁。
- source_word: אֶל
  choice: 为
  rationale: 该介词在哀歌语境中标明哀悼或作歌的对象；汉语“为……唱起哀歌”最为自然。
- source_word: נְשִׂיאֵי
  choice: 众首领
  rationale: 该词指地位尊贵的领袖或统治者；“首领”既保留政治统治含义，又不将其直接限定为“君王”。“众”明确表达复数。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代汉语中通行的专名译法。
theological_decisions:
- issue: “以色列的众首领”具体指谁
  choice: 正文保留较宽泛而具有政治意味的“众首领”
  alternative: 以色列的众王；以色列的王室统治者
  rationale: 希伯来文使用נְשִׂיאֵי，而非明确表示“君王”的מְלָכִים。虽然本章语境显示所哀悼的与王室人物密切相关，正文不应把原文未明说的身份进一步收窄；脚注提示其可能特指王室统治者。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“至于你”突出先知所受的直接吩咐；“唱起一首哀歌”保持诗性，但不过分古雅。脚注标记均置于其所说明的词语之后。
