  text: וַ/יִּתְהַלֵּ֥ךְ בְּ/תוֹךְ אֲרָי֖וֹת כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/006.yaml
  text: He prowled among the lions; he became a young lion[a]. He learned to tear prey; he devoured men.
translation:
  language: zh_hans
  text: 它在群狮中出没，成了一头少壮狮子。它学会撕裂猎物，吞吃人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人”也可理解为“人们”或“人类”；希伯来文在这里可作集合性用法。
    reason: 说明 אָדָם 在此既是单数形式，也可能具有集合意义。
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: 出没
  rationale: 该词在此表示在群狮中反复往来；结合狮子的捕食意象，“出没”比中性的“行走”更自然，同时没有把动作过度具体化。
- source_word: בְּתוֹךְ אֲרָיוֹת
  choice: 在群狮中
  rationale: 准确表达“在狮子中间”，并以自然简洁的现代汉语保留群体意象。
- source_word: כְּפִיר
  choice: 少壮狮子
  rationale: 指已经强健、但尚属年轻的狮子，并非幼小的狮崽；“少壮狮子”兼顾年龄与力量。
- source_word: הָיָה
  choice: 成了
  rationale: 叙事次序呈现成长和变化，因此译作“成了”比静态的“是”更合乎语境。
- source_word: וַיִּלְמַד
  choice: 学会
  rationale: 原文直指习得某种行为，并未说明有外在训练者，故不译作“受训”。
- source_word: לִטְרָף טֶרֶף
  choice: 撕裂猎物
  rationale: 动词与同源名词连用，加强捕食动作；“撕裂猎物”保留狮子意象中的暴烈感。
- source_word: אָדָם
  choice: 人
  rationale: 单数形式在此可作集合性用法；汉语“人”既贴近原文形式，也能自然涵盖所吞吃的人们。
- source_word: אָכָל
  choice: 吞吃
  rationale: 在猛兽捕食的语境中，“吞吃”比普通的“吃”更有力度，又不超出原文意象。
theological_decisions:
- issue: 捕食隐喻中 אָדָם 的范围
  choice: 人
  alternative: 人们／人类
  rationale: 这里是寓言性的捕食描写，并非对人论作教义陈述。“人”保留希伯来文单数形式及其集合性歧义，脚注说明也可理解为多人或人类。
translation_notes:
  register: 采用现代、凝练而庄重的叙事诗体。以“它”维持直接的狮子意象；短句和并列结构保留原文逐步发展的节奏。
