  text: וְ/עַתָּ֖ה שְׁתוּלָ֣ה בַ/מִּדְבָּ֑ר בְּ/אֶ֖רֶץ צִיָּ֥ה וְ/צָמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/013.yaml
  text: And now she is planted in the wilderness[a], in a dry and thirsty land.
translation:
  language: zh_hans
  text: 如今，它被栽在旷野里[a]，在干旱缺水之地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被移栽到旷野里。”上下文可能包含从原处移走、重新栽种的意思，但这个希伯来语分词本身更直接的意思是“被栽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 既承接上文，又转入当前境况；“如今”在现代汉语中简洁庄重。
- source_word: שְׁתוּלָה
  choice: 被栽
  rationale: 被动分词直接描述葡萄树处于被栽种的状态；上下文可暗示移栽，但词形本身并未明确表达迁移。
- source_word: בַמִּדְבָּר
  choice: 在旷野里
  rationale: מִדְבָּר可指荒野、旷野或干旱草原，并不专指沙漠；“旷野”保留流放与荒凉的意象。
- source_word: בְּאֶרֶץ
  choice: 在……之地
  rationale: 该短语进一步说明所在环境；汉语以“在……之地”自然衔接后面的两个性质描述。
- source_word: צִיָּה
  choice: 干旱
  rationale: 表达土地干燥、受旱的状态，措辞自然清楚。
- source_word: וְצָמָא
  choice: 缺水
  rationale: 原词本义与“口渴”有关，用于土地时表示无水；“缺水”比直译为“口渴”更符合现代汉语，同时保留核心意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“它”承接上文葡萄树的比喻；“干旱缺水”避免将土地拟人化为“口渴”，同时准确呈现缺乏水分的含义。
