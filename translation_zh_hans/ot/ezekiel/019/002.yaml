  text: וְ/אָמַרְתָּ֗ מָ֤ה אִמְּ/ךָ֙ לְבִיָּ֔א בֵּ֥ין אֲרָי֖וֹת רָבָ֑צָה בְּ/ת֥וֹךְ כְּפִרִ֖ים רִבְּתָ֥ה גוּרֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/002.yaml
  text: and say[a], ‘What was your mother? A lioness. Among lions she lay down[b]; in the midst of young lions she reared her cubs.’
translation:
  language: zh_hans
  text: '你要说：

    “你母亲是什么？是一头母狮！

    她卧在群狮之中，

    在少壮狮子中养大自己的幼崽。”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה
  choice: 是什么
  rationale: 保留希伯来文疑问词所形成的修辞性设问，不将其顺译为明喻；下句用“是一头母狮”回答，符合现代汉语诗体表达。
- source_word: אִמְּךָ
  choice: 你母亲
  rationale: 保留第二人称阳性单数后缀及“母亲”的明确称谓。
- source_word: לְבִיָּא
  choice: 一头母狮
  rationale: 该名词明确为阴性，译作“母狮”准确保留母性意象。
- source_word: בֵּין אֲרָיוֹת
  choice: 在群狮之中
  rationale: אֲרָיוֹת 在这里可泛指众狮；“群狮”简洁自然，并避免无根据地限定为母狮。
- source_word: רָבָצָה
  choice: 卧
  rationale: 该动词描写动物卧下或伏卧；“卧”既保留姿态意象，也适合哀歌的凝练语体。
- source_word: בְּתוֹךְ כְּפִרִים
  choice: 在少壮狮子中
  rationale: בְּתוֹךְ 表示处于其间；כְּפִירִים 通常指已经颇具力量的年轻狮子，而非尚在哺乳期的幼崽，因此译作“少壮狮子”。
- source_word: רִבְּתָה
  choice: 养大
  rationale: 该动词本有增多、长大的语义，在以“幼崽”为宾语的母狮意象中，最自然地指养育其长大，同时仍略带使之壮大的意味。
- source_word: גוּרֶיהָ
  choice: 自己的幼崽
  rationale: 该词指母狮的幼兽，并带第三人称阴性单数所属后缀；“自己的幼崽”在汉语中明确回指母狮。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而凝练的汉语诗体。保留原文“你母亲是什么？”这一突兀有力的修辞设问及其回答，不把母亲的身份预先解释为某一政治实体；分行呈现平行结构。
