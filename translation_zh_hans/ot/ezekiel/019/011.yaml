  text: וַ/יִּֽהְיוּ לָ֞/הּ מַטּ֣וֹת עֹ֗ז אֶל שִׁבְטֵי֙ מֹֽשְׁלִ֔ים וַ/תִּגְבַּ֥הּ קֽוֹמָת֖/וֹ עַל בֵּ֣ין עֲבֹתִ֑ים וַ/יֵּרָ֣א בְ/גָבְה֔/וֹ בְּ/רֹ֖ב דָּלִיֹּתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/011.yaml
  text: And she had strong branches for rulers’ scepters[a], and its stature rose high among the thick boughs; it was seen in its height, in the abundance of its branches.
translation:
  language: zh_hans
  text: 她长出强壮的枝条，可作统治者的权杖；她的身量高耸在茂密的枝叶间[a]，因高大、枝条繁多而格外显眼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“高过浓密的枝叶”，传统上也有译作“高过云层”的。这里的希伯来语含义不确定；按葡萄树的语境，较可能指浓密的枝叶。
    reason: 说明 עַל בֵּין עֲבֹתִים 的句法与词义歧义，并保留传统译法。
lexical_decisions:
- source_word: מַטּוֹת עֹז
  choice: 强壮的枝条
  rationale: מַטּוֹת 可指杖、杆或枝条；本节处于葡萄树的比喻中，译作“枝条”保留植物意象，עֹז 则表达强健有力。
- source_word: אֶל שִׁבְטֵי מֹשְׁלִים
  choice: 可作统治者的权杖
  rationale: שֵׁבֶט 与“统治者”连用时自然指王权的权杖；“可作”以通顺中文表达这些枝条与权杖之间的用途或适用关系，同时不把 אֶל 过度解释为实际制作过程。
- source_word: וַתִּגְבַּהּ קוֹמָתוֹ
  choice: 她的身量高耸
  rationale: קוֹמָה 指身量、高度或形态；“身量高耸”既保留拟人化色彩，也表达葡萄树向上长高。
- source_word: עַל בֵּין עֲבֹתִים
  choice: 在茂密的枝叶间
  rationale: עֲבֹתִים 可指浓密枝叶或粗密枝杈；葡萄树语境支持植物性理解。“在……间”传达 בֵין，避免把有争议的 עַל 机械译成“在……之上”。
- source_word: וַיֵּרָא
  choice: 格外显眼
  rationale: Nifal 形式可表示“被看见”或“显现”；现代中文用“显眼”自然表达因高耸而清楚可见。
- source_word: בְגָבְהוֹ בְּרֹב דָּלִיֹּתָיו
  choice: 因高大、枝条繁多
  rationale: 两个 בְ 短语说明其显眼的特征或原因；דָּלִיּוֹת 指伸展或下垂的枝条，“枝条繁多”清楚保留繁茂意象。
theological_decisions: []
