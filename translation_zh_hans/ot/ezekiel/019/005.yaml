  yaml_path: translation/ot/ezekiel/019/005.yaml
  text: When she saw that she had waited in vain[a], that her hope was lost, she took one of her cubs and made him a young lion.
translation:
  language: zh_hans
  text: 母狮看见自己等候落空[a]，希望破灭，就从自己的幼崽中取了一只，使它成为一头少壮狮子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“见自己衰弱了”或“见自己失望了”。这里的希伯来词含义难定；正文按上下文译作等候落空。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא כִּי
  choice: 母狮见
  rationale: 承接狮母的比喻意象；כִּי在此引出所见的内容。中文不必另译“她看见的是”，即可自然推进哀歌叙事。
- source_word: נוֹחֲלָה
  choice: 自己等候落空
  rationale: 该词词形和含义均较困难。结合下句“希望破灭”，正文采用期待未能实现的语境义，同时以脚注保留“衰弱”“失望”等可能。
- source_word: אָבְדָה תִּקְוָתָהּ
  choice: 希望破灭
  rationale: אָבַד表达失去、归于无有；“希望破灭”是自然、庄重的现代汉语，并保留哀歌的情感力度。
- source_word: וַתִּקַּח אֶחָד מִגֻּרֶיהָ
  choice: 就从幼崽中选了一只
  rationale: גּוּר在母狮意象中指幼狮。“选了一只”在汉语中自然表达从众幼崽中取其一，同时不额外引入正式任命之意。
- source_word: כְּפִיר
  choice: 少壮狮子
  rationale: כְּפִיר指已非幼崽而尚属年轻的狮子。“少壮狮子”既区别于“幼崽”，又比单译“狮子”更准确。
- source_word: שָׂמָתְהוּ
  choice: 把它养成
  rationale: 字面为“把它立为／使它成为”。在幼狮成长的比喻语境中，“养成”符合自然汉语，并表达母狮使幼崽成为少壮狮子的过程。
