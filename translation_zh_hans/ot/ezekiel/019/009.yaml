base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/009.yaml
  text: They put him in a cage with hooks[a], and brought him to the king of Babylon; they brought him into strongholds[b], so that his voice might no longer be heard on the mountains of Israel.
translation:
  language: zh_hans
  text: 他们用钩子[a]把它关进笼中，带到巴比伦王那里；又把它带进堡垒[b]，使它的声音不再传到以色列的群山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “钩子”也可指环或拘束器具；原文没有说明其所钩的具体部位。“用钩子把它关进笼中”也可译作“把它放在笼里，用钩子制住”。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”也可译作“要塞”“拘禁之处”，或可能指“围攻设施”；原词可指坚固的处所，也与捕获、拘禁有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֻהוּ בַסּוּגַר
  choice: 把它关进笼中
  rationale: סוּגַר指封闭的笼子或拘禁之处；上下文延续狮子的比喻，因此译作“笼”最能保留意象。“关进”也自然表达וַיִּתְּנֻהוּ在拘禁语境中的动作。
- source_word: בַּחַחִים
  choice: 用钩子
  rationale: חַחִים可指控制被捕动物或俘虏的钩、环；原文未明说钩在鼻中或颚中，故不补入具体部位。
- source_word: וַיְבִאֻהוּ אֶל מֶלֶךְ בָּבֶל
  choice: 带到巴比伦王那里
  rationale: 使役形态的בוא在此为“带到”；此译自然并准确保留目的地。
- source_word: יְבִאֻהוּ בַּמְּצֹדוֹת
  choice: 把它押进堡垒
  rationale: מְצֹדוֹת可指堡垒、要塞，也可能泛指拘禁或围捕设施；“堡垒”保留基本词义，“押进”则体现被俘后受严密拘禁的语境。
- source_word: לְמַעַן לֹא יִשָּׁמַע קוֹלוֹ עוֹד
  choice: 使它的声音不再传到
  rationale: קוֹל直译为“声音”；不径译为“吼声”，以同时保留狮子比喻与其所代表之统治者的双重指向。希伯来语的יִשָּׁמַע为被听见，汉语“传到”结合后面的群山，表达更自然。
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: 以色列的群山上
  rationale: 这是以西结书常见的地理表达；“群山”准确且符合现代汉语文体。介词אֶל本有朝向意味，与“不再传到”相配。
theological_decisions:
- issue: 被捕之狮与犹大君王之间的比喻关系
  choice: 保留动物意象，以“它”指称被捕的狮子，不在正文点明具体历史君王
  alternative: 在正文中明确解释为约雅斤或另一位犹大王
  rationale: 本节延续哀歌中的狮子比喻，希伯来文本在此未点名君王；译文不应将有争议的历史身份直接写入正文。
- issue: קוֹלוֹ是一般“声音”还是狮子的“吼声”
  choice: 声音
  alternative: 吼声
  rationale: “声音”保留原词的广度及比喻的双重层面；“吼声”虽符合狮子语境，却会缩窄原文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“笼”“钩子”保留狮子被捕的鲜明意象；以“押进”传达俘虏被严密拘禁的情境，但不在正文中确定具体君王身份。所有脚注标记均已置于正文相应位置。
