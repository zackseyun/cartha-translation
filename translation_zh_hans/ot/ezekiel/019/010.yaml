base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/010.yaml
  text: Your mother was like a vine in your vineyard[a], planted by waters; she was fruitful and full of branches because of abundant waters.
translation:
  language: zh_hans
  text: 你的母亲像一棵葡萄树，在你的血中[a]，栽在水边；因水源丰沛，她果实累累，枝条繁茂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在你的血中”，含义难解；有些译本或学者将其按其他解释或文本校改理解为“在你的形象中”或“在你的葡萄园中”。
    reason: alternative_reading
lexical_decisions:
- source_word: אִמְּךָ
  choice: 你的母亲
  rationale: 按字面保留第二人称所属关系及“母亲”的诗歌形象；上下文虽以她象征王室或民族，正文不直接释义。
- source_word: כַגֶּפֶן
  choice: 好像一棵葡萄树
  rationale: כַ־表示比较；“葡萄树”在现代汉语中自然地表达גֶּפֶן，并保留明喻。
- source_word: בְּדָמְךָ
  choice: 在你的血中[a]
  rationale: 马所拉文本的辅音和元音所指向的直译是“在你的血中”。此语含义晦涩，但不宜在正文中无声改写；其他解释列入脚注。
- source_word: עַל מַיִם שְׁתוּלָה
  choice: 栽种在水边
  rationale: עַל在此水源意象中表达临水的位置；שְׁתוּלָה是阴性被动形式。“栽种在水边”符合现代汉语表达。
- source_word: פֹּרִיָּה
  choice: 果实累累
  rationale: 表达“多结果子、丰产”的形容意义，也与诗体语域相称。
- source_word: וַעֲנֵפָה
  choice: 枝条繁茂
  rationale: 该词表示多枝或枝条茂盛；此译比生硬的“多枝的”自然。
- source_word: מִמַּיִם רַבִּים
  choice: 因水源丰沛
  rationale: מִן在此可表达来源或原因；“水源丰沛”自然说明葡萄树结果多、枝条茂盛的缘由，同时保留复数水量充足的意象。
theological_decisions:
- issue: 如何处理晦涩短语בְּדָמְךָ
  choice: 正文保留马所拉文本所指向的“在你的血中”，以脚注列出其他解释。
  alternative: 在你的样式中；在你的葡萄园中
  rationale: 这是文本和词义上的难题，而非应由译者消解的教义问题。保留难解读法，避免把推测性修订直接写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“果实累累，枝条繁茂”保持哀歌中的诗意和平行感；女性代词“她”承接“母亲”这一拟人形象。
