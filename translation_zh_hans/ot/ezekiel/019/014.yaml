  text: וַ/תֵּצֵ֨א אֵ֜שׁ מִ/מַּטֵּ֤ה בַדֶּ֨י/הָ֙ פִּרְיָ֣/הּ אָכָ֔לָה וְ/לֹא הָ֥יָה בָ֛/הּ מַטֵּה עֹ֖ז שֵׁ֣בֶט לִ/מְשׁ֑וֹל קִ֥ינָה הִ֖יא וַ/תְּהִ֥י לְ/קִינָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/014.yaml
  text: And fire went out from a branch of its limbs[a]; it consumed its fruit, and there was not in it a strong branch, a scepter to rule. This is a lamentation[b], and it has become a lamentation.
translation:
  language: zh_hans
  text: 火从它枝干上的一根枝条[a]发出，烧尽了它的果子；其中再没有强壮的枝条可作掌权的权杖。这是一首哀歌[b]，也成了哀歌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “枝条”也可译作“杖”或“权杖”。希伯来语מַטֶּה可指枝条、棍杖或权杖；这里把葡萄树的枝条意象与君王的权柄意象交织在一起。
    reason: lexical_alternative
  - marker: b
    text: 末句也可理解为：“这是哀歌，并且要用作哀歌。”原文保留了所哀悼之事与这首哀歌之间的双重意味。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: 火……发出
  rationale: 保留叙事推进和具体的火焰意象；汉语无需另加不定冠词。
- source_word: מִמַּטֵּה בַדֶּיהָ
  choice: 从它枝条中的一根杖
  rationale: מַטֶּה可指杖、枝条；בַּד指枝条。译作“枝条中的一根杖”，既区分两个词，也保留葡萄树意象与王权意象的交叠。
- source_word: פִּרְיָהּ אָכָלָה
  choice: 烧尽了它的果子
  rationale: 直译为“吞吃”，但以火为主语时，“烧尽”是自然且力度相当的现代汉语。
- source_word: וְלֹא הָיָה בָהּ
  choice: 它里面再没有
  rationale: 保留希伯来文存在句和“在其中”的含义；“再”体现先前拥有、如今失去的上下文结果。
- source_word: מַטֵּה עֹז
  choice: 强壮的枝条
  rationale: 此处首先承接葡萄树比喻，因此译作“枝条”；עֹז表达力量，译为“强壮”。
- source_word: שֵׁבֶט לִמְשׁוֹל
  choice: 可以作掌权的权杖
  rationale: שֵׁבֶט在这里带有君王权柄含义；“可以作”显明它与前面的强壮枝条同位，同时保留植物与王权双重意象。
- source_word: קִינָה הִיא
  choice: 这是一首哀歌
  rationale: 自然表达无动词判断句的强调语气，并适合诗歌体裁。
- source_word: וַתְּהִי לְקִינָה
  choice: 也成了哀歌
  rationale: 保留结果状态，并不强行判定所指究竟是这篇诗还是其所哀悼的对象。
theological_decisions:
- issue: 葡萄树比喻中的王权意象
  choice: 将מַטֶּה依上下文分别译为“杖”和“枝条”，并将שֵׁבֶט译为“权杖”，保存植物和王权意象的交叠。
  alternative: 统一译作“杖”，突出王权；或统一译作“枝条”，突出葡萄树比喻。
  rationale: 原文有意把树木与统治权的意象交织起来；译文不将其简化为单一意象。
- issue: וַתְּהִי לְקִינָה的指涉
  choice: 译作“也成了哀歌”，保留主语指涉的开放性。
  alternative: 明确译作“这事成了哀歌”或“它成为一首哀歌”。
  rationale: 希伯来文阴性主语可与前句的קִינָה呼应，也可能概括所描述的对象或诗篇本身，不宜在正文中擅自限定。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“烧尽”“掌权的权杖”避免生硬直译，同时保留原诗的毁灭感与君王意象。两个脚注标记均已置于正文。
