source:
  edition: WLC
  text: וַ/תֻּתַּ֤שׁ בְּ/חֵמָה֙ לָ/אָ֣רֶץ הֻשְׁלָ֔כָה וְ/ר֥וּחַ הַ/קָּדִ֖ים הוֹבִ֣ישׁ פִּרְיָ֑/הּ הִתְפָּרְק֧וּ וְ/יָבֵ֛שׁוּ מַטֵּ֥ה עֻזָּ֖/הּ אֵ֥שׁ אֲכָלָֽתְ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/012.yaml
  text: But she was uprooted in wrath; she was thrown down to the ground[a]. And the east wind dried up her fruit; her strong branch was torn off and withered; fire consumed it.
translation:
  language: zh_hans
  text: 但它在烈怒中被连根拔起，被抛到地上。东风使它的果子干枯；它那强壮的枝条[a]被扯断，枯萎了；火将它烧尽。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“它强有力的权杖”或“它力量的杖”。希伯来语此词既可指枝条，也可指杖或权杖；在这首哀歌中，葡萄树意象与王权含义彼此交织。
    reason: 保留 מַטֵּה 的植物意象与王权含义之间的词义张力。
lexical_decisions:
- source_word: וַתֻּתַּשׁ
  choice: 被连根拔起
  rationale: 该动词在葡萄树意象中表示从土里拔除；“连根拔起”自然、鲜明地传达其被彻底拔除的被动含义。
- source_word: בְּחֵמָה
  choice: 在烈怒中
  rationale: חֵמָה表示炽烈的愤怒；此译保留原文紧凑的介词结构，也不擅自补出发怒者。
- source_word: לָאָרֶץ הֻשְׁלָכָה
  choice: 摔在地上
  rationale: 被动动词与“到地上”结合，表达猛烈抛落和受辱降卑；“摔在地上”符合现代汉语表达。
- source_word: רוּחַ הַקָּדִים
  choice: 东风
  rationale: 这是希伯来语对具有毁坏作用之东风的常用称呼。
- source_word: הוֹבִישׁ פִּרְיָהּ
  choice: 使它的果子干枯
  rationale: 使役形明确表示东风令果实干枯；译文保留因果关系和植物意象。
- source_word: הִתְפָּרְקוּ
  choice: 被扯断
  rationale: 该词表达断裂、脱落或被分离；“扯断”保留动作的猛烈性。原文动词为复数，而相邻名词形式为单数，译文不刻意消除这一诗歌语法张力。
- source_word: וְיָבֵשׁוּ
  choice: 枯萎了
  rationale: 表示断离后的枯干状态；“枯萎”适合枝条，并避免与前面的“果子干枯”完全重复。
- source_word: מַטֵּה עֻזָּהּ
  choice: 它那强壮的枝条
  rationale: מַטֶּה可指枝条、杖或权杖。当前语境以葡萄树为主，因此正文采用“枝条”，同时在脚注保留王权含义。
- source_word: אֵשׁ אֲכָלָתְהוּ
  choice: 火将它烧尽
  rationale: 直译意象为“火吞吃了它”；“烧尽”在现代汉语中自然表达火的彻底毁灭作用，并保留单数受词的指向。
theological_decisions:
- issue: 王室葡萄树哀歌中 מַטֵּה עֻזָּהּ 的双重意象
  choice: 正文译作“它那强壮的枝条”，脚注说明也可理解为强有力的权杖或力量之杖。
  alternative: 正文译作“它强有力的权杖”或“它力量的杖”。
  rationale: 紧邻语境是葡萄树被拔起、果实干枯和枝条折断，因此植物意象应在正文中保持；但本章尤其第11节又借枝条指向君王统治，故以脚注保存王权层面的真实含义，不将诗歌张力单向化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“它”承接上下文中的葡萄树；保留原文被动结构和未明说的施事者。分号呈现诗行中连续而层层加深的毁灭图景。
