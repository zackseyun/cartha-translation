base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/003.yaml
  text: She brought up one of her cubs; he became a young lion[a], and he learned to tear prey; he devoured people.
translation:
  language: zh_hans
  text: 母狮养大了自己的一只幼崽；它长成一头年轻的狮子，学会了攫取猎物，吞吃人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַל
  choice: 养大了
  rationale: עלה在使役语境中可指“使上来、带大”；结合母狮与幼崽的意象，“养大”自然表达抚育成长的过程。
- source_word: אֶחָד מִגֻּרֶיהָ
  choice: 自己的一只幼崽
  rationale: גּוּר在本段指狮子的幼崽；“一只”保留原文的部分结构，物主反身形式则译为“自己”。
- source_word: כְּפִיר הָיָה
  choice: 它长成一头少壮狮子
  rationale: כְּפִיר指已有捕猎能力的年轻狮子；היה在从幼崽到年轻狮子的成长序列中宜译作“长成”。“少壮狮子”比“幼狮”更能区别于前面的幼崽。
- source_word: וַיִּלְמַד לִטְרָף טֶרֶף
  choice: 学会了撕捕猎物
  rationale: 原文以同根动词和名词构成强调性表达。“撕捕猎物”兼顾捕获与撕食的凶猛意象，且在现代汉语中简洁可懂。
- source_word: אָדָם
  choice: 人类
  rationale: 此处虽为单数集合性用法，却泛指人而非特指一名男性；“人类”保留集合意义，也避免误解为只吞吃一个人。
- source_word: אָכָל
  choice: 吞吃
  rationale: אָכַל本义为“吃”，在狮子捕食人的语境中，“吞吃”比普通的“吃”更有力度，又不过度增添原文没有的细节。
theological_decisions:
- issue: 集合性单数אָדָם的译法
  choice: 人类
  alternative: 人；人们
  rationale: 原文采用单数אָדָם，可泛指人类。译作“人类”既保留其类别性指称，也不把它限定为男性个体；不另加脚注，以免制造汉语正文中并不存在的歧义。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。以“母狮”明确阴性主语并承接本章寓言语境；后续用“它”指狮子，符合现代汉语动物指称习惯。句式保留原文由幼崽、成长、学猎到吞人的递进结构。
