base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/007.yaml
  text: He knew their widows[a], and he laid waste their cities; the land and its fullness was desolated by the sound of his roaring.
translation:
  language: zh_hans
  text: 他认识他们的寡妇[a]，又使他们的城邑荒废；大地和其中的一切，都因他的咆哮声而变得荒凉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他认识他的寡妇”。这里的“认识”可能含有敌意或性方面的意味；有人因此理解为他凌辱妇女。也有人依据另一读法译作“他毁坏他们的宫殿”。
    reason: 说明这一疑难希伯来语短语的字面形式、可能语义及替代读法。
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 认识了
  rationale: ידע通常意为“认识、知道”，也可委婉指性关系。此处刻意保留直译的含混性，不在正文中擅自确定为性侵犯或其他暴行。
- source_word: אַלְמְנוֹתָיו
  choice: 他们的寡妇
  rationale: 马所拉文本字面作“他的寡妇”，但与下句“他们的城邑”并列，并从受害者语境看，译作“他们的寡妇”较连贯；文本本身的困难及其他读法在脚注中交代。
- source_word: וְעָרֵיהֶם הֶחֱרִיב
  choice: 又使他们的城邑荒废
  rationale: החריב表示使某处遭毁坏、荒废；“使……荒废”既保留使役含义，也符合哀歌的庄重语体。
- source_word: וַתֵּשַׁם
  choice: 变得荒凉
  rationale: 该动词表达陷入荒凉的结果状态；译成“变得荒凉”自然地呈现土地遭破坏后的景况。
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: 大地和其中的一切
  rationale: 这是指土地及其所容纳的一切；避免生硬直译“其丰满”，以现代汉语清楚传达希伯来语习语。
- source_word: מִקּוֹל שַׁאֲגָתוֹ
  choice: 都因他的咆哮声
  rationale: מן在此表示原因或来源；“因”清楚表达狮子般的吼声所造成的毁灭性后果。
theological_decisions:
- issue: 审理比喻性审判诗中 אַלְמְנוֹתָיו 的疑难读法
  choice: 正文保留“寡妇”及“认识”的马所拉文本词义，并用脚注说明代词及语义上的歧义
  alternative: 按另一读法译作“他毁坏他们的宫殿”，或将动词明确译为“凌辱”
  rationale: 这里主要是词汇和文本批判问题，并非教义判断。正文不以较顺畅的推测读法取代现存希伯来文本，也不把可能的性或暴力意味确定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语言。“城邑”略带诗体色彩，与本章哀歌体裁相称；“大地和其中的一切”以自然汉语表达紧凑的希伯来语习语。脚注标记[a]已在正文相应位置出现。
