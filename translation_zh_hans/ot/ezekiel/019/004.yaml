  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֥וּ אֵלָ֛י/ו גּוֹיִ֖ם בְּ/שַׁחְתָּ֣/ם נִתְפָּ֑שׂ וַ/יְבִאֻ֥/הוּ בַֽ/חַחִ֖ים אֶל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/004.yaml
  text: The nations heard of him[a]; he was caught in their pit[c][b], and they brought him with hooks to the land of Egypt.
translation:
  language: zh_hans
  text: 列国听到了关于他的消息[a]；他在他们的坑中被捉住；他们用钩子把他带到埃及地。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国听见了他。”这里的希伯来语表达也可指听到有关他的消息。
    reason: lexical_alternative
  - marker: b
    text: “钩子”也可指用来约束被捕动物或俘虏的环或钩；原文没有明确说明钩在身体的哪个部位。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: 听到了他的消息
  rationale: שׁמע אל 在本处结合列国随后捕捉狮子的语境，更自然地指听见有关他的消息，而非直接听他说话；此译也保留“听见”这一希伯来语表达。
- source_word: גּוֹיִם
  choice: 列国
  rationale: 指以色列以外的各国或各族；“列国”简洁、庄重，也避免引入后期语境中的“外邦人”用法。
- source_word: בְּשַׁחְתָּם
  choice: 在他们的坑中
  rationale: שַׁחַת 是坑或陷坑；在捕狮意象中指猎捕所用的坑。保留具体意象，不泛化为“圈套”。
- source_word: נִתְפָּשׂ
  choice: 被捉住了
  rationale: 该词为被动形态，表示被捕获；“被捉住”与猎捕幼狮的上下文自然衔接。
- source_word: וַיְבִאֻהוּ
  choice: 他们把他带到
  rationale: בוא 的使役形基本义为“带来、带去”；此处按中文目的地表达译作“带到”。
- source_word: בַחַחִים
  choice: 用钩子
  rationale: חַחִים 可指约束动物或俘虏的钩、环；“钩子”保留器具意象，而不把经文未明说的部位限定为鼻部。
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: 到埃及地
  rationale: 保留希伯来语“埃及之地”的正式地理表达，同时符合现代汉语习惯。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“列国”“埃及地”保留先知文学的正式语体；分为两句，使“落入坑中”与“被捉住”的连续动作清楚自然。
