id: EZK.7.3
reference: Ezekiel 7:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַתָּה֙ הַ/קֵּ֣ץ עָלַ֔יִ/ךְ וְ/שִׁלַּחְתִּ֤י אַפִּ/י֙ בָּ֔/ךְ וּ/שְׁפַטְתִּ֖י/ךְ כִּ/דְרָכָ֑יִ/ךְ וְ/נָתַתִּ֣י עָלַ֔יִ/ךְ אֵ֖ת כָּל תּוֹעֲבֹתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/003.yaml
  text: Now the end is upon you[a], and I will send my anger against you. I will judge you according to your ways, and I will bring all your abominations upon you.
translation:
  language: zh_hans
  text: 现在，结局临到你了。我要使我的怒气临到你，按你的所行审判你，使你一切可憎之事的后果都临到你身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把你一切可憎之事都加在你身上”。这句话在审判语境中指使这些事所招致的后果临到你；也可译作“把你一切可憎之事都归到你身上”。
    reason: 保留希伯来语字面表达，并说明其在审判语境中的惯用含义。
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 保留时间副词突然而紧迫的宣告语气。
- source_word: הַקֵּץ
  choice: 结局
  rationale: 定冠词表明是特指的终局性结局；此处不加“末世”等技术性用语，以免超出上下文。
- source_word: עָלַיִךְ
  choice: 临到你
  rationale: 以自然汉语表达“在你之上、来到你身上”的审判意象；阴性单数所指对象由上下文确定。
- source_word: וְשִׁלַּחְתִּי אַפִּי בָּךְ
  choice: 我要向你发出我的怒气
  rationale: שׁלח取“发出”，אַף按惯用义译为“怒气”；“向你”自然表达敌对指向。
- source_word: וּשְׁפַטְתִּיךְ
  choice: 审判你
  rationale: 直接保留司法性的审判用语。
- source_word: כִּדְרָכָיִךְ
  choice: 按你的所行
  rationale: דֶּרֶךְ在先知性道德语境中指行为；“所行”既保留庄重文体，也比直译“道路”更清楚。
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבֹתָיִךְ
  choice: 使你一切可憎之事的后果都临到你身上
  rationale: 原文直译为“把你一切可憎之事放在你身上”，在审判语境中表示使这些行为所招致的后果归到当事者身上；正文明确惯用义，脚注保留字面表达。
- source_word: תּוֹעֲבֹתָיִךְ
  choice: 你一切可憎之事
  rationale: 表达强烈的道德和宗教厌恶，且不把所指范围擅自缩限为某一种罪行。
theological_decisions:
- issue: “结局”的性质
  choice: 按历史性先知审判的语境译作“结局”，不作进一步限定
  alternative: 译成带有后世技术含义的“末日”或绝对宇宙终局
  rationale: 以西结书第7章直接宣告临近的土地与耶路撒冷之审判；译文保留终局感，却不预先解决它是否另具更广末世含义的问题。
- issue: 可憎之事“临到身上”的含义
  choice: 正文表达行为后果临到当事者，脚注保留字面结构
  alternative: 正文只译作“把你一切可憎之事放在你身上”
  rationale: 该希伯来表达在审判语境中具有报应性，但字面措辞本身较凝缩；正文求清楚，脚注避免隐藏原文意象与可能的语义张力。
- issue: 神的怒气与审判
  choice: 直译为“怒气”和“审判”，不淡化其司法及情感力度
  alternative: 弱化为“不悦”或泛称“惩处”
  rationale: 原文明确并列神的怒气、审判及按行为施报，译文应保留其直接力度而不另加教义系统化说明。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“结局临到你”“向你发出我的怒气”保留原文的迫近感；“按你的所行”维持经文式庄重感而不显陈旧。脚注标记置于其实际所解释的末句之后。
