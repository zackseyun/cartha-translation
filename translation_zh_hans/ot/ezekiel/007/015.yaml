  text: הַ/חֶ֣רֶב בַּ/ח֔וּץ וְ/הַ/דֶּ֥בֶר וְ/הָ/רָעָ֖ב מִ/בָּ֑יִת אֲשֶׁ֤ר בַּ/שָּׂדֶה֙ בַּ/חֶ֣רֶב יָמ֔וּת וַ/אֲשֶׁ֣ר בָּ/עִ֔יר רָעָ֥ב וָ/דֶ֖בֶר יֹאכֲלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/015.yaml
  text: The sword is outside[a], and pestilence and famine are inside. Whoever is in the field will die by the sword, and whoever is in the city[b], famine and pestilence will consume him.
translation:
  language: zh_hans
  text: 外有刀剑，内有瘟疫和饥荒。田野里的人必死于刀剑；城里的人，饥荒和瘟疫必吞噬他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文动词直译为“吃”；这里把饥荒和瘟疫描写成吞吃人的力量。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶרֶב
  choice: 刀剑
  rationale: 保留希伯来文的具体意象；在先知审判语境中，也可转指战争造成的暴死。
- source_word: בַּחוּץ
  choice: 外
  rationale: 与 מִבָּיִת 所指的内部范围形成鲜明对照；“外有……内有……”在现代汉语中简洁自然。
- source_word: הַדֶּבֶר
  choice: 瘟疫
  rationale: דֶּבֶר 指流行性灾疫，是先知审判公式中的常用词；“瘟疫”准确且符合庄重语体。
- source_word: הָרָעָב
  choice: 饥荒
  rationale: 此处指社会性的粮食匮乏及饿死，而非个人一时的饥饿。
- source_word: מִבָּיִת
  choice: 内
  rationale: 该表达在此与“外”相对，表示内部、城内的领域；不强行补出“房屋”，以免把范围缩窄。
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: 田野里的人
  rationale: 表达分配性的单数概念，指任何身处田野或城外开阔地的人。
- source_word: בַּחֶרֶב יָמוּת
  choice: 必死于刀剑
  rationale: 贴近原文“因刀剑而死”，并保留其惯用意象，不额外明确施害者。
- source_word: וַאֲשֶׁר בָּעִיר
  choice: 城里的人
  rationale: 与“田野里的人”平行，清楚保留地点对照和泛指意义。
- source_word: רָעָב וָדֶבֶר
  choice: 饥荒和瘟疫
  rationale: 依照后半句的希伯来文词序，不与前半句“瘟疫和饥荒”的次序强行统一。
- source_word: יֹאכֲלֶנּוּ
  choice: 必吞噬他
  rationale: 原义为“吃掉他”；“吞噬”既保留拟人化隐喻及猛烈程度，又符合现代汉语表达。
- source_word: ־נּוּ
  choice: 他
  rationale: 原文为第三人称阳性单数后缀，与前面的分配性单数相呼应；汉语以“他”保留该语法数。
theological_decisions:
- issue: 审判三灾的意象
  choice: 保留“刀剑、瘟疫、饥荒”三个具体名词
  alternative: 概括译为战争、疾病和灾难
  rationale: 这是先知书中典型的审判组合；保留具体意象可维持其文学和神学张力，而不在正文中添加解释。
- issue: אָכַל 的拟人化隐喻
  choice: 译为“吞噬他”
  alternative: 解释性地译为“使他丧命”
  rationale: 原文让饥荒和瘟疫充当施事者，并使用“吃”的隐喻；“吞噬”保留这种拟人化力量。
- issue: 泛指单数
  choice: 用“……的人……他”保留单数指代
  alternative: 改为复数“人们……他们”
  rationale: 原文采用分配性单数和第三人称阳性单数后缀；保留单数可更准确反映其逐一临到的审判语气。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“外有……内有……”突出空间对照；分号呈现两类人的平行结局。正文保留“吞噬”的希伯来文隐喻，并以脚注说明其字面意义。
