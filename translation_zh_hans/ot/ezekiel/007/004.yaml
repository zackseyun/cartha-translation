  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹא תָח֥וֹס עֵינִ֛/י עָלַ֖יִ/ךְ וְ/לֹ֣א אֶחְמ֑וֹל כִּ֣י דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/004.yaml
  text: My eye will not spare you[a], nor will I have pity; for I will bring your ways upon you, and your abominations will be within you[b]. Then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: “我的眼必不顾惜你[a]，我也不怜悯你；因为我必使你的所行归到你身上，你那些可憎之事必在你中间[b]。这样，你们就知道我是雅威[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的眼必不顾惜你”是希伯来语惯用表达，意思是“不宽免你”或“不以怜悯看待你”。
    reason: 说明源语言习语并提供词义替代。
  - marker: b
    text: 或译：“你的可憎之事必在你里面。”
    reason: “在你中间”与“在你里面”均可表达原文简练的空间性措辞。
  - marker: c
    text: “雅威”是希伯来文上帝名字 יהוה 的音译；传统中文常译作“耶和华”。
    reason: 说明神名的音译及读者熟悉的传统译名。
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: 我的眼必不顾惜你
  rationale: 保留希伯来文以“眼”表达顾惜、怜恤的惯用意象，同时用现代汉语中可理解的“顾惜”传达不施怜恤、不予宽免之意。
- source_word: אֶחְמֹל
  choice: 我也不怜悯你
  rationale: 用“怜悯”与前面的“顾惜”相区别，保留两个近义动词形成的强调，而不将其合并。
- source_word: דְרָכַיִךְ
  choice: 你的所行
  rationale: 这里的“道路”指行为和生活方式。“所行”在中文先知性审判语境中自然庄重，也避免把实体道路误作字面含义。
- source_word: עָלַיִךְ אֶתֵּן
  choice: 我必使……归到你身上
  rationale: 保留原文“把／使……加在你身上”的报应性表达，不直接增译为“惩罚”，让人的所行归到自身这一司法意象保持可见。
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: 你那些可憎之事
  rationale: “可憎之事”保留 תועבות 在先知书中对严重冒犯、尤其偶像崇拜之罪的强烈否定色彩，同时比名词化的“可憎物”更符合现代汉语。
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: 必在你中间
  rationale: 贴近原文空间性的“在你里面／中间”，不擅自判定所指是罪行本身、其证据，还是其后果。
- source_word: וִידַעְתֶּם
  choice: 这样，你们就知道
  rationale: “这样……就”自然表达审判之后产生认识的结果关系；“你们”保留原文由前文阴性单数“你”转为复数的变化。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名所代表的上帝专名，而不以“主”这一称号替代。
theological_decisions:
- issue: 审判中的报应表达
  choice: 我必使你的所行归到你身上
  alternative: 我必因你的行为惩罚你
  rationale: 原文没有明说“惩罚”，而是以“将你的道路加在你身上”表达报应。译文保留这一意象及其神学张力，不作解释性扩写。
- issue: “可憎之事在你中间”的所指
  choice: 你那些可憎之事必在你中间
  alternative: 你可憎行为的后果必临到你
  rationale: 希伯来文措辞简练，并未明说是罪行、证据还是后果；采用空间性直译以保留这种含混。
- issue: 称呼对象的数变化
  choice: 前文用单数“你”，末句用复数“你们”
  alternative: 全句统一译作“你”或“你们”
  rationale: 原文先以阴性单数称呼城，随后转为复数听众。中文明确呈现这一变化，不把两者强行统一。
translation_notes:
  register: 采用现代、庄重而易懂的先知性审判语体。“顾惜／怜悯”保留原文近义复沓；“所行归到你身上”维持报应意象；单数“你”到复数“你们”的转换按原文呈现。
