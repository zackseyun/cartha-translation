id: EZK.7.2
reference: Ezekiel 7:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם כֹּה אָמַ֞ר אֲדֹנָ֧/י יְהוִ֛ה לְ/אַדְמַ֥ת יִשְׂרָאֵ֖ל קֵ֑ץ בָּ֣א הַ/קֵּ֔ץ עַל ארבעת כַּנְפ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/002.yaml
  text: 'And you[a], son of man, thus says the Lord GOD to the land of Israel: An end! The end has come upon the four corners of the land.'
translation:
  language: zh_hans
  text: “你，人子啊，主耶和华对以色列地如此说：‘结局！结局已经临到这地的四极[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地的四极”或译“全地的四极”。希伯来语这一说法既可指一片土地的四境，也可在较广的语境中指整个大地。
    reason: 保留 הָאָרֶץ 可指特定国土或全地的词义歧义。
lexical_decisions:
- source_word: וְאַתָּה בֶן־אָדָם
  choice: 你，人子啊
  rationale: 保留原文以“你”起首的强调，也沿用以西结书中上帝称呼先知的固定表达“人子”；“啊”自然体现直接呼语。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי（主）和上帝的专名 יהוה；“主耶和华”是现代中文圣经语境中清楚而庄重的表达。
- source_word: לְאַדְמַת יִשְׂרָאֵל
  choice: 对以色列地
  rationale: 介词 לְ 在这里标明神谕所针对、所述说的对象；译作“对”不额外强化为“攻击”。אַדְמָה 在本审判语境中指以色列的土地或国土。
- source_word: קֵץ
  choice: 结局！
  rationale: 原文是突兀的单独名词，具有宣告和惊叹的力量；“结局”能表达审判所带来的终结，并与下一句的重复相呼应。
- source_word: בָּא הַקֵּץ
  choice: 结局已经临到
  rationale: 完成式 בָּא 在先知性宣告中表达已经来到或确定迫近；“已经临到”兼顾完成意味和审判降临的语气。
- source_word: אַרְבַּעַת כַּנְפוֹת הָאָרֶץ
  choice: 这地的四极
  rationale: כָּנָף 本义为“翅膀”，在此习语中指边缘或极处；“四极”保留“四”的意象，又比“四个角落”更适合国土范围。结合前句“以色列地”，הָאָרֶץ 首先理解为“这地”，但以脚注保留“全地”的可能。
theological_decisions:
- issue: 如何翻译神名 יהוה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名；“耶和华”在现代中文普通读者中辨识度最高，并在复合称号 אֲדֹנָי יְהוִה 中自然构成“主耶和华”。此选择不把专名泛化为普通称谓。
- issue: 末句 הָאָרֶץ 的范围
  choice: 这地，即以色列全境
  alternative: 全地或全世界
  rationale: 紧接“以色列地”的语境使局部范围最自然，宣告审判遍及其四境；不过 אֶרֶץ 本身也可指全地或大地，因此以脚注保留较广的理解。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“结局！结局已经……”保留原文突兀的重复和先知宣告的力度；“四极”略带书面色彩，但意义清楚，并保留希伯来语的空间意象。
