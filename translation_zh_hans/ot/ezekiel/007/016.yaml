base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/016.yaml
  text: And their survivors will escape and be on the mountains[a], like doves of the valleys, all of them moaning[c][b], each one in his iniquity.
translation:
  language: zh_hans
  text: 他们中逃脱的人必逃脱，必在山上，像山谷中的鸽子；他们全都哀鸣，各人都为自己的罪孽哀鸣。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפָלְטוּ
  choice: 必逃出去
  rationale: פלט表示从危险中逃脱；用“必逃出去”体现先知预告的将来事件，又不额外限定逃亡方式。
- source_word: פְּלִיטֵיהֶם
  choice: 他们中逃脱的人
  rationale: 该名词指已经逃脱、幸存下来的人；这一译法比单用“幸存者”更直接呼应前面的“逃出去”，也不突出“逃犯”意味。
- source_word: וְהָיוּ אֶל־הֶהָרִים
  choice: 留在山上
  rationale: 原文直译近似“他们必在／到山那里”；上下文重在逃脱后身处山中。“留在山上”是自然汉语，并避免把并未明说的移动过程写得过实。
- source_word: כְּיוֹנֵי הַגֵּאָיוֹת
  choice: 如同谷地的鸽子
  rationale: גֵּאָיוֹת可指谷地，也可指沟谷、峡谷；正文采用通俗的“谷地”，脚注保留地形上的另一可能。比喻同时让人联想到鸽子的低鸣与逃入幽僻之地的脆弱景象。
- source_word: כֻּלָּם הֹמוֹת
  choice: 他们全都哀鸣
  rationale: המה表示发出低沉、嘈杂或悲切的声音；审判语境支持“哀鸣”，同时仍与鸽子的低鸣相呼应。
- source_word: אִישׁ
  choice: 各人
  rationale: 这里是分配用法，逐一指逃脱者；“各人”自然简洁，不把所指限定为男性。
- source_word: בַּעֲוֺנוֹ
  choice: 为自己的罪孽
  rationale: עָוֹן可涵盖罪孽、罪责以及罪所招致的刑罚。“为自己的罪孽”在现代汉语中保留一定宽度，脚注进一步说明其他可能。
theological_decisions:
- issue: 审判语境中 עָוֹן 的含义
  choice: 正文译作“为自己的罪孽”，保留罪行与罪责的关联
  alternative: “因自己的罪责”或“为自己所受的刑罚”
  rationale: 该词既可指人的罪，也可指由罪产生的罪责，甚至指罪的刑罚后果；不将经文单一限定为懊悔罪行或哀叹刑罚。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。用“逃脱的人”准确表达幸存者身份；“哀鸣”兼顾审判中的悲痛和鸽子低鸣的意象。末句适度保留重复，以再现原文“全都……各人……”的整体与逐一对应结构。
