base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/022.yaml
  text: I will turn my face away from them[a], and they will profane my treasured place[b]; violent men will enter it and profane it.
translation:
  language: zh_hans
  text: 我要转脸不看他们；他们必亵渎我珍藏之处[a]。凶暴之徒[b]必闯入其中，亵渎它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的珍宝”、“我的隐密处”或“我所珍藏之物”。希伯来语可能指某个珍贵而受保护的对象，很可能与圣所有关。
    reason: lexical_alternative
  - marker: b
    text: 或译“凶残的人”或“强盗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִבּוֹתִי
  choice: 我要转
  rationale: 使役词形在本段先知性审判宣告中具有将来指向；与“脸”连用，译作“转脸”既贴近原文，也符合现代汉语表达。
- source_word: פָנַי מֵהֶם
  choice: 转脸不看他们
  rationale: 原文直译为“使我的脸离开他们”，表示撤回眷顾和关注；“转脸不看”保留“脸”的意象并自然传达离弃之意。
- source_word: וְחִלְּלוּ
  choice: 他们必亵渎
  rationale: חלל 的加强词干表示使圣物失去其神圣地位；“亵渎”准确保留圣与俗之间的张力。
- source_word: צְפוּנִי
  choice: 我珍藏之处
  rationale: 该词可指隐藏、收藏或珍视之物；上下文涉及侵入和亵渎，很可能与圣所有关，但原文并未明确指出具体对象，因此采用既有空间意味又不过度限定的译法。
- source_word: וּבָאוּ בָהּ
  choice: 必闯入其中
  rationale: 介词结构表示进入一个阴性单数所指对象；结合 פָּרִיצִים 的暴力性质，“闯入”比中性的“进入”更能体现敌对侵入。
- source_word: פָּרִיצִים
  choice: 强暴之徒
  rationale: 该词指凶暴、残忍或无法无天的人；“强暴之徒”保留其暴力和不法色彩，又不将含义缩窄为单纯的盗贼。
- source_word: וְחִלְּלוּהָ
  choice: 亵渎它
  rationale: 重复前面的 חלל，以“亵渎”复现原文的措辞和强调；“它”保留所指对象的概括性。
theological_decisions:
- issue: צְפוּנִי 及后续阴性代词所指为何
  choice: 译为“我珍藏之处”，理解为与圣所有关的珍贵、受保护之处，同时不指明究竟是圣殿、内殿还是其中的珍宝。
  alternative: 可译为“我的珍宝”“我的隐密处”或“我所珍藏之物”。
  rationale: 原文表达简短且含义不完全确定；侵入与亵渎的语境倾向于圣所相关对象，但不足以排除珍宝、隐密处或珍藏之物等理解，故正文保持适度开放，并以脚注列出主要可能。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“转脸不看”保留希伯来语的身体意象；两次“亵渎”刻意复现原文重复。“珍藏之处”不明确增添“圣殿”或“圣所”，以保存原文所指的真实歧义。
