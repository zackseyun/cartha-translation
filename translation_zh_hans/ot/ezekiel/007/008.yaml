  text: עַתָּ֣ה מִ/קָּר֗וֹב אֶשְׁפּ֤וֹךְ חֲמָתִ/י֙ עָלַ֔יִ/ךְ וְ/כִלֵּיתִ֤י אַפִּ/י֙ בָּ֔/ךְ וּ/שְׁפַטְתִּ֖י/ךְ כִּ/דְרָכָ֑יִ/ךְ וְ/נָתַתִּ֣י עָלַ֔יִ/ךְ אֵ֖ת כָּל תּוֹעֲבוֹתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/008.yaml
  text: Now[a], soon I will pour out my wrath on you, and I will spend my anger against you; I will judge you according to your ways[b], and I will bring all your abominations upon you.
translation:
  language: zh_hans
  text: 现在，不久[a]，我要把我的烈怒倾倒在你身上，在你身上发尽我的怒气[b]；我要照你的所作所为审判你，使你一切可憎之事的报应临到你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“很快”或“不久之后”；这里的希伯来语表达审判即将来到。
    reason: lexical_alternative
  - marker: b
    text: “发尽我的怒气”是指使我的怒气在你身上完全施行，直到其过程结束。
    reason: idiom_clarification
lexical_decisions:
- source_word: עַתָּה מִקָּרוֹב
  choice: 现在，不久
  rationale: עַתָּה表示“现在”，מִקָּרוֹב在此表示时间上的临近。二者并列，传达审判已经迫近；不额外加入“很”等强化成分。
- source_word: אֶשְׁפּוֹךְ חֲמָתִי עָלַיִךְ
  choice: 我要把我的烈怒倾倒在你身上
  rationale: 保留שׁפך“倾倒”的鲜明比喻；“烈怒”表达חֵמָה的强烈程度，并与下句的אַף有所区别。
- source_word: וְכִלֵּיתִי אַפִּי בָּךְ
  choice: 在你身上发尽我的怒气
  rationale: כלה与אַף连用，表示怒气完全施行、走到尽头；“发尽”既保留完成之意，也符合现代汉语表达。
- source_word: וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ
  choice: 我要照你的所作所为审判你
  rationale: שׁפט保留司法性的“审判”；דֶּרֶךְ字面为“道路”，此处喻指行为和生活方式，译作“所作所为”更自然清楚。
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבוֹתָיִךְ
  choice: 使你一切可憎之事的报应临到你
  rationale: נתן על在审判语境中表示使某事落到人身上；原文没有独立对应“报应”的名词，但这里不是说把恶行本身重新放在人身上，而是使其后果临到他。“可憎之事”保留תּוֹעֵבוֹת强烈的道德与宗教意味。
theological_decisions:
- issue: 如何区分חֲמָה与אַף两个表示神愤怒的词
  choice: 分别译作“烈怒”和“怒气”
  alternative: 两处都译作“愤怒”或“烈怒”
  rationale: 原文使用两个相关却不同的词形成平行和递进。采用两个自然的汉语词可保留修辞变化，但不把它们解释成两种截然不同的神学概念。
- issue: 末句是否明确加入“报应”
  choice: 译为“使你一切可憎之事的报应临到你”
  alternative: 较直译为“把你一切可憎之事加在你身上”
  rationale: 上下文是按行为施行审判，נתן על表达使恶行的后果归到行为者身上。“报应”使现代读者明白这一语义关系，同时不把审判缩减为机械因果。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“倾倒”这一先知性比喻，以“所作所为”自然表达希伯来语“道路”的行为含义；句中的两个愤怒用语有意作出轻微区分。
