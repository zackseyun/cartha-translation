  yaml_path: translation/ot/ezekiel/007/017.yaml
  text: All hands will grow weak[a], and all knees will run with water.
translation:
  language: zh_hans
  text: 人人的手都必发软，人人的膝盖都必淌水。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“所有膝盖都必流出水”。这很可能是形容人因惊恐而双膝瘫软，也可能包括失去身体控制。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיָּדַיִם
  choice: 人人的手
  rationale: כָּל修饰复数身体部位，在此指所涉及的众人；译作“人人的手”比“所有的手”更符合现代汉语，同时保留“手”这一力量衰退的身体意象。
- source_word: תִּרְפֶּינָה
  choice: 都必发软
  rationale: רפה表示松弛、软弱；“发软”自然传达因惊恐而失去力量的状态，也与“手”搭配顺畅。
- source_word: וְכָל בִּרְכַּיִם
  choice: 人人的膝盖
  rationale: 直译身体部位“膝盖”，并保留其与恐惧、站立不稳相关的意象。
- source_word: תֵּלַכְנָה מָּיִם
  choice: 都必淌水
  rationale: 原文直陈膝盖“走/流出水”；“淌水”在汉语中保留液体沿下而流的鲜明图像，不在正文中把可能的生理含义明确化。
theological_decisions:
- issue: “膝盖淌水”所指的具体恐惧反应
  choice: 正文保留“膝盖都必淌水”的含混图像，并用脚注说明
  alternative: 直接译成“吓得大小便失禁”或“膝盖发软”
  rationale: 希伯来文明确使用“水”，但其表达可能指恐惧中膝盖瘫软，也可能包含失去身体控制；直译并加注可避免消除原文的真实含混性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人人……人人……”再现原文两次כָּל的全面性；“必”表达预告的确定性。正文保留“膝盖淌水”的陌生而强烈的希伯来意象，并以脚注交代其可能含义。
