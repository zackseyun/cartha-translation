id: EZK.7.14
reference: Ezekiel 7:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תָּקְע֤וּ בַ/תָּק֨וֹעַ֙ וְ/הָכִ֣ין הַ/כֹּ֔ל וְ/אֵ֥ין הֹלֵ֖ךְ לַ/מִּלְחָמָ֑ה כִּ֥י חֲרוֹנִ֖/י אֶל כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/014.yaml
  text: They have blown the trumpet and made everything ready[a], but no one goes to battle[b], for my wrath is against all her multitude.
translation:
  language: zh_hans
  text: 他们吹响号角[a]，预备好一切，却无人出战，因为我的烈怒临到她所有的民众[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“角”或“羊角号”。
    reason: lexical_alternative
  - marker: b
    text: “民众”或译“财富”或“丰盛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקְעוּ בַתָּקוֹעַ
  choice: 吹响号角
  rationale: תקע与表示吹奏器具的名词连用，指吹响、发出号声；“吹响号角”自然地呈现军事召集的场景，并保留第三人称复数主语。
- source_word: וְהָכִין הַכֹּל
  choice: 预备好一切
  rationale: כון的使役形表示预备、使就绪；“预备好一切”既保留הַכֹּל的全面范围，也符合现代汉语表达。
- source_word: וְאֵין הֹלֵךְ לַמִּלְחָמָה
  choice: 却无人出战
  rationale: אין加分词表示没有人采取行动；“出战”简洁自然地表达前往战场或投入战斗，转折词“却”凸显准备完成与无人响应之间的反差。
- source_word: חֲרוֹנִי
  choice: 我的烈怒
  rationale: חָרוֹן指炽烈的怒气；“烈怒”保留其强度和庄重语体，也明确保留第一人称所属关系。
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: 临到她所有的民众
  rationale: 在烈怒的语境中，אֶל表示怒气所针对、所临及的对象；הָמוֹן此处最可能指众多人口，译作“民众”符合审判与战争语境，同时用“她”保留阴性单数后缀，而不擅自指定其所指。
theological_decisions:
- issue: הֲמוֹנָהּ中阴性单数后缀的所指
  choice: 译作“她所有的民众”，不在正文中指明“她”是城还是地
  alternative: 那城的民众；那地的民众；她所有的财富或丰盛
  rationale: 希伯来文明确使用阴性单数后缀，却未在本节明说先行词；保留“她”可避免把耶路撒冷、城或地中的某一解释写入正文。
- issue: הָמוֹן在本节的语义
  choice: 民众
  alternative: 财富；丰盛
  rationale: 该词既可指众人，也可指财富或丰盛；军事召集和全民受审判的上下文较支持“民众”，但物质丰盛之义仍属真实的词义可能，故列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“预备好一切，却无人出战”保持原文简短有力的反差；“她”虽在汉语中稍显突兀，但有意保存希伯来文阴性后缀所指不明的特点。
