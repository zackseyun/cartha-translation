  text: בָּ֧אָה הַ/צְּפִירָ֛ה אֵלֶ֖י/ךָ יוֹשֵׁ֣ב הָ/אָ֑רֶץ בָּ֣א הָ/עֵ֗ת קָר֛וֹב הַ/יּ֥וֹם מְהוּמָ֖ה וְ/לֹא הֵ֥ד הָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/007.yaml
  text: Doom has come upon you[a], inhabitant of the land. The time has come; the day is near—panic[b], and not joyful shouting on the mountains.
translation:
  language: zh_hans
  text: 结局已经临到你了[a]，这地的居民啊！时候到了，日子近了——是慌乱[b]，不是山上的欢呼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“轮到你了”，或“你的定局已经临到”。这里的希伯来词罕见，含义难定。
    reason: lexical_alternative
  - marker: b
    text: 或译“是喧乱，不是山间的回声”。末句含义困难；许多人认为，这是把审判所带来的慌乱与山间平常的欢乐呼声相对比，后者可能指收割时的欢呼。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִירָה
  choice: 结局
  rationale: 此词罕见且含义难定。在宣告审判、反复强调“临到”和“时候到了”的语境中，较可能指决定性的转折或末局；“结局”既符合上下文，也避免把含义过度限定为抽象的“厄运”。
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: 这地的居民啊
  rationale: 将单数分词理解为集合性的直接称呼；הָאָרֶץ 在本段首先指受审判之地，译作“这地”比泛指“全地/大地”更贴合语境。
- source_word: הָעֵת
  choice: 时候
  rationale: 直译其时间含义，不额外加入原文未明确表达的“指定”观念。
- source_word: קָרוֹב הַיּוֹם
  choice: 日子近了
  rationale: 自然地保留原文关于审判之日迫近的宣告。
- source_word: מְהוּמָה
  choice: 慌乱
  rationale: 该词在审判语境中可表示混乱、骚动和恐慌；“慌乱”兼顾外在失序与内在惊惧。
- source_word: הֵד
  choice: 欢呼
  rationale: 该词通常可指回声或呼喊，但末句意义困难。正文按语境中的对比理解为山间常有的欢乐呼声，同时在脚注保留“回声”的较字面译法。
- source_word: הָרִים
  choice: 山上
  rationale: 按复数名词译出地点含义；现代汉语中“山上”比“诸山之上”自然。
theological_decisions: []
