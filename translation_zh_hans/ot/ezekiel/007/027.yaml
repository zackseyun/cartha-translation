reference: Ezekiel 7:27
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/מֶּ֣לֶךְ יִתְאַבָּ֗ל וְ/נָשִׂיא֙ יִלְבַּ֣שׁ שְׁמָמָ֔ה וִ/ידֵ֥י עַם הָ/אָ֖רֶץ תִּבָּהַ֑לְנָה מִ/דַּרְכָּ֞/ם אֶעֱשֶׂ֤ה אוֹתָ/ם֙ וּ/בְ/מִשְׁפְּטֵי/הֶ֣ם אֶשְׁפְּטֵ֔/ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/027.yaml
  text: The king will mourn[a], and the prince will clothe himself with desolation, and the hands of the people of the land will tremble. According to their way I will deal with them, and by their own judgments I will judge them[c][b]. Then they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 君王必哀哭，首领必以荒凉为衣[a]，这地百姓的手必因惊恐而发颤[b]。我必照他们的行为待他们，按他们的判决审判他们[c]。这样，他们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以荒凉为衣”也可译作“披上惊骇”或“被荒凉笼罩”。原文以穿衣作比喻，所用名词可表示荒凉，也可表示骇然或令人惊骇的毁灭。
    reason: lexical_alternative
  - marker: b
    text: “这地百姓”是希伯来语表达，可指当地民众或一般百姓；“手”在这里也可着重表示他们的力量或行动能力。
    reason: idiom_clarification
  - marker: c
    text: “按他们的判决”也可理解为“按他们所定的标准”或“按他们的司法做法”。原文保留了审判如何与他们自己的判决相对应的歧义。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ יִתְאַבָּל
  choice: 君王必哀哭
  rationale: הַמֶּלֶךְ是通常的王权称谓；יִתְאַבָּל表示哀悼、哀哭。译文简洁保留国家灾难中统治者举哀的含义。
- source_word: וְנָשִׂיא
  choice: 首领
  rationale: נָשִׂיא可指首领、领袖或王公。此处与“君王”并列，译作“首领”既保留官长身份，也避免现代汉语“王子”所暗示的血缘含义。
- source_word: יִלְבַּשׁ שְׁמָמָה
  choice: 必以荒凉为衣
  rationale: 原文直用“穿上”与שְׁמָמָה构成衣着隐喻；后者可指荒凉、骇然或令人惊骇的毁灭。译文保留鲜明隐喻及主要词义。
- source_word: וִידֵי עַם הָאָרֶץ תִּבָּהַלְנָה
  choice: 这地百姓的手必因惊恐而发颤
  rationale: “手”象征行动能力或力量，而בהל表达惊惶、恐慌。译作“因惊恐而发颤”使汉语自然，同时保留身体意象。עַם הָאָרֶץ在此指本地民众或一般百姓。
- source_word: מִדַּרְכָּם אֶעֱשֶׂה אוֹתָם
  choice: 我必照他们的行为待他们
  rationale: דֶּרֶךְ字面为“道路”，在此指生活方式或行为；“照他们的行为”清楚表达相称报应，且不额外解释其性质。
- source_word: וּבְמִשְׁפְּטֵיהֶם אֶשְׁפְּטֵם
  choice: 按他们的判决审判他们
  rationale: מִשְׁפָּט可指判决、司法惯例、法则或审判。保留“他们的判决”与“审判”的同根呼应，并以脚注保存语义歧义。
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: 这样，他们就知道我是雅威
  rationale: 这是《以西结书》反复出现的认识公式。上下文呈现审判带来的结果，故用“这样……就”；专名יְהוָה音译为“雅威”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。音译“雅威”保留其作为专名的性质，不以称号取代，也不对读音争议作过度断言。
- issue: 认识公式中连接词וְ的语义力度
  choice: 这样，他们就知道
  alternative: 他们必知道；于是他们就知道
  rationale: 此处可理解为简单承接，也可在审判语境中表达结果。译文采用自然的结果性表达，但不把它扩展为关于悔改或得救的陈述。
- issue: 以“他们的判决”审判他们的含义
  choice: 保留原文司法措辞及歧义
  alternative: 按他们所定的标准审判他们；照他们应得的刑罚审判他们
  rationale: 希伯来文可指按他们自己的判决、司法做法或相应标准受审。正文不替原文确定唯一机制，脚注列出主要可能性。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“君王—首领—百姓”保留原文社会层次；“以荒凉为衣”刻意保存诗性隐喻；后半节用整齐的“照……待……，按……审判……”呈现相称审判的修辞。所有脚注标记均置于相关正文之后。
