  text: וּ/נְתַתִּ֤י/ו בְּ/יַֽד הַ/זָּרִים֙ לָ/בַ֔ז וּ/לְ/רִשְׁעֵ֥י הָ/אָ֖רֶץ לְ/שָׁלָ֑ל ו/חלל/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/021.yaml
  text: And I will give it into the hand of foreigners for plunder[a], and to the wicked of the earth for spoil[b], and they will profane it.
translation:
  language: zh_hans
  text: 我要把它交在外族人手中，供他们掠夺；又交给地上的恶人，作他们的战利品；他们必亵渎它[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“玷污它”。这个动词含有把神圣之物当作凡俗、加以亵渎的意思。
    reason: 说明חלל的词义范围及其圣洁语境。
lexical_decisions:
- source_word: וּנְתַתִּיו
  choice: 我要把它交在
  rationale: 该形式由נתן的第一人称单数形式和第三人称阳性单数宾语后缀构成，在先知宣告中表达将要发生的行动。“把它交在”自然传达转交控制权之意，并保留代词“它”，承接上文所指之物。
- source_word: בְּיַד
  choice: 手中
  rationale: 保留希伯来语“在……手中”的常见控制权隐喻；现代汉语“交在……手中”自然且明确。
- source_word: הַזָּרִים
  choice: 外族人
  rationale: 此处指群体之外的外国入侵者，不只是彼此陌生的人。“外族人”符合侵掠语境，也避免“陌生人”的弱化。
- source_word: לָבַז
  choice: 作掠物
  rationale: בַּז指以武力夺取的掠物。译作“作掠物”既体现ל所表达的结果，也与下句形成平行。
- source_word: וּלְרִשְׁעֵי הָאָרֶץ
  choice: 交给地上的恶人
  rationale: רִשְׁעֵי是“恶人”；הָאָרֶץ可指“大地”或特定的“土地、本地”。正文采用较宽泛的“地上”，同时以脚注保留“本地”的可能。
- source_word: לְשָׁלָל
  choice: 作战利品
  rationale: שָׁלָל与בַּז近义，指被夺取的财物。“战利品”保留侵略战争的语境，并以不同措辞维持原文的同义平行。
- source_word: וְחִלְּלוּהָ
  choice: 他们必亵渎它
  rationale: חלל的Piel词干表示把神圣之物当作凡俗、加以亵渎。译文明确复数主语“他们”，并以“亵渎”保留以西结书中圣与俗的神学张力。
theological_decisions:
- issue: 圣洁语境中חלל的译法
  choice: 亵渎
  alternative: 玷污；污辱
  rationale: “亵渎”最能表达把神圣之物当作凡俗、侵犯其圣洁的含义；“玷污”可能偏重礼仪或洁净状态，“污辱”则可能偏重名誉层面。脚注保留可行替代译法。
- issue: הָאָרֶץ的范围
  choice: 地上
  alternative: 本地
  rationale: 该词可指大地，也可指特定土地。正文用“地上”避免无根据地限定地域，脚注则保留上下文可能支持的“本地”。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“交在……手中”保留原文意象；“掠物／战利品”维持两个近义名词的平行变化；分号呈现前两项交付与末句亵渎结果之间的结构。
