  text: וּ/צְבִ֤י עֶדְי/וֹ֙ לְ/גָא֣וֹן שָׂמָ֔/הוּ וְ/צַלְמֵ֧י תוֹעֲבֹתָ֛/ם שִׁקּוּצֵי/הֶ֖ם עָ֣שׂוּ ב֑/וֹ עַל כֵּ֛ן נְתַתִּ֥י/ו לָ/הֶ֖ם לְ/נִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/020.yaml
  text: And they made the beauty of his ornament into pride[a], and in it they made the images of their abominations, their detestable things[b]; therefore I have made it an unclean thing to them.
translation:
  language: zh_hans
  text: 他们把他华美的妆饰变成了骄傲，又用它造了他们可憎之物的像，就是他们那些可厌之物[a]；因此，我使这妆饰成了他们的不洁之物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “用它造了”也可译作“在其上造了”或“在其中造了”；希伯来语可表示材料或工具，也可表示地点。
    reason: lexical_alternative
  - marker: b
    text: “不洁之物”所译的希伯来词与礼仪性不洁有关；也可译作“被弃绝之物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבִי עֶדְיוֹ
  choice: 他华美的妆饰
  rationale: צְבִי在此表示“华美、荣美”，עֶדְיוֹ表示“他的妆饰”。此译保留单数和第三人称指称，不将所指过早限定为珠宝、财富或圣殿器物。
- source_word: לְגָאוֹן שָׂמָהוּ
  choice: 把……变成了骄傲
  rationale: גָּאוֹן可指威荣或骄傲；在偶像崇拜受审判的语境中，负面的“骄傲”更合适。שׂים与ל连用在此具有结果意味，故译作“变成”。
- source_word: וְצַלְמֵי תוֹעֲבֹתָם
  choice: 他们可憎之物的像
  rationale: 保留צֶלֶם“像”和תּוֹעֵבָה“可憎之物”的结构关系，也不直接把所有对象解释为某一特定种类的偶像。
- source_word: שִׁקּוּצֵיהֶם
  choice: 他们那些可厌之物
  rationale: שִׁקּוּץ常指令人厌恶之物，尤其可指偶像；译作“可厌之物”既与前面的“可憎之物”保持词汇区别，也保留其偶像崇拜语境。
- source_word: עָשׂוּ בוֹ
  choice: 在其中造了
  rationale: 介词ב可表示地点，也可表示材料或工具。正文采用较贴近字面的“在其中”，并以脚注保留“用它造”的可能。
- source_word: נְתַתִּיו לָהֶם לְנִדָּה
  choice: 我使这妆饰对他们成为不洁之物
  rationale: נָתַן在此与结果补语连用，可表达“使之成为”。明确补出“这妆饰”，避免连续代词在中文中指向不清。נִדָּה保留礼仪性污秽及被弃绝的语义背景。
theological_decisions:
- issue: לְנִדָּה所表达的污秽性质
  choice: 不洁之物
  alternative: 被弃绝之物；污秽
  rationale: “不洁之物”保留该词与礼仪性不洁的联系，也适合本节谴责偶像崇拜的道德—礼仪语境；同时不在正文中过度凸显其与经期不洁有关的词源背景。
- issue: עָשׂוּ בוֹ中ב的语义
  choice: 在其中造了
  alternative: 用它造了
  rationale: 希伯来语可指在该妆饰之中制作，也可指以该妆饰为材料或工具制作。正文不消除这种张力，另一可能见脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“妆饰”比“装饰品”更凝练，也能保留原文单数集合性所指；末句补出“这妆饰”以确保中文指代清楚。所有解释性替代均置于脚注，不在正文中将其具体化为珠宝、圣殿或某类偶像。
