  yaml_path: translation/ot/ezekiel/007/006.yaml
  text: An end has come; the end has come. It has awakened against you; look, it is coming.
translation:
  language: zh_hans
  text: 结局到了，结局到了！它已经苏醒，向你而来。看，它来了！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵץ / הַקֵּץ
  choice: 结局
  rationale: קֵץ在本段指迫近的终结或末局；“结局”既保留其终结意味，也能自然承接原文将其人格化的表达。
- source_word: הֵקִיץ
  choice: 已经苏醒
  rationale: 按其使役词干在此处的语境义译为“苏醒、醒起”，保留与קֵץ之间的音韵呼应所伴随的突兀人格化，不改写成较解释性的“灾祸爆发”。
- source_word: אֵלָיִךְ
  choice: 向你而来
  rationale: 介词短语本义为“向着你／临到你”；结合“苏醒”译成自然的汉语方向表达，同时不把敌对意味强化为原文未明说的“攻击你”。
- source_word: הִנֵּה
  choice: 看
  rationale: 用简洁而现代的提示语传达 הִנֵּה 的警示和引人注意功能。
theological_decisions:
- issue: “结局”的人格化及其行动方向
  choice: 保留“它已经苏醒，向你而来”
  alternative: 解释为“灾祸已经发动，要攻击你”
  rationale: 原文直接把“结局”写成苏醒并趋向受话者，具有诗性和审判宣告的张力；不宜用解释性措辞将其限定为某一种具体灾祸或行动。
translation_notes:
  register: 采用简洁、庄重而可懂的现代标准汉语；保留原文密集重复、短句节奏和警告语气。受话者在希伯来文中为阴性单数，但本节单独无法在自然汉语中显明其所指，故不额外补入“以色列地”等解释。
