id: EZK.7.24
reference: Ezekiel 7:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הֵֽבֵאתִי֙ רָעֵ֣י גוֹיִ֔ם וְ/יָרְשׁ֖וּ אֶת בָּֽתֵּי/הֶ֑ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן עַזִּ֔ים וְ/נִחֲל֖וּ מְקַֽדְשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/024.yaml
  text: And I will bring the worst of the nations[a], and they will take possession of their houses. I will put an end to the pride of the strong[c][b], and their sanctuaries will be profaned.
translation:
  language: zh_hans
  text: 我必使列国中最凶恶的人前来[a]，他们必占有他们的房屋[b]。我必使强者的骄傲止息[c]；他们的圣所必遭亵渎[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“列国中最邪恶的人。”
    reason: lexical_alternative
  - marker: b
    text: “占有”所译的希伯来语也可表示“承受”或“夺取”。原文作“他们的房屋”；按上下文，通常指受审判之民的房屋。
    reason: lexical_alternative
  - marker: c
    text: “强者的骄傲”也可译作“强者的威荣”或“强者的尊荣”。
    reason: lexical_alternative
  - marker: d
    text: 或译：“他们的圣地必被玷污。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: 我必使……前来
  rationale: 希伯来语 בוא 的使役形由第一人称作主语，表示“我必使……来／带来”。汉语用“使……前来”自然表达使役意义，也符合敌军受召而来的语境。
- source_word: רָעֵי גוֹיִם
  choice: 列国中最凶恶的人
  rationale: רָעֵי 是 רע 的复数附属形式，在这里可带最高级意味，指列国中最恶劣、最凶恶的一群人。“最凶恶的人”兼顾其道德邪恶和侵略者的可怖性质。
- source_word: וְיָרְשׁוּ אֶת בָּתֵּיהֶם
  choice: 他们必占有以色列人的房屋
  rationale: ירשׁ 可表示承受、占有或夺取产业；征服语境下“占有”不暗示合法继承，又保留了该词比“抢走”更宽的语义。“他们的房屋”在中文里指代可能含混，因此按上下文明确为“以色列人的房屋”。
- source_word: וְהִשְׁבַּתִּי
  choice: 我必止息
  rationale: שׁבת 的使役形意为使某事停止。“止息”简洁、庄重，并保留使役结果。
- source_word: גְּאוֹן עַזִּים
  choice: 强者的骄傲
  rationale: גְּאוֹן 可指骄傲、威荣或高昂；在审判语境中，“骄傲”较切合贬抑色彩。עַזִּים 可指强者、有势力者，也可能含凶猛、强暴之意，正文采用较宽的“强者”。
- source_word: וְנִחֲלוּ
  choice: 必遭亵渎
  rationale: 此处为 חלל 的被动形，表示被俗化、亵渎或玷污。与圣所搭配时，“遭亵渎”最能体现礼仪和神圣领域受到侵犯。
- source_word: מְקַדְשֵׁיהֶם
  choice: 他们的圣所
  rationale: מִקְדָּשׁ 的复数可指圣所或圣地。“圣所”保留敬拜场所的礼仪含义，不擅自限定具体建筑。
theological_decisions:
- issue: גְּאוֹן 在审判宣告中的含义
  choice: 骄傲
  alternative: 威荣；尊荣
  rationale: 上下文强调上帝使有势力者降卑，因此正文采用带负面意味的“骄傲”；脚注保留该词也可指威荣或尊荣的可能。
- issue: עַזִּים 所指的人
  choice: 强者
  alternative: 强暴者；凶猛的人
  rationale: 该词首先表达强劲、有力，语境中也可能隐含凶暴。采用“强者”避免在正文中过度限定其道德性质，同时以脚注呈现另一可能。
- issue: נִחֲלוּ מְקַדְשֵׁיהֶם 的礼仪含义
  choice: 他们的圣所必遭亵渎
  alternative: 他们的圣地必被玷污
  rationale: 被动动词和圣所搭配，重点在神圣性质遭破坏。“亵渎”准确传达此礼仪性审判，但不具体推断亵渎的方式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“我必……他们必……”保留先知审判宣告的节奏。正文对房屋所属者作最低限度的指代澄清，其余词义张力则通过脚注保留。
