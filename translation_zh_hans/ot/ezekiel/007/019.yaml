reference: Ezekiel 7:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כַּסְפָּ֞/ם בַּ/חוּצ֣וֹת יַשְׁלִ֗יכוּ וּ/זְהָבָ/ם֮ לְ/נִדָּ֣ה יִֽהְיֶה֒ כַּסְפָּ֨/ם וּ/זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה נַפְשָׁ/ם֙ לֹ֣א יְשַׂבֵּ֔עוּ וּ/מֵעֵי/הֶ֖ם לֹ֣א יְמַלֵּ֑אוּ כִּֽי מִכְשׁ֥וֹל עֲוֺנָ֖/ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/019.yaml
  text: They will throw their silver into the streets[a], and their gold will become an unclean thing. Their silver and their gold will not be able to deliver them in the day of Yahweh’s wrath. They will not satisfy their appetite, nor fill their stomachs, for it has become the stumbling block of their iniquity.
translation:
  language: zh_hans
  text: 他们要把银子扔在街上；他们的金子必成为污秽之物[a]。他们的金银不能在雅威震怒的日子搭救他们，不能使他们的食欲满足，也不能填满他们的肚腹，因为它成了他们罪孽的绊脚石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “必成为污秽之物”直译可作“将归于不洁”或“将成为不洁之物”；原词常用于经期所造成的礼仪不洁，因此也带有令人避弃、厌恶的意味。
    reason: 保留 נִדָּה 的具体礼仪语义及其比喻力度。
lexical_decisions:
- source_word: כַּסְפָּם
  choice: 他们的银子
  rationale: כֶּסֶף既可指银这种贵金属，也可指钱财；这里与“金子”平行，采用具体的“银子”更能保留原文意象。
- source_word: בַּחוּצוֹת יַשְׁלִיכוּ
  choice: 扔在街上
  rationale: חוּצוֹת可指城中的街道或公共空地，יַשְׁלִיכוּ表示抛扔；“扔在街上”自然地传达公开弃置财物的动作。
- source_word: לְנִדָּה יִהְיֶה
  choice: 必成为污秽之物
  rationale: נִדָּה可专指经期所带来的礼仪不洁，也可泛指令人厌弃的不洁之物；正文采用较宽泛的表达，并以脚注保留其具体语义色彩。
- source_word: לֹא יוּכַל לְהַצִּילָם
  choice: 不能……搭救他们
  rationale: הציל在审判语境中表示救出、解救；“搭救”保留实际脱离灾祸的含义，不将其收窄为特定的神学救恩概念。
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: 在雅威震怒的日子
  rationale: עֶבְרָה表示强烈的愤怒；“震怒”符合先知审判语境。יְהוָה按其专名译作“雅威”。
- source_word: נַפְשָׁם לֹא יְשַׂבֵּעוּ
  choice: 不能使他们的食欲得到满足
  rationale: נֶפֶשׁ在此与填满肚腹平行，所指是人的食欲或饥饿需要，而非抽象的灵魂。
- source_word: וּמֵעֵיהֶם לֹא יְמַלֵּאוּ
  choice: 也不能填饱他们的肚腹
  rationale: מֵעֶה字面指内脏、腹中；在进食语境中，“肚腹”既保留身体意象，又是自然庄重的现代汉语。
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: 使他们陷入罪孽的绊脚石
  rationale: מִכְשׁוֹל是导致跌倒之物；此处财富成为他们犯罪的诱因或障碍。“使他们陷入罪孽的绊脚石”保留原文的跌倒隐喻及因果张力。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”作为专名音译，保留其作为以色列之神名字的功能，而不以称号替代。
- issue: נִדָּה 是否明确译出经期不洁
  choice: 正文作“污秽之物”，脚注说明经期不洁的语义
  alternative: 经期的污秽；可憎的脏物
  rationale: 该词确实可唤起经期礼仪不洁的具体意象，但这里是比喻性地描述黄金变得令人厌弃。正文保留较宽的“不洁”概念，脚注则保存其尖锐的词汇背景。
- issue: נַפְשָׁם 在本节中的含义
  choice: 他们的食欲
  alternative: 他们的性命；他们的心灵
  rationale: 下句“填饱肚腹”限定了语境，表明这里主要谈饥饿和身体需要；如此翻译可避免把本句误读为关于灵魂本体的陈述。
- issue: 末句单数指代的理解
  choice: 以“这金银”点明前述财富
  alternative: 它；这件事
  rationale: 希伯来文使用单数“它成了”，可能把前述金银视为一个整体，即财富。中文若只用“它”指代不清，因此译作“这金银”，同时保留集合性的理解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“扔在街上”保持动作直接有力；“肚腹”“绊脚石”保留先知文本的身体意象和比喻色彩。脚注标记置于其实际解释的“污秽之物”之后。
