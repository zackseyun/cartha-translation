  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 此处的叙事形式与“话”及介词短语共同构成先知书常见的启示引介公式；汉语用“临到”自然承载“来到、发生”的语义，无须另译“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定先知性表达中，“话”既贴近原文，又保留它与后续神谕内容的直接联系；“信息”虽可表达大意，但形式对应较弱。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中最通行、最易识别的专名形式“耶和华”，明确将其作为神的名字，而非以“主”这一称号替代。
- source_word: אֵלַי
  choice: 我
  rationale: 原文意为“到我这里”；汉语“临到我”已准确、自然地表达介词与第一人称后缀。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出随后话语的常用表达；译作“说：”简洁自然，并以冒号衔接下一节内容。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留专名而不以“主”替代；“耶和华”是普通现代中文读者最熟悉的传统音译，“雅威”则更接近当代学界常见的拟音，但原文书写本身不保留完整元音，故不借脚注断定唯一发音。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留先知书中反复出现的公式“耶和华的话临到我，说：”。本节无需脚注；“说”后的冒号表明话语将在下一节展开。
