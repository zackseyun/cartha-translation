  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י הַ/מּוֹכֵ֗ר אֶל הַ/מִּמְכָּר֙ לֹ֣א יָשׁ֔וּב וְ/ע֥וֹד בַּ/חַיִּ֖ים חַיָּתָ֑/ם כִּֽי חָז֤וֹן אֶל כָּל הֲמוֹנָ/הּ֙ לֹ֣א יָשׁ֔וּב וְ/אִ֧ישׁ בַּ/עֲוֺנ֛/וֹ חַיָּת֖/וֹ לֹ֥א יִתְחַזָּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/013.yaml
  text: For the seller will not return to what was sold[a], though they are still alive; for the vision concerning all its multitude will not turn back[e][d][c][b], and no one will strengthen his life in his iniquity.
translation:
  language: zh_hans
  text: 因为卖主不能收回所卖之物[a]，即使他们仍然活着[b]；因为那关乎全体民众的异象[c]必不撤回[d]，无人能在自己的罪孽中保全性命[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“那笔买卖”。这里在上下文中也可能指已经卖出的产业或产业所有权。
    reason: lexical_alternative
  - marker: b
    text: 原文是压缩表达，近于“他们的生命仍在活人中”。通常理解为：即使交易相关者仍然活着，卖主也不能收回所卖之物。
    reason: lexical_alternative
  - marker: c
    text: “关乎”也可译作“针对”。原文介词可表示异象所涉及或所指向的全体民众。
    reason: alternative_reading
  - marker: d
    text: 原文直译为“必不返回”；在这里也可理解为“必不撤销”或“必不逆转”。
    reason: alternative_reading
  - marker: e
    text: 本节末句的希伯来文句法困难，也可译作“无人能借自己的罪孽保全性命”；“保全”原文近于“使坚固”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹכֵר
  choice: 卖主
  rationale: 主动分词作名词，指卖出产业的人；“卖主”自然、简洁，并保留买卖的具体意象。
- source_word: אֶל הַמִּמְכָּר
  choice: 回到所卖的产业
  rationale: 原文可指“所卖之物”或“买卖”；上下文涉及产业交易，译作“所卖的产业”既明确所回归的对象，又不限定为某一种土地。
- source_word: וְעוֹד בַּחַיִּים חַיָּתָם
  choice: 即使买卖双方仍然活着
  rationale: 原文是压缩表达，直译近于“他们的生命仍在活人中”；此处意指即便交易双方尚存，卖主也不能取回所卖之物。
- source_word: חָזוֹן
  choice: 异象
  rationale: 这是先知启示语境中的常用词，译作“异象”保持其启示性质和庄重语体。
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: 关乎这一切群众
  rationale: 介词 אֶל 可表达指向、涉及，也可能带有敌对方向；正文用“关乎”保留指涉意义，脚注说明“针对”的可能。
- source_word: לֹא יָשׁוּב
  choice: 必不收回
  rationale: שׁוב 基本义为返回；用于审判异象时可表示不会逆转或撤回。译作“收回”使现代读者明白宣告不会撤销，同时在脚注保留字面表达。
- source_word: בַּעֲוֹנוֹ
  choice: 在自己的罪孽中
  rationale: 介词 ב 可表示领域或处境，也可能被理解为手段；“在……中”较贴近形式，并避免断然判定其工具意义。
- source_word: חַיָּתוֹ לֹא יִתְחַזָּקוּ
  choice: 无人能……保全性命
  rationale: 原文句法困难，单数分配性主语后接复数动词；语境大意是罪孽不能使人稳固或保存生命。“保全性命”自然表达结果，脚注交代原文近于“使生命坚固”。
theological_decisions:
- issue: 末句中罪孽与保全生命的关系
  choice: 无人能在自己的罪孽中保全性命
  alternative: 无人能借自己的罪孽保全性命；他们不能在自己的罪孽中使生命坚固
  rationale: 希伯来文末句的数与句法不规则，בַּעֲוֹנוֹ 也可表示领域或手段。正文保留“在……中”的张力，不把它完全解释成“借着”，同时表达犯罪不能使人在既定审判中保住生命。
- issue: 异象是否会返回
  choice: 异象必不收回
  alternative: 异象必不返回；异象必不撤销
  rationale: 上下文指已经宣告的审判不会逆转。“收回”清楚表达这一语用意义，但脚注保留原文字面为“返回”，避免抹去重复用词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“卖主”“产业”“异象”“罪孽”保留先知审判语境；对压缩且句法困难之处作有限度明译，并用脚注保存字面形式及主要歧义。
