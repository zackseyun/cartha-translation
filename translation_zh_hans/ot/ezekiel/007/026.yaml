  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֹוָ֤ה עַל הֹוָה֙ תָּב֔וֹא וּ/שְׁמֻעָ֥ה אֶל שְׁמוּעָ֖ה תִּֽהְיֶ֑ה וּ/בִקְשׁ֤וּ חָזוֹן֙ מִ/נָּבִ֔יא וְ/תוֹרָה֙ תֹּאבַ֣ד מִ/כֹּהֵ֔ן וְ/עֵצָ֖ה מִ/זְּקֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/026.yaml
  text: Disaster upon disaster will come[a], and rumor upon rumor will arise. They will seek a vision from a prophet, but instruction will perish from the priest[b], and counsel from the elders.
translation:
  language: zh_hans
  text: 灾祸接连而来，消息接着消息传来[a]。他们必向先知寻求异象；训诲必从祭司那里消失[b]，谋略也必从长老那里消失。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“传闻”或“报告”。原词可泛指听来的消息；这里描写令人惊恐的消息接连传开。
    reason: lexical_alternative
  - marker: b
    text: “训诲”也可译作“律法”或“教导”。希伯来语“妥拉”在这里主要指祭司所提供的教导和指引。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹוָה עַל הֹוָה
  choice: 灾祸接连而来
  rationale: הֹוָה指毁灭性的灾难；“接连而来”自然表达 עַל 所呈现的灾祸层叠、接踵而至之势，同时保留重复所带来的强烈语气。
- source_word: שְׁמֻעָה אֶל שְׁמוּעָה
  choice: 消息接着消息传来
  rationale: שְׁמוּעָה可指消息、传闻或报告。上下文强调令人惊恐的消息不断传到；正文采用中性的“消息”，不武断判定其真假，并以脚注保留“传闻”的可能。
- source_word: וּבִקְשׁוּ חָזוֹן מִנָּבִיא
  choice: 他们要向先知寻求异象
  rationale: בקשׁ表达主动寻求；חָזוֹן在先知语境中指启示性的异象。מִנָּבִיא无冠词，不宜指定某一位已知先知；汉语“向先知”自然保留类别性的表达。
- source_word: וְתוֹרָה תֹּאבַד מִכֹּהֵן
  choice: 但祭司不再有训诲
  rationale: תּוֹרָה在此与祭司职分相连，主要指其教导和指引。“训诲”兼有教导与权威性，比单译“律法”更符合本节的职分语境；“不再有”自然表达 אָבַד 所指的丧失、断绝。
- source_word: וְעֵצָה מִזְּקֵנִים
  choice: 长老也不再有谋略
  rationale: 原文省略与前句共用的谓语“消失/断绝”。中文补出“也不再有”，清楚呈现先知、祭司、长老三种指引渠道相继失效；עֵצָה译作“谋略”，保留审议和决策建议之意。
theological_decisions:
- issue: 祭司语境中 תּוֹרָה 的含义
  choice: 训诲
  alternative: 律法；教导
  rationale: 本节列举先知的异象、祭司的妥拉和长老的谋略，描写公认指引渠道的崩溃。因此将 תּוֹרָה 译为祭司所给的“训诲”，既涵盖律法性教导，也不把词义缩限为成文法典。
- issue: 先知、祭司与长老名词的职分类意义
  choice: 向先知……祭司……长老
  alternative: 向一位先知……一位祭司……众长老；向那先知……那祭司……长老
  rationale: 希伯来文“先知”和“祭司”为无冠词单数，“长老”为复数。中文不靠冠词标示定指，现译文自然呈现这些职分类别，不将其误解为特定个人。
- issue: 指引消失的表达方式
  choice: 祭司不再有训诲，长老也不再有谋略
  alternative: 训诲必从祭司那里消失，谋略必从长老那里消失
  rationale: 选择自然现代汉语，同时保留神谕所宣告的全面断绝。此处不解释为祭司或长老个人能力的永久废除，只表达审判临到时这些指引渠道无法提供所求。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“灾祸接连而来，消息接着消息传来”以平行节奏再现原文的层叠结构；后半句用“不再有”避免生硬直译“灭亡于”，并清楚表现先知、祭司、长老三种传统指引渠道的崩溃。
