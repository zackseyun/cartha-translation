  yaml_path: translation/ot/ezekiel/007/025.yaml
  text: Anguish has come[a], and they will seek peace, but there is none.
translation:
  language: zh_hans
  text: 惊惶临到[a]；他们必寻求平安，却没有平安。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“恐惧临到”、“灾难临到”或“恐怖临到”。这个希伯来语名词很少见，既可能侧重恐惧本身，也可能侧重审判所造成的灾难处境。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְפָדָה
  choice: 惊惶
  rationale: 此名词罕见，在本节审判语境中可指令人恐惧的灾难状态，也可侧重人因灾祸而有的惊恐。“惊惶”自然传达其体验层面的力度，同时不把词义局限为物质毁灭；其他可能译法列入脚注。
- source_word: בָא
  choice: 临到了
  rationale: 完成式在先知宣告中把审判描写为已经来到或确定临近；“临到了”既保留这种已然感，也符合庄重的现代汉语表达。
- source_word: וּבִקְשׁוּ
  choice: 他们寻求
  rationale: 带连接词的完成式承接审判来临后的反应；汉语无需强加明确时态，语序本身即可表达随后的行动。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 此处不只指内心安宁，也包括安全、安稳和福祉。“平安”是简明且语境合宜的对应词。
- source_word: וָאָיִן
  choice: 却寻不着
  rationale: 原文直译为“却没有”，指他们所寻求的平安并不存在。结合汉语表达译作“却寻不着”，清楚呈现否定结果而不改变核心意义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“惊惶”保留罕见名词在主观恐惧与客观灾祸之间的语义张力；分号呈现审判来临与人寻求平安之间的推进关系。
