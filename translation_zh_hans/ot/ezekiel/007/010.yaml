  text: הִנֵּ֥ה הַ/יּ֖וֹם הִנֵּ֣ה בָאָ֑ה יָֽצְאָה֙ הַ/צְּפִרָ֔ה צָ֚ץ הַ/מַּטֶּ֔ה פָּרַ֖ח הַ/זָּדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/010.yaml
  text: Look[a], the day! Look, it comes! Doom has gone out; the rod has budded; arrogance has blossomed.
translation:
  language: zh_hans
  text: 看哪，日子！看哪，它已经来了！厄运[a]已经发出；杖已经发芽，狂傲已经开花。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“清晨已经发出。”这里的希伯来词含义难定，可能按字面指“清晨”，也可能比喻已经来到的厄运或命定的转折。
    reason: 保留难解希伯来词 הַצְּפִרָה 的主要替代解释，避免正文译法消除原文歧义。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是唤起注意的指示语；“看哪”既保留先知宣告的紧迫感，也适合庄重的现代汉语。原文的重复予以保留。
- source_word: הַיּוֹם
  choice: 这日子
  rationale: 按原文保留“日子”的表达，不在正文中增补“审判”等解释；“这”体现 הִנֵּה 所指向的迫近之日。
- source_word: בָאָה
  choice: 已经来到
  rationale: 该完成式在先知话语中把迫近之事说成确定实现；“已经来到”保留这种鲜明的确定感。汉语省略代词，也避免强行消解希伯来语阴性动词与前置阳性名词“日子”之间的语法张力。
- source_word: יָצְאָה
  choice: 已经出现
  rationale: יצא 的基本意象是“出来、发出”。此处与难解的 הַצְּפִרָה 连用，“已经出现”在现代汉语中自然，并表达灾变已经显露、发动的结果状态。
- source_word: הַצְּפִרָה
  choice: 厄运
  rationale: 该词含义有争议；在本章审判语境中，“厄运”能表达命定的灾变已经到来。正文采用语境义，同时以脚注保留“清晨”等可能解释。
- source_word: צָץ
  choice: 已经发芽
  rationale: 保留植物生长的比喻，并与下句“已经开花”形成平行。
- source_word: הַמַּטֶּה
  choice: 杖
  rationale: “杖”保留原词可指棍杖、刑罚工具或权柄标志的开放性，不在正文中限定为某一种象征。
- source_word: פָּרַח
  choice: 已经开花
  rationale: 保留与“发芽”相连的生长意象，表达狂傲发展到明显可见的地步。
- source_word: הַזָּדוֹן
  choice: 狂傲
  rationale: 该词指骄横、僭越而放肆的态度；“狂傲”比一般的“骄傲”更能体现其负面的道德力度。
theological_decisions:
- issue: 审判宣告中 הַצְּפִרָה 的解释
  choice: 正文译作“厄运”
  alternative: “清晨”或“转机／命定的转折”
  rationale: 上下文宣告迫近的审判，并以杖发芽、狂傲开花描写灾祸成熟，因此“厄运”最符合语境。不过该希伯来词十分难解，可能按字面指“清晨”，也可能指命定的转折，故以脚注保留歧义。
- issue: בָאָה 的时间色彩
  choice: 译作“已经来到”
  alternative: “正在来到”
  rationale: 完成式在先知宣告中可把即将发生之事呈现为确定无疑；采用“已经来到”保留这种预示性确定感，不把它改写成较弱的单纯将来。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“看哪”的两次重复及“发芽／开花”的平行意象，以呈现原文短促、紧迫、层层推进的先知宣告节奏。
