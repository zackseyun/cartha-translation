id: EZK.7.9
reference: Ezekiel 7:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמ֑וֹל כִּ/דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה מַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/009.yaml
  text: My eye will not spare[a], nor will I show pity. I will bring your ways upon you, and your abominations will be in your midst. Then you will know that I am Yahweh[c][b], who strikes.
translation:
  language: zh_hans
  text: 我的眼必不顾惜[a]，我也不怜悯。我必按你的行径报应你[b]；你那些可憎之事必在你中间。这样，你们就知道，我是雅威[c]，是施行击打的那一位。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“我的眼必不怜惜”。希伯来语在这里以“眼”配合表示顾惜、怜恤的动词。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我必使你的行径归到你身上。”直译：“我必照你的道路加在你身上。”这里的“道路”指人的行事为人，含有按其行为施行报应的意思。
    reason: lexical_alternative
  - marker: c
    text: “雅威”音译希伯来文的神名 יהוה（YHWH）；传统汉语常译作“耶和华”，有些译本以“上主”代称。
    reason: cultural_note
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: 我的眼必不顾惜
  rationale: 保留希伯来语以“眼”表达顾惜、怜恤的习语意象；“顾惜”也切合审判语境。
- source_word: אֶחְמוֹל
  choice: 我也不怜悯
  rationale: 用“怜悯”与前句“顾惜”形成近义平行，同时保留 חמל 所含的同情、怜恤意味。
- source_word: כִדְרָכַיִךְ עָלַיִךְ אֶתֵּן
  choice: 我必使你的所作所为归到你身上
  rationale: דרך 在这里指行为方式；此译保留“临到／归到自身”的报应性意象，又符合现代汉语表达。
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: 你那些可憎之事
  rationale: תועבות 指极其可憎的行为或事物，常涉及偶像崇拜及道德败坏；“可憎之事”保持先知话语的强烈分量而不擅自限定义项。
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: 必留在你中间
  rationale: 保留空间性的“在你中间”；“留在”自然表达这些可憎之事及其后果仍在其中显明，但不把所指单限定为后果。
- source_word: וִידַעְתֶּם
  choice: 这样，你们就知道
  rationale: 将连接词在此处的结果意味译出，使审判与认识雅威之间的关系清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名 YHWH，不以称号替代专名；脚注交代其来源。
- source_word: מַכֶּה
  choice: 是施行击打的那一位
  rationale: 该主动分词描述雅威为实施审判者；此译保留身份与行动并置的张力，也反映分词的持续或特征性意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”以保留专名性质，并用脚注说明；不以称号取代，也不把另一种传统音译误作原文读音。
- issue: 末句审判宣告的语力
  choice: 我是雅威，是施行击打的那一位
  alternative: 我雅威正在击打；我是击打人的雅威
  rationale: מַכֶּה 是主动分词，可表达正在实施或具有特征性的行动。所选译文保留这种开放性，并突出审判出于雅威，而不另加受击打对象。
- issue: “可憎之事必在你中间”的所指
  choice: 不明确限定为罪行本身、罪证或其后果
  alternative: 你可憎之事的后果必临到你
  rationale: 原文只说这些可憎之事“在你中间”，没有显式补出“后果”；译文保存其具体而含混的先知性表达。
translation_notes:
  register: 采用庄重、直接的现代标准汉语，保留先知审判宣告的重复和平行结构。单数阴性“你”所指为拟人化的以色列地或相关群体，随后转为复数“你们”；译文按原文保留这一数的转换，不擅自统一。所有脚注标记均置于相应正文位置。
