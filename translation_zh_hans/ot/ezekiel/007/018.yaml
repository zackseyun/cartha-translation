  text: וְ/חָגְר֣וּ שַׂקִּ֔ים וְ/כִסְּתָ֥ה אוֹתָ֖/ם פַּלָּצ֑וּת וְ/אֶ֤ל כָּל פָּנִים֙ בּוּשָׁ֔ה וּ/בְ/כָל רָאשֵׁי/הֶ֖ם קָרְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/018.yaml
  text: They will put on sackcloth, and horror will cover them; shame will be on every face, and baldness on all their heads.
translation:
  language: zh_hans
  text: 他们必腰束麻布，惊恐必笼罩他们；他们个个脸上蒙羞，人人头上光秃。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָגְרוּ שַׂקִּים
  choice: 腰束麻布
  rationale: חגר指束在腰间，שַׂקִּים指哀悼或苦难中所穿的粗麻布；“腰束麻布”既保留动作意象，也符合庄重自然的现代汉语。
- source_word: פַּלָּצוּת
  choice: 惊恐
  rationale: 该词表示强烈的恐惧、战栗或骇然；“惊恐”保留其心理与身体反应的语义范围，不将其弱化为一般的颤抖。
- source_word: וְכִסְּתָה אוֹתָם
  choice: 必笼罩他们
  rationale: 原文直译为“覆盖他们”；用于“惊恐”时，“笼罩”在汉语中自然，并保留无所逃避的覆盖意象。
- source_word: קָרְחָה
  choice: 头上光秃
  rationale: 该词意为秃头、头发脱落或被除去后的光秃状态；译文保留结果状态，不擅自明确其成因或具体哀悼方式。
theological_decisions:
- issue: 光秃是否明确解释为主动剃头的哀悼行为
  choice: 仅译作“头上光秃”
  alternative: “人人都剃光了头”
  rationale: 上下文与先知传统可使其带有哀悼意涵，但本节原文本身只陈述光秃状态，没有明确使用“剃”这一动作，因此不将可能的礼俗解释写入正文。
translation_notes:
  register: 采用庄重、清晰的现代标准普通话；以“个个／人人”再现两处“所有”的平行强调，并避免生硬重复“每一张脸／所有的头”。
