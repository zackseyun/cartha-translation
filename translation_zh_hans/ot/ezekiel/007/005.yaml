  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה רָעָ֛ה אַחַ֥ת רָעָ֖ה הִנֵּ֥ה בָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/005.yaml
  text: 'Thus says the Lord GOD: A disaster[a], a unique disaster—behold, it is coming.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“灾祸！一场独特的灾祸[a]——看哪，它正在来临！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“灾祸，一场灾祸。”希伯来文重复“灾祸”以加强语气；“一”既可强调只有一场，也可表示这场灾祸独特非凡。
    reason: 保留 אַחַת 的单一性与独特性之间的词义歧义，并说明原文重复所产生的强调效果。
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中庄重、固定的使者用语，同时符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 这是该复合神名在现代中文圣经语境中清楚而庄重的对应；“主”表达 אֲדֹנָי，“耶和华”标示四字神名 יהוה。
- source_word: רָעָה
  choice: 灾祸
  rationale: 本节是审判语境，所指是临到的祸患，而非道德意义上的邪恶；“灾祸”准确且自然。
- source_word: רָעָה אַחַת רָעָה
  choice: 灾祸！一场独特的灾祸
  rationale: 保留原文对“灾祸”的突兀重复和强调；把 אַחַת 理解为突出这场灾祸的单一性或独特性，但以脚注保留另一种可能。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留先知宣告中引人注意的紧迫感和庄严语气。
- source_word: בָאָה
  choice: 它来了
  rationale: 简洁保留原文所传达的逼近感；现代汉语“来了”既可指正在临近，也可指已然来到，避免过度限定时态。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在简体中文读者中更为通行、可辨识，并分别对应复合称号的两个成分；没有把神名泛化为普通称谓。
- issue: אַחַת 在审判宣告中的强调作用
  choice: 独特的
  alternative: 一场（即“一场灾祸，一场灾祸”）
  rationale: 该数词可能强调这灾祸独一、特殊，也可能只是强调“一场”；正文采用自然可懂的“独特的”，脚注明确保留字面与语义上的歧义。
translation_notes:
  register: 采用庄重而明白的现代标准汉语。“灾祸！”以短促独立句再现原文的突兀警告；破折号和“看哪”强化迫近的审判宣告。
