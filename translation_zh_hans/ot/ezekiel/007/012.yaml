  text: בָּ֤א הָ/עֵת֙ הִגִּ֣יעַ הַ/יּ֔וֹם הַ/קּוֹנֶה֙ אַל יִשְׂמָ֔ח וְ/הַ/מּוֹכֵ֖ר אַל יִתְאַבָּ֑ל כִּ֥י חָר֖וֹן אֶל כָּל הֲמוֹנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/012.yaml
  text: The time has come[a]; the day has arrived. Let not the buyer rejoice, and let not the seller mourn[b], for wrath is against all her multitude.
translation:
  language: zh_hans
  text: 时候已经到了，日子已经来到。买的人不要欢喜，卖的人不要哀伤，因为烈怒临到她的全体民众。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “民众”或译“财富”；希伯来语 הֲמוֹנָהּ 中的名词也可表示丰富的财物或产业。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“她的全体民众”。“她”保留了阴性拟人，所指可能是受审判的城、土地或共同体。
    reason: cultural_note
lexical_decisions:
- source_word: בָּא הָעֵת
  choice: 时候到了
  rationale: 完成式宣告决定性的时刻已经来到；“时候到了”简洁自然，也保留迫在眉睫的先知语气。
- source_word: הִגִּיעַ הַיּוֹם
  choice: 日子来临了
  rationale: 与前句形成强调性的平行；“来临了”表达所宣告的审判之日已经抵达。
- source_word: הַקּוֹנֶה
  choice: 买的人
  rationale: 分词作名词，泛指进行买卖的人；此译法比“购买者”更符合现代汉语。
- source_word: אַל יִשְׂמָח
  choice: 不要欢喜
  rationale: אַל加未完成式表达禁止或劝止；“不要”准确而自然。
- source_word: הַמּוֹכֵר
  choice: 卖的人
  rationale: 与“买的人”对应，保留原文简明、概括的表达。
- source_word: אַל יִתְאַבָּל
  choice: 不要悲哀
  rationale: 该动词指哀恸、悲伤；“悲哀”既适合卖出产业所可能引发的失落，也保留更广的审判语境。
- source_word: חָרוֹן
  choice: 烈怒
  rationale: 该词表示炽烈的愤怒，语境中指向审判；“烈怒”庄重有力，又不在正文中擅自补出其主体。
- source_word: אֶל
  choice: 临到
  rationale: 在审判语境中表达烈怒指向并落在对象身上；“临到”较合乎自然汉语。
- source_word: כָּל הֲמוֹנָהּ
  choice: 她所有的民众
  rationale: הָמוֹן在此较可能指众人、群体；阴性单数后缀译作“她的”，保留原文对城、土地或共同体的女性拟人，而不锁定具体先行词。
theological_decisions:
- issue: הֲמוֹנָהּ中阴性后缀的所指
  choice: 在正文中保留“她”，不明确指定所指对象
  alternative: 译作“它所有的民众”，或明确译成“城中所有的民众／全地所有的民众”
  rationale: 原文使用阴性单数后缀，可能承接被拟人化的城、土地或共同体。保留“她”可再现这一拟人表达，并避免消除原文的指代张力。
- issue: הָמוֹן在本节中的含义
  choice: 民众
  alternative: 财富、财物
  rationale: 该词可指众多的人，也可在某些语境中指丰富的财物。本节的集体审判语境较支持“民众”，但词义上的另一可能应由脚注保留。
- issue: חָרוֹן的主体
  choice: 只译“烈怒”，不在正文补出“上帝的”
  alternative: 上帝的烈怒
  rationale: 上下文可使读者理解这是神圣审判，但本节希伯来文本未明说所有格；不补出主体可保持形式与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前两句保留希伯来文的平行节奏；“买的人／卖的人”维持对称。正文不擅自说明阴性代词的先行词，也不把“烈怒”的主体显明化。两个脚注标记均置于相关短语之后。
