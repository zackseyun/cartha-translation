  text: הֶ/חָמָ֥ס קָ֖ם לְ/מַטֵּה רֶ֑שַׁע לֹא מֵ/הֶ֞ם וְ/לֹ֧א מֵ/הֲמוֹנָ֛/ם וְ/לֹ֥א מֶ/הֱמֵ/הֶ֖ם וְ/לֹא נֹ֥הַּ בָּ/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/011.yaml
  text: Violence has arisen into a rod of wickedness[a]; none of them remains, none of their multitude, none of their wealth[b], and there is no eminence among them.
translation:
  language: zh_hans
  text: 强暴已经兴起，成了邪恶的杖[a]；他们无一存留；他们的群众、他们的财富[b]也无一存留；他们中也不再有显赫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 后半节的希伯来文十分省略，也很难确定；较直译可作：“没有出于他们的，也没有出于他们群众的，也没有出于他们众多（或：喧嚷）的。”
    reason: alternative_reading
  - marker: b
    text: 这里译作“财富”的希伯来词含义不确定，也可能指“众多”或“喧嚷”。末句译作“显赫”的词同样罕见，也可理解为“显贵”“卓越”，另有人对整句有不同解释。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָמָס
  choice: 强暴
  rationale: חָמָס指暴力、强暴或暴行；“强暴”既简洁有力，也保留句首近于拟人化的表达。
- source_word: קָם
  choice: 已经兴起
  rationale: קום的Qal完成式在此表示起来、兴起；“已经兴起”自然地呈现其突然而成势的意味。
- source_word: לְמַטֵּה
  choice: 成了……的杖
  rationale: מַטֶּה可指杖、棍或支派；审判语境中“杖”最能保留惩罚或辖制工具的隐喻。介词ל结合קָם译作“成了”，较自然地表达结果，同时不过度限定其句法关系。
- source_word: רֶשַׁע
  choice: 邪恶
  rationale: רֶשַׁע表示邪恶、恶行或罪责；“邪恶的杖”保留其道德性质及与מַטֶּה的属格关系。
- source_word: לֹא מֵהֶם
  choice: 他们中无一存留
  rationale: 原文是省略性的“不是出于他们／没有他们中的”；按本章彻底审判的语境，最低限度补出“存留”，使中文可懂，同时以脚注交代原文的含混。
- source_word: וְלֹא מֵהֲמוֹנָם
  choice: 他们的群众……都不存留
  rationale: הָמוֹן可指群众、众多、财富或喧嚷；此处“群众”与前面的“他们”相连，保留群体层面的意义。
- source_word: וְלֹא מֶהֱמֵהֶם
  choice: 他们的财富……都不存留
  rationale: 该词形罕见且释义有争议；“财富”能在上下文中形成从人群到所有物的推进，但脚注保留“众多／喧嚷”等可能。
- source_word: וְלֹא נֹהַּ בָּהֶם
  choice: 他们中也没有尊贵的了
  rationale: נֹהַּ是罕见而意义不确定的词；“尊贵的”对应可能的“显贵／卓越者”之义，并以脚注说明其他理解。
theological_decisions:
- issue: 如何处理审判宣告中连续出现的省略和罕见词
  choice: 将本节译为强暴兴起成为邪恶之杖，并最低限度补出“存留”，表达他们、群众和财富都将消失，尊贵者也不复存在。
  alternative: 更直译而保留晦涩：“没有出于他们的，没有出于他们群众的，也没有出于他们众多／喧嚷的；他们中也没有נֹהַּ。”
  rationale: 原文后半连续使用否定介词短语，句法高度省略，末两个词也不确定。本译文依以西结书第7章全面审判的语境补足中文所必需的信息，但不把有争议的词义当作确定结论，并在脚注中保存替代解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“强暴”“邪恶的杖”保留先知性审判宣告的凝练意象；后半句通过重复“存留”使省略结构在中文中清楚，同时用脚注明确原文的不确定性。
