  text: עֲשֵׂ֖ה הָֽ/רַתּ֑וֹק כִּ֣י הָ/אָ֗רֶץ מָֽלְאָה֙ מִשְׁפַּ֣ט דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/023.yaml
  text: Make the chain[a], for the land is full of bloody crimes[b], and the city is full of violence.
translation:
  language: zh_hans
  text: 要制作锁链[a]，因为这地充满了流血的罪案[b]，这城也充满了暴行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“镣铐”或“捆绑之物”。这个希伯来词很可能使人想到审判之下的束缚、囚禁或被掳。
    reason: lexical_alternative
  - marker: b
    text: 直译“血的审判”（希伯来文“血”为复数）。这短语可能指血债、杀人的不义、涉及流血的案件，或应受审判的流血罪行。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה
  choice: 要做
  rationale: 这是动词 עשה 的 Qal 第二人称阳性单数祈使式，表达直接命令；现代汉语用“要做”既保留命令语气，也符合先知宣告的庄重语体。
- source_word: הָרַתּוֹק
  choice: 锁链
  rationale: 该词是带定冠词的名词，通常理解为链条、镣铐或捆绑之物；“锁链”保留具体的束缚意象，并与本章审判、被掳的语境相合。
- source_word: כִּי
  choice: 因为
  rationale: 引出发出命令的原因；“因为”在现代汉语中清楚自然。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 这里更可能指以色列或犹大之地，而非全世界；“这地”保留特定地域的指向，也符合先知话语的现场感。
- source_word: מָלְאָה
  choice: 充满了
  rationale: 该完成式在此表达已经形成的状态；“充满了”自然传达结果性和现状。
- source_word: מִשְׁפַּט דָּמִים
  choice: 血腥的罪案
  rationale: 原文直译近于“众血之审判/案件”，含义可能涉及血债、杀人暴行、司法不公或应受审判的流血罪；正文采用“血腥的罪案”兼顾司法与流血两层含义，脚注保留原文的歧义。
- source_word: וְהָעִיר
  choice: 这城也
  rationale: 所指很可能是耶路撒冷；不在正文直接补出城名，以免超出原文。“也”自然呈现与前句平行递进的关系。
- source_word: חָמָס
  choice: 暴行
  rationale: חמס 可涵盖暴力、强暴、压迫和不义；“暴行”在此既指具体暴力，也带有严重社会恶行的意味。
theological_decisions:
- issue: הָרַתּוֹק 所表达的审判意象
  choice: 采用具体的“锁链”，理解为与束缚、囚禁或被掳相关的审判象征
  alternative: 译作“镣铐”或较抽象的“捆绑之物”，也可能指为围城或囚禁预备的器具
  rationale: 以西结书第7章的上下文涉及入侵、惩罚和安全终结。具体译为“锁链”可保存先知性的意象，却不武断限定它究竟是实际刑具还是象征。
- issue: מִשְׁפַּט דָּמִים 的司法与流血含义
  choice: 正文译作“血腥的罪案”，同时保留司法案件、血债和杀人不义的张力
  alternative: 可译作“流血的审判”“血债”或“流血罪”
  rationale: 原构词短语不够明确，可能指涉及流血的案件、造成流血的司法败坏，或应受审判的血债。译文不把它收窄为单一教义性解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“要做锁链”保留原文突兀有力的命令；两个“充满了”形成平行结构。正文中的[a]、[b]均与脚注对应。
