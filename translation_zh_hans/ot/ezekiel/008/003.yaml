  text: וַ/יִּשְׁלַח֙ תַּבְנִ֣ית יָ֔ד וַ/יִּקָּחֵ֖/נִי בְּ/צִיצִ֣ת רֹאשִׁ֑/י וַ/תִּשָּׂ֣א אֹתִ֣/י ר֣וּחַ בֵּֽין הָ/אָ֣רֶץ וּ/בֵ֣ין הַ/שָּׁמַ֡יִם וַ/תָּבֵא֩ אֹתִ֨/י יְרוּשָׁלְַ֜מָ/ה בְּ/מַרְא֣וֹת אֱלֹהִ֗ים אֶל פֶּ֜תַח שַׁ֤עַר הַ/פְּנִימִית֙ הַ/פּוֹנֶ֣ה צָפ֔וֹנָ/ה אֲשֶׁר שָׁ֣ם מוֹשַׁ֔ב סֵ֖מֶל הַ/קִּנְאָ֥ה הַ/מַּקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/003.yaml
  text: Then he stretched out what looked like a hand and took me by a lock of my head[a], and the Spirit lifted me up between the earth and the heavens and brought me to Jerusalem in visions of God, to the entrance of the inner gate that faces north[b], where the seat of the image of jealousy that provokes jealousy was.
translation:
  language: zh_hans
  text: 他伸出一个形状像手的东西[a]，抓住我头上的一绺头发。灵[b]把我提到地与天之间，又在上帝的异象中把我带到耶路撒冷，来到朝北的内门入口；那里安放着那惹动嫉妒的嫉妒之像。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“手的形状。”
    reason: lexical_alternative
  - marker: b
    text: “灵”也可译作“风”或“一个灵”；这里也可能指“上帝的灵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית יָד
  choice: 一个仿佛手的形状
  rationale: תַּבְנִית表示形状、样式或相似之物；此译保留“形状”的实体感，也明确这是异象中的视觉相似，而不直接断定就是一只手。
- source_word: בְּצִיצִת רֹאשִׁי
  choice: 我头上的一绺头发
  rationale: צִיצִת在此指一绺或一撮头发；“一绺头发”是现代汉语中具体、自然的表达。
- source_word: רוּחַ
  choice: 灵
  rationale: רוּחַ可指风、灵或上帝的灵。以西结书的异象迁移语境倾向于超自然的灵，但希伯来文本没有冠词，因此正文用较开放的“灵”，并以脚注保留其他可能。
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: 悬在地与天之间
  rationale: “地与天之间”自然传达希伯来语的空间对举；加入“悬在”承接“提起”并符合汉语叙述。שָׁמַיִם虽为形态复数，在汉语中通常译作单数集合概念“天”。
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: 在上帝所赐的异象中
  rationale: 原文直译为“在上帝的异象中”，属格可表示来源或性质。正文采用符合语境的来源义，使汉语清楚自然，同时不把异象本身等同于上帝。
- source_word: פֶּתַח שַׁעַר הַפְּנִימִית
  choice: 内门入口
  rationale: 简洁保留פֶּתַח“入口”和שַׁעַר“门”的构造关系；阴性形式在句法上较特殊，但所指仍是内门。
- source_word: הַפּוֹנֶה צָפוֹנָה
  choice: 朝北的
  rationale: 这是现代汉语最自然的方向表达，准确对应“面向北方”。
- source_word: מוֹשַׁב
  choice: 安放着
  rationale: מוֹשַׁב可指座位、居所或所在之处。此处描述神像固定设置的位置，用“安放着”比直译“座位”更符合汉语，同时不额外推断其具体设施。
- source_word: סֵמֶל
  choice: 像
  rationale: סֵמֶל可指形像或偶像；“像”保留较宽泛的词义，由上下文显明其冒犯性质，避免在正文中强化为原词未必单独表达的“偶像”。
- source_word: הַקִּנְאָה הַמַּקְנֶה
  choice: 那惹动嫉妒的嫉妒之像
  rationale: 以重复“嫉妒”保留קנא词根在名词与使役分词间的刻意呼应；“惹动”自然表达使人产生嫉妒的因果意味。
theological_decisions:
- issue: 异象迁移中的רוּחַ是风、某个灵，还是上帝的灵
  choice: 灵
  alternative: 风；上帝的灵
  rationale: 以西结书中超自然迁移的语境支持“灵”，但本节没有冠词，单凭此处不宜在正文中明确加上“上帝的”；脚注保留“风”和“上帝的灵”的解释空间。
- issue: “嫉妒之像”所惹动的嫉妒是否明确属于上帝
  choice: 不在正文补出嫉妒的主体
  alternative: 惹动上帝嫉妒的偶像
  rationale: 盟约语境很可能指上帝的嫉妒，但本节希伯来文未明说主体；保留原文张力，避免把合理推论写进正文。
- issue: בְּמַרְאוֹת אֱלֹהִים中的属格关系
  choice: 上帝所赐的异象
  alternative: 上帝的异象；神圣的异象
  rationale: 语境显示异象来自上帝，这一表达在现代汉语中自然清楚；但原文属格本身仍较宽，故不作更具体的神学发挥。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“仿佛手的形状”保留异象的视觉限定；“提起”“悬在”“带到”形成流畅的动作链。末句有意重复“嫉妒”，以再现希伯来语קנא词根的双重使用，而不擅自补出嫉妒的主体。
