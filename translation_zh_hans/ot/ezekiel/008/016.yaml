  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל חֲצַ֣ר בֵּית יְהוָה֮ הַ/פְּנִימִית֒ וְ/הִנֵּה פֶ֜תַח הֵיכַ֣ל יְהוָ֗ה בֵּ֤ין הָֽ/אוּלָם֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ כְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ אֲחֹ֨רֵי/הֶ֜ם אֶל הֵיכַ֤ל יְהוָה֙ וּ/פְנֵי/הֶ֣ם קֵ֔דְמָ/ה וְ/הֵ֛מָּה מִשְׁתַּחֲוִיתֶ֥ם קֵ֖דְמָ/ה לַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/016.yaml
  text: Then he brought me into the inner court of the house of Yahweh[a], and behold, at the entrance of the temple of Yahweh, between the porch and the altar, were about twenty-five men, with their backs toward the temple of Yahweh and their faces toward the east[b]; and they were bowing down toward the east to the sun.
translation:
  language: zh_hans
  text: 随后，他领我进入雅威殿的内院。看哪，在雅威殿的门口、门廊和祭坛之间，约有二十五个人；他们背对雅威殿，面向东方，正朝东方，向太阳俯伏下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俯伏下拜”所用的希伯来语动词常指以俯伏动作表示敬拜；本句也可意译为“敬拜太阳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: 随后，他领我进入
  rationale: 叙事连续式推进异象场景；“随后”自然表达先后进程，“领我进入”准确传达使某人进入的使役含义。
- source_word: חֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: 雅威殿的内院
  rationale: חָצֵר 指院子，הַפְּנִימִית 表示内侧；“雅威殿”在现代汉语中自然表达“雅威的殿宇”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见现代汉语音译，保留其专名性质，不以称号代替。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留异象叙述中引人注意、使画面突现的指示语气。
- source_word: פֶּתַח הֵיכַל יְהוָה
  choice: 在雅威圣所门口
  rationale: פֶּתַח 是入口，הֵיכָל 在此指圣殿主体或圣所；“圣所门口”既区别于前文整个殿院，也符合场景。
- source_word: בֵּין הָאוּלָם וּבֵין הַמִּזְבֵּחַ
  choice: 就是门廊和祭坛之间
  rationale: אוּלָם 指圣殿前的门廊；“就是”自然说明门口所在的具体位置。
- source_word: כְּעֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: 约有二十五个人
  rationale: 数词前的 כְּ 表示约数；用“约有”保留近似语气。
- source_word: אֲחֹרֵיהֶם אֶל הֵיכַל יְהוָה
  choice: 他们背对雅威的圣所
  rationale: 以自然汉语准确保留他们刻意转身背向圣所的空间形象。
- source_word: וּפְנֵיהֶם קֵדְמָה
  choice: 面朝东方
  rationale: קֵדְמָה 是表示方向的“向东”；与前句“背对”构成鲜明对照。
- source_word: מִשְׁתַּחֲוִיתֶם
  choice: 俯伏下拜
  rationale: 该动词描写俯身或俯伏的敬拜动作；保留可见的身体行为，同时不淡化其宗教含义。
- source_word: קֵדְמָה לַשָּׁמֶשׁ
  choice: 朝着东方向太阳
  rationale: 原文同时说明所朝方向和下拜对象；译文保留“东方”与“太阳”两项，避免合并而损失修辞重点。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”保留原文神名作为专名的功能；不以“主”这一称号替换，也不把某一宗派性解释加入正文。
- issue: מִשְׁתַּחֲוִיתֶם 所表达的祭祀行为
  choice: 向太阳俯伏下拜
  alternative: 敬拜太阳
  rationale: 正文保留原文首先呈现的具体俯伏动作，而由其对象“太阳”清楚显示这是敬拜行为；脚注交代较概括的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留先知异象的突显语气；“雅威殿”与“雅威的圣所”分别对应较广义的殿宇和此处较具体的圣殿主体。
