  terminology: “雅威”适当保留四字神名的专名性质；“内院”“门廊”“祭坛”“俯伏下拜”均符合庄重、现代的圣经叙事语体。统一“雅威殿”可避免无根据地在“殿”与“圣所”之间制造术语层级。
