  source_fidelity: 译文总体准确传达了叙事推进、内院、约二十五人、背向殿宇、面向东方，以及向太阳下拜的动作。惟“圣所”将两处同为 הֵיכַל יְהוָה 的称谓与前文“雅威殿”区分，原文并无必须作此区分的信号；统一译为“雅威殿”较稳妥。末句原有“朝着东方向太阳”在现代汉语中句法关系不够清晰，容易读成“东方的太阳”。
