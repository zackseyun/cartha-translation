id: EZK.8.10
reference: Ezekiel 8:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וָ/אָבוֹא֮ וָֽ/אֶרְאֶה֒ וְ/הִנֵּ֨ה כָל תַּבְנִ֜ית רֶ֤מֶשׂ וּ/בְהֵמָה֙ שֶׁ֔קֶץ וְ/כָל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל מְחֻקֶּ֥ה עַל הַ/קִּ֖יר סָבִ֥יב סָבִֽיב־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/010.yaml
  text: So I went in and looked[a], and behold, every form of creeping thing and detestable beast, and all the idols of the house of Israel, were engraved on the wall all around.
translation:
  language: zh_hans
  text: 于是我进去观看，只见墙的四周刻满了各样爬行动物和可憎走兽的形像，以及以色列家的一切偶像[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”原文是带有强烈鄙夷意味的词，也可译作“粪偶像”或“污秽的偶像”。
    reason: 保留 גִּלּוּלִים 的贬斥性语气及其可能的粪污联想。
lexical_decisions:
- source_word: וָאָבוֹא וָאֶרְאֶה
  choice: 于是我进去观看
  rationale: 两个连续的叙事动词推进异象叙述；“进去观看”自然表达进入后察看的动作。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 在现代汉语中鲜明引出眼前景象，保留 הִנֵּה 的现场感，同时避免生硬的“看哪”。
- source_word: כָל תַּבְנִית
  choice: 各样……的形像
  rationale: תַּבְנִית 在此指刻在墙上的形体或图像；“形像”保留其表象性质，不把它限定为立体雕像。
- source_word: רֶמֶשׂ
  choice: 爬行动物
  rationale: 概括在地上爬行或蠕动的生物，符合此处图像目录的语境。
- source_word: בְהֵמָה שֶׁקֶץ
  choice: 可憎走兽
  rationale: 按希伯来语词序把 שֶׁקֶץ 理解为对动物形像的贬斥性限定；“走兽”比“牲畜”范围更合适，“可憎”保留礼仪和宗教上的厌恶色彩。
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  choice: 以色列家的一切偶像[a]
  rationale: “以色列家”保留先知书常见的群体称谓；正文以通顺的“偶像”表达，并在脚注说明 גִּלּוּלִים 强烈的蔑称意味。
- source_word: מְחֻקֶּה עַל־הַקִּיר
  choice: 墙……刻满了
  rationale: מְחֻקֶּה 表示刻画、雕刻在表面上；结合 כָל 与环绕全墙的描述，“刻满了”自然呈现密布墙面的景象。
- source_word: סָבִיב סָבִיב
  choice: 墙的四周
  rationale: 重复形式强调环绕各处；“四周”简洁传达完整范围。
theological_decisions:
- issue: 以西结对偶像所用词语的强烈贬斥色彩
  choice: 正文译作“偶像”，以脚注交代其蔑称意味
  alternative: 粪偶像；污秽的偶像
  rationale: גִּלּוּלִים 很可能带有与粪污相关的刻意侮蔑色彩；直译进入正文会显得突兀，脚注既保存先知的修辞力度，又维持现代汉语正文的庄重与清晰。
- issue: שֶׁקֶץ 与前文动物名称的句法关系
  choice: 译作“可憎走兽”，将其视为修饰 בְהֵמָה
  alternative: “爬行动物、走兽——可憎之物”；“爬行动物和走兽的各样可憎形像”
  rationale: 马所拉文本的连续次序容许把 שֶׁקֶץ 与 בְהֵמָה 紧密相连；此译保持这种直接读法，但不把“可憎”扩展为对全部名词的明确修饰。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“只见”传达异象揭示的现场感；“墙的四周刻满了”按汉语习惯重组句序，同时保留所有主要语义成分。
