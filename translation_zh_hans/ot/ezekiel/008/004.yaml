  text: וְ/הִ֨נֵּה שָׁ֔ם כְּב֖וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֑ל כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי בַּ/בִּקְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/004.yaml
  text: And behold[a], there was the glory of the God of Israel, like the appearance that I had seen in the valley.
translation:
  language: zh_hans
  text: 看哪，以色列的神的荣耀在那里；其显现正如我在平原[a]所看见的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谷地”。希伯来语בִּקְעָה可指宽阔的谷地或平原。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留叙事转折和指示现场的鲜明力量，传达异象突然呈现于眼前的语气。
- source_word: שָׁם
  choice: 就在那里
  rationale: 直接保留方位意义；“就”使现代汉语表达自然，也呼应“看哪”所指向的现场。
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: 这是神显现语境中的通行译法，兼顾可见的威荣与神学分量，同时不额外解释其性质。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列神
  rationale: 自然、简洁地表达原文的属格结构，并保留神与以色列之间的身份关联。
- source_word: כַּמַּרְאֶה
  choice: 样子如同
  rationale: מַרְאֶה在此指可见的样貌或显现；此译保留比较关系，不将其过早限定为“异象”。
- source_word: אֲשֶׁר רָאִיתִי
  choice: 我……所看见的
  rationale: 忠实表达先前亲眼所见，并以自然的现代汉语关系结构连接前文。
- source_word: בַּבִּקְעָה
  choice: 在平原
  rationale: בִּקְעָה可指宽阔的谷地或平原；结合以西结书3:22–23所指的开阔地点，正文采用“平原”，并以脚注保留“谷地”这一可行译法。
theological_decisions:
- issue: “以色列神的荣耀”所指的神圣显现之性质
  choice: 直接译为“以色列神的荣耀”，并以“样子”描述其可见显现
  alternative: 译作“代表神临在的可见荣光”或“神显现”
  rationale: 原文肯定神的荣耀在那里，并将其样子与先前所见相比，却没有进一步界定这种显现的机制或性质；译文因此保留其神显的力量与神学张力，不加入解释性教义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“看哪”保留先知异象的鲜明语气；整体句式简洁，适合普通现代读者，同时贴近希伯来文结构。
