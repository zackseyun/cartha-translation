  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם שָׂא נָ֥א עֵינֶ֖י/ךָ דֶּ֣רֶךְ צָפ֑וֹנָ/ה וָ/אֶשָּׂ֤א עֵינַ/י֙ דֶּ֣רֶךְ צָפ֔וֹנָ/ה וְ/הִנֵּ֤ה מִ/צָּפוֹן֙ לְ/שַׁ֣עַר הַ/מִּזְבֵּ֔חַ סֵ֛מֶל הַ/קִּנְאָ֥ה הַ/זֶּ֖ה בַּ/בִּאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/005.yaml
  text: Then he said to me[a], “Son of man, please lift up your eyes toward the north.” So I lifted up my eyes toward the north, and behold, north of the gate of the altar was this image of jealousy at the entrance.
translation:
  language: zh_hans
  text: 他对我说：“人子啊，请举目向北观看。”于是我举目向北观看。看哪，在祭坛门的北边，入口处有这忌邪之像[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这忌邪的偶像”，或“这惹动忌邪之情的像”。希伯来语短语十分紧凑，既可指这像的性质，也可指它惹动上帝忌邪之情的作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是以西结书中上帝对先知的惯常称呼；保留希伯来语惯用表达及其文学和神学呼应。
- source_word: שָׂא נָא עֵינֶיךָ
  choice: 请举目……观看
  rationale: “举目”保留原文“抬起眼睛”的形象；“请”体现 נָא 的请求或缓和语气，补出“观看”使现代汉语自然。
- source_word: דֶּרֶךְ צָפוֹנָה
  choice: 向北
  rationale: 准确表达带方向词尾的方位意义，且符合现代汉语习惯。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留指示语气和异象叙事中骤然引人注目的效果。
- source_word: מִצָּפוֹן
  choice: 在……的北边
  rationale: 此处表示相对于门的位置，而非从北方而来的移动。
- source_word: לְשַׁעַר הַמִּזְבֵּחַ
  choice: 祭坛门
  rationale: 简洁保留原文的组合关系，不把具体建筑结构解释得过细。
- source_word: סֵמֶל
  choice: 像
  rationale: 可指形像或塑像，并常带祭祀背景；“像”保留词义宽度，不在正文中先行明说“偶像”。
- source_word: הַקִּנְאָה
  choice: 忌邪之
  rationale: “忌邪”在此比一般人际意义的“嫉妒”更适合表达上帝对不忠敬拜的排他性热忱，同时保留名词性结构。
- source_word: בַּבִּאָה
  choice: 入口处
  rationale: 自然表达进入之处的空间位置。
theological_decisions:
- issue: 如何翻译 סֵמֶל הַקִּנְאָה
  choice: 正文作“这忌邪之像”
  alternative: “这忌邪的偶像”或“这惹动忌邪之情的像”
  rationale: 原文是紧凑而含混的名词组合，既可能描述该像的性质，也可能表示它引发上帝忌邪。正文保留名词结构，不把隐含作用扩写成明确关系从句；脚注列出主要理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“人子”“举目”“看哪”保留先知文学的传统语感；句法稍作调整，把“入口处”前置于存在句中，以清楚呈现空间关系。
