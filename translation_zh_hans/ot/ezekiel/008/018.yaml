  text: וְ/גַם אֲנִי֙ אֶעֱשֶׂ֣ה בְ/חֵמָ֔ה לֹֽא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל וְ/קָרְא֤וּ בְ/אָזְנַ/י֙ ק֣וֹל גָּד֔וֹל וְ/לֹ֥א אֶשְׁמַ֖ע אוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/018.yaml
  text: And I also will act in wrath; my eye will not spare[a], nor will I have compassion. Though they cry in my ears with a loud voice, I will not hear them.
translation:
  language: zh_hans
  text: 我也必在烈怒中行事；我的眼必不顾惜，我也不会怜悯。即使[a]他们在我耳边大声呼喊，我也不会听他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：他们将在我耳边大声呼喊，但我不会听他们。
    reason: 保留原文连接词在此可按让步或并列—转折关系理解的译法余地。
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: 我也
  rationale: 直接保留连接、递进和显明主语所带的强调；现代汉语用“我也”自然简洁，无须额外加入原文未明说的强转折。
- source_word: אֶעֱשֶׂה בְחֵמָה
  choice: 必在烈怒中行事
  rationale: “行事”体现 עשה 在审判语境中的行动含义，“在烈怒中”保留 חֵמָה 的强烈情感色彩，同时避免增添具体惩罚方式。
- source_word: לֹא תָחוֹס עֵינִי
  choice: 我的眼必不顾惜
  rationale: 保留“我的眼”这一拟人化意象，并以“顾惜”表达 חס 在此处不予宽免的含义。
- source_word: וְלֹא אֶחְמֹל
  choice: 我也不会怜悯
  rationale: 用“怜悯”区别于前面的“顾惜”，保留两个近义动词构成的平行与细微差别。
- source_word: וְקָרְאוּ בְאָזְנַי קוֹל גָּדוֹל
  choice: 即使他们在我耳边大声呼喊
  rationale: “大声呼喊”自然表达 קוֹל גָּדוֹל；“在我耳边”保留原文具体意象。“即使”明示上下文蕴含的让步关系。
- source_word: וְלֹא אֶשְׁמַע אוֹתָם
  choice: 我也不会听他们
  rationale: “听”直接对应 שמע，并在语境中自然包含不理会、不回应之意，而不把该含义过度解释出来。
theological_decisions:
- issue: 是否弱化上帝烈怒与拒绝怜悯的审判语言
  choice: 保留“烈怒”“我的眼必不顾惜”“不会怜悯”等直接表述
  alternative: 概括为“我要严厉惩罚他们”或“我不会宽恕他们”
  rationale: 原文以强烈、具体且拟人化的第一人称话语宣告审判；直译其力度可避免把经文抽象化或柔化。
- issue: 末句两个分句之间的逻辑关系
  choice: 以“即使……也不……”表达让步关系
  alternative: 按形式译作“他们会……但我不……”
  rationale: 希伯来语只用连接词衔接，形式上可译为并列或转折，但语境清楚呈现让步意味；中文“即使……也……”自然表达这一话语关系，不改变其命题内容。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。保留审判宣告的严肃力度和“我的眼”这一具体意象；句式适合公开诵读，同时避免古奥表达和宗派化术语。
