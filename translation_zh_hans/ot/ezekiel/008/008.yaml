  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֖ם חֲתָר נָ֣א בַ/קִּ֑יר וָ/אֶחְתֹּ֣ר בַּ/קִּ֔יר וְ/הִנֵּ֖ה פֶּ֥תַח אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/008.yaml
  text: Then he said to me[a], “Son of man, please dig into the wall.” So I dug into the wall, and behold, there was an opening.
translation:
  language: zh_hans
  text: 他对我说：“人子啊，请挖通这墙[a]。”我就挖通了墙；看哪，那里有一个洞口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凿穿这墙”。希伯来语动词可指挖掘、凿入或穿透墙壁。
    reason: 说明该动词兼有挖掘与破墙穿透的词义范围。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中一贯用于称呼先知的希伯来语表达；这里是对以西结的称呼，并不在译文中额外赋予弥赛亚称号的含义。
- source_word: חֲתָר
  choice: 挖通
  rationale: 该动词可表示挖掘、凿入或穿透；与“墙”搭配时，“挖通”既自然，也体现形成通口的语境。
- source_word: נָא
  choice: 请
  rationale: 该语气词在这里缓和并推动命令；现代汉语用“请”可自然传达这种语气，而不误解为时间副词“现在”。
- source_word: קִּיר
  choice: 墙
  rationale: 按其在建筑语境中的通常含义直译。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来叙事中突然发现事物时的提示和鲜明感。
- source_word: פֶּתַח אֶחָד
  choice: 一个洞口
  rationale: “洞口”不预设这是装有门或修整完毕的门道；“一个”对应原文 אֶחָד，同时也是自然的现代汉语不定指表达。
theological_decisions:
- issue: 称呼 בֶּן אָדָם 中 אָדָם 的译法
  choice: 人子
  alternative: 世人之子／凡人
  rationale: 原文是单数阳性称呼，也是本书反复出现的固定文学表达。“人子”忠实保留其形式和书卷内部呼应，同时不把后来的基督论含义强加于本节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留经文突现式语气；两次使用“挖通”对应原文动词的重复。
