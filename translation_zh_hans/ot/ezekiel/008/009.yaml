lexical_decisions:
- source_word: בֹּא
  choice: 进去
  rationale: 在本章异象的空间语境中，此命令是要以西结进入墙内观看；译作“进去”比单纯“来”更自然、明确。
- source_word: הַתּוֹעֵבוֹת הָרָעוֹת
  choice: 这些邪恶可憎之事
  rationale: 保留“可憎之事”的宗教与道德分量，并以“邪恶”对应形容词 הָרָעוֹת，不弱化原文的双重谴责。
- source_word: עֹשִׂים
  choice: 所行的
  rationale: 这里指人实施的行为；“所行的”庄重自然，也适合描述敬拜方面的恶行。
- source_word: פֹה
  choice: 在这里
  rationale: 直接保留地点指示，呼应异象中刚被打开的入口及其中发生的事。
theological_decisions:
- issue: “可憎之事”的性质
  choice: 保留“邪恶可憎之事”这一双重定性
  alternative: 仅译作“恶事”或“可憎之事”
  rationale: 原文同时有 תּוֹעֵבוֹת 与 הָרָעוֹת；保留二者可呈现上帝对这些隐秘敬拜行为的强烈谴责，而不额外指定某一宗派性的解释。
translation_notes:
