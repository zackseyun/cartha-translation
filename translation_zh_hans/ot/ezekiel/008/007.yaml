base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/007.yaml
  text: Then he brought me to the entrance of the court[a], and I looked, and behold[b], there was a hole in the wall.
translation:
  language: zh_hans
  text: 随后，他带我到院子[a]的入口。我看见，看哪，墙上有一个洞。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“庭院”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: 随后，他带我
  rationale: 使役词形表达“带来、领到”；“随后”自然体现希伯来叙事中的连续推进，宾语代词明确译为“我”。
- source_word: אֶל פֶּתַח
  choice: 到……的入口
  rationale: 介词表示朝向某处，不额外断定已经进入；פֶּתַח在这里自然指可供出入的入口。
- source_word: הֶחָצֵר
  choice: 院子
  rationale: חָצֵר可指院子或庭院；“院子”在现代汉语中简明自然，也适合此处的建筑空间。
- source_word: וָאֶרְאֶה
  choice: 我观看
  rationale: ראה既可指主动观看，也可指实际看见；结合后面的הִנֵּה，此处采用“观看”来呈现先注目、后发现的叙事过程，同时以脚注保留另一可能。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה引人注意、使场景骤然呈现的功能，也符合先知叙事庄重而鲜明的语气。
- source_word: חֹר אֶחָד
  choice: 一个洞
  rationale: חֹר指洞或孔；אֶחָד在此可按其字面数量表达为“一个”，也自然承担不定指功能。
- source_word: בַּקִּיר
  choice: 墙上
  rationale: 汉语通常说洞“在墙上”；这自然表达בְּ所标示的位置关系，而不改变其空间含义。
