base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/017.yaml
  text: Then he said to me[a], “Have you seen, son of man? Is it too trivial a thing for the house of Judah to do the abominations that they have done here, that they should also fill the land with violence and turn again to provoke me? And behold[b], they are putting the branch to their nose.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，你看见了吗？犹大家族在这里所行的这些可憎之事，难道还算小事吗？他们还使这地充满暴行，又惹我发怒。看哪，他们正把枝条伸到自己的鼻子前[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把枝条伸到自己的鼻子前”原文含义不明，可能是某种偶像崇拜的仪式动作。有些古代译本作“把枝条伸到我的鼻子前”；马所拉文本作“他们的鼻子”。
    reason: textual_variant_and_cultural_note
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: 你看见了吗
  rationale: 疑问词加第二人称阳性单数完成式，承接先知刚刚所见的异象，以反问语气表达。
- source_word: בֶן אָדָם
  choice: 人子啊
  rationale: 保留《以西结书》中反复出现的固定先知称谓及其文学呼应。
- source_word: הֲנָקֵל לְבֵית יְהוּדָה
  choice: 犹大家……难道还算小事吗
  rationale: נקל含轻微、不足挂齿之意；用现代汉语反问句传达责斥语气，同时保留“犹大家”这一集体称谓。
- source_word: הַתּוֹעֵבוֹת
  choice: 可憎之事
  rationale: 在偶像崇拜语境中表达强烈的宗教与道德厌恶，又比名词化的“可憎物”更自然。
- source_word: מָלְאוּ אֶת הָאָרֶץ חָמָס
  choice: 使遍地充满暴行
  rationale: חמס可指暴力、强暴与不义；“暴行”兼顾行为性和社会性，符合先知审判语境。
- source_word: וַיָּשֻׁבוּ לְהַכְעִיסֵנִי
  choice: 再次惹我发怒
  rationale: וישבו表示重复或重新转去做某事；הכעיס在以神为宾语时自然译作“惹我发怒”。
- source_word: וְהִנָּם
  choice: 看哪
  rationale: 保留指示读者注意眼前景象的郑重语气。
- source_word: שֹׁלְחִים אֶת הַזְּמוֹרָה
  choice: 把枝条伸到
  rationale: שלח在此有伸出之意；זמורה指枝条，可能是葡萄枝，但上下文不足以确定，故采用较宽泛译法。
- source_word: אֶל אַפָּם
  choice: 自己的鼻子前
  rationale: 马所拉文本为第三人称复数“他们的鼻子”；“鼻子前”较自然地表达方向关系，不解释这一晦涩动作的具体仪式意义。
theological_decisions:
- issue: 末句晦涩动作及代词读法
  choice: 按马所拉文本译为“把枝条伸到自己的鼻子前”
  alternative: 把枝条伸到我的鼻子前；将枝条伸向鼻子是一种偶像崇拜仪式
  rationale: 正文忠实保留WLC的第三人称复数后缀和动作本身，不把某种具体祭仪解释写入译文；古代见证所支持的“我的鼻子”及可能的仪式背景放入脚注，以保存文本与诠释上的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人子”“犹大家”“看哪”保留先知书的文学语体；其余句法适度现代化。脚注标记紧随相关晦涩短语，正文不擅自确定具体仪式含义。
