id: EZK.8.12
reference: Ezekiel 8:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ אֲשֶׁ֨ר זִקְנֵ֤י בֵֽית יִשְׂרָאֵל֙ עֹשִׂ֣ים בַּ/חֹ֔שֶׁךְ אִ֖ישׁ בְּ/חַדְרֵ֣י מַשְׂכִּית֑/וֹ כִּ֣י אֹמְרִ֗ים אֵ֤ין יְהוָה֙ רֹאֶ֣ה אֹתָ֔/נוּ עָזַ֥ב יְהוָ֖ה אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/012.yaml
  text: Then he said to me[a], “Have you seen, son of man, what the elders of the house of Israel are doing in the darkness, each man in the rooms of his carved image? For they are saying, ‘Yahweh does not see us[c][b]; Yahweh has abandoned the land.’”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，你看见以色列家的长老在黑暗中、各自在自己图像的内室里所做的事了吗[a]？因为他们说：‘雅威看不见我们；雅威已经离弃这地了[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自己图像的内室”也可译作“自己刻像的内室”或“自己图像的房间”。这里的希伯来词可指具象、刻绘的形象；在本段语境中，很可能与偶像崇拜有关。
    reason: lexical_alternative
  - marker: b
    text: “这地”很可能指以色列或犹大之地；相应的希伯来词也可指“大地”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: 他对我说
  rationale: 以自然的汉语叙事承接上文；希伯来语连续式在此推进异象叙事，无须机械译出“然后”。
- source_word: הֲרָאִיתָ
  choice: 你看见……吗
  rationale: 完成体配合疑问词，回指先知在异象中已经目睹的情景；汉语“看见……吗”可自然承载这一语境。
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 保留《以西结书》中反复用于先知的固定称呼及其文学呼应。
- source_word: זִקְנֵי בֵית יִשְׂרָאֵל
  choice: 以色列家的长老
  rationale: 保留完整的“以色列家”，不简化为“以色列”，以维持以西结书的重要惯用语。
- source_word: עֹשִׂים בַּחֹשֶׁךְ
  choice: 在黑暗中所做的
  rationale: 同时保留异象中的实际黑暗和暗中行事的道德含义，不在正文中单向解释为“秘密地”。
- source_word: אִישׁ בְּחַדְרֵי מַשְׂכִּיתוֹ
  choice: 他们各自在自己的雕像密室里行事
  rationale: “各自”表达 אִישׁ 的逐人分配意义；“密室”传达内室，“雕像”保留 מַשְׂכִּית 所指具象或雕刻图像的可能含义，同时以脚注注明词义范围。
- source_word: כִּי אֹמְרִים
  choice: 因为他们说
  rationale: 明确引出他们暗中行事的理由，并符合现代汉语表达。
- source_word: אֵין יְהוָה רֹאֶה אֹתָנוּ
  choice: 雅威看不见我们
  rationale: 自然表达否定分词结构所指的持续判断；“雅威”直接音译神圣四字名。
- source_word: עָזַב יְהוָה אֶת הָאָרֶץ
  choice: 雅威已经离弃这地了
  rationale: “离弃”保留 עָזַב 的强烈关系含义；“这地”在圣殿和被掳语境中很可能指以色列／犹大之地，同时脚注保留更广义的可能。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文直接音译盟约之名，避免以称号取代专名；采用现代汉语中较能对应 Yahweh 的“雅威”。
- issue: הָאָרֶץ 的范围
  choice: 这地
  alternative: 大地；世界
  rationale: 圣殿异象和被掳语境使以色列／犹大之地成为较可能的所指，但正文不增添具体地名，脚注保留词义范围。
- issue: 长老言论的性质
  choice: 作为他们自己的说法直接引述
  alternative: 改写为叙述者认可的事实陈述
  rationale: 经文是在揭示他们为隐秘恶行辩解的观念；保留引号可避免把“雅威看不见”误当作叙述者的神学断言。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“人子”“以色列家”等全书反复出现的关键表达；用“在黑暗中”维持字面场景与隐秘作恶之间的张力。所有脚注标记均置于正文对应位置。
