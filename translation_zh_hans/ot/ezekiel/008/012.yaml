  terminology: “人子”“以色列家”“雅威”“离弃这地”均合适。“图像”比“雕像”更能涵盖 מַשְׂכִּית 所可指的具象、刻绘形象，且不在正文中预断制作方式或偶像性质；脚注说明其在上下文中很可能涉及偶像崇拜。
