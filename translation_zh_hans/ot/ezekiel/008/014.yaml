  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל פֶּ֨תַח֙ שַׁ֣עַר בֵּית יְהוָ֔ה אֲשֶׁ֖ר אֶל הַ/צָּפ֑וֹנָ/ה וְ/הִנֵּה שָׁם֙ הַ/נָּשִׁ֣ים יֹֽשְׁב֔וֹת מְבַכּ֖וֹת אֶת הַ/תַּמּֽוּז־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/014.yaml
  text: Then he brought me to the entrance of the gate of the house of Yahweh that faces north[a], and behold, there the women were sitting[b], weeping for Tammuz.
translation:
  language: zh_hans
  text: 随后，他带我来到雅威殿朝北的门口。看哪，那里那些妇女坐着，为搭模斯[a]哀哭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 搭模斯是美索不达米亚的一位神祇，与季节性的哀悼仪式有关；这里的妇女正在参加为他举行的哀哭。原文动词字面意思是“哭泣”，也可译作“哀悼”。
    reason: 文化背景及词义说明
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: 随后，他带我来到
  rationale: 保留使役动词“带来”的意义，并以“随后”自然承接异象叙事。
- source_word: פֶּתַח שַׁעַר
  choice: 门口
  rationale: 原文直指“门的入口”；现代汉语用“门口”简洁自然，也保留建筑位置。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: “殿”在此清楚指圣殿，并保留雅威这一神圣名字，避免生硬的“雅威之家”。
- source_word: אֲשֶׁר אֶל הַצָּפוֹנָה
  choice: 朝北的
  rationale: 自然表达该门入口的方位，同时不把原文进一步限定为“北边的门”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意的异象叙述标记及庄重语气。
- source_word: הַנָּשִׁים יֹשְׁבוֹת
  choice: 有些妇女坐着
  rationale: “坐着”体现分词所呈现的持续场景；汉语以“有些妇女”自然引入眼前可见的一群妇女。
- source_word: מְבַכּוֹת אֶת הַתַּמּוּז
  choice: 为搭模斯哀哭
  rationale: בכה的核心义是哭泣；“哀哭”既保留实际哭泣，也符合此处的哀悼语境。专名按传统汉语圣经形式音译为“搭模斯”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；音译“雅威”直接保留其专名性质，不以称号替代。
- issue: תַּמּוּז 的身份是否在正文中明说
  choice: 仅音译为“搭模斯”
  alternative: “搭模斯神”
  rationale: 原文只有带冠词的专名，没有“神”这一名词；文化身份留在脚注说明，避免正文增译。
- issue: מְבַכּוֹת 的礼仪含义
  choice: 哀哭
  alternative: 哀悼
  rationale: 原词字面表示哭泣，而上下文又涉及为搭模斯举行的哀悼活动；“哀哭”兼顾字面动作与礼仪语境，不将两者强行取舍。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“看哪”保留先知异象的鲜明语气；全句分为两句，以免建筑方位与所见场景挤在一个过长句中。
