  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שִּׁשִּׁ֗ית בַּ/שִּׁשִּׁי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ אֲנִי֙ יוֹשֵׁ֣ב בְּ/בֵיתִ֔/י וְ/זִקְנֵ֥י יְהוּדָ֖ה יוֹשְׁבִ֣ים לְ/פָנָ֑/י וַ/תִּפֹּ֤ל עָלַ/י֙ שָׁ֔ם יַ֖ד אֲדֹנָ֥/י יְהֹוִֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/001.yaml
  text: And it happened in the sixth year[a], in the sixth month, on the fifth day of the month, as I was sitting in my house and the elders of Judah were sitting before me[b], that the hand of the Lord GOD fell upon me there.
translation:
  language: zh_hans
  text: 第六年六月初五，我坐在家中，犹大的长老坐在我面前；在那里，主耶和华[b]的手降在我身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “主耶和华”：希伯来语为 אֲדֹנָי יְהוִה，由称号“主”和神名组成；神名也常拟音为“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: （以日期句式自然引出事件）
  rationale: 这是叙事性的 wayyiqtol，用来引入新场景。汉语直接以日期开篇，比硬译为“事情发生了”更自然，同时保留其叙事功能。
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: 第六年
  rationale: 原文没有明说从哪一事件起算，因此不在正文中补入“被掳后”等解释。
- source_word: בַּשִּׁשִּׁי בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: 六月初五
  rationale: 准确而自然地表达“第六个月、当月第五日”的希伯来日期格式。
- source_word: אֲנִי יוֹשֵׁב בְּבֵיתִי
  choice: 我坐在家中
  rationale: 分词结构描写持续的背景情形；现代汉语无需另加进行体标记也能自然表达。
- source_word: וְזִקְנֵי יְהוּדָה
  choice: 犹大的长老
  rationale: זִקְנֵי 指群体中受认可的长老或领袖；“犹大的长老”直接保留所属关系。
- source_word: יוֹשְׁבִים לְפָנָי
  choice: 坐在我面前
  rationale: 保留 לְפָנַי 的空间及会见语境，不将其解释性改写为“来求问我”等。
- source_word: וַתִּפֹּל עָלַי
  choice: 降在我身上
  rationale: נפל עַל 字面为“落在……之上”；“降在我身上”既保留原文鲜明意象，也符合现代汉语中描述神圣能力临到的庄重表达。
- source_word: שָׁם
  choice: 在那里
  rationale: שָׁם 通常是地点副词“那里”，不将其平滑处理为时间副词“那时”。
- source_word: יַד
  choice: 手
  rationale: 保留先知文献中“耶和华的手”这一具体而重要的惯用意象，不直接释义为“能力”。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别呈现 אֲדֹנָי 的称号“主”和神名 יהוה 的传统汉语译名“耶和华”，避免把二者合并而丢失结构。
theological_decisions:
- issue: 复合称谓 אֲדֹנָי יְהוִה 中神名 יהוה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时包含“主”这一称号与四字神名。正文采用汉语圣经传统中广为人知的“耶和华”，脚注注明可按拟音译作“雅威”，既不隐去神名，也不把某一拟音方案绝对化。
- issue: “耶和华的手”所表达的神圣行动
  choice: 保留“手”的意象
  alternative: 释为“耶和华的能力”或“耶和华的灵”
  rationale: 原文明确使用 יַד“手”；其具体所指包含神强有力的临在或支配，但本节没有将其等同于“灵”，故不在翻译中消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。日期按自然汉语压缩为“第六年六月初五”；不补明纪年起点。以“坐在我面前”“手……降在我身上”保留先知叙事的具体意象，并用脚注说明地点副词和复合神名。
