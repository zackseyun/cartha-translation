revisions:
- from: 他对我说：“人子啊，你看见他们所做的事吗？以色列家在这里行这些极其可憎的事，要使我远离我的圣所[a]。然而，你还会看见更为可憎的事[b]。”
  to: 他对我说：“人子啊，以色列家在这里所行的这些极其可憎的事，使我远离我的圣所；你看见了吗？你还会看见更为可憎的事。”
  rationale: 修订把问句置于原文相应的位置，使“以色列家所行的可憎之事”及其与圣所相关的后果／目的都明确成为以西结所看见的内容。保留“使我远离我的圣所”这一主要理解，但以脚注准确呈现简略结构的替代可能，避免无根据地增添泛指的“人”。末句维持语境性的递进译法，并保留说明性脚注。
