source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/רֹאֶ֥ה אַתָּ֖ה מ/הם עֹשִׂ֑ים תּוֹעֵב֨וֹת גְּדֹל֜וֹת אֲשֶׁ֥ר בֵּֽית יִשְׂרָאֵ֣ל עֹשִׂ֣ים פֹּ֗ה לְ/רָֽחֳקָה֙ מֵ/עַ֣ל מִקְדָּשִׁ֔/י וְ/עוֹד֙ תָּשׁ֣וּב תִּרְאֶ֔ה תּוֹעֵב֖וֹת גְּדֹלֽוֹת־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/006.yaml
  text: And he said to me[a], “Son of man, do you see what they are doing, the great abominations that the house of Israel is doing here[b], to drive me far from my sanctuary? Yet you will see even greater abominations.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，以色列家在这里所行的这些极其可憎的事，使我远离我的圣所；你看见了吗？你还会看见更为可憎的事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的先知称呼，也贴近希伯来语字面形式；不在正文中改释为“凡人”。
- source_word: הֲרֹאֶה אַתָּה
  choice: 你看见……吗
  rationale: 以现代汉语的直接问句表达疑问词与分词所构成的当下询问。
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: 极其可憎的事
  rationale: תּוֹעֵבָה 在此指宗教和道德上令人憎恶之事；“极其可憎的事”既保留强烈语气，又比名词化的“可憎之物”更自然。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知话语中的集体性盟约称谓，同时是现代中文圣经语体中可理解的表达。
- source_word: לְרָחֳקָה מֵעַל מִקְדָּשִׁי
  choice: 要使我远离我的圣所
  rationale: 按上下文把未明说的受影响者理解为说话的上帝，表达这些行为导致他离开圣所；鉴于希伯来语结构简略，另在脚注保留其他可能。
- source_word: מִקְדָּשִׁי
  choice: 我的圣所
  rationale: “圣所”准确对应 מִקְדָּשׁ，也避免用较窄的“圣殿”预先限定含义。
- source_word: וְעוֹד תָּשׁוּב תִּרְאֶה
  choice: 然而，你还会看见
  rationale: 自然表达异象继续展开的语篇功能；“还会”传达 עוֹד 与 תָּשׁוּב 的继续、再次之意。
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: 更为可憎的事
  rationale: 希伯来语重复前面的短语，但上下文引向逐步加重的异象；正文用比较式体现推进，脚注说明字面重复。
theological_decisions:
- issue: לְרָחֳקָה מֵעַל מִקְדָּשִׁי 所指的是上帝远离圣所，还是人远离圣所
  choice: 这些可憎之事使上帝远离自己的圣所
  alternative: 他们自己远离圣所；或这些事发生在远离圣所之处
  rationale: 第一人称“我的圣所”以及以西结书随后关于上帝荣耀离开的叙事，支持以上帝为隐含对象；但原句结构简略，因此不把其他语法可能完全隐藏起来。
- issue: 末尾重复的 תּוֹעֵבוֹת גְּדֹלוֹת 是否应译成比较级
  choice: 正文译作“更为可憎的事”
  alternative: 按字面重复为“极其可憎的事”
  rationale: 原文虽重复相同短语，前面的“还会看见”以及本章异象逐层推进的结构形成程度升级；比较式是语境性表达，不意味着希伯来语形态本身是比较级。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人子”“以色列家”“圣所”保留以西结书的先知性语汇；句法则避免过度文言化。问句在“圣所”处结束，使整段可憎行为都处于“你看见……吗”的范围内。
