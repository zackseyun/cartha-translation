source:
  edition: WLC
  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה דְמוּת֙ כְּ/מַרְאֵה אֵ֔שׁ מִ/מַּרְאֵ֥ה מָתְנָ֛י/ו וּ/לְ/מַ֖טָּה אֵ֑שׁ וּ/מִ/מָּתְנָ֣י/ו וּ/לְ/מַ֔עְלָ/ה כְּ/מַרְאֵה זֹ֖הַר כְּ/עֵ֥ין הַ/חַשְׁמַֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/002.yaml
  text: 'Then I looked[a], and behold, a form with the appearance of fire: from what appeared to be his waist and downward, fire; and from his waist and upward, like the appearance of brightness, like gleaming amber.'
translation:
  language: zh_hans
  text: 我观看，看哪，有一个形体，外观仿佛是火：从他看似腰部的地方以下，是火；从他的腰部以上，外观仿佛有光辉，像闪耀的琥珀[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“像琥珀金的光泽”或“像灼亮的金属”；此处的希伯来词罕见，似指一种明亮闪耀的物质。
    reason: 说明罕见词חַשְׁמַל的词义不确定，并保留“琥珀金／发光金属”等主要译法。
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: 我观看
  rationale: 叙事中的连续式推动异象进程；用“我观看”自然地保留先知第一人称的视觉见证。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留指示性和异象突然呈现的效果；语体庄重而仍为现代读者所理解。
- source_word: דְמוּת
  choice: 一个形像
  rationale: 表示异象中所见的轮廓或相似形态，而非对其本体作明确认定；“形像”也与后续反复出现的比拟语相协调。
- source_word: כְּמַרְאֵה אֵשׁ
  choice: 外观仿佛是火
  rationale: 同时体现介词כ的比拟意义和מַרְאֶה的“外观”含义，避免直接断言该形像就是火。
- source_word: מִמַּרְאֵה מָתְנָיו
  choice: 从看似他的腰部之处
  rationale: 原文表达简略且较难，译文保留“看似”的视觉限定，并以现代常用的“腰部”表达身体部位。
- source_word: וּלְמַטָּה
  choice: 往下
  rationale: 简洁表达以腰部为界的向下方位。
- source_word: אֵשׁ
  choice: 是火
  rationale: 按其基本词义翻译，并保留原文无动词短句的鲜明、凝练效果。
- source_word: וּמִמָּתְנָיו וּלְמַעְלָה
  choice: 从他的腰部往上
  rationale: 保留与前半句相对应的空间结构，同时采用现代汉语自然说法。
- source_word: כְּמַרְאֵה זֹהַר
  choice: 外观仿佛有光辉
  rationale: זֹהַר指明亮、光辉；译文保留“外观”和“仿佛”所表达的异象性比拟。
- source_word: כְּעֵין הַחַשְׁמַלָה
  choice: 像闪耀的琥珀
  rationale: חַשְׁמַל是罕见词，似指一种明亮发光的物质，常被理解为琥珀或琥珀金；正文采用易懂且能传达光泽的传统译法，其他可能性列入脚注。
theological_decisions:
- issue: 异象中形像的描述
  choice: 反复使用“外观”“仿佛”“看似”等限定语，不把所见直接等同于火或某种金属
  alternative: 直接译成该形像本身就是火，或明确认定其材质为某一种发光金属
  rationale: 以西结用דְמוּת、מַרְאֶה、כ等词谨慎描述所见。保留这些相似和外观用语，既忠于原文，也不越过先知对异象本体所保持的含蓄。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“看哪”保留先知异象叙述的突现感；句中的冒号和分号呈现上下两部分的平行结构。避免古旧的“腰间／腰肢”等措辞，也不把比拟性的异象语言改写为直接的本体判断。
