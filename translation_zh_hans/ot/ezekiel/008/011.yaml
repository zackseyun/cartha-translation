  text: וְ/שִׁבְעִ֣ים אִ֣ישׁ מִ/זִּקְנֵ֣י בֵֽית יִ֠שְׂרָאֵל וְ/יַאֲזַנְיָ֨הוּ בֶן שָׁפָ֜ן עֹמֵ֤ד בְּ/תוֹכָ/ם֙ עֹמְדִ֣ים לִ/פְנֵי/הֶ֔ם וְ/אִ֥ישׁ מִקְטַרְתּ֖/וֹ בְּ/יָד֑/וֹ וַ/עֲתַ֥ר עֲנַֽן הַ/קְּטֹ֖רֶת עֹלֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/011.yaml
  text: And seventy men from the elders of the house of Israel[a], with Jaazaniah the son of Shaphan standing among them, were standing before them, each man with his censer in his hand[d][c][b]; and the thick cloud of incense was going up.
translation:
  language: zh_hans
  text: 以色列家长老中的七十人，沙番的儿子雅撒尼亚也在他们中间，正站在它们面前[a]；各人手中拿着自己的香炉[b]，浓密的香云正在上升[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它们”按上文语境，指那间屋内墙上所描绘的像（见10节）。
    reason: cross_reference
  - marker: b
    text: “香炉”也可译作“焚香器”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“浓密的香云冉冉升起。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים אִישׁ מִזִּקְנֵי בֵית יִשְׂרָאֵל
  choice: 以色列家的长老中有七十人
  rationale: 保留מִן所表达的“从……中”之意，也保留“以色列家”这一原文称谓；“七十人”自然表达所数的男性长老群体。
- source_word: יַאֲזַנְיָהוּ בֶן שָׁפָן
  choice: 沙番的儿子雅撒尼亚
  rationale: 按现代中文圣经人名音译习惯处理，并直接保留父子关系。
- source_word: עֹמֵד בְּתוֹכָם
  choice: 站在他们中间
  rationale: 准确传达בְּתוֹךְ的群体内部或当中之空间含义。
- source_word: עֹמְדִים לִפְנֵיהֶם
  choice: 站在那些像前
  rationale: 分词呈现异象中持续可见的姿态；依据上节语境，复数代词指墙上描画的众像，但用“那些像”而不进一步限定其种类。
- source_word: מִקְטַרְתּוֹ
  choice: 香炉
  rationale: 指焚香器具；“香炉”是现代中文中简洁、通行且庄重的对应词。
- source_word: וַעֲתַר עֲנַן הַקְּטֹרֶת
  choice: 浓密的香云
  rationale: עֲתַר在此表达丰厚、稠密，译作“浓密”可自然传达香烟聚成厚云的视觉效果。
- source_word: עֹלֶה
  choice: 不断上升
  rationale: 分词表达异象中正在持续的动作；“不断上升”保留烟云向上的动态。
theological_decisions:
- issue: לִפְנֵיהֶם（“在他们面前”）的指代对象
  choice: 正文译作“站在那些像前”，将复数代词按上文理解为墙上描画的众像
  alternative: 保留较字面的“站在它们面前”，不在正文明确先行词
  rationale: 原文是复数后缀，最自然地承接第10节的多种画像。中文若单写“他们面前”容易误解为长老彼此站立，因此以“那些像”澄清语篇指代，同时不具体断定为哪一类像。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以分号区分七十位长老的整体姿态与雅撒尼亚的群中位置，再用短句呈现各人焚香及香云上升的异象画面。所有脚注标记均置于正文相应位置。
