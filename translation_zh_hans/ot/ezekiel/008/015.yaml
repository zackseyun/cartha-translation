  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם ע֣וֹד תָּשׁ֥וּב תִּרְאֶ֛ה תּוֹעֵב֥וֹת גְּדֹל֖וֹת מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/015.yaml
  text: Then he said to me, “Have you seen this, son of man? You will see again still greater abominations than these.”
translation:
  language: zh_hans
  text: 他对我说：“人子啊，你看见了吗？你还要再看见比这些更大的可憎之事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子啊
  rationale: 保留以西结书中上帝对先知的惯常称呼；加“啊”自然表达希伯来语直接呼语。
- source_word: עוֹד תָּשׁוּב תִּרְאֶה
  choice: 你还要再看见
  rationale: 兼顾 עוֹד 的“还”与 שׁוב 的重复意味，以自然汉语保留强调。
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: 更大的可憎之事
  rationale: תּוֹעֵבוֹת 指令人憎恶、尤其在宗教礼仪上冒犯上帝的行为；“可憎之事”保留其严肃而宽泛的含义，גְּדֹלוֹת 依比较语境译作“更大的”。
- source_word: מֵאֵלֶּה
  choice: 比这些
  rationale: 按 מן 的比较用法直译，所指承接先前所见的可憎行为。
theological_decisions:
- issue: “可憎之事”的具体性质
  choice: 采用宽泛的“可憎之事”
  alternative: 译作“更严重的偶像崇拜”或“更大的恶事”
  rationale: 原文虽处于圣殿异象和偶像崇拜语境中，但本节用词本身较宽泛；不将其收窄为某一种行为，也不削弱其礼仪和神学色彩。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。句序贴近原文，同时将希伯来语的重复结构处理为自然汉语“还要再看见”。无脚注。
