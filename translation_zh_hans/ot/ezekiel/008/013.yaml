  yaml_path: translation/ot/ezekiel/008/013.yaml
  text: Then he said to me, “You will again see greater abominations that they are doing.”
translation:
  language: zh_hans
  text: 他对我说：“你还会再看见他们所行的更大的可憎之事。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד תָּשׁוּב תִּרְאֶה
  choice: 你还会看见
  rationale: 希伯来语字面近于“你还要再转而看见”；此处“还会看见”自然表达后续异象将继续显明，并避免生硬重复“再……又”。
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: 更大的可憎之事
  rationale: גְּדֹלוֹת 形式本身是“大”，但在递进语境中带比较意味；译作“更大的”保留本节相对于先前所见之事的升级。תּוֹעֵבוֹת 指令人厌恶、尤其在宗教和道德上可憎的行为或事物，故译“可憎之事”。
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: 他们所行的
  rationale: 采用关系从句修饰“可憎之事”，准确保留行为主体“他们”和持续性分词“正在行”的语义，同时符合现代汉语表达。
theological_decisions:
- issue: “大”是否应按上下文译为比较级
  choice: 更大的
  alternative: 大的
  rationale: 希伯来语虽未使用独立的比较结构，但本章反复出现“还会看见”并逐层揭露罪恶，语境支持比较性递进；如此翻译不额外界定这些罪行的具体等级或性质。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；“可憎之事”延续先知文学的审判语域，并保持原文未具体说明行为内容的概括性。
