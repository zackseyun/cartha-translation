  text: All around shall be eighteen thousand[a], and the name of the city from that day on shall be, Yahweh Is There.
translation:
  language: zh_hans
  text: 城的周长共一万八千[a]。从那日起，城的名字要叫“雅威在那里”。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在本句没有重述计量单位，须参照上下文理解。
    reason: 说明原文在数字后省略单位，同时避免将单位断定为“肘”。
lexical_decisions:
- source_word: סָבִיב
  choice: 城的周长共
  rationale: 此处概括环城四边的总长度；结合上文四边各四千五百的尺寸，用“城的周长共”自然、准确地表达空间和合计意义。
- source_word: שְׁמֹנָה עָשָׂר אָלֶף
  choice: 一万八千
  rationale: 希伯来文只列数字，未在本句重述单位，因此正文保留其简洁，不补入“肘”。
- source_word: וְשֵׁם הָעִיר
  choice: 城的名字要叫
  rationale: 以现代汉语自然表达命名公式，同时保留庄重语气。
- source_word: מִיּוֹם
  choice: 从那日起
  rationale: 表达名字自该日起持续适用的起始意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号代替专名。
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 该处副词在象征性城名中作表语，与神名合成“雅威在那里”。
theological_decisions:
- issue: 城名中四字神名 יְהוָה 的译法
  choice: 雅威在那里
  alternative: 耶和华在那里
  rationale: 原文直接使用四字神名；正文以“雅威”音译专名，并保留 שָׁמָּה 所形成的陈述性名称，不将其改写为神学解释。
translation_notes:
  register: 采用现代、庄重而清楚的叙述。“城的周长共”承接上文四边尺寸；象征性城名加引号。正文中的[a]与脚注严格对应。
