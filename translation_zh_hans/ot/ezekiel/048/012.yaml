  text: וְ/הָיְתָ֨ה לָ/הֶ֧ם תְּרוּמִיָּ֛ה מִ/תְּרוּמַ֥ת הָ/אָ֖רֶץ קֹ֣דֶשׁ קָדָשִׁ֑ים אֶל גְּב֖וּל הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/012.yaml
  text: And it shall be for them a special allotment from the contribution of the land[a], most holy[c][b], beside the territory of the Levites.
translation:
  language: zh_hans
  text: 这要归给他们，作为从土地中分别献出的份额所划出的一份[a]，至为圣洁[b]，紧邻利未人的地界[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “划出的一份”或译“分别献上的一份”；原词指为神圣用途献上、分别出来的份额，在这里指土地的一部分。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“圣中之圣”，是表示最高级的说法；这里形容这份土地至为神圣。
    reason: lexical_alternative
  - marker: c
    text: “利未人的地界”也可理解为“利未人的地域”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם
  choice: 这要归给他们
  rationale: 在本段分地语境中，连词加完成式表达将来的安排；לָהֶם表示归属。译文兼顾将来意义与自然汉语。
- source_word: תְּרוּמִיָּה
  choice: 划出的一份
  rationale: 该词与献上、分别出来的供物有关，但在以西结书45—48章特指划定的土地份额；此译突出土地分配，同时避免误解为一般祭物。
- source_word: מִתְּרוּמַת הָאָרֶץ
  choice: 从全地所献之地中
  rationale: 保留תְּרוּמָה作为献上并分别出来之份的宗教色彩；结合上下文，将其明确为从全地划献出来的土地。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 这是希伯来语的最高级表达，直指该土地份额的神圣程度；不补入原文没有的“地方”，也不将其技术化为圣所中的“至圣所”。
- source_word: אֶל גְּבוּל הַלְוִיִּם
  choice: 挨着利未人的地界
  rationale: אֶל在疆界描述中表示邻接；גְּבוּל可指边界或由边界界定的地域。正文保留较贴近字面的“地界”，并在脚注说明另一理解。
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים是否译作圣所术语“至圣所”
  choice: 至圣的
  alternative: 至圣所／最神圣的地方
  rationale: 这里所修饰的是划出的土地份额，而非明确指会幕或圣殿内室；采用谓语性形容表达，既保留最高级圣洁，也不额外限定所指。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“所献之地”保留本段土地奉献的宗教语义，“划出的一份”说明实际分地功能。脚注标记均置于其所解释的词语之后。
