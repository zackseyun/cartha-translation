source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל יִשָׂשכָ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה זְבוּלֻ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/026.yaml
  text: And along the border of Issachar[a], from the east side to the west side, Zebulun[b], one portion.
translation:
  language: zh_hans
  text: 沿着以萨迦的边界，从东边直到西边，是西布伦的一份地[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西边”原文直译为“海边”；希伯来语常以海所在的方向表示西方。
    reason: cultural_note
  - marker: b
    text: 原文直译为“西布伦，一份”；“地”是按照本章反复出现的分地格式补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 沿着
  rationale: 连词与介词在此承接前文，继续列举相邻的支派地业；“沿着”自然地表达贴邻边界的空间关系。
- source_word: גְּבוּל
  choice: 边界
  rationale: 此处指以萨迦地业的界线；“边界”比“领土”更准确，也符合现代汉语地理表述。
- source_word: יִשָׂשכָר
  choice: 以萨迦
  rationale: 采用现代中文圣经读者熟悉的支派名称译法。
- source_word: מִפְּאַת קָדִימָה
  choice: 从东边
  rationale: פֵּאָה表示边、侧，קָדִימָה指东方；合译为“从东边”，清楚而自然。
- source_word: עַד פְּאַת יָמָּה
  choice: 直到西边
  rationale: עַד标明范围终点；יָם字面为“海”，在希伯来地理方位用语中指西方，故译作“西边”。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 采用现代中文圣经读者熟悉的支派名称译法。
- source_word: אֶחָד
  choice: 一份地
  rationale: 原文仅为“一个／一份”；依本章反复出现的土地分配格式，补出“地”，使汉语完整，同时用脚注说明补词。
