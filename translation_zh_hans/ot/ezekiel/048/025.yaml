  text: וְ/עַ֣ל גְּב֣וּל שִׁמְע֗וֹן מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה יִשָׂשכָ֥ר אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/025.yaml
  text: And along the border of Simeon[a], from the east side to the west side, Issachar, one portion.
translation:
  language: zh_hans
  text: 沿着西缅的边界，从东边到西边，是以萨迦的一份地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַל גְּבוּל
  choice: 沿着……的边界
  rationale: 这里的介词短语承接上一条土地，表示下一条地带毗邻西缅的边界；“沿着……的边界”既保留疆界含义，也符合现代汉语表达。
- source_word: שִׁמְעוֹן
  choice: 西缅
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: מִ/פְּאַת קָדִימָ/ה עַד פְּאַת יָמָּ/ה
  choice: 从东边到西边
  rationale: פְּאַת 表示边、侧；קָדִימָה 指东方，יָמָּה 字面与“海”有关，但在希伯来地理用语中通常指西方。此处用对称、自然的方位表达。
- source_word: יִשָׂשכָר
  choice: 以萨迦
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: אֶחָד
  choice: 一份地
  rationale: 原文仅作“一”，是本章土地分配格式中的省略说法；按直接语境补出“份地”，使现代读者清楚这是一个支派的单份地带。
