  yaml_path: translation/ot/ezekiel/048/006.yaml
  text: And along the border of Ephraim[a], from the east side to the west side, Reuben[b], one portion.
translation:
  language: zh_hans
  text: 沿着以法莲的边界，从东边到西边[a]，归流便一份地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“直到海的一边”；希伯来语常以“海”指西方。
    reason: cultural_note
  - marker: b
    text: 原文直译为“流便，一”。本章以“一”简略表示一个支派所得的一份土地，因此正文补出“份地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 沿着
  rationale: 在本章划分各支派土地的语境中，עַל表示某片土地位于或贴着一道边界；“沿着”自然地保留了这种空间关系，句首连接词则按现代汉语行文不另译。
- source_word: גְּבוּל
  choice: 边界
  rationale: 此词在土地分配语境中指划定地域的界线；“边界”准确且符合现代汉语用法。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用中文圣经传统中通行的支派名称译法。
- source_word: מִפְּאַת קָדִים
  choice: 从东边
  rationale: פֵּאָה表示一侧、边缘，קָדִים在这里表示东方；“从东边”清楚保留本章反复出现的地理格式。
- source_word: וְעַד פְּאַת יָמָּה
  choice: 直到西边
  rationale: 原文直译为“直到海的一边”；יָם在希伯来方位表达中常引申为西方。本处主要表达东西向的范围，因此译作“直到西边”，并以脚注说明其字面意象。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用中文圣经传统中通行的支派名称译法。
- source_word: אֶחָד
  choice: 一份地
  rationale: 原文仅作“一”，在本章土地分配清单中省略了所计数的对象，意指一个支派所得的一份土地。补出“份地”使现代汉语意思完整，同时用脚注交代原文的简略表达。
