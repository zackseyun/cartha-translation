  yaml_path: translation/ot/ezekiel/048/017.yaml
  text: And the city's open land shall be two hundred fifty cubits to the north[a], two hundred fifty to the south, two hundred fifty to the east[b], and two hundred fifty to the west.
translation:
  language: zh_hans
  text: 城的空地要有如下尺寸：北面二百五十肘，南面二百五十肘，东面二百五十肘，西面二百五十肘。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “空地”也可译作“牧场地”或“公用地”。希伯来文在四个方向都按“五十和二百”的次序记数，即“二百五十”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 要有
  rationale: 该形式在异象中的连续描述里带有将来和规定性语气；“要有”自然地表达规划安排。
- source_word: מִגְרָשׁ
  choice: 空地
  rationale: 指划给城邑周围使用的未建造土地；“空地”避免现代汉语“郊区”所暗示的城市建成区，同时保留其可作牧场或公用地的语义范围。
- source_word: לָעִיר
  choice: 城的四周
  rationale: 介词表示这片地归属或供城使用；结合四个方向的量度，译为“城的四周”使空间关系清楚，但不改变其归城使用的含义。
- source_word: צָפוֹנָה / וְנֶגְבָּה / וְקָדִימָה / וְיָמָּה
  choice: 北面／南面／东面／西面
  rationale: 四词在此构成方位序列；用现代汉语常见的四方表达简明自然。其中 יָמָּה 字面为“向海”，在以色列地理方位中指西面。
- source_word: חֲמִשִּׁים וּמָאתַיִם
  choice: 二百五十肘
  rationale: 希伯来文逐字为“五十和二百”，按现代汉语正常数序译作“二百五十”；量度单位承接上下文，明译“肘”以便本节独立阅读。
