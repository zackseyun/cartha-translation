  text: And along the border of Naphtali[a], from the east side to the west side, Manasseh, one portion.
translation:
  language: zh_hans
  text: 挨着拿弗他利的边界，从东边直到西边，是玛拿西的一份[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“玛拿西，一”。本章反复使用这种省略式的分地表达，因此正文补出“份”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: 挨着……的边界
  rationale: 这里的连词与介词短语承接前一地带，说明下一块地位于拿弗他利边界旁；“挨着……的边界”自然地保留了空间关系。
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  choice: 从东边直到西边
  rationale: 准确表达这块地横贯东西的范围，同时保留原文“边、侧”的地理表述。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: אֶחָד
  choice: 一份
  rationale: 原文仅作“一”，是本章反复使用的省略式分地公式；补出“份”使现代汉语完整通顺，却不增加新的实质内容。
