source:
  edition: WLC
  text: וְ/לֹא יִמְכְּר֣וּ מִמֶּ֗/נּוּ וְ/לֹ֥א יָמֵ֛ר וְ/לֹ֥א יעבור רֵאשִׁ֣ית הָ/אָ֑רֶץ כִּי קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/014.yaml
  text: They must not sell any of it[a], nor exchange it, nor shall this choice portion of the land pass over to another, for it is holy to Yahweh.
translation:
  language: zh_hans
  text: 他们不可卖掉其中任何一部分，也不可拿它交换；土地的首份[a]也不可转让给别人，因为它是归雅威为圣的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地最先的一份”，也可理解为“土地的初熟之物”。希伯来语可着重指最先、首要的一份，也可能带有像初熟之物那样献为圣的意味。
    reason: 原文 רֵאשִׁית הָאָרֶץ 在“首份、首要部分”和“初熟之物”之间具有词义张力；本节所论为分别出来的土地，正文不宜将其限定为农作物，也不宜明确化为质量上的“上好”。
lexical_decisions:
- source_word: יִמְכְּרוּ מִמֶּנּוּ
  choice: 卖掉其中任何一部分
  rationale: מכר 表示“卖”，ממנו 回指前文划出的圣地；合译为自然的现代汉语，同时保留不得出售其中任何部分的法律含义。
- source_word: יָמֵר
  choice: 拿它交换
  rationale: מור 在此指交换或以别物替代；土地与圣物法规语境中，“拿它交换”清楚表达禁止置换。
- source_word: יעבור
  choice: 转让给别人
  rationale: עבר 的基本意象是“经过、转移”；在产业语境中指所有权转移。“给别人”虽非单独明说，却将汉语中“转让”所隐含的对象关系自然表达出来。
- source_word: רֵאשִׁית הָאָרֶץ
  choice: 这上好的一份土地
  rationale: רֵאשִׁית 可指最先的一份、首要的一份或初熟之物。此处谈论分别出来的土地，“上好的一份”既符合地产语境，也不把含义限死为农作物的“初熟果子”；脚注保留其他可能。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 归雅威为圣
  rationale: קֹדֶשׁ 表明这地被分别为圣，ל 表示归属或奉献；“归雅威为圣”兼顾二者。יהוה 按项目原则音译为“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”以呈现其专名性质，而不以称号替代。
- issue: רֵאשִׁית הָאָרֶץ 是否专指“初熟之物”
  choice: 这上好的一份土地
  alternative: 土地的初熟之物；土地最先的一份
  rationale: 上下文是圣区土地的出售、交换和转让，并非收成条例；正文采用符合地产语境而仍能承载“首要、上好”之意的译法，脚注保留原词的多义性。
translation_notes:
  register: 采用现代、庄重而易懂的法规语体。“不可……也不可……”保留原文连续禁令的力度；分号划分前两项行为禁令与对该圣地不可转让的概括。
