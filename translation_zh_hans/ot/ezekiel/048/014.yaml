  terminology: “雅威”一致呈现 יהוה。“为圣”恰当表达 קֹדֶשׁ，而“归”反映 לְ 的归属、奉献关系。脚注须保留 רֵאשִׁית הָאָרֶץ 可指首份、首要部分并可能含有类似初熟之物的献圣色彩这一未决张力。
