  text: 'Along the border of Benjamin[a], from the east side to the west side, Simeon: one portion.'
translation:
  language: zh_hans
  text: 挨着便雅悯的边界，从东边直到西边，是西缅的一份。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“西缅，一个”；“份”是根据本章反复出现的分地格式补出的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: 挨着
  rationale: 本短语承接上一段，说明下一支派所得地带与便雅悯边界相邻；“挨着”既自然，又保留空间关系。句首连接词 וְ 融入上下文的连续列举中，不另译为“并且”。
- source_word: גְּבוּל
  choice: 边界
  rationale: 在土地分配语境中指划分支派地带的界线，而非整个领地。
- source_word: בִּנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经传统中通行的支派名称。
- source_word: מִפְּאַת קָדִימָה
  choice: 从东边
  rationale: פֵּאָה 表示一侧或边缘；此处与后面的西边相对，译为“从东边”简洁自然。
- source_word: עַד פְּאַת יָמָּה
  choice: 直到西边
  rationale: 与“从东边”构成范围表达，保留原文从东至西横贯该地带的意思。
- source_word: שִׁמְעוֹן
  choice: 西缅
  rationale: 采用现代中文圣经传统中通行的支派名称。
- source_word: אֶחָד
  choice: 一份
  rationale: 原文只有“一”，但以西结书48章反复出现的分地格式表明，此处省略了“份”或“地带”之类的名词；正文补出“一份”以使现代中文完整通顺，并用脚注说明原文形式。
