  yaml_path: translation/ot/ezekiel/048/005.yaml
  text: And along the border of Manasseh[a], from the east side to the west side, Ephraim, one portion.
translation:
  language: zh_hans
  text: 沿着玛拿西的边界，从东边到西边，是以法莲的一份地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以法莲，一个”；按上下文，意思是“以法莲的一份地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: 沿着……的边界
  rationale: 此处承接前文，按次序引出下一支派的地业；עַל与גְּבוּל合用，表达毗邻并沿着边界的位置关系。中文不必硬译句首连接词，也能自然保留连续列举的语气。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: מִפְּאַת קָדִימָה
  choice: 从东边
  rationale: פֵּאָה指边、侧或端；与表示东方的קָדִימָה连用，标明地段东面的起点。
- source_word: עַד פְּאַת יָמָּה
  choice: 到西边
  rationale: 与前一短语对应，标明从东至西的整个跨度；יָמָּה本与海的方向有关，在这里按地理方位译为“西边”。
- source_word: אֶפְרַיִם
  choice: 以法莲
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: אֶחָד
  choice: 一份地
  rationale: 希伯来文单写“一”，但本章分配土地的重复格式表明所指数目单位是一个地段或一份地；补出“份地”使现代中文完整自然。
