  text: And those who serve the city shall serve it from all the tribes of Israel[a][b].
translation:
  language: zh_hans
  text: 为这城效力的人，来自以色列各支派，为它效力[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “效力的人”原文为单数形式，也可译作“那为这城效力的人”；这里可能是集合或泛指用法。
    reason: lexical_alternative
  - marker: b
    text: “为它效力”原文直译为“服事它／他”；代词后缀为阳性单数。上下文所指是这城，因此中文译作“它”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹבֵד
  choice: 效力的人
  rationale: 原文是带定冠词的阳性单数分词，字面可指“那效力的人”，在这里也可作集合或泛指用法。中文用“效力的人”既自然，也不必明确限定人数。
- source_word: הָעִיר
  choice: 这城
  rationale: עִיר意为“城”；定冠词结合上下文所指的特定城，译作“这城”符合现代汉语表达。
- source_word: יַעַבְדֻהוּ
  choice: 为它效力
  rationale: 动词עבד与前面的分词同根，表示工作、服役或效力；译文重复“效力”，保留原文的词根呼应。宾语后缀为阳性单数，但上下文指向这城或与城相关之物，正文用自然的中性代词“它”，并以脚注保留形式上的疑点。
- source_word: מִכֹּל
  choice: 从……各……中来
  rationale: 介词מִן与כֹּל连用，表达来源或范围；中文加“来”清楚传达这些效力者来自以色列各支派。
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: 以色列各支派
  rationale: 这是自然、准确的属格结构译法。
