base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/022.yaml
  text: And from the property of the Levites and from the property of the city[a], in the midst of what belongs to the prince, between the border of Judah and the border of Benjamin[b], it shall belong to the prince.
translation:
  language: zh_hans
  text: 利未人的产业和城的产业所在之处，在归首领之地的中间；在犹大的边界和便雅悯的边界之间，这地要归首领所有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “边界”也可译作“疆域”；即“在犹大的疆域和便雅悯的疆域之间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחֻזַּת
  choice: 产业
  rationale: 该词指分配并持有的土地；“产业”在土地划分语境中自然、庄重，也保留其作为恒久地产的含义。
- source_word: הַלְוִיִּם
  choice: 利未人
  rationale: 采用现代中文圣经语境中通行的族群名称，并保留原文的特指。
- source_word: הָעִיר
  choice: 城
  rationale: 指上下文中分给城的土地；与“产业”连用为“城的产业”，简洁而清楚。
- source_word: בְּתוֹךְ
  choice: 位于……地中
  rationale: 表达有关地块处在首领所得范围之内的空间关系，同时避免生硬直译。
- source_word: אֲשֶׁר לַנָּשִׂיא יִהְיֶה
  choice: 归首领的地
  rationale: 原文关系从句直译近于“将归首领的”；中文补出“地”，使所指明确而不增添解释。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 该词在以西结书异象中指治理者。译作“首领”可保持其政治职分的宽度，并避免“王子”在现代中文中的血统含义或“王”所暗示的特定王权。
- source_word: בֵּין גְּבוּל יְהוּדָה וּבֵין גְּבוּל בִּנְיָמִן
  choice: 在犹大的边界和便雅悯的边界之间
  rationale: גְּבוּל 可指边界，也可指疆域；此处描述地块的位置，正文采用“边界”以保留空间界线的意象。
- source_word: לַנָּשִׂיא יִהְיֶה
  choice: 要归首领所有
  rationale: 明确表达原文句末重复的归属关系，并以“要”体现未完成式在异象性土地安排中的将来指向。
theological_decisions:
- issue: 以西结复兴之地异象中 נָשִׂיא 的称谓
  choice: 首领
  alternative: 君王；领袖
  rationale: 原词不同于通常表示“王”的 מֶלֶךְ。译作“首领”既保留这种区别，也不预先判定此人物的王室身份或弥赛亚意义。
translation_notes:
  register: 采用现代、庄重且易懂的叙述语体。原文句法承接上节，中文补出“这片地”以明确句末归属的对象；保留“归首领”在句中和句末的重复，以反映原文的框架结构与强调。
