revisions:
- from: 利未人的产业和城的产业，都位于归首领的地中；这片地在犹大的边界和便雅悯的边界之间[a]，要归首领所有。
  to: 利未人的产业和城的产业所在之处，在归首领之地的中间；在犹大的边界和便雅悯的边界之间，这地要归首领所有。[a]
  rationale: 修订以“所在之处”反映原文在土地产业名称之后所给出的空间定位，避免把原文压缩句法误解为单纯断言两项产业“都位于”某处。保留“归首领之地”及句末“归首领所有”的重复归属表达，也保留גְּבוּל的“边界”译法及其“疆域”脚注替代。
