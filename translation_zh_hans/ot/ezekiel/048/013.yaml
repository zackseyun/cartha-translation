base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/013.yaml
  text: And alongside the territory of the priests[a], the Levites shall have twenty-five thousand cubits in length and ten thousand in width. The whole length shall be twenty-five thousand, and the width ten thousand.
translation:
  language: zh_hans
  text: 利未人的地段在祭司地段旁边，长二万五千肘[a]，宽一万肘。总长二万五千肘，宽一万肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文只说“二万五千”和“一万”；根据《以西结书》第48章的上下文，这里补出量度单位“肘”。
    reason: cross_reference
lexical_decisions:
- source_word: לְעֻמַּת
  choice: 紧邻
  rationale: 在土地分配的语境中表示空间上的相对、对应或毗邻；“紧邻”自然地表达利未人地段与祭司地界相接。
- source_word: גְּבוּל הַכֹּהֲנִים
  choice: 祭司的地界
  rationale: גְּבוּל 可指边界，也可转指有边界的土地；此处“地界”既保留边界意象，也符合土地分配语境。
- source_word: וְהַלְוִיִּם
  choice: 利未人的地段要
  rationale: 希伯来文是承接上下文的无动词省略句；补出“地段要”使现代汉语完整，并清楚表明所述为利未人的土地份额。
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: 二万五千肘
  rationale: 原文仅作“二万五千”，量度单位由本章上下文补明为肘，并以脚注交代。
- source_word: אֹרֶךְ
  choice: 长
  rationale: 以现代汉语常用的尺寸表达简洁呈现长度。
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: 宽一万肘
  rationale: 保持长宽尺寸的平行结构，并采用自然的汉语语序。
- source_word: כָּל אֹרֶךְ
  choice: 总长
  rationale: כָּל 在这里引出对整体尺寸的概括重述；“总长”准确且自然。
