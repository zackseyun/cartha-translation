lexical_decisions:
- source_word: וְ/עַל
  choice: 沿着
  rationale: 在本章依次列出各支派地带的边界公式中，עַל 表示与上一地带边界相接的空间关系；“沿着”自然地保留了这一关系。
- source_word: גְּבוּל
  choice: 边界
  rationale: גְּבוּל 在这里指划分支派地带的界线；“边界”准确且符合现代汉语地理表述。
- source_word: זְבוּלֻן
  choice: 西布伦
  rationale: 采用现代中文圣经传统中通行的支派名称译法。
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: 从东边
  rationale: פֵּאָה 指边、侧，קָדִימָה 在此指东方；“从东边”简洁表达地带的起点。
- source_word: עַד פְּאַת יָמָּ/ה
  choice: 到西边
  rationale: 该短语标明地带延伸至西侧；יָמָּה 在这一地理公式中表示向海一侧，即西边。
- source_word: גָּד
  choice: 迦得
  rationale: 采用现代中文圣经传统中通行的支派名称译法。
- source_word: אֶחָד
  choice: 一份地
  rationale: 希伯来文仅作“一”，但本章反复出现的分地公式清楚表明所省略的是一份地；正文补出“份地”以符合自然汉语，并用脚注说明。
