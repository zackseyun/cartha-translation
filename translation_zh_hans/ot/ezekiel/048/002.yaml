base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/002.yaml
  text: And along the border of Dan[a], from the eastern side to the western side, Asher, one portion.
translation:
  language: zh_hans
  text: 沿着但的边界，从东边到西边[a]，是亚设的一份地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“到海的一边”。这里的“海”用作方向词，指西方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: 沿着
  rationale: 承接上一段的地界分配，并表达亚设所得之地紧邻但的边界；中文省去句首“和”更自然，次序关系仍由上下文清楚体现。
- source_word: גְּבוּל
  choice: 边界
  rationale: 此处指支派地业之间的界线；“边界”准确、自然。
- source_word: דָּן
  choice: 但
  rationale: 采用该以色列支派名称的通行中文译名。
- source_word: מִ/פְּאַת קָדִים
  choice: 从东边
  rationale: פֵּאָה表示一侧或边缘，קָדִים在此表示东方；“从东边”简洁保留地理范围。
- source_word: עַד פְּאַת יָמָּ/ה
  choice: 到西边
  rationale: יָם字面为“海”，在方向用法中指西方；正文译为“西边”以便现代读者理解。
- source_word: אָשֵׁר
  choice: 亚设
  rationale: 采用该以色列支派名称的通行中文译名。
- source_word: אֶחָד
  choice: 一份地
  rationale: 原文仅作“一”，在本章反复出现的土地分配公式中省略了“份地”等名词；补出“一份地”可用自然中文表达其椭圆意义，而不增加额外解释。
