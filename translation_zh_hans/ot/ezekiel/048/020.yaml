base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/020.yaml
  text: The whole contribution shall be twenty-five thousand by twenty-five thousand[a]; you shall set apart the holy contribution as a quarter of the city's property.
translation:
  language: zh_hans
  text: 整块供地，长二万五千，宽二万五千[a]；你们要把圣供地和城的产业一同划为正方形[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文没有明说长度单位；根据上下文，也可译作“长二万五千肘，宽二万五千肘”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你们要把圣供地划出，作为城产业的四分之一。”原文在这里的句法和“第四／四方”一词的含义有歧义。
    reason: alternative_reading
lexical_decisions:
- source_word: תְּרוּמָה / תְּרוּמַת
  choice: 供地
  rationale: 本节谈的是从全地中划出、保留的土地，并非献在祭坛上的祭物；“供地”既保留其奉献、专供之意，也符合土地分配的语境。
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף ... בַּחֲמִשָּׁה וְעֶשְׂרִים אָלֶף
  choice: 长二万五千，宽二万五千
  rationale: 希伯来文只列两个尺寸而未在本节明说单位；正文不擅自补入“肘”，以脚注说明上下文可能隐含的单位。
- source_word: רְבִיעִית
  choice: 正方形
  rationale: 结合两个相等的尺寸和句法，此处最自然地描述整个圣供地连同城的产业构成四方形；该词也可能按序数理解为“四分之一”，故在脚注保留。
- source_word: תָּרִימוּ
  choice: 划出
  rationale: 使役式在土地规划语境中指把某一部分分别出来；“划出”比“举起”或“献上”更自然准确。
- source_word: הַקֹּדֶשׁ
  choice: 圣
  rationale: 表示该供地归于神圣用途；“圣供地”简洁而保持经文庄重语体。
- source_word: אֶל
  choice: 连同
  rationale: 此处介词表达圣供地与城的产业之间的关联；按整体正方形的理解，“连同”能自然呈现二者合在一起的关系。
- source_word: אֲחֻזַּת הָעִיר
  choice: 城的产业
  rationale: אֲחֻזָּה 指依法持有或分得的土地产业；“城的产业”保留土地所有、分配的含义。
theological_decisions:
- issue: רְבִיעִית 与 אֶל אֲחֻזַּת הָעִיר 的句法关系
  choice: 把圣供地连同城的产业划成正方形
  alternative: 把圣供地划出，作为城产业的四分之一
  rationale: 前文两个相等尺寸支持“正方形”的空间描述，而 אֶל 可表达与城产业相连或合并的关系；不过词形也容许“四分之一”的理解，因此不把另一读法排除在脚注之外。
translation_notes:
  register: 采用现代、庄重而易懂的土地规划用语。“供地”用于避免把该词误解为祭坛祭物；两个脚注标记均已置于正文相应位置。
