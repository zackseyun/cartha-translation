base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/028.yaml
  text: And along the border of Gad[a], on the south side southward, the border shall run from Tamar to the waters of Meribath-kadesh, to the Wadi of Egypt[b], and on to the Great Sea.
translation:
  language: zh_hans
  text: 在迦得地界的南面，朝南，边界从他玛到米利巴加低斯的水[a]，再到河谷[b]，直到大海。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “米利巴加低斯”也可译作“加低斯的争讼水”；这里将其按地名音译。
    reason: lexical_alternative
  - marker: b
    text: “河谷”所译的希伯来语可指季节性有水的溪谷或河道。原文这里没有“埃及”一词。
    reason: textual_precision
lexical_decisions:
- source_word: וְעַל גְּבוּל גָּד
  choice: 迦得地界的
  rationale: 承接上一段的边界说明；“地界”自然表达与迦得所得之地相关的边界。句首连接词在中文连续经文中不必机械译出。
- source_word: אֶל פְּאַת נֶגֶב תֵּימָנָה
  choice: 南边向南
  rationale: 保留原文连续使用两个南向词所形成的强调，同时采用现代汉语可理解的边界表述。
- source_word: וְהָיָה גְבוּל
  choice: 边界要
  rationale: היה与“边界”连用，是说明边界所在或走向的公式；结合后续地名，以“边界要从……到……”自然呈现其路线。
- source_word: מִתָּמָר
  choice: 从他玛
  rationale: 将地名 תמר 音译为常见中文形式“他玛”。
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: 加低斯米利巴水
  rationale: 按希伯来语组合保留固定地名，并用“水”表达 מֵי；“米利巴”也保留该地名与“争讼”一词的关联，而不在正文中把地名解释化。
- source_word: נַחֲלָה
  choice: 到河谷
  rationale: 这里宜分析为 נַחַל 加方向词尾 ה，即“到那河谷/溪谷”，而非“产业”。原文此处没有“埃及”一词，因此不补作“埃及河”。
- source_word: עַל הַיָּם הַגָּדוֹל
  choice: 直达大海
  rationale: “大海”是原文对地中海的称呼；在边界路线中，עַל 表示边界延伸至该海，译作“直达”自然且不额外把专名解释为“地中海”。
