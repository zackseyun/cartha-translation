source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֣ר לַ/נָּשִׂ֣יא מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לִ/תְרֽוּמַת הַ/קֹּ֣דֶשׁ וְ/לַ/אֲחֻזַּ֪ת הָ/עִ֟יר אֶל פְּנֵ֣י חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֥לֶף תְּרוּמָה֮ עַד גְּב֣וּל קָדִימָ/ה֒ וְ/יָ֗מָּ/ה עַל פְּ֠נֵי חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ עַל גְּב֣וּל יָ֔מָּ/ה לְ/עֻמַּ֥ת חֲלָקִ֖ים לַ/נָּשִׂ֑יא וְ/הָֽיְתָה֙ תְּרוּמַ֣ת הַ/קֹּ֔דֶשׁ וּ/מִקְדַּ֥שׁ הַ/בַּ֖יִת ב/תוכ/ה׀׀־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/021.yaml
  text: And what remains shall belong to the prince[a], on both sides of the holy contribution and of the city's property, alongside the twenty-five thousand of the contribution as far as the eastern border, and westward alongside the twenty-five thousand toward the western border, parallel to the portions for the prince. And the holy contribution and the sanctuary of the temple shall be in its midst.
translation:
  language: zh_hans
  text: 其余的地要归首领，在圣供地和城邑产业的两侧：东面沿着圣供地的二万五千[a]地段，直到东界；西面沿着那二万五千地段，直到西界，与各份地相对。这地要归首领。圣供地和圣殿的圣所要在其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“二万五千”，计量单位需按以西结书这一段土地丈量的上下文来理解。
    reason: cultural_note
lexical_decisions:
- source_word: וְהַנּוֹתָר לַנָּשִׂיא
  choice: 剩余的地要归首领
  rationale: 将带冠词的分词理解为实体化用法，指其余土地；לַנָּשִׂיא表示归属。נָשִׂיא在以西结异象中指民政领袖，译作“首领”既自然，也不额外引入世袭王室含义。
- source_word: מִזֶּה וּמִזֶּה
  choice: 两边
  rationale: 这是空间惯用语，表示圣供地与城邑产业两侧的土地。
- source_word: תְרוּמַת הַקֹּדֶשׁ
  choice: 圣供地
  rationale: תְרוּמָה本有献礼、奉献之物的祭祀含义，但本段特指分别出来奉献的土地；“圣供地”兼顾其奉献性质和土地语境。
- source_word: אֲחֻזַּת הָעִיר
  choice: 城的产业
  rationale: אֲחֻזָּה指持有的产业或地产；“城的产业”保留土地所有与分配的意味。
- source_word: אֶל־פְּנֵי / עַל־פְּנֵי חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: 沿着……二万五千的那一边
  rationale: 这些空间表达在地界描述中表示相邻、对应或沿边延伸；译文采用“沿着……那一边”，以清楚呈现地理关系，同时不把隐含的计量单位写入正文。
- source_word: לְעֻמַּת חֲלָקִים
  choice: 与各支派所得的地相对
  rationale: חֲלָקִים直指所分得的份额；结合本章各支派横向地段的上下文，以“各支派所得的地”说明其所指。לְעֻמַּת保留为“相对”，不强行限定为完全平行。
- source_word: מִקְדַּשׁ הַבַּיִת
  choice: 殿的圣所
  rationale: מִקְדָּשׁ表示圣所，הַבַּיִת在此指圣殿建筑；“殿的圣所”保留两者的组合关系。
- source_word: בְתוֹכָהּ
  choice: 在其中
  rationale: 阴性单数代词的具体范围可从附近的阴性名词“圣供地”理解，也可在整段布局中指所述区域；译作“其中”保留原文的指代张力。
theological_decisions:
- issue: נָשִׂיא的身份称谓
  choice: 首领
  alternative: 王子／君王
  rationale: 以西结书这一异象中的נָשִׂיא具有治理者身份，但经文没有要求将其解释为世袭王子或等同于君王；“首领”较少加入特定政体或神学预设。
- issue: בְתוֹכָהּ的指代范围
  choice: 保留“在其中”
  alternative: 明确译为“在圣供地中”或“在首领的地中”
  rationale: 原文用阴性代词而未重复先行词；直接明确所指会消除文本本身可感知的指代关系与布局张力，因此不作过度解释。
translation_notes:
  register: 采用现代、庄重而清楚的土地界线叙述。用分号区分东、西两侧，使长句易读；重复“这些地要归首领”来呈现希伯来文后半句再次出现的归属说明。脚注标记置于实际涉及“二万五千”的正文位置。
