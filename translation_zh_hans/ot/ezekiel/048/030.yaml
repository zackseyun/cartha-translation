lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 如下
  rationale: 以现代汉语自然引出后面的分项说明，同时保留希伯来语连接上下文并开启新段落的作用。
- source_word: תּוֹצְאֹת הָעִיר
  choice: 城的出口
  rationale: תּוֹצְאֹת 可指向外通出的地方；下文随即列出城门，因此“出口”贴合语境，但不直接把本词窄化为“城门”。另以脚注保留“外缘、出界处”等可能含义。
- source_word: מִפְּאַת צָפוֹן
  choice: 北面
  rationale: פֵּאָה 在测量边界的语境中指一面或一侧；“北面”是简洁自然的现代汉语表达。
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: 四千五百
  rationale: 希伯来语按“五百和四千”的次序表达总数；汉语依通常数序译为“四千五百”，数值不变。
- source_word: מִדָּה
  choice: 量得
  rationale: 本词表示量度或测得的尺度，本节却没有明说单位。“量得四千五百”既传达测量含义，也避免擅自补入“肘”。
