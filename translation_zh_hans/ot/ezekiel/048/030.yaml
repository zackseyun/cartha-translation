  text: 城的出口[a]如下：北面为四千五百量度[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “出口”也可指城向外延展的范围或边界；这里的希伯来词并不直接等同于下文所说的“城门”。
    reason: lexical_alternative
  - marker: b
    text: 原文在数目后使用“量度”一词，却未在本节明说计量单位；也可直译为“四千五百的量度”。
