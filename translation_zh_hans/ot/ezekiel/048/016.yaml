base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/016.yaml
  text: 'And these are its measurements: the north side[a], four thousand five hundred; and the south side, four thousand five hundred; and from the east side, four thousand five hundred; and the west side, four thousand five hundred.'
translation:
  language: zh_hans
  text: 城的尺寸如下：北边四千五百，南边四千五百，东边四千五百，西边四千五百。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדּוֹתֶיהָ
  choice: 它的尺寸
  rationale: 指城在各方向量得的尺度；“尺寸”简洁自然，适合随后逐边列出的数值。
- source_word: פְּאַת
  choice: 边
  rationale: 在城市测量的语境中表示一边或边界；“边”清楚而自然。
- source_word: צָפוֹן / נֶגֶב / קָדִים / יָמָּה
  choice: 北 / 南 / 东 / 西
  rationale: 这些词在本节并列指四个方位；יָמָּה虽本义与“海”有关，此处是惯用方位词“西”。
- source_word: מִפְּאַת קָדִים
  choice: 东边
  rationale: 希伯来文本在“东边”前独有介词מִן；在此列举四边的对称结构中，若硬译为“从东边”会造成汉语歧义，因此按其语境功能译作“东边”。
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: 四千五百
  rationale: 依现代汉语的标准数词顺序表达同一数值；原文逐字次序为“五百和四千”。
