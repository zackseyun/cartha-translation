  yaml_path: translation/ot/ezekiel/048/032.yaml
  text: 'And on the east side[a], four thousand five hundred cubits, with three gates: the gate of Joseph, one; the gate of Benjamin, one; the gate of Dan, one.'
translation:
  language: zh_hans
  text: 东面长四千五百肘[a]，有三座门：约瑟门一座，便雅悯门一座，但门一座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文只说“四千五百”；“肘”是根据本章上下文所述城的尺寸补出的。
    reason: cross_reference
lexical_decisions:
- source_word: פְּאַת קָדִימָה
  choice: 东面
  rationale: פְּאַת 表示一面、边或区域，קָדִימָה 指东方；“东面”自然简洁，并与本段城界描述相符。
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: 四千五百肘
  rationale: 希伯来语按其数词表达意为“四千五百”；原句未重述单位，但本章相邻的城界尺寸表明单位是肘，因此在正文补出并加注说明。
- source_word: וּשְׁעָרִים שְׁלֹשָׁה
  choice: 有三座门
  rationale: 原文是无动词的描述性短语；“有三座门”符合现代汉语表达，同时保留门的数量。
- source_word: שַׁעַר
  choice: 门
  rationale: 这里指城门；与各支派名称组合时译作“约瑟门”等，简明自然。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בִּנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: דָּן
  choice: 但
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶחָד ... אֶחָד ... אֶחָד
  choice: 一座……一座……一座
  rationale: 逐一保留原文反复出现的“一”，突出每个所列支派各有一座门；量词“座”适用于城门。
