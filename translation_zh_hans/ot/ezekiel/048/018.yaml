base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/018.yaml
  text: And the remainder along the length[a], corresponding to the holy contribution, shall be ten thousand to the east and ten thousand to the west; it shall correspond to the holy contribution[b], and its produce shall be for food for the workers of the city.
translation:
  language: zh_hans
  text: 沿着长度、与圣别的奉献地相对应的余地，向东一万，向西一万[a]；它要与圣别的奉献地相对应；它的出产要作食物，供为城服役的人享用[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向西”原文直译为“向海”，这是希伯来语表示西方的常用说法。
    reason: lexical_alternative
  - marker: b
    text: “食物”原文为“饼”或“粮食”；这里可能泛指供人食用的粮食或食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: 余下的地
  rationale: 该形式指先前划分之后剩余的部分；补出“地”符合土地分配的上下文，也使中文自然明确。
- source_word: בָּאֹרֶךְ
  choice: 沿着……的长边
  rationale: 这里描述余地相对于圣区奉献地纵长一侧的位置；“沿着……的长边”保留空间和测绘含义。
- source_word: לְעֻמַּת
  choice: 与……相接
  rationale: 此介词在本段土地规划中表示两块地相对并列、相邻对应；“相接”比抽象的“相对应”更符合中文地界表述，同时不强行规定具体方位。
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: 圣区奉献地
  rationale: תְּרוּמָה既有献出、分别出来之意，在以西结书45—48章特指划出的神圣地带；“圣区奉献地”兼顾礼仪术语与土地含义。
- source_word: עֲשֶׂרֶת אֲלָפִים קָדִימָה
  choice: 向东一万肘
  rationale: 原文给出数值和向东方向；依据本章土地尺寸的计量语境，正文补明单位“肘”，便于现代读者理解。
- source_word: וַעֲשֶׂרֶת אֲלָפִים יָמָּה
  choice: 向西一万肘
  rationale: יָמָּה字面为“向海”，在以色列地理方位中通常指西方；正文译出实际方位，并以脚注保留字面信息。
- source_word: וְהָיְתָה תבואתה
  choice: 其出产要作
  rationale: תְּבוּאָה指土地的出产或收成；“出产”范围适当，也符合农业用地语境。
- source_word: לְלֶחֶם
  choice: 食物
  rationale: לֶחֶם字面常为“饼、粮食”，也可泛指食物；这里指供养城中工作人员的土地出产，译作“食物”更自然。
- source_word: לְעֹבְדֵי הָעִיר
  choice: 城中工作人员
  rationale: עבד的分词可指工作或服役的人；该表达避免把他们限定为宗教人员，也保留其为城服务或工作的宽泛含义。
