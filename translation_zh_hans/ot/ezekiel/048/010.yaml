source:
  edition: WLC
  text: וּ֠/לְ/אֵ֜לֶּה תִּהְיֶ֣ה תְרֽוּמַת הַ/קֹּדֶשׁ֮ לַ/כֹּֽהֲנִים֒ צָפ֜וֹנָ/ה חֲמִשָּׁ֧ה וְ/עֶשְׂרִ֣ים אֶ֗לֶף וְ/יָ֨מָּ/ה֙ רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/קָדִ֗ימָ/ה רֹ֚חַב עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/נֶ֕גְבָּ/ה אֹ֕רֶךְ חֲמִשָּׁ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וְ/הָיָ֥ה מִקְדַּשׁ יְהוָ֖ה בְּ/תוֹכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/010.yaml
  text: 'And for these[a], the holy contribution shall belong to the priests: on the north, twenty-five thousand in length; on the west, ten thousand in width; on the east, ten thousand in width; and on the south, twenty-five thousand in length[b]; and the sanctuary of Yahweh shall be in its midst.'
translation:
  language: zh_hans
  text: 归给这些祭司的圣供地[a]如下：北边长二万五千，西边宽一万，东边宽一万，南边长二万五千[b]。雅威的圣所要在其中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣供地”也可译作“圣区”或“分别为圣的奉献”；希伯来语直译为“神圣的供物”，这里指划出作神圣用途的一片土地。
    reason: lexical_alternative
  - marker: b
    text: 有旧译法作“北边长二万五千”；希伯来本文在这里作“南边”。
    reason: previous_rendering
lexical_decisions:
- source_word: וּלְאֵלֶּה ... לַכֹּהֲנִים
  choice: 归给这些祭司的
  rationale: לְאֵלֶּה表示分配对象，לַכֹּהֲנִים说明领受者；结合上下文，合译为“归给这些祭司的”，既自然又保留“这些”的指示作用。
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: 圣供地
  rationale: תְּרוּמָה本指献上、划出的供物；在本章指分别出来作神圣用途的一片土地。“圣供地”兼顾其献供性质和土地语境。
- source_word: צָפוֹנָה ... וְיָמָּה ... וְקָדִימָה ... וְנֶגְבָּה
  choice: 北边……西边……东边……南边
  rationale: 这些方向词在疆界量度中分别指四边，译为“某边”符合现代汉语地界描述。
- source_word: רֹחַב / אֹרֶךְ
  choice: 宽 / 长
  rationale: 两词彼此对照，分别表示宽度和长度；北边虽省略“长”字，但由南边的平行表达可明确补出。
- source_word: מִקְדַּשׁ יְהוָה
  choice: 雅威的圣所
  rationale: מִקְדָּשׁ指圣所；יְהוָה按其专名音译为“雅威”，保留原文使用神名而非称号的特点。
- source_word: בְּתוֹכוֹ
  choice: 在其中
  rationale: 指雅威的圣所位于这片圣供地之内；“其中”保留原文简洁的空间关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现，并避免以称号“主”替代；“耶和华”是传统形式，但较不贴近通常重构的发音。
- issue: תְּרוּמַת הַקֹּדֶשׁ 的性质
  choice: 圣供地
  alternative: 神圣的供物；圣区；分别为圣的奉献
  rationale: 此处既有礼仪上“献出、分别”的含义，又实际指一片划定的土地；“圣供地”不把它仅理解为普通祭物，也不抹去奉献意味。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。四边量度用“北边长……西边宽……”的简明格式；原文没有注明量度单位，正文也不擅自补入。以句号分开地界数据和圣所位置，使长句清晰，同时保持两部分的紧密关系。
