base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/033.yaml
  text: 'On the south side[a], 4,500 cubits by measure, with three gates: the gate of Simeon, one; the gate of Issachar, one; the gate of Zebulun, one.'
translation:
  language: zh_hans
  text: 南面长四千五百肘[a]，有三座门：西缅门一座，以萨迦门一座，西布伦门一座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文只说“按量度为四千五百”；“肘”是根据本段紧邻语境中城的尺寸补出的。
    reason: cross_reference
lexical_decisions:
- source_word: וּ/פְאַת נֶגְבָּ/ה
  choice: 南面
  rationale: פאה指边、面或边界，נֶגְבָּה在此指向南方；“南面”符合城邑尺寸描述的现代汉语表达。句首连词不机械译出，以保持自然衔接。
- source_word: חֲמֵשׁ מֵאוֹת וְ/אַרְבַּעַת אֲלָפִים מִדָּה
  choice: 长四千五百肘[a]
  rationale: 数词合计为四千五百。מִדָּה表达量度；原句未明说单位，但本段紧邻语境以肘计算城的尺寸，因此正文补出“肘”并以脚注说明。“长”自然表达这一侧的尺寸。
- source_word: וּ/שְׁעָרִים שְׁלֹשָׁה
  choice: 有三座门
  rationale: 原文是名词性描述；“有三座门”以简洁自然的汉语说明南面的门数，不增加超出语境的含义。
- source_word: שַׁעַר שִׁמְעוֹן אֶחָד
  choice: 西缅门一座
  rationale: 保留“族名＋门＋一座”的列举结构和重复节奏。
- source_word: שַׁעַר יִשָּׂשכָר אֶחָד
  choice: 以萨迦门一座
  rationale: 与前后项目采用一致结构，反映希伯来文程式化的列举。
- source_word: שַׁעַר זְבוּלֻן אֶחָד
  choice: 西布伦门一座
  rationale: 与前两项保持一致，并保留原文逐门注明“一”的形式。
