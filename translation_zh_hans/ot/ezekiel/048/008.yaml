source:
  edition: WLC
  text: וְ/עַל֙ גְּב֣וּל יְהוּדָ֔ה מִ/פְּאַ֥ת קָדִ֖ים עַד פְּאַת יָ֑מָּ/ה תִּהְיֶ֣ה הַ/תְּרוּמָ֣ה אֲֽשֶׁר תָּרִ֡ימוּ חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֜לֶף רֹ֗חַב וְ/אֹ֜רֶךְ כְּ/אַחַ֤ד הַ/חֲלָקִים֙ מִ/פְּאַ֤ת קָדִ֨ימָ/ה֙ עַד פְּאַת יָ֔מָּ/ה וְ/הָיָ֥ה הַ/מִּקְדָּ֖שׁ בְּ/תוֹכֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/008.yaml
  text: 'Along the border of Judah[a], from the east side to the west side, shall be the contribution that you shall set apart: twenty-five thousand in width, and in length like one of the portions, from the east side to the west side[c][b]; and the sanctuary shall be in its midst.'
translation:
  language: zh_hans
  text: 沿着犹大的边界，从东边到西边，你们要划出的献地[a]应当是：宽二万五千，长度与一份地相同[b]，从东边到西边[c]；圣所要在这地中间。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献地”也可译作“奉献之地”或“划出的圣区”。希伯来语指特别划出、供圣用的一份土地。
    reason: lexical_alternative
  - marker: b
    text: 按上下文，“一份地”指各支派分得的狭长地带。
    reason: cultural_note
  - marker: c
    text: “西边”直译为“朝海的一边”；希伯来语以海所在的方向表示西方。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: 边界
  rationale: 在分地语境中指领土的界线；“边界”是现代汉语中自然、明确的表达。
- source_word: מִפְּאַת קָדִים ... עַד פְּאַת יָמָּה
  choice: 从东边直到西边
  rationale: פֵּאָה指边、侧或尽头；יָמָּה字面与“海”有关，在此按希伯来语方位习惯表示西方。译出实际方位，同时以脚注保留字面背景。
- source_word: הַתְּרוּמָה
  choice: 献地
  rationale: תְּרוּמָה本指奉献、举献之物；在《以西结书》45—48章特指划出作神圣用途的一片土地。“献地”简洁地保留奉献与土地两层含义。
- source_word: תָּרִימוּ
  choice: 划出
  rationale: רוּם的使役式在此表示把土地分别出来作为奉献；“划出”符合土地分配语境，也避免让人误解为献上祭物。
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: 二万五千
  rationale: 原文此处没有明说计量单位，因此正文不擅自补入。
- source_word: רֹחַב
  choice: 宽
  rationale: 用于土地测量，现代汉语以“宽二万五千”自然表达宽度。
- source_word: אֹרֶךְ
  choice: 长
  rationale: 与“宽”相对，准确表达所划土地的长度。
- source_word: כְּאַחַד הַחֲלָקִים
  choice: 与各份地中的一份相同
  rationale: חֵלֶק指份额或分得的地；正文不直接增添原文未明说的“支派”，脚注说明上下文所指。
- source_word: הַמִּקְדָּשׁ
  choice: 圣所
  rationale: מִקְדָּשׁ指分别为圣的圣所或神圣区域；“圣所”准确而不把范围过度限定为某一建筑。
- source_word: בְּתוֹכוֹ
  choice: 在其中
  rationale: 保留圣所位于这片献地之内的空间关系，而不额外断定必须处于几何中心。
theological_decisions:
- issue: 献地的性质
  choice: 用“献地”表达分别出来作神圣用途的土地
  alternative: 供物；奉献；圣区
  rationale: 原词兼有奉献之物与特定土地的含义；“献地”适合本章分地语境，又不把它解释成祭物或导入特定宗派概念。
- issue: 圣所在献地中的位置
  choice: 译作“在其中”
  alternative: 在正中央
  rationale: בְּתוֹכוֹ可表示在其内部或当中；原文并未在此明确要求几何学意义上的正中心，故保留其空间表达的弹性。
translation_notes:
  register: 采用现代、庄重而清楚的土地划分用语。“沿着……边界”“划出的献地”适合地理与测量语境；保留原文未注明计量单位的特点，不擅自补入“肘”或其他单位。所有脚注标记均置于正文相应词句之后。
