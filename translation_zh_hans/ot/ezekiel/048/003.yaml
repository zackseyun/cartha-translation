source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל אָשֵׁ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה וְ/עַד פְּאַת יָ֖מָּ/ה נַפְתָּלִ֥י אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/003.yaml
  text: And alongside the border of Asher[a], from the eastern side to the western side, Naphtali, one portion.
translation:
  language: zh_hans
  text: 沿着亚设的边界，从东面直到西面，是拿弗他利的一份地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“拿弗他利，一个”。这里根据本章分配土地的语境补出“份地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: 沿着
  rationale: 在本章划分地界的固定表达中，עַל 表示下一片土地与前一支派边界相接；译作“沿着”既自然，也准确表达毗邻关系。
- source_word: גְּבוּל
  choice: 边界
  rationale: 该词指疆界或边界线；“边界”符合现代汉语的土地划分语境。
- source_word: אָשֵׁר
  choice: 亚设
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: 从东面
  rationale: פֵּאָה 指一侧或边缘，קָדִימָה 表示东方；“从东面”简洁地保留方位和起点含义。
- source_word: וְ/עַד פְּאַת יָמָּ/ה
  choice: 直到西面
  rationale: עַד 表示延伸的终点，יָמָּה 在此按希伯来语方位习惯指西方；“直到西面”清楚表达横贯东西的范围。
- source_word: נַפְתָּלִי
  choice: 拿弗他利
  rationale: 采用现代中文圣经中通行的支派名称译法。
- source_word: אֶחָד
  choice: 一份地
  rationale: 原文仅作“一”，在本章分配土地的语境中省略了所指的地份；正文补出“份地”以便读者理解，并用脚注说明原文的简略表达。
