  text: וְ/שַׁעֲרֵ֣י הָ/עִ֗יר עַל שְׁמוֹת֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל שְׁעָרִ֥ים שְׁלוֹשָׁ֖ה צָפ֑וֹנָ/ה שַׁ֣עַר רְאוּבֵ֞ן אֶחָ֗ד שַׁ֤עַר יְהוּדָה֙ אֶחָ֔ד שַׁ֥עַר לֵוִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/031.yaml
  text: 'And the gates of the city shall be named after the tribes of Israel: three gates on the north side—one gate of Reuben[a], one gate of Judah, one gate of Levi.'
translation:
  language: zh_hans
  text: 城的各门要按以色列各支派的名字命名：北面有三座门——一座是流便门，一座是犹大门，一座是利未门。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׁעֲרֵי הָעִיר
  choice: 城的各门
  rationale: 这是带连接词的组合结构；本节在连续的城邑布局说明中，汉语无需机械译出“和”，以自然承接上下文。
- source_word: עַל שְׁמוֹת שִׁבְטֵי יִשְׂרָאֵל
  choice: 要按以色列各支派的名字命名
  rationale: 介词 עַל 与“名字”连用，表示城门的命名与各支派名称相对应；“按……的名字命名”既自然，也不把关系具体化为归属或用途。
- source_word: שְׁעָרִים שְׁלוֹשָׁה צָפוֹנָה
  choice: 北面有三座门
  rationale: צָפוֹנָה 在建筑布局语境中指北面；“北面有三座门”符合现代汉语的空间描述方式。
- source_word: שַׁעַר רְאוּבֵן אֶחָד
  choice: 一座是吕便门
  rationale: 该结构逐一列出以支派名命名的门；采用中文惯用的专名复合形式“吕便门”，并以“一座”保留 אֶחָד 的枚举作用。
- source_word: שַׁעַר יְהוּדָה אֶחָד
  choice: 一座是犹大门
  rationale: 与前后平行结构一致，明确这是以“犹大”为名的一座门。
- source_word: שַׁעַר לֵוִי אֶחָד
  choice: 一座是利未门
  rationale: 保留“利未”这一支派名称，不扩展为“利未人”，并维持三项枚举的平行表达。
