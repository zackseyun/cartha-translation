lexical_decisions:
- source_word: וְיֶתֶר הַשְּׁבָטִים
  choice: 至于其余的支派
  rationale: 承接上文并引出尚未列出的支派；“至于”自然表达话题转换，“其余的支派”保留“剩余”之意。
- source_word: מִפְּאַת קָדִימָה
  choice: 从东边
  rationale: פֵּאָה可指边、侧或边界；在本章土地划分的固定句式中，“东边”简洁自然。
- source_word: עַד פְּאַת יָמָּה
  choice: 到西边
  rationale: יָמָּה在此表示向西或西方；与“从东边”构成清楚、对称的疆域表述。
- source_word: בִּנְיָמִן
  choice: 便雅悯
  rationale: 采用现代中文圣经读者熟悉的传统人名译法。
- source_word: אֶחָד
  choice: 一份
  rationale: 原文仅作“一”，但按本章反复出现的土地分配格式，省略了地业份额之类的中心词；正文补出“份”以便中文自然理解，同时以脚注说明原文形式。
