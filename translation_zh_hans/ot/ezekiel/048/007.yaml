  text: And along the border of Reuben[a], from the eastern side to the western side, Judah[c][b], one portion.
translation:
  language: zh_hans
  text: 沿着吕便的边界，从东边直到西边[a]，是犹大的一份[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西边”原文直译为“海边”；希伯来语常以海所在的方向表示西方。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“犹大，一个”；“份”是按本章分配地业的固定格式补出的。
    reason: implied_word
lexical_decisions:
- source_word: וְ/עַל
  choice: 沿着
  rationale: 这里承接上一段地界分配，并说明犹大所得之地与吕便边界的相对位置；“沿着”比直译为“在……之上”更符合现代汉语的疆界描述。
- source_word: גְּבוּל
  choice: 边界
  rationale: 在本章分地语境中指支派地业的界线；“边界”准确而自然。
- source_word: רְאוּבֵן
  choice: 吕便
  rationale: 采用现代中文圣经传统中通行的支派名称。
- source_word: מִ/פְּאַת קָדִים
  choice: 从东边
  rationale: פְּאָה指边、侧或端；在测定地界的固定表达中译作“东边”简洁清楚。
- source_word: עַד פְּאַת יָמָּה
  choice: 直到西边
  rationale: יָם本义为“海”，在希伯来地理方位表达中可指西方；此处重复的分地格式表明方向义为主。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文圣经传统中通行的支派名称。
- source_word: אֶחָד
  choice: 一份
  rationale: 原文只有“一”，但本章分配地业的格式隐含“一份地”；补出“份”使现代汉语完整自然，同时以脚注说明原文形式。
