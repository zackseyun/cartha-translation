source:
  edition: WLC
  text: זֹ֥את הָ/אָ֛רֶץ אֲשֶׁר תַּפִּ֥ילוּ מִֽ/נַּחֲלָ֖ה לְ/שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וְ/אֵ֨לֶּה֙ מַחְלְקוֹתָ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/029.yaml
  text: This is the land that you shall assign as an inheritance to the tribes of Israel[a], and these are their portions, declares the Lord GOD.
translation:
  language: zh_hans
  text: 这就是你们要分给以色列各支派作为产业的地；这些就是他们所得的份额[a]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “份额”原文也可译作“分区”或“所分得的地”。
    reason: 保留 מַחְלְקוֹתָם 在划分行动、划定区域和所得份额之间的词义幅度。
lexical_decisions:
- source_word: זֹאת הָאָרֶץ
  choice: 这就是……的地
  rationale: 指示词加名词引出全段总结；汉语补出“就是”，表达自然，并保留对前述土地的指称。
- source_word: תַּפִּילוּ
  choice: 你们要分给
  rationale: נפל 的使役式用于分配土地的语境，指借分配或拈阄使某份地归给某人；“分给”清楚传达实际含义，又不强行规定具体分配方式。
- source_word: מִנַּחֲלָה
  choice: 作为产业
  rationale: נַחֲלָה 指承受而得、长期归属的产业；此处与分地动词连用，“作为产业”符合汉语表达。
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: 给以色列各支派
  rationale: 介词 לְ 标明土地分配的承受者；“各支派”自然体现复数。
- source_word: מַחְלְקוֹתָם
  choice: 他们所得的份额
  rationale: 该词可指划分、分区或分得的部分；上下文专论各支派获配的土地，“所得的份额”既自然又保留分配所得之意。
- source_word: נְאֻם
  choice: 宣告
  rationale: 先知书中用来确认神谕来源的固定表达；译作“宣告”庄重且易懂。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达 אֲדֹנָי 的“主”和四字神名 יְהוִה；“主耶和华”是现代中文圣经语体中清楚、庄重的复合称号。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时保留“主”的称号和神的专名。译作“主耶和华”不把两者合并，也不额外引入特定宗派解释。
- issue: 土地作为 נַחֲלָה 的性质
  choice: 产业
  alternative: 继承之地；地业
  rationale: “产业”可涵盖由神分配、由支派承受并归其所有的土地，但不在本节之外进一步界定其法律或神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“分给”避免生硬直译为“使落下”，同时不擅自说明是否以拈阄执行；末句采用先知书神谕公式“这是主耶和华的宣告”。
