  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַ/תְּרוּמָ֕ה אֲשֶׁ֥ר תָּרִ֖ימוּ לַֽ/יהוָ֑ה אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף וְ/רֹ֖חַב עֲשֶׂ֥רֶת אֲלָפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/009.yaml
  text: The contribution that you shall set apart for Yahweh shall be twenty-five thousand in length and ten thousand in width[a].
translation:
  language: zh_hans
  text: 你们要划归给雅威的献地，长二万五千，宽一万。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献地”也可译作“奉献之地”或“划出的地段”。希伯来词指举起或分别献出的东西；在这里指从全地中划出的一片神圣土地。原文在本节没有注明长度单位。
    reason: 说明关键词的词义范围，并保留原文未注明计量单位这一特点。
lexical_decisions:
- source_word: הַתְּרוּמָה
  choice: 献地
  rationale: תְּרוּמָה本指举起或分别献出的礼物、供物；在《以西结书》45—48章特指从全地划出、献给雅威的神圣地段。“献地”既保留奉献含义，也清楚表明这里所说的是土地。
- source_word: אֲשֶׁר תָּרִימוּ
  choice: 你们要划归
  rationale: רוּם的使役式在此不是字面意义的“举起”，而是把某部分划出作为奉献。“划归”自然贴合土地分配的语境，并保留指定归属之意。
- source_word: לַיהוָה
  choice: 给雅威
  rationale: 介词ל表示对象或归属；“给雅威”表达这片土地被指定献归雅威。יהוה按其专名译作“雅威”。
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: 长二万五千
  rationale: 按希伯来文直接表达第一项尺寸；原文在本节没有明说计量单位，因此正文不补入。
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: 宽一万
  rationale: 与“长二万五千”形成简洁、自然的尺寸对举；同样不补出原文未明说的单位。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。译作“雅威”较直接地保留盟约之神的专名，避免以称号替代，也不把传统的另一种音译写入正文。
- issue: תְּרוּמָה在土地异象中的性质
  choice: 献地
  alternative: 供物；奉献；划出的地段
  rationale: 本词既含奉献意味，又在上下文中具体指一片划出的神圣土地。“献地”保留两层意义，不将其窄化为祭牲或一般礼物。
translation_notes:
  register: 采用现代、庄重而简明的书面汉语。“划归给雅威”符合土地分配语境；尺寸用“长……宽……”表达。脚注标记[a]已置于正文相关句末。
