id: EZK.48.11
reference: Ezekiel 48:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לַ/כֹּהֲנִ֤ים הַֽ/מְקֻדָּשׁ֙ מִ/בְּנֵ֣י צָד֔וֹק אֲשֶׁ֥ר שָׁמְר֖וּ מִשְׁמַרְתִּ֑/י אֲשֶׁ֣ר לֹֽא תָע֗וּ בִּ/תְעוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֥ר תָּע֖וּ הַ/לְוִיִּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/011.yaml
  text: It shall be for the priests who are consecrated from the sons of Zadok[a], who kept my charge, who did not go astray when the sons of Israel went astray[c][b], as the Levites went astray.
translation:
  language: zh_hans
  text: 这地要归给祭司，即撒督子孙中被分别为圣的祭司[a]；他们谨守我所托付的职分[b]。以色列人偏离时[c]，他们没有偏离，不像利未人那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就是撒督后裔中被分别为圣的祭司”。
    reason: 原文的修饰关系可在汉语中用不同语序表达；此处既涉及祭司被分别为圣，也涉及他们出自撒督的谱系。
  - marker: b
    text: “谨守我所托付的职分”指忠实履行神交付的责任，在这里尤其指祭司的职务。
    reason: 说明希伯来语同根搭配 שׁמר משׁמרת 在祭司语境中的惯用含义。
  - marker: c
    text: “以色列人”直译为“以色列的众子”。
    reason: 保留原文族群称谓的形式信息，同时正文采用自然的现代汉语。
lexical_decisions:
- source_word: לַכֹּהֲנִים
  choice: 要归给祭司
  rationale: 前缀 ל 在本段分地语境中表示归属或分配对象；补出“这地要”承接上文，使现代汉语完整自然。
- source_word: הַמְקֻדָּשׁ
  choice: 分别为圣的
  rationale: קדשׁ 的被动分词在祭司礼仪语境中表示被分别出来归于神；“分别为圣”兼顾宗教含义与原文被动意味。
- source_word: מִבְּנֵי צָדוֹק
  choice: 撒督子孙中
  rationale: בְּנֵי 在谱系语境中指后裔；介词 מִן 保留“从……中”的范围含义，表明这些祭司出自撒督后裔。
- source_word: שָׁמְרוּ מִשְׁמַרְתִּי
  choice: 谨守我所托付的职分
  rationale: 该同根搭配表示忠实履行神交付的看守、职责或祭司职务；此译比直译“守我的看守”自然，同时保留受托尽职的意味。
- source_word: לֹא תָעוּ
  choice: 没有……偏离
  rationale: תעה 在此指信仰及礼仪上的背离，而非空间上的迷路；“偏离”保留道德和敬拜层面的含义。
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人偏离正道时
  rationale: ב 加不定式构词表达时间或伴随情形；בְּנֵי יִשְׂרָאֵל 在现代汉语中自然译作“以色列人”。补出“正道”使“偏离”在汉语中语义完整，但不指定某一具体罪行。
- source_word: כַּאֲשֶׁר תָּעוּ הַלְוִיִּם
  choice: 没有像利未人那样偏离
  rationale: כַּאֲשֶׁר 引入比较；调整为汉语否定比较句，清楚呈现撒督子孙的忠信与利未人的偏离之间的对照。
theological_decisions:
- issue: 异象中祭司身份、谱系与忠信之间的关系
  choice: 同时保留“祭司”“撒督子孙”以及他们忠实守职三个要素
  alternative: 把重点动态处理为他们因忠诚而得赏赐，弱化谱系或祭司身份
  rationale: 希伯来文明确同时提到祭司身份、撒督谱系和谨守神所托职分；译文不把其中任何一项解释成唯一依据，也不引入后世关于祭司制度的教义。
- issue: “偏离”所指的性质
  choice: 保持概括性的“偏离正道”
  alternative: 明确译为拜偶像、背道或违反礼仪
  rationale: 上下文涉及以色列人与利未人的宗教失信，但本节动词本身未具体列明行为；保持概括可避免过度解释。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“这地要归给”承接本章分地语境；分号划分身份说明与忠信事迹，末句调整语序以自然呈现希伯来文的比较关系。所有注释标记均置于正文对应位置。
