  text: וְ/אֵ֖לֶּה שְׁמ֣וֹת הַ/שְּׁבָטִ֑ים מִ/קְצֵ֣ה צָפ֡וֹנָ/ה אֶל יַ֣ד דֶּֽרֶךְ חֶתְלֹ֣ן לְֽבוֹא חֲמָ֡ת חֲצַ֣ר עֵינָן֩ גְּב֨וּל דַּמֶּ֤שֶׂק צָפ֨וֹנָ/ה֙ אֶל יַ֣ד חֲמָ֔ת וְ/הָיוּ ל֧/וֹ פְאַת קָדִ֛ים הַ/יָּ֖ם דָּ֥ן אֶחָֽד־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/001.yaml
  text: 'These are the names of the tribes: from the northern extremity[a], beside the way of Hethlon to Lebo-hamath, Hazar-enan, at the border of Damascus northward beside Hamath, and extending from the east side to the sea, Dan[b], one portion.'
translation:
  language: zh_hans
  text: 以下是各支派的名字：从北端起，沿希特伦的道路到哈马口[a]，再到哈萨以难；大马士革北面的边界，靠近哈马；丹的一份地，从东边直到海[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “哈马口”也可视为地名“利波哈马”；原文直译为“进入哈马之处”。
    reason: 说明该表达既可能是传统地名，也保有可按字面理解的地理含义。
  - marker: b
    text: 本句原文十分简略，也可按字面译作：“东边的一侧直到海；丹一份。”意思是丹所得的一份地从东向西延伸。
    reason: 保留压缩的希伯来语句法及其可能的形式对应译法。
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת הַשְּׁבָטִים
  choice: 以下是各支派的名字
  rationale: 自然引出随后列举的支派，同时保留“这些是……名字”的基本结构；不加入原文没有的时间性“现在”。
- source_word: מִקְצֵה צָפוֹנָה
  choice: 从北端
  rationale: קָצֶה 指边缘、尽头；“北端”简洁地保留疆界描述的地理含义。
- source_word: אֶל יַד דֶּרֶךְ חֶתְלֹן
  choice: 沿赫特伦的道路
  rationale: אֶל יַד 在疆界语境表示邻接、沿着；此处用“沿”比逐字的“在……旁边”更符合现代汉语地界叙述。
- source_word: לְבוֹא חֲמָת
  choice: 到哈马口
  rationale: 该表达可作地名，也可按字面理解为“哈马的入口”；“哈马口”兼顾传统地名功能和原词透明度，并以脚注说明。
- source_word: חֲצַר עֵינָן
  choice: 哈萨以难
  rationale: 按专名音译，符合圣经地名的现代汉语表达。
- source_word: גְּבוּל דַּמֶּשֶׂק צָפוֹנָה אֶל יַד חֲמָת
  choice: 这条界线在大马士革边界以北，靠近哈马
  rationale: 按希伯来语词序所表达的地理关系处理，不把大马士革与哈马之间的具体边界关系解释得过细。
- source_word: וְהָיוּ לוֹ פְאַת קָדִים הַיָּם
  choice: 从东边延伸到海
  rationale: 原句高度压缩，语境说明该份地横跨东西；译文补出“延伸”，使现代读者可懂，同时在脚注保留更贴近形式的另一读法。
- source_word: דָּן אֶחָד
  choice: 丹得一份
  rationale: אֶחָד 在分地清单中省略了“份、地带”等中心词；“得一份”自然表达丹支派的一条分地。
