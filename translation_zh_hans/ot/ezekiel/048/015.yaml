  text: וַ/חֲמֵ֨שֶׁת אֲלָפִ֜ים הַ/נּוֹתָ֣ר בָּ/רֹ֗חַב עַל פְּנֵ֨י חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף חֹֽל ה֣וּא לָ/עִ֔יר לְ/מוֹשָׁ֖ב וּ/לְ/מִגְרָ֑שׁ וְ/הָיְתָ֥ה הָ/עִ֖יר ב/תוכ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/015.yaml
  text: And the remaining five thousand in width[a], along the face of the twenty-five thousand, shall be common land for the city, for dwelling, and for open land[c][b]; and the city shall be in its midst.
translation:
  language: zh_hans
  text: 其余宽五千的一段地，沿着二万五千的地段[a]，是供城使用、供人居住和作城周空地[c]的普通用地[b]；城要在这地中央。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “沿着二万五千的地段”也可译作“与二万五千的地段相邻”。希伯来语直译为“在……的面上”；其具体空间关系可以有几种相近的理解。
    reason: lexical_alternative
  - marker: b
    text: “普通用地”所译的希伯来词指没有分别为圣的土地，与周围已经分别为圣的地段相对，并不表示这地不洁。
    reason: cultural_note
  - marker: c
    text: “城周空地”指城周围的空旷土地，也可能包括放牧用地。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: 其余……的地
  rationale: 该分词指先前划分之后剩下的部分；译为“其余……的地”既符合土地分配语境，也使汉语句子完整自然。
- source_word: בָּרֹחַב
  choice: 宽五千
  rationale: רֹחַב表示宽度；“宽五千”是现代汉语说明地块尺寸的自然表达。原句未重述计量单位，因此正文也不补出“肘”。
- source_word: עַל־פְּנֵי
  choice: 沿着……的那一边
  rationale: 该空间短语字面含“在……面前／沿着……的面”，此处表示地块沿另一地段展开或与之相接；译文保留空间关系的弹性，不把具体方位说死。
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: 二万五千
  rationale: 此数值回指上下文中已说明的地段长度。希伯来文本本句未重复单位，故不在正文增补。
- source_word: חֹל
  choice: 普通用地
  rationale: חֹל在这里与分别为圣的土地相对，指非圣别、供一般用途的土地；“普通用地”能表达礼仪空间上的对比，又避免“俗地”或“不洁之地”可能造成的贬义误解。
- source_word: לָעִיר
  choice: 供城使用
  rationale: 介词ל־表示归属或用途；“供城使用”自然表达该地划给城市使用，同时不限定具体行政性质。
- source_word: לְמוֹשָׁב
  choice: 供人居住
  rationale: מוֹשָׁב可指居住或定居；结合城市规划语境，“供人居住”清楚而自然。
- source_word: וּלְמִגְרָשׁ
  choice: 也作城周空地
  rationale: מִגְרָשׁ指城镇周围的空地，也可能包括牧放用地。“城周空地”保留其宽泛用途，不狭义限定为牧场或现代郊区。
- source_word: בְּתוֹכָהּ
  choice: 在这地中央
  rationale: 该词表示在其内部或当中；结合地块布局，“在这地中央”明确说明城市位于所划地段之中，同时保留中心位置的空间含义。
