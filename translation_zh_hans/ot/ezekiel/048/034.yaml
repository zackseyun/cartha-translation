  text: פְּאַת יָ֗מָּ/ה חֲמֵ֤שׁ מֵאוֹת֙ וְ/אַרְבַּ֣עַת אֲלָפִ֔ים שַֽׁעֲרֵי/הֶ֖ם שְׁלֹשָׁ֑ה שַׁ֣עַר גָּ֞ד אֶחָ֗ד שַׁ֤עַר אָשֵׁר֙ אֶחָ֔ד שַׁ֥עַר נַפְתָּלִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/034.yaml
  text: 'On the west side[a], four thousand five hundred, with their three gates: the gate of Gad, one; the gate of Asher, one; the gate of Naphtali[b], one.'
translation:
  language: zh_hans
  text: 西面为四千五百，有三座门：迦得门一座，亚设门一座，拿弗他利门一座。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּאַת יָמָּה
  choice: 西面
  rationale: פְּאַת指边、侧面，יָמָּה在此是“向西”的方位词；按全段逐面列举城界的语境，译作“西面”自然简洁。
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: 四千五百肘
  rationale: 希伯来语字面次序为“五百和四千”，数值是四千五百。上下文所量的是城的边长；“肘”虽未在本节重复出现，却承接48:16的计量单位，补出可避免汉语误解为仅列数字。
- source_word: שַׁעֲרֵיהֶם שְׁלֹשָׁה
  choice: 有三座门
  rationale: 原文是无系词的列举式短语，直陈门的数目。希伯来语复数物主后缀字面为“它们的”，所指在句法上不够自然；现代汉语以“有三座门”准确表达清单功能而不强行指定其先行词。
- source_word: שַׁעַר גָּד אֶחָד
  choice: 一座是迦得门
  rationale: 保留“门—支派名—一”的逐项计数意义，同时按现代汉语语序表达。迦得采用通行圣经专名译法。
- source_word: שַׁעַר אָשֵׁר אֶחָד
  choice: 一座是亚设门
  rationale: 与前后项目保持一致，表达该名之门为一座；亚设采用通行圣经专名译法。
- source_word: שַׁעַר נַפְתָּלִי אֶחָד
  choice: 一座是拿弗他利门
  rationale: 与前两项采用相同结构，保留重复列举的节奏；拿弗他利采用通行圣经专名译法。
