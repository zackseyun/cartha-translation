base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/009.yaml
  text: And I looked[a], and behold, four wheels beside the cherubim, one wheel beside each cherub; and the appearance of the wheels was like beryl stone.
translation:
  language: zh_hans
  text: 我观看，看哪，基路伯旁边有四个轮子，每个基路伯旁边各有一个轮子；轮子的外观仿佛他施宝石[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“他施石”；具体指哪一种宝石并不确定，可能是绿柱石、橄榄石或其他宝石。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: 我观看
  rationale: ראה在异象叙事中既可指“看见”，也可指主动观看；“我观看”自然承接下文，并与“看哪”形成异象报告的节奏。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示眼前新景象的鲜明指示力，文体庄重而为现代读者所能理解。
- source_word: אַרְבָּעָה אוֹפַנִּים
  choice: 四个轮子
  rationale: 按以西结异象语境直译אוֹפַן，保留其具体物象。
- source_word: אֵצֶל הַכְּרוּבִים
  choice: 基路伯旁边
  rationale: אֵצֶל表示邻近；“旁边”准确且自然。“基路伯”采用现代中文圣经语境中通行的音译。
- source_word: אוֹפַן אֶחָד אֵצֶל הַכְּרוּב אֶחָד
  choice: 每个基路伯旁边各有一个轮子
  rationale: 原文以“一个……一个”表达逐一对应的分配关系；中文用“每个……各有一个”清楚保留此意。
- source_word: וּמַרְאֵה הָאוֹפַנִּים
  choice: 轮子的外观
  rationale: מַרְאֶה在异象描写中指可见的形貌或样子；“外观”简洁准确。
- source_word: כְּעֵין
  choice: 仿佛
  rationale: 该结构表达视觉上的相似；“仿佛”保留比较关系，而不额外限定为颜色或光泽。
- source_word: אֶבֶן תַּרְשִׁישׁ
  choice: 他施宝石
  rationale: 保留תַּרְשִׁישׁ的音译和אֶבֶן“石头/宝石”的明示成分，避免在矿物种类不确定时武断译作绿柱石、橄榄石或黄玉。
