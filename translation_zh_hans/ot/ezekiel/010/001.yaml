base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/001.yaml
  text: Then I looked[a], and behold, on the expanse that was above the heads of the cherubim there appeared over them something like a sapphire stone, in appearance like the likeness of a throne.
translation:
  language: zh_hans
  text: 我观看，看哪，在基路伯头顶上方的穹苍之上，有一物显现在它们上方，仿佛蓝宝石[a]；看上去，好像宝座的形状。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仿佛青金石”。传统译作“蓝宝石”的希伯来词，可能指一种深蓝色宝石；按现代矿物分类，其确切所指尚有不同看法。
    reason: 说明古代宝石名称在现代矿物学上的不确定性，并提供主要词义选项。
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: 我观看
  rationale: 该动词承接并推进异象叙事；“我观看”既保留第一人称视觉见证，也比单纯的“我看见”更能体现先观看、继而有所显现的过程。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 这是引人注意的异象话语标记；“看哪”保留突显新景象的力度和先知性语体。
- source_word: הָרָקִיעַ
  choice: 穹苍
  rationale: 在以西结的异象中，指基路伯上方延展开的穹状空间或平台；“穹苍”保留其具体而宏阔的空间意象。
- source_word: הַכְּרֻבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指这一类天上活物；中文不另加复数词尾。
- source_word: כְּאֶבֶן סַפִּיר
  choice: 仿佛蓝宝石
  rationale: 保留比较词“仿佛”，不把异象中的所见直接等同于宝石；סַפִּיר传统译为“蓝宝石”，但古代所指也可能是青金石，故加脚注说明。
- source_word: כְּמַרְאֵה דְּמוּת כִּסֵּא
  choice: 看上去好像宝座的形状
  rationale: “看上去”“好像”“形状”共同保留原文 מַרְאֶה、דְּמוּת 与比较前缀所形成的层叠近似表达，同时使现代中文自然可懂。
- source_word: נִרְאָה
  choice: 有一样东西显现
  rationale: 该尼法勒形式表示某物进入可见状态；这样译既符合中文表达，也不把未明确点明的主体武断认定为宝座。
- source_word: עֲלֵיהֶם
  choice: 在他们上方
  rationale: 代词回指基路伯，表达异象中垂直空间的位置关系。
theological_decisions:
- issue: 异象语言对宝座的认定程度
  choice: 保留“仿佛……看上去好像……形状”的多层比较，不直称所见之物就是宝座。
  alternative: 简化为“他们上方有一座蓝宝石宝座”。
  rationale: 原文有意叠加比较和形似用语，强调异象所见只能以近似语言描述；直接认定为宝座会消除原文保留的超越性与不确定程度。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留“看哪”的先知异象语体，并以“穹苍”“基路伯”延续经文意象；句中多重近似表达刻意保留原文的异象性和谨慎认定。
