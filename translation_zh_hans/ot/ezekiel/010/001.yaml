  source_fidelity: 译文总体保留了第一人称异象报告、基路伯上方的空间位置，以及“如同／好像／形状”的层叠近似语气。惟“在……穹苍那里”不够贴合原文的空间结构，也不够自然；原文先定位于基路伯头顶上方的穹苍，继而说所见之物显现在“他们”上方。修订以“穹苍之上……它们上方”保留这两个相关但各自存在的空间短语。
  naturalness: “我观看，看哪”可保留庄重的异象语体；但“在基路伯头顶之上的穹苍那里”中“那里”显得口语化且冗余。“有一样东西”也略显笨重，改为“有一物显现”更简洁自然，并适合异象叙述。
  terminology: “基路伯”“穹苍”“蓝宝石”“宝座”均合乎中文圣经语境。“蓝宝石”的脚注恰当说明 סַפִּיר 的现代矿物学认定未定，且不将“青金石”断言为唯一所指。
  issues:
