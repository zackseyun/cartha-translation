  text: וַ/יִּשְׂא֣וּ הַ/כְּרוּבִ֣ים אֶת כַּ֠נְפֵי/הֶם וַ/יֵּר֨וֹמּוּ מִן הָ/אָ֤רֶץ לְ/עֵינַ/י֙ בְּ/צֵאתָ֔/ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וַֽ/יַּעֲמֹ֗ד פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הַ/קַּדְמוֹנִ֔י וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/019.yaml
  text: Then the cherubim lifted up their wings and rose from the earth before my eyes as they went out[a], with the wheels beside them; and it stood at the entrance of the eastern gate of the house of Yahweh[c][b], and the glory of the God of Israel was above them, from above.
translation:
  language: zh_hans
  text: 基路伯举起翅膀，在我眼前离开地面升起；他们出去时，轮子在他们旁边[a]。它[b]停在雅威[c]殿宇东门的门口；以色列上帝的荣耀在他们上方，从上面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在他们旁边”也可译作“与他们相对”或“与他们并列”；希伯来文强调彼此对应的位置。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文作单数“它停在”。这里可能把基路伯和轮子所构成的整体视为一个异象载体；也有人按上下文理解为“他们停在”。
    reason: alternative_reading
  - marker: c
    text: “雅威”音译希伯来文所写的神名 YHWH；传统中文译本常译作“耶和华”或以“上主”代称。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ הַכְּרוּבִים אֶת־כַּנְפֵיהֶם
  choice: 基路伯举起翅膀
  rationale: “举起”直接表达 נשׂא 在此处所描写的动作；“基路伯”沿用现代中文圣经中对 כרובים 的通行音译。
- source_word: וַיֵּרוֹמּוּ מִן־הָאָרֶץ
  choice: 离地升起
  rationale: 简洁呈现从地面向上升腾的视觉动作，不额外判定主动或被动机制。
- source_word: לְעֵינַי
  choice: 在我眼前
  rationale: 保留以西结亲眼看见异象的见证视角，也符合现代汉语习惯。
- source_word: בְּצֵאתָם
  choice: 他们出去时
  rationale: 表达介词 ב 与不定式结构所表示的同时发生关系。
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: 轮子也在他们旁边
  rationale: לְעֻמָּתָם 表示彼此对应、相对或并列的位置；正文采用场景中自然的“旁边”，脚注保留其他空间理解。
- source_word: וַיַּעֲמֹד
  choice: 它停在
  rationale: 希伯来文动词为阳性单数；以“它”保留这一语法特征，不擅自改为复数。此处“停”比静态的“站”更适合正在移动后停驻的异象载体。
- source_word: פֶּתַח שַׁעַר בֵּית יְהוָה הַקַּדְמוֹנִי
  choice: 雅威殿东门的入口处
  rationale: 自然而紧凑地表达“雅威之殿向东之门的入口”；“殿”在圣殿语境中准确传达 בֵּית。
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל עֲלֵיהֶם מִלְמָעְלָה
  choice: 以色列上帝的荣耀在他们上方的高处
  rationale: 既保留 עֲלֵיהֶם 的“在他们上方”，也尽量呈现 מִלְמָעְלָה 所强调的高处方位，避免完全省略后者。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”是较贴近学界通常重构读音的现代中文音译，并由脚注说明。
- issue: וַיַּעֲמֹד 的主语
  choice: 保留单数，译作“它停在”
  alternative: “他们停在”，理解为基路伯和轮子；或明确译作“宝座车停在”
  rationale: 原文在复数的基路伯和轮子之后突用单数动词，主语存在真实含混。正文不将其复数化，也不把未明说的“宝座车”写入正文。
- issue: מִלְמָעְלָה 的呈现
  choice: 在他们上方的高处
  alternative: 仅译“在他们上方”；或直译“在他们上面，从上面”
  rationale: 原文同时有“在他们上方”和“从上面／高处”的方位表达；正文保留双重空间意味，同时避免生硬重复。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句子按异象中的连续动作分开，以免长句关系不清；保留单数主语、轮子方位和末尾高处表达中的原文张力，不以解释性增译消除含混。
