revisions:
- from: 他吩咐那身穿细麻衣的人说：“从旋转的轮体中、从基路伯中间取火。”那人就进去，站在一个轮子旁边。
  to: 当他吩咐那身穿细麻衣的人说：“从轮组中间、从基路伯中间取火。”时，那人就进去，站在轮子旁边。
  rationale: 补出自然的时间引介，以反映וַיְהִי בְּצַוֺּתוֹ；以“轮组”取代带有确定性动态解释的“旋转的轮体”，并用脚注保存词义选择的开放性；删除“一个”，使后半定指的“轮子”更贴近原文。命令者仍只称“他”，不作神学性指认。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:30:45Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了未明指的命令者、“身穿细麻衣的人”、两次空间短语及后半的单数“轮子”。但开头省略了וַיְהִי与בְּצַוֺּתוֹ构成的事件／时间引介；“旋转的”则把גַּלְגַּל可能含有的动态义直接确定为正文意义，超过该处词义可确定的范围。
  naturalness: “从旋转的轮体中”略显生造，且“轮体”在现代汉语中不够自然。以“轮组”配合脚注说明该词也可指轮子或轮状结构，既通顺又保留异象描写的未定性。“当……时”自然表达本句的时间关系。
  terminology: “细麻衣”“基路伯”均合宜，并与现代汉语圣经语境相称。将后半הָאוֹפָן译为“轮子”可保留其与前面גַּלְגַּל的词汇区别；不宜添加“一个”，因为原文定冠词更适合译为特指的“轮子”。
  issues:
  - severity: medium
    issue: 开头的事件／时间引介未译出
    rationale: וַיְהִי בְּצַוֺּתוֹ意为“当他吩咐……时／事情是这样：当他吩咐……时”，引出随后事件。中文不必逐字译“事情发生了”，但应以自然的时间结构体现。
  - severity: medium
    issue: “旋转的”将גַּלְגַּל的可能动态义确定化
    rationale: 该词在本异象中可指轮子、轮组或轮状结构；正文直接说“旋转的”属于可行但并非无争议的解释。采用较中性的“轮组”并以脚注列出词义范围，较能保留原文歧义。
  - severity: low
    issue: “一个轮子”弱化了定冠词的特指性
    rationale: הָאוֹפָן是“那轮子／轮子”的定指表达；汉语无需加量词“一个”，译作“轮子旁边”更自然。
  revised_text: 当他吩咐那身穿细麻衣的人说：“从轮组中间、从基路伯中间取火。”时，那人就进去，站在轮子旁边。
