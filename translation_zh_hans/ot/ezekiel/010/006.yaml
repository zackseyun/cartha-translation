base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/006.yaml
  text: And it happened[a], when he commanded the man clothed in linen, saying, “Take fire from between the wheelwork, from between the cherubim,” that he went in and stood beside the wheel.
translation:
  language: zh_hans
  text: 当他吩咐那身穿细麻衣的人说：“从轮组中间、从基路伯中间取火。”时，那人就进去，站在轮子旁边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּצַוֺּתוֹ
  choice: 他吩咐……的时候／他吩咐……说
  rationale: וַיְהִי配合בְּ加不定式构造引出随后的事件。中文以“他吩咐……说……那人就……”自然表达时间和叙事推进，无须生硬译成“事情发生了”。希伯来文只用第三人称代词，故仍译“他”，不明指其身份。
- source_word: הָאִישׁ לְבֻשׁ הַבַּדִּים
  choice: 那身穿细麻衣的人
  rationale: 保留人物的确定性及לְבֻשׁ的穿着状态；בַּדִּים在祭司性和异象语境中通常指细麻布衣物。
- source_word: קַח אֵשׁ
  choice: 取火
  rationale: 直接表达命令式“取”及宾语“火”，简洁且符合现代汉语。
- source_word: מִבֵּינוֹת לַגַּלְגַּל
  choice: 从旋转的轮体中
  rationale: גַּלְגַּל与本节后半的אוֹפָן用词不同，可指轮或旋转的轮状结构；“轮体”保留其结构性，“旋转的”传达该词的动态意象。
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: 从基路伯中间
  rationale: 保留原文重复的空间说明，并采用现代中文圣经语境中通行的“基路伯”。
- source_word: וַיָּבֹא
  choice: 那人就进去
  rationale: 上下文描写人物进入轮与基路伯所在的异象空间，“进去”比孤立的“来”更清楚；补出“那人”以避免中文代词指向含混。
- source_word: וַיַּעֲמֹד אֵצֶל הָאוֹפָן
  choice: 站在一个轮子旁边
  rationale: אוֹפָן是普通的“轮子”，与前面的גַּלְגַּל作适度区分；希伯来文为单数，中文用“一个”自然呈现。
theological_decisions:
- issue: 发出命令者的身份
  choice: 只译作“他”，不明确其身份
  alternative: 译作“耶和华”或“宝座上的那一位”
  rationale: 本节希伯来文仅以第三人称单数后缀指称命令者，并未重述身份；不把上下文推断写入正文，以保留原文的指代方式。
- issue: גַּלְגַּל所指的异象结构
  choice: 译作“旋转的轮体”
  alternative: 译作“轮子”或“轮组”
  rationale: 该词在异象中可能指轮、旋转之轮或整体轮状结构；正文兼顾动态和结构意义，同时不把它与后面的אוֹפָן完全等同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。正文保留命令者只称“他”的含混性，并以“旋转的轮体”与“一个轮子”反映原文גַּלְגַּל和אוֹפָן的词汇差异。无脚注，因此正文不设脚注标记。
