  text: וַ/יֹּ֜אמֶר אֶל הָ/אִ֣ישׁ לְבֻ֣שׁ הַ/בַּדִּ֗ים וַ/יֹּ֡אמֶר בֹּא֩ אֶל בֵּינ֨וֹת לַ/גַּלְגַּ֜ל אֶל תַּ֣חַת לַ/כְּר֗וּב וּ/מַלֵּ֨א חָפְנֶ֤י/ךָ גַֽחֲלֵי אֵשׁ֙ מִ/בֵּינ֣וֹת לַ/כְּרֻבִ֔ים וּ/זְרֹ֖ק עַל הָ/עִ֑יר וַ/יָּבֹ֖א לְ/עֵינָֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/002.yaml
  text: And he said to the man clothed in linen[a], “Go in among the wheelwork, under the cherub, and fill your hands with coals of fire from among the cherubim, and scatter them over the city.” And he went in before my eyes.
translation:
  language: zh_hans
  text: 他对那身穿细麻衣的人说：“你进去，到基路伯下面的轮组中间[a]，从基路伯中间把双手捧满火炭，撒在城上。”那人便在我眼前进去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“到轮子之间”。这里的希伯来词虽为单数，却可能统指整个轮组或轮状结构。
    reason: 词义与数的歧义
lexical_decisions:
- source_word: לְבֻשׁ הַבַּדִּים
  choice: 身穿细麻衣
  rationale: 该分词短语按衣着指认先前出现的人物；“身穿细麻衣”自然、庄重，并保留בַּדִּים所指的细麻衣料。
- source_word: בֵּינוֹת לַגַּלְגַּל
  choice: 到轮组中间[a]
  rationale: גַּלְגַּל在此为单数形式，却可能统指宝座车的轮状结构；“轮组”表达其集合意义，同时以脚注保留“轮子之间”的可能译法。
- source_word: אֶל תַּחַת לַכְּרוּב
  choice: 基路伯下面
  rationale: 原文为单数，表达空间位置；译文保留单数，不将其泛化为多个基路伯。
- source_word: וּמַלֵּא חָפְנֶיךָ
  choice: 把双手捧满
  rationale: חָפְנַיִם指双手合拢所形成的掌窝或一捧之量；此译法具体而符合现代汉语。
- source_word: גַחֲלֵי אֵשׁ
  choice: 火炭
  rationale: “火炭”简洁地保留炽热燃烧之炭的形象，不额外解释其象征意义。
- source_word: מִבֵּינוֹת לַכְּרֻבִים
  choice: 从基路伯中间
  rationale: 保留介词所表达的来源与空间关系，并按原文使用复数集合意义。
- source_word: וּזְרֹק עַל הָעִיר
  choice: 撒在城上
  rationale: “撒”适合将所捧火炭散布出去的动作；宾语可由前文自然承接，无须重复补出。
- source_word: לְעֵינָי
  choice: 就在我眼前
  rationale: 保留以西结在异象中的目击视角，“就在”也体现动作确实依命发生。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 他说
  rationale: 原文连续重复“说”，是希伯来叙事引语结构；现代汉语合并为一次“说”更自然，语义无损。
theological_decisions:
- issue: 撒火炭这一行动的性质
  choice: 正文直接呈现撒火炭于城上的命令，不明说其象征含义。
  alternative: 将其明确解释为审判，或兼具洁净意义。
  rationale: 上下文强烈指向耶路撒冷所受的审判，但本节本身没有解释火炭的象征；译文因此保留意象及其神学张力，不把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“轮组”略带视觉结构感，适合本章宝座车异象；“把双手捧满火炭”保持动作的具体性。
