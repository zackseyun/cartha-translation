  text: בְּ/לֶכְתָּ֗/ם אֶל אַרְבַּ֤עַת רִבְעֵי/הֶם֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּ֑/ם כִּ֣י הַ/מָּק֞וֹם אֲשֶׁר יִפְנֶ֤ה הָ/רֹאשׁ֙ אַחֲרָ֣י/ו יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/011.yaml
  text: When they went, they would go in any of their four directions; they did not turn as they went, for to the place where the head faced, they followed after it; they did not turn as they went.
translation:
  language: zh_hans
  text: 它们行进时，朝四个方向中的任一方向行进；行进时并不转向。头转向哪里，它们就跟随它往哪里去；行进时并不转向。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל אַרְבַּעַת רִבְעֵיהֶם
  choice: 朝四个方向中的任何一个方向
  rationale: 原文直指“它们的四个方向”，结合轮的构造表达可向四方中任一方向行进；这样既保留“四个方向”，又使现代汉语自然清楚。
- source_word: הָרֹאשׁ
  choice: 头
  rationale: 按原文保留具体而略有歧义的“头”，不擅自解释为“前方”“领头者”或某一活物。
- source_word: אַחֲרָיו יֵלֵכוּ
  choice: 它们就跟着往哪里去
  rationale: 保留“跟随其后”的关系，同时用自然汉语说明它们随头所朝之处行进。
- source_word: לֹא יִסַּבּוּ בְּלֶכְתָּם
  choice: 行进时并不转向
  rationale: 准确保留重复句及“不转动／不转向”的动作含义。
theological_decisions:
- issue: “头”所指对象不明确
  choice: 保留“头”这一原文意象，不明确其身份
  alternative: 译作“领头的”或“前头”
  rationale: 上下文与原文本身容许不同理解；译文不应以解释取代原文的含混。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语；保留原文末尾重复句的强调作用，并避免加入原文未明说的机械转动解释。
