review_pass:
  verdict: revise
  source_fidelity: 原文两次重复“行进时不转向”，译文保留了这一强调。首句的“能朝……去”却将原文叙述性的“行进／就行进”改成能力或可能性；“头朝向”也略弱于 יִפְנֶה 所表达的转向动作。
  naturalness: 现译整体通顺，但“朝四个方向中的任何一个方向去”略显重复，“能”在此也不够贴合叙事语气。改为“朝四个方向中的任一方向行进”较自然、简洁。
  terminology: “头”适当保留了 הָרֹאשׁ 的具体意象及其指涉歧义，不应改释为“领头者”或“前方”。“跟随它”对应“在它之后／随它而行”，且不额外界定“头”的身份。
  issues:
  - severity: medium
    issue: “能朝……去”带出能力或许可语气。
    rationale: בְּלֶכְתָּם…יֵלֵכוּ 描述其行进时的实际行动／惯常行动，不是说它们具备可任选方向的能力。
  - severity: low
    issue: “头朝向哪里”没有充分显出“转向”的动作。
    rationale: יִפְנֶה 的基本动作是转向；译为“头转向哪里”更贴近原文，同时仍保留“头”所指不明。
  revised_text: 它们行进时，朝四个方向中的任一方向行进；行进时并不转向。头转向哪里，它们就跟随它往哪里去；行进时并不转向。
