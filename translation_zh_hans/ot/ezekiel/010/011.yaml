revisions:
- from: 它们行进时，能朝四个方向中的任何一个方向去；行进时并不转向。头朝向哪里，它们就跟着往哪里去；行进时并不转向。
  to: 它们行进时，朝四个方向中的任一方向行进；行进时并不转向。头转向哪里，它们就跟随它往哪里去；行进时并不转向。
  rationale: 删去会改变原文语气的“能”，并以“任一方向”消除不必要的重复；将“朝向”调整为“转向”，以反映希伯来动词的动作性。其余保留原文的重复、庄重语气和“头”的歧义。
