source:
  edition: WLC
  text: וַ/יֵּצֵא֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַֽ/יַּעֲמֹ֖ד עַל הַ/כְּרוּבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/018.yaml
  text: Then the glory of Yahweh went out from above the threshold of the house and stood over the cherubim[a].
translation:
  language: zh_hans
  text: 于是，雅威的荣耀从殿[a]的门槛上方出去，停在基路伯上方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“房屋”，这里指圣殿。
    reason: 保留 הַבָּיִת 的字面意义，并说明其上下文所指。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: 该叙事动词表示向外移动；“出去”保留具体的空间动作，不额外强化为带有神学意味的“离去”。
- source_word: כְּבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: 保留原文的所属关系；“荣耀”在本异象中指雅威可见、可感知的荣耀临在。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，避免用称号取代原文的专名。
- source_word: מֵעַל מִפְתַּן
  choice: 从……门槛上方
  rationale: מֵעַל 表示从某物上方或其上的位置移开；此译法清楚保留异象中的空间关系。
- source_word: הַבָּיִת
  choice: 殿
  rationale: 原词字面为“房屋”，但在此语境明确指圣殿；汉语用“殿”既自然简洁，也由脚注保留字面信息。
- source_word: וַיַּעֲמֹד
  choice: 停在
  rationale: עמד 基本义为站立、停驻；主语“荣耀”在汉语中搭配“停在”更自然，同时保留其停止移动并驻留的画面。
- source_word: עַל הַכְּרוּבִים
  choice: 在基路伯上方
  rationale: עַל 在异象的空间关系中可指“在……之上”；“基路伯”采用现代中文圣经语体中通行的希伯来词音译，并按集合复数理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”较接近学界通常重构的读音，并保留其专名性质。“耶和华”虽是中文传统译名，但反映较晚形成的混合读法。
- issue: הַבָּיִת 应直译为“房屋”还是按语境译为“殿”
  choice: 殿
  alternative: 房屋
  rationale: 原词本义是“房屋”，这里所指却明确是圣殿。正文采用自然且庄重的“殿”，脚注注明希伯来文的字面表达，以免掩盖原文措辞。
- issue: וַיַּעֲמֹד 描述荣耀“站立”还是“停驻”
  choice: 停在
  alternative: 立在
  rationale: 原动词可表示站立或停驻。由于主语是“荣耀”，现代汉语说“停在”更自然，并未把其位格性或异象性质作进一步解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“于是”承接异象叙事；两个“上方”有意保留原文 מֵעַל 与 עַל 的空间呼应。脚注标记紧随其所说明的“殿”。
