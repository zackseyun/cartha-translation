base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/008.yaml
  text: And the cherubim appeared to have the form of a human hand under their wings[a].
translation:
  language: zh_hans
  text: 在基路伯的翅膀下面，显出了人手的形状[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“人的手的形状。”
    reason: 说明希伯来文 תַּבְנִית יַד אָדָם 的结构，并保留“形状”与“手”之间可能略显重复但重要的表达。
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 显出了
  rationale: 尼法勒式在这里表达被看见、显现出来的视觉意义；“显出了”既保留被观察到的意味，也符合异象叙述的自然汉语。
- source_word: לַכְּרֻבִים
  choice: 在基路伯的翅膀下面
  rationale: 此前置词与被动视觉动词的搭配不宜机械译为“向基路伯”；结合整句，可自然地将所见之物定位于基路伯翅膀下面。
- source_word: תַּבְנִית
  choice: 形状
  rationale: 此词可指形状、样式或形像；这里描述异象中可见的外形，“形状”准确而通顺。
- source_word: יַד אָדָם
  choice: 人手
  rationale: 直译为“人的手”。现代汉语“人手”在此清楚表示人的手，与非人的基路伯形成对照，也不额外限定为某个男性个体。
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: 在……的翅膀下面
  rationale: 直接表达空间位置；“翅膀下面”自然、清楚。
theological_decisions:
- issue: 异象中 אָדָם 的译法
  choice: 人手
  alternative: 一个男人的手／人的手
  rationale: אָדָם 在这里限定“手”的种类，重点是人的形态，而非强调性别或某一男子。“人手”保留这一对比，避免加入原文未明确强调的男性含义。
- issue: וַיֵּרָא 的句法视角
  choice: 显出了人手的形状
  alternative: 可以看见人手的形状／基路伯显得有人的手
  rationale: 选择不明说观察者的显现式表达，保留希伯来文被动视觉形式及异象叙述的开放性，不把句子改写成基路伯“拥有”手。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“基路伯”为中文圣经传统中通行的音译；语序调整为先交代位置，再陈述所见形状，以符合现代汉语习惯，同时保留原文的视觉焦点。
