  yaml_path: translation/ot/ezekiel/010/013.yaml
  text: As for the wheels[a], they were called “the whirling wheel” in my hearing.
translation:
  language: zh_hans
  text: 至于那些轮子，我亲耳听见它们被称为“旋轮”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “旋轮”或译“轮”。这里的希伯来语 גַּלְגַּל 可指轮或旋转之物，与本节前面译作“轮子”的 אֹופַנִּים 并非同一个词。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֹופַנִּים
  choice: 至于那些轮子
  rationale: 句首的 לְ 在这里引出话题，而非表示移动方向；“至于”自然地体现了“论到这些轮子”的篇章功能。
- source_word: לָהֶם קוֹרָא
  choice: 它们被称为
  rationale: 原文形式可直译为“向着它们称呼”或“有人称它们”，在本句中表达命名；汉语用被动式最自然，同时不擅自补出称呼者。
- source_word: הַגַּלְגַּל
  choice: 旋轮
  rationale: גַּלְגַּל 可指轮、旋转之物或轮状装置。“旋轮”保留其单数形式和旋转意象，也与前面的 אֹופַנִּים（“轮子”）有所区别。
- source_word: בְּאָזְנָי
  choice: 我亲耳听见
  rationale: 这是表示话语确实传入先知耳中的惯用表达；“我亲耳听见”符合现代汉语，并保留第一人称听觉见证。
theological_decisions: []
