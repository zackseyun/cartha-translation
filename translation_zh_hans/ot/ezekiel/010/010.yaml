  text: As for their appearance[a], the four of them had one likeness[b], as when a wheel is within a wheel.
translation:
  language: zh_hans
  text: 至于它们的外观，它们四个的形状完全一样[a]，仿佛轮中有轮[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“四个的形状相同。”希伯来文强调四者具有完全一致的形状。
    reason: lexical_alternative
  - marker: b
    text: 直译：“如同轮在轮中。”
    reason: literal_rendering
lexical_decisions:
- source_word: וּמַרְאֵיהֶם
  choice: 至于它们的外观
  rationale: מַרְאֶה指可见的外观或形态；用“至于”自然地体现前缀连词在此引出话题的篇章功能。
- source_word: דְּמוּת אֶחָד
  choice: 同一个样式
  rationale: דְּמוּת可指样式、形态或相像之处，与אֶחָד连用，强调四者具有一致的形态；“同一个样式”在现代汉语中自然，也保留具体的视觉意味。
- source_word: לְאַרְבַּעְתָּם
  choice: 四个都是
  rationale: 该词组表明这一共同样式适用于全部四个；“四个都是”简洁地传达全体一致的意思。
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: 仿佛
  rationale: 该比较结构引出视觉类比；“仿佛”符合汉语表达，并不强行限定未完成式的时间含义。
- source_word: הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: 轮中套轮
  rationale: 原文直陈“轮在轮中”。“轮中套轮”保留两个轮彼此嵌套的异象画面，同时符合简洁自然的现代汉语。
