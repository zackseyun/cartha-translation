source:
  edition: WLC
  text: וַ/יָּ֤רָם כְּבוֹד יְהוָה֙ מֵ/עַ֣ל הַ/כְּר֔וּב עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּמָּלֵ֤א הַ/בַּ֨יִת֙ אֶת הֶ֣/עָנָ֔ן וְ/הֶֽ/חָצֵר֙ מָֽלְאָ֔ה אֶת נֹ֖גַהּ כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/004.yaml
  text: And the glory of Yahweh rose up from above the cherub to the threshold of the house[a], and the house was filled with the cloud[b], and the court was filled with the brightness of the glory of Yahweh.
translation:
  language: zh_hans
  text: 雅威的荣耀从基路伯[a]上方升起，移到殿[b]的门槛上。殿里充满了云，院子也充满了雅威荣耀的光辉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“基路伯”在这里是单数；也可译作“从基路伯之上”。
    reason: lexical_alternative
  - marker: b
    text: “殿”原文直译为“房屋”，在这里指圣殿建筑。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָם
  choice: 升起，移到
  rationale: רוּם在此表达荣耀升起并沿后续“从……到……”的路径移动。中文用“升起，移到”既保留向上的动态，也清楚表达目的地，不把它解释成被动抬起。
- source_word: כְּבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: כָּבוֹד在异象中指神显现的荣耀；保留原文重复。专名יְהוָה音译为“雅威”，直接呈现立约之名。
- source_word: מֵעַל הַכְּרוּב
  choice: 从基路伯上方
  rationale: מֵעַל表示从上方或其上的位置离开；כְּרוּב在本节为单数，因此不协调成复数。
- source_word: עַל מִפְתַּן הַבָּיִת
  choice: 移到殿的门槛上
  rationale: 在移动语境中，עַל可指到达或落在某处；מִפְתָּן是“门槛”。הַבַּיִת按圣殿异象的语境译为自然的“殿”，并以脚注注明其字面意义。
- source_word: וַיִּמָּלֵא הַבַּיִת אֶת הֶעָנָן
  choice: 殿里充满了云
  rationale: 用现代汉语的处所句自然表达殿被云充满；定冠词所指的特定神显之云不必在中文另加指示词。
- source_word: וְהֶחָצֵר מָלְאָה
  choice: 院子也充满了
  rationale: חָצֵר指圣殿的院子；“也”自然传达两个空间相继被充满的并列关系。
- source_word: נֹגַהּ
  choice: 光辉
  rationale: נֹגַהּ指发亮的光或辉耀；“光辉”在现代中文中清楚、庄重，并与“荣耀”搭配自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近通行学术重构读音的“雅威”，而不以“主”代替，以保留其专名性质。
- issue: “荣耀”的性质
  choice: 保留“雅威的荣耀”，不改写为“雅威本人”或“神的同在”
  alternative: 雅威的同在
  rationale: כְּבוֹד既可体现神显的临在，又在叙事中作为可移动、发光的异象实体出现；直译能保留这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“殿里”和“院子”比生硬的被动句更符合普通话表达；保留“荣耀”“光辉”等异象用语及原文两次“雅威”的重复。
