base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/022.yaml
  text: And the likeness of their faces was the same as the faces that I had seen by the Kebar River—their appearances and themselves[b][a]. Each one went straight ahead.
translation:
  language: zh_hans
  text: 他们面容的样式，正是我在迦巴鲁河边所见的那些面容；他们的形貌和他们本身也是如此。[a]他们各自径直向前行进。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“他们的形貌和他们本身”，强调这里所见的与以西结先前在迦巴鲁河边所见的是同一批。
    reason: lexical_alternative
  - marker: b
    text: 直译为“各自朝自己面前的方向行进”，意思是他们不转向旁边，而是径直前行。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת פְּנֵיהֶם
  choice: 他们面容的样式
  rationale: דְּמוּת可指样式、形状或相似之处；译作“样式”既保留以西结异象叙述中的具体视觉语言，也不把它弱化为泛泛的“外观”。פָּנִים按具体义译为“面容”。
- source_word: הֵמָּה הַפָּנִים אֲשֶׁר רָאִיתִי
  choice: 正是……见过的那些面容
  rationale: הֵמָּה带有强调和等同作用；“正是”自然地传达这种语气。“见过”表明这是先前异象中所见的面容。
- source_word: עַל נְהַר כְּבָר
  choice: 在迦巴鲁河边
  rationale: עַל在河流地点语境中可自然译作“在……河边”；כְּבָר按专名音译为“迦巴鲁”。
- source_word: מַרְאֵיהֶם וְאוֹתָם
  choice: 他们的形貌和他们本身，也都与先前所见的一样
  rationale: 原文是压缩的无动词表达，直陈“他们的形貌和他们本身”。译文保留“形貌”与“本身”两个成分，并补出上下文隐含的等同关系，使现代汉语清楚而不抹去原文的强调。
- source_word: אִישׁ אֶל עֵבֶר פָּנָיו יֵלֵכוּ
  choice: 他们各自径直向前行进
  rationale: 字面是“各自朝自己面前的方向行进”，在本书语境中表示不转向旁边而直行；“径直向前”以自然汉语传达这一惯用含义。
