  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ/כְּרֻבִ֗ים עֹֽמְדִ֛ים מִ/ימִ֥ין לַ/בַּ֖יִת בְּ/בֹא֣/וֹ הָ/אִ֑ישׁ וְ/הֶ/עָנָ֣ן מָלֵ֔א אֶת הֶ/חָצֵ֖ר הַ/פְּנִימִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/003.yaml
  text: The cherubim were standing on the right side of the house when the man went in[a], and the cloud filled the inner court.
translation:
  language: zh_hans
  text: 那人进去的时候，基路伯站在殿的右边[a]，云彩充满了内院。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“殿的右边”；按圣殿的方位，这是指南边。
    reason: 说明字面方位词及其在圣殿朝向中的实际所指。
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指这些天上的活物；希伯来语的复数在中文中由语境表达，无须另加复数词尾。
- source_word: עֹמְדִים
  choice: 站
  rationale: 分词描写当时持续的姿态；中文在“……的时候”所建立的场景中用“站”自然表达这一状态。
- source_word: מִימִין לַבַּיִת
  choice: 在殿的右边
  rationale: 按字面保留“右边”，不在正文中直接解释为“南边”；“殿”符合圣殿建筑语境，也比泛称“房屋”自然。
- source_word: בְּבֹאוֹ הָאִישׁ
  choice: 那人进去的时候
  rationale: 介词加不定式结构表达时间关系；“那人”保留原文简洁的回指，不在正文补入“身穿细麻衣”。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: 保留定指语境所指的云，不在正文中增添其神学身份或性质。
- source_word: מָלֵא
  choice: 充满了
  rationale: 完成式在叙事中陈述已经发生的动作；“了”自然体现事件的完成。
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: 内院
  rationale: 简洁、通行地表达圣殿建筑中的内院，并保留与外院相对的空间区分。
theological_decisions:
- issue: 圣殿方位中“右边”的理解
  choice: 正文译作“殿的右边”，脚注说明这是南边
  alternative: 正文直接译作“殿的南边”
  rationale: 希伯来文明确使用“右边”，而“南边”是根据圣殿朝向得出的空间解释。正文保留原文表达，脚注帮助现代读者理解其实际方位，避免把解释无提示地写入正文。
- issue: “那人”的身份
  choice: 仅译作“那人”
  alternative: 译作“那身穿细麻衣的人”
  rationale: 本节原文只说“那人”；其身份由上文交代。保留简短回指可避免在本节增补原文没有重复的信息。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句首不另加“现在”等原文没有的时间词；调整语序，把时间从句置前，使中文流畅，同时保留两个并列场景：基路伯的位置与云彩充满内院。
