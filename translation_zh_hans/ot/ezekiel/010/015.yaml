base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/015.yaml
  text: And the cherubim rose up[a]. They were the living creature that I had seen by the Kebar Canal.
translation:
  language: zh_hans
  text: 基路伯升了上去[a]。这就是我在迦巴鲁河边所看见的活物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在复数“基路伯”之后说“这就是那活物”，使用单数形式，借此认定这些基路伯就是先前所见的活物。末句也可译作“在迦巴鲁运河边”。
    reason: 说明原文单复数之间的张力，并提供נְהַר在巴比伦地理背景下的另一种译法。
lexical_decisions:
- source_word: וַיֵּרֹמּוּ
  choice: 升了上去
  rationale: רוּם在此描述向上升起；译为“升了上去”自然地表达异象中的上升动作，又不额外指定外力施动。
- source_word: הַכְּרוּבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行且庄重的名称；希伯来语虽为复数，中文名词本身无需另加复数标记。
- source_word: הִיא הַחַיָּה
  choice: 这就是……活物
  rationale: 原文代词和名词均为阴性单数，而前项“基路伯”为复数。“这就是……活物”保留单数形式及其认同作用，同时避免在中文中强行消解数的不一致。
- source_word: אֲשֶׁר רָאִיתִי
  choice: 我……所看见的
  rationale: 关系从句指向先前的观看；中文用“所看见的”即可自然表达这一先行事件，无须另加过去完成时标记。
- source_word: בִּנְהַר כְּבָר
  choice: 在迦巴鲁河边
  rationale: נְהַר可指河流或运河；正文采用传统而易懂的“河”，并以脚注说明巴比伦背景下“运河”的可能性。专名按希伯来语音译为“迦巴鲁”。
theological_decisions:
- issue: 基路伯与以西结书第一章活物的认同
  choice: 保留原文单数表达，译作“这就是……活物”
  alternative: 按所指对象的复数意义译作“这些就是……活物”或“它们就是……活物”
  rationale: 原文在复数“基路伯”之后使用阴性单数代词和单数名词，可能把这些基路伯作为一个整体或一类异象中的存在来认定。中文正文保留这种数的张力，不将其直接改写为复数。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保持简洁的异象叙事语气，以“这就是……活物”尽量呈现希伯来文由复数主项转为单数认同语的特殊结构。
