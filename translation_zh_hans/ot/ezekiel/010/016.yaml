base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/016.yaml
  text: When the cherubim moved[a], the wheels moved beside them; and when the cherubim lifted up their wings to rise from the earth, the wheels also did not turn away from beside them.
translation:
  language: zh_hans
  text: 基路伯行进时，轮子也在他们旁边行进；基路伯扬起翅膀，从地上升起时，轮子也不从他们身旁转开[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“轮子也不偏离他们身旁。”希伯来文既有“转开”的动作含义，也强调轮子没有离开基路伯身旁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלֶכֶת הַכְּרוּבִים
  choice: 基路伯行进时
  rationale: ב 加不定式构成时间从句；הלך 在异象中描述整体移动，译作“行进”自然且庄重。כְּרוּבִים 采用现代中文圣经语境中通行的音译“基路伯”，其形式不另标复数。
- source_word: יֵלְכוּ הָאוֹפַנִּים אֶצְלָם
  choice: 轮子也在他们旁边行进
  rationale: אוֹפַנִּים 明确指“轮子”，אֶצְלָם 表示在其旁边。汉语补出“也”，自然体现轮子与基路伯协调同行的关系。
- source_word: וּבִשְׂאֵת הַכְּרוּבִים אֶת כַּנְפֵיהֶם
  choice: 基路伯扬起翅膀……时
  rationale: ב 加 נשׂא 的不定式再次引出时间从句；“扬起翅膀”符合现代汉语搭配，并保留主动举翼的画面。
- source_word: לָרוּם מֵעַל הָאָרֶץ
  choice: 从地上升起
  rationale: רוּם 表示上升，מֵעַל הָאָרֶץ 在此指离开地面向上；“从地上升起”清楚而不生硬。
- source_word: לֹא יִסַּבּוּ הָאוֹפַנִּים גַּם הֵם מֵאֶצְלָם
  choice: 轮子也不从他们身旁转开
  rationale: סבב 的尼法勒式可表示转向或转离；结合 מֵאֶצְלָם 的分离含义，译为“不从他们身旁转开”，既保留“转”的动作，也表达没有离开基路伯身旁。
theological_decisions: []
