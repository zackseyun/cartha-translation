base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/014.yaml
  text: 'And each one had four faces: the face of the first was the face of the cherub[a], and the face of the second was the face of a man, and the third the face of a lion[b], and the fourth the face of an eagle.'
translation:
  language: zh_hans
  text: 每一个都有四张脸：第一张是基路伯的脸[a]，第二张是人的脸，第三张是狮子的脸，第四张是鹰的脸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 以西结书1:10把相对应的脸描述为牛的脸；这里的希伯来文本作“基路伯”。
    reason: cross_reference
  - marker: b
    text: “鹰”也可译作“鹫”；这个希伯来词可泛指大型猛禽。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעָה פָנִים לְאֶחָד
  choice: 每一个都有四张脸
  rationale: 希伯来文是无动词句，直译为“每一个有四张脸”；补出“都有”可自然表达 לְאֶחָד 的逐一分配含义。
- source_word: פְּנֵי הָאֶחָד
  choice: 第一张
  rationale: הָאֶחָד 在与“第二、第三、第四”并列的序列中具有序数作用；按中文习惯译为“第一张”，并由后文补出“脸”。
- source_word: הַכְּרוּב
  choice: 基路伯
  rationale: 保留希伯来文明确使用的“基路伯”，不将其协调为以西结书1:10中的“牛”。“基路伯”是现代中文圣经语境中通行且庄重的名称。
- source_word: אָדָם
  choice: 人
  rationale: 此处指人的面貌，与动物的脸并列；中文“人的脸”自然准确，无须加入源文没有明确表达的性别限定。
- source_word: אַרְיֵה
  choice: 狮子
  rationale: 这是普通的动物名称；“狮子的脸”符合现代汉语表达。
- source_word: נָשֶׁר
  choice: 鹰
  rationale: נָשֶׁר 通常指大型猛禽，传统上多译作“鹰”，但也可能指秃鹫等大型食腐猛禽，因此在脚注保留词义上的另一可能。
theological_decisions:
- issue: 本节“基路伯的脸”与以西结书1:10“牛的脸”的关系
  choice: 按本节希伯来文本译作“基路伯的脸”
  alternative: 为与以西结书1:10一致而译作“牛的脸”，或释为“牛形的基路伯之脸”
  rationale: 本节马所拉文本明确写作 הַכְּרוּב（“基路伯”）。译文应保留经文本身的差异和张力，不以协调性解释取代原文；相关平行经文放入脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“四张脸”保持异象描写的具体性，并用“第一张、第二张、第三张、第四张”清楚呈现原文的列举结构。
