id: EZK.10.17
reference: Ezekiel 10:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/עָמְדָ֣/ם יַעֲמֹ֔דוּ וּ/בְ/רוֹמָ֖/ם יֵר֣וֹמּוּ אוֹתָ֑/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/017.yaml
  text: When they stood still[a], these stood still; and when they were lifted up, these were lifted up with them, for the spirit of the living creature was in them.
translation:
  language: zh_hans
  text: 活物停住时，轮子也停住；它们升起时，轮子也随着它们升起，因为活物的灵[a]在轮中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“生命之灵”；“灵”也可有“气息”或“风”的含义。
    reason: 保留 רוּחַ 与 הַחַיָּה 的词义范围，以及将该短语作较抽象理解的可能。
lexical_decisions:
- source_word: בְּעָמְדָם
  choice: 它们停住时
  rationale: 介词 בְּ 加带第三人称阳性复数后缀的不定式构造在此表示时间；“停住”结合上下文清楚表达活物停止移动。
- source_word: יַעֲמֹדוּ
  choice: 轮子也停住
  rationale: 动词主语由上下文承接为轮子；明说“轮子”可在现代汉语中避免两个复数代词所指混淆，“也”体现动作的对应关系。
- source_word: וּבְרוֹמָם
  choice: 它们升起时
  rationale: 与前一时间分句平行；רום 在异象语境中指向上移动，因此译作“升起”，不取“被尊崇”之义。
- source_word: יֵרוֹמּוּ אוֹתָם
  choice: 轮子也同它们一起升起
  rationale: 表达轮子与活物同步上升的关系；“同它们一起”自然传达 אוֹתָם 在此处结合语境所体现的伴随意义。
- source_word: כִּי
  choice: 因为
  rationale: 引出轮子与活物动作一致的原因，现代汉语中“因为”比文言色彩较重的“原来”更直接。
- source_word: רוּחַ
  choice: 灵
  rationale: 此处指使活物行动、并解释轮子同步运动的内在动力；“灵”保留该词也可涉及气息、风的语义张力。
- source_word: הַחַיָּה
  choice: 活物
  rationale: 按以西结异象中的既定称谓翻译；希伯来文为单数，可作集合性或指这一类异象活物，不擅自改成复数。
- source_word: בָּהֶם
  choice: 在轮子里面
  rationale: 所指为轮子；明说名词可消除中文“它们”可能指活物或轮子的歧义，同时保留简单的内在位置关系。
theological_decisions:
- issue: 异象中 רוּחַ הַחַיָּה 的含义
  choice: 活物的灵
  alternative: 生命之灵／活物的气息或风
  rationale: 最自然的句法理解是“活物的灵”，说明轮子为何与活物完全同步；但 רוּחַ 可指灵、气息或风，הַחַיָּה 也可能被较抽象地理解为“生命”，故以脚注保留真正的词义张力，不把异象简化为机械动力或纯粹自然风。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。为避免连续“它们”造成指代混乱，在原文依靠上下文省略主语之处明确补出“轮子”；“活物”则保持以西结异象的传统且准确称谓。
