source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ הַ/כְּר֨וּב אֶת יָד֜/וֹ מִ/בֵּינ֣וֹת לַ/כְּרוּבִ֗ים אֶל הָ/אֵשׁ֙ אֲשֶׁר֙ בֵּינ֣וֹת הַ/כְּרֻבִ֔ים וַ/יִּשָּׂא֙ וַ/יִּתֵּ֔ן אֶל חָפְנֵ֖י לְבֻ֣שׁ הַ/בַּדִּ֑ים וַ/יִּקַּ֖ח וַ/יֵּצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/007.yaml
  text: Then the cherub stretched out his hand from among the cherubim to the fire that was among the cherubim[a], and he lifted it up and put it into the palms of the one clothed in linen[b], who took it and went out.
translation:
  language: zh_hans
  text: 于是，那基路伯从众基路伯中伸出手，伸向那在众基路伯中间的火[a]；他拿起火，放在那身穿细麻衣者的双掌中[b]。那身穿细麻衣者接过火，就出去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较形式地说，是“那基路伯从众基路伯之间伸出手，伸向那在众基路伯之间的火”。
    reason: lexical_alternative
  - marker: b
    text: 直译是“放到那身穿细麻衣者的双掌中”；按上下文，这就是10:2、10:6所说“身穿细麻衣的人”。
    reason: cross_reference
lexical_decisions:
- source_word: הַכְּרוּב
  choice: 一个基路伯
  rationale: 原文为带定冠词的单数，聚焦其中一个基路伯的行动；中文加“一个”自然地表达从众基路伯中特指一位，同时保留“基路伯”这一专称。
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: 伸手
  rationale: 该搭配在此指把手伸出去；“伸手”准确、简洁，并保留动作的具体性。
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: 从众基路伯中
  rationale: 表达行动者原先位于众基路伯之间或当中；中文“从……中”自然，并保留空间含义。
- source_word: הָאֵשׁ אֲשֶׁר בֵּינוֹת הַכְּרֻבִים
  choice: 那在众基路伯中间的火
  rationale: 保留原文对“火”的限定及重复的空间描述；“中间”也让“在……之间”的较形式对应清楚可见。
- source_word: וַיִּשָּׂא
  choice: 拿起火来
  rationale: 动词可表示拿起、举起或带走；宾语在原文中省略，但语境明确承接“火”，中文补出“火”可避免代词指向含混，又不额外规定是火、炭或火炭中的哪一种形态。
- source_word: וַיִּתֵּן
  choice: 放在
  rationale: 基本义为“给”，但此处描写把所取之火交到对方掌中；“放在……掌中”符合具体场景，也保持动作次序。
- source_word: חָפְנֵי
  choice: 掌中
  rationale: 该词指双手捧物时的掌心或手窝；“掌中”比泛称“手中”更贴近原词，同时在现代中文中自然。
- source_word: לְבֻשׁ הַבַּדִּים
  choice: 那身穿细麻衣者
  rationale: 本节字面只说“穿细麻衣的”，未重复“人”或“男人”；用“者”保留原文的简约表达，脚注交代上下文身份。
- source_word: וַיִּקַּח וַיֵּצֵא
  choice: 那人接过来，就出去了
  rationale: 主语转为身穿细麻衣者；中文补用“那人”以清楚标明主语转换，而“接过来”自然表达他收下方才递来的火。
theological_decisions:
- issue: 接受者的身份
  choice: 正文称“那身穿细麻衣者”
  alternative: 那身穿细麻衣的人／那身穿细麻衣的男子
  rationale: 上下文在10:2、10:6明确称其为身穿细麻衣的人，但本节本身只用分词结构“身穿细麻衣者”。正文不把上下文中的名词提前写入该短语，脚注则说明其与前文人物相同。
- issue: 所拿起之物的具体形态
  choice: 火
  alternative: 火炭／一些火
  rationale: 本节直接先行词是“火”，而具体拿起的对象在后续动词处省略；译作“火”顺承原文，不将上下文中的炭火形态或未明说的数量强行具体化。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“基路伯”沿用通行圣经专名；以短句和显明的主语转换避免希伯来语连续动词在中文里造成歧义。正文中的[a]、[b]均与脚注对应。
