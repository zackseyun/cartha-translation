  text: וְ/כָל בְּשָׂרָ/ם֙ וְ/גַבֵּ/הֶ֔ם וִֽ/ידֵי/הֶ֖ם וְ/כַנְפֵי/הֶ֑ם וְ/הָ/אֽוֹפַנִּ֗ים מְלֵאִ֤ים עֵינַ֨יִם֙ סָבִ֔יב לְ/אַרְבַּעְתָּ֖/ם אוֹפַנֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/012.yaml
  text: And all their bodies[a], their backs, their hands, their wings[b], and the wheels were full of eyes all around—the wheels belonging to the four of them.
translation:
  language: zh_hans
  text: 它们的全身[a]、背部、手和翅膀，以及轮子，四周都布满了眼睛；这些轮子属于它们四个。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“它们所有的肉体”。
    reason: lexical_alternative
  - marker: b
    text: 末句也可较简洁地译作“它们四个的轮子”或“它们的四个轮子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂרָם
  choice: 它们的全身
  rationale: בָּשָׂר 字面为“肉体”，在此与背部、手、翅膀并列，指这些活物整个有形的身体；“全身”在现代汉语中自然，也保留整体性的意思。
- source_word: גַבֵּיהֶם
  choice: 背部
  rationale: 上下文列举身体部位，因此取解剖意义的“背部”，不取其他语境中可能有的“边缘”或“高度”等义。
- source_word: וִידֵיהֶם
  choice: 手
  rationale: יָד 的通常意义是“手”；本节没有充分理由扩大译作“手臂”。
- source_word: וְכַנְפֵיהֶם
  choice: 翅膀
  rationale: כָּנָף 在以西结异象中的常规具体意义是“翅膀”。
- source_word: וְהָאוֹפַנִּים / אוֹפַנֵּיהֶם
  choice: 轮子 / 这些轮子
  rationale: אוֹפַן 指“轮子”。末尾 אוֹפַנֵּיהֶם 再次提及轮子，并说明它们与四个活物的关系；中文以“这些轮子”承接前文。
- source_word: מְלֵאִים עֵינַיִם סָבִיב
  choice: 四周都布满了眼睛
  rationale: 原文直译为“四周满了眼睛”；“布满了眼睛”是自然、具体的现代汉语，同时保存环绕各处的图像。
- source_word: לְאַרְבַּעְתָּם
  choice: 属于它们四个
  rationale: 介词 לְ־ 在这里表达轮子与四个活物之间的关联或归属；“属于它们四个”使关系清楚，同时不进一步解释异象的机械结构。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“它们”指异象中的活物；保留“手”“翅膀”“轮子”“眼睛”等具体意象，不作象征性解释。末句以分号呈现原文对“轮子”的复述和说明。
