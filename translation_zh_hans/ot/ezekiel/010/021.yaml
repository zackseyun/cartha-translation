id: EZK.10.21
reference: Ezekiel 10:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַרְבָּעָ֨ה אַרְבָּעָ֤ה פָנִים֙ לְ/אֶחָ֔ד וְ/אַרְבַּ֥ע כְּנָפַ֖יִם לְ/אֶחָ֑ד וּ/דְמוּת֙ יְדֵ֣י אָדָ֔ם תַּ֖חַת כַּנְפֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/021.yaml
  text: Each one had four faces[a], and each one had four wings, and the likeness of human hands was under their wings.
translation:
  language: zh_hans
  text: 每个都有四张脸和四只翅膀；在它们的翅膀下面，有人的手的样式。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“有仿佛人手的形状。”
    reason: “人的手的样式”译出דְּמוּת的“样式、相似形态”；此译法以“仿佛……的形状”明确呈现该类比性。
lexical_decisions:
- source_word: אַרְבָּעָה אַרְבָּעָה ... לְאֶחָד
  choice: 每一个各有四张
  rationale: 数词重复并配合“每一个”，表达逐一分配的意思；“每一个各有四张”在中文中清楚传达每个活物都有四张脸。
- source_word: פָנִים
  choice: 脸
  rationale: 该词形式为复数；与数词“四”连用时，现代汉语用量词“张”自然表达“四张脸”。
- source_word: וְאַרְבַּע כְּנָפַיִם לְאֶחָד
  choice: 四个翅膀
  rationale: 承接前面的分配结构，表明每一个都有四个翅膀；中文合并重复的“每一个各有”，使句子简洁而不损失意义。
- source_word: וּדְמוּת
  choice: 仿佛……的形状
  rationale: 保留以西结异象叙述中“相似、形似”而非完全等同的表达，同时使现代汉语自然易懂。
- source_word: יְדֵי אָדָם
  choice: 人手
  rationale: אָדָם在此泛指人类，重点是手具有人形特征，并非指特定男性；“人手”简洁地保留这一对比。
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: 它们的翅膀下面
  rationale: 直接表达空间关系；复数代词指向前文所述的活物。
theological_decisions:
- issue: אָדָם是译作泛指人类的“人”，还是带男性含义的“男人”
  choice: 人手
  alternative: 男人的手
  rationale: 上下文是在描述这些活物的手具有人的形态，而不是强调性别；因此采用泛指人类的“人”。
- issue: דְּמוּת是否表达实际存在的手，还是仅表达相似形态
  choice: 仿佛人手的形状
  alternative: 人的手
  rationale: 原词明确保留异象中的类比性质；译文不把“形似”默默确定为完全等同。
translation_notes:
  register: 采用现代、庄重而清楚的叙述语体。“每一个各有”凸显希伯来文的分配结构；后半句保留异象语言中的类比性。
