source:
  edition: WLC
  text: וְ/קוֹל֙ כַּנְפֵ֣י הַ/כְּרוּבִ֔ים נִשְׁמַ֕ע עַד הֶ/חָצֵ֖ר הַ/חִיצֹנָ֑ה כְּ/ק֥וֹל אֵל שַׁדַּ֖י בְּ/דַבְּרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/005.yaml
  text: And the sound of the wings of the cherubim was heard as far as the outer court[a], like the sound of God Almighty when he speaks.
translation:
  language: zh_hans
  text: 基路伯翅膀的响声传到外院，仿佛全能的上帝说话时的声音。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“伊勒·沙代（El Shaddai）说话时的声音”。“伊勒·沙代”是上帝的一个称号，传统上译作“全能的上帝”；“沙代”的确切词义并不确定。
    reason: 保留神圣称号的原文形式及其词义不确定性。
lexical_decisions:
- source_word: וְקוֹל
  choice: ……的响声
  rationale: קוֹל可指声音、响声或嗓音；此处由翅膀发出，译为“响声”自然明确。句首וְ承接上文，汉语无需机械译出“并且”。
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: 基路伯翅膀
  rationale: כַּנְפֵי是“翅膀”的复数附属形；כְּרוּבִים采用现代中文圣经语境中通行的“基路伯”，保留特定受造物的称谓。
- source_word: נִשְׁמַע עַד
  choice: 传到
  rationale: נִשְׁמַע为被动，意为“被听见、可以听见”，עַד表示所及范围；中文“响声传到外院”自然表达声音远至那里都可听见。
- source_word: הֶחָצֵר הַחִיצֹנָה
  choice: 外院
  rationale: 在圣殿场景中，חָצֵר指院子，חִיצֹנָה指外面的；“外院”简洁且符合中文宗教建筑语境。
- source_word: כְּקוֹל
  choice: 仿佛……的声音
  rationale: כְּ保留明喻关系；קוֹל在涉及上帝说话时译作“声音”，与前面的翅膀“响声”形成自然对照。
- source_word: אֵל שַׁדַּי
  choice: 全能的上帝
  rationale: 这是上帝的称号；“全能的上帝”传达传统理解，同时以脚注保留音译及词义上的不确定性。
- source_word: בְּדַבְּרוֹ
  choice: 说话时
  rationale: 介词בְּ加不定式附属形及第三人称单数后缀，可表达时间情境，即“他／上帝说话时”；中文直接以“上帝说话时”避免代词指向含混。
theological_decisions:
- issue: 神圣称号 אֵל שַׁדַּי 的译法
  choice: 全能的上帝
  alternative: 伊勒·沙代（El Shaddai）
  rationale: 正文翻译称号以便普通读者理解；但שַׁדַּי的确切词源和含义并非完全确定，因此脚注保留希伯来称号的音译，不把“全能”表述为无争议的词源结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“响声传到外院”比直译为“在外院被听见”更符合汉语表达，同时保留声音所及范围。脚注标记置于整句末，清楚对应“全能的上帝”这一译法。
