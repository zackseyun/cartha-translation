  text: הִ֣יא הַ/חַיָּ֗ה אֲשֶׁ֥ר רָאִ֛יתִי תַּ֥חַת אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּֽ/נְהַר כְּבָ֑ר וָ/אֵדַ֕ע כִּ֥י כְרוּבִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/020.yaml
  text: This was the living creature that I saw beneath the God of Israel by the Kebar Canal[a], and I knew that they were cherubim.
translation:
  language: zh_hans
  text: 这就是我在迦巴鲁水道[a]旁、在以色列的神下面所看见的活物；我就知道它们是基路伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“迦巴鲁河”；这里的希伯来词既可指河流，也可指运河或水道。
    reason: 词义在“河流”与人工水道之间存在真实的翻译选择；正文采用更符合巴比伦地理背景的“水道”，脚注保留另一可能译法。
lexical_decisions:
- source_word: הִיא הַחַיָּה
  choice: 这就是……活物
  rationale: 阴性单数代词回指前文异象中的活物。“这就是”自然表达以西结对先前所见对象的追认；“活物”保留异象术语，又不将其误解为普通动物。
- source_word: אֲשֶׁר רָאִיתִי
  choice: 我……所看见的
  rationale: 以现代汉语定语结构准确表达关系从句，并保持叙事的回顾语气。
- source_word: תַּחַת אֱלֹהֵי יִשְׂרָאֵל
  choice: 在以色列的神下面
  rationale: 保留 תַּחַת 的空间含义和宝座异象的垂直布局，不将其抽象化为权柄或从属关系。
- source_word: בִּנְהַר כְּבָר
  choice: 在迦巴鲁水道旁
  rationale: 介词在此表示地点；巴比伦地理背景下 נְהַר 很可能指水道或运河。“旁”符合自然汉语，“迦巴鲁”沿用中文圣经中较熟悉的专名形式。
- source_word: וָאֵדַע כִּי
  choice: 我就知道
  rationale: 表达叙事推进及 כִּי 所引出的认知内容；“知道”比“意识到”更贴近 ידע，同时不额外解释认知过程。
- source_word: כְרוּבִים הֵמָּה
  choice: 它们是基路伯
  rationale: 保留希伯来文由单数“活物”转为复数代词的张力；“基路伯”是 כְרוּבִים 的通行中文宗教术语，其形式本身不强行标明汉语复数。
theological_decisions:
- issue: 宝座异象中活物身份的确认
  choice: 将 חַיָּה 译为“活物”，将 כְרוּבִים 译为“基路伯”，明确保留以西结在此确认其身份的叙事发展。
  alternative: 将 חַיָּה 泛译为“有生命的存在”，或以解释性称谓替代“基路伯”。
  rationale: 经文本身有意从异象描述推进到身份确认；译文应保留这一发展，不淡化专门的异象用语，也不加入经文没有提供的教义解释。
- issue: 单数“活物”与复数“它们”的转换
  choice: 保留“活物”单数形式和“它们”复数指称。
  alternative: 为求汉语表面一致，将前半句改为“活物们”或将后半句改为“它是”。
  rationale: 原文确有语法数的转换，可能把整体异象与其中多个活物联系起来；不应在翻译中悄然消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“下面”清楚保留空间图景；分号呈现身份确认这一叙事推进。正文中的[a]与脚注完全对应。
