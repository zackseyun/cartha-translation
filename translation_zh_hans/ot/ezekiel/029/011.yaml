id: EZK.29.11
reference: Ezekiel 29:11
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹ֤א תַעֲבָר בָּ/הּ֙ רֶ֣גֶל אָדָ֔ם וְ/רֶ֥גֶל בְּהֵמָ֖ה לֹ֣א תַעֲבָר בָּ֑/הּ וְ/לֹ֥א תֵשֵׁ֖ב אַרְבָּעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/011.yaml
  text: No human foot will pass through it[a], and no animal foot will pass through it; and it will not be inhabited for forty years.
translation:
  language: zh_hans
  text: 人的脚必不经过其中，牲畜的脚也必不经过其中；四十年之久，那里必无人居住。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲבָר בָּהּ
  choice: 经过其中
  rationale: עבר与介词ב连用，在此表示穿行、经过某地；“经过其中”自然地保留了穿越那地的图景。
- source_word: רֶגֶל אָדָם
  choice: 人的脚
  rationale: 原文直译为“人的脚”，以身体部位代指人类往来；中文表达自然，并保留单数集合意义。
- source_word: רֶגֶל בְּהֵמָה
  choice: 牲畜的脚
  rationale: בְּהֵמָה通常指陆生牲畜或走兽；在与“人的脚”平行的语境中，“牲畜的脚”准确保留无人畜通行之意。
- source_word: לֹא תֵשֵׁב
  choice: 那里必无人居住
  rationale: ישב用于土地时可表示居住或有人定居。原文阴性主语承接上下文中的埃及地，中文用“那里必无人居住”比机械直译为“它不被居住”更自然。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年之久
  rationale: 明确表达持续四十年的时间长度，并与后面的无人居住状态自然衔接。
theological_decisions:
- issue: אָדָם在泛指陈述中的译法
  choice: 人，体现在“人的脚”中
  alternative: 男人的脚；人类的脚
  rationale: 此处泛指任何人，并非特指男性；“人的脚”既忠于原文意象，又符合现代汉语习惯。
- issue: לֹא תֵשֵׁב的语态与所指
  choice: 那里必无人居住
  alternative: 它必不被居住；那里必不有人定居
  rationale: 希伯来语形式可按土地“无人居住”来理解；此译法不额外限定为永久定居，也不改变上下文所指的埃及地。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“人的脚……牲畜的脚”保留原文平行结构与具体意象；“必”传达未完成式在预言语境中的将来确定性。原文末句直译次序为“并且它四十年不被居住”，中文调整为“四十年之久，那里必无人居住”，以增强自然度而不改变意义。
