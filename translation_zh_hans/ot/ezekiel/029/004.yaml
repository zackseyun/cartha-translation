base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/004.yaml
  text: I will put hooks in your jaws[a], and I will make the fish of your Nile channels cling to your scales; and I will bring you up from the midst of your Nile channels[b], and all the fish of your Nile channels will cling to your scales.
translation:
  language: zh_hans
  text: 我要把钩子放在你的颚[a]中，使你尼罗河各水道里的鱼粘在你的鳞片上；我要把你从你的尼罗河各水道中拉上来，你尼罗河各水道里所有的鱼都要粘在你的鳞片上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“腮颊”。希伯来语可指颚或腮颊；这里钩住巨大河兽的图像较适合译作“颚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חחיים
  choice: 钩子
  rationale: 该复数名词指钩住并拖曳动物的器具；上下文把法老描绘为尼罗河中的巨兽，“钩子”自然保留捕获和拖出的意象。
- source_word: בִּלְחָיֶיךָ
  choice: 在你的腮颊上
  rationale: לְחִי 可指腮颊或颚；这里与水中巨兽被钩住的图像相配。“腮颊”既自然，也保留原词的身体部位含义，不额外限定钩入嘴内。
- source_word: וְהִדְבַּקְתִּי
  choice: 使……粘在
  rationale: דבק 的使役形表示上帝使鱼附着在巨兽的鳞甲上；“使……粘在”清楚保留使役语气。
- source_word: דְגַת
  choice: ……里的鱼
  rationale: 这是与后续名词相连的集合名词，现代汉语用“……里的鱼”可自然表达“尼罗河各水道中的鱼”。
- source_word: יְאֹרֶיךָ
  choice: 你的尼罗河各水道
  rationale: יְאֹר 在埃及语境中指尼罗河及其水系；原文为复数，因此译为“尼罗河各水道”，兼顾特定地理背景和数的含义。
- source_word: בְּקַשְׂקְשֹׂתֶיךָ
  choice: 粘在你的鳞甲上
  rationale: 介词与 דבק 连用表达附着；“鳞甲”比单说“鳞片”更适合巨大河兽的庄严审判意象。
- source_word: וְהַעֲלִיתִיךָ
  choice: 我要把你……拉上来
  rationale: עלה 的使役形表示使其上来；在钩住河兽的语境中，“拉上来”自然呈现从水中拖出的动作，又未超出上下文意象。
- source_word: מִתּוֹךְ
  choice: 从……中
  rationale: 该短语表示从内部或当中出来；“从……中”在现代汉语中简洁而准确。
- source_word: תִּדְבָּק
  choice: 都要粘在
  rationale: Qal 未完成式描述所有鱼附着于鳞甲；汉语以“所有……都要”自然传达集合性的主谓关系。
theological_decisions:
- issue: 法老作为尼罗河巨兽的隐喻
  choice: 保留钩子、腮颊、鳞甲和鱼的连贯图像，不在正文点明具体动物
  alternative: 将该形象明确译为鳄鱼或海怪
  rationale: 本节原文以身体特征和动作塑造巨兽形象，却没有在本句直接使用某一动物名称；不加限定可保留原文的诗性张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“尼罗河各水道”保留埃及背景和希伯来语复数；两个脚注标记按其实际所注词语配置，避免把“腮颊／颚”和“尼罗河水道”的释义互换。
