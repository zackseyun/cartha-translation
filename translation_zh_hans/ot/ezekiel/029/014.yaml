  naturalness: “我要使埃及复兴”可理解，但“恢复埃及的境况”更准确地对应“恢复埃及的 fortunes／处境”，并避免把该惯用语限缩为国家兴盛。“把他们带回……，就是他们的故土”在现代汉语中自然且清晰。
  terminology: 地名宜采用较通行的圣经汉语形式“巴忒罗”。“低微的王国”比“弱小的王国”更能保留原文关于地位被压低的含义，而不额外强调国力。
