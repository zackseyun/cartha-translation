  text: וְ/שַׁבְתִּי֙ אֶת שְׁב֣וּת מִצְרַ֔יִם וַ/הֲשִׁבֹתִ֤י אֹתָ/ם֙ אֶ֣רֶץ פַּתְר֔וֹס עַל אֶ֖רֶץ מְכֽוּרָתָ֑/ם וְ/הָ֥יוּ שָׁ֖ם מַמְלָכָ֥ה שְׁפָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/014.yaml
  text: And I will restore the fortunes of Egypt and bring them back to the land of Pathros[a], to the land of their origin[b], and there they will be a lowly kingdom.
translation:
  language: zh_hans
  text: 我要恢复埃及的境况[a]，把他们带回巴忒罗地，就是他们的故土[b]；他们必在那里成为一个低微的王国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恢复埃及的境况”也可译作“使埃及被掳的人归回”或“恢复埃及被掳的境况”。这一希伯来语惯用语可以具体指被掳者归回，也可以较广泛地指境况得到恢复。
    reason: lexical_alternative
  - marker: b
    text: 巴忒罗是上埃及的一个地区，本节称它为埃及人的故土。
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת מִצְרַיִם
  choice: 我要使埃及复兴
  rationale: שׁוּב שְׁבוּת是恢复原有境况、扭转衰败处境的惯用语；下句已明确说使人归回，因此正文采用“使埃及复兴”，既自然，也避免无谓重复。
- source_word: וַהֲשִׁבֹתִי אֹתָם
  choice: 使他们回到
  rationale: שׁוּב的使役式表示使某人返回；“使他们回到”保留使役意义，并符合现代汉语表达。
- source_word: אֶרֶץ פַּתְרוֹס
  choice: 巴特罗地
  rationale: 保留אֶרֶץ“地、地域”的含义，并按通行圣经地名形式将פַּתְרוֹס音译为“巴特罗”。
- source_word: עַל אֶרֶץ מְכוּרָתָם
  choice: 回到他们的发源地
  rationale: מְכוּרָה指本源、出生之地；语境描述归回的目的地，故将עַל按方向关系译为“回到”，并用“发源地”表达民族起源之地。
- source_word: מַמְלָכָה שְׁפָלָה
  choice: 一个弱小的王国
  rationale: שָׁפָל在此指地位低下、国势衰微；“弱小”比直译“低微”更自然地表达该王国受压低后的有限地位与力量。
theological_decisions:
- issue: שׁוּב שְׁבוּת所表达的复兴或被掳归回
  choice: 使埃及复兴
  alternative: 使埃及被掳的人归回／恢复埃及被掳的境况
  rationale: 该希伯来惯用语既可保留被掳归回的具体意象，也常泛指境况得到恢复。由于紧接着的分句已明说使他们回到巴特罗，正文采用较宽的“复兴”，并在脚注中保存较字面的可能译法。
- issue: עַל אֶרֶץ מְכוּרָתָם中的介词关系
  choice: 回到他们的发源地
  alternative: 在他们的发源地之上
  rationale: עַל通常可译为“在……上”，但在本句移动与归回的语境中，与前面的目的地短语同位，方向性译法更符合现代汉语，同时不改变其所指地域。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“复兴”传达境况逆转，“弱小的王国”清楚表达国势与地位被压低。正文中的[a]、[b]均与脚注对应。
