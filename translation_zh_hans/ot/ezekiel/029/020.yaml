reference: Ezekiel 29:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: פְּעֻלָּת/וֹ֙ אֲשֶׁר עָ֣בַד בָּ֔/הּ נָתַ֥תִּי ל֖/וֹ אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/020.yaml
  text: As his wages for which he labored against it[a], I have given him the land of Egypt, because they worked for me[c][b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 我把埃及地赐给他，作为他为攻打推罗[a]所付劳役的报酬[b]，因为他们为我效力[c]。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“他为她所劳作”；“她”是阴性单数代词，按29:18的上下文最可能指推罗，并指向对推罗的军事劳役。
    reason: cross_reference
  - marker: b
    text: “报酬”所译的希伯来语也可指“工作”或“行为”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“因为他们替我做了这事”或“因为他们为我行事”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעֻלָּתוֹ
  choice: 他所得的报酬
  rationale: 该名词可指“工作、行为”或“工价、报酬”。本节说埃及被赐给尼布甲尼撒，作为其军事劳役的补偿，因此译作“报酬”最贴合语境，同时以脚注保留“工作的酬劳”等可能表达。
- source_word: אֲשֶׁר עָבַד בָּהּ
  choice: 他攻打推罗
  rationale: עבד意为“工作、服役、劳作”；阴性单数后缀在上文语境中最自然地回指推罗。中文正文明确补出“推罗”，以避免“攻打它”的指代含混，但用脚注说明原文仅作阴性代词。
- source_word: נָתַתִּי לוֹ
  choice: 我把……赐给他
  rationale: 希伯来语完成式在预言宣告中表达已经确定的神圣行动；“赐给”自然体现赐予与决定性。
- source_word: אֶת אֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: 保留原文“埃及之地”的领土含义，又符合现代汉语圣经文体。
- source_word: אֲשֶׁר עָשׂוּ לִי
  choice: 因为他们是为我效力
  rationale: עָשׂוּ字面义宽泛，可译“做了、行了”；在军事劳役及报偿的语境中，“为我效力”自然表达他们替耶和华执行任务，但不暗示其动机纯正或与神有盟约关系。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知书常用的权威宣告公式；אֲדֹנָי יְהוִה译作“主耶和华”，既区分两个称谓，也符合庄重而通行的现代中文表达。
theological_decisions:
- issue: בָּהּ中阴性单数后缀的所指
  choice: 正文按紧接的上文理解为推罗，译作“攻打推罗”。
  alternative: 保留为“在其中劳作”或“攻打它”，也可能泛指该项任务。
  rationale: 29:18明确说尼布甲尼撒王使军队为攻打推罗大大效劳，故回指推罗最符合篇章衔接；脚注保留原文代词形式及其解释空间。
- issue: “他们为我效力”的神学含义
  choice: 尼布甲尼撒及其军队在执行神审判的意义上为耶和华效力。
  alternative: 他们只为自身的帝国目标行动，并无任何为神效力的含义。
  rationale: 原文明说他们“为我”做了这事，应保留神使用外邦军队的张力；译文不进一步断言神认可其全部动机或行为。
- issue: 埃及作为报酬
  choice: 埃及地是神赐给尼布甲尼撒、补偿其军事劳役的报酬。
  alternative: פְּעֻלָּתוֹ可较形式化地理解为“他的工作”，即“因他所做的工作”。
  rationale: 上下文29:18–19明确以未从推罗得着酬劳和将埃及赐给他相对照，因此补偿义在此最突出。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。语序重组为先陈述赐予、再说明报酬性质，以符合汉语表达；正文补出“推罗”帮助读者识别所指，脚注则保存原文代词的形式与一定歧义。“主耶和华”保留אֲדֹנָי יְהוִה的双重称谓。
