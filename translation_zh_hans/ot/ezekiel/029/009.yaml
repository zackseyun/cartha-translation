source:
  edition: WLC
  text: וְ/הָיְתָ֤ה אֶֽרֶץ מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה וְ/חָרְבָּ֔ה וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה יַ֧עַן אָמַ֛ר יְאֹ֥ר לִ֖/י וַ/אֲנִ֥י עָשִֽׂיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/009.yaml
  text: And the land of Egypt will become a desolation and a waste[a], and they will know that I am Yahweh, because he said, ‘The Nile is mine, and I made it.’
translation:
  language: zh_hans
  text: 埃及地必变得荒凉，沦为废墟；他们就知道我是雅威。因为他说：‘尼罗河是我的，是我造的。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必变得
  rationale: 在先知性话语中表达将来的结果和状态转变；“必变得”既自然，也保留宣告的确定性。
- source_word: אֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 保留 אֶרֶץ 的地域含义，同时符合现代汉语圣经语体。
- source_word: לִשְׁמָמָה וְחָרְבָּה
  choice: 荒凉，沦为废墟
  rationale: 两个近义名词叠加描绘彻底毁坏；译文用“荒凉”表达状态，用“废墟”呈现毁坏后的景象，避免生硬重复。
- source_word: וְיָדְעוּ
  choice: 他们就知道
  rationale: 保留以西结书常见的认识公式和未明确指称的复数主语；“就”自然呈现审判所带来的结果。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译神圣四字名，保留其专名性质。
- source_word: יַעַן
  choice: 因为
  rationale: 清楚引出审判的缘由。
- source_word: יְאֹר
  choice: 尼罗河
  rationale: 该词在埃及语境中特指尼罗河；直接译出所指对象最为清楚。
- source_word: לִי
  choice: 是我的
  rationale: 简洁保留说话者宣称所有权的狂妄语气。
- source_word: וַאֲנִי עָשִׂיתִי
  choice: 是我造的
  rationale: 独立代词 אֲנִי 带有强调意味；“是我……的”在汉语中自然体现这一强调，而“造”不额外引入专门的创造术语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留专名性质。
- issue: 法老关于尼罗河的宣称
  choice: “尼罗河是我的，是我造的”
  alternative: “尼罗河属于我，我亲自造了它”
  rationale: 保留所有权与制造者身份这两重狂妄宣称，同时用自然汉语体现显式代词所带的强调，不进一步解释其神学含义。
translation_notes:
  register: 采用庄重而现代的标准普通话。“荒凉，沦为废墟”保留原文两个毁坏词语的加强效果；直接引语简洁有力，适合先知审判宣告的语气。
