  text: בַּ/יּ֣וֹם הַ/ה֗וּא אַצְמִ֤יחַ קֶ֨רֶן֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל וּ/לְ/ךָ֛ אֶתֵּ֥ן פִּתְחֽוֹן פֶּ֖ה בְּ/תוֹכָ֑/ם וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/021.yaml
  text: On that day I will cause a horn to sprout for the house of Israel[a], and I will give you an opening of the mouth among them[b], and they will know that I am Yahweh.
translation:
  language: zh_hans
  text: 到那日，我必使以色列家长出角来[a]；我也必使你在他们中间开口说话[b]。他们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“使以色列家的角生长起来”。“角”在这里比喻力量、尊荣或权势的兴起。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“赐你口的开启”，是指使人能够或获准说话的希伯来语表达；这里很可能呼应以西结先前言语受限的经历。
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: 到那日
  rationale: 采用自然而庄重的现代汉语表达，保留先知话语中的时间标记。
- source_word: אַצְמִיחַ
  choice: 我必使……长出……来
  rationale: 保留צמח使役形所表达的“使之萌发、生长”之意，也保留原文的生长意象。
- source_word: קֶרֶן
  choice: 一只角
  rationale: 原文直译为“角”，在此比喻力量、尊荣或兴起。正文保留具体意象，不直接释为“力量”，也不限定为某一特定人物。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留“以色列家”这一群体与盟约性称谓，而不简化为“以色列”。
- source_word: פִּתְחוֹן פֶּה
  choice: 开口说话
  rationale: 用自然汉语传达希伯来语“口得开启”的习语含义，即获准或获能说话，同时借脚注保留其字面意象及与以西结先前受限发言的可能联系。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 准确表达群体内部的场景，并保持庄重、清楚的现代汉语语体。
- source_word: וְיָדְעוּ
  choice: 他们就知道
  rationale: “就”自然呈现前述行动所带来的结果；“他们”按上下文指以西列家中听见先知说话的人。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，而不以称号替代。
theological_decisions:
- issue: “角”的比喻所指
  choice: 正文保留“角”的意象，脚注说明它可表示力量或尊荣的兴起。
  alternative: 直接译作“力量”“权势”，或明确译成某位弥赛亚人物。
  rationale: 原文本身呈现的是富有张力的比喻，并未在本节明确将“角”限定为某个特定人物；保留意象可避免把可能的王权或弥赛亚含义提前定死。
- issue: פִּתְחוֹן פֶּה对以西结的含义
  choice: 译为“使你……开口说话”，不限定这是永久解除缄默，还是一次特定的先知发言机会。
  alternative: 译为“使你畅所欲言”“赐你胆量发言”，或明确说明为永久恢复说话。
  rationale: 该短语很可能呼应以西结先前言语受限的经历，但本节只明确说神使他能在百姓中说话，不足以进一步限定其方式、胆量或持续时间。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文尽量保留“长出角来”的原文意象，同时用“开口说话”使希伯来习语在汉语中自然清楚；脚注补足字面形式与语境联系。
