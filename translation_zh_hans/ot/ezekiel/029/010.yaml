  text: לָ/כֵ֛ן הִנְ/נִ֥י אֵלֶ֖י/ךָ וְ/אֶל יְאֹרֶ֑י/ךָ וְ/נָתַתִּ֞י אֶת אֶ֣רֶץ מִצְרַ֗יִם לְ/חָרְבוֹת֙ חֹ֣רֶב שְׁמָמָ֔ה מִ/מִּגְדֹּ֥ל סְוֵנֵ֖ה וְ/עַד גְּב֥וּל כּֽוּשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/010.yaml
  text: Therefore[a], behold, I am against you and against your Nile channels, and I will make the land of Egypt ruins, a desolation laid waste, from Migdol to Syene[c][b], as far as the border of Cush.
translation:
  language: zh_hans
  text: 因此，看哪，我与你为敌，也与你的尼罗河水道[a]为敌；我要使埃及地沦为废墟和荒凉之地，从密夺直到色弗尼[b]，远至古实的边界[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你的河流”。这里的希伯来词在埃及语境中通常指尼罗河及其支流或水道。
    reason: lexical_alternative
  - marker: b
    text: 色弗尼是古代城市，位于今天的阿斯旺附近，标示埃及的南部边缘。
    reason: cultural_note
  - marker: c
    text: 古实指埃及以南、通常与努比亚相关的地区，不宜直接等同于现代埃塞俄比亚的疆域。
    reason: cultural_note
lexical_decisions:
- source_word: יְאֹרֶיךָ
  choice: 你的尼罗河支流
  rationale: 在埃及语境中，יְאֹר通常特指尼罗河及其支流或水道；译作“尼罗河支流”既保留地域指向，也体现原文复数。
- source_word: לְחָרְבוֹת חֹרֶב שְׁמָמָה
  choice: 沦为废墟，荒废凄凉
  rationale: 原文叠用多个表示毁坏、荒凉的近义词以加强语势；中文用两个并列短语保留这种累积强调，而不压缩成单一词语。
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: 从密夺直到色弗尼
  rationale: 两者按古地名音译；这一表达标示埃及由北至南的范围。“色弗尼”保留希伯来名称，不直接以现代地名“阿斯旺”替代。
- source_word: וְעַד גְּבוּל כּוּשׁ
  choice: 远至古实的边界
  rationale: 保留古地名“古实”，避免译成“埃塞俄比亚”而使读者误认为现代国家疆域；“远至”自然表达范围延伸。
- source_word: הִנְנִי אֵלֶיךָ
  choice: 看哪，我与你为敌
  rationale: 这是先知宣告中表示上帝亲自敌对的庄严公式；“看哪”保留 הִנְנִי 的提示和强调作用，“与你为敌”清楚表达 אֵלֶיךָ 在此处的敌对含义。
- source_word: וְנָתַתִּי אֶת אֶרֶץ מִצְרַיִם
  choice: 我要使埃及地沦为
  rationale: נתן 后接结果性补语，在这里表示使某物成为某种状态，而不是中性的“给予”；“使……沦为”准确传达毁灭性的结果。
