  text: וַ/יְהִ֗י בְּ/עֶשְׂרִ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/017.yaml
  text: And it happened in the twenty-seventh year[a], in the first month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: zh_hans
  text: 到了第二十七年正月一日，耶和华的话临到我说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了
  rationale: 此处引出带日期的先知启示。用“到了”自然承接上下文并保留时间推进的叙事功能，避免生硬直译为“事情发生了”。
- source_word: בְּעֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: 第二十七年
  rationale: 希伯来语采用纪年日期格式；现代汉语通常以序数表达年份。原文未在本节明说以何事为纪年起点，译文也不增补。
- source_word: בָּרִאשׁוֹן
  choice: 正月
  rationale: 字面为“在第一〔月〕”；结合完整日期格式，所省略的是“月”。“正月”简洁自然，意为一年中的第一个月。
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: 一日
  rationale: 希伯来语字面近于“在本月的一〔日〕”，是指该月第一日。与“正月”连用为“正月一日”，符合现代汉语日期表达。
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: 耶和华的话临到我
  rationale: 这是先知书常见的启示公式。“临到我”既贴近其发生性，又是庄重自然的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式音译四字神名，不以“主”等称号替代。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 用于引出下一节的直接话语；汉语以“说：”自然清楚地标明引语开始。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非一般称号。正文采用现代中文圣经传统中辨识度最高的专名“耶和华”；“雅威”是较接近学界常见拟音的另一译法。
- issue: 第二十七年的纪年起点
  choice: 不在正文中补明
  alternative: 补作“约雅斤王被掳后第二十七年”等解释
  rationale: 本节原文本身只说“第二十七年”，没有明示纪年起点。为保留原文的信息边界与其可能依赖上下文的性质，译文不添加解释。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“到了……，……临到我说”保留先知书日期通知的节奏；不使用文言式“于是有”或过度口语化表达。
