  to: “人子[a]啊，巴比伦王尼布甲尼撒使他的军队为攻打推罗承担了繁重的劳役[b]；人人头顶都磨秃了，个个肩膀都磨破了[c]。然而，他和他的军队为攻打推罗所付的劳苦，却没有从推罗得到任何酬劳。”
  rationale: 仅作一处安全的汉语搭配调整：“服了繁重的劳役”改为“承担了繁重的劳役”。这保留了原文“使他的军队进行/承担极大劳作”的使役关系、劳役的强度及其与攻打推罗的关联，未改变经文含义或脚注锚点。
