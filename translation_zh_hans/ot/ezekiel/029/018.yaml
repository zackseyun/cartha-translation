source:
  edition: WLC
  text: בֶּן אָדָ֗ם נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּ֠בֶל הֶעֱבִ֨יד אֶת חֵיל֜/וֹ עֲבֹדָ֤ה גְדֹלָה֙ אֶל צֹ֔ר כָּל רֹ֣אשׁ מֻקְרָ֔ח וְ/כָל כָּתֵ֖ף מְרוּטָ֑ה וְ֠/שָׂכָר לֹא הָ֨יָה ל֤/וֹ וּ/לְ/חֵיל/וֹ֙ מִ/צֹּ֔ר עַל הָ/עֲבֹדָ֖ה אֲשֶׁר עָבַ֥ד עָלֶֽי/הָ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/018.yaml
  text: Son of man[a], Nebuchadnezzar king of Babylon made his army labor greatly against Tyre; every head was made bald and every shoulder was rubbed bare[c][b], yet there was no pay for him or for his army from Tyre for the labor that he had performed against it.
translation:
  language: zh_hans
  text: “人子[a]啊，巴比伦王尼布甲尼撒使他的军队为攻打推罗承担了繁重的劳役[b]；人人头顶都磨秃了，个个肩膀都磨破了[c]。然而，他和他的军队为攻打推罗所付的劳苦，却没有从推罗得到任何酬劳。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语字面作“人的儿子”，也可理解为“凡人”；这是以西结书中对先知常用的称呼。
    reason: lexical_alternative
  - marker: b
    text: “繁重的劳役”也可译作“大量的劳作”或“艰苦的服役”。
    reason: lexical_alternative
  - marker: c
    text: 头顶磨秃、肩膀磨破的描写，很可能反映围城工程和搬运重物所造成的身体磨损。
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的称呼形式及其文学功能；脚注说明其希伯来语字面意义和可表达的“凡人”含义。
- source_word: הֶעֱבִיד אֶת חֵילוֹ
  choice: 使他的军队……服了……劳役
  rationale: 体现使役形词的使役语气；חֵיל在军事语境中指军队。
- source_word: עֲבֹדָה גְדֹלָה
  choice: 繁重的劳役
  rationale: 既保留“劳役”的名词意象，也自然表达גְדֹלָה在此所强调的强度和规模。
- source_word: אֶל צֹר
  choice: 为攻打推罗
  rationale: 在围城的军事语境中，介词表示敌对方向；此译法比直译“向着推罗”更清楚。
- source_word: כָּל רֹאשׁ מֻקְרָח
  choice: 人人头顶都磨秃了
  rationale: 被动形式表示劳作造成的结果；“磨秃”与下句的身体磨损意象相呼应。
- source_word: כָל כָּתֵף מְרוּטָה
  choice: 个个肩膀都磨破了
  rationale: מְרוּטָה表示被磨去表层、变得裸露；现代汉语“磨破”自然传达搬运和围城劳作造成的擦伤。
- source_word: שָׂכָר
  choice: 酬劳
  rationale: 此处指为劳役应得的报偿；“酬劳”既适用于君王，也适用于军队。
- source_word: מִצֹּר
  choice: 从推罗
  rationale: 保留来源义，表明这场战事未给尼布甲尼撒及其军队带来可作报偿的战利或收益。
- source_word: עַל הָעֲבֹדָה אֲשֶׁר עָבַד עָלֶיהָ
  choice: 为攻打推罗所付的劳苦
  rationale: 自然表达希伯来语中“劳役／劳作”的重复，并明确阴性代词所指的是推罗。
theological_decisions:
- issue: 军队未得“酬劳”的表述是否暗示神认可其战争
  choice: 只陈述他们没有从推罗得到酬劳
  alternative: 将其解释为神所欠或神所认可的报偿
  rationale: 本节本身陈述劳役与报偿之间的关系，却未在这一句中对战争作神学或道德评价，因此不额外引入解释。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“人人……个个……”自然再现希伯来语“每一个头……每一个肩膀……”的全面性；用“然而……却……”清楚表达转折。专名采用现代中文圣经中通行的“尼布甲尼撒、巴比伦、推罗”。
