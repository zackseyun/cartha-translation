  text: Son of man[a], set your face against Pharaoh king of Egypt, and prophesy against him and against all Egypt.
translation:
  language: zh_hans
  text: “人子啊，你要转脸对着法老，就是埃及王，向他和整个埃及宣告攻击的预言。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的先知称呼及其阳性单数形式；“人子”也是现代中文圣经语体中通行且简洁的对应。
- source_word: שִׂים פָּנֶיךָ
  choice: 面向
  rationale: 希伯来语字面为“把你的脸朝向”。中文“面向”保留朝向的意象，而敌对意味由后文“攻击”明确表达，避免生硬的“定睛面对”。
- source_word: עַל
  choice: 攻击
  rationale: 在审判性预言的语境中，עַל具有敌对、针对之意；与“发预言”搭配译作“攻击”，自然表达宣告审判的方向。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老
  rationale: 按现代汉语惯用次序表达同位关系；“法老”为该埃及君王的称号。
- source_word: וְהִנָּבֵא
  choice: 发预言
  rationale: 准确体现נבא的尼法勒命令式及先知受命宣告的正式语气。
- source_word: עָלָיו
  choice: 攻击他
  rationale: 审判语境要求保留介词的敌对含义，而不弱化为仅仅“论到他”。
- source_word: מִצְרַיִם כֻּלָּהּ
  choice: 整个埃及
  rationale: 自然、明确地传达阴性单数后缀所指的埃及全境或全国，以及כֹּל的总体范围。
