  text: דַּבֵּ֨ר וְ/אָמַרְתָּ֜ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י עָלֶ֨י/ךָ֙ פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם הַ/תַּנִּים֙ הַ/גָּד֔וֹל הָ/רֹבֵ֖ץ בְּ/ת֣וֹךְ יְאֹרָ֑י/ו אֲשֶׁ֥ר אָמַ֛ר לִ֥/י יְאֹרִ֖/י וַ/אֲנִ֥י עֲשִׂיתִֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/003.yaml
  text: 'Speak and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Pharaoh king of Egypt, the great sea monster lying in the midst of his Nile channels, who says, “My Nile is mine[b], and I made myself.”’'
translation:
  language: zh_hans
  text: 你要宣告说：“主耶和华如此说：‘看哪，埃及王法老，我与你为敌！你这卧在自己尼罗河水道中的大水怪[a]，说：我的尼罗河属于我，是我造了自己[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大龙”。在尼罗河的语境中，这个形象也可能令人想到鳄鱼般的巨兽。
    reason: lexical_alternative
  - marker: b
    text: 本句也可理解为：“尼罗河是我的，是我为自己造了它。”希伯来文可能是在描写法老夸口占有并造了尼罗河，也可能是在描写他声称造了自己。
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר וְאָמַרְתָּ
  choice: 你要宣告说
  rationale: 两个相近的言说动词连用，带有先知奉命公开传话的语气；译为“宣告说”既保留强调，也避免现代汉语中生硬的“说并且说”。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号：אֲדֹנָי译作“主”，四字神名按现代中文圣经传统音译为“耶和华”，并避免重复为“主主”。
- source_word: הִנְנִי עָלֶיךָ
  choice: 看哪……我与你为敌
  rationale: הִנְנִי保留先知宣告中的强调和临场感；עַל在此具有敌对含义，译作“与你为敌”自然明确。
- source_word: הַתַּנִּים הַגָּדוֹל
  choice: 大水怪
  rationale: תַּנִּים指巨大的水中怪兽或龙形生物；“水怪”保留象征性和尼罗河语境，又不武断限定为鳄鱼。
- source_word: הָרֹבֵץ
  choice: 卧
  rationale: רבץ表示伏卧、躺卧；“卧”简洁庄重，也传达法老盘踞河中的形象。
- source_word: בְּתוֹךְ יְאֹרָיו
  choice: 在自己尼罗河水道中
  rationale: יְאֹר在埃及语境中特指尼罗河及其河道，复数形式宜译作“尼罗河水道”；第三人称所有格依中文习惯译为反身性的“自己”。
- source_word: לִי יְאֹרִי
  choice: 我的尼罗河属于我
  rationale: 既保留“我的尼罗河”这一所有格，又用“属于我”表达前置介词短语לִי所强调的占有宣称。
- source_word: וַאֲנִי עֲשִׂיתִנִי
  choice: 是我造了自己
  rationale: 马所拉文本的第一人称宾语后缀最直接指向“我自己”，形成法老自我创造的狂妄宣称；同时用脚注保留将宾语理解为尼罗河的可能。
theological_decisions:
- issue: 复合神圣称号אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在现代中文中可辨识、庄重，并同时呈现主权称号与神的专名；不把两者合并，也不译成重复的“主主”。
- issue: 法老之言וַאֲנִי עֲשִׂיתִנִי所指为何
  choice: 是我造了自己
  alternative: 是我为自己造了它（尼罗河）
  rationale: 第一人称单数宾语后缀按其表面语法指向说话者本人，因此正文保留惊人的自我创造宣称；但上下文也容许将其理解为法老夸称自己造了尼罗河，故在脚注中明确保留这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。“看哪”保留原文警告性的强调；直接引语分层使用中文引号。“大水怪”避免把象征形象过早限定为“鳄鱼”，而脚注保留“大龙”及鳄鱼意象。正文刻意保存法老宣称“造了自己”的神学张力，同时以脚注说明另一种句法理解。
