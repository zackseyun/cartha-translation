  text: וְ/יָֽדְעוּ֙ כָּל יֹשְׁבֵ֣י מִצְרַ֔יִם כִּ֖י אֲנִ֣י יְהוָ֑ה יַ֧עַן הֱיוֹתָ֛/ם מִשְׁעֶ֥נֶת קָנֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/006.yaml
  text: Then all the inhabitants of Egypt will know that I am Yahweh[a], because they were a staff of reed to the house of Israel.
translation:
  language: zh_hans
  text: 埃及所有的居民都必知道，我是耶和华[a]，因为他们曾作以色列家的芦苇杖[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文神名 יהוה 的传统汉语译名；也可译作“雅威”。
    reason: divine_name
  - marker: b
    text: 或译“芦苇做的支杖”。这比喻指看似可以倚靠、实际上承受不住重量的支撑物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 就会知道
  rationale: 在先知性话语中，此处的连接词与完成式推进审判后的结果；“就会”自然表达随后产生的认识，并保留以西结书常见的认识公式。
- source_word: כָּל יֹשְׁבֵי מִצְרַיִם
  choice: 埃及所有的居民
  rationale: 准确表达“所有住在埃及的人”，用现代汉语常用的“居民”保留整体范围。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 这是以西结书反复出现的认识公式；将四字神名音译为汉语传统且通行的“耶和华”，不以称号代替专名。
- source_word: יַעַן הֱיוֹתָם
  choice: 因为埃及曾作
  rationale: יַעַן引出受审判的原因；后接带后缀的不定式结构，汉语以有限分句表达更自然。“埃及”明确原文复数后缀所指的埃及人或埃及，避免中文代词指向含混。
- source_word: מִשְׁעֶנֶת קָנֶה
  choice: 芦苇杖
  rationale: 保留原文“供人倚靠的杖”与“脆弱芦苇”结合的具体比喻，也与下一节杖折裂、伤人的图像衔接。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家的
  rationale: “以色列家”保留原文的民族—盟约群体称呼；以所属结构自然表达埃及对该群体所充当的支撑物。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代简体中文圣经语境中辨识度最高的专名“耶和华”，并以脚注说明另一种较贴近学术重构读音的译写，不用“主”取代专名。
- issue: 埃及作为“芦苇杖”的比喻
  choice: 保留比喻，不在正文解释其不可靠性
  alternative: 不可靠的支杖
  rationale: 原文保留具象而带张力的判断，其脆弱和危险在下一节展开；正文不提前释义，以免缩窄意象。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“埃及所有的居民”保持范围明确；“以色列家”保留先知书中的群体称谓；“芦苇杖”简洁保留原文意象，并通过脚注帮助普通读者理解。
