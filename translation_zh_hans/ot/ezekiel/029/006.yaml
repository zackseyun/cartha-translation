  rationale: 修订恢复 הֱיוֹתָם 所指的复数主语“他们”，以忠实对应前文“埃及所有的居民”；以“都必知道”呈现原文的全体范围及先知性宣告语气。保留“以色列家”“芦苇杖”和神名“耶和华”，不额外解释或收窄原文比喻。脚注仅作措辞精确化，保留原有替代译法和意象说明。
