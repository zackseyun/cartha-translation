  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה מִ/קֵּ֞ץ אַרְבָּעִ֤ים שָׁנָה֙ אֲקַבֵּ֣ץ אֶת מִצְרַ֔יִם מִן הָ/עַמִּ֖ים אֲשֶׁר נָפֹ֥צוּ שָֽׁמָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/013.yaml
  text: 'For thus says the Lord GOD: At the end of forty years I will gather Egypt from the peoples among whom they were scattered[a].'
translation:
  language: zh_hans
  text: 因为主雅威如此说：“四十年期满后，我要从埃及人被分散到的各族[a]中，把埃及人招聚回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各族”或译“列国”。
    reason: 原文 עַמִּים 可指各民族，也可按语境译作列国。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的审判宣告说明根据；“因为”保留了原文的连接作用。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知书中固定的使者宣告格式，同时符合庄重、自然的现代汉语。
- source_word: אֲדֹנָי יְהוִה
  choice: 主雅威
  rationale: 分别表达 אֲדֹנָי（主）与神的专名 יהוה（雅威），避免把两个成分合并或重复为“主主”。
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: 四十年期满时
  rationale: 准确表达一段四十年时期结束之际，比笼统的“四十年后”更贴近 מִקֵּץ。
- source_word: אֲקַבֵּץ
  choice: 招聚
  rationale: קבץ 指把分散的人聚集起来，此处含有从流散中重新聚合的意味；“招聚”简洁而庄重。
- source_word: אֶת מִצְרַיִם
  choice: 招聚他们（即埃及人）
  rationale: 原文直称“埃及”，以国家名指其人民；后面的复数动词“被分散”也表明所指是埃及人。汉语以“埃及人……他们”自然呈现这一转喻。
- source_word: מִן הָעַמִּים
  choice: 从……各族中
  rationale: עַמִּים 的基本含义是多个民族或族群；“各族”既贴近原文，也不额外限定为政治国家。
- source_word: אֲשֶׁר נָפֹצוּ שָׁמָּה
  choice: 埃及人被分散到的
  rationale: 保留 נפצו 的被分散含义和 שָׁמָּה 的方向、地点意味，并按汉语习惯将关系从句前置。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主雅威
  alternative: 主耶和华；主上帝
  rationale: “主雅威”同时保留“主”的称号与 יהוה 的专名性质，不用普通称谓取代圣名。
- issue: “埃及”作为国家还是人民
  choice: 按转喻译为埃及人，并以后文“他们”承接
  alternative: 直译为“招聚埃及”
  rationale: 原文宾语是专名“埃及”，但关系从句使用复数形式，显示这里以国家名代表其人民；译为“埃及人”不改变所指，也避免现代汉语中的生硬表达。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“如此说”保留先知宣告的固定格式；句序按汉语调整，将关系从句置于“各族”之前。
