  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י מֵבִ֥יא עָלַ֖יִ/ךְ חָ֑רֶב וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ אָדָ֥ם וּ/בְהֵמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am bringing a sword against you[b], and I will cut off from you man and beast.'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：“看哪，我正要使刀剑临到你[a]，从你那里剪除人和牲畜[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “刀剑”在这里也可作集合性的意象，泛指战争、杀戮和审判。
    reason: lexical_alternative
  - marker: b
    text: “人和牲畜”是先知书中常见的审判用语，表示人类和动物一并遭灾。
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的指控，引出由此而来的审判；“所以”自然清楚，并保留原文的推论关系。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知书中庄重而固定的传信公式，同时符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的“主”和四字神名 יְהוִה；“主耶和华”是中文中清楚、庄重且不重复的组合称谓。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 标示郑重宣告并唤起听者注意，保留先知话语的突显作用。
- source_word: מֵבִיא
  choice: 正要使……临到
  rationale: הִנְנִי 加分词表达迫近、即将发生的行动；“正要”传达临近感，“使……临到”也自然呈现神主动施行审判。
- source_word: עָלַיִךְ חָרֶב
  choice: 使刀剑临到你
  rationale: “临到你”体现 עַל 在敌对审判语境中的指向；“刀剑”既保留意象，也可自然指战争与杀戮。
- source_word: וְהִכְרַתִּי
  choice: 剪除
  rationale: 保留 כרת 的“砍断、除掉”意象及先知审判语体，比单纯译作“消灭”更贴近原文。
- source_word: מִמֵּךְ
  choice: 从你那里
  rationale: 埃及在上下文中被拟人化为阴性单数；此译法明确表达从其境内除去。
- source_word: אָדָם וּבְהֵמָה
  choice: 人和牲畜
  rationale: 这是审判语境中的成套表达，涵盖人类与陆上家畜；“牲畜”比“野兽”更符合 בְּהֵמָה 在此处的通常范围。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”同时保留称号与专名两个要素，并采用现代中文读者熟悉的圣经称谓；不把两个要素合并为泛称，也不在正文中强行采用存在争议的音译形式。
- issue: 刀剑与审判的关系
  choice: 保留“刀剑”意象，并以脚注说明其可统指战争和审判
  alternative: 直接译作“战争”或“军事灾祸”
  rationale: 原文 חֶרֶב 是具体的“刀剑”，但在先知审判语境中可作集合性意象；正文保留形象，脚注呈现语义范围，避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”“如此说”“剪除”保留原文的郑重与力度；“正要”表现行动迫近。引号用于清楚标示神谕正文。
