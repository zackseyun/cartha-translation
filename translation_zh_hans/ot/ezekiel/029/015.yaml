source:
  edition: WLC
  text: מִן הַ/מַּמְלָכוֹת֙ תִּהְיֶ֣ה שְׁפָלָ֔ה וְ/לֹֽא תִתְנַשֵּׂ֥א ע֖וֹד עַל הַ/גּוֹיִ֑ם וְ/הִ֨מְעַטְתִּ֔י/ם לְ/בִלְתִּ֖י רְד֥וֹת בַּ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/015.yaml
  text: It will be the lowliest of the kingdoms[a], and it will no longer exalt itself above the nations; and I will diminish them[d][c][b], so that they will not rule over the nations.
translation:
  language: zh_hans
  text: 它必成为诸王国中最卑微的，不再高抬自己，凌驾于列国之上[b]。我要使他们减少[c]，使他们不能统治列国[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “高抬自己”也可译为“被高举”。原文形式可表达自我抬高或被抬高；上下文较支持前者。
    reason: lexical_alternative
  - marker: c
    text: 直译：“我要使他们变少。”复数“他们”把埃及作为其人民及国力的集合体来指称。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“在列国中统治”；这里按汉语习惯译作“统治列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמַּמְלָכוֹת תִּהְיֶה שְׁפָלָה
  choice: 它在列国中必成为最卑微的国
  rationale: מן在比较结构中具有部分式、最高级含义；“在列国中……最卑微”自然表达埃及相较其他王国所受的贬抑。此处ממלכות直译为“诸王国”，但现代汉语用“列国”更简洁庄重。
- source_word: וְלֹא תִתְנַשֵּׂא עוֹד עַל הַגּוֹיִם
  choice: 不再高抬自己，凌驾于列国之上
  rationale: תתנשא可表示自我抬高，也可表示被抬高；上下文针对埃及的国势和骄傲，正文采用反身性的“高抬自己”。על表示相对于列国居高位，译作“凌驾于……之上”。
- source_word: וְהִמְעַטְתִּים
  choice: 我要使他们人数减少
  rationale: מעט的使役式意为“使少、使减少”，复数后缀把作为国家的埃及视为其人民的集合体。“人数减少”明确保留由单数国家转为复数人民的语法现象。
- source_word: לְבִלְתִּי רְדוֹת בַּגּוֹיִם
  choice: 使他们不能再统治列国
  rationale: לבלתי引出阻止性的目的或结果，רדה意为管辖、统治。介词ב在此与统治对象相连，按现代汉语习惯译为“统治列国”；“再”承接前文对埃及昔日权势的否定。
theological_decisions:
- issue: 埃及在本句中由单数国家转为复数所指
  choice: 前半句用“它”指埃及国，后半句用“他们”指埃及人民这一集合体
  alternative: 全句统一译作“它”，把复数后缀泛化为国家
  rationale: 希伯来文本明确保留单数主语与复数宾语后缀之间的转换；译文不将其抹平，也不把“他们”具体限定为军队或统治者。
- issue: לְבִלְתִּי所表达的目的与结果关系
  choice: 译为“使他们不能再”，容纳神意旨所导致的结果
  alternative: 译为“免得他们”或“为要不让他们”以更明确强调目的
  rationale: 原文可兼具目的和结果色彩，正文避免作过度精细的神学限定。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“卑微”“高抬自己”“凌驾”“统治”保留先知性宣告的力度。正文保留埃及由单数国家到复数人民的指称转换，并用脚注说明，不擅自将其限定为人口、军力或政治精英之外的特定群体。
