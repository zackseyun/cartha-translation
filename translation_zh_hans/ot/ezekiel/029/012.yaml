  text: וְ/נָתַתִּ֣י אֶת אֶרֶץ֩ מִצְרַ֨יִם שְׁמָמָ֜ה בְּ/ת֣וֹךְ אֲרָצ֣וֹת נְשַׁמּ֗וֹת וְ/עָרֶ֨י/הָ֙ בְּ/ת֨וֹךְ עָרִ֤ים מָֽחֳרָבוֹת֙ תִּֽהְיֶ֣יןָ שְׁמָמָ֔ה אַרְבָּעִ֖ים שָׁנָ֑ה וַ/הֲפִצֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְֽ/זֵרִיתִ֖י/ם בָּ/אֲרָצֽוֹת־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/012.yaml
  text: And I will make the land of Egypt a desolation among desolated lands[a], and her cities will be a desolation among ruined cities for forty years[b]; and I will scatter Egypt among the nations and disperse them through the lands.
translation:
  language: zh_hans
  text: 我必使埃及地在荒凉的各地中成为荒凉之地[a]；她的城邑也必在沦为废墟的城邑中荒凉四十年。我必将埃及分散在列国中，把他们[b]散布到各地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “荒凉的各地”和“沦为废墟的城邑”也可译作“遭毁坏的各地”和“遭毁坏的城邑”。原文在两个平行分句中使用意义相近的“荒凉／毁坏”用语。
    reason: lexical_alternative
  - marker: b
    text: 这里的“他们”指埃及的人民。原文先用地名“埃及”，随后转用复数代词“他们”。
    reason: referent_clarification
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我必使……成为
  rationale: נתן在“宾语＋状态名词”的结构中表示使之进入某种状态；这样译既保留致使意义，也符合现代汉语。
- source_word: אֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 原文明确提到“埃及之地”，保留“地”可突出审判所造成的疆土荒废。
- source_word: שְׁמָמָה
  choice: 荒地／荒凉
  rationale: 该词指荒废、凄凉的状态；首句按名词译作“荒地”，平行句按汉语习惯译作“荒凉”。
- source_word: בְּתוֹךְ אֲרָצוֹת נְשַׁמּוֹת
  choice: 在荒凉的各地中
  rationale: בְּתוֹךְ保留“在……中”的空间和归列意味；אֲרָצוֹת在此译作“各地”，避免把地理实体过度限定为现代国家。
- source_word: וְעָרֶיהָ
  choice: 她的城邑
  rationale: 保留原文指向埃及地的阴性单数代词及先知文学中的拟人色彩；“城邑”庄重而仍易懂。
- source_word: בְּתוֹךְ עָרִים מָחֳרָבוֹת
  choice: 在沦为废墟的城邑中
  rationale: מָחֳרָבוֹת描写遭毁坏、成为废墟的城邑；此译清楚呈现毁灭后的状态。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 直接保留原文所说的持续时间，不作象征性解释。
- source_word: וַהֲפִצֹתִי
  choice: 我必使……分散
  rationale: פוץ的使役式表达使人群被驱散；“使……分散”保留其致使语气。
- source_word: אֶת מִצְרַיִם
  choice: 埃及
  rationale: 保留原文地名，而不在正文中直接改成“埃及人”；后面的复数代词表明实际被驱散的是埃及民众。
- source_word: בַּגּוֹיִם
  choice: 在列国中
  rationale: גּוֹיִם在先知审判语境中通常指众多国家或民族，“列国”简洁庄重。
- source_word: וְזֵרִיתִים בָּאֲרָצוֹת
  choice: 把他们散布到各地
  rationale: זרה可指撒散或簸散；这里与前句平行，表示民众被迫分布到不同地方。“散布”既保留意象，又避免机械重复。
theological_decisions:
- issue: 驱散句中“埃及”的所指
  choice: 正文先保留地名“埃及”，随后照原文使用复数“他们”
  alternative: 直接译作“埃及人”，并全程使用人称复数
  rationale: 希伯来文先用地名מִצְרַיִם，继而以复数宾语后缀指代其居民。保留这一转换，可呈现从国家／土地到人民的转喻，而不替原文消除张力。
- issue: “四十年”的性质
  choice: 按明确时段直译，不解释其是否兼具象征意义
  alternative: 在正文或注释中说明为象征性的完整时期
  rationale: 本节本身只陈述“四十年”，未明确交代其解释方式；译文不应添加经文没有明说的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“荒地”“荒凉”“废墟”保留审判宣告的力度；“她的城邑”有意保存希伯来文对埃及地的阴性拟人表达。句法适度贴近原文的平行结构，同时避免生硬逐词对译。
