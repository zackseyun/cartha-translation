  rationale: 修订仅处理汉语词义与句法：以“荒凉之地”避免“荒地”的泛化含义；以“将埃及分散”清楚呈现使役式；并将脚注b移至“他们”后。保留“在……中”的归列／比较意味、四十年的明确期限，以及原文从“埃及”到“他们”的转喻和歧义。
