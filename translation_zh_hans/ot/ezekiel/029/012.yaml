  terminology: “埃及地”“城邑”“列国”适合庄重的先知书语体。“荒凉之地”与“废墟”分别对应两组近义而不完全相同的希伯来语毁坏用词。保留“埃及”及后面的“他们”，不把正文直接改作“埃及人”，以维持原文的表述转换。
