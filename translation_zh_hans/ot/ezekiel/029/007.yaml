revisions:
- from: 他们用手抓住你时[a]，你就被压碎，劈裂了他们每个人的肩膀；他们倚靠你时，你就折断，使他们人人都腰胯不稳[b]。
  to: 他们用手抓住你时[a]，你被压碎，劈裂了他们所有的肩膀；他们倚靠你时，你折断了，使他们所有的腰都站立不稳[b]。
  rationale: 仅作必要的汉语行文修订：将不自然的分配式表达改为集合表达，并使“腰”的语法角色清晰。保留草稿对于有争议的手掌后缀所作的脚注提示，以及对难解的“使腰站立”这一表达的谨慎处理；不将身体动作抽象化为政治或神学解释。
  reviewer_model: gpt-5.6-terra
