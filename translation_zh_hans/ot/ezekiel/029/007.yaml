language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בְּ/תָפְשָׂ֨/ם בְּ/ךָ֤ ב/כפ/ך תֵּר֔וֹץ וּ/בָקַעְתָּ֥ לָ/הֶ֖ם כָּל כָּתֵ֑ף וּ/בְ/הִֽשָּׁעֲנָ֤/ם עָלֶ֨י/ךָ֙ תִּשָּׁבֵ֔ר וְ/הַעֲמַדְתָּ֥ לָ/הֶ֖ם כָּל מָתְנָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/007.yaml
  text: When they took hold of you with their hand[a], you were crushed, and you split open every shoulder for them; and when they leaned on you, you were broken[b], and you made all their hips stand unsteadily.
translation:
  language: zh_hans
  text: 他们用手抓住你时[a]，你被压碎，劈裂了他们所有的肩膀；他们倚靠你时，你折断了，使他们所有的腰都站立不稳[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本直译作“他们抓住你的手掌时”；这里按芦苇杖被人用手抓住的意象译出。
    reason: 原文人称后缀与上下文意象之间存在张力。
  - marker: b
    text: “腰”也可译作“腰胯”或“腰部”；“使他们所有的腰都站立不稳”原文直译近于“使所有的腰站立”。
    reason: 保留 מָתְנַיִם 的词义范围及 עמד 使役式的字面表达。
lexical_decisions:
- source_word: בְּתָפְשָׂם בְּךָ
  choice: 他们……抓住你时
  rationale: בְּ 加不定式构成时间从句；“抓住”保留把埃及当作芦苇杖握住的具体形象。
- source_word: בכפך
  choice: 用手
  rationale: 马所拉文本的辅音及元音指向“你的手掌”，但语境中的动作主体是抓握芦苇杖的人；正文采用自然且符合整体意象的“用手”，并以脚注保留原文形式造成的歧义。
- source_word: תֵּרוֹץ
  choice: 被压碎
  rationale: רצץ 的尼法勒式表示被压碎或被折坏；“被压碎”既保留被动意义，也与下半节 שבר 的“折断”有所区别。
- source_word: וּבָקַעְתָּ
  choice: 劈裂了
  rationale: בקע 表示劈开、裂开；“劈裂”呈现断芦苇伤及抓握者的猛烈身体意象，又不与 שבר 混同。
- source_word: כָּל כָּתֵף
  choice: 他们每个人的肩膀
  rationale: כָּתֵף 直指肩膀；单数配 כָּל 可按分配意义译为“每个人的肩膀”，使现代汉语清楚自然。
- source_word: וּבְהִשָּׁעֲנָם עָלֶיךָ
  choice: 他们倚靠你时
  rationale: שען 表示身体倚靠，也可引申为信赖；正文保留芦苇杖比喻中的具体动作，不提前抽象化为政治上的依赖。
- source_word: תִּשָּׁבֵר
  choice: 你就折断
  rationale: שבר 的尼法勒式意为被折断、断裂；汉语“折断”符合支撑物突然失效的画面。
- source_word: וְהַעֲמַדְתָּ כָּל מָתְנַיִם
  choice: 使他们人人都腰胯不稳
  rationale: עמד 的使役式字面为“使站立”，但在支撑折断的语境中结果是站立不稳；מָתְנַיִם 指腰部、腰胯。译文以自然汉语表达身体失去支撑，同时用脚注保留较直译形式。
theological_decisions:
- issue: 埃及作为虚假支撑的比喻应具体呈现还是抽象解释
  choice: 正文保留“抓住、肩膀、倚靠、腰胯”等芦苇杖及人体动作的具体形象。
  alternative: 把“倚靠你”直接译作“信赖你”或“依赖你”。
  rationale: 本节承接上文埃及是芦苇杖的比喻。保留具体画面，让政治与神学上的虚假倚赖由比喻本身显明，而不在翻译中先行解释。
- issue: בכפך 的人称后缀与语境之间的张力
  choice: 正文按抓握者的动作译为“用手”，脚注说明马所拉文本直译为“你的手掌”。
  alternative: 正文译为“抓住你的手掌时”。
  rationale: 希伯来文本表面形式与芦苇杖意象中的自然施事关系存在张力；正文追求可理解的意象，脚注则不掩盖原文的人称形式。
- issue: “使所有腰胯站立”的难解表达
  choice: 译为“使他们人人都腰胯不稳”。
  alternative: 形式直译为“使他们所有的腰胯站立”。
  rationale: 上下文显然描写支撑崩塌导致身体失稳，但原文动词本身是“使站立”；正文传达语境效果，脚注保留其字面结构，避免把不确定的具体姿态说得过死。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。句式保持先知诗歌的平行结构；“被压碎／折断”和“劈裂／腰胯不稳”既区分原文动词，也维持强烈的身体性比喻。
