reference: Ezekiel 29:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/נְטַשְׁתִּ֣י/ךָ הַ/מִּדְבָּ֗רָ/ה אוֹתְ/ךָ֙ וְ/אֵת֙ כָּל דְּגַ֣ת יְאֹרֶ֔י/ךָ עַל פְּנֵ֤י הַ/שָּׂדֶה֙ תִּפּ֔וֹל לֹ֥א תֵאָסֵ֖ף וְ/לֹ֣א תִקָּבֵ֑ץ לְ/חַיַּ֥ת הָ/אָ֛רֶץ וּ/לְ/ע֥וֹף הַ/שָּׁמַ֖יִם נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/005.yaml
  text: I will cast you into the wilderness[a], you and all the fish of your streams. You will fall on the open field; you will not be gathered or collected[c][b]. I have given you as food to the beasts of the earth and to the birds of the heavens.
translation:
  language: zh_hans
  text: 我要把你和你河道里所有的鱼一同丢弃到旷野[a]。你必倒在田野之上；你不会被收起，也不会被聚拢[b]。我已把你交给地上的野兽和天上的飞鸟作食物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河道”在这里也可译作“尼罗河水道”；相应的整句可理解为“你和你尼罗河各水道里所有的鱼”。在埃及语境中，这个希伯来词常指尼罗河及其水系。
    reason: cultural_note
  - marker: b
    text: 直译近似“你不会被收起，也不会被聚集”。原文连用两个近义动词，强调无人收取尸身；语境也可能暗示无人收殓安葬。
    reason: lexical_alternative
  - marker: c
    text: “我已把你交给”采用了原文的完成式。这是预言性的表达，把将要发生的审判说成已经成就，以强调它必然临到；也可译作“我必把你交给”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: 我要把你……丢弃
  rationale: נטשׁ可指离弃、抛下或丢弃；在审判和暴尸的语境中，“丢弃”兼顾主动处置与弃置不顾的含义。
- source_word: הַמִּדְבָּרָה
  choice: 到旷野
  rationale: 词尾的方向形式表示朝向旷野。“旷野”既自然，也保留荒凉、无人之地的意象。
- source_word: דְּגַת יְאֹרֶיךָ
  choice: 你河道里所有的鱼
  rationale: דגה是集合名词，指鱼类；יְאֹר在埃及语境中常指尼罗河及其水道。正文用较宽泛自然的“河道”，尼罗河背景置于脚注。
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: 在田野之上
  rationale: 该短语描写倒毙在田野表面、暴露无掩的状态；“在田野之上”保留原文空间意象和庄重语体。
- source_word: תִּפּוֹל
  choice: 你必倒在
  rationale: 直译为“倒下”；“必”在预言性审判语境中自然表达其确定性。
- source_word: לֹא תֵאָסֵף וְלֹא תִקָּבֵץ
  choice: 你不会被收起，也不会被聚拢
  rationale: 两个近义的被动动词并列，加强无人收取尸身的意思。正文保留词义上的重复及其含蓄性，不直接增译“埋葬”。
- source_word: לְחַיַּת הָאָרֶץ
  choice: 地上的野兽
  rationale: חיה在此类食尸场景中通常指野生走兽；“野兽”简洁而有力度。
- source_word: וּלְעוֹף הַשָּׁמַיִם
  choice: 天上的飞鸟
  rationale: 保留常见的希伯来圣经天地意象，同时符合现代汉语的庄重表达。
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: 我已把你交给……作食物
  rationale: 完成式按预言性完成式处理，以“已”呈现将来的审判如同已经成就，强调其确定性；“交给……作食物”自然传达被交付吞食。
theological_decisions:
- issue: 末句预言性完成式的时间表达
  choice: 我已把你交给……作食物
  alternative: 我必把你交给……作食物
  rationale: 希伯来文נְתַתִּיךָ为完成式，在预言中可把尚未来到的审判说成已经成就。保留“已”可呈现这种修辞力度，而脚注说明其所指仍是必然临到的审判。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。正文保留原文近义动词的并列和末句预言性完成式，不把“收起、聚拢”直接释成“埋葬”，也不把河道在正文中限定为尼罗河水道；相关语境与可能含义由脚注说明。
