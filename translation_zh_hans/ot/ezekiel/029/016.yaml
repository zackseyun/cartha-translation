base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/016.yaml
  text: And it will no longer be for the house of Israel a source of confidence[a], bringing iniquity to remembrance when they turn after them[c][b]; then they will know that I am the Lord GOD.
translation:
  language: zh_hans
  text: 埃及必不再成为以色列家的倚靠，也不再使他们的罪孽被记起；当他们转去依附埃及时，埃及曾使他们的罪孽被记起。[a]这样，他们就知道我是主耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们的罪孽被记起”也可译作“使他们想起自己的罪孽”或“使他们的罪责被提起”。原文没有明确是谁记起。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה עוֹד
  choice: 必不再成为
  rationale: 表达否定、不完成式和“再”的组合所具有的将来终止含义；“必不再”也保留先知宣告的力度。
- source_word: לְבֵית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留希伯来文的民族—盟约称谓，不简化为“以色列人”。
- source_word: לְמִבְטָח
  choice: 倚靠
  rationale: 该词指人赖以获得安全的对象或保障；“倚靠”自然地呈现以色列对埃及的政治依赖。
- source_word: מַזְכִּיר עָוֺן
  choice: 使他们的罪孽被记起
  rationale: 保留使役分词“使……被记起”的含义，并以“罪孽”表达 עָוֺן 的道德过犯意义。
- source_word: בִּפְנוֹתָם אַחֲרֵיהֶם
  choice: 他们转去依附埃及时
  rationale: ב 加不定式表达时间情境；“转去依附”体现寻求、跟从和倚赖之意。复数代词按上下文明确为埃及，避免中文中指代不清。
- source_word: וְיָדְעוּ
  choice: 这样，他们就知道
  rationale: “这样……就”自然表达上下文中的结果关系，同时不改变连接词的基本功能。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的“主”和四字神名 יְהוִה；采用现代中文圣经读者熟悉的“耶和华”。
theological_decisions:
- issue: 埃及与以色列罪孽被记起之间的关系
  choice: 埃及不再成为倚靠；转去依附埃及会使罪孽被记起
  alternative: 埃及本身提醒以色列有罪
  rationale: 希伯来文分词短语在句法上可描述这个“倚靠”所产生的作用；译文保留因依附埃及而唤起罪责的关系，不进一步断定是以色列、上帝或他者在记起。
- issue: 神圣称号 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 保留“主”与神名两个成分；“耶和华”是现代中文中广为理解的传统形式，且不以“主上主”模糊原文的复合称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“倚靠”“罪孽”保留先知书的神学分量；将复数“他们”按上下文译明为“埃及”，以免中文误解其先行词。脚注保留 מַזְכִּיר עָוֺן 在施事者和“罪孽／罪责”之间的真实歧义。
