id: EZK.29.1
reference: Ezekiel 29:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בַּ/שָּׁנָה֙ הָ/עֲשִׂירִ֔ית בָּ/עֲשִׂרִ֕י בִּ/שְׁנֵ֥ים עָשָׂ֖ר לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/001.yaml
  text: In the tenth year[a], in the tenth month, on the twelfth day of the month, the word of Yahweh came to me, saying,
translation:
  language: zh_hans
  text: 第十年十月十二日，耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָעֲשִׂירִית
  choice: 第十年
  rationale: 希伯来文只给出“第十年”，本节没有明说纪年的起点，因此不补入“被掳”或某位君王等解释。
- source_word: בָּעֲשִׂרִי
  choice: 十月
  rationale: 原文直译为“在第十”，但在日期公式中所指月份明确；现代汉语自然表达为“十月”。
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ
  choice: 十二日
  rationale: 这是指该月第十二天的标准日期表达；汉语在前文已有“十月”时，用“十二日”即可清楚传达。
- source_word: הָיָה דְבַר יְהוָה
  choice: 耶和华的话临到
  rationale: הָיָה 在先知领受启示的固定公式中表示神的话来到；“临到”既贴近原文结构，也符合庄重而通顺的现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”表达四字神名 יהוה，而不改作称号“主”。
- source_word: אֵלַי
  choice: 我
  rationale: 介词加第一人称后缀表示神的话临到先知本人；在“临到我”中自然明确。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出下一节神谕的内容；“说”是现代汉语中简洁自然的对应表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一称号。中文正文采用广为人知且具有专名功能的“耶和华”；“雅威”更接近学界常见的拟音，但原始发音并不能完全确定。
- issue: 第十年的纪年起点
  choice: 不补明纪年起点
  alternative: 第十年（指约雅斤王被掳后第十年）
  rationale: 本节原文本身未说明从何事起算；为保存文本的明确程度与潜在歧义，正文不加入上下文推断。
translation_notes:
  register: 采用简洁、庄重、现代的先知书叙述语体。“第十年十月十二日”符合现代汉语日期次序；“耶和华的话临到我”保留希伯来先知启示公式的结构和语感。
