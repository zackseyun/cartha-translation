source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י נֹתֵ֛ן לִ/נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל אֶת אֶ֣רֶץ מִצְרָ֑יִם וְ/נָשָׂ֨א הֲמֹנָ֜/הּ וְ/שָׁלַ֤ל שְׁלָלָ/הּ֙ וּ/בָזַ֣ז בִּזָּ֔/הּ וְ/הָיְתָ֥ה שָׂכָ֖ר לְ/חֵילֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/019.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am giving the land of Egypt to Nebuchadnezzar king of Babylon, and he will carry off its multitude, plunder its spoil, and seize its booty; and it will be wages for his army.'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：“看哪，我要把埃及地交给巴比伦王尼布甲尼撒；他必带走埃及的财富[a]，抢夺它的掠物，劫取它的战利品；埃及地将成为他军队的报酬。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “财富”所译的希伯来词也可指“众多的人”或“丰富之物”；在这里，结合掠夺和军队报酬的语境，很可能指埃及的财富或资源。
    reason: 保留 הֲמֹנָהּ 的词义歧义，并说明正文选择经济含义的语境依据。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 明确承接上文所述缘由，保留推论和结果关系，同时符合现代汉语表达。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留先知信息的固定宣告格式；“主耶和华”分别对应尊称 אֲדֹנָי 与神名 יְהוָה，也是庄重而通行的中文表达。
- source_word: הִנְנִי נֹתֵן
  choice: 看哪，我要把……交给
  rationale: הִנְנִי 引出郑重而确定的神圣宣告；其后的分词表达临近且确定的行动。“我要”在中文中自然传达这一语气。
- source_word: אֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: 保留 אֶרֶץ 的地域含义，而不只译作国名“埃及”。
- source_word: וְנָשָׂא הֲמֹנָהּ
  choice: 他必掳走其中的财富
  rationale: הָמוֹן 可指众多的人、丰富之物或财富；在掠物、战利品和军队报酬的语境中，“财富”最为顺畅，但以脚注保留其词义歧义。
- source_word: וְשָׁלַל שְׁלָלָהּ
  choice: 抢夺其中的掠物
  rationale: 保留同根动词与名词形成的强调，并维持军事掠夺的语域。
- source_word: וּבָזַז בִּזָּהּ
  choice: 劫取其中的战利品
  rationale: 与前一分句构成平行表达；“劫取”传达强行夺取，“战利品”符合军事语境。
- source_word: וְהָיְתָה שָׂכָר לְחֵילוֹ
  choice: 这一切将成为他军队的报酬
  rationale: שָׂכָר 是工价或报酬，חַיִל 在此指军队。“这一切”自然概括前述从埃及夺取之物，同时避免中文阴性代词指代不明。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 原文同时使用“主”这一尊称和四字神名。正文采用现代中文圣经传统中辨识度较高的“主耶和华”，既不把神名化约为普通称号，也避免生硬重复。
- issue: 埃及被交给巴比伦王与军队所得“报酬”的关系
  choice: 按原文直述神把埃及地交给尼布甲尼撒，并称所得为军队的报酬
  alternative: 解释为神认可巴比伦军队的一切行为，或仅指一般历史结果
  rationale: 本节陈述神的主权行动及军队所得的补偿性质，却没有进一步说明对巴比伦行为的道德评价；译文保留这一神学张力，不作额外推断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留先知宣告的郑重语气；“尼布甲尼撒”采用现代中文读者熟悉的专名形式。三个掠夺分句保持平行节奏，同时避免刻意仿造希伯来同根词而造成不自然的中文。
