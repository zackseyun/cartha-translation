  text: כִּ֣י בֹ֔חַן וּ/מָ֕ה אִם גַּם שֵׁ֥בֶט מֹאֶ֖סֶת לֹ֣א יִֽהְיֶ֑ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/018.yaml
  text: For there is a testing[b][a]; and what if even the scepter that despises will not remain? declares the Lord GOD.
translation:
  language: zh_hans
  text: 因为有试验[a]；若连那藐视的权杖也不复存在，又将如何呢？这是主雅威的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文格外难解，尤其是有关“权杖”的分句。也可译作：“因为有试验；若连那藐视的权杖也不复存在，又将如何呢？”其中“藐视的”可按主动分词理解为“藐视（对象未明）的”，也有人理解为“被藐视的”。“权杖”一词也可译作“杖”或“支派”。
    reason: 说明本节艰涩的句法，并保留“藐视”与“权杖”的主要句法及词义可能。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前述命令或审判提供说明；保留原文的因果连接作用。
- source_word: בֹחַן
  choice: 这是试验
  rationale: 该词来自בחן，意为试验、检验或熬炼。原句极为简略，译文不明确指出受试验者，以保留原文的含混性。
- source_word: וּמָה אִם גַּם
  choice: 即使……又会怎样呢
  rationale: 将连续的疑问与条件粒子合并为自然的汉语反问句，同时保留其强调和假设语气。
- source_word: שֵׁבֶט
  choice: 权杖
  rationale: 此词也可指杖、棍或支派；在刀剑审判与统治权的语境中，权杖较能体现王权或司法意象。
- source_word: מֹאֶסֶת
  choice: 藐视人的
  rationale: 来自מאס，意为拒绝、厌弃或藐视。按阴性单数分词理解为修饰阴性名词“权杖”的主动性表达；补出“人的”仅为使汉语通顺，并未限定具体对象。
- source_word: לֹא יִהְיֶה
  choice: 不再存在
  rationale: 字面为“将不存在”。采用“不再存在”表达终止存续之意，同时避免把它弱化成仅仅“不再掌权”。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: 以庄重而自然的现代汉语呈现先知宣告公式，并按中文传统译名保留复合神名。
theological_decisions:
- issue: 复合称号אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是现代中文圣经语境中广为识别的专名形式；前加“主”对应אֲדֹנָי，也避免将两部分混为一个普通称号。
- issue: 权杖与“藐视”的句法关系
  choice: 权杖是执行藐视动作的主体
  alternative: 被藐视的权杖
  rationale: מֹאֶסֶת为阴性单数主动分词，可与阴性名词שֵׁבֶט一致；不过本节希伯来文公认艰涩，因此在脚注中保留另一种可能。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。正文保留原文突兀的反问和神学张力，不擅自确定试验的对象，也不把权杖明确等同于某一历史君王或支派。
