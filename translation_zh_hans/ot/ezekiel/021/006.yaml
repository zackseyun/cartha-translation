  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/006.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），传统上常译作“主”。
    reason: 说明原文神名及传统替代译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知书常见公式“耶和华的话临到……”中，“临到”自然表达启示来到先知这一含义，也保留原文的庄重语气。
- source_word: דְבַר
  choice: 话
  rationale: 此处指从上帝而来的启示性言语；“话”保留先知书中的固定表达，并比单纯译作“信息”更贴近原文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用四字神名יהוה；采用现代中文读者熟悉的专名“耶和华”，而不以“主”这一称号替代。
- source_word: אֵלַי
  choice: 到我
  rationale: 介词与第一人称后缀表示话语临到先知；与“临到”组合为自然、准确的现代汉语。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文的直接话语；译作“说”简洁清楚，并以冒号提示后续引语。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用以色列上帝的专名。正文采用中文传统中最为人熟悉的音译“耶和华”，同时以脚注说明其对应希伯来文YHWH；不将专名默默替换为称号“主”。
translation_notes:
  register: 采用现代、庄重而易懂的先知书文体。“耶和华的话临到我”保留中文圣经读者熟悉的启示公式；“说：”自然引出下文。脚注标记紧随其所说明的神名。
