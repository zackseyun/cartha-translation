  text: וְ/אָמַרְתָּ֞ לְ/אַדְמַ֣ת יִשְׂרָאֵ֗ל כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֣י אֵלַ֔יִ/ךְ וְ/הוֹצֵאתִ֥י חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ צַדִּ֥יק וְ/רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/008.yaml
  text: 'And say to the land of Israel[a], ‘Thus says Yahweh: Behold, I am against you, and I will draw my sword from its sheath and cut off from you both righteous and wicked.’'
translation:
  language: zh_hans
  text: 你要对以色列地说：‘耶和华如此说：看哪，我与你为敌；我要从鞘中拔出我的刀，把义人和恶人都从你那里剪除。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: 以色列地
  rationale: אַדְמָה本指土地、地土；这里是先知向该地域及其中居民发言，译作“以色列地”自然且保留土地被拟人化为受话者的表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: הִנְנִי אֵלַיִךְ
  choice: 看哪，我要与你为敌
  rationale: הִנְנִי保留强调和引人注意的语气；אֵלַיִךְ在此表达对抗、临到攻击之意。“与你为敌”清楚传达神对拟人化之土地的敌对宣告。
- source_word: וְהוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ
  choice: 我要从鞘中拔出我的刀
  rationale: הוציא字面为“取出、带出”，与刀和刀鞘搭配时，现代汉语惯用“拔出”；“鞘”简洁保留原文意象。
- source_word: וְהִכְרַתִּי
  choice: 剪除
  rationale: כרת的使役式在审判语境中表示除灭、断绝；“剪除”保留“切断”的具体力度，也符合庄重的先知性语言。
- source_word: מִמֵּךְ
  choice: 从你那里
  rationale: 受话者“以色列地”为阴性单数并被拟人化；“从你那里”保留从这片土地中除去人的空间关系。
- source_word: צַדִּיק וְרָשָׁע
  choice: 义人和恶人都
  rationale: 原文明确并列两类人；加“都”自然表达审判波及双方的整体范围，但不额外解释其神学含义。
theological_decisions:
- issue: 审判同时涉及“义人和恶人”的范围
  choice: 直译为“把义人和恶人都从你那里剪除”
  alternative: 可将此理解为修辞性或群体性的灾难描述，而非否定上帝在终极审判中对个人的公正区分。
  rationale: 本节明确点出义人和恶人两类，译文保留其突出的神学张力，不在正文中替文本调和或解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”保留先知宣告的强调语气；“拔出我的刀”“从鞘中”保持原文鲜明意象；避免用解释性措辞消解义人与恶人一同受灾的张力。
