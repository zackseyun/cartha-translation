  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֖ה אָמַ֣ר אֲדֹנָ֑/י אֱמֹ֕ר חֶ֥רֶב חֶ֛רֶב הוּחַ֖דָּה וְ/גַם מְרוּטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/014.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Say, “A sword, a sword, sharpened and also polished.”’'
translation:
  language: zh_hans
  text: 人子啊，你要说预言，并要说：“主如此说：你要说，‘刀，刀，已经磨快，也已经擦亮[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“磨光”。希伯来语形容这刀已被磨得光滑明亮。
    reason: 说明 מְרוּטָה 的词义范围；“擦亮”表达其明亮状态，“磨光”是贴近原文的可行替代译法。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 直译这一称呼，并保留《以西结书》中反复出现的固定先知称谓；“啊”自然表达希伯来语呼语语气。
- source_word: הִנָּבֵא
  choice: 说预言
  rationale: 这是 נבא 的命令式，要求以先知身份发言；“说预言”是清楚、现代且不过度解释的表达。
- source_word: וְאָמַרְתָּ
  choice: 并且说
  rationale: 保留接续的发言命令，也使本节多次出现的 אמר 在译文中可见。
- source_word: כֹּה אָמַר אֲדֹנָי
  choice: 主如此说
  rationale: 保留标准的先知使者公式。所给希伯来文本写作 אֲדֹנָי，并未出现四字神名，因此译作“主”，不增补“耶和华”。
- source_word: אֱמֹר
  choice: 你要说
  rationale: 保留第二个命令式及原文刻意重复的“说”，用来引出神谕的核心话语。
- source_word: חֶרֶב חֶרֶב
  choice: 刀！刀！
  rationale: 保留名词的强调性重复；用感叹号传达突兀、警示性的宣告，而不增添原文没有的限定语。
- source_word: הוּחַדָּה
  choice: 已经磨快
  rationale: 该被动形式表示刀已被磨得锋利；“磨快”比“磨锐”更自然，同时保留完成和被动结果。
- source_word: וְגַם מְרוּטָה
  choice: 也已经擦亮
  rationale: 表达附加递进，并呈现刀被磨光、发亮的状态；“擦亮”通俗而具象。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 主耶和华
  rationale: 以所提供的WLC文本为准，本节此处只有 אֲדֹנָי。译作“主”忠实反映该称号，并避免把未写出的四字神名加入正文。
- issue: 是否把刀的用途明说为屠杀
  choice: 正文不增补用途
  alternative: 为屠杀而磨亮
  rationale: 本节只描写刀已磨快并擦亮；其审判和杀戮意味可由上下文显明，不应在正文中把语境推论写成明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“人子”“主如此说”等《以西结书》的先知性表达，也保留原文连续的发言命令和“刀”的强调性重复。
