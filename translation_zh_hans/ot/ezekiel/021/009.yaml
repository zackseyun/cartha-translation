  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֛עַן אֲשֶׁר הִכְרַ֥תִּי מִמֵּ֖/ךְ צַדִּ֣יק וְ/רָשָׁ֑ע לָ֠/כֵן תֵּצֵ֨א חַרְבִּ֧/י מִ/תַּעְרָ֛/הּ אֶל כָּל בָּשָׂ֖ר מִ/נֶּ֥גֶב צָפֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/009.yaml
  text: Because I will cut off from you both the righteous and the wicked[b][a], therefore my sword will go out from its sheath against all flesh from south to north.
translation:
  language: zh_hans
  text: 因为我必从你那里剪除义人和恶人[a]，所以我的刀必出鞘，攻击一切有血肉的人[b]，从南到北。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我已经……剪除”。希伯来语的完成式既可表示已经完成的行动，也可在先知性语境中表示将来必定发生的行动。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“一切肉体”，是泛指所有有血肉、会死亡之人的常用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 这一复合表达引出审判临到的原因；“因为”自然、清楚地保留了因果关系。
- source_word: הִכְרַתִּי
  choice: 我必……剪除
  rationale: כרת在此意为“剪除”。该动词虽为完成式，但在先知性语境中可表达确定将要发生的事；下文“我的刀必出鞘”也支持将其译为将来而确定的行动。“剪除”保留了原文具体而带审判意味的形象。
- source_word: מִמֵּךְ
  choice: 从你那里
  rationale: 原文以阴性单数“你”称呼被人格化的土地或群体；“从你那里”直接保留介词关系，不额外限定为“从你中间”。
- source_word: צַדִּיק וְרָשָׁע
  choice: 义人和恶人
  rationale: 这是涵盖两端的并列表达，表示审判波及两者；“义人”和“恶人”是清楚、通行且庄重的对应词。
- source_word: לָכֵן
  choice: 所以
  rationale: 明确表示后一分句是前述行动的结果，符合现代汉语表达。
- source_word: תֵּצֵא חַרְבִּי
  choice: 我的刀必出鞘
  rationale: 原文直译为“我的刀必出去”；结合下一词“从刀鞘”，汉语用“出鞘”既自然，又保留刀剑被发动的鲜明意象。
- source_word: מִתַּעְרָהּ
  choice: 出鞘
  rationale: תערהּ指刀的鞘；汉语“出鞘”简洁表达“从它的鞘中出来”，其中阴性后缀所指的刀无需重复明说。
- source_word: אֶל כָּל בָּשָׂר
  choice: 攻击一切有血肉的人
  rationale: בשר字面为“肉体”；“有血肉的人”保留希伯来语习语，同时脚注说明其所指。“攻击”根据刀剑的敌对语境表达אֶל在此的趋向。
- source_word: מִנֶּגֶב צָפוֹן
  choice: 从南到北
  rationale: 该表达以南北两端表示遍及全境。“从南到北”自然地保留地理范围；此处不必把נֶגֶב专名化为“南地”。
theological_decisions:
- issue: 审判范围包括“义人和恶人”
  choice: 照原文保留义人与恶人都受到这场刀剑之灾波及的陈述。
  alternative: 把“义人”解释为表面上的义人，或在译文中限定这只涉及暂时性的历史灾祸而非终极定罪。
  rationale: 本节明说临到这地的审判不按义人与恶人区分其眼前影响。译文应保留这一神学张力，不加入原文没有明说的限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“剪除”“出鞘”保留原文的具体审判意象；“一切有血肉的人”兼顾希伯来语习语的形式与中文可理解性。脚注标记[a]、[b]均置于正文中对应位置。
