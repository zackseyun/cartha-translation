source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ לְ/יַ֣עַר הַ/נֶּ֔גֶב שְׁמַ֖ע דְּבַר יְהוָ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה הִנְ/נִ֣י מַֽצִּית בְּ/ךָ֣ אֵ֡שׁ וְ/אָכְלָ֣ה בְ/ךָ֣ כָל עֵֽץ לַח֩ וְ/כָל עֵ֨ץ יָבֵ֤שׁ לֹֽא תִכְבֶּה֙ לַהֶ֣בֶת שַׁלְהֶ֔בֶת וְ/נִצְרְבוּ בָ֥/הּ כָּל פָּנִ֖ים מִ/נֶּ֥גֶב צָפֽוֹנָ/ה־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/003.yaml
  text: 'And say to the forest of the Negev[a], ‘Hear the word of Yahweh. Thus says the Lord GOD: Behold, I am kindling a fire in you, and it will consume in you every green tree and every dry tree. The blazing flame will not be quenched[b], and by it every face from south to north will be scorched.’'
translation:
  language: zh_hans
  text: 你要对南地的树林[a]说：‘要听耶和华的话。主耶和华如此说：看哪，我要在你中间点火，烧尽你中间一切青翠的树和一切枯干的树。熊熊的火焰必不熄灭；从南到北，每一张脸都要被它灼伤。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “南地”也可译作“尼革夫”；原文词语既可泛指南方或南方地区，也可特指尼革夫地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַר הַנֶּגֶב
  choice: 南地的树林
  rationale: יַעַר指树林或林地；הַנֶּגֶב既可泛指南方、南地，也可特指尼革夫地区。上下文的先知性地理意象以“南地”表达较自然，同时保留其范围上的歧义。
- source_word: שְׁמַע דְּבַר יְהוָה
  choice: 要听耶和华的话
  rationale: 保留命令语气和先知宣告的庄重语域；“要听”在现代汉语中自然清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，直接呈现专名而不以“主”代替。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别表达אֲדֹנָי的称号“主”和יהוה的神名，既准确又符合庄重的现代中文习惯。
- source_word: הִנְנִי מַצִּית בְּךָ אֵשׁ
  choice: 看哪，我要在你里面点燃一把火
  rationale: “看哪”保留הִנְנִי引出郑重宣告的功能；“点燃”准确表达使役性的燃火动作，בְּךָ按树林这一集合性对象译为“在你里面”。
- source_word: וְאָכְלָה בְךָ
  choice: 烧尽你里面
  rationale: 火作主语时，אָכַל表示吞噬、烧毁；“烧尽”在汉语火灾语境中自然，并体现彻底毁灭。
- source_word: כָל עֵץ לַח וְכָל עֵץ יָבֵשׁ
  choice: 一切青翠的树和一切枯干的树
  rationale: לַח本义为湿润、新鲜，与枯干相对；用于树木时译作“青翠”既自然，也保留连不易燃烧的活树也不能幸免的反差。
- source_word: לֹא תִכְבֶּה לַהֶבֶת שַׁלְהֶבֶת
  choice: 熊熊的火焰必不熄灭
  rationale: 重叠强化的火焰表达用“熊熊”传达强烈燃烧；“必不熄灭”保留否定及确定语气。
- source_word: וְנִצְרְבוּ בָהּ כָּל פָּנִים
  choice: 所有人的脸都要被它灼伤
  rationale: פָּנִים字面为“脸”，这里不宜抽象化；נצרב表达被热力灼烧或烤焦，“灼伤”自然且不过度加重。
- source_word: מִנֶּגֶב צָפוֹנָה
  choice: 从南到北
  rationale: 简明保留空间范围，表达火灾影响遍及整个方向跨度。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名，应在正文中保留为专名；“耶和华”是现代简体中文圣经语境中最广为识别的传统音译，不把它与称号אֲדֹנָי混同。
- issue: 审判的树林与火焰意象
  choice: 在正文中保留具体意象
  alternative: 直接把树林解释为犹大，把火解释为神的审判
  rationale: 本节本身以树林和火说话；虽然后文会说明所指，翻译不应提前把比喻改写成解释，以免消除原有修辞张力。
- issue: “所有的脸”的所指
  choice: 所有人的脸
  alternative: 所有表面；一切面孔
  rationale: פָּנִים可有“脸、面、表面”等义。此处与灼烧搭配，通常指火势所及之人的脸；加入“人”使现代汉语清楚，但仍保留具体而略带夸张的先知图像。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留先知宣告的命令式、神谕公式和强烈火焰意象。仅设置一个确有必要的地名词义脚注；正文中的[a]与脚注完全对应。
