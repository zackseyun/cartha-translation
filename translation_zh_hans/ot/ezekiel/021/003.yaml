  to: 你要对南地的树林[a]说：‘要听耶和华的话。主耶和华如此说：看哪，我要在你中间点火，烧尽你中间一切青翠的树和一切枯干的树。熊熊的火焰必不熄灭；从南到北，每一张脸都要被它灼伤。’
