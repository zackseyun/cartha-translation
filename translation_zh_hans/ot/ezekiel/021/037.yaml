base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/037.yaml
  text: You will be fuel for the fire; your blood will be in the midst of the land. You will not be remembered[a], for I, Yahweh, have spoken.
translation:
  language: zh_hans
  text: 你必成为烈火的燃料；你的血必在这地之中。你必不再被记念[a]，因为我雅威已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的血”在本节的审判语境中，也可能含有“你的血债”或“你流人血的罪”之意。希伯来文直译为“你的血”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵשׁ ... לְאָכְלָה
  choice: 成为烈火的燃料
  rationale: 原文直译近于“给火作可吞吃之物”。结合火焚烧的意象，“成为烈火的燃料”是自然的现代汉语，也清楚表达被焚毁的审判结局。
- source_word: תִּהְיֶה
  choice: 你必成为
  rationale: 这是指向阴性单数受话者的未完成式；汉语以“你必”保留直接宣告及其确定语气。
- source_word: דָּמֵךְ יִהְיֶה בְּתוֹךְ הָאָרֶץ
  choice: 你的血必流在这地之中
  rationale: דָּמֵךְ直译为“你的血”；系词结构在此语境中意味着血留在或显露于当地。补出“流”使汉语自然，同时保留“血”的具体意象，不在正文中直接解释为血债。
- source_word: לֹא תִזָּכֵרִי
  choice: 你必不再被人记念
  rationale: זכר的Niphal式在此表示不再被记起。“被人记念”自然地表达被动含义，“不再”则传达从此归于遗忘的结果。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”音译四字神名，保留其作为名字而非称号的性质。
- source_word: דִּבַּרְתִּי
  choice: 已经说了
  rationale: 完成式用于先知审判宣告的定式，强调话语已发出且不可更改；“已经说了”在现代汉语中庄重而自然。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文保留神的专名，不以“主”替代。中文传统和现代普通读者对“耶和华”辨识度更高；“雅威”也是较接近学术重构发音的可行音译。
- issue: דָּמֵךְ是否明确译作“你的血债”
  choice: 正文译作“你的血”，脚注说明可能含有血债之意
  alternative: 你的血债
  rationale: 希伯来文表层形式是“你的血”，但审判语境可能指流血罪或血债。正文保留原有意象及歧义，避免把语境推论直接写入经文。
- issue: “血必在地中”的汉语表达
  choice: 你的血必流在这地之中
  alternative: 你的血必在这地之中
  rationale: 原文只用“是/在”，没有明说“流”；然而汉语若直译会显得生硬。“流在”把血被倾倒、留在当地的图景自然呈现出来，但不改变其公开受审判的核心含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“烈火的燃料”传达原文“给火作可吞吃之物”的意象；“记念”保持经文语体，但句法仍符合现代汉语。脚注标记[a]已在正文对应位置出现。
