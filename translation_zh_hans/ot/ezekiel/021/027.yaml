base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/027.yaml
  text: 'In his right hand was the divination for Jerusalem: to set battering rams[a], to open the mouth with slaughter, to raise the voice with a battle cry, to set battering rams against the gates, to heap up a siege ramp[b], to build a siege wall.'
translation:
  language: zh_hans
  text: 他右手中的占卜结果指向耶路撒冷：架设攻城槌，开口发出杀戮的号令[a]，扬声呐喊，架设攻城槌攻击城门，堆筑攻城坡道，建造围城工事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开口发出杀戮的号令”也可译作“开口喊叫，为要杀戮”；原文可能指发动攻击时喊出的命令或呼声。
    reason: lexical_alternative
  - marker: b
    text: “围城工事”也可译作“围城墙垒”或“攻城塔”；希伯来词泛指围城设施，具体形制不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימִינוֹ
  choice: 他右手中
  rationale: 保留占卜场景中具体的空间意象；介词在此自然理解为签或兆落在王的右手中。
- source_word: הַקֶּסֶם יְרוּשָׁלִַם
  choice: 占卜结果指向耶路撒冷
  rationale: 希伯来文极为简练，直译近于“占卜是耶路撒冷”；中文补出“结果指向”，清楚表达占卜选定进攻目标的语境，又不把占卜本身实体化为耶路撒冷。
- source_word: לָשׂוּם כָּרִים
  choice: 架设攻城槌
  rationale: כָּרִים 在围城语境中指撞击城门等设施的攻城槌；“架设”符合部署攻城器械的动作。
- source_word: לִפְתֹּחַ פֶּה בְּרֶצַח
  choice: 开口发出杀戮的号令
  rationale: 保留“开口”的形象，同时以“发出……号令”传达进攻时呼喊或下令的语境；בְּרֶצַח 的关系略有歧义，因此脚注保留“为要杀戮”的可能。
- source_word: לְהָרִים קוֹל בִּתְרוּעָה
  choice: 扬声呐喊
  rationale: 同时传达“提高声音”和 תְּרוּעָה 的高声呼喊；上下文已明确是攻城，无须额外加入原文没有明说的“战斗”。
- source_word: עַל שְׁעָרִים
  choice: 攻击城门
  rationale: 在攻城槌的语境下，עַל 表示器械所针对的目标；用“攻击”比机械直译“在城门上”自然清楚。
- source_word: לִשְׁפֹּךְ סֹלְלָה
  choice: 堆筑攻城坡道
  rationale: סֹלְלָה 指向城墙推进所筑的土坡或攻城坡道；“堆筑”自然体现动词“倾倒、堆起”的施工画面。
- source_word: לִבְנוֹת דָּיֵק
  choice: 建造围城工事
  rationale: דָּיֵק 泛指包围或攻击城市的围城设施，确切形制不明；正文用概括而稳妥的“围城工事”，脚注列出较具体的可能译法。
