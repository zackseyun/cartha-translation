  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם שִׂים לְ/ךָ֣ שְׁנַ֣יִם דְּרָכִ֗ים לָ/בוֹא֙ חֶ֣רֶב מֶֽלֶךְ בָּבֶ֔ל מֵ/אֶ֥רֶץ אֶחָ֖ד יֵצְא֣וּ שְׁנֵי/הֶ֑ם וְ/יָ֣ד בָּרֵ֔א בְּ/רֹ֥אשׁ דֶּֽרֶךְ עִ֖יר בָּרֵֽא־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/024.yaml
  text: And you[a], son of man, set for yourself two roads for the sword of the king of Babylon to come by; both of them shall go out from one land. And make a signpost[b]; make it at the head of the road to the city.
translation:
  language: zh_hans
  text: “你，人子啊，要为自己设立两条路，好让巴比伦王的刀沿着它们而来；两条路都要从一地出来。你要制作一个路标[a]；要在通往一座城的路首制作它[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “路标”原文直译为“手”；这里很可能指示方向的标记。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在通往一座城的路的头部”。“路首”可指道路的起点，也可能指主要交汇处或分岔处。
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 保留以西结书中固定的称呼方式，既自然庄重，也呈现先知作为人的身份。
- source_word: שִׂים לְךָ שְׁנַיִם דְּרָכִים
  choice: 要为自己划出两条路
  rationale: שׂים在象征行动的语境中有设立、标示之意；“划出”比直译“放置”更符合现代汉语，同时保留לְךָ的反身意味。
- source_word: לָבוֹא חֶרֶב מֶלֶךְ בָּבֶל
  choice: 让巴比伦王的刀可以沿路而来
  rationale: 保留“刀”的先知性转喻和鲜明意象，不直接解释为军队或攻击；“沿路而来”明确它与前述道路的关系。
- source_word: מֵאֶרֶץ אֶחָד יֵצְאוּ שְׁנֵיהֶם
  choice: 两条路都要从同一片土地分出
  rationale: 原文动词本义是“出去”，在两条路线共有起点的语境下，“分出”自然表达路线由一处分岔，同时未改变其共同来源。
- source_word: יָד
  choice: 路标
  rationale: 字面为“手”，此处很可能指指示方向的标记；正文采用现代读者易懂的“路标”，脚注保留字面信息及不确定性。
- source_word: בָּרֵא
  choice: 做
  rationale: 此处罕见用法可能指制作、刻出或预备；“做”保持宽泛，避免武断指定制作方式或材料。
- source_word: בְּרֹאשׁ דֶּרֶךְ עִיר
  choice: 在通往城的岔路口
  rationale: רֹאשׁ דֶּרֶךְ字面为“路的头部”，在上下文中很可能指道路起点或分岔处；正文依路线分开的场景译作“岔路口”，并以脚注保留较直译的可能。
theological_decisions:
- issue: “刀”是否直接解释为巴比伦军队或军事进攻
  choice: 保留“巴比伦王的刀”
  alternative: 译作“巴比伦王的军队”或“巴比伦王的进攻”
  rationale: 原文以刀作军事审判的转喻；保留其字面意象可维持预言的修辞力度，也避免把隐喻过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“划出两条路”体现先知象征行动；“刀”保留原文意象。所有脚注标记均已置于正文相应位置。
