  text: 'And the word of Yahweh came to me[a], saying:'
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知书常用公式“耶和华的话……临到”中，此词不宜生硬直译为“发生了”；“临到”自然表达启示来到先知。
- source_word: דְבַר
  choice: 话
  rationale: 构成短语“耶和华的话”，准确保留先知启示公式；“信息”虽可表达含义，但与原词及固定句式的对应较弱。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神名译写“耶和华”，而不以“主”这一称号替代四字神名。
- source_word: אֵלַי
  choice: 我
  rationale: 与动词“临到”组合为“临到我”，自然且准确表达话语朝向先知而来。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 引出下文的直接神谕；中文用“说：”简洁自然，并以冒号标示随后内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留中文读者最熟悉且庄重的专名“耶和华”，不以“主”替代；“雅威”是依据学界常见拟音的另一可行译写。
translation_notes:
  register: 采用现代、庄重而通顺的先知书固定表达。“耶和华的话临到我，说”紧贴希伯来文结构，同时符合现代中文圣经语体；本节无须脚注。
