  naturalness: 原句“他们为你看见虚假的异象，为你占卜谎言”不符合现代普通话的惯常搭配；“看见关于你的……异象、占卜出关于你的……”既自然，也保留原文平行。将“放在”改为“放到”使“把”字句的处所补语合乎汉语语法。明确“这些恶人”可避免“他们的日子”误指看异象、占卜者。
