  text: בַּ/חֲז֥וֹת לָ/ךְ֙ שָׁ֔וְא בִּ/קְסָם לָ֖/ךְ כָּזָ֑ב לָ/תֵ֣ת אוֹתָ֗/ךְ אֶֽל צַוְּארֵי֙ חַֽלְלֵ֣י רְשָׁעִ֔ים אֲשֶׁר בָּ֣א יוֹמָ֔/ם בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/034.yaml
  text: while they see false visions for you and divine lies for you[a], to place you on the necks of the slain wicked[c][b], whose day has come at the time of the punishment of the end.
translation:
  language: zh_hans
  text: 当有人看见关于你的虚假异象，占卜出关于你的谎言[a]时，要把你放到被杀的恶人的颈项上[b]；这些恶人的日子已经来到，正是末了罪罚的时候[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当有人看见关于你的虚妄，并占卜出关于你的欺骗时。”
    reason: 保留שָׁוְא与כָּזָב较抽象的词义，并反映两个以ב加不定式构成的平行结构。
  - marker: b
    text: 原文直译为“在被杀的恶人的颈项上”，图像难解；可能指使你倒在那些已被杀的人中间。
    reason: 说明原文的具体意象及一种可能解释，但不在正文中消解其含混性。
  - marker: c
    text: “末了罪罚的时候”也可译为“末了罪孽的时候”或“最终罪责的时候”。
    reason: עָוֺן兼有罪孽、罪责及其惩罚等语义；压缩短语בְּעֵת עֲוֺן קֵץ存在多种理解。
lexical_decisions:
- source_word: בַּחֲזוֹת לָךְ שָׁוְא
  choice: 他们为你看见虚假的异象
  rationale: ב加不定式可表达伴随或时间关系；结合上下文补出占卜者为主语。“虚假的异象”自然呈现שָׁוְא在先知语境中的虚妄、欺骗义。
- source_word: בִּקְסָם לָךְ כָּזָב
  choice: 为你占卜谎言
  rationale: 保留与前半句平行的不定式结构；קסם译为“占卜”，כָּזָב译为“谎言”，不把行为及其虚假结果混为一谈。
- source_word: לָתֵת אוֹתָךְ
  choice: 要把你放在
  rationale: נתן接宾语及方向短语，在此表达使对象处于某位置；“放在”保留原文具体而难解的图像。
- source_word: אֶל צַוְּארֵי חַלְלֵי רְשָׁעִים
  choice: 在被杀的恶人的颈项上
  rationale: 直译颈项意象，不擅自解释为“倒在……中间”；חַלְלֵי רְשָׁעִים按“被杀的恶人”理解。
- source_word: אֲשֶׁר בָּא יוֹמָם
  choice: 他们的日子已经来到
  rationale: 保留“日子来到”的审判性先知语言；关系代词所指按最近的复数人物“被杀的恶人”处理。
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: 正是末了罪罚的时候
  rationale: עָוֺן可指罪孽、罪责或罪罚；在审判语境中正文采用“罪罚”，同时以脚注保留其他可能。קֵץ译作“末了”，避免过度体系化为特定末世术语。
theological_decisions:
- issue: עֲוֺן在审判公式中的含义
  choice: 罪罚
  alternative: 罪孽；罪责
  rationale: 上下文强调恶人的审判之日已经来到，因此采用עָוֺן的后果义“罪罚”；脚注保留其罪孽和罪责义，避免消除原文张力。
- issue: “放在被杀的恶人的颈项上”的难解图像
  choice: 保留具体的颈项意象
  alternative: 使你倒在被杀的恶人中间；把你与被杀的恶人放在一起
  rationale: 原文图像含义不明，正文不以解释性改写替代它，以免把可能的含义固定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来文的平行结构和审判语气；“颈项”较“脖子”更适合经文语体，但仍属现代读者熟悉的表达。所有脚注标记均置于正文相应位置。
