base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/016.yaml
  text: It is given to be polished[a], to be grasped in the hand. It is sharpened—the sword—and it is polished[c][b], to put it into the hand of a slayer.
translation:
  language: zh_hans
  text: 它被交付，为要磨亮[a]，好握在手中[b]。它已经磨得锋利——剑——也已经磨亮，为要交到杀戮者[c]手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “磨亮”也可译作“磨光”，强调剑刃经过打磨而闪亮。
    reason: lexical_alternative
  - marker: b
    text: “手中”直译为“手掌中”。
    reason: lexical_alternative
  - marker: c
    text: “杀戮者”也可理解为“一个杀人的人”或“那杀戮者”；原文在这里没有明确标示定指。
    reason: ambiguity
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָהּ
  choice: 这剑交出来
  rationale: 原文动词形态本为第三人称阳性单数“他交出”，但主语没有明说；汉语采用无标记被动意味的“交出来”，既不擅自补出主语，也保持刀剑被预备的焦点。代词所指按上下文明确为剑。
- source_word: לְמָרְטָה / מֹרָטָּה
  choice: 磨亮／已经磨亮
  rationale: מרט在此指把刀刃磨光、擦亮。重复“磨亮”保留原文的词语复现和强调；“擦亮”列为脚注中的可选译法。
- source_word: לִתְפֹּשׂ בַּכָּף
  choice: 使人可以握在手中
  rationale: תפש配合כף描写把武器握住；译文自然表达用途，同时避免把剑误解为动作主体。כף字面为“手掌”，正文用现代汉语更自然的“手中”。
- source_word: הוּחַדָּה
  choice: 已经磨快
  rationale: חדד的使役被动式表示剑已被弄得锋利；“已经磨快”清楚传达完成的预备状态。
- source_word: חֶרֶב
  choice: 这剑
  rationale: 名词在此作插入式同位说明。虽然原文无冠词，但上下文已聚焦于特定的剑；“这剑”在汉语中既承接所指，也保留突兀而有力的诗性插语。
- source_word: לָתֵת אוֹתָהּ בְּיַד
  choice: 为要交在……手中
  rationale: נתן与“在手中”连用，表示把剑交付某人掌握；译法保留原文“手”的意象，并用目的结构对应不定式。
- source_word: הוֹרֵג
  choice: 杀戮者
  rationale: הרג的主动分词指实施杀害的人。“杀戮者”较庄重，并保留其可泛指“一个杀人者”或特指“那杀戮者”的语法含混。
theological_decisions:
- issue: הוֹרֵג的定指性
  choice: 正文译作不带明确指示词的“杀戮者”
  alternative: “一个杀人者”或“那杀戮者”
  rationale: 原文主动分词没有冠词，单凭本节不能确定应强调泛指还是特指；中文正文不加“一个”或“那”，尽量保存这种开放性，并以脚注说明。
- issue: 未明说的交剑者
  choice: 不补出“上帝”“他”或其他主语
  alternative: “他把剑交出来”
  rationale: 原文动词虽为第三人称阳性单数，但本节没有明示主语；不作神学性身份判定，以免消除先知诗歌的突兀感和含混。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两次“磨亮”的重复及“——这剑——”的插入式强调；避免古奥的“磨光发亮”“执于掌中”等表达，也不补充原文未明说的行动者。
