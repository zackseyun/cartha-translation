source:
  edition: WLC
  text: לְמַ֨עַן טְבֹ֤חַ טֶ֨בַח֙ הוּחַ֔דָּה לְמַעַן הֱיֵה לָ֥/הּ בָּ֖רָק מֹרָ֑טָּה א֣וֹ נָשִׂ֔ישׂ שֵׁ֥בֶט בְּנִ֖/י מֹאֶ֥סֶת כָּל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/015.yaml
  text: So that it may slaughter a slaughter[a], it is sharpened; so that it may have a flash, it is polished[b]. Or shall we rejoice? The scepter of my son despises every tree.
translation:
  language: zh_hans
  text: 为要大行杀戮[a]，它已磨利；为要使它发出闪光，它已磨亮[b]。难道我们要欢喜吗？我儿子的权杖藐视一切木头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末尾的希伯来语十分难解。“我儿子”依照马所拉文本直译；有些释经者将其较宽泛地理解为犹大或“我的百姓”。“一切木头”也可能指各种木杖或木制武器。
    reason: alternative_reading
  - marker: b
    text: 也可译作“使它有闪光”或“使它闪电般发光”。希伯来语表达较为省略，描写刀剑磨亮后发出的光辉。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: 为要
  rationale: 两次均表达目的或结果；“为要”简洁保留原文的目的意味。
- source_word: טְבֹחַ טֶבַח
  choice: 大行杀戮
  rationale: 原文以同根动词和名词加强语气；“大行杀戮”在现代汉语中自然地传达这种强化。
- source_word: הוּחַדָּה
  choice: 它已经磨快
  rationale: 承接上下文中的刀剑，用被动结果状态表达刀刃已经磨利。
- source_word: הֱיֵה לָהּ בָּרָק
  choice: 使它闪出寒光
  rationale: 原文为省略式表达，字面涉及“闪光/电光”；“闪出寒光”自然呈现擦亮之剑的耀眼光芒，同时在脚注保留词义范围。
- source_word: מֹרָטָה
  choice: 它已经擦亮
  rationale: 指刀刃经过打磨而光亮；“擦亮”通俗而符合此处与闪光相连的意象。
- source_word: אוֹ נָשִׂישׂ
  choice: 难道我们还能欢喜吗
  rationale: 保留突兀的反问转折，并以“还能”自然传达审判临近时欢喜之不合情理。
- source_word: שֵׁבֶט
  choice: 权杖
  rationale: 该词可指杖、棍或权杖；在“我儿子”的王权语境中，“权杖”较能体现统治权，同时脚注说明其他可能。
- source_word: בְּנִי
  choice: 我儿子
  rationale: 依照马所拉文本的直接读法，不在正文中将其解释为犹大或神的百姓。
- source_word: מֹאֶסֶת
  choice: 藐视
  rationale: 表达带有轻蔑意味的拒绝，比单纯“拒绝”更接近原词力度。
- source_word: כָּל עֵץ
  choice: 一切木头
  rationale: 保留原文“所有树木/木材”的具体意象，不在正文中擅自限定为木杖或木制武器。
theological_decisions:
- issue: 审判预言末句的文本与句法极为晦涩
  choice: 正文较贴近马所拉文本，译作“我儿子的权杖藐视一切木头”
  alternative: 可理解为犹大或神百姓的杖，也可把“一切木头”解释为各种木杖或木制武器；另有修订文本或重组句法的译法
  rationale: 此处不存在必须藉释义解决的教义问题。保留原文的张力与晦涩，并在脚注列出主要解释，比在正文中选定某种推断更稳妥。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大行杀戮”保留原文同根结构的加强效果；末句刻意不作过度解释，以脚注呈现其真实歧义。
