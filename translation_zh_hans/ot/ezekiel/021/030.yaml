  text: וְ/אַתָּה֙ חָלָ֣ל רָשָׁ֔ע נְשִׂ֖יא יִשְׂרָאֵ֑ל אֲשֶׁר בָּ֣א יוֹמ֔/וֹ בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/030.yaml
  text: And you[a], slain wicked one, prince of Israel, whose day has come at the time of the punishment of the end[b],
translation:
  language: zh_hans
  text: 你这被杀的[a]恶人，以色列的首领啊！你的日子已经来到，到了罪孽尽头的时候[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被杀的”也可译作“受了致命伤的”；有人把这里的希伯来语理解为“被亵渎的”。
    reason: alternative_reading
  - marker: b
    text: 原文直译近于“罪孽的尽头”。“罪孽”一词也可指罪孽所招致的刑罚；这里可能指罪恶到了尽头，也可能指最终受罚的时候。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלָל
  choice: 被杀的
  rationale: 此处处于宣告统治者必遭死亡审判的语境，可理解为“被刺透、被杀的”。先知以审判已经确定的口吻称呼对方，因此保留“被杀的”；另有“被亵渎的”或“受了致命伤的”等理解，列入脚注。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 该词在此作名词，并带呼格意味；“恶人”直接表达其道德与司法层面的定罪。
- source_word: נְשִׂיא יִשְׂרָאֵל
  choice: 以色列的首领
  rationale: נָשִׂיא可指首领、领袖或王公。这里指以色列的统治者；“首领”既自然，又不额外限定其具体王室头衔。
- source_word: אֲשֶׁר בָּא יוֹמוֹ
  choice: 你的日子已经来到
  rationale: 保留希伯来语“日子来到”的审判意象，同时以第二人称承接句首的直接呼告。
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: 到了末后罪孽受罚的时候
  rationale: עָוֹן兼有“罪孽”和“罪孽所招致的刑罚”之义，קֵץ表示终局或末后。正文用“罪孽受罚”同时显明罪责与后果，避免单独译作“最终惩罚”而完全消除原文的语义张力。
theological_decisions:
- issue: עֲוֺן在审判宣告中指罪孽还是刑罚
  choice: 译为“罪孽受罚”，兼顾罪责及其刑罚
  alternative: 可译为“末后罪孽的时候”或“最终受罚的时候”
  rationale: 原词可指罪孽、罪责，也可转指罪所带来的刑罚。上下文明显涉及审判，但原文的浓缩表达不宜被单向解释，因此正文兼顾两面，并在脚注说明。
- issue: חָלָל的语义
  choice: 译为“被杀的”，视为对确定审判结局的先行宣告
  alternative: 可理解为“受了致命伤的”或“被亵渎的”
  rationale: 死亡审判的语境支持“被刺透、被杀”之义，但词形也容许与“亵渎”相关的理解；正文选择较合语境者，脚注保留其他可能。
translation_notes:
  register: 采用庄重而自然的现代普通话。以“你……啊”保留先知直接呼告的力度；“你的日子已经来到”保留原文审判性意象。脚注标记均置于对应词语或短语之后。
