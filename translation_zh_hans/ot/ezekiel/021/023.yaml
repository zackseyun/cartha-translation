  text: And the word of Yahweh came to me, saying,
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的叙事形式与后面的“耶和华的话”共同构成先知书常用的启示引入语；汉语用“临到”自然表达事件的发生与话语朝向先知而来。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一固定先知性表达中，“话”既贴近原词，也保留其启示和宣告的分量；“信息”虽较动态，却会削弱原文措辞。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中通行的专名“耶和华”表达四字神名，保留其作为以色列之神名字的性质，而不改作称号。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词及第一人称单数词尾表示朝向先知；汉语将其与“临到”结合，准确而自然地表达“到我这里来”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接话语；“说”是现代汉语中简洁自然的对应表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。译文保留专名，不以“主”等称号替代；“耶和华”是在现代标准汉语读者中最通行、最易识别的专名形式。
translation_notes:
  register: 采用现代、庄重且通顺的先知书体例。“耶和华的话临到我，说”保留希伯来文启示公式的结构，也符合普通中文读者熟悉的表达；本节无须脚注。
