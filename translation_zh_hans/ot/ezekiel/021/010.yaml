  text: וְ/יָֽדְעוּ֙ כָּל בָּשָׂ֔ר כִּ֚י אֲנִ֣י יְהוָ֔ה הוֹצֵ֥אתִי חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ לֹ֥א תָשׁ֖וּב עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/010.yaml
  text: And all flesh will know that I[a], Yahweh, have drawn my sword from its sheath; it will not return again.
translation:
  language: zh_hans
  text: 凡有血肉的[a]都必知道：我，雅威，已经把我的剑拔出鞘；它不再归鞘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“全人类”或“所有人”；直译“凡有血肉的”。
    reason: 说明希伯来语 כָּל־בָּשָׂר 的字面意象及可采用的自然汉语表达。
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 都必知道
  rationale: 在先知性话语中，该形式表达将来的结果；“必知道”自然地保留了以西结书常见的认知公式及其确定语气。
- source_word: כָּל בָּשָׂר
  choice: 凡有血肉的
  rationale: 保留希伯来语“所有肉身”的具体意象和广泛范围；脚注说明它在此指所有人。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我雅威
  rationale: 将 אֲנִי 与神名理解为强调性的同位结构：“我，雅威”。汉语省去同位逗号更流畅，同时仍突出说话者的身份。
- source_word: הוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ
  choice: 已经拔剑出鞘
  rationale: 直译为“使我的剑从它的鞘中出来”；“拔剑出鞘”是现代汉语中准确、自然且保留军事意象的表达。上下文已明确剑属于说话者，汉语无需重复“我的”。
- source_word: לֹא תָשׁוּב עוֹד
  choice: 这剑再也不会归鞘
  rationale: 阴性单数动词以“剑”为主语。“归鞘”根据前句明确的“出鞘”补足自然汉语所需的落点，并保留“不再返回”的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其专名性质，而不以“主”这一称号替代。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“凡有血肉的”保留经文的修辞力度；分号呈现拔剑与不再归鞘之间紧密的结果关系。
