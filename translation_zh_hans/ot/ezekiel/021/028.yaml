base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/028.yaml
  text: And it will be to them like a false divination in their eyes; they have sworn sworn oaths to them[a], but he brings guilt to remembrance, so that they may be captured.
translation:
  language: zh_hans
  text: 在他们眼中，这必像虚假的占卜；他们曾向他们一再郑重起誓[a]。然而，他要使罪孽被记起，以致他们被擒住。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语此短语难解，字面上含有“起誓者／誓言”一类重复形式，可理解为“他们曾向他们起下郑重的誓言”，或“他们有誓上加誓的誓言”。正文将重复理解为强调郑重或反复起誓；相关代词所指在原文中未明确。
    reason: 说明有争议的句法、重复强调和代词指向。
lexical_decisions:
- source_word: וְהָיָה
  choice: 这必像
  rationale: 连词加完成式用于先知叙事时可表达将来的结果；“必”保留预告意味，并以“这”承接上文的占卜结果。
- source_word: כקסום שוא
  choice: 像虚假的占卜
  rationale: קסום指占卜，שוא可表示虚假、空妄或无效；“虚假的占卜”既贴近词义，也符合他们不相信该兆头的语境。
- source_word: בעיניהם
  choice: 在他们眼中
  rationale: 保留希伯来语可自然理解的视角习语，表示这是他们自己的判断。
- source_word: שבעי שבעות להם
  choice: 他们曾向他们郑重起誓[a]
  rationale: 原文高度浓缩且有重复强化色彩；“郑重起誓”自然表达誓言的严肃性，同时保留两组第三人称代词，不擅自确定各自所指。
- source_word: וְהוּא
  choice: 然而，他
  rationale: 语境中的单数代词很可能回指巴比伦王；译文保留代词而不在正文中明说，并用“然而”表达转折。
- source_word: מַזְכִּיר עָוֺן
  choice: 使罪孽被记起
  rationale: 使役分词表达“使……被想起/提起”；עון兼有罪孽与罪责含义，此处译作“罪孽”可保留行为与追责之间的张力。
- source_word: לְהִתָּפֵשׂ
  choice: 以致他们被擒住
  rationale: 不定式可表示目的或结果；“以致”在中文中保留结果意味，而“被擒住”符合军事审判语境。
theological_decisions:
- issue: 罪孽被谁记起，以及“他”的确切身份
  choice: 保留“他要使罪孽被记起”的代词和被动表达
  alternative: 明确译为“巴比伦王要揭露他们的罪孽”
  rationale: 原文只用第三人称单数代词，并说“使罪孽被记起”；不应在正文中加入未明说的身份或将“记起”解释成“揭露”。
- issue: 誓言短语所指的盟约关系
  choice: 保留“他们向他们”的指代开放性
  alternative: 明确为犹大人向巴比伦人所起的盟誓
  rationale: 上下文可能支持这一历史关系，但本节希伯来语本身的代词和句法有争议，因此不在正文中封闭解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“虚假的占卜”“在他们眼中”“使罪孽被记起”尽量保留原文意象；对难解的誓言短语作最低限度的自然化，并以脚注交代其他可能。
