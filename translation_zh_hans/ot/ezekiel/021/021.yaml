  yaml_path: translation/ot/ezekiel/021/021.yaml
  text: Gather yourself[a]; go to the right; set yourself to the left[c][b], wherever your face is appointed.
translation:
  language: zh_hans
  text: 聚拢起来[a]！向右去；转向左边；你的脸[b]被指向哪里，就往哪里去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“联合起来”“集中起来”；按本段语境，也可理解为“集结力量”。原文动词罕见，且是反身形式，可能表示出击前的集中或合拢。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“你的脸”；在希伯来语中，也可指所面对的方向。
    reason: lexical_alternative
  - marker: c
    text: 本句也可译“你的脸被引向哪里，就往哪里去”或“你的脸被定向到哪里，就往哪里去”。
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְאַחֲדִי
  choice: 聚拢起来
  rationale: 这是罕见的阴性单数反身命令式。在刀剑拟人化的战斗语境中，可能表示集中、合拢力量；“聚拢起来”既保留反身意味，也不把具体动作解释得过死。
- source_word: הֵימִנִי
  choice: 向右去
  rationale: 该命令式源于“右边”一词，表达向右的行动。“向右去”保留简短直接的命令语气。
- source_word: הָשִׂימִי הַשְׂמִילִי
  choice: 转向左边
  rationale: 前一词是“放置、安置”的命令式，后一词表示向左；合译为“转向左边”符合现代汉语方向命令的表达，同时传达将自身置于左向的意思。
- source_word: אָ֖נָה
  choice: 哪里……就往哪里
  rationale: 这是表示方向的疑问或不定副词；在本句中采用关联结构，自然表达“无论朝向何处”的意思。
- source_word: פָּנַיִ/ךְ
  choice: 你的脸
  rationale: 原文直译为“你的脸”，带阴性单数领属后缀。保留这一拟人化形象，并由脚注说明它也可指面对的方向。
- source_word: מֻעָדוֹת
  choice: 被指定朝向
  rationale: 这是来自 יעד 的被动形式，表示被定下、指定或导向。此译保留被动性，不明确补出指定者，也不将其限定为命令、命运或神圣旨意。
theological_decisions:
- issue: 受话者的拟人化与战斗意象
  choice: 不在正文补出“刀剑”，以阴性单数命令所呈现的拟人化受话者为准，由上下文辨明其身份。
  alternative: 在正文中明确补作“刀剑啊”，或把命令解释为对军队发出。
  rationale: 本节希伯来文没有明说受话者，只使用一连串阴性单数命令式；紧邻上下文将刀剑拟人化。正文不补出名词，可保留原文突兀、强烈的命令节奏，避免超过原文证据。
- issue: “被指定”所隐含的行动主体
  choice: 保留被动表达，不说明是谁指定方向。
  alternative: 明确译成“神指定的方向”“奉命所向”或“命定要去的地方”。
  rationale: 原文被动形式没有明示施事者。明确补出神、命令或命运都会消除原文保留的张力，因此不作教义性限定。
translation_notes:
  register: 采用现代、庄重而简洁的命令句，保留原文连续命令的急促战斗节奏。正文不补明“刀剑”，并用“被指定朝向”维持原文被动结构及施事者未明的含混性。
