base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/032.yaml
  text: A ruin[a], a ruin, a ruin—I will make it. This also shall not be, until he comes whose right it is[b], and I will give it to him.
translation:
  language: zh_hans
  text: 倾覆[a]！倾覆！倾覆！我必使它倾覆。这也必不再有，直到那有合法权利的人来到[b]；我要把它交给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倾覆”也可译作“废墟”或“推翻”。希伯来文将同一个词重复三次，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “那有合法权利的人”也可译作“那拥有裁决权的人”或“那理应得着它的人”。这句话可能呼应《创世记》49:10；许多解经者因此认为这里指向弥赛亚。
    reason: alternative_reading
lexical_decisions:
- source_word: עַוָּה עַוָּה עַוָּה
  choice: 倾覆！倾覆！倾覆！
  rationale: 保留原文名词性呼喊的三次重复及强烈语势；“倾覆”兼有推翻、颠覆现有王权秩序之意，又不把所指过度具体化。
- source_word: אֲשִׂימֶנָּה
  choice: 我要使它如此
  rationale: שׂים可指“安置、使成为”；阴性宾语承接上下文所指的王权秩序。译作“使它如此”既表达上帝使前述倾覆成为事实，也避免擅自补明具体对象。
- source_word: גַּם זֹאת לֹא הָיָה
  choice: 这也必不复存在
  rationale: 保留גַּם的附加语气，并按先知话语的将来结果理解完成式；“不复存在”比逐字的“将不是”更符合现代汉语。
- source_word: עַד בֹּא
  choice: 直到……来到
  rationale: 忠实保留时间界限以及后文所暗示的个人主体。
- source_word: אֲשֶׁר לוֹ הַמִּשְׁפָּט
  choice: 那本有权的人
  rationale: מִשְׁפָּט在此可指判决、司法权或合法权利；结合王位承继语境，“本有权”自然表达合法归属，同时保留词义张力。
- source_word: וּנְתַתִּיו
  choice: 我要把它赐给他
  rationale: 宾语由上下文补足为王权、冠冕或统治权；“赐给”自然表达上帝所作的授予，又不在正文中限定宾语。
theological_decisions:
- issue: “直到那本有权的人来到”究竟指弥赛亚还是近期历史人物
  choice: 正文只译作“那本有权的人”，不明确指认其身份。
  alternative: 明确译为将来的弥赛亚或大卫后裔；或理解为近期有合法统治权的人。
  rationale: 原文没有给这人具名。其措辞可能呼应《创世记》49:10，并常被理解为指向弥赛亚，但译文应保留开放的合法承继者语言，不把一种神学解释写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“倾覆”三叠保留先知宣告的节奏；“本有权”避免生硬直译，也不提前判定来者身份。正文中的[a]、[b]均与脚注对应。
