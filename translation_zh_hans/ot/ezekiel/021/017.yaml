  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זְעַ֤ק וְ/הֵילֵל֙ בֶּן אָדָ֔ם כִּי הִיא֙ הָיתָ֣ה בְ/עַמִּ֔/י הִ֖יא בְּ/כָל נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל מְגוּרֵ֤י אֶל חֶ֨רֶב֙ הָי֣וּ אֶת עַמִּ֔/י לָ/כֵ֖ן סְפֹ֥ק אֶל יָרֵֽךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/017.yaml
  text: Cry out and wail[a], son of man, for it has come upon my people; it is upon all the princes of Israel. They are given over to the sword along with my people[b]; therefore strike your thigh.
translation:
  language: zh_hans
  text: “人子啊，你要呼喊哀号！因为这刀已经临到我的子民，也临到以色列所有的首领。他们和我的子民一同被交给刀剑[a]。所以，你要拍打大腿[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句的希伯来原文含义不确定；或译：“刀剑带来的恐惧临到我的子民。”
    reason: 保留 מְגוּרֵי אֶל חֶרֶב 的主要异读。
  - marker: b
    text: 拍打大腿是表示悲痛、震惊或哀号的动作。
    reason: 说明古代先知语境中的象征性哀恸动作。
lexical_decisions:
- source_word: זְעַק וְהֵילֵל
  choice: 呼喊哀号
  rationale: 两个命令式动词都表达强烈而出声的悲痛；“呼喊哀号”既保留并列结构，也符合现代汉语的先知哀歌语体。
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知的固定称呼；“人子”沿用清楚、庄重且广为人知的译法。
- source_word: כִּי הִיא הָיְתָה בְעַמִּי
  choice: 因为这刀已经临到我的子民
  rationale: 阴性代词 הִיא 最自然地承接上下文中的阴性名词“刀剑”；“临到”表达灾祸降在百姓身上，同时不限定其具体方式。
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: 以色列所有的首领
  rationale: נְשִׂיאֵי 指掌权者或统治人物；现代汉语“首领”比“王子”更准确，也比泛称“领袖”略具政治身份色彩。
- source_word: מְגוּרֵי אֶל חֶרֶב הָיוּ
  choice: 被交给刀剑
  rationale: 该短语疑难；正文采用“被交出、任凭刀剑杀戮”的常见理解，并在脚注保留另一种可能。
- source_word: אֶת עַמִּי
  choice: 和我的子民一同
  rationale: 将 אֶת 按伴随关系理解，表明首领与百姓同遭刀剑。
- source_word: סְפֹק אֶל יָרֵךְ
  choice: 拍打大腿
  rationale: 直译其哀恸动作；“拍打”自然呈现反复或用力击腿的举动，而不把动作改释为抽象情绪。
theological_decisions:
- issue: 两个 הִיא 的所指
  choice: 正文译作“这刀”，承接上下文中的刀剑
  alternative: 泛指将临的灾祸或审判
  rationale: 希伯来语阴性代词在语法上适合回指上下文的 חֶרֶב（刀剑），但其所代表的也是临到百姓的审判；译文不进一步界定二者之间的神学关系。
- issue: מְגוּרֵי אֶל חֶרֶב 的含义
  choice: 理解为首领和百姓被交给刀剑
  alternative: 理解为刀剑所带来的恐惧临到百姓
  rationale: 原文形式和句法存在真实困难。正文采用在上下文中较连贯的受交付解释，脚注明确保留“恐惧”的异读，避免掩盖不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“刀剑”保留先知文学中的审判意象；“子民”体现 עַמִּי 的归属关系；标点突出开头命令的哀恸力度。脚注标记均置于所说明的正文短语之后。
