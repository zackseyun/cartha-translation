  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל יְר֣וּשָׁלִַ֔ם וְ/הַטֵּ֖ף אֶל מִקְדָּשִׁ֑ים וְ/הִנָּבֵ֖א אֶל אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/007.yaml
  text: Son of man[a], set your face toward Jerusalem, and preach toward the sanctuaries, and prophesy against the land of Israel.
translation:
  language: zh_hans
  text: 人子啊，你要面向耶路撒冷，向众圣所宣讲预言[a]，并向以色列地宣讲审判的预言。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“向众圣所滴下（话语）”；这是指先知发言的比喻。本节在审判语境中，指向众圣所宣告审判。
    reason: 保留וְהַטֵּף“滴下”的字面意象，并说明其在先知语境中的比喻义。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是上帝对以西结惯用的称呼。采用已确立的“人子”，既保留希伯来语“人的儿子”的表达，也不在此处赋予弥赛亚称号的含义。
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: 面向
  rationale: 该习语表示有意地把脸转向某处，在先知审判语境中也带有正面相对、准备发言的意味；“面向”自然且保留原文意象。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代汉语圣经传统中通行的地名译法。
- source_word: וְהַטֵּף
  choice: 传讲
  rationale: נטף的基本意象是“滴下”，在先知语境中指发出先知性言论。“传讲”表达其语用意义，而将原文的具体意象保留在脚注中。
- source_word: מִקְדָּשִׁים
  choice: 众圣所
  rationale: 原文为复数；“众圣所”保留数的形式及其敬拜场所的含义，不擅自缩窄为单一圣殿建筑。
- source_word: וְהִנָּבֵא אֶל
  choice: 说预言攻击
  rationale: נבא表示以先知身份发言；在本段审判语境中，אֶל所标示的朝向具有敌对指向，译作“攻击”使言语行动的审判性质清楚。
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: 以色列地
  rationale: אַדְמָה可指土地、土壤或地域；这里指以色列的国土，译作“以色列地”最合语境。
theological_decisions:
- issue: וְהַטֵּף在审判预言中的比喻作用
  choice: 正文按先知性发言的意义译为“传讲”，脚注保留“滴下（话语）”的字面意象
  alternative: 正文直译为“向众圣所滴下话语”
  rationale: 字面译法虽保留形象，却容易使现代读者误解动作本身；正文表达其先知性言语行为，同时以脚注确保原文意象可见。
- issue: 两个אֶל在平行命令中的方向和敌对色彩
  choice: 对圣所译为“向”，对以色列地依审判语境译为“攻击”
  alternative: 两处都统一译为“向”或都统一译为“攻击”
  rationale: 介词本身主要标示朝向，其敌对含义由语境产生。译文保留第一句的方向性，并在明确的审判预言中呈现第二句的敌对作用，不把介词机械统一。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“人子啊”保留先知书中的固定呼语；“面向、传讲、说预言”便于普通读者理解。正文保留“众圣所”的复数，不擅自判定它只指一座圣殿或多个不同场所。
