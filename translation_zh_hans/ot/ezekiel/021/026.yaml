  text: כִּֽי עָמַ֨ד מֶלֶךְ בָּבֶ֜ל אֶל אֵ֣ם הַ/דֶּ֗רֶךְ בְּ/רֹ֛אשׁ שְׁנֵ֥י הַ/דְּרָכִ֖ים לִ/קְסָם קָ֑סֶם קִלְקַ֤ל בַּֽ/חִצִּים֙ שָׁאַ֣ל בַּ/תְּרָפִ֔ים רָאָ֖ה בַּ/כָּבֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/026.yaml
  text: 'For the king of Babylon stands at the mother of the road[a], at the head of the two roads, to practice divination: he shakes the arrows, he consults the teraphim[c][b], he examines the liver.'
translation:
  language: zh_hans
  text: 因为巴比伦王站在岔路口[a]，在两条路的起点，要行占卜：他摇动箭矢，求问特拉芬[b]，察看肝脏[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“路之母”，指道路分岔之处。
    reason: lexical_alternative
  - marker: b
    text: “特拉芬”指用于求问和占卜的祭祀性神像；也可译作“家神”。
    reason: cultural_note
  - marker: c
    text: 指借察看肝脏施行占卜。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文并说明缘由，保留原词的解释或因果作用。
- source_word: עָמַד
  choice: 站在
  rationale: 用现代汉语现在时态生动呈现先知异象中的场景。
- source_word: אֵם הַדֶּרֶךְ
  choice: 岔路口
  rationale: 原文直译为“路之母”，在此指道路分出的地点；“岔路口”自然准确。
- source_word: בְּרֹאשׁ שְׁנֵי הַדְּרָכִים
  choice: 就是两条路的起点
  rationale: 保留“头、起点”的空间意象，并表明此语与前面的岔路口同位。
- source_word: לִקְסָם קָסֶם
  choice: 要行占卜
  rationale: 以自然汉语表达同源动词与名词的结构，同时保留其明确的占卜含义。
- source_word: קִלְקַל בַּחִצִּים
  choice: 他摇箭求签
  rationale: “摇箭”贴近原动作，“求签”交代该动作在上下文中的占卜用途，避免被理解为普通摇动。
- source_word: שָׁאַל בַּתְּרָפִים
  choice: 求问神像
  rationale: תְּרָפִים 指用于求问和占卜的祭祀性神像；不限定为“家神”，以免过度具体化。
- source_word: רָאָה בַּכָּבֵד
  choice: 察看肝脏
  rationale: 保留原文具体动作和对象；脚注说明这是以祭牲肝脏占卜的古代做法。
theological_decisions:
- issue: 如何翻译异教占卜行为而不加以淡化或额外发挥
  choice: 逐项保留摇箭、求问神像和察看肝脏三种行为
  alternative: 概括译作“求兆”或“行占卜”而省略具体方式
  rationale: 希伯来文本有意列出具体占卜手段；逐项呈现可保留历史语境与先知话语的力度，同时不加入文本以外的宗派性评价。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“岔路口”传达希伯来习语的实际所指，脚注保存其“路之母”的原始意象；三项占卜行为保持具体、并列的节奏。
