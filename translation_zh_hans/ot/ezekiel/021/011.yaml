  yaml_path: translation/ot/ezekiel/021/011.yaml
  text: And you[a], son of man, groan with breaking loins, and in bitterness you shall groan before their eyes.
translation:
  language: zh_hans
  text: “人子啊，你要腰如折断般叹息，并要在苦楚中，当着他们的面叹息。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；采用“人子”既保留希伯来语意象及全书重复用语，也不在此处赋予弥赛亚称号的含义。
- source_word: הֵאָנַח / תֵּאָנַח
  choice: 叹息
  rationale: אנח表示因痛苦而发出的叹息或呻吟。“叹息”是现代汉语中自然、庄重的表达；两次译出，以保留原文的重复和强调。
- source_word: בְּשִׁבְרוֹן מָתְנַיִם
  choice: 腰如折断
  rationale: שִׁבְרוֹן指折断、破碎或剧烈损伤，מָתְנַיִם指腰胯部。“腰如折断”保留具体而强烈的身体痛苦意象，同时避免把这种先知性动作过度解释为实际骨折。
- source_word: וּבִמְרִירוּת
  choice: 并要满怀苦楚
  rationale: מְרִירוּת本义为“苦、苦楚”，在此描述叹息时的内在痛苦。“满怀苦楚”在现代汉语中自然，并保留其情感强度。
- source_word: לְעֵינֵיהֶם
  choice: 在他们眼前
  rationale: 直译并保留希伯来语的视觉性习语，表示这动作要公开做给他们看。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文两次“叹息”的重复、命令语气以及“腰折”的强烈身体意象；以“如”表达该动作所呈现的痛苦状态，不武断断定先知实际受伤。
