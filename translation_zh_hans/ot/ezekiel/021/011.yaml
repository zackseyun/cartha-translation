  text: וְ/אַתָּ֥ה בֶן אָדָ֖ם הֵֽאָנַ֑ח בְּ/שִׁבְר֤וֹן מָתְנַ֨יִם֙ וּ/בִ/מְרִיר֔וּת תֵּֽאָנַ֖ח לְ/עֵינֵי/הֶֽם־׃
base_translation:
