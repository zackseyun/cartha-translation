source:
  edition: WLC
  text: וְ/שָׁפַכְתִּ֤י עָלַ֨יִ/ךְ֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י אָפִ֣יחַ עָלָ֑יִ/ךְ וּ/נְתַתִּ֗י/ךְ בְּ/יַד֙ אֲנָשִׁ֣ים בֹּֽעֲרִ֔ים חָרָשֵׁ֖י מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/036.yaml
  text: And I will pour out my indignation on you[a]; with the fire of my wrath I will blow on you, and I will give you into the hand of brutal men[b], craftsmen of destruction.
translation:
  language: zh_hans
  text: 我要把我的愤怒倾倒在你身上；我要用我烈怒之火向你吹气，把你交在凶暴的人[a]手中，就是制造毁灭的工匠[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“暴烈的人”；原文直译为“燃烧的人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“善于毁灭的人”，又可译“毁灭的匠人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: 我要把……倾倒
  rationale: 保留“倾倒”这一先知文学中表达神倾下怒气的鲜明隐喻，同时符合现代汉语表达。
- source_word: זַעְמִי
  choice: 我的愤怒
  rationale: זַעַם 表示带有谴责和审判意味的怒气；“愤怒”庄重自然，并与下文 עֶבְרָה 的“烈怒”有所区别。
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: 用我烈怒之火
  rationale: 保留“火”的审判意象以及介词 בְּ 的工具性含义；“烈怒”体现 עֶבְרָה 的强烈程度。
- source_word: אָפִיחַ עָלָיִךְ
  choice: 向你吹气
  rationale: נפח 的使役式在此指吹气或吹风，可能让人联想到把审判之火吹旺；译文保留这一意象而不将其解释性改写为“焚烧”。
- source_word: וּנְתַתִּיךְ בְּיַד
  choice: 把你交在……手中
  rationale: 保留希伯来语“交在某人手中”的惯用语，表达使对方落入他人权下。
- source_word: אֲנָשִׁים בֹּעֲרִים
  choice: 凶暴的人
  rationale: בֹּעֲרִים 字面可理解为“燃烧的”，在语境中形容这些人暴烈而具有毁灭性；“凶暴”在现代汉语中自然，并通过脚注保留字面可能。
- source_word: חָרָשֵׁי מַשְׁחִית
  choice: 制造毁灭的工匠
  rationale: חָרָשֵׁי 指工匠或匠人，整句把这些人描绘成专门造成毁灭的人；此译保留工匠隐喻，也避免误解为普通职业称谓。
theological_decisions:
- issue: 相邻两个神之怒气用语的区别
  choice: 将 זַעַם 译为“愤怒”，将 עֶבְרָה 译为“烈怒”
  alternative: 两处都译为“愤怒”或“怒气”
  rationale: 原文连续使用两个相关但不同的词，形成递进和强化；采用彼此关联而强度略有区别的汉语词，既保留修辞张力，也不额外引入神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“倾倒”“烈怒之火”“吹气”“工匠”等原文意象；以脚注说明两处较难词组的字面意义和可行译法。
