  text: וָ/אֹמַ֕ר אֲהָ֖הּ אֲדֹנָ֣/י יְהוִ֑ה הֵ֚מָּה אֹמְרִ֣ים לִ֔/י הֲ/לֹ֛א מְמַשֵּׁ֥ל מְשָׁלִ֖ים הֽוּא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/005.yaml
  text: Then I said[a], “Ah, Lord GOD! They are saying of me[b], ‘Is he not a speaker of parables?’”
translation:
  language: zh_hans
  text: 于是我说：“唉，主耶和华啊！他们议论我[a]说：‘他不就是个讲比喻的人吗？’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们对我说：‘他不就是在讲比喻吗？’”希伯来语既可理解为他们对以西结说，也可理解为他们议论他。
    reason: alternative_reading
  - marker: b
    text: “讲比喻”也可包括讲格言或使用含蓄、费解的象征性言语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 于是我说
  rationale: 承接前文并推进叙事；“于是”自然表达希伯来语连续叙事形式的顺承关系。
- source_word: אֲהָהּ
  choice: 唉
  rationale: 表达先知的痛苦、无奈或哀叹；现代汉语中自然庄重，也避免“啊哈”可能带来的得意意味。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的称号和 יהוה 的神名，并避免译成不自然的“主主”。
- source_word: הֵמָּה אֹמְרִים לִי
  choice: 他们都在议论我
  rationale: 结合后面的第三人称问句，理解为众人对以西结的评价；לִי 也可直译为“对我说”，此歧义以脚注保留。
- source_word: הֲלֹא
  choice: 不就是……吗
  rationale: 自然传达预期听者认同的反问语气，并体现众人轻忽、贬抑的口吻。
- source_word: מְמַשֵּׁל מְשָׁלִים
  choice: 个讲比喻的
  rationale: 保留同根动词与名词所构成的惯用表达，指讲说比喻、格言或含蓄难解的话；正文采用自然汉语名词性说法。
- source_word: הוּא
  choice: 他
  rationale: 在引语中直接指以西结。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”是普通话圣经语域中清楚而庄重的表达，同时区分称号“主”与神名 יהוה；不据此引入额外的宗派性解释。
- issue: 百姓的话是对以西结说，还是议论以西结
  choice: 正文采用“议论我”
  alternative: “对我说”
  rationale: 后接第三人称“他”，语境较支持他们在评论先知；但介词 לִי 通常也可表示“对我”，故用脚注保留句法歧义。
translation_notes:
  register: 采用现代、庄重而口语可懂的先知叙事语体。“唉”表现哀叹；“不就是个……的吗”传达众人带有轻视意味的反问。所有歧义均在正文或脚注中保留，未将“比喻”窄化为单一文学类别。
