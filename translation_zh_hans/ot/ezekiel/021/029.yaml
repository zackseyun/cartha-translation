  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ יַ֗עַן הַזְכַּרְ/כֶם֙ עֲוֺ֣נְ/כֶ֔ם בְּ/הִגָּל֣וֹת פִּשְׁעֵי/כֶ֗ם לְ/הֵֽרָאוֹת֙ חַטֹּ֣אותֵי/כֶ֔ם בְּ/כֹ֖ל עֲלִילֽוֹתֵי/כֶ֑ם יַ֚עַן הִזָּ֣כֶרְ/כֶ֔ם בַּ/כַּ֖ף תִּתָּפֵֽשׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/029.yaml
  text: 'Therefore thus says the Lord GOD: Because you have brought your guilt to remembrance by uncovering your transgressions[a], so that your sins are seen in all your deeds, because you have come to remembrance[b], you will be seized by the hand.'
translation:
  language: zh_hans
  text: 所以，主耶和华如此说：因为你们使自己的罪孽被记念，借着揭露自己的过犯，使你们的罪在一切行为中显明；因为你们被记念，你们必被擒拿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被擒拿”原文直译为“在手中被捉住”，指落入他人的掌握而遭擒拿。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 以现代中文圣经读者熟悉的方式保留“主”这一称号和神的专名“耶和华”，避免将两个成分合并。
- source_word: הַזְכַּרְכֶם עֲוֺנְכֶם
  choice: 你们使自己的罪孽被记起
  rationale: הזכיר是使役形，表达他们使自己的罪孽被记起；“罪孽”也保留עָוֹן可兼指邪恶与罪责的张力。
- source_word: בְּהִגָּלוֹת פִּשְׁעֵיכֶם
  choice: 使你们的过犯显露出来
  rationale: 用“显露”保留גלה的揭露意象；“过犯”传达פשע所含的越界、悖逆意味。
- source_word: לְהֵרָאוֹת חַטֹּאתֵיכֶם בְּכֹל עֲלִילוֹתֵיכֶם
  choice: 以致你们的一切行为都显出你们的罪
  rationale: 将不定式理解为结果，并以自然中文表达罪在全部行为中变得可见。
- source_word: הִזָּכֶרְכֶם
  choice: 你们被记起
  rationale: 保留本节זכר词根的重复及被动含义，不擅自补明是谁记起他们。
- source_word: בַּכַּף תִּתָּפֵשׂוּ
  choice: 被人一把抓住
  rationale: 该短语表达落入掌握、遭到擒拿；“一把抓住”在自然中文中兼顾手掌意象与被捕含义。
theological_decisions:
- issue: 罪孽与人被“记起”的施事者
  choice: 不补出“被神记起”
  alternative: 被神记起／在神面前被记起
  rationale: 原文使用被动或反身形式而未明说施事者；上下文虽暗示神施行审判，译文仍保留原文的含蓄。
- issue: עָוֹן的语义
  choice: 罪孽
  alternative: 罪责
  rationale: 此词可指罪行、罪责或罪的后果；“罪孽”在这里可与“过犯”“罪”构成并列，又不将意义限缩为单纯法律责任。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“使……被记起／被记起”刻意保留原文两次使用זכר所形成的呼应；末句用常用表达呈现擒拿意象，并以脚注说明字面形式。
