  text: הָשַׁ֖ב אֶל תַּעְרָ֑/הּ בִּ/מְק֧וֹם אֲשֶׁר נִבְרֵ֛את בְּ/אֶ֥רֶץ מְכֻרוֹתַ֖יִ/ךְ אֶשְׁפֹּ֥ט אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/035.yaml
  text: Return to your sheath[a]. In the place where you were created, in the land of your origins[b], I will judge you.
translation:
  language: zh_hans
  text: 把它收回鞘中[a]！我必在你受造之处、在你起源之地[b]审判你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使它回到它的鞘中。”希伯来文动词可作使役命令；所收回的对象在句中未明说，按上下文可指剑。“鞘”所带的后缀为阴性单数，可能指剑。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在你出生之地”或“在你诞生之地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁב
  choice: 归回
  rationale: 该命令在上下文中以拟人方式指向刀剑。“归回”简洁地保留返回原处的动作，也与“鞘中”自然搭配。
- source_word: תַּעְרָהּ
  choice: 鞘中
  rationale: תער指刀鞘、剑鞘。中文省去物主代词，可避免把希伯来语阴性第三人称后缀过早解释为第二人称，同时仍保留对刀剑的直接呼语。
- source_word: בִּמְקוֹם
  choice: 在……之处
  rationale: 准确表达地点，并以庄重而自然的中文引出审判发生之处。
- source_word: נִבְרֵאת
  choice: 你受造
  rationale: 保留ברא的基本意义及被动语态。虽然用于刀剑较为特别，却能维持原文的拟人意象及其张力。
- source_word: בְּאֶרֶץ מְכֻרוֹתַיִךְ
  choice: 在你起源之地
  rationale: מְכֻרוֹת可指起源、出生或诞生。“起源之地”适用于被拟人化的刀剑，也不排除它所象征的民族或实体。
- source_word: אֶשְׁפֹּט אֹתָךְ
  choice: 审判你
  rationale: 直接表达שפט加宾语的司法含义；“我必”体现未完成式在预言语境中的将来与确定语气。
theological_decisions:
- issue: 本节受话者的所指
  choice: 正文延续上下文，把命令直接说给拟人化的刀剑；同时不明说最终受审判者究竟是刀剑、亚扪或其统治者。
  alternative: 把受话者直接理解为亚扪民族或其统治者，而不是刀剑。
  rationale: “鞘”及阴性后缀支持刀剑是眼前的语法和意象所指，但审判显然也可落到刀剑所代表的群体或权势上。保留拟人手法可避免提前消解先知话语的多层指向。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“归回鞘中”保持先知诗歌的凝练感；两个“在……”短语依照原文并列，避免把后者明确改成解释性同位语。正文中的[a]、[b]与脚注完整对应。
