  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הִנָּבֵ֕א וְ/הַ֖ךְ כַּ֣ף אֶל כָּ֑ף וְ/תִכָּפֵ֞ל חֶ֤רֶב שְׁלִישִׁ֨תָ/ה֙ חֶ֣רֶב חֲלָלִ֔ים הִ֗יא חֶ֚רֶב חָלָ֣ל הַ/גָּד֔וֹל הַ/חֹדֶ֖רֶת לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/019.yaml
  text: And you[a], son of man, prophesy and strike palm to palm, and let the sword be doubled a third time—the sword of the slain. It is the sword of the great slain one[c][b], the one that presses in on them.
translation:
  language: zh_hans
  text: “你，人子啊，要说预言，以掌击掌；愿刀剑第三次加倍[a]——这是被杀者之刀，是那大被杀者之刀[b]，正侵逼他们[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿刀剑成为三重。”原文可指刀剑第三次加倍或加强，也可指成为三重。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“那大被杀者之刀”。“大”可理解为伟大、显赫，或指其规模；原文未说明具体所指。
    reason: ambiguity
  - marker: c
    text: 或译：“正刺入他们”或“正包围他们”。原词可表达进入、穿透或围逼。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 沿用《以西结书》中这一称呼的希伯来语意象和传统中文表达，不将其释义化为“世人”或“必死的人”。
- source_word: הִנָּבֵא
  choice: 说预言
  rationale: 此处为先知受命发言，原文在本分句中没有明示宾语；“说预言”自然且不擅自补入“攻击谁”。
- source_word: וְהַךְ כַּף אֶל כָּף
  choice: 以掌击掌
  rationale: 贴近原文“掌击向掌”的先知性动作；比单说“拍手”更能保留原文具体而强烈的手势。
- source_word: וְתִכָּפֵל חֶרֶב שְׁלִישִׁתָה
  choice: 愿刀第三次加倍
  rationale: 保留动词的被动、祈愿式语气，并把 שְׁלִישִׁתָה 理解为第三次发生或加强；因原短语也可能表示“三重”，另加脚注。
- source_word: חֶרֶב חֲלָלִים
  choice: 杀戮之刀
  rationale: 原文直译可作“被杀者之刀”。中文“杀戮之刀”既简洁，也表达这刀与众多死者相连的致命作用。
- source_word: חֶרֶב חָלָל הַגָּדוֹל
  choice: 那被杀的大人物之刀
  rationale: 保留 חָלָל 的单数具体含义及 הַגָּדוֹל 所表达的重要、显赫意味；“大人物”比抽象的“大杀戮”更符合原文单数结构。
- source_word: הַחֹדֶרֶת לָהֶם
  choice: 正侵逼他们
  rationale: חדר 在这里可包含进入、穿透或包围侵迫的意味；“侵逼”表达敌对逼近而不强行限定为刺穿或环绕。
theological_decisions:
- issue: “那被杀的大人物”所指为何
  choice: 不指明具体人物
  alternative: 明确解释为君王、领袖或某一历史人物
  rationale: 本节原文只用单数的“被杀者”和“大”来描述，并未点名；译文保留其指涉上的张力。
translation_notes:
  register: 采用现代、庄重而可诵读的普通话。“以掌击掌”保留先知动作的具体性；破折号呈现后半节连续而急迫的刀剑意象。所有原文中确有的词义歧义均以脚注保留。
