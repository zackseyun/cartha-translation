  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָסִיר֙ הַ/מִּצְנֶ֔פֶת וְ/הָרִ֖ים הָֽ/עֲטָרָ֑ה זֹ֣את לֹא זֹ֔את הַ/שָּׁפָ֣לָה הַגְבֵּ֔הַ וְ/הַ/גָּבֹ֖הַ הַשְׁפִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/031.yaml
  text: 'Thus says the Lord GOD: Remove the turban[a], and take off the crown. This will not remain the same: exalt the lowly[b], and humble the exalted.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“除去头巾[a]，摘下冠冕！这必不再如此[b]。使卑微者升高，使居高位者降卑。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “头巾”可特指祭司所戴的头饰；“冠冕”则代表王权。本句宣告既有领导权柄的标志将被除去。
    reason: cultural_note
  - marker: b
    text: 原文十分简省，字面近于“这不再是这”；也可译作“这必不再照旧”或“这要归于无有”，强调现有秩序将被翻转。
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 按现代中文圣经语体自然表达先知宣告公式，并以“主耶和华”保留 אֲדֹנָי 与神名 יהוה 两个成分。
- source_word: הָסִיר הַמִּצְנֶפֶת
  choice: 除去头巾
  rationale: הָסִיר 是使役命令式，表示除去；מִצְנֶפֶת 指缠裹式头饰，在祭司语境中可特指祭司头巾。“头巾”简明且不过度限定。
- source_word: וְהָרִים הָעֲטָרָה
  choice: 摘下冠冕
  rationale: רום 的使役命令式本义为举起；与冠冕连用并处于废黜语境时，指将其拿下。“摘下”符合现代汉语搭配，也保留具体动作。
- source_word: זֹאת לֹא זֹאת
  choice: 现状必不再照旧
  rationale: 原文极其简省，字面近于“这不再是这”。译文表达既有秩序将被翻转的意思，同时以脚注保留其句法含混。
- source_word: הַשָּׁפָלָה הַגְבֵּהַ
  choice: 使卑微的升高
  rationale: שָׁפָלָה 指低下或卑微者，הַגְבֵּהַ 表示使之升高；此译保留高低倒转的意象。
- source_word: וְהַגָּבֹהַ הַשְׁפִּיל
  choice: 使居高位的降卑
  rationale: גָּבֹהַ 可指高的、处于高位的，不必然含道德上的骄傲；“居高位的”避免过度解释，הַשְׁפִּיל 则译为“降卑”，与前句形成对称。
theological_decisions:
- issue: אֲדֹנָי יְהוִה 这一复合神圣称号的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”是现代中文读者熟悉且庄重的表达，并保留复合称号的两个要素；不借此引入特定宗派立场。
- issue: זֹאת לֹא זֹאת 所宣告的翻转范围
  choice: 现状必不再照旧
  alternative: 这必不再如此／这要归于无有
  rationale: 原文没有明确说明仅指王权、祭司职分或整个政治秩序，因此正文只表达现存状态将改变，不把其神学指向限定得过窄。
- issue: גָּבֹהַ 是否应理解为道德上的骄傲者
  choice: 居高位的
  alternative: 高傲的
  rationale: 本节以头巾和冠冕象征既有领导权柄，高低对举首先可以是地位上的翻转；译作“居高位的”可避免把原文未明说的道德评价强加进去。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。命令句保持先知宣告的力度；“升高／降卑”保留原文鲜明的对称结构。正文中的[a]、[b]与脚注逐一对应。
