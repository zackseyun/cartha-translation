base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/002.yaml
  text: Son of man[a], set your face toward the south, and preach toward the south[c][b], and prophesy against the forest of the field in the Negeb.
translation:
  language: zh_hans
  text: “人子啊，你要面向南方[a]，向南方宣讲[b]，并向南地田野的树林说预言[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文依次用了三个与南方有关的词：提幔方向（南方）、南方和南地；这种重复加强了神谕对南部地区的聚焦。
    reason: lexical_alternative
  - marker: b
    text: “宣讲”原文直译为“滴下”，是希伯来语中形容先知发出话语的比喻。
    reason: lexical_alternative
  - marker: c
    text: “南地田野的树林”也可译作“南地开阔地的树林”。
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留以西结书中反复出现的先知称呼及希伯来语的形式，同时符合现代中文圣经语体。
- source_word: שִׂים פָּנֶיךָ
  choice: 面向
  rationale: 自然表达把脸转定于某一方向的希伯来习语；其坚定意味由命令语气和上下文体现。
- source_word: דֶּרֶךְ תֵּימָנָה
  choice: 向南方
  rationale: תֵּימָנָה在此最自然地作方向副词，且与随后两个南方词语形成修辞性的连续呼应。
- source_word: וְהַטֵּף
  choice: 发言
  rationale: 该动词字面为“滴下”，在先知语境中指发出话语；正文采用清楚而不过度解释的“发言”，并以脚注保留原有隐喻。
- source_word: אֶל דָּרוֹם
  choice: 向南方
  rationale: 保留介词אֶל通常的方向意义，不把敌对意味强行写入这一分句；审判语境仍由后文显明。
- source_word: וְהִנָּבֵא
  choice: 说预言
  rationale: 准确传达先知受命宣告神谕的动作，现代中文清楚自然。
- source_word: אֶל יַעַר הַשָּׂדֶה נֶגֶב
  choice: 攻击南地田野的树林
  rationale: “攻击”表达预言针对审判对象的语境；“田野的树林”保留不寻常的希伯来意象；נֶגֶב按南部地域译作“南地”。
- source_word: נֶגֶב
  choice: 南地
  rationale: 这里较可能指具体的南部地区；译作“南地”既与前两个方向词有所区别，也比音译更便于普通中文读者理解。
theological_decisions:
- issue: 预言所针对对象的敌对意味
  choice: 在“说预言攻击”中明确表达
  alternative: 说预言论到／向……说预言
  rationale: 介词אֶל本身可表示“向、对”，但审判神谕和并行结构支持对象性的敌对含义；仅在预言分句中表达，以免把前一分句的方向意义也固定为敌对意义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“人子”保留以西结书的固定称呼；“田野的树林”刻意保留原文略显异常、可能具有象征性的表达，不在正文中擅自释义。
