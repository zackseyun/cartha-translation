source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי יֹאמְר֣וּ אֵלֶ֔י/ךָ עַל מָ֖ה אַתָּ֣ה נֶאֱנָ֑ח וְ/אָמַרְתָּ֡ אֶל שְׁמוּעָ֣ה כִֽי בָאָ֡ה וְ/נָמֵ֣ס כָּל לֵב֩ וְ/רָפ֨וּ כָל יָדַ֜יִם וְ/כִהֲתָ֣ה כָל ר֗וּחַ וְ/כָל בִּרְכַּ֨יִם֙ תֵּלַ֣כְנָה מַּ֔יִם הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/012.yaml
  text: And it shall be[a], when they say to you, ‘Why are you groaning?’ that you shall say, ‘Because of the news, for it is coming.’ Then every heart will melt, all hands will grow weak, every spirit will faint, and all knees will run with water. Look, it is coming, and it will happen[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 当他们问你：‘你为什么呻吟？’你就说：‘因为这消息[a]要来了。’各人的心都要融化，所有的手都要发软，各人的心灵都要衰颓，所有的膝盖都要流出水来[b]。看哪，它要来到，也必发生。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “消息”也可译作“报告”或“传闻”。原文“要来了”在语法上与“消息”一致，但在语境中也可连带指向这消息所宣告的灾祸。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“所有的膝盖都要流出水来”，是描写惊恐和崩溃的强烈意象；可能指双膝软弱如水，也可能暗示人因恐惧而失去身体控制。
    reason: cultural_note
lexical_decisions:
- source_word: נֶאֱנָח
  choice: 呻吟
  rationale: 该词表示因痛苦而发出的叹息或呻吟；“呻吟”保留了可听见的哀痛感，比“叹气”力度更强。
- source_word: שְׁמוּעָה
  choice: 消息
  rationale: 这里指即将传来的可怕消息；“消息”符合现代汉语，同时不把它过度限定为正式报告或传闻。
- source_word: כִי בָאָה
  choice: 它就要来了
  rationale: 阴性动词在语法上回指“消息”，未完成语境中的临近感用“就要”表达；同时保留它也可能连带指向所宣告灾祸的张力。
- source_word: וְנָמֵס כָּל לֵב
  choice: 每颗心都要消融
  rationale: 保留希伯来语“心消融”的身体意象，表达勇气瓦解，而不直接释义为“人人丧胆”。
- source_word: וְרָפוּ כָל יָדַיִם
  choice: 所有的手都要发软
  rationale: “手发软”是自然的现代汉语，既保留身体隐喻，也表达失去力量和行动能力。
- source_word: וְכִהֲתָה כָּל רוּחַ
  choice: 每个灵都要衰颓
  rationale: רוּחַ在此主要指人的内在精神或勇气；“灵”保留原词范围，“衰颓”体现黯淡、虚弱和意志崩溃。
- source_word: וְכָל בִּרְכַּיִם תֵּלַכְנָה מַּיִם
  choice: 所有的膝盖都要流出水来
  rationale: 尽量保留原文突兀而强烈的恐惧意象，不在正文中武断决定它仅指腿软，还是也涉及因惊恐而失禁。
- source_word: הִנֵּה
  choice: 看哪
  rationale: “看哪”在庄重经文语体中简明地保留提示注意和迫近感。
- source_word: וְנִהְיָתָה
  choice: 也必发生
  rationale: 表达所宣告之事确定实现；“必”传达断言力度，“发生”比“成就”更不预设事件性质。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 采用现代中文圣经语境中易于识别的复合称谓，“主”对应אֲדֹנָי，“耶和华”对应四字神名。
theological_decisions:
- issue: “消息来到”与“灾祸来到”的指向
  choice: 正文用“它”在语法上回指“消息”，脚注说明语境也可使人联想到消息所宣告的灾祸
  alternative: 直接译为“因为所听见的灾祸就要临到”
  rationale: 希伯来语阴性动词与阴性名词שְׁמוּעָה一致，但整段宣告使消息与其内容紧密相连；保留代词可避免把这种张力单一化。
- issue: “膝盖流出水来”的含义
  choice: 正文保留原有意象，并以脚注列出主要理解
  alternative: 正文直接译为“双膝软弱如水”或“吓得小便失禁”
  rationale: 原文意象可能指恐惧造成的腿软，也可能暗示失去身体控制；直接选择其中一种会消除真实歧义。
- issue: 神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在简体中文普通读者中辨识度高，并保留专名性质；不以“主上主”重复翻译两个称谓。
translation_notes:
  register: 采用现代、庄重而可理解的普通话书面语。保留“心消融”“手发软”“灵衰颓”和“膝盖流出水来”这一连串身体意象及其递进节奏；对原文确有的歧义不在正文中强行消解，而以脚注说明。
