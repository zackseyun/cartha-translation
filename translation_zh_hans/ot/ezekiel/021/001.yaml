base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知书固定表达“耶和华的话临到某人”中，וַיְהִי不宜机械译为“发生”或“成为”；“临到”准确而自然地表达神的话向先知发出。
- source_word: דְבַר
  choice: 话
  rationale: דְבַר在此指神所说的启示性言语；“话”既保留先知书的传统表达，也比解释性的“信息”更贴近原文。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，而不以“主”等称号替代。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词אֶל加第一人称后缀表示朝向先知；中文与“临到”搭配，合译为“临到我”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接宣告的神谕；中文以“说”自然承接下文。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文采用广为通行且易于普通读者辨识的专名“耶和华”，既不以称号替换，也不借此处理对古代读音的不同重构。
translation_notes:
  register: 采用现代、庄重而简洁的先知书引言句式。“耶和华的话临到我，说”保留原文的连接结构和启示公式；本节无须脚注。
