id: EZK.21.33
reference: Ezekiel 21:33
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנָּבֵ֤א וְ/אָֽמַרְתָּ֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה אֶל בְּנֵ֥י עַמּ֖וֹן וְ/אֶל חֶרְפָּתָ֑/ם וְ/אָמַרְתָּ֗ חֶ֣רֶב חֶ֤רֶב פְּתוּחָה֙ לְ/טֶ֣בַח מְרוּטָ֔ה לְ/הָכִ֖יל לְמַ֥עַן בָּרָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/033.yaml
  text: 'And you[a], son of man, prophesy and say, ‘Thus says the Lord GOD concerning the sons of Ammon and concerning their reproach’: And you shall say, ‘A sword, a sword, drawn for slaughter, polished for devouring[c][b], so that it flashes like lightning.’'
translation:
  language: zh_hans
  text: '“你呢，人子，要说预言，说：‘主耶和华论到亚扪人[a]和他们的辱骂[b]如此说：’你要说：


    ‘刀！刀已经出鞘，为要杀戮；


    已经擦亮，为要吞灭[c]，


    使它如闪电般闪耀。’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译“亚扪之子”。
    reason: lexical_alternative
  - marker: b
    text: “他们的辱骂”也可理解为“他们的讥诮”或“他们所受的羞辱”。
    reason: ambiguity
  - marker: c
    text: “为要吞灭”所据的希伯来语形式含义不确定；也有人译作“吞吃”或“毁灭”。全句也可译：“刀！刀已经出鞘，为要杀戮；已经磨亮，要吞灭，要如闪电般闪耀。”
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: וְאַתָּה
  choice: 你呢
  rationale: 独立代词带有强调意味；“你呢”自然地保留话语转向和对以西结本人的强调。
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是以西结书中反复出现的固定称呼；沿用简洁而庄重的传统表达，以保留全书的文学呼应。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别保留 אֲדֹנָי 的“主”和神名 יְהוִה，避免把二者合并为一个称号。
- source_word: בְּנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 希伯来语字面为“亚扪之子”，在现代汉语中用族名“亚扪人”更自然，所指不变。
- source_word: חֶרְפָּתָם
  choice: 他们的羞辱
  rationale: 该词可指羞辱、耻辱或辱骂；“他们的羞辱”尽量保留属格关系及其方向上的含混，不武断判定是他们所受的羞辱还是他们发出的辱骂。
- source_word: חֶרֶב חֶרֶב
  choice: 刀！刀
  rationale: 保留原文的重复和突兀呼喊；在本段战争语境中“刀”比泛指的“剑”更能涵盖用于杀戮的刃器。
- source_word: פְּתוּחָה
  choice: 已经出鞘
  rationale: 字面有“打开”之意，用于刀剑时表示拔出、出鞘；此译符合现代汉语武器意象。
- source_word: לְטֶבַח
  choice: 为要杀戮
  rationale: 保留介词所表达的目的，并维持原文严厉的审判语气。
- source_word: מְרוּטָה
  choice: 已经擦亮
  rationale: 该词在本章刀剑诗歌中指磨光、擦亮，使刀刃能够闪光；“擦亮”与下句“闪耀如电”衔接自然。
- source_word: לְהָכִיל
  choice: 为要吞灭
  rationale: 形式和语义均较困难；在杀戮之刀的语境中采用“吞灭”这一传统语境性理解，同时以脚注说明原文疑难，不把解释伪装成确定无疑。
- source_word: לְמַעַן בָּרָק
  choice: 使它闪耀如电
  rationale: 原短语简略，以“如电”表达 בָּרָק 的闪电意象，并补出刀为主语，使现代汉语清楚而不改变画面。
theological_decisions:
- issue: 神名 יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 复合称呼 אֲדֹנָי יְהוִה 同时包含“主”和神的专名；“主耶和华”在普通中文读者中辨识度高，并保留两个成分。
- issue: חֶרְפָּתָם 所指羞辱的方向
  choice: 他们的羞辱
  alternative: 他们所受的羞辱；他们的辱骂
  rationale: 希伯来语所有格本身没有明确说明亚扪人是受辱者还是辱骂者；正文不替原文消除这种张力，脚注列出两种可能。
- issue: 刀“吞灭”的拟人化审判意象
  choice: 保留“吞灭”
  alternative: 毁灭；吞吃
  rationale: 这一表达维持原文暴烈而诗性的审判图像，不把它淡化为抽象结果，也不赋予超出经文的教义含义。
translation_notes:
  register: 采用现代、庄重而有口语可懂度的先知宣告体。以短行和感叹号保留希伯来诗句的急促重复及刀剑意象；正文保持语义张力，疑难处通过脚注说明，而不擅自确定羞辱的方向或疑难动词的唯一含义。
