  yaml_path: translation/ot/ezekiel/021/004.yaml
  text: And all flesh will see that I[a], Yahweh, have kindled it; it will not be quenched.
translation:
  language: zh_hans
  text: 凡有血肉的[a]都必看见：是我雅威点燃了这火；这火必不熄灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凡有血肉的”是希伯来语惯用语，意为“所有人”。
    reason: 说明原文惯用语的实际所指，同时保留正文的具体意象。
lexical_decisions:
- source_word: וְרָאוּ
  choice: 都必看出
  rationale: ראה的基本义是“看见”；此处在先知性审判语境中指将来必从事件中认出事实，译为“必看出”既保留视觉动词的具体性，也符合现代汉语。
- source_word: כָּל בָּשָׂר
  choice: 凡有血肉的
  rationale: 直译为“所有肉身”，是指众人的希伯来语惯用语。“凡有血肉的”保留先知文体和圣经互文，同时用脚注说明其所指。
- source_word: כִּי
  choice: 是
  rationale: 此处引出众人将看出的内容，而非说明原因；汉语用“看出，是……”自然表达这一内容关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，明确保留原文中的专名，而不以称号替代。
- source_word: בִּעַרְתִּיהָ
  choice: 点燃了它
  rationale: בער在这里表示使火燃起；阴性单数后缀译为“它”，承接上下文中的火，不额外指定原文未明说的对象。
- source_word: לֹא תִּכְבֶּה
  choice: 它必不熄灭
  rationale: כבה用于火熄灭；译成主动形态的“不熄灭”符合现代汉语，也准确保留持续而无法止息的判断。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现这一专名，避免用“主”把专名改成称号。
- issue: 不可熄灭之火的表述
  choice: 保持“它必不熄灭”的绝对陈述
  alternative: 解释为审判必定完成或永远燃烧
  rationale: 原文强调火不会熄灭，但本节没有进一步界定其持续方式或神学含义，因此不在正文中替原文消解这种张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“凡有血肉的”保留先知文学色彩；其余措辞简洁直接。分号对应原文两个紧密相连而各自完整的判断。
