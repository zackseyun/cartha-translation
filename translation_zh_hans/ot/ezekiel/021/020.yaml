base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/020.yaml
  text: so that the heart may melt and the stumbling blocks may be many[a]. At all their gates I have set the flash of the sword. Ah! It is made for lightning[b], drawn for slaughter.
translation:
  language: zh_hans
  text: 为要使人心消融，使绊倒人的事增多[a]，我在他们所有的城门都安置了利剑的闪光。啊！剑已制成，要如闪电般闪耀[b]；已预备妥当，为要杀戮。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使许多人跌倒。”希伯来文名词既可指使人绊倒的事物，也可指由此造成的跌倒或败亡。
    reason: lexical_alternative
  - marker: b
    text: 本节末句的希伯来文含义不易确定。“已预备妥当，为要杀戮”也可译作“已拔出，为要杀戮”“已磨利，为要杀戮”或“已擦亮，为要杀戮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן לָמוּג לֵב
  choice: 为使人心消化
  rationale: לְמַעַן引出目的或结果；מוּג与“心”连用，描写勇气和意志消融。保留希伯来文单数集合用法及“心消化”的鲜明隐喻。
- source_word: וְהַרְבֵּה הַמִּכְשֹׁלִים
  choice: 使绊倒人的事增多
  rationale: מִכְשׁוֹל既可指绊脚之物或绊倒的缘由，也可指由此造成的跌倒、败亡。正文保留具体意象，同时以脚注说明另一种理解。
- source_word: עַל כָּל שַׁעֲרֵיהֶם
  choice: 在他们所有的城门口
  rationale: עַל在此与“设置”搭配，主要表示利剑威胁所在的位置；“城门口”比单说“门口”更符合战争与城邑语境。
- source_word: נָתַתִּי
  choice: 我……设置了
  rationale: 此处不是一般意义的“给予”，而是将带来审判的利剑置于各城门口；“设置”自然且保留主动安排的意味。
- source_word: אִבְחַת חָרֶב
  choice: 利剑的寒光
  rationale: אִבְחָה是罕见词，在本段与闪电、杀戮相连，较可能指剑刃闪烁的光芒。“寒光”在现代汉语中自然地传达利刃令人战栗的闪光。
- source_word: אָח
  choice: 哎！
  rationale: 保留突然而含强烈情绪的感叹，但不把它过度限定为哀叹、惊讶或嘲讽。
- source_word: עֲשׂוּיָה לְבָרָק
  choice: 这剑造好，为要闪电般发光
  rationale: 阴性分词回指“剑”；בָרָק可指闪电或闪光。译文以明喻自然呈现剑已预备好、将如闪电发光的图景。
- source_word: מְעֻטָּה לְטָבַח
  choice: 已经磨利，为要杀戮
  rationale: מְעֻטָּה词形及含义困难；上下文明确强调剑已为杀戮作好准备。“磨利”符合刀剑语境，但脚注保留可能译作“拔出”或“擦亮”的不确定性。
