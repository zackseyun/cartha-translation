  rationale: 修订以“人心消融”替换会造成歧义的“人心消化”，保留原文心融化的比喻及集合单数的概括性。“利剑的闪光”和“如闪电般闪耀”保持剑光—闪电的连贯意象。末句因希伯来文罕见词意义不确定，正文不选定单一技术性处理，而以“预备妥当”表达其在杀戮前已被整备的语境含义，并在脚注完整保留主要可行译法。
