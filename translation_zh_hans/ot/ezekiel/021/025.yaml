source:
  edition: WLC
  text: דֶּ֣רֶךְ תָּשִׂ֔ים לָ/ב֣וֹא חֶ֔רֶב אֵ֖ת רַבַּ֣ת בְּנֵֽי עַמּ֑וֹן וְ/אֶת יְהוּדָ֥ה בִ/ירוּשָׁלִַ֖ם בְּצוּרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/025.yaml
  text: You shall set a road for the sword to come to Rabbah of the Ammonites[b][a], and to Judah in fortified Jerusalem.
translation:
  language: zh_hans
  text: 你要划出一条路，使刀剑来到亚扪人的拉巴[b][a]，也来到犹大，就是那设防的耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使刀剑攻向亚扪人的拉巴，也攻向犹大，就是那设防的耶路撒冷。”原文结构既可表达朝这些地方前进，也可表达以它们为攻击目标。
    reason: alternative_reading
  - marker: b
    text: 拉巴是亚扪人的首府。
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: 一条路
  rationale: 该词指道路或路线；结合先知以行动作预兆的语境，译为“一条路”自然地呈现为进军之剑标定路线的图景。
- source_word: תָּשִׂים
  choice: 你要修
  rationale: שׂים的基本义是“放置、设立”；与“路”搭配时，现代汉语用“修一条路”较自然，也表达划定、预备路线的实际效果，并保留命令语气。
- source_word: לָבוֹא
  choice: 可以来到
  rationale: בוא的不定式在此说明修路的目的或结果，即让刀剑得以来到目标地点。“可以来到”以自然汉语保留这种目的关系。
- source_word: חֶרֶב
  choice: 刀剑
  rationale: 这里以“刀剑”转喻军事攻击和审判；采用圣经汉语中自然且庄重的“刀剑”，并不把其所代表的具体军队直接写入正文。
- source_word: אֵת רַבַּת בְּנֵי עַמּוֹן
  choice: 来到亚扪人的拉巴
  rationale: 拉巴是专名，בני עמון按现代汉语民族称谓译作“亚扪人”。אֵת在此所标示的地点既可理解为趋向，也带有敌对目标的含义；正文采用“来到”，脚注说明另一种表达。
- source_word: וְאֶת יְהוּדָה
  choice: 也来到犹大境内……耶路撒冷
  rationale: 与拉巴构成平行目标。原文“犹大”与“耶路撒冷”的关系在汉语中若机械直译会生硬；“犹大境内”明确耶路撒冷属于犹大，同时不削弱二者作为刀剑目标的含义。
- source_word: בִירוּשָׁלַם
  choice: 耶路撒冷
  rationale: ב表示所在位置；结合前面的“犹大”，译作“犹大境内……耶路撒冷”，用自然汉语表达其地点关系。
- source_word: בְּצוּרָה
  choice: 设防的
  rationale: 该词表示有防御工事、坚固设防；“设防的耶路撒冷”简洁保留其修饰作用，而不额外补出原文没有的“城”。
theological_decisions:
- issue: לָבוֹא חֶרֶב之后两个אֵת短语的句法指向
  choice: 将拉巴和犹大境内的耶路撒冷都译为刀剑进军所到的平行目标
  alternative: 译为“攻打亚扪人的拉巴，也攻打犹大境内设防的耶路撒冷”
  rationale: 上下文是为巴比伦王的刀剑标出通向两个可能目标的道路。正文的“来到”较贴近בוא的移动意义，同时脚注保留其敌对进军的语用含义，避免把方向与攻击之间的张力单方面消解。
- issue: “刀剑”的神学与修辞功能
  choice: 保留“刀剑”这一拟人化、转喻性的审判形象
  alternative: 明确译成“军队”或“巴比伦王的军队”
  rationale: 原文用חֶרֶב，不直接说“军队”。保留形象既忠于先知文学，也避免在本节正文中加入由上下文推得但未明说的解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“修一条路”比直译“放置一条路”更符合汉语搭配；“刀剑可以来到”保留原文拟人化的军事审判意象。脚注标记按正文首次出现处排列为[b][a]，分别提供地理背景和句法上的另一种译法。
