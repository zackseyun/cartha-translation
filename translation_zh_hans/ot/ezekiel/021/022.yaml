  text: וְ/גַם אֲנִ֗י אַכֶּ֤ה כַפִּ/י֙ אֶל כַּפִּ֔/י וַ/הֲנִחֹתִ֖י חֲמָתִ֑/י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/022.yaml
  text: And I too will strike my hands together[a], and I will satisfy my wrath. I, Yahweh[b], have spoken.
translation:
  language: zh_hans
  text: 我也要双手相击[a]，使我的烈怒止息[b]。我，雅威，已经说了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我要把我的手掌击向我的手掌”，指用力合掌或击掌，是强调审判的动作。
    reason: lexical_alternative
  - marker: b
    text: 也可译“让我的烈怒安歇”。原文意象是烈怒在审判彻底施行后归于止息。
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: 我也
  rationale: 保留连接词、גַם的附加强调以及独立代词אֲנִי所突出的主语，现代汉语表达自然简洁。
- source_word: אַכֶּה כַפִּי אֶל־כַּפִּי
  choice: 双手相击
  rationale: 原文直译为“使我的手掌击向我的手掌”。“双手相击”保留动作形象及审判语境中的强烈意味，又避免“拍手”可能带出的欢庆色彩。
- source_word: וַהֲנִחֹתִי חֲמָתִי
  choice: 使我的烈怒止息
  rationale: 保留נוח使役形“使……安歇、止息”的意象；这里指烈怒因审判彻底施行而归于止息，而非单纯情绪平复。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: חֵמָה指炽烈的愤怒；“烈怒”符合先知书审判语境，并保留词语强度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不用称号替代专名。
- source_word: דִּבַּרְתִּי
  choice: 已经说了
  rationale: 完成式用于庄严的神谕确认；“已经说了”在现代汉语中自然，并保留宣告已经作出的确定性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；正文采用较贴近学界通行重构读音的“雅威”，保留其专名性质。
- issue: 神怒“止息”的含义
  choice: 使我的烈怒止息
  alternative: 满足我的烈怒
  rationale: 直译保留原文使役动词的神学张力，不把“止息”的方式过度解释进正文；上下文表明这止息与审判的施行有关，脚注予以说明。
- issue: 独立主语אֲנִי与神名并置
  choice: 我—雅威—已经说了
  alternative: 我雅威已经说了
  rationale: 破折号体现原文“我，雅威”的庄严自我确认，同时避免现代汉语误读为不自然的连续名词结构。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“双手相击”保留先知性动作的力度；“使我的烈怒止息”贴近希伯来语意象，并以脚注说明其语境含义。神谕结语用破折号突出说话者“雅威”的身份。
