source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בָּ/הֶ֔ם מֵ/הָ/אֵ֣שׁ יָצָ֔אוּ וְ/הָ/אֵ֖שׁ תֹּֽאכְלֵ֑/ם וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/שׂוּמִ֥/י אֶת פָּנַ֖/י בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/007.yaml
  text: And I will set my face against them[a]. They have come out from the fire, but the fire will consume them. Then you will know that I am Yahweh[b], when I set my face against them.
translation:
  language: zh_hans
  text: 我必定意与他们为敌[a]。他们从火中出来，火却要吞灭他们[b]。当我定意与他们为敌的时候，你们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “定意与他们为敌”对应一个希伯来语习语，字面是“把我的脸设立在他们身上”，表示坚决反对并施行审判。
    reason: cultural_note
  - marker: b
    text: “从火中出来”不一定表示成功逃脱；原文随即说火仍要吞灭他们。连接词也可直译为“而且”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־פָּנַי בָּהֶם
  choice: 我必板起脸来敌对他们
  rationale: 直译为“把我的脸朝向他们”在现代汉语中不能自然表达敌对和审判。“板起脸来敌对”既保留“脸”的意象，也明确传达这个希伯来语习语所表示的坚决反对。
- source_word: מֵהָאֵשׁ יָצָאוּ
  choice: 他们从火中出来
  rationale: יָצָאוּ只说明从火中出来，并不必然表示已经成功逃脱；因此不用“逃出”，以保留下一分句所形成的反讽和张力。
- source_word: וְהָאֵשׁ תֹּאכְלֵם
  choice: 火却要吞灭他们
  rationale: 以火为主语时，אכל表示吞噬、烧尽。“吞灭”庄重而自然；将连接词译为“却”，显出虽从火中出来、仍将被火毁灭的对比。
- source_word: וִידַעְתֶּם
  choice: 你们就知道
  rationale: 这里的连接形式带出审判行动所产生的结果；“就”自然表达这种后果关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名直接音译为“雅威”，保留经文中的专名，不以称号代替。
- source_word: בְּשׂוּמִי אֶת־פָּנַי בָּהֶם
  choice: 我板起脸来敌对他们的时候
  rationale: ב加不定式结构在此表达时间；重复前半节的用语，保留原文首尾呼应的修辞结构。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，而不是“主”这一称号；音译“雅威”较直接地保留其专名性质。
- issue: “把脸朝向他们”这一审判习语的力度
  choice: 板起脸来敌对他们
  alternative: 反对他们；转脸攻击他们
  rationale: 译文保留“脸”的具体意象，同时用“敌对”说明该习语在此不是关注或眷顾，而是坚决施行审判。
- issue: 两处“火”是否指同一次灾祸
  choice: 不作限定
  alternative: 从一场火中出来，却被另一场火吞灭
  rationale: 希伯来文本重复使用定冠词加“火”，但没有明说是同一场还是不同阶段的火；译文保留这一开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“板起脸来”保留原文的面部意象，“敌对”则避免现代读者误解为单纯显出严肃神情。句式尽量贴近希伯来文的重复和推进，并保留火的指涉是否相同这一含混之处。
