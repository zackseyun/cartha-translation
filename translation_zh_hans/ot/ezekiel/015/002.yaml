base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/002.yaml
  text: Son of man[a], how is the wood of the vine better than any wood, the branch that is among the trees of the forest?
translation:
  language: zh_hans
  text: “人子啊，葡萄树的木料比任何别的木料有什么长处？那在林中树木间的枝子又有什么长处呢？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“葡萄树的木料比任何别的木料多了什么？那在林中树木间的枝子呢？”希伯来文为省略的比较问句。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝称呼先知的固定用语；保留希伯来语惯用表达。在这里，它是对先知的称呼，并非弥赛亚头衔。
- source_word: מַה יִּהְיֶה
  choice: 强在哪里／有什么长处
  rationale: 希伯来文是省略式比较问句，询问葡萄树木料相较其他木料有何优越或用处；中文需略作补足才自然，同时以脚注保留原文的简略性。
- source_word: עֵץ הַגֶּפֶן
  choice: 葡萄树的木料
  rationale: 突出讨论的是葡萄树作为木料的价值，而不只是葡萄树这种植物；这对下文比喻的发展很重要。
- source_word: מִכָּל עֵץ
  choice: 比别的木料
  rationale: 介词 מִן 与 כָּל 构成比较。译作“比别的木料”符合现代汉语，也保留与各种木料相比较的意思。
- source_word: הַזְּמוֹרָה
  choice: 枝子
  rationale: 该词指葡萄树的枝条或嫩枝；上文已明确葡萄树，译作“枝子”简洁自然。
- source_word: אֲשֶׁר הָיָה בַּעֲצֵי הַיָּעַר
  choice: 那长在林中树木间的
  rationale: 希伯来语完成式在这里描述一般情形；中文用“长在”自然地表达枝子处于林中树木之间。
