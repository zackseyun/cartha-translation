source:
  edition: WLC
  text: הֲ/יֻקַּ֤ח מִמֶּ֨/נּוּ֙ עֵ֔ץ לַ/עֲשׂ֖וֹת לִ/מְלָאכָ֑ה אִם יִקְח֤וּ מִמֶּ֨/נּוּ֙ יָתֵ֔ד לִ/תְל֥וֹת עָלָ֖י/ו כָּל כֶּֽלִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/003.yaml
  text: Is wood taken from it to make anything useful? Or do they take from it a peg to hang every kind of vessel on it?[a][b][c]
translation:
  language: zh_hans
  text: 人会从其中取木料，做成什么可用的东西吗？人会从其中取一根木橛，把各样器物挂在上面吗？[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “做成什么可用的东西”也可译作“做成供使用之物”或“做成供工作用的东西”。希伯来语此语强调实际用途。
    reason: lexical_alternative
  - marker: b
    text: “木橛”也可译作“木钉”“钉子”或“桩”；此处指固定后可供悬挂物件的支撑物。
    reason: lexical_alternative
  - marker: c
    text: “器物”所对应的希伯来语含义宽泛，可指器皿、用具或其他物件，并非只指陶器。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֻקַּח מִמֶּנּוּ עֵץ
  choice: 能从其中取木料
  rationale: 保留疑问式被动结构的核心意义，并用“能……吗”传达修辞问句；“其中”承接上文的葡萄树，“木料”突出可供制作的木材。
- source_word: לַעֲשׂוֹת לִמְלָאכָה
  choice: 做成什么实用的器具
  rationale: לִמְלָאכָה 表示供工作或实际用途；“实用的器具”在现代汉语中自然呈现其功用意味，也符合本节对葡萄木是否堪用的追问。
- source_word: אִם יִקְחוּ
  choice: 人能……吗
  rationale: אִם 在此引出并列的第二个修辞问句；第三人称复数可作泛指，译为“人”比生硬的“他们”更符合汉语。
- source_word: יָתֵד
  choice: 木钉
  rationale: 该词可指钉、橛或桩；此处所述用途是悬挂物件，“木钉”清楚表达固定在某处、可供悬挂的支撑物，并保留它取自葡萄木的语境。
- source_word: לִתְלוֹת עָלָיו
  choice: 用来悬挂
  rationale: 准确表达“挂在它上面”的用途；汉语无需重复“在它上面”，所指仍清楚是前述木钉。
- source_word: כָּל כֶּלִי
  choice: 各种器物
  rationale: כֶּלִי 语义宽泛，可指器皿、用具或物件；“各种器物”既体现 כָּל 的范围，也避免将其限于陶制容器。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“能……吗”自然传达连续两个修辞问句；“木料—木钉—器物”的词汇链条具体清晰，并保留经文对葡萄木实用价值的反问。
