  text: הִנֵּ֥ה לָ/אֵ֖שׁ נִתַּ֣ן לְ/אָכְלָ֑ה אֵת֩ שְׁנֵ֨י קְצוֹתָ֜י/ו אָכְלָ֤ה הָ/אֵשׁ֙ וְ/תוֹכ֣/וֹ נָחָ֔ר הֲ/יִצְלַ֖ח לִ/מְלָאכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/004.yaml
  text: Look[a], it is given to the fire for fuel. The fire has consumed both of its ends, and its middle is charred[b]. Is it fit for any work?
translation:
  language: zh_hans
  text: 看哪，它被交给火吞吃[a]；火吞掉了它的两头，中间也烧焦了。它还能用来做任何东西吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “吞吃”原文直译为“吃”；这里把火拟人化为吃掉木头。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、指向眼前情景的语气；“看哪”简洁庄重，也符合现代中文经文体。
- source_word: לָאֵשׁ נִתַּן
  choice: 被交给火
  rationale: 保留 נִתַּן 的被动语态，并把 לָאֵשׁ 表达为交付的对象，不擅自补明施动者。
- source_word: לְאָכְלָה
  choice: 吞吃
  rationale: 原词源于“吃”，这里把火拟人化为吞吃木头；中文“吞吃”既保留意象，也自然传达焚毁之意。
- source_word: שְׁנֵי קְצוֹתָיו
  choice: 它的两头
  rationale: 准确表达枝条的两个末端，并采用自然的现代汉语说法。
- source_word: אָכְלָה הָאֵשׁ
  choice: 火吞掉了
  rationale: 延续原文以“吃”描写火的拟人意象，同时清楚表达已经烧毁的结果。
- source_word: וְתוֹכוֹ נָחָר
  choice: 中间也烧焦了
  rationale: תוֹךְ 指中部；נָחָר 描写受火灼烧后的焦损状态。“烧焦”具体而自然。
- source_word: הֲיִצְלַח לִמְלָאכָה
  choice: 它还能用来做什么工吗
  rationale: 在木料语境中，צלח 表示适用、胜任，而 מְלָאכָה 指制作或实用工作；“还能”体现前述焚损所造成的结果，疑问句保留反问力量。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。保留原文中火“吞吃”木头的拟人意象、被动语态和末尾反问，不补明是谁把木头交给火，也不提前解释比喻所指。
