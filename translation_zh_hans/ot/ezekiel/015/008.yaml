  text: וְ/נָתַתִּ֥י אֶת הָ/אָ֖רֶץ שְׁמָמָ֑ה יַ֚עַן מָ֣עֲלוּ מַ֔עַל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/008.yaml
  text: And I will make the land a desolation[a], because they have acted unfaithfully[b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 我要使这地荒凉，因为他们背信弃义[a]。主耶和华说。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用同根的动词和名词，直译近于“他们行了背信之事”，也可译作“他们不忠不信”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“主YHWH”；YHWH代表神名的四个希伯来辅音，常按重构读音译作“雅威”，中文圣经传统译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要使
  rationale: נתן的基本义是“给、置于”，但与“这地”和表语“荒凉”连用时，表达使土地成为荒凉之地；译作“使”准确而自然。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: אֶרֶץ在本段审判语境中指受到审判的那片土地，并非整个世界；汉语用“这地”既承接上下文，也保留地域含义。
- source_word: שְׁמָמָה
  choice: 荒凉
  rationale: 该名词表示荒废、毁坏的状态。“使这地荒凉”在现代汉语中自然，也传达使土地沦为荒芜之境的结果。
- source_word: יַעַן
  choice: 因为
  rationale: יַעַן引出审判的原因，“因为”是清楚、直接的现代汉语因果连接词。
- source_word: מָעֲלוּ מַעַל
  choice: 背信弃义
  rationale: 同根动词与名词连用，强调严重违背信义、辜负托付的行为；“背信弃义”保留其强烈语气及关系性内涵，而不把含义限定为某一种具体罪行。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: נְאֻם是庄严的先知性宣告公式；译为“这是……的宣告”既保留名词性和郑重语气，也符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: אֲדֹנָי意为“主”，יְהוִה是神的专名；“主耶和华”在中文圣经语体中庄重且易于辨认，并由脚注说明原文构成。
theological_decisions:
- issue: 复合神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文采用中文读者熟悉且庄重的“主耶和华”，同时用脚注说明第二词是四字神名YHWH，并列出“雅威”这一按学界常见重构读音的译法，避免把传统中文音译误当作希伯来语原音。
- issue: מָעֲלוּ מַעַל是否明确解释为违背圣约
  choice: 背信弃义
  alternative: 违背了圣约
  rationale: 该同根结构确有不忠、失信和冒犯之意，在以西结书中可带有对神不忠的关系性分量；但本句本身没有出现“约”一词，因此正文不补入“圣约”，以保留原文的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我要使这地荒凉”简洁保留审判宣告的力度；后句以“这是……的宣告”再现先知公式。正文不用过度古雅的“干犯”“悖逆”，也不额外补入原文未明说的“圣约”。
