  text: הִנֵּה֙ בִּֽ/הְיוֹת֣/וֹ תָמִ֔ים לֹ֥א יֵֽעָשֶׂ֖ה לִ/מְלָאכָ֑ה אַ֣ף כִּי אֵ֤שׁ אֲכָלַ֨תְ/הוּ֙ וַ/יֵּחָ֔ר וְ/נַעֲשָׂ֥ה ע֖וֹד לִ/מְלָאכָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/005.yaml
  text: Look[a], when it was whole, it was not made for any work. How much less, when the fire has consumed it and it is charred[c][b], can it still be made for any work?
translation:
  language: zh_hans
  text: 看哪[a]，这木头完整无损时，尚且不能制成任何供使用的器物；何况[b]火已经吞噬它，又把它烧焦了[c]，岂还能制成任何供使用的器物吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “完整无损”也可译作“完好”，指木头尚未被火损坏。
    reason: lexical_alternative
  - marker: b
    text: 原文表达递进推论：木头完整时尚且不能制成供使用之物，被火烧过以后就更不能了。
    reason: lexical_alternative
  - marker: c
    text: “烧焦”也可译作“焦黑”或“烧坏”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意的指示语气；“看哪”在现代中文中庄重而清楚。
- source_word: בִּהְיוֹתוֹ תָמִים
  choice: 这木头完整的时候
  rationale: 此处 תָמִים 描写葡萄树木材尚未受火损坏的完整状态，并非道德意义上的“完全”；补出上下文中的“木头”，使中文所指明确。
- source_word: לֹא יֵעָשֶׂה לִמְלָאכָה
  choice: 尚且不能制成什么有用的器物
  rationale: נפעל 形式在语境中表达木头不能被加工成实用之物；“尚且”与下句“何况”共同呈现由轻及重的论证。
- source_word: אַף כִּי
  choice: 何况
  rationale: 自然表达原文加强语气的递进推论：完整时尚且无用，被火烧后就更不可能有用。
- source_word: אֵשׁ אֲכָלַתְהוּ
  choice: 火已经烧过它
  rationale: 原文直译为“火吞吃了它”；这里用自然中文表达火已对木头造成焚烧，同时避免“烧尽”所暗示的完全消失。
- source_word: וַיֵּחָר
  choice: 把它烧焦了
  rationale: חרר 在这里指受热而焦黑、烧坏；“烧焦”保留木头被火损伤但仍可被谈论的形象。
- source_word: וְנַעֲשָׂה עוֹד לִמְלָאכָה
  choice: 还能制成什么有用的器物吗
  rationale: 按上下文译作反问；“还”对应 עוֹד，并与前半句重复的实用制作概念相呼应。
theological_decisions:
- issue: 比喻意象的所指
  choice: 正文只陈述被火烧过的葡萄树木材毫无制作价值，不直接加入耶路撒冷或犹大的名称。
  alternative: 在正文中明确说这木头象征耶路撒冷或犹大。
  rationale: 本节本身仍处于木头的比喻层面；其所指由上下文揭示。保留意象可避免把解释提前写进译文。
- issue: אַף כִּי 的逻辑关系
  choice: 译为“尚且……何况……”，明确由完整木头的无用推到烧焦木头更无用。
  alternative: 译为单纯时间或强调关系，如“当……时更是如此”。
  rationale: 上下文支持由较轻情形推向较重情形的递进论证；中文配对结构能准确而自然地呈现这一逻辑。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“尚且……何况……”保留原文的修辞推进；用反问句呈现末句在语境中的力量。所有脚注标记均置于正文相应位置。
