  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה כַּ/אֲשֶׁ֤ר עֵץ הַ/גֶּ֨פֶן֙ בְּ/עֵ֣ץ הַ/יַּ֔עַר אֲשֶׁר נְתַתִּ֥י/ו לָ/אֵ֖שׁ לְ/אָכְלָ֑ה כֵּ֣ן נָתַ֔תִּי אֶת יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/006.yaml
  text: 'Therefore thus says the Lord GOD: As the wood of the vine among the trees of the forest[a], which I have given to the fire for fuel, so I have given the inhabitants of Jerusalem.'
translation:
  language: zh_hans
  text: 因此，主耶和华如此说：“正如我把林中树木中的葡萄藤的木头交给火烧毁，我也照样交付了耶路撒冷的居民。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 作为推论连接词，引出前文比喻在耶路撒冷居民身上的结论。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代汉语表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: “主”对应 אֲדֹנָי，“耶和华”明确呈现神名 יְהוִה，并避免汉语中重复称作“主”。
- source_word: עֵץ הַגֶּפֶן
  choice: 葡萄树木
  rationale: 此处 עֵץ 着重指可作材料或柴薪的木头，而非笼统指活着的树；该表达保留葡萄树之木与林木的对照。
- source_word: בְּעֵץ הַיַּעַר
  choice: 林中众树之间
  rationale: 将介词 בְּ 理解为处于林木之中，保留葡萄树木与森林众树相比较的图景。
- source_word: נְתַתִּיו
  choice: 把它交给
  rationale: 第三人称阳性单数后缀回指葡萄树木；“交给”保留 נתן 在审判语境中的交付含义。
- source_word: לָאֵשׁ לְאָכְלָה
  choice: 交给火焚烧净尽
  rationale: 原文直译近于“给火吞吃”；“焚烧净尽”自然表达被火彻底耗尽的意思，脚注保留原有意象。
- source_word: כֵּן
  choice: 也照样
  rationale: 明确标示比喻后半段与前半段的对应关系。
- source_word: נָתַתִּי
  choice: 交出了
  rationale: 与前面的“交给”保持词义呼应；完成体表达审判已经被神断然决定并施行，同时不在正文中增补希伯来文未明说的间接宾语。
- source_word: יֹשְׁבֵי יְרוּשָׁלִָם
  choice: 耶路撒冷的居民
  rationale: 以自然现代汉语表达该分词构词所指的群体。
theological_decisions:
- issue: 复合神圣称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 正文用汉语读者熟悉的“耶和华”呈现四字神名，同时以“主”对应 אֲדֹנָי；不把神名泛化为普通称号。
- issue: 是否明说耶路撒冷居民被交给火
  choice: 不在后半句重复补入“火”
  alternative: 也照样把耶路撒冷的居民交给火
  rationale: 希伯来文后半句只说“我交出了耶路撒冷的居民”，其对象由比喻自然暗示。正文保留这一省略，避免把暗示改成明说，同时维持审判意象的张力。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“主耶和华如此说”保留固定传信公式；整句以“我怎样……也照样……”再现希伯来文比喻结构。
