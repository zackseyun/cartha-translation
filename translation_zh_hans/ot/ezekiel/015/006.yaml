  - severity: low
    issue: “焚烧净尽”略强化原文。
    rationale: לְאָכְלָה 表示交给火吞吃、烧毁；虽隐含毁灭，原文并未额外强调“净尽”。改作“烧毁”可保留意象而避免不必要的程度强化。
  revised_text: 因此，主耶和华如此说：“正如我把林中树木中的葡萄藤的木头交给火烧毁，我也照样交付了耶路撒冷的居民。”
  revised_footnotes:
