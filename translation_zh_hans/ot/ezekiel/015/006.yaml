revisions:
- from: 因此，主耶和华如此说：“林中众树之间的葡萄树木，我怎样把它交给火焚烧净尽[a]，也照样交出了耶路撒冷的居民。”
  to: 因此，主耶和华如此说：“正如我把林中树木中的葡萄藤的木头交给火烧毁，我也照样交付了耶路撒冷的居民。”
  rationale: 修订使“葡萄藤的木头”明确对应作为木料的 עֵץ הַגֶּפֶן，并将“焚烧净尽”收敛为“烧毁”，避免强化原文。后半句仍未补出“火”，从而保留希伯来文在比喻应用部分的省略；“交付了”则自然表达 נָתַתִּי 的交出／交付语气。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:30:43Z'
