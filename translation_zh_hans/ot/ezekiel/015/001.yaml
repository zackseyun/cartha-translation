  text: 雅威[a]的话临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），是上帝的专名；传统中文译作“耶和华”。
    reason: 说明神圣四字名的原文形式及传统中文译名。
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在先知书固定表达“耶和华的话……临到”中，“临到”自然地传达 divine communication 的发生，也保留希伯来语先知宣告公式的庄重感。
- source_word: דְבַר
  choice: 话
  rationale: 此处指来自上帝的言语性启示；“话”既符合现代汉语圣经语体，也比解释性的“信息”更能保留原文反复出现的先知公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣四字名传统音译“耶和华”，并以脚注说明其希伯来文形式及另一常见拟音。
- source_word: אֵלַי
  choice: 我
  rationale: 与“临到”搭配时，汉语自然表达为“临到我”，准确传达介词及第一人称后缀。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接引语；“说：”简洁自然，并由冒号表明下文是所说内容。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。正文采用现代中文基督徒和普通读者最熟悉的传统音译“耶和华”，而不以“主”这一称号代替；脚注保留“雅威”这一较接近学界重构读音的常见拟音，避免掩盖原文是专名这一事实。
translation_notes:
  register: 采用自然、庄重的现代标准汉语，并保留先知书中反复出现的公式“耶和华的话临到我”。“说：”承接下一节的直接引语。
