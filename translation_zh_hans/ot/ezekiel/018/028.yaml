  text: וַ/יִּרְאֶ֣ה ו/ישוב מִ/כָּל פְּשָׁעָ֖י/ו אֲשֶׁ֣ר עָשָׂ֑ה חָי֥וֹ יִחְיֶ֖ה לֹ֥א יָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/028.yaml
  text: Because he considered and turned back from all his transgressions that he had committed[a], he will surely live[b]; he will not die.
translation:
  language: zh_hans
  text: 因为他省察自己所行的事，就从自己所犯的一切过犯中回转[b]；他必定存活，必不死亡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “回转”也可译作“转离”或“悔改”；希伯来文用的是“转回、返回”一词，保留了从罪中转离的形象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶה
  choice: 因为他省察了
  rationale: ראה的字面义是“看见”；在这里指人认识、认真看待自己的行为，译作“省察”较自然。前置的ו结合上下文处理为因果关系“因为”，同时在脚注保留“看见”及连接词的其他可能。
- source_word: וישוב
  choice: 回转离开
  rationale: שׁוב的基本意象是转回、返回；“回转离开”既保留方向逆转的形象，也明确其后介词מִן所表达的“离开”过犯，避免直接以神学术语“悔改”取代原词。
- source_word: מִכָּל פְּשָׁעָיו
  choice: 自己所犯的一切过犯
  rationale: פֶּשַׁע可指过犯或悖逆，带有蓄意违犯的意味；“过犯”庄重而易懂，并保留其道德严重性。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所犯的
  rationale: עָשָׂה本义为“做”；与“过犯”搭配时，现代汉语自然说“犯”，关系结构则以“所犯的”表达。
- source_word: חָיוֹ יִחְיֶה
  choice: 必定存活
  rationale: 不定式绝对形与未完成式同用，加强“活”的语气；“必定存活”自然地传达这一强调。
- source_word: לֹא יָמוּת
  choice: 绝不死亡
  rationale: 否定的未完成式与前句形成鲜明对照；“绝不”也承接原文整体的强调语气。
theological_decisions:
- issue: 本节“存活”与“死亡”的确切范围
  choice: 保留“必定存活，绝不死亡”的直接应许，不限定为某一种生命或死亡
  alternative: 将其明确解释为肉身存亡、盟约审判意义上的生死、属灵生命，或末世性的生死
  rationale: 以西结的论述直接宣告回转者得生而不死，但本节自身没有把所指范围限定为单一系统神学类别；译文应保留这种力度与开放性。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“省察”体现内在认知，“回转离开”保留希伯来文的具体转向意象；后半句以“必定……绝不……”传达原文强烈而对称的宣告。
