source:
  edition: WLC
  text: בַּ/נֶּ֧שֶׁךְ נָתַ֛ן וְ/תַרְבִּ֥ית לָקַ֖ח וָ/חָ֑י לֹ֣א יִֽחְיֶ֗ה אֵ֣ת כָּל הַ/תּוֹעֵב֤וֹת הָ/אֵ֨לֶּה֙ עָשָׂ֔ה מ֣וֹת יוּמָ֔ת דָּמָ֖י/ו בּ֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/013.yaml
  text: He lends at interest and takes profit—and shall he live? He shall not live[a]. He has done all these abominations; he shall surely be put to death[c][b]; his blood shall be upon him.
translation:
  language: zh_hans
  text: 他放债取利，又收取增益——他还能活吗？他必不能活。他行了这一切可憎的事，必被处死[a]；他的血必归到自己身上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必定死亡。”原文是加强语气的死亡判决。
    reason: alternative_reading
  - marker: b
    text: “他的血归到自己身上”是责任用语，意思是他须为自己的死负责。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ נָתַן
  choice: 放债取利
  rationale: נֶשֶׁךְ指从借贷中收取的利息，在律法和先知语境中尤带受谴责的剥削意味。“放债取利”是自然的现代汉语，也保留借贷行为与所得利息的关系。
- source_word: וְתַרְבִּית לָקַח
  choice: 又收取额外收益
  rationale: תַרְבִּית与נֶשֶׁךְ并列，指从贷款取得的增益或收益。译作“额外收益”既与“利”有所区分，也不把两个近义词完全合并。
- source_word: וָחָי לֹא יִחְיֶה
  choice: 他还能活吗？他必不能活
  rationale: 将前半句理解为反问，后半句为强烈否定，保留希伯来语的修辞力度，而不压平为单一陈述。
- source_word: אֵת כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: 这一切可憎的事
  rationale: תּוֹעֵבוֹת指令人憎恶、在道德和盟约层面受谴责的行为。“可憎的事”庄重而为现代读者易懂。
- source_word: מוֹת יוּמָת
  choice: 必被处死
  rationale: 不定词绝对式与被动动词连用，加强死亡判决的确定性；“必被处死”保留被动和司法宣判色彩。
- source_word: דָּמָיו בּוֹ יִהְיֶה
  choice: 他的血必归到自己身上
  rationale: 尽量保留“血在他身上”的希伯来语责任习语，同时用“归到自己身上”清楚表达其死亡责任由自己承担。
theological_decisions:
- issue: 先知性法律措辞中死亡判决的性质
  choice: 译作“必被处死”，保留被动、司法性的宣判语气，但不说明由人还是由上帝执行。
  alternative: “必定死亡”
  rationale: 原文被动形式较支持死亡判决的含义，但本节没有交代执行机制；译文不额外引入具体刑罚程序。
- issue: “他的血在他身上”的责任含义
  choice: 正文保留血的习语，并以脚注说明他须为自己的死负责。
  alternative: 正文直接译作“他要为自己的死负责”
  rationale: 保留原文鲜明的血之意象和法律—先知语体，同时借脚注帮助现代读者理解。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“放债取利”与“额外收益”保留两个借贷获利词的并列；破折号和反问句再现原文由罪行转入判决的强烈语势。
