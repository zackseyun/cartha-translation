  text: וְ/אִישׁ֙ לֹ֣א הוֹנָ֔ה חֲבֹל֙ לֹ֣א חָבָ֔ל וּ/גְזֵלָ֖ה לֹ֣א גָזָ֑ל לַחְמ/וֹ֙ לְ/רָעֵ֣ב נָתָ֔ן וְ/עֵר֖וֹם כִּסָּה בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/016.yaml
  text: He has not oppressed anyone[a], has not taken a pledge, and has not robbed[b]; he has given his bread to the hungry and covered the naked with a garment.
translation:
  language: zh_hans
  text: 不欺压任何人，不收取抵押物，也不抢夺财物；把自己的食物给饥饿的人，用衣服遮盖赤身的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ לֹא הוֹנָה
  choice: 不欺压任何人
  rationale: אִישׁ在否定句中泛指任何人；הוֹנָה表示欺压、亏负或虐待。译作“不欺压任何人”自然地传达社会伦理语境。
- source_word: חֲבֹל לֹא חָבָל
  choice: 不扣留抵押物
  rationale: 同源名词与动词连用，指收取或扣住债务人的抵押物。这里沿用本章第7节的法律经济语境，译作“不扣留抵押物”，既清楚又避免把行为本身过度解释为必然不法。
- source_word: גְזֵלָה לֹא גָזָל
  choice: 不抢夺别人的财物
  rationale: 同源宾语与动词加强“抢夺、劫取”之意；补出“别人的财物”是汉语表达所需，并未增加新的所指。
- source_word: לַחְמוֹ
  choice: 自己的食物
  rationale: לֶחֶם字面是“饼、食物”，并带第三人称单数所属词尾。现代汉语中“自己的食物”既保留所属关系，也自然表达以自身口粮周济饥饿者。
- source_word: לְרָעֵב
  choice: 给饥饿的人
  rationale: 形容词作名词使用，指饥饿者；译为“饥饿的人”清楚、自然。
- source_word: וְעֵרוֹם כִּסָּה בָגֶד
  choice: 又拿衣服给赤身的人穿
  rationale: 原文具体表达以衣物遮盖赤身者。汉语若直译“用衣服遮盖赤身的人”略显生硬，故以自然等值表达呈现同一行动和具体物件。
