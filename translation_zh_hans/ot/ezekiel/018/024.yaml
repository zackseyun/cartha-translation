  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְקָת/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל כְּ/כֹ֨ל הַ/תּוֹעֵב֜וֹת אֲשֶׁר עָשָׂ֧ה הָ/רָשָׁ֛ע יַעֲשֶׂ֖ה וָ/חָ֑י כָּל צדקת/ו אֲשֶׁר עָשָׂה֙ לֹ֣א תִזָּכַ֔רְנָה בְּ/מַעֲל֧/וֹ אֲשֶׁר מָעַ֛ל וּ/בְ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א בָּ֥/ם יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/024.yaml
  text: But when a righteous man turns away from his righteousness and does injustice[a], doing all the abominations that the wicked man does, shall he live? None of the righteous deeds that he has done will be remembered. In the treachery by which he has acted treacherously[c][b], and in the sin that he has committed—in them he shall die.
translation:
  language: zh_hans
  text: 但义人若转离自己的义，行不义，照恶人所行的一切可憎之事去行[a]，他还能存活吗？他从前所行的一切义事都不会被记念。他必在自己所行的背信之事[b]和所犯的罪中死去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “可憎之事”也可译作“可厌恶的行为”。
    reason: lexical_alternative
  - marker: b
    text: “背信”也可译作“不忠”或“干犯”。希伯来文用同根的名词和动词连用，强调对信义的背弃。
    reason: lexical_alternative
  - marker: c
    text: 直译：“他必在这些事中死去。”“这些事”指前面所说的背信和罪。
    reason: literal_rendering
lexical_decisions:
- source_word: וּבְשׁוּב
  choice: 但……若转离
  rationale: 该结构引出带条件意味的时间情形；上下文有转折，故用“但”。שׁוּב与מִן连用表示离开原有状态，“转离”准确表达这一方向。
- source_word: צַדִּיק / מִצִּדְקָתוֹ
  choice: 义人 / 自己的义
  rationale: 保留两个同根概念之间的词汇联系，也维持义人与恶人的鲜明对比；“自己的”自然表达阳性单数后缀而不显累赘。
- source_word: וְעָשָׂה עָוֶל
  choice: 行不义
  rationale: עָוֶל指不义、邪恶或不公；“行不义”简洁庄重，并保留“做、行”这一主动含义。
- source_word: כְּכֹל הַתּוֹעֵבוֹת
  choice: 照……一切可憎之事去行
  rationale: תּוֹעֵבוֹת是以西结书中分量很重的道德—盟约用语。“可憎之事”既自然又保留其强烈贬义；כְּ按比较、仿效关系译作“照”。
- source_word: יַעֲשֶׂה וָחָי
  choice: 去行，他还能存活吗？
  rationale: 保留原文先述行动、继而提出生死反问的结构。“还能”使中文反问自然，但不削弱其明确的否定预期。
- source_word: כָּל צִדְקֹתָו ... לֹא תִזָּכַרְנָה
  choice: 他从前所行的一切义事都不会被记念
  rationale: “义事”承接“义人、义”，复数概括其过往的正义行为；“从前”明确这些行为先于转离发生。“被记念”贴近זכר的被动式，同时保留审判语境中的含义。
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: 在自己所行的背信之事中
  rationale: מעל表示违背信义、背信，而不只是一般犯罪。“所行的背信之事”以自然中文表达同根名词—动词结构的加强作用。
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 和所犯的罪中
  rationale: 中文以“犯……罪”自然表达希伯来语同根宾语结构，既保留个人责任，又避免生硬重复。
- source_word: בָּם יָמוּת
  choice: 死去
  rationale: בָּם回指刚提到的背信与罪；正文已用“在……和……中”承载该介词关系，末尾以“死去”完整呈现判决。
theological_decisions:
- issue: 本节是否应被译成义人失去累积功德，或被限定为某种后期教义命题
  choice: 直陈义人转离正道、持续行恶时，先前的义事不被记念，并因背信和罪而死。
  alternative: 将经文解释为功德被没收，或反过来淡化为仅有今世社会后果。
  rationale: 以西结书18章强调人在上帝面前的个人道德责任。译文保留经文本身关于转离、记念与死亡的张力，不把它预先纳入有关功德、永恒保障或坚忍的后期体系。
- issue: “死”应否在正文中明确限定为肉身死亡或永恒定罪
  choice: 保留未加限定的“死去”。
  alternative: 明确译为“肉身死亡”或“永远灭亡”。
  rationale: 原文只说“他必死”，本节本身没有明说死亡的范围；不应在翻译中消除这种真实的语义与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“义人、义事、行不义、背信、记念”等用语保留先知审判话语的力度和关键词联系；句式避免古奥，却维持原文反问及最终判词的节奏。
