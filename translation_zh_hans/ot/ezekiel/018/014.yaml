base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/014.yaml
  text: But behold[a], he fathers a son, and he sees all the sins that his father has done; he sees them[b], and he does not do likewise.
translation:
  language: zh_hans
  text: 但看哪，他生了一个儿子；这儿子看见父亲所犯的一切罪，看见了[b]，却不照样去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 希伯来文重复“看见”以加强语气：“看见……看见了，却不照样去做。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 但看哪
  rationale: 既体现与前一案例的转折，又保留 הִנֵּה 引出鲜明新情形的指示和强调作用。
- source_word: הוֹלִיד בֵּן
  choice: 他生了一个儿子
  rationale: 准确表达 ילד 的使役生育义；现代汉语中比“生出一个儿子”更自然，也无需使用较生僻的“生养”。
- source_word: וַיַּרְא אֶת כָּל חַטֹּאת אָבִיו אֲשֶׁר עָשָׂה
  choice: 这儿子看见父亲所犯的一切罪
  rationale: “这儿子”使主语转换在汉语中清楚；“所犯的一切罪”自然地把 חַטֹּאת 与 אֲשֶׁר עָשָׂה 连在一起，并保留具体行为的含义。
- source_word: וַיִּרְאֶה
  choice: 看见了
  rationale: 保留原文对 ראה 的重复和强调，不将其解释性地改译为“省察”或“引以为戒”。
- source_word: וְלֹא יַעֲשֶׂה כָּהֵן
  choice: 却不照样去做
  rationale: “照样”保留 כָּהֵן 的比较回指，指向父亲所犯的罪；“却”清楚表达观察之后没有仿效的反差。
theological_decisions:
- issue: 例证中的个人道德责任
  choice: 儿子看见父亲的罪，却不仿效父亲的行为。
  alternative: 儿子虽行为不同，仍承受父亲的罪责。
  rationale: 本节明确对比父亲的犯罪与儿子不照样行；译文只呈现这项文本对比，不额外引入有关遗传罪责或其他体系性教义的结论。
- issue: 重复“看见”的含义
  choice: 保留重复，不进一步界定为道德省察或悔悟。
  alternative: 将第二个“看见”解释为“仔细思想”或“引以为戒”。
  rationale: 两个 ראה 形式形成强调，但本节没有用不同词语明确说明内在心理过程；直译重复可保留原文张力与开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“但看哪”保留先知论述中的鲜明引介；分号帮助读者辨明父亲生子与儿子作出不同选择这两个层次。正文仅使用脚注标记[b]，因“生了一个儿子”在现代汉语中已直接表达原文，无需另设词汇替代脚注。
