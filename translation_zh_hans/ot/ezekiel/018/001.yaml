  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 该叙事形式在这里引出新的先知启示；与“耶和华的话”合译为“临到”，既符合希伯来语句法功能，也符合现代汉语先知文体。
- source_word: דְבַר
  choice: 话
  rationale: 在固定表达“耶和华的话”中，指来自上帝的特定启示；“话”比“信息”更贴近原词，也保留先知书反复出现的公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，避免改为泛称或头衔。
- source_word: אֵלַי
  choice: 我
  rationale: 在汉语固定搭配“临到我”中自然、准确地表达介词及第一人称后缀所指的方向。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后直接引语；汉语以“说：”自然清楚地标示下文内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。译作“耶和华”保留其专名性质，并采用现代简体中文圣经传统中最广为人知的形式；“雅威”是依据学界常见拟音的可行替代。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留先知书启示公式的简洁节奏。句末用冒号承接下一节的直接引语。
