source:
  edition: WLC
  text: בַּ/נֶּ֣שֶׁךְ לֹֽא יִתֵּ֗ן וְ/תַרְבִּית֙ לֹ֣א יִקָּ֔ח מֵ/עָ֖וֶל יָשִׁ֣יב יָד֑/וֹ מִשְׁפַּ֤ט אֱמֶת֙ יַֽעֲשֶׂ֔ה בֵּ֥ין אִ֖ישׁ לְ/אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/008.yaml
  text: He does not lend at interest or take profit[a]; he keeps his hand back from injustice[c][b]; he executes true justice between one man and another.
translation:
  language: zh_hans
  text: 他不放贷收息，也不收取增益[a]；他使手离开不义[b]；他在人与人之间施行真实的审判[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不收取收益。”这里两个词都指与借贷有关的所得，意义相近。
    reason: lexical_alternative
  - marker: b
    text: 直译：“使他的手从不义转回。”意思是不参与不义之事。
    reason: lexical_alternative
  - marker: c
    text: “在人与人之间”是法律用语，指在争讼双方之间作出裁断。
    reason: cultural_note
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ לֹא יִתֵּן
  choice: 不放贷取利
  rationale: יִתֵּן字面为“给”，与נֶשֶׁךְ连用时指以收取利息为条件放贷。“放贷取利”在现代汉语中自然，并保留该经济法律语境及其可能含有的剥削意味。
- source_word: וְתַרְבִּית לֹא יִקָּח
  choice: 也不收取额外收益
  rationale: תַרְבִּית与נֶשֶׁךְ意义相近，指贷款所产生或索取的增益。译作“额外收益”既与前面的“取利”有所区别，也不把两词强行界定为严格不同的技术术语。
- source_word: מֵעָוֶל
  choice: 远离不义
  rationale: עָוֶל在此指社会和司法层面的不公、恶行或不义；“不义”简洁庄重，涵盖范围也比单纯的“不公平”更广。
- source_word: יָשִׁיב יָדוֹ
  choice: 使自己的手远离
  rationale: 原文意象是“使他的手转离”，表示不参与不义之事。译文保留“手”的隐喻，同时用现代汉语可理解的表达呈现。
- source_word: מִשְׁפַּט אֱמֶת
  choice: 真实的审判
  rationale: 该词组兼有司法裁断与真实、公正可靠之意。“真实的审判”较贴近词形组合，也保留“真确”与“公正”之间的语义张力。
- source_word: בֵּין אִישׁ לְאִישׁ
  choice: 在人与人之间
  rationale: 字面为“在一人与一人之间”，是法律惯用语，指在争讼双方之间作判断。汉语“人与人之间”自然地保留了这一双方关系。
theological_decisions:
- issue: נֶשֶׁךְ与תַרְבִּית这两个借贷收益词的关系
  choice: 分别译为“取利”和“额外收益”
  alternative: 两者都译作“利息”，或译作“高利”和“增益”
  rationale: 原文并列两个意义相关的词，却未明确给出严格技术区分。采用相近而不完全相同的汉语表达，可保留其并列和语义重叠，且不预先判定这里仅谴责过高利率还是一切有息借贷。
- issue: מִשְׁפַּט אֱמֶת的性质
  choice: 真实的审判
  alternative: 公正的审判；诚实的裁决
  rationale: אֱמֶת可表达真实、可靠、忠实，放在司法语境中自然含有公正意味。译作“真实的审判”避免只保留其中一个层面。
- issue: בֵּין אִישׁ לְאִישׁ中的阳性法律惯用语
  choice: 在人与人之间
  alternative: 在一个男人与另一个男人之间；在双方之间
  rationale: 这里的אִישׁ用于代表诉讼中的个体双方，并非强调男性身份。现代汉语“人”本身不标性别，既忠于法律惯用语的普遍指向，也不额外添加性别限定。
translation_notes:
  register: 采用现代、庄重而易懂的法律伦理语体。句式保留原文三个并列行为，并适度保留“手”和“真实的审判”等原文意象与张力。
