source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם מַדֻּ֛עַ לֹא נָשָׂ֥א הַ/בֵּ֖ן בַּ/עֲוֺ֣ן הָ/אָ֑ב וְ/הַ/בֵּ֞ן מִשְׁפָּ֧ט וּ/צְדָקָ֣ה עָשָׂ֗ה אֵ֣ת כָּל חֻקּוֹתַ֥/י שָׁמַ֛ר וַ/יַּעֲשֶׂ֥ה אֹתָ֖/ם חָיֹ֥ה יִחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/019.yaml
  text: Yet you say[a], ‘Why does the son not bear the iniquity of the father?’ Because the son has done justice and righteousness, has kept all my statutes, and has done them; he shall surely live.
translation:
  language: zh_hans
  text: 可是你们说：“儿子为什么不担当父亲的罪孽[a]呢？”因为这儿子秉公行义，谨守我一切的律例，并且一一遵行，他必定存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “担当父亲的罪孽”也可理解为“承担父亲的罪责”或“承受父亲犯罪所带来的惩罚”。希伯来语“担当罪孽”可同时涉及罪责及其后果。
    reason: 保留希伯来语习语的词义宽度，避免把经文限定为只谈罪责或只谈惩罚。
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: 可是你们说
  rationale: 连接词在上下文中引出百姓对前述原则的异议；“可是”自然表达转折语气，复数“你们”保留第二人称复数。
- source_word: לֹא נָשָׂא ... בַּעֲוֺן הָאָב
  choice: 不担当父亲的罪孽
  rationale: “担当罪孽”保留נשא עון这一希伯来语习语，使“罪责”与“罪所带来的后果”两层含义仍保持开放。
- source_word: מִשְׁפָּט וּצְדָקָה עָשָׂה
  choice: 秉公行义
  rationale: 这是自然、庄重而凝练的现代汉语表达，保留“公正”与“正义”的并列观念，并强调实际践行。
- source_word: אֵת כָּל חֻקּוֹתַי שָׁמַר וַיַּעֲשֶׂה אֹתָם
  choice: 谨守我一切的律例，并且遵行
  rationale: “律例”保留盟约和法律语境；“谨守……并且遵行”体现原文“守”与“行”的重复和实际顺服的重点。
- source_word: חָיֹה יִחְיֶה
  choice: 他必定存活
  rationale: 以“必定”表达不定式绝对形与未完成式连用所产生的强烈肯定语气；“存活”也与本章生死主题相称。
theological_decisions:
- issue: “担当父亲的罪孽”的范围
  choice: 保留“担当罪孽”这一表达，不限定为单指承受罪责或单指承受刑罚。
  alternative: 译作“承担父亲的罪责”或“承受父亲犯罪的惩罚”。
  rationale: עון可指罪孽、罪责，也可涵盖罪的后果。本节强调个人责任，但原文没有把该习语收窄为某一种系统神学表述。
- issue: 后半句与问句的逻辑关系
  choice: 用“因为”明确后半句是对问句的回答。
  alternative: 用“而”保留更接近原文的并列结构。
  rationale: 希伯来语以连接词串联问答，语境显示儿子之所以不担当父亲的罪孽，是因他自己秉公行义；“因为”在现代汉语中清楚呈现这一解释关系，同时不改变责任按本人行为判定的论旨。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“秉公行义”“律例”“存活”保留先知书法律与伦理语境的庄严感；句式清楚呈现异议、理由与结论。
