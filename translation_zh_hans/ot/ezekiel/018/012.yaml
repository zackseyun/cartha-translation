id: EZK.18.12
reference: Ezekiel 18:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנָ֔ה גְּזֵל֣וֹת גָּזָ֔ל חֲבֹ֖ל לֹ֣א יָשִׁ֑יב וְ/אֶל הַ/גִּלּוּלִים֙ נָשָׂ֣א עֵינָ֔י/ו תּוֹעֵבָ֖ה עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/012.yaml
  text: He has oppressed the poor and needy[a], committed robbery, not returned a pledge, lifted up his eyes to the idols, and done an abomination.
translation:
  language: zh_hans
  text: 他欺压贫苦穷乏的人，抢夺财物，不归还抵押物；他举目仰望偶像[a]，做了可憎的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来词带有明显的蔑视意味，也可理解为“污秽的偶像”。
    reason: 说明原词 גִּלּוּלִים 在通用译词“偶像”之外所含的贬义色彩。
lexical_decisions:
- source_word: עָנִי וְאֶבְיוֹן
  choice: 贫苦穷乏的人
  rationale: 这对近义词共同指社会中贫困、困苦而缺乏保障的人；译文保留双重表达，同时符合现代汉语习惯。
- source_word: הוֹנָה
  choice: 欺压
  rationale: 该动词在此指对弱势者的压迫、剥削或亏待；“欺压”简洁地体现社会和经济层面的恶待。
- source_word: גְּזֵלוֹת גָּזָל
  choice: 抢夺财物
  rationale: 原文以同根名词和动词相连，加强非法夺取的语气；“抢夺财物”既自然，也保留具体而强烈的行动意味。
- source_word: חֲבֹל לֹא יָשִׁיב
  choice: 不归还抵押物
  rationale: חֲבֹל 指为债务收取的抵押品；“抵押物”比单说“当头”更适合现代普通读者，“归还”准确表达应当返还却未返还。
- source_word: וְאֶל הַגִּלּוּלִים נָשָׂא עֵינָיו
  choice: 他举目仰望偶像
  rationale: 保留“举目”的希伯来意象；“仰望”在现代汉语中可表达带有倚赖或敬奉意味的注视，又不直接把隐喻解释成“敬拜”。
- source_word: הַגִּלּוּלִים
  choice: 偶像
  rationale: 正文采用清楚通行的“偶像”；原词特有的蔑称色彩放入脚注说明，以免正文译得生硬。
- source_word: תּוֹעֵבָה עָשָׂה
  choice: 做了可憎的事
  rationale: תּוֹעֵבָה 指在上帝面前道德或礼仪上令人憎恶之事；此译法庄重自然，并保留其强烈的负面评价。
theological_decisions:
- issue: 举目望向偶像这一习语的宗教含义
  choice: 举目仰望偶像
  alternative: 敬拜偶像；望向偶像
  rationale: 上下文表明这不只是随意观看，而含有敬奉或倚赖偶像之意；但原文仍以“举目”的形象表达，因此不直接改译为“敬拜”，以保留原文意象及其含义张力。
- issue: תּוֹעֵבָה 的道德与礼仪力度
  choice: 做了可憎的事
  alternative: 行了可憎之事；犯了令人厌恶的罪
  rationale: “可憎的事”保留原文对行为的强烈定性，又不把其范围限定为某一种罪或仅作主观厌恶来理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。分号区分对邻舍的恶行与拜偶像及可憎行为；句式保持列举节奏。正文脚注标记[a]与脚注一致。
