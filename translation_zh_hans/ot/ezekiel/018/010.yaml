  text: וְ/הוֹלִ֥יד בֵּן פָּרִ֖יץ שֹׁפֵ֣ךְ דָּ֑ם וְ/עָ֣שָׂה אָ֔ח מֵ/אַחַ֖ד מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/010.yaml
  text: But if he fathers a violent son[a], one who sheds blood and does any one of these things,
translation:
  language: zh_hans
  text: 但若他生了一个强暴的儿子，一个流人血的人，并且向弟兄行了这些事中的任何一件[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处句法紧凑，直译可作：“又生了一个强暴的儿子，一个流人血的人，并向弟兄行了这些事中的一件。”句首连接词也可译为“又”；“弟兄”可泛指同胞或同类之人。
    reason: 保留句首连接词的另一种处理，并说明末尾困难短语中“弟兄”的明示成分及其可能的泛称用法。
lexical_decisions:
- source_word: וְהוֹלִיד
  choice: 但他若生了
  rationale: הוליד是使役形，意为“生、使出生”，主语为父亲时可表达“生了儿子”。前缀וְ本身通常是“并且”，但上下文转入与前述义人相反的后代情形，因此用“但……若”自然呈现语篇中的转折和条件关系。
- source_word: בֵּן
  choice: 一个……儿子
  rationale: בֵּן明确指“儿子”，保留希伯来文的阳性单数所指。
- source_word: פָּרִיץ
  choice: 凶暴的
  rationale: פָּרִיץ可指强暴、残暴或横行不法的人；“凶暴的”既自然，又与下文“流人血”紧密衔接。
- source_word: שֹׁפֵךְ דָּם
  choice: 是流人血的
  rationale: 该分词短语直指“流血的人”。译作“流人血的”保留原文习语，也避免直接收窄为现代法律意义上的“杀人犯”。
- source_word: וְעָשָׂה
  choice: 并且做了
  rationale: עָשָׂה是常用动词“做、行”；这里以“做了”直接承接后面的行为对象。
- source_word: אָח מֵאַחַד מֵאֵלֶּה
  choice: 这些事中的任何一件
  rationale: 此处אָח的文本和句法较为困难；结合מֵאַחַד מֵאֵלֶּה及上下文，通常理解为“这些事中的一件/任何一件”。正文采用自然中文表达，脚注保留较形式对应的可能译法。
theological_decisions:
- issue: 句首连接词的条件与转折功能
  choice: 但他若生了
  alternative: 他又生了
  rationale: 希伯来文表层只有连接词וְ，但上下文从义父转到凶暴之子，语篇关系兼具转折和假设。译作“但……若”使现代读者清楚把握论述结构，不增添教义判断。
- issue: “流血”是否明确译为“杀人”
  choice: 流人血
  alternative: 杀人
  rationale: 保留שֹׁפֵךְ דָּם的原有意象与语义宽度，不将其预先限定为某一种法律分类，同时上下文中的致命暴力含义仍然清楚。
- issue: 末尾困难短语的范围
  choice: 这些事中的任何一件
  alternative: 这些事中的一件
  rationale: 该短语表明所列恶行中的一项即可纳入论述。“任何一件”突出不必尽犯全部罪行，但不把“任何”理解为任意无关行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凶暴”比“暴力的”更适合直接修饰人；“流人血”保留圣经原文的具体意象。句末逗号反映本节句法延续到下一节。
