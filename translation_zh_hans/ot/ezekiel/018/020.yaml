source:
  edition: WLC
  text: הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֣יא תָמ֑וּת בֵּ֞ן לֹא יִשָּׂ֣א בַּ/עֲוֺ֣ן הָ/אָ֗ב וְ/אָב֙ לֹ֤א יִשָּׂא֙ בַּ/עֲוֺ֣ן הַ/בֵּ֔ן צִדְקַ֤ת הַ/צַּדִּיק֙ עָלָ֣י/ו תִּֽהְיֶ֔ה וְ/רִשְׁעַ֥ת רשע עָלָ֥י/ו תִּֽהְיֶֽה־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/020.yaml
  text: The person who sins—he shall die[a]. A son shall not bear the iniquity of the father, and a father shall not bear the iniquity of the son. The righteousness of the righteous shall be upon him[b], and the wickedness of the wicked shall be upon him.
translation:
  language: zh_hans
  text: 犯罪的人，他必死亡[a]。儿子不担当父亲的罪孽，父亲也不担当儿子的罪孽。义人的义必归自己[b]，恶人的恶也必归自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译可作：“犯罪的生命（或灵魂），它必死亡。”这里“生命／灵魂”（希伯来语 nephesh）指一个具体的人。
    reason: lexical_alternative
  - marker: b
    text: “必归自己”直译为“必在他身上”，表示义与恶各归本人；原文没有进一步说明这是指品格、罪责还是相应后果。
    reason: ambiguity_note
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: 人
  rationale: נֶפֶשׁ 在此法律—伦理语境中指具体的个人，而非专指与身体分离的“灵魂”；译作“人”自然且避免引入后期人论含义。
- source_word: הַחֹטֵאת
  choice: 犯罪的
  rationale: 分词表示实施犯罪的那个人，具有概括性；“犯罪的人”符合现代汉语表达。
- source_word: הִיא תָמוּת
  choice: 他必死亡
  rationale: הִיא 的阴性是与 נֶפֶשׁ 的语法一致；汉语按所指的代表性个人用“他”。“必死亡”保留宣告和司法性的确定语气。
- source_word: יִשָּׂא בַּעֲוֺן
  choice: 担当……的罪孽
  rationale: 该希伯来法律习语涵盖罪责及其后果；“担当罪孽”既保留原文意象，也保持其语义宽度。
- source_word: צִדְקַת הַצַּדִּיק
  choice: 义人的义
  rationale: 保留同根词形成的修辞关系，并与下文“恶人的恶”构成平行。
- source_word: עָלָיו תִּהְיֶה
  choice: 归在他自己身上
  rationale: “归在……身上”保留 עַל 的意象；增添“自己”清楚表达本节反复强调的个人归属，又不改变指称。
- source_word: וְרִשְׁעַת רשע
  choice: 恶人的恶
  rationale: 马所拉旁注所读形式为 רָשָׁע；译文保留名词与形容词同根的结构，并与“义人的义”对称。
theological_decisions:
- issue: נֶפֶשׁ 的人论含义
  choice: 译作“人”
  alternative: 译作“灵魂”
  rationale: 本节讨论个人的道德责任，并非界定灵魂与身体的关系；“人”更准确传达此处所指，同时避免不必要的形而上学限定。
- issue: 父子是否彼此承担罪孽
  choice: 保留“担当罪孽”的宽泛法律表述
  alternative: 译成“因……受罚”或“承担……的罪责”
  rationale: עָוֹן 可兼指罪行、罪责及其后果；不将其缩窄为单纯刑罚或主观罪责，以保存原文的神学张力。
- issue: 义与恶“在他身上”的含义
  choice: 译作“归在他自己身上”
  alternative: 译作“由他自己承受”或“算为他的”
  rationale: 原文没有明确限定为归算、报偿或内在品格；较直译的表达保留这些可能层面，不替文本作进一步教义判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“罪孽”“担当”保留先知性法律宣告的力度；“归在他自己身上”清楚呈现平行结构和个人责任。所有脚注标记均已置于正文。
