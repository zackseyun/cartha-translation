  text: וְ/אִישׁ֙ לֹ֣א יוֹנֶ֔ה חֲבֹלָת֥/וֹ חוֹב֙ יָשִׁ֔יב גְּזֵלָ֖ה לֹ֣א יִגְזֹ֑ל לַחְמ/וֹ֙ לְ/רָעֵ֣ב יִתֵּ֔ן וְ/עֵירֹ֖ם יְכַסֶּה בָּֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/007.yaml
  text: He does not oppress anyone[a], but restores the debtor’s pledge; he does not commit robbery[c][b]; he gives his bread to the hungry and covers the naked with a garment.
translation:
  language: zh_hans
  text: 他不欺压任何人，归还欠债人的抵押物[a]；他不行抢夺；他把自己的食物[b]给饥饿的人，用衣服遮盖赤身的人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“归还为债务所收取的担保物”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“自己的饼”；这里指自己的食物。
    reason: lexical_alternative
  - marker: c
    text: “赤身”也可指衣不蔽体；整句也可译作“给没有衣服的人穿上衣服”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנֶה
  choice: 欺压
  rationale: 该词的使役词干在这里表示以不公正的方式压迫或剥削别人；“欺压”准确、自然，也符合本段社会伦理语境。
- source_word: אִישׁ
  choice: 任何人
  rationale: 虽然原文是阳性单数名词，但在这条伦理陈述中泛指别人；“任何人”自然传达其普遍范围。
- source_word: חֲבֹלָתוֹ חוֹב יָשִׁיב
  choice: 把欠债人的抵押物归还
  rationale: 该短语指归还为债务所收取的担保物；译文明确债务关系，同时保留“抵押物”的具体含义。
- source_word: גְּזֵלָה לֹא יִגְזֹל
  choice: 不抢夺财物
  rationale: 原文采用同根名词和动词，强调掠夺、强取之举；“抢夺财物”比笼统的“偷窃”更能体现其强取性质。
- source_word: לַחְמוֹ
  choice: 自己的食物
  rationale: 原文直译为“他的饼（食物）”；此处“饼”可泛指维生的食物，正文用“食物”更符合现代汉语，并以脚注保留原文意象。
- source_word: לְרָעֵב
  choice: 给饥饿的人
  rationale: 形容词在原文中名词化，指处于饥饿中的人；此译自然清楚。
- source_word: עֵירֹם
  choice: 赤身的人
  rationale: 该词指没有衣服或衣不蔽体的人；“赤身的人”保留原文直接表达，但不排除衣着严重不足的含义。
- source_word: יְכַסֶּה בָּגֶד
  choice: 用衣服给……遮体
  rationale: 原文使用“遮盖”和“衣服”两个词；此译既保留其具体图像，又符合现代汉语表达。
theological_decisions:
- issue: 义人的阳性单数伦理主体
  choice: 以“他”承接上下文，以“任何人”表达受事者的泛指意义
  alternative: 译作“这样的人不欺压别人”
  rationale: 本节继续以阳性单数描写义人。“他”保留原文叙述形式，而“任何人”准确表达 אִישׁ 在宾语位置上的普遍意义，不把这项伦理要求限于男性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保留原文连续的伦理行为清单；对“饼”采用意义清楚的“食物”，并以脚注保存原文意象；对抵押物和赤身状态的语义范围不作过度限定。
