  text: בְּ/חֻקּוֹתַ֧/י יְהַלֵּ֛ךְ וּ/מִשְׁפָּטַ֥/י שָׁמַ֖ר לַ/עֲשׂ֣וֹת אֱמֶ֑ת צַדִּ֥יק הוּא֙ חָיֹ֣ה יִֽחְיֶ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/009.yaml
  text: He walks in my statutes and keeps my judgments[a], acting faithfully; he is righteous; he shall surely live, declares the Lord GOD.
translation:
  language: zh_hans
  text: 他遵行我的律例，谨守我的典章，行事忠信[a]。这人是义人，必定存活。这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“行（做）真实”；也可译作“按真实行事”。这里的“真实”也含有忠实、可靠之意。
    reason: 保留לַעֲשׂוֹת אֱמֶת在“真实”与“忠信”之间的词义幅度，并说明直译措辞的性质。
lexical_decisions:
- source_word: בְּחֻקּוֹתַי יְהַלֵּךְ
  choice: 遵行我的律例
  rationale: “行走于我的律例中”是希伯来语关于生活方式的比喻；译作“遵行”在现代汉语中自然，并保留按上帝所定律例生活的含义。
- source_word: וּמִשְׁפָּטַי שָׁמַר
  choice: 谨守我的典章
  rationale: שׁמר在律法语境中指遵守、持守；מִשְׁפָּטִים带有司法裁定和规范之意，“典章”既庄重又能与“律例”相配。
- source_word: לַעֲשׂוֹת אֱמֶת
  choice: 行事忠信
  rationale: אֱמֶת在此可表达真实、可靠、忠信；“行事忠信”传达伦理实践层面的诚实与信实，同时以脚注保留较直译的表达。
- source_word: צַדִּיק הוּא
  choice: 这人是义人
  rationale: צַדִּיק在本段具有法律和伦理层面的“正直、合乎正义”之意；“义人”保留其重要的圣经用语色彩。
- source_word: חָיֹה יִחְיֶה
  choice: 必定存活
  rationale: 不定式绝对形与未完成式连用，强烈肯定“活”；“必定”体现强调，“存活”不擅自限定为今生或永生。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם标明庄严的神谕；אֲדֹנָי יְהוִה译为汉语圣经语体中清楚而庄重的“主耶和华”。
theological_decisions:
- issue: חָיֹה יִחְיֶה所应许之“活”的范围
  choice: 必定存活
  alternative: 必得永生
  rationale: 本节处于以西结关于个人责任与死亡后果的论述中；原文没有在此明确限定为永生，因此不引入超出上下文的后期神学界定。
- issue: אֱמֶת在伦理行为中的含义
  choice: 行事忠信
  alternative: 实行真理
  rationale: 此词既可指真实，也可指可靠、忠信；语境描述人的具体行为，“行事忠信”较自然，但脚注保留原文“行真实”的张力。
- issue: 神名אֲדֹנָי יְהוִה的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: 采用现代汉语读者熟悉的传统专名“耶和华”，同时以“主”对应אֲדֹנָי，不将神名泛化为普通称谓。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“遵行、律例、典章、义人、宣告”等词保留经文的律法与神谕语域；句式简洁，适合普通读者朗读。
