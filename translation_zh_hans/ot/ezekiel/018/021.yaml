source:
  edition: WLC
  text: וְ/הָ/רָשָׁ֗ע כִּ֤י יָשׁוּב֙ מִ/כָּל חטאת/ו אֲשֶׁ֣ר עָשָׂ֔ה וְ/שָׁמַר֙ אֶת כָּל חֻקּוֹתַ֔/י וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָ֑ה חָיֹ֥ה יִחְיֶ֖ה לֹ֥א יָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/021.yaml
  text: But if the wicked man turns back from all his sins that he has committed[a], and keeps all my statutes, and does justice and righteousness, he shall surely live; he shall not die.
translation:
  language: zh_hans
  text: 但恶人若从他所犯的一切罪中回转，遵守我的一切律例，施行公正和公义，他必定存活，不至死亡。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרָשָׁע
  choice: 恶人
  rationale: 希伯来语是阳性单数、作名词使用；汉语“恶人”自然地指一个作恶者，不必另加“男人”，也不抹去其个体指向。
- source_word: כִּי
  choice: 若
  rationale: 这里引出条件情形；与句首连接词合译为“但……若”，符合先知性论述的转折和条件关系。
- source_word: יָשׁוּב מִכָּל חטאתו
  choice: 回转，离开他所犯的一切罪
  rationale: שׁוּב保留“转回、回转”的具体意象；מן说明离开罪。拆为“回转，离开……”既自然，又避免仅用神学术语“悔改”缩窄原词。
- source_word: וְשָׁמַר אֶת כָּל חֻקּוֹתַי
  choice: 遵守我的一切律例
  rationale: שׁמר与律例连用表示遵行、谨守；“遵守”是现代汉语中清楚自然的表达。“律例”保留חֻקּוֹת的盟约法律色彩。
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: 施行公平和公义
  rationale: 保留מִשְׁפָּט与צְדָקָה两个并列且有分量的伦理词；“施行”比直译“做”更合乎汉语搭配。
- source_word: חָיֹה יִחְיֶה
  choice: 必定存活
  rationale: 不定式绝对形与未完成式连用具有强调作用；“必定”表达确定和加强语气，“存活”仍保留生命含义的开放性。
- source_word: לֹא יָמוּת
  choice: 不至死亡
  rationale: 准确表达否定式，并与前面的“必定存活”形成庄重、清晰的对照。
theological_decisions:
- issue: 是否把שׁוּב直接译为具有明确神学术语色彩的“悔改”
  choice: 回转，离开
  alternative: 悔改
  rationale: 原词基本意象是转回；本节又用מן明确表示离开所犯的罪。正文保留这一具体动作意象，脚注列出“悔改”这一自然的语境译法。
- issue: חָיֹה יִחְיֶה所指的是今世存活、盟约生命，还是末世救恩
  choice: 必定存活
  alternative: 必得永生／必继续活着
  rationale: 原文只强调“活”，没有在本节中限定为纯粹肉身存活或永恒生命；译文保留以西结书生死语言的神学张力，不替原文作体系化界定。
- issue: 是否把מִשְׁפָּט וּצְדָקָה合并为单一概念
  choice: 公平和公义
  alternative: 公平正直的事
  rationale: 原文并列两个相关但不完全相同的伦理名词；分别译出可保存其修辞和神学分量。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“但……若”承接上下文的转折；“律例”“公平和公义”保留先知书的法律与伦理语域。正文不把“存活”限定为仅属肉身或末世意义。
