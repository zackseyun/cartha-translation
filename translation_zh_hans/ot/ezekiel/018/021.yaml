revisions:
- from: 但恶人若回转，离开他所犯的一切罪[a]，遵守我的一切律例，施行公平和公义，他必定存活，不至死亡。
  to: 但恶人若从他所犯的一切罪中回转，遵守我的一切律例，施行公正和公义，他必定存活，不至死亡。
  rationale: 修订仅澄清中文句法和脚注的词义界限：以“从……罪中回转”直接对应原文“回转＋从……罪”，并以“公正和公义”维持两个伦理名词的区分。生命与死亡的含义仍保持原文的开放性，未作教义性限定。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:52:26Z'
review_pass:
  verdict: revise
  source_fidelity: 正文整体准确反映条件句、离罪、遵守神的律例、施行两项伦理要求，以及“必活、不死”的强调与对照。不过“回转，离开”把原文一个动词连同介词宾语展开为两个并列动作，虽意图可理解，却不如直接表达“从……回转”贴合原文句法和意象。
  naturalness: 庄重、现代，整体通顺。“从他所犯的一切罪中回转”比“回转，离开他所犯的一切罪”更连贯，也避免逗号造成两个独立命令/动作的印象。
  terminology: “恶人”“律例”“公义”“存活”均适切。“公正和公义”分别对应מִשְׁפָּט与צְדָקָה，较“公平和公义”更清晰地保留前者的司法/伦理正当含义。脚注应保留“悔改”作语境性译法，但不应以“不再犯”作为原词本身的直接替代。
  issues:
  - severity: low
    issue: “回转，离开”将单一谓语扩展为两个并列动词。
    rationale: יָשׁוּב与介词短语“从他一切罪”共同表达从罪转离；改为“从……罪中回转”既保留回转意象，也避免不必要的动作重复。
  - severity: low
    issue: 脚注中的“悔改，不再犯”超出该动词在本节直接明示的范围。
    rationale: “悔改”可作为语境译法；“不再犯”可由离开罪的实际含义引申，却不是原词的字面替代，宜删除以免脚注将引申当作词义。
  - severity: low
    issue: “公平”与“公义”的并列在现代汉语中语义区分较弱。
    rationale: 以“公正和公义”对应“justice and righteousness”，可保留两个名词的并列，同时使前项更自然地表达מִשְׁפָּט。
  revised_text: 但恶人若从他所犯的一切罪中回转，遵守我的一切律例，施行公正和公义，他必定存活，不至死亡。
  revised_footnotes:
  - marker: a
    text: “回转”也可按语境译作“悔改”。希伯来语动词的本义是“转回、回转”；这里指从罪中转离。
    reason: 说明שׁוּב的字面意象及其语境性译法，不把“悔改”或进一步的行为推论当作唯一或字面的词义。
