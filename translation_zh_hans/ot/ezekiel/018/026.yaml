source:
  edition: WLC
  text: בְּ/שׁוּב צַדִּ֧יק מִ/צִּדְקָת֛/וֹ וְ/עָ֥שָׂה עָ֖וֶל וּ/מֵ֣ת עֲלֵי/הֶ֑ם בְּ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/026.yaml
  text: When a righteous man turns away from his righteousness and does injustice[a], and dies because of them[b], he shall die for the injustice that he has done.
translation:
  language: zh_hans
  text: 义人若离弃自己的义，行不义的事，并因这些事而死[a]，他必因自己所行的不义而死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这些事”指前面所说的不义之事；希伯来文在这里使用复数代词。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: 若离弃
  rationale: ב 加不定词构成从属情形；שוב 与 מן 连用在此表示从原有状态转离。结合本章条件式论述，用“若离弃”自然表达这一情形。
- source_word: צַדִּיק
  choice: 义人
  rationale: 该阳性单数形容词作名词使用，指一个义人；“义人”是简洁、庄重且通行的中文表达，也可代表普遍个案。
- source_word: מִצִּדְקָתוֹ
  choice: 离弃自己的义
  rationale: צדקה 在此指人的正义或正直状态与行为；“自己的义”较直接保留原文名词形式，并与“义人”和后文“不义”形成呼应。
- source_word: וְעָשָׂה עָוֶל
  choice: 行不义的事
  rationale: עָוֶל 可指不义、恶行或不公；“行不义的事”保留“行＋名词”的结构和伦理、司法意味，同时符合现代汉语。
- source_word: וּמֵת עֲלֵיהֶם
  choice: 并因这些事而死
  rationale: עֲלֵיהֶם 带复数后缀，最自然地回指前述不义之事。“这些事”明确保留复数指向；“因……而死”表达此处的因果关系。
- source_word: בְּעַוְלוֹ אֲשֶׁר עָשָׂה יָמוּת
  choice: 他必因自己所行的不义而死
  rationale: ב 在此表原因；关系从句 אֲשֶׁר עָשָׂה 保留为“所行的”。“必……而死”表达未完成式在格言、审判语境中的确定后果，而不过度引入“必须”等额外模态。
theological_decisions:
- issue: 本节是否应被译成对背道或坚忍等后世教义争论作出定论
  choice: 按原文直译为真实的条件性道德警告：义人离弃自己的义、行不义并因此而死，就必因所行的不义而死。
  alternative: 把“义人”弱化为表面上的义人，或在译文中明确断定最终背道等系统神学结论。
  rationale: 希伯来文直接陈述这一条件及后果，却没有处理相关系统神学问题；译文应保留其警告和张力，不替原文解决后世争论。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“义人—自己的义—不义”保留原文的词义对照；用“这些事”呈现复数回指，避免中文“因它们”生硬。
