base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/027.yaml
  text: And when a wicked man turns away from the wickedness that he has done and does justice and righteousness[a], he will preserve his life.
translation:
  language: zh_hans
  text: 恶人若离弃自己所行的恶，秉公行义，他必保全自己的性命。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他必使自己存活”，或“他必保全自己”。希伯来文为“他的 נֶפֶשׁ（nephesh，内费什）”；此词按语境可指“性命”、“自己”或“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּב
  choice: 若离弃……转而
  rationale: 介词 בְּ 加 שוב 的不定式构造表达时间兼条件关系；“若离弃……转而”以自然汉语呈现从恶行回转的含义。
- source_word: רָשָׁע
  choice: 恶人
  rationale: 阳性单数形容词作名词使用，指一个行恶的人；“恶人”简洁并符合本章代表性单数的表达。
- source_word: מֵֽ/רִשְׁעָת/וֹ אֲשֶׁר עָשָׂה
  choice: 自己所行的恶
  rationale: רִשְׁעָה 指邪恶、恶行，后接关系从句“他所行的”；合译为“自己所行的恶”，既自然又明确指其先前行为。
- source_word: וַ/יַּעַשׂ מִשְׁפָּט וּ/צְדָקָה
  choice: 秉公行义
  rationale: מִשְׁפָּט 与 צְדָקָה 构成常见伦理搭配，分别涉及公正与正义；“秉公行义”保留两项概念，并符合庄重的现代汉语。
- source_word: הוּא
  choice: 他
  rationale: 原文显式代词带有一定强调；汉语以“他”承接即可，避免不必要地加重为“他自己”。
- source_word: אֶת נַפְשׁוֹ
  choice: 自己的性命
  rationale: נֶפֶשׁ 在本章生与死的语境中主要指生命或本人；“性命”能避免将其局限理解为与身体分离的“灵魂”。
- source_word: יְחַיֶּה
  choice: 会保全
  rationale: חיה 的 Piel 形在此有使存活、保住生命之意；“保全自己的性命”是自然准确的汉语表达。
theological_decisions:
- issue: 道德审判语境中 נֶפֶשׁ 的含义
  choice: 自己的性命
  alternative: 自己的生命；使自己存活；自己的灵魂
  rationale: 以西结书18章反复对照生与死，因此这里首先指人的生命或本人，而非专指非物质的灵魂；脚注保留原文习语可能具有的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“秉公行义”凝练保留 מִשְׁפָּט וּצְדָקָה 的双重伦理表达；正文以“性命”贴合本章生死语境，并用脚注说明 נֶפֶשׁ 的语义范围。
