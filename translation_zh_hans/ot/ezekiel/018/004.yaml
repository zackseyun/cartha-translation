  text: הֵ֤ן כָּל הַ/נְּפָשׁוֹת֙ לִ֣/י הֵ֔נָּה כְּ/נֶ֧פֶשׁ הָ/אָ֛ב וּ/כְ/נֶ֥פֶשׁ הַ/בֵּ֖ן לִ/י הֵ֑נָּה הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֥יא תָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/004.yaml
  text: Look[a], every life belongs to me. The life of the father is like the life of the son—both belong to me. The person who sins is the one who will die.
translation:
  language: zh_hans
  text: “看哪，一切人的性命都属于我；父亲的性命和儿子的性命，都同样属于我。犯罪的人必死亡。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”和“人”所译的希伯来语 נֶפֶשׁ，也可指“灵魂”“生命”或“本人”。本节末句也可译作：“犯罪的灵魂必死亡。”
    reason: 保留 נֶפֶשׁ 的词义范围及传统直译，同时避免正文把它限定为专指非物质的灵魂。
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 这是引人注意并加强语气的宣告；“看哪”在现代中文圣经语体中庄重、清楚，也保留了原文的强调作用。
- source_word: כָּל הַנְּפָשׁוֹת
  choice: 所有人的性命
  rationale: נֶפֶשׁ 可指生命、性命、本人或人。上下文谈到父亲和儿子，因此加上“人的”可明确范围；“所有……都”对应复数整体，而“性命”避免把原词限缩为与身体分离的“灵魂”。
- source_word: לִי הֵנָּה
  choice: 都属于我
  rationale: 原文直译为“都是我的”；“属于我”以自然中文表达上帝的所有权。
- source_word: כְּנֶפֶשׁ הָאָב וּכְנֶפֶשׁ הַבֵּן
  choice: 父亲的性命和儿子的性命，都同样属于我
  rationale: כְּ...וּכְּ 结构把父亲与儿子置于同等地位；“都同样”清楚表达二者在上帝面前同属他的意思。
- source_word: הַנֶּפֶשׁ הַחֹטֵאת
  choice: 犯罪的那个人
  rationale: 这里 נֶפֶשׁ 指承担道德责任的个人；“犯罪的那个人”既保留分词“犯罪的”所表达的行为，也符合现代中文表达。
- source_word: הִיא תָמוּת
  choice: 他必死亡
  rationale: 阴性代词 הִיא 是与阴性名词 נֶפֶשׁ 的语法一致，并不限定自然性别；中文用泛指的“他”。主语后再次用代词，保留原文对“正是这个人”的强调；“必死亡”表达审判后果而不额外说明死亡的性质。
theological_decisions:
- issue: נֶפֶשׁ 是否应统一译作“灵魂”
  choice: 在所属关系中译作“性命”，在责任判断中译作“人”
  alternative: 全节统一译作“灵魂”
  rationale: 本节重点是所有人的生命都属于上帝，以及犯罪者本人承担死亡后果，并非在界定人与身体分离的灵魂。按语境分别译作“性命”和“人”，可传达论旨而不引入原文未明确提出的人论体系；脚注保留“灵魂”这一可能译法。
- issue: הִיא 的强调作用
  choice: 译作“他”，形成“犯罪的那个人，他必死亡”
  alternative: 简化为“犯罪的人必死亡”
  rationale: 原文代词重复指向前面的 נֶפֶשׁ，带有强调辨明责任主体的作用。中文保留复指结构，可呈现这种强调，同时不把阴性语法形式误解为只指女性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留先知宣告的语气；分号呈现前两句紧密的论证关系。末句保留中文可接受的复指结构，以传达希伯来文代词的强调。
