  text: וְ/אִ֖ישׁ כִּי יִהְיֶ֣ה צַדִּ֑יק וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/005.yaml
  text: But if a man is righteous and does justice and righteousness,[a]
translation:
  language: zh_hans
  text: 若有人为义，行公平和公义，
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: 然而，一个人若
  rationale: אִישׁ是阳性单数，直指“一个人”；前缀וְ在这里承接上文并转入假设个案，译作“然而”以体现可能的转折语气。
- source_word: כִּי
  choice: 若
  rationale: כִּי与后面的未完成式共同引出条件句，现代汉语用“若”既自然又庄重。
- source_word: יִהְיֶה
  choice: 是
  rationale: 虽为היה的未完成式，但此处陈述一般性的假设情形，汉语以“是”表达最自然。
- source_word: צַדִּיק
  choice: 义人
  rationale: צַדִּיק指在道德与盟约意义上为义的人；“义人”是准确而凝练的圣经汉语表达。
- source_word: וְ/עָשָׂה
  choice: 行
  rationale: עשה带宾语מִשְׁפָּט וּצְדָקָה，译为“行”符合现代汉语搭配，也保留具体实践的意味。
- source_word: מִשְׁפָּט
  choice: 公平
  rationale: 在这一伦理性并列词组中，מִשְׁפָּט指公正的判断和处事原则；“公平”可与后面的“公义”保持区别。
- source_word: וּ/צְדָקָה
  choice: 和公义
  rationale: צְדָקָה在此指合乎正道的品行；译作“公义”保留它与מִשְׁפָּט之间相关但不完全相同的含义。
theological_decisions:
- issue: 阳性单数的代表性个案
  choice: 一个人
  alternative: 有人；一个男子
  rationale: 希伯来文אִישׁ为阳性单数，但此处重点是提出一个代表性的个人案例，并非特别强调生理性别。“一个人”既保留单数个体，也不加入原文未突出的性别限定。
- issue: מִשְׁפָּט与צְדָקָה的伦理词对
  choice: 公平和公义
  alternative: 正义和公义；公平正义
  rationale: 分别翻译两个近义词，避免把它们合并为单一概念，从而保留原文伦理表达的张力与层次。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“义人”“公平和公义”保留经文的伦理与神学用语；句末逗号表明本节语法和论述在后文继续。
