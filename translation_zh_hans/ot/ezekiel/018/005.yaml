- from: 然而，一个人若是义人，行公平和公义，[a]
  to: 若有人为义，行公平和公义，
  rationale: 修订移除正文中未受原文强制的“然而”，以较中性的条件句表达保留 וְ 的歧义；同时将“一个人若是义人”调整为自然的“若有人为义”。“公平和公义”保留，以对应并区别 מִשְׁפָּט 与 צְדָקָה。
