  text: אֶל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל וְ/אֶת אֵ֤שֶׁת רֵעֵ֨/הוּ֙ לֹ֣א טִמֵּ֔א וְ/אֶל אִשָּׁ֥ה נִדָּ֖ה לֹ֥א יִקְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/006.yaml
  text: he does not eat on the mountains[a], does not lift up his eyes to the idols of the house of Israel, does not defile his neighbor’s wife[c][b], and does not approach a woman during her menstrual impurity.
translation:
  language: zh_hans
  text: 他不在山上吃[a]，不举目仰望以色列家的偶像[b]，不玷污邻舍的妻子，也不亲近正处于月经不洁期的妇人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在山上的祭坛吃祭物”；这句话指在丘坛参与献祭后的宴席。
    reason: alternative_reading
  - marker: b
    text: 原文所用的“偶像”一词带有强烈的鄙夷意味。
    reason: lexical_alternative
  - marker: c
    text: “亲近”在这里是发生性关系的委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־הֶהָרִים ... אָכָל
  choice: 在山上吃
  rationale: 保留希伯来文“在山上吃”的具体意象；在本书语境中，这指参与丘坛的祭宴，其礼仪含义由脚注说明，避免在正文中过度释义。
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: 不举目仰望
  rationale: 保留“向……举目”的希伯来习语；“仰望”在现代汉语中也能传达敬奉或倚赖之意，而不把含义局限为单纯观看。
- source_word: גִּלּוּלֵי
  choice: 偶像
  rationale: “偶像”清楚自然；原词带有强烈鄙夷色彩，但若直译成“粪偶像”等会使正文生硬，故在脚注交代。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知文体中的集体称谓，不简化为“以色列”。
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: 邻舍的妻子
  rationale: רֵעַ 可指邻舍、同伴或同胞；“邻舍的妻子”符合圣经法律语境，也不把所指缩窄为某一种关系。
- source_word: לֹא טִמֵּא
  choice: 不玷污
  rationale: 此处指奸淫所造成的污秽；“玷污”同时保留道德与洁净层面的含义。
- source_word: אִשָּׁה נִדָּה
  choice: 经期不洁的妇人
  rationale: נִדָּה 是利未礼仪语境中的经期不洁状态；这一译法简洁表达其生理与礼仪背景。
- source_word: לֹא יִקְרָב
  choice: 不亲近
  rationale: 原动词直义是“靠近、亲近”，在这里婉指发生性关系；正文保留委婉表达，脚注予以说明。
theological_decisions:
- issue: 是否在正文中明说“在山上吃”是参加丘坛祭宴
  choice: 正文保留“在山上吃”
  alternative: 在山上的祭坛吃祭物
  rationale: 原文保留了先知和律法传统中的礼仪习语。正文照存其意象、脚注说明具体背景，兼顾原文形式与现代读者理解。
- issue: 如何处理本节并列的道德污秽与礼仪不洁
  choice: 采用“玷污”和“经期不洁”
  alternative: 分别释为“奸淫”和“在月经期间”
  rationale: 原文把奸淫与经期相关的洁净规定并列；保留洁净用语，可避免把经文化约为纯道德规范或纯礼仪条例。
- issue: 是否把“亲近”直接明译为“发生性关系”
  choice: 正文保留“不亲近”，脚注说明其委婉含义
  alternative: 不与……发生性关系
  rationale: 原文有意使用委婉说法；保留这一表达可维持其语气和含义空间，同时以脚注确保现代读者不会误解为一般接触。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文连续列举的节奏；“以色列家”维持先知性语体，“玷污”“经期不洁”则保留道德与礼仪语言之间的张力。
