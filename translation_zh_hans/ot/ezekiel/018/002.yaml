  text: מַה לָּ/כֶ֗ם אַתֶּם֙ מֹֽשְׁלִים֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אָבוֹת֙ יֹ֣אכְלוּ בֹ֔סֶר וְ/שִׁנֵּ֥י הַ/בָּנִ֖ים תִּקְהֶֽינָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/002.yaml
  text: What do you mean, that you keep repeating this proverb in the land of Israel[a], saying, ‘The fathers eat sour grapes, and the children’s teeth are set on edge’?”
translation:
  language: zh_hans
  text: '“你们在以色列地[a]为什么总说这句谚语：

    ‘父亲吃酸葡萄，

    儿女的牙酸倒了’？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在以色列地”也可译作“论到以色列地”。
    reason: 保留介词 עַל 在此可能具有地点或论及对象两种理解。
lexical_decisions:
- source_word: מַה לָּכֶם
  choice: 你们为什么
  rationale: 这是带有责问语气的习语；译为“你们为什么”能以自然现代汉语表达对听众行为的质问。
- source_word: מֹשְׁלִים
  choice: 总在……说
  rationale: 该分词表示持续或惯常的行为；“总在……说”保留反复使用这句谚语的意味。
- source_word: הַמָּשָׁל הַזֶּה
  choice: 这句谚语
  rationale: 此处 מָשָׁל 指流传的格言式说法，而非叙事性的比喻。
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: 在以色列地
  rationale: עַל 在这里可结合惯用表达理解为这句谚语流传、使用的地域范围；אַדְמָה 虽本指土地、地土，此处自然译为“以色列地”。
- source_word: אָבוֹת
  choice: 父亲
  rationale: 保留希伯来语明确的阳性亲属称谓，并符合汉语谚语的概括表达。
- source_word: יֹאכְלוּ בֹסֶר
  choice: 吃了酸葡萄
  rationale: בֹסֶר 指未熟而酸的葡萄；“酸葡萄”自然简洁。“吃了”在汉语中使前因与后果的关系更顺畅。
- source_word: שִׁנֵּי הַבָּנִים
  choice: 儿女的牙齿
  rationale: בָּנִים 形式上可指“儿子们”，在父辈与后代相对的谚语中泛指子女；“儿女”准确传达这一代表性用法。
- source_word: תִּקְהֶינָה
  choice: 酸倒了
  rationale: 该词描写牙齿因酸物而发涩、发钝的不适感；“牙齿酸倒了”是现代汉语可懂且形象的对应表达。
theological_decisions:
- issue: 父辈行为与后代承受后果的谚语表述
  choice: 保留谚语本身的因果张力，不在本节中解释或修正
  alternative: 在译文中明说这是关于代际罪责的错误观念
  rationale: 本节只引用并责问民间谚语，后文才展开神学回应；译文不应预先消解其张力。
- issue: בָּנִים 的性别范围
  choice: 译为“儿女”
  alternative: 译为“儿子”
  rationale: 该词在此与“父亲”构成父辈和后代的概括对照，语义包括子女整体；“儿女”避免把后果不必要地限制为男性后代。
- issue: עַל 的关系含义
  choice: 译作地点性的“在以色列地”
  alternative: 译作“论到以色列地”
  rationale: 上下文更自然地指这句谚语在以色列人中或以色列地上流传。原介词亦容许“关于”的理解，因此以脚注保存该歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。问句保留责问语气；谚语分行排印，以显出其格言形式。“总在”体现分词的持续、惯常意味；“酸倒了”避免生硬直译为“变钝”，同时传达酸涩造成牙齿不适的感受。
