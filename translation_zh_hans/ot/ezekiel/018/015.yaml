  text: עַל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ לֹ֥א טִמֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/015.yaml
  text: He has not eaten on the mountains[a], nor lifted up his eyes to the idols of the house of Israel[b]; he has not defiled his neighbor’s wife.
translation:
  language: zh_hans
  text: 他没有在山上吃祭物[a]，也没有仰望以色列家的偶像[b]；他没有玷污邻舍的妻子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“没有在山上吃”，指没有在山上的祭祀场所吃祭物、参与偶像崇拜。
    reason: lexical_alternative
  - marker: b
    text: 这里译作“偶像”的希伯来语带有强烈的鄙夷意味，也可理解为“污秽可憎的偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הֶהָרִים ... אָכַל
  choice: 没有在山上吃祭物
  rationale: 原文直译为“没有在山上吃”，在以西结书的语境中指在山上祭坛参与偶像崇拜的祭宴。正文补出“祭物”，使现代读者不致误解为普通进食，同时脚注保留更直译的形式。
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: 也没有仰望
  rationale: “举目向”在此表示把目光、敬意或祈求转向某对象。“仰望”既自然，又保留了敬拜与倚靠的含义。
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  choice: 以色列家的偶像
  rationale: גִּלּוּלִים是带有强烈鄙夷色彩的偶像称呼。正文采用清楚自然的“偶像”，并在脚注说明其贬义色彩。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留以西结书常用的盟约群体称谓及原文表达方式。
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: 邻舍的妻子
  rationale: רֵעַ可指邻舍、同伴或同胞；“邻舍”符合本段伦理语境，也与现代中文圣经文体协调。
- source_word: לֹא טִמֵּא
  choice: 没有玷污
  rationale: טמא在此兼有道德与礼仪上的污秽含义。“玷污”保留其神学重量，又不额外暗示原文未说明的强迫行为。
theological_decisions:
- issue: “在山上吃”的祭祀含义
  choice: 正文译作“在山上吃祭物”，指参与山上祭坛的偶像崇拜宴席。
  alternative: 较形式对应地译作“在山上吃”，或更明确地译作“在山上的祭坛吃祭物”。
  rationale: 上下文及以西结书中的固定用法表明，这不是普通的山中进食。补出“祭物”传达隐含对象，但不把地点进一步限定为正文没有明说的“邱坛”。
- issue: 奸淫行为的污秽语言
  choice: “没有玷污邻舍的妻子”
  alternative: “没有侵犯邻舍的妻子”或“没有使邻舍的妻子不洁净”
  rationale: 原文强调奸淫所造成的污秽，并未明确表示胁迫；“玷污”保留道德—礼仪层面的张力，避免过度具体化。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“吃祭物”适度明示原文在语境中省略的宾语；“仰望”保留希伯来语习语的敬拜色彩；分号对应本节由祭祀罪转向婚姻伦理的结构。
