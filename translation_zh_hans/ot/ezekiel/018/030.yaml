source:
  edition: WLC
  text: לָ/כֵן֩ אִ֨ישׁ כִּ/דְרָכָ֜י/ו אֶשְׁפֹּ֤ט אֶתְ/כֶם֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה שׁ֤וּבוּ וְ/הָשִׁ֨יבוּ֙ מִ/כָּל פִּשְׁעֵי/כֶ֔ם וְ/לֹֽא יִהְיֶ֥ה לָ/כֶ֛ם לְ/מִכְשׁ֖וֹל עָוֺֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/030.yaml
  text: Therefore I will judge each man according to his ways[a], O house of Israel, declares the Lord GOD. Repent and turn away from all your transgressions, so that iniquity may not become a stumbling block to you.
translation:
  language: zh_hans
  text: 因此，以色列家啊，我必照各人的行为审判你们——这是主耶和华的宣告。你们要回转，离开自己一切的过犯，免得罪孽成为你们的绊脚石。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得你们的罪孽使你们灭亡。”希伯来语末句十分凝练，既可强调罪孽本身如同绊脚石，也可强调罪孽导致败亡。
    reason: 保留לְמִכְשׁוֹל עָוֺן在句法和语义上的真实歧义。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的论证并引出结论，保留希伯来语的推论关系。
- source_word: אִישׁ כִּדְרָכָיו
  choice: 照各人的行为
  rationale: אִישׁ在此作分配用法，强调以色列家中的每一个人；דֶּרֶךְ在本章指人的行事为人。译作“各人的行为”既体现逐人审判，也符合现代汉语。
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: 我必……审判你们
  rationale: שׁפט具有司法审判含义；保留复数宾语“你们”，与对以色列全家的直接宣告相符。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 明确呈现呼语，同时保留先知书中“家”的群体表达。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם是先知性的宣告公式；“主耶和华”区分并呈现אֲדֹנָי与יהוה的组合称号。
- source_word: שׁוּבוּ
  choice: 回转
  rationale: 保留שׁוב的转向、归回意象，在本语境中自然表达悔改而不以抽象术语取代原文比喻。
- source_word: וְהָשִׁיבוּ מִכָּל פִּשְׁעֵיכֶם
  choice: 离开自己一切的过犯
  rationale: 使役式动词与מִן连用，表示使自己转离；“过犯”保留פֶּשַׁע所含违逆、悖逆的道德分量。
- source_word: וְלֹא יִהְיֶה לָכֶם
  choice: 免得……成为你们的
  rationale: 在命令句之后表达所要避免的结果；“免得”简洁自然。
- source_word: לְמִכְשׁוֹל עָוֺן
  choice: 罪孽成为你们的绊脚石
  rationale: 保留מִכְשׁוֹל的绊倒意象及עָוֺן的道德含义，同时不在正文中过度确定其是罪、罪责还是罪所导致的毁灭。
theological_decisions:
- issue: 个体责任与群体称呼的并置
  choice: “照各人的行为审判你们”
  alternative: “照每个人所行的审判你们”
  rationale: 原文以分配性的单数אִישׁ强调每一个人，又以复数“你们”向以色列家整体发言。译文保留这种个体与群体之间的张力。
- issue: שׁוּבוּ的神学语义
  choice: “回转”
  alternative: “悔改”
  rationale: “悔改”符合语境，但“回转”更直接保留希伯来语的空间性比喻，并与随后离开过犯的行动相呼应。
- issue: 末句עָוֺן与מִכְשׁוֹל的关系
  choice: “罪孽成为你们的绊脚石”
  alternative: “你们的罪孽使你们灭亡”
  rationale: 希伯来语末句高度凝练，既可能将罪孽描写为导致跌倒的障碍，也可能侧重其带来的败亡。正文保留词汇与比喻，脚注交代结果性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“以色列家啊”和“这是主耶和华的宣告”保留先知宣告的正式语气；“回转”“过犯”“罪孽”“绊脚石”保持经文意象，同时避免生硬古奥。
