  text: הַשְׁלִ֣יכוּ מֵ/עֲלֵי/כֶ֗ם אֶת כָּל פִּשְׁעֵי/כֶם֙ אֲשֶׁ֣ר פְּשַׁעְתֶּ֣ם בָּ֔/ם וַ/עֲשׂ֥וּ לָ/כֶ֛ם לֵ֥ב חָדָ֖שׁ וְ/ר֣וּחַ חֲדָשָׁ֑ה וְ/לָ֥/מָּה תָמֻ֖תוּ בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/031.yaml
  text: Cast away from yourselves all your transgressions by which you have transgressed[a], and make for yourselves a new heart and a new spirit. Why should you die, O house of Israel?
translation:
  language: zh_hans
  text: 你们要把自己所犯的一切过犯都从身上丢弃[a]，为自己造一个新心和一个新灵。以色列家啊，你们为什么要死呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们要把自己所行的一切悖逆都从身上丢弃。”希伯来文的“悖逆”和“所行”出自同一词根，强调他们自身的罪责。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלִיכוּ מֵעֲלֵיכֶם
  choice: 从身上丢弃
  rationale: 该短语直译为“从你们身上扔掉”，语气强烈。“从身上丢弃”在现代汉语中自然，并保留彻底摆脱之意。
- source_word: כָּל־פִּשְׁעֵיכֶם אֲשֶׁר פְּשַׁעְתֶּם בָּם
  choice: 自己所犯的一切过犯
  rationale: פשע 表示违逆权威的过犯或悖逆。用“所犯……过犯”尽可能保留希伯来文名词与同根动词的重复，同时保持汉语通顺。
- source_word: וַעֲשׂוּ לָכֶם
  choice: 为自己造
  rationale: עשה 加 ל 表示为自己做成或取得；“为自己造”保留命令的直接性及主体责任，不将其弱化为愿望。
- source_word: לֵב חָדָשׁ
  choice: 一个新心
  rationale: “心”保留以西结书的重要意象，指人的内在意向与意志，不释义为“思想”或“内在生命”。
- source_word: רוּחַ חֲדָשָׁה
  choice: 一个新灵
  rationale: “灵”保留 רוּחַ 的核心词义及其与“心”的并列关系，也与以西结书相关段落的用语一致。
- source_word: וְלָמָּה תָמֻתוּ
  choice: 你们为什么要死呢
  rationale: 这是带有劝诫意味的反问；“为什么要……呢”自然传达其呼吁语气，而不把句子处理成单纯的未来预测。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家啊
  rationale: 保留“家”的群体称谓，并用“啊”明确呼语，体现先知庄重而恳切的直接呼告。
theological_decisions:
- issue: 人应负责更新自己，与上帝赐下新心新灵之间的张力
  choice: 保留“为自己造一个新心和一个新灵”的直接命令
  alternative: 译作“要得着一个新心和新灵”，或参照以西结书36章弱化人的主动责任
  rationale: 本节原文明确使用命令式，要求听众采取行动。译文不借其他经文消解这里与上帝主动更新之工之间真实存在的神学张力。
- issue: פשע 名词与动词的同根重复
  choice: 译作“所犯的一切过犯”
  alternative: 译作“一切悖逆之事”或“一切罪过”，不再体现同根重复
  rationale: “犯……过犯”虽有刻意重复，却能在现代汉语中保持可懂，并传达原文强调听众自身罪责的修辞效果；脚注补充“悖逆”的词义可能。
translation_notes:
  register: 采用现代、庄重而直接的先知劝诫语体。“丢弃”传达命令的力度；“新心”“新灵”“以色列家”保留以西结书的核心意象和传统经文用语。
