  text: וְ/ה֕וּא אֶת כָּל אֵ֖לֶּה לֹ֣א עָשָׂ֑ה כִּ֣י גַ֤ם אֶל הֶֽ/הָרִים֙ אָכַ֔ל וְ/אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/011.yaml
  text: But he has done none of all these things; instead, he has even eaten on the mountains and defiled his neighbor’s wife.
translation:
  language: zh_hans
  text: 但他没有做这一切；反而，他竟在山上吃，并玷污邻舍的妻子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת כָּל אֵלֶּה לֹא עָשָׂה
  choice: 不做上述任何一件善事
  rationale: 原文直译为“不做这一切”；结合10节所说儿子没有效法父亲的义行，以及下句所列恶行，补出“善事”以避免现代汉语误解为他没有做随后列举的恶事。
- source_word: אֶל הֶהָרִים אָכַל
  choice: 在山上吃祭物
  rationale: 这是以西结书中指向山上祭坛敬拜活动的固定表达；补出“祭物”可传达省略的祭祀语境，而不把动作误解为普通进食。
- source_word: טִמֵּא
  choice: 玷污
  rationale: 保留该词兼具道德与礼仪污秽色彩的强烈措辞；在此具体指与邻舍之妻发生不正当性关系。
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: 邻舍的妻子
  rationale: “邻舍”准确对应 רֵעַ，并保持庄重、常见的经文用语。
theological_decisions:
- issue: “不做这一切”的所指可能因脱离上下文而产生歧义
  choice: 译为“不做上述任何一件善事”
  alternative: 译为“不做这一切”
  rationale: 希伯来语本身以指示语回指上文；上文所述是父亲的义行。显明其所指不是消除神学张力，而是防止中文读者将其错误地理解为“不做下文恶事”。
- issue: 山上进食的宗教含义
  choice: 译为“在山上吃祭物”
  alternative: 译为“在山上吃”
  rationale: 本书语境表明这是参与山丘祭坛活动，并非对普通用餐地点的谴责；“祭物”以最简方式补明隐含宾语。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“但……反而还……”呈现 וְהוּא 与 כִּי גַם 构成的强烈对比；“这个儿子”明确代词承接第10节，避免中文主语不清。
