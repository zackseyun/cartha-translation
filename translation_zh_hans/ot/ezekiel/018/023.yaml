  text: Do I take any pleasure at all in the death of the wicked? declares the Lord GOD[c][b][a]. Is it not rather in his turning from his ways and living?
translation:
  language: zh_hans
  text: 主耶和华说：“我岂真喜悦恶人死亡吗？[a]我岂不更喜悦他离开自己的道路而活吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “真喜悦”也可译作“以……为乐”或“真愿意”。希伯来语以不定式绝对形加限定动词加强语气；该动词可表示喜悦、乐意或愿望。
    reason: lexical_alternative
  - marker: b
    text: “离开自己的道路而活”也可译作“在他离开自己的道路、活着的时候”。原文的结构可表达他转离恶道并活着这一情形；“而活”不预先限定为目的或结果关系。
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחָפֹץ אֶחְפֹּץ
  choice: 我岂会……为乐吗
  rationale: 不定式绝对形与限定动词连用，加强“喜悦、乐意”的语气；用反问和“岂会”自然表达强调，同时保留该词兼具情感与意愿的语义范围。
- source_word: מוֹת רָשָׁע
  choice: 恶人死亡
  rationale: מוֹת指死亡这一事件；רָשָׁע是单数实体化形容词，泛指恶人。中文无需补出性别，也不必改成过程意味较强的“垂死”。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华说
  rationale: נְאֻם是先知书中权威性的宣告公式；“主耶和华说”在现代中文中清楚庄重，并保留复合神名的两个成分。
- source_word: הֲלוֹא
  choice: 我岂不是更愿
  rationale: 该疑问词预期肯定回答，并与前问构成鲜明对照；“岂不是……更……”自然呈现其修辞功能。
- source_word: בְּשׁוּבוֹ מִדְּרָכָיו
  choice: 他回头离开自己的道路
  rationale: בְּ加不定式结构可表“在……时”或所乐见的情形。“回头离开”保留שׁוב的转回意象；“道路”保留行为与生活方式的圣经隐喻。
- source_word: וְחָיָה
  choice: 得以存活
  rationale: 完成式在此承接转回所带来的生命结果。“得以存活”表达结果关系，但不把希伯来语强行限定为单一的目的句法。
theological_decisions:
- issue: 上帝对恶人死亡与其转回存活的态度
  choice: 以两个相对的反问表达：上帝不以恶人死亡为乐，反而愿其转回并存活。
  alternative: 可译为“我难道真想要恶人死亡吗……难道不是要他转回……而活吗？”以突出意愿层面。
  rationale: חפץ可指喜悦、乐意或愿望。“为乐”较好保留情感与意愿的交叠；第二问用“更愿”显出对照，但不借此建立超出本节的神意论体系，也不消解审判与怜悯之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“主耶和华”沿用中文圣经中对אֲדֹנָי יְהוִה的清晰表达；保留“道路”和“回头”的经文意象。两个反问维持原文的修辞力度及判断与怜悯之间的张力。
