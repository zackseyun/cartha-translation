  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י שִׁמְעוּ נָא֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/דַרְכִּ/י֙ לֹ֣א יִתָּכֵ֔ן הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/025.yaml
  text: 'Yet you say[a], ‘The way of the Lord is not just.’ Hear now, house of Israel: Is my way not just? Is it not your ways that are not just?'
translation:
  language: zh_hans
  text: 可是你们说：“主的行事不公正。”以色列家啊，现在请听：难道我的行事不公正吗？不正是你们的行事不公正吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “公正”也可译作“公平”“正当”或“合宜”。这里的希伯来词指合乎准则、公平适当。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: 可是你们说
  rationale: 连接词在本段辩论语境中带转折意味；“可是”自然表达以色列人对上文的反驳。完成式在此表达他们所提出的异议，汉语用“说”即可。
- source_word: יִתָּכֵן
  choice: 公正
  rationale: 此处 תכן 的尼法勒式指合宜、公平或正当；上下文讨论上帝审判与个人责任，“公正”兼具伦理和审判意味。
- source_word: דֶּרֶךְ / דַרְכִּי / דַרְכֵיכֶם
  choice: 行事
  rationale: “道路”在此比喻行为方式。译作“行事”使现代汉语读者直接明白所指，同时保留主与以色列人之间单数、复数所形成的对照。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是神圣称号 אֲדֹנָי，按中文圣经庄重而通行的表达译为“主”。
- source_word: שִׁמְעוּ נָא
  choice: 现在请听
  rationale: 命令式加 נָא 构成直接而迫切的呼吁；“现在请听”既保留“现在”的强调，也避免文言化。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留先知书中称呼以色列群体的传统盟约用语，同时在现代中文中仍可理解。
- source_word: הֲדַרְכִּי לֹא יִתָּכֵן
  choice: 难道我的行事不公正吗？
  rationale: 用“难道”体现反问语气，期待听者承认主的行事并非不公正。
- source_word: הֲלֹא דַרְכֵיכֶם לֹא יִתָּכֵנוּ
  choice: 不正是你们的行事不公正吗？
  rationale: “不正是”保留 הֲלֹא 的反问力度，并凸显“你们的行事”与“我的行事”的对照；中文“行事”本身不标数，不能形式化呈现希伯来语复数。
theological_decisions:
- issue: 如何表述以色列对主治理方式的道德指控
  choice: 各处一致译为“不公正”
  alternative: 不公平；不正当；不合宜
  rationale: 本章聚焦上帝审判的正义与个人责任。“不公正”保留指控及主反问的司法—伦理分量，不把问题弱化为主观感受上的“不公平”。
- issue: “道路”比喻在本节中的表达
  choice: 译为“行事”
  alternative: 道路；行径；做法
  rationale: 这里讨论的是主与百姓各自的行为方式，而非实体道路。“行事”清楚、庄重，也没有把主的行动贬义化；两边采用同一译词，以保存经文的对称和反转。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“可是”体现辩论中的转折；“现在请听”保留先知呼告的迫切感。“难道……吗／不正是……吗”呈现原文连续反问。脚注标记置于整节末尾，适用于本节三次“不公正”。
