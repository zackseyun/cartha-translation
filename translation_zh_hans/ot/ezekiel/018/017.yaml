reference: Ezekiel 18:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מֵ/עָנִ֞י הֵשִׁ֣יב יָד֗/וֹ נֶ֤שֶׁךְ וְ/תַרְבִּית֙ לֹ֣א לָקָ֔ח מִשְׁפָּטַ֣/י עָשָׂ֔ה בְּ/חֻקּוֹתַ֖/י הָלָ֑ךְ ה֗וּא לֹ֥א יָמ֛וּת בַּ/עֲוֺ֥ן אָבִ֖י/ו חָיֹ֥ה יִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/017.yaml
  text: He has withheld his hand from the poor[a], has not taken interest or profit, has carried out my judgments, and has walked in my statutes. He will not die for his father's iniquity[c][b]; he will surely live.
translation:
  language: zh_hans
  text: 他不欺压穷人[a]，不收取利息和收益[b]，遵行我的典章，按我的律例而行。他必不因父亲的罪孽而死[c]；他必定存活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使他的手从穷人那里转回”。这是一个习语；在此处的伦理语境中，指不伤害、压迫或剥削穷人。
    reason: lexical_alternative
  - marker: b
    text: “利息和收益”译自两个相关的希伯来词，指借贷所收取的利息、增加或收益；传统也译作“利息和增利”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他必不死在父亲的罪孽中。”本章上下文表明，这里是说他不会因父亲的罪责而死。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעָנִי הֵשִׁיב יָדוֹ
  choice: 不向穷人下手
  rationale: 原文直译为“使他的手从穷人那里转回”，在本段伦理语境中指克制自己，不伤害或剥削穷人。中文用“不向穷人下手”保留“手”的意象，并自然表达停止侵害之意。
- source_word: נֶשֶׁךְ וְתַרְבִּית
  choice: 利息和额外收益
  rationale: 两个词并列，均指借贷所得的增加；前者通常指利息，后者指增加或收益。“额外收益”既避免与“利息”完全重叠，也不把含义缩窄为现代语境中的暴利。
- source_word: מִשְׁפָּטַי עָשָׂה
  choice: 遵行我的判例
  rationale: מִשְׁפָּטַי具有司法、规范性的意味；“判例”保留法律色彩，“遵行”符合中文对规范要求的常用表达。
- source_word: בְּחֻקּוֹתַי הָלָךְ
  choice: 按我的律例行事
  rationale: 原文为“行走在我的律例中”。中文若直译略显生硬；“按……行事”自然传达以律例规范生活行为的约言意象。
- source_word: בַּעֲוֺן אָבִיו
  choice: 因父亲的罪孽
  rationale: 介词ב在这里可表达原因或关联。结合第18章个人责任的论述，“因”清楚传达他不会由于父亲的罪责而死，同时以脚注保留较形式化的另一译法。
- source_word: חָיֹה יִחְיֶה
  choice: 他必定存活
  rationale: 不定式绝对形与未完成式同用，具有强调作用；“必定存活”自然保留这一强烈肯定。
theological_decisions:
- issue: 个人责任与父辈罪责的关系
  choice: 他必不因父亲的罪孽而死
  alternative: 他必不死在父亲的罪孽中
  rationale: 上下文明确讨论父亲与儿子各自按自身行为受判断。正文采用自然的原因义，但脚注保留介词结构可能呈现的较直译表达，不将本节扩展为对所有代际后果的系统性结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不向穷人下手”保留原文“手”的具体意象；“按我的律例行事”则避免机械照搬希伯来语“行走”的习语。各脚注标记均置于相关正文之后。
