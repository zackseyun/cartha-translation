source:
  edition: WLC
  text: וְ/אָֽמְרוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י הַ/דְּרָכַ֞/י לֹ֤א יִתָּֽכְנּוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/029.yaml
  text: Yet the house of Israel says[a], ‘The way of the Lord is not just.’ Are my ways not just, O house of Israel? Is it not your ways that are not just?
translation:
  language: zh_hans
  text: 以色列家却说[a]：“主的道路不公正。”以色列家啊，我的道路不公正吗？不正是你们的道路不公正吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不公正”也可译作“不正当”或“不公平”。原文动词涉及衡量、安排得当；这里指主的作为是否正直公允。
    reason: 词义存在合理替代译法，脚注说明其衡量、端正及道德评价的语义范围。
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: 然而……却说
  rationale: 连接词与完成式在上下文中延续百姓的反驳；用“然而……却”自然表达转折语气，同时以现在时态的“说”引出其一贯的指控。
- source_word: בֵּית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留原文的集体称谓及其盟约群体色彩，不简化为“以色列”。
- source_word: לֹא יִתָּכֵן
  choice: 不公正
  rationale: תכן 的尼法勒形态在此指未被衡量或安排得正直、公允；“不公正”适合本章对上主施行审判是否正直的争论，并可在三处一致复现。
- source_word: דֶּרֶךְ / דְּרָכַי / דַרְכֵיכֶם
  choice: 道路／我的道路／你们的道路
  rationale: 统一保留“道路”的比喻，既可指主行事的方式，也可指百姓的行为方式，并维持原文反复对照。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 采用现代中文中庄重、通行的神圣称号。
- source_word: הֲלֹא
  choice: ……吗？／不正是……吗？
  rationale: 译为预期肯定回答的反问句，呈现原文责问和驳斥的力量。
theological_decisions:
- issue: 对上主行为的道德评价用语
  choice: 三处均译为“不公正”
  alternative: 不正当／不公平／不合准则
  rationale: “公正”保留本章司法与伦理层面的张力，既不把问题缩减为主观的“公平感”，也不将 תכן 仅作机械性的“衡量”；三处保持同词，凸显指控与反驳的对称。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“以色列家”和“道路”的圣经性表达；以反问结构重现希伯来文的修辞对称，并避免用额外措辞消解百姓对上主公正性的质疑。
