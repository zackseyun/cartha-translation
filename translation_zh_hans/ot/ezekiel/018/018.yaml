  rationale: 修订仅处理两处汉语表达及其相关脚注：以“抢夺弟兄的财物”消除“抢劫弟兄”的宾语歧义，并以“本族人”自然表达其所属共同体。保留原文的因果关系、同根构式的强调、“不好的事”的克制说法、提示语“看哪”，以及“必死在自己的罪孽中”的审判性确定与脚注中的时态歧义。
