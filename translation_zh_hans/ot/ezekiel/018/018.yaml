  text: אָבִ֞י/ו כִּֽי עָ֣שַׁק עֹ֗שֶׁק גָּזַל֙ גֵּ֣זֶל אָ֔ח וַ/אֲשֶׁ֥ר לֹא ט֛וֹב עָשָׂ֖ה בְּ/ת֣וֹךְ עַמָּ֑י/ו וְ/הִנֵּה מֵ֖ת בַּ/עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/018.yaml
  text: As for his father[a], because he practiced extortion, robbed his brother, and did what was not good among his people, behold[d][c][b], he shall die in his iniquity.
translation:
  language: zh_hans
  text: 至于他的父亲，因为他大行欺压[a]，抢夺弟兄的财物[b]，又在本族人中做了不好的事；看哪[c]，他必死在自己的罪孽中[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用同根的动词和名词连用，以加强语气；也可译作“施行压迫”或“勒索人”。
    reason: lexical_alternative
  - marker: b
    text: “弟兄”也可泛指同一共同体中的人，即“同胞”；也可译作“抢夺同胞的财物”。
    reason: lexical_alternative
  - marker: c
    text: 原文作“看哪”，是加强语气、引人注意的话语标记。
    reason: lexical_alternative
  - marker: d
    text: 也可译作“他死在自己的罪孽中”或“他已经死在自己的罪孽中”；原文的完成式把这一结局呈现为确定的事实。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיו
  choice: 他的父亲
  rationale: 保留第三人称单数所属关系；用“至于”承接上下文中与义子相对照的父亲。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出这位父亲遭遇结局的原因。
- source_word: עָשַׁק עֹשֶׁק
  choice: 肆意欺压人
  rationale: 原文以同根动词和名词叠加强调；“肆意”在自然现代汉语中传达反复、强烈的压迫行为，而“欺压”保留其较宽的剥削与压迫含义。
- source_word: גָּזַל גֵּזֶל אָח
  choice: 抢劫弟兄
  rationale: 用强烈而自然的“抢劫”表达同根动词—名词结构所强调的掠夺行为；“弟兄”保留 אָח 的亲属或共同体成员色彩。
- source_word: וַאֲשֶׁר לֹא טוֹב עָשָׂה
  choice: 又……做了不好的事
  rationale: 贴近原文的否定表达“不好”，不擅自强化为概括性的“作恶”。
- source_word: בְּתוֹךְ עַמָּיו
  choice: 在自己的人民中
  rationale: 保留第三人称所属关系和恶行发生于共同体内部的社会语境。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留先知话语中引人注意并加强语气的标记。
- source_word: מֵת
  choice: 他必死
  rationale: 该完成式在审判语境中可把结果陈述为确定；“必死”自然表达这种确定性，同时不排除现在式或完成状态的理解。
- source_word: בַּעֲוֹנוֹ
  choice: 在自己的罪孽中
  rationale: 保留介词“在”和第三人称所属关系，使译文既呈现死亡与其罪孽的关联，也保留处于自身罪责之中的语义张力。
theological_decisions:
- issue: 以西结书18章中的个人责任
  choice: 明确保留父亲因自己的行为、在自己的罪孽中死亡的陈述。
  alternative: 将本句泛化为人在罪责中死亡，而弱化个人所属关系。
  rationale: 原文的因果结构及多个第三人称单数所属成分把行为、罪孽和结局归于这位父亲；译文不添加超出本节的系统教义解释。
- issue: מֵת 的时态与体貌
  choice: 译作“必死”，突出审判结局的确定性。
  alternative: 可译作“死了”“正死在”或“死在”，把完成式理解为已成事实或状态陈述。
  rationale: 司法—先知语境支持确定将来的表达，但希伯来语完成式本身容许不同时间取向，因此以脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“至于……因为……看哪……”保留先知审判宣告的结构和语气；“不好的事”刻意保留原文较克制的否定说法。所有脚注标记均按正文出现顺序列出。
