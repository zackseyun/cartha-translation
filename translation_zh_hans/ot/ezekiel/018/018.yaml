  source_fidelity: 整体准确保留了父亲的罪行、在共同体中的恶行及其因自身罪孽而死的审判结局，也适当以脚注保留了 מֵת 完成式的时态/体貌歧义。惟“抢劫弟兄”在汉语中容易理解为抢劫（甚至劫持）弟兄本人，不自然地表达了 גָּזַל גֵּזֶל אָח 所指向的对弟兄的掠夺；宜明示被夺的是财物。
