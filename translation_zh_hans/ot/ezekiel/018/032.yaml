  text: כִּ֣י לֹ֤א אֶחְפֹּץ֙ בְּ/מ֣וֹת הַ/מֵּ֔ת נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָשִׁ֖יבוּ וִֽ/חְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/032.yaml
  text: For I take no pleasure in the death of the one who dies[a], declares the Lord GOD[c][b]. Therefore turn back and live.
translation:
  language: zh_hans
  text: 因为我不喜悦人的死亡[a]——这是主雅威的宣告[b]。所以，你们要回转，活下去[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“那死亡者的死亡”；“死亡者”也可理解为“将死的人”。
    reason: lexical_alternative
  - marker: b
    text: “主雅威”原文为 אֲדֹנָי יְהוִה；也可译作“主耶和华”。
    reason: alternative_reading
  - marker: c
    text: 或译：“回转而活。”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文的劝告，说明其根据；“因为”自然保留了解释和因果作用。
- source_word: לֹא אֶחְפֹּץ
  choice: 我不喜悦
  rationale: חפץ可表示喜悦、乐意或愿望；“不喜悦”既贴近原词，也自然表达上帝对死亡的态度。
- source_word: בְּמוֹת הַמֵּת
  choice: 人的死亡
  rationale: 原文较直译为“死亡之人的死”，指那死亡或走向死亡之人的死亡。正文采用自然的现代汉语概括表达，不依上下文增译为“恶人的死亡”；脚注保留原文的特殊措辞和可能理解。
- source_word: נְאֻם
  choice: 这是……的宣告
  rationale: 这是庄严的先知性发言公式；“宣告”比普通的“说”更能保留其语体。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 同时表达 אֲדֹנָי（主）与神圣名 יהוה；采用现代中文圣经读者熟悉的“主耶和华”，并以脚注注明另一种音译。
- source_word: וְהָשִׁיבוּ
  choice: 所以，你们要回转
  rationale: שוב的命令式保留“转回、返回”的具体意象和道德呼召；不用“悔改”，以免将原词的意象完全解释化。
- source_word: וִחְיוּ
  choice: 活下去
  rationale: 原文是与“回转”相连的命令式。“活下去”在现代汉语中自然有力，同时保留直接劝告；脚注给出更形式对应的表达。
theological_decisions:
- issue: הַמֵּת是否按上下文译为“恶人”
  choice: 人的死亡
  alternative: 恶人的死亡
  rationale: 本节原文没有“恶人”一词，虽然上下文谈到恶人回转，正文不将这一语境解释直接写入本句，以保留原文措辞的广度和张力。
- issue: 神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”在简体中文中庄重、清楚且广为人知；脚注说明“主雅威”这一更直接反映现代学术音译的译法，不把某一发音传统绝对化。
- issue: וְהָשִׁיבוּ וִחְיוּ 两个命令式之间的关系
  choice: 所以，你们要回转，活下去
  alternative: 你们要回转，就必存活
  rationale: 原文两个动词都是命令式。正文保留双重劝告及其紧密关系，不把第二个动词明确改写为应许句；同时用“所以”表达本句与前文及上半句的推论关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不喜悦”“宣告”“回转”保留先知文本的肃穆感；“活下去”使结尾的命令在现代汉语中直接有力。破折号将宣告公式与神谕主体连接，避免拆句造成过强停顿。
