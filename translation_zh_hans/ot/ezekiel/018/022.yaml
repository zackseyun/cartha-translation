base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/022.yaml
  text: None of the transgressions that he has committed will be remembered against him[a]; by the righteousness that he has practiced[b], he will live.
translation:
  language: zh_hans
  text: 他所犯的一切过犯，都不会被记在他账上[a]；他必因自己所行的义[b]而活。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都不会被算在他头上。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“凭着自己所行的义”或“在自己所行的义中”；这里的希伯来介词可以表达几种彼此相近的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פְּשָׁעָיו
  choice: 他所犯的一切过犯
  rationale: כָּל 表示无一例外的总体；פֶּשַׁע 带有悖逆、违法的道德与审判意味，译作“过犯”比泛称“罪”更贴近原词。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所犯的／所行的
  rationale: עָשָׂה 两次出现；与“过犯”搭配时按现代汉语译为“犯”，与“义”搭配时译为“行”，既自然又保留两处都关乎实际行为的联系。
- source_word: לֹא יִזָּכְרוּ לוֹ
  choice: 都不会被记在他身上
  rationale: 保留 זכר 的被动表达“被记”，并以“在他身上”传达 לוֹ 在审判语境中归到他、对他不利的含义；脚注列出更具解释性的译法。
- source_word: בְּצִדְקָתוֹ
  choice: 因自己所行的义
  rationale: בְּ־ 在此可表达原因、凭借或所处状态；正文采用自然的因果表达“因”，同时以脚注保留其他相近理解。צְדָקָה 译为“义”，维持本章的道德与盟约审判语境。
- source_word: יִחְיֶה
  choice: 他必……而活
  rationale: 表达该动词在本章判决与应许语境中的结果性和确定性，不将“活”窄化为仅仅生活顺遂。
theological_decisions:
- issue: 本节是否应被译成靠行为赚取称义，或仅指今世安康
  choice: 按经文本身直陈：过犯不被记在此人身上，他因自己所行的义而活。
  alternative: 加入“称义”“赚取救恩”等后期教义术语，或把“活”弱化为今世生活顺利。
  rationale: 希伯来文使用以西结书自身关于个人责任、审判和生命的措辞；译文不替经文消解其神学张力，也不导入经文未明说的体系性结论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“过犯”“义”“而活”保留经文的审判和盟约色彩；句法避免生硬直译，同时正文中的[a]、[b]与脚注一一对应。
