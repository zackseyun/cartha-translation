id: EZK.18.3
reference: Ezekiel 18:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חַי אָ֕נִי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה אִם יִֽהְיֶ֨ה לָ/כֶ֜ם ע֗וֹד מְשֹׁ֛ל הַ/מָּשָׁ֥ל הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/003.yaml
  text: As I live[a], declares the Lord GOD[b], this proverb shall no longer be used by you in Israel.
translation:
  language: zh_hans
  text: 主耶和华说：“我指着我的永生起誓[a]，你们在以色列必不再用这句俗语了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“我活着”，是上帝以自己的永生作保证的起誓用语。
    reason: lexical_alternative
  - marker: b
    text: 原文“用”也可译作“说”或“引用”，指采用并流传一句俗语。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֕נִי
  choice: 我指着我的永生起誓
  rationale: 这是希伯来语庄严的起誓惯用语。采用自然的现代汉语明确表达其誓言功能，同时保留上帝以自己的永生作保证的含义。
- source_word: נְאֻ֖ם
  choice: 说
  rationale: 先知书中引出权威宣告的固定用语；“说”在汉语经文体中自然庄重，与后面的直接引语衔接顺畅。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的“主”和四字神名 יהוה；避免译成重复的“主主”，并保留专名性质。
- source_word: אִם יִֽהְיֶה ... עוֹד
  choice: 必不再
  rationale: אִם 位于誓言之后，属于省略咒诅后果的否定誓言结构，语义为“断然不会再”；“必不再”兼顾确定性与简洁。
- source_word: לָכֶם
  choice: 你们……用
  rationale: 此处与“说俗语”的结构结合，指受话者继续采用这句俗语；汉语以主语“你们”表达最自然。
- source_word: מְשֹׁל
  choice: 用
  rationale: 该动词在此指引用、说出或运用一句俗语。“用”不把方式限定为单纯口述，也符合现代汉语搭配。
- source_word: הַמָּשָׁל הַזֶּה
  choice: 这句俗语
  rationale: מָשָׁל 在上下文中是民间流传的格言式说法，不是叙事性比喻；“俗语”比“比喻”更准确，“句”使汉语自然。
- source_word: בְּיִשְׂרָאֵל
  choice: 在以色列
  rationale: 保留原文的地域兼群体范围，指这句俗语在以色列中的流传和使用。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝／主雅威
  rationale: “主耶和华”在简体中文圣经语境中可辨识，并同时保留“主”的称号与 יהוה 的专名功能；不将两者合并为一般称谓。
- issue: 否定誓言结构 אִם יִהְיֶה 的表达
  choice: 必不再
  alternative: 若还会再有
  rationale: 原文形式上以“若……”构成省略式誓言，实际语用为强烈否定。正文传达其确定含义，脚注保留希伯来语形式，避免读者误解为普通条件句。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“我指着我的永生起誓”自然呈现希伯来誓言的功能；“这句俗语”贴合第2节所引民间说法。所有脚注标记均已置于正文相应位置。
