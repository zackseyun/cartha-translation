base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/014.yaml
  text: 'Thus says the Lord GOD: As the whole earth rejoiced[b][a], I will make you desolate.'
translation:
  language: zh_hans
  text: 主耶和华如此说：“全地[a]欢喜时[b]，我必使你荒凉。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “全地”也可译作“全境”或“全世界”；希伯来语 הָאָרֶץ 可按语境指整个大地，也可指某一片土地。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正当全地欢喜，我必使你荒凉。”希伯来语也可理解为比较或伴随关系；其中的动词形式本身不限定时态。
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知宣告中惯用的使者公式，同时符合现代汉语的庄重表达。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别体现 אֲדֹנָי 的主权称号和 יהוה 的专名，并采用中文圣经语境中自然、清楚的组合形式。
- source_word: כִּשְׂמֹחַ
  choice: 欢喜时
  rationale: כְּ 与不定式连用在此最自然地表达时间关系；希伯来语不定式本身不标明过去或现在，因此结合后面的将来审判译作“欢喜时”，避免强加时态。
- source_word: כָּל הָאָרֶץ
  choice: 全地
  rationale: הָאָרֶץ 可指大地、全世界，也可指某片土地；正文采用简洁且较能保留范围弹性的“全地”。
- source_word: שְׁמָמָה אֶעֱשֶׂה לָּךְ
  choice: 我必使你荒凉
  rationale: 将“荒凉”按结果状态处理，准确表达 עשה 加 ל 的致使含义，并保持自然汉语。
theological_decisions:
- issue: 复合神名 אֲדֹנָי יְהוִה 的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “主耶和华”既区分称号与专名，也不把二者合并成重复的“主”；这是现代中文读者熟悉而庄重的表达。
- issue: כִּשְׂמֹחַ 所表达的时间或比较关系
  choice: 全地欢喜时
  alternative: 正如全地欢喜，我必使你荒凉
  rationale: 上下文和未完成式“我必使”支持时间性理解，但 כְ 也可能带比较或伴随意味，因此以脚注保留另一种读法，不将其神学意义单一化。
translation_notes:
  register: 采用现代、庄重而简洁的先知宣告语体。“我必”体现审判宣告的确定性；标点和语序按现代简体中文调整。
