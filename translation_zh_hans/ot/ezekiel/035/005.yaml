  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֗עַן הֱי֤וֹת לְ/ךָ֙ אֵיבַ֣ת עוֹלָ֔ם וַ/תַּגֵּ֥ר אֶת בְּנֵֽי יִשְׂרָאֵ֖ל עַל יְדֵי חָ֑רֶב בְּ/עֵ֣ת אֵידָ֔/ם בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/005.yaml
  text: Because you had an everlasting enmity and delivered the sons of Israel over to the power of the sword at the time of their disaster[a], at the time of the punishment of the end[b],
translation:
  language: zh_hans
  text: 因为你怀有永远的仇恨，在以色列人遭难的时候[a]，在终局的惩罚之时[b]，把他们交在刀剑的权势之下，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文为“以色列的众子”，也可译作“以色列民”。
    reason: 说明原文亲属性的民族群体表达，并保留自然的现代汉语主文译法。
  - marker: b
    text: “终局的惩罚”原文含义较难确定，也可译作“末后的罪孽之时”或“罪责达到尽头的时候”。“罪孽”一词也可指罪责或罪所招致的惩罚。
    reason: 保留עֲוֺן与קֵץ组合在罪孽、罪责和惩罚之间的真实歧义。
lexical_decisions:
- source_word: יַעַן
  choice: 因为
  rationale: 引出本节所述审判的原因，保留明确的因果关系。
- source_word: הֱיוֹת לְךָ אֵיבַת עוֹלָם
  choice: 你怀有永远的仇恨
  rationale: לְךָ与存在式结构表示主体持续具有这种敌意；“怀有”符合现代汉语，“永远的仇恨”保留עולם与איבה的力度。
- source_word: וַתַּגֵּר
  choice: 把他们交在……之下
  rationale: 该使役形式在此语境中表示交付、任其落入刀剑权势；避免采用生硬且语义不清的直译“倾倒”。
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，在现代汉语中通常以“以色列人”自然、准确地表达其民族群体含义。
- source_word: עַל יְדֵי חָרֶב
  choice: 交在刀剑的权势之下
  rationale: 字面为“在刀剑之手上”，是拟人化习语，表示使人落入致命武力的控制；译文既保留刀剑意象，也传达其权势含义。
- source_word: בְּעֵת אֵידָם
  choice: 在以色列人遭难的时候
  rationale: אֵיד表示灾祸、患难；“遭难”在时间结构中自然，并清楚表达灾难临到他们。
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: 就是在末后受罚的时候
  rationale: 这是压缩且含义困难的结构；עָוֹן可指罪孽、罪责，也可指罪所招致的惩罚。正文依审判语境采用“受罚”，并以脚注保留其他可能。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的表达形式
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 此处指整个民族群体；“以色列人”是现代汉语的常规对应，不把男性性别误加于全体成员，同时脚注说明原文的亲属性表达。
- issue: בְּעֵת עֲוֺן קֵץ中עֲוֺן的含义
  choice: 末后受罚的时候
  alternative: 末后的罪孽之时；罪责达到尽头的时候
  rationale: עָוֹן本身可涵盖罪孽、罪责及其刑罚。上下文涉及灾难与刀剑，因此正文采用“受罚”，但不把这一解释说成唯一可能，脚注保留原文的真实歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。为避免连续两个“时候”显得关系松散，以“就是”将第二个时间短语解释为对前一个时刻的进一步界定。经文承接上下文，句末保留逗号。所有脚注标记均置于正文相关词语之后。
