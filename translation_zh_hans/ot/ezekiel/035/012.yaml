  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְֽ/יָדַעְתָּ֮ כִּֽי אֲנִ֣י יְהוָה֒ שָׁמַ֣עְתִּי אֶת כָּל נָאָֽצוֹתֶ֗י/ךָ אֲשֶׁ֥ר אָמַ֛רְתָּ עַל הָרֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֣ר שממה לָ֥/נוּ נִתְּנ֖וּ לְ/אָכְלָֽה־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/012.yaml
  text: Then you will know that I am Yahweh. I have heard all your revilings that you spoke against the mountains of Israel[a], saying, ‘They are desolate; they have been given to us for food.’
translation:
  language: zh_hans
  text: 这样，你就必知道我是耶和华。我听见了你对以色列众山所说的一切辱骂[a]。你说：‘它们已经荒凉，已交给我们吞吃。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切轻蔑的话”，或“一切毁谤”。
    reason: 保留 נָאָצוֹתֶיךָ 所涵盖的轻蔑、侮辱性言语之词义范围。
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: 这样，你就知道
  rationale: 该形式在先知性宣告中表达随审判而来的结果；“这样……就……”自然传达其后果意味，同时保留与上文的连接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: שָׁמַעְתִּי
  choice: 我听见了
  rationale: 希伯来语完成式表示已经发生且与即将施行的审判相关；汉语“听见了”自然保留这一完成意义。
- source_word: נָאָצוֹתֶיךָ
  choice: 你……的一切辱骂
  rationale: 该词指轻蔑、侮辱性的言语；本句直接对象是以色列众山，因此“辱骂”比特指亵渎神的“亵渎话”更稳妥。
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: 攻击以色列众山
  rationale: 介词与敌意言论连用，表示言语所针对的对象；“攻击”明确体现敌对意味。
- source_word: שָׁמֵמָה
  choice: 它们已经荒凉
  rationale: 原文谓语形式为阴性单数，但按集合意义回指以色列众山或其土地；现代汉语用复数代词承接上下文更清楚。
- source_word: נִתְּנוּ לָנוּ לְאָכְלָה
  choice: 已交给我们吞吃
  rationale: 被动式表达被交付，לְאָכְלָה字面涉及吃；“吞吃”保留夺取和占有的形象，比抽象的“供我们占有”更贴近原文。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名。中文正文采用长期通行且可辨识的“耶和华”，保留专名性质，不改译为称号“主”。
- issue: נָאָצוֹתֶיךָ 是否译作“亵渎”
  choice: 辱骂
  alternative: 亵渎的话
  rationale: 这里的言语明确针对以色列众山，词义核心是轻蔑和侮辱；译作“辱骂”避免把经文未明说的直接亵渎对象强加进去，同时上下文仍显明这些话冒犯耶和华。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这样，你就知道”体现先知宣告中的结果关系；直接引语保持简洁有力。“众山”沿用圣经地理表述，并避免将其过度解释为全体以色列民。
