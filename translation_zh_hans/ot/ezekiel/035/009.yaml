  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שִֽׁמְמ֤וֹת עוֹלָם֙ אֶתֶּנְ/ךָ֔ וְ/עָרֶ֖י/ךָ לֹ֣א תישבנה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/009.yaml
  text: I will make you an everlasting desolation[a], and your cities will not be inhabited; then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我必使你永远荒凉[a]，你的城邑必无人居住；你们就知道我是耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“永远成为废墟”，也可按原文复数译作“永远荒凉之地”。原文“荒凉”为复数，可能强调毁坏的彻底。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְמוֹת
  choice: 荒凉
  rationale: 原文为复数名词，可加强彻底毁坏、荒废的意味；中文以抽象名词“荒凉”与“使……永远荒凉”搭配最自然，复数所含的强调意味在脚注中保留。
- source_word: עוֹלָם
  choice: 永远
  rationale: 在审判语境中指持续到不可限定之将来的长久状态；“永远”简明、庄重，并与“荒凉”自然搭配。
- source_word: אֶתֶּנְךָ
  choice: 我必使你
  rationale: נתן 字面义为“给、置于”，此处与表状态的名词连用，表达使对象进入某种境况，译作“使你”准确而自然。
- source_word: וְעָרֶיךָ
  choice: 你的城邑
  rationale: עִיר 指城市或城镇；“城邑”适合先知书语体，既庄重又能涵盖其范围。
- source_word: לֹא תישבנה
  choice: 必无人居住
  rationale: 以“城邑”为主语时，该 Qal 形式自然表示城中不再有人定居；中文用“无人居住”清楚表达，不必机械译成被动式。
- source_word: וִידַעְתֶּם
  choice: 你们就知道
  rationale: 连词在此承接前述审判并表达结果；“就”体现结果关系。原文由前面的第二人称单数转为此处的复数，译文保留“你们”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”等称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文圣经传统及普通读者对“耶和华”的辨识度更高；该译法将其作为专名保留，而不是改译为称号。
- issue: 第二人称数的转换
  choice: 保留“你”到“你们”的转换
  alternative: 全句统一译作“你”
  rationale: 原文 אֶתֶּנְךָ、עָרֶיךָ 为阳性单数，וִידַעְתֶּם 为阳性复数。保留这一张力，避免将单数所指的西珥山与复数所涵盖的居民或群体静默统一。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“城邑”较“城市”更契合古代地理与审判语境；分号呈现审判行动与认识结果之间的推进关系。
