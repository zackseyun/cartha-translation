  text: יַ֣עַן אֲ֠מָרְ/ךָ אֶת שְׁנֵ֨י הַ/גּוֹיִ֜ם וְ/אֶת שְׁתֵּ֧י הָ/אֲרָצ֛וֹת לִ֥/י תִהְיֶ֖ינָה וִֽ/ירַשְׁנ֑וּ/הָ וַֽ/יהוָ֖ה שָׁ֥ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/010.yaml
  text: Because you said[a], ‘These two nations and these two lands will be mine[b], and we will possess them’—though Yahweh was there—
translation:
  language: zh_hans
  text: 因为你说：“这两个国家和这两片土地[a]都必归我，我们必占有它们”——尽管耶和华在那里[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这两个国家”和“这两片土地”也可译作“那两个国家”和“那两片土地”。希伯来语使用定冠词，所指对象由上下文确定。
    reason: lexical_alternative
  - marker: b
    text: “尽管耶和华在那里”也可译作“耶和华在那里”或“当耶和华在那里时”。希伯来语连接词可有不同理解；正文按上下文取让步意味。
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲמָרְךָ
  choice: 因为你说
  rationale: יַעַן引出审判的原因；将带后缀的说话形式自然地译成现代汉语的有限动词从句。
- source_word: שְׁנֵי הַגּוֹיִם
  choice: 这两个国家
  rationale: 保留数目和所指对象的特定性，同时不在正文中擅自指明两国究竟是谁。希伯来语定冠词也可只译作“那两个国家”。
- source_word: שְׁתֵּי הָאֲרָצוֹת
  choice: 这两片土地
  rationale: אֲרָצוֹת在此指领土；“两片土地”既与“两个国家”相配，也避免将其误解为抽象的“大地”。
- source_word: לִי תִהְיֶינָה
  choice: 都必归我
  rationale: 表达以东对这些国家和土地的归属主张；“归我”自然、简洁，并保留所有权意味。
- source_word: וִירַשְׁנוּהָ
  choice: 我们必占有它们
  rationale: ירשׁ表示取得并占有产业或领土；“占有”保留主动夺取、据有的意味。希伯来语宾语后缀为阴性单数，可能把有关土地整体视为一个集合；汉语依前文复数对象译作“它们”更清楚。
- source_word: וַיהוָה שָׁם הָיָה
  choice: 尽管耶和华在那里
  rationale: 语境突出以东的狂妄：即使耶和华在那里，他们仍声称要夺取那地。“尽管”表达语境中的让步意味，而脚注保留连接词的其他可能理解。
theological_decisions:
- issue: 末句וַיהוָה שָׁם הָיָה的逻辑关系
  choice: 尽管耶和华在那里
  alternative: “耶和华也在那里”或“当耶和华在那里时”
  rationale: 希伯来语连接词本身可作并列或按语境理解为让步。正文采用让步读法，以体现以东明知耶和华与那地的关系却仍妄图占有的语势；脚注保留原文的结构歧义。
- issue: “两个国家”和“两片土地”的具体所指
  choice: 正文不点明
  alternative: 犹大和以色列及其领土
  rationale: 上下文有助于判断所指，但本节原文没有直接写出名称，因此译文维持原文的明确程度，不把解释写入正文。
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 采用现代中文圣经读者熟悉的专名形式，使“在那里”的陈述清楚指向以色列的神，同时不把神名改写成称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“都必归我”传达强烈的占有宣称；破折号保留原句末尾插入性、未完待续的审判语势。
