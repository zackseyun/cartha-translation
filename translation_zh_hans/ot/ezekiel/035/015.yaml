base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/015.yaml
  text: 'As you rejoiced over the inheritance of the house of Israel because it was desolate[a], so I will do to you: desolate you will be, Mount Seir, and all Edom, all of it[b]. Then they will know that I am Yahweh.'
translation:
  language: zh_hans
  text: 你怎样因以色列家的产业荒凉而欢喜，我也必怎样待你：西珥山和整个以东，全境都必成为荒场[a]。这样，他们就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“所有以东，全都”，以重复强调以东全境无一例外。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשִׂמְחָתְךָ
  choice: 你……欢喜
  rationale: כְּ表示对应比较；将名词性结构自然转为汉语动词分句，同时保留“怎样……也照样”的报应关系。
- source_word: לְנַחְלַת בֵּית יִשְׂרָאֵל
  choice: 因以色列家的产业
  rationale: נַחֲלָה意为产业、承受之地；介词לְ在此指欢喜所针对的对象或缘由，结合后面的原因从句译为“因……产业……”。
- source_word: עַל אֲשֶׁר שָׁמֵמָה
  choice: 荒凉
  rationale: עַל אֲשֶׁר引出欢喜的缘由；阴性单数形式回指“产业”，中文无需重复代词。
- source_word: כֵּן אֶעֱשֶׂה לָּךְ
  choice: 我也必照样待你
  rationale: כֵּן表达对应性报应；עשה לְ在此自然译作“待”，保留审判语气而避免生硬的“向你行”。
- source_word: שְׁמָמָה תִהְיֶה
  choice: 你必成为荒场
  rationale: שְׁמָמָה是名词而非单纯形容词；“成为荒场”保留其名词性和彻底荒废的审判意象。
- source_word: הַר שֵׂעִיר
  choice: 西珥山
  rationale: 采用现代中文圣经地名的通行音译和语序。
- source_word: וְכָל אֱדוֹם כֻּלָּהּ
  choice: 整个以东，全境都必如此
  rationale: כָּל与复指的כֻּלָּהּ形成强调；以“整个……全境”再现全体性，同时使中文自然。
- source_word: וְיָדְעוּ
  choice: 这样，他们就知道
  rationale: 连接词在语境中表达审判所产生的结果；“这样……就”明确该结果关系而不过度解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来四字神名的常见现代汉语音译处理，保留其专名性质，不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；译作“雅威”保留专名，并避免以“主”这一称号替代。
- issue: 末句“他们”的指向
  choice: 保留第三人称复数“他们”
  alternative: 明确译作“以东人”或泛化为“人”
  rationale: 原文仅用第三人称复数动词，所指可由上下文理解；不在正文中补入原文未明说的群体，以保存其指称张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“怎样……也照样”体现对应报应；“产业”“荒场”保留先知书的土地与审判意象。脚注只说明希伯来文的强调结构，正文中的[a]与脚注相对应。
