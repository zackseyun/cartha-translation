  source_fidelity: 译文整体准确传达了对应性的审判、以色列家产业的荒凉、对西珥山及全以东的审判，以及认识雅威的结果。但首句宜明确表达כְ…כֵּן的“怎样……也怎样……”比较结构；“全境都必如此”虽可由前文补足，却没有直接明示原文对以东所作的“成为荒场”的断言。
  naturalness: 原文中文庄重自然。“西珥山哪”可用，但将西珥山和以东并列为同一审判宣告，句法会更清楚流畅。
