  text: עָרֶ֨י/ךָ֙ חָרְבָּ֣ה אָשִׂ֔ים וְ/אַתָּ֖ה שְׁמָמָ֣ה תִֽהְיֶ֑ה וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/004.yaml
  text: I will make your cities ruins[a], and you will become a desolation; then you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 我要使你的城邑成为废墟；你也必成为荒凉之地。那时你就会知道，我是雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译；传统中文常译作“耶和华”，也有译作“上主”的。
    reason: 说明神名的原文形式及常见中文译法。
lexical_decisions:
- source_word: עָרֶיךָ
  choice: 你的城邑
  rationale: 该词是“城、城镇”的复数形式，带第二人称阳性单数后缀；“城邑”自然保留了复数所指及庄重的先知性语体。
- source_word: חָרְבָּה
  choice: 废墟
  rationale: 此名词表示遭毁坏后的荒废、残破状态；与“使”搭配译为“沦为废墟”，符合现代汉语表达。
- source_word: אָשִׂים
  choice: 我要使……沦为
  rationale: שׂים在此与表语名词构成使役性表达，表示使城邑进入毁坏状态；“使……沦为”兼顾原文结构与自然汉语。
- source_word: וְאַתָּה
  choice: 你也
  rationale: 原文明确使用第二人称代词以加强语气，并从“你的城邑”转向受话者本身；“你也”保留这一推进和强调。
- source_word: שְׁמָמָה
  choice: 荒场
  rationale: 该阴性名词指荒凉、废弃之地或荒废状态；“成为荒场”保留名词性表语及审判宣告的力度。
- source_word: תִהְיֶה
  choice: 必成为
  rationale: היה既可表示“是”，也可表示“成为”；上下文描述审判造成的状态转变，因此译作“成为”，并以“必”体现未完成式在预告中的确定性。
- source_word: וְיָדַעְתָּ
  choice: 那时你就知道
  rationale: 连接词在此引出审判所带来的结果；“那时……就……”以自然汉语表达先知书常见的认知公式。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我是雅威
  rationale: כִּי引出所认识的内容；יהוה是上帝的专名，音译为“雅威”，保留其专名性质及以西结书认知公式的力量。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”较直接地呈现专名，避免以称号替代；脚注同时说明传统译法，以服务熟悉不同中文传统的读者。
- issue: 受审判对象的语法数
  choice: 以单数“你”指称受话者
  alternative: 按其所代表的群体译为“你们”
  rationale: עָרֶיךָ、וְאַתָּה、תִהְיֶה、וְיָדַעְתָּ均为第二人称阳性单数。译文保留单数，不把受话者所代表的西珥山或以东群体提前解释进正文。
translation_notes:
  register: 采用现代、庄重而直接的审判宣告语体。“城邑”“荒场”略具经文语感，但仍为普通读者易懂；分号体现两项审判与随后认知结果之间的层次。
