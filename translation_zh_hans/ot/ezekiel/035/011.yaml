  to: 因此，主耶和华宣告：“我指着我的永生起誓，我必照你的怒气和嫉妒待你；你因恨他们，便把这怒气和嫉妒发泄在他们身上。我审判你时，必在他们中间显明自己[a]。”
  rationale: 仅将“嫉恨”改为“嫉妒”，以区分原文的קִנְאָה（嫉妒／妒忌）和后文的שִׂנְאָה（恨）；并作不改变意义的语句简化。正文保留“在他们中间显明自己”，脚注保留“被认识”及“借着他们”的可行理解，不强行解决语态与介词的歧义。
