source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ וְ/עָשִׂ֗יתִי כְּ/אַפְּ/ךָ֙ וּ/כְ/קִנְאָ֣תְ/ךָ֔ אֲשֶׁ֣ר עָשִׂ֔יתָה מִ/שִּׂנְאָתֶ֖י/ךָ בָּ֑/ם וְ/נוֹדַ֥עְתִּי בָ֖/ם כַּ/אֲשֶׁ֥ר אֶשְׁפְּטֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will deal with you according to your anger and according to your jealousy, which you acted out because of your hatred against them; and I will make myself known through them when I judge you.
translation:
  language: zh_hans
  text: 因此，主耶和华宣告：“我指着我的永生起誓，我必照你的怒气和嫉妒待你；你因恨他们，便把这怒气和嫉妒发泄在他们身上。我审判你时，必在他们中间显明自己[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必在他们中间被认识”，或“我必借着他们显明自己”。
    reason: וְנוֹדַעְתִּי的Nifal语态以及בָם的介词作用均容许这些译法。
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 承接上文的控诉，引出相应的审判后果。
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是上帝庄严的第一人称起誓公式；此译比直译“我活着”更符合现代汉语，同时保留誓言性质。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: נְאֻם采用先知文体中自然庄重的“宣告”；复合称号以“主耶和华”避免重复为“主主”，并保留神名。
- source_word: וְעָשִׂיתִי כְּאַפְּךָ וּכְקִנְאָתְךָ
  choice: 我必照你的怒气和嫉恨待你
  rationale: כְ表示与其行为相称的报应；省略宾语的עשה在审判语境中译作“待你”自然明确。
- source_word: אֲשֶׁר עָשִׂיתָה מִשִּׂנְאָתֶיךָ בָּם
  choice: 你因恨他们，便把这怒气和嫉恨发泄在他们身上
  rationale: מן表达原因或来源；“发泄在……身上”自然传达将敌对情绪付诸行动，而不把עשה弱化为单纯内心感受。
- source_word: וְנוֹדַעְתִּי בָם
  choice: 必在他们中间显明自己
  rationale: ידע的Nifal在此可表达被认识或主动显明；“显明自己”保留上帝借审判彰显自身的含义，בם主译为空间或群体范围“在他们中间”。
- source_word: כַּאֲשֶׁר אֶשְׁפְּטֶךָ
  choice: 我审判你的时候
  rationale: כַּאֲשֶׁר在此自然理解为时间关系，说明上帝显明自己的时机。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威；主上帝
  rationale: 采用现代中文圣经读者熟悉且庄重的“耶和华”，保留专名性质；不以普通称谓完全取代四字神名。
- issue: וְנוֹדַעְתִּי בָם 的语态和介词含义
  choice: 在他们中间显明自己
  alternative: 在他们中间被人认识；借着他们显明自己
  rationale: Nifal可有“被认识”或带反身意味的“显明自己”，בם也可能表示“在他们中间”或“借着他们”。正文选较自然且不过度限定机制的译法，脚注保留真实歧义。
- issue: 相称报应的表达
  choice: 照你的怒气和嫉恨待你
  alternative: 像你的怒气和嫉恨那样行事
  rationale: 这里的כְ表示审判与以东所表现的敌意相称；译文不把这理解为上帝具有同样罪性的情绪，而忠实保留审判措辞的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。引语按中文习惯处理；“发泄在……身上”清楚表达敌意付诸行动。“主耶和华”保留传统中文神名形式。
