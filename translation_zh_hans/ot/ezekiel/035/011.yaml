  terminology: “主耶和华”恰当保留复合神圣称号和专名；“永生起誓”适切表达庄严誓言公式。“怒气、嫉妒、恨”应分别对应原文的אַף、קִנְאָה、שִׂנְאָה，避免术语重叠。
