base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/007.yaml
  text: I will make Mount Seir a desolation and a waste[a], and I will cut off from it those who pass through and return.
translation:
  language: zh_hans
  text: 我要使西珥山成为荒凉和废墟；我要从那里剪除一切来往的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“经过的和返回的”；这两个希伯来语分词也可能用往返两端概括所有经过这地的人或一切通行活动。
    reason: 保留עֹבֵר וָשָׁב的字面结构及其可能的两端概括用法。
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要使
  rationale: נתן本义为“给、置于”，但在“使某地成为荒凉”的结构中表达造成某种状态；译为“使”符合现代汉语，也保留其作用力。
- source_word: הַר שֵׂעִיר
  choice: 西珥山
  rationale: 按希伯来文保留专名及הַר“山”；这是现代中文圣经语境中通行、清楚的地名形式。
- source_word: לְשִׁמְמָה וּשְׁמָמָה
  choice: 荒凉，成为废墟
  rationale: 原文并列两个近义的荒废用语以加强审判语气。中文分别用“荒凉”和“废墟”承载其重复强化效果，避免压缩成单一概念。
- source_word: וְהִכְרַתִּי
  choice: 我要……剪除
  rationale: כרת的使役式在审判语境中常指“剪除、除灭”。“剪除”保留原文意象与审判力度，又不擅自规定具体方式。
- source_word: מִמֶּנּוּ
  choice: 从那里
  rationale: 代词回指作为地域的西珥山；现代汉语以地点指示词“那里”比“从它”自然。
- source_word: עֹבֵר וָשָׁב
  choice: 一切来往的人
  rationale: 两个分词直指“经过的”和“返回的”；合用可能是概括当地所有通行活动的两端表达。译作“一切来往的人”自然地传达总体意义，同时以脚注保留较逐字的理解。
theological_decisions:
- issue: 荒废用语的重复及其审判力度
  choice: 以“荒凉，成为废墟”分别表达两个并列用语
  alternative: 合并译作“彻底荒凉”
  rationale: 保留原文的重复强化修辞，同时不在文本中添加原文没有说明的审判方式或神学结论。
- issue: עֹבֵר וָשָׁב所指的范围
  choice: 译作“一切来往的人”，视为概括所有通行者的表达
  alternative: 较逐字译作“经过并返回的人”或“经过的和返回的”
  rationale: 原文分词组合可表示往返两端或各种通行活动；正文采用自然而可能性较高的总括表达，脚注注明其字面形式，以保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“西珥山”“剪除”保留先知审判宣告的经文语域；其余措辞避免生硬直译。
