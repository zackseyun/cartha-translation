  text: וַ/תַּגְדִּ֤ילוּ עָלַ/י֙ בְּ/פִי/כֶ֔ם וְ/הַעְתַּרְתֶּ֥ם עָלַ֖/י דִּבְרֵי/כֶ֑ם אֲנִ֖י שָׁמָֽעְתִּי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/013.yaml
  text: And with your mouth you magnified yourselves against me[a], and multiplied your words against me[b]; I myself have heard.
translation:
  language: zh_hans
  text: 你们用口向我自夸[a]，又增多了攻击我的话[b]；我亲自听见了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向我夸口”。希伯来文直译为“用你们的口向我使自己显为大”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“又堆积了许多攻击我的话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגְדִּילוּ
  choice: 妄自尊大
  rationale: 该词是 גדל 的使役词形，在这里与“口”和“攻击我”连用，表示以言语自高、自夸。“妄自尊大”既传达自我抬高的意象，也符合敌对言语的语境。
- source_word: עָלַי
  choice: 向我／攻击我的
  rationale: 介词 עַל 在本节敌对言语的语境中表示针对、反对，而不只是“谈论我”。中文按所在分句分别译作“向我”和“攻击我的”，以求自然并保留敌对含义。
- source_word: בְּפִיכֶם
  choice: 口出狂言
  rationale: 原文直译为“用你们的口”。中文用“口出狂言”保留“口”的具体意象，并自然表达其狂妄言辞；“狂”由自高和敌对的上下文支持。
- source_word: וְהַעְתַּרְתֶּם
  choice: 又加增了
  rationale: 此处使役词形表示使之众多、增多。“加增”较贴近原文数量增加的表达，同时避免把“堆砌”这一更具画面的解释直接写入正文。
- source_word: דִּבְרֵיכֶם
  choice: 话
  rationale: דבר 在此指说出的话语；译作现代中文常用的“话”，与前句口头言语的意象相呼应。
- source_word: אֲנִי שָׁמָעְתִּי
  choice: 我亲自听见了
  rationale: 独立人称代词 אֲנִי 带有强调作用。“我亲自”体现这一强调，“听见了”保留完成动作及其审判语境中的确定性。
theological_decisions:
- issue: 狂妄言语是针对上帝还是仅仅谈论上帝
  choice: 译为直接向上帝妄自尊大，并说出攻击上帝的话
  alternative: 译为一般性的“在谈到我时说骄傲的话”
  rationale: 两次出现的 עָלַי，连同自高和增多言语的动词，在本段语境中表明这是敌对上帝的言论。译文保留这种直接冒犯的严重性，但不增添经文以外的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“口出狂言”使希伯来文“用口自高”的表达在中文中自然可读；分号突出末句上帝亲自听见并知悉这些话的审判语气。
