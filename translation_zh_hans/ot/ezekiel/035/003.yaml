source:
  edition: WLC
  text: וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י אֵלֶ֖י/ךָ הַר שֵׂעִ֑יר וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/ךָ שְׁמָמָ֥ה וּ/מְשַׁמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/003.yaml
  text: 'and say to it[a], ‘Thus says the Lord GOD: Behold, I am against you, Mount Seir, and I will stretch out my hand against you and make you a desolation and a waste.’'
translation:
  language: zh_hans
  text: 你要对它说：“主耶和华如此说：‘看哪，西珥山，我与你为敌。我要伸手攻击你，使你成为荒凉、废弃之地[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “废弃之地”或译“令人惊骇之地”；这个词既可指毁坏、荒废，也可强调这种毁坏所引起的惊骇。
    reason: 保留 וּמְשַׁמָּה 在“荒废”与“令人惊骇”之间的词义张力。
lexical_decisions:
- source_word: וְאָמַרְתָּ לּוֹ
  choice: 你要对它说
  rationale: 阳性单数代词所指的是被拟人化的西珥山；中文用“它”指地理实体，同时直接引语保留拟人效果。
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 分别保留 אֲדֹנָי 的“主”和神圣专名 יְהוָה 的传统中文形式“耶和华”，并避免译成重复的“主”。
- source_word: הִנְנִי אֵלֶיךָ
  choice: 看哪，我与你为敌
  rationale: הִנְנִי 引出庄严的宣告；在审判语境中，אֵלֶיךָ 表示敌对，故译为“我与你为敌”，不额外加入原文未明说的行动时态。
- source_word: הַר שֵׂעִיר
  choice: 西珥山
  rationale: 采用现代中文圣经地名惯例，并保留原文把该地区作为一座山直接称呼的表达。
- source_word: וְנָטִיתִי יָדִי עָלֶיךָ
  choice: 我要伸手攻击你
  rationale: 保留“伸手”这一审判隐喻；“攻击”清楚表达 עַל 在此处的敌对方向。
- source_word: וּנְתַתִּיךָ
  choice: 使你
  rationale: 在后接毁坏状态的名词时，该动词表示使受词成为某种状态；“使你”简洁自然。
- source_word: שְׁמָמָה
  choice: 荒凉
  rationale: 表达土地遭毁坏、无人居住的状态，与后面的近义名词形成递进。
- source_word: וּמְשַׁמָּה
  choice: 成为废墟
  rationale: 在正文中取毁坏、荒废之义，与“荒凉”并列而不完全重复；其也可能含有令人惊骇的结果，收入脚注。
theological_decisions:
- issue: 复合称号 אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “主耶和华”是简体中文读者熟悉且庄重的表达，既保留“主”的称号，也以专名形式呈现四字神名；“雅威”更接近一种学术重构读音，但并非原文可完全确定的发音。
- issue: הִנְנִי אֵלֶיךָ 所表达的敌对宣告
  choice: 看哪，我与你为敌
  alternative: 看哪，我要攻击你
  rationale: 直译保留神亲自与西珥山敌对的庄严宣告，也避免把存在性、关系性的表达缩减为单一行动。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告体。“看哪”保留原文郑重的提示语气；直接称呼“西珥山”维持拟人化。标点将敌对宣告与随后的审判行动分开，使中文朗读清晰。
