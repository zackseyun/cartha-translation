  yaml_path: translation/ot/ezekiel/035/002.yaml
  text: Son of man[a], set your face against Mount Seir and prophesy against it.
translation:
  language: zh_hans
  text: “人子[a]，你要面向西珥山，发出攻击它的预言。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必死的人。”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的称呼；采用“人子”既保留希伯来语形式和全书反复出现的用语，也避免把含义过早限定为“必死的人”。
- source_word: שִׂים פָּנֶיךָ עַל
  choice: 面向……
  rationale: 原文直译为“把你的脸朝向/对着”。现代汉语用“面向”自然地保留“脸朝向目标”的具体意象；敌对意味则由下文“攻击”明确表达。
- source_word: הַר שֵׂעִיר
  choice: 西珥山
  rationale: 这是专有地名；“西珥山”符合通行的汉语圣经地名译法，也准确对应单数短语。
- source_word: וְהִנָּבֵא
  choice: 发预言
  rationale: 该动词是先知宣告信息的标准用语；“发预言”在现代汉语中清楚、庄重，并保持命令语气。
- source_word: עָלָיו
  choice: 攻击它
  rationale: 介词在审判性预言的语境中带敌对含义；代词的先行词是“西珥山”，汉语以“它”指称该山及其所代表的地域最自然。
theological_decisions:
- issue: בֶּן אָדָם 的称呼应保留为固定表达，还是解释为强调必死性的人
  choice: 正文译作“人子”
  alternative: “必死的人”或“世人”
  rationale: 原文表达既可突出受造者的人性，也在《以西结书》中形成固定称呼。正文保留形式上的反复，脚注提供解释性译法，不将神学含义单一化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“面向”保留希伯来语“把脸朝向”的意象；“发预言攻击它”清楚呈现审判性宣告。正文与脚注标记完全对应。
