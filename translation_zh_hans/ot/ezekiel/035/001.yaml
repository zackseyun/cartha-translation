  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 这里的连续式用于推进叙事；在固定先知公式中，其事件意义自然融入“……的话临到我”，无需另译为“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在“耶和华的话”这一先知公式中，指来自上帝的特定启示；“话”既贴近原文，也保留圣经先知文体的惯用表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文是四字神名יהוה。采用现代中文圣经读者熟悉的专名“耶和华”，不以“主”这一称号替代。
- source_word: אֵלַי
  choice: 临到我
  rationale: 介词及第一人称单数后缀本义为“向我／到我这里”；与דְבַר יהוה共同构成中文自然的固定表达“耶和华的话临到我”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接话语；译作“说”简洁自然，并保留原文的引语衔接功能。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用以色列上帝的专名，而非“主”这一称号。正文采用简体中文圣经传统中辨识度最高的“耶和华”；“雅威”较接近学界常见的拟音，但并无完全确定的古代读音，故不据此替换通行形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留先知书反复出现的公式化节奏。“耶和华的话临到我，说”清楚、简练，适合与下一节的直接命令衔接。
