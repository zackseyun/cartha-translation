base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/008.yaml
  text: And I will fill its mountains with its slain; on your hills[a], in your valleys, and in all your ravines, those slain by the sword will fall.
translation:
  language: zh_hans
  text: 我要使它的山岭满是被杀的人；在你的山冈、谷地[a]和所有沟壑中，被刀剑杀的人必倒下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷地”或译“高地”。这里所用的希伯来词含义不很确定；结合前后的地貌词，也可理解为低洼的谷地。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתִי
  choice: 我要使……满是
  rationale: 连词 וּ 保留为承接上文的语气；完成式用于先知宣告时表达确定将发生之事，因此以将来语义翻译。“使……满是”自然传达“填满”的结果。
- source_word: הָרָיו
  choice: 它的山岭
  rationale: 第三人称阳性单数后缀指西珥山或以东这一地域实体；译作“它的”保留原文随后转为第二人称直接称呼的变化。
- source_word: חֲלָלָיו
  choice: 被杀的人
  rationale: חָלָל 通常指遭暴力杀害、尤其在战争中被杀的人；此处中文不重复生硬的所属代词，但由“它的山岭”所限定的地域关系仍然清楚。
- source_word: גִּבְעוֹתֶיךָ
  choice: 你的冈陵
  rationale: 该词通常指丘陵；“冈陵”与山岭、谷地、沟壑组成自然的地貌描写，也避免误加祭祀“邱坛”的含义。
- source_word: גֵאוֹתֶיךָ
  choice: 你的谷地
  rationale: 在冈陵与沟壑并列的地形语境中，取“谷地”义最连贯；因该词也可能表示高地，另以脚注保留歧义。
- source_word: אֲפִיקֶיךָ
  choice: 你所有的沟壑
  rationale: 该词可指水道、河床或峡沟；“沟壑”侧重此处受审判之土地的地貌，不暗示其中必有流水。
- source_word: חַלְלֵי חֶרֶב
  choice: 被刀剑杀的人
  rationale: 以现代汉语自然表达该结构短语，同时保留刀剑作为致死手段的战争意象。
- source_word: יִפְּלוּ בָהֶם
  choice: 在……中，必有……倒下
  rationale: 明确译出 בָהֶם 对前述冈陵、谷地和沟壑的地点回指；“倒下”保留 נפל 的具体意象。
theological_decisions:
- issue: 西珥山称谓由第三人称转为第二人称
  choice: 保留“它的山岭”与“你的冈陵……”之间的人称转换
  alternative: 全句统一译作第二人称“你的”
  rationale: 原文确有第三人称后缀转为第二人称后缀的变化；保留这一转换，不把拟人化地域的表达静默整平。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“满是”“倒下”保留审判宣告的鲜明画面；地貌词选用普通读者易懂的“山岭、冈陵、谷地、沟壑”。
