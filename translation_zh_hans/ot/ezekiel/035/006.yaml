base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/006.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will make you blood, and blood will pursue you. Surely you have not hated blood[b], so blood will pursue you.
translation:
  language: zh_hans
  text: 所以[a]，主耶和华宣告：“我指着我的永生起誓，我必使你成为血，血必追赶你。你既不恨恶流血之事[b]，血就必追赶你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所以”承接上文以东因长久怀恨而使以色列人流血的罪行。
    reason: discourse_context
  - marker: b
    text: 原文仍作“血”；这里可指流血杀人，也可能含有血债、血罪的意味。全节反复使用“血”形成双关。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的控诉，引出作为后果的审判；现代汉语中自然明确。
- source_word: חַי אָנִי
  choice: 我指着我的永生起誓
  rationale: 这是上帝以自己的生命起誓的先知性誓言公式；译出“起誓”可在现代汉语中清楚传达其语用力量。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 主耶和华宣告
  rationale: נְאֻם译为“宣告”，保留先知神谕公式；אֲדֹנָי יְהוִה译为传统且清楚的“主耶和华”。
- source_word: לְדָם אֶעֶשְׂךָ
  choice: 我必使你成为血
  rationale: 尽量保留希伯来文突兀而浓缩的表达，并维持本节反复使用דָם所形成的“血／流血／血债”双关。
- source_word: דָם
  choice: 血／流血之事
  rationale: 多数位置直译“血”以保留重复修辞；在שָׂנֵאתָ的宾语位置译作“流血之事”，使其所指的暴力杀戮在汉语中清楚，同时用脚注说明原文仍是同一个“血”字。
- source_word: יִרְדֲּפֶךָ
  choice: 必追赶你
  rationale: 准确表达רדף的追逐、紧逼之意，并保留两次出现的审判性复沓。
- source_word: אִם לֹא
  choice: 既不
  rationale: 这里与其视为普通条件句，更适合作强调或因果性的表达；“既不……就……”自然呈现罪行与报应之间的关系，同时不把语气过度绝对化。
theological_decisions:
- issue: אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主雅威／主上帝
  rationale: “主耶和华”是现代中文圣经语境中广为人知的合称，既区分אֲדֹנָי与יהוה，也不在正文中引入特定宗派解释。
- issue: “血”作为报应与血债意象
  choice: 保留“成为血”“被血追赶”的拟人化和双关
  alternative: 解释性译作“使你遭受杀戮／血债必追讨你”
  rationale: 原文刻意反复使用דָם，可能同时唤起鲜血、流血和血债；正文保留张力，避免只选定其中一种神学或法律含义。
- issue: אִם לֹא的逻辑关系
  choice: 按因果兼强调理解为“既不……就……”
  alternative: 按誓言性强调译为“你确实不恨恶……”或较直译为“若不是……”
  rationale: 上下文说明以东不憎恶流血，因此遭到相应审判；该译法表达这一逻辑，同时脚注不必强行消除原式的语气空间。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“我指着我的永生起誓”传达古代誓言公式；保留“成为血”“血追赶你”的强烈先知性意象，并借脚注解释其多重含义。所有脚注标记均已置于正文。
