base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/027.yaml
  text: Her princes within her are like wolves tearing prey[a], to shed blood, to destroy lives[b], in order to gain dishonest profit.
translation:
  language: zh_hans
  text: 她中间的首领如同撕裂猎物的狼，为要流人的血、夺人的性命，以谋取不义之财[b]。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “人的性命”也可译作“人”或“人的生命”；希伯来语 נְפָשׁוֹת 依语境可指人、性命或魂。
    reason: lexical_alternative
  - marker: b
    text: “谋取不义之财”也可译作“取得不正当利益”或“靠勒索获利”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: 她当中的首领
  rationale: שַׂר可指君王之下的首领、官长或统治者；“首领”保留其政治权力色彩，又比“王子”更符合本段对耶路撒冷掌权者的指控。后接“她当中”表达בְּקִרְבָּהּ，并保留原文以阴性代词指称城市的表达。
- source_word: כִּזְאֵבִים טֹרְפֵי טָרֶף
  choice: 如同撕裂猎物的狼
  rationale: 比较词כְּ引出明喻；分词与同根宾语טֹרְפֵי טָרֶף形成强烈的捕食图像。“撕裂猎物”既保留暴力感，也符合现代汉语。
- source_word: לִשְׁפָּךְ דָּם
  choice: 为要流人的血
  rationale: 这是表示暴力杀人的希伯来语惯用语。“流人的血”在中文圣经语体中清楚而庄重；“为要”对应不定式所表达的目的或趋向。
- source_word: לְאַבֵּד נְפָשׁוֹת
  choice: 灭掉人的性命
  rationale: נֶפֶשׁ复数在此处指活人或人的生命，并非专门论述非物质的灵魂。“人的性命”与流血的社会暴力语境相符，同时脚注保留其他可译范围。
- source_word: לְמַעַן בְּצֹעַ בָּצַע
  choice: 好谋取不义之财
  rationale: לְמַעַן表明目的；בצע的不定式与同根名词连用，强调贪婪地取得利益，且语境显示这种所得不义并伴随暴力。“谋取不义之财”自然地传达经济动机和道德败坏。
theological_decisions:
- issue: 审判语境中נְפָשׁוֹת的含义
  choice: 译作“人的性命”，指遭毁灭的人或生命
  alternative: 译作“人”或“魂”
  rationale: 上下文谴责掌权者流血害命，焦点是具体的人命与社会暴行。译作“性命”避免把本节变成关于灵魂构成的教义陈述，同时以脚注保留该词的语义幅度。
- issue: 暴力行为与牟利目的之间的关系
  choice: 以“为要……好……”保留连续的目的表达
  alternative: 译成描述性分句“流血、害命，并谋取……”
  rationale: 原文לִשְׁפָּךְ、לְאַבֵּד以及לְמַעַן共同突出这些首领施暴以牟利的目的结构；中文采用目的连词，避免仅将其弱化为同时发生的行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留希伯来原文从狼撕猎物，到流血害命，再到贪利动机的递进；避免使用可能把שַׂר误解为君王之子的“王子”，也避免把נֶפֶשׁ窄化为特定的人论教义。
