  text: וָ/אֲבַקֵּ֣שׁ מֵ/הֶ֡ם אִ֣ישׁ גֹּֽדֵר גָּדֵר֩ וְ/עֹמֵ֨ד בַּ/פֶּ֧רֶץ לְ/פָנַ֛/י בְּעַ֥ד הָ/אָ֖רֶץ לְ/בִלְתִּ֣י שַׁחֲתָ֑/הּ וְ/לֹ֖א מָצָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/030.yaml
  text: And I sought among them for a man who would build up a wall and stand in the breach before me on behalf of the land[a], so that I would not destroy it[b], but I found none.
translation:
  language: zh_hans
  text: 我在他们中间寻找一个人[b]，能筑起墙垣，在我面前为这地站在破口中[a]，使我不毁灭这地；可是，我一个也没有找到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “破口”指墙垣上的缺口；“站在破口中”描绘站在墙的缺口处加以守护、介入。也可译作“站在缺口处”。
    reason: lexical_alternative
  - marker: b
    text: 原文“一个人”采用阳性单数形式，也可能具有代表性用法。
    reason: source_form
lexical_decisions:
- source_word: וָאֲבַקֵּשׁ מֵהֶם
  choice: 我在他们中间寻找
  rationale: בקש 表示“寻找”，מן 加代词表示从该群体之中寻找。中文用“在他们中间寻找”自然地表达这一范围，并保留句首连续叙述的语气。
- source_word: אִישׁ
  choice: 一个人
  rationale: אִישׁ 是阳性单数；“一个人”既保留单数，也避免在现代汉语中无必要地把代表性用法限定为成年男性。其阳性形式在脚注中说明。
- source_word: גֹּדֵר גָּדֵר
  choice: 筑起墙垣
  rationale: 同根动词与名词连用，描绘筑墙或修补防御墙垣。“筑起墙垣”保留具体意象，同时避免生硬重复。
- source_word: וְעֹמֵד בַּפֶּרֶץ
  choice: 站在破口中
  rationale: פֶּרֶץ 是墙垣的裂口、缺口；直译为“破口”可与前面的墙垣意象衔接，并保留防护和介入的双重意味。
- source_word: לְפָנַי בְּעַד הָאָרֶץ
  choice: 在我面前为这地挺身而出
  rationale: לְפָנַי 是“在我面前”，בְּעַד 表示为某对象、代表某对象。“挺身而出”在中文中自然表达站在破口保护这地的行动，但不把它缩减为单指祷告。
- source_word: לְבִלְתִּי שַׁחֲתָהּ
  choice: 使我不毁灭这地
  rationale: 该结构表达目的或阻止的结果；阴性单数后缀回指“这地”。重复“这地”比使用可能指代不清的“它”更自然明确。
- source_word: וְלֹא מָצָאתִי
  choice: 可是，我一个也没有找到
  rationale: וְ 形式上是连接词，但此处表达寻找与结果之间的悲剧性转折。“一个也没有找到”明确回指所寻找的那个人。
theological_decisions:
- issue: 防御墙垣与代求意象的关系
  choice: 同时保留“墙垣”“破口”“在我面前”和“为这地挺身而出”
  alternative: 直接译成“找一个人为这地代求”
  rationale: 希伯来文将城防意象与在上帝面前代表这地的行动结合起来。译文不把经文仅解释为修筑工程，也不把它预先限定为祷告，从而保留其神学张力。
- issue: אִישׁ 的性别与代表性
  choice: 正文译作“一个人”，脚注说明原文为阳性单数
  alternative: 译作“一个男人”
  rationale: 现代汉语“一个人”能够忠实表达单数个体，且可承载原文可能具有的代表性用法；脚注保留其语法性别信息，避免无声抹平。
- issue: 上帝不毁灭这地的条件性表达
  choice: 译作“使我不毁灭这地”
  alternative: 译作“阻止我毁灭这地”
  rationale: 原文表达寻找此人的目的及毁灭得以避免的可能，并未直说此人以强制方式阻止上帝；所选译法保留这一关系而不过度推演。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“墙垣—破口”的连续图像承载先知性语言；“挺身而出”使中文通顺，同时由“在我面前”“为这地”保留代表与代求的可能含义。脚注标记均置于相应词语之后。
