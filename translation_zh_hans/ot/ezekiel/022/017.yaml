  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 此处是先知书常见的叙事承接语，与后面的“话”合译为“话临到”，比逐字译作“事情发生了”更符合现代汉语，也保留固定启示公式。
- source_word: דְבַר
  choice: 话
  rationale: 在固定表达“耶和华的话”中译作“话”，既贴近原词，又自然体现来自上帝的启示。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 原文使用四字神名；中文采用广为人知的传统音译“耶和华”，将其作为专名呈现，而不以称号代替。
- source_word: אֵלַי
  choice: 我
  rationale: 与“临到”搭配，介词和第一人称单数后缀自然译为“临到我”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接引语；“说”简洁自然，并保留先知宣告的庄重节奏。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。正文采用现代中文圣经读者最熟悉的专名形式“耶和华”；不译作“上主”，以免把专名替换为称号。
translation_notes:
  register: 采用现代、庄重而通顺的先知书语体。“耶和华的话临到我，说”保留原文固定启示公式及其简洁节奏；本节无须脚注。
