base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/024.yaml
  text: Son of man[a], say to her[c][b], ‘You are a land not cleansed and not rained on in the day of indignation.’
translation:
  language: zh_hans
  text: “人子啊，你要对她说：‘你这地未得洁净[a]，在震怒之日[c]，雨没有降在你身上[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有被洁净”或“仍不洁净”。希伯来语分词既可强调未曾得到洁净，也可描述不洁净的状态。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语在这里用词罕见，也可译作“没有降过雨”或“未受雨水浇灌”。
    reason: lexical_alternative
  - marker: c
    text: “震怒”也可译作“愤怒”；原文没有明说是谁的震怒。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 这是《以西结书》中上帝对先知惯用的单数称呼；采用“人子”既保留希伯来语形式，也符合中文圣经语体。
- source_word: אֱמָר לָהּ
  choice: 你要对她说
  rationale: 保留命令式以及阴性单数代词；下文表明“她”指拟人化的“地”。
- source_word: אַתְּ אֶרֶץ
  choice: 你这地
  rationale: 希伯来语以阴性单数“你”直接称呼“地”。中文用“你这地”自然呈现直接呼语和拟人效果，而不额外加定冠意义。
- source_word: לֹא מְטֹהָרָה
  choice: 未得洁净
  rationale: 被动分词表达尚未被洁净或处于不洁净状态；“未得洁净”保留被动意味及礼仪—道德层面的开放性。
- source_word: לֹא גֻשְׁמָהּ
  choice: 没有雨水降在你上面
  rationale: 这个罕见形式通常联系“雨、降雨”理解，并带被动意味。此译法在现代中文中清楚自然，同时不把雨水解释成明确的洁净手段。
- source_word: בְּיוֹם זָעַם
  choice: 在震怒之日
  rationale: זַעַם表示强烈的愤怒或震怒；该译法保留先知审判语气，又不在正文中明说震怒者是谁。
theological_decisions:
- issue: 土地的污秽与无雨之间的关系
  choice: 并列呈现土地未得洁净以及震怒之日没有降雨这两重描述
  alternative: 把无雨明确解释为没有洁净之雨，或仅把全句理解为道德污秽的比喻
  rationale: 希伯来文将两个否定谓语并列，但没有明说雨是否具有洁净作用。译文保留礼仪／道德污秽、实际干旱和审判意象之间的张力。
- issue: “震怒”所属者
  choice: 不在正文中补出“上帝的”
  alternative: 译作“在上帝震怒之日”
  rationale: 上下文指向神的审判，但本节希伯来文本身没有明示领属关系，因此不在译文中补足。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“人子”“震怒之日”保留先知书的传统庄严语感；“你这地”和“没有雨水降在你上面”则避免生硬直译。脚注标记均置于相关正文之后。
