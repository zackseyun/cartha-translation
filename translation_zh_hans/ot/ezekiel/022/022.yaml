source:
  edition: WLC
  text: כְּ/הִתּ֥וּךְ כֶּ֨סֶף֙ בְּ/ת֣וֹךְ כּ֔וּר כֵּ֖ן תֻּתְּכ֣וּ בְ/תוֹכָ֑/הּ וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה שָׁפַ֥כְתִּי חֲמָתִ֖/י עֲלֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/022.yaml
  text: As silver is melted in the midst of a furnace[a], so you will be melted in the midst of it; and you will know that I, Yahweh, have poured out my wrath on you.
translation:
  language: zh_hans
  text: 银子怎样在熔炉中熔化，你们也必照样在其中[a]熔化；你们必知道，是我——雅威——已将我的烈怒倾倒在你们身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中”按上下文指耶路撒冷城；也可译作“在城中”。
    reason: 说明代词所指，并保留正文中原有的含蓄表达。
lexical_decisions:
- source_word: כְּהִתּוּךְ כֶּסֶף
  choice: 银子怎样……熔化
  rationale: 比较结构כְּ与名词性表达“熔化”共同构成比喻。译作“银子怎样……熔化”既自然，也保留原文“怎样……照样……”的对应关系和被动含义。
- source_word: בְּתוֹךְ כּוּר
  choice: 在熔炉中
  rationale: כּוּר指熔炼金属的炉子；“熔炉”准确保留金属冶炼的意象，也符合现代汉语表达。
- source_word: כֵּן תֻּתְּכוּ
  choice: 你们也必照样……熔化
  rationale: כֵּן与前面的比较结构呼应；תֻּתְּכוּ是第二人称复数被动式。“必”表达预告之事的确定性，“熔化”延续同一审判比喻。
- source_word: בְתוֹכָהּ
  choice: 在其中
  rationale: 保留阴性单数代词的含蓄指代，不在正文中直接补出“城”；按近处语境，该词指耶路撒冷。
- source_word: וִידַעְתֶּם
  choice: 你们就知道
  rationale: 这是《以西结书》常见的认知公式。“就”自然表达审判发生后所带来的认识，同时不额外扩展其神学意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，而不以“主”等称号替代。
- source_word: שָׁפַכְתִּי
  choice: 已将……倾倒
  rationale: 希伯来语完成式呈现行动为已经落实或确定完成；“已”保留完成意义，“倾倒”则保存原文的强烈具象表达。
- source_word: חֲמָתִי
  choice: 我的烈怒
  rationale: חֵמָה指炽烈的愤怒。“烈怒”既体现强度，又符合先知审判宣告的庄重语域。
- source_word: עֲלֵיכֶם
  choice: 在你们身上
  rationale: 自然对应介词עַל在倾倒与审判语境中的用法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”，以汉语音译保留神的专名，并避免用称号替换；“耶和华”是传统形式，但与通常重建的读音距离较远。
- issue: בְתוֹכָהּ所指对象
  choice: 正文保留“其中”，脚注说明指耶路撒冷
  alternative: 正文直接译为“在耶路撒冷城中”
  rationale: 阴性单数后缀按上下文指向耶路撒冷这座城，但原文本节并未重说城名。保留代词可忠实呈现原文的指代方式，脚注则帮助读者确认近处语境。
- issue: שָׁפַכְתִּי的时间与体貌
  choice: 已将……倾倒
  alternative: 将要把……倾倒；倾倒了
  rationale: 完成式可从未来认知点回看为已完成的审判行动，也可能带有先知式确定性。“已将”保留完成视角，不把它明确改写成单纯将来时。
translation_notes:
  register: 采用现代、庄重而清晰的普通话。以“怎样……也必照样……”呈现希伯来语比喻结构；重复“熔化”以保持原文修辞连贯。正文不补入未明说的“耶路撒冷”，而由脚注交代。
