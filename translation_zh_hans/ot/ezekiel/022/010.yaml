source:
  edition: WLC
  text: עֶרְוַת אָ֖ב גִּלָּה בָ֑/ךְ טְמֵאַ֥ת הַ/נִּדָּ֖ה עִנּוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/010.yaml
  text: In you they uncover a father's nakedness[c][b][a]; in you they violate a woman in her menstrual impurity.
translation:
  language: zh_hans
  text: 在你中间，有人露了父亲的下体[a][b]；在你中间，他们凌辱经期不洁的女子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“露父亲的下体”，是《利未记》性禁令中表示不正当性关系的惯用语；参利未记18:7。
    reason: cross_reference
  - marker: b
    text: “在你中间”也可译作“在你里面”。原文以阴性单数“你”称呼拟人化的耶路撒冷。
    reason: lexical_alternative
  - marker: c
    text: 原文指因月经而处于礼仪不洁状态的女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת אָב
  choice: 父亲的下体
  rationale: 原文直译为“父亲的下体”，属于《利未记》性禁令中的固定表达，指向不正当的性关系。正文保留这一法律性惯用语，以维持与利未记文本的互文联系，不擅自把所涉及的女子具体化。
- source_word: גִּלָּה
  choice: 有人露了
  rationale: 该动词为阳性单数，在这里可作不定主体或群体中的个体理解。译作“有人”既符合形态，也与本章对城中居民逐项控诉的语境相称。
- source_word: בָךְ
  choice: 在你中间
  rationale: 原文是带阴性单数第二人称后缀的介词，直接把耶路撒冷拟人化为受话者。中文“在你中间”既保留直接称呼，也自然表达事情发生在城中居民当中。
- source_word: טְמֵאַת הַנִּדָּה
  choice: 经期不洁的女子
  rationale: 该表达指因月经而处于礼仪不洁状态的女子。“经期不洁”保留礼仪范畴，不把它弱化为单纯的生理描述。
- source_word: עִנּוּ
  choice: 他们凌辱
  rationale: ענה 的加强词干在性关系语境中可表达羞辱、虐待或性侵犯。“凌辱”保留行为的严重性及可能含有的强迫意味，同时避免比原文更明确地限定具体方式。
theological_decisions:
- issue: 如何处理“露父亲的下体”这一利未记式性禁令用语
  choice: 正文保留“露了父亲的下体”，并以脚注说明其惯用含义。
  alternative: 直接译为“与父亲的妻子发生乱伦关系”或“奸污父亲的妻子”。
  rationale: 原文没有在本节明说具体女性身份；直接改写会消除原有的法律惯用语，也可能把一种解释写入正文。保留原表达更能维持文本的含蓄性和与利未记的联系。
- issue: ענה 在本节是否必须明确译成强奸
  choice: 译为“凌辱”，保留性侵犯、虐待和羞辱之间的语义张力。
  alternative: 译为“强奸”或较中性的“与……发生关系”。
  rationale: “强奸”可能把强迫性确定得超过词形本身所能单独证明的程度，而“发生关系”又会削弱该动词的暴力与羞辱色彩；“凌辱”较能兼顾两者。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“下体”比“赤身”更贴近 עֶרְוָה 在性禁令语境中的所指；“凌辱”传达严重的性方面侵害，又不把原文尚存的语义范围缩窄为单一法律术语。两次保留“在你中间”，再现原文重复形成的控诉节奏。
