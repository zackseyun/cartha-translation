source:
  edition: WLC
  text: כֹּהֲנֶ֜י/הָ חָמְס֣וּ תוֹרָתִ/י֮ וַ/יְחַלְּל֣וּ קָדָשַׁ/י֒ בֵּֽין קֹ֤דֶשׁ לְ/חֹל֙ לֹ֣א הִבְדִּ֔ילוּ וּ/בֵין הַ/טָּמֵ֥א לְ/טָה֖וֹר לֹ֣א הוֹדִ֑יעוּ וּ/מִ/שַׁבְּתוֹתַ/י֙ הֶעְלִ֣ימוּ עֵֽינֵי/הֶ֔ם וָ/אֵחַ֖ל בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/026.yaml
  text: Her priests have done violence to my law and have profaned my holy things[a]. They have not distinguished between the holy and the common, and they have not made known the difference between the unclean and the clean. They have hidden their eyes from my Sabbaths[b], and I have been profaned among them.
translation:
  language: zh_hans
  text: 她的祭司肆意践踏我的律法，亵渎我的圣物。他们不分辨圣与俗[a]，也没有使人知道污秽与洁净的区别。他们对我的安息日闭眼不顾；我就在他们中间被亵渎了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俗”指普通、未分别为圣，并不必然表示邪恶或亵慢。或译：“圣与凡俗”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我在他们中间受了亵渎。”原文采用第一人称被动表达，指神因祭司的行为在他们中间受亵渎。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמְסוּ
  choice: 践踏
  rationale: 该动词表示以暴虐、不义的方式侵害；“践踏我的律法”保留强烈的比喻力度，又比直译为“强暴”更符合现代汉语。
- source_word: תוֹרָתִי
  choice: 我的律法
  rationale: 在祭司失职和圣约指控的语境中，“律法”准确而自然；同时不把含义缩窄为某一条具体法令。
- source_word: וַיְחַלְּלוּ
  choice: 亵渎
  rationale: 准确表达把神圣之物当作不圣之物对待的含义，并与本节末尾同根动词形成呼应。
- source_word: קָדָשַׁי
  choice: 我的圣物
  rationale: 保留复数所涵盖的宽泛神圣领域，不限定为祭物、圣所或某一种礼仪事项。
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: 圣与俗
  rationale: “俗”在此指普通、未分别为圣，而不必然表示邪恶或亵慢；这一对举简洁地保留祭司礼仪分类。
- source_word: הִבְדִּילוּ
  choice: 不分辨
  rationale: 表达祭司未能辨别并划分不同类别的职责性失败。
- source_word: וּבֵין הַטָּמֵא לְטָהוֹר
  choice: 污秽与洁净
  rationale: 采用汉语圣经语境中清楚、稳定的礼仪洁净用语，避免把两类概念纯粹道德化。
- source_word: לֹא הוֹדִיעוּ
  choice: 不让人知道……的区别
  rationale: 贴近使役词义“使人知道”，既可涵盖教导，也不把原文明确收窄为正式教学行为。
- source_word: וּמִשַׁבְּתוֹתַי
  choice: 我的安息日
  rationale: “安息日”在汉语中可作集合性称谓，能够自然表达原文复数所指反复遵守的圣日。
- source_word: הֶעְלִימוּ עֵינֵיהֶם
  choice: 闭眼不顾
  rationale: 保留“遮住眼睛”的原文意象，同时清楚传达故意忽视而非无意疏漏。
- source_word: וָאֵחַל
  choice: 我……被亵渎了
  rationale: 按马所拉文本的被动形式理解，表明祭司的失职导致神在群体中受亵渎；不改读为主动形式。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 保留神在该群体内部受亵渎的空间与群体意味。
theological_decisions:
- issue: חֹל在圣俗对举中的含义
  choice: 俗
  alternative: 凡俗；普通；不洁
  rationale: 原文所指是未分别为圣的普通类别，不等同于“不洁”，也不必然带有道德邪恶之意。
- issue: וָאֵחַל的语态和主语
  choice: 被动理解：“我就在他们中间被亵渎了”
  alternative: “我在他们中间被当作俗物”；按不同读法作主动理解
  rationale: 马所拉文本及上下文最自然地支持第一人称被动：祭司亵渎圣物并漠视安息日，结果是神自己在群体中受亵渎。译文保留这一令人震撼的神学张力。
- issue: 洁净分类是否作道德化解释
  choice: 保留“污秽与洁净”的礼仪分类
  alternative: 恶与善；有罪与无罪
  rationale: 本节聚焦祭司区分圣俗与洁净类别的职责，不能把礼仪范畴直接等同于一般道德判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“践踏”保留原文强烈的暴力隐喻；“闭眼不顾”兼顾希伯来语意象和现代可读性。以“她的祭司”保留原文阴性单数所属形式，所指承接上下文中的城。
