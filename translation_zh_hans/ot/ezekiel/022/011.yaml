source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֶת אֵ֣שֶׁת רֵעֵ֗/הוּ עָשָׂה֙ תּֽוֹעֵבָ֔ה וְ/אִ֥ישׁ אֶת כַּלָּת֖/וֹ טִמֵּ֣א בְ/זִמָּ֑ה וְ/אִ֛ישׁ אֶת אֲחֹת֥/וֹ בַת אָבִ֖י/ו עִנָּה בָֽ/ךְ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/011.yaml
  text: One man commits an abomination with his neighbor’s wife[a], another defiles his daughter-in-law with lewdness, and another violates his sister, his father’s daughter[c][b], within you.
translation:
  language: zh_hans
  text: 在你里面，有人与邻舍的妻子行可憎之事[a]；有人以淫邪[b]玷污自己的儿媳；也有人凌辱自己的姐妹，就是他父亲的女儿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“对邻舍的妻子做可憎之事”。原文直译为“做可憎之事”。
    reason: lexical_alternative
  - marker: b
    text: “以淫邪”也可译作“以性方面的邪恶”或“以淫乱”。
    reason: lexical_alternative
  - marker: c
    text: “凌辱”也可译作“侵犯”或“使……受辱”；原文动词在性行为语境中可兼含侵害、羞辱或虐待之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: 有人……有人……也有人
  rationale: 原文三次重复单数“人”，逐项列举犯罪者；用现代汉语的排比表达，既保留结构，也避免生硬重复。
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: 邻舍的妻子
  rationale: רֵעַ 可指邻舍、同伴或同胞；“邻舍”自然，并保留关系和律法语境。
- source_word: עָשָׂה תּוֹעֵבָה
  choice: 行可憎之事
  rationale: 近乎直译“行可憎之事”，保留强烈的道德谴责；上下文明确此事涉及邻舍之妻，无须在正文中添加原文未明说的动作。
- source_word: כַּלָּתוֹ
  choice: 自己的儿媳
  rationale: 准确表达标准亲属称谓，并以“自己的”明确所属关系。
- source_word: טִמֵּא
  choice: 玷污
  rationale: 该词在性犯罪语境中兼有礼仪与道德上的污秽含义；“玷污”较好保留这种重叠。
- source_word: בְּזִמָּה
  choice: 以淫邪
  rationale: זִמָּה 在此指邪恶无耻的性行为；“淫邪”简洁地传达性与道德两方面的含义。
- source_word: אֲחֹתוֹ בַת אָבִיו
  choice: 自己的姐妹，就是同父的姐妹
  rationale: 保留原文同位说明“姐妹、父亲的女儿”，同时以现代汉语“同父的姐妹”清楚表达父系亲属关系，而不武断认定是否同母。
- source_word: עִנָּה
  choice: 凌辱
  rationale: ענה 在性语境中含使人受辱、受虐待或遭侵犯的意味；“凌辱”保留羞辱与侵害的张力，同时不把原文的施害方式限定得过窄。
- source_word: בָּךְ
  choice: 在你里面
  rationale: 阴性单数代词直接称呼拟人化的耶路撒冷；“在你里面”保留第二人称城市意象。
theological_decisions:
- issue: 性犯罪措辞的道德力度
  choice: 保留“可憎之事”“玷污”“凌辱”等强烈谴责性措辞
  alternative: 改用“发生关系”“行为不道德”等较中性的说法
  rationale: 本节控诉严重的盟约与社会败坏；原文词汇具有鲜明的道德谴责，并在末句带有羞辱或侵害意味，不宜弱化。
- issue: עִנָּה 是否明确表示强奸
  choice: 正文译作“凌辱”，保留性侵害和羞辱的语义张力
  alternative: 明确译作“强奸”或较宽泛地译作“与……发生性关系”
  rationale: 此动词在相关性语境中可指使人受辱、遭侵犯，常有强迫意味，但仅凭该词不宜把具体施害形式完全定死；“凌辱”避免过度解释，也不将其弱化为中性关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以分号呈现三项平行控诉；保留对耶路撒冷的第二人称称呼，并避免现代法律术语过度限定希伯来语的语义范围。
