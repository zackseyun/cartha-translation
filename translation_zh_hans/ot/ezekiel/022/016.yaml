  text: וְ/נִחַ֥לְתְּ בָּ֖/ךְ לְ/עֵינֵ֣י גוֹיִ֑ם וְ/יָדַ֖עַתְּ כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/016.yaml
  text: And you will be profaned through yourself before the eyes of the nations[a], and you will know that I am Yahweh.
translation:
  language: zh_hans
  text: 你必在列国眼前因自己而受亵渎[a]；你就知道我是雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“受玷污”；“因自己”也可理解为“在你自身”或“在自己身上蒙受羞辱”。这里的希伯来语动词可带有亵渎、玷污或公开受辱的含义。
    reason: 保留נִחַלְתְּ的“受亵渎／受玷污／受辱”等词义层次，并保留בָּךְ可理解为“因自己”或“在你自身”的句法歧义。
lexical_decisions:
- source_word: נִחַלְתְּ
  choice: 受亵渎
  rationale: 按马所拉文本的读法理解为חלל的尼法勒式、阴性单数第二人称，指被亵渎或蒙受亵渎；“受亵渎”保留以西结书中圣俗、洁净与污秽的语义层面，同时不把含义弱化为一般的“受辱”。
- source_word: בָּךְ
  choice: 因自己
  rationale: 介词ב加阴性单数第二人称后缀表达简略，可有“在你自身”“因你自己”等理解。“因自己”在现代汉语中较自然，也保留亵渎与耶路撒冷自身相关的意味，但不进一步明说具体因果机制。
- source_word: לְעֵינֵי גוֹיִם
  choice: 在列国眼前
  rationale: 保留希伯来语“在……眼前”的鲜明公共场景；“列国”指以色列以外的众国，是先知书语境中גּוֹיִם的自然译法。
- source_word: וְיָדַעַתְּ
  choice: 你就知道
  rationale: 完成式在预言性审判话语中具有将来并带结果的意味；“就”自然呈现前述审判所导致的认识。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，不以“主”这一称号代替。
theological_decisions:
- issue: 本节חלל的含义
  choice: 耶路撒冷在列国面前遭受带有圣俗意味的亵渎
  alternative: 失去产业；或仅指一般性的受辱、名誉受损
  rationale: 本章围绕污秽、罪责和公开审判展开，以西结也常用חלל表达亵渎；因此主文采用“受亵渎”，同时用脚注保留“受玷污”“受辱”等词义层次。
- issue: בָּךְ与耶路撒冷受亵渎的关系
  choice: 译作“因自己”，表示这结果与她自身有关
  alternative: “在你自身”或“借着你自己”
  rationale: 原文介词结构简略，不宜把责任方式或施事关系解释得过满；所选译法兼顾自然度与原文的含混性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“列国眼前”保留先知文学的形象性；以分号连接审判与认识雅威的结果。称呼对象为阴性单数的耶路撒冷，但汉语不额外补出“城”或“她”，以免增加原文没有明说的词语。
