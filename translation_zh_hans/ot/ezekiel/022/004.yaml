  text: בְּ/דָמֵ֨/ךְ אֲשֶׁר שָׁפַ֜כְתְּ אָשַׁ֗מְתְּ וּ/בְ/גִלּוּלַ֤יִ/ךְ אֲשֶׁר עָשִׂית֙ טָמֵ֔את וַ/תַּקְרִ֣יבִי יָמַ֔יִ/ךְ וַ/תָּב֖וֹא עַד שְׁנוֹתָ֑יִ/ךְ עַל כֵּ֗ן נְתַתִּ֤י/ךְ חֶרְפָּה֙ לַ/גּוֹיִ֔ם וְ/קַלָּסָ֖ה לְ/כָל הָ/אֲרָצֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/004.yaml
  text: By your blood that you have shed[a], you have become guilty, and by your idols that you have made, you have become unclean. You have brought your days near and have come to your years[b]. Therefore I have made you a reproach to the nations and a mockery to all the lands.
translation:
  language: zh_hans
  text: 你因自己所流的血而获罪，又因自己所造的偶像[a]而变得不洁。你使自己的日子临近，也到了你的年限[b]。因此，我使你成为列国的羞辱、各地的笑柄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”对应的希伯来词带有强烈的轻蔑意味，是以西结常用来贬斥假神的称呼，并非中性的“神像”。
    reason: cultural_note
  - marker: b
    text: 或较解释性地译作：“你催促自己的日子，到了年限的尽头。”这一希伯来表达很可能是指耶路撒冷所定的审判之期已经临近。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדָמֵךְ אֲשֶׁר שָׁפַכְתְּ
  choice: 因自己所流的血
  rationale: 介词ב在这里表达原因，后面的关系从句明确指出这是耶路撒冷所流的血；译文保留“血”的具体意象，同时自然表达流血所招致的罪责。
- source_word: אָשַׁמְתְּ
  choice: 获罪
  rationale: 该动词表示成为有罪或招致罪责。“获罪”既体现行为造成的结果，也符合先知审判宣告的语气。
- source_word: גִלּוּלַיִךְ
  choice: 你的偶像
  rationale: 该词是以西结常用的贬称，指虚假的神像。正文采用现代汉语清楚自然的“偶像”，其强烈蔑视色彩在脚注中说明。
- source_word: טָמֵאת
  choice: 变得不洁
  rationale: Qal词形可表示进入不洁的状态；这样译与前句因行为而“获罪”的结果相呼应，也不额外加入原文没有明说的反身含义。
- source_word: וַתַּקְרִיבִי יָמַיִךְ
  choice: 你使自己的日子临近
  rationale: Hiphil形式直译为“使……临近”。译文保留这一不同寻常的希伯来表达，不在正文中直接补成“审判的日子”或“末日”。
- source_word: וַתָּבוֹא עַד שְׁנוֹתָיִךְ
  choice: 也到了你的年限
  rationale: 原文直指“你的年岁/年限”，并与前面的“日子”平行。“年限”在现代汉语中既可理解为所定的期限，又避免武断地补入“终结”。
- source_word: חֶרְפָּה
  choice: 受羞辱
  rationale: 该词可指羞辱、耻辱或受人辱骂；这里用动词性表达，使“在列国中”与汉语自然搭配，并保留审判性的公开蒙羞含义。
- source_word: קַלָּסָה
  choice: 成为笑柄
  rationale: 该名词表示受嘲弄或成为讥笑对象。“成为笑柄”是清楚自然的现代汉语，并与前面的“受羞辱”有所区别。
- source_word: הָאֲרָצוֹת
  choice: 各地
  rationale: 复数名词在与“列国”平行的语境中指各个地域或邦国；“各地”比抽象的“全地”更符合此处广泛的地缘含义。
theological_decisions:
- issue: 耶路撒冷的不洁与罪责具有何种性质
  choice: 把流血所招致的司法性、盟约性罪责，与拜偶像所造成的礼仪—道德不洁并列保留。
  alternative: 把“不洁”仅理解为礼仪状态，或把“罪”仅理解为象征性说法。
  rationale: 希伯来文把流血与偶像崇拜作为针对耶路撒冷的两项具体罪状，并分别以“获罪”和“变得不洁”说明其后果；译文不把两者压缩成单一类别。
- issue: “日子”与“年限”是否明确指末日或审判期限
  choice: 正文保留原文含蓄的时间表达，仅在脚注中指出它很可能指耶路撒冷所定的审判之期临近。
  alternative: 在正文直接译成“你催促了自己的末日，到了你年数的尽头”。
  rationale: 上下文支持审判临近的理解，但原句没有明说“末日”或“尽头”；保留含蓄说法可避免把合理解释提升为唯一明文含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“获罪”“不洁”“列国”等词保留先知审判宣告的语体，同时避免生硬仿照希伯来语序。“你”按上下文指作为一座城被人格化的耶路撒冷；汉语无需显明原文的阴性语法形式。脚注标记已按各自内容置于“偶像”和时间惯用语之后。
