base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/003.yaml
  text: 'And say, ‘Thus says the Lord GOD: O city that sheds blood in her midst, so that her time may come, and that makes idols against herself to defile herself!’'
translation:
  language: zh_hans
  text: 你要说：‘主耶和华如此说：你这在城中流人血、使自己的时候来到，又制造偶像加害自己、玷污自己的城啊！’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִיר שֹׁפֶכֶת דָּם
  choice: 你这……流人血的城啊
  rationale: 将希伯来语名词短语按呼语理解；“流人血”保留其蓄意杀人、造成血债的圣经语感。
- source_word: בְּתוֹכָהּ
  choice: 在城中
  rationale: 直译为“在她里面”；汉语以“城中”自然表达，并保留罪恶发生于城内的重点。
- source_word: לָבוֹא עִתָּהּ
  choice: 使自己的时候来到
  rationale: 保留目的或结果意味及“她的时候”这一含蓄审判表述，不具体解释为毁灭之日。
- source_word: גִלּוּלִים
  choice: 偶像
  rationale: 该词是对偶像的贬称；正文采用现代读者清楚易懂的“偶像”，避免生硬的“污秽之物”。
- source_word: עָלֶיהָ
  choice: （不单独明译）
  rationale: 此处可能有“在自己境内/给自己/加害自己”的含义；结合反身结果，以“玷污自己”自然承载其指向，避免不确定的过度具体化。
- source_word: לְטָמְאָה
  choice: 玷污自己
  rationale: 保留礼仪与道德污秽兼具的语义，并与阴性城市所指形成反身表达。
theological_decisions:
- issue: “她的时候来到”所指为何
  choice: 自己的时候来到
  alternative: 自己的末日来到／受审判的时候来到
  rationale: 原文只说“她的时候”，语境暗示审判，却没有在本节明说“末日”或“受审判”；正文保留其含蓄与张力。
- issue: עָלֶיהָ 是否译作“害自己”
  choice: 不独立译出，以“玷污自己”体现反身后果
  alternative: 制造偶像，加害自己／在其中制造偶像
  rationale: 介词短语的具体关系存在歧义；不把它教义化或锁定为单一空间、敌对含义。
translation_notes:
  register: 采用庄重而现代的先知宣告语体。“主耶和华如此说”延续中文圣经中对 אֲדֹנָי יְהוִה 的清晰表达；整句保留希伯来文呼语的谴责力度，同时避免古奥难懂的措辞。
