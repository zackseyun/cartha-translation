    rationale: 该介词短语附于“制造偶像”，表明偶像是针对、加于或关涉这城自身而造；虽其精确关系可讨论，但不宜完全省略。以“加害自己”可保留其不利于自身的方向，同时不将其限定为某一空间意义。
