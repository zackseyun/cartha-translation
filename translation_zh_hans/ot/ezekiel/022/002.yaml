  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/תִשְׁפֹּ֥ט הֲ/תִשְׁפֹּ֖ט אֶת עִ֣יר הַ/דָּמִ֑ים וְ/ה֣וֹדַעְתָּ֔/הּ אֵ֖ת כָּל תּוֹעֲבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/002.yaml
  text: And you[a], son of man, will you judge, will you judge the bloody city? Then make known to her all her abominations.
translation:
  language: zh_hans
  text: 你，人子啊，你要审判吗？你要审判这流人血的城[a]吗？要使她知道她一切可憎之事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流人血的城”也可译作“血债之城”；希伯来文直译为“诸血之城”。
    reason: 说明עִיר הַדָּמִים既可强调流血杀人，也可强调由此产生的血债，并交代原文复数形式。
lexical_decisions:
- source_word: בֶן אָדָם
  choice: 人子
  rationale: 这是以西结书中上帝对先知惯用的称呼；保留希伯来语形式及全书的一致性，同时在现代中文圣经语体中清楚可懂。
- source_word: הֲתִשְׁפֹּט הֲתִשְׁפֹּט
  choice: 你要审判吗？你要审判……吗？
  rationale: 原文重复带疑问词的动词，具有强烈的反问和催促意味；中文也用完整重复来保留其力度，而不合并为一次。
- source_word: עִיר הַדָּמִים
  choice: 这流人血的城
  rationale: 希伯来语直译为“血的城／诸血之城”，复数“血”常指流血杀人或由此产生的血债。“流人血的城”自然、具体，并保留暴力杀戮的含义。
- source_word: וְהוֹדַעְתָּהּ
  choice: 那么，就要让她知道
  rationale: ידע的使役式表示“使她知道”；句首连接词在此承接前面的反问，中文以“那么，就”表达推进关系，并保留命令性的语气。
- source_word: כָּל תּוֹעֲבוֹתֶיהָ
  choice: 自己一切可憎的事
  rationale: “一切”保留כָּל的全称范围；תּוֹעֵבָה是带有强烈道德与圣约评判色彩的词，“可憎的事”在现代中文中比名词化的“可憎之事”更自然，同时不削弱谴责力度。
theological_decisions:
- issue: בֶן אָדָם中אָדָם的译法
  choice: 人子
  alternative: 凡人；世人
  rationale: 此处是以西结书反复出现的固定先知称呼。译作“人子”既对应原文构词，也保持书内互文；不应在此将其解释性地改写为“凡人”。
- issue: עִיר הַדָּמִים所指的罪责范围
  choice: 流人血的城
  alternative: 血债之城；血城
  rationale: 原文可同时唤起实际流血和流血所招致的罪责。正文用“流人血”呈现最直接的行为含义，脚注说明“血债”这一合理语义，以免把原文张力限定为单一解释。
- issue: 重复反问是否应化为直接命令
  choice: 保留两次反问
  alternative: 你要审判这城
  rationale: 马所拉文本两次使用带疑问词的同一动词。保留反问既忠于句法，也避免替原文消除其修辞张力。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“你，人子啊”保留直接呼语；两次完整反问传达原文的强调。“她”承接阴性名词“城”，属于拟人化表达。脚注标记置于相关译语之后。
