  text: קֶ֤שֶׁר נְבִיאֶ֨י/הָ֙ בְּ/תוֹכָ֔/הּ כַּ/אֲרִ֥י שׁוֹאֵ֖ג טֹ֣רֵֽף טָ֑רֶף נֶ֣פֶשׁ אָכָ֗לוּ חֹ֤סֶן וִ/יקָר֙ יִקָּ֔חוּ אַלְמְנוֹתֶ֖י/הָ הִרְבּ֥וּ בְ/תוֹכָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/025.yaml
  text: 'A conspiracy of her prophets is in her midst[a], like a roaring lion tearing prey: they have devoured lives, they take wealth and precious things, they have multiplied her widows in her midst.'
translation:
  language: zh_hans
  text: 她中间的先知结党密谋，像咆哮的狮子撕裂猎物；他们吞噬人的性命[a]，夺取财富和珍宝，使她中间的寡妇增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吞噬人”；较字面可译“吞噬灵魂”。希伯来语 נֶפֶשׁ 常指活人或生命，并不只指非物质的灵魂。
    reason: 说明 נֶפֶשׁ 的语义范围，避免读者把该词限定为后来的技术性神学概念。
lexical_decisions:
- source_word: קֶשֶׁר
  choice: 结党密谋
  rationale: 该词指共同策划的敌对、叛逆行为。“结党密谋”既表达有组织的同谋，也符合现代汉语表达。
- source_word: נְבִיאֶיהָ
  choice: 她的先知
  rationale: 保留第三人称阴性单数所属关系，“她”指本段拟人化的城。
- source_word: בְּתוֹכָהּ
  choice: 她中间
  rationale: 保留首尾重复的城中场景，并延续原文对城的阴性拟人表达。
- source_word: כַּאֲרִי שׁוֹאֵג טֹרֵף טָרֶף
  choice: 像咆哮的狮子撕裂猎物
  rationale: 传达狮子吼叫并撕扯猎物的强烈掠食意象；“撕裂猎物”自然呈现动词与同根宾语的组合。
- source_word: נֶפֶשׁ אָכָלוּ
  choice: 他们吞噬人的性命
  rationale: נֶפֶשׁ在这里指活人或生命；“吞噬”延续狮子捕食的比喻，“人的性命”避免被误解为专指非物质的灵魂。
- source_word: חֹסֶן
  choice: 财富
  rationale: 此处指物质财富或积存的资财，与后面的贵重物品并列。
- source_word: וִיקָר
  choice: 珍宝
  rationale: 在掠夺语境中指贵重之物；“珍宝”简洁自然，并与“财富”构成顺畅并列。
- source_word: יִקָּחוּ
  choice: 夺取
  rationale: 未完成式描述其一贯行为；上下文带有暴力掠夺意味，因此“夺取”比中性的“拿取”更贴切。
- source_word: אַלְמְנוֹתֶיהָ הִרְבּוּ
  choice: 使她中间寡妇增多
  rationale: 这是因杀害多人而造成众多寡妇的表达；译文保留“增多”的醒目结果，同时用使役结构使现代汉语自然。
theological_decisions:
- issue: 审判语境中נֶפֶשׁ的含义
  choice: 译作“人的性命”
  alternative: “人”或较字面的“灵魂”
  rationale: 本节谴责杀人和掠夺，并非对非物质灵魂作技术性论述。“人的性命”符合此处语义，也保留生命被吞噬的比喻张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文对城的阴性拟人和首尾“她中间”的呼应；以“吞噬—撕裂”的词汇衔接维持狮子掠食意象。
