  text: עַ֤ם הָ/אָ֨רֶץ֙ עָ֣שְׁקוּ עֹ֔שֶׁק וְ/גָזְל֖וּ גָּזֵ֑ל וְ/עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנ֔וּ וְ/אֶת הַ/גֵּ֥ר עָשְׁק֖וּ בְּ/לֹ֥א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/029.yaml
  text: The people of the land have practiced oppression and committed robbery; they have mistreated the poor and needy[a], and they have oppressed the foreigner without justice.
translation:
  language: zh_hans
  text: 这地的百姓惯行欺压，强取财物；他们虐待困苦穷乏的人，也欺压寄居者[a]，不按公正行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”指生于外地、住在当地民众中间的外来居民；也可译作“外来人”。
    reason: 说明希伯来词 גֵּר 所指的居留身份，并提供现代汉语替代译法；删除原文未限定的“长期”居住含义。
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: 这地的百姓
  rationale: 按构造短语直译其基本含义；在本节指当地民众整体，并不特指某个社会阶层。
- source_word: עָשְׁקוּ עֹשֶׁק
  choice: 惯行欺压
  rationale: 原文以同根动词和名词连用，加强并刻画持续性的压迫行为；“惯行欺压”在现代汉语中自然，也保留这种强调。
- source_word: וְגָזְלוּ גָּזֵל
  choice: 强取财物
  rationale: 同根动词与名词的组合强调公然掠夺；此译明确表达非法夺取他人财物，避免生硬重复。
- source_word: וְעָנִי וְאֶבְיוֹן
  choice: 困苦贫穷的人
  rationale: 该固定搭配指处境受压、经济匮乏的弱势者；译文兼顾两个词的侧重点。
- source_word: הוֹנוּ
  choice: 虐待
  rationale: 此处使役词形表示亏负、欺凌或剥削性的对待；“虐待”概括其伤害性，同时不与本节两处 עשק 完全混同。
- source_word: הַגֵּר
  choice: 寄居者
  rationale: 指在以色列群体中居住、但并非本地出生的人；“寄居者”既保留其居留身份，也比单纯“外国人”更准确。
- source_word: עָשְׁקוּ
  choice: 欺压
  rationale: 直接表达以权势压迫、剥削他人的含义，并与本节开头同一词根形成呼应。
- source_word: בְּלֹא מִשְׁפָּט
  choice: 不按公正行事
  rationale: מִשְׁפָּט 可指公正、正当的法律和道德秩序；此译保留其规范性分量，而不局限于现代司法程序。
theological_decisions:
- issue: 先知责备中的社会伦理用语
  choice: 具体保留欺压、强取、虐待弱势者及不公对待寄居者等罪行
  alternative: 笼统译为“作恶”或“行事邪恶”
  rationale: 原文逐项指出具体的社会不义；译文不将这些有明确对象和行为方式的罪行泛化。
- issue: מִשְׁפָּט 的范围
  choice: 译为“不按公正行事”，兼含法律与道德上的不义
  alternative: 译为“未经正当法律程序”或“没有合法权利”
  rationale: 上下文谴责广泛的社会压迫，原词的含义不应被缩窄为某一种现代法律程序。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“惯行欺压”传达同根词连用所表现的持续性和强调；分号保留前后罪行清单的层次。脚注标记已在正文“寄居者”后标出。
