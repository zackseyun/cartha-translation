base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/005.yaml
  text: Those who are near and those who are far from you will mock you[a], defiled of name[b], full of turmoil.
translation:
  language: zh_hans
  text: 你周围近处和远处的人都要嘲笑你；你名声污秽[a]，满是混乱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文表达简略，直译近于“名声污秽”或“名被玷污”。也可理解为“以污秽闻名”。
    reason: lexical_alternative
  - marker: b
    text: “混乱”也可译作“骚乱”“喧嚷”或“纷扰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרֹבוֹת וְהָרְחֹקוֹת מִמֵּךְ
  choice: 远近各处的人
  rationale: 两个带冠词的阴性复数形容词作名词用，形成“近处—远处”的对举，指周围远近的群体；汉语合译为“远近各处的人”自然简洁，并保留空间范围。
- source_word: יִתְקַלְּסוּ בָךְ
  choice: 都要嘲笑你
  rationale: 动词表示讥笑、嘲弄；未完成式在审判宣告中表达将要发生之事。“都要嘲笑你”符合现代汉语表达。
- source_word: טְמֵאַת הַשֵּׁם
  choice: 名声污秽
  rationale: 原文是高度压缩的结构，字面近于“名字方面污秽”；“名声污秽”保留其简练和负面评价，也自然传达这里很可能涉及声誉。
- source_word: רַבַּת הַמְּהוּמָה
  choice: 充满混乱
  rationale: רַבַּת表示在某事上多、充盈，הַמְּהוּמָה可指骚乱、喧嚷、混乱；“充满混乱”兼顾语义范围与可读性。
theological_decisions:
- issue: 如何理解压缩短语 טְמֵאַת הַשֵּׁם
  choice: 以并列描述译作“名声污秽”
  alternative: “名字被玷污”“以污秽闻名”“名为污秽的”
  rationale: 原文可能描述城的名誉受污，也可能按较直译的方式理解为“在名声上污秽”。正文不展开因果或归属关系，以免消除原有歧义；脚注列出主要可能。
- issue: 是否明确补出受话者为耶路撒冷
  choice: 保留第二人称“你”，不补出地名
  alternative: “耶路撒冷啊”或“这城啊”
  rationale: 上下文已说明受话者，而本节原文没有重复地名；不补出可保留先知话语直接针对“你”的力度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“远近各处的人”呈现原文对举；冒号引出对受话者的两个并列描述。所有脚注标记均置于正文对应词语之后。
