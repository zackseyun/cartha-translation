id: EZK.22.14
reference: Ezekiel 22:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֲ/יַעֲמֹ֤ד לִבֵּ/ךְ֙ אִם תֶּחֱזַ֣קְנָה יָדַ֔יִ/ךְ לַ/יָּמִ֕ים אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה אוֹתָ֑/ךְ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/014.yaml
  text: Will your heart endure[a], or will your hands remain strong, in the days when I deal with you? I, Yahweh, have spoken, and I will do it.
translation:
  language: zh_hans
  text: 在我对付你的那些日子[a]，你的心还能撑得住吗？你的双手还能有力量吗？我耶和华已经说了，我必实行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在我向你采取行动的那些日子。”本章语境表明，这行动是针对你的审判。
    reason: 原文עשה与直接宾语构成省略表达，可宽泛理解为“向你采取行动”；上下文赋予其惩罚性的含义。
lexical_decisions:
- source_word: הֲיַעֲמֹד
  choice: 能撑得住吗
  rationale: עמד本义为“站立”，这里用于审判临到时能否承受的反问。“撑得住”以自然的现代汉语表达其语境义，同时保留承受压力而不倒下的意象。
- source_word: לִבֵּךְ
  choice: 你的心
  rationale: 保留希伯来文“心”的人体意象；在此可指人的内在勇气、意志和承受力，并与下句的“双手”形成对应。
- source_word: תֶּחֱזַקְנָה יָדַיִךְ
  choice: 你的双手还能有力量吗
  rationale: 原文以“手”表示行动能力和力量。译作“双手还能有力量吗”既保留身体意象，也在汉语中清楚传达审判之下是否仍有能力的反问。
- source_word: לַיָּמִים
  choice: 到……的日子
  rationale: 介词与“日子”构成时间表达；“到……的日子”自然地指向将要临到的时刻。
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה אוֹתָךְ
  choice: 我对付你的日子
  rationale: 原文直译近于“我向你施行之事的日子”，表达较省略；上下文明确是耶和华向耶路撒冷施行审判。“对付你”保留行动的针对性和惩罚色彩，却不把动词窄化为纯司法术语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法“耶和华”，将专名与“主”等称号区分开来。
- source_word: דִּבַּרְתִּי
  choice: 已经说了
  rationale: 完成式表示宣告已经发出；“已经说了”在现代汉语中简洁而庄重，并强调话语的确定性。
- source_word: וְעָשִׂיתִי
  choice: 也必照样行
  rationale: 形式上是完成式，但在先知宣告公式中表达必定实现的将来行动。“必照样行”传达耶和华必执行自己所说之事的确定性。
theological_decisions:
- issue: אֲנִי עֹשֶׂה אוֹתָךְ所指的神圣行动
  choice: 我对付你
  alternative: 我向你采取行动／我攻击你／我审判你
  rationale: 语境表明这是针对耶路撒冷的惩罚行动，但动词עשה本身只是“做、施行”。正文用“对付”表达敌对而惩罚性的语境，同时避免把含义限定为“审判”这一较窄的司法概念；脚注保留较贴近字面的表达。
- issue: וְעָשִׂיתִי的时态和语气
  choice: 也必照样行
  alternative: 我已经行了／我将要行动
  rationale: 在“我耶和华已经说了”之后，这一完成式具有先知宣告中确定将成之事的功能。用“必”表达履行尚在将来却确定无疑，没有将形式机械处理为已经完成。
- issue: 反问中的“心”和“双手”
  choice: 保留两个人体意象
  alternative: 意志还能坚定、还能有行动能力
  rationale: 原文让内在勇气与外在能力彼此对应。保留“心”和“双手”既忠于希伯来表达，也不替读者消解其中的诗性张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。反问句保持直接有力；“撑得住”虽属现代常用语，但不轻佻，能准确表达עמד在压力之下仍站立的语境义。“耶和华已经说了，也必照样行”保留神谕结语的郑重和确定性。
