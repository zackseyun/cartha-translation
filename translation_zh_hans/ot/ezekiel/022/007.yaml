base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/007.yaml
  text: In you they have treated father and mother with contempt[a]; in your midst they have oppressed the sojourner[c][b]; in you they have defrauded the fatherless and the widow.
translation:
  language: zh_hans
  text: 在你之中[a]，他们轻慢父亲和母亲；在你中间，他们欺压寄居者[b]；在你之中，他们苛待孤儿[c]和寡妇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“你”为阴性单数；先知把耶路撒冷拟人化，直接向这座城说话。
    reason: cultural_note
  - marker: b
    text: “寄居者”也可译作“侨居者”或“外来居民”，指在当地居住而非本地人的人。
    reason: lexical_alternative
  - marker: c
    text: “孤儿”所译的希伯来词也可着重指“丧父的孩子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקַלּוּ
  choice: 轻慢
  rationale: 该词为 קלל 的使役形，在这里指轻视、藐视、不尊重。“轻慢”简洁自然，也保留了道德谴责的力度。
- source_word: אָב וָאֵם
  choice: 父亲和母亲
  rationale: 原文分别列出父亲和母亲，而非使用概括性的“父母”；这样翻译也保留了与诫命语言的呼应。
- source_word: בָךְ
  choice: 在你里面
  rationale: 原文以阴性单数直接称呼耶路撒冷，并重复这一短语形成控诉性的回环；译文保留这种直接称呼。
- source_word: לַגֵּר
  choice: 寄居者
  rationale: גֵּר 指居住在以色列人中间、却不属于本地族群的人。“寄居者”保留了这一特定社会身份，没有仅仅将其归结为种族意义上的外国人。
- source_word: עָשׂוּ בָעֹשֶׁק
  choice: 欺压
  rationale: 原文直译近于“以压迫对待”，表达剥削和压榨性的行为。“欺压”在现代汉语中简明有力。
- source_word: בְּתוֹכֵךְ
  choice: 在你中间
  rationale: תוֹךְ 表示内部或当中；“在你中间”既自然，也突出罪行发生在城内群体之中。
- source_word: יָתוֹם וְאַלְמָנָה
  choice: 孤儿和寡妇
  rationale: 这是希伯来圣经中常见的受保护群体组合。“孤儿和寡妇”符合现代汉语习惯；脚注说明 יָתוֹם 也可着重指丧父者。
- source_word: הוֹנוּ
  choice: 欺凌
  rationale: 该词源于 ינה 的使役形，可指亏负、压迫、剥削或欺骗。“欺凌”保留广义的强势侵害，避免把含义不必要地限于财务欺诈。
theological_decisions:
- issue: 对受保护弱势群体的盟约社会伦理用语
  choice: 保留“寄居者、孤儿、寡妇”等具体类别
  alternative: 概括译为“弱势者”，或将寄居者译为“外国人”
  rationale: 经文控诉的是对律法中特别受保护群体的具体侵害。保留这些类别有助于维持经文间的联系，同时不加入额外的教义解释。
- issue: 耶路撒冷的拟人化称呼
  choice: 保留三次地点表达中的直接第二人称“你”
  alternative: 明确改写为“在耶路撒冷城中”
  rationale: 原文用阴性单数直接向这座城说话。保留“你”维持先知控诉的修辞力度；脚注交代所指对象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分句保留“在你里面／在你中间／在你里面”的重复结构，以呈现原文对耶路撒冷持续而直接的控诉；动词分别用“轻慢、欺压、欺凌”，既体现原文词汇差异，也避免中文表达单调。
