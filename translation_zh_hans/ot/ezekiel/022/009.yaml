base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/009.yaml
  text: Men of slander were in you in order to shed blood[a]; and on the mountains they ate[c][b]; they committed lewdness in your midst.
translation:
  language: zh_hans
  text: 你中间有搬弄是非的人[a]，为要流人的血；他们在山上吃[b]；他们在你中间行淫秽之事[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “搬弄是非的人”也可译作“诽谤人的人”“散布流言的人”或“告密者”。希伯来语所用的词可指传播控告或毁谤人的话。
    reason: lexical_alternative
  - marker: b
    text: 这很可能是指他们在山上的丘坛参加祭宴，与偶像崇拜有关。
    reason: cultural_note
  - marker: c
    text: “淫秽之事”也可译作“恶事”“可耻之事”或“性方面的败坏”。这个希伯来词常指无耻、令人震骇的恶行，并且经常带有性方面的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי רָכִיל
  choice: 搬弄是非的人
  rationale: 该结构直译为“从事רָכִיל的人”；רָכִיל可指散布流言、诽谤或传递控告。在本节中，这种行为导致流血。“搬弄是非的人”是自然的现代汉语，也保留了以言语害人的含义。
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: 为要使人流血
  rationale: לְמַעַן接不定式表达目的或结果。“为要”保留目的意味；“使人流血”延续先知文学中指杀人暴行的具体意象。
- source_word: וְאֶל הֶהָרִים אָכְלוּ
  choice: 有人在山上吃喝
  rationale: 原文直陈“在／向山上吃”，所指很可能是在丘坛参与祭宴。正文保留山上的饮食意象，不直接把隐含的祭祀背景写入正文；“吃喝”在汉语中比孤立的“吃”更自然，但不改变其核心行为。
- source_word: זִמָּה
  choice: 淫秽之事
  rationale: זִמָּה可指无耻的恶行，尤其常指性方面的败坏。本章紧接着列举多种性罪行，因此“淫秽之事”贴合语境，同时脚注保留较宽泛的词义可能。
- source_word: עָשׂוּ בְתוֹכֵךְ
  choice: 有人在你中间行……
  rationale: עָשָׂה与抽象名词连用，可译为“行、做、犯”。“在你中间”保留了对耶路撒冷的第二人称直接指控。
theological_decisions:
- issue: 山上进食的宗教含义
  choice: 正文译作“在山上吃喝”，以脚注说明可能指丘坛祭宴
  alternative: 正文直接译作“在山上的祭坛吃祭物”
  rationale: 原文只明说在山上进食，偶像崇拜的背景虽很可能存在，却未在本句中明说；把解释放入脚注可避免正文过度释义。
- issue: זִמָּה的道德范围
  choice: 正文采用偏向性道德含义的“淫秽之事”，脚注保留广义解释
  alternative: 译作泛指的“恶事”或“可耻之事”
  rationale: 后续经文的性罪行清单支持性方面的理解，但该词本身也可泛指骇人的恶行，因此不把较宽词义排除。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三个分句保持希伯来文指控清单的并列节奏；重复“有人”使汉语表达清楚自然。“你中间”保留先知对人格化耶路撒冷的直接称呼。所有脚注标记均置于所解释的词语之后。
