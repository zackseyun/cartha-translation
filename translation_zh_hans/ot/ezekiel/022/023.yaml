  text: 耶和华的话临到我，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: 临到
  rationale: 在固定的先知宣告公式“耶和华的话……临到我”中，这个表达按整体习惯用法译为“临到”，比逐字译作“有了”或“发生了”更符合现代汉语，同时保留其公式性。
- source_word: דְבַר
  choice: 话
  rationale: 此处指来自上帝的先知性话语或信息；“话”既贴近原文，也保留圣经先知宣告的庄重表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以一般称号替代。
- source_word: אֵלַי
  choice: 我
  rationale: 与动词“临到”搭配为“临到我”，自然准确地标明先知是领受者。
- source_word: לֵאמֹר
  choice: 说
  rationale: 用于引出下一节的直接话语；“说”简洁、自然，并保留原文的引语衔接功能。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名。中文采用广为人知且具有专名功能的“耶和华”，不改译为“主”；“雅威”是较接近学界常见拟音的另一选择。
translation_notes:
  register: 采用现代、庄重而通顺的先知书体例。“耶和华的话临到我”保留希伯来文固定宣告公式；末尾“说”承接下一节神谕。
