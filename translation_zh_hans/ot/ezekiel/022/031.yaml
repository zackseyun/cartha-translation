  text: וָ/אֶשְׁפֹּ֤ךְ עֲלֵי/הֶם֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י כִּלִּיתִ֑י/ם דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/031.yaml
  text: So I poured out my indignation on them[a]; with the fire of my wrath I consumed them. I have put their way on their own heads[c][b], declares the Lord GOD.
translation:
  language: zh_hans
  text: 因此，我把我的愤怒倾倒在他们身上[a]；我用我烈怒的火毁灭他们。我使他们所行的后果落在他们自己头上[b]。这是主耶和华的宣告[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倾倒”保留希伯来文的比喻：神的愤怒仿佛被倾倒在他们身上。
    reason: metaphor
  - marker: b
    text: “落在他们自己头上”是希伯来语的报应惯用说法，指他们要承受自己行为所招致的后果。
    reason: idiom
  - marker: c
    text: “主耶和华”原文为 אֲדֹנָי יְהוִה（Adonai YHWH），是“主”与神的专名YHWH组成的称谓。
    reason: divine_name
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: 倾倒
  rationale: שׁפך 的基本义是“倾倒”。保留原文把神的愤怒描写为倾倒在人身上的鲜明意象。
- source_word: זַעְמִי
  choice: 我的愤怒
  rationale: זַעַם 表示带有谴责和审判意味的忿怒；“愤怒”在现代汉语中自然庄重，也不削弱其强度。
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: 用我烈怒的火
  rationale: עֶבְרָה 指强烈、如同涌流的怒气；“烈怒”体现强度，“用”保留 בְּ 的工具意义，并维持火的审判意象。
- source_word: כִּלִּיתִים
  choice: 将他们烧灭
  rationale: כלה 的 Piel 形可表示使之终结、消灭或耗尽。结合紧邻的“火”意象，“烧灭”在汉语中连贯有力，同时脚注保留较非意象化的译法。
- source_word: דַּרְכָּם
  choice: 他们所行的
  rationale: דֶּרֶךְ 字面是“道路”，此处以单数集合义指生活方式和行为。“所行的”自然表达其伦理含义，而不额外指定某类罪行。
- source_word: בְּרֹאשָׁם נָתַתִּי
  choice: 归到他们自己头上
  rationale: 直译性地保留“在头上”的先知性报应惯用语，表达他们行为的后果由他们自己承受。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם 是先知书中的神谕宣告公式；“这是……的宣告”庄重而清楚。אֲדֹנָי יְהוִה 依常见中文圣经用语译作“主耶和华”，并以脚注说明专名。
theological_decisions:
- issue: 神施行审判的强烈措辞
  choice: 保留“愤怒”“烈怒”“烧灭”等直接措辞
  alternative: 弱化为“不悦”“惩罚”等表达
  rationale: 希伯来文明确把强烈的忿怒和毁灭性的报应归于神；译文不应淡化这一审判宣告。
- issue: 行为归到本人头上的报应意象
  choice: 保留“归到他们自己头上”
  alternative: 解释性地译为“使他们承担自己行为的后果”
  rationale: 原文既表达相称报应，也使用具体的“头上”意象。正文保留该意象，脚注说明其意义，避免把诗性和神学张力完全解释掉。
- issue: אֲדֹנָי יְהוִה 中神名的译法
  choice: 主耶和华
  alternative: 主雅威
  rationale: “耶和华”是现代中文读者广泛识别的传统专名形式；脚注明确指出原文含有四字神名，不把它仅译作普通称号。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句式保持先知审判宣告的力度；以“倾倒”“火”“头上”等词保存原文意象，同时通过脚注解释容易误解的希伯来语惯用法。
