    rationale: 该动词在此与“火”意象相连，但核心义为使终结、毁灭、除尽；“毁灭”保留审判力度和火的隐喻，避免过度具体化。
  - severity: medium
    issue: “我使他们所行的归到他们自己头上”表达不够完整。
    rationale: 希伯来语“把他们的道路放在他们头上”是报应惯用语。中文补出“后果”可明确其惯用含义，同时仍保留“落在……头上”的原文形象。
  - severity: low
