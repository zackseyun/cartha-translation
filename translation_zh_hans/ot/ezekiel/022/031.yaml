revisions:
- from: 所以，我把我的愤怒倾倒在他们身上[a]，用我烈怒的火将他们烧灭。我使他们所行的归到他们自己头上[b]。这是主耶和华的宣告[c]。
  to: 因此，我把我的愤怒倾倒在他们身上[a]；我用我烈怒的火毁灭他们。我使他们所行的后果落在他们自己头上[b]。这是主耶和华的宣告[c]。
  rationale: 修订以“毁灭”对应כִּלִּיתִים，避免把毁灭性审判不必要地窄化为实际焚烧；以“所行的后果落在……头上”使报应惯用语在现代汉语中完整自然，并保留原文的头部意象。神名沿用中文圣经中稳定且可辨识的“主耶和华”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:52:31Z'
review_pass:
