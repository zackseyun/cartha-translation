  source_fidelity: 译文总体准确保留了倾倒忿怒、烈怒之火、行为归报于本人，以及先知宣告公式。惟“将他们烧灭”较容易把紧接“火”的比喻固定为实际焚烧；כִּלִּיתִים在此可指毁灭、除尽。另“使他们所行的归到他们自己头上”在现代汉语中缺少表示报应结果的中心语，语义略显悬空。
  naturalness: “主耶和华”“愤怒”“烈怒”等措辞庄重自然。将报应惯用语改作“使他们所行的后果落在他们自己头上”，既保留“头上”的形象，也使现代汉语句法完整清楚。
  terminology: “主耶和华”是אֲדֹנָי יְהוִה的既有中文圣经惯例，宜保留。脚注应仅说明该复合称谓含神的专名，不必引入“雅威”这一替代音译，以免在本节正文既已采用“耶和华”的情况下造成不必要的术语摇摆。
