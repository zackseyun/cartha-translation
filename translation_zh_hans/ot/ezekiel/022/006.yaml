  text: הִנֵּה֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל אִ֥ישׁ לִ/זְרֹע֖/וֹ הָ֣יוּ בָ֑/ךְ לְמַ֖עַן שְׁפָךְ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/006.yaml
  text: Look[a], the princes of Israel in you, each according to his power, were in you to shed blood.
translation:
  language: zh_hans
  text: 看哪，在你中间的以色列首领，各人凭着自己的权势[a]，为要流血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“各人按着自己的膀臂”；“膀臂”在这里是指力量或权势的转喻。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 这是强调并唤起注意的提示词；“看哪”既保留指示和警示语气，也符合庄重的先知文体。
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: 以色列的首领
  rationale: נָשִׂיא 指居于高位的统治者或领袖；“首领”既能体现其政治地位，又比现代汉语中的“王子”准确。
- source_word: בָךְ
  choice: 在你中间
  rationale: 阴性单数第二人称指被直接斥责的耶路撒冷；“在你中间”自然保留了对城的拟人化称呼。
- source_word: אִישׁ לִזְרֹעוֹ
  choice: 各逞臂力
  rationale: אִישׁ 在此作分配用法，意为“各自”；זְרוֹעַ 字面为“膀臂”，并转喻力量或权势。“各逞臂力”保留身体意象，同时表达首领仗恃并施展权力的语境含义。
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: 为要流人的血
  rationale: לְמַעַן 保留目的意味；“流人的血”以自然汉语保存 דָּם 的具体血液意象及杀人流血的指控。
theological_decisions:
- issue: 首领的“膀臂”究竟表示能力、权势，还是暴力手段
  choice: 正文译作“各逞臂力”，脚注说明其可指力量或权势
  alternative: 各按自己的权势；各仗着自己的力量
  rationale: 原文以“膀臂”转喻能力或权力，但具体侧重点具有开放性。正文保留意象，脚注交代习语含义，避免把它限定为政治权势或单纯体力。
- issue: לְמַעַן 是否暗示持续蓄意或仅表达目的
  choice: 为要
  alternative: 一心要；专为
  rationale: “为要”忠实表达目的关系，不额外强化为持续的心理状态，从而避免超出原文。
translation_notes:
  register: 采用现代、庄重而易懂的先知性措辞。“看哪”保留原文的警示力度；“首领”适合政治统治者语境；“各逞臂力”兼顾希伯来语身体意象与现代汉语可读性。
