  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]的话又临到我，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（四字神名），传统上也译作“耶和华”；此处译作“雅威”。
    reason: 说明神名的原文形式及常见替代译法。
lexical_decisions:
- source_word: וַיְהִי
  choice: 又临到
  rationale: 该叙事形式在这里引出先知书中连续发生的启示事件。用“又……临到”自然承接上下文，也保留事件推进的意味，避免直译成生硬的“事情发生了”。
- source_word: דְבַר
  choice: 话
  rationale: 在“雅威的话”这一固定先知启示公式中，“话”既贴近原文，又能指上帝所传达的信息；译作“信息”虽可理解，但会削弱原文反复出现的关键词联系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用上帝的专名四字神名 YHWH。译作“雅威”保留其作为名字的性质，而不以称号代替。
- source_word: אֵלַי
  choice: 临到我
  rationale: 原文介词表示话语朝向先知而来。汉语先知书的自然表达“临到我”准确体现启示由上帝传给先知。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文的直接话语；“说”简洁自然，并以冒号衔接下一节神谕。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 本节直接使用四字神名 YHWH。正文采用“雅威”，以保留其专名性质；脚注说明其他传统译法，不把某一称号或后起音译悄然代入原文。
translation_notes:
  register: 采用现代、庄重而通顺的先知书语体。“雅威的话又临到我”保留希伯来文启示公式的结构；句末用冒号自然引出下一节。
