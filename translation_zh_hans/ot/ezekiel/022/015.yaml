base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/015.yaml
  text: I will scatter you among the nations and disperse you through the lands[a], and I will purge your uncleanness from you.
translation:
  language: zh_hans
  text: 我必把你分散到列国中，驱散到各地；我必从你身上除尽污秽。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲפִיצוֹתִי
  choice: 我必把你分散
  rationale: 该动词在审判与流亡语境中表示驱散、分散；“分散”自然地传达耶路撒冷居民被放逐的图景。
- source_word: בַּגּוֹיִם
  choice: 到列国中
  rationale: גּוֹיִם在此指以色列之外的众国；“列国”简洁、庄重，也避免“外邦人”可能带来的额外解释色彩。
- source_word: וְזֵרִיתִיךְ
  choice: 把你撒
  rationale: זרה可指扬散或撒散。这里与前一动词平行；“撒”保留原文较具体的驱散意象，同时避免完全重复“分散”。
- source_word: בָּאֲרָצוֹת
  choice: 在各地
  rationale: 复数אֲרָצוֹת指诸地或各国地域；“各地”符合现代汉语表达，并传达广泛散布之意。
- source_word: וַהֲתִמֹּתִי
  choice: 我必除尽
  rationale: 使役形表达使之终止、彻底除去。“除尽”同时保留动作的完成性及其在审判中消除污秽的含义，不额外限定净化方式。
- source_word: טֻמְאָתֵךְ
  choice: 你的污秽
  rationale: טֻמְאָה兼具礼仪、道德及象征层面的不洁含义；“污秽”保留这种宽泛而严肃的语义。
- source_word: מִמֵּךְ
  choice: 你身上的
  rationale: 该介词表示污秽从受话者那里被除去；汉语“除尽你身上的污秽”自然、明确地表达来源与分离。
theological_decisions:
- issue: 审判中洁净的性质
  choice: 译为“我必除尽你身上的污秽”，把流散审判与污秽的终止相连，但不限定污秽是礼仪性的、道德性的还是比喻性的。
  alternative: “我必使你的污秽终止”或“我必从你那里除去你的污秽”。
  rationale: 原文使役动词תמם强调使污秽终止或被除尽。译文保留审判既惩罚又带来洁净的张力，而不引入经文本身没有明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“列国”保留先知文学语体；两个分散动词分别译作“分散”和“撒”，既呈现平行关系，也保留זרה可能具有的扬散意象。原文以阴性单数“你”称呼被人格化的耶路撒冷，汉语不必显明语法性别。
