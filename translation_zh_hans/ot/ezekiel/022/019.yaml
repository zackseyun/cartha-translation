base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/019.yaml
  text: 'Therefore thus says the Lord GOD: Because all of you have become dross[a], therefore behold, I am gathering you into the midst of Jerusalem.'
translation:
  language: zh_hans
  text: 因此，主耶和华如此说：“因为你们全都成了渣滓[a]，所以，看哪，我要把你们聚集到耶路撒冷当中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“炉渣”或“金属杂质”。希伯来语指熔炼金属时分离出来的废渣和杂质。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: 主耶和华
  rationale: 保留复合神圣称号的两个成分；“主耶和华”是现代中文圣经语体中自然、庄重且可辨识的表达。
- source_word: יַעַן הֱיוֹת כֻּלְּכֶם
  choice: 因为你们全都成了
  rationale: יַעַן引出审判的原因；הֱיוֹת在此表达已经形成的结果状态；“全都”明确保留第二人称复数整体性的强调。
- source_word: לְסִגִים
  choice: 金属渣滓
  rationale: סִיגִים指熔炼过程中与金属分离的废渣或杂质；加上“金属”可让普通读者立即把握本段的冶炼意象，同时避免单说“渣滓”被理解为一般污物。
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留宣告公式的强调和指示作用；与后面的行动结合，以“我要”自然表达希伯来语分词所传达的临近且确定的行动。
- source_word: קֹבֵץ אֶתְכֶם
  choice: 把你们聚集
  rationale: קֹבֵץ为分词，配合הִנְנִי表示正在临近或确定将要发生的行动；中文用“我要把你们聚集”兼顾自然表达与预告性质。
- source_word: אֶל תּוֹךְ יְרוּשָׁלִָם
  choice: 到耶路撒冷城中
  rationale: תּוֹךְ表示内部、当中；“城中”保留被聚集到耶路撒冷内部接受审判的空间意象，比仅译“到耶路撒冷”更具体。
theological_decisions:
- issue: 复合称号אֲדֹנָי יְהוִה中神名的译法
  choice: 主耶和华
  alternative: 主雅威／主上帝
  rationale: 采用中文读者熟悉的“耶和华”音译来保留四字神名，并以“主”对应אֲדֹנָי；不把两个成分合并为单一称号，也不借译法加入宗派性解释。
- issue: 聚集行动的时态与确定性
  choice: 我要把你们聚集
  alternative: 我正在把你们聚集
  rationale: הִנְנִי加分词可呈现生动、迫近且确定的行动。上下文是审判宣告，中文未来意向式更自然，但仍以“看哪”保留其迫切和强调，不将其弱化为一般将来预测。
translation_notes:
  register: 采用现代、庄重而易懂的宣告体。“因此……如此说”保留先知审判宣告的结构；“金属渣滓”清楚呈现上下文中的冶炼比喻。引号标示神谕正文，未增添原文没有的解释。
