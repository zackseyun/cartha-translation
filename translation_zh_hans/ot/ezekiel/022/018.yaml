id: EZK.22.18
reference: Ezekiel 22:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הָיוּ לִ֥/י בֵֽית יִשְׂרָאֵ֖ל ל/סוג כֻּלָּ֡/ם נְ֠חֹשֶׁת וּ/בְדִ֨יל וּ/בַרְזֶ֤ל וְ/עוֹפֶ֨רֶת֙ בְּ/ת֣וֹךְ כּ֔וּר סִגִ֥ים כֶּ֖סֶף הָיֽוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/018.yaml
  text: Son of man[a], the house of Israel has become dross to me; all of them are bronze and tin and iron and lead in the midst of a furnace; they are the dross of silver.
translation:
  language: zh_hans
  text: “人子啊，以色列家在我看来已经成了渣滓；他们全都是炉中的铜[a]、锡、铁和铅；他们是炼银所剩的渣滓。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜”也可译作“青铜”。
    reason: 原文נְחֹשֶת可指铜或青铜，具体所指在此不能完全确定。
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: 人子
  rationale: 保留《以西结书》中上帝称呼先知的惯用希伯来语表达，简洁庄重，也符合中文圣经语境。
- source_word: הָיוּ לִי
  choice: 在我看来已经成了
  rationale: 既表达לִי所标示的上帝视角，也传达完成式所呈现的结果状态；不进一步解释为弃绝或定罪。
- source_word: בֵית יִשְׂרָאֵל
  choice: 以色列家
  rationale: 保留原文的盟约群体称谓，不简化为“以色列”。
- source_word: לְסוּג
  choice: 渣滓
  rationale: 指熔炼过程中分离出的金属杂质或废渣；“渣滓”既准确，又能保留先知性比喻。
- source_word: כֻּלָּם
  choice: 他们全都是
  rationale: 明确表达原文指向整个群体的总括意义。
- source_word: נְחֹשֶת
  choice: 铜
  rationale: 该词可指铜或青铜；中文“铜”能自然保留材质类别及原词的语义宽度，脚注列出“青铜”这一可能译法。
- source_word: בְדִיל
  choice: 锡
  rationale: 熔炼和合金语境中的标准金属名称。
- source_word: בַרְזֶל
  choice: 铁
  rationale: 直接对应原文金属名称。
- source_word: עוֹפֶרֶת
  choice: 铅
  rationale: 直接对应原文金属名称。
- source_word: בְּתוֹךְ כּוּר
  choice: 炉中
  rationale: כּוּר在此为熔炼金属的炉；“炉中”自然简练，并保留空间关系。
- source_word: סִגִים כֶּסֶף
  choice: 炼银所剩的渣滓
  rationale: 显明这是炼银过程中被分离出来的渣滓，避免中文“银的渣滓”可能造成的生硬或误解，同时保留比喻核心。
theological_decisions:
- issue: לִי中第一人称所表达的神圣说话者视角
  choice: 译为“在我看来”，保留上帝对以色列的评价关系
  alternative: 译为“对我而言”或直译“对我成了”
  rationale: 原文表达以色列在耶和华眼中所处的状态；译文不扩展为“被我弃绝”等神学解释。
- issue: 熔炼金属的比喻
  choice: 保留渣滓、炉和各类金属的具体意象
  alternative: 意译为以色列全然败坏或毫无价值
  rationale: 本节的审判力度来自熔炼比喻本身；保留意象可避免把经文本身的神学张力扁平化。
- issue: 末句与前文的关系
  choice: 译为独立判断“他们是炼银所剩的渣滓”
  alternative: 译为“他们都成了银渣”
  rationale: 原文末句使用הָיוּ，语序强调“炼银的渣滓”；当前译法保持其判断性质，又不强行重复“已经成了”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。分号保留原文连续展开的熔炼意象；“炼银所剩的渣滓”使冶炼背景清楚，同时不添加道德化释义。
