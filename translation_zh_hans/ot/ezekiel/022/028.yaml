source:
  edition: WLC
  text: וּ/נְבִיאֶ֗י/הָ טָח֤וּ לָ/הֶם֙ תָּפֵ֔ל חֹזִ֣ים שָׁ֔וְא וְ/קֹסְמִ֥ים לָ/הֶ֖ם כָּזָ֑ב אֹמְרִ֗ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וַֽ/יהוָ֖ה לֹ֥א דִבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/028.yaml
  text: And her prophets have plastered for them with whitewash[a], seeing falsehood and divining lies for them, saying[b], ‘Thus says the Lord GOD,’ when Yahweh has not spoken.
translation:
  language: zh_hans
  text: 她的先知为他们用白灰粉饰[a]，看见虚假的异象，为他们占卜谎言；他们说：“主耶和华[b]如此说：”其实，耶和华并没有说过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为他们抹上未调好的灰泥”或“涂上劣质灰浆”。希伯来文描绘用表层涂料遮住缺陷的景象。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文先称“主耶和华”（אֲדֹנָי יְהוִה），随后直接使用神名“耶和华”（יְהוָה）。
    reason: divine_name_clarification
lexical_decisions:
- source_word: וּנְבִיאֶיהָ
  choice: 她的先知
  rationale: 构造复数名词带第三人称阴性单数后缀，指前文所拟人化之城的先知；中文自然表达为“她的先知”。
- source_word: טָחוּ לָהֶם תָּפֵל
  choice: 为他们粉饰掩盖
  rationale: טוח表示涂抹、抹灰，תפל在以西结书的墙体意象中指不牢靠或骗人的表层涂料。“粉饰掩盖”既保留涂抹覆盖的图像，也传达遮蔽缺陷的欺骗作用；脚注保留字面替代译法。
- source_word: חֹזִים שָׁוְא
  choice: 所见的是虚假
  rationale: 保留“看见异象”这一先知活动的视觉用语，并将שָׁוְא在此处的虚妄、欺骗含义译为“虚假”。
- source_word: וְקֹסְמִים לָהֶם כָּזָב
  choice: 为他们占卜的是谎言
  rationale: קֹסְמִים特指占卜，不泛化为预言；“谎言”准确表达כָזָב的欺骗性。
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: 主耶和华如此说
  rationale: 保留标准先知使者公式的庄重节奏；אֲדֹנָי יְהוִה译作“主耶和华”，避免重复称作“主”。
- source_word: וַיהוָה לֹא דִבֵּר
  choice: 其实耶和华并没有说
  rationale: “其实”明确原文ו在此形成的反差；完成式译作“并没有说”，突出他们所宣称的神谕实际上从未由耶和华发出。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文以现代中文读者熟悉且能作为专名识别的“耶和华”对应四字神名；不把神名普通化为头衔。复合称号אֲדֹנָי יְהוִה相应译为“主耶和华”。
- issue: תָּפֵל的墙体隐喻
  choice: 粉饰掩盖
  alternative: 抹上未调好的灰泥；涂上劣质灰浆
  rationale: 原词所指材料的确切性质存在词义争议，但上下文清楚表达以表层涂抹遮盖结构问题。“粉饰掩盖”让现代读者理解比喻，同时以脚注保存较字面的可能译法。
- issue: 虚假异象与占卜的区分
  choice: 分别译作“所见的是虚假”与“占卜的是谎言”
  alternative: 合并译作“说虚假的预言”
  rationale: 原文使用两个不同的先知活动词，分别涉及看见和占卜；保留二者可避免抹平经文对虚假宗教活动的层叠指控。
translation_notes:
  register: 采用现代、庄重而清楚的书面普通话。“粉饰掩盖”兼具具体涂抹意象和道德欺骗意味；分号保持原文连续分词指控的推进感。所有脚注标记均已置于正文。
