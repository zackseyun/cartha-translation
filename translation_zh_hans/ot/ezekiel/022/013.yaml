  text: וְ/הִנֵּה֙ הִכֵּ֣יתִי כַפִּ֔/י אֶל בִּצְעֵ֖/ךְ אֲשֶׁ֣ר עָשִׂ֑ית וְ/עַ֨ל דָּמֵ֔/ךְ אֲשֶׁ֥ר הָי֖וּ בְּ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/013.yaml
  text: And behold[a], I strike my hand against your unjust gain that you have made[b], and against the bloodshed that has been in your midst.
translation:
  language: zh_hans
  text: 看哪，我因你所谋取的不义之财[a]，和你中间的流血之事[b]，拍掌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不义之财”也可译作“以欺诈所得的财利”或“贪得的利益”。希伯来词可指借不公或暴力取得的利益。
    reason: lexical_alternative
  - marker: b
    text: “流血之事”也可译作“血债”。希伯来文的“血”可统指流血的行为，也可包括这些行为所带来的罪责。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留先知话语中唤起注意、加强现场感的提示语；“看哪”庄重而仍为现代读者所熟悉。
- source_word: הִכֵּיתִי כַפִּי
  choice: 我愤然击掌
  rationale: 保留“击打手掌”这一具体的拟人化动作；“愤然”依上下文表明这是面对罪恶所作的审判性动作，而不是表示赞赏。希伯来语完成式在此按生动的宣告处理。
- source_word: אֶל ... וְעַל
  choice: 因……也因……
  rationale: 现代汉语不宜直译为“向不义之财击掌”；因果结构自然传达这动作是针对所列罪恶而发，同时不把动作解释得过细。
- source_word: בִּצְעֵךְ
  choice: 你所得的不义之财
  rationale: בצע在本段语境中不是中性的收益，而是借不公或暴力取得的利益；“不义之财”兼顾经济含义和道德谴责。
- source_word: אֲשֶׁר עָשִׂית
  choice: 你所得的
  rationale: 希伯来文直译为“你所做成的”，与“财利”搭配时，现代汉语用“所得的”更自然，并准确表达取得利益之意。
- source_word: דָּמֵךְ
  choice: 你中间所流的血
  rationale: 原文“血”具有集合意义，可指流血之事，也可能连带血债；正文保留“血”的具体意象，脚注说明另一种理解。
- source_word: אֲשֶׁר הָיוּ בְּתוֹכֵךְ
  choice: 你中间所流的
  rationale: 保留对耶路撒冷城所用的第二人称表达，并以自然汉语呈现发生在城内的流血罪行。
theological_decisions:
- issue: 上帝击掌这一动作的性质
  choice: 译作“我愤然击掌”，保留具体的拟人化审判动作
  alternative: “我向……击掌”或“我拍掌斥责……”
  rationale: 原文描绘耶和华面对耶路撒冷罪恶所作的强烈动作。正文不将其淡化为抽象的“审判”，也不解释成赞赏性的拍手；“愤然”根据谴责语境点明其方向。
- issue: “血”是流血行为还是血债
  choice: 正文译为“所流的血”
  alternative: “你的血债”
  rationale: 上下文明确涉及城中的暴力与流血，但复数形式也可能包含由此产生的罪责；正文采用具体意象，脚注保留“血债”的可能。
translation_notes:
  register: 采用现代、庄重而易懂的先知宣告语体。“看哪”保留原文的强调；全句调整为自然汉语的因果次序，同时保留击掌、财利和血的具体意象。
