revisions:
- from: 看哪，因你所得的不义之财[a]，也因你中间所流的血[b]，我愤然击掌。
  to: 看哪，我因你所谋取的不义之财[a]，和你中间的流血之事[b]，拍掌。
  rationale: 修订以“拍掌”替换容易被误解为庆贺或相互击掌的“愤然击掌”，仍保留原文具体的拟人化审判动作；“谋取的不义之财”表达不正当获利；“你中间的流血之事”更贴近原文对城内流血的集合性陈述。句中的“因……和……”在现代汉语中自然表达该动作针对两项罪状，未将其解释为抽象审判。
