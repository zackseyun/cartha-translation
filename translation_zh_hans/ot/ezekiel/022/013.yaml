  naturalness: “击掌”在当代汉语常指两人相互拍手或表示赞许；用于独自作出审判性手势不够自然。“拍掌”较能承载先知文本中这一愤慨的动作。“你中间所流的血”可以理解，但“你中间的流血之事”更直接对应“在你中间的血”，且避免把原文的存在状态过度改写为关系从句。
  terminology: “不义之财”恰当表达בצע的不正当获利；将“所得”微调为“谋取的”可更清楚体现该词在本段的贬义及“你所做成的”之意。“流血之事”保留血的集合性，脚注可说明“血债”这一解释性替代。
