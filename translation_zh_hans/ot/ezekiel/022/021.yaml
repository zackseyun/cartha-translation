  text: וְ/כִנַּסְתִּ֣י אֶתְ/כֶ֔ם וְ/נָפַחְתִּ֥י עֲלֵי/כֶ֖ם בְּ/אֵ֣שׁ עֶבְרָתִ֑/י וְ/נִתַּכְתֶּ֖ם בְּ/תוֹכָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/021.yaml
  text: I will gather you[a], and I will blow on you with the fire of my wrath, and you will be melted within it.
translation:
  language: zh_hans
  text: 我必聚集你们，向你们吹我烈怒的火；你们必在其中[a]熔化。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中”可能指上下文中的耶路撒冷，也可能指熔炉或熔炼的场所。
    reason: 保留原文阴性单数后缀的所指歧义；上下文交织城市与熔炼意象，正文不宜确定其先行词。
lexical_decisions:
- source_word: כִנַּסְתִּי
  choice: 聚集
  rationale: 该动词表示把众人收拢到一处；在上下文中，这是为审判而聚集，同时延续熔炼金属的意象。“聚集”自然、准确，也不额外说明聚集的地点。
- source_word: נָפַחְתִּי עֲלֵיכֶם
  choice: 向你们吹起
  rationale: נפח意为“吹、吹气”，这里使人联想到向炉火鼓风。译作“向你们吹起”保留具体意象，并自然表达介词עַל在此处的方向性。
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: 我烈怒的火
  rationale: עֶבְרָה表示强烈、倾泻而出的愤怒；“烈怒”庄重而有力度。“火”保留熔炼场景，“吹起……的火”以自然汉语表达原文中吹风与火的关系。
- source_word: נִתַּכְתֶּם
  choice: 你们就必熔化
  rationale: נתך在此熔炼金属的语境中指熔化或化为液态。“熔化”比一般的“融化”更贴合金属冶炼意象，也避免使用过度专业的术语。
- source_word: בְּתוֹכָהּ
  choice: 在其中
  rationale: 原文使用阴性单数代词后缀而未在本句明确重述所指。“在其中”保留这种指代上的开放性，不把它限定为城、火或熔炉。
theological_decisions:
- issue: בְּתוֹכָהּ中阴性单数后缀的所指
  choice: 用“在其中”保留未明确的指代
  alternative: 明确译为“在城中”“在火中”或“在熔炉中”
  rationale: 上下文把耶路撒冷与熔炉、炉火的审判意象交织在一起。原句没有明确重述先行词，因此正文不应替读者消除这一先知性意象中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“吹起……的火”保留鼓风助燃的熔炉画面；分号清楚呈现神的行动与随之而来的结果。
