  yaml_path: translation/ot/ezekiel/022/008.yaml
  text: You have despised my holy things[a], and you have profaned my Sabbaths.
translation:
  language: zh_hans
  text: 你藐视我的圣物[a]，亵渎我的安息日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我的圣所”或“我的圣地”。希伯来语也可较具体地指神圣的地方；此处译作较宽泛的“我的圣物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדָשַׁי
  choice: 我的圣物
  rationale: 该词是“圣”之复数形式并带第一人称单数后缀，直译为“我的圣物”。“圣物”在现代汉语中可概括属于上帝、分别为圣的事物，又不把所指限缩为圣所或圣殿。
- source_word: בָּזִית
  choice: 你藐视
  rationale: בזה 表示轻看、鄙视或以蔑视相待。“藐视”简洁自然，并保留这项指控的道德力度。
- source_word: שַׁבְּתֹתַי
  choice: 我的安息日
  rationale: 该词为“安息日”的复数并带第一人称单数后缀。汉语通常用“安息日”作通称，无须以“诸安息日”刻意标出复数；“我的”则保留其圣约归属。
- source_word: חִלָּלְתְּ
  choice: 亵渎
  rationale: חלל 的 Piel 形在礼仪与圣洁语境中指把圣洁之物当作凡俗。“亵渎”准确表达侵犯神圣性的含义，也与“安息日”自然搭配。
theological_decisions:
- issue: קָדָשַׁי 的所指范围
  choice: 广义地译作“我的圣物”
  alternative: 具体译作“我的圣所”或“我的圣地”
  rationale: 希伯来语复数可以广泛指属于上帝并分别为圣之物；译作“圣物”避免擅自把所指限定为圣殿或某些圣所，同时仍符合以西结书的圣洁语境。
translation_notes:
  register: 采用现代、庄重而简洁的普通话。“藐视—亵渎”保留原文两个并列指控；不补出主语之外的解释，也不将“圣物”窄化为圣殿。
