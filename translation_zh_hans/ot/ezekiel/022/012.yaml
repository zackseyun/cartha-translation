  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שֹׁ֥חַד לָֽקְחוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם נֶ֧שֶׁךְ וְ/תַרְבִּ֣ית לָקַ֗חַתְּ וַ/תְּבַצְּעִ֤י רֵעַ֨יִ/ךְ֙ בַּ/עֹ֔שֶׁק וְ/אֹתִ֣/י שָׁכַ֔חַתְּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/012.yaml
  text: In you they have taken bribes to shed blood; you have taken interest and profit[a], and you have extorted your neighbors by oppression, and you have forgotten me, declares the Lord GOD.
translation:
  language: zh_hans
  text: 在你中间，有人为流人血而收受贿赂；你收取利息和增额[a]，又以欺压剥削你的邻舍；你忘了我——这是主耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“利息和加增”。希伯来文使用两个相关词，指借贷所得的利息与增额。
    reason: 说明 נֶשֶׁךְ 与 תַרְבִּית 的词义关联及替代译法，并保留原文双词结构。
lexical_decisions:
- source_word: שֹׁחַד לָקְחוּ בָךְ
  choice: 在你里面，有人……收受贿赂
  rationale: 保留对人格化耶路撒冷的第二人称阴性称呼；复数动词在汉语中自然表达为城中有人反复从事此事。
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: 为流人血
  rationale: 表达目的，保留“流血”的先知性伦理措辞，并避免把具体方式限定为司法谋杀。
- source_word: נֶשֶׁךְ
  choice: 利息
  rationale: 指借贷所得的利息；现代汉语清楚直接，且上下文表明其受谴责的剥削性质。
- source_word: תַרְבִּית
  choice: 增益
  rationale: 本义为增加、增额，与“利息”并列，保留希伯来文两个相关而不完全相同的借贷获利术语。
- source_word: וַתְּבַצְּעִי רֵעַיִךְ בָּעֹשֶׁק
  choice: 又以欺压牟取邻舍的财利
  rationale: בצע在此指贪图并取得不义之利；配合“以欺压”，译文明确呈现从邻舍身上榨取利益的含义。
- source_word: וְאֹתִי שָׁכַחַתְּ
  choice: 你却忘了我
  rationale: “却”体现原文末尾转向上帝并形成控诉高潮，但不额外解释这种忘记的神学机制。
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: 这是主耶和华的宣告
  rationale: נְאֻם译为庄重而自然的先知宣告公式；אֲדֹנָי יְהוִה译作“主耶和华”，既区分称号与圣名，也符合现代中文圣经语域。
theological_decisions:
- issue: 神名 יְהוִה 在 אֲדֹנָי יְהוִה 中的译法
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: “耶和华”是现代中文读者熟悉的专名形式，可保留盟约圣名与“主”这一称号的区别；不采用英文层所列理由中彼此不一致的大小写替代方案。
- issue: 借贷取利的两项罪名是否合并解释为高利贷
  choice: 保留为“利息和增益”两个词项
  alternative: 高利贷和额外收益
  rationale: 原文并列 נֶשֶׁךְ 与 תַרְבִּית；不把谴责范围擅自缩限为现代意义上仅指过高利率的“高利贷”。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“在你里面”“你”维持对耶路撒冷的拟人化指控；避免过度古雅的“受贿以流血”句式，也不将经济罪名现代法律化。
