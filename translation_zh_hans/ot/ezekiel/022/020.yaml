id: EZK.22.20
reference: Ezekiel 22:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: קְבֻ֣צַת כֶּ֡סֶף וּ֠/נְחֹשֶׁת וּ/בַרְזֶ֨ל וְ/עוֹפֶ֤רֶת וּ/בְדִיל֙ אֶל תּ֣וֹךְ כּ֔וּר לָ/פַֽחַת עָלָ֥י/ו אֵ֖שׁ לְ/הַנְתִּ֑יךְ כֵּ֤ן אֶקְבֹּץ֙ בְּ/אַפִּ֣/י וּ/בַ/חֲמָתִ֔/י וְ/הִנַּחְתִּ֥י וְ/הִתַּכְתִּ֖י אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/020.yaml
  text: As silver and bronze and iron and lead and tin are gathered into the midst of a furnace[a], to blow fire on it in order to melt it, so I will gather you in my anger and in my wrath[b], and I will place you there and melt you.
translation:
  language: zh_hans
  text: 银、青铜[a]、铁、铅和锡怎样被聚集到熔炉中，向其中鼓火，使它们熔化；我也要照样在我的怒气和烈怒中聚集你们，把你们安置在那里，将你们熔化[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “青铜”也可译作“铜”。
    reason: lexical_alternative
  - marker: b
    text: “熔化”也可按冶金语境译作“熔炼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְבֻצַת
  choice: 怎样被聚集
  rationale: 此名词形式与后文 כֵּן 构成比较；汉语用被动动词表达更自然，并避免添加原文没有明说的施事者。
- source_word: כֶּסֶף
  choice: 银
  rationale: 金属名称的常规对应，保留熔炼意象。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或青铜；正文采用现代汉语较宽泛、自然的“铜”，并以脚注保留“青铜”的可能。
- source_word: בַרְזֶל
  choice: 铁
  rationale: 标准对应。
- source_word: עוֹפֶרֶת
  choice: 铅
  rationale: 标准对应。
- source_word: בְדִיל
  choice: 锡
  rationale: 在金属清单中最可能指锡；比宽泛的“合金”更直接。
- source_word: אֶל תּוֹךְ כּוּר
  choice: 在熔炉中
  rationale: כּוּר 指熔炼用的炉；“在熔炉中”自然表达进入炉内的含义。
- source_word: לָפַחַת עָלָיו אֵשׁ
  choice: 人吹火
  rationale: 表达向炉中金属鼓风加火的动作；补出泛指的“人”，使现代汉语句法完整而不指定特定人物。
- source_word: לְהַנְתִּיךְ
  choice: 熔化它们
  rationale: 使役形式在此指使金属熔化；“它们”按汉语习惯回指列举的多种金属。
- source_word: כֵּן אֶקְבֹּץ
  choice: 我也要照样……聚集
  rationale: 保留 כֵּן 的类比作用，并以“聚集”对应重复出现的 קבץ 词根。
- source_word: בְּאַפִּי וּבַחֲמָתִי
  choice: 在我的怒气和烈怒中
  rationale: 分别呈现两个近义而递进的愤怒用语，不把两者合并或削弱。
- source_word: וְהִנַּחְתִּי
  choice: 把你们放在那里
  rationale: 此处 נוח 的使役式最适合理解为安置、放下；“在那里”根据熔炉场景明确其指向。
- source_word: וְהִתַּכְתִּי אֶתְכֶם
  choice: 将你们熔化
  rationale: 延续熔炉比喻，保留审判的强烈力度；也可按冶金语境译作“熔炼你们”。
theological_decisions:
- issue: 是否把熔炉意象解释为洁净或试炼
  choice: 保留“聚集……熔化”的惩罚性审判意象
  alternative: 译为“炼净你们”或“考验你们”
  rationale: 本节上下文强调对耶路撒冷的烈怒与审判；原文没有在此明确说明炼净结果，因此不应把“熔化”弱化或预先解释成净化。
- issue: 两个愤怒词语的关系
  choice: 译作“怒气和烈怒”
  alternative: 合并为“盛怒”
  rationale: 原文并列 אַף 与 חֵמָה，保留两项能呈现其累积和强化效果，同时不赋予两词过度细分的教义含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句式保留“怎样……也照样……”的比较结构，并重复“聚集”“熔化”，呼应希伯来文的关键词和熔炉意象。
