  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: zh_hans
  text: 耶和华使一阵极强的海风[a]转向；这风卷走蝗虫，把它们赶进芦苇海[b]。埃及全境连一只蝗虫也没有留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“海风”；在埃及的地理环境中，可能指从海上吹来的西风。
    reason: 保留 רוּחַ יָם 的字面意象及其地理解释，避免把方位判断当作原文唯一明说的含义。
  - marker: b
    text: “芦苇海”传统译作“红海”。
    reason: 说明原文地名与读者熟悉的传统译名之间的关系。
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: 使风向转变
  rationale: הפך可表示转变、改变；这里涉及风的方向，用“使风向转变”既符合语境，也避免误解为创造了一阵风。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”直接呈现四字神名，而不以称号替代。
- source_word: רוּחַ יָם
  choice: 西风
  rationale: 字面是“海风”；在埃及地理环境中，海位于西面，因此指从海上吹来的西风。正文采用自然明确的方位表达，并以脚注保留原文意象。
- source_word: חָזָק מְאֹד
  choice: 极强
  rationale: 准确表达“非常强”的强化语气，中文简洁自然。
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: 风卷走蝗虫
  rationale: נשא有举起、携带之义；以风为施事时，“卷走”最符合现代汉语表达。补出“风”使主语清楚。
- source_word: וַיִּתְקָעֵהוּ
  choice: 把蝗虫赶进
  rationale: תקע在此表示强力驱入；单数后缀指作为集合体的蝗群，中文用“蝗虫”可自然兼顾集合意义。
- source_word: יָמָּה סּוּף
  choice: 芦苇海
  rationale: 按希伯来语地名 יַם־סוּף 的通常词义直译，保留原文名称；传统译名“红海”置于脚注。
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: 连一只蝗虫也没有留下
  rationale: 保留原文“一只也没有”的完全否定和强调语气。
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: 埃及全境
  rationale: גְּבוּל在此指领土范围；“全境”准确、自然且简洁。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名，正文保留为专名，不以“上主”等称号代替；“耶和华”是现代简体中文圣经语境中最广为人知的专名形式。
- issue: 地名 יַם־סוּף 的译法
  choice: 芦苇海
  alternative: 红海
  rationale: 优先呈现希伯来语名称的词义，同时用脚注提供传统译名，不对其确切地理范围作超出本节的判定。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“使风向转变”体现首个动词与风向变化的关系；后句重提“风”，避免连续代词造成歧义。脚注标记均紧随相应词语。
