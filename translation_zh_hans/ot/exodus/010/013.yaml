  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: zh_hans
  text: 于是，摩西向埃及地伸出他的杖；雅威使东风刮过那地，整整一天，整整一夜。到了早晨，东风把蝗虫带来了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּט
  choice: 伸出
  rationale: נטה在此指把杖伸向某处；“伸出”自然、准确，也符合灾祸叙事中反复出现的动作表达。
- source_word: מַטֵּהוּ
  choice: 他的杖
  rationale: מַטֶּה可指杖或棍；此处是摩西施行神迹时所用的杖，译作“杖”简洁清楚。
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: 向埃及地
  rationale: עַל在伸杖这一动作中有朝向并临于其上的意味；现代汉语用“向埃及地伸出”比逐字译作“在埃及地之上”更自然。
- source_word: נִהַג
  choice: 使……刮过
  rationale: נהג本义可指驱赶、引导；以风为宾语时表示主动驱使风运行，汉语“使东风刮过”兼顾使役性和自然表达。
- source_word: רוּחַ קָדִים
  choice: 东风
  rationale: 该短语指从东方吹来的风；“东风”是标准、简练的汉语表达。
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: 整整一天，整整一夜
  rationale: 保留两次כָּל所强调的完整持续时间，并以对称的现代汉语表达出来。
- source_word: הַבֹּקֶר הָיָה
  choice: 到了早晨
  rationale: 希伯来语字面为“早晨到了／成为早晨”；“到了早晨”自然地标示时间推进。
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: 把蝗虫带来了
  rationale: נשא在这里描述风携带并带来蝗虫；“带来了”清楚表达结果，并与前文整夜刮风的过程相连。
- source_word: הָאַרְבֶּה
  choice: 蝗虫
  rationale: 原文单数形式在此作集合名词，汉语“蝗虫”本身即可表达群体，无须增添“群”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；采用“雅威”以音译保留其专名性质，不以称号代替，也不引入特定宗派解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号呈现摩西的动作与雅威随后的作为之间的紧密关系；“整整一天，整整一夜”保留原文重复所形成的持续强调。
