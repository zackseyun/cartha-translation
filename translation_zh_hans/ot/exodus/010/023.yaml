  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: zh_hans
  text: 三天之久，人们彼此看不见，谁也没有从原处起来；但所有以色列人在他们的住处都有光。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“各人看不见自己的弟兄”；这是表示相互关系的说法，即“彼此看不见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא רָאוּ אִישׁ אֶת־אָחִיו
  choice: 人彼此看不见
  rationale: אִישׁ אֶת־אָחִיו 是相互表达，字面为“各人看不见自己的弟兄”。译作“人彼此看不见”自然传达彼此不可见的意思，也不把 אָחִיו 限定为亲生兄弟。未译作“没有看见”，因为本节所述浓重黑暗在语境中表示无法看见。
- source_word: וְלֹא־קָמוּ אִישׁ מִתַּחְתָּיו
  choice: 谁也不能从自己的地方起来
  rationale: אִישׁ 在此作逐一、泛指用法，译作“谁也”符合现代汉语。מִתַּחְתָּיו 字面为“从他下面”，在这里是“从所在之处”的习语。结合黑暗浓重到可触摸的上下文，“不能……起来”自然表达其结果；脚注保留更少解释性的译法。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三天之久
  rationale: 明确表达持续时间，并保持庄重而自然的叙事语体。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众人
  rationale: 该词组是群体称谓，指以色列民，并非只指男性或儿童。“以色列众人”既准确又符合现代汉语；“以色列人”也是可行译法。
- source_word: הָיָה אוֹר
  choice: 都有光
  rationale: 希伯来语以存在结构表达光临到或可供他们使用；汉语“都有光”简洁地呈现与埃及黑暗的对比。
- source_word: בְּמוֹשְׁבֹתָם
  choice: 在各自的住处
  rationale: מוֹשָׁב 可指住处或居住地。复数所有格与 לְכָל 相呼应，译作“各自的住处”清楚自然，同时不武断限定为房屋内部。
