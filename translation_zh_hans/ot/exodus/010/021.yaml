base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你向天空伸出手，使埃及地上有黑暗，连黑暗也仿佛可以触摸。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 末句的希伯来语动词十分罕见，通常理解为“黑暗可以被触摸”或“黑暗可以被感觉到”。其确切含义仍有争议；译文保留黑暗仿佛具有可触性的强烈意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式来呈现四字神名，不以“主”替代原文中的专名。
- source_word: נְטֵה יָדְךָ
  choice: 伸出手
  rationale: 准确表达 נטה 命令式所指的伸展动作，中文自然简洁。
- source_word: עַל הַשָּׁמַיִם
  choice: 向天空
  rationale: 介词 עַל 在此配合伸手动作表示方向；“向天空”符合现代汉语，也保留向上指向天空的图景。
- source_word: וִיהִי חֹשֶׁךְ
  choice: 使……陷入黑暗
  rationale: 该祈愿式在语境中表达动作所要产生的结果；此译法比逐字译作“让黑暗存在”更自然。
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: 埃及全境
  rationale: אֶרֶץ מִצְרָיִם 指埃及之地；“全境”自然表达黑暗笼罩该地的范围。
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: 这黑暗甚至可以摸得到
  rationale: ימש 是罕见且释义有争议的动词；主译采用传统的“触摸、感觉”理解，并用“甚至”传达末句对黑暗浓重可感的强调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用四字神名，故保留为专名而不改作称号；“耶和华”是普通现代中文读者最熟悉的形式。
- issue: 末句是否断定黑暗具有实体性质
  choice: 译为“可以摸得到”，同时加注说明原文歧义
  alternative: 黑暗被感觉到；人在黑暗中摸索
  rationale: 该罕见动词允许不同分析。正文保留传统的强烈图景，但脚注避免把其具体意义绝对化，从而保存原文的词义张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“陷入黑暗”表现结果，“摸得到”保留原文末句鲜明而异常的表达；脚注交代罕见动词的主要译解。
