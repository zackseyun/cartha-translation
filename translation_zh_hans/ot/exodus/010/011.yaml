  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: zh_hans
  text: “不行！男子们去事奉雅威[a]吧，因为这正是你们所求的。”于是，法老把他们从自己面前赶了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה 的音译。
    reason: divine_name
lexical_decisions:
- source_word: לֹא כֵן
  choice: 不行！
  rationale: 这是对先前要求的断然拒绝；“不行”在现代汉语中自然地传达法老突然而强硬的语气。
- source_word: לְכוּ נָא הַגְּבָרִים
  choice: 只让男人去吧
  rationale: 原文直译近于“男人们现在去吧”。结合上文法老拒绝让老少和儿女一同离开的语境，补出“只让”可清楚表达其限制性让步；“吧”体现 נָא 对命令语气的缓和。
- source_word: הַגְּבָרִים
  choice: 男人
  rationale: גְּבָרִים 明确指男性，而非全体百姓；保留这一性别限定对呈现法老的部分让步至关重要。
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: 去事奉雅威
  rationale: עבד 在以神为对象时兼有服事与敬拜之意；“事奉”保留其较宽的盟约性含义，也符合庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文所用的立约之名。
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: 因为这正是你们所求的
  rationale: 阴性代词所指并未明说，可能指所求之事；“这”保留指代的概括性，不擅自限定具体先行词。
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: 于是，法老把他们……赶了出去
  rationale: 单数动词在语境中最自然地以法老为主语；“赶了出去”传达 גּרש 的强制驱逐意味。
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: 从自己面前
  rationale: 这是“从法老面前”的自然汉语表达；因本句已明确补出法老为主语，用“自己”避免生硬重复，同时保留宫廷觐见场景。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其作为立约之名的专名性质。
- issue: 法老所准许离开者的性别限制
  choice: 只让男人去
  alternative: 让众人去；让成年男子去
  rationale: 原文 הַגְּבָרִים 明确指男性。保留这一限制，才能呈现法老并未接受全体以色列人离开的要求，以及他部分让步所造成的叙事张力。
- issue: עבד 在此处的含义
  choice: 事奉
  alternative: 敬拜
  rationale: 该词在宗教语境中可兼指服事和敬拜；“事奉”避免把含义缩窄为礼仪行为，同时仍自然包含对神的敬拜。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。法老的话简短强硬；“只让男人去吧”结合近处语境显明其限制性让步。正文中的脚注标记与脚注完全对应。
