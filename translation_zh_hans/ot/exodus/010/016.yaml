base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: zh_hans
  text: 于是，法老赶紧召来摩西和亚伦，说：“我得罪了雅威——你们的上帝，也得罪了你们。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 赶紧
  rationale: 该词表示迅速、急切地采取行动；“赶紧”是自然的现代汉语，也保留了叙事中的紧迫感。
- source_word: לִקְרֹא לְמֹשֶׁה וּלְאַהֲרֹן
  choice: 召来摩西和亚伦
  rationale: 介词结构在这里表示叫人前来；“召来”既符合君王发令的语境，也比单说“叫”更准确凝练。
- source_word: חָטָאתִי
  choice: 我得罪了
  rationale: חטא 表示犯罪、得罪；后接受冒犯者时，汉语“得罪了”自然地保留其道德与关系层面的力度。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 介词 ל 在 חטא 之后标明受冒犯的一方；其关系由汉语动词“得罪”表达。יהוה 按其专名译作“雅威”。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 复数第二人称后缀明确指摩西和亚伦共同所信奉的上帝；保留“你们的”，不改成“我们的”。
- source_word: וְלָכֶם
  choice: 也得罪了你们
  rationale: 复数“你们”指摩西和亚伦；重复“得罪了”可使现代汉语清楚顺畅，并准确承接前面的 חטא。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为专名的性质，不以称号代替。
- issue: 法老认罪的对象
  choice: 我得罪了雅威你们的上帝，也得罪了你们
  alternative: 我向雅威你们的上帝和你们犯了罪
  rationale: 原文两次使用 ל 标明犯罪所针对的对象。汉语用“得罪……也得罪……”最自然，并保留法老将雅威称为“你们的上帝”而非“我的上帝”或“我们的上帝”的距离感。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接前文叙事，“赶紧”表现法老在灾情下的急迫；引语简洁直接。无须脚注。
