base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: zh_hans
  text: 它们必充满你的房屋、你众臣仆的房屋，以及全埃及的房屋；这是你的祖先和你祖先的祖先自从在世以来，直到今日所未曾见过的。”随后，摩西转身离开法老。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: 它们必充满
  rationale: 承接上文所说的蝗虫，以复数代词明确隐含主语；完成式在预告语境中表达将来必然发生之事。
- source_word: בָתֶּיךָ
  choice: 你的宫室
  rationale: 原文为复数“你的房屋”。对法老说话时译作“宫室”较符合王宫语境，同时保留复数范围；不缩窄为单数“宫殿”。
- source_word: עֲבָדֶיךָ
  choice: 你的臣仆
  rationale: 在法老宫廷语境中指服事法老的人，包括臣属或官员；“臣仆”既保留“仆人”的词义，又避免误解为一概是奴隶。
- source_word: בָתֵּי כָל מִצְרַיִם
  choice: 全埃及人的房屋
  rationale: “埃及”在此可转指埃及全境或其中居民；结合“房屋”译为“全埃及人的房屋”最自然，并保留灾害范围不断扩大的结构。
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: 这样的灾害……从未见过
  rationale: 关系从句回指上文所预告、史无前例的蝗灾。补出“这样的灾害”使现代汉语指向清楚，但不改变所指。
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: 你的祖先和你祖先的祖先
  rationale: 保留希伯来文重复而递进的世代表达；不译成“父亲和祖父”，以免把范围缩窄到两代。
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: 自……在世以来
  rationale: 直义涉及“从他们存在于地上之日”；“在世以来”自然表达历代祖先在地上生活的时间范围。
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: 于是，摩西转身离开法老
  rationale: 主语由上下文确定为摩西，汉语补出名字可避免代词含混；“转身离开”自然保留两个连续动作。
theological_decisions: []
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留“你的祖先和你祖先的祖先”的希伯来式递进，以呈现跨越历代、前所未有的强调；在不损害原义的地方补出“这样的灾害”和“摩西”，使汉语衔接明确。
