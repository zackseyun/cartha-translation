revisions:
- from: 它们必充满你的宫室[a]、你所有臣仆的房屋，以及全埃及人的房屋。这样的灾害，自你的祖先和你祖先的祖先在世以来，直到今日，从未见过。”于是，摩西转身离开法老。
  to: 它们必充满你的房屋、你众臣仆的房屋，以及全埃及的房屋；这是你的祖先和你祖先的祖先自从在世以来，直到今日所未曾见过的。”随后，摩西转身离开法老。
  rationale: 以“房屋”一致翻译三处重复的希伯来文复数名词，删除因“宫室”而产生的脚注。重组关系从句，使“前所未见”明确指向上文预告的蝗灾情形；保留历代祖先的重复表达、未来预告语气，以及摩西转身离开法老的连续叙事动作。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:25:39Z'
review_pass:
  verdict: revise
  source_fidelity: 正文将“你的房屋”译作“你的宫室”，虽可由受话者法老的宫廷处境引申，却比原文一般性的复数“房屋”更具体；脚注也承认此点。将其改为“房屋”可更准确保留原文的重复结构和范围。原文关系从句所指为刚预告的蝗灾／蝗虫充满房屋这一前所未有的情形；修订后以“这是……所未曾见过的”明确承接，且不增添原文未明说的“灾害”类别。
  naturalness: 原译在“这样的灾害，自……直到今日，从未见过”处语序略显断裂，且句号使其与前述蝗虫的关联变弱。修订采用分号连接，并以自然的现代汉语重组时间短语。
  terminology: “臣仆”在君王宫廷语境中可接受；“法老”和“摩西”均恰当。“全埃及的房屋”比“全埃及人的房屋”更贴近希伯来文“全埃及的房屋”，同时仍自然表达全境范围。
  issues:
  - severity: medium
    issue: “宫室”将一般性的“房屋”具体化，且现有脚注表明正文与原文词义不一致。
    rationale: בָּתֶּיךָ 是复数“你的房屋”；即使受话者是法老，原文并未指定为宫室。保持与后两次“房屋”的重复也更符合原文修辞。
  - severity: low
    issue: 脚注a为正文选择“宫室”辩护，但该选择不宜保留。
    rationale: 改为“房屋”后，脚注既无必要，也不应保留。
  - severity: low
    issue: “这样的灾害”及其后的时间状语与前句的关系可更清楚。
    rationale: 原文以关系从句描述前述现象；用“这是……所未曾见过的”可清晰而不过度界定所指。
  revised_text: 它们必充满你的房屋、你众臣仆的房屋，以及全埃及的房屋；这是你的祖先和你祖先的祖先自从在世以来，直到今日所未曾见过的。”随后，摩西转身离开法老。
