base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: zh_hans
  text: 它要遮盖地面[a]，以致人无法看见地面；又要吃掉那躲过冰雹、仍给你们留下的余剩[b]，并吃掉田野中为你们生长的一切树木。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“地的眼”，是指地上可见的表面。
    reason: lexical_alternative
  - marker: b
    text: 或译：“从冰雹中逃过、仍给你们存留的余剩之物。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: 它要遮满
  rationale: כסה意为“遮盖、遮蔽”。上下文是在预告将临的蝗灾，因此用“要”；单数“它”承接作为集合体的蝗群。“遮满”自然表达密集覆盖、以致地面不可见的情景。
- source_word: עֵין הָאָרֶץ
  choice: 地面
  rationale: 希伯来语字面为“地的眼”，是指可见地表的习语。中文译作“地面”清楚自然，并以脚注保留原文意象。
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: 使人看不见地
  rationale: 原文用无人称意味的阳性单数“不能看见”。“使人看不见地”保留结果关系和人的观看角度，又符合现代汉语。
- source_word: וְאָכַל
  choice: 又要吃尽／并吃尽
  rationale: אכל是普通的“吃”。结合灾害造成彻底毁坏的语境，以“吃尽”表达其结果；仍保留具体的取食意象，不改译为抽象的“毁灭”。
- source_word: יֶתֶר הַפְּלֵטָה הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: 冰雹过后给你们留下的残余
  rationale: 该叠加表达指从冰雹中逃过毁坏、仍为埃及人存留之物。中文用“残余”涵盖作物等非生命对象，避免把它们人格化为“幸存者”；脚注说明较贴近形式的另一译法。
- source_word: כָּל הָעֵץ
  choice: 一切树木
  rationale: עץ在此可作集合用法；“一切树木”自然表达כָּל的全称范围。
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: 田野里为你们生长的
  rationale: צמח意为“生长、萌发”；לָכֶם保留为“为你们”，表示归属或供人受益；מן在汉语中按生长地点自然译作“田野里”。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“遮满地面”既呈现蝗群覆盖的强度，也避免直译“地的眼”造成费解；句中重复“吃尽”，保留希伯来文的平行推进。
