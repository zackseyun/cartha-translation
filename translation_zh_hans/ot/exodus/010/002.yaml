revisions:
- from: 为要使你能讲给你的儿子和孙子听：我是怎样严厉对待埃及的[a]，以及我在他们中间施行的神迹；也为要使你们知道，我是耶和华[b]。
  to: 好叫你把我怎样严厉对待埃及的事[a]，以及我在他们中间所施行的神迹，讲给你的儿子和孙子听；也好叫你们知道，我是雅威。[b]
  rationale: 修订消除了开头使役结构的汉语生硬感，同时维持原文的目的关系、代际传述、埃及人作为“他们”的所指，以及末句复数“你们”。“雅威”与POB英文审计轨迹的 Yahweh 对应；脚注a保留 הִתְעַלַּלְתִּי 的羞辱含义，脚注b则准确标示末句目的／结果的可选理解。
