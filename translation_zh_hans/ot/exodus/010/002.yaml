    rationale: “使你能讲”含多余使役；希伯来文目的从句可自然译为“好叫你把……讲给……听”。
  - severity: medium
    issue: 正文“耶和华”与POB审计轨迹指定的“Yahweh”未保持名称策略一致。
    rationale: 原文是专名 יהוה；英语轨迹明确选择 Yahweh 而非传统替代形式。中文采用“雅威”可直接对应该项目名称策略。
  - severity: low
    issue: 脚注b的结果式异译锚定在神名之后，所说明的其实是整个末句的句法。
    rationale: 将标记移至末句句末，能让脚注范围与所注释的 וִידַעְתֶּם 的目的／结果歧义一致。
