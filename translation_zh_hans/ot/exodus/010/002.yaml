source:
  edition: WLC
  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: zh_hans
  text: 好叫你把我怎样严厉对待埃及的事[a]，以及我在他们中间所施行的神迹，讲给你的儿子和孙子听；也好叫你们知道，我是雅威。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我怎样使埃及受辱。”这个希伯来语动词既可强调严厉处置，也可强调使对方蒙羞。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这样你们就会知道，我是雅威。”末句也可理解为结果，而非继续表达开头的目的。
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: 为要使
  rationale: 表达与上文相连的目的或结果，保留希伯来文的目的性。
- source_word: תְּסַפֵּר בְּאָזְנֵי
  choice: 讲给……听
  rationale: 自然表达“在……耳中讲述”的希伯来语习惯用法，同时保留口耳相传的意味。
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: 你的儿子和孙子
  rationale: “孙子”是“你儿子的儿子”的自然现代汉语对应，保留代际传承重点。
- source_word: הִתְעַלַּלְתִּי בְּמִצְרַיִם
  choice: 我是怎样严厉对待埃及的
  rationale: 该动词在语境中兼有严厉处置和使对方受辱的意味；正文采用不显轻佻且符合灾祸审判语境的表达，并用脚注保留“羞辱”的词义可能。
- source_word: אֹתֹתַי
  choice: 我的神迹
  rationale: אות本义为具有指示意义的“记号”；灾祸语境中“神迹”是自然明确的汉语表达，仍强调这些行动具有标志作用。
- source_word: שַׂמְתִּי בָם
  choice: 我在他们中间施行的
  rationale: 介词后缀很可能指埃及人；“施行”较符合汉语与“神迹”的搭配，但比直译“放置”稍具解释性。
- source_word: וִידַעְתֶּם
  choice: 也为要使你们知道
  rationale: 将本句理解为继续受开头目的结构支配；复数“你们”严格反映希伯来文人称数。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不以“主”这一称号替代。
theological_decisions:
- issue: 上帝对埃及的行动 הִתְעַלַּלְתִּי 如何表达
  choice: 严厉对待埃及
  alternative: 使埃及受辱／戏弄埃及
  rationale: 语境指灾祸中的审判行动，既有严厉处置，也可能突出使埃及蒙羞。正文避免让读者误解为仅仅言语嘲弄，脚注保留受辱含义。
- issue: וִידַעְתֶּם 是目的还是结果
  choice: 也为要使你们知道
  alternative: 这样你们就会知道
  rationale: 开头 לְמַעַן 可统摄此句，支持目的解读；但该形式也可表达随之而来的结果，故在脚注注明。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 正文采用现代中文传统中广为人知的专名形式，明确它是名字而非普通称号；脚注说明原文为四字神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“讲给……听”适合家庭代际传述；“严厉对待”保留审判的力度而不显口语轻佻。以分号区分两项目的，帮助普通读者把握长句结构。
