base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/022.yaml
  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: zh_hans
  text: 于是，摩西向天空[a]伸出手，浓重的黑暗[b]就笼罩了埃及全地三天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向天”。希伯来语 שָּׁמַיִם 可按语境指“天空”或“天、诸天”。
    reason: lexical_alternative
  - marker: b
    text: 或译“幽暗”。原文把“黑暗”和另一个表示幽暗、深暗的词连用，以加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: 伸出
  rationale: נטה用于这一手势时表示伸展、伸出；“伸出手”是现代汉语中自然且贴近原文动作的表达。
- source_word: יָדוֹ
  choice: 手
  rationale: יָד通常指“手”，本处没有理由扩展为“手臂”。
- source_word: עַל הַשָּׁמַיִם
  choice: 向天空
  rationale: עַל在伸手这一动作之后可表达方向；שָּׁמַיִם在本灾的语境中译作“天空”自然，同时以脚注保留“天”的可能。
- source_word: וַיְהִי
  choice: 就……了
  rationale: 此处וַיְהִי引出随之出现的状态；用“就……了”自然表达叙事中的结果与状态开始。
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: 浓重的黑暗
  rationale: 两个表示黑暗的词连用，后一词加深、强化前一词；“浓重的黑暗”既传达强烈程度，也符合现代汉语表达。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: 笼罩了埃及全地
  rationale: 介词短语本义是在埃及全地；结合黑暗出现的图景，用“笼罩”自然表达其遍及全地，但不改变范围。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三天
  rationale: 汉语可直接以“三天”表达持续时间，无须另加介词。
theological_decisions: []
