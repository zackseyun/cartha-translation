base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: zh_hans
  text: 摩西却说：“你也必须把祭物和燔祭交到我们手中；我们要把这些献给耶和华[a]——我们的上帝。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”对应希伯来文神名יהוה（YHWH）；也常译作“雅威”，传统上亦以“主”代称。
    reason: 说明神名的原文形式及主要译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 摩西却说
  rationale: 连词推动叙事；结合上一节法老所加的限制，此处带有转折回应的意味，因此译作“却说”。
- source_word: גַּם אַתָּה
  choice: 你也必须
  rationale: גַּם具有添加和强调作用，独立代词אַתָּה也突出法老本人；“你也”自然保留这两层语气。
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: 必须把……交在我们手中
  rationale: נתן本义为“给、交付”，בידנו保留“在我们手中”的具体意象；“必须”表达摩西在语境中的坚持，而非单纯预告未来。
- source_word: זְבָחִים
  choice: 祭牲
  rationale: זבח在此指宰杀献上的祭物；“祭牲”比宽泛的“祭物”更具体，也能与“燔祭”自然并列。
- source_word: וְעֹלֹת
  choice: 和燔祭
  rationale: עֹלָה指在坛上完全焚烧的祭物，“燔祭”是准确而通行的中文宗教用语。
- source_word: וְעָשִׂינוּ
  choice: 我们好献给
  rationale: עשה字面为“做、办理”，在献祭语境中指献上或举行祭礼；“好献给”自然表达前项交付祭物与后项献祭之间的目的关系。
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: 献给耶和华我们的上帝
  rationale: 介词ל־标明献祭的对象；יהוה按其专名译作“耶和华”，אלהינו直译为“我们的上帝”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 主；雅威
  rationale: 原文直接使用四字神名יהוה。正文采用现代中文读者最熟悉的专名形式“耶和华”，并以脚注说明原文及常见替代译法，避免把专名无提示地改为称号。
- issue: וְעָשִׂינוּ与前句的逻辑关系
  choice: 我们好献给
  alternative: 我们要献给
  rationale: 希伯来文以ו连接两个分句，既可理解为顺承，也可在语境中体现目的。中文“好”呈现法老必须提供祭物的实际目的，但不额外规定献祭的具体方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“交在我们手中”保留原文具体意象；“祭牲”和“燔祭”保持礼仪术语的区别。
