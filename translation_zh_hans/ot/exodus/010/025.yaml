    text: “耶和华”对应希伯来文神名יהוה（YHWH）；也常译作“雅威”，传统上亦以“主”代称。
    reason: 说明神名的原文形式及主要译法。
  revision_rationale: 修订将“我们好献给”改为“我们要把这些献给”，避免把原文并列的未来陈述限定为目的从句；“这些”自然回指前述“祭物和燔祭”，不增添新的祭物内容。另将“交在”调整为“交到”，并以破折号清楚呈现“耶和华——我们的上帝”的同位关系。
