  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֵּצֵ֖א מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: zh_hans
  text: 于是，摩西离开法老，向耶和华恳切祈求[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向耶和华祷告”或“恳求耶和华”。原文动词含有迫切祈求的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 离开
  rationale: 该词是יצא的Qal叙事形式，表示出去、离开；结合מֵעִם，在现代汉语中译作“离开”自然地表达摩西从法老那里退去。
- source_word: מֵעִם פַּרְעֹה
  choice: 离开法老
  rationale: מֵעִם含有“从与……同在之处离开”的意思；“离开法老”简洁自然，也保留了离开法老面前的语境含义。
- source_word: וַיֶּעְתַּר
  choice: 恳切祈求
  rationale: עתר在此表示向上帝迫切恳求；“恳切祈求”同时传达祷告行为与 earnest supplication 的语气。
- source_word: אֶל
  choice: 向
  rationale: 该介词表示动作朝向某对象；“向耶和华恳切祈求”符合现代汉语习惯并保留原文方向性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行、最易识别的四字神名译法，不以“主”这一称号替代原文专名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应译为专名而非“主”。“耶和华”是普通现代中文读者最熟悉的传统音译；“雅威”更接近学界常见的拟音，但中文译名选择不应改变此处所指。
- issue: עתר是否仅译为一般祷告
  choice: 恳切祈求
  alternative: 祷告
  rationale: 原动词带有迫切恳求、代求的力度；仅译“祷告”可能弱化这一语义，故在正文中保留“恳切”的意味。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”衔接希伯来叙事链；补出主语“摩西”，依据紧接的上文明确所指，避免中文中主语含混。
