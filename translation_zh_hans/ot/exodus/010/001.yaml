source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: zh_hans
  text: 耶和华对摩西说：“到法老那里去，因为我已经使他的心和他臣仆的心刚硬[a]，为要在他那里施行我的这些神迹[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“我使他的心和他臣仆的心沉重”。这是一种习语，意指使他们的心刚硬、迟钝而不肯响应。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“在他中间／在他里面”，其中“他”为单数。这里可能特指法老，也可能指法老连同他的臣仆或宫廷。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号替代。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事形式推进事件；中文无需机械补出“然后”，直接用“说”自然承接上文。
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: 到法老那里去
  rationale: בוא 可表示“来、去、进入”；本处是命摩西前往法老处，采用自然中文方向表达。
- source_word: הִכְבַּדְתִּי
  choice: 使……的心刚硬
  rationale: 字面义为“使沉重”，用于“心”时表示使其迟钝、不响应；“使心刚硬”既符合中文惯用译法，也保留直接归因于上帝的语气。
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: 他和他臣仆的心
  rationale: לֵב 指人的内在意志与思想中心；中文以共用的“心”统摄法老及其臣仆，简洁自然。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: 语境指法老宫廷中的臣属或官员；“臣仆”兼顾 עבד 的服事、隶属含义和王廷语境。
- source_word: לְמַעַן
  choice: 为要
  rationale: 清楚表达目的关系，并保持庄重简洁的经文语体。
- source_word: שִׁתִי
  choice: 行在
  rationale: שׁית 的基本义是放置、设立；与“神迹”搭配时，中文“把……神迹行在……”更自然，同时表达神使这些记号出现于法老所在范围。
- source_word: אֹתֹתַי אֵלֶּה
  choice: 我的这些神迹
  rationale: 同时保留第一人称所属后缀和指示词；אות 在灾祸叙事中是彰显神作为的记号，中文“神迹”自然且为读者熟悉。
- source_word: בְּקִרְבּוֹ
  choice: 在他中间
  rationale: 严格保留马所拉文本第三人称阳性单数“在他中间”；其所指范围可能是法老本人，也可能包括其宫廷，交由脚注说明。
theological_decisions:
- issue: 上帝使法老的心刚硬
  choice: 我使他和他臣仆的心刚硬
  alternative: 我使他和他臣仆的心沉重／顽梗
  rationale: 原文明确由耶和华作主语，并以使役形式描述法老及臣仆之心的状态。正文不弱化这一归因，也不在翻译中解决神的主权与人的责任之间的神学张力。
- issue: בְּקִרְבּוֹ 的单数指代
  choice: 在他中间
  alternative: 在他们中间／在他境内
  rationale: 马所拉文本为单数，最直接指向法老；但语境刚提到法老的臣仆，实际范围也可能是法老及其宫廷。正文保留单数，脚注呈现歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“耶和华”作为神名；以“臣仆”体现王廷语境。正文严格保留 בְּקִרְבּוֹ 的单数形式，并借脚注说明其真实歧义。
