  rationale: 修订仅处理中文表达与原文并列结构：“施行神迹”是自然且庄重的中文搭配；“在他那里”在正文中保留单数所指而不强行裁定其范围，脚注则说明原文“在他中间／里面”的字面形式和歧义。加入“已经”对应希伯来语完成式在此所表达的既成状态，未改变神使其心刚硬的直接归因。
