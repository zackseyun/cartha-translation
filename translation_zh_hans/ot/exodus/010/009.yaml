base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: zh_hans
  text: 摩西说：“我们要带着老老少少一起去，也要带着儿女、羊群和牛群一起去，因为我们要向耶和华守节。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: 老老少少
  rationale: 原文直指“我们的年轻人和我们的老年人”，这里用现代汉语的总括表达，保留全体各年龄层都要去的意思。
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: 羊群和牛群
  rationale: צֹאן 指羊类牲畜，בָּקָר 指牛群；分别译出，准确而自然。
- source_word: חַג
  choice: 守节
  rationale: 此处指向耶和华举行宗教节庆；“守节”既体现节期性质，也符合 נֵלֵךְ 与目的语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，区别于一般称谓“主”。
- source_word: כִּי
  choice: 因为
  rationale: 保留原文明确给出的理由关系，不改写成较强的目的或义务表达。
theological_decisions:
- issue: חַג יְהוָה לָנוּ 的关系与义务色彩
  choice: 因为我们要向耶和华守节
  alternative: 因为我们必须向耶和华守节
  rationale: 原文表达“我们有一个归耶和华的节期／我们要向耶和华守节”，语境虽含义务，但没有独立对应“必须”的词；不额外强化情态。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“老老少少”简洁传达年轻人与老年人都包括在内；重复“一起去”呼应希伯来文两次 נֵלֵךְ，并使随行对象层次清楚。
