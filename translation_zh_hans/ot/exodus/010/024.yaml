  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: zh_hans
  text: 于是，法老召来摩西，说：“你们去侍奉雅威吧！只是你们的羊群和牛群要留下[a]；连你们的孩子[b]也可以和你们一起去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要留在原处”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“幼小的孩子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל־מֹשֶׁה
  choice: 法老召来摩西
  rationale: קרא אל 在此叙事语境中表示叫某人前来或召见；“召来”自然地衔接法老随后对摩西说话的场景，又不过分强化正式传召的意味。
- source_word: לְכוּ עִבְדוּ אֶת־יְהוָה
  choice: 你们去侍奉雅威吧
  rationale: עבד 直译为“侍奉”，也含敬拜之意，并保留《出埃及记》中以色列人不再服侍法老、而要侍奉雅威的主题。“雅威”按希伯来文四字神名的常见现代汉语音译处理。
- source_word: רַק
  choice: 只是
  rationale: 此词引出法老对所给许可的限制；“只是”在现代汉语中简洁自然。
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: 你们的羊群和牛群
  rationale: צֹאן 指绵羊、山羊等小型牲畜的群体，בקר 指牛类大型牲畜；“羊群和牛群”清楚且符合现代汉语表达。
- source_word: יֻצָּג
  choice: 必须留下
  rationale: 该词为 יצג 的使役被动式，在这里表示牲畜要被留在原处。“必须留下”自然表达法老所加的强制条件；脚注保留较贴近被动形式的译法。
- source_word: גַּם טַפְּכֶם
  choice: 连你们的孩子也
  rationale: גַּם 在此带强调和让步色彩，“连……也”体现法老进一步准许孩子同行。טַף 可指幼小的孩子，也可较宽泛地指家中的幼小成员或受抚养者；正文采用通顺的“孩子”，脚注保留“幼小的孩子”。
- source_word: יֵלֵךְ עִמָּכֶם
  choice: 也可以和你们一起去
  rationale: 字面为“将与你们同去”；在法老给予许可的语境中，“可以……去”自然呈现其言语功能，同时不改变同行的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”作为 Yahweh 的现代汉语音译，以神的专名呈现，而不以“主”这一称号替代。
- issue: עבד 在本节中的宗教含义
  choice: 侍奉
  alternative: 敬拜
  rationale: “侍奉”既能涵盖向神献祭、敬拜的语境，也保留本书中“服侍法老”与“侍奉雅威”之间的词汇和主题张力，避免只限定为礼仪性的敬拜。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。用“召来”“侍奉”“只是”保持叙事简洁；以“连……也可以”表达法老让步式许可。脚注标记均放在对应词语之后，并纠正咨询层中脚注标记与内容错位的问题。
