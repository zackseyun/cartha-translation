id: EXO.10.3
reference: Exodus 10:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: zh_hans
  text: 于是，摩西和亚伦到法老那里，对他说：“希伯来人的神雅威这样说：你还要拒绝在我面前谦卑自己[a]到什么时候呢？放我的百姓走，好让他们侍奉我[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“顺服我”。这里的希伯来语动词既可表示被降卑，也可表示自己谦卑下来。
    reason: lexical_alternative
  - marker: b
    text: 或译：“敬拜我”。这里的“侍奉”也包含礼仪性的事奉和敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 到……那里
  rationale: בוא 与 אֶל 加人物连用，表示来到或进入某人面前；“到法老那里”符合现代汉语叙事，也保留了进见法老的场景。
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: 对他说
  rationale: 忠实保留复数主语“摩西和亚伦”以及对法老直接说话的结构，不额外增强语气。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 这是使者宣告神谕的固定表达；“雅威这样说”自然、庄重，并保留其宣告功能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文所用的专名，而不以称号代替。
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: 希伯来人的神
  rationale: 直接表达构造关系及其族群称谓，符合当时对埃及法老讲话的语境。
- source_word: עַד מָתַי
  choice: 到什么时候呢
  rationale: 这是带责问意味的时间问句；与“还要……到什么时候”搭配，是自然的现代汉语表达。
- source_word: מֵאַנְתָּ
  choice: 还要拒绝
  rationale: 该完成式在连续多次拒绝的语境中表达延续至今的顽抗；“还要拒绝”同时呈现当前状态和责问语气。
- source_word: לֵעָנֹת
  choice: 谦卑自己
  rationale: ענה 的尼法勒形可表达被降卑、自卑或顺服；正文采用反身表达，贴合法老被要求在神面前降卑的语境，同时以脚注保留其他可能。
- source_word: מִפָּנַי
  choice: 在我面前
  rationale: 这是该介词短语在此处自然且简洁的汉语对应，表达面对神、处于神面前。
- source_word: שַׁלַּח
  choice: 放……走
  rationale: 准确表达释放、让其离去的命令，也是出埃及记反复出现之要求在汉语中的自然说法。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 直接保留第一人称所有关系，以及雅威对这群人的宣称。
- source_word: וְיַעַבְדֻנִי
  choice: 好让他们侍奉我
  rationale: עבד 可指一般服事，也可包括敬拜性的礼仪事奉；“侍奉”在汉语中保留较宽语义，脚注说明“敬拜”的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；以“主”代称
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不将其改成称号。
- issue: לֵעָנֹת 所表达的降卑或顺服
  choice: 谦卑自己
  alternative: 被降卑；顺服我
  rationale: 尼法勒形容许被动或反身理解；上下文要求法老改变在神面前的姿态，正文采用自然的反身说法，但用脚注保留其语义张力。
- issue: וְיַעַבְדֻנִי 在出埃及要求句式中的含义
  choice: 侍奉我
  alternative: 敬拜我
  rationale: עבד 包含敬拜性的事奉，却不限于礼仪行为；“侍奉”较完整地保留其服事与敬拜的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威这样说”保留神谕宣告的正式感；“还要……到什么时候呢”呈现责问语气；整体避免古奥文言，也不把“侍奉”缩窄为单纯礼仪行为。
