base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: zh_hans
  text: 蝗虫来到埃及全地，停落在埃及全境各处；这场蝗灾极其严重[a]。在这以前，从未有过这样的蝗灾；在这以后，也不会再有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“非常沉重”；这里形容这场蝗灾异常猛烈、严重。
    reason: 说明כָּבֵד מְאֹד的字面意象及其语境含义。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 遍布
  rationale: עלה本义为“上去、升上来”；在蝗虫侵入并覆盖全地的语境中，“遍布”以自然汉语表达其涌上全地的动态，并与后面的“落在”相衔接。
- source_word: הָאַרְבֶּה
  choice: 蝗虫／蝗灾
  rationale: 该词虽为单数形式，却可作集合名词。前半句用“蝗虫”指虫群，比较句用“蝗灾”指这次整体侵袭，使中文指代清楚而不额外加入原文没有的专门术语。
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: 遍布埃及全地
  rationale: 表达蝗虫来到并覆盖埃及整个国土；“全地”保留原文对范围完整性的强调。
- source_word: וַיָּנַח
  choice: 落在
  rationale: נוח在此指蝗虫停落、栖止；“落在”符合现代汉语对虫群降落的通常说法。
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: 在埃及境内各处
  rationale: גְּבוּל既可指边界，也可指边界以内的疆域。此处重在蝗虫散布于全国范围，而非只停在边境，因此译作“境内各处”。
- source_word: כָּבֵד מְאֹד
  choice: 灾情极其严重
  rationale: כָּבֵד字面是“很重”，在此形容蝗虫侵袭的强烈、严重程度。“灾情极其严重”既传达希伯来语习语的力度，也避免不自然的“蝗虫很重”。
- source_word: לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: 在这以前，从未有过这样的蝗灾
  rationale: 保留原文关于此前无可相比的绝对性陈述，并以“蝗灾”清楚指向整体事件。
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵּן
  choice: 在这以后，也不会再有
  rationale: 忠实表达未来也不再出现同类情形，与“在这以前”形成前后对应。
theological_decisions:
- issue: “从未有过、也不会再有”与其他经文中灾祸比较语句之间的张力
  choice: 按原文保留绝对而强烈的前后比较，不加限定
  alternative: 译成“埃及从未有过、以后也不会再有如此严重的蝗灾”以明确限制范围和类别
  rationale: 本节本身以“在它以前／在它以后”作全面比较；译文不应为协调其他经文而暗自削弱其修辞力度。上下文已明确对象是埃及的蝗灾。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“遍布……落在……”呈现蝗虫涌入后停落各处的连续动作；以“灾情极其严重”自然传达“非常沉重”的希伯来语习语。脚注标记[a]已置于对应表达之后。
