  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה כֵּ֣ן דִּבַּ֑רְתָּ לֹא אֹסִ֥ף ע֖וֹד רְא֥וֹת פָּנֶֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/029.yaml
  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: zh_hans
  text: 摩西说：“你说得对[a]；我不会再见你的面了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就照你所说的”或“你既这样说，就这样吧”。
    reason: 保留 כֵּן דִּבַּרְתָּ 所含的确认、赞同或接受对方所言的语气范围。
  - marker: b
    text: 希伯来语直译为“我不再加添去见你的面”，是“不再见你的面”的惯用说法。
    reason: 说明 יסף 与 עוֹד 构成的希伯来语惯用表达，并保留其字面形式供查考。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 以普通叙事用语承接上文；汉语无需机械译出连接词 וַ，语流仍然清楚。
- source_word: כֵּן דִּבַּרְתָּ
  choice: 你说得对
  rationale: 表达摩西对法老刚才所说之话的确认，现代汉语自然庄重；同时以脚注保留“就照你所说的”这一较贴近形式的可能表达。
- source_word: לֹא אֹסִף עוֹד
  choice: 我不会再
  rationale: 否定词加 יסף 的使役式及 עוֹד 构成“不再继续／不再重复”的惯用表达。“不会再”既传达未来含义，也不额外强化为绝对化措辞。
- source_word: רְאוֹת פָּנֶיךָ
  choice: 见你的面
  rationale: 保留“见面／见你的面”这一具体表达；上下文指摩西再次到法老面前，而非抽象的“同在”。
theological_decisions: []
translation_notes:
  register: 采用现代、自然而庄重的普通话。“你说得对”适合直接对话，并以脚注保存较形式对应的译法；“见你的面”保留原文具体意象。
