base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: zh_hans
  text: 于是，摩西和亚伦被带回法老面前，法老对他们说：“去吧，事奉雅威你们的神。究竟都有谁要去？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“谁和谁是那些要去的人？”这是要求明确说出具体哪些人要去的问法。
    reason: 说明希伯来语מִי וָמִי的字面形式及其惯用含义。
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: 被带回
  rationale: 该词是שׁוב的使役被动形，表示摩西和亚伦被人带回；“被带回”既保留被动含义，也符合现代汉语表达。
- source_word: אֶל־פַּרְעֹה
  choice: 到法老那里
  rationale: אֶל表示朝向某人或某处的移动；“到法老那里”自然地传达这一方向。
- source_word: לְכוּ
  choice: 去吧
  rationale: 这是הלך的复数命令式；“去吧”简洁自然，也符合此处法老准许他们离开的语气。
- source_word: עִבְדוּ
  choice: 事奉
  rationale: עבד在此指向神尽服事，包含敬拜但不限于礼仪行为；“事奉”保留了较宽的词义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文所用的专名，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 该词带第二人称阳性复数后缀，直译为“你们的神”。
- source_word: מִי וָמִי
  choice: 究竟都有谁
  rationale: 希伯来语以“谁和谁”追问具体有哪些人；“究竟都有谁”在现代汉语中自然传达要求逐一明确人员范围的意味。
- source_word: הַהֹלְכִים
  choice: 要去
  rationale: 带冠词的分词在此实词化，指将去的人；汉语疑问句“都有谁要去”已自然包含“哪些人”的意思。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名；音译“雅威”可将专名与“主”等称号区分开，并与较通行的学术重构读音相符。
- issue: עבד在对神使用时的语义范围
  choice: 事奉
  alternative: 敬拜
  rationale: “敬拜”可能把含义收窄为宗教礼仪；“事奉”较好地保留服事神这一更宽的含义。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接前文叙事；保留“被带回”的被动结构；问句用“究竟都有谁”传达原文追问具体人员的语气，并以脚注保留其特殊字面形式。
