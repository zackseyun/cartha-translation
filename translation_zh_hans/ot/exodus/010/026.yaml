  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: zh_hans
  text: 连我们的牲畜也要和我们一同去；一蹄也不留下，因为我们要从中取用来事奉雅威——我们的神。我们在到达那里以前，还不知道要用什么事奉雅威。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: 我们的牲畜
  rationale: מִקְנֶה泛指归人所有的家畜；“牲畜”既保留集合意义，也不把范围缩窄为牛群。
- source_word: יֵלֵךְ עִמָּנוּ
  choice: 要和我们一同去
  rationale: 准确表达将来的同行，并以自然的现代汉语传达摩西坚定的要求。
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: 一蹄也不留下
  rationale: 保留פַּרְסָה“蹄”的具体意象和否定句中的强调语气；“一……也不……”是自然的汉语表达。
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: 因为我们要从中取用
  rationale: 原文直译为“因为我们要从其中取”；“取用”自然表达省略的宾语，又不额外加入“所需要的”等原文没有明说的内容。
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: 来事奉雅威我们的神
  rationale: עבד用于神时可指事奉，也包含敬拜；“事奉”保留其较宽的语义，并与本节后一次出现保持一致。
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: 我们还不知道
  rationale: 表达目前尚未知晓的状态；“还”自然体现这种状态持续到抵达目的地为止。
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: 要用什么事奉雅威
  rationale: 结合献祭语境，将מַה理解为工具或材料意义的“用什么”，同时保留原文没有具体说明祭物种类的开放性。
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: 在到达那里以前
  rationale: 清楚表达在抵达目的地之前都不能确定；符合现代汉语的时间结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名的汉语音译，而不以“主”这一称号代替，保留原文使用专名的特点。
theological_decisions:
- issue: 献祭和敬拜语境中עבד的译法
  choice: 事奉雅威
  alternative: 敬拜雅威
  rationale: 上下文涉及献祭，因此“敬拜”在语境中成立；但“事奉”更能保留עבד较宽的圣约性含义，也能忠实重现本节两次用同一动词的重复。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“一蹄也不留下”保留原文鲜明而有力的意象；两次使用“事奉”维持关键词重复。神名译作“雅威”，明确保留专名而不换成称号。
