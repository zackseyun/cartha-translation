  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: zh_hans
  text: 但雅威使法老的心刚硬[a]，法老就不让以色列的子孙[b]离去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使法老的心坚定”或“使法老的心刚强”。希伯来语动词的基本意思是“使刚强、使坚定”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“以色列人”；传统译法为“以色列的儿女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: 使……的心刚硬
  rationale: חזק的基本意思是“使刚强、使坚定”；在出埃及记反复出现的法老刚硬语境中，译作“使……的心刚硬”最自然，也保留了法老内在意志变得顽固不改的叙事力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留希伯来文所用的上帝专名，而不以头衔替代。
- source_word: לֵב
  choice: 心
  rationale: “心”既保留希伯来文的身体隐喻，也可涵盖意志、决心和内在倾向，符合本节语境。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代汉语通行的埃及君王称号译法。
- source_word: שִׁלַּח
  choice: 不让……离去
  rationale: שלח本义为“差遣、送走”，但在要求释放以色列人的上下文中，“让……离去”是自然且准确的现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留希伯来文的家族性表达，同时在现代汉语中清楚指向以色列民族；脚注列出更简洁的语境等值译法。
theological_decisions:
- issue: 上帝使法老的心刚硬
  choice: 雅威使法老的心刚硬
  alternative: 雅威使法老的心坚定／刚强
  rationale: 希伯来文明确以雅威为施事者，因此正文不削弱或回避上帝的主动作用；同时不在译文中解释法老的责任或预定等问题，以保留叙事本身的神学张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“刚硬”沿用读者熟悉的出埃及记核心表达；第二分句重提“法老”，避免汉语代词指向含混。“就”体现叙事上的紧密承接，但不额外说明逻辑或神学因果。
