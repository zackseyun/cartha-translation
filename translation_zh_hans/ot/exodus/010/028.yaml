base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: zh_hans
  text: 法老对他说：“离开我！你要当心，不可再见我的面[a]；因为你见我面的那一天[b]，你必死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“不可再加添见我的面”，意思是“不可再见我的面”或“永远不可再见我的面”。
    reason: lexical_alternative
  - marker: b
    text: “我的面”也可理解为“我的临在”或“我所在之处”；原文在本节重复“面”字，以加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: 法老对他说
  rationale: 按希伯来叙事顺序直译主语、间接宾语和言说动词；上下文已清楚表明“他”指摩西，无须在本节补名。连接词 וַ 在中文连续叙事中可不另译，以免行文累赘。
- source_word: לֵךְ מֵעָלָי
  choice: 离开我
  rationale: 将命令式“去”和表示从说话者面前离开的介词短语合并为自然有力的中文逐客命令，保留法老驱逐摩西的语气。
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要当心
  rationale: שמר 的尼法勒命令式配合指向自身的 לְךָ，构成直接警告；“你要当心”既通顺，又保留威胁口吻。
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: 不可再见我的面
  rationale: יסף 加不定式在此表示“再做、继续做”；译作“不可再见”准确传达希伯来语习惯表达，同时保留“我的面”这一反复出现的意象。
- source_word: פָּנַי
  choice: 我的面
  rationale: פנים 可转指“面前、同在”，但本句两次重复该词，具有强调和呼应作用；保留“面”可呈现原文修辞。
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: 你见我面的那一天
  rationale: 保留 בְּיוֹם 的“在……之日”结构和庄重威胁感，并把带后缀的不定式结构自然转换成中文关系分句。
- source_word: תָּמוּת
  choice: 你必死
  rationale: 未完成式在威胁语境中表达确定后果；“必死”简洁有力，比单纯“会死”更能体现法老断然的口气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。直接引语使用短促命令句，呈现法老的愤怒和威胁；两次保留“我的面”，以维持希伯来原文的重复与强调。
