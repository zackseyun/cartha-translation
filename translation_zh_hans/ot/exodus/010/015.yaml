source:
  edition: WLC
  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: zh_hans
  text: 蝗群遮住了全地的表面[a]，地就变暗了。它们吃掉了地上一切植物，以及冰雹所留下的树上一切果实。在埃及全境，无论树上还是田间的植物中，凡是青绿的，一点也没有留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“全地的眼睛”，是指土地可见表面或地面的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: 蝗群遮住了
  rationale: 希伯来文动词为单数，承接上文作为集合整体的蝗群。中文明确补出语境中的主语“蝗群”，既体现集合意义，也避免单用“它”所造成的指代不清。
- source_word: עֵין כָּל הָאָרֶץ
  choice: 全地的表面
  rationale: 字面为“全地的眼睛”，是指土地可见表面的习语。“全地的表面”在现代中文中自然清楚，字面意象则保留在脚注中。
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: 地就变暗了
  rationale: 动词表示变得昏暗；“就”自然传达蝗群遮蔽地面所产生的结果，而不额外说明成因。
- source_word: וַיֹּאכַל
  choice: 它们吃掉了
  rationale: 希伯来文以单数动词描述作为集合整体的蝗群；中文用复数代词承接“蝗群”中的众多蝗虫，更合乎自然表达。“吃掉”保留该动词朴素直接的意义。
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: 地上一切植物
  rationale: עֵשֶׂב所指范围比“草”更广，可包括各种草本和田间植物；“植物”准确且易懂。
- source_word: כָּל פְּרִי הָעֵץ
  choice: 树上一切果实
  rationale: 希伯来文“树”为集合性单数，中文“树上”同样可作泛指；“果实”比单指供食用的“水果”范围更恰当。
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: 冰雹所留下的
  rationale: 忠实表达这些果实是先前冰雹之灾过后尚存之物，不将“留下”解释性强化为“饶过”。
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: 凡是青绿的，一点也没有留下
  rationale: יֶרֶק可指青绿之物或绿色植物。此译法保留其宽泛而鲜明的描述，并以“一点也没有”自然体现全面否定。
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: 无论树上还是田间的植物中
  rationale: 保留树木与田间植物两个范围；“无论……还是……”使希伯来文并列结构在中文中清楚自然。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 在埃及全境
  rationale: 简洁自然地表达灾害遍及埃及全地的地域范围。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“蝗群”承接上文的集合性主语，避免生硬模仿希伯来文单数；末句用“一点也没有留下”突出原文的彻底毁坏，同时不作超出文本的神学解释。
