source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: zh_hans
  text: 法老的臣仆对他说：“这个人要成为我们的网罗到几时呢？放那些男人走，让他们去事奉雅威他们的上帝。[a]你还不知道埃及已经毁了吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “事奉”也可译作“敬拜”；“雅威”是希伯来文神名YHWH的音译。
    reason: 说明敬神语境中עבד的语义范围，并交代神名的译法。
lexical_decisions:
- source_word: עַבְדֵי פַרְעֹה
  choice: 法老的臣仆
  rationale: “臣仆”兼顾其对法老的从属身份和宫廷臣属的语境，比单用“仆人”更自然，又不把他们明确限定为官员。
- source_word: עַד מָתַי
  choice: 到几时
  rationale: 自然而庄重地表达希伯来语的时间质问。
- source_word: זֶה
  choice: 这个人
  rationale: 指示词在上下文中指摩西；补出“人”使现代汉语表达自然，但不在正文中直接替换为其姓名。
- source_word: לְמוֹקֵשׁ
  choice: 网罗
  rationale: 保留原文的捕捉器具隐喻；也可理解为“陷阱”。
- source_word: שַׁלַּח
  choice: 放……走
  rationale: 准确传达命令法中释放、遣走之意，也符合本叙事的自然汉语表达。
- source_word: הָאֲנָשִׁים
  choice: 那些男人
  rationale: 原词明确为阳性复数“男人”，不泛化为“百姓”；“那些”体现定冠词及语境中的特指。
- source_word: וְיַעַבְדוּ
  choice: 让他们去事奉
  rationale: עבד用于上帝时兼有服事与敬拜的含义；“事奉”在中文中能较好保留二者的重叠。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现神名YHWH，而不以称号替代。
- source_word: הֲטֶרֶם תֵּדַע
  choice: 你还不知道……吗
  rationale: 以现代汉语自然表达带责问意味的反问。
- source_word: אָבְדָה מִצְרָיִם
  choice: 埃及已经毁了
  rationale: 完成式强调灾祸造成的现成结果；“毁了”表达国家已遭严重破坏，而不必理解为彻底灭绝。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 正文直接出现四字神名，音译“雅威”保留其专名性质；不以“上主”这一称号替换。
- issue: הָאֲנָשִׁים 的性别指向
  choice: 那些男人
  alternative: 那些人；百姓
  rationale: 原文使用明确的阳性复数名词，应保留这一限定，不将其无依据地扩大为全体百姓。
- issue: עבד 在敬神语境中的语义
  choice: 事奉
  alternative: 敬拜；服事
  rationale: “事奉”既可包含礼仪性的敬拜，也保留服从和服役的较宽语义，不强行消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“臣仆”“网罗”“事奉”保留适度的圣经文体色彩；句法按现代汉语调整，同时维持原文的责问力度和关键词义。
