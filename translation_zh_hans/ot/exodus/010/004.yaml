base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: zh_hans
  text: 因为你若拒绝让我的百姓走，看哪，明天我要把蝗虫[a]带进你的境内[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“蝗虫”在形式上是单数，但这里作集合名词使用，指成群的蝗虫。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你的疆界之内”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为你若
  rationale: 既保留כִּי承接并说明前文警告的语气，也以“若”清楚表达אִם的条件意义。
- source_word: מָאֵן
  choice: 拒绝
  rationale: 该动词表示出于意志的不肯，而非无能或犹豫；“拒绝”准确传达其顽抗意味。
- source_word: לְשַׁלֵּחַ
  choice: 让……走
  rationale: 在出埃及叙事中，שׁלח以百姓为宾语时，意为准许他们离开；“让……走”自然且贴合语境。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 保留第一人称所属关系及其约民意味；“百姓”在此庄重而自然。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 该词突出随即而来的郑重宣告；“看哪”保留警告的强调语气，而紧迫性又由“明天”和后续行动表达。
- source_word: מֵבִיא
  choice: 我要把……带进
  rationale: 分词与הִנְנִי连用，表达即将发生的行动；“我要”配合“明天”自然呈现近期将来，“带进”也与地点短语相配。
- source_word: מָחָר
  choice: 明天
  rationale: 直接表达灾祸发生的时间。
- source_word: אַרְבֶּה
  choice: 蝗虫
  rationale: 原词形式为单数，却可作集合名词，指成群侵入的蝗虫；汉语“蝗虫”在此也可自然作集合性表达。
- source_word: בִּגְבֻלֶךָ
  choice: 你的境内
  rationale: גְּבוּל可指边界所涵盖的疆域；“境内”既保留疆界概念，也自然表达蝗虫将进入法老辖地。
