  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: zh_hans
  text: 法老对他们说：“要是我真把你们和你们的孩子放走，愿耶和华与你们同在！你们看吧[b]，因为恶就在你们面前。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可译作：“我把你们和你们的孩子放走时，愿耶和华与你们同在。”法老很可能是在讥讽他们。
    reason: alternative_reading
  - marker: b
    text: 希伯来文含义不确定：这句话可以指“灾祸就在你们前面”，也可以指“你们心里打着坏主意”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: 愿耶和华与你们同在
  rationale: 保留祈愿式 יְהִי 的语气；反讽意味由法老敌意鲜明的上下文以及后接的条件句体现，不在正文中额外解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的圣经专名“耶和华”来指称神圣四字名。
- source_word: כַּאֲשֶׁר אֲשַׁלַּח
  choice: 要是我真……放走
  rationale: כַּאֲשֶׁר 本可作“当……时／照着”，但此处在敌对、讥讽的话语中带有条件意味；“要是……真”既自然，也传达法老不肯放人的口气。
- source_word: אֶתְכֶם וְאֶת טַפְּכֶם
  choice: 你们和你们的孩子
  rationale: טַף 指幼小儿女；中文“孩子”自然清楚，比“家眷”更准确，也不把范围扩大到所有家属。
- source_word: רְאוּ
  choice: 你们看清楚
  rationale: 保留 ראה“看”的基本意象，同时在汉语中表达警告、提醒的语用力量；其具体所指仍可有不同理解。
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: 因为恶就在你们面前
  rationale: 尽量贴近“恶／灾祸在你们面前”的简短原文，不在正文中判定是前方有灾祸，还是他们心怀恶意。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经语境中最广为普通读者识别的专名；不用“主”替代，以保留原文专名的性质。
- issue: 法老话语的反讽性质
  choice: 正文保留表面的祝愿句式，让反讽由上下文显出
  alternative: 直接译成带解释性的讥讽话，如“除非我放你们走，否则耶和华才会与你们同在”
  rationale: 原文形式仍是祈愿表达；直加解释会过早消除其修辞张力。
- issue: 末句 רָעָה 的指向
  choice: 恶就在你们面前
  alternative: 灾祸正等着你们／你们心怀恶意
  rationale: 原文既可能是法老威胁说灾祸临近，也可能是指控他们图谋不轨；正文保留这种张力，脚注说明主要理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“要是我真……”传达敌意语境中的讥讽条件意味；“看清楚”兼顾视觉词义和警告语气。正文保留末句的希伯来语歧义，并以脚注列出主要理解。
