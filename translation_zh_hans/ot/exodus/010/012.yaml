source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֨ה יָדְ/ךָ֜ עַל אֶ֤רֶץ מִצְרַ֨יִם֙ בָּֽ/אַרְבֶּ֔ה וְ/יַ֖עַל עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יֹאכַל֙ אֶת כָּל עֵ֣שֶׂב הָ/אָ֔רֶץ אֵ֛ת כָּל אֲשֶׁ֥ר הִשְׁאִ֖יר הַ/בָּרָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你向埃及地伸出手，为要使蝗虫[a][b]上到埃及地，吃尽地上一切植物，就是冰雹所留下的一切。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为要使蝗虫”所对应的原文，字面近于“为了／关于蝗虫”；这里介词的用法难以确定，也可理解为“针对蝗虫”或“在蝗虫之上”。
    reason: 保留 בָּאַרְבֶּה 中介词 בְּ 的词义和句法歧义。
  - marker: b
    text: 原文“蝗虫”是单数形式，相关动词也是单数；但这里用作集合名词，指成群的蝗虫。
    reason: 说明希伯来语集合名词的数，并避免读者误以为只指一只蝗虫。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留四字神名，避免用称号代替原文中的专名。
- source_word: נְטֵה יָדְךָ
  choice: 伸手
  rationale: 准确表达动词 נטה“伸出、展开”与 יָד“手”；“伸手”在现代汉语中自然，也符合灾祸记叙中的动作。
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: 向埃及地
  rationale: 在“伸手”的语境中，עַל 表示动作所朝向或施及的范围；译作“向”比机械地译成“在……上方”更符合汉语，同时保留“埃及地”。后一句同一短语按空间结果译作“上到埃及地”。
- source_word: בָּאַרְבֶּה
  choice: 叫蝗虫
  rationale: 介词 בְּ 在此用法较难确定；结合后面的目的/结果动词，“叫蝗虫上到……”自然表达动作与蝗灾的关系，但以脚注保留“为着、针对、关于蝗虫”等可能。
- source_word: אַרְבֶּה
  choice: 蝗虫
  rationale: 原文为单数形式，却作集合名词，指成群的蝗虫；汉语“蝗虫”本身可作集合性通称，无须强加单复数。
- source_word: וְיַעַל
  choice: 上到
  rationale: 保留 עלה“上去、上来”的基本空间意象；“叫……上到”也表达此处承接命令的目的或结果。
- source_word: וְיֹאכַל
  choice: 吃尽
  rationale: אכל 基本义为“吃”；在蝗灾语境中加结果补语“尽”，自然传达蝗虫将植被全部吃掉，而不改用解释性更强的“毁灭”。
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: 地上一切植物
  rationale: עֵשֶׂב 在此泛指草木和植被，不宜局限为“草”或“菜蔬”；“植物”是清楚自然的现代汉语。
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: 就是冰雹所剩下的一切
  rationale: 保留同位说明关系，并以“剩下”表达 הִשְׁאִיר“留下、使剩余”，衔接此前的冰雹之灾。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非称号；“雅威”较直接地音译该名，也不把它替换为“主”。
- issue: 蝗虫与摩西伸手之间的关系
  choice: 正文译作“叫蝗虫……上到”，脚注保留介词歧义
  alternative: 为着蝗虫；针对蝗虫；在蝗虫之上
  rationale: 上下文显示伸手与蝗灾来临有关，但介词 בְּ 的确切功能不够明确；正文采取自然且语境相称的表达，不把某一种语法分析说成唯一可能。
translation_notes:
  register: 采用庄重而明白的现代标准普通话。“吃尽”比“吞噬”更贴近 אכל 的基本义，也能自然呈现蝗灾的彻底性；全句保留原文两次出现的“埃及地”以及末尾对冰雹余留之物的强调。
