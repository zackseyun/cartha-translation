  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: zh_hans
  text: 但耶和华使法老的心刚硬[a]，法老不肯放他们走[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使法老的心坚定（强硬）。”希伯来语动词可指“使强壮”或“使坚定”；与“心”连用时，本处表达“使心刚硬”的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“法老拒绝放他们走。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: 使……刚硬
  rationale: חזק的基本义是“使强壮、使坚定”；在出埃及记反复出现的“心”之刚硬表达中，指使意志变得坚定而不肯改变。译作“使……刚硬”既符合现代汉语圣经语体，也保留上下文中的惯用含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号替代。
- source_word: לֵב
  choice: 心
  rationale: 希伯来语לֵב在此涵盖人的意志和内在倾向；“心”保留原文意象，在现代汉语中也清楚自然。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用该埃及君王称号在现代标准汉语中的通行译名。
- source_word: לֹא אָבָה
  choice: 不肯
  rationale: אָבָה表示愿意、同意；否定形式直指意愿上的不从。“不肯”自然简洁，并比单纯的“不愿意”更贴合语境。
- source_word: לְשַׁלְּחָם
  choice: 放他们走
  rationale: שׁלח在出埃及叙事中指准许以色列人离开；“放他们走”准确保留全书反复出现的叙事用语。
theological_decisions:
- issue: 上帝使心刚硬与法老自身意愿之间的张力
  choice: 并列陈述“耶和华使法老的心刚硬”与“法老不肯放他们走”
  alternative: 译成因果关系，如“耶和华使法老的心刚硬，所以他拒绝放他们走”
  rationale: 原文以וְ连接两句，明确把刚硬归于耶和华，同时又陈述法老本人的不肯。译文不加入“所以”，从而不消解神的作为与人的意志之间的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“但”承接前文转折；第二分句重复“法老”，避免汉语代词可能误指耶和华。所有脚注标记均置于正文相应词句之后。
