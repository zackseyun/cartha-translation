base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: zh_hans
  text: 所以现在，请这一次饶恕我的罪[a]；并恳求耶和华——你们的上帝——使他只把这死亡从我身上除去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饶恕”所译的希伯来语惯用表达，字面意思是“举起、担当或除去我的罪”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“只把这死亡从我身上除去”。法老可能指眼前致命的灾害及其后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 既保留连接词与时间副词，也自然引出法老此刻迫切的请求。
- source_word: שָׂא נָא חַטָּאתִי
  choice: 请……饶恕我的罪
  rationale: נשא以“罪”为宾语时，是“担当、除去”从而“饶恕”的希伯来语惯用表达；“请”体现נָא的恳求语气。
- source_word: אַךְ הַפַּעַם
  choice: 只……这一次
  rationale: 保留限制语气，表明法老请求仅在这一次获得饶恕。
- source_word: וְהַעְתִּירוּ
  choice: 并恳求
  rationale: 该动词的使役式在此指向上帝迫切祈求；复数形式与摩西、亚伦这两个受话者相合。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: 耶和华你们的上帝
  rationale: 以“耶和华”呈现神名，并保留法老所说“你们的上帝”这一具有距离感的措辞。
- source_word: וְיָסֵר מֵעָלַי
  choice: 使他除掉临到我的
  rationale: 把后续未完成式理解为请求代求所期望的结果；מֵעָלַי含有从压在或临到说话者身上的事物中解脱之意。
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: 这死亡
  rationale: 保留原文直称“这死亡”的突兀表达，不在正文中将其明确解释成蝗灾或灾祸；限制词רַק的语义已与前文“只……这一次”共同传达，并在脚注说明其修饰关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文使用现代中文读者最熟悉且具有专名功能的“耶和华”；不以“主”替代原文神名。
- issue: “这死亡”的所指
  choice: 保留“这死亡”
  alternative: 这致命的灾祸／这场蝗灾
  rationale: 原文没有直接说“灾祸”或“蝗灾”；保留措辞可避免把语境推断写进正文，也维持其神学与修辞张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“恳求”体现迫切代求，“你们的上帝”保留法老与耶和华之间的距离。正文保留“这死亡”这一非日常表达，并用脚注说明其字面形式和可能所指。
