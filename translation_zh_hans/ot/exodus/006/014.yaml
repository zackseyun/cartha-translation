  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: zh_hans
  text: 以下是他们父家的首领：以色列的长子吕便的儿子是哈诺、法路、希斯仑和迦米；这些是吕便的宗族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי בֵית אֲבֹתָם
  choice: 他们各父家的首领
  rationale: “父家”保留希伯来谱系与亲族组织的正式用语；“首领”自然表达各父系家族单位的领导者，并保留 רָאשֵׁי 的含义。
- source_word: בְּנֵי רְאוּבֵן
  choice: 吕便的儿子
  rationale: 此处随后列出吕便的直接儿子，因此采用“儿子”，不扩大为较宽泛的“后代”。
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: 以色列长子
  rationale: 作为“吕便”的同位说明，简洁保留其作为以色列长子的身份。
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: 哈诺、法路、希斯仑和迦米
  rationale: 采用现代中文圣经读者较易识别、且符合希伯来人名音译传统的形式。
- source_word: מִשְׁפְּחֹת
  choice: 宗族
  rationale: 在支派谱系语境中，该词指支派内部由血缘构成的群体；“宗族”比现代汉语的“家庭”范围更准确。
