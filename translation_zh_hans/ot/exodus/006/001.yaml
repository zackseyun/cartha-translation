  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“现在你会看见我要对法老做什么；因为在强有力的手下，他必放他们走；在强有力的手下，他必把他们从他的国土赶出去。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在强有力的手下”也可按意思译为“迫于强力”。这个重复的短语可能表示法老因压倒性的力量——最终是神的大能——而放走并赶出以色列人。
    reason: 说明希伯来语习语可作的意译，并保留原文未明说施力者、但语境指向神之力量的含义张力。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的现代汉语音译，不以“主”等称号代替专名。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来语叙事形式推进事件；现代汉语借上下文和语序即可自然表达承接关系，无须机械加入“然后”。
- source_word: עַתָּה תִרְאֶה
  choice: 现在你将看见
  rationale: 保留“现在”的时间与强调意味，并按未完成式在语境中的将来意义译出即将发生的事。
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: 我要对法老做什么
  rationale: 贴近关系从句及介词的宽泛关系，不在正文中提前解释为“怎样对付法老”。
- source_word: בְיָד חֲזָקָה
  choice: 在大能之手下
  rationale: 保留两次重复及“手”的希伯来语意象，同时不明说这力量属于谁；这一表达也可传达法老受到强力迫使。
- source_word: יְשַׁלְּחֵם
  choice: 他必放他们走
  rationale: 在出埃及语境中，שלח指法老准许并释放以色列人离去。
- source_word: יְגָרְשֵׁם
  choice: 他必把他们……赶出去
  rationale: גרש比单纯“送走”更强，表达强行驱逐，与前句形成递进。
- source_word: מֵאַרְצוֹ
  choice: 从自己的国土
  rationale: “国土”在此兼顾土地和法老所统治之国的含义；“自己的”清楚指回法老。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文保留神的专名，以现代汉语音译“雅威”呈现，不用称号取代，也不采用源于较晚混合读法的传统音译。
- issue: “大能之手”所指的力量及其与法老行动的关系
  choice: 保留“在大能之手下”的意象和重复，不在正文明确力量的归属
  alternative: 他迫于强力而放他们走；因我的大能之手，他必放他们走
  rationale: 原文两次将该短语与法老的行动相连，却未明说“手”的所有者；语境强烈暗示神的大能迫使法老行动。保留这种张力，避免把暗示改写成明说。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“放他们走”通俗明确，“赶出去”保留第二个动词更强的力度；分号呈现两个平行且递进的分句。
