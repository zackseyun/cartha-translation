base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: zh_hans
  text: 他们就是向埃及王法老说话[a]，要把以色列人[b]从埃及领出来的摩西和亚伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “说话”原文为分词；也可译作“正在向……说话”或“向……说话的人”，在这里用来描述他们。
    reason: lexical_alternative
  - marker: b
    text: “以色列人”原文直译为“以色列的众子”，是指以色列的后裔。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: 他们就是……的人
  rationale: 独立代词在此承接并强调前文所提到的人；采用“他们就是……的人”既保留强调识别的作用，也符合现代汉语表达。
- source_word: הַמְדַבְּרִים
  choice: 向……说话
  rationale: 带冠词的分词作名词性成分，刻画摩西和亚伦是向法老说话的人；汉语以关系结构自然表达，未强行限定为一次性的过去动作。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老
  rationale: 自然呈现同位称号，并保留“法老”与“埃及王”两项信息。
- source_word: לְהוֹצִיא
  choice: 要把……领出来
  rationale: יצא 的使役式表示使人出去；“领出来”在此自然传达摩西和亚伦奉命促成以色列人离开埃及，而不将他们说成最终施行拯救者。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子民
  rationale: 该短语字面为“以色列的众子”；现代汉语“以色列众子民”既保留族群后裔意味，也避免“儿子们”被误解为雅各的亲生儿子。
- source_word: מִמִּצְרָיִם
  choice: 从埃及
  rationale: 与“领出来”搭配，清楚表达离开埃及的方向。
- source_word: הוּא
  choice: 这二人就是
  rationale: 原文在复合主语“摩西和亚伦”前使用单数代词，具有总结性识别作用；汉语用“这二人就是”避免不合语法的单复数冲突，同时明确所指。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: 摩西和亚伦
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: לְהוֹצִיא 所表达的行动主体与因果关系
  choice: 要把……领出来
  alternative: 为把……带出
  rationale: 保留使役动词的行动目标，却不额外说明摩西、亚伦与上帝在出埃及事件中的因果分工，避免加入经文本句未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句首保留原文强调性的身份确认，句末用“这二人就是”再作总结识别，以反映希伯来文的重复结构；分号帮助读者看清两部分。所有脚注标记均置于正文相应句末。
