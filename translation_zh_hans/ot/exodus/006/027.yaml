  rationale: 修订以“以色列人”替换不自然的“以色列众子民”，并在脚注保留原文的字面信息。将原文首尾的身份确认合并为现代汉语自然的定语结构，仍清楚表明所指的正是摩西和亚伦。脚注a避免把分词不必要地解释为“不断”的频率含义。
