  text: וַ/יְדַבֵּ֥ר אֱלֹהִ֖ים אֶל מֹשֶׁ֑ה וַ/יֹּ֥אמֶר אֵלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: zh_hans
  text: 上帝对摩西说：“我是雅威[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH，即四字神名；传统上也译作“耶和华”。
    reason: 说明原文神名形式，并交代中文传统译名。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事动词引出上帝的发言；现代汉语用“说”自然、庄重。希伯来文随后又用 וַיֹּאמֶר，汉语若机械重复“说……又说道”会显得累赘，因此合并为一个引语公式。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本处虽为复数形态，却与单数动词搭配，指以色列的上帝；“上帝”是现代汉语中清楚而通行的对应词。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象；“对摩西说”符合现代汉语表达。人名 מֹשֶׁה 按通行译名译作“摩西”。
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 说
  rationale: 原文直译为“又对他说”，与前面的“对摩西讲话”共同构成希伯来叙事常见的双重引语公式。为使中文自然，将两者合并为“对摩西说”，没有删去任何独立命题内容。
- source_word: אֲנִי
  choice: 我是
  rationale: 希伯来语名词句省略现在时系词；中文补出“是”，准确表达带强调意味的自我认定。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH。中文采用历史悠久、读者熟悉的专名形式“耶和华”，并以脚注说明其希伯来文形式及另一常见音译。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名，而非“主”这一称号，因此正文保留专名。“耶和华”是现代中文圣经传统中辨识度最高的形式；“雅威”较接近学界常用的拟音，列于脚注以呈现译名差异，而不对古代确切读音作过度断定。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。原文两个连续的说话动词构成希伯来叙事公式，中文合并为“对摩西说”，避免生硬重复；神名保留为专名，并用脚注交代音译问题。
