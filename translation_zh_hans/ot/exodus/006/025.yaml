base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: zh_hans
  text: 亚伦的儿子以利亚撒从普铁的女儿中娶妻[a]；她给他生了非尼哈。这些人是利未人各宗族的父家首领[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从普铁的女儿们中为自己娶作妻子”，可理解为娶了普铁的一个女儿，但没有说明具体是哪一位；也可泛指娶了普铁家族中的女子。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“父家的首领”，这是亲族结构用语，指利未各宗族中祖系家族单位的首领。
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: 娶妻
  rationale: 这是希伯来语婚姻用语，字面为“为自己取……作妻子”。现代汉语用“娶妻”自然、庄重，并保留婚姻含义。
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: 从普铁的女儿中
  rationale: 介词 מִן 表示来源或群体范围；此译法保留复数“女儿”及从其中娶妻的表达，不擅自补定具体是哪一位。
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: 她给他生了非尼哈
  rationale: 动词为阴性单数，主语是以利亚撒的妻子；“给他生了”也表达了原文的间接受词 לוֹ。
- source_word: רָאשֵׁי אֲבוֹת
  choice: 父家首领
  rationale: 这是宗族谱系中的社会结构用语，指各祖系家族单位的首领，不只是若干生父。
- source_word: הַלְוִיִּם לְמִשְׁפְּחֹתָם
  choice: 利未人各宗族
  rationale: מִשְׁפָּחָה 在族谱语境中指宗族或氏族群体；“各宗族”简明地表达按宗族划分的关系。
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: 以利亚撒／亚伦／普铁／非尼哈
  rationale: 采用现代简体中文圣经读者熟悉的人名音译。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“从普铁的女儿中娶妻”略带族谱文体色彩，以保留原文的群体来源表达；分号用于清楚连接婚姻与生子两项族谱信息。脚注[b]置于其实际解释的“父家首领”之后。
