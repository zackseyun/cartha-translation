base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: zh_hans
  text: 我曾以“全能的上帝”[a]向亚伯拉罕、以撒和雅各显现；但我的名“雅威”，我未曾为他们所认识。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“伊勒·沙代”（El Shaddai），传统译作“全能的上帝”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“我没有以我的名‘雅威’使他们认识我。”希伯来文未必表示族长完全不知道这个神名，也可能表示他们尚未充分认识这个名字在盟约中的意义。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: 我曾……显现
  rationale: 这是ראה的尼法勒式第一人称单数；“显现”直接体现族长叙事中神显现的用语，不扩展为解释性较强的“启示自己”。
- source_word: אֶל ... אֶל ... וְאֶל
  choice: 向亚伯拉罕、以撒和雅各
  rationale: 希伯来文在三个人名前重复介词；现代汉语不必机械重复“向”，用并列结构即可自然表达同样的指向范围。
- source_word: בְּאֵל שַׁדָּי
  choice: 以“全能的上帝”
  rationale: 介词ב在此表达显现所用的身份或名号。“全能的上帝”是אֵל שַׁדָּי的传统且通顺的意译；引号标明其名号性质。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对四字神名的现代汉语音译，保留其作为神专名的性质，而不以“主”这一头衔替代。
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: 并未为他们所认识
  rationale: 保留ידע尼法勒式的被动或状态性表达，不在正文中断定这是完全不知道该名字，还是尚未经历并认识此名所彰显的意义。
theological_decisions:
- issue: 族长是否知道神名“雅威”
  choice: 保留“并未为他们所认识”的形式表达
  alternative: “我没有以我的名‘雅威’使他们认识我”或“他们尚未充分认识‘雅威’之名的盟约意义”
  rationale: 这句话可被理解为不知道神名本身，也可指尚未从神履行应许的行动中充分认识此名的意义。鉴于《创世记》的族长语境中出现过这一神名，正文不应暗中消除这种张力，脚注则说明另一种可能。
translation_notes:
  register: 采用庄重而现代的标准普通话。“并未为他们所认识”略具正式色彩，目的是贴近原文并保留其神学张力；其余句法保持清楚易读。
