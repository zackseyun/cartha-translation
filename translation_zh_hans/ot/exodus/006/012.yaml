  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: zh_hans
  text: 但摩西在雅威面前说：“看哪，以色列人尚且不听我的话，法老又怎会听我呢？况且我是嘴唇未受割礼的人。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嘴唇未受割礼”是希伯来语的形象说法，表示说话受到妨碍或不善言辞；参出埃及记4:10。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 但摩西……说
  rationale: 叙事性的 waw 在此承接上文，并引出摩西对上帝命令的异议；“但”自然表达语境中的转折。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留 לִפְנֵי 的空间—关系性表达，并将神名 יְהוָה 音译为“雅威”。
- source_word: הֵן
  choice: 看哪
  rationale: 该提示语用于唤起注意；“看哪”庄重且能保留原文的话语力度。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处指以色列群体；现代汉语以“以色列人”表达自然，也不误导为仅指男性后裔。
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: 不听我的话
  rationale: שׁמע 与 אֶל 连用表示听从、理会；“不听我的话”兼顾听闻与听从的语义，不强化为单纯的“违抗”。
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: 法老又怎会听我呢
  rationale: “又怎会”自然呈现由前句推出的反问，并与前面的 שׁמע 保持词义呼应。
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: 况且我是嘴唇未受割礼的人
  rationale: “况且”表达此分句为摩西进一步提出的理由；正文保留“嘴唇未受割礼”这一刻意鲜明的希伯来隐喻，不把它直接化约为某种具体言语障碍。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见音译保留其作为专名的性质，而不以称号替代。
- issue: עֲרַל שְׂפָתָיִם 的含义
  choice: 嘴唇未受割礼
  alternative: 不善言辞／口齿不灵
  rationale: 原文隐喻可指言语受阻、不适任或欠缺表达能力，具体所指并未完全界定；保留隐喻可避免把摩西的话解释成确定的生理诊断。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留经文的郑重提示语；“嘴唇未受割礼”保留原文隐喻，并以脚注帮助普通读者理解。
