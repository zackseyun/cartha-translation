  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“我是雅威。你要把我对你所说的一切[a]都告诉埃及王法老。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我正在对你说的一切”。
    reason: 希伯来语 דֹּבֵר 是分词，既可作一般性的“说”，也可强调正在进行的“正在说”。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对……说
  rationale: 该动词配合叙事性的连接形式，承接上文；现代汉语无需另加“然后”也能自然表达叙事推进。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名的性质，不以“主”这一称号替代。
- source_word: לֵאמֹר
  choice: 说
  rationale: 此不定式用于引出直接引语；汉语以“说”自然衔接，毋须重复译成“说着说”。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 希伯来语无系词句在汉语中自然补出“是”，并保留郑重的自我宣告。
- source_word: דַּבֵּר
  choice: 你要……说
  rationale: 用“你要”表达命令语气，并以“说”保留本节 דבר 词根的重复。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老
  rationale: 按自然汉语语序表达同位关系，同时保留法老的王者身份。
- source_word: אֵת כָּל אֲשֶׁר
  choice: 一切
  rationale: 概括所传达内容的全部范围，简洁而完整。
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: 我对你说的
  rationale: 将分词译作一般现在含义，既可涵盖当前及持续的神谕，也与前后的“说”形成原文所具有的词语呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近通常学术重构读音 Yahweh 的“雅威”，以专名而非称号呈现；“耶和华”是汉语传统中广为人知的另一音译。
- issue: 分词 דֹּבֵר 的时态意味
  choice: 我对你说的
  alternative: 我正在对你说的
  rationale: 希伯来语分词可突出正在进行的言说，也可在此语境中概括雅威向摩西所说的内容。正文保留较宽泛的现在时理解，脚注列出进行体译法，避免排除原文的动态意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“你要……说”表达命令，并尽量保留原文三次使用 דבר（说）的呼应；脚注标记置于其实际说明的末句之后。
