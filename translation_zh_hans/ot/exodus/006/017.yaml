  text: 革顺的儿子是立尼和示每，按他们的宗族[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“按他们的家族。”这里的希伯来语可指支派之下的亲族群体或宗族。
    reason: 说明 מִשְׁפָּחָה 的词义范围，并保留“家族”这一可行译法。
lexical_decisions:
- source_word: בְּנֵי
  choice: 儿子
  rationale: 这是בֵּן的复数附属形，用来引出家谱名单；此处指革顺直接列名的儿子，译作“儿子”准确自然。
- source_word: גֵרְשׁוֹן
  choice: 革顺
  rationale: 人名采用现代中文圣经读者熟悉的传统音译。
- source_word: לִבְנִי
  choice: 立尼
  rationale: 人名采用现代中文圣经读者熟悉的传统音译。
- source_word: וְשִׁמְעִי
  choice: 和示每
  rationale: וְ表示并列，译为“和”；人名采用现代中文圣经读者熟悉的传统音译“示每”。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 按着他们的宗族
  rationale: מִשְׁפָּחָה在支派和家谱语境中通常指支派之下的亲族群体；“宗族”比现代汉语中的“家庭”更能表达这一层级，同时保留介词לְ所表示的分类方式。
