base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: zh_hans
  text: 亚伦娶了以利沙巴为妻；她是亚米拿达的女儿、拿顺的姐妹。她给亚伦生了拿答、亚比户、以利亚撒和以他玛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לקח字面为“取、带走”，在“以她为妻”的婚姻语境中自然表示“娶”；中文译作“娶了”既明确婚姻含义，也避免生硬直译。
- source_word: אֱלִישֶׁבַע
  choice: 以利沙巴
  rationale: 按希伯来语人名音译，并采用现代中文圣经读者较熟悉的形式。
- source_word: בַּת עַמִּינָדָב
  choice: 亚米拿达的女儿
  rationale: 准确表达名词附属结构所指的直接父女关系。
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: 拿顺的妹妹
  rationale: אחות本义为“姐妹”；此处按中文家谱表达习惯采用传统且自然的“妹妹”。原文自身不明说长幼关系，因此这一译法带有中文传统称谓的具体化。
- source_word: לוֹ לְאִשָּׁה
  choice: 为妻
  rationale: 这是常见的希伯来语婚姻表达；与“娶了”合用，形成自然而庄重的现代汉语。
- source_word: וַתֵּלֶד לוֹ
  choice: 她给他生了
  rationale: 保留לוֹ所表达的间接对象关系，同时符合现代汉语叙述习惯。
- source_word: נָדָב
  choice: 拿答
  rationale: 采用通行的中文圣经人名音译。
- source_word: אֲבִיהוּא
  choice: 亚比户
  rationale: 采用通行的中文圣经人名音译。
- source_word: אֶלְעָזָר
  choice: 以利亚撒
  rationale: 采用通行的中文圣经人名音译。
- source_word: אִיתָמָר
  choice: 以他玛
  rationale: 采用通行的中文圣经人名音译。
