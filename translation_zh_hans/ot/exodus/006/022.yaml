  text: 乌西业的儿子是米沙业、埃勒察番和西特利。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: ……的儿子是
  rationale: בְנֵי是“……的儿子们”这一谱系惯用语；汉语列举多人时，用单数形式的集合表达“儿子”更自然。句首连接词ו承接上文，但在现代汉语谱系清单中不必机械译成“和”。
- source_word: עֻזִּיאֵל
  choice: 乌西业
  rationale: 按希伯来语人名ʿUzzîʾēl音译，并采用较自然的现代汉语音节。
- source_word: מִישָׁאֵל
  choice: 米沙业
  rationale: 按希伯来语人名Mîšāʾēl音译，保留词尾神名成分ʾēl的大致读音。
- source_word: וְ/אֶלְצָפָן
  choice: 埃勒察番
  rationale: 按马所拉文本所标元音的ʾElṣāfān音译；前缀ו在汉语列举中通过标点和末项前的“和”自然表达。
- source_word: וְ/סִתְרִי
  choice: 和西特利
  rationale: 按希伯来语Sitrî音译；ו译为“和”，清楚标明名单最后一项。
