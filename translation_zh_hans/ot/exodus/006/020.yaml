base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: zh_hans
  text: 暗兰娶了他的姑姨[a]约基别为妻；她给他生了亚伦和摩西。暗兰一生共有一百三十七年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为女性亲属称谓，可译为“姑母”或“姨母”等；按这里的家谱关系，通常理解为他父亲的姐妹。
    reason: 说明原文亲属词的词义范围，同时交代根据上下文所作的通常具体理解，而不将该理解强加为正文唯一含义。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לקח本义为“取”，在婚姻语境中与לְאִשָּׁה连用，现代汉语自然译为“娶……为妻”。
- source_word: דֹּדָתוֹ
  choice: 他的姑母
  rationale: 该阴性亲属称谓指姑姨辈女性亲属；在此家谱关系中指父亲的姐妹，故译“姑母”，同时以脚注说明词语本身可作较宽泛理解。
- source_word: לְאִשָּׁה
  choice: 为妻
  rationale: 明确表示婚姻关系，与“娶了”搭配，既自然又保留原文结构。
- source_word: וַתֵּלֶד לוֹ
  choice: 她给他生了
  rationale: 保留לוֹ所表达的间接对象，又符合现代汉语家谱叙述习惯。
- source_word: שְׁנֵי חַיֵּי עַמְרָם
  choice: 暗兰一生的岁数
  rationale: 对应原文“暗兰生命的年数”，用庄重而通顺的现代汉语陈述寿数。
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 一百三十七岁
  rationale: 准确传达原文数值，并采用现代汉语通常的数字次序。
- source_word: עַמְרָם / יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה
  choice: 暗兰／约基别／亚伦／摩西
  rationale: 采用简体中文圣经读者熟悉的传统人名译法。
theological_decisions:
- issue: 近亲婚姻关系的表达
  choice: 他的姑母
  alternative: 他的姑姨／他的女性亲属
  rationale: 经文只陈述家谱事实，并未在本节作道德评判；“姑母”准确呈现此处关系，不淡化也不强化经文与后来律法规定之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的家谱叙述语体。“娶……为妻”保留希伯来语婚姻表达的形式感；寿数用中文全写数字，以适合正文朗读。
