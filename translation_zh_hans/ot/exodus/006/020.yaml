  verdict: revise
  source_fidelity: “娶……为妻”“给他生了”“亚伦和摩西”及一百三十七岁的寿数均忠实于希伯来文。惟“姑母”在现代汉语中专指父亲的姐妹，而דֹּדָתוֹ本身是较宽的女性亲属称谓；本节单独并未明说“父亲的姐妹”。宜在正文保留其亲属称谓的余地，并用脚注交代通常的具体理解。
  naturalness: 原文整体庄重通顺。“暗兰一生的岁数是一百三十七岁”虽可理解，但“岁数”与“一生”搭配略显重复、较陈旧；“暗兰一生共有一百三十七年”更自然且保持家谱语体。“姑姨”略带书面色彩，却是在不擅自限定父系或母系时简洁、可懂的表达。
  terminology: 人名“暗兰、约基别、亚伦、摩西”均合乎通行中文圣经译名。“姑母”应改为涵盖父系或母系姨辈女性亲属的“姑姨”，并将说明性脚注锚定该词，而非人名。
