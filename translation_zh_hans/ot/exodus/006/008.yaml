  source_fidelity: 译文准确传达希伯来文的两重应许：领以色列人进入那地，并将那地赐给他们作为持久的产业。“举手起誓”恰当地表达נָשָׂאתִי אֶת־יָדִי这一举手立誓的惯用语，既不失其具体意象，也让现代中文读者明白其盟誓功能。末句“我是雅威”忠实保留神名及庄严的自我宣告。
