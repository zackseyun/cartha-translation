base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: zh_hans
  text: 我要把你们领进我举手起誓要赐给亚伯拉罕、以撒和雅各的那片土地，并把它赐给你们作产业。我是雅威。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶתְכֶם
  choice: 我要把你们领进
  rationale: הֵבִיא是בוא的使役式，在此表示使对象进入某地；“把你们领进”自然保留了使役和进入的含义。
- source_word: הָאָרֶץ
  choice: 那片土地
  rationale: 这里指应许给列祖的特定土地，而非泛指全地；“那片土地”在现代汉语中明确自然。
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: 我举手起誓
  rationale: 原文直译为“我举起我的手”，是起誓的固定表达；“举手起誓”同时保留具体意象并说明其语用意义。
- source_word: לָתֵת אֹתָהּ
  choice: 要赐给
  rationale: נתן基本义为“给”；主语为上帝且处于应许语境，用“赐给”庄重自然。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: 亚伯拉罕、以撒和雅各
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法；汉语无须机械重复介词。
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: 并把它赐给你们
  rationale: 直接表达连续的第一人称应许，保持原文简洁有力。
- source_word: מוֹרָשָׁה
  choice: 作产业
  rationale: 该词指被授予并长期持有、带有承继性质的产业；“作产业”保留所有权与持久归属的含义，也符合庄重现代汉语。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 直接音译四字神名יהוה，并保留原文庄严、简短的自我宣告。
theological_decisions:
- issue: 起誓惯用语נָשָׂאתִי אֶת יָדִי的表达
  choice: 我举手起誓
  alternative: 我起誓
  rationale: 只译“起誓”虽传达功能，却会丢失原文举手的具体意象；“举手起誓”在中文中清楚自然，并兼顾形式与意义。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”以音译方式呈现其专名性质，不以称号替代，也不引入额外解释。
- issue: מוֹרָשָׁה所表达的土地归属
  choice: 作产业
  alternative: 作继承的产业／作基业
  rationale: 此处重点是上帝将土地交给以色列，使其成为持久归属的产业；“作产业”不把意义限定为从人类祖先继承，也避免不必要地扩大法律细节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。句式保持上帝应许的直接力度；以“举手起誓”保存希伯来语的盟誓意象，同时避免生硬直译。
