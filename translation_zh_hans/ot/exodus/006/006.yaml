id: EXO.6.6
reference: Exodus 6:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: zh_hans
  text: 所以，你要对以色列人说[a]：‘我是雅威[b]。我要把你们从埃及人的重担下领出来，救你们脱离他们的奴役[c]；我要以伸出的膀臂和重大的审判行动[d]救赎你们。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，即以色列人或以色列子民。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为“YHWH”（יהוה），这里音译为“雅威”；传统译法常作“耶和华”或“上主”。
    reason: alternative_reading
  - marker: c
    text: “奴役”也可译作“劳役”或“服役”；本处指受埃及人强制辖制。
    reason: lexical_alternative
  - marker: d
    text: 也可译作“重大的审判”或“伟大的审判作为”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文并引出由此而来的命令；现代汉语中“所以”自然清楚。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 对以色列人
  rationale: 原文直译为“以色列的众子”，在此指整个以色列群体；“以色列人”准确而自然。
- source_word: אֲנִי יְהוָה
  choice: 我是雅威
  rationale: 直接音译四字神名，保留其作为上帝立约之名的性质。
- source_word: וְהוֹצֵאתִי ... מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: 我要把你们从埃及人的重担下领出来
  rationale: 保留“从……下”及“重担”的具体意象，同时以“领出来”表达使役形式。
- source_word: וְהִצַּלְתִּי
  choice: 救你们脱离
  rationale: 表达从压迫和辖制中解救出来，符合本节语境。
- source_word: מֵעֲבֹדָתָם
  choice: 脱离他们的奴役
  rationale: עֲבֹדָה本可指劳作或服役，但此处是埃及人强加的奴役。
- source_word: וְגָאַלְתִּי
  choice: 救赎你们
  rationale: 保留גאל所含的亲属赎回、解救和立约色彩。
- source_word: בִּזְרֹעַ נְטוּיָה
  choice: 伸出臂膀
  rationale: 保留原文拟人化意象，表示雅威亲自施展大能。
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: 用大能的审判
  rationale: שְׁפָטִים指施行审判的行动；“大能的审判”在汉语中兼顾其宏大威力与司法性质。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用四字神名；音译“雅威”保留专名性质，不以称号取代。
- issue: לִבְנֵי יִשְׂרָאֵל所指群体
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 这里是对整个立约群体说话；现代汉语“以色列人”不把所指范围误限于男性，同时脚注保留原文亲属表达。
- issue: עֲבֹדָה在本节的含义
  choice: 奴役
  alternative: 服役／劳役
  rationale: 上下文描述埃及统治下的强制劳动和辖制，因此“奴役”最能呈现其压迫性质。
- issue: גאל的表达
  choice: 救赎
  alternative: 赎回／解救
  rationale: “救赎”保留原词法律、亲属责任和神学上的多重回响，而不将其缩减为一般性的营救。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。四个连续的第一人称动词形成应许的推进：“领出来—救……脱离—救赎”；以分号体现希伯来文并列结构。所有脚注标记均在正文相应位置出现。
