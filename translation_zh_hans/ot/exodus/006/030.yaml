  text: 摩西却在耶和华面前说：“看哪，我的嘴唇未受割礼，法老怎会听我呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 保留原文“在……面前”的表达，并以“耶和华”译出神名。
- source_word: הֵן
  choice: 看哪
  rationale: 作为引起注意并强调下文的语气词，采用庄重而仍易懂的“看哪”。
- source_word: עֲרַל שְׂפָתַיִם
  choice: 嘴唇未受割礼的人
  rationale: 保留原文鲜明而不寻常的身体隐喻，不擅自解释为“笨口拙舌”或“没有口才”。
- source_word: יִשְׁמַע אֵלַי
  choice: 听我
  rationale: 此处可含“听从、理会”之意；正文保留较宽泛的“听我”，维持原文语义空间。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应原文四字神名，而不借此加入宗派性解释。
- issue: “嘴唇未受割礼”的意义
  choice: 保留原文隐喻
  alternative: 笨口拙舌／不善言辞
  rationale: 直译能保存该短语可能涉及言语能力、不适任或受阻状态的张力，避免将其意义限定为单纯口才不足。
translation_notes:
  register: 采用现代、庄重、可朗读的简体中文；保留希伯来语的反问结构和“嘴唇未受割礼”这一刻意突出的隐喻。
