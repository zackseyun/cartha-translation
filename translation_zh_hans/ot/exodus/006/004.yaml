base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: zh_hans
  text: 我也与他们立定了我的约，要把迦南地赐给他们，就是他们寄居之地。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“他们寄居之地，就是他们在其中寄居的地。”
    reason: 原文以同根名词和动词重复表达“寄居”；正文为符合现代汉语而避免重复。
lexical_decisions:
- source_word: וְגַם
  choice: 我也
  rationale: 保留连接词与强调副词的递加强调，并自然承接上文。
- source_word: הֲקִמֹתִי אֶת־בְּרִיתִי אִתָּם
  choice: 我也与他们立了我的约
  rationale: “立约”是现代汉语中自然、庄重的盟约用语；明确保留第一人称所有关系“我的”，而“与他们”表达盟约的关系对象。
- source_word: לָתֵת לָהֶם
  choice: 要把……赐给他们
  rationale: 表达不定式的目的或盟约内容；“赐给”适合上帝作为施予者的语境，又不额外增添神学含义。
- source_word: אֶרֶץ כְּנָעַן
  choice: 迦南地
  rationale: 采用通行中文地名形式，并保留 אֶרֶץ“地”。
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: 就是他们寄居过的地方
  rationale: “寄居”同时对应同根的 מָגוּר 与 גור，传达并非拥有当地产业的外来居留状态；中文主句避免生硬重复，脚注补出原文的重复结构。
theological_decisions:
- issue: קום + ברית 的盟约惯用语
  choice: 立了我的约
  alternative: 坚立了我的约
  rationale: 希伯来语该搭配可指设立或确立盟约。“立约”是中文圣经语域中自然且庄重的表达，不强行判定此处是在首次设立还是确认既有之约。
- issue: 列祖在迦南的身份
  choice: 寄居
  alternative: 居住
  rationale: “寄居”保留 מָגוּר／גור 所含外来者、尚未得地为业的身份意味；单用“居住”会削弱这层含义。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“迦南地”“立约”“寄居”沿用广为理解的圣经语汇；主句顺畅，脚注保留希伯来文末句的词根重复。
