  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: zh_hans
  text: 我也听见了以色列人的哀叹[a]——埃及人正在奴役他们；我也记念了我的约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，在这里指以色列人，也就是以色列全体人民。
    reason: lexical_alternative
  - marker: b
    text: 这里的“记念”是立约用语，并不是说神先前忘记了，而是表示他顾念所立的约，并转而采取行动。
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: 我也
  rationale: 保留附加和强调的语气，并以现代汉语自然表达神亲自听见他们的哀叹。
- source_word: שָׁמַעְתִּי
  choice: 听见了
  rationale: 希伯来语完成式在此表示已经发生并与当前宣告相关的行动；“听见了”在汉语中自然承载这一语境效果。
- source_word: נַאֲקַת
  choice: 哀叹
  rationale: 表达受压迫者痛苦的呻吟和呼声，语体庄重而不古奥。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在此作为群体称谓，指以色列全体人民；正文采用现代汉语惯用说法，直译信息收入脚注。
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: 埃及人正在奴役他们
  rationale: מִצְרַיִם形式上是“埃及”，但复数分词显示这里指实施压迫的埃及人；使役式מַעֲבִדִים表示强迫服役、使人成为奴隶，“正在奴役”准确体现持续的强制性。
- source_word: וָאֶזְכֹּר
  choice: 我也记念了
  rationale: 保留圣经中的“记念”用语，不将其解释性改写为“开始履行”或“采取行动”；第二个“也”自然衔接前面的“听见”。
- source_word: בְּרִיתִי
  choice: 我的约
  rationale: “约”是בְּרִית在此立约语境中的标准对应词。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体含义
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 原文使用阳性复数的固定群体称谓，并非只指男性。正文采用自然且准确涵盖全体人民的“以色列人”，脚注保留其字面形式。
- issue: 神“记念”其约的含义
  choice: 我也记念了我的约
  alternative: 我便要照着我的约采取行动
  rationale: 保留原文的立约用语和其中的神学张力，不把“记念”简化为遗忘后重新想起，也不在正文中提前解释为某一种具体行动。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀叹”“奴役”“记念”“约”保持出埃及记语境的严肃感；破折号清楚标示关系从句对以色列人处境的补充说明。
