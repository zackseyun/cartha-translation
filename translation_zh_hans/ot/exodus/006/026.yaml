base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: zh_hans
  text: 这就是亚伦和摩西；耶和华对他们说：“你们要按以色列人的队伍[a]，把以色列人从埃及地领出来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “队伍”所译的希伯来语也可译作“军旅”或“编队”，指有组织、甚至具有军队式编制的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: 这就是亚伦和摩西
  rationale: 独立代词הוּא在这里起强调、指认作用，回指前文家谱中所列的人。现代汉语用“这就是……”自然地表达这种辨认语气，同时不受希伯来语单数代词与并列人名之间形式差异的限制。
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: 耶和华对他们说
  rationale: 按现代汉语语序明确表达אָמַר与לָהֶם的关系。יְהוָה采用中文圣经传统中通行的专名译法“耶和华”，而不是改作称号。
- source_word: הוֹצִיאוּ
  choice: 领出来
  rationale: 该词是יצא的使役式复数祈使，表示使人出去。结合摩西、亚伦带领以色列人出埃及的语境，“领出来”既保留使役含义，也比生硬的“带出”更自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，但在此已是对全体以色列民的固定称呼。译作“以色列人”准确、自然，也不会让现代读者误以为命令只涉及男性。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留אֶרֶץ“地、国土”的明示成分，并以“从”表达来源。
- source_word: עַל צִבְאֹתָם
  choice: 按着他们的队伍
  rationale: צָבָא可指军队、军旅或有组织的群队。此处强调以色列民按群队有组织地离开；“队伍”保留组织性，又不把上下文过度军事化。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广大普通读者熟悉、并作为专名使用的“耶和华”；“雅威”是较接近学界常见拟音的另一选择，但原始发音并不能完全确定。
- issue: בְּנֵי יִשְׂרָאֵל所指的范围
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 这里的固定族群称谓指全体以色列民，而不是仅指男性后裔。译作“以色列人”传达实际所指，避免造成不必要的性别限定。
- issue: עַל צִבְאֹתָם的军事色彩
  choice: 按着他们的队伍
  alternative: 按着他们的军旅
  rationale: 该词确有军队、军旅的可能含义，但在本节可着重表达有组织的群体。正文保留“队伍”这一较宽泛说法，脚注说明其军事式编组的语义范围，不把张力消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这就是……”承接前文家谱并突出身份；引语用直接命令句。“按着他们的队伍”保持原文组织性意象，并以脚注保留可能更强的军事色彩。
