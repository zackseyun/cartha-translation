source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: zh_hans
  text: 耶和华对摩西和亚伦说，又就以色列人和埃及王法老的事吩咐他们[a]，要把以色列人[b]从埃及地领出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为：耶和华吩咐摩西和亚伦，向以色列人和埃及王法老传达这项命令。希伯来语介词既可指命令所涉及的对象，也可指命令的接受者；按上下文，正文理解为给摩西和亚伦的命令涉及以色列人和法老双方。
    reason: alternative_reading
  - marker: b
    text: “以色列人”希伯来语直译为“以色列的众子”；本节两处均如此。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事性连续式承接上文；现代汉语按语境自然推进，无须机械译出“然后”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的专名形式来呈现四字神名，而不以“主”这一称号替代。
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: 对摩西和亚伦
  rationale: אֶל 与 דבר 连用，通常标明说话的对象；“对……说”是自然且准确的汉语表达。
- source_word: וַיְצַוֵּם
  choice: 又吩咐他们
  rationale: צוה 表示带权威的命令；“吩咐”符合庄重的现代汉语语域，宾语“他们”指摩西和亚伦。
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: 有关以色列人和埃及王法老的事
  rationale: 在此可将两个 אֶל 短语理解为命令所涉及的对象，使摩西和亚伦仍是受命者；脚注保留将其理解为命令接受者的可能。
- source_word: לְהוֹצִיא
  choice: 要把……领出来
  rationale: יצא 的使役式不定词意为“使……出来”；“领出来”既体现使役意义，也符合出埃及叙事语境。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该民族称谓最自然的表达；脚注说明希伯来语的字面形式。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 保留 אֶרֶץ“地、土地”的具体地理表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是简体中文圣经传统中最广为人知的神名形式，能让普通读者将其识别为专名；不译作“主”，以免用称号取代原文专名。
- issue: אֶל 短语所标明的是命令涉及的对象，还是命令的接受者
  choice: 有关以色列人和埃及王法老的事
  alternative: 吩咐他们去告诉以色列人和埃及王法老
  rationale: 上下文中“他们”自然回指摩西和亚伦，因此正文把以色列人和法老理解为命令所涉及的双方；但希伯来介词也可标明命令所指向的接受者，故在脚注中保留这一真实的句法歧义。
- issue: בְּנֵי יִשְׂרָאֵל 是否按字面保留男性亲属称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语在这里是约定俗成的民族集体称谓；“以色列人”自然、准确，并不改变所指群体。字面形式在脚注中注明。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“有关……的事”保留原句关系上的含蓄，不额外补入原文未明说的具体命令内容；“领出来”呼应出埃及的行动语境。
