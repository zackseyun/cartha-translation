revisions:
- from: 耶和华对摩西和亚伦说，又吩咐他们有关以色列人和埃及王法老的事[a]，要把以色列人[b]从埃及地领出来。
  to: 耶和华对摩西和亚伦说，又就以色列人和埃及王法老的事吩咐他们[a]，要把以色列人[b]从埃及地领出来。
  rationale: 修订仅调整汉语句法与脚注措辞，不改变原文的叙事次序、受命者、两个介词短语的主要理解或“领出”的使役意义。正文用“就……的事吩咐他们”自然表达命令涉及的对象；脚注保留介词附着和受命对象的真实歧义，同时避免把“告诉”误作原文明载的动词。
