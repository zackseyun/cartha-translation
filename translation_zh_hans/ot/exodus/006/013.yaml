  terminology: “耶和华”“摩西”“亚伦”“埃及王法老”“以色列人”“埃及地”均符合现代中文圣经语域和专名惯例。“以色列人”作为民族集体称谓自然；脚注可简洁说明其字面形式，无须使用在本节范围不明确的“下同”。
