revisions:
- from: “你去对埃及王法老说，叫他放以色列众子[a]离开他的国土。”
  to: “你去，向埃及王法老说，让他让以色列子孙离开他的国土。”
  rationale: 将不自然且可能限缩所指的“以色列众子”改为“以色列子孙”，并将脚注改为准确说明其字面形式与惯用所指。调整标点及使役表达，使现代汉语更流畅，同时保留原文命令的内容和法老领土的指涉。
