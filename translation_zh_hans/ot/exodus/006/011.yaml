review_pass:
  verdict: revise
  source_fidelity: 译文正确呈现了两个命令（前往、向法老说）及其内容，即法老须使以色列的 בני ישראל 离开其土地。不过，“放……离开”的搭配略显生硬；“以色列众子”虽试图逐字对应，却不是现代标准汉语中自然或准确的亲属—民族表达。
  naturalness: “你去对……”通常宜在“去”后断开，作“你去，向……说”。“以色列子孙”是现代中文圣经语境中既自然又保留原文家族性称谓的表达；“让……离开”则自然表达此处使役／释放的命令性结果。
  terminology: “埃及王法老”可保留，简洁地反映原文同位称号。“以色列子孙”优于“以色列众子”：后者在汉语中容易仅指男性儿子，且不合惯用法。脚注应相应说明“以色列子孙”保留了原文直译意义，并列出“以色列人”为语境化替代译法。
  issues:
  - severity: medium
    issue: “以色列众子”不够自然，且可能误导为仅指男性儿子。
    rationale: בני ישראל 是希伯来语常用的亲属—民族称谓。中文“以色列子孙”是自然、传统且能保留其家族性表达的对应；“众子”并非此处适切的现代汉语表达。
  - severity: low
    issue: “放以色列众子离开”搭配生硬。
    rationale: 汉语通常说“让……离开”“准许……离开”或“放走……”。本节用“让以色列子孙离开”可清楚表达法老须准许／遣放他们离境，且不添加原文没有的内容。
  revised_text: “你去，向埃及王法老说，让他让以色列子孙离开他的国土。”
  revised_footnotes:
  - marker: a
    text: 或译“以色列人”。希伯来文直译为“以色列的儿子们”；这里是指以色列的子孙。
    reason: 说明原文亲属—民族称谓的字面形式，并提供自然的现代汉语替代译法。
  revision_rationale: 将不自然且可能限缩所指的“以色列众子”改为“以色列子孙”，并将脚注改为准确说明其字面形式与惯用所指。调整标点及使役表达，使现代汉语更流畅，同时保留原文命令的内容和法老领土的指涉。
