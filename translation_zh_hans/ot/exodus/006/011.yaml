  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: zh_hans
  text: “你去，向埃及王法老说，让他让以色列子孙离开他的国土。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא
  choice: 你去
  rationale: 这是בוא的命令式。该动词本义可表示“来”或“去”；按本节中摩西奉命前往法老面前的语境，现代汉语用“你去”最自然。
- source_word: דַבֵּר אֶל
  choice: 对……说
  rationale: 保留דבר的言说动作和אל所标明的受话对象，比“告诉”更贴近原文，也自然引出后面的吩咐内容。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: 埃及王法老
  rationale: 以紧凑而自然的汉语同位结构表达“法老，埃及王”，既保留身份称号，也避免不必要的增补。
- source_word: וִישַׁלַּח
  choice: 叫他放……离开
  rationale: 承接命令式，表达摩西对法老说话所要达到的指令性结果。“放……离开”兼顾שלח的释放、遣走含义和出埃及语境。
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来文明确的亲属性表达“以色列的众子”，同时以脚注列出较自然的族群性译法。
- source_word: מֵאַרְצוֹ
  choice: 离开他的国土
  rationale: מן表示从某处离开，ארץ在此指法老统辖的疆土；“他的国土”比单说“他的地”清楚，也与“离开”搭配自然。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的表达
  choice: 以色列众子
  alternative: 以色列人；以色列的子孙
  rationale: 这里没有重大教义分歧，但原文明说“众子”，且带有家族—民族的双重色彩。正文保留这一形式，脚注说明现代汉语中可采用的语境性译法，避免把原文过早平化为单纯的族名。
- issue: וִישַׁלַּח与前一命令的关系
  choice: 叫他放……离开
  alternative: 他就会送……出去；让他放……离开
  rationale: 前缀动词接在命令之后，可表达所吩咐言语的内容或预期结果。上下文要求摩西向法老传达释放以色列人的命令，因此采用指令性表达，但不进一步添加原文没有的理由或结果保证。
translation_notes:
  register: 采用现代、庄重而简明的叙事用语。“你去对……说”清楚呈现连续命令；“国土”符合普通读者用语。“以色列众子”略带原文色彩，因此配脚注帮助理解。
