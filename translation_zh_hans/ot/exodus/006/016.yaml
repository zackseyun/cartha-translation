  text: 'These are the names of Levi’s sons according to their generations: Gershon, Kohath, and Merari. And the years of Levi’s life were one hundred thirty-seven years.'
translation:
  language: zh_hans
  text: 以下是利未众子按着他们的世系所列的名字：革顺、哥辖、米拉利。利未一生的年日是一百三十七年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתֹלְדֹתָם
  choice: 按着他们的后代
  rationale: תּוֹלְדוֹת可指后代、世系或家族谱系；这里处于家谱引介中，译为“按着他们的后代”既贴近原文，也保留其谱系含义。
- source_word: וּשְׁנֵי חַיֵּי לֵוִי
  choice: 利未一生的年日
  rationale: 直译式表达保留希伯来文“利未生命的年数”的结构，同时符合中文圣经叙事的庄重语体。
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 一百三十七岁
  rationale: 将希伯来文按个位、十位、百位排列的数值转换为现代汉语自然数序。
