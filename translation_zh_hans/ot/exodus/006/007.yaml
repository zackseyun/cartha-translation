base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: zh_hans
  text: 我要接纳你们作我的子民，也要作你们的神。你们就会知道，我是雅威——你们的神，是把你们从埃及的重担[a]下领出来的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“埃及的苦役”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“是曾把你们领出来的”或“是领你们出来的”。希伯来文这里使用分词，既可突出持续进行或具有特征性的行动，也可指从应许实现后的角度看已经完成的拯救。
    reason: source_ambiguity
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: 我要接纳你们作我的子民
  rationale: “接纳……作……”自然表达神把以色列归给自己、确立为其子民的关系；既保留 covenant formula 的归属含义，也避免“拿取”在现代汉语中的生硬感。
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: 也要作你们的神
  rationale: 采用自然、庄重的现代汉语表达标准的立约关系公式，不额外加入后来的神学阐释。
- source_word: וִידַעְתֶּם
  choice: 你们就会知道
  rationale: “就会”体现前述拯救行动所带来的认识，同时保留动词兼具认知与亲身确认的范围。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以“主”这一称号替代专名。
- source_word: הַמּוֹצִיא
  choice: 是把你们……领出来的
  rationale: “是……的”结构把雅威表述为施行拯救者，在汉语中不强行限定为现在或过去一次性动作；脚注说明希伯来分词的时态与体貌张力。
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: 从埃及的重担下
  rationale: 保留原文“从……下面”的受压意象以及“重担”可指实际负荷或压迫性劳役的语义宽度。
theological_decisions:
- issue: 立约公式的表达
  choice: 我要接纳你们作我的子民，也要作你们的神
  alternative: 我要把你们归给自己作为子民，并要成为你们的神
  rationale: 所选译文忠实呈现双方归属关系，语言自然凝练，又不把该公式扩展成特定宗派的盟约神学体系。
- issue: 神名的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，与表示身份或权柄的称号相区别。
- issue: הַמּוֹצִיא 分词的时间指向
  choice: 采用体貌较中性的“是把你们……领出来的”，并加脚注
  alternative: 是曾把你们领出来的／是领你们出来的
  rationale: 希伯来分词可突出正在进行或具有特征性的行动，也可从应许实现后的视角指已完成、界定雅威身份的拯救；正文不武断消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“接纳……作……”比直译“拿取”自然，同时保留归属关系；“重担下”有意保存原文受压的形象。全句避免古奥虚词和宗派化术语。
