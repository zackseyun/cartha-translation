base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/019.yaml
  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: zh_hans
  text: 米拉利的儿子是抹利和母示。这些是利未人的各宗族[a]，按着他们的世系划分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“利未的各宗族。”希伯来语这里用的是单数族称“利未人”，很可能以集合方式指利未一系。
    reason: 保留 הַלֵּוִי 在单数族称与利未谱系之间的词义和句法差异。
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: 米拉利的儿子
  rationale: בְּנֵי 是“儿子”的复数构造式；在家谱语境中译作“儿子”最自然。句首连接词用于延续名单，中文不必机械译出“和”，以免生硬。人名采用中文圣经传统中通行的译名“米拉利”。
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: 抹利和母示
  rationale: 两个专名采用中文圣经传统中的通行译名，并保留连接词“和”。
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: 该词在支派和家谱语境中指较大的亲族分支；“宗族”比现代汉语中的“家庭”更准确。“各”自然表达希伯来语复数。
- source_word: הַ/לֵּוִי
  choice: 利未人
  rationale: 原文是带定冠词的单数族称，直译近于“那利未人”，此处很可能作集合用法，指利未一系；中文以“利未人”既保留族称，也可自然表达集合意义。
- source_word: לְ/תֹלְדֹתָם
  choice: 按着他们的世系划分
  rationale: תּוֹלְדוֹת 在家谱公式中表示世代、谱系或后裔脉络；“按着他们的世系划分”自然传达 לְ 所表示的分类依据，同时保留家谱语体。
theological_decisions:
- issue: הַ/לֵּוִי 的单数族称究竟指“利未人”这一群体还是“利未”这一祖先所出的宗族
  choice: 正文译作“利未人的各宗族”
  alternative: “利未的各宗族”
  rationale: 原文形式是单数族称而非直接使用专名“利未”，因此正文保留族称“利未人”；但单数在此很可能具有集合意义。脚注列出按祖先名称理解的自然译法，不排除原文的表达张力。
translation_notes:
  register: 采用现代、庄重而易懂的家谱语体。专名沿用中文圣经读者熟悉的“米拉利、抹利、母示、利未”。以“宗族”和“世系”准确呈现支派谱系层级；避免把原文单数族称过度明确化为单纯专名或显式复数。
