base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/028.yaml
  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: zh_hans
  text: 事情发生在雅威在埃及地对摩西说话的那一天——[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“那时，雅威在埃及地对摩西说话——”或“雅威在埃及地对摩西说话的那一天，事情发生了——”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”原文为神名YHWH（四字神名）；传统译本常以“主”或“耶和华”等形式呈现。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 事情是这样的
  rationale: 该叙事形式在这里承接并重新开启前文在出埃及记6:2—13中暂时中断的场景。译为“事情是这样的”既保留叙事过渡作用，又避免生硬的“事情发生了”。
- source_word: בְּיוֹם
  choice: 在……的那一天
  rationale: 保留希伯来文“在……之日”的明确时间表达，同时用现代汉语关系分句自然呈现。
- source_word: דִּבֶּר ... אֶל־מֹשֶׁה
  choice: 对摩西说话
  rationale: דבר与אֶל连用，直指向摩西说话；此处译作“说话”比只译“说”更贴近词义，也与下一节的具体话语衔接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，并以脚注说明原文为四字神名YHWH，不以称号替代专名。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留原文אֶרֶץ“地、土地”，同时符合庄重而通顺的现代汉语表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用以色列上帝的四字神名。正文采用中文传统且广为人知的音译“耶和华”，不以“上主”等称号代替；脚注同时交代YHWH及另一常见拟音“雅威”。
- issue: 本节未完句式及其与下一节的关系
  choice: 以破折号保留开放式衔接
  alternative: 以句号收束为独立完整句
  rationale: 第28节以时间背景起头，第29节继续主句内容；破折号可提示读者本节语意尚待下文完成，不擅自消除原文的篇章张力。
translation_notes:
  register: 采用现代、庄重、易懂的叙事语体。“当……的那一天”保留原文时间框架；“事情是这样的”承担וַיְהִי的叙事转换功能。句末破折号对应本节与6:29的连续句法。
