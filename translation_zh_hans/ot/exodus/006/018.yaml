  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: zh_hans
  text: 哥辖的儿子是暗兰、以斯哈、希伯伦和乌薛。哥辖一生的年日是一百三十三年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: 哥辖的儿子是
  rationale: בְּנֵי 是“儿子”的复数附属形式；此处列出哥辖直接的四个儿子，因此不用范围更广的“后代”。句首 וּ 承接前文，但现代汉语家谱体不必机械译作“并且”；加入“是”使名单自然完整。
- source_word: קְהָת
  choice: 哥辖
  rationale: 按现代中文圣经传统采用通行人名译法。
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: 暗兰、以斯哈、希伯伦和乌薛
  rationale: 四个人名采用现代中文圣经中通行的音译；各 וְ 在汉语列举中以顿号及末项前的“和”自然表达。
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  choice: 哥辖一生的年日是
  rationale: שְׁנֵי חַיֵּי 直指“一生的年数”。“一生的年日”既保留希伯来语的表达色彩，也符合庄重而易懂的现代汉语。连接词 וּ 在此以新句衔接体现，不另译“并且”。
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 一百三十三年
  rationale: 希伯来语按“三、三十、一百”的次序组合数字；汉语依正常数序译为“一百三十三年”。
