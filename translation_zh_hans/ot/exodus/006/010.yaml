  yaml_path: translation/ot/exodus/006/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 于是，雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה）；也常译作“耶和华”。
    reason: 说明神名的原文形式及常见另一译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说
  rationale: 叙事性连续式推动事件进展；“于是”自然表达承接关系。דבר在汉语引出话语时译作“说”最自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是神的四字圣名。在现代简体中文圣经语境中，“耶和华”是最通行且易识别的音译；脚注说明其希伯来文形式及另一常见拟音。
- source_word: אֶל
  choice: 对
  rationale: 这里表示说话所指向的对象；汉语惯用“对摩西说”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文通行的人名译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接话语。中文以“说：”即可自然保留其功能，不机械重复为“说道”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，不宜以“主”这一称号替代。正文采用现代中文读者最熟悉的“耶和华”，并以脚注交代原文为 YHWH 及“雅威”这一拟音，从而保留文本信息而不把某一种发音重构说成毫无疑问。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“于是”体现叙事推进；“对摩西说：”符合中文引出直接话语的习惯。脚注标记置于“说”后，以对应神名译法的说明，同时不打断正文阅读。
