  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: zh_hans
  text: 可拉的儿子是亚惜、以利加拿和亚比亚撒。这些是可拉人的各宗族[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“各家族”。这里的希伯来语词可指支派内部由亲属关系形成的群体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: ……的儿子是
  rationale: בְּנֵי是“儿子”的复数构造形式；本节紧接家谱并列出三个人名，宜按直接亲子关系翻译。句首的连接词וּ在中文中不必机械译作“和”。
- source_word: קֹרַח
  choice: 可拉
  rationale: 按现代中文圣经人名的通行译法音译。
- source_word: אַסִּיר
  choice: 亚惜
  rationale: 此处是家谱中的人名，按现代中文圣经人名的通行译法音译；虽然该形式在其他语境中可能与“被囚者”相关，此处不作普通名词解释。
- source_word: וְאֶלְקָנָה
  choice: 以利加拿
  rationale: 按现代中文圣经人名的通行译法音译；前缀连接词通过中文列举结构表达。
- source_word: וַאֲבִיאָסָף
  choice: 亚比亚撒
  rationale: 按现代中文圣经人名的通行译法音译，并以“和”连接列举中的最后一项。
- source_word: אֵלֶּה
  choice: 这些是
  rationale: 指示代词引出身份说明句；中文补出判断词“是”，表达自然。
- source_word: מִשְׁפְּחֹת
  choice: 各宗族
  rationale: מִשְׁפָּחָה在支派和家谱语境中常指较大的亲族分支；“宗族”比现代汉语中可能仅指核心家庭的“家庭”更准确，同时保留“家族”这一可行译法于脚注。
- source_word: הַקָּרְחִי
  choice: 可拉族
  rationale: 该族属形容词指属于可拉谱系的人群；“可拉族”简洁表达这一群体归属。
