  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה כֵּ֖ן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֤א שָֽׁמְעוּ֙ אֶל מֹשֶׁ֔ה מִ/קֹּ֣צֶר ר֔וּחַ וּ/מֵ/עֲבֹדָ֖ה קָשָֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: zh_hans
  text: 摩西把这些话告诉以色列人；但他们因心灵受压[a]，又因沉重的苦役[b]，没有听从摩西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“因灵短促”，可指灰心、心力受压，或在重压下仿佛喘不过气。
    reason: lexical_alternative
  - marker: b
    text: 或译“严酷的劳动”；这里指他们在埃及所受的强迫劳役。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 告诉
  rationale: דבר 的 piel 在这里是“说、讲述”；结合受话对象和前文所传的信息，“告诉”符合现代汉语叙事习惯。
- source_word: כֵּן
  choice: 这样
  rationale: 指回摩西在上文所领受并传达的信息；“这样”既贴近原文，也比“如此”更自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是指以色列共同体的常用称呼；现代汉语用“以色列人”自然涵盖全体，不必机械译作“以色列的众子”。
- source_word: שָׁמְעוּ אֶל
  choice: 不肯听……的话
  rationale: שמע אל 表示听从或理会某人。语境并非听觉失败；“不肯听……的话”清楚表达他们无法接受或响应摩西的信息，但“肯”可能带出意愿色彩，因此以脚注不另作强化。
- source_word: מִקֹּצֶר רוּחַ
  choice: 因心灵压抑
  rationale: 字面为“由于灵短促”，描写人在重压下内心受挫、气馁或喘不过气的状态。“心灵压抑”保留其内在受困的意象，而不将含义限定为单纯的不耐烦。
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: 又因苦重的劳役
  rationale: עֲבֹדָה 是劳动、服役，קָשָׁה 表示艰苦、严酷；“苦重的劳役”既保留词义，也让埃及强迫劳动的背景自然显现，而不把名词直接改译为“奴役”。
theological_decisions:
- issue: עֲבֹדָה קָשָׁה 是否直接译作“残酷的奴役”
  choice: 苦重的劳役
  alternative: 残酷的奴役
  rationale: 出埃及记的背景明确是被奴役，但本短语本身直接说的是艰苦严酷的劳动或服役。正文保留这一措辞，脚注说明其强迫劳役性质，避免把语境信息完全取代原词。
- issue: מִקֹּצֶר רוּחַ 的心理状态
  choice: 心灵压抑
  alternative: 灰心／不耐烦／气短
  rationale: 原文意象具有“灵短促、受拘束”的张力，既可指灰心，也可能包含因苦难而急促、无力承受的状态；译文不把它收窄为某一种心理诊断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“以色列人”比“以色列的众子”更符合普通读者习惯；两处脚注保留希伯来语短语的意象与词义范围。
