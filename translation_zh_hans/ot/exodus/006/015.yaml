- from: 西缅的儿子是耶母利、雅悯、阿辖、雅斤、琐辖和扫罗；扫罗是一个迦南女子所生的。这些是西缅的各宗族。
  to: 西缅的儿子是耶母利、雅悯、阿辖、雅斤、琐辖，以及那迦南女子的儿子扫罗。这些是西缅的宗族。
  rationale: 修订将“那迦南女子的儿子”恢复为直接修饰“扫罗”的族谱同位语，并以“那”表达原文的限定性；其余人名和“宗族”均保留。无需脚注。
