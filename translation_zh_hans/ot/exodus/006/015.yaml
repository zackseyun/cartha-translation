translation:
  language: zh_hans
  text: 西缅的儿子是耶母利、雅悯、阿辖、雅斤、琐辖，以及那迦南女子的儿子扫罗。这些是西缅的宗族。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: 西缅的儿子是
  rationale: בְנֵי是“儿子”的复数附属形；在族谱中直译为“儿子”自然准确。句首ו承接上文，中文族谱语境无需机械译出“和”。
- source_word: יְמוּאֵל וְיָמִין וְאֹהַד וְיָכִין וְצֹחַר וְשָׁאוּל
  choice: 耶母利、雅悯、阿辖、雅斤、琐辖和扫罗
  rationale: 人名按现代中文圣经中通行且可辨识的译名处理；希伯来语各项前重复的ו在中文列举中以顿号及末项前的“和”自然表达。
- source_word: בֶּן הַכְּנַעֲנִית
  choice: 扫罗是一个迦南女子所生的
  rationale: הַכְּנַעֲנִית为阴性单数，明确指迦南女性；“所生的”在中文中自然表达其母子关系，同时避免误解为“迦南人的儿子”而不明性别。
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: 这些是西缅的各宗族
  rationale: מִשְׁפְּחֹת在支派谱系中指支派内部的亲族群体，译为“宗族”比现代意义较窄的“家庭”准确；复数以“各宗族”表达。
