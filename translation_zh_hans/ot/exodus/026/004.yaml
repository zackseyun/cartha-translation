base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: zh_hans
  text: 你要在第一组相连幔子末端那一幅幔子的边缘上做蓝色环子[a]；在第二组相连幔子[b]最外面那一幅幔子的边缘上，也要照样做[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓝色”也可理解为“蓝紫色”或“紫蓝色”；希伯来词 תְּכֵלֶת 指帐幕织物所用的一种特有染色材料。
    reason: lexical_alternative
  - marker: b
    text: “相连幔子”所译的希伯来词 חֹבָרֶת／מַחְבֶּרֶת，指若干幅幔子连接成的一个整体；也可译为“连接部分”。
    reason: lexical_alternative
  - marker: c
    text: “最外面的一幅”也可译为“最末端的一幅”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: 扣环
  rationale: 指缝制在幔子边缘、用来连接幔子的环状物；“扣环”在现代中文中自然，并能体现其连接功能。
- source_word: תְּכֵלֶת
  choice: 蓝色的
  rationale: 该词指会幕织物所用的特有蓝色或蓝紫色染料、线料；原文在此直接修饰扣环，正文用“蓝色的”以避免擅自补入“线”，并用脚注保留色调与材料层面的可能性。
- source_word: שְׂפַת
  choice: 边缘
  rationale: 本义为“唇、边”，用于织物时译作“边缘”清楚自然。
- source_word: יְרִיעָה
  choice: 幔子
  rationale: 在出埃及记26章指构成帐幕的织物幅面；“幔子”既符合会幕语境，也能让普通读者理解。
- source_word: הָאֶחָת
  choice: 那幅
  rationale: 希伯来文直译为“那一幅”，不是明确的序数“第一幅”；中文用“那幅”保留指称关系且更自然。
- source_word: מִקָּצָה
  choice: 末端
  rationale: 表示处于端头的位置；结合后面的相连单元，译为“第一组相连幔子的末端”能清楚表达空间关系。
- source_word: חֹבָרֶת
  choice: 第一组相连幔子
  rationale: 该词指多幅幔子连接而成的整体。原文此处没有明说“第一”，但与后文“第二组”相对，中文补出“第一组”以明确结构。
- source_word: וְכֵן
  choice: 也要照样
  rationale: 表示对应的制作方式相同；“也要照样”简洁地传达命令与平行关系。
- source_word: הַקִּיצוֹנָה
  choice: 最外面的一幅
  rationale: 指位于一组幔子最外端的那幅；“最外面”比“最后”更明确表达空间位置。
- source_word: מַחְבֶּרֶת
  choice: 一组相连幔子
  rationale: 与חֹבָרֶת近义，指连接成一个单元的一组幔子；统一译法可保留两者的语义联系。
- source_word: הַשֵּׁנִית
  choice: 第二组
  rationale: 明确指出两组相连幔子中的第二组。
theological_decisions: []
