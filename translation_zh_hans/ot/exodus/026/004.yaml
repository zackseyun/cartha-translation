- from: 要在第一组相连幔子的末端，就是那幅幔子的边缘上，做蓝色的扣环[a][b]；第二组相连幔子最外面那一幅的边缘上，也要照样做[c]。
  to: 你要在第一组相连幔子末端那一幅幔子的边缘上做蓝色环子[a]；在第二组相连幔子[b]最外面那一幅幔子的边缘上，也要照样做[c]。
  rationale: 修订明确了“第一组末端的那一幅幔子”与其“边缘”的层级关系，并以较中性的“环子”对应原文的环状物。脚注锚点随所说明的词语调整，且保留色调和空间描述的合理替代译法。
