  terminology: 保留“幔子”“边缘”“相连幔子”和“蓝色”等合适用语。将“扣环”改为“环子”，避免把 לֻלְאֹת 的环状连接部件误说成现代意义上的扣件。脚注保留 תְּכֵלֶת 的色调不确定性，以及两个近义希伯来词所指的相连幔子组。
