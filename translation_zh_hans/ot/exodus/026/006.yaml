base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: zh_hans
  text: 你要做五十个金扣，把幔子用这些扣子彼此连接起来，使帐幕连成一体。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要做
  rationale: 带连接词的完成式在连续指示中表达命令；“你要做”自然、明确地传达指令语气。
- source_word: קַרְסֵי זָהָב
  choice: 金扣
  rationale: קֶרֶס指连接幔子的扣合件；“金扣”简洁地表达材质与功用，又不武断限定具体形状。
- source_word: וְחִבַּרְתָּ
  choice: 连接起来
  rationale: חבר意为连接、接合；此处译为“连接起来”符合现代汉语的施工指示语体。
- source_word: הַיְרִיעֹת
  choice: 幔子
  rationale: יְרִיעָה在帐幕语境中指组成覆盖结构的织物幅片；“幔子”既沿用圣所语境中的常见称法，也易于理解。
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: 彼此
  rationale: 字面为“一个女人对她的姊妹”，是希伯来语表示同类物件逐一对应的惯用说法；汉语“彼此”准确传达其实际意义，无须保留不自然的阴性拟人表达。
- source_word: בַּקְּרָסִים
  choice: 用这些扣子
  rationale: 介词ב在此表示工具；“用这些扣子”自然地表达借助扣件连接。
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: 使帐幕连成一体
  rationale: 该句说明连接后的结果；“连成一体”既保留אֶחָד的整体性，也顺应中文对多个幔子组成一个帐幕的表达。
theological_decisions:
- issue: הַמִּשְׁכָּן的译法
  choice: 帐幕
  alternative: 居所
  rationale: מִשְׁכָּן本义与“居住”相关，但在《出埃及记》的圣所建造语境中已是特定设施名称；“帐幕”在现代中文圣经语境中清楚、稳定，且不额外引入宗派解释。
- issue: וְהָיָה所表达的逻辑关系
  choice: 使……连成一体
  alternative: 帐幕就成为一个整体
  rationale: 上下文显示这是扣合幔子所产生的结果。用“使”明确结果关系，但不赋予经文额外的象征或教义含义。
translation_notes:
  register: 采用现代、庄重而通顺的施工指示语体。保留“帐幕”“幔子”等本段核心术语；句式简洁，适合普通读者朗读和理解。原文惯用语“一个女人对她的姊妹”在中文中会造成误解，故直接按功能译为“彼此”，不设脚注。
