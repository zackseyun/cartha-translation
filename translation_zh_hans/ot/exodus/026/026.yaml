  text: And you shall make five bars of acacia wood for the frames of the one side of the tabernacle[a].
translation:
  language: zh_hans
  text: 你要用皂荚木为帐幕一侧的框架[a]做五根横闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“木板”；希伯来语所指的是构成帐幕主体的直立结构构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要做
  rationale: 连词加完成式出现在连续的建造指示中，具有命令意味；译为“你要……做”既自然，也保留规程式语气。
- source_word: בְרִיחִם
  choice: 横闩
  rationale: 此处指连接并稳固帐幕框架的横向构件；“横闩”比泛称“木杠”更能表达其建筑用途，又不把它误解为门闩。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 这是指皂荚属木材的惯用名称；“皂荚木”在现代中文圣经语境中清楚而庄重。
- source_word: חֲמִשָּׁה
  choice: 五根
  rationale: 基数词“五”，配合细长木制构件，使用量词“根”符合现代汉语习惯。
- source_word: לְקַרְשֵׁי
  choice: 给……框架使用
  rationale: 介词 לְ 表明横闩是为这些结构构件而设；קֶרֶשׁ 指帐幕直立的结构构件，译作“框架”可体现其建筑功能。
- source_word: צֶלַע
  choice: 一侧
  rationale: 该词本可指“肋”或“侧边”，在此建筑语境中自然指帐幕的一侧。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 虽有“居所”之词根含义，此处专指《出埃及记》中建造的圣所帐幕，采用通行名称“帐幕”。
- source_word: הָאֶחָד
  choice: 一侧
  rationale: 指两侧中的一侧，并与下一节所说另一侧相对应；中文“一侧”能自然保留这种未明确为哪一侧的表达。
