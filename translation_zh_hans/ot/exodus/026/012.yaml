  - severity: low
    issue: “帐棚幔子”定中关系略显紧缩。
    rationale: “帐棚的幔子”更自然清楚地表达“帐棚的幔子”，并维持其与“帐幕”的术语区别。
  revised_text: 帐棚的幔子余下的垂幅[a]，就是多出的那半幅幔子，要垂在帐幕的后部[b]。
