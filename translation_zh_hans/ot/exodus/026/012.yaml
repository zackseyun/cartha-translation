base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: zh_hans
  text: 帐棚的幔子余下的垂幅[a]，就是多出的那半幅幔子，要垂在帐幕的后部[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“帐棚幔子剩余的部分”。
    reason: lexical_alternative
  - marker: b
    text: 原文在这里区分“帐棚”（覆盖层）和“帐幕”（居所的结构）。
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: 垂幅
  rationale: 该名词指多余而伸出、下垂的部分；“垂幅”兼顾余料与悬垂的形象，也符合幔子的建筑语境。
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: 余下的／多出的
  rationale: 两个分词都表达剩余、超出的意思；按各自句法搭配分别译作“余下的”和“多出的”，使现代汉语自然，同时保留原文的重复强调。
- source_word: יְרִיעֹת
  choice: 幔子
  rationale: 在帐幕段落中，该词指构成覆盖层的大幅织物；“幔子”是清楚而庄重的对应词。
- source_word: הָאֹהֶל
  choice: 帐棚
  rationale: 此处指覆盖帐幕结构的帐棚层，与本节后面的 מִשְׁכָּן 有所区别；译作“帐棚”保留这一区分。
- source_word: חֲצִי הַיְרִיעָה
  choice: 那半幅幔子
  rationale: 原文指一幅幔子的一半；量词“幅”适合织物，也使单数所指明确。
- source_word: תִּסְרַח
  choice: 要垂
  rationale: 该动词描写多出部分伸展或垂下；结合覆盖层的实际形态，“要垂”简洁准确，并与“垂幅”呼应。
- source_word: עַל אֲחֹרֵי
  choice: 在……后面
  rationale: 该短语指覆盖或垂到结构的后部；汉语“垂在帐幕后面”自然表达其方位，语境也已表明织物覆盖后部。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是指神圣居所结构的专门用语；“帐幕”是现代中文圣经语境中清楚、通行的译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的说明性语言。“垂幅”略带建筑织物语域，既传达剩余部分，也呈现其下垂功能；句式保留原文先总说、后同位解释的结构。
