  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: zh_hans
  text: 它们的四十个底座[a]要用银制成：一块竖板[b]下面有两个底座，另一块[c]竖板下面也有两个底座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“卯座”；希伯来语指承托会幕竖板、供其榫头嵌入的银座。
    reason: lexical_alternative
  - marker: b
    text: 或译“板”或“框架构件”；希伯来语指会幕中每一块直立的结构构件。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“一块竖板……一块竖板”，在这里是逐块分配的表达。
    reason: source_form
lexical_decisions:
- source_word: וְ/אַרְבָּעִים אַדְנֵי/הֶם
  choice: 它们的四十个底座
  rationale: 承接上一节的结构，保留“四十”和所属关系。אֶדֶן在会幕建造语境中指承托并嵌接竖板的银座；“底座”清楚自然。
- source_word: כָּסֶף
  choice: 用银制成
  rationale: 该名词说明底座的材料；汉语用“用银制成”自然表达材质。
- source_word: שְׁנֵי אֲדָנִים תַּחַת
  choice: 下面有两个底座
  rationale: 准确表达每个结构构件下方设有两个支座的空间及数量关系。
- source_word: הַ/קֶּרֶשׁ
  choice: 竖板
  rationale: קֶרֶשׁ指会幕中直立的结构构件。“竖板”既保留板状构件的含义，也明确其直立用途，较单说“板”更易于现代读者理解。
- source_word: הָ/אֶחָד ... הָ/אֶחָד
  choice: 一块……另一块
  rationale: 希伯来文两次都用定冠词加“一”，形成分配式表述。结合上下文二十块竖板与四十个底座，汉语译为“一块……另一块”可自然传达逐块各配两个底座的意思；脚注同时保留原文重复形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的建筑用语。“底座”“竖板”便于普通读者形成结构图景；句式保留原文的数量与对应关系，同时以“一块……另一块”避免汉语中误解为同一块竖板。
