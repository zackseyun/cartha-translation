  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: zh_hans
  text: 每幅[a]幔子长二十八肘，宽四肘；所有幔子的尺寸都相同[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文较直译为“那一幅幔子……那一幅幔子”；希伯来语用这种逐一指称的形式，说明每一幅幔子的尺寸。
    reason: lexical_alternative
  - marker: b
    text: 或译：“所有幔子都要采用同一个尺度。”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: 长
  rationale: 在会幕尺寸说明中表示长度；中文用“长……肘”自然简洁。
- source_word: הַיְרִיעָה
  choice: 幔子
  rationale: 此词在会幕语境中指构成覆盖物的大幅织物；“幔子”既符合礼仪建筑语境，也比“布片”庄重。
- source_word: הָאַחַת / הָאֶחָת
  choice: 每幅
  rationale: 原文直译近于“那一幅”，在这里是逐一分配尺寸的表达；译作“每幅”准确传达各幅幔子均适用这些尺寸。
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: 二十八
  rationale: 按现代汉语数词顺序表达基数。
- source_word: בָּאַמָּה
  choice: 肘
  rationale: אַמָּה是古代标准长度单位，传统且准确地译作“肘”。
- source_word: וְרֹחַב
  choice: 宽
  rationale: 与“长”自然配对，符合现代汉语尺寸说明。
- source_word: אַרְבַּע
  choice: 四
  rationale: 直接表达原文基数。
- source_word: מִדָּה אַחַת
  choice: 尺寸都相同
  rationale: 原文直译为“一个尺度”；结合 לְכָל，现代汉语用“尺寸都相同”更自然，并准确表达全体采用同一规格。
- source_word: לְכָל הַיְרִיעֹת
  choice: 所有幔子
  rationale: 表明同一尺寸适用于整组幔子，保留原文的整体范围。
theological_decisions: []
