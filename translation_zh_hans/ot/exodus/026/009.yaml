  text: וְ/חִבַּרְתָּ֞ אֶת חֲמֵ֤שׁ הַ/יְרִיעֹת֙ לְ/בָ֔ד וְ/אֶת שֵׁ֥שׁ הַ/יְרִיעֹ֖ת לְ/בָ֑ד וְ/כָפַלְתָּ֙ אֶת הַ/יְרִיעָ֣ה הַ/שִּׁשִּׁ֔ית אֶל מ֖וּל פְּנֵ֥י הָ/אֹֽהֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: zh_hans
  text: 要把五幅幔子连成一组，再把六幅幔子连成一组；要把第六幅幔子对折在帐幕前面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在帐幕前面”或译“对着帐幕的正面”。
    reason: 原文介词短语 אֶל מוּל פְּנֵי 可侧重位置在正面前方，也可侧重朝向帐幕正面。
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: 连成一组
  rationale: 该动词表示连接、接合；结合两个不同数目的幔子组，译为“连成一组”自然地表达各幅幔子分别接合为两个单元。
- source_word: יְרִיעֹת / יְרִיעָה
  choice: 幔子
  rationale: 该词在会幕建造语境中指成幅的织物覆盖物；“幔子”既符合建筑语境，也比“布幅”更庄重、易懂。
- source_word: לְבָד
  choice: 分别连成两组（通过“再”及重复句式表达）
  rationale: 此处强调五幅与六幅各自成为独立的一组。汉语不必机械重复“分别”，用“连成一组，再把……连成一组”即可清楚表达。
- source_word: כָפַלְתָּ
  choice: 对折
  rationale: 该动词表示折叠、叠成双层；“对折”简洁地保留第六幅幔子折成双层的含义。
- source_word: הַשִּׁשִּׁית
  choice: 第六幅
  rationale: 序数词修饰单数“幔子”；用量词“幅”符合现代汉语习惯。
- source_word: אֶל מוּל פְּנֵי
  choice: 在……前面
  rationale: 该复合介词表达朝向或位于某物正面前方。正文采用自然的空间表达，脚注保留“对着正面”的较直译可能。
- source_word: הָאֹהֶל
  choice: 帐幕
  rationale: 原文为“帐棚、帐幕”，在此特指会幕结构；“帐幕”既忠于词义，也符合本段语境，而不直接改译为专名“会幕”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的建造指令语体。“要把……再把……”体现希伯来语连续命令的节奏；避免机械照搬“各自”，同时明确五幅和六幅分别接合成组。
