  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: zh_hans
  text: 你要用蓝色、紫色和朱红色线，以及捻成的细麻，为帐幕的入口做一道帘子[a]，用绣工的手艺制作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帘子”也可译作“门帘”或“遮帘”；这里指遮盖帐幕入口的悬挂织物，有别于本章其他地方所说的内部幔子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做
  rationale: 在这一连串建造指示中，带连接词的完成式表达命令或指示；“你要……做”符合现代汉语的庄重指令语体。
- source_word: מָסָךְ
  choice: 帘子
  rationale: 此词指用作遮盖或隔断的悬挂织物；这里位于帐幕入口，与本章所述内部幔子有别。“帘子”自然易懂，具体区别在脚注说明。
- source_word: לְפֶתַח הָאֹהֶל
  choice: 帐幕入口的
  rationale: פֶתַח 指开口或入口，אֹהֶל 指帐棚；在本段语境中译作“帐幕入口”自然，并避免把该短语过度解释为专门术语。
- source_word: תְּכֵלֶת
  choice: 蓝色……线
  rationale: 指珍贵的蓝色或蓝紫色染料织材；“蓝色”沿用清楚、通行的颜色名称，并根据织物语境补出“线”。
- source_word: אַרְגָּמָן
  choice: 紫色……线
  rationale: 指紫色染制的织材；译为“紫色”准确而通俗，“线”由并列结构共同支配。
- source_word: תוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 这是指朱红染料织材的固定表达，并非在此直译为虫；“朱红色线”明确呈现其纺织材料含义。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻成的细麻
  rationale: שֵׁשׁ 是优质细麻，מָשְׁזָר 表示经捻合加工；译文保留材料和制作方式两层信息。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 是绣工的手艺
  rationale: 该短语强调由专业工匠完成的装饰性纺织工艺；此译法既保留工匠主体，也符合现代汉语表达。
