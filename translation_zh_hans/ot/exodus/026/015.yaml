  text: And you shall make the frames for the tabernacle of acacia wood[b][a], standing upright.
translation:
  language: zh_hans
  text: “你要为帐幕制作皂荚木的竖立木构件[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “木构件”或译“木板”；希伯来语所指的是帐幕中直立的木质结构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……制作
  rationale: 带连接词的完成式在连续的建造指示中表达命令；现代汉语用“你要”自然传达这一指令语气。本节在中文中不必机械译出句首连接词。
- source_word: הַקְּרָשִׁים
  choice: 构架
  rationale: 该词指帐幕中直立的木质结构件。“构架”突出其建筑结构功能，同时保留它究竟是实心木板还是框状构件的不确定性；脚注列出传统译法“木板”。
- source_word: לַמִּשְׁכָּן
  choice: 为帐幕
  rationale: מִשְׁכָּן在《出埃及记》的语境中是圣所结构的专门称呼，译作“帐幕”符合现代中文圣经用语，也比泛称“居所”更明确。
- source_word: עֲצֵי שִׁטִּים
  choice: 用皂荚木
  rationale: 该结构表示取自שִׁטָּה树的木材；“皂荚木”是简体中文圣经语境中通行且易懂的名称。“用”清楚标明材料。
- source_word: עֹמְדִים
  choice: 直立的
  rationale: 阳性复数分词描述这些构架竖直站立的状态。译作前置修饰语“直立的”简洁自然，并保留其建筑方位含义。
