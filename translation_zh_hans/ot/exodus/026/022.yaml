  yaml_path: translation/ot/exodus/026/022.yaml
  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: zh_hans
  text: 帐幕的后面，就是西面，你要做六块板[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“框架”；若这些结构件不是实心木板，而是开放式木框，就可这样理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: 帐幕的后面
  rationale: יַרְכְּתֵי在帐幕建筑语境中指较远的后部或背面；译作“后面”自然清楚，并与下文的方位说明相合。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן在本段专指以色列人敬拜所用的圣所结构。“帐幕”既保留其可迁移居所的形象，也避免与“会幕”所对应的另一希伯来称谓完全混同。
- source_word: יָמָּה
  choice: 就是西面
  rationale: 该词字面为“朝海”，在以色列地理方位中通常表示向西。此处是对“后面”的具体说明，译为“就是西面”符合现代汉语建筑方位的表达。
- source_word: תַּעֲשֶׂה
  choice: 你要做
  rationale: 这是עשה的第二人称阳性单数未完成式，在连续的建造指示中具有命令或指示语气；“你要做”准确而自然。
- source_word: שִׁשָּׁה
  choice: 六
  rationale: 直接表达修饰后续名词的基数。
- source_word: קְרָשִׁים
  choice: 板
  rationale: קֶרֶשׁ指构成帐幕墙体的木质结构件。正文采用传统且易懂的“板”，同时以脚注保留“框架”这一取决于结构复原的可能译法。
