  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: zh_hans
  text: 你要用染红的公羊皮为帐幕做一层遮盖物，再用他哈示皮[a]做一层遮盖物，盖在最上面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他哈示”音译自希伯来语；这个词的确切含义不详，可能指某种动物，也可能指一种耐用的皮革。有人译作“精制皮革”“海豚皮”或“儒艮皮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做
  rationale: 在连续的建造指示中，这一形式表达命令；“你要……做”既保留指令语气，也符合现代汉语。
- source_word: מִכְסֶה
  choice: 一层罩棚
  rationale: 该名词指覆盖、保护用的覆盖层；结合帐幕多层结构，译作“一层罩棚”自然，并明确其层次。
- source_word: לָאֹהֶל
  choice: 给帐幕
  rationale: אֹהֶל本义为“帐棚、帐幕”；本段特指会幕建筑，译作“帐幕”既贴近词义，也符合上下文。
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: 染红的公羊皮
  rationale: 短语是“公羊的皮”加上表示使之变红的形式；“染红的公羊皮”准确表达经过处理着色，而非公羊本身为红色。
- source_word: וּמִכְסֵה
  choice: 再用……做一层罩棚
  rationale: 重复的名词引出第二层覆盖物；“再……一层”清楚呈现结构关系，同时不额外指定材料性质。
- source_word: עֹרֹת תְּחָשִׁים
  choice: 他哈示皮[a]
  rationale: תְּחָשִׁים所指动物或皮革种类不确定，采用音译可避免武断认定，并以脚注说明主要可能性。
- source_word: מִלְמָעְלָה
  choice: 盖在最上面
  rationale: 该表达表示处于上方；在多层罩棚的语境中，“盖在最上面”自然传达外层位置，而不添加原文没有的明示代词。
