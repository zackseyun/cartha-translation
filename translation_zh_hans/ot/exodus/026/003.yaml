translation:
  language: zh_hans
  text: 五幅幔子要彼此相连，五幅幔子也要彼此相连[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个女人对她的姊妹”。这是用于阴性名词的惯用说法，指同类物件彼此对应、相连。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: 幔子
  rationale: 在会幕建造的语境中，该词指大幅的织物覆盖物或帘幕；“幔子”既符合建筑用途，也保留经文庄重而自然的表达。
- source_word: תִּהְיֶיןָ
  choice: 要
  rationale: 未完成式在这里用于建造指示，带有规定和将来实施的语气；“要”以现代汉语自然表达这一指令性。
- source_word: חֹבְרֹת
  choice: 相连
  rationale: 该词源自 חבר，意为连接、联结；“相连”准确表达各幅幔子被接合起来的关系。
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: 彼此
  rationale: 字面为“一个女人对她的姐妹”，因所指的“幔子”在希伯来语中是阴性名词，这是表示同类物件彼此对应、连接的惯用语；译作“彼此”符合现代汉语习惯。
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: 五幅……另外五幅
  rationale: 原文将十幅幔子分成两个五幅的组；量词“幅”适合织物，“另外”清楚表达第二组，同时不改变原文数量结构。
