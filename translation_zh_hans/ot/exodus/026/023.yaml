  text: 你要为帐幕的后面两角做两块板[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要为帐幕的角部做两块板，在后面的两端。”原文所用的是较为专门的建筑用语，具体结构存在一定歧义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: 两块
  rationale: 连接词承接前文的制作清单；中文可不机械译出“和”，以自然延续指令。“二”的构造形式与“板”连用，译作“两块”。
- source_word: קְרָשִׁים
  choice: 板
  rationale: 指构成帐幕墙体的木质结构件。“板”符合本段常用建筑语汇，也避免“框架”所带来的过度解释。
- source_word: תַּעֲשֶׂה
  choice: 你要……做
  rationale: 第二人称阳性单数未完成式在此具有指令意味；“你要……做”在现代汉语中自然、明确。
- source_word: לִ/מְקֻצְעֹת
  choice: 为……两个拐角
  rationale: 该词指角部或形成角度的接合处。译作“拐角”清楚表达建筑位置，同时不武断限定为专门的“角板”。
- source_word: הַ/מִּשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中该圣所的固定称呼；“帐幕”简洁、通行，并保留其作为神居所的语境。
- source_word: בַּ/יַּרְכָתָיִם
  choice: 后面的两个拐角
  rationale: 双数形式指后部的两端或两侧；结合前面的角部用语，译文将其理解为帐幕后面的两个拐角，同时用脚注保留较技术性的另一种分析。
