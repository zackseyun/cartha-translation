  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: zh_hans
  text: 中间的横闩要在竖框[a]中间，从一端伸到另一端。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“竖板”。原文所指的是会幕中直立的结构构件；这里译作“竖框”，以免让人以为只是普通的平木板。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: 横闩
  rationale: 该词在会幕建造语境中指连接并固定竖直构件的横向长条。“横闩”既保留其固定结构的作用，也比单说“闩”更清楚地显示方向。
- source_word: הַתִּיכֹן
  choice: 中间的
  rationale: 此形容词标明这根横闩处于其他横闩之间；“中间的”自然、明确，不额外断定其内部构造。
- source_word: בְּתוֹךְ
  choice: 在……中间
  rationale: 保留原文表示位于竖框之中或其间的空间含义，不具体断定横闩是否穿过预制孔洞。
- source_word: הַקְּרָשִׁים
  choice: 竖框
  rationale: 该词在会幕记述中指直立的结构构件。“竖框”可避免“木板”使人只想到普通薄平板，同时比笼统的“框架”更能体现一个个直立构件。
- source_word: מַבְרִחַ
  choice: 伸到
  rationale: 这里的分词描述横闩横跨整个结构。“伸到”自然表达其延展范围，又不加入必然穿孔而过的机械细节。
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: 从这一端……到另一端
  rationale: 准确表达横闩跨越全长的惯用含义，符合现代汉语表达。
