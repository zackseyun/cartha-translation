base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: zh_hans
  text: 要用金子包上这些竖板[a]；又要用金子做板上的环，作为横闩的承托处[b]；横闩也要包上金子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“木板”或“框架”。原文指构成会幕骨架的直立构件。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“横闩的房屋”，指供横闩安置、容纳或承托的构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: 这些框板
  rationale: 指会幕结构中直立的构件。“框板”兼顾其板状形态和支撑框架的功能；脚注保留“木板”等译法。
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: 包裹
  rationale: 此处的皮埃勒词形表示以金子覆在构件表面；“用金子包裹”自然、明确，也保留制作工艺的含义。
- source_word: זָהָב
  choice: 金子
  rationale: 直接表示材料；原文三次出现，本译文也在三个相关分句中分别保留。
- source_word: טַבְּעֹתֵיהֶם
  choice: 框板上的环
  rationale: 指属于这些框板、供横闩穿过或套入的金属环；将代词所指明说，使现代汉语更清楚。
- source_word: תַּעֲשֶׂה
  choice: 做
  rationale: 对应常用动词“做、制造”，在制作器件的语境中简洁自然。
- source_word: בָּתִּים לַבְּרִיחִם
  choice: 用来套住横闩
  rationale: 原文直译为“横闩的房屋”，在这里说明金环作为容纳、固定横闩的承托物；功能性表达比直译更易懂，字面形象保留于脚注。
- source_word: הַבְּרִיחִם
  choice: 横闩
  rationale: 指贯穿或连接框板、使结构稳固的横向杆件；“横闩”比泛称“杆”更准确地传达其结构用途。
