  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: zh_hans
  text: 罩棚的幔子在长度上多出来的部分，就是这边一肘、那边一肘[a]，要垂在帐幕的两侧，这边和那边，遮盖帐幕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一边一肘，另一边一肘”。希伯来语在两个指示短语前都重复“一肘”，指两边各自多出的长度。
    reason: lexical_alternative
  - marker: b
    text: 本节的“罩棚”译自希伯来语ʾohel，“帐幕”译自mishkan；二者是不同的术语。
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  choice: 一肘
  rationale: אַמָּה是标准长度单位“肘”；此处有定冠词，并由上下文说明是两侧各自多出的长度。
- source_word: מִזֶּה ... מִזֶּה
  choice: 这边……那边；两侧
  rationale: 两个指示短语指相对的两边；首次照原文具体表达，后半句用自然汉语概括为“两侧”。
- source_word: בָּעֹדֵף
  choice: 多出来的部分
  rationale: 该词表示剩余或超出的量；在幔子尺寸的语境中，此译法自然且准确。
- source_word: אֹרֶךְ
  choice: 长度
  rationale: 建筑尺寸语境中的直接空间用语。
- source_word: יְרִיעֹת הָאֹהֶל
  choice: 帐幕罩棚的幔子
  rationale: יְרִיעֹת指成幅的幔子，הָאֹהֶל指上层的罩棚；这样译可与本节中的מִשְׁכָּן“帐幕”有所区分。
- source_word: יִהְיֶה סָרוּחַ
  choice: 要垂在
  rationale: 表达多余布幅向下悬垂、覆盖结构两侧的形象。
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: 帐幕的两侧
  rationale: מִשְׁכָּן是作为神圣居所的帐幕结构，复数צִדֵּי指其两侧。
- source_word: לְכַסֹּתוֹ
  choice: 遮盖帐幕
  rationale: 目的不定式表示悬垂部分的用途；将代词所指明说为“帐幕”，可避免现代汉语中的指代含混。
