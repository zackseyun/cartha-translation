base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: zh_hans
  text: 要在其中一幅幔子上做五十个环，又要在第二组相连幔子中那幅幔子的边缘上做五十个环；这些环要彼此相对[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个女人对着她的姐妹”，是希伯来语用于对应物件的习语，意思是各个环与相应的环对齐。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: 环
  rationale: 指用来连接幔子的环状附件；译作“环”简洁准确，也可与下一节的金钩区分。
- source_word: יְרִיעָה
  choice: 幔子
  rationale: 在会幕语境中指大片织物幔幅；“幔子”符合中文圣经建筑语境，也易于现代读者理解。
- source_word: הָאֶחָת
  choice: 这一幅
  rationale: 原文是“这一/一个”，用于指明彼此对应的一幅幔子；不译成“第一幅”，以免加入原文未明说的次序。
- source_word: קְצֵה
  choice: 边缘
  rationale: 表示幔子的边界；在缝制和连接的语境中，“边缘”比“末端”更自然。
- source_word: מַחְבֶּרֶת
  choice: 组相连幔子
  rationale: 本词在上下文中指已经连成一组的幔子。译文用“组相连幔子”既表达组合单位，也保留“连接”的词义。
- source_word: הַשֵּׁנִית
  choice: 第二组
  rationale: 直接保留原文“第二”的次序含义，并与上下文两组幔子相呼应。
- source_word: מַקְבִּילֹת
  choice: 彼此相对
  rationale: 表达两边的环位置相互对应、对齐的空间关系。
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: 彼此
  rationale: 这是希伯来语用于对应物件的习语，直译为“一个女人对着她的姐妹”；正文采用自然中文表达，字面意象收入脚注。
