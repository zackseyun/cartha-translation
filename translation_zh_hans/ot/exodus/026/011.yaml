  text: וְ/עָשִׂ֛יתָ קַרְסֵ֥י נְחֹ֖שֶׁת חֲמִשִּׁ֑ים וְ/הֵבֵאתָ֤ אֶת הַ/קְּרָסִים֙ בַּ/לֻּ֣לָאֹ֔ת וְ/חִבַּרְתָּ֥ אֶת הָ/אֹ֖הֶל וְ/הָיָ֥ה אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: zh_hans
  text: 你要做五十个青铜扣[a]，把这些扣子穿进环里，将帐幕连接起来，使它成为一个整体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铜扣”。希伯来语 נְחֹשֶׁת 可指铜，也可指青铜，须按语境判断。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: 青铜扣
  rationale: קַרְסִים指连接幔子边缘的扣合件；“扣”比泛指的“钩”更能体现其连接作用。נְחֹשֶׁת可指铜或青铜；正文采用会幕器具语境中较常见的“青铜”，并以脚注保留材质上的可能性。
- source_word: חֲמִשִּׁים
  choice: 五十个
  rationale: 直译基数，并用量词“个”使现代汉语自然。
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: 把这些扣子穿进环里
  rationale: 使役形态的בוא在此表示使扣子进入环中。“穿进”自然表达安装动作，同时不额外规定扣件的具体形状。
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: 将帐幕连接起来
  rationale: חבר表示连接、接合；“连接起来”保留施工动作。הָאֹהֶל在此指由覆盖物接合而成的帐幕。
- source_word: וְהָיָה אֶחָד
  choice: 使它成为一个整体
  rationale: 该分句表明连接后的结果。“一个整体”以自然汉语表达אֶחָד所强调的统一状态，没有加入原文以外的象征含义。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“青铜扣”“环”“连接起来”保持会幕建造语境的具体性；句末用“成为一个整体”清楚传达各部分接合为一的结果。
