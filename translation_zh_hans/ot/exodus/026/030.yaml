  yaml_path: translation/ot/exodus/026/030.yaml
  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: zh_hans
  text: 你要照着你在山上所看见的样式，把帐幕立起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “样式”所译的希伯来词也可指“规制”或“规定的方式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: 你要……立起来
  rationale: קום的使役式在此带指令意味，指使帐幕竖立；“立起来”自然清楚，也贴近“使之站立”的原义。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן在《出埃及记》中指神圣的会幕居所；“帐幕”是简明且沿用已久的对应词。
- source_word: כְּמִשְׁפָּטוֹ
  choice: 照着……规定样式
  rationale: מִשְׁפָּט可指判决、条例、规定方式或规范；在建造帐幕的语境中，“规定样式”既表达其规范性，也说明这里所指的是帐幕应有的构造与安排。物主后缀所指的“帐幕”在汉语中可由上下文自然领会。
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: 所看见的
  rationale: 希伯来文采用主动形式，直译为“你所看见的”。保留这一表达，不把隐含的“被指示”明说出来。
- source_word: בָּהָר
  choice: 在山上
  rationale: 介词ב在此表示地点；“在山上”符合汉语习惯及西奈山语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。语序调整为先说明依据、后陈述立起帐幕，使句子自然；同时保留希伯来文“你所看见的”这一主动表达。
