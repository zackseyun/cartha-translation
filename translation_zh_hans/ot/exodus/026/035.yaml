  source_fidelity: 正文准确呈现希伯来文的三项空间指令：桌子在幔子外，灯台与桌子相对并位于帐幕南侧，桌子位于北侧。没有将上下文中的“陈设饼桌”等信息擅自补入本节。
  naturalness: 表达符合现代标准普通话，并保留适合会幕陈设说明的庄重语体。“安放”“灯台”“幔子”“帐幕”均自然且清楚。灯台位置后的并列短语“桌子对面、帐幕的南边”可理解为两个相连的定位说明，语义明确。
  terminology: “幔子”恰当对应פָּרֹכֶת这一内层分隔帘幔；“灯台”对应מְנוֹרָה；“帐幕”对应מִשְׁכָּן。方位词“南边／北边”忠实传达原文的南、北两侧，不引入额外解释。脚注也恰当说明“帘子”这一可行替代译法及其会幕内部隔断功能。
