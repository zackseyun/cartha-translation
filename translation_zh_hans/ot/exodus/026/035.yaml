base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: zh_hans
  text: 你要把桌子安放在幔子外面[a]，把灯台安放在桌子对面、帐幕的南边；桌子要放在北边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帘子外面”。这里的希伯来语指会幕内部用来分隔空间的帘幔。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 你要……安放
  rationale: שׂים在这里指把器物放置在指定位置；“安放”自然、庄重，也符合会幕陈设的语境。
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 原文只说“桌子”，本节没有明说陈设饼，因此不把上下文中的完整名称补入正文。
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: 在幔子外面
  rationale: מִחוּץ表示“在……外面”；פָּרֹכֶת特指会幕内部分隔空间的帘幔，译作“幔子”既准确又符合中文圣经语体。
- source_word: הַמְּנֹרָה
  choice: 灯台
  rationale: מְנוֹרָה指承托灯盏的器具；“灯台”直接传达其功能，并避免不必要的音译。
- source_word: נֹכַח
  choice: 在……对面
  rationale: 该词在此表达相对、面对的位置关系；“在桌子对面”清楚呈现两件器物的布局。
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: 帐幕的南边
  rationale: צֶלַע在此指侧边，תֵּימָנָה指向南方；现代中文用“帐幕的南边”简明自然。
- source_word: וְהַשֻּׁלְחָן תִּתֵּן
  choice: 桌子要放
  rationale: נתן本义宽泛，在陈设器物的语境中表示“放置”；“要放”准确而不显生硬。
- source_word: עַל צֶלַע צָפוֹן
  choice: 在北边
  rationale: 原文与前面的“帐幕的南边”构成对应；中文可自然省去重复的“帐幕”，所指仍明确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“幔子”保留会幕语境中的专门含义；句式依照原文次序交代桌子与灯台的相对位置，并避免加入本节未明说的器物全称。
