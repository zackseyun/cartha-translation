base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: zh_hans
  text: 你要为门帘[a]做五根皂荚木柱，用金包裹它们；柱上的钩子也要用金子做。你又要为这些柱子铸造五个青铜座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帘子”或“遮帘”。这里指帐幕入口处的帘子，有别于至圣所前面的内幔。
    reason: lexical_alternative
  - marker: b
    text: 或译“铜座”或“插座”。原文指承托柱子的座。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: 门帘
  rationale: 此处指帐幕入口处悬挂的帘子，并非分隔至圣所的内幔。“门帘”既自然，也能明确其位置和用途。
- source_word: עַמּוּדֵי שִׁטִּים
  choice: 皂荚木柱
  rationale: עַמּוּדִים 指支撑帘子的柱子；שִׁטִּים 是建造帐幕所用的皂荚木。
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: 给柱子包上金
  rationale: צפה 在这种结构中指以金属包覆物件；“包上金”符合现代汉语，也保留工艺含义。
- source_word: וָוֵיהֶם
  choice: 柱上的钩子
  rationale: וָוִים 在帐幕建造语境中通常指用来悬挂帘子的钩子；补出“柱上的”使所属关系清楚。
- source_word: וְיָצַקְתָּ לָהֶם
  choice: 为柱子铸造
  rationale: יצק 在此指铸造金属器件；לָהֶם 表明这些座是为五根柱子制作的。
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: 铜座
  rationale: אַדָן 指承托柱子的座或榫座；נְחֹשֶׁת 在古代器物语境中通常指铜或铜合金，汉语以“铜”表达较自然，同时在脚注保留更具体的可能译法。
