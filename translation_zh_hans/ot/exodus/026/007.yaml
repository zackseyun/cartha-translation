  text: וְ/עָשִׂ֨יתָ֙ יְרִיעֹ֣ת עִזִּ֔ים לְ/אֹ֖הֶל עַל הַ/מִּשְׁכָּ֑ן עַשְׁתֵּי עֶשְׂרֵ֥ה יְרִיעֹ֖ת תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: zh_hans
  text: 你要用山羊毛做幔子，作为帐幕上面的罩棚[a]；共要做十一幅幔子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山羊毛”原文直译为“山羊”；这里以“山羊”指取自山羊的材料，即山羊毛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要做
  rationale: 该形式承接前文的建造指示，现代汉语用“你要”既保留直接命令，也符合庄重而自然的规章语体。
- source_word: יְרִיעֹת
  choice: 幔子
  rationale: 在会幕建造语境中指大幅织物帘片；“幔子”比“布”更准确，也与本章术语相称。
- source_word: עִזִּים
  choice: 山羊毛
  rationale: 希伯来文表面为“山羊”，这里以动物名称指其毛所制的材料；正文补出“毛”，使现代读者清楚。
- source_word: לְאֹהֶל
  choice: 作为……罩棚
  rationale: 介词לְ在此表示用途或结果，说明这些幔子构成覆盖会幕的帐棚；“罩棚”能自然表达其外覆功能。
- source_word: עַל הַמִּשְׁכָּן
  choice: 帐幕上面的
  rationale: עַל表示位于其上；מִשְׁכָּן是本段圣所结构的专门称呼，译作“帐幕”既通俗又保留固定术语。
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: 共要做十一幅幔子
  rationale: 保留明确总数，并用量词“幅”自然对应大型织物；“共”传达后半句对数量的归总说明。
theological_decisions: []
