  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קֶ֔רֶשׁ לִ/פְאַ֖ת נֶ֥גְבָּ/ה תֵימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/018.yaml
  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
translation:
  language: zh_hans
  text: 你要为帐幕制作竖板[a]：南边，就是朝南的那一面，要做二十块。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竖板”或译“框架”；希伯来语所指的是帐幕的直立结构构件，其确切形制可以有不同理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……制作
  rationale: 该形式在连续的建造指示中表达命令；“你要……制作”既保留指令语气，也符合现代汉语表达。
- source_word: הַקְּרָשִׁים
  choice: 竖板
  rationale: קֶרֶשׁ 指帐幕的直立结构构件。“竖板”具体而自然，并表明其结构用途；由于构件的确切形制仍有讨论，以脚注保留“框架”这一译法。
- source_word: לַמִּשְׁכָּן
  choice: 为帐幕
  rationale: מִשְׁכָּן 在《出埃及记》的语境中指圣所建筑；“帐幕”是现代中文中准确且通行的译法。
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: 二十块
  rationale: 希伯来语在数词后使用单数名词；中文按自然量词结构译作“二十块”，所指的“竖板”由前文明确。
- source_word: לִפְאַת
  choice: ……边／……一面
  rationale: פֵאָה 在建筑空间描述中表示一边或一面；中文用“南边……那一面”自然表达这一方位。
- source_word: נֶגְבָּה תֵימָנָה
  choice: 南边，就是朝南的那一面
  rationale: 原文连用两个指向南方的词。此译法不将其压缩成单一的“南面”，同时以同位说明避免生硬重复。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的指令体。“南边，就是朝南的那一面”保留原文两个南向词语所形成的强调和说明关系；量词“块”与“竖板”搭配自然。
