  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: zh_hans
  text: 每块板要有两个彼此相接的榫头[a]；帐幕所有的板都要这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文按字面可译为：“每块板有两只手，彼此相接，一个女人对她的姊妹。”这里的“手”指板上伸出的接合部件，所以译作“榫头”；“一个女人对她的姊妹”是表示同类事物彼此对应的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: 榫头
  rationale: 本义为“手”，但在此木构件的语境中指板底伸出、可嵌入座中的接合部件；“榫头”是现代汉语中清楚而准确的对应词。
- source_word: מְשֻׁלָּבֹת
  choice: 相接
  rationale: 该被动分词表示两个凸出的构件彼此接合或配合；“相接”保留结构关系，同时不额外断定具体接合方式。
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: 彼此
  rationale: 原文直译为“一个女人对着她的姊妹”，是表示同类事物相互对应的希伯来语习语；译作“彼此”自然地传达其关系。
- source_word: קֶרֶשׁ
  choice: 板
  rationale: 指会幕直立的木质结构构件；“板”简明，并避免用“框架”过度解释其形制。
- source_word: מִשְׁכָּן
  choice: 帐幕
  rationale: 该词本义与“居所”有关，在《出埃及记》的语境中专指可移动的神圣居所；“帐幕”是清楚且通行的中文名称。
- source_word: כֵּן תַּעֲשֶׂה
  choice: 都要这样做
  rationale: 表达应按同一方式制作其余各板的指令；此译法在现代汉语中自然，并保留命令语气。
- source_word: שְׁתֵּי
  choice: 两个
  rationale: 直接译出修饰榫头的数词。
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: 每块板
  rationale: 形式上是“给这一块板”，结合后半句“所有的板”，具有逐一分配的含义；“每块板”自然地表达这一点。
