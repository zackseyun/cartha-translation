  text: וְ/נָתַתָּ֙ אֶת הַ/כַּפֹּ֔רֶת עַ֖ל אֲר֣וֹן הָ/עֵדֻ֑ת בְּ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: zh_hans
  text: 要把施恩盖[a]安放在至圣所里的见证柜[b]上[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “施恩盖”或译“赎罪盖”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“见证之柜”；传统常称“约柜”。
    reason: alternative_reading
  - marker: c
    text: “至圣所”直译“圣中之圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: 要把……安放
  rationale: 带连接词的第二人称阳性单数完成式在连续的指示中表达命令；“要把……安放”自然、庄重，并准确传达摆放圣所器物的动作。
- source_word: הַכַּפֹּרֶת
  choice: 施恩盖
  rationale: 该词指柜上的盖，并与赎罪礼仪相关。“施恩盖”沿用中文圣经中较易辨认的专名，同时保留“盖”这一器物性质；“赎罪盖”作为更透明的备选译法列入脚注。
- source_word: עַל
  choice: 在……上
  rationale: 该介词表明盖被放置于柜的上面；现代汉语用“在……上”最清楚自然。
- source_word: אֲרוֹן הָעֵדֻת
  choice: 见证柜
  rationale: 希伯来文明确为“见证之柜”，并非“约柜”。“见证柜”既贴近原文，也比“见证的柜”更符合现代汉语复合名词习惯。
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: 在至圣所里
  rationale: 原文是以重复名词表达最高级的希伯来语结构，指会幕最里面的圣所。“至圣所”是清楚、简洁且广为理解的现代中文名称。
theological_decisions:
- issue: כַּפֹּרֶת 应采用传统名称还是功能性译名
  choice: 正文用“施恩盖”
  alternative: “赎罪盖”
  rationale: “施恩盖”兼顾中文读者的辨识度与器物含义，但不把该词的赎罪关联完全等同于某一种神学解释；较直接反映礼仪功能的“赎罪盖”保留在脚注中。
- issue: 是否把 אֲרוֹן הָעֵדֻת 传统化为“约柜”
  choice: 译作“见证柜”
  alternative: “约柜”
  rationale: 原文明确说“见证”，因此正文保持原文措辞，不以相关但不同的“约”加以调和；脚注说明传统称法，便于读者辨认。
- issue: קֹדֶשׁ הַקֳּדָשִׁים 的表达方式
  choice: 译作“至圣所”
  alternative: “圣中之圣”
  rationale: “至圣所”自然传达希伯来语最高级结构及其空间所指；较字面的表达保留在脚注中，以展示原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述语体。“要把……安放”延续本段建造指示的命令语气；将地点短语前置于“见证柜上”之前，避免误读，并使中文语序自然。所有术语优先依据WLC希伯来文本，同时以脚注保留重要的传统或较字面译法。
