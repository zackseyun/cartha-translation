  yaml_path: translation/ot/exodus/026/025.yaml
  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: zh_hans
  text: 要有八块竖板[a]，连同它们的银底座，共十六个底座[b]；每块竖板下面各有两个底座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竖板”或译“框架”。
    reason: lexical_alternative
  - marker: b
    text: “底座”或译“卯座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  choice: 竖板
  rationale: 该词在会幕建造语境中指直立的结构构件。“竖板”既贴近其板状含义，也自然表达其直立承重的用途；其具体形制可能理解为木板或框架，因此以脚注保留另一译法。
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: 底座
  rationale: 该词指承托竖板的下部构件。“底座”是现代汉语中清楚、通行的建筑用语；“卯座”更强调其承接或嵌合功能，列为脚注中的可选译法。
- source_word: כֶּסֶף
  choice: 银
  rationale: 直接表达底座的材质。
- source_word: שִׁשָּׁה עָשָׂר
  choice: 十六个
  rationale: 按现代汉语表达基数，并配合“底座”的量词。
- source_word: תַּחַת
  choice: 下面
  rationale: 自然、准确地表达这些底座位于竖板下方的空间关系。
- source_word: הַקֶּרֶשׁ הָאֶחָד ... הַקֶּרֶשׁ הָאֶחָד
  choice: 每块竖板
  rationale: 希伯来文重复“这一块板”形成逐一分配的表述，说明每块板各配两个底座。译作“每块竖板……各”在现代汉语中简洁自然，也避免让人误以为这里只说八块板中的两块。
- source_word: וְהָיוּ
  choice: 要有
  rationale: 在建造规格和数量清单中，“要有”自然表达规定或预定的数量，并承接上下文。
