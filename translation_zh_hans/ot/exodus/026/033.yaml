base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: zh_hans
  text: 你要把幔子挂在扣钩下方，再把见证之柜[a]带到幔子内；这幔子要为你们把圣所和至圣所[b]分隔开来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约柜”。这里的希伯来原文是“见证”。
    reason: lexical_alternative
  - marker: b
    text: 直译“圣中之圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: 幔子
  rationale: 指隔开会幕内层空间的垂挂遮屏。“幔子”既符合礼仪空间语境，也比单说“帘子”更庄重明确。
- source_word: קְרָסִים
  choice: 扣钩
  rationale: 指连接会幕幔幅的扣合部件。“扣钩”保留其连接、固定的功能，同时不武断指定现代机械结构。
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: 幔子里面
  rationale: 该短语表示幔子内侧的空间；此译法自然地传达方位，不把介词结构误解为移动的起点。
- source_word: אֲרוֹן הָעֵדוּת
  choice: 见证之柜
  rationale: 原文明确使用“见证”，并非“约”；因此正文保留原词，避免按传统称谓将其协调为“约柜”。
- source_word: וְהִבְדִּילָה
  choice: 分隔开来
  rationale: 使役词形表达幔子造成空间区隔的作用；“分隔开来”在现代汉语中自然清楚。
- source_word: לָכֶם
  choice: 为你们
  rationale: 保留原文的与格代词，表明这一区隔是为以色列人的敬拜安排而设。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 在本节中指幔子外侧的神圣空间，与内侧的至圣空间相对。
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: 至圣所
  rationale: 希伯来语直译为“圣中之圣”，是表达最高级的结构；“至圣所”以简洁、通行的现代汉语传达其含义。
theological_decisions:
- issue: 内层圣所传统礼仪称谓的译法
  choice: 至圣所
  alternative: 圣中之圣
  rationale: 正文采用自然且通行的“至圣所”，同时以脚注交代希伯来语的字面结构，既保持可读性，也不掩盖原文表达。
- issue: 柜名称中的 עֵדוּת
  choice: 见证之柜
  alternative: 约柜
  rationale: 本节原文使用“见证”而非“约”。正文依从原文措辞，脚注说明常见的传统称呼，不将两者无声等同。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留第二人称单数命令“你”，以及复数受益对象“你们”；用“幔子”“圣所”“至圣所”维持会幕语境中的术语一致性。
