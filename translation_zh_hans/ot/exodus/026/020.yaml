  yaml_path: translation/ot/exodus/026/020.yaml
  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: zh_hans
  text: 帐幕的第二面，就是北面，要做二十块竖板。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“框架”。希伯来语这个词可指构成帐幕墙面的直立结构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: 帐幕的……面
  rationale: צֶלַע在帐幕建筑语境中指侧面或侧墙；汉语用“面”简洁自然，也与前后建筑说明衔接。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן在《出埃及记》中是神圣居所的常用称谓；“帐幕”是准确且通行的现代中文译法。
- source_word: הַשֵּׁנִית
  choice: 第二面
  rationale: 原文明确使用序数“第二”，承接上一节所述的第一长边，不改译为较含混的“另一面”。
- source_word: לִפְאַת צָפוֹן
  choice: 就是北面
  rationale: 该短语说明方位；“就是北面”在中文中自然地将“第二面”与北侧对应起来。
- source_word: עֶשְׂרִים קָרֶשׁ
  choice: 二十块竖板
  rationale: 数词直译为“二十”；קֶרֶשׁ指构成帐幕墙面的直立结构件，“竖板”既保留其板材含义，也表明其结构方向。
