base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: zh_hans
  text: 它们要在下端彼此相配[a]，在上端一同齐整[b]，直到那一个环[c]；两块板都要这样；它们是给两个角用的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼此相配”也可译作“成对”或“配成一对”；希伯来语表示两块板形成相配的一对。
    reason: lexical_alternative
  - marker: b
    text: “齐整”也可译作“完整”或“严密接合”；这里所说的是结构上的完整，并非道德上的完全。
    reason: lexical_alternative
  - marker: c
    text: “那一个环”也可译作“一个环”或“第一个环”；原文可能指两块板在顶端借以连接的环。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: 成对
  rationale: 该词表示两块板配成一对；“成对”既贴近原文，也符合现代汉语的建筑描述。
- source_word: מִלְּמַטָּה
  choice: 从下端
  rationale: 保留介词“从”的方向感，同时用“下端”明确所指是板的下部。
- source_word: וְיַחְדָּו
  choice: 合在一起
  rationale: 原文强调两块板共同结合；此译法比单说“一起”更适合构造语境。
- source_word: תַמִּים
  choice: 成为完整的一体
  rationale: 这里指结构上的完整、合拢，并非道德上的完全；译文保留完整性的含义，但不武断说明具体木工方式。
- source_word: עַל רֹאשׁוֹ
  choice: 在顶端
  rationale: רֹאשׁ在此指构件的上端；汉语建筑语境中译作“顶端”自然清楚。原文单数后缀可理解为对成对结构的整体指称。
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: 直到同一个环
  rationale: “同一个环”保留数词“一”及两块板汇合于一环的可能含义；“第一个环”虽也可能，但会把次序含义确定下来。
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: 两块板都要这样
  rationale: 结合上下文明确复数指两块板，使中文简洁自然。
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: 分别用在两个角上
  rationale: מִקְצֹעֹת可指角或角接合处；正文采用普通读者易懂的“两个角”，而“分别”自然表达两块板对应两个角。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的说明性语言。“板”在第二句明说，以避免代词所指含混；第一句仍用“它们”承接上文。译文不具体断定板材如何加工，也不把 הָאֶחָת 的次序义绝对化。
