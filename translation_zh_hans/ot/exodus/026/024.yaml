revisions:
- from: 它们要从下端成对[a]，在顶端合在一起，成为完整的一体[b]，直到同一个环[c]。两块板都要这样，分别用在两个角上。
  to: 它们要在下端彼此相配[a]，在上端一同齐整[b]，直到那一个环[c]；两块板都要这样；它们是给两个角用的。
  rationale: 修改避免将构件的结构完整解释为“成为一体”，并以“那一个环”保留原文冠词加数词在具体所指或次序上的不确定性。末句维持原文“为两个角”的简洁功能性表述，不额外限定角的方位。
