base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: zh_hans
  text: 你要把幔子挂在四根包金的皂荚木柱子上；柱上的钩子要用金子做，四根柱子要立在四个银座[a]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银座”也可译作“银制的柱脚承窝”。
    reason: אֶדֶן既可概括为承托柱子的“座”，也可较具体地理解为让柱脚嵌入的“承窝”；正文采用较自然简洁的说法，脚注保留构造层面的词义。
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: 你要把幔子挂
  rationale: נתן本义范围较广，可指“放、安置”；这里宾语是上一节所说的幔子，且幔子安置在柱子上，按具体动作译为“挂”最自然。“幔子”明确承接阴性单数代词“它”。
- source_word: עַל אַרְבָּעָה עַמּוּדֵי שִׁטִּים
  choice: 在四根皂荚木柱子上
  rationale: עַמּוּד指直立的支撑构件，译作“柱子”；שִׁטִּים在此指制作柱子的皂荚木材。
- source_word: מְצֻפִּים זָהָב
  choice: 包金的
  rationale: צפה的被动分词表示表面以金覆盖；“包金”简洁准确，也符合会幕器具的制作语境。
- source_word: וָוֵיהֶם זָהָב
  choice: 柱上的钩子要用金子做
  rationale: וָוִים在这里指用于悬挂幔子的钩子；补出“柱上的”和“要用……做”，使所属关系与材料说明在现代汉语中清楚自然。
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: 四根柱子要立在四个银座上
  rationale: אֶדֶן指承托柱子的座或承窝。“银座”简明并保留会幕构件的传统称法；补出“四根柱子要立”，明确希伯来语省略而由结构关系表达的内容。
