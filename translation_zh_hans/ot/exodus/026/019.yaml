base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: zh_hans
  text: 你要在这二十块竖板[b]下面做四十个银座[a]：每块竖板下面各有两个座，对应它的两个榫头[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银座”也可译作“银槽座”；原文所指的是会幕竖板下面兼具支撑和插接作用的构件。
    reason: lexical_alternative
  - marker: b
    text: “竖板”传统上也译作“板”；原文指会幕直立的结构构件。
    reason: lexical_alternative
  - marker: c
    text: “榫头”原文直译为“手”，这里是建筑用语，指竖板上伸出、插入座中的接合部。
    reason: lexical_clarification
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: 银座
  rationale: אֶדֶן在会幕建造语境中指支撑竖板、并容纳榫头的座或槽座。“银座”简洁自然，也保留其承重构件的性质。
- source_word: תַּעֲשֶׂה
  choice: 你要……做
  rationale: עשה的第二人称阳性单数未完成式在本段指示性话语中表达命令；“你要……做”符合现代汉语的庄重指令语气。
- source_word: תַּחַת
  choice: 下面
  rationale: 该介词直接表示位于竖板之下；“下面”清楚、自然。
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: 竖板
  rationale: קֶרֶשׁ指会幕直立的结构构件。“竖板”既表现其形态和方向，也比笼统的“框架”更便于普通读者理解。
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: 分别承接它的两个榫头
  rationale: יָדוֹת字面为“两只手”，在此是木构件上伸出的接合部。“榫头”是准确而易懂的木工术语；“分别承接”明确两个座与两个榫头的对应关系。
- source_word: הָאֶחָד ... הָאֶחָד
  choice: 一块竖板……另一块竖板
  rationale: 希伯来文重复“这一块”，在这里具有逐块分配的作用；现代汉语用“一块……另一块”自然表达相同的连续分配关系。
theological_decisions: []
