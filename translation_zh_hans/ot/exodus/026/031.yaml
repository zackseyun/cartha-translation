source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ פָרֹ֗כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב יַעֲשֶׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: zh_hans
  text: 你要用蓝色线[a]、紫色线、朱红色线[b]和捻成的细麻做一幅幔子[c]；要按巧匠的工艺[d]织上基路伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓝色”也可能指蓝紫色；原词指用贵重染料染成的织料颜色。
    reason: lexical_alternative
  - marker: b
    text: 原文的“朱红色”更具体指朱红色染成的材料；这种染料传统上与取自介壳虫类的染料有关。
    reason: cultural_note
  - marker: c
    text: 或译“帘幕”。这里指会幕内分隔圣所和至圣所的悬挂织物。
    reason: lexical_alternative
  - marker: d
    text: 或译“精巧织成”或“按巧匠的设计制作”。原文强调富有设计性、技艺精湛的工艺，并未严格限定为某一种现代织绣技法。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: 幔子
  rationale: 指会幕内部用于分隔圣所与至圣所的悬挂织物。“幔子”既符合具体用途，也保留礼仪空间中的庄重语体。
- source_word: תְּכֵלֶת
  choice: 蓝色线
  rationale: 该词指贵重染料所染成的蓝色或蓝紫色织料；上下文列举纺织材料，因此以“蓝色线”自然表达其材料含义，同时在脚注保留色调的不确定性。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 这是会幕材料清单中常见的贵重紫色染料或染色织料；“紫色线”与并列材料协调。
- source_word: תוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该组合词指染成鲜红或朱红色的材料，染料传统上与介壳虫类有关；正文采用现代读者易懂的纺织表达。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻的细麻
  rationale: שֵׁשׁ 指细麻，מָשְׁזָר 表示经过搓捻；译文保留材料和加工方式两方面。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧匠的手艺
  rationale: 该短语强调具有设计性和艺术性的熟练工艺，但未明确限定为现代意义上的刺绣，因此采用较宽泛而准确的表达。
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: 做……并……织在上面
  rationale: 希伯来文由第二人称指令转为第三人称单数的制作表述，可作非特指工匠的施工指示；中文按自然指令语序表达，不强行指定人物。
- source_word: כְּרֻבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指幔子图案中的天上活物，不把它简化为后世艺术中的小天使形象。
theological_decisions:
- issue: 如何处理会幕礼仪和工艺用语而不加入后来的象征解释
  choice: 按本节直接语境译为会幕幔子的材料与制作指示
  alternative: 在正文中突出幔子或基路伯在后续经文及神学传统中的象征意义
  rationale: 本节本身只规定幔子的制作、材料和图案；译文不应把后来的神学关联提前写入正文。
- issue: 基路伯是实体装饰、刺绣还是织造图案
  choice: 译为“把基路伯织在上面”，表示其形象构成幔子工艺的一部分
  alternative: 译为“上面有基路伯”或“绣上基路伯”
  rationale: 上下文和工艺短语支持织入图案，但原文未明确采用现代技术分类中的“刺绣”，故避免过度限定。
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“幔子”保持礼仪建筑语境，“巧匠的手艺”避免生硬直译，也不把工艺过度限定为刺绣。各颜色后补出“线”，使中文材料清单清楚自然。
