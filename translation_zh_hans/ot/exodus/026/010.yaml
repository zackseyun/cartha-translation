base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: zh_hans
  text: 要在一组相连幔子中最外边那幅幔子的边缘上做五十个钮环；也要在第二组相连幔子中那幅幔子的边缘上做五十个钮环。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在连接的一组中”。希伯来语指若干幅幔子连接后形成的一组。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 要……做
  rationale: 该形式在连续的建造指示中表达命令；用“要……做”自然传达指令语气。
- source_word: לֻלָאֹת
  choice: 钮环
  rationale: 指幔子边缘用于连接的布环；“钮环”简明，并符合会幕制作语境。
- source_word: שְׂפַת
  choice: 边缘
  rationale: 本义为“唇”，用于布料时译作“边缘”最自然。
- source_word: הַיְרִיעָה
  choice: 幔子
  rationale: 在会幕语境中指大型织物幅片；“幔子”庄重、通行，也能与上下文衔接。
- source_word: הָאֶחָת
  choice: 那幅
  rationale: 希伯来文直指“一幅”，并非明确说“第一幅”；中文用“那幅”保留指称作用，避免误加序数。
- source_word: הַקִּיצֹנָה
  choice: 最外边
  rationale: 表示位于尽头或外缘的位置；“最外边”清楚说明该幅幔子在整组中的位置。
- source_word: בַּחֹבָרֶת
  choice: 在相连的一组幔子中
  rationale: 该词指由若干幔子连接形成的组合单位；此译法兼顾构造含义和现代中文可读性。
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: 第二组相接的那幅幔子
  rationale: 保留“第二”的序数关系，并把相关的连接含义表达为“相接”，使两组幔子的对应关系清楚，同时不额外重复原文未再出现的“最外边”。
theological_decisions: []
