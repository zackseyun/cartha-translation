  yaml_path: translation/ot/exodus/026/027.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: zh_hans
  text: 又要为会幕第二面的木板做五根横闩，也要为会幕西面后部的木板做五根横闩。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְרִיחִם
  choice: 横闩
  rationale: 这里指横向贯穿或连接会幕木板、使其稳固的杆件；“横闩”既准确表达其构造作用，也比泛称“杆”更明确。
- source_word: קַרְשֵׁי
  choice: 木板
  rationale: קֶרֶשׁ在会幕建造语境中指构成墙体的木质结构板件；“木板”自然清楚，并避免“框架”可能带来的过度解释。
- source_word: צֶלַע
  choice: 面
  rationale: 该词在建筑描述中指侧面；中文用“面”与“第二面”搭配自然，也能表示会幕相对的侧边。
- source_word: הַשֵּׁנִית
  choice: 第二面
  rationale: 直译为“第二”，承接上一节所说的一面；保留原文次序表达，同时以脚注说明也可按语境理解为“另一面”。
- source_word: הַמִּשְׁכָּן
  choice: 会幕
  rationale: מִשְׁכָּן本义与“居所”有关，但在《出埃及记》的建造语境中是这座圣所帐幕的固定称谓；“会幕”是现代中文圣经语境中清楚而通行的表达。
- source_word: לַיַּרְכָתַיִם
  choice: 后面
  rationale: 该词指最里面、末端或后部；在会幕方位描述中译作“后面”简明准确。
- source_word: יָמָּה
  choice: 朝西
  rationale: 这是表示向海、即向西的方向副词；“朝西”符合中文建筑方位表达。
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: 五根……五根
  rationale: 保留两组各五根的并列结构；中文以“又要……也要……”自然呈现希伯来文重复连接词所形成的清单式语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且便于普通读者理解的建造说明语体。“横闩”“木板”等词保持具体，不对会幕构件作超出原文的技术性重构；脚注保留“第二面”的字面表达与“另一面”的语境理解。
