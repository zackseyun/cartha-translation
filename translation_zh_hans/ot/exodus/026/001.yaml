base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: zh_hans
  text: 你要用十幅幔子做帐幕；幔子要用捻制的细麻线、蓝色线、紫色线和朱红色线制成，并要以巧匠的手艺[a]在上面织出基路伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把基路伯巧妙地织在幔子上。”希伯来语“巧匠的手艺”强调经过设计的艺术性织造工艺。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 该词在这里特指以色列人敬拜所用的神圣居所；“帐幕”是现代中文圣经语境中清楚、庄重且较为通行的专门称呼。
- source_word: יְרִיעֹת
  choice: 幔子
  rationale: 指构成帐幕的大幅织物；“幔子”既体现其悬挂、覆盖的用途，也符合本段建筑与织物语境。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻制的细麻线
  rationale: שֵׁשׁ指细麻，מָשְׁזָר强调线经过搓捻；译文同时交代材质及制作方式。
- source_word: תְּכֵלֶת
  choice: 蓝色线
  rationale: 这是帐幕材料中固定出现的染色织线名称；结合上下文补出“线”，使中文材料清单自然明确。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 指紫色染制的织物材料；在本节并列材料中译作“紫色线”最为清楚。
- source_word: תֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该词组指朱红或猩红色染料所染的线材；“朱红色线”保留传统色彩概念并明确纺织语境。
- source_word: כְּרֻבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，保留其作为特殊天上活物的专门名称，避免用普通“天使”取代。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 以巧匠设计的手艺
  rationale: 该短语强调经过构思的艺术性织造工艺，不只是一般手工；此译法兼顾设计与熟练制作两层含义。
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: 你要……做
  rationale: 直接表达希伯来文指令语气；中文无需机械保留句首连接词，也能自然承接前文。
- source_word: אֹתָם
  choice: 在上面
  rationale: 希伯来文阳性复数宾语回指十幅幔子；中文结合“织出基路伯”改用处所表达，使指代清楚而不生硬。
