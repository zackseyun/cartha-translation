  text: The length of each frame shall be ten cubits[a], and the width of each frame one and a half cubits.
translation:
  language: zh_hans
  text: 每块板[a]长十肘，宽一肘半。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “板”也可译作“框架”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶשׁ
  choice: 框架
  rationale: 在会幕建造的语境中，此词指竖立并承担结构作用的构件；“框架”能体现其功能，又不把具体形制说得过细。传统上也常译作“板”。
- source_word: עֶשֶׂר אַמּוֹת
  choice: 十肘
  rationale: 直接保留古代长度单位“肘”，准确呈现原文数值，不作不确定的现代单位换算。
- source_word: אֹרֶךְ
  choice: 长
  rationale: 在说明构件尺寸时，“长”是现代汉语最自然、简洁的表达。
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: 一肘半
  rationale: 自然地表达原文“一肘加半肘”的准确数值。
- source_word: רֹחַב
  choice: 宽
  rationale: 在尺寸说明中，“宽”是清楚自然的现代汉语对应词。
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: 每块框架
  rationale: 原文以带冠词的单数名词和“一”指明单个构件的尺寸；“每块框架”自然传达其逐一适用的分配意义。
