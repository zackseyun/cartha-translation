  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: zh_hans
  text: 每幅幔子[a]长三十肘，宽四肘；十一幅幔子的尺寸都相同[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译作“那一幅幔子”；这里是逐一分配的说法，意思是每一幅幔子。
    reason: lexical_alternative
  - marker: b
    text: 原文直译作“一个量度”，强调十一幅幔子的尺寸完全一致。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: 长
  rationale: 与רֹחַב（“宽”）相对，用现代汉语尺寸表达中的“长”最自然。
- source_word: יְרִיעָה
  choice: 幔子
  rationale: 在会幕语境中指大型织物覆盖片；“幔子”既符合传统建筑织物语境，也比“布片”更庄重。
- source_word: הָאַחַת / הָאֶחָת
  choice: 每幅
  rationale: 原文直译为“那一幅”，在逐一说明尺寸的语境中具有分配义；汉语用“每幅”准确自然。
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: 三十肘
  rationale: 保留原文古代长度单位אַמָּה，以“肘”表达，不擅自换算为现代单位。
- source_word: רֹחַב
  choice: 宽
  rationale: 与“长”配对，是现代汉语中最清楚的尺寸用语。
- source_word: אַרְבַּע בָּאַמָּה
  choice: 四肘
  rationale: 忠实保留原文数值和长度单位。
- source_word: מִדָּה אַחַת
  choice: 尺寸都相同
  rationale: 原文直译为“一个量度”，其语用重点是十一幅幔子的规格一致；此译法在汉语中清楚自然。
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: 十一幅幔子
  rationale: 该短语指统一尺寸所适用的整组十一幅幔子；汉语据句法自然处理为该分句的主题。
