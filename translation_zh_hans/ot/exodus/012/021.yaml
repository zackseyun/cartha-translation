base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: zh_hans
  text: 于是，摩西召来以色列所有的长老，对他们说：“你们要按各家，为自己牵出并取来羊群中的牲畜，宰杀逾越节的祭牲。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逾越节的祭牲”原文直译为“逾越”；这里指为逾越节宰杀的牲畜，可以是绵羊或山羊（参12:5）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: 在此表示摩西召集长老前来听取指示；“召来”自然地传达了召集含义。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列所有的长老
  rationale: 忠实表达 כָל 与标准的领袖称谓，指以色列民中公认的长老。
- source_word: מִשְׁכוּ
  choice: 牵出
  rationale: 保留 משך“拉、牵”的具体动作；在本语境中指从羊群中牵出牲畜，同时不把它仅解释为抽象的“挑选”。
- source_word: וּקְחוּ לָכֶם
  choice: 为自己取来
  rationale: 保留“取”这一独立命令，并体现 לָכֶם 的受益或反身意味。
- source_word: צֹאן
  choice: 羊群中的牲畜
  rationale: צֹאן 是集合名词，可包括绵羊和山羊；此译法避免缩窄为“羊羔”，也与出埃及记12:5相符。
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: 按着各家
  rationale: 表达按家族或家庭单位采取行动；“各家”在现代汉语中自然，也符合本章按家室预备祭牲的语境。
- source_word: וְשַׁחֲטוּ
  choice: 宰杀
  rationale: 准确表达宰杀牲畜的动作，并适合祭祀语境。
- source_word: הַפָּסַח
  choice: 逾越节的祭牲
  rationale: 原文直译为“逾越”，此处借代被宰杀的逾越节祭牲；“祭牲”既明确所指，又不误限定为羊羔。
theological_decisions:
- issue: הַפָּסַח 的所指
  choice: 逾越节的祭牲
  alternative: 逾越节；逾越节的羊羔
  rationale: 此处动词“宰杀”表明该词借代祭牲。由于本章12:5容许从绵羊或山羊中取用，译作“祭牲”比“羊羔”更能保留原文范围。
- issue: צֹאן 所含牲畜的范围
  choice: 羊群中的牲畜
  alternative: 羊；羊羔；小型牲畜
  rationale: 该词可统指绵羊和山羊。译文保留集合性和牧群背景，不以传统称呼消除原文的词义宽度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“牵出……取来”保留原文两个并列命令；“羊群中的牲畜”虽略具解释性，但自然呈现 צֹאן 的集合意义及 מִשְׁכוּ 所暗示的牵出动作。脚注标记置于相关短语之后。
