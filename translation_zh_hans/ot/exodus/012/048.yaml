source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: zh_hans
  text: 如果有寄居者住在你们中间，要向耶和华守逾越节，他所属的每一男子都必须受割礼；然后他才可以近前来守这节，他就像本地人一样。但任何未受割礼的人都不可吃其中的食物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文末句直译为“不可吃它”；“它”指逾越节礼仪中可吃的部分。
    reason: clarification
lexical_decisions:
- source_word: גֵּר
  choice: 寄居者
  rationale: 指居住在以色列人中间的非本地人，而非短暂停留的旅客；“寄居者”保留其律法和群体语境中的身份含义。
- source_word: יָגוּר אִתְּךָ
  choice: 住在你们中间
  rationale: גור表示以外来者身份长期居住；这里的单数“你”具有群体指向，现代汉语用“你们中间”更自然清楚。
- source_word: וְעָשָׂה פֶסַח
  choice: 要……守逾越节
  rationale: 字面为“行／举行逾越节”；“守逾越节”是自然的礼仪表达。“要”按条件句中的意愿或打算理解，但不额外加入“想要”。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: ל表示这项礼仪所归向的对象；“向耶和华守逾越节”保留方向与奉献含义，并将神名直接译为“耶和华”。
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: 他所有的男子都必须受割礼
  rationale: 该结构表达强制性的礼仪要求；“他所有的男子”保留所属范围，但不擅自限定为家庭成员。
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: 然后他才可以近前来守这节
  rationale: קרב在此不只是空间上的靠近，也表示获准参与；“才可以”清楚表达割礼是参与的先决条件。
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: 像本地人一样
  rationale: אֶזְרָח指本地出生或本地群体中的成员；简洁译法保留法律和社会身份上的比较。
- source_word: עָרֵל
  choice: 未受割礼的人
  rationale: 阳性单数形容词在此作名词，表述一般性的排除原则；译作“人”不把经文扩展成对女性另立割礼要求。
- source_word: לֹא יֹאכַל בּוֹ
  choice: 都不可吃逾越节的祭物
  rationale: 否定式表达禁止或无资格参与；בּוֹ的所指是逾越节礼仪中的可食之物，明译为“逾越节的祭物”可避免汉语中“吃这节”的歧义。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 直接保留专名而不以“主”替代；“耶和华”是现代简体中文读者最熟悉且庄重的传统形式。原文元音传统与历史读音问题不在正文中强行裁定。
- issue: 寄居者参与逾越节的资格
  choice: 在其所有男子受割礼后可以参与，并在此事上像本地人一样
  alternative: 将本节理解为单纯的族群排斥，或理解为取消一切盟约界限
  rationale: 希伯来文同时呈现有条件的接纳与明确的礼仪界限；译文保留这两方面，不导入后来的神学体系。
- issue: “像本地人一样”的范围
  choice: 保持原文的简短比较，不扩写其法律范围
  alternative: 解释为在所有社会、民族或盟约权利上完全相同
  rationale: 紧邻语境是逾越节参与资格；正文不把比较范围扩大到经文未明说的领域。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“寄居者”“受割礼”“逾越节”等保留圣经法律语境中的关键术语；避免生硬直译“做逾越节”，也不加入原文没有明说的后世教义结论。
