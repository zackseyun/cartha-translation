  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: zh_hans
  text: 你们把羊群和牛群都带走，照你们所说的去吧；也要为我祝福。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “也要为我祝福”或可译作“也祝福我”。法老的话可能强调：以色列人离开时，他自己也寻求祝福。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: 羊群和牛群都
  rationale: 两个 גַּם 配合使用，强调两类牲畜全都包括在内；“羊群和牛群都”在现代汉语中自然地保留这一成对强调。צֹאן 泛指绵羊、山羊等小牲畜，בָּקָר 指牛类大牲畜。
- source_word: קְחוּ
  choice: 带走
  rationale: 该复数命令式本义为“拿、取”；在法老准许以色列人携牲畜离开的语境中，“带走”比单说“拿”更符合现代汉语。
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: 照自己所说的
  rationale: 保留比较、依照之意，并明确回指摩西和亚伦先前提出的要求。
- source_word: וָלֵכוּ
  choice: 走吧
  rationale: הלך 在此是命令他们离去；“走吧”直接自然，也传达法老准许并催促他们离开的语气。
- source_word: וּבֵרַכְתֶּם
  choice: 也要……祝福
  rationale: ברך 的 Piel 形式在此直译为“祝福”，不进一步规定这是代求、求神赐福，还是临别祝愿。
- source_word: גַּם אֹתִי
  choice: 也要为我
  rationale: 句末 גַּם 将法老本人也纳入祝福对象；“也要为我祝福”符合现代汉语语序，同时保留附加强调。
theological_decisions:
- issue: 法老请求祝福的性质
  choice: 直译为“为我祝福”，不具体说明祝福的方式或含义
  alternative: 译作“也要为我求福”或“也要向我祝福告别”
  rationale: 原文 ברך 清楚表达“祝福”，但未明说法老是请求摩西、亚伦向上帝代求，还是请求临别祝愿。正文保留这种神学与叙事上的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“羊群和牛群”兼顾原文两类牲畜的集体含义；分句“走吧”保留命令的直接力度。脚注标记置于整句末，说明末尾 גַּם אֹתִי 的另一种强调方式。
