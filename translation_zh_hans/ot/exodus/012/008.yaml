  text: וְ/אָכְל֥וּ אֶת הַ/בָּשָׂ֖ר בַּ/לַּ֣יְלָה הַ/זֶּ֑ה צְלִי אֵ֣שׁ וּ/מַצּ֔וֹת עַל מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/008.yaml
  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
translation:
  language: zh_hans
  text: 他们要在当夜吃这肉[a]，肉要用火烤[b]；还要配着无酵饼和苦菜吃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在这一夜”。希伯来语直译为“在这一夜”，指逾越节筵席所在的特定夜晚。
    reason: lexical_alternative
  - marker: b
    text: 直译可作“火烤的”或“用火烤的”，强调必须以火烤制，而不是采用其他烹调方法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: 他们要吃
  rationale: 该形式在礼仪指示的语境中带有规定、命令的语气；“要吃”既准确又符合现代汉语表达。
- source_word: הַבָּשָׂר
  choice: 这肉
  rationale: בָּשָׂר在食用语境中指肉；“这肉”自然承接上文所宰的羊羔，比“肉体”准确。
- source_word: בַּלַּיְלָה הַזֶּה
  choice: 在当夜
  rationale: 希伯来语直译为“在这一夜”；“当夜”自然指向逾越节筵席所在的那个特定夜晚。
- source_word: צְלִי אֵשׁ
  choice: 用火烤
  rationale: 该短语说明以火烤制，与下一节所禁止的水煮形成对照；“用火烤”清楚保留烹调方式。
- source_word: וּמַצּוֹת
  choice: 无酵饼
  rationale: מַצּוֹת指未经发酵的饼；“无酵饼”是清楚、通行且符合语境的译法。
- source_word: עַל מְרֹרִים
  choice: 配着……苦菜
  rationale: עַל在此表示伴随食用，而非空间意义的“在……上”；מְרֹרִים在此指苦味菜蔬，译作“苦菜”简明自然。
- source_word: יֹאכְלֻהוּ
  choice: 吃
  rationale: 词尾宾语指前面的肉。汉语在宾语明确时自然省略代词；后半句以“吃”重申指示，同时避免生硬的“吃它”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的指示性语体。“肉要用火烤”使希伯来语短语在汉语中关系明确；末句保留原文再次出现“吃”的强调，同时按现代汉语习惯省略已明确的宾语代词。
