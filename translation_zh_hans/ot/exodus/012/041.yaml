  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: zh_hans
  text: 四百三十年期满的那一天，雅威的全体队伍[a]都从埃及地出来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的全军”。希伯来语可指有组织的队伍或军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: 结束时
  rationale: 该短语指一段时期达到终点；“结束时”自然、准确地表达时间期限届满。
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百三十年
  rationale: 按现代汉语数词顺序表达总计四百三十年的期限。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 正是在那一天
  rationale: 保留原文对日期完全相合的强调，也符合回顾性叙事的现代汉语表达。
- source_word: יָצְאוּ
  choice: 出来了
  rationale: יצא在此指离开埃及而出；“出来了”保留原文简明的动作及完成语气。
- source_word: כָּל צִבְאוֹת
  choice: 所有队伍
  rationale: צָבָא可指军队，也可指有组织的群体；“所有队伍”保留组织性和整体性，同时不把以色列人明确限定为作战军队。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，而不以称号替代。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 保留原文אֶרֶץ“地、国土”，表达从埃及地域离开的意思。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名，并避免以称号替代。
- issue: צִבְאוֹת יְהוָה的军事色彩
  choice: 雅威的所有队伍
  alternative: 雅威的全军
  rationale: 原词既可表示军队，也可泛指有组织的队伍；正文保留这种语义张力，不断言他们在本节中是作战部队，并在脚注列出军事性更强的译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。省略希伯来叙事公式וַיְהִי的机械直译，以流畅的时间句式承载其叙事推进作用；用“正是”保留原文对同一天的强调。
