base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: zh_hans
  text: 这一天要成为你们的纪念日；你们要守这节，作为归给雅威的节期。你们要世世代代守这节；这要成为永远的条例。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远的条例”也可译作“永久的条例”或“长久有效的条例”。希伯来语 חֻקַּת עוֹלָם 在律法语境中通常指持续施行、世代遵守的规定。
    reason: 说明עוֹלָם在律法语境中的持续性含义，并保留其是否表示绝对无尽的语义张力。
lexical_decisions:
- source_word: וְהָיָה הַיּוֹם הַזֶּה לָכֶם לְזִכָּרוֹן
  choice: 这一天要成为你们纪念的日子
  rationale: וְהָיָה在此律法指示中带将来和规定意味；זִכָּרוֹן指使人记念的纪念物或纪念安排。译作“纪念的日子”符合现代汉语，也保留礼仪语境。
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: 你们要把它当作……的节期来庆祝
  rationale: חגג与同根名词חַג连用，表达举行、庆祝节期。中文以“节期来庆祝”自然呈现动词与名词的关联。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词ל表示节期归于并尊崇雅威；“献给”在中文中自然表达这一指向。按希伯来文直接音译神名יהוה为“雅威”。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代
  rationale: 该短语表示在连续各代中持续遵守；“世世代代”简洁、自然，并具有庄重语体。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的条例
  rationale: חֻקָּה指规定、条例，עוֹלָם在律法语境中表达长久持续的效力。“永远的条例”保留原文的强度，同时脚注说明可能的语义范围。
- source_word: תְּחָגֻּהוּ
  choice: 都要庆祝这节日
  rationale: 重复חגג强化持续遵行的命令；补出“这节日”使代词所指在中文中清楚自然。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名。采用“雅威”较直接地呈现该专名，不以称号替代，也不引入特定宗派解释。
- issue: חֻקַּת עוֹלָם的期限含义
  choice: 永远的条例
  alternative: 永久的条例；长久的条例
  rationale: 直译保留עוֹלָם所具有的持续、久远之力，不在正文中裁定它是否必然指哲学意义上的绝对无尽；以脚注呈现其在律法语境中的语义范围。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“纪念的日子”“节期”“条例”保留礼仪和律法语域；句式分为两句，以清楚呈现纪念、庆祝与世代遵守三个层次。
