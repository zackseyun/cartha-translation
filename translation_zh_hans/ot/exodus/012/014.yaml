  rationale: 修订使汉语句法更自然，并明确“永远的条例”是对该节期世代遵守之法定性质的说明。保留原文中两次 חגג 所带来的重复命令，以“守这节”前后对应；“归给雅威的节期”保留 לַיהוה 的归属和敬拜指向，而不增添祭献含义。
