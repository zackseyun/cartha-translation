  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: zh_hans
  text: 耶和华使百姓在埃及人眼前蒙恩，埃及人就把他们所求的给了他们[a]；于是，以色列人掠夺了埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“埃及人就借给了他们。”这里的希伯来动词既可理解为借给，也可理解为把他们所求的给了他们。
    reason: 保留该动词在本节中长期存在的两种词义理解，避免正文排除具有依据的传统译法。
lexical_decisions:
- source_word: וַֽיהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名音译，明确对应希伯来文神名 יהוה，而不以普通称号代替。
- source_word: נָתַן אֶת־חֵן
  choice: 使……蒙恩
  rationale: 直译为“赐恩”虽可理解，但“使百姓……蒙恩”更自然地表达耶和华使埃及人对百姓产生善意这一语境含义。
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: 在埃及人眼前
  rationale: 保留希伯来语“在……眼中／眼前”的评价习语，同时符合庄重的现代中文表达。
- source_word: וַיַּשְׁאִלוּם
  choice: 埃及人就把他们所求的给了他们
  rationale: 该使役式在本段语境中可表示准许对方取得所求之物；译文呈现实际给予的结果，避免无根据地暗示一般借贷中的偿还义务，同时以脚注保留“借给”的传统可能。
- source_word: וַיְנַצְּלוּ אֶת־מִצְרָיִם
  choice: 以色列人把埃及掠夺一空
  rationale: נצל 的加强式在此有剥取、掠夺之意；“掠夺一空”体现动作的强度和结果。补出“以色列人”以澄清原文在连续复数动词之间发生的语境性主语转换。
theological_decisions:
- issue: וַיַּשְׁאִלוּם 应译为“借给”还是“把所求的给了”
  choice: 把他们所求的给了他们
  alternative: 借给了他们
  rationale: 希伯来动词 שאל 的使役式在此可从“使其取得所求”理解，也历来有“借给”的解释。上下文强调埃及人因耶和华所赐的恩待而满足以色列人的请求，并以埃及被掠夺作结；正文采用不预设偿还关系的表达，脚注保留另一种有词汇依据的理解。
- issue: וַיְנַצְּלוּ 的主语是否明说
  choice: 补出“以色列人”
  alternative: 仅译“他们”
  rationale: 原文依靠上下文表明此处主语从埃及人转回以色列人。中文若连续使用“他们”容易误读为埃及人掠夺埃及，因此为清楚起见明说主语，不改变事件参与者。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“蒙恩”保留圣经语体但仍为普通读者熟悉；“掠夺一空”自然有力。分号呈现前因与最终结果，并补出发生主语转换后的“以色列人”以免歧义。
