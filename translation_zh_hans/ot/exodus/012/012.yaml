language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: zh_hans
  text: 因为今夜我要经过埃及地[a]，击杀埃及地一切头生的，从人到牲畜[b]；我要向埃及所有的神明施行审判。我是耶和华[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “经过”也可译作“穿行”。这里的动词表示穿过埃及地，并非指“越过”而宽免。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“从人到牲畜。”
    reason: literal_form
  - marker: c
    text: “耶和华”所译的希伯来文为四字神名 יהוה（YHWH）；也常拟音作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: 我要走遍
  rationale: עבר与בְּאֶרֶץ连用，表示穿行、经过这片土地，而不是“越过”某些房屋并予以宽免；“走遍”在现代汉语中自然地表达了行动遍及埃及地。
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 保留אֶרֶץ的地域含义，说明行动范围是埃及全境。
- source_word: בַּלַּיְלָה הַזֶּה
  choice: 今夜
  rationale: 自然、凝练地传达“这个夜晚”的时间指示和强调。
- source_word: וְהִכֵּיתִי
  choice: 击杀
  rationale: נכה本义为击打；本节所击对象是“头生的”，上下文明确结果是死亡，因此“击杀”比单纯“击打”更准确，也不额外加入原文未明说的方式。
- source_word: כָּל בְּכוֹר
  choice: 一切头生的
  rationale: 保留单数集合表达，不添加原文没有明说的“男性”；“头生的”也与出埃及记相关语境中的固定用语协调。
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: 从人到牲畜
  rationale: 按原文两端式表达直译，既保留范围，也用现代汉语常见的“牲畜”表达בְּהֵמָה在此处与人相对的家畜、走兽类别。
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: 埃及所有的神明
  rationale: 保留אֱלֹהִים的字面神祇含义，不将其弱化为偶像、统治者或纯粹象征；介词ב在此与施行审判的惯用结构结合，目标关系由汉语“审判……”自然表达。
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: 我要审判
  rationale: 该惯用语字面为“施行审判”；汉语直接说“审判”自然有力，并保留司法与惩治意味。
- source_word: אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 将四字神名以现代中文圣经读者熟悉的音译“耶和华”呈现，同时以脚注交代其希伯来文形式及另一常见拟音。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文读者广泛熟悉且明确作为专名的“耶和华”，不以称号替代；脚注保留“雅威”这一学术界常见拟音。
- issue: אֱלֹהֵי מִצְרַיִם所指的地位
  choice: 埃及所有的神明
  alternative: 埃及所有的偶像；埃及所有的统治者
  rationale: 原文直称埃及的“神”，译文不预先裁定其本体地位，也不把它们化约为偶像或人间统治者，从而保留经文宣告耶和华向埃及诸神施行审判的张力。
- issue: 击打头生者的结果
  choice: 击杀
  alternative: 击打
  rationale: 虽然נכה本身可泛指击打，但本章上下文清楚指向头生者死亡；“击杀”准确表达此处语境中的实际结果。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“今夜”“击杀”“审判”保持宣告的紧迫感和司法力度；“神明”在现代汉语中比复数式“众神”更自然，同时不消解原文对埃及诸神的直接指称。所有脚注标记均已置于正文相应位置。
