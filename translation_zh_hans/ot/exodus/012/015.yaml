base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: zh_hans
  text: 七天之内，你们要吃无酵饼。但在第一天，你们要从家中除去酵[a]；因为凡吃有酵之物的，那人必从以色列中剪除[b]，从第一天到第七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使酵从你们家中止息”或“把酵从你们家中清除”。希伯来文直译为“使酵止息”。
    reason: lexical_alternative
  - marker: b
    text: “被剪除”是希伯来文的法律用语，可能指被逐出共同体、死亡，或上帝的审判；本节没有说明具体方式。
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 该词指不用发酵剂制成的饼。“无酵饼”是现代中文圣经语境中清楚、自然且符合逾越节礼仪背景的表达。
- source_word: אַךְ
  choice: 务要
  rationale: 此处该语气词带有限定和强调作用，引出第一天必须采取的具体行动。“务要”比单纯的转折词更能传达命令的强调语气。
- source_word: תַּשְׁבִּיתוּ
  choice: 除去
  rationale: 这是 שׁבת 的使役形，字面为“使……止息”，在此实际指使酵不再存在于家中，即将其除去。
- source_word: שְּׂאֹר
  choice: 酵
  rationale: 该词指使面团发酵的酵种或发酵剂。“酵”既保留礼仪用语，也不把它过度限定为现代工业酵母。
- source_word: חָמֵץ
  choice: 有酵之物
  rationale: 该词泛指发过酵的东西，并不必然只指饼；“有酵之物”保留了原文范围。
- source_word: וְנִכְרְתָה
  choice: 必被剪除
  rationale: כרת 的被动式在盟约和法律语境中是固定而含义宽广的表达。“被剪除”保留其司法与盟约分量，不擅自确定执行方式。
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: 那人
  rationale: נֶפֶשׁ 在这种法律表述中指具体的个人；译作“那人”自然，也避免把它狭义理解为与身体分离的“灵魂”。
- source_word: מִיִּשְׂרָאֵל
  choice: 从以色列中
  rationale: 该短语表示此人从以色列共同体中被剪除；加入“中”符合现代汉语表达，并明确其群体含义。
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: 从第一天直到第七天
  rationale: 该时间短语位于句末，最自然地界定禁食有酵之物及相应制裁适用的整个时期；译文将它前置到原因分句中，使汉语关系清楚，同时不改变范围。
theological_decisions:
- issue: “被剪除”（וְנִכְרְתָה）所指的具体惩罚
  choice: 保留“必从以色列中被剪除”这一法律表达，不具体说明执行方式。
  alternative: 逐出共同体、处死，或由上帝施行审判。
  rationale: 原文带有盟约性和司法性的严重含义，但本节没有说明究竟通过逐出、死亡还是上帝直接审判来实现。保留原文张力可避免超出经文作教义性判定。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“无酵饼”“有酵之物”“被剪除”保留礼仪和法律语域；语序按现代汉语略作调整，将时间范围置于原因分句开头。脚注[a]紧随其实际解释的“除去酵”，避免标记与注释内容错位。
