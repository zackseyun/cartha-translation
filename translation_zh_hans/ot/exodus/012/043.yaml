  rationale: 修订仅处理末句宾语的语义范围：以“逾越节的食物”自然表达“吃其中”，不把 הַפָּסַח 不必要地收窄为“这祭物”。脚注删去可能超出本节明说内容的身份界定，保留必要的字面说明与割礼限定。
