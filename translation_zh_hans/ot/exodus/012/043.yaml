  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: zh_hans
  text: 耶和华对摩西和亚伦说：“这是逾越节的条例：外族人[a]都不可吃逾越节的食物。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外族人”原文直译为“外族之子”，是指外来者。本节本身没有明说其是否受过割礼。
    reason: 说明希伯来语习语，并避免把后文所交代的条件提前加入本节。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中最通行的音译来呈现上帝的专名，不以“主”这一称号替代。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是叙事文中常见的 אמר wayyiqtol 形式，直译为自然的中文“说”。
- source_word: זֹאת חֻקַּת הַפָּסַח
  choice: 逾越节的条例是这样
  rationale: חֻקָּה 指规定、条例；此处采用现代而庄重的法律用语，并以自然中文句式引出后文规定。
- source_word: הַפָּסַח
  choice: 逾越节
  rationale: 该词可指逾越节礼仪、祭牲或筵席；此处保留较宽的“逾越节”，同时依据后面的“吃”以“这祭物”承接其具体所指。
- source_word: כָּל בֶּן נֵכָר
  choice: 外族人都
  rationale: בֶּן נֵכָר 字面为“外族之子”，指外族人；保留 כָּל 的全称范围，并与否定词合成中文的全面禁令。
- source_word: לֹא יֹאכַל בּוֹ
  choice: 不可吃这祭物
  rationale: 法律语境中的 לֹא יֹאכַל 表示禁止，以“不可吃”准确表达；בּוֹ 指向逾越节祭物，中文需明确宾语以避免误解为吃“节日”本身。
theological_decisions:
- issue: 被禁止吃逾越节祭物者的身份
  choice: 外族人
  alternative: 未受割礼的外族人／盟约群体以外的人
  rationale: 本节的希伯来语只说 בֶּן נֵכָר，并未明说“未受割礼”；不把后文对盟约界限的进一步说明提前加入正文。
- issue: הַפָּסַח 在本句中的范围
  choice: 前半句译“逾越节”，后半句以“这祭物”承接
  alternative: 全程译作“逾越节祭牲”或“逾越节筵席”
  rationale: 该词本身有一定语义宽度；“逾越节”保留这一宽度，而“这祭物”使“吃”的对象在中文中清楚，同时不把它缩窄为整场筵席。
translation_notes:
  register: 采用现代、庄重、易懂的规范汉语。“条例”保持法律语体；“不可”表达正式禁令。神名译作“耶和华”，符合简体中文读者熟悉的专名形式。
