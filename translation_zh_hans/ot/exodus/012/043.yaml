  source_fidelity: “这祭物”将 הַפָּסַח／בּוֹ 明确收窄为单一祭物，并加入原文没有的指示词“这”。该词在此可涵盖逾越节的礼仪及其所吃的对象；宜以不额外限定其具体形态的中文表达。其余内容忠实反映原文的说话者、受话者、条例性语气和禁令。
  naturalness: 原译整体庄重自然。“外族人都不可”通顺；将末尾改为“不可吃逾越节的食物”可在中文中自然表达“eat of it”，且避免把“逾越节”本身误解为被吃的节日。
  terminology: “耶和华”是中文圣经中通行的神名写法，未以称号取代专名；“逾越节”“条例”均恰当。“外族人”可保留，脚注应仅说明其希伯来语习语及本节未明言割礼，不应把“盟约群体以外”的解释写入正文。
