  rationale: 仅作安全的汉语句法润饰：将“一个人”和“用银子买来的”整合为修饰“奴隶”的定语，消除原译的轻微滞涩。保留原文的转折承接、单数第二人称、割礼的先决条件、许可语气，以及“逾越节羊羔”的上下文所指。
