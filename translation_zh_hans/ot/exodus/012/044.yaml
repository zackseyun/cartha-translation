base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's slave[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: zh_hans
  text: 但凡一个人用银子买来的奴隶[a]，你给他行了割礼[b]以后，他就可以吃逾越节羊羔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可按结构译作“每一个人的奴隶，银钱所购的”。
    reason: 说明原文中“奴隶”“一个人”和“银钱所购”相连的结构，并保留较贴近原文语序的译法。
  - marker: b
    text: 也就是说，他必须先受割礼，才可以参加逾越节的筵席。
    reason: 说明本节中割礼是该奴隶获准参与逾越节筵席的先决条件。
lexical_decisions:
- source_word: וְ/כָל
  choice: 但凡
  rationale: וְ承接上文关于外人的禁令，并在此转入与之相对的规定；“但凡”既体现转折衔接，也保留כָּל的周遍、逐一之意。
- source_word: עֶבֶד אִישׁ
  choice: 一个人的奴隶
  rationale: עֶבֶד在明说以银钱购得的法律语境中指受主人所有、处于奴役身份的人，因此译作“奴隶”而不弱化为“仆人”；“一个人”保留אִישׁ的单数男性法律主体表达。
- source_word: מִקְנַת כָּסֶף
  choice: 是用银子买来的
  rationale: 该短语字面指“银子的购置物”，在此即用银子买来的人；译文保留“银子”的具体意象，同时用现代汉语明确购买关系。
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: 你给他行了割礼以后
  rationale: 保留第二人称单数对户主的直接称呼，并按法律程序的语义将该动作表达为准许进食之前必须完成的条件。
- source_word: אָז יֹאכַל בּוֹ
  choice: 他才可以吃这逾越节的羊羔
  rationale: “才可以”自然表达אָז所标明的先决条件及未完成条件前不得参与的许可意义；בּוֹ的所指依上下文是逾越节羊羔，明译所指以免中文代词含混。
theological_decisions:
- issue: 盟约法律语境中的עֶבֶד身份称谓
  choice: 奴隶
  alternative: 仆人
  rationale: 经文明说此人是用银子买来的，受购买和所有关系约束；“奴隶”准确呈现这一社会现实，不以传统委婉语弱化原文。
- issue: 割礼与参加逾越节筵席的关系
  choice: 以“以后……才可以”表达先决条件
  alternative: “你要给他行割礼，他就可以吃”
  rationale: 原文的动作次序和אָז表明，割礼是该奴隶获准吃逾越节羊羔的先决条件；译文只呈现本节规定，不扩展为更广泛的教义判断。
- issue: אִישׁ的性别与法律主体
  choice: 一个人
  alternative: 一个男人／主人
  rationale: 此处אִישׁ标示单数所有者；现代汉语“一个人”可自然承载代表性的法律主体，又不额外加入原文没有明说的“主人”称号。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“但凡……才可以”清楚呈现与上文的对照以及条件—许可关系；保留“奴隶”和“银子”以忠实反映古代社会及原文意象。
