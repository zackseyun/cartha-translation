  source_fidelity: 原文“וְהָיָה כִּי”引出将来发生的时间／情境从句；草稿仅用“将来”而未明确呈现“当……时”的从句关系。其余方面，“你们的儿子”准确保留阳性复数，“问你们”在汉语中自然地表达了以疑问内容所作的“说”，“这项礼仪对你们有什么意义”在不生硬的前提下表达了“这服务/礼仪……对你们是什么”的意义询问。
