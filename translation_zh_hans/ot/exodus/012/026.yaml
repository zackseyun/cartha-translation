  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: zh_hans
  text: 将来，当你们的儿子问你们：“这项礼仪对你们有什么意义？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 将来
  rationale: 这个希伯来语组合引出未来会发生的情形。汉语用“将来”简洁自然，并由后面的问句体现该情形。
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: 问你们
  rationale: אָמַר本义是“说”，但这里所说的内容直接构成疑问；现代汉语用“问你们”更自然，也没有改变言说行为的实质。
- source_word: בְּנֵיכֶם
  choice: 你们的儿子
  rationale: 原文是阳性复数“儿子”，保留其明确的性别和亲属称谓；汉语集合性用法无需另加“们”。
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: 这礼仪
  rationale: עֲבֹדָה可指工作、服事或宗教礼仪；在逾越节规例的语境中，“礼仪”自然地指这项规定的宗教行动，同时避免限定为某一种宗派性的“崇拜”。
- source_word: מָה ... לָכֶם
  choice: 对你们有什么意义
  rationale: 原文直译近于“对你们是什么”。汉语以“有什么意义”表达同一询问，保留לָכֶם所指向的“对你们”，又避免生硬难懂。
theological_decisions:
- issue: 问题是在询问礼仪的性质、意义，还是群体与礼仪的关系
  choice: 这礼仪对你们有什么意义？
  alternative: 这礼仪对你们是什么？
  rationale: 原文的简略问法容许对礼仪意义及其与受问群体关系的询问。所选译文保持“对你们”这一关系成分，不把问题进一步解释为单纯询问象征意义或个人感受。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“将来”承接前文的未来处境；问句自然口语化，但保留原文“对你们”的群体指向。
