  yaml_path: translation/ot/exodus/012/049.yaml
  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: zh_hans
  text: 同一律法适用于本地人，也适用于寄居在你们中间的寄居者[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“本地人和寄居在你们中间的寄居者，同归一条训令。”
    reason: תּוֹרָה也可译作“训令”；“一条”对应“一”，而“同归于”较形式对应地表达יִהְיֶה。
lexical_decisions:
- source_word: תּוֹרָה
  choice: 律法
  rationale: 在逾越节条例的法律语境中，指具有约束力的规范；“律法”既符合上下文，也保留该词可指教导或训令的语义背景。
- source_word: אַחַת
  choice: 同一
  rationale: 这里强调本地人与外来人受同一个法律标准约束；现代汉语用“同一”比直译“一条”更自然。
- source_word: יִהְיֶה
  choice: 适用于
  rationale: 原义为“要归于／要给”，在法律陈述中译作“适用于”清楚表达该律法对两类人同样有效，而不改变句意。
- source_word: אֶזְרָח
  choice: 本地人
  rationale: 指以色列群体中的本土成员；避免用“公民”引入后世政治制度的含义。
- source_word: גֵּר
  choice: 外来人
  rationale: 指居住在以色列群体中、并非本地人的外来居民；“外来人”在现代汉语中清楚自然，也避免“异乡人”可能暗示仅为短暂停留。
- source_word: הַגָּר
  choice: 寄居在
  rationale: 分词说明这位外来人居住在群体中；“寄居在你们中间”保留原文与 גֵּר 的词义关联。
- source_word: בְּתוֹכְכֶם
  choice: 在你们中间
  rationale: 直接表达其身处共同体之中的关系，庄重而符合现代汉语。
theological_decisions:
- issue: 本地人与外来人在逾越节条例下的法律标准
  choice: 译为同一律法对两者都“适用”
  alternative: 译为两者“都要遵守”同一律法
  rationale: “适用于”较贴近原文的存在句结构，既表达法律标准一致，又不把句子的焦点改成两类人的遵守行为。
translation_notes:
  register: 采用现代、庄重而易懂的法律陈述语体。“同一律法适用于……”自然表达希伯来文“一项律法要归于……”的意思；脚注保留主要词汇和句法上的其他可能译法。
