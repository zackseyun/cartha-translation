- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名译出四字神名，区别于一般称谓“主”。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留介词短语的地点意义及“地”的表达，同时符合庄重、自然的现代汉语。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 希伯来语引语公式在中文中自然地以“说：”表达，冒号承接下文直接引语，无须机械译作“说话如下”。
