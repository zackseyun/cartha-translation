  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: zh_hans
  text: 他们要取一些血，涂在他们吃羊羔的房屋的两根门柱和门楣上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们将在其中吃羊羔的房屋。”希伯来语未完成式在这一指示语境中可带将来意味。
    reason: 保留希伯来语动词时体在程序性陈述与将来指向之间的可能差异。
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: 他们要取
  rationale: 连词加完成式在这一连串礼仪指示中带有命令或将来施行的语气；“要取”自然保留指示性语调。
- source_word: מִן הַדָּם
  choice: 一些血
  rationale: 介词 מִן 在此表示部分，指从血中取一部分，并非全部。
- source_word: וְנָתְנוּ
  choice: 涂在
  rationale: נתן 基本义为“放、置”；在把血放到门框上的具体语境中，“涂在”符合现代汉语习惯，又未具体限定使用何种工具或动作。
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: 两边门框
  rationale: מְזוּזוֹת 指门口两侧直立的门柱；“两边门框”通俗自然，并明确是门口两侧。
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: 门楣
  rationale: מַשְׁקוֹף 指门口上方的横梁，“门楣”是准确而简洁的现代汉语对应词。
- source_word: עַל הַבָּתִּים
  choice: 那些房屋的
  rationale: 原文的 עַל 在结构上把门柱、门楣与房屋相连；汉语用领属结构说明这些部位属于相关房屋，避免生硬重复“在房屋上”。
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: 吃羊羔的那些房屋
  rationale: 关系从句修饰“房屋”；宾语代词指前文逾越节羊羔，汉语明说“羊羔”可避免代词所指不清。未完成式在程序性指示中既可作一般/预期行为理解，也可带将来意味。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的指示性语体。“门楣”虽属建筑用语，但在现代汉语中仍清楚准确；正文以“吃羊羔”明确原文宾语代词的所指。
