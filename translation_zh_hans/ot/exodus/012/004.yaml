base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: zh_hans
  text: 若一家人数太少，不足以吃一只羊羔[a]，就要同离自己家最近的邻居按人数取一只；各人要按自己的食量，核算一只羊羔该由多少人共食[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊羔”所译的希伯来词可泛指绵羊或山羊中的一只；参本章5节。
    reason: lexical_alternative
  - marker: b
    text: 或较直译为：“各人要按自己的食量，为这只羊羔核算。”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: 若一家的人太少，吃不了一只羊羔
  rationale: הַבַּיִת在此指共同守逾越节的一家人；该结构表示这家人数少，不足以承担一整只牲畜。“吃不了”自然点明人数与食用整只牲畜之间的关系。
- source_word: שֶׂה
  choice: 羊羔
  rationale: שֶׂה泛指绵羊或山羊中的一只小型牲畜；正文依逾越节语境采用现代中文自然常用的“羊羔”，并以脚注保留其较广词义。
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: 这家就要和离他家最近的邻舍合取一只
  rationale: 代词在语境中指该家庭或其家主；“合取一只”表达两个相邻家庭共同取用一只牲畜，也补出希伯来文依上下文省略的宾语。
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: 按人数
  rationale: מִכְסָה指计数或定额，נְפָשֹׁת在这里指具体的人，并非与身体分离的“灵魂”。“按人数”简洁准确。
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: 照各人的食量
  rationale: אִישׁ在此作逐一分配用法；לְפִי אָכְלוֹ字面近于“按他所吃的”，实际指每个人能吃的分量。“各人的食量”保留分配原则且符合现代汉语。
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: 计算共用这只羊羔的人数
  rationale: 罕见动词在本句表示按食量核算、计入与这只牲畜有关的人。译文将其隐含对象明说，以免“为羊计数”在中文中含混；脚注保留较贴近原文的表达。
