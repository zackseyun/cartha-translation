  source_fidelity: 原文意为：若一家人数不足以取用一只羊（שֶׂה），该家应与离其家最近的邻居按人数合取一只；随后按每个人的食量，为这只羊核算人数。草稿的整体意思基本正确，但“合取”不合现代汉语习惯，末句把原文的“核算”扩展为“计算共用这只羊羔的人数”，虽方向无误，表达略显生硬且解释性偏强。
  naturalness: “吃不了”在现代汉语中容易主要理解为食量或无法吃下，而非家庭人数不足以分食一只；“合取”尤其不自然。改为“不足以吃一只”“同……邻居按人数取一只”较清楚自然。
  terminology: “羊羔”可保留，但须以脚注说明שֶׂה也可指山羊；“邻居”比“邻舍”更符合现代标准汉语，且不损失原义。“各人按自己的食量”准确传达分配性表达。
  issues:
