    issue: “合取”不是现代标准汉语中的自然搭配。
    rationale: 原文只表示该户与最近邻居共同取一只牲畜；“同……按人数取一只”即可准确而自然地表达。
  - severity: low
    issue: “吃不了一只羊羔”略有歧义。
    rationale: 它可能被理解为个人或家庭没有食欲、不能进食；“人数若少，不足以吃一只羊羔”明确原文所指的人数不足。
  - severity: low
    issue: 脚注b的“算在这只羊羔上”不符合汉语，也未清楚说明原句的核算对象。
    rationale: 应说明这是按各人的食量核算一只羊羔应由多少人取用，既保留原文句法的简略性，也便于理解。
