- from: 若一家的人太少，吃不了一只羊羔[a]，这家就要和离他家最近的邻舍合取一只；你们要按人数，并照各人的食量，计算共用这只羊羔的人数[b]。
  to: 若一家人数太少，不足以吃一只羊羔[a]，就要同离自己家最近的邻居按人数取一只；各人要按自己的食量，核算一只羊羔该由多少人共食[b]。
  rationale: 修订仅处理不自然或略有歧义的汉语表达。“按人数”保留在与邻居共同取羊的安排中；后句保留原文按个人食量核算的原则，并以“该由多少人共食”明确中文所需的隐含关系。脚注a保留שֶׂה的较宽泛词义，脚注b保留较贴近原文的简略说法。
