  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: zh_hans
  text: 那一夜属于雅威，是为把他们从埃及地领出来而有的守望之夜[a]；这同一个夜晚，是所有以色列子孙世世代代为雅威守望的一夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “守望”也可译作“守夜”“谨守”或“纪念性的遵守”。希伯来语 שִׁמֻּרִים 含有警醒看守、谨守的意思；在这里也可能包含纪念这次拯救的礼仪性意味。
    reason: 保留 שִׁמֻּרִים 在实际守望、谨守与纪念性遵守之间的语义幅度。
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: 守望的一夜
  rationale: לֵיל 是构造形式，שִׁמֻּרִים 源于“看守、守望、谨守”的词根。译作“守望的一夜”既保留夜间警醒的具体意味，也容纳纪念性谨守的含义。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词 ל 表示关联、归属或奉献关系；“为雅威”不武断限定为雅威亲自守望或以色列向雅威守夜，并保留原文关系上的张力。
- source_word: לְהוֹצִיאָם
  choice: 为要把他们……领出来
  rationale: ל 加不定词表达目的或结果；“为要……领出来”保留其不定式结构及雅威施行拯救的语境。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 明确保留原文 אֶרֶץ“地、国土”，不缩略为单纯的“从埃及”。
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: 这同一个夜晚
  rationale: 代词与指示词构成强调性指认；“这同一个”承接前半句并体现重复强调。
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: 所有以色列子孙
  rationale: 保留 בְּנֵי יִשְׂרָאֵל 的家族与盟约性表达，同时符合现代汉语圣经文体。
- source_word: לְדֹרֹתָם
  choice: 世世代代
  rationale: 以自然、庄重的现代汉语表达跨越 successive generations 的持续性。
theological_decisions:
- issue: 神圣名字 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按希伯来语证据音译，保留其作为立约名字的性质。
- issue: שִׁמֻּרִים 在出埃及与纪念礼仪语境中的含义
  choice: 守望
  alternative: 谨守／守夜／纪念遵守
  rationale: “守望”兼具警醒看守与郑重持守的意味，避免把原词仅解释为身体上的守夜，或仅解释为后世礼仪性的纪念。
- issue: 第一次“为雅威守望”由谁守望
  choice: 不在正文中明确主语
  alternative: 雅威守望的一夜／以色列人为雅威守夜的一夜
  rationale: 原文的名词短语及介词关系没有明说守望者；正文采用“为雅威守望”保存这种歧义，不把互相关联的神圣看顾与群体纪念单方面定死。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“守望的一夜”略带凝练的圣经文体，以保留希伯来语重复结构；两次均译作“为雅威守望”，使原文的反复与神学张力清晰可见。
