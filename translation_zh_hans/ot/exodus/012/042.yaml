revisions:
- from: 那是为雅威守望的一夜[a]，为要把他们从埃及地领出来；这同一个夜晚，是所有以色列子孙世世代代为雅威守望的一夜。
  to: 那一夜属于雅威，是为把他们从埃及地领出来而有的守望之夜[a]；这同一个夜晚，是所有以色列子孙世世代代为雅威守望的一夜。
  rationale: 修订首句以消除汉语中“守望者把他们领出来”的误读。“属于雅威”对应 לַיהוָה 的关联/归属关系；“为把他们……领出来而有的”使不定式目的自然关联雅威及出埃及事件。正文仍未明确“守望”究竟由谁执行，保留原文及其解释传统所容许的张力；两次“守望”继续一致翻译。
