  text: וְ/הָיָ֤ה לָ/כֶם֙ לְ/מִשְׁמֶ֔רֶת עַ֣ד אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/שָׁחֲט֣וּ אֹת֗/וֹ כֹּ֛ל קְהַ֥ל עֲדַֽת יִשְׂרָאֵ֖ל בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: zh_hans
  text: 你们要把它留到本月十四日；以色列全会众都要在黄昏时分[a]宰杀它。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“两晚之间”（或“傍晚之间”）；这是一时间习语，通常理解为日落前后、黄昏时分，但其所指的确切时段存在不同解释。
    reason: 说明希伯来时间习语的字面形式及其真实歧义。
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: 你们要把它看管
  rationale: מִשְׁמֶרֶת 表示看守、保管或留存；结合 לָכֶם，用主动句自然表达以色列人负有看管之责。
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: 到本月十四日
  rationale: 按现代汉语日期习惯表达，同时准确保留截止日期。
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: 都要……宰杀它
  rationale: שׁחט 特指宰杀动物，比泛称的“杀”更准确；“它”承接上文选定的羊羔或山羊羔。
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: 以色列会众全体
  rationale: 希伯来语叠用集体名词以强调全体共同参与；此译法保留整体性，又避免生硬重复为“会众的集会”。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 在两晚之间
  rationale: 直译保留这一时间习语本身的含混性，不在正文中武断限定为黄昏的某一具体时段。
theological_decisions:
- issue: 宰杀命令的集体主语
  choice: 以色列会众全体都要……宰杀它
  alternative: 各家都要宰杀自己的羊羔
  rationale: 原文以整体性的单数集合表达指称以色列全会众；周边语境虽涉及各家实际执行，本节仍采用群体措辞，因此不将其解释性改写为逐户行动。
translation_notes:
  register: 采用现代、庄重且易懂的指令性语体。“看管”比“保管”更能体现受托照看的意味；“两晚之间”略具异域感，但配合脚注可保留原文歧义。
