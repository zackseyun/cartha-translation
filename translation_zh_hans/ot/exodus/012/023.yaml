  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: zh_hans
  text: 因为耶和华要经过埃及，击打埃及；他看见门楣和两根门柱上的血，就会越过那门口[a]，不让那毁灭者[b]进入你们的房屋施行击打。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “越过”也可理解为“保全”或“护卫”；这里的希伯来语动词与“逾越节”相关。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文没有说明“那毁灭者”的身份；有人认为这是执行审判的天使。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中最通行的神圣名译法，作为专名而非以“主”这一称号代替。
- source_word: וְעָבַר
  choice: 要走遍
  rationale: 此处 עבר 表示耶和华经过、穿行埃及施行击打；“走遍埃及”自然表达在境内巡行之意，并与后文 פסח 的“越过”区分。
- source_word: לִנְגֹּף אֶת מִצְרַיִם
  choice: 击打埃及人
  rationale: נגף 在本语境中指带来死亡的审判；“击打”保留力度。מִצְרַיִם 可指埃及地或埃及人，中文在受击打对象上采用“埃及人”较自然。
- source_word: הַמַּשְׁקוֹף
  choice: 门楣
  rationale: 准确指门框上方的横木，是现代中文简洁而明确的建筑用语。
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: 两边门框
  rationale: 指门口左右两根竖直构件；“两边门框”比专业性较强的“门柱”更易懂，并清楚呈现其位置。
- source_word: וּפָסַח
  choice: 就会越过
  rationale: 保留 פסח 的越过意象及其与逾越节叙事的词汇联系，同时以脚注提示“保全、护卫”的可能语义。
- source_word: עַל הַפֶּתַח
  choice: 那门口
  rationale: פתח 指房屋的入口或门洞；“门口”自然，并区别于已提到的门楣和两边门框。
- source_word: וְלֹא יִתֵּן
  choice: 不让
  rationale: נתן 加不定式在此为“准许、容让”之意；“不让”是清楚自然的现代汉语。
- source_word: הַמַּשְׁחִית
  choice: 那毁灭者
  rationale: 按定冠词及施事者形式直译，保留其与耶和华在句法上的区别，不擅自补为“灭命的天使”。
theological_decisions:
- issue: 耶和华与“那毁灭者”的关系
  choice: 分别译出耶和华与“那毁灭者”，并说明耶和华阻止后者进入以色列人的房屋。
  alternative: 将“那毁灭者”视为耶和华自身的另一称呼，或在正文中明确译作“灭命的天使”。
  rationale: 希伯来文在本句中以不同称谓和句法角色呈现二者，却没有说明毁灭者的身份；译文因此保留这种区分和未决性。
- issue: פסח 的含义
  choice: 正文译作“越过”，脚注列出“保全”或“护卫”的可能理解。
  alternative: 正文直接译作“保全”或“护卫”。
  rationale: “越过”保留该动词与逾越节叙事的核心词汇联系；上下文中“不让那毁灭者进入”已显明保护效果，而脚注保留词义争议。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。以“因为……；……就……”呈现原文的因果与连续动作。神名用“耶和华”；避免古雅的“击杀”“容灭命者”等表达，也不在正文中补入原文未明说的天使身份。
