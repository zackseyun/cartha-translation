revisions:
- from: 因为耶和华要走遍埃及，击打埃及人；他看见门楣和两边门框上的血，就会越过那门口[a]，不让那毁灭者[b]进你们的房屋击打你们。
  to: 因为耶和华要经过埃及，击打埃及；他看见门楣和两根门柱上的血，就会越过那门口[a]，不让那毁灭者[b]进入你们的房屋施行击打。
  rationale: 修订保留“埃及”在原文中的整体与未限定指涉，避免将毁灭者所要击打的对象明确补为“你们”，并以“两根门柱”准确对应两侧竖直门框构件。保留“经过”与“越过”的动词区分，以及“那毁灭者”身份未明的表述和脚注。
