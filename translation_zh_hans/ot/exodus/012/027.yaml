  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: zh_hans
  text: 你们要说：‘这是献给雅威的逾越节祭。雅威击打埃及的时候，越过了在埃及的以色列子孙的房屋[a]，救了我们的房屋。’百姓便俯首下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “越过”也可理解为“护佑”或“使……免受灾害”；这个动词与“逾越节”在希伯来语中出自同一词根。
    reason: 保留 פָּסַח 与“逾越节”的词源呼应，并说明其可能包含的保护含义。
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: 逾越节祭
  rationale: 保留“祭牲／祭礼”的献祭含义，同时以现代汉语自然表达与逾越节相关的祭。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: לַ 在献祭语境中表示归属或奉献对象；“献给”比单纯的“给”更清楚自然。יהוה按其专名译为“雅威”。
- source_word: פָּסַח
  choice: 越过
  rationale: 与同句的名词“逾越节”保持词根关联；该动词也含护佑、幸免之意，但此处不将这种语义完全替代进正文。
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: 以色列子孙……的房屋
  rationale: 保留希伯来语的家族—盟约表达，并保持“房屋”这一具体意象。
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: 雅威击打埃及的时候
  rationale: בְּ 加不定式表达时间背景；“击打”保留 נָגַף 的审判力度，而不把词义收窄为“降灾”。
- source_word: הִצִּיל
  choice: 救了
  rationale: נצל 的使役式表达搭救、解救；“救了我们的家”既简洁，也保留主动拯救的意义，不仅是未受击打。
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: 低头敬拜
  rationale: 以紧凑自然的汉语表达先俯首、继而敬拜的连续动作，避免机械重复两个近义的身体动作。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”作为专名译写，保留其在本节中的盟约名称功能。
- issue: פָּסַח 的语义张力
  choice: 越过
  alternative: 护佑；使……免受灾害
  rationale: “越过”维持与“逾越节”的词源呼应；保护、宽免的语义可能性以脚注说明，不在正文中单一定义。
- issue: בְנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 保留原文的亲族和盟约性措辞，同时在现代汉语中仍清楚可懂。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留献祭、神名、逾越词根呼应及群体称谓；将两个连续敬拜动作凝练为“低头敬拜”。脚注标记置于相关引语之后，涵盖整句中“越过”的词义说明。
