  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: zh_hans
  text: 他们把从埃及带出来的面团烤成无酵饼；面团还没有发酵，因为他们是被赶出埃及的，不能耽搁，也没有为自己预备路上的食物。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: 他们……烤成
  rationale: 该叙事动词意为“烘烤”；与宾语和结果补语连用，译作“把……烤成”符合现代汉语表达。
- source_word: הַבָּצֵק אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: 从埃及带出来的面团
  rationale: 准确保留关系从句所限定的对象，同时采用自然简洁的汉语定语结构。
- source_word: עֻגֹת מַצּוֹת
  choice: 无酵饼
  rationale: עֻגֹת指饼状或圆形烤饼，מַצּוֹת说明其未经发酵；“无酵饼”是清楚而庄重的常用译法。
- source_word: כִּי לֹא חָמֵץ
  choice: 面团还没有发酵
  rationale: חָמֵץ在此为动词，表示面团进入发酵状态；“还没有发酵”保留其过程含义，并呼应仓促离开的语境。
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: 因为他们是被赶出埃及的
  rationale: 被动形式表达他们遭到强制驱逐；“被赶出”较“被逐出”更易为普通读者理解，同时保留强迫意味。
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: 不能耽搁
  rationale: התמהמה表示逗留或延误；“不能耽搁”自然表达他们没有时间等待。
- source_word: צֵדָה
  choice: 路上的食物
  rationale: 该词指为出行预备的口粮或给养；语境主要关乎仓促启程，“路上的食物”比抽象的“给养”更直白易懂。
- source_word: לָהֶם
  choice: 为自己
  rationale: 保留代词所表达的受益关系，说明他们没有为自身所需作预备。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“无酵饼”保留圣经语境中的固定概念；其余措辞避免古奥表达。分号区分烘烤结果与随后给出的原因链，使紧迫的叙事关系清楚可读。
