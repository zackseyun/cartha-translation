  yaml_path: translation/ot/exodus/012/045.yaml
  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: zh_hans
  text: 外来居民[a]和雇工不可吃这逾越节祭物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “外来居民”或译“寄居者”、“暂住者”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“不可吃它”，指逾越节的祭餐；更狭义地说，可指逾越节的祭牲。
    reason: referent_clarification
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: 外来住民
  rationale: 指居住在以色列人中、却未完全归入其群体的外来人口。“外来住民”兼顾其居住状态与外来身份，也比单用“寄居者”更明确。
- source_word: שָׂכִיר
  choice: 雇工
  rationale: 指受雇领取工价的人。“雇工”简洁、现代，并符合律法条文的语体。
- source_word: לֹא יֹאכַל
  choice: 都不可吃
  rationale: 否定词加未完成式在律法语境中表达禁令；“不可”保留规范性语气，“都”使两个并列类别与谓语的关系在中文中清楚自然。
- source_word: בּוֹ
  choice: 吃这逾越节的祭物
  rationale: 介词 בְּ 与“吃”连用，在此表示参与食用前文所说的逾越节祭物。中文若直译为“吃它”较生硬，因此依上下文补明所指，同时在脚注中保留其可能涵盖祭餐或更狭义祭牲的范围。
theological_decisions:
- issue: בּוֹ（“它”）所指的对象
  choice: 译作“这逾越节的祭物”，指上下文规定的逾越节祭牲及其祭餐
  alternative: 更狭义地专指逾越节的羊羔
  rationale: 希伯来文只用代词，所指须由上下文判定。正文补出“逾越节的祭物”以符合现代中文表达，同时不把含义限定为羊羔本身；脚注说明其范围。
translation_notes:
  register: 采用简洁庄重的现代律法语体。“外来住民”避免古奥表达；“都不可”清楚传达该禁令分别适用于两个群体。正文按中文习惯补明代词所指，脚注则保存希伯来文的简略表达及其范围上的张力。
