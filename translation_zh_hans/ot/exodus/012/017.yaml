id: EXO.12.17
reference: Exodus 12:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ אֶת הַ/מַּצּוֹת֒ כִּ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה הוֹצֵ֥אתִי אֶת צִבְאוֹתֵי/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וּ/שְׁמַרְתֶּ֞ם אֶת הַ/יּ֥וֹם הַ/זֶּ֛ה לְ/דֹרֹתֵי/כֶ֖ם חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: zh_hans
  text: 你们要守无酵节[a]，因为就在这一天，我把你们的队伍[b]从埃及地领了出来。你们世世代代都要守这一天，以此为永远的定例[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“无酵饼”或“无酵之物”，在这里也可指守无酵节的礼仪。
    reason: lexical_alternative
  - marker: b
    text: “队伍”也可译作“军旅”“编队”或“群体”；原词描绘以色列人如有组织的队伍一样离开埃及。
    reason: lexical_alternative
  - marker: c
    text: “永远的定例”也可译作“永久的定例”或“长久的定例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 要守
  rationale: שׁמר在礼仪语境中指遵守、持守；译作“守”简洁自然，也保留本节两次出现同一动词的呼应。
- source_word: הַמַּצּוֹת
  choice: 无酵节
  rationale: 原文直指“无酵之物／无酵饼”，在本段语境中可转指相关节期。正文采用现代汉语中自然的节期名称，脚注保留其字面所指及语义张力。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在这一天
  rationale: עֶצֶם在这一习语中加强时间的确切性和郑重感；“就在”自然传达这种强调。
- source_word: הוֹצֵאתִי
  choice: 我把……领了出来
  rationale: יצא的使役式表示使其出去、领出；“领了出来”既体现上帝是行动主体，也符合现代汉语表达。
- source_word: צִבְאוֹתֵיכֶם
  choice: 你们的队伍
  rationale: צָבָא可指军队、整编的群体或队伍；此处“队伍”保留以色列人有组织地出埃及的含义，又避免把他们直接说成作战军队。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 准确表达历代延续遵守的盟约性用语，且是自然、庄重的现代汉语。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的定例
  rationale: חֻקָּה指规定、定例，עוֹלָם表示长久、持续或永远；此译保留原文强度，不预先限定其在不同语境中的时间范围。
theological_decisions:
- issue: הַמַּצּוֹת是指无酵饼本身，还是转指无酵节
  choice: 正文译作“无酵节”，脚注说明字面含义
  alternative: “无酵饼”或“无酵饼之礼”
  rationale: 本段命令人“守”它，并紧接着说守“这一天”，语境明显涉及节期礼仪；但原文没有明写“节”，因此以脚注保存食物与节期之间的真实歧义。
- issue: חֻקַּת עוֹלָם的持续时间如何表达
  choice: 永远的定例
  alternative: 永久的定例；长久的定例
  rationale: “永远”直接反映עוֹלָם的强烈持续意味，同时不在译文中额外裁定该盟约用语在神学上的适用范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与律例语体。“守”重复对应原文两次וּשְׁמַרְתֶּם；“就在这一天”传达时间强调；“世世代代”沿用普通读者熟悉的圣经礼仪表达。
