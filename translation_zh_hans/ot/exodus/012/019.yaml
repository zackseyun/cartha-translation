  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: zh_hans
  text: 这七天里，你们家中不可有酵；因为凡吃有酵之物的，那人必从以色列会众[c]中被剪除[a]，无论是寄居者[b]还是本地人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被剪除”也可直译为“那生命要被剪除”；此处“生命”指那人。这一希伯来惯用语可能指被逐出、死亡或上帝的审判，具体含义须视上下文而定。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”也可译作“外来居民”。
    reason: lexical_alternative
  - marker: c
    text: “会众”也可译作“集会”或“共同体”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 七天之内
  rationale: 表示持续七天的时段；“七天之内”在现代汉语中自然，并保留期限含义。
- source_word: שְׂאֹר
  choice: 酵
  rationale: 指使面团发酵的酵种或发酵剂，不是泛指所有有酵食物；“酵”简洁并适合本段礼仪语境。
- source_word: לֹא יִמָּצֵא
  choice: 不可有
  rationale: 原文为被动形式，表达某物不得被发现、不得存在的禁令；汉语“不可有”自然地传达家中不得存留酵的结果状态。
- source_word: בְּבָתֵּיכֶם
  choice: 你们家中
  rationale: 既对应复数“你们的房屋”，也用自然汉语表达各家的住所。
- source_word: כָּל אֹכֵל
  choice: 凡吃……的
  rationale: 保留原文对任何符合条件之人的普遍涵盖。
- source_word: מַחְמֶצֶת
  choice: 有酵之物
  rationale: 所指范围不限于饼，而是任何经过发酵之物；此译法避免无根据地缩窄范围。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: 那人都要……被剪除
  rationale: נפש在这里指整个人；“被剪除”保留盟约惩罚的惯用意象，不擅自断定具体执行方式。
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: 从以色列会众中
  rationale: עֵדָה指以色列共同体或集会；“会众”兼顾法律语体和群体含义。
- source_word: בַּגֵּר
  choice: 寄居者
  rationale: 指住在以色列人中间而非本地出生的外来居民；“寄居者”避免现代政治身份用语带来的误解。
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: 本地人
  rationale: 与寄居者相对，指本地出生或本土成员；译文清楚而不引入现代公民制度概念。
theological_decisions:
- issue: 盟约惩罚“被剪除”的具体含义
  choice: 保留“从……中被剪除”的原文意象，不具体说明执行方式
  alternative: 译作“被处死”或“从共同体中驱逐出去”
  rationale: 该希伯来惯用语可涉及死亡、逐出群体或上帝的审判，具体所指在此并不明确；保留意象可维持原文的法律与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“不可有”比机械直译“不可被发现”更符合现代汉语，同时保留禁令效力；“被剪除”有意保留原文未明确解释的盟约惩罚用语。
