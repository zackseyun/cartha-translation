  text: וַ/תֶּחֱזַ֤ק מִצְרַ֨יִם֙ עַל הָ/עָ֔ם לְ/מַהֵ֖ר לְ/שַׁלְּחָ֣/ם מִן הָ/אָ֑רֶץ כִּ֥י אָמְר֖וּ כֻּלָּ֥/נוּ מֵתִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: zh_hans
  text: 埃及人催逼百姓，急忙要把他们赶出那地[a]，因为他们说：“我们都要死了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “急忙要把他们赶出那地”也可译作“催促他们赶快离开那地”。希伯来文连续使用两个不定式，突出事情的紧迫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל־הָעָם
  choice: 埃及人催逼百姓
  rationale: חזק 与 עַל 连用，在这里表示强力施压、催促；“催逼”既保留力度，也符合现代汉语叙事。מִצְרַיִם 在此集合性地指埃及人。
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: 急忙要把他们赶出
  rationale: 两个相连的不定式共同表达催促他们迅速离境的急迫性。“赶出”体现 שׁלח 在本语境中送走、逐出的含义，同时不把两个不定式机械重复。
- source_word: מִן־הָאָרֶץ
  choice: 那地
  rationale: 原文为“从那地”，上下文明确指埃及；“赶出那地”自然保留土地指称及离开的方向。
- source_word: כִּי אָמְרוּ
  choice: 因为他们说
  rationale: כִּי 引出埃及人急迫催逼的原因，直译为“因为”清楚自然。
- source_word: כֻּלָּנוּ מֵתִים
  choice: 我们都要死了
  rationale: 字面可作“我们全都死了／都是死人”；结合长子被击杀后的恐惧，此处是对死亡临到全体的惊惧判断。“都要死了”在现代汉语中自然表达迫近的死亡，而不误成说话者已经全部死亡。
theological_decisions:
- issue: כֻּלָּנוּ מֵתִים 的时间和状态含义
  choice: 我们都要死了
  alternative: 我们全都是死人
  rationale: מֵתִים 是分词，语境可表达正在死亡、注定死亡或面临死亡。选择“都要死了”保留迫近危机感，不将其解释为所有埃及人已经死亡；脚注注明较字面的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“催逼”表现埃及人的强烈压力，“都要死了”保留其恐惧和紧迫感。正文中的脚注标记与脚注完全对应。
