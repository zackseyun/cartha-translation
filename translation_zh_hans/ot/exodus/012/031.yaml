base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: zh_hans
  text: 当夜，他召来摩西和亚伦，说：“起来！你们和以色列人[a]都从我的百姓中出去！去侍奉雅威[b]，正如你们所说的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”，是指以色列人。
    reason: 说明希伯来语的亲属群体习语，同时在正文采用自然现代汉语。
  - marker: b
    text: “雅威”是希伯来语神名 יהוה（YHWH）的音译；传统汉译常作“耶和华”。
    reason: 说明神名的原文形式及读者熟悉的另一译名。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: 此处指法老在夜间紧急叫摩西和亚伦前来；“召来”既自然，也保留了命人前来的含义。
- source_word: לַיְלָה
  choice: 当夜
  rationale: 该词在这里作时间状语。“当夜”简洁地突出事件发生在同一夜间，并符合汉语叙事习惯。
- source_word: קוּמוּ צְּאוּ
  choice: 起来！……出去！
  rationale: 保留两个连续命令及其急迫语气，不把它们合并为较弱的“离开”。
- source_word: מִתּוֹךְ עַמִּי
  choice: 从我的百姓中
  rationale: 保留“从……当中”的空间和群体关系；“我的百姓”也呈现法老对埃及人的称呼。
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: 你们和以色列人都
  rationale: 用“和……都”表达重复的 גַּם…גַּם 所强调的双方兼括关系；“以色列人”是现代汉语对该希伯来习语的自然表达。
- source_word: עִבְדוּ
  choice: 侍奉
  rationale: עבד 用于上帝时兼有服事与敬拜的语义。“侍奉”保留较宽的含义，不将其限定为礼仪性的“敬拜”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来辅音神名 YHWH 的通行学术重构音译为“雅威”，保留经文中的专名而不以称号替代。
- source_word: כְּדַבֶּרְכֶם
  choice: 照你们所说的去做
  rationale: 表达法老准许他们按此前提出的要求行事；补出“去做”使现代汉语完整自然，但没有增加新的行动内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较接近通行重构读音的“雅威”，脚注说明传统汉译“耶和华”，既保留专名，也让普通读者能够识别。
- issue: עבד 在此处的宗教含义
  choice: 侍奉
  alternative: 敬拜
  rationale: 该动词可涵盖服事和敬拜；译作“侍奉”保留其较广语义范围，避免只理解为礼拜仪式。
translation_notes:
  register: 采用简洁、庄重而现代的叙事语言。用短句和感叹号体现连串命令的紧迫性；保留原文未明说姓名的主语“他”，其所指由上下文确定。
