base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: zh_hans
  text: 那一夜，法老起来了；他和他所有的臣仆，以及所有埃及人[b]都起来了。埃及响起了极大的哀号，因为没有一家没有死人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“没有一所房屋，那里没有一个死人。”
    reason: lexical_alternative
  - marker: b
    text: 原文直说“全埃及”，以地名集合性地指埃及人。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起来了
  rationale: קום的Qal叙事形式表示一个简单的过去动作；“起来了”自然地表达法老在夜间因灾难而起身，不额外加入惊醒、仓促等原文未明说的含义。
- source_word: לַיְלָה הוּא
  choice: 夜里
  rationale: 该短语以“夜”加指示性代词说明时间；“夜里”符合现代汉语叙事习惯，也保留夜间这一明确背景。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עֶבֶד可指仆人、奴仆或王室臣属；此处与法老并列，语境指其宫廷人员，“臣仆”兼顾其服事与臣属身份。
- source_word: וְכָל מִצְרַיִם
  choice: 全埃及人
  rationale: 原文以地名“埃及”转指埃及人民。汉语若直译“全埃及起来了”容易被理解为地域本身，因此正文明确译出集合所指，并以脚注说明原文表达。
- source_word: צְעָקָה גְדֹלָה
  choice: 极大的哀号
  rationale: צְעָקָה指人在痛苦中发出的呼喊；“哀号”准确传达此处死亡灾祸引发的悲痛，“极大的”保留גְדֹלָה所强调的强烈程度。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在这里引出埃及哀号的原因；“因为”在现代汉语中清楚、自然地表达因果关系。
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: 没有一家不死人的
  rationale: 这一译法保留原文重复אֵין所形成的否定结构和全面语气，同时以“一家”表达בַּיִת在本语境中兼指房屋及其中家庭的含义。
- source_word: מֵת
  choice: 死人
  rationale: מֵת在此作名词性用法，指死去的人；“死人”简洁直接，也能自然嵌入“没有一家不死人”的汉语结构。
theological_decisions:
- issue: 灾祸范围的全面表述
  choice: 保留“没有一家不死人”的绝对措辞
  alternative: 意译为“家家都有人死了”或弱化为“许多家庭都有人死了”
  rationale: 原文以双重否定强调无一例外；译文不弱化其范围，也不在正文中加入原文没有提供的限定或解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“臣仆”保留王室叙事色彩；“哀号”传达丧亲之痛。将希伯来语并列主语在汉语中用“也都起来了”补足，使句法清楚，同时不改变事件内容。脚注标记均放在其所说明的正文表达之后。
