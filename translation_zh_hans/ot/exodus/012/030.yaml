revisions:
- from: 法老夜里起来了；他所有的臣仆和全埃及人[b]也都起来了。埃及响起了极大的哀号，因为没有一家不死人的。[a]
  to: 那一夜，法老起来了；他和他所有的臣仆，以及所有埃及人[b]都起来了。埃及响起了极大的哀号，因为没有一家没有死人。[a]
  rationale: 修订以“那一夜”反映原文的特指时间；将“法老、他的众臣仆和全埃及”恢复为同一“起来”动作的复合主语；并以“没有一家没有死人”清楚保留希伯来文重复否定所强调的全面性。脚注a锚定死亡陈述，脚注b锚定将地名所指明确译作“所有埃及人”的表达。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:25:59Z'
review_pass:
