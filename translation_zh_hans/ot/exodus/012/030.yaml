  - severity: medium
    issue: “没有一家不死人”有现代汉语歧义。
    rationale: 该说法可能理解为“没有任何一家会不发生死亡”，却未明确表达每家当时都有死者；“没有一家没有死人”保留原文双重否定并更清楚。
  - severity: low
    issue: 将复合主语拆为两个“起来了”分句。
    rationale: 虽不构成实质误译，但原文以一个“起来”统摄法老、臣仆和埃及人；合并表述更贴近原文结构，也更顺畅。
