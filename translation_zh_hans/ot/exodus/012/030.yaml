  source_fidelity: 需小幅修订。希伯来文将“法老、他的众臣仆和全埃及”连作“起来”的复合主语；草稿拆成两句并加“也都”，基本可理解，但不如保留同一动作结构贴近原文。לַיְלָה הוּא更适合译为“那一夜”。末句双重否定应明确表达为“没有一家没有死人”，避免“没有一家不死人”在现代汉语中可能被读作泛指死亡事件。
  naturalness: “所有埃及人”比“全埃及人”更自然。将复合主语置于同一句中，句法更清晰、叙事更凝练。“极大的哀号”自然且符合庄重叙事语体。
  terminology: “臣仆”适合王室叙事语境；“哀号”准确表达因丧亡而发的强烈呼号。保留“死人”可对应希伯来文作名词使用的“死者”，不需引入“长子”等本节未明说的内容。
  issues:
