  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: zh_hans
  text: 以色列众人[a]都照雅威[b]所吩咐摩西和亚伦的去做；他们就这样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”；这是对以色列全体民众的称呼，也可译作“以色列人”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为YHWH，即上帝的名字；“耶和华”是传统汉语译法。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... עָשׂוּ
  choice: 去做……做了
  rationale: עָשָׂה在遵行命令的语境中意为“做、行”。译文保留首尾重复，以呈现原文对顺服行动的强调。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: 以色列众人
  rationale: כָּל表示群体的整体；בְּנֵי יִשְׂרָאֵל字面为“以色列的众子”，在这里是指以色列全体民众。主文采用自然、涵盖整个群体的现代汉语表达，脚注保留字面形式。
- source_word: כַּאֲשֶׁר
  choice: 照……的
  rationale: 该词表示行动与命令相符，汉语“照……的去做”自然地表达“按照所吩咐的”这一关系。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 该动词表示有权柄地命令；在上帝向摩西和亚伦颁令的语境中，“吩咐”庄重而自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是四字神名YHWH。采用接近其通常学术复原读音的音译“雅威”，以保留专名性质，而不以称号替代。
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: 摩西和亚伦
  rationale: 两个אֶת标明摩西和亚伦是“吩咐”的直接宾语；因此不增添原文没有明说的“借着”。
- source_word: כֵּן
  choice: 就这样
  rationale: כֵּן回指前述命令与行动的一致性。“就这样”既自然，也保留结句的总结和强调。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名，而非“主”这一称号。“雅威”较直接地反映YHWH的通常复原读音；脚注说明汉语传统译名“耶和华”，不把传统形式从读者面前隐藏。
- issue: בְּנֵי יִשְׂרָאֵל所指群体
  choice: 以色列众人
  alternative: 以色列的众子；以色列人
  rationale: 此固定族群称谓字面为“以色列的众子”，但在上下文中指整个以色列群体。主文用“以色列众人”传达整体性，脚注保留原文的亲属称谓。
- issue: 摩西和亚伦与命令的句法关系
  choice: 雅威吩咐摩西和亚伦
  alternative: 雅威借着摩西和亚伦所吩咐的
  rationale: 原文以直接宾语标记引出摩西和亚伦，明确说他们是受命者；虽可从更广上下文理解他们也向百姓传达命令，本节本身没有使用表示“借着”的介词，故不在主文补入。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以分号呈现原文后半句的总结性重复，不将“他们就这样做了”顺译省略。
