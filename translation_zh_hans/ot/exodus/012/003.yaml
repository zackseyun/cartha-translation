  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: zh_hans
  text: 你们要对以色列全会众说：‘本月初十，各人要按父家取一只羊羔[a]；每家一只羊羔。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语שֶׂה的含义较广，可指绵羊或山羊中的一只；这里按逾越节的语境译作“羊羔”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: 你们要……说
  rationale: 这是דבר的皮勒命令式复数，表示直接吩咐；用“你们要……说”既保留命令语气，也符合现代汉语表达。
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: עֵדָה指作为整体聚集的群体；“全会众”保留其正式、共同体性的含义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的惯用不定式；汉语不必重复译成“说……说”，以引号自然承接其功能。
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: 本月初十
  rationale: 原文直译为“这个月的第十日”；“本月初十”简洁、清楚，符合现代汉语日期表达。
- source_word: וְיִקְחוּ לָהֶם
  choice: 要……为自己取
  rationale: 未完成式在本段指令语境中具有命令或规定的效力；“为自己”明确保留לָהֶם的反身受益含义。
- source_word: אִישׁ
  choice: 各人
  rationale: אִישׁ在这里作分配性单数。译作“各人”保留逐一承担责任的意思，同时避免现代汉语把“各男人”误解为家中所有成年男性。
- source_word: שֶׂה
  choice: 一只羊羔
  rationale: שֶׂה可泛指羊群中的一只，包括绵羊或山羊；正文依逾越节语境和汉语惯用表达译作“羊羔”，并以脚注保留较宽的词义。
- source_word: לְבֵית אָבֹת
  choice: 按父家
  rationale: 该短语指父系宗族或家族单位；“父家”简练地保留古代以父系划分家族的社会结构。
- source_word: שֶׂה לַבָּיִת
  choice: 一家一只
  rationale: בַּיִת在此指家庭成员构成的家户，而非房屋；“一家一只”自然表达每个家户取一只的规定。
