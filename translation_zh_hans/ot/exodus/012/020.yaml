  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: zh_hans
  text: 任何有酵之物，你们不可吃[a]；在你们一切住处[b]，要吃无酵饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切有酵之物都不可吃。”希伯来语所指不限于饼，而包括任何加了酵或经发酵而成的东西。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在你们一切居住之地”或“在你们所有的聚居地”；意思是无论住在哪里。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: 任何有酵之物
  rationale: כָּל与否定禁令连用，表达无一例外的范围；מַחְמֶצֶת指经过发酵的东西，并不限于饼。“任何有酵之物”既保留其广度，也与后文“无酵饼”形成清楚对照。
- source_word: לֹא תֹאכֵלוּ
  choice: 你们都不可吃
  rationale: לֹא加未完成式在律法语境中构成禁令；“不可吃”保留庄重明确的命令语气，“都”自然体现复数对象及禁令的普遍约束。
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: 在你们居住的各处
  rationale: מוֹשָׁב可指住处或聚居之地。此处强调命令适用于以色列人居住的每一个地方；该译法自然、清楚，又不把范围缩窄为房屋内部。
- source_word: תֹּאכְלוּ
  choice: 你们都要吃
  rationale: 这里的未完成式与前句禁令相对，表达正面的规定。“都要吃”保留命令力度，并与“都不可吃”形成平行。
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 该词指未加酵而制成的饼；“无酵饼”是现代中文中准确、通行且易懂的表达。
