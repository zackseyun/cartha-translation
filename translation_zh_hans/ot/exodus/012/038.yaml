  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: zh_hans
  text: 还有一大群混杂的人同他们一起上去[a]；羊群、牛群，牲畜极多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一大群混杂的民众”或“庞大的混杂人群”。希伯来语עֵרֶב רַב指随以色列人同行、由不同背景者构成的群体；原文本身没有具体说明他们的族属。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: 还有
  rationale: 表达对前文叙事的增补作用，现代汉语自然简洁，也避免机械重复“并且也”。
- source_word: עֵרֶב רַב
  choice: 一大群成分混杂的人
  rationale: עֵרֶב表示混杂的群体，רַב表示人数众多；此译既保留群体规模，也不擅自具体说明其族裔或身份。
- source_word: עָלָה
  choice: 上去
  rationale: 保留出埃及行程叙事中עלה的常用方向性表达；在此语境中比“登上”自然。
- source_word: אִתָּם
  choice: 和他们一同
  rationale: 直接表达伴随关系；“他们”按上下文指以色列人。
- source_word: וְ/צֹאן וּ/בָקָר
  choice: 又有羊群、牛群
  rationale: צֹאן是以绵羊、山羊为主的小型牲畜总称，בָקָר是牛类牲畜；“羊群、牛群”以自然汉语保留二者区别。
- source_word: מִקְנֶה
  choice: 牲畜
  rationale: 这是家养牲畜的集合称谓；“牲畜”准确承接前面的羊群和牛群。
- source_word: כָּבֵד מְאֹד
  choice: 极多
  rationale: כָּבֵד本义为“沉重”，修饰牲畜时惯用地表示数量或规模很大；“极多”自然表达מְאֹד的强化作用。
