  text: וּ/מוֹשַׁב֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יָשְׁב֖וּ בְּ/מִצְרָ֑יִם שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/040.yaml
  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: zh_hans
  text: 以色列人[a]住在埃及的时间，共有四百三十年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 若干古代文本作：“以色列人和他们列祖住在埃及和迦南的时间，共有四百三十年。”
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: 居住的时间
  rationale: 该词可指居住、居所或居住期间；本节以年数说明其持续时间，因此译为“居住的时间”，既体现名词含义，也符合现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在这里是对以色列民族的通常称呼；译为“以色列人”自然、准确，也不会让现代读者误以为只包括男性。
- source_word: אֲשֶׁר יָשְׁבוּ בְּמִצְרָיִם
  choice: 住在埃及
  rationale: 关系从句说明这段居住发生在埃及。汉语将其紧接在“以色列人”之后，可自然表达希伯来文的关系，同时不增添原文没有的解释。
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百三十年
  rationale: 希伯来文按“三十年和四百年”的次序排列；现代汉语按位值顺序表达为“四百三十年”。
theological_decisions:
- issue: 四百三十年仅指在埃及居住，还是也包括先祖在迦南寄居的时期
  choice: 正文依照所给马所拉文本，将四百三十年表述为以色列人在埃及居住的时间。
  alternative: 若干古代文本见证加入“和他们的列祖”以及“和迦南”，从而把这段时期扩展到先祖在迦南的寄居。
  rationale: 所给希伯来文明确只有“在埃及”。另一文本传统会影响年代计算，故在脚注中如实保留，而不将其并入正文或替读者调和。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“共有”自然引出总年数；不添加原文没有的篇章连接词。脚注标记紧随受异文影响的“以色列人”之后。
