  text: וּ/בְנֵי יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּ/דְבַ֣ר מֹשֶׁ֑ה וַֽ/יִּשְׁאֲלוּ֙ מִ/מִּצְרַ֔יִם כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: zh_hans
  text: 以色列人照着摩西的话做了，向埃及人求取[a]银器、金器和衣裳。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“请求给予”。这里的希伯来语通常意为“求、请求”，不是“借用”。
    reason: 说明关键动词的词义范围，并避免传统译法“借用”所增加的含义。
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该群体名称自然、准确的表达；若直译为“以色列的众子”，会显得生硬，并可能被误解为只指男性。
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: 照着摩西的话做了
  rationale: 保留 עשה 的普通动词意义和 דבר 的“话”这一宽泛含义，同时符合现代汉语表达。
- source_word: וַיִּשְׁאֲלוּ מִמִּצְרַיִם
  choice: 向埃及人求取
  rationale: שאל 的基本意义是“求、请求、索取”；“求取”既体现向人请求取得物品，也不加入“借用”或“掠夺”的含义。מִצְרַיִם 字面为“从埃及”，上下文所指是埃及人。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: 银器、金器
  rationale: כְּלִי 可泛指器具或物件；“银器、金器”简洁自然，在汉语中不必限定为餐具或礼仪器皿。
- source_word: וּשְׂמָלֹת
  choice: 衣裳
  rationale: שִׂמְלָה 泛指衣物；“衣裳”通俗而庄重，也与“银器、金器”并列自然。
theological_decisions:
- issue: 出埃及叙事中 וַיִּשְׁאֲלוּ 是否应译成带有道德判断的“借用”或“掠夺”
  choice: 求取
  alternative: 借用；掠夺；索取
  rationale: 希伯来动词本身通常表示询问或请求。译作“借用”会加入日后归还的含义，译作“掠夺”则把上下文所述的结果读进本句动词；“求取”保留原文的基本意义和叙事张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“以色列人”避免机械直译造成性别误解；“照着摩西的话做了”保留原文简洁结构；脚注标记置于其实际说明的动词之后。
