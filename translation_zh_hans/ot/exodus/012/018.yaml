base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: zh_hans
  text: 正月十四日傍晚[a]起，你们要吃无酵饼，直到本月二十一日傍晚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“晚上”；本节末尾同。
    reason: עֶרֶב 可泛指傍晚或晚上；正文采用“傍晚”以体现节期界线，脚注保留较宽泛的译法。
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: 正月
  rationale: 这里指一年中的第一个月；希伯来语随后以“本月”补足日期表达，译作“正月”简洁自然，也保留历法含义。
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: 十四日
  rationale: 这是希伯来语以基数词表达日期的常见方式；现代汉语自然译为“十四日”。
- source_word: לַחֹדֶשׁ
  choice: 本月
  rationale: חֹדֶשׁ 在日期公式中指“月”，而非“新月”；第二次出现时译作“本月”，清楚表明仍指正月。
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: 傍晚
  rationale: עֶרֶב 指日暮时分，也在本节标明节期的起止界线；“傍晚”自然且不过度限定为某个精确时刻。
- source_word: תֹּאכְלוּ
  choice: 你们要吃
  rationale: 未完成式在此律例语境中带有指令意味；“要吃”符合现代汉语，并保留命令性质。
- source_word: מַצֹּת
  choice: 无酵饼
  rationale: 指未发酵制成的饼；“无酵饼”是准确、通行且易懂的中文表达。
- source_word: עַד
  choice: 直到
  rationale: 标明吃无酵饼这段时期的终止界线。
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: 二十一日
  rationale: 这是希伯来语表达第二十一日的常见结构；按现代汉语日期习惯译为“二十一日”。
