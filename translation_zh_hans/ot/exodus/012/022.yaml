  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: zh_hans
  text: 你们要拿一束牛膝草，蘸在盆[a]里的血中，再把盆里的一些血点在门楣和两边的门柱上。你们谁也不可走出自己的家门，直到早晨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“门槛”。希伯来语词 סַף 可有这两种含义；这里说血在其中，又说把牛膝草蘸进去，所以正文采用“盆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: 一束牛膝草
  rationale: אֲגֻדָּה指捆扎成束的一簇；“一束”自然、具体。אֵזוֹב在礼仪语境中惯译为“牛膝草”，虽其确切植物种类仍有争议。
- source_word: בַּדָּם
  choice: 蘸在……血中
  rationale: 介词ב在טבל之后表示所蘸入的物质；这一表达既贴近原文，也符合现代汉语习惯。
- source_word: הַסַּף
  choice: 盆
  rationale: 本节说血在其中，并且牛膝草要蘸入其中，因此这里最可能指盛血的容器；“门槛”作为可成立的词义另见脚注。
- source_word: וְהִגַּעְתֶּם
  choice: 点在
  rationale: 使役形在此表示使血与门框各处接触。“点在”自然地表达用蘸血的草束使血接触表面，又不加入“涂满”等原文没有的含义。
- source_word: הַמַּשְׁקוֹף
  choice: 门楣
  rationale: 指门口上方横置的构件；“门楣”准确且是现代汉语通行的建筑用语。
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: 两边的门柱
  rationale: 指门口两侧竖直的门柱；加入“两边的”清楚传达其位置及复数含义。
- source_word: מִן הַדָּם
  choice: 一些血
  rationale: 介词מִן在此表示取盆中之血的一部分来使用；“一些血”把这一部分意义自然地表达出来。
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: 你们谁也不可走出
  rationale: 复数禁令后的אִישׁ具有逐一、分配性的作用；“你们谁也不可”自然地传达无人例外的意思。
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: 走出自己的家门
  rationale: פֶּתַח是入口或门口；结合分配性的אִישׁ及单数后缀，“自己的家门”在汉语中准确保留逐人适用的含义。
- source_word: עַד בֹּקֶר
  choice: 直到早晨
  rationale: 直接表达该时间界限，简洁而自然。
theological_decisions:
- issue: אִישׁ……בֵּיתוֹ的阳性单数分配表达
  choice: 你们谁也不可走出自己的家门
  alternative: 你们不可走出各人的家门；任何人都不可走出他的家门
  rationale: 原文的阳性单数形式在这里发挥代表性、分配性作用，并非把命令限于男性。汉语用“谁也……自己的”既保留逐人适用的意义，也避免不自然地增添性别限定。
- issue: 本节הַסַּף的含义
  choice: 盆
  alternative: 门槛
  rationale: 紧邻语境说血“在”其中，牛膝草也要蘸入其中，因此容器义更合适；但“门槛”仍是该词真实可行的词义，故在脚注保留，不将歧义悄然抹去。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“一束”“点在”“家门”等表达具体自然；保留逾越节仪式动作的次序和细节，不作额外神学解释。
