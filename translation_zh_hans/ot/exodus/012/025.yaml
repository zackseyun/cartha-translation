base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: zh_hans
  text: 将来你们进入那地，就是雅威要赐给你们的，正如他所应许[a]的；你们就要遵守这礼仪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正如他所说的。”希伯来语直译为“正如他所说的”；在本处语境中，这话指雅威先前关于赐地的应许。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这项守礼”或“这仪式”。这里所指的是逾越节的仪式性事奉。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 将来……时
  rationale: 这是引出未来情形的常见希伯来语表达；译为“将来……时”既保留时间和未来含义，也符合现代汉语习惯。
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: 你们进入……那地
  rationale: בוא 在此可指“进入”，与 אֶל 和“那地”搭配时，译为“进入”比“来到”更自然，并保留应许之地的语境。
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: 雅威……要赐给你们的
  rationale: יִתֵּן 在此指将来的赐予；“赐给”适合神赐土地的语境。神名 יְהוָה 音译为“雅威”，保留其专名性质。
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: 照他所应许
  rationale: 字面是“照他所说”；在这里指雅威先前关于赐地的话，因此“所应许”自然传达语境中的承诺意味，同时以脚注保留较字面的译法。
- source_word: וּשְׁמַרְתֶּם
  choice: 就要遵守
  rationale: שׁמר 与礼仪性事物连用时有谨守、遵行之意；“遵守”在现代汉语中清楚表达持续履行的义务。
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: 这礼仪
  rationale: עֲבֹדָה 基本义为“服事、事奉”，在本段特指逾越节的规定性仪式；“礼仪”简洁自然，并以脚注保留“事奉礼”的可能表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译，以体现这是神的专名，而非以“主”替代。
- issue: כַּאֲשֶׁר דִּבֵּר 是否明确译作“应许”
  choice: 照他所应许
  alternative: 照他所说
  rationale: “应许”表达上下文中赐地之言的承诺性质，但原词本身是“说”；脚注保留字面译法，避免遮蔽原文用词。
- issue: הָעֲבֹדָה 的礼仪含义
  choice: 礼仪
  alternative: 事奉礼；礼制
  rationale: 上下文指逾越节仪式，而不是一般劳动或抽象服事；“礼仪”能让普通读者清楚理解，同时不额外限定具体宗派性的礼仪观。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“将来……时，就要……”清楚呈现未来条件与随后的义务；“那地”“赐给”“遵守”保留圣经叙事和盟约语境的庄重感，同时避免文言化。
