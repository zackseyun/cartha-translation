base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: zh_hans
  text: 第一天，你们要举行圣会[a]；第七天也要举行圣会。这两天不可做任何工作；只有供每个人吃的食物，才可以为你们预备[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣会”也可译作“神圣的集会”；原文兼有受召聚集和分别为圣的含义。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“只有它可以为你们做”；按上下文，是指只准预备供各人食用的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: 圣会
  rationale: 该短语指受召而举行、分别为圣的聚会。“圣会”简洁自然，并兼顾聚集与神圣两层含义。
- source_word: יִהְיֶה לָכֶם
  choice: 你们要举行
  rationale: 希伯来文直译近于“要归你们有”；中文用“你们要举行”自然表达所规定的圣会，同时保留对受众的指向。
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: 这两天，任何工都不可做
  rationale: “任何工”体现 כָּל 的全面范围；“不可做”保留被动禁令的语气。“这两天”明确复数后缀所指的是前述第一天和第七天。
- source_word: אַךְ
  choice: 只有
  rationale: 此处引出禁令中唯一的例外，“只有”在现代汉语中清楚而简练。
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: 每个人要吃的
  rationale: נֶפֶשׁ 在此指个体的人，并非现代意义上与身体相对的“灵魂”；“要吃的”保留原文被吃之物的宽泛表达，不额外强化为绝对必要。
- source_word: הוּא לְבַדּוֹ יֵעָשֶׂה לָכֶם
  choice: 可以为你们预备
  rationale: הוּא לְבַדּוֹ 的排他意义已由前面的“只有”表达；在食用语境中将“做”译为“预备”较自然，而“为你们”保留 לָכֶם 的受益者表达。
