  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: zh_hans
  text: 到了半夜，雅威击杀了埃及地所有的长子：从坐在王位上的法老的长子，直到关在牢坑中的被掳者的长子[a]，以及所有头生的牲畜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “被掳者”也可译作“囚犯”；“牢坑”也可译作“地牢”。
    reason: 说明הַשְּׁבִי与בֵּית הַבּוֹר在此监禁语境中的可行译法。
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: 到了半夜
  rationale: 叙事承接词与时间短语合译为自然的现代汉语，既推进事件，又准确表达“在夜半”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: הִכָּה
  choice: 击杀了
  rationale: 原词基本意象是“击打”，本段语境明确指致死；“击杀”兼顾动作意象与结果。
- source_word: כָל בְּכוֹר
  choice: 所有的长子
  rationale: בכור指头生者；用于人时，“长子”在此上下文中自然清楚。כָל表达全体范围。
- source_word: מִבְּכֹר פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ עַד
  choice: 从坐在王位上的法老的长子，直到
  rationale: 保留מִן…עַד“从……直到……”的范围结构；将“坐在他王位上的”自然地连于法老，表现其最高统治地位。
- source_word: בְּכוֹר הַשְּׁבִי
  choice: 被掳者的长子
  rationale: שׁבי本义为被掳或被俘的人；“被掳者”比“囚犯”更直接保留其语义，同时不排除其受监禁的处境。
- source_word: אֲשֶׁר בְּבֵית הַבּוֹר
  choice: 关在牢坑中的
  rationale: בּוֹר本指“坑”，在监禁语境中指坑状牢狱；“牢坑”保留具体意象，也让现代读者易于理解。
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: 以及牲畜中所有头生的
  rationale: בְּהֵמָה在此泛指家畜，“牲畜”比仅指牛更准确；用于动物时以“头生的”区别于人的“长子”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名身份，也避免用“主”这一称号替代原文神名。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“从……直到……”保留原文由最高统治者到最低被囚者的社会范围；人用“长子”，牲畜用“头生的”，以符合汉语习惯并保持语义对应。
