base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: zh_hans
  text: 要在一所房子里吃[a]；不可把肉从房子里带到外面，也不可折断它的一根骨头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要在一个家户（家庭）中吃。”希伯来语“房子”也可指家户或家庭单位。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: 在一所房子里
  rationale: בַּיִת既可指实体房屋，也可指家户；下文明确禁止把肉带到房外，因此正文采用具体的空间意义“房子”，并以脚注保留“家中”的可能译法。
- source_word: יֵאָכֵל
  choice: 要……吃
  rationale: 这是אכל的尼法勒未完成式，在本条律例中表达被动意义和指令语气。汉语若机械译成“要被吃”，不够自然；“要在……里吃”既保留规定性，也符合现代汉语表达。
- source_word: לֹא תוֹצִיא
  choice: 不可……带到外面
  rationale: יצא的希斐勒式意为“使出去、带出去”。“不可……带到外面”自然、明确地表达禁止将肉移出房屋。
- source_word: מִן הַבָּשָׂר
  choice: 一点肉
  rationale: בָּשָׂר在食物语境中自然译为“肉”；介词מִן在此具有部分意义，否定句中的“一点肉”传达任何部分都不可带出的含义。
- source_word: חוּצָה
  choice: 到外面
  rationale: 该方向副词表示向外移动；“带到外面”清楚呈现其方向性。
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: 也不可折断它的一根骨头
  rationale: עֶצֶם虽为单数，在此具有逐一、概括性的禁令含义；“一根骨头”自然表达任何骨头都不可折断。בוֹ译为“它的”，保留其指向前文逾越节祭牲的概括性。
theological_decisions:
- issue: 末尾代词בוֹ的所指
  choice: 用“它的”指前文所论的逾越节祭牲整体
  alternative: 明确译作“羊羔的”
  rationale: 希伯来语代词为阳性单数，回指上下文中的逾越节祭牲；本节自身并未重述“羊羔”，故采用“它的”，避免加入原句没有明说的具体名词，同时与更广的逾越节羊羔语境相容。
translation_notes:
  register: 采用简洁、庄重而自然的现代汉语律例体。“不可”体现禁令语气；避免生硬的被动句，也不额外加入本节未明说的“羊羔”。
