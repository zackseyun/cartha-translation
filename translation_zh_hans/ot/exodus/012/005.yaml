  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: zh_hans
  text: 你们的羊羔[a]必须没有残疾，是一岁的公畜；你们要从绵羊或山羊中选取。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“שֶׂה”泛指羊群中的一只小牲畜，可以是绵羊羔，也可以是山羊羔；下半句明确说明可从绵羊或山羊中选取。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: 羊羔
  rationale: 该词指羊群中的一只小牲畜，可指绵羊羔或山羊羔。“羊羔”在现代中文中自然简洁，而下半句明确保留可从绵羊或山羊中选取的范围；脚注说明其较宽的希伯来语义。
- source_word: תָמִים
  choice: 没有残疾
  rationale: 在献祭语境中指牲畜没有缺陷或残损。“没有残疾”通俗明确，也保留礼仪资格方面的含义。
- source_word: זָכָר
  choice: 公畜
  rationale: 这是对牲畜性别的直接说明；“公畜”比单说“公的”更庄重清楚。
- source_word: בֶּן שָׁנָה
  choice: 一岁的
  rationale: 希伯来语字面为“一年之子”，指一岁的牲畜；采用自然的现代中文表达，不保留生硬的字面结构。
- source_word: יִהְיֶה לָכֶם
  choice: 你们所选的……必须
  rationale: 结合与格 לָכֶם 和上下文，将其表达为以色列人所选牲畜必须具备的条件；“必须”传达规定性语气。
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: 从绵羊或山羊中
  rationale: 两类牲畜是可供选择的来源。中文用“或”自然表达二者择一的许可范围，并避免被误解为必须两类都取。
- source_word: תִּקָּחוּ
  choice: 要……选取
  rationale: 该动词为第二人称复数的指令形式；“要选取”保留命令或规定的力度，并由前文补足所选对象。
theological_decisions: []
