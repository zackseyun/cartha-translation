  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: zh_hans
  text: 你们要这样吃：腰间束好带子[a]，脚上穿着鞋，手里拿着杖；要匆忙地吃[b]。这是雅威的逾越节[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“你们的腰束着”，指把衣服束好，准备立刻行动或出发。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“在匆忙中吃”；此词可能带有仓促离开的意味。
    reason: lexical_alternative
  - marker: c
    text: “逾越节”在这里也可译为“逾越祭”或“逾越祭物”；末句也可译作“这是献给雅威的逾越祭”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  choice: 要这样
  rationale: 直接引出进食的方式；现代汉语自然简洁，也保留指示和命令语气。
- source_word: תֹּאכְלוּ / וַאֲכַלְתֶּם
  choice: 你们要吃 / 你们要赶紧吃
  rationale: 两个动词形式在本段均具有指令作用，用“要”表达明确要求，同时避免过度强化为绝对命令。
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: 束紧腰带
  rationale: 希伯来语字面为“腰间束起”，描写把衣服束好、随时准备行动；此译保留具体动作，又符合现代汉语。
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: 脚上穿着鞋
  rationale: נַעַל泛指脚上的鞋履；古代通常为凉鞋，但正文用“鞋”更自然，也不把具体样式说得过死。
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: 手里拿着杖
  rationale: מַקֵּל可指手杖、木杖；在预备出行的语境中，“杖”简洁且准确。
- source_word: בְּחִפָּזוֹן
  choice: 赶紧
  rationale: 表达匆忙、急迫的状态，与全句所描写的随时启程相呼应；脚注补充可能包含仓促离开的意味。
- source_word: פֶּסַח
  choice: 逾越节
  rationale: 这是该礼仪的通行名称；本词也可能侧重逾越祭物或逾越祭，故以脚注保留词义范围。
- source_word: הוּא לַיהוָה
  choice: 这是雅威的逾越节
  rationale: לַיהוָה可表达归属、献予或为雅威而守；“雅威的”在正文中保留这种关系的宽度，避免只限定为其中一种。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作现代汉语音译，以专名呈现，而不以称号代替。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用以色列上帝的四字神名；“雅威”以现代汉语音译保留其专名性质。“耶和华”是传统形式，“上主”则是称号性替代。
- issue: פֶּסַח הוּא לַיהוָה 中逾越礼仪与雅威的关系
  choice: 这是雅威的逾越节
  alternative: 这是献给雅威的逾越祭
  rationale: 介词 לְ 的关系可涵盖归属、指向或奉献；正文采用较开放的所有格表达，不把它完全限定为祭物或奉献关系，脚注列出较具体的可能译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以并列短语重现整装待发的节奏；正文保留“雅威的逾越节”在归属、礼仪和奉献关系上的语义张力，并用脚注说明具体译法。
