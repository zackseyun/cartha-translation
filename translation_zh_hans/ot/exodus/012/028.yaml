base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: zh_hans
  text: 以色列子孙[a]就去照着做了；雅威怎样吩咐摩西和亚伦，他们就照样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 就去
  rationale: הלך的叙事连续式推动情节发展；“就去”自然表达他们随即前去执行指示，同时不增添原文没有明说的目的。
- source_word: וַיַּעֲשׂוּ
  choice: 照着做了
  rationale: עשה在这里回指此前所吩咐的逾越节安排；“照着做了”在现代汉语中自然地保留这种回指关系。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文“以色列的众子/后裔”这一家族性称呼，同时符合庄重、通顺的现代汉语表达；较惯用的“以色列人”列于脚注。
- source_word: כַּאֲשֶׁר
  choice: 怎样
  rationale: 与后面的“照样”构成汉语对应结构，清楚表达行动与命令完全相符。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 在上帝向摩西和亚伦颁下具体指示的语境中，“吩咐”自然庄重，也保留命令的权威性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以“主”这一称号替代。
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: 摩西和亚伦
  rationale: אֶת标明摩西和亚伦是“吩咐”的直接对象；不增译为“借着”，以免改变句法关系。
- source_word: כֵּן עָשׂוּ
  choice: 他们就照样做了
  rationale: 保留原文总结性的重复，强调以色列人的行动与雅威的命令完全一致。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用“雅威”来呈现这一专名，而不以称号替代。传统音译“耶和华”可作另一译法，但反映的是不同的读音传统。
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 正文保留原文的家族、后裔意象，不将其完全改写为民族称谓；脚注提供更惯用的现代汉语表达。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“怎样……照样……”保留原文命令与执行之间的对应关系；末句的重复没有删减，以保存希伯来文对完全顺服的强调。
