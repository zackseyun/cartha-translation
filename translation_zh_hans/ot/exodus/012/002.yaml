  text: הַ/חֹ֧דֶשׁ הַ/זֶּ֛ה לָ/כֶ֖ם רֹ֣אשׁ חֳדָשִׁ֑ים רִאשׁ֥וֹן הוּא֙ לָ/כֶ֔ם לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
