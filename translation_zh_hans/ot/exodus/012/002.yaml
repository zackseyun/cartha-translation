  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: zh_hans
  text: 这个月要作你们众月之首[a]；它要作你们一年中的第一个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这个新月”；希伯来语中的这个词也可指新月，但这里指历法上的月份。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: 这个月
  rationale: 在这段设立历法的语境中，חֹדֶשׁ 通常指历法上的“月”；虽也与新月周期相关，但“这个月”最自然准确。
- source_word: לָכֶם
  choice: 你们
  rationale: 介词短语表示相对于以色列群体的历法规定；在“作为你们……”这一汉语结构中，自然保留了其关系和受众指向。
- source_word: רֹאשׁ חֳדָשִׁים
  choice: 月份的开端
  rationale: רֹאשׁ 字面为“头”，在时间次序中表示“开端”或“首位”；此译保留构造关系，同时符合现代汉语。
- source_word: רִאשׁוֹן
  choice: 第一个月
  rationale: 该词明确表示次序上的“第一”；汉语中补出“月”，使其与后面的“年”构成清楚自然的历法表达。
- source_word: הוּא
  choice: 它要作为
  rationale: 代词回指“这个月”；汉语需补出判断表达，而“要作为”能体现本节设立历法的指令语气。
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: 一年中的
  rationale: 原短语说明这个月在一年各月中的次序；“一年中的第一个月”简洁自然，并保留历法范围。
theological_decisions:
- issue: 立法语境中希伯来语无动词句的语气
  choice: 用“要作为”表达设立性的将来／规范语气
  alternative: 用“是”表达一般现在判断
  rationale: 原文没有明示系词，但上下文是上帝为以色列设立历法的指令。“要作为”比单纯的“是”更能传达制度确立的语气，同时不增添教义解释。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“月份的开端”略保留原文措辞，与后半句“第一个月”形成强调性的平行；脚注保留“新月”这一真实词义可能。
