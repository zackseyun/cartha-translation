  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: zh_hans
  text: 不可把它的任何部分留到早晨；若有剩到早晨的，就要用火烧掉。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: 留
  rationale: 该词是 יתר 的使役式，在此表示使某物留下、剩下；“留到早晨”符合现代汉语习惯，也准确表达禁令。
- source_word: מִמֶּנּוּ
  choice: 它的任何部分
  rationale: מן 加第三人称单数阳性后缀本可直译为“从它”；在否定命令中指逾越节祭牲不可有任何部分留下，因此译为“它的任何部分”更自然清楚。
- source_word: עַד בֹּקֶר
  choice: 到早晨
  rationale: 该短语标明时间界限；与“留”或“剩”搭配时，“到早晨”是自然、准确的现代汉语表达。
- source_word: הַנֹּתָר
  choice: 若有剩到早晨的
  rationale: יתר 的被动分词指所剩之物。原文带定冠词，可理解为“那剩下的”；汉语用条件式“若有……的”自然承接前一禁令，同时不改变任何剩余物都须处理的要求。
- source_word: בָּאֵשׁ
  choice: 用火
  rationale: 介词 בְּ 在此表示手段；“用火烧掉”是自然汉语，并保留以火处理剩余物的明确规定。
- source_word: תִּשְׂרֹפוּ
  choice: 要……烧掉
  rationale: 未完成式在律法指令中具有命令效力；“要”体现指令性，“烧掉”则自然表达彻底焚烧处理。
theological_decisions:
- issue: 关于逾越节祭牲剩余部分的命令性质
  choice: 译为先禁止留到早晨，再命令将任何剩余部分用火烧掉
  alternative: 视为不具律法约束力的单纯实用安排
  rationale: 本节以直接指令规定礼仪行为。译文保留禁止与处置命令这两个层次，不添加经文本身未说明的象征意义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”表达正式禁令，“若有……就要……”自然呈现前一禁令之后对实际剩余物的处置要求。原文语义清楚，无需脚注；英语咨询文本中的脚注所提示的差异已由“剩到早晨的”直接表达。
