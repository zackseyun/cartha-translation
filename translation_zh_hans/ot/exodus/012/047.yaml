  text: כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: zh_hans
  text: 以色列全会众都要这样行[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列全体会众都要遵守这礼。”
    reason: 词义及指代的另一种可能表达：יַעֲשׂוּ在本语境可译为“遵守”，אֹתוֹ也可按上下文明确为“这礼”。
lexical_decisions:
- source_word: כָּל
  choice: 全
  rationale: 表示整体和总括范围；与“会众”搭配自然，保留全体性的强调。
- source_word: עֲדַת
  choice: 会众
  rationale: עֵדָה指共同体，尤其可指聚集的以色列群体；“会众”既符合逾越节条例的群体语境，也保持庄重而通俗。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 按现代中文圣经传统保留专名的通行译法。
- source_word: יַעֲשׂוּ
  choice: 要……行
  rationale: עָשָׂה基本义为“做、行”；此处指实行逾越节条例。“要……行”保留原文宽泛用词及命令性，避免在正文中过度明确为“守”。
- source_word: אֹתוֹ
  choice: 这样
  rationale: 阳性单数宾语代词回指上下文所述之事。中文若直译“它”较生硬且指代不清，“这样行”自然地保留回指功能，又不把所指限定为礼仪、逾越节或羊羔。
theological_decisions:
- issue: 逾越节命令的群体主体
  choice: “以色列全会众”将以色列共同体作为整体置于命令之下。
  alternative: 译成“每个以色列人”，把命令明确个体化。
  rationale: 原文采用集合名词עֵדָה并以יִשְׂרָאֵל限定，重点是整个群体；不宜加入原文未明说的逐一个体化含义。
- issue: 宾语所指
  choice: 用“这样”保留对上下文的概括性回指。
  alternative: 明确译为“守逾越节”或“举行这礼仪”。
  rationale: אֹתוֹ本身只是代词，其具体所指可理解为逾越节礼仪、相关规定或前述事项；正文不应消除这种指代上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全会众”简洁体现共同体整体；“这样行”比“行它”自然，并保持原文动词和代词的概括性。
