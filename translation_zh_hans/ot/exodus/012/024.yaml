base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/024.yaml
  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: zh_hans
  text: 你们要谨守这事[a]，作为你和你儿子[b]永远的定例。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这件事”或“这话”。希伯来语这个词可广泛指事情、事物或所说的话。
    reason: lexical_alternative
  - marker: b
    text: 或译“儿女”或“后代”。希伯来文直译为“儿子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 你们要谨守
  rationale: שׁמר在律法和盟约语境中兼有守护、遵行和持续持守之意；“谨守”自然凝练，并保留郑重的义务色彩。动词为第二人称阳性复数，故译作“你们”。
- source_word: הַדָּבָר הַזֶּה
  choice: 这事
  rationale: דָּבָר可指话语、事情或事项；此处回指此前所述的逾越节礼仪。“这事”保持其宽泛指称，不将其限缩为单一句命令或口头话语。
- source_word: לְחָק
  choice: 作为……定例
  rationale: חֹק指制定并固定下来的规例；“定例”保留其法定、持续有效的意味，也符合现代中文圣经语体。
- source_word: לְךָ וּלְבָנֶיךָ
  choice: 你和你儿子
  rationale: 希伯来文由第二人称阳性单数“你”和“你的儿子”构成。正文保留原文从复数“你们”转为单数“你”的形式，也不将“儿子”直接泛化为“儿女”或“后代”。
- source_word: עַד עוֹלָם
  choice: 永远
  rationale: עַד עוֹלָם表达持续、永久的时限；“永远”是简洁自然且力度相当的对应表达。
theological_decisions:
- issue: “你儿子”所表达的盟约承继范围
  choice: 正文保留“你儿子”
  alternative: 你儿女；你后代
  rationale: 原文明确使用阳性复数名词“儿子”。它在家庭与世代承继的语境中可能具有代表性，但正文不以解释性扩展取代原有词形；其他可能译法列入脚注。
- issue: 第二人称由复数转为单数
  choice: 保留“你们……你……”的转换
  alternative: 统一译为“你们……你们的……”
  rationale: 原文先以复数动词向群体发令，随后以单数代词表达个体及其家庭的责任。保留这一转换，可呈现群体命令与个人世代责任之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“谨守”“定例”保留律法语境的正式感，但避免过度古雅。正文保留原文第二人称复数转单数的变化，并将脚注标记紧接相关词语。
