base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: zh_hans
  text: 就在那一天，雅威把以色列子孙[a]从埃及地带出来，按着他们的队伍[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”，也可译作“以色列人”；这是以家族关系指称整个群体的说法。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“按着他们的军旅”或“按着他们的各支队伍”。原词可强调他们离开时有组织的编组。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: 就在这一天
  rationale: וַיְהִי在这里引出时间背景，不必机械译出“事情发生了”；בְּעֶצֶם הַיּוֹם הַזֶּה强调时间确切，“就在这一天”自然地保留了这种强调。
- source_word: הוֹצִיא
  choice: 带领……出来了
  rationale: יצא的使役式表示使人出来，在出埃及的语境中可自然译为“带领……出来”，既保留使役含义，也不额外说明具体方式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，而不以称号代替。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文“以色列的众子”这一家族性、群体性的表达；“以色列子孙”在现代汉语中庄重而易懂，并包含整个群体。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 明确保留אֶרֶץ“地、国土”，并以“从”表达离开埃及的方向。
- source_word: עַל צִבְאֹתָם
  choice: 按着他们的队伍
  rationale: צְבָאוֹת可指军旅、众队或有组织的群体；本句着重于出发时的编组秩序，译作“队伍”可避免无根据地强化作战含义，同时保留原文可能带有的军事色彩。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”将其作为专名呈现；不采用“主”，以免把名字改成称号。“耶和华”是另一传统音译。
- issue: בְּנֵי יִשְׂרָאֵל的群体含义
  choice: 以色列子孙
  alternative: 以色列众子；以色列人
  rationale: “以色列子孙”保留原文以共同祖先和家族关系指称群体的方式，同时在现代汉语中可自然涵盖全体以色列民，不把原文缩限为只有男性。
- issue: צִבְאֹתָם是否应作军事化理解
  choice: 他们的队伍
  alternative: 他们的军旅；他们的各支队伍
  rationale: 该词可以具有军事含义，也可泛指编组有序的群体。本节没有明说这些人正在作战，因此正文采用较宽的“队伍”，并在脚注保留“军旅”等可能译法。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“就在”传达原文对确切日期的强调；语序按汉语习惯调整，但保留雅威为行动主体、以色列子孙离开埃及地及其按队伍编组这三项信息。
