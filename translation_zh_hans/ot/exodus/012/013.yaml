revisions:
- from: 这血要在你们所住的房屋上给你们作记号。我看见这血，就必越过你们[a]。我击打埃及地的时候，你们中间必没有灾祸来毁灭你们[b]。
  to: 这血要在你们所住的房屋上给你们作记号。我看见这血，就必越过你们[a]。我击打埃及地的时候，必没有灾殃临到你们，使你们遭毁灭[b]。
  rationale: 修订末句以更自然的现代汉语表达灾殃不临到以色列人，并保留原文将灾殃与毁灭相连的目的／结果性含义。脚注b改为实际反映该处可将למשחית理解为“毁灭者”的替代读法，避免把两者不当地并列为两个独立事件。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:25:54Z'
