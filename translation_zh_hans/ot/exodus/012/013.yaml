base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: zh_hans
  text: 这血要在你们所住的房屋上给你们作记号。我看见这血，就必越过你们[a]。我击打埃及地的时候，必没有灾殃临到你们，使你们遭毁灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“饶过你们”或“保护你们”。
    reason: lexical_alternative
  - marker: b
    text: “毁灭”一词也可按名词理解为“毁灭者”；或译：“毁灭者击打埃及地的时候，必没有灾殃临到你们。”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: 这血要……给你们作记号
  rationale: 保留血的特指性和未来、应许性的语气；“给你们作记号”自然表达 לָכֶם 的受益或关联意义。
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: 在你们所住的房屋上
  rationale: עַל 表示血所在的位置；“所住的”自然传达“你们在那里”的关系从句。
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: 我看见这血
  rationale: 按上下文表达动作次序；希伯来语虽以并列形式出现，汉语无需额外添加因果含义。
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: 就必越过你们
  rationale: “越过”保留 פסח 与逾越事件的词义和经典联系；“必”体现应许语气，“就”呈现看见血之后的动作关系。
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: 你们中间必没有灾祸
  rationale: “你们中间”对应 בָכֶם，“灾祸”能自然表达 נֶגֶף 所指的击打或灾殃。
- source_word: לְמַשְׁחִית
  choice: 来毁灭你们
  rationale: 将该形式理解为灾祸的目的或结果，不在正文中明确引入一个具人格的“毁灭者”；补出“你们”是汉语为表达完整所需，所指由上下文确定。
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: 我击打埃及地的时候
  rationale: בְּ 加不定词结构表达时间背景；“击打埃及地”既贴近原文，也符合庄重的现代汉语。
theological_decisions:
- issue: פסח על 在逾越节设立语境中的含义
  choice: 越过你们
  alternative: 饶过你们；保护你们
  rationale: 正文保留该动词与“逾越”事件的词汇联系，不把其含义只限定为结果性的“饶过”或“保护”；脚注列出可能的语义侧重。
- issue: לְמַשְׁחִית 是表示毁灭的目的，还是指具人格的毁灭者
  choice: 来毁灭你们
  alternative: 毁灭者必不临到你们中间
  rationale: 原文形式容许目的或结果性理解，也可能名词化为“毁灭者”。正文采用动词性表达，避免增加经文本节没有明确要求的具人格行动者，同时在脚注保留另一读法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这血”“记号”“击打”等词保持经文意象；句序略作汉语化处理，将时间从句置于末句开头。脚注标记紧跟各自涉及的词句，避免英文咨询层中标记位置与注释内容错配。
