base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/034.yaml
  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: zh_hans
  text: 于是，百姓带着尚未发酵的面团离开；他们的揉面盆[a]包在外衣里，扛在肩上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文指预备或揉制面团时使用的容器，具体形制不详；也可译作“揉面槽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: 带走
  rationale: נשׂא在这里指百姓离开时携带物品；“带走”既表达负载携行，也自然衔接出走的叙事语境。
- source_word: הָעָם
  choice: 百姓
  rationale: עָם在本段集体指以色列民；“百姓”是自然、庄重且符合叙事语体的译法。
- source_word: בְּצֵקוֹ
  choice: 面团
  rationale: 原文后缀为单数，与集体名词“百姓”呼应；汉语不必明说“他们的”，即可自然保留集体所带面团的意思。
- source_word: טֶרֶם יֶחְמָץ
  choice: 还没有发起来
  rationale: 该短语表示面团尚未来得及因酵而膨发；“还没有发起来”比技术性的“尚未发酵”更贴近日常制面语境，同时保留逾越节叙事中的含义。
- source_word: מִשְׁאֲרֹתָם
  choice: 他们的揉面盆
  rationale: 该名词指预备或揉制面团所用的容器；“揉面盆”清楚易懂。器皿的具体形制并不确定，因此以脚注说明。
- source_word: צְרֻרֹת
  choice: 包扎
  rationale: צרר的被动形式描绘器皿被裹住并扎好以便携带；“包扎”同时呈现包裹和固定的动作。
- source_word: בְּשִׂמְלֹתָם
  choice: 在外衣里
  rationale: שִׂמְלָה通常指衣服，尤其可作包裹之用的外衣；“外衣”比泛称“衣服”更具体，也符合旅行时包裹物品的画面。
- source_word: עַל שִׁכְמָם
  choice: 扛在肩上
  rationale: 该短语表示把包裹置于肩头携行；“扛在肩上”是现代汉语中自然且形象的表达。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“发起来”符合普通读者熟悉的制面表达；分号将“带走面团”与“揉面盆如何携带”清楚区分，同时保留原文紧密连续的动作画面。
