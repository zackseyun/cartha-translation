  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: zh_hans
  text: 以色列人从兰塞出发，前往疏割；徒步的男人约有六十万，不包括孩子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孩子”所译的希伯来语也可指“幼小的家属”。他们不包括在前述约六十万男人的数目之内。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: נסע在迁行语境中指拔营出发或启程；“起程”既体现旅程开始，也符合现代汉语叙事。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此是族群称谓；“以色列人”自然、准确，也不误示只有男性。
- source_word: מֵרַעְמְסֵס
  choice: 从兰塞
  rationale: מִן表示起点“从”；“兰塞”采用现代中文圣经地名的常见音译。
- source_word: סֻכֹּתָה
  choice: 往疏割去
  rationale: 地名后的方向词尾־ָה表示朝向该地；“往……去”明确表达目的地。
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: 约有六十万
  rationale: 数字前的כְּ表示约数，因此译作“约有”，避免将数字表达为严格精确值。
- source_word: רַגְלִי הַגְּבָרִים
  choice: 步行的男人
  rationale: רַגְלִי表示徒步者，הַגְּבָרִים明确指男人；此译保留了计数对象和步行方式，避免泛化为全体人口。
- source_word: לְבַד מִטָּף
  choice: 此外还有孩子
  rationale: לְבַד מִן表示不计在前述数目之内；טַף指幼小者或孩子，也可能带有随行小家属的意味。正文采用自然的“孩子”，脚注保留词义范围。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“以色列人”比字面的“以色列的众子”更符合现代汉语族群称谓；分号帮助读者辨明迁行叙述与人数统计。“男人”保留原文的男性限定，不扩译为“成人”，因为原文没有明说年龄界限。
