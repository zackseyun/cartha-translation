  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: zh_hans
  text: 不可吃其中任何生的肉，也不可吃用水煮的；只可连头、腿和内脏一起用火烤。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: 生肉
  rationale: 在烹调语境中，指未经充分烹制的肉；“生肉”简明自然，同时用脚注保留“半生不熟”的可能译法。
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: 也不可吃用水煮的
  rationale: בשל 的强化结构加上“在水中”，明确指水煮；中文以“用水煮的”自然表达其具体烹调方式。
- source_word: כִּי אִם
  choice: 只可
  rationale: 该短语在否定句后引出排他性的例外；“只可”准确体现“不可……只可……”的强烈对比。
- source_word: צְלִי אֵשׁ
  choice: 用火烤的
  rationale: 保留以火烤制的方式，且符合现代汉语习惯。
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: 头、腿和内脏都要一起烤
  rationale: 重复的 עַל 在此列举随同烤制的部位；译文自然表达整只羊连这些部分一同烤的要求，不额外断定未明说的处理细节。
- source_word: מִמֶּנּוּ
  choice: 这羊的一点
  rationale: 表达希伯来语的部分义，即不可吃其中任何一部分；补出上下文中的“羊”使中文指代清楚。
