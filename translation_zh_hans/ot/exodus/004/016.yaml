  text: וְ/דִבֶּר ה֥וּא לְ/ךָ֖ אֶל הָ/עָ֑ם וְ/הָ֤יָה הוּא֙ יִֽהְיֶה לְּ/ךָ֣ לְ/פֶ֔ה וְ/אַתָּ֖ה תִּֽהְיֶה לּ֥/וֹ לֵֽ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: zh_hans
  text: 他要替你向百姓说话；他要作你的口，你要作他的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “作他的神”也可理解为“对他如同神”：摩西把从神领受的话传给亚伦，亚伦再替摩西发言；这里说的是神所赋予的权威和代表角色，并不是说摩西本身成为神。
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: 他要替你向百姓说话
  rationale: דבר在此指“说话”；לְךָ结合语境表示替摩西、代表摩西，אֶל־הָעָם是“向百姓”。这一译法自然表达亚伦代摩西发言的关系。
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: 他要作你的口
  rationale: 保留פֶּה“口”的原文比喻，同时“作你的口”在现代汉语中可理解为充当发言者。希伯来文重复היה带有强调意味，汉语无需机械重现。
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: 你要作他的神
  rationale: 紧贴希伯来文的表语结构，并保留“口”与“神”之间强烈的角色对应。上下文说明这是传达神话语的代表性关系，并非宣称摩西在本体上成为神。
theological_decisions:
- issue: לֵאלֹהִים是否应明译为“像神一样”，以排除摩西具有神性的理解
  choice: 你要作他的神
  alternative: 你对他要像神一样／你要在他面前代表神
  rationale: 原文没有明示比较词，直译能保留其力度与神学张力；结合4:15及7:1，所指是摩西领受并传递神话语、亚伦代为发言的权威和代表角色。脚注说明这一语境含义，而不在正文中替原文消解歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“作你的口”保留原文鲜明的身体比喻；“作他的神”保留希伯来文未加比较词的强烈表述，并以脚注交代其语境意义。
