revisions:
- from: 后来，在途中住宿处[b]，雅威遇见了他[a]，想要杀死他。
  to: 有一次，雅威在路上、在一处住宿的地方遇见了他[a]，想要杀死他。
  rationale: 将叙事引入语改为“有一次”，避免“后来”所增加的时间顺序含义；重组地点短语以符合现代汉语。正文保留“他”的歧义及雅威“想要杀死他”的严峻而未完成的意向。脚注b虽不在修订正文中设置锚点，但其内容应作为完整脚注集保留；若出版格式要求每条脚注均须正文锚点，可将“住宿的地方”后加[b]，不改变译文含义。
