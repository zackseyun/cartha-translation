source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: zh_hans
  text: 有一次，雅威在路上、在一处住宿的地方遇见了他[a]，想要杀死他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有明确说明这里的“他”是谁；可能指摩西，也有人认为是他的儿子。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 后来
  rationale: 这是叙事性的 wayyiqtol 形式，用来推进故事并引出新事件；“后来”在现代汉语中自然简洁，不采用古雅的“于是有一天”等表达。
- source_word: בַדֶּרֶךְ
  choice: 在途中
  rationale: 直接表达旅程中的位置，贴近希伯来语的处所短语，也符合现代汉语习惯。
- source_word: בַמָּלוֹן
  choice: 住宿处
  rationale: מָלוֹן 指供人过夜停宿的地方，不一定是商业经营的客店；“住宿处”避免时代错置。
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: 遇见了他
  rationale: פגע 的基本义是遇见或碰上；敌对意味由下文“想要杀死他”表达，不在此处提前加强为“袭击”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名处理四字神名，以现代汉语常见音译“雅威”保留其作为以色列之上帝名字的性质，而不以称号替代。
- source_word: וַיְבַקֵּשׁ
  choice: 想要
  rationale: בקש 在此表达寻求采取某行动的意图。“想要”自然清楚，并保留叙事张力，不额外断定行动进行到何种程度。
- source_word: הֲמִיתוֹ
  choice: 杀死他
  rationale: 这是 מות 的使役式不定词并带第三人称阳性单数后缀，直指使其死亡；“杀死他”在现代汉语中准确而有力度。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名。正文采用音译“雅威”，保留专名性质，不以“主”等称号代替。
- issue: 两个阳性单数代词后缀所指的人
  choice: 正文保留为“他”，不指明是谁
  alternative: 明确译为“摩西”或“摩西的儿子”
  rationale: 本节自身没有明说代词的先行词。上下文常被理解为摩西，但也有人认为是他的儿子；正文不替原文消除这一真实歧义。
- issue: 雅威要杀死某人的叙事张力
  choice: 直译为“想要杀死他”
  alternative: 弱化为“威胁他”或解释为象征性危险
  rationale: 原文明确使用“使……死亡”的动词，不说明更深层原因；译文既保留行动的严重性，也不在本节中添加解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“住宿处”避免“客店”可能带来的商业旅馆联想；代词保持原文歧义。
