base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: zh_hans
  text: 他就说：“把它扔到地上。”摩西便把它扔到地上，它就变成了一条蛇；摩西从它面前逃走了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从它面前”也可直译为“从他面前”；希伯来语代词为阳性单数。这里按上下文理解为指那条蛇，意思是摩西躲开它。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 以“就”表达未完成式连续叙事的推进，同时保留原文未在本节重述说话者身份的特点。
- source_word: הַשְׁלִיכֵהוּ
  choice: 把它扔到地上
  rationale: שׁלך在此是命令式，所带阳性单数后缀承接上一节的杖；“扔”是现代汉语自然、准确的表达。
- source_word: אַרְצָה
  choice: 到地上
  rationale: 名词“地”带方向词尾，表示朝向或落到地面；“到地上”既体现方向，也符合汉语动作表达。
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: 摩西便把它扔到地上
  rationale: 补出原文明确出现的主语“摩西”，并用“便”表现他随即遵命而行的叙事关系。
- source_word: וַיְהִי לְנָחָשׁ
  choice: 它就变成了一条蛇
  rationale: נָחָשׁ通常指蛇；“蛇”比偏古雅的“蛇类”或带额外联想的其他译法更清楚自然。
- source_word: וַיָּנָס
  choice: 逃开了
  rationale: 该动词表示逃走、躲避；“逃开”保留受惊避开的力度，又符合现代汉语。
- source_word: מִפָּנָיו
  choice: 从它面前
  rationale: 较贴近字面的“从……面前”，并按最近的先行对象将阳性单数后缀理解为那条蛇；代词形式上的可能歧义在脚注说明。
theological_decisions:
- issue: מִפָּנָיו的阳性单数代词所指
  choice: 正文译作“它”，指刚变成的蛇
  alternative: 译作“他”，理解为某位男性所指者
  rationale: 最近且最自然的先行对象是נָחָשׁ（蛇，希伯来语阳性名词），叙事情境也表明摩西是在躲避蛇；同时以脚注保留代词形式本身可译作“他”的可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“他就说”保留原文承接上文的主语表达；“扔到地上”“变成了一条蛇”“逃开了”均为普通读者容易理解的现代汉语。
