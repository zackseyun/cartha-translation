  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: zh_hans
  text: 耶和华又对他说：“请把手伸进怀里。”他就把手伸进怀里；一拿出来，看哪，他手上长了麻风[a]，白得像雪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文指旧约所称的 צָרַעַת；这种病症未必与现代医学所说的麻风病（汉森病）完全相同。
    reason: 说明传统译名与现代医学诊断之间并非必然完全对应。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，直接对应四字神名，不以“主”替代。
- source_word: עוֹד
  choice: 又
  rationale: 此处表示在前一个神迹之后再作吩咐；“又”简洁自然。
- source_word: הָבֵא נָא יָדְךָ
  choice: 请把手伸进
  rationale: הָבֵא 字面为“带入”，但在手进入怀中的语境里，“伸进”是自然准确的现代汉语；“请”体现 נָא 对命令语气的缓和。
- source_word: חֵיק
  choice: 怀里
  rationale: 指胸前或衣服前襟形成、可把东西放入的部位；“怀里”比“胸膛”更符合动作，也比“衣襟内”更自然，同时不作过度具体化。
- source_word: וַיּוֹצִאָהּ
  choice: 等他抽出来时
  rationale: 宾语后缀指“手”；汉语用“抽出来”自然呈现从怀中取出手的动作，并以时间结构顺畅连接结果。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注目、突然展示神迹结果的指示与庄重语气。
- source_word: מְצֹרַעַת
  choice: 患了麻风病
  rationale: 沿用旧约 צָרַעַת 的传统、简明译法；用脚注说明其范围未必等同现代医学所称的汉森病。
- source_word: כַּשָּׁלֶג
  choice: 像雪一样
  rationale: 原文只作“像雪”的比较，并未明说“白”；此译保留原文的简洁及比较所可能涉及的外观特征，不擅自补足。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留专名而不以“主”代替；“耶和华”是现代简体中文普通读者最熟悉、最易识别的传统形式，同时不改变此处神亲自说话的叙事意义。
- issue: מְצֹרַעַת 所指病症的范围
  choice: 正文译作“患了麻风病”，脚注保留医学对应上的不确定性
  alternative: 患了皮肤病
  rationale: 该词属于旧约礼仪与叙事语境中的 צָרַעַת 范畴，不能确定等同现代汉森病；正文保留传统术语，脚注防止读者误作狭义现代诊断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“请”保留命令缓和语气；“看哪”刻意保留叙事中的突显效果。分号呈现命令、执行与神迹显现的连续推进。
