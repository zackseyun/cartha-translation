    issue: “他的手患了麻风病，像雪一样”中的比较对象在中文中不明确。
    rationale: 原文的“像雪”在语境中指患处／手呈雪白色；中文若不明示“白”，容易被读作病症本身“像雪”，且句子不够自然。
  - severity: low
    issue: “等他抽出来时”略带口语性和较强的“抽拉”动作色彩。
    rationale: וַיּוֹצִאָהּ只是把手取出；“一拿出来”更自然地保留顺接及结果显现。
  revised_text: 耶和华又对他说：“请把手伸进怀里。”他就把手伸进怀里；一拿出来，看哪，他手上长了麻风[a]，白得像雪。
