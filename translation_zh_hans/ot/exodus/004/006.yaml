- from: 耶和华又对他说：“请把手伸进怀里。”他就把手伸进怀里；等他抽出来时，看哪，他的手患了麻风病[a]，像雪一样。
  to: 耶和华又对他说：“请把手伸进怀里。”他就把手伸进怀里；一拿出来，看哪，他手上长了麻风[a]，白得像雪。
  rationale: 修订只澄清“像雪”在本节所表达的雪白外观，并将取出手的动作改为更自然的现代汉语；不改变原文的叙事顺序、神名、病症传统译名或脚注所保留的医学不确定性。
