base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: zh_hans
  text: 摩西把雅威所说的一切话[a]，以及雅威吩咐他施行的一切记号，都告诉了亚伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威差遣他去传达的一切话。”希伯来语的关系从句也可理解为修饰“雅威”，即雅威曾差遣摩西；两种理解都表明雅威差遣了摩西。
    reason: 保留אֲשֶׁר שְׁלָחוֹ可修饰“雅威”或与“话”紧密相连的句法歧义。
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 告诉了
  rationale: 该词在使役词干中表示“使人知道、告知”。“告诉了”符合现代汉语叙事，也清楚表达摩西向亚伦转述的动作。
- source_word: דִּבְרֵי יְהוָה
  choice: 雅威所说的一切话
  rationale: דָּבָר可指话语、事情或信息；这里涉及摩西转述所领受的使命，用“一切话”保留复数形式和言说意味，同时用“所说的”使汉语自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名YHWH的通行现代汉语音译处理，保留专名性质，不以“主”这一称号替代。
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: 差遣他的
  rationale: 正文将关系从句理解为修饰雅威，即雅威差遣了摩西；这是就近先行词所支持的自然读法。希伯来语也容许从句与“话”紧密相连，故以脚注保留另一读法。
- source_word: הָאֹתֹת
  choice: 记号
  rationale: אוֹת的基本义是可辨认的“记号、征兆”；本段语境中的记号具有超自然性质，但正文不额外加入“神奇”一词，以免超出原词。
- source_word: אֲשֶׁר צִוָּהוּ
  choice: 吩咐他施行的
  rationale: 原文直译是“他所吩咐他的”，关系对象为前面的记号。现代汉语若不补出动作会显得残缺，因此补出语境隐含的“施行”，表示雅威命摩西行这些记号。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用以色列上帝的专名YHWH。正文采用“雅威”作为现代汉语音译，以区别于称号“主”，也避免沿用较不贴近现今学界拟音的“耶和华”。
- issue: אֲשֶׁר שְׁלָחוֹ所修饰的成分
  choice: 理解为修饰“雅威”：差遣摩西的是雅威
  alternative: 理解为与“一切话”紧密相连：雅威差摩西传达这些话
  rationale: 关系从句紧随יְהוָה，因而正文采用以雅威为先行词的自然分析；但希伯来句法容许工具或内容性的理解，神学意义也并无冲突，故在脚注中保留。
- issue: 记号与“吩咐”的关系
  choice: 雅威吩咐摩西施行这些记号
  alternative: 雅威就这些记号吩咐了摩西
  rationale: 原文没有明说“施行”，但上下文表明摩西受命展示记号。补出该动词使汉语完整，却不把记号的具体方式进一步限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“告诉了”保持叙事清晰；“一切话”和“一切记号”保留原文的重复结构。为避免代词连续出现造成误解，后半句再次写出“雅威”。脚注标记[a]已置于正文相关短语之后。
