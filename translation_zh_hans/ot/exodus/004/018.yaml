base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: zh_hans
  text: 于是，摩西动身回到他的岳父叶特罗[a]那里，对他说：“请让我去，回到在埃及的弟兄们[b]那里，看看他们是否还活着。”叶特罗对摩西说：“你平安地去吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节原文第一次称他为“叶特”，第二次称为“叶特罗”；两处显然指同一个人，正文统一译作“叶特罗”。
    reason: textual_variant
  - marker: b
    text: 或译“亲族”。原文直译“我的弟兄们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: 于是，摩西回到
  rationale: 两个连续的叙事动词推动情节发展；中文以“于是……回到”自然表达先去而后返回的整体动作，避免生硬重复“去并返回”。
- source_word: יֶתֶר / יִתְרוֹ
  choice: 叶特罗
  rationale: 本节首次写作“叶特”，末次写作“叶特罗”，所指显然为同一人；正文统一采用读者较熟悉的“叶特罗”，并用脚注保留原文差异。
- source_word: חֹתְנוֹ
  choice: 岳父
  rationale: 在此语境中明确指摩西妻子的父亲；“岳父”是现代汉语准确自然的对应词。
- source_word: אֵלֲכָה נָּא וְאָשׁוּבָה
  choice: 请让我回到
  rationale: 两个表意愿的动词形式连同נָא表达谦恭请求；“请让我……”保留摩西向岳父请求许可的语气。
- source_word: אַחַי
  choice: 弟兄们
  rationale: 原文直译为“我的弟兄们”，在语境中也可泛指同族或亲属；正文保留原词的具体表达，不将其范围强行限定。
- source_word: וְאֶרְאֶה
  choice: 看看
  rationale: 承接返回埃及的目的；“看看”在现代汉语中自然表达亲自去察看、确认。
- source_word: הַעוֹדָם חַיִּים
  choice: 他们是否还活着
  rationale: 准确保留疑问语气以及“仍然、还”的含义。
- source_word: לֵךְ לְשָׁלוֹם
  choice: 平安地去吧
  rationale: 保留希伯来语祝福和准许离去的惯用表达，同时采用自然庄重的现代汉语。
theological_decisions: []
translation_notes:
