  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו מִ֣י שָׂ֣ם פֶּה֮ לָֽ/אָדָם֒ א֚וֹ מִֽי יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲ/לֹ֥א אָנֹכִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: zh_hans
  text: 耶和华对他说：“谁使人有口？谁使人哑、聋、眼明或眼瞎？岂不是我耶和华吗？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: 使人有口
  rationale: 直译为“给人安置口”在现代汉语中生硬；“使人有口”保留上帝赋予人说话器官与能力的基本意象。
- source_word: אִלֵּם
  choice: 哑
  rationale: 对应不能说话的状态，简洁并符合本节与“口”的语义关联。
- source_word: חֵרֵשׁ
  choice: 聋
  rationale: 直接对应听觉缺失，且与上下各项构成整齐列举。
- source_word: פִקֵּחַ
  choice: 眼明
  rationale: 此处与“眼瞎”相对，指能看见；“眼明”比泛义的“明眼”更自然地保持身体感官层面的对照。
- source_word: עִוֵּר
  choice: 眼瞎
  rationale: 与“眼明”形成清楚对照，并准确表达不能看见。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的传统专名译法，并在本节首尾一致呈现。
theological_decisions:
- issue: 上帝与人的言语及感官能力或缺失之间的关系
  choice: 保留“谁使……岂不是我耶和华吗”的直接归属表达
  alternative: 弱化为上帝仅允许或容许这些状况
  rationale: 希伯来文本用 יָשׂוּם（使、置）并以反问明确指向耶和华；译文不替原文缓和其神学张力。
- issue: פִקֵּחַ 的语义范围
  choice: 译为“眼明”，与“眼瞎”形成感官对照
  alternative: 译为“看得见”或较宽泛的“有洞察力”
  rationale: 列举“哑、聋、眼明、眼瞎”的身体状态以及与 עִוֵּר 的并列关系支持视觉义，同时避免引入属灵洞察的解释。
translation_notes:
  register: 采用庄重、自然的现代标准普通话。保留希伯来原文简短有力的连续反问和四项并列，不增加解释性措辞。
