  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: zh_hans
  text: 亚伦把雅威对摩西所说的一切话都讲了，又在百姓眼前[a]行了那些记号。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当着百姓的面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אַהֲרֹן
  choice: 亚伦……讲了
  rationale: דבר 的皮勒形在这里表示“说、讲”；“讲了”与后面的“一切话”搭配自然，也符合叙事语体。
- source_word: אֵת כָּל הַדְּבָרִים
  choice: 一切话
  rationale: 保留希伯来文“所有的话”的具体表达，不笼统化为“一切事情”。
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: 雅威对摩西所说的
  rationale: 用“所说的”自然表达先于亚伦转述而发生的话语，同时保留原文中雅威、摩西及说话对象之间的关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其作为专名的性质，不以称号代替。
- source_word: וַיַּעַשׂ
  choice: 行了
  rationale: עשה 与“记号”连用时译作“行了”简洁自然，表达施行这些记号，而不额外说明其机制。
- source_word: הָאֹתֹת
  choice: 那些记号
  rationale: אותות 指上文所赐、用来证实使命的记号；“记号”保留该词的基本意义，而“那些”体现其在语境中已有明确所指。
- source_word: לְעֵינֵי הָעָם
  choice: 在百姓眼前
  rationale: 贴近原文“在百姓眼中／眼前”的形象表达，在现代汉语中也自然可懂。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确呈现其为神的专名。“耶和华”是汉语传统中广为人知的另一音译。
- issue: הָאֹתֹת 是否明确译为神迹
  choice: 那些记号
  alternative: 那些神迹
  rationale: 本节语境中的记号确有超自然性质，但原词本身是“记号”；正文保留这一较宽的词义，避免把解释性成分直接写入译文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“把……都讲了”清楚呈现亚伦转述全部话语的动作；“又”连接随后施行记号的动作。脚注标记置于其实际对应的短语“在百姓眼前”之后。
