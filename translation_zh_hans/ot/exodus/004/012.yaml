base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/012.yaml
  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: zh_hans
  text: 现在去吧！我必与你的口同在[a]，教导你该说什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可意译为“在你说话时与你同在”。原文直译为“与你的口同在”。
    reason: 说明希伯来文的具体表达，并提供较自然的汉语释义，同时不取代正文中的原文意象。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为时间兼话语推进标记，引出上帝对摩西异议的直接回应；“现在”自然地保留了紧迫感。
- source_word: לֵךְ
  choice: 去吧
  rationale: 这是הלך的Qal祈使式；“去吧”在现代汉语中既明确又自然，保留命令语气。
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: 我必……同在
  rationale: 独立人称代词אָנֹכִי带有一定强调；汉语以明确的“我”作主语，并用“必”表达应许性的将来，庄重而不显累赘。
- source_word: עִם־פִּיךָ
  choice: 与你的口同在
  rationale: 直译为“与你的口同在”。保留“口”的具体意象，使焦点仍落在摩西的言说困难及上帝亲自临在、使他能够说话之上。
- source_word: וְהוֹרֵיתִיךָ
  choice: 教导你
  rationale: ירה的Hiphil在此表示教导或指示；“教导你”清楚表达上帝将指明言说内容。
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: 该说什么
  rationale: 关系从句说明上帝所教导的内容。“该说什么”自然表达受托使命中的应然含义，同时不把句子误解为单纯预告摩西将会说的话。
theological_decisions:
- issue: 差遣语境中的神圣临在公式
  choice: 我必与你的口同在
  alternative: 我必帮助你说话
  rationale: 原文不是仅仅说明上帝提供说话能力，而是用具体、具身体性的方式宣告上帝亲自与摩西的“口”同在。保留这一表达，可避免把神圣临在简化为功能性的帮助。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与你的口同在”略带原文色彩，但在上下文中可以理解，并有意保留希伯来文具体而富神学意味的措辞。
