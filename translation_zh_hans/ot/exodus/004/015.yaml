  text: וְ/דִבַּרְתָּ֣ אֵלָ֔י/ו וְ/שַׂמְתָּ֥ אֶת הַ/דְּבָרִ֖ים בְּ/פִ֑י/ו וְ/אָנֹכִ֗י אֶֽהְיֶ֤ה עִם פִּ֨י/ךָ֙ וְ/עִם פִּ֔י/הוּ וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם אֵ֖ת אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: zh_hans
  text: 你要对他说话，把这些话放在他口中；我要与你的口同在，也与他的口同在[a]，并要指教你们该做什么。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与你的口同在……与他的口同在”是希伯来文的具体说法，表示神在摩西和亚伦说话时与他们同在。
    reason: 说明原文意象，避免读者误解这一较不寻常的汉语表达。
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: 你要对他说话
  rationale: 连词加完成式在这一训示语境中表达命令；“对他说话”直接体现דבר与אל的搭配。
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: 把这些话放在他口中
  rationale: 保留שׂים“放、置”的基本意义和“在他口中”的具体意象；“这些话”在现代汉语中自然地指向上文所说神要传达的话。
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: 我要与你的口同在，也与他的口同在
  rationale: 按希伯来文保留“与……的口同在”的具体表达，呈现神在摩西和亚伦说话时亲自同在并赐予能力的意象，不在正文中将其释义为“帮助你们说话”。
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: 并要指教你们
  rationale: ירה的使役词干在此意为“教导、指教”；אֶתְכֶם为第二人称复数，因此明确译作“你们”，指摩西和亚伦。
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: 该做什么
  rationale: 关系结构表达“所要做的事”；动词为第二人称阳性复数，承接“你们”。“该做什么”以自然汉语保留训示意味。
theological_decisions:
- issue: 神以“与你的口同在”施助说话的拟人化表达
  choice: 正文保留“我要与你的口同在，也与他的口同在”
  alternative: “我会帮助你说话，也会帮助他说话”
  rationale: 原文用身体器官“口”的具体意象表达神的临在和赋能。直保留这一说法可避免把丰富的原文意象压缩成单一解释。
- issue: 末尾代词和动词的复数形式
  choice: 明确译作“你们”，指摩西和亚伦二人
  alternative: 使用可能兼指单数或复数的“你”
  rationale: 希伯来文אֶתְכֶם和תַּעֲשׂוּן均明确为复数；现代汉语用“你们”可自然、准确地体现这一转换。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“放在他口中”和“与你的口同在”刻意保留原文的具体意象；末句用“你们”明确反映希伯来文复数。
