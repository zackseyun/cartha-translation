base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: zh_hans
  text: 耶和华对亚伦说：“你到旷野去迎接摩西。”亚伦就去了，在上帝的山遇见摩西，亲吻了他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，保留其作为以色列之上帝名字的性质，而不以“主”这一称号替代。
- source_word: לֵךְ
  choice: 去
  rationale: 这是הלך的命令式；“去”简洁、自然，符合直接引语。
- source_word: לִקְרַאת
  choice: 迎接
  rationale: 该词表示前去与某人相会；“迎接”既传达主动前往相会，也符合兄弟重逢的语境。
- source_word: הַמִּדְבָּרָה
  choice: 到旷野去
  rationale: 名词带方向词尾־ה，明确表达朝旷野而去；中文以“到旷野去”自然保留这一方向意义。
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: 遇见摩西
  rationale: פגשׁ在此指相遇；重复“摩西”可避免连续代词在中文中产生所指不清。
- source_word: בְּהַר הָאֱלֹהִים
  choice: 在上帝的山
  rationale: 直译希伯来语属格结构，并保留介词ב在此可表示相遇地点的宽泛含义，不额外判定是在山上还是山旁。
- source_word: וַיִּשַּׁק לוֹ
  choice: 亲吻了他
  rationale: 忠实表达נשׁק“亲吻”；不在正文中增添“问候”等原文未明说的解释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经传统中最广为人知的专名形式，保留神名而非以“主”代替；“雅威”是较接近学术重构读音的另一可行音译。
- issue: הַר הָאֱלֹהִים的理解
  choice: 上帝的山
  alternative: 神的山
  rationale: 保留原文的关系结构，不将其解释性扩展为“圣山”或提前明确为某一具名山岳。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“到旷野去迎接摩西”依照希伯来语语序与方向词尾，将旷野明确作为亚伦前往的方向；后半句以姓名替代一个代词，保证中文叙事清楚。
