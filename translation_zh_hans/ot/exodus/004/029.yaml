  yaml_path: translation/ot/exodus/004/029.yaml
  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: zh_hans
  text: 于是，摩西和亚伦前去，召集了以色列众长老[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列子孙的众长老”；“以色列子孙”也可译为“以色列人”，传统译作“以色列的儿女”。
    reason: 说明בְּנֵי יִשְׂרָאֵל的字面亲属表达及常见译法。
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 前去
  rationale: הלך的叙事性未完成式在此推进情节，表示“去、前往”。虽然希伯来语动词为单数，后接摩西和亚伦两个并列主语，但中文自然按共同动作表达，无须刻意体现数的不一致。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַיַּאַסְפוּ
  choice: 召集了
  rationale: אסף在这里指把人聚集起来；“召集”既自然，也能体现长老被聚拢开会的语境，比泛指收集事物的“聚集”更明确。
- source_word: אֵת
  choice: 不单独译出
  rationale: 这是直接宾语标记，现代汉语没有对应的独立词。
- source_word: כָּל
  choice: 众
  rationale: כָּל表示全体；在“长老”前用“众”简洁、自然且具庄重感。
- source_word: זִקְנֵי
  choice: 长老
  rationale: זקנים在此不是泛指年长男子，而是指群体中受承认的领袖；“长老”兼顾词源联系与社会职分。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列
  rationale: 该短语字面为“以色列的儿子们”，在本处修饰“长老”，整体自然理解为以色列民族的长老。正文采用简洁自然的“以色列众长老”，脚注保留其字面亲属表达及传统译法。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的译法
  choice: 正文译作“以色列”，组成“以色列众长老”
  alternative: “以色列的众子孙”或传统的“以色列众儿女”
  rationale: 该表达承载以色列（雅各）后裔的群体身份，但在“众长老”之前若逐字译为亲属称谓，现代中文会显得生硬，甚至可能误读为只有雅各的直接儿子。正文保留民族名称，脚注说明原文的亲属表达，从而兼顾自然度与祖源含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接前文并推进情节；“前去召集”清楚呈现两个连续动作。正文避免僵硬复制希伯来语结构，同时以脚注保存原文的祖源表达。
