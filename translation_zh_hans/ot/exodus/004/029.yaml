  naturalness: “于是，摩西和亚伦前去召集了以色列众长老”基本自然、庄重。将两个连续动作以逗号分开，可更清晰反映原文两个连续动词，且不把“前去”过度绑定为“召集”的方式状语。
  terminology: “长老”适切指称 זִקְנֵי 的群体领袖含义；“以色列”作为修饰语在中文正文中自然。脚注应以“以色列子孙”清楚说明原文的亲属表达，并保留“以色列人”和传统“以色列的儿女”的替代译法。
