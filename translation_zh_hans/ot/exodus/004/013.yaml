  text: וַ/יֹּ֖אמֶר בִּ֣י אֲדֹנָ֑/י שְֽׁלַֽח נָ֖א בְּ/יַד תִּשְׁלָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: zh_hans
  text: 摩西却说：“主啊，求你派你所要派的人吧。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较明确地译作：“主啊，求你差别人去吧。”
    reason: 原文措辞含蓄，字面没有“别人”，但上下文显明摩西是在推辞上帝的差遣。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 摩西却说
  rationale: 原文直译为“他就说”，但上下文中摩西在上帝逐一回应后仍然推辞，因此用“却”自然表达此处的转折；明确主语“摩西”也符合现代汉语叙事习惯。
- source_word: בִּי
  choice: 求你
  rationale: בִּי 在尊称之前是恳求语，不宜按字面译为“在我里面”；“求你”在现代汉语中既自然，又保留恭敬请求的语气。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 此词是摩西对上帝的尊称，并非神名 יהוה。“主啊”适合汉语直接称呼，也传达原文第一人称归属形式所表达的敬意；直译“我的主”在此略显生硬。
- source_word: שְׁלַח
  choice: 差遣
  rationale: 这是 שלח 的祈使式。“差遣”清楚而庄重，并可与本句后面同一词根的动词呼应。
- source_word: נָא
  choice: 求
  rationale: 此语气词缓和祈使语气，表示恳请；与 בִּי 合并表达为“求你”，避免汉语中重复使用两个“请”或“求”。
- source_word: בְּיַד
  choice: 借着……的人
  rationale: 字面为“借……的手”，在这里表示行动的媒介或代理者。译作“借着……的人”保留代理关系，又避免“借着某人的手去差遣”在现代汉语中过度拗口。
- source_word: תִּשְׁלָח
  choice: 你所要差遣的
  rationale: 未完成式置于这种关系结构中，可表达“你要差遣的”。译文不擅自补出“别人”，从而保留摩西含蓄、推诿说法的开放性。
theological_decisions:
- issue: 摩西含蓄请求的解释
  choice: 保留原文的含蓄表达：求上帝借着他所要差遣的人去差遣。
  alternative: 主啊，求你差别人去吧。
  rationale: 上下文表明摩西不愿受差遣，但希伯来文没有明说“别人”。正文保留这一语义张力，脚注提供符合上下文的解释性译法，而不在正文中替原文作出明确化处理。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“借着你所要差遣的人去差遣”有意保留原文重复使用 שלח 以及含蓄回避的表达；虽然略带希伯来语色彩，仍可理解。脚注标记置于“说”之后，与整句另一种解释对应。
