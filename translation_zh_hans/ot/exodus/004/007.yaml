  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: zh_hans
  text: 他说：“把手放回怀里[a]。”他就把手放回怀里；把手从怀里拿出来，看哪，那手已经恢复得像他身上的肉一样了[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“胸前的衣襟里”。
    reason: cultural_note
  - marker: b
    text: 意思是他的手恢复了正常。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: 放回
  rationale: 这是שׁוב的使役命令式，表示使手回到先前所在之处；“放回”既自然，也保留了“返回”的含义。
- source_word: חֵיק
  choice: 怀里
  rationale: 该词可指胸前或衣襟形成的内褶，可把手或物件放入其中；“怀里”是现代汉语中简洁自然的对应表达，具体衣着背景另以脚注说明。
- source_word: וַיָּשֶׁב
  choice: 就把手放回
  rationale: 这里的叙事形式回应前面的命令；重复使用“放回”，清楚呈现摩西照命令行动。
- source_word: וַיּוֹצִאָהּ
  choice: 抽出手来
  rationale: יצא的使役式意为“使出来、带出来”；就手从怀中出来这一动作而言，“抽出手来”符合现代汉语习惯。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该提示词引导读者注意意外而显著的结果；“看哪”保留了原文庄重的叙事强调。
- source_word: שָׁבָה
  choice: 已经恢复
  rationale: 动词字面表示“返回、变回”；在此指手恢复先前状态。“已经恢复”符合上下文，同时没有具体添加原文未说明的医治机制。
- source_word: כִבְשָׂרוֹ
  choice: 和他身上的肉一样
  rationale: 前缀כ表示比较；此译保留“像他的肉”这一表达，并用“身上的”使汉语所指清楚，而不把比较对象过度解释为身体的某一特定部位。
