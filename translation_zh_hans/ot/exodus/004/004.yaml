  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: zh_hans
  text: 雅威对摩西说：“伸出手来，抓住它的尾巴[a]。”摩西就伸出手，抓住了它，它便在他手中变成了杖[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“抓住它的尾部”或“从尾巴抓住它”。
    reason: 原文介词结构可指抓握的部位；正文采用最自然直接的表达。
  - marker: b
    text: “杖”也可译作“棍”或“杆”。
    reason: 希伯来语 מַטֶּה 可指杖、棍或杆；本处“杖”最合上下文。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语通行的音译保留四字神名，避免用称号代替原文中的专名。
- source_word: שְׁלַח יָדְךָ
  choice: 伸出手来
  rationale: 准确表达“伸出你的手”这一具体动作，也符合自然、庄重的现代汉语。
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: 抓住它的尾巴
  rationale: אָחַז表示抓住、握住；介词ב可在此理解为抓住的部位。此译文自然清楚，并保留摩西奉命抓蛇尾的具体含义。
- source_word: וַיַּחֲזֶק בּוֹ
  choice: 紧紧抓住它
  rationale: חזק在此结构中表示牢牢抓住；加入“紧紧”体现其力度，也与前面的命令用词有所区别。
- source_word: וַיְהִי לְמַטֶּה
  choice: 变成了杖
  rationale: היה与ל连用在此表示状态转变；מַטֶּה可指杖、手杖或棍杖，“杖”简洁且适合本段语境。
- source_word: בְּכַפּוֹ
  choice: 在他手中
  rationale: כַּף字面可指手掌，但“在他手中”是自然汉语，并准确表达物体位于摩西掌握之中。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不以“主”这一称号替代；“耶和华”虽为传统形式，但较不贴近通常重构的读音。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“伸出手来”与“紧紧抓住”使动作连贯鲜明；“它”承接上文的蛇，不擅自补入原文未重复出现的名词。
