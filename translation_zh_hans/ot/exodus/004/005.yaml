source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: zh_hans
  text: 好使他们相信，雅威[a]——他们列祖的上帝，就是亚伯拉罕的上帝、以撒的上帝、雅各的上帝——曾向你显现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），即上帝的名；传统上常译作“耶和华”，也有音译作“雅威”的。
    reason: 说明神名的希伯来文形式，并交代传统中文译法及正文所采用的音译。
lexical_decisions:
- source_word: לְמַעַן
  choice: 好让
  rationale: 引出目的；“好让”自然地保留希伯来文的目的意味。
- source_word: יַאֲמִינוּ
  choice: 他们相信
  rationale: 此处指百姓因神迹而接受摩西所传的信息；“相信”贴合上下文。
- source_word: כִּי
  choice: （相信的内容从句）
  rationale: 这里引出所相信的内容，汉语无需另译为“因为”。
- source_word: נִרְאָה אֵלֶיךָ
  choice: 曾向你显现
  rationale: נראה 是 ראה 的尼פעל式，在此表示“显现”；“曾”表明事件已经发生，同时不加入原文没有明说的时态细节。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的神圣四字名传统音译，并以脚注交代其希伯来文字形及其他译法。
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: 他们祖先的上帝
  rationale: אָבוֹת 在这里指以色列人的先祖，随后由亚伯拉罕、以撒、雅各具体说明；“祖先”在现代汉语中自然且准确。
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: 亚伯拉罕的上帝、以撒的上帝、雅各的上帝
  rationale: 保留原文在三位族长名字前重复“上帝”的庄重节奏。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文圣经传统中辨识度最高的音译“耶和华”，同时以脚注保留“雅威”等可能译法，不把专名默默替换为称号。
- issue: אֲבֹתָם 的性别与范围
  choice: 他们祖先的
  alternative: 他们列祖的；他们父辈的
  rationale: 语境随即列出亚伯拉罕、以撒、雅各，所指是族长先祖。“祖先”比现代汉语“父辈”更准确；“列祖”则较古雅。
- issue: 三个族长称谓之间的关系
  choice: 用“就是”将三重称谓作为“他们祖先的上帝”的具体说明
  alternative: 仅以逗号并列，不明示同位关系
  rationale: 希伯来文以连续同位结构说明同一位神；“就是”使现代汉语关系清楚，并未增加不同的神学命题。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“好让”承接本节在上下文中的目的从句；破折号标出同位说明，保留原文反复称说三位族长之上帝的庄严语势。
