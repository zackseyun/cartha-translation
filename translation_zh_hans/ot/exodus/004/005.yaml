  source_fidelity: 原文的目的从句、相信的内容、向摩西显现，以及三重“……的上帝”结构均已基本传达。但正文将 יהוה 译为“耶和华”，与本项目对该神名采用“Yahweh”的既定译法不一致；中文正文宜相应采用“雅威”。此外，אֲבֹתָם 直指族长性的“父祖／列祖”，译作“列祖”较能保留该语境和原文措辞。
  naturalness: 原译通顺、庄重，破折号中的同位说明也清楚。“好使他们相信”比“好让”略更适合此处叙事中的庄重书面语；“曾向你显现”自然，并恰当表达已完成的显现。
  terminology: 将 יהוה 统一译为“雅威”，以对应项目指定的 Yahweh；将“他们祖先”改为“他们列祖”，保留经文的族长／父祖语境。上帝、亚伯拉罕、以撒、雅各等术语与名称可保留。
