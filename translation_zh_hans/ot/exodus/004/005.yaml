revisions:
- from: 好让他们相信，耶和华[a]——他们祖先的上帝，就是亚伯拉罕的上帝、以撒的上帝、雅各的上帝——曾向你显现。
  to: 好使他们相信，雅威[a]——他们列祖的上帝，就是亚伯拉罕的上帝、以撒的上帝、雅各的上帝——曾向你显现。
  rationale: 修订仅处理术语一致性和词义精确度：以“雅威”对应项目规定的 Yahweh，并以“列祖”较贴近 אֲבֹתָם 的父祖／族长语境。其余句法保留原译的目的关系、同位说明及重复称谓的庄重节奏。
