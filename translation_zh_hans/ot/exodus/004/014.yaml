  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: zh_hans
  text: 于是，雅威向摩西发怒，说：“你的兄弟亚伦，那利未人，不是在吗？我知道他很会说话[a]。而且你看，他正出来迎接你；他一见到你，心里就会欢喜。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我知道他确实会说”或“我知道他口才流利”；较直译为“我知道：说，他必会说”。
    reason: 希伯来文以不定式绝对形与同根限定动词连用来加强“说”的意思；按上下文可指善于表达，也可仅强调他说话的事实或确定性。
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה בְּמֹשֶׁה
  choice: 雅威向摩西发怒
  rationale: 希伯来语以“怒气燃烧”的惯用语表达强烈愤怒。中文采用自然的“发怒”，保留其强度而避免生硬地照译身体意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术拟音处理为专名“雅威”，不以“主”等称号代替。
- source_word: הֲלֹא אַהֲרֹן אָחִיךָ הַלֵּוִי
  choice: 你的哥哥利未人亚伦不是在吗？
  rationale: הֲלֹא引出预期肯定回答的反问；“不是在吗”在现代中文中自然呈现“不是有……吗”的语气。“利未人”在此表示亚伦的支派身份，不预先解释为祭司职分。
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: 我知道他很会说话
  rationale: 不定式绝对形与限定动词连用，加强“说”的含义；上下文将亚伦的表达能力与摩西的推辞相对照，因此译作自然的“很会说话”，同时用脚注保留其他可能理解。
- source_word: וְגַם הִנֵּה
  choice: 而且你看
  rationale: 同时表达附加和引人注意的作用；“你看”比“看哪”更符合现代普通话，又保留现场感。
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: 他正出来迎接你
  rationale: 分词表达正在发生或临近发生的行动，“正出来迎接你”兼顾其持续感和叙事视角。
- source_word: וְרָאֲךָ וְשָׂמַח בְּלִבּוֹ
  choice: 他见到你，心里就会欢喜
  rationale: 前一动词按语义关系译作时间条件，后一短语保留“心里”的内在、由衷含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”较直接地反映YHWH的拟音，也避免以称号取代专名；“耶和华”则源于另一种传统形式。
- issue: “利未人”是否指祭司职分
  choice: 仅保留支派称谓“利未人”
  alternative: 解释为祭司或宗教职员
  rationale: 本节本身没有明确赋予亚伦祭司职分，因此不把后续叙事中的职分含义预先带入此处。
- issue: 加强式“说”所表达的含义
  choice: 按语境译为表达能力强，并以脚注保留歧义
  alternative: 他确实会说；他一定会说
  rationale: 结构本身主要加强动词，既可能强调能力或流利，也可能强调动作的确定性。上下文支持表达能力，但不应把这一解释写成唯一可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哥哥”比单用“兄弟”更准确地表达亚伦与摩西的长幼关系；“你看”保留הִנֵּה的提示作用，同时避免过度古雅。脚注标记紧随其所解释的“很会说话”，而不置于“摩西”之后。
