base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: zh_hans
  text: 摩西回答说：“可是，他们不会相信我，也不会听我的话[a]，因为他们会说：‘雅威没有向你显现。’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听我的话”直译为“听我的声音”，也可理解为“听从我”或“理会我”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶和华没有向你显现。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: 摩西回答说
  rationale: 两个连续的叙事动词合起来引出摩西的回应；“回答说”既保留希伯来语的表达，也符合庄重的现代汉语叙事习惯。
- source_word: וְהֵן
  choice: 可是
  rationale: 此处该提示词引出摩西的异议；汉语“可是”自然表达语境中的转折和反驳意味，而不采用较古雅的“看哪”。
- source_word: לֹא יַאֲמִינוּ לִי
  choice: 他们未必相信我
  rationale: 未完成式在摩西设想的情境中表达预期或可能结果；“未必”自然传达他的疑虑，避免把尚未发生的事断言为确定事实。
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: 也未必听我的话
  rationale: שמע בקול 可指听从、理会或顺从；此处重点是众人是否接受摩西的信息。“听我的话”保留其惯用意义，又不把语气过度强化为“服从”。
- source_word: כִּי יֹאמְרוּ
  choice: 因为他们会说
  rationale: כִּי 引出摩西疑虑的理由，后面的未完成式表示他预想众人会作出的反应。
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: 没有向你显现
  rationale: ראה 的尼法勒词形在这里表示“显现”；“没有向你显现”是准确自然的汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名；译作“雅威”保留专名性质，也较贴近学界通常重构的读音。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“回答说”保留原文叙事公式；用“可是”表达摩西提出异议的语气。脚注标记均置于正文相关位置。
