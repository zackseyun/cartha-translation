base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: zh_hans
  text: 如果他们不信你，也不听第一个神迹的声音，他们就会相信后一个[a]神迹的声音。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “后一个”也可译作“最后一个”。希伯来语在这里既可指较后的，也可指最后的；译作“后一个”，可避免让人误以为此后不可能再有神迹。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 如果……就……
  rationale: 这是希伯来语常见的条件—结果句式。现代汉语用“如果……就……”自然表达其功能，不另加生硬的“事情将是这样”。
- source_word: יַאֲמִינוּ לָךְ
  choice: 信你
  rationale: אמן 的使役形与 ל 连用，在这里表示相信或信任某人；“信你”简洁自然，也符合百姓是否接受摩西所传信息的语境。
- source_word: יִשְׁמְעוּ
  choice: 听从
  rationale: שׁמע 可表示听见、聆听或听从。这里不是单纯听到声音，而是对神迹所作见证加以接受；“听从”保留回应性的含义，但不把它强化为明确的“顺服”。
- source_word: לְקוֹל
  choice: ……的声音
  rationale: קוֹל 本义为“声音”。经文拟人化地把神迹描写为会发声作证，因此保留“声音”的意象，而不将其解释性地改成“信息”或“见证”。
- source_word: הָאֹת
  choice: 神迹
  rationale: אוֹת 基本义为“记号、征兆”，在本段特指上帝赐给摩西、用来使百姓相信的超自然记号。现代汉语圣经语境中“神迹”最自然；此选择表达上下文已明确的性质，并非额外加入某种神学判断。
- source_word: הָרִאשׁוֹן
  choice: 第一个
  rationale: רִאשׁוֹן 在这里直指两个已述神迹中的第一个，与后文“后一个”形成对应。
- source_word: וְהֶאֱמִינוּ
  choice: 就会相信
  rationale: 此动词构成条件句的结果部分；“就会”在现代汉语中清楚标明这一逻辑关系。
- source_word: הָאַחֲרוֹן
  choice: 后一个
  rationale: אַחֲרוֹן 可指较后的，也可指最后的。这里与“第一个”相对，而下一节还可能有另一个神迹，因此正文采用不暗示绝对终结的“后一个”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。句式以“如果……就……”呈现希伯来语条件—结果结构；保留“神迹的声音”这一不寻常但重要的原文意象。脚注标记置于其所说明的“后一个神迹的声音”之后。
