source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל יְהוָה֮ בִּ֣י אֲדֹנָ/י֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִ/תְּמוֹל֙ גַּ֣ם מִ/שִּׁלְשֹׁ֔ם גַּ֛ם מֵ/אָ֥ז דַּבֶּרְ/ךָ אֶל עַבְדֶּ֑/ךָ כִּ֧י כְבַד פֶּ֛ה וּ/כְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: zh_hans
  text: 摩西对雅威说：“主啊，求你了！我向来不是善于言辞的人[a]，无论是昨天、前天，还是自从你对仆人说话以来；因为我口重舌重[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我不是言语之人。”意思可能是“我不善言辞”或“我没有口才”。
    reason: 说明原文习语的字面形式及可能含义。
  - marker: b
    text: 原文作“口重、舌重”，是描述说话困难的隐喻；它可能指缺乏口才，也可能指某种言语障碍。
    reason: 保留并解释隐喻，同时避免把摩西的困难限定为某一种情况。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的通行汉语音译，保留原文中的专名，不以“耶和华”或“上主”等传统读法或称号替代。
- source_word: בִּי אֲדֹנָי
  choice: 主啊，求你了
  rationale: בִּי在这里是恳求语气，并非字面意义的“在我里面”；“求你了”自然传达摩西恭敬而急切的申诉，אֲדֹנָי译作称呼“主啊”。
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: 我不是善于言辞的人
  rationale: 尽量保留“不是言语之人”的人物性表达，同时以现代汉语清楚表明这是对说话能力的自述，而不把它具体解释为口吃或其他障碍。
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: 无论昨天还是前天，我都不是
  rationale: 保留原文“昨天—前天”的重复时间措辞及强调作用，不笼统改写成“向来”，使读者仍能看见希伯来语的表达方式。
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: 甚至从你对仆人说话以来，我也还是如此
  rationale: מֵאָז表达“自……以来”；“也还是如此”补足汉语句意，并呈现摩西声称神的呼召尚未改变其说话能力。
- source_word: עַבְדֶּךָ
  choice: 仆人
  rationale: 这里是摩西对神自称的谦敬用语；“仆人”比“奴隶”更符合直接祈求的语境。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出摩西声称自己不善言辞的理由。
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: 口重舌重
  rationale: 保留原文“口重、舌重”的平行隐喻，避免擅自判定摩西究竟是不善辞令、表达迟缓，还是有生理性的言语障碍。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神圣四字名；音译“雅威”将其作为专名呈现，不用称号取代，也不采用较晚形成的混合读音。
- issue: 是否明确诊断摩西的言语困难
  choice: 保留“口重舌重”的隐喻
  alternative: 译作“说话迟钝”“没有口才”或“口吃”
  rationale: 原文没有说明困难的确切性质；保留身体意象，可维持“不善辞令、表达困难或言语障碍”等可能性之间的开放性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“主啊，求你了”保留恳求口吻；“无论昨天还是前天”有意贴近原文的时间排比；“口重舌重”保留简洁、对称的希伯来语意象。所有脚注标记均置于所解释的正文短语之后。
