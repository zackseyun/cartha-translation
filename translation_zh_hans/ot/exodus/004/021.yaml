revisions:
- from: 耶和华对摩西说：“你回埃及去的时候，要留意在法老面前施行我交在你手中的一切奇事[a]。但我要使他的心刚硬[b]，他就不肯放百姓走。”
  to: 耶和华对摩西说：“你回埃及去的时候，要确保把我交在你手中的一切奇事[a]都在法老面前施行。但我要使他的心刚硬[b]，他就不肯放百姓走。”
  rationale: 仅作一项低风险措辞修订：以“要确保”替代“要留意”，明确呈现原文命令式在此要求摩西务必施行所有奇事的意思；“把……一切奇事都”使宾语范围及“全部”更清晰。其余译文和脚注均可保留。
