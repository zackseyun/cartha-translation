source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ בְּ/לֶכְתְּ/ךָ֙ לָ/שׁ֣וּב מִצְרַ֔יְמָ/ה רְאֵ֗ה כָּל הַ/מֹּֽפְתִים֙ אֲשֶׁר שַׂ֣מְתִּי בְ/יָדֶ֔/ךָ וַ/עֲשִׂיתָ֖/ם לִ/פְנֵ֣י פַרְעֹ֑ה וַ/אֲנִי֙ אֲחַזֵּ֣ק אֶת לִבּ֔/וֹ וְ/לֹ֥א יְשַׁלַּ֖ח אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你回埃及去的时候，要确保把我交在你手中的一切奇事[a]都在法老面前施行。但我要使他的心刚硬[b]，他就不肯放百姓走。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奇事”也可译作“神迹”或“征兆”；原词指彰显神大能、并具有标志作用的非凡作为。
    reason: lexical_alternative
  - marker: b
    text: “使他的心刚硬”也可译作“使他的心坚定”或“使他的心强硬”。希伯来文动词可有“使坚强、使坚定”的意思；在这里是说法老被坚固在顽固拒绝的态度上。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确指向希伯来文本中的神圣名号，而不是以“主”替代。
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: 你回埃及去的时候
  rationale: 把两个不定式结构自然译为时间从句，并保留“返回”和朝向埃及的含义。
- source_word: רְאֵה
  choice: 要留意
  rationale: 这里的命令式带有郑重嘱咐、务必做到的意味；“要留意”比单独的“看”更能表达这一语用功能，同时不过度增译。
- source_word: הַמֹּפְתִים
  choice: 奇事
  rationale: 该词指彰显神圣能力、并具有标志作用的非凡作为；“奇事”保留其宽广含义，不将其完全限定为“神迹”或“征兆”。
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: 我交在你手中的
  rationale: 既保留“在你手中”的希伯来意象，也以“交”传达托付和赋予施行能力的含义。
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: 在法老面前施行
  rationale: “施行”与作为宾语的“奇事”搭配自然；“在法老面前”保留公开当面行事的场景。
- source_word: וַאֲנִי
  choice: 但我要
  rationale: 连接词字面可作“而/和”，此处上下文呈现摩西施行奇事与上帝使法老刚硬之间的转折推进，中文以“但”自然表达。
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: 使他的心刚硬
  rationale: חזק 的使役式本可表示使坚强、使坚定；在法老拒绝放人的叙事语境中，“使……心刚硬”准确呈现顽固不从的结果，也保留神主动作用所带来的神学张力。
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: 他就不肯放百姓走
  rationale: “放……走”是本语境中 שׁלח 的自然中文表达；“不肯”体现法老意志上的拒绝，而“就”顺畅连接前述刚硬与其结果。
theological_decisions:
- issue: 上帝使法老的心刚硬
  choice: 我要使他的心刚硬
  alternative: 我要使他的心坚定；我要使他的心强硬
  rationale: 原文动词可含“使坚强、使坚定”的意思，但在本叙事中指法老被坚固在顽固拒绝的态度上。正文不弱化上帝的主动作用，也不借解释消解上帝主权与法老人类责任之间的张力；词义幅度在脚注中说明。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华”“法老”“百姓”等用语保持圣经叙事语域；句法避免文言化。“交在你手中”保留原文意象，“使他的心刚硬”保留原文的神学力度与未被化解的张力。脚注标记依正文出现顺序安排；英文咨询层的脚注标记与相应内容疑似错置，故按希伯来原文实际对应关系校正。
