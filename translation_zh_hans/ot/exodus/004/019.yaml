base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: zh_hans
  text: 雅威在米甸对摩西说：“去吧，回埃及去[a]，因为那些想要你性命的人都死了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文使用两个命令式动词，直译为“去，返回埃及”；也可译作“回埃及去”。
    reason: 说明原文保留“去”和“返回”两个祈使动词；正文以自然汉语表达这一重复的命令结构。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，保留其作为上帝名字而非称号的功能。
- source_word: בְּמִדְיָן
  choice: 在米甸
  rationale: 介词 בְּ 在此表示地点，直译为“在米甸”自然清楚。
- source_word: לֵךְ שֻׁב
  choice: 去，回埃及去
  rationale: 保留原文连续两个祈使动词：לֵךְ 表示动身去，שֻׁב 表示返回；中文用“去，回……去”兼顾形式与自然度。
- source_word: כִּי
  choice: 因为
  rationale: 引出命令的理由，现代汉语用“因为”表达明确。
- source_word: מֵתוּ
  choice: 都死了
  rationale: 完成式表示死亡已经发生且结果持续至当下，中文“死了”自然传达这一点。
- source_word: כָּל הָאֲנָשִׁים
  choice: 那些……的人都
  rationale: 原文指全部追索摩西性命者；中文通过“那些……的人都”自然表达定指与全体范围，不必生硬译成“所有的男人”。
- source_word: הַמְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: 想要你性命的人
  rationale: 这是意图杀害某人的希伯来语惯用表达；“想要你性命”既保留“性命”意象，也符合自然现代汉语。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名。中文正文采用广为人知且具有专名功能的“耶和华”，不以“主”等称号替代；“雅威”是按学界常见拟音形成的另一可行译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“去，回埃及去”刻意保留原文两个命令式动词；“想要你性命”清楚表达追索生命、意图杀害的惯用意义。
