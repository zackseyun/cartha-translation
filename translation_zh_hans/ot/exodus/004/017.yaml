  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: zh_hans
  text: 你要把这根杖拿在手里[a]，用它施行这些神迹[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “杖”也可译作“棍杖”。希伯来语מַטֶּה可泛指杖或棍杖；此处结合摩西牧羊的背景译作“杖”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语原文通常意为“记号”，此处为“这些记号”。正文译作“神迹”是根据上下文；原文未直接使用“神迹”一词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: 你要
  rationale: 连词承接上文的吩咐；宾格标记不单独翻译。结合未完成式在此处的命令功能，汉语自然表达为“你要”。
- source_word: הַמַּטֶּה הַזֶּה
  choice: 这根杖
  rationale: מַטֶּה可指杖或棍；结合摩西牧羊的叙事背景，“杖”准确、简洁，也保留指示词“这”。
- source_word: תִּקַּח בְּיָדֶךָ
  choice: 拿在手里
  rationale: 直译并符合现代汉语习惯；未完成式在语境中具有吩咐意味。
- source_word: אֲשֶׁר ... בּוֹ
  choice: 用它
  rationale: 希伯来语关系结构表达工具意义。汉语用“用它”清楚自然，并明确指向这根杖。
- source_word: תַּעֲשֶׂה
  choice: 施行
  rationale: עָשָׂה基本义为“做、行”；与“神迹”搭配时，“施行”比“做”更庄重自然。
- source_word: הָאֹתֹת
  choice: 那些神迹
  rationale: אוֹת本义为“记号、征兆”，此处指上文已经展示的超自然记号；“那些”体现定冠词及回指功能，“神迹”符合汉语圣经叙事的自然表达。脚注保留较贴近词面的译法。
theological_decisions:
- issue: הָאֹתֹת是否在正文中明确为超自然的“神迹”
  choice: 神迹
  alternative: 记号
  rationale: 上下文中的杖变蛇、手患病并复原等表明这些记号具有神奇性质；“神迹”在现代汉语中更易理解。不过希伯来原文只说“那些记号”，因此以脚注保留其词面和语义张力。
translation_notes:
  register: 采用现代、自然而庄重的叙事语言。“你要……拿在手里”体现命令语气；“施行”与“神迹”搭配流畅。所有脚注标记均已置于正文相应词语之后。
