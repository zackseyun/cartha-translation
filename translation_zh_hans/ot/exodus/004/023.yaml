base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: zh_hans
  text: 我曾对你说：‘放我的儿子走，让他事奉我。’但你拒绝放他走。看哪，我要杀你的儿子，就是你的长子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: 放……走
  rationale: 在摩西向法老传话的语境中，这一使役命令自然表达为“放……走”，既体现准许离开的含义，也与后文同一词根的重复相呼应。
- source_word: וְיַעַבְדֵנִי
  choice: 让他事奉我
  rationale: עבד 在此指以色列敬拜并服事上帝；“事奉”能保留宗教与服役两方面的意味。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来文提示听者注意、引出严厉宣告的语用力量，语体庄重。
- source_word: הֹרֵג
  choice: 我要杀
  rationale: 该分词在 הִנֵּה אָנֹכִי 结构中表达迫近且确定的行动；现代汉语用“我要杀”简洁传达这一预告。
- source_word: בְּכֹרֶךָ
  choice: 你的长子
  rationale: 准确对应“你的头生子”，并与本章22节以色列作为上帝“长子”的宣告形成对应。
theological_decisions:
- issue: “我的儿子”所指及单数形式
  choice: 保留“我的儿子”
  alternative: 译作“我的子民”或“我的众子民”
  rationale: 原文明确使用单数 בְּנִי，并承接4:22中以色列作为上帝长子的集体人格表达；不在正文中解释或改写。
- issue: 上帝将要施行的审判
  choice: 直译为“我要杀你的儿子”
  alternative: 弱化为“我要使你的儿子死去”或使用被动表达
  rationale: 原文由上帝以第一人称主动宣告 הֹרֵג，不应淡化其直接施行审判的神学张力。
- issue: “你的儿子，就是你的长子”的同位关系
  choice: 用“就是”明确同位
  alternative: 仅以逗号并列“你的儿子，你的长子”
  rationale: “你的长子”说明前面的“你的儿子”具体指谁；“就是”符合现代汉语，同时不增加原文之外的身份信息。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“放……走”延续出埃及叙事的核心措辞；“事奉”保留敬拜与服事的复合含义；“看哪”保留原文警示性话语标记。
