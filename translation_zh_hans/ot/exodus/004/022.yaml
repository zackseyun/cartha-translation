  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: zh_hans
  text: 然后你要对法老说：“雅威这样说：‘以色列是我的长子[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按希伯来语的次序更直译为：“以色列是我的儿子，我的长子。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: 然后你要……说
  rationale: 连词在上下文中表示行动次序；第二人称阳性单数完成式在对摩西的指示中带有将来兼命令意味。“然后你要”既自然，也保留指令语气。
- source_word: אֶל־פַּרְעֹה
  choice: 对法老
  rationale: 介词 אֶל 引出说话对象；“对法老说”符合现代汉语习惯。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 这是固定的使者宣告公式。“这样说”保留其庄重语气，同时比文言式“如此说”更符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音译出专名，不以“主”这一称号替代，也不采用源自另一种传统读法的“耶和华”。
- source_word: בְּנִי בְכֹרִי
  choice: 我的长子
  rationale: “长子”在汉语中同时明确表达“儿子”与“头生者”的身份，简洁自然；脚注保留希伯来语将“我的儿子”和“我的长子”并列的形式。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文通行译名；此处指作为整体的以色列，与“我的儿子、我的长子”构成同位关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。译作“雅威”力求按希伯来语证据音译，并避免用称号代替专名。
- issue: 以色列的儿子与长子比喻
  choice: 以色列是我的长子
  alternative: 以色列是我的儿子，我的长子
  rationale: 正文用自然汉语完整表达父子关系和长子身份，不把“长子”的意义进一步限定为时间、法律地位或尊荣；脚注保留原文较为分列、强调的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。外层用中文双引号标示摩西要说的话，内层用单引号标示雅威的直接宣告；避免文言化措辞，同时保留使者宣告公式的正式感。
