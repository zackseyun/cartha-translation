  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: zh_hans
  text: 雅威对他说：“你手里是什么？”他说：“一根杖[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“棍”或“棒”。希伯来语 מַטֶּה 可按语境指杖、棍或棒。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的现代汉语音译，不以“主”这一称号替代专名。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: 说……说
  rationale: 保留希伯来文两次使用 אמר 的重复；第一处在语境中自然引出问句，第二处引出回答。
- source_word: אֵלָיו
  choice: 对他说
  rationale: אֶל 加第三人称单数阳性后缀意为“对他”；与 אמר 连用时，“对他说”符合现代汉语表达。
- source_word: מַה־זֶּה / מִזֶּה
  choice: 是什么
  rationale: 该问语用于询问眼前物件的性质或名称；汉语结合下文“你手里拿的”即可自然表达指示意味，无须生硬加入“这个”或“那个”。
- source_word: בְּיָדֶךָ
  choice: 你手里拿的
  rationale: 原文直指“在你手中”的物件；译作“你手里拿的”在现代汉语问句中自然，并保留实际持物的含义。
- source_word: מַטֶּה
  choice: 一根杖
  rationale: מַטֶּה 可指杖、棍或权杖；在摩西所持物件的语境中，“杖”简洁自然，“根”是汉语所需量词。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”按该名字较通行的学术拟音直接音译，保留其专名性质；“耶和华”是传统汉译，但反映了另一种历史读法。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。问句用“你手里拿的是什么”表达原文指向摩西手中物件的口语情境；脚注标记置于其实际所说明的“杖”之后。
