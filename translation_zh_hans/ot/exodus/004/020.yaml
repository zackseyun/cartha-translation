  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: zh_hans
  text: 于是，摩西带着妻子和儿子们，让他们骑在驴背上，回埃及地去了。摩西手里拿着上帝的杖。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 于是，摩西带着
  rationale: 叙事性连续式推动情节发展；“于是”自然表达先后关系。此处“带着”比机械地译作“拿”更符合带领家人同行的现代汉语习惯。
- source_word: אִשְׁתּוֹ
  choice: 妻子
  rationale: 直接表达带第三人称阳性单数后缀的“妻子”；本节没有必要补出西坡拉的名字。
- source_word: בָּנָיו
  choice: 儿子们
  rationale: 原文为阳性复数，明确指“儿子”，不泛化为“孩子们”。
- source_word: וַיַּרְכִּבֵם
  choice: 让他们骑上
  rationale: רכב 的使役式表示使人骑乘；此译保留使役意义，也符合现代汉语表达。
- source_word: הַחֲמֹר
  choice: 那头驴
  rationale: 原文带定冠词；汉语用“那头”自然体现其特指性。
- source_word: וַיָּשָׁב
  choice: 回……去了
  rationale: שׁוב 在此表示返回；原文动词为阳性单数，主语仍是摩西。
- source_word: אַרְצָה מִצְרָיִם
  choice: 回埃及地去
  rationale: 保留“地”以及方向词尾所表达的趋向，同时采用自然的汉语语序。
- source_word: מַטֵּה הָאֱלֹהִים
  choice: 上帝的杖
  rationale: מַטֶּה 可指杖或棍；“杖”既简洁庄重，也适合此处作为神迹凭据的器物。“上帝的”直接保留属格关系。
- source_word: בְּיָדוֹ
  choice: 手里拿着
  rationale: 自然表达“在他手中”的具体形象；在汉语中补出“拿着”可避免生硬。
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים 中 הָאֱלֹהִים 的理解
  choice: 上帝
  alternative: 神圣的
  rationale: 上下文指摩西奉上帝差遣施行神迹时所持的杖，因此应理解为与上帝相关的“上帝的杖”，而不是仅表示性质的“神圣之杖”。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“于是”衔接上文，“回埃及地去了”保持原文方向感；不补入原文未明说的人名或解释。
