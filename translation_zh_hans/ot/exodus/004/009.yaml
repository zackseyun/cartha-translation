  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: zh_hans
  text: 如果他们连这两个神迹也不相信，也不听从你的话[a]，你就要从尼罗河里取一些水，倒在干地上；你从尼罗河里取来的水，必在干地上变成血[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“也不听你的声音”；这里有听从、理会的意思。
    reason: lexical_alternative
  - marker: b
    text: 或译：“成为血”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: 如果
  rationale: וְהָיָה与אִם在这里引出条件情形。译作“如果”符合现代汉语，也避免生硬地直译为“事情将是，如果”。
- source_word: יַאֲמִינוּ
  choice: 不相信
  rationale: אמן的使役词干在此表示相信这些神迹所显明的信息；“不相信”在叙事语境中准确自然。
- source_word: גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: 连这两个神迹也不相信
  rationale: “连……也……”体现גַּם所表达的递进意味；אֹתוֹת指前文所给的两个超自然记号，译作“神迹”符合本段语境和现代汉语习惯。
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: 不听从你的话
  rationale: שׁמע לְקוֹל是“听某人的声音”并加以理会、服从的惯用表达；“听从你的话”自然传达其语用含义。
- source_word: מִמֵּימֵי הַיְאֹר
  choice: 从尼罗河里取一些水
  rationale: 介词מִן在此具有部分意义；יְאֹר在《出埃及记》的语境中指尼罗河。
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: 干地
  rationale: 该词表示与水相对的干燥陆地；重复译作“干地”，保留原文前后呼应。
- source_word: וְשָׁפַכְתָּ
  choice: 倒在
  rationale: שפך在此指将所取的水倾倒出来；汉语用“倒在干地上”简明自然。
- source_word: וְהָיוּ ... לְדָם
  choice: 必……变成血
  rationale: היה与לְ构成的表达在此表示转变或结果；“变成血”既清楚又保留原文的直接陈述。
- source_word: דָם
  choice: 血
  rationale: 该名词明确指血；原文没有将其弱化为颜色或外观的限定。
theological_decisions:
- issue: 尼罗河水成为血这一神迹的性质
  choice: 按直接转变来译：“变成血”
  alternative: 变得像血／变成血红色
  rationale: 希伯来文היה + לְדָם直接陈述水成为血，没有“像”或“血红色”等限定；译文不加入自然主义解释，也不弱化原文的神迹陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“连……也……”表现条件逐步升级；“你的话”传达希伯来语“你的声音”的惯用含义，并以脚注保留其字面形式。分号呈现命令与结果之间的层次，同时保留“干地”和“尼罗河”的重复。
