source:
  edition: WLC
  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: zh_hans
  text: 众民就信了。他们听见雅威眷顾[a]以色列子孙，并看见[b]他们所受的苦，就屈身俯伏敬拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “眷顾”也可译作“看顾”“留意”或“临到”。原文动词常含亲自过问并采取行动的意思。
    reason: lexical_alternative
  - marker: b
    text: “所受的苦”也可译作“困苦”“苦难”或“受压迫的处境”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: 信了
  rationale: 此处 אמן 的使役式表示民众相信摩西、亚伦所传的信息和所行的神迹；原文没有明说宾语，因此译作“信了”，不擅自补入“他们”或“这话”。
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: 他们听见
  rationale: שׁמע 后接 כִּי，引出他们听见的内容；中文分句既自然，也保留了听见消息后作出回应的叙事关系。
- source_word: פָקַד
  choice: 眷顾
  rationale: פקד 在这里不仅表示注意到，也含亲自过问、采取行动之意。“眷顾”自然地传达上帝带着关切介入的意味，同时以脚注保留其他可能译法。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文“以色列的众子”这一家族性群体称谓；“以色列子孙”在现代中文中清楚可懂，也包括整个以色列群体。
- source_word: רָאָה אֶת עָנְיָם
  choice: 看见了他们所受的苦
  rationale: 保留 ראה 的具体动词“看见”，并以“所受的苦”自然表达 עֳנִי 所指的困苦、受压与苦难。
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: 屈身俯伏敬拜
  rationale: 用“屈身”表达 קדד 的弯身动作，用“俯伏敬拜”表达 חוה 的俯伏致敬或敬拜，使两个相连而有区别的动作都得到体现。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”作为 YHWH 的现代汉语音译，以明确呈现专有的盟约之名，而不以称号“主”代替。
- issue: פקד 是否仅表示留意，还是含有介入行动
  choice: 眷顾
  alternative: 留意／看顾／临到
  rationale: 该动词语义范围较广，本处语境是上帝已注意以色列人的境况并将施行拯救；“眷顾”既保留关切，也不把具体行动说得超过原文。
- issue: חוה 的动作与敬拜意义
  choice: 俯伏敬拜
  alternative: 俯伏／下拜
  rationale: 该词可描述身体俯伏，也可按语境表示敬拜。因对象是雅威，译文呈现敬拜意义，同时保留俯伏动作，避免只取其一。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“雅威”明确呈现神名；“以色列子孙”保留原文的家族性表达；末句有意保留“屈身”与“俯伏敬拜”两个相邻动作，避免把两个希伯来语动词合并为一个。
