  source_fidelity: 需修订。草稿将“也看见了他们所受的苦”接在“他们听见”之后，按现代汉语通常会理解为众民看见了苦难；但希伯来文的“看见”主语仍是雅威。应使“眷顾”与“看见”都明确归于雅威。其余主要内容与原文相符。
  naturalness: 修订后以“听见雅威眷顾……，并看见……”将两个并列谓语置于“雅威”之下，语法清楚、语体庄重自然。
  terminology: “雅威”“以色列子孙”“眷顾”“屈身俯伏敬拜”均恰当；“眷顾”以脚注说明其语义范围，未过度限定。
