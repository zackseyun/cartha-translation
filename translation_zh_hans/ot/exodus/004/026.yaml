base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: zh_hans
  text: 耶和华就放过了他[a]。那时，西坡拉因割礼说：“血的新郎！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他就从他那里松手（或停止）”；结合第24节，主语最自然是耶和华，宾语通常理解为摩西。
    reason: referent_ambiguity
  - marker: b
    text: “割礼”在希伯来文中是罕见的复数形式，也可译作“割礼仪式”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: 耶和华放过了他
  rationale: רפה在此表示停止敌对行动；结合第24节，主语最自然是耶和华。宾语在希伯来文中仅为代词，因此正文保留“他”，不直接补明为摩西。
- source_word: אָז
  choice: 那时
  rationale: 时间副词承接耶和华停止行动之后的叙事次序；“那时”也自然引出西坡拉对先前话语的说明。
- source_word: אָמְרָה
  choice: 西坡拉说
  rationale: 原文仅作阴性单数“她说”，其所指由紧邻上文可确定为西坡拉；中文补出姓名可避免代词指向不清。
- source_word: חֲתַן דָּמִים
  choice: 血的新郎
  rationale: 直译这一简短而晦涩的结构词组，不把它解释为厌恶、流血事件或特定礼仪称号，以保留原文真实的文化与情感含混性。
- source_word: לַמּוּלֹת
  choice: 因割礼而说的
  rationale: ל与罕见的复数形式מּוּלֹת说明该称呼和割礼行为或礼仪有关；正文用现代汉语自然表达其解释作用，复数形式则在脚注中交代。
theological_decisions:
- issue: “放过了他”的主语和宾语所指
  choice: 明示主语为耶和华，宾语仍作“他”
  alternative: 可译为“耶和华放过了摩西”，或完全照原文作“他就离开了他”
  rationale: 第24节明确耶和华是采取敌对行动者，因此主语可由上下文补明；但宾语究竟如何具体理解虽以摩西最为自然，原文仍只使用代词，故正文不进一步消除其形式上的含混。
- issue: “血的新郎”的含义与受话者
  choice: 保留字面习语，不说明它是厌恶的感叹、礼仪称号，也不指定受话者
  alternative: 可解释为针对摩西或孩子的感叹，或与割礼礼仪有关的固定称号
  rationale: 该短语的文化背景、情感色彩及所指对象均不确定；解释性改写会超出文本证据。
- issue: 末句与前一句的关系
  choice: 译为“这是因割礼而说的”
  alternative: 可译为“关于割礼”或“由于割礼仪式”
  rationale: 原文的לַמּוּלֹת说明“血的新郎”这句话与割礼相关，但未明确规定更细的因果或礼仪含义，因此采用宽泛的解释性连接。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“放过”自然表达停止攻击；“血的新郎”刻意保留原文的突兀与晦涩。所有脚注标记均已置于正文相应位置。
