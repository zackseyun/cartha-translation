  source_fidelity: 译文准确呈现了燧石、割下儿子的包皮、脚及“血新郎”等核心词语，也以脚注保留了“脚”及代词所指的双重歧义。不过，“用它碰了他的脚”在现代汉语中既略显生硬，也可能被读成以燧石作为工具；上下文所承接的“它”应是割下的包皮。改为“把它触到他的脚上”更清楚地表达叙事承接，同时不在正文判定“他”是谁或“脚”是否为委婉语。
