base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: zh_hans
  text: 于是，西坡拉拿起一块燧石，割下她儿子的包皮，把它触到他的脚上[a]，说：“你对我真是个血的新郎。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“他的脚”。“脚”可能是生殖器的委婉说法；“他”可能指摩西，也可能指她的儿子。
    reason: 说明“脚”的可能委婉义，以及代词所指的双重歧义；正文不作裁定。
lexical_decisions:
- source_word: צֹר
  choice: 一块燧石
  rationale: 该词指可作切割工具的燧石或石片；“一块燧石”简洁自然，也符合割礼的语境。
- source_word: עָרְלַת בְּנָהּ
  choice: 她儿子的包皮
  rationale: 直接、准确地表达原文的构词关系，并保留其明确的身体用语。
- source_word: וַתַּגַּע
  choice: 用它碰了
  rationale: נגע的基本义是“触碰”；此译法保留动作方式上的含混，不将其解释为涂抹、放置或抛掷。
- source_word: לְרַגְלָיו
  choice: 他的脚
  rationale: 按字面译作“他的脚”，不在正文中判定“脚”是否为生殖器的委婉说法，也不判定代词具体指摩西还是儿子。
- source_word: כִּי
  choice: 真是
  rationale: 这里引出西坡拉的感叹；“真是”在现代汉语中自然地传达肯定和强调语气。
- source_word: חֲתַן דָּמִים
  choice: 血新郎
  rationale: 这是罕见且意义难定的表达；“血新郎”保留原文“血”与“新郎”的意象及其解释张力，避免释义性改写。
- source_word: לִי
  choice: 我的
  rationale: 介词表达与说话者的个人关系；汉语以“我的血新郎”自然对应“对我而言／属于我的血新郎”。
theological_decisions:
- issue: “他的脚”是否是委婉语，以及代词具体指谁
  choice: 正文保留字面表达“他的脚”，不明确所指
  alternative: 译作“他的生殖器”，或明确译作摩西／儿子的脚或生殖器
  rationale: 原文在“脚”是否为委婉语及代词所指两方面都存在真实歧义。正文不替读者作出解释性裁决，脚注则说明主要可能性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“燧石”“包皮”准确具体；“血新郎”刻意保留原文突兀、难解的表达。所有脚注标记均已置于正文相应位置。
