- from: 于是，西坡拉拿起一块燧石，割下她儿子的包皮，用它碰了他的脚[a]，说：“你真是我的血新郎。”
  to: 于是，西坡拉拿起一块燧石，割下她儿子的包皮，把它触到他的脚上[a]，说：“你对我真是个血的新郎。”
  rationale: 修订仅改善中文的指代清晰度和句法自然度。“它”仍按紧邻上下文承接所割下的包皮；“他的脚”仍完全保留原文的代词所指与可能委婉义的歧义，并由脚注说明。将“血新郎”写作“血的新郎”只是使汉语属格关系更可辨，并未解释该罕见表达。
