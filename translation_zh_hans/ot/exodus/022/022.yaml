id: EXO.22.22
reference: Exodus 22:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: zh_hans
  text: 你若真的苦待他[a]，他若真的向我呼求[b]，我必定听见他的呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用阳性单数代词“他”，在这里逐一指上一节提到的任何寡妇或孤儿。
    reason: cultural_note
  - marker: b
    text: 原文在“苦待”“呼求”和“听见”三处都用重复词根的语法结构加强语气，可表达为“真的苦待”“真的呼求”和“必定听见”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 按其通常用法引出条件句，也符合本节律法语境。
- source_word: עַנֵּה תְעַנֶּה
  choice: 真的苦待
  rationale: ענה的动词在此指使人受苦、恶待人；“苦待”贴近原义且适合现代汉语。动词不定式绝对形与限定动词连用带有强调作用，以“真的”表达。
- source_word: אֹתוֹ
  choice: 他
  rationale: 原文为阳性单数后缀；承接上一节所说的寡妇或孤儿，按个体逐一而论。
- source_word: כִּי אִם
  choice: 他若
  rationale: 在此继续引出受苦者呼求这一条件。汉语省去生硬的连接词，使条件关系清楚，同时不加入对因果关系的过度解释。
- source_word: צָעֹק יִצְעַק
  choice: 真的向我呼求
  rationale: 重复词根的结构强调呼求这一行动；“真的”保留强调，“呼求”自然表达向上帝发出的急切求告。
- source_word: אֵלַי
  choice: 向我
  rationale: 直接保留呼求的对象和方向。
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: 我必定听见
  rationale: 不定式绝对形与限定动词连用，强调上帝回应的确定性；“必定”在现代汉语中自然有力。
- source_word: צַעֲקָתוֹ
  choice: 他的呼求
  rationale: 与前面的צעק保持词义呼应，并保留原文阳性单数后缀。
theological_decisions:
- issue: 受苦者所用的阳性单数代词
  choice: 他／他的
  alternative: 他们／他们的
  rationale: 原文后缀为阳性单数，按形态译出；但在上下文中，这个单数代词逐一指上一节所说的任何寡妇或孤儿，并不排除女性。
- issue: 上帝“听见”呼求的强调
  choice: 必定听见
  alternative: 听见
  rationale: 原文的强调结构明确表达上帝必然垂听，因此保留确定语气，而不进一步解释垂听将以何种行动表现。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“苦待”“呼求”“必定听见”既保留律法宣告的严肃语气，也便于普通读者理解。两个条件分句的紧凑排列保留了希伯来文逐步推进、最终落在上帝确定垂听上的力量。
