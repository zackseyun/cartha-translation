  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: zh_hans
  text: 你不可延迟献上你丰收的出产和压榨所得的液体[a]。你要把你头生的儿子献给我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你丰足的农产和液态出产。”这两个希伯来词很可能分别指收割所得与压榨所得；具体可能是五谷和酒，也可能泛指固态与液态的出产。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: 你丰收的出产
  rationale: 该词本义为“充满、丰足”，在本节献物律例的农业语境中指收成的丰足出产。此译既保留丰收之意，也明确所指是农产品。
- source_word: וְדִמְעֲךָ
  choice: 榨取的汁液
  rationale: 该名词通常可指“泪滴”，但在此农业律例中指压榨流出的液态产品，可能是酒或油。译作“榨取的汁液”保留意象，并避免过度限定。
- source_word: לֹא תְאַחֵר
  choice: 不可延迟献上
  rationale: 动词在此表示耽延、推迟；上下文所延迟的是当献给上帝的出产，因此补出“献上”使现代汉语清楚自然。
- source_word: בְּכוֹר
  choice: 头生的
  rationale: 这是以色列律法中指首生者的常用概念；“头生的”在中文圣经语体中准确而庄重。
- source_word: בָּנֶיךָ
  choice: 你儿子中
  rationale: 希伯来文明确使用“儿子”的复数形式，不泛化为“儿女”或“孩子”。
- source_word: תִּתֶּן לִּי
  choice: 献给我
  rationale: 字面为“给我”。鉴于对象是归给上帝的头生子，“献给我”在中文中更清楚地表达礼仪与归属语境，而不改变命令的受益者。
theological_decisions:
- issue: 农业词组 מְלֵאָה / דִמְעָה 的范围
  choice: 分别译为丰收的出产与榨取的汁液，表达固态收成和液态产品。
  alternative: 特指五谷和酒；或笼统译为初熟之物。
  rationale: 原文很可能将田间收成与压榨所得并列，但并未明确将后者限定为酒或油。译文保留这一开放性。
- issue: “你儿子中头生的”的含义
  choice: 按原文保留“儿子”，并译为献给上帝。
  alternative: 译作“你头生的孩子”；或进一步解释其后续赎回制度。
  rationale: 本节本身使用阳性名词“儿子”，且只陈述归给上帝的要求；如何实行及赎回不宜在正文中提前解释，以免消解本节的张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可……你要……”体现禁令与正面命令的结构；用“汁液”而不直接译作“酒”或“油”，以保留原文词义范围。
