base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: zh_hans
  text: 但若日头已经升起[a]，杀死偷贼的人就有流血之罪[b]。那偷贼必须足数赔偿；若他一无所有[c]，就要因偷盗被卖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较意译为“若事情发生在日出以后”或“若是在白天”。希伯来文直译为“若太阳已经升起在他身上”；“他”在上下文中指偷贼。
    reason: lexical_alternative
  - marker: b
    text: 这里有流血之罪的是杀死偷贼的人。
    reason: alternative_reading
  - marker: c
    text: 这是偷贼无力赔偿时用来清偿偷盗债务的处置，即被卖作奴仆，并非把偷盗本身视为买卖。
    reason: cultural_note
lexical_decisions:
- source_word: אִם זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: 但若太阳已经照在他身上
  rationale: 保留希伯来文“太阳……在他身上”的具体意象，同时用“但若”显明本节与上一节夜间情形的对比。完成式在此按条件情境译为“已经照在”。
- source_word: דָּמִים לוֹ
  choice: 杀他的人就有流血之罪
  rationale: דָּמִים在法律语境中表示流血责任或血债。补出语境所指的“杀他的人”，避免中文误以为有罪的是被杀的偷贼，同时不改变法律判断。
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: 必须足数赔偿
  rationale: 不定式绝对形与未完成式连用，加强赔偿义务；“足数赔偿”既体现强调，也符合偷盗案件的法律语境。
- source_word: אִם אֵין לוֹ
  choice: 若他一无所有
  rationale: 自然表达其没有可用来赔偿的财物或能力，同时保留原文简洁说法。
- source_word: וְנִמְכַּר בִּגְנֵבָתוֹ
  choice: 就要因他所偷的被卖
  rationale: 保留被动法律后果；בִּגְנֵבָתוֹ可指其偷盗之事或所偷之物，此译法在中文中较自然，并维持一定词义宽度。
theological_decisions:
- issue: 日出后杀死偷贼所产生的流血责任
  choice: 将“有流血之罪”明确归于杀死偷贼的人，并保留以日出为界的具体表述。
  alternative: 把日出宽泛解释为威胁是否清楚可辨，而不严格指时间条件。
  rationale: 上下文以夜间与日出后的情形相对照。译文不把这一具体法律区分扩展成原文未明说的一般伦理原则，也不消除其中有关正当防卫限度的张力。
- issue: 本节中代词所指对象的转换
  choice: 前半句明说“杀他的人”，后半句明说“偷贼”，以呈现责任主体的转换。
  alternative: 逐字重复“他”，让读者自行判断每个代词所指。
  rationale: 希伯来文依靠上下文完成指称转换，但现代中文若全用“他”会产生严重歧义；补明对象属于必要的语篇显化，并未加入新的法律内容。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“足数赔偿”“流血之罪”保留经文的法律力度；通过明示“杀他的人”和“偷贼”，消除中文代词歧义。所有脚注标记均置于相关主文之后。
