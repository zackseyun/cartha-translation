  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: zh_hans
  text: 不可辱骂上帝[a]，也不可咒诅你百姓中的首领。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“审判官”；אֱלֹהִים 在某些语境中可以指人间权威，不过这里的平行结构较支持译作“上帝”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此词通常指上帝；结合本节把上帝与百姓中的人间首领并列而论，主文译作“上帝”较为合适。不过，该词在某些司法语境中也可指“审判官”，故将这一重要异读保留在脚注中。
- source_word: תְקַלֵּל
  choice: 辱骂
  rationale: קלל 的 Piel 词形可表示咒骂、轻蔑或侮辱。“辱骂”自然地表达以言语亵慢、贬损之意，同时不与下半句较明确的“咒诅”混同。
- source_word: נָשִׂיא
  choice: 首领
  rationale: 此词指在群体中居领导地位的人。“首领”既保留其权威含义，又不采用较狭窄或带古代爵位色彩的“王子”。
- source_word: בְעַמְּךָ
  choice: 你百姓中的
  rationale: 介词 בְּ 在这里表达身处群体之中；“你百姓中的”准确而自然地表明这位首领属于该群体。
- source_word: תָאֹר
  choice: 咒诅
  rationale: ארר 是表示施加咒诅的常用动词；“咒诅”清楚保留其强烈含义，并与前半句的“辱骂”形成措辞上的区别。
theological_decisions:
- issue: אֱלֹהִים 的所指
  choice: 上帝
  alternative: 审判官；诸神
  rationale: 单数谓语意义、法律语境及其与人间首领构成的平行关系，较支持将此处理解为“上帝”。但 אֱלֹהִים 在部分语境中可指人间司法权威，因此不把这一历来重要的理解排除掉，而是在脚注中注明。
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。“不可……也不可……”保留希伯来文两个平行禁令的结构；“辱骂”与“咒诅”则保留两个不同动词之间的语义差别。
