base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: zh_hans
  text: 如果有人使田地或葡萄园遭牲畜啃食[a]，又放出自己的牲畜，让它在别人的田地里吃食[b]，他就要拿自己田地里最好的和葡萄园里最好的作赔偿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“烧了田地或葡萄园。”希伯来语动词 בער 在某些语境中可指焚烧，但这里紧接着提到放出牲畜，因此更可能是指牲畜啃食、耗损田园。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文直译为“另一块田”；按这里的财产法语境，译作“别人的田地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 在判例式律法中引出假设情形；“如果”符合现代汉语法律表述。
- source_word: יַבְעֶר
  choice: 让牲畜吃……里的草
  rationale: 使役形在本语境中表示使土地被牲畜啃食；下文“放开牲畜”支持放牧、啃食之义，同时尽量体现使役色彩。
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: 田里或葡萄园里
  rationale: 采用现代、易懂的农业用语，并保留原文的单数判例形式。
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: 又放开牲畜
  rationale: שִׁלַּח 表示放出、任其行动；בְּעִירֹה 在此指其所有的家畜。汉语可由语境自然表达所属关系。
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: 使它吃了别人的田地
  rationale: 重复的 בער 延续牲畜啃食、耗损作物的意思；“别人的”自然表达 אַחֵר 在财产法语境中的隐含所属。
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: 自己田里最好的和葡萄园里最好的
  rationale: מֵיטַב 指最上等、最好的部分；“自己”明确赔偿须出自肇事者的产业。
- source_word: יְשַׁלֵּם
  choice: 作赔偿
  rationale: שׁלם 的加强式在盟约律法中表示补偿损失；“作赔偿”准确传达法律责任。
