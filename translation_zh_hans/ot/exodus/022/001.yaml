base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: zh_hans
  text: 若发现贼闯入人家[a]，有人击打他，以致他死了，击打他的人就不负血债。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译为“若在破入时发现贼”。这里的希伯来语指破入或秘密闯入，可能包括挖穿房墙进入。
    reason: lexical_alternative
  - marker: b
    text: 意思是：在这种情形下，击打贼的人不承担流人血的法律责任。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: 正在破门而入
  rationale: 该名词指秘密闯入，常涉及挖穿房墙。译为“正在破门而入”以自然汉语呈现此法律情境，同时不把方式限定为挖地道。
- source_word: יִמָּצֵא
  choice: 发现
  rationale: מצア 的尼法勒式在本条件句中表示“被发现”；汉语用“如果发现……”可自然表达其被动含义。
- source_word: הַגַּנָּב
  choice: 贼
  rationale: גנב 是“贼、偷窃者”的普通用词；“贼”简洁直接，也符合本节具体的入室情境。
- source_word: וְהֻכָּה
  choice: 有人击打他
  rationale: נכה 的被动式表示遭到击打，并未说明击打次数。“击打”比“殴打”更少暗示反复施暴；为使汉语清楚，补出未明说的施事者“有人”。
- source_word: וָמֵת
  choice: 以致他死了
  rationale: 此连续表达击打所造成的结果；“以致”清楚呈现结果关系，同时不额外断定行为人的主观意图。
- source_word: אֵין לוֹ דָּמִים
  choice: 击打的人不负血债
  rationale: דמים 在此是关于流人血之法律责任的惯用语。“不负血债”保留其盟约法律色彩，并依据语境明确 לוֹ 所指的是击打贼的人。
theological_decisions:
- issue: 闯入情境中致人死亡的法律判定
  choice: 译为“击打的人不负血债”
  alternative: 译为“他不算犯谋杀罪”
  rationale: 原文判定的是这一具体情形下不承担流血之责，并非对杀人作普遍的道德认可。“血债”也避免把古代法律用语窄化为现代刑法中的“谋杀罪”。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“破门而入”按功能表达秘密侵入，不限定具体手段；“不负血债”保留原文法律惯用语的神学与司法张力。
