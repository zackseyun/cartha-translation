base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/012.yaml
  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: zh_hans
  text: 但如果牲畜确实被野兽撕碎了[a]，受托看管的人要把它带来作证据；对于被撕碎的牲畜，他不用赔偿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“但如果牲畜的确被撕碎了，他要把被撕碎的牲畜带来作证据，不用赔偿。”
    reason: 原文没有明说施害者是野兽；“被野兽撕碎”依照该动词在此语境中的通常含义作了明确化。另一个译法保留原文较紧凑的表述。
lexical_decisions:
- source_word: אִם
  choice: 但如果
  rationale: 承接上一节的法律情形并引出与之相对的条件，现代汉语用“但如果”自然清楚。
- source_word: טָרֹף יִטָּרֵף
  choice: 确实被野兽撕碎了
  rationale: 不定式绝对形与限定动词连用，带有强调作用；“确实”体现这一语气。טרף在此法律语境中指牲畜遭猛兽撕咬，译作“被野兽撕碎”既自然，也交代了事故性质。
- source_word: יְבִאֵהוּ
  choice: 要把残骸拿来
  rationale: 使役词干在此表示“带来、拿来”。代词所指最自然地理解为被撕牲畜留下的残骸；明说“残骸”可使中文指代清楚，但不把它理解为必须带来完整尸体。
- source_word: עֵד
  choice: 作证据
  rationale: 该词通常意为“见证、证人”，这里所带来的残骸发挥物证作用，因此“作证据”符合司法语境，也比“作见证”更不易被误解为人证。
- source_word: הַטְּרֵפָה
  choice: 被撕碎的牲畜
  rationale: 指遭撕咬之物，即本段所说受托看管的牲畜。中文明确补出“牲畜”，使句意完整，同时未限定为完整尸体。
- source_word: לֹא יְשַׁלֵּם
  choice: 不用赔偿
  rationale: שלם的加强词干在契约法律中表示赔还、补偿；“不用赔偿”准确传达免除赔偿责任的法律含义，并符合现代汉语表达。
theological_decisions: []
