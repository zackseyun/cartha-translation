source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ כֶּ֤סֶף אֽוֹ כֵלִים֙ לִ/שְׁמֹ֔ר וְ/גֻנַּ֖ב מִ/בֵּ֣ית הָ/אִ֑ישׁ אִם יִמָּצֵ֥א הַ/גַּנָּ֖ב יְשַׁלֵּ֥ם שְׁנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: zh_hans
  text: 如果有人把银钱[a]或物品[b]交给邻舍保管，东西却从那人的家里被偷了；如果找到了贼，贼就要双倍赔偿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“银子”，这里指钱财。
    reason: lexical_alternative
  - marker: b
    text: 或译“器具”“物件”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“赔还两份”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 在判例法条文中引出假设情形；“如果”自然地表达条件关系。
- source_word: יִתֵּן אִישׁ
  choice: 有人把……交给
  rationale: 原文是阳性单数“一个人给”；现代汉语法律表述用“有人”既自然，也不改变其代表性个体的功能。
- source_word: אֶל רֵעֵהוּ
  choice: 给邻舍
  rationale: רֵעַ在此指共同体中的同伴或他人；“邻舍”准确且符合庄重的圣经语体。
- source_word: כֶּסֶף
  choice: 银钱
  rationale: 该词本义为“银子”，在经济法律语境中可指钱财；“银钱”兼顾字面意象与实际功能。
- source_word: אוֹ כֵלִים
  choice: 或物品
  rationale: כֵלִים范围较广，可指器具、用品或各种物件；“物品”在保管财物的语境中清楚而不过度限缩。
- source_word: לִשְׁמֹר
  choice: 保管
  rationale: 不定式表达托付的目的，即代为看守；“保管”是现代汉语中自然、准确的法律用语。
- source_word: וְגֻנַּב
  choice: 东西却……被偷了
  rationale: 保留原文被动意义；用“东西”概括前述银钱或物品，并以“却”自然推进案件情形。
- source_word: מִבֵּית הָאִישׁ
  choice: 从那人的家里
  rationale: 贴近原文“从那人的房屋”，并保留原文对“那人”所指可能存在的语用张力，不擅自改写为“保管人”。
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: 如果找到了贼
  rationale: מצא的尼法勒式直译为“被找到”；汉语无主句“找到了贼”自然表达同一意思，同时避免解释为已被捕获或定罪。
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: 贼就要双倍赔偿
  rationale: 该短语表示按两倍偿还；补明上下文中的主语“贼”，使汉语指代清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“邻舍”保留经文惯用词；“保管”“双倍赔偿”则使用普通读者熟悉的现代汉语。脚注标记均置于其所说明的词语之后，并按原文词义重新校正位置。
