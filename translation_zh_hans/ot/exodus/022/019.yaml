  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: zh_hans
  text: 凡向任何神明献祭的，除非是单单向雅威献祭，必被交付毁灭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必被置于禁令之下”或“必被彻底毁灭”。希伯来语动词表示被不可撤销地划归于禁令，交付毁灭。
    reason: 说明חרם的法律、献归与毁灭含义，并列出较直白的译法。
lexical_decisions:
- source_word: זֹבֵחַ
  choice: 向……献祭的
  rationale: Qal主动分词在这里名词化，泛指任何实施献祭的人；“献祭”保留了宰牲祭祀的礼仪含义。
- source_word: לָאֱלֹהִים
  choice: 向任何神明
  rationale: אֱלֹהִים在形态上是复数，但本句与“唯独向雅威”形成排他对照，泛指雅威以外任何受祭祀的神祇；“任何神明”在现代汉语中自然地表达这种泛指和分配意味。
- source_word: יָחֳרָם
  choice: 必被归于毁灭
  rationale: חרם的Hophil形态表示被置于不可撤销的禁令之下，归作毁灭；该译法兼顾被动语态、判决语气及其献归与刑罚两方面的含义。
- source_word: בִּלְתִּי
  choice: 除外
  rationale: 此处引出唯一的例外，与前面的泛指对象构成清楚的排他关系。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 以“雅威”音译四字神名יהוה，并保留介词所表达的献祭对象。
- source_word: לְבַדּוֹ
  choice: 唯独
  rationale: 表达献祭对象的严格排他性；放在“向雅威献祭”之前，符合现代汉语语序。
theological_decisions:
- issue: 偶像献祭禁令中חרם刑罚术语的译法
  choice: 必被归于毁灭
  alternative: 必被彻底毁灭；必被置于禁令之下
  rationale: 原词不只表示一般意义上的处死或毁坏，也涉及被不可撤销地划归于禁令及毁灭。“归于毁灭”尽量保留这种神学—法律张力，脚注再说明其他可行译法。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的四字神名；音译“雅威”保留其作为专名的功能，避免把专名改写成称号。
- issue: אֱלֹהִים在本句中的数与泛指范围
  choice: 任何神明
  alternative: 众神；一个神；神
  rationale: 该词形本身容许复数“众神”或语境中的泛指理解；鉴于后句明确限定唯独雅威，“任何神明”自然表达禁令涵盖每一个其他祭祀对象，但不主张这些神祇真实或合法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“唯独……除外”保留原句先宣告禁令、后提出唯一例外的结构；“必”体现法律条文的确定语气。
