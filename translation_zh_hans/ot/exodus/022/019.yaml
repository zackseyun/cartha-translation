revisions:
- from: 向任何神明献祭的，唯独向雅威献祭的除外，必被归于毁灭[a]。
  to: 凡向任何神明献祭的，除非是单单向雅威献祭，必被交付毁灭[a]。
  rationale: 修订以“除非是单单向雅威献祭”明确原文例外所限定的是献祭对象，并保留“单单／唯独”的排他力度。以“被交付毁灭”替换较生硬的“被归于毁灭”，脚注继续交代ḥerem并非普通的毁坏用语，而有不可撤销地置于禁令、交付毁灭的法律含义。
