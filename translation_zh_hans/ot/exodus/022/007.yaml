  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: zh_hans
  text: 若找不到贼，房主就要到上帝面前[a]，查明房主有没有擅自动用邻舍的财物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“到审判官面前”。希伯来文作“到上帝面前”；在某些法律语境中，这个词也可能指奉上帝权柄施行审判的人。
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: 找不到贼
  rationale: מצָא的尼法勒形在此为被动含义，指贼未被找到或查出；“找不到”直接自然，也不限定是尚未认出还是尚未抓获。
- source_word: וְנִקְרַב
  choice: 就要到……面前
  rationale: קרב的尼法勒形可表示“走近”，也可表示“被带到近前”。这里用“到……面前”符合司法场景，同时不明确限定是谁带他前来。
- source_word: בַּעַל הַבַּיִת
  choice: 房主
  rationale: בעל הבית指拥有或掌管房屋的人；“房主”简洁、现代，并适合法律语境。
- source_word: אֶל הָאֱלֹהִים
  choice: 到上帝面前
  rationale: 原文直译为“到上帝那里/面前”。在这段法律语境中，也可能指奉上帝权柄施行审判的人，因此正文保留直接词义，并以脚注说明另一种理解。
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: 查明他是否没有伸手动过
  rationale: 正文保留原文“伸手”的形象及否定式问法；“动过”在现代汉语中能自然表达擅自取用或处置，而不把含义缩窄为偷窃。
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: 邻舍的财物
  rationale: מְלָאכָה通常可指工作或事务，但在交托银钱或物品的法律上下文中，指邻舍所属或托管的财物；“财物”最符合此处实际所指。
theological_decisions:
- issue: 法律语境中אֱלֹהִים的含义
  choice: 到上帝面前
  alternative: 到审判官面前
  rationale: 希伯来文通常意为“上帝”，但在某些盟约法律语境中可能指代表上帝施行审判的人。正文不默默消除这种张力，采用直接词义，并在脚注保留司法性的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“房主”“财物”简洁明确；“伸手动过”保留希伯来语意象及其可能涵盖擅用、侵占等行为的宽度。
