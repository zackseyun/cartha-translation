  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: zh_hans
  text: 物主若与它同在，借用的人就不必赔偿；若是租来的，租金已包括在内。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“若他是雇工，他的工价已包括在内。”希伯来文十分简略，既可理解为租来的牲畜或物件，也可理解为受雇的人；鉴于上下文讨论借来财物的赔偿责任，正文采用前一种理解。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: 物主
  rationale: בעל在本段财产责任法规中指所借牲畜或物件的所有人；“物主”简洁而保留法律语体。
- source_word: עִמּוֹ
  choice: 与它同在
  rationale: 介词עִם带第三人称阳性单数后缀，所指可理解为前文所借的牲畜或物件；此译法保留原文关系，不额外说明物主以何种方式在场。
- source_word: לֹא יְשַׁלֵּם
  choice: 就不必赔偿
  rationale: שלם的加强式在法律语境中表示作出赔偿；现代汉语以“不必赔偿”自然表达免除赔偿责任。
- source_word: שָׂכִיר
  choice: 租来的
  rationale: שָׂכִיר通常可指受雇者，但在借用财物的直接语境中可省略地指租来的牲畜或物件；正文采用财物解读，同时以脚注保留人的解读。
- source_word: בָּא בִּשְׂכָרוֹ
  choice: 它是为租金而来的
  rationale: 原文表达极为简略，直译近于“它在其租价中而来”。此译保留租金与风险承担之间未明说的关系，避免直接增补“租金已涵盖损失”等解释。
