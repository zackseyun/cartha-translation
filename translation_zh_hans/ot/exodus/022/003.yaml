base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/003.yaml
  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: zh_hans
  text: 如果在他手中确实找到了被偷的牲畜，无论是牛、驴还是羊，而且还活着，他就要加倍赔偿。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“如果被偷之物确实在他手中被找到，从牛到驴到羊，仍是活的，他要赔偿双份。”希伯来语用同根词连用来强调“找到”，而“在他手中”在这里表示由他占有或控制。
    reason: 说明原文强调结构、法律习语及列举方式。
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 标准条件连词，用来引出这一判例的条件。
- source_word: הִמָּצֵא תִמָּצֵא
  choice: 确实……找到
  rationale: 不定式绝对形与同根限定动词连用，加强“找到”的语气；“确实”在现代汉语中自然地传达强调意味。
- source_word: בְיָדוֹ
  choice: 在他手中
  rationale: 原文直译为“在他手中”，在法律语境中表示由他占有或控制；中文“在他手中”既保留意象，也能自然表达占有。
- source_word: הַגְּנֵבָה
  choice: 被偷的牲畜
  rationale: 该词指被盗之物，而非偷盗行为；下文列举牛、驴、羊并说明仍然活着，因此在本句中明确为牲畜最为自然。
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: 无论是牛、驴还是羊
  rationale: 原文以“从……到……到……”列举牲畜类别；用“无论是……还是……”传达判例适用于各类所列牲畜。
- source_word: חַיִּים
  choice: 并且还活着
  rationale: 复数形容词作表语，说明被盗牲畜被找到时仍活着，与被宰杀或变卖的情形相对。
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: 他就要加倍赔偿
  rationale: 这是规定双倍偿还的法律用语；“要”表达规范效力，“加倍赔偿”符合现代汉语法律语感。
