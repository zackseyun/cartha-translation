  text: But if it is stolen from him[a], he shall make restitution to its owner.
translation:
  language: zh_hans
  text: 但若确实从他那里被偷走[a]，他就要赔偿物主。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“若偷窃，它从他那里被偷走”。原文以“偷窃”的不定式绝对形与同根的“被偷走”连用，构成强调，意为“若确实从他那里被偷走”。在本段语境中，这指所托之物在他保管期间失窃。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但若
  rationale: 在连续的判例条文中引出与上一种情形相对的条件，译作“但若”既体现承接中的转折，也符合现代汉语法律语气。
- source_word: גָּנֹב יִגָּנֵב
  choice: 真……被偷走
  rationale: 原文以不定式绝对形配合同根限定动词，加强“被偷”的语意；用“真”自然传达这种强调，同时保留被动含义。被偷之物由上文补足，不在本节重复明说。
- source_word: מֵעִמּוֹ
  choice: 从他那里
  rationale: 原义近于“从与他同在之处”，在本案语境中表示物品在受托人保管期间从他那里失窃。“从他那里”直接而不过度解释。
- source_word: יְשַׁלֵּם
  choice: 赔偿
  rationale: שלם 的强意词干在法律语境中表示作出赔付或补偿；“赔偿”简洁地体现其法律责任。
- source_word: לִבְעָלָיו
  choice: 物主
  rationale: בעל 在这里指受托财物的所有人。复数形式带单数第三人称后缀，按希伯来语惯用法自然译为单数“物主”。
