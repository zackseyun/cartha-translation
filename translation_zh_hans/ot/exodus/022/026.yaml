base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: zh_hans
  text: 因为这是他唯一的遮盖，是他遮身的外衣；他拿什么睡觉呢？如果他向我呼求，我必垂听，因为我是有恩慈的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有恩慈的”也可译作“有怜悯的”或“有慈悲的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节归还抵押衣物的命令，说明其理由。
- source_word: כְּסוּתֹה לְבַדָּהּ
  choice: 他唯一的遮盖
  rationale: 按辅音文本及马所拉旁读理解为“他的遮盖”，并将 לְבַדָּהּ 的排他意义自然表达为“唯一的”。
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: 他贴身的衣服
  rationale: שִׂמְלָה 指可披裹的衣物；לְעֹרוֹ 字面为“给他的皮肤”，此处用“贴身”保留衣物直接遮蔽身体的具体意象，同时符合现代汉语。
- source_word: בַּמֶּה יִשְׁכָּב
  choice: 他拿什么躺卧呢？
  rationale: 保留原文的反问及 שׁכב“躺卧”的基本意义；“拿什么”自然传达介词 ב 的工具或凭借含义。
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: 如果他向我呼求
  rationale: 该结构引入将来的条件情形；汉语用“如果”即可自然表达，无须机械译出 וְהָיָה。צעק 表示困苦中的求救呼喊，译作“呼求”。
- source_word: וְשָׁמַעְתִּי
  choice: 我必垂听
  rationale: “垂听”既保留“听见”的意义，也自然表达上帝回应困苦者呼求的语境，语体庄重而不古奥。
- source_word: חַנּוּן
  choice: 有恩慈的
  rationale: 该词涵盖施恩、怜悯与慈悲的品格；“有恩慈的”较能保留其宽广语义，避免只突出情感同情。
theological_decisions:
- issue: 上帝自我描述 חַנּוּן 的译法
  choice: 有恩慈的
  alternative: 有怜悯的／有慈悲的
  rationale: 原词描述上帝乐意施恩并怜悯困苦者的品格。“有恩慈的”保留施恩和慈悯两方面，不把经文限定为某一较窄的神学表述；其他译法作为真实的词义可能列入脚注。
translation_notes:
  register: 采用现代、庄重而清楚的标准普通话。“遮盖—贴身的衣服—躺卧”保留原文由衣物到身体、再到夜间睡卧的具体逻辑；反问句保留律法论证的力度。
