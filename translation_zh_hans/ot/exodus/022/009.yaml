base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: zh_hans
  text: 人若把驴、牛、羊[a]或任何牲畜交给邻舍看管，牲畜死了，或受了伤[b]，或被掳走，且没有人看见[c]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊”所译的希伯来语也可泛指羊群中的一只，即绵羊或山羊。
    reason: lexical_alternative
  - marker: b
    text: 直译“被折断”。
    reason: lexical_alternative
  - marker: c
    text: 即没有人目睹事情是怎样发生的。
    reason: clarification
lexical_decisions:
- source_word: כִּי יִתֵּן אִישׁ
  choice: 人若把……交给
  rationale: כִּי在判例法中引出条件，以“若”自然表达；יִתֵּן本义为“给”，结合לִשְׁמֹר所表明的保管目的，译作“交给”既贴近原文，也符合现代汉语法律语境。אִישׁ在此为个案中的泛指主体，汉语用“人”即可自然保留其代表性，无须硬加男性称谓。
- source_word: אֶל רֵעֵהוּ
  choice: 给邻舍
  rationale: רֵעַ指社会关系中的同伴或邻人；“邻舍”庄重且为普通读者所熟悉，又不暗示亲密关系。
- source_word: חֲמוֹר אוֹ שׁוֹר אוֹ שֶׂה
  choice: 驴、牛、羊
  rationale: 依次采用清楚自然的牲畜名称。שֶׂה可泛指羊群中的一只，包括绵羊或山羊；正文用概括性的“羊”，并以脚注保留其语义范围。
- source_word: וְכָל בְּהֵמָה
  choice: 或任何牲畜
  rationale: בְּהֵמָה在本法条中指家养动物财产；“牲畜”比宽泛的“动物”更准确地契合上下文。连词וְ在列举末项中自然译作“或”。
- source_word: לִשְׁמֹר
  choice: 看管
  rationale: 该不定式说明交付牲畜的目的，即由对方负责照看、守护；“看管”是自然且明确的现代汉语。
- source_word: וּמֵת
  choice: 牲畜若死了
  rationale: 汉语补出“牲畜”，使后续条件清楚；“死了”直接表达原文动词，未增添死因。
- source_word: נִשְׁבַּר
  choice: 受了伤
  rationale: 该词字面为“被折断、破裂”；用于动物时表示身体受损。“受了伤”符合现代汉语，但脚注保留字面表达。
- source_word: נִשְׁבָּה
  choice: 被掳走
  rationale: שׁבה的被动式意为“被俘、被带走”，可能涉及袭掠，不宜径自缩窄为“被偷走”。“被掳走”保留其强制带离的含义。
- source_word: אֵין רֹאֶה
  choice: 又没有人看见
  rationale: 直译为“没有看见者”；正文自然表达原文所说无人目睹的情形，脚注说明是指没有目击事情经过的人。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的判例法语体。句首用“人若”引出法律条件，以“交给……看管”明确托管关系。经文在所给原文处尚未结束，因此末尾保留逗号，以衔接下一条款。所有脚注标记均紧随相关词语，次序为[a]、[b]、[c]。
