  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כִֽי יִשְׁאַ֥ל אִ֛ישׁ מֵ/עִ֥ם רֵעֵ֖/הוּ וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת בְּעָלָ֥י/ו אֵין עִמּ֖/וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: zh_hans
  text: 人若向邻舍借了什么，所借的若受损[a]或死亡，而物主没有在场，借用人就必须赔偿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“被折断”或“损坏”；希伯来语可指借来之物损坏，也可指借来的牲畜受伤。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“赔偿，他必赔偿”，以重复形式强调赔偿义务。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 人若
  rationale: 引出律例中的条件个案；现代汉语法律叙述以“若”自然表达这一条件关系，无须生硬译出句首连接词。
- source_word: יִשְׁאַל
  choice: 借了什么
  rationale: 此处指借用财物或牲畜，而非一般的询问或请求；补出“什么”可为后续未明说的借用对象提供自然承接。
- source_word: אִישׁ
  choice: 人
  rationale: 希伯来文为阳性单数，但在个案律法中泛指当事人；汉语“人”准确而自然，不额外限定为成年男性。
- source_word: מֵעִם רֵעֵהוּ
  choice: 向邻舍
  rationale: רֵעַ 在盟约律法语境中指同属群体的另一人；“邻舍”保留其法律与关系色彩。
- source_word: וְנִשְׁבַּר
  choice: 受损
  rationale: 字面为“被折断、损坏”，但上下文的借用对象也可能是会死亡的牲畜；“受损”可兼指物品损坏和牲畜受伤，并以脚注保留字面范围。
- source_word: אוֹ מֵת
  choice: 或死亡
  rationale: 与“受损”并列，直接表达借用对象死亡的情形。
- source_word: בְּעָלָיו
  choice: 物主
  rationale: 该词虽有复数形式特征，在此按惯用法指单数所有人；“物主”简洁指明借用对象的主人。
- source_word: אֵין עִמּוֹ
  choice: 没有在场
  rationale: 希伯来文直译为“不与他同在”；在本条责任规定中，重点是物主是否在场。这样译可避免在汉语中强行判定代词究竟指借用人还是借用物，同时保留法律条件。
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: 必须赔偿
  rationale: 不定式绝对形与限定动词连用，加强赔偿义务；“必须赔偿”自然传达其强制与确定性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的律法文体。“人若……就必须……”符合现代汉语条件句习惯；“借用人”在结句明确承担责任者，避免连续代词造成歧义。
