base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: zh_hans
  text: 如果火烧起来，蔓延到荆棘[a]，以致堆积的禾捆、田间未收割的庄稼或田地被烧毁，那么点火的人必须作出赔偿[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“烧着了荆棘”；直译是“遇到了荆棘”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文用不定式绝对形与限定动词连用，强调赔偿义务；也可译作“务必赔偿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 引出典型的条件式判例，现代汉语法律表达用“如果”自然清楚。
- source_word: תֵצֵא אֵשׁ
  choice: 火烧起来
  rationale: 这是火发生并失去控制的惯用表达，不是指火熄灭；“烧起来”符合自然汉语。
- source_word: וּמָצְאָה קֹצִים
  choice: 蔓延到荆棘
  rationale: 字面为“遇到/找到荆棘”，语境中指火势到达荆棘并借此延烧；译文表达实际含义，脚注保留字面意象。
- source_word: קֹצִים
  choice: 荆棘
  rationale: 直接保留希伯来文的植物意象；在本语境中可能指易燃的带刺灌木。
- source_word: וְנֶאֱכַל
  choice: 被烧毁
  rationale: 该动词用于火时表示被吞噬、烧掉；“被烧毁”比直译“被吃掉”自然明确。
- source_word: גָּדִישׁ
  choice: 堆积的禾捆
  rationale: 指已经收割并聚集成堆的谷物；此译与后面的田间庄稼形成对照。
- source_word: הַקָּמָה
  choice: 田间未收割的庄稼
  rationale: 指仍立在田里的作物；意译说明其尚未收割，便于现代读者理解。
- source_word: הַשָּׂדֶה
  choice: 田地
  rationale: 按普通词义直译，并保留受损对象可包括整块田地这一层面。
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: 必须作出赔偿
  rationale: 不定式绝对形与限定动词连用，加强赔偿义务；“必须”传达法律强制与强调。
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: 点火的人
  rationale: 指造成这场燃烧的人；“点火的人”简洁自然，并保留行为责任。
theological_decisions: []
