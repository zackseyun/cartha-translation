  yaml_path: translation/ot/exodus/022/018.yaml
  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: zh_hans
  text: 凡与动物交合的人，必须被处死[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“必定被处死。”希伯来文的法律用语在这里表示确定执行死刑。
    reason: 说明希伯来文强化结构的较直译形式及其司法、被动含义。
lexical_decisions:
- source_word: כָּל
  choice: 凡……的
  rationale: כָּל接分词构成泛指表达；现代汉语用“凡……的”既自然，又保留法律条文的普遍适用语气。
- source_word: שֹׁכֵב עִם
  choice: 与……交合
  rationale: 该结构是指性行为的惯用委婉表达。“交合”明确、庄重，适合法律语境，同时没有添加原文未明说的细节。
- source_word: בְּהֵמָה
  choice: 牲畜
  rationale: בְּהֵמָה通常指兽类，尤可指家畜或牲畜；本处用“牲畜”符合此词常见范围及现代汉语表达。较宽泛的“兽类”也有可能。
- source_word: מוֹת יוּמָת
  choice: 必须处死
  rationale: 不定式绝对式מוֹת加强被动式יוּמָת，构成法律上的死刑公式。“必须处死”简洁传达其强调和司法处罚性质。
theological_decisions:
- issue: 法律死刑公式的译法
  choice: 必须处死
  alternative: 必定死亡
  rationale: 原文形式上可直译为“必定死亡”，但被动动词及法律上下文表明这是司法处死。“必须处死”保留确定性和被动处罚的含义，不把它弱化为一般性的死亡预告。
translation_notes:
  register: 采用简洁、庄重的现代汉语法律语体。“交合”避免口语化或过度临床化；“凡……的，必须……”清楚呈现普遍禁令与刑罚。
