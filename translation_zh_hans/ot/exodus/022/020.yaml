source:
  edition: WLC
  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: zh_hans
  text: 不可欺负寄居者，也不可压迫他[a]，因为你们在埃及地也曾是寄居者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”指住在以色列人中间、并非本地出生的人；也可译作“外来居民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: 寄居者
  rationale: 指住在以色列人中间、并非本地出生的人，不只是短暂停留的过客。“寄居者”既保留居住在异乡的含义，也能在前后两处保持同词复现。
- source_word: תוֹנֶה
  choice: 欺负
  rationale: 该动词在使役词干中表示亏待、伤害或不公正地对待。“欺负”是现代汉语中自然且涵盖面较广的表达，不把含义局限于经济剥削。
- source_word: תִלְחָצֶנּוּ
  choice: 压迫他
  rationale: לחץ表示施加严酷压力或压迫；“压迫”保留法律语境中的力度，“他”对应希伯来文第三人称阳性单数后缀。
- source_word: כִּי
  choice: 因为
  rationale: 引出禁令的理由；“因为”在现代汉语中清楚自然。
- source_word: הֱיִיתֶם
  choice: 曾是
  rationale: 表示以色列人在埃及过去所处的身份状态；“曾是”简洁地体现过去情形。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留原文明确出现的“地”，同时符合庄重、自然的中文圣经语体。
theological_decisions:
- issue: 单数阳性形式在法律条文中的泛指作用
  choice: 保留“寄居者……他”的单数对应
  alternative: 改为复数“寄居者……他们”，或省略代词
  rationale: 原文以单数 גֵר 和第三人称阳性单数后缀作泛指。译文保留其数和代词形式，不将泛指范围限制为男性，也不抹平原文的语法特征。
translation_notes:
  register: 采用现代、庄重而易懂的法律训诫语体。“不可……也不可……”呈现两个并列禁令；末句以“也曾”加强命令与以色列自身经历之间的对应。
