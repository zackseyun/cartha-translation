source:
  edition: WLC
  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: zh_hans
  text: 凡有关过犯的案件，无论涉及牛、驴、羊[a]、衣服，或任何失物；若有人说：“就是这个”，双方的案件都要呈到上帝[b]面前。上帝判谁有罪，谁就要加倍赔偿给对方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊”所译的希伯来语泛指小型牲畜，可以是绵羊，也可以是山羊。
    reason: lexical_alternative
  - marker: b
    text: 或译“审判官”或“法庭”。这里的希伯来语 אֱלֹהִים 可以直接指上帝，也可能指在法律案件中凭上帝所授的权柄行事的人间审判官。
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: 涉及过犯的案件
  rationale: דָּבָר在这里指法律案件，פֶּשַׁע指过犯或不法行为；此译保留司法语境，又不把具体罪名说得过窄。
- source_word: שׁוֹר
  choice: 牛
  rationale: 在财产法规的列举中泛指一头牛；现代汉语用“牛”自然且准确，无须限定为公牛或役牛。
- source_word: חֲמוֹר
  choice: 驴
  rationale: 对应常见家畜，采用现代汉语通用名称。
- source_word: שֶׂה
  choice: 羊
  rationale: שֶׂה泛指一头绵羊或山羊等小型牲畜；正文用概括性的“羊”，并以脚注保留其范围。
- source_word: שַׂלְמָה
  choice: 衣服
  rationale: 指一般衣物；“衣服”比“外衣”范围更宽，也更符合现代汉语。
- source_word: אֲבֵדָה
  choice: 遗失之物
  rationale: 该名词泛指丢失的物品或财物；此译贴近原文而且清楚。
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: 有人说：“就是这个”
  rationale: 保留原文简短而略含歧义的指认说法，不额外断定说话者是在认领、控告还是辨认物品。
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: 上帝
  rationale: אֱלֹהִים的直接词义为“上帝”；法律语境中也可能指在神圣权柄下审判的审判官，因此正文保留直接词义，另以脚注说明司法性解释。
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: 双方的案件都要呈到……面前
  rationale: דָּבָר在此仍是法律案件，“双方”自然表达双数形式שְׁנֵיהֶם；“呈到……面前”体现案件被提交审理。
- source_word: יַרְשִׁיעֻן
  choice: 判谁有罪
  rationale: רשע的使役式在司法语境中表示宣告某人有罪；“判……有罪”准确而自然。
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: 加倍赔偿
  rationale: 该表达指双倍偿付；“加倍赔偿”符合财产纠纷语境，也清楚表达两倍数额。
- source_word: לְרֵעֵהוּ
  choice: 给对方
  rationale: רֵעַ可指邻舍、同伴；在双方诉讼的语境中实际指另一方，译作“对方”最为清楚，且不增加关系上的含义。
theological_decisions:
- issue: 法律语境中אֱלֹהִים的所指
  choice: 上帝
  alternative: 审判官／法庭
  rationale: 原词通常指上帝，正文按其直接词义翻译；但在盟约法律语境中，它也可能指代表神施行审判的人间审判官。该歧义具有文本与神学意义，因此不在正文中武断消除，而在脚注中保留另一读法。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文保留“就是这个”的简洁指认方式及“上帝／审判官”的真实歧义；用“案件、双方、判……有罪、赔偿”等通行法律词汇呈现条文性质，同时避免过度技术化。
