  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: zh_hans
  text: “如果[a]你借钱给我子民中在你中间的穷人，就不可像债主那样催逼他还债；也不可向他收取利息。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如果”也可译作“当……时”；希伯来文在判例式律法中常用这种条件句。
    reason: 说明 אִם 在法律条件句中的语用。
  - marker: b
    text: 直译为“不可把利息加在他身上”。
    reason: 保留 תְשִׂימוּן עָלָיו נֶשֶׁךְ 的字面措辞。
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 保留希伯来文条件句形式；在判例式律法中也可具有“当……时”的语用含义。
- source_word: כֶּסֶף
  choice: 钱
  rationale: 字面为“银子”，但在此借贷语境中指货币；“钱”是现代汉语的自然表达。
- source_word: תַּלְוֶה
  choice: 借……给
  rationale: 该使役形在此意为“借出、贷款给”；汉语用“借钱给”最清楚自然。
- source_word: עַמִּי
  choice: 我的子民
  rationale: 保留第一人称所属关系，并以庄重、通行的圣经语体表达群体身份。
- source_word: הֶעָנִי
  choice: 穷人
  rationale: 希伯来文为阳性单数实体化形容词，指贫穷的个人；汉语“穷人”既可指个体，也不必额外加入原文没有的“男人”。
- source_word: עִמָּךְ
  choice: 你中间的
  rationale: 字面为“与你同在的”，此处表示属于该共同体的人；“你中间的”贴近原文且符合律法语体。
- source_word: כְּנֹשֶׁה
  choice: 像债主那样……逼债
  rationale: 该分词不只表明债权人身份，也可含催逼还债之意；结合后续代词，以“像债主那样向他逼债”传达其社会伦理力度。
- source_word: תְשִׂימוּן עָלָיו נֶשֶׁךְ
  choice: 向他收取利息
  rationale: 字面为“把利息加在他身上”；汉语以“收取利息”自然表达这一借贷惯用语。
- source_word: נֶשֶׁךְ
  choice: 利息
  rationale: 此词指贷款利息；不用“高利贷”，以免把禁令限缩为只禁止过高利率。
theological_decisions:
- issue: 判例式律法中 אִם 的法律语力
  choice: 如果你借钱
  alternative: 当你借钱时
  rationale: “如果”保留原文明确的条件形式，同时现代汉语读者仍能理解其作为具体案例法规的功能。
- issue: 对穷人的性别表达
  choice: 穷人
  alternative: 贫穷的男人
  rationale: 原文语法上为阳性单数，但汉语“穷人”能够自然指称该个体，不必添加生理性别，也不削弱单数案例的指向。
- issue: כְּנֹשֶׁה 的禁令范围
  choice: 不可像债主那样向他逼债
  alternative: 不可作他的债主
  rationale: 原文使用比较结构“像债主”，并可能突出债权人的催逼行为；所选译法既保留比较，也避免把经文误解为绝对禁止一切债权关系。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“借钱给”“逼债”“收取利息”自然清楚；用“子民”保持神对盟约群体说话的语域。脚注标记已在正文出现。
