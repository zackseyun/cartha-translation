base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: zh_hans
  text: 如果一个男人引诱一个尚未许配的处女，并与她发生性关系，他必须付出聘礼[a]，娶她为妻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “聘礼”指男方或男方家庭为缔结婚姻而支付的婚姻礼金，并非女方带入婚姻的“嫁妆”。
    reason: lexical_clarification
lexical_decisions:
- source_word: יְפַתֶּה
  choice: 引诱
  rationale: פִּתָּה在此指以劝诱或诱惑使对方发生性关系；“引诱”保留其语义，又不擅自加入暴力或强迫。
- source_word: אִישׁ
  choice: 一个男人
  rationale: 原文为阳性单数，具体指一名男子。
- source_word: בְּתוּלָה
  choice: 处女
  rationale: 在这一婚姻法律语境中，בְּתוּלָה所表达的贞洁与婚姻身份具有法律关联，“处女”准确而简洁。
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: 尚未许配的
  rationale: 原文指尚未正式订立婚约；“许配”比现代一般意义的“订婚”更能体现古代婚约的正式性质。
- source_word: וְשָׁכַב עִמָּהּ
  choice: 与她同寝
  rationale: שכב עם是发生性关系的惯用表达；“同寝”庄重、含义清楚，也保留原文的委婉表达。
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: 必须付足聘礼
  rationale: 同源不定式绝对形与未完成式连用，强调付款义务；מהר指支付与婚姻有关的聘礼。“付足”自然表达这种强调，且“聘礼”不会像“嫁妆”那样误指女方带入婚姻的财物。
- source_word: לּוֹ לְאִשָּׁה
  choice: 娶她为妻
  rationale: 该短语表示使她归他为妻的婚姻结果；“娶她为妻”是自然、简洁的现代汉语表达。
theological_decisions:
- issue: פתה所描述的性行为性质
  choice: 译作“引诱”，不将其明确处理为暴力强奸
  alternative: 强暴／侵犯
  rationale: פתה的常见意义是诱劝、引诱；本节没有明说暴力。“引诱”既不把行为正当化，也不加入词义证据以外的强迫因素，从而保留本案与另一些明确涉及暴力的律例之间的区别。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。“尚未许配”体现古代正式婚约身份；“同寝”保留希伯来文的委婉说法；“付足聘礼”传达原文强调结构，并避免“嫁妆”的方向性误解。
