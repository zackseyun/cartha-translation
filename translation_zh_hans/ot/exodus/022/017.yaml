  text: You shall not let a sorceress live[a].
translation:
  language: zh_hans
  text: 不可让行巫术的女子活着。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可让女巫活着。”希伯来语名词为阴性单数，指施行巫术的女性。
    reason: 说明“女巫”这一可行的词汇替代，并交代原文明确的阴性单数形式。
lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: 行邪术的女人
  rationale: 该词是阴性单数，特指施行巫术或邪术的女性。译作“行邪术的女人”既保留原文明确的女性所指，也比单用可能带有民俗或童话色彩的“女巫”更直接、清楚。
- source_word: לֹא
  choice: 不可
  rationale: 标准否定词；在本条约律法中用“不可”自然表达明确禁令。
- source_word: תְחַיֶּה
  choice: 容……存活
  rationale: 这是 חיה 的 Piel 未完成式第二人称阳性单数，在此表示“使之活着、让其存活”。“不可容……存活”贴近原文措辞，不扩写为原文未明说的具体处刑方式。
theological_decisions:
- issue: 违法者的性别指向
  choice: 明确译为“行邪术的女人”
  alternative: 泛译为“行邪术的人”或“术士”
  rationale: 希伯来语名词明确为阴性单数；译文保留这一有标记的性别信息，不将其泛化。
- issue: 律法禁令的力度
  choice: 译作“不可容……存活”
  alternative: 解释性地译作“必须处死”
  rationale: 上下文中的法律效果涉及死亡，但原文措辞本身是“不可让其活着”。译文保留这一表达，不擅自补入具体执行机制。
translation_notes:
  register: 采用现代、庄重而易懂的律法语言。“不可”体现禁令语气；“行邪术的女人”清晰保留女性所指，并避免“女巫”可能引起的民俗或童话联想。
