base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: zh_hans
  text: 你们要归我作圣洁的人[a]。田野里被撕裂的肉[b]，你们不可吃；要把它丢给狗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“圣洁之人”，其中“人”所用的希伯来语名词是阳性复数形式；在本段对盟约群体的训令中，也可理解为对众人的称呼。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“田野里被野兽撕裂的肉”。原文只说“被撕裂”，没有明说是谁或什么将它撕裂。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: 圣的人
  rationale: 该结构直译为“圣洁之人”。现代汉语用“圣的人”既保留“人”的具体表达，也自然传达分别为圣的身份；不译作“圣民”，以免把原文的名词结构完全抽象为群体称谓。
- source_word: תִּהְיוּן לִי
  choice: 要作归我的
  rationale: לִי 表达“属于我、归于我”的关系。“作归我为圣的人”在现代汉语中自然地保留盟约归属与义务的双重意味。
- source_word: בָשָׂר
  choice: 肉
  rationale: בָשָׂר 在本条食物禁令中指动物的肉；“肉”比“肉体”更符合现代汉语语境，同时保持具体所指。
- source_word: בַּשָּׂדֶה
  choice: 田野里
  rationale: 直接保留 שָׂדֶה 的空间意义，也符合动物尸肉出现在野外的语境。
- source_word: טְרֵפָה
  choice: 被撕裂的
  rationale: 该词指被撕裂、尤其被野兽撕咬的东西。原文没有明说施事者，因此正文不补入“被野兽”，以保留原文的简约与含混。
- source_word: לֹא תֹאכֵלוּ
  choice: 你们不可吃
  rationale: 以现代汉语法律和训诫语体自然表达否定命令。
- source_word: לַכֶּלֶב
  choice: 给狗
  rationale: 原文“狗”为单数而具泛指作用；汉语单数形式“狗”同样可作类称，无须改成复数。
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: 要把它丢给
  rationale: “丢给”清楚、自然地表达 השליך 的投掷或丢弃动作；“它”明确回指前面的肉。
theological_decisions:
- issue: 盟约律法中的圣洁身份
  choice: 作归我为圣的人
  alternative: 作我的圣民；作圣洁的人归我
  rationale: “归我”保留 לִי 所表达的归属关系，“为圣”则保留 קֹדֶשׁ 的神学分量，使食物禁令明确建立在以色列归属于上帝、分别为圣的身份上。
- issue: אַנְשֵׁי 的性别与群体指向
  choice: 人
  alternative: 男子；百姓
  rationale: אַנְשֵׁי 是 אִישׁ 的复数附属形，形式上为阳性，也可在群体训令中指受命的众人。现代汉语“人”不会额外断定仅限男性，同时仍保留原文以“人”表达的具体形式；脚注说明其字面结构。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不可”维持律法语体而不显古奥；“丢给狗”保留原文直接、具体的处置命令。脚注标记与正文所解释的短语逐一对应。
