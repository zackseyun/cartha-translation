base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/021.yaml
  text: You shall not afflict any widow or orphan[a][b].
translation:
  language: zh_hans
  text: 不可苦待任何寡妇或孤儿[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “孤儿”或译“无父的孩子”。
    reason: lexical_alternative
  - marker: b
    text: “苦待”或译“欺压”或“虐待”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: 任何
  rationale: 在否定禁令中与单数名词连用，具有逐一涵盖的分配意义；“任何”符合现代汉语表达，并保留全面禁止的力度。
- source_word: אַלְמָנָה
  choice: 寡妇
  rationale: 该词的标准词义，准确、自然。
- source_word: יָתוֹם
  choice: 孤儿
  rationale: 该词指失去父母照顾者，在希伯来法律语境中常特别指丧父的孩子；正文用现代汉语更自然的“孤儿”，并以脚注保留“无父的孩子”这一可能含义。
- source_word: לֹא
  choice: 不可
  rationale: 用于禁令；“不可”简洁庄重，符合本节法律条文的语气。
- source_word: תְעַנּוּן
  choice: 苦待
  rationale: 源自动词 ענה 的 Piel 形式，此处指使人受苦或严酷对待。“苦待”既保留广度和严肃性，又比“欺压”更少限定于权势或经济压迫。
