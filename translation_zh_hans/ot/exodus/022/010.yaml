base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: zh_hans
  text: 双方之间应有一项奉耶和华之名所起的誓言[a]，表明那人没有伸手动用邻舍的财物[b]。物主应当接受这誓言[c]，那人就不必赔偿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“耶和华的誓言”；此处指奉耶和华之名、以他为见证所起的誓言。
    reason: lexical_alternative
  - marker: b
    text: “伸手动用”是希伯来语习语，这里指擅动、侵占或不当处置别人的财物。
    reason: cultural_note
  - marker: c
    text: “接受”直译为“收下”，意思是物主以这誓言为足够的凭据。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: 向耶和华所起的誓
  rationale: 该结构直译为“耶和华的誓言”，在法律语境中指以耶和华为见证的誓言。正文采用自然且庄重的汉语表达，脚注保留希伯来语结构及可能的理解。
- source_word: בֵּין שְׁנֵיהֶם
  choice: 两人之间
  rationale: 明确保留原文所指的双方及其法律关系。
- source_word: אִם לֹא
  choice: 表明……没有
  rationale: 这里引出誓言的内容，并非普通条件句；“表明”能自然传达宣誓所确认的事实。
- source_word: שָׁלַח יָדוֹ
  choice: 伸手动用
  rationale: 保留“伸手”这一希伯来语意象，同时以“动用”表达可能擅动、侵占受托财物的法律含义。
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: 邻舍的财物
  rationale: מְלָאכָה 在本段法律语境中指属于邻舍并交由他人照管的财物，而非抽象的“工作”。
- source_word: וְלָקַח בְּעָלָיו
  choice: 物主要接受这誓言
  rationale: 原文动词字面为“取、收下”；这里表示物主以该誓言为足够凭据。补出“这誓言”使隐含宾语在汉语中清楚。
- source_word: יְשַׁלֵּם
  choice: 赔偿
  rationale: 该动词在盟约法律中指为损失作出补偿；“赔偿”符合现代汉语法律语体。
theological_decisions:
- issue: “耶和华的誓言”所表达的关系
  choice: 正文译作“向耶和华所起的誓”
  alternative: 耶和华的誓言；凭耶和华所起的誓
  rationale: 希伯来语属格结构本身简略。正文表达其法律语境中的通常功能，但脚注保留直译和另一种自然理解，避免把形式上的歧义完全隐藏。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“两人之间”“物主”“赔偿”保持条文的简洁性；用“那人”延续原文未明说身份的第三人称，避免在本节中额外补入“看守人”等解释性称谓。
