  to: 双方之间应有一项奉耶和华之名所起的誓言[a]，表明那人没有伸手动用邻舍的财物[b]。物主应当接受这誓言[c]，那人就不必赔偿。
  rationale: 修订仅澄清“耶和华的誓言”在法律语境中的誓言形式，并使条文语气更符合现代汉语法律叙述；未增添看守人等原文此节未明说的身份，也保留了“伸手”的习语意象及物主接受誓言后不再要求赔偿的法律结果。
