  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: zh_hans
  text: 你若拿邻舍的外衣作抵押[a]，日落前必须归还给他。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拿……作抵押”指取走物品作为债务的担保。原文以同根词连用，带有强调取作担保这一行为的意味。
    reason: lexical_alternative
  - marker: b
    text: “日落前”原文直译为“直到太阳来到”；这是指日落的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出个案法中的条件情形；“若”简洁、自然，也保留原文的条件语气。
- source_word: חָבֹל תַּחְבֹּל
  choice: 拿……作抵押
  rationale: 该结构由同根不定式绝对形与未完成式组成，突出取物作抵押这一法律行为。现代汉语不宜机械重复动词，故按其法律含义自然表达。
- source_word: שַׂלְמַת
  choice: 外衣
  rationale: 此词指披在外面的衣物，并可在夜间用于遮盖保暖；“外衣”比泛称“衣服”更准确，也比“斗篷”适用范围更宽。
- source_word: רֵעֶךָ
  choice: 邻舍
  rationale: 在社会与盟约法律语境中指与人共同生活的同胞或近人；“邻舍”保留经文伦理关系用语，同时为现代读者所能理解。
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: 日落以前
  rationale: 字面为“直到太阳来到”，在此是日落的惯用表达；“日落以前”自然传达归还的期限。
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: 必须归还给他
  rationale: 使役形 שוב 表示使某物返回，即归还；在法律命令中用“必须”清楚表达义务。
