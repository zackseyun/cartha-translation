  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: zh_hans
  text: 如果她父亲坚决不肯把她给他[a]，他就要按处女的聘礼数额称出银子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把她给他”；在这里的婚姻法律语境中，指父亲同意把她嫁给他。
    reason: lexical_alternative
  - marker: b
    text: 原文是“称出银子”，反映当时以称量银子的重量来付款，而不是使用铸币。
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 以现代汉语常用的条件连词引出这一案例法的条件。
- source_word: מָאֵן יְמָאֵן
  choice: 坚决不肯
  rationale: 原文以同源不定式加强限定动词，表示明确而强烈的拒绝；“坚决不肯”自然保留这一强调。
- source_word: אָבִיהָ
  choice: 她父亲
  rationale: 准确表达名词及第三人称阴性单数后缀。
- source_word: לְתִתָּהּ לוֹ
  choice: 把她给他
  rationale: 保留希伯来文“把她给他”的简洁措辞，同时用脚注说明在本法律婚姻语境中指同意将她嫁给他。
- source_word: כֶּסֶף
  choice: 银子
  rationale: 原文具体指银，而非抽象的“钱”；“银子”也符合古代支付语境。
- source_word: יִשְׁקֹל
  choice: 称出
  rationale: 该动词本义为“称量”，反映以重量计量银子的支付方式，中文“称出银子”既准确又可理解。
- source_word: כְּמֹהַר
  choice: 照……的聘礼
  rationale: מֹהַר 指婚姻中通常交付给女方家庭的聘礼；“照”表达 כְּ 所指的标准或数额。
- source_word: הַבְּתוּלֹת
  choice: 处女
  rationale: 带定冠词的复数在此泛指这一类别；“处女的聘礼”表达为处女通常所定的聘礼标准。
