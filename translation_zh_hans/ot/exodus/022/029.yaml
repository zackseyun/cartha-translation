base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: zh_hans
  text: 你的牛和羊群也要这样做：它要与母畜在一起七天；第八天，你要把它献给我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节承接上一节关于头生者的命令；希伯来文本节没有再次出现“头生的”。
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן תַּעֲשֶׂה
  choice: 也要照样办理
  rationale: 承接上一节有关头生者的命令；“照样办理”自然表达比较和法令语气。
- source_word: לְשֹׁרְךָ לְצֹאנֶךָ
  choice: 你的牛和羊群
  rationale: לְ在此表示命令所涉及的对象；שׁוֹר泛指牛类，צֹאן是绵羊和山羊等小型牲畜的集合称谓。
- source_word: שִׁבְעַת יָמִים יִהְיֶה עִם אִמּוֹ
  choice: 它要同母畜在一起七天
  rationale: 贴近希伯来文“它要与其母在一起”，同时以自然汉语表达持续七天的时段；“母畜”明确这里指动物。
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: 第八天
  rationale: 准确、自然地表达该时间短语。
- source_word: תִּתְּנוֹ לִי
  choice: 你要把它献给我
  rationale: נתן的基本义是“给”；在把头生牲畜交给上帝的祭献语境中，“献给”比单纯“给”更自然，同时不进一步规定献祭方式。
theological_decisions:
- issue: 本节命令所指是否应明说“头生的”
  choice: 正文不补入“头生的”，用脚注说明其由上文承接
  alternative: 在正文中译作“头生的牛和羊”
  rationale: 希伯来文本节没有重复“头生的”，但语境显然承接上一节。正文保留原文的省略，避免把上下文信息直接增补进经文。
- issue: תִּתְּנוֹ לִי的祭献含义
  choice: 译作“献给我”
  alternative: 译作“给我”
  rationale: 语境是将头生牲畜归给上帝，“献给”准确传达关系和用途；但不扩写为某一种具体祭礼，以免超出本节措辞。
translation_notes:
  register: 采用现代、庄重而易懂的法律指令语体。“母畜”避免“母亲”用于牲畜时可能产生的拟人感；“羊群”保留צֹאן涵盖绵羊和山羊的集合意义。所有脚注标记均置于正文相关位置。
