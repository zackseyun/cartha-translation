base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: zh_hans
  text: 我的怒气必燃烧起来，我要用刀剑[a]杀死你们；你们的妻子将成为寡妇，你们的儿子将失去父亲[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“死在刀剑之下”。
    reason: 介词 בְּ 可表达工具或手段；两种汉语说法分别突出施行杀戮的工具和死亡的方式。
  - marker: b
    text: 也可译作“成为孤儿”；这里的希伯来语特别可指失去父亲的人。
    reason: יָתוֹם 可泛指孤儿，但本节语境具体描述父亲被杀，因此正文采用更明确的表达。
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: 我的怒气必燃烧起来
  rationale: 这是希伯来语表达怒气炽烈发作的惯用语；译文保留“燃烧”的比喻，同时避免把 אַף 按字面误译为“鼻子”。“必”体现此处审判后果的确定性。
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: 我要……杀死你们
  rationale: הרג 是普通的“杀死”，而 אֶתְכֶם 是第二人称阳性复数宾语；此译法直接、清楚，并保留复数所指。
- source_word: בֶּחָרֶב
  choice: 用刀剑
  rationale: 介词 בְּ 在这里表示工具或手段，חֶרֶב 指刀剑；“用刀剑”既自然，也保留暴力审判的具体形象。
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: 你们的妻子将成为寡妇
  rationale: 在家庭关系语境中 נָשִׁים 指“妻子”；היה 表明审判造成的新状态，因此译为“将成为”。
- source_word: וּבְנֵיכֶם יְתֹמִים
  choice: 你们的儿子将失去父亲
  rationale: בנים 明确为“儿子”；יָתוֹם 在古代法律与社会关怀语境中常指丧父、因而失去家庭保护者的人。“失去父亲”准确表达此处由父辈被杀所造成的境况。
theological_decisions:
- issue: 对上帝怒气的拟人化惯用语
  choice: 我的怒气必燃烧起来
  alternative: 我的鼻子必发热；我的烈怒必被点燃
  rationale: 原文以 אַף（字面为“鼻子”）与 חרה 搭配表达怒气发作。直译身体部位会妨碍现代读者理解；现译保留“燃烧”的意象，也不削弱神施行审判的力度。
- issue: בנים 的性别特指
  choice: 儿子
  alternative: 孩子
  rationale: 原文使用阳性复数名词，语境也没有要求将其泛化为不分性别的“孩子”，因此保留“儿子”。
- issue: יְתֹמִים 所指的家庭缺失
  choice: 失去父亲
  alternative: 成为孤儿
  rationale: 本节明确说男人被杀、妻子成为寡妇，所以相应的儿子是丧父。译作“失去父亲”保留这一具体因果关系；脚注同时说明较概括的传统译法。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“杀死”避免古雅的“击杀、杀戮”，“妻子、寡妇、儿子”保留家庭关系与法律语境。“怒气必燃烧起来”保留原文比喻和审判语气；分号清楚呈现行动及其家庭后果。
