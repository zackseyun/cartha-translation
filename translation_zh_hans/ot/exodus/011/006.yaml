  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: zh_hans
  text: 埃及全境必响起极大的哀号[a]；这样的大哀号从未有过，以后也绝不会再有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“呼喊”或“哀哭”。希伯来语 צְעָקָה 可指人在苦难中发出的高声呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必响起
  rationale: 连词加完成式在这里用于预告将来的事件；结合“哀号”，译作“必响起”既自然，也保留确定的预告语气。
- source_word: צְעָקָה
  choice: 哀号
  rationale: 该名词指人在苦难中发出的高声呼喊；上下文是死亡带来的悲痛，“哀号”在现代汉语中准确而自然，同时脚注保留较宽的词义。
- source_word: גְדֹלָה
  choice: 极大的
  rationale: 直译其程度与规模，避免只解释为音量上的“响亮”。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 埃及全境
  rationale: 简洁表达该短语所强调的全面地域范围。
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: 这样的事从来没有发生过
  rationale: 这里的“成为/存在”在事件语境中自然表示“发生”；“这样的事”保留比较结构所指的这场哀号。
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: 以后也绝不会再发生
  rationale: 否定式与“再、增添”构成不再发生的惯用表达；“绝不会”传达其绝对比较意味。
