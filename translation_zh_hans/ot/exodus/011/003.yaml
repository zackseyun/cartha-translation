  rationale: 修订保留神名、两处“百姓”的未限定指称，以及原文对摩西的强调表达；以“极其显赫”避免把“极大”限缩为“威望”，并恢复“在……眼中”的视角关系。脚注锚点按对应词语重新安置，且保留末句“百姓”所指的文本含混。
