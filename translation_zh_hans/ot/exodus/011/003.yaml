language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: zh_hans
  text: 耶和华使百姓在埃及人眼中蒙恩[a]。而且，摩西这人在埃及地极其显赫，在法老的臣仆和百姓眼中都是如此[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在埃及人眼中得恩宠。”这里指得到埃及人的好感或善意。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“摩西这人在埃及地极其尊大”。“极其显赫”保留其较宽泛的含义，可指显赫、重要或受人敬重。
    reason: lexical_alternative
  - marker: c
    text: 这里的“百姓”很可能指埃及更广泛的民众，与法老的臣仆相对；原文并未明确说“埃及百姓”。“臣仆”也可译作“官员”，字面意思是“仆人”。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，明确保留专名性质，而不以“主”这一称号替代。
- source_word: וַיִּתֵּן ... חֵן
  choice: 使……蒙恩
  rationale: 此处表示耶和华使百姓得到埃及人的好感与善意；“使……蒙恩”既贴近“赐下恩 favor”的结构，也符合庄重自然的现代汉语。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文只说“百姓”，语境中指以色列百姓；正文不增补“以色列人”，以保留原文表达。
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: 在埃及人眼中
  rationale: 保留希伯来语“在……眼中”的视角习语，在中文中自然且清楚。
- source_word: גַּם
  choice: 而且
  rationale: 表达附加并略带强调的衔接功能，引出有关摩西地位的进一步说明。
- source_word: הָאִישׁ מֹשֶׁה
  choice: 摩西这人
  rationale: 保留原文在摩西名字前明确出现的“这人/那人”式强调，同时符合现代中文语序。
- source_word: גָּדוֹל מְאֹד
  choice: 极有威望
  rationale: 在此社会与政治语境中，גָּדוֹל表示显赫、重要、受尊崇；“极有威望”自然传达其广义地位，但脚注保留较形式对应的可能译法。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留原文完整的地域表达“在埃及地”，而不简化为“在埃及”。
- source_word: עַבְדֵי פַרְעֹה
  choice: 法老的臣仆
  rationale: עֲבָדִים字面为“仆人”，在王室语境中也包括官员；“臣仆”兼顾字面服属关系与宫廷身份。
- source_word: וּבְעֵינֵי הָעָם
  choice: 百姓都很看重他
  rationale: 将重复的“在……眼中”自然转换为中文谓语；“百姓”保持原文未明确限定其族群的措辞。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: “耶和华”是现代中文基督教语境中广为人知的专名形式，保留神名而非用称号替换；不借此裁定其历史发音。
- issue: “百姓”在末句所指的群体
  choice: 正文保留“百姓”
  alternative: 埃及百姓；一般民众
  rationale: 它很可能与“法老的臣仆”形成对照，指埃及更广泛的民众，但原文没有明说“埃及人”或“平民”，因此不在正文中消除这一含混。
- issue: 摩西“极大”的含义
  choice: 极有威望
  alternative: 极其尊大；非常显赫
  rationale: 上下文以法老臣仆和百姓对摩西的看法为焦点，故译为社会声望；同时以脚注说明原文较宽泛，避免将其本质或宗教地位过度具体化。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“蒙恩”“埃及地”“臣仆”保留经文语体，但整体仍便于普通读者理解。末句适度调整希伯来语重复结构，使中文自然，同时用脚注保存原文的词义范围与指称含混。
