base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: zh_hans
  text: 耶和华对摩西说[a]：“法老不会听你们的话[b]，为要使我的奇事[c]在埃及地增多。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些译本为配合前文的叙事次序，译作“耶和华先前曾对摩西说”；但这里的希伯来语动词形式本身是通常的叙事过去时。
    reason: alternative_reading
  - marker: b
    text: 或译“不会听见你们”或“不会理会你们”。
    reason: lexical_alternative
  - marker: c
    text: 或译“我的神迹”或“我的预兆”。这个希伯来词可指奇事、记号或预兆。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的专名译法，保留以色列之上帝的名字，而不以“主”这一称号替代。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: wayyiqtol 是希伯来叙事中通常推进情节的过去时形式；直译为“说”最贴近其常规功能，不因上下文而擅自改成过去完成意义。
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: 不会听从你们
  rationale: שׁמע 与 אֶל 连用可表示听、听从或理会。“听从”自然表达法老拒绝理会的语境，同时保留“听”的基本意象；“你们”准确反映复数后缀，指摩西和亚伦。
- source_word: לְמַעַן
  choice: 为要
  rationale: 明确保留该连词通常具有的目的意味，又符合庄重而自然的现代中文表达。
- source_word: רְבוֹת
  choice: 增多
  rationale: 该不定式表达数量增加；“增多”在中文中简洁自然，也避免生硬的被动结构。
- source_word: מוֹפְתַי
  choice: 我的奇事
  rationale: מוֹפֵת 可指奇事、神迹或预兆；“奇事”突出其超常、令人惊异的一面，同时不把词义收窄为单纯的验证性“记号”。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 在埃及地
  rationale: 保留 אֶרֶץ（地）这一成分，且“埃及地”在现代中文圣经叙事中清楚自然。
theological_decisions:
- issue: 法老拒绝听从与上帝目的之间的关系
  choice: 以“为要”表达法老不听从与上帝使奇事增多之目的之间的联系。
  alternative: 可弱化为结果意义：“因此我的奇事会在埃及地增多。”
  rationale: לְמַעַן 在此最自然地表达目的。译文同时保留法老的拒绝和上帝的目的，不进一步解释法老刚硬的机制，也不消解经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“你们”保留原文复数，清楚指向摩西和亚伦；“为要”保留目的关系；脚注分别置于其实际所说明的词句之后。
