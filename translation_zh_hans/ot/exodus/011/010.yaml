  text: וּ/מֹשֶׁ֣ה וְ/אַהֲרֹ֗ן עָשׂ֛וּ אֶת כָּל הַ/מֹּפְתִ֥ים הָ/אֵ֖לֶּה לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹֽא שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: zh_hans
  text: 摩西和亚伦在法老面前行了这一切神迹[a]。雅威使法老的心刚硬[b]，法老没有让以色列的子孙[c]离开他的国土。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这一切奇事”。原词可指作为标志的神奇作为，也可强调其令人惊异之处。
    reason: lexical_alternative
  - marker: b
    text: 也可译“使法老的心坚定”或“使法老的心强硬”。原词的基本意象是使之强固。
    reason: lexical_alternative
  - marker: c
    text: “以色列的子孙”原文直译为“以色列的儿子们”，在这里统指以色列人。
    reason: literal_rendering
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: 摩西和亚伦
  rationale: 采用现代汉语中通行的人名译法。
- source_word: עָשׂוּ
  choice: 行了
  rationale: עָשָׂה本义宽泛，可表示“做、行”；与“神迹”搭配时，“行了”自然庄重，又不过度增添“施行、表演”等含义。
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: 这一切神迹
  rationale: מוֹפֵת可指具有超自然性质、彰显能力的“神迹”或“奇事”。“神迹”在本段语境中兼顾其奇异性与标志作用，脚注保留另一译法。
- source_word: לִפְנֵי פַרְעֹה
  choice: 在法老面前
  rationale: 直接表达这些行动是在法老面前、当着法老施行的。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号代替。
- source_word: וַיְחַזֵּק ... אֶת לֵב פַּרְעֹה
  choice: 使法老的心刚硬
  rationale: חזק的基本意象是使之强固、坚定；在法老拒绝放走以色列人的反复叙事公式中，“使……心刚硬”准确传达其顽梗抗拒的语境含义，同时在脚注保留较贴近词形的译法。
- source_word: וְלֹא שִׁלַּח
  choice: 法老不肯让……离开
  rationale: 原文动词可指“送走、放走”。汉语补出承前省略的主语“法老”，避免误读为雅威没有放人；“不肯让……离开”符合出埃及叙事语境。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留原文“以色列之子”的亲属称谓色彩，同时“子孙”在现代汉语中可自然地统指以色列民族，不误限于成年男性。
- source_word: מֵאַרְצוֹ
  choice: 离开他的国土
  rationale: אֶרֶץ在此指法老所统治的土地；“国土”比单说“地”更清楚地表达政治地域含义，“他的”保留原文代词。
theological_decisions:
- issue: 雅威使法老的心刚硬
  choice: 使法老的心刚硬
  alternative: 使法老的心坚定／使法老的心强硬
  rationale: 不弱化或回避原文把这一行动归于雅威的表述，也不额外解释法老责任与神主权的关系。正文采用叙事语境中自然的“刚硬”，脚注说明חזק所保留的“使强固、坚定”意象。
- issue: 四字神名的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文使用专名יהוה；正文以音译呈现其专名性质，避免用称号取代。
- issue: “以色列之子”的群体所指
  choice: 以色列的子孙
  alternative: 以色列人／以色列的儿子们
  rationale: 原文形式为阳性复数亲属称谓，但在语境中整体指以色列民族。“子孙”既保存血缘与群体色彩，又不把所指误限为男性。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。用两个句号呈现希伯来叙事链条中的两个主要动作，同时不改变连续叙事关系；第二句重复“法老”以消除汉语零主语可能造成的歧义。所有脚注标记均紧随对应词语或分句。
