  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: zh_hans
  text: 摩西说：“雅威这样说：‘大约在半夜[a]，我要在埃及境内出行。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在半夜”。希伯来文在“半夜”前的前缀可表示约数，因此译作“大约在半夜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事前后关系在中文语境中已经清楚，无须机械加入“然后”；用“说”自然承接上文。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 保留先知性使者宣告公式的结构，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文读者熟悉的专名音译来呈现四字神名，而不以“主”这一称号替代。
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: 大约半夜
  rationale: 前缀כְּ在此可表达约数；“大约半夜”保留时间并非严格精确到一点的语义。
- source_word: אֲנִי
  choice: 我
  rationale: 保留原文显式第一人称代词及其强调作用。
- source_word: יוֹצֵא
  choice: 要出去
  rationale: 分词在此宣告即将发生的行动；“要出去”自然表达临近的将来。
- source_word: בְּתוֹךְ
  choice: 进入……境内
  rationale: 结合运动动词表达进入埃及内部；“境内”比直译“中间”更符合现代汉语，同时保留空间范围。
- source_word: מִצְרָיִם
  choice: 埃及
  rationale: 采用现代中文通行地名。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名，故不以称号“主”替代；“耶和华”是现代中文普通读者最熟悉的专名形式。
- issue: כַּחֲצֹת הַלַּיְלָה 的时间语气
  choice: 大约半夜
  alternative: 半夜
  rationale: 保留前缀כְּ可能具有的约数含义，不把原文表述强化为绝对精确的时点。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留直接引语中的嵌套宣告，以清楚区分摩西的叙述引语与耶和华的话；不添加原文没有的解释。
