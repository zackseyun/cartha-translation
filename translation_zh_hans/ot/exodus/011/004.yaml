revisions:
- from: 摩西说：“耶和华这样说：‘大约半夜，我要出去，进入埃及境内。’”
  to: 摩西说：“雅威这样说：‘大约在半夜[a]，我要在埃及境内出行。’”
  rationale: 修订使中文神名与 POB 对 יהוה 的 Yahweh 译法一致；将空间表达改为“在埃及境内”，避免把原文的内部位置关系过度解释为“进入”；并补回时间表达的替代译法脚注。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:25:52Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿准确保留了叙事推进、摩西、神名、约数性的“半夜”、第一人称和将来行动。不过，“出去，进入埃及境内”把原文的 בְּתוֹךְ מִצְרָיִם（在埃及中间／境内）处理成明确的“进入”方向，且“出去”与“进入”在汉语中衔接略显别扭。改为“在埃及境内出行”较自然地保留行动发生在埃及内部这一点，避免无根据地强化进入方向。英语审计轨迹的脚注所保留的“约在／在”时间替代也应在中文中保留。
  naturalness: “摩西说：‘雅威这样说……’”和“大约在半夜”均属自然、庄重的现代标准汉语。“在埃及境内出行”比“出去，进入埃及境内”更连贯，也不把空间关系拆成两个不协调的动作。
  terminology: 神名原文为 יהוה，英语 POB 审计明确采用 Yahweh 而非 Jehovah 或称号替代。中文以“雅威”对应 Yahweh，可维持该专名译法的一致性；“耶和华”虽是通行传统形式，却通常对应 Jehovah，未能反映本项目已明确的 Yahweh 决定。
  issues:
  - severity: medium
    issue: 神名译为“耶和华”而非“雅威”
    rationale: 英语 POB 的既定神名决定是 Yahweh；为保持专名而非称号的译法并与该审计轨迹一致，中文宜译“雅威”。
  - severity: medium
    issue: “进入埃及境内”强化了原文未明说的进入方向
    rationale: בְּתוֹךְ 表明行动在埃及中间／境内；与“出去”组合时，原文重点是神在埃及内部的行动。译作“进入”会把空间关系限定为朝内进入，且汉语搭配不够顺畅。
  - severity: low
    issue: 未保留英语审计轨迹中的时间替代脚注锚点
    rationale: כַּחֲצֹת 可作约数，主译“大约在半夜”恰当；保留“也可译作：‘在半夜’”的脚注可透明呈现该语法歧义。
  revised_text: 摩西说：“雅威这样说：‘大约在半夜[a]，我要在埃及境内出行。’”
  revised_footnotes:
  - marker: a
    text: 或译“在半夜”。希伯来文在“半夜”前的前缀可表示约数，因此译作“大约在半夜”。
    reason: lexical_alternative
