source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the slave woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: zh_hans
  text: 埃及地一切头生的都必死，从坐在王位上的法老的长子，直到在磨盘后的女奴[a]的长子，以及牲畜中一切头生的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女奴”也可译作“婢女”。希伯来语指处于奴役身份的女性；“在磨盘后”描绘她从事地位低下的磨粮劳动。
    reason: 说明社会身份词的译法及“在磨盘后”的文化意象。
lexical_decisions:
- source_word: וּמֵת
  choice: 都必死
  rationale: 此处完成式出现在对将临灾祸的宣告中，表达确定将发生的事；“必死”自然地传达其将来指向和确定性。
- source_word: כָּל בְּכוֹר
  choice: 所有头生的
  rationale: כָּל 与单数 בְּכוֹר 连用，具有逐一涵盖的分配意义。“头生的”不擅自补入“儿子”，也能同时适用于人和牲畜。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: 埃及地
  rationale: 保留原文的地域表达，同时符合现代中文圣经语体。
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: 从……直到……
  rationale: 准确呈现原文由最高社会阶层至最低社会阶层的范围结构。
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: 坐在王位上的法老
  rationale: 将分词短语理解为修饰法老，体现他的君王身份和在位状态。
- source_word: הַשִּׁפְחָה
  choice: 女奴
  rationale: 该词指处于奴役身份的女性；“女奴”简明、现代，并保留她与法老之间鲜明的社会地位对比。
- source_word: אַחַר הָרֵחָיִם
  choice: 在磨盘后劳作
  rationale: “在磨盘后”保留原文的具体空间意象；补出“劳作”使现代读者清楚这是指从事磨粮工作，而不是单纯站在磨盘后面。
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: 以及牲畜中一切头生的
  rationale: בְּהֵמָה 泛指家养牲畜，不仅是牛；此译也保留 בְּכוֹר 与前文相同的“头生”概念。
theological_decisions:
- issue: שִׁפְחָה 所表达的社会身份
  choice: 女奴
  alternative: 婢女／女仆
  rationale: 原文强调灾祸从王室延及受奴役、从事低贱磨粮劳动的女性。“女奴”没有淡化其受奴役的身份，也不引入特定宗派解释。
- issue: בְּכוֹר 是否明确译作男性长子
  choice: 在人与牲畜的总述中译作“头生的”，具体所属关系中依中文习惯译作“长子”
  alternative: 全都译作“长子”或“头生的儿子”
  rationale: 原文名词本身在本节总述中没有另加“儿子”；保留“头生的”避免过度限定，并使人和牲畜的用语保持连贯。法老和女奴的所属结构中，“长子”则是自然且符合语境的中文表达。
translation_notes:
  register: 采用庄重而现代的标准普通话。“必死”保留宣告的确定语气；“从……直到……”呈现由最高王权到最低奴役劳动者的强烈对比。脚注标记置于其实际所解释的“女奴”之后。
