base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: zh_hans
  text: 你这些臣仆[a]都必下来到我这里，向我下拜，说：‘你和所有跟随你的百姓[b]都出去吧！’此后我就出去。”他便在盛怒中离开了法老。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “臣仆”也可译作“臣属”或“官员”；原文所用的词可指仆人，也可指王宫中的臣僚。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在你脚下的”，在这里指跟随摩西、与他同行的人。
    reason: idiom_explanation
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: 都必下来见我
  rationale: 保留“下来”的方向意象，并用“见我”自然表达动作以摩西为终点。
- source_word: עֲבָדֶיךָ
  choice: 你这些臣仆
  rationale: 在法老宫廷的语境中，该词指服侍法老的臣属；“臣仆”既保留“仆役”含义，也体现宫廷身份，而不把范围限定为现代意义的官员。
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: 向我下拜
  rationale: 表达俯身下拜的实际举动，符合臣服、恳求的宫廷场景，同时避免误解为敬拜。
- source_word: צֵא אַתָּה
  choice: 你……都出去吧
  rationale: “出去”保留 יצא 的基本意义及出埃及叙事中的关键词呼应；“你”体现原文独立代词的强调。
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: 所有跟随你的百姓
  rationale: 原文直译为“在你脚下的所有百姓”，这里是指跟随摩西、与他同行的人；正文按现代汉语习惯传达其惯用含义，脚注保留字面意象。
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: 然后我才出去
  rationale: “才”准确体现摩西要等法老臣仆前来请求之后才离开的先后关系，并继续以“出去”对应 יצא。
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: 他便……离开了法老
  rationale: 保留原文没有直接重复摩西名字的叙述方式；“离开法老”比直译“从法老那里出去”更符合现代汉语。
- source_word: בָּחֳרִי אָף
  choice: 怀着烈怒
  rationale: 该短语以热烈、燃烧的意象形容怒气；“烈怒”简洁地保留其强度和庄重语体。
