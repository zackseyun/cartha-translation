base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“我还要把一场灾祸[a]降在法老和埃及身上。此后，他会让你们离开这里；他让你们走的时候，必把你们彻底赶出这里[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“打击”“击打”或“苦难”。
    reason: lexical_alternative
  - marker: b
    text: “彻底赶出”反映希伯来文的强调说法：有“完全地”以及“赶出”一词的重复，直译可作“他必完全地赶你们出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的专名，直接反映四字神名，而不以称号代替。
- source_word: וַיֹּאמֶר
  choice: 对……说
  rationale: 叙事中的连续式推进情节；汉语无需机械补出“然后”，上下文已自然表达承接。
- source_word: עוֹד נֶגַע אֶחָד
  choice: 还要把一场灾祸
  rationale: “还要”表达附加的一次；נֶגַע在出埃及记的审判语境中指灾祸，但其词义范围也包括打击、击伤和苦难。
- source_word: אָבִיא עַל
  choice: 降在……身上
  rationale: 希伯来语使役形表达“使之临到”；“降在……身上”自然保留审判临到的意象。
- source_word: עַל פַּרְעֹה וְעַל מִצְרַיִם
  choice: 在法老和埃及身上
  rationale: 同时保留法老与埃及两个受灾对象；汉语不必重复介词也能清楚表达并列关系。
- source_word: אַחֲרֵי כֵן
  choice: 此后
  rationale: 简洁、庄重地表达时间上的先后次序。
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: 他会让你们离开这里
  rationale: שׁלח可表示差遣、放走或送离；此处译为“让你们离开”符合摩西要求法老放百姓走的语境，同时把更强烈的驱逐意味留给后句。
- source_word: כְּשַׁלְּחוֹ
  choice: 他让你们走的时候
  rationale: 前缀כ在此具有时间意义，译作“……的时候”自然连接前后两个分句。
- source_word: כָּלָה
  choice: 彻底
  rationale: 此词在这里作加强和总体性修饰，表达完全、全然的驱逐。
- source_word: גָּרֵשׁ יְגָרֵשׁ
  choice: 必把你们……赶出
  rationale: 不定式绝对形与同根限定动词连用，强烈强调驱逐行动；“必……赶出”在现代汉语中兼顾力度与自然表达。
- source_word: מִזֶּה
  choice: 从这里
  rationale: 直接保留指向当前所在之地、即埃及的指示意义。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用的是上帝的专名而非“主”这一称号；“雅威”是较直接反映通行学术复原读音的现代汉语音译。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。前句用“让你们离开”表达获准离去，后句用“彻底赶出”呈现原文由放行转为强制驱逐的语义升级；分号凸显两句之间的解释和加强关系。
