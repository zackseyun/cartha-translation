source:
  edition: WLC
  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: zh_hans
  text: 但在以色列人那里，无论是人还是牲畜，连一只狗也不会向他们吠一声[a]，好让你们知道，雅威区别埃及和以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“没有一只狗会动（或磨利）舌头”；这是表示以色列人完全不受敌意或惊扰的形象说法，也可理解为“没有一只狗会向他们狂吠（或低吼）”。
    reason: 保留希伯来语“动／磨利舌头”的形象及其习语性，同时说明正文“向他们吠一声”所表达的语境含义。
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: 但在以色列人那里
  rationale: וּ承接上文并形成转折；לְ在这里标明狗不会敌对或惊扰的对象。“以色列人”自然地表达 בְּנֵי יִשְׂרָאֵל，同时避免现代汉语中“以色列的儿子们”可能造成的误解。
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: 连一只狗也不会吠叫[a]
  rationale: 这是描写狗动舌发声的希伯来语表达，在本语境中表示以色列那里全然安宁、不受惊扰。正文采用现代汉语清楚自然的“吠叫”，脚注保留原文较形象且可能有歧义的字面表达。
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: 无论人还是牲畜
  rationale: 该短语以“从人到牲畜”的两端概括全部范围；“无论……还是……”在现代汉语中自然地保留这种总括作用。
- source_word: לְמַעַן תֵּדְעוּן
  choice: 好让你们知道
  rationale: 表达目的，并保留第二人称复数；“好让”符合现代汉语，又不把未完成式过度限定为单纯将来。
- source_word: יַפְלֶה
  choice: 分别开来
  rationale: 此处使役形表示耶和华在埃及与以色列之间作出区分、将二者区别对待；“分别开来”清楚而不额外说明这种区分的神学机制。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: 把埃及和以色列分别开来
  rationale: 依原文保留两个国家／群体名称之间的对照，不擅自改成“埃及人”和“以色列人”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；正文采用较贴近现代学界重建读音的“雅威”，而不以“主”等称号代替。
- issue: 埃及与以色列之间的区别
  choice: 分别开来
  alternative: 区别对待
  rationale: 原文 יַפְלֶה 强调雅威使两者有别；“分别开来”保留这一行动的广度，不在本节中进一步界定其具体方式或神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文优先传达希伯来语习语在语境中的意义，同时用脚注保留其字面意象与词义歧义；“人还是牲畜”保持原文的总括结构。
