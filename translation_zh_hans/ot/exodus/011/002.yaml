base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: zh_hans
  text: 你现在要对百姓说：让每个男人向自己的邻舍、每个女人向自己的女邻舍请求[a]银器和金器。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“借”。希伯来语这个动词的意思是“请求”或“求取”，本身没有说明这些物品需要归还。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר
  choice: 说
  rationale: 该词是דבר的Piel命令式，表示直接吩咐摩西向百姓讲话；“说”简洁自然，并保留口头传达的含义。
- source_word: נָא
  choice: 现在
  rationale: נָא可表达请求或催促；在此处的神圣命令中译作“现在”，能自然体现即时性，又不必将语气处理成过度客气的“请”。
- source_word: בְּאָזְנֵי הָעָם
  choice: 对百姓说
  rationale: 希伯来语直译为“在百姓耳中”，是指让百姓亲耳听到。现代汉语用“对百姓说”自然表达这一听觉性言语行为，避免生硬直译。
- source_word: וְיִשְׁאֲלוּ
  choice: 让……索要
  rationale: 未完成式在命令式之后具有指令或祈使意味。“让……索要”保留其命令力度；“索要”表达向人请求取得物品，但本身不表示日后归还。
- source_word: אִישׁ
  choice: 男人各自
  rationale: 阳性单数在此具有逐一分配的作用，并与下句的“女人”平行；“男人各自”同时保留性别和分配含义。
- source_word: מֵאֵת רֵעֵהוּ
  choice: 向他的邻舍
  rationale: רֵעַ可指邻舍、同伴或相邻社群中的人；“邻舍”语义宽泛，也与本节所描写的近邻关系相符。
- source_word: וְאִשָּׁה
  choice: 女人各自
  rationale: 阴性单数与前面的“男人”形成平行，并具有逐一分配的含义；译文用“各自”将这一点自然表达出来。
- source_word: מֵאֵת רְעוּתָהּ
  choice: 向她的邻舍
  rationale: 这是前一短语的阴性对应形式；“她的邻舍”保留女性所有格，但不在汉语中武断限定邻舍本人的性别。
- source_word: כְּלֵי כֶסֶף
  choice: 银器
  rationale: כְּלִי泛指器物、用具或物件。“银器”是简明自然的汉语统称，并未将其缩窄为首饰。
- source_word: וּכְלֵי זָהָב
  choice: 金器
  rationale: 与“银器”保持平行，概括由金制成的各类器物，不额外限定具体形制或用途。
theological_decisions:
- issue: 以色列人从埃及邻舍取得贵重物品时，שאל应译为“索要”还是“借”
  choice: 索要
  alternative: 借
  rationale: שאל本义是“问、请求、索取”，本身并不说明所得物品必须归还。正文采用“索要”，避免把归还义加入经文；传统译法“借”会影响对事件伦理性质的理解，因此列入脚注作为译法提示。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“男人各自……女人各自……”保留原文的性别平行和分配结构；“银器和金器”保持器物类别的宽泛性。脚注标记紧接“索要”，使其准确对应存在词义争议的动词。
