  naturalness: 原句以逗号串联多个成分，虽可理解，但“男人各自向他的邻舍，女人各自向她的邻舍，索要……”稍显滞涩。使用冒号、重复“每个”并将两个介词短语并列，较符合现代庄重汉语。
  terminology: “银器和金器”恰当地保留了כְּלֵי的器物泛称。“邻舍”适合经文的庄重语域。“请求”比“索要”更中性，且脚注可保留传统“借”的译法及其不含归还义的说明。
