  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: zh_hans
  text: 他制作院子：南边、朝南的一边，院子的帷幔[a]用捻的细麻布做成，长一百肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“院子的帘幕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又建造
  rationale: 该叙事性连续式表示接续的行动；“又建造”自然地承接上文，也保留עשה在此处“制作、建造”的基本含义。
- source_word: הֶחָצֵר
  choice: 院子
  rationale: 此词指会幕外围由帷幔围成的院落；“院子”是现代汉语中清楚、自然的表达。
- source_word: לִפְאַת
  choice: ……面
  rationale: 该词在方位结构中指某一侧；译作“面”简洁且符合建筑方位的汉语习惯。
- source_word: נֶגֶב תֵּימָנָה
  choice: 南面，就是朝南的一面
  rationale: 原文连续使用两个与“南”有关的表达；如此翻译保留其重复和方向强调，不将二者合并省略。
- source_word: קַלְעֵי הֶחָצֵר
  choice: 院子的帷幔
  rationale: קְלָעִים在会幕语境中指构成院子边界的悬挂织物；“帷幔”比泛称“布帘”更庄重、准确。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻成的细麻
  rationale: שֵׁשׁ指细麻织料，מָשְׁזָר说明线经过捻制；“捻成的细麻”兼顾材料与制作方式。
- source_word: מֵאָה בָּאַמָּה
  choice: 长一百肘
  rationale: 原文给出一百肘的尺寸；汉语补出“长”可明确这是帷幔的长度，又不增加实质信息。
