base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: zh_hans
  text: 一百他连得银子用来铸造圣所的座[a]和幔子[b]的座：一百个座对应一百他连得银子，每个座一他连得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “座”也可译作“卯座”，指会幕的金属基础构件。
    reason: lexical_alternative
  - marker: b
    text: “幔子”指隔开圣所与至圣所的内层帘幕。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: 用来
  rationale: 本节处于材料核算语境，动词说明这批银子的用途；译为“用来”比直译“成为”更符合现代汉语。
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: 那一百他连得银子
  rationale: 保留确切数量，并以“那”承接前文清单中已知的银子总额。“他连得”保留古代重量单位，避免换算造成虚假精确。
- source_word: לָצֶקֶת
  choice: 铸造
  rationale: 在金属加工语境中，יצק指把熔化的金属浇铸成器件；“铸造”准确而自然。
- source_word: אַדְנֵי
  choice: 座
  rationale: 指支撑会幕板和幔子柱子的金属基础构件；“座”简洁易懂，脚注补充“卯座”这一可能译法。
- source_word: הַקֹּדֶשׁ
  choice: 圣所
  rationale: 这里指神圣的会幕结构，而不是特指至圣所；“圣所”保留原词的礼仪性和一定范围弹性。
- source_word: הַפָּרֹכֶת
  choice: 幔子
  rationale: 指隔开圣所与至圣所的内层帘幕；“幔子”既区别于普通门帘，也符合庄重经文语体。
- source_word: לִמְאַת הַכִּכָּר
  choice: 用了一百他连得银子
  rationale: 介词结构表达一百个座与一百他连得银子之间的对应和用料关系；结合前句用途，以“用了”自然呈现。
- source_word: כִּכָּר לָאָדֶן
  choice: 每个座一他连得
  rationale: 准确表达逐件分配比例，保留原文简洁的核算语气。
