  text: All the hangings of the courtyard all around were of finely twisted linen[a].
translation:
  language: zh_hans
  text: 院子四周所有的帷幔，都是用捻成的细麻制成的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“院子四周所有的幔子，都是用捻成的细麻制成的。”
    reason: 词汇替代：קַלְעֵי可译作“帷幔”或“幔子”；מָשְׁזָר指麻线经过搓捻、合股的加工。
lexical_decisions:
- source_word: כָּל
  choice: 所有的
  rationale: 概括院子帷幔的全体；现代汉语中“所有的”自然地保留集合性的总括意义。
- source_word: קַלְעֵי
  choice: 帷幔
  rationale: 指构成会幕院子围障的织物；“帷幔”既体现悬挂的布幔，也适合庄重的礼仪建筑语境。
- source_word: הֶחָצֵר
  choice: 院子
  rationale: 在会幕语境中指外围有界限的院落；“院子”是现代汉语中清楚自然的表达。
- source_word: סָבִיב
  choice: 四周
  rationale: 表示环绕整个周边；“四周”简洁传达各面的环绕意义。
- source_word: שֵׁשׁ
  choice: 细麻
  rationale: 在会幕织物语境中指优质麻料；采用传统而通俗可懂的“细麻”。
- source_word: מָשְׁזָר
  choice: 捻的
  rationale: 描述麻线经过搓捻、合股的制作方式；与“细麻”组合为“捻的细麻”，不额外加入原文未明确表达的程度副词。
