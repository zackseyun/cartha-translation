base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: zh_hans
  text: 每人一个比加[a][b]，即按圣所的舍客勒标准计算的半舍客勒；凡二十岁及以上、经过登记而被列入人数的，总数为六十万三千五百五十人[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一个比加等于按圣所的舍客勒标准计算的半舍客勒。
    reason: cultural_note
  - marker: b
    text: “每人”原文直译为“每个头骨”，是希伯来语逐一计算人数的说法。
    reason: lexical_alternative
  - marker: c
    text: 或译：“凡经过被数者之列的。”原文使用人口登记的用语，并保留了“经过、列入登记”的意象。
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: 比加
  rationale: 这是特定的重量单位；采用音译，并由下文“半舍客勒”直接说明其价值。
- source_word: לַגֻּלְגֹּלֶת
  choice: 每人
  rationale: 字面为“每个头骨”，在点数人口的语境中是逐人计算的习语；译作“每人”自然清楚，字面形象保留在脚注中。
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: 半舍客勒
  rationale: 直接表达比加的重量或价值。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒计算
  rationale: בְּ在此说明衡量标准；此译法清楚表明采用圣所规定的舍客勒标准。
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: 凡经过登记、列入被数之人
  rationale: 既保留עֹבֵר“经过”的动态意象，又以“登记、列入”交代人口统计语境，不把原文仅简化为抽象的“被登记者”。
- source_word: הַפְּקֻדִים
  choice: 被数之人
  rationale: 保留该词在普查语境中的被动含义，同时使用现代读者易懂的表达。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: 从二十岁以上
  rationale: 对应希伯来文表示年龄下限的固定说法，并符合现代汉语人口统计表达。
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 共六十万三千五百五十人
  rationale: 准确呈现总人数；加“共”和量词“人”使汉语句意完整清晰。
