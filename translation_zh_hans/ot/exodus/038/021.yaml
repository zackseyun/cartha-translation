  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: zh_hans
  text: 以下是帐幕，就是见证的帐幕[b]的核算记录[a]；这项核算是照摩西的吩咐，由利未人办理，归祭司亚伦的儿子以他玛督管[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “核算记录”也可译作“清单”或“账目”；原文指正式的清点核算。
    reason: lexical_alternative
  - marker: b
    text: “见证”很可能指约的见证，尤其是放在约柜里的法版。
    reason: cultural_note
  - marker: c
    text: 原文直译为“在以他玛手中”，是表示经手、负责或监管的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: 核算记录
  rationale: 该名词在这里指对帐幕材料所作的正式清点和核算；“核算记录”既保留行政性，又能自然引出下文的具体账目。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中指以色列圣所结构的常用术语；“帐幕”是现代中文圣经语境中准确而通行的译法。
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: 见证帐幕
  rationale: 保留原文“见证”的措辞及其与前一“帐幕”的同位关系，不在正文中直接把所指限定为约版或其他具体物件。
- source_word: פֻּקַּד
  choice: 核算
  rationale: 此处与 פְקוּדֵי 相呼应，表示正式清点、查核账目，而非一般性的“记录”或“数点”。
- source_word: עַל פִּי מֹשֶׁה
  choice: 照摩西的吩咐
  rationale: עַל־פִּי 是表示依照某人口令或命令的习语；此译自然传达摩西所授命令的权威。
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: 由利未人办理
  rationale: עֲבֹדָה 在帐幕语境中指受委派的工作或服役；这里按句法功能译为利未人承担核算事务，避免使用带有后期教会色彩的“事工”。
- source_word: בְּיַד אִיתָמָר
  choice: 由以他玛督管
  rationale: בְּיַד 字面为“在……手中／借……的手”，此处表示以他玛对利未人所办事务的监管；“督管”简洁传达其监督责任。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 直接译出亚伦的职分；“祭司亚伦”在中文中自然明确。
theological_decisions:
- issue: “见证”（הָעֵדֻת）的具体所指
  choice: 正文保留“见证”，脚注说明很可能指约的见证，尤其是约柜中的法版
  alternative: 正文直接译为“法版帐幕”或“约版帐幕”
  rationale: 原文本身使用较宽的“见证”一词。保留这一称谓可避免把正文所指过早限定，同时脚注为普通读者提供出埃及记语境中的主要理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“核算记录／账目”体现本段行政清点的语境；“见证帐幕”保留原文正式称谓及其解释空间；第二句将希伯来语紧凑的名词结构展开为自然中文，同时保留摩西下令、利未人办理、以他玛监管三层关系。
