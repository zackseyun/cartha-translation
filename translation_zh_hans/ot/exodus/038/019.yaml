base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: zh_hans
  text: 柱子四根，铜底座四个[a]；柱上的钩子是银的，柱顶的包层[b]和箍带[c]也是银的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “底座”或译“座槽”，指柱脚下承托柱子的金属构件。
    reason: lexical_alternative
  - marker: b
    text: “柱顶的包层”也可译作“柱顶的包覆”；原文直译为“它们头部的包层”。
    reason: lexical_alternative
  - marker: c
    text: 传统上也译作“横杆”或“箍环”。这种银制构件的确切形状不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: 柱子
  rationale: עַמּוּד在会幕建造语境中指支撑用的柱；“柱子”是现代汉语中自然、清楚的建筑用语。
- source_word: אַדְנֵיהֶם
  choice: 底座
  rationale: אֶדֶן指柱脚下承托柱子的金属构件；“底座”比“卯座”等术语更易懂，同时保留其支撑功能。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת可泛指铜或铜合金；在会幕材料清单中常理解为青铜，但汉语圣经语境以“铜”表达较自然，也不对合金成分作超出原文的限定。
- source_word: וָוֵיהֶם
  choice: 柱上的钩子
  rationale: וָו指用于连接或悬挂的钩状构件；补出“柱上的”仅为明确所属关系，不增加新的构造细节。
- source_word: כֶּסֶף
  choice: 银的
  rationale: כֶּסֶף在此明确指银这种材料；用谓语“是银的”自然表达希伯来文的材料说明。
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: 柱顶的包层
  rationale: צִפּוּי是覆盖、包覆之物，רָאשֵׁיהֶם直译为“它们的头部”，在柱子语境中即柱顶；“包层”保留名词结构，未改写成过度具体的制作动作。
- source_word: חֲשֻׁקֵיהֶם
  choice: 箍带
  rationale: 该词所指银制构件的确切形状不明；“箍带”能表达环箍或束带一类构件，同时避免将其明确解释为连杆。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述。以分号划分两组构件，使材料对应关系清楚；“也是银的”按希伯来语句法同时说明柱顶包层和箍带的材质。所有代词所属在汉语中必要处明确为“柱上／柱顶”，避免歧义。
