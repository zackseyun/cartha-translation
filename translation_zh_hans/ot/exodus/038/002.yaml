base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: zh_hans
  text: 他在坛的四角上做了坛角；坛角是与坛一体做成的[a]。他又用铜包裹坛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“它的角是从它而出的”。这表示坛角不是另做后接上的，而是与坛本体一体制成。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语“נְחֹשֶׁת”（neḥoshet）可指铜，也可指青铜；在会幕器具的语境中，两种译法均见使用。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: 这是叙事中常见的 wayyiqtol 形式，动词 עשה 表示“做、制作”；“做了”简明自然。
- source_word: קַרְנֹתָיו
  choice: 坛角
  rationale: קֶרֶן 本义为“角”，在祭坛语境中指四角的角状突出部分。“坛角”既保留具体意象，也符合现代中文圣经用语。
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: 在坛的四角上
  rationale: על 在此表示坛角所在的位置；将代词所指的祭坛明说出来，可避免中文中“它的四角”指代生硬，同时不增添原文之外的对象。
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: 坛角与坛连成一体
  rationale: 原文直译为“它的角是从它而出的”，在制作语境中表示坛角并非另行制作后接上，而是与坛本体一体制成。
- source_word: וַיְצַף אֹתוֹ
  choice: 他又给坛包上
  rationale: צפה 在会幕器具制作语境中指以金属包覆或包裹；“包上”自然清楚，并明确原文代词的所指。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת 可指铜或铜合金（通常译作青铜）。中文“铜”可作为较宽泛的材料名称，既符合礼仪器具语境，也避免在原文未明确合金成分时过度限定。
