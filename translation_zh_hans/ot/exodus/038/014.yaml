  text: Fifteen cubits of hangings were for one side; their pillars were three[a], and their bases were three.
translation:
  language: zh_hans
  text: 这一边的帷幔长十五肘，有三根柱子和三个柱座。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְלָעִים
  choice: 帷幔
  rationale: 在会幕院子的语境中，指围成院墙的织物帷幔；“帷幔”既符合建筑场景，也保持庄重自然。
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: 长十五肘
  rationale: 原文直陈“十五肘”，汉语补出“长”可清楚表达这里所量的是这一段帷幔的长度。
- source_word: אֶל הַכָּתֵף
  choice: 这一边
  rationale: כָּתֵף本义为“肩、侧面”，此处指院门一侧的一段；“这一边”自然表达其空间关系，同时不把方位说得过于具体。
- source_word: עַמּוּדֵיהֶם
  choice: 三根柱子
  rationale: עַמּוּד在此指支撑院子帷幔的柱子；量词“根”符合现代汉语习惯。
- source_word: אַדְנֵיהֶם
  choice: 三个柱座
  rationale: אָדֶן指柱子下方承托并固定柱身的座或槽座；“柱座”比单说“座”清楚，也比“插座”更符合现代建筑用语。
