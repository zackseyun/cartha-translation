  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: zh_hans
  text: 他把杠穿进祭坛两侧的环里[a]，好用杠抬祭坛。他把祭坛做成中空的木板结构[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他把杠带进祭坛两侧的环里。”希伯来语动词较直译为“带进”，这里按上下文是把杠安放到环中。
    reason: lexical_alternative
  - marker: b
    text: 直译：“中空，木板。”这个简略短语可能是说，祭坛制成中空的木板结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 把……穿进
  rationale: 使役形在本处表示将杠安放到环中；“穿进”自然地表达杠进入环内，同时保留动作方向。
- source_word: הַבַּדִּים
  choice: 杠
  rationale: 在会幕器具的语境中指抬运器具所用的长杆；“杠”符合现代中文圣所器具的表达。
- source_word: בַּטַּבָּעֹת
  choice: 环里
  rationale: 介词 ב 在这一移动语境中表示进入环内；与“穿进”搭配清楚自然。
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: 祭坛两侧的
  rationale: צְלָעוֹת 指祭坛的侧面；“两侧”符合器具构造语境，但不进一步推断环的具体形制。
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: 好用杠抬祭坛
  rationale: 不定式表达目的；בָּהֶם 回指杠。将代词明确为“祭坛”和“杠”，可避免现代中文中的指代含混。
- source_word: נְבוּב
  choice: 中空的
  rationale: 准确表达祭坛内部为空的构造特征。
- source_word: לֻחֹת
  choice: 用木板
  rationale: לֻחֹת 字面为“板”；结合祭坛制作语境译作“木板”，自然说明其板材结构，但正文与脚注保留希伯来语短语的省略性。
- source_word: עָשָׂה אֹתוֹ
  choice: 把祭坛做成
  rationale: 直译其制作含义，并明确宾语所指，形成自然的现代汉语句式。
