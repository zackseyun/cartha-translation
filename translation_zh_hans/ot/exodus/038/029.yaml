  text: וּ/נְחֹ֥שֶׁת הַ/תְּנוּפָ֖ה שִׁבְעִ֣ים כִּכָּ֑ר וְ/אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/029.yaml
  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: zh_hans
  text: 所献作摇祭[b]的铜[a]，共重七十他连得又二千四百舍客勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜”或作“青铜”；希伯来语 נְחֹשֶׁת 可按语境指铜或青铜。
    reason: lexical_alternative
  - marker: b
    text: “摇祭”是礼仪术语，指在耶和华面前以摇动的方式呈献之物；也可较笼统地译作“呈献的礼物”或“献礼”。
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可泛指铜或青铜。正文采用现代汉语中较宽泛、也符合会幕器材传统表述的“铜”，并以脚注保留“青铜”的可能性。
- source_word: הַתְּנוּפָה
  choice: 摇祭
  rationale: 这是礼仪术语，指在耶和华面前以摇动方式呈献的祭物或礼物；“摇祭”简洁地保留了原文的礼仪性质。
- source_word: שִׁבְעִים כִּכָּר
  choice: 七十他连得
  rationale: 保留古代重量单位，不在正文中作不确定的现代重量换算。
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: 又二千四百舍客勒
  rationale: 按原文数量直译，并保留古代重量单位“舍客勒”；“又”清楚表达两项重量相加。
- source_word: וְ
  choice: （承接上文，不另译“并且”）
  rationale: 句首连接词承接前文的清点记录；中文以直接起句更自然，篇章衔接仍然清楚。
theological_decisions: []
