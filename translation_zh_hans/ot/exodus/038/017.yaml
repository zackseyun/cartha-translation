base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: zh_hans
  text: 柱子的底座[a]是铜制的；柱上的钩和箍[b]是银制的，柱顶的包层也是银制的；院子里所有的柱子都用银箍着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “底座”也可译作“承窝”。
    reason: lexical_alternative
  - marker: b
    text: 这里所说的“箍”具体是什么形制并不确定，指与柱子相连、环绕或固定柱子的银制构件。
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: 底座
  rationale: 在会幕建造语境中，指承托柱子的座或承窝；“底座”是现代汉语中清楚自然的表达，同时以脚注保留“承窝”这一可能译法。
- source_word: עַמֻּדִים
  choice: 柱子
  rationale: 指直立的结构支撑物；“柱子”通俗、准确，也符合本段建筑语境。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可泛指铜或铜合金；译作“铜”既自然，也避免在原文未明确时过度限定为纯铜或青铜。
- source_word: וָוֵי
  choice: 钩
  rationale: 指安装在柱上的钩状构件；“钩”简明并符合院子结构的上下文。
- source_word: חֲשׁוּקֵיהֶם
  choice: 箍
  rationale: 该构件的确切形制不明，但词义与环绕、束住柱子的配件有关；“箍”简洁，并能与后面的同根动词相呼应。
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: 柱顶也包着银
  rationale: 原意为柱子顶部的覆盖层是银；采用动词化表达，使现代汉语自然，同时保留金属包覆的含义。
- source_word: מְחֻשָּׁקִים
  choice: 用银箍着
  rationale: 这是与“箍”同根的被动分词，表示柱子配有环绕的银制构件；此译法保留原文的词根呼应。
- source_word: חָצֵר
  choice: 院子
  rationale: 在会幕语境中指外围围成的院落；“院子”清楚、自然，普通读者容易理解。
