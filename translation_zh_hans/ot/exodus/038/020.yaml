  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: zh_hans
  text: 帐幕和院子四围所用的一切橛子，都是铜制的[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青铜”。希伯来语 נְחֹשֶׁת 按语境可指铜或青铜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַיְתֵדֹת
  choice: 一切橛子
  rationale: כָּל与复数名词连用，表达整体性的“一切”；יָתֵד指用来固定帐幕或帷幕的橛子。“橛子”简洁、准确，后文已说明其所属，无须增补“帐篷”。
- source_word: לַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן本义为居所，在《出埃及记》的语境中是指以色列人敬拜所用的帐幕；“帐幕”是现代中文圣经语境中清楚而自然的对应词。
- source_word: וְלֶחָצֵר סָבִיב
  choice: 和四围院子的
  rationale: חָצֵר指帐幕周围围起来的院子，סָבִיב表达环绕之意。“四围院子”保留空间关系，也符合中文叙述习惯。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת可指铜，也可泛指铜合金、青铜。正文采用现代中文较自然且能涵盖材料类别的“铜”，并以脚注保留“青铜”的可能性。
