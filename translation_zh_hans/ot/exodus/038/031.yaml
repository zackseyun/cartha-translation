  - marker: a
    text: “底座”或译“卯座”。
    reason: lexical_alternative
  - marker: b
    text: “橛子”或译“桩子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: 底座
  rationale: 此词在帐幕建造语境中指安放框架或柱子的金属基座；“底座”现代、清楚，也适用于院子与院门的柱子。
- source_word: חָצֵר
  choice: 院子
  rationale: 指帐幕外围被围起的神圣空间；“院子”自然易懂，并能保持其空间含义。
- source_word: סָבִיב
  choice: 四围
  rationale: 表示环绕四周、遍及周边；“四围”简洁地保留其周遍含义。
- source_word: שַׁעַר
  choice: 院门
  rationale: 这里指院子的出入口；结合“院”译作“院门”，比单独的“门”更明确自然。
- source_word: יִתְדֹת
  choice: 橛子
  rationale: 指固定帐幕及院子帷幕所用的钉橛；“橛子”准确保留可携式圣所构件的具体形象。
- source_word: מִּשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中对神圣帐棚的固定称呼；“帐幕”既具体，又符合现代中文圣经用语。
- source_word: כָּל
  choice: 所有的
  rationale: 全面涵盖复数的橛子；“所有的”在清单语境中清楚自然。
- source_word: וְאֵת / וְאֶת
  choice: 以及／和
  rationale: 连词与直接宾语标记反复出现，延续前文清单；中文以“以及”和“和”自然表达并列关系，不另译宾语标记。
