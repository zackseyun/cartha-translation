  text: 东边，朝着日出的方向，五十肘。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“东边，朝着日出，五十肘。”
    reason: 说明原文连续使用两个相近的东方方位表达。
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: ……边
  rationale: פאה在此院幕尺寸的语境中指一侧或一边；中文用“……边”自然简洁。句首连接成分按上下文不硬译为“和”，以免中文生硬。
- source_word: קֵדְמָה
  choice: 东边
  rationale: 该词可指前方或东方；与מִזְרָחָה并列时，方位含义明确，译作“东边”。
- source_word: מִזְרָחָה
  choice: 日出方向
  rationale: 该词与日出、东方相关。译作“日出方向”，既保留希伯来文与“东边”并列的方向表达，也避免只重复“向东”。
- source_word: חֲמִשִּׁים
  choice: 五十
  rationale: 如实译出基数。
- source_word: אַמָּה
  choice: 肘
  rationale: 这是古代常用长度单位；沿用现代中文圣经读者较熟悉的“肘”，不擅自换算为现代单位。
