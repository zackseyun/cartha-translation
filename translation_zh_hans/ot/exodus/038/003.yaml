base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: zh_hans
  text: 他制造了祭坛的一切器具：盆[a]、铲、盘、叉和火盘。他用青铜[b]造了祭坛的一切器具。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“盆”的希伯来语词，在本处可能特指清除或盛放灰烬的器皿。
    reason: lexical_alternative
  - marker: b
    text: “青铜”或译“铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: 祭坛的一切器具
  rationale: כְּלִי泛指器皿、用具或装备；“器具”自然涵盖随后列出的各类祭坛用具。
- source_word: הַסִּירֹת
  choice: 盆
  rationale: סִירוֹת通常指锅、盆一类容器；祭坛语境中可能专用于盛放或清除灰烬，但正文未明说其用途，因此采用较宽泛的“盆”，并以脚注保留具体解释。
- source_word: הַיָּעִים
  choice: 铲
  rationale: יַע指铲取或舀取之具；“铲”简洁且符合祭坛操作语境。
- source_word: הַמִּזְרָקֹת
  choice: 盘
  rationale: מִזְרָקוֹת指礼仪中盛接或泼洒液体的器皿；“盘”既与前面的“盆”区分，也不在正文中添加“血”等原文未明说的信息。
- source_word: הַמִּזְלָגֹת
  choice: 叉
  rationale: 该词指叉形器具；“叉”保留器具形态，不额外限定为肉叉。
- source_word: הַמַּחְתֹּת
  choice: 火盘
  rationale: מַחְתָּה指承载炭火的盘形器具；“火盘”准确、清楚，也避免把它直接解释为香炉。
- source_word: כָּל כֵּלָיו
  choice: 祭坛的一切器具
  rationale: 代词后缀所指为祭坛；汉语中明说“祭坛”比“一切它的器具”自然，也与前句形成呼应。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: נְחֹשֶׁת可指铜或铜合金；会幕器物语境中传统上多译“青铜”，同时用脚注保留“铜”的词义可能。
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: 他制造了……他用……造了
  rationale: 保留原文两次使用עשה所形成的列举与总结结构，同时以自然汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简明的叙述语体。器具名称尽量使用普通读者易懂的单音节或双音节词，并避免在正文中加入原文未明确表达的礼仪用途。脚注标记依其实际所注词项安放：铜材词义脚注置于“青铜”后，器皿用途脚注置于“盆”后。
