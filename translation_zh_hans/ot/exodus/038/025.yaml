  yaml_path: translation/ot/exodus/038/025.yaml
  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: zh_hans
  text: 会众中被数点之人的银子[a]，共有一百他连得，另有一千七百七十五舍客勒，都是按圣所舍客勒的标准称量的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“会众中被数点者的银子。”原文是简洁的属格结构，强调这些银子与被数点者相关，并未在本句明说交付的动作。
    reason: lexical_alternative
  - marker: b
    text: 意思是按圣所规定的标准重量计算。
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  choice: 银子
  rationale: 此处是在统计所收集的贵金属，指银本身，而非抽象意义上的钱财。
- source_word: פְּקוּדֵי הָעֵדָה
  choice: 会众中被数点之人
  rationale: פְּקוּדֵי 指在登记或人口统计中被数点的人；הָעֵדָה 指作为整体的会众。此译既保留行政统计语境，也符合现代汉语表达。
- source_word: מְאַת כִּכָּר
  choice: 一百他连得
  rationale: כִּכָּר 是古代的大重量单位；采用圣经汉语中通行的音译“他连得”，避免用不确定的现代重量直接换算。
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: 另有一千七百七十五舍客勒
  rationale: 原文以累加方式列出数目，总数为一千七百七十五舍客勒；“另有”清楚表示这是除一百他连得之外的余数。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所舍客勒的标准称量
  rationale: 该短语说明采用的重量标准。“圣所舍客勒”保留古代单位名称，补出“标准称量”则自然表达介词 בְּ 在此处的计量含义。
