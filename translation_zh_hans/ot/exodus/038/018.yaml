  text: וּ/מָסַ֞ךְ שַׁ֤עַר הֶ/חָצֵר֙ מַעֲשֵׂ֣ה רֹקֵ֔ם תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר וְ/עֶשְׂרִ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/קוֹמָ֤ה בְ/רֹ֨חַב֙ חָמֵ֣שׁ אַמּ֔וֹת לְ/עֻמַּ֖ת קַלְעֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: zh_hans
  text: 院门的帘幕[a]是绣工制成的，用蓝色、紫色和朱红色线[b]，以及捻成的细麻做成；长二十肘，高五肘[c]，与院子的帷幔相称。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“院子入口的门帘”。
    reason: מָסַךְ与שַׁעַר合用，既可指遮挡入口的帘幕，也可强调其所在的入口位置。
  - marker: b
    text: 原文为“蓝色、紫色和朱红色”；“线”是根据这里所列的纺织材料补出的。
    reason: 这些颜色词在上下文中指染成相应颜色的纺织材料；中文补出“线”可使表达清楚。
  - marker: c
    text: 原文的尺寸表达可直译为“高度按宽度为五肘”；其确切句法关系有争议，可能表示这门帘的高度与院子四周帷幔的高度相同。
    reason: בְּרֹחַב位于尺寸短语中，功能不完全明确；脚注保留其形式及可能理解，正文不强行消除歧义。
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: 院门的帘子
  rationale: מָסַךְ在会幕语境中指遮挡入口的织物；“帘子”自然表达其材质和功能，并与院子四周的“帷幔”有所区别。שַׁעַר在此指院子的门口或出入口。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 绣工的手艺
  rationale: 保留原文“某种工匠的作品”这一表达，同时用现代汉语简洁呈现带图案的刺绣或彩织工艺。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 蓝色、紫色和朱红色线
  rationale: 这些词在圣幕纺织品清单中既表示颜色，也隐含染成相应颜色的纺织材料；补出“线”使中文语义完整。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻制的细麻
  rationale: שֵׁשׁ指优质细麻，מָשְׁזָר表示经捻合加工；此译保留材料和制作特征。
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: 长二十肘
  rationale: 采用简洁的中文尺寸表达，并保留古代长度单位“肘”。
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת
  choice: 高五肘
  rationale: קוֹמָה明确表示高度；结合下文与院子帷幔相称，正文采用自然的尺寸表达，原文较特殊的בְרֹחַב结构在脚注中说明。
- source_word: לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: 在宽度上与院子的帷幔相称
  rationale: לְעֻמַּת表示对应、相称；此处按希伯来语句法保留“宽度”及其与院子帷幔的对应关系，避免将具体空间关系解释得过死。
