revisions:
- from: 院门的帘子[a]是绣工的手艺，用蓝色、紫色和朱红色线[b]，以及捻制的细麻做成；长二十肘，高五肘[c]，在宽度上与院子的帷幔相称。
  to: 院门的帘幕[a]是绣工制成的，用蓝色、紫色和朱红色线[b]，以及捻成的细麻做成；长二十肘，高五肘[c]，与院子的帷幔相称。
  rationale: 修订使中文搭配更自然，并避免把希伯来文尺寸短语中存在争议的“按宽度”明确解释为帘幕宽度与帷幔相称。脚注继续保留替代译法、补出的“线”及尺寸表达的不确定性，且所有脚注锚点均与正文对应。
