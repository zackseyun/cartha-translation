    rationale: בְּרֹחַב在“高度五肘”的短语中句法特殊；它不宜在中文正文中明确断言为帘幕的宽度与帷幔相称。应以自然正文表达高度及与帷幔的对应，并在脚注保留原文结构及不确定性。
  - severity: low
