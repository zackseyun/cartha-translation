base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: zh_hans
  text: 他用金合欢木做燔祭坛，长五肘，宽五肘，呈正方形[a]，高三肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“四方形”。
    reason: 保留רָבוּעַ的传统近字面译法；正文“正方形”更明确表达其形状。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做
  rationale: 叙事性连续式表示过去发生的动作；现代汉语以“他……做”自然承接上文，不必机械译出连接词“和”。
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: 该组合词指用于献上全烧祭物的坛；“燔祭坛”是简洁、清楚且沿用已久的现代中文表达。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: שִׁטִּים 指一类金合欢属木材；“皂荚木”是中文圣经语境中通行且易于辨认的名称。
- source_word: חָמֵשׁ אַמּוֹת
  choice: 五肘
  rationale: 保留原文的古代长度单位“肘”，以维持会幕各项尺寸的一致性，不作带有不确定性的现代单位换算。
- source_word: אָרְכּוֹ / רָחְבּוֹ / קֹמָתוֹ
  choice: 长……宽……高……
  rationale: 原文分别为“它的长度、它的宽度、它的高度”；中文尺寸说明用“长、宽、高”更自然简明，所指仍明确是祭坛。
- source_word: רָבוּעַ
  choice: 呈正方形
  rationale: 该词表示四边构成方形；结合前述长宽相等，译作“呈正方形”准确而自然，同时在脚注保留较贴近词形的译法。
