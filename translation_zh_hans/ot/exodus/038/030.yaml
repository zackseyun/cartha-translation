base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: zh_hans
  text: 他用这些铜做了会幕入口的底座[a]、铜祭坛、祭坛所用的铜格栅[b]，以及祭坛的一切器具。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“会幕入口的插座”。
    reason: lexical_alternative
  - marker: b
    text: 或译“铜网”或“铜网架”；指与祭坛配套的网状构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: 叙事中 עשה 是常用的制造动词；“做了”自然清楚，也符合本节列举器物的语境。
- source_word: בָּהּ
  choice: 用这些铜
  rationale: 阴性单数代词回指上一节统计的铜；这里取工具或材料义。“这些铜”既明确所指，也与上文数量衔接。
- source_word: אַדְנֵי
  choice: 底座
  rationale: אָדֶן 在会幕语境中指承托柱、板或入口构件的金属座；“底座”是现代读者容易理解的表达，同时以脚注保留较技术性的译法。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕入口
  rationale: פֶּתַח 指入口或门口；“会幕入口”简洁自然，准确表达希伯来语的组合关系。
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: 铜祭坛
  rationale: נְחֹשֶׁת 在此指制造祭坛所用的铜质材料；“铜祭坛”是简明、通行且不显累赘的中文表达。
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: 铜网架
  rationale: מִכְבָּר 指祭坛配套的网格状构件；“铜网架”既表达网状结构，也表明它是具体器件，而不只是纹样。
- source_word: אֲשֶׁר לוֹ
  choice: 祭坛所用的
  rationale: 该关系短语把铜网架与祭坛相连。“所用的”表达所属或配套关系，同时不武断规定其准确安装位置。
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: 祭坛的一切器具
  rationale: כְּלִים 是器物、用具的广义词；“器具”适合礼仪设备的语境，也为普通现代读者所理解。
theological_decisions: []
