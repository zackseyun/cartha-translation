  yaml_path: translation/ot/exodus/038/005.yaml
  text: He cast four rings on the four corners of the bronze grating as holders for the poles[a][b].
translation:
  language: zh_hans
  text: 他在青铜网的四角[a]铸了四个环，作为供杠穿过的承接件[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“四端”。
    reason: lexical_alternative
  - marker: b
    text: “承接件”原文直译为“房屋”，这里指供杠穿过或安放的容纳构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: 铸了
  rationale: יצק在制造会幕金属器件的语境中指熔铸；“铸了”简洁自然，也明确表达金属加工。
- source_word: אַרְבַּע טַבָּעֹת
  choice: 四个环
  rationale: טַבָּעוֹת在此指供抬运器具使用的金属环；“四个环”是直接、清楚的对应。
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: 在……四角
  rationale: קָצֶה可指末端、边缘或尽头；就铜网的形状与四个环的配置而言，“四角”最自然，同时以脚注保留“四端”的可能。
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: 铜网的
  rationale: מִכְבָּר是网格状的篦网；נְחֹשֶׁת在此指铜或青铜类材料。按现代中文圣经器物用语译作“铜网”，简明且符合上下文。
- source_word: בָּתִּים
  choice: 套座
  rationale: בָּתִּים字面为“房屋”，此处指容纳、承接杠的构件。“套座”能自然表达供杠穿入或安放的金属承接件，并以脚注说明原文字面。
- source_word: לַבַּדִּים
  choice: 穿杠的
  rationale: בַּדִּים指搬运会幕器具所用的杠。“穿杠的”结合套座说明其用途，符合现代中文表达。
