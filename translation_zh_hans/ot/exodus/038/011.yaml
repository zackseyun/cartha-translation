base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: zh_hans
  text: 北面长一百肘；有二十根柱子和二十个铜座。柱子上的钩子和箍带[a]都是银的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “箍带”所译的希伯来语，指柱子上的银质构件；其确切形制不明，也可能指连接杆。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: 北面
  rationale: פאה指一侧或边缘，与צפון连用即院子的北面；简洁自然，并符合本段清单式语体。
- source_word: מֵאָה בָאַמָּה
  choice: 长一百肘
  rationale: 原文给出该面的长度；补出“长”使现代汉语句意完整。“肘”保留古代长度单位。
- source_word: עַמּוּדֵיהֶם
  choice: 二十根柱子
  rationale: עמוד在会幕院子的语境中指支撑帷幔的柱子；“根”是现代汉语合宜的量词。希伯来语复数后缀不宜机械译出，以免中文生硬。
- source_word: אַדְנֵיהֶם
  choice: 二十个铜座
  rationale: אדן指柱子底部承托固定用的座或槽座；“座”比“插座”更自然，也足以表达其结构功能。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נחשת可指铜或铜合金；古代具体成分未必能够确定。中文圣经器物语境通常用涵盖性较强的“铜”，避免过度限定为青铜。
- source_word: וָוֵי הָעַמּוּדִים
  choice: 柱子上的钩子
  rationale: וו在此指装在柱子上的钩状配件；加入“上”清楚表达其附着关系。
- source_word: חֲשֻׁקֵיהֶם
  choice: 箍带
  rationale: חשק的词根有箍住、连接之意，此处指柱子所配的银质建筑构件；其确切形制不明。“箍带”既可理解，又保留这种不确定性。
- source_word: כָּסֶף
  choice: 银
  rationale: 标准材料名称；原文谓钩子及箍带均为银制。
theological_decisions: []
