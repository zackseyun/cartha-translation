base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: zh_hans
  text: 他用那些在会幕门口服事[a]的妇女的镜子[b]，造了铜盆和铜盆座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“聚集”。希伯来语在这里既可强调有组织地聚集，也可表示为某项事务服事或当值。
    reason: alternative_reading
  - marker: b
    text: 古代的镜子通常不是玻璃制成的，而是以磨光的铜或青铜制成。
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: 盆
  rationale: 指会幕礼仪中供洗濯使用的大盆；“盆”是清楚自然的现代汉语表达。与材质“铜”合为“铜盆”。
- source_word: כַּן
  choice: 盆座
  rationale: 指承托铜盆的底座或支架；“盆座”既简洁，也明确表示它与前述铜盆的从属关系。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可泛指铜或铜合金；在会幕器具语境中通常理解为青铜。正文用汉语圣经语体中自然、涵盖面较广的“铜”，不对具体合金成分作过度限定。
- source_word: בְּמַרְאֹת
  choice: 用……的镜子
  rationale: 此处介词 בְּ 最自然地表示制作材料或来源，即盆和盆座以这些镜子为材料制成。
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: 那些……服事的妇女
  rationale: 词根 צבא 在此可表达有组织地聚集、当值或服事。语境指向有目的的参与，故正文译作“服事”，同时以脚注保留“聚集”的可能性，且不暗示她们具有祭司职分。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: 准确保留地点含义，并采用现代汉语中简洁、通行的会幕用语。
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: 以自然的汉语叙事过去时表达完成的制作行动；主语依上下文译为“他”。
theological_decisions:
- issue: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ 所指妇女的活动性质
  choice: 在会幕门口服事的妇女
  alternative: 在会幕门口聚集的妇女
  rationale: 希伯来语既可带有为某种任务聚集、当值的意味，也可强调组织性聚集。正文“服事”表达其有目的的参与，却不将其具体界定为祭司或礼仪职分；脚注保留另一种合理理解。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“铜盆”“盆座”“会幕”等用语保持经文语境的辨识度；关系从句尽量贴近希伯来文信息次序，同时通过脚注保存词义歧义及物质文化背景。
