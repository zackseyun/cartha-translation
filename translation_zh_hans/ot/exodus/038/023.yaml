revisions:
- from: 同他一起做工的还有但支派亚希撒抹的儿子亚何利亚伯[a]；他是雕刻匠、设计师和刺绣工，能用蓝色线、紫色线、朱红色线[b]和细麻刺绣。
  to: 与他同工的还有但支派亚希撒抹的儿子亚何利亚伯[a]；他是工匠、图案设计者和刺绣工，从事蓝色、紫色、朱红色纺织材料和细麻布的工艺工作。
  rationale: 修订以较宽的“工匠”对应חָרָשׁ，并将四种材料置于“工艺工作”的范围内，从而保留原文三项职分和材料列举之间的关系，避免中文把“细麻”误作刺绣承载物。脚注b随正文将“朱红色线”改为较不限定的“朱红色纺织材料”。
  reviewer_model: gpt-5.6-terra
