base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: zh_hans
  text: 与他同工的还有但支派亚希撒抹的儿子亚何利亚伯[a]；他是工匠、图案设计者和刺绣工，从事蓝色、紫色、朱红色纺织材料和细麻布的工艺工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚何利亚伯”也可音译为“亚荷利亚伯”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: 同他一起做工的还有
  rationale: 承接上一节的比撒列；希伯来文是无动词结构。补出“做工”和“还有”，使现代汉语自然，并清楚表达亚何利亚伯与他同工。
- source_word: אָהֳלִיאָב
  choice: 亚何利亚伯
  rationale: 按现代中文圣经人名的常见形式音译，保留其作为专名的功能。
- source_word: בֶּן אֲחִיסָמָךְ
  choice: 亚希撒抹的儿子
  rationale: 直接保留希伯来文父子关系结构。
- source_word: לְמַטֵּה דָן
  choice: 但支派
  rationale: 该短语表明所属支派；简洁自然地译为“但支派”。
- source_word: חָרָשׁ
  choice: 雕刻匠
  rationale: 该词可泛指工匠，也可在此工艺语境中指雕刻者；采用较具体且与并列技艺相称的译法。
- source_word: וְחֹשֵׁב
  choice: 设计师
  rationale: 该词在会幕织物语境中涉及构思图样和艺术设计；“设计师”能表达其创作性，同时不把工艺手段限定得过窄。
- source_word: וְרֹקֵם
  choice: 刺绣工
  rationale: 该词指在织物上作彩色刺绣的人；“刺绣工”是清楚、自然的现代汉语。
- source_word: בַּתְּכֵלֶת וּבָאַרְגָּמָן וּבְתוֹלַעַת הַשָּׁנִי וּבַשֵּׁשׁ
  choice: 用蓝色线、紫色线、朱红色线和细麻刺绣
  rationale: 介词短语列出刺绣所用的彩色纺织材料与细麻。中文补出前三项的“线”，使纺织语境明确；末项译作“细麻”，保持材料类别，并以“刺绣”统摄全组。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。分号把身份介绍与技艺说明分开；保留三种工匠称谓的并列关系，并避免使用生僻的纺织术语。
