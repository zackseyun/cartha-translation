base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/004.yaml
  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: zh_hans
  text: 他为祭坛做了一个铜制、按网状制成的格栅[a]，设在坛的凸缘[b]下面，从下方直到坛的中部[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“网格”。直译近于“铜制的、网状工艺的格栅”。
    reason: lexical_alternative
  - marker: b
    text: “凸缘”所译的希伯来语指祭坛上的一种边缘构件，也可译作“围边”、“边沿”或“围框”。
    reason: lexical_alternative
  - marker: c
    text: 或译“从下面直到其一半”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: 以自然的汉语叙事表达 wayyiqtol 所推进的动作；本节无需机械译出句首连接词。
- source_word: לַמִּזְבֵּחַ
  choice: 为祭坛
  rationale: ל 在这里表示制作对象的用途或归属，不是单纯表示所在位置。
- source_word: מִכְבָּר
  choice: 网格
  rationale: 该词指格栅或网格状构件；“网格”通俗清楚，也能与后面的“呈网状”自然衔接。
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: 呈网状
  rationale: 原文直译近于“网的工艺／网状制品”；此译保留构造形态，同时避免生硬重复。
- source_word: נְחֹשֶׁת
  choice: 铜制的
  rationale: נְחֹשֶׁת 可泛指铜或铜合金；在会幕器具语境中通常理解为青铜，但正文用“铜制”较符合现代汉语圣经用语，也不对具体合金成分作过度限定。
- source_word: תַּחַת כַּרְכֻּבּוֹ
  choice: 在坛的凸缘下面
  rationale: תַּחַת 表示下方位置；כַּרְכֻּבּוֹ 是祭坛上某种突出的边缘构件，具体形态不能完全确定，因此采用“凸缘”并加注其他可能译法。
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: 从下方直到坛的中部
  rationale: 尽量保留原文“从下面／下方到其一半”的空间表述，不擅自补足网格安装方向；明确“坛”只是为避免汉语代词含混。
