  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: zh_hans
  text: 柱子有二十根，二十个底座都是铜制的；柱子的钩子和箍带都是银制的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: 柱子
  rationale: עַמּוּדִים指支撑院帷的柱子；上下文已明确所属关系，汉语无需生硬译出复数后缀。
- source_word: עֶשְׂרִים
  choice: 二十
  rationale: 基数词，两处均直译为“二十”，并按汉语习惯分别搭配量词“根”和“个”。
- source_word: אַדְנֵיהֶם
  choice: 柱子的底座
  rationale: אֶדֶן在会幕建筑语境中指承托柱子或板框的底座、卯座；“底座”比“插座”更自然清楚，并显明其与柱子的关系。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת可指铜或铜合金；现代中文圣经器物语境通常以“铜”作涵盖性称谓，不武断限定具体合金成分。
- source_word: וָוֵי הָעַמֻּדִים
  choice: 柱上的钩子
  rationale: וָוִים指柱上用来悬挂或连接帷幔的钩状配件；“柱上的钩子”自然表达构属关系。
- source_word: חֲשֻׁקֵיהֶם
  choice: 箍带
  rationale: חֲשֻׁקִים指与柱子相连的环箍、带状或连接构件；“箍带”既保留其环束的基本形象，也比传统但含混的术语更易懂。
- source_word: כָּסֶף
  choice: 银
  rationale: 材料名称，直接译为“银”。
