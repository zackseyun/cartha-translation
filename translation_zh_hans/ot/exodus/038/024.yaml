base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: zh_hans
  text: 用于圣所一切工程的金子，就是作为摇祭献上的金子[a]，共二十九他连得、七百三十舍客勒[b]，按圣所的舍客勒计算。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “摇祭”指将供物在耶和华面前以礼仪动作呈献；这里指以这种方式献上的金子。
    reason: cultural_note
  - marker: b
    text: “他连得”和“舍客勒”都是古代重量单位；其实际重量会因时期和标准而略有差异。
    reason: measurement_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: 用于……工程
  rationale: 被动分词 הֶעָשׂוּי 在这里说明金子被投入会幕建造，而不是说金子本身被制造出来；“用于……工程”符合上下文，也较自然。
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: 圣所各项工程
  rationale: מְלֶאכֶת 指建造、制作等工作，הַקֹּדֶשׁ 在本段指圣所；“各项工程”既涵盖全部相关制作，也避免被误解为一般宗教事务。
- source_word: זְהַב הַתְּנוּפָה
  choice: 摇献的金子
  rationale: תְּנוּפָה 是礼仪用语，指以特定动作呈献的供物；采用“摇献”保留其祭礼色彩，并与相关经文的术语保持联系。
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר
  choice: 二十九他连得
  rationale: 按现代汉语数序表达希伯来文数量，并保留古代重量单位，避免用不确定的现代重量换算替代原文。
- source_word: וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: 七百三十舍客勒
  rationale: 直接、准确地表达原文数值，并保留古代重量单位。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒为准计算
  rationale: 介词 בְּ 在这里表示计量标准；这一译法清楚说明重量是依照圣所通行的舍客勒标准核算。
