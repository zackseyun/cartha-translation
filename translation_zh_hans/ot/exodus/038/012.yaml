  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: zh_hans
  text: 西边的帷幔长五十肘，有十根柱子和十个柱座；柱上的钩子和箍带[a]都是银的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“连接杆”或“装饰性的连接构件”。这里的希伯来语是建筑专用词，可能指环绕柱子的箍带、连接用的杆件，或装饰性的连接构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: 西边
  rationale: יָם字面为“海”，在会幕方位描述中惯指西方；译作“西边”自然明确。
- source_word: קְלָעִים
  choice: 帷幔
  rationale: 在会幕院子的语境中，指构成围墙的织物悬幔；“帷幔”既具体又保持庄重。
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: 长五十肘
  rationale: 原文直接给出五十肘的尺度；汉语补出“长”以清楚表达帷幔在该边的延展长度。
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: 有十根柱子
  rationale: 用“根”搭配柱子，并以“有”自然表达希伯来文清单式结构。
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: 和十个柱座
  rationale: אֶדֶן在会幕建筑中指承托柱子的座或插座；“柱座”比单说“座”更明确，也比“卯座”通俗。
- source_word: וָוֵי הָעַמֻּדִים
  choice: 柱上的钩子
  rationale: וָוִים在这些会幕段落中指装在柱上的钩状配件；“柱上的钩子”符合现代汉语。
- source_word: וַחֲשׁוּקֵיהֶם
  choice: 和箍杆
  rationale: 该词所指的柱上金属构件不完全确定，可能是箍带、杆件或连接装饰件；“箍杆”保留其环箍或连接的功能意象，同时以脚注说明歧义。
- source_word: כָּסֶף
  choice: 都是银的
  rationale: 末尾名词作材料谓语，同时修饰钩子和箍杆；译作“都是银的”简洁自然。
