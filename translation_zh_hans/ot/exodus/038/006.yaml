  yaml_path: translation/ot/exodus/038/006.yaml
  text: He made the poles of acacia wood and overlaid them with bronze[a].
translation:
  language: zh_hans
  text: 他用金合欢木做了杠，又用铜[a]包裹这些杠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青铜”。希伯来语 נְחֹשֶׁת 可指铜，也可指青铜等铜合金。
    reason: 保留原文金属名称在“铜”与“青铜”等铜合金之间的词义歧义。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: 该词是 עשה 的 Qal 叙事形式，表示接续发生的制作动作；中文以语序自然承接上下文，无须机械译出句首连接词。
- source_word: הַבַּדִּים
  choice: 杠
  rationale: 在会幕器具的语境中，指抬运器具所用的长杆；“杠”简洁自然，也与抬运功能相符。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 该结构直指某种金合欢属木材；“皂荚木”是现代中文圣经语境中较通行且易懂的名称。
- source_word: וַיְצַף
  choice: 包裹
  rationale: צפה 在工艺语境中指以金属覆盖物件表面；“包裹”自然表达以金属覆面的动作。
- source_word: אֹתָם
  choice: 这些杠
  rationale: 宾语后缀回指复数的杠；中文重复名词比单用“它们”更清楚自然。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可泛指铜或铜合金；正文采用涵盖性较强的“铜”，脚注保留“青铜”这一可能译法。
theological_decisions: []
