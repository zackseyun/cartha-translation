base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: zh_hans
  text: 院门的另一侧，从这一边到那一边，有十五肘的帷幔，三根柱子，三个柱座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “柱座”或译“卯座”。
    reason: 希伯来语 אֶדֶן 可指柱子的底座，也可着重指承接柱脚的凹槽式构件。
lexical_decisions:
- source_word: לַכָּתֵף הַשֵּׁנִית ... מִזֶּה וּמִזֶּה לְשַׁעַר הֶחָצֵר
  choice: 院门两旁的另一侧
  rationale: כָּתֵף 本义为“肩”，在此指门旁的侧段；מִזֶּה וּמִזֶּה 表示门的这一边和那一边。中文将这些成分整合为自然的空间表述，同时以脚注保留另一种句法理解。
- source_word: קְלָעִים
  choice: 帷幔
  rationale: 此词在会幕语境中指围成院子的悬挂织物；“帷幔”既符合建筑用途，也比“窗帘”庄重准确。
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: 十五肘
  rationale: 保留古代长度单位“肘”，不作现代单位换算；原文未明说“长”，故不增补。
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: 三根柱子
  rationale: 以现代汉语量词表达原文简洁的名词计数结构；עַמּוּד 在院幕结构中译作“柱子”。
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: 三个柱座
  rationale: אֶדֶן 指支承柱子的底座或承窝；“柱座”清楚表达构件功能，并以脚注保留“卯座”这一较技术性的可能译法。
