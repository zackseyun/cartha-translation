  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: zh_hans
  text: 他用那一千七百七十五舍客勒的银子做柱钩，把柱顶包上银，又给柱子安上箍条[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又用箍条把它们连接起来。”这里的希伯来语动词可指给柱子安上箍条或饰条，也可理解为用箍条将它们连接起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: 用那一千七百七十五舍客勒银子
  rationale: 本句承接上一节对银子的核算；原文省略了计量单位和“银子”，汉语中按上下文补出“舍客勒银子”，并用“用”表达这笔银子的用途。
- source_word: עָשָׂה
  choice: 做
  rationale: 在制造会幕构件的语境中，简洁自然地表达“制造、制成”。
- source_word: וָוִים
  choice: 柱钩
  rationale: 该词在会幕建造语境中指装在柱子上的金属钩；“柱钩”既明确用途，也保持简洁。
- source_word: לָעַמּוּדִים
  choice: 柱
  rationale: עַמּוּדִים指会幕院子及帷幕结构中的柱子；此处合入“柱钩”表达。
- source_word: וְצִפָּה רָאשֵׁיהֶם
  choice: 包裹柱顶
  rationale: צפה在金属施工语境中指包覆或包裹，רָאשֵׁיהֶם直译为“它们的头”，实际指柱子的顶部；“柱顶”自然清楚。
- source_word: וְחִשַּׁק אֹתָם
  choice: 又给柱子装上箍条
  rationale: חִשַּׁק在此指用箍带、箍条装备或加固柱子。“装上箍条”比音译式或古旧的建筑术语更易懂，同时保留其具体构造含义。
