  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 乌利的儿子、户珥的孙子、属犹大支派的比撒列，做了雅威[a]吩咐摩西的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”；传统译作“耶和华”或“上主”。
    reason: 说明四字神名的原文形式及常见传统译法。
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: 比撒列
  rationale: 人名按希伯来语音译。句首连接词 וּ 表明与上文相连，但在现代汉语中无需机械译作“并且”，上下文的叙事衔接仍然清楚。
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: 乌利的儿子、户珥的孙子
  rationale: 第一个 בֶּן 表示比撒列是乌利之子；连续家谱结构中的第二个 בֶן 表示乌利是户珥之子，汉语译作“户珥的孙子”可清楚呈现亲属层级。
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: 属犹大支派
  rationale: מַטֶּה 在此指以色列的“支派”，前置词 לְ 表示归属；“属犹大支派”自然且准确。
- source_word: עָשָׂה
  choice: 做了
  rationale: עָשָׂה 可指“做、制造”。本节概括比撒列完成各项会幕工程，译作“做了”既保留原词的广义，也适合“一切”这一宾语。
- source_word: אֵת כָּל אֲשֶׁר
  choice: 一切
  rationale: 该结构表示所吩咐之事的全部；汉语“吩咐……的一切”简洁地保留其完整范围。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צִוָּה 表示权威性的命令。“吩咐”符合圣经叙事的庄重语体，也不额外加入希伯来语未明示的时态层次。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名 יְהוָה 音译为“雅威”，以保留经文所用的专名，而非用称号替代。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת 在此标示 צִוָּה 的受事者，不单独翻译；“雅威吩咐摩西”符合现代汉语句法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用“雅威”作为较贴近 YHWH 的现代汉语音译，并以脚注说明传统替代译法，避免把专名静默改成称号。
- issue: “吩咐摩西”与比撒列执行命令的关系
  choice: 保留“雅威吩咐摩西”的原句结构
  alternative: 雅威借摩西所吩咐的
  rationale: 希伯来文以摩西为 צִוָּה 的直接宾语；虽然上下文表明比撒列执行了传给他的指示，但本节没有明说“借着摩西”，故不在正文补入。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。家谱关系以“儿子／孙子”明确层级；句式稍作汉语化调整，将多重定语置于“比撒列”之前，同时保留原文的全部身份信息。
