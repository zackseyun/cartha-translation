  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: zh_hans
  text: 摩西说：“这样做不合适，因为我们献给雅威——我们上帝——的祭物，是埃及人所厌恶的[a]。如果我们当着他们的面，把埃及人所厌恶的献为祭，他们岂不会用石头打我们吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“埃及的可憎之物”；这里大概是指埃及人视为可憎之物。
    reason: 保留 תּוֹעֲבַת מִצְרַיִם 的凝缩属格结构及其解释空间。
lexical_decisions:
- source_word: נָכוֹן
  choice: 合适
  rationale: 此处指合宜、妥当或可接受；“不合适”既自然，也保留摩西所说的实际与宗教层面的不妥。
- source_word: לַעֲשׂוֹת כֵּן
  choice: 这样做
  rationale: 按希伯来语惯用表达直译其指回法老所提方案的功能。
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: 埃及人所厌恶的
  rationale: 结合上下文，表达埃及人视为可憎、不可接受的祭牲或献祭之物；不在正文中进一步限定具体为何物。
- source_word: נִזְבַּח
  choice: 我们要献……为祭
  rationale: 未完成体在论述所拟行动时带有预期或意向色彩；中文用“要”自然表达。
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: 献给雅威我们上帝的
  rationale: 保留圣名雅威及“我们的上帝”这一明确的归属关系。
- source_word: הֵן
  choice: 如果
  rationale: 此处引出假设情形，中文直接用“如果”最符合论证脉络。
- source_word: לְעֵינֵיהֶם
  choice: 当着他们的面
  rationale: 自然传达“在他们眼前、他们亲眼看见”的希伯来语意象。
- source_word: יִסְקְלֻנוּ
  choice: 用石头打我们
  rationale: 准确保留动词“投石击打”的具体动作，同时不擅自在正文中补出结果“打死”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”清楚保留其作为以色列上帝圣约之名的性质。
- issue: תּוֹעֲבַת מִצְרַיִם 的属格关系
  choice: 埃及人所厌恶的
  alternative: 埃及的可憎之物
  rationale: 上下文的逻辑重点是埃及人会因以色列人的献祭而受冒犯并施暴；正文采用客体意义，同时以脚注保留原文较为凝缩的表达及其歧义。
- issue: 投石动作是否明确译为处死
  choice: 用石头打我们
  alternative: 用石头打死我们
  rationale: סקל 明确表示投石击打，常可涉及处死，但本句没有另用表示死亡的词；较少增补的译法保留其语义力度与可能后果之间的张力。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“岂不会”保留原文反问的强烈预期；正文不补明祭牲的具体种类，也不将投石明确扩展为处死。
