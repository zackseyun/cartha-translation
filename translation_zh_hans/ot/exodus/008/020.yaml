review_pass:
  verdict: revise
  source_fidelity: 正文准确传达了雅威照所言施行、大群不明昆虫进入法老及其臣仆住处，并使埃及全地因虫群受毁坏的意思。为更清楚反映“臣仆”所涉的分配性复数住处，宜将“他臣仆的家中”改为“他臣仆的各家中”。脚注中“混杂成群的害虫”虽可关联某些词源或旧译传统，但会把原文未能确定的生物类别及“混杂”概念带入译文，宜以“成群的昆虫”保留不确定性。
  naturalness: “大群虫子”可懂，但“一大群昆虫”在现代标准汉语中更顺畅、庄重，也更适合叙事文本。“法老的宫中”比“法老宫中”更自然；“各家中”消除“臣仆的家中”可能被理解为单一住处的歧义。
  terminology: “雅威”一致保留四字神名的专名性质。“毁坏”能恰当地表达נשחת所示土地受严重破坏，未夸大为彻底灭绝。“昆虫”及脚注避免将עָרֹב限定为苍蝇，同时不采用有争议的“混杂害虫”解释。
  issues:
