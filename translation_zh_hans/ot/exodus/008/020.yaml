  text: וַ/יַּ֤עַשׂ יְהוָה֙ כֵּ֔ן וַ/יָּבֹא֙ עָרֹ֣ב כָּבֵ֔ד בֵּ֥יתָ/ה פַרְעֹ֖ה וּ/בֵ֣ית עֲבָדָ֑י/ו וּ/בְ/כָל אֶ֧רֶץ מִצְרַ֛יִם תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ מִ/פְּנֵ֥י הֶ/עָרֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: zh_hans
  text: 雅威就这样做了。一大群昆虫[a]进入法老的宫中，也进入他臣仆的各家中；埃及全地都因这虫群而遭到毁坏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所指的具体昆虫并不确定，传统上理解为苍蝇；也可泛指成群的昆虫。
    reason: 保留עָרֹב在具体生物种类上的词义不确定性，不在正文或脚注中作无充分依据的限定。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的现代汉语音译，而不以“主”等称号替代，以保留原文中的专名。
- source_word: וַיַּעַשׂ ... כֵּן
  choice: 就这样行了
  rationale: 自然表达雅威照先前所宣告的施行，同时保留希伯来语简洁的叙事推进。
- source_word: עָרֹב כָּבֵד
  choice: 大群虫子
  rationale: כָּבֵד在此表示数量庞大、情势严重；עָרֹב所指的具体生物不确定，因此正文不限定为“苍蝇”。
- source_word: בֵּיתָה פַרְעֹה
  choice: 涌进法老宫中
  rationale: 方向词尾表明进入其内；按法老的王室身份将“房屋”自然译为“宫”，但不扩展为更具体的建筑名称。
- source_word: וּבֵית עֲבָדָיו
  choice: 和他臣仆的家中
  rationale: 将单数集合式的“家”按复数“臣仆”作自然的分配性理解；“臣仆”保留其服事法老且可能具有官员身份的宽泛含义。
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: 埃及全地
  rationale: 简洁表达灾害遍及整个埃及地域。
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: 全地都……遭到毁坏
  rationale: שׁחת的尼法勒形表示土地受到严重破坏；“遭到毁坏”力度充分，又不必理解为彻底灭绝。
- source_word: מִפְּנֵי הֶעָרֹב
  choice: 因这虫群
  rationale: מִפְּנֵי在此自然表示原因；“这虫群”承接前文并保持集合意义。
theological_decisions:
- issue: 神圣名字יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；译作“雅威”旨在保留其作为名字的性质，而不以称号替换。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“涌进”符合虫群大量进入的语境；分号保留前后事件与结果之间的紧密联系。
