revisions:
- from: 雅威就这样行了。大群虫子[a]涌进法老宫中和他臣仆的家中；埃及全地都因这虫群而遭到毁坏。
  to: 雅威就这样做了。一大群昆虫[a]进入法老的宫中，也进入他臣仆的各家中；埃及全地都因这虫群而遭到毁坏。
  rationale: 修订仅改善汉语的自然性和住处数量的表达，并收紧脚注，使其忠实保留原文对虫类的词义不确定性。其余叙事关系、神名译法及土地受毁坏的强度均维持原意。
