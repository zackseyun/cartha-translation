    rationale: 希伯来语“他臣仆的家”可作集合／分配性理解；汉语“他臣仆的各家中”更清楚且不增添意义。
  - severity: low
    issue: 脚注加入“混杂成群的害虫”的表述。
    rationale: עָרֹב所指具体生物确有不确定性，但“混杂”并非本节可无争议地确定的词义；改为说明“成群的昆虫”可更稳妥地保留歧义。
