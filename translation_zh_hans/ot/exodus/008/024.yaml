  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: zh_hans
  text: 法老说：“我会放你们走，好让你们在旷野向耶和华——你们的上帝——献祭；只是，不要走得太远。请为我恳求。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר פַּרְעֹה
  choice: 法老说
  rationale: 未机械译出叙事性连接词 וַ；现代汉语连续叙事中直接说“法老说”自然、清楚，并保留事件推进。
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: 我会放你们走
  rationale: שׁלח 在本段谈判语境中指准许或释放以色列人离去；“放你们走”符合现代汉语习惯。אָנֹכִי 带有主语强调，但汉语的“我会”已足以表达法老亲自作出承诺。
- source_word: וּזְבַחְתֶּם
  choice: 让你们……献祭
  rationale: 连接词加完成式在这里承接“放你们走”，表达准许离开的目的或结果；用“让……献祭”自然呈现这一关系。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: 向你们的上帝耶和华
  rationale: לְ 表示祭献的对象，译为“向”；יהוה 按其专名音译为“耶和华”，אֱלֹהֵיכֶם 译为“你们的上帝”。汉语中调整语序，使专名作为同位说明自然衔接。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 指城镇和耕地以外的荒野地带；“旷野”是出埃及记语境中准确而庄重的常用译法，不把环境限定为沙漠。
- source_word: רַק
  choice: 只是
  rationale: 引出法老对许可所附加的限制；“只是”在现代汉语对话中自然，并保留转折性的限定。
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: 不要走得太远
  rationale: 同词根的不定式绝对形与限定动词连用加强程度；“不要走得太远”以自然汉语表达这一强调和限制。
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: 你们要为我恳求
  rationale: עתר 的使役式在此指迫切祈求或代求，בַּעֲדִי 表示“为我、替我”；“为我恳求”既保留代求对象，也不擅自补出原文未明说的受词。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者最熟悉且庄重的专名“耶和华”，不以“主”替代专名；“雅威”更接近一种学术重构读音，但并非唯一可确证的古代发音。
- issue: הַעְתִּירוּ 的隐含受词
  choice: 不补出“向耶和华”或“向你们的上帝”
  alternative: 你们要向耶和华为我恳求
  rationale: 上下文显然涉及向以色列的上帝代求，但本节希伯来文只明说“为我恳求”。正文保留原文的省略，避免把语境推断写成明说内容。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“献祭”“旷野”“恳求”保留经文语域，但不使用生僻文言结构。标点区分法老的许可、限制和请求。
