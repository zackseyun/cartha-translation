base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: zh_hans
  text: 他说：“明天。”摩西说：“就照你的话吧，好让你知道，没有谁能与雅威、我们的上帝相比。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译；中文传统也常译作“耶和华”或以“上主”代称。
    reason: 说明神名的原文形式及主要中文译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说／摩西说
  rationale: 连续两个叙事性动词分别引出法老的回答和摩西的回应。第二处按上下文补出“摩西”，使现代汉语对话清楚，不改变原文所指。
- source_word: לְמָחָר
  choice: 明天
  rationale: 作时间回答，简洁自然地表达法老所指定的日期。
- source_word: כִּדְבָרְךָ
  choice: 就照你的话吧
  rationale: 保留“照你的话”这一希伯来语表达，同时用“就……吧”自然传达摩西接受法老所定时间的语气。
- source_word: לְמַעַן תֵּדַע
  choice: 好让你知道
  rationale: לְמַעַן引出目的，未完成式תֵּדַע在此适合译为目的从句；“你”单数，指法老。
- source_word: אֵין כַּיהוָה
  choice: 没有谁能与雅威……相比
  rationale: אֵין与比较前缀כְּ共同表达“没有像……的”；汉语用“没有谁能与……相比”自然保留其无可比拟之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的中文音译呈现四字神名YHWH，区别于称号“主”。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 虽有复数词形，本处在语法和语境中指以色列的独一上帝；第一人称复数后缀译为“我们的”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，正文采用“雅威”以保留专名性质；脚注说明其他中文传统译法，不把专名默默改作称号。
- issue: כַּיהוָה所表达的比较
  choice: 没有谁能与雅威—我们的上帝相比
  alternative: 没有像雅威—我们的上帝的
  rationale: 选择符合现代汉语的比较句式，保留原文宣告雅威无可比拟的力度，而不扩展为原文未明说的系统性命题。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留简短对话的节奏；第二个说话者依上下文明确为“摩西”。破折号把“我们的上帝”作为“雅威”的同位说明，避免误读为两个对象。
