base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: zh_hans
  text: 因为你若不放我的百姓走，看哪，我必使虫群[a]临到你、你的臣仆和你的百姓，并进入你的房屋。埃及的房屋必充满虫群；连他们所在的地面[b]也必布满虫群。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虫群”所译的希伯来词含义不完全确定，传统上常理解为“苍蝇群”。
    reason: lexical_alternative
  - marker: b
    text: “地面”也可译作“土地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为你若
  rationale: 承接上文并引出有条件的警告；“因为……若……”兼顾连接作用和现代汉语的自然表达。
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת־עַמִּי
  choice: 你若不放我的百姓走
  rationale: 在出埃及叙事中，שׁלח与“我的百姓”连用表示准许离去、予以释放；“放……走”准确而自然。
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: 看哪，我必使……侵袭
  rationale: “看哪”保留הִנְנִי郑重提示的语气；分词表达即将发生且确定的行动，汉语以“必使……侵袭”传达其迫近性和威胁性。
- source_word: הֶעָרֹב
  choice: 虫群
  rationale: 该词所指生物并不完全确定，传统多理解为苍蝇。“虫群”在现代汉语中简洁可懂，又比“苍蝇”较少限定具体种类；脚注说明其词义不确定性。
- source_word: בְּךָ וּבַעֲבָדֶיךָ וּבְעַמְּךָ
  choice: 侵袭你、你的臣仆和你的百姓
  rationale: 介词בְּ标明灾害所临到的对象；用“侵袭”统摄并保留逐项递进的警告语势。
- source_word: וּבְבָתֶּיךָ
  choice: 并进入你的房屋
  rationale: 结合“使……侵袭”的动态语境和下句房屋被充满的结果，“进入”比机械重复“临到”更符合汉语。
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם אֶת־הֶעָרֹב
  choice: 埃及的房屋必充满虫群
  rationale: 保留“埃及的房屋”这一结构，并以“充满”表达原文所述的结果状态。
- source_word: וְגַם הָאֲדָמָה אֲשֶׁר הֵם עָלֶיהָ
  choice: 连他们所在的地面也必如此
  rationale: “连……也……”体现וְגַם的递进；“他们所在的”保留复数代词，未擅自补成“站立”或“居住”；“如此”自然承接“充满虫群”。
