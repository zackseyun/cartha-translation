base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: zh_hans
  text: 术士们也用秘术照样做，要使蠓虫[a]出现，却不能；于是蠓虫出现在人和牲畜身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虱子”。希伯来语所指的昆虫种类不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: 术士们
  rationale: 指法老宫廷中施行仪式和法术的专业人士；“术士”在现代汉语中自然、庄重，也不过度限定其具体身份。
- source_word: בְּלָטֵיהֶם
  choice: 用秘术
  rationale: 该词指隐秘的法术或秘传手段；“秘术”简洁地保留其隐秘、超常技艺的意味。
- source_word: לְהוֹצִיא
  choice: 想要使……出来
  rationale: 使役式不定词直指“使之出来”；加“想要”表达这是术士企图达成而未能达成的目的。
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: 蠓虫
  rationale: 所指昆虫种类不能确定；“蠓虫”可作为常见译法，但需用脚注保留“虱子”等可能。
- source_word: וְלֹא יָכֹלוּ
  choice: 却不能
  rationale: 直接表达他们没有能力做到，并以“却”呈现与前面尝试之间的转折。
- source_word: בָּאָדָם
  choice: 在人……身上
  rationale: אָדָם在此是集合用法，泛指人类；现代汉语单数“人”可自然表达这一集合意义，并与“牲畜”形成对应。
- source_word: וּבַבְּהֵמָה
  choice: 和牲畜身上
  rationale: בְּהֵמָה在此是集合名词，通常指家畜或大型牲畜；“牲畜”比泛称“动物”更贴合常见语义和灾害场景。
- source_word: וַתְּהִי
  choice: 仍在
  rationale: 希伯来语字面为“于是有/存在”；在术士失败的语境中，“仍在”自然传达蠓虫继续附在人和牲畜身上的状态，而不改变事件结果。
theological_decisions:
- issue: אָדָם的集合意义
  choice: 人
  alternative: 人类／世人
  rationale: 原文以单数集合名词אָדָם与בְּהֵמָה相对。汉语“人”既保留简洁的对称结构，也自然涵盖所有人，不必引入男性个体之意。
- issue: 术士失败与灾害持续之间的关系
  choice: 却不能。蠓虫仍在人和牲畜身上
  alternative: 却不能；蠓虫在人和牲畜身上
  rationale: 不为术士失败添加神学原因，只保留原文所陈述的无能与虫灾现实；“仍”仅在语篇层面说明灾害没有被其行动改变。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“照样行”贴近原文“这样做”，“却不能”简明有力；脚注明示昆虫名称的不确定性。
