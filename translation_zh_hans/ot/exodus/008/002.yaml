  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: zh_hans
  text: 亚伦便把手伸在埃及的众水之上，青蛙[a]就上来，遮盖了埃及地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作单数“那青蛙”，很可能是集合用法，指成群的青蛙。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: 伸出
  rationale: נטה在施行灾祸记号的语境中指伸展手；“伸出手来”符合现代汉语习惯，也保留了动作的权威性和具体性。
- source_word: יָדוֹ
  choice: 他的手（译文按汉语习惯省略“他的”）
  rationale: 原文明确指亚伦的手；汉语中主语已经是“亚伦”，译作“伸出手来”即可清楚表达所属关系，避免生硬重复。
- source_word: עַל
  choice: 向……伸出
  rationale: 此处表达手与埃及众水之间的空间指向。现代汉语用“向……伸出手来”比直译为“在……之上”更自然，同时保留动作朝向众水的含义。
- source_word: מֵימֵי מִצְרָיִם
  choice: 埃及的众水
  rationale: 原文为复数结构，统指埃及境内各处水域；“众水”简洁地保留复数和集合意义。
- source_word: וַתַּעַל
  choice: 便上来
  rationale: עלה描述青蛙从水域出来、登上陆地；“上来”自然地呈现这一移动，连接词译作“便”体现叙事推进。
- source_word: הַצְּפַרְדֵּעַ
  choice: 青蛙
  rationale: 希伯来文采用带定冠词的单数形式，但在本句中很可能是集合单数，指成群的青蛙。汉语“青蛙”本身不强制标明单复数，可自然保留这种形式与集合意义。
- source_word: וַתְּכַס
  choice: 遮满了
  rationale: כסה的基本意思是“遮盖”。结合青蛙遍布全地的语境，“遮满了”既保留覆盖之意，也自然表达覆盖范围之广，而不添加额外形象。
- source_word: אֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: אֶרֶץ在此指埃及的疆土或地域；“埃及地”准确、简洁，并符合庄重的圣经叙事语体。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而清晰的现代标准汉语。保留“众水”“埃及地”等凝练表达；在“他的手”处按汉语习惯省略物主代词。以脚注说明原文“青蛙”的单数形式及其可能的集合用法，不在正文中强行消除这一语言特点。
