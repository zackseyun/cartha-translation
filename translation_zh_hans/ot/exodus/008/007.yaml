  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: zh_hans
  text: 青蛙将离开你、你的房屋、你的臣仆和你的百姓，只留在尼罗河[a]里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“河里”。希伯来语 יְאֹר 可以泛指“河”，但在《出埃及记》中通常特指尼罗河。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: 将离开
  rationale: סוּר在此表示离去、退去；“离开”自然表达蛙灾从法老及其所属之处消退，又不额外暗示青蛙被消灭。
- source_word: הַצְפַרְדְּעִים
  choice: 青蛙
  rationale: 准确对应带定冠词的复数名词；汉语不必另行标示复数或定指。
- source_word: מִמְּךָ
  choice: 离开你
  rationale: 介词מִן加第二人称阳性单数后缀，直译为“从你那里”；与动词合译为“离开你”符合现代汉语表达。
- source_word: וּמִבָּתֶּיךָ
  choice: 你的房屋
  rationale: 保留希伯来语复数所指的多处住所；现代汉语“房屋”本身可作集合性表达，无须添加“各”。
- source_word: וּמֵעֲבָדֶיךָ
  choice: 你的臣仆
  rationale: עֶבֶד可指奴仆、仆役或臣属；此处对象是法老辖下的人，“臣仆”兼顾王室语境与词义宽度，避免限定为官员或奴隶。
- source_word: וּמֵעַמֶּךָ
  choice: 你的百姓
  rationale: עַם在此指法老治下的民众；“百姓”自然且符合叙事语境。
- source_word: רַק
  choice: 只
  rationale: 表达限制和例外：其他地方的青蛙离去，唯有下述地点仍有青蛙留下。
- source_word: בַּיְאֹר
  choice: 在尼罗河里
  rationale: יְאֹר虽可泛指河流，但在《出埃及记》的埃及背景中通常特指尼罗河；正文采用明确地名，并以脚注保留词汇层面的泛称可能。
- source_word: תִּשָּׁאַרְנָה
  choice: 留在
  rationale: שׁאר的尼法勒未完成式表示“留下、存留”；结合前置的地点短语，以“只留在……里”简洁保留限制性焦点。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。保留“你—你的房屋—你的臣仆—你的百姓”的递进范围，并以“只”突出尼罗河是唯一例外。脚注标记紧随“尼罗河”，与所解释的词直接对应。
