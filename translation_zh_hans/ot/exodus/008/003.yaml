  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: zh_hans
  text: 术士也用他们的秘术[a]照样做，使青蛙上到埃及地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用他们的邪术”或“用他们的法术”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 照样做
  rationale: 保留“按同样方式行”的比较含义，同时符合现代汉语习惯。
- source_word: הַחֲרְטֻמִּים
  choice: 术士
  rationale: 此词指法老宫廷中施行隐秘法术、仿效神迹的人员；“术士”简洁、庄重，也不额外断定其具体身份。
- source_word: בְּלָטֵיהֶם
  choice: 用他们的秘术
  rationale: 介词表达手段，名词含隐秘、玄奥的法术之意；“秘术”既保留其隐秘性，也避免过度限定具体做法。
- source_word: וַיַּעֲלוּ
  choice: 使……上到
  rationale: 原文为עלה的使役形，明确表达术士使青蛙上来，而非仅说“造出”青蛙。
- source_word: אֶת הַצְפַרְדְּעִים
  choice: 青蛙
  rationale: 准确传达带定冠词的复数名词；汉语在此无需另加表示定指的词。
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: 上到埃及地
  rationale: 结合使役动词保留青蛙“上来、到达埃及地”的空间意象，不额外加入“遍布”等结果含义。
theological_decisions:
- issue: 术士行为的性质
  choice: 按叙事表面直接陈述术士也使青蛙上到埃及地
  alternative: 将其处理为假象、骗局或仅仅看似成功的模仿
  rationale: 希伯来文本没有对该行为加以怀疑或解释；译文不应自行引入自然主义解释，也不应判定其能力的终极来源。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“术士”“秘术”与出埃及记宫廷语境相称；句式保留原文两个连续动作及使役关系。
