  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: zh_hans
  text: 于是，法老召来摩西和亚伦，说：“你们去，在这地向你们的上帝献祭。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们去，在境内向你们的上帝献祭。”这里指埃及境内。
    reason: 原文בָּאָרֶץ意为“在这地／在境内”；经文正文保留其未直接说出“埃及”的表达，脚注说明语境所指。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: 在本叙事语境中，קרא表示叫人前来；“召来”既自然，也比单纯“呼叫”更清楚地表达法老命人把摩西和亚伦叫到面前。
- source_word: פַרְעֹה
  choice: 法老
  rationale: 采用现代汉语中对埃及君王称号的通行译法。
- source_word: אֶל־מֹשֶׁה וּלְאַהֲרֹן
  choice: 摩西和亚伦
  rationale: 介词结构标明召唤所指向的人；汉语“召来摩西和亚伦”自然地传达这一关系。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是希伯来叙事中常见的连续动作表达；受话者已由上文明确，无须补出“对他们”。
- source_word: לְכוּ
  choice: 你们去
  rationale: 复数命令式；补出“你们”符合现代汉语对话习惯，并保留命令或许可的语气。
- source_word: זִבְחוּ
  choice: 献祭
  rationale: זבח在此指以祭牲敬拜；“献祭”是简洁、准确且通行的现代汉语宗教用语。
- source_word: לֵאלֹהֵיכֶם
  choice: 向你们的上帝
  rationale: 介词ל在此标示献祭所指向的对象；“向……献祭”符合自然汉语，也忠实表达希伯来语关系。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 原文直译为“在地上／在这片土地上”；结合语境，法老是准许他们在埃及境内献祭。“在这地”保留原文未直接说出“埃及”的表达，同时使汉语指代自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“召来”体现法老主动传唤二人；引语中的“吧”使其作为带权威的准许在汉语中自然呈现，但不削弱命令式“你们去”。保留“这地”的含蓄性，并用脚注说明其语境所指。
