  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: zh_hans
  text: 摩西说：“你看，我要离开你，并向雅威恳求。明天，虫群[a]必从法老、他的臣仆和他的百姓那里离开。只是法老不可再耍弄诡计，不肯让百姓去向雅威献祭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “虫群”所译的希伯来语词可能更具体地指成群的苍蝇或其他群集的昆虫；确切所指不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留引起对方注意的语气，同时采用自然的现代汉语表达。
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: 我要离开你
  rationale: 准确表达从法老面前离去的动作；汉语无需机械保留“从你那里出去”的结构。
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: 去向雅威恳求
  rationale: “恳求”体现 עתר 在本语境中迫切代求的意味，比泛称“祷告”更具体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质。
- source_word: וְסָר
  choice: 必离开
  rationale: 按不及物意义表达虫群自行退去；“必”也自然传达摩西对结果的明确宣告。
- source_word: הֶעָרֹב
  choice: 虫群
  rationale: 原词所指生物的确切种类不明；“虫群”保留成群侵扰的核心意义而不限定为苍蝇。
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: 离开法老、他的臣仆和他的百姓
  rationale: 完整保留灾害将从法老、臣仆及百姓那里退去的范围；汉语用一个“离开”统摄并列成分更自然。
- source_word: מָחָר
  choice: 明天
  rationale: 直接呈现原文的时间副词，不扩展为“到明天为止”。
- source_word: רַק
  choice: 只是
  rationale: 自然引出摩西附加的限制和警告。
- source_word: אַל יֹסֵף ... הָתֵל
  choice: 法老不可再耍弄诡计
  rationale: “不可再”体现 יסף 的重复意味；“耍弄诡计”兼顾 התל 所含欺骗、戏弄的语气，又避免擅自补出受骗对象。
- source_word: לְבִלְתִּי שַׁלַּח
  choice: 不肯让百姓去
  rationale: 说明法老诡诈行为的具体表现；“不肯”在现代汉语中自然表达故意拒绝放行。
- source_word: לִזְבֹּחַ
  choice: 献祭
  rationale: 保留 זבח 特指祭祀行动的含义，不泛化为一般的“敬拜”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”以专名形式呈现，并避免以“主”等称号取代。
- issue: עָרֹב 所指灾害的具体生物
  choice: 虫群
  alternative: 成群的苍蝇
  rationale: 该词的确切动物学所指存在不确定性，因此正文采用较宽泛的译法，并以脚注说明可能解释，不在正文中消除原文歧义。
- issue: הָתֵל 的语气
  choice: 耍弄诡计
  alternative: 欺骗
  rationale: 此词可涉及欺骗、戏弄或愚弄；结合此前法老反复食言的语境，译文保留其诡诈与轻慢的双重色彩，而不指定未明说的受骗对象。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“你看”保留面对面说话的直接感；“恳求”“臣仆”“献祭”符合叙事和宗教语境而不过度古雅。脚注标记紧跟其所解释的“虫群”。
