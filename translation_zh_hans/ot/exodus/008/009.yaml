  yaml_path: translation/ot/exodus/008/009.yaml
  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: zh_hans
  text: 耶和华照着摩西所说的做了；房屋、院子和田野里的青蛙都死了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式表达四字神名，同时区别于一般称谓“主”。
- source_word: כִּדְבַר מֹשֶׁה
  choice: 照摩西的话
  rationale: 保留希伯来语“按着摩西的话”的基本结构，意指上帝按摩西所说或所求而行，不额外限定其具体所指。
- source_word: וַיָּמֻתוּ הַצְפַרְדְּעִים מִן־הַבָּתִּים מִן־הַחֲצֵרֹת וּמִן־הַשָּׂדֹת
  choice: 青蛙都死了，遍及房屋、院子和田野
  rationale: 原文介词短语逐项说明青蛙死亡所涉及的地点；中文若直译为“从房屋……死了”容易被误解为青蛙离开那些地方之后才死，因此用“遍及”自然表达死亡发生在各处。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”在简体中文圣经传统中辨识度高，并明确体现原文使用的是专有神名；不借此引入宗派性解释。
- issue: “照摩西的话”所表达的行动关系
  choice: 保留为“照摩西的话做了”
  alternative: “应允了摩西的祈求”
  rationale: 原文只说耶和华照摩西的话而行；虽上下文涉及摩西呼求，译文不把原句明确化为“应允祈求”，以保留原文表述范围。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。首句保留原文简洁的叙事推进；次句避免生硬复制介词结构，同时完整保留房屋、院子、田野三个地点。
