base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你要对亚伦说：‘伸出你的杖，击打地上的尘土，尘土就会变成小虫[a]，遍满埃及全境。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虱子”。希伯来语所指的是叮咬或令人烦扰的小虫，确切种类不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留经文直接使用上帝圣名的特点。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式推进事件；现代汉语按上下文自然衔接，无须机械加入“然后”。
- source_word: אֱמֹר
  choice: 你要……说
  rationale: 准确表达对摩西发出的命令，同时使嵌套引语在现代汉语中清楚自然。
- source_word: נְטֵה
  choice: 伸出
  rationale: 表达把杖向外伸展的动作，简洁而符合现代汉语习惯。
- source_word: מַטְּךָ
  choice: 你的杖
  rationale: “杖”准确对应此处的手杖或权杖，也与出埃及记的叙事用语相称。
- source_word: וְהַךְ
  choice: 击打
  rationale: 保留 נכה 所表达的有力击打动作，语体庄重而不古奥。
- source_word: עֲפַר הָאָרֶץ
  choice: 地上的尘土
  rationale: 自然表达“土地／地面的尘土”，并保留尘土本身发生变化的叙事重点。
- source_word: וְהָיָה לְכִנִּם
  choice: 尘土就会……变成蚋虫
  rationale: 上下文表明主语是尘土；“变成”清楚表达结果。“蚋虫”可指细小、叮咬或扰人的虫类，同时以脚注保留物种不确定性。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 在埃及全境
  rationale: 简洁、自然地表达灾害遍及埃及全地。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较公认的读音音译，避免以称号替换神名，也不采用源自较晚传统元音组合的“耶和华”。
- issue: 灾虫 כִּנִּים 的具体种类
  choice: 蚋虫，并注明不确定性
  alternative: 虱子
  rationale: 希伯来词所指的确切虫种无法确定。正文选用可表示细小扰人虫类的“蚋虫”，脚注同时列出传统译法，不把词义争议作教义化或过度确定的处理。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。嵌套引语层次清楚；避免古语式“伸杖击尘”，也不添加原文没有的解释。脚注标记紧随有词义争议的“蚋虫”，而不是置于“摩西”之后。
