  terminology: “雅威”“摩西”“亚伦”“杖”“尘土”等译语恰当。“小虫”在此作为涵盖性译法，避免将有争议的כִּנִּים固定为“蚋”或“虱子”；脚注保留“虱子”这一传统译法及词义的不确定性。
