source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: zh_hans
  text: 术士们对法老说：“这是神的指头[a]。”可是法老的心刚硬[b]，不听他们的话，正如雅威[c]所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神的指头”是形象说法，表示神亲自施展的能力。
    reason: cultural_note
  - marker: b
    text: 也可译作“法老的心变得强硬”。原文在本句中没有明确说明是谁使他的心刚硬。
    reason: lexical_alternative
  - marker: c
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译；传统上常译作“耶和华”或“主”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: 术士们
  rationale: 指法老手下从事宗教仪式和秘术的人。“术士”简洁自然，也不额外限定其宫廷身份。
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: 这是神的指头
  rationale: 保留希伯来语无系词名词句的表达及“神的指头”这一形象，指神直接施展的能力；中文加“是”使句子自然。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 该词虽在其他语境中可指“神明”或“众神”，这里最自然地指以色列的神，采用单数“神”。
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: 法老的心刚硬
  rationale: חזק在此表示心变得强硬、顽固；原文没有明说使其刚硬的行动者，因此不用“神使……刚硬”或“法老使自己的心刚硬”。
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: 不听他们的话
  rationale: שׁמע与אֶל连用可表示听从、理会；“不听他们的话”符合现代汉语，也保留“听”与“听从”之间的语义幅度。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: 正如雅威所说的
  rationale: 该叙事公式回指雅威先前的宣告；“正如……所说的”在现代中文中自然，并保留对应关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，将其作为专名保留，而不以“主”这一称号替代。
theological_decisions:
- issue: 法老之心刚硬的行动者
  choice: 法老的心刚硬
  alternative: 法老使自己的心刚硬／法老的心被使得刚硬
  rationale: 希伯来语本句没有明确指出刚硬的行动者；采用不明说行动者的中文表达，以保留原文的神学张力。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用神的专名；“雅威”较直接地按其通常拟音呈现，不把专名改成称号。
- issue: “神的指头”的理解
  choice: 正文保留字面形象，脚注说明其含义
  alternative: 这是神亲自施展的能力
  rationale: 原文的隐喻具有鲜明的叙事和神学作用；直译可保留意象，脚注则帮助普通读者理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“术士”“刚硬”等词延续出埃及记叙事所需的宗教与伦理语域；句式简洁，适合普通读者朗读。所有解释性内容置于脚注，正文保留原文意象、神名以及刚硬行动者未明的张力。
