base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你要对亚伦说：‘把你拿着杖的手伸到河流、河渠[a]和池塘上方，使青蛙上到埃及地上。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河渠”或译“尼罗河的水道”；这个希伯来词在埃及语境中常指与尼罗河有关的水道。
    reason: 保留该词一般译作河渠与其埃及语境中特指尼罗河水系之间的词义选择。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现上帝的专名，不用称号替代原文的四字神名。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来叙事中的连续式推动情节；现代汉语无需机械译出“于是”，上下文已能自然表达叙事推进。
- source_word: אֱמֹר
  choice: 你要……说
  rationale: 明确表达对摩西的命令，同时自然引出对亚伦所说的直接引语。
- source_word: נְטֵה אֶת יָדְךָ בְּמַטֶּךָ
  choice: 把你拿杖的手伸向
  rationale: 保留“手”和“杖”两个具体意象，并以自然汉语表达杖作为施行动作时所用之物。
- source_word: הַנְּהָרֹת
  choice: 河流
  rationale: 采用该词的一般含义，并与后面的河渠、池塘构成原文的三项水域并列。
- source_word: הַיְאֹרִים
  choice: 河渠
  rationale: 该词在出埃及记的埃及语境中常指尼罗河及相关水道；复数“河渠”简洁自然，也与“河流”有别。
- source_word: הָאֲגַמִּים
  choice: 池塘
  rationale: 表达汇集起来的水域，与河流和河渠相区别；比“沼泽”更符合此处水域列举的语境。
- source_word: וְהַעַל
  choice: 使……爬上
  rationale: 保留עלה使役形的使动意义和“上来”的方向感；对青蛙而言，“爬上”是自然、具体的汉语表达。
- source_word: הַצְפַרְדְּעִים
  choice: 青蛙
  rationale: 该灾害动物在现代汉语中的直接对应词。
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: 爬上埃及地
  rationale: 保留介词所表达的临到、覆盖地面的图景，且不扩译为“遍满”，以免加入原文未明说的范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；“雅威”较贴近学界通常重构的读音，也避免用“主”等称号替代专名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。直接引语层次清楚；“把你拿杖的手伸向”避免生硬直译，同时保留手、杖和朝向水域的动作。“使青蛙爬上”保留原文使役形式及向上的空间意象。
