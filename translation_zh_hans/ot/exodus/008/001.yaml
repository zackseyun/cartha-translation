  naturalness: “把你拿杖的手”稍显口语且修饰关系不够顺畅；改为“把你拿着杖的手伸到……上方”自然清楚。 “使青蛙上到埃及地上”庄重、通顺，并保留原文的使役和向上／临到陆地的意象。
  terminology: “雅威”“摩西”“亚伦”“河流、河渠、池塘”“埃及地”均适当。“河渠”所附的尼罗河水道说明准确，且不把原文的词义可能性写死。
