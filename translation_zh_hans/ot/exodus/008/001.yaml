  to: 雅威对摩西说：“你要对亚伦说：‘把你拿着杖的手伸到河流、河渠[a]和池塘上方，使青蛙上到埃及地上。’”
  rationale: 修订仅调整两个表达：以“上方”对应原文反复出现的空间介词；以“上到”替代“爬上”，避免将未明说的移动方式加入译文。其余译法和脚注均可保留。
