revisions:
- from: 于是，摩西和亚伦离开法老；摩西就为他加给法老[a]的那些青蛙，向耶和华呼求。
  to: 于是，摩西和亚伦离开法老；摩西为那使法老遭受的青蛙，向雅威呼求。
  rationale: 修订神名以对应 יהוה 的专名译法，并消除汉语代词可能造成的错误指代。“使法老遭受的”自然表达蛙灾临到法老，同时不把原文在本句未明说的主语直接写成名词。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:25:39Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的叙事顺序、离开法老、摩西向神强烈呼求及青蛙灾祸均已译出。然而“他加给法老的那些青蛙”中的“他”在汉语句内缺乏明确先行词，容易被误解为摩西或亚伦；且“加给青蛙”搭配不够自然。神名宜按本项目对 יהוה 的专名译法译为“雅威”，而非传统形式“耶和华”。
  naturalness: “于是……；摩西就为……”虽可理解，但分号后的语序略显滞涩。“摩西为……向雅威呼求”更顺畅。以“使法老遭受的”表达灾祸语境下的“置于/加于”自然，但不将原文未重述的施事者硬性写明。
  terminology: 将 יהוה 译为“雅威”，对应原文专名及英文审校轨迹的 Yahweh。保留“呼求”以体现 צעק 的迫切呼喊；“青蛙”准确。
  issues:
  - severity: medium
    issue: 神名译作“耶和华”
    rationale: 原文为 יהוה，英文审校轨迹及项目既定译名采用 Yahweh；中文应以“雅威”对应这一专名译法。
  - severity: medium
    issue: “他加给法老的那些青蛙”指代与搭配不清
    rationale: 希伯来文的第三人称主语在上下文中最可能指雅威，但汉语“他”没有就近先行词，可能误指摩西或亚伦；“加给法老的青蛙”亦不如灾祸语境中的表达自然。
  revised_text: 于是，摩西和亚伦离开法老；摩西为那使法老遭受的青蛙，向雅威呼求。
  revised_footnotes:
