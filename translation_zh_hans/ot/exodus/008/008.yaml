    text: 原文直译为“他放置给法老的青蛙”。动词可指“放、置、加于”；在此蛙灾语境中，译作“使法老遭受的”较合汉语。原文未在本句明说施事者，按上下文最自然地指雅威。
    reason: 说明 שׂים 的字面义、灾祸语境中的译法，以及未明说的动词主语。
  revision_rationale: 修订神名以对应 יהוה 的专名译法，并消除汉语代词可能造成的错误指代。“使法老遭受的”自然表达蛙灾临到法老，同时不把原文在本句未明说的主语直接写成名词。
