base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: zh_hans
  text: 于是，摩西和亚伦离开法老；摩西为那使法老遭受的青蛙，向雅威呼求。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 离开
  rationale: יצא在此叙述摩西和亚伦从法老面前出去；“离开法老”简洁自然，并保留离去的方向感。
- source_word: מֵעִם
  choice: 离开法老
  rationale: מֵעִם表示从某人身边或面前离开。汉语无需直译为“从法老面前出去”，“离开法老”已能自然表达其意。
- source_word: וַיִּצְעַק
  choice: 呼求
  rationale: צעק表示带有强烈恳求意味的呼喊；“呼求”既保留强度，也符合向上帝祈求的语境，避免弱化为一般的“祷告”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语读者熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号代替。
- source_word: עַל דְּבַר
  choice: 为……
  rationale: 该短语在此指摩西因青蛙之灾而向耶和华呼求。“为……呼求”是自然汉语，也保留“有关／因为”的语义范围。
- source_word: הַצְפַרְדְּעִים
  choice: 那些青蛙
  rationale: 复数定冠词名词指本次灾祸中的青蛙；“那些”在汉语中自然地回指已经出现的蛙灾。
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: 他加给法老的
  rationale: שׂים本义为“放、置、加”，在灾祸语境中译作“加给”较自然，又比“降给”更贴近原词。“他”保留希伯来语未明说主语的表达；上下文最自然地指耶和华。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。译为“耶和华”保留其专名性质，也采用现代简体中文圣经语境中最广为人知的形式，而不以称号“主”代替。
- issue: אֲשֶׁר שָׂם לְפַרְעֹה 中 שָׂם 的主语
  choice: 以“他”保留指代，由上下文理解为耶和华
  alternative: 明译为“耶和华加给法老的”；省略主语
  rationale: 希伯来语动词为第三人称阳性单数，但本句没有重新明说主语。上下文最自然地指耶和华；保留“他”既让句子通顺，又不把上下文推断写成原文明确重复的名词。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接叙事，“呼求”保留动作的迫切感。分号呈现两个连续动作，避免句子层次含混；不使用文言色彩较重的表达。
