  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: zh_hans
  text: 于是，法老召来摩西和亚伦，说：“你们要恳求[a]雅威，把青蛙从我和我的人民中除去；我就让百姓离去，好让他们向雅威献祭[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恳求”也可译作“迫切祈求”或“代求”；原文这个动词的语气比一般的祷告更为急切。
    reason: 说明原文动词 עתר 的语义力度及可译选择。
  - marker: b
    text: 或译：“我就让百姓离去，他们向雅威献祭。”原文也可理解为简单并列，不过在这里很可能说明法老放行百姓的目的。
    reason: 保留 וְיִזְבְּחוּ 在目的关系与简单并列之间的句法可能性。
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: 召来摩西和亚伦
  rationale: קרא 与 לְ 加人物可表示召唤某人前来；“召来”在现代汉语中自然地表达法老命人把二人叫到面前。
- source_word: הַעְתִּירוּ
  choice: 恳求
  rationale: עתר 的使役式在祷告语境中有迫切祈求、代求之意；“恳求”比一般的“祷告”更能保留其强烈语气。
- source_word: אֶל יְהוָה
  choice: 向雅威
  rationale: 介词 אֶל 表示祈求所指向的对象；神名 יהוה 采用“雅威”，保留专名性质。
- source_word: וְיָסֵר
  choice: 请他使……离开
  rationale: סור 的使役式意为移除、使离开；接在命令式请求之后，这一未完成式表达所求的内容。“请他”使中文关系清楚，同时不把希伯来语形式机械处理为并列。
- source_word: הַצְפַרְדְּעִים
  choice: 青蛙
  rationale: צְפַרְדֵּעַ 指青蛙；此处为带定冠词的复数，中文按类别统称自然译作“青蛙”。
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: 离开我和我的人民
  rationale: 重复的 מִן 标明灾害要从法老本人及其人民那里除去；中文共用“离开”即可自然涵盖两者。
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: 我就让这百姓离去
  rationale: שלח 在出埃及叙事中常指容许被扣留的百姓离开；带 ה 的意愿式表达法老所声称的承诺或意向。“这百姓”对应有定的 הָעָם，并承接语境中的以色列民。
- source_word: וְיִזְבְּחוּ
  choice: 使他们可以……献祭
  rationale: זבח 指宰献祭牲、献祭。此未完成式可与前句构成目的或结果关系；正文采用合乎汉语的目的表达，同时以脚注保留并列读法。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: לְ 在献祭语境中标明献祭的对象；神名仍译为“雅威”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为现代汉语中对 Yahweh 的常见音译，保留其作为盟约神名的性质，不以称号取代专名。
- issue: וְיִזְבְּחוּ 与前句的关系
  choice: 目的：使他们可以向雅威献祭
  alternative: 简单并列：他们就可以／并且他们要向雅威献祭
  rationale: 法老“让百姓离去”的意愿式之后接未完成式，语境上自然表示放行的目的；但连接词 וְ 本身也容许较直接的并列理解，因此不将另一可能完全排除，并在脚注说明。
- issue: 法老请求摩西、亚伦祈求的力度
  choice: 恳求
  alternative: 祷告；代求
  rationale: עתר 在此不只是泛指祷告，而含迫切求告意味；“恳求”保留力度，但不额外断定二人正式承担某种神学意义上的中保职分。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“召来”“恳求”“献祭”保持叙事与宗教语域的尊严；避免文言式“遂”“俾”等表达。两个脚注标记均已在正文对应位置出现。
