  source_fidelity: 译文准确传达了法老察觉压力暂时缓解、主动使自己顽梗、不肯听从摩西和亚伦，以及这应验雅威先前所说之话的意思。将“见有了缓解”调整为“看见情势已有缓解”，使汉语表达更自然，且不改变原文的概括性。
  naturalness: “法老见有了缓解”在现代汉语中略显生硬；“法老看见情势已有缓解”较为通顺、庄重。“正如雅威所说”也比“正如雅威所说的”更适合书面经文句末。
  terminology: “雅威”一致呈现四字神名；“硬起心来”自然表达“使自己的心刚硬”的主动顽梗，未引入本节没有明说的神圣施事。“不听他们的话”在汉语中自然表达不听从他们，同时仍保留原文“听/理会”的语义范围。
