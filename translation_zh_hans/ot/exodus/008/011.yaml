  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽ/רְוָחָ֔ה וְ/הַכְבֵּד֙ אֶת לִבּ֔/וֹ וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: zh_hans
  text: 但法老看见情势已有缓解[a]，就硬起心来，不听他们的话，正如雅威所说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有了喘息的机会”。希伯来语可指缓解、宽舒或暂得喘息。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 见
  rationale: 保留“看见”的希伯来语表达；在本语境中自然含有察觉局势已经改变之意。
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: 有了缓解
  rationale: הָרְוָחָה可指压力减轻、暂得喘息或宽缓；“有了缓解”简洁自然，也符合灾情暂时解除的语境。
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: 就硬起心来
  rationale: 原文以法老为主动施事者，字面意象是“使自己的心沉重”；“硬起心来”既传达顽梗之意，也明确保留本节所表达的法老自身责任。
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: 不听他们
  rationale: שׁמע与אֶל连用可指听从或理会；“不听他们”保持原文的宽度，不把意思过度限定为“不服从”。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: 正如雅威所说的
  rationale: 该短语表明先前神的话得到应验；现代汉语无需另用时态标记，也能由语境清楚表达先后关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的中文音译呈现神的专名，不以称号替代。
theological_decisions:
- issue: 法老心刚硬的施事者
  choice: 译为法老主动“硬起心来”
  alternative: 译成“他的心变得刚硬”，或在本节中暗示是神使他的心刚硬
  rationale: 原文采用主动使役形式，并以法老为主语，因此本节将这一行动归于法老自己。这样也不消解《出埃及记》其他经文所表达的神使法老心刚硬这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“硬起心来”比直译“使自己的心沉重”更自然，同时保留法老主动使自己顽梗的语义；正文中的[a]与脚注标记一致。
