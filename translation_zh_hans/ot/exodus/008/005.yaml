  to: 摩西对法老说：“请你定个时间[a]：要我何时为你、你的臣仆和你的百姓祈求，使青蛙从你和你的房屋中除尽？它们只留在尼罗河里。”
  rationale: 修订仅处理难解习语的错误介词方向和由此造成的不自然、误导性汉语。将语境所指的“定个时间”置于正文，脚注说明字面“在我之上得荣耀／夸耀”及其不确定性，既不掩盖原文难处，也不把不通顺或误导的直译强加给正文。其余译文保持原有含义与范围。
