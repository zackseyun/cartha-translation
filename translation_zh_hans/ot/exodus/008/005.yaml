base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: zh_hans
  text: 摩西对法老说：“请你定个时间[a]：要我何时为你、你的臣仆和你的百姓祈求，使青蛙从你和你的房屋中除尽？它们只留在尼罗河里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请你胜过我而得荣耀。”希伯来语这个习语含义不易确定，字面带有“在我之上得荣耀／夸耀”的意思；按上下文，摩西是在请法老指定他应当何时祈求。
    reason: 以正文表达上下文明确的交际含义，同时保留 הִתְפָּאֵר עָלַי 的困难字面意义及另一种可能译法。
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: 请你在我面前夸口
  rationale: 该短语是含义不易确定的习语。所用动词带有夸耀、取得荣耀之意；上下文则表明，摩西请法老占先选择代求的时间。正文保留其“夸耀”的字面张力，脚注说明语境中的实际用意，避免把歧义悄然消解。
- source_word: לְמָתַי
  choice: 在什么时候
  rationale: 直接表达法老可以指定摩西祈求的时间，符合疑问结构，也适合现代汉语。
- source_word: אַעְתִּיר
  choice: 祈求
  rationale: 该词在此指向上帝恳切求告。译作“祈求”自然清楚，又不采用较具技术色彩的“代求”。
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: 为你、你的臣仆和你的百姓
  rationale: 保留三个受益对象及其并列层次；“臣仆”符合王宫语境。
- source_word: לְהַכְרִית
  choice: 除尽
  rationale: 原词本义为“剪除、断绝”，此处指把青蛙从人及房屋所在之处彻底清除。“除尽”既保留彻底性，又比“断绝青蛙”更合乎现代汉语。
- source_word: הַצֲפַרְדְּעִים
  choice: 青蛙
  rationale: 对灾害动物的直接对应翻译。
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: 从你和你的房屋中
  rationale: 分别保留法老本人及其房屋这两个范围，不将“房屋”限定解释为宫殿或家属。
- source_word: רַק
  choice: 只
  rationale: 标明唯一例外：青蛙将从其他地方除去，却仍留在尼罗河中。
- source_word: בַּיְאֹר
  choice: 在尼罗河里
  rationale: יְאֹר在《出埃及记》的埃及背景中专指尼罗河；明确译出河名比泛称“河”更准确。
- source_word: תִּשָּׁאַרְנָה
  choice: 它们只会留在
  rationale: 表达尼法勒式所含的“留下、存留”意义，并以自然汉语承接前句。
