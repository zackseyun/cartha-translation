  text: וַ/יֵּצֵ֥א מֹשֶׁ֖ה מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: zh_hans
  text: 于是，摩西离开法老，向雅威恳切祈求[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“恳求雅威”。原文动词含有迫切求告、恳切祈求的意思。
    reason: 词义有“祈求”与“恳求”的表达空间，脚注保留其语义力度及可行译法。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 离开
  rationale: 这是יצא的Qal叙事形式，表示摩西从法老那里出去；现代汉语用“离开”自然、简明，并保留事件的先后推进。
- source_word: מֵעִם פַּרְעֹה
  choice: 离开法老
  rationale: מֵעִם表示从某人身边或其所在之处离去；汉语“离开法老”已自然包含离开法老面前的意思。
- source_word: וַיֶּעְתַּר
  choice: 恳切祈求
  rationale: עתר在这里指迫切、诚恳地向神求告，不只是泛指祷告；“恳切祈求”兼顾祷告对象与恳求的强度。
- source_word: אֶל
  choice: 向
  rationale: 该介词标明祈求所指向的对象；“向雅威”符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用四字神名יהוה，而非一般称号；采用常见的现代汉语音译“雅威”，保留其专名性质。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的专名。译作“雅威”保留专名性质，也避免以称号替代原文；“耶和华”是传统音译，“上主”则反映诵读替代传统。
- issue: עתר所表达的祷告强度
  choice: 恳切祈求
  alternative: 祷告；恳求
  rationale: 该动词在此带有迫切求告、代求的意味；“恳切祈求”保留这种力度，但不额外说明祈求的具体内容或结果。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接叙事次序；句式简洁，适合普通读者朗读和理解。
