  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: zh_hans
  text: 我要在我的百姓和你的百姓之间作出区别[a]。明天，这个记号就会出现。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“救赎”或“解救”。希伯来语这个词可指上帝的救赎行动；在这里，这行动表现为他将以色列人与埃及人区别开来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: 我要……作出
  rationale: שׂים本义为“放置、设立”；与抽象名词及“在……之间”连用时，译作“作出”符合现代汉语习惯，也保留了上帝主动施行的含义。
- source_word: פְדֻת
  choice: 分别
  rationale: 该词可指“救赎、解救”，但在“我的百姓和你的百姓之间”这一句法结构及灾祸叙事中，直接表达的是上帝区别对待双方。“分别”自然地呈现这一语境意义，同时以脚注保留其救赎含义。
- source_word: בֵּין ... וּבֵין
  choice: 在……和……之间
  rationale: 准确表达希伯来语用于区分两方的对应介词结构。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 直接表达第一人称所属关系；此处指属于上帝的以色列人。
- source_word: עַמֶּךָ
  choice: 你的百姓
  rationale: 直接表达第二人称阳性单数所属关系；受话者是法老，所指为埃及人。
- source_word: לְמָחָר
  choice: 明天
  rationale: 该时间词意为“明天”；置于句首符合原文次序，也自然突出应验的时间。
- source_word: יִהְיֶה
  choice: 必会发生
  rationale: 动词字面为“将是、将有”；以“这个神迹”为主语时，“必会发生”是自然的现代汉语，并表达预告之事确定将在未来出现。
- source_word: הָאֹת הַזֶּה
  choice: 这个神迹
  rationale: אוֹת指具有指示或证实作用的“记号、征兆”。在出埃及记的灾祸语境中，“神迹”清楚表达这是上帝所施行并具有标志意义的作为。
theological_decisions:
- issue: פְדֻת应译出较直接的救赎含义，还是译出本句中区分双方的语境含义
  choice: 正文译作“分别”
  alternative: “救赎”或“解救”
  rationale: 本句说上帝要在自己的百姓与法老的百姓之间施行不同的对待，因此“分别”最直接地呈现上下文中的结果。不过，该名词本身可承载“救赎、解救”的意义，暗示这种分别是上帝拯救性的作为，故在脚注中保留这一真实的词义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“作出分别”避免生硬直译为“放置分别”；“必会发生”比“必是”更符合现代汉语，同时保留预告的确定性。
