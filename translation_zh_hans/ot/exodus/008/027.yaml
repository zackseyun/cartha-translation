  text: וַ/יַּ֤עַשׂ יְהוָה֙ כִּ/דְבַ֣ר מֹשֶׁ֔ה וַ/יָּ֨סַר֙ הֶ/עָרֹ֔ב מִ/פַּרְעֹ֖ה מֵ/עֲבָדָ֣י/ו וּ/מֵ/עַמּ֑/וֹ לֹ֥א נִשְׁאַ֖ר אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: zh_hans
  text: 耶和华照摩西的话做了，把虫群[a]从法老、他的臣仆和他的百姓那里除去；一个也没有留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成群的飞虫”或“苍蝇群”。希伯来语 עָרֹב 指这场成群侵袭的虫灾，但这个词本身没有说明具体是哪一种虫。
    reason: 保留原词在虫种上的不确定性，同时说明传统上较具体的理解。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中通行的专名“耶和华”译出四字神名，不以称号替代。
- source_word: וַיַּעַשׂ יְהוָה כִּדְבַר מֹשֶׁה
  choice: 耶和华照摩西的话做了
  rationale: 直译“照摩西的话做”，既保留 עשה 的宽泛含义，也自然表达耶和华按摩西所说而行。
- source_word: וַיָּסַר
  choice: 使……离开
  rationale: 此处为 סור 的使役形，表示使灾群从相关对象那里除去；“使……离开”符合中文表达并保留使役关系。
- source_word: הֶעָרֹב
  choice: 成群的飞虫
  rationale: עָרֹב 指这场群聚虫灾，但词本身未明确具体虫种；正文用概括性表达，避免指定为苍蝇。
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: 离开法老、他的臣仆和他的百姓
  rationale: 用一个“离开”统摄并列的三个对象，中文自然，同时完整保留灾害从三个范围被除去的意思。
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: 一只也没有留下
  rationale: 保留 אֶחָד 的单数强调；因所指为飞虫，量词采用“一只”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神名；“耶和华”是现代中文圣经语境中最广为人知、可直接作为专名理解的译法，同时不以“主”等称号替代。
- issue: עָרֹב 所指的具体虫类
  choice: 成群的飞虫
  alternative: 苍蝇群
  rationale: 希伯来词表示成群侵袭之物，在本段语境中通常理解为飞虫，但并不明确限定为苍蝇；因此不把传统解释写成唯一所指。
translation_notes:
  register: 采用自然、庄重且易懂的现代标准汉语。“臣仆”承接法老宫廷语境；末句以“一只也没有留下”再现原文的强烈否定。
