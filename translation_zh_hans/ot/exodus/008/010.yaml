  yaml_path: translation/ot/exodus/008/010.yaml
  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: zh_hans
  text: 他们把青蛙堆成一堆又一堆[a]，遍地都发臭了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“堆成许多堆”或“堆了一堆又一堆”；希伯来文重复“堆”一词，以加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: 堆成
  rationale: צבר表示把东西聚拢成堆；“堆成”既具体又符合现代汉语表达。
- source_word: אֹתָם
  choice: 青蛙
  rationale: 原文为阳性复数宾语代词“它们”，承接上文的青蛙；汉语明说“青蛙”可避免代词指向不清。
- source_word: חֳמָרִם חֳמָרִם
  choice: 一堆又一堆
  rationale: 原文重复“堆”，具有分配和强调作用；“一堆又一堆”自然地保留了多堆且数量众多的语气。
- source_word: וַתִּבְאַשׁ
  choice: 发臭了
  rationale: באש指散发恶臭；“发臭了”直接、鲜明，也自然体现叙事中出现的结果状态。
- source_word: הָאָרֶץ
  choice: 遍地
  rationale: 此处指灾区之地，而非整个世界；“遍地都发臭了”是自然汉语，并表达臭味弥漫当地的结果。
theological_decisions: []
translation_notes:
  register: 采用现代、简明而庄重的叙事语体。“一堆又一堆”保留原文名词重复的强调效果；“遍地都发臭了”符合普通现代汉语，但不把“地”扩大解释为全世界。
