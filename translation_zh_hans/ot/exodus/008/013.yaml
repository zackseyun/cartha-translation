base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: zh_hans
  text: 他们就这样做了。亚伦拿着杖伸出手，击打地上的尘土；蚋虫[a]就出现在人[b]和牲畜身上。埃及全境的尘土都变成了蚋虫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“虱子”。希伯来语所指的具体虫类不能确定。
    reason: lexical_alternative
  - marker: b
    text: 这里的“人”是集合用法，泛指人类，并非专指男性。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 他们就这样做了
  rationale: 保留希伯来叙事中表示照先前吩咐而行的惯用语，同时符合现代汉语表达。
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: 亚伦手里拿着杖，伸出手来
  rationale: נטה יָד 表示伸手；介词短语 בְמַטֵּהוּ 可表示伴随或工具。译文自然呈现亚伦伸手时带着杖，又不过度断定具体动作姿势。
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: 击打地上的尘土
  rationale: נכה 在此是击打；עֲפַר 指尘土或松散土壤。此译保留灾祸叙事中尘土的意象。
- source_word: הַכִּנָּם / כִנִּים
  choice: 蚋虫
  rationale: 该希伯来词所指虫类无法精确确定，常被理解为蚋虫或虱子。正文采用“蚋虫”，既能表达微小群聚虫类，也以脚注保留另一传统理解。
- source_word: וַתְּהִי הַכִּנָּם בָּאָדָם וּבַבְּהֵמָה
  choice: 蚋虫就出现在人和牲畜身上
  rationale: 原文直译近于“蚋虫就在人和牲畜上”。“出现在……身上”自然表达虫灾临到而不增加叮咬等原文未明说的细节；בְּהֵמָה 在本语境中指牲畜。
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: 地上所有的尘土都变成了蚋虫
  rationale: “所有”保留 כָּל 的整体范围，“变成”自然表达 הָיָה 在此的结果意义。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 埃及全境
  rationale: 简洁传达该短语遍及埃及全地的范围。
theological_decisions:
- issue: אָדָם 的集合含义
  choice: 人
  alternative: 人类；人们
  rationale: אָדָם 在这里与牲畜相对，是集合用法，涵盖所有人，并非专指成年男性。“人”在现代汉语中既贴近原文又能自然表达这一广义，脚注说明其范围。
- issue: 虫类的精确鉴定
  choice: 蚋虫
  alternative: 虱子
  rationale: כִּנִּים 的动物学所指存在真实的词义不确定性；正文不把某一种鉴定表述为毫无疑义，并以脚注保留传统备选译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“手里拿着杖，伸出手来”避免生硬直译介词结构；“埃及全境”简明呈现遍及全地的范围。两个脚注分别保留虫类鉴定的不确定性，并澄清“人”的集合含义。
