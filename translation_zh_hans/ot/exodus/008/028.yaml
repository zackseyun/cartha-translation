base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: zh_hans
  text: 可是，法老这一次又硬了心，仍不让百姓离开。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“使自己的心沉重”。这个说法表示法老变得顽梗、迟钝，不肯回应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: 硬着
  rationale: כבד的使役形字面涉及“使沉重”；与“心”搭配时表示使自己顽梗、迟钝而不肯回应。现代汉语“硬着心”既自然，又保留法老主动抗拒的含义。
- source_word: לִבּוֹ
  choice: 自己的心（译文依汉语表达作“心”）
  rationale: 希伯来语“心”是意志和性情的中心。主语“法老”已明确，汉语“法老硬着心”自然表达其作用于自己的心，无须重复“自己的”。
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: 这一次……还是
  rationale: גַּם表示这一回与先前情形相同；“这一次……还是”符合现代汉语语序，并清楚传达“又一次”的附加意义。
- source_word: וְלֹא שִׁלַּח
  choice: 不让……离开
  rationale: שלח在出埃及叙事中指准许并释放百姓离去。“不让……离开”比生硬的“没有差遣”更准确自然。
- source_word: הָעָם
  choice: 百姓
  rationale: 定冠词单数集合名词，语境中指以色列民；“百姓”是庄重而通俗的中文对应。
- source_word: וַ
  choice: 可是
  rationale: 叙事连接词本可译“于是/并且”，但此处法老在灾情缓解后反而再次顽梗，使用“可是”自然显出语篇中的转折。
theological_decisions:
- issue: 法老刚硬的行动主体
  choice: 法老还是硬着心
  alternative: 法老的心变得刚硬；法老使自己的心沉重
  rationale: 希伯来语使役动词以法老为明确主语，表明本节中法老是行动者。译文不把它弱化成单纯的状态变化，也不借此消解出埃及记其他经文所说上帝使法老的心刚硬而形成的叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“硬着心”在中文里自然表达主动的顽梗；脚注补出“使心沉重”的希伯来语意象。
