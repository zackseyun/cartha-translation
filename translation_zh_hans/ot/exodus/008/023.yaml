base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: zh_hans
  text: 我们要走三天的路程[a]，进入旷野，向雅威——我们的上帝——献祭，正如他所吩咐我们的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“三天的路程”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“正如他将要吩咐我们的。”
    reason: grammatical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 走三天的路程
  rationale: דֶּרֶךְ与时间量词连用，表示走相应时日的路程；此译自然，并保留行程与距离的含义。
- source_word: נֵלֵךְ
  choice: 我们要……去
  rationale: Qal未完成式第一人称复数在这里表达将要采取的行动；“要……去”不额外加入请求或义务语气。
- source_word: בַּמִּדְבָּר
  choice: 往旷野去
  rationale: מִדְבָּר通常指人烟稀少的旷野或荒野，不限于沙漠；结合הלך的移动语境，用“往……去”表达方向。
- source_word: וְזָבַחְנוּ
  choice: 向他献祭
  rationale: זבח指宰杀并献上祭牲；“献祭”简洁保留礼仪含义，代词“他”使现代汉语句子自然，并明确承接雅威。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 将四字神名יהוה音译为“雅威”，保留其作为上帝圣约之名的性质；介词ל在献祭语境中译为“向”。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 准确表达带第一人称复数后缀的“我们的上帝”。
- source_word: כַּאֲשֶׁר
  choice: 照
  rationale: כַּאֲשֶׁר在此表示行动符合上帝的指示；“照”简洁自然地传达依从关系。
- source_word: יֹאמַר אֵלֵינוּ
  choice: 所吩咐我们的
  rationale: 未完成式可按语境理解为上帝将作出的指示，也可宽泛表达其吩咐；正文用自然的“吩咐”，不强行凸显时态，脚注保留未来解读。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较接近学界通行重构读音Yahweh的“雅威”，而不以称号代替专名。
- issue: 献祭方式与上帝指示的时间关系
  choice: 照雅威……所吩咐我们的
  alternative: 照雅威……将要吩咐我们的
  rationale: יֹאמַר是未完成式，既可在此表达预期的未来吩咐，也可在从属结构中概括上帝的指示。正文保持汉语自然，脚注说明未来译法，以保留语法张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“旷野”“献祭”保留经文所需的地理与礼仪语域；避免古奥虚词。神名用“雅威”，并保持“我们的上帝”所表达的群体归属关系。
