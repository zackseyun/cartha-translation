revisions:
- from: 我们要往旷野去，走三天的路程[a]，照雅威我们的上帝所吩咐我们的[b]，向他献祭。
  to: 我们要走三天的路程[a]，进入旷野，向雅威——我们的上帝——献祭，正如他所吩咐我们的[b]。
  rationale: 调整语序，使“向雅威——我们的上帝——献祭”直接对应וְזָבַחְנוּ לַיהוָה אֱלֹהֵינוּ；将כַּאֲשֶׁר יֹאמַר אֵלֵינוּ译为后置的“正如他所吩咐我们的”，并以脚注保留未完成式可理解为将来吩咐的可能性。
