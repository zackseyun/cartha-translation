base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: zh_hans
  text: 耶和华对摩西说：“清早起来，站在法老面前。看哪，他要到水边去。你要对他说：‘耶和华如此说：放我的子民走，好让他们侍奉我。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: 明天清早起来
  rationale: 该短语是及早行动的惯用表达；结合叙事情境，用“明天清早起来”自然传达次日一早奉命行动之意。
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: 站在法老面前
  rationale: 保留动词“站立、就位”及介词“在……面前”的直接含义，体现摩西公开面对法老。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文提示听者注意的语气，同时采用现代读者仍能理解的庄重表达。
- source_word: שַׁלַּח
  choice: 放……走
  rationale: 准确表达命令式所要求的释放和准许离开。
- source_word: וְיַעַבְדֻנִי
  choice: 好让他们侍奉我
  rationale: עבד在此可涵盖服事与敬拜；“侍奉”保留其较宽语义，并符合出埃及记中归属与敬拜的语境。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确体现原文使用的是神的专名，而非普通称谓；不借此引入额外的宗派解释。
- issue: עבד 的宗教与服役双重含义
  choice: 侍奉
  alternative: 敬拜／服事
  rationale: “侍奉”既可指归属之下的服事，也可包含宗教敬拜，较好保存本段中脱离法老辖制而侍奉耶和华的张力。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准普通话。保留“耶和华如此说”这一先知宣告格式，并以“看哪”再现原文的注意提示语。
