  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: zh_hans
  text: 但到那一天，我要把我百姓居住的歌珊地分别出来，使那里没有虫群[a]，好让你知道：我——雅威——在这地之中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“成群的飞虫”。希伯来语所指的具体虫类并不确定，不一定只是苍蝇。
    reason: lexical_alternative
  - marker: b
    text: 或译“在大地之中”。这里的“地”在上下文中很可能指埃及地，但希伯来语也可作较广的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: 我要……分别出来
  rationale: 该词为 פלא 的使役式，在这里表示区别对待、使之有别；“分别出来”自然表达歌珊受到保护而与其他地区不同。
- source_word: אֶרֶץ גֹּשֶׁן
  choice: 歌珊地
  rationale: אֶרֶץ 在此指地域；“歌珊地”是简洁、通行的中文地名表达。
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: 我百姓居住的
  rationale: עֹמֵד עַל 字面涉及“站在其上”，但就土地而言在此表示停留、居住；译作“居住”符合上下文和现代汉语。
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: 使那里没有
  rationale: 该不定式结构表达目的或结果，即灾害不会出现在歌珊；此译简明自然。
- source_word: עָרֹב
  choice: 成群的虫子
  rationale: 该词所指的具体动物并不确定，可能是成群飞虫或更广义的虫群；正文避免限定为苍蝇，同时以现代汉语表达群聚含义。
- source_word: לְמַעַן תֵּדַע
  choice: 好让你知道
  rationale: 保留明确的目的含义；动词为阳性单数第二人称，所指为法老。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接保留上帝的专名，不以称号替代；“雅威”为现代中文可理解的音译。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: 就在这地之中
  rationale: בְּקֶרֶב 表示“在……之中”；הָאָרֶץ 在语境中很可能指埃及这片土地，但也可较广地理解为“大地”，故正文保留“地”的表达并用脚注说明。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留其专名性质，而不以“主”这一称号替换；“耶和华”是传统音译，但不如“雅威”贴近学界常用拟音。
- issue: בְּקֶרֶב הָאָרֶץ 的范围
  choice: 就在这地之中
  alternative: 在大地之中
  rationale: 当前灾祸叙事最自然地指上帝在埃及地施行作为，但 הָאָרֶץ 本身也可指大地；正文不明确补入“埃及”，以保留原文范围上的张力，并在脚注列出较宽读法。
- issue: 灾害 עָרֹב 的具体所指
  choice: 成群的虫子
  alternative: 虫群；蝇群
  rationale: 原词的确切动物学所指有争议。译文避免把它教义化或过度具体化为苍蝇，同时清楚传达这是一种群聚虫害。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“但到那一天”承接前文并突出时间转折；“我雅威”略带原文式郑重语气，用于保留“我就是雅威”的自我宣告。所有脚注标记均置于其所解释的正文内容之后。
