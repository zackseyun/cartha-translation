  naturalness: 整体为自然、庄重的现代标准汉语。“我雅威”在无停顿标示时显得生硬且易造成误读；改为“我——雅威——在……”清楚表达同位语和自我宣告。将“成群的虫子”凝练为“虫群”更符合中文对灾害性群聚现象的通常表达。
  terminology: “歌珊地”“雅威”均合适；“分别出来”能传达使之有别、加以区分的意思。对עָרֹב不限定为“苍蝇”是审慎的；“虫群”与脚注的词汇不确定性相符。
