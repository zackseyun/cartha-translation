  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: zh_hans
  text: 今天你们离开，正值亚笔月[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚笔”是这个月份的名称；这个词与春季谷物穗子渐趋成熟的阶段有关。
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: 今天
  rationale: 该词带定冠词，在这里作时间副词，指以色列人出离事件发生的当日；“今天”自然地保留了讲话的即时感。
- source_word: אַתֶּם
  choice: 你们
  rationale: 这是阳性复数第二人称独立代词，所指为以色列众人；现代汉语用“你们”明确表达复数。
- source_word: יֹצְאִים
  choice: 出发
  rationale: יצא的Qal主动分词复数在语境中表示正在发生或即将发生的行动。“出发”既传达离开原地、踏上行程之意，又不把原文此句未明说的“埃及”补入正文。
- source_word: בְּחֹדֶשׁ
  choice: 正值……月
  rationale: 介词ב与“月”构成历法时间说明。“正值……月”比直译“在……月”更符合现代汉语表达，同时保留时间定位。
- source_word: הָאָבִיב
  choice: 亚笔
  rationale: 这是希伯来月份的名称或称谓，正文采用音译“亚笔”，不以“春季”或“初熟穗月”等解释性译法取代；其词义背景放入脚注。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“今天”突出当下性；“出发”保留动作正在发生或迫近的语感；以“正值”顺畅连接月份说明。脚注标记紧随“亚笔月”，使其与文化说明的对象清楚对应。
