base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: zh_hans
  text: 七天要吃无酵饼；第七天要为雅威[a]守节[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神名“YHWH”（יהוה）；传统常译作“耶和华”或“上主”。
    reason: 说明神名原文及传统译法。
  - marker: b
    text: 或译：“第七天是献给雅威的节期。”
    reason: 保留原文无明示动词的名词结构，以及介词ל所容许的归属或奉献关系。
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 七天之内
  rationale: 该结构表示持续时间；“七天之内”在现代汉语中自然地表达这段为期七天的时段。
- source_word: תֹּאכַל
  choice: 你要吃
  rationale: 未完成式第二人称阳性单数在律例语境中具有指令意味；“你要吃”既保留命令语气，也不过度强化为绝对强制。
- source_word: מַצֹּת
  choice: 无酵饼
  rationale: 指逾越节及无酵节背景中的未发酵饼；“无酵饼”是清楚、通行且简洁的中文表达。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 介词短语标明后一分句的时间；中文以分号衔接时不必机械译出连接词וּ。
- source_word: חַג
  choice: 守节
  rationale: חַג指献给神的节庆或节期。原文为省略动词的名词短句，译作“守节”可在现代汉语中自然表达举行节庆的指令；另以脚注保留较贴近字面的名词句理解。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל表示归属、奉献或指向；“为雅威”表明这个节庆是为雅威举行的，同时保留原文关系上的一定宽度。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。“雅威”较贴近学界通常重构的读音，也明确保留专名性质；脚注说明希伯来文形式及传统译法，不把传统称谓混入正文。
- issue: חַג לַיהוָה的句法与神学关系
  choice: 要为雅威守节
  alternative: 是归雅威的节期
  rationale: 希伯来文是无明示动词的简短名词结构，可理解为举行献给雅威的节庆，也可较静态地表述该日是归雅威的节期。正文采用适合律例语境的动态说法，脚注保留较贴近形式的另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“你要”保留第二人称单数指令语气；分号呈现两个时间安排之间的紧密对应。
