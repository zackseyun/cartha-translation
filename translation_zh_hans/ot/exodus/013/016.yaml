base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: zh_hans
  text: 这要作为你手上的记号，作为你两眼之间的额饰[a][b]，因为雅威用强有力的手把我们从埃及带了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “额饰”所译的希伯来词十分罕见，也可理解为“额带”；传统上常译作“经文匣”。它很可能指戴在额前、用来提醒人的物件。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“两眼之间”，这一说法通常理解为“额头上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 这要……作
  rationale: 连词加完成式在此具有将来、结果性的作用；用“这要……作”自然地承接前文，并表达持续作为记号的意义。
- source_word: לְאוֹת
  choice: 作记号
  rationale: אוֹת 指标志、凭据或记号；“记号”简明宽泛，保留其提醒和标识作用。
- source_word: עַל יָדְכָה
  choice: 在你手上
  rationale: 按原文保留“手”，不改释为“手臂”，并与后面的身体部位意象平行。
- source_word: וּלְטוֹטָפֹת
  choice: 作额饰
  rationale: טוֹטָפֹת 是罕见词，看来指戴在额前、具有提醒作用的物件。“额饰”表达其大致位置和物件性质，同时不直接套用后世专门术语。
- source_word: בֵּין עֵינֶיךָ
  choice: 在你两眼之间
  rationale: 直译原文意象，避免在正文中直接解释成“额头上”；可能的惯用含义交由脚注说明。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出这些记号所依据的原因；现代汉语用“因为”清楚自然。
- source_word: בְּחֹזֶק יָד
  choice: 用强有力的手
  rationale: 保留“手”的具体比喻，并准确表达 חֹזֶק 所强调的力量；措辞自然，不额外增强为其他神学化表达。
- source_word: הוֹצִיאָנוּ
  choice: 把我们……带了出来
  rationale: יצא 的使役式表示使人出去，即“带出来”；此译法清楚呈现雅威是施行拯救的主体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: מִמִּצְרָיִם
  choice: 从埃及
  rationale: 与“带了出来”组合成自然的现代汉语，同时准确表达起点。
theological_decisions:
- issue: 手和两眼之间的措辞应按原有意象翻译，还是直接解释为后世的礼仪物件
  choice: 正文保留“在你手上”和“在你两眼之间”的具体意象，并以较宽泛的“额饰”翻译罕见名词
  alternative: 在正文中译作特定的经文匣，或完全意译为抽象的提醒
  rationale: 原文本身没有明确采用后世礼仪物件的专名，其措辞可以具有实物、象征或兼具二者的含义。保留意象和罕见词的不确定性，可避免过早排除任何一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事措辞。“这要……作”承接律例语境；“雅威”保留神名。“额饰”虽非高频日常词，但比后世专门礼仪术语更能保存原文罕见词的开放性，并由脚注补足说明。
