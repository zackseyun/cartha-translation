source:
  edition: WLC
  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: zh_hans
  text: 将来，雅威领你进入迦南人、赫人、亚摩利人、希未人和耶布斯人的土地，就是他向你的祖先起誓要赐给你的——那流奶与蜜之地时，你要在这个月举行这项礼仪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼仪”也可表达为“事奉”或“遵守这项礼仪”。这里的希伯来词可指按规定履行的敬拜行动或服事。
    reason: 保留 עֲבֹדָה 在敬拜语境中“礼仪、事奉、规定行动”的词义范围，并以自然现代汉语表达“observance”的可能含义。
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: 将来……时
  rationale: 这一结构引出将来必然发生之事及随后的要求；译法既保留时间关系，也符合现代汉语表达。
- source_word: יְבִיאֲךָ
  choice: 领你进入
  rationale: 使役形表达“使进入、带进”；“领你进入”自然地呈现雅威带领以色列人进入那地的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的通行学术拟音译出其专名性质，不以称号替代。
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: 进入迦南人、赫人、亚摩利人、希未人和耶布斯人的土地
  rationale: 希伯来语以单数族名列举当地各族；汉语用“……人的土地”清楚、自然地保留其所属关系。
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: 就是他向你的祖先起誓要赐给你的
  rationale: 保留关系从句与“土地”的联系，以及盟约语境中的起誓和赐予用语。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 那流奶与蜜之地
  rationale: 沿用准确而庄重的汉语圣经惯用表达，传达土地丰饶富足的意象。
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: 你要……举行这项礼仪
  rationale: 在本段逾越节和除酵节的敬拜语境中，动词与名词同根，表示履行规定的敬拜行动；“举行这项礼仪”在现代汉语中清楚自然，脚注保留“事奉、守礼”的语义范围。
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: 在这个月
  rationale: 直接保留时间短语，指本段所规定举行节期的月份。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；“雅威”较贴近现代学界对该神名的拟音，也避免用“主”等称号取代专名。
- issue: עֲבֹדָה 在逾越节语境中的含义
  choice: 礼仪
  alternative: 事奉；守礼
  rationale: 该词既可指服事、劳作，也可在此指规定的敬拜行动。正文采用自然易懂的“礼仪”，脚注说明其较宽的敬拜与事奉含义，不把它限定为后世某种具体礼制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。长句依照原文的时间结构展开，并用“就是”明确同位说明，避免关系层次含混。神名采用“雅威”；族名采用简体中文常见译名。
