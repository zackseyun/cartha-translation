base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: zh_hans
  text: 摩西对百姓说：“要记住你们从埃及、从为奴之家出来的这一天，因为雅威用大能的手把你们从那里带了出来；任何有酵之物都不可吃。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有酵之物”也可译作“发酵之物”或“有酵饼”。原词指含酵或有酵的食物；此处的禁令并不限于饼类。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: 要记住
  rationale: 单数祈使式把百姓视为一个整体来劝告；“要记住”自然明确，也保留纪念这一日的意味。
- source_word: הַיּוֹם הַזֶּה
  choice: 这一天
  rationale: 准确对应带定冠词的名词和指示词，不额外添加强调。
- source_word: מִבֵּית עֲבָדִים
  choice: 从为奴之家
  rationale: 希伯来语直译为“奴隶之家”；“为奴之家”在现代中文中既保留“家/居所”的具体比喻，也清楚表达埃及是受奴役之地。
- source_word: בְּחֹזֶק יָד
  choice: 用大能的手
  rationale: 保留“手”的身体意象，并以“大能”自然表达 חֹזֶק 所指的强大力量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不用称号替代专名。
- source_word: הוֹצִיא
  choice: 领了出来
  rationale: 使役式可表示“使出来、带出来”；“领了出来”符合汉语表达，也不把行动仅限于空间移动。
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: 任何发酵之物都不可吃
  rationale: 保留被动禁令的普遍语气；חָמֵץ 可泛指发酵的食物，不宜无依据地限缩为饼。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；“雅威”较贴近学界通常重构的读音，同时不以“主”等称号取代。
- issue: “奴隶之家”这一出埃及惯用语
  choice: 为奴之家
  alternative: 奴隶之家
  rationale: “为奴之家”保留原文比喻并清楚指向受奴役的处境；“奴隶之家”虽更直译，但现代中文容易被理解为奴隶居住的房屋。
- issue: חָמֵץ 的范围
  choice: 任何发酵之物
  alternative: 有酵饼
  rationale: 该词在此可指发酵之物或含酵食物；采用较宽的译法，以免把禁令无根据地限于饼类。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“为奴之家”保留原文的具体比喻；句序尽量贴近希伯来语，同时调整为自然中文。
