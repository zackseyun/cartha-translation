  terminology: “耶和华”是中文圣经传统中稳定、可辨识的四字神名译法；脚注恰当地说明 יהוה 与“雅威”的常见学术音译，并不把不确定的古代读音断言为确定事实。“云柱”“火柱”均为准确且通行的术语。
