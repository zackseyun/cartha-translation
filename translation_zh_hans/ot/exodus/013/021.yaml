  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: zh_hans
  text: 耶和华[a]白天在他们前面行进，在云柱中引领他们走在路上；夜间在火柱中为他们照明，使他们能够昼夜行进。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为四字神名 יהוה（YHWH）；其古代准确读音不能完全确定，也常音译为“雅威”。
    reason: 说明神名的原文形式，并保留其读音及中文音译上的真实不确定性。
lexical_decisions:
- source_word: וַיהוָה
  choice: 耶和华
  rationale: 直接音译四字神名所代表的圣约之名；“耶和华”是现代中文读者最熟悉且庄重的传统形式，并以脚注说明原文形式及另一常见音译。
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: 在他们前面行进
  rationale: 分词 הֹלֵךְ 表达持续进行的动作；结合 לִפְנֵיהֶם，既保留空间上的“在前面”，也体现持续带领。
- source_word: יוֹמָם
  choice: 白天
  rationale: 以自然现代汉语表达时间副词，并与后文“夜间”构成平行。
- source_word: בְּעַמּוּד עָנָן
  choice: 在云柱中
  rationale: 介词 בְּ 可表达耶和华在这一可见形态中的临在；“云柱”准确保留原文的具体意象。
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: 引领他们的路
  rationale: נחה 表示引导、带领；原文“道路”作关系宾语，这一译法尽量保留其紧凑结构，可理解为在他们所走的路上引领他们。
- source_word: וְלַיְלָה
  choice: 夜间
  rationale: 与“白天”形成清楚、自然的时间对照。
- source_word: בְּעַמּוּד אֵשׁ
  choice: 在火柱中
  rationale: 与“在云柱中”保持句法和意象上的平行。
- source_word: לְהָאִיר לָהֶם
  choice: 照亮他们
  rationale: 使役式 הֵאִיר 表示使有光或照明；中文“照亮他们”简洁表达为他们提供光亮。
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: 使他们能够昼夜行进
  rationale: 不定式表达目的或结果；“行进”符合出埃及旅程语境，“昼夜”保留原文对持续行动能力的强调。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。正文采用中文圣经传统中最广为人知的“耶和华”，而不以称号“主”替代；脚注保留“雅威”这一更贴近现代学界拟音的可能形式，避免把有争议的发音问题隐藏起来。
- issue: 云柱和火柱与耶和华临在的关系
  choice: 在云柱中
  alternative: 借着云柱／火柱
  rationale: בְּ 可译作“在”或“借着”。采用“在……中”较直接地保留原文对耶和华临在方式的表述，同时不进一步界定云火柱的本体性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“白天……夜间……”呈现原文平行结构，末句用“昼夜”形成凝练收束；不把分词的持续意味弱化为单次动作。
