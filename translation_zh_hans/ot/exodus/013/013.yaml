base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: zh_hans
  text: 凡驴所生的头胎，都要用一只羊羔[a]赎回；若不赎，就要打断它的颈项。你儿子中凡头生的，都要赎回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊羔”原文指羊或山羊一类的一只牲畜，可以是绵羊或山羊。
    reason: 说明שֶׂה的词义范围比正文“羊羔”更广。
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: 驴头生的
  rationale: פֶּטֶר字面指“初开母胎者”；在本段律法语境中，“头生的”自然准确，并保留与上下文相关的首生含义。
- source_word: תִּפְדֶּה
  choice: 要……赎回
  rationale: פדה表示借代替物或赎价使之得赎；“赎回”兼顾法律与礼仪语义，也符合现代汉语表达。
- source_word: בְשֶׂה
  choice: 用一只羊羔
  rationale: שֶׂה泛指羊群中的一只，可为绵羊或山羊；正文采用汉语圣经语境中自然的“羊羔”，并以脚注保留原词较宽的范围。
- source_word: וַעֲרַפְתּוֹ
  choice: 打断它的颈项
  rationale: ערף指从颈后折断或打断颈项，并非一般宰杀；此译法清楚保留该动作的具体性质。
- source_word: בְּכוֹר אָדָם
  choice: 头生的
  rationale: אָדָם在这里与牲畜相对，指人；由于紧接“你儿子中”，汉语无需重复“人的”，仍明确指头生的儿子。
- source_word: בְּבָנֶיךָ
  choice: 你儿子中
  rationale: 原文明确使用“儿子”，而非泛称儿女；直译可准确保留法律所指对象。
theological_decisions:
- issue: אָדָם在“בְּכוֹר אָדָם”中的所指
  choice: 理解为与动物相对的人类，并在“你儿子中凡头生的”这一汉语结构中表达
  alternative: 译作“凡头生的人”或“人的一切头生者”
  rationale: 原文的אָדָם表示人类类别，不专指成年男性；但בְּבָנֶיךָ进一步限定为“你儿子中”。当前译法不扩展为性别中性的“儿女”，也避免生硬重复。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“凡……都要……”体现希伯来文法律指令的普遍性；“颈项”较“脖子”庄重，同时仍为普通读者所理解。
