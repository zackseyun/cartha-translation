lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 于是……说
  rationale: 未完成式动词与叙事性 waw 连用，推动叙事向前；“于是”自然表达承接关系，“说”符合现代汉语引出直接话语的习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式音译四字神名，不以“主”这一称号替代。
- source_word: אֶל
  choice: 对
  rationale: 在“对某人说”的汉语结构中，自然对应原文表示言语对象的介词。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名通行的现代中文译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出下文直接话语；汉语以“说：”自然表达这一功能，避免生硬重复为“说，说道”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留其专名性质，并采用中文传统中最通行、最易识别的音译“耶和华”；“雅威”是基于现代学术界常见拟音的另一译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接前文并推进叙事；结尾用冒号，因为本节的“说”引出下一节的直接话语。
