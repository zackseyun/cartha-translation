  yaml_path: translation/ot/exodus/013/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 于是，雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”，即以色列上帝的四字神名；也常译作“耶和华”。
