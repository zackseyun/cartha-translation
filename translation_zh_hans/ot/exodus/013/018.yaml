language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: zh_hans
  text: 于是，上帝领百姓绕道，走旷野的路，前往芦苇海[a]；以色列人列队[b]从埃及地上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “芦苇海”传统上常译作“红海”；希伯来名称的字面意思是“芦苇之海”。
    reason: alternative_reading
  - marker: b
    text: 译作“列队”的希伯来词含义不确定，也可理解为“武装着”“按战斗队形”或较一般的“整队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: 领……绕道
  rationale: 使役式在此表示上帝使百姓绕行，不走直路；“领……绕道”既保留上帝的主动引领，也符合现代汉语。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 动词为单数，所指明确是独一的上帝；采用现代汉语中庄重而通行的译名。
- source_word: הָעָם
  choice: 百姓
  rationale: 这里集合性地指正在出埃及的以色列群体；“百姓”自然且符合叙事语体。
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: 走旷野的路
  rationale: דֶּרֶךְ指道路或路线；此译保留路线含义，比单译“经过旷野”更贴近原文。
- source_word: יַם סוּף
  choice: 芦苇海
  rationale: סוּף通常指芦苇等水生植物；“芦苇海”优先呈现希伯来名称的字面意义，传统译名另见脚注。
- source_word: וַחֲמֻשִׁים
  choice: 列队
  rationale: 该词词义有争议，可能涉及武装、战斗队形或有秩序的编队。“列队”在正文中避免断言人人携带武器，同时保留有组织行进的意味；其他主要可能性列入脚注。
- source_word: עָלוּ
  choice: 上去
  rationale: 保留עלה的基本方向性用语，也延续希伯来叙事对离开埃及的惯常表达。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定族群名称在此指全体以色列民；现代汉语以“以色列人”表达最自然，不会被误解为只包括男性后裔。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 直接体现介词“从”和名词“地”，语言简洁自然。
theological_decisions:
- issue: יַם סוּף的译法
  choice: 芦苇海
  alternative: 红海
  rationale: 正文按原文词汇证据译作“芦苇海”，不以传统地理名称取代原文表达；“红海”作为历史悠久且熟悉的传统译法保留在脚注。
- issue: בְנֵי יִשְׂרָאֵל的汉语表达
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 原短语形式上是“以色列的儿子们”，但在此已是全体族民的固定称谓。译为“以色列人”准确传达所指范围，避免现代读者误以为只谈男性。
- issue: וַחֲמֻשִׁים的不确定含义
  choice: 列队
  alternative: 武装着／按战斗队形／整队
  rationale: 原词含义并不确定。正文采用不过度具体化的“列队”，脚注明确保留武装和战斗队形等解释，不把有争议的军事含义定为唯一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“于是”承接上文；分号清楚区分上帝安排路线与以色列人离境的两层陈述。脚注标记均紧随相关词语。
