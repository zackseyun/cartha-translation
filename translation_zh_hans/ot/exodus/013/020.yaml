  text: 他们从疏割出发，在旷野边缘的以倘安营。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……出发
  rationale: נסע的连续叙事形式表示拔营启程，译为“出发”自然、简洁，并保留行程推进之意。
- source_word: מִסֻּכֹּת
  choice: 从疏割
  rationale: 介词מִן表示起点“从”；地名סֻכּוֹת按现代中文圣经常用音译作“疏割”。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה意为驻扎、扎营；“安营”符合中文行旅叙事的庄重而通俗的表达。
- source_word: בְאֵתָם
  choice: 在……以倘
  rationale: 介词בְ在此表示驻营地点；地名אֵתָם按现代中文圣经常用音译作“以倘”。
- source_word: בִּקְצֵה
  choice: 在……边缘
  rationale: קָצֶה可指尽头、边界或边缘；结合地理语境，“边缘”最自然，且不过度限定为行政边界。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: מִדְבָּר通常指荒野、草原或人烟稀少之地，不必然是沙漠；“旷野”准确且符合现代中文圣经语域。
