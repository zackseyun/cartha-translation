  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: zh_hans
  text: 这要在你手上作记号，在你两眼之间作纪念[a]，使耶和华的律法[b]在你口中；因为耶和华用大能的手领你出了埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在你两眼之间”也可按习语理解为“在你额上”；正文保留希伯来语的字面说法。
    reason: lexical_alternative
  - marker: b
    text: “律法”或译“训诲”。希伯来语“妥拉”可指律法，也可泛指教导、训诲。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְךָ לְאוֹת
  choice: 这要……作记号
  rationale: 该结构在此带有前瞻和功用意味；“要……作记号”既自然，又保留指示性语气。
- source_word: עַל יָדְךָ
  choice: 在你手上
  rationale: 直译“手”，保留具体意象，不预先限定为手臂或后来的经匣习俗。
- source_word: וּלְזִכָּרוֹן
  choice: 作纪念
  rationale: “纪念”保留 זִכָּרוֹן 的记念与纪念性分量，比单纯“提醒”更贴近原文名词。
- source_word: בֵּין עֵינֶיךָ
  choice: 在你两眼之间
  rationale: 依照希伯来语字面表达，保留其可能为具体或象征性用语的开放性。
- source_word: תּוֹרַת יְהוָה
  choice: 耶和华的律法
  rationale: תּוֹרָה 可指律法或教导；此处处于圣约与礼仪指示语境，“律法”合宜，同时以脚注保留“训诲”的可能。神名按其专名译为“耶和华”。
- source_word: בְּפִיךָ
  choice: 常在你口中
  rationale: 保留“在口中”的原文意象；加入“常”使中文自然地表达律法应持续被述说、诵念的语用含义，但不改换为较解释性的“挂在嘴边”。
- source_word: בְּיָד חֲזָקָה
  choice: 用大能的手
  rationale: חֲזָקָה 字面为“强有力的”；“大能的手”是庄重自然的现代中文，也准确表达耶和华施行拯救的大力。
- source_word: הוֹצִאֲךָ
  choice: 领你出了
  rationale: 使役形表达“使你出来、带你出来”；“领你出了埃及”在中文中简洁自然。
theological_decisions:
- issue: 手上与两眼之间的措辞是否直接解释为后来佩戴经匣的做法
  choice: 正文保留“在你手上”和“在你两眼之间”的具体意象。
  alternative: 译作“绑在手臂上”和“戴在额头上”，或完全意译为铭记在心。
  rationale: 原文没有明说经匣，也没有限定为纯粹比喻；直译可避免把后来的实践或单一解释倒入经文。
- issue: תּוֹרָה 在本节的译法
  choice: 正文译作“律法”。
  alternative: 译作“训诲”或“教导”。
  rationale: “律法”符合出埃及记的圣约语境及中文圣经语体，但 תּוֹרָה 的范围可以更广，故在脚注注明另一译法。
- issue: 神名 יְהוָה 的处理
  choice: 译作“耶和华”。
  alternative: 以“主”这一称号代替。
  rationale: 原文使用以色列上帝的专名；中文以通行音译“耶和华”呈现，避免用称号取代专名。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。正文保留“手上”“两眼之间”“口中”等原文意象；分号呈现目的句与其后理由之间的关系。
