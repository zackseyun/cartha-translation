base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: zh_hans
  text: 你要把一切开胎的分别归给雅威[a]；你所有牲畜所生的头胎中，凡是公的，都归雅威。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “开胎的”直译为“打开母腹的”，指首先从母腹出生的。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“你所有牲畜所生的头胎，凡是公的，都归雅威。”希伯来语指牲畜首先出生的后代，并在末尾明确限定为公的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: 献给
  rationale: 该词为 עבר 的使役式，字面有“使经过、转交”之意；在此礼仪和法律语境中表示将头生的转归雅威。“献给”自然传达奉献之意。
- source_word: כָל פֶּטֶר רֶחֶם
  choice: 一切头生的
  rationale: 希伯来语字面意为“一切开胎的”，即首先从母腹出生的。“头生的”是现代汉语中清楚而庄重的对应表达，字面形式另以脚注保留。
- source_word: לַיהוָה
  choice: 给雅威／归雅威
  rationale: 介词 לְ 在前半句配合动作表示献给的对象，在末尾表示归属。יהוה按其专名译作“雅威”。
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: 牲畜中一切头生的
  rationale: שֶׁגֶר 指动物所生的后代；整句涉及家畜最先出生的后代。译文保留“牲畜”和“头生”两个语义要素。
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: 你所有
  rationale: 该关系从句字面为“将属于你的”，在此限定以色列人拥有的牲畜；“你所有”简洁自然。
- source_word: הַזְּכָרִים
  choice: 公的
  rationale: 带冠词的阳性复数在此指上述牲畜头生后代中的雄性。对牲畜用“公的”符合现代汉语习惯，并保留其限制性作用。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为圣约专名的性质，不以称号替代。
- issue: 末句 לַיהוָה 的语义关系
  choice: 都归雅威
  alternative: 都要献给雅威
  rationale: 原文末尾省略动词，既可承接前面的奉献动作，也可表达归属。译作“归雅威”保留法律与礼仪上的归属意味，同时不把具体处置方式说得过满。
translation_notes:
  register: 采用现代、庄重而易懂的法律礼仪语体。“头生的”沿用汉语经文传统且仍可理解；“公的”准确对应牲畜的雄性。分号呈现原文前后两个相连规定，并保留末句在奉献与归属之间的语义张力。
