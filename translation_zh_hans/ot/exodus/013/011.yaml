  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: zh_hans
  text: 雅威带你进入迦南人的土地，并照着他向你和你祖先[b]所起的誓，把那地赐给你的时候[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“事情将是：当……时”。正文按现代汉语表达为“……的时候”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“父辈”，也可译作“列祖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ……的时候
  rationale: 该结构引出将来会发生的情形。用句末的“……的时候”符合现代汉语习惯，也保留了经文与下一节衔接的未完句式。
- source_word: יְבִיאֲךָ
  choice: 带你进入
  rationale: בוא 的使役形表示“使……进入、带……进入”；与后面的土地搭配时，“带你进入”准确自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名四字神名，不以称号替代。
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: 进入迦南人的土地
  rationale: 保留 אֶל 的趋向意义以及“迦南人的土地”这一族称结构，不简化为“迦南地”。
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: 照着……所起的誓
  rationale: 既表达 כַּאֲשֶׁר 的对应关系，也准确传达 נִשְׁבַּע 的起誓含义；汉语采用名词化表达更顺畅。
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: 向你和你祖先
  rationale: 介词 לְ 在起誓语境中译为“向”；אֲבֹתֶיךָ 字面为“你的父辈”，在此指先祖，译作“祖先”清楚自然，并以脚注注明字面形式。
- source_word: וּנְתָנָהּ לָךְ
  choice: 并……把那地赐给你
  rationale: 阴性单数后缀所指为前面的“土地”，汉语明确译为“那地”；“赐给”适合上帝将土地给予以色列的语境。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名；“雅威”较直接反映学界通常采用的读音，同时不以“主”等称号替换。
- issue: אֲבֹתֶיךָ 的所指
  choice: 祖先
  alternative: 父辈／列祖
  rationale: 此处指承受应许的前代先祖。“祖先”在现代汉语中自然明确；脚注保留希伯来文“父辈”的字面信息，避免掩盖原文措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留本节引向下一节的条件／时间从句结构，因此句末使用逗号而非句号；避免过度古雅的“列祖”，但以脚注说明原文字面措辞。
