base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of slaves.’
translation:
  language: zh_hans
  text: 将来，你儿子问你说：“这是什么意思？”你就要告诉他：“耶和华用大能的手把我们从埃及、从为奴之家领了出来。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: 将来
  rationale: 本义为“明日”，在此语境中指未来某时，即后代儿子提出问题的时候。
- source_word: בְּחֹזֶק יָד
  choice: 用大能的手
  rationale: 保留希伯来语“手”的形象，同时用“大能”自然表达 חֹזֶק 所指的力量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的神圣名译法，并与“主”的称号相区别。
- source_word: מִבֵּית עֲבָדִים
  choice: 从为奴之家
  rationale: 保留“家”的源语隐喻；“为奴之家”表达埃及是以色列人遭受奴役之地，而不把 עֲבָדִים 仅处理为抽象的“奴役”。
theological_decisions:
- issue: 出埃及事件中神圣名与施行拯救者的辨识
  choice: 耶和华……领了出来
  alternative: 主……领了出来
  rationale: 原文明确使用四字神名 יהוה，译文保留专名，使施行拯救者的身份保持明确。
- issue: 代际认同中的第一人称复数
  choice: 把我们……领了出来
  alternative: 把我们的祖先……领了出来
  rationale: 原文用 הוֹצִיאָנוּ“把我们领出”，让后代共同认同出埃及的拯救；不改写成“祖先”，以保留其盟约性与礼仪性的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“这是什么意思？”按汉语问话习惯传达 מַה־זֹּאת；整体保留教导子女时的直接引语和出埃及叙事的核心意象。
