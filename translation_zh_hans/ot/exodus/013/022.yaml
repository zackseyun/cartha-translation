  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: zh_hans
  text: 日间的云柱和夜间的火柱，一直没有离开百姓面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一直没有从百姓面前移开。”希伯来语动词可指离开或移开；在否定形式中，这里表明云柱和火柱持续在百姓面前。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: 始终没有离开
  rationale: 该动词意为移开、离去；结合否定词译为“始终没有离开”，既表达未曾移去，也自然传达持续同在之意。
- source_word: עַמּוּד
  choice: 柱
  rationale: “柱”准确保留垂直柱状的具体意象；与“云”“火”组合为现代中文圣经叙事中清楚自然的“云柱”“火柱”。
- source_word: הֶעָנָן
  choice: 云
  rationale: 直接对应“云”；定冠词的限定意义由“云柱”这一特指语境自然体现。
- source_word: יוֹמָם
  choice: 日间
  rationale: 作为时间副词表示白昼期间，与“夜间”构成简洁而对称的表达。
- source_word: וְעַמּוּד הָאֵשׁ
  choice: 夜间的火柱
  rationale: 保留与“日间的云柱”平行的结构和火的具体形象；连接关系通过中文顿号自然呈现。
- source_word: לָיְלָה
  choice: 夜间
  rationale: 表示夜晚期间，与“日间”形成平衡对应。
- source_word: לִפְנֵי
  choice: 百姓前面
  rationale: 在该动词之后表示从位于百姓前方的位置移开；中文以“离开百姓前面”自然保留空间关系。
- source_word: הָעָם
  choice: 百姓
  rationale: 该定指集合名词在上下文中指以色列民；“百姓”是庄重、通顺且不额外增添专名的译法。
