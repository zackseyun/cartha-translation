base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: zh_hans
  text: 那一天，你要告诉你的儿子说：“我这样做，是因为雅威在我出埃及时为我所行的事。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威在我出埃及时为我这样行，是因为这。”希伯来语中的“这”既可指守此礼的原因，也可更直接地与雅威所行的事相连。
    reason: 原文בַּעֲבוּר זֶה与עשה之间的句法关系存在歧义。
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: 你要告诉
  rationale: 该词是נגד的使役词形，意为“告诉、使人知道”。“告诉”符合父亲向儿子讲述逾越经历的语境，也自然易懂。
- source_word: לְבִנְךָ
  choice: 你的儿子
  rationale: לְ标明间接宾语，בֵּן为阳性单数。“你的儿子”准确保留原文的数与性。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 这是常见的时间短语；“那一天”保留指示语气，并适合现代汉语叙述。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式引出随后话语的内容。汉语用“说”比直译为“说道”更简洁自然。
- source_word: בַּעֲבוּר זֶה
  choice: 我这样做，是因为
  rationale: 该短语表达原因或目的，זֶה可指眼前举行的礼仪，也可能与后面的“做”联系。正文按语境将其理解为遵行此礼的缘由，并补出汉语所需的“我这样做”。另一种句法理解列入脚注。
- source_word: עָשָׂה יְהוָה לִי
  choice: 雅威……为我所做的
  rationale: עשה语义宽泛，可指“做、施行、行事”。此处没有明说宾语，因此采用“为我所做的”，既保持开放性，也表达雅威为说话者施行拯救。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译“雅威”呈现四字神名，而不以称号替代。
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: 在我出埃及时
  rationale: בְּ加不定式结构表示时间情境；译文保留第一人称单数，也自然表达“离开埃及之时”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近通常学术重构读音、且为现代汉语读者所知的“雅威”；“耶和华”是传统汉语形式，但其发音源自较晚的混合读法。
- issue: בֵּן在盟约教导中的性别表达
  choice: 你的儿子
  alternative: 你的孩子
  rationale: 原文为阳性单数，语境没有要求将其泛化，因此保留为“儿子”。
- issue: בַּעֲבוּר זֶה与עשה的句法关系
  choice: 将“这”理解为所行礼仪，并以雅威的作为解释礼仪的原因
  alternative: 将“这”理解为雅威行动的目的或缘由
  rationale: 希伯来语容许两种联系：可意为“我这样做，是因为雅威为我所做的”，也可更直接地表达“雅威因这事而为我行事”。正文采用语境中较顺畅的理解，脚注保留另一种可能，避免消除原文的张力。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙述。“我这样做”是为使汉语完整而按上下文补出的表达；脚注说明原文更凝练且具有句法歧义。
