revisions:
- from: 摩西把约瑟的骸骨带在身边，因为约瑟曾郑重地叫以色列众子起誓，说：“上帝必定看顾你们[a]；你们要把我的骸骨从这里带上去，与你们同行。”
  to: 摩西带着约瑟的骸骨，因为约瑟曾郑重地叫以色列的子孙起誓，说：“上帝必定眷顾你们[a]；你们要带着我的骸骨从这里上去。”
  rationale: 修订仅处理两处中文表达：以“以色列的子孙”替换不自然的“以色列众子”，并以“带着我的骸骨从这里上去”准确表达原文“把我的骸骨从这里带上去，与你们一起”的命令。其余译文维持原有的语义、庄重语体和脚注锚点。
