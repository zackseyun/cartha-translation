  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת עַצְמ֥וֹת יוֹסֵ֖ף עִמּ֑/וֹ כִּי֩ הַשְׁבֵּ֨עַ הִשְׁבִּ֜יעַ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִיתֶ֧ם אֶת עַצְמֹתַ֛/י מִ/זֶּ֖ה אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: zh_hans
  text: 摩西带着约瑟的骸骨，因为约瑟曾郑重地叫以色列的子孙起誓，说：“上帝必定眷顾你们[a]；你们要带着我的骸骨从这里上去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上帝必定临到你们。”这个希伯来语表达可指上帝为自己的百姓决定性地介入并采取行动。
    reason: 保留פָּקֹד יִפְקֹד在此处“临到、眷顾并采取行动”的词义幅度。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 带在身边
  rationale: לקח是常见的叙事动词，意为“拿、带”；结合עִמּוֹ，用“带在身边”自然表达摩西将骸骨随身带走。
- source_word: עַצְמוֹת / עַצְמֹתַי
  choice: 骸骨 / 我的骸骨
  rationale: 原文具体指“骨头”。中文“骸骨”准确、庄重，也比泛称“遗体”或“遗骸”更贴近原词。
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: 郑重地叫……起誓
  rationale: 使役式配合绝对不定式，兼有“使人起誓”和加强语气的作用；“郑重地叫……起誓”保留这两层意思。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留原文“以色列的众子”这一家族性称谓及其阳性表达，同时以“众子”使现代中文较为顺畅。
- source_word: פָּקֹד יִפְקֹד
  choice: 必定看顾
  rationale: 动词פקד配合绝对不定式强调行动的确定性；在本处指上帝必采取行动眷顾并援助他的百姓。“必定看顾”自然清楚，又不过度限定行动方式。
- source_word: וְהַעֲלִיתֶם
  choice: 你们要……带上去
  rationale: 使役式在誓言内容中带有义务和将来意味；“带上去”保留עלה所含从埃及向上而行的方向感。
- source_word: מִזֶּה אִתְּכֶם
  choice: 从这里……与你们同行
  rationale: “从这里”直接对应地点指示语；“与你们同行”表达骸骨将由他们一同带走，保留陪同含义并符合中文表达。
theological_decisions:
- issue: פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם的表达
  choice: 上帝必定看顾你们
  alternative: 上帝必定眷顾你们；上帝必定临到你们
  rationale: 这个希伯来语习语既有察看、关注之意，也指上帝决定性地介入并采取行动。“看顾”能表达恩惠性的关注和行动，同时脚注保留“临到”的字面可能，避免把语义缩减为单纯留意。
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列众子
  alternative: 以色列人；以色列的子孙
  rationale: 原文明确使用“众子”，并以家族关系指称以色列群体；正文保留这一措辞，不将其直接中性化为民族名称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“骸骨”“郑重地叫……起誓”保持经文的严肃感；句法尽量自然，同时保留原文重复出现的“骸骨”和随行观念。
