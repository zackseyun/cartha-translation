  yaml_path: translation/ot/exodus/013/010.yaml
  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: zh_hans
  text: 你要在所定的时候，年年遵守这项条例[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从日子到日子”；这里通常理解为“年年”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: 你要……遵守
  rationale: שׁמר在律法语境中表示谨守、遵行；“遵守”在现代汉语中自然明确，也保留持续履行的含义。
- source_word: הַחֻקָּה הַזֹּאת
  choice: 这条例
  rationale: חֻקָּה指固定颁定的规例或法令；“条例”庄重而易懂，适合盟约律法语境。
- source_word: לְמוֹעֲדָהּ
  choice: 按指定的日期
  rationale: מוֹעֵד在这里指为该礼仪指定的时间；结合逾越节年度日期的上下文，“按指定的日期”比生硬的“在它所定的时间”更符合现代汉语。
- source_word: מִיָּמִים יָמִימָה
  choice: 年年
  rationale: 该短语字面涉及“日子”，但在此年度节期语境中是周期性惯用语，意为逐年、每年；正文译作“年年”，并以脚注保留字面形式。
theological_decisions: []
