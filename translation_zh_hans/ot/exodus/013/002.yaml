- from: “要把以色列人中所有头生的，就是一切初开母腹的，无论是人还是牲畜，都分别为圣归给我；他们都是我的。”
  to: “要把以色列人中所有头生的，就是一切初开母腹的，无论是人还是牲畜，都分别为圣，归给我；这都是我的。”
  rationale: 仅作汉语表达层面的安全微调：将圣别与归属分开表达，并以“这都是我的”替换可能拟人化的“他们都是我的”。其余措辞忠实保留原文的范围、类别对照及未明说雄性的歧义。
