  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: zh_hans
  text: “要把以色列人中所有头生的，就是一切初开母腹的，无论是人还是牲畜，都分别为圣，归给我；这都是我的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ לִי
  choice: 分别为圣归给我
  rationale: קַדֶּשׁ 是命令式，表示将对象划归为圣、专属于上帝；“分别为圣归给我”既保留礼仪与归属含义，也符合现代汉语表达。
- source_word: כָל בְּכוֹר
  choice: 所有头生的
  rationale: בְּכוֹר 指头生者。原文此处没有明说“雄性”，因此正文不加上该限定。
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: 一切初开母腹的
  rationale: 该短语进一步说明“头生的”，指首先打开母腹而出生者；采用较庄重且易懂的圣经汉语表达。
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: 以色列人中
  rationale: 字面为“以色列众子中”，此处是指以色列群体；现代汉语用“以色列人中”自然准确，不造成仅限男性成员的误解。
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: 无论是人还是牲畜
  rationale: אָדָם 在这里集合性地指人类，与 בְּהֵמָה 构成人和动物的对照；在律法语境中后者自然译作“牲畜”。“无论……还是……”传达两类都包括在内，并未增加实质语义。
- source_word: לִי הוּא
  choice: 他们都是我的
  rationale: 结句强调归上帝所有。所指包括人和牲畜中的多个头生者，汉语用复数代词和“都”可自然表达集合性指称。
theological_decisions:
- issue: אָדָם 与 בְּהֵמָה 的集合性对照
  choice: 人／牲畜
  alternative: 人类／动物
  rationale: 这里的 אָדָם 代表人这一类别，并非特指成年男性；译作“人”保留简洁的人与兽对照。בְּהֵמָה 在本段头生牲畜的律法语境中译作“牲畜”较准确，但“动物”是词义较宽的可能译法。
- issue: 头生者是否明确限于雄性
  choice: 正文不增译“雄性”
  alternative: 所有头生的雄性
  rationale: 相关律法语境可能指向雄性头生者，但本节希伯来文本没有显式使用“雄性”一词，因此不在正文中补入，以免消除原文表达范围上的张力。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“头生的”和“初开母腹”保留律法与礼仪语体；以分号呈现最后的神圣所有权宣告。无脚注，故正文不设脚注标记。
