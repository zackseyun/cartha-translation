  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: zh_hans
  text: 法老顽固，不肯放我们走的时候，耶和华击杀了埃及地所有头生的，无论是人的头生者，还是牲畜的头生者。因此，凡开母腹的雄性，我都献给耶和华为祭；至于我每一个头生的儿子，我都赎回。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה ... לְשַׁלְּחֵנוּ
  choice: 顽固，不肯放我们走
  rationale: 希伯来语使役形在此与“不肯放我们走”连用，表达法老执意抗拒；此译自然呈现其顽梗与拒绝，不补入原文未明说的“心”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式呈现四字神名，区别于称号“主”。
- source_word: כָּל בְּכוֹר
  choice: 所有的长子和头生的
  rationale: בכור涵盖人和牲畜；中文分别用人的“长子”和牲畜的“头生”较自然，并由下文“从人到牲畜”界定范围。
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: 从人到牲畜都是如此
  rationale: 保留“从……到……”的总括结构；אָדָם在与牲畜对举时泛指人类，בְּהֵמָה指家畜、牲畜。
- source_word: זֹבֵחַ
  choice: 献……作祭
  rationale: 该动词指宰杀并献作祭物；“献作祭”兼顾祭祀含义与现代中文的自然表达。
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: 凡头生的公畜
  rationale: 字面为“凡开母腹的雄性”；在本节与“我的长子”对照，所指是头生的雄性牲畜，译文明确其自然所指。
- source_word: בָּנַי
  choice: 我的长子
  rationale: בנים明确指儿子；结合בכור，译作“长子”，不泛化为“孩子”。
- source_word: אֶפְדֶּה
  choice: 赎出来
  rationale: פדה在礼仪和法律语境中指以替代物或代价赎回；“赎出来”清楚保留这一含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且庄重的“耶和华”，不以称号“主”取代专名；“雅威”是较接近学术重构读音的另一译法。
- issue: 献上头生牲畜与赎回长子的区别
  choice: 公畜献作祭，长子赎出来
  alternative: 将两者笼统译为“奉献”
  rationale: 原文刻意分别使用זבח（献祭）与פדה（赎回），译文保留二者在礼仪行动上的区别，不暗示以人为祭。
- issue: אָדָם与בְּהֵמָה的对举
  choice: 人／牲畜
  alternative: 人类／动物
  rationale: 这里是总括埃及头生者的范围。“人／牲畜”既准确又符合本段以家畜头生为重点的语境。
translation_notes:
  register: 采用现代、庄重而易懂的叙事—律法语体。“法老顽固，不肯……”避免生硬直译为“使……刚硬”；分号突出献祭牲畜与赎回长子的对照。正文没有脚注，因此无需脚注标记。
