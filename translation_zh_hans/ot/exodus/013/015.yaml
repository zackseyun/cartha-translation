revisions:
- from: 法老顽固，不肯放我们走的时候，耶和华击杀了埃及地所有的长子和头生的，从人到牲畜都是如此。因此，凡头生的公畜，我都献给耶和华作祭；但我所有的长子，我都赎出来。
  to: 法老顽固，不肯放我们走的时候，耶和华击杀了埃及地所有头生的，无论是人的头生者，还是牲畜的头生者。因此，凡开母腹的雄性，我都献给耶和华为祭；至于我每一个头生的儿子，我都赎回。
  rationale: 修订恢复原文“所有头生者”及其“从人的头生者到牲畜的头生者”的完整范围，避免将类别表达得含混。又以“每一个头生的儿子”保留原文的分配性和男性限定。对“פֶּטֶר רֶחֶם הַזְּכָרִים”保留“开母腹的雄性”的礼仪公式，既不擅自缩窄名词范围，也借后半句的赎回对照维持文本的实际礼仪区分。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:03Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿首句将“埃及地所有的头生者”拆作“所有的长子和头生的”，范围和指称不够清楚；“从人到牲畜都是如此”也没有明确保留两端都是“头生者”。末句“我所有的长子”容易理解为说话者拥有数位长子，未能自然表达原文对每一头生儿子的分配性说法。修订后保留“凡开母腹的雄性”这一原文礼仪用语，不把原文未明说的“牲畜”直接纳入该短语，同时借与“儿子赎回”的对照保持上下文含义。
  naturalness: 修订采用现代汉语中清楚且庄重的叙事—礼仪语体。“无论是……还是……”明确总括范围；“至于”自然标出献祭与赎回的对照。
  terminology: “耶和华”“头生”“献……为祭”“赎回”均与本段礼仪语境及项目既有术语相称。“长子”只用于人的头生儿子，避免将牲畜也称作“长子”。
  issues:
  - severity: medium
    issue: “所有的长子和头生的”未清晰对应“所有头生者”，且把人和牲畜的类别并列得含混。
    rationale: כָּל־בְּכוֹר 是总称，随后“从人的头生者到牲畜的头生者”具体界定范围；中文应明确两者皆属头生者。
  - severity: medium
    issue: “我所有的长子”未自然表达“我每一个头生的儿子”。
    rationale: כָּל־בְּכוֹר בָּנַי 是分配性表述；“所有的长子”在中文可造成一人有多个“长子”的不自然理解。
  - severity: low
    issue: “凡头生的公畜”将原文“凡开母腹的雄性”明确限定为牲畜。
    rationale: 上下文和后句对照确实指向献祭牲畜，但本节的希伯来文本身使用较宽的礼仪公式；保留该公式更贴近原文，也不改变由后句建立的区别。
  revised_text: 法老顽固，不肯放我们走的时候，耶和华击杀了埃及地所有头生的，无论是人的头生者，还是牲畜的头生者。因此，凡开母腹的雄性，我都献给耶和华为祭；至于我每一个头生的儿子，我都赎回。
