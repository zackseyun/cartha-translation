  to: 法老放百姓走的时候，上帝没有带领他们走经过非利士人之地的路，尽管那条路较近[a]；因为上帝说：“恐怕百姓看见战争时改变主意[b]，回埃及去。”
  rationale: 修订仅改善汉语搭配与句法流畅度，并使“看见战争”较完整地对应原文的情境表达。保留“尽管那条路较近”的主文及其原因性脚注，以呈现 כִּי 的可争议连接功能；未引入任何额外的地理、历史或教义解释。
