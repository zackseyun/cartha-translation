  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: zh_hans
  text: 法老放百姓走的时候，上帝没有带领他们走经过非利士人之地的路，尽管那条路较近[a]；因为上帝说：“恐怕百姓看见战争时改变主意[b]，回埃及去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为那条路较近。”原文连接词既可表示让步，也可表示原因。
    reason: lexical_alternative
  - marker: b
    text: 或译：“后悔”或“回心转意”。这里指百姓面对战争时心意发生改变。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: 法老放百姓走的时候
  rationale: 介词 בְּ 加不定式结构表示时间背景；שׁלח 在本语境中指准许百姓离开。“放百姓走”既自然，也呼应出埃及叙事中的反复用语。
- source_word: נָחָם
  choice: 领
  rationale: נחה 在此指带领、引导；“领”简洁自然，符合行路语境。
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: 非利士人之地的路
  rationale: 保留“路”与“非利士人之地”的地理结构，并明确原文所用的是族群名称“非利士人”。
- source_word: כִּי קָרוֹב הוּא
  choice: 虽然那条路近
  rationale: כִּי 可表示原因，也可按语境表达让步。此处采用让步理解，突出那条路线虽近，上帝却没有带领百姓走那里；另一种可能见脚注。
- source_word: פֶּן
  choice: 恐怕
  rationale: פֶּן 引出所防范或担忧的结果；“恐怕”在现代汉语中自然地保留这种语气。
- source_word: יִנָּחֵם
  choice: 改变主意
  rationale: נחם 的尼法勒式在此表示因面对战事而转变心意或打消原有决定，并非特指道德意义上的悔改。
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: 一看见战事
  rationale: 介词 בְּ 加不定式表示“当……看见时”；מִלְחָמָה 在这里泛指战争或战斗。“战事”较自然，也保留百姓目睹武装冲突的画面。
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: 回埃及去
  rationale: שׁוב 表示返回，地名后的方向词尾表示朝埃及而去；“回埃及去”准确而自然。
theological_decisions:
- issue: 上帝避开非利士路线的理由
  choice: 按经文直接呈现：上帝预见百姓面对战事时可能改变主意，因而没有领他们走较近的路线。
  alternative: 把这理由理解为叙述者对上帝动机的推测，或理解为上帝临时改变计划。
  rationale: 原文明说“因为上帝说”，将这一理由置于上帝的判断中。译文不额外说明上帝的知识或护理方式，也不消解经文本身的张力。
translation_notes:
  register: 采用现代、庄重而通俗的书面汉语。“百姓”承接出埃及叙事中的群体称呼；“非利士人之地”保留原文地理表达。标点与语序按现代汉语调整，同时保留两个真实的词义歧义。
