base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: zh_hans
  text: 这七天要吃无酵饼；在你那里不可见有酵之物[a]；在你全境内不可见酵种[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有酵之物”或译“发过酵的东西”。希伯来语 חָמֵץ 指经过发酵之物，不一定只指有酵饼。
    reason: lexical_alternative
  - marker: b
    text: “酵种”指用来使面团发酵的酵料，通常是留下的一块发酵面团；它与前面的“有酵之物”并非同一个希伯来词。
    reason: lexical_clarification
lexical_decisions:
- source_word: מַצּוֹת
  choice: 无酵饼
  rationale: 指逾越节期间不用酵发制成的饼；“无酵饼”是现代中文中清楚、通行且保留礼仪含义的表达。
- source_word: יֵאָכֵל
  choice: 都要吃
  rationale: 希伯来语为尼法勒未完成式，字面是被动的“要被吃”；中文法律性语境用“都要吃”更自然，也保留规定的语气，而不额外强化为更严厉的命令。
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: 七天之内都
  rationale: 宾格表示持续时间，涵盖完整的七天；“七天之内都”自然表达整个节期持续如此。
- source_word: יֵרָאֶה לְךָ
  choice: 在你那里不可见
  rationale: 保留尼法勒“被看见”的字面意象，并以“在你那里”表达不得存在于人的持有范围或管辖范围内，而不把含义缩窄为仅仅“被你看见”。
- source_word: חָמֵץ
  choice: 有酵之物
  rationale: 此词在这里广指经过发酵的东西，尤其是有酵食品；译作“有酵之物”可与后句指发酵剂本身的 שְׂאֹר 区分，也避免不必要地限于饼。
- source_word: שְׂאֹר
  choice: 酵种
  rationale: 指使面团发酵的酵料或发酵剂。在古代语境中通常是留存的发酵面团；“酵种”比现代工业意义较强的“酵母”更贴切。
- source_word: בְּכָל גְּבֻלֶךָ
  choice: 在你全境内
  rationale: 指个人或群体疆界、管辖范围的全部区域；“全境内”简洁自然，并保留范围的全面性。
theological_decisions:
- issue: 禁令所涵盖的对象
  choice: 分别译为“有酵之物”和“酵种”
  alternative: 两处都译为“酵”或分别译为“有酵饼”和“酵母”
  rationale: 原文刻意使用 חָמֵץ 与 שְׂאֹר 两个不同词，前者较广地指发酵之物，后者较具体地指发酵剂。分别翻译可保留律法禁令的双重范围，不将其缩窄或合并。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不可见”有意保留原文法律条文中的被动表达及其张力；其语境含义是不容这些东西留在人的持有或管辖范围内。“都要吃”使中文流畅，同时体现整整七天持续遵守的规定。
