  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: zh_hans
  text: 雅威这样说：“你会由此知道我就是雅威：看哪，我正要用我手里的杖击打尼罗河中的水[a]，水就会变成血。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语“水”及其后相应的动词都是复数形式；汉语通常把“水”作为不标单复数的物质名词。
    reason: 说明原文语法形式与汉语自然表达之间的差异。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威这样说
  rationale: 保留宣告性的使者公式，同时采用现代汉语自然语序；神名 יְהוָה 音译为“雅威”，不以称号替代。
- source_word: בְּזֹאת תֵּדַע
  choice: 你会由此知道
  rationale: 介词 בְּ 在此表示凭借或途径；未完成式在语境中具有将来指向。“由此”指即将施行的神迹。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我就是雅威
  rationale: “就是”自然地传达强调性的自我认定，又不把句意扩展为原文未明说的神学解释。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、加强临场感的功能，并维持庄重语体。
- source_word: אָנֹכִי מַכֶּה
  choice: 我正要……击打
  rationale: 独立人称代词配合分词，使动作显得鲜明而迫近；“正要”比单纯的“将要”更能表达即将发生的动态，同时避免误解为动作已经开始。
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: 用我手里的杖
  rationale: מַטֶּה 在此指施行神迹所用的杖；将希伯来语关系从句自然压缩为现代汉语定语。
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: 击打尼罗河中的水
  rationale: 在击打语境中，עַל 可按汉语习惯处理为动词的直接对象；יְאֹר 在出埃及记的埃及背景中特指尼罗河。
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: 水就会变成血
  rationale: 保留由水转变为血的结果关系。汉语“水”通常不标单复数，重复主语可使结果清楚流畅。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用接近 Yahweh 的现代汉语音译“雅威”，保留其作为专名的性质，不以“主”这一称号替换；“耶和华”虽为传统译名，但其语音形式源于较晚的混合读法。
- issue: “我正要击打”中说话者与执行者的张力
  choice: 保留第一人称“我”及“我手里的杖”
  alternative: 解释性改写为“我要借着你手里的杖击打”
  rationale: 原文将神的第一人称行动与手中之杖直接并列，在叙事中形成神借其使者行动的表达张力。译文不添加“借着你”等解释，以免消解原文措辞。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。保留“看哪”以呈现宣告的力度和临场感；其余结构按汉语习惯适度整合，避免生硬直译。
