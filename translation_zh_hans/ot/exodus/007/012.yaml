  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: zh_hans
  text: 他们各自把自己的杖扔下，这些杖都变成了大蛇[a]；但亚伦的杖吞掉了他们的杖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“龙”或“大型爬行动物”。希伯来语תַּנִּין所指的范围比通常表示“蛇”的词更广。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: 扔下
  rationale: שׁלך在此指把手中的物件投掷在地；“扔下”是自然的现代汉语，也保留了动作方向。
- source_word: אִישׁ
  choice: 各自
  rationale: אִישׁ与单数所属后缀连用，具有逐一分配的意义；“各自把自己的”清楚表达每个人都扔下本人的杖。
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: 自己的杖／杖／他们的杖
  rationale: מַטֶּה可指杖或棍；“杖”符合本段叙事中的具体物件，并保留单复数关系。
- source_word: וַיִּהְיוּ
  choice: 就变成了
  rationale: היה在这里表示变化后的结果；“变成了”用现代汉语直接传达这一转变。
- source_word: לְתַנִּינִם
  choice: 大蛇
  rationale: תַּנִּין可泛指蛇形怪兽、大型爬行动物或海兽；本段语境适合译作“大蛇”，同时以脚注保留其较宽的词义范围。
- source_word: וַיִּבְלַע
  choice: 吞掉了
  rationale: בלע意为吞咽、吞没；“吞掉了”自然且表达完全吞入的结果。
- source_word: אֶת
  choice: （宾语标记，不另译）
  rationale: אֶת标示确定直接宾语，汉语中通过语序表达，无须另译。
