  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“看，我已使你在法老面前作上帝[a]；你的哥哥亚伦要作你的先知。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已使你对法老如同上帝。”希伯来文直接称摩西为“上帝”；在这里是指他代表上帝向法老施行权柄，并非说摩西本身是上帝。
    reason: 说明原文直接表语的表达，同时交代语境所显示的代表性职分含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，而不以“主”这一称号替代。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性前接连词推进情节；中文通常无需机械译出“于是”，直接用“说”自然承接上文。
- source_word: רְאֵה
  choice: 看
  rationale: 保留引起摩西注意的命令语气，简洁而直接。
- source_word: נְתַתִּיךָ
  choice: 我已使你
  rationale: 动词字面为“我已给/置你”，在此与表语“上帝”连用，中文用使役结构最自然，也保留完成意味。
- source_word: אֱלֹהִים
  choice: 如同上帝
  rationale: 希伯来文直接称摩西为法老的“上帝”，语境表达其代表上帝施行权柄的职分；正文以“如同”避免现代读者误解为本体身份，脚注保留更直译的表达。
- source_word: לְפַרְעֹה
  choice: 在法老面前
  rationale: לְ 标示摩西相对于法老的身份和角色；“在法老面前”符合中文习惯，也贴合双方对峙的场景。
- source_word: אָחִיךָ
  choice: 你的哥哥
  rationale: אָח 可泛指兄弟，但出埃及记的叙事已表明亚伦年长于摩西；“哥哥”是自然且符合语境的中文。
- source_word: יִהְיֶה נְבִיאֶךָ
  choice: 要作你的先知
  rationale: 保留标准术语“先知”，不缩减为“代言人”；“要作”自然表达此处的将来角色。
theological_decisions:
- issue: 摩西相对于法老被称为 אֱלֹהִים
  choice: 正文译“如同上帝”，并用脚注注明直译
  alternative: “我已使你作法老的上帝”
  rationale: 原文的表语没有比较词，张力应予保留；但其后亚伦作摩西“先知”的对应关系显示，这是代表上帝权柄的职分安排，不是在宣称摩西具有神性。正文兼顾现代中文可理解性，脚注明确呈现原文的直接措辞。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看”保留直接话语的力度；分号呈现摩西与亚伦两种彼此对应的角色。所有脚注标记均已在正文出现。
