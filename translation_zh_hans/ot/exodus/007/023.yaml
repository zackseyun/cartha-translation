  yaml_path: translation/ot/exodus/007/023.yaml
  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
translation:
  language: zh_hans
  text: 法老转身，进了自己的家；连这事也没有放在心上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: 转身
  rationale: פנה在此表示转身或转身离去；“转身”简洁自然，并与下文“进了”连贯，同时不额外限定方向。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: “法老”是现代汉语中对埃及君王称号的标准译法。
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: 进了宫
  rationale: בוא与אֶל表示朝向并进入其住所。语境中的主语是法老，因此“宫”比字面的“他的家”更符合现代汉语习惯，也保留进入其居所的动作。
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: 没有放在心上
  rationale: שׁית לב是把心放在某事上的习语，意为认真留意或重视；“放在心上”既保留“心”的意象，又是自然的现代汉语。
- source_word: גַּם לָזֹאת
  choice: 连这事也
  rationale: גַּם在此具有“甚至、连……也”的强调意味，זֹאת指眼前发生的这件事；“连这事也”自然表达法老对此仍不在意。
