  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֑חַ הִנֵּ֣ה אָנֹכִ֗י נֹגֵ֛ף אֶת כָּל גְּבוּלְ/ךָ֖ בַּֽ/צְפַרְדְּעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/027.yaml
  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: zh_hans
  text: 但你若不肯放他们走，看哪，我必以青蛙击打你的全境[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我必……击打”也可译作“我就要……击打”；希伯来语分词在这里既可表达即将发生的行动，也可作一般将来理解。
    reason: 保留希伯来语分词在临近将来与一般将来之间的语义张力。
lexical_decisions:
- source_word: וְאִם
  choice: 但你若
  rationale: 承接前文的释放要求，引出与之相对的条件；“但……若”自然表达语境中的转折。
- source_word: מָאֵן
  choice: 不肯
  rationale: 表达出于意志的拒绝，而非没有能力；也符合对法老说话的语气。
- source_word: לְשַׁלֵּחַ
  choice: 放他们走
  rationale: 在出埃及语境中指解除对以色列人的拘束；“放他们走”是现代汉语中自然准确的表达。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示注意和庄严警告的功能，并维持经文的郑重语体。
- source_word: אָנֹכִי נֹגֵף
  choice: 我必……击打
  rationale: 独立代词突出施行者；分词在 הִנֵּה 引导的宣告中可指即将发生的行动。正文采用自然的将来表达，脚注说明其临近含义。
- source_word: כָּל גְּבוּלְךָ
  choice: 你的全境
  rationale: 此处 גְּבוּל 指统治范围内的全部地域，而不只是边界线；“全境”简洁并准确传达范围。
- source_word: בַּצְפַרְדְּעִים
  choice: 用青蛙
  rationale: 介词 בְּ 表示击打所借助的手段；“用青蛙”在汉语中清楚表达灾祸的媒介。
