  rationale: 修订仅处理现代汉语搭配与 צִבְאֹתַי 的清晰度。“放在埃及身上”直接保留原文未明说“伸出”的手部意象；“军队”保留该词的军事／组织性，脚注则说明其并非必然仅指作战部队。将脚注锚点分别置于“重大的审判”“以色列的子孙”和“军队”之后，均与所注词语对应。
