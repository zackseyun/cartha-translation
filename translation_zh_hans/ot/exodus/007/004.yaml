source:
  edition: WLC
  text: וְ/לֹֽא יִשְׁמַ֤ע אֲלֵ/כֶם֙ פַּרְעֹ֔ה וְ/נָתַתִּ֥י אֶת יָדִ֖/י בְּ/מִצְרָ֑יִם וְ/הוֹצֵאתִ֨י אֶת צִבְאֹתַ֜/י אֶת עַמִּ֤/י בְנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בִּ/שְׁפָטִ֖ים גְּדֹלִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: zh_hans
  text: 法老必不听你们的话；我要把我的手放在埃及身上，以重大的审判[a]，把我的军队[c]——我的子民，就是以色列的子孙[b]——从埃及地领出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着重大的审判行动”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“以色列人”。原文直译为“以色列的子孙”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“我的众军”或“我的队伍”。希伯来词可指有组织的群体，常带军事含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: 听你们的话
  rationale: שׁמע 与 אֶל 连用可指听从、理会；“听你们的话”自然地保留“听”的基本意义，也含有拒绝理会之意，但不直接强化为“顺服”。
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרָיִם
  choice: 我要把我的手加在埃及身上
  rationale: 尽量保存原文“把我的手置于埃及”的审判性意象，不改写为本节并未使用的“伸手攻击”。“加在……身上”在现代汉语中较庄重，也表达上帝施加大能的行动。
- source_word: צִבְאֹתַי
  choice: 我的众军
  rationale: צָבָא 可指军队、众军或有组织的队伍；“众军”保留其集体、编组及军事联想，又由后面的“我的子民”明确其所指是以色列民。
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: 我的子民，就是以色列的子孙
  rationale: 保留同位说明结构，并按字面呈现 בְנֵי יִשְׂרָאֵל；“就是”清楚表明“以色列的子孙”是在进一步辨明“我的子民”。
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: 以重大的审判
  rationale: 保留 שְׁפָטִים 的复数审判行动含义和司法色彩；汉语用集合性表达“审判”，脚注说明也可理解为多次重大的审判行动。
theological_decisions:
- issue: צִבְאֹתַי 对以色列群体的称呼
  choice: 我的众军
  alternative: 我的各队；我的军队
  rationale: 原词兼有有组织群体与军事色彩。“众军”不把以色列仅仅解释为作战军队，同时保留耶和华统领其子民出埃及的群体意象。
- issue: בְנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列的子孙
  alternative: 以色列人；以色列的儿子们
  rationale: “以色列的子孙”既保存父系族名的字面结构，也作为现代中文圣经语体中的群体称谓而易于理解，不将其误限为男性成员。
- issue: בִּשְׁפָטִים גְּדֹלִים 的性质
  choice: 以重大的审判
  alternative: 借着重大的审判行动；以严厉的刑罚
  rationale: 保留上帝行动的司法性质，不把“审判”缩减为刑罚，也不预先限定各次行动的具体形式。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“把我的手加在埃及身上”有意保留希伯来文较强的身体意象；破折号呈现“我的众军—我的子民，就是以色列的子孙”的同位关系。所有脚注标记均置于相关正文之后。
