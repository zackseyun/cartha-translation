  to: 法老若对你们说：‘你们拿出个神迹来吧’，你就要对亚伦说：‘拿你的杖，丢在法老面前，让它变成一条蛇[a]。’
  rationale: 修订删除“来证明自己”这一原文未明说的目的性解释，以“拿出个神迹来”自然表达法老要求出示神迹的命令。将“大蛇”改为“蛇”，避免将词义中的体型信息写死在正文；脚注保留תַנִּין较宽的语义范围。其余句法、人物指向和命令顺序均予保留。
