  text: כִּי֩ יְדַבֵּ֨ר אֲלֵ/כֶ֤ם פַּרְעֹה֙ לֵ/אמֹ֔ר תְּנ֥וּ לָ/כֶ֖ם מוֹפֵ֑ת וְ/אָמַרְתָּ֣ אֶֽל אַהֲרֹ֗ן קַ֧ח אֶֽת מַטְּ/ךָ֛ וְ/הַשְׁלֵ֥ךְ לִ/פְנֵֽי פַרְעֹ֖ה יְהִ֥י לְ/תַנִּֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: zh_hans
  text: 法老若对你们说：‘你们拿出个神迹来吧’，你就要对亚伦说：‘拿你的杖，丢在法老面前，让它变成一条蛇[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛇”：希伯来语tannin也可按语境指海中生物、巨兽或龙形生物。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יְדַבֵּר
  choice: 若……说
  rationale: 这里引出预期可能发生的情形；现代汉语用“若”能自然表达条件意味，同时不把尚未发生的对话说成确定的时间点。
- source_word: אֲלֵיכֶם
  choice: 对你们
  rationale: 希伯来语为复数，指摩西和亚伦，因此保留复数“你们”。
- source_word: מוֹפֵת
  choice: 神迹
  rationale: 此词指具有证明或预示作用的超常征兆；“神迹”在本段语境中自然，也表明法老要求的是超常凭证。
- source_word: תְּנוּ לָכֶם מוֹפֵת
  choice: 你们行个神迹来证明自己吧
  rationale: 字面近于“给你们自己一个神迹”。这里是要求他们拿出凭证；译文以“来证明自己”表达 לָכֶם 的关联/受益意味，避免生硬的“给自己”。
- source_word: וְאָמַרְתָּ אֶל אַהֲרֹן
  choice: 你就要对亚伦说
  rationale: 以“就”呈现前件发生后随即执行的指示流程。
- source_word: מַטְּךָ
  choice: 你的杖
  rationale: מַטֶּה 在此指手持的杖；“杖”简洁、庄重，并与出埃及记叙事中的物件相符。
- source_word: וְהַשְׁלֵךְ לִפְנֵי פַרְעֹה
  choice: 丢在法老面前
  rationale: 准确表达把杖投掷到法老面前的动作与公开展示的场景。
- source_word: יְהִי
  choice: 使它变成
  rationale: 该祈使式表达命令所要达到的结果；汉语“使它变成”比直译“让它成为”更符合亚伦执行动作的语境。
- source_word: תַנִּין
  choice: 大蛇
  rationale: 该词的范围比通常表示蛇的 נָחָשׁ 更广，可指大型蛇类、巨兽或龙形生物。“大蛇”既适合杖变活物的近景，又保留其不同于普通“蛇”的词义色彩；更宽泛的可能性在脚注说明。
theological_decisions:
- issue: 杖所变生物 תַנִּין 的具体类别
  choice: 大蛇
  alternative: 巨兽、龙形生物或大型爬行动物
  rationale: 上下文支持蛇形生物，但 תַנִּין 本身的语义范围较宽，不宜在正文中译成带强烈神话色彩的“龙”而过度限定。以“大蛇”作正文，并用脚注保存词义上的真实开放性。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“若……就……”呈现条件结构；直引语保持法老命令的口吻。正文脚注标记与脚注项目一致。
