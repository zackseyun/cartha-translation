  source_fidelity: 译文准确传达了 וַיֶּחֱזַק 所表达的法老之心进入刚硬/坚固状态，且没有擅自指定使其刚硬的施事者。“不听他们的话”恰当表达 שָׁמַע אֲלֵהֶם 的不听从/不理会；“正如耶和华所说的”也保留了与先前神谕相符的语义。
  naturalness: “然而，法老的心刚硬了，不听他们的话，正如耶和华所说的”在现代标准汉语中通顺、庄重，并与叙事语体相称。“心刚硬了”虽带有圣经常用语感，但对当代读者仍清楚易懂。
  terminology: “法老”“心”“耶和华”均为中文圣经语境中稳定、易识别的对应语。“耶和华”作为四字神名译名，保留专名性质而非改作称号。脚注正确说明 חזק 可较直译为“变得强壮、坚固”，并将其在本处的语境义限定为内心刚硬、顽固。
