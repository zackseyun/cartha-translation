source:
  edition: WLC
  text: וַ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: zh_hans
  text: 然而，法老的心刚硬了[a]，不听他们的话，正如耶和华所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“法老的心变得强硬。”希伯来语动词较直译为“变得强壮、坚固”，在这里指内心刚硬、顽固。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: 刚硬了
  rationale: חזק在此描述法老内心变得强硬、顽固。译作“刚硬了”符合出埃及记的语境和现代中文表达，同时不增添原文未明说的施事者。
- source_word: לֵב
  choice: 心
  rationale: לֵב在这里指人的内在意志、思想和决断；“心”既保留希伯来语意象，也符合中文圣经语体。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 这是该埃及君王称号在现代汉语中的标准译法。
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: 不听他们的话
  rationale: שׁמע与אֶל连用可表示听从、理会某人；“不听他们的话”自然地表达了拒绝听从之意。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表示事情与先前所说的相符；“正如”清楚体现这种对应关系。
- source_word: דִּבֶּר
  choice: 所说的
  rationale: 中文关系结构已自然表明这是耶和华先前说过的话，无须机械添加过去完成时标记。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用神圣四字名在现代简体中文圣经传统中通行且易识别的专名译法，而不以“主”这一称号替代。
theological_decisions:
- issue: 法老之心刚硬的施事者
  choice: 译为“法老的心刚硬了”，陈述变化或结果而不点明施事者。
  alternative: “法老的心被刚硬了”或“法老使自己的心刚硬”
  rationale: 希伯来语וַיֶּחֱזַק在本节没有明说是谁使其刚硬。所选译法保留这种施事上的开放性，不把本节单独解释为神直接使其刚硬，也不改写为法老主动使自己刚硬，从而保存叙事整体的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“然而”承接前文的转折；“不听他们的话”比单说“不听他们”更自然。神名采用中文通行形式“耶和华”。
