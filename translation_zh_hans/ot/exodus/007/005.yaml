  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: zh_hans
  text: 当我伸手攻击埃及，把以色列人[b]从埃及人中间领出来时，埃及人就会知道我是雅威[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”所对应的是希伯来文神名 יהוה（YHWH）；有些译本译作“耶和华”或以“上主”代替。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“以色列的众子”，也可译作“以色列的子孙”。这里指以色列人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 就会知道
  rationale: 连词加完成式在这里表达将来的结果；“就会知道”自然呈现埃及人因上帝的行动而认识、确认其身份。
- source_word: מִצְרַיִם
  choice: 埃及人／埃及
  rationale: 前一处作复数动词的主语，指埃及人；后一处受介词 עַל 支配，是上帝施行审判的对象，指埃及这国家。
- source_word: כִּי
  choice: （知道的内容）我是
  rationale: כִּי 引出“知道”的内容。现代汉语可直接说“知道我是……”，无需生硬补入“知道 that”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名 YHWH 的常见拟音译出专名，不以“主”这一称号替代。
- source_word: בִּנְטֹתִי
  choice: 当我伸手……时
  rationale: 介词 בְּ 加不定式在此具有时间意义；“伸手”保留原文具体而具拟人色彩的意象。
- source_word: יָדִי
  choice: 我的手（在句中合译为“我伸手”）
  rationale: 保留“手”的形象，不抽象改译为“能力”；汉语所有关系可由主语“我”自然表达。
- source_word: עַל מִצְרָיִם
  choice: 攻击埃及
  rationale: 在审判语境中，עַל 表示敌对指向；“攻击”比机械的“向埃及伸手”更清楚，同时仍保留伸手这一意象。
- source_word: וְהוֹצֵאתִי
  choice: 把……领出来
  rationale: Hifil 形式表达使其出来；“领出来”兼顾使动意义和上帝带领以色列人的语境。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该族群称谓最自然、明确的表达；脚注保留原文“以色列的众子”这一亲属结构。
- source_word: מִתּוֹכָם
  choice: 从他们中间
  rationale: 准确表达从埃及人当中分离、带出的意思，并保留复数代词所指的埃及人。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”旨在呈现该专名，而不是用“上主”这一称号替换；脚注说明其希伯来文字母形式。
- issue: בְּנֵי יִשְׂרָאֵל 的表达
  choice: 以色列人
  alternative: 以色列的众子；以色列的子孙
  rationale: 该短语字面具有阳性复数亲属结构，但在这里惯用地指以色列民族。正文用自然的现代汉语“以色列人”，脚注公开其字面形式，避免误让读者以为仅指男性或以色列的亲生儿子。
- issue: 上帝“伸手”的意象
  choice: 保留“伸手”，并以“攻击”表达 עַל 的敌对含义
  alternative: 向埃及伸出我的手；对埃及施展我的能力
  rationale: 保留原文的拟人意象与审判语气，不将“手”完全解释性地抽象为“能力”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为使时间关系和结果关系清楚，将希伯来语的主句置于时间从句之后，并用“就会”衔接；保留“伸手”的原文意象，以“攻击”明确审判语境。
