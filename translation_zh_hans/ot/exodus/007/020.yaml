  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: zh_hans
  text: 摩西和亚伦就照雅威所吩咐的做了。他举起杖，在法老眼前，也在法老臣仆眼前，击打尼罗河[a]里的水；尼罗河里所有的水都变成了血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“河”；在《出埃及记》中，这个词通常特指尼罗河。
    reason: 说明原词的字面表达及其在本书语境中的具体所指。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 就……做了
  rationale: 表达“照样去做、依命而行”的意思，在现代汉语叙事中自然简洁。
- source_word: כַּאֲשֶׁר צִוָּה
  choice: 照……所吩咐的
  rationale: 保留比较和遵命的语义，并自然表明吩咐先于执行。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列上帝盟约之名的性质。
- source_word: וַיָּרֶם
  choice: 他举起
  rationale: 希伯来文使用阳性单数动词；译文以“他”保留原文未明说摩西或亚伦的含混，而不擅自补定主语。
- source_word: בַּמַּטֶּה
  choice: 杖
  rationale: “杖”准确而简洁，符合本段作为施行神迹之杖的叙事语境。
- source_word: וַיַּךְ אֶת־הַמַּיִם
  choice: 击打……水
  rationale: 直接表达 נכה 在此处实际击打的动作，语体庄重而易懂。
- source_word: הַיְאֹר
  choice: 尼罗河
  rationale: יְאֹר 字面可指“河”，但在《出埃及记》的埃及语境中通常特指尼罗河；正文明确所指，脚注保留词面信息。
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: 在法老眼前，也在法老臣仆眼前
  rationale: 保留原文重复“眼前”的强调，凸显事件公开发生、亲眼可见。
- source_word: עֲבָדָיו
  choice: 法老臣仆
  rationale: עֶבֶד 基本义为仆人或臣属；“臣仆”适合王宫语境，同时不具体限定其官职。
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: 都变成了血
  rationale: 自然呈现转变的结果，并以“都”对应原文“所有”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的读音，并避免以称号代替专名。
- issue: 举杖击水者的身份
  choice: 保留为“他”
  alternative: 明确译作“亚伦”
  rationale: 上下文可能指向亚伦，但本节希伯来文本身只用单数动词而没有明说姓名，因此保留其指代上的含混。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体；保留原文“眼前”的重复和单数代词所形成的指代含混，避免过度解释。
