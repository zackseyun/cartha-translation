  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: zh_hans
  text: 埃及人都在尼罗河[a]周围挖掘，为了得到饮用水，因为他们不能喝尼罗河的水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“河”（ye’or）；在《出埃及记》中，这个词特指尼罗河。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: 挖掘
  rationale: חפר意为挖、掘；原文没有明确说是“挖井”，因此采用不增添具体对象的“挖掘”。
- source_word: כָל מִצְרַיִם
  choice: 埃及众人
  rationale: 字面可作“全埃及”，但此处实施挖掘的是埃及人；“埃及众人”既保留集合性的“全体”意味，也符合现代汉语表达。
- source_word: סְבִיבֹת הַיְאֹר
  choice: 在尼罗河周围
  rationale: סְבִיבֹת表示周围地区；יְאֹר在《出埃及记》的语境中特指尼罗河。
- source_word: מַיִם לִשְׁתּוֹת
  choice: 要找水喝
  rationale: 原文直译为“水来喝”；结合“挖掘”的动作，汉语用“要找水喝”自然表达其目的，又不把挖掘具体化为挖井。
- source_word: כִּי לֹא יָכְלוּ
  choice: 因为他们不能
  rationale: כִּי在此说明挖掘的原因，“因为”清楚保留因果关系。
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: 喝尼罗河里的水
  rationale: 介词מִן表示来源；“尼罗河里的水”是自然、清楚的现代汉语表达。
