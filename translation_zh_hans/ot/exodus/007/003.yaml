base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: zh_hans
  text: 但我要使法老的心刚硬[a]，并要在埃及地多行我的神迹和奇事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使法老的心强硬”或“使法老的心顽固”。希伯来语动词是使役形式，直接表明使其刚硬。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我要
  rationale: 连词加显式代词在上下文中带有转折和强调意味；“但我要”在现代汉语中自然地体现这一语气。
- source_word: אַקְשֶׁה
  choice: 使……刚硬
  rationale: קשׁה 的 Hiphil 使役形式直指“使之刚硬”；这一译法保留明确的使役力度，不弱化为仅仅容许。
- source_word: לֵב פַּרְעֹה
  choice: 法老的心
  rationale: 保留希伯来语“心”的意象，不在正文中将其解释性改写为意志、心思或态度。
- source_word: וְהִרְבֵּיתִי
  choice: 并要……多行
  rationale: רבה 的 Hiphil 在此表示使数量增多；与汉语中的“行神迹和奇事”搭配时，“多行”比直译“增多”更自然，同时保留数量增加之意。
- source_word: אֹתֹתַי
  choice: 我的神迹
  rationale: אוֹת 基本义为“记号、征兆”；在上帝于埃及施行大能作为的语境中，“神迹”是自然且通行的汉语对应，并体现这些作为的指示意义。
- source_word: מוֹפְתַי
  choice: 奇事
  rationale: מוֹפֵת 可指奇事、异能或预兆；“奇事”与“神迹”构成自然搭配，又不额外限定为某一种征兆。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 原文明确含“地”，译作“埃及地”既完整又符合庄重、自然的圣经汉语表达。
theological_decisions:
- issue: 上帝在法老之心刚硬一事中的行动
  choice: 我要使法老的心刚硬
  alternative: 我要任凭法老的心变得刚硬
  rationale: 希伯来语 Hiphil 形式直接呈现上帝的使役行动。正文保留这一神学张力，不将其缓和为单纯的许可或任凭。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“法老的心刚硬”保留原文核心意象和神学张力；“多行我的神迹和奇事”则按现代汉语搭配作适度顺译。
