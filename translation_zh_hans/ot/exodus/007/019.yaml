  to: 雅威对摩西说：“你要对亚伦说：‘拿起你的杖，向埃及的水伸出手来——向他们的河流、尼罗河水道、池塘，以及一切汇聚的水——使水变成血。埃及全地都必有血，甚至在木制和石制的盛水器具中也有血[a]。’”
