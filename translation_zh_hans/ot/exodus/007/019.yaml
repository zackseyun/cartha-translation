source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你要对亚伦说：‘拿起你的杖，向埃及的水伸出手来——向他们的河流、尼罗河水道、池塘，以及一切汇聚的水——使水变成血。埃及全地都必有血，甚至在木制和石制的盛水器具中也有血[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在木头和石头中”。这可能指木制和石制的盛水器具，但原文未明说“器具”。
    reason: 保留希伯来原文的省略表达及其解释上的歧义。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见现代汉语音译，保留其专名性质，不以称号代替。
- source_word: מַטְּךָ
  choice: 你的杖
  rationale: מַטֶּה指手持的杖；“杖”简洁庄重，也符合本叙事语境。
- source_word: וּנְטֵה יָדְךָ
  choice: 伸出手来
  rationale: 贴近希伯来语的动作表达，同时符合现代汉语习惯；后文以“伸手”承接，避免累赘。
- source_word: מֵימֵי מִצְרַיִם
  choice: 埃及的水
  rationale: 直译该属格结构，并由后续各类水体具体说明其范围。
- source_word: נַהֲרֹתָם
  choice: 他们的河流
  rationale: נָהָר可指河流或溪流；此处用“河流”并与下项埃及特有的水道相区别。
- source_word: יְאֹרֵיהֶם
  choice: 尼罗河水道
  rationale: יְאֹר在埃及语境中通常指尼罗河及其相关水道；此译保留地域特征，也避免与נָהָר混同。
- source_word: אַגְמֵיהֶם
  choice: 池塘
  rationale: אָגַם可指池沼或积水处；“池塘”清楚自然，适合此处水体枚举。
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: 一切聚水之处
  rationale: מִקְוֶה强调水汇聚而成的地方；此译不把它过度限定为人工水库或某一种池子。
- source_word: וְיִהְיוּ דָם
  choice: 使水变成血
  rationale: 上下文中的复数主语是埃及各处的水；明确补出“水”，自然表达命令所要达到的结果。
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: 甚至木器和石器中也有血
  rationale: 原文仅说“在木头和石头中”，表达较省略；按水灾语境理解为木制、石制盛水器具，同时用脚注保留字面形式及其歧义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”直接音译神名，既不以称号“主”取代，也不采用较晚形成的混合读音；不为本节额外加入宗派性解释。
- issue: וּבָעֵצִים וּבָאֲבָנִים所指
  choice: 理解为木制和石制器具
  alternative: 按字面译作“在木头和石头中”
  rationale: 上下文始终论及水及其所在之处，因此以材料代指盛水器具最符合语境；但希伯来原文确实省略了“器具”，故在脚注中保留其字面表达和不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“伸出手来”保留命令动作的具体性；水体清单按原文层次展开。仅在末句为汉语可理解性补出“器”，并以脚注说明原文更为简略。
