base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: zh_hans
  text: 雅威对摩西说：“到法老那里去，对他说：‘雅威这样说：放走我的百姓，好让他们侍奉我[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜我”。希伯来语这个动词可指向上帝所作的服事，其中包括敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行的音译“雅威”呈现四字神名，保留其作为专名的性质，不以“主”等称号替代。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该形式承接并推进叙事；现代汉语无需机械补出“于是”或“又”，简洁的“说”即可自然表达叙事进展。
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: 到法老那里去
  rationale: בוא 可依说话者视角表示来、去或进入；这里是命摩西前往法老面前，“到法老那里去”自然表达这一行动，同时不额外限定具体宫廷场景。
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: 对他说
  rationale: 按连续命令理解，以自然汉语保留命令语气。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威这样说
  rationale: 保留希伯来语使者宣告公式的正式性和权威语气，同时符合现代汉语表达。
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: 让我的百姓走
  rationale: 该惯用语要求法老释放以色列人；“让……走”既准确又自然，并保留“我的百姓”所表达的归属关系。
- source_word: וְיַעַבְדֻנִי
  choice: 好让他们侍奉我
  rationale: 前缀动词在命令之后表达目的或结果；“好让”体现较可能的目的关系。“侍奉”保留 עבד 对上帝之服事的较广语义，其中可以包括敬拜。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质；不以“主”代替，也不采用源于较晚期元音组合传统的“耶和华”。
- issue: וְיַעַבְדֻנִי 所表达的以色列使命
  choice: 侍奉我
  alternative: 敬拜我
  rationale: עבד 用于上帝时可以包含敬拜，但语义范围比礼仪性的“敬拜”更广。“侍奉”保留以色列从服事法老转为服事上帝的张力，不将含义限缩为宗教仪式。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“雅威这样说”保留宣告公式的正式语气；“到法老那里去”和“好让他们侍奉我”则避免生硬直译，便于普通读者理解。脚注标记置于其实际说明的“侍奉我”之后。
