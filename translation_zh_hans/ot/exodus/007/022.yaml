base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: zh_hans
  text: 埃及的术士也用他们的秘术[a]照样做了。法老的心就刚硬了，不听摩西和亚伦的话[b]，正如耶和华所说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用他们的咒术”或“用他们隐秘的法术”。
    reason: lexical_alternative
  - marker: b
    text: “法老的心就刚硬了”也可译作“法老的心变得刚硬”。本节希伯来文没有明确说明是谁使他的心刚硬。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 也……照样做了
  rationale: 自然表达“他们如此行”，并用“也”清楚承接上文，表明埃及术士仿效先前的行动。
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: 埃及的术士
  rationale: 该词在《出埃及记》中指法老宫廷中施行法术、仿效神迹的宗教或仪式专家；“术士”简明、自然且符合上下文。
- source_word: בְּלָטֵיהֶם
  choice: 用他们的秘术
  rationale: 介词表示手段，לָטִים 指隐秘的法术或咒术；“秘术”既保留隐秘性，也不过度限定具体方法。
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: 法老的心刚硬
  rationale: 希伯来文描述法老之心处于坚硬、顽固的状态，却未在本句明说使其刚硬的主体；此译避免补入施事者。
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: 不听摩西和亚伦的话
  rationale: שׁמע אֶל 在此意为听从或理会。原文代词“他们”按上下文指摩西和亚伦；明说所指可避免中文误解为埃及术士。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: 正如耶和华所说的
  rationale: 保留回指耶和华先前宣告的叙事公式；现代汉语无需以过去完成形式另作标记。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式，作为四字神名的专名译法，而不以称号“主”替代。
theological_decisions:
- issue: 法老之心刚硬的施事者
  choice: 译为状态句“法老的心刚硬”，不指明外在施事者。
  alternative: 可译“法老的心变得刚硬”；不采用“耶和华使法老的心刚硬”或“法老使自己的心刚硬”。
  rationale: 本节的 חזק 与“心”连用，呈现状态或结果，但没有明确指出是谁促成刚硬。译文保留这一神学张力，不从邻近经文补入施事者。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“术士”“秘术”“心刚硬”延续出埃及叙事的核心用语；将代词所指明译为“摩西和亚伦”，以免中文读者误以为法老不听埃及术士。
