  yaml_path: translation/ot/exodus/007/029.yaml
  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: zh_hans
  text: 青蛙必爬到你身上[a]、你百姓身上和你所有臣仆身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第二处也可译作“你百姓中间”。希伯来语三处使用同一个介词；结合上下文，这里译作青蛙爬到法老及其臣民身上，成为临到他们的灾害。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה
  choice: 到你身上
  rationale: 介词 בְּ 与动词 עָלָה 连用，在蛙灾语境中表示青蛙爬上并侵扰法老本人；“到你身上”既自然，也保留了直接临到人的意味。
- source_word: וּבְעַמְּךָ
  choice: 你百姓身上
  rationale: 沿用三个 בְּ 短语的平行结构，表达灾害临到法老的百姓；也可能按汉语习惯理解为“你百姓中间”，故加注说明。
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: 你所有臣仆身上
  rationale: עֶבֶד 可指仆人、奴仆或王室臣属；法老受命的宫廷语境中，“臣仆”既体现臣属关系，又不将身份过度限定为奴隶或官员。
- source_word: יַעֲלוּ
  choice: 必爬到
  rationale: עָלָה 的基本意思是“上去、升上来”；就青蛙从水中出来并爬到人身上的场景而言，“爬到”自然地体现其行动方式和向上的趋向。
- source_word: הַצְפַרְדְּעִים
  choice: 青蛙
  rationale: 指前文所预告的蛙灾。汉语以“青蛙”作复数集合称谓自然，无须另加复数标记。
