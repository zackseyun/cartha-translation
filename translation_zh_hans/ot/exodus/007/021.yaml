base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: zh_hans
  text: 尼罗河里的鱼死了，河水发臭，埃及人不能喝尼罗河的水[a]。埃及全地都有血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“尼罗河”的希伯来语יְאֹר，字面意思是“河流”，但在《出埃及记》中具体指尼罗河。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: 鱼
  rationale: 该词在此为集合意义，指河中的鱼类；汉语用“鱼都死了”自然地表达整体受害。
- source_word: יְאֹר
  choice: 河
  rationale: 在《出埃及记》的语境中明确指尼罗河；正文采用简洁自然的“河”，并以脚注说明具体所指，保留该词本义与语境指称之间的关系。
- source_word: מֵתָה
  choice: 都死了
  rationale: 忠实表达完成的死亡事件；“都”与集合名词“鱼”搭配，体现河中鱼类整体死亡。
- source_word: וַיִּבְאַשׁ
  choice: 河水发臭
  rationale: 该动词表示变得腐臭或发出恶臭；“发臭”在现代汉语中直接、有力，也符合灾祸叙事。
- source_word: וְלֹא יָכְלוּ
  choice: 不能再
  rationale: 表达实际上的无能为力；“再”自然承接河水变臭后的结果，并未改变其基本语义。
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: 喝河里的水
  rationale: 明确保留“喝”“水”和水源三项内容，同时符合现代汉语习惯。
- source_word: וַיְהִי הַדָּם
  choice: 到处都是血
  rationale: 结合后面的范围短语，以汉语存在句表达“有血”的状态；“到处”体现遍及全境。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: 埃及全境
  rationale: 准确、简洁地表达“埃及全地”，并与“到处”共同传达分布范围。
