base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: zh_hans
  text: 于是，法老也召来智者和术士；这些埃及的法师也用自己的秘术[a]照样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “秘术”也可译作“法术”或“咒术”。希伯来语原词可指隐秘的法术或咒术，确切含义不能确定。
    reason: 保留 בְּלַהֲטֵיהֶם 的词义范围及其不确定性。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: 本句语境是法老命人把这些宫廷人员召到面前；“召来”既体现召唤之意，也符合现代汉语叙事习惯。
- source_word: חֲכָמִים
  choice: 智者
  rationale: 该词指有智慧、学识或专门知识的人；“智者”简洁自然，又不额外限定其具体宫廷职务。
- source_word: מְכַשְּׁפִים
  choice: 术士
  rationale: 该词指施行巫术的人。“术士”保留其巫术色彩，并与后面的 חַרְטֻמִּים 区分。
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: 埃及的术法师
  rationale: 此词在《出埃及记》中指埃及宫廷中从事仪式和法术的专门人员；“术法师”清楚表达其叙事角色，同时不同于前面的“术士”。
- source_word: בְּלַהֲטֵיהֶם
  choice: 用他们的秘术
  rationale: 介词 בְּ 表示所用手段；“秘术”能涵盖法术、咒术或隐秘技艺等可能含义，不把原文未说明的机制解释为真实超自然能力或纯粹骗术。
- source_word: כֵּן
  choice: 照样
  rationale: 该词回指前文亚伦所行之事，表示埃及术法师作出了相同的外在结果；“照样”在汉语中自然明确。
theological_decisions:
- issue: 埃及术法师能力的性质
  choice: 采用现象性叙述：“用他们的秘术照样做了”
  alternative: 明确说他们凭邪灵施行真实神迹，或明确说他们只是以幻术和欺骗仿冒
  rationale: 希伯来文只叙述他们借助 לַהֲטִים 照样做了，并未说明其背后的形上机制。译文因此保留叙事陈述，不替经文判定这是超自然能力、幻术还是骗术。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“智者”“术士”“术法师”既保持原文三个称谓的差别，也避免使用过于古奥或带有特定宗派解释的术语。分号呈现前后两个相连动作，使句子清晰流畅。
