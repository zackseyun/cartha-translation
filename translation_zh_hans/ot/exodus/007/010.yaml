  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יַּ֣עַשׂוּ כֵ֔ן כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַ/יַּשְׁלֵ֨ךְ אַהֲרֹ֜ן אֶת מַטֵּ֗/הוּ לִ/פְנֵ֥י פַרְעֹ֛ה וְ/לִ/פְנֵ֥י עֲבָדָ֖י/ו וַ/יְהִ֥י לְ/תַנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: zh_hans
  text: 于是，摩西和亚伦进去见法老；他们照耶和华所吩咐的做了。亚伦把他的杖扔在法老面前，也扔在他的臣仆面前，杖就变成了蛇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蛇”所译的希伯来语为 tannin，也可指龙状生物或大型爬行动物；在这里，它很可能指亚伦在法老面前所行神迹中的蛇。
    reason: 保留 תַּנִּין 的较宽广语义范围，避免将正文“蛇”理解为该词唯一可能的含义。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 到……那里
  rationale: 该动词虽为单数形式，却位于“摩西和亚伦”这一并列主语之前，按希伯来语叙事句法统摄二人；“到法老那里”自然表达他们进入法老面前的场景。
- source_word: וַיַּעֲשׂוּ כֵן כַּאֲשֶׁר צִוָּה
  choice: 照……所吩咐的做了
  rationale: 既表达他们执行命令，也保留行动与先前吩咐相符的意思，符合现代汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，不用“主”这一称号替代。
- source_word: וַיַּשְׁלֵךְ
  choice: 丢
  rationale: 该动词表示投掷或扔下；“丢”简洁自然，并能表达亚伦将杖掷在众人面前的动作。
- source_word: מַטֵּהוּ
  choice: 自己的杖
  rationale: 后缀指亚伦所有；“杖”准确且符合本段神迹叙事的常用表达。
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: 在……和……面前
  rationale: 保留该介词的重复所凸显的公开性，并明确此事发生在法老及其臣仆眼前。
- source_word: עֲבָדָיו
  choice: 法老的臣仆
  rationale: 该词基本义为仆人或臣属，在王宫语境中指服侍法老的臣下；“臣仆”兼顾词义和宫廷背景。
- source_word: וַיְהִי לְתַנִּין
  choice: 杖就变成了大蛇
  rationale: 中文补出“杖”以免代词指向含混；תַנִּין 的范围可包括蛇、巨型爬行动物或龙状生物，本处作为杖所变成的神迹形态，正文译“大蛇”最自然，同时以脚注保留其较宽词义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名，因此正文保留专名而不以“主”代替；“耶和华”是现代中文圣经语境中最通行、最易识别的形式。
- issue: תַנִּין 的指称
  choice: 大蛇
  alternative: 龙状生物或大型爬行动物
  rationale: 该词本身比普通“蛇”涵盖更广，在不同经文中可指海中巨兽或龙状生物。本节是杖在法老面前变化的神迹，译作“大蛇”契合近距离叙事语境，但不应抹去原词的宽广语义，故在脚注说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。重复“法老”而不用连续代词，使“在法老和法老的臣仆面前”的公开场景清楚，也对应原文重复的 לִפְנֵי。
