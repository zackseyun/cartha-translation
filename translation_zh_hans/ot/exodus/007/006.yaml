  text: וַ/יַּ֥עַשׂ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹתָ֖/ם כֵּ֥ן עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: zh_hans
  text: 摩西和亚伦就照着雅威[a]所吩咐他们的去做；他们就这样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”；传统译作“耶和华”。
    reason: 说明原文神名及其传统中文译法。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 去做
  rationale: עָשָׂה可表示“做、行”。这里指遵行命令；译作“去做”符合现代汉语叙事，也与句末同一动词的重复相呼应。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: 摩西和亚伦
  rationale: 采用这两个人名在现代简体中文圣经语境中的通行译名，并保留原文的并列关系。
- source_word: כַּאֲשֶׁר
  choice: 照……的
  rationale: 表达他们的行动与所领受命令相符；“照……吩咐的”自然清楚，不额外强化原文未明说的程度。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צוה表示发出命令。“吩咐”在此庄重而自然，能体现命令的权威性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名YHWH，保留其作为专名的性质，而不以称号代替。
- source_word: אֹתָם
  choice: 他们
  rationale: 第三人称阳性复数宾语后缀指摩西和亚伦，直译为“他们”。
- source_word: כֵּן עָשׂוּ
  choice: 他们就是这样做了
  rationale: 保留כֵּן所指的“这样”以及עָשָׂה在句中的重复，突出他们确实按命令而行。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现YHWH，避免把神名默默替换为称号；脚注说明传统译法。
- issue: 是否弱化句末重复
  choice: 保留“做”的重复
  alternative: 合并为一句“完全遵命而行”
  rationale: 原文先说摩西和亚伦做了，又以“他们就是这样做了”复述，形成强调。保留这一结构，不把它解释性改写为“完全”或删去。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“照……吩咐他们的去做”体现顺服命令，“他们就是这样做了”有意保留希伯来文的复述强调；正文中的[a]与脚注对应。
