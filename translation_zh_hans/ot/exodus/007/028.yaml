translation_notes:
  register: 采用现代、庄重而具画面感的叙述。通过分号组织逐层推进的地点清单，并保留从法老私人空间扩展到臣仆、百姓及食物制作器具的侵入次序。所有第二人称单数均按法老这一受话者处理。
