revisions:
- from: 尼罗河里要挤满青蛙；它们要爬上来，进入你的宫殿、你的卧室，跳到你的床上；也要进入你臣仆的房屋和你百姓的住处，还要钻进你的炉灶和揉面盆[a]。
  to: 尼罗河将满是青蛙；它们要上来，来到你的房屋、你的卧室和你的床上，来到你臣仆的房屋和你百姓中间，也来到你的炉子和揉面盆[a]。
  rationale: 修订以中性的“来到”承接原文对一连串地点的描述，保留“床上”的介词意义，并避免将法老的房屋限定为宫殿、将百姓限定为其住处，或补入青蛙的特定移动方式。
