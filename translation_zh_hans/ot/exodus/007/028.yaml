base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: zh_hans
  text: 尼罗河将满是青蛙；它们要上来，来到你的房屋、你的卧室和你的床上，来到你臣仆的房屋和你百姓中间，也来到你的炉子和揉面盆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“揉面槽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: 要挤满
  rationale: שׁרץ描写小动物大量滋生、成群涌动；“挤满”在现代汉语中生动地表现尼罗河中遍布青蛙的景象，并由灾祸预告的语境表达将来意义。
- source_word: הַיְאֹר
  choice: 尼罗河
  rationale: 在《出埃及记》的埃及背景中，יְאֹר特指尼罗河；明确译出河名比泛称“河”更清楚。
- source_word: צְפַרְדְּעִים
  choice: 青蛙
  rationale: 该复数名词的直接、通行译法。
- source_word: וְעָלוּ
  choice: 要爬上来
  rationale: עלה在此描写青蛙从河中上到陆地和住宅；“爬上来”既保留向上的方向，也符合青蛙成群侵入的画面。
- source_word: וּבָאוּ
  choice: 进入／跳到／钻进
  rationale: בוא配合各介词短语表示到达或进入。根据目的地分别用自然的汉语动词表达：进入房屋、跳到床上、钻进器具；不改变其连续侵入各处的基本意义。
- source_word: בְּבֵיתֶךָ
  choice: 你的宫殿
  rationale: 字面是“你的房屋”。受话者是法老，现代汉语称其住所为“宫殿”自然且能明确所指；仍指实体住所，不取抽象的“家族”。
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: 你的卧室
  rationale: 原文直译为“你睡卧的房间”；“卧室”是准确、简洁的现代对应。
- source_word: וְעַל מִטָּתֶךָ
  choice: 跳到你的床上
  rationale: 保留עַל明确的“在……上”之意；补出“跳到”使青蛙移动至床上的画面在汉语中自然清楚。
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: 你臣仆的房屋
  rationale: בֵית虽为单数形式，但与复数“臣仆”结合可作分配或集合理解；“房屋”保留这种表达，不强行逐户细分。עֲבָדֶיךָ在法老语境下译为“臣仆”比“奴隶”更稳妥。
- source_word: וּבְעַמֶּךָ
  choice: 你百姓的住处
  rationale: 原文为“在你的百姓中／那里”。由于前面的בוא统摄地点序列，汉语补出“住处”，清楚表达灾祸扩及百姓，同时避免把“进入百姓”译得生硬。
- source_word: וּבְתַנּוּרֶיךָ
  choice: 你的炉灶
  rationale: תַּנּוּר指烘烤食物的炉或炉灶；“炉灶”通俗自然，并保留家用烹饪设施的含义。
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: 你的揉面盆
  rationale: מִשְׁאֶרֶת指预备面团所用的容器；“揉面盆”是清楚的现代说法。容器具体形制可能是盆或槽，故以脚注保留另一译法。
