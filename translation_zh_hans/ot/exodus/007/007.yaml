  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: zh_hans
  text: 当他们向法老说话时，摩西八十岁，亚伦八十三岁。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 按字面可译作：“当他们向法老说话时，摩西是八十年的儿子，亚伦是三又八十年的儿子。”
    reason: 说明希伯来语以“……年的儿子”表示年龄的惯用结构，以及“三又八十”的原文数词次序。
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: ……岁
  rationale: 希伯来语按字面是“……年的儿子”，属于表示年龄的惯用语；现代汉语自然表达为“……岁”。
- source_word: שְׁמֹנִים שָׁנָה
  choice: 八十岁
  rationale: 按现代汉语习惯表达摩西的年龄。
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: 八十三岁
  rationale: 希伯来语数词次序按字面为“三又八十”，现代汉语通常说“八十三”。
- source_word: בְּדַבְּרָם
  choice: 他们……说话时
  rationale: 介词בְּ加带代词后缀的不定式结构在这里表示时间情境，即“当他们说话时”。
- source_word: אֶל
  choice: 向
  rationale: 用于说话对象时，“向”是自然且准确的现代汉语对应表达。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用该埃及君王称号在现代汉语圣经语境中的标准译名。
- source_word: וּ
  choice: 不单独译出／以并列结构体现
  rationale: 句首连接词承接上下文；现代汉语无需机械译作“而”或“这时”，句内并列关系则用标点自然体现。
