  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: zh_hans
  text: 早晨，你到法老那里去。看，他正往水边去；你要站在尼罗河[a]岸边迎见他，并把那根曾变成蛇[b]的杖拿在手里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“河”。希伯来语 יְאֹר 在《出埃及记》中通常特指尼罗河。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语 נָחָשׁ 是指蛇的常用词。
    reason: lexical_note
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: 你到法老那里去
  rationale: לֵךְ是阳性单数祈使式，אֶל表示朝向某人；译文采用现代汉语中自然、直接的命令表达。
- source_word: בַּבֹּקֶר
  choice: 早晨
  rationale: 这是时间状语；置于句首，简洁保留原文语序和叙事节奏。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留其提醒听者注意随后情景的指示作用，同时避免使用较古雅的“看哪”。
- source_word: יֹצֵא הַמַּיְמָה
  choice: 他正要到水边去
  rationale: יֹצֵא是分词，可表达正在发生或即将出现的情景；הַמַּיְמָה带方向词尾，表示朝水那里去。“正要……去”符合上帝预告摩西将遇见法老的语境。
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: 你要站在……迎着他
  rationale: נצב的尼法勒式在此表示站定、就位；לִקְרָאתוֹ表示迎面相遇。此译法保留站立的位置动作及迎见意味。
- source_word: עַל שְׂפַת הַיְאֹר
  choice: 在尼罗河岸边
  rationale: שָׂפָה在此指水域边缘或河岸；יְאֹר在《出埃及记》的埃及背景中具体指尼罗河，故正文采用专名，并以脚注保留较直译的可能。
- source_word: הַמַּטֶּה
  choice: 杖
  rationale: מַטֶּה可指杖或棍；“杖”简洁、庄重，也符合这件叙事物品在上下文中的称呼。
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: 曾变成蛇
  rationale: נֶהְפַּךְ表示发生转变；中文“变成”无需强行补出施事者，保留希伯来语形式未明说施事者的特点。נָחָשׁ通常指蛇。
- source_word: תִּקַּח בְּיָדֶךָ
  choice: 拿在手里
  rationale: 未完成式在连续命令中具有指令作用；保留“在你手中”的具体意象，同时采用自然现代汉语。
theological_decisions:
- issue: יְאֹר所指水域的具体性
  choice: 尼罗河
  alternative: 河
  rationale: 在《出埃及记》的埃及叙事中，该词通常特指尼罗河。采用“尼罗河”有助于明确历史地理背景，同时以脚注保留字面上较宽泛的译法。
- issue: נֶהְפַּךְ的施事关系
  choice: 曾变成
  alternative: 曾被变成
  rationale: 原文没有明说施事者。“曾变成”既符合中文习惯，也不额外判定该动词在此应作被动还是中间意义，从而保留原文的形式张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“看”保留原文提示注意的语气；分号划分预告情景与随后命令，使长句易于普通读者理解。脚注标记均置于正文相应词语之后。
