source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: zh_hans
  text: 你要对他说：“雅威——希伯来人的上帝——派我到你这里来，说：‘放我的百姓走，好让他们在旷野侍奉[a]我。看哪，直到如今你还没有理会。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜我”。希伯来语动词既可泛指服事，也可特指宗教意义上的敬拜。
    reason: 说明 עבד 的词义范围，避免将“侍奉”误解为排除敬拜，也避免正文将意义限定为礼仪性敬拜。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译保留四字神名，避免用称号代替专名。
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: 希伯来人的上帝
  rationale: 保留原文的族群称谓“希伯来人”，不将其顺译为“以色列人”。
- source_word: שְׁלָחַנִי אֵלֶיךָ
  choice: 差我到你这里来
  rationale: 表达已经完成且对当前仍具效力的差遣；“到你这里来”是自然、明确的现代汉语。
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: 让我的百姓走
  rationale: 准确表达命令法在本语境中的释放要求，也保留出埃及叙事中反复出现的公式。
- source_word: וְיַעַבְדֻנִי
  choice: 好让他们……侍奉我
  rationale: 前缀动词在命令之后表示目的；“侍奉”既可涵盖一般服事，也可涵盖宗教敬拜，不将词义过早收窄。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”符合 מִדְבָּר 所指的荒僻未耕之地，且不限定为纯粹沙漠。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留引人注意并带有责问意味的话语标记，同时维持庄重语体。
- source_word: לֹא שָׁמַעְתָּ
  choice: 你还没有听从
  rationale: שׁמע 在此不只是听见，而是听取并照办；“听从”在现代汉语中自然地保留听与服从的语义联系。
- source_word: עַד כֹּה
  choice: 直到如今
  rationale: 准确表达“直至此刻”的时间意义，并与经文的庄重语气相称。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；采用“雅威”保留其专名性质，而不以称号“主”替代。
- issue: וְיַעַבְדֻנִי 在出埃及要求公式中的含义
  choice: 侍奉我
  alternative: 敬拜我
  rationale: עבד 可泛指服事，也可包括宗教敬拜；“侍奉”保留这种神学与词义上的宽度，脚注说明较窄的语境译法。
- issue: לֹא שָׁמַעְתָּ 所表达的回应
  choice: 还没有听从
  alternative: 还没有听；还没有顺从
  rationale: 法老已经听见要求却未予理会。“听从”传达未听取、未照办的含义，同时不把原词完全改写成单一的“服从”。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“你要对他说”保留指令语气；破折号突出“希伯来人的上帝”对“雅威”的同位说明；引语层级清楚。正文将脚注标记置于其实际所解释的“侍奉”之后。
