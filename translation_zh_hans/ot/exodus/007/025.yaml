  language: zh_hans
  text: 雅威击打尼罗河[b]以后，满了七天[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威击打尼罗河以后，过了七天。”
    reason: lexical_alternative
  - marker: b
    text: “尼罗河”所译的希伯来词有时也可较笼统地译作“河”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: 满了
  rationale: 该词为מלא的尼法勒式，表示一段时间达到完整或终点。“满了”既保留结果性的表达，也符合现代汉语的经文语体；脚注列出更口语化的“过了”。
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 忠实表达原文的数词与名词组合，指一段七日的时间。
- source_word: אַחֲרֵי
  choice: 以后
  rationale: 表达清楚的时间先后关系；置于“雅威击打尼罗河”之后，符合自然汉语句法。
- source_word: הַכּוֹת
  choice: 击打
  rationale: נכה的不定式结构与אַחֲרֵי连用，意为“在……击打以后”。“击打”清楚保留灾祸审判语境中的动作力度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其作为上帝专名的功能音译四字神名，不以称号替代。
- source_word: הַיְאֹר
  choice: 尼罗河
  rationale: יְאֹר在《出埃及记》的埃及语境中特指尼罗河；正文直接点明所指，脚注保留较宽泛的“河”这一译法。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用上帝的专名；采用较贴近YHWH通行学术拟音的“雅威”，以专名而非“主”等称号呈现。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语。句序按汉语习惯先交代“雅威击打尼罗河”这一时间参照，再说“满了七天”；“满了”保留原文时间达到完整的意味，同时以脚注提供更自然口语化的“过了”。
