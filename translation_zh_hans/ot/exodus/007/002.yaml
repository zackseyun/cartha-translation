revisions:
- from: 凡我吩咐你的，你都要说；你的兄弟亚伦要对法老说，叫法老把以色列的子孙[a]从他的国中放出去。
  to: 凡我所吩咐你的，你都要说；你的兄弟亚伦要对法老说，好叫法老把以色列的子孙[a]放走，离开他的地。
  rationale: 修订仅改善汉语表达并更直接对应“从他的地离开”。“好叫”保留原文在亚伦对法老说话与法老释放以色列人之间的目的／预期结果关系，不强加法老必然顺服的含义。
