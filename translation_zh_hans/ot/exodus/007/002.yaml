  text: אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כָּל אֲשֶׁ֣ר אֲצַוֶּ֑/ךָּ וְ/אַהֲרֹ֤ן אָחִ֨י/ךָ֙ יְדַבֵּ֣ר אֶל פַּרְעֹ֔ה וְ/שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: zh_hans
  text: 凡我所吩咐你的，你都要说；你的兄弟亚伦要对法老说，好叫法老把以色列的子孙[a]放走，离开他的地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“以色列人”；原文直译为“以色列的众子”。传统译法是“以色列的儿女”。
    reason: 说明 בְּנֵי יִשְׂרָאֵל 的字面形式及常见整体族群译法。
lexical_decisions:
- source_word: תְדַבֵּר
  choice: 你都要说
  rationale: 该动词在委任语境中带有指令意味；“要说”自然明确，“都”与前面的“凡……的”共同表达全面性。
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: 凡我吩咐你的
  rationale: 保留“所有我所吩咐的”这一完整范围；未把未完成体强行限定为单次现在或将来命令。
- source_word: אַהֲרֹן אָחִיךָ
  choice: 你的兄弟亚伦
  rationale: 依照希伯来语只译作“兄弟”，不根据其他资料在本节中增添“哥哥”这一年龄关系。
- source_word: יְדַבֵּר אֶל־פַּרְעֹה
  choice: 要对法老说
  rationale: 直译其说话对象，不用“告诉”预先限定话语的具体性质。
- source_word: וְשִׁלַּח
  choice: 叫法老……放出去
  rationale: 使役动词表达准许或打发离开的意思；“叫”体现亚伦讲话所指向的目的或结果。为避免汉语代词指向不清，重复“法老”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留原文“以色列之子”的亲属和族裔表达，同时采用现代汉语中较自然且涵盖整个群体的“子孙”。
- source_word: מֵאַרְצוֹ
  choice: 从他的国中
  rationale: מִן 表示离开；此处“国”自然表达法老统治的土地，“他的”保留原文所属关系。
theological_decisions:
- issue: וְשִׁלַּח 所表达的关系
  choice: 译为目的或预期结果：“叫法老……放出去”
  alternative: “法老就会……放出去”或“并让他……放出去”
  rationale: 连接词加完成式在此可承接亚伦对法老说话所要达成的结果；该译法不把法老必然顺服说得过强，也不把经文改成直接引语中的命令。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“凡……都……”体现原文的全面性；分号呈现摩西与亚伦两项平行任务。“你的兄弟亚伦”虽不如传统的“你哥哥亚伦”常见，却避免在本节中加入原文未明说的长幼关系。
