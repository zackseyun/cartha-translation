base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“法老的心顽梗[a]，不肯放百姓走。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“沉重”；这里比喻法老心意顽梗、执拗。也可译作“法老的心刚硬”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未机械译出连接词 וַ；在单节呈现中，汉语直接用“说”即可自然承接叙事，时序由上下文表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最通行且易识别的音译，保留其作为专名的功能，不以“主”这一称号替代。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代汉语中通行的人名译法。
- source_word: כָּבֵד לֵב פַּרְעֹה
  choice: 法老的心顽梗
  rationale: כָּבֵד 字面为“沉重”，在此以“心”为主语，表达顽固、不响应的状态；正文用自然中文“顽梗”，脚注保留“沉重”的原文意象。
- source_word: מֵאֵן
  choice: 不肯
  rationale: 该形式描述法老持续拒绝、无意顺从的状态；“不肯”简洁自然，并与后面的不定式顺畅衔接。
- source_word: לְשַׁלַּח
  choice: 放……走
  rationale: 在出埃及记语境中指准许百姓离开；“放……走”准确而符合现代汉语习惯。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文仅说“这百姓/百姓”，语境所指为以色列民；不在正文额外补出“以色列”。
theological_decisions:
- issue: 如何表达法老之心的状态而不抹平刚硬主题中的用词差异
  choice: 法老的心顽梗
  alternative: 法老的心沉重
  rationale: 本节使用 כָּבֵד（“沉重”），而非其他常译作“刚硬”的词根。正文以自然汉语传达其顽固、不响应之意，同时借脚注指出字面意象，从而保留原文在法老刚硬叙事中的词汇差异。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“顽梗”较“心沉重”更能让普通读者直接理解此处含义，同时脚注保留希伯来语的具体比喻及译法张力。
