base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/018.yaml
  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: zh_hans
  text: 尼罗河[a]里的鱼必死，河水必发臭；埃及人将无法喝尼罗河里的水[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“河”；这里特指尼罗河。
    reason: lexical_alternative
  - marker: b
    text: 或译：“埃及人试图喝尼罗河里的水，必疲惫不堪。”希伯来语动词可表示疲乏，或因疲乏而不能继续。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: 鱼
  rationale: 希伯来语为集合名词，统指河中的鱼类；现代汉语用“鱼”即可自然表达集合意义。
- source_word: יְאֹר
  choice: 尼罗河
  rationale: 该词本义可指“河”，但在《出埃及记》的埃及语境中特指尼罗河；正文明确译出所指，并以脚注保留原词较宽的字面意义。
- source_word: תָּמוּת
  choice: 必死
  rationale: 直接表达מות的死亡含义；“必”自然体现此处预告将发生之事的语气。
- source_word: וּבָאַשׁ
  choice: 必发臭
  rationale: באש表示变得恶臭；“发臭”准确、鲜明，也符合现代汉语习惯。
- source_word: וְנִלְאוּ
  choice: 将无法
  rationale: לאה的尼法勒式含有疲乏、因疲乏而不能继续之意；结合饮用受污染河水的语境，正文采用结果性的“无法”，脚注保留“尝试而疲惫”的过程含义。
- source_word: לִשְׁתּוֹת מַיִם
  choice: 喝……里的水
  rationale: 保留希伯来语中“喝水”的明确宾语，同时按汉语语序与后面的来源短语整合。
- source_word: מִן הַיְאֹר
  choice: 尼罗河里的
  rationale: 自然表达水取自尼罗河；相比生硬的“从尼罗河喝水”，更符合现代汉语搭配。
theological_decisions: []
