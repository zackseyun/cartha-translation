  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: zh_hans
  text: 随后，他们来到以琳[a]。那里有十二处泉水和七十棵棕榈树[b]；他们就在水边[c]安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按原文句式译：“随后，他们来到以琳；那里有十二处泉水和七十棵棕榈树。”
    reason: lexical_alternative
  - marker: b
    text: “棕榈树”也可更具体地译作“海枣树”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他们就在水旁安营。”希伯来语此处的“水”为复数形式，但常用作集合意义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 后来，他们来到
  rationale: 该叙事性连续式推动事件向前发展；“后来”自然表达承接关系，“来到”也体现了地点名所带的方向后缀。
- source_word: אֵילִמָה
  choice: 以琳
  rationale: 按通行中文形式音译地名；原文的方向后缀已由“来到”表达。
- source_word: וְשָׁם
  choice: 那里有
  rationale: 原义为“而在那里”；分句译作“那里有”，符合现代汉语表达，同时保留地点指向。
- source_word: עֵינֹת מַיִם
  choice: 水泉
  rationale: עַיִן在此指自然涌出的泉水或水源；“水泉”简洁、清楚，并符合绿洲语境。
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: 和七十棵棕榈树
  rationale: תָּמָר指棕榈类树木，很可能是海枣树；正文采用较宽泛且易懂的“棕榈树”，较具体的译法列入脚注。
- source_word: וַיַּחֲנוּ
  choice: 他们……安营
  rationale: חנה意为扎营或安营；“安营”自然、庄重，也适合叙事文体。
- source_word: עַל הַמָּיִם
  choice: 在水边
  rationale: 介词עַל在此表示邻近，而不是位于水面之上；“在水边”符合现代汉语和上下文。
