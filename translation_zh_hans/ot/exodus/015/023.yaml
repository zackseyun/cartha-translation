base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: zh_hans
  text: 他们来到玛拉[a]，却不能喝玛拉那里的水，因为水是苦的。因此，那地方名叫玛拉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛拉”这个名字在希伯来语中与“苦”一词相近。
    reason: 说明原文以地名“玛拉”和“苦”构成的命名双关；中文音译本身无法完整传达。
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们来到
  rationale: 承接上文推进叙事；现代汉语无需机械译出连接词，也能自然表达先后关系。
- source_word: מָרָתָה
  choice: 来到玛拉
  rationale: 地名带方向词尾，表示朝向并到达；“来到玛拉”符合现代汉语叙事表达。
- source_word: וְלֹא יָכְלוּ
  choice: 却不能
  rationale: 连接词在此形成抵转，突出他们虽已到达却无法饮水。
- source_word: לִשְׁתֹּת מַיִם מִמָּרָה
  choice: 喝玛拉那里的水
  rationale: מן表明水的来源；“玛拉那里的水”比生硬的“来自玛拉的水”更自然，同时保留地点关系。
- source_word: כִּי מָרִים הֵם
  choice: 因为水是苦的
  rationale: כִּי表达原因；希伯来语复数谓语与复数形态的מַיִם呼应，汉语将其自然译为集合意义的“水是苦的”。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 保留由水苦而得名的推论和解释关系。
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: 那地方名叫玛拉
  rationale: 原文动词为第三人称阳性单数而未明说主语，可作非特指的命名表达；汉语用“名叫”自然呈现，不擅自补出命名者。
- source_word: מָרָה / מָרִים
  choice: 玛拉／苦的
  rationale: 地名按音译作“玛拉”，形容词译作“苦的”；借脚注说明二者在希伯来语中的语音和词义关联。
