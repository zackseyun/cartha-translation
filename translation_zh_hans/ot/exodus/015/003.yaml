base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/003.yaml
  text: Yahweh is a warrior[b][a]; Yahweh is his name.
translation:
  language: zh_hans
  text: 雅威[a]是战士[b]；雅威是他的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH；也常译作“耶和华”。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“战争之人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名 YHWH，保留经文所用的专名，而不以称号替代。
- source_word: אִישׁ מִלְחָמָה
  choice: 战士
  rationale: 希伯来语直译为“战争之人”，在这里是表示善战者的诗歌性短语；“战士”在现代汉语中自然凝练，并保留其军事意象。
- source_word: שְׁמוֹ
  choice: 是他的名
  rationale: 原文为无系词句“雅威——他的名”；汉语补出“是”，既自然，也保留对神名的强调认定。
theological_decisions:
- issue: 如何译写神名 יְהוָה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文两次直接使用四字神名；正文采用较接近学界通行重构读音的“雅威”，并用脚注保留汉语传统译名“耶和华”。
- issue: אִישׁ מִלְחָמָה 应按字面译还是按习语译
  choice: 战士
  alternative: 战争之人
  rationale: 该结构字面为“战争之人”，语境中指作战者。“战士”避免生硬汉语，同时脚注交代原文形式，不削弱诗句把雅威描绘为参战者的强烈意象。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语，保留希伯来诗句的两分节奏与神名的重复；不把军事意象弱化为抽象的“有能力者”。
