  yaml_path: translation/ot/exodus/015/005.yaml
  text: The depths covered them[a]; they went down into the depths like a stone.
translation:
  language: zh_hans
  text: 深水淹没了他们[a]；他们下到深处，像石头一样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“深渊覆盖了他们；他们沉入深处，像石头一样。”
    reason: 保留 תְּהֹמֹת 可译作“深渊”，并提供在水中语境下将 יָרְדוּ 译为“沉入”的自然表达；正文则较直接保留“下去、下降”的动词意象。
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: 深水
  rationale: 该词是 תְּהוֹם 的复数，指深邃的水域或深渊。译作“深水”既符合海水淹没埃及人的语境，也与后面的“深处”区分开来，保留希伯来文两个不同词语的变化。
- source_word: יְכַסְיֻמוּ
  choice: 淹没了他们
  rationale: כסה 的基本义是“遮盖、覆盖”；以水为主语时，“淹没”是自然、准确的现代汉语表达，宾语代词明确译出。
- source_word: יָרְדוּ
  choice: 沉入
  rationale: ירד 原义为“下去、下降”。在进入海洋深处的语境中，“沉入”自然表达向下运动，但不额外断定其原因。
- source_word: בִמְצוֹלֹת
  choice: 深处
  rationale: מְצוֹלָה 指深处，尤其是水域深处。介词 ב־ 随运动动词按汉语习惯译为“入”；“深处”保留诗歌意象，并避免与 תְּהֹמֹת 使用完全相同的措辞。
- source_word: כְּמוֹ
  choice: 如同
  rationale: 比较词译为“如同”，简明而有诗歌庄重感。
- source_word: אָבֶן
  choice: 石头
  rationale: 常用名词，直译为“石头”，与下沉的比喻相符。
