    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作时间副词，承接前述上帝的拯救行动及其在列国中引起的反应；“那时”自然庄重。
- source_word: נִבְהֲלוּ
  choice: 惊惶失措
  rationale: בהל 的尼斐勒形表达惊恐、慌乱；此译体现得胜之歌中强烈的恐惧反应。
- source_word: אַלּוּפֵי אֱדוֹם
  choice: 以东的族长
  rationale: אַלּוּף 可指部族或宗族的首领；“族长”保留其领导身份，又不误译为王室官爵。
- source_word: אֵילֵי מוֹאָב
  choice: 摩押的权贵
  rationale: אֵילֵי 本义与强壮、有力者相关，此处与以东首领平行，指摩押有权势、居领导地位的人；“权贵”兼顾力量与社会地位。
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: 被战栗抓住
  rationale: 保留 אחז“抓住”与 רָעַד“战栗”构成的拟人化意象，表达恐惧牢牢攫住他们。
- source_word: נָמֹגוּ
  choice: 吓得瘫软
  rationale: מוג 在恐惧语境中可表达融化、消解或丧胆；“吓得瘫软”以自然中文传达勇气消融、无力抵抗之意。
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: 迦南所有的居民
  rationale: 直接表达分词结构所指的全体居住者，并保留 כֹּל 的整体范围。
