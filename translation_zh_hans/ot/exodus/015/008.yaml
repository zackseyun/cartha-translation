  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: zh_hans
  text: 因你鼻孔所出的气息[a]，众水堆积起来；流动的水如堆垒般立住[b]；深渊在海的中心[c]凝结[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因你鼻孔吹出的强风。”原词可指风或气息。
    reason: lexical_alternative
  - marker: b
    text: “堆垒”反映原文名词的“堆、垒”之意；有些译本根据过海叙事的相关意象译作“墙”。
    reason: lexical_alternative
  - marker: c
    text: 直译：“在海的心中”，即在海的中央或当中。
    reason: lexical_alternative
  - marker: d
    text: 或译：“凝固”或“冻结”。原文动词可表示变稠或凝结。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: 因你鼻孔所发的气息
  rationale: רוּחַ可指风、气息或灵；与“鼻孔”连用时，描绘强劲呼气的诗歌意象。“鼻孔所发的气息”保留拟人表达，同时在现代汉语中自然庄重。
- source_word: נֶעֶרְמוּ מַיִם
  choice: 众水堆积起来
  rationale: נֶעֶרְמוּ表示聚成堆、堆积；“众水”既体现复数集合意象，也符合诗体语域。
- source_word: נִצְּבוּ
  choice: 立住
  rationale: 该动词表示站立、停立；“立住”比单纯“停住”更能保存水仿佛站立的鲜明意象。
- source_word: כְמוֹ נֵד
  choice: 像垒堆一样
  rationale: נֵד本义较接近堆积起来的一堆或垒堆，并不直接等同于“墙”；“垒堆”既保留词义，也表达聚集成高堆的形态。
- source_word: נֹזְלִים
  choice: 水流
  rationale: 这是源自“流动”一词的分词，用作名词时可指流动之水；“水流”简洁自然，并保留动态特征。
- source_word: קָפְאוּ
  choice: 凝结
  rationale: 该词可表示变稠、凝结或凝固；“凝结”避免将古代诗歌意象限定为现代物理意义上的结冰。
- source_word: תְהֹמֹת
  choice: 深渊
  rationale: 复数形式指深处的水或海洋深渊；“深渊”保留诗歌的宏阔感，语境也表明所指为深海之水。
- source_word: בְּלֶב יָם
  choice: 在海心
  rationale: 原文直译为“在海的心中”，意即海的中央或深处；“海心”在汉语诗体中可理解，并保存原文隐喻。
theological_decisions:
- issue: 海之歌中对上帝的拟人描写
  choice: 保留“你鼻孔所发的气息”这一具体意象。
  alternative: 抽象译为“因你的怒气”或仅译作“因你的风”。
  rationale: 原文将רוּחַ与“鼻孔”直接相连，以身体意象描绘上帝大能的介入。保留这一诗歌性拟人表达，不以神学抽象说法取代原文。
translation_notes:
  register: 采用现代、庄重而带诗意的普通话。“众水”“立住”“海心”维持诗歌的平行结构和具象张力；句法清楚，适合普通读者朗读。
