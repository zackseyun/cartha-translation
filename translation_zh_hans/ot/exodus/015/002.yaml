base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: zh_hans
  text: '雅是我的力量，是我的歌；

    他成了我的救恩。

    这是我的上帝，我要赞美他[a]；

    他是我父亲的上帝，我要尊崇他。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要为他预备居所。”这里的希伯来语动词含义不确定，也可能含有使之华美或尊荣的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: 我的力量
  rationale: עֹז表示力量、能力；“我的力量”准确自然，也保留诗句中个人信靠的表达。
- source_word: וְזִמְרָת יָהּ
  choice: 雅是……我的歌
  rationale: זִמְרָה可指歌或颂歌；结合得胜之歌的语境，译作“我的歌”简洁有力。יָהּ是神名的短式，句法上与前面的“我的力量”和“我的歌”相连。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的短式，而非四字神名的完整形式；音译为“雅”，以保留原文在诗歌中的独特形式。
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: 他成了我的救恩
  rationale: היה加介词ל和名词可表达“成为某人的某物”；“成了我的救恩”保留结果意味和救赎用语的庄重感。
- source_word: זֶה אֵלִי
  choice: 这是我的上帝
  rationale: 直译指示词与名词短语，保留说话者强调认定这位神的语气。
- source_word: וְאַנְוֵהוּ
  choice: 我要赞美他
  rationale: 该动词词义有争议；“赞美”符合本诗的敬拜语境，并与下句“尊崇”形成平行。另一个重要解释在脚注中保留。
- source_word: אֱלֹהֵי אָבִי
  choice: 我父亲的上帝
  rationale: 原文“父亲”为单数并带第一人称后缀；此译法准确保留家族与信仰传承的关联。
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: 我要尊崇他
  rationale: רומם表示高举、尊崇；“尊崇”既保留高举的含义，也符合现代汉语敬拜语体。
theological_decisions:
- issue: 神名短式יָהּ的译法
  choice: 雅
  alternative: 耶和华
  rationale: 原文特意使用神名短式יָהּ，而不是完整的四字神名；保留短式可避免抹平原文的诗歌特色。
- issue: וְאַנְוֵהוּ的解释
  choice: 我要赞美他
  alternative: 我要为他预备居所
  rationale: “赞美”较符合上下句的诗歌平行和敬拜语境，但该词也可能与居所或华美有关，因此用脚注保留另一种重要理解，不把不确定处说成定论。
translation_notes:
  register: 采用自然、庄重而简洁的现代汉语诗体，以分行呈现希伯来诗歌的平行结构。“雅”保留神名短式的特色；争议动词在正文采取符合语境的译法，并以脚注呈现重要异读。
