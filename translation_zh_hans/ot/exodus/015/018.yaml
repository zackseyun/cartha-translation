base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/018.yaml
  text: Yahweh will reign forever and ever[a].
translation:
  language: zh_hans
  text: 雅威[a]必作王，直到永永远远。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 YHWH（יהוה），是上帝的名；中文传统常译作“耶和华”，这里音译作“雅威”。
    reason: 说明神名的原文形式及常见中文译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 作音译，以保留经文中的专名，而不以“主”这一称号代替。
- source_word: יִמְלֹךְ
  choice: 必作王
  rationale: 未完成式在颂歌宣告中可表达将来且确定的掌权；“必作王”自然保留 מלך 的君王意象，也传达庄严的宣告语气。
- source_word: לְעֹלָם וָעֶד
  choice: 直到永永远远
  rationale: 这是表示无尽久远的强化性固定表达；“直到永永远远”既保留重复加强的意味，也符合现代中文颂赞语体。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文音译为“雅威”，以保存其专名性质；脚注说明中文传统译名，避免把专名无提示地改成称号。
- issue: יִמְלֹךְ 的时间与语气
  choice: 必作王
  alternative: 作王；永远掌权
  rationale: 这里的未完成式既可侧重未来，也可在颂歌中宣告持续的王权。“必作王”保留未来指向和确定语气，同时不将其缩减为单纯的抽象“掌权”。
translation_notes:
  register: 采用简洁、庄严而可诵读的现代标准汉语。“必作王”呼应胜利之歌的君王宣告；“永永远远”保留希伯来语叠加强调的诗歌力度。
