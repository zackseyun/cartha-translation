base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: zh_hans
  text: '那时，摩西和以色列人向雅威[a]唱了这首歌，说：


    “我要向雅威歌唱，


    因为他大大得胜[b]；


    马和骑马的人，


    他都抛进海里。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统常译“耶和华”或“主”。
    reason: alternative_reading
  - marker: b
    text: 或译：“他极其崇高”。希伯来文以同一词根的重复形式加强语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为叙事时间标记，承接过海事件，引出随后的歌唱。
- source_word: יָשִׁיר
  choice: 唱了
  rationale: 虽为未完成式，但与 אָז 连用，在叙事中具有过去时效力。
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语中自然、准确的族群称谓；不机械译作“以色列的众子”，以免被误解为仅指男性。
- source_word: הַשִּׁירָה הַזֹּאת
  choice: 这首歌
  rationale: 直接保留名词和指示语，不增添“赞美”等原文未明说的内容。
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: 说
  rationale: 希伯来语的引语公式若逐字重叠为“说，说道”，现代汉语显得累赘；以“说”自然引出歌词。
- source_word: אָשִׁירָה
  choice: 我要……歌唱
  rationale: 第一人称祈愿式表达意愿或决心，并保留叙述主体为复数、歌词声音转为单数的变化。
- source_word: גָאֹה גָּאָה
  choice: 大大得胜
  rationale: 以“大大”体现不定式绝对形与限定动词重复所产生的加强语气；“得胜”契合过海叙境中的胜利含义。
- source_word: סוּס וְרֹכְבוֹ
  choice: 马和骑马的
  rationale: 保留希伯来诗歌的集合性单数及简练表达；“骑马的”自然体现与马的所属关系。
- source_word: רָמָה בַיָּם
  choice: 抛进海里
  rationale: 动词表示投掷、抛入；在汉语中用“进”明确动作方向，符合该介词在语境中的意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 正文音译四字神名，以保留其作为立约之名的性质；脚注说明传统译法及替代形式。
- issue: גָאֹה גָּאָה 的语义侧重
  choice: 大大得胜
  alternative: 极其崇高；大受尊崇
  rationale: 上下文直接描写雅威击败追兵，故正文采用胜利义；同时以脚注保留“崇高/高升”的真实词义可能性，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。诗句分行以体现诗歌体裁和希伯来语的简练节奏；正文避免古奥的“以色列众子”和生硬重复的引语公式。
