base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: zh_hans
  text: 法老的战车和军兵，他都抛入海中；他最精锐的军官也沉没在芦苇海[a]中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“红海”。希伯来文直译为“芦苇海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: 战车
  rationale: 此复数名词具体指法老的作战车辆；“战车”是现代汉语中自然、准确的表达。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代中文圣经及一般汉语对埃及君王称号的通行译法。
- source_word: וְחֵילוֹ
  choice: 和军兵
  rationale: חַיִל在本节军事语境中指军队或兵力；“军兵”既涵盖军队人员，也与诗歌体裁相称。
- source_word: יָרָה
  choice: 抛入
  rationale: 该动词有投掷、抛出的意思；结合介词ב和海的宾语，以“抛入”自然表达朝向并进入海中的动作，同时保留诗句的力度。
- source_word: בַיָּם
  choice: 海中
  rationale: 与“抛入”搭配，表达被投入海里的动态结果，符合现代汉语习惯。
- source_word: וּמִבְחַר
  choice: 最精锐的
  rationale: 该词表示被拣选的、上等的部分；修饰军事人员时，“最精锐的”比“最好的”更贴合语境。
- source_word: שָׁלִשָׁיו
  choice: 他的军官
  rationale: שָׁלִישׁ可指高级或精锐军事官员，且常与战车部队有关；“军官”保留其军阶含义而不武断限定为战车官或某一具体官阶。
- source_word: טֻבְּעוּ
  choice: 沉没
  rationale: 被动词形表达被淹没、使之下沉；汉语“沉没”能保留水中下沉的意象，而不只强调溺死。
- source_word: בְיַם סוּף
  choice: 在芦苇海中
  rationale: יַם סוּף按词义直译为“芦苇海”；正文优先反映希伯来原文，传统译名“红海”置于脚注供读者参照。
theological_decisions:
- issue: יַם סוּף的译法
  choice: 芦苇海
  alternative: 红海
  rationale: 原文יַם סוּף的字面意义是“芦苇海”。为坚持原文优先，正文采用这一译法；同时以脚注保留中文读者熟悉的传统译名“红海”，不据此断定具体地理位置。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌体汉语。“他”承接上文所歌颂的耶和华，保留希伯来诗句中动词主语的表达；分号呈现两个平行分句。“军官”避免把שָׁלִישׁ过度具体化为某一固定军阶。
