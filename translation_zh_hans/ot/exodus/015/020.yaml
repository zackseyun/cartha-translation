base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: zh_hans
  text: 于是，女先知米利暗，就是亚伦的姊妹，拿起手鼓；所有妇女都跟着她出去，带着手鼓跳舞。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “跳舞”也可译为“舞蹈”。原文此词为复数，可指舞蹈活动或多种舞蹈。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: 于是……拿着
  rationale: 未完成式连续式推进叙事；“于是”自然表达事件承接，“拿着”符合汉语对手持乐器的表达。
- source_word: מִרְיָם
  choice: 米利暗
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: הַנְּבִיאָה
  choice: 女先知
  rationale: 该名词为阴性形式，明确指女性先知；“女先知”在现代汉语中简洁自然。
- source_word: אֲחוֹת אַהֲרֹן
  choice: 亚伦的姐姐
  rationale: 忠实保留原文明确给出的亲属关系，不改成她与摩西的关系；“姐姐”依通行人物关系表达其为亚伦之姊。
- source_word: הַתֹּף
  choice: 手鼓
  rationale: תֹף 指手持的框鼓类打击乐器；“手鼓”比可能使人联想到带金属小钹的“铃鼓”更贴近古代乐器，也比“鼓”更具体。
- source_word: בְּיָדָהּ
  choice: 手里
  rationale: 自然对应“在她手中”，与“拿着”组合成流畅现代汉语。
- source_word: וַתֵּצֶאןָ
  choice: 出去
  rationale: 保留 יצא 的基本空间意义；复数阴性动词与“众妇女”一致。
- source_word: כָל הַנָּשִׁים
  choice: 众妇女也都
  rationale: 保留“所有妇女”的全称意义；加入“也”自然连接米利暗与妇女们的相应行动。
- source_word: אַחֲרֶיהָ
  choice: 跟着她
  rationale: 这里描述随从或队列行动；“跟着她”比直译“在她后面”更自然，同时不额外指定正式游行。
- source_word: בְּתֻפִּים
  choice: 击鼓
  rationale: 介词短语表示伴随或方式；汉语以动作“击鼓”自然表达携鼓奏乐，且与前文“手鼓”相呼应。
- source_word: וּבִמְחֹלֹת
  choice: 跳舞
  rationale: מְחֹלֹת 是复数名词，可指舞蹈、跳舞活动；正文采用自然的动作表达，同时以脚注保留名词复数的另一译法。
