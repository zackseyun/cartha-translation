  text: נָשַׁ֥פְתָּ בְ/רוּחֲ/ךָ֖ כִּסָּ֣/מוֹ יָ֑ם צָֽלֲלוּ֙ כַּֽ/עוֹפֶ֔רֶת בְּ/מַ֖יִם אַדִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: zh_hans
  text: 你以你的风[a]吹，海就淹没了他们；他们如铅沉入浩荡的水中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “风”或译“气息”。希伯来语这个词可指“风”、“气息”或“灵”；这里过海的语境更支持“风”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: 一吹
  rationale: 该动词表示吹气或吹风。译作“一吹”简洁自然，也保留诗歌中上帝吹动风的鲜明意象。
- source_word: בְרוּחֲךָ
  choice: 用你的风
  rationale: רוּחַ 可指风、气息或灵；在过海的语境中，与“吹”连用时，“风”最贴合实际景象，同时用脚注保留其他词义。
- source_word: כִּסָּמוֹ יָם
  choice: 海就淹没了他们
  rationale: כסה 的基本意思是遮盖、覆盖；在海水覆没人的语境中，“淹没”是自然且准确的现代汉语表达，没有额外说明其结果。
- source_word: צָלֲלוּ
  choice: 他们……沉入
  rationale: 该动词在这里表示向水下沉落。“沉入”与后面的“像铅一样”自然衔接。
- source_word: כָּעוֹפֶרֶת
  choice: 像铅一样
  rationale: 准确保留原文以铅的沉重为喻的明喻。
- source_word: בְּמַיִם אַדִּירִים
  choice: 在浩荡的水中
  rationale: אַדִּירִים 表达强大、雄伟或威势。“浩荡”用于水势自然庄重，并保留其宏大有力的诗意，避免误译成仅指深度的“深水”。
theological_decisions:
- issue: 神显诗歌语境中 רוּחַ 的含义
  choice: 风
  alternative: 气息；灵
  rationale: 过海的直接语境以及与“吹”搭配的表达首先指向风，也可唤起上帝气息的拟人意象。正文采用“风”，脚注保留“气息”和“灵”的词义范围，避免把此处明确解释为对圣灵的专指。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。“你用你的风一吹”保留原文的神圣行动意象；“浩荡的水”既自然又传达水势的强大。脚注标记 [a] 已置于正文相关词句之后。
