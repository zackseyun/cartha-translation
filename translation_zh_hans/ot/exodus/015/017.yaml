id: EXO.15.17
reference: Exodus 15:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: zh_hans
  text: '你要领他们进去，把他们栽种在你产业的山上[a][b]——

    雅威啊，那是你为自己居住而造的地方；

    主啊，那是你双手建立的圣所。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他们安置下来”。原文直译为“栽种他们”，以栽种比喻稳固地定居。
    reason: lexical_alternative
  - marker: b
    text: “你产业的山”可能广义指神赐给百姓并归自己所有的土地，也可能更具体地指神圣所所在的山。
    reason: alternative_reading
  - marker: c
    text: 本节原文同时用了神的专名YHWH（译作“雅威”）和称号Adonai（译作“主”）。
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: 领他们进去
  rationale: 使役形表达把人带入某处；“领他们进去”既保留使役意义，也自然体现语境中隐含的目的地。
- source_word: וְתִטָּעֵמוֹ
  choice: 把他们栽种
  rationale: נָטַע本义为“栽种”，这里比喻使百姓安稳定居。保留具体的种植意象，不将其平化为“安置”或“建立”。
- source_word: בְּהַר נַחֲלָתְךָ
  choice: 在你产业的山上
  rationale: 保留“山”和“产业”的属格关系，不预先断定所指仅是应许之地整体，还是更具体的圣所之山。
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: 那是你为自己居住而造的地方
  rationale: מָכוֹן指设立或预备好的所在；结合“供你居住”，译为“地方”符合现代汉语，并通过“那是”清楚呈现其与前句的同位关系。
- source_word: פָּעַלְתָּ
  choice: 造
  rationale: פָּעַל是含义较宽的“做、造成”；此处“造”简洁自然，同时避免将其限定为较具解释性的“预备”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现神的专名YHWH，而不以称号替代，从而与本节后面的אֲדֹנָי相区别。
- source_word: מִקְּדָשׁ
  choice: 圣所
  rationale: מִקְּדָשׁ意为分别为圣的地方或圣所；“圣所”准确、自然，也保留诗句中的宗教空间含义。
- source_word: אֲדֹנָי
  choice: 主
  rationale: אֲדֹנָי在这里用作神的称号；译为“主”，既符合现代汉语宗教语体，也与专名“雅威”保持区别。
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: 你双手建立
  rationale: כּוֹנֵן表达建立、使稳固；“你双手建立”保留原文拟人的“双手”意象及坚立的含义。
theological_decisions:
- issue: 同一节中יְהוָה与אֲדֹנָי的译法
  choice: 分别译为“雅威”和“主”
  alternative: 两者均译为“主”或“耶和华”
  rationale: 原文先用神的专名，后用称号。分别翻译可保存希伯来文中可见的区别，又不增添原文没有的限定语。
- issue: “你产业的山”与“圣所”的具体所指
  choice: 保留诗意上的开放性，不明确指定为整个迦南地或锡安圣殿山
  alternative: 明确译作应许之地，或明确解释为锡安／圣殿山
  rationale: 本诗可能既展望百姓进入所得之地，也聚焦神居住的圣所。直译其意象，可保存这种地理和神学上的张力。
- issue: “栽种”用于百姓的比喻
  choice: 保留“栽种”这一具体意象
  alternative: 解释性译为“安置”或“使他们安居”
  rationale: 原文借栽种表达稳固定居；保留比喻能呈现诗歌力度，同时由脚注说明其语境意义。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体。以破折号和分行显明后两句对“你产业的山”的展开说明；保留“栽种”“双手”等原文意象，并避免把山的具体所指解释得过窄。
