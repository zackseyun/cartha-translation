base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: zh_hans
  text: 耶和华啊，众神之中，谁能像你？谁能像你，在圣洁中威严，在颂赞中可畏，施行奇事？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: 众神之中
  rationale: אֵלִם 是 אֵל 的复数，直译为“众神”；保留原文的比较性反问，不将其弱化为“有权能者”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名译法，明确对应四字神名。
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: 圣洁威严
  rationale: נֶאְדָּר 表示威严、荣耀，בַּקֹּדֶשׁ 可理解为“在圣洁中”；凝练译为“圣洁威严”，自然地保留二者的关联。
- source_word: נוֹרָא תְהִלֹּת
  choice: 受人敬畏颂赞
  rationale: 短语语法凝练，字面近于“在颂赞中可畏/令人敬畏”。此译保留“敬畏”与“颂赞”的并置，避免将 נוֹרָא 仅处理为泛化的“奇妙”。
- source_word: עֹשֵׂה פֶלֶא
  choice: 施行奇事
  rationale: עֹשֵׂה 是持续性分词“施行者/行”，פֶלֶא 指超凡奇事；“施行奇事”庄重且符合现代中文表达。
theological_decisions:
- issue: “众神”是否暗示其他神明与耶和华同等真实
  choice: 保留“众神”
  alternative: 诸有权能者／众天使
  rationale: 原文使用 אֵלִם，并以诗歌反问宣告耶和华无可比拟；翻译不应把其所指范围预先限定，也不应由译者替经文解决其本体论含义。
- issue: נוֹרָא תְהִלֹּת 中敬畏与颂赞的关系
  choice: 受人敬畏颂赞
  alternative: 在颂赞中可畏／当受敬畏，配得颂赞
  rationale: 原文关系紧密而略有歧义；正文采用自然中文呈现二者并列关联，不扩写为两个独立的神学判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保持希伯来诗歌的两个反问句和平行结构。称呼“耶和华啊”前置，使中文呼语自然；全句避免古奥词汇，同时保留赞歌的崇高语气。
