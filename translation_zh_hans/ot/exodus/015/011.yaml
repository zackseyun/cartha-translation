revisions:
- from: 耶和华啊，众神之中，谁能像你？谁能像你，圣洁威严，受人敬畏颂赞，施行奇事？
  to: 耶和华啊，众神之中，谁能像你？谁能像你，在圣洁中威严，在颂赞中可畏，施行奇事？
  rationale: 修订限于两个凝练的诗歌短语：恢复“在圣洁中”及“在颂赞中”的结构，避免将后者扩展为原文未明说的“受人”行为，并保留原文对“颂赞”与“可畏”关系的简洁性和一定歧义。其余译语维持不变。
