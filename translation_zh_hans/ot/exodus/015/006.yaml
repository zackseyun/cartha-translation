base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: zh_hans
  text: '耶和华啊，你的右手大有能力，威严显赫；

    耶和华啊，你的右手击碎仇敌。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְמִינְךָ
  choice: 你的右手
  rationale: 保留“右手”的具体诗歌意象；在得胜之歌中，它也自然象征力量与施行拯救的作为。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名；“啊”表达希伯来语呼格语气。
- source_word: נֶאְדָּרִי בַּכֹּחַ
  choice: 大有威荣
  rationale: נֶאְדָּרִי 表示威严、荣美或显赫，בַּכֹּחַ 表示在力量方面；“大有威荣”在中文中凝练而庄重，并保留力量所彰显的威严。
- source_word: תִּרְעַץ
  choice: 击碎
  rationale: 该动词表示打碎、粉碎或压碎；“击碎”既保留猛烈而彻底的动作，也适合战争得胜之歌的语境。
- source_word: אוֹיֵב
  choice: 仇敌
  rationale: 原文为单数，可指一个敌人，也可作集合性称谓；中文“仇敌”能自然保留这种数上的开放性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中辨识度最高的专名“耶和华”，避免仅以称号替代其专名性质。
- issue: “右手”的神学与诗歌意象
  choice: 保留具体意象“你的右手”
  alternative: 意译为“你的大能”
  rationale: 原文以拟人化诗歌语言描绘上帝得胜的能力；保留“右手”既不把上帝限定为具有人体，也不抹去诗句鲜明的形象。
translation_notes:
  register: 采用庄重、凝练、适合吟诵的现代标准汉语。两行重复“耶和华啊，你的右手”，对应希伯来诗歌的重复与强调；不添加原文没有的解释性成分。
