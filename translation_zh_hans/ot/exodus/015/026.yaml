  to: 他说：“如果你切实听从耶和华你上帝的话，做他眼中看为正的事，留心听他的诫命，遵守他的一切律例，我就不把我曾加在埃及的各种疾病加在你身上，因为我是耶和华，医治你的那一位[a]。”
  rationale: 修订仅处理中文句法和表语完整性：保留原文条件性结构、神名、疾病与埃及之间的历史关联，以及前后“加在”的词汇呼应；不把应许扩展为普遍的无条件医疗保证，也不预断“埃及”是否必须译作“埃及人”。
