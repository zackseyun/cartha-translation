source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: zh_hans
  text: 他说：“如果你切实听从耶和华你上帝的话，做他眼中看为正的事，留心听他的诫命，遵守他的一切律例，我就不把我曾加在埃及的各种疾病加在你身上，因为我是耶和华，医治你的那一位[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为我是耶和华，你的医治者。”
    reason: 希伯来语分词רֹפְאֶךָ可理解为“医治你的那一位”，也可名词性地译为“你的医治者”。
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: 切实听从
  rationale: 不定式绝对式与限定动词连用，加强“听”的语气；“切实听从”兼顾聆听与顺从的含义。
- source_word: לְקוֹל
  choice: ……的话
  rationale: קוֹל本义为“声音”，但“听从某人的话”是现代汉语中自然的对应表达，也保留权威发言的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译四字神名，在中文圣经语境中通行且庄重。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称单数的立约称谓，并采用现代标准普通话用字。
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: 做他眼中看为正的事
  rationale: 保留希伯来语“在他眼中为正”的意象及其道德判断，避免解释为单纯“讨他喜悦”。
- source_word: וְהַאֲזַנְתָּ
  choice: 留心听
  rationale: 表达Hiphil词形所含的专心倾听之意，并与前面的“听从”适度区分。
- source_word: לְמִצְוֺתָיו
  choice: 他的诫命
  rationale: “诫命”准确传达盟约与律法语境中的命令。
- source_word: וְשָׁמַרְתָּ
  choice: 遵守
  rationale: שׁמר用于律法语境时常指谨守、遵行；“遵守”在现代汉语中最自然。
- source_word: כָּל חֻקָּיו
  choice: 他的一切律例
  rationale: “律例”是חֻקִּים在法律及盟约语境中的准确、通行译法。
- source_word: כָּל הַמַּחֲלָה
  choice: 任何疾病
  rationale: 单数集合名词在否定句中自然译为“任何疾病”，不把范围缩窄为某一种病。
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם / לֹא אָשִׂים עָלֶיךָ
  choice: 加在埃及的……不……加在你身上
  rationale: 前后以“加在”对应同一动词שׂים，既保持词汇呼应，也符合中文表达。
- source_word: רֹפְאֶךָ
  choice: 医治你的
  rationale: 将分词作动词性表达，忠实呈现持续或特征性的医治行动，同时以脚注保留名词性理解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名；采用中文读者熟悉的“耶和华”，不以“主”替代专名。
- issue: 疾病应许的性质
  choice: 与听从、遵守相连，并针对加在埃及的疾病所作的条件性应许
  alternative: 在一切情形下保证每个个体必得身体医治；或仅指属灵复原
  rationale: 原文以אִם引出条件，并明确联系埃及所受的疾病；译文不扩大为无条件的普遍保证，也不将疾病纯粹比喻化。
- issue: רֹפְאֶךָ的语法语义
  choice: 医治你的
  alternative: 你的医治者
  rationale: 分词既可作动词性定语理解，也可名词化；正文采用自然的中文动词表达，脚注保留名词性译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“切实听从—留心听—遵守”呈现原文三个相关而不完全相同的动作；保留“他眼中看为正”的希伯来语意象。
