  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: zh_hans
  text: 惊恐和惧怕必临到他们；因你大能的膀臂，他们必像石头一样静止不动[a]，直到你的子民过去，耶和华啊，直到你所得的这子民过去[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “静止不动”也可译作“默不作声”或“动弹不得”。
    reason: lexical_alternative
  - marker: b
    text: “过去”也可译作“越过”或“穿过”；本节两处相同。
    reason: lexical_alternative
  - marker: c
    text: “所得的”也可译作“买来的”；按较宽泛的圣约含义，也可理解为“使之归己的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם
  choice: 必临到他们
  rationale: תִּפֹּל是阴性单数未完成式，与后置的复合主语相应；在诗歌的预告语境中译为“必临到”，既表达将来含义，也保留“落在、临到”的意象。
- source_word: אֵימָתָה וָפַחַד
  choice: 惊恐和惧怕
  rationale: 两个近义词并列，加强敌对诸民所受的震慑；分别译为“惊恐”和“惧怕”，避免将二者合并。
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: 因你膀臂的大能
  rationale: 保留“膀臂”这一能力与行动的诗性隐喻；“大能”自然表达גֹּדֶל在此所指的强大，并将בּ理解为原因或凭借。
- source_word: יִדְּמוּ כָּאָבֶן
  choice: 他们必像石头一样静止不动
  rationale: יִדְּמוּ可指静默或不动；与“像石头”相连时，“静止不动”最自然地表达受震慑而僵住的画面，同时以脚注保留“默不作声”的可能。
- source_word: עַד יַעֲבֹר
  choice: 直到……过去
  rationale: עבר在此可指经过、越过或穿过；“过去”适合以色列民继续前行的宽泛语境，也保留重复句式。
- source_word: עַמְּךָ
  choice: 你的子民
  rationale: עם在这里不只是一般族群，也表达雅威与以色列的归属关系；“子民”在现代汉语圣经语体中自然庄重。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 原文直接呼告神的专名；中文采用通行且易懂的专名形式“耶和华”，并以“啊”表现呼格。
- source_word: עַם זוּ קָנִיתָ
  choice: 你所得的这子民
  rationale: זוּ保留为“这”；קנה基本义为取得、获得或买得。“所得的”简洁保留取得并归属自己的含义，而不擅自限定为“救赎”或“创造”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华啊
  alternative: 雅威啊；上主啊
  rationale: 正文保留专名而不以称号代替。现代简体中文读者对“耶和华”最为熟悉；原文的直接呼告则用“啊”表达。
- issue: קָנִיתָ在圣约语境中的含义
  choice: 你所得的
  alternative: 你买来的；你使之归己的；你所造的
  rationale: “所得的”保留“取得并拥有”的核心语义，却不把这里明确化为购买、救赎或创造，因而维持原文的语义宽度和神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语体；保留“膀臂”和“像石头”两项原文意象，并以重复的“直到……过去”再现希伯来诗句的平行结构。
