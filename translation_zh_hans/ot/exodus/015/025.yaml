  text: וַ/יִּצְעַ֣ק אֶל יְהוָ֗ה וַ/יּוֹרֵ֤/הוּ יְהוָה֙ עֵ֔ץ וַ/יַּשְׁלֵךְ֙ אֶל הַ/מַּ֔יִם וַֽ/יִּמְתְּק֖וּ הַ/מָּ֑יִם שָׁ֣ם שָׂ֥ם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט וְ/שָׁ֥ם נִסָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: zh_hans
  text: 于是，摩西向耶和华呼求；耶和华指给他一棵树。他把树投进水里，水就变甜了。耶和华在那里为他们定下律例和典章，也在那里考验他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: 呼求
  rationale: 既保留因困境而大声求告的语气，也符合现代汉语的经文语体。
- source_word: עֵץ
  choice: 一棵树
  rationale: 该词通常指“树”，也可按语境指木头；此处依原文保留“树”，不擅自具体化为树枝或木块。
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: 水就变甜了
  rationale: 直译原文“水变甜”，与前文苦水形成明确对照；在语境中自然表示水变得可饮用。
- source_word: חֹק וּמִשְׁפָּט
  choice: 律例和典章
  rationale: 用两个常见而有区分度的法律用语对应并列名词，不将二者合并为笼统的“规定”。
- source_word: נִסָּהוּ
  choice: 考验他们
  rationale: 表达通过处境检验或试验之意，避免现代汉语中“试探”可能暗示引诱作恶的含义。
theological_decisions:
- issue: 后半节两个单数动词的主语
  choice: 明确为“耶和华”
  alternative: 沿用省略主语的“在那里为他们定下……也在那里考验他们”
  rationale: 希伯来文动词虽未明说主语，但最近且最自然的行动主体是耶和华；中文若继续省略，容易误读为摩西制定律例并考验百姓。
- issue: 单数宾语后缀 לּוֹ 与 נִסָּהוּ 的指称
  choice: 按集合单数译作“他们”
  alternative: 译作“他”
  rationale: 上下文对象是以色列群体，原文可用集合性的单数代词指百姓；译作复数使现代中文读者准确把握所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。首次人称代词明确为“摩西”，避免中文脱离上下文时指代不清；神名依中文圣经通行传统译作“耶和华”。
