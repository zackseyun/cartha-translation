base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: zh_hans
  text: 仇敌说：“我必追赶，必追上；我必瓜分战利品。我的心愿必因他们得满足。[a] 我必拔出我的刀；我的手必赶逐他们。[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我的内心（或‘欲望’）必因他们充满。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我的手要消灭他们”，或“我的手要使他们失去产业”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: 仇敌说
  rationale: 以简单过去叙述仇敌的夸口；单数“仇敌”在上下文中代表追赶以色列人的埃及敌军。
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: 我要追赶，我要追上
  rationale: 两个未完成式在直接引语中表达仇敌预定要采取的行动；重复的短句保留战歌急促而自信的节奏。
- source_word: אֲחַלֵּק שָׁלָל
  choice: 我要瓜分战利品
  rationale: 这是战争掳获物的常用表达；“战利品”在现代汉语中清楚自然。
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: 我要在他们身上尽情满足欲望
  rationale: 字面近于“我的性命／欲望要因他们而充满”；נֶפֶשׁ 在这里指强烈的欲求或胃口，而非专指非物质的灵魂。译文传达敌人要任意加害、满足欲望的夸口，同时以脚注保留字面表达。
- source_word: אָרִיק חַרְבִּי
  choice: 我要拔刀
  rationale: ריק 的使役式与“刀”连用，是拔刀出鞘的惯用语；“拔刀”简洁并符合现代汉语。
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: 我的手要消灭他们
  rationale: ירשׁ 的使役式可指赶走、剥夺占有或毁灭；在追杀的语境中，“消灭”最自然，但脚注保留其词义范围，避免掩盖原文的多义性。
