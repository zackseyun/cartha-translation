  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: zh_hans
  text: 你伸出右手；大地[a]吞没了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大地”也可译作“土地”或“地面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: 你伸出
  rationale: 该词是 נטה 的 Qal 完成式第二人称阳性单数，直接称呼上帝。“伸出”在现代汉语中自然，也保留了具体动作。
- source_word: יְמִינְךָ
  choice: 右手
  rationale: 原文直译为“你的右手”。在诗歌中右手可象征能力，但正文保留具体的身体意象，不抽象化为“能力”。
- source_word: תִּבְלָעֵמוֹ
  choice: 就吞没了他们
  rationale: בלע 表示“吞下、吞没”；此处为第三人称阴性单数，带第三人称阳性复数宾语后缀，后置的“大地”是主语。“吞没”保留了原文鲜明的诗歌意象；“就”自然呈现上下两句动作的紧密承接。
- source_word: אָרֶץ
  choice: 大地
  rationale: אֶרֶץ 可指“大地、土地、地面”。此处描写仇敌被吞没，“大地”既自然庄重，也较能保留诗歌的宏阔感；其他可能含义列入脚注。
theological_decisions:
- issue: 描写上帝行动的拟人语言
  choice: 保留“右手”这一具体表达
  alternative: 你的能力；你大能的手
  rationale: 希伯来文以拟人意象赞美上帝。保留原有形象，可维持经文的文学与神学张力，而不把它直接解释成抽象的“能力”。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。句式简洁，保留“伸出右手”与“大地吞没”的平行意象和鲜明画面。
