  yaml_path: translation/ot/exodus/015/014.yaml
  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: zh_hans
  text: 万民听见了，就战兢[a]；痛苦抓住了非利士地的居民。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“万民已经听见，便发颤；战栗抓住了非利士地的居民。”希伯来诗歌既可表达生动的现在或将来意味，也可按一般过去时理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: 听见了
  rationale: 该词是שׁמע的Qal完成式第三人称复数。结合诗歌中回顾与预示交织的语境，译作“听见了”自然，并保留完成式所表达的整体事件。
- source_word: עַמִּים
  choice: 万民
  rationale: עם的复数指周围各族群。“万民”是简洁、庄重且有诗歌色彩的现代汉语表达，也保留复数群体的意味；并非指数目上的所有人。
- source_word: יִרְגָּזוּ/ן
  choice: 战兢
  rationale: רגז可指震动、颤抖或惊惶不安。“战兢”兼顾身体颤抖与恐惧，适合诗歌语体。希伯来语未完成式在此可有生动的现在或将来意味，但上下文也允许按叙述次序理解。
- source_word: חִיל
  choice: 痛苦
  rationale: 该名词可表示扭痛、产痛般的剧痛或战栗。“痛苦”不把原文过度限定为生产意象，同时保留身心受折磨的强度。
- source_word: אָחַז
  choice: 抓住了
  rationale: אחז意为抓住、攫住。以“痛苦”为主语时，“抓住了”形象地表达突然控制、无法摆脱的力量，也比抽象说法更贴近原文。
- source_word: יֹשְׁבֵי
  choice: 居民
  rationale: ישׁב的分词在此名词化，指居住在某地的人。“居民”是准确而自然的现代汉语。
- source_word: פְּלָשֶׁת
  choice: 非利士地
  rationale: 该专名指非利士人的地域，而非直接指族群。“非利士地”明确表达地理名称，并符合中文圣经地名习惯。
