  naturalness: 原译整体自然、庄重。将长串并列分为句子，并把“却找不到水”改为“却没有找到水”，能使现代汉语叙事时序更清晰、语气更稳妥。
  terminology: “芦苇海”准确反映יַם־סוּף，且脚注妥善保留“红海”这一传统译名。“书珥旷野”“旷野”及“以色列人”均符合常用中文圣经语域。
