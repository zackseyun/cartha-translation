base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: zh_hans
  text: 摩西领以色列人从芦苇海[a]继续前行；他们来到书珥旷野，在旷野走了三天，却没有找到水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“红海”；希伯来文意为“芦苇海”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: 领……继续前行
  rationale: 该词为使役词形，表示摩西使以色列人从原地起行；“领……继续前行”既保留使役意味，也符合现代汉语叙事表达。
- source_word: מִיַּם־סוּף
  choice: 从芦苇海
  rationale: סוּף通常指芦苇或水草；“芦苇海”直接反映希伯来语名称，传统译名“红海”列入脚注。
- source_word: וַיֵּצְאוּ אֶל־מִדְבַּר שׁוּר
  choice: 他们来到书珥旷野
  rationale: יצא的基本义是出去、出来；结合介词אֶל所指的目的地，汉语以“来到”自然表达他们进入书珥旷野的叙事进程。
- source_word: מִדְבַּר שׁוּר
  choice: 书珥旷野
  rationale: מִדְבָּר指人烟稀少的荒野地带，未必专指沙漠；“旷野”准确且符合中文圣经语域。
- source_word: שְׁלֹשֶׁת יָמִים בַּמִּדְבָּר
  choice: 在旷野走了三天
  rationale: 保留“三天”的时间延续和“在旷野”的位置关系，不将其具体化为原文未明说的“三天路程”。
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: 却找不到水
  rationale: 自然表达未能寻得水的结果；“却”呈现连续行走三天与没有水之间在叙事上的反差。
