base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/024.yaml
  text: And the people grumbled against Moses[a], saying, “What shall we drink?”
translation:
  language: zh_hans
  text: 百姓就向摩西发怨言[a]，说：“我们喝什么呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“抱怨”。希伯来语这个动词指群体共同表达不满，在旷野叙事中尤为常见。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: 发怨言
  rationale: 该动词在旷野叙事中表示群体对领袖的不满和抱怨。“发怨言”自然、庄重，也保留其负面和共同抱怨的含义。
- source_word: הָעָם
  choice: 百姓
  rationale: 准确对应带定冠词的“民众”，并符合现代中文圣经叙事的自然表达；不增补原文未明说的“以色列”。
- source_word: עַל
  choice: 向
  rationale: 在中文“向某人发怨言”的搭配中，既自然地标明抱怨所针对的对象，也不把动作误解为仅仅对摩西谈论此事。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用中文通行的人名译法。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然地引出直接引语，同时保留原文的话语衔接功能。
- source_word: מַה
  choice: 什么
  rationale: 直接表达疑问代词，不作解释性扩展。
- source_word: נִשְׁתֶּה
  choice: 我们喝
  rationale: 未完成式第一人称复数在此表达眼前需要和寻求办法的疑问；“我们喝什么呢”是自然中文，并保留其语气，不额外解释为能力或许可。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“百姓就向摩西发怨言”保留事件推进和抱怨针对摩西的关系；问句以“呢”呈现当下急迫、寻求办法的自然语气。
