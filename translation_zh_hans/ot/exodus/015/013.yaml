base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: zh_hans
  text: '你以信实的慈爱引领了你所救赎的子民[a]；

    你以大能引导他们，来到你圣洁的居所[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这群你所救赎的子民”。
    reason: lexical_alternative
  - marker: b
    text: “你圣洁的居所”可泛指上帝圣洁临在之处；有不同理解认为这是西奈、应许之地，或锡安及圣殿。
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: 引领了
  rationale: נחה的使役形表示带领、引导；“引领”自然庄重，也适合上帝带领百姓的语境。完成式在诗中回顾上帝已经成就的作为，故用“了”表达。
- source_word: בְחַסְדְּךָ
  choice: 以信实的慈爱
  rationale: חֶסֶד兼有慈爱、忠诚和坚定不移之意；“信实的慈爱”既保留情感层面，也表达持久可靠的忠诚。介词ב在此按凭借或方式译为“以”。
- source_word: עַם זוּ
  choice: 你所救赎的子民
  rationale: זוּ在这里可作关系成分，连接“子民”和“你所救赎的”；也可能保留指示意味。正文采用流畅的关系结构，脚注注明“这群子民”的可能译法。
- source_word: גָּאָלְתָּ
  choice: 你所救赎的
  rationale: גאל指赎回或施行救赎；“救赎”保留其重要的盟约与拯救含义，并适合出埃及的语境。
- source_word: נֵהַלְתָּ
  choice: 引导他们
  rationale: נהל常指带领、引导，有时带有关怀照料的意味。为与前句的נחה有所区别，译作“引导”；“他们”是从上句“子民”补出的自然汉语宾语。
- source_word: בְעָזְּךָ
  choice: 以大能
  rationale: עֹז表示力量、能力或威力；“大能”简洁庄重，能表达上帝施行拯救的强大力量。介词ב按凭借译为“以”。
- source_word: אֶל
  choice: 来到
  rationale: אֶל表示朝向某个目的地。结合引导动作，译为“来到”使汉语自然，并传达诗歌把百姓带至目的地的表达；不额外限定进入该处的具体方式。
- source_word: נְוֵה קָדְשֶׁךָ
  choice: 你圣洁的居所
  rationale: נָוֶה可指居所、住处，也可指牧场；在这里与上帝的圣洁相连。“圣洁的居所”保留宽泛含义，不把所指预先限定为西奈、应许之地或锡安圣殿。
theological_decisions:
- issue: “你圣洁的居所”具体指哪里
  choice: 正文保留为上帝临在之圣洁居所的宽泛说法，不指定具体地点。
  alternative: 可分别理解为西奈、应许之地，或锡安及圣殿。
  rationale: 希伯来语本身没有明确锁定一个地点；《海之歌》也可能以诗歌方式把上帝整个拯救与带领的工作集中呈现。宽泛翻译可保留原文的时间层次与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“引领／引导”保留原文两个近义动词的细微区别；两行并列呈现诗歌结构。“信实的慈爱”兼顾חֶסֶד的慈爱与忠诚含义；“圣洁的居所”避免用“圣所”过早限定为建造完成的宗教建筑。
