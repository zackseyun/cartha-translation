  rationale: 修订保留集合性“马匹”和原文所呈现的鲜明对比，同时更准确地表达法老军队的伴随关系、回流海水覆盖他们的动作，以及以色列人在海中间的干地上行走这一空间意象。无需增设脚注：中文的“马匹”可自然表达集合意义，“却”也已在正文中自然标出上下文对比。
