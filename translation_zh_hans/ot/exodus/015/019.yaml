base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: zh_hans
  text: 因为法老的马匹连同他的战车和骑兵进入海中，耶和华使海水回流，漫过他们；以色列人却在海中间的干地上行走。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 本句说明前面歌唱称颂的缘由；“因为”自然保留了解释性的连接作用。
- source_word: סוּס פַּרְעֹה
  choice: 法老的马匹
  rationale: 原文“马”为单数，但在这里具有集合意义，指法老军队的马匹；汉语用“马匹”更自然。
- source_word: בְּרִכְבּוֹ
  choice: 战车
  rationale: 原文形式为单数，但 רכב 可集合性地指战车部队；汉语“战车”本身可作类称，既简洁又符合语境。
- source_word: וּבְפָרָשָׁיו
  choice: 骑兵
  rationale: 指骑马作战的人；“骑兵”是现代汉语中准确、自然的军事称谓。
- source_word: וַיָּשֶׁב יְהוָה
  choice: 耶和华使……回流
  rationale: שוב 的使役式强调耶和华使海水返回；“使……回流”保留神的主动作为并贴合水流语境。
- source_word: עֲלֵהֶם אֶת מֵי הַיָּם
  choice: 海水……淹没了他们
  rationale: 原文直义为使海水返回到他们之上；“淹没了他们”在汉语中清楚表达海水覆压其上的结果。
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 以色列人却
  rationale: בני ישראל 在现代汉语中惯常自然地译为“以色列人”。连接词字面为“和”，此处上下文具有鲜明对比，译作“却”明确表达其语篇功能。
- source_word: הָלְכוּ בַיַּבָּשָׁה בְּתוֹךְ הַיָּם
  choice: 从海中走过干地
  rationale: 保留“走”和“干地”的具体意象；“从海中”自然表达他们在海的中间穿行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文普通读者最熟悉且庄重的音译为“耶和华”，不以“主”替代专名。
- issue: 埃及人与以色列人结局的对比
  choice: 以“却”表达语篇对比
  alternative: 以“和”直译连接词
  rationale: 希伯来语连接词本身通常为“和”，但在本句中两个分句构成明显反差；“却”不改变事件内容，只使原有对比在现代汉语中自然显明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留海水回流、干地穿海等核心意象；集合性单数按汉语习惯处理，不增加原文没有的专门神学解释。
