base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: zh_hans
  text: 你以浩大的威严[a]摧毁那些起来反抗你的人；你发出你那炽烈的怒气[b]，它吞灭他们，如同火吞灭秸秆。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在你丰盛的威荣中。”希伯来语介词可表示凭借的手段，也可表示所处的情境；“丰盛”对应“众多、丰大”之意。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你发出你的烈怒。”希伯来语保留“燃烧”的怒气意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב גְּאוֹנְךָ
  choice: 你以浩大的威严
  rationale: בְּ可表示凭借的手段，也可表示所处的情境；רֹב强调广大、丰盛，גָּאוֹן在本诗中指上帝崇高而压倒性的威严。正文采用“以”表达施行摧毁的能力来源，同时在脚注保留另一种句法理解。
- source_word: תַּהֲרֹס
  choice: 摧毁
  rationale: הרס本义为拆毁、毁坏；宾语是人时，“摧毁”既保留其强烈力度，也适合军事诗歌语境。
- source_word: קָמֶיךָ
  choice: 那些起来反抗你的人
  rationale: 这是קום的分词形式，字面为“起来反对你的人”。采用展开式译法，保留原文的动作意味，而不只概括为“仇敌”。
- source_word: תְּשַׁלַּח
  choice: 你发出
  rationale: שׁלח的基本义是“差遣、发出”。“发出”直接自然，避免用“释放”等词额外强化原文。
- source_word: חֲרֹנְךָ
  choice: 燃烧的怒气
  rationale: חָרוֹן指炽烈、如火燃烧的怒气。此译保留热力意象，并与下句“吞灭碎秸”的火焰图景相呼应。
- source_word: יֹאכְלֵמוֹ
  choice: 就把他们……吞灭
  rationale: אכל基本义为吃、吞食，在毁灭语境中可译为“吞灭”。单数动词的主语承接前面的单数“怒气”，中文省略重复主语仍清楚自然。
- source_word: כַּקַּשׁ
  choice: 如碎秸般
  rationale: קַשׁ指谷物收割后留下的干秸、碎秸，容易被火迅速烧尽。“碎秸”比“糠秕”更贴近此词所指的干茎残余。
theological_decisions:
- issue: 是否弱化上帝施行审判的毁灭性意象
  choice: 你发出燃烧的怒气，就把他们如碎秸般吞灭
  alternative: 你发怒，使他们像秸秆一样消失
  rationale: 原文直接把摧毁敌对者和吞灭的行动归于上帝的怒气。正文保留这种强烈的诗性审判语言，不作淡化，也不添加后来的神学解释。
- issue: 保留对上帝的第二人称直接称呼
  choice: 你的威严……反抗你……你的怒气
  alternative: 上帝的威严……反抗上帝……上帝的怒气
  rationale: 本节属于向上帝直接唱出的诗歌；保留第二人称可维持其颂赞、宣认和面对面呼告的性质。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“浩大的威严”“起来反抗你”“燃烧的怒气”尽量保存希伯来语的具体表达和意象；分号呈现原句两组平行而递进的行动。脚注标记[a]、[b]均已置于正文相应词组之后。
