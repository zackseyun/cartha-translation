  to: '米利暗回应他们[a]：


    “你们要向雅威歌唱，


    因为他大大得胜[b]；


    马和骑手，


    他把他们抛进海中。”'
  rationale: 修订除去了“战马”这一无明示依据的限定，并以“马和骑手”自然呈现原文的马—骑者组合。将“歌颂”调整为“向雅威歌唱”，更直接对应介词结构。以“他大大得胜”保持胜利之歌语境，同时避免“大获全胜”对原文崇高／威荣语义的过度限定；脚注继续保留相关词义张力。
