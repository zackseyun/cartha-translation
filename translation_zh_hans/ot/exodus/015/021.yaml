source:
  edition: WLC
  text: וַ/תַּ֥עַן לָ/הֶ֖ם מִרְיָ֑ם שִׁ֤ירוּ לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: zh_hans
  text: '米利暗回应他们[a]：


    “你们要向雅威歌唱，


    因为他大大得胜[b]；


    马和骑手，


    他把他们抛进海中。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “回应”在这里也可能指歌唱中的应和或轮唱；也可理解为“米利暗向他们应和着唱”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近于“他极其崇高”或“他高高升起”；在这首胜利之歌中，也表达他以威严辉煌地得胜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: 回应……说
  rationale: 基本义是“回答、回应”；在诗歌语境中也可能指轮唱或应和。正文保留“回应”的基本意义，以脚注说明歌唱语境中的可能含义；“说”是现代汉语引出直接引语的自然补充。
- source_word: לָהֶם
  choice: 他们
  rationale: 原文为阳性复数形式，既可能指男性或混合群体，也可能作一般性复数；不因上文提到妇女就改译为“她们”。
- source_word: מִרְיָם
  choice: 米利暗
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: שִׁירוּ
  choice: 你们要歌颂
  rationale: 这是复数命令式，意为“唱、歌唱”；在以雅威为对象的语境中，“歌颂”自然表达“向雅威歌唱”，同时不额外限定歌曲内容。
- source_word: לַיהוָה
  choice: 雅威
  rationale: 直接译出四字神名 יהוה，以“雅威”呈现上帝的立约之名。
- source_word: כִּי
  choice: 因为
  rationale: 引出歌颂雅威的理由，现代汉语中“因为”清楚自然。
- source_word: גָאֹה גָּאָה
  choice: 大获全胜
  rationale: 不定式绝对形与限定动词并用，强化 גאה 的含义。在海之歌的胜利语境中，这一表达指雅威彰显崇高威荣、取得辉煌胜利；“大获全胜”自然传达其强调和凯旋意味，字面层面的歧义保留在脚注中。
- source_word: סוּס
  choice: 战马
  rationale: 原文单数可作集合或泛指；这里指敌军用于作战的马，“战马”符合上下文，也保持诗句简洁。
- source_word: וְרֹכְבוֹ
  choice: 和骑马的
  rationale: 直译为“和它的骑手”。“骑马的”在中文中自然，可指骑手而不额外强调性别，并清楚保留马与骑手的搭配。
- source_word: רָמָה
  choice: 他都抛进
  rationale: 动词意为“投、抛”。“抛进海里”准确表达动作及其结果；“都”自然涵盖并列的战马与骑手。
- source_word: בַיָּם
  choice: 海里
  rationale: 介词字面为“在海中”，但与“抛”连用时，现代汉语自然表达为“抛进海里”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。译作“雅威”而非以称号替代，保留经文中的立约之名；“耶和华”是传统音译，“上主”则以称号代替专名。
- issue: גָאֹה גָּאָה 所表达的得胜与崇高
  choice: 正文译作“大获全胜”，脚注保留“极其崇高／高高升起”的字面可能
  alternative: 他极其崇高／他威严地得胜
  rationale: 该结构既带有升高、崇高的词义，也在胜利之歌中描写雅威战胜敌军。正文按语境传达凯旋，脚注避免抹去其崇高、自显威荣的神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，并以短行保留诗歌节奏。“你们”明确复数命令；“战马和骑马的”简洁呈现原文的马—骑手组合。正文不强行判定 וַתַּעַן 是普通回应还是应和歌唱，也不把 גָאֹה גָּאָה 单一化为静态的“崇高”，相关张力均在脚注中说明。
