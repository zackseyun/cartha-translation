  yaml_path: translation/ot/exodus/025/024.yaml
  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: zh_hans
  text: 要用纯金包覆它，又要在它四周做一道金边。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金边”也可译作“金饰边”或“金边框”；希伯来语זֵר指环绕器物的边饰，具体形制不完全确定。传统上也有译作“金冠”的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: 要……包覆
  rationale: צפה在此指用金属层覆盖木制器物；“包覆”准确表达工艺动作，也比泛指的“遮盖”更明确。
- source_word: אֹתוֹ
  choice: 它
  rationale: 宾语代词回指上一节的桌子，现代汉语以“它”自然承接。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 该词组指纯度高的金；“纯金”简明、自然，并符合现代汉语常用表达。
- source_word: וְעָשִׂיתָ
  choice: 又要……做
  rationale: עשה是普通的“做、制作”；在连续指令中，“又要……做”既保留命令语气，也使汉语流畅。
- source_word: לּוֹ
  choice: 在它……
  rationale: לּוֹ直译可作“为它”，但此处所做的边饰附着于桌子；汉语用“在它四周”更自然，同时不改变所指关系。
- source_word: זֵר
  choice: 边
  rationale: זֵר在会幕器具语境中指环绕器物的凸起或装饰性边饰。“边”自然易懂，并保留其具体形制可能是边框、边缘或饰边的开放性。
- source_word: זָהָב
  choice: 金
  rationale: 直接表明材质；在“金边”中使用“金”符合现代汉语构词习惯。
- source_word: סָבִיב
  choice: 四周
  rationale: 表示围绕各面；“四周”简洁自然，完整传达环绕之意。
