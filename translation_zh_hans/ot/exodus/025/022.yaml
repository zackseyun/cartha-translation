source:
  edition: WLC
  text: וְ/נוֹעַדְתִּ֣י לְ/ךָ֮ שָׁם֒ וְ/דִבַּרְתִּ֨י אִתְּ/ךָ֜ מֵ/עַ֣ל הַ/כַּפֹּ֗רֶת מִ/בֵּין֙ שְׁנֵ֣י הַ/כְּרֻבִ֔ים אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת אֵ֣ת כָּל אֲשֶׁ֧ר אֲצַוֶּ֛ה אוֹתְ/ךָ֖ אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: zh_hans
  text: 在那里，我要与你相会；我要从遮罪盖[a]上方、从见证柜上的两个基路伯中间与你说话，把我将要为以色列子孙[b]所吩咐你的一切告诉你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遮罪盖”指柜上的金盖；传统译作“施恩座”，也可译作“赎罪盖”。
    reason: 说明礼仪专名及主要译法，避免读者把该词误解为普通盖子或实际座椅。
  - marker: b
    text: “以色列子孙”指以色列全体人民。原文此处直译可作“向、给或为以色列子孙”；该介词与“吩咐你”的关系在句法上较为压缩。
    reason: 说明民族称谓的范围，并保留介词אֶל在压缩句法中的关系余地。
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: 在那里，我要与你相会
  rationale: נפעל词形在这里表示按约定相会；“与你相会”保留了直接会面的关系意味，“在那里”承接前文所述的柜盖所在之处。
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: 跟你说话
  rationale: אִתְּךָ带有“与你”的直接互动意味；现代汉语“跟你说话”自然清楚，也不把关系性表达削弱为单向宣告。
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: 从遮罪盖上方
  rationale: מֵעַל明确表示声音发出的空间位置。“遮罪盖”既指出这是柜上的金盖，也保留כפר词族在礼仪语境中的赎罪关联；脚注列出传统译名。
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: 从……两个基路伯中间
  rationale: 按原文保留“两者中间”的空间关系；“基路伯”是现代中文圣经语境中对该类天上活物的通行音译。
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: 见证柜上
  rationale: 直译核心名词עֵדוּת为“见证”，不在正文中进一步限定为石版或约书，以免加入原文此处未明说的内容。
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ אֶל בְּנֵי יִשְׂרָאֵל
  choice: 凡我要吩咐你传给以色列子孙的，我都要告诉你
  rationale: 以自然汉语重组原文压缩的结构，保留“所有/凡”的全面性，并将אֶל理解为命令经摩西传向以色列子孙；脚注保留另一种关系理解。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来语的家族—民族称谓，同时在现代汉语中仍清楚可懂。
theological_decisions:
- issue: הַכַּפֹּרֶת的礼仪含义
  choice: 遮罪盖
  alternative: 施恩座；柜盖
  rationale: “遮罪盖”同时呈现器物是柜盖的事实及其与赎罪礼仪的词义联系，又避免把该物件直接解释成实体座位；传统译法在脚注中保留。
- issue: 命令与以色列子孙之间的句法关系
  choice: 吩咐摩西传给以色列子孙
  alternative: 为以色列子孙而吩咐摩西；对以色列子孙所下的命令
  rationale: 原文אֶל表示朝向或对象，但结构较为压缩。正文采用符合摩西中介角色且汉语自然的表达，脚注承认“给/为”的语义可能，不把细微关系绝对化。
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 保留原文的亲属性民族表达，不将其仅平化为一般族称；这里指整个民族群体，而非只指男性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“相会”“见证柜”“基路伯”保持经文礼仪语域；分成两句以避免长串方位语和宾语造成生硬。“就是”说明神说话的地点具体位于柜盖上方、两个基路伯之间，并未把两个空间表达视为不同地点。
