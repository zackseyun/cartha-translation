  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: zh_hans
  text: 要用一他连得的纯金做灯台和这一切器具。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּכָּר
  choice: 一他连得
  rationale: 这是古代标准重量单位；保留传统度量名称，比泛译为“一定数量”更准确。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 在制作器物的语境中，指纯净、精纯的金；“纯金”自然且准确。
- source_word: יַעֲשֶׂה
  choice: 要……做
  rationale: 未完成式在本段表达制作指令；现代汉语用“要……做”既体现规定语气，也保持自然。
- source_word: אֹתָהּ
  choice: 灯台
  rationale: 阴性单数宾语代词回指上文的灯台。汉语若只译“它”容易含混，因此明示所指，但不增加新的信息。
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: 和这一切器具
  rationale: כֵּלִים 可泛指器具、用具或器皿；此处与灯台配套的各物相连，“器具”范围适中，并保留并列关系。
