lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要做
  rationale: 带连接词的Qal完成式处于连续指令中，表达命令；“你要做”既自然又保留指令语气。句首连接词另以脚注说明。
- source_word: שֻׁלְחָן
  choice: 一张桌子
  rationale: 指会幕器具中的桌子；首次引入时用量词“一张”符合现代汉语。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 该结构表示这种树的木材；“皂荚木”是中文圣经传统中清楚、简洁的对应词。
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: 长二肘
  rationale: 将原文名词式“它的长度二肘”译为现代汉语常用的尺寸表达，同时保留“肘”这一源文化单位。
- source_word: וְאַמָּה רָחְבּוֹ
  choice: 宽一肘
  rationale: 以平行而自然的中文尺寸表达传达“它的宽度一肘”。
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: 高一肘半
  rationale: 准确传达“它的高度一肘又一半”，并采用简洁自然的现代汉语说法。
