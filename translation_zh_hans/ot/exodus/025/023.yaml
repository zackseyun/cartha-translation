  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: zh_hans
  text: 你要用金合欢木做一张桌子[a]，长二肘，宽一肘，高一肘半。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“并且你要做。”希伯来文的连接词把这项指示与前面的命令连在一起。
