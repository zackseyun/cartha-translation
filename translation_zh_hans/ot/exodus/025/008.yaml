  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: zh_hans
  text: 他们要为我建造一座圣所，好让我住在他们中间[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在他们中间。”原文用复数“他们”，强调上帝住在百姓中间，并非只说他住在圣所建筑之内。
    reason: 说明原文复数词尾及其群体指向，避免把上帝的临在误解为仅局限于建筑物。
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: 他们要……建造
  rationale: 在本段指示性语境中，此形式表达命令或要求；用“他们要”自然保留第三人称复数的指令语气。
- source_word: לִי
  choice: 为我
  rationale: 介词 ל 加第一人称单数词尾在这里表示对象或用途，即为上帝建造。
- source_word: מִקְדָּשׁ
  choice: 圣所
  rationale: 该词指分别为圣、供上帝临在的地方；“圣所”是现代中文中准确、庄重且符合上下文的表达。
- source_word: וְשָׁכַנְתִּי
  choice: 使我住在
  rationale: שׁכן 表示居住、安居；前后分句在语境中具有目的关系，“使我住在”既自然，也不把含义缩减为仅仅位于建筑物内。
- source_word: בְּתוֹכָם
  choice: 在他们中间
  rationale: 原文为复数词尾，直指“他们中间”，强调上帝临在于百姓当中，而不是说“住在圣所里面”。
theological_decisions:
- issue: 上帝居住之处的所指
  choice: 在他们中间
  alternative: 在其中／在圣所里
  rationale: 希伯来语词尾是复数“他们”，因此应保留上帝住在百姓中间的表述；圣所是其临在的场所，却不能取代原文对群体的明确指向。
- issue: 两分句之间的关系
  choice: 使我住在
  alternative: 我就要住在
  rationale: 上下文可将第二分句理解为建造圣所的目的，也可读为随之而来的结果或应许。“使”自然呈现主要的目的关系，同时未增添额外教义限定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“建造一座圣所”符合汉语搭配；“他们要”保留第三人称指令语气；正文与脚注共同凸显 בְּתוֹכָם 的复数群体指向。
