  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: zh_hans
  text: 你要把陈设饼放在桌子上，常在我面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陈设饼”希伯来文直译为“面前之饼”；也可译为“临在之饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: 要……摆
  rationale: נתן可表示“放、安置”；在陈设桌上礼仪物品的语境中，“摆”自然、准确，也符合上帝直接吩咐的语气。
- source_word: עַל הַ/שֻּׁלְחָן
  choice: 在桌子上
  rationale: 介词עַל表示物品位于桌面之上；定冠词所指的是本段已经规定制作的那张桌子。
- source_word: לֶחֶם פָּנִים
  choice: 陈设饼
  rationale: 该短语直译近于“面前之饼／临在之饼”。“陈设饼”是简明且较通行的中文礼仪用语；脚注保留希伯来文的字面含义，避免其“在上帝面前”的意涵变得不透明。
- source_word: לְ/פָנַ/י
  choice: 在我面前
  rationale: 直译为“在我面前”，保留上帝第一人称的直接话语，并与前面的礼仪名称相区别。
- source_word: תָּמִיד
  choice: 常常
  rationale: תמיד在祭司礼仪语境中可指持续或按规定不断维持。“常常”既保留持续性，也不强行限定为绝无间断的时间概念。
theological_decisions:
- issue: 礼仪术语 לֶחֶם פָּנִים 的表达
  choice: 陈设饼
  alternative: 临在之饼；面前之饼
  rationale: “陈设饼”适合现代中文正文，并与随后“在我面前”形成自然表达；脚注说明原文含义，以保留这饼与上帝临在相关的神学意涵，而不把两处相关但不同的措辞合并。
- issue: תָּמִיד所表达的持续性
  choice: 常常
  alternative: 不断；永远
  rationale: 原词在圣所礼仪中可表达持续维持或定期不断的礼仪责任。“常常”保存这种范围，不把经文过度解释为抽象的绝对永恒。
translation_notes:
  register: 采用现代、庄重而易懂的命令语体。“摆在桌子上”符合具体陈设动作；保留“在我面前”，以呈现原文重复使用“面／面前”词根所产生的礼仪意味。
