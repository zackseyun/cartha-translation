  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goat hair[b],
translation:
  language: zh_hans
  text: 蓝色线、紫色线、朱红色线[a]、细麻布和山羊毛[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“绯红色线”或“深红色料”；原文的说法与由虫类取得的红色染料有关。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“山羊”；这里指取自山羊的材料。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְכֵלֶת
  choice: 蓝色料
  rationale: 该词指用蓝色或蓝紫色染料染成的贵重纺织材料；此处采用自然简洁的“蓝色料”，既表达主要色彩，也保留材料清单的语境。
- source_word: אַרְגָּמָן
  choice: 紫色料
  rationale: 该词指昂贵的紫色染料或染成的纺织材料；“紫色料”在本清单中清楚而自然。
- source_word: תוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该短语字面涉及产生红色染料的虫，实际转指由这种染料染成的朱红色纺织材料；结合会幕织物的语境译作“朱红色线”。
- source_word: שֵׁשׁ
  choice: 细麻
  rationale: 在会幕材料的语境中，该词指优质细麻织物；“细麻”简明且符合现代中文表达。
- source_word: עִזִּים
  choice: 山羊毛
  rationale: 原文直译为“山羊”，但在这份材料清单中所指的是用于织造的山羊毛，因此将语境隐含的材料直接表达出来。
