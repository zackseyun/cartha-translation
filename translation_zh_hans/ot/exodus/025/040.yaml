  rationale: 修订仅为改善汉语句法和脚注对应性：将“在山上”置于“你……所看见的”关系从句中，清楚表达其修饰“样式”；“所看见的”自然保留了被展示的核心含义，且不在汉语中强定为过去或正在进行。
