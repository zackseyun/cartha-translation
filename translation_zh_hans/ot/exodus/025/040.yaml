  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: zh_hans
  text: 你要留心，要照着你在山上所看见的样式[a]制造它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要看着在山上指示给你的样式制造它们。”
    reason: 保留וּרְאֵה较直译为“看”的可能，并反映“看／留心”与“制造”两个相连的命令；“指示给你的”也表达מָרְאֶה的被展示含义。
lexical_decisions:
- source_word: וּרְאֵה
  choice: 你要留心
  rationale: ראה的命令式在这里具有告诫、要求谨慎注意的语用功能；“你要留心”以自然现代汉语表达其命令力度。
- source_word: וַעֲשֵׂה
  choice: 制造
  rationale: עשה在本段涉及制作会幕器具，因此译为“制造”比泛指的“做”更明确。
- source_word: בְּתַבְנִיתָם
  choice: 照着……样式
  rationale: תבנית可指样式、模型或形制；“照着……样式”表达依照所示范型制作，并保留其具体性质的开放性。复数阳性后缀由“它们”所指的器具体现。
- source_word: אֲשֶׁר אַתָּה מָרְאֶה
  choice: 在……指示给你的
  rationale: מָרְאֶה宜按ראה的使役被动分词理解，即“被指示、被展示”；汉语用“指示给你的”自然表达被动含义，且不强行限定为过去或正在进行。
- source_word: בָּהָר
  choice: 在山上
  rationale: ב在此表示摩西领受指示的地点，现代汉语自然译作“在山上”。
theological_decisions:
- issue: 所启示之תבנית的性质
  choice: 样式
  alternative: 模型、形制、蓝图
  rationale: “样式”既可表示制作所依据的范型，又不预设它必是实体模型、建筑蓝图或某种天上原型，从而保留原文的神学开放性。
- issue: מָרְאֶה的时间体意义
  choice: 不在正文中明定为“正在”或“曾经”指示
  alternative: 正在指示给你的；曾指示给你的
  rationale: 希伯来语使役被动分词可突出受指示的状态，而上下文允许汉语不标明精确时间；这样既自然，也避免过度解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你要留心”传达告诫语气；“制造它们”承接上文各项器具。正文中的[a]与脚注对应。
