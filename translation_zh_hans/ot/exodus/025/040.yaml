    rationale: 现译“照着在山上指示给你的样式”在汉语中可理解，但地点短语与被动展示结构前置，略显压缩。后置为“照着你在山上所看见的样式”更清晰地表明该从句修饰“样式”。
  - severity: low
    issue: 脚注的替代译文未充分对应主文的自然句法
    rationale: 脚注“看清楚”可作直译提示，但“看清楚”较口语化，并把原文告诫性的ראה具体化为视觉清晰度。宜用“你要看着……的样式”说明较直译的可能。
