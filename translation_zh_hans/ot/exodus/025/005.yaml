lexical_decisions:
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: 染红的公羊皮
  rationale: עֹרֹת אֵילִם意为“公羊的皮”，מְאָדָּמִים表示经处理而变红；“染红的公羊皮”既保留材料来源，也自然表达其加工状态。
- source_word: עֹרֹת תְּחָשִׁים
  choice: 优质皮革[a]
  rationale: תְּחָשִׁים的确切所指不明，可能指某种动物或某类皮料。“优质皮革”在正文中传达其作为耐用覆盖材料的性质，同时用脚注保留词义上的不确定性，避免武断指定动物。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: שִׁטִּים通常被认定为金合欢属树木；“皂荚木”是现代中文圣经语境中通行且易辨认的名称。
