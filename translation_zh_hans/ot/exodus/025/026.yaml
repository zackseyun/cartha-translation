  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: zh_hans
  text: 你要为桌子做四个金环，把环安在桌子四个脚[b]所在的四角[a]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “四角”也可译作“四边”或“四缘”。
    reason: lexical_alternative
  - marker: b
    text: “脚”也可译作“腿”；希伯来语 רֶגֶל 可按语境指脚或腿。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做
  rationale: 带连接词的完成式用于连续指令，表达命令；“你要”在现代汉语中自然保留其指令语气。
- source_word: לּוֹ
  choice: 为桌子
  rationale: 阳性单数代词按上下文指前述的桌子；汉语明说“桌子”比使用“它”更清楚自然。
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: 四个金环
  rationale: 准确表达数目、器物和材质，符合现代汉语词序。
- source_word: וְנָתַתָּ
  choice: 安在
  rationale: נתן在制作器具的语境中指把部件设置在指定位置；“安在”既自然，也体现固定安装之意。
- source_word: עַל
  choice: 在……上
  rationale: 保留该介词所表达的表面或位置关系。
- source_word: אַרְבַּע הַפֵּאֹת
  choice: 四角
  rationale: פֵּאָה可指边、侧面或角；就桌子金环的安装位置而言，“四角”最符合具体图景，同时以脚注保留其他词义可能。
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: 桌子四个脚所在的
  rationale: 关系从句把四处角位与桌子的四个支脚相联；此译法在汉语中清楚说明空间关系，并避免生硬直译。
