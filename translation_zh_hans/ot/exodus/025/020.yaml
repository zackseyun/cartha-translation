  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: zh_hans
  text: 基路伯要向上展开翅膀，用翅膀遮盖施恩盖[a]。他们的脸要彼此相对；基路伯的脸要朝向施恩盖。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎罪盖”。希伯来语“卡波雷特”指约柜的金盖。
    reason: 保留 כַּפֹּרֶת 的另一种重要译法，并说明其具体所指。
lexical_decisions:
- source_word: וְהָיוּ
  choice: 要
  rationale: 在会幕制作指示的语境中，该形式带有规定和将来落实的意味；用“要”自然表达指令性。
- source_word: הַכְּרֻבִים
  choice: 基路伯
  rationale: 采用现代中文圣经中通行的音译，指约柜上方所造的有翼形象；中文名词无需另加复数词尾。
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: 向上展开翅膀
  rationale: 保留分词所描写的伸展姿态以及 לְמַעְלָה 的方向含义，不把它误解为翅膀位于另一个物体上方。
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: 用翅膀遮盖
  rationale: “用”表达工具性的 בְּ；“遮盖”呈现翅膀伸展在盖上方形成覆盖的具体图像，同时不额外加入保护含义。
- source_word: הַכַּפֹּרֶת
  choice: 施恩盖
  rationale: 该词指约柜的金盖，并具有赎罪礼仪意义。“施恩盖”兼顾传统称谓中的神学关联和该物件确为盖子的实体特征；脚注保留“赎罪盖”这一译法。
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: 他们的脸要彼此相对
  rationale: 希伯来语直译为“各人朝向自己的弟兄”，是表达双方相对的分配性习语；中文用“彼此相对”自然而准确。
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: 基路伯的脸要朝向施恩盖
  rationale: 保留“脸”的具体意象和朝向施恩盖的空间关系，不把两项面部朝向的描述合并或解释掉。
theological_decisions:
- issue: כַּפֹּרֶת 在会幕指示中的译法
  choice: 施恩盖
  alternative: 赎罪盖；盖
  rationale: 此词既指约柜实际的金盖，也与赎罪礼仪密切相关。“施恩盖”避免只译作笼统的“盖”，同时以“盖”明确物件性质；脚注列出“赎罪盖”，保留词义及神学侧重点上的张力。
- issue: 基路伯脸部朝向的双重描述
  choice: 分别保留“彼此相对”和“朝向施恩盖”
  alternative: 解释为彼此相对并向下俯视施恩盖
  rationale: 原文同时陈述这两个朝向，却未明说“向下”或“俯视”；译文不补入原文没有明确表达的空间解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“向上展开”“用翅膀遮盖”“彼此相对”保持具体、易懂；分号呈现原文后半句两项紧密相关但不宜混同的朝向描述。
