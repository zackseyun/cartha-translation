  text: 要用金合欢木做杠子，并用金包覆杠子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 要……做
  rationale: 该形式在连续的指示语境中表达命令；“要……做”在现代汉语中自然地保留了指令语气。
- source_word: בַדֵּי
  choice: 抬杠
  rationale: 指用于抬运约柜的杠；“抬杠”能明确表达其搬运用途，也符合器物制作语境。
- source_word: עֲצֵי שִׁטִּים
  choice: 金合欢木
  rationale: 这是希伯来语所指木材的通行现代中文名称，比音译更易懂。
- source_word: וְצִפִּיתָ
  choice: 包裹
  rationale: 该动词表示以某种材料覆盖器物表面；这里指在木杠外面覆金。
- source_word: אֹתָם
  choice: （隐含于“包裹”）
  rationale: 所指为复数的抬杠；现代汉语承接前句时可自然省略宾语代词，避免生硬重复。
- source_word: זָהָב
  choice: 用金子
  rationale: 表示覆盖所用的材料；“用金子包裹”准确而自然。
