  text: 你要用金合欢木做杠子，用金包裹它们；桌子要用这些杠子抬。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做
  rationale: 在会幕制作指示的语境中，带连接词的完成式表达命令；“你要”符合现代汉语指令体。
- source_word: הַבַּדִּים
  choice: 抬杠
  rationale: 此词在会幕器具的语境中指搬运器具所用的长杆；“抬杠”明确表达用途，也比单说“杠”更易懂。
- source_word: עֲצֵי שִׁטִּים
  choice: 金合欢木
  rationale: 该短语指一种相思树属木材，现代汉语用“金合欢木”比传统音义不明的名称更透明。
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: 并用金包裹
  rationale: צפה 在工艺语境中指以金属覆盖器物表面；“用金包裹”自然、清楚，不额外限定具体镀覆工艺。
- source_word: וְנִשָּׂא בָם אֶת־הַשֻּׁלְחָן
  choice: 桌子要用这些杠抬
  rationale: נשא 的形式在此表达被动意义，而 בָם 标明工具或手段；汉语以“用这些杠抬”自然呈现这种工具关系。
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 指上文所述的桌子；直译即可，无须在正文加入陈设饼等解释。
