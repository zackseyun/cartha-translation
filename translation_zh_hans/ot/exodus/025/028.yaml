translation_notes:
  register: 采用庄重而清楚的现代标准汉语指令体。“抬杠”在本句中按字面指搬运桌子的杠杆；分号使制作抬杠与其用途之间的关系清晰。未为 בָם 设置脚注，因为“用这些杠”已直接而无损地表达其工具意义，中文不存在需要另列的实质性歧义。
