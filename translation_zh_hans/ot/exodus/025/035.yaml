  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: zh_hans
  text: 在从灯台伸出的两根枝子下面，要有一个球饰；在从灯台伸出的两根枝子下面，要有一个球饰；在从灯台伸出的两根枝子下面，要有一个球饰；这是为从灯台伸出的六根枝子而设的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: 球饰
  rationale: 此词指灯台上与花形装饰相配的圆球状装饰构件；译作“球饰”既表达形状，也说明其装饰性质，较单用“球”清楚。
- source_word: קָנִים
  choice: 枝子
  rationale: 在灯台结构的语境中，此词指从灯台主体向两侧伸出的分枝；“枝子”保留原文以植物形态描写灯台的意象。
- source_word: מְנֹרָה
  choice: 灯台
  rationale: 指承托灯盏的整体器具，而非单个灯或烛台；“灯台”符合本段会幕器具的语境。
- source_word: תַחַת שְׁנֵי הַקָּנִים מִמֶּנָּה
  choice: 每一对枝子从灯台伸出的地方下面
  rationale: 原文直述“在从它出来的两根枝子下面”；按结构关系自然表达为每对枝子与灯台相接处的下方，同时不增添具体制作细节。
