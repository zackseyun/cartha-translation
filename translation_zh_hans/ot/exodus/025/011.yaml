  text: וְ/צִפִּיתָ֤ אֹת/וֹ֙ זָהָ֣ב טָה֔וֹר מִ/בַּ֥יִת וּ/מִ/ח֖וּץ תְּצַפֶּ֑/נּוּ וְ/עָשִׂ֧יתָ עָלָ֛י/ו זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: zh_hans
  text: 你要用纯金包覆它，里面外面都要包覆；又要在它四周做一道金边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金饰边”或“金框”；传统译作“金冠”。希伯来语 זֵר 指环绕器物的装饰性边缘。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: 包覆／都要包覆
  rationale: 在会幕器具的制作语境中，צפה指用金属层包住物件；“包覆”既准确表达工艺含义，也保留原文重复这一动词的强调。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 该词组指精炼而纯净的金；“纯金”是现代汉语自然、明确的表达。
- source_word: מִבַּיִת וּמִחוּץ
  choice: 里面外面
  rationale: 两个短语彼此对举，分别指器物的内侧和外侧；“里面外面”简洁地保留了原文的平行结构。
- source_word: וְעָשִׂיתָ עָלָיו
  choice: 又要在它……做
  rationale: עַל在这里表示金边安置或附着于器物之上；“在它……做”自然表达其位置关系，不额外限定具体结构。
- source_word: זֵר
  choice: 边
  rationale: זֵר在会幕器具语境中指环绕器物的凸缘、框边或装饰性镶边。“边”通俗自然，并与“四周”搭配；因具体形制并不完全确定，脚注保留其他可能译法。
- source_word: סָבִיב
  choice: 四周
  rationale: 该词表示环绕各边；“四周”准确传达完整环绕的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的制作指令语体。“包覆”体现贴覆金层的工艺含义；保留原文两次使用צפה所形成的重复。“金边”避免让“金冠”被误解为戴在头上的冠冕，同时以脚注保存词义和传统译法的开放性。
