  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: zh_hans
  text: 你要在这一端做一个基路伯，在那一端做一个基路伯；你们要从施恩座[a]做出这两个基路伯，在施恩座的两端。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从施恩座做出”表示这两个基路伯要由施恩座本身制成，与施恩座连成一体，不是另外制成后再接上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: 你要……做
  rationale: 该形式为第二人称阳性单数命令式；用“你要”自然表达指令，并保留与后半句复数主语的区别。
- source_word: כְּרוּב ... וּכְרוּב / הַכְּרֻבִים
  choice: 一个基路伯……一个基路伯 / 两个基路伯
  rationale: “基路伯”是中文圣经传统中对这种特定天上活物的通行音译；前两处保留单数及对称结构，后文以“两个”自然表达希伯来语复数。
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: 在这一端……在那一端
  rationale: 此处按位置关系译为“在”，比机械译作“从”更符合现代汉语；“这一端……那一端”保留原文的对称指示。
- source_word: מִן הַכַּפֹּרֶת
  choice: 从施恩座做出
  rationale: מִן在这里表达来源或材料关系，表示基路伯由施恩座本体制成，并非另造后接上；“施恩座”保留会幕语境中的传统专名。
- source_word: תַּעֲשׂוּ
  choice: 你们要……做出
  rationale: 该动词是第二人称阳性复数未完成式，在指令语境中译作“你们要”；特意保留原文由单数“你”转为复数“你们”的变化。
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: 安在施恩座的两端
  rationale: עַל在此表示安置位置；将代词所指的“施恩座”明确说出，可避免中文中“它”指代不清。
theological_decisions:
- issue: כַּפֹּרֶת的译法
  choice: 施恩座
  alternative: 盖；遮罪盖
  rationale: 该词在此首先指约柜上的盖，但在会幕礼仪中具有赎罪功能。“施恩座”是中文读者熟悉的专名；脚注提示物件结构，避免读者只把它理解为普通座位。
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。保留“这一端……那一端”的平行结构，也保留原文前半句单数“你”与后半句复数“你们”的人称数变化；为避免代词歧义，末句重复“施恩座”。
