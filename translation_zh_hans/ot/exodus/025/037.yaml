  to: 要做它的七盏灯；他[a]要把灯盏安置好[b]，使灯光照向灯台前方。
  rationale: 修订仅改善汉语表达的明确性与流畅性：“安置好”保留原文动词在安设与点燃之间的语义余地，脚注继续提供“点亮”的可能；以“灯台前方”明确后缀所指。保留第二人称转为第三人称单数的结构及脚注锚点。
