source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת נֵרֹתֶ֖י/הָ שִׁבְעָ֑ה וְ/הֶֽעֱלָה֙ אֶת נֵ֣רֹתֶ֔י/הָ וְ/הֵאִ֖יר עַל עֵ֥בֶר פָּנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: zh_hans
  text: 要做它的七盏灯；他[a]要把灯盏安置好[b]，使灯光照向灯台前方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用第三人称阳性单数“他”，却没有在本节明说是谁；所指很可能是料理灯台的祭司。
    reason: cultural_note
  - marker: b
    text: 或译：“点亮灯盏，使灯光照向灯台前方。”原文动词的基本意思是“使上去”，在这里也可能指把灯点着。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 要做
  rationale: 该形式在这一连串建造指示中表达对摩西的命令。“要做”简洁保留指令语气；中文可由上下文明确受命者。
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: 它的七盏灯
  rationale: נֵר在此指灯台上的灯盏；阴性单数后缀回指上文的灯台。“七盏灯”符合现代汉语量词习惯。
- source_word: וְהֶעֱלָה
  choice: 他要把……安放上去
  rationale: עלה的使役形基本义为“使上去”，在礼仪器具语境中可指把灯盏装设好，也可含点灯之意。正文用“安放上去”保留与随后发光结果之间的区别，并用脚注交代另一可能。
- source_word: וְהֵאִיר
  choice: 使灯光照向
  rationale: 该使役形式表达安放或点燃灯盏所产生的照明作用。中文补出“灯光”，使句意自然清楚，又不改变所指。
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: 向它的前方
  rationale: 该短语指相对于灯台正面的照射方向。“向……前方”既体现方向性，也比直译“在它脸的对面”自然。
theological_decisions:
- issue: 第三人称单数动作主体未明说
  choice: 正文保留“他”
  alternative: 改为无人称的“要”或复数“他们”
  rationale: וְהֶעֱלָה是第三人称阳性单数，不宜改成复数。虽然所指很可能是负责料理灯台的祭司，但本节并未明说其身份，因此正文只译“他”，脚注说明。
- issue: 安放灯盏还是点灯
  choice: 正文译“安放上去”，脚注保留“点亮”的可能
  alternative: 正文直接译“点亮”
  rationale: 使役形עלה在此可理解为使灯盏上升、装设或点燃。为避免把词义歧义提前消解，正文采用较贴近基本动作的表达，同时以脚注注明礼仪语境中的另一解释。
translation_notes:
  register: 采用现代、庄重而易懂的指令体。“灯盏”用于具体器具，“灯光”用于其照明作用；保留原文从第二人称“你”转为第三人称“他”的变化及相关歧义。
