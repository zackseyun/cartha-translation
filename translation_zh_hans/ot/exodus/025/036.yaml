base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: zh_hans
  text: 花苞和枝子要与灯台一体成形[a]；全座灯台都要用纯金锤打成一整件[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都要从灯台本体制成。”意思是花苞和枝子须与灯台一体成形，不可另行制作后接上。
    reason: lexical_alternative
  - marker: b
    text: 或译：“全座灯台都是一件纯金的锤制品。”希伯来文强调，整个灯台以锤打的方法制成一个整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: 花苞
  rationale: 该词在灯台的植物造型语境中指圆形的花饰；译作“花苞”比“球饰”更能体现上下文的植物意象。
- source_word: וּקְנֹתָם
  choice: 枝子
  rationale: קָנֶה本可指芦苇、茎或杆；在灯台语境中指向外伸出的支臂，译作“枝子”自然，并与植物造型相呼应。
- source_word: מִמֶּנָּה יִהְיוּ
  choice: 都要与灯台连成一体
  rationale: 字面可作“要从它而出”，这里强调花苞和枝子由灯台本体制成，而非另行制作后接上；“连成一体”清楚传达一体成形的工艺要求。
- source_word: כֻּלָּהּ
  choice: 整个灯台
  rationale: 阴性代词所指是前文的灯台；明说“整个灯台”使现代汉语指代清楚，并保留整体性的强调。
- source_word: מִקְשָׁה אַחַת
  choice: 锤成一件
  rationale: מִקְשָׁה指以锤打方式制成的金属器物，אַחַת强调单一整体；“锤成一件”同时表达制作方法和一体构造。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 这是该希伯来语固定搭配在现代汉语中的准确自然表达。
theological_decisions: []
