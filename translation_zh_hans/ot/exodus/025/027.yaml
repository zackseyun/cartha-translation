  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: zh_hans
  text: 环要在边框相对的位置[a]，作杠的套座[b]，以便用杠抬桌子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“靠着边框”或“与边框相对应”。希伯来语只说明二者的相对位置，没有明确限定具体的几何布局。
    reason: lexical_alternative
  - marker: b
    text: 直译“作杠的房屋”，意思是供杠穿入的套座或承接处。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: 在……相对的位置
  rationale: 该词组表示相对于另一物件的位置；此译法保留空间关系，同时不把具体几何位置限定为正对面。
- source_word: הַמִּסְגֶּרֶת
  choice: 边框
  rationale: 在本段桌子构造的语境中，指桌子周围的框边结构；“边框”比“框架”更具体，也符合现代汉语器物描述。
- source_word: תִּהְיֶיןָ הַטַּבָּעֹת
  choice: 环要安在
  rationale: 希伯来文直译为“环要在”；中文补出“安”以自然表达建造指示，并未增加新的构造细节。
- source_word: לְבָתִּים
  choice: 作为……套座
  rationale: 原义为“作房屋”，此处比喻供杠穿入的承接结构；“套座”简洁表达其容纳和固定功能。
- source_word: לְבַדִּים
  choice: 穿杠
  rationale: בַּדִּים 在会幕器具语境中指搬运用的杠；结合“套座”，译作“穿杠”自然表明杠要穿入其中。
- source_word: לָשֵׂאת
  choice: 用来抬
  rationale: 不定式表示目的；对由杠搬运桌子的动作，现代汉语用“抬”比泛称“搬运”更形象准确。
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 该词在本段指所造的桌子，采用通行且自然的现代汉语名称。
