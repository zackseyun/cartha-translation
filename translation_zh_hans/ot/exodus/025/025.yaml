  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: zh_hans
  text: 要给它做一个环绕四围、一掌宽的边框；又要在这边框四围做一道金边饰[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金冠边”。希伯来语“זֵר”可指装饰性的镶边或凸缘；传统上常译作“冠”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: 边框
  rationale: 指安在桌子周围、具有结构作用的框边；“边框”在现代汉语中自然明确，又不过度限定其具体形制。
- source_word: טֹפַח
  choice: 一掌宽
  rationale: 该词是长度单位“掌宽”；在此说明边框的尺寸，译作“一掌宽”简洁清楚。
- source_word: סָבִיב
  choice: 四围
  rationale: 原文两次使用该词，均表示环绕设置；译文两处保留“四围”，体现原文的重复与布局重点。
- source_word: זֵר
  choice: 边饰
  rationale: 在会幕器具的语境中，指环绕器物的装饰性镶边或凸缘。“边饰”既表达装饰作用，也避免现代读者把传统译法“冠”误解为独立的王冠。
- source_word: זָהָב
  choice: 金
  rationale: 直接表达材料，与“边饰”组合为自然的现代汉语“金边饰”。
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: 它 / 这边框
  rationale: 代词回指上文的桌子；首处保留“它”，第二处用“这边框”自然承接本节前半句，同时不必重复补出“桌子”。
- source_word: וְעָשִׂיתָ
  choice: 要……做
  rationale: 保留连续指示的语气；两次“做”对应原文重复的动词，并符合现代汉语规章式指令的庄重表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“一圈”帮助读者自然理解环绕结构，“四围”则保留原文两次 סָבִיב 的重复。分号呈现两项紧密相连的制作指示。脚注标记置于“金边饰”之后，因为脚注解释的是 זֵר，而不是长度单位 טֹפַח。
