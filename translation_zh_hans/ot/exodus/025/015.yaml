  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: zh_hans
  text: 杠要留在约柜的环中，不可取出。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: 在……的环中
  rationale: טַבַּעַת 指安装在约柜上的环；介词 בְ 在此表示杠位于环内，现代汉语用“在……的环中”自然准确。
- source_word: הָאָרֹן
  choice: 约柜
  rationale: אָרוֹן 在会幕语境中特指神圣的约柜；“约柜”是现代中文圣经语境中清楚而准确的称呼。
- source_word: יִהְיוּ
  choice: 要留在
  rationale: היה 字面义为“是、在”，此处结合下句的禁令表达持续处于原位；“要留在”既体现延续性，也保留命令性。
- source_word: הַבַּדִּים
  choice: 杠
  rationale: בַּדִּים 指抬约柜所用的长杆；“杠”简洁、自然，并与本段器具制作语境相合。
- source_word: לֹא יָסֻרוּ
  choice: 不可……取下来
  rationale: סוּר 可表示离开、移去；在杠与环的具体关系中，“不可取下来”自然表达禁止将杠移除。
- source_word: מִמֶּנּוּ
  choice: 从约柜上
  rationale: 阳性单数代词后缀回指约柜。中文明确重复“约柜”可避免“从它上面”的生硬和潜在歧义；“上”体现杠与约柜所附之环的关系。
