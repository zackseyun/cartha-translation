base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: zh_hans
  text: 你要用金子做两个基路伯；要从施恩座[a]的两端把它们锤打成形。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎罪盖”。这个希伯来词指约柜的盖，在这一礼仪语境中传统上译作“施恩座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 要造
  rationale: 连词加完成式在连续的制造指示中表达命令；“要造”自然保留法规式、指令式语气。
- source_word: שְׁנַיִם כְּרֻבִים
  choice: 两个金基路伯
  rationale: “基路伯”是 כְּרוּב 的传统音译，可避免用现代艺术中常见的“小天使”等词而误导其形象；数词直译为“两个”。
- source_word: זָהָב
  choice: 金
  rationale: 这里表示制作材料；“金基路伯”在现代汉语中简洁明确，即“用金子制成的基路伯”。
- source_word: מִקְשָׁה
  choice: 用锤打的工艺
  rationale: 该词指把金属锤打成形的制法；此译法保留制造方式，而不额外断定“整块”这一可能的工艺含义。
- source_word: תַּעֲשֶׂה אֹתָם
  choice: 要……造出它们
  rationale: 保留原文第二次出现的“造”，同时以“造出”自然表达锤打成形的结果。
- source_word: מִשְּׁנֵי קְצוֹת
  choice: 安在……的两端
  rationale: מן 在这里表达与两端的空间或起始关系；“安在”适合汉语制造指示，又不明确断定基路伯究竟是与盖连成一体还是另行置于其上。
- source_word: הַכַּפֹּרֶת
  choice: 施恩座
  rationale: 这是约柜金盖在中文圣经传统中的通行礼仪用语，并能保留其与赎罪及上帝临在相关的神学内涵；较直观的器物名称在脚注中说明。
theological_decisions:
- issue: הַכַּפֹּרֶת 在会幕语境中的译法
  choice: 施恩座
  alternative: 赎罪盖；约柜的盖
  rationale: “施恩座”保留该圣物在中文经文传统中的特定身份及其礼仪神学意涵；不过，该希伯来词在器物层面也确实指约柜的盖，因此脚注列出较透明的译法，不把词义只限定为抽象的“施恩”。
translation_notes:
  register: 采用现代、庄重而易懂的指令体。保留原文两次“造”的结构，并沿用“基路伯”“施恩座”等已为中文读者熟悉的专门用语；脚注交代“施恩座”的具体器物含义和可选译法。
