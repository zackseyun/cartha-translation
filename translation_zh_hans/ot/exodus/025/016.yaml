  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: zh_hans
  text: 你要把我将赐给你的见证[a]放进约柜里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“见证的版”；在本段上下文中具体可指法版。
    reason: 保留“见证”对原文עֵדוּת的直接对应，同时说明其在上下文中的具体所指，而不在正文中过度限定。
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: 你要……放
  rationale: נתן词义广泛，可指“给、放置”。与介词אֶל及容器“约柜”连用时，表示把物件放入其中；现代汉语用“放进”自然准确。句首וְ按汉语行文不必机械译作“并且”。
- source_word: אֶל
  choice: 进……里
  rationale: אֶל本义为“向、到”，在נתן与容器名词的搭配中表示移入内部，汉语以“放进……里”表达。
- source_word: הָאָרֹן
  choice: 约柜
  rationale: אָרוֹן本可指柜、箱，但在会幕语境中特指神圣的约柜；“约柜”是准确且通行的中文称谓。
- source_word: אֵת
  choice: 不单独译出
  rationale: אֵת是确定直接宾语标记，汉语无需以独立词语对应。
- source_word: הָעֵדֻת
  choice: 法版
  rationale: עֵדוּת本义为“见证、证言”，但在本段造柜的具体语境中，所指是神随后赐给摩西并置于柜中的两块版；中文用“法版”能自然指明这一实体。为保留原词较宽的表达，脚注注明直译。
- source_word: אֲשֶׁר
  choice: ……的
  rationale: 关系词אֲשֶׁר连接“见证”与“我将赐给你”，汉语用前置关系从句“我将赐给你的”最自然。
- source_word: אֶתֵּן
  choice: 我将赐给
  rationale: Qal未完成式第一人称单数在此指将来的行动。“赐给”既表达נתן的“给”，也符合上帝对摩西说话的庄重语域。
- source_word: אֵלֶיךָ
  choice: 给你
  rationale: 介词短语表示接受者，即上帝把这见证赐给摩西；汉语自然表达为“赐给你”。
theological_decisions:
- issue: הָעֵדֻת（见证）的具体所指
  choice: 正文译作“法版”，脚注保留“见证”的直译
  alternative: 正文译作“见证”或“见证之物”，不明确指出法版
  rationale: 该词本身并未出现“版”字，存在词汇层面的宽泛性；但出埃及记25章上下文及31:18明确表明要放入柜中的是“见证的两块版”。“法版”在现代中文中比抽象的“见证”更易理解，同时脚注公开原文形式，避免把语境识别伪装成词面直译。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“约柜”“法版”承接出埃及记会幕语境中的通行术语；句式简洁，保留上帝第一人称应许的直接表达。
