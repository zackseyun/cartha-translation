  naturalness: “凡内心自愿的人”可以理解，但“凡是心里乐意的人”更合现代汉语，也更贴近“他的心推动他”的希伯来语惯用表达。“一份奉献”略显抽象；“一份奉献物”在本段征集圣所材料的语境中更清楚。
  terminology: 保留“以色列人”及其文化注释是恰当的。“奉献物”可用于两次 תְּרוּמָה，既保留其为归给上帝、供神圣用途的献纳物，又不把它限缩为祭牲或特定后期礼仪术语。“归我的”明确保留第一人称所属关系。
