base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: zh_hans
  text: “你要告诉以色列人[a]，要他们为我献上一份奉献物[b]。凡是心里乐意的人，你们要从他那里收取归我的奉献物。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，这是对以色列百姓的惯用称呼。
    reason: cultural_note
  - marker: b
    text: “奉献物”或译“供物”“捐献”，指分别出来、归给上帝并用于神圣用途的礼物。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: 你要告诉
  rationale: 该短语是直接命令；现代汉语用“告诉”自然传达向特定对象宣告指示的意思。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在这里是对以色列全体百姓的惯用称呼；“以色列人”在现代汉语中准确且不致误解为仅指男性。
- source_word: וְיִקְחוּ לִי
  choice: 叫他们为我收取
  rationale: 承接前面的命令，表达摩西要吩咐百姓采取行动；“为我”保留 לִי，动词“收取”也与本节末尾同一词根相呼应。
- source_word: תְּרוּמָה
  choice: 奉献／献给我的礼物
  rationale: 该词指分别出来归于神圣用途的供物。在首次出现处用“一份奉献”突出行动及神圣用途，末尾按汉语语境译为“献给我的礼物”，避免生硬重复，并保留归属上帝之意。
- source_word: מֵאֵת כָּל אִישׁ אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: 凡内心自愿的人……从他那里
  rationale: 希伯来语惯用表达强调由内心驱动的自愿意愿；“内心自愿”简洁传达这一点，“从他那里”保留原文单数分配性的表达。
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: 你们都要……收取献给我的礼物
  rationale: 第二人称复数与前面的第三人称形成转换，故明确译出“你们”；“都”自然表达 כָּל 的周遍关系，而“献给我的”保留第一人称所属关系。
theological_decisions:
- issue: 会幕材料征集中 תְּרוּמָה 的性质
  choice: 奉献／献给我的礼物
  alternative: 供物／捐献
  rationale: 译文既表达礼物归给上帝并用于神圣目的，也避免把该词限定为后来礼仪体系中的某一种祭物。
- issue: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ 所表达的意愿
  choice: 凡内心自愿的人
  alternative: 凡心里受感动的人／凡心里催促他的人
  rationale: 原文把心描写为推动人的主体，重点是内在、自发的意愿；“内心自愿”保留自愿性质，但不额外断定这种感动的具体来源。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留命令语气、代词人称转换和自愿奉献的内在动因；脚注标记均置于正文相应位置。
