translation:
  language: zh_hans
  text: 这是你们要从他们那里收取的奉献物：金、银和铜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青铜”；希伯来语 נְחֹשֶׁת 可指铜，也可指青铜等铜合金，须视语境而定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת֙
  choice: 如下
  rationale: 希伯来语连词加指示代词引出后面的具体清单；用“如下”自然地保留其呈示和承接作用。
- source_word: הַ/תְּרוּמָ֔ה
  choice: 奉献物
  rationale: תְּרוּמָה指分别出来用于神圣用途的捐献；本处列举的是会幕所需材料，因此“奉献物”兼顾奉献性质和具体物品。
- source_word: אֲשֶׁ֥ר תִּקְח֖וּ מֵ/אִתָּ֑/ם
  choice: 所要收取的
  rationale: לקח基本义为“取、拿”；结合上一节向以色列人收取奉献物的语境，“收取”自然表达指令含义。“所要”保留未完成式在此的指示语气。
- source_word: זָהָ֥ב
  choice: 金
  rationale: 常见金属名称，直译为“金”。
- source_word: וָ/כֶ֖סֶף
  choice: 银
  rationale: 常见金属名称，直译为“银”。
- source_word: וּ/נְחֹֽשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת可泛指铜或铜合金；现代汉语“铜”可作为较宽泛的材料名称，避免在正文中过度确定其为青铜，同时以脚注保留具体译法。
