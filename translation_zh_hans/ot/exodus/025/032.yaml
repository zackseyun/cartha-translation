  yaml_path: translation/ot/exodus/025/032.yaml
  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: zh_hans
  text: 要有六根枝子从灯台的两侧伸出来：三根灯台的枝子从一侧伸出，三根灯台的枝子从另一侧伸出。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: 枝子
  rationale: 这里指从灯台主体向两侧伸出的构件。“枝子”既保留植物枝条的造型意象，也符合现代中文对灯台结构的自然描述。
- source_word: יֹצְאִים
  choice: 伸出来
  rationale: 该分词描写六根枝子从灯台两侧向外延伸；“伸出来”比直译为“出来”更清楚地表达空间结构，同时保留经文的描述性和指示性。
- source_word: מִצִּדֶּיהָ
  choice: 从灯台的两侧
  rationale: 原文是带阴性单数后缀的复数“从她／它的两侧”，所指为阴性名词“灯台”。中文明确补出“灯台”，避免孤立阅读时指代不清。
- source_word: מְנֹרָה
  choice: 灯台
  rationale: 该词在此指承托灯盏的器具。“灯台”是清楚、通行的中文普通名词，无须音译。
- source_word: מִצִּדָּהּ הָאֶחָד ... מִצִּדָּהּ הַשֵּׁנִי
  choice: 从一侧……从另一侧
  rationale: 希伯来文直译近于“从它的一侧……从它的第二侧”。中文用“一侧……另一侧”自然地表达两边对称的关系，不额外引入方位。
