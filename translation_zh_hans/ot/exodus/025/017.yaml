base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: zh_hans
  text: 你要用纯金做一个施恩座[a]，长二肘半，宽一肘半。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎罪盖”。希伯来语“施恩座”指安放在约柜上面的金盖，并与表示赎罪的词根 כפר 有关。
    reason: 保留 כַפֹּרֶת 的器物含义及其与赎罪相关的词源信息。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做
  rationale: 在会幕制作指示的语境中，连接词加完成式具有命令意味；“你要……做”既自然，也保留指令语气。
- source_word: כַפֹּרֶת
  choice: 施恩座
  rationale: 该词指约柜上面的金盖，是一个具有特定礼仪功能的器物；“施恩座”是中文圣经传统中辨识度高的名称。由于该词与赎罪相关的词根 כפר 有关，正文加注保留“赎罪盖”这一更透明的译法。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 准确表达材料及其纯度，且符合现代汉语表达习惯。
- source_word: אַמָּתַיִם וָחֵצִי
  choice: 二肘半
  rationale: 保留原文古代长度单位，不作现代单位换算；中文用“二肘半”简洁自然。
- source_word: אָרְכָּהּ
  choice: 长
  rationale: 第三人称阴性单数后缀回指施恩座；中文尺寸表达以“长”自然涵盖“它的长度”。
- source_word: וְאַמָּה וָחֵצִי
  choice: 宽一肘半
  rationale: 准确表达一肘半，并与前面的长度尺寸形成自然平行。
- source_word: רָחְבָּהּ
  choice: 宽
  rationale: 第三人称阴性单数后缀回指施恩座；中文以“宽”简明表达“它的宽度”。
theological_decisions:
- issue: 礼仪术语 כַפֹּרֶת 的译法
  choice: 施恩座
  alternative: 赎罪盖；盖
  rationale: 该词既指约柜上的金盖，又因与 כפר 词根的关联而带有赎罪层面的含义。“施恩座”保留中文读者熟悉的专名和礼仪分量；脚注列出“赎罪盖”，避免把其词源及器物性质隐去，也不将两者之间的张力强行消解。
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“施恩座”沿用通行的中文圣经术语，并以脚注说明其可译作“赎罪盖”。尺寸保留“肘”这一原文单位，句式按现代汉语简化为“长……，宽……”。
