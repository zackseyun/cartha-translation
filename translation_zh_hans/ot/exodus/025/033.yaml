  naturalness: “杏花形的杯”“球饰和花”“从灯台伸出的六根枝子”均自然且合乎庄重的器物说明文体。改为“每一根……都要有”后，中文更顺畅，也无需以脚注补救正文的指称问题。
  terminology: “杯”可对应 גְבִעִים；“杏花形的”恰当表达 מְשֻׁקָּדִים；“球饰”对 כַּפְתֹּר 是审慎的功能性译法；“花”“灯台”“枝子”均可保留。
