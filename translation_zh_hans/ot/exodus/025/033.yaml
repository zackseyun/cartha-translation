  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: zh_hans
  text: 从灯台伸出的六根枝子，每一根上都要有三个杏花形的杯，带着球饰和花；六根枝子都要这样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבִעִים
  choice: 杯
  rationale: 该词指杯状器物或装饰形状；在灯台的制作语境中，“杯”准确而简洁。
- source_word: מְשֻׁקָּדִים
  choice: 杏花形的
  rationale: 该词源于“杏树”，在此描述杯状装饰的式样；结合后文的花卉构造，译作“杏花形的”最能表达植物装饰图案。
- source_word: קָּנֶה
  choice: 枝子
  rationale: 此处指从灯台主体伸出的部分；“枝子”既符合植物造型，也与现代中文圣经器物描述相称。
- source_word: כַּפְתֹּר
  choice: 球饰
  rationale: 该词表示圆形凸起的装饰构件。“球饰”保留其形状与装饰功能，又不把它过度解释成植物的球茎。
- source_word: פֶרַח / פָרַח
  choice: 花
  rationale: 该名词意为花或花朵；译作“花”自然，并避免与“杏花形”重复累赘。
- source_word: כֵּן
  choice: 都要这样
  rationale: 这里总结并把上述样式应用于全部六根枝子；“都要这样”清楚表达其分配和规定意味。
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: 从灯台伸出的
  rationale: 分词与介词描述枝子从灯台主体向外延伸；“伸出”比机械直译“出来”更符合器物构造。
- source_word: מְנֹרָה
  choice: 灯台
  rationale: 此处是会幕器具的普通名称，现代中文以“灯台”表达其功能，毋须音译。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的器物制作语言。“带着球饰和花”保留希伯来语简略的并列结构，不擅自补明球饰和花与杯之间的精确空间关系。为避免中文将重复的“这一根”误解为同一根枝子，正文以“这一根……另一根……也”表达逐枝重复，并以脚注交代原文形式。
