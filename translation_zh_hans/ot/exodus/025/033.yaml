  to: 从灯台伸出的六根枝子，每一根上都要有三个杏花形的杯，带着球饰和花；六根枝子都要这样。
  rationale: 改用“每一根”明确表达原文由重复结构及结语所指示的逐根规格，并保留“三个杏花形的杯、球饰和花”的装饰项目及其关系的简略性。删除因原先“这一根／另一根”改写而产生的脚注。
