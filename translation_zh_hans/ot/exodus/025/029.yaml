  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: zh_hans
  text: 要做桌上的盘子、碟子、奠酒壶和奠酒杯，用来浇奠[a]；这些都要用纯金制作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奠酒壶”和“奠酒杯”所对应的希伯来词都是礼仪器皿名称，确切形制不明；也可分别译作“酒罐”和“碗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: 盘子
  rationale: קְעָרָה指较平的器皿；译作“盘子”符合桌上器具的语境，也与下一项כַּפּוֹתָיו有所区别。
- source_word: כַפֹּתָיו
  choice: 碟子
  rationale: כַּף本指手掌，也可引申为掌形的小器皿；“碟子”是自然的现代汉语，并保留它与盘子及盛液体器皿的区别。
- source_word: קְשׂוֹתָיו
  choice: 奠酒壶
  rationale: 该词是罕见的礼仪器皿名称，确切形制不明；结合后面的浇奠用途，“壶”表达盛装、倾倒液体的功能，加“奠酒”点明礼仪语境。
- source_word: מְנַקִּיֹּתָיו
  choice: 奠酒杯
  rationale: 该词指与浇奠有关的器皿，但确切形制不确定；“杯”与“壶”形成可理解的器具组合，加“奠酒”说明用途而不把形制说得过细。
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: 用来浇奠
  rationale: נסך在祭祀语境中指浇奠；希伯来文使用被动形式并以复数介词指向前述器皿，汉语译为“用来浇奠”简洁自然，并保留用途关系。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 这是会幕制作条例中该材料规格的标准、自然译法。
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: 要做……这些都要……制作
  rationale: 保留第二人称单数指令的语气及首尾重复，同时按现代汉语调整表达，使材料要求清楚自然。
