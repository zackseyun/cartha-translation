  yaml_path: translation/ot/exodus/025/038.yaml
  text: Its tongs and its firepans shall be of pure gold[a][b].
translation:
  language: zh_hans
  text: 灯台的火钳[a]和火盘[b]都要用纯金制作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“剪芯钳”；这个希伯来词指与灯台配用、用来夹取或修整的器具。
    reason: lexical_alternative
  - marker: b
    text: 或译“托盘”；在其他语境中也可指“香炉”，但这里较不可能。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: 灯台的火钳
  rationale: 该词指夹取或修整用的器具；在灯台语境中，很可能用于夹取、修整灯芯。“火钳”是现代汉语中自然且不把具体用途说得过死的表达。
- source_word: מַחְתֹּתֶיהָ
  choice: 火盘
  rationale: 该词通常指承接或搬运炭火的盘状器具。“火盘”保留其与火有关的礼仪器具含义，又不像“香炉”那样把用途限定为焚香。
- source_word: זָהָב טָהוֹר
  choice: 用纯金制作
  rationale: 原文直接说明这些器具的材质；译为“用纯金制作”符合现代汉语表达，也清楚传达材料构成。
- source_word: וּ
  choice: 和
  rationale: 前缀连词连接两类器具，汉语自然译为“和”。
- source_word: -הָ
  choice: 灯台的
  rationale: 阴性单数后缀回指语法上为阴性的“灯台”；汉语不用阴性物主代词，明示为“灯台的”可避免指代含混。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“都要用纯金制作”补出原文省略的系词关系，使材质要求清楚；两个脚注保留器具名称在希伯来语中的词义范围。
