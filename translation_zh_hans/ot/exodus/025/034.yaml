  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: zh_hans
  text: 灯台上要有四个作杏花样式的杯子[a]，并有它的球状装饰[b]和花朵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作杏花形”，或“饰有杏花纹样”。希伯来语以杏树意象描述这些杯子，可能侧重形状，也可能侧重装饰图案。
    reason: lexical_alternative
  - marker: b
    text: 或译“花苞”。希伯来语所指的是灯台上圆形的装饰性突起。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: 灯台上
  rationale: מְנֹרָה指承托灯盏的灯台；ב在这里自然译为“上”，ו则由上下文的连续关系体现，不必生硬译出“并且”作为句首。
- source_word: אַרְבָּעָה
  choice: 四个
  rationale: 基数词，修饰“杯”。
- source_word: גְבִעִים
  choice: 杯
  rationale: 该词指杯或碗状构件；“杯”简洁自然，也符合灯台装饰构造的语境。
- source_word: מְשֻׁקָּדִים
  choice: 做成杏花的样式
  rationale: 此词源自“杏树”，描述杯的杏花式造型或装饰；该译法既呈现植物意象，又不限定为单纯外形或表面纹饰。
- source_word: כַּפְתֹּרֶיהָ
  choice: 它的球饰
  rationale: כפתר在会幕器具的描述中指圆球状的装饰性突起。“球饰”保留其构造含义；植物图案语境下也可能理解为花苞，故加注说明。阴性单数后缀按语法回指“灯台”。
- source_word: וּפְרָחֶיהָ
  choice: 和花朵
  rationale: פֶּרַח意为花或花朵；“花朵”清楚自然，并与前面的杏花式设计相呼应。阴性单数后缀与前项共同回指灯台。
