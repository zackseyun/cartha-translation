base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: zh_hans
  text: 要为柜铸造四个金环，安在柜的四只脚上[a]：一侧两个环，另一侧两个环。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “四只脚”或译“四个角”。这里的希伯来语词义较难确定，但可能是指柜底部的支脚或支承部位，而不是抽象的角点。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: 铸造
  rationale: 在制作金属配件的语境中，יצק指把金属熔液浇入模具成形，即“铸造”，不是一般意义的“倾倒”。
- source_word: טַבְּעֹת זָהָב
  choice: 金环
  rationale: טבעת在这里指供抬柜之杠穿过的环状金属配件；与זהב合译为自然简洁的“金环”。
- source_word: וְנָתַתָּה
  choice: 安在
  rationale: נתן本义宽泛；用于把金环装到柜上的制作指令时，“安在”比泛泛的“放在”更准确自然。
- source_word: פַּעֲמֹתָיו
  choice: 柜的四只脚
  rationale: 该词在此处含义较难确定，较可能指柜底部四个脚状支撑。“脚”保留了希伯来语的具体形象，并由脚注交代“角”的可能译法。
- source_word: צַלְעוֹ
  choice: 一侧……另一侧
  rationale: צלע用于器物时通常指侧面；现代汉语以“一侧……另一侧”清楚表达两边各有两个环。
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: 一侧……另一侧
  rationale: 希伯来语直译为“一侧……第二侧”；汉语用“一侧……另一侧”更自然，同时保留两侧相对的结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的制作指令语体；省略汉语中不必要的第二人称主语，以“要……”表达希伯来语的命令性。正文中的“柜”依据上下文明确指约柜，并避免反复使用不自然的“它”。
