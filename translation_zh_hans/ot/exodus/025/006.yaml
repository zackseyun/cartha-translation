  text: שֶׁ֖מֶן לַ/מָּאֹ֑ר בְּשָׂמִים֙ לְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/לִ/קְטֹ֖רֶת הַ/סַּמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/006.yaml
  text: oil for the light[a], spices for the anointing oil and for the incense of spices,
translation:
  language: zh_hans
  text: 点灯用的油，以及调制膏油和香料制成的香[a]所用的香料，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“芬芳的香”。希伯来语直译为“香料之香”。
    reason: 原文的属格结构既可侧重香由香料配制而成，也可按习语理解为芬芳的香。
lexical_decisions:
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原词泛指油；本节没有明确说是橄榄油，因此不作过度限定。
- source_word: לַמָּאֹר
  choice: 点灯用的
  rationale: מָאוֹר表示光源或照明；结合会幕语境，译为“点灯用的”自然清楚，也准确表达用途。
- source_word: בְּשָׂמִים
  choice: 香料
  rationale: 复数名词指用于圣所配制工作的芳香物质；“香料”是现代汉语中清楚而贴切的表达。
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: 调制膏油……所用的
  rationale: 该结构说明香料的用途，即用于配制特定的受膏之油；“膏油”保留其礼仪语境，“调制”使汉语关系明确。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 在会幕语境中指焚烧的香，而非一般烟气；“香”是简洁、传统且仍易懂的中文表达。
- source_word: הַסַּמִּים
  choice: 香料制成的
  rationale: 构词短语קְטֹרֶת הַסַּמִּים直译近于“香料之香”；正文以“香料制成的香”自然表达其材料关系，同时在脚注保留另一种理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的清单式表达。“点灯用的油”避免把原文未明说的“橄榄”加入正文；以“调制……所用的香料”明确בְּשָׂמִים同时支配膏油和香两项用途。脚注标在相关短语之后，而非“点灯用的油”之后。
