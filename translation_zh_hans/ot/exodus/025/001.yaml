base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“YHWH”；也常译作“耶和华”。
    reason: 说明希伯来文四字神名及另一常见中文译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事形式承接并推进上下文；现代汉语通常无需另译连接词。“说”自然表达דבר的言说动作，并与后面的引语相接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名YHWH；采用现代中文圣经读者熟悉的音译“耶和华”，并以脚注说明原文形式及另一常见拟音。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词אֶל在此标明说话对象；“对摩西”是自然准确的现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出随后直接话语。汉语以“说：”及冒号自然体现其功能，不机械重复为“说着说”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非“主”这一称号。正文保留中文传统且广为人知的音译“耶和华”，脚注同时说明YHWH及“雅威”这一常见拟音，不把拟定的古代读音说成毫无争议。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语的叙事连接形式不另译“然后”；לֵאמֹר通过“说：”表达，既保留引语导入功能，又避免中文冗余。
