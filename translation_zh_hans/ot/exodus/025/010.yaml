  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: zh_hans
  text: 他们要用金合欢木做一只柜[a]，长二肘半，宽一肘半，高一肘半。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柜”也可译作“箱”；在这里指后来称为“约柜”的神圣器物。
    reason: lexical_alternative
  - marker: b
    text: “肘”是古代长度单位，大致相当于从手肘到指尖的距离。
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: 他们要做
  rationale: 在会幕建造指示的语境中，这个形式表达命令性的安排；译作“他们要做”既自然，又保留复数主语。句首连接词不必机械译出。
- source_word: אֲרוֹן
  choice: 柜
  rationale: 该词本义是盛放物品的柜、箱；本节尚未出现“约”这一限定，译作“柜”可避免把后文名称提前带入，同时以脚注说明传统称呼。
- source_word: עֲצֵי שִׁטִּים
  choice: 金合欢木
  rationale: 该结构指制作材料。现代汉语以“金合欢木”表达通常所称的 acacia wood，比音译“皂荚木”或“什亭木”更直接。
- source_word: אַמָּתַיִם וָחֵצִי
  choice: 二肘半
  rationale: 保留古代长度单位“肘”，并按自然汉语表达二又二分之一肘。
- source_word: אָרְכּוֹ
  choice: 长
  rationale: 在连续列举器物尺寸时，汉语用“长”比“它的长度”更简洁自然，所有格关系由语境明确。
- source_word: וְאַמָּה וָחֵצִי
  choice: 一肘半
  rationale: 贴近希伯来语“一肘和半肘”的结构，同时符合现代汉语尺寸表达。
- source_word: רָחְבּוֹ
  choice: 宽
  rationale: 准确表达器物的横向尺寸，并与“长、宽、高”的现代汉语固定次序协调。
- source_word: קֹמָתוֹ
  choice: 高
  rationale: 在器物尺寸语境中，该词指垂直高度；“高”是自然准确的现代汉语表达。
theological_decisions:
- issue: 是否在本节直接译作“约柜”
  choice: 正文译作“柜”，脚注说明传统上在此语境称为“约柜”
  alternative: 约柜
  rationale: 希伯来语本节只有 אֲרוֹן（柜、箱），没有“约”一词。保留“柜”更贴近本节字面证据，也不妨碍读者从上下文识别其神圣用途。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。尺寸按汉语常用的“长、宽、高”顺序紧凑列出；保留古代单位“肘”，不擅自换算为现代数值。所有脚注标记均已置于正文。
