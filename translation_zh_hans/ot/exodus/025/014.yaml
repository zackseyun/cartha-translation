  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: zh_hans
  text: 要把杠穿进柜两侧的环里，用杠抬柜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: 要把……穿进
  rationale: בוא的基本义是“带来、使进入”；在杠与环的具体语境中，“穿进”自然准确地表达把杠放入环内的动作。
- source_word: הַבַּדִּים
  choice: 杠
  rationale: 指抬运圣所器具所用的长杆；“杠”是现代汉语中简洁自然的表达。
- source_word: בַּטַּבָּעֹת
  choice: 进……环里
  rationale: 介词ב在此与使进入的动作结合，表示杠被置于环内；译作“进……环里”明确而自然。
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: 柜两侧的
  rationale: צלעות在这里指柜的两侧或侧面；依照汉语语序，将环表述为位于“柜两侧”。
- source_word: הָאָרֹן
  choice: 柜
  rationale: אָרוֹן本义为箱、柜；本节上下文所指是约柜。译作“柜”保留词义并避免在本句中补入原文未明说的“约”。
- source_word: לָשֵׂאת
  choice: 抬
  rationale: נשא在此表示用杠搬运；“抬”比泛义的“携带”更具体，也符合多人用杠搬运器物的情景。
- source_word: בָּהֶם
  choice: 用杠
  rationale: 代词指前述的杠，并表示工具或手段。汉语重复“杠”比“用它们”更清楚自然。
