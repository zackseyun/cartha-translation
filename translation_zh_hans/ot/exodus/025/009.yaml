  text: כְּ/כֹ֗ל אֲשֶׁ֤ר אֲנִי֙ מַרְאֶ֣ה אוֹתְ/ךָ֔ אֵ֚ת תַּבְנִ֣ית הַ/מִּשְׁכָּ֔ן וְ/אֵ֖ת תַּבְנִ֣ית כָּל כֵּלָ֑י/ו וְ/כֵ֖ן תַּעֲשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: zh_hans
  text: 你们要完全照着我正向你展示的一切，就是帐幕的样式和它一切器具的样式来制作。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “样式”也可译作“图样”、“模型”或“设计”。
    reason: lexical_alternative
  - marker: b
    text: “你们要……制作”中的“你们”和“制作”在原文中均为复数形式。
    reason: grammatical_clarification
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: 完全照着
  rationale: כְּ与כֹּל אֲשֶׁר合用，表示与所指示的一切严密相符；“完全照着”在现代汉语中自然地传达这种精确对应。
- source_word: מַרְאֶה
  choice: 我指示你的
  rationale: 这是ראה的使役分词，具有正在展示、使人看见的未完成体意味；“指示”既自然，也保留神向摩西展示样式的启示场景。
- source_word: תַּבְנִית
  choice: 样式
  rationale: 该词可指形制、样式、模型或设计。“样式”适合帐幕语境，又不武断认定所展示的是实体模型、平面图或某种特定本体性的天上原型。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 该词本义与“居所”有关，但在《出埃及记》中已是神圣会幕建筑的专称；“帐幕”是简明而通行的中文对应词。
- source_word: כָּל כֵּלָיו
  choice: 其中一切器具
  rationale: כֵּלִים可泛指器皿、用具和设备；“器具”保留其广度，也适合圣所陈设及礼仪用品的语境。
- source_word: וְכֵן
  choice: 来
  rationale: 原文表示“如此、照样”的方式和结果。中文以“完全照着……来制作”自然地承接前面的标准，并表达依样而作。
- source_word: תַּעֲשׂוּ
  choice: 你们……制作
  rationale: 动词是第二人称阳性复数，故译作“你们”，明确摩西并非语法上唯一的执行者；“制作”适合帐幕及器具的建造工作。
theological_decisions:
- issue: תַּבְנִית是否应明确表达天上的原型
  choice: 样式
  alternative: 蓝图、模型、设计
  rationale: 经文本身只说神向摩西展示תַּבְנִית，并未在本节界定其存在方式。“样式”容许原型的理解，却不额外断言它是实体模型、建筑蓝图或某种特定的天上实物。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“帐幕”沿用中文圣经语境中的通行称谓；句式将原文前置的比较标准整合为“完全照着……来制作”，避免生硬，同时保留强调与复数命令。
