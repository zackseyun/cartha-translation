  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ מְנֹרַ֖ת זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה תֵּעָשֶׂ֤ה הַ/מְּנוֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: zh_hans
  text: “你要用纯金做一座灯台。整座灯台要锤打制成[a]；灯台的底座、主干、杯、花蕾[b]和花朵，都要与灯台一体成形。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“锤成一整件”。希伯来文强调灯台以锤打金属的方式成形，看来是从同一块金料锤制，而不是由各个零件拼接而成。
    reason: lexical_alternative
  - marker: b
    text: “花蕾”也可译作“球饰”，指灯台花卉造型中圆形凸起的装饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: 灯台
  rationale: 该词指承托灯盏的器物，而不是灯本身；“灯台”是现代汉语中清楚、自然的对应词。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 准确表达经过精炼、没有杂质的金，也是现代汉语常用的材料名称。
- source_word: מִקְשָׁה
  choice: 锤打制成
  rationale: 该词描述以锤打方式使金属成形，并含有不是由多个零件分别制作后拼装而成的意思；此译法保留制造工艺的重点。
- source_word: תֵּעָשֶׂה
  choice: 要……制成
  rationale: 在制作指示的语境中，以被动结构表达规定，符合希伯来文形式，也合乎自然汉语。
- source_word: יְרֵכָהּ
  choice: 底座
  rationale: 字面可指“大腿、侧面”，但用于器物结构时指下部支撑部分；“底座”最清楚。
- source_word: וְקָנָהּ
  choice: 主干
  rationale: 此处单数指灯台中央的干或轴；后文才描述两侧枝子，因此译作“主干”可避免与枝子混淆。
- source_word: גְּבִיעֶיהָ
  choice: 杯
  rationale: 指灯台上杯状的装饰构件；“杯”简洁，并保留原文的具体形状。
- source_word: כַּפְתֹּרֶיהָ
  choice: 花蕾
  rationale: 该词指圆形或节状的装饰凸起；结合灯台的植物纹样，“花蕾”自然贴切，但原词也可理解为“球饰”。
- source_word: וּפְרָחֶיהָ
  choice: 花朵
  rationale: 原词明确指花形装饰；“花朵”通俗而准确。
- source_word: מִמֶּנָּה יִהְיוּ
  choice: 都要与灯台一体成形
  rationale: 原文直译为“都要出于它”，表示各构件由灯台本体形成，而非另行制作后接上；此译法清楚表达其结构关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的制作指示语体。“整座灯台”突出原文前置的制造方式；“一体成形”自然传达各部分从灯台本体而出的含义，同时在脚注中保留“锤成一整件”的译法。
