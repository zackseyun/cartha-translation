base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: zh_hans
  text: 你要把施恩座[a]安放在约柜上面；又要把我将赐给你的见证放进约柜里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎罪盖”。希伯来语既指约柜的盖，也带有献祭和赎罪方面的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: 施恩座
  rationale: 这是现代中文圣经语境中较为人熟知的称呼，既指约柜的盖，也保留其与赎罪礼仪和上帝施恩相关的含义；脚注列出更直观的译法。
- source_word: מִלְמָעְלָה
  choice: 在……上面
  rationale: 本节描述施恩座相对于约柜的安放位置；此译法自然明确，不误解为悬在约柜上方。
- source_word: עֵדֻת
  choice: 见证之物
  rationale: 保留该词的“见证”含义，同时用“之物”使中文能够自然地指称将被放入约柜的实体；不在正文中提前限定为法版。
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: 安放／放进／赐给
  rationale: 按各自宾语和主语采用自然的现代汉语动词，同时保留 נתן 在三处分别表达设置、置入和给予的语义。
- source_word: אֶל הָאָרֹן
  choice: 放进约柜里
  rationale: אֶל 本可表示“向、到”，但与“放”及其宾语连用时，语境清楚表达把见证之物置于柜内。
- source_word: הָאָרֹן
  choice: 约柜
  rationale: “约柜”是现代中文中对此圣所器物清楚而通行的名称，比单译“柜”更易识别；上下文中的见证之物也表明其圣约功能。
theological_decisions:
- issue: כַּפֹּרֶת 既是约柜的盖，又具有赎罪礼仪含义
  choice: 施恩座
  alternative: 赎罪盖
  rationale: “施恩座”保留这一器物在敬拜语境中的传统称谓及神学张力，但不把它仅解释为普通盖子；脚注提供“赎罪盖”，使其实体功能和赎罪关联保持透明。
- issue: עֵדֻת 的具体所指
  choice: 见证之物
  alternative: 法版／见证的版
  rationale: 本节本身只说“见证”，没有明说“版”；因此正文不借后续或平行经文补足具体材质和形态，以保留原文的指称方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“安放”适合圣所器物的设置，“放进”清楚表达置于柜内。句中用分号呈现两个紧密相关的命令。
