  text: 红玛瑙[a]，以及镶嵌用的宝石[b]，供以弗得和胸牌[c]使用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红玛瑙”所译的希伯来语可能指另一种宝石，确切种类不明。
    reason: lexical_alternative
  - marker: b
    text: 或译“待镶嵌的石头”或“镶座用的石头”。
    reason: lexical_alternative
