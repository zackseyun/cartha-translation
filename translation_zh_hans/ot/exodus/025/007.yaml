    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: 红玛瑙
  rationale: שֹׁהַם所指宝石的确切种类不明；“红玛瑙”是现代中文圣经语境中较通行、易懂的译法，同时以脚注保留词义上的不确定性。
- source_word: אַבְנֵי מִלֻּאִים
  choice: 镶嵌用的宝石
  rationale: מִלֻּאִים与“填入、嵌入”有关；这里指预备用来嵌入祭司服饰的宝石。译文表达其用途，不把具体工艺解释得过细。
- source_word: לָאֵפֹד
  choice: 供以弗得使用
  rationale: אֵפוֹד是祭司服饰的专门名称；采用中文圣经中通行的音译“以弗得”，避免用不确定的描述性名称取代。
- source_word: וְלַחֹשֶׁן
  choice: 和胸牌使用
  rationale: חֹשֶׁן指佩在胸前、镶有宝石的祭司礼服部件；“胸牌”比可能使人联想到护甲的“胸甲”更清楚。
