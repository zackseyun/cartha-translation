  verdict: revise
  source_fidelity: 译文准确传达了对长老的吩咐、留守等候、亚伦和户珥在场，以及将争讼带到二人面前处理的指示。“长老们”“留在这里等我们”“谁有争讼”均恰当地反映原文。惟“直到我们回到你们这里”中“这里”的指示中心与说话者将要离开的情境不协调；אֲלֵיכֶם明确是“到你们那里”。
  naturalness: 整体庄重、清楚，符合现代普通话圣经语体。“回到你们那里”比“回到你们这里”更自然准确。其余句式流畅；“谁……就……”自然表达希伯来文的泛指结构。
  terminology: “长老们”、人名“亚伦、户珥”及“争讼”使用恰当。“争讼”保留בעל דברים所含争议／法律事务的范围，脚注以“案件”提供较司法性的可行替代，合宜。
