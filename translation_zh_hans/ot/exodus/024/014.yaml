  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: zh_hans
  text: 他对长老们说：“你们留在这里等我们，直到我们回到你们那里。看，亚伦和户珥都和你们在一起；谁有争讼[a]，就到他们那里去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“谁有案件。”
    reason: בַעַל דְּבָרִים可指有争议、诉求或法律案件的人；“有案件”是较偏司法性的可行译法。
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: 长老们
  rationale: 这里指群体中受认可的长老或领袖，而不只是年长的男子；“长老们”准确且符合现代汉语圣经语体。
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: 你们留在这里等我们
  rationale: ישׁב在此命令语境中表示留在原地；“留在这里等我们”兼顾地点、等候对象和自然汉语表达。
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: 直到我们回到你们这里
  rationale: 保留שוב“返回”的基本意义，也明确表达返回长老们所在之处。
- source_word: וְהִנֵּה
  choice: 看
  rationale: 该词用于唤起听者注意；“看”保留其话语功能，同时避免“看哪”可能带来的古雅感。
- source_word: עִמָּכֶם
  choice: 都和你们在一起
  rationale: עִם表示同在或陪同；加入“都”自然地涵盖亚伦和户珥二人，不改变原意。
- source_word: מִי בַעַל דְּבָרִים
  choice: 谁有争讼
  rationale: בַעַל דְּבָרִים是涉及诉讼、申诉或争议之人的惯用表达；“有争讼”保留司法语境，又不把范围过度限定为正式案件。
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: 就到他们那里去
  rationale: 未完成式在此具有指示或命令意味；“就到他们那里去”是自然的现代汉语，并准确指向亚伦和户珥。
theological_decisions:
- issue: 法律指示中的泛指单数
  choice: 谁有争讼，就到他们那里去
  alternative: 有争讼的人都到他们那里去
  rationale: 希伯来文以מִי搭配单数动词，表达泛指的任何一人。汉语“谁……就……”自然保留这种个体性的泛指结构，也无须添加原文没有明说的性别。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“留在这里等我们”比直译“坐在这里”更符合此处命令的实际含义；“看”传达וְהִנֵּה的提示作用而不过分古雅。人名采用通行译名“亚伦、户珥”。
