base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: zh_hans
  text: 摩西要独自走近雅威[a]；他们不可走近，百姓也不可同他上去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文是神的名字“יהוה”（YHWH），这里译作“雅威”。
    reason: 说明神名的原文形式及正文译法。
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: 可以近前
  rationale: נגשׁ表示“接近、近前”。本节处于指令语境，未完成式带有许可兼规定的语气；译作“可以近前”自然表达摩西独有的准许，并与后文“不可近前”形成对照。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文《圣经》中通行的人名译法。
- source_word: לְבַדּוֹ
  choice: 只有摩西
  rationale: 该词表示“独自、唯独他”；将排他意义前置为“只有摩西”，比“摩西独自”更清楚地凸显唯有摩西获准接近。
- source_word: אֶל יְהוָה
  choice: 到雅威那里
  rationale: אֶל表示朝向、来到某位面前；“到……那里”自然保留趋近之意。יהוה按项目原则音译为“雅威”。
- source_word: וְהֵם
  choice: 他们
  rationale: 直接保留原文代词，指上一节所提到的亚伦、拿答、亚比户和七十位长老，不在正文中补明。
- source_word: לֹא יִגָּשׁוּ
  choice: 不可近前
  rationale: 与前面的נגשׁ采用同一译词，保留词汇复现及摩西与其余众人的鲜明对比。
- source_word: וְהָעָם
  choice: 百姓
  rationale: 忠实对应带定冠词的הָעָם；上下文已明确所指，无须补入“以色列”。
- source_word: לֹא יַעֲלוּ
  choice: 不可……上去
  rationale: עלה在此描述登上山的空间移动；“上去”是自然且准确的现代汉语表达。
- source_word: עִמּוֹ
  choice: 和他一同
  rationale: 指与摩西同行；“和他一同”准确表达伴随关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。音译“雅威”保留其作为盟约之神专名的性质，也符合所给项目原则；脚注说明原文形式。
- issue: וְנִגַּשׁ的指令语气
  choice: 可以近前
  alternative: 要近前；必须近前
  rationale: 该形式在上下文中具有指令作用，同时重点在于摩西独得许可、别人受到禁止。“可以”较自然地保留许可层面，而不把语气收窄为单纯命令。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“近前”保留礼仪性接近的意味，并借重复呈现原文对照；分号划分摩西所得准许与其余人所受限制。
