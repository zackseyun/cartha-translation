  to: 摩西要独自走近雅威[a]；他们不可走近，百姓也不可同他上去。
  rationale: 修订“可以”为“要”，以恢复指令语境中的规定性；以“走近”统一翻译两处 נגשׁ，并以“走近雅威”简洁自然地表达趋向雅威。其余内容维持原有意义、指代与句法对照。
