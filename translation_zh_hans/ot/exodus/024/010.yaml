base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: zh_hans
  text: 他们看见了以色列的神；他脚下仿佛有一片蓝宝石[a]铺砌的地面[b]，明澈如天空本身。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青金石”；古代 סַפִּיר 所指的具体矿石不能确定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文近于“如蓝宝石砖砌之物的工艺”；描绘他脚下一片经过铺砌、如砖或地砖般的表面。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 他们看见了
  rationale: 该词是 ראה 的 Qal 叙事形式，直接表示视觉上的“看见”；不以“瞻仰”或“看见显现”等措辞弱化原文的直陈。
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 宾语标记 אֵת 后接限定性的构造短语，明确指出他们所看见的是以色列的神。
- source_word: וְתַחַת רַגְלָיו
  choice: 他脚下
  rationale: תַחַת 表示“在……下面”，第三人称阳性单数词尾译为“他”；保留原文拟人化的异象语言。
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: 仿佛有……铺成的地面
  rationale: כְּ 保留比较意味；מַעֲשֵׂה 指制作之物或工艺，לִבְנַת 可指砖、砖砌或铺砌物。合译为自然的现代汉语，并以脚注交代较贴近字面的意象。
- source_word: הַסַּפִּיר
  choice: 蓝宝石
  rationale: 沿用传统且通行的译名；古代此词所指矿石未能确定，也可能是青金石，因此附注保留这一词义可能。
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: 如天空本身
  rationale: עֶצֶם 在此具有强调作用，表示“天空本身”，不按字面译作“骨头”或另作实体化解释。
- source_word: לָטֹהַר
  choice: 明澈
  rationale: טֹהַר 可表示纯净、清澈；在视觉描写中，“明澈”既自然，又传达其清净透亮的性质。
theological_decisions:
- issue: 看见神及拟人化描写
  choice: 直译“他们看见了以色列的神”和“他脚下”
  alternative: 他们看见了以色列之神的显现／他们看见以色列的神所站之处
  rationale: 希伯来文明确说他们看见了以色列的神，并描述他脚下之物。译文不增添“显现”等解释性限定，从而保留经文本身有关人看见神的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“看见了”保留叙事陈述的直接性；分号使异象主体与脚下景象层次清楚。“明澈如天空本身”以自然汉语再现末尾的比较，同时不消解原文的视觉庄严感。
