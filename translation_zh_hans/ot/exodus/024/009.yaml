  text: Then Moses went up, and Aaron, Nadab, Abihu, and seventy of the elders of Israel.
translation:
  language: zh_hans
  text: 于是，摩西、亚伦、拿答、亚比户，以及以色列长老中的七十人都上去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上去了
  rationale: עלה表示向上移动；译作“上去了”自然保留方向含义，不把本节未明说的“山”补入正文。希伯来语动词为单数，但其后并列列出同行者；汉语以共同谓语表达整组人上去最自然。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְאַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行的人名译法；并列关系由中文顿号及“以及”体现。
- source_word: נָדָב
  choice: 拿答
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וַאֲבִיהוּא
  choice: 亚比户
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְשִׁבְעִים
  choice: 以及……七十人
  rationale: 保留人数及其与前述人物的并列关系，以“以及”使现代汉语列举清晰顺畅。
- source_word: מִזִּקְנֵי
  choice: 长老中的
  rationale: 介词מִן在此具有部分意义，指从以色列长老群体中选出的七十人；“长老中的七十人”准确而自然。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用国家及群体名称的通行中文译法，在此修饰“长老”。
