  text: וּ/מַרְאֵה֙ כְּב֣וֹד יְהוָ֔ה כְּ/אֵ֥שׁ אֹכֶ֖לֶת בְּ/רֹ֣אשׁ הָ/הָ֑ר לְ/עֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: zh_hans
  text: 雅威荣耀的景象，在以色列人[b]眼前如同山顶上的吞噬之火[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吞灭之火”。
    reason: lexical_alternative
  - marker: b
    text: 直译“以色列的众子”；也可译“以色列子民”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: 景象
  rationale: 表示可见的外观或所见之景；“景象”保留视觉重点，又不暗示这是先知性的异象。
- source_word: כְּבוֹד
  choice: 荣耀
  rationale: 这里指雅威可见而威严的临在；“荣耀”是准确且自然的对应词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现上帝的专名，而不以称号代替。
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: 如同……吞噬之火
  rationale: כְּ明确表达比喻；אֹכֶלֶת是“吃、吞噬”的分词，用于火时表示烧尽、吞灭。“吞噬之火”既保留形象，也符合庄重语体。
- source_word: בְּרֹאשׁ הָהָר
  choice: 山顶上
  rationale: 直接表达位于山的最高处，简洁自然。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 保留原文“在眼前、为……亲眼所见”的视觉性。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该希伯来惯用语在此指以色列群体；“以色列人”是现代汉语中自然、准确的集体称谓，脚注保留其字面形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用“雅威”保留其作为盟约专名的性质，而不以“主”这一称号替代。
- issue: בְּנֵי יִשְׂרָאֵל 的群体所指
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 虽然字面形式为阳性复数“以色列的众子”，但在此是全体以色列人的惯用称谓。正文使用自然的集体表达，并在脚注注明字面形式，以免把群体范围无根据地限于男性。
- issue: 荣耀与火之间的关系
  choice: 如同
  alternative: 就是
  rationale: 原文比较前缀 כְּ 表明这是明喻；译文不把雅威的荣耀直接等同于火。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“景象”突出可见性；句首“在以色列人眼前”使汉语流畅，并保留原文全体亲眼看见的重点。“吞噬之火”略带文学色彩，以承载原文强烈而凝练的意象。
