base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: zh_hans
  text: 摩西把雅威的一切话都写了下来。他清早起来，在山脚下[a]筑了一座坛，又立了十二根石柱[b]，对应以色列的十二个支派。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“在山下”，即在山的基部或山脚。
    reason: lexical_alternative
  - marker: b
    text: 或译“十二块立石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: 写了下来
  rationale: כתב意为“写”；“写了下来”自然表达把先前宣告的话落实为文字，不增添原文没有的内容。
- source_word: דִּבְרֵי
  choice: 话
  rationale: דבר在此指雅威先前说出的话；“话”比“命令”少一层解释，保留其可涵盖言语与约章条款的范围。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译“雅威”呈现四字神名，保留原文所用的专名，而不以称号代替。
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: 清早起来
  rationale: שׁכם的使役词干在此为“早起”，加上בַּבֹּקֶר；“清早起来”准确而自然。
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: 筑了一座坛
  rationale: בנה与מזבח直译为建造祭坛；汉语圣经语体中“筑坛”简洁、自然，也明确是用于献祭的坛。
- source_word: תַּחַת הָהָר
  choice: 在山脚下
  rationale: 字面为“在山下”；此处是空间方位，“山脚下”自然表达位于山的基部，同时以脚注保留字面形式。
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: 又立了十二根石柱
  rationale: מַצֵּבָה指竖立的石头或柱；动词“立”由省略谓语的并列结构自然补出，“石柱”简明呈现其形态。
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: 对应以色列的十二个支派
  rationale: 介词ל在此表示对应或代表关系；“对应”保留这种关系，又避免过度断定石柱的具体礼仪功能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”是现代汉语对其较直接的音译，保留其作为以色列之神专名的性质，而不改译为“主”。
- issue: 十二根石柱与十二支派的关系
  choice: 对应
  alternative: 代表
  rationale: 介词ל可表达归属、对应或代表；选“对应”可传达数目上的关联，同时不把原文未明确说明的象征功能说得过满。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把……写了下来”符合现代叙事表达；“筑坛”保留简洁的经文语感。“石柱”配合量词“根”，“支派”沿用通行且清楚的以色列宗族称谓。
