  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: zh_hans
  text: 摩西进入云中[a]，上了山。摩西在山上四十昼夜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“进入云彩里面”或“进入云彩当中”。希伯来文强调摩西进入了云彩本身。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 进入
  rationale: בוא在此描述摩西移入云彩之中；“进入”既自然，又清楚表达越过界限、到了里面的方向感。
- source_word: בְּתוֹךְ
  choice: 中
  rationale: תּוֹךְ指内部或当中。汉语“进入云中”简洁自然，也明确表明摩西进入云彩本身；脚注保留“里面／深处”等可能表达。
- source_word: הֶעָנָן
  choice: 云
  rationale: עָנָן带定冠词，指上下文已经出现的那云彩。汉语在“进入云中”这一结构里不必另加“那”也能保持特指，并避免生硬。
- source_word: וַיַּעַל
  choice: 上了
  rationale: עלה的基本意思是向上而行。“上了山”是现代汉语自然、准确的表达，不额外加入“攀登”等方式含义。
- source_word: אֶל הָהָר
  choice: 山
  rationale: אֶל表示趋向；与עלה连用，并由下文“在山上”确认目的地，合译为“上了山”最符合汉语习惯。
- source_word: וַיְהִי
  choice: 在
  rationale: היה在此说明摩西所处的位置及持续时间。“在山上”直接表达其状态，不增添“停留”或“逗留”的解释性意味。
- source_word: בָּהָר
  choice: 在山上
  rationale: 介词ב与הַר连用，在此表示摩西位于山上；“在山上”是准确自然的汉语。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: 四十昼夜
  rationale: 这是汉语表达连续四十天和四十夜的凝练惯用语，完整保留原文昼夜并列的时长含义。
theological_decisions:
- issue: 与神显现和同在相关的云彩意象
  choice: 云
  alternative: 密云／浓云
  rationale: 本节原文只用普通名词עָנָן，并无“浓密”之类的修饰语；译作“云”保留叙事中的神显意象，而不作解释性扩充。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“进入云中”保留原文对云彩内部的强调；“四十昼夜”简洁自然，适合经文朗读。
