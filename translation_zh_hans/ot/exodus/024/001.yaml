source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: zh_hans
  text: 他对摩西说：“你要和亚伦、拿答、亚比户，以及以色列长老中的七十人，上到雅威那里[a]；你们要在远处俯伏。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“上到雅威那里”。虽然说话者似乎是雅威，原文仍保留这种说法；有些译本意译为“上到我这里”或“到雅威面前”。
    reason: 保留原文不寻常的人称表达及其神学张力。
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: 他对摩西说
  rationale: 希伯来语直译近似“他对摩西说”，动词为第三人称阳性单数，主语未明说。中文补出“他”以成句，同时不擅自把主语改成“雅威”。句首连接词承接上文，在中文单节中无需机械译作“然后”。
- source_word: עֲלֵה
  choice: 你要……上到
  rationale: 这是对摩西使用的阳性单数命令式。译作“你要……上到”，既表达命令，也保留先单独吩咐摩西、随后再用复数吩咐众人的人称变化。
- source_word: אֶל יְהוָה
  choice: 到雅威那里
  rationale: אֶל 表示趋向，יְהוָה是神的专名。译文保留原文不寻常的第三人称说法，不改写成“到我这里”。
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: 你要和亚伦、拿答、亚比户
  rationale: 明确译出强调性的第二人称代词，并用现代汉语自然的并列方式列出同行者。
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: 以及以色列长老中的七十人
  rationale: 介词 מִן 在这里具有部分意义，指从以色列长老中选出的七十人；“长老中的七十人”保留这一层意思。
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: 你们要……俯伏
  rationale: 动词为复数，故明确译作“你们”，与前面的单数命令相区别。“俯伏”保留身体伏下、表示敬畏的动作，不把含义过早限定为抽象的“敬拜”。
- source_word: מֵ/רָחֹק
  choice: 在远处
  rationale: 表达与神临在之处保持空间距离；“在远处”是清楚、自然的现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为该专名的现代汉语音译，避免将专名转化为称号。
- issue: 说话者似乎是雅威，却说“上到雅威那里”
  choice: 在正文保留“上到雅威那里”
  alternative: 上到我这里；到雅威面前
  rationale: 马所拉文本明确使用 אֶל יְהוָה。译文不消除这一人称与叙述上的张力，并以脚注提示读者。
- issue: השתחוה 的宗教含义
  choice: 俯伏
  alternative: 敬拜；俯伏敬拜
  rationale: 该词首先描写俯身或伏地表示敬意的动作；本处语境具有宗教意味，但单译“俯伏”更能保存动作性及词义幅度。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“上到”“在远处俯伏”清楚呈现场景；通过前句单数“你要”和后句复数“你们要”，保留希伯来语命令对象的变化。
