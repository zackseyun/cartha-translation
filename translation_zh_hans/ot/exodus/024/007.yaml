base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: zh_hans
  text: 于是，摩西拿起约书，念给百姓听。他们说：“耶和华所说的一切，我们都必遵行，也必听从[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也必听”或“也必聆听”。这里的希伯来语动词既可表示听、聆听，在立约语境中也可表示听从、顺服。
    reason: 保留וְנִשְׁמָע的词义范围及其立约语境中的含义。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 于是，摩西拿起
  rationale: 连续叙事形式推动情节，译作“于是”自然体现先后进展。希伯来文主语虽为隐含的“他”，但上文明确是摩西；中文补出姓名可避免新句起首指代不清。
- source_word: סֵפֶר הַבְּרִית
  choice: 约书
  rationale: סֵפֶר在此指写下来的文书，הַבְּרִית指特定的约；“约书”简洁、庄重，并保留其具体书面文本的性质。
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: 念给百姓听
  rationale: קרא以书面文本为宾语时意为诵读；“念给……听”自然表达公开读出、使百姓亲耳听见的希伯来语习惯说法。
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: 耶和华所说的一切
  rationale: 保留כֹּל אֲשֶׁר的周全语气，并将神的专名יהוה音译为现代中文通行的“耶和华”，不以称号代替。
- source_word: נַעֲשֶׂה
  choice: 我们都必遵行
  rationale: עשה基本义为“做、实行”；在回应约书的语境中，“遵行”自然表达把所说的一切付诸实行。“都”对应前面的“一切”，使中文搭配清楚。
- source_word: וְנִשְׁמָע
  choice: 也必听从
  rationale: שׁמע既可指听、聆听，也常在立约语境中延伸为听从、顺服。“听从”在中文中兼有听取与服从的成分，脚注保留更贴近听觉义的译法。
theological_decisions:
- issue: 立约回应וְנִשְׁמָע的双重含义
  choice: 也必听从
  alternative: 也必听／也必聆听
  rationale: 该动词既有实际听取言语之义，也有立约关系中服从之义。正文采用兼具两层意味且较自然的“听从”，但不把单纯听觉义排除，故以脚注明确保存词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“念给百姓听”比直译“在百姓耳中读”更符合现代汉语；引语保持郑重的集体承诺语气。
