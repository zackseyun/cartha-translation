  rationale: 修订仅处理汉语惯用表达与自然度：“伸手加害”明确原文惯用语的敌对意义而不直接改译为“击杀”；“以色列人中的显要人物”自然表达原文所指的显要成员，且不附加特定社会制度或职分。其余措辞和脚注均忠实保留原文的直接表述及其张力。
