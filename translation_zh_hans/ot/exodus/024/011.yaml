  naturalness: “尊贵者”书面且略显生硬；“以色列人中的显要人物”在现代标准汉语中更自然，也不把其身份过度限定为世袭贵族或特定官职。“又吃又喝”自然，适合保留原文并列的连续动作。
  terminology: “上帝”前后一致，且直接译出“他们看见了上帝”，正确保留文本本身的神学张力。脚注以“瞻仰”提供较强观看语感的可行替代，恰当。
