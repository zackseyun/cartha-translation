  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: zh_hans
  text: 但他没有向以色列人中的显要人物伸手加害；他们看见了上帝[a]，又吃又喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们瞻仰上帝。”这里的动词也可含凝视、瞻仰之意。
    reason: 说明וַיֶּחֱזוּ较强的观看语感及可行译法。
lexical_decisions:
- source_word: וְאֶל
  choice: 但……向
  rationale: וְ在此承接上文并形成语意转折，译作“但”；介词אֶל与“伸手”连用，表示动作所针对的对象。
- source_word: אֲצִילֵי בְּנֵי יִשְׂרָאֵל
  choice: 以色列人的尊贵者
  rationale: אֲצִילֵי指群体中地位显要、获选作代表的人。“尊贵者”既保留身份意味，也避免把他们具体限定为某种未明说的职分；בְּנֵי יִשְׂרָאֵל按现代汉语自然表达译为“以色列人”。
- source_word: לֹא שָׁלַח יָדוֹ
  choice: 他没有……伸手
  rationale: 保留“伸手”的身体隐喻；在此语境中含有出手击打或施行审判之意，但正文不将隐喻直接解释为“击杀”。代词“他”依上下文指上帝。
- source_word: וַיֶּחֱזוּ
  choice: 他们看见了
  rationale: חזה表示看见、观看，也可带凝视或瞻仰的较强语感。“看见了”清楚自然，较强语气在脚注说明。
- source_word: אֶת הָאֱלֹהִים
  choice: 上帝
  rationale: 定冠词所标示的是以色列的上帝；现代汉语称谓无需另行译出冠词。
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: 又吃又喝
  rationale: 简洁保留两个连续动作，也传达他们在神圣相遇之后仍然进食饮用这一突出的叙事事实。
theological_decisions:
- issue: “没有伸手”的主语
  choice: 以“他”表达隐含主语，依上下文指上帝
  alternative: 不明说主语，译成无主句
  rationale: 希伯来语动词的第三人称单数主语虽未以名词重述，但上下文所指清楚。汉语用“他”既自然，也不增加原文之外的神学解释。
- issue: 人与上帝相见的表述
  choice: 他们看见了上帝
  alternative: 他们看见了上帝的显现；他们瞻仰上帝
  rationale: 原文直接以אֶת הָאֱלֹהִים作“看见”的宾语。正文不以“上帝的显现”等解释性措辞缓和此话，从而保留它与其他相关经文之间的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“尊贵者”比“贵族”更少引入世袭阶层含义；“伸手”保留原文隐喻；正文直接说“看见了上帝”，不以解释性语言消解原文张力。
