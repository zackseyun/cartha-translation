  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: zh_hans
  text: 于是，摩西起来，带着他的侍从约书亚；摩西上了上帝的山。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום的Qal叙事式在这里表示“起来、起身”。“起身”自然地保留动作及叙事推进，不把含义过度限定为“出发”。
- source_word: וִיהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: מְשָׁרְתוֹ
  choice: 服侍他的
  rationale: שׁרת表示在旁服侍、侍候；以关系从句表达后缀“他的”，既说明约书亚服侍摩西，也避免“仆人”可能带来的奴役意味和“执事”可能带来的制度性宗教含义。
- source_word: וַיַּעַל
  choice: 上了
  rationale: עלה在此指向山上移动；“上了”简洁自然，并保留空间方向。
- source_word: הַר הָאֱלֹהִים
  choice: 上帝的山
  rationale: 按原文属格关系直译，保留这座山与上帝的特殊关联，不额外解释为西奈山或何烈山。
theological_decisions:
- issue: מְשָׁרְתוֹ所表达的摩西与约书亚之间的关系
  choice: 用“服侍他的约书亚”表达约书亚在摩西身边服侍、协助他
  alternative: “他的仆人约书亚”或“他的助手约书亚”
  rationale: 原词可涵盖多种服侍关系；本处语境指向约书亚随侍摩西。正文保留“服侍”的宽度，脚注给出更明确的现代释义，而不引入奴隶身份或后来的宗教职分。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文，“起身”对应希伯来语动作顺序；保留原文第二次明确提到“摩西”，不因中文习惯而省略，以维持原文的聚焦与句法结构。
