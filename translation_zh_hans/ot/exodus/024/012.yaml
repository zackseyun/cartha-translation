base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你上山到我这里来，留在那里。我要把石版、律法[a]和诫命[b]赐给你；这些是我为教导他们而写的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“训诲”或“教导”。希伯来语 תּוֹרָה 不仅指法律条文，也常指训诲或教导。
    reason: lexical_alternative
  - marker: b
    text: “律法和诫命”既可理解为与石版一同赐下的其他圣约教导，也可理解为进一步说明石版上所写的内容。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”译出四字神名，不以“主”这一称号代替。
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: 你上山到我这里来
  rationale: 兼顾命令式“上来”、אֵלַי“到我这里”和方向式 הָהָרָה“向山上去”，译成自然的现代汉语。
- source_word: וֶהְיֵה שָׁם
  choice: 留在那里
  rationale: 这里不只是到达，也要求摩西继续待在那里；“留在那里”比直译“在那里”更明确自然。
- source_word: וְאֶתְּנָה לְךָ
  choice: 我要……赐给你
  rationale: 将第一人称意愿式按语境译为应许或明确意向；“赐给”符合上帝赐予摩西的庄重语境。
- source_word: לֻחֹת הָאֶבֶן
  choice: 石版
  rationale: 简洁表达石制的书写版，符合现代中文圣经语体。
- source_word: וְהַתּוֹרָה
  choice: 律法
  rationale: 西奈之约语境中“律法”自然且易于识别，同时以脚注保留 תּוֹרָה 也可指“训诲、教导”的词义。
- source_word: וְהַמִּצְוָה
  choice: 诫命
  rationale: 保留希伯来文单数形式，不擅自改为复数或将其并入“律法”。
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: 是我写下……的
  rationale: 表达完成的书写行动，并让关系从句保持可涵盖前述各项的开放性。
- source_word: לְהוֹרֹתָם
  choice: 用来教导他们
  rationale: 保留 לְ 所表达的目的，以及使役词形“使他们受教导”的意义；“他们”指以色列民。
theological_decisions:
- issue: “律法和诫命”与“石版”的关系
  choice: 保留并列结构“石版、律法和诫命”，不把三者合并为单一概念。
  alternative: 可把“律法和诫命”理解为对石版内容的进一步说明，也可理解为除石版之外更广泛的圣约教导。
  rationale: 希伯来文用连词连接这些名词，句法本身没有彻底判定它们是并列的不同项目，还是后项对前项的同位说明；正文与脚注共同保留这一张力。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“你上山到我这里来”保留移动方向和说话者视角；“留在那里”传达持续停留。正文不强行判定石版、律法和诫命之间的确切解释关系。
