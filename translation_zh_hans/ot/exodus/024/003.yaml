base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: zh_hans
  text: 摩西前来，向百姓告诉了耶和华的一切话和一切典章[a]。全体百姓异口同声地回答说：“耶和华所说的一切话，我们都必遵行。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “典章”也可译作“律例”或“条例”；希伯来语指盟约中的法律裁定。
    reason: 说明מִשְׁפָּטִים的法律语义范围，并保留不致过度限定的可行译法。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到百姓那里
  rationale: בוא的基本义为“来、到”；结合לעם，在现代汉语中译作“来到百姓那里”自然清楚，并承接叙事进程。
- source_word: וַיְסַפֵּר
  choice: 告诉
  rationale: ספר的Piel词形在此指向人详述、讲述；“告诉”符合现代汉语叙事表达。
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: 耶和华的一切话
  rationale: 保留דברים的“话”义，并与后半节כָּל הַדְּבָרִים形成明显呼应。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的专名形式，保留希伯来文本中的神圣名字，而不以称号替代。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 此处指盟约语境中的法律裁定或条例；“典章”既体现法律性质，又适合庄重的经文语体。
- source_word: קוֹל אֶחָד
  choice: 异口同声
  rationale: 希伯来语直译为“一个声音”，表示众人一致发言；“异口同声”是自然准确的现代汉语对应表达。
- source_word: נַעֲשֶׂה
  choice: 我们都必遵行
  rationale: עשה直义为“做、实行”；在对盟约言语的回应中，“遵行”自然表达付诸实行的含义，“必”体现未完成式在此所表达的承诺。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文保留为专名；“耶和华”是现代中文读者最易识别且庄重的通行形式，不以“主”等称号取代。
- issue: נַעֲשֶׂה是行动承诺还是泛指服从
  choice: 我们都必遵行
  alternative: 我们都必照着做
  rationale: “遵行”表达百姓承诺实行所听见的一切话，但没有额外加入原文未明说的内在态度或神学结论。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“异口同声”传达קוֹל אֶחָד的群体一致性；前后两次“一切话”保留原文的词语呼应。脚注标记已置于正文相应词语之后。
