  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: zh_hans
  text: 耶和华的荣耀停驻在西奈山上，云彩遮盖了西奈山[a]六天。第七天，耶和华从云中呼唤摩西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“云彩遮盖了耶和华的荣耀”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: 停驻
  rationale: שׁכן在此表示来到某处并安定地停留。“停驻”既保留荣耀降临后驻留的具体图景，也符合现代汉语表达。
- source_word: כְּבוֹד יְהוָה
  choice: 耶和华的荣耀
  rationale: כָּבוֹד在本段指耶和华显现出来、令人敬畏的荣光与临在；采用汉语圣经语境中自然且庄重的“荣耀”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”呈现四字神名，避免把专名改成称号。
- source_word: עַל הַר סִינַי
  choice: 在西奈山上
  rationale: 自然表达荣耀停驻的位置，并保留介词עַל的空间意义。
- source_word: וַיְכַסֵּהוּ
  choice: 遮盖了它
  rationale: 阳性单数后缀最可能回指“西奈山”，但也可能回指同为阳性名词的“荣耀”；正文用“它”保留代词形式，并以脚注说明歧义。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: 指西奈叙事中已知的神显云彩；“云彩”在现代汉语中自然，也保持叙事的庄重语体。
- source_word: שֵׁשֶׁת יָמִים
  choice: 六天
  rationale: 直接表达时间延续，汉语无需另加相当于英语for的介词。
- source_word: וַיִּקְרָא אֶל־מֹשֶׁה
  choice: 耶和华……呼唤摩西
  rationale: קרא אל表示向某人发声呼唤；“呼唤”比“召见”少一层解释。汉语补明主语“耶和华”，使指代自然清楚。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 简洁、自然地保留定指序数时间表达。
- source_word: מִתּוֹךְ הֶעָנָן
  choice: 从云中
  rationale: מִתּוֹךְ表示从内部或当中发出；“从云中”在现代汉语中简洁自然，并保留空间图景。
theological_decisions:
- issue: וַיִּקְרָא中未明说的主语
  choice: 正文补明为“耶和华”
  alternative: 用“他”承接前文，或把“耶和华的荣耀”理解为转喻性主语
  rationale: 上下文中的发话者是耶和华。汉语若直用“他”，容易错误地承接“荣耀”或“云彩”；补明“耶和华”使叙事关系清楚，但不加入额外教义解释。
- issue: וַיְכַסֵּהוּ中宾语后缀的所指
  choice: 正文以“它”最自然地指西奈山
  alternative: 云彩遮盖耶和华的荣耀
  rationale: “西奈山”是最自然的场景性先行词，但“荣耀”在希伯来语中同样为阳性单数，因此脚注保留真实的语法歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“停驻”保留神显荣耀安定驻留的画面；“从云中”简洁呈现原文的空间意义。正文仅设一处脚注，放在真正存在指代歧义的代词之后。
