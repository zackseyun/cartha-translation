  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: zh_hans
  text: 摩西取了一半的血，盛在盆里；又把另一半的血泼在祭坛上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洒在祭坛上”或“撒在祭坛上”。希伯来语这个动词在献祭语境中可有不同译法；正文采用力度较强的“泼在”，以反映这个动作可能具有的力度。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取了
  rationale: לקח在连续叙事中表示拿取；“取了”简洁自然，也符合庄重的叙事语体。
- source_word: חֲצִי הַדָּם
  choice: 一半的血
  rationale: 保留原文的部分关系，并以现代汉语清楚表达。
- source_word: וַיָּשֶׂם
  choice: 盛在
  rationale: שׂים本义宽泛，可译为“放”；因宾语是血、地点是盛液体的器皿，译作“盛在”更符合汉语搭配，不增加原文没有的动作细节。
- source_word: בָּאַגָּנֹת
  choice: 在盆里
  rationale: אַגָּנוֹת指盛放液体的盆状器皿；“盆”比泛称“器皿”更具体，也符合献祭场景。
- source_word: זָרַק
  choice: 泼在
  rationale: זרק在献祭语境中表示将血有力地施到祭坛上；“泼在”保留动作力度，避免现代汉语“撒”可能给人的轻微、少量之感。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 在祭坛上
  rationale: 介词עַל在此表示血被施到祭坛表面；现代汉语用“在……上”与“泼”搭配自然。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 血施于祭坛的礼仪动作
  choice: 译为“泼在祭坛上”
  alternative: “洒在祭坛上”或“撒在祭坛上”
  rationale: 原文动词זרק容许不同程度的动作表达；正文以较有力度的“泼”反映可能的实际礼仪动作，同时用脚注保留较柔和的传统译法。这是词义与礼仪语境的判断，不作额外的教义解释。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“盛在盆里”符合汉语对液体与容器的自然搭配；分号呈现原文两个平行动作。脚注标记置于其实际说明的“泼在祭坛上”之后。
