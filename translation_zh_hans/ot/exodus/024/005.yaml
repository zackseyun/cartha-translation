  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: zh_hans
  text: 摩西派以色列子孙中的年轻男子[a]去献上燔祭，又向雅威献公牛为平安祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人中的年轻男子”。
    reason: lexical_alternative
  - marker: b
    text: “平安祭”或译“相交祭”或“福祉祭”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 摩西派……去
  rationale: 希伯来文直译为“他派遣”；根据紧接的上文，主语是摩西。汉语明示“摩西”可避免代词指向含混，“派……去”也自然表达派人执行任务。
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙中的年轻人
  rationale: נַעֲרֵי 指年轻男子；“以色列子孙中的”既保留 בְּנֵי יִשְׂרָאֵל 的传统表达，又用“中的”清楚表明这些年轻人属于以色列群体。
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: 献上燔祭
  rationale: עלה 与 עֹלָה 连用是献祭惯用语；“献上燔祭”准确、简洁，也符合现代中文圣经语体。
- source_word: וַיִּזְבְּחוּ
  choice: 宰杀
  rationale: זבח 在祭祀语境中指宰杀祭牲。此处译出实际动作，并与后面的“献给……作平安祭”结合，避免汉语中重复说“献祭物”。
- source_word: זְבָחִים שְׁלָמִים
  choice: 平安祭
  rationale: שְׁלָמִים 是特定祭类；“平安祭”是通行且易识别的中文名称。脚注保留“相交祭、福祉祭”等能够体现其语义范围的译法。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词 לַ 表明祭物献给谁；“献给雅威”符合现代汉语表达，并直接呈现经文中的神圣四字名。
- source_word: פָּרִים
  choice: 公牛
  rationale: פָּרִים 是 פַּר 的阳性复数，明确指公牛；把它放在“宰杀”之后，可清楚表明平安祭所用的祭牲。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”以音译保存其专名性质；“耶和华”是中文传统译名，但较不贴近学界通常重构的读音。
- issue: בְּנֵי יִשְׂרָאֵל 的群体表达
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 正文保留该短语的亲属性意象，不把它完全化为现代族群称谓；脚注提供更自然的集体表达。
- issue: שְׁלָמִים 的祭类含义
  choice: 平安祭
  alternative: 相交祭；福祉祭
  rationale: “平安祭”沿用广为人知的祭类名称，但该词也可能突出完整、福祉或献祭后的团契共享，因此不在正文中排除其他语义侧重。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“燔祭”“平安祭”保留必要的礼仪专名；句式按汉语顺序重组，同时保留原文先献燔祭、再宰杀公牛献平安祭的动作次序。所有脚注标记均已置于正文相应位置。
