  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: zh_hans
  text: 于是，摩西上了山[a]，云彩遮盖了山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摩西上到山上。”希伯来语的叙事连接词可译为“和”或“于是”；这里的介词可表示“到、向”，与“上去”连用时可表达“上到、登上”的意思。
    reason: 说明叙事连接词及介词与“上去”连用时的可选表达，同时保留原文的向上动作。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 于是……上了
  rationale: עלה表示“上去、登上”；结合叙事前缀 וַ，译作“于是……上了”，既自然地推进叙事，也保留向上的方向。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל
  choice: 上了（在动词结构中体现）
  rationale: אֶל基本可表示“到、向”；与“上去”和“山”连用时，中文自然表达为“上了山”，但“到了山那里”在语法上仍属可能，故加脚注说明。
- source_word: הָהָר
  choice: 山
  rationale: הַר可指山或山岭；西奈语境中译作“山”最恰当。定冠词所表达的特指在本段语境中由中文裸名词“山”自然承载。
- source_word: וַיְכַס
  choice: 遮盖了
  rationale: כסה意为“遮盖、覆盖”；“遮盖了”直接而庄重，并保留云使山被遮蔽的图景。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: עָנָן指云；“云彩”是自然、清楚的现代中文表达。上下文已使其具有特指性，无须另加“那”。
- source_word: אֶת
  choice: （不单独译出）
  rationale: 希伯来语确定直接宾语标记，中文以正常语序表达，无对应词。
- source_word: וַ
  choice: 于是；并以逗号衔接后句
  rationale: 前一个叙事连接词译为“于是”以表现事件推进；后一个连接词用中文并列句法体现，避免生硬重复“并且”。
theological_decisions:
- issue: 云彩的性质
  choice: 仅译作“云彩”
  alternative: “荣耀的云彩”或“耶和华的云彩”
  rationale: 本节希伯来文本只说“云”；尽管上下文将其与神的临在相联，本节并未明说“荣耀”或“耶和华的”，因此不在正文中增添解释。
translation_notes:
  register: 采用自然、庄重、易懂的现代标准汉语。“上了山”简洁呈现动作和方向；“云彩遮盖了山”保持原文的重复，不改写为更具解释性的表达。
