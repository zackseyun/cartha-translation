source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הַ/דָּ֔ם וַ/יִּזְרֹ֖ק עַל הָ/עָ֑ם וַ/יֹּ֗אמֶר הִנֵּ֤ה דַֽם הַ/בְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִמָּ/כֶ֔ם עַ֥ל כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: zh_hans
  text: 于是，摩西拿起血，洒在百姓身上[a]，说：“看哪，这是雅威照着这一切话与你们所立之约的血[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洒”所译的希伯来语动词，更直译可作“抛”或“泼”；在献祭礼仪中，可指把血施洒在某物或人身上。
    reason: lexical_alternative
  - marker: b
    text: “所立之约”中的“立”所译的希伯来语动词，直译是“切”；“切约”是希伯来语表示缔结盟约的固定说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 拿起
  rationale: 叙事中的常用动词；“拿起”自然表达摩西取用前文所述祭牲之血的动作。
- source_word: הַדָּם
  choice: 血
  rationale: 原文有定冠词，指前文已经提到的祭牲之血；汉语在明确语境中不必另加“那”。
- source_word: וַיִּזְרֹק
  choice: 洒
  rationale: זרק本义可指投、抛；用于祭血礼仪时表示把血施洒于对象。“洒”在现代汉语中自然，并保留仪式动作；更具体的字面义在脚注说明。
- source_word: עַל הָעָם
  choice: 在百姓身上
  rationale: 直接表达עַל的空间关系，明确血施于百姓。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留郑重指示和宣告的语气，适合立约场景。
- source_word: דַם הַבְּרִית
  choice: 立约的血
  rationale: 汉语“立约的血”自然、庄重，也保留该短语在后续经文中的神学关联；不扩展为解释性措辞。
- source_word: כָּרַת ... בְּרִית
  choice: 立了约
  rationale: 希伯来语字面为“切约”，是缔结盟约的固定习语；现代汉语以“立约”准确而自然地传达其意义，脚注保留字面形式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现神名四字母，不以称号替代专名。
- source_word: עִמָּכֶם
  choice: 与你们
  rationale: 准确体现第二人称阳性复数，明确对象是全体百姓。
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 照着这一切话
  rationale: 保留דְּבָרִים的“话”及עַל在此所表达的依据或关联。“照着”既可表示依照，也不排除围绕这些话立约的语义张力。
theological_decisions:
- issue: כָּרַת ... בְּרִית（字面“切约”）的译法
  choice: 在正文译作“立了约”，脚注注明字面意思
  alternative: 切了约
  rationale: “切约”在现代汉语中生硬且容易被误解；“立约”准确传达固定习语，同时脚注让读者看见原文意象及其可能的献祭背景。
- issue: 神名יְהוָה的呈现
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名。音译“雅威”保留其专名性质，避免用称号“主”取代；“耶和华”是传统汉译，但较不贴近通常重建的发音。
- issue: עַל כָּל הַדְּבָרִים הָאֵלֶּה与立约的关系
  choice: 照着这一切话
  alternative: 关于这一切话；以这一切话为依据
  rationale: “照着”保留原文介词可能兼有依据与关联的含义，不把“一切话”过度限定为法律条款，也不消除原文的语义弹性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留盟约宣告的郑重语气；“洒在百姓身上”符合汉语礼仪语境，同时借脚注呈现原文动词更强的动作感。正文所有脚注标记均已对应列出。
