  to: 在会幕中，在那位于见证前的幔子外面，亚伦和他的儿子们要在雅威面前，从晚上到早晨照管这灯。这是以色列人世世代代当守的永远条例。
  rationale: 修订保留“见证”这一原文礼仪术语，避免把其所指直接等同于法柜或把幔子的空间作用释义为“遮掩”。脚注仅说明其常见的语境所指。将“料理”改为“照管”，使现代中文更自然，并贴合从晚上到早晨的持续职责；其余关键术语和原文的句法关系均予保留。
