  naturalness: 原文中文庄重通顺。“料理这灯”虽可理解，但现代普通话中“照管这灯”更直接地表达此处持续整夜的祭司职责，也不将יַעֲרֹךְ过度限缩为单纯摆放。调整后的语序自然。
  terminology: “会幕”“幔子”“雅威”“条例”均合宜。“见证”应在正文保留，以对应הָעֵדֻת这一礼仪术语；脚注可说明其在本处与存放法版的法柜有关。“永远的条例”可保留，且不应在正文中预断其神学适用范围。
