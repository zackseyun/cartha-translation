    rationale: 原文是“在那位于／关于见证的幔子外”，其中“见证”是原有术语，通常指法版，并可在会幕空间描写中关联法柜。正文直接改为“法柜”及“遮掩”虽符合上下文，却减少了原文术语和空间措辞的保留。
  - severity: low
