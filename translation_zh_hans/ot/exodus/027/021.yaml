base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: zh_hans
  text: 在会幕中，在那位于见证前的幔子外面，亚伦和他的儿子们要在雅威面前，从晚上到早晨照管这灯。这是以色列人世世代代当守的永远条例。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是现代中文圣经语境中对这一礼仪专名最自然、通行的表达，兼顾“相会之帐幕”的含义。
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: 在……幔子外面
  rationale: פָּרֹכֶת指隔开至圣所的内幔；“幔子”既准确又为普通读者所能理解。
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: 那遮掩法柜的
  rationale: עַל在此描述幔子相对于“见证”的空间位置；“见证”在会幕语境中指存放法版的柜。译为“遮掩法柜”自然呈现空间关系，避免中文“在见证之上”造成误解。
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: 料理这灯
  rationale: ערך表示安排、整理并维持礼仪中的灯；结合上一节的灯和本节整夜职责，“料理这灯”比单说“摆列它”更自然，也保留实际照管灯火的含义。
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: 从晚上到早晨
  rationale: 直接、自然地表达整夜持续的时间范围。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留礼仪语境中的“在……面前”，并以“雅威”音译神的圣名。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的条例
  rationale: 保留法律用语的持久效力和传统圣经措辞；此处“永远”按盟约法规惯用语理解，不额外界定其哲学上的绝对时限。
- source_word: לְדֹרֹתָם
  choice: 世世代代
  rationale: 这是现代中文对该盟约公式自然且凝练的表达。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: 作为以色列人……的条例
  rationale: מֵאֵת表示该义务与以色列人相关并由他们承担；中文将其整合进条例句式，比生硬的“从以色列人而来”更清楚。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留盟约之名。
- issue: חֻקַּת עוֹלָם的时效语气
  choice: 永远的条例
  alternative: 永久的条例
  rationale: “永远的条例”保留原文惯用盟约法律公式的强度，同时不在正文中替原文解决其适用范围的神学问题。
- issue: הָעֵדֻת所指
  choice: 法柜
  alternative: 见证／法版
  rationale: 此处“见证”主要指法版，并借其位置指向盛放法版的柜；幔子实际位于法柜前。采用“法柜”使空间描写清楚，但不扩展为额外教义解释。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“会幕、幔子、条例”等保留礼仪和法律语域；句序略作中文化处理，使地点、时间、执行者和责任清晰。
