  yaml_path: translation/ot/exodus/027/013.yaml
  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
translation:
  language: zh_hans
  text: 院子的东面[a]，朝日出的方向，宽五十肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“院子的东面，朝东方，宽五十肘。”
    reason: 原文连续使用两个表示东方的说法；此译法以“朝东方”呈现第二个方向词。
lexical_decisions:
- source_word: וְרֹחַב
  choice: 宽
  rationale: רֹחַב表示宽度；在本节尺寸说明中译作“宽”自然简明。句首的וְ承接前文，中文无需机械译出“和”。
- source_word: הֶחָצֵר
  choice: 院子
  rationale: חָצֵר在此指会幕外围围起的院落；“院子”符合现代汉语，也能清楚表达其空间性质。
- source_word: לִפְאַת קֵדְמָה
  choice: 东面
  rationale: פֵאָה可指边、面或一侧，קֵדְמָה指向东；合译为“东面”最自然。
- source_word: מִזְרָחָה
  choice: 就是朝日出的方向
  rationale: מִזְרָחָה指向日出之处，即东方。保留“日出”意象，并用“就是”表明它与前面的“东面”是同位说明。
- source_word: חֲמִשִּׁים אַמָּה
  choice: 五十肘
  rationale: 准确保留原文的数目和古代长度单位，不在正文中另作现代单位换算。
