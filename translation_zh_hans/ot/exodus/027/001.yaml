base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: zh_hans
  text: “你要用金合欢木做祭坛，长五肘，宽五肘；祭坛要呈正方形，高三肘。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要做
  rationale: 带连接词的完成式在会幕制作指示中表达命令；“你要做”自然保留指令语气，句首连接词不必机械译出。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: מִזְבֵּחַ 指献祭所用的坛；上下文已确定其所指，现代汉语无需另加对应定冠词的成分。
- source_word: עֲצֵי שִׁטִּים
  choice: 金合欢木
  rationale: 该短语表示制作材料，שִׁטָּה 通常指金合欢属树木；“金合欢木”比音译更便于现代读者理解。
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: 长五肘，宽五肘
  rationale: 按现代汉语尺寸表达方式呈现原文平行的长、宽数据，并保留古代单位“肘”。
- source_word: רָבוּעַ יִהְיֶה
  choice: 要呈正方形
  rationale: רָבוּעַ 表示四边构成的方形；结合长宽相等，译作“呈正方形”清楚自然。
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: 高三肘
  rationale: 简洁自然地表达原文“其高度为三肘”，完整保留尺寸信息。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的制作指令语体。保留“肘”这一古代度量单位，不擅自换算，以免造成虚假的精确度。英文咨询层所附脚注的位置与内容明显不相符，且“呈正方形”已准确清楚地表达 רָבוּעַ，故未沿用该脚注。
