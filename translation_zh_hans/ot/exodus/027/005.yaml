base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/005.yaml
  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: zh_hans
  text: 你要把它从下方安在祭坛的凸缘下面[a]；这网要一直延伸到祭坛的中部[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凸缘”或译“边框”，希伯来语指祭坛上突出的边缘或框架。
    reason: lexical_alternative
  - marker: b
    text: 直译：“这网要直到祭坛的一半。”这里指网达到祭坛高度的中部。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 你要把……安在
  rationale: נתן在这里带直接宾语和地点，表示把物件放置、安装在指定位置；“安在”符合器具建造的语境，也保留指令语气。
- source_word: אֹתָהּ
  choice: 它
  rationale: 阴性单数代词回指上一节的铜网；现代汉语以无生命代词“它”表达。
- source_word: תַּחַת
  choice: 下方
  rationale: 直接表达位于祭坛凸缘之下的空间关系。
- source_word: כַּרְכֹּב
  choice: 凸缘
  rationale: 该词指祭坛上突出的边缘、围边或框架；“凸缘”既体现其突出结构，也比音译或传统模糊说法更易理解。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: מזבח在会幕器具语境中的标准译法。
- source_word: מִלְּמָטָּה
  choice: 从下面
  rationale: 保留原文所强调的下部或下方起点，不进一步断定具体安装方式。
- source_word: וְהָיְתָה הָרֶשֶׁת עַד
  choice: 这网要……一直到
  rationale: היה与עד连用描述网所达到的位置；用“一直到”自然表达延伸范围，同时以并列分句保留原文的顺承关系，不增添目的含义。
- source_word: הָרֶשֶׁת
  choice: 这网
  rationale: רשת指网状格栅；“网”简明，并由上下文明确为祭坛的铜网。
- source_word: חֲצִי הַמִּזְבֵּחַ
  choice: 祭坛的半腰
  rationale: 原文直指祭坛的一半或中部；“半腰”在汉语中自然表达垂直高度的中点，同时避免把它误解为祭坛面积的一半。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的指令语体。“安在”适合器具安装语境；以两个并列分句对应希伯来文结构，避免加入目的或结果关系。保留“从下面”的空间细节，并用脚注说明כַּרְכֹּב及“祭坛的一半”的译法。
