base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: zh_hans
  text: 要为坛做一个铜制网格[a]，又要在这网的四角做四个铜环[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个格栅，是铜制的网状制品”；也可译为“一个铜制网状格栅”。
    reason: 保留מִכְבָּר与“网状制品”（מַעֲשֵׂה רֶשֶׁת）的叠加描述，并说明材质。
  - marker: b
    text: 或译“四个边端”或“四端”。
    reason: קְצוֹתָיו指其边端、尽头；对于四边构件，可自然理解为四角。
lexical_decisions:
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: 网格
  rationale: מִכְבָּר指用于坛的格栅状构件，מַעֲשֵׂה רֶשֶׁת进一步说明它是网状制品。“网格”简洁自然，也与下文“网”保持词义联系；脚注保留原文叠加表达。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或铜合金；在会幕器具语境中常指青铜。中文用“铜”既符合传统表达，也避免过度限定具体合金。
- source_word: עַל הָרֶשֶׁת
  choice: 在网上
  rationale: עַל在此表示环相对于网状构件的位置；“在网上”自然，并复现רֶשֶׁת的“网”意象。
- source_word: טַבְּעֹת
  choice: 环
  rationale: 该词通常指器具上用于连接或穿杠的环。“铜环”准确而自然。
- source_word: קְצוֹתָיו
  choice: 四角
  rationale: 该词本义为边端、尽头；对于有四个端点的网格，“四角”最清楚自然，同时以脚注保留“四端”的可能译法。
- source_word: לּוֹ
  choice: 为坛
  rationale: 代词所指是前文的坛。中文明确译出“坛”，可避免孤立经节中“为它”的指代不清。
- source_word: וְעָשִׂיתָ
  choice: 要做
  rationale: 延续上一节的指示语气；“要……做”符合现代中文法规式、指令式表达。
theological_decisions: []
translation_notes:
