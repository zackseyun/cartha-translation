  text: Fifteen cubits of hangings for the shoulder[a], with their three pillars and their three bases.
translation:
  language: zh_hans
  text: 一侧的帷子长十五肘，柱子三根，柱座三个[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柱座”或译“插座”；希伯来语所用的词可指承托柱子的带孔底座。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: 十五肘
  rationale: 复合数词意为“十五”，אַמָּה是标准长度单位“肘”；汉语合译为“十五肘”准确自然。
- source_word: קְלָעִים
  choice: 帷子
  rationale: 在会幕院子的语境中，指围成院落的织物幔帐；“帷子”既符合建筑语境，也与普通现代读者熟悉的圣经用语协调。
- source_word: לַכָּתֵף
  choice: 一侧
  rationale: כָּתֵף本义为“肩”，用于建筑布局时指侧翼或一边；本节与下一节所述入口另一侧相对应，因此译作“一侧”，不生硬直译为“肩部”。
- source_word: עַמֻּדֵיהֶם
  choice: 三根柱子
  rationale: עַמּוּד指柱、柱子；量词“根”符合现代汉语。所属后缀在汉语中可由上下文自然体现，无需机械译出“它们的”。
- source_word: אַדְנֵיהֶם
  choice: 三个柱座
  rationale: אֶדֶן在会幕构造中指承托柱子的底座或带插孔的座；“柱座”明确表达其结构功能，脚注保留“插座”这一可能译法。
