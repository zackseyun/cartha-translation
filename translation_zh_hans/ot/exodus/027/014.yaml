translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“长”补明十五肘所量的是帷子的长度；“要有”使希伯来语名词式建筑说明在汉语中更顺畅。脚注标记置于其实际说明的“柱座”之后，以免误指“一侧”。
