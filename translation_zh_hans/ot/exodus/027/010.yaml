translation_notes:
  register: 采用现代、庄重而清楚的建筑用语。“根”用于柱子，“个”用于底座；分号区分支撑构件与银制配件。以“都要用银制成”补足希伯来语名词句在中文中的自然表达，不改变其材质断言。
