translation:
  language: zh_hans
  text: 柱子要有二十根，铜座也要有二十个；柱子上的钩子和箍带都要用银制成。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: 二十根柱子
  rationale: עַמּוּד指“柱子”；第三人称阳性单数后缀承接上文所述南面的帷幔。中文在本节作为上文的续句，用“要有”自然衔接，无须生硬重复所属关系。
- source_word: אַדְנֵיהֶם
  choice: 二十个铜座
  rationale: אֶדֶן在会幕建造语境中指支撑柱子的底座或承窝。“座”简洁自然，并以脚注保留“插座”这一较技术性的译法。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת可指铜或青铜。中文圣经建筑语境通常以“铜”概括这一材料，既自然，也不对具体合金成分作超出原文的限定。
- source_word: וָוֵי
  choice: 钩子
  rationale: וָו在会幕结构中通常指用来连接或悬挂的钩，译作“钩子”清楚且符合其可能功能。
- source_word: חֲשֻׁקֵיהֶם
  choice: 箍带
  rationale: 该词所指的具体建筑构件并不确定，可能是柱上的箍、带状构件或连接杆。“箍带”保留其环束或连接的基本意象，同时以脚注说明不确定性。
- source_word: כָּסֶף
  choice: 银
  rationale: 该词明确指银；中文用“用银制成”自然表达这些构件的材质。
- source_word: וְ
  choice: 要有／和
  rationale: 句首连接词承接上一节的描述，中文以“要有”形成自然续接；其余并列关系用“和”或标点表达。
