  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: zh_hans
  text: 帐幕一切事务所用的器具、帐幕的一切橛子和院子的一切橛子，都要用铜[a]做成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青铜”；希伯来语“נְחֹשֶׁת”可泛指铜或铜合金。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: 器具
  rationale: כְּלִי泛指器物、用具；“器具”在此既自然，又不把所指限于家具或某一种器皿。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן指神圣的居所；“帐幕”是现代中文圣经语境中清楚而通行的表达。
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: 供办理一切事务之用
  rationale: עֲבֹדָה在此指与帐幕有关的服事、工作或事务；此译法自然表达用途，同时避免将含义过度限定为礼仪性服事。
- source_word: יְתֵדֹתָיו
  choice: 帐幕所有的橛子
  rationale: יָתֵד指固定结构所用的橛或桩；补出“帐幕”使代词所指在中文中清楚。
- source_word: יִתְדֹת הֶחָצֵר
  choice: 院子所有的橛子
  rationale: חָצֵר在此指环绕帐幕的院落；“院子”比“院”更符合普通现代汉语。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת可泛指铜或铜合金；正文用中文自然且能保留宽泛性的“铜”，脚注说明也可能具体指青铜。
