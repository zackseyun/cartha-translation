  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: zh_hans
  text: 院子的西面[a]宽五十肘，要有帷幔；柱子十根，柱座十个[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西面”原文直译为“海的一面”，这是希伯来语表示西方的常用说法。
    reason: lexical_alternative
  - marker: b
    text: “柱座”也可译作“插座”或“底座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרֹחַב הֶחָצֵר
  choice: 院子的宽度
  rationale: רֹחַב意为“宽度、宽”，הֶחָצֵר指会幕外围的院子；按建筑说明的语境直译，同时用现代汉语自然表达。
- source_word: לִפְאַת יָם
  choice: 西面
  rationale: יָם字面意为“海”，但在希伯来语方位表达中常指向地中海的西方；译作“西面”准确清楚，并以脚注保留字面意象。
- source_word: קְלָעִים
  choice: 帷幔
  rationale: 该词在会幕院子的语境中指围成边界的悬挂织物；“帷幔”兼顾其织物性质、建筑用途和经文庄重语体。
- source_word: חֲמִשִּׁים אַמָּה
  choice: 五十肘
  rationale: 直接保留古代长度单位אַמָּה为“肘”，不擅自换算或补入原文没有明说的“长”。
- source_word: עַמֻּדֵיהֶם עֲשָׂרָה
  choice: 帷幔的柱子十根
  rationale: 保留复数第三人称后缀与前述帷幔的关联，并按现代汉语量词习惯用“根”。
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: 柱座十个
  rationale: אֶדֶן在会幕构造中指承托柱子的座或带插孔的底座；正文采用普通读者易懂的“柱座”，脚注提示也可理解为“插座”。
