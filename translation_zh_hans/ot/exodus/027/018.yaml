base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: zh_hans
  text: 院子要长一百肘，宽五十肘[a]；帷幔高五肘，要用捻制的细麻布；柱座[b]要用铜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处字面为“五十对五十”（也可形式上译作“五十乘五十”）。这一不寻常表达的确切作用有争议；正文按上下文译为“五十肘”。
    reason: 保留原文不寻常且语义未定的尺寸表达，避免把一种解释当作确定含义。
  - marker: b
    text: “柱座”也可译作“柱脚”或“插座”。
    reason: 说明会幕建筑术语的可选译法。
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: 院子要长
  rationale: 指会幕四周围出的院子；用“长”自然表达建筑尺寸，并按上下文体现规定语气。
- source_word: מֵאָה בָאַמָּה
  choice: 一百肘
  rationale: 保留原文计量单位“肘”，便于与会幕相关经文保持一致。
- source_word: חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: 宽五十肘[a]
  rationale: 该希伯来语短语字面为“五十乘五十”或“五十对五十”，语意可能强调全宽一致；正文采用自然的尺寸表达，脚注保留原文异常措辞。
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: 帷幔高五肘
  rationale: “高度”在语境中指围院帷幔的高度；补出“帷幔”可避免把院子的抽象空间说成具有高度。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 用捻成的细麻布制作
  rationale: שֵׁשׁ 指优质细麻，מָשְׁזָר 指经捻合的工艺；译文兼顾材料和制作方式。
- source_word: וְאַדְנֵיהֶם
  choice: 柱座[b]
  rationale: אַדֶן 在会幕构造中指承托柱子的金属座；“柱座”比单说“座”更清楚，同时脚注保留另一种技术性表达。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可泛指铜或铜合金；中文“铜”既自然，也避免在无法确定合金成分时过度限定为“青铜”。
