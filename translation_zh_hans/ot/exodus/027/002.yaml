base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/002.yaml
  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: zh_hans
  text: 你要在坛的四个角上做角；这些角要与坛身连成一体[a]，并要用青铜包裹坛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“它的角要从它而出”，意思可能是坛角须与坛身制成一体，而不是另行装上。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语 נְחֹשֶׁת 可指青铜，也可指铜；这里按建造器物的语境译作“青铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做出
  rationale: 该形式在连续的建造指示中具有命令语气；“你要”既自然，又保留指令的力度。
- source_word: קַרְנֹתָיו
  choice: 角
  rationale: קֶרֶן本义为动物的“角”，在祭坛语境中指坛四角上角状的突出部分。汉语用“角”可保留原文的具体形象。
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: 在坛的四角上
  rationale: עַל在此表示“在……上”；补出上文所指的“坛”，比反复使用“它”更符合现代汉语，也不改变所指对象。
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: 这些角要与坛身连成一体
  rationale: 原文直译近于“它的角要从它而出”，在制作语境中表示坛角由坛身本体制成，而非另行制作后附上。“连成一体”清楚表达这一结构关系。
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: 并要给坛包上
  rationale: צפה的Piel词形在器物制作语境中指以金属包覆或贴覆表面；“包上”是清楚自然的现代汉语表达。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: 该词可指铜或铜合金；在会幕器具和古代冶金语境中，“青铜”是较可能且通行的译法，同时以脚注保留“铜”的可能性。
