base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/006.yaml
  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: zh_hans
  text: 你要为祭坛做杠，用皂荚木做的杠；要用青铜[a]包裹这些杠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铜”。原文 נְחֹשֶׁת 可指铜，也可指青铜等铜合金，具体金属成分不能完全确定。
    reason: 词义替代；保留原文金属名称的语义范围。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做
  rationale: 该形式在指示性语境中表达命令；“你要”既保留指令语气，也符合现代汉语礼仪制作条文的表达。
- source_word: בַדִּים / בַּדֵּי
  choice: 杠
  rationale: 此词指搬运祭坛所用的长杆。“杠”简洁自然，并避免“支柱”或结构横杆之类的误解；上下文已显明其搬运用途，无须在正文中增添“抬”字。
- source_word: לַמִּזְבֵּחַ
  choice: 为祭坛
  rationale: 原文只说“为祭坛”，不在本节补入“燔祭坛”等上下文信息。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 这是现代中文圣经语境中较通行且易识别的树木名称，对应原文所指的金合欢类木材。
- source_word: וְצִפִּיתָ
  choice: 包上
  rationale: 该动词在会幕器具制作语境中指以金属覆包表面；“包上”自然清楚，又不额外限定具体工艺。
- source_word: אֹתָם
  choice: 给杠
  rationale: 原文代词回指复数的杠。汉语若直译为“给它们”略显生硬，因此复现“杠”，使指代明确。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: 该词可泛指铜或铜合金；会幕器具语境传统上常理解为青铜。正文采用“青铜”，并以脚注保留“铜”的词义可能。
