  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: zh_hans
  text: “你要为会幕造院子。南面，朝南的那一边，要为院子用捻的细麻布做帷幔[a]；这一边长一百肘。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帷幔”也可译作“帘幕”；原文指构成院子边界的悬挂布幅。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: 院子
  rationale: 指环绕帐幕的露天围合区域；“院子”自然易懂，也符合圣所建筑语境。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 在《出埃及记》中指神圣的会幕建筑；“帐幕”简洁且保留其帐篷式居所的含义。
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: 南边，就是朝南的一边
  rationale: 原文连续使用表示南方的词语形成强调；此译法保留重复方向信息，同时使现代汉语顺畅。
- source_word: קְלָעִים
  choice: 帷幔
  rationale: 指构成院子边界的悬挂布幅；“帷幔”比一般的“帘子”更贴合建筑围挡的用途。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻得细密的细麻布
  rationale: 兼顾细麻材质与捻制工艺；表达自然，并避免把工艺含义简化为仅指布料品质。
- source_word: מֵאָה בָאַמָּה
  choice: 一百肘
  rationale: 保留原文古代长度单位，不作不确定的现代换算。
- source_word: אֹרֶךְ
  choice: 长
  rationale: 与数值组成自然的现代汉语尺寸表达。
- source_word: לַפֵּאָה הָאֶחָת
  choice: 这一边
  rationale: 指刚提到的院子南边；汉语上下文中用“这一边”清楚而自然。
