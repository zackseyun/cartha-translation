  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: zh_hans
  text: 院子四围所有的柱子都要包上银箍[a]；柱子的钩子要用银制成，柱座[b]要用青铜[c]制成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用银杆连接”。传统译法有“镶银边”。希伯来语指银制箍带或连接构件，具体形制不能完全确定。
    reason: lexical_alternative
  - marker: b
    text: 或译“柱脚”。指柱子安放或插入其中的金属底座。
    reason: lexical_alternative
  - marker: c
    text: 或译“铜”。这里的希伯来语可泛指铜或铜合金。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: 院子四围所有的柱子
  rationale: 按希伯来语的整体表达，指院子四周全部作为围栏支撑的柱子；“院子”和“柱子”在现代汉语中清楚自然。
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: 用银箍连接
  rationale: 该分词指柱子装有银制的箍带或连接件。“用银箍连接”既表达银制构件，也保留这些构件可能连接诸柱的建筑功能；具体形制并不完全确定，因此列出脚注。
- source_word: וָוֵיהֶם
  choice: 柱上的钩子
  rationale: וָו在会幕建造语境中通常指悬挂帷幔等物的钩状配件；补出“柱上的”使汉语指代清楚。
- source_word: אַדְנֵיהֶם
  choice: 柱座
  rationale: 指承托并固定柱子的金属底座或插座；“柱座”简洁且符合现代建筑用语。
- source_word: נְחֹשֶׁת
  choice: 青铜
  rationale: 该词指古代铜或铜合金材料；会幕器物语境中通常译作“青铜”，同时以脚注保留“铜”这一较宽泛译法。
