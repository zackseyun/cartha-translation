  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: zh_hans
  text: 北面的长边也照样：帷幔长一百肘[a]，柱子二十根，铜柱座二十个；柱子的钩子和箍带[b]都是银的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“长度一百”；“肘”按上下文补出。
    reason: cultural_note
  - marker: b
    text: 或译“连接件”；希伯来词指与柱子相连或环绕柱子的构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: 也要照样
  rationale: 承接前一节南面的规格，表达两侧布置相同。
- source_word: לִפְאַת צָפוֹן בָּאֹרֶךְ
  choice: 北面沿长度
  rationale: פאה 指一面或一侧，בארך 标明所说的是院子的长边；译文简洁保留方位与尺寸关系。
- source_word: קְלָעִים
  choice: 帷幔
  rationale: 在会幕院子的语境中，指围成院界的悬挂织物；“帷幔”具体而庄重。
- source_word: מֵאָה אֹרֶךְ
  choice: 长一百肘
  rationale: 希伯来文直译为“长度一百”，计量单位由紧邻语境明确为肘；正文补出单位以便理解，并以脚注说明原文省略。
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: 柱子二十根
  rationale: 保留希伯来文清单式的无动词结构，用现代汉语量词自然表达。
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: 柱座二十个，都是铜的
  rationale: אדן 在此指承托柱子的座或底座；“柱座”比“插座”更直观，נחשת 依会幕器物语境译作“铜”。
- source_word: וָוֵי הָעַמֻּדִים
  choice: 柱上的钩子
  rationale: וָוִים 指装在柱上的钩状构件；此译明确其所属关系而不过度推定形制。
- source_word: וַחֲשֻׁקֵיהֶם
  choice: 箍带
  rationale: 该词指与柱子相连、环绕或连接柱子的构件；“箍带”保留其基本形象，脚注说明词义范围。
- source_word: כָּסֶף
  choice: 银
  rationale: 直接表达材料名称。
theological_decisions: []
