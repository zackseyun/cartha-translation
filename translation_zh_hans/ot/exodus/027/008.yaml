  yaml_path: translation/ot/exodus/027/008.yaml
  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: zh_hans
  text: 要用木板把坛做成中空的[a]；照着在山上所指示给你的样式，他们要这样做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用木板做成里面是空的。”希伯来文描写这坛是用木板构成的中空结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב לֻחֹת
  choice: 用木板……做成中空的
  rationale: נְבוּב 表示内部空而非实心，לֻחֹת 指木板；此译自然表达坛是用木板构成的中空结构。
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: 要……把坛做成
  rationale: 保留对摩西的第二人称单数指令；依上下文补出“坛”，使中文指代清楚。
- source_word: כַּאֲשֶׁר
  choice: 照着
  rationale: 表达制作须符合山上所示样式的比较和规范关系。
- source_word: הֶרְאָה אֹתְךָ
  choice: 指示你的
  rationale: 原文是使役被动式，直译近于“被指示给你的”；中文用“指示你的”保持隐含施事者不明说，并使句子自然。
- source_word: בָּהָר
  choice: 在山上
  rationale: 符合现代汉语表达地点的惯用方式。
- source_word: כֵּן יַעֲשׂוּ
  choice: 他们要这样做
  rationale: 保留复数主语，指实际承担建造工作的人，也保留“照着……这样”的对应结构。
theological_decisions:
- issue: הֶרְאָה 的隐含施事者
  choice: 不明说是谁作出指示
  alternative: 译作“上帝在山上指示你的”
  rationale: 希伯来文采用被动形式，虽语境暗示神是施事者，本节却未明说；译文保留这一表达特点。
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“坛”由本节上下文补明；“中空”准确且符合器物结构的现代汉语说法。
