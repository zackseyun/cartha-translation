base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: zh_hans
  text: 院子的门口要有一道二十肘宽的门帘[a]，用蓝色、紫色、朱红色的线和捻成的细麻织成，是绣工所作的；门帘的柱子四根，柱座四个。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “门帘”也可译作“帘子”或“遮帘”。原文尺寸直译为“二十肘”；这里按建筑语境补出“宽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: 院子的门口
  rationale: שַׁעַר在此指院子的出入口；译作“门口”比“门”更能避免让人误以为是实心门扇，也自然承接门帘。
- source_word: מָסָךְ
  choice: 门帘
  rationale: 在会幕建筑语境中指遮覆入口的织物。“门帘”兼顾其位置和织物性质。
- source_word: עֶשְׂרִים אַמָּה
  choice: 二十肘宽
  rationale: 原文直译为“二十肘”，结合本章院子入口的建筑尺寸，所指为门帘横向跨度；中文补出“宽”以求清楚。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 蓝色、紫色、朱红色线
  rationale: 这些词表示染成相应颜色的纺织材料；用“线”统摄三种颜色，符合中文织物描述。
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: 捻的细麻
  rationale: שֵׁשׁ指细麻，מָשְׁזָר说明经过搓捻；“捻的细麻”保留制作特征。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 是绣工的手艺
  rationale: 保留原文以工匠为中心的表达，并自然传达彩绣或刺绣工艺。
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה וְאַדְנֵיהֶם אַרְבָּעָה
  choice: 门帘的柱子四根，柱座四个
  rationale: 显明复数所有格后缀所表达的归属关系；אֶדֶן在此是承托柱子的底座，译作“柱座”清楚准确。
