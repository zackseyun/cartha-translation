base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: zh_hans
  text: 杠要插入环中[a]；抬祭坛时，杠要在祭坛的两侧[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“杠要带入环中。”希伯来语动词是使役被动式；这里所说的是搬运前把杠插入环内。
    reason: lexical_alternative
  - marker: b
    text: “两侧”所译的希伯来语也可指“两边的构件”或“两侧面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: 要穿入
  rationale: 该词是בוא的使役被动式，表示杠被放入指定位置。现代汉语用“要穿入”自然表达规定动作及插入环中的意思，避免生硬使用“被”。
- source_word: בַדָּיו / הַבַּדִּים
  choice: 杠
  rationale: בַּד在会幕器具的语境中特指搬运用的长杠；“杠”简洁、通俗，并与上下文一致。
- source_word: בַּטַּבָּעֹת
  choice: 环中
  rationale: 介词ב在此表示环是杠进入并安放的位置；配合“穿入”可清楚表达其构造和用途。
- source_word: וְהָיוּ
  choice: 要在
  rationale: 表达插入后杠所处的规定位置，符合本段指示性的语气。
- source_word: עַל שְׁתֵּי צַלְעֹת הַמִּזְבֵּחַ
  choice: 在祭坛的两侧
  rationale: עַל表达空间关系；צְלָעוֹת可泛指两侧，也可能指侧板或侧面。“两侧”在正文中最自然，同时以脚注保留词义范围。
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: 抬祭坛时
  rationale: ב加נשׂא不定式表示伴随或时间情形，即搬运它的时候；明确“祭坛”为宾语，使现代汉语流畅而不增添搬运者。
