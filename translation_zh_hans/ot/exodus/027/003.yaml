base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: zh_hans
  text: 要做坛的罐，用来清除坛上的灰[a]；又要做坛的铲子、钵、叉子和火盘。坛的一切器具都要用铜[b]制作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为“为清除它的灰烬”；该动词在祭祀语境中可指清除祭物焚烧后留下的、带脂质残余的灰烬。
    reason: lexical_alternative
  - marker: b
    text: “铜”也可译作“青铜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 要做
  rationale: 未完成式在会幕建造指示中表达命令；“要做”以自然现代汉语保留规范性语气。
- source_word: סִּירֹתָיו
  choice: 坛的盆
  rationale: סִירוֹת 指盛装物品的盆或锅；下文已说明清灰用途，因此正文采用较宽泛的“盆”。补出“坛的”以明确第三人称后缀所指。
- source_word: לְדַשְּׁנוֹ
  choice: 用来清除坛上的灰
  rationale: דשן 的 Piel 在此指清除献祭后带有脂质残余的灰烬；正文以清楚的功能性表达翻译，并用脚注保留字面色彩。
- source_word: יָעָיו
  choice: 铲子
  rationale: 指处理灰烬或炭火的铲状工具；“铲子”准确且通俗。
- source_word: מִזְרְקֹתָיו
  choice: 洒血盆
  rationale: מִזְרָק 是礼仪中盛放并泼洒祭牲之血的盆。“洒血盆”既表明器形，也交代祭坛语境中的用途。
- source_word: מִזְלְגֹתָיו
  choice: 叉子
  rationale: 指叉状器具；采用不额外限定用途的“叉子”，避免把不确定的具体功能写入正文。
- source_word: מַחְתֹּתָיו
  choice: 火盘
  rationale: 指承装或搬运炭火的盘状器具；“火盘”简洁并符合祭坛语境。
- source_word: לְכָל־כֵּלָיו
  choice: 坛的一切器具
  rationale: כְּלִי 是器具的广义名称；补出“坛的”使中文指代清楚。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת 可指铜或铜合金；“铜”在现代中文中可作较宽泛的材料名称，避免正文过度确定为青铜，并在脚注注明可能的具体理解。
