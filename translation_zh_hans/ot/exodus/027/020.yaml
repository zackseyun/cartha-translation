base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: zh_hans
  text: 你要吩咐以色列子孙[a]，把捣制的纯橄榄油[b]送到你这里来作照明之用，使灯持续[c]燃烧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”也可译作“以色列人”或“以色列百姓”；希伯来语字面意思是“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: “捣制”也可译作“捣碎”。这里指把橄榄捣碎而非以一般方式压榨，从而取得优质的油。
    reason: lexical_alternative
  - marker: c
    text: 在会幕礼仪的语境中，“持续”可以指持续而有规律地照管，并不一定表示每一刻都毫无中断。参出埃及记27:21及利未记24:2–4。
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה תְּצַוֶּה
  choice: 你要吩咐
  rationale: 独立代词“你”突出了对摩西的直接吩咐；中文以“你要”自然表达指令语气，不生硬直译句首连接词。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来语字面上的亲属与盟约群体称谓，同时也是现代中文读者能够理解的传统表达。
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: 把……送到你这里来
  rationale: לקח本义为“取”，但与אֶל及第二人称后缀连用，在物资供应语境中表示取得并带到摩西那里；此译符合现代汉语习惯。
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: 捣制的纯橄榄油
  rationale: “纯”涵盖油的洁净、清澈品质；“捣制”表达כָּתִית所指通过捣碎橄榄取得优质油的制作方式，避免误解为普通压榨。
- source_word: לַמָּאוֹר
  choice: 作照明之用
  rationale: 表达מָאוֹר的照明用途，不在原文之外明确添加灯台等器具。
- source_word: לְהַעֲלֹת נֵר
  choice: 使灯……点着
  rationale: 将字面“使灯上升”的希伯来语习语自然译出，并保留使役含义。
- source_word: תָּמִיד
  choice: 常常
  rationale: 该词在会幕礼仪语境中可指持续而有规律地维持，不必然表示每一刻都从不中断；“常常”保留这种语义空间。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别化盟约称谓
  choice: 以色列子孙
  alternative: 以色列人／以色列百姓
  rationale: 正文保留原文亲属群体表达，但不据此推导妇女被排除在盟约群体或供给责任之外；脚注说明其整体指称功能。
- issue: תָּמִיד所表示的持续性
  choice: 常常
  alternative: 不断／经常
  rationale: 避免把礼仪性的持续、定期维护武断解释为绝无片刻中断，同时也不削弱命令所要求的持续责任。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以色列子孙”保留原文盟约群体的亲属称谓；“捣制”“作照明之用”“使灯常常点着”兼顾源语形式、礼仪语境和普通读者的可理解性。
