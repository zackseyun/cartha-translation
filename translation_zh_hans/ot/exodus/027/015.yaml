lexical_decisions:
- source_word: וְלַכָּתֵף הַשֵּׁנִית
  choice: 另一侧
  rationale: כָּתֵף本义为“肩”，在会幕院子的建筑语境中指一边或一侧；הַשֵּׁנִית直译“第二”，此处指与上一节相对应的另一侧。译作“另一侧”符合现代汉语空间表达，也保留两侧相对的关系。
- source_word: חֲמֵשׁ עֶשְׂרֵה קְלָעִים
  choice: 十五肘长的帷幔
  rationale: 原文只有“十五”和“帷幔”，计量单位因承接上一节而省略；上一节明确为十五肘。补出“肘长”可避免误解为十五幅帷幔，并以脚注说明原文省略。קְלָעִים指围成院子的织物帷幕，译作“帷幔”既准确又庄重。
- source_word: עַמּוּדֵיהֶם שְׁלֹשָׁה
  choice: 三根柱子
  rationale: עַמּוּד指支撑帷幔的柱子；现代汉语按量词习惯译为“三根柱子”。所属关系在“配”所表达的结构关系中已经清楚，无须机械重复代词。
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: 三个柱座
  rationale: אֶדֶן在会幕建造语境中指承托或固定柱子的基础构件。“柱座”比笼统的“底座”更具体，也比容易产生现代电器联想的“插座”自然。
