base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: zh_hans
  text: 因为接生婆敬畏上帝，上帝就为她们建立了家室。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他为她们造了房屋。”原文的“房屋”也可能指为她们建立家庭或家族，而不只是建造实体房屋。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: 因为
  rationale: 该结构在这里引出原因，并与下文上帝的行动相连；现代汉语用“因为”自然清楚，无须生硬保留“事情发生了”这一希伯来语叙事套语。
- source_word: יָרְאוּ
  choice: 敬畏
  rationale: 这里指人对上帝兼具畏惧与尊崇的态度。“敬畏”是自然且庄重的汉语表达，也保留了原词的宗教分量。
- source_word: הַמְיַלְּדֹת
  choice: 接生婆
  rationale: 带冠词的分词在此作名词，指上文已提及的女性接生者；“接生婆”通俗明确，并与叙事语境相称。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 此处定指以色列的上帝；“上帝”是现代标准汉语中自然、明确的译法。
- source_word: וַיַּעַשׂ
  choice: 使……建立
  rationale: עשה基本义为“做、造”，但与“家”搭配时可表达使家室得以建立；此译兼顾原文措辞和汉语习惯。
- source_word: לָהֶם
  choice: 她们
  rationale: 后缀形式为阳性复数，但希伯来语可用阳性复数泛指复数对象；上下文明确指接生婆，汉语应依实际所指译为“她们”。
- source_word: בָּתִּים
  choice: 家室
  rationale: 该词字面为“房屋”，也可指家族或家庭。结合上帝赐福接生婆的语境，“家室”比实体建筑更可能，同时仍保留“家”的意象。
theological_decisions:
- issue: “为她们造家”的含义
  choice: 上帝使接生婆建立家室，即赐她们家庭或家族延续。
  alternative: 上帝为她们建造实体房屋。
  rationale: 希伯来语“造……家”可以指建立家庭或家族；这也符合本段把结果描述为上帝赐福的语境。但原文确有字面理解为房屋的可能，因此用脚注保留这一歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“接生婆”承接上下文中的具体人物；“敬畏上帝”保留圣经惯用表达。“建立了家室”表达较可能的习语含义，并用脚注呈现字面译法及原文歧义。
