- source_word: וְכָל אֶחָיו
  choice: 和他的众兄弟
  rationale: כָּל在此为集合意义；אֶחָיו明确指约瑟的兄弟们。“众兄弟”既保留全称意味，也符合庄重而自然的中文表达。
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: 以及那一代人，全都
  rationale: דּוֹר指同时代的一代人；将כֹּל译为“全都”，明确其涵盖整代人的范围，并使中文句意自然清楚。
