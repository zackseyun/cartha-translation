  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽ/יִּשְׁרְצ֛וּ וַ/יִּרְבּ֥וּ וַ/יַּֽעַצְמ֖וּ בִּ/מְאֹ֣ד מְאֹ֑ד וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֹתָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: zh_hans
  text: 但[a]以色列的子孙生养众多，滋生繁衍，增多，并且极其强盛；那地到处都是他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“而以色列的子孙”。原文的连接词通常表示“和、而”；这里译作“但”，是为了体现与上一节所述约瑟及其世代都死了之间的对照。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 但以色列的子孙
  rationale: “以色列的子孙”保留希伯来语的家族—民族称谓；句首 וּ 可译“而/和”，结合上一节约瑟及其世代都死了的背景，此处用“但”自然表达叙事上的转折。
- source_word: פָּרוּ
  choice: 生养众多
  rationale: פרה 表示结果丰硕、生育繁盛；“生养众多”既符合现代汉语圣经叙事语体，也保留与创世记赐福用语可能存在的呼应。
- source_word: וַיִּשְׁרְצוּ
  choice: 繁衍滋生
  rationale: שׁרץ 带有大量涌生、滋生的鲜明意象。直译“群聚蠕动”用于人群不自然；“繁衍滋生”保留旺盛增殖的力度，同时适合庄重叙事。
- source_word: וַיִּרְבּוּ
  choice: 日益强盛（其中人口增多的递进由前后语境共同表达）
  rationale: רבה 的核心义是增多。为避免汉语连续堆叠“众多、繁衍、增多”而显得生硬，将其与下一动词组成递进表达；人口迅速增加的意义仍由整组措辞清楚传达。
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: 日益强盛，极其兴旺
  rationale: עצם 表示变得强大，双重 מְאֹד 强烈加强程度。“极其兴旺”在汉语中兼顾人数壮大和整体势力增强，又保留原文的强烈强调。
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: 那地遍处都有他们
  rationale: 原文以“那地”为主语，字面为“那地被他们充满”。所选表达自然呈现遍布全地的结果，且“那地”比“全世界”准确，指他们居住的地域。
theological_decisions:
- issue: 生育词汇可能呼应创世记中的创造与赐福主题
  choice: 在正文保留“生养众多”等能产生呼应的词汇，但不明说这是赐福的实现
  alternative: 加入“蒙福”等解释性措辞，直接凸显创世记赐福主题
  rationale: 希伯来语的词汇序列很可能唤起先前的创造和赐福语言，但本节没有明说“蒙福”；译文应保存呼应，不把推论写入正文。
- issue: וַיַּעַצְמוּ 所指是人数众多还是力量强大
  choice: 译作“强盛，极其兴旺”，保留人口规模与群体力量两方面的可能性
  alternative: 仅译“人数极其众多”或仅译“极其强大”
  rationale: 动词核心含义偏向强大，而上下文主要描述人口增长；综合措辞可保留这种语义张力，不将其缩减为单一层面。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“繁衍滋生”保留原文 שׁרץ 所带的旺盛涌生意象，但避免对人群使用过于动物化或生硬的直译。正文脚注标记置于整句末，所注释的是句首连接词。
