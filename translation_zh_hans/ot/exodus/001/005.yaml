  source_fidelity: 正文正确表达了雅各所出者共七十人，以及约瑟当时已在埃及这两个并列陈述；但“从雅各身上所出的”在现代汉语中不够自然，也较弱地传达了原文带有身体／生育意象的惯用语。
  naturalness: 建议以“从雅各腰间所出的”替换“从雅各身上所出的”。“腰间”是汉语中较自然、庄重的对应表达，既不机械地译成易引起误解的“大腿”，也比“身上”更明确保留原文的家族生育意象。“那时”并非原文所需，删去后句子更简洁。
  terminology: “人”准确对应此处作为人数计量词的נפש。“约瑟”“埃及”均规范。脚注应说明“大腿”是字面词义，而该短语指由雅各而出的后代；“亲生后代”可能在汉语中较易被理解为仅指亲自所生的子女，宜改为“后代”。
