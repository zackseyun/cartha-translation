  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: zh_hans
  text: 凡从雅各腰间所出的，共有七十人[a]；约瑟已经在埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从雅各的大腿所出的”；这是指由他而出的后代的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 共有
  rationale: 此处叙事性结构引出总人数；现代汉语用“共有”自然表达存在与总计之意，不采用古雅的“事情是这样”。
- source_word: כָּל
  choice: 凡……的
  rationale: “凡”保留希伯来语量词的周全范围，并与后面的关系结构自然衔接。
- source_word: נֶפֶשׁ ... נָפֶשׁ
  choice: 人……人
  rationale: נֶפֶשׁ在这里是计算个体人数的用语；译作“人”符合现代汉语，不引入“灵魂”的技术性含义。
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: 从雅各身上所出的
  rationale: 保留原文“从雅各身体而出”的具体生育意象，同时避免把יֶרֶךְ机械译成现代汉语中容易令人困惑的“大腿”；所指是雅各的亲生后代。
- source_word: שִׁבְעִים
  choice: 七十
  rationale: 直接保留基数。
- source_word: וְיוֹסֵף
  choice: 约瑟；
  rationale: 原文以并列连词引入补充说明；汉语用分号连接，既维持并列关系，也避免生硬重复“而”。
- source_word: הָיָה בְמִצְרָיִם
  choice: 那时已经在埃及
  rationale: “已经”表达约瑟相对于雅各家众人来到埃及之前已身在当地的时间关系；“那时”使现代汉语叙述更清楚。
theological_decisions:
- issue: 七十人的范围以及约瑟是否计入
  choice: 保持原文为两个并列陈述，不在正文中说明约瑟是否计入七十人
  alternative: 译成“包括已经在埃及的约瑟，共七十人”或“另有约瑟在埃及”
  rationale: 希伯来文本先陈述雅各所出者共七十人，再说明约瑟已在埃及；正文不应替原文消除计数关系可能产生的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从雅各身上所出的”适度保留原文的身体意象；脚注交代“大腿”的字面形式及其惯用含义。
