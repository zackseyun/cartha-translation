  rationale: 修订仅改善惯用语的汉语表达和脚注范围：“腰间所出的”自然对应原文的“腰／大腿”生育性习语；删除“那时”避免加入原文未明说的时间指示。七十人的计数与约瑟在埃及之间的关系仍保持原文的并列与未明说状态。
