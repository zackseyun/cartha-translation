base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: zh_hans
  text: 他说：“你们为希伯来妇人接生时，要察看产凳[a]上的婴儿：若是儿子，就要把他处死；若是女儿，就让她活着。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “产凳”原文直译为“双石”，可能指生产时所坐的凳子或座位。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן אֶת־הָעִבְרִיּוֹת
  choice: 你们为希伯来妇人接生时
  rationale: יַלֵּד的皮勒式在此指协助生产；“接生”既自然简洁，也符合受话者为收生婆的语境。עִבְרִיּוֹת按阴性复数实体用法译为“希伯来妇人”。
- source_word: וּרְאִיתֶן
  choice: 要察看
  rationale: 此处不是泛指视觉上的“看见”，而是命令收生婆在分娩时查看新生儿；“察看”体现有意查验，同时不增添原文没有的细节。
- source_word: עַל־הָאָבְנָיִם
  choice: 产凳上
  rationale: 该词字面与“双石”有关，但在分娩语境中通常指生产时所用的座具；正文采用自然的语境义，字面形式及其不确定性保留在脚注。
- source_word: אִם־בֵּן הוּא
  choice: 若是儿子
  rationale: בֵּן在此指男婴；“儿子”保留与下文“女儿”的对称，也符合命令的庄重语体。
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: 就要把他处死
  rationale: מות的使役式意为“使之死亡、处死”；“处死”准确表达蓄意杀害的命令及其强制性质。
- source_word: וְאִם־בַּת הִיא וָחָיָה
  choice: 若是女儿，就让她活着
  rationale: “女儿”与“儿子”对应；וָחָיָה在命令语境中表示准许她存活，即不加杀害，译为“让她活着”比单纯陈述“她就活着”更清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事与命令语体。“接生”“产凳”符合当代普通读者的理解；冒号将查看婴儿与随后按性别下令的内容自然衔接。脚注标记置于引出命令的“他说”之后，以与所附词语的说明相对应。
