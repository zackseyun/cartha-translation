base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/020.yaml
  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: zh_hans
  text: 于是，上帝恩待接生婆；百姓增多，变得极其强盛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: 恩待
  rationale: 使役形态与介词 ל 连用，表示向某人行善、善待某人。“恩待”简洁自然，保留上帝施惠的含义，同时不像“赐福”那样具体化其方式。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 本叙事中指以色列的上帝；“上帝”是现代汉语中自然、庄重的单数称谓。
- source_word: לַמְיַלְּדֹת
  choice: 那些接生婆
  rationale: ל 标明受益对象；汉语动词“恩待”可直接带宾语。加“那些”自然回指上文提到的接生婆，并未增添新的所指。
- source_word: וַיִּרֶב
  choice: 不断增多
  rationale: רבה 在此描述百姓人数增长。“不断增多”符合叙事语境，也自然表达希伯来语连续叙事中增长持续发生的意味。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文仅说“这百姓／百姓”，上下文已清楚指以色列人；不扩写为“以色列百姓”。
- source_word: וַיַּעַצְמוּ
  choice: 变得强盛
  rationale: עצם 在此表示变强、壮大。“变得强盛”兼顾力量增长与群体兴盛，符合现代庄重叙事文体。
- source_word: מְאֹד
  choice: 极其
  rationale: מְאֹד 强烈修饰“变得强盛”；“极其”比普通的“很”更充分传达其强度，又不显古奥。
theological_decisions:
- issue: 是否把上帝对接生婆的行动译为“赐福”
  choice: 恩待那些接生婆
  alternative: 赐福给那些接生婆；善待那些接生婆
  rationale: יטב 表示行善或善待，却未在本节说明施恩的具体方式。“恩待”保留神施惠的语义，又避免提前用“赐福”界定其行动；具体结果留待下一节说明。
translation_notes:
  register: 采用自然、庄重而通俗的现代标准汉语。“于是”承接前文因果与叙事推进；分号体现本节两个紧密相连的结果。
