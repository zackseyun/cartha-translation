base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/008.yaml
  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: zh_hans
  text: 一位新王[a]兴起，统治埃及；他不认识约瑟[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“另一位王”。希伯来文形容词直译为“新”，但有人认为这里暗示另一个王朝或政权。
    reason: lexical_alternative
  - marker: b
    text: 或译“他不承认约瑟”。这里的“认识”可能不只是指不知道约瑟是谁，也可能指不承认他或不把他放在心上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 兴起
  rationale: 该叙事动词推进情节；“兴起”保留了קום的动作意象，也可自然表示君王掌权。
- source_word: מֶלֶךְ
  choice: 王
  rationale: מֶלֶךְ明确指君王；“王”比宽泛的“统治者”更准确。
- source_word: חָדָשׁ
  choice: 新
  rationale: 该形容词的直接含义是“新”。它是否暗示另一王朝或政权，留作脚注说明，不写入正文。
- source_word: עַל מִצְרָיִם
  choice: 统治埃及
  rationale: עַל与君王连用表示对一地拥有权柄；“统治埃及”在现代汉语中自然地表达“在埃及之上掌权”。
- source_word: אֲשֶׁר לֹא יָדַע
  choice: 他不认识
  rationale: ידע通常意为“知道、认识”。此处也可能含有“不承认、不把……放在眼里”的意味，但正文保留较直接且开放的表达。
- source_word: יוֹסֵף
  choice: 约瑟
  rationale: 采用现代中文圣经读者熟悉、并与希伯来名字对应的标准音译“约瑟”。
theological_decisions:
- issue: “新王”及“不认识约瑟”是否应明确表示王朝更替或蓄意无视
  choice: 正文采用“新王……不认识约瑟”，不进一步解释其政治动机或王朝背景。
  alternative: 译为“另一位王／另一王朝的王……不承认约瑟”。
  rationale: 经文本身只说一位“新”王兴起，并且“不认识”约瑟。王朝更替和蓄意无视虽是可能的理解，却不是希伯来文唯一要求的含义，因此保留其歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“一位新王兴起，统治埃及”既保留原文“兴起”的意象，也清楚表达עַל所表示的统治关系；分号使关系从句在汉语中读来顺畅。
