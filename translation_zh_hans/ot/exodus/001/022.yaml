base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: zh_hans
  text: 于是，法老吩咐全体百姓说：“凡出生的男孩[a]，你们都要把他投进尼罗河[b]；至于每个女孩[c]，你们都要让她活着。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “男孩”原文直译为“儿子”；这里泛指男性孩子。
    reason: lexical_alternative
  - marker: b
    text: 原文作“河”；在《出埃及记》中，这个词通常特指尼罗河。
    reason: lexical_alternative
  - marker: c
    text: “至于”原文直译为“和／而”；这里按前后命令的对比关系译出。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה表示发出命令；“吩咐”在现代汉语中自然、庄重，也符合君王颁令的语境。
- source_word: לְכָל עַמּוֹ
  choice: 他的全体百姓
  rationale: עַם通常指“百姓、人民”。此处保留“他的”以及“全体”的范围，不把对象缩窄为官员或军队。
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: 凡出生的男孩
  rationale: בֵּן字面是“儿子”，在此泛指男性婴孩；译作“男孩”可避免汉语“出生的儿子”被误解为各家自己的儿子，同时保留命令针对所有新生男性的含义。
- source_word: הַיְאֹרָה
  choice: 扔进尼罗河
  rationale: יְאֹר字面为“河”，但在《出埃及记》的埃及背景中通常特指尼罗河；方向词尾与动词合起来译为“扔进”。
- source_word: תַּשְׁלִיכֻהוּ
  choice: 你们都要把他扔进
  rationale: 该形式是复数命令语气的未完成式用法，并带第三人称阳性单数宾语后缀；“你们都要把他扔进”明确保留受命者和宾语。
- source_word: וְכָל הַבַּת
  choice: 但凡女孩
  rationale: וְ字面为“和／而”，此处连接与前句相反的处置，汉语用“但”自然显出对比；בַּת字面是“女儿”，在此泛指女性孩子。
- source_word: תְּחַיּוּן
  choice: 你们都要让她活着
  rationale: חיה的Piel形式在此表示使其存活、留其性命；“让她活着”简明地保留与杀死男孩相对的意思。
theological_decisions:
- issue: 命令所针对男孩的族群
  choice: 不在正文中增添“希伯来人的”或“以色列人的”
  alternative: 凡希伯来人所生的男孩
  rationale: 上下文表明命令针对希伯来婴孩，但本节希伯来文本本身没有重复族群限定；不补入可保留原文的表达范围与上下文依赖。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“凡……都要……”体现法令的全面性和强制性；保留“你们”和阳性单数宾语“他”，使命令的语法关系清楚。
