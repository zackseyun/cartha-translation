review_pass:
  verdict: revise
  source_fidelity: 原文准确表达法老向全体民众颁布命令，命令将每个出生的男性婴孩投入河中，并使每个女性婴孩存活。草稿整体忠实保留了受命者（“你们”）、阳性单数宾语（“他”）和对比关系；“尼罗河”也适当地明示了《出埃及记》语境中יַאֹר的所指。
  naturalness: “但凡”在现代汉语中常带“只要／凡是……就……”的条件或让步色彩，在这一严肃、平行的法令中不如“凡”自然清楚。改为“凡女孩”可保持与前句的平行，避免歧义。
  terminology: “法老”“百姓”“尼罗河”及“让她活着”均合乎现代标准汉语和叙事语体。“男孩”与“女孩”在本节可自然泛指男性、女性婴孩；脚注说明“儿子／女儿”的原文字面意义，处理恰当。
  issues:
  - severity: low
    issue: “但凡女孩”具有不必要的现代条件性语感。
    rationale: 希伯来文 וְכָל הַבַּת 是与前句相对的“而／但每个女儿”，并无“只要”或条件含义。汉语改作“但凡女孩”仍可理解，但“凡女孩”更直接、平行且无歧义。
  revised_text: 于是，法老吩咐他的全体百姓说：“凡出生的男孩[a]，你们都要把他扔进尼罗河[b]；但凡女孩[c]，你们都要让她活着。”
  revised_footnotes:
