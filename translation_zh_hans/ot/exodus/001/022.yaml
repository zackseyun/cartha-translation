    text: “男孩”原文直译为“儿子”；这里泛指男性孩子。
    reason: lexical_alternative
  - marker: b
    text: 原文作“河”；在《出埃及记》中，这个词通常特指尼罗河。
    reason: lexical_alternative
  - marker: c
    text: “但”原文直译为“和／而”；这里按前后命令的对比关系译出。
    reason: lexical_alternative
  revision_rationale: 仅将“但凡女孩”改为“凡女孩”，使中文法令式平行结构更自然，并避免“但凡”可能引入的条件性语感；其余译文及脚注均可保留。
