base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: zh_hans
  text: 接生婆对法老说：“因为希伯来妇女不像埃及妇女；她们身强力壮[a]，接生婆来到她们那里之前，她们已经生下孩子了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她们有活力”或“很强健”。希伯来语这个词可能强调她们身体强健、生产迅速；也有人按较字面的方式理解为“如同动物”，但此处词义并不确定。
    reason: 保留חָיוֹת的词汇歧义，说明正文主要译法及较字面的另一种理解，避免把不确定含义写死。
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: 说
  rationale: אמר的叙事形式在此引出直接引语；用“说”自然准确，复数主语由“接生婆”体现。
- source_word: הַמְיַלְּדֹת
  choice: 接生婆
  rationale: 由ילד构成的分词性名词在本语境中指协助妇女生产的人；“接生婆”是现代汉语中简洁、易懂的对应说法。
- source_word: אֶל־פַּרְעֹה
  choice: 对法老
  rationale: אֶל在言说结构中标明说话对象；汉语自然表达为“对法老说”。
- source_word: כִּי לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: 希伯来妇女不像埃及妇女
  rationale: 首个כִּי引出接生婆的解释；汉语直接引语无需另加“因为”也能自然承接上下文，同时保留两组妇女之间的对比。
- source_word: חָיוֹת הֵנָּה
  choice: 她们身强力壮
  rationale: חָיוֹת在此可能表示有活力、强健，强调生产迅速；“身强力壮”自然传达这一主要语境义，同时用脚注保留词义上的其他可能。
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: 接生婆还没赶到
  rationale: בטרם表示某事发生以前；单数“接生婆”作泛指。“赶到”符合接生现场语境，并自然衔接后句已经完成的动作。
- source_word: וְיָלָדוּ
  choice: 她们就已经生下孩子了
  rationale: 完成式表示接生婆到达前生产已经完成；“就已经……了”清楚呈现先后关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“接生婆”贴近日常汉语；“还没赶到……就已经……”使原文的时间先后关系清晰。脚注保留חָיוֹת的真实语义张力，不在正文中采用可能带贬义且并不确定的“像牲畜一样”。
