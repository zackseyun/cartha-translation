base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/013.yaml
  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: zh_hans
  text: 埃及人严酷地[b]役使以色列的子孙[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”；传统译法为“以色列的儿女”。
    reason: lexical_alternative
  - marker: b
    text: 或译“残酷地”或“严厉地”。希伯来语指在强迫劳作中严酷、无情、令人难以承受的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: 役使
  rationale: 这是 עבד 的使役形，意为使人服役、做工。“役使”在现代汉语中自然保留了使役含义，也符合本段强迫劳作的语境；没有直接译成“奴役”，以免把上下文所表明的处境完全压入这一个动词。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 此处作复数行动主体，指实施压迫的埃及人；译作“埃及人”比国名“埃及”更符合现代汉语表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留希伯来语亲族兼群体称谓的形式及其谱系意味；“子孙”在现代汉语中可统指后裔，不限于未成年人，也不只指男性。
- source_word: בְּפָרֶךְ
  choice: 严酷地
  rationale: 该词表示在强迫劳作中严厉、无情、令人难以承受的方式。“严酷地”清楚自然，并保留介词所表达的方式意义；“残酷地”也可，但感情色彩稍强。
theological_decisions:
- issue: 如何翻译群体称谓 בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  alternative: 以色列人；传统译法“以色列的儿女”
  rationale: “以色列的子孙”既是可理解的现代汉语，又保留原文作为雅各后裔及整体群体的谱系、盟约共鸣；没有将其完全简化为族名，也避免“儿女”被误解为只指未成年人。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“役使”简洁表达使人服役、做工的使役意义；“严酷地”与之搭配自然。正文中的[a]、[b]均与脚注对应。
