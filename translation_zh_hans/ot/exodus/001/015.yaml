base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: zh_hans
  text: 于是，埃及王对两名希伯来接生妇[a]——一个名叫施弗拉，另一个名叫普阿——说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为希伯来妇女接生的接生妇”。希伯来语短语既可能表示这些接生妇是希伯来人，也可能表示她们为希伯来妇女接生。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 于是……说
  rationale: 承接并推进叙事；“于是”在现代汉语中自然地表达连续动作。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: 埃及王
  rationale: 按原文组合直译，不添入本节未出现的“法老”称号。
- source_word: לַמְיַלְּדֹת
  choice: 对……接生妇
  rationale: 该词指帮助妇女分娩的女性；“接生妇”清楚、自然，也符合现代普通读者的用语。
- source_word: הָעִבְרִיֹּת
  choice: 希伯来
  rationale: 正文按形容词修饰“接生妇”处理，同时以脚注保留其也可能表示“给希伯来妇女接生的”这一语法歧义。
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: 她们一个名叫……，另一个名叫……
  rationale: 以自然现代汉语表达原文“一个……第二个……”的分别指称，并明确两位接生妇的名字。
- source_word: שִׁפְרָה
  choice: 施弗拉
  rationale: 按通行的现代中文圣经人名音译。
- source_word: פּוּעָה
  choice: 普阿
  rationale: 按通行的现代中文圣经人名音译。
theological_decisions:
- issue: הָעִבְרִיֹּת所说明的是接生妇的族属，还是她们服务的对象
  choice: 正文译作“希伯来接生妇”
  alternative: “给希伯来妇女接生的妇人”
  rationale: 原文的修饰关系可作两解。正文采用较直接的形容词读法，但不把另一种理解排除，故在脚注中明示歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“接生妇”比传统的“收生婆”更符合当代普通读者的表达习惯；句末用冒号承接下一节埃及王所说的话。
