base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: zh_hans
  text: 他们以沉重的劳役，使以色列人的生活充满苦楚：叫他们和泥制砖，做田间各样的工；他们以严酷的手段，叫以色列人从事这一切劳役[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以严酷的手段”也可译作“残酷无情地役使”；希伯来语这个词表示严厉、压榨人的压迫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת־חַיֵּיהֶם
  choice: 使以色列人的生活苦不堪言
  rationale: 保留מרר“使……变苦”的核心意象；依上文补出“以色列人”，使现代汉语指代清楚。“苦不堪言”自然表达其生活被劳役弄得极其痛苦。
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: 用沉重的劳役
  rationale: עֲבֹדָה在本段指被强迫承担的劳作或服役；“劳役”体现压迫语境，קָשָׁה译为“沉重的”。
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: 和泥制砖
  rationale: חֹמֶר在制砖语境可指泥或黏土，לְבֵנִים为复数“砖”；汉语用“和泥制砖”自然呈现这项劳动，同时没有把两种材料误作彼此独立的劳役。
- source_word: וּבְכָל־עֲבֹדָה בַּשָּׂדֶה
  choice: 做田间各样的工
  rationale: 保留כָל的周全范围以及בַּשָּׂדֶה的田间场景，表达自然通俗。
- source_word: אֵת כָּל־עֲבֹדָתָם אֲשֶׁר־עָבְדוּ בָהֶם
  choice: 他们把这一切劳役强加在以色列人身上
  rationale: 原文以עבד词根重复形成沉重的复述结构；现代汉语以“强加”传达埃及人使以色列人服劳役的关系，并用破折号后续句式承接总结。
- source_word: בְּפָרֶךְ
  choice: 严酷地驱使
  rationale: פָרֶךְ表示严厉、压碎人的压迫方式；“严酷地驱使”既贴合劳役语境，又保留其强烈程度。
