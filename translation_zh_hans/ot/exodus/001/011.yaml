  text: וַ/יָּשִׂ֤ימוּ עָלָי/ו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖/וֹ בְּ/סִבְלֹתָ֑/ם וַ/יִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְ/פַרְעֹ֔ה אֶת פִּתֹ֖ם וְ/אֶת רַעַמְסֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: zh_hans
  text: 于是，埃及人在以色列人之上设立劳役官，要用重担使以色列人受苦；以色列人便为法老建造了储货城[a]，就是比东和兰塞[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“在他之上”“使他受苦”和“他建造”中使用阳性单数形式，以“以色列”作为一个整体来指称；按所指可译作“以色列人”。
    reason: 说明希伯来语集体单数与中文按意义采用集合性复数表述之间的关系。
  - marker: b
    text: “储货城”也可译作“积货城”或“仓储城”。
    reason: 保留 עָרֵי מִסְכְּנוֹת 的词义选择。
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 他们设立
  rationale: 保留第三人称复数叙事形式；“设立”自然表达委任官员之意。上下文表明“他们”指埃及人。
- source_word: עָלָיו
  choice: 辖制以色列
  rationale: 原文是阳性单数“在他之上”，集体指以色列。正文点明所指对象，同时在后文以“他”保留集体单数表达。
- source_word: שָׂרֵי מִסִּים
  choice: 劳役官
  rationale: 该短语指主管徭役或强迫劳动的官员；“劳役官”简明、现代，也保留其官职与强制劳动职能。
- source_word: לְמַעַן עַנֹּתוֹ
  choice: 要……使他受苦
  rationale: ענה 的加强词干可表示使人受苦、压迫或卑屈；此译保留其严重性，又不把意义限缩为某一种压迫方式。
- source_word: בְּסִבְלֹתָם
  choice: 用他们的重担
  rationale: סִבְלֹתָם 可指重担、负重劳作或强制劳役；直译保留具体负担与劳役义之间的张力，也保留原文复数所属后缀。
- source_word: וַיִּבֶן
  choice: 他便……建造了
  rationale: 原文动词为第三人称阳性单数，以集体单数指以色列；正文保留这一形式，并用脚注说明。
- source_word: עָרֵי מִסְכְּנוֹת
  choice: 储货城
  rationale: 指用于储存物资、作为供应据点的城；“储货城”比传统的“积货城”更易为现代读者理解，同时不限定所储之物。
- source_word: לְפַרְעֹה
  choice: 为法老
  rationale: 准确表达建城服务于法老的与格关系。
- source_word: פִּתֹם
  choice: 比东
  rationale: 采用现代中文圣经语境中通行且易辨认的地名音译。
- source_word: רַעַמְסֵס
  choice: 兰塞
  rationale: 按希伯来语地名作简洁音译；其他常见音译列于脚注。
theological_decisions:
- issue: 以色列作为集体的单数表达
  choice: 正文保留“他”和单数建造形式
  alternative: 按所指意义译作“他们”，并用复数表述建造
  rationale: 原文先以单数代词、后以第三人称阳性单数动词把以色列视为一个集体。保留单数可呈现原文修辞，不把集体与成员之间的张力默默抹平；脚注同时说明自然的复数理解。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“劳役官”“储货城”便于普通读者理解；分号呈现压迫与建城结果之间的推进关系。正文保留希伯来语把以色列视作集体单数的表达，并以脚注避免现代汉语读者误解。
