revisions:
- from: 于是，他们设立劳役官辖制以色列，要用他们的重担使他受苦[a]；他便为法老建造了两座储货城[b]，就是比东和兰塞[c]。
  to: 于是，埃及人在以色列人之上设立劳役官，要用重担使以色列人受苦；以色列人便为法老建造了储货城[a]，就是比东和兰塞[b]。
  rationale: 修订以“在以色列人之上设立劳役官”贴合原文介词结构并改善中文句法。正文按现代汉语自然用法明示集体所指为“以色列人”，脚注则完整保留原文阳性单数、集体指称的形态信息。删去中文中指代含混的“他们的”，不改变以重担施压的基本意义。脚注 c 虽不在正文设置锚点，原草案亦存在该结构；为使脚注锚点完整可用，应在“兰塞”后加 [c]。
