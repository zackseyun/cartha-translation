source:
  edition: WLC
  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: zh_hans
  text: 可是，接生婆敬畏上帝，没有照埃及王对她们所说的去做，反而让孩子们活了下来[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“保全了孩子们的性命。”
    reason: וַתְּחַיֶּיןָ 可指使人存活，也可着重表示保全其性命；两种译法均符合本节语境。
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: 敬畏
  rationale: 动词 ירא 用于人对上帝的态度时兼有惧怕与尊崇之意；“敬畏”保留了这一常见的圣经表达，没有将其弱化为一般的尊敬。
- source_word: הַמְיַלְּדֹת
  choice: 接生婆
  rationale: 该词是 ילד 的女性复数分词作名词使用，指协助妇女生产的人；“接生婆”是自然、明确且普通读者易懂的现代汉语称呼。
- source_word: אֶת הָאֱלֹהִים
  choice: 上帝
  rationale: 在“敬畏”之后，该短语指叙事中的真神；现代汉语以“上帝”自然表达，不机械保留希伯来语冠词。
- source_word: וְלֹא עָשׂוּ
  choice: 没有……去做
  rationale: 直接表达否定的 עשׂה，并与后面的比较从句自然衔接。
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: 照……对她们所说的
  rationale: 既保留 דבר“说”的基本含义，也在王命的语境中清楚传达吩咐的意味。
- source_word: מֶלֶךְ מִצְרָיִם
  choice: 埃及王
  rationale: 简洁、自然地表达希伯来语的属格结构。
- source_word: וַתְּחַיֶּיןָ
  choice: 让……活了下来
  rationale: חיה 的强意词干在此有使其存活或保全性命之意；这一译法自然呈现其与王命杀死男婴之间的对比，同时保留“使活/存活”的语义空间。
- source_word: הַיְלָדִים
  choice: 孩子们
  rationale: 该名词本身指“孩子们”，范围比“男婴”宽；上文语境已明确所涉及的是男婴，因此正文不必把语境信息写进该词的词义。
theological_decisions:
- issue: “敬畏上帝”中 אֱלֹהִים 的译法
  choice: 上帝
  alternative: 神
  rationale: 这里的所指是叙事中的真神。“上帝”符合现代标准汉语，也不额外加入超出原文的教义内容。
- issue: 接生婆行为的表达
  choice: 让孩子们活了下来
  alternative: 保全了孩子们的性命
  rationale: 原文 וַתְּחַיֶּיןָ 可表达使其存活或保全性命；正文采用较贴近动词形象且自然的说法，不进一步判断她们采取了何种具体行动。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“可是”承接前文并突出转折；“反而”明确呈现接生婆没有服从王命、却保全孩子性命的对照。脚注标记置于其实际所解释的“让孩子们活了下来”之后。
