  text: 以下[a]是随雅各来到埃及的以色列众子的名字：他们各人和自己的全家都来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这些是……的名字。”原文以连接词开头，把《出埃及记》与《创世记》此前的叙事衔接起来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: 以下是
  rationale: וְ承接《创世记》末尾的叙事，אֵלֶּה引出名单。现代汉语用“以下是”自然地开启名单；连接词的承接作用另以脚注说明。
- source_word: שְׁמוֹת
  choice: 名字
  rationale: 直接对应原文，也保留本书希伯来文书名的主题词。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的儿子们
  rationale: 这里指下文列出的男性家族首领；“儿子们”比泛称“子孙”或“后代”更准确。
- source_word: הַבָּאִים ... בָּאוּ
  choice: 来到
  rationale: 原文先用分词限定这些人，末尾再用限定动词收束句子。汉语若重复“来到”显得累赘，因此合并为一个自然的叙述表达，同时保留其历史动作。
- source_word: מִצְרָיְמָה
  choice: 来到埃及
  rationale: 方向词尾表示朝向埃及的移动；“来到埃及”符合现代汉语习惯。
- source_word: אֵת יַעֲקֹב
  choice: 随雅各
  rationale: 此处אֵת表示伴随，不是直接宾语标记；“随雅各”简洁地表达同行。
- source_word: אִישׁ וּ/בֵית/וֹ
  choice: 各人都带着自己的家眷
  rationale: אִישׁ在这里有逐一分配的作用；בַּיִת指家庭单位而非房屋。“家眷”在名单语境中自然、明确。
