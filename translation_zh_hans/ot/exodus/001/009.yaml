  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: zh_hans
  text: 他对自己的百姓说：“看哪，以色列人比我们人数更多，力量更强大。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל עַמּוֹ
  choice: 他对自己的百姓说
  rationale: 未完成式连续体推进叙事；“百姓”自然表达 עַם 所指法老治下的群体，加“自己的”清楚体现第三人称单数所属后缀。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意和强调的语用功能，同时采用现代读者熟悉而庄重的圣经叙事用语。
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: 以色列人的民族
  rationale: בְּנֵי יִשְׂרָאֵל 字面为“以色列的众子”，在这里是族群称谓；译作“以色列人”符合现代汉语。“民族”对应前面的 עַם，并保留其集合性。
- source_word: רַב וְעָצוּם
  choice: 人数更多，也更强大
  rationale: רַב 在人口语境中指数量众多，עָצוּם 指强盛有力；两者都受 מִמֶּנּוּ 所表达的比较关系支配。
- source_word: מִמֶּנּוּ
  choice: 比我们
  rationale: 介词 מִן 加第一人称复数后缀在此标示比较，汉语以“比我们”自然表达。
theological_decisions:
- issue: 比较范围是否同时修饰 רַב 与 עָצוּם
  choice: 译为“比我们人数更多，也更强大”
  alternative: 译为“人数众多，势力强大，超过我们”
  rationale: 句末 מִמֶּנּוּ 最自然地与两个并列形容词构成比较；所选译法保持句法关系而不额外解释法老所担忧的是人口、军事或政治力量中的哪一种。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“看哪”保留原文的提示强调；避免生硬直译“以色列众子的百姓”，改用普通读者易懂的族群表达。
