  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: zh_hans
  text: 来吧，我们要用智谋对付他们[a][b]，免得他们人数增多；要是发生战争，他们也会加入我们的仇敌，攻打我们，并离开这地而去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“对付他”；这个单数代词把以色列民视为一个整体，因此正文译作“他们”。
    reason: lexical_alternative
  - marker: b
    text: 或译“明智地对待他们”。原词既可表示明智行事，也可表示机巧谋划；这里的语境带有政治算计的意味。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“从这地上去”。也可译“离开这地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: 来吧
  rationale: 这是招呼众人立即共同行动的感叹语；“来吧”自然地保留了劝请和催促的语气。
- source_word: נִתְחַכְּמָה
  choice: 我们要用智谋对付
  rationale: 该词在此指以智慧或机巧谋划应对；结合上下文，“用智谋对付”既传达政治算计的意味，也不抹去原词可指明智行事的词义张力。
- source_word: לוֹ
  choice: 他们
  rationale: 原文代词在形态上是阳性单数，但所指的是作为一个整体的以色列民；现代汉语用复数“他们”更自然清楚。
- source_word: פֶּן
  choice: 免得
  rationale: 引出说话者试图防止的结果，准确表达原文的忧惧和预防逻辑。
- source_word: יִרְבֶּה
  choice: 他们人数增多
  rationale: 原文用单数动词配合以色列这个集合性所指；译作“他们人数增多”符合现代汉语，并延续本章人口增长的主题。
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: 要是发生战争
  rationale: 该短语提出一种可能出现的局面；“要是发生战争”在现代汉语中自然地表达这种条件性。
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: 他们也会加入我们的仇敌
  rationale: 这里的动词与介词组合表示加入某一方；以复数“他们”表达作为集体的以色列民。
- source_word: וְנִלְחַם בָּנוּ
  choice: 攻打我们
  rationale: 简洁自然地表达与说话者敌对交战的意思。
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: 并从这地上去离开
  rationale: 保留עלה“上去”的方向性意象，同时以“离开”明确מן所表达的离去；不把原文简化成仅仅“离开这地”。
theological_decisions:
- issue: וְעָלָה מִן הָאָרֶץ所表达的担忧
  choice: 保留“从这地上去离开”的字面方向性
  alternative: 只译作“离开这地”
  rationale: 原文明确使用“上去”一词。保留这一表达可避免替原文断定法老所忧虑的重点，也不消除该短语在叙事中的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“来吧”保留法老号召行动的口吻；“用智谋对付”兼顾原词的智慧与机巧含义；末句略保留希伯来语“上去”的方向性，以免消解原文表达。所有集合性单数所指均按现代汉语习惯译为复数。
