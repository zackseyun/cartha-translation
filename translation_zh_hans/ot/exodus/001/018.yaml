base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: zh_hans
  text: 于是，埃及王召来接生婆，对她们说：“你们为什么做这事，让这些孩子活下来[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“保全这些男孩的性命”。希伯来语动词在这里可指使其存活、保全其性命或容其活着；根据上下文，“孩子”指男婴。
    reason: 保留动词的词义幅度，并说明名词在当前语境中的具体所指。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: קרא与表示对象的ל连用时，可指召唤某人前来；“召来”自然地表达王命人把接生婆带到面前。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: 埃及王
  rationale: 准确、简洁地表达希伯来语的属格结构，符合现代汉语圣经叙事语体。
- source_word: לַמְיַלְּדֹת
  choice: 接生婆
  rationale: 该词指为产妇接生的妇女；“接生婆”准确通俗，也与上下文一致。
- source_word: וַיֹּאמֶר לָהֶן
  choice: 对她们说
  rationale: 保留אמר的一般言说义及阴性复数受话者，不增添“责令”等解释性语气。
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 自然表达询问原因的疑问词。
- source_word: עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: 你们为什么做这事
  rationale: 保留第二人称阴性复数所指的复数受话者，并以自然现代汉语表达“做了这件事”。
- source_word: וַתְּחַיֶּיןָ
  choice: 让……活下来
  rationale: 该使役形式在此可表示使其存活、保全其性命或容其活着；“让……活下来”既自然，也不过度限定接生婆采取了何种行动。
- source_word: הַיְלָדִים
  choice: 这些孩子
  rationale: 该词本身可泛指孩子；上下文虽明确涉及男婴，正文保留较宽的词义范围，并在脚注说明依上下文可译为“男孩”。
theological_decisions: []
