  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: zh_hans
  text: 可是，越是苦待他们[a]，他们就越增多，越扩展；埃及人因以色列人[b]而感到厌恶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“苦待他”；“他”把以色列作为一个整体来指称。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以色列的众子”，这里指全体以色列人。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“感到惧怕”或“愁烦”。原词可表示强烈的厌恶、苦恼，或在此语境中因对方而产生的惧怕。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: 越是……就越……越……
  rationale: 这一组关联结构表达程度上的同步递增；汉语用“越是……就越……”自然保留其比例关系。“可是”体现本节与压迫者预期相反的转折。
- source_word: יְעַנּוּ
  choice: 苦待
  rationale: Piel词形在此指使人受苦、压迫。“苦待”简明、自然，并与上文强迫劳役的语境相合而不过度限定手段。
- source_word: אֹתוֹ
  choice: 他们
  rationale: 原文为阳性单数“他”，把以色列作为一个集合整体来指称；现代汉语依上下文用复数“他们”更自然。
- source_word: יִרְבֶּה
  choice: 增多
  rationale: 指人口数量增加；虽为单数动词，其主语是集合意义的以色列。
- source_word: יִפְרֹץ
  choice: 扩展
  rationale: 该词有冲破界限、迅速蔓延或扩张之意。“扩展”在此可表达以色列人口与分布不断扩大，同时保留一定的动态感。
- source_word: וַיָּקֻצוּ
  choice: 又惧怕又厌恶
  rationale: קוץ可表达强烈的嫌恶，也可涉及因对方而感到恐惧、苦恼。正文并列两层感受，以避免只取其中一义而消除原文张力。
- source_word: מִפְּנֵי
  choice: 对
  rationale: 与קוץ连用时表示因对方的存在而产生强烈反应；汉语“对……又惧怕又厌恶”自然表达这一关系。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是常见的族群称谓，直译为“以色列的儿子们”。现代汉语“以色列人”准确、清楚，也涵盖全体百姓。
theological_decisions:
- issue: 集合意义的以色列应采用单数还是复数表达
  choice: 正文用复数“他们”
  alternative: 按形式译作“他”
  rationale: 原文单数代词和动词把以色列视为一个集体；汉语若直用“他”容易被误解为某个男性个体，因此正文传达其集合所指，并以脚注说明形式。
- issue: וַיָּקֻצוּ所表达的反应
  choice: 又惧怕又厌恶
  alternative: 惧怕；厌恶；因……而苦恼
  rationale: 词义范围及上下文允许恐惧与嫌恶两方面。并列表达保留原文的语义张力，不把埃及人的反应单一化。
- issue: בְּנֵי יִשְׂרָאֵל的译法
  choice: 以色列人
  alternative: 以色列的众子；以色列的子孙
  rationale: 此处是指整个族群的惯用表达，并非仅强调男性后裔；“以色列人”在现代汉语中最自然准确。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“越是……就越……”清楚再现原文的比例递进；分号呈现压迫无效之后埃及人反应的转折。正文显明承接上文的主语“埃及人”，避免汉语中主语含混。
