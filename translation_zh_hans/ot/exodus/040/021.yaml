  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他把约柜带进帐幕，挂上遮隔的幔子[a]，用幔子遮隔见证柜[b]，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“作遮隔用的幔子”。希伯来语同时表达这是一幅幔子，以及它遮蔽、隔开的作用。
    reason: lexical_alternative
  - marker: b
    text: 或译“把见证柜隔在幔子后面”。这里的希伯来语强调借幔子遮蔽、隔开见证柜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 抬进
  rationale: 使役式在这里表示摩西使约柜进入帐幕；结合约柜由人抬运的语境，“抬进”比泛指的“带进”更自然具体。
- source_word: הָאָרֹן
  choice: 约柜
  rationale: 在出埃及记的礼仪语境中，此词特指神圣的柜；“约柜”是现代中文中明确而通行的称呼。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 此词在本书特指可移动的圣所；“帐幕”简洁、庄重，并符合中文圣经惯用表达。
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: 遮掩的幔子
  rationale: פָּרֹכֶת 指内层幔子，הַמָּסָךְ 突出其遮隔功能；此译法兼顾实体和用途，也与后面的“遮住”保留词义呼应。
- source_word: וַיָּשֶׂם
  choice: 挂上
  rationale: 该动词本义宽泛，可指放置；在安装幔子的具体语境中，“挂上”是自然准确的中文表达。
- source_word: וַיָּסֶךְ עַל
  choice: 把……遮住
  rationale: 动词表达借幔子遮蔽、隔开的动作；“遮住”保留核心意义，同时避免误解为把幔子直接覆盖在柜顶上。
- source_word: אֲרוֹן הָעֵדוּת
  choice: 法柜
  rationale: הָעֵדוּת 在出埃及记中指作为盟约见证的法版；“法柜”是简洁的传统称谓，又与本节前面的“约柜”形成可理解的指称对应。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: “正如”突出摩西的行动与神命令完全相符；中文句式自然保留本书反复出现的顺服公式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常用音译呈现四字神名，保留其专名性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神专名的性质，不以称号代替，也不采用较晚形成的混合读音。
- issue: אֲרוֹן הָעֵדוּת 的理解
  choice: 法柜
  alternative: 见证柜；约版柜
  rationale: “法柜”在中文语境中自然指盛放法版的约柜，同时避免在正文中加入“盟约文书”等解释性扩展；其见证含义可由整体叙事说明。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“遮掩—遮住”有意保留原文名词与动词之间的语义呼应；脚注说明空间关系的另一种自然表达。
