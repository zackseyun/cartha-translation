  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH；也可音译为“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事形式推进事件，并引出上帝的话；现代汉语用“对……说”最自然，也符合这一常见公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 יהוה；采用现代中文圣经读者熟悉的专名译法“耶和华”，不以称号替代。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象；“对摩西”是自然准确的现代汉语表达。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式构成希伯来语标准引语公式。汉语若直译为“说道”会与前面的言说动词重复，因此合并在“对摩西说”中表达。
- source_word: וַ
  choice: 不另译
  rationale: 此处主要承担连续叙事功能；本节直接承接前文时，现代汉语无需机械添加“然后”或“于是”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，而非“主”这一称号。“耶和华”是现代中文传统中最广为人知的专名形式；“雅威”更接近学界常见的拟音，但原始读音不能完全确定。本节正文采用“耶和华”，不将神名改译为称号。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来语“讲话……说”的公式在中文中压缩为“对摩西说”，避免生硬重复；冒号自然引出下一节的直接引语。
