base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/004.yaml
  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: zh_hans
  text: 你要把桌子搬进来，摆好桌上的陈设；再把灯台搬进来，安放好灯盏[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“点亮灯盏”。这里的希伯来语动词字面意思是“使上升”，可指安放灯盏，也可指使灯焰升起。
    reason: 保留希伯来语动词在会幕安装与点灯之间的词义可能性。
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: 搬进来
  rationale: 使役形态在会幕布置的语境中表示把器具带入帐幕；“搬进来”自然表达大型陈设被移入的动作。
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 原文仅称“桌子”，本节没有明说陈设饼，因此不把上下文中的具体名称加入正文。
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: 摆好桌上的陈设
  rationale: 动词与同根名词构成强调有序摆设的表达，所指是桌上按规定陈列的物品；此译避免生硬重复，也不把物品具体限定为原文未明说的陈设饼。
- source_word: הַמְּנֹרָה
  choice: 灯台
  rationale: 这是该会幕器具的通行现代汉语名称，比音译更直接传达普通名词的含义。
- source_word: וְהַעֲלֵיתָ
  choice: 安放好
  rationale: 该使役动词字面有“使上升”之意，与灯盏连用时既可涉及把灯盏装设妥当，也可指使火焰升起、即点灯；会幕安装语境支持正文采用“安放好”，并以脚注保留另一理解。
- source_word: נֵרֹתֶיהָ
  choice: 灯盏
  rationale: 指灯台上的各个盛油发光器具；“灯盏”既清楚表达实体，也符合庄重的会幕语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。“桌上的陈设”保留原文对所摆物品的概括性；脚注标记紧跟实际存在词义歧义的“灯盏”短语。
