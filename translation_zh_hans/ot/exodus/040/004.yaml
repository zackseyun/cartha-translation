  terminology: “桌子”“灯台”“灯盏”准确且符合现代汉语圣经语体；“桌上的陈设”没有把原文未明说的物品限定为陈设饼。术语没有引入额外的教派性解释。脚注标记紧随“灯盏”，位置合宜。
