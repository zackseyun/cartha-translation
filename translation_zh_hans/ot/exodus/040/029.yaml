base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他把燔祭坛安放在会幕的入口处；会幕就是相会的帐幕。他又在坛上献上燔祭和素祭，正如雅威吩咐摩西的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: 该组合词按祭坛的主要献祭用途命名；“燔祭坛”是简洁、明确且已有传统基础的中文礼仪用语。
- source_word: שָׂם
  choice: 安放
  rationale: 本节描述会幕设施按规定就位；“安放”既体现设置动作，也符合庄重的叙事语体。
- source_word: פֶּתַח
  choice: 入口处
  rationale: 表示帐幕的开口或入口；“入口处”自然传达其空间位置，不额外限定为门内或门外。
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: 会幕，就是会见帐幕
  rationale: 原文连续使用 מִשְׁכָּן 与 אֹהֶל מוֹעֵד 两个称谓。以解释性同位结构保留两者，避免把其中一个称谓省略；“会见帐幕”也较直接体现 מוֹעֵד 在此处所指的约定会见。
- source_word: וַיַּעַל עָלָיו
  choice: 又在坛上献上
  rationale: עלה 在献祭语境中表示把祭物献上；“在坛上献上”既传达礼仪动作，也保留 עָלָיו 所指的地点。
- source_word: הָעֹלָה
  choice: 燔祭
  rationale: 这是 עֹלָה 的标准中文祭祀术语，表达祭物全然焚烧献上的类别。
- source_word: הַמִּנְחָה
  choice: 素祭
  rationale: 在祭司礼仪语境中指以细面等为主的供献；“素祭”是简明且通行的中文圣经术语，比泛称“礼物”更准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译保留四字神名，而不以称号替代；“雅威”是现代普通话中清楚、常见的音译形式。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: “正如”突出摩西的行动完全依照先前命令；中文结构自然表达命令在先、执行在后的关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用神的专名。采用音译“雅威”保留其专名性质，不以“上主”这一称号替代；也不采用源于混合读法传统的“耶和华”。
- issue: מִשְׁכַּן אֹהֶל מוֹעֵד 两个帐幕称谓之间的关系
  choice: 会幕，就是会见帐幕
  alternative: 会见帐幕的会幕
  rationale: 希伯来语名词串的句法关系可理解为紧密组合，也可视为两个相关称谓并列说明。中文采用同位解释，保留两个名称并避免生硬、含混的领属表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留“燔祭”“素祭”“会幕”等必要的礼仪术语；句式简洁，并以“他”承接上下文中的摩西。
