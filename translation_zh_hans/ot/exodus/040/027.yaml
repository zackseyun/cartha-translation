  yaml_path: translation/ot/exodus/040/027.yaml
  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他在坛上焚烧芬芳的香[a]，正如耶和华所吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用香料制成的香”或“芳香的香”；希伯来语指用芳香香料配制的香。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: 焚烧
  rationale: 使役形在祭祀语境中表示使祭物焚烧、烟气上升；与“香”搭配时，“焚烧”自然、庄重，并保留礼仪含义。
- source_word: עָלָיו
  choice: 在坛上
  rationale: 阳性单数代词按上文指香坛。汉语若直译为“在它上面”不够自然，因此明示语境中的所指“坛”。
- source_word: קְטֹרֶת סַמִּים
  choice: 芬芳的香
  rationale: 该词组指由芳香香料制成的香。“芬芳的香”符合现代汉语习惯，同时以脚注保留“香料制成的香”等理解。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表达行动完全依照先前命令，语气自然且保留比较、符合之意。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 在神向摩西发布命令的语境中，“吩咐”是自然、庄重的常用译法；汉语无需用时态形式标出命令发生在先。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神名音译，不以称号“主”替代原文专名。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文通行的人名译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，应以专名而非“主”这一称号表达；“耶和华”是普通中文读者最熟悉、最通行的音译，同时不改变经文的神学指称。
- issue: 焚香者的身份
  choice: 保留为“他”
  alternative: 明确译作“摩西”
  rationale: 希伯来原文仅以动词的第三人称阳性单数形式标示主语；虽可由上下文判断为摩西，本节不应把推断直接写入正文，以保留原文表达。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“在坛上”明确代词的上下文所指；“正如……的”保留原文顺序和顺服既有命令的含义。
