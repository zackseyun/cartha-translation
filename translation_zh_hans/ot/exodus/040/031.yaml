  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: zh_hans
  text: 摩西、亚伦和亚伦的儿子们用盆里的水洗手洗脚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从它”，指前文的盆；也可译为“从盆中洗手洗脚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: 洗
  rationale: 该词是רחץ的Qal叙事形式，表示承接上文发生的洗濯行动；中文用“洗”自然表达已发生的动作，不在本节擅自加入反复性。
- source_word: מִמֶּנּוּ
  choice: 从盆里取水
  rationale: מן加第三人称阳性单数后缀，直义为“从它”，所指是上节的盆。中文若仅说“从盆里洗”不够自然，因此译作“从盆里取水”，既保留水的来源，又明确实际动作。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: וְאַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行的人名译法，并在并列结构中自然表达连接关系。
- source_word: וּבָנָיו
  choice: 和亚伦的儿子们
  rationale: בנים在祭司语境中指儿子；阳性单数后缀在语法和语境上指最近的单数人物亚伦。为避免中文“他的”可能误指摩西，重复“亚伦”。
- source_word: אֶת יְדֵיהֶם
  choice: 手
  rationale: 宾格标记后的复数名词带第三人称复数后缀；中文在已有复数主语时通常无需再说“他们的”。
- source_word: וְאֶת רַגְלֵיהֶם
  choice: 脚
  rationale: 与“手”构成并列宾语；中文“洗手洗脚”简洁自然，并完整保留原文指定的两个身体部位。
