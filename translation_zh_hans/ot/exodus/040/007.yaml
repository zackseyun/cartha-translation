  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: zh_hans
  text: 要把洗濯盆[a]放在会幕和祭坛之间，并在盆里盛上水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洗濯盆”也可译作“洗盆”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: 要把……放在
  rationale: נתן含义宽泛，可指“给、放、安置”。这里是按指定位置安放会幕器具，译为“要把……放在”自然、准确，也保留命令语气。
- source_word: הַכִּיֹּר
  choice: 洗濯盆
  rationale: כִּיּוֹר指会幕礼仪中供洗濯使用的盆。“洗濯盆”既说明用途，又保持庄重，并能与上下文中的器具名称一致。
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: 在会幕和祭坛之间
  rationale: בֵּין...וּבֵין明确表示两个对象之间的位置。“会幕”是现代中文圣经语境中对אֹהֶל מוֹעֵד简明而通行的称法；“祭坛”直接对应מִזְבֵּחַ。
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: 并在盆里盛上水
  rationale: 希伯来文直译为“并在那里放水”。שָׁם指向刚指定的位置和器具；现代中文若说“在那里放水”容易被理解为把水倒在地上，因此依语境明确为“在盆里盛上水”，传达实际动作而不改变所指。
theological_decisions: []
