id: EXO.40.35
reference: Exodus 40:35
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: zh_hans
  text: 摩西不能进入会幕，因为云彩停在会幕上[a]，雅威的荣耀充满了帐幕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “停”也可译作“居住”或“停留”；希伯来语动词兼有居住、落定或停驻的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא יָכֹל
  choice: 不能
  rationale: 希伯来语结构直接表达摩西没有能力进入；“不能”在现代汉语中自然、准确，无须机械保留句首连接词。
- source_word: לָ/בוֹא
  choice: 进入
  rationale: 在进入建筑物的语境中，“进入”准确而简洁。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所称谓在中文圣经传统中通行且简洁的译法，并与本节后半的“帐幕”有所区分。
- source_word: כִּי
  choice: 因为
  rationale: 此处明确引出摩西不能进入的原因。
- source_word: שָׁכַן
  choice: 停
  rationale: 在云彩的具体意象中，该动词表示落定、停驻；“停在”自然呈现眼前情景，同时以脚注保留“居住”等词义联系。
- source_word: עָלָיו
  choice: 在会幕上
  rationale: 希伯来语直译为“在它上面”；中文重复“会幕”可避免代词指向含混，并清楚表达云彩停驻的位置。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: 保留定指语境中的那一朵神圣云彩；中文“云彩”符合叙事文体。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: 保留构造关系及“荣耀”的神学分量，并将四字神名音译为“雅威”。
- source_word: מָלֵא
  choice: 充满了
  rationale: 表达完成并形成当前状态的事件，符合希伯来语完成式在此叙事语境中的作用。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: “帐幕”是 מִשְׁכָּן 在出埃及记圣所语境中的通行译法，也保留其与“会幕”这一称谓在原文用词上的区别。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常重构的读音，并保留这是专名而非头衔。
- issue: שָׁכַן 与神居住主题的关系
  choice: 正文译作“停”，脚注说明“居住、停留”的可能含义
  alternative: 住在
  rationale: 本节直接描绘云彩停驻在会幕上的场景；正文采用具体自然的表达，不把后来更充分展开的“居住”神学预先强加于此，同时由脚注保留该词真实的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“会幕”与“帐幕”分别对应原文两个不同称谓；句首 וְ 未机械译成“并且”，以符合自然汉语叙事。脚注标记紧跟其所说明的动词短语。
