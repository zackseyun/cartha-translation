base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: zh_hans
  text: 要把见证之柜[a]安放在那里，并用幔子[b]把见证之柜遮隔起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见证之柜”原文直译为“见证的柜”。有些译本按传统译作“约柜”。
    reason: 保留原文“见证”的措辞，并提示传统称谓。
  - marker: b
    text: “幔子”也可译作“帘子”或“帷幕”；指帐幕内用来遮隔见证之柜的内层帘幕。
    reason: 说明 פָּרֹכֶת 的传统译法及其空间功能。
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 要……安放
  rationale: 该形式在连续指示中表达对摩西的命令；“要……安放”既自然，也保留庄重的指令语气。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留原文的地点指示，不把上下文所指的帐幕明说出来。
- source_word: אֲרוֹן הָעֵדוּת
  choice: 法柜
  rationale: עֵדוּת在此指作为法定见证的约版；“法柜”是简洁且易懂的中文圣经术语，但容易被理解为泛指，因此用脚注说明其字面结构与“约柜”的传统译法。
- source_word: וְסַכֹּתָ עַל הָאָרֹן
  choice: 把法柜遮隔起来
  rationale: סכך在此不是把布盖在柜顶上，而是借幔子形成遮挡、隔开内外；“遮隔起来”准确表达空间功能。
- source_word: הַפָּרֹכֶת
  choice: 幔子
  rationale: פָּרֹכֶת特指帐幕内部隔开至圣所的帘幕；“幔子”庄重、通顺，并保留“帘幕”作为脚注中的现代近义说法。
theological_decisions:
- issue: אֲרוֹן הָעֵדוּת的称谓
  choice: 法柜
  alternative: 约柜；见证柜
  rationale: 原文是“见证/法版之柜”，并非直接写“约柜”。正文采用中文中能指向法版的“法柜”，脚注保留原文字面信息，避免无声地把“见证”改成“约”。
- issue: פָּרֹכֶת的译法
  choice: 幔子
  alternative: 帘幕；帷幕
  rationale: 此词指帐幕内部遮隔法柜的帘幕。“幔子”兼顾可懂性与礼仪语境，脚注说明其具体功能。
translation_notes:
  register: 采用现代、庄重而易懂的指令语体。“遮隔起来”避免使读者误以为幔子直接覆盖在法柜上。所有脚注标记均置于正文相应词语之后。
