  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: zh_hans
  text: 他把桌子安放在会幕里，位于帐幕的北侧，在幔子外面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“帘子”。希伯来语 פָּרֹכֶת 指遮隔至圣所的内层悬帘。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 安放
  rationale: נתן在布置器物的语境中表示“放置、安放”；“安放”自然庄重，也准确传达有意将桌子置于指定位置的意思。
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 原文这里只说“这桌子”，没有明说陈设饼或其他用途，因此正文不补入上下文中的具体名称。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是 אֹהֶל מוֹעֵד 在出埃及记圣所语境中的通行译名，简洁且便于现代读者理解。
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: 位于帐幕的北侧
  rationale: יֶרֶךְ在空间描述中指一侧或侧边，צָפֹנָה指向北方；合译为“北侧”清楚呈现其方位。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן字面与“居所”有关，但在此指圣所建筑；译作“帐幕”既符合本段语境，也与前面的专名“会幕”保持适度区分。
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: 在幔子外面
  rationale: מִחוּץ表示在某物之外；פָּרֹכֶת是隔开至圣所的内层悬挂遮隔物。“幔子”保留圣所陈设语境中的庄重感，同时不把其功能过度解释进正文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“会幕”对应 אֹהֶל מוֹעֵד，“帐幕”对应 מִשְׁכָּן，以免同一句中两个不同的希伯来称谓完全合并；不在正文补入桌子的用途。
