base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: zh_hans
  text: 他在帐幕和祭坛四周搭建了院子，并在院子的门口挂上帘子[a]。这样，摩西完成了这项工程。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帘子”或译“遮帘”或“帷幔”；原文指院子入口处的织物遮挡物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם אֶת הֶחָצֵר
  choice: 把院子围起来
  rationale: 原文直译为“立起院子”；这里指搭建围成院子的设施。译作“把院子围起来”既符合现代汉语习惯，也保留了施工动作及院子的空间概念。
- source_word: סָבִיב לַמִּשְׁכָּן וְלַמִּזְבֵּחַ
  choice: 在帐幕和祭坛四周
  rationale: 准确表达院子环绕帐幕和祭坛的位置关系；“四周”自然传达סָבִיב的环绕含义。
- source_word: מִשְׁכָּן
  choice: 帐幕
  rationale: “帐幕”是《出埃及记》中该圣所设施通行而清楚的中文术语，能体现其可搭建的居所性质。
- source_word: מִזְבֵּחַ
  choice: 祭坛
  rationale: 采用现代中文圣经语境中明确、通行的礼仪用语。
- source_word: וַיִּתֵּן אֶת מָסַךְ שַׁעַר הֶחָצֵר
  choice: 并挂上院门的帘子
  rationale: נתן在施工语境中指安置，中文用“挂上”能自然说明纺织遮挡物的安装方式；מָסַךְ译为“帘子”，通俗且不与内层幔子作过度术语化区分。
- source_word: וַיְכַל מֹשֶׁה אֶת הַמְּלָאכָה
  choice: 这样，摩西完成了全部工程
  rationale: וַיְכַל表示完成，מְלָאכָה概括整个建造工作；“全部工程”自然体现本节作为建造叙事总结的功能。
theological_decisions: []
translation_notes:
  register: 采用庄重而浅明的现代标准汉语。“把院子围起来”避免生硬直译“立起院子”，同时不额外指定原文此处未明说的具体构件。句末用“全部工程”清楚收束会幕建造叙事。
