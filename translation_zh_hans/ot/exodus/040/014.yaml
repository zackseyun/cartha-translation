  text: וְ/אֶת בָּנָ֖י/ו תַּקְרִ֑יב וְ/הִלְבַּשְׁתָּ֥ אֹתָ֖/ם כֻּתֳּנֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/014.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: zh_hans
  text: 也要使他的儿子们近前来，给他们穿上长衣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “长衣”也可译作“内袍”。原文指穿在身上的长身衣服，本节没有明说衣料。
    reason: 说明服饰词的可选译法，并避免把上下文可能暗示的“细麻”加入本节正文。
lexical_decisions:
- source_word: וְאֶת
  choice: 也要
  rationale: 连词与宾格标记承接上一项指示，并把焦点转到亚伦的儿子们；汉语不单独翻译宾格标记，用“也要”自然表达指令的延续。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: 该词明确指男性后代；依上下文，代词所指为亚伦。保留“他的”，不把经文未明说的名字加入正文。
- source_word: תַּקְרִיב
  choice: 使……近前来
  rationale: קרב的使役式意为使人靠近、带到近前，在祭司礼仪语境中可含正式引到圣职前的意味。“使……近前来”既保留使役结构和礼仪色彩，也不把动作过度解释为授职。
- source_word: וְהִלְבַּשְׁתָּ
  choice: 给……穿上
  rationale: 该使役动词表示使某人穿衣；“给他们穿上”是现代汉语中自然、清楚的表达。
- source_word: אֹתָם
  choice: 他们
  rationale: 宾格代词回指前面的“他的儿子们”。
- source_word: כֻּתֳּנֹת
  choice: 长衣
  rationale: 该名词指贴身穿着的长身衣服，常见于祭司服饰。“长衣”比音译或古雅称谓更易懂；本节没有明说质料，因此不增译“细麻”。
theological_decisions:
- issue: קרב在祭司礼仪中的含义
  choice: 使……近前来
  alternative: 把……带上前来；把……呈到面前
  rationale: 上下文关乎亚伦儿子们的祭司承接礼，但希伯来文本只明确表达“使靠近”。译文保留其正式、礼仪性的意味，不直接增译为“使他们就任圣职”等解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“近前来”保留祭司礼仪语境中的正式感；句式简洁，与连续颁布指示的上下文相称。脚注标记[a]已在正文对应出现。
