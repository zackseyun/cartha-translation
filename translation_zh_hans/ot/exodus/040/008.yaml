  text: And you shall set up the courtyard all around[a], and put up the screen for the gate of the courtyard.
translation:
  language: zh_hans
  text: 你要在四周立起院子，并挂上院门的帘子[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “帘子”或译“帘幕”，指挂在院子入口处的悬挂物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 你要……设立
  rationale: שׂים的基本义是“放置、安置、设立”。这里谈会幕院子的布置，用“设立”既符合施工语境，也保留原文以“院子”为宾语的表达。
- source_word: הֶחָצֵר
  choice: 院子
  rationale: חָצֵר在此指会幕周围围起的院落。“院子”是现代汉语中清楚、自然的对应词。
- source_word: סָבִיב
  choice: 在四周
  rationale: סָבִיב表示环绕四围；“在四周”自然传达其全面围绕的空间意义。
- source_word: וְנָתַתָּ
  choice: 并挂上
  rationale: נתן通常表示“放、安置”；其宾语在此是入口处的悬帘，因此“挂上”按具体动作作自然表达，没有改变所指。
- source_word: מָסַךְ
  choice: 帘子
  rationale: מָסָךְ在会幕语境中指挂在入口处、起遮隔作用的织物。“帘子”准确而通俗；“遮帘”作为较技术性的备选译法列于脚注。
- source_word: שַׁעַר הֶחָצֵר
  choice: 院门
  rationale: 该结构直译为“院子的门”。现代汉语用“院门”简洁自然，也清楚指明这是院子的入口。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“设立院子”保留希伯来文以整个院子为宾语的概括说法；“挂上”则依入口帘幕的实际安装动作作自然表达。
