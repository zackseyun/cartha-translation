base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: zh_hans
  text: 在他们一切行程中，每当云彩从帐幕上方升起，以色列人[a]就起程。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”；也可译“以色列子孙”。
    reason: 保留 בְּנֵי יִשְׂרָאֵל 的字面形式及传统译法。
lexical_decisions:
- source_word: וּ/בְ/הֵעָל֤וֹת
  choice: 每当……升起
  rationale: 介词 בְּ 加不定式构造引出时间从句；结合未完成式所表达的惯常行动，译作“每当”体现反复发生的情形。עלה 在这里指云彩上升，无须译成被动。
- source_word: הֶֽ/עָנָן֙
  choice: 云彩
  rationale: 指上下文中已经明确、象征上帝临在的那片云；中文在明确语境中不必另加定冠词。
- source_word: מֵ/עַ֣ל
  choice: 从……上方
  rationale: 表达从位于帐幕上面的地方离开，保留空间关系。
- source_word: הַ/מִּשְׁכָּ֔ן
  choice: 帐幕
  rationale: מִשְׁכָּן 在《出埃及记》中指可移动的圣所；“帐幕”是准确、简洁且通行的中文译法。
- source_word: יִסְע֖וּ
  choice: 就起程
  rationale: נסע 在此指拔营出发；“起程”自然表达启行之意，并与“每当……就……”共同体现惯常性。
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，但这是全体百姓的固定群体称谓；现代中文以“以色列人”表达最自然，并用脚注保留原文形式。
- source_word: בְּ/כֹ֖ל מַסְעֵי/הֶֽם
  choice: 继续他们各段的行程
  rationale: מַסָּע 可指行程或行程中的一站、一个阶段；“各段的行程”传达 בְּכֹל 的整体及分段意味，“继续”使该短语与起程动作在中文中衔接自然。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 正文译作“以色列人”，脚注说明字面形式
  alternative: 以色列的众子／以色列子孙
  rationale: 该短语在这里指全体以色列百姓，而非只强调男性后裔。正文采用现代中文自然的群体称谓，同时以脚注保存希伯来文的阳性复数形式及其可能译法，避免赋予性别形式额外的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“每当……就……”清楚呈现反复发生的模式；“帐幕”“起程”保持《出埃及记》语境中的传统准确性。
