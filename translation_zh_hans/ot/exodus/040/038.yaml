  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: zh_hans
  text: 原来，白天雅威的云彩在帐幕上方；夜间，那里有火[a]。以色列全家在他们一切行程中都看得见这景象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那里”所指可能是云彩，也可能与帐幕有关；原文没有明确说明。也可译作“其上有火”。
    reason: 代词指代及介词含义存在歧义
lexical_decisions:
- source_word: כִּי
  choice: 原来
  rationale: 这里承接并解释前文，作总结说明；“原来”比表示直接因果的“因为”更符合本节的篇章功能。
- source_word: עֲנַן יְהוָה
  choice: 雅威的云彩
  rationale: 保留原文的所属关系，表明这云彩与雅威的临在相关，同时不作超出原文的解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留经文所用的专名。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中对以色列便携式圣所的通行、简明译法。
- source_word: יוֹמָם
  choice: 白天
  rationale: 自然表达时间，并与下文“夜间”形成清楚的平行。
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: 夜间，其中有火
  rationale: 用无时态标记的汉语陈述表达持续、惯常的情形；“其中”保留代词所指可能存在的歧义。
- source_word: לְעֵינֵי
  choice: 亲眼看见
  rationale: 以自然现代汉语表达“在……眼前、为……所见”的具体视觉含义。
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: 以色列全家
  rationale: 保留“家”这一群体性、盟约性称谓，而不简化为“全以色列人”。
- source_word: בְּכָל מַסְעֵיהֶם
  choice: 在他们一切行程中
  rationale: מַסָּע可指旅程或行进的阶段；此译文自然表达整个旷野行程中持续如此。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”保留其专名性质，而不是以称号替代。
- issue: בּוֹ（其中）所指为何
  choice: 正文保留代词，不明确限定
  alternative: 明确译为“云中”或“帐幕中／帐幕上”
  rationale: 阳性单数后缀在语法上可能回指“云彩”或“帐幕”；正文不替原文消除这一真实歧义，并用脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“白天……夜间……”保留原文平行结构；“亲眼看见”避免生硬直译“在眼前”，同时保持可见性的重点。
