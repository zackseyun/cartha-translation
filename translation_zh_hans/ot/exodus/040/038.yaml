revisions:
- from: 原来，白天雅威的云彩在帐幕上方；夜间，其中有火[a]。以色列全家在他们一切行程中都亲眼看见。
  to: 原来，白天雅威的云彩在帐幕上方；夜间，那里有火[a]。以色列全家在他们一切行程中都看得见这景象。
  rationale: 修订只改善现代汉语的衔接与持续可见性的表达。“那里”不把原文的代词所指限定为云彩或帐幕，脚注继续说明这一歧义；其余关键术语和句子结构均予保留。
