base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: zh_hans
  text: 你要膏立他们，正如你膏立他们的父亲一样，使他们作祭司事奉我。他们所受的膏立，要使他们的祭司职分世世代代长存。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“永远的祭司职分”。希伯来语在盟约和制度语境中可指历代持续的延续。
    reason: 说明עוֹלָם可译为“永远”，并说明其与“世世代代”相连时所表达的跨代持久性。
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: 你要膏
  rationale: 该形式在连续的指示语境中具有将来式命令意味；“你要膏”自然保留其指令语气。
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: 正如你膏他们的父亲一样
  rationale: “正如……一样”明确表达儿子们受膏与其父亚伦受膏之间的对应关系，同时保留原文的单数“父亲”。
- source_word: וְכִהֲנוּ לִי
  choice: 使他们作祭司事奉我
  rationale: כהן的动词形式表示履行祭司职务；“作祭司事奉我”既清楚表达其礼仪职能，也保留事奉对象是上帝。
- source_word: מָשְׁחָתָם
  choice: 他们所受的膏立
  rationale: 此处指借着膏抹而有的设立或承接圣职，不必限定为膏油本身；“所受的膏立”在现代中文中较清楚。
- source_word: לִכְהֻנַּת עוֹלָם
  choice: 永远的祭司职分
  rationale: כְּהֻנָּה指祭司身份或职分；עוֹלָם在盟约和制度语境中可表示持续长久。“永远的祭司职分”保留原文较强的持续性表达。
- source_word: לְדֹרֹתָם
  choice: 世世代代
  rationale: 表达该祭司职分在亚伦后裔的 successive generations 中延续；“世世代代”自然且准确。
theological_decisions:
- issue: 祭司职分中עוֹלָם所表达的持续时间
  choice: 永远的祭司职分
  alternative: 长久的祭司职分
  rationale: 原词可在盟约语境中表示跨越世代的持久延续，而不必预先断定为抽象意义上的绝对无终。“永远”保留较强的原文措辞，脚注则说明其语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“膏立”兼顾膏抹动作及其设立祭司的作用；脚注标记置于“永远的祭司职分”之后，以准确对应注释对象。
