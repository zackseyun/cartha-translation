  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: zh_hans
  text: 他又把金坛安放在会幕内，幔子[a]前面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帘子”。希伯来词指会幕内部作为隔断的帘幕。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 他又把……安放
  rationale: 该叙事时态承接前文，表示接续发生的动作；“又”体现叙事推进，“安放”符合慎重陈设圣所器具的语境。
- source_word: מִזְבַּח הַזָּהָב
  choice: 金坛
  rationale: 希伯来语直译为“金的坛”；“金坛”是简洁自然的现代汉语，也明确指出材质。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕内
  rationale: “会幕”是 אֹהֶל מוֹעֵד 在汉语圣经语境中的准确、通行称谓；“内”清楚表达坛位于帐幕里面。
- source_word: לִפְנֵי
  choice: 前面
  rationale: 此处表达金坛相对于幔子的空间位置；“前面”比文言色彩较重的“之前”更自然明确。
- source_word: הַפָּרֹכֶת
  choice: 幔子
  rationale: 该词专指会幕内部作为隔断的帘幕；“幔子”保留圣所术语的传统关联，同时仍为现代读者所能理解。
theological_decisions:
- issue: הַפָּרֹכֶת 的圣所器物术语
  choice: 幔子
  alternative: 帘子
  rationale: “幔子”既表达实际的隔断帘幕，也保留该物件在后续经文中的互文分量，但不在译文中添加原文没有的神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“他又”承接上下文的连续陈设动作；“安放”体现器具被有意置于指定位置。脚注标记紧接其所说明的“幔子”，避免误指“会幕”。
