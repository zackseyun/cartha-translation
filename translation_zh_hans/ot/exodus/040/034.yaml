id: EXO.40.34
reference: Exodus 40:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: zh_hans
  text: 这时，云彩遮盖了会幕，雅威[a]的荣耀充满了帐幕。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה的音译，传统译作“耶和华”。
    reason: 说明神名的原文形式及中文传统译法。
lexical_decisions:
- source_word: וַיְכַס
  choice: 这时……遮盖了
  rationale: כסה的基本义是“遮盖”；句首的叙事性וַ推进事件，译为“这时”，自然承接上文。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: 原文带定冠词，指《出埃及记》叙事中已经出现、象征神临在的那片云；中文在明确语境中无需另加指示词。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该礼仪用语在现代中文圣经语境中的通行译法，表达指定的相会之所，并与本节后半的“帐幕”有所区别。
- source_word: כְבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: כָּבוֹד在此指神彰显出来的威荣与临在；“荣耀”准确、庄重且通俗。属格结构按中文习惯译为“雅威的荣耀”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用希伯来神名יהוה的现代常见音译，保留其作为专名的性质，而不以“主”等称号替代。
- source_word: מָלֵא
  choice: 充满了
  rationale: 此处动词描述荣耀遍满并占据帐幕；“充满了”准确表达其及物用法。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן是《出埃及记》中圣所结构的专门称呼；“帐幕”既保留其可移动居所的具体意象，也避免与前面的אֹהֶל מוֹעֵד完全混同。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的专名יהוה。“雅威”较贴近学界通常重构的读音，并保留专名性质；脚注同时说明中文传统译名，以免读者误解。
- issue: כְבוֹד所表达的神圣临在
  choice: 荣耀
  alternative: 荣光；威荣
  rationale: “荣耀”保留该词兼具威严、荣美和可彰显之临在的语义张力，不把它窄化为单纯的光辉或抽象名誉。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“会幕”与“帐幕”分别对应אֹהֶל מוֹעֵד和מִשְׁכָּן，尽量保留原文在同一节中使用两个相关称谓的特点。
