base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: zh_hans
  text: 要把烧香用的金坛安放在见证之柜[a]前面，并把帘子挂在帐幕的入口处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统常译“约柜”；希伯来文直译为“见证之柜”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 要把……安放
  rationale: נתן在此指把圣所器具放置到指定位置；“安放”自然庄重，也适合器具陈设的语境。
- source_word: מִזְבַּח הַזָּהָב
  choice: 金坛
  rationale: 原文直指由金或包金而得名的坛；“金坛”是简洁自然的现代汉语表达。
- source_word: לִקְטֹרֶת
  choice: 烧香用的
  rationale: ל加קְטֹרֶת表达用途；译为“烧香用的”明确保留目的关系，而不只是将其作为固定名称。
- source_word: לִפְנֵי
  choice: 在……前
  rationale: 保留原文的空间方位意义，同时不进一步解释坛与柜之间尚有幔子相隔的布局。
- source_word: אֲרוֹן הָעֵדֻת
  choice: 见证柜
  rationale: עֵדֻת是“见证”，不是本节中未出现的“约”；אֲרוֹן在此为盛放见证版的柜。
- source_word: וְשַׂמְתָּ
  choice: 把……挂上
  rationale: שׂים基本义为放置；因宾语是入口帘子，汉语按实际设置方式译作“挂上”更自然。
- source_word: מָסַךְ הַפֶּתַח
  choice: 入口的帘子
  rationale: מָסַךְ在会幕语境中指遮蔽入口的悬帘；“帘子”清楚易懂，并与至圣所的幔子用语有所区别。
- source_word: לַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן字面关联“居所”，在本段特指以色列敬拜中的帐幕；“帐幕”比音译或传统专名更透明。
theological_decisions:
- issue: עֵדֻת在柜名称中的译法
  choice: 见证柜
  alternative: 约柜
  rationale: 本节原文明确使用עֵדֻת（见证），而非בְּרִית（约）。正文保留原词的见证含义，脚注说明传统称法，避免以熟悉术语替换原文措辞。
translation_notes:
  register: 采用现代、庄重而清楚的指令语体。以“要……”承接上下文中的第二人称单数命令，不在中文中强加性别；“烧香用的金坛”保留用途结构，“挂上”则按帘子的具体设置方式作自然表达。
