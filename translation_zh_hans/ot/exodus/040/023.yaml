  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他在桌上把饼按次序摆列在雅威面前[a]，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“饼的陈列”或“按次序摆列的饼”；相关礼仪中的饼传统上常称为“陈设饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: 摆好
  rationale: 动词 ערך 表示按一定次序摆列、安排；“摆好”在现代汉语中自然，也能表达礼仪性陈设已经妥当。
- source_word: עָלָיו
  choice: 在上面
  rationale: 代词所指是上一节的桌子；译作“在上面”保留原文的代词衔接，不在本节重复补出“桌子”。
- source_word: עֵרֶךְ לֶחֶם
  choice: 把饼按次序摆好
  rationale: 该短语直指饼的有序摆列，并非本节所没有的固定用语 לֶחֶם הַפָּנִים；此译兼顾具体动作和摆列次序。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留希伯来礼仪语境中“在……面前”的空间与临在含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威所吩咐摩西的
  rationale: “正如”突出摩西的执行与先前命令完全相符；“所吩咐”自然表达已经颁下的命令。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留上帝向以色列启示的专名，同时避免用称号取代。
- issue: עֵרֶךְ לֶחֶם 是否直接译作传统术语“陈设饼”
  choice: 把饼按次序摆好
  alternative: 摆列饼；陈设饼
  rationale: 本节使用的是描述饼之有序摆列的 עֵרֶךְ לֶחֶם，而不是固定短语 לֶחֶם הַפָּנִים；正文保留这一词汇区别，传统译法列入脚注。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在上面”承接上一节的桌子；语序将“在雅威面前”置于主要动作之前，使礼仪场景清楚，同时不把传统术语未经说明地写入正文。
