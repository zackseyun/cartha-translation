  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: zh_hans
  text: 你要把燔祭坛安放在会幕，就是会见的帐幕的入口前。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָתַתָּה
  choice: 你要……安放
  rationale: נתן在布置器物的语境中表示“放置、安放”；“安放”自然地表达按指定位置摆设，也符合本段庄重的指示语体。连接词וְ在连续命令中不必机械译作“并且”。
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: 这是指出献עֹלָה所用祭坛的固定组合；“燔祭坛”是准确、简洁且易于识别的现代中文圣所术语。
- source_word: לִפְנֵי
  choice: ……前
  rationale: לִפְנֵי在此表达具体空间位置，即在入口的前方。
- source_word: פֶּתַח
  choice: 门口
  rationale: פֶּתַח指入口或开口；帐幕语境中“门口”比“入口处”更自然，同时保留明确的空间指向。
- source_word: מִשְׁכַּן
  choice: 帐幕
  rationale: מִשְׁכָּן是出埃及记中圣所结构的专门称谓；译作“帐幕”既保留其可移动居所的形象，也与后面的אֹהֶל מוֹעֵד有所区别。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 该固定名称表示相会之帐棚；“会幕”是简洁、通行且准确的中文译名。
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: 会幕的帐幕
  rationale: 按希伯来语连续名词结构处理为“会幕的帐幕”，使“门口”直接修饰帐幕，并保留מִשְׁכַּן与אֹהֶל מוֹעֵד两个相邻称谓，而不把二者静默合并为单一词项。
