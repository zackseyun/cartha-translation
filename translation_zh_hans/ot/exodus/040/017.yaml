base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: zh_hans
  text: 第二年正月初一，帐幕就立起来了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 该叙事承接形式在本句主要推进叙事；现代汉语以日期短语起句并用“就”承接事件，更自然，也未损失实际信息。
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בַּשָּׁנָה הַשֵּׁנִית
  choice: 第二年正月
  rationale: “正月”是现代汉语中自然、庄重的“第一月”表达；“第二年”保留原文纪年次序。
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: 初一
  rationale: 希伯来语字面为“月的一日”，属于表示每月第一日的日期习语；“初一”是简明自然的汉语对应。
- source_word: הוּקַם
  choice: 立起来了
  rationale: קום的Hophal形式表达被动结果，即帐幕被搭立、竖立；汉语“立起来了”自然呈现这一完成事件，无须使用生硬的显式被动句。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: “帐幕”是中文圣经语境中对以色列可移动圣所的明确且通行称呼，也保留其帐棚式结构的意象。
