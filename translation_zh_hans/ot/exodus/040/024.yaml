  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: zh_hans
  text: 他把灯台安放在会幕里，与桌子相对，在帐幕的南边。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 他把……安放
  rationale: 该叙事动词表示已完成的放置动作；“安放”既自然，又符合有序陈设圣所器具的语境。
- source_word: הַמְּנֹרָה
  choice: 灯台
  rationale: מְנוֹרָה在此指用于圣所的灯台，不只是单独一盏灯；“灯台”清楚表达其器具性质。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: אֹהֶל מוֹעֵד直译为“会见之帐幕”；在现代中文圣经语境中，“会幕”简洁、通行，并表达神与人相会的圣所。
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: 与桌子相对
  rationale: נֹכַח表示空间上位于某物对面、面向某物；“与桌子相对”自然保留这种相对位置关系。
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 原文只说“桌子”，本节没有明说陈设饼，因此不补入解释性名称。
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: 在帐幕的……边
  rationale: יֶרֶךְ本义为“侧面、边”；结合后面的方位词，中文宜合译为“在帐幕的南边”。
- source_word: נֶגְבָּה
  choice: 南边
  rationale: 该方向形式指向南方或南侧；与יֶרֶךְ合译为“南边”最符合现代汉语空间表达。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן指神居住的圣所帐幕；本句前半已有“会幕”，后半用“帐幕”既忠于词义，也保留原文两个不同称谓。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“会幕”与“帐幕”分别对应אֹהֶל מוֹעֵד和מִשְׁכָּן，避免把原文两个称谓完全抹平。נֹכַח的空间含义以“相对”表达，正文无需脚注即可保留其可兼含“面对”的语感。
