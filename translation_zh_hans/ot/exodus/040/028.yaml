  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: zh_hans
  text: 他把帘子安在帐幕的入口处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他安上帐幕门口的门帘。”
    reason: 保留מָסַךְ可译作“门帘”，以及该短语可整体理解为“帐幕门口的帘子”这一自然表达。
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 他把……安在
  rationale: שׂוּם意为“放、安置、设置”。结合入口帘这一对象，“安在”自然表达将帘子设置就位，同时不额外强调原文未明说的悬挂方式。
- source_word: מָסַךְ
  choice: 帘子
  rationale: מָסָךְ在会幕语境中指设于入口的垂帘或遮帘。“帘子”是现代汉语中自然、易懂的表达，也可与通常译作“幔子”的פָּרֹכֶת有所区分。
- source_word: הַפֶּתַח
  choice: 入口处
  rationale: פֶּתַח可指入口、门口或开口；在此用“入口处”准确而自然，并与动词“安在”顺畅搭配。
- source_word: לַמִּשְׁכָּן
  choice: 帐幕的
  rationale: לַמִּשְׁכָּן在此限定入口，即“帐幕的入口”。מִשְׁכָּן译作“帐幕”，既保留其作为居所、帐幕的基本意象，也符合本书语境。
