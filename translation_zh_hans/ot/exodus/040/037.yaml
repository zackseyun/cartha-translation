  text: וְ/אִם לֹ֥א יֵעָלֶ֖ה הֶ/עָנָ֑ן וְ/לֹ֣א יִסְע֔וּ עַד י֖וֹם הֵעָלֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/037.yaml
  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: zh_hans
  text: 但云彩若不升起，他们就不启程，直等到云彩升起的那一天[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“直到它升起之日。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上一节并引出相反的条件；“但……若”既体现转折，也自然表达条件关系。
- source_word: יֵעָלֶה
  choice: 升起
  rationale: עלה在此指云彩从帐幕上方升起；“升起”符合现代汉语习惯，也不额外加入被动含义。
- source_word: הֶעָנָן
  choice: 云彩
  rationale: 定冠词所指的是上下文中已经出现、彰显神同在的那片云彩；沿用出埃及记叙事中自然且庄重的称呼。
- source_word: יִסְעוּ
  choice: 启程
  rationale: נסע在行营语境中表示拔营出发；“启程”简洁自然，不像“拔营”那样把词义限定得过窄。
- source_word: עַד יוֹם
  choice: 直等到……的那一天
  rationale: 保留原文明确的“日”及时间终点含义，同时使整句符合现代汉语表达。
- source_word: הֵעָלֹתוֹ
  choice: 云彩升起
  rationale: 这是עלה的不定式构造并带第三人称阳性单数后缀，字面为“它升起”；代词指云彩，汉语中重复“云彩”可避免指代含混。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“不启程，直等到……”保留希伯来文的否定持续结构；不把云彩的升起解释为被外力提起，以免超出原文。
