base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他们每逢进入会幕或走近祭坛时，都洗濯自己，正如雅威[a]所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统汉语常译作“耶和华”。
    reason: 说明神名的音译依据及读者熟悉的传统译名。
lexical_decisions:
- source_word: בְּבֹאָם
  choice: 每逢进入
  rationale: 介词 בְּ 加不定词附属形及第三人称阳性复数词尾构成时间从句；结合本段反复遵行礼仪的语境，用“每逢”自然表达惯常、重复发生的动作。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该礼仪建筑在现代汉语圣经语境中的通行名称，简洁而准确地表达神与以色列相会之帐幕。
- source_word: וּבְקָרְבָתָם
  choice: 或走近
  rationale: קרב 表示靠近、走近；这里与前一时间从句并列，描述另一种需要洗濯的场合。汉语用“或”自然表达这两个分别发生的情形，不把原文机械译成“并且”。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 保留定指语境中的特定祭坛；汉语无需另加定冠词。
- source_word: יִרְחָצוּ
  choice: 都洗濯自己
  rationale: 未完成式在叙事中表达惯常行为。“洗濯”保留礼仪语境的庄重感；补出反身宾语“自己”，使现代汉语句意完整，同时不具体增添原文此节未明说的身体部位。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 表明他们的行为完全依照先前所领受的命令。
- source_word: צִוָּה
  choice: 吩咐
  rationale: צוה 在此指雅威向摩西颁下命令；“吩咐”符合神对摩西说话的庄重语域。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不用称号替代原文的专名。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: אֶת 在 צוה 的结构中标示受命者；汉语直接说“吩咐摩西”即可。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”以保留其专名性质，脚注说明传统汉语译名，避免把专名改作“主”等称号。
- issue: 洗濯动作的具体对象
  choice: 洗濯自己
  alternative: 洗手洗脚
  rationale: 本节的 יִרְחָצוּ 没有明说身体部位，尽管上文明确提到手脚。译文只补出汉语所需的反身对象，不把上文信息直接并入本节，从而保留原文的省略。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“每逢……都……”清楚表达惯常行为；“会幕”“祭坛”“洗濯”保留礼仪语境。
