base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: zh_hans
  text: 他取了见证[a]，放进约柜里；又把杠安在约柜上，把施恩座[b]安放在约柜上面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“见证”。这是此处的礼仪专称，指放在约柜里的盟约见证，可能是法版。
    reason: 保留原文的专称及其具体物件所指，同时不把“法版”作为原文直接明说的名称。
  - marker: b
    text: 或译“赎罪盖”，即约柜上面的金盖。
    reason: 保留כַּפֹּרֶת兼具器物形态与赎罪礼仪意义的另一种译法。
lexical_decisions:
- source_word: הָעֵדֻת
  choice: 法版
  rationale: עֵדוּת本义为“见证、证言”，在会幕语境中是放入约柜的盟约见证，即石版。中文若直译“见证”容易被理解为抽象言辞；“法版”能自然表达这里的具体物件，同时不额外写成原文未明说的“十诫石版”。脚注保留源语的专门称谓。
- source_word: הָאָרֹן
  choice: 约柜
  rationale: אָרוֹן本义为柜、箱；在本节会幕语境中专指神圣的约柜。“约柜”是现代中文圣经语境中清楚而自然的名称，虽比单独的“柜”略为明确，却没有造成所指含混。
- source_word: הַבַּדִּים
  choice: 杠
  rationale: 指抬约柜所用的长杠。“杠”简洁、现行且符合器具语境；“抬杠”在句中可能产生歧义，因此不采用。
- source_word: הַכַּפֹּרֶת
  choice: 施恩座
  rationale: כַּפֹּרֶת是约柜顶部具有赎罪礼仪意义的金盖。“施恩座”是中文中辨识度高的专门称谓，并保留其礼仪与神学内涵；脚注列出较具功能说明性的译法。
- source_word: מִלְמָעְלָה
  choice: 上面
  rationale: 此处说明施恩座位于约柜顶部。译作“在约柜上面”自然地表达空间关系，不机械复制希伯来语介词结构。
- source_word: וַיִּתֵּן ... אֶל
  choice: 放进
  rationale: נתן与אֶל在此表示把实体放入约柜。“放进”是简洁自然的现代汉语。
- source_word: וַיָּשֶׂם ... עַל
  choice: 穿在……上
  rationale: 结合出埃及记25:14所述杠要穿入柜旁的环内，中文用“把杠穿在约柜上”比笼统的“放在约柜上”更清楚地呈现安装动作，又未加入新的器件。
theological_decisions:
- issue: “法版／见证”的所指
  choice: 正文译作具体的“法版”，脚注说明希伯来原文直译为“见证”
  alternative: 正文译作“见证”或明确译作“见证的石版”
  rationale: 本节描述把某物放进约柜的实体动作，所指应是承载盟约见证的石版；但原文采用礼仪专称עֵדוּת而未直接写“石版”。正文须让普通中文读者理解具体所指，脚注则保存原文措辞及其张力。
- issue: כַּפֹּרֶת的翻译
  choice: 施恩座
  alternative: 赎罪盖；柜盖
  rationale: 该词不只是普通柜盖，而是赎罪礼仪中的特定器物。“施恩座”保留中文传统中明确的专名和神学分量；脚注提示“赎罪盖”这一更直观的可能译法，避免把一种解释当作唯一词义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以分号分开连续动作；“约柜、杠、施恩座”保持会幕器具名称的一致性。所有脚注标记均已置于正文相应词语之后。
