  yaml_path: translation/ot/exodus/040/025.yaml
  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他把灯盏安放在雅威面前，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 点上了
  rationale: 这是עלה的使役形，字面为“使……上升”。在会幕灯具的语境中，该表达通常指使灯燃起，即点灯；译为“点上了”符合本节具体礼仪场景，同时以脚注保留原文可能涉及安放或摆设灯具的语义空间。
- source_word: הַנֵּרֹת
  choice: 灯
  rationale: נֵרֹת指灯台上的各盏灯，而非抽象的“光”；现代汉语用“灯”自然、具体。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי在此是空间兼礼仪性的表达，意为“在……面前”或“在……临在中”；直译“在雅威面前”既自然，也保留敬拜语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 该连接词表示行动与先前命令相符；“正如”清楚表达严格遵照之意。
- source_word: צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 雅威所吩咐摩西的
  rationale: 完成式所指的命令先于本节行动；汉语“所吩咐……的”自然体现本次行动遵照先前命令，无须另加时态标记。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。音译“雅威”更直接保留其专名性质；“耶和华”是汉语传统形式，但较不贴近通常重建的读音。
- issue: וַיַּעַל在灯具礼仪中的含义
  choice: 点上了灯
  alternative: 把灯安放好
  rationale: 该使役表达在摩西五经关于灯台的语境中惯用于点灯或使灯燃起，因此正文采用自然明确的“点上了”；但其字面形式及本节语境仍容许安放、摆设灯具的理解，故不在脚注中排除该可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“他又……正如……”承接会幕设立过程；“点上了灯”符合当代汉语习惯，脚注则保留原文未完全消除的词义张力。
