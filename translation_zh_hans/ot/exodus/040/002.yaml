  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: zh_hans
  text: 正月初一[a]，你要把帐幕，就是会幕，竖立起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或按较紧密的组合译作：“正月初一，你要把会幕的帐幕竖立起来。”希伯来文把两个圣所称谓连在一起，既可理解为同位关系，也可理解为较紧密的组合结构。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם הַ/חֹדֶשׁ הָ/רִאשׁוֹן בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: 正月初一
  rationale: 希伯来文先说明“第一个月”，再用日期公式“一日”指该月第一天；“正月初一”是现代汉语中自然、简洁的历法表达。
- source_word: תָּקִים
  choice: 支搭起来
  rationale: קום的使役式在此指使帐幕立起，即搭建、竖立；“支搭起来”符合可移动圣所的语境，也保持庄重而易懂。
- source_word: מִשְׁכַּן
  choice: 帐幕
  rationale: 该词本义与“居所”相关，在《出埃及记》中专指以色列人的可移动圣所；“帐幕”是准确且通行的中文对应词。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是《出埃及记》中固定的圣所称谓，指相会之帐；“会幕”简洁、通行，并能与“帐幕”形成原文两个称谓并列的效果。
theological_decisions:
- issue: מִשְׁכַּן与אֹהֶל מוֹעֵד的关系
  choice: 同位解释：“帐幕，就是会幕”
  alternative: 较紧密的领属式理解：“会幕的帐幕”
  rationale: 原文将两个圣所称谓直接相连，既可视为同位语，也可作类似组合结构理解。正文采用同位表达，以免误解为两个不同物件；脚注保留另一种形式上更贴近原文的理解。
translation_notes:
  register: 采用现代、庄重而自然的简体中文。“正月初一”符合汉语历法习惯；“帐幕，就是会幕”清楚呈现两个圣所称谓指向同一结构，同时以脚注保存原文句法上的歧义。
