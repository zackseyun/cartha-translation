  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: zh_hans
  text: 你要带亚伦和他的儿子到会幕的门口，用水洗他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: 你要把……带到……来
  rationale: 希伯来语קרב的使役式表示使人靠近、带近；此处用“带到……来”自然表达使役和趋近之意，又不增添“呈献”等解释。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: בָּנָיו
  choice: 他的儿子
  rationale: 原词在此明确指亚伦的男性后代，并与祭司设立的语境相符。
- source_word: פֶּתַח
  choice: 门口
  rationale: 指帐幕的入口；“门口”是现代中文自然、准确的表达。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该礼仪场所名称在现代中文圣经语境中的通行译法，简洁地表达“相会之帐幕”。
- source_word: וְרָחַצְתָּ
  choice: 洗
  rationale: רחץ泛指洗涤；“洗”保留原文对具体方式的不确定性，不强化为“沐浴”。
- source_word: אֹתָם
  choice: 他们
  rationale: 代词共同指向亚伦和他的儿子。
- source_word: בַּמָּיִם
  choice: 用水
  rationale: 介词ב在此最自然地表示工具或手段，即以水施洗；不将其具体化为进入水中。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你要”承接本章连续的指令语气；“会幕”保留通行的礼仪术语，整句避免古奥句式和额外的神学解释。
