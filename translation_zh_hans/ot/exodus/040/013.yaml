base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: zh_hans
  text: 你要给亚伦穿上圣衣，膏他，使他分别为圣；他就要作祭司侍奉我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就要作我的祭司。”希伯来语动词指担任祭司职分或以祭司身份侍奉。
    reason: 说明祭司职分动词的词义范围及另一种自然译法。
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: 你要给……穿上
  rationale: 希伯来语为使役形式，指摩西把衣服穿在亚伦身上；此译符合现代汉语表达。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 圣衣
  rationale: 原文直译为“圣洁的衣服”或“神圣的衣服”；“圣衣”简洁自然，并保留礼仪用途的含义。
- source_word: וּמָשַׁחְתָּ
  choice: 膏他
  rationale: 保留祭司承接职分礼仪中“膏抹”的具体行动，不笼统译成“任命”。
- source_word: וְקִדַּשְׁתָּ
  choice: 使他分别为圣
  rationale: Piel形式在此指把亚伦分别出来归于神、承担圣职；“分别为圣”比单说“使他圣洁”更能表达礼仪性的设置。
- source_word: וְכִהֵן
  choice: 他就要作祭司侍奉
  rationale: 该动词表示担任祭司职分、以祭司身份服侍。“他就要”保留前述礼仪行动之后所产生的结果，又不把目的关系说得过强。
- source_word: לִי
  choice: 我
  rationale: 与“侍奉”组合译为“侍奉我”，自然表达服侍归向耶和华的与格关系。
theological_decisions:
- issue: 祭司设立礼仪中各行动的区分
  choice: 分别译出穿圣衣、膏抹、分别为圣和担任祭司职分
  alternative: 合并译为“按立他”或“任命他”
  rationale: 原文逐项列出相关行动；分别翻译可保留礼仪细节，避免引入后来的教会职分术语。
- issue: וְכִהֵן לִי 的句法功能
  choice: 译为“他就要作祭司侍奉我”
  alternative: 译为“使他可以作祭司侍奉我”或“他要作我的祭司”
  rationale: 原文由第二人称动词转为第三人称动词，可理解为前述行动的结果，也可视为并列的将来陈述。“就要”自然呈现结果意味，但不明确添加“为了”所表达的强目的关系。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“圣衣”“膏”“分别为圣”保留祭司礼仪用语；分号清楚呈现设立行动与随后祭司侍奉之间的关系。
