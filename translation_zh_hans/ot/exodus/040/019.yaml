  to: 他把帐幕铺在圣幕上，又从上面把帐幕的遮盖盖在其上，正如雅威所吩咐摩西的那样。
  rationale: 修正末句的汉语句法，采用与POB神名政策相符的“雅威”，并补出“从上面”。“其上”不强行判定代词究竟专指圣幕还是已铺设的帐幕结构，从而保留原文在此处的指代余地。
