  naturalness: 末尾“正如耶和华吩咐摩西的”在现代汉语中缺少与前文呼应的中心语，句法未完成。改为“正如雅威所吩咐摩西的那样”自然完整。“从上面……盖在其上”虽保留原文的空间强调，但“其上”不指定先行词，恰当保留עָלָיו所可能指向整个已覆盖结构的语义范围。
  terminology: “圣幕”与“帐幕”可保留，以呈现原文两个不同名词。四字神名יְהוָה应依POB既定译法及英文审校轨迹译作“雅威”，而不是“耶和华”。
