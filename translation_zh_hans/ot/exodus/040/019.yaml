base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他把帐幕铺在圣幕上，又从上面把帐幕的遮盖盖在其上，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: 铺
  rationale: פרשׂ表示展开、铺开；这里指把帐幕层铺设在圣幕结构之上。“铺”在现代汉语中自然，并保留具体动作。
- source_word: הָאֹהֶל
  choice: 帐幕
  rationale: אֹהֶל通常指帐棚或帐幕；此处指铺在מִשְׁכָּן之上的帐幕层。译作“帐幕”可与后面的“遮盖”保持词义区别。
- source_word: הַמִּשְׁכָּן
  choice: 圣幕
  rationale: מִשְׁכָּן源于“居住”，在《出埃及记》中指上帝临在的神圣居所。中文译作“圣幕”简明易懂，也能与本句的אֹהֶל“帐幕”相区别。
- source_word: וַיָּשֶׂם
  choice: 盖
  rationale: שׂים基本义为放置、安放；因宾语是遮盖物，中文用“盖”更符合实际动作，同时不增添原文没有的细节。
- source_word: מִכְסֵה הָאֹהֶל
  choice: 帐幕的遮盖
  rationale: מִכְסֶה意为遮盖物。直译为“帐幕的遮盖”，保留其与אֹהֶל本身的区别。
- source_word: עָלָיו מִלְמָעְלָה
  choice: 在上面
  rationale: 两个方位表达共同强调遮盖位于其上方。汉语若逐字译成“从上方在它上面”较累赘，合译为“在上面”自然且完整传达空间关系。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 正如耶和华吩咐摩西的
  rationale: “正如”体现כַּאֲשֶׁר所强调的对应关系；该句式保留本段反复出现的顺服公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是现代中文圣经传统中对四字神名的通行音译，作为专名呈现，而非以“主”这一称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文读者最熟悉且可直接识别的专名形式是“耶和华”；“雅威”更接近现代学界常用的拟音，但在普通中文语境中通行度较低。
- issue: מִשְׁכָּן与אֹהֶל的区分
  choice: 分别译作“圣幕”和“帐幕”
  alternative: 分别译作“帐幕”和“帐棚”
  rationale: 原文在同一句中有意使用两个不同名词。分别译出可避免把结构与覆盖其上的帐幕层混为一物；“圣幕”也表达מִשְׁכָּן在本书中的神圣居所语境。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“帐幕的遮盖”略带结构性表达，旨在保留原文中帐幕层与外部遮盖物的区别；全节不需脚注。
