base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: zh_hans
  text: 摩西照着雅威[a]所吩咐他的一切做了；他就这样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（四字神名）；传统译作“耶和华”或“上主”。
    reason: 说明神名的原文形式及常见传统译法。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 去做
  rationale: עשה可指“做、行、制作”；此处后接“照着……一切”，重点在执行命令，译为“去做”自然且准确。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代汉语中通行的人名译法。
- source_word: כְּכֹל
  choice: 照着……一切
  rationale: כ与כֹל合用，表达完全依照命令的全面性；这一译法兼顾原文结构与自然汉语。
- source_word: אֲשֶׁר
  choice: 所
  rationale: 作为关系词引出雅威吩咐的全部内容，汉语以“所”连接最为简洁自然。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 表示权威性的命令；“吩咐”符合叙事语体，也不额外明示希伯来文动词本身未编码的过去完成时。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: אֹתוֹ
  choice: 他
  rationale: 宾格标记所带第三人称阳性单数后缀，指摩西。
- source_word: כֵּן
  choice: 这样
  rationale: 回指前述依照全部命令而行的方式，突出行动与命令完全相符。
- source_word: עָשָׂה
  choice: 他就这样做了
  rationale: 保留עשה的重复，以再度强调摩西确实遵命而行；“就”使汉语承接自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，并以脚注说明传统译法，避免把名字无提示地替换为称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。保留原文首尾重复的“做”，以体现对摩西完全顺服的强调；分号呈现概括陈述与重申之间的关系。
