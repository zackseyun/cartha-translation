base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: zh_hans
  text: 然后，你要取膏抹油[a]，膏抹帐幕和其中的一切；你要使帐幕和帐幕的一切器具分别为圣，帐幕就归为圣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“膏抹之油”，即用于膏抹的油。
    reason: 说明希伯来语构词，并说明正文“膏抹油”的含义。
  - marker: b
    text: 希伯来文作“圣”，不是“至圣”。
    reason: 防止读者受邻近经文或熟悉译法影响，在本节中加入原文没有的最高级含义。
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 然后，你要取
  rationale: 该形式在连续指令中具有命令效力；“然后”体现上下文中的程序次序，“你要取”则以自然的现代汉语表达指令。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 原文是“膏抹之油”的构词，指用于礼仪性膏抹的专用油；“膏油”简洁、自然，并保留其礼仪含义。
- source_word: וּמָשַׁחְתָּ
  choice: 膏抹
  rationale: משׁח在此指用油膏抹，使对象归于神圣用途；“膏抹”准确保留这一礼仪动作。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是旷野圣所的通行中文名称，比直译为“居所”更明确，也符合本段语境。
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: 其中的一切
  rationale: 概括帐幕内所有物件，既完整又符合现代汉语表达。
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: 使帐幕……分别为圣
  rationale: קדשׁ的Piel形在这里表示将对象划归神圣用途；“分别为圣”比单说“使其圣洁”更清楚地传达礼仪性的奉献与归属。为避免汉语代词指向含混，译文重述“帐幕”。
- source_word: וְאֶת כָּל כֵּלָיו
  choice: 和帐幕的一切器具
  rationale: כֵּלִים泛指帐幕所属的器物、用具；“器具”范围适中，不把含义缩窄为餐具或容器。重述“帐幕”可明确所属关系。
- source_word: וְהָיָה קֹדֶשׁ
  choice: 帐幕就必是圣的
  rationale: 该结果句说明帐幕经膏抹并分别为圣后的神圣状态。“必”表达指令序列所预期的结果；“圣的”保留קֹדֶשׁ本身的程度，不擅自加强为“至圣的”。
theological_decisions:
- issue: 帐幕经膏抹和分别为圣之后的礼仪地位
  choice: 帐幕就必是圣的
  alternative: 帐幕就必是至圣的
  rationale: 本节结尾只有קֹדֶשׁ（“圣”），没有קֹדֶשׁ קָדָשִׁים（“至圣”）。因此译文不根据邻近经文或传统措辞增加最高级含义。
translation_notes:
  register: 采用现代、庄重而易懂的指令体。“分别为圣”保留礼仪语境；通过重述“帐幕”避免多个第三人称代词造成指向不明。脚注标记均置于其实际说明的词语之后。
