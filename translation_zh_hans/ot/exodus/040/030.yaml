  source_fidelity: 译文准确传达了安放洗濯盆、其位置及供洗濯使用的水。惟“在那里盛上水”在现代汉语中搭配不够自然，且“盛”容易理解为器皿容纳水而非摩西将水置入其中。改为“在盆里放了水”明确其受事和处所，虽将“那里”依上下文落实为盆内，但没有增添原文未明言的洗濯者或材质。
  naturalness: “安放”“会幕”“祭坛”“供洗濯之用”符合庄重、现代的经文语体。“又在那里盛上水”不够地道；“又在盆里放了水”较清楚自然。脚注原称传统译法“也作‘洗濯盆’”，与正文用词重复，宜改正；脚注标记也应紧随其所说明的“洗濯盆”。
  terminology: “会幕”“祭坛”“洗濯盆”均恰当。“洗濯”保留礼仪语境，同时未将לְרָחְצָה具体化为祭司、手脚或洗净自己。脚注可说明传统中文的“铜盆”，并明确铜的材质并非本节明说。
