  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: zh_hans
  text: 他把洗濯盆[a]安放在会幕和祭坛之间，又在盆里放了水，供洗濯之用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “洗濯盆”所译的希伯来语，指会幕礼仪中用来盛水洗濯的大盆；传统中文译本常译为“铜盆”。本节原文并未说明其材质。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 安放
  rationale: שׂוּם表示把物件放置在某一位置；“安放”自然、庄重，也符合设立会幕器具的语境。
- source_word: הַכִּיֹּר
  choice: 洗濯盆
  rationale: כִּיּוֹר指会幕礼仪中盛水洗濯的大盆；“洗濯盆”既说明用途，也比单说“盆”更容易与普通容器区分。
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: 在会幕和祭坛之间
  rationale: 用现代汉语的“在……和……之间”表达希伯来语重复的בֵּין结构。“会幕”是אֹהֶל מוֹעֵד在中文圣经语境中清楚而通行的名称。
- source_word: וַיִּתֵּן
  choice: 又……盛上
  rationale: נָתַן在此表示放入或置入；与水和容器搭配时，“盛上水”比机械直译为“放水”更符合现代汉语。
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 保留地点副词“那里”的形式，不直接改写为较具解释性的“在盆里”；上下文仍清楚表明水与洗濯盆有关。
- source_word: מַיִם
  choice: 水
  rationale: 该词虽为希伯来语复数形式，但在此作物质名词，汉语自然译为“水”。
- source_word: לְרָחְצָה
  choice: 供洗濯之用
  rationale: 这是表示目的的רָחַץ不定式；原文未明说谁洗或洗什么，因此不增添“祭司”“手脚”或反身成分。
