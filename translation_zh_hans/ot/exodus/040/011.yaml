  text: You shall anoint the basin and its stand[b][a], and consecrate it.
translation:
  language: zh_hans
  text: 要膏抹洗濯盆和盆座[a]，并将它分别为圣[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盆座”也可译作“底座”。
    reason: lexical_alternative
  - marker: b
    text: “将它分别为圣”也可译作“使它成圣”或“使它成为圣物”。原文用单数“它”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: 要膏抹
  rationale: מָשַׁח在会幕礼仪语境中指用油膏抹，使器物归于神圣用途。“膏抹”既准确，又符合现代中文圣经语体；句首连接词按中文连续训令的自然表达不单独译出。
- source_word: הַכִּיֹּר
  choice: 洗濯盆
  rationale: כִּיּוֹר指会幕中供祭司洗濯使用的大盆。“洗濯盆”比单说“盆”更明确，也不采用生僻的传统器物名称。
- source_word: כַּנּוֹ
  choice: 盆座
  rationale: כֵּן在这里是承托洗濯盆的结构。“盆座”简洁地表明其所属及支承功能；“底座”亦有可能，列入脚注。
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: 使它成为圣物
  rationale: קדשׁ的Piel在此表示把器物分别出来归于神圣用途。“使它成为圣物”自然传达礼仪性的成圣，而非道德改变。希伯来文使用阳性单数代词“它”，最自然地指洗濯盆，同时盆座作为附属部分包含在整项礼仪处理之中。
theological_decisions:
- issue: 会幕礼仪语境中קדשׁ的译法
  choice: 使它成为圣物
  alternative: 将它分别为圣／使它成圣
  rationale: 此处说的是会幕器物被归为神圣用途，不是道德性质的转变。“成为圣物”在现代中文中清楚表达其礼仪地位，同时避免加入后来的宗派性含义。
- issue: 单数代词אֹתוֹ的指向
  choice: 保留单数“它”
  alternative: 使它们成为圣物
  rationale: 原文明确使用阳性单数，不宜为求顺畅改成复数。“它”最可能回指作为主要器物的洗濯盆，而盆座与盆构成一套器具；译文保留原文在涵盖范围上的张力。
translation_notes:
  register: 采用庄重而通俗的现代标准普通话。“要……”延续上下文的训令语气；“膏抹”“圣物”保留会幕礼仪色彩，同时避免过度古雅。所有脚注标记均置于对应词句之后。
