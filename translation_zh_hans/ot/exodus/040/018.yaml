base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: zh_hans
  text: 于是，摩西立起帐幕，安放底座[a]，竖起木板[b]，安上横闩，竖起柱子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “底座”也可译作“座”或“承座”；此处指承托并容纳帐幕板材的基础构件。
    reason: lexical_alternative
  - marker: b
    text: “木板”也可译作“板框”或“框架构件”；希伯来语所指的是帐幕直立的结构部件。
    reason: lexical_alternative
  - marker: c
    text: “柱子”也可译作“立柱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: 支起／竖起
  rationale: 希伯来语קום的使役式在这里表示“使之站立、架设”。与“帐幕”搭配译作“支起”，与“柱子”搭配译作“竖起”，既保留动作含义，也符合现代汉语习惯。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן本义为“居所”，在《出埃及记》中专指可移动的圣所；“帐幕”是清楚、通行而庄重的对应词。
- source_word: אֲדָנָיו
  choice: 底座
  rationale: אֶדֶן在帐幕建造语境中指承托或嵌接木板的基础构件。“底座”通俗清楚；其带有承插结构的技术含义以脚注补充。
- source_word: קְרָשָׁיו
  choice: 木板
  rationale: קֶרֶשׁ指帐幕直立的板状结构构件。“木板”贴近该词通常含义，并避免把其具体构造过度解释为现代意义的“框架”。
- source_word: בְּרִיחָיו
  choice: 横闩
  rationale: בְּרִיחַ指贯联并稳固木板的横向杆件。“横闩”比单说“闩”更清楚地传达其结构作用，同时未超出上下文所支持的意义。
- source_word: עַמּוּדָיו
  choice: 柱子
  rationale: עַמּוּד指直立的支撑物。“柱子”是现代汉语中自然、庄重且不过分技术化的译法。
- source_word: וַיִּתֵּן / וַיָּשֶׂם
  choice: 安放好／立起／装上
  rationale: נָתַן与שׂוּם在此均表示放置、安设结构部件。根据各宾语采用自然的汉语搭配，同时保留连续组装的动作次序。
