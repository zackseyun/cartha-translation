  text: וּ/מָשַׁחְתָּ֛ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה וְ/אֶת כָּל כֵּלָ֑י/ו וְ/קִדַּשְׁתָּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/הָיָ֥ה הַ/מִּזְבֵּ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: zh_hans
  text: 你要膏抹燔祭坛和坛的一切器具，使坛成圣；坛就必成为至圣之物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“圣中之圣”，是表示最高程度的说法，即“至圣”。
    reason: 说明希伯来文最高级结构，并避免将其误解为至圣所。
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: 你要膏抹
  rationale: מָשַׁח在礼仪语境中指用油膏立、奉献；“膏抹”既保留具体动作，也符合现代中文圣礼语体。
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: 该组合词指用于献燔祭的坛；“燔祭坛”简洁自然，并保留祭物类别。
- source_word: כָּל כֵּלָיו
  choice: 坛的一切器具
  rationale: כֵּלִים泛指附属于坛的礼仪器物；“器具”比“器皿”涵盖面更广，也符合本处语境。
- source_word: וְקִדַּשְׁתָּ
  choice: 使坛成圣
  rationale: קדש在这里表示将坛分别出来归于神圣用途；“使……成圣”保留使役含义及礼仪色彩。
- source_word: וְהָיָה
  choice: 就必成为
  rationale: 此处说明膏抹并使坛成圣之后所形成的状态；“就必成为”呈现结果关系和指令语境中的确定性。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣之物
  rationale: 该叠加结构表达最高程度的神圣；坛是器物，译作“至圣之物”既自然，也避免被误解为内层圣所的专名。
theological_decisions:
- issue: 礼仪圣洁用语קֹדֶשׁ קָדָשִׁים的处理
  choice: 至圣之物
  alternative: 圣中之圣
  rationale: 该短语在本节描述坛的圣洁等级，是希伯来语的最高级表达，并非指称空间上的“至圣所”。正文采用自然中文“至圣之物”，脚注保留其字面形式。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“你要”承接连续礼仪指令；用“膏抹、燔祭坛、成圣、至圣”等通行宗教词汇，同时避免过度古雅。脚注标记置于其实际说明的“至圣之物”之后。
