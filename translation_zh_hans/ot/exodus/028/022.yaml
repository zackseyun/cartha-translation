lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要制作
  rationale: 该形式在连续的制作指示中表达命令；“你要”自然保留规定性的语气。
- source_word: עַל הַחֹשֶׁן
  choice: 在胸牌上
  rationale: עַל通常表示“在……上”，这里指链子装设在胸牌上；此译法简明且符合上下文。
- source_word: שַׁרְשֹׁת
  choice: 链子
  rationale: 该复数名词指链条；现代汉语用“链子”清楚自然，也适合礼服配件的语境。
- source_word: גַּבְלֻת
  choice: 编成
  rationale: 此词含缠绕、编结或绳状加工之意；结合后面的“绳索样式”，译作“编成”能表达制作方式，又不把词义限定得过窄。
- source_word: מַעֲשֵׂה עֲבֹת
  choice: 绳索的样式
  rationale: 该短语描述如粗绳般编结、扭合的工艺；“绳索的样式”保留原文形象，并符合现代汉语表达。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 这是会幕制作指示中常见的材料名称；“纯金”准确、简洁而通行。
