  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: zh_hans
  text: 你要在其上镶嵌宝石，排成四行：第一行是红宝石、黄玉和绿宝石。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这些宝石究竟指哪些矿物，无法确定。“红宝石”也可能是“红玉髓”；“黄玉”也可能是“贵橄榄石”或“橄榄石”；“绿宝石”也可能是“绿柱石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: 你要在上面镶满宝石
  rationale: מלא的基本义为“充满”，但在制作胸牌、嵌入宝石的工艺语境中，译作“镶满”既保留填满之意，也自然表达镶嵌动作。בּוֹ在中文里依物件表面镶嵌的习惯表达为“在上面”。
- source_word: אַרְבָּעָה טוּרִים אָבֶן
  choice: 共四行
  rationale: טוּר指按次序排列的一行；前文“宝石”已明确材料，中文无需重复“宝石四行”。
- source_word: טוּר ... הָאֶחָד
  choice: 第一行
  rationale: 该短语标明四行中的首行，译作“第一行”自然明确。
- source_word: אֹדֶם
  choice: 红宝石
  rationale: 词义与红色有关，但具体矿物无法确定；采用传统且易懂的“红宝石”，并以脚注保留“红玉髓”等可能。
- source_word: פִּטְדָה
  choice: 黄玉
  rationale: 具体所指宝石不确定；“黄玉”承接传统译法且符合现代汉语宝石名称，其他可能置于脚注。
- source_word: בָרֶקֶת
  choice: 绿宝石
  rationale: 该词可能与闪耀、发光有关，具体矿物不确定；采用通行的“绿宝石”，并在脚注注明“绿柱石”等可能。
