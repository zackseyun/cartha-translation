  text: וַ/עֲשֵׂ֤ה לָ/הֶם֙ מִכְנְסֵי בָ֔ד לְ/כַסּ֖וֹת בְּשַׂ֣ר עֶרְוָ֑ה מִ/מָּתְנַ֥יִם וְ/עַד יְרֵכַ֖יִם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: zh_hans
  text: 你要给他们做细麻布裤[a]，用来遮盖赤裸的下身；裤子要从腰部[b]直到大腿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细麻布裤”也可译作“细麻布短裤”或“细麻布衬裤”。希伯来语指穿在祭司礼服里面、遮盖下身的衣物。
    reason: lexical_alternative
  - marker: b
    text: “腰部”所译的希伯来语也可指“腰间”或“髋部”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: 你要……做
  rationale: 该词是带连接词的第二人称阳性单数命令式；在连续颁布制作条例的语境中，“你要……做”既保留指令语气，也符合现代汉语表达。
- source_word: לָהֶם
  choice: 给他们
  rationale: 表示受益对象，指上文所说的祭司。
- source_word: מִכְנְסֵי בָד
  choice: 细麻布裤
  rationale: מִכְנְסֵי 指遮盖下身、穿在祭司礼服里面的裤状衣物；“裤”比“内裤”更少带入现代款式，又比古雅说法易懂。בָד 在祭司衣物语境中译作“细麻布”。
- source_word: לְכַסּוֹת
  choice: 用来遮盖
  rationale: 不定式表示目的；“用来遮盖”自然地呈现其功用。
- source_word: בְּשַׂר עֶרְוָה
  choice: 赤裸的下身
  rationale: 原文直译近于“赤裸之肉身”，在此具体指需要由裤子遮盖的下体部位。“赤裸的下身”保留身体裸露的具体含义，同时避免过度直译或过分委婉。
- source_word: מִמָּתְנַיִם
  choice: 从腰部
  rationale: מָתְנַיִם 可指腰、腰间或髋部；描述衣物上端时，“腰部”最自然，并在脚注中保留“腰间、髋部”等可能表达。
- source_word: וְעַד יְרֵכַיִם
  choice: 直到大腿
  rationale: יָרֵךְ 常指大腿；这里说明裤子覆盖范围的下端。
- source_word: יִהְיוּ
  choice: 裤子要……直到
  rationale: 原文动词是“要成为／要处于”，用于说明衣物从一处到另一处的范围。汉语以“要从……直到……”自然表达，且不额外规定其精确长度或样式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的条例体。“赤裸的下身”既传达原文 בְּשַׂר עֶרְוָה 的具体身体意象，也避免使用过于古雅或带现代内衣款式联想的措辞。所有脚注标记均已置于正文相应位置。
