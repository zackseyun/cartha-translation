  yaml_path: translation/ot/exodus/028/026.yaml
  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: zh_hans
  text: 你要做两个金环，把它们安在胸牌两端、朝向以弗得内侧的边缘上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在胸牌两端、面向以弗得的内侧边缘上。”
    reason: 原文对胸牌边缘、以弗得和“向内”之间的空间关系表达紧缩，汉语可作不同的句法组织。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要做
  rationale: 带连接词的完成式在连续制作指示中表达命令；“你要做”自然保留指令语气。
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: 两个金环
  rationale: 准确表达数量、物件及材质，符合现代汉语习惯。
- source_word: וְשַׂמְתָּ אֹתָם
  choice: 把它们安在
  rationale: שׂים 可指放置、安置；制作器物的语境中，“安在”比泛泛的“放在”更贴切。
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: 在胸牌的两端
  rationale: קצה 指尽头或端部；חֹשֶׁן 在祭司服饰语境中按通行译法译为“胸牌”。
- source_word: עַל שְׂפָתוֹ
  choice: 在……的边缘上
  rationale: שָׂפָה 本义为嘴唇，也可指物件的边、边缘；此处译作“边缘”清楚自然。
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: 朝向以弗得内侧的
  rationale: עֵבֶר 表示所朝向的一面，בָּיְתָה 表示向内、在里面；此译保留空间关系，同时避免过度断定具体装配方式。
