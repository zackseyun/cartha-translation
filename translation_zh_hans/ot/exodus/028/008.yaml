base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: zh_hans
  text: 以弗得上巧工织成的带子，要照着以弗得的做法制作，并同以弗得连成一体[a]；要用金线、蓝色线、紫色线、朱红色线[b]和捻成的细麻制成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“要与它的做法相同；要从它而成。”意思是这条带子的工艺要与以弗得一致，并与以弗得成为整体，而不是另做的一件。
    reason: lexical_alternative
  - marker: b
    text: “蓝色、紫色和朱红色”在这里指用相应染料染成、用于会幕和祭司服饰的纺织线材。
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב
  choice: 精工编织带
  rationale: 在祭司服饰的语境中指以弗得上的编织带；此译既表达其带状用途，也体现织造工艺。
- source_word: אֲפֻדָּתוֹ
  choice: 以弗得
  rationale: 采用现代中文圣经语境中对祭司礼服 אֵפוֹד 的通行音译；所属关系由“以弗得上面的”自然体现。
- source_word: אֲשֶׁר עָלָיו
  choice: 以弗得上面的
  rationale: 就近理解代词所指为以弗得，保留该带位于其上的空间关系，不进一步解释为后来附加上去。
- source_word: כְּמַעֲשֵׂהוּ
  choice: 要与以弗得的做法相同
  rationale: 明确保留“如同它的制作/工艺”这一成分，避免将其与下一短语合并后遗漏。
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: 并同它连成一体
  rationale: 原文直译为“要从它而成”，在衣物制作语境中强调编织带与以弗得整体相连，而非独立配件；脚注保留更贴近字面的表达。
- source_word: זָהָב
  choice: 金线
  rationale: 原词为“金”；在与各色线和细麻并列的织造材料清单中译作“金线”，自然传达其具体用途。
- source_word: תְּכֵלֶת
  choice: 蓝色线
  rationale: 该词在会幕织物语境中指蓝色染料所染的纺织材料；译文明确其为线材。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 标准色彩词，在此材料清单中按纺织语境译作紫色线。
- source_word: תוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该复合表达指用特定染料染成的鲜红或朱红纺织材料；“朱红色线”符合祭司服饰语境。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻的细麻
  rationale: שֵׁשׁ 指细麻，מָשְׁזָר 表示捻合；此译简洁保留两项信息。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“精工编织带”兼顾器物名称和制作工艺；句式保留原文两层要求，即工艺相同与整体相连。为使中文材料清单自然明确，将金和各色纺织材料表述为“线”，并以脚注说明色彩词的纺织背景。
