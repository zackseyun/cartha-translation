  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
translation:
  language: zh_hans
  text: 它的两端要有两块相连的肩片[a]，使它连接起来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肩带”。希伯来语这个词在此指衣服肩部的构件，并非人体的肩膀。
    reason: lexical_alternative
  - marker: b
    text: 或译“它就连接起来”。末句为被动形式，也可按希伯来语的并列结构译为“它就连接起来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: 两块肩片
  rationale: כְתֵפֹת 在祭司衣服的语境中指位于肩部、用来连接衣服的构件，并非人体的肩膀；“肩片”既简洁，也保留其具体形状并不完全确定这一点。
- source_word: חֹבְרֹת
  choice: 接在
  rationale: 该阴性复数分词源自 חבר，描述两块肩片与衣服两端的连接关系；汉语用“接在”能自然表达衣服构造，同时保留“连接”的基本意义。
- source_word: יִהְיֶה לּוֹ
  choice: 它要有
  rationale: 这是希伯来语用存在结构加介词 ל 表达领有的惯用说法；译为“它要有”符合现代汉语。
- source_word: שְׁנֵי קְצוֹתָיו
  choice: 两端
  rationale: קָצֶה 指尽头或端部；衣服构造语境中，“两端”比“两边”更贴近原词，又无需重复汉语中已明确的所属关系。
- source_word: וְחֻבָּר
  choice: 使它连在一起
  rationale: 这是 חבר 的被动形式；结合前面的肩片与两端，汉语以结果或目的结构表达最为顺畅，同时保留整件衣服被连接起来的被动含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的服装制作表达。“肩片”避免误解为人体部位；句末用“使”呈现上下文中的结果或目的关系，并以脚注保留较形式化的并列读法。
