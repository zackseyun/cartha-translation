base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: zh_hans
  text: “至于你，要从以色列人[a]中，把你的哥哥亚伦和他的儿子们一同带到你面前来，让他们作祭司事奉我：亚伦和他的儿子拿答、亚比户、以利亚撒、以他玛。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“以色列的众子”，这是对以色列群体的惯常称呼。
    reason: 说明源文的字面表达及其群体含义。
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 独立人称代词带有强调作用，并标示话语转向；“至于你”在现代汉语中自然地保留这种强调。
- source_word: הַקְרֵב אֵלֶיךָ
  choice: 带到你面前
  rationale: קרב 的使役式意为“使靠近、带近”，אֵלֶיךָ 指向摩西。“带到你面前”既保留具体的趋近动作，又不提前把它解释为完整的授职礼。
- source_word: אָחִיךָ
  choice: 你哥哥
  rationale: 亚伦年长于摩西，因此在现代汉语中用“哥哥”比笼统的“兄弟”更准确自然，同时保留亲属关系。
- source_word: בָּנָיו אִתּוֹ
  choice: 他的儿子们一同
  rationale: 保留 אִתּוֹ 所表达的伴随关系，表明亚伦和他的儿子们一同被带来。
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: 从以色列人中
  rationale: 准确表达从圣约群体内部选出的含义；现代汉语通常以“以色列人”表达这一群体称谓，字面形式则收入脚注。
- source_word: לְכַהֲנוֹ לִי
  choice: 使他们作祭司事奉我
  rationale: כהן 的动词形式表示履行祭司职分；“作祭司事奉我”兼顾职分和服事对象，并直接反映 לִי“为我”。
- source_word: בְּנֵי אַהֲרֹן
  choice: 亚伦的儿子
  rationale: 自然表达该组合结构所说明的父子关系，并明确末尾所列名字的身份。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 正文译作“以色列人”
  alternative: 以色列的众子
  rationale: 这里的阳性复数短语是对整个圣约群体的惯常称谓，并非只强调男性后裔。中文“以色列人”自然且没有缩小所指范围；脚注保留希伯来文的字面形式。
- issue: לְכַהֲנוֹ לִי 所表达的祭司职分
  choice: 使他们作祭司事奉我
  alternative: 使他们归我作祭司
  rationale: 源文动词既涉及担任祭司，也涉及履行祭司职务。所选译法保留服事上帝的方向，不把本句过度解释为授职仪式的完整描述。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“至于你”保留句首强调；“带到你面前”保留礼仪语境中的具体趋近意象。“拿答、亚比户、以利亚撒、以他玛”采用通行圣经人名译法。
