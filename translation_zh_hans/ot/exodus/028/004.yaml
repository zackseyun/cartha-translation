id: EXO.28.4
reference: Exodus 28:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: zh_hans
  text: 他们要制作的衣服是这些：胸牌[a]、以弗得[b]、外袍、织有纹样的内袍[c]、头巾和腰带。他们要为你哥哥亚伦和他的儿子们制作圣服[d]，使他作祭司事奉我。[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “胸牌”指大祭司佩在胸前的礼仪物件，并非护身铠甲；也可译作“胸袋”。
    reason: lexical_alternative
  - marker: b
    text: “以弗得”是希伯来语音译，指一种没有精确现代汉语对应词的特定祭司服饰。
    reason: cultural_note
  - marker: c
    text: 原文所说的织法或纹样不能完全确定；也可译作“方格纹内袍”或“编织成纹的内袍”。
    reason: lexical_alternative
  - marker: d
    text: “圣服”也可译作“神圣的衣服”。
    reason: lexical_alternative
  - marker: e
    text: 原文这里是单数“他”，可能主要指亚伦；前一句则同时提到亚伦和他的儿子们。
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּגָדִים
  choice: 衣服
  rationale: 用现代汉语中自然、清楚的总称指祭司所穿的各件服饰；“祭服”虽符合语境，却会提前加入原词本身未明说的礼仪限定。
- source_word: יַעֲשׂוּ
  choice: 要制作
  rationale: 未完成式在这一连串神圣指示中带有命令或规定的语气；“要制作”既保留指令性，也符合现代汉语。
- source_word: חֹשֶׁן
  choice: 胸牌
  rationale: 这是大祭司佩在胸前的特定物件。“胸牌”是汉语圣经传统中易于辨认的名称，但不应理解为护身铠甲，故加注说明。
- source_word: אֵפוֹד
  choice: 以弗得
  rationale: 这是没有精确现代汉语对应词的祭司专用服饰，采用音译以保存其特定所指，并以脚注简释。
- source_word: מְעִיל
  choice: 外袍
  rationale: 该词在此指穿在其他衣物外面的袍服；“外袍”比单说“袍子”更能显示其衣着层次。
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: 织有纹样的内袍
  rationale: כְתֹנֶת指贴身或内层的长衣；תַּשְׁבֵּץ可能描述方格状、编织成纹或其他织造纹样。正文采用较宽泛的“织有纹样”，避免把有争议的具体图案定死。
- source_word: מִצְנֶפֶת
  choice: 头巾
  rationale: 指缠裹式的祭司头饰；“头巾”自然易懂，也不误导为王冠。
- source_word: אַבְנֵט
  choice: 腰带
  rationale: 指围束在腰间的布带；“腰带”是清楚自然的现代汉语对应词。
- source_word: בִגְדֵי קֹדֶשׁ
  choice: 圣服
  rationale: 简洁保留קֹדֶשׁ的“圣”这一核心概念，同时自然表达分别用于神圣职事的衣服。
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: 为你哥哥亚伦
  rationale: 直接保留神对摩西所说的亲属关系；现代汉语通常需按长幼具体表达，出埃及记7:7表明亚伦年长，因此译作“哥哥”。
- source_word: וּלְבָנָיו
  choice: 和他的儿子们
  rationale: 原文明确指亚伦的众子，不泛化为“儿女”或“后代”。
- source_word: לְכַהֲנוֹ לִי
  choice: 使他作祭司事奉我
  rationale: 保留希伯来文第三人称阳性单数后缀，并表达该动词在此所含的祭司职事意义。
theological_decisions:
- issue: 祭司服饰术语既要保持会幕礼仪的特定性，又不套用后世教会服饰名称
  choice: 可准确表达的词采用普通现代汉语，如“外袍、头巾、腰带”；无精确对应的אֵפוֹד音译为“以弗得”。
  alternative: 全部采用传统术语，或把“以弗得”解释性译为“祭司围裙”。
  rationale: 原文列举的是以色列会幕祭司的特定服饰。音译不可替代的专名，同时翻译有清楚对应的普通名词，能兼顾历史特定性与可读性。
- issue: לְכַהֲנוֹ的单数后缀与前面的亚伦及众子
  choice: 正文译作“使他作祭司事奉我”，保留原文单数。
  alternative: 按前面复数对象顺译为“使他们作祭司事奉我”。
  rationale: 马所拉文本在提到亚伦和他的儿子们之后使用阳性单数后缀。译文不把这一数的不协调静默改平，并以脚注指出其可能主要回指亚伦。
- issue: “圣服”的神学语义
  choice: 采用“圣服”，保留“圣”的用语。
  alternative: 译作“礼服”或“祭服”。
  rationale: “礼服”会削弱分别为圣的含义；“祭服”说明用途，却没有直接传达קֹדֶשׁ的圣洁语言。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留祭司礼仪语境中的“圣、祭司、事奉”等核心词。列举服饰时用简明并列结构；对不确定的织物纹样和末句单复数张力不在正文中武断消解，而由脚注说明。
