base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: zh_hans
  text: 亚伦和他的儿子进入会幕，或走近祭坛在圣所供职时，要穿着这些衣服，免得担当罪责[a]而死。这是亚伦和他后代永远的定例[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“获罪”；希伯来语直译为“担当罪责”，是法律和礼仪用语。
    reason: lexical_alternative
  - marker: b
    text: 或译“永久的定例”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל אַהֲרֹן וְעַל בָּנָיו
  choice: 亚伦和他的儿子……都必须穿上它们
  rationale: 希伯来文直译为“它们要在亚伦和他儿子身上”，所指承接上文的祭司衣物；中文用“穿上它们”自然表达衣物在身上的含义，同时保留复数指代。
- source_word: בְּבֹאָם אֶל אֹהֶל מוֹעֵד
  choice: 进入会幕时
  rationale: בְּ加不定式结构表达时间；“会幕”是 אֹהֶל מוֹעֵד 在现代中文圣经语境中清楚而通行的译法。
- source_word: אוֹ בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: 或走近祭坛
  rationale: נגשׁ 在祭司礼仪语境中表示走近、近前；“走近”既自然，又保留接近神圣区域的动作含义。
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: 在圣所供职
  rationale: שרת 指祭司履行圣职；“供职”比一般的“服侍”更准确地体现礼仪职分。בַּקֹּדֶשׁ 可指神圣领域或圣所，此处按祭司在神圣处所履职的语境译为“在圣所”。
- source_word: וְלֹא יִשְׂאוּ עָוֹן וָמֵתוּ
  choice: 免得担当罪责而死
  rationale: נשׂא עון 是法律—礼仪用语，字面为“担当罪责”；“免得”自然表达本句警戒和防止后果的功能，同时没有削弱死亡后果。
- source_word: חֻקַּת עוֹלָם
  choice: 永远的定例
  rationale: 该短语表示持续有效的规定；“永远的定例”保留 עוֹלָם 的延续性，也符合庄重而易懂的现代中文。
- source_word: לֹו וּלְזַרְעוֹ אַחֲרָיו
  choice: 亚伦和他后代
  rationale: 单数代词回指亚伦；זֶרַע 是集合名词，译为“后代”比字面的“种子”自然准确。
theological_decisions:
- issue: 祭司未按规定穿着而亲近圣所时的罪责与死亡后果
  choice: 译为“免得担当罪责而死”
  alternative: 可译为“免得获罪而死”或“否则就要担当罪责而死”
  rationale: 原文把罪责与死亡作为真实的圣礼法律后果并列。“担当罪责”保留原文法律—礼仪习语及其神学张力，不把它弱化成一般性的礼仪失误，也不额外说明死亡发生的机制。
- issue: בַּקֹּדֶשׁ 所指的范围
  choice: 译为“在圣所”
  alternative: 可译为“在圣域”或“办理圣事”
  rationale: 原文既含神圣性质，也可指神圣处所。结合进入会幕、走近祭坛和祭司供职的语境，“圣所”最为清楚；不进一步限定为会幕内部某一特定分区，以免消除原文可能保留的范围弹性。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“会幕、祭坛、圣所、定例”等保留祭司礼仪语域；用“供职”表达祭司职分，用“免得”清楚呈现警戒目的。脚注标记分别紧接其实际说明的“担当罪责”和“永远的定例”，避免英文咨询层中标记位置与脚注内容错配。
