revisions:
- from: 亚伦供职时，要穿着这袍；他进入圣所[b]、到雅威面前时，以及出来时，袍上的响声[a]都要让人听见，免得他死亡[c]。
  to: 这袍要穿在亚伦身上，供他供职；他进入雅威面前的圣所[b]时，和出来时，袍上的响声[a]都要被听见，免得他死[c]。
  rationale: 修订去除了“让人听见”所增添的未指明听者，恢复希伯来文被动表达的开放性；同时调整首句，使袍服穿在亚伦身上与其供职的关系更清楚。神名、礼仪术语、进出圣所的时间平行结构及警戒性结语均予保留。脚注标记仍紧邻相应词句，且脚注内容与正文一致。
