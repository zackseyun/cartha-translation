base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: zh_hans
  text: 这袍要穿在亚伦身上，供他供职；他进入雅威面前的圣所[b]时，和出来时，袍上的响声[a]都要被听见，免得他死[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“它的响声要被听见”；“它”最可能指上文所说、缀有铃铛的袍。
    reason: lexical_alternative
  - marker: b
    text: “圣所”也可译作“圣处”；这里指雅威面前的会幕神圣空间。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“这样他就不会死”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: 要穿着这袍
  rationale: 原文直译为“它要在亚伦身上”。根据上文所述祭司袍，译作“要穿着这袍”既明确承接对象，也符合现代汉语的穿戴表达。
- source_word: לְשָׁרֵת
  choice: 供职时
  rationale: לְ 加不定词可表示目的或伴随情境；这里指亚伦履行祭司职务之时。“供职”保留礼仪职分语境，同时避免过度解释具体仪式。
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: 袍上的响声都要让人听见
  rationale: נִשְׁמַע 是被动式“被听见”；后缀在语法上可指“它的”或“他的”，但紧接上文袍边的铃铛，最自然是袍所发出的响声。中文以“袍上的响声”明确语境所指。
- source_word: בְּבֹאוֹ
  choice: 他进入……时
  rationale: בְּ 加带人称后缀的不定词表示时间；目的地随后出现，因此译作“进入”比直译“去的时候”更自然。
- source_word: אֶל הַקֹּדֶשׁ
  choice: 进入圣所
  rationale: הַקֹּדֶשׁ 在会幕礼仪语境中指神圣的会幕空间；“圣所”既保持术语色彩，也不把范围限定得超过原文。
- source_word: לִפְנֵי יְהוָה
  choice: 到雅威面前
  rationale: לִפְנֵי 表示来到某位面前或其临在之中；神名四字母词 יְהוָה 采用中文音译“雅威”，而不以称号替代。
- source_word: וּבְצֵאתוֹ
  choice: 以及出来时
  rationale: 与“进入……时”平行，简洁表达从圣所出来的时间情境。
- source_word: וְלֹא יָמוּת
  choice: 免得他死亡
  rationale: 形式上为“而他不死”，在本条礼仪规定中自然表达避免死亡的目的或结果；“免得”保留警戒意味和原文关系上的张力。
theological_decisions:
- issue: 响声所指
  choice: 理解为袍上铃铛所发的响声
  alternative: 理解为亚伦本人行动时的一般声响
  rationale: 前两节刚描述袍边的金铃铛，因此这里的代词后缀最自然回指袍或其铃铛；脚注仍说明希伯来文的字面代词形式。
- issue: וְלֹא יָמוּת 的逻辑关系
  choice: 译为警戒性的“免得他死亡”
  alternative: 译为结果性的“这样他就不会死亡”
  rationale: 希伯来文以连接词加否定未完成式表达，既可突出遵命后的结果，也可带有防止死亡的警戒意味；正文采用简洁而自然的“免得”，不进一步说明死亡机制。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用对四字神名的直接音译，不以称号“主”取代专名。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“供职”“圣所”保留祭司礼仪语域；句式按希伯来文的穿袍、听见响声、进出圣所和避免死亡的逻辑顺序组织。所有脚注标记均置于对应词句之后。
