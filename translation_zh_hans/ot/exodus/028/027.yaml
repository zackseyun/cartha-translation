base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: zh_hans
  text: 你要做两个金环，把它们安在以弗得的两条肩带上较低、朝前的一侧，正对着以弗得的连接处[a]，在以弗得巧工织成的带子[b]上方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “连接处”或译“接合处”或“接缝处”。希伯来语泛指以弗得连接、接合的部位，并不明确限定为缝制的接缝。
    reason: lexical_alternative
  - marker: b
    text: “巧工织成的带子”或译“以弗得的织带”或“以弗得的腰带”。希伯来语 חֵשֶׁב 指以弗得上特制的带状或束系构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: 金环
  rationale: טַבַּעַת 在会幕器具和祭司服饰的语境中通常指供系结之用的金属环；译作“金环”准确自然。
- source_word: כִתְפוֹת הָאֵפוֹד
  choice: 以弗得的两块肩带
  rationale: כָּתֵף 本义与“肩”有关，在服装构造中指肩部的组成部分；“肩带”既符合现代汉语习惯，也能表明这是以弗得上的构件。
- source_word: הָאֵפוֹד
  choice: 以弗得
  rationale: 这是祭司服饰的专门名称；沿用现代中文圣经中通行的音译，可避免以解释性意译过度限定其形制。
- source_word: מִלְּמַטָּה מִמּוּל פָּנָיו
  choice: 下边、朝前的一面
  rationale: 两个方位短语共同说明金环装设在肩带较低处且位于前侧；此译保留空间关系，并采用自然的现代汉语表达。
- source_word: לְעֻמַּת מֶחְבַּרְתּוֹ
  choice: 正对着连接处
  rationale: לְעֻמַּת 表示位置上的相对或对应，מֶחְבֶּרֶת 泛指连接、接合之处；“连接处”比“接缝”更能保留原词未明确说明缝制方式的宽泛含义。
- source_word: מִמַּעַל לְחֵשֶׁב הָאֵפוֹד
  choice: 在以弗得精工织成的带子上方
  rationale: חֵשֶׁב 在此指以弗得上特制的带状或束系构件；结合上下文的制作说明，译作“精工织成的带子”既传达工艺性，也不武断限定为现代意义的腰带。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。保留“以弗得”这一通行的祭司服饰专名；空间次序尽量贴近希伯来文，同时用“就是”引出具体位置，帮助普通读者理解复杂的服装构造说明。
