source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: zh_hans
  text: “你要制作决断的胸牌[a]，用巧匠精心设计的工艺；要按制作以弗得的工艺制作它。要用金线[b]、蓝色线、紫色线、朱红色线和捻成的细麻制作它。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用于决断的胸牌”或“审判的胸牌”。原文没有在本节进一步说明它与决断或审判的具体关系。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“金”。在本段制作礼服的纺织工艺语境中，此处译作“金线”。
    reason: translation_clarification
lexical_decisions:
- source_word: חֹשֶׁן
  choice: 胸牌
  rationale: 指大祭司佩在胸前的特定礼仪物件。“胸牌”沿用通行且易懂的译法，又避免“胸甲”令人误以为是防具；本节没有明确说明其袋状结构。
- source_word: מִשְׁפָּט
  choice: 决断
  rationale: 可涵盖裁断、判定和祭司求问所得决定等语义，同时不把其具体功能解释得超出本节所说。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 采用巧匠设计的工艺
  rationale: 该短语指经过构思、具有图样的专业工艺；此译兼顾设计者的技巧与成品的工艺性质，不武断限定为刺绣。
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: 照以弗得的做法
  rationale: 表达胸牌应采用与以弗得相同或相仿的制作工艺，符合比较结构。
- source_word: אֵפֹד
  choice: 以弗得
  rationale: 这是特定的祭司礼服名称，没有完全对应且简洁的现代汉语词，故采用通行音译。
- source_word: זָהָב
  choice: 金子
  rationale: 原文只写“金”，没有在本节明说“金线”；正文保留材料名称，并以脚注说明其纺织语境。
- source_word: תְּכֵלֶת
  choice: 蓝色线
  rationale: 这是会幕织物用料中的染色材料；在汉语并列清单中补出“线”，可自然呈现纺织语境。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 指贵重的紫色染料或染色织线；此处按制作织物的语境译为“紫色线”。
- source_word: תוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该固定表达指朱红或猩红色的染色材料；“朱红色线”准确且符合现代汉语。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻成的细麻
  rationale: 保留细麻的质地以及经过搓捻加工的含义，不额外加入原文未明说的品质评价。
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: 要……制作；要……制作
  rationale: 保留希伯来文重复的命令式表达和郑重的制作指示，同时使汉语句式流畅。
theological_decisions:
- issue: חֹשֶׁן מִשְׁפָּט 的功能关系
  choice: 决断的胸牌
  alternative: 用于决断的胸牌；审判的胸牌
  rationale: 属格结构可能表示胸牌与裁断、判定或求问所得决定有关，但本节没有解释其运作机制。“决断的胸牌”保留这种礼仪和司法意味，并以脚注呈现语法关系上的真实歧义。
translation_notes:
  register: 采用现代、庄重而可朗读的指令体。“胸牌”和“以弗得”作为祭司礼服术语保持稳定；材料清单用自然的现代汉语表达，同时借脚注区分原文明说的“金”与语境所指的金线工艺。
