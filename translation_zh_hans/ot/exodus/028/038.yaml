source:
  edition: WLC
  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: zh_hans
  text: 这牌要戴在亚伦的额上。亚伦要担当以色列人所分别为圣的一切圣物所涉及的罪责[a]，包括他们所献各样圣物礼品所涉及的罪责。这牌要常在他的额上，使他们在耶和华面前蒙悦纳[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “担当……罪责”也可译作“承担……罪孽”；原文惯用语可表示承担与圣物有关的罪咎或责任。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“为使他们在耶和华面前得蒙悦纳”；这句话也可能包括使他们所献的礼物蒙悦纳。
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: 额上
  rationale: 该词指前额；“额上”准确表达牌的位置，也符合现代汉语习惯。
- source_word: נָשָׂא ... עֲוֺן
  choice: 担当……罪责
  rationale: 保留祭司语境中承担罪咎或责任的含义，不把它进一步解释为除去、赦免或仅作象征。
- source_word: הַקֳּדָשִׁים
  choice: 圣物
  rationale: 复数在本段指奉献给上帝的神圣物品或祭物；“圣物”简洁并保留礼仪类别。
- source_word: יַקְדִּישׁוּ
  choice: 分别为圣
  rationale: 表达把物品划归上帝、奉献为圣的行动，比单用“圣化”更自然清楚。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该群体称谓的自然表达，涵盖以色列全体，不误导为仅指男性后裔。
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: 他们所献各样圣物礼品
  rationale: 原文句法关系较难确定；此译保留“各样”“礼品”和“圣物”的要素，并以同位说明呈现其与前句圣物的关系。
- source_word: תָּמִיד
  choice: 常
  rationale: 表达持续在额上的要求，简明自然。
- source_word: לְרָצוֹן לָהֶם
  choice: 使他们……蒙悦纳
  rationale: 将目的或结果用自然汉语表达，同时以脚注保留“蒙恩惠”及礼物本身蒙悦纳的可能性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名音译，而不是以“主”这一称号代替原文专名。
theological_decisions:
- issue: 亚伦“担当圣物的罪责”的含义
  choice: 译作担当圣物所涉及的罪责，保留祭司代表性地承担相关罪咎或责任的含义。
  alternative: 译作除去圣物的罪，或仅象征性地承载以色列人的罪。
  rationale: נָשָׂא עָוֺן 可指承担罪咎或罪责；经文本身没有在此完整说明其机制，因此不预先限定为除罪、赦免或纯粹纪念。
- issue: “使他们蒙悦纳”的所指
  choice: 正文以“他们”指以色列献礼者，同时让上下文保留其礼物也牵涉其中。
  alternative: 仅指所献礼物蒙悦纳。
  rationale: 原文代词指向人较为自然，但整个语境围绕他们的圣物礼品；脚注保留两者关联及语义张力。
translation_notes:
  register: 采用庄重而清晰的现代标准普通话。“这牌”承接上文金牌，避免重复补入原文此节未明说的名称；用“就是”梳理较难的希伯来语结构，但不消除“圣物礼品”与“圣物”之间的原有张力。
