base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: zh_hans
  text: 你要给他们穿上这些衣服，就是给你的哥哥亚伦和他的儿子们穿上；又要膏抹他们，使他们就任祭司职分[a]，使他们分别为圣，好为我供祭司职分。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“使他们的手充满”；这是希伯来语的习惯表达，指正式设立某人就任祭司职分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: 你要给他们穿上这些衣服
  rationale: 该词是לבשׁ的使役形式，表示使人穿上衣服；结合上文，所指是已经描述的祭司服装。中文补出“这些衣服”，使语意自然清楚。
- source_word: אֹתָם ... אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: 给他们……就是给你哥哥亚伦和同他一起的儿子们
  rationale: 原文先用代词“他们”，随后以同位语明确其所指。译文保留这一结构，并用“就是”清楚引出亚伦及其众子。
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: 要膏抹他们
  rationale: משׁח在祭司礼仪语境中指以油膏立；“膏抹”保留其具体礼仪动作及神学含义。
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: 授予他们圣职
  rationale: 字面为“使他们的手充满”，在本语境中是使人正式就任祭司职分的希伯来习语。“授予圣职”既传达就职含义，也避免让现代中文读者误解为字面动作；字面形式收入脚注。
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: 使他们分别为圣
  rationale: קדשׁ在这里表示将人分别出来归于神、用于圣职。“分别为圣”保留其神圣归属和礼仪设立的含义。
- source_word: וְכִהֲנוּ לִי
  choice: 好作我的祭司
  rationale: כהן的Piel形式表示履行祭司职务；“作我的祭司”自然表达其职分，并保留לִי所表达的归属和服事对象。
theological_decisions:
- issue: 祭司就职习语 מִלֵּא אֶת־יָד 的译法
  choice: 正文译作“授予他们圣职”
  alternative: 使他们的手充满；使他们就任
  rationale: 该短语在祭司礼仪中指正式设立或就任，而非普通意义上的填满双手。正文采用功能对等的译法，避免字面误解；脚注保留原文意象，以维持可核查性，同时不引入任何后世宗派的按立制度。
- issue: וְכִהֲנוּ לִי 所表达的祭司职分与归属
  choice: 译作“好作我的祭司”
  alternative: 为我供祭司的职分；向我作祭司
  rationale: 译文既表达他们实际履行祭司职分，也保留其职分归于上帝、以祂为服事对象的关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“膏抹”“分别为圣”“祭司”保留祭司礼仪语域；句式避免过度文言化。“同他一起的儿子们”对应原文אִתּוֹ，同时保持现代中文可读性。
