source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: zh_hans
  text: 你要对所有心里有智慧、我已使他们充满智慧之灵的人[a][b]说；他们要制作亚伦的衣袍，使他分别为圣，作祭司事奉我[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“心中有智慧的人”。“心”在希伯来语中可指理解和判断的内在中心；这里也包含制作衣袍所需的技巧和能力。
    reason: lexical_alternative
  - marker: b
    text: “智慧之灵”也可理解为神所赐的智慧心志或禀赋。原文并未明确写作“圣灵”，因此正文不作更具体的限定。
    reason: alternative_reading
  - marker: c
    text: 也可译作“使他分别为圣，好让他作祭司事奉我”。原文两个目的短语关系紧密。
    reason: syntactic_alternative
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: 你要……说
  rationale: 该词为皮埃勒未完成式，在指示语境中具有命令或吩咐的语气；“你要……说”既保留“说”的基本意义，也自然表达指令。
- source_word: חַכְמֵי לֵב
  choice: 心里有智慧的人
  rationale: 直译近于“心中有智慧者”。希伯来语以“心”指人的理解、判断和能力；本节语境尤其包含制作圣衣所需的技艺。“心里有智慧的人”保留了“心”的意象，同时符合现代汉语表达。
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: 我使他们充满智慧之灵
  rationale: 保留 מלא“充满”的意象和 רוּחַ חָכְמָה“智慧之灵”的构造。希伯来语关系从句使用单数代词，可按集合中的每个人理解；汉语随复数先行词自然译作“他们”。不把 רוּחַ 明确限定为圣灵，也不将其缩减为单纯的技术能力。
- source_word: בִּגְדֵי אַהֲרֹן
  choice: 亚伦的衣袍
  rationale: 这是普通的所属结构；“衣袍”在此比“衣服”更符合庄重礼仪语境，但不额外加入原短语未明说的“祭司”或“圣”字样。
- source_word: לְקַדְּשׁוֹ
  choice: 使他分别为圣
  rationale: קדשׁ 在祭司设立的语境中表示使人归于神圣用途。“分别为圣”兼顾其圣洁含义和职分上的奉献。
- source_word: לְכַהֲנוֹ לִי
  choice: 作祭司事奉我
  rationale: כהן 在这里是动词，意为履行祭司职分；“作祭司事奉我”清楚保留 לִי 所表达的事奉对象。
- source_word: וְעָשׂוּ
  choice: 他们要制作
  rationale: 该完成式在连续的指示语境中承接命令。“要制作”自然表达其指令性质。
theological_decisions:
- issue: רוּחַ חָכְמָה 是否应明确译为圣灵
  choice: 智慧之灵
  alternative: 智慧；智慧的心志；赐智慧的圣灵
  rationale: 原文没有冠词，语境指向神所赐、用于圣衣制作的智慧与能力，但措辞本身既可指神所赐的灵，也可指智慧的心志或禀赋。译文保留“灵”，却不直接加上“圣”，避免超出原文作三一论层面的明确认定。
- issue: 两个目的不定式 לְקַדְּשׁוֹ לְכַהֲנוֹ 的关系
  choice: 使他分别为圣，作祭司事奉我
  alternative: 使他分别为圣，好让他作祭司事奉我
  rationale: 原文连续使用两个带 לְ 的不定式，既可视为相连的目的，也可将第二项理解为分别为圣的直接目标。正文用紧凑并列结构保留这种关系，不额外强化因果层级。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“分别为圣”和“作祭司事奉我”保留祭司语境的精确含义；整体句式尽量贴近希伯来语指示体，同时避免生硬逐词直译。
