  yaml_path: translation/ot/exodus/028/010.yaml
  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
translation:
  language: zh_hans
  text: 他们的名字，六个刻在一块宝石上，其余六个名字刻在第二块宝石上，按他们出生的次序排列。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按他们的世系排列”。希伯来语可指家族世系，也可指由出生先后形成的次序。
    reason: 保留כְּתוֹלְדֹתָם在“世系”和“出生次序”之间的词义幅度。
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: 他们的名字，六个
  rationale: מִן在这里表示整体中的一部分，即全部名字中的六个；采用自然的汉语分配句式。
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: 在一块宝石上
  rationale: עַל表示位置“在……上”；הָאֶחָת与后面的“第二块”相对，直译为“一块”而不强行改成“第一块”。结合上文，אֶבֶן指用于刻名的宝石。
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: 其余六个名字
  rationale: נוֹתָרִים指剩下的、其余的；中文补出“名字”，使所指清楚。
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: 在第二块宝石上
  rationale: הַשֵּׁנִית明确是序数“第二”；与前面的“一块宝石”形成对应。
- source_word: כְּתוֹלְדֹתָם
  choice: 按他们出生的次序排列
  rationale: תּוֹלְדוֹת可指世系、后代或出生所形成的次序；在十二个名字分刻于两块宝石的语境中，最自然是按出生先后排列，同时以脚注保留其词义范围。
theological_decisions: []
