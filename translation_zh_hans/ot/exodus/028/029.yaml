id: EXO.28.29
reference: Exodus 28:29
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: zh_hans
  text: 亚伦进圣所的时候，要把以色列众子的名字带在决断胸牌内，放在心上[a][b][c]，常在耶和华面前作为纪念[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带”也可译作“担负”。
    reason: lexical_alternative
  - marker: b
    text: “决断胸牌”也可译作“审判胸牌”。希伯来文这一名称与祭司在神面前的审判或裁决有关。
    reason: alternative_reading
  - marker: c
    text: “心上”按服饰位置也可译作“胸前”。
    reason: lexical_alternative
  - marker: d
    text: 这句话也可译作“作为在耶和华面前的纪念”。
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: 要……带
  rationale: נשא可表示“携带、担负”。这里指亚伦把刻有名字的胸牌佩带在身上；“带”自然地保留其具体含义。
- source_word: שְׁמוֹת
  choice: 名字
  rationale: 直译复数名词，明确所指是刻在宝石上的各名字，而非把支派抽象化。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留原文的男性、谱系性表达；在上下文中指从以色列而出的众支派。
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: 在……决断胸牌上
  rationale: חֹשֶׁן指祭司所佩的胸牌；מִשְׁפָּט可涉及审判或裁决。“决断胸牌”保留其与在神面前求取裁决相关的礼仪含义，同时脚注注明另一译法。介词ב在此按名字镶嵌于胸牌之上的关系自然译为“在……上”。
- source_word: עַל לִבּוֹ
  choice: 胸前
  rationale: 字面为“在他的心上”。就服饰位置而言，现代汉语“胸前”自然清楚，同时脚注保留“心上”的象征性表达。
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: 进圣所的时候
  rationale: ב加不定式结构表示时间；הַקֹּדֶשׁ在会幕语境中指神圣的圣所空间。“圣所”避免过度限定为某一内部分区。
- source_word: לְזִכָּרוֹן
  choice: 作为纪念
  rationale: לְ表示用途或结果，זִכָּרוֹן指使之被记念的纪念物或纪念安排。“作为纪念”简洁保留其礼仪功能。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: 按常见希伯来语习语译为在神面前或在神的临在中，并保留神名。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中广为人知的专名形式，明确呈现四字神名，而非以称号替代。
- source_word: תָּמִיד
  choice: 常
  rationale: 表示祭司礼仪中持续而反复的常规性；置于“在耶和华面前”之前，现代汉语自然且不将其收窄为绝对无间断。
theological_decisions:
- issue: 礼仪名称 חֹשֶׁן הַמִּשְׁפָּט 的译法
  choice: 决断胸牌
  alternative: 审判胸牌
  rationale: מִשְׁפָּט兼有审判、裁决、决断等语义。正文用“决断”较自然地表达祭司胸牌与求问神之裁决的关联，但不排除“审判”的传统理解，故列于脚注。
- issue: בְּנֵי יִשְׂרָאֵל 的谱系表达
  choice: 以色列众子
  alternative: 以色列人；以色列的子孙
  rationale: 原文是阳性复数的谱系称谓，且本段十二个名字代表各支派。“众子”保留源文形式及代表性张力。
- issue: הַקֹּדֶשׁ 所指的神圣空间
  choice: 圣所
  alternative: 圣处；圣所内部的圣处
  rationale: 该词在此明确指会幕的神圣空间，但本节本身未使用更具体的“至圣所”称谓；译作“圣所”避免无根据地缩窄空间范围。
- issue: לְזִכָּרוֹן לִפְנֵי יְהוָה 的关联范围
  choice: 常在耶和华面前作为纪念
  alternative: 作为在耶和华面前的纪念
  rationale: 两个表达都可反映原文。正文保留名字在神面前发挥纪念作用的自然理解，同时脚注提示另一种句法组织，不说明纪念是供神还是供人，以免消解原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“决断胸牌”“圣所”等词保持祭司礼仪语域；语序按汉语调整，但保留“以色列众子”、神名及“纪念”语义中的源文张力。所有脚注标记均在正文中出现。
