  to: 亚伦进圣所的时候，要把以色列众子的名字带在决断胸牌内，放在心上[a][b][c]，常在耶和华面前作为纪念[d]。
  rationale: 修订将名字所在的“决断胸牌内”与胸牌所在的“心上”分别表达，恢复原文的空间结构和代表性意象；其余措辞、神名及礼仪语域均予保留。脚注c相应调整为对正文“心上”的可行替代译法。
