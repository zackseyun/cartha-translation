  naturalness: “以色列众子”“决断胸牌”适合庄重的礼仪语域。“把……名字带在……胸牌内，放在心上”虽较贴近原文，仍是自然、清楚的现代汉语；“常在耶和华面前作为纪念”亦通顺。
  terminology: “耶和华”“圣所”“决断胸牌”均可用。对חֹשֶׁן הַמִּשְׁפָּט采用“决断胸牌”保留其礼仪称谓的开放性，不应在正文或注释中断言其具体操作机制。
