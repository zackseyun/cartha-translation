  text: וְ/נָתַתָּ֞ אֶל חֹ֣שֶׁן הַ/מִּשְׁפָּ֗ט אֶת הָ/אוּרִים֙ וְ/אֶת הַ/תֻּמִּ֔ים וְ/הָיוּ֙ עַל לֵ֣ב אַהֲרֹ֔ן בְּ/בֹא֖/וֹ לִ/פְנֵ֣י יְהוָ֑ה וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת מִשְׁפַּ֨ט בְּנֵי יִשְׂרָאֵ֧ל עַל לִבּ֛/וֹ לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: zh_hans
  text: 你要把乌陵和土明[a]放进裁决胸牌[b]里；亚伦进到雅威面前时，它们要在亚伦的心口上。亚伦要不断地在雅威面前，把以色列子民[c]的裁决承担在自己心口上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乌陵”和“土明”是两个希伯来礼仪专名，指与祭司裁决有关的神圣物件；它们的确切形制和使用方式不详。按一种可能的词源，可理解为“光明”和“完全”。
    reason: lexical_alternative
  - marker: b
    text: “裁决胸牌”也可译作“审判胸牌”或“公义胸牌”。希伯来语 מִשְׁפָּט 可依上下文表示裁决、审判或公义。
    reason: alternative_reading
  - marker: c
    text: “以色列子民”译自原文直译为“以色列众子”的固定表达，在这里指以色列的盟约之民。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: 裁决胸牌
  rationale: חֹשֶׁן指大祭司佩戴的胸牌，并具有可容纳物件的结构；מִשְׁפָּט在本节兼有审断、决定与公义的语义。“裁决”既适合乌陵和土明所关联的求问情境，也能与本节后半句保持词汇呼应。
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: 乌陵和土明
  rationale: 采用现代中文圣经读者较熟悉的音译，因为这两个礼仪专名所指物件的形制、用法及词源都不能完全确定，不宜把推测性的词源直接译入正文。
- source_word: אֶל
  choice: 放进……里
  rationale: 与动词נָתַתָּ及具有容纳功能的胸牌连用时，表示把乌陵和土明置于胸牌之内。
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: 它们要在他的心口上
  rationale: 保留复数主语及עַל־לֵב的具体穿戴意象；“心口”在现代汉语中比单说“心上”更自然地表达胸前的位置，同时仍保留“心”的象征意味。
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: 亚伦进到雅威面前时
  rationale: בוא在此涉及祭司进入神面前的圣所语境；“进到……面前”兼顾进入与朝见两层含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: וְנָשָׂא
  choice: 担
  rationale: נשא既可指实际承载，也可表达承担代表性责任；“担”在中文里保留了这两层意义。
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子的裁决
  rationale: “裁决”与前面的“裁决胸牌”对应，保留同一希伯来词在本节中的重复，同时不把含义单限定为抽象的公义。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 较直接地保留希伯来语的盟约群体称谓及其阳性复数形式；脚注说明这里所指的是以色列民，避免现代读者误解为雅各的亲生儿子。
- source_word: תָּמִיד
  choice: 常常
  rationale: 祭司语境中的תמיד通常表示持续而有规律地履行职责；“常常”避免使人误以为这是每一刻都不中断的动作。
theological_decisions:
- issue: 是否按推测词源意译乌陵和土明
  choice: 正文音译为“乌陵和土明”
  alternative: 译作“光明和完全”等
  rationale: 二者的确切形制、运作方式和词源仍有不确定性；音译避免把有争议的解释写成确定事实。
- issue: מִשְׁפָּט在本节两处的译法
  choice: 两处都以“裁决”为核心译法
  alternative: 分别译作“审判”“决定”或“公义”
  rationale: 这词在上下文中涉及借祭司礼仪寻求权威决定。“裁决”既保留司法分量，也维持两处用词的关联，但脚注仍呈现其他真实可能。
- issue: בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 正文作“以色列众子”
  alternative: 译作“以色列人”或“以色列民”
  rationale: 正文保留原文的阳性盟约称谓，同时用脚注明确它在此泛指以色列全体盟约之民，并非只指某些男性或雅各的亲生儿子。
- issue: 祭司“担”以色列裁决的含义
  choice: 保留具体承载与代表责任之间的张力
  alternative: 解释性地译作“为以色列人负责求裁决”
  rationale: 原文没有完全说明乌陵和土明如何运作，也没有把נשא缩减为单一的功能说明；直译式表达更能保留祭司在神面前代表百姓的意象。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“你要”延续本段雅威对摩西的直接吩咐；“心口”兼顾胸牌的实际佩戴位置和“心”的象征意涵。正文保留原文的并列推进，不添加“因此”等逻辑连接词。
