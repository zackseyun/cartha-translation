translation:
  language: zh_hans
  text: 第三排是紫玛瑙[a]、玛瑙[b]和紫水晶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里宝石名称的确切鉴定尚不确定；“紫玛瑙”所译的希伯来语是לֶשֶׁם，传统上也译作“利古雷石”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语שְׁבוֹ也可能指“缟玛瑙”；古代宝石名称往往无法与现代矿物名称精确对应。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הַשְּׁלִישִׁי
  choice: 第三排是
  rationale: טוּר在胸牌宝石的语境中指宝石的一排；הַשְּׁלִישִׁי明确表示“第三”。本句承接上节的清单，中文不必机械译出句首连接词，仍保留连续列举的关系。
- source_word: לֶשֶׁם
  choice: 紫玛瑙
  rationale: 这种古代宝石的确切所指无法确定。“紫玛瑙”是现代中文中较易理解的近似译名，但以脚注保留鉴定上的不确定性。
- source_word: שְׁבוֹ
  choice: 条纹玛瑙
  rationale: 该词通常被理解为某种玛瑙，也可能指缟玛瑙；采用“条纹玛瑙”既自然可懂，也不把古代名称与现代矿物分类过度等同。
- source_word: וְאַחְלָמָה
  choice: 和紫水晶
  rationale: 该词普遍被认作紫水晶；译名清楚、通行，并在中文列举中自然保留连接词。
