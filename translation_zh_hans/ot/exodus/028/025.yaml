revisions:
- from: 要把两条绞链的两端接在两个金座上[a]，再把金座安在以弗得的两条肩带上，位于以弗得的前面。
  to: 要把两条绞合的链子的两端放在两个镶座上[a]，又把它们放在以弗得的肩部上，朝向前面。
  rationale: 修订恢复第二个“放置”动作所指向的构件，避免把镶座误作再次安放的宾语；同时以“肩部”避免将衣饰构件限定为肩带，并用脚注保留“绞合物”的词义范围。
