review_pass:
  verdict: revise
  source_fidelity: 译文前半句基本对应“把两条绞合物的两个末端放在两个镶座上”。但后半句将第二个“放置”的宾语改为“金座”，而希伯来文的语法及上下文更自然地指向两条绞合物（或其已置于镶座的末端）；因此“再把金座安在……”改变了制作步骤和所移动的对象。
  naturalness: “绞链”不够常用，容易被理解为机械铰链；“绞合的链子”或“链状绳索”更自然。修订后采用简洁、庄重的工艺指令语体。
  terminology: 保留“以弗得”。将 מִשְׁבְּצוֹת 译为“镶座”较能表达金工语境而不武断规定形制；“肩部”比“肩带”更稳妥，因为原文是衣服的肩部构件，并未明确为带子。保留 עֲבֹתֹת 的词义不确定性于脚注。
  issues:
  - severity: high
    issue: 第二个动作的宾语被改为“金座”。
    rationale: 原文“你要把〔它们〕放在以弗得的肩部上”承接前述两条绞合物的末端；译为“把金座安在”无充分文本根据，并改变了构件的安装关系。
  - severity: medium
    issue: “肩带”过度具体化。
    rationale: כִּתְפֹת 在此指以弗得的肩部／肩部构件，未必可确定为现代意义的“肩带”。
  - severity: low
    issue: “绞链”可能引起机械铰链的误解。
    rationale: עֲבֹתֹת 可指绞合的绳索或链状物；使用“绞合的链子”更清楚，并以脚注保留“绳索”的可能性。
  revised_text: 要把两条绞合的链子的两端放在两个镶座上[a]，又把它们放在以弗得的肩部上，朝向前面。
