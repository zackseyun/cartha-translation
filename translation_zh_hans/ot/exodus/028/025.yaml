  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: zh_hans
  text: 要把两条绞合的链子的两端放在两个镶座上[a]，又把它们放在以弗得的肩部上，朝向前面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绞合的链子”或可译作“绞合的绳索”。希伯来语原词可指粗绳或绞合的链状物；本段的金工语境较支持译作链状构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: 两端
  rationale: 指绞链末端的两个端点；“两端”在现代汉语中自然、准确。
- source_word: הָעֲבֹתֹת
  choice: 绞链
  rationale: 该词可指粗绳或绞合的链子；上下文明确涉及金制链状构件，因此译作“绞链”，兼顾绞合形态和金属材质语境。
- source_word: הַמִּשְׁבְּצֹת
  choice: 金座
  rationale: 指以弗得上的金质镶座或托座；“金座”简洁易懂，并结合上文所述材质，避免把具体装饰形态说得过死。
- source_word: כִתְפֹת
  choice: 肩带
  rationale: 字面为“肩部”，在衣饰制作语境中指以弗得肩上的构件；“肩带”比人体意义的“肩膀”更准确。
- source_word: אֵפֹד
  choice: 以弗得
  rationale: 这是祭司专用服饰的名称，沿用中文圣经中通行的音译。
- source_word: אֶל מוּל פָּנָיו
  choice: 位于以弗得的前面
  rationale: 表达这些构件安置在以弗得朝前的一侧；补明“以弗得”可避免代词指向含混。
- source_word: וְנָתַתָּה
  choice: 再把金座安在
  rationale: 希伯来文再次使用“放置”类动词；依上下文明确宾语为金座，并用“安在”自然表达衣饰构件的固定安装。
theological_decisions: []
