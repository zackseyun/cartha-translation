  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: zh_hans
  text: 要按刻石匠的手艺，如同刻印章那样，把以色列众子的名字刻在这两块宝石上；又要把它们镶在金质镶座中。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: 用宝石雕刻匠的手艺
  rationale: 该结构说明制作的工艺或方式；上下文所刻的是宝石，因此译为“宝石雕刻匠”比泛指石匠更准确，也符合现代汉语。
- source_word: פִּתּוּחֵי חֹתָם
  choice: 像刻印章一样
  rationale: 指印章式的阴刻工艺；用方式状语表达，与前后文自然衔接，同时保留古代印章雕刻的意象。
- source_word: תְּפַתַּח
  choice: 刻
  rationale: 这里指把名字刻入宝石；“刻”简洁自然，不额外限定具体雕刻技术。
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: 这两块宝石
  rationale: 原词本义为“石头”，但前文明确是用于以弗得的贵重宝石；中文说“两块宝石”既清楚又符合语境。
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: 把以色列众子的名字……刻在……上
  rationale: 介词短语在此表达刻写内容和所在表面；调整语序以符合现代汉语，同时保留“以色列众子”的家族及支派名称。
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: 把宝石镶在金座中
  rationale: 被动分词表示宝石被环绕、嵌置于金质托座中；“镶在金座中”自然表达珠宝镶嵌关系，且不臆断具体古代工艺。
- source_word: תַּעֲשֶׂה אֹתָם
  choice: 又要把宝石……
  rationale: 按语境理解为把两块宝石制作成被金座围嵌的形态；为避免中文代词指向含混，复现“宝石”。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的性别化家族称谓
  choice: 以色列众子
  alternative: 以色列的子孙／以色列人
  rationale: 此处直接关联雅各（以色列）的十二个儿子及由他们得名的支派，因此保留“众子”既忠于阳性家族称谓，也保留其族谱背景；不将其泛化为全体以色列人。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“金座”指承托、围嵌宝石的金质镶座，避免较生僻的“槽托”或可能令人误解的“金框”。全句保持命令语气及工艺说明的层次。
