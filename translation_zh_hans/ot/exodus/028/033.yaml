base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: zh_hans
  text: 你要在袍子下摆四周做蓝色、紫色和朱红色线的石榴[a]，又要在石榴之间、沿着下摆四周安上金铃铛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“石榴形的装饰”。希伯来文直译为“石榴”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做
  rationale: 在连续的制作指示中，带连接词的完成式表达命令；用“你要”符合现代汉语规章式指令。
- source_word: עַל שׁוּלָיו
  choice: 在袍子下摆
  rationale: שׁוּלָיו指衣服的下缘；根据上文所述之袍补出“袍子”，使所指清楚。
- source_word: רִמֹּנֵי
  choice: 石榴
  rationale: 原文直接使用“石榴”一词，虽在此很可能指石榴形装饰，正文保留其具体意象，并以脚注说明。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 蓝色、紫色和朱红色线
  rationale: 三项是会幕纺织品常用的染色材料；“线”由衣饰制作语境补出，使汉语自然，也表明石榴是用彩线制成，而非三种颜色的果实。
- source_word: סָבִיב
  choice: 周围；环绕整个下摆
  rationale: 该词在本节两次出现，强调装饰环绕下摆一周；译文分别保留这一分布和范围含义。
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: 又……安上金铃铛
  rationale: 连接词引入另一类装饰；“金铃铛”准确表达金制的铃，补入“安上”符合汉语制作指令。
- source_word: בְּתוֹכָם
  choice: 在石榴之间
  rationale: 字面为“在它们中间”，所指是石榴；明说“石榴”可避免代词含混，并自然表达铃铛夹置其间的空间关系。
theological_decisions: []
