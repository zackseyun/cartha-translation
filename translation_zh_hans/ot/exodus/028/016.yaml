  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: zh_hans
  text: 要做成正方形，且为双层[a]；长一拃，宽一拃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“折叠成双层”。希伯来语说明胸牌呈双层的形态，可能是把材料对折而成。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: 正方形
  rationale: 该词在这里说明胸牌四边构成方形；“正方形”是现代汉语中准确、自然的表达。
- source_word: יִהְיֶה
  choice: 要做成
  rationale: 未完成时在制作规程中表达规定或要求；结合器物制作语境译为“要做成”，比静态的“是”更自然。
- source_word: כָּפוּל
  choice: 做成双层
  rationale: 该被动分词表示器物呈双重或折叠后的双层形态。“做成双层”保留结果状态，同时不把具体制作方法绝对化。
- source_word: זֶרֶת
  choice: 一拃
  rationale: 该词指手掌张开时拇指尖至小指尖的长度。“拃”是对应这一长度单位的准确汉语名称。
- source_word: אָרְכּוֹ
  choice: 长
  rationale: 在汉语尺寸说明中，“长一拃”自然简洁，所指仍是胸牌的长度。
- source_word: וְזֶרֶת
  choice: 宽一拃
  rationale: 连词连接第二项尺寸；汉语按“长……宽……”的惯用结构表达，无须机械重复“和”。
- source_word: רָחְבּוֹ
  choice: 宽
  rationale: 该词表示宽度；在尺寸公式中译作“宽”符合现代汉语习惯。
