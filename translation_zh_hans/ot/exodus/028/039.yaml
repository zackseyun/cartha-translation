  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: zh_hans
  text: 你要用细麻布织成带方格纹的内袍[a]，用细麻布做头巾，又要做一条腰带，用绣工的手艺制作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把细麻布内袍织成格纹。”希伯来语动词很可能指制作带纹样的织物。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּצְתָּ
  choice: 织成带方格纹的
  rationale: 该动词在祭司衣服的语境中很可能指制成有格纹或图案的织物；此译法既表达纺织动作，也保留成品纹样的含义。
- source_word: הַכְּתֹנֶת
  choice: 内袍
  rationale: כְּתֹנֶת 指贴身穿着的长衣；在祭司服饰语境中，“内袍”既自然，也可避免与外层的袍服混淆。
- source_word: שֵׁשׁ
  choice: 细麻布
  rationale: 在会幕和祭司织物的语境中，שֵׁשׁ 指优质细麻织料；“细麻布”准确而符合现代中文圣经语体。
- source_word: מִצְנֶפֶת
  choice: 礼冠
  rationale: 此词指大祭司缠裹式的正式头饰。“礼冠”在中文中简洁庄重，并表明其礼仪用途；具体形制不必在正文中过度解释。
- source_word: אַבְנֵט
  choice: 腰带
  rationale: 该词指祭司服装中围腰的长带；“腰带”是现代中文最清楚自然的对应词。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 是绣工的手艺
  rationale: 保留希伯来语以工匠及其技艺来描述制品的表达，同时自然地传达装饰性刺绣工艺。
