  text: 第二行是绿松石[a]、蓝宝石和钻石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里几种古代宝石的确切种类都不能确定。“绿松石”也可译作“祖母绿”或“红榴石”；“蓝宝石”可能指“青金石”；“钻石”也可能是“风信子石”或“碧玉”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: 行
  rationale: טוּר在胸牌宝石的排列语境中指一行或一列；现代汉语用“行”最自然。句首的וְ在连续列举中不必机械译成“和”，以免中文生硬。
- source_word: הַ/שֵּׁנִי
  choice: 第二
  rationale: 序数词修饰“行”，直译为“第二”。
- source_word: נֹפֶךְ
  choice: 绿松石
  rationale: 这种古代宝石的确切所指不确定；“绿松石”是可行的现代对应词，其他主要可能性收入脚注。
- source_word: סַפִּיר
  choice: 蓝宝石
  rationale: 传统上译为“蓝宝石”，但古代所指也可能是青金石；正文采用读者熟悉的名称，同时用脚注保留不确定性。
- source_word: וְ/יָהֲלֹם
  choice: 和钻石
  rationale: יָהֲלֹם所指的宝石无法完全确定；“钻石”是常见传统译法，连接词וְ自然译作“和”，其他可能译名见脚注。
