  yaml_path: translation/ot/exodus/028/020.yaml
  text: 'And the fourth row: beryl[a], onyx, and jasper; they shall be set in gold in their settings.'
translation:
  language: zh_hans
  text: 第四行：水苍玉[a]、缟玛瑙和碧玉；都要镶在金制的镶座中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 祭司胸牌上若干宝石的确切种类不能确定。תַּרְשִׁישׁ传统上常译作“水苍玉”，也有人认为是贵橄榄石或黄玉；שֹׁהַם传统上常译作“缟玛瑙”，也有其他说法。
    reason: 说明古代宝石名称的词义与矿物鉴定存在不确定性，避免正文译名显得过于确定。
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: 第四行
  rationale: טוּר在胸牌宝石清单中指横向排列的一行；הָרְבִיעִי是序数词“第四”。中文省去句首连接词，使清单表达自然。
- source_word: תַּרְשִׁישׁ
  choice: 水苍玉
  rationale: 这种古代宝石的确切矿物种类不能确定；“水苍玉”是对应绿柱石（beryl）的传统、可辨认译名，并以脚注保留不确定性。
- source_word: שֹׁהַם
  choice: 缟玛瑙
  rationale: 该词所指宝石存在争议；“缟玛瑙”对应传统的onyx译法，比泛称“玛瑙”更具体，同时不在正文中过度解释。
- source_word: יָשְׁפֵה
  choice: 碧玉
  rationale: 通常认定为jasper；“碧玉”是现代中文圣经及宝石名称中通行、自然的对应词。
- source_word: מְשֻׁבָּצִים
  choice: 镶嵌
  rationale: 被动分词描写宝石被安置在镶座中的状态；中文用“要镶嵌”结合יִהְיוּ表达制作规定。
- source_word: זָהָב
  choice: 金
  rationale: 直接表达镶托的材料。
- source_word: יִהְיוּ
  choice: 都要
  rationale: 未完成式在制作指令中带有规定性；“都要”自然传达每颗宝石均须如此安置。
- source_word: בְּמִלּוּאֹתָם
  choice: 在各自的金托中
  rationale: 在会幕工艺语境中，מִלּוּאִים指容纳、固定宝石的镶座或托座；“各自的”保留第三人称复数词尾，“金托”与前面的זָהָב合并成自然中文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的制作指令语体。“金托”比直译“填充物”更符合珠宝镶嵌语境；将分词与未完成式译作“都要镶嵌”，兼顾规定语气和自然中文。
