base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: zh_hans
  text: 他们要用金子[a]、蓝色线、紫色线、朱红色线和捻成的细麻线，以精巧的工艺[b]制作以弗得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金线”。希伯来文只说“金子”，但在这里的纺织制作语境中，可能指加工后织入布料的金线。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“巧匠的工艺”或“有技巧的匠人所做的工”。希伯来文所指的是经过构思、带有图案的精巧制作。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: 他们要……制作
  rationale: 在连续的指示语境中，这一形式表达命令性的安排；“要……制作”既自然，也保留规章语气。
- source_word: הָאֵפֹד
  choice: 以弗得
  rationale: 这是祭司礼服的专门名称，具体形制难以用普通服饰词准确对应，因此沿用已通行的音译。
- source_word: זָהָב
  choice: 金子
  rationale: 希伯来文只说“金子”；虽然后文制造语境表明它可能被加工成金线，这里不把“线”直接加入正文。
- source_word: תְּכֵלֶת
  choice: 蓝色线
  rationale: 该词本指蓝色染料或染成的蓝色材料；在纺织材料清单中译作“蓝色线”，符合中文表达和制造语境。
- source_word: וְאַרְגָּמָן
  choice: 紫色线
  rationale: 这是会幕用料中常见的紫色染料或染色材料；“紫色线”清楚呈现其纺织用途。
- source_word: תּוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该复合语表示朱红色的染色材料；“朱红色线”既保留传统色彩称谓，也说明这里所列的是纺织用料。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻的细麻
  rationale: שֵׁשׁ 指优质细麻，מָשְׁזָר 表示经过搓捻；此译保留两项信息，并避免额外规定具体纱线形态。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 采用巧匠的工艺
  rationale: 该短语指经过构思、富有技艺的图案或织造工艺；“巧匠的工艺”不把它过窄地限定为刺绣。
