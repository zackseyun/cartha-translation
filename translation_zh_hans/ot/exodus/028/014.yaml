  yaml_path: translation/ot/exodus/028/014.yaml
  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
translation:
  language: zh_hans
  text: 要用纯金做两条绞成绳状的链子[a]；要把这些绞成的链子安在镶座上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可译作：“要做两条纯金链子，绞成绳索的样式。”原文连续使用两个彼此相关、但含义不易完全确定的词，描述绞合、编结或绳索状的工艺。
    reason: lexical_alternative
  - marker: b
    text: “镶座”也可译作“托座”或“金丝镶座”，指装在祭司礼服上的金质框座。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת
  choice: 两条……链子
  rationale: שְׁתֵּי是阴性数词“二”，与复数名词שַׁרְשְׁרֹת搭配；在祭司服饰的金工作品语境中，“链子”比“绳子”更贴切。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 这是圣所器物和祭司服饰材料的常用表达，指品质纯净的金。
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: 绞成绳状
  rationale: 这两个较难确定且彼此呼应的表达都指向绳索般的绞合、编结工艺；译文采用自然的中文合并表达，脚注保留其措辞和分析上的不确定性。
- source_word: תַּעֲשֶׂה אֹתָם
  choice: 要……做
  rationale: 按上下文译为给摩西的制作指令；中文以“要”表达命令语气。
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: 这些绞成的链子
  rationale: 原文再次提到链子，并以与绳索、绞合有关的词修饰；此译法既保留重复，又避免生硬的“绳状链子”。
- source_word: עַל הַמִּשְׁבְּצֹת
  choice: 安在镶座上
  rationale: מִשְׁבְּצוֹת指承托或固定宝石、链饰的金质镶座；“安在”符合服饰配件的装接语境。
