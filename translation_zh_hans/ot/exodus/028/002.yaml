base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: zh_hans
  text: 你要为你哥哥亚伦做圣衣，为荣耀，为华美。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为荣耀，为华美”也可译作“为尊荣和美丽”或“为荣耀和荣美”。
    reason: 说明לְכָבוֹד וּלְתִפְאָרֶת的词义范围；原文的目的短语未明确限定荣耀或华美归于谁。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做
  rationale: 连词加Qal完成式第二人称阳性单数，在连续指示的语境中表达命令；“你要……做”在现代汉语中自然保留指令语气。
- source_word: בִגְדֵי קֹדֶשׁ
  choice: 圣衣
  rationale: 该结构直指分别为圣、供神圣用途的衣服；“圣衣”简洁、庄重，也避免引入后世教会专用术语。
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: 为你哥哥亚伦
  rationale: 按上下文，说话对象摩西是亚伦的弟弟，因此现代汉语用“哥哥”自然呈现亲属关系；人名采用通行译名“亚伦”。
- source_word: לְכָבוֹד
  choice: 使他尊贵
  rationale: כבוד在此可指荣耀、尊荣或显出的尊贵；与祭司衣服的作用相连，“使他尊贵”既自然，又不把所指过度限定为人的荣誉或神的荣耀。
- source_word: וּלְתִפְאָרֶת
  choice: 而荣美
  rationale: תפארת可表达华美、荣美或光彩；“荣美”兼顾外在美感与庄严光彩，并与“尊贵”形成对应。
theological_decisions:
- issue: 祭司圣衣目的短语的所指与范围
  choice: 译作“使他尊贵而荣美”，保留圣衣所彰显的尊严与华美，并让亚伦作为直接承受者在汉语中自然显明。
  alternative: “为荣耀，为华美”或“使他有尊荣和华美”
  rationale: 两个לְ目的短语语义宽广，既涉及祭司职分的尊荣，也涉及衣服可见的华美；译文不将“荣耀”专断地限定为只属于神或只属于亚伦。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“圣衣”为经文语境中自然的宗教用语；“尊贵而荣美”避免生硬直译，同时保留原文的平行结构、庄严感和语义张力。
