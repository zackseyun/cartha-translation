  text: And you shall take two onyx stones and engrave on them the names of the sons of Israel[a].
translation:
  language: zh_hans
  text: 你要取两块缟玛瑙[a]，在上面刻上以色列的儿子们的名字。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 shoham 指一种宝石，传统上常译作“缟玛瑙”；其确切为何种矿石并不确定，也有人认为可能是红缟玛瑙或绿柱石。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要取
  rationale: 带连接词的完成式在连续指示中表达命令；“你要取”自然、庄重，并保留指令语气。
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: 两块红玛瑙
  rationale: שֹׁהַם 指一种宝石，但确切矿物种类不明。“红玛瑙”是中文圣经传统中较为人熟悉的译法，词义不确定性以脚注说明。
- source_word: וּפִתַּחְתָּ
  choice: 刻上
  rationale: 此处指在宝石表面镌刻名字；“刻上”准确且符合现代汉语表达。
- source_word: עֲלֵיהֶם
  choice: 在上面
  rationale: 所指为前述两块宝石；汉语用“在上面”自然清楚。
- source_word: שְׁמוֹת
  choice: 名字
  rationale: 作为“刻上”的宾语，在汉语中无需另加定指成分，所指已由后置领属语明确。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 这里具体指雅各（以色列）的儿子们，即各支派的先祖，而非泛指以色列民族；“以色列众子”保留这一亲属关系和复数含义。
