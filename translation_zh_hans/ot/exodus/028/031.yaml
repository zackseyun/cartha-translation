  text: You shall make the robe of the ephod entirely of blue[a][b].
translation:
  language: zh_hans
  text: “你要做以弗得的外袍，整件要用蓝色材料[a][b]制成。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“全都是蓝色材料”，意思是这件外袍完全由蓝色材料制成。
    reason: lexical_alternative
  - marker: b
    text: 译作“蓝色材料”的希伯来语词可指一种昂贵的染色织物，颜色范围从蓝色到蓝紫色。
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要做
  rationale: 在连续的制作指示中，带连接词的完成式表达命令；“你要做”自然保留指示性语气。
- source_word: מְעִיל
  choice: 外袍
  rationale: 指祭司礼服中的袍服；“外袍”比“斗篷”等译法更符合此处衣着语境，也易于现代读者理解。
- source_word: הָאֵפֹד
  choice: 以弗得
  rationale: 这是祭司礼服的专门名称，采用通行音译，避免以不确定的描述性名称取代。
- source_word: כְּלִיל
  choice: 全用……制成
  rationale: 表达整体、完全之意；结合后面的材料名称，译成“全用……制成”符合现代汉语习惯。
- source_word: תְּכֵלֶת
  choice: 蓝色料
  rationale: 该词在会幕和祭司礼服语境中指用贵重染料染成的蓝至蓝紫色材料；正文采用清楚易懂的“蓝色料”，色调范围在脚注说明。
theological_decisions: []
