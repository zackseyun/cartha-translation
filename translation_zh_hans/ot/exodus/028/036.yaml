  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּ/פִתַּחְתָּ֤ עָלָי/ו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: zh_hans
  text: “你要做一块纯金制的牌，如刻印章一般在上面刻上：‘归雅威为圣[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣洁归于雅威。”
    reason: 原文 קֹדֶשׁ 可按“圣／为圣”理解，也可用抽象名词“圣洁”表达；两者都能与表示归属、奉献的 לַיהוָה 搭配。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要做
  rationale: 这是制作祭司服饰的一连串指示之一；“你要做”自然地保留了命令和承接语气。
- source_word: צִּיץ
  choice: 牌
  rationale: 该词本可指花朵或花饰，但本节所指是固定在大祭司冠上的金制饰件；“牌”简明地表达其形制与承载铭文的用途，同时避免过度限定为现代意义的额饰。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 直接表达材质及其纯度，符合现代汉语金工语境。
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: 在上面刻上
  rationale: 此处动词指在金属器物上雕刻文字；“刻上”既准确又自然。
- source_word: פִּתּוּחֵי חֹתָם
  choice: 按刻印章的方法
  rationale: 表达铭文要采用印章雕刻的方式，既反映复数形式所指的雕刻工艺，也避免生硬直译。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 归雅威为圣
  rationale: 保留原文铭文的简洁和奉献、分别为圣的含义；不把它误解为单纯陈述“雅威是圣洁的”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，不以“主”这一称号替换。
- issue: 铭文 קֹדֶשׁ לַיהוָה 的语法与意义
  choice: 归雅威为圣
  alternative: 圣洁归于雅威
  rationale: קֹדֶשׁ 可表达“圣、圣洁、圣物”等相关含义，而 לַיהוָה 带有归属或奉献意味。正文采用自然且适合铭文的分别为圣表达，脚注保留抽象名词式的可行译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“纯金牌”简洁说明器物与材质；铭文保持短促、正式，并用脚注保存原文名词性表达的歧义。
