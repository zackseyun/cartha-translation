  text: a gold bell and a pomegranate[a], a gold bell and a pomegranate[b], around the hem of the robe all around.
translation:
  language: zh_hans
  text: 一个金铃铛、一个石榴[a]，一个金铃铛、一个石榴，在袍子的下摆上，四围一圈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “石榴”在这里很可能指石榴形的饰物，安置在铃铛之间。
    reason: cultural_note
  - marker: b
    text: 或译：“沿着袍子的整个下摆。”希伯来语把意为“在……上”的介词与意为“四围、周围一圈”的副词连用。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: 铃铛
  rationale: 该词在祭司服饰的语境中指系在袍子下摆的小铃；“铃铛”是现代汉语中自然、准确的表达。
- source_word: זָהָב
  choice: 金
  rationale: 这里表示铃铛的材质；“金铃铛”简洁地保留了希伯来语“铃铛—金”的物质限定关系。
- source_word: רִמּוֹן
  choice: 石榴
  rationale: 该词通常意为“石榴”。本处按上下文指石榴形的饰物，但正文保留原词的简洁表达，具体含义在脚注说明。
- source_word: עַל
  choice: 沿着
  rationale: עַל本可译为“在……上”，但与“下摆”和סָבִיב连用时表示饰物环绕下摆分布；“沿着”较符合现代汉语习惯。
- source_word: שׁוּלֵי
  choice: 下摆
  rationale: 该复数形式在衣服语境中指衣服下部的边缘；“下摆”比“衣边”更明确、自然。
- source_word: מְעִיל
  choice: 袍子
  rationale: 在祭司服饰语境中，该词指袍服；“袍子”通俗而不失庄重，也与上下文的特定礼服相符。
- source_word: סָבִיב
  choice: 整个
  rationale: 该副词表示“四围、周围一圈”。与עַל合译为“沿着……整个下摆”，自然表达饰物环绕下摆一周的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的书面汉语。保留原文“一个金铃铛、一个石榴”的重复节奏；末尾补出“排列”，使这个承接上文的希伯来语片段在汉语中句法完整。“沿着袍子的整个下摆”自然呈现עַל与סָבִיב合在一起的环绕含义。
