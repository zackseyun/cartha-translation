  - severity: low
    issue: “编绳链”搭配不自然
    rationale: 现代汉语中“编织的金链”更顺畅，也足以表达 עֲבֹתֹת 所含编结、扭绞的链饰含义。
  revised_text: 要把两条编织的金链[a]系在胸牌[b]两端的两个环上。
