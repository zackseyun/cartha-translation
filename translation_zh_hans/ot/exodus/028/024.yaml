- from: 要把两条金制的编绳链[a]系在两个环上，就是胸牌[b]的两端。
  to: 要把两条编织的金链[a]系在胸牌[b]两端的两个环上。
  rationale: 调整语序以准确表达两个环位于胸牌两端，并将不自然的“编绳链”改为“编织的金链”。其余术语和脚注可保留。
