  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: zh_hans
  text: 要把两条编织的金链[a]系在胸牌[b]两端的两个环上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“扭成的链”。
    reason: lexical_alternative
  - marker: b
    text: 传统上也译作“胸甲”；这里的希伯来词指祭司礼服上佩在胸前的构件，并非护身铠甲。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: 要把……系在
  rationale: 该形式在连续的制作指示中表达命令；结合链与环的关系，用“系在”比笼统的“放在”更准确自然。
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: 两条金制的编绳链
  rationale: עֲבֹתֹת 指绳索状、交织或扭编的链饰；“编绳链”兼顾其链状用途与编扭构造，“金制的”明确材料。
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: 系在两个环上
  rationale: עַל 在此表示链与环的连接位置；中文以“系在……上”自然表达固定或连接。
- source_word: אֶל קְצוֹת הַחֹשֶׁן
  choice: 就是胸牌的两端
  rationale: קְצוֹת 表示两端或边端；אֶל 在此结合上下文说明两个环所在的具体部位。“就是”澄清“两个环”与“胸牌两端”的位置关系，同时不增添制作细节。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: 此词指大祭司胸前所佩戴的礼仪性织物构件，并非金属护甲；“胸牌”在现代中文中简洁、庄重，也避免“胸甲”带来的军事含义。
