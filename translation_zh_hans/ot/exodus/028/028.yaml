base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: zh_hans
  text: 要用蓝色线绳，把胸牌上的环系在以弗得的环上，使胸牌留在以弗得的巧工织带上，不可让胸牌从以弗得上松脱。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: 系在
  rationale: 该动词表示把两件东西扣紧或系牢；结合环与线绳的语境，“系在”自然且不过度限定具体系法。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: 这里指大祭司佩在胸前、连于以弗得的礼服部件，并非护身铠甲；“胸牌”是现代中文圣经语境中清楚而简洁的称呼。
- source_word: מִטַּבְּעֹתָיו
  choice: 胸牌上的环
  rationale: 后缀所指为胸牌；将代词所指明说，可避免中文读者误解，同时保留从这些环连接至以弗得之环的关系。
- source_word: טַבְּעֹת הָאֵפֹד
  choice: 以弗得的环
  rationale: 按希伯来语属格结构直译，清楚保留礼服各部件之间的连接关系。
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: 用一根蓝色线绳
  rationale: פְּתִיל 指线、绳；תְּכֵלֶת 指会幕及祭司衣料所用的蓝色染料或染成的材料。“蓝色线绳”适合此处纺织品语境。
- source_word: לִהְיוֹת עַל
  choice: 使……贴在……上
  rationale: 不定式表达目的或结果；结合随后“不可松脱”的说明，“贴在……上”自然表达固定后的位置，又不引入“安放”等额外动作。
- source_word: חֵשֶׁב הָאֵפֹד
  choice: 以弗得精工织成的带子
  rationale: חֵשֶׁב 在此指以弗得本身的织带或腰带；“精工织成”呼应本章对其工艺的描述，并避免把它误解为普通腰带。
- source_word: וְלֹא יִזַּח
  choice: 不可让……松脱
  rationale: 该形式表示被移开、脱离或松开；在环和绳固定衣饰的语境中，“松脱”准确表达实际结果。
- source_word: מֵעַל הָאֵפֹד
  choice: 从以弗得上
  rationale: 保留 מֵעַל 所表达的从其上方位置脱离之意，中文简洁自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪服饰说明语体。保留“以弗得”这一已通行的专名；用“胸牌”区别于军用护甲。原文没有需要以脚注保留的神学歧义。
