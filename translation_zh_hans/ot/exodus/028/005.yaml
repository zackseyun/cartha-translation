  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: zh_hans
  text: 他们要取金子、蓝色线、紫色线[a]、朱红色线[b]和细麻布。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓝色线”和“紫色线”也可分别译作“蓝色料”和“紫色料”；希伯来文所指的是染色的纺织材料，并不只是抽象的颜色。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“朱红之虫”，是指用虫源染料染成的朱红色材料，因此译作“朱红色线”。
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: 他们
  rationale: 希伯来文使用独立代词，明确指向上文所说的工匠；现代汉语用“他们”自然保留这一显明的主语。
- source_word: יִקְחוּ
  choice: 要取
  rationale: 未完成式在会幕制作命令中具有指示意味；“要取”简洁自然地表达命令或规定。
- source_word: הַזָּהָב
  choice: 金子
  rationale: 此处指制作祭司衣服所用的指定金属材料；汉语材料清单中不必另行表达希伯来文定冠词。
- source_word: הַתְּכֵלֶת
  choice: 蓝色线
  rationale: 该词在会幕纺织语境中指蓝色染制的纺织材料，而非抽象颜色；结合制衣背景译作“蓝色线”清楚自然。
- source_word: הָאַרְגָּמָן
  choice: 紫色线
  rationale: 该词指紫色染制的纺织材料；“紫色线”与上下文及并列清单相称。
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: 朱红色线
  rationale: 该习语指用介壳虫来源染料染成的朱红色纺织材料；“朱红色线”既传达颜色，也明确材料性质。
- source_word: הַשֵּׁשׁ
  choice: 细麻
  rationale: שֵׁשׁ在会幕语境中通常指优质细麻材料；“细麻”符合现代中文圣经语体并保留材质含义。
