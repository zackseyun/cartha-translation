  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: zh_hans
  text: 这些宝石要与以色列的儿子的名字相对应[a]，按他们各自的名字，共十二块。每块都要像刻印章那样刻上相应的名字[b]，归十二个支派。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“要按以色列的儿子的名字”，或“要带有以色列的儿子的名字”。希伯来语直译近于“宝石要按着／关于以色列的儿子的名字”。
    reason: 保留介词עַל在此处可能表达对应、依据或承载名字的语义幅度。
  - marker: b
    text: 或译：“要有印章式的雕刻，每块按自己的名字”。
    reason: 希伯来语פִּתּוּחֵי חוֹתָם是名词结构，可指印章式雕刻，也可指像刻印章那样刻制。
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: 这些宝石
  rationale: 承接上文胸牌上的宝石；现代汉语用“这些”自然表达希伯来语定冠词所指的特定宝石。
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: 要与以色列众子的名字相对应
  rationale: 动词直译为“要成为/要是”，עַל在这里表达对应或关涉关系。“相对应”既通顺，也避免把名字误解为位于宝石之下。
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: 按他们的名字共十二块
  rationale: 补出量词“块”以符合汉语表达，同时保留十二块宝石与十二个名字逐一对应的意思。
- source_word: פִּתּוּחֵי חוֹתָם
  choice: 像印章一样刻上
  rationale: 该结构指印章式的雕刻；译文保留印章的比喻，并用动词化表达使汉语自然。
- source_word: אִישׁ עַל שְׁמוֹ
  choice: 每块……各自的名字
  rationale: אִישׁ在此作逐一分配用法。“每块……各自”清楚表达每一块宝石刻一个相应名字，避免汉语中“他的名字”指代含混。
- source_word: לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: 代表十二个支派
  rationale: לְ表达归属、关涉或代表关系；按本段胸牌象征功能译为“代表”，比生硬的“为十二支派”更清楚。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别和盟约表达
  choice: 以色列众子
  alternative: 以色列子孙／以色列人
  rationale: 保留希伯来语“以色列之子”的男性复数和族长谱系色彩，不将其静默中性化；“众子”在现代汉语中也能明确指向以色列各支派的祖先。
- issue: 宝石与十二支派的关系
  choice: 代表十二个支派
  alternative: 归于十二个支派／为十二个支派
  rationale: 上下文表明刻名的宝石具有代表功能；此译法不额外规定其更深层神学意义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“以色列众子”有意保留原文的男性谱系表达；其余句式适度汉语化，并以脚注呈现介词和印章雕刻短语的真实歧义。
