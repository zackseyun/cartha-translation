  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: zh_hans
  text: 你要为亚伦的儿子们做长衣，也要为他们做腰带和头巾[a]，为尊荣和华美。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“礼冠”或“帽子”；这种祭司头饰的具体形制不能确定。
    reason: 保留מִגְבָּעוֹת在形制上的词义不确定性。
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: 为亚伦的儿子们
  rationale: 按字面保留亚伦与其儿子们的直接父子关系，不扩大为泛指后裔。
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: 要……做
  rationale: 在指示性语境中表达命令，既保留律例的语气，也符合现代汉语习惯。
- source_word: כֻתֳּנֹת
  choice: 内袍
  rationale: 该词指穿在身上的基本长衣；“内袍”在祭司服饰语境中明确自然，也避免现代“外套”所造成的误解。
- source_word: אַבְנֵטִים
  choice: 腰带
  rationale: 指围束于腰间的带状服饰；“腰带”是现代汉语中清楚而不过度限定材质和形制的对应词。
- source_word: מִגְבָּעוֹת
  choice: 头巾
  rationale: 指亚伦众子所戴的祭司头饰，具体形制难以确定；“头巾”能表达包裹式头饰，同时以脚注保留其他可能译法。
- source_word: לְכָבוֹד
  choice: 以显出尊荣
  rationale: כָּבוֹד在此可指荣耀、尊贵或威仪；“尊荣”适合服饰所体现的庄重身份，并避免把抽象的“荣耀”读成额外的神学象征。
- source_word: וּלְתִפְאָרֶת
  choice: 与华美
  rationale: תִּפְאֶרֶת表示美丽、华美或辉煌；“华美”既有审美意味，也保持经文庄重的语域。
theological_decisions:
- issue: 祭司服饰用途短语的含义
  choice: 以显出尊荣与华美
  alternative: 为荣耀，为华美；为尊贵与荣美
  rationale: 希伯来文说明这些服饰具有彰显尊贵和美感的用途。“以显出”自然表达目的关系，同时不引入经文没有明说的后期象征解释。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“也要为他们做腰带和头巾”合并希伯来文重复的动词结构，使汉语自然，同时完整保留三类服饰及命令语气。脚注标记置于所解释的“头巾”之后。
