base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: zh_hans
  text: 要把它系在一条蓝色的带子[a]上，安在礼冠上；它要在礼冠的正面[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蓝色的绳子”或“蓝色的线”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“朝着（或对着）礼冠的前面”，意思是安在礼冠前侧。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: 要把它系在……上
  rationale: שׂים的基本义是“放置、安放”；结合金牌与带子的关系，中文用“系在……上”自然表达借带子固定的动作，同时不改变安放的指令含义。
- source_word: פְּתִיל
  choice: 带子
  rationale: פְּתִיל可指线、绳或带状系物。此处用于把金牌固定在头饰上，“带子”在现代中文中自然，并保留具体形态上的不确定性。
- source_word: תְּכֵלֶת
  choice: 蓝色
  rationale: 该词指会幕用料中特有的贵重蓝色染料或染色织物；确切色调可能偏蓝紫，但“蓝色”清楚、稳妥。
- source_word: הַמִּצְנָפֶת
  choice: 礼冠
  rationale: 该词指大祭司缠裹式的正式头饰。“礼冠”既体现其礼仪用途，又比日常的“头巾”庄重；并不主张它是硬质冠冕。
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  choice: 在礼冠的正面
  rationale: 该短语直指朝向或相对于礼冠前面的位置；译作“在……正面”符合中文安放说明，同时以脚注保留原文的方向性表达。
- source_word: יִהְיֶה
  choice: 它要在
  rationale: 保留原文末尾对位置要求的重复强调，中文表达简洁而具有指令语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的法规指令语体。句中保留希伯来文对安放位置的重复；“礼冠”用于大祭司的礼仪头饰，并避免让读者误以为只是普通头巾。
