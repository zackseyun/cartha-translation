  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: zh_hans
  text: 袍子中间要有一个供头穿过的开口；开口四周要有织成的边缘[a]，像铠甲的开口一样，使它不至于撕裂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铠甲”也可译作“锁子甲”或“护胸甲”。这里的希伯来词很少见；此处是把袍子的开口比作不易撕裂的加固甲衣开口。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: 领口
  rationale: פֶּה本义为“口”，在衣服语境中指开口；与רֹאשׁוֹ连用，指供头穿过的开口。现代汉语以“领口”表达最自然。
- source_word: בְּתוֹכוֹ
  choice: 正中
  rationale: 表示开口位于袍子中央；“正中”简洁地传达衣服结构上的位置。
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: 织成的滚边
  rationale: שָׂפָה在此指开口周围的边缘，מַעֲשֵׂה אֹרֵג说明其为织工所作。“滚边”自然表达经过加固处理的衣缘，“织成的”保留工艺信息。
- source_word: לְפִיו סָבִיב
  choice: 领口周围
  rationale: פֶּה再次指衣服的开口，סָבִיב表示环绕四周。
- source_word: כְּפִי תַחְרָא
  choice: 像铠甲的领口
  rationale: תַחְרָא是罕见词，传统上理解为铠甲、锁子甲或护胸甲；正文采用涵盖性较强的“铠甲”，并以脚注保留词义的不确定性。
- source_word: לֹא יִקָּרֵעַ
  choice: 使它不致撕裂
  rationale: Niphal形式表达被动或结果意义；结合加固领口的语境，译为目的或结果句自然且准确。
