  register: 采用现代、庄重而易懂的服装用语。“领口”避免直译为生硬的“头的开口”；“滚边”兼顾边缘与加固功能。保留罕见词תַחְרָא所指甲衣种类的不确定性，并确保脚注标记[a]出现在正文中。
