  text: 你要在胸牌上做两个金环，把这两个环安在胸牌的两端。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……做
  rationale: 带连接词的完成式处于连续的制作指示中，表达命令；“你要……做”自然保留指令语气。
- source_word: עַל הַחֹשֶׁן
  choice: 在胸牌上
  rationale: עַל在此表达环与胸牌的空间及附着关系；“在……上”直接而自然。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: 本章指大祭司服饰上的专用物件；“胸牌”是现代中文中简洁、通行的对应词。
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: 两个金环
  rationale: זָהָב说明环的材质；“金环”准确且符合自然中文表达。
- source_word: וְנָתַתָּ
  choice: 把……安在
  rationale: 动词在此指将部件放置并装到指定位置；“安在”比单纯“放在”更符合制作与连接的语境。
- source_word: אֶת שְׁתֵּי הַטַּבָּעוֹת
  choice: 把这两个环
  rationale: 定冠词回指刚才所说的两个金环；中文用“这”清楚体现回指关系。
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: 在胸牌的两端
  rationale: קָצֶה表示边缘的尽头或端部；“两端”直接保留希伯来文的数量与位置描述。
