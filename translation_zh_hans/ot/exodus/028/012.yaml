id: EXO.28.12
reference: Exodus 28:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: zh_hans
  text: 你要把这两块宝石安在以弗得的肩带上，作为以色列众子[a]的纪念石[b]。亚伦要在耶和华面前，把他们的名字担负在自己的双肩上，作为纪念。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列众子”是希伯来语的家族性表达，这里整体指以色列的子民。
    reason: cultural_note
  - marker: b
    text: 或译：“用来记念的宝石”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 你要……安在
  rationale: שׂים表示放置、安放；在制作祭司衣服的语境中，“安在”自然地表达将宝石固定于肩带之上，并保留第二人称单数指令的语气。
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: 这两块宝石
  rationale: 原文直指前文已提到的两块石头；中文以“这两块宝石”承接上下文，不在本节重复补入石种。
- source_word: כִּתְפֹת הָאֵפֹד
  choice: 以弗得的肩带
  rationale: כָּתֵף本义为肩膀，此处指以弗得位于肩部、连接衣身的部分；“肩带”比字面的“肩膀”更符合衣饰语境。
- source_word: אַבְנֵי זִכָּרֹן
  choice: 纪念石
  rationale: 该附属结构可直译为“纪念的石头”；“纪念石”简洁自然，并保留其纪念功能。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留בְּנֵי的家族性表达，同时用“众”表明这里整体指以色列的后裔群体，而不把含义限于个别男性。
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: 亚伦要……担负他们的名字
  rationale: נשׂא可表示携带、承担。“担负”既保留名字实际负在肩上的图像，也不消除祭司代表百姓来到上帝面前的意味。
- source_word: לִפְנֵי יְהוָה
  choice: 带到耶和华面前
  rationale: לִפְנֵי表示在……面前或临到其面前；补出“带到”使其与“担负”在现代汉语中衔接自然。神名按原文专名译作“耶和华”。
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: 在他的双肩上
  rationale: 此处明确是亚伦本人的两肩，与前半节以弗得的肩带有别；“双肩”自然保留原文的具体形象。
- source_word: לְזִכָּרֹן
  choice: 作为纪念
  rationale: 保留与前文זִכָּרֹן的词汇呼应；原文没有明确说明是谁记念谁，译文不予限定。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。现代中文圣经传统中“耶和华”辨识度高，且作为专名呈现；不以“主”替代，因而保留本节直接使用盟约神名这一事实。
- issue: בְּנֵי יִשְׂרָאֵל 的性别与群体含义
  choice: 以色列众子
  alternative: 以色列人
  rationale: “众子”保留原文的亲属与后裔语言；脚注说明它在这里整体指以色列的子民，以免被误解为只涉及男性。
- issue: לְזִכָּרֹן 中记念的主体与对象
  choice: 不明确指定
  alternative: 使耶和华记念他们
  rationale: 上下文容许理解为在耶和华面前使以色列得蒙记念，但本节语法没有明说记念的主体。译作“作为纪念”保留这一开放性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“以弗得”沿用中文圣经中广为人知的祭司衣饰术语；句子分为两句，以清楚呈现安放宝石与亚伦担负名字两个动作。所有脚注标记均置于所解释的词语之后。
