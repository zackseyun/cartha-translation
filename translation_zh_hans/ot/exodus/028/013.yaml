  language: zh_hans
  text: 你要制作金制的镶座[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“镶嵌座”或“花丝镶座”。希伯来语指装饰性的镶座或安装构件；在本段语境中，可能用于连接宝石或金链。
    reason: 词义存在合理的译法差异，且该词本身未明确限定具体形制或工艺。
lexical_decisions:
- source_word: וְ/עָשִׂיתָ
  choice: 你要制作
  rationale: 在连续的制作指示中，וְ连接上下文，中文不必机械译出“并且”；第二人称单数完成式在此具有指令意味，译为“你要制作”自然且庄重。
- source_word: מִשְׁבְּצֹת
  choice: 槽座
  rationale: 该复数名词指装饰性的镶嵌座或承接构件；结合后文金链与肩带的语境，“槽座”既能表达其承托、连接用途，又不把具体工艺限定为金丝细工。
- source_word: זָהָב
  choice: 金
  rationale: 表示槽座的材质；汉语以“金槽座”简洁自然地表达“用金制成的槽座”。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的指令体。“槽座”较“镶框”更能兼顾本节与后续金链连接件的语境；脚注保留“镶座”和“金丝细工”两种理解。
