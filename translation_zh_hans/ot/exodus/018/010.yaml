revisions:
- from: 叶忒罗说：“雅威[a]是当受称颂的！他救了你们脱离埃及人和法老的手，也救了百姓脱离埃及人的手下[b]。”
  to: 叶忒罗说：“雅威[a]是当受称颂的！他从埃及人和法老手中救出你们，又救百姓脱离埃及人的权下[b]。”
  rationale: 仅改正“手下”在现代汉语中的歧义，并相应修订脚注。修订后的“权下”准确表达“在……手之下”的受辖制含义；两次救援及原文第二次较强的从属意象均得到保留。
