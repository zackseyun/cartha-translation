source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: zh_hans
  text: 叶忒罗说：“雅威[a]是当受称颂的！他从埃及人和法老手中救出你们，又救百姓脱离埃及人的权下[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来语神名 יהוה 的音译，传统上也译作“耶和华”或以“上主”代称。
    reason: 说明神名的音译及常见替代译法。
  - marker: b
    text: 原文先说“从埃及的手中”，后说“从埃及的手之下”。“手”及“在手下”是指权势或控制的隐喻；“埃及”在此可指埃及人或埃及势力。
    reason: 说明原文重复而略有变化的权势隐喻，以及“埃及”的集体用法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式承接上文；现代汉语通常不必机械译出连接词，直接用“说”即可自然表达事件推进。
- source_word: יִתְרוֹ
  choice: 叶忒罗
  rationale: 采用现代中文圣经读者熟悉的希伯来人名音译，同时对应希伯来语 Yitrô。
- source_word: בָּרוּךְ יְהוָה
  choice: 雅威是当受称颂的
  rationale: 保留希伯来语祝颂公式的陈述与颂赞力量；此结构也不把它局限为祈愿句。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名直接音译，避免以称号代替原文中的专名。
- source_word: הִצִּיל
  choice: 救……脱离
  rationale: 此处使役形表示使人逃脱敌对权势；“救……脱离”在现代汉语中自然，并保留拯救含义。
- source_word: אֶתְכֶם
  choice: 你们
  rationale: 准确反映第二人称阳性复数宾语；其具体涵盖摩西、以色列人或在场群体，仍由上下文判断。
- source_word: מִיַּד מִצְרַיִם
  choice: 脱离埃及人的手
  rationale: מִצְרַיִם 在“手”的搭配中可按集体意义理解为埃及人；保留“手”的权势隐喻。
- source_word: וּמִיַּד פַּרְעֹה
  choice: 和法老的手
  rationale: 保留原文与前一短语并列的具体意象，不将“手”完全抽象化为“权势”。
- source_word: הָעָם
  choice: 百姓
  rationale: 此处指以色列群体；“百姓”符合庄重叙事语体，也能自然承接上下文。
- source_word: מִתַּחַת יַד מִצְרָיִם
  choice: 脱离埃及人的手下
  rationale: “手下”保留“在手之下”的空间隐喻，并自然表达受埃及人控制、压迫的状态。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名而非一般称号；“雅威”直接音译较可能的希伯来语读音，同时以注释说明传统译名。
- issue: בָּרוּךְ יְהוָה 的语气
  choice: 雅威是当受称颂的
  alternative: 愿雅威受称颂；雅威是可称颂的
  rationale: 希伯来语无系词的被动分词祝颂公式兼有宣告与颂赞色彩；正文采用自然庄重的中文，但不把原文强行限定为单纯祈愿。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“是当受称颂的”保留祝颂公式的礼仪色彩；“手／手下”有意保留原文重复的具体隐喻，同时借助脚注说明其含义。
