base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: zh_hans
  text: 摩西的岳父叶忒罗带上了摩西的妻子西坡拉；此前，她被送走了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在她被送走以后。”希伯来文直译近于“在她的遣离之后”，没有明说是谁送走她；按上下文，也可能指摩西曾让她离开。
    reason: 保留שִׁלּוּחֶיהָ的施事者含混性，并说明语境中的可能理解。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 接来了
  rationale: לקח的基本义是“拿、取、带、接”。此处对象是已离开摩西的西坡拉，而下文说明叶忒罗带她前往摩西那里；“接来了”符合现代汉语叙事，也不把动作窄化为单纯“收留”或“带走”。
- source_word: חֹתֵן מֹשֶׁה
  choice: 摩西的岳父
  rationale: חֹתֵן在此指摩西因婚姻而有的男性亲属，结合叶忒罗的身份译为“岳父”自然明确。
- source_word: צִפֹּרָה
  choice: 西坡拉
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: אֵשֶׁת מֹשֶׁה
  choice: 摩西的妻子
  rationale: 忠实表达原文的属格结构，并保留对西坡拉身份的重复说明。
- source_word: אַחַר
  choice: 此前
  rationale: 原文表示叶忒罗这一行动发生在西坡拉离开之后。中文调整分句次序并用“此前”清楚表达时间关系。
- source_word: שִׁלּוּחֶיהָ
  choice: 摩西曾让她离开
  rationale: 该词是由שלח构成的名词，带第三人称阴性单数后缀，直译为“她的遣离”，没有明说施事者。正文依语境补出最可能的施事者摩西，但以脚注保留原文的含混性；“让她离开”比“休妻”中性，不额外引入婚姻解除的法律含义。
theological_decisions:
- issue: “她的遣离”由谁实施
  choice: 正文把摩西作为语境中隐含的施事者，译作“摩西曾让她离开”。
  alternative: “她被送走以后”或“她离开以后”。
  rationale: 希伯来文使用名词性表达שִׁלּוּחֶיהָ，只说明发生了与“送走/遣离她”有关的事，并未明说施事者。上下文最自然地指向摩西，但这不是语法上明示的信息，因此正文采用语境读法，脚注同时保留被动表达所反映的源文含混。
- issue: שִׁלּוּחֶיהָ是否表示正式离婚
  choice: 不译为“休妻”或“离婚”，而译为“让她离开”。
  alternative: “休了她以后”。
  rationale: 词形本身可指送走、遣离，并不足以确定正式解除婚姻；本节仍称西坡拉为“摩西的妻子”。中性措辞避免加入原文未明确陈述的法律或神学结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“接来了”承接叙事动作；用分号和“此前”避免“在……之后接来……”可能产生的修饰歧义。人名采用简体中文圣经常见形式“叶忒罗”“西坡拉”。
