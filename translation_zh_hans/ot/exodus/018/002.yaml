  naturalness: “接来了”在现代汉语中自然，但因方向性过强而不够贴合原文。“带上了”自然，并能表达叶忒罗将西坡拉带在同行者之中的动作；“此前她被送走了”简洁自然。
  terminology: “叶忒罗”“西坡拉”“摩西的岳父”“摩西的妻子”均合适，语体庄重而易懂。避免“休妻”或“离婚”是必要的，因为该词本身未明确正式解除婚姻。
