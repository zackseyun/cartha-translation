  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: zh_hans
  text: 摩西把雅威为以色列的缘故[a]向法老和埃及所做的一切，以及他们在路上遭遇的一切艰难[b]，都讲给岳父听，也讲了雅威怎样搭救他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因以色列的缘故”或“因为以色列”。
    reason: lexical_alternative
  - marker: b
    text: “一切艰难”也可译作“一切患难”或“一切困苦”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 讲给……听
  rationale: ספר的加强词干在此指叙述、讲述；这一表达自然地体现摩西向岳父详细讲述往事。
- source_word: חֹתְנוֹ
  choice: 岳父
  rationale: 结合上下文，此人是叶忒罗，即摩西的岳父；现代汉语以“岳父”表达最明确自然。
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: 雅威向法老和埃及所做的一切
  rationale: 保留介词ל较中性的关系表达“向……所做”，不额外解释为“攻击”或“惩罚”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: 为以色列的缘故
  rationale: 该短语表示原因或关涉；此译法保留“因以色列而采取行动”以及“为其益处”的语义空间。
- source_word: הַתְּלָאָה
  choice: 艰难
  rationale: 该名词指困苦、患难或逆境；“艰难”在此庄重自然，也可作集合性概括。
- source_word: מְצָאָתַם
  choice: 遭遇
  rationale: 原文直译是艰难“遇见/找到”他们；汉语用“遭遇”自然地表达临到他们的患难，而不造成生硬拟人。
- source_word: בַּדֶּרֶךְ
  choice: 在路上
  rationale: 简明保留以色列离开埃及后行程中的空间和叙事含义。
- source_word: וַיַּצִּלֵם
  choice: 搭救他们
  rationale: נצל表示从危险或困境中救出；“搭救”准确体现具体处境中的解救，且不额外引入后期系统神学含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近学界重构发音、且现代中文可理解的“雅威”，保留专名而不替换为“主”。
- issue: עַל אֹדוֹת יִשְׂרָאֵל所表达的因果与受益关系
  choice: 为以色列的缘故
  alternative: 因为以色列／因以色列的缘故
  rationale: 原短语既可强调以色列是事件的缘由，也可暗含雅威为以色列施行作为；正文保留这种张力，脚注列出偏重因果的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。调整希伯来语并列成分的汉语语序，以“把……以及……都讲给岳父听”清楚统摄两个宾语；末句用“也讲了”明确其仍受“讲述”支配。所有脚注标记均置于相关正文之后。
