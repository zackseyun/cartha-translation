base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: zh_hans
  text: 摩西出去迎接岳父，向他下拜，又亲吻他。二人彼此问安[a]，然后进了帐篷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“彼此询问平安”；这是询问对方是否安好、近况如何的说法。
    reason: 说明希伯来语“询问平安”的习语含义。
lexical_decisions:
- source_word: לִקְרַאת
  choice: 迎接
  rationale: 与“出去”连用，表示摩西出去迎接到来的亲属，而非偶然遇见。
- source_word: חֹתְנוֹ
  choice: 岳父
  rationale: 本章所指是摩西妻子的父亲叶忒罗；现代汉语以“岳父”准确表达这一姻亲关系。
- source_word: וַיִּשְׁתַּחוּ
  choice: 向他下拜
  rationale: 保留俯身行礼的实际动作，既体现尊敬，又不将其解释为敬拜。
- source_word: וַיִּשַּׁק לוֹ
  choice: 又亲吻他
  rationale: 直接表达当时亲属相见时的亲吻礼，保持原文动作及宾语。
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: 二人彼此问安
  rationale: “彼此”对应 אִישׁ לְרֵעֵהוּ；“问安”自然传达“询问平安、近况”的希伯来语习语。
- source_word: הָאֹהֱלָה
  choice: 进了帐篷
  rationale: 方向词尾表示进入帐篷；原文只说定指的“帐篷”，未明说属于谁，因此不增译“摩西的”。
theological_decisions:
- issue: 摩西向叶忒罗下拜的含义
  choice: 译作尊敬性的“向他下拜”，不明定为敬拜
  alternative: 俯伏敬拜
  rationale: 该动词在其他语境中可表示敬拜，但此处对象是摩西的岳父，且动作位于亲属相迎的礼仪序列中；译文保留动作而不加入原文未明说的神学判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岳父”“问安”“帐篷”均为自然常用表达；句式简洁，并保留原文连续动作的叙事节奏。
