  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: zh_hans
  text: 第二天，摩西坐下审理百姓的案件；百姓从早到晚站在摩西面前[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“围在摩西周围。”这里的希伯来语表达也可理解为百姓围在摩西身边；按上下文，百姓是站在摩西面前等候他裁断。
    reason: 保留עַל־מֹשֶׁה在此与“站立”连用时可能带有的“围在……周围”空间理解，同时说明正文译法的语境依据。
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: 第二天
  rationale: 希伯来叙事公式引出随后发生的事；现代汉语以“第二天”自然、准确地表达时间推进，无须机械译出“事情发生了”。
- source_word: וַיֵּשֶׁב מֹשֶׁה לִשְׁפֹּט אֶת־הָעָם
  choice: 摩西坐下审理百姓的案件
  rationale: 保留ישב所描绘的坐姿，并以“审理百姓的案件”表达שפט在本段司法裁断语境中的含义，避免让“审判百姓”产生定罪意味。
- source_word: וַיַּעֲמֹד הָעָם
  choice: 百姓……都站着
  rationale: עמד的基本义是“站立”；“都”自然体现集合名词“百姓”作为群体参与此事，但不额外说明其动机。
- source_word: עַל־מֹשֶׁה
  choice: 在摩西面前
  rationale: על与עמד连用时，在本语境中可指站在某人面前等候办理事务；正文采用自然汉语，同时用脚注保留较为字面的空间关系及“围在周围”的可能。
- source_word: מִן־הַבֹּקֶר עַד־הָעָרֶב
  choice: 从早到晚
  rationale: 准确传达整日持续的时间范围，且符合现代汉语习惯。
