base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: zh_hans
  text: 后来，摩西的岳父叶忒罗带着摩西的儿子和妻子[a]，来到旷野中摩西那里；摩西正在上帝的山[b]安营。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“他的儿子和他的妻子”。这些代词在形式上也可能回指叶忒罗；但根据18:2—4的上下文，这里更可能指摩西的儿子和妻子。
    reason: 说明希伯来语代词形式上的可能歧义，以及正文依据上下文作出的所指判断。
  - marker: b
    text: “上帝的山”是与西奈（何烈）相关的称号；本节没有直接使用“西奈”或“何烈”这一名称。
    reason: 保留原文称号，同时交代其经文背景。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 后来……来到
  rationale: 该叙事形式推动事件向前发展。“后来”自然表达先后次序，“来到”保留向摩西所在之处移动的含义。
- source_word: יִתְרוֹ חֹתֵן מֹשֶׁה
  choice: 摩西的岳父叶忒罗
  rationale: 按现代汉语习惯排列身份说明与人名；חֹתֵן在本处指摩西的岳父。
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: 带着他的儿子和妻子
  rationale: 两个连接词在这里表示随同者；译作“带着”符合汉语表达。“他的”保留希伯来语代词指向在形式上的歧义，并以脚注说明。
- source_word: אֶל מֹשֶׁה אֶל הַמִּדְבָּר
  choice: 来到摩西那里；摩西当时正在旷野
  rationale: 两个אֶל短语分别指出所到的人与地点。分成两个相连分句，可避免汉语误读，同时完整保留地点信息。
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: 摩西当时……在那里安营
  rationale: 明确关系从句中的主语为摩西；“安营”准确而自然地表达חנה。
- source_word: הַר הָאֱלֹהִים
  choice: 上帝的山
  rationale: 直接保留原文的称号，不以本节未出现的“西奈山”或“何烈山”替换。
theological_decisions:
- issue: “他的儿子和妻子”中代词所指
  choice: 正文保留“他的”的形式歧义，脚注指出上下文更可能指摩西
  alternative: 直接译作“摩西的儿子和妻子”，或理解为叶忒罗的家人
  rationale: 希伯来语第三人称后缀本身可在形式上回指叶忒罗，但出埃及记18:2—4的上下文表明，叶忒罗带来的是摩西的妻子和儿子。保留代词并加注，既不掩盖语法张力，也帮助读者理解上下文。
- issue: “上帝的山”的具体地点
  choice: 保留描述性称号“上帝的山”
  alternative: 译作“西奈山”或“何烈山”
  rationale: 本节原文没有使用西奈或何烈这一专名，不宜在正文中替换。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“岳父”“安营”“旷野”均为通行圣经语汇；以分号整理原文连续地点短语，使句法清楚而不删减信息。
