base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: zh_hans
  text: 让他们随时审判百姓。凡重大的事，都要带到你这里；凡小事，则由他们自己审判。这样，你要减轻自己肩上的担子，他们也会与你一同担当。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: 让他们……审判百姓
  rationale: שׁפט在此指审理、裁断百姓的案件；结合叶忒罗提出安排的语境，用“让他们”表达指示语气，同时保留“审判”的司法含义。
- source_word: בְּכָל־עֵת
  choice: 随时
  rationale: 直译为“在一切时候”；“随时”在现代汉语中自然地表达经常可受理案件，而不增添“有需要时”等解释。
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: 凡重大的事
  rationale: דָּבָר在语境中是待裁断的事项或案件；“重大的事”保留原文“大／小”的对照及一定的语义开放性。
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: 他们都要带到你这里
  rationale: 原文使役形表达把事项带到摩西面前处理；“带到你这里”简明保留这一动作。
- source_word: כָּל־הַדָּבָר הַקָּטֹן
  choice: 凡小事
  rationale: 与“重大的事”形成原文明确的“大／小”对举，不限定为现代法律术语“案件”。
- source_word: יִשְׁפְּטוּ הֵם
  choice: 则由他们自己审判
  rationale: 独立代词הֵם带有强调和对比作用；“他们自己”表明小事由这些人而非摩西裁断。
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: 你要减轻自己肩上的担子
  rationale: וְהָקֵל是使役命令式，故译作“你要减轻”，而非结果性的“就会减轻”；“肩上的担子”自然呈现מֵעָלֶיךָ所含从身上卸下重负的比喻。
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: 他们也会与你一同担当
  rationale: נשׂא意为承担、背负；原文宾语省略，汉语用“担当”可承接前面的“担子”，并保留共同承担的含义。
