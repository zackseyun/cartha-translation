base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: zh_hans
  text: 他们随时审判百姓；凡难断的事，他们就带到摩西那里[a]；凡小事，他们自己审判。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡疑难案件……凡较小的案件。”希伯来文在司法语境中将难断的事与较小的事相对照。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: 审判
  rationale: שׁפט在此指受委任者履行裁断案件的职责；“审判”既贴近原文，也符合本段司法语境。
- source_word: הָעָם
  choice: 百姓
  rationale: עַם在《出埃及记》中通常指以色列共同体；“百姓”自然、庄重，并与上下文一致。
- source_word: בְּכָל־עֵת
  choice: 随时
  rationale: 该短语表示经常且持续地受理案件，并非只在某个时刻；“随时”是简洁自然的现代汉语表达。
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: 凡难断的事
  rationale: דָּבָר在司法语境中指待裁断的事情或案件，קָשֶׁה表示困难；“难断的事”明确呈现其司法含义，而“凡”表达此处的类别概括。
- source_word: יְבִיאוּן אֶל־מֹשֶׁה
  choice: 他们就带到摩西那里
  rationale: 未完成式在叙事总结中表示惯常、反复发生的行动；“就带到”自然呈现既定处理方式。
- source_word: כָל־הַדָּבָר הַקָּטֹן
  choice: 凡小事
  rationale: קָטֹן与קָשֶׁה形成对比，指较小、较简单的案件；保留“小事”可直接反映原文词汇对照，同时脚注说明司法语境中的可能译法。
- source_word: יִשְׁפּוּטוּ הֵם
  choice: 他们自己审判
  rationale: 独立代词הֵם带有强调作用；“他们自己”保留这种强调，表明小事由这些受委任者亲自裁断，而不交给摩西。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“随时”表达持续受理案件；“凡难断的事／凡小事”保留原文鲜明对照，并以脚注补充更明确的司法性译法。分号呈现三项并列而相互对照的惯常安排。
