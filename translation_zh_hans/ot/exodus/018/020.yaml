  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: zh_hans
  text: 你要把律例和律法告诫他们，使他们知道他们当行走的道路，以及当做的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: 告诫
  rationale: 使役式在此表示带有警戒和责任意味的教导；“告诫”比单纯的“教导”更能体现其郑重语气。句首连接词在中文中不必机械译出，以保持自然衔接。
- source_word: הַחֻקִּים
  choice: 律例
  rationale: חֻקִּים 指制定并确立的规章、法令；“律例”既保留法律色彩，也符合庄重而易懂的经文语体。
- source_word: הַתּוֹרֹת
  choice: 教导
  rationale: תּוֹרֹת 是 תּוֹרָה 的复数，可指训诲、教导，也可指律法。在与“律例”并列的司法语境中具有规范性，但译作“教导”可保留词义宽度，避免把它与前词完全同义化。
- source_word: וְהוֹדַעְתָּ
  choice: 使他们知道
  rationale: 准确体现 ידע 使役式“使……知道”的因果意义，同时是自然现代汉语。
- source_word: הַדֶּרֶךְ יֵלְכוּ בָהּ
  choice: 当走的路
  rationale: 保留希伯来语以“道路”和“行走”表达生活行为的隐喻；“当”体现上下文中的规范和义务意味。
- source_word: הַמַּעֲשֶׂה אֲשֶׁר יַעֲשׂוּן
  choice: 当做的事
  rationale: מַעֲשֶׂה 指所行之事或具体行为。“当做的事”自然简洁，并表达此处要求履行的责任。
theological_decisions: []
