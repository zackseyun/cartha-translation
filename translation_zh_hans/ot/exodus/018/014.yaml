base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: zh_hans
  text: 摩西的岳父看见他为百姓所做的一切[a]，就说：“你为百姓做的是什么事？为什么只有你一个人坐着，全体百姓却从早到晚都站在你面前[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为百姓所做”也可译作“对百姓所做”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“站在你上面”；这里指百姓站在摩西面前等候，可能是等候裁断。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: 摩西的岳父
  rationale: חֹתֵן 指姻亲关系；本段语境中是摩西妻子的父亲。“岳父”是现代汉语准确自然的称呼。
- source_word: וַיַּרְא
  choice: 看见
  rationale: ראה 是普通的“看见”；此处也含观察到眼前情形之意，但无需在正文中强化为“察看”。
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה
  choice: 他……所做的一切
  rationale: כָּל אֲשֶׁר 表示全部，分词 עֹשֶׂה 描写当时持续进行的活动；汉语以“所做的一切”自然表达。
- source_word: לָעָם
  choice: 为百姓
  rationale: 介词 ל 可表示受益或对象；“为百姓”贴合摩西代表百姓处理事务的语境，同时以脚注保留“对百姓”的可能表达。
- source_word: מָה הַדָּבָר הַזֶּה
  choice: 这是什么事
  rationale: דָּבָר 在此指事情、做法或情形。“这是什么事”保留质问语气，也比直译“这是什么东西”自然庄重。
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: 只有你一个人坐着
  rationale: ישׁב 是“坐”，在本语境中也可能暗含坐堂审理；译文保留具体动作，不把司法含义直接加入正文。
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: 所有百姓却……都站在你面前
  rationale: נצב 是“站立”，עַל 在此语境表示来到摩西面前等候办理事务。“站在你面前”是自然汉语，并以脚注说明较直译的形式及其语境意义。
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: 从早到晚
  rationale: 这是表示整段白昼时间的固定结构；“从早到晚”简洁、准确而自然。
theological_decisions: []
