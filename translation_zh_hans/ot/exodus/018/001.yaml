  to: 摩西的岳父、米甸的祭司叶忒罗，听说上帝为摩西和他的子民以色列[a]所做的一切，因为耶和华把以色列从埃及领了出来。
  rationale: 修订仅调整连接词与脚注锚点：“因为”较明确地传达כִּי对前述“上帝所做的一切”的说明／理由作用；脚注移至相关名词短语之后，使其锚定清晰。其余措辞忠实、自然，故予以保留。
