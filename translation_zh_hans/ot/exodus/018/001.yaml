  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: zh_hans
  text: 摩西的岳父、米甸的祭司叶忒罗，听说上帝为摩西和他的子民以色列[a]所做的一切，因为耶和华把以色列从埃及领了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他的子民以色列”也可理解为“摩西的子民以色列”。这里的“他”在语法上可以指摩西，不过按上下文来看，更可能指上帝。
    reason: 保留עַמּוֹ所指对象的真实语法歧义，避免正文过度释义。
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说了
  rationale: 该叙事时态推进情节；中文无需另加“现在”，而“听说”自然表达叶忒罗得知这些事。
- source_word: כֹהֵן מִדְיָן
  choice: 米甸的祭司
  rationale: 保留构造短语所表达的职分及与米甸的关联；定指意义由具体人名和上下文体现。
- source_word: חֹתֵן מֹשֶׁה
  choice: 摩西的岳父
  rationale: 本段语境明确指摩西妻子的父亲；现代汉语以“岳父”最准确自然。
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: 上帝……所做的一切
  rationale: 完整保留כָּל אֲשֶׁר的总括意义，并符合现代汉语表达。
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: 为摩西和……以色列
  rationale: 介词ל在此表示有利于、为了，译作“为”比单纯方向性的“向”更合适。
- source_word: עַמּוֹ
  choice: 他的子民
  rationale: 保留第三人称阳性单数代词，不在正文中明说所指；语境最可能指上帝，但语法上也可能指摩西。
- source_word: כִּי
  choice: 就是
  rationale: 此处引出叶忒罗所听见之事的具体内容或说明；“就是”在中文中能自然连接前后两层。
- source_word: הוֹצִיא
  choice: 把……领了出来
  rationale: 使役形表达使之出去、带出；“领了出来”自然呈现耶和华带领以色列离开埃及的行动。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，作为专名呈现四字神名，而非以称号代替。
- source_word: מִמִּצְרָיִם
  choice: 从埃及
  rationale: 与“领了出来”配合，清楚表达从埃及境内出来的移动。
theological_decisions:
- issue: עַמּוֹ中代词的所指
  choice: 正文作“他的子民以色列”，最自然理解为上帝的子民
  alternative: 也可按语法理解为“摩西的子民以色列”
  rationale: 最近且语义最连贯的先行词是“上帝”，后句又明确说耶和华领以色列出埃及；但希伯来语形式本身容许代词与摩西相连，因此正文不增补“上帝的”，并以脚注保留歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。调整同位语次序为“摩西的岳父、米甸的祭司叶忒罗”，符合中文信息组织习惯。脚注标记置于全节句末，因为脚注解释的是正文中“他的子民以色列”的代词所指。
