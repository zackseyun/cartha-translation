base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: zh_hans
  text: 摩西从全以色列中选出有能力的人[a]，立他们作管理百姓的首领[b]：负责管理千人的、百人的、五十人的和十人的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“有才干的人”。希伯来语短语可指有力量、有能力或经得起考验的人；本段语境着重于能够胜任治理职责的人。
    reason: lexical_alternative
  - marker: b
    text: 直译“百姓之上的头”；“头”在这里比喻有权柄、负责任的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: 选出
  rationale: בחר意为“选择、挑选”；“选出”自然地表达摩西从全体以色列人中拣选人员的动作。
- source_word: אַנְשֵׁי חַיִל
  choice: 有才干的人
  rationale: 该短语可指有力量、有能力或经受验证的人；本节处于审判与治理的语境，重点是胜任领导职责的才干，而非作战勇武。
- source_word: מִכָּל יִשְׂרָאֵל
  choice: 从全以色列中
  rationale: 准确表达这些人是从以色列全体之中选出的。
- source_word: וַיִּתֵּן אֹתָם
  choice: 立他们作
  rationale: נתן本义为“放置、给予”，此处表示把人安置在职分上；“立他们作”既保留任命意味，也符合庄重的现代汉语表达。
- source_word: רָאשִׁים עַל הָעָם
  choice: 百姓的首领
  rationale: רָאשִׁים字面为“头”，在此比喻掌权、负责的人；译作“首领”自然传达其权柄和职责。
- source_word: שָׂרֵי אֲלָפִים / שָׂרֵי מֵאוֹת / שָׂרֵי חֲמִשִּׁים / שָׂרֵי עֲשָׂרֹת
  choice: 分别管理千人、百人、五十人和十人
  rationale: שַׂר指受委任管理一组人的官长。按现代汉语展开为“分别管理……”可清楚呈现分级治理结构，同时避免“千夫长”等词在当代语境中过度强化军事含义。
