source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: zh_hans
  text: 但你要从全体百姓中选出有才干[a]、敬畏上帝、诚实可信[b]、恨恶不义之财[c]的人；要委任他们管理百姓，作千夫长、百夫长、五十夫长和十夫长。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有才干”也可译作“有能力”或“勇武”。希伯来语可按语境表示力量、才干或勇武。
    reason: lexical_alternative
  - marker: b
    text: “诚实可信”直译为“真理之人”或“真实的人”，指诚实可靠的人。
    reason: lexical_alternative
  - marker: c
    text: “不义之财”也可译作“不正当的利益”，指以不公正或腐败手段取得的利益。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: 物色
  rationale: 此动词本义与“看、察看”有关，在本语境中指审慎察看并选出合适人选；“物色”兼顾辨识与选任。
- source_word: מִכָּל־הָעָם
  choice: 从全体百姓中
  rationale: 准确表达部分关系，即从全体百姓当中选出人来。
- source_word: אַנְשֵׁי חַיִל
  choice: 有才干的人
  rationale: חַיִל可指力量、才干、能力或勇武；司法行政语境侧重胜任职务的能力，同时脚注保留其他含义。
- source_word: יִרְאֵי אֱלֹהִים
  choice: 敬畏上帝
  rationale: 直接表达对上帝的敬畏，作为受任者的道德资格。
- source_word: אַנְשֵׁי אֱמֶת
  choice: 诚实可信的人
  rationale: אֱמֶת兼有真实、诚实、可靠之意；“诚实可信”自然地涵盖这些语义，而不局限于只说真话。
- source_word: שֹׂנְאֵי בָצַע
  choice: 恨恶不义之财
  rationale: בֶּצַע在此指以不正当方式所得的利益；“不义之财”保留其腐败和贪利色彩，而不把含义缩窄为贿赂。
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: 委任他们管理百姓
  rationale: “委任”表达设立其职，“管理百姓”自然呈现原文“把他们置于百姓之上”的关系，并澄清代词所指。
- source_word: שָׂרֵי אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: 千夫长、百夫长、五十夫长和十夫长
  rationale: 沿用现代中文圣经语体中清楚而简洁的分级职衔；这里表示分别管理相应人数单位的首领，不必限定为军事军官。
theological_decisions:
- issue: 领导者资格中的性别用语
  choice: 有才干的人……诚实可信的人
  alternative: 有才干的男人……诚实可信的男人
  rationale: 希伯来语 אַנְשֵׁי 在语法形式上是阳性复数，也可在普通表达中指一类人。现代汉语“人”在此自然承载原句的人员含义，不额外断定或否定更广泛的性别适用范围。
- issue: יִרְאֵי אֱלֹהִים 中 אֱלֹהִים 的译法
  choice: 敬畏上帝
  alternative: 敬畏神
  rationale: 上下文明确指以色列的上帝；“上帝”是现代标准汉语中庄重、通行且不附加宗派立场的译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“物色”体现察看并选任的过程；“委任他们管理百姓”避免汉语中重复代词造成的含混；分级职衔保留原文整齐的行政结构。所有脚注标记均紧随其所说明的词语。
