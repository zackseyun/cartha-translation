  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: zh_hans
  text: 你若这样做[a]，并且上帝吩咐你这样做，你就能支撑得住[b]；这些百姓[c]也都能平安回到各自的地方[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“做这件事”；也可译“处理这事”或“实行这个办法”。
    reason: lexical_alternative
  - marker: b
    text: 直译“站立得住”；这里指能够承受重担、坚持下去。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译“这全体百姓”，其中“百姓”是集合单数。
    reason: lexical_alternative
  - marker: d
    text: 直译“来到他的地方”；集合单数在这里可理解为百姓各自回到自己的地方。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: 若
  rationale: 引出条件句；“若”简洁庄重，也符合现代汉语表达。
- source_word: אֶת־הַדָּבָר הַזֶּה תַּעֲשֶׂה
  choice: 这样做
  rationale: דָּבָר 在这里指叶忒罗刚提出的办法；“这样做”自然地承接上文，同时不把所指过度限定为某一具体制度。
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: 而且上帝也这样吩咐你
  rationale: 保留本句与前一条件的并列关系，表明摩西实行这办法还须有上帝的吩咐；“这样”自然回指上述做法。
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: 就能支撑得住
  rationale: יכל 加不定式表示有能力；עמד 字面为“站立”，在语境中指摩西能够承受工作重担并继续履职。“支撑得住”兼顾形象与语境含义。
- source_word: כָּל־הָעָם הַזֶּה
  choice: 这些百姓
  rationale: 希伯来语以单数集合名词指全体百姓；现代汉语用“这些百姓”自然表达，并保留指示意味。
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: 回到各自的地方
  rationale: 字面近于“来到他的地方”。主语是集合名词，单数代词具有分配意义；“各自的地方”清楚传达每个人都可离开摩西、回到自己所属之处。
- source_word: בְשָׁלוֹם
  choice: 平安
  rationale: שָׁלוֹם 涵盖平静、安好和圆满；“平安”在此既自然又保留其较宽的语义。
theological_decisions:
- issue: 叶忒罗的建议与上帝吩咐之间的条件关系
  choice: 把“而且上帝也这样吩咐你”纳入“若……就……”的条件结构
  alternative: 可理解为结果或愿望：“上帝将会吩咐你”或“愿上帝吩咐你”
  rationale: 上下文及希伯来语句法最自然地把上帝的吩咐视为实行建议的附加条件，避免暗示叶忒罗的建议可以脱离上帝的认可而自行生效。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“支撑得住”贴合摩西不堪重负的语境；分号区分摩西和百姓所得的两个结果。保留上帝吩咐作为附加条件，不将其弱化为一般认可。
