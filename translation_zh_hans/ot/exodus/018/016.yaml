  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: zh_hans
  text: 每逢他们有案件[a]，这案件便呈到我面前；我便在一个人与他的邻人之间作出判断[b]，并使他们知道神的律例和他的律法[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “案件”也可译作“事情”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“在一个人与他的邻人之间”，是用单数形式作代表性表达。
    reason: cultural_note
  - marker: c
    text: “律法”也可译作“训诲”或“指示”；原词含义较广，但这里用于司法语境。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 每逢
  rationale: 这里引出反复发生的条件或时间情形；“每逢”自然表达摩西一贯的处理方式。
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: 他们有事情
  rationale: דָּבָר 可指事情、争端或案件；正文用较宽泛的“事情”，由司法语境限定其含义。
- source_word: בָּא אֵלַי
  choice: 这事就来到我这里
  rationale: 保留希伯来文单数动词，并以先行的“事情”为主语，不改写成当事人前来。
- source_word: וְשָׁפַטְתִּי
  choice: 我便……审断
  rationale: שׁפט 在此指作出司法判断；“审断”既准确又符合庄重的现代汉语。
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: 在一人和他的同伴之间
  rationale: 保留原文代表性的阳性单数表达；רֵעַ 在社会和司法语境中译作“同伴”较为宽泛。
- source_word: וְהוֹדַעְתִּי
  choice: 告诉他们
  rationale: 该使役形表示使人知道；汉语“告诉他们”自然表达这一使役意义，并补出语境中明确的受事者。
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: 神的律例
  rationale: חֻקִּים 指规定、条例或定例；“律例”保留其规范性。
- source_word: תּוֹרֹתָיו
  choice: 他的律法
  rationale: תּוֹרָה 基本义可涵盖训诲或指示，但此处与“律例”并列，且处于审判语境，因此正文采用“律法”，脚注保留较宽的词义。
theological_decisions:
- issue: אִישׁ……רֵעֵהוּ 的代表性阳性单数
  choice: 一人和他的同伴
  alternative: 人与人之间
  rationale: 原文采用阳性单数的法律性代表表达；正文保留单数形式，不把它默默改写为抽象或复数表达。
- issue: 司法语境中 תּוֹרֹתָיו 的含义
  choice: 他的律法
  alternative: 他的训诲
  rationale: 上下文涉及审断，并与“律例”平行，因此“律法”能表达其规范效力；脚注同时保留“训诲”这一更宽泛的可能含义。
- issue: בָּא 的单数主语
  choice: 这事就来到我这里
  alternative: 他们就到我这里来
  rationale: 原文动词为阳性单数，最直接地承接 דָּבָר（事情）；译文保留这一语法关系，不将主语解释为争讼双方。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“审断”“律例”保持司法和经文语体；句式尽量贴近原文，同时用“每逢”和“便”使反复性的叙述在汉语中自然连贯。
