  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: zh_hans
  text: 于是，摩西的岳父叶忒罗取来燔祭和祭牲献给上帝。亚伦和以色列的众长老都来，在上帝面前同摩西的岳父一起吃饭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“吃饼”；这个说法也可泛指“一同用饭”。
    reason: 说明原文的字面表达及其惯用含义。
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取来
  rationale: לקח的基本义是“拿、取”。结合祭物语境译作“取来”，既保留动作本身，也比直接译成“献上”少作一步解释。
- source_word: חֹתֵן מֹשֶׁה
  choice: 摩西的岳父
  rationale: 在本叙事中，חֹתֵן指叶忒罗与摩西的姻亲关系，通常明确为“岳父”；后半句也照原文重复这一称谓。
- source_word: עֹלָה
  choice: 燔祭
  rationale: עֹלָה是整只焚烧献上的祭物；“燔祭”是现代中文圣经语境中准确、简洁且较为通行的术语。
- source_word: זְבָחִים
  choice: 祭牲
  rationale: זְבָחִים为复数，指宰杀献上的祭物，与前面的特定祭类“燔祭”并列。“祭牲”既呈现其祭祀性质，也保留两类祭物的区别。
- source_word: לֵאלֹהִים
  choice: 献给上帝
  rationale: 介词ל在祭献语境中表示对象或归属。中文以“献给上帝”自然表达祭物所献的对象；“献”由祭物语境补出，使句意清楚。
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: 亚伦和以色列的众长老都来
  rationale: 原文动词虽为前置单数形式，但主语是亚伦与以色列众长老组成的并列结构；中文自然使用复数整体表达。“都”体现“所有长老”。
- source_word: לֶאֱכָל לֶחֶם
  choice: 一起吃饭
  rationale: 字面为“吃饼/吃食物”，在希伯来语中可惯用地指用饭。中文“吃饭”同样自然表达共同进餐；“一起”明确其共席关系，字面形式另见脚注。
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: 同摩西的岳父一起
  rationale: 保留原文再次使用关系称谓而非名字“叶忒罗”的叙述特点。
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: 在上帝面前
  rationale: לִפְנֵי意为“在……面前/临在中”。“在上帝面前”简洁庄重，并保留这一共席场景的宗教意味。
theological_decisions:
- issue: 祭献语境中共同进食的性质
  choice: 译文呈现他们在献祭之后于上帝面前共同进餐，但不在正文中明定其制度性或立约性质。
  alternative: 明确译成“举行神圣的立约筵席”，或仅理解为普通吃饭。
  rationale: 祭物、亚伦与众长老的参与以及“在上帝面前”共同出现，显示这顿饭与献祭密切相关；然而原文只说他们来共同吃食物，并未明说“立约筵席”，故不应把这一解释写入正文。
- issue: אֱלֹהִים的所指
  choice: 上帝
  alternative: 众神
  rationale: 本段叙事语境以单数方式指向以色列的上帝；译作“上帝”符合语法与上下文，不引入无根据的多神含义。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“燔祭”保留必要的祭祀术语；“祭牲”与之形成清楚区别。正文将希伯来语惯用语自然译为“一起吃饭”，并用脚注保存其字面措辞。
