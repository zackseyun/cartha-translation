  text: So Moses listened to the voice of his father-in-law and did all that he said[a].
translation:
  language: zh_hans
  text: 于是，摩西听了岳父的话，并照他所说的一切做了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听了岳父的话”也可译为“听从了岳父的话”。这一希伯来语惯用语可含有响应并服从的意思；下半句进一步明确摩西付诸了行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听了
  rationale: שׁמע与לְקוֹל连用，既有听取之意，也可包含听从、服从的意味。“听了”保留听觉意象，而下半句明确交代摩西付诸行动。
- source_word: לְקוֹל
  choice: ……的话
  rationale: קוֹל直译为“声音”，但“听某人的话”是自然的现代汉语表达，也能保留希伯来语惯用语所含的听取和响应之意。
- source_word: חֹתְנוֹ
  choice: 岳父
  rationale: 上下文所指是摩西妻子的父亲叶忒罗；“岳父”在现代汉语中准确、简明。
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: עשה是常用的“做、实行”；“做了”直接对应原文，并自然承接后面的内容从句。
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: 他所说的一切
  rationale: 按原文保留概括性的关系结构，不额外加入“先前”等时间信息；代词“他”在上下文中指摩西的岳父。
