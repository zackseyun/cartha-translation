  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: zh_hans
  text: 他对摩西说：“我——你的岳父叶忒罗——正来你这里；你的妻子也正来，她的两个儿子[a]跟她一起。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“她的两个儿子”。有些译本按关系顺译为“你的两个儿子”，但马所拉文本使用第三人称阴性单数后缀，所指的是摩西的妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: 他对摩西说
  rationale: 未将叙事推进用的 וַ־机械译为“于是”；“对摩西说”自然表达 אֶל־מֹשֶׁה 的受话关系。
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  choice: 我——你的岳父叶忒罗——
  rationale: 保留独立代词 אֲנִי 的强调作用，并以插入语自然呈现叶忒罗的身份说明；חֹתֵן 在本语境中特指岳父。
- source_word: בָּא אֵלֶיךָ
  choice: 正到你这里来
  rationale: 分词 בָּא 表达正在进行或即将实现的前来行动；“正到你这里来”保留其动态和趋向。
- source_word: וְאִשְׁתְּךָ
  choice: 你的妻子也来了
  rationale: 希伯来语以连接词将摩西的妻子列为同行者；汉语补出“来了”，使省略谓语的并列关系清楚自然。
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: 她的两个儿子
  rationale: בָנֶיהָ 带第三人称阴性单数后缀，直指摩西的妻子，故保留“她的”，不协调改写为“你的”。
- source_word: עִמָּהּ
  choice: 跟她在一起
  rationale: 明确译出阴性单数后缀所指的妻子，也保留原文再次说明两个儿子与她同行的表达。
