  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: zh_hans
  text: 摩西对岳父说：“因为百姓到我这里来寻求上帝[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“求问上帝”；也可理解为“向上帝求取裁断”。这个希伯来语说法可以包括为获得指引或判断而向上帝求问的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是叙事中常见的 wayyiqtol 形式，引出摩西的回答；现代汉语用“说”自然简洁。
- source_word: לְחֹתְנוֹ
  choice: 对岳父
  rationale: חֹתֵן 在本段语境中指叶忒罗，即摩西妻子的父亲；“岳父”是准确而自然的现代汉语称谓。
- source_word: כִּי
  choice: 因为
  rationale: 这里回答叶忒罗先前的问题，说明摩西这样处理事务的原因；“因为”清楚表达因果关系。
- source_word: יָבֹא אֵלַי הָעָם
  choice: 百姓到我这里来
  rationale: בוא + אֶל 表示来到某人那里；未完成式在此表达经常发生的情形，汉语无需另加时态标记。
- source_word: לִדְרֹשׁ
  choice: 求问
  rationale: דרש 以“上帝”为宾语时，可表示寻求上帝，也可表示向上帝求取指引或裁断。“求问”既保留寻求之意，也自然体现本段咨询、审断的语境。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 原文直接以“上帝”为宾语，不宜在正文中改写成“上帝的旨意”或“裁决”；“上帝”准确保留明确的神学指称。
theological_decisions:
- issue: 短语 לִדְרֹשׁ אֱלֹהִים 的表达
  choice: 求问上帝
  alternative: 寻求上帝；向上帝求取裁断
  rationale: 该希伯来语短语既可泛指寻求上帝，也可在争讼语境中指向上帝求指引或裁断。“求问上帝”在现代汉语中自然，并且不把含义过度限定为司法裁决；脚注保留其他可能的侧重。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“岳父”符合上下文中的具体亲属关系；“求问上帝”兼顾希伯来语措辞的宽度与本段审理争端的语境。
