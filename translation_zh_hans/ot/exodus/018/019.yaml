base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: zh_hans
  text: 现在，你听我的话；我来给你出主意。愿上帝与你同在。[a]你要在上帝面前代表百姓[b]，把这些事情[c]带到上帝面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文的动词形式表达愿望或祝福，也可译作“上帝与你同在”。
    reason: lexical_alternative
  - marker: b
    text: 较直译：“你要为百姓在上帝面前。”
    reason: alternative_reading
  - marker: c
    text: “这些事情”在这里主要指百姓带来请求裁断的案件或争议。
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 既可表示时间，也可作为话语转折标记；“现在”简洁自然，适合叶忒罗开始提出具体建议的语境。
- source_word: שְׁמַע בְּקֹלִי
  choice: 听我的话
  rationale: 希伯来语直译为“听我的声音”，在此是请摩西听取劝告；现代汉语“听我的话”保留这一惯用表达，又不强化为绝对服从。
- source_word: אִיעָצְךָ
  choice: 我来给你出主意
  rationale: יעץ意为劝告、献策；“给你出主意”是清楚自然的现代汉语，符合岳父向摩西提出治理建议的场景。
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: 愿上帝与你同在
  rationale: 动词形式在这里表达愿望或祝福；汉语以“愿”明确传达祈愿语气。
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: 你要在上帝面前代表百姓
  rationale: 原文较直译是“你要为百姓在上帝面前”；结合下句把事情带到上帝面前，表达的是摩西为百姓承担代表角色。正文采用自然明确的汉语，脚注保留较贴近原文结构的译法。
- source_word: הַדְּבָרִים
  choice: 这些事情
  rationale: דברים语义宽泛，可指话语、事情或事务；本段司法语境使其具体涉及百姓提交裁断的案件或争议，但正文用“事情”保留原词的宽度，脚注说明语境含义。
- source_word: וְהֵבֵאתָ ... אֶל הָאֱלֹהִים
  choice: 把这些事情带到上帝面前
  rationale: 连接式完成形承接前面的指令，具有指示性；“把……带到……面前”准确表达摩西将事项呈交上帝的行动。
theological_decisions:
- issue: אֱלֹהִים在本叙事语境中的译法
  choice: 上帝
  alternative: 神；那位上帝
  rationale: 该词在此以单数意义指以色列的上帝；“上帝”是现代标准汉语中自然、非宗派化的对应，不需添加“真”之类原文没有的限定。
- issue: 摩西在上帝与百姓之间角色的表达程度
  choice: 你要在上帝面前代表百姓
  alternative: 你要为百姓站在上帝面前
  rationale: 上下文确实描述摩西把百姓的事情呈到上帝面前，具有代表功能；正文清楚表达这一功能，但脚注保留原文较含蓄的句法，避免把它扩展为更完整的神学职衔。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“听我的话”和“给你出主意”保持口语自然度；“愿上帝与你同在”及“带到上帝面前”维持叙事的庄严感。所有脚注标记均置于正文相应内容之后。
