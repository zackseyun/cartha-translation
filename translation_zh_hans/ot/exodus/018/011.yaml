language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: zh_hans
  text: 现在我知道，雅威比一切神明都大；因为他们怎样狂妄对待以色列人，雅威就在那件事上胜过他们。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句末段的希伯来文十分简略，直译近于：“因为在他们狂妄对付他们的事上。”原文没有明说“雅威”这一隐含主语，两个“他们”的所指也有歧义。正文按上下文将前者理解为埃及人、后者理解为以色列人，并将结果补为雅威“胜过他们”。也可译作：“因为在他们狂妄对付他们的事上，他高过他们。”
    reason: 保留末句省略的结果、代词歧义及贴近原文句法的替代译法，同时说明正文的上下文补足。
lexical_decisions:
- source_word: עַתָּה
  choice: 现在
  rationale: 保留时间副词的篇章作用，表明叶忒罗根据刚刚听到的事得出了当前的认识。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 第一人称单数完成式在此表达由新近证据产生的现今认识；“我知道”符合现代汉语习惯。
- source_word: גָדוֹל ... מִכָּל
  choice: 比一切……都大
  rationale: 介词 מִן 与 כָּל 构成比较，现代汉语用“比……都大”清楚表达比较意义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为专名的性质，不以称号替代。
- source_word: הָאֱלֹהִים
  choice: 神明
  rationale: 此处为复数，并与雅威形成对比；“神明”在现代汉语中可自然指各民族所敬奉的诸神，同时避免把复数误读为独一上帝。
- source_word: בַּדָּבָר אֲשֶׁר
  choice: ……的那件事
  rationale: דָּבָר 在这里指所谈论的事件，即埃及人对待以色列人以及雅威施行拯救的事；此译法自然且保留事件指向。
- source_word: זָדוּ
  choice: 狂妄对待
  rationale: 该动词表示骄傲、僭越或狂妄行事；结合介词短语，译作“狂妄对待”能体现其敌对行为。
- source_word: עֲלֵיהֶם
  choice: 对待以色列人
  rationale: עַל 在此有“针对、敌对”的意义；代词所指按上下文最可能是以色列人，但这一身份属于语境补明，故在脚注说明原文的压缩与歧义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，音译为“雅威”可直接保留专名，不用传统音译或称号替代。
- issue: “比一切神明都大”的含义
  choice: 保留原文对雅威与“一切神明”的直接比较
  alternative: 解释为雅威是唯一真实的神
  rationale: 本节陈述的是叶忒罗当下的认识与比较；译文不把这句话扩展为原文未明说的本体论判断，以保存叙事中的神学张力。
- issue: 末句 כִּי בַדָּבָר אֲשֶׁר זָדוּ עֲלֵיהֶם 的解释
  choice: 把它译为埃及人狂妄对待以色列人的事件显明雅威的伟大
  alternative: 直译为“因为在他们狂妄对付他们的事上”；或补作“他胜过了他们”
  rationale: 希伯来文末句高度压缩，没有明说主句结果，两个复数所指也依赖上下文。正文按出埃及叙事补出最可能的指称和论证关系，同时以脚注保留原文的困难，避免将“他胜过他们”当作明确写出的字句。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“正显明了这一点”补足汉语所需的论证关系，但不把补足内容写成原文明确陈述；脚注交代希伯来文的压缩结构与可能异译。
