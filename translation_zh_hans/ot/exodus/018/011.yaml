  terminology: “雅威”恰当保留四字神名；“一切神明”准确反映复数的 אֱלֹהִים，且不预设本体论结论。“狂妄对待”可用；在修订正文中配合“胜过”清楚体现 זָדוּ 与末尾 עֲלֵיהֶם 所构成的困难语句。
