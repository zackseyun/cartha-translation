  yaml_path: translation/ot/exodus/018/027.yaml
  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: zh_hans
  text: 于是，摩西送走了他的岳父；岳父就回自己的地方去了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是，摩西遣走了他的岳父；岳父就往自己的地方去了。”
    reason: וַיְשַׁלַּח 可表示“送走、遣离”；אֶל אַרְצוֹ 直译为“往他的地”，此处以“自己的地方”自然表达所属之地。
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 送……离去
  rationale: שׁלח 的加强词干以人为宾语时，常表示送走、遣离。译作“送……离去”既自然，也保留摩西正式送别叶忒罗的意味。
- source_word: חֹתְנוֹ
  choice: 他的岳父
  rationale: חֹתֵן 可泛指姻亲，但本章语境明确指摩西妻子的父亲叶忒罗，因此译作“岳父”。
- source_word: וַיֵּלֶךְ לוֹ
  choice: 他就……去了
  rationale: לוֹ 在此属于惯用与格，使离去的叙述更具主体指向；现代汉语不宜逐字译出，借“就……去了”自然表达其离开。
- source_word: אֶל אַרְצוֹ
  choice: 回自己的地
  rationale: אֶרֶץ 在此指叶忒罗所属之地，不必引入现代国家概念。“回”按离境返乡的语境自然表达方向，“自己的地”保留原文的领属关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“送……离去”比“遣散”温和，也比单纯“让……走”更能体现正式送别；“地”避免将 אֶרֶץ 过度现代化为民族国家意义的“国家”。
