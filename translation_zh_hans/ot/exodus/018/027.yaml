  revision_rationale: 修订以“送走了”替换不自然的“送……离去”，并以“自己的地方”表达原文“他的地/所属之地”的宽泛地域含义。将代词明示为“岳父”仅为汉语行文清晰；“回”与离开摩西返回原居地的叙事语境相符。
