  text: 摩西的岳父对他说：“你这样做不好。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出叙事推进用的连接词וַ；现代汉语叙事中直接用“说”更自然，同时保留了话语引介。
- source_word: חֹתֵן מֹשֶׁה
  choice: 摩西的岳父
  rationale: 按构造链表达其与摩西的姻亲关系；“摩西的岳父”是自然、明确的现代汉语。
- source_word: אֵלָיו
  choice: 对他说
  rationale: 代词所指为摩西；保留代词，不必重复姓名。
- source_word: לֹא טוֹב
  choice: 不好
  rationale: 直接保留טוֹב的宽泛评价意味，不限定为“不对”或“无益”。
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: 你这样做
  rationale: 希伯来语直译近于“你所做的这事”；现代汉语用“你这样做”自然地指向摩西当时持续采用的做法，并保留整体评价。
