  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: zh_hans
  text: 以及她的两个儿子；其中一个名叫革舜，因为摩西说：“我曾在异乡作寄居者。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居者”也可译作“外来人”或“异乡人”。希伯来语 גֵּר 可指暂住者、外来者，或居住在非本族土地上的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: 还有她的两个儿子
  rationale: 本节承接上节未完的宾语结构；וְ译作“还有”，אֵת不单独译出。“她的两个儿子”准确表达构造链及阴性单数所属后缀。
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: 其中一个名叫
  rationale: 直译为“其中一个的名字是”，现代汉语以“其中一个名叫”更自然，同时不把הָאֶחָד过度解释为“第一个”。
- source_word: גֵּרְשֹׁם
  choice: 革舜
  rationale: 采用现代中文圣经中较通行的人名音译，便于读者辨识，也与后面的命名缘由相连。
- source_word: כִּי אָמַר
  choice: 因为摩西说
  rationale: כִּי引出取名缘由。希伯来文只说“他说”，中文补出“摩西”以明确指代，不改变所指人物。
- source_word: גֵּר
  choice: 寄居者
  rationale: גֵּר指在非本族土地上居住、缺乏本地身份的人；“寄居者”保留其居留及外来者双重含义，比单纯“外国人”更贴近语义范围。
- source_word: הָיִיתִי
  choice: 我……作了
  rationale: 完成式在此回顾摩西身处异地的经历；“作了”自然表达已经成为并处于该身份，不强行规定其状态是否仍持续。
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: 在异乡
  rationale: 该短语意为“在外邦／陌生的土地”；“异乡”是自然庄重的现代汉语，并与“寄居者”形成清楚的命名解释。
