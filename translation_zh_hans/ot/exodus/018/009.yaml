    rationale: אֲשֶׁר הִצִּילוֹ 直接修饰“以色列”，并说明耶和华所行的善事；“就是”在中文中容易将后句理解为对“一切美事”的等同定义。
  - severity: low
    issue: “埃及的手”属于直译式搭配，不合现代汉语惯用表达。
    rationale: 中文通常说“从埃及人手中”或“脱离埃及的权势”。正文采用前者，脚注保留并解释原文“手”的意象。
