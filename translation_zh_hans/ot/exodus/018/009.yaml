revisions:
- from: 叶忒罗因耶和华为以色列所行的一切美事而欢喜[a]，就是耶和华救以色列脱离了埃及的手[b]。
  to: 叶忒罗因耶和华为以色列所行的一切好事而欢喜[a]；耶和华曾把以色列从埃及人手中救出来[b]。
  rationale: 修改仅改善中文的句法与习惯表达：以分号将原文关系从句所说明的救援行动清楚展开；将不自然的“埃及的手”改作“埃及人手中”，并在脚注保留原文意象及其含义。未改变原文的施救者、受益者、时间关系或神名译法。
