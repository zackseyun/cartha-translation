base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: zh_hans
  text: 叶忒罗因耶和华为以色列所行的一切好事而欢喜[a]；耶和华曾把以色列从埃及人手中救出来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欢喜”也可译作“欣喜”。希伯来语动词可表示喜悦或欢欣。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“从埃及的手中”；“手”在此是指埃及的权势或控制。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: 欢喜
  rationale: 该动词在此表示因好事而喜悦、欢欣。“欢喜”自然庄重，也保留其可指内在喜悦或外在欢欣的语义范围。
- source_word: יִתְרוֹ
  choice: 叶忒罗
  rationale: 采用现代中文圣经中通行且易识别的人名译法。
- source_word: עַל כָּל הַטּוֹבָה
  choice: 因……所行的一切美事
  rationale: עַל与情感动词连用，表示引发欢喜的缘由；הַטּוֹבָה是集合性单数，用“一切美事”自然表达整体意义。
- source_word: עָשָׂה
  choice: 所行的
  rationale: 中文关系结构无需显式标出过去完成时；上下文已清楚表明这些行动先于叶忒罗的欢喜。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，采用现代简体中文读者最熟悉的规范音译，而不以“主”这一称号替代。
- source_word: לְיִשְׂרָאֵל
  choice: 为以色列
  rationale: ל在此表示受益对象，“为以色列”准确传达耶和华为其施行善事。
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: 就是耶和华救以色列
  rationale: 希伯来语关系从句的先行词与指向略有压缩；重述“耶和华”和“以色列”可在中文中清楚呈现施救者与获救者，同时保留该从句对前述美事的说明作用。
- source_word: מִיַּד מִצְרָיִם
  choice: 脱离了埃及的手
  rationale: 保留希伯来语“从……的手中”的形象；中文“脱离……的手”可理解为摆脱其控制或权势。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名，正文应译作专名而非称号“主”。“耶和华”是现代标准中文中最广为识别的传统音译；“雅威”较接近学术界常见的拟音，但不确定的古代发音不宜被表述为绝对定论。
- issue: אֲשֶׁר הִצִּילוֹ 的关系指向
  choice: 作为对“一切美事”的进一步说明，并将单数代词所指的集体“以色列”明说出来
  alternative: 直接译作“他所救出的以色列”
  rationale: 希伯来语可自然理解为说明耶和华所行的美事，即他救了作为集体单数的以色列。采用“就是”既不把救赎与前述美事割裂，也避免中文关系从句产生施受关系含混。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“美事”比抽象的“恩惠”更贴近原文集合性名词“好处、好事”，且不额外加入神学解释。正文保留“埃及的手”这一原文意象，并以脚注解释。所有脚注标记均已置于正文对应位置。
