base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: zh_hans
  text: 你和同你在一起的这些百姓一定都会累垮[a]，因为这件事对你来说太沉重了；你无法独自办理这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你一定会精疲力尽。”希伯来文以同一动词的不定式绝对形和未完成式连用，加强语气；直译近似“衰残，你必衰残”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: 你一定会累垮
  rationale: 不定式绝对形与未完成式同词根连用，表示强调和确定；结合上下文，指因劳累过度而耗尽精力。“一定会累垮”自然传达这一力度。
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה אֲשֶׁר עִמָּךְ
  choice: 不但你自己，连同你在一起的这些百姓也会如此
  rationale: 重复的 גַּם 将摩西和百姓双方都包括在结果之内；“这些百姓”符合现代汉语对眼前群体的自然指称，“也会如此”补足汉语句意而不增加新的内容。
- source_word: כִּי כָבֵד מִמְּךָ הַדָּבָר
  choice: 因为这件事对你来说太沉重了
  rationale: 保留 כָבֵד“沉重”的负担隐喻，并以“这件事”宽泛对应 הַדָּבָר，不把它过度限定为某种特定职务。
- source_word: לֹא תוּכַל עֲשֹׂהוּ לְבַדֶּךָ
  choice: 你无法独自承担
  rationale: 原文直译为“你不能独自做它”；在承接“太沉重”的中文语境中，“独自承担”更自然，也清楚表达摩西无力单独完成此事。
