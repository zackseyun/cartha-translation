base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: zh_hans
  text: 另一个儿子名叫以利以谢[a]，因为我父亲的上帝是我的帮助；他救我脱离了法老的刀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为：“因为我父亲的上帝是我的帮助，他救我脱离法老的刀。”原文没有“他说”。
    reason: 说明原文的命名解释没有明示说话动词，避免将其误读为直接引语。
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: 另一个儿子名叫
  rationale: הָאֶחָד 在上文已经提到一个儿子的语境中，惯常指“另一个”。汉语补出语境中明确的“儿子”，使句子自然清楚；“名叫”对应希伯来文的命名句式。
- source_word: אֱלִיעֶזֶר
  choice: 以利以谢
  rationale: 采用现代中文圣经传统中通行的人名音译。该名字与下文“上帝是我的帮助”形成语义呼应，但正文仍将其作为专名处理。
- source_word: כִּי
  choice: 因为
  rationale: 引出取名缘由，直接保留原文的因果说明。
- source_word: אֱלֹהֵי אָבִי
  choice: 我父亲的上帝
  rationale: 贴近原文的构造关系，同时使用自然的现代汉语表达，不把“父亲”泛化为祖先。
- source_word: בְּעֶזְרִי
  choice: 是我的帮助
  rationale: 保留 עֵזֶר 的名词表达及其与“以利以谢”之名的呼应。希伯来文没有明示系词和时态，汉语“是”也不强行限定为过去或现在。
- source_word: וַיַּצִּלֵנִי
  choice: 他救我脱离了
  rationale: 准确表达 נצל 的拯救、解救含义；“他”自然承接前面的上帝。
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: 法老的刀
  rationale: 保留原文具体而有张力的“刀”这一意象，不将其解释性改写为“杀害”或“权势”。
theological_decisions:
- issue: 取名说明是否补出“他说”
  choice: 不补“他说”，直接保留“因为……”的说明结构
  alternative: 补作“因为他说：……”
  rationale: 希伯来原文没有说话动词。直接呈现因果从句既忠于原文，也避免把取名理由明确归为引语或叙述者旁白。
- issue: בְּעֶזְרִי 的时态
  choice: 译作“是我的帮助”，不明确限定时态
  alternative: 译作“曾帮助我”或“曾是我的帮助”
  rationale: 原文是无明示系词的名词性表达；汉语不标明时态可以保存“上帝是我的帮助”与回顾具体拯救事件之间的张力。
- issue: “法老的刀”是否解释为政治权力或死亡威胁
  choice: 保留“法老的刀”
  alternative: 译作“法老的杀害”或“法老的权势”
  rationale: 原文意象既可指实际的致命威胁，也可转指法老施行死亡的权力；直译能保留这一开放性。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“另一个儿子”承接上文两个儿子的语境；“是我的帮助”和“法老的刀”保留原文的名词表达、名字呼应及具体意象。
