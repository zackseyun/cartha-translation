base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: zh_hans
  text: 可是，他们不听摩西的话[a]。有些男子把其中一些留到早晨，其中就生了虫，并且发臭[b]；摩西便向他们发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不听从摩西。”原文可以指拒绝听从，因而含有不服从的意思。
    reason: lexical_alternative
  - marker: b
    text: 原文直译：“虫子在其中出现了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: 听摩西的话
  rationale: שׁמע与אֶל连用可表示听某人的话、听从某人。正文采用自然汉语“听摩西的话”，既直接表达“听”，也让上下文显出不服从的含义，而不在正文中强化为单纯的“顺服”。
- source_word: וַיּוֹתִרוּ
  choice: 把其中一些留到早晨
  rationale: יתר的使役式表示留下、使之剩余；此处指违背吩咐，把一部分吗哪保留过夜。
- source_word: אֲנָשִׁים
  choice: 有些男子
  rationale: 原文是明确的阳性复数名词；“有些男子”既反映性别，也表达这里只涉及群体中的一部分人。
- source_word: מִמֶּנּוּ
  choice: 其中一些
  rationale: 代词回指吗哪；“其中一些”符合现代汉语表达，并准确表示留下的是一部分。
- source_word: עַד בֹּקֶר
  choice: 到早晨
  rationale: 直接呈现该时间界限；与“留到早晨”搭配自然。
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: 其中就生了虫
  rationale: 此处描述虫在留下的吗哪中出现或滋生；“生了虫”自然、具体，同时用脚注保留原文较为特殊的字面表达。
- source_word: וַיִּבְאַשׁ
  choice: 发臭
  rationale: 该动词表示变臭或发出恶臭；“发臭”简洁、鲜明，符合叙事语体。
- source_word: וַיִּקְצֹף עֲלֵהֶם
  choice: 向他们发怒
  rationale: קצף表示发怒，עַל指出怒气所针对的对象；“向他们发怒”保留了方向性，也符合庄重的现代汉语。
theological_decisions: []
translation_notes:
  register: 采用清楚、庄重而自然的现代标准汉语。以短句呈现叙事推进；保留“男子”的阳性指称，并借脚注说明“听”所含的听从意味及“生了虫”背后的希伯来语字面表达。
