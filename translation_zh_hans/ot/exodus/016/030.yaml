  yaml_path: translation/ot/exodus/016/030.yaml
  text: So the people rested on the seventh day[a].
translation:
  language: zh_hans
  text: 于是，百姓就在第七天歇息了[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“停止了”。这里的动词与“安息日”同源；译作“守了安息日”则属于解释性扩译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: 于是……歇了工
  rationale: שׁבת 的 Qal 叙事形式基本义为“停止、歇息”。结合上文禁止出去收取吗哪的语境，“歇了工”自然表达停止日常劳作，又不扩译为“守安息日”。
- source_word: הָעָם
  choice: 百姓
  rationale: עָם 在旷野叙事中指以色列民众的集合体；“百姓”是自然、庄重且符合中文圣经叙事语体的表达。
- source_word: בַּיּוֹם הַשְּׁבִעִי
  choice: 在第七天
  rationale: בְּ 与特定日期连用可自然译为“在”；הַשְּׁבִעִי 修饰“日”，合译为“第七天”。
- source_word: וַ
  choice: 于是
  rationale: 句首叙事性 waw 承接前文，并在语境中带出百姓对命令的响应；“于是”比机械译作“和”更符合现代汉语叙事。
theological_decisions:
- issue: 是否在动词中明确加入“守安息日”
  choice: 译作“歇了工”
  alternative: “守了安息日”或“停止了”
  rationale: 原文动词只明说百姓停止或歇息；安息日含义由该动词与“第七天”的语境共同显明。避免扩译为礼仪性较强的“守安息日”，同时保留与安息概念的词义联系。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“歇了工”便于普通读者理解，且比单说“歇息”更贴合停止日常活动的上下文；脚注保留“停止”的词义可能性。
