  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: zh_hans
  text: 我已经听见以色列人[a]的怨言。你要对他们说：‘黄昏时[b]，你们要吃肉；早晨，你们要吃饼得饱。你们就会知道，我是雅威[c]，是你们的上帝。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，是对以色列群体的常用称呼。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“两个傍晚之间”，指黄昏的暮光时段。
    reason: idiom
  - marker: c
    text: “雅威”音译希伯来文的上帝之名 יהוה（YHWH）；其古代确切读音不能完全确定。
    reason: divine_name
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: 我已经听见
  rationale: 完成式在此表示上帝已经听见、且此事与当前回应直接相关；“已经听见”符合现代汉语表达。
- source_word: תְּלוּנֹּת
  choice: 怨言
  rationale: 该词指旷野中反复发出的不满和抱怨；“怨言”既保留负面语气，又庄重自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此是对以色列群体的常用称呼；“以色列人”在现代汉语中最自然，并在脚注保留字面形式。
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: 你要对他们说
  rationale: 用自然汉语完整表达希伯来语的命令和引语引入结构，无须机械重复“说”。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 黄昏时
  rationale: 该短语字面是“两晚之间”，所指为日落前后的暮光时段；正文传达其通常意义，脚注保留原文意象。
- source_word: תֹּאכְלוּ בָשָׂר
  choice: 你们要吃肉
  rationale: בָשָׂר在食物语境中自然译为“肉”；未完成式在此表达即将实现的应许。
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: 你们要吃饼得饱
  rationale: שׂבע表示吃到饱足；“吃饼得饱”保留具体食物及饱足之意，也符合汉语搭配。
- source_word: וִידַעְתֶּם
  choice: 这样，你们就会知道
  rationale: 连接词加完成式在此带有结果意味；“这样……就会”清楚表达供应带来的认识。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名而非头衔的性质。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 虽为复数形态，该词在这里明确指以色列的独一上帝，故采用单数表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用上帝的专名。正文采用较贴近通常重构读音 Yahweh 的“雅威”，不以“主”这一头衔代替；脚注说明其性质，同时避免对古代确切元音作过度断言。
- issue: בְּנֵי יִשְׂרָאֵל 是否保留阳性字面形式
  choice: 以色列人
  alternative: 以色列的众子／以色列的子孙
  rationale: 该固定表达在本节指整个以色列群体。汉语“以色列人”准确、自然，不额外限定只有男性；字面形式则收入脚注，以保持原文透明度。
- issue: 认识雅威与神迹供应之间的关系
  choice: 这样，你们就会知道
  alternative: 你们也必知道
  rationale: 保留原句的结果性推进：吃肉、得饱之后，百姓将认识说话者是他们的上帝；不进一步界定这种“知道”是认知、承认还是经历性的认识。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“你要对他们说”避免照搬希伯来语引语公式造成生硬；“吃饼得饱”保留原文的具体意象。“我是雅威，是你们的上帝”用汉语同位结构清楚呈现身份宣告。
