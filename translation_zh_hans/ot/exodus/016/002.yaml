base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/002.yaml
  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: zh_hans
  text: 以色列人的全体会众在旷野向摩西和亚伦发怨言。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: 发怨言
  rationale: 该动词在此语境中表示群体对领袖不满、抱怨。“发怨言”既保留负面的抗议意味，也符合现代汉语的圣经叙事语体。
- source_word: כָּל עֲדַת
  choice: 全会众
  rationale: כָּל 强调整体，עֵדָה 指作为一个群体的以色列共同体；“全会众”简洁地保留二者的整体性和群体性。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在此作为以色列民族共同体的称谓。“以色列人”是自然、准确的现代汉语表达，字面形式则在脚注中保留。
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: 向摩西和亚伦
  rationale: עַל 在抱怨语境中标明怨言所针对的对象。汉语通常说“向某人发怨言”，既自然，也清楚表达针对性。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 指荒僻、少有人烟之地，不必然是沙漠；“旷野”准确且符合出埃及记的叙事语域。
theological_decisions:
- issue: 如何翻译群体称谓 בְּנֵי יִשְׂרָאֵל
  choice: 正文译“以色列人”，脚注注明字面译法
  alternative: 以色列众子；以色列的儿女
  rationale: 此处虽采用语法上的阳性复数“众子”，却作为整个圣约群体的民族称谓。正文用现代汉语惯用的“以色列人”，避免让读者误以为只指男性，同时用脚注透明保留原文的字面形式及传统译法，不额外引入神学限定。
translation_notes:
  register: 采用现代、庄重而清楚的叙事汉语。“发怨言”保留群体抱怨领袖的负面意味；句序基本顺从希伯来文，同时保持汉语自然流畅。
