  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: zh_hans
  text: 亚伦正对以色列全会众说话的时候，他们转身面向旷野；看哪，雅威的荣耀在云中显现了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: 正……说话的时候
  rationale: וַיְהִי承接叙事，כ加不定词结构表示同时发生；现代汉语用“正……的时候”自然表达时间重叠，无须机械译出“事情发生了”。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: עֵדָה指作为整体聚集的共同体；“全会众”简洁保留群体含义。“以色列”在此按汉语圣经语境可自然指以色列子民，避免生硬的“以色列众子”。
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: 他们转身面向旷野
  rationale: פנה与אֶל表示转向某处；“转身面向”既表达动作，也不把经文过度具体化为行进。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留提示读者突然注意随后景象的指示与修辞力量，也符合庄重叙事语体。
- source_word: כְּבוֹד יְהוָה
  choice: 耶和华的荣耀
  rationale: כָּבוֹד在此指可显现的神圣荣光；所属结构直译自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中对四字神名最通行、可辨识的音译，作为专名而非以“主”这一称号替代。
- source_word: נִרְאָה
  choice: 显现了
  rationale: ראה的尼法勒式在此表示进入可见状态或出现；“显现”贴合神圣临在的语境，且不强行指定观看者。
- source_word: בֶּעָנָן
  choice: 在云中
  rationale: 介词附带定冠词，指特定的云；汉语在上下文中通常无需另译定冠词，“云中”保留其所在范围而不额外解释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文稿以“耶和华”保留专名性质并符合普通现代读者的通行认知；“雅威”是较接近学界重构读音的可行替代，但读音本身并非完全确定。
- issue: בְּנֵי יִשְׂרָאֵל的表达
  choice: 以色列全会众
  alternative: 以色列众子的全会众
  rationale: 该固定称谓在群体语境中指以色列子民。译作“以色列全会众”保留共同体范围且符合现代汉语；逐字译为“众子”会显得生硬，并可能使读者误以为只强调生理男性。
- issue: 荣耀与云的关系
  choice: 荣耀在云中显现
  alternative: 荣耀显现在云上／借着云显现
  rationale: בֶּעָנָן最直接表示“在云中”。译文不进一步判定荣耀是在云上、由云承载，还是借云显露，从而保留原文的空间与神显张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”有意保留希伯来叙事中的突显语气；句中用分号呈现转身与突然看见神圣显现之间的推进。
