lexical_decisions:
- source_word: הָעֹמֶר
  choice: 一俄梅珥
  rationale: עֹמֶר是古代希伯来干量单位。采用音译“俄梅珥”，避免用不精确的现代容量单位替代；在说明单位换算关系的汉语句式中，以“一俄梅珥”自然表达一个标准单位。
- source_word: עֲשִׂרִית
  choice: 十分之一
  rationale: 此词在这里表示分数，即“十分之一”；这一译法准确、简明，也符合现代汉语习惯。
- source_word: הָאֵיפָה
  choice: 伊法的
  rationale: אֵיפָה是另一种古代干量单位，音译为“伊法”。属格关系用“伊法的十分之一”自然表达。
- source_word: הוּא
  choice: 是
  rationale: 该代词在无动词名词句中起系词作用，汉语用“是”明确表达定义关系。
- source_word: וְ
  choice: 不单独译出
  rationale: 此处连接词引入补充性的度量说明。现代汉语独立成句时无需机械译作“而”或“又”；省略可保持自然，同时不损失命题内容。
