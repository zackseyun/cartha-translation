  text: 到了晚上，鹌鹑来到，覆盖了营地；早晨，营地四周有一层露水。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: 到了晚上
  rationale: 这是希伯来叙事中推进事件、交代时间的常见表达；译为“到了晚上”自然地保留了事件进展感，不必生硬地译出“事情发生了”。
- source_word: וַתַּעַל הַשְּׂלָו
  choice: 鹌鹑飞来
  rationale: עלה的基本意象是“上来”；以鹌鹑为主语时，现代汉语用“飞来”最自然，也符合鸟群来到营地的情景。שְׂלָו在此作集合名词处理。
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: 布满了营地
  rationale: כסה意为“遮盖、覆盖”。描述鹌鹑群时，“布满了营地”比“覆盖了营地”更符合现代汉语习惯，同时保留数量众多、遍及营地的画面。
- source_word: וּבַבֹּקֶר
  choice: 早晨
  rationale: 直接标明下一个时间场景；分号已经表达叙事衔接，无须机械译出连接词。
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: 有一层露水
  rationale: שִׁכְבַת表示铺展的一层；汉语存在句“有一层露水”准确、自然地表达原文。
- source_word: סָבִיב לַמַּחֲנֶה
  choice: 营地四周
  rationale: סָבִיב לַ־表示环绕某处的位置；“营地四周”简洁准确。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文从晚上到早晨的平行时间结构，并用分号清楚区分两个连续场景。英文咨询稿所附脚注只涉及英语中主语前置与存在句的句法选择，在中文里不会形成实质性的意义差异，因此不设脚注。
