base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: zh_hans
  text: 他们用俄梅珥[a]量了之后，收得多的没有剩余，收得少的也不缺少；各人都按自己的食量收集。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 俄梅珥是古代的容量单位，等于十分之一伊法（见16:36）。
    reason: 说明保留的古代度量单位。
  - marker: b
    text: “没有剩余……也不缺少”也可译作“没有多余……毫无缺乏”。
    reason: 保留表示盈余和缺乏的词汇替代。
lexical_decisions:
- source_word: וַיָּמֹדּוּ בָעֹמֶר
  choice: 他们用俄梅珥量过以后
  rationale: וַיָּמֹדּוּ表示叙事中的后续动作“他们量了”；这里又引出量过之后的结果，译作“量过以后”符合汉语表达。בָעֹמֶר指以俄梅珥这一容量单位衡量，保留古代单位而不作不确定的现代换算。
- source_word: הַמַּרְבֶּה לֹא הֶעְדִּיף
  choice: 收得多的没有剩余
  rationale: 两个分词在吗哪收取的语境中自然指“收得多的”和“收得少的”；הֶעְדִּיף表达有余量或超过所需，译作“没有剩余”简明而贴合上下文。
- source_word: וְהַמַּמְעִיט לֹא הֶחְסִיר
  choice: 收得少的也不缺少
  rationale: 保留与前半句相称的对偶结构；הֶחְסִיר表示不足、缺欠，“不缺少”准确传达其意义。
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: 各人都按自己的食量
  rationale: אִישׁ在此具有逐一分配的作用，译作“各人”不把所指误限于成年男性；לְפִי אָכְלוֹ是按个人可食用之量的表达，“按自己的食量”自然、简洁，并保留个体需要的含义。
- source_word: לָקָטוּ
  choice: 收取
  rationale: 该动词在本段指收集吗哪；“收取”与前文“收得”呼应，符合现代汉语叙事。
theological_decisions:
- issue: אִישׁ ... אָכְלוֹ中的阳性单数分配结构
  choice: 各人都按自己的食量
  alternative: 各人按他所能吃的收取
  rationale: 希伯来语用阳性单数表达群体中逐一的个人，并非明确排除女性。汉语以“各人……自己的”既保留分配性和单数指向，又避免无根据地限定性别。
- issue: “多的／少的”是指收取动作还是量得的结果
  choice: 正文译作“收得多的／收得少的”
  alternative: 多的没有多余，少的也不缺少
  rationale: 上下文明确谈论收取吗哪，补出“收得”使汉语清楚；但希伯来分词本身较简略，未明说宾语，因此脚注保留更形式对应的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“量过以后……；……”清楚呈现动作与结果，“没有剩余／也不缺少”保留原文整齐的对比和平衡。
