  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: zh_hans
  text: 以色列人对他们说：“巴不得我们在埃及地坐在肉锅旁、吃饼吃到饱的时候，就死在雅威手下！[a] 因为你们把我们领到这旷野来，要让这整个会众都饿死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统汉语译本也常译作“耶和华”，另有译本按犹太诵读传统译作“上主”。
    reason: 说明神名的原文形式及主要译法。
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该族群称谓最自然、准确的表达；希伯来语虽字面为“以色列的众子”，此处具有代表全体百姓的惯用集体含义。
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: 巴不得我们……就死了
  rationale: מִי יִתֵּן 在这里不是实义疑问，而是表达强烈愿望；结合“我们死”构成对过去情形的反事实愿望。
- source_word: בְיַד יְהוָה
  choice: 死在雅威手中
  rationale: 保留“在……手中”这一希伯来语施事意象，同时用自然汉语表达“由雅威使之死亡”的意思。
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: 我们……坐在肉锅旁
  rationale: 保留原文具体的“肉锅”意象；עַל 在此可自然理解为坐在锅旁。
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: 吃饼吃得饱足
  rationale: לֶחֶם 可指饼或食物；此处译作“饼”以保留原文具体词汇，לָשֹׂבַע 则表达吃到饱足。
- source_word: הַמִּדְבָּר הַזֶּה
  choice: 这旷野
  rationale: “旷野”准确体现出埃及记中 מִדְבָּר 的荒僻地域含义，也延续其重要的地理叙事意象。
- source_word: לְהָמִית אֶת כָּל הַקָּהָל הַזֶּה בָּרָעָב
  choice: 要让这全体会众都饿死
  rationale: 以现代汉语自然表达“使这整个会众因饥饿而死”；“全体会众”保留 קָהָל 的群体集合意义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”以音译其较通行的学术拟音，并保留其作为以色列之神专名的性质；脚注列出汉语传统译名，避免把有争议的发音问题说成完全确定。
- issue: בְּנֵי יִשְׂרָאֵל 的集体所指
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 此处该阳性复数亲属表达是对全体以色列百姓的惯用称呼。“以色列人”不把经文限缩为只有男性，也不额外引入教派性解释。
- issue: 百姓对埃及生活的描述
  choice: 按说话者的抱怨直接保留
  alternative: 加注说明这是夸张或失实的回忆
  rationale: 经文记录的是百姓自己的控诉。译文既不把他们的说法当作叙述者的客观确认，也不在正文中替叙述者评断其真假，从而保留叙事张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。直接引语保留百姓强烈、带控诉意味的口吻；用“巴不得”传达反事实愿望，用“肉锅”“饱足”“旷野”“会众”等词保存原文意象和出埃及记的叙事语汇。
