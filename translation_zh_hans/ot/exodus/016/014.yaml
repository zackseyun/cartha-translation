base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: zh_hans
  text: 露水那一层升上去后，看哪，旷野的地面上有细小、呈薄片状的东西[a]，像地上的霜那样细。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“细小、呈鳞片状的东西”。译作“呈薄片状”的希伯来语词十分罕见，其确切含义不确定，可能描述质地，也可能描述外观。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: 升起之后
  rationale: עלה的基本意思是“上升、升起”。这里指露水从地面消失，但不直接译作“蒸发”，以免把原文意象解释得过实。
- source_word: שִׁכְבַת הַטָּל
  choice: 露水层
  rationale: שִׁכְבָה指铺展或沉积的一层；“露水层”简洁自然，也保留了原文所描绘的覆盖状态。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה用于唤起注意，突出眼前突然显现的景象；“看哪”保留了叙述的鲜明感和庄重感。
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: 旷野表面
  rationale: פְּנֵי在此指“表面”；מִדְבָּר译作“旷野”，符合《出埃及记》的环境，又避免将其限定为纯沙漠。
- source_word: דַּק
  choice: 细小
  rationale: 该词可表示细、薄或小；本句两次均译作“细小”，既保留重复，也适合描述地面上的物质。
- source_word: מְחֻסְפָּס
  choice: 呈薄片状的东西
  rationale: 这是罕见且含义不完全确定的词，可能描述外观或质地。“呈薄片状”表达一种较可能的理解；“东西”为汉语句法所需的补词，并未在原文中另有对应名词。
- source_word: דַּק כַּכְּפֹר
  choice: 细小如……霜
  rationale: כְּפֹר指霜或白霜；此译保留明喻，并与前一个דַּק形成原文式的重复。
- source_word: עַל הָאָרֶץ
  choice: 地上的
  rationale: אֶרֶץ在此指眼前的地面；“地上”比“地、土地”更符合具体场景，也使“如地上的霜”自然通顺。
theological_decisions: []
