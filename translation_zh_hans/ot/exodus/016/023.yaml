  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: zh_hans
  text: 他对他们说：“耶和华所说的是这样：明天是一个完全安息的日子，是归耶和华的圣安息日[a]。你们要烤的，就烤；要煮的，就煮[b]；所有剩下的，都留起来，保存到早晨。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“是向耶和华守的圣安息日”。
    reason: 介词 לַ 可侧重归属、朝向或为某对象而守；正文与此译法分别呈现其可能语气。
  - marker: b
    text: 希伯来原文重复“烤”和“煮”这两个动词，以加强语气，直译为“你们要烤的，烤；要煮的，煮”。
    reason: 说明原文的动词重复及正文采用的自然中文对应形式。
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 他对他们说
  rationale: 保留希伯来叙事中引出直接引语的常规表达；中文无需机械译出连接词 וַ。
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: 耶和华所说的是这样
  rationale: 自然呈现指向当前吩咐的强调结构，并保留 דִּבֶּר 的完成意义及其当前效力。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、可辨识的音译。
- source_word: שַׁבָּתוֹן
  choice: 完全休息的日子
  rationale: 该词表示特别或彻底的停止劳作；此译法既区别于普通休息，也避免引入原文没有明说的仪式细节。
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: 归耶和华为圣的安息日
  rationale: 保留安息日的神圣性质及其朝向、归属耶和华的意义。
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: 你们要烤的，就烤吧
  rationale: 以自然中文保留同一词根重复所形成的许可兼命令语气。
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: 要煮的，就煮吧
  rationale: בשל 在此可泛指烹煮，但与“烤”并列时译作“煮”更具体，并保留平行重复。
- source_word: כָּל הָעֹדֵף
  choice: 凡剩下的
  rationale: 准确表达预备食物之后所有余下之物，中文简洁自然。
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת
  choice: 都为自己留起来，保存
  rationale: 分别体现有意放置、为自己保留以及妥善存留的目的。
- source_word: עַד הַבֹּקֶר
  choice: 到早晨
  rationale: 直接表达保存期限，不擅自添加“第二天”等解释性信息。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是普通现代中文读者最熟悉的专名形式，不以“主”替代原文神名。
- issue: שַׁבָּתוֹן שַׁבַּת קֹדֶשׁ לַיהוָה 的句法关系
  choice: 明天是完全休息的日子，是归耶和华为圣的安息日
  alternative: 明天要完全休息，守耶和华的圣安息日
  rationale: 采用同位解释关系，保留两个名词短语的层叠强调；不把它改写成两个独立命令。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“完全休息的日子”传达 שַׁבָּתוֹן 的强化意味；“就……吧”使重复命令在中文中自然，同时不削弱摩西传达神谕的权威语气。
