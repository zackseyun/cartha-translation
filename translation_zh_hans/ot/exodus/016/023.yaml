revisions:
- from: 他对他们说：“耶和华所说的是这样：明天是完全休息的日子，是归耶和华为圣的安息日[a]。你们要烤的，就烤吧；要煮的，就煮吧[b]；凡剩下的，都为自己留起来，保存到早晨。”
  to: 他对他们说：“耶和华所说的是这样：明天是一个完全安息的日子，是归耶和华的圣安息日[a]。你们要烤的，就烤；要煮的，就煮[b]；所有剩下的，都留起来，保存到早晨。”
  rationale: 修订仅澄清“圣”与“归耶和华”的修饰关系，并以更直接的中文命令形式保留原文动词重复及指令语气；其余内容、神名译法和脚注锚点均予保留。
