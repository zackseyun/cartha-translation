  text: וַ/יִּקְרְא֧וּ בֵֽית יִשְׂרָאֵ֛ל אֶת שְׁמ֖/וֹ מָ֑ן וְ/ה֗וּא כְּ/זֶ֤רַע גַּד֙ לָבָ֔ן וְ/טַעְמ֖/וֹ כְּ/צַפִּיחִ֥ת בִּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/031.yaml
  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: zh_hans
  text: 以色列家给这食物起名叫吗哪[a]。它像白色的芫荽籽[b]，滋味如同掺蜜的薄饼[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语作“曼”（man）；中文传统译作“吗哪”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“像芫荽的籽，是白色的。”
    reason: lexical_alternative
  - marker: c
    text: “薄饼”所译的希伯来语词也可指薄脆饼或小饼；本句也可译作“如同带蜜的薄饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל
  choice: 以色列家……起名叫
  rationale: 保留“以色列家”这一希伯来语的群体称谓；“起名叫”自然表达 קרא 在命名语境中的意义。
- source_word: אֶת־שְׁמוֹ
  choice: 给这食物起名
  rationale: 原文直译为“叫它的名字”；根据上文补出“这食物”，使现代汉语清楚自然，同时保留明确的命名动作。
- source_word: מָן
  choice: 吗哪
  rationale: 采用现代中文圣经传统中通行的音译；脚注说明希伯来语形式。
- source_word: כְּזֶרַע גַּד לָבָן
  choice: 像白色的芫荽籽
  rationale: גַּד 通常辨认为芫荽，לָבָן 表示白色；此语序在现代汉语中最自然。
- source_word: וְטַעְמוֹ
  choice: 滋味
  rationale: טַעַם 在此指食物的味道；“滋味”庄重而通俗。
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: 如同掺蜜的薄饼
  rationale: צַפִּיחִת 指一种薄饼或薄脆饼；介词 בּ 可表达配料或伴随关系，“掺蜜的”比直译“在蜜中”更合乎汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“以色列家”保留原文的群体表达；用“这食物”明确代词所指。“芫荽籽”和“掺蜜的薄饼”使用普通读者能够理解的食物意象，并以脚注保留句法及词义上的其他可能。
