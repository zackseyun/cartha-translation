lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词在叙事中引出一次新的说话事件；现代汉语用“说”自然准确，也避免用“吩咐”额外加入命令意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名 YHWH，保留其作为专名的性质，而不以称号代替。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话对象；“对摩西”符合现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 这是常见的引语导入格式。汉语无需重复译成“说着说”，以“说：”自然承接下一节的直接引语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH。正文采用“雅威”以保留专名；脚注说明传统译名，既不把专名改为称号，也承认汉语读者熟悉的传统形式。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“说：”承接下一节内容，符合汉语叙事习惯；脚注标记紧随其所解释的神名。
