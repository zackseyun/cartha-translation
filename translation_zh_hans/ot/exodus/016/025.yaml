  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: zh_hans
  text: 摩西说：“今天吃吧，因为今天是归耶和华的安息日；今天你们在田野里找不到它。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: 吃这个吧
  rationale: 该形式是复数命令式，后接阳性单数宾语；用“这个”自然指代前文的吗哪，“吧”使现代汉语命令语气自然，但不削弱指令性。
- source_word: שַׁבָּת הַיּוֹם לַיהוָה
  choice: 今天是向耶和华守的安息日
  rationale: לַיהוָה 表明此安息日归于或献给耶和华；译作“向耶和华守的”兼顾归属与敬奉含义，并采用“耶和华”对应圣名。
- source_word: בַּשָּׂדֶה
  choice: 在野外
  rationale: 此处指吗哪通常出现、供人收取的户外地面；“野外”比字面的“田地”更符合旷野叙事场景。
theological_decisions:
- issue: 安息日与耶和华的关系
  choice: 向耶和华守的安息日
  alternative: 耶和华的安息日
  rationale: 原文 לַיהוָה 可表达“归耶和华、向耶和华”；所选译法保留敬奉方向，避免把它仅理解为所有权。
- issue: 吗哪在安息日不可找到
  choice: 你们在野外找不到它
  alternative: 野外没有它
  rationale: 保留原文第二人称复数未完成式的主体与直接陈述，不进一步解释为神迹停止或禁止寻找。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。保留原文三次“今天”的重复，以呈现强调和节奏；“你们”明确体现希伯来语复数人称。
