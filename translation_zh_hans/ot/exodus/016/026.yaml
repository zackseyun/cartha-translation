base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: zh_hans
  text: 六天，你们要收取它；但[a]第七天是安息日[b]，那一天不会有吗哪[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而第七天”。希伯来语连接词也可直译为“而”，但这里的上下文带有对比意味。
    reason: lexical_alternative
  - marker: b
    text: 直译：“第七天，安息日。”
    reason: lexical_alternative
  - marker: c
    text: “吗哪”是按上下文补明的；希伯来文末句直译近似：“它不会在那一天出现。”
    reason: implicit_referent
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六天之内
  rationale: 该结构按希伯来语习惯表示“六天”；加“之内”自然表达持续六日收取的时间范围。
- source_word: תִּלְקְטֻהוּ
  choice: 你们要收取它
  rationale: 动词 לקט 表示捡取、收集；第二人称复数主语和第三人称阳性单数宾语后缀分别译为“你们”和“它”。“要”兼顾未完成式在本段中的指示意味。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: 但第七天
  rationale: וְ 本可直译“而/和”，这里与前六天形成明显对比，故译“但”；脚注保留较形式对应的可能译法。
- source_word: שַׁבָּת
  choice: 是安息日
  rationale: שַׁבָּת 与“第七天”构成同位关系。现代汉语不使用不定冠词，因此“是安息日”既自然，也不把原文无冠词的形式强行解释为特指或泛指。
- source_word: לֹא יִהְיֶה בּוֹ
  choice: 那一天不会有吗哪
  rationale: 字面为“它不会在其中/其上有”，其中 בּוֹ 回指第七天，所缺之物由上下文确定为吗哪。正文明确所指以避免汉语残缺，脚注保留原文的省略表达。
theological_decisions:
- issue: 西奈立约之前语境中 שַׁבָּת 的表达
  choice: 是安息日
  alternative: 是一个安息日／是休息之日
  rationale: 希伯来词在此无冠词，并与“第七天”同位。汉语“是安息日”本身不标示定指或不定指，因而能保留原文的开放性，不提前引入后续礼仪制度的全部含义；译作“休息之日”则会弱化这一专门词语。
- issue: 末句省略的主语
  choice: 在正文中补明“吗哪”
  alternative: 那一天不会有
  rationale: 希伯来文依上下文省略所指对象，指当天不会出现可收取的吗哪。现代汉语若只说“不会有”显得突兀，补出“吗哪”是语境性明示，并以脚注交代字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事诫命语体。“收取”比“采集”更贴合捡拾吗哪的动作；分号呈现六日与第七日之间的对照。所有解释性补足均限于上下文明确的信息，并用脚注标示。
