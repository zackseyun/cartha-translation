  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: zh_hans
  text: 他们每天早晨都收取吗哪；各人按自己的食量收取。太阳一热，吗哪就融化了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ אֹתוֹ
  choice: 他们……收取
  rationale: לָקַט在此指收集食物；“收取”自然、具体。宾语代词אֹתוֹ承接上文，本节末用“那东西”再次明确其指代而不直接增译“吗哪”。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 每天早晨
  rationale: 希伯来语重复“早晨”具有逐日、反复之意；现代汉语用“每天早晨”最自然地表达这一分配性含义。
- source_word: אִישׁ
  choice: 各人
  rationale: אִישׁ在这里作分配性用法，指群体中的每一个人；“各人”保留单数分配意义，也符合现代汉语表达。
- source_word: כְּפִי אָכְלוֹ
  choice: 按自己的食量
  rationale: 字面近于“照他进食之口”，是按各人食用需要或食量的习语；“按自己的食量”简明而准确。
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: 太阳一热
  rationale: חם表示太阳变热；“一……就……”自然呈现本句的时间推进及与下句的紧密关系。
- source_word: וְנָמָס
  choice: 那东西就融化了
  rationale: מסס在此意为因热而融化。“融化”符合语境；补出“那东西”承接希伯来语隐含主语，避免汉语句意含混。
