  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: zh_hans
  text: 这是雅威所吩咐的：“你们要从中收取，各人按自己的食量；照你们的人数，每人[a]一俄梅珥。各人要为自己帐篷里的人拿取。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“每个头一俄梅珥”。
    reason: 保留לַגֻּלְגֹּלֶת的字面表达；正文“每人”准确传达其计数用法。
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: 这是……所吩咐的事
  rationale: דָּבָר可指“话、事、事情”；在宣告命令的固定表达中，中文用“所吩咐的事”既保留命令内容的含义，又自然庄重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行中文音译处理，保留其作为专名的性质，不以称号替代。
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: 收取
  rationale: לקט指拾取、收集食物；上下文已明确所指为吗哪，中文无需重复“从它”，用“收取”简洁自然。
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: 各人按自己的食量
  rationale: אִישׁ在此作逐一分配用法；לְפִי אָכְלוֹ直译近于“照他的食用”，意指各人所需食量。
- source_word: עֹמֶר
  choice: 俄梅珥
  rationale: 这是古代特定干量单位，现代等值并非本节重点，因此采用音译。
- source_word: לַגֻּלְגֹּלֶת
  choice: 每人
  rationale: 字面为“每个头”，在计数语境中自然表示“每人”；字面形象收入脚注。
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: 照你们的人数
  rationale: נֶפֶשׁ在此指被计数的个人，并非专指非物质的“灵魂”；“人数”准确自然。
- source_word: לַאֲשֶׁר בְּאָהֳלוֹ
  choice: 为自己帐篷里的人
  rationale: 保留原文具体的“帐篷”意象，不扩大解释为抽象的“家属”或“全家”。
- source_word: תִּקָּחוּ
  choice: 各人要……拿取
  rationale: 第二人称复数命令与前面的逐人分配结构结合，译文以“各人”呈现其分配性，同时保留命令语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以四个辅音构成的神名；“雅威”按学界通常重构发音音译，保留其专名性质。“耶和华”是中文传统形式，但源于较晚形成的混合读法。
- issue: נֶפֶשׁ在计数表达中的含义
  choice: 人数
  alternative: 灵魂的数目
  rationale: 本节讨论按帐篷人数分配食物，נֶפֶשׁ在这里指一个个的人；译为“灵魂”会无端引入身心二分的神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“食量”“人数”清楚传达分配标准；保留“帐篷”和古代量词“俄梅珥”，避免将历史场景现代化。
