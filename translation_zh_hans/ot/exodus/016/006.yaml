base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: zh_hans
  text: 摩西和亚伦对以色列众人[a]说：“到了晚上，你们就会知道，雅威把你们从埃及地领出来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“以色列的众子”；这里指全体以色列人。
    reason: 说明 בְּנֵי יִשְׂרָאֵל 的字面形式及其在本处指称的群体。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出承接叙事的 וַ，因现代汉语在上下文中通常无需用“然后”或“于是”明示；“说”自然推进叙事。
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: 摩西和亚伦
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: 对以色列全体子民[a]
  rationale: “子民”保留 בְּנֵי 所表达的群体关系，又比字面的“众子”更符合现代汉语；脚注说明直译及常见译法。
- source_word: עֶרֶב
  choice: 到了晚上
  rationale: 该名词在此作时间状语；“到了晚上”自然表达即将到来的时点，同时不额外限定为“今天晚上”。
- source_word: וִידַעְתֶּם
  choice: 你们就会知道
  rationale: 表达未完成式在语境中的将来意义；“就”体现到了所说时点便会得知的语篇关系。
- source_word: כִּי
  choice: 是……的
  rationale: כִּי 引出“知道”的内容；汉语用“是……的”焦点结构自然突出施事者雅威。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，不以称号代替。
- source_word: הוֹצִיא אֶתְכֶם
  choice: 把你们……领出来
  rationale: 使役形在此意为“带出、领出”；“领出来”符合汉语习惯，并保留雅威亲自施行拯救的意味。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 明确译出 אֶרֶץ“地”，较单译“从埃及”更贴近原文。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；采用“雅威”作为现代汉语音译，避免用“主”这一称号替代专名。
- issue: 出埃及行动的施事者强调
  choice: 是雅威把你们从埃及地领出来的
  alternative: 雅威把你们从埃及地领了出来
  rationale: 汉语“是……的”结构反映本句 כִּי 从句中显著的主语 יְהוָה，并自然传达他们将认明出埃及行动的真正施事者；不扩展为额外的教义说明。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“到了晚上”清楚顺畅；“以色列全体子民”兼顾希伯来表达的可见度和普通读者的理解；神名统一译作“雅威”。
