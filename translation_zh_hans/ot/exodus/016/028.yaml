  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你们拒不遵守我的诫命和律法[a]，要到几时呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“训诲”。希伯来语“托拉”的复数形式既可指律法，也可指具有权威的教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事动词承接上文、推进事件；现代汉语通常无需另译连接词，也能自然表达先后关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以称号替代。
- source_word: עַד אָנָה
  choice: 要到几时呢
  rationale: 这是责问持续状态的惯用语；此译法自然、庄重，并保留反问语气。
- source_word: מֵאַנְתֶּם
  choice: 你们拒不
  rationale: 该动词表示拒绝、不肯；“拒不”简洁地传达持续而顽固的不顺从，复数第二人称译为“你们”。
- source_word: לִשְׁמֹר
  choice: 遵守
  rationale: שׁמר以诫命为宾语时表示谨守、实行；“遵守”符合现代汉语法律与盟约语境。
- source_word: מִצְוֺתַי
  choice: 我的诫命
  rationale: 保留神圣命令及盟约语境中的规范性，比一般的“命令”更贴合本处语域。
- source_word: וְתוֹרֹתָי
  choice: 和律法
  rationale: 复数תורות与“诫命”并列，在本段语境中具有权威和规范作用；主文译作“律法”，同时以脚注保留“训诲”的语义可能。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的拟音，也避免用“主”等称号替代专名。
- issue: 复数תּוֹרוֹת的语义
  choice: 律法
  alternative: 训诲
  rationale: 它与“诫命”并列，规范性明显，因此主文采用“律法”；但תורה也可指权威性的教导或训诲，故以脚注保留这一真实的词义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们拒不……要到几时呢”保留原文对群体持续悖逆的责问。脚注标记置于其实际说明的“律法”之后。
