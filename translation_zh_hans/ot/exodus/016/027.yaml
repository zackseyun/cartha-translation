base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: zh_hans
  text: 到了第七天，百姓中有些人出去拾取[a]，却什么也没有找到。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“从百姓中”，表示出去的只是部分百姓。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了
  rationale: 这是叙事性的 wayyiqtol，承接前文并引出下一事件。现代汉语用“到了第七天”自然表达事件随时间推进，无须生硬译出“事情发生了”。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 忠实保留原文的时间表达，不增添“每周”等原文没有明说的内容。
- source_word: יָצְאוּ
  choice: 出去
  rationale: 表示从营地或住处向外行动；“出去”是现代汉语中自然准确的表达。
- source_word: מִן הָעָם
  choice: 百姓中有人
  rationale: 介词 מִן 在此具有部分含义，表明行动者只是百姓中的一部分，并非全体。
- source_word: לִלְקֹט
  choice: 收取
  rationale: לקט 指收集、拾取；上下文已明确所收取的是吗哪，因此正文不补出宾语，以保留原文的简洁。
- source_word: וְלֹא מָצָאוּ
  choice: 却什么也没找到
  rationale: 原文直译为“而没有找到”。“却”自然呈现出去收取却落空的转折关系，“什么也没找到”在汉语中完整表达省略的宾语。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“到了第七天”保持叙事推进；“百姓中有人”清楚表达原文 מִן הָעָם 的部分含义。正文保留“收取”的宾语省略，由上下文确定所指为吗哪。
