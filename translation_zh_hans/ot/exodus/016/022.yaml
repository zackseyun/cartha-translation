  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שִּׁשִּׁ֗י לָֽקְט֥וּ לֶ֨חֶם֙ מִשְׁנֶ֔ה שְׁנֵ֥י הָ/עֹ֖מֶר לָ/אֶחָ֑ד וַ/יָּבֹ֨אוּ֙ כָּל נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה וַ/יַּגִּ֖ידוּ לְ/מֹשֶֽׁה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: zh_hans
  text: 到了第六天，他们收取了双份的饼，每人两俄梅珥[a]。会众所有的首领都来告诉摩西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俄梅珥”是古代以色列使用的干量单位。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了
  rationale: 这是叙事推进结构，与时间短语连用时译作“到了第六天”自然、庄重，也避免古奥的“事情是这样”。
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: 第六天
  rationale: 直接表达带定冠词的序数时间短语。
- source_word: לָקְטוּ
  choice: 收取
  rationale: 在吗哪语境中指把所得的供应收集起来；“收取”既贴近原义，也符合现代汉语。
- source_word: לֶחֶם
  choice: 饼
  rationale: 原文用“饼”而非泛称“食物”；保留这一措辞，可延续本章把吗哪称为饼的主题。
- source_word: מִשְׁנֶה
  choice: 双份
  rationale: 该词表示加倍的数量；“双份的饼”简洁自然，并由下文“每人两俄梅珥”具体说明。
- source_word: שְׁנֵי הָעֹמֶר
  choice: 两俄梅珥
  rationale: 原文明确给出两个俄梅珥；保留古代量制名称，避免用并不完全对应的现代单位替换。
- source_word: לָאֶחָד
  choice: 每人
  rationale: 字面为“给一个”，在此具有逐一分配的含义；“每人”清楚传达这一分配用法。
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: 会众所有的首领
  rationale: נְשִׂיאִים 指群体中公认的首领，עֵדָה 指聚集的共同体；此译法准确且符合现代教会外也能理解的汉语。
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: 都来告诉摩西
  rationale: 保留“来”与“告诉”两个连续动作，同时使汉语句式流畅。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“饼”保留原文 לֶחֶם 的具体意象；将脚注标记放在“俄梅珥”之后，使文化说明与被解释的词直接对应。
