base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: zh_hans
  text: 以色列人[a]吃吗哪四十年，直到他们来到有人居住之地[b]；他们一直吃吗哪，直到来到迦南地的边界[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“以色列的众子”，是对以色列百姓的固定称谓。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“已定居之地”或“有人定居之地”。这句话把那里与旷野相对照。
    reason: lexical_alternative
  - marker: c
    text: “边界”也可译作“边缘”或“尽头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，但这是指以色列全体百姓的固定族群称谓；现代汉语用“以色列人”最自然，也不误解为仅指男性。
- source_word: אָכְלוּ אֶת־הַמָּן
  choice: 吃吗哪
  rationale: אָכְלוּ是概述过去经历的完成式；“吃”准确自然。“吗哪”采用现代中文圣经语境中的通行名称。
- source_word: אַרְבָּעִים שָׁנָה
  choice: 四十年
  rationale: 按原文直接表达持续的年数。
- source_word: עַד בֹּאָם
  choice: 直到他们来到／直到来到
  rationale: 该结构表示时间终点；“来到”紧贴בוא的基本意义，避免把它解释性地译作“进入”。第二次省略主语，使中文行文自然。
- source_word: אֶל־אֶרֶץ נוֹשָׁבֶת
  choice: 来到有人居住之地
  rationale: נוֹשָׁבֶת表示土地已有人居住或适合定居，与旷野形成对照；“有人居住之地”保留其被动结果意味。
- source_word: אֶל־קְצֵה אֶרֶץ כְּנָעַן
  choice: 来到迦南地的边界
  rationale: קְצֵה可指边缘、尽头或边界；地理语境中“边界”自然清楚，同时保留他们到达迦南边缘的含义。
