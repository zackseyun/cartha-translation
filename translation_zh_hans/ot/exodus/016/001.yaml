  text: וַ/יִּסְעוּ֙ מֵֽ/אֵילִ֔ם וַ/יָּבֹ֜אוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ אֶל מִדְבַּר סִ֔ין אֲשֶׁ֥ר בֵּין אֵילִ֖ם וּ/בֵ֣ין סִינָ֑י בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לְ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: zh_hans
  text: 他们从以琳起程；以色列人的全体会众[a]来到汛的旷野[b]，就是以琳和西奈之间的旷野；这事发生在他们出埃及地后第二个月的十五日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”；这是以色列民族的常用称谓，在这里指全体百姓，并不只指男性。
    reason: lexical_alternative
  - marker: b
    text: “汛”是地名，指“汛的旷野”，并非普通词义。它与“西奈”是不同的地名。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 他们……起程
  rationale: נסע在旷野行程叙事中指拔营动身；“起程”自然简洁，并保留开始下一段旅程的含义。
- source_word: מֵאֵילִם
  choice: 从以琳
  rationale: אֵילִם是地名，采用现代中文圣经读者熟悉的音译“以琳”。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא是普通的移动动词；“来到”忠实表达抵达该地，又不额外强调进入其边界。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列人全会众
  rationale: עֵדָה在此指聚集成群体的全体民众，译作“全会众”；בְּנֵי יִשְׂרָאֵל直译为“以色列的众子”，但在这里是包括全民的民族称谓，正文用自然的“以色列人”，并以脚注说明原文形式。
- source_word: אֶל מִדְבַּר סִין
  choice: 来到汛旷野
  rationale: מִדְבָּר指荒野、旷野地带，译作传统而清楚的“旷野”；סִין是地名，音译为“汛”，不可与“西奈”混同。
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: 就是以琳和西奈之间的旷野
  rationale: 关系从句说明汛旷野的位置；“就是……”使现代中文衔接自然，同时不增加地理信息。
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: 第二个月十五日
  rationale: 按现代中文日期表达法呈现希伯来文的日期结构。
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: 他们出埃及地后
  rationale: 带ל的动词不定式在这里以出埃及为纪年参照点；“……后”清楚表达时间关系，“埃及地”保留原文אֶרֶץ的形式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。分号保留原文先说“他们起程”、随后以“以色列人全会众”重新明确主语的结构；第二句单列日期，避免中文长句含混。地名采用“以琳、汛、西奈”等通行音译。
