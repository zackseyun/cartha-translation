  source_fidelity: “以色列人”恰当地指称 בְּנֵי יִשְׂרָאֵל；“就这样做了”准确回指上文命令。原译“他们收取时，有的多，有的少”中的“时”容易把数量对比误解为收取时的伴随情形，且“有的多”未明确是收取数量多。修订为“他们收取的有多有少”明确保留希伯来文中收得多与收得少者的分配性对比。
  naturalness: “就这样做了；他们收取的有多有少”是自然、简洁的现代汉语叙事表达。“照样”虽可接受，但较易带出“按同一方式”的意味；“这样”更直接对应此处回指性的 כֵן。
  terminology: “以色列人”符合现代标准汉语，并适合此处指整个群体。“收取”在吗哪语境中可用。脚注采用“收得多的和收得少的”，更清楚地呈现两个名词化分词，并不把原文未明说的对象过度补足。
