  yaml_path: translation/ot/exodus/016/017.yaml
  text: And the sons of Israel did so[a], and they gathered, some more and some less.
translation:
  language: zh_hans
  text: 以色列人就这样做了；他们收取的有多有少。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“收得多的和收得少的。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 就照样做了
  rationale: 这是希伯来语中回指上文吩咐的惯用表达；“照样做了”在现代汉语中自然、明确。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此指以色列民整体；“以色列人”是现代汉语中自然且不造成性别范围误解的对应表达。
- source_word: וַיִּלְקְטוּ
  choice: 他们收取
  rationale: לקט表示捡取、收集食物；结合吗哪的语境，“收取”简洁自然。
- source_word: הַמַּרְבֶּה
  choice: 有的多
  rationale: 名词化分词，字面近于“多收的那一个”；与下一词形成分配式对比，译作“有的多”符合现代汉语表达。
- source_word: הַמַּמְעִיט
  choice: 有的少
  rationale: 名词化分词，字面近于“少收的那一个”；译作“有的少”保留与“有的多”的对照。
