  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: zh_hans
  text: 摩西对亚伦说：“你要对以色列全体会众说：‘你们到耶和华[a]面前来，因为他已经听见你们的怨言了。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”所译的希伯来文是上帝的名字יהוה（YHWH），也常拟音为“雅威”。
    reason: 说明神名的原文形式及主要译名差异。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进事件；现代汉语通常不必另译连接词，也能自然表达先后关系。
- source_word: כָּל־עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列全体会众
  rationale: עֵדָה指作为整体的群体或会众；בְּנֵי יִשְׂרָאֵל字面为“以色列的众子”，在现代汉语中按其群体含义译作“以色列”，避免让人误解为仅指男性。
- source_word: קִרְבוּ לִפְנֵי
  choice: 到……面前来
  rationale: 既表达קרב所指的走近，也保留לִפְנֵי“在……面前／临到……面前”的空间及临在意味。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的专名形式，同时以脚注说明原文为四字神名YHWH及另一常见拟音。
- source_word: שָׁמַע
  choice: 已经听见
  rationale: 完成式在这里表示听见这一行动已经发生，并构成命令众人前来的理由；“已经”自然传达其当前关联。
- source_word: תְּלֻנֹּתֵיכֶם
  choice: 你们的怨言
  rationale: 该词指旷野中带有不满意味的抱怨；“怨言”比中性的“意见”更能体现语义，又比“悖逆”更少加入解释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名而非普通称号。正文采用中文读者熟悉的“耶和华”，脚注同时交代YHWH和较接近现代学界重构读音的“雅威”，不把专名改译为“主”。
- issue: “到耶和华面前来”的含义
  choice: 保留空间与临在兼具的表达
  alternative: 来到耶和华的临在中
  rationale: 上下文可能兼有实际走近和来到上帝面前的神学意味；直译式汉语能够保留二者，不将其限缩为礼仪性或纯属内在的接近。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“全体会众”保留群体性，“到……面前来”避免古奥的“近前”，直接引语层次依原文保留。
