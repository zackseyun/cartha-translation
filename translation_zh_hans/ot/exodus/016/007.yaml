  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: zh_hans
  text: 到了早晨，你们将看见雅威的荣耀，因为他听见了你们向雅威所发的抱怨[a]。我们算什么，你们竟向我们抱怨呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当他听见你们向雅威所发的抱怨时。”这个希伯来语结构既可表示原因，也可表示时间。
    reason: 保留 בְּשָׁמְעוֹ 的另一种合理句法理解。
lexical_decisions:
- source_word: וּ/בֹקֶר
  choice: 到了早晨
  rationale: 该短语在这里作时间状语，并承接上一节的叙事次序；“到了早晨”符合现代汉语表达。
- source_word: וּ/רְאִיתֶם
  choice: 你们将看见
  rationale: 在此预告语境中表达将来的结果；“将看见”自然且保留明确的未来指向。
- source_word: כְּבוֹד יְהוָה
  choice: 雅威的荣耀
  rationale: כָּבוֹד在此指雅威彰显出来的尊荣、光辉与临在；“荣耀”保留其神学内涵。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译神圣四字名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: בְּ/שָׁמְע/וֹ
  choice: 因为他听见了
  rationale: 介词ב与不定式组合可有时间或原因含义；上下文较自然地说明百姓将看见荣耀的原因。完成体“听见了”也适合此处。
- source_word: תְּלֻנֹּתֵיכֶם / תלונו
  choice: 你们的抱怨／你们竟向我们抱怨
  rationale: 名词和动词同源，译文以“抱怨”保持词汇呼应，并表达不满和抗拒的负面意味。
- source_word: עַל יְהוָה / עָלֵינוּ
  choice: 对雅威／向我们
  rationale: 这里表示抱怨所针对的对象；汉语分别用“对”和“向”表达自然，同时保留指向性。
- source_word: וְנַחְנוּ מָה כִּי תלונו עָלֵינוּ
  choice: 我们算什么，你们竟向我们抱怨呢？
  rationale: 这是反问句，强调摩西和亚伦本身并非真正被抱怨的对象。“算什么……竟……”准确传达其修辞力量。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文使用神的专名；“雅威”是较接近学界通常复原读音的现代汉语音译，并避免以称号“主”取代专名。
- issue: בְּשָׁמְעוֹ 的原因或时间含义
  choice: 因为他听见了
  alternative: 当他听见时
  rationale: 上下文可理解为雅威因听见以色列人的抱怨而彰显荣耀，因此正文采用原因义；但希伯来语结构也允许时间义，故以脚注保留。
- issue: 抱怨针对雅威还是摩西、亚伦
  choice: 保持两者之间的张力
  alternative: 明确解释为所有抱怨最终都只针对雅威
  rationale: 原文先说抱怨雅威，后又问为何向“我们”抱怨。译文保留这种修辞与神学张力，不额外加入解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“雅威的荣耀”保留圣经神学用语；反问句“我们算什么……呢？”自然有力。脚注标记置于相关原因从句之后。
