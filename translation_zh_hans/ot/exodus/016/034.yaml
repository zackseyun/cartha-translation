base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: zh_hans
  text: 雅威怎样吩咐摩西，亚伦就怎样把它放在见证[a]前，留作保管。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见证”是会幕语境中的专门用语，可更具体地指圣约法版，或与法版相关之物；本句也可译作“把它放在约的见证前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: 怎样……就怎样
  rationale: 表达亚伦的行动完全照着先前的命令，也使汉语句式自然连贯。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 保留神命令的权威性，同时符合现代汉语圣经叙事的庄重语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为上帝圣约之名的指称。
- source_word: וַיַּנִּיחֵהוּ
  choice: 把它放在
  rationale: 清楚表达亚伦安放前文所述吗哪容器的动作，不增添原文没有明说的容器名称。
- source_word: לִפְנֵי
  choice: 在……前
  rationale: 保留该介词基本的空间和礼仪含义，不擅自具体化为约柜内部或旁边。
- source_word: הָעֵדֻת
  choice: 见证
  rationale: 保留会幕语境中的专门术语及其可能指向约版或与约版相关之物的开放性。
- source_word: לְמִשְׁמָרֶת
  choice: 留作保存
  rationale: 自然表达存留、看守保管的目的，不加入本节未明说的纪念含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译为“雅威”较贴近其通常重构的读音，并保留圣约名称的功能。
- issue: הָעֵדֻת 所指为何
  choice: 见证
  alternative: 约的见证／约版
  rationale: 此词在会幕语境中常特指圣约法版或与其相关的见证，但本节只用该术语本身，因此正文不将所指限定得比原文更具体。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“怎样……就怎样”对应命令与执行之间的关系；“见证”虽是技术性用语，但配以脚注，既避免误译成普通作证，也不把原文过早具体化为“约柜”。
