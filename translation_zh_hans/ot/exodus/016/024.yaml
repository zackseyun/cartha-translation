base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: zh_hans
  text: 他们把它留到早晨，正如摩西所吩咐的；它没有发臭，里面也没有虫子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: 他们就……把它留
  rationale: הניח在本段语境中指把吗哪留下、存放到次日；“把它留到早晨”自然地保留了单数宾语所指的那份吗哪。
- source_word: עַד הַבֹּקֶר
  choice: 到早晨
  rationale: 准确表达时间终点，也符合现代汉语习惯。
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: 照摩西的吩咐
  rationale: 简洁表达他们的行动与摩西先前命令相符；不额外说明命令的最终来源。
- source_word: הִבְאִישׁ
  choice: 发臭
  rationale: 该动词表示变臭、发出恶臭；“发臭”直接而生动，并与前文吗哪腐坏的情形呼应。
- source_word: רִמָּה
  choice: 虫
  rationale: 该名词可泛指腐败物中蠕动的虫或蛆；正文用较宽泛自然的“虫”，避免把词义不必要地限定为“蛆”。
- source_word: לֹא הָיְתָה בּוֹ
  choice: 里面也没有生虫
  rationale: 原文直译为“其中也没有虫”；汉语用“没有生虫”更自然，并清楚传达没有出现这类腐败生物。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“照摩西的吩咐”置于行动之前，符合自然汉语语序；分号保留行动与结果之间的紧密关系。原英文脚注的标记位置与内容明显不一致：标在“morning”后，内容却解释“worms/maggots”。本稿依据希伯来文选用不需脚注即可理解且不过度具体化的“虫”，因此不设置脚注。
