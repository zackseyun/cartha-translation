source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: zh_hans
  text: 摩西说：“耶和华晚上给你们肉吃，早晨给你们饼，使你们吃饱；这是因为耶和华听见你们向他发的怨言[a]。我们算什么呢？你们的怨言不是针对我们，而是针对耶和华。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文用“怨言”及其同根动词“发怨言”相连，直译近似“你们向他发怨言的怨言”，借重复加强责备的语气。
    reason: 说明原文同根名词与动词的强调性重复，以及中文正文采用自然表达的原因。
lexical_decisions:
- source_word: בְּתֵת
  choice: 给……；这是因为
  rationale: בְּ加不定式可表示时间或伴随情形。希伯来语在此句法紧凑，且可能承接上文；中文以陈述供给并用分号连接原因，避免补入原文未明说的“你们就会知道”，同时保持语意自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接译出四字神名，在现代简体中文圣经语域中采用通行且易懂的音译“耶和华”。
- source_word: בָּשָׂר
  choice: 肉
  rationale: 此处指供人食用的肉，“肉”比字面性的“肉体”更符合现代中文饮食语境。
- source_word: לֶחֶם
  choice: 饼
  rationale: 保留具体食物意象；“饼”符合古代近东主食的语境，也与本段吗哪叙事相称。
- source_word: לִשְׂבֹּעַ
  choice: 使你们吃饱
  rationale: 该词表达饱足；此译自然清楚，并保留供给充足的含义。
- source_word: בִּשְׁמֹעַ
  choice: 这是因为……听见了
  rationale: 这里可理解为说明耶和华供给食物的原因；中文明确表达因果关系，同时不把“听见”弱化为泛指的“知道”。
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: 你们向他所发的种种怨言
  rationale: 名词与同根动词并用具有强调作用。中文不生硬重复“发怨言的怨言”，而以“所发的种种怨言”传达反复抱怨和加强语气。
- source_word: וְנַחְנוּ מָה
  choice: 我们算什么呢？
  rationale: 保留原文“什么”所强调的摩西和亚伦并非抱怨的真正对象；“算什么”是自然且庄重的现代中文表达。
- source_word: לֹא עָלֵינוּ תְלֻנֹּתֵיכֶם כִּי עַל יְהוָה
  choice: 你们的怨言不是针对我们，而是针对耶和华
  rationale: 补出中文所需的关系表达“针对”，并清楚呈现“不……而是……”的强烈对比。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号。正文采用现代中文读者最熟悉的专名音译“耶和华”，不以“主”替代神名；“雅威”则是另一种较接近学术重构读音的译法。
- issue: 百姓怨言的真正指向
  choice: 不是针对我们，而是针对耶和华
  alternative: 不是向我们发的，乃是向耶和华发的
  rationale: 原文明确把百姓对摩西、亚伦的抱怨界定为对耶和华的抱怨；译文保留这一神学性责备，不将其淡化为一般不满。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“种种怨言”传达希伯来语同根重复的强调，具体形式在脚注中说明。句中分号和“这是因为”梳理原文紧凑且略带省略的结构，同时避免从上文补入正文没有明说的谓语。
