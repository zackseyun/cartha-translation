source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“看哪，我要从天上给你们降下饼来。百姓要出去，每天收取当天所需的分量[a]，为要试验他们，看他们是否遵行我的训诲[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“每日的事在当日”，指每天收取当天所需的分量。
    reason: 说明希伯来语习语。
  - marker: b
    text: “训诲”也可译作“律法”；原文保留“行在我的训诲中”的行为隐喻。
    reason: 保留 תּוֹרָה 的词义幅度和原文隐喻。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名译法，指明这是以色列之神的盟约名，而非以通称替代。
- source_word: הִנְנִי מַמְטִיר
  choice: 看哪，我要……降下……来
  rationale: הִנְנִי引出郑重而临近的宣告；分词מַמְטִיר在此具有即将发生之意。中文用“我要……降下……来”既自然，也保留行动迫近的语气。
- source_word: לֶחֶם מִן הַשָּׁמָיִם
  choice: 从天上……降下食物
  rationale: לֶחֶם可指面饼，也可较广地指食物；本段所降之物尚未被百姓识别，译作“食物”在现代中文中较自然，同时不把它误解为已经烤成的面包。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 每天收取当天所需的分量
  rationale: 这是分配性习语，字面近于“每日的事在当日”，语境指每天只收取当日所需的量。
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: 这样，我就可以试验他们
  rationale: 后缀为阳性单数，与集合名词“百姓”呼应；中文按集合所指自然译为“他们”。“试验”保留检验其行为反应之意。
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: 看他们是否遵行我的训诲
  rationale: “行在……中”是行为隐喻，中文以“遵行”表达其实际含义；תּוֹרָה在西奈立约前的此处首先指上帝所给的指示，译作“训诲”避免过早限定为成文律法。
- source_word: אִם לֹא
  choice: 是否
  rationale: 与前面的疑问结构共同构成“是否……”，符合现代汉语表达。
theological_decisions:
- issue: 西奈山颁布律法以前 תּוֹרָה 的译法
  choice: 我的训诲
  alternative: 我的律法
  rationale: תּוֹרָה的基本义为教导、训诲或指示；本节直接语境是关于每日收取食物的命令。“训诲”保留词义范围，也不否认该词后来所具有的律法与盟约分量。
- issue: “从天上来的 לֶחֶם”应译为食物还是饼
  choice: 食物
  alternative: 饼；粮食
  rationale: לֶחֶם既可具体指饼，也可泛指食物。这里所指是吗哪，尚不是通常意义上烤成的饼；“食物”较符合现代中文，但原文的具体措辞在脚注中保留。
- issue: “行在我的妥拉中”的隐喻
  choice: 遵行我的训诲
  alternative: 行在我的律法中
  rationale: 直译在中文中生硬且可能不明；“遵行”准确传达生活行为是否符合上帝指示，同时不额外加入只关乎内在信念或完全顺服的含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“看哪”保留神谕宣告的郑重语气；其余句式避免生硬直译。所有脚注标记均置于所说明的正文之后。
