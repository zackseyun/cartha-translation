  timestamp: '2026-07-14T04:26:21Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确传达了耶和华的命令、保存吗哪、留给后代观看以及出埃及和旷野供养的背景。惟“一满俄梅珥的吗哪”在现代汉语中缺少与原文“从其中取／装满一俄梅珥”的动作关系；末句的לֶחֶם宜保留为“饼”，以反映原文刻意使用的称谓。
  naturalness: 原文整体庄重通顺；改为“从吗哪中取一满俄梅珥”更符合现代汉语搭配，也更清楚地表达计量单位与吗哪的关系。“留给你们的世世代代”比“世世代代留存”更直接对应原文的受益／延续范围。
  terminology: “耶和华”“吗哪”“俄梅珥”“旷野”均合适。“饼”是此处הַלֶּחֶם的直接对应；虽所指为吗哪，却不应以较宽泛的“食物”抹平原文用词。
  issues:
  - severity: medium
    issue: “一满俄梅珥的吗哪”未明确呈现“从其中取一满俄梅珥”的命令关系。
    rationale: מְלֹא הָעֹמֶר מִמֶּנּוּ指从吗哪中取／装满足一俄梅珥的量；中文补出“从吗哪中取”是必要且不增添意义的语法调整。
  - severity: low
    issue: “食物”弱化了הַלֶּחֶם的词汇选择。
    rationale: 该词在此确实指吗哪，却字面为“饼”；译为“饼”既自然，也保留与吗哪传统相关的原文措辞。
  revised_text: 摩西说：“耶和华这样吩咐：从吗哪中取一满俄梅珥[a]，保存起来，留给你们的世世代代，好让后代看见我领你们出埃及地时，在旷野给你们吃的饼。”
  revised_footnotes:
  - marker: a
    text: “俄梅珥”是古代容量单位；原文此处意为“满一俄梅珥的量”。
    reason: cultural_note
  revision_rationale: 修订仅补足汉语所需的“从吗哪中取”以清楚表达原文计量结构，并将“食物”改为“饼”以保留הַלֶּחֶם的直接词义；其余句意、神名和代际目的均予保留。
