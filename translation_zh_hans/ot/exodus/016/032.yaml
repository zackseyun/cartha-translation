  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: zh_hans
  text: 摩西说：“耶和华这样吩咐：从吗哪中取一满俄梅珥[a]，保存起来，留给你们的世世代代，好让后代看见我领你们出埃及地时，在旷野给你们吃的饼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “俄梅珥”是古代容量单位；原文此处意为“满一俄梅珥的量”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: 摩西说
  rationale: 希伯来语叙事中的常规承接式表达；现代汉语无需机械加入“于是”或“并且”。
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה
  choice: 耶和华这样吩咐
  rationale: 将“这是耶和华所吩咐的事”自然压缩为现代汉语直接引令格式，同时保留命令的权威来源；יְהוָה译作“耶和华”。
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: 一满俄梅珥的吗哪
  rationale: מְלֹא表示装满的量，עֹמֶר是古代容量单位；מִמֶּנּוּ按上下文指吗哪，明译可避免汉语代词指向不清。
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: 保存起来，世世代代留存
  rationale: 表达作为留存之物、供后代存看的含义，并保留跨越历代的持续性。
- source_word: לְמַעַן יִרְאוּ
  choice: 好让后人看见
  rationale: 明确隐含主语是前述各代子孙，使现代汉语清楚自然。
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: 我……给你们吃的食物
  rationale: לֶחֶם在此可泛指供食用之物；译作“食物”避免现代读者误以为普通烤制面包，同时不提前用“吗哪”替代本句原有称谓。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: “旷野”是出埃及叙事中מִדְבָּר的自然且传统的中文对应词。
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: 我领你们出埃及地时
  rationale: ב加不定式结构表示时间背景；“领……出”准确传达使其离开的使役意义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用普通中文读者最熟悉、且明确作为专名的“耶和华”；不以“主”替代，以保留原文中的盟约神名。
- issue: הַלֶּחֶם在吗哪语境中的译法
  choice: 食物
  alternative: 饼
  rationale: 原词既可指饼，也可泛指食物；此处所指为旷野中的吗哪。译作“食物”保留语义范围并避免把吗哪具体化为普通饼类。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吗哪”在本节上文已有明确先行词，因此在“其中取一满俄梅珥”的位置明译，以免中文指代含混；“后人”解释了原文承接“你们的世世代代”的隐含主语。
