revisions:
- from: 摩西说：“耶和华这样吩咐：要把一满俄梅珥的吗哪[a]保存起来，世世代代留存，好让后人看见我领你们出埃及地时，在旷野给你们吃的食物。”
  to: 摩西说：“耶和华这样吩咐：从吗哪中取一满俄梅珥[a]，保存起来，留给你们的世世代代，好让后代看见我领你们出埃及地时，在旷野给你们吃的饼。”
  rationale: 修订仅补足汉语所需的“从吗哪中取”以清楚表达原文计量结构，并将“食物”改为“饼”以保留הַלֶּחֶם的直接词义；其余句意、神名和代际目的均予保留。
