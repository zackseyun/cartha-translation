    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未单独译出叙事连接词 וַ；现代汉语连续叙事中省略“于是/又”更自然，仍保留事件推进关系。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֲלֵהֶם
  choice: 对他们
  rationale: 直接对应介词 אֶל 与第三人称阳性复数后缀，不将所指解释性扩展为“百姓”。
- source_word: אִישׁ אַל
  choice: 谁也不可
  rationale: אִישׁ 在否定禁令中具有逐一、普遍的分配意义；“谁也不可”是自然的现代汉语表达，并明确禁令适用于每个人。
- source_word: יוֹתֵר
  choice: 留
  rationale: יתר 在此表示使一部分存留下来；结合宾语表达为“把……留到”，简洁且符合汉语习惯。
- source_word: מִמֶּנּוּ
  choice: 其中任何一点
  rationale: מן 加第三人称阳性单数后缀回指吗哪；“其中任何一点”在否定句中清楚表达不可留下任何数量。
- source_word: עַד בֹּקֶר
  choice: 到早晨
  rationale: 直接表达 עַד 的时间终点和 בֹּקֶר 的“早晨”之义。
