source:
  edition: WLC
  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: zh_hans
  text: 你们看，雅威已经把安息日赐给你们；因此，第六天他给你们够吃两天的饼。各人[a]要留在自己的地方；第七天，任何人都不可离开自己的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语这两处都使用阳性单数的“人／男人”一词：前者指“各人”，后者指“任何人”。这里是分配性、代表性用法，指群体中的每一个人。
    reason: 说明原文阳性形式在两项命令中的分配性、代表性功能，不将命令限于男性。
lexical_decisions:
- source_word: רְאוּ
  choice: 你们看
  rationale: 这是ראה的复数命令式，既可指观看，也可引出对随后事实的认识。“你们看”保留直接的命令语气，并让下文说明应当看明的事。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见中文音译，以保留经文中的专名，而不以称号代替。
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: 把安息日赐给了你们
  rationale: 完成式表达已经施予的恩赐；“赐给”自然地体现安息日是为以色列所得的礼物。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 该短语明确表示前因后果，“因此”简洁地保留这一逻辑关系。
- source_word: נֹתֵן
  choice: 给
  rationale: 分词在此说明雅威在第六日持续采用的供应方式；中文一般现在时无需另加时态标记。
- source_word: לֶחֶם יוֹמָיִם
  choice: 供两天吃的饼
  rationale: 原文直译为“两天的饼”。此译保留具体的“饼”，同时用自然中文表达其为期两天的分量。
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: 各人要留在原处
  rationale: ישב在这里指停留，תחתיו为“在原处、所在之处”的惯用表达；此译避免误解为字面的“坐下”。
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: 任何人都不可离开自己的地方
  rationale: 否定祈使语气构成禁令；译文保留“离开”和“自己的地方”，并以自然现代汉语表达普遍禁止。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 第七天
  rationale: 按原文保留日序，不额外加入“每周”等解释。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名。采用较贴近学界重构读音Yahweh的“雅威”，而不以“主”等称号替代。
- issue: אִישׁ的阳性形式及其分配性用法
  choice: 各人／任何人
  alternative: 各个男人／没有一个男人
  rationale: אִישׁ在两项命令中以阳性单数作分配性用语，所指是群体中的每一个人。现代汉语“各人／任何人”准确传达适用范围；脚注保留其希伯来语形式信息，避免把命令误限于男性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“供两天吃的饼”比生硬的“两天的饼”更自然；两个关于地点的表达分别译为“原处”和“自己的地方”，既反映原文用词差异，也保持命令清晰。
