base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: zh_hans
  text: 第六天，他们预备所带回来的东西时，所带回来的东西的数量会是他们每天收集的两倍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“所带回来的东西的数量将比他们每天收集的多一倍。”
    reason: 保留 מִשְׁנֶה 与 עַל 所构成数量比较的另一种自然表达；两种译法都表示总量为平日的两倍。
lexical_decisions:
- source_word: וְהָיָה
  choice: 到……将是
  rationale: 带前缀 waw 的完成式在这段指示中引出将来的情形及结果；用“到……将是”符合现代汉语表达。
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: 到第六天
  rationale: 忠实表达时间短语，不增添原文没有明说的“每周”。
- source_word: וְהֵכִינוּ
  choice: 他们要……预备好
  rationale: 在指示语境中表达第六天应做的行动；“预备好”也保留动词所含的准备妥当之意。
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: 把带回来的
  rationale: 关系从句指他们收取后带回的东西；中文省去重复宾语，仍能由上下文清楚理解。
- source_word: וְהָיָה מִשְׁנֶה
  choice: 所得的将是……两倍
  rationale: מִשְׁנֶה 表示双倍的数量；“所得的”使中文主语明确，又不把它过度解释为固定的“份额”。
- source_word: עַל אֲשֶׁר
  choice: ……的两倍
  rationale: עַל 在此表达比较或计量关系；现代汉语用“……的两倍”自然而准确。
- source_word: יִלְקְטוּ
  choice: 收取
  rationale: לקט 指把吗哪拾取、收集起来；“收取”在本句中简洁自然。
- source_word: יוֹם יוֹם
  choice: 每天
  rationale: 重叠形式具有逐日、日复一日的分配义；“每天”是自然清楚的现代汉语表达。
