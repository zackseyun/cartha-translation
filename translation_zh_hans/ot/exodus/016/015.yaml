base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: zh_hans
  text: 以色列人一看见，就彼此[a]说：“这是什么？”[b]因为他们不知道那是什么。摩西对他们说：“这就是耶和华赐给你们吃的饼。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “彼此”直译为“各人对自己的弟兄”，是表示相互交谈的希伯来语惯用表达。
    reason: lexical_alternative
  - marker: b
    text: “这是什么？”所对应的希伯来语表达，传统上与“吗哪”这个名称相联系。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该族群称谓最自然、准确的表达；希伯来语字面为“以色列的众子”，但在此指全体以色列民。
- source_word: אִישׁ אֶל־אָחִיו
  choice: 彼此
  rationale: 该短语字面为“各人对自己的弟兄”，在叙事中是表示相互交谈的惯用语；“彼此”简洁自然。
- source_word: מָן הוּא
  choice: 这是什么？
  rationale: מָן在此按上下文作疑问表达，下一分句“因为他们不知道那是什么”也支持这一理解；同时保留它与后文名称“吗哪”的文字关联于脚注。
- source_word: הוּא הַלֶּחֶם
  choice: 这就是……食物
  rationale: הוּא用于指认眼前之物；לֶחֶם可指面包，也可泛指食物。此物尚未被做成饼，译作“食物”更符合语境，同时脚注保留字面义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语境中广为人知的神圣名译写，明确呈现专名而不以“主”这一称号替代。
- source_word: לְאָכְלָה
  choice: 给你们吃的
  rationale: 该形式表达赐下之物的用途；此译符合现代汉语习惯，并保留目的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，应以专名呈现而非替换为“主”。“耶和华”在现代中文读者中辨识度最高；“雅威”则较接近学界常用的拟音。
- issue: 是否在正文中把 מָן 当作专名“吗哪”
  choice: 按疑问句译为“这是什么？”
  alternative: 直接译作“吗哪”
  rationale: 紧接着的解释“因为他们不知道那是什么”表明，这里首先是众人的疑问。若提前使用专名，会掩盖叙事中的命名文字关联。
- issue: הַלֶּחֶם 译作“食物”还是“饼”
  choice: 食物
  alternative: 饼
  rationale: לֶחֶם既可特指饼，也可泛指食物。此处指神赐下供人食用的物质，尚未描述其加工形态；正文采用语境义“食物”，脚注注明字面义，以保留其与“粮/饼”主题的联系。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“以色列人”和“彼此”避免不必要的希伯来语式直译；正文保留简洁的叙事节奏。所有脚注标记均置于相关正文之后。
