base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: zh_hans
  text: 摩西对亚伦说：“你拿一个罐子，把足足一俄梅珥的吗哪装在里面；再把这罐子安放在雅威面前，存留给你们的世世代代。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: 罐子
  rationale: 该词指盛物的器皿；“罐子”符合本段用来装吗哪的语境，也不暗示这是炊具。
- source_word: מְלֹא הָעֹמֶר
  choice: 满满一俄梅珥
  rationale: 既保留俄梅珥这一干量单位，也表达 מְלֹא 所强调的足量、装满之意。
- source_word: מָן
  choice: 吗哪
  rationale: 采用现代中文圣经传统中通行且易懂的音译。
- source_word: וְתֶן שָׁמָּה
  choice: 装在里面
  rationale: שָׁמָּה 字面为“在那里”，上下文所指是刚提到的罐子；中文用“装在里面”自然地明确这一照应。
- source_word: וְהַנַּח אֹתוֹ
  choice: 放
  rationale: 该动词表示放置、安放；“放”简洁自然，适合此处指示性的语境。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前/临在中”的空间与礼仪表达，并将神名直接音译。
- source_word: לְמִשְׁמֶרֶת
  choice: 保存下来
  rationale: 该名词表达保管、留存的目的；此译法在中文中自然体现为后代保存这份吗哪。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代留存
  rationale: 表达跨越以色列后续各代持续保存的意思，同时保持庄重、通顺。
- source_word: קַח ... אַחַת
  choice: 拿一个罐子来
  rationale: 保留命令语气及数词“一”，自然表达取来单个器皿。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近现代学界对该名的音译重构，并保留其作为专名的性质，而不以“主”这一称号替代。
translation_notes:
  register: 采用现代、庄重而平易的普通话。“俄梅珥”保留古代计量单位，避免换算成并不精确的现代容量；整体语序按自然中文调整，同时保持命令、放置于神面前以及代代保存的原文结构。
