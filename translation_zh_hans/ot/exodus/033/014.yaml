  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: zh_hans
  text: 他说：“我必亲自与你同去[a]，使你得安息。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译是“我的面必去”；这是说耶和华必亲自临在、同行。原文没有明说“与你”。
    reason: 保留希伯来语“面”的意象，并说明正文为符合现代汉语和上下文而补出的同行对象。
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 他又说
  rationale: וַיֹּאמַר是希伯来叙事中承接上文的常用形式。结合本段连续对话，译作“他又说”自然地表明说话者继续回应，而不赋予过强的时间含义。
- source_word: פָּנַי
  choice: 我必亲自
  rationale: 字面为“我的面”，在此以“面”表达耶和华本人的临在与同行。现代汉语用“我必亲自”既自然，又保留这不是某种抽象助力、而是耶和华本人同行的含义；字面意象收入脚注。
- source_word: יֵלֵכוּ
  choice: 与你同去
  rationale: הלך意为“去、行走”。原文没有明说同行对象，但上下文说明这是对摩西所求同行保证的回答；“与你同去”使汉语表达完整。介词性的“与你”属于语境补足，并在脚注提示原文字面较简。
- source_word: וַהֲנִחֹתִי
  choice: 使你得安息
  rationale: 这是נוח的使役形，基本义为“使……安歇、使……得安息”。译文保留使役关系，也避免把“安息”过早限定为某一种具体实现。
- source_word: לָךְ
  choice: 你
  rationale: לָךְ为阳性第二人称单数，直接指摩西。译作“你”保留单数指向；其结果是否也惠及百姓，则由上下文表达，不在本节中擅自改成复数。
theological_decisions:
- issue: פָּנַי的拟人表达
  choice: 正文译作“我必亲自”，脚注保留“我的面”
  alternative: “我的临在必去”或“我的面必去”
  rationale: “我的面”在希伯来语中表达耶和华亲自临在。“我必亲自”在现代汉语中更自然，也突出是耶和华本人同行；脚注保留原文意象，以便读者观察本章“面”与“临在”的主题张力。
- issue: לָךְ的单数对象及安息的范围
  choice: 译作“使你得安息”
  alternative: “使你们得安息”或“使百姓得安息”
  rationale: 原文明确使用第二人称单数，直接对摩西说话。虽然上下文涉及以色列全体，正文仍应保留语法上的单数，不把群体含义直接写入本节。
- issue: “安息”的具体所指
  choice: 保留为“安息”
  alternative: “平安抵达”或“在应许之地安居”
  rationale: וַהֲנִחֹתִי可包含旅途平安、摆脱仇敌以及安居等背景含义，但本句并未把所指限定得如此具体，因此保留较宽的“安息”。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“亲自与你同去”适合直接引语，清楚表达神本人的同行；“使你得安息”保留圣经语汇及原文使役意义。
