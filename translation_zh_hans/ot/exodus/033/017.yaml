  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה גַּ֣ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֛ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֶֽעֱשֶׂ֑ה כִּֽי מָצָ֤אתָ חֵן֙ בְּ/עֵינַ֔/י וָ/אֵדָעֲ/ךָ֖ בְּ/שֵֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：“你所说的这件事[b]，我也必成就；因为你在我眼中蒙了恩[c]，我认识你，也知道你的名字[d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神圣名号יהוה（YHWH）的音译。
    reason: 名称说明
  - marker: b
    text: “这件事”也可译作“这事”“这项请求”或“这话”。
    reason: 词义选择
  - marker: c
    text: 希伯来文直译为“在我眼中找到了恩惠”，意思是受到有利看待或恩待。
    reason: 希伯来语习语
  - marker: d
    text: 希伯来文直译为“我按名认识你”。这表示对其人的特指性认识，并非仅指知道姓名。
    reason: 希伯来语表达
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是神圣四字名号的现代汉语音译，直接保留经文中的专名，而不以“主”这一称号替代。
- source_word: גַּם
  choice: 也
  rationale: 在上下文中表示雅威应允摩西在先前请求之外所提出的这一项请求；“也”自然地传达其附加语气。
- source_word: הַדָּבָר הַזֶּה
  choice: 这件事
  rationale: דָּבָר可指话、事情或事项；此处指摩西刚刚提出的请求，“这件事”既自然，也保留了原词较宽泛的含义。
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: 你所说的
  rationale: 保留“说”这一动词，并以现代汉语定语结构自然连接所请求的事。
- source_word: אֶעֱשֶׂה
  choice: 我会照办
  rationale: 原义为“我会做”；结合摩西所说的请求，“照办”更清楚地表达雅威应允并将实行此事，同时不改变承诺的内容。
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: 你在我眼中蒙了恩
  rationale: 较直接地保留希伯来语“在我眼中找到恩惠”的意象；“蒙了恩”在现代汉语中清楚表达受到有利看待和恩待。
- source_word: וָאֵדָעֲךָ בְּשֵׁם
  choice: 并且我按名认识你
  rationale: 保留“认识”所含的个人性与关系性，也保留“按名”这一具体表达，不将其弱化为泛泛的知道或承认。
theological_decisions:
- issue: 神圣名号יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神圣四字名号。译作“雅威”旨在以现代汉语音译保留专名；不用“主”替代，也不采用源于另一种传统读音的“耶和华”。
- issue: “按名认识”所表达的关系
  choice: 保留“我按名认识你”
  alternative: 我知道你的名字；我认可你
  rationale: ידע在这里不只是掌握名字这一信息，也可表达对摩西个人的认识。“按名认识”保留这种个人性的关系含义，同时不进一步解释其神学范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。引语以“照办”表达对摩西请求的应允；“在我眼中蒙了恩”和“按名认识你”则适度保留原文意象及个人关系色彩。
