  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: zh_hans
  text: 因此，如今若我在你眼中蒙恩，求你使我知道你的道路，使我认识你，好让我在你眼中蒙恩。求你顾念：这个民族是你的子民。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这个民族是你的子民”：原文分别用了可译为“国、民族”的词和可译为“人民、子民”的词，保留了两种称谓。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出摩西当前的请求；现代汉语用“现在”即可自然表达这一转折推进。
- source_word: נָא
  choice: 求你／请
  rationale: 这是表达恳求的语气词；正文以“求你”和末句“也请”传达礼貌而迫切的请求。
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 我在你眼中蒙恩
  rationale: 保留希伯来语“在你眼中”的意象和两次出现的修辞重复；“蒙恩”在中文中庄重自然，也不必将此处扩展为特定教义术语。
- source_word: הוֹדִעֵנִי נָא אֶת דְּרָכֶךָ
  choice: 求你使我知道你的道路
  rationale: הוֹדִיעַ是使役形，直指“使……知道”；דְּרָכֶךָ在此为复数意义，故用可作集合表达的“道路”，指上帝行事的方式。
- source_word: וְאֵדָעֲךָ
  choice: 使我认识你
  rationale: 把连接句按请求所指向的目的或结果自然表达；“认识你”保留关系性的认识，不缩减为获得信息。
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: 好让我在你眼中蒙恩
  rationale: לְמַעַן表示目的；重复前面的“在你眼中蒙恩”，保留摩西恳求中的修辞回环。
- source_word: וּרְאֵה
  choice: 也请顾念
  rationale: ראה的命令式在此并非单指视觉，而是请上帝留意并顾及这一事实；“顾念”比生硬的“看”更符合现代中文语境。
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: 这一国是你的子民
  rationale: 分别保留גּוֹי的国家／民族概念和עַם的人民、子民概念，避免将两个词扁平化为同一中文词。
theological_decisions:
- issue: 末句中的群体与立约意味
  choice: 这一国是你的子民
  alternative: 这民族是你的百姓
  rationale: 原文同时使用גּוֹי与עַם。译文以“国”和“子民”保留两层称谓，使摩西诉诸上帝与以色列之关系的语气可见，却不额外加入原文未明说的神学断言。
- issue: “认识你”的关系性含义
  choice: 认识你
  alternative: 知道你
  rationale: ידע在此与上帝使摩西知道其道路相连，既包含理解，也包含关系性的认识；“认识”较能保留这种张力，而不把它限定为纯知识。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“在你眼中蒙恩”的希伯来语意象及其重复；“道路”按原文复数的集合意义处理。末句用“顾念”表达命令式“看”在语境中的留意、顾及之意。
