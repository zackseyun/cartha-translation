base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: zh_hans
  text: 百姓听见这坏消息[a]，就悲哀起来；谁也没有佩戴自己的饰物[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“这不好的话”“这令人痛苦的话”。希伯来文直译为“这不好的话（或事）”。
    reason: lexical_alternative
  - marker: b
    text: “饰物”也可译作“首饰”或“装饰品”，原文泛指佩戴在身上的装饰之物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: 百姓听见
  rationale: הָעָם 是集合名词，指以色列百姓；שׁמע 在此指听见先前所宣告的内容。
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: 这坏消息
  rationale: דָּבָר 可指“话、事情、信息”；这里回指上文使人悲痛的宣告，用“坏消息”符合现代汉语，同时脚注保留较直译的可能。
- source_word: וַיִּתְאַבָּלוּ
  choice: 就悲哀起来
  rationale: אבל 的 Hitpael 形式表示进入哀悼、悲痛的状态；“悲哀起来”既自然，也体现动作状态的开始。
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: 谁也没有佩戴
  rationale: אִישׁ 在否定结构中具有逐一分配的意思，即没有一个人如此行；中文用“谁也没有”自然传达这一点。
- source_word: עֶדְיוֹ עָלָיו
  choice: 佩戴自己的饰物
  rationale: עֲדִי 泛指装饰品或饰物，עָלָיו 表示放在自己身上；“佩戴自己的饰物”符合现代汉语习惯，并保留所指物品的宽泛性。
