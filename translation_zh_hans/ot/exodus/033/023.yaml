base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: zh_hans
  text: 然后，我要挪开我的手，你就会看见我的背[a]；但我的面将不会被看见。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的后部”或“我身后之处”。希伯来语这个词可以指背部，也可以指后方或后面的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: 然后，我要挪开
  rationale: 使役词形表达“移开、撤去”；句首的连接词承接上一节的动作次序，用“然后”自然保留连续和将来的意味。
- source_word: כַּפִּי
  choice: 我的手
  rationale: כַּף 可指“手掌”或“手”；结合上一节遮护摩西的意象，“手”在现代汉语中最自然，也保留原文的拟人表达。
- source_word: וְרָאִיתָ
  choice: 你就会看见
  rationale: 在将来语境的连续叙事中表示随后发生的结果；“就会”清楚呈现动作次序和结果。
- source_word: אֲחֹרַי
  choice: 我的背
  rationale: 该词可指背部、后部或在后之处；“我的背”最直接保留具体意象，同时以脚注说明原词的语义范围。
- source_word: וּפָנַי
  choice: 但我的面
  rationale: 连接词在此形成对比：摩西可以看见“背”，却不能看见“面”；“但”使这一对照在汉语中明确。“面”比“脸”更庄重，并保留经文语体。
- source_word: לֹא יֵרָאוּ
  choice: 不可被看见
  rationale: ראה 的被动词形意为“被看见”，不改译为主动的“不能看”；“不可”兼具禁限与庄重语气，且没有把被动意义消解掉。
theological_decisions:
- issue: 关于上帝的拟人化语言
  choice: 在正文中保留“手”“背”“面”等具体身体用语。
  alternative: 改用“同在”“余辉”等抽象表达，以避免身体性的含义。
  rationale: 希伯来文有意使用具体的拟人意象。译文应保留神自我显现中的张力，而不在翻译中加入形而上解释或淡化原文。
- issue: “我的面不可被看见”的语态与含义
  choice: 保留被动表达“不可被看见”。
  alternative: 译作“你不能看见我的面”。
  rationale: 原文使用被动词形，并未在本句中明说观看者；保留被动可避免把范围缩限为摩西个人，也忠实呈现原句的庄严宣告。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“挪开”自然表达遮护之手被移去；“面”与“背”构成简洁鲜明的对照。正文中的脚注标记[a]与脚注完全对应。
