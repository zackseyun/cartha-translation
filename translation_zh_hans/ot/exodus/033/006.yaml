  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: zh_hans
  text: 于是，以色列人摘下了身上的装饰品；从何烈山起，他们不再佩戴。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: 摘下了身上的
  rationale: 该反身词形在这里表示从自己身上除去某物；“摘下了身上的”以自然的现代汉语表达这一反身含义，并与装饰品搭配得当。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，在此是对以色列群体的惯用称呼；译作“以色列人”准确、自然，也避免现代汉语把“众子”误解为仅指男性后裔。
- source_word: עֶדְיָם
  choice: 身上的装饰品
  rationale: עֲדִי泛指佩戴以装饰自己的物品；“装饰品”比“珠宝”涵盖面更广，不擅自限定材质。“身上的”同时帮助表达动词的反身意义。
- source_word: מֵהַר חוֹרֵב
  choice: 从何烈山起
  rationale: מִן可将何烈山标为此后不再佩戴装饰品的起点；“从何烈山起”保留这一较可能的时地起点含义。其也可表示动作发生的地点，因此另列脚注。
theological_decisions:
- issue: מֵהַר חוֹרֵב所表达的是起点还是地点
  choice: 正文译作“从何烈山起”，表示以何烈山为不再佩戴装饰品的起点
  alternative: “在何烈山”，表示他们在那里摘下装饰品
  rationale: 介词מִן在此存在真实的句法歧义。上下文支持起点理解，但地点理解也有可能，故正文择一而以脚注保留另一读法，不把歧义静默消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接上文；“以色列人”符合现代汉语群体称谓习惯；避免生硬照译“以色列的众子”。脚注明确保留原文介词短语的双重可能。
