base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: zh_hans
  text: 这样，凭什么能知道我和你的百姓在你眼前蒙恩呢？不正是因为你与我们同行，使我和你的百姓有别于[a]地上的万民吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被分别出来”或“显得与众不同”。希伯来语动词可表示被显明为特殊，或从其他群体中分别出来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה ... אֵפוֹא
  choice: 不然，凭什么
  rationale: וּ承接上文，בַמֶּה询问凭借何种方式，אֵפוֹא带有推论语气；“不然，凭什么”自然呈现摩西基于前文所作的反问。
- source_word: יִוָּדַע
  choice: 能知道
  rationale: 保留ידע的尼法勒未完成式所表达的被动意义，即某事如何能被人认知、辨明。
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 我蒙你恩宠
  rationale: “在你眼中找到恩惠”是希伯来语惯用表达；“蒙你恩宠”在现代汉语中自然、庄重，并保留关系性的有利看顾。
- source_word: אֲנִי וְעַמֶּךָ
  choice: 我……也……你的百姓
  rationale: 原文以第一人称单数“我蒙恩宠”开头，随后明确并列“我和你的百姓”。译文分述二者，既保留摩西的第一人称重点，也清楚纳入百姓。
- source_word: הֲלוֹא
  choice: 不正是……吗
  rationale: 保留原文期待肯定回答的反问语气。
- source_word: בְּלֶכְתְּךָ עִמָּנוּ
  choice: 因你与我们同行
  rationale: 介词בְּ加不定词可表示凭借或情境；“因……同行”清楚表明上帝同在是其恩宠得以辨明的依据。
- source_word: וְנִפְלֵינוּ
  choice: 才有别于
  rationale: פלא的尼法勒形在此表示被显明为特殊、与其他群体有别；“有别于”简洁保留分别和独特的含义，不额外界定其性质。
- source_word: מִכָּל הָעָם
  choice: 地面上的万民
  rationale: 单数集合名词עָם在此具有遍指意义；“万民”是自然的汉语圣经语体，表达世上所有其他族群。
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: 地面上的
  rationale: 较贴近אֲדָמָה“土地、地面”的措辞，同时在“万民”的搭配中自然表达普世范围。
theological_decisions:
- issue: 以色列独特身份的根据
  choice: 译文将上帝与百姓同行呈现为他们有别于万民的标志和依据。
  alternative: 将这种区别主要归因于律法、土地或族群身份。
  rationale: 本节明确把百姓的独特性联系于上帝亲自与他们同行；译文不加入经文在此未说明的其他根据。
- issue: 摩西个人蒙恩与百姓蒙恩的关系
  choice: 既保留“我蒙你恩宠”的第一人称重点，也明确将百姓包括在摩西的请求中。
  alternative: 完全合并为“我们蒙你恩宠”，从而消除原文由单数转向“我和你的百姓”的张力。
  rationale: 原文的动词מָצָאתִי为第一人称单数，随后却并列“我和你的百姓”；分述二者能较自然地保存这一结构所传达的代求关系。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不正是……吗”保留反问力度；“恩宠”“同行”“万民”维持适度经文语体。脚注标在“有别于”之后，因为其内容解释的是וְנִפְלֵינוּ，而非前面的“蒙你恩宠”。
