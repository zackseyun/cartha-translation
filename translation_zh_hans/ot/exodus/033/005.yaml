  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你要告诉以色列人[a]：‘你们是硬着颈项的百姓。我若片刻之间上到你们中间，就会把你们灭尽[b]。现在，你们要摘下身上的饰物[c]，我好知道我将怎样对待你们[d]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，即以色列人。
    reason: lexical_alternative
  - marker: b
    text: 本句也可译作：“我若在你们中间上去片刻，就会把你们灭尽。”
    reason: alternative_reading
  - marker: c
    text: “饰物”也可译作“首饰”或“装饰品”。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“我好知道我将怎样对待你们”。这里保留“知道”这一拟人性的表达，没有意译为“决定”。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，不以“主”这一称号替代原文专名。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，这里指以色列全体；“以色列人”在现代汉语中自然、准确，并避免被误解为只包括男性。
- source_word: עַם קְשֵׁה עֹרֶף
  choice: 硬着颈项的百姓
  rationale: 保留希伯来语以颈项僵硬表达顽梗悖逆的身体隐喻，同时使用中文圣经语体中清楚而庄重的说法。
- source_word: רֶגַע אֶחָד אֶעֱלֶה בְקִרְבְּךָ
  choice: 我若在你们中间上去，哪怕只是一刻
  rationale: 保留“上去”和“在……中间”的同在语言，并把 רֶגַע אֶחָד 自然地理解为同在时间极短也足以引发审判；条件关系由上下文体现。
- source_word: וְכִלִּיתִיךָ
  choice: 也会把你们灭尽
  rationale: כלה 在此指彻底结束、毁灭；“灭尽”保留审判的彻底性，又不额外指定毁灭方式。
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: 摘下身上的饰物
  rationale: עֲדִי 泛指装饰品；“摘下身上的饰物”准确表达移除所佩戴装饰物的动作，比机械复制介词结构更符合现代汉语。
- source_word: וְאֵדְעָה
  choice: 我好知道
  rationale: 保留原文“知道”的拟人性表达；前接命令时，“我好知道”自然传达目的或预期结果，而不改写成抽象的“决定”。
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: 该怎样处置你们
  rationale: “处置”保留对以色列采取何种行动的开放性及语境中的严肃意味，不把 לְ 单方面限定为纯粹有利或惩罚性的行动。
theological_decisions:
- issue: 上帝“知道”自己将怎样对待以色列的拟人性语言
  choice: 在正文保留“我好知道”
  alternative: “让我决定该怎样处置你们”或“我再决定怎样处置你们”
  rationale: 原文明确使用 ידע“知道”。保留这一说法，既忠于文本的关系性和拟人性语言，也不借翻译消解它与上帝全知之间的神学张力。
- issue: 对作为整体之以色列使用的单数后缀
  choice: 按现代汉语集体称呼译为复数“你们”
  alternative: 使用单数“你”指代整个以色列
  rationale: 希伯来文从复数称呼转为把以色列视作一个整体的单数形式；现代汉语用“你们”能清楚指向全体以色列人，而整体性可由“百姓”和上下文体现。
- issue: רֶגַע אֶחָד 与后续动词的句法关系
  choice: 译为“我若在你们中间上去，哪怕只是一刻”
  alternative: “一瞬间，我若在你们中间上去”
  rationale: 无元音以外的词序允许强调极短时间；本译法把“一刻”与“上去”结合，表达即使神只在他们中间极短暂地同行，也会因他们的顽梗而灭尽他们，同时不把希伯来语压缩成单一时间副词解释。
translation_notes:
  register: 采用庄重、自然的现代标准汉语。“硬着颈项”保留原文鲜明隐喻；“灭尽”保持审判力度；“我好知道”刻意保留原文神学张力。所有脚注标记均置于正文相关位置。
