revisions:
- from: 耶和华对摩西说：“你要告诉以色列人[a]：‘你们是硬着颈项的百姓。我若在你们中间上去，哪怕只是一刻，也会把你们灭尽[b]。现在，你们要摘下身上的饰物[c]，我好知道该怎样处置你们[d]。’”
  to: 耶和华对摩西说：“你要告诉以色列人[a]：‘你们是硬着颈项的百姓。我若片刻之间上到你们中间，就会把你们灭尽[b]。现在，你们要摘下身上的饰物[c]，我好知道我将怎样对待你们[d]。’”
  rationale: 调整短暂时间短语，避免“哪怕”所加入的让步色彩；将“处置”改为“对待”，以保留原文对将采取何种行动的开放性，并相应校正脚注对末句的说明。其余译文与脚注锚点均可保留。
