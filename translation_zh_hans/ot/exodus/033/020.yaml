id: EXO.33.20
reference: Exodus 33:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: zh_hans
  text: 但他说：“你不能看我的面[a]，因为人[b]不能看见我而仍然活着。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的同在”。希伯来文直译为“我的面”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“人”泛指任何人，即全人类。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 但他说
  rationale: וַ־推动叙事；结合上一节摩西请求观看上帝荣耀的语境，用“但”自然表达回应中的转折，同时保留“他说”。
- source_word: לֹא תוּכַל
  choice: 你不能
  rationale: יכל在这里表示能力或可能性，并非许可；“不能”准确而自然。
- source_word: לִרְאֹת
  choice: 看
  rationale: ראה在此指视觉上的观看；“看”是清楚、常用的现代汉语表达。
- source_word: אֶת־פָּנַי
  choice: 我的面
  rationale: פָּנִים字面是“面/脸”。“我的面”既保留希伯来文具体的拟人表达，也符合庄重的经文语体；“我的同在”作为可能含义列入脚注。
- source_word: כִּי
  choice: 因为
  rationale: כִּי引出前述“不可能”的原因；“因为”清楚保留解释关系。
- source_word: לֹא יִרְאַנִי
  choice: 不能看见我
  rationale: 未完成式在此表达普遍原则及其结果；汉语用“不能”自然传达这种普遍的不可能性。
- source_word: הָאָדָם
  choice: 人
  rationale: 带定冠词的אָדָם在此泛指人类，中文“人”可用单数形式表达全人类的一般情况，不限定性别。
- source_word: וָחָי
  choice: 而仍然活着
  rationale: 该结构表达看见上帝之后仍存活这一结果。“而仍然活着”明确传达“继续活着”的含义，并保留与前句相连的结构。
theological_decisions:
- issue: “我的面”所用的拟人化语言
  choice: 正文保留“我的面”
  alternative: 我的同在
  rationale: 希伯来文采用具体的“面”这一说法。正文不把它解释性地抽象化，而将“我的同在”作为可能的语义在脚注中说明。
- issue: הָאָדָם的泛指范围
  choice: 译作“人”，并以脚注说明泛指全人类
  alternative: 任何人；人类
  rationale: 原文名词在语法上是单数，却具有普遍、泛指的意义。“人”兼顾原文形式与现代汉语习惯，脚注则消除可能的范围歧义。
- issue: 看见上帝与存活之间的关系
  choice: 译作“不能看见我而仍然活着”
  alternative: 若看见我，就不能活着
  rationale: 所选译法保留原文“看见我和活着”的并列结果结构，不额外改写为明确的条件句，同时清楚表达无人能在如此看见上帝后继续存活。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我的面”略带经文语体色彩，用以保留原文具体意象；其余句法力求自然清楚。所有脚注标记均置于所说明的词语之后。
