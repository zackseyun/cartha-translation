  naturalness: “流奶与蜜之地”和“在路上”自然且保有庄重文体。“颈项刚硬的百姓”比“硬着颈项的百姓”更符合现代汉语的固定宗教／文学表达。“在你们中间前行”自然表达神临在于百姓当中的随行；“前行”在此行旅语境中可承载 עלה 的行进意义，避免不自然的“在……中间上去”。
  terminology: 保留“流奶与蜜”“颈项刚硬”“灭尽”等恰当的圣经语汇，不加入教派性解释。脚注只说明“灭尽”的词汇替代，锚点置于相应词语之后。
