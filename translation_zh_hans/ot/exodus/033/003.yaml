base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: zh_hans
  text: 到流奶与蜜之地去；因为我不会在你们中间前行，因为你们是颈项刚硬的百姓，免得我在路上把你们灭尽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把你们灭尽”或译“毁灭你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: 到……之地去
  rationale: 保留 אֶל 的方向意义；中文在既有应许语境中用“之地”自然指向前文所说的地方，无须强加不定冠词。
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: 流奶与蜜
  rationale: 保留希伯来语描绘丰饶之地的具体比喻，也是现代中文读者可以理解的庄重表达。
- source_word: כִּי לֹא אֶעֱלֶה
  choice: 但我不会……上去
  rationale: 此处 כִּי 引出与前述前往应许之地形成张力的说明；“但”在中文中清楚呈现转折，而“上去”保留 עלה 的行程和上行色彩。
- source_word: בְּקִרְבְּךָ
  choice: 在你中间
  rationale: 保留“在内部、在当中”的空间及临在意味；第二人称单数按希伯来文保留，以集合方式指以色列。
- source_word: עַם קְשֵׁה עֹרֶף
  choice: 硬着颈项的百姓
  rationale: 保留“颈项刚硬”的身体隐喻，同时以现代中文可理解的结构表达顽梗抗拒。
- source_word: פֶּן
  choice: 免得
  rationale: 准确表达为避免某种可怕后果而作出的防范，与前面的否定决定直接相连。
- source_word: אֲכֶלְךָ
  choice: 把你灭尽
  rationale: כלה 的加强语态在此指使之终结、毁灭；“灭尽”自然表达彻底毁灭的严重性，不勉强套用中文不自然的“吞灭”。
- source_word: בַּדָּרֶךְ
  choice: 在路上
  rationale: 直接、自然地表达前往应许之地途中的行程语境。
theological_decisions:
- issue: 上帝临在的表述
  choice: 我不会在你中间上去
  alternative: 我不会与你一同上去
  rationale: “在你中间”更贴近 בְּקִרְבְּךָ，保留圣洁的上帝临在于悖逆百姓中所带来的危险，而不把意思弱化为一般同行。
- issue: 神圣审判的严重程度
  choice: 把你灭尽
  alternative: 吞灭你
  rationale: 此译保留百姓可能在途中被彻底毁灭的严厉张力，同时避免让并非此处词根本义的吞食意象主导中文理解。
- issue: כִּי 的篇章关系
  choice: 但
  alternative: 因为／原来
  rationale: כִּי 可作解释性连接，但本节片段中，上帝应许目的地后立即说明自己不在百姓中间上去，中文用“但”更自然地呈现其核心反差；其后的第二个 כִּי 则明确译作“因为”。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。保留“流奶与蜜”“硬着颈项”等原文鲜明意象，并保留集合性的单数“你”。脚注仅说明 אֲכֶלְךָ 的主要译法差异。
