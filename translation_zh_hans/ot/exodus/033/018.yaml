  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: zh_hans
  text: 于是他说：“求你让我看见你的荣耀[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“求你让我看见你的荣光”。“让我看见”所译的希伯来语动词，字面意思是“使我看见”；“荣耀”也可指彰显出来的光辉或尊荣。
    reason: 词义备选
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 于是他说
  rationale: 未完成式连续体推进叙事；“于是”自然表达承接和先后关系，而不把连接词机械译作“并且”。
- source_word: הַרְאֵנִי
  choice: 让我看看
  rationale: 这是ראה的使役式祈使形，带第一人称单数宾语后缀，字面义为“使我看见”。汉语“让我看看”既保留请求对方促成观看的使役意味，也比“使我看见”更自然。
- source_word: נָא
  choice: 求你
  rationale: נָא在此标示恳求；“求你”符合摩西向上帝请求时庄重而自然的汉语语体。
- source_word: אֶת
  choice: 不单独译出
  rationale: 这是确定直接宾语标记，现代汉语无需用独立词语对应。
- source_word: כְּבֹדֶךָ
  choice: 你的荣耀
  rationale: כָּבוֹד可指荣耀、尊荣或显现出来的光辉；本处“荣耀”保留其宽广语义和神学张力，不限缩为单纯可见的光辉。
theological_decisions:
- issue: 摩西所求看见的“你的荣耀”具体指什么
  choice: 译作“你的荣耀”，不进一步限定
  alternative: 你的荣光；你临在的全部彰显
  rationale: 希伯来文没有明确界定这是可见的光辉、神圣威严，还是上帝临在的彰显。保留“荣耀”可避免把经文的开放性解释成某一种特定形态。
translation_notes:
  register: 采用现代、庄重且口语可懂的普通话。“求你让我看看”呈现恳求语气；“荣耀”沿用读者熟悉且语义宽广的圣经用语。脚注标记置于所解释的“荣耀”之后。
