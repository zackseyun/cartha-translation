  yaml_path: translation/ot/exodus/033/021.yaml
  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: zh_hans
  text: 耶和华说：“看，在我这里有一个地方。你要站在磐石上。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确对应四字神名。
- source_word: הִנֵּה
  choice: 看
  rationale: 保留提示并引人注意的功能，表达自然直接。
- source_word: מָקוֹם אִתִּי
  choice: 在我这里有一个地方
  rationale: אִתִּי 可表示“在我这里／靠近我”；此译法保留空间上的临近意味，又避免将关系解释得过细。
- source_word: וְנִצַּבְתָּ
  choice: 你要站
  rationale: 该形式在语境中表达随后应采取的行动，用中文指示性语气自然呈现。
- source_word: עַל הַצּוּר
  choice: 在磐石上
  rationale: 准确表达介词 עַל 和带定冠词的 צוּר，并以“磐石”保持庄重语体。
theological_decisions:
- issue: “在我这里”与神的临在之关系
  choice: 保留空间性、关系性均可容纳的“在我这里”
  alternative: “在我旁边”
  rationale: 原文 אִתִּי 较简练，既可指靠近说话者，也可有“与我同在／在我这里”的意味；不把它限定为纯粹方位。
translation_notes:
  register: 现代、庄重、清楚；沿用出埃及记叙事中神谕的直接语气。
