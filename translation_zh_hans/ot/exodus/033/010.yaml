base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: zh_hans
  text: 所有百姓看见云柱立在那帐篷门口，就都站起来，各人在自己的帐篷门口下拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俯伏”或“敬拜”。希伯来语动词指以屈身、俯伏等身体动作表示尊崇，也常用来表达敬拜。
    reason: 保留该希伯来动词在身体姿态与宗教敬拜功能之间的词义幅度。
lexical_decisions:
- source_word: וְרָאָה
  choice: 看见……就
  rationale: 连续叙事形式在这里引出后续反应；用“看见……就”自然表达动作之间的时间和因果衔接。
- source_word: כָל הָעָם
  choice: 众百姓／都
  rationale: 指以色列全体会众，但本节没有明说“以色列”；“众百姓……都”既忠实又符合现代汉语。
- source_word: עַמּוּד הֶעָנָן
  choice: 云柱
  rationale: 保留原文具体、可见的形象，也是现代中文中清楚自然的对应表达。
- source_word: עֹמֵד
  choice: 立在
  rationale: 分词描写云柱所处的位置；“立在”简洁地保留其直立、停驻的视觉形象。
- source_word: פֶּתַח הָאֹהֶל
  choice: 那帐幕门口
  rationale: 原文直译为“帐幕的入口”。“门口”是自然的现代汉语；加“那”标明这是上下文中特指的帐幕，而不擅自补入本节未重复出现的“会幕”。
- source_word: וְקָם
  choice: 站起来
  rationale: 表达百姓起身站立的动作，比仅作叙事性的“起来”更明确，同时保持庄重自然。
- source_word: וְהִשְׁתַּחֲווּ
  choice: 下拜
  rationale: 该词首先指屈身、俯伏等表示敬意的身体动作，在此又具有向上帝敬拜的宗教含义；“下拜”兼顾身体动作和敬拜功能，不把其中一面排除。
- source_word: אִישׁ
  choice: 各人
  rationale: 原文为阳性单数的逐一分配用法，重点是群体中的每一个人；现代汉语“各人”准确保留分配意义，无须额外限定性别。
- source_word: פֶּתַח אָהֳלוֹ
  choice: 在自己的帐棚门口
  rationale: 保留每个人都在其各自帐棚入口处下拜的画面。“自己的”自然表达第三人称单数所属关系。
theological_decisions:
- issue: 百姓面对上帝显现标志时的动作应译为身体性的俯伏，还是宗教性的敬拜
  choice: 下拜
  alternative: 俯伏；敬拜
  rationale: 希伯来语动词兼具屈身俯伏的具体动作和表示敬拜的语用功能。本处百姓回应云柱所代表的耶和华临在，显然具有敬拜意义，但原词的身体姿态也不应被抹去；正文采用可兼顾二者的“下拜”，脚注列明两种侧重。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那帐幕”与“自己的帐棚”在中文中适度区分公共的特指帐幕和各人的居所，同时没有把原文两处同属 אֹהֶל 的事实解释成不同建筑类别。脚注标记紧随其所说明的“下拜”。
