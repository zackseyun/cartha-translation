  to: 所有百姓看见云柱立在那帐篷门口，就都站起来，各人在自己的帐篷门口下拜[a]。
  rationale: 统一两处“帐篷”以忠实反映原文重复使用的同一名词，避免中文术语暗示不同建筑类别；将“众百姓”调整为更自然的“所有百姓”。其余译文及脚注均可保留。
