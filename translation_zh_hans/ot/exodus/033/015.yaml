  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אִם אֵ֤ין פָּנֶ֨י/ךָ֙ הֹלְכִ֔ים אַֽל תַּעֲלֵ֖/נוּ מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: zh_hans
  text: 他对耶和华说：“你若不亲自与我们同去[a]，就不要把我们从这里领上去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲自”原文直译为“你的面”；希伯来语常用“面”表示某人亲身临在。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 他对耶和华说
  rationale: 叙事中的连续式推进话语；按上文明确受话者为耶和华，使现代中文指代清楚。“说”已自然表达言语朝向。
- source_word: אִם אֵין
  choice: 若不
  rationale: 表达否定存在结构所引出的真实条件，简洁自然。
- source_word: פָּנֶיךָ הֹלְכִים
  choice: 你若不亲自与我们同去
  rationale: פָּנִים字面为“面”，在此以神亲身临在、同行为意；中文“亲自与我们同去”既传达临在和伴随，也与后句“我们”呼应。原文“面”的意象保留在脚注。
- source_word: אַל תַּעֲלֵנוּ
  choice: 就不要把我们……领上去
  rationale: אַל加未完成式表达禁止或恳求；עלה使役式意为使人上去、带上去。译作“领上去”适合旅程语境，并保留方向意味。
- source_word: מִזֶּה
  choice: 从这里
  rationale: 准确表达介词加指示词所指的当前地点。
theological_decisions:
- issue: 如何翻译指向神的פָּנֶיךָ
  choice: 你亲自与我们同去
  alternative: 你的面若不同行／你的同在若不同行
  rationale: 原文用“你的面”表达神亲自临在并同行。正文采用自然中文传达此含义，但不把它弱化为抽象力量；脚注揭示字面意象，以保存原文的关系性和神学张力。
- issue: 补明אֵלָיו的所指
  choice: 对耶和华说
  alternative: 对他说
  rationale: 本节希伯来文仅作“对他说”，其先行对象由上文明确为耶和华。中文补明对象可避免独立阅读时指代含混，不改变所指。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“亲自与我们同去”比生硬的“你的面若不去”自然，同时脚注保留原文意象；“领上去”保留使役及行程方向。
