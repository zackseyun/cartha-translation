base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: zh_hans
  text: 每逢摩西往那帐棚[a]去，众百姓都起来，各人[b]站在自己的帐棚门口，目送摩西，直到他进了帐棚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“会幕”，指上下文所说的那座帐棚。
    reason: lexical_alternative
  - marker: b
    text: 原文为“各人”（阳性单数）；这里采用分配用法，指百姓中各人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 每逢
  rationale: 这里的“וְ + 完成式”引出惯常、反复发生的情形；“每逢”以自然的现代汉语表达这一迭代意义。
- source_word: כְּצֵאת מֹשֶׁה אֶל הָאֹהֶל
  choice: 摩西出去，到那帐棚那里
  rationale: כְּצֵאת 表示“当……出去时”，אֶל 表示朝向该帐棚；译文保留“出去”的移动含义，并用“到……那里”自然表达目的地。
- source_word: הָאֹהֶל
  choice: 那帐棚
  rationale: 原文只称“那帐棚”，定冠词表明是上下文已提到的特定帐棚。正文不直接扩写为“会幕”，以免加入本节未出现的完整称谓。
- source_word: יָקוּמוּ וְנִצְּבוּ
  choice: 就都起来，各人站在
  rationale: 两个动词描述惯常动作：百姓起身，并各自在固定位置站立。汉语用“起来……站在”清楚保留动作次序和姿态。
- source_word: אִישׁ פֶּתַח אָהֳלוֹ
  choice: 各人站在自己的帐棚门口
  rationale: אִישׁ 在此作分配用法，意为百姓中的每一个人；“各人……自己的”符合现代汉语习惯，也保留逐一对应的意义。
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: 目送摩西
  rationale: אַחֲרֵי 与“观看”连用，描写众人随着离去的摩西而转移视线。“目送”准确、简洁地表达从后观看他前行，而不误解为照料或跟随。
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: 直到他进了帐棚
  rationale: בוא 加在“帐棚”上的方向词尾表示进入其中；“进了帐棚”是自然简明的汉语表达。
theological_decisions:
- issue: “那帐棚”是否应在正文明确译作“会幕”
  choice: 正文译作“那帐棚”，以脚注说明所指
  alternative: 正文直接译作“会幕”
  rationale: 上下文表明这是摩西设在营外、称为会幕的帐棚，但本节希伯来文只写 הָאֹהֶל（“那帐棚”）。正文保留原文措辞，脚注提供上下文指向，避免在正文中消除两种称呼之间的差别。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“每逢……就……”呈现反复发生的叙事情形；“目送”自然传达希伯来文“在摩西身后观看”的动作。保留“帐棚”而不在正文扩写为“会幕”，并以脚注交代上下文。
