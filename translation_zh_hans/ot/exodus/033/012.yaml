source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: zh_hans
  text: 摩西对雅威说：“你看，你对我说：‘把这百姓领上去’，却没有让我知道你要派谁与我同去。你还说过：‘我按着你的名认识你[a]，而且你在我眼中蒙了恩[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “按着你的名认识”是希伯来语习语，表示个人性的认识和眷顾。
    reason: cultural_note
  - marker: b
    text: “蒙了恩”也可译作“得了恩宠”。原文直译为“在我眼中找到了恩”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: רְאֵה
  choice: 你看
  rationale: 在此作祈使式话语标记，引出摩西直接而恳切的申诉；“你看”自然且保留原文的直率。
- source_word: הַעַל
  choice: 领上去
  rationale: 使役形表达使百姓上行；结合摩西受命带领百姓的语境，“领上去”兼顾方向含义与自然汉语。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留单数集合名词和指示语，亦保存原文略带距离感的措辞。
- source_word: הוֹדַעְתַּנִי
  choice: 没有让我知道
  rationale: 体现ידע使役形“使……知道”的含义，同时符合现代汉语表达。
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: 你要派谁与我同去
  rationale: אֲשֶׁר在此自然指将与摩西同行者；“谁”保留其未指明性，“与我同去”准确表达同行关系。
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: 我按名认识你
  rationale: 保留“按名认识”这一关系性习语及其个人性的分量，不将其扩写为拣选等更强的神学解释。
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: 你在我眼中蒙了恩
  rationale: 保留“在我眼中”的希伯来意象；“蒙了恩”自然传达חֵן所指的恩惠或眷顾。
- source_word: וְגַם
  choice: 而且
  rationale: 明确保留原文的附加递进意味。
- source_word: וְאַתָּה ... לֹא ... וְאַתָּה אָמַרְתָּ
  choice: 却……你还说过
  rationale: 用“却”呈现摩西指出的反差，用“还”保留第二个强调性连接结构，避免把逻辑关系处理得过强。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，故以“雅威”音译为专名，避免以称号“主”取代；“耶和华”是传统形式，但不如“雅威”贴近通常重建的读音。
- issue: “我按名认识你”的含义
  choice: 保留关系性习语，不作神学扩写
  alternative: 我亲自认识你；我特别拣选了你
  rationale: 此语表达上帝对摩西个人性的认识与眷顾，但经文本身没有在这里明确说“拣选”，因此保存原有张力。
- issue: חֵן的表达
  choice: 蒙了恩
  alternative: 蒙我喜悦；得了恩宠
  rationale: “恩”既可表达所获恩惠，也保留神学语感；上下文说明这是在雅威眼中的眷顾，却不把它缩减为单纯情绪上的喜欢。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。摩西的话保留直接申诉的语气；引语层次清楚。正文中的[a]、[b]均与脚注对应。
