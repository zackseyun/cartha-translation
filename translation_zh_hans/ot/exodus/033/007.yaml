base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: zh_hans
  text: 摩西常在营外、离营地很远的地方，为自己支搭那帐篷[a]，并称它为“会幕”。凡寻求雅威的人，都到那在营外的会幕去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是“那帐篷”，没有明确说“他的帐篷”。有人认为这是摩西自己的帐篷，也有人认为是他专为此用途设置的另一顶帐篷。
    reason: lexical_alternative
  - marker: b
    text: 原文的动词形式在这里很可能描述惯常发生的事；也可按简单过去时理解为“摩西支搭了……”“凡寻求雅威的人都出去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: 常把……带到
  rationale: 未完成式在本段叙事中很可能表示惯常、反复发生的行动；用“常”自然表达这一语气，而不是译成一次性的“带了”。
- source_word: הָאֹהֶל
  choice: 那帐篷
  rationale: 原文带定冠词，直指“那帐篷”，却没有明说是“他的帐篷”；译文保留这种未明确界定的指称。
- source_word: וְנָטָה לוֹ
  choice: 为自己支搭起来
  rationale: נטה用于帐篷时通常指支搭；לוֹ译作“为自己”，保留摩西为自己使用或为自身目的设置帐篷的含义。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 营外
  rationale: 准确表达帐篷位于以色列营地之外。
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: 远离营地
  rationale: 保留原文对帐篷与营地之间距离的加强和强调。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是现代中文圣经语境中自然、庄重且广为理解的固定译法，指指定相会之处的帐篷。
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: 凡寻求雅威的人
  rationale: “寻求”保留了寻求神以及向神求问两方面的可能含义，不将语义限缩为单纯求问。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代中文常用音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: יֵצֵא
  choice: 都到……去
  rationale: 与前面的未完成式一致，在此表达惯常行动；“凡……都……”自然呈现每个寻求雅威的人通常会出去的情形。
- source_word: אֲשֶׁר מִחוּץ לַמַּחֲנֶה
  choice: 营外的
  rationale: 简洁自然地保留关系从句对会幕所在位置的说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟定读音，并清楚保留其专名性质。
- issue: “那帐篷”的身份
  choice: 不明确说成摩西自己的帐篷
  alternative: 他的帐篷
  rationale: 原文只有带定冠词的“帐篷”，并未使用所有格。它可能是摩西自己的帐篷，也可能是专为此用途设置的另一顶帐篷；译文不替原文消除这一张力。
- issue: 本节行动的时态与体貌
  choice: 译为惯常、反复发生的行动
  alternative: 译为一次发生的过去行动
  rationale: יִקַּח和יֵצֵא在此叙事环境中很可能具有惯常或反复意义，且后半句“凡……的人”也支持这种理解；脚注同时说明原文形式及另一种译法的可能。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“会幕”为成熟且清晰的中文术语；用“常”和“凡……都……”呈现惯常行动。句法顺序略作调整，把“为自己支搭”放在地点说明之后，使中文流畅，同时保留原文各项信息和“那帐篷”身份上的含混。
