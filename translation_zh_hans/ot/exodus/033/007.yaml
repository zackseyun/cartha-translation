revisions:
- from: 摩西常把那帐篷带到营外[a]，远离营地，为自己支搭起来，并称它为“会幕”。凡寻求雅威的人，都到营外的会幕去[b]。
  to: 摩西常在营外、离营地很远的地方，为自己支搭那帐篷[a]，并称它为“会幕”。凡寻求雅威的人，都到那在营外的会幕去[b]。
  rationale: 将“带到营外”改为以“支搭”为核心谓语，避免增添原文未明说的搬运动作；将“营外、离营地很远”明确为支搭地点。其余保留原译的惯常体表达、神名、会幕术语及帐篷身份的含混。
