  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: zh_hans
  text: 雅威对摩西说[a]：“你和你从埃及地领上来的百姓，要从这里上去，往我向亚伯拉罕、以撒和雅各起誓说：‘我要把这地赐给你的后裔[b]。’的那地去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”对应希伯来文神名 YHWH；传统上常译作“耶和华”。
    reason: 说明神名的原文形式及传统中文译法。
  - marker: b
    text: “后裔”原文为集合单数，也可译作“子孙”。
    reason: 保留 זֶרַע 的集合单数特点和词义范围。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 在引出直接引语时，现代汉语用“说”最自然；叙事推进由上下文和语序体现，无须机械译出连接词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神名音译，并以脚注说明其希伯来文形式为YHWH。
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: 要从这里上去
  rationale: 两个连续命令表达离开此地并向上行进；合译为“从这里上去”自然且保留方向感。
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: 你……领上来的
  rationale: 使役形表达带领百姓从埃及上来；“领上来”既符合语境，也保留与后文“上去”的词语呼应。
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי
  choice: 到我起誓应许……的那地
  rationale: 原文直译为“到我向……起誓的那地”；汉语补出“应许”可清楚表达誓言与土地之间的关系，其具体内容随后的引语明确说明。
- source_word: לְזַרְעֲךָ
  choice: 你的后裔
  rationale: זֶרַע是集合单数，可指一个人的后代整体；“后裔”在现代庄重汉语中自然，并保留集合含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用以色列之神的专名，而非“主”这一称号；正文采用中文读者熟悉的专名音译“耶和华”，脚注交代YHWH及另一常见拟音，避免把专名替换为称号。
- issue: “你从埃及地领上来的百姓”的责任语气
  choice: 按原文保留第二人称归于摩西
  alternative: 改作“我从埃及领出来的百姓”
  rationale: 本节刻意说是摩西“领上来”的百姓，可能承接金牛犊事件后的张力；不可根据其他经文把主语改成上帝。
- issue: זֶרַע的单复数张力
  choice: 译作集合性的“后裔”
  alternative: 子孙／种子
  rationale: 此处指族长的后代整体；不把语法单数强行解释为某一位特定个体，也不采用在现代汉语中容易误解的字面“种子”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。把较难懂的嵌套誓言结构分成两句，但保留人物、行动方向、誓言对象和应许内容；正文中的[a]、[b]均与脚注对应。
