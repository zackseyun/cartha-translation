revisions:
- from: 耶和华对摩西说[a]：“你和你从埃及地领上来的百姓，要从这里上去，到我起誓应许亚伯拉罕、以撒和雅各的那地。我曾说：‘我要把那地赐给你的后裔[b]。’”
  to: 雅威对摩西说[a]：“你和你从埃及地领上来的百姓，要从这里上去，往我向亚伯拉罕、以撒和雅各起誓说：‘我要把这地赐给你的后裔[b]。’的那地去。”
  rationale: 修订使神名与英语 POB 的 Yahweh 处理一致，并将“说：‘我要……’”明确维系为雅威向三位族长所起誓的内容。保留“你从埃及地领上来的百姓”、行动的“上去”、三位族长的姓名，以及“后裔”的集合性，未增添特定神学解释。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:50Z'
review_pass:
  verdict: revise
  source_fidelity: 原文的命令、摩西作为“领上来”之人的第二人称表述、目的地及向三位族长所起的誓言均基本得到保留。然而，正文采用“耶和华”而英语审校轨迹及既定神名处理采用 Yahweh；此外，“我曾说”把原文附属于“起誓”的不定式/引语结构处理成独立的过去陈述，较弱化其作为誓言内容的句法关系。
  naturalness: 原译总体庄重通顺。“到我起誓应许……的那地”略显压缩，且随后另起“我曾说”使引语与“起誓”的关系不够清晰。改为“往我向……起誓说……的那地去”虽保留嵌套引语，仍是自然且更贴近原文的现代书面汉语。
  terminology: 神名宜按审校轨迹译为“雅威”，并在脚注说明 YHWH 及传统“耶和华”译法。“后裔”恰当表达 זֶרַע 的集合单数，不应作特定个体的释义。
  issues:
  - severity: medium
    issue: 神名译法与英语 POB 审校轨迹不一致
    rationale: 英语 POB 明定将 יְהוָה 译作 Yahweh，而非 Jehovah/“the LORD”。汉语以“雅威”对应 Yahweh 更一致；“耶和华”可作为传统译法在脚注交代。
  - severity: low
    issue: “我曾说”未明确作为“起誓”的内容
    rationale: לֵאמֹר 引出前述“我起誓”的内容，不是另一次独立的过去说话。将其保留在“起誓说”的结构内能更准确呈现原文句法。
  - severity: low
    issue: “应许”属解释性补入
    rationale: 原文是“我向亚伯拉罕、以撒和雅各起誓，说……”。“应许”虽不改变大意，却非必要；直接保留“起誓说”更贴近原文。
  revised_text: 雅威对摩西说[a]：“你和你从埃及地领上来的百姓，要从这里上去，往我向亚伯拉罕、以撒和雅各起誓说：‘我要把这地赐给你的后裔[b]。’的那地去。”
