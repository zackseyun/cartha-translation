base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: zh_hans
  text: 我要差遣一位使者在你前面[a]；我要赶出迦南人、亚摩利人、赫人、比利洗人、希未人和耶布斯人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一位天使”。希伯来语 מַלְאָךְ 可指天使，也可指人的使者；这里的语境通常理解为天使。
    reason: 保留原文在“使者”与“天使”之间的词义歧义。
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: 我要差遣
  rationale: 在这段上帝的宣告中，带连接词的完成式表达将来的应许；“我要差遣”自然、庄重，并保留差派的意味。
- source_word: לְפָנֶיךָ
  choice: 走在你前面
  rationale: 这是表示“在你前面／先于你”的希伯来语惯用语；补出“走在”使现代汉语流畅，也切合引路前行的语境。
- source_word: מַלְאָךְ
  choice: 一位使者
  rationale: 该词既可指属天的使者，也可泛指受差遣传信或执行任务者。正文用“使者”保留原词的词义范围，不预先判定其具体身份；脚注说明常见的“天使”译法。
- source_word: וְגֵרַשְׁתִּי
  choice: 我要赶出
  rationale: גרשׁ在此表示把当地居民逐出；“赶出”清楚、自然，并保留动作的力度。
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: 迦南人、亚摩利人、赫人、比利洗人、希未人和耶布斯人
  rationale: 这些带定冠词的单数族名具有集合意义。汉语以“某某人”自然地兼具单数形式和族群集合意义，并沿用通行圣经专名。
theological_decisions:
- issue: 本节中 מַלְאָךְ 的身份
  choice: 正文译作“一位使者”，不指明其是耶和华的使者、某位受造天使或人间使者。
  alternative: 译作“一位天使”。
  rationale: 本节只用通称 מַלְאָךְ，并未进一步界定身份。正文保留其真实的词义歧义，脚注列出语境中很可能的理解，避免把未明说的神学身份写入经文。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“差遣”保持神圣宣告的语体，“赶出”则直接清楚。分号呈现两个并列的将来行动；族名采用简体中文圣经传统中通行的译名。
