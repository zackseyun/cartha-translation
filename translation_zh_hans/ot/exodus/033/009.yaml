  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: zh_hans
  text: 每逢摩西进入帐幕[a]，云柱就降下来，停在帐幕门口；他便与摩西说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节末句也可更明确地译作：“耶和华便与摩西说话。”希伯来文在这一分句中省略了主语，但上下文表明所指的是耶和华。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: 每逢……进入
  rationale: וְהָיָה配合带כ的动词不定式，在叙事中引出反复发生的情形；“每逢”自然表达惯常、重复之意。
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: 帐幕
  rationale: 原文这里只说“帐幕”，未使用完整名称“会幕”；上下文已明确所指，因此不补入较长称号。
- source_word: יֵרֵד
  choice: 就降下来
  rationale: 未完成式承接本句的惯常语境，表示每次摩西进入时反复发生的动作；“就”也体现时间上的随即关系。
- source_word: עַמּוּד הֶעָנָן
  choice: 云柱
  rationale: 这是该组合词简洁、通行且形象清楚的现代汉语表达。
- source_word: וְעָמַד
  choice: 停在
  rationale: 这里表示云柱降下后立定于帐幕入口；“停在”比机械直译为“站立”更符合云柱这一主语的汉语表达，同时保留其驻留不动的画面。
- source_word: פֶּתַח הָאֹהֶל
  choice: 帐幕门口
  rationale: פתח指入口或开口；“门口”是现代汉语中自然明确的空间表达，不要求帐幕必有实体门扇。
- source_word: וְדִבֶּר
  choice: 他便……说话
  rationale: 希伯来文动词为阳性单数，却没有明说主语；用“他”保留这一形式上的含蓄，让上下文指明所指。
- source_word: עִם מֹשֶׁה
  choice: 与摩西说话
  rationale: עִם基本义为“与”，在此呈现双方相对、亲自交谈的关系色彩，故不译成单向的“对摩西说”。
theological_decisions:
- issue: “与摩西说话”的隐含主语
  choice: 正文保留代词“他”，不直接补出“耶和华”
  alternative: 译作“耶和华便与摩西说话”；较不可能的是把“云柱”理解为说话的主语
  rationale: 上下文表明说话者是耶和华，但本节希伯来文没有明确写出主语。正文保留代词，可兼顾上下文的可理解性与原文在表达上的含蓄；脚注则明确说明这一语法和语境关系。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“每逢……就……”清楚呈现反复发生的叙事情形；“帐幕”紧贴本节原文，不擅自扩充为“会幕”。分号帮助读者分辨云柱的动作与随后隐含主语的说话动作。
