  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: zh_hans
  text: 当我的荣耀经过时，我会把你安置在磐石的裂缝里，用我的手遮盖你，直到我经过。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: 当……经过时
  rationale: היה与ב加不定式连用，在这里引出后续动作发生的时间情境；译成“当……经过时”符合现代汉语表达，也保留原文的时间关系。
- source_word: כְּבֹדִי
  choice: 我的荣耀
  rationale: כבוד在显现的语境中指上帝彰显出来的荣耀；“荣耀”准确、庄重，也符合本段语境。
- source_word: וְשַׂמְתִּיךָ
  choice: 我会把你安置
  rationale: שׂים表示放置、安放；“安置”比单说“放”更自然庄重，同时保留上帝主动安排摩西所在位置的含义。
- source_word: בְּנִקְרַת הַצּוּר
  choice: 在磐石的裂缝里
  rationale: נִקְרָה指岩石中的裂缝或凹处，צוּר指岩石、磐石。汉语不以冠词区分定指与不定指，因此无需人为加入“一个”来消解原文结构在其他语言中可能产生的表达差异。
- source_word: וְשַׂכֹּתִי
  choice: 遮盖
  rationale: סכך表达覆盖、遮蔽之意；“遮盖”保留具体动作和保护性的意象，并能自然衔接“用我的手”。
- source_word: כַפִּי
  choice: 我的手
  rationale: כף本可特指手掌，但在这里的拟人性表达中，“我的手”是自然且不过度具体化的译法，保留了原文的身体意象。
- source_word: עַד עָבְרִי
  choice: 直到我经过
  rationale: עַד加带第一人称后缀的不定式，表示遮盖持续到上帝经过为止；“直到我经过”简洁地保留这一时间终点。
theological_decisions:
- issue: 上帝的拟人性表达“我的手”
  choice: 正文保留“我的手”这一具体意象。
  alternative: 译作“我的保护”或“我的能力”。
  rationale: 原文直接使用身体意象；将其抽象化会加入解释并削弱叙事画面。保留原文措辞并不等于对上帝是否具有物质身体作出额外的教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“安置”“磐石”“遮盖”保持经文语体的尊严，同时避免生硬仿照希伯来语句法。英语咨询文本中关于英文冠词定指与不定指的脚注不适用于汉语，因此不设脚注。
