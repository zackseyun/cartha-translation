  source_fidelity: 忠实反映希伯来文的时间结构：上帝的“荣耀”经过时，祂将摩西置于岩石的裂缝中，并以“我的手”遮盖，直至祂经过。译文保留了原文中“我的荣耀”与第一人称“我经过”并列的表述，也没有将拟人性意象作解释性抽象化。
  naturalness: “当我的荣耀经过时，我会把你安置在磐石的裂缝里，用我的手遮盖你，直到我经过”语序通顺、庄重而易懂，符合现代标准汉语的经文语体。“磐石”“安置”“遮盖”虽略具书面庄重色彩，但在本段神显叙事中自然恰当。
