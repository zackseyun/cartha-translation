base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: zh_hans
  text: 雅威常常面对面地与摩西说话[a]，就像人与朋友说话一样。之后，摩西会回到营里；但他的助手——嫩的儿子约书亚，一个年轻人——却不离开帐篷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直接地”或“亲自”。希伯来语“面对面”在这里表示格外直接的相遇和交谈。
    reason: lexical_alternative
  - marker: b
    text: 即会幕。
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: 常常……说话
  rationale: 此处结合上下文描述会幕中的惯常情形；用“常常”表达反复发生的动作，比单纯过去时更准确自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名音译，保留上帝向以色列启示的专名，而不以称号代替。
- source_word: פָּנִים אֶל־פָּנִים
  choice: 面对面地
  rationale: 保留希伯来文惯用语，表达格外直接、亲近的交谈，而不强行断定摩西在视觉上看见了上帝的本体。
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: 就像人与朋友说话一样
  rationale: “人”自然对应 אִישׁ，“朋友”在此关系语境中恰当地表达 רֵעַ。
- source_word: וְשָׁב
  choice: 之后，摩西会回到
  rationale: 与前半句的惯常叙事相呼应，表示每次交谈之后摩西通常回营；明确补出“摩西”可避免中文代词歧义。
- source_word: וּמְשָׁרְתוֹ
  choice: 他的助手
  rationale: 表示在旁协助、服侍的人；“助手”符合现代汉语，也避免“仆人”可能带来的家仆意味。
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: 嫩的儿子约书亚
  rationale: 采用现代中文圣经人名的通行形式，并自然表达父子称谓。
- source_word: נַעַר
  choice: 一个年轻人
  rationale: 该词可指少年、青年或年轻侍从；本句已有“助手”，故译作“年轻人”，避免重复加入服侍含义。
- source_word: לֹא יָמִישׁ מִתּוֹךְ הָאֹהֶל
  choice: 却不离开帐篷
  rationale: מוּשׁ 表示离开或移开；否定形式在此延续惯常叙事。“不离开帐篷”以自然中文表达留在帐篷内的意思。
theological_decisions:
- issue: 雅威与摩西“面对面”说话的拟人性表述
  choice: 正文保留“面对面地”，理解为直接、亲近的交谈
  alternative: 意译为“直接地”或“亲自”说话
  rationale: 原文有意使用鲜明的惯用语。译文保留这一表达及其与其他“人不能见上帝”经文之间的张力，不在翻译中自行消解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“常常”和“会”共同呈现本节惯常、反复发生的叙事特征；破折号标明“嫩的儿子约书亚，一个年轻人”均为“他的助手”的同位说明。
