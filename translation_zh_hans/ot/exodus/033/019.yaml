  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: zh_hans
  text: 他又说：“我必亲自使我一切的美善从你面前经过，也必在你面前宣告雅威的名。我要恩待谁，就恩待谁；我要怜悯谁，就怜悯谁[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要体恤谁，就体恤谁。”
    reason: “怜悯”所译的希伯来词兼有怜悯、同情、体恤之意；完整列出备选重复句式，以保留原文的修辞结构。
lexical_decisions:
- source_word: אֲנִי אַעֲבִיר
  choice: 我亲自要使……经过
  rationale: 独立人称代词 אֲנִי 强调行动者，因此译作“我亲自”；אַעֲבִיר 是 עבר 的使役式，译作“使……经过”以保留使役含义。
- source_word: כָּל טוּבִי
  choice: 我一切的美善
  rationale: טוּב 可指良善、福惠和可喜悦之处；“美善”既涵盖神良善的本性及其彰显，也不把含义局限为外在美丽或所赐之物。
- source_word: עַל־פָּנֶיךָ
  choice: 从你面前
  rationale: 这是表示在某人面前或经过其面前的空间表达；结合“经过”，译作“从你面前”自然且具体。
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: 我要……宣告雅威的名
  rationale: 此处 קרא בשם 指公开宣告神的名，而非求告神名；下文出埃及记34章的自我启示支持这一理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留四字神名作为专名，而不以“主”这一称号代替。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 保留原文有关摩西在场、亲自听见宣告的具体空间表达。
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: 我要恩待谁，就恩待谁
  rationale: 前后用同一词语“恩待”重现 חנן 词根的刻意反复，同时保持现代汉语的自然表达。
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: 我要怜悯谁，就怜悯谁
  rationale: 用同一词语“怜悯”保留 רחם 的重复和强调；该词兼有慈悲、体恤之意。
theological_decisions:
- issue: 神关于恩待与怜悯的自我宣告
  choice: 保留“我要……谁，就……谁”的第一人称重复句式
  alternative: 将其概括为神普遍施恩的原则，或采用更具决定论色彩的释义
  rationale: 原文以重复句式表达神施恩与怜悯的自由和主权；译文保留这一张力，不借后来的神学体系替经文作出进一步裁断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“我亲自”表达独立代词的强调，以两组重复句式保留原文的修辞力度；神名采用“雅威”。
