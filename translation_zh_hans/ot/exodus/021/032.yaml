  text: אִם עֶ֛בֶד יִגַּ֥ח הַ/שּׁ֖וֹר א֣וֹ אָמָ֑ה כֶּ֣סֶף שְׁלֹשִׁ֣ים שְׁקָלִ֗ים יִתֵּן֙ לַֽ/אדֹנָ֔י/ו וְ/הַ/שּׁ֖וֹר יִסָּקֵֽל־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male slave or a female slave[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: zh_hans
  text: 如果牛顶死了男奴或女奴[a]，牛主就要给奴隶的主人三十舍客勒银子，并且要用石头打死那头牛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“奴隶，无论男女。”希伯来文分别使用了表示男奴（עֶבֶד）和女奴（אָמָה）的词。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: 男奴
  rationale: 在这条涉及赔偿的法律中，奴隶身份是关键；又因该词与表示女性奴隶的 אָמָה 并列，译作“男奴”既保留性别区别，也避免“仆人”弱化其受奴役的法律社会地位。
- source_word: אָמָה
  choice: 女奴
  rationale: 该词与 עֶבֶד 成对出现，在此指女性奴隶；“女奴”是清楚、简洁的现代汉语表达，并保留原文的法律社会含义。
- source_word: יִגַּח
  choice: 顶死了
  rationale: נגח 在牛伤人律例中指牛用角顶撞；上下文规定牛被处死并支付赔偿，表明受害者死亡。汉语“顶死”自然且准确地表达动作及结果。
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: 三十舍客勒银子
  rationale: 原文表示按舍客勒重量计算的银子。“三十舍客勒银子”既保留古代计量单位，也符合现代中文圣经法律语体。
- source_word: יִתֵּן
  choice: 就要给
  rationale: 未完成式在条件律例中表达法定义务；“就要给”自然呈现“如果……就……”的法律结构，同时保持明确的强制性。
- source_word: לַאדֹנָיו
  choice: 给奴隶的主人
  rationale: 第三人称单数后缀最自然地回指刚提到的男奴或女奴。汉语若直译为“他的主人”可能产生性别及指代歧义，因此明确译作“奴隶的主人”。
- source_word: יִסָּקֵל
  choice: 要用石头打死
  rationale: סקל 的被动式指以石刑处死。现代汉语“用石头打死”比单说“用石头打”更明确，也准确表达该法律处罚的致死性质。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的法律叙述语体。以“如果……就……”再现希伯来条件律例结构；明确补出“牛主”和“奴隶的主人”，避免汉语代词指向不清。保留“舍客勒”这一古代重量单位。
