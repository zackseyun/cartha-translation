  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female slave[b][a], she shall not go out as the male slaves go out.
translation:
  language: zh_hans
  text: 若一个男人把自己的女儿卖作女奴[a]，她不可像男奴那样获得释放[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “女奴”译自希伯来文אָמה，指处于奴役或隶属服役地位的女性；也可译作“婢女”或“女仆”，但这些译法在现代汉语中可能较不清楚地表达其法律身份。
    reason: lexical_alternative
  - marker: b
    text: 直译为“不可像男奴出去”。这里“出去”是有关结束奴役、获得释放的法律用语；本句说明她不按男奴相同的方式或条件获得释放，具体规定见下文。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: 如果
  rationale: 在连续的判例法条文中引出条件情形；现代汉语以“如果”自然表达，毋须机械译出连接词 וְ。
- source_word: יִמְכֹּר אִישׁ
  choice: 有人……卖
  rationale: 准确表达一般性的法律情形；“有人”在现代汉语中自然，也不否认原文 אִישׁ 所指的男性家长。
- source_word: בִּתּוֹ
  choice: 自己的女儿
  rationale: 明确表达“女儿”及第三人称阳性单数所属关系；“自己”使汉语指代清楚。
- source_word: לְאָמָה
  choice: 作婢女
  rationale: אָמָה 指处于隶属服役地位的女性。“婢女”是简洁、庄重且能体现古代身份的汉语表达；脚注说明其法律上的奴役性质，避免将其理解为普通受雇女佣。
- source_word: לֹא תֵצֵא
  choice: 她不可……离去
  rationale: 保留“出去、离去”的希伯来法律措辞，同时在汉语中通顺；语境指结束服役、获得释放。
- source_word: כְּצֵאת הָעֲבָדִים
  choice: 像男奴那样离去
  rationale: 延续 יצא 的动词平行，并根据与 אָמָה 的性别对照，将复数 עֲבָדִים 明确译为“男奴”。
theological_decisions:
- issue: 盟约法中奴役身份术语的表达
  choice: 正文采用“婢女”和“男奴”，并以脚注明确“婢女”在此指受奴役服役的女性。
  alternative: 将两者译为“女奴”和“男奴”，或译为“女仆”和“仆人”。
  rationale: “女仆”容易被现代读者误解为受雇佣人，淡化买卖和隶属身份；“女奴”虽最直接，却可能遮蔽 אָמָה 在汉语传统法律叙述中可自然对应的女性家内服役称谓。正文与脚注结合，既保持可读性，也不弱化法律现实。
- issue: 女子并非按男奴相同方式离去的含义
  choice: 保留比较句“不可像男奴那样离去”，不在正文中解释为绝对不得获释。
  alternative: 译作“不可像男奴一样获得自由”或“不得离开”。
  rationale: 原文强调释放方式或条件不同，而非在本节单独说明全部后果；保留措辞可避免把后文规定提前读入本节，也保存其法律张力。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述。以“婢女”保持自然汉语，并用脚注明确其奴役身份；“离去”保留原文重复使用“出去”的法律意象。所有脚注标记均置于正文对应位置。
