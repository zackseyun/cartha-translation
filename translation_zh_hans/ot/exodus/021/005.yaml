  text: וְ/אִם אָמֹ֤ר יֹאמַר֙ הָ/עֶ֔בֶד אָהַ֨בְתִּי֙ אֶת אֲדֹנִ֔/י אֶת אִשְׁתִּ֖/י וְ/אֶת בָּנָ֑/י לֹ֥א אֵצֵ֖א חָפְשִֽׁי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the slave plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: zh_hans
  text: 但奴仆若明确地说[a]：‘我爱我的主人、我的妻子和我的儿女[b]，我不会作为自由人离去。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“坚决地说”“郑重声明”。希伯来语把同一词根的绝对不定式与限定动词连用，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: 或译：“儿子”；希伯来语为阳性复数，在这里也可能泛指儿女。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但……若
  rationale: 承接上文有关获释的规定，并引出与通常情形相对的条件，现代汉语用“但……若”自然体现转折与条件。
- source_word: אָמֹר יֹאמַר
  choice: 明确地说
  rationale: 希伯来语以绝对不定式配合同根限定动词，强化这一声明；“明确地说”既传达郑重、清楚的表态，也符合现代法律叙事语境。
- source_word: הָעֶבֶד
  choice: 奴仆
  rationale: 本段涉及受约束服役者及其获释，身份的受辖制性质不可淡化；“奴仆”在现代中文圣经语体中庄重可懂，也比单用“仆人”更能体现其非自由身份。
- source_word: אָהַבְתִּי
  choice: 我爱
  rationale: 完成式在此表达已经确立且当前持续的爱与依恋，中文现在时“我爱”最自然。
- source_word: אֲדֹנִי
  choice: 我的主人
  rationale: 在家庭及服役法律语境中，“主人”准确体现权属和权威关系，又避免“主”在中文里可能产生的神学联想。
- source_word: אִשְׁתִּי
  choice: 我的妻子
  rationale: 直接保留原文的亲属称谓和第一人称领属关系。
- source_word: בָּנָי
  choice: 我的儿女
  rationale: 该词形态上是阳性复数“儿子们”，但在家庭语境中可泛指后代；“儿女”自然表达子女整体，同时以脚注保留较窄的字面可能。
- source_word: לֹא אֵצֵא
  choice: 我不愿……离去
  rationale: 原文直陈“我不出去”；结合奴仆主动拒绝获释的郑重声明，“不愿”自然传达其意志，“离去”保留脱离主人家及服役关系的含义。
- source_word: חָפְשִׁי
  choice: 自由
  rationale: 作述语性状态词，说明离去时成为自由人的身份；与“离去”搭配为“自由离去”，简洁而清楚。
theological_decisions:
- issue: 以中文表达以色列服役律例中的 עבד
  choice: 奴仆
  alternative: 仆人；奴隶
  rationale: 上下文的核心是受约束服役及获得自由，因此不能把身份弱化为普通雇佣仆役。“奴仆”能表明其非自由地位，同时避免现代“奴隶”一词可能自动带入其他历史制度的全部特征。
- issue: לֹא אֵצֵא 是否明说意愿
  choice: 我不愿自由离去
  alternative: 我不自由离去；我不要自由出去
  rationale: 语法形式是直接否定“我将不出去”，但在引语及法律情境中是奴仆郑重拒绝获释。“不愿”在中文中清楚呈现该话语行为，而不增添特定教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。保留条件句、直接引语及原文强调结构的功能；避免过度古雅的“吾”“必不出去”，也不以解释性措辞消除“儿子／儿女”的词义范围。
