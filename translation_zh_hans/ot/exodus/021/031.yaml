  text: אוֹ בֵ֥ן יִגָּ֖ח אוֹ בַ֣ת יִגָּ֑ח כַּ/מִּשְׁפָּ֥ט הַ/זֶּ֖ה יֵעָ֥שֶׂה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/031.yaml
  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: zh_hans
  text: 牛若用角撞某人的儿子或女儿，也要照这项规定[b]处置牛的主人。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也就是说，如果牛用角撞的是某人的儿子或女儿，上一节规定的同一项法律处罚仍然适用。
    reason: cross_reference
  - marker: b
    text: “规定”也可译作“规则”、“条例”或“法律裁断”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: 若……或……
  rationale: אוֹ通常表示“或”；本节承接上一条案例法，引出另一种情形。中文以“若”引出条件，并以“或”连接“儿子”和“女儿”，既自然又保留法律条文的结构。
- source_word: בֵן / בַת
  choice: 人的儿子 / 女儿
  rationale: 分别直译为“儿子”和“女儿”，保留希伯来文成对列举两性的表达；补出“人的”以免误解为牛的后代。
- source_word: יִגָּח
  choice: 用角撞
  rationale: נגח指动物以角抵撞。译作“用角撞”比泛称“撞”更准确，也避免在本节中自行补入原文未重复说明的死亡结果。
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: 照这项判例
  rationale: מִשְׁפָּט在此法律语境中指前文已经规定的裁断或案例法处理方式。“判例”能自然地指回上一节，同时保留“规则、条例”等可能含义于脚注。
- source_word: יֵעָשֶׂה לּוֹ
  choice: 处置牛主
  rationale: 希伯来文直译为“要对他这样做”，其中“他”按上下文指牛主。中文明确译出“牛主”，避免代词指向牛或被撞者的歧义；“处置”表达被动法律措施，而不额外指定其细节。
theological_decisions:
- issue: 本节是否明确说儿子或女儿被撞死
  choice: 不在正文补出“死”
  alternative: 译作“撞死人的儿子或女儿”
  rationale: 本节自身只重复“用角撞”，死亡及处罚情境由上一节提供。正文保留这种依赖上下文的表达，并以脚注说明同一处罚适用。
- issue: לּוֹ所指对象
  choice: 明确译作“牛主”
  alternative: 直译作“他”
  rationale: 上下文表明法律处置施于牛主；明确所指是为消除现代中文中的代词歧义，并未改变法律主体。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述。“用角撞”准确体现动作；“这项判例”承接上一节；“牛主”明确原文代词在上下文中的所指。
