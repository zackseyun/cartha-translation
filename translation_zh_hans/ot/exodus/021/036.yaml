  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: zh_hans
  text: 或者，如果已经知道这头牛向来惯于抵撞[a]，它的主人却没有把它看管好，他就必须以牛赔牛；死掉的牛归他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从昨天、前天以来”，指这头牛先前就曾表现出这种习性。
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ
  choice: 或者，若
  rationale: אוֹ承接上一节，引出另一种法律情形；汉语用“或者，若”同时表达选择关系和条件结构。
- source_word: נוֹדַע כִּי
  choice: 若已知
  rationale: נוֹדַע是被动/非人称表达，כִּי引出所知内容；“若已知”保留法律判断中的已知事实，并使中文句式自然。
- source_word: שׁוֹר
  choice: 牛
  rationale: שׁוֹר在此泛指涉案的牛；现代汉语法律叙述用“牛”最自然，避免把性别或用途限定为原文未必明确的“公牛”或“阉牛”。
- source_word: נַגָּח
  choice: 好顶人
  rationale: 该形容词表示具有反复顶撞倾向；“好顶人”简洁表达习性和危险倾向，其中“人”依上下文补明行为对象，但不排除顶其他牛。
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: 向来
  rationale: 原文直译为“从昨天、前天以来”，是表示先前一贯情形的习语；正文采用自然中文“向来”，脚注保留原文意象。
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: 却没有把它看管好
  rationale: שמר在此指主人未尽约束、看守危险牲畜的责任；“看管好”兼顾看守与防止其伤害他者。
- source_word: בְּעָלָיו
  choice: 它的主人
  rationale: 指牛的法律所有人；“主人”在牲畜语境中自然清楚。
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: 就必须……赔
  rationale: 不定式绝对形与未完成式连用加强赔偿义务；“必须”传达强制和强调语气。
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: 以牛赔牛
  rationale: תַּחַת表示替代或补偿；“以牛赔牛”保留简洁的法律公式。
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: 死牛要归他
  rationale: הַמֵּת字面为“死的”，语境所指为死去的牛；“归他”保留代词指向在原文中可能需要依上下文判定的特点。
