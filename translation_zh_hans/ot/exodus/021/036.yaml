  naturalness: 整体为自然、庄重的现代汉语法律叙述。“惯于抵撞”比“好顶人”更准确，也能自然地不明示受害对象。
  terminology: “以牛赔牛”准确保留替代性赔偿公式；“死掉的牛归他”清楚对应“死的（牛）必归他”，且不额外引入“尸体”等较强解释性用词。
