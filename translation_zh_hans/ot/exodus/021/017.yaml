  text: וּ/מְקַלֵּ֥ל אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: zh_hans
  text: “凡咒骂父亲或母亲的，必被处死[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“和母亲”；这里的法律表述是分指的，意思是咒骂父母任何一方。
    reason: 说明连接词的字面形式与其在本法律条文中的分指含义。
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: 凡咒骂……的
  rationale: מְקַלֵּל是作名词用的分词，在法律条文中泛指实施此行为的人。“凡……的”自然传达这种通则性质；“咒骂”既保留以言语施加咒诅的含义，也符合现代汉语表达。
- source_word: אָבִיו
  choice: 父亲
  rationale: 原文是“他的父亲”。汉语在“凡……的”这一泛指法律句式中通常省略领属代词，不会造成所指不明。
- source_word: וְאִמּוֹ
  choice: 或母亲
  rationale: 连接词וְ字面为“和”，但此处法律效力是分指父母任何一方；译作“或”能在现代汉语中准确表达这一范围。
- source_word: מוֹת יוּמָת
  choice: 必被处死
  rationale: 不定式绝对形与同根限定动词连用，强化被动处死的判决。“必被处死”兼顾强调语气、被动意义和司法性质。
theological_decisions:
- issue: 父母并列结构的法律效力
  choice: 译为“父亲或母亲”，表示咒骂任何一方都适用此刑罚。
  alternative: 较为形式对应地译作“父亲和母亲”。
  rationale: 原文虽使用连接词וְ，但在此案例法句式中是分指父母双方各自受保护；“或”避免误解为只有同时咒骂父母二人才构成罪行。
- issue: 死刑公式的表达
  choice: 译为“必被处死”，表达司法判决及原文的强调语气。
  alternative: 译为“必要死”或“必须死”。
  rationale: 原文的使役被动形式指向被执行死刑，而不只是死亡这一结果；“必被处死”更准确地保留法律性质。
translation_notes:
  register: 采用简洁、庄重的现代法律语体。“凡……的，必……”清楚呈现案例法结构；避免古奥措辞，同时保留刑罚条文的严肃性。
