translation:
  language: zh_hans
  text: 以烧伤还烧伤，以伤口还伤口，以瘀伤还瘀伤[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “瘀伤”或译“鞭痕”；原词可指击打留下的伤痕。
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: 烧伤
  rationale: 该词指烧伤或烧灼留下的伤痕。“烧伤”在现代汉语中准确、简洁，也与本节逐项对应的法律句式相称。
- source_word: תַּחַת
  choice: 还
  rationale: 在此法律语境中表示相应的补偿或对等处置。“还”使中文保持“某伤还某伤”的凝练节奏，同时不额外判定这公式必须如何执行。
- source_word: פֶּצַע
  choice: 创伤
  rationale: 该词泛指身体所受的伤口。“创伤”保留具体的身体伤害含义，又不把伤势局限为割伤。
- source_word: חַבּוּרָה
  choice: 瘀伤
  rationale: 该词可指击打造成的青肿、伤痕或鞭痕。“瘀伤”是清楚自然的现代医学与日常用语，也与前两项伤害名称平行。
theological_decisions:
- issue: 对等伤害公式的执行性质
  choice: 采用简洁的“某伤还某伤”表述
  alternative: 明确译作“以某伤赔偿某伤”或“使其受同样的某伤”
  rationale: 原文只给出以 תַּחַת 连接的对等公式，并未在本节说明应以金钱赔偿还是以同样身体伤害执行；译文保留这一法律与神学上的张力，不替原文作出裁定。
translation_notes:
  register: 采用简洁、庄重而易懂的现代标准汉语，并保留希伯来文三项平行的法律节奏。脚注标记置于其实际对应的“瘀伤”之后。
