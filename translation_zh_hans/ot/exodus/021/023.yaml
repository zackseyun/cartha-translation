  text: וְ/אִם אָס֖וֹן יִהְיֶ֑ה וְ/נָתַתָּ֥ה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
translation:
  language: zh_hans
  text: 但若有伤害[a]，你就要以命偿命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“重伤”或“死亡”。希伯来语这个词可指严重伤害或灾祸；这里究竟泛指伤害，还是特指死亡，解释不一。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 但若
  rationale: 承接上一节并形成条件性转折；“但若”既体现语境中的对比，也符合现代汉语法律表述。
- source_word: אָסוֹן
  choice: 伤害
  rationale: 该词可指严重伤害、灾祸，语境中也可能涉及死亡；“伤害”保留较宽泛的词义，不在正文中预先裁定伤害程度或对象。
- source_word: יִהְיֶה
  choice: 有
  rationale: 以“若有伤害”自然表达希伯来语存在句“若伤害发生”。
- source_word: וְנָתַתָּה
  choice: 你就要……偿
  rationale: 原义为“你要给”；在司法报偿公式中，“偿”比直译“给”更自然，又不将刑罚误解为金钱赔付。
- source_word: נֶפֶשׁ
  choice: 命
  rationale: 在 נֶפֶשׁ תַּחַת נָפֶשׁ 的法律公式中指生命；汉语“命”准确、简洁，并保留公式的力度。
- source_word: תַּחַת
  choice: 以……偿……
  rationale: 此处表示替代或对应报偿；“以命偿命”自然体现“生命代替生命”的法律对等关系。
- source_word: נָפֶשׁ
  choice: 命
  rationale: 重复相同译词，以保留原文的词语对应和法律句式的对称。
theological_decisions:
- issue: 本条律法中 אָסוֹן 所指伤害的范围
  choice: 正文宽泛译作“伤害”，不明确限定受害对象，也不规定一定是致命后果。
  alternative: 译作“重伤”或“死亡”。
  rationale: 本节本身仅笼统说明 אָסוֹן 发生后的法律后果，并未明说伤害对象或严重程度。宽泛翻译可保留上下文中真实存在的解释张力，避免把有争议的理解写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“以命偿命”保留原文简短、对称的报偿公式；脚注说明关键词的语义范围，不在正文中消解歧义。
