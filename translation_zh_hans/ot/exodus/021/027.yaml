base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male slave or the tooth of his female slave[a], he shall let him go free in compensation for his tooth.
translation:
  language: zh_hans
  text: 若有人打掉自己男奴或女奴的一颗牙，就必须因那颗牙释放那奴隶，使其获得自由。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文后半句“释放他”和“他的牙”使用阳性单数后缀；但前半句明确并列男奴和女奴。中文以“那奴隶”和“使其”概括，表明这项法律后果适用于两者。
    reason: 说明原文阳性单数语法形式，以及中文不标性别表达在此法律条文中的处理。
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接前一条法律案例并引出条件；现代汉语法律表述用“如果”自然清楚，无须机械译出连接词 וְ。
- source_word: שֵׁן
  choice: 一颗牙
  rationale: 保留希伯来文单数，并以现代汉语常用量词表达。
- source_word: עַבְדּוֹ
  choice: 自己的男奴
  rationale: עבד 在此奴隶法规中指处于奴役身份的人；译作“男奴”既呈现其法律社会身份，也与后面的阴性名词形成对应。
- source_word: אֲמָתוֹ
  choice: 女奴
  rationale: 这是 עבד 的阴性对应词；“女奴”准确保留原文明确的性别区分。
- source_word: יַפִּיל
  choice: 打掉
  rationale: נפל 的使役式在此意为使牙脱落；“打掉”符合伤害情境，也是自然的现代汉语。
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: 让那奴隶自由离去
  rationale: 该短语表示解除奴役、使之以自由人的身份离开；“自由离去”保留 חָפְשִׁי 的自由含义。用“那奴隶”避免汉语性别代词把后果限制于男奴。
- source_word: תַּחַת שִׁנּוֹ
  choice: 作为那颗牙的补偿
  rationale: תחת 在本条法律中表达因所受伤害而给予的补偿；此译明确呈现法律上的对应关系。
theological_decisions:
- issue: 奴隶身份术语的译法
  choice: 男奴／女奴
  alternative: 男仆／婢女
  rationale: 本节属于涉及奴隶受伤及获释的法律规定，身份关系具有法律实质；“奴”比容易弱化该现实的“仆”更准确，同时不对制度作超出原文的辩护或评断。
- issue: 获释对象的性别范围
  choice: 以“那奴隶”表达适用于男奴或女奴
  alternative: 按阳性单数后缀译作“让他自由离去”
  rationale: 希伯来文 יְשַׁלְּחֶנּוּ 和 שִׁנּוֹ 使用阳性单数形式，但前件明确列出男奴与女奴。中文采用不标性别的名词，保留法律规则适用于两者的自然理解，同时以脚注说明原文语法形式。
translation_notes:
  register: 采用简明、庄重的现代法律叙述语体。“自己”明确物主关系；“那奴隶”避免重复“男奴或女奴”，也不以汉语性别代词替原文消除或扩大语法上的张力。脚注标记置于正文句末。
