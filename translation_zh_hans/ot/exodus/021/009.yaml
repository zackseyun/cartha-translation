base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/009.yaml
  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: zh_hans
  text: 如果他把她指定给自己的儿子，就要按女儿所享有的权利对待她[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“照女儿的规矩”。希伯来语可指既定的法律规范，也可指惯常的做法。
    reason: 保留 מִשְׁפָּט 在法律权利与通行惯例之间的词义幅度。
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接前文的案例律条文，引出另一种条件情形；现代汉语中用“如果”自然清楚，无须强加转折语气。
- source_word: לִבְנוֹ
  choice: 给自己的儿子
  rationale: 介词 ל 在这里表示婚姻安排所指向的对象；“给自己的儿子”既贴近原文，也符合汉语表达。
- source_word: יִיעָדֶנָּה
  choice: 把她指定
  rationale: יעד 在本语境中指将女子指定为婚姻对象。“指定”保留法律和安排层面的含义，同时不把原文明确化为较窄的“订婚”。
- source_word: כְּמִשְׁפַּט הַבָּנוֹת
  choice: 按女儿应得的待遇
  rationale: מִשְׁפָּט 可指规定、法定权益或惯常准则；此译法突出她应得的身份与保障，又以脚注保留“规矩／惯例”的可能含义。
- source_word: יַעֲשֶׂה לָּהּ
  choice: 待她
  rationale: עשה ל 在此表示向某人采取相应做法；结合前面的待遇标准，译作“待她”简洁自然。
theological_decisions:
- issue: 被指定给儿子的女子应获得何种保障
  choice: 译文表达她应按女儿所当得的待遇受到对待，体现该条款的法律保护作用。
  alternative: 理解为较狭义的、为女儿安排婚事时所遵循的惯例。
  rationale: כְּמִשְׁפַּט הַבָּנוֹת 兼有法律规范与既定惯例的语义空间；正文呈现应得待遇，脚注保留习俗性理解，不把经文扩展为后来的特定制度或教义。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“指定”保留原文的正式性，“应得的待遇”以自然汉语表达其规范和保障意味；脚注标记置于所解释的短语之后。
