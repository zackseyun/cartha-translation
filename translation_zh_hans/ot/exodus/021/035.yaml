base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: zh_hans
  text: 如果一个人的牛撞了他邻居的牛[a]，那头牛死了，双方就要卖掉活牛，平分卖牛所得的钱[b]，也要平分那头死牛[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撞”也可译作“顶”；希伯来语动词表示猛烈撞击，在这里可指牛用角顶撞。
    reason: lexical_alternative
  - marker: b
    text: 直译为“平分它的钱（银子）”，这里指卖掉活牛所得的钱。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“那死的”，上下文所指是那头死牛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 这是典型的个案法条件句；现代汉语用“如果”自然表达其条件性质。句首的希伯来语连接词不必机械译作“并且”。
- source_word: יִגֹּף
  choice: 撞
  rationale: 该动词表示猛烈撞击，也可特指牛用角顶；“撞”既自然，又保留原词未明确限定撞击方式的宽度。
- source_word: שׁוֹר אִישׁ אֶת שׁוֹר רֵעֵהוּ
  choice: 一个人的牛撞了另一个人的牛
  rationale: 清楚保留双方各自拥有一头牛的法律关系。“另一个人”在现代汉语中比“邻舍”更自然，也符合 רֵעַ 在此表示同伴、他人的语境。
- source_word: וָמֵת
  choice: 那牛死了
  rationale: 按上下文，“死”的是被撞的牛；补出“那牛”可消除汉语中的主语歧义，又不增加实质信息。
- source_word: וּמָכְרוּ אֶת הַשּׁוֹר הַחַי
  choice: 他们就要卖掉活牛
  rationale: “就要”自然呈现条件成立后的法定处置；“活牛”简洁指仍存活的那头牛。
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: 平分卖牛所得的钱
  rationale: כַּסְפּוֹ 字面是“它的钱/银子”，语境所指是出售活牛所得；此译法在现代汉语中明确自然。“平分”准确表达分成两份。
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: 也要平分那头死牛
  rationale: 保留“也”和同样平分的结构，并以“死牛”明确希伯来文省略名词的“死的那一个”是指牛；不擅自改译为“牛尸的价值”。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语法律叙述。用“另一个人”避免“邻舍”可能带来的古旧或宗教化色彩；用“就要”表达个案法的规定结果，而不强化为直接命令。
