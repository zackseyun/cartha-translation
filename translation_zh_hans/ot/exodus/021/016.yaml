base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: zh_hans
  text: “凡掳走一人，无论把他卖掉，还是被发现那人仍在他手中，都必被处死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹנֵב
  choice: 拐走
  rationale: 该词本义是“偷窃”，但宾语是人，且下文提到将其卖掉或控制在手中，语境明确指掳人、拐卖人口。“拐走”既自然，也保留非法夺走人的含义。
- source_word: אִישׁ
  choice: 一个人
  rationale: אִישׁ为阳性单数，在这里指被拐走的人。现代汉语“一个人”无须标明性别，且没有扩大或缩小希伯来语法律条文的适用范围。
- source_word: וּמְכָרוֹ
  choice: 并把他卖掉
  rationale: מכר意为“卖”，第三人称阳性单数后缀指前述被拐走的人；“把他卖掉”清楚、自然地表达这一宾语关系。
- source_word: וְנִמְצָא בְיָדוֹ
  choice: 或那人仍在他手中被发现
  rationale: נמצא是“被发现”，בידו直译为“在他手中”，可指处于其占有或控制之下。“仍在他手中”保留原文意象，同时让现代读者明白是尚受其控制。连接词译为“或”，表达卖掉与仍被控制这两种案件情形。
- source_word: מֹות יוּמָת
  choice: 必被处死
  rationale: 不定词绝对式与限定动词连用，强化死刑判决。被动式“被处死”准确表达司法处罚，“必”传达其强调语气。
theological_decisions:
- issue: 本条律例所指罪行的范围
  choice: 本节禁止拐走人口；无论受害者已经被卖掉，还是仍处于拐人者控制之下，罪犯都须被处死。
  alternative: 也可把第二个连接词按顺承关系理解为“并且那人在他手中被发现”，视作附加情形，而不是与“卖掉”并列的另一种情况。
  rationale: 希伯来语连接词可依语境表示“和”或“或”。在这条判例法中，将其译为“或”能清楚呈现两种情形，同时以脚注说明原文连接关系所容许的另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“拐走”比单用“偷”更清楚地表达人口掳掠；“必被处死”简洁保留原文强化的司法判决语气。主文保留“在他手中”的原文意象，并用脚注解释其习语意义及连接词的歧义。
