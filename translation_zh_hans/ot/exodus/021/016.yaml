- from: “拐走一个人，并把他卖掉[a]，或那人仍在他手中被发现[b]的，必被处死。”
  to: “凡掳走一人，无论把他卖掉，还是被发现那人仍在他手中，都必被处死。”
  rationale: 修订使“掳走一人”明确统摄“卖掉”与“仍在他手中”这两种法律情形，消除原译条件结构和代词指向的歧义；同时保留“或”的判例性理解，并在脚注中保留原文连接词可作顺承理解的可能。
