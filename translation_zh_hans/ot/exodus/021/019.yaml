source:
  edition: WLC
  text: אִם יָק֞וּם וְ/הִתְהַלֵּ֥ךְ בַּ/ח֛וּץ עַל מִשְׁעַנְתּ֖/וֹ וְ/נִקָּ֣ה הַ/מַּכֶּ֑ה רַ֥ק שִׁבְתּ֛/וֹ יִתֵּ֖ן וְ/רַפֹּ֥א יְרַפֵּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: zh_hans
  text: 如果他能够起来，拄着杖[a]在外面行走，打他的人就不受惩罚；不过，他必须赔偿伤者的误工损失[b]，并负责使伤者得到彻底医治[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“靠着他的杖”。希伯来语直译为“在他的杖上”，表示他已经能够借助支撑行走。
    reason: lexical_alternative
  - marker: b
    text: “误工损失”指伤者因暂时失去劳动能力而耽误工作所造成的损失。
    reason: cultural_note
  - marker: c
    text: 希伯来语采用加强语气，直译近似“医治，他一定要医治”，强调打人者必须确保伤者得到充分医治，可能包括承担医治费用。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: 如果他能够起来
  rationale: קום在此指伤者恢复到足以起身的程度；加入“能够”自然表达其恢复状况，而非单纯改变姿势。
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: 在外面行走
  rationale: התהלך表示来回或持续走动；“在外面行走”体现伤者已能离开卧床状态并公开活动。
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: 拄着杖
  rationale: 希伯来语直译为“在他的杖上”，语境表明伤者借杖支撑行走；“拄着杖”是现代汉语的自然表达。
- source_word: וְנִקָּה הַמַּכֶּה
  choice: 打他的人就不受惩罚
  rationale: נקה的尼斐尔式在此具有法律含义，指免于前文所涉及的惩罚，但不免除本节随后规定的赔偿和医治责任。
- source_word: רַק
  choice: 不过
  rationale: 该限制词引出打人者仍须承担的责任；“不过”在汉语中自然呈现免受惩罚与仍须赔偿之间的限制关系。
- source_word: שִׁבְתּוֹ יִתֵּן
  choice: 必须赔偿伤者的误工损失
  rationale: שבתו字面与“停下、闲坐”有关，在伤害赔偿语境中指伤者因失去劳动能力而耽误的时间；נתן在此是支付赔偿。
- source_word: וְרַפֹּא יְרַפֵּא
  choice: 并负责使伤者得到彻底医治
  rationale: 不定式绝对形与限定动词连用，强化医治义务。“负责使……得到彻底医治”既保留强调语气，也避免暗示打人者必须亲自行医。
theological_decisions:
- issue: “不受惩罚”与后续赔偿责任的关系
  choice: 将其理解为免受前述刑罚，但仍须赔偿误工并承担医治责任
  alternative: 译作“算为无罪”，可能被理解为完全没有任何过错或责任
  rationale: 本节本身立即保留两项法律义务，因此נקה不能在此理解为免除一切责任。
translation_notes:
  register: 采用现代、庄重而易懂的法律表述。“打他的人”承接前文个案；后半句重复“伤者”，避免连续代词在汉语中产生指代不清。各脚注紧随相关词语，分别说明借杖行走、误工赔偿和加强式医治义务。
