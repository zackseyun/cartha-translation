  terminology: “不受惩罚”在紧邻后文赔偿与医治义务的语境中，不会合理地理解为免除一切责任，且忠实反映נקה在此免于刑罚的法律意义。脚注对“杖”“误工损失”和强化式“医治”均说明充分，未把可能承担医疗费用的解释说成唯一含义。
