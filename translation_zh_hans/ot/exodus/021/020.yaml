source:
  edition: WLC
  text: וְ/כִֽי יַכֶּה֩ אִ֨ישׁ אֶת עַבְדּ֜/וֹ א֤וֹ אֶת אֲמָת/וֹ֙ בַּ/שֵּׁ֔בֶט וּ/מֵ֖ת תַּ֣חַת יָד֑/וֹ נָקֹ֖ם יִנָּקֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male slave or his female slave with a rod[a], and the slave dies under his hand, he must surely be avenged.
translation:
  language: zh_hans
  text: 如果有人用棍子打自己的男奴或女奴，奴隶死在他手下，就必须为奴隶报仇[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“就必须惩罚那人。”希伯来文更直译为“必须为他报仇”，是一种带强调语气的法律表达。
    reason: 说明词义替代译法及原文强调结构。
lexical_decisions:
- source_word: וְ/כִֽי
  choice: 如果
  rationale: 在连续的判例法条文中引出条件句；现代汉语用“如果”自然表达，前置连接词不必机械译出。
- source_word: יַכֶּה
  choice: 打
  rationale: נכה泛指击打；“打”自然、准确，具体工具由后面的“用棍子”说明。
- source_word: אִישׁ
  choice: 有人
  rationale: 此处是判例法中的不定主体。汉语“有人”既保留泛指功能，也不额外改变随后以“他”指称的男性语法形式。
- source_word: עַבְדּוֹ
  choice: 自己的男奴
  rationale: עבד在此法律语境中指奴隶身份，而非一般雇佣服务；“男奴”与下文“女奴”形成明确对举。
- source_word: אֲמָתוֹ
  choice: 女奴
  rationale: אָמָה指女性奴隶；“女奴”简明、现代，并与“男奴”平行。
- source_word: בַּשֵּׁבֶט
  choice: 用棍子
  rationale: שבט可指杖、棍或权杖；在击打工具的语境中，“棍子”最自然。
- source_word: וּמֵת
  choice: 奴隶死
  rationale: 原文为阳性单数“他死”，但前面同时列出男奴和女奴；明说“奴隶”可消除汉语代词歧义而不限定性别。
- source_word: תַּחַת יָדוֹ
  choice: 死在他手下
  rationale: 保留“在他手下”的希伯来语意象和直接施打所致的法律语境，避免过度解释为某种具体死亡时限。
- source_word: נָקֹם יִנָּקֵם
  choice: 就必须为奴隶报仇
  rationale: 不定式绝对形与限定动词连用，强调报仇行动的确定性和强制性；“必须”传达此法律公式的强调语气。
theological_decisions:
- issue: נָקֹם יִנָּקֵם所规定的法律后果性质
  choice: 译作“就必须为奴隶报仇”，不在正文中指明具体刑罚
  alternative: 就必须惩罚那人
  rationale: 希伯来文强调必须实施报仇或追讨，却未在本节明确规定具体司法方式。正文保留“报仇”的词义及其法律严肃性，避免擅自将其限定为某一种刑罚。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“男奴／女奴”坦率呈现原文所述奴隶身份；末句以“为奴隶报仇”明确受报偿者，避免汉语中主语和代词含混。
