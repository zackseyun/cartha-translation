  source_fidelity: 正文准确对应条件式律例。"有人"自然呈现אִישׁ在法律语境中的泛指；"自己的男奴或女奴"保留两种奴隶身份的对举；"用棍子打"准确反映击打及其工具；"奴隶死在他手下"在不武断限定死亡时间或司法细节的情况下，恰当表达וּמֵת תַּחַת יָדוֹ。末句"就必须为奴隶报仇"传达נָקֹם יִנָּקֵם的被动、强调性法律后果，且未擅自说明具体处罚。
