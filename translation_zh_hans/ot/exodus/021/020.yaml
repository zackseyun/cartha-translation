  terminology: “男奴／女奴”准确且平行地呈现עבד／אמה在此处的奴隶身份；“棍子”“手下”“报仇”均与上下文法律语境相称。脚注正确说明“惩罚那人”为可行但较解释性的替代，并保留原文“报仇”的强调结构。
