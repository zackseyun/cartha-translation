  text: וַ/אֲשֶׁר֙ לֹ֣א צָדָ֔ה וְ/הָ/אֱלֹהִ֖ים אִנָּ֣ה לְ/יָד֑/וֹ וְ/שַׂמְתִּ֤י לְ/ךָ֙ מָק֔וֹם אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: zh_hans
  text: 但若他并非蓄意埋伏杀人，上帝却使那人落在他手中[a]，我就为你指定一个地方，让他可以逃到那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近于“上帝使这事临到他手中”。这种说法表明，他并非预谋杀人，但事情仍经他之手发生，并处于上帝的护理之下。
    reason: 说明“使……临到他手中”这一希伯来语惯用表达，并保留非预谋行为与上帝护理之间的张力。
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: 但若
  rationale: 承接上一节并引出相对的条件情形；现代汉语用“但若”能自然表达这种对比与条件关系。
- source_word: לֹא צָדָה
  choice: 不是蓄意埋伏杀人
  rationale: צדה在本法律语境中不是通常意义的“打猎”，而是指伺机下手、预谋杀人；此译同时传达埋伏和非预谋的法律对比。
- source_word: וְהָאֱלֹהִים
  choice: 而是上帝
  rationale: 这里的אֱלֹהִים最自然地指上帝；下文描述非预谋事件处于上帝护理之下，不宜译作“审判官”。
- source_word: אִנָּה לְיָדוֹ
  choice: 使那人落在他手中
  rationale: 保留希伯来语“使……临到/落在他手中”的惯用表达，既呈现上帝的作用，也保留行为经由杀人者之手发生的张力。
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: 我就为你指定一个地方
  rationale: “指定”符合设立合法逃避处所的行政、法律语境；“为你”保留单数第二人称לְךָ。
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: 让他可以逃到那里
  rationale: יָנוּס表示为避难而逃；“可以”表达所获准的法律途径，שָׁמָּה的方向义由“到那里”体现。
theological_decisions:
- issue: 意外致死中的上帝作用
  choice: 上帝使那人落在他手中
  alternative: 事情偶然经他的手发生；审判官把那人交在他手中
  rationale: 原文明确以אֱלֹהִים为主语，并用使役意味描述事件发生。译文不把这种张力淡化为纯粹偶然，也不由此推断上帝负有谋杀的道德罪责；同时，“审判官”不合本句语境。
- issue: 行为人的主观意图
  choice: 不是蓄意埋伏杀人
  alternative: 没有打猎；没有意图
  rationale: 本节与上一节预谋杀人的案件形成对比。译文明确法律语境中的非预谋性质，但不把后续关于责任与避难的规定提前解释进本句。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙事语体。“蓄意埋伏杀人”补足汉语中所需的语境信息；“落在他手中”保留原文意象。脚注标记[a]已置于对应主句中。
