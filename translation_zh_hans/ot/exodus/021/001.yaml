base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/001.yaml
  text: These are the judgments that you shall set before them:[a]
translation:
  language: zh_hans
  text: 以下是你要摆在他们面前的典章：[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“判例”“法令”或“律例”。希伯来语这个词指司法裁断或案例性质的法律条文。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: 以下是
  rationale: וְ连接上下文，אֵלֶּה指向即将列出的内容。现代汉语以“以下是”自然表达承接和引出条文的功能，不另加时间性的“现在”。
- source_word: הַ/מִּשְׁפָּטִים
  choice: 典章
  rationale: מִשְׁפָּטִים在此指具有司法裁断和案例法性质的法律条文。“典章”庄重而通顺，并比泛称“律法”更能保留其法律裁决的语义；脚注列出其他可行译法。
- source_word: אֲשֶׁר
  choice: （由“以下是你要……”的句式体现）
  rationale: 希伯来语关系词引出摩西要陈明的内容；汉语通过前置“你要摆在他们面前”自然整合关系从句，无须机械译出。
- source_word: תָּשִׂים
  choice: 要摆
  rationale: שׂוּם意为放置、摆在；与“在他们面前”搭配，既保留原文意象，也传达奉命陈明的语气。
- source_word: לִ/פְנֵי/הֶם
  choice: 在他们面前
  rationale: לִפְנֵי表示在某人面前或当着某人；此处指把这些条文陈明给以色列人。“在他们面前”保留原文表达，并符合汉语习惯。
theological_decisions:
- issue: 盟约法律语境中 מִשְׁפָּטִים 的译法
  choice: 典章
  alternative: 判例；法令；律例
  rationale: 该词兼有司法裁断、案例法和成文规定的含义。“典章”适合本段法律文体，但不把词义收窄为单纯判决或泛化为一切律法；脚注保留词义范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“以下是”自然引出随后条文；“摆在他们面前”保留希伯来语的具体表达，并在语境中表示向百姓陈明。
