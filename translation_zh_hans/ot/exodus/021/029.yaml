  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: zh_hans
  text: 但如果这头牛向来有顶人的习性[a]，牛的主人也曾受过警告，却没有把它看管好，以致这头牛撞死了男人或女人，那么这头牛必须用石头打死，牛的主人也必须被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从昨天、前天以来”，是指这头牛先前就屡次顶人，其危险习性已经为人所知。
    reason: 解释希伯来语惯用语，并说明נַגָּח所表达的反复、惯常行为。
lexical_decisions:
- source_word: שׁוֹר
  choice: 牛
  rationale: 此处是以家养牛为对象的法律案例，并未着重说明性别；现代汉语用“牛”最自然，也避免无根据地限定为公牛或阉牛。
- source_word: נַגָּח
  choice: 有顶人的习性
  rationale: 该词描述牛反复顶人的已知习性，而不是一次偶发行为；这一译法兼顾分词的持续、惯常意味和现代汉语的清晰度。
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: 向来
  rationale: 原文直译为“从昨天、前天以来”，是表示先前已有一贯表现的希伯来语说法；正文译作“向来”较自然，字面形式及法律含义在脚注说明。
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: 牛主也曾受过警告
  rationale: 在此法律语境中，动词表示牛的危险习性已经有人作证告知或正式警告牛主；“受过警告”准确传达牛主事先知情的要点。
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: 却没有把牛看管好
  rationale: 动词基本义为看守、保管；上下文强调牛主没有妥善约束危险的牛。“看管好”自然表达这种法律责任，同时不把具体措施限定为圈禁。
- source_word: וְהֵמִית
  choice: 以致牛撞死了
  rationale: 原词表示使人死亡。结合牛顶人的上下文，“撞死”清楚表达致死结果；“以致”使案例法中的因果关系在汉语中顺畅。
- source_word: אִישׁ אֹו אִשָּׁה
  choice: 男人或女人
  rationale: 原文明列男性和女性受害者，译文保留这一明确区分，不概括为“人”。
- source_word: יִסָּקֵל
  choice: 必须用石头打死
  rationale: 该被动式规定以石刑处死这头牛；汉语若只说“用石头打”可能不够明确，因此译出死亡结果。
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: 牛主也必须处死
  rationale: יוּמָת是法律语境中的使役被动形式，表示被依法处以死刑，而非仅仅“也会死”；不增添原文未说明的执行方式。
theological_decisions:
- issue: 牛主所受刑罚的法律性质
  choice: 牛主也必须处死
  alternative: 牛主也必死
  rationale: 原文יוּמָת通常是司法处死的法律公式。“处死”保留其强制和司法性质，而“必死”可能被理解为自然死亡或结果陈述。
- issue: 受害者的性别表述
  choice: 男人或女人
  alternative: 任何人
  rationale: 原文明确并列אִישׁ与אִשָּׁה，译文照实保留男性和女性，不将其泛化。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“但如果……那么……”保留案例法的条件结构；用“必须”表达规定性的法律效力。正文避免生硬照译希伯来语惯用语，并以脚注保存其字面形态和法律含义。
