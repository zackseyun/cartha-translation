base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew slave[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: zh_hans
  text: 如果你买一个希伯来奴隶[a]，他要服役六年；到第七年，他要自由离去，无须付任何代价[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如果”也可译作“当……时”；希伯来语的条件词在案例法中可以有这两种理解。
    reason: lexical_alternative
  - marker: b
    text: 直译：“白白地”；也可译作“无偿地”或“不付任何代价”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 这里引出案例法的条件；现代汉语法律表述用“如果”自然清楚，也不把这种情形说成必然发生。
- source_word: תִקְנֶה
  choice: 买了
  rationale: קנה在此为购买或取得之意；上下文涉及被购买者的服役期限，“买了”直接保留商业法律语境。
- source_word: עֶבֶד
  choice: 奴隶
  rationale: 此人是被购买并负有强制服役义务的人；译作“奴隶”比“仆人”更准确地呈现其受奴役的法律身份，避免弱化原文。
- source_word: עִבְרִי
  choice: 希伯来
  rationale: 按原文保留特定称谓“希伯来”，不扩大解释为“以色列”。
- source_word: יַעֲבֹד
  choice: 服役
  rationale: עבד可指工作、服事；在规定奴隶劳动期限的法律语境中，“服役”既自然又能表达受约束的劳动。
- source_word: וּבַשְּׁבִעִת
  choice: 第七年
  rationale: “年”由前句“六年”承接，汉语中补出可使时间对比明确；分号已自然表达转折，无须硬译连接词。
- source_word: יֵצֵא לַחָפְשִׁי
  choice: 可以自由离去
  rationale: 保留“出去”进入自由状态的意象，同时用现代汉语自然表达依法解除奴役身份；“可以”表达获准离去，并非弱化法规效力。
- source_word: חִנָּם
  choice: 不必付赎金
  rationale: 该词基本义为“无代价、免费”；在奴隶获释语境中，所指是无需为自由支付赎价。“赎金”使法律含义清楚，脚注保留更直译的表达。
theological_decisions:
- issue: 法律语境中עֶבֶד的身份用语
  choice: 奴隶
  alternative: 仆人／奴仆
  rationale: 经文涉及一个被购买、须定期服役的人。采用“奴隶”透明呈现受奴役身份，不以较温和的“仆人”淡化原文所描述的制度。
- issue: חִנָּם是否明确为免付赎价
  choice: 不必付赎金
  alternative: 无偿／不付任何代价
  rationale: 上下文是奴隶离开并获得自由，最自然的法律含义是本人无需支付释放或赎身的价款；脚注保留字面范围，避免把词义本身过度限定。
translation_notes:
  register: 采用现代、庄重而清楚的法律叙述语体。“奴隶”准确呈现身份；“服役”避免重复而保留强制劳动含义。以分号突出六年服役与第七年获释的对比。所有脚注标记均已置于正文。
