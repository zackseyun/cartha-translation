  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: zh_hans
  text: “击打父亲或母亲的，必须被处死[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“击打他父亲和他母亲的”；这里译作“或”，表明击打父母任何一方都在本条法律范围内。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: 击打
  rationale: 该词是 נכה 的分词形式，指实施击打的人。“击打”在现代汉语中清楚、庄重，准确表达身体攻击行为，又不把程度夸大为“毒打”，也不限定为持械袭击。
- source_word: אָבִיו
  choice: 父亲
  rationale: 希伯来文明确指“他的父亲”。汉语法律条文式表达中可自然省略领属代词，不影响亲属关系。
- source_word: אִמּוֹ
  choice: 母亲
  rationale: 希伯来文明确另列“他的母亲”；译文分别保留父亲和母亲，维持原文的法律具体性。
- source_word: מוֹת יוּמָת
  choice: 必须处死
  rationale: 原文以绝对不定式配合同根限定动词，加强死刑判决的确定性；“必须处死”自然、庄重，并保留司法执行的被动含义，而不是仅说此人会死亡。
- source_word: וּ / וְ
  choice: 或
  rationale: 连词字面通常是“和”，但在本条个案法中，处罚适用于击打父母任何一方。译作“或”可避免中文“和”被误解为必须同时击打双亲。
theological_decisions:
- issue: 死刑法律公式的表达
  choice: 必须处死
  alternative: 必要把他处死／必定被处死
  rationale: 本节规定的是司法刑罚，不只是死亡结果。“必须处死”既表达命令和确定性，也保留由司法主体执行刑罚的含义，不额外引入任何宗派解释。
- issue: 父母之间连词的法律含义
  choice: 父亲或母亲
  alternative: 父亲和母亲
  rationale: 原文形式上使用通常译作“和”的连词，但法律适用范围包括击打父母任何一方。正文按现代汉语的法律逻辑译作“或”，脚注保留原文形式，以免消除原文与译文之间的差异。
translation_notes:
  register: 采用简洁、庄重的现代汉语法律条文语体。“击打”比“打”正式，又不夸大行为程度；“必须处死”比文言式“必要治死”更易懂，同时保持刑罚公式的严肃性。
