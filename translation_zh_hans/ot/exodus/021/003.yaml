base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/003.yaml
  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: zh_hans
  text: 他若独自[a]进来，也要独自出去；他若已有妻子[b]，他的妻子也要同他一起出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是一个惯用语，意思是独自一人、没有人陪同。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“是妻子的丈夫”，即已经有妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: 独自
  rationale: 该短语在这里是惯用语，指没有妻子陪同、独自一人；“独自”自然简洁，也保留两次出现所形成的法律条文对称。
- source_word: יָבֹא
  choice: 进来
  rationale: 与下文“出去”构成原文清楚的进出对举；在上下文中指进入服役状态。
- source_word: יֵצֵא
  choice: 出去
  rationale: 在本条释放奴仆的法规中指离开服役；译作“出去”保留与“进来”的形式对应。
- source_word: בַּעַל אִשָּׁה
  choice: 已有妻子
  rationale: 原文关系性表达直译为“妻子的丈夫”在现代汉语中生硬；“已有妻子”准确表示他进入服役时已婚，并为下句“他的妻子”提供自然衔接。
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: 他的妻子就可以同他一起出去
  rationale: 阴性单数动词以“他的妻子”为主语。“同他一起出去”保持法律语境和进出对举；“可以”表达此处法规所赋予的随同离开资格，避免现代汉语“要”被误解为妻子必须离开。
theological_decisions:
- issue: 妻子随同出去的措辞是否表示强制义务
  choice: 可以同他一起出去
  alternative: 要同他一起出去
  rationale: 希伯来语未使用独立的义务助动词，而是在条件法规中陈述结果。中文若连续译“要”，容易使人理解为妻子被强制离开；“可以”传达其不被扣留、得随丈夫离开的法律效果，同时不增添宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的法律条文语体。以“进来／出去”和两次“独自”保留希伯来文的平行结构；避免生硬直译“妻子的丈夫”。
