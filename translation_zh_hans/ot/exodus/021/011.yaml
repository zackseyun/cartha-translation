    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: 如果
  rationale: 承接上一条律例并引出条件；现代汉语中无需另译连接词 ו，也能自然表达连续的法律条款。
- source_word: שְׁלָשׁ אֵלֶּה
  choice: 这三项义务
  rationale: 指回上一节所列的食物、衣服和夫妻之分；补出“义务”符合语境，也比“这三件事”更清楚。
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: 不为她履行
  rationale: עשה 字面义宽泛，为“做、行”；此处涉及履行对女子的三项责任。“履行”自然呈现法律语境，但脚注保留较直译的可能。
- source_word: וְיָצְאָה
  choice: 她就可以……离去
  rationale: יצא 在奴仆律例中表示脱离受约束的身份；“离去”保留动作意象，“无偿”则说明释放条件。希伯来语未明示施事者，故不增添“让她”。
- source_word: חִנָּם
  choice: 无偿
  rationale: 此处表示释放不需代价；“无偿”简洁而具有法律语体。
- source_word: אֵין כָּסֶף
  choice: 不必付钱
  rationale: 强调女子离去不需要支付银钱或赎价；现代汉语“付钱”自然清楚，又不把原文限定为某一种具体款项。
