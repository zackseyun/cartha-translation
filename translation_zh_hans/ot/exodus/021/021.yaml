base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: zh_hans
  text: 但他若过了一两天还活着，就不可为他报仇[a]，因为他是主人的钱财[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “报仇”也可译作“追讨血债”或“施行报复”。希伯来文所指比一般的“处罚”更具体，带有法律追偿的意味。
    reason: lexical_alternative
  - marker: b
    text: 直译是“因为他是他的钱财”，表达这个奴仆对主人的经济价值；译文补出“主人”，以免代词所指不清。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: 但
  rationale: 在本案律例中引出对前述规定的限定或例外；“但”简洁自然，保留转折语气。
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: 一天或两天
  rationale: 直译这一时间表达，保留原文所说的短暂时段，而不扩大为笼统的“几天”。
- source_word: יַעֲמֹד
  choice: 还能活
  rationale: 该动词字面为“站立、存留”，此处按受击后的法律语境指仍然活着；不译作“康复”，以免加入完全恢复之意。
- source_word: לֹא יֻקַּם
  choice: 不可为他报仇
  rationale: נקם 的使役被动式表达不得为受害者施行报复或法律性追讨；“不可为他报仇”保留其报复性司法含义，较泛化的“不可处罚”更贴近原文。
- source_word: כַסְפּוֹ
  choice: 主人的钱财
  rationale: 原文直译为“他的钱/银子”。补明“主人”以消除现代汉语代词歧义，同时保留原文尖锐的经济性表述。
- source_word: הוּא
  choice: 他是
  rationale: 阳性单数代词回指受击的奴仆；以“他”保持人物指称，不将其非人格化为“它”。
theological_decisions:
- issue: 奴隶法规中的经济理由
  choice: 保留“他是主人的钱财”这一直接而尖锐的表述
  alternative: 因为他是主人的财产／因为损失由主人自己承担
  rationale: 原文明确以经济价值说明本条裁定。译文不替原文缓和伦理张力，也不把理由解释性改写为主人所受的损失。
- issue: יַעֲמֹד 所描述的状态
  choice: 译为“还能活”
  alternative: 仍然站立／康复
  rationale: 上下文关注受击者是否死亡；“还能活”传达存活，却不暗示他已经痊愈或能够站立。
- issue: לֹא יֻקַּם 的法律含义
  choice: 译为“不可为他报仇”
  alternative: 不可处罚主人／不可处死主人
  rationale: 原文使用“报仇、追讨血债”词根，未明说具体处罚方式；译文保留这种法律报复含义及其范围上的含混，不把它限定为一般处罚或死刑。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述。保留原文对奴仆经济价值的冷峻措辞，不作伦理缓和；同时用“还能活”避免生硬的字面译法“站立”。
