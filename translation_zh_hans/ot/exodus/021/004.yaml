  text: אִם אֲדֹנָי/ו֙ יִתֶּן ל֣/וֹ אִשָּׁ֔ה וְ/יָלְדָה ל֥/וֹ בָנִ֖ים א֣וֹ בָנ֑וֹת הָ/אִשָּׁ֣ה וִ/ילָדֶ֗י/הָ תִּהְיֶה֙ לַֽ/אדֹנֶ֔י/הָ וְ/ה֖וּא יֵצֵ֥א בְ/גַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: zh_hans
  text: 如果他的主人给他配了一个妻子，并且她给他生了儿子或女儿，那么妻子和她的孩子要归她的主人[a]；他则要独自离去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“妻子和她的孩子要属于她的主人。”
    reason: lexical_alternative
  - marker: b
    text: 意思是他要独自离开，不能带走主人在他服役期间给他的妻子和她所生的孩子。
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 保留判例法条文的条件句式，不把它改成表示必然发生的“当……时”或“既然”句式。
- source_word: אֲדֹנָיו / לַאדֹנֶיהָ
  choice: 他的主人／她的主人
  rationale: 在本段奴役制度的法律语境中，“主人”自然表达权柄与隶属关系，又避免“主”可能引起的神圣称谓联想。
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: 给他一个妻子
  rationale: אִשָּׁה 可指“女人”或“妻子”；下文说她为该男子生儿育女，表明这里所指的是由主人安排的婚姻关系。
- source_word: וְיָלְדָה לוֹ
  choice: 她给他生了
  rationale: 用现代汉语自然表达 ילד 加间接受词的生育含义，并保留孩子与该男子的亲子关系。
- source_word: בָנִים אוֹ בָנוֹת
  choice: 儿子或女儿
  rationale: 原文明确分别提到男性和女性后代，因此不概括译为“孩子”。
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: 妻子和她的孩子
  rationale: 与前文“妻子”保持一致，并准确保留“她的孩子”这一所有关系。
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: 都要归她的主人
  rationale: היה ל־ 在这里表达法律上的归属；“归……主人”既符合现代汉语，又不淡化原文中的隶属关系。
- source_word: וְהוּא יֵצֵא
  choice: 他则要离去
  rationale: יצא 的基本义是“出去、离去”；在本法律语境中指服役期满后的离开，但正文不额外加入原文没有明说的“获释”。
- source_word: בְגַפּוֹ
  choice: 独自
  rationale: 该习语表示无人陪同地离开，与妻子和孩子留下形成鲜明对比；“独自”是简洁自然的现代汉语表达。
theological_decisions:
- issue: 奴役法律语境中的称谓与归属关系
  choice: 采用“主人”和“归她的主人”，直陈经文所规定的权力及法律归属。
  alternative: 采用“雇主”“东家”或较弱的“留在主人那里”。
  rationale: 原文描述的是奴役或债役制度下的法律关系。译文不应以现代雇佣措辞淡化这种关系，也不在正文中加入超出原文的伦理评断。
- issue: 男子离去的性质
  choice: 译为“离去”，并在脚注说明他不能带走主人所给的妻子和她所生的孩子。
  alternative: 直接译为“被释放”或“恢复自由”。
  rationale: 上下文确实涉及服役期满后的离开，但 יצא 本身是“出去、离去”；较宽的译法保留原文措辞及其法律语境，不把隐含意义全部写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以“如果……那么……”呈现希伯来判例法的条件结构；用“则”突出男子离去与妻儿留下之间的对照。正文保持原文对奴役关系的直白表达，不以古奥词汇或现代雇佣术语加以美化。
