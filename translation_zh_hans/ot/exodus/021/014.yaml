  text: וְ/כִֽי יָזִ֥ד אִ֛ישׁ עַל רֵעֵ֖/הוּ לְ/הָרְג֣/וֹ בְ/עָרְמָ֑ה מֵ/עִ֣ם מִזְבְּחִ֔/י תִּקָּחֶ֖/נּוּ לָ/מֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: zh_hans
  text: 但如果有人蓄意加害自己的同伴[a]，用诡计[b]杀他，你要把他从我的祭坛旁边[c]带走，处死他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓄意加害”也可译作“狂妄地攻击”或“擅敢加害”；希伯来语强调这是故意而非意外的行为。
    reason: lexical_alternative
  - marker: b
    text: “用诡计”也可译作“狡诈地”或“以奸诈手段”。
    reason: lexical_alternative
  - marker: c
    text: 这里可能指凶手逃到祭坛寻求庇护；即便如此，蓄意杀人者也要被带走处死。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִּי
  choice: 但如果
  rationale: 承接并对比前文关于非故意杀人的规定，同时保留条件句的法律语气。
- source_word: יָזִד
  choice: 蓄意加害
  rationale: 该动词在这里强调狂妄、故意而非意外的行动；结合杀人语境，“蓄意加害”自然表达预谋性，同时不把其含义缩窄为单纯“设谋”。
- source_word: אִישׁ
  choice: 有人
  rationale: 希伯来语为阳性单数，但法律条文中具有泛指作用；现代汉语用“有人”最自然，也不额外限定只适用于男性。
- source_word: עַל רֵעֵהוּ
  choice: 自己的同伴
  rationale: 表达敌对行动所针对的共同体成员；“同伴”比现代汉语中常指邻居的“邻舍”更清楚。
- source_word: לְהָרְגוֹ
  choice: 杀他
  rationale: 直接保留 הרג“杀”的词义；行为的故意和奸诈性质由上下文另行表达，不预先改译为法律术语“谋杀”。
- source_word: בְעָרְמָה
  choice: 用诡计
  rationale: 该词表示狡诈、诡谲的手段或意图；“用诡计”保留方式状语的形式，也符合现代汉语法律叙述。
- source_word: מֵעִם מִזְבְּחִי
  choice: 从我的祭坛那里
  rationale: מֵעִם 表示从祭坛旁边或所在之处带离；不在正文中添加原文未明说的“即使”，庇护含义留在脚注说明。
- source_word: תִּקָּחֶנּוּ
  choice: 你们要把他……带走
  rationale: 原文是第二人称阳性单数命令式法律表达；汉语法律语境中用泛指复数“你们”较自然，“带走”也准确表达从祭坛处移走。
- source_word: לָמוּת
  choice: 处死他
  rationale: 字面为“使之死／去死”，在本条司法处置语境中指带去执行死刑；译为“处死他”比“让他死”自然明确。
theological_decisions:
- issue: 祭坛是否为故意杀人者提供庇护
  choice: 正文说要将此人从祭坛那里带走，暗示圣所不能庇护蓄意而诡诈杀人者。
  alternative: 只把祭坛理解为拘提被告的地点，不强调庇护制度。
  rationale: “从我的祭坛那里”在此法律语境中很可能涉及逃到祭坛寻求庇护，但原文没有明说其已经抓住坛角或正式获得庇护，因此正文保持简洁，文化背景放入脚注。
- issue: יָזִד 的故意性与狂妄性
  choice: 以“蓄意加害”突出故意、预谋性质。
  alternative: 译作“狂妄地攻击”或“擅敢加害”，突出傲慢放肆。
  rationale: 词语兼有故意擅行和狂妄之意；杀人律例的对比重点在非故意与故意之间，故正文优先呈现故意性，并以脚注保留另一层语义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语法律语体。“有人”保留条文的普遍适用性；“蓄意加害……用诡计杀他”分别呈现故意性和奸诈手段；“从我的祭坛那里”避免在正文中加入原文没有明示的强调词。所有脚注标记均置于相关正文内容之后。
