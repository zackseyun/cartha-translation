revisions:
- from: 如果有人打开一个坑[a]，或挖了一个坑而没有盖上，有牛或驴掉进去，
  to: 如果有人打开一个坑口[a]，或挖一个坑而没有盖上，牛或驴掉进去，
  rationale: 修订仅改善首个法律情形及其脚注在现代汉语中的搭配和清晰度。“坑口”明确了“打开”的实际对象，同时保留原文及英文审校记录所强调的歧义：这可指使已有的坑开放，而非挖掘新坑。其余措辞和未完成条件句的句末逗号均予保留。
