  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: zh_hans
  text: 如果有人打开一个坑口[a]，或挖一个坑而没有盖上，牛或驴掉进去，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打开一个坑口”也可译作“使坑口敞开”或“揭开坑口的遮盖物”。希伯来语动词直译为“打开”，可能指打开一个已有的坑，而不是另挖一个新坑。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: 如果
  rationale: 引出承接上文的案例法条件；现代汉语中直接用“如果”自然清楚，句序本身足以体现衔接。
- source_word: יִפְתַּח
  choice: 打开
  rationale: 直译为“打开”，并与下句“挖”区别；可能指揭开或开启一个已有的坑。
- source_word: אִישׁ
  choice: 有人
  rationale: 希伯来语法律条文以阳性单数“人”提出一般案例；“有人”在现代汉语中自然地保留其泛指法律功能，避免误解为只限男性。
- source_word: בּוֹר
  choice: 一个坑
  rationale: “坑”是本责任法规中最宽泛、贴合语境的称呼；此处重点是未加遮盖而危及牲畜的坑穴，不必限定为蓄水池。
- source_word: א֠וֹ כִּי
  choice: 或
  rationale: 标明与前一分句平行的另一种情形；汉语无需重复“如果”也能清楚表达条件关系。
- source_word: יִכְרֶה
  choice: 挖了
  rationale: 准确表达挖掘坑穴的动作，并与前面的“打开”形成区别。
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: 而没有盖上
  rationale: 指没有在坑上加盖；“而”自然表现该疏忽与前述行为之间的转折关系。
- source_word: וְ/נָפַל
  choice: 有……掉进去
  rationale: 在案例法的条件序列中表示随之发生的情形；汉语用“有……掉进去”自然顺畅。
- source_word: שָׁמָּה
  choice: 进去
  rationale: 该词具有向那里的方向意义；结合“掉”，译作“掉进去”比直译“掉在那里”自然准确。
- source_word: שּׁוֹר
  choice: 牛
  rationale: 在法律语境中泛指单头牛类牲畜；现代汉语“牛”较“公牛”或“阉牛”更能保留原词在此处未明确限定的范围。
- source_word: א֥וֹ חֲמוֹר
  choice: 或驴
  rationale: 准确、自然地指常见的家养役畜。
