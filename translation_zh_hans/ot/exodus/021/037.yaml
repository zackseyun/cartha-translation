base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: zh_hans
  text: 人若偷了牛或羊[a]，把它宰了或卖了，就要以五头牛赔一头牛，以四只羊赔一只羊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所指的是一只小型家畜，可以是绵羊，也可以是山羊。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 若
  rationale: 引出判例法的条件句；“若”简洁、庄重，也符合现代汉语法律表述。
- source_word: יִגְנֹב אִישׁ
  choice: 人若偷了
  rationale: אִישׁ在这里泛指实施行为的人；汉语“人若”自然表达这一通用条件，不额外限定性别。完成体式的“偷了”适合随后“宰了或卖了”的连续情形。
- source_word: שׁוֹר
  choice: 牛
  rationale: שׁוֹר指单头牛类牲畜；“牛”比限定性别或用途的“公牛”“耕牛”更稳妥。
- source_word: שֶׂה
  choice: 羊[a]
  rationale: 该词指一只小型家畜，可包括绵羊或山羊；正文用汉语较宽泛的“羊”，脚注保留其词义范围。
- source_word: וּטְבָחוֹ
  choice: 把它宰了
  rationale: טבח特指宰杀牲畜，不只是一般的杀死；“宰了”自然并保留这一具体含义。
- source_word: אוֹ מְכָרוֹ
  choice: 或卖了
  rationale: 直接表达另一种处置被盗牲畜的情形；宾语由前面的“把它”自然统摄。
- source_word: חֲמִשָּׁה בָקָר
  choice: 五头牛
  rationale: בָקָר是牛类的集合名词；汉语用量词“头”计数牲畜，准确而自然。
- source_word: יְשַׁלֵּם
  choice: 赔
  rationale: שלם在本法律语境中表示作出赔偿或偿还；“赔”清楚传达法定赔偿义务。
- source_word: תַּחַת
  choice: 以……赔……
  rationale: תַּחַת表示替代或对应赔偿；汉语“以五头牛赔一头牛”自然呈现赔偿比例。
- source_word: וְאַרְבַּע צֹאן
  choice: 以四只羊
  rationale: צֹאן泛指羊群或小型家畜；此处与前面的单只שֶׂה对应，译作“四只羊”使赔偿公式清晰，同时不强行区分绵羊与山羊。
theological_decisions: []
