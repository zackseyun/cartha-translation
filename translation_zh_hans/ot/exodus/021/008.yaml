  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: zh_hans
  text: 如果她不蒙主人喜悦，而主人没有选定她归自己[a]，主人就要准她被赎回。他既然对她不守信[b]，就无权把她卖给外族人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“而主人已经选定她归自己”，也可把“选定”译作“聘定”。这句希伯来文在文本和解释上都有困难。
    reason: textual_variant
  - marker: b
    text: “不守信”也可译作“以诡诈待她”或“背叛她”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: 不蒙……喜悦
  rationale: 这是表示某人不喜悦或不接纳的希伯来语习语，并非断言女子在道德上是邪恶的；此译自然清楚，也保留关系层面的含义。
- source_word: אֲדֹנֶיהָ
  choice: 主人
  rationale: 在本段法律语境中，指买下并对女子拥有法定权柄的男子；“主人”准确反映当时的社会法律关系，又不引入神圣称号的意味。
- source_word: יְעָדָהּ
  choice: 选定她归自己
  rationale: 此动词在这里指把女子指定为自己的婚配对象，或作相应安排；“选定……归自己”保留词义宽度，避免在正文中过度限定为正式订婚。
- source_word: וְהֶפְדָּהּ
  choice: 要准她被赎回
  rationale: 使役形式在此可表示容许或促成赎回；此译表达主人的法律义务，而不暗示赎价必定由主人本人支付。
- source_word: לְעַם נָכְרִי
  choice: 给外族人
  rationale: 原文是集合性表达，强调以色列共同体之外的人；“外族人”在现代汉语中自然，也保留社会群体的界线。
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: 无权把她卖给
  rationale: משׁל 在此表示权力或合法权限；“无权”清楚传达该禁令的法律性质。
- source_word: בְּבִגְדוֹ בָהּ
  choice: 既然对她不守信
  rationale: בגד 表示背信、欺骗或以诡诈相待；“不守信”简洁地表达主人没有履行对女子所负的承诺或义务。
theological_decisions:
- issue: יְעָדָהּ 所在分句因马所拉书写与诵读传统而产生的解释歧义
  choice: 主人没有选定她归自己
  alternative: 主人已经选定她归自己／主人没有聘定她
  rationale: 传承文本在否定词“没有”与代词“给自己”之间存在著名的书写—诵读难题，古代译本和解释传统也不一致。正文依所给原文的辅音及形态资料采用否定读法，并用“选定”保留动词的词义范围；脚注列出肯定读法及婚姻语境下“聘定”的可能性，不替读者消除原有张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留法律语气，以“要准”“无权”表达义务和权限；避免古奥措辞，也不以现代婚姻或雇佣制度淡化原文中的主仆法律关系。
