  text: eye for eye[a], tooth for tooth, hand for hand, foot for foot.
translation:
  language: zh_hans
  text: 以眼还眼[a]，以牙还牙，以手还手，以脚还脚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“眼换眼，牙换牙，手换手，脚换脚。”
    reason: 词义备选；תַּחַת 在此可表示“代替、相应”。
lexical_decisions:
- source_word: עַיִן
  choice: 眼
  rationale: 指身体的眼睛；在简洁的法律对句中用“眼”自然有力，也与其余身体部位保持平行。
- source_word: תַּחַת
  choice: 以……还……
  rationale: 此处不是空间意义的“在……下面”，而表示对应的补偿或报偿。“以……还……”保留比例对应关系，也符合现代汉语中这一法律格言的惯用表达。
- source_word: שֵׁן
  choice: 牙
  rationale: 指牙齿；“以牙还牙”是自然且广为理解的汉语表达，并保留原文的简练结构。
- source_word: יָד
  choice: 手
  rationale: 按其通常身体意义译为“手”，保持原文逐项对应的节奏。
- source_word: רֶגֶל
  choice: 脚
  rationale: 此词有时可泛指腿或下肢，但在这一固定的身体部位对句中，“脚”最贴切，也与传统而清楚的汉语表达相符。
theological_decisions:
- issue: 法律公式的性质
  choice: 保留“以眼还眼……以脚还脚”这一简洁的对应报偿公式。
  alternative: 解释性地译为“所受的刑罚应与造成的伤害相称”。
  rationale: 希伯来原文仅以身体部位名词和 תַּחַת 构成成对短语。直译式的简洁表达既呈现比例对应，也避免预先判定其具体执行方式或加入原文未明说的法律解释。
translation_notes:
  register: 采用现代、庄重而通俗的法律格言式汉语；四个平行分句保持原文的凝练、节奏和结构。
