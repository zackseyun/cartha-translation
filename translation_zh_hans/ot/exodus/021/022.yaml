source:
  edition: WLC
  text: וְ/כִֽי יִנָּצ֣וּ אֲנָשִׁ֗ים וְ/נָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְ/יָצְא֣וּ יְלָדֶ֔י/הָ וְ/לֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽ/אֲשֶׁ֨ר יָשִׁ֤ית עָלָי/ו֙ בַּ֣עַל הָֽ/אִשָּׁ֔ה וְ/נָתַ֖ן בִּ/פְלִלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: zh_hans
  text: 如果有男人彼此争斗，击中一名孕妇，以致她的孩子出来[a]，却没有造成严重伤害[b]，肇事者必须受罚；他要照那妇人的丈夫向他定下的数额，并按审判官的裁定缴纳[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“她的孩子出来”。这可能指早产；有些译本译作“使她早产”，另一些则理解为流产。
    reason: lexical_alternative
  - marker: b
    text: 原文没有在本节单独说明，这种严重伤害是指母亲、孩子，还是二者中的任何一方。也可译作“灾祸”或“伤害”。
    reason: alternative_reading
  - marker: c
    text: 也可译作“经司法裁决”或“在法庭上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 引出假设性的案例法条款；现代汉语以“如果”表达自然，也保留希伯来文的条件性质。
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: 有男人彼此争斗
  rationale: יִנָּצוּ表示相互争斗，אֲנָשִׁים在此明确为阳性复数；译文保留其性别指向及肢体冲突的含义。
- source_word: וְנָגְפוּ
  choice: 打到
  rationale: 该动词表示碰击或击打。这里的妇人是在男人争斗时被打到；“打到”既表达实际的击打，又不擅自断定行为是否蓄意针对她。
- source_word: אִשָּׁה הָרָה
  choice: 一名孕妇
  rationale: 这是清楚、自然的现代汉语，对应“怀孕的妇人”。
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: 致使她的孩子出来
  rationale: 贴近原文“她的孩子出来”，不预先判定这是早产、流产，还是泛指胎儿娩出；相关解释列入脚注。
- source_word: אָסוֹן
  choice: 严重伤害
  rationale: אָסוֹן指重大的伤害、灾祸或致命后果；“严重伤害”保留其严重程度，又不把含义限定为死亡。
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: 就必须受罚
  rationale: 不定式绝对式与限定动词连用，加强处罚的确定性；上下文表明处罚涉及金钱赔付。
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: 那妇人的丈夫向他提出多少罚金
  rationale: ישית עליו表示把某项要求或罚金加在某人身上；在本法律语境中译作丈夫“提出”罚金数额较自然，同时不使丈夫的要求脱离司法裁定。
- source_word: וְנָתַן בִּפְלִלִים
  choice: 按审判官的裁定赔付
  rationale: ונתן在金钱处罚语境中指支付；בפללים与司法审理或审判者有关。“按审判官的裁定”清楚传达赔付须经正式司法裁断。
theological_decisions:
- issue: 孕妇被击后“孩子出来”以及“严重伤害”的所指
  choice: 正文保留“她的孩子出来”这一宽泛表述，并不明确限定“严重伤害”是发生在母亲、孩子，还是二者中的任何一方。
  alternative: 可译为“导致她早产”或“导致她流产”；也可把“严重伤害”明确限定为仅指孕妇，或明确解释为包括孕妇与孩子。
  rationale: 本节希伯来文本身没有明确解决这些问题。直译关键短语并以脚注说明解释范围，可避免将涉及胎儿生命与伤害对象的特定神学或伦理立场写入正文。
- issue: 丈夫所提出的罚金与司法裁定之间的关系
  choice: 将丈夫提出的罚金与审判官最终裁定并列呈现。
  alternative: 可把בִּפְלִלִים理解为“在法庭上”或“交给审判官”。
  rationale: 原文既提到丈夫加在肇事者身上的要求，也提到בִּפְלִלִים；译文不把最终决定权单独归给丈夫，而保留正式司法裁断的作用。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保持案例法的条件句式。关键争议短语适度贴近原文，并用脚注交代主要解释选项，避免以流畅为由消除文本本有的歧义。
