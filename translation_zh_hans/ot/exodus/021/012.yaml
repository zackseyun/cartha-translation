  text: Whoever strikes a man so that he dies shall surely be put to death[a].
translation:
  language: zh_hans
  text: 凡打人致死的，必须处死。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“击打一个人、那人死了的，必被处死。”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: 打人的
  rationale: 这是动词 נכה 的分词形式，用来引出判例法中的情形；“打人的”自然简洁，又不在动词本身预先限定死亡结果。
- source_word: אִישׁ
  choice: 人
  rationale: אִישׁ 在此指作为受害者的个人。汉语“打人”无需标明性别，也能保留这条法律的一般适用范围。
- source_word: וָמֵת
  choice: 若致人死亡
  rationale: 连接词加 מות 的完成式表明击打造成死亡这一结果；“若致人死亡”符合现代汉语法律表述，同时保留案件成立所需的结果条件。
- source_word: מוֹת יוּמָת
  choice: 必须处死
  rationale: 不定式绝对形与被动未完成式连用，加强刑罚的确定性；“必须处死”保留正式、强制的死刑判决及原文的被动含义。
