  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: zh_hans
  text: 如果有几个人争斗，其中一人用石头或拳头打了对方，对方没有死，却因伤卧床[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“倒下卧床”，指因伤而卧床。
    reason: 说明希伯来语习语的字面形式及其语境含义。
lexical_decisions:
- source_word: וְכִי
  choice: 如果
  rationale: 这里引出一个判例情形；“如果”符合现代汉语法律条件句的表达，也保留事件的假设性质。
- source_word: יְרִיבֻן אֲנָשִׁים
  choice: 有人彼此争斗
  rationale: ריב表示争执、争斗；结合随后发生的击打，译作“争斗”既不弱化冲突，也不夸大为战争。“有人彼此”自然表达复数参与者，而不额外限定人数。
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: 其中一人……打了对方
  rationale: 准确体现从复数参与者转到其中一名个体，并将רֵעַ按此人际法律语境译为“对方”。
- source_word: בְּאֶבֶן אוֹ בְאֶגְרֹף
  choice: 用石头或拳头
  rationale: 介词ב表示工具；אֶבֶן是“石头”，אֶגְרֹף通常指“拳头”。“用”符合现代汉语习惯。
- source_word: וְלֹא יָמוּת
  choice: 对方没有死
  rationale: 补明主语为受击者，避免汉语歧义，同时忠实表达伤者未死亡这一法律条件。
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: 却卧床不起
  rationale: 原文直译近于“倒下卧床”，在此指因伤而卧床；“卧床不起”自然清楚，并以“却”表达该人与死亡相对、仍受重伤的结果。
