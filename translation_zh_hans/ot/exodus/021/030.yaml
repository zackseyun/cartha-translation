  text: אִם כֹּ֖פֶר יוּשַׁ֣ת עָלָ֑י/ו וְ/נָתַן֙ פִּדְיֹ֣ן נַפְשׁ֔/וֹ כְּ/כֹ֥ל אֲשֶׁר יוּשַׁ֖ת עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: zh_hans
  text: 如果判他付赎金[a]，他就必须按判定的全部数额，支付自己性命的赎价。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎金”和后文“赎价”分别译自两个意义相关但不同的希伯来词：כֹּפֶר（赎金）和 פִּדְיֹן（赎回或释放所付的价款）。本句也可译作：“如果有赎金加在他身上……。”
    reason: 说明两个相关法律术语的词义区别，并保留原文被动法律表达的另一种译法。
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 引出承接前文法律责任的条件情形；“如果”准确保留条件语气。
- source_word: כֹּפֶר
  choice: 赎金
  rationale: 指为免受刑罚、保全性命而支付的款项；“赎金”保留其法律性的赎偿含义，又不引入祭祀性赎罪观念。
- source_word: יוּשַׁת עָלָיו
  choice: 向他索取
  rationale: שׁית 的被动式与 עַל 连用，表示某项义务加在某人身上；在涉及款项的汉语法律语境中，“向他索取”自然清楚。
- source_word: וְנָתַן
  choice: 他就要……付上
  rationale: 表达条件成立后的法律后果；“就要”体现规范性要求，“付上”符合款项语境。
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: 赎回自己性命的价款
  rationale: פִּדְיֹן 指赎回或释放所需的价款，נֶפֶשׁ 在此指人的性命；此译法保留它与 כֹּפֶר 的相关性及词义差别。
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: 照向他所索取的一切数额
  rationale: 表达应完全按照所定款额支付；补出语境蕴含的“数额”，使现代汉语清楚，同时保留 כֹּל 的完整范围。
theological_decisions:
- issue: 死刑责任背景下款项的性质
  choice: 用“赎金”和“赎回自己性命的价款”表达司法性的代偿付款。
  alternative: 把两个词都译作“罚金”，或采用更强的祭祀性“赎罪”措辞。
  rationale: 经文所说的是以司法规定的付款使当事人的性命免于原本适用的刑罚。译文保留希伯来语的法律—赎偿意象，但不暗示其无罪，也不引入祭祀性赎罪教义。
translation_notes:
  register: 采用现代、庄重而清楚的法律叙述语体。“性命”比“灵魂”更符合本处 נֶפֶשׁ 的司法语境；句序稍作调整，使金额标准与付款义务在现代汉语中易于理解。
