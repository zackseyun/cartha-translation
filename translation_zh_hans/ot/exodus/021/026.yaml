  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male slave or the eye of his female slave and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: zh_hans
  text: 若有一个男人击打自己的男奴或女奴[b]的一只眼睛，把眼睛打坏了[a]，就必须释放那奴仆，使他或她获得自由，作为眼睛受伤的补偿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使眼睛失明。”希伯来文动词可指毁坏眼睛，含有造成永久性伤害之意。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“他的男奴……他的女奴”。这条律法规定，主人若使奴仆受到这种永久伤害，就须以释放作为补偿。
    reason: cultural_note
  - marker: c
    text: 也可直译：“代替他的眼睛”或“因他的眼睛”。这里指以释放来补偿眼睛所受的伤害。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 若
  rationale: 引出个案式律法的条件句；汉语法律表述中“若”自然地承载这一功能，无须生硬译出句首连接词。
- source_word: יַכֶּה
  choice: 击打
  rationale: נכה的基本义是击打；“击打”直接而庄重，也不暗示反复殴打。
- source_word: אִישׁ
  choice: 一个男人
  rationale: 保留希伯来文阳性单数所指，同时符合个案律法以单一个体设例的形式。
- source_word: עַבְדּוֹ ... אֲמָתוֹ
  choice: 自己男奴或女奴
  rationale: 本节涉及主人造成伤害后须释放受伤者，奴役身份是法律规定的关键；“男奴／女奴”也保留原文两种有性别区别的称谓。
- source_word: וְשִׁחֲתָהּ
  choice: 把眼睛打坏了
  rationale: שחת在此指使眼睛遭到毁坏、失去正常功用；“打坏”自然且不把含义限定为完全失明。
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: 就必须释放那奴仆，使其自由
  rationale: 在律法语境中未完成式表达具有约束力的规定；שלח与“自由”连用，意为释放而非普通地打发离开。用“那奴仆”可同时回指前述男奴或女奴。
- source_word: תַּחַת עֵינוֹ
  choice: 作为对这只眼睛的补偿
  rationale: תחת在法律语境中可表达代偿或补偿关系；此译清楚传达因眼睛遭永久伤害而以自由作补偿的意思。
theological_decisions:
- issue: 以色列个案律法中的奴役身份用语
  choice: 男奴／女奴
  alternative: 男仆／婢女
  rationale: 本节明确涉及主人对受其权辖者造成伤害以及强制释放，译作“奴”较准确地呈现其受奴役的法律身份，避免用较柔和的现代雇佣关系用语淡化文本。
- issue: 个案律法主体的性别表达
  choice: 一个男人
  alternative: 一个人／有人
  rationale: 原文使用阳性名词אִישׁ；正文保留这一形式，不擅自将其改为无性别表达。
- issue: 受伤者回指代词的处理
  choice: 那奴仆／使其
  alternative: 释放他
  rationale: 原文后半句采用阳性单数代词作为默认回指，但前文明确同时规定男奴和女奴；汉语用可兼指二者的名词和代词，既保留法律适用范围，也不误导读者以为释放规定只适用于男奴。
translation_notes:
  register: 采用现代、庄重而清楚的律法语体。“击打”“必须释放”体现法律条款的直接性；“把眼睛打坏了”则比“毁灭眼睛”更符合现代汉语。正文中的[a]、[b]、[c]均放在相应词句之后。
