  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: zh_hans
  text: 他的主人要带他到上帝[a]面前，又带他到门或门柱前。主人要用锥子刺穿他的耳朵，他就要终身服侍主人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“审判官面前”。希伯来语אֱלֹהִים在某些法律语境中可以指人的审判官或司法权威。
    reason: 保留原文在法律语境中的另一种合理理解。
lexical_decisions:
- source_word: וְהִגִּישׁוֹ
  choice: 要带他到……面前
  rationale: 使役式在此表示把人带到权威者面前或指定地点；此译自然地保留法律程序意味。
- source_word: אֲדֹנָיו
  choice: 他的主人
  rationale: 上下文是希伯来奴仆法，“主人”准确表达当时的社会法律关系，也避免“主”可能引起的神性联想。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 该词通常指上帝；在这里可理解为在圣约和司法仪式中把人带到上帝面前。法律语境中译作“审判官”也有依据，故列入脚注。
- source_word: הַדֶּלֶת
  choice: 门
  rationale: 直译具体清楚，符合仪式发生的地点。
- source_word: הַמְּזוּזָה
  choice: 门框
  rationale: מְזוּזָה 指门侧的竖直构件；现代汉语用“门框”较自然，并与“门”形成清楚区别。
- source_word: רָצַע
  choice: 刺穿
  rationale: 该动词指用尖锐工具钻孔或穿透；与耳朵和锥子搭配时，“刺穿”准确清楚。
- source_word: אָזְנוֹ
  choice: 他的耳朵
  rationale: 保留原文直接的身体部位称谓。
- source_word: בַּמַּרְצֵעַ
  choice: 用锥子
  rationale: מַרְצֵעַ 是用来钻孔的尖头工具；“锥子”是普通现代汉语中准确易懂的对应词。
- source_word: וַעֲבָדוֹ
  choice: 他就要……服侍主人
  rationale: עבד 在此表示持续服侍；补出“主人”比连续使用两个“他”更清楚，所指未改变。
- source_word: לְעֹלָם
  choice: 终身
  rationale: 在这项奴仆法的有限人生语境中，לְעֹלָם 表示此后持续一生；“终身”比“永远”更自然，也避免暗示超越死亡的无限期限。
theological_decisions:
- issue: 法律语境中 הָאֱלֹהִים 的含义
  choice: 上帝
  alternative: 审判官
  rationale: 原词最基本的含义是“上帝”，可指在上帝面前完成具有圣约和司法性质的仪式；但将其理解为代表司法权威的审判官也是古老且合理的解释，因此以脚注保留歧义。
- issue: לְעֹלָם 所指的期限
  choice: 终身
  alternative: 永远
  rationale: 原词本身可表示长久或永久，但此处受人的寿命和法律关系所限；“终身”传达其实际法律效力，不将其理解为形而上的无尽。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。法律程序用“带……到……面前”，具体仪式动作保持简洁直白；以“终身”表达该法律关系在奴仆余生中的持续性。
