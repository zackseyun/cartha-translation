  yaml_path: translation/ot/exodus/021/010.yaml
  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: zh_hans
  text: 如果他另娶一妻，就不可减少原来妻子的食物、衣服和夫妻生活的权利。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “夫妻生活的权利”也可译作“同房的权利”。这里的希伯来词较罕见，通常理解为丈夫在婚姻亲密关系上应尽的义务。
    reason: 说明罕见词 עֹנָה 的常见解释及较直接的译法，同时保留其词义上的不确定性。
lexical_decisions:
- source_word: אִם
  choice: 如果
  rationale: 保留希伯来案例法以条件句引入情形的形式。
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: 他另娶一个女子
  rationale: לקח 在婚姻语境中表示娶妻；“另娶一个女子”自然表达 אַחֶרֶת，并由上下文明确其妻子身份。לוֹ 在现代汉语“娶”的含义中已自然体现，不必生硬译作“为自己”。
- source_word: שְׁאֵרָהּ
  choice: 原有妻子的食物
  rationale: 该词虽与“肉身”等义项有关，但在此处婚姻供养义务的三项并列中，最可能指食物或生活供给；正文采用较具体、通行的“食物”。“原有妻子”明确三个阴性单数后缀所指，避免汉语代词歧义。
- source_word: כְּסוּתָהּ
  choice: 衣服
  rationale: כְּסוּת 指遮盖物或衣物，此处译为自然明确的“衣服”。
- source_word: וְעֹנָתָהּ
  choice: 夫妻生活的权利
  rationale: עֹנָה 是罕见且有争议的词，此处通常理解为丈夫应履行的婚姻亲密义务。“夫妻生活的权利”既清楚又保持庄重，并在脚注说明词义问题。
- source_word: לֹא יִגְרָע
  choice: 不可减少
  rationale: 准确保留“削减、减损”的基本含义，并适合律法条文的规范语气。
theological_decisions:
- issue: 本节是否认可多妻制
  choice: 按原文陈述另娶之后不得减损原有妻子权益的案例法，不添加认可或谴责的解释
  alternative: 把经文改写为对多妻制的道德评价
  rationale: 原文在此规定具体法律义务，而没有直接处理该制度的神学评价；译文不应额外解决这一张力。
- issue: עֹנָה 的确切含义
  choice: 正文译为“夫妻生活的权利”，脚注保留“同房的权利”这一较直接说明并指出词义有争议
  alternative: 译为“居所”或泛指“供养”
  rationale: 上下文三项义务及主要词典证据支持婚姻亲密关系之义，但该词罕见，宜向读者披露不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的法律语体。“原有妻子”是为消除汉语中连续使用“她的”可能造成的指代含混；原文以阴性单数后缀指向前文受保护的女子。脚注标记置于相关短语之后。
