base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: zh_hans
  text: 坑的主人必须赔偿，把钱付给牲畜的主人；死亡的牲畜归他所有。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”指坑的主人；“死亡的牲畜”也可译为“尸体”。
    reason: referent_and_lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: 坑的主人
  rationale: 在本段法律语境中，בַּעַל指对坑负有责任或拥有该坑的人；“坑的主人”自然清楚，也与前一节的“坑”衔接。
- source_word: יְשַׁלֵּם
  choice: 必须赔偿
  rationale: שׁלם的Piel词形在法律条文中表示作出赔偿；“必须赔偿”既传达法律义务，也符合现代汉语表达。
- source_word: כֶּסֶף יָשִׁיב
  choice: 把钱付给
  rationale: כֶּסֶף字面为“银子”，在此指货币；יָשִׁיב字面有“使归还”之意，在本句中表示向受损一方偿付相应价值。
- source_word: לִבְעָלָיו
  choice: 牲畜的主人
  rationale: 词形本身是“给它的主人”；根据上文，所指是跌入坑中死亡的牛或驴。汉语补出“牲畜”可避免代词指向不清。
- source_word: וְהַמֵּת
  choice: 死牲畜
  rationale: 原文实词化地说“死的（那个）”，所指为死亡的牛或驴；补出“牲畜”使现代汉语自然，同时不限定具体种类。
- source_word: יִהְיֶה לוֹ
  choice: 要归他
  rationale: 该短语表示死牲畜归属于前述坑的主人；“归他”简洁地保留所有权转移的法律含义。
theological_decisions:
- issue: 末句中代词“他”的指向
  choice: 按最邻近且通常的句法关系，理解为坑的主人取得死牲畜
  alternative: 理解为原牲畜主人保有尸体
  rationale: 主句以“坑的主人”为行为主体，随后连续使用第三人称单数形式；因此末句的לוֹ最自然地回指坑的主人。不过希伯来语仅说“归他”，正文保留代词，并以脚注说明指向。
translation_notes:
  register: 采用简洁、庄重的现代法律条文语体。“必须”明确表达未完成式在律例中的义务效力；不用较古雅的“银子”“偿还”，以便普通现代读者理解。
