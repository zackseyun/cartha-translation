base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: zh_hans
  text: “牛若用角顶了男人或女人，致使那人死亡，就必须用石头把牛打死；牛的肉不可吃，但牛的主人不承担责任[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“无罪”“不负责任”或“不受处罚”。希伯来语 נָקִי 是法律用语，表示在本案中清白、无须承担责任或处罚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: 牛若
  rationale: 该短语引出个案律法的条件句；现代汉语用“若”即可自然表达其法律条件关系，不必机械译出句首连接词。
- source_word: יִגַּח
  choice: 用角顶了
  rationale: 该动词特指有角牲畜以角冲顶；“用角顶”比单说“撞”更准确，也便于普通读者理解。
- source_word: שׁוֹר
  choice: 牛
  rationale: 希伯来词在律法语境中泛指单头牛；“牛”不额外限定性别，也比“公牛”或“阉牛”稳妥。
- source_word: אֶת־אִישׁ אוֹ אֶת־אִשָּׁה
  choice: 男人或女人
  rationale: 原文明确并列男女，译文予以保留，不笼统合并为“人”。
- source_word: וָמֵת
  choice: 致使那人死亡
  rationale: 单数动词指被牛顶的人死亡；这样译可同时涵盖前述男人或女人，避免汉语代词造成性别不一致。
- source_word: סָקוֹל יִסָּקֵל
  choice: 必须用石头把牛打死
  rationale: 不定式绝对式与限定动词连用，带有强调和强制意味；“必须”传达法律命令的强调，“打死”明确石刑的致死结果。
- source_word: וְלֹא יֵאָכֵל אֶת־בְּשָׂרוֹ
  choice: 牛的肉不可吃
  rationale: 保留被动禁令的简洁法律语体；בָּשָׂר 在食用语境中自然译为“肉”。
- source_word: וּבַעַל הַשּׁוֹר
  choice: 但牛主
  rationale: בַּעַל 在此指牛的所有人；“牛主”简洁而符合汉语律法语境。
- source_word: נָקִי
  choice: 可免罪责
  rationale: 该法律用语表示清白、无须承担处罚或责任；“可免罪责”保留其免责意义，同时以脚注说明原词可能涵盖的不同侧重。
theological_decisions:
- issue: 末句中牛主的法律地位
  choice: 译为“可免罪责”，不进一步限定所免的是道德罪责、民事责任还是特定刑罚。
  alternative: 可译为“无罪”“不负责任”或“不受处罚”。
  rationale: 本节先陈述一般情形，随后经文才处理牛主已知牛有顶人习惯却未加看管的情况。希伯来词本身只表明牛主在本案中被判为清白或免受追究，因此译文不预先缩窄免责范围。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“用角顶”明确动作，“必须”体现原文强调式；用“致使那人死亡”自然涵盖男女。脚注标在“可免罪责”之后，因为注释所说明的是末句 נָקִי 的含义。
