  yaml_path: translation/ot/exodus/009/026.yaml
  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: zh_hans
  text: 只有在以色列子孙所在的歌珊地[a]，没有冰雹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”也可译作“以色列人”；希伯来文直译为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只有
  rationale: 句首的限制词，强调灾害范围中的唯一例外；“只有”在现代汉语中自然清楚。
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: 歌珊地
  rationale: 指名为歌珊的地区；汉语地名后加“地”即可自然表达，无须机械译出介词。
- source_word: אֲשֶׁר שָׁם בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙所在的
  rationale: 将地点关系从句自然地前置修饰“歌珊地”，同时保留原文“以色列之子”的家族性集体称谓。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 较贴近希伯来文的字面结构，又是现代中文圣经语境中可理解、庄重的集体称呼。
- source_word: לֹא הָיָה בָּרָד
  choice: 没有冰雹
  rationale: 否定存在句在现代汉语中的自然表达，准确说明当地不存在冰雹。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的译法
  choice: 以色列子孙
  alternative: 以色列人；以色列的儿子们
  rationale: “以色列子孙”保留原文家族谱系式称谓及其复数集体含义，同时避免“以色列的儿子们”在现代汉语中可能被误解为仅指雅各的亲生儿子；脚注列出更通顺的集体译法。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。将希伯来文地点关系从句整合为汉语定语结构；句首“只有”保留原文的限制和对比重点。
