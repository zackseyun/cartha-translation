base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: zh_hans
  text: 雅威对摩西和亚伦说：“你们从炉中各取满手的烟灰[a]；摩西要当着法老的面，把它扬向天空[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各取满手的”直译为“取你们手掌所盛满的量”。“烟灰”也可译作“细灰”；此处指炉中烟炱般细微的粉末状残留物。
    reason: 说明מְלֹא חָפְנֵיכֶם的数量表达，以及פִּיחַ的较具体词义。
  - marker: b
    text: 或译：“向天上”。
    reason: 保留הַשָּׁמַיְמָה另一自然的空间译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名四字母词的普通话音译，保留其作为专名的性质，不以称号代替。
- source_word: קְחוּ לָכֶם
  choice: 你们……捧取
  rationale: 复数命令同时指向摩西和亚伦；לָכֶם的受益或反身意味在汉语中不必机械译出，以免表达生硬。
- source_word: מְלֹא חָפְנֵיכֶם
  choice: 用双手……捧取
  rationale: 该短语表示手掌或合拢双手所能盛满的量；用动作化的现代汉语表达，既自然又保留具体形象。
- source_word: פִּיחַ כִּבְשָׁן
  choice: 炉中的烟灰
  rationale: פִּיחַ具体指细微的烟灰或黑色粉末状残留物，כִּבְשָׁן指炉或窑；“烟灰”比泛称“灰烬”更准确。
- source_word: וּזְרָקוֹ מֹשֶׁה
  choice: 摩西要……把它扬
  rationale: 希伯来文从对两人的复数命令转为以摩西为主语的第三人称单数动作；“扬”适合把细灰抛撒到空中的动作。
- source_word: הַשָּׁמַיְמָה
  choice: 向天空
  rationale: 方向词尾表示朝上方运动；此处描述可见的身体动作，“天空”比带有神学联想的“天上”更明确。
- source_word: לְעֵינֵי פַרְעֹה
  choice: 当着法老的面
  rationale: 这是“在法老眼前”的自然普通话表达，保留行动须让法老亲眼看见的重点。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名；“雅威”按常见学术重构音译，避免以“主”等称号取代专名，同时不在正文中加入原文没有的解释。
- issue: הַשָּׁמַיְמָה在此处是“天空”还是“天上”
  choice: 向天空
  alternative: 向天上
  rationale: 语境是把烟灰向上扬起的具体动作，因此采用物理空间意义明确的“天空”；脚注保留“向天上”的可能译法，不排除该词本身较宽的语义范围。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。“用双手……捧取”保留原文的具体动作形象；“当着法老的面”是现代汉语中自然的可见性表达。句法明确呈现先由摩西和亚伦共同取灰、再由摩西一人扬灰的主语转换。
