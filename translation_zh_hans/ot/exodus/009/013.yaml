source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你清早起来，站在法老面前，对他说：‘希伯来人的上帝耶和华这样说：放我的百姓走，好让他们事奉我。[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“好让他们敬拜我。”希伯来语动词可指对上帝的服事，其中包括敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”呈现四字神名，使其与称号“上帝”有所区别。
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: 清早起来
  rationale: שׁכם 的使役命令式表达早起之意，与“在早晨”合译为自然简洁的“清早起来”。
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: 站在……面前
  rationale: 保留 יצב 反身词干所表达的站定、出现在某人面前之意；在法老这一语境中自然庄重。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 对应使者宣告公式，在现代汉语中清楚自然，并保留权威宣告的语气。
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: 希伯来人的上帝
  rationale: 直接呈现希伯来语属格结构，并采用现代标准汉语的自然表达。
- source_word: שַׁלַּח אֶת עַמִּי
  choice: 放我的百姓走
  rationale: 在出埃及的语境中，שׁלח 是要求法老准许以色列人离去；此译法准确且符合现代汉语习惯。
- source_word: וְיַעַבְדֻנִי
  choice: 好让他们事奉我
  rationale: 此处连接词加未完成式表达目的；“事奉”保留 עבד 对上帝所含的服事与敬拜双重范围，而不将其限缩为礼仪敬拜。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号；中文正文保留专名，并采用普通读者最熟悉且可辨识的传统音译“耶和华”。
- issue: וְיַעַבְדֻנִי 的意义范围
  choice: 好让他们事奉我
  alternative: 好让他们敬拜我
  rationale: עבד 可指对上帝的服事，其中包含敬拜，但意义不局限于礼仪行为；正文采用较宽的“事奉”，脚注提示“敬拜”这一语境可能含义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“清早起来”“站在法老面前”避免生硬仿古；引语层次依原文保留。
