base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: zh_hans
  text: 法老见雨、冰雹和雷声都停了[a]，就又犯罪，使自己的心刚硬；他和他的臣仆都是如此。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雷声”原文直译为“众声”；在这场暴风雨的语境中，指雷声。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 见
  rationale: 叙事中 ראה 的基本义是“看见”；这里也自然包含察觉眼前情势之意，无须进一步解释为“意识到”。
- source_word: כִּי
  choice: （见）……都停了
  rationale: כִּי 引出法老所见的内容。现代汉语无需另译“即”，以宾语小句直接表达。
- source_word: חָדַל
  choice: 停了
  rationale: חדל 表示停止、止息。“停了”自然清楚，也符合风雨冰雹止息的语境。
- source_word: הַמָּטָר
  choice: 雨
  rationale: מטר 的常规对应词；汉语并列自然现象时不必表达希伯来语定冠词。
- source_word: הַבָּרָד
  choice: 冰雹
  rationale: ברד 在灾祸语境中的标准译法。
- source_word: הַקֹּלֹת
  choice: 雷声
  rationale: קולות 字面为“声音”或“众声”，但在本段暴风雨语境中指雷声；正文采用自然明确的语境义，并以脚注保留字面信息。
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: 又犯罪
  rationale: יסף 加不定式可表示再次或继续做某事；此处“又犯罪”简洁地表达法老在灾情停止后重犯的叙事推进。
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: 硬着心
  rationale: כבד 字面涉及“沉重”，在出埃及记法老叙事中表示内心刚硬、顽梗。“硬着心”既自然，又保留反复出现的主题用语。
- source_word: הוּא וַעֲבָדָיו
  choice: 他和他的臣仆
  rationale: עבדים 在王宫语境中指法老属下的臣仆或官员；“臣仆”兼顾其臣属身份与原词的仆役色彩。
theological_decisions:
- issue: 刚硬之心的主体与范围
  choice: 译文明确法老再次犯罪，并按句末“他和他的臣仆”表达他们都硬着心。
  alternative: 把句末短语仅看作对法老及其宫廷的附加说明，或只将刚硬严格限定为法老个人的“他的心”。
  rationale: 希伯来文先以单数动词和“他的心”明确法老本人的责任，随后补上“他和他的臣仆”。中文用“他和他的臣仆都硬着心”保留共同参与的含义，同时不引入本节以外有关神使人刚硬与人自行刚硬的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“见……都停了”符合现代汉语信息结构；分号区分再次犯罪与心里刚硬两个紧密相连的动作。脚注标记[a]已置于正文相应词句之后。
