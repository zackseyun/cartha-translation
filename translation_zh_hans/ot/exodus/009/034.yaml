revisions:
- from: 法老见雨、冰雹和雷声都停了[a]，就又犯罪；他和他的臣仆都硬着心。
  to: 法老见雨、冰雹和雷声都停了[a]，就又犯罪，使自己的心刚硬；他和他的臣仆都是如此。
  rationale: 修订将“硬着心”改为“使自己的心刚硬”，更准确反映希伯来语使役动词及本书的主题性措辞。句末改为“他和他的臣仆都是如此”，在现代汉语中自然地保留法老及其臣仆共同刚硬的叙事含义，并不对该附加短语的句法范围作超过原文的断定。其余译文及脚注均可保留。
