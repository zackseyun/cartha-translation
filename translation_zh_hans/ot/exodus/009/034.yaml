  verdict: revise
  source_fidelity: 译文对雨、冰雹、雷声止息以及法老再次犯罪的表达基本忠实。“他和他的臣仆都硬着心”可反映句末附加语所涉及的共同性，但“硬着心”未充分表达希伯来语使役式“使心刚硬”的动作。
  naturalness: “法老见……都停了”自然。“使自己的心刚硬”比“硬着心”更符合现代汉语中该主题性表达的惯用说法；以“他和他的臣仆都是如此”承接，可使中文清楚而不过度界定句末短语的精确句法范围。
  terminology: “冰雹”“雷声”“犯罪”“心刚硬”均合乎本段庄重叙事语体。“臣仆”在王宫叙事中可用，保留其传统而可理解的称谓色彩。脚注恰当地说明“雷声”的语境义与字面义。
  issues:
  - severity: medium
    issue: “硬着心”弱化了使役动作，且在现代汉语中不如“使自己的心刚硬”明确自然。
    rationale: וַיַּכְבֵּד 是使役式，直接宾语为“他的心”。译作“使自己的心刚硬”既保留动作，也维持出埃及记中反复出现的“心刚硬”主题用语。
  - severity: low
    issue: 句末“他和他的臣仆”与单数“他的心”的关系存在句法解释空间。
    rationale: 不宜把它绝对化为只有法老个人的内心状态，或过度说明臣仆各自心的语法细节。“他和他的臣仆都是如此”在中文中保留他们共同参与的含义，同时避免添加原文未明说的细节。
  revised_text: 法老见雨、冰雹和雷声都停了[a]，就又犯罪，使自己的心刚硬；他和他的臣仆都是如此。
