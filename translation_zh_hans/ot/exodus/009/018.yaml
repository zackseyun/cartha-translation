  naturalness: 修订后语句庄重、清晰且符合现代标准汉语。“明天大约这个时候”自然表达כָּעֵת מָחָר所容许的约略时间含义；“自埃及建立之日”比“立国”更中性，避免将原文所说的被建立限定为现代政治意义的“立国”。
  terminology: “看哪”适合庄重的神圣宣告；“我要降下”保留使役动词和第一人称的直接神圣施行；“冰雹”准确。“建立”对应被动的הִוָּסְדָה，且不额外界定其所指是建国、奠基或定居。
