base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: zh_hans
  text: 看哪，明天大约这个时候[a]，我要降下极大的冰雹；这样的冰雹，自埃及建立之日[b]直到如今，从未有过。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“明天这个时候”。
    reason: 原文כָּעֵת可表达约略的“这个时候”，也可按较确定的时间表达理解。
  - marker: b
    text: 或译：“自埃及立国之日”。
    reason: 原文使用被动动词，意为埃及“被建立”；正文保留较中性的表达，替代译法将其理解为国家的建立。
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪
  rationale: 保留指示语的强调和神圣宣告的庄重语气；在现代中文中仍清楚可懂。
- source_word: מַמְטִיר
  choice: 我要降下
  rationale: 该词为使役形，第一人称主语明确表明上帝亲自使冰雹降下；“我要降下”自然地保留这种主动施行的含义。
- source_word: כָּעֵת מָחָר
  choice: 明天大约这个时候
  rationale: 介词כ可表达近似或比较；此译既保留“大约”的细微含义，也符合现代汉语时间表达。
- source_word: בָּרָד
  choice: 冰雹
  rationale: 这是该气象现象在现代标准汉语中的准确常用名称。
- source_word: כָּבֵד מְאֹד
  choice: 极其猛烈
  rationale: כָּבֵד本义为“重”，מְאֹד加以强化；描述冰雹时，中文用“猛烈”比“沉重”或“很重”自然，同时传达灾害的严重程度。
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: 这样的冰雹……从未有过
  rationale: 保留与以往一切冰雹相比较的最高程度表达，中文简明自然。
- source_word: בְּמִצְרַיִם
  choice: 埃及
  rationale: 结合后面的“立国之日”表达范围，中文无需重复“在”，仍清楚表示事件发生于埃及。
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: 自埃及立国之日
  rationale: 被动形态表示埃及被奠立或建立；“立国”在中文中自然凝练，同时脚注保留较直译的“建立”选项。
- source_word: וְעַד עָתָּה
  choice: 直到如今
  rationale: 准确表达从埃及建立之时延续到说话当下的时间范围，并保持庄重语体。
theological_decisions:
- issue: 灾祸中的神圣施行者
  choice: “我要降下”明确以上帝为第一人称施行者
  alternative: “将有冰雹降下”等非人称表达
  rationale: 原文使役动词及第一人称形式明确把将临的冰雹归于上帝的行动，不宜弱化为单纯的自然现象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”保留宣告的郑重感；分号使将要发生的灾祸与其空前程度之间的关系清晰。脚注标记均置于对应短语之后。
