  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: zh_hans
  text: 你们要向雅威祈求！上帝的雷声和冰雹[a]已经够了。我就放你们走，你们不必再留下来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“上帝的声音和冰雹”；这里的“声音”指暴风雨中的雷声。
    reason: 说明字面措辞及语境中的词义。
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: 祈求
  rationale: 这是 עתר 的使役形复数祈使式，在此指恳切向上帝求告或代求。“祈求”既传达迫切性，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，不以称号代替。
- source_word: וְרַב מִהְיֹת
  choice: 已经够了
  rationale: 这一表充足或过量的希伯来语表达，在语境中是法老请求灾害停止；“已经够了”自然、简洁，并保留其恳求语气。
- source_word: קֹלֹת אֱלֹהִים
  choice: 上帝的雷声
  rationale: קֹלֹת 字面为“声音”，但与冰雹并列且处于暴风灾害语境，所指是雷声。属格仍保留为“上帝的”，表达其神圣来源；脚注说明字面形式。
- source_word: וּבָרָד
  choice: 和冰雹
  rationale: בָּרָד 直接指冰雹。
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: 我就放你们走
  rationale: שלח 以百姓为宾语时，在《出埃及记》的语境中常指准许或释放他们离去；“就”自然表达前述祈求得到回应后的结果。
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: 你们不必再留下来了
  rationale: “不再加添站立”是“不再继续停留”的惯用表达。“不必再留下来了”在现代汉语中自然体现法老承诺不再扣留他们。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地按通常重构的读音音译四字神名，保留专名性质；不将其改译为“主”，也不借此加入宗派性解释。
- issue: קֹלֹת אֱלֹהִים 的含义
  choice: 上帝的雷声
  alternative: 上帝的声音
  rationale: 其字面结构可译“上帝的声音”，但冰雹灾害的气象语境清楚指向雷声。正文采用自然且符合语境的译法，脚注保留字面信息及其张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“祈求”体现法老恳切求告的语气；末句用“不必再留下来了”自然表达不再继续停留。脚注标记紧接其所解释的“雷声和冰雹”，避免与神名误连。
