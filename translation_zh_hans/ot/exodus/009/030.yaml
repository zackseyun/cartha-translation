  text: וְ/אַתָּ֖ה וַ/עֲבָדֶ֑י/ךָ יָדַ֕עְתִּי כִּ֚י טֶ֣רֶם תִּֽירְא֔וּ/ן מִ/פְּנֵ֖י יְהוָ֥ה אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: zh_hans
  text: 但至于你和你的臣仆，我知道你们至今仍未[a]惧怕雅威[b]上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“仍未惧怕”。希伯来语 טֶרֶם 在此表示“尚未”；按其基本时间义，也可理解为“在你们惧怕雅威上帝以前”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”音译希伯来文神名 YHWH；有些译本译作“耶和华”或以“主”代替。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: 但至于你
  rationale: 连词与独立代词合用，在上下文中形成转折并突出话题；“但至于你”自然保留这种语气。
- source_word: וַעֲבָדֶיךָ
  choice: 和你的臣仆
  rationale: עֶבֶד 可指仆人、奴仆或臣属；在法老宫廷的语境中，“臣仆”既体现从属身份，也不武断限定为奴隶或官员。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 完成式在此表达摩西现有且确定的判断，现代汉语用“我知道”最自然。
- source_word: כִּי
  choice: （不另译，以宾语分句表达）
  rationale: כִּי 引出“知道”的内容；汉语“我知道你们……”无需另加“即”或“就是”。
- source_word: טֶרֶם
  choice: 还没有
  rationale: 与未完成式连用时，语境中最自然地表示“尚未”；同时以脚注保留“在……以前”的句法可能。
- source_word: תִּירְאוּן
  choice: 惧怕
  rationale: ירא 可涵盖害怕、敬畏与尊崇；“惧怕”保留面对上帝审判时恐惧与敬畏之间的张力，避免只译成一般尊敬。
- source_word: מִפְּנֵי
  choice: （融入“惧怕”结构）
  rationale: 该介词在 ירא 的搭配中表达“在……面前/因面对……”；现代汉语直接说“惧怕雅威上帝”更自然，不损失核心关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现神名 YHWH，而不以“主”这一称号代替。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处与神名同位，构成“雅威上帝”；“上帝”是现代汉语中自然、庄重的表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH；“雅威”按其通常学术重构音译，保留专名性质，不以称号取代。
- issue: 面对上帝时 ירא 的语义
  choice: 惧怕
  alternative: 敬畏；害怕
  rationale: 本节既涉及法老面对审判的恐惧，也涉及他尚未正确承认上帝；“惧怕”较能保留这种双重张力，不把意义缩减为单纯尊敬或惊恐。
- issue: טֶרֶם 的时间关系
  choice: 还没有
  alternative: 在……以前；仍不
  rationale: 上下文表明摩西断定法老及其臣仆尚未产生对上帝应有的惧怕；正文采用自然的“还没有”，脚注保留原词可表示时间先后的歧义。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“臣仆”符合宫廷语境；“惧怕”刻意保留恐惧与敬畏之间的神学张力。脚注标记均置于正文对应词语之后。
