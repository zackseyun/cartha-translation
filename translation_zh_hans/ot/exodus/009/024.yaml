  text: וַ/יְהִ֣י בָרָ֔ד וְ/אֵ֕שׁ מִתְלַקַּ֖חַת בְּ/ת֣וֹךְ הַ/בָּרָ֑ד כָּבֵ֣ד מְאֹ֔ד אֲ֠שֶׁר לֹֽא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָ֖ז הָיְתָ֥ה לְ/גֽוֹי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: zh_hans
  text: 于是降下冰雹，又有火在冰雹中闪烁[a]。这场冰雹极其猛烈；自从埃及成为一国以来，埃及全境从未有过这样的冰雹。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又有火在冰雹当中窜动。”希伯来文直译为“火”，可能描写风暴中闪电般的火光。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: 于是降下冰雹
  rationale: 叙事性 וַיְהִי 在这里引出灾象；按现代汉语气象表达译作“于是降下冰雹”，既承接上下文，也自然呈现事件的发生。
- source_word: וְאֵשׁ
  choice: 又有火
  rationale: אֵשׁ 的字面义是“火”。虽然风暴语境可能指闪电般的火光，正文仍保留原文“火”的意象，不直接释作“闪电”。
- source_word: מִתְלַקַּחַת
  choice: 闪烁
  rationale: 该 Hitpael 分词描绘火在冰雹中不断跃动、闪现；“闪烁”符合现代汉语，也保留动态画面。
- source_word: בְּתוֹךְ הַבָּרָד
  choice: 在冰雹中
  rationale: בְּתוֹךְ 表示内部或当中；此译简洁地保留火出现在冰雹之中的奇特景象。
- source_word: כָּבֵד מְאֹד
  choice: 极其猛烈
  rationale: כָּבֵד 字面为“沉重”，用于风暴则表达强烈、严重；“极其猛烈”是自然的现代汉语气象用语。
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: 从未有过这样的冰雹
  rationale: 该关系从句表达前所未有的程度；补出“冰雹”可消除汉语指代含混，并与阳性单数 כָמֹהוּ 所指的 בָּרָד 呼应。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: 埃及全境
  rationale: 准确表达“埃及全地”，同时采用现代汉语中自然、凝练的地域说法。
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: 自从埃及成为一国以来
  rationale: 阴性动词 הָיְתָה 可回指“埃及地”；为符合汉语表达，以“埃及”作主语。לְגוֹי 表示成为一个国家或民族共同体，此处译作“成为一国”并保留历史基准的含义。
theological_decisions:
- issue: “火”是否直接解释为闪电
  choice: 正文保留“火”，脚注说明可能是风暴中的闪电般火光
  alternative: 正文直接译作“闪电”
  rationale: 原文明确使用 אֵשׁ“火”，而 מִתְלַקַּחַת 描绘其动态。保留“火”避免把可能的自然现象解释写死，同时脚注帮助现代读者理解该风暴意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“降下冰雹”符合汉语习惯；“火在冰雹中闪烁”保留原文鲜明而不寻常的意象。分号连接灾象的强度与其史无前例的比较，使句意清楚流畅。
