  yaml_path: translation/ot/exodus/009/031.yaml
  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: zh_hans
  text: 亚麻和大麦都被打倒了，因为大麦已经吐穗[a]，亚麻也已经含苞[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“大麦正在成熟”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“亚麻已经开花”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: 亚麻
  rationale: 指用来制作麻布的亚麻作物；“亚麻”是现代汉语中直接、自然的名称。
- source_word: הַשְּׂעֹרָה
  choice: 大麦
  rationale: 该词明确指大麦，是本节受灾的谷类作物。
- source_word: נֻכָּתָה
  choice: 都被打倒了
  rationale: 保留动词的被动含义，并自然表达冰雹击打作物所造成的结果；“都”照顾到汉语中复合主语的表达。原文动词本身没有明说施动者，因此正文不增添“被冰雹”。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出亚麻和大麦容易受损的原因；“因为”符合现代汉语的自然表达。
- source_word: אָבִיב
  choice: 已经吐穗
  rationale: 该词描述谷穗已经形成、尚青而逐渐成熟的生长阶段；“吐穗”保留具体的农业意象，同时脚注列出较概括的译法。
- source_word: גִּבְעֹל
  choice: 已经含苞
  rationale: 该词描述亚麻进入较成熟的生长阶段，具体可理解为长出花苞或开花；“含苞”简洁具体，又不作过度精确的植物学判定。
