  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: zh_hans
  text: 因为这一次，我要把我一切的灾祸降在你心上[a]，也降在你的臣仆和百姓身上，使你知道，在全地[b]没有谁能与我相比。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向着你的心。”原文可能表示这些灾祸直指法老本人，触及他内在的核心。
    reason: lexical_alternative
  - marker: b
    text: “全地”也可译作“全境”；这里按较广的范围理解，强调耶和华在全世界无可比拟。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，说明法老蒙保全并受警告的缘由；现代汉语用“因为”自然清楚。
- source_word: בַּפַּעַם הַזֹּאת
  choice: 这一次
  rationale: 表达当前这一轮行动，保留原文的时间与场合意味。
- source_word: שֹׁלֵחַ
  choice: 我要……降
  rationale: 分词在语境中表示即将实施的行动；“我要……降”符合汉语表达，也不过度限定为单纯将来时。
- source_word: כָּל מַגֵּפֹתַי
  choice: 我的一切灾祸
  rationale: מַגֵּפָה可指灾害、击打或惩罚；“灾祸”既切合灾难语境，也保留审判性，不把本句机械限定为此前各灾的简单总称。
- source_word: אֶל לִבְּךָ
  choice: 降到你心上
  rationale: 保留原文“向着／到心”的意象及其介词歧义，指向法老本人及其内在核心，也与硬心主题形成张力。
- source_word: וּבַעֲבָדֶיךָ
  choice: 也降到你的臣仆……身上
  rationale: 此处指法老手下的官员或臣属；“臣仆”比“奴隶”更符合该语境。
- source_word: וּבְעַמֶּךָ
  choice: 和百姓身上
  rationale: 指法老统治下的埃及百姓；在汉语并列结构中共享“降到……身上”。
- source_word: בַּעֲבוּר תֵּדַע
  choice: 使你知道
  rationale: 明确表达目的，且不把未完成式仅处理成简单未来结果。
- source_word: אֵין כָּמֹנִי
  choice: 没有谁能与我相比
  rationale: 自然表达希伯来语不可比拟的宣告，保留其绝对力度。
- source_word: בְּכָל הָאָרֶץ
  choice: 在全地
  rationale: אֶרֶץ可指土地、国土或全地；“全地”在中文圣经语体中自然，并保留一定范围弹性。
theological_decisions:
- issue: 上帝无可比拟这一宣告的范围
  choice: 正文译作“在全地”，主要传达普世范围
  alternative: “在全境／全地上”，理解为较局部的国土范围
  rationale: 灾祸叙事强调耶和华无可比拟；“全地”可承载这一普世分量，同时脚注说明原词也可有较局部含义，避免消除词义张力。
- issue: “到你心上”的含义
  choice: 保留“心”的隐喻，不释为单纯“攻击你本人”
  alternative: 意译为“降在你本人身上”或“攻击你”
  rationale: 原文明确使用“心”，可能指法老的内在核心，并与其心刚硬的叙事主题呼应；保留此意象而不武断界定具体灾祸机制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“臣仆”保留宫廷语境；“降到你心上”有意保留原文较不寻常的意象。所有脚注标记均置于正文相应位置。
