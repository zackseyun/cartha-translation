  text: כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת יָדִ֔/י וָ/אַ֥ךְ אוֹתְ/ךָ֛ וְ/אֶֽת עַמְּ/ךָ֖ בַּ/דָּ֑בֶר וַ/תִּכָּחֵ֖ד מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: zh_hans
  text: 因为到这时候，我本可以伸手，用瘟疫[a]击打你和你的百姓；你早已从地上灭绝了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译作：“因为现在我已经伸手，用瘟疫击打了你和你的百姓；你已经从地上灭绝了。”希伯来语动词的形式为过去式，但上下文强烈支持反事实的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为此前的话作解释；现代汉语用“因为”自然表达其因果、说明作用。
- source_word: עַתָּה
  choice: 到现在
  rationale: 在反事实语境中表示截至此时早已可能发生的事，比单用“现在”更清楚。
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: 我本可以伸手
  rationale: “伸手”保留希伯来语表示施行大能或审判的惯用表达；“本可以”依据上下文表达过去未实现的反事实含义。
- source_word: וָאַךְ
  choice: 击打
  rationale: נכה在灾祸和审判语境中意为击打、打击；“击打”庄重自然，并保留原文力度。
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: 你和你的百姓
  rationale: 直接对应两个受词，清楚保留法老与其百姓同为审判对象。
- source_word: בַּדָּבֶר
  choice: 用瘟疫
  rationale: דֶּבֶר在此特指致命的传染性灾病；“瘟疫”比泛称的“灾”或“灾祸”更准确。
- source_word: וַתִּכָּחֵד
  choice: 使你……被除灭
  rationale: כחד的Niphal形表达被消灭、被除去；“被除灭”保留其严重程度，并以“使”自然连接反事实结果。
- source_word: מִן־הָאָרֶץ
  choice: 从地上
  rationale: 既保留אֶרֶץ可指大地的广泛含义，也符合现代汉语“从地上除灭”的自然表达。
theological_decisions:
- issue: 动词序列的反事实含义
  choice: 译为过去未实现的可能情况：“我本可以……使你……被除灭”
  alternative: 按形式直译为简单过去：“我现在已经伸手……你也从地上被除灭了”
  rationale: 希伯来语动词形式虽为完成式及叙事形式，但紧接的第16节说明法老仍被保留，为要显明上帝的大能；因此这里最自然地表达上帝原本早已可以施行、却没有如此施行的审判。脚注保留形式直译的可能性，避免掩盖原文形式与语境解释之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“本可以”清楚表达反事实语气；保留“伸手”“击打”“除灭”等具有原文意象和审判力度的措辞。
