  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: zh_hans
  text: 看哪，耶和华的手将临到你在田野的牲畜，就是马、驴、骆驼、牛群和羊群；这将是一场极其严重的疫病[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“瘟疫”或“灾疫”；希伯来语词指致死性的疫病，此处所及的是牲畜。
    reason: 说明דֶּבֶר的可选译法及其在本节中的牲畜对象，避免把该词义过度限定为特定现代医学分类。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意并加强宣告紧迫感的功能；“看哪”庄重而为现代中文读者所熟悉。
- source_word: יַד יְהוָה
  choice: 耶和华的手
  rationale: 保留希伯来语中表示上帝能力与审判作为的具体意象，不将其意译为笼统的行动。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接呈现四字神名在现代简体中文圣经传统中通行且可辨识的译名。
- source_word: הוֹיָה
  choice: 必临到
  rationale: 在此预告语境中表达即将发生且确定的行动；“临到”也自然地与“耶和华的手”搭配。
- source_word: בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  choice: 你田野间的牲畜
  rationale: מִקְנֶה泛指家畜而不只指牛；关系从句限定受灾的是在田野间的牲畜。
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: 就是马、驴、骆驼、牛群和羊群
  rationale: 依原文顺序保留各类牲畜；בָּקָר与צֹאן为集合名词，译作“牛群”和“羊群”体现其集合意义。
- source_word: דֶּבֶר
  choice: 瘟疫
  rationale: 该词指造成大量死亡的疫病；此处对象是牲畜，“瘟疫”准确而自然，并以脚注说明其范围。
- source_word: כָּבֵד מְאֹד
  choice: 极其严重
  rationale: 按语境表达“非常沉重”的强度含义，避免生硬直译。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；“耶和华”是现代中文读者最熟悉且通行的专名译法，同时不以“主”替代该名字。
- issue: “耶和华的手”的理解
  choice: 保留身体意象“手”
  alternative: 意译为“耶和华的能力／审判”
  rationale: 原文意象兼含能力、介入和审判，不宜在正文中只固定为其中一种解释。
translation_notes:
  register: 采用现代、庄重、清楚的普通话书面语。保留“看哪”“耶和华的手”等原文修辞和意象，同时用“牲畜”“极其严重”等自然表达避免古奥。为使中文句法清晰，将末尾的“瘟疫”处理为第二分句的主语；这不改变原文所宣告的因果与施行者关联。
