base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: zh_hans
  text: 但小麦和粗麦[a]没有被击毁，因为它们成熟得较晚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “粗麦”所译的希伯来语，可能指斯佩尔特小麦，也可能指二粒小麦等近缘谷物。
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: 但小麦
  rationale: חִטָּה指小麦；前缀וְ字面为“和”，此处承接上一节并形成对比，现代汉语用“但”更自然。
- source_word: וְהַכֻּסֶּמֶת
  choice: 和粗麦
  rationale: כֻּסֶּמֶת指一种古代谷物，通常理解为斯佩尔特小麦或二粒小麦；正文采用较通俗的类属名称“粗麦”，脚注说明具体鉴定的不确定性。
- source_word: לֹא נֻכּוּ
  choice: 没有被打倒
  rationale: 这是נכה的被动形式，指庄稼没有被冰雹击打倒伏；“被打倒”保留原文受击打的力度。
- source_word: כִּי
  choice: 因为
  rationale: כִּי在此引出这两种作物未被打倒的原因。
- source_word: אֲפִילֹת הֵנָּה
  choice: 它们成熟得晚
  rationale: 该阴性复数谓语在农业语境中表示作物发育较迟、尚未成熟；“成熟得晚”自然地表达其语境意义，同时不把它过度具体化为某一生长阶段。
theological_decisions: []
