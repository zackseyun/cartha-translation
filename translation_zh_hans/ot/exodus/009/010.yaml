revisions:
- from: 他们取了窑里的烟灰，站在法老面前；摩西把烟灰撒向天空，烟灰就变成了疮，起着水疱，发作在人和牲畜身上。
  to: 他们取了窑里的烟灰，站在法老面前；摩西把烟灰撒向天空，于是人和牲畜身上就长出带水疱的疮。
  rationale: 修订仅调整末句的汉语句法与病症描述关系。“于是”自然承接原文结果性叙述；“人和牲畜身上就长出带水疱的疮”保留疮、水疱及其在人和牲畜身上爆发的核心意义。
