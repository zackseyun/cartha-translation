base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: zh_hans
  text: 他们取了窑里的烟灰，站在法老面前；摩西把烟灰撒向天空，于是人和牲畜身上就长出带水疱的疮。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּיחַ
  choice: 烟灰
  rationale: 指窑炉产生的细黑粉末；“烟灰”比泛指燃烧残余物的“灰烬”更贴近原词，也适合现代汉语。
- source_word: הַכִּבְשָׁן
  choice: 窑
  rationale: 该词可指窑或炉；这里是取得烟灰之处，“窑”具体、自然，同时不排除工业炉窑的含义。
- source_word: לִפְנֵי פַרְעֹה
  choice: 站在法老面前
  rationale: 准确表达在法老面前、当着法老的面站立。
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: 摩西把烟灰撒
  rationale: 原动词基本义为投掷；烟灰是粉末状物质，汉语用“撒向”可自然表达将其抛出的动作，而不额外规定撒布范围。重复“烟灰”可避免代词指代含混。
- source_word: הַשָּׁמָיְמָה
  choice: 向天空
  rationale: 方向词尾表示朝上、朝天空而去；“向天空”保留物理方向，不额外赋予神学含义。
- source_word: שְׁחִין
  choice: 疮
  rationale: 指发炎的皮肤疮疖；“疮”简明、庄重，并与后面的水疱说明自然衔接。
- source_word: אֲבַעְבֻּעֹת
  choice: 起着水疱
  rationale: 该复数名词指水疱或脓疱；译作“起着水疱”保留其可见病症，不扩大为“溃烂”。
- source_word: פֹּרֵחַ
  choice: 发作
  rationale: 该分词本义有萌发、绽出之意，在皮肤病语境中表示疮疹爆发；“发作”是自然的现代医学表达。
- source_word: בָּאָדָם
  choice: 在人……身上
  rationale: אָדָם在此为集合用法，与牲畜相对，泛指人类；现代汉语用“人”即可自然涵盖所有人。
- source_word: וּבַבְּהֵמָה
  choice: 和牲畜身上
  rationale: בְּהֵמָה是集合单数，通常指家畜或大型陆生动物；灾祸叙事中“牲畜”比泛称“动物”更贴合语境。
theological_decisions:
- issue: אָדָם在“人—牲畜”对举中的集合意义
  choice: 人
  alternative: 人类
  rationale: 原文单数在此泛指人，与牲畜构成类别对举；“人”在现代汉语中既简洁又不带仅指男性的含义。
- issue: הַשָּׁמָיְמָה的空间或神学表达
  choice: 向天空
  alternative: 向天
  rationale: 该处首先描述摩西将烟灰向上撒出的方向；“向天空”清楚保留空间意义，避免把动作解释为特指上帝居所。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留原文动作顺序及“人和牲畜”的集合性对举；用“疮，起着水疱”呈现两个相邻病症词之间略显紧密但未完全确定的关系，不将其过度医学化。
