  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: zh_hans
  text: 法老的臣仆中，凡敬畏雅威话语的人，都赶紧把自己的仆人和牲畜带进房屋里[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“法老的臣仆中，那敬畏雅威话语的人。”
    reason: 希伯来文以定冠词加分词表示“那敬畏的人”，在本句中可理解为对这一类人的概括。
  - marker: b
    text: “赶紧把……带进”原文直译为“使……逃走”，这里指迅速使他们进入房屋躲避。
    reason: 说明 הֵנִיס 的使役字面意义及其在本语境中的自然表达。
lexical_decisions:
- source_word: הַיָּרֵא
  choice: 凡……的
  rationale: 定冠词加分词构成实体化表达，指法老臣仆中所有属于“敬畏”这一类的人；“凡……的”在现代汉语中自然表达这种类别和概括意义。
- source_word: דְּבַר יְהוָה
  choice: 雅威话语
  rationale: דָּבָר在此可指“话”或“信息”；“话语”保留圣经惯用表达，又不把内容缩窄为仅仅“警告”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通常学术拟音译为“雅威”，保留其作为专名的性质，不以“主”这一称号替代。
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: 法老的臣仆中
  rationale: 介词מִן在这里表示整体中的一部分；“……中”准确而自然地表达法老臣仆这一群体中的人。
- source_word: הֵנִיס
  choice: 赶紧把……带进
  rationale: נוּס的使役式本义为“使逃走”；结合冰雹将临、人员牲畜被移入房屋避灾的语境，“赶紧把……带进”自然传达使役动作和紧迫感，同时以脚注保留字面意义。
- source_word: עֲבָדָיו
  choice: 自己的仆人
  rationale: עֶבֶד可指奴隶或仆役；本节重点是法老臣仆所管辖的人员，“仆人”符合上下文，也避免无根据地把社会身份限定得过窄。
- source_word: מִקְנֵהוּ
  choice: 牲畜
  rationale: מִקְנֶה泛指家养财产性动物；“牲畜”比“牛”范围更准确。
- source_word: אֶל הַבָּתִּים
  choice: 带进房屋里
  rationale: אֶל在移动动词后表示趋向或进入，הַבָּתִּים为复数；汉语“房屋”本身不强制标示单复数，既自然，又未将原文明确改成单数“一所房子”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”按其通常拟音保留神的专名；“主”会以称号取代专名，“耶和华”则是中文传统形式，但不如“雅威”贴近YHWH的通行学术复原。
- issue: “敬畏雅威话语”的含义
  choice: 保留“敬畏”而不释义为“相信”或“听从”
  alternative: 相信雅威的警告；听从雅威的话
  rationale: יָרֵא直接表达敬畏或惧怕；上下文虽显示这种敬畏产生了行动，却不应在正文中把它缩减为单一的认知或顺从概念。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“臣仆”用于法老属员，“仆人”用于他们各自管辖的人员，以帮助读者辨明两层关系；句式简洁，并保留原文的群体概括、神名和动作紧迫感。
