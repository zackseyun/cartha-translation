base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: zh_hans
  text: 耶和华定了一个时间[a]，说：“明天，耶和华要在这地做这事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一个指定的时间”或“一个定好的时间”。
    reason: מוֹעֵד可指指定、约定或确定的时间；正文译为“一个时间”，并由下文“明天”说明其具体时点。
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 定下了
  rationale: 此处 שׂוּם 表示设定、确定；“定下”与“日期”搭配自然，也保留了主动确定的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中广为人知的专名“耶和华”呈现四字神名，而不以称号替代。
- source_word: מוֹעֵד
  choice: 一个日期
  rationale: מוֹעֵד 在这里指已经指定的时间；下文“明天”表明这是具体日期。“日期”比泛指的“时间”更贴合语境，脚注保留“指定的时间”这一词义。
- source_word: לֵאמֹר
  choice: 说
  rationale: 按希伯来叙事惯例，自然地引出直接引语。
- source_word: מָחָר
  choice: 明天
  rationale: 直接表达行动发生的时间，简洁忠实。
- source_word: יַעֲשֶׂה
  choice: 要……施行
  rationale: עשה 基本义宽泛；在这里指耶和华实施所宣告的灾祸。“施行这事”比“做这事”更庄重自然，但不具体增添灾祸或审判等解释。
- source_word: הַדָּבָר הַזֶּה
  choice: 这事
  rationale: דָּבָר 在语境中指刚宣告的行动；“这事”既自然，也保留原词较宽的指称范围。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: 定冠词所指的土地由上下文确定为埃及；“这地”保留原文不明说“埃及”的表达，也符合中文叙事。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次直接使用四字神名。简体中文圣经语境中“耶和华”是最通行、最易识别的专名形式，能够保留其作为名字而非称号的功能；“雅威”更接近部分现代学术重构的读音，但普通读者熟悉度较低。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“定下了一个日期”明确表达 מוֹעֵד 的指定性；“施行这事”保留 עשה 与 דָּבָר 的宽泛表达，避免把上下文中的灾祸或审判明写进本节。
