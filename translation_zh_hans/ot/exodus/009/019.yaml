    issue: 首句的紧急语气只置于脚注，正文未明确体现。
    rationale: הָעֵז所带出的催促／紧急语气是该命令的重要语义；在中文正文加入“赶紧”可比仅靠脚注更充分地传达原文。
  - severity: low
    issue: “派人”属于解释性补足，“安置到安全的地方”略抽象。
    rationale: 原文命令可理解为差遣／传令并使田野中的财物获得庇护，但没有明说具体受遣者。用“传令”较少预设执行者，并保留行动命令的开放性。
