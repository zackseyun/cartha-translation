revisions:
- from: 所以现在，你要派人把牲畜和田野里属于你的一切都安置到安全的地方[a]。凡仍在田野、没有收进屋里的人和牲畜，冰雹必降在他们身上，他们就会死。
  to: 所以现在，你要赶紧传令，把你的牲畜和田野里属于你的一切带到安全的地方[a]。凡在田野里、没有被收进屋内的人和牲畜，冰雹必降在他们身上，他们就会死。
  rationale: 修订在不把原文含混的命令过度具体化为“派人”的前提下，保留其差遣／传令和紧急行动的含义；并将紧迫性纳入正文。后半节仅作语序与被动表达的自然化调整，未改变人、牲畜、田野、屋内、冰雹及死亡后果的语义关系。
