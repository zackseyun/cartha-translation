base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: zh_hans
  text: 所以现在，你要赶紧传令，把你的牲畜和田野里属于你的一切带到安全的地方[a]。凡在田野里、没有被收进屋内的人和牲畜，冰雹必降在他们身上，他们就会死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赶紧传令，把……带到安全的地方”所译的希伯来语命令也可理解为“派人赶快把……带走”。该命令既可指传达指令，也带有催促、紧急的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 既保留连接前文的 וְ，也表达 עַתָּה 所引出的即时行动。
- source_word: שְׁלַח הָעֵז
  choice: 你要派人把……安置到安全的地方
  rationale: שְׁלַח 表示派遣，הָעֵז 在此要求使牲畜和财物得到庇护、脱离危险；汉语合译可自然表达派人执行这一命令。其词义也可能侧重催促行动，故以脚注保留。
- source_word: מִקְנְךָ
  choice: 你的牲畜
  rationale: מִקְנֶה 指作为产业饲养的牲畜；“牲畜”是准确、通行的现代汉语。
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: 和田野里属于你的一切
  rationale: 保留原文宽泛范围，不擅自限定为某一类财物。
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: 凡……的人和牲畜
  rationale: אָדָם 在这里泛指人，与 בְּהֵמָה 构成人与牲畜的对应；“人”在现代汉语中自然涵盖所有人。
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: 仍在田野、没有收进屋里
  rationale: 以“仍在”自然表达“被发现位于田野”的状态；“收进”保留 אָסף 尼法勒式的被动聚拢含义，הַבַּיְתָה 表示朝屋内的方向。
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: 冰雹必降在他们身上
  rationale: 保留 יָרַד 的下降意象以及 עֲלֵהֶם“在他们身上”的指向；“必”表达警告中确定的后果。
- source_word: וָמֵתוּ
  choice: 他们就会死
  rationale: 表达冰雹降下所导致的直接结果，语言庄重而自然。
theological_decisions:
- issue: אָדָם 在普遍性警告中的指称
  choice: 人
  alternative: 男人／每个人
  rationale: 此处 אָדָם 是集合性、泛指性的用法，警告田野中的所有人；汉语“人”既忠实又不额外限定性别。
- issue: 灾祸后果的确定性
  choice: 冰雹必降……他们就会死
  alternative: 冰雹会降……他们会死
  rationale: 上下文是上帝所发出的确定警告；“必”并未增添新的神学内容，而是自然呈现预告的确定语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“田野”与“屋里”保持原文户外和遮蔽处的鲜明对比；不用古雅的“人畜”“必死”等压缩表达，以免牺牲自然度。
