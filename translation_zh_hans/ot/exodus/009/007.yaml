base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: zh_hans
  text: 法老派人去查[a]，发现以色列人的牲畜连一头也没有死。可是法老的心变得刚硬[b]，他不肯让百姓离开。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文只说“法老派遣”，没有说明他派了谁或做什么；“人去查”是根据下文所报告的结果按语境补出的。
    reason: implicit_object
  - marker: b
    text: 希伯来文直译为“法老的心变得沉重”；这是形容他顽固、不肯顺服的说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去查
  rationale: שׁלח本义为“派遣”，希伯来文省略了受派者和具体任务；结合下文所报告的查证结果，中文补出“人”和“去查”，使语意自然，同时用脚注说明原文的简略表达。
- source_word: וְהִנֵּה
  choice: 果然
  rationale: הִנֵּה在这里引出法老派人后发现的事实。“果然”自然地表达查证所得并保留叙事中的强调作用，比直译“看哪”更符合现代汉语语境。
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: 以色列人的牲畜连一头也没有死
  rationale: מִקְנֶה泛指牲畜，并不限于牛；עַד אֶחָד在否定句中强调“连一个也没有”。“连一头也没有死”准确而自然。
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: 法老的心变得刚硬
  rationale: 原文直译为“法老的心变得沉重”，在本叙事中表示顽固、不肯顺服。中文若译“心变得沉重”容易被理解为悲伤，因此正文采用“变得刚硬”，并在脚注保留原有意象；“变得”也不额外指定造成刚硬的行动者。
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: 他不肯让百姓离开
  rationale: שׁלח以百姓为宾语时，在出埃及叙事中表示准许或释放他们离开。“不肯让百姓离开”兼顾其拒绝的意志和现代中文的自然表达。
theological_decisions:
- issue: 法老之心刚硬的施动者
  choice: 法老的心变得刚硬
  alternative: 法老使自己的心刚硬；法老的心被刚硬了
  rationale: 本句以“法老的心”为主语，描述它变得沉重或刚硬，却没有明说外在施动者，也没有使用反身表达。译作“变得刚硬”保留了有关神与法老人类责任之间的张力，不替原文指定施动者。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“果然”承接查证行动，“心变得刚硬”避免将“沉重”误解为悲伤，并保留原文未明确施动者的表达。
