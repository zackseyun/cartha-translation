  text: וַ/יִּשְׁלַ֣ח פַּרְעֹ֗ה וַ/יִּקְרָא֙ לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֔ן וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם חָטָ֣אתִי הַ/פָּ֑עַם יְהוָה֙ הַ/צַּדִּ֔יק וַ/אֲנִ֥י וְ/עַמִּ֖/י הָ/רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: zh_hans
  text: 于是，法老派人召来摩西和亚伦，对他们说：“这一次我犯了罪。耶和华是公义的[a]，我和我的百姓是邪恶的[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“耶和华是对的”或“耶和华是正义的”。
    reason: הַצַּדִּיק 既可描述公义的品格，也可在司法性对比中表示“有理、正确”。
  - marker: b
    text: 也可译作“我和我的百姓是有罪的”或“是理亏的”。
    reason: הָרְשָׁעִים 可指邪恶者，也可指被判为有罪或无理的一方。
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: 派人召来
  rationale: 原文依次使用“派遣”和“召唤”两个动词；汉语用“派人召来”既保留法老差遣人的动作，也自然表达摩西和亚伦被召到他面前。
- source_word: חָטָאתִי הַפָּעַם
  choice: 这一次我犯了罪
  rationale: “这一次”对应 הַפָּעַם，保留法老把认罪限定于当前这次灾祸的措辞；“犯了罪”直接表达完成动作及当下的承认。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是希伯来文四字神名；采用现代中文圣经读者熟悉的音译“耶和华”，不以“主”这一称号代替原文专名。
- source_word: הַצַּדִּיק
  choice: 是公义的
  rationale: 该形容词可指公义、正直或在争议中有理；“是公义的”保留其道德和司法分量，并由脚注注明语境性译法。
- source_word: הָרְשָׁעִים
  choice: 是邪恶的
  rationale: 复数形容词与“我和我的百姓”相应，表达道德罪责，不仅是判断错误；中文谓语无需显式标出复数。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。正文保留中文传统音译“耶和华”，而不以称号替换；“雅威”是另一种较接近学术重构读音的音译。
- issue: 法老对耶和华及自身的对比性判断
  choice: 耶和华是公义的；我和我的百姓是邪恶的
  alternative: 耶和华是对的；我和我的百姓有罪／理亏
  rationale: 原文以“公义者”和“邪恶者”形成鲜明的道德—司法对照。正文保留较强的伦理措辞，脚注同时呈现可由当前争讼语境支持的关系性理解，避免把歧义静默消除。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“于是”承接叙事；“派人召来”避免生硬照搬两个连续动词。正文保留“公义／邪恶”的强烈对照，并以脚注说明司法语境下的其他可能译法。
