revisions:
- from: 雅威对摩西说：“你向天空[a]伸出手，让冰雹降在埃及全地，落在人[b]、牲畜和埃及地田间的一切植物上。”
  to: 雅威对摩西说：“你向天空[a]伸出手，让冰雹遍降埃及全地，落在人[b]、牲畜和埃及地田间的一切植物上。”
  rationale: 仅作安全的汉语行文修订：“遍降埃及全地”更自然地传达冰雹遍及全地的范围，“落在”则顺畅引出人、牲畜和植物这些对象。神名、语气、地点重复、词义范围及脚注锚点均维持不变。
