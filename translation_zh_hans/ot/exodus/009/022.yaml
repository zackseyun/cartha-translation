  naturalness: “向天空伸出手”自然庄重。将“让冰雹降在埃及全地，落在……”改为“让冰雹遍降埃及全地，落在……”可清楚表达全面范围及随后的受击对象，读来更符合现代标准汉语。
  terminology: “雅威”适当地对应יהוה；“人”保留אָדָם的泛指并与“牲畜”相对；“牲畜”及“田间的一切植物”均适合此灾祸和农业语境。脚注准确说明“天空/天”的词义可能性及“人”的泛指意义。
