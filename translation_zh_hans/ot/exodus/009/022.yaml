  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你向天空[a]伸出手，让冰雹遍降埃及全地，落在人[b]、牲畜和埃及地田间的一切植物上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天”。原词既可指“天空”，也可指“天”；这里的语境是冰雹从可见的天空降下。
    reason: lexical_alternative
  - marker: b
    text: 这里的“人”泛指人类，与“牲畜”相对，并非只指男性。
    reason: lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字的普通话音译，不以“主”这一称号替代原文的专名。
- source_word: נְטֵה אֶת יָדְךָ
  choice: 伸出手
  rationale: 准确表达命令式“伸展你的手”，也是自然、庄重的现代汉语。
- source_word: עַל הַשָּׁמַיִם
  choice: 向天空
  rationale: 介词在此表示动作方向；שָׁמַיִם 在冰雹语境中指可见的天空，同时以脚注保留“天”的可能译法。
- source_word: וִיהִי בָרָד
  choice: 让冰雹降在
  rationale: 保留意愿式所表达的命令或预期结果；“降在”符合冰雹从天而降的语境，而不把句法关系过度解释为单纯因果。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: 在埃及全地
  rationale: 简明保留范围的全面性。
- source_word: הָאָדָם
  choice: 人
  rationale: 此处是集合性、泛指的用法，与牲畜相对，指所有人类个体，并非特指男性。
- source_word: הַבְּהֵמָה
  choice: 牲畜
  rationale: 在灾害叙事和田野场景中，该词主要指家养动物；“牲畜”比“兽”更符合现代汉语语境。
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: 田间的一切植物
  rationale: עֵשֶׂב 可泛指草本、作物或田野植物；此译法自然且保持其范围，不限于“蔬菜”或“药草”。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: 保留原文末尾对地点的重复，以维持强调和范围界定。
theological_decisions:
- issue: 神圣名字 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”直接音译四字神名，保留其作为以色列之神专名的性质；不采用称号替代，也不据宗派传统选定另一种历史音译。
- issue: הָאָדָם 的集合性含义
  choice: 人
  alternative: 人类；世人
  rationale: 原文单数名词在这里具有泛指和集合意义，并与“牲畜”形成对照。“人”既贴近原文形式，也不会在现代汉语中限定为男性。
- issue: וִיהִי 的命令或结果语气
  choice: 让冰雹降在
  alternative: 于是冰雹就会降在；使冰雹降在
  rationale: 该形式可表达所愿或所命之事，也可在前一命令后引出结果；“让”保留这种语气张力，避免把它完全改写成预测或明确的使役关系。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准普通话。保留“埃及”地点范围的首尾重复，并以“落在……上”清楚连接冰雹所击打的人、牲畜和植物。
