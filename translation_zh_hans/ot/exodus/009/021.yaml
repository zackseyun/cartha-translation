  text: וַ/אֲשֶׁ֥ר לֹא שָׂ֛ם לִבּ֖/וֹ אֶל דְּבַ֣ר יְהוָ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: zh_hans
  text: 但那不把雅威的话放在心上的人，把自己的仆人和牲畜留在田野里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不留意雅威的话。”原文直译为“没有把心放向雅威的话”，意思是没有把这话放在心上、认真看待。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: 但那……的人
  rationale: 承接上一节并形成对比，同时保留不定关系结构；现代汉语中自然流畅。
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: 不把……放在心上
  rationale: 较贴近希伯来语“没有把心放向……”这一习语，也自然表达没有认真看待、没有听从警告的意思。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: דָּבָר 在这里指雅威所发出的警告；“话”保留常见的圣经表达，也不排除“信息、吩咐”的语义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留原文所用的专名，而不以称号替代。
- source_word: וַיַּעֲזֹב
  choice: 仍把……留在
  rationale: 动词表示“留下、任其留在”；加入“仍”明确表现他们听见警告后依旧让仆人和牲畜留在田野中的语境关系。
- source_word: עֲבָדָיו
  choice: 自己的仆人
  rationale: עֶבֶד 可指奴隶或仆役；本节着重其作为主人家中人员被留在户外，译作“仆人”较符合语境，同时避免武断限定其法律身份。
- source_word: מִקְנֵהוּ
  choice: 牲畜
  rationale: 该集合名词泛指所饲养的家畜，“牲畜”是准确而自然的现代汉语对应词。
- source_word: בַּשָּׂדֶה
  choice: 在田野里
  rationale: 准确表达地点，并由上下文体现其暴露在冰雹之下。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”以专名形式呈现，不以称号替换，同时符合其较通行的学术拟音。
- issue: לֹא שָׂם לִבּוֹ אֶל 所表达的责任
  choice: 不把……放在心上
  alternative: 不留意；不理会
  rationale: 保留原文“心”的习语色彩，并表达这并非单纯没有听见，而是没有认真看待雅威的话；不进一步断定其内在动机。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“放在心上”既自然又保留希伯来语习语的形象；“田野里”比单说“田里”更能涵盖牲畜所在的露天场地。主文中的脚注标记置于句末。
