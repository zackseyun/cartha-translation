  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: zh_hans
  text: 于是耶和华对摩西说：“你到法老那里去，对他说：‘耶和华——希伯来人的上帝——这样说：放我的子民走，好让他们事奉我。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事连续式在本节自然译作“说”；不机械添加“然后”，以符合现代汉语叙事习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，区别于通称“主”。
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: 你到法老那里去
  rationale: 希伯来语字面为“到/进入法老那里”；此处指前往法老面前，译文避免生硬的“进去见法老”。
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: 对他说
  rationale: 准确表达向法老传话的动作，并与现代汉语直接引语自然衔接。
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: 希伯来人的上帝
  rationale: 保留属格关系及群体称谓，不扩展为其他身份说明。
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: 放我的子民走
  rationale: 使役动词在语境中要求法老准许以色列人离开；“子民”体现盟约群体语感。
- source_word: וְיַעַבְדֻנִי
  choice: 好让他们事奉我
  rationale: עבד在宗教语境中兼有服事、敬拜之意；“事奉”保留其较宽含义，目的关系由“好让”自然表达。
theological_decisions:
- issue: 神名四字母词 יְהוָה 的译法
  choice: 耶和华
  alternative: 主／雅威
  rationale: “耶和华”是简体中文圣经传统中广为识别的专名形式，也保留本节神名与“上帝”这一称号之间的区别。
- issue: עבד 的宗教含义
  choice: 事奉
  alternative: 敬拜／服侍
  rationale: 本词既可涉及礼仪敬拜，也可泛指归属于神的服事；“事奉”不把含义缩窄为单一礼仪行为。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。保留神谕公式“这样说”和嵌套引语结构；以破折号标明“希伯来人的上帝”是对“耶和华”的同位说明。
