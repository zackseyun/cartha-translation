source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: zh_hans
  text: 但雅威要把以色列的牲畜和埃及的牲畜区别对待；以色列人的牲畜，一头也不会死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְלָה
  choice: 要……分别开来
  rationale: 该词是 פלא 的使役形，在这里表示使两类对象有明确区别或分隔。“分别开来”既体现使役含义，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名直接音译为“雅威”，保留其作为上帝专名的性质，而不以称号替代。
- source_word: בֵּין ... וּבֵין
  choice: 把……和……分别开来
  rationale: 以自然的汉语句式表达希伯来语“在……与……之间”的对举关系。
- source_word: מִקְנֵה
  choice: 牲畜
  rationale: 该词泛指家养牲畜，并不限于牛；“牲畜”在本段灾祸语境中范围恰当。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 保留原文的国家或群体称谓“埃及”，形成“埃及的牲畜”这一自然表达。
- source_word: וְלֹא יָמוּת
  choice: 一头也不会死
  rationale: 保留否定和将来语气；根据前文“牲畜”的语境，以量词“头”自然表达死亡对象。连接处采用分号，不额外把原文并列关系限定为目的或结果。
- source_word: מִכָּל ... דָּבָר
  choice: 一头也不
  rationale: 否定结构与单数 דָּבָר 合用，表示无一例外。中文按牲畜语境译为“一头也不”，比直译“一件东西也不”更清楚自然。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 属于以色列人的
  rationale: 介词 ל 在此表达归属；בְּנֵי יִשְׂרָאֵל 是以色列民族的固定称谓。中文“以色列人”准确自然，无须机械译成“以色列的众子”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名，而非普通称号。“雅威”直接反映该神名较通行的学术拟音，并保留专名性质。
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 这里的传统父系表达指整个民族群体，并非只强调男性后裔；“以色列人”在现代汉语中准确、清楚，也不加入额外神学限定。
- issue: 末句与前句的逻辑关系
  choice: 用分号保留并列后果，不明说目的或结果
  alternative: 以“因此”或“使得”连接
  rationale: 希伯来语仅以 וְ 连接，语境可理解为区别所产生的结果，但原句没有专门的目的或结果连词；采用分号可避免过度释义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“牲畜”准确覆盖 מִקְנֵה；末句用“一头也不会死”使中文自然，并保留原文无一例外的强调。
