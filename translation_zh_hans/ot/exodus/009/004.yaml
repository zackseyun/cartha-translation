  to: 但雅威要把以色列的牲畜和埃及的牲畜区别对待；以色列人的牲畜，一头也不会死。
  rationale: 修订仅明确末句所指的牲畜，并将“分别开来”调整为更贴合此处“作出区别”的“区别对待”。保留雅威这一专名、牲畜的广义范围、以色列人的民族称谓，以及“无一死亡”的强调；原文无需脚注。
