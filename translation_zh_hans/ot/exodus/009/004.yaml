review_pass:
  verdict: revise
  source_fidelity: 首句准确传达雅威将在以色列与埃及的牲畜之间作出区分。末句的“一头也不会死”也恰当保留了否定的无一例外含义；但“凡属于以色列人的”在汉语中可泛指一切属于以色列人的事物，未明确限定为牲畜，因而弱化了原文在本句中所指的对象。
  naturalness: “以色列人的牲畜，一头也不会死”更简洁自然，且避免“凡……的，一头……”所造成的指代范围和搭配不够严整的问题。
  terminology: “雅威”“牲畜”“以色列人”均符合原文及现代汉语书面语。“区别对待”自然表达使役动词“作出区分”，不暗示单纯将牲畜在空间上分开。
  issues:
