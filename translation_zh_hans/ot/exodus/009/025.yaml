base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: zh_hans
  text: 冰雹在埃及全地击打田野里的一切，从人到牲畜。冰雹击打了田野里所有的植物，又打断了田野里所有的树木。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: 击打
  rationale: 两个动词同出于נכה，译为“击打”既保留重复，也自然表达冰雹造成的猛烈伤害。
- source_word: הַבָּרָד
  choice: 冰雹
  rationale: 直接、准确地指这一自然现象；原文两次明说“冰雹”，译文保留其重复和强调。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: 埃及全地
  rationale: 简洁自然地表达灾害遍及埃及境内；“全地”保留כָּל的全面范围。
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: 田野里的一切
  rationale: 保留כָּל אֲשֶׁר的总括性，也保留灾害对象位于田野中的限定。
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: 从人到牲畜
  rationale: “从……到……”保留原文表示完整范围的结构；אָדָם在此泛指人，בְּהֵמָה在农业及灾害语境中以“牲畜”最贴切。
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: 田野里所有的植物
  rationale: עֵשֶׂב可泛指草木、田间植物或植被；“植物”现代易懂，并避免将其过窄地限定为草或香草。
- source_word: עֵץ הַשָּׂדֶה
  choice: 田野里所有的树木
  rationale: 准确保留田野范围及כָּל所表达的全面性。
- source_word: שִׁבֵּר
  choice: 打断
  rationale: 该动词的强化词形表达猛烈破坏；树木遭冰雹击打时，“打断”比笼统的“毁坏”更具体，也比“粉碎”更符合现代汉语搭配。
theological_decisions:
- issue: אָדָם在“从人到牲畜”这一范围表达中的译法
  choice: 人
  alternative: 人类／众人
  rationale: 此处אָדָם泛指人，与牲畜构成从人到动物的完整范围，并非特指男性；现代汉语“人”既准确又不额外加入性别含义。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。保留原文两次出现“冰雹”和“田野”的重复，不以文体润色削弱灾害范围与力度；本节无需脚注。
