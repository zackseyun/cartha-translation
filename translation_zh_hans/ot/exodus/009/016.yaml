source:
  edition: WLC
  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: zh_hans
  text: 然而，我让你存留，正是为了向你显明我的能力[a]，并使我的名传遍全地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “让你存留”或译“使你站立”或“兴起你”。希伯来语可指使法老继续站立或存留；结合上下文，很可能是说上帝保全他，没有立刻消灭他。
    reason: 保留使役动词的语义幅度及传统替代读法。
lexical_decisions:
- source_word: וְאוּלָם
  choice: 然而
  rationale: 表示与上文强烈转折；“然而”庄重自然，准确保留逆接语气。
- source_word: בַּעֲבוּר זֹאת
  choice: 正是为了
  rationale: 引出目的而非单纯原因；“正是”也传达原文的强调作用。
- source_word: הֶעֱמַדְתִּיךָ
  choice: 我让你存留
  rationale: 使役形可指使法老继续站立、存留。结合上文“把你从地上除灭”，这里主要表示没有立刻消灭他；此译保留神主动容许其继续存在的含义，又避免误解为提拔他作王。
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: 为了向你显明
  rationale: 直接表达目的；宾语后缀指法老，因此明确译出“向你”。
- source_word: כֹּחִי
  choice: 我的能力
  rationale: כח 表示力量、能力；在灾祸叙事中指上帝彰显的大能。“能力”自然且不过度解释。
- source_word: וּלְמַעַן
  choice: 并使
  rationale: 连接第二个并列目的，中文以“并使”简洁表达“并且为要使”。
- source_word: סַפֵּר
  choice: 传遍
  rationale: Piel 形式表示述说、传扬。原文未明说执行者；中文“使我的名传遍”自然保留开放的施事者，并结合全地范围表达广泛传扬。
- source_word: שְׁמִי
  choice: 我的名
  rationale: 保留希伯来文“名”的表达，不将其所包含的声誉、启示身份等意义直接释入正文。
- source_word: בְּכָל הָאָרֶץ
  choice: 全地
  rationale: 在此普遍性语境中指整个大地，而不只是一处地方；“全地”也是自然、庄重的圣经汉语。
theological_decisions:
- issue: הֶעֱמַדְתִּיךָ 对法老所表达的意义
  choice: 上帝让法老继续存留，以成就彰显能力和传扬其名的目的。
  alternative: 上帝为此兴起法老，或把他立在王位上。
  rationale: 紧接上文，上帝说本可击打法老、将他从地上除灭；因此本句最可能强调法老仍被容许存活。正文不引入“立为王”的较强解释，同时用脚注保留“使你站立／兴起你”的原文可能性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“让我存留”准确承接上文生死对比；“传遍全地”比被动式“在全地被传扬”更符合现代汉语习惯，同时不指定传扬者。脚注标记紧随相关短语。
