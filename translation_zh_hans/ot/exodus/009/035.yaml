base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: zh_hans
  text: 于是，法老的心刚硬起来[a]，不让以色列人[b]离去，正如耶和华曾借摩西[c]所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“法老的心变得顽固”。这里的希伯来语动词基本意思是“变强、变得坚固”，在本段语境中指法老顽固抗拒。
    reason: alternative_reading
  - marker: b
    text: 希伯来语直译为“以色列的众子”；也可译作“以色列的子孙”或传统译作“以色列的儿女”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语直译为“借摩西的手”，是“借摩西传达”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: 刚硬起来
  rationale: חזק在此是Qal形式，基本义为“变强、变得坚固”。结合灾祸叙事中法老持续抗拒的语境，译作“刚硬起来”既自然地表达其顽固，也不把本句未明说的致使者加入译文。
- source_word: לֵב פַּרְעֹה
  choice: 法老的心
  rationale: 直接保留希伯来语所属结构及其对法老内在意志、态度的关注。
- source_word: שִׁלַּח
  choice: 让……离去
  rationale: 在出埃及记的语境中，此词指法老准许以色列人离开；“让……离去”清楚而自然。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 较贴近原文“以色列之子”的传统族群称谓，同时在现代汉语中可理解为以色列的后裔整体。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 清楚表达事情与耶和华先前所说的话相符。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不以“主”这一称号代替。
- source_word: בְּיַד מֹשֶׁה
  choice: 借摩西
  rationale: 原文直译为“借摩西的手”，是表达媒介或代理的惯用语；“借摩西”在现代汉语中准确自然。
theological_decisions:
- issue: 法老之心刚硬的施事者
  choice: 法老的心刚硬起来
  alternative: 法老的心被弄刚硬了；法老使自己的心刚硬
  rationale: 本节的חזק为不及物式表达，说明法老的心变得强硬，却未在本句明确指出是上帝使其刚硬，还是法老使自己刚硬。译文保留这一叙事和神学张力，不额外指定施事者。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“刚硬起来”保留原文的状态变化及施事者不明确之处；“以色列的子孙”兼顾源语形式和现代可懂度。所有脚注标记均紧随其所说明的词语。
