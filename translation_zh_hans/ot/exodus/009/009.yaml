  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: zh_hans
  text: 这些炉灰要化作细尘，遍布埃及全境；又要在埃及全境的人和牲畜身上成为爆发并起水疱的疮。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: 要……化作尘土
  rationale: היה与לְ表示结果或状态转变；“化作”既保留变化之意，又符合灰尘扬散的语境。אָבָק指细微的尘土或粉尘；现代汉语用“尘土”自然清楚。
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: 在埃及全境
  rationale: עַל在这里表示尘土覆盖、散布的范围；“全境”简洁传达“埃及全地”。
- source_word: עַל הָאָדָם
  choice: 在人……身上
  rationale: אָדָם在此为集合性、泛指人类，与牲畜相对。汉语“人”本身可自然表达不分性别的泛指意义。
- source_word: וְעַל הַבְּהֵמָה
  choice: 和牲畜身上
  rationale: בְּהֵמָה是集合名词，通常指大型家畜或牲畜；在灾害叙事中译作“牲畜”比泛称“动物”更贴近语境，同时保留人与兽类的对举。
- source_word: לִשְׁחִין
  choice: 变成疮
  rationale: שְׁחִין指发作于皮肤的疮或疖；“疮”是现代汉语中宽泛而庄重的对应词，避免加入原文没有的“溃烂”等含义。
- source_word: פֹּרֵחַ
  choice: 发作成
  rationale: 该分词字面有萌发、开出的意思，用于皮肤病时表示疮疹冒出或发作。“发作成”在汉语中能自然连接疮与随之出现的水疱。
- source_word: אֲבַעְבֻּעֹת
  choice: 水疱
  rationale: 此复数名词指疮所冒出的疱或肿泡。“水疱”是清楚的现代用语，也避免使用过度专业化的医学术语。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 在埃及全境
  rationale: 原文再次说明灾害遍及埃及全地；译文保留这一重复，以保存其强调作用。
theological_decisions:
- issue: אָדָם作为泛指人类的表达
  choice: 人
  alternative: 人类
  rationale: 这里的אָדָם不是专名，也不专指男性，而是与牲畜相对的集合性“人”。现代汉语“人”可准确、自然地涵盖所有人，并保留原文简洁的人兽对举。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。保留两个וְהָיָה所表达的结果变化，也保留“埃及全境”的重复。将שְׁחִין、פֹּרֵחַ、אֲבַעְבֻּעֹת分别体现为“疮—发作—水疱”，不把三个成分压缩成一个带解释性的病名。
