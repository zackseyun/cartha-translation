revisions:
- from: 这灰要在埃及全境化作尘土，并要在埃及全境的人和牲畜身上变成疮，发作成水疱。
  to: 这些炉灰要化作细尘，遍布埃及全境；又要在埃及全境的人和牲畜身上成为爆发并起水疱的疮。
  rationale: 修订使“爆发并起水疱的疮”对应שְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת，保留疮、水疱和爆发三个成分，不将其压缩为单一病名，也不把水疱误作疮所变成的结果。“遍布”对应尘土覆盖埃及全地；重复“埃及全境”保留原文的强调。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:40Z'
review_pass:
  verdict: revise
  source_fidelity: 译文保留了灰烬化为尘土、遍及埃及、临到人和牲畜，以及疮与水疱的基本要素；但“发作成水疱”将疮和水疱处理为不自然的转变关系，未清楚表达“疮爆发／长出水疱”的修饰关系。
  naturalness: “这灰”及“变成疮，发作成水疱”不够符合现代标准汉语的自然表达。“炉灰”“细尘”“爆发并起水疱的疮”较清楚、庄重，也能保留原文病症描写的层次。
  terminology: “牲畜”“疮”“水疱”均可用。“炉灰”承接上文语境中的炉灰；“细尘”较准确体现אָבָק的微细粉尘义。
  issues:
  - severity: medium
    issue: “发作成水疱”误示疮转变为水疱。
    rationale: פֹּרֵחַ修饰שְׁחִין，并与אֲבַעְבֻּעֹת共同描述疮的爆发及水疱；水疱不是疮随后“发作成”的另一状态。
  - severity: low
    issue: “这灰”略显口语且指称不够明确。
    rationale: 结合上下文，译为“这些炉灰”更自然，也明确所指而不改变本节的省略式指代。
  revised_text: 这些炉灰要化作细尘，遍布埃及全境；又要在埃及全境的人和牲畜身上成为爆发并起水疱的疮。
