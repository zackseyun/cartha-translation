base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: zh_hans
  text: 摩西对他说：“我一出城，就要向雅威摊开双手；雷声[a]必停止，冰雹也不再有。好叫你知道，大地[b]属于雅威。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雷声”原文直译为“声音”；在这场风暴的语境中，指雷声。
    reason: lexical_alternative
  - marker: b
    text: “大地”也可译作“这地”或“土地”。
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי
  choice: 我一出城
  rationale: כְּ加不定式结构在这里表达紧接发生的时间；“一出城”自然地传达“当我出去／我一出去”的临近意味。
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: 我要……摊开双手
  rationale: פרשׂ与כף连用，指祷告时伸展、张开双手的动作；“摊开双手”既保留具体姿态，也符合现代汉语。
- source_word: יְהוָה / לַיהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名；采用“雅威”以保留其专名性质。
- source_word: הַקֹּלוֹת
  choice: 雷声
  rationale: 该词字面可指“声音”，但在冰雹风暴的上下文中明确指雷鸣；正文译作“雷声”，并以脚注保留字面信息。
- source_word: יֶחְדָּלוּן
  choice: 必停止
  rationale: חדל表示停止、止息；“必停止”简洁地表达此处将来发生的结果。
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: 也不再有冰雹
  rationale: 直译为“冰雹将不再有”；此译法自然，并保留灾害止息的完整含义。
- source_word: לְמַעַן תֵּדַע
  choice: 这样，你就知道
  rationale: למען引出目的；“这样，你就知道”在现代汉语中自然表达“为要使你知道”。
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: 大地属于雅威
  rationale: 介词לְ表达归属；הָאָרֶץ既可指“大地／全地”，也可指“土地／这地”。正文采用范围较广的“大地”，脚注保留另一可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 使用音译“雅威”，保留原文盟约神名作为专名的功能，不以称号替代。
- issue: הָאָרֶץ 的范围
  choice: 大地
  alternative: 这地／土地
  rationale: 在与法老对峙的语境中，这句话可以表达雅威对大地的主权；但希伯来词本身也可指特定地域，因此用脚注保留较窄的理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我一出城”体现动作紧接发生；“摊开双手”保留祷告的身体姿态。正文中的脚注标记与脚注内容对应，并保留 הָאָרֶץ 的范围歧义。
