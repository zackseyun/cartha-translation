  to: 摩西对他说：“我一出城，就要向雅威摊开双手；雷声[a]必停止，冰雹也不再有。好叫你知道，大地[b]属于雅威。”
  rationale: 仅将目的从句改为“好叫你知道”，以明确保留לְמַעַן的目的语气；并将“也不再有冰雹”调整为“冰雹也不再有”，使两个并列的灾害止息分句更清晰。其余译文和脚注均可保留。
