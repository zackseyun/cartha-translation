  text: וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: zh_hans
  text: 但耶和华使法老的心刚硬[a]，他不听他们的话，正如耶和华曾对摩西所说。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使法老的心坚定”，或“使法老的心强硬”。这里的希伯来语动词按字面可指“使强壮、使坚定”，在本段语境中则指法老顽固抗拒。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: 使……刚硬
  rationale: חזק的基本义是使强壮、使坚定；与“心”搭配并用于出埃及记反复出现的语境时，表达法老顽固抗拒。“使……刚硬”是现代汉语中清楚、自然的对应表达，同时保留耶和华直接施行这一行动的语法结构。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”音译四字神名，不以“主”这一称号替代。
- source_word: לֵב פַּרְעֹה
  choice: 法老的心
  rationale: 按希伯来语所有关系自然译出；“心”保留其作为意志与性情中心的表达，不在正文中加以解释。
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: 他就不听他们的话
  rationale: שׁמע与אֶל连用可表示听从、理会；译为“不听他们的话”符合现代汉语习惯，又不把含义收窄为单纯的“服从”。连接词在此按叙事结果自然译作“就”。
- source_word: אֲלֵהֶם
  choice: 他们
  rationale: 保留原文复数代词，不在正文中将所指明说为摩西和亚伦。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: 正如耶和华曾对摩西所说的
  rationale: “正如”保留比较兼应验的语气；“曾”自然表明这是先前对摩西说过的话。
theological_decisions:
- issue: 耶和华在法老心刚硬一事上的主动作用
  choice: 耶和华使法老的心刚硬
  alternative: 耶和华使法老的心坚定／使法老的心强硬
  rationale: 原文明确以耶和华为主语、法老的心为宾语，因此不改译为仅仅许可或任凭。正文采用符合该叙事主题的“刚硬”，脚注同时保留חזק较为字面的“坚定、强硬”含义，以保存原文的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“但”承接前文形成转折；句式尽量贴近希伯来文，同时避免生硬的逐词对应。
