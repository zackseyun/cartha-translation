  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: zh_hans
  text: 于是，摩西向天空伸出他的杖，雅威就降下雷声和冰雹；火降到地上[a]。雅威使冰雹降在埃及地上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“火向地面而去。”这里的“火”在上下文中很可能指闪电。
    reason: 保留וַתִּהֲלַךְ אֵשׁ אָרְצָה较直译的另一种表达，并说明“火”在风暴语境中可能指闪电，而不在正文消解该意象。
lexical_decisions:
- source_word: וַיֵּט
  choice: 伸出
  rationale: נָטָה在此表示把杖伸展出去；“伸出”符合现代汉语，也保留了动作本身。
- source_word: מַטֵּהוּ
  choice: 他的杖
  rationale: מַטֶּה可指杖或棍；“杖”简洁庄重，并符合出埃及记中摩西所持之物的语境。
- source_word: עַל הַשָּׁמַיִם
  choice: 向天空
  rationale: 介词短语在举杖的语境中表达朝向；“向天空”比直译“在诸天之上”自然准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，保留原文使用的专名，不以称号替代。
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: 降下雷声和冰雹
  rationale: נָתַן本义为“给、使有”；在风暴语境中译为“降下”较自然。קֹלֹת在此指雷声。
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: 火直奔地面
  rationale: 保留原文“火”及其朝地面运行的生动意象；“直奔”体现הלך在此连续而有方向的动态表达，同时不直接把“火”解释成闪电。
- source_word: וַיַּמְטֵר
  choice: 使……降
  rationale: מטר的使役形表示使冰雹如雨降下；汉语用“使冰雹降”清楚表达使役意义。
- source_word: אֶרֶץ מִצְרָיִם
  choice: 埃及地
  rationale: 保留原文“埃及之地”的地域表述及灾祸覆盖范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此以“雅威”音译专名，避免以“主”这一称号代替；“耶和华”是另一传统音译。
- issue: אֵשׁ在风暴中的所指
  choice: 正文保留“火”
  alternative: 闪电
  rationale: 语境很可能指闪电，但原文词义明确为“火”。正文保留意象，脚注说明可能所指，避免消解原文张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事体。“雷声”传达风暴语境中קֹלֹת的意义；“火直奔地面”刻意保留希伯来文的具象动态，不在正文中直接改译为“闪电”。
