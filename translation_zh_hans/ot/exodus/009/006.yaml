  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: zh_hans
  text: 第二天，耶和华就做了这事。埃及所有的牲畜都死了，但以色列人的牲畜连一头也没有死。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”译出四字神名，保留其作为上帝专名的功能，不以“主”这一称号替代。
- source_word: וַיַּעַשׂ ... אֶת־הַדָּבָר הַזֶּה
  choice: 就做了这事
  rationale: 直译希伯来语“做这事”，并用“就”承接叙事，表达预告随即实现。
- source_word: מִמָּחֳרָת
  choice: 第二天
  rationale: 指前述日期之后的一天；“第二天”在现代汉语叙事中自然、明确。
- source_word: כֹּל מִקְנֵה מִצְרַיִם
  choice: 埃及所有的牲畜
  rationale: מִקְנֶה泛指家养牲畜，不限于牛；属格短语按自然汉语处理。
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל לֹא מֵת אֶחָד
  choice: 但以色列人的牲畜连一头也没有死
  rationale: 用“但”表现对比；介词מִן在汉语中融入整体表达。“连一头也没有死”保留否定加数词“一”的强调，并以适合牲畜的量词使句子自然。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语在此作为族群称谓，现代汉语自然译为“以色列人”；并非仅指男性后裔。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用上帝的专名。正文采用中文读者最熟悉且明确作为专名的“耶和华”，不以称号“上主”替代；“雅威”是另一种较接近学术重构读音的音译。
- issue: בְנֵי יִשְׂרָאֵל 的指称范围
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 该表达在上下文中是全体族群的惯用称谓，而不是特意限定男性，因此采用自然的族称“以色列人”，避免在汉语中造成仅指男性的误解。
- issue: “埃及所有的牲畜都死了”的范围
  choice: 保留原文的全称表述
  alternative: 埃及田间所有的牲畜都死了
  rationale: 本节原文明确说“所有”，译文不自行用后文仍有牲畜出现来弱化或补限其范围；相关叙事张力予以保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。语序先交代时间，再叙述应验；“牲畜”准确覆盖מִקְנֶה的广义范围。“连一头也没有死”兼顾原文强调和汉语习惯。英文咨询稿的脚注标记位置似有错置：其脚注内容解释“以色列的众子”，却标在“第二天”之后；本稿不沿用该误标，且正文采用“以色列人”，无需另设脚注。
