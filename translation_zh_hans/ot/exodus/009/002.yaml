  yaml_path: translation/ot/exodus/009/002.yaml
  text: For if you refuse to let them go and still hold on to them,[a]
translation:
  language: zh_hans
  text: 因为你若不肯放他们走，仍旧扣留他们，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仍旧抓住他们不放。”
    reason: 原文מַחֲזִיק בָּם可侧重持续抓住、留住；此译法较直观地保留“抓住不放”的意象。
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为你若
  rationale: כִּי保留与上一节相连的解释意味，אִם表达条件；合译为“因为你若”，既忠实又符合现代汉语表达。
- source_word: מָאֵן
  choice: 不肯
  rationale: 此词表示主动作出的拒绝，而非没有能力；“不肯”简洁自然，符合警告法老的语境。
- source_word: לְשַׁלֵּחַ
  choice: 放他们走
  rationale: 在出埃及记的语境中，שׁלח指准许以色列人离开；“放他们走”准确且符合现代汉语习惯。
- source_word: וְעוֹדְךָ
  choice: 仍旧
  rationale: עוֹד加第二人称单数后缀表示法老的行为仍在持续；“仍旧”清楚传达这种延续性。
- source_word: מַחֲזִיק בָּם
  choice: 扣留他们
  rationale: 该分词结构表示继续抓住、留住或不释放这些人；“扣留他们”在本语境中自然地表达法老继续限制他们离开的意思，同时保留持续控制的力度。
