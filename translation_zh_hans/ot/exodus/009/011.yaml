base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: zh_hans
  text: 术士们因身上长疮，不能站在摩西面前，因为术士和全埃及的人身上都长了疮。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“在全埃及”。这里按上下文译出所隐含的指人含义，即埃及各地的人身上都长了疮。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: 术士们
  rationale: 在《出埃及记》中指法老宫廷中从事秘术、与摩西和亚伦抗衡或加以模仿的人；“术士”既自然简洁，也能表达其宗教秘术角色。
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: 站在摩西面前
  rationale: 保留原文“站立在……面前”的表达；在本处可指他们因灾病而无法到摩西面前站立或现身，不必进一步限定。
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: 因身上长疮
  rationale: מִפְּנֵי在此表示原因；שְׁחִין是发炎的疮疹，虽为单数形式，却具有集合意义。中文以“身上长疮”自然表达身体受灾的情形。
- source_word: הַשְּׁחִין
  choice: 疮
  rationale: 前后统一译为“疮”，简明表达集合性的疮病，同时避免用过度具体的现代医学诊断。
- source_word: בַּחֲרְטֻמִּם
  choice: 术士身上
  rationale: 介词ב在此结合身体患病的语境，宜译为疮长在术士“身上”。
- source_word: וּבְכָל מִצְרַיִם
  choice: 全埃及的人身上
  rationale: 原文直译为“在全埃及”；与前面的“术士身上”平行，语境暗示受疮灾的是遍及埃及的人，因此在正文中补出“人身上”，并以脚注保留字面形式。
