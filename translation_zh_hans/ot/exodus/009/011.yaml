translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“术士”沿用圣经叙事中易懂的称谓；“身上长疮”比名词化的“患疮病”更自然，并清楚呈现他们无法站立的原因。脚注标记置于相关句末。
