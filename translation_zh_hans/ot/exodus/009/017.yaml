  naturalness: “你还在我的百姓之上自高，不肯放他们走吗？”在现代标准汉语中庄重、清楚，且保留上帝对法老的责问语气。“自高”比“高抬自己”更凝练，也较少有现代口语中“抬举自己”的褒贬歧义。
  terminology: 保留“我的百姓”，准确维持第一人称的神圣归属语言。采用“放他们走”，与出埃及记中反复出现的释放命令一致。
  issues:
