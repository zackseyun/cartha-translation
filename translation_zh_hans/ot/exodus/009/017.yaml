base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: zh_hans
  text: 你还在我的百姓之上自高，不肯放他们走吗？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在我的百姓之上自高”或译“敌对我的百姓而妄自尊大”，或“抬高自己，凌驾于我的百姓之上”。
    reason: 原词带有自我抬高、傲慢自恃的反身意味；此处介词短语可强调法老凌驾于上帝百姓之上，也可按语境表达其敌对姿态。
lexical_decisions:
- source_word: עוֹדְךָ
  choice: 你还……吗
  rationale: עוֹד 表示情况仍在持续，所附的第二人称单数形式直接指向法老；结合上下文，译作反问句自然地传达责问语气。
- source_word: מִסְתּוֹלֵל
  choice: 高抬自己
  rationale: 该词为 סלל 的 Hitpolel 分词，在此表示自我抬高、傲慢自恃；“高抬自己”保留了反身意味，也没有把词义缩减为一般性的“反对”。
- source_word: בְּעַמִּי
  choice: 敌对我的百姓
  rationale: 介词 בְּ 在这里表达针对或凌驾于某对象之上的关系；“敌对”在现代汉语中清楚传达法老对上帝百姓的对抗姿态，同时保留“我的百姓”这一第一人称归属表达。
- source_word: לְבִלְתִּי
  choice: 不
  rationale: 该结构引出否定的不定式短语，说明法老自高的具体表现或目的；汉语直接用“不”衔接，简洁自然。
- source_word: שַׁלְּחָם
  choice: 放他们走
  rationale: שלח 的 Piel 形式在出埃及记灾祸叙事中惯指释放以色列人；“放他们走”符合现代汉语，也贴合本段反复出现的要求。
theological_decisions:
- issue: “我的百姓”中的神圣归属语言
  choice: 保留“我的百姓”
  alternative: “百姓”或“以色列人”
  rationale: 第一人称后缀表达耶和华对以色列的直接宣称，在出埃及语境中具有重要意义，也表明法老对百姓的敌对同时是对上帝权柄的抗拒。
- issue: 责问句式是否明示
  choice: 译作反问句“你还……吗”
  alternative: 译作陈述句“你仍在……”
  rationale: 希伯来文本没有独立的疑问词，但这一短句在上下文中通常形成直接责问。汉语用反问句能自然表达其语用功能，同时不改变命题内容。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“高抬自己”保留希伯来语的反身表达；“不放他们走”延续出埃及记叙事中的核心措辞。
