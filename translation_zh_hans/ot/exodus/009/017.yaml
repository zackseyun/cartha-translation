    issue: “敌对我的百姓”将原文的自我抬高／凌驾关系处理为一个独立并列的敌对行动。
    rationale: 原文以一个反身分词和介词短语表达法老相对于上帝百姓的傲慢自高；虽可包含敌对意味，但正文宜优先保留“在……之上”的关系，避免把隐含语境发展为另一谓语。
  - severity: low
