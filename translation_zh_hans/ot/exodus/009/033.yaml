  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: zh_hans
  text: 于是，摩西离开法老，出了城，向雅威伸开双手；雷声[a]和冰雹就止住了，雨也不再倾泻到地上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“声音”；在这场风暴的语境中，指雷声。
    reason: lexical_alternative
  - marker: b
    text: 或译：“雨也没有倾泻到地上。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: 摩西离开法老，出了城
  rationale: מֵעִם表示离开法老所在之处；结合前文9:29，אֶת הָעִיר在运动动词之后表达摩西出城的行动。译文保留两个连续的离开动作，并采用自然的现代汉语。
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: 伸开双手
  rationale: 字面意象是展开两掌，语境中是祷告的姿势。“伸开双手”既保留身体动作，也不把动作直接释义成“祷告”。
- source_word: הַקֹּלוֹת
  choice: 雷声
  rationale: 该词通常意为“声音”，但在这场风暴的语境中明确指雷鸣；正文采用现代汉语自然的气象用语，并以脚注保留其字面形式。
- source_word: וַיַּחְדְּלוּ
  choice: 止住了
  rationale: חדל表示停止、止息。“止住了”适合雷声和冰雹同时停止的叙事语境，庄重而自然。
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: 雨也不再倾泻到地上
  rationale: נתך的被动形式描写雨被倾倒、倾泻下来；אָֽרְצָה带方向意味，即“到地上”。“不再”依据风暴已经停止的叙事语境表达动作终止，同时脚注保留较贴近形式的译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用普通读者最熟悉、且明确作为专名的“耶和华”；“雅威”是更接近常见学术重构读音的可选形式，但原文辅音本身不能确证完整古代发音。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“伸开双手”保留祷告姿势的具体意象；分号呈现摩西行动与风暴停止之间紧密的叙事联系。
