  text: 他们从法老那里出来时，遇见摩西和亚伦；二人正站在那里等候他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: 遇见
  rationale: פגע在这里基本义为“遇见、碰见”；下文虽显出敌意，本动词本身却不必译成“对质”，因此正文保留较宽泛的表达。
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: 摩西和亚伦
  rationale: 按现代汉语通行译名处理两个专名；宾语标记אֶת不另行译出。
- source_word: נִצָּבִים
  choice: 正站在那里
  rationale: 分词表示当时持续的站立状态；“正站在那里”自然呈现摩西和亚伦在场等候的情景。
- source_word: לִקְרָאתָם
  choice: 等候他们
  rationale: לִקְרָאתָם表示面向他们、为与他们相遇而站立；结合נִצָּבִים，汉语译作“等候他们”较自然，也不加入敌对意味。
- source_word: בְּצֵאתָם
  choice: 他们……出来时
  rationale: 带בְּ的动词不定式结构表示时间背景；译为“……出来时”准确而符合现代汉语。
- source_word: מֵאֵת פַּרְעֹה
  choice: 从法老那里
  rationale: מֵאֵת表示从某人所在之处离开；“从法老那里”比单说“从法老”更符合现代汉语，也保留“离开法老面前”的空间含义。
