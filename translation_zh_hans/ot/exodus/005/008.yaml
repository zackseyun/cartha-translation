language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת מַתְכֹּ֨נֶת הַ/לְּבֵנִ֜ים אֲשֶׁ֣ר הֵם֩ עֹשִׂ֨ים תְּמ֤וֹל שִׁלְשֹׁם֙ תָּשִׂ֣ימוּ עֲלֵי/הֶ֔ם לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ כִּֽי נִרְפִּ֣ים הֵ֔ם עַל כֵּ֗ן הֵ֤ם צֹֽעֲקִים֙ לֵ/אמֹ֔ר נֵלְכָ֖ה נִזְבְּחָ֥ה לֵ/אלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: zh_hans
  text: 他们昨天和前天[a]所做砖的定额，你们仍要照样定给他们，一点也不可减少；因为他们懒散，所以他们才喊着说：‘让我们去向我们的上帝献祭。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “昨天和前天”也可意译为“从前”或“像以前一样”。
    reason: 希伯来语短语可具体指此前两天，也可惯用地泛指先前的日子；正文保留原文形象，脚注说明较自然的语义选择。
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: 定额
  rationale: 在强制制砖的劳役语境中，指必须完成的规定数量；“定额”简洁自然，也与下文“一点也不可减少”呼应。
- source_word: הַלְּבֵנִים
  choice: 砖
  rationale: 按上下文直译为制砖所生产的砖块。
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: 昨天和前天
  rationale: 保留希伯来语成对时间词的具体表达；该短语在语用上也可泛指“从前”或“照旧”。
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: 仍要照样定给他们
  rationale: 原文直译为把定额“放在他们身上”，实指向工人规定并强加生产任务；中文以“定给他们”表达行政性和强制性。
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: 一点也不可减少
  rationale: 准确表达不可从既定数额中减去任何部分。
- source_word: נִרְפִּים
  choice: 懒散
  rationale: 这是法老对以色列人的指控，含松懈、不肯做工之意；“懒散”保留指控语气，又不额外断定叙述者赞同这一评价。
- source_word: צֹעֲקִים
  choice: 喊着
  rationale: 表达持续而强烈地出声呼求，与后面的直接引语自然衔接。
- source_word: נֵלְכָה נִזְבְּחָה
  choice: 让我们去……献祭
  rationale: 两个第一人称复数意愿式表达共同的请求或决意，现代汉语自然合并为“让我们去……献祭”。
- source_word: לֵאלֹהֵינוּ
  choice: 向我们的上帝
  rationale: 介词表明献祭的对象；“向……献祭”符合现代汉语习惯。
theological_decisions:
- issue: “懒散”是叙述判断还是法老的指控
  choice: 保留法老原话中的直接断言，不加解释性限定
  alternative: 译为“因为他们自称无事可做”或加入“我看”
  rationale: 本节是法老的命令和判断；译文应保留其指控的力度，同时不以旁白形式替法老的说法背书。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定额”“一点也不可减少”体现强制劳役的行政语境；引语保持法老指控性的口吻。
