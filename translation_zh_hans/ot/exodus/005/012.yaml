  text: So the people were scattered throughout all the land of Egypt to gather stubble for straw[a].
translation:
  language: zh_hans
  text: 于是，百姓分散到埃及全境，捡拾残梗，以作草秸[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 若不严格区分קַשׁ和תֶּבֶן，也可译作“捡拾秸秆作草秸”；正文保留了所捡残梗与通常供应的草秸之间很可能存在的区别。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: 分散
  rationale: פוץ在叙事形式中描写百姓因法老的命令而散布到广大地区；“分散”既保留其广泛散开的结果，也符合现代汉语叙事表达。
- source_word: הָעָם
  choice: 百姓
  rationale: עם在此集体指受役使的以色列民众。“百姓”自然、庄重，又不额外限定其身份。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: 到埃及全境
  rationale: 该短语表示他们散到埃及各处；“全境”简洁地传达בְּכָל的周遍含义。
- source_word: לְקֹשֵׁשׁ
  choice: 捡拾
  rationale: קשש指收集零散的小块材料；“捡拾”比泛泛的“收集”更能表现从各处搜集散落植物残料的动作。
- source_word: קַשׁ
  choice: 残梗
  rationale: קַשׁ可指收割后剩余或散落的干茎、碎秸。因本句另有תֶּבֶן，“残梗”可保留两者之间很可能存在的区别。
- source_word: לַתֶּבֶן
  choice: 来充作草料
  rationale: 介词ל在此可表达用途或替代关系，即把捡来的残梗当作制砖所需的תֶּבֶן使用。“充作”清楚表达这种替代用途；“草料”沿用本段对制砖用切碎植物材料的通俗称呼。
