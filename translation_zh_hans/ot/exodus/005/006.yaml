  text: 当天，法老吩咐百姓的监工和他的官员，说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: 该叙事动词表示法老以权威下令；“吩咐”自然、庄重，并能承接下节的具体命令。
- source_word: בַּיּוֹם הַהוּא
  choice: 当天
  rationale: 直译为“在那一天”；在当前叙事中“当天”自然地表达事情随即发生，同时不过度强化为“就在当天”。
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: 管辖百姓的监工
  rationale: נגשׂ 在强迫劳役语境中指催逼、征收劳役的人；“监工”符合其职能。介词短语 בעם 表明他们与百姓的管辖关系，译作“管辖百姓的”较符合现代汉语。
- source_word: שֹׁטְרָיו
  choice: 百姓中的工头
  rationale: 该词指劳役体系中的基层官员；结合后文这些人出自以色列人，译作“百姓中的工头”既交代归属，也体现其基层管理职能。后缀“他的”在这里可指法老体系下的人员，但汉语若直译成“他的官员”容易掩盖其与百姓的关系。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出直接引语的常用公式；汉语以“说：”自然承接下一节。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“监工”与“工头”分别呈现两个层级，避免都译作笼统的“官员”。经文以冒号结束，因为法老的命令从下一节开始。
