base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: zh_hans
  text: 你们自己去，在哪里能找到秸秆，就从哪里取来[a]；因为你们的工作量一点也不会减少[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 较直译：“从你们找到的地方取来。”
    reason: lexical_alternative
  - marker: b
    text: 直译：“因为从你们的工作中一点也不减少。”这里的“因为”也可译为“由于”或“因”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם
  choice: 你们自己
  rationale: 独立人称代词置于复数命令之前，带有强调作用；“你们自己”自然保留这一语气。
- source_word: לְכוּ קְחוּ
  choice: 去找……拿
  rationale: 两个复数命令依次为“去”和“取”。结合后面的“找到”，中文用“去找……拿”既保留动作顺序，也符合获取草料的语境。
- source_word: לָכֶם
  choice: 自己
  rationale: 此处表示他们必须自行取得所需草料；前面的“你们自己”已自然承载这一反身、强调意味，避免重复生硬地说“给你们自己”。
- source_word: תֶּבֶן
  choice: 草料
  rationale: 在制砖语境中指供制砖使用的秸秆、碎草。中文“草料”通俗而能涵盖这里作为原料的草；也可较直译为“草”。
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: 能从哪里找到，就从哪里拿
  rationale: 保留介词“从”所表达的来源，并以自然中文传达来源不限、须自行寻获的意思。
- source_word: כִּי
  choice: 因为
  rationale: 该连词通常引出原因或说明；此处按其较直接的因果/解释功能译为“因为”，不将上下文中的强硬反差直接写入连词。
- source_word: אֵין נִגְרָע
  choice: 一点也不会减少
  rationale: 否定结构与被动分词表达不被削减；在命令语境中用“不会减少”自然呈现所宣布的持续规定。
- source_word: מֵעֲבֹדַתְכֶם דָּבָר
  choice: 你们的工一点也
  rationale: 字面为“从你们的工作中，一件也不减少”。“你们的工一点也不会减少”是自然中文，并保留完全不减的强调。
theological_decisions: []
