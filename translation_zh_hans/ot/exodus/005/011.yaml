  rationale: 修订仅处理词义、语体和现代汉语表达：“秸秆”准确对应制砖语境中的 תֶּבֶן；“工作量”自然表达不得削减劳役总量。脚注 a 保留“从……取来”的较直译结构，脚注 b 更正了将 דָּבָר 机械译作“一件”的问题，并说明 כִּי 的可选因果译法。
