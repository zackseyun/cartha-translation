  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: zh_hans
  text: 后来，摩西和亚伦进去见法老，对他说：“以色列的上帝雅威[a]这样说：‘放我的百姓走，好让他们在旷野为我守节[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 YHWH 的音译；传统也译作“耶和华”。
    reason: 说明神名的原文形式及常见替代译法。
  - marker: b
    text: 也可译作“向我过节”或“为我庆祝节期”；希伯来文动词指举行、遵守节庆。
    reason: 交代该动词特有的节庆含义及可行译法。
lexical_decisions:
- source_word: וְאַחַר
  choice: 后来
  rationale: 这是推进叙事的时间连接语，表示此前事件之后所发生的事，但不具体限定相隔多久。
- source_word: בָּאוּ
  choice: 进去见
  rationale: 在觐见法老的语境中，该动词不只是表示到达，也自然包含进入法老面前的意思；“进去见法老”符合现代汉语叙事习惯。
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: 对他说
  rationale: 承接前面的“法老”，采用现代汉语自然的引语表达，同时避免不必要地重复称谓。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 保留使者传达权威话语的固定公式，语气庄重而不显古奥。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 YHWH 音译，保留专名性质，而不以“主”这一称号代替。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的所属结构和身份说明，在现代普通话中清楚自然。
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: 放我的百姓走
  rationale: 命令法老释放以色列人；“放……走”既准确表达使其离开的意思，也保留命令的力度。
- source_word: וְיָחֹגּוּ לִי
  choice: 好让他们……为我守节
  rationale: 这里的动词专指举行或遵守节庆，而非泛指敬拜；“守节”简洁保留其礼仪和节庆含义。连接词按语境表达目的。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: 该词指人烟稀少的荒野地区，不必然是沙漠；“旷野”准确且符合中文圣经叙事语域。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH。“雅威”较贴近学界通常重构的读音，并保留其作为以色列上帝专名的功能；脚注列出中文传统音译“耶和华”，但正文不以称号“主”取代原文专名。
- issue: וְיָחֹגּוּ לִי 的礼仪含义
  choice: 为我守节
  alternative: 向我过节；为我庆祝节期
  rationale: 原文明确涉及节庆活动。译作“守节”不把它泛化为一般性的敬拜，也不额外规定节期的具体形式，从而保留原文的范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“这样说”保留宣告公式的权威感，以“守节”准确表达礼仪节庆含义；引语层次清楚，避免过度古典化。
