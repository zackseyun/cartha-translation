  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: zh_hans
  text: 法老说：“雅威[a]是谁，我何必听从他的话，放以色列人走？我不认识雅威，也绝不放以色列人走。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语为 YHWH，是上帝的名字；其古代读音不能完全确定，传统中文常译作“耶和华”。
    reason: 说明神名的原文形式、读音不确定性及传统中文译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的专名 YHWH，不以“主”这一称号替代；脚注交代传统译法。
- source_word: מִי
  choice: 谁
  rationale: 此疑问词询问身份；“谁”准确保留法老轻蔑而挑战性的口吻。
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: 竟要我听从他的话
  rationale: שׁמע בְּקוֹל 在这里含服从之意；“听从他的话”既自然，又保留“听声音／话语”的希伯来表达痕迹。“竟要”体现反问中的抗拒。
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: 让以色列离去
  rationale: שׁלח 在出埃及语境中指准许被辖制的以色列人离开；此译法清楚自然，同时避免额外限定其具体法律身份。
- source_word: לֹא יָדַעְתִּי
  choice: 我不认识
  rationale: ידע 的完成式在此表达法老当前声称不认识雅威，也可含不承认其权威的意味；正文保留“认识”的语义张力，不把后者直接写入。
- source_word: וְגַם
  choice: 也绝不
  rationale: וְגַם 加强后一项宣告；结合否定句，用“也绝不”自然体现递进和坚决拒绝。
- source_word: אֲשַׁלֵּחַ
  choice: 不会让……离去
  rationale: 未完成式在此表达法老当下的决意；与前半句“让以色列离去”保持措辞一致。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 现代汉语中对埃及君王称号的标准译名。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 现代汉语中该民族及名称的标准译法。
theological_decisions:
- issue: 如何译写神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 YHWH，因此正文采用专名音译“雅威”，而不以称号“主”替代。鉴于其古代确切读音不能完全确定，并且中文传统常用“耶和华”，以脚注说明。
- issue: 法老所说“不认识”的含义
  choice: 保留为“我不认识雅威”
  alternative: 我不承认雅威
  rationale: ידע 可在语境中涉及认识、承认或认可权威。直译为“认识”既符合基本词义，也保留法老究竟声称不知其身份，还是拒不承认其权威的张力。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。法老的反问以“竟要我”传达其轻蔑和抗拒；“听从他的话”自然呈现顺服含义；“也绝不会”突出其断然拒绝。
