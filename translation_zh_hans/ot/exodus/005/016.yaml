base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: zh_hans
  text: 不供给你仆人草料，却对我们说：‘做砖！’看哪，你的仆人正在受殴打，错却在你自己的百姓。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地译作“而你的百姓犯了罪”。希伯来语这一短句十分压缩；按上下文看，很可能是说责任在法老手下的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: 草
  rationale: 指制砖时使用的草料；“草”是现代汉语中自然、简明的对应表达，也符合本段语境。
- source_word: אֵין נִתָּן
  choice: 不给
  rationale: 否定存在词与被动分词共同表示草料没有被供应；汉语用主动式“不给”更自然，并保留持续缺乏供应的意思。
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 以色列人的工头正以恭敬而自谦的宫廷用语向法老申诉；“仆人”兼顾从属地位与称谓语气。
- source_word: לְבֵנִים
  choice: 砖
  rationale: 指要求生产的砖块；汉语“做砖”在此生产语境中清楚自然。
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: 却对我们说：‘做砖！’
  rationale: 保留直接引语和命令语气，并根据紧接在前的“砖”明确命令内容；“却”显出不给原料仍强令生产的反差。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留说话者要求法老正视眼前不公的强调和指示力量，同时维持庄重语体。
- source_word: מֻכִּים
  choice: 正在挨打
  rationale: 被动分词在上下文中描述持续发生的殴打；“正在挨打”清楚传达进行中的受害状态。
- source_word: וְחָטָאת עַמֶּךָ
  choice: 错却在你自己的百姓
  rationale: 希伯来语从句高度压缩，句法与含义存在困难。此译法按申诉的论证脉络表达责任在法老一方的人，并用“自己的”强化双方之间的对比；脚注保留较形式对应的另一种理解。
theological_decisions:
- issue: וְחָטָאת עַמֶּךָ 所指的责任归属
  choice: 正文译为“错却在你自己的百姓”，理解为以色列工头指控法老手下的人应为不公负责。
  alternative: 较形式对应地译为“而你的百姓犯了罪”。
  rationale: 原文表达压缩，不能在翻译中掩盖其歧义；正文采用最符合叙事处境和申诉逻辑的意思，脚注则保存原文可能更直接表达的“犯罪”措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留原文申诉中的强调语气；直接引语简洁有力。脚注标记置于真正存在歧义的末句之后。
