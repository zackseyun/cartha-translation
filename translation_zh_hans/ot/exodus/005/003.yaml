source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: zh_hans
  text: 他们说[a]：“希伯来人的上帝临到我们了。求你准我们走三天的路程，到旷野去，好向雅威我们的上帝献祭，免得他用瘟疫或刀剑击打我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “临到我们了”也可译作“召见我们了”。原文可表示上帝与他们相遇或临到他们，也可表示他召他们前来。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: 希伯来人的上帝
  rationale: 按原文保留“希伯来人”这一族群称谓，不将其顺译为“以色列人”。
- source_word: נִקְרָא עָלֵינוּ
  choice: 向我们显现了
  rationale: 该结构在此表示神主动与人相遇或向人显现；正文采用自然且适合神显语境的表达，并用脚注保留“召见我们”的可能。
- source_word: נֵלֲכָה נָּא
  choice: 求你准我们……去
  rationale: 以请求句体现 cohortative 的意愿和 נָא 的恳请语气，符合对法老说话的语境。
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 走三天的路
  rationale: 自然表达按行程时间计算的路程，同时紧贴希伯来语习惯说法。
- source_word: בַּמִּדְבָּר
  choice: 到旷野
  rationale: מִדְבָּר 未必专指沙漠；“旷野”保留其荒野、牧野的宽泛含义。
- source_word: וְנִזְבְּחָה
  choice: 好……献祭
  rationale: 连续的 cohortative 在此自然表达出行目的；“好”在现代汉语中清楚而不过度解释。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 直接音译四字神名，保留经文所用的盟约之名。
- source_word: פֶּן
  choice: 免得
  rationale: 准确传达 פֶּן 所引出的警戒性后果，且为自然庄重的现代汉语。
- source_word: יִפְגָּעֵנוּ
  choice: 击打我们
  rationale: 此处 פגע 表示敌对、惩罚性的临到；与后面的“瘟疫或刀剑”搭配时，“击打”清楚自然。
- source_word: בַּדֶּבֶר
  choice: 用瘟疫
  rationale: דֶּבֶר 指致命的疫病；“瘟疫”准确且易懂。
- source_word: בֶחָרֶב
  choice: 用……刀剑
  rationale: 将介词作工具义处理，并与“用瘟疫”构成平行表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留专名性质，并避免以称号取代经文中的名字。
- issue: יִפְגָּעֵנוּ 的主语所指
  choice: 保留“他”，指前述雅威
  alternative: 省略代词，译作“免得我们遭受……”
  rationale: 希伯来语动词为第三人称单数，最自然的先行词是雅威；显明代词保留神主动施行审判的张力。
- issue: 神向说话者采取行动的性质
  choice: 正文译“向我们显现”，脚注保留“召见”
  alternative: 向我们显现；召见我们；与我们相遇
  rationale: נִקְרָא עָלֵינוּ 存在真实词义弹性；正文不把它弱化为抽象的“呼召”，脚注则保留另一可成立的理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“求你准我们”保持对君王提出恳求的语气；“旷野、献祭、瘟疫、刀剑”沿用清楚且具有经文文体感的常用词。
