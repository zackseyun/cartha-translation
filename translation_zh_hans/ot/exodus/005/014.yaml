base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: zh_hans
  text: 那些由法老的督工委派、监管以色列人的工头挨了打。督工责问他们说：“你们为什么昨天和今天都没有像从前那样[a]完成制砖的定额？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“如同昨天、前天”，是指“像从前那样”或“照以往”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: 挨了打
  rationale: 该词是 נכה 的复数被动式，表示遭受击打；“挨了打”自然明确，又不限定具体刑罚方式。
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: 以色列人的工头
  rationale: 此处指从以色列人中选出、负责督管劳作的基层人员；“工头”符合强迫劳动的叙事语境。
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: 法老的督工所派来管辖以色列人的
  rationale: נֹגְשִׂים 指驱使劳工的人，译作“督工”；关系从句明确工头由法老的督工委派，管理以色列人。
- source_word: לֵאמֹר
  choice: 督工责问他们
  rationale: 希伯来语引语式可按汉语叙事习惯显明说话者；结合处罚和质问语境，“责问”准确传达语气。
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接、自然地表达原因疑问。
- source_word: לֹא כִלִּיתֶם
  choice: 没有……完成
  rationale: כלה 在此表示完成所规定的工作量；汉语用“完成”与“定额”搭配自然。
- source_word: חָקְכֶם
  choice: 定额
  rationale: חֹק 在劳动语境中指规定、分派的数量；“定额”简洁准确。
- source_word: לִלְבֹּן
  choice: 制砖的
  rationale: 该不定式指制作砖，作为“定额”的限定语译为“制砖的”符合现代汉语。
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: 像从前那样
  rationale: 这是表示以往惯例的习语，字面涉及昨天和此前；“像从前那样”保留其实际语义，并避免与下文具体的“昨天和今天”混淆。
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: 昨天和今天都没有完成
  rationale: גַּם…גַּם 强调两日均未达标；汉语将省略的谓语补出，使责问清楚有力。
