  text: וְ/עַתָּה֙ לְכ֣וּ עִבְד֔וּ וְ/תֶ֖בֶן לֹא יִנָּתֵ֣ן לָ/כֶ֑ם וְ/תֹ֥כֶן לְבֵנִ֖ים תִּתֵּֽנּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: zh_hans
  text: “现在，你们去干活吧！不会给你们提供秸秆，但规定的砖数[a]，你们仍必须交足。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“砖的定额”。希伯来语תֹכֶן指工人必须完成的固定的或经计量确定的数额。
    reason: 说明该词的计量含义及另一种简洁译法。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并引出法老的总结性命令；“现在”在现代汉语中自然，也保留了原文的推进和强调作用。
- source_word: לְכוּ
  choice: 去吧
  rationale: 准确表达הלך的命令式；句末语气词“吧”在此不是弱化命令，而是使汉语命令表达自然。
- source_word: עִבְדוּ
  choice: 干活
  rationale: 本处指受迫从事制砖劳动，并非礼仪性的“事奉”；“干活”通俗、明确，符合说话场景。
- source_word: וְתֶבֶן
  choice: 但草
  rationale: וְ在语境中带有转折作用；译作“但”清楚呈现继续劳动与不再供草之间的反差。תֶבֶן指制砖所用的秸秆类材料，正文简洁译作“草”。
- source_word: לֹא יִנָּתֵן לָכֶם
  choice: 不会给你们
  rationale: 保留原文被动表达的基本含义，同时用自然现代汉语表明他们将不再得到草。
- source_word: תֹכֶן לְבֵנִים
  choice: 规定的砖数
  rationale: תֹכֶן指经衡量后规定的固定数量；“规定的砖数”清楚说明所要求的是砖的数量，并避免把含义限定为某种现代行政制度。
- source_word: תִּתֵּנוּ
  choice: 你们必须交足
  rationale: 字面为“你们要交出/给出”；在强制生产语境中，“必须交足”既表达义务，也准确传达必须达到规定数量的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而有力度的口语化命令句，符合压迫者直接发令的场景，同时保持经文体的庄重。以“干活”表达强制劳动，以“交足”自然呈现必须完成规定产量的要求。
