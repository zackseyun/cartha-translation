base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: zh_hans
  text: 于是，以色列人的督工来到法老面前，向他呼求说：“你为什么这样对待你的仆人？[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”也可译作“奴隶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 于是……来到
  rationale: 叙事性连续式推进情节；“于是”自然表达承接关系，“来到……面前”符合现代汉语表达。
- source_word: שֹׁטְרֵי
  choice: 督工
  rationale: 本段语境指在埃及权力之下负责管理劳役的以色列人；“督工”比泛称“官长”更明确地体现其劳役管理职分。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此是对以色列族群的惯用称呼；现代汉语用“以色列人”自然、准确，也不误限于男性。
- source_word: וַיִּצְעֲקוּ
  choice: 呼求
  rationale: 该动词表达急切而强烈的求告；“呼求”兼具出声求援和申诉的意味。
- source_word: אֶל־פַּרְעֹה
  choice: 向他（法老）
  rationale: 介词表示呼求所指向的对象；汉语在前句已说“来到法老面前”，后用“向他”避免生硬重复。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是希伯来语常见的引语引介形式，现代汉语简洁译作“说”。
- source_word: לָמָּה
  choice: 为什么
  rationale: 直接、自然地对应原因问句。
- source_word: תַעֲשֶׂה כֹה
  choice: 这样对待
  rationale: 字面近于“这样做”；与指人的间接对象连用时，“这样对待”既贴近原意，也符合自然汉语。
- source_word: לַעֲבָדֶיךָ
  choice: 你的仆人
  rationale: עבד可指仆人或奴隶；此处说话者向法老申诉并自称，带有臣属式敬语色彩，因此正文采用“仆人”，同时以脚注保留“奴隶”的可能。
theological_decisions: []
