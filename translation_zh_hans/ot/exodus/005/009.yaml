  text: תִּכְבַּ֧ד הָ/עֲבֹדָ֛ה עַל הָ/אֲנָשִׁ֖ים וְ/יַעֲשׂוּ בָ֑/הּ וְ/אַל יִשְׁע֖וּ בְּ/דִבְרֵי שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/009.yaml
  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: zh_hans
  text: 要加重这些人的劳役，好叫他们做这劳役，不去理会[a]虚假的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “理会”也可译作“留意”或“听从”。原文动词可指关注、看重或听取。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד הָעֲבֹדָה עַל הָאֲנָשִׁים
  choice: 要让这些人身上的劳役加重
  rationale: תִּכְבַּד是כבד的Qal未完成式，主语为“劳役”，字面意象是劳役沉重地压在这些人身上。“让……身上的劳役加重”既保留这一结构和命令语气，也符合现代汉语表达。
- source_word: הָעֲבֹדָה
  choice: 劳役
  rationale: עֲבֹדָה可指工作、劳动或服役；本段涉及法老强加的制砖苦工，“劳役”准确体现强制劳动的语境。
- source_word: הָאֲנָשִׁים
  choice: 这些人
  rationale: 原文为“那些人／这些人”，在本语境中指承担劳役的以色列人。汉语“这些人”自然，也不额外加入原文没有的身份称谓。
- source_word: וְיַעֲשׂוּ בָהּ
  choice: 好叫他们埋头干活
  rationale: עשה加בָּהּ指从事前述劳役；接在命令之后可表达目的或预期结果。“好叫”保留这种关联，“埋头干活”自然传达专注于劳作，但未把动词解释成特定工序。
- source_word: וְאַל יִשְׁעוּ
  choice: 不去理会
  rationale: שעה在此可表示关注、留意或听从；“理会”适合其宾语“话”，并保留其范围，不强行解释为完全相信。
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: 虚假的话
  rationale: דִּבְרֵי是“话语”的复数构造形式，שָׁקֶר表示虚假或欺骗。“虚假的话”直接传达法老对摩西、亚伦之言的贬斥性定性，而不表示叙述者认可这一判断。
theological_decisions:
- issue: “虚假的话”是谁的判断
  choice: 保留法老的原话，不在正文中加解释
  alternative: 译作“他们所谓虚假的话”或加引号
  rationale: 经文直接记录法老的命令；“虚假的话”是法老对摩西和亚伦所传信息的评价。直译可保留叙事张力，添加“所谓”则会把叙述层面的解释带入正文。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“劳役”体现强制劳动语境；“埋头干活”使句子自然有力。脚注标记紧随其所说明的“理会”，便于读者准确对应。
