  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: zh_hans
  text: 法老却说：“你们懒惰，懒惰！所以你们才说：‘让我们去向耶和华献祭。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 法老却说
  rationale: 希伯来文直译为“他却说”；结合上文明确说话者是法老，在中文中补出主语可避免指代含混。“却”体现此处回应中的反驳语气。
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: 你们懒惰，懒惰！
  rationale: נִרְפִּים在此是法老指控百姓懒散、不肯做工；保留原文重复，传达强调和斥责的力度。
- source_word: עַל כֵּן
  choice: 所以……才
  rationale: 表达法老所声称的因果推断，现代汉语自然且清楚。
- source_word: אֹמְרִים
  choice: 你们……说
  rationale: 分词在直接引语中作现在时陈述，译为普通现在表达。
- source_word: נֵלְכָה נִזְבְּחָה
  choice: 让我们去……献祭
  rationale: 两个第一人称复数祈使式表达共同提议；“让我们”保留劝请语气，“献祭”准确表达祭祀行动。
- source_word: לַיהוָה
  choice: 向耶和华
  rationale: 介词ל标明献祭的对象；以“耶和华”呈现四字神名，在简体中文圣经语境中清楚而庄重。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为人知的“耶和华”，将其作为专名呈现，而不以“主”替代；“雅威”是较接近现代学界拟音的另一选择。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“懒惰”的重复，以再现法老斥责的节奏和强度。
