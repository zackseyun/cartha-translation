base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: zh_hans
  text: 自从我到法老那里奉你的名说话，他就加害这百姓[a]；你却根本没有解救你的百姓[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就使这百姓的处境更糟。”
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在“解救”这个动词之前使用同一词根的不定式绝对形，以加强否定语气，意为“你根本没有解救”或“你丝毫没有解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָז
  choice: 自从
  rationale: מֵאָז表示“从那时起、自从”；中文“自从”自然地引出摩西回顾性的申诉。前缀连接词在中文中不必机械译出，以免句子累赘。
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: 我到法老那里
  rationale: בוא为第一人称单数完成式，אֶל表示趋向；“到法老那里”准确而符合现代汉语习惯。
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: 奉你的名说话
  rationale: 不定式表示目的；בִּשְׁמֶךָ直译为“在你的名里”，这里指以神的名义和权柄行事。中文固定表达“奉你的名”既自然，也保留“名”的神学分量。
- source_word: הֵרַע לָעָם הַזֶּה
  choice: 他就加害这百姓
  rationale: רעע的使役式可指作恶、伤害或使处境恶化。“加害”保留有意施害及造成伤害的意味，同时用脚注保留“使处境更糟”的语义可能。
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: 你却根本没有解救
  rationale: 同一词根נצל的不定式绝对形与限定动词连用，加强否定语气；“根本没有”自然传达“全然没有、丝毫没有”的强调。
- source_word: אֶת־עַמֶּךָ
  choice: 你的百姓
  rationale: עַם在出埃及记的语境中指归属于神的群体；“百姓”比泛称“人民”更符合庄重的叙事语体。
theological_decisions:
- issue: 如何表达摩西申诉中加强的否定
  choice: 你却根本没有解救你的百姓
  alternative: 你丝毫没有搭救你的百姓／你实在没有救出你的百姓
  rationale: 希伯来文以不定式绝对形配合限定动词加强否定。“根本没有”保留摩西大胆申诉的力度，却不把话解释为神最终不会施行拯救。
- issue: 如何处理“奉你的名”
  choice: 奉你的名说话
  alternative: 代表你说话／凭你的权柄说话
  rationale: 保留“名”这一原文意象，同时让现代读者自然理解摩西是受神差遣、凭神权柄发言；不将其缩减为单纯的代理关系。
- issue: הֵרַע所含道德作恶与使处境恶化之间的张力
  choice: 加害这百姓
  alternative: 恶待这百姓／使这百姓的处境更糟
  rationale: “加害”兼顾法老行为的恶意与实际伤害；脚注说明另一种语境化译法，以免消除原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“奉你的名”保留经文的重要意象；“加害”避免生硬的“行恶于”，同时保留道德与伤害双重意味。分号呈现法老加害与神尚未解救之间的对照，“却”强化摩西申诉的转折语气。
