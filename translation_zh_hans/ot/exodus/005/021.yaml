id: EXO.5.21
reference: Exodus 5:21
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם יֵ֧רֶא יְהוָ֛ה עֲלֵי/כֶ֖ם וְ/יִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת רֵיחֵ֗/נוּ בְּ/עֵינֵ֤י פַרְעֹה֙ וּ/בְ/עֵינֵ֣י עֲבָדָ֔י/ו לָֽ/תֶת חֶ֥רֶב בְּ/יָדָ֖/ם לְ/הָרְגֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: zh_hans
  text: 他们对二人说：“愿耶和华察看你们，施行审判！因为你们使我们在法老和他臣仆眼中臭不可闻[a]，把刀递到他们手里来杀我们。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“使我们的气味发臭”，意思是使我们令人厌恶，或使我们的名声败坏。
    reason: 说明希伯来语的具体隐喻及其语用含义。
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: 他们对二人说
  rationale: 承接上文，代词所指是摩西和亚伦；用“二人”既不在正文中补出姓名，又使现代汉语表达清楚自然。
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם
  choice: 愿耶和华察看你们
  rationale: 未完成式在此表达祈愿或咒诅性的请求；“愿”体现祈愿语气，“察看”比单纯“看见”更能传达求上帝关注并鉴察此事的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: וְיִשְׁפֹּט
  choice: 施行审判
  rationale: 与前一动词同为祈愿语气；保留“审判”的宽泛含义，不擅自明确判决方式或结果。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 在此引出说话者请求上帝审判的原因，译为“因为”符合上下文的因果关系。
- source_word: הִבְאַשְׁתֶּם אֶת רֵיחֵנוּ
  choice: 你们使我们……臭不可闻
  rationale: 保留原文“使气味发臭”的鲜明隐喻，同时采用自然可懂的现代汉语；不直接扁平化为“败坏我们的名声”。
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: 在法老和他臣仆眼中
  rationale: 保留重复结构所表达的评价视角；中文用一次“眼中”统摄两个对象，简洁自然且意义完整。
- source_word: לָתֵת חֶרֶב בְּיָדָם
  choice: 把刀递到他们手里
  rationale: 保留原文单数集合名词“刀”以及“放在他们手中”的形象，表达给敌方杀人的手段或机会。
- source_word: לְהָרְגֵנוּ
  choice: 来杀我们
  rationale: 直接表达不定式的目的或结果色彩，同时不额外说明是谁实际执行杀害。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用上帝的专名。正文保留专名而不以称号“主”替代；“耶和华”是现代简体中文圣经语境中最广为人知且庄重的形式。
- issue: וְיִשְׁפֹּט 的审判对象与结果
  choice: 施行审判
  alternative: 审判你们；在我们之间判断是非
  rationale: 原文没有在该动词后明说宾语或判决结果。译文保留这种开放性，由上下文显出责难指向，而不把隐含成分写死。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“臭不可闻”保留原文强烈的嗅觉隐喻；“察看……施行审判”保持祈愿兼责难的语气。
