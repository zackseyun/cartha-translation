  yaml_path: translation/ot/exodus/005/013.yaml
  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: zh_hans
  text: 督工不断催逼他们，说：“你们要完成自己的工作；每天的定额要当天完成[a]，像有秸秆的时候一样。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“每天的事，在当天完成”；这里指每天规定的工作要求或定额。
    reason: 说明希伯来语惯用语的字面形式及其在劳役语境中的含义，同时不把“事”限定为唯一的解释。
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: 督工
  rationale: 在强迫劳役的语境中，指负责逼迫以色列人完成劳动定额的人；“督工”既自然，也保留其职务及压迫性质。
- source_word: אָצִים
  choice: 不断催逼
  rationale: 分词表达持续进行的动作，语境又带有强制意味；“不断催逼”同时体现持续性和压迫性。
- source_word: כַּלּוּ מַעֲשֵׂיכֶם
  choice: 完成……工作量
  rationale: 命令式要求完成所派的劳动；结合下文每日要求，译为“完成……工作量”比单说“完成工作”更清楚。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 每天……当天的工作量
  rationale: 希伯来语惯用语直述“一天的事在当天”，在本段制砖劳役语境中指每天规定的产量或工作量；正文采用自然汉语，脚注保留字面结构及可能表达。
- source_word: כַּאֲשֶׁר בִּהְיוֹת הַתֶּבֶן
  choice: 跟有草料的时候一样
  rationale: 准确表达对先前有草料可用之情形的比较，不额外明说草料由谁供应。
