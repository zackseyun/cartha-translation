  source_fidelity: 译文正确把握了以色列人的督工意识到自己处于不利处境，以及每日砖数不得削减的命令。但“听见有人说……就看出”将原文的“看见／察觉……，说”改成了明确的听觉事件和顺序性的“就”，并略显增译；改为“当有人对他们说”可更贴近原文引出话语的功能。
  naturalness: 原译总体通顺，但“自己处境不妙”略口语化，“一块也不可减少”也较容易被理解为禁止减少任何单块，而非不得降低规定砖数。修订后更庄重、自然，且清楚表达数额不得缩减。
  terminology: “以色列人的督工”适合此处受埃及管辖的以色列人管理者；“砖数”准确表达“你们的砖的数目”。脚注保留了“以色列的众子”和每日定额这一原文信息。
