  to: 以色列人的督工[a]看出自己陷入困境，因为有人对他们说：“你们每天应交的砖数，一点也不可减少[b]。”
  rationale: 修订恢复以“看出／察觉”表达督工对自身困境的认知，避免把原文未明说的“听见”及其时序作为正文事实；同时以“砖数”及“一点也不可减少”明确保留不得削减每日规定数额的含义。
