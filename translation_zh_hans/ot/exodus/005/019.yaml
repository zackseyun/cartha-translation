base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: zh_hans
  text: 以色列人的督工[a]看出自己陷入困境，因为有人对他们说：“你们每天应交的砖数，一点也不可减少[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的众子”。“督工”也可译作“官长”或“监工”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“一日之事在其日”，意思是每天必须完成规定的数额。
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 看出
  rationale: 基本义为“看见”，在本语境中指察觉、认清自身处境；“看出”既保留视觉动词色彩，也符合现代汉语。
- source_word: שֹׁטְרֵי
  choice: 督工
  rationale: 这里指受埃及权力辖制、负责管理以色列劳工的以色列人；“督工”比泛称“官长”更清楚地表达叙事中的职能。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语直译为“以色列的众子”，在此是以色列民族的惯用称呼；“以色列人”是自然、准确的现代汉语。
- source_word: אֹתָם בְּרָע
  choice: 自己处境不妙
  rationale: 宾格代词回指这些督工，表达他们发现自己落入不利境地；רָע在此不是道德意义的“恶”，而是困境或坏处境。
- source_word: לֵאמֹר
  choice: 听见有人说
  rationale: 该词引出使督工认清处境的话语内容。汉语以“听见有人说”自然地连接他们的认知与随后引语，同时不指定说话者。
- source_word: לֹא תִגְרְעוּ
  choice: 一块也不可减少
  rationale: גרע意为削减、减少；结合“砖”的可数性，以“一块也不可减少”准确传达严厉的禁止命令。
- source_word: מִלִּבְנֵיכֶם
  choice: 应交的砖
  rationale: 字面为“从你们的砖中”，上下文指他们必须交付的砖数；“应交的砖”使汉语关系明确而不过度增译。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 每天应交的
  rationale: 字面近于“一日之事在其日”，是指每天规定完成或交付的数额；译文用自然汉语表达其定额含义，并以脚注保留原文形式。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“处境不妙”表达不利、危险的现实处境，不赋予道德上的“邪恶”含义。句序略作汉语化处理，使引语成为督工认清困境的依据；不明确补出说话者，以保留原文未指名的表达。
