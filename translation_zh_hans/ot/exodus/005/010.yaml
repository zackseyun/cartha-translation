base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: zh_hans
  text: 于是，百姓的监工和百姓中的官员[a]出去，对百姓说：“法老这样说：我不再给你们草。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “官员”或译“工头”。希伯来语这个词可指百姓中负责执行命令的下级人员。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: 监工
  rationale: 该词在本段指强制劳工完成定额的人。“监工”是现代汉语中自然、清楚的称呼，也保留了监督和催逼劳作的语境。
- source_word: שֹׁטְרָיו
  choice: 他们的官员
  rationale: 词尾所指的是作为集合名词的“百姓”。“官员”保留其下级管理人员的行政含义，不把具体职能限定得过窄；上下文中的“工头”也是可能的理解，故列入脚注。
- source_word: וַיֵּצְאוּ
  choice: 出去
  rationale: 忠实表达常用动词“出去”，并符合这些人离开法老那里、前去向百姓传令的叙事动向。
- source_word: הָעָם
  choice: 百姓
  rationale: 自然表达该集合名词；本段具体指承担劳役的以色列民众。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该词引出直接引语；译为“说”符合现代汉语叙事习惯。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 保留正式传令公式的语气，同时比生硬的逐字表达更符合现代汉语。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用该埃及君王称号通行的现代汉语译名。
- source_word: אֵינֶנִּי נֹתֵן
  choice: 我不给你们……了
  rationale: 以“不……了”表达当前开始实施的拒绝供应，既体现分词结构的现实、持续意味，也符合命令语境中的自然汉语。
- source_word: תֶּבֶן
  choice: 草
  rationale: 这里指制砖所用的草料；“草”简明自然，并与本章随后捡碎秸的情境相符。
