  yaml_path: translation/ot/exodus/005/007.yaml
  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: zh_hans
  text: “你们不可再照从前[a]那样把秸秆给百姓制砖；让他们自己去收集秸秆。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“像昨天和前天一样”，这是表示“像从前”或“以往”的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאסִפוּן
  choice: 不可再
  rationale: 否定词与יסף的使役式连用，表示停止先前持续的做法；“不可再”既传达命令语气，也自然表达“不再继续”。
- source_word: לָתֵת
  choice: 给
  rationale: נתן的基本义是“给”；此处指把制砖所需材料交给百姓，直译自然清楚。
- source_word: תֶּבֶן
  choice: 草料
  rationale: תבן指用于制砖等用途的切碎秸秆或草秆；“草料”是现代中文圣经语境中易懂且能涵盖这种材料的表达。
- source_word: לָעָם
  choice: 百姓
  rationale: עם直指“百姓、人民”；上下文虽是受役使的以色列人，但不将原文收窄为“工人”。
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: 做砖
  rationale: 介词加不定式及其宾语表示目的；“做砖”简洁自然，也保留“砖”这一明示宾语。
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: 像从前
  rationale: 字面涉及“昨天和前天”，在希伯来语中是指过去一贯情形的习语；正文采用自然中文，并以脚注保留字面形式。
- source_word: הֵם יֵלְכוּ
  choice: 让他们自己去
  rationale: 独立代词加未完成式在命令语境中有指令意味；“让他们……去”保留第三人称指令的力度，“自己”同时与后面的לָהֶם相呼应。
- source_word: וְקֹשְׁשׁוּ
  choice: 收集
  rationale: קשש指捡拾、搜集散落的材料；“收集”在此比泛泛的“找”更贴近动作含义。
- source_word: לָהֶם
  choice: 自己
  rationale: 该与格代词表示为他们自身取得草料；中文以“自己去收集”自然表达其反身受益含义。
