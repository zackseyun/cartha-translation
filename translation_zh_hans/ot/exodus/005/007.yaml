  naturalness: “不可再照从前那样把秸秆给百姓制砖”符合现代书面汉语的命令语体，且清楚标出秸秆是供百姓制砖使用的材料。“让他们自己去收集秸秆”自然保留第三人称指令和“为自己”的含义。
  terminology: 将“草料”改为“秸秆”，避免其在现代汉语中主要指动物饲料的通常含义，并更准确对应制砖所用的straw。保留“百姓”，不把עם限定为“劳工”。
