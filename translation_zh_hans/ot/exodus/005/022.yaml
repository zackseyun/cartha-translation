base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: zh_hans
  text: 摩西回到雅威那里，说：“主啊，你为什么降祸给这百姓呢？你究竟为什么差我来呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近似“为什么是这样，你差了我？”这是加强语气的说法，意为“你究竟为什么差我来呢？”
    reason: 说明לָמָּה זֶּה的字面形式及其强调作用。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: שׁוב在此表示摩西在法老回应之后回去向上帝申诉；“回到……那里”符合现代汉语表达。
- source_word: אֶל יְהוָה
  choice: 到雅威那里
  rationale: אֶל表示方向“到、向”；יְהוָה按其专名音译为“雅威”，与称号אֲדֹנָי区分。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝恭敬的直接称呼；“主啊”自然保留呼语语气。
- source_word: הֲרֵעֹתָה
  choice: 降祸给
  rationale: רעע的使役形在此指使灾祸或伤害临到百姓。“降祸给”保留强烈的使役含义及摩西申诉中的张力，同时不把措辞抽象化为上帝行了道德意义上的恶。
- source_word: לָעָם הַזֶּה
  choice: 给这百姓
  rationale: עָם指作为群体的以色列人，“这百姓”准确且符合庄重的现代汉语。
- source_word: לָמָּה זֶּה
  choice: 究竟为什么
  rationale: 字面含“为什么”和“这”，在此构成加强语气的问句；“究竟为什么”自然传达强调，脚注同时保留其形式信息。
- source_word: שְׁלַחְתָּנִי
  choice: 差我来
  rationale: 该词表示“你差遣了我”；结合摩西奉差来到法老面前的语境，“差我来”比单说“差我”更自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用与Yahweh相应的“雅威”，既保留专名性质，也避免把它与本节的称号אֲדֹנָי（“主”）混同。
- issue: הֲרֵעֹתָה所表达的责任与张力
  choice: 降祸给
  alternative: 伤害；使……遭祸；向……行恶
  rationale: 使役形把百姓所遭灾祸直接归因于受话者。译文保留摩西大胆质问的神学张力，但不将其静默解释为道德邪恶。
translation_notes:
  register: 采用现代、庄重而易懂的叙事和对话语体。“降祸给”刻意保留摩西申诉的尖锐力度；两个“为什么”维持原文连续质问的结构。
