  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: zh_hans
  text: 法老说：“看哪，如今这地的百姓这么多，你们使他们停止服苦役[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们停止服苦役”也可译作“使他们歇下所负的重担”或“使他们停止劳作”。原文动词为使役形式，可指使人停止或歇下；其完成式在这里既可侧重已经造成的结果，也可按法老眼前的指控译为正在发生的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 看哪
  rationale: 保留原文引人注意并加强语气的作用；在庄重而易懂的现代汉语中，“看哪”比单用“看”更适合直接引语。
- source_word: רַבִּים
  choice: 这么多
  rationale: 原词表示数量众多。结合הֵן和法老责难的语气，“这么多”自然地传达其强调意味，同时不增加具体数量。
- source_word: עַם הָאָרֶץ
  choice: 这地的百姓
  rationale: 贴近原文“这地之民”的结构，并保留“地”的成分；“这地的百姓”在现代汉语中比“土地的人民”自然，也不把该短语限定解释为某一社会阶层。
- source_word: עַתָּה
  choice: 如今
  rationale: 准确表达当前情势，语体庄重而自然。
- source_word: וְהִשְׁבַּתֶּם
  choice: 你们竟使他们停下
  rationale: 该词是שׁבת的使役形，核心意思是“使停止／歇下”。“使他们停下”保留使役关系；“竟”体现连接词在责难语境中的转折和惊诧语气，但不改变命题内容。
- source_word: מִסִּבְלֹתָם
  choice: 苦役
  rationale: 该词字面涉及他们所负的重担，在出埃及记的语境中具体指强加于以色列人的沉重劳役。“苦役”简洁自然，并保留受压迫劳动的含义。
