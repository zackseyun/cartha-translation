  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: zh_hans
  text: 可是，埃及王对他们说：“摩西、亚伦，你们为什么使百姓停下手中的活[a]？去服你们的劳役吧[b]！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使百姓分心，不再做工”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“去承担你们的重担吧”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 可是……说
  rationale: 承接叙事，同时表达法老对上一节请求的反驳；“可是”符合上下文，又不改变事件次序。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: 埃及王
  rationale: 按希伯来语属格结构直译，简洁自然。
- source_word: לָמָּה
  choice: 为什么
  rationale: 保留直接质问的语气，符合现代汉语。
- source_word: תַּפְרִיעוּ
  choice: 使……停下
  rationale: 该词在此为使役形，表示使百姓中断或停止劳作；此译法保留使役含义和法老指责的口吻。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文指整体的“民、百姓”，不缩窄为“工人”。
- source_word: מִמַּעֲשָׂיו
  choice: 手中的活
  rationale: 原文后缀为单数，与集合名词“百姓”呼应；汉语用“百姓……手中的活”自然表达其集体所做的工作。
- source_word: לְכוּ
  choice: 去
  rationale: 直接保留复数命令语气。
- source_word: לְסִבְלֹתֵיכֶם
  choice: 担你们的重担
  rationale: 保留 סְבָלוֹת 的负重意象及压迫意味；上下文也允许理解为被强迫承担的劳役。
