  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: zh_hans
  text: 摩西却对上帝说：“我是谁，竟能到法老那里去，把以色列人从埃及领出来呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: אמר的叙事体常用表达，现代汉语自然译为“说”。
- source_word: אֶל הָאֱלֹהִים
  choice: 对上帝
  rationale: 介词אֶל表示言语所指向的对象；“对上帝说”符合现代汉语表达。
- source_word: מִי אָנֹכִי
  choice: 我是谁
  rationale: 直译并保留摩西自觉不配、能力不足的反问语气，不加解释。
- source_word: כִּי אֵלֵךְ
  choice: 竟能……去
  rationale: כִּי在“我是谁”之后引出所设想的行动；“竟能”自然表达反问中的资格与能力疑虑，同时保留未然意味。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代汉语中这一埃及君王称号的通行译名。
- source_word: וְכִי אוֹצִיא
  choice: 把……领出来
  rationale: יצא的使役形表示使人出去，即“带出、领出”；与前一分句并列，并由同一个反问统摄。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该希伯来语亲属称谓在此指以色列民族整体；“以色列人”是现代汉语准确、自然且不致被误解为仅指男性或未成年人的集体称呼。
- source_word: מִמִּצְרָיִם
  choice: 从埃及……出来
  rationale: מִן表示离开的起点；与使役动词搭配，汉语自然表达为“从埃及领出来”。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列人
  alternative: 以色列的子孙
  rationale: 原文是具有宗族色彩的阳性复数结构，但在本语境中指雅各后裔所组成的全体民族，而非只指男性。“以色列人”既保留民族身份，又避免现代汉语读者将“儿子”误解为年龄或性别限定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“却”承接上文上帝的差遣并突出摩西的异议；句末“呢”保留原文反问语气。两个行动“到法老那里去”和“把以色列人从埃及领出来”均受“我是谁，竟能……”统摄。
