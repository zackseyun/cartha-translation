  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: zh_hans
  text: 雅威的天使[a]在荆棘丛中的火焰里向摩西显现。摩西看见，荆棘丛在火中燃烧，却没有被烧毁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威的使者”。希伯来语 מַלְאָךְ 既可指“天使”，也可指“使者”。
    reason: 保留原词在天上使者与一般受差遣者之间的词义开放性。
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 显现
  rationale: 该词为ראה的尼法勒形态，在神圣显现的叙事中自然表达为“显现”，比直译“被看见”更符合现代汉语，同时保留其自行进入可见状态的含义。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的天使
  rationale: מַלְאַךְ既可指一般的“使者”，也可指天上的“天使”；本段神圣显现的语境适合正文采用“天使”，并以脚注保留“使者”这一真实的词义可能。יהוה按其专名译作“雅威”。
- source_word: אֵלָיו
  choice: 向摩西
  rationale: 原文直译为“向他”；为使独立经节清楚易懂，以上下文中的先行对象“摩西”明确所指，并未改变指称。
- source_word: בְּלַבַּת אֵשׁ מִתּוֹךְ הַסְּנֶה
  choice: 在荆棘丛中的火焰里
  rationale: 保留“火焰”与“荆棘丛内部”的空间意象，同时调整为自然的现代汉语结构。
- source_word: וַיַּרְא וְהִנֵּה
  choice: 摩西观看，只见
  rationale: “观看”表达摩西把注意力转向异象；“只见”自然传达הִנֵּה引人注意、呈现惊异景象的叙事功能。
- source_word: בֹּעֵר בָּאֵשׁ
  choice: 在火中燃烧
  rationale: “燃烧”体现分词所表示的持续状态，“在火中”保留原文明确提及的火。
- source_word: אֵינֶנּוּ אֻכָּל
  choice: 却没有烧尽
  rationale: אכל的被动式在火烧语境中指被吞噬、焚尽；“没有烧尽”自然清楚，并保留这一征兆的悖论。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”将其作为专名呈现，不以称号替代，也避免沿用较不符合学界通常复原读音的“耶和华”。
- issue: 神显语境中מַלְאַךְ的身份表达
  choice: 天使
  alternative: 使者
  rationale: 本节语境适合“天使”，但原词本身只表明受差遣者，并未在词汇层面解决这位使者与雅威之间的全部神学关系；因此脚注保留“使者”，正文不进一步界定其身份。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“只见”承担希伯来语叙事提示词的功能；“却没有烧尽”简洁呈现持续燃烧而不被焚毁的异常景象。
