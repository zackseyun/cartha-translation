id: EXO.3.15
reference: Exodus 3:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: zh_hans
  text: 神又对摩西说：“你要这样对以色列人说：‘雅威[a]——你们列祖的神，亚伯拉罕的神、以撒的神、雅各的神——差我到你们这里来。’这是我的名，直到永远；这也是我世世代代的记念[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译自希伯来文神名 יהוה（YHWH）；传统上也译作“耶和华”，或以“主”代称。
    reason: 说明神名的原文形式及主要传统译法。
  - marker: b
    text: 原文也可译作“我的纪念”，或“我世世代代受记念的名”。
    reason: 保留 זִכְרִי 可指“记念／纪念”以及与神名相关的“受记念之名”的词义幅度。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，不以“主”这一称号替代；“雅威”是现代汉语中通行且易懂的译法。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语字面为“以色列的众子”，在这里指以色列民族；译作“以色列人”符合现代汉语群体称谓，又不改变所指。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: 你们祖先的神
  rationale: אֲבֹתֵיכֶם 字面为“你们的父辈／列祖”，这里特别由亚伯拉罕、以撒、雅各加以说明；“祖先”在现代汉语中自然明确。
- source_word: שְׁלָחַנִי
  choice: 差我到你们这里来
  rationale: 完成式表示差遣已经作出并构成摩西当前使命；“差……来”简洁保留差遣方向和现时关联。
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: 这是我的名，直到永远
  rationale: לְעֹלָם 表示没有限定终点的长久持续；“直到永远”自然保留其恒久意义。
- source_word: זִכְרִי
  choice: 记念我的名
  rationale: זִכְרִי 可指“我的记念”或使人记得他的称名方式；结合前句“我的名”，如此表达在现代汉语中较清楚，同时以脚注保留词义幅度。
- source_word: לְדֹר דֹּר
  choice: 世世代代
  rationale: 以汉语叠用形式传达原文“代代”的连续性。
- source_word: כֹּה תֹאמַר
  choice: 你要这样告诉
  rationale: 准确传达指示性的说话公式，并比“你要如此说”更符合现代口语书面语。
- source_word: עוֹד
  choice: 又
  rationale: 标明神继续对摩西说话，不必理解为重复同一句话。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。音译“雅威”保留专名性质；脚注说明希伯来字母形式，不以称号替代。
- issue: זִכְרִי 与神名的关系
  choice: 记念我的名
  alternative: 我的记念；人所记念我的方式
  rationale: 该词可以指“记念／纪念”，在本节也可能指神藉以被称念、被记得的名。正文依上下文作自然表达，脚注保留这种词义张力。
- issue: בְּנֵי יִשְׂרָאֵל 的群体表达
  choice: 以色列人
  alternative: 以色列众子；以色列子民
  rationale: 此处是固定民族称谓，并非要特别强调群体成员的性别；现代汉语“以色列人”准确、庄重且不额外引入神学立场。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威”作为专名保留原文的启示重点；破折号标明同位说明，避免连续多个“神”造成句法含混。
