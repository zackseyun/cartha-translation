base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: zh_hans
  text: 耶和华见摩西转过去观看，神就从荆棘丛中呼唤他，说：“摩西！摩西！”摩西说：“我在这里。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，保留其与本节 אֱלֹהִים 的区别，不以同一个称谓抹平原文用词。
- source_word: וַיַּרְא
  choice: 见
  rationale: ראה 在连续叙事中表示看见；与后面的内容从句连用，中文“见……就……”自然呈现观察后随即呼唤的叙事推进。
- source_word: כִּי
  choice: （以“见……转过去”表达）
  rationale: 此处引出耶和华所看见的内容；中文无需另译“那/因为”，可直接接宾语小句。
- source_word: סָר
  choice: 转过去
  rationale: סור 表示偏转、转离原来的方向；这里指摩西转向异象去观看。“转过去”自然且不额外断定他走了多远。
- source_word: לִרְאוֹת
  choice: 观看
  rationale: 不定式表示目的；“观看”比“看见”更准确地表达主动察看的意思。
- source_word: וַיִּקְרָא אֵלָיו
  choice: 呼唤他
  rationale: קרא אל 表示向某人呼叫；“呼唤他”保留明确对象，也符合庄重叙事语体。
- source_word: אֱלֹהִים
  choice: （按中文语序省略重复主语）
  rationale: 原文明说“上帝”从荆棘丛中呼唤，但其所指与前句“耶和华”相同。中文在同一句承接主语更自然；省略不是将两个神名等同翻译，而是按汉语语法避免生硬重复。
- source_word: מִתּוֹךְ
  choice: 从……中
  rationale: 准确表达从内部发声的空间关系，兼具自然与庄重。
- source_word: הַסְּנֶה
  choice: 荆棘丛
  rationale: סְנֶה 指一种带刺灌木或荆棘丛；“荆棘丛”比泛称“灌木”更保留词义特征，同时不武断指定具体植物。
- source_word: מֹשֶׁה מֹשֶׁה
  choice: 摩西！摩西！
  rationale: 重复名字表达直接、郑重而急切的呼唤；分用两个感叹号符合自然中文引语节奏。
- source_word: הִנֵּנִי
  choice: 我在这里
  rationale: 这是回应呼唤、表示在场并准备应答的惯用语；“我在这里”自然明确，又不把顺服或服役等含义过度加入正文。
theological_decisions:
- issue: 同一节中 יְהוָה 与 אֱלֹהִים 的处理
  choice: 将 יְהוָה 译为“耶和华”；后半句因中文主语承接而不重复译出 אֱלֹהִים。
  alternative: 译作“耶和华见摩西……，上帝就从荆棘丛中呼唤他”。
  rationale: 原文两个称呼指向同一位说话者，但用词不同。直译“上帝”最能显出词汇区别，不过在中文单句中紧接着更换同一主语的称谓，容易令人误以为换了行动者。主语承接既不混同两词，也避免制造原文没有的角色歧义。
- issue: 末尾 וַיֹּאמֶר 的主语
  choice: 明确译为“摩西说”。
  alternative: 译为“他说”。
  rationale: 原文依上下文可知回应者是摩西；中文若只说“他说”，可能误指最近的神圣说话者。补明“摩西”不改变所指，并提升清晰度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。保留神名“耶和华”，用“荆棘丛”呈现 סְנֶה 的带刺灌木含义；不设置脚注，因为正文已能准确自然地表达本节，且所给英文脚注标记与内容明显错位，未据此误植。
