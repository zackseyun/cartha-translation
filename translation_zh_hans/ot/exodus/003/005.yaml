source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּקְרַ֣ב הֲלֹ֑ם שַׁל נְעָלֶ֨י/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔י/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔י/ו אַדְמַת קֹ֖דֶשׁ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: zh_hans
  text: 他又说：“不要靠近这里[a]。脱下你脚上的凉鞋，因为你所站的地方是圣洁之地[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不要到这里来。”
    reason: הֲלֹם 可与“靠近”合起来理解为朝这个地点而来；正文采用较自然的空间表达。
  - marker: b
    text: 直译：“圣洁的土地。”
    reason: אַדְמַת קֹדֶשׁ 是领属结构，字面指“圣洁的土地／地面”；脚注保留其形式。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他又说
  rationale: 承接前文并推进叙事；“又说”符合现代汉语叙事习惯，也保留连续发言的意味。
- source_word: אַל תִּקְרַב הֲלֹם
  choice: 不要靠近这里
  rationale: 否定词与未完成式表达禁令；“靠近这里”自然传达空间上的禁止，同时保留 הֲלֹם 所指的“这里”。
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: 把你脚上的鞋脱下来
  rationale: שַׁל 是“脱去、移除”的命令；“脚上的鞋”保留 מֵעַל רַגְלֶיךָ 的明确表达，而“脱下来”是现代汉语对脱鞋的自然说法。נַעַל 指鞋履，汉语“鞋”既清楚又不过度限定其具体式样。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出命令的理由；“因为”直接表达因果关系。
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: 你站的地方
  rationale: 自然表达摩西当下所立之处，并包含 עָלָיו“在其上”的空间关系，无须在汉语中重复“其上”。
- source_word: אַדְמַת קֹדֶשׁ
  choice: 圣地
  rationale: 该结构直译为“圣洁的土地/地面”；“圣地”简洁、庄重，准确表达这片地面具有神圣性质。
- source_word: הוּא
  choice: 是
  rationale: 该代词在名词句中起强调或系词性作用；汉语用“是”自然构成判断句。
theological_decisions:
- issue: 此地神圣性质的来源
  choice: 只陈述“你站的地方是圣地”，不增添原因解释
  alternative: 明确解释为因上帝临在而成为圣地
  rationale: 本节断言这地方神圣，却没有在句中进一步说明其神圣性质如何产生；译文保留经文本身的陈述，不加入神学推论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“把你脚上的鞋脱下来”保持口语自然度，同时不削弱命令的严肃性；“圣地”简洁凝练，脚注补充希伯来语结构。
