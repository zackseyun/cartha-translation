  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: zh_hans
  text: 各妇女要向她的女邻居和住在她家里的女人[b]请求[a]银器、金器和衣服；你们要让你们的儿子和女儿穿戴这些东西。这样，你们就要掠夺埃及[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“索要”。传统上有译本作“借”，但希伯来语动词的基本意思是“求、索取、请求”，本身不表示必须归还。
    reason: lexical_alternative
  - marker: b
    text: 或译“寄居在她家里的女人”。
    reason: lexical_alternative
  - marker: c
    text: 或译“剥取埃及”或“把埃及夺掠一空”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: 要……索要
  rationale: שׁאל的基本义是“求、索取、请求”，上下文没有强调日后归还，因此不译作“借”。“索要”既符合语境，也保留这是向埃及人提出要求的含义。
- source_word: אִשָּׁה
  choice: 各妇女
  rationale: 希伯来文不定单数在这里具有逐一分配的意义；“各妇女”用现代汉语自然表达这一作用。
- source_word: מִשְּׁכֶנְתָּהּ
  choice: 向她的女邻居
  rationale: 该名词为阴性，语境所指也是女性邻居；汉语用“女邻居”可明确保留原文的性别信息。
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: 和住在她家里的女人
  rationale: גָּרַת是גור的阴性分词，可指寄居或暂住者。正文采用清楚自然的表达，并以脚注保留“寄居者”这一词义可能性。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: 金器、银器
  rationale: כְּלִי泛指器物或物件，并不限定为首饰。汉语“金器、银器”简洁且保持类别宽泛；按现代汉语常见并列次序处理为“金器、银器”，不改变所指。
- source_word: וּשְׂמָלֹת
  choice: 衣服
  rationale: 该词泛指衣物；“衣服”是现代汉语中自然、宽泛的对应词。
- source_word: וְשַׂמְתֶּם עַל
  choice: 把这些放在……身上
  rationale: 直译שׂים加עַל的空间表达，既可涵盖穿戴衣物，也不把金银器物擅自限定为首饰。
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: 你们的儿子和女儿
  rationale: 原文明确分别提到儿子和女儿，故不笼统合并为“孩子”。
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: 这样，你们就要掠夺埃及
  rationale: נצל的Piel词形在此有剥取、夺取战利品之意。“掠夺”保留原文强烈措辞；“这样……就……”自然表达此处连接词所引出的结果。
theological_decisions:
- issue: 以色列人取走埃及财物是否应被弱化为借用
  choice: 索要……掠夺埃及
  alternative: 借……取走埃及的财物
  rationale: 原文的שׁאל并不要求理解为借后归还，而נצל又明确带有剥取、掠夺的力度。译文不把这一行动弱化，也不额外加入欺骗或偿还的观念，保留经文本身的伦理与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文从“各妇女”的单数分配表达转为“你们”的复数 خطاب；明确“儿子和女儿”，并用脚注呈现שׁאל、גור和נצל的主要词义幅度。
