base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: zh_hans
  text: 摩西说：“我要过去看看这奇异的景象，为什么荆棘丛没有烧毁。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为什么荆棘丛没有燃烧”，或“为什么荆棘丛没有烧尽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推进情节；现代汉语通常无需把连接词机械译作“于是”或“然后”，上下文已能显明顺序。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אָסֻרָה נָּא
  choice: 我要过去
  rationale: 祈愿式配合 נָא 表达摩西当下的意愿或自我促动；“我要过去”自然地传达主动转向并走近察看的意思。
- source_word: וְאֶרְאֶה
  choice: 看看
  rationale: ראה 在此指亲自察看；重叠式“看看”符合现代汉语口语中的自语语气，也不过度强化为“查明”。
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: 这奇异的景象
  rationale: מַרְאֶה 指眼前所见的景象；גָּדֹל 在此重在非凡、令人惊异，而非物理尺寸，因此译作“奇异”较自然。
- source_word: מַדּוּעַ
  choice: 为什么
  rationale: 直接保留原因问句。
- source_word: לֹא יִבְעַר
  choice: 没有烧毁
  rationale: בער 的基本义是“燃烧”；结合上一节荆棘丛着火却未被烧尽的情境，“烧毁”表达燃烧所导致的毁坏，同时以脚注保留“没有燃烧／没有烧尽”等可能理解。
- source_word: הַסְּנֶה
  choice: 荆棘丛
  rationale: סְנֶה 指一种灌木，可能带刺；“荆棘丛”既符合传统语境，也比笼统的“灌木”更具辨识度，但不进一步断定植物种类。
theological_decisions:
- issue: 荆棘丛与火之间反常现象的表达
  choice: 为什么荆棘丛没有烧毁
  alternative: 为什么荆棘丛没有燃烧；为什么荆棘丛没有烧尽
  rationale: 希伯来语动词本身通常表示“燃烧”，而上下文显示反常之处在于荆棘丛虽着火却未毁坏。正文用“没有烧毁”保持自然并衔接上下文，脚注则保留原文在“燃烧”和“被烧尽”之间的语义张力，不附加神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。摩西的自语用“我要过去看看”，简洁易懂；不机械复制希伯来语连接词。脚注标记置于相关分句之后，以保留 לֹא יִבְעַר 的词义歧义。
