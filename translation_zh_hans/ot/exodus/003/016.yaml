source:
  edition: WLC
  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: zh_hans
  text: 你去召集以色列的长老，对他们说：‘雅威[a]——你们先祖的上帝，就是亚伯拉罕、以撒、雅各的上帝——曾向我显现，说：“我确实眷顾了你们，也眷顾了你们在埃及所遭受的事[b]。”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文神名 יהוה；“耶和华”是另一常见的传统音译。
    reason: 说明神名的音译选择，并与 Yahweh 的审校轨迹一致。
  - marker: b
    text: “确实眷顾了”对应希伯来文的加强式表达，也可译作“我确实留意了”或“我确实察看了”。此处不仅指观察，也可指神作出决定性的关注并将介入。
    reason: 说明 פָּקֹד פָּקַדְתִּי 的强调形式及语义范围。
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: 你去召集
  rationale: 直陈使命并自然表达召聚群体之意；“召集”适合长老这一公共领袖群体。
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: 以色列的长老
  rationale: 保留古代以色列群体领袖的固定称谓。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名音译来呈现四字神名，而不以称号替代。
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: 你们祖先的上帝
  rationale: 在现代汉语中“祖先”自然且准确；下文随即以亚伯拉罕、以撒、雅各明确其族长所指。
- source_word: נִרְאָה אֵלַי
  choice: 曾向我显现
  rationale: 这是神显现的惯用表达；“曾”表明该事件已经发生而与当前使命相关。
- source_word: פָּקֹד פָּקַדְתִּי
  choice: 我确实眷顾了你们
  rationale: 同源不定式与限定动词连用表示强调；“确实”传达加强语气，“眷顾”兼含留意、关怀并准备介入之意。
- source_word: וְאֶת הֶעָשׂוּי לָכֶם בְּמִצְרָיִם
  choice: 也看到了你们在埃及所遭遇的一切
  rationale: 原文是被动性的“对你们所做的事”；此译保持施事者不明，并以自然汉语表达以色列人遭受的苦待。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者都是对神名的音译；正文采用现代中文基督教语境中辨识度更高且庄重的“耶和华”，并用脚注说明另一常见拟音。
- issue: פָּקֹד פָּקַדְתִּי 所表达的神圣行动
  choice: 我确实眷顾了你们
  alternative: 我确实察看了你们／我必定临到你们
  rationale: 该动词在此不只是观察，也暗示带来干预的决定性关注；“眷顾”保留关怀和行动倾向，但不把尚未明说的拯救结果完全展开。
- issue: אֲבֹתֵיכֶם 的族长性指向
  choice: 你们祖先的上帝
  alternative: 你们列祖的上帝
  rationale: “列祖”更贴近传统宗教措辞，“祖先”则是普通现代读者更自然的表达；亚伯拉罕、以撒、雅各的列举保留了明确的父系族长框架。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。直接引语层次清楚；避免过度古雅的“列祖”“鉴察”等措辞，同时保留神显现、族长身份和神主动眷顾的神学张力。
