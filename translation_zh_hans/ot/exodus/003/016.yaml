revisions:
- from: 你去召集以色列的长老，对他们说：‘耶和华[a]你们祖先的上帝，就是亚伯拉罕、以撒、雅各的上帝，曾向我显现，说：“我确实眷顾了你们，也看到了你们在埃及所遭遇的一切[b]。”’
  to: 你去召集以色列的长老，对他们说：‘雅威[a]——你们先祖的上帝，就是亚伯拉罕、以撒、雅各的上帝——曾向我显现，说：“我确实眷顾了你们，也眷顾了你们在埃及所遭受的事[b]。”’
  rationale: 修订恢复原文的并列宾语结构：神“确实眷顾”以色列，也“眷顾”他们在埃及所遭受的事；不另加“看到了”或“一切”。“雅威”对应既定的 Yahweh 音译；“先祖”在现代普通话中自然，且由后文三位族长的名字具体限定。
