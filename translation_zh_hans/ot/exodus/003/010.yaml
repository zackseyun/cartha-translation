    rationale: וְאֶשְׁלָחֲךָ在此为上帝对摩西发出的确定差遣宣告；中文“我要”常可理解为“我想要”。“我必差遣你”更明确传达该语气，且不添加原文没有的目的关系。
  - severity: low
    issue: 脚注的“以色列的众子”略显生硬且“众”并非原文字面必要成分。
