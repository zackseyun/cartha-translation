base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: zh_hans
  text: 现在，你去吧！我必差遣你到法老那里；你要把我的百姓，就是以色列的子孙，从埃及领出来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 这是承接上文并推进话语的时间—论述转换语；现代汉语用“现在”即可自然表达希伯来语连接词与时间副词的合力。
- source_word: לְכָה
  choice: 你去吧
  rationale: הלך的命令式在这里发出差遣；按叙事情境译作“去”比“来”更清楚，“吧”表达命令中的催促而不过分生硬。
- source_word: וְאֶשְׁלָחֲךָ
  choice: 我要差你
  rationale: 直接表达第一人称未完成式及第二人称单数宾语，保留上帝亲自差遣摩西的含义，不额外加入目的关系。
- source_word: אֶל־פַּרְעֹה
  choice: 到法老那里
  rationale: 自然表达方向介词，并保留“法老”这一王室称号。
- source_word: וְהוֹצֵא
  choice: 你要……领出来
  rationale: 这是יצא的使役式命令，意为使人出去；“领出来”既保留使役和带领的含义，也符合摩西带百姓出埃及的语境。另起一句可清楚保留其命令语气。
- source_word: עַמִּי
  choice: 我的百姓
  rationale: 直接保留所属表达及其关系性、盟约性分量；“百姓”在现代汉语中庄重而易懂。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来语的家族—祖先称谓及复数群体含义；破折号显示它与“我的百姓”构成同位说明。脚注提供更通顺的族群称谓。
- source_word: מִמִּצְרָיִם
  choice: 从埃及……出来
  rationale: 与使役动词搭配，汉语“从埃及领出来”自然呈现离开埃及的方向和出离动作。
theological_decisions:
- issue: 如何表达בְנֵי יִשְׂרָאֵל这一盟约群体称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 正文保留源语以祖先“以色列”为中心的家族性称谓，不把它直接化约为单纯族名；脚注同时给出自然、通行的现代汉语表达。
- issue: וְהוֹצֵא的施事与命令语气
  choice: 另句译作“你要……领出来”
  alternative: 与前句合并为“差你……把……领出来”
  rationale: 源语使用第二人称命令式，因此明确呈现这是交给摩西的任务；同时不否认整个行动出自上帝的差遣和旨意。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“你去吧”体现差遣语境；以两个短句分别呈现上帝的差遣和对摩西的命令。正文中的破折号标明“以色列子孙”是“我的百姓”的同位说明，避免误读为两个群体。
