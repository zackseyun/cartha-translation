revisions:
- from: 现在，你去吧！我要差你到法老那里。你要把我的百姓——以色列子孙[a]——从埃及领出来。
  to: 现在，你去吧！我必差遣你到法老那里；你要把我的百姓，就是以色列的子孙，从埃及领出来。
  rationale: 修订仅消除“我要”可能造成的意愿性歧义，并微调标点与同位表达，使中文更清楚地反映原文“去—我必差遣—领出”的连续委任。保留“去吧”，因为该命令在差遣场景中自然传达הלך的行动方向；保留“以色列的子孙”及其脚注替代译法，以兼顾源语形式和现代汉语可读性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:35Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确呈现了连续的差遣与命令，以及“从埃及领出来”的使役含义。“我要差你”在现代汉语中也可能被理解为意愿性的“我想要”，未充分体现希伯来语未完成式在此处的确定应许／宣告语气；改为“我必差遣你”更稳妥。
  naturalness: “你去吧”和“领出来”自然、庄重，适合现代标准汉语经文语体。以分号连接差遣与随后交付的任务，比原来的两个句号更能反映原文连续的协调结构；“就是以色列的子孙”清楚表达同位关系。
  terminology: “法老”“差遣”“我的百姓”“以色列的子孙”均恰当。“以色列的子孙”保留家族—祖先称谓，不将其直接中和为单纯族名；脚注提供“以色列人”这一惯用表达。
