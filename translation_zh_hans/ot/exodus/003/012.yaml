base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: zh_hans
  text: 神说：“我必与你同在。这就是给你的记号，表明是我差派了你：你把百姓从埃及领出来以后，你们必在这座山上事奉[a]神。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“敬拜”。这里的希伯来语动词既可指“服事、事奉”，用于神时也可指“敬拜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: 我必与你同在
  rationale: 这里的כִּי引出神对摩西异议的保证；中文不必另加“确实”，以“必”自然表达肯定和将来的应许。אֶהְיֶה在此指向将来，עִמָּךְ表示陪伴和同在。
- source_word: הָאוֹת
  choice: 记号
  rationale: אוֹת指具有确认作用的标记或征兆；“记号”既贴近原词，也保留其指向未来之事件的性质。
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: 表明是我差派了你
  rationale: 该从句说明记号所要确认的事；“是我”体现独立代词אָנֹכִי的强调，“差派了”表达已经作出的委任及其当前效力。
- source_word: בְּהוֹצִיאֲךָ אֶת־הָעָם מִמִּצְרַיִם
  choice: 你把百姓从埃及领出来以后
  rationale: ב加不定词结构在此作时间状语；第二人称单数后缀以摩西为领出百姓的执行者。“领出来”比直译“带出”更符合现代汉语叙事。
- source_word: תַּעַבְדוּן
  choice: 你们必……事奉
  rationale: 动词为第二人称阳性复数，与前面的单数“你”形成有意义的转换，指摩西和百姓。עבד用于神时兼有服事与敬拜之意；正文采用“事奉”以保留其词义宽度。
- source_word: אֶת־הָאֱלֹהִים
  choice: 神
  rationale: 定指形式在本语境中指以色列的神；简洁译作“神”，不加入原文未明说的限定。
- source_word: עַל הָהָר הַזֶּה
  choice: 在这座山上
  rationale: 保留עַל的空间意象和指示词“这”，自然呈现何烈山／西奈山的具体叙事场景。
theological_decisions:
- issue: “记号”的性质
  choice: 将出埃及后在这座山上事奉神理解为这个面向未来的记号内容
  alternative: 将神当前所应许的同在本身理解为记号，或认为记号同时包括当前应许与未来应验
  rationale: 句法最自然地让后面的时间句和“事奉神”说明记号的内容；译文保留这种前瞻性的确认，不把它改写成立即可见的凭证。
- issue: 事奉与敬拜的关系
  choice: 正文译作“事奉”，脚注注明也可理解为“敬拜”
  alternative: 正文直接译作“敬拜”
  rationale: עבד面对神时含有敬拜意味，同时仍保留服事、归属和效忠的语义；“事奉”更能保存这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“差派”清楚表达委任，“领出来以后”自然呈现时间关系；保留单数“你”转为复数“你们”的原文变化。脚注标记置于“事奉”之后，因为注释针对该词。
