base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: zh_hans
  text: 我要伸出我的手，击打埃及，用我将在其中施行的一切奇事；此后，他就会放你们走[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把你们送出去。”原文更直译是“送出你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: 我要伸出我的手
  rationale: שׁלח本义为“派出、伸出”，与“手”连用时表达采取行动、施展能力。译作“伸出我的手”既保留希伯来文的具体形象，也符合现代汉语表达。
- source_word: וְהִכֵּיתִי אֶת־מִצְרַיִם
  choice: 击打埃及
  rationale: נכה表示“击打、打击”；宾语מִצְרַיִם是“埃及”这一国家整体。此译法不额外限定为杀戮或毁灭，并与后续灾祸的语境相合。
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: 用……一切奇事
  rationale: נִפְלָאוֹת指令人惊异的非凡作为。“奇事”简洁、庄重，并保留经文用语的神迹性意味。
- source_word: אֲשֶׁר אֶעֱשֶׂה בְּקִרְבּוֹ
  choice: 我将在其中施行的
  rationale: 单数后缀指回作为整体的“埃及”；“在其中”保留空间意象。“施行”比单纯的“做”更自然地搭配“奇事”。
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 清楚而庄重地表达事件的先后次序。
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: 他就会放你们走
  rationale: שׁלח可指“送出、打发走、让……离开”。在法老准许以色列人离开的语境中，“放你们走”是自然准确的现代汉语；脚注保留较直译的可能。
theological_decisions:
- issue: 描述上帝行动的拟人化语言
  choice: 保留“伸出我的手”的身体隐喻
  alternative: 抽象译为“施展我的能力”
  rationale: 原文以具体的手之形象描述上帝介入行动。保留这一形象尊重原文，也避免把经文本身的表达预先解释为抽象概念。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“击打”保留原文力度；“奇事”保持圣经语体而不显陈旧。主文采用自然汉语“放你们走”，并以脚注交代原文与前半句שׁלח的词语呼应。
