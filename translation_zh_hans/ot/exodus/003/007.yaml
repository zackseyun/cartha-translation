  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: zh_hans
  text: 雅威说：“我确实看见了我在埃及的子民所受的苦，也听见了他们因监工[a]而发出的呼求[b]；因为我知道他们的痛苦。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “监工”或译“压迫他们的人”。原文指催逼、强征劳役或贡赋的人。
    reason: lexical_alternative
  - marker: b
    text: “呼求”或译“哀号”。原文指困苦中发出的呼喊。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经读者熟悉的专名形式“耶和华”，将四字神名作为名字表达，而不以“主”这一称号代替。
- source_word: רָאֹה רָאִיתִי
  choice: 我确实看见了
  rationale: 希伯来语不定式绝对式与限定动词连用，强调“看见”；“确实看见了”在现代汉语中自然保留这一强调。
- source_word: עֳנִי
  choice: 所受的苦
  rationale: 该词指困苦、苦难或受压迫的悲惨处境；此译法自然宽泛，不把含义限缩为单一形式的压迫。
- source_word: עַמִּי אֲשֶׁר בְּמִצְרָיִם
  choice: 我在埃及的子民
  rationale: 紧凑而自然地表达“我的子民，就是那些在埃及的”，保留所属关系和地点限定。
- source_word: צַעֲקָתָם
  choice: 他们……发出的呼求
  rationale: 该词是人在困境中发出的呼喊；“呼求”兼具呼喊和求助之意，适合本处语境。
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: 因监工
  rationale: מִפְּנֵי在此说明呼求的缘由；נֹגְשִׂים在出埃及记的强迫劳役背景中指催逼劳工的人，“监工”比泛称“压迫者”更具体。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述听见呼求的根据，在汉语中以“因为”清楚表达解释关系。
- source_word: יָדַעְתִּי
  choice: 我知道
  rationale: 虽为完成式，此处表达上帝当前且亲切切身的认识；直译“知道”保留原文的神学力度。
- source_word: מַכְאֹבָיו
  choice: 他们的痛苦
  rationale: 复数形式涵盖他们经历的种种疼痛与苦楚；汉语集合性表达“痛苦”自然且不缩窄语义。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 保留神的专名而非用称号替代；“耶和华”是现代简体中文圣经语境中最广为人知、可读性最高的专名形式。
- issue: 上帝“知道”百姓痛苦的拟人性表达
  choice: 我知道他们的痛苦
  alternative: 我留意到他们的痛苦；我了解他们的痛苦
  rationale: 直接保留ידע的普通认知动词，不将其淡化为抽象的信息知悉，也不额外解释上帝将采取何种行动。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留原文从“看见”到“听见”再到“知道”的推进；避免古奥的“诚然”“哀声”等表达。主文中的[a]与脚注一致。
