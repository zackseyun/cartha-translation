base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: zh_hans
  text: 我曾说过[a]：‘我要把你们从在埃及所受的苦难中领上来，进入迦南人、赫人、亚摩利人、比利洗人、希未人和耶布斯人所住的地，就是流奶与蜜之地。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我说过。”希伯来文动词在形式上指过去的发言；正文“我曾说过”也表达这项宣告在当前语境中仍然有效。
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: 我曾说过
  rationale: 该动词形式在形态上指向过去的发言；“曾说过”既保留过去时意味，也自然表达这项宣告在当前语境中仍然有效。
- source_word: אַעֲלֶה אֶתְכֶם
  choice: 我要把你们……领上来
  rationale: עלה的使役形表示“使上去、带上去”；“领上来”保留从埃及上到应许之地的方向意象，又符合现代汉语表达。
- source_word: מֵעֳנִי מִצְרַיִם
  choice: 从埃及的苦难中
  rationale: עֳנִי可指苦难、困苦或受压迫的处境；此译保留较宽的语义范围，不把含义限定为单一形式的压迫。
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: 带到迦南人、赫人、亚摩利人、比利洗人、希未人和耶布斯人的地
  rationale: 希伯来文用单数族名统称各族；汉语用“某某人”自然表达群体，并保留土地由这些民族居住的句法关系。
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 带到流奶与蜜之地
  rationale: 保留希伯来文描写丰饶的具体隐喻；“流奶与蜜之地”在汉语圣经语体中简洁、庄重且易懂。
theological_decisions:
- issue: 神宣告应许时וָאֹמַר的时间意味
  choice: 我曾说过
  alternative: 我说过／我已经说了
  rationale: 形式上是过去时叙述，但上下文中所说的内容仍作为神当前重申的定意有效。“曾说过”保留这两层意味，而不改写为较强的解释性用语“我应许”。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“苦难”保留原词可涵盖困苦与压迫的宽度；族名采用简体中文圣经中通行的音译。正文中的两个“带到”使连续目的地结构在汉语中清楚自然，同时保留“领上来”的方向意象。
