  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: zh_hans
  text: 但我知道，埃及王不会让你们走，除非有大能的手迫使他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“埃及王不会让你们走，即使用强有力的手也不肯”；也可译：“非用大能的手，他不会让你们走。”希伯来原文此处语意有所省略，可能强调只有压倒性的力量才能使法老放行。
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: 但我
  rationale: 连词与独立代词合用，在此形成转折并突出说话者；“但我”自然传达这一语篇作用。
- source_word: יָדַעְתִּי
  choice: 知道
  rationale: 完成式在此表达上帝确定、既定的认识；现代汉语用现在时的“知道”最自然。
- source_word: כִּי
  choice: （不单独译出）
  rationale: 该词引出“知道”的内容；现代汉语在“我知道”后通常无需另加相当于“that”的词。
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: 不会让你们走
  rationale: נתן与不定式连用在这里表示准许；此译简洁自然，也符合出埃及的语境。
- source_word: מֶלֶךְ מִצְרַיִם
  choice: 埃及王
  rationale: 直接而自然地表达希伯来语的属格结构。
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: 除非有大能的手迫使他
  rationale: 原文是省略式短语。正文按上下文补明法老只有在强大力量迫使之下才会放行，同时保留“手”这一贯穿《出埃及记》的意象；歧义另见脚注。
theological_decisions:
- issue: 省略式短语 וְלֹא בְּיָד חֲזָקָה 的解释
  choice: 埃及王除非受到“大能的手”迫使，否则不会让以色列人走。
  alternative: 埃及王不会让他们走，即使用强有力的手也不肯；或：非用大能的手，他不会让他们走。
  rationale: 下一节说上帝要伸手以奇事击打埃及，支持“只有压倒性的力量才能使法老屈服”这一理解。但希伯来语句法高度省略，故不把另一种可能性从脚注中抹去。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“大能的手”保留希伯来原文的身体意象及《出埃及记》的关键词联系；“迫使他”补足汉语所需的隐含关系，并以脚注保留原文歧义。
