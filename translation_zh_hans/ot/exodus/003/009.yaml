  naturalness: “如今，看哪”及“已经传到我这里”庄重清楚，适合现代中文圣经语体。“我也看见了埃及人正在加在他们身上的压迫”自然地表达持续施加的压迫，同时避免把原文改写为间接问句。
  terminology: “以色列子孙”恰当地保留群体性的家族称谓；“呼喊声”“压迫”“埃及人”均准确且符合本段语境。无需引入特定教派性解释。
