- from: 现在，看哪，以色列子孙[a]的呼喊声已经达到我这里[b]；埃及人怎样压迫他们，我也看见了。
  to: 如今，看哪，以色列子孙[a]的呼喊声已经传到我这里[b]；我也看见了埃及人正在加在他们身上的压迫。
  rationale: 将“现在”调整为“如今”，以较自然地承接原文的连词和时间转折；将呼喊声改为“传到我这里”。最主要的修订是恢复后半句以“压迫”为“看见”的宾语，并以“正在加在他们身上”表达原文分词所示的持续施压，保留名词与动词的相关语义而使中文通顺。脚注 b 相应更新，使其替代译法不与正文重复。
