source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: zh_hans
  text: 如今，看哪，以色列子孙[a]的呼喊声已经传到我这里[b]；我也看见了埃及人正在加在他们身上的压迫。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的儿子们”；也可译作“以色列人”。
    reason: 说明家族性群体称谓的字面形式和自然译法。
  - marker: b
    text: 原文直译为“已经来到我这里”；也可译作“已经达到我这里”。
    reason: 保留希伯来文“来”的具体意象，并列出自然的中文表达。
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 在承接上文的同时引出当前的结论和行动；现代汉语以“现在”即可自然表达这一话语转折，连接意味由上下文承载。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意的指示和强调作用；“看哪”庄重且在现代中文圣经语体中清楚可懂。
- source_word: צַעֲקַת
  choice: 呼喊声
  rationale: 指受苦之人发出的喊声。“呼喊声”既保留声音意象，也不把它过度限定为正式祷告或一般公众抗议。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来文以家族血脉称呼群体的表达，同时比“以色列的儿子们”更符合现代汉语习惯。
- source_word: בָּאָה אֵלַי
  choice: 已经达到我这里
  rationale: 表达呼声来到并为上帝所听见的完成及当前相关性；正文采用自然汉语，脚注保留更贴近字面的说法。
- source_word: וְגַם רָאִיתִי
  choice: 我也看见了
  rationale: “也”保留附加和强调意味；“看见了”表明上帝已经察看此事，并与接下来的行动相关。
- source_word: הַלַּחַץ
  choice: 压迫
  rationale: 该词表示强力施加的逼迫或压制；“压迫”准确符合埃及辖制以色列人的社会处境。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: “埃及”在此与复数分词连用，按集合意义指实施压迫的埃及人；译作“埃及人”在汉语中明确自然。
- source_word: לֹחֲצִים
  choice: 压迫
  rationale: 分词描写正在持续的行为；以“怎样压迫他们”表达其持续状况，并保留与名词“压迫”的同根呼应。
- source_word: אֹתָם
  choice: 他们
  rationale: 直接指回以色列子孙。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的家族性、群体性称谓
  choice: 以色列子孙
  alternative: 以色列人
  rationale: “以色列子孙”保留原文的血缘和盟约群体意象，又不会在现代汉语中被误解为只包括男性；脚注说明其字面形式。
- issue: 上帝“看见”压迫的表述
  choice: 我也看见了
  alternative: 我也留意到了
  rationale: 保留原文直接的感知动词，不把“看见”提前解释为某种特定的神学行动；其介入和拯救由上下文说明。
- issue: 埃及作为压迫主体的集合用法
  choice: 埃及人
  alternative: 埃及
  rationale: 复数分词支持把专名理解为埃及人这一集合主体；此译法不额外限定为法老、官员或全体居民。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“看哪”保留原文提示注意的语气；分号呈现本节两个彼此相加的陈述。避免使用过度古雅的“哀声上达于我”等表达，也不把“呼喊声”限定解释为祷告。
