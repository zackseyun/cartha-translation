  text: וְ/נָתַתִּ֛י אֶת חֵ֥ן הָֽ/עָם הַ/זֶּ֖ה בְּ/עֵינֵ֣י מִצְרָ֑יִם וְ/הָיָה֙ כִּ֣י תֵֽלֵכ֔וּ/ן לֹ֥א תֵלְכ֖וּ רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: zh_hans
  text: 我必使这百姓在埃及人眼中蒙恩[a]；你们离去的时候，必不空手而去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我必使埃及人恩待这百姓。”原文直译为“我必使这百姓在埃及人眼中蒙恩”。
    reason: lexical_alternative
  - marker: b
    text: 原文也可直译为“不会空着离去”，意思是离开时不会一无所有。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 我要使……蒙恩
  rationale: נתן的基本义是“给、赐予”。它以חֵן为宾语并与“在……眼前”连用时，汉语用“使……蒙恩”既保留上帝主动施予的含义，也符合现代中文表达。
- source_word: חֵן
  choice: 恩
  rationale: חֵן在此指得到好感、善意或优待，不宜引入超出语境的专门神学含义；“蒙恩”能自然表达受到善待或青睐。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留עָם的集体单数和指示语气，所指为以色列民；“这百姓”比“这个民族”更贴合叙事语境。
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: 在埃及人眼前
  rationale: 较直接地保留希伯来语“在……眼中/眼前”的惯用表达；מִצְרָיִם在此按群体意义理解为“埃及人”。
- source_word: וְהָיָה כִּי
  choice: ……的时候
  rationale: 这是引出未来情形的常见结构；译作“……的时候”自然清楚，无须机械保留“事情将是”。
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: 离去／而去
  rationale: הלך基本义为“去、行走”，本段明确涉及离开埃及，译作“离去”准确而自然，同时没有额外说明目的地。
- source_word: רֵיקָם
  choice: 空手
  rationale: רֵיקָם可指“空着、毫无所有地”。在离境语境中，“空手而去”自然传达不会不带财物离开的惯用含义。
theological_decisions:
- issue: 上帝与埃及人好感之间的关系
  choice: “我要使这百姓在埃及人眼前蒙恩”
  alternative: “我要使埃及人恩待这百姓”
  rationale: 前者保留原文由上帝“给予恩 favor”以及“在……眼前”的表达结构，明确上帝的主动作为，却不进一步界定他如何影响埃及人的态度。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“蒙恩”承接圣经语体但在本句中仍可自然理解为得到好感和善待；“空手而去”用现代汉语惯用语清楚表达原文含义。
