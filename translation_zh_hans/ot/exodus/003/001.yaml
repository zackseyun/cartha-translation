source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: zh_hans
  text: 摩西正在牧放他岳父叶忒罗的羊群；叶忒罗是米甸的祭司。摩西把羊群赶到旷野的另一边[a]，来到上帝的山，就是何烈山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“旷野的后面。”
    reason: 希伯来语אַחַר在空间语境中既可表达“后面”，也可指“另一边”或“越过……以后”。
lexical_decisions:
- source_word: וּ/מֹשֶׁה
  choice: 摩西
  rationale: 句首连接词在此引入新的叙事场景；现代汉语无需机械译作“而”或添加并非原文明确表达的“那时”。
- source_word: הָיָה רֹעֶה
  choice: 正在牧放
  rationale: “正在”体现过去叙事背景中的持续动作，“牧放”准确表达照管并放牧羊群。
- source_word: צֹאן
  choice: 羊群
  rationale: 该词统指绵羊、山羊等小型家畜；“羊群”是现代汉语中自然、简洁的集合称呼。
- source_word: יִתְרוֹ חֹתְנוֹ
  choice: 他岳父叶忒罗
  rationale: 按中文亲属称谓明确叶忒罗是摩西妻子的父亲，并采用通行中文人名“叶忒罗”。
- source_word: כֹּהֵן מִדְיָן
  choice: 米甸的祭司
  rationale: 直接保留所属结构，说明叶忒罗在米甸的祭司身份，不额外解释其宗教体系。
- source_word: וַיִּנְהַג
  choice: 把羊群赶到
  rationale: נהג用于牲畜时可表示赶领、驱赶；“把羊群赶到”符合汉语牧放场景，也自然表达移动方向。
- source_word: אַחַר הַמִּדְבָּר
  choice: 旷野的另一边
  rationale: 空间用法可指旷野背后或越过旷野后的那一边；正文采用自然且不过度具体化的表达，并以脚注保留较直译的可能。
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 该动词在此表示抵达目的地；“来到”符合汉语叙事习惯。
- source_word: הַר הָאֱלֹהִים
  choice: 上帝的山
  rationale: 透明保留希伯来语属格结构，不预先说明这座山为何或何时被视为属于上帝。
- source_word: חֹרֵבָה
  choice: 就是何烈山
  rationale: 地名后的方向词尾表明向何烈而去；中文以同位说明自然地把“何烈”辨认为前述山名，同时“来到”已经表达趋向。
theological_decisions:
- issue: הַר הָאֱלֹהִים是否应译成已经被分别为圣的山
  choice: 上帝的山
  alternative: 圣山
  rationale: 直译保留原文张力，不断定该称号是回顾性的、预示性的，还是当时已经通行的称呼。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。将叶忒罗的身份拆成分号后的说明，以避免多重定语造成歧义；不添加原文没有的时间副词，也不解释何烈山称为“上帝的山”的时间或原因。
