  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: zh_hans
  text: 我下来，是要救他脱离埃及的手，把他从那地领上来，带到一片美好而宽广的土地[a]，到一片流奶与蜜之地，就是迦南人、赫人、亚摩利人、比利洗人、希未人和耶布斯人所在的地方。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宽广”也可译作“辽阔”。
    reason: lexical_alternative
  - marker: b
    text: 原文在“救他”和“把他……领上来”两处都用单数“他”，把以色列民看作一个整体。“埃及的手”指埃及的权势或控制。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: 我下来
  rationale: 保留原文“下来”的空间性和拟人化表达；在上帝直接讲话的语境中，中文“我下来”自然地表达已经采取的行动及当前目的。
- source_word: לְהַצִּילוֹ מִיַּד מִצְרַיִם
  choice: 要救他脱离埃及的手
  rationale: “救……脱离”准确传达Hifil词形的解救含义；保留“埃及的手”这一权势和控制的具体意象，并以脚注说明。
- source_word: וּלְהַעֲלֹתוֹ
  choice: 把他……领上来
  rationale: “领上来”保留עלה的使役和向上移动含义，也适合从埃及前往应许之地的地理叙述；“他”保留原文将以色列民视为一个整体的单数形式。
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: 到一片美好宽广的土地
  rationale: “美好宽广”直接对应两个形容词，表达土地优良且空间开阔，不额外缩窄其意义。
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: 一片流奶与蜜之地
  rationale: 采用现代中文中已通行且忠实于原文意象的表达，传达丰饶和富足。
- source_word: אֶל מְקוֹם הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: 就是迦南人、赫人、亚摩利人、比利洗人、希未人和耶布斯人所在的地方
  rationale: “所在的地方”自然呈现מקום及其后各民族的关系；中文民族名称本身不标单复数，可保留希伯来语集合性单数的开放性。
theological_decisions:
- issue: 上帝“下来”的拟人化空间语言
  choice: 直译为“我下来”
  alternative: 释义为“我要介入”或“我要采取行动”
  rationale: 原文有意用空间移动描写上帝的临在和行动；直译保留叙事的神学张力，不将其抽象化。
- issue: 以色列作为集合整体的单数代词
  choice: 两处均用“他”指以色列民
  alternative: 按实际人数改为“他们”
  rationale: 希伯来语两处后缀均为阳性单数，把以色列作为一个整体来指称；保留“他”可避免默默消解这一集合性形象，并用脚注帮助读者理解。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“我下来”“埃及的手”“领上来”等表达保留原文的空间和权势意象；“一片……土地／一片……之地”使连续结构在中文中流畅。所有脚注标记均置于正文中。
