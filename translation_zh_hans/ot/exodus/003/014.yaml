revisions:
- from: 神对摩西说：“我是我所是的[a]。”他又说：“你要这样对以色列人[b]说：‘“我是”差我到你们这里来。’”
  to: 神对摩西说：“我是我所是的那一位[a]。”他又说：“你要这样对以色列人[b]说：‘“我是”差遣我到你们这里来。’”
  rationale: 修订仅改善现代汉语的句法完整性和书面语自然度：“那一位”使重复的自我表明可读而不作神学扩展；“差遣”较准确自然。脚注继续明确保留אֶהְיֶה未完成式的现在／将来张力。
