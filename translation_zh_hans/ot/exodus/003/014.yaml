base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: zh_hans
  text: 神对摩西说：“我是我所是的那一位[a]。”他又说：“你要这样对以色列人[b]说：‘“我是”差遣我到你们这里来。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我将是我将是的那一位”或“我将是我所是的那一位。”这里的希伯来语动词为未完成式，可有现在或将来的意味。
    reason: alternative_reading
  - marker: b
    text: 希伯来语字面为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 本叙事中虽为形态上的复数形式，却指以色列的独一之神；“神”是现代汉语中自然、庄重的对应表达。
- source_word: אֶהְיֶה
  choice: 我是
  rationale: 这是动词 היה 的第一人称单数未完成式，可有现在或将来的意味。此处既用于自我表明，又在下半节作为称谓重复出现，因此正文采用具有名称感的“我是”，并在脚注保留将来意义。
- source_word: אֲשֶׁר
  choice: 所……的
  rationale: 在“我是我所是的”中，以“所”字结构自然表达关系词 אֲשֶׁר，同时不把其含义过度限定为单一的解释。
- source_word: כֹּה
  choice: 这样
  rationale: 该词引出要转述的话；“这样”在现代汉语中清楚自然，也保留宣告的语气。
- source_word: תֹאמַר
  choice: 你要……说
  rationale: 此处未完成式具有指令语气；“你要……说”准确表达对摩西的吩咐。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 对以色列人
  rationale: 该短语字面为“对以色列的众子”，在这里是对以色列群体的常规称呼；“以色列人”是现代汉语中准确而自然的表达，字面形式保留在脚注。
- source_word: שְׁלָחַנִי
  choice: 差我……来
  rationale: 完成式加第一人称宾语后缀表示差遣已经发生；汉语“差我到你们这里来”自然呈现这项带有当前效力的使命。
- source_word: וַיֹּאמֶר
  choice: 说／又说
  rationale: 连续式推动叙事。首次译“说”，第二次用“又说”自然标示同一位说话者继续发言。
theological_decisions:
- issue: 神自称 אֶהְיֶה אֲשֶׁר אֶהְיֶה 的译法
  choice: 我是我所是的
  alternative: 我将是我将是的那一位
  rationale: 希伯来语未完成式兼有现在与将来的可能。正文采用能体现庄严自我表明、并与下半节“我是”相呼应的现在时译法；脚注保留将来向度，避免消除原文的语义张力。
- issue: 是否把 אֶהְיֶה 解释性地译成传统神学称号
  choice: 保留为“我是”
  alternative: 自有永有者
  rationale: “自有永有者”虽为熟悉的传统表达，却加入了原文没有直接明说的形而上解释。译作“我是”更贴近动词形式，也保留经文本身的开放性。
- issue: 第二次出现的 אֶהְיֶה 是否作为称谓显示
  choice: 加引号写作“我是”
  alternative: 不加引号写作“我是”
  rationale: 引号帮助现代读者看出该短语在此被当作神的自我称谓来引用，而不把汉语句子误读为普通系词结构；这只是排版提示，并非声称希伯来文本有特殊字形。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我是我所是的”刻意保留原文的简洁、重复和含义张力；不采用“自有永有”等解释性较强的传统术语。
