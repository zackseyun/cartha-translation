revisions:
- from: 他们会听从你的话。你和以色列的长老要去见埃及王，对他说：‘雅威——希伯来人的上帝——遇见了我们。[a]现在求你准许我们走三天的路，进入旷野，好向雅威我们的上帝献祭。’
  to: 他们会听从你的话。你和以色列的长老要去见埃及王，对他说：‘雅威——希伯来人的上帝——遇见了我们。[a]现在求你准许我们进入旷野，走三天的路程，好向雅威——我们的上帝——献祭。’
  rationale: 修订仅消除汉语中旅程方向与时序的潜在歧义，并使“雅威，我们的上帝”的同位关系清晰可读。神名、神圣相遇用语、礼貌请求及脚注所保留的语义宽度均维持不变。
