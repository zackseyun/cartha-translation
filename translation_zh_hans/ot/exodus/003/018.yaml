source:
  edition: WLC
  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: zh_hans
  text: 他们会听从你的话。你和以色列的长老要去见埃及王，对他说：‘雅威——希伯来人的上帝——遇见了我们。[a]现在求你准许我们进入旷野，走三天的路程，好向雅威——我们的上帝——献祭。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “遇见了我们”也可译作“临到我们”。原文短语表示雅威与他们相遇或临到他们。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: 他们会听从你的话
  rationale: שׁמע 加 לְקוֹל 表示听取并作出响应。现代汉语“听从你的话”自然表达长老会接受摩西所传的信息，也避免生硬直译“听你的声音”。
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל אֶל מֶלֶךְ מִצְרַיִם
  choice: 你和以色列的长老要去见埃及王
  rationale: 希伯来文以单数动词接明示代词，再并列“以色列的长老”；汉语按完整的并列主语顺译。“去见”自然表达前往王面前的方向和会见含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译保留四字神名，区别于“主”这一称号。
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: 希伯来人的上帝
  rationale: 直接保留原文的族群称谓和所属结构，现代汉语清楚自然。
- source_word: נִקְרָה עָלֵינוּ
  choice: 遇见了我们
  rationale: קרא 的尼法勒式与 עַל 连用可指临到、相遇或显现性的遭遇；“遇见了我们”保留事件本身，不把它限定为“召唤”。
- source_word: נֵלֲכָה נָּא
  choice: 求你准许我们走
  rationale: 意愿式加 נָא 在对王说话的语境中构成礼貌请求；汉语补出“准许”可明确请求对象，而不误作说话者彼此劝勉。
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 走三天的路
  rationale: 这是表示旅程时间或距离的希伯来语习语；该译法贴近原文且符合现代汉语。
- source_word: בַּמִּדְבָּר
  choice: 进入旷野
  rationale: 介词形式本身可指“在旷野”，但受前面的移动动词支配，汉语用“进入”自然表达方向；“旷野”比“沙漠”更能涵盖原词语义。
- source_word: וְנִזְבְּחָה
  choice: 好……献祭
  rationale: 第二个意愿式在语境中说明前往旷野的目的；“好”自然呈现目的关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其专名性质，不以称号“主”替代；“耶和华”虽有传统基础，但较少反映学界通常重构的读音。
- issue: נִקְרָה עָלֵינוּ 所表达的神圣相遇
  choice: 遇见了我们
  alternative: 向我们显现了；临到我们；召唤了我们
  rationale: 该短语可表示神与人相遇或临到人，并未在词汇层面明确限定为显现或召唤。“遇见”保留原文的语义宽度和神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听从你的话”传达希伯来习语的响应意味；引语中使用“求你准许”体现对埃及王提出的礼貌请求。破折号标明“希伯来人的上帝”是对“雅威”的同位说明。
