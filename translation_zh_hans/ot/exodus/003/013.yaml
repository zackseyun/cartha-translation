base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: zh_hans
  text: 摩西对上帝说：“你看，我到以色列人那里去，对他们说：‘你们祖先的上帝差我到你们这里来。’他们会问我：‘他叫什么名字？’我该对他们说什么呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留引起注意并引出设想情形的语用功能；比“看哪”更符合现代普通话，又没有省略原文的提示语气。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处指以色列民族群体；现代汉语用“以色列人”自然清楚，避免“以色列的儿子们”可能造成的字面误解。
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: 你们祖先的上帝
  rationale: אבות在此指先祖；“祖先”比现代汉语中的“父亲们”准确自然，并保留群体历史传承的含义。
- source_word: מַה שְּׁמוֹ
  choice: 他叫什么名字
  rationale: 原文直义为“他的名字是什么”；在直接问话中采用自然普通话表达，不预先解释该问题是在询问身份、称号或本质。
- source_word: מָה אֹמַר אֲלֵהֶם
  choice: 我该怎么回答他们呢
  rationale: 结合前面的提问，אמר在此是向他们说出答复；“怎么回答”自然呈现摩西所求的回应内容。
theological_decisions:
- issue: 以色列人询问上帝名字的含义
  choice: 保留为直接问题“他叫什么名字？”
  alternative: 解释为“他是怎样的一位神？”或“他的身份是什么？”
  rationale: 原文可能涉及名字、身份与权柄等关联，但本节没有明说其全部内涵；译文不提前消解这种张力。
- issue: אֱלֹהִים的译名
  choice: 上帝
  alternative: 神
  rationale: “上帝”是现代汉语中清楚、庄重且广泛使用的对应词；此处有定冠词并指摩西正在对话的以色列之神，不译作泛指的“神明”。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事与对话体。用“你看”对应提示词 הִנֵּה，用“若问我”顺畅表达希伯来语连续叙述中设想的后续情形；引号层级清楚，不增加原文没有的解释。
