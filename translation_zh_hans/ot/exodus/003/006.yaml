  text: וַ/יֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔י/ךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֣י יַעֲקֹ֑ב וַ/יַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔י/ו כִּ֣י יָרֵ֔א מֵ/הַבִּ֖יט אֶל הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: zh_hans
  text: 他又说：“我是你父亲的上帝，是亚伯拉罕的上帝、以撒的上帝、雅各的上帝。”摩西就遮住了脸，因为他害怕看上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他又说
  rationale: 承接上一节同一位说话者的话；“又说”在现代汉语中自然地推进叙事，也保留连续发言的关系。
- source_word: אָנֹכִי
  choice: 我是
  rationale: 独立人称代词带有强调意味；汉语判断句用“我是”自然表达说话者的自我认定。
- source_word: אֱלֹהֵי אָבִיךָ
  choice: 你父亲的上帝
  rationale: 保留原文“父亲”的单数形式和所属结构，不泛化为“祖先”。
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: 亚伯拉罕的上帝、以撒的上帝、雅各的上帝
  rationale: 逐一保留原文重复的“上帝”，维持其修辞力度和立约身份的强调。
- source_word: וַיַּסְתֵּר מֹשֶׁה פָּנָיו
  choice: 摩西就蒙住脸
  rationale: 动词使役形在此表示把脸遮蔽起来；“蒙住脸”比“隐藏他的脸”更符合自然汉语中的具体动作。
- source_word: כִּי יָרֵא
  choice: 因为他害怕
  rationale: 清楚保留כִּי的原因关系，并用现代汉语表达יָרֵא所描述的惧怕状态。
- source_word: מֵהַבִּיט אֶל הָאֱלֹהִים
  choice: 看上帝
  rationale: 在“害怕”之后，带מִן的动词不定式自然表达为“害怕做某事”；הביט אל在此指注视、观看，简洁译为“看”。
theological_decisions:
- issue: 在神显现及自我认定的语境中如何翻译אֱלֹהִים
  choice: 上帝
  alternative: 神；神明
  rationale: 上下文明确指向向摩西说话、并自称为列祖之上帝的独一对象；“上帝”准确指明所指，同时不额外加入原文没有的教义说明。
- issue: 是否保留列祖称谓中重复的אֱלֹהֵי
  choice: 重复译作“亚伯拉罕的上帝、以撒的上帝、雅各的上帝”
  alternative: 亚伯拉罕、以撒、雅各的上帝
  rationale: 原文三次使用“……的上帝”，保留重复可呈现其庄重节奏，并突出与每一位族长的关系，不将其压缩为概括性短语。
- issue: אָבִיךָ的单数所指
  choice: 你父亲
  alternative: 你的祖先；你父辈的上帝
  rationale: 原文是单数“你的父亲”，译文不替文本判定其具体指向，也不改写成复数或集合称谓，从而保留可能的指称张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“蒙住脸”呈现可感的身体动作；列祖公式保留原文重复，避免过度润色。全节无需脚注。
