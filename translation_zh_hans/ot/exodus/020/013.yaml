theological_decisions:
- issue: 十诫中这条禁令的范围
  choice: 将רצח译为“谋杀”
  alternative: 不可杀人。
  rationale: 这是具有神学影响的词义判断。译作较宽泛的“杀人”可能被理解为禁止一切夺取人命的行为，超出该动词在此法律语境中的通常范围；“谋杀”则不额外扩大经文所禁止的范围。
translation_notes:
