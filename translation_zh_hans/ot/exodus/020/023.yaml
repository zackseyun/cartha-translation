source:
  edition: WLC
  text: לֹ֥א תַעֲשׂ֖וּ/ן אִתִּ֑/י אֱלֹ֤הֵי כֶ֨סֶף֙ וֵ/אלֹהֵ֣י זָהָ֔ב לֹ֥א תַעֲשׂ֖וּ לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: zh_hans
  text: 你们不可制造银制的神来与我并列；也不可为自己制造金制的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不可制造银制的神与我同在”或“不可制造银制的神在我旁边”。希伯来文直译为“不可制造银的神与我”；“来与我并列”是按本节语境所作的表达，强调不可设立与耶和华相并的神。
    reason: 词义有多种可能；脚注保留אִתִּי较字面的“与我”及不同中文表达。
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: 制造
  rationale: עשה在这里指制作供敬拜使用的神像；“制造”自然、直接，也保留禁令的力度。
- source_word: אִתִּי
  choice: 在我旁边
  rationale: 字面义为“与我同在／同我一起”；在此敬拜语境中，“在我旁边”表达与耶和华并列设置别神的关系，同时以脚注保留原文较宽的语义。
- source_word: אֱלֹהֵי כֶסֶף
  choice: 银神像
  rationale: 原文直译为“银的神”；中文用“银神像”可清楚表明这是以银制成、被当作神敬拜的形像，避免误解为抽象的神祇类别。
- source_word: וֵאלֹהֵי זָהָב
  choice: 也不可为自己制造金神像
  rationale: 重复“不可制造”以反映希伯来文平行禁令，并在中文中明确保留לָכֶם“为自己”的意义。
- source_word: לָכֶם
  choice: 为自己
  rationale: 表达第二人称复数的反身、受益关系，即制造出来归百姓自己使用或供奉。
- source_word: לֹא ... לֹא
  choice: 不可……也不可……
  rationale: 保留两个相互平行的否定命令，符合现代中文律例语体。
theological_decisions:
- issue: אִתִּי是否应解释为排他性较强的“在我旁边”
  choice: 正文译作“在我旁边”，并加脚注
  alternative: “与我一起”或“同我并列”
  rationale: 原词本义是“与我同在／同我一起”，语境则禁止把银制神像与耶和华并列敬拜。正文采用自然且切合语境的表达，脚注保留字面义和解释空间。
- issue: אֱלֹהֵי כֶסֶף与אֱלֹהֵי זָהָב所指为何
  choice: 译作“银神像”和“金神像”
  alternative: “银神”和“金神”
  rationale: 语境中的עשה强调人为制作；加入“像”能防止现代读者把短语误解为神的材质属性，同时不把对象弱化为普通装饰品。
translation_notes:
  register: 采用庄重、简洁的现代规范汉语。“不可……也不可……”体现盟约律例的命令语气；“你们”对应原文复数。
