  to: 你们不可制造银制的神来与我并列；也不可为自己制造金制的神。[a]
  rationale: 修订消除“在我旁边”可能被读作地点状语的歧义，校正脚注中“直译”的表述，并避免将“神”直接限定为“神像”。“来与我并列”是为使中文明确呈现此处介词短语与所造之神的关联；脚注同时保留原文较宽的表达空间。
