  text: You shall have no other gods before me[a].
translation:
  language: zh_hans
  text: 在我面前，你不可有别的神。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“除了我以外”或“在我的临在中”。希伯来语字面为“在我的脸面之前”。
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: 你不可有
  rationale: 这个结构直译近于“不可有属于你的”，在本节中表达禁止拥有或承认其他神；“你不可有”既符合现代汉语，也保留第二人称单数的直接命令语气。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 复数名词与“别的”连用，指其他或 rival 神祇；“别的神”简明自然，不额外限定为“外邦的神”。
- source_word: עַל־פָּנָי
  choice: 除了我以外
  rationale: 该短语字面与“在我面前”有关，在本盟约语境中可表达排他性；正文采用现代汉语中明确自然的“除了我以外”，同时以脚注保存空间性较强的译法。
theological_decisions:
- issue: עַל־פָּנָי 在第一条诫命中的含义
  choice: 除了我以外
  alternative: 在我面前／在我面前存在
  rationale: 希伯来语既可突出上帝面前、在其临在中的空间关系，也可在此语境中表达“除我之外”的排他要求。正文采用自然且符合诫命语旨的排他表达，脚注保留其字面意象与真实歧义。
translation_notes:
  register: 采用现代、庄重而易懂的诫命体。“不可有”保留直接禁令的力度；避免较古雅的“除我以外，你不可有……”倒装，同时用脚注呈现希伯来语的字面意象。
