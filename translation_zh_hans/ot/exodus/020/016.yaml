  text: You shall not bear false witness against your neighbor[a].
translation:
  language: zh_hans
  text: 不可作假见证指控你的邻舍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可针对你的邻舍作虚假证言。”
    reason: 词汇替代译法：“虚假证言”呈现עֵד שָׁקֶר可指虚假见证内容的含义；“针对”保留介词ב在司法语境中的不利指向。
lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: 以现代汉语庄重而简洁的禁止表达，对应希伯来语否定词在十诫中的禁令用法。
- source_word: תַעֲנֶה
  choice: 作……见证
  rationale: ענה本义可指回答或回应，在司法语境中指作证；与עֵד שָׁקֶר连用时，译作“作……见证”最自然。
- source_word: בְרֵעֲךָ
  choice: 陷害你的邻舍
  rationale: רֵעַ指邻舍或同伴；介词ב在此司法语境中表示证言所针对的人。“陷害”自然传达不利于对方的指向，但正文仍保留“邻舍”这一重要称谓。
- source_word: עֵד שָׁקֶר
  choice: 假见证
  rationale: 该名词短语可指虚假的见证人或虚假证言；汉语固定表达“作假见证”简洁地涵盖司法作证及其虚假性质。
theological_decisions:
- issue: 禁令的范围与司法背景
  choice: 正文采用“作假见证陷害”，突出原文直接的司法作证场景。
  alternative: 译作“不可说谎害人”，扩大为一般性禁止说谎。
  rationale: 原文使用“见证”一词，首先涉及针对邻舍的虚假证言；不应在翻译中将其直接泛化为一切谎言，也不应否认该原则可能有更广的伦理应用。
translation_notes:
  register: 采用现代、庄重且易懂的十诫措辞。“不可”保持法令语气；“作假见证”是现代汉语仍通行的司法与伦理表达。“邻舍”虽略具经文语体，但准确承载רֵעַ所指的邻近者、同伴或同胞，并与全书术语保持一致。
