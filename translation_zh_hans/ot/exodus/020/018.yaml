base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: zh_hans
  text: 全体百姓都看见雷声[a]、火光[b]、号角声和正在冒烟的山。他们看见这一切[c]，就颤抖，远远地站着。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雷声”原文直译为“声音”或“众声”；在本段语境中很可能指雷声。
    reason: lexical_alternative
  - marker: b
    text: “火光”原文直译为“火把”，这里可能指如闪电般的火焰闪光。
    reason: lexical_alternative
  - marker: c
    text: 原文说百姓“看见”这些现象，其中包括雷声和号角声，保留了整个场景令人震撼的感官交融。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: 都看见
  rationale: 希伯来语分词带有持续、现场性的意味；现代汉语在此用“都看见”自然呈现眼前景象，并保留其宾语包括声音这一反常而有力的感官交融。
- source_word: הַקּוֹלֹת
  choice: 雷声
  rationale: קוֹל 字面可指“声音”或“嗓音”，但复数形式在西奈山显现的语境中很可能指雷声。正文采用自然的语境义，并以脚注保留字面可能。
- source_word: הַלַּפִּידִם
  choice: 火光
  rationale: 该词字面为“火把”，在此描写如闪电般的火焰显现。“火光”既保留火的具体意象，也避免把它过度限定为普通闪电。
- source_word: קוֹל הַשֹּׁפָר
  choice: 号角声
  rationale: שׁוֹפָר 是角制吹奏乐器；“号角声”在现代汉语中简洁自然，也比泛称“喇叭声”更贴近古代场景。
- source_word: הָהָר עָשֵׁן
  choice: 山上冒烟
  rationale: 以动态表达再现原文谓语式的“山冒着烟”，符合现代汉语习惯并保持画面感。
- source_word: וַיַּרְא הָעָם
  choice: 他们看见这一切
  rationale: 这是列举各种现象后对百姓反应的承接。“这一切”明确回指上述整体景象，但不改变原文“看见”的感官用语。
- source_word: וַיָּנֻעוּ
  choice: 战战兢兢
  rationale: 该动词表示因惧怕而震动、摇颤；“战战兢兢”自然表达百姓在神显现面前发抖惧怕的反应。
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: 远远地站着
  rationale: 直接表达他们因惧怕而保持距离，符合原文的空间意义和现代汉语表达。
- source_word: וְכָל הָעָם
  choice: 全体百姓
  rationale: 指聚集的以色列民众整体；“全体百姓”简洁、庄重且自然。
theological_decisions:
- issue: 原文说百姓“看见”包括声音在内的现象
  choice: 保留“看见雷声”和“看见号角声”的混合感官表达
  alternative: 分别译作“听见雷声和号角声”，或统称“察觉这一切现象”
  rationale: 原文刻意以“看见”统摄可听与可见的现象，形成震撼性的感官交融。译文不将这种张力悄然抹平，并以脚注帮助读者理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“全体百姓”“号角声”“远远地站着”保持经文语体但不过分古雅；刻意保留“看见雷声／号角声”的陌生感，以忠实呈现希伯来文的修辞张力。
