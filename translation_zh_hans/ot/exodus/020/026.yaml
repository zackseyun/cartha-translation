base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: zh_hans
  text: 你不可由台阶登上我的坛，免得你的赤身在坛上显露。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“免得你的赤身在坛上被揭露。”
    reason: “显露”对应希伯来语被动式“被揭开／显露”；此译法保留其被动语感。
lexical_decisions:
- source_word: תַעֲלֶה
  choice: 登上
  rationale: עלה在此表示向上而行；“登上”自然地保留方向意义，并与“坛”搭配顺畅。
- source_word: בְמַעֲלֹת
  choice: 踩着台阶
  rationale: מַעֲלוֹת指台阶或阶梯；介词בְּ在这里表达登坛所采用的方式。“踩着台阶”比直译为“用台阶”更符合现代汉语。
- source_word: מִזְבְּחִי
  choice: 我的坛
  rationale: מִזְבֵּחַ带第一人称单数词尾，直译为“我的坛”；“坛”是现代中文圣经语境中清楚、庄重的常用词。
- source_word: אֲשֶׁר לֹא
  choice: 免得
  rationale: 此处引出前述禁令所要避免的结果；“免得”简洁自然，并保留目的与可能结果之间的语义张力。
- source_word: תִּגָּלֶה
  choice: 露出来
  rationale: גלה的尼法勒式表达被揭开、显露；“露出来”在身体裸露的语境中自然直接，又不增加原文没有的解释。
- source_word: עֶרְוָתְךָ
  choice: 你的下体
  rationale: עֶרְוָה可指裸体、裸露之处，常具体涉及私处；“下体”在本句中清楚而庄重，也符合禁止因登阶而走光的具体语境。
- source_word: עָלָיו
  choice: 在坛上
  rationale: 阳性单数代词回指“坛”；重复“坛”可避免中文“在它上面”可能造成的含混。
theological_decisions:
- issue: 禁止用台阶登坛的理由
  choice: 按明文呈现为避免下体在坛上裸露
  alternative: 将此禁令解释为象征人在上帝面前的谦卑，或专指祭司服装所造成的裸露风险
  rationale: 希伯来文本明确给出的理由是避免עֶרְוָה显露；译文不加入象征意义，也不限定为原文未明说的特定服装或人员。
translation_notes:
  register: 采用现代、庄重而易懂的措辞。“踩着台阶登上”符合自然汉语；“下体”直接但不粗俗。保留禁令及其明示理由，不增添礼仪象征方面的解释。
