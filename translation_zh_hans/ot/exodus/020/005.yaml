  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: zh_hans
  text: 不可向它们跪拜[a]，也不可侍奉它们[b]，因为我——耶和华你的上帝——是忌邪的上帝；我必在儿女身上追讨父亲的罪，直到恨我的人的第三、第四代[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可向它们俯伏下拜”。原文动词指怀着敬意俯身或伏地。
    reason: lexical_alternative
  - marker: b
    text: 或译：“不可敬拜它们”。这里的“侍奉”可指献给偶像的宗教性服事。
    reason: lexical_alternative
  - marker: c
    text: 原文直译：“在儿女身上追讨父亲的罪。”这里保留了希伯来语的审判表达；另参申命记24:16和以西结书18章关于个人责任的教导。
    reason: cross_reference
  - marker: d
    text: 或译：“……直到第三、第四代，即恨我的人的后代。”
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: 跪拜
  rationale: 该词指在受敬奉者面前俯伏、下拜；“跪拜”既保留具体动作，也符合偶像崇拜的语境，并与下句“侍奉”保持词义区别。
- source_word: תָעָבְדֵם
  choice: 侍奉它们
  rationale: עבד的基本义是“服事、侍奉”；在偶像语境中包含宗教性供奉，但不直接与前一动词合并为笼统的“敬拜”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”表达四字神名，而不以称号“主”替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 准确表达第二人称单数所属关系，并保留盟约中的直接称呼。
- source_word: אֵל קַנָּא
  choice: 忌邪的上帝
  rationale: “忌邪”在中文宗教语境中表达上帝要求专一忠诚、绝不容忍竞争性敬拜的含义，同时保留神圣嫉妒所具有的张力。
- source_word: פֹּקֵד
  choice: 追讨
  rationale: 该分词在审判语境中表示上帝察究并施行司法回应；“追讨”自然、庄重，同时不把具体施行方式解释得过细。
- source_word: עֲוֺן
  choice: 罪
  rationale: עָוֹן可涵盖罪孽、罪责及其后果；中文“罪”简明自然，而脚注说明原文结构，以避免把含义缩窄为单一机制。
- source_word: אָבֹת
  choice: 父亲
  rationale: 原文为阳性复数“父辈”；在“父亲的罪”这一代际公式中保留明确的父系表述，不中性化为“父母”。
- source_word: בָּנִים
  choice: 儿女
  rationale: בנים在代际语境中可泛指子女或后代；“儿女”自然地包含男女后代。
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: 直到三四代
  rationale: 原文以序数概念省略“代”；中文补出“代”，并用“直到”清楚表达延及第三、第四代的范围。
- source_word: לְשֹׂנְאָי
  choice: 恨我的人
  rationale: 保留该短语对警告对象的限定及其关系性力度；前置于分句，在中文中可自然地统摄后面的代际审判陈述。
theological_decisions:
- issue: 如何表达上帝的嫉妒
  choice: 忌邪的上帝
  alternative: 嫉妒的上帝；热忱的上帝
  rationale: 上下文关乎盟约的专一性和禁止偶像崇拜。“忌邪”既表达上帝对竞争性敬拜的拒绝，也避免将此词淡化为一般热心。
- issue: 如何表达跨代审判
  choice: 我追讨父亲的罪，使其临到儿女，直到三四代
  alternative: 因父亲的罪惩罚儿女，直到第三、第四代
  rationale: 保留“追讨……罪临到儿女”的希伯来表达及其神学张力，不擅自断定每一后代都只因祖先行为而受罚；相关经文可与申命记24:16及以西结书18章一同理解。
- issue: “恨我的人”的修饰范围
  choice: 前置为“恨我的人”，使之限定整个追讨至三四代的警告
  alternative: 置于句末：“直到恨我的人的三四代”
  rationale: 希伯来语句末短语可与代际范围紧密相连；中文前置更自然，并保留警告所指向的是持续拒绝上帝的人这一理解，同时脚注呈现更贴近原词序的译法。
translation_notes:
  register: 采用庄重而现代的标准普通话。“跪拜／侍奉”保留两个希伯来动词的区别；“忌邪”沿用中文读者可理解的盟约用语；主句保持原文的警告力度，并以脚注交代直译、词义选择和修饰范围。所有脚注标记均已在正文中出现。
