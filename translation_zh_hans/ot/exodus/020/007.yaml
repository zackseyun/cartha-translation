base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: zh_hans
  text: 不可妄用雅威你上帝的名[a]，因为妄用他名的人，雅威必不以他为无罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译法是“不可妄称雅威你上帝的名”。希伯来文直译近于“不可承载雅威你上帝的名归于虚妄”；含义较广，可包括假誓、空洞地援引上帝之名，或冒用他的名作错误代表。
    reason: 说明传统译法及原文“承载／虚妄”的宽广语义，避免读者把诫命仅理解为随口说出神名。
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא（נשא）
  choice: 妄用
  rationale: 该动词本义为“举起、携带、承载”，与“名”连用时，直译“承载……的名归于虚妄”在现代汉语中生硬。“妄用”自然地表达以虚假、空洞或不当方式使用、援引或代表此名；两处均采用同一译法，以保留原文重复。
- source_word: שֵׁם
  choice: 名
  rationale: 保留原文核心意象；这里不仅指名称的发音，也涉及雅威所启示的身份、声誉及其圣约归属。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译上帝启示的专名，而不以“主”这一称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你上帝
  rationale: 保留第二人称单数的直接称呼和圣约关系；现代汉语中简洁自然。
- source_word: לַשָּׁוְא
  choice: 妄
  rationale: שָׁוְא可表示虚空、虚假、徒然或无价值。“妄”兼有虚假、轻率和不当之意，较能在简洁的诫命措辞中保留其语义范围；脚注说明其宽广含义。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出这条禁令的理由，符合现代汉语表达。
- source_word: יְנַקֶּה（נקה）
  choice: 必不以他为无罪
  rationale: 保留原文司法性的“清白、免罪”措辞，也表达雅威不会让这样的人免于罪责；比单译“不惩罚”更贴近动词本身。
- source_word: אֲשֶׁר
  choice: ……的人
  rationale: 自然表达泛指任何符合这一描述的人。
- source_word: שְׁמוֹ
  choice: 他的名
  rationale: 明确保留第三人称后缀，回指雅威的名。
theological_decisions:
- issue: 禁令对于上帝之名的适用范围
  choice: 广义地禁止以虚假、空洞、轻率或不当的方式使用、援引或代表雅威的名
  alternative: 仅指假誓；或仅指亵渎性、粗俗性言语
  rationale: נשא与“名”及שָׁוְא的组合比单纯的发音行为更宽，可涵盖假誓、空洞祈求及冒用上帝之名作错误代表。正文用“妄用”，脚注保留这一广度，而不把意义限于某一种行为。
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 采用对四字神名的常见学术音译，保留其作为上帝专名的性质，不以称号替代。
- issue: נקה所表达的审判警告
  choice: 必不以他为无罪
  alternative: 必不让他免受惩罚
  rationale: 原文首先使用司法性的“宣告无罪、免除罪责”概念；所选译法保留这一神学张力，不把罪责与惩罚完全等同。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“不可……，因为……”保留诫命及其理由的结构；“妄用”避免生硬直译，同时以脚注呈现原文具体意象和真实语义范围。
