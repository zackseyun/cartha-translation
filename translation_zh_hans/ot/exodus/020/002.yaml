  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of slaves.
translation:
  language: zh_hans
  text: “我是雅威[a]——你的上帝，曾把你从埃及地、从奴隶之家[b]带出来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文神名 YHWH；传统上也译作“耶和华”或以“上主”代称。
    reason: alternative_reading
  - marker: b
    text: “奴隶之家”直译希伯来文；也可意译为“受奴役之地”或“为奴之家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: 我是
  rationale: 独立的一人称代词带有强调意味；希伯来语无系词的名词句在现代汉语中自然译作“我是”，保留庄严的自我宣告。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名 YHWH 音译为“雅威”，保留经文中的专名，而不以称号代替；脚注说明传统译法。
- source_word: אֱלֹהֶיךָ
  choice: 你的上帝
  rationale: 虽然 אֱלֹהִים 词形为复数形式，此处所指为单数，并带第二人称阳性单数后缀；“你的上帝”准确而自然。
- source_word: אֲשֶׁר
  choice: 曾……的
  rationale: 以汉语定语结构表达关系从句，使“曾把你……带出来”修饰“你的上帝”，不增添原文没有的因果或解释关系。
- source_word: הוֹצֵאתִיךָ
  choice: 曾把你……带出来
  rationale: יצא 的使役形表示“使出来、带出来”；“把你……带出来”清楚保留出埃及的行动，且符合现代汉语表达。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留介词所表达的来源以及“埃及之地”的正式地理称谓，同时避免不必要的扩写。
- source_word: מִבֵּית עֲבָדִים
  choice: 从奴隶之家
  rationale: 较直接地保留“家／房屋”与复数“奴隶”的具体意象；脚注列出更符合汉语习惯、着重受奴役状态的意译。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文音译为“雅威”，既保留其专名性质，也避免把名字无提示地改成称号；传统译法放入脚注。
- issue: עֲבָדִים 在埃及奴役语境中的含义
  choice: 奴隶
  alternative: 仆人
  rationale: 上下文指以色列人在埃及遭受强制劳役和人身束缚，“奴隶”比“仆人”更准确地呈现其受辖制的身份。
- issue: “奴隶之家”的具体意象与状态含义
  choice: 正文保留“奴隶之家”
  alternative: 受奴役之地；为奴之家
  rationale: 原文使用“家／房屋”与复数“奴隶”构成的具体短语。正文保留这一意象，同时用脚注提示其惯用含义，不把两种表达之间的张力静默抹平。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“——你的上帝”清楚表达同位关系，“曾把你……带出来”承接关系从句。正文保留“从……、从……”的平行结构和“奴隶之家”的具体意象；“你”为原文第二人称阳性单数，在这里以现代汉语通用单数形式呈现。
