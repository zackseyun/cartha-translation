id: EXO.20.10
reference: Exodus 20:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽ֣א תַעֲשֶׂ֨ה כָל מְלָאכָ֜ה אַתָּ֣ה וּ/בִנְ/ךָֽ֣ וּ/בִתֶּ֗/ךָ עַבְדְּ/ךָ֤ וַ/אֲמָֽתְ/ךָ֙ וּ/בְהֶמְתֶּ֔/ךָ וְ/גֵרְ/ךָ֖ אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male slave, or your female slave, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: zh_hans
  text: 但第七日是归雅威——你神——的安息日[a]；你、你的儿子、你的女儿、你的男奴、你的女奴[b]、你的牲畜，以及在你城门内寄居的人[c]，都不可做任何工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “但第七日是”也可译作“而第七日是”。希伯来语连接词 ו 可作一般连接，也可结合上文表达转折；这里的译文突出了它与前六日劳作的对比。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文为“你的男奴、你的女奴”。传统译法有“仆人、婢女”或“男仆、女仆”。
    reason: lexical_alternative
  - marker: c
    text: “寄居的人”也可译作“定居的外族人”，指住在以色列人当中的非本地居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: 但第七日却是
  rationale: ו 可作一般连接词，也可在上下文中表达转折。前一节说六日劳作，本节与之对照，因此用“但……却……”自然呈现转折，同时在脚注保留另一种可能。
- source_word: שַׁבָּת
  choice: 安息日
  rationale: 保留这一专门名词，而不只意译为“休息的一天”。
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: 归雅威你神的
  rationale: ל 表示关系、归属或奉献；“归……的”表明这日分别归于雅威。יהוה按其专名译作“雅威”。
- source_word: לֹא תַעֲשֶׂה כָל־מְלָאכָה
  choice: 你不可做任何工
  rationale: לֹא 加未完成式在律法语境中具有明确禁令语气；“任何工”保留 כָל 的全面范围，并以现代汉语自然表达 מְלָאכָה。
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: 你的男奴、你的女奴
  rationale: 这两个成对的家庭身份词在此指受奴役的男性和女性；“男奴、女奴”比“仆人、婢女”更透明地呈现其社会身份。
- source_word: וּבְהֶמְתֶּךָ
  choice: 你的牲畜
  rationale: בְּהֵמָה 在此集合性地指家庭拥有的驯养动物；“牲畜”准确而自然。
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: 在你城门内寄居的人
  rationale: גֵּר 指住在以色列群体中的非本地居民；“寄居的人”保留其法律和社会处境。“城门内”直译其居住在所属城镇或辖域内的表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”旨在把它作为专名呈现，而不以称号代替，也不采用源自较晚读音传统的“耶和华”。
- issue: 安息日禁令的适用范围
  choice: 明确逐项包括本人、儿女、男女奴、牲畜和寄居者
  alternative: 概括为全家或所有家属
  rationale: 原文刻意列出各类成员与依附者；逐项保留可显明禁令并非只针对户主，也避免淡化其中的社会身份。
- issue: שַׁבָּת לַיהוָה 所表达的关系
  choice: 归雅威你神的安息日
  alternative: 向雅威你神守的安息日；雅威你神的安息日
  rationale: 介词 ל 可表达归属、指向或奉献。“归……的”保留这日属于并分别献给雅威的含义，而不进一步规定具体礼仪方式。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“不可”保持诫命语气；破折号引出受禁令约束的逐项名单，并在句末补出“都不可做工”，使较长列举在汉语中清楚完整。保留“城门内”这一古代法律与城镇表达，同时用脚注解释“寄居的人”的身份。
