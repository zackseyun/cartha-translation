  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你要这样对以色列人[a]说：你们亲自看见了：我从天上与你们说话[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，这里指以色列人这个群体。
    reason: lexical_alternative
  - marker: b
    text: “与你们说话”也可译作“对你们说话”；原文所用的介词通常有“与、同”的意思，强调他们直接经历了这次发言。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未将连接叙事的 וַ 单独译作“然后”，因为现代汉语在此直接用“说”衔接上下文更自然，事件次序仍然清楚。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名“耶和华”，明确呈现四字神名，而不以“主”替代。
- source_word: כֹּה תֹאמַר
  choice: 你要这样告诉
  rationale: 准确传达使者公式及未完成体在此处的命令意味；“告诉”自然表达摩西向百姓转述信息。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在这里惯常作为整个以色列群体的称谓；“以色列人”准确、自然且不误导为仅指男性。
- source_word: אַתֶּם רְאִיתֶם
  choice: 你们亲自看见了
  rationale: 独立人称代词 אַתֶּם 带有强调作用，“亲自”在现代汉语中自然体现这一强调。
- source_word: כִּי
  choice: 省译为引出所见内容的停顿
  rationale: כִּי 在此引出“看见”的内容；汉语以冒号直接引出命题，比机械译作“就是”更自然。
- source_word: מִן הַשָּׁמַיִם
  choice: 从天上
  rationale: שָׁמַיִם 形态上为复数或双数形式，但“从天上”是自然现代汉语，并准确表达神发声的来源。
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: 我……与你们说话
  rationale: 保留 עִם“与、同”的相互临在色彩，强调百姓直接经历神向他们发言；不将其扩展为真正的双向交谈。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神名。中文稿以广为人知的专名“耶和华”呈现，不用称号替代；“雅威”更接近部分现代学者的拟音，但尚不能确定古代元音，且中文接受度较低。
- issue: בְּנֵי יִשְׂרָאֵל 的群体范围
  choice: 以色列人
  alternative: 以色列的众子；以色列子民
  rationale: 该希伯来习语指整个立约群体，不宜让现代读者误以为信息只给成年男性；脚注保留其字面形式。
- issue: דִּבַּרְתִּי עִמָּכֶם 中 עִם 的关系意味
  choice: 与你们说话
  alternative: 对你们说话
  rationale: “与”更贴近原文介词，也保留西奈事件中直接相遇的张力；正文并未暗示百姓与神进行了对等的双向谈话。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你要这样告诉”保留神谕转述公式，“你们亲自看见了”体现希伯来文人称代词的强调。主句次序基本贴近原文，同时避免生硬的逐词对应。
