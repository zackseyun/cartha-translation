base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: zh_hans
  text: 你要为我筑一座土坛，在坛上献上你的燔祭、平安祭，以及你的羊群和牛群。在每一处我使人记念我名之地[a]，我必到你那里，赐福给你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我宣告我名的地方”、“我使人提说我名的地方”，或“我使人求告我名的地方”。希伯来语动词是使役形式，确切含义可能包括使人记念、提说、宣告或求告上帝的名。
    reason: 词义存在真实的多种可能；正文保留使役意义，脚注列出主要译法。
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: 土坛
  rationale: 这个组合词指用土筑成的祭坛；“土坛”简洁自然，也保留了原文具体的材料意象。
- source_word: תַּעֲשֶׂה לִּי
  choice: 你要为我筑
  rationale: 未完成式在律法指令中具有命令语气；祭坛在汉语中通常说“筑”，并保留“为我”的奉献关系。
- source_word: וְזָבַחְתָּ עָלָיו
  choice: 在坛上献
  rationale: זבח在献祭语境中译为“献”比字面的“宰杀”更自然；明确“坛上”使指代清楚。
- source_word: עֹלֹתֶיךָ
  choice: 你的燔祭
  rationale: “燔祭”是指祭物全然焚烧的标准祭祀术语。
- source_word: שְׁלָמֶיךָ
  choice: 你的平安祭
  rationale: “平安祭”保留该词与完整、安好相关的广泛含义，避免只限定为团契层面。
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: 你的羊群和牛群
  rationale: צאן泛指羊类小牲畜，בקר指牛类大牲畜；“羊群和牛群”比只说个别动物更能体现集合类别。
- source_word: בְּכָל הַמָּקוֹם
  choice: 在每一处……的地方
  rationale: 保留原文的逐处分配意味，同时符合现代汉语表达。
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: 我使人记念我名
  rationale: זכר的使役式表达上帝使其名被记念或提说；此译法保留使役意义及上帝的主动性，不把具体方式限定为宣告、记录或求告。
- source_word: אָבֹא אֵלֶיךָ
  choice: 我必到你那里
  rationale: 忠实表达上帝临到对方的动作；“必”适合承诺语境。
- source_word: וּבֵרַכְתִּיךָ
  choice: 赐福给你
  rationale: 明确表达第一人称施行赐福及第二人称受词，语言庄重自然。
theological_decisions:
- issue: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי 中上帝行动的含义
  choice: 我使人记念我名
  alternative: 我宣告我的名／我使人提说我的名／我使人求告我的名
  rationale: 采用使役表达，保留希伯来语Hiphil词形所显示的神圣主动性，也不替文本决定上帝使其名被记念、提说或求告的具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“筑土坛”“燔祭”“平安祭”保留礼仪语境所需的准确性；关键歧义以脚注呈现，不在正文中作过度解释。
