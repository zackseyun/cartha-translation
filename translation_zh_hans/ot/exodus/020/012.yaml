  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כַּבֵּ֥ד אֶת אָבִ֖י/ךָ וְ/אֶת אִמֶּ֑/ךָ לְמַ֨עַן֙ יַאֲרִכ֣וּ/ן יָמֶ֔י/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: zh_hans
  text: 要孝敬你的父亲和母亲，使你在耶和华你神赐给你的土地上[a]日子长久[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在……土地上”也可译作“在那地”。希伯来语介词的字面意思是“在……上”，汉语按语境也可表达为“在……地”。
    reason: lexical_alternative
  - marker: b
    text: “日子长久”是希伯来语惯用语，意思是寿命长久。
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: 孝敬
  rationale: 该词为 כבד 的加强词干命令式，要求人以父母为有分量、配受尊荣者。“孝敬”在现代汉语中自然表达对子女尊重、敬重并尽本分的要求，比单说“尊重”更能保留伦理力度。
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: 你的父亲和母亲
  rationale: 直接对应两个单数亲属名词及第二人称阳性单数后缀，也保留诫命中父母并列的表达。
- source_word: לְמַעַן
  choice: 使
  rationale: 该连词可引出目的或结果；“使”在此简洁自然，并保留遵行诫命与随后应许之间的联系。
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: 日子长久
  rationale: 尽量保留希伯来语“你的日子长久”的惯用表达及其经文色彩；上下文中指寿命长久，而不将原文直接改写成解释性的“长寿”。
- source_word: עַל הָאֲדָמָה
  choice: 在……土地上
  rationale: עַל 的基本空间义为“在……上”，אֲדָמָה 在本句指神赐予以色列的土地，而非仅指泥土；译文既反映原词，又符合现代汉语习惯。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，保留其作为以色列之神的立约名字，而不以普通称号替代。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 直接对应带第二人称阳性单数后缀的形式，保留对诫命受众的单数直接称呼。
- source_word: נֹתֵן לָךְ
  choice: 赐给你的
  rationale: 希伯来语分词可表达正在进行、持续或语境中将实现的行动。汉语定语“赐给你的”不强行限定为已经完成、正在发生或即将发生，因而较好保留时态层面的开放性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用专有的四字神名而非“主”这一称号。正文保留神名，并采用现代中文圣经传统中最广为人知的形式“耶和华”；“雅威”是较贴近学术重构读音的另一可行音译。
- issue: הָאֲדָמָה 所指的范围
  choice: 土地
  alternative: 地土／大地
  rationale: “耶和华你神赐给你”的限定语表明，这里主要指赐给以色列的土地；译作“土地”保留历史与立约语境，同时不擅自扩写为“应许之地”。
- issue: 长久年日之应许的表达
  choice: 保留“日子长久”的希伯来语惯用语
  alternative: 直译其含义为“长寿”
  rationale: 正文保留原文意象，不进一步界定该应许在每个个体身上的实现方式；脚注只说明这一惯用语通常指长寿，避免替正文消解其神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“要孝敬”明确呈现命令语气；“日子长久”保留原文意象，并以脚注帮助普通读者理解。“你”按希伯来语原文为阳性单数，在诫命中作为对群体中每个人的直接称呼。
