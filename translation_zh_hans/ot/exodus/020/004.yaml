  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: zh_hans
  text: 不可为自己制作雕刻的像[a]，也不可制作天上、地上或地底下水中任何事物的形像[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雕刻偶像”或“雕刻的神像”。希伯来语特指雕刻制成的像；译为“偶像”较偏重其宗教用途。
    reason: lexical_alternative
  - marker: b
    text: “形像”也可译作“样式”“形状”或“表象”。
    reason: lexical_alternative
  - marker: c
    text: 本节按古代的空间表达列举受造领域：上面的天、下面的地，以及地底下的水。
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: 不可为自己……制作
  rationale: לֹא加未完成式在十诫语境中表达直接而有法律力度的禁令；לְךָ保留为“为自己”。为使中文自然，将“制作”与后面的两个宾语统摄理解。
- source_word: פֶסֶל
  choice: 雕刻偶像
  rationale: פֶסֶל指经雕刻制成的形像。中文“偶像”容易突出敬拜用途，却比单说“雕像”更符合此处宗教语境；用“雕刻”保留其制作方式，并以脚注说明其字面范围，避免把解释完全写死。
- source_word: וְכָל־תְּמוּנָה
  choice: 任何事物的形像
  rationale: תְּמוּנָה可指形状、样式或表象；“形像”保留较宽的语义范围，不径直解释为所有艺术作品或只限敬拜用神像。
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: 天上……任何事物
  rationale: 用“天上”自然表达复数形式שָׁמַיִם及מִמַּעַל的上方空间意象；关系从句按现代汉语调整为领属结构。
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: 地上……任何事物
  rationale: בָּאָרֶץ在此按汉语习惯译为“地上”；מִתָּחַת与前面的“上”形成空间对照，其含义已由结构体现。
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: 地底下水中任何事物
  rationale: 保留“地底下的水”这一古代空间图景，不将其现代化或改释为海洋。
- source_word: וְ
  choice: 也……和
  rationale: 希伯来语反复使用连接词；中文以“也不可”连接两个受禁类别，并在诸领域之间使用并列词，使列举自然清楚。
theological_decisions:
- issue: 诫命禁止范围
  choice: 正文禁止制作雕刻偶像及受造领域中任何事物的形像，但不添加“用来敬拜”，也不明说这是对一切视觉艺术的绝对禁令。
  alternative: 可译成完全禁止任何视觉表现，或明确限于为敬拜而制作的偶像。
  rationale: 本节本身列出雕刻之像和各受造领域的形像；跪拜、事奉的语境在下一节展开。译文不应提前缩小或扩大禁令范围，应保留经文本身的张力。
- issue: פֶסֶל是否直接译为“偶像”
  choice: 采用“雕刻偶像”，并用脚注提示也可理解为“雕刻的像”。
  alternative: 只译“雕像”或“雕刻的像”，完全避免“偶像”一词。
  rationale: “偶像”在现代汉语圣经语境中自然表达宗教性形像，但其解释性强于希伯来词本身；添加“雕刻”并设置词义脚注，以兼顾上下文和词汇精度。
translation_notes:
  register: 采用现代、庄重而易懂的诫命体。“不可”保留法律性和简洁力度；调整希伯来语关系从句次序，使中文自然。脚注标记均置于正文对应词语之后。
