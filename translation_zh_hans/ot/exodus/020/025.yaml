base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: zh_hans
  text: 你若为我筑一座石坛，就不可用凿琢过的石头建造；因为你若在坛上动用你的剑[a]，就亵渎了这坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的剑”原文如此；在这里可能指用于加工石头的金属器具。
    reason: 说明原词通常指兵器，但本节语境可能涉及加工石料的工具，同时不在正文中消除这一含混性。
lexical_decisions:
- source_word: וְאִם
  choice: 你若
  rationale: 既表达条件关系，也以自然的汉语承接上文；不机械译出句首连接词。
- source_word: מִזְבַּח אֲבָנִים
  choice: 一座石坛
  rationale: 准确表达“用石头筑成的祭坛”，且比“一座石头的坛”更符合现代汉语。
- source_word: תַּעֲשֶׂה לִּי
  choice: 为我筑
  rationale: 保留介词所表达的对象关系；祭坛与“筑”搭配自然。
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: 不可用凿琢过的石头建造
  rationale: גָּזִית指经过切凿、修整的石料；此译也自然处理了希伯来语指向“石头”的阴性复数代词。
- source_word: חַרְבְּךָ הֵנַפְתָּ עָלֶיהָ
  choice: 你若在石头上动用刀剑
  rationale: 保留חֶרֶב通常所指的“刀剑”，同时用“动用”表达器具作用于石头的语境；“若”清楚呈现此处理由从句的条件含义。
- source_word: וַתְּחַלְלֶהָ
  choice: 就会亵渎这坛
  rationale: חלל在此涉及圣俗界限，“亵渎”比单纯的“弄脏”更能保留礼仪与圣洁层面的含义；明确说“这坛”可避免汉语代词指代不清。
theological_decisions:
- issue: 祭坛为何因加工石头而被亵渎
  choice: 只陈明刀剑作用于石头会使祭坛被亵渎
  alternative: 解释为排斥暴力象征，或强调祭坛必须朴素、不事装饰
  rationale: 经文本身使用具有圣俗含义的חלל，却没有进一步说明禁令背后的象征或神学缘由，因此译文保留其张力，不补入特定解释。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“筑坛”“亵渎”保留经文的礼仪语域；句式简洁，避免古奥表达。
