base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: zh_hans
  text: 百姓远远地站着；摩西却走近上帝所在的浓重黑暗[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“暗云”或“幽暗”。希伯来语这个词可指与上帝显现相伴的浓重黑暗。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 站着
  rationale: 此处叙述百姓所处的位置和持续状态；“站着”简洁自然，也与下文摩西走近形成对照。
- source_word: הָעָם
  choice: 百姓
  rationale: 定冠词所指的是上文西奈山前已经出现的以色列会众；“百姓”足以明确，无须补入原文没有的“以色列”。
- source_word: מֵרָחֹק
  choice: 远远地
  rationale: 表达空间上的距离，符合现代汉语习惯，并保留百姓与上帝显现之处相隔的意味。
- source_word: נִגַּשׁ
  choice: 走近
  rationale: נגשׁ意为靠近、走近；“走近”自然清楚，并与百姓远远站着构成鲜明对照。
- source_word: הָעֲרָפֶל
  choice: 幽暗
  rationale: עֲרָפֶל指浓重的黑暗、昏暗，也可使人联想到笼罩神显现的暗云；“幽暗”保留庄严而不可看透的意象，不把它限定为普通气象现象。
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: 上帝所在的
  rationale: 关系从句直指上帝所在之处；这样表达自然，并未把“在”扩展解释为特定形态的临在。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 本语境明确指以色列的上帝；采用现代标准普通话中庄重而通行的称呼。
theological_decisions:
- issue: 上帝在幽暗中的显现
  choice: 保留“上帝所在的幽暗”这一具体而带张力的表述
  alternative: 暗云；浓黑之处；上帝临在的幽暗
  rationale: 经文把上帝的临在与遮蔽视线的幽暗联系起来。译文不将其简化为普通云层，也不增译“临在”来解释这种奥秘，而保留神圣临近与不可直视并存的张力。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“百姓远远地站着”与“摩西却走近”形成自然对照；分号加强两个行动之间的对比。“幽暗”避免过度解释，同时脚注交代“暗云”等可能译法。
