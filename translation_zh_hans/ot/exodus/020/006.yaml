base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/006.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: zh_hans
  text: 却向数千[a]施慈爱，就是向那些爱我、遵守我诫命的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“直到千代”（参申命记5:10）；本节希伯来文只写“数千”。
    reason: 保留לַאֲלָפִים究竟指人数还是省略了“代”的歧义。
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: 却……施
  rationale: 分词承接上节，与惩罚形成对照；“却”在中文中自然显明转折，而“施”与宾语“慈爱”搭配，保留持续施行之意。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 该词表达坚定、忠诚并带有盟约关系的爱与恩慈；“慈爱”是现代中文圣经语体中庄重而易懂的对应词，也不把含义缩窄为单纯的怜悯。
- source_word: לַאֲלָפִים
  choice: 向数千
  rationale: 希伯来文本身只写“数千”，没有明说“代”。主文保留这一省略和由此产生的范围歧义，不从平行经文补入“代”。
- source_word: לְאֹהֲבַי
  choice: 向那些爱我的人
  rationale: 分词加第一人称后缀在现代中文中自然译作关系从句，表达持续忠于上帝的人。
- source_word: וּלְשֹׁמְרֵי
  choice: 遵守
  rationale: שׁמר以诫命为宾语时意为谨守、遵行；“遵守”是现代中文最自然清楚的表达。
- source_word: מִצְוֺתָי
  choice: 我的诫命
  rationale: “诫命”保留十诫语境中的盟约与律法色彩，比一般性的“命令”更贴切。
theological_decisions:
- issue: לַאֲלָפִים所指的范围
  choice: 向数千
  alternative: 直到千代／向千代的人
  rationale: 本节希伯来文没有“代”一词，因此主文不明确补出世代范围；但上节的代际对比和申命记5:10的平行经文使“千代”成为合理理解，故列入脚注而不在正文中消除歧义。
- issue: 爱上帝与遵守诫命之间的关系
  choice: “那些爱我、遵守我诫命的人”作为同一群体
  alternative: 将两者理解为两个彼此独立的群体
  rationale: 两个带介词לְ的分词结构并列，最自然地描述同一类人的两个相关特征；译文仍只作并列陈述，不进一步规定二者的因果或功德关系。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“施慈爱”“遵守诫命”符合十诫的正式语域；用“就是向那些……”使希伯来文连续的介词结构在中文中可读，同时不额外加入原文没有的“世代”或其他限定。
