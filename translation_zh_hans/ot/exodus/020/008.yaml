  yaml_path: translation/ot/exodus/020/008.yaml
  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: zh_hans
  text: 要记住安息日，把它分别为圣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“守为圣日”，或“使它成为圣洁”。
    reason: 词义替代译法
lexical_decisions:
- source_word: זָכוֹר
  choice: 要记住
  rationale: 这是 זכר 的 Qal 单数祈使式，命令人主动记念；“要记住”直接、自然，也保留盟约命令的力度。
- source_word: אֶת
  choice: 不单独译出
  rationale: 希伯来语中标示确定直接宾语的虚词，现代汉语无需另译。
- source_word: יוֹם הַשַּׁבָּת
  choice: 安息日
  rationale: 指特定的、盟约中确认的安息日；“安息日”是现代汉语圣经用语中准确而通行的对应表达。
- source_word: לְקַדְּשׁוֹ
  choice: 守为圣日
  rationale: 该形式由 קדשׁ 的不定式附第三人称阳性单数后缀构成，表达记念安息日的目的，即将这日分别为圣并按圣日对待；“守为圣日”兼顾原文的成圣含义与自然汉语。
theological_decisions:
- issue: 安息日命令中 קדשׁ 的表达
  choice: 守为圣日
  alternative: 使它成为圣洁；把它分别为圣
  rationale: 原文可指使这日成圣、将它分别为圣或按圣日对待。“守为圣日”保留圣洁与分别的神学分量，同时避免把命令缩减为单纯遵守仪式；脚注列出较贴近构词的译法，以保留语义幅度。
translation_notes:
  register: 采用现代、庄重、简明的标准普通话。“要记住”保留祈使语气；“安息日”沿用通行术语；正文中的脚注标记与脚注对应。
