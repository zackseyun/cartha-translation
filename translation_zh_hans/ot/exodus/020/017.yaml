id: EXO.20.17
reference: Exodus 20:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male slave, or his female slave, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: zh_hans
  text: 不可贪恋你邻舍的房屋[a]；不可贪恋你邻舍的妻子、男奴、女奴、牛、驴，以及属于你邻舍的任何东西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “房屋”也可译作“家户”。希伯来语这个词可指居所，也可指一个家户；但本节下文又分别列出妻子、奴隶和牲畜，因此正文译作“房屋”。
    reason: 词义存在真实的语境性选择，脚注保留另一种可能而不使正文重复。
lexical_decisions:
- source_word: תַחְמֹד
  choice: 贪恋
  rationale: 该动词在此禁令中不是泛指“想要”，而是指对他人所有之物产生不正当的占有欲；“贪恋”既保留欲望层面的含义，也体现其伦理性质。
- source_word: בֵּית רֵעֶךָ
  choice: 你邻舍的房屋
  rationale: בַּיִת既可指建筑物，也可指家户；鉴于下文另列妻子、奴隶和牲畜，正文采用“房屋”，同时以脚注保留“家户”的可能。
- source_word: רֵעֶךָ
  choice: 你的邻舍
  rationale: רֵעַ在盟约律法中通常指共同体中的他人。“邻舍”是中文圣经语境中自然、庄重而且不限于紧邻住户的表达。
- source_word: אֵשֶׁת רֵעֶךָ
  choice: 你邻舍的妻子
  rationale: 该结构直接表示“邻舍的妻子”，保留其关系和法律层面的明确性。
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: 男奴、女奴
  rationale: 两个词分别指男性和女性的受奴役者；在这项涉及归属关系的律法清单中，奴属身份较为突出，因此不用可能弱化身份的“仆人”，并保留原文的性别区分。
- source_word: שׁוֹרוֹ / חֲמֹרוֹ
  choice: 牛、驴
  rationale: שׁוֹר在律法语境中指牛类，常为役用牛；现代中文以“牛”最自然。חֲמוֹר明确指驴。
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: 以及属于你邻舍的任何东西
  rationale: 这是概括前列各项的兜底语，译文保留“属于”的所有关系和“任何”的周全范围。
- source_word: לֹא ... לֹא
  choice: 不可……不可……
  rationale: 保留原文重复的禁令形式，不将两句合并，以体现诫命的节奏与强调。
theological_decisions:
- issue: 首句בֵּית应译作物质性的“房屋”还是关系性的“家户”
  choice: 房屋
  alternative: 家户、全家
  rationale: בַּיִת本身容许两种含义，但本节随后分别列出妻子、奴隶与牲畜；正文采用“房屋”较少造成重复，也不把词义扩展为原文未明说的整个家庭群体。脚注保留真实的词义歧义。
- issue: 盟约律法中的奴隶身份用语
  choice: 男奴、女奴
  alternative: 男仆、女仆；仆人、婢女
  rationale: 此处人物与房屋、牲畜等一同出现在归属清单中，受奴役的法律和社会身份不宜被“仆”淡化；译文并不借此认可该制度，只如实反映原文语境。
- issue: “贪恋”是否仅指外在夺取行为
  choice: 保留对不正当欲望本身的禁止
  alternative: 译成“不可夺取”或仅指实际侵占
  rationale: חמד明确涉及欲求或觊觎；虽然该欲望可能导向行动，正文不把诫命缩窄为已经发生的夺取行为，也不额外界定其全部心理或法律边界。
translation_notes:
  register: 采用现代、庄重而易懂的诫命体。“不可”保留律法语气；重复两次“不可贪恋”，对应希伯来文结构。“男奴、女奴”虽较直白，但准确呈现古代受奴役身份，避免以较柔化的称谓遮蔽原文。
