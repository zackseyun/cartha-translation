base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: zh_hans
  text: 他们对摩西说：“你来跟我们说话，我们就听；不要让上帝跟我们说话，免得我们死。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: 他们对摩西说
  rationale: 未完成式连续体推进叙事，现代汉语用简单过去叙述即可；אֶל在此标明说话的对象。
- source_word: דַּבֵּר אַתָּה
  choice: 请你……说话
  rationale: 祈使式加独立代词אַתָּה强调由摩西本人、而非上帝来说；“请你”在自然汉语中既保留强调，也符合百姓恳求的语境。
- source_word: עִמָּנוּ
  choice: 跟我们
  rationale: עִם基本义为“与、同”；“跟我们说话”既自然，也保留相互面对的关系意味。
- source_word: וְנִשְׁמָעָה
  choice: 我们一定听
  rationale: 该形式带意愿或承诺色彩；“一定听”表达百姓愿意认真听从，不把语义缩窄为单纯听见。
- source_word: וְאַל־יְדַבֵּר
  choice: 不要让……说话
  rationale: אַל加未完成式表达禁止或否定意愿；汉语使役结构准确传达“不要让上帝跟我们说话”。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 虽然该词词形为复数形式，但此处相关动词为单数，西奈语境也明确指以色列的上帝。
- source_word: פֶּן־נָמוּת
  choice: 免得我们死
  rationale: פֶּן引出所惧怕的后果；“免得”简洁、庄重，并保留“死亡可能随之发生”的语气。
theological_decisions:
- issue: אֱלֹהִים的所指与数
  choice: 上帝（单数）
  alternative: 众神
  rationale: 单数动词和西奈山上下文都表明所指是以色列的上帝；这是语法和语境判断，而非额外的教义解释。
- issue: וְנִשְׁמָעָה是否包含顺服意味
  choice: 译作“我们一定听”，保留认真听取和响应的开放性
  alternative: 我们一定听从
  rationale: שׁמע可指听见、留心听或听从；直接译成“听从”可能过早限定为服从，因此正文保留较宽的“听”。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“请你”体现原文独立代词的强调与恳求语气；“一定听”体现意愿式的承诺力度。正文没有必须另加脚注才能保存的异文或歧义。
