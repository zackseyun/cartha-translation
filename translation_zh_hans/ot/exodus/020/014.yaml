lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: לֹא与未完成式连用，在十诫的盟约律法语境中表达明确而持续有效的禁令。现代汉语“不可”简洁、庄重，并保留诫命体的语气。
- source_word: תִּנְאָף
  choice: 奸淫
  rationale: נאף的Qal词干在此指犯奸淫，即破坏婚姻忠贞。“奸淫”是现代中文圣经和法律伦理语境中清楚、凝练且语义准确的对应表达。
theological_decisions:
- issue: 十诫禁令句式的表达
  choice: 不可奸淫。
  alternative: 不要犯奸淫。
  rationale: 原文以לֹא加第二人称阳性单数未完成式构成盟约律法中的禁令。“不可”比口语化的“不要”更能保留诫命庄重、恒常的规范效力，同时仍为现代读者所熟悉。
- issue: 第二人称阳性单数形式的适用范围
  choice: 中文不显明性别，以普遍适用的诫命表达
  alternative: 添加“你”或明确限定男性
  rationale: 希伯来语动词虽为第二人称阳性单数，但在十诫中代表性地向盟约成员说话。中文零主语的“不可奸淫”既不虚增性别限制，也保留直接命令的功能。
translation_notes:
  register: 采用现代、庄重而简洁的诫命体。沿用普通读者熟悉的“不可奸淫”，不添加原文没有的主语、宾语或解释性限定。
