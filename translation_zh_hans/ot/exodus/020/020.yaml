base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: zh_hans
  text: 摩西对百姓说：“不要惧怕[a]，因为上帝临到，是要考验你们，也要使你们常常敬畏他[b]，好叫你们不犯罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“不要害怕”。希伯来文这里与后面的“敬畏”使用同一词根，刻意对照惊恐和对上帝应有的敬畏。
    reason: lexical_alternative
  - marker: b
    text: “敬畏”也可译作“惧怕”；原词既可表示恐惧，也可表示带有尊崇之意的畏惧。直译“使他的敬畏在你们脸上（或面前）”；此处指始终摆在眼前、常存于意识之中。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: 不要惧怕
  rationale: 保留“惧怕”的含义，并尽可能呼应后文的“敬畏”；此处指百姓面对上帝显现时的惊惧。
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: 来是要考验你们
  rationale: לְבַעֲבוּר表示目的，נַסּוֹת表示试验、考验；“考验”在现代汉语中自然，也不暗示引诱人作恶。
- source_word: בָּא הָאֱלֹהִים
  choice: 上帝来
  rationale: בָּא描述上帝在西奈山现场的临到；简洁译作“上帝来”，符合叙事语境。
- source_word: יִרְאָתוֹ
  choice: 对他的敬畏
  rationale: יִרְאָה可指惧怕，也可指敬畏。此处强调一种持续约束人不犯罪的畏惧与尊崇，译作“敬畏”较自然，同时用脚注保留“惧怕”的词义张力。
- source_word: עַל־פְּנֵיכֶם
  choice: 常在你们面前
  rationale: 原文直译为“在你们脸上／面前”，这里表达始终摆在眼前、持续存于意识之中的意思；“常在你们面前”既保留意象，也便于理解。
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: 好使你们不犯罪
  rationale: 该结构表达否定目的；“好使你们不犯罪”清楚保留目的关系。
theological_decisions:
- issue: “不要惧怕”与“对他的敬畏”之间的表面张力
  choice: 正文分别译作“惧怕”和“敬畏”，并以脚注说明希伯来文使用同一词根
  alternative: 两处都译作“惧怕”
  rationale: 希伯来文刻意以同一词根对照惊恐与使人远离罪的正当敬畏。现代汉语若两处都用“惧怕”，后半句容易被理解为单纯恐慌；正文采用自然的汉语区分，同时借脚注保存原文的词汇呼应和神学张力。
- issue: 上帝“考验”百姓的性质
  choice: 仅译作“考验”，不加入道德性解释
  alternative: 试探
  rationale: נסה在这里指检验、考验；上下文所说的目的在于使百姓不犯罪。“考验”不暗示上帝引诱人作恶，也不额外加入经文没有明说的教义解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“考验”“敬畏”“犯罪”均为普通读者熟悉的用语；句式保留原文连续的目的关系，并借脚注说明无法在汉语正文中完全重现的同根词呼应。
