lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: לֹא与未完成式连用，在十诫的盟约律法语境中表达直接禁令。“不可”在现代汉语中简洁、庄重，并保留法令式语气。
- source_word: תִּגְנֹב
  choice: 偷盗
  rationale: 这是גנב的Qal未完成式第二人称阳性单数。该动词通常泛指窃取；虽然在某些语境中可特指拐走人口，但本节没有宾语将意义限定为绑架，因此译作范围较广且符合十诫简洁风格的“偷盗”。
theological_decisions:
- issue: 十诫禁令的表达形式
  choice: 不可偷盗。
  alternative: 不要偷盗。
  rationale: 希伯来文以לֹא加未完成式表达盟约律法中的直接禁令。“不可”比“不要”更具庄重、规范性的律法语体，同时仍是普通现代读者易懂的表达；这一选择属于语体与话语层面的处理，并非教义判断。
- issue: גנב是否特指绑架
  choice: 保留广义的偷盗
  alternative: 不可拐带人口。
  rationale: 该节本身没有明示宾语，动词在此不能仅凭上下文被确定为绑架。采用广义译法可避免把一种可能的具体所指写成唯一含义，并保留原文的概括性。
translation_notes:
  register: 采用简洁、庄重而通行的现代标准汉语。“不可”承载十诫的律法禁令语气；“偷盗”保持原文动词的宽泛含义，不擅自补出宾语。主文中的[a]与脚注对应。
