source:
  edition: WLC
  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: zh_hans
  text: 因为耶和华在六日之内造了天、地、海和其中的一切，在第七日安息了[a]。所以，耶和华赐福给安息日，将安息日分别为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安息”或译“停止”。希伯来语动词既可强调安歇，也可强调停下作工。
    reason: 保留 וַיָּנַח 的词义幅度，避免将其限定为因疲乏而休息，同时不把“工作”作为替代译文中原文未明说的宾语。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节的安息日命令，引出其根据；“因为”清楚保留原文的解释关系。
- source_word: שֵׁשֶׁת יָמִים
  choice: 在六日之内
  rationale: 表达创造工作所处的六日时段，既贴近原文，也符合现代汉语习惯。
- source_word: עָשָׂה
  choice: 造了
  rationale: 该动词本义宽泛，可指“做、制造”；在列举天地海的创造语境中，“造”最自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译四字神名，不以称号替代原文的专名。
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ אֶת הַיָּם
  choice: 天、地、海
  rationale: 保留原文列举的三个受造领域；中文用“天、地、海”简洁自然。
- source_word: כָּל אֲשֶׁר בָּם
  choice: 其中的一切
  rationale: 概括天、地、海中所有事物，准确传达原文的全面范围。
- source_word: וַיָּנַח
  choice: 安息了
  rationale: נוח可表示安歇或停止工作；“安息”与本节的安息日主题自然呼应，同时以脚注保留“停止工作”的词义可能。
- source_word: עַל כֵּן
  choice: 所以
  rationale: 明确表达由创造和第七日安息所推出的结论，符合现代汉语行文。
- source_word: בֵּרַךְ
  choice: 赐福给
  rationale: 表达上帝将福分赋予这日；比单说“祝福”更清楚地呈现施予关系。
- source_word: וַיְקַדְּשֵׁהוּ
  choice: 使它成为圣日
  rationale: 自然表达上帝将安息日分别为圣的行动，并让普通现代读者容易理解。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号；正文保留专名，并采用现代中文读者最熟悉的音译形式。
- issue: 上帝在第七日的行动
  choice: 安息了
  alternative: 停止工作了
  rationale: “安息”保留本节与安息日之间的词义和主题联系；原文动词也可侧重停止工作，因此在脚注中保留该可能性，不将其解释为因疲乏而休息。
- issue: 安息日被分别为圣
  choice: 使它成为圣日
  alternative: 使它成圣
  rationale: 两者都能表达原文；所选译法以清楚的现代汉语说明这一天被赋予圣洁、分别出来的地位，而不额外说明其方式。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“天、地、海和其中的一切”保留原文的整体性列举；“安息日”“圣日”使用普通读者易懂且具有经文语体的表达。
