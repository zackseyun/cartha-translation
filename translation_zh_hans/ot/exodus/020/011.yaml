revisions:
- from: 因为耶和华在六日之内造了天、地、海和其中的一切，在第七日安息了[a]。所以，耶和华赐福给安息日，使它成为圣日。
  to: 因为耶和华在六日之内造了天、地、海和其中的一切，在第七日安息了[a]。所以，耶和华赐福给安息日，将安息日分别为圣。
  rationale: 仅作两项低风险的措辞校正：将“使它成为圣日”改为直接对应 קדש 的“将安息日分别为圣”，并微调脚注以更精确保留 נוח 的语义范围。其余译文忠实、自然，且脚注锚点正确置于“安息了”之后。
