base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: zh_hans
  text: 六日你要劳作，做你一切的工作。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你要在六日内工作。”
    reason: “六日”是无介词的时间短语；汉语可直译为“六日”，也可在替代译法中明确表达为“在六日内”。替代译法将“劳作”和“做……工作”合并为“工作”。
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日
  rationale: 希伯来语由数词与复数名词构成时间短语，直译为“六日”简洁庄重；也可按现代汉语补出“在六日内”。
- source_word: תַּעֲבֹד
  choice: 你要劳作
  rationale: עבד 的 Qal 词干在此表示工作、劳作；未完成体在十诫的律法语境中具有指令意味，“你要”自然保留这一语气。
- source_word: וְעָשִׂיתָ
  choice: 做
  rationale: עשה 义域宽泛，可指做、制造；与 מְלָאכָה 搭配时，“做……的工”贴近原文且符合汉语表达。
- source_word: כָּל
  choice: 一切
  rationale: כָּל 在此表示全部范围，“一切”准确传达其总括意义。
- source_word: מְלַאכְתֶּךָ
  choice: 你的工
  rationale: מְלָאכָה 可指工作、事务或职业性劳作；“你的工”保留安息日语境中的具体劳动含义，并避免与前面的动词完全重复。
theological_decisions:
- issue: 安息日律例中未完成体的指令语气
  choice: 译为“你要劳作”
  alternative: “你可以劳作”或“你当劳作”
  rationale: 在十诫的盟约律法语境中，该形式是指令而非单纯预告；“你要”保留命令语气，“可以”则容易误解为仅仅许可。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“六日”与十诫的凝练风格相称；“劳作”保留 עבד 的力度，“做你一切的工”则较形式对应原文。
