  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: zh_hans
  text: 亚伦和以色列众人看见摩西，只见他脸上的皮肤发着光[a]，就都害怕走近他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“闪耀”或“发出光芒”。这个希伯来语动词很少见，历史上也曾译作“长了角”，但上下文更支持“发光”。
    reason: 说明少见动词קָרַן的词义范围及历史上的另一译法。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见
  rationale: ראה在连续叙事形式中表示实际看见；“看见”在现代汉语中自然、准确。
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: 和以色列众人
  rationale: בְּנֵי יִשְׂרָאֵל是指以色列群体的惯用称呼；“以色列众人”既保留群体性，也比直译“以色列众子”更符合现代汉语。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 该话语标记引导读者注意眼前出人意料的景象；“只见”自然地保留这种突显和惊异效果。
- source_word: קָרַן
  choice: 发着光
  rationale: 这个少见动词在本语境中表示放射光芒或发亮；“发着光”清楚、自然，并保留持续可见的状态。
- source_word: עוֹר פָּנָיו
  choice: 他脸上的皮肤
  rationale: 原文明确提到“脸的皮肤”，不只笼统地说“脸”；译文保留这一具体表述。
- source_word: וַיִּירְאוּ
  choice: 就都害怕
  rationale: 准确表达他们因所见景象而产生的惧怕；“都”明确承接亚伦和以色列众人这一复数主语。
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: 走近他
  rationale: מן加不定式在此表示因惧怕而不愿接近；与“害怕”连用时，“害怕走近他”是自然的现代汉语。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列众人
  alternative: 以色列众子
  rationale: 该希伯来语词组采用阳性复数的传统家族称谓，但在这里指整个以色列群体。“以色列众人”不把所指范围无根据地限于男性，同时保留“众”所表达的整体性。
- issue: 摩西脸上קָרַן的含义
  choice: 发着光
  alternative: 长了角
  rationale: 上下文描述摩西与耶和华相会后脸部出现的可见现象，并导致百姓害怕接近；这里以发光、放射光芒为合适含义。历史上的“长了角”译法作为词源相关的少见解释保留在脚注中，而不进入正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“只见”传达וְהִנֵּה的突显作用；“脸上的皮肤”保留原文的具体措辞；整体句式适合普通读者朗读和理解。
