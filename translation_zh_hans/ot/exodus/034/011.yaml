base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: zh_hans
  text: 你要谨守我今天所吩咐你的事[a]。看哪，我要从你面前逐出亚摩利人、迦南人、赫人、比利洗人、希未人和耶布斯人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谨守”也可译作“留心遵守”或“谨慎对待”。
    reason: lexical_alternative
  - marker: b
    text: “从你面前”直译为“从你面前”；这里指从你面前、从你所在之地被逐出。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: 你要谨守
  rationale: שׁמר在此是阳性单数祈使式，语境指留心遵守、持守所吩咐的事。译作“谨守”兼顾“守”和审慎留意的含义；לְךָ带有与受命者切身相关的强调，汉语中不宜生硬另译为“为自己”。
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: 我今天所吩咐你的
  rationale: 按关系从句直译，保留“我”“今天”和受词“你”；中文以“所吩咐你的”自然承接“谨守”。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 该表达用于唤起注意并强调上帝即将施行的行动。“看哪”保留其指示和庄重语气。
- source_word: גֹרֵשׁ
  choice: 我要……赶走
  rationale: 分词与הִנְנִי连用，可表达正在展开、迫近或确定将发生的行动。中文“我要……赶走”自然呈现此处的迫近将来，同时不削弱行动的确定性。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 保留希伯来语“从你面前／从你所在之处”的空间意象，表示这些民族将从以色列面前被逐离。
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: 亚摩利人、迦南人、赫人、比利洗人、希未人和耶布斯人
  rationale: 希伯来文以单数族名作集合称谓，现代汉语自然译为各族群名称；采用通行圣经专名译法。
theological_decisions:
- issue: 盟约语境中שׁמר命令式的含义
  choice: 译为“谨守”，指留心持守上帝所吩咐的事
  alternative: “要小心我今天所吩咐你的”或“要遵行我今天所吩咐你的”
  rationale: 原文同时容纳看守、持守和谨慎留意的语义，但没有明说“遵行”。“谨守”既符合盟约语境，又不把含义扩写为原文未明示的行动公式。
- issue: הִנְנִי גֹרֵשׁ的时态和体貌
  choice: “看哪，我要……赶走”
  alternative: “看哪，我正在……赶走”
  rationale: 该结构可呈现临近或确定的神圣行动。此处所列民族尚待从以色列面前被逐出，汉语用“我要”较自然，也保留上帝行动的确定性，而不把时间关系限定为已经正在发生。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谨守”和“看哪”保留经文的盟约语气与强调色彩；族名使用简体中文圣经传统中的通行译名。
