  text: וּ/פֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֨י/ךָ֙ תִּפְדֶּ֔ה וְ/לֹֽא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: zh_hans
  text: 驴的头胎，要用一只羊[a]赎回；若不赎，就要折断它的颈项。你儿子中一切头生的，都要赎回。任何人不可空手朝见我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “羊”所译的希伯来语可指羊群中的绵羊或山羊。
    reason: lexical_alternative
  - marker: b
    text: “空手”指不带礼物或供物。原文“朝见我”直译为“显现在我面前”。
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: 驴头生的
  rationale: פֶטֶר 指首先出母腹者；在这条律法中，现代汉语以“驴头生的”简洁表达其头胎之意，同时不额外添加原文没有明说的性别。
- source_word: תִּפְדֶּה
  choice: 赎回
  rationale: פדה 在礼仪和律法语境中指借替代物或代价赎取；“赎回”保留其法律与礼仪含义。
- source_word: בְשֶׂה
  choice: 用一只羊
  rationale: שֶׂה 可指羊群中的单只绵羊或山羊；正文采用自然且不过度限定年龄的“一只羊”，脚注保留物种范围。
- source_word: וַעֲרַפְתּוֹ
  choice: 打断它的颈项
  rationale: ערף 指折断颈项，不宜译成含义不同的“斩首”；此译法具体而准确。
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: 你所有头生的儿子
  rationale: בָּנֶיךָ 明确指“你的儿子们”；“头生的儿子”保留男性所指和律法语体。
- source_word: יֵרָאוּ פָנַי
  choice: 来朝见我
  rationale: 字面为“显现在我面前”，在敬拜语境中指到上帝面前朝见；“来朝见我”自然传达这一惯用义，并保留上帝直接说话的语气。
- source_word: רֵיקָם
  choice: 空手
  rationale: רֵיקָם 字面为“空着”，在朝见上帝的语境中暗示不可不带礼物或供物；“空手”保留这一简洁而含蓄的表达。
theological_decisions:
- issue: 末句中上帝第一人称的表达
  choice: 来朝见我
  alternative: 显现在我面前
  rationale: 原文“我的面”是朝见上帝的希伯来语惯用表达。译作“朝见我”既保留直接神谕，也避免把字面身体意象解释成额外的神学主张。
- issue: בָנֶיךָ 的性别所指
  choice: 你的儿子
  alternative: 你的孩子
  rationale: 原文明确使用“儿子”，本节所论又是头生男性的赎回，因此不将其泛化为“孩子”。
- issue: רֵיקָם 所隐含的礼仪要求
  choice: 正文译“空手”，脚注说明礼物或供物
  alternative: 不带供物
  rationale: 原文只说“空着”，但语境暗示朝见时应带礼物或供物。正文保留其含蓄性，脚注提供文化语境，避免把隐含信息写成明说。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语，并保留律法条文的命令语气。以“头生的”对应本节反复出现的首生概念；“颈项”较“脖子”更适合经文的庄重语域。英文咨询层的脚注 b、c 位置与内容疑似互换，故按希伯来原文把“我的面”和“空手”的说明合并置于末句脚注，未照搬其错位标记。
