base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: zh_hans
  text: 一年三次，你所有的男子都要朝见[a]主耶和华[b]——以色列的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朝见”所译的希伯来语表达，字面涉及“见……的面”，意思是来到某位面前或在其面前出现。
    reason: lexical_alternative
  - marker: b
    text: “主耶和华”在希伯来文中由称号“主”和神名YHWH（耶和华）相连组成；二者在原文中有别。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: 一年三次
  rationale: 自然、准确地表达每年三次的频率，也保留年度周期的含义。
- source_word: יֵרָאֶה
  choice: 要朝见
  rationale: 此处是敬拜礼仪语境中的尼法勒式；“朝见”既表达来到上帝面前，也符合节期觐见的庄重语体，避免机械译成“被看见”。
- source_word: כָּל זְכוּרְךָ
  choice: 你所有的男子
  rationale: 忠实保留原文明确的男性所指；“男子”比泛化的“众人”更准确。
- source_word: אֶת פְּנֵי
  choice: 朝见
  rationale: 原文字面涉及“面”，在该惯用语中表示来到某位面前；中文以“朝见”自然承载这一含义。
- source_word: הָאָדֹן
  choice: 主
  rationale: 作为神圣称号译为“主”，并与随后作为专名的“耶和华”保持区别。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名形式，不将其与前面的称号“主”合并。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 清楚呈现原文的属格关系，并采用现代标准普通话中自然庄重的表达。
theological_decisions:
- issue: הָאָדֹן יְהוָה中神圣称号与神名的关系
  choice: 主耶和华
  alternative: 主上帝；主——耶和华
  rationale: 原文连续使用称号“主”和神名YHWH；译文将两者都保留，既不重复为两个“主”，也不把神名改成普通称号。破折号放在整个称谓之后，引出同位说明“以色列的上帝”。
- issue: 节期义务的性别限定
  choice: 你所有的男子
  alternative: 你们所有的人；你所有的男丁
  rationale: 原文明确指男性，应保留这一限定；“男子”较“男丁”更现代，也不额外暗示年龄或户籍身份。
- issue: יֵרָאֶה的语态与礼仪含义
  choice: 要朝见
  alternative: 要显现在……面前；要被看见
  rationale: “朝见”表达规定性的赴会和临到上帝面前，同时避免将尼法勒式生硬处理为中文被动句；不进一步解释具体节期，以免超出本节。
translation_notes:
  register: 采用现代、庄重且易懂的简体中文。“一年三次”符合普通话习惯；“朝见”保留礼仪和觐见色彩。主文中的[a][b]与脚注逐一对应。
