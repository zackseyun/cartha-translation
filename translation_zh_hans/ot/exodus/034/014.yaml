id: EXO.34.14
reference: Exodus 34:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: zh_hans
  text: 因为你不可向别的神跪拜[a]；因为雅威——他名为“忌邪者”[b]——是忌邪的神[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你不可敬拜别的神。”希伯来语动词本指俯伏、下拜，常表示敬拜。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“因为雅威——‘忌邪者’是他的名——是忌邪的神。”
    reason: lexical_alternative
  - marker: c
    text: 这里的“忌邪”指雅威在盟约中要求他的子民专一敬拜他，并非出于罪性的嫉妒。
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: 跪拜
  rationale: 该词具体指俯伏、下拜，并常用于敬拜行为。“跪拜”既保留身体动作，也在本语境中自然传达宗教敬拜之意。
- source_word: לְאֵל אַחֵר
  choice: 向别的神
  rationale: אֵל 是“神”，אַחֵר 是“别的、另一个”；此处直译为“向别的神”，不额外引入“外邦”之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留四字神名，区别于“主”等称号。
- source_word: קַנָּא
  choice: 忌邪者／忌邪的
  rationale: 该词在此表达雅威对其子民敬拜的排他性要求。“忌邪”是庄重且为中文读者熟悉的圣经用语，并能在名称和属性两处保持希伯来文的重复。
- source_word: שְׁמוֹ
  choice: 他名为
  rationale: 简洁保留“他的名是”的命名陈述，并与插入式结构自然衔接。
- source_word: אֵל קַנָּא הוּא
  choice: 是忌邪的神
  rationale: 保留原文对前一命名的解释和强调，不把两次 קַנָּא 合并或弱化。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其专名性质，而不以称号替代。
- issue: קַנָּא 作为名号和属性的译法
  choice: “忌邪者”／“忌邪的”
  alternative: “嫉妒者”／“嫉妒的”；“热忱者”／“热忱的”
  rationale: “忌邪”传达盟约关系中不容竞争敬拜的排他性要求，同时避免现代汉语“嫉妒”通常含有的罪性或狭隘意味；两处对应译出，以保留原文修辞。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“跪拜”保留具体动作；破折号呈现原文命名句的插入和强调。“忌邪者”作为名号加引号，以帮助普通读者辨认其命名功能。
