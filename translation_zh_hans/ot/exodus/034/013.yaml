base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: zh_hans
  text: 你们却要拆毁他们的祭坛，打碎他们的祭祀石柱，砍倒所立的亚舍拉木柱[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉木柱”也可音译为“亚舍林”。原文此词带第三人称阳性单数后缀，直译可作“他所立的亚舍拉（物）”；这里指与亚舍拉有关、可被砍倒的祭祀物。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: 相反
  rationale: 本词常可表示“因为”，但在这里承接上一节不可立约的禁令，转而说明以色列人必须采取的相反行动；译作“相反”能自然呈现上下文的对比关系，同时以脚注保留另一种可能。
- source_word: מִזְבְּחֹתָם
  choice: 他们的祭坛
  rationale: מִזְבֵּחַ在祭祀语境中指祭坛；保留复数及第三人称复数所属关系。
- source_word: תִּתֹּצוּן
  choice: 拆毁
  rationale: נתץ表示拆除、毁坏建筑物；“拆毁”适合祭坛，也符合现代汉语表达。
- source_word: מַצֵּבֹתָם
  choice: 他们的神柱
  rationale: מַצֵּבָה在本语境中指竖立起来用于祭祀的石柱；“神柱”简洁地标明其宗教用途，又不具体断定其形制。
- source_word: תְּשַׁבֵּרוּן
  choice: 打碎
  rationale: שׁבר的加强词干表达强力毁坏；“打碎”准确传达这一力度，并适合石质神柱。
- source_word: אֲשֵׁרָיו
  choice: 他们的亚舍拉木柱
  rationale: 复数形式在此指与亚舍拉有关的祭祀物件；结合“砍倒”这一动词，木制物最为可能。“亚舍拉木柱”既保留专名联系，也让现代读者明白所指是可砍倒的祭祀物。
- source_word: תִּכְרֹתוּן
  choice: 砍倒
  rationale: כרת可指砍下、砍除；与亚舍拉祭祀物搭配时，“砍倒”自然地反映其很可能为木制。
theological_decisions:
- issue: אֲשֵׁרָיו的所指
  choice: 与亚舍拉有关的祭祀物，译作“亚舍拉木柱”
  alternative: 音译为“亚舍林”，或译作“亚舍拉像”
  rationale: 本节列举要毁掉的实体：祭坛、神柱和אֲשֵׁרָיו；所用动词“砍倒”强烈暗示木制祭祀物，而不是女神本身。译作“亚舍拉木柱”既传达最可能的实体所指，也保留它与名为亚舍拉的神祇之间的联系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“拆毁—打碎—砍倒”保留原文三个不同动词及逐步展开的强烈动作。“神柱”说明מַצֵּבָה的祭祀性质；“亚舍拉木柱”以清楚表达为主，同时用脚注保留较形式化的音译。
