revisions:
- from: 相反[a]，你们要拆毁他们的祭坛，打碎他们的神柱，砍倒他们的亚舍拉木柱[b]。
  to: 你们却要拆毁他们的祭坛，打碎他们的祭祀石柱，砍倒所立的亚舍拉木柱[a]。
  rationale: 修订以“却要”自然承接上文，并保留 כִּי 可有说明性含义的余地。以“祭祀石柱”准确表达 מַצֵּבֹת 的礼仪石柱性质。末项不再以“他们的”覆盖原文单数后缀，改用中文中不显性标示人称和数的“所立的”，并在脚注保留词形及“亚舍林”的替代译法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:51Z'
review_pass:
  verdict: revise
  source_fidelity: “相反”可表达上下文的对照，但较强地限定了 כִּי 的功能；译为“却要”既保留转折承接，也不排除其可有的说明性语气。更重要的是，末项 אֲשֵׁרָיו 的词尾为第三人称阳性单数，草稿及脚注一律作“他们的”未反映该词形。可在中文正文以不显性标示数的人称所属语“所立的”处理，并在脚注说明原文词形及所指的不确定性。
  naturalness: “你们却要拆毁……打碎……砍倒……”庄重、清楚，符合现代标准汉语。将“神柱”调整为“祭祀石柱”可避免“神柱”被误解为柱状神像，同时准确表达竖立的礼仪石柱。
  terminology: “亚舍拉”保留专名关联是合适的；“亚舍拉木柱”是对其为木制祭祀物的合理解释，但不宜在脚注中将“亚舍林”简单说成等同的替代音译而不说明其形式。“祭祀石柱”对应 מַצֵּבֹת，避免把其性质过度神化或泛化。
