source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你要把这些话写下来，因为我已经按照这些话，与你和以色列立了约[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“切了约”。
    reason: 说明“立约”所对应的希伯来语习语及其字面意象。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译保留上帝向以色列启示的专名，而不以称号替代。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是叙事中引出直接引语的常用形式；汉语用“说”自然简洁。
- source_word: כְּתָב לְךָ
  choice: 你要把……写下来
  rationale: “写下来”清楚表达命令中的记录动作；主语“你”体现命令直接指向摩西。לְךָ所含的亲身参与意味在汉语中若硬译为“为自己”容易被误解为仅供摩西个人使用，因此不机械译出。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些话
  rationale: 在书写和立约语境中，דְּבָרִים指所说、所规定的话；两处保持同一译法，以保留原文的重复和对应。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出吩咐摩西写下这些话的理由，译作“因为”明确保留因果关系。
- source_word: עַל פִּי הַדְּבָרִים הָאֵלֶּה
  choice: 按照这些话
  rationale: עַל פִּי是表示依据或准则的习语；“按照”在现代汉语中自然，并保留盟约以这些话为依据的含义。
- source_word: כָּרַתִּי ... בְּרִית
  choice: 我已经……立了约
  rationale: 希伯来语字面为“切约”，汉语惯用“立约”。“已经……立了”表达完成的行动，同时不增添原文没有的时间细节。
- source_word: אִתְּךָ וְאֶת יִשְׂרָאֵל
  choice: 与你和以色列
  rationale: 保留摩西和以色列都被列入立约关系中的并列结构，不进一步解释双方角色。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: “雅威”直接音译四字神名，保留其作为专名的性质；不以“主”这一称号替代，也不采用源于较晚元音组合的“耶和华”。
- issue: 盟约习语 כָּרַתִּי ... בְּרִית 的译法
  choice: 立了约
  alternative: 切了约
  rationale: “立约”是现代汉语表达缔结盟约的自然说法；字面意象则收入脚注，既便于普通读者理解，也不完全隐藏原文措辞。
- issue: 摩西与以色列在盟约中的关系
  choice: 与你和以色列立了约
  alternative: 为你和以色列立了约
  rationale: 原文使用表示共同关系的介词结构，译作“与”保留双方处于立约关系中的表述，不把它改释为单方面为他们设立盟约。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“雅威”保留神名；“写下来”“按照这些话”“立了约”均为普通读者容易理解的表达。原文两次出现“这些话”，译文也予以重复，以保留结构上的强调和盟约依据。
