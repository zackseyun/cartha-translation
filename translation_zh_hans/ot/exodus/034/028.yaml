revisions:
- from: 他在那里与耶和华同在四十昼夜；他没有吃饼，也没有喝水。他把约的话，就是那十句话[b]，写在石版上[a]。
  to: 他在那里与耶和华同在四十天四十夜；他没有吃饼，也没有喝水。他在石版上写下了[a]约的话语，即十句话[b]。
  rationale: 修订仅处理安全且必要的表达与脚注锚定问题：以“四十天四十夜”明确对应原文的日与夜；恢复末句较接近原文的语序；将主语歧义脚注锚定于“写下”；并将“约的话”润饰为自然的“约的话语”。正文仍以未明示先行词的“他”保存原文及上下文之间的主语张力，未作协调性解释。
