  naturalness: “约的话”可理解但在现代标准汉语中稍显生硬；“约的话语”既自然也保留原文的构词关系。“四十天四十夜”比“四十昼夜”更明确地对应原文的“四十日和四十夜”。
  terminology: “耶和华”“石版”“十诫”均符合中文圣经常用术语。“十句话”保留原文字面意义，适合置于正文；“十诫”保留在词汇脚注中。
