  text: וַֽ/יְהִי שָׁ֣ם עִם יְהוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּ/מַ֖יִם לֹ֣א שָׁתָ֑ה וַ/יִּכְתֹּ֣ב עַל הַ/לֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַ/בְּרִ֔ית עֲשֶׂ֖רֶת הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: zh_hans
  text: 他在那里与耶和华同在四十天四十夜；他没有吃饼，也没有喝水。他在石版上写下了[a]约的话语，即十句话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他”也可理解为耶和华，因为别处说石版上的话是耶和华写的（参出34:1；申10:4）。
    reason: alternative_reading
  - marker: b
    text: 希伯来文直译为“十句话”；传统称为“十诫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法；不以“主”替代专名，也不引入较少通行的音译形式。
- source_word: וַיְהִי שָׁם עִם
  choice: 他在那里与……同在
  rationale: 直接表达在某处与耶和华一起的状态；“同在”庄重自然，又不额外加入“停留”或“住了”等含义。
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: 四十昼夜
  rationale: 以简洁、自然的现代汉语准确表达“四十日和四十夜”。
- source_word: לֶחֶם לֹא אָכַל
  choice: 他没有吃饼
  rationale: 保留原文具体的“饼”，不泛化为“食物”或“什么也没吃”。
- source_word: וּמַיִם לֹא שָׁתָה
  choice: 也没有喝水
  rationale: 直译原文，并与前句形成平行结构。
- source_word: וַיִּכְתֹּב
  choice: 他……写
  rationale: 该动词为第三人称阳性单数，未明说主语；正文保留“他”，让上下文承担指代，同时用脚注说明可能指耶和华。
- source_word: עַל הַלֻּחֹת
  choice: 在石版上
  rationale: “版”准确表达书写用的版；结合本段上下文补出材质“石”，使现代读者清楚所指，未改变指称对象。
- source_word: דִּבְרֵי הַבְּרִית
  choice: 约的话
  rationale: 保留原文的属格关系及“话”这一核心词，避免将其解释性改写为“约法”。
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: 那十句话
  rationale: 贴近希伯来文“十个话语”，并用现代汉语可理解的表达呈现；传统名称“十诫”置于脚注。
theological_decisions:
- issue: 末句“他写”的主语
  choice: 正文保留未点名的第三人称“他”，依本节表层语法可自然承接摩西。
  alternative: “他”指耶和华，即“耶和华写”。
  rationale: 本节连续使用第三人称单数，最直接的句法理解是同一人物；但出埃及记34:1和申命记10:4把版上的书写归于耶和华。正文不擅自协调这项张力，而在脚注中保存另一种理解。
- issue: עֲשֶׂרֶת הַדְּבָרִים 的译法
  choice: 那十句话
  alternative: 十诫
  rationale: 原文直义是“十个话语”，未使用“诫命”一词；正文优先呈现原文措辞，脚注保留中文传统名称。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“昼夜”“同在”“约”等词保持经文语体；句法清晰，不以古奥表达增加阅读门槛。脚注标记均紧随其所解释的词语。
