source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בֶּֽ/עָנָ֔ן וַ/יִּתְיַצֵּ֥ב עִמּ֖/וֹ שָׁ֑ם וַ/יִּקְרָ֥א בְ/שֵׁ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: zh_hans
  text: 雅威在云中降临，和他一同站在那里，并宣告雅威的名。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求告雅威的名”；也可译：“奉雅威的名宣告。”希伯来语在“名”前使用了可表示“以、凭、奉”的介词。
    reason: 保留בְשֵׁם这一介词结构的词义与句法可能性。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，保留其作为以色列之神专名的性质，不以称号“主”替代。
- source_word: וַיֵּרֶד
  choice: 降临
  rationale: ירד表示向下移动；“降临”在现代汉语叙事中自然庄重，也符合此处神在云中显现的语境。
- source_word: בֶּעָנָן
  choice: 在云中
  rationale: ב在此最自然地表示位置；名词带定冠词，所指是上下文中已知的显现之云。
- source_word: וַיִּתְיַצֵּב
  choice: 站
  rationale: יצב的Hitpael形表示站定或立于某处；“站”简洁自然，不额外强化姿态。
- source_word: עִמּוֹ
  choice: 和他一同
  rationale: עם加第三人称单数阳性后缀意为“与他同在／和他一起”；代词在上下文中指摩西，正文保留原文的代词表达。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留原文的地点副词，并以自然汉语交代场景。
- source_word: וַיִּקְרָא
  choice: 宣告
  rationale: קרא可表示呼叫、称说或宣告；下一节随即给出宣告内容，因此“宣告”最符合此处语境，同时不把内容提前写入本节。
- source_word: בְשֵׁם יְהוָה
  choice: 雅威的名
  rationale: 与“宣告”连用时，汉语以“宣告雅威的名”最自然；希伯来语中“名”前的介词ב所容许的其他理解在脚注中保留。
theological_decisions:
- issue: 神圣四字名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；音译“雅威”可保留圣约之名，而不以称号替代。
- issue: וַיִּקְרָא的主语与语义
  choice: 承接“雅威”为主语，译作“宣告”
  alternative: 以摩西为主语，译作“求告”；或译作“呼叫”
  rationale: 连续叙事动词最自然地延续明示主语“雅威”，而且下一节给出神自我宣告的内容；不过介词短语本身的其他可能理解仍以脚注保留。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“和他一同站在那里”保留原文的人称指代与地点强调；“并”使连续动作在汉语中衔接自然。
