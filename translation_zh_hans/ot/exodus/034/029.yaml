source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: zh_hans
  text: 摩西从西奈山下来时，手里拿着两块见证版；他从山上下来时，摩西不知道自己脸上的皮肤发光了[a]，因为他曾与那位交谈[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发光”也可译作“射出光芒”。这个希伯来语动词可以表示放射光线。翻译史上也曾译作“长了角”，但这不太符合本段语境。
    reason: lexical_alternative
  - marker: b
    text: “因为他曾与那位交谈”也可理解为“当他与那位交谈时”；“那位”在上下文中指耶和华。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: 不单独译出
  rationale: 这里的叙事形式用于推进场景；现代汉语直接以“摩西……下来”起句更自然，也不损失事件衔接。
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: 从……下来；他下山时
  rationale: 保留原文两次提及“下山”的框架性重复，同时用分号使现代汉语句法清楚。
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: 两块见证版
  rationale: “版”指刻写文字的石版；“见证”保留 עֵדוּת 的盟约语境，又不扩展为原文未明说的解释。
- source_word: בְּיַד מֹשֶׁה
  choice: 手里拿着
  rationale: 既保留具体的“手”，也符合现代汉语表达；原文虽用单数，汉语无需标明单复数。
- source_word: לֹא יָדַע
  choice: 却不知道
  rationale: “不知道”直接对应原文，“却”自然呈现摩西本人不知情的反差。
- source_word: קָרַן
  choice: 发出了光辉
  rationale: 该动词在此表示放射光芒；这一译法保留动态意象，并与后文可见的荣光相符。
- source_word: עוֹר פָּנָיו
  choice: 自己脸上的皮肤
  rationale: 保留原文明确出现的“皮肤”，而不简化为仅仅“脸”。
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: 因为他曾与那一位说话
  rationale: 介词 בְּ 可表达原因或时间；正文采用符合上下文的因果理解，以脚注保留时间性可能。“那一位”保留代词性质并减少汉语中两个“他”造成的指代混乱。
theological_decisions:
- issue: קָרַן 描写摩西面容的含义
  choice: 发出了光辉
  alternative: 长了角／呈角状
  rationale: 上下文描述摩西与耶和华相会后显出的可见荣光；“发出光辉”最符合语境，而“长角”虽有翻译史影响，却容易引入不合本段的身体形象。
- issue: אִתּוֹ 的所指
  choice: 正文译作“那一位”，脚注说明指耶和华
  alternative: 正文直接译作“耶和华”或“上帝”
  rationale: 原文使用代词，语境所指则是耶和华；如此处理既保留原文形式，也避免现代汉语代词歧义。
- issue: בְּדַבְּרוֹ 的逻辑关系
  choice: 正文采用因果义“因为”
  alternative: 时间义“当……时”
  rationale: 与上帝说话是面皮发光的语境原因，但希伯来语结构也容许时间性理解，因此在脚注中保留另一种读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“见证版”保留盟约用语；以“那一位”处理原文阳性单数代词，避免连续使用“他”所产生的指代不明。脚注标记均置于与其内容最相关的句末。
