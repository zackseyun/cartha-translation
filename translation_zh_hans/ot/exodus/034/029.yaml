  to: 摩西从西奈山下来时，手里拿着两块见证版；他从山上下来时，摩西不知道自己脸上的皮肤发光了[a]，因为他曾与那位交谈[b]。
  rationale: 修订仅解决汉语中因果分句的错误修饰倾向，并改善“那一位”的自然度和脚注锚点位置。保留原文对“下山”的重复、对“皮肤”的明确提及，以及对代词所指不在正文直接点名的处理；脚注继续保留“发光”的词义选择和时间性理解的可能。
