base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: zh_hans
  text: 你要谨慎[a]，不可与那地的居民立约[b]；你将要进入那地[c]，免得这约在你们中间成为网罗[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你要当心”或“你要自守”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“切约”，是“立约”的习惯说法。
    reason: lexical_alternative
  - marker: c
    text: 或译“就是你正要进去的那地”。
    reason: lexical_alternative
  - marker: d
    text: “网罗”也可译作“陷阱”。原文没有明说末句的主语；这里按上下文译为“这约”，也有人理解为当地居民或整个局面。
    reason: ambiguity
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: 你要谨慎
  rationale: 该反身警告句式要求听者警醒自守；“你要谨慎”在现代汉语中自然，并保留命令和警戒的语气。
- source_word: פֶּן
  choice: 不可……免得
  rationale: 原文两次使用 פֶּן。汉语以“不可以”表达第一重禁戒，以“免得”引出所警告的后果，既保留结构层次，也避免生硬重复。
- source_word: תִּכְרֹת בְּרִית
  choice: 立约
  rationale: 希伯来语字面为“切约”，是订立盟约的固定习语；“立约”是准确、自然且庄重的汉语表达。
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: 与那地的居民
  rationale: 单数分词在此具有集合意义，指当地居民整体；译为复数集合名词符合现代汉语。
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: 就是你将要进入的那地
  rationale: 该关系从句说明以色列将进入的是哪一片土地；“进入”自然表达 בוא 与方向介词在此处所指的移动。
- source_word: יִהְיֶה לְמוֹקֵשׁ
  choice: 成为网罗
  rationale: 单数动词最自然地回指前述之约；“成为”表达其后来造成危险的结果，“网罗”保留原文的捕捉隐喻。
- source_word: בְּקִרְבֶּךָ
  choice: 在你们中间
  rationale: 原文以单数形式指作为整体的以色列群体。中文采用“你们中间”，清楚传达群体内部之意，避免误解为个人内心。
theological_decisions:
- issue: 末句单数动词及“网罗”的所指
  choice: 将“这约”明确为成为网罗的事物
  alternative: 当地居民成为网罗，或整个局面成为网罗
  rationale: 最近且最连贯的先行词是“约”；上下文也在警告与当地居民立约所导致的纠缠。不过希伯来语主语未明说，因此脚注提示语法上存在其他理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“不可……免得……”保留原文双重警告的推进关系；“立约”“网罗”兼顾圣经语体与现代可理解性。
