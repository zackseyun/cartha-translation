  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: zh_hans
  text: 他说：“看哪，我要立约。我要在你全体百姓面前行奇事，是在全地和列国中从未有过的。你所在其中的全体百姓都要看见耶和华的作为，因为我向你所行的事令人敬畏。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留引人注意、郑重宣告的语气，同时符合现代中文圣经文体。
- source_word: כֹּרֵת בְּרִית
  choice: 立约
  rationale: 希伯来语直译为“切约”，中文以“立约”自然、准确地表达缔结盟约。
- source_word: נִפְלָאֹת
  choice: 奇事
  rationale: 指超乎寻常、使人惊叹的作为；“奇事”简洁且不额外限定为某一种神迹。
- source_word: לֹא נִבְרְאוּ
  choice: 从未有过
  rationale: 动词字面涉及“被创造”，此处惯用义指前所未见、前所未成就；如此译法在中文中自然，又保留其空前性。
- source_word: מַעֲשֵׂה יְהוָה
  choice: 耶和华的作为
  rationale: “作为”准确表达神所行之事；神名 יהוה 按本项目中文传统译作“耶和华”。
- source_word: נוֹרָא
  choice: 令人敬畏
  rationale: 该词兼有可畏、震撼并引发敬畏之意；避免仅译“可怕”而缩窄语义。
- source_word: עֹשֶׂה עִמָּךְ
  choice: 在你身上所行
  rationale: עִם 可表示“与、同、对”；语境指耶和华涉及摩西及其百姓而施行的作为，中文用“在你身上”保留对象关系，且不把含义限定为单纯合作。
theological_decisions:
- issue: 立约宣告的时态与性质
  choice: 我要立约
  alternative: 我正在立约
  rationale: 希伯来分词可表达当前正在进行或即将施行的行动；上下文是郑重宣告，中文“我要立约”自然地体现迫近的神圣行动，不额外断定礼仪已经完成。
- issue: 奇事是否称为“创造”
  choice: 从未有过
  alternative: 从未被创造出来
  rationale: 保留这些作为空前绝后的重点，同时避免中文读者误以为“奇事”是受造实体；神学上不对 נברא 的创造用语作过度发挥。
- issue: עִמָּךְ 所指对象
  choice: 在你身上所行的事
  alternative: 与你一同所行的事
  rationale: 保留摩西为第二人称单数对象，也避免暗示神与摩西是同等行动者；其效果会由摩西所在的全体百姓共同见证。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“看哪”保留原文宣告色彩；“全体百姓”“列国”“令人敬畏”均为普通读者可理解而又适合经文的表达。
