source:
  edition: WLC
  text: וְ/רָא֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְ/הֵשִׁ֨יב מֹשֶׁ֤ה אֶת הַ/מַּסְוֶה֙ עַל פָּנָ֔י/ו עַד בֹּא֖/וֹ לְ/דַבֵּ֥ר אִתּֽ/וֹ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: zh_hans
  text: 以色列人看见摩西的脸，见他脸上的皮肤发出光来[a]；摩西就把帕子重新蒙在脸上，直到他进去与他[b]说话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发出光来”也可译作“放射光芒”。这里的希伯来语不是说摩西的脸“长了角”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“他”按紧邻的上下文是指耶和华。
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: 看见
  rationale: 该动词承接叙事次序；本节也概括反复发生的情形，但中文用“看见”配合下文“就”即可自然表达，不必另加“常常”等原文没有的词。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原义为“以色列的众子”，在现代汉语中“以色列人”既准确指称这一群体，也比直译“以色列的儿子们”自然，且不误导为仅限男性。
- source_word: פְּנֵי מֹשֶׁה
  choice: 摩西的脸
  rationale: 以自然的现代汉语领属结构保留原文对摩西面容的具体强调。
- source_word: כִּי
  choice: 见
  rationale: 此处引出以色列人所看见的内容。用第二个“见”连接两个宾语性内容，比生硬译作“即”或误作因果性的“因为”更符合现代汉语。
- source_word: קָרַן
  choice: 发出光来
  rationale: 该动词表示放射光芒或发光；“发出光来”清楚保留动态意象，也避免源于旧时误解的“长角”。
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: 他脸上的皮肤
  rationale: 明确译出 עוֹר“皮肤”，不把它泛化为仅仅“脸”；用代词避免中文中不必要地连续重复“摩西”。
- source_word: וְהֵשִׁיב
  choice: 就把……重新蒙在
  rationale: 使役形在此表示把帕子放回原处；“重新蒙在”自然表达复原动作，“就”连接这一惯常次序。
- source_word: הַמַּסְוֶה
  choice: 帕子
  rationale: 指摩西遮脸所用的覆盖物；“帕子”是现代中文圣经语境中清楚、庄重且不过度现代化的说法。
- source_word: עַל־פָּנָיו
  choice: 蒙在脸上
  rationale: 按帕子的遮盖功能自然表达介词短语，而非机械译作“在他的脸之上”。
- source_word: עַד בֹּאוֹ
  choice: 直到他进去
  rationale: 保留“直到”所标示的时间界限，并按叙事视角将该动作译为“进去”。
- source_word: לְדַבֵּר אִתּוֹ
  choice: 与他说话
  rationale: 保留希伯来文第三人称代词，不在正文中以“耶和华”替换原文措辞；脚注说明其语境所指。
theological_decisions:
- issue: “与他”中代词的所指
  choice: 正文保留“他”，脚注说明按紧邻上下文是指耶和华。
  alternative: 正文直接译作“与耶和华说话”。
  rationale: 希伯来文使用代词；保留代词尊重原文表达，也不把上下文中的明确所指擅自写成该节未重复出现的神名。
- issue: 摩西脸部发光的性质
  choice: 译作“皮肤发出光来”。
  alternative: 译作“皮肤长了角”或较抽象的“容光焕发”。
  rationale: קָרַן 在本语境表示放射光芒；明确译出“皮肤”与“发光”忠实保留现象本身，不引入旧译误解，也不将其弱化为普通的精神焕发。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“以色列人”避免生硬直译亲属称谓；“帕子”保留经文语境中的端正文体。“见……见……”略带书面节奏，但仍属普通读者易懂的现代汉语，并准确呈现所看见的对象及内容。
