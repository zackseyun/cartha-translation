base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: zh_hans
  text: 你要在早晨以前预备妥当；到了早晨，就上西奈山，在那里的山顶站在我面前。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “站在我面前”也可译作“在那里向我站立”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: 你要……预备妥当
  rationale: היה与נָכוֹן构成命令性的述语，意思是进入并保持准备好的状态；“预备妥当”兼顾命令语气和现代汉语的自然表达。
- source_word: לַבֹּקֶר
  choice: 在早晨以前
  rationale: 介词ל在此表示以即将到来的早晨为准备期限；这样也能与下句表示行动时间的בַּבֹּקֶר清楚区分。
- source_word: וְעָלִיתָ
  choice: 就上
  rationale: עלה表示向高处上行。汉语“上”不必明确区分英语的come up与go up，因而保留了希伯来语本身未明说的指示方向。
- source_word: בַבֹּקֶר
  choice: 到了早晨
  rationale: ב介词短语说明登山的时间；“到了早晨”自然呈现先预备、后登山的次序。
- source_word: אֶל הַר סִינַי
  choice: 上西奈山
  rationale: 结合汉语中“上山”的自然搭配表达目的地，并按通行译名处理西奈。
- source_word: וְנִצַּבְתָּ לִי
  choice: 站在我面前
  rationale: נצב的Nifal词形表示站立、站定；לִי直译为“向我／为我”，在此语境中自然表示来到上帝面前站立。
- source_word: שָׁם עַל רֹאשׁ הָהָר
  choice: 在山顶那里
  rationale: רֹאשׁ用于地貌时指顶部或峰顶；“在那里”所指的地点由“山顶”明确限定。
theological_decisions:
- issue: עלה的说话者方向
  choice: 上
  alternative: 上到我这里来／登上
  rationale: 原词说明向上移动，却不在词形上强制表达“来”或“去”。汉语“上”既自然，又避免把上帝所在位置的指示视角过度明说。
- issue: נצב לִי所表达的临在关系
  choice: 站在我面前
  alternative: 在那里为我站立／在那里向我报到
  rationale: “站在我面前”保留实际站立的含义，也表达摩西奉召来到上帝面前；不用“侍立”，以免额外加入臣仆礼仪色彩。
translation_notes:
  register: 采用现代、庄重而易懂的命令语气。“在早晨以前……到了早晨”刻意区分两个不同的希伯来语介词短语；“上”简洁保留עלה在指示方向上的开放性。
