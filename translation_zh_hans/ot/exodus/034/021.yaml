base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: zh_hans
  text: 六日你要劳作，第七日却要歇工[a]；在耕地和收割的时候，你也要歇工。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“安息”。希伯来语动词的基本意思是停止、中止，也可引申为安息。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日
  rationale: 构造结构表示六天这一时段；“六日”简洁庄重，也与“第七日”形成清楚对应。
- source_word: תַּעֲבֹד
  choice: 你要劳作
  rationale: 此处未完成式用于盟约性的指示。“要”保留规定的语气；“劳作”比单说“作工”更符合现代普通话，也适合农业语境。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: 第七日却
  rationale: 连接词在语境中表达六日劳作与第七日停止之间的转折；“却”自然地传达这一对比。
- source_word: תִּשְׁבֹּת
  choice: 你要歇工
  rationale: שׁבת的核心义是停止、中止，并可引申为安息。“歇工”在中文中明确表达停止劳作，同时不把重点缩减为身体上的休息。
- source_word: בֶּחָרִישׁ
  choice: 在耕种……的时候
  rationale: חָרִישׁ可指耕作或耕作时节；此译保留时间含义，并采用现代中文自然表达。
- source_word: וּבַקָּצִיר
  choice: 和收割的时候
  rationale: קָצִיר可指收割或收割时节；与“耕种”并列，清楚呈现农忙时期的背景。
- source_word: תִּשְׁבֹּת（第二次）
  choice: 也要歇工
  rationale: 保留原文动词的重复；“也”显明即便在耕种和收割期间，第七日停止劳作的要求仍然适用。
theological_decisions:
- issue: 与安息日相关的动词שׁבת如何翻译
  choice: 两处均译为“歇工”
  alternative: 两处均译为“安息”
  rationale: 本节重点是第七日停止劳作，即使正值关键的农耕季节也不例外。“歇工”体现שׁבת的核心词义，又避免把经文只理解为身体或心理上的休息；脚注保留传统且可能的“安息”译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“六日／第七日”保持律法文本的简练节奏；“劳作／歇工”清楚呈现工作与停止工作的对照。脚注标记置于שׁבת第一次出现的对应译文之后，因为词义说明针对该动词，而非前面的“劳作”。
