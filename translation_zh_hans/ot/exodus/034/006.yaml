  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: zh_hans
  text: 雅威在他面前经过，宣告说：“雅威，雅威，是有怜悯、有恩典的上帝，不轻易发怒，并且有丰盛的慈爱和信实[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信实”或译“真实”。
    reason: 保留 אֱמֶת 在此处可表示可靠、忠诚，也可表示真实的词义空间。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣名字四字神名的普通话音译，不以“主”这一称号替代；重复两次则照原文保留其强调作用。
- source_word: וַיַּעֲבֹר עַל־פָּנָיו
  choice: 在他面前经过
  rationale: 按叙事语境表达雅威从摩西面前经过；既保留空间关系，也避免生硬直译为“在他的脸上经过”。
- source_word: וַיִּקְרָא
  choice: 宣告说
  rationale: 此处引出庄严的神圣自我宣示；“宣告说”比单纯的“呼叫”更符合语境，同时自然引出直接引语。
- source_word: אֵל
  choice: 上帝
  rationale: 在重复的神名之后作同位性描述，引出后续属性；“上帝”是庄重而为现代普通读者熟悉的称呼。
- source_word: רַחוּם
  choice: 有怜悯
  rationale: 表达深切的怜恤与同情；与“有恩典”并列，保留两个不同的希伯来词。
- source_word: חַנּוּן
  choice: 有恩典
  rationale: 突出施恩、赐予恩惠的品格，并与“怜悯”有所区分。
- source_word: אֶרֶךְ אַפַּיִם
  choice: 不轻易发怒
  rationale: 这是希伯来语“鼻孔长”的习语，意为不迅速动怒；采用自然且准确的现代汉语等值表达。
- source_word: רַב
  choice: 丰盛
  rationale: 与抽象名词连用时表示充盈、丰富；“丰盛”在汉语中能自然修饰“慈爱和信实”。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 该词兼具仁慈、眷爱和坚定忠诚的意味；“慈爱”简洁自然，并保留其关系性与持续性。
- source_word: אֱמֶת
  choice: 信实
  rationale: 在“慈爱和אֱמֶת”这一搭配中，主要表达可靠、可信和忠诚；“信实”最贴合此处对上帝品格的描述，同时以脚注保留“真实”这一词义可能。
theological_decisions:
- issue: 重复的神圣名字 יְהוָה 如何译出
  choice: 雅威，雅威
  alternative: 主上帝
  rationale: 原文两次重复同一个专名以加强语气；译文不将第二个名字改成称号，也不把后面的 אֵל 提前并入名字序列。
- issue: חֶסֶד וֶאֱמֶת 中 אֱמֶת 的含义
  choice: 慈爱和信实
  alternative: 慈爱和真实
  rationale: 上下文是在宣示上帝可靠不变的品格，因此正文采用“信实”；但 אֱמֶת 也可表示“真实、真理”，故在脚注中保留这一真实的词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留原文宣告的节奏和神名重复；属性列表使用平行结构。“不轻易发怒”按汉语习惯传达希伯来习语，而不作字面硬译。
