base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: zh_hans
  text: 凡头生的，都是我的[a]；你牲畜中头生的公畜[c]，即头生的牛或羊，也都归我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“凡开母胎的。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“也都是我的。”
    reason: lexical_alternative
  - marker: c
    text: 希伯来文的表达明确指牲畜中头生的雄性。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: 凡头生的
  rationale: 该短语直译为“凡开母胎的”，是指第一胎所生的。“凡头生的”用现代汉语自然表达其惯用含义，并保留普遍范围。
- source_word: לִי
  choice: 都是我的／归我
  rationale: 介词短语表达上帝的所有权或权利主张。首句译为“都是我的”，承接到后句时译为“也都归我”，符合自然汉语。
- source_word: מִקְנְךָ
  choice: 你所有牲畜中
  rationale: מִקְנֶה 泛指归人所有的畜群；“牲畜”比单指牛类的词更准确，也适合下文的牛羊。
- source_word: תִּזָּכָר
  choice: 公畜
  rationale: 此处不是“被记念”，而是源于表示“雄性”的词根，在法律语境中限定所说的是头生的雄性牲畜。
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: 头生的……无论牛羊
  rationale: 该短语进一步说明牲畜的类别。“无论牛羊”自然传达牛群与羊群这两类代表性家畜。
theological_decisions:
- issue: 头生者属于耶和华的权利主张
  choice: 译为“都是我的／也都归我”，仅陈明经文所表达的归属关系
  alternative: 明确增译为“分别为圣归给我”或只限于可献祭的牲畜
  rationale: 希伯来文直接表达“属我”的法律—盟约性主张，却未在本节明说“分别为圣”或将范围解释为献祭资格；译文不加入这些延伸解释。
- issue: 第二分句省略谓语所造成的衔接
  choice: 补出“也都归我”
  alternative: 不补谓语，译成片段式的“你所有牲畜都要为公，牛羊中头生的”
  rationale: 第二分句在希伯来文中承接前句的 לִי。汉语补出谓语可清楚表达句法关系，同时用脚注提示其可译形式。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“头生的”是普通读者熟悉的圣经法律用语；“公畜”简明表达雄性牲畜。分号保留两分句的平行关系，第二句补出汉语所需的谓语，但不扩展经文的神学含义。
