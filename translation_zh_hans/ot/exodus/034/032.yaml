base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: zh_hans
  text: 此后，以色列众人[a]都上前来；摩西便把雅威在西奈山上同他说的一切话都吩咐给他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的众子”；这是指以色列民族的惯用称谓，也可译作“所有以色列人”。
    reason: 说明民族性称谓的字面形式及常用译法。
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: 此后
  rationale: 简洁自然地表达前一事件之后的时间次序。
- source_word: נִגְּשׁוּ
  choice: 上前来
  rationale: 表达נגשׁ的尼法勒词形所指的靠近、走上前，也贴合百姓先前因摩西面容发光而不敢接近的叙事背景。
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子孙
  rationale: 保留בְּנֵי所含的亲属和后裔意象，同时用现代汉语可理解的民族称谓表达整个以色列群体；脚注列明更形式对应的译法。
- source_word: וַיְצַוֵּם
  choice: 吩咐给他们
  rationale: צוה表示下达命令或嘱咐；“吩咐”既保留权威性，也适合摩西向百姓转达神命令的语境。
- source_word: אֵת כָּל אֲשֶׁר
  choice: 一切话
  rationale: 在汉语中补出“话”，自然地承接后面的“说”，并表达所传内容的完整范围。
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: 雅威同他说
  rationale: “同他说”较贴近אִתּוֹ的“与他”而非单纯“对他”，保留交谈意味；汉语语序已清楚表明这些话先于摩西的传达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，避免用称号替代原文专名。
- source_word: בְּהַר סִינָי
  choice: 在西奈山上
  rationale: 准确而自然地表达事件发生在西奈山上的地点。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接对应学界通常重构的读音Yahweh，而“耶和华”是汉语传统中更常见的形式。正文采用前者以保留专名性质。
- issue: בְּנֵי יִשְׂרָאֵל所指的群体
  choice: 以色列众子孙
  alternative: 所有以色列人／以色列众子
  rationale: 这是民族性的集体称谓，语境指前来听取命令的以色列群体；译文保留其血缘称谓色彩，但不把它解释为仅限成年男性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“此后”“上前来”“吩咐”等词清楚易懂；明确补出主语“摩西”，避免汉语孤立诵读时代词所指含混。
