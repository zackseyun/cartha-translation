base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: zh_hans
  text: 于是，摩西凿出两块石版，和先前的一样[a]。清早，摩西起来，上西奈山，正如雅威吩咐他的；他把那两块石版拿在手中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凿出”也可译作“雕凿成”。
    reason: 保留פסל在石材加工语境中的词义幅度。
  - marker: b
    text: 原文直译为“在他的手里”；这里的单数可作习惯表达，不一定强调只用一只手。
    reason: 说明希伯来语单数形式及其可能的习惯用法，避免把实际持版方式说死。
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: 凿出
  rationale: 此处指把石料凿制成版；“凿出”具体、自然，也保留了加工石头的动作。
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: 两块石版
  rationale: “石版”是现代汉语中对盟约版自然且庄重的称呼；量词“块”符合石质物件。
- source_word: כָּרִאשֹׁנִים
  choice: 和先前的一样
  rationale: 表达这些石版与前一对石版相同，不把相似的具体范围过度限定。
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: 清早，摩西起来
  rationale: 该希伯来语结构表示一早起身行动；此译法自然保留时间强调。
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: 上西奈山
  rationale: 保留עלה所表达的向上移动，并符合现代汉语叙事习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其专名性质，而不以称号代替。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: 正如雅威吩咐他的
  rationale: “正如”清楚表达摩西的行动与先前命令相符；汉语无需用时态形式明说命令在先。
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: 他手里拿着
  rationale: 保留原文单数“手”的表达；现代汉语“手里”可作不明确左右手或手数的习惯说法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并避免以“主”这一称号替代；“耶和华”虽为传统译名，但较不贴近通常重构的读音。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。将原文连续的连接结构分为两句，以符合现代汉语节奏，同时保留动作顺序；神名统一译作“雅威”。
