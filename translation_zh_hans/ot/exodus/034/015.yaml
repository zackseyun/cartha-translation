  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: zh_hans
  text: 免得你与那地的居民立约；他们随从他们的神明行淫[a]，向他们的神明献祭；若其中有人邀请你[b]，你就吃他所献的祭物[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行淫”是原文用来描写随从神明、敬拜偶像时性不忠的意象；也可译作“像妓女一样随从他们的神明”。
    reason: lexical_alternative
  - marker: b
    text: 直译为“他呼唤／邀请你”；这里的单数可能是分配性的，意思是“其中有人邀请你”。
    reason: lexical_alternative
  - marker: c
    text: 直译为“你就从他的祭物中吃”，指吃与他所献祭物有关的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: 免得
  rationale: 引出所警告的可能后果，既简洁自然，也保留希伯来文的警戒语气。
- source_word: תִּכְרֹת בְּרִית
  choice: 立约
  rationale: 希伯来文直译为“割约”，现代汉语以“立约”自然、准确地表达这一固定习语。
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: 与那地的居民
  rationale: 该短语集合性地指住在那地的人；“居民”符合现代汉语书面表达。
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: 他们随从自己的神行淫
  rationale: 保留 זנה 所用的性不忠意象，不把偶像崇拜的强烈隐喻淡化为单纯的“随从”或“偏离”。
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: 向自己的神献祭
  rationale: 准确表达献祭敬拜的行为，措辞简洁自然。
- source_word: וְקָרָא לְךָ
  choice: 若其中有人邀请你
  rationale: 复数主语之后的单数动词很可能具有分配或不定意义；“其中有人”在汉语中清楚地个体化这一情形。“若”使警告中的条件关系自然显明。
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: 你就吃他所献的祭物
  rationale: 贴近“从他的祭物中吃”的原文，同时使现代汉语读者明白所吃的是与该人献祭有关的祭物，而不直接扩展为“祭宴”。
theological_decisions:
- issue: 以性不忠的意象描述偶像崇拜
  choice: 保留“随从自己的神行淫”这一明确隐喻
  alternative: 随从自己的神；对上帝不忠而随从自己的神
  rationale: 原文有意以行淫描写对盟约的不忠；保留这一张力和冲击力，避免把神学与文学含义扁平化。
- issue: 复数先行对象之后出现单数“他邀请你”
  choice: 译作“其中有人邀请你”
  alternative: 他邀请你；他们邀请你
  rationale: 单数很可能将情境分配到其中任何一个居民身上；此译法既保留个体化警告，也避免把原文改成复数。
- issue: 吃祭物所指的参与程度
  choice: 译作“吃他所献的祭物”，不进一步解释为参加祭宴
  alternative: 吃他的祭牲；吃他的祭宴
  rationale: 原文确实指向食用与异教献祭相关的食物，但没有明说宴席的具体形式，因此正文保持原有范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以分号呈现警告逐步发展的结构；保留“行淫”的强烈盟约不忠隐喻，并用脚注解释。所有代词依原文均为单数“你”。
