base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: zh_hans
  text: 因为我要从你面前赶走列国，扩张你的疆界；你每年三次[b]上去朝见雅威你的上帝[a]时，必没有人[c]贪图你的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“去见雅威你上帝的面”；这里是朝圣敬拜的用语，意为来到他面前。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“一年三次”。
    reason: lexical_alternative
  - marker: c
    text: “人”的希伯来语原词是阳性单数，在这里具有代表性；背景是以色列的男子上去守朝圣节期时，他们的土地不会被人觊觎。
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文有关朝圣节期的命令，说明以色列人可以放心遵守这命令的理由。
- source_word: אוֹרִישׁ גּוֹיִם מִפָּנֶיךָ
  choice: 我要从你面前赶走列国
  rationale: 使役形动词在此表示把列国逐出；“从你面前赶走”既保留希伯来语空间意象，也符合现代汉语。
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: 扩张你的疆界
  rationale: גְּבוּל可指边界或疆域；与“扩张”搭配时，“疆界”自然地表达领土范围扩大的应许。
- source_word: לֹא יַחְמֹד
  choice: 必没有人贪图
  rationale: חמד表示带有占有意图的欲望，与十诫中“贪恋”同根；“贪图”在此能自然表达觊觎土地之意。
- source_word: בַּעֲלֹתְךָ
  choice: 你……上去
  rationale: עלה在朝圣语境中指上到指定的敬拜地点；保留“上去”可呈现原文的朝圣用语。
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: 朝见
  rationale: 字面涉及“见……的面”，在敬拜和觐见语境中表示来到上帝面前；“朝见”简洁而庄重。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按原文将四字神名作为专名音译，不以“主”这一称号替代。
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: 每年三次
  rationale: 自然表达原文“一年之中三次”的频率，不改变次数或周期。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的四字神名；“雅威”较直接地呈现该专名，并避免以称号取代神名。
- issue: אִישׁ 的阳性单数形式与代表性含义
  choice: 没有人
  alternative: 没有一个男人
  rationale: 希伯来语形式为阳性单数，但在否定句中具有泛指作用。现代汉语“没有人”准确表达无人会觊觎土地；脚注同时说明原文形式及朝圣背景，避免把应许不必要地限于某一个男性。
- issue: לֵרָאוֹת אֶת־פְּנֵי 的敬拜含义
  choice: 朝见
  alternative: 看见……的面；显在……面前
  rationale: 保留这是来到上帝面前敬拜的朝圣表达，同时用脚注交代字面形式，不把其文本张力完全隐藏。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“列国”“疆界”“朝见”保留经文的国家、领土与敬拜语域；句子以分号划分应许的两部分，避免结构拖沓。
