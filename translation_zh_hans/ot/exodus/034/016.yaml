base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: zh_hans
  text: 你从他的女儿中娶一些给你的儿子为妻；她们的女儿随从她们的神而行淫[a]，也使你的儿子随从她们的神而行淫[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “行淫”也可译作“作娼妓”。这里以性方面的不忠比喻随从别神。
    reason: lexical_alternative
  - marker: b
    text: 原文的动词为使役式：她们使你的儿子也随从她们的神而行淫，即陷入偶像崇拜。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ מִבְּנֹתָיו לְבָנֶיךָ
  choice: 你又从他的女儿中给你的儿子娶妻
  rationale: 保留 מִן 的部分含义“从……中”，并以现代汉语婚配语境中的“给儿子娶妻”表达“取其女儿给儿子”的意思；“娶妻”虽包含语境性解释，却避免直译造成误解。
- source_word: וְזָנוּ
  choice: 行淫
  rationale: זנה 在这里以性方面的不忠比喻追随别神；“行淫”保留原文尖锐的隐喻，不将其淡化为一般性的“不忠”或直接改写为“拜偶像”。
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: 追随她们的神明
  rationale: אַחֲרֵי 表示跟随、追随；“神明”在现代汉语中自然地指异教诸神，并保留复数语境。
- source_word: וְהִזְנוּ אֶת־בָּנֶיךָ
  choice: 也使你的儿子……行淫
  rationale: הִזְנוּ 是 Hiphil 使役式，因此明确译出“使”，表明那些女儿会促使以色列人的儿子同样陷入敬拜别神的不忠。
theological_decisions:
- issue: 偶像崇拜语境中 זנה 的译法
  choice: 保留“行淫”的性不忠隐喻
  alternative: 译作“拜偶像”或“对上帝不忠”
  rationale: 原文有意用性不忠描绘在敬拜上的背约；保留隐喻可维持警告的力度，同时由脚注说明其比喻意义。
- issue: 婚配双方的性别指称
  choice: 译作“女儿”和“儿子”
  alternative: 概括为“子女”或“后代”
  rationale: 原文明确提到当地人的女儿与以色列人的儿子，婚配语境中的性别信息不宜中性化。
- issue: 第三人称单数与复数后缀
  choice: 保留“他的女儿”，随后译作“她们的神明”
  alternative: 统一改写为“他们的女儿”和“他们的神明”
  rationale: 希伯来文先以阳性单数后缀指向上一节作为集合概念的“那地的居民”，随后以阴性复数后缀回指这些女儿；译文保留这一指称转换。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“给你的儿子娶妻”符合普通读者熟悉的婚配表达；重复“追随她们的神明行淫”则有意保留希伯来原文的平行结构和强烈隐喻。
