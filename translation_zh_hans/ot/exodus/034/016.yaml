    rationale: “又”依赖上文，且“从……中给……娶妻”搭配较滞涩。改作“你从他的女儿中娶一些给你的儿子为妻”保留部分义及婚配安排。
  - severity: low
    issue: 脚注b将使役关系表述为“引诱”，略增添原文未明说的方式。
    rationale: Hiphil要求表达“使/导致”，但不必指定为引诱；可直接说明她们使儿子随从其神而行淫。
  revised_text: 你从他的女儿中娶一些给你的儿子为妻；她们的女儿随从她们的神而行淫[a]，也使你的儿子随从她们的神而行淫[b]。
