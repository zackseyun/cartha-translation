  text: וַ/יְכַ֣ל מֹשֶׁ֔ה מִ/דַּבֵּ֖ר אִתָּ֑/ם וַ/יִּתֵּ֥ן עַל פָּנָ֖י/ו מַסְוֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/033.yaml
  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: zh_hans
  text: 摩西和他们说完了话[a]，就把帕子蒙在脸上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摩西停止同他们说话以后”。
    reason: 词汇异译：וַיְכַל 可侧重动作完成，也可表达停止该动作。
lexical_decisions:
- source_word: וַיְכַל
  choice: 说完了
  rationale: 动词 כלה 的连续式在这里表示动作完成；与 מִדַּבֵּר 合译为“说完了话”，符合现代汉语习惯。
- source_word: מִדַּבֵּר
  choice: 说话
  rationale: 介词 מִן 加 דבר 的不定式与 כלה 连用，表示结束说话这一动作；汉语自然表达为“说完了话”。
- source_word: אִתָּם
  choice: 和他们
  rationale: אֵת 在此带代词后缀，最直接的含义是“和他们”；保留交互意味，不改写为“对他们”。
- source_word: וַיִּתֵּן
  choice: 蒙
  rationale: נתן 与 עַל 连用，本义为放置在……上；就帕子与脸的关系而言，“蒙”是自然且准确的现代汉语表达。
- source_word: עַל פָּנָיו
  choice: 在脸上
  rationale: 表示帕子覆盖于他的脸；与动词“蒙”搭配即可清楚表达覆盖关系。
- source_word: מַסְוֶה
  choice: 帕子
  rationale: 该名词在本段指遮脸之物；“帕子”既保留传统经文语感，又为普通现代读者所能理解。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重而简明的现代标准汉语。“和他们说完了话”紧贴希伯来文 אִתָּם 的“和他们”，脚注保留 וַיְכַל 可译作“停止”的可能；“把帕子蒙在脸上”以地道汉语表达 נתן על 的放置和覆盖关系。
