  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: zh_hans
  text: “你要把你土地所产的初熟果实中最先的一份带到耶和华你上帝的殿里。[a] 不可用它母亲的奶煮山羊羔。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “初熟果实中最先的一份”也可译作“上好的初熟果实”。
    reason: 原文 רֵאשִׁית בִּכּוּרֵי 首先指初熟产物中居首的一份；在此搭配中也可能带有上好、精选之意。
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: 初熟果实中最先收获的
  rationale: 保留“首先、起初”与“初熟果实”叠加的原文结构，不将 רֵאשִׁית 直接解释为品质意义上的“最好的”；同时采用现代汉语可理解的表达。
- source_word: אַדְמָתְךָ
  choice: 土地上
  rationale: 此处指长出农作物的耕地；“土地上”比宽泛的“国土”更贴合献初熟土产的语境。
- source_word: תָּבִיא
  choice: 你要……带到
  rationale: 未完成式在律法语境中表达命令；“你要”既保留规范性，也符合现代汉语。
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: 耶和华你上帝的殿中
  rationale: בֵּית 字面为“房屋、家”，在此指敬拜圣所；“殿”在汉语中庄重自然，又不必特指后来在耶路撒冷建造的圣殿。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的音译呈现神的专名，避免用称号取代原文专名。
- source_word: לֹא תְבַשֵּׁל
  choice: 不可……煮
  rationale: בשל 在此可具体表达“煮”；“不可”准确传达律法禁令。
- source_word: גְּדִי
  choice: 山羊羔
  rationale: 明确指幼小的山羊，避免单说“羔”可能产生的物种歧义。
- source_word: בַּחֲלֵב אִמּוֹ
  choice: 用山羊羔母亲的奶
  rationale: 自然呈现“在它母亲的奶中”的烹煮媒介与原文亲属关系；代词“它”置于句末作受词，使中文更顺畅。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，而非“主”这一称号；正文采用现代简体中文圣经传统中最通行、最易辨识的专名音译。“雅威”是较接近学界重构读音的另一译法。
- issue: רֵאשִׁית בִּכּוּרֵי 表示时间先后还是品质优劣
  choice: 初熟果实中最先收获的
  alternative: 上好的初熟果实
  rationale: רֵאשִׁית 的基本意义是“开始、首先的部分”，与 בִּכּוּרֵי 连用可能蕴含将首批、上好部分献上的观念；正文优先保留词汇表层意义，不把潜在的品质含义定为唯一解释。
translation_notes:
  register: 采用庄重而现代的律法语体。“你要……；不可……”清楚呈现正面命令与禁令。保留原文两个短句之间未加解释的并置关系，不推断禁止这种烹煮方式的具体礼仪或神学缘由。
