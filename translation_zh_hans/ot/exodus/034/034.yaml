  naturalness: “进去到雅威面前”在现代汉语中略显生硬；“进到雅威面前”更自然。将“与他说话”改为“与他交谈”较合本句庄重叙述体。
  terminology: “雅威”与任务所列神名决定一致；“以色列子孙”保留了 בְּנֵי יִשְׂרָאֵל 的形式和本段庄重语域。
