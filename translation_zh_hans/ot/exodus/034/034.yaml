base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: zh_hans
  text: 每逢摩西进到雅威面前与他交谈，他就揭下面纱，直到出来；出来后，他便把所吩咐他的事告诉以色列子孙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹא מֹשֶׁה
  choice: 每逢摩西进去
  rationale: בְּ 加不定式在本段语境中表示反复发生的情形；“每逢”自然传达惯常意义。连接词 וּ 可由汉语句序体现，无须机械译出。
- source_word: לִפְנֵי יְהוָה
  choice: 到雅威面前
  rationale: לִפְנֵי 表示“在……面前／进入……的临在”；结合“进去”，译作“到……面前”自然，并按所给神学决策将四字神名译为“雅威”。
- source_word: לְדַבֵּר אִתּוֹ
  choice: 与他[a]说话
  rationale: דבר 与 אֵת 连用可表达交谈关系，“与他”比单向的“对他说”更贴近原文，但代词所指在句法上可能有不同理解，故保留并加注。
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: 他就揭下面纱
  rationale: 未完成式在这里描述惯常动作；“揭下”适合可移除的脸部遮盖，并保持动作具体。
- source_word: עַד־צֵאתוֹ
  choice: 直到出来
  rationale: עַד 加不定式结构表示持续至离开的时刻；中文省略重复主语仍清楚指摩西。
- source_word: וְיָצָא וְדִבֶּר
  choice: 出来以后，他就……告诉
  rationale: 两个动词延续反复发生的动作次序；用“以后……就……”清楚表达先后关系。
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: 告诉以色列子孙
  rationale: 保留 בְּנֵי יִשְׂרָאֵל 的传统、形式对应表达“以色列子孙”，指整个圣约群体。
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: 把所领受的命令告诉
  rationale: Pual 被动形式表示摩西被吩咐的内容。汉语以“所领受的命令”自然表达该被动关系，并由“告诉”呈现其传达行为。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常重构的读音，也保留其作为专名的性质。
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列子孙
  alternative: 以色列人／以色列民
  rationale: “以色列子孙”保留原文“以色列之子”的形式，同时在现代中文圣经语体中可理解为整个群体，并不限定只有男性。
- issue: אִתּוֹ 中代词的指向
  choice: 正文保留“与他”，脚注说明歧义
  alternative: 明确译作“与雅威说话”或“向以色列人说话”
  rationale: 就紧邻句法而言，通常理解为摩西与雅威说话；但希伯来语代词本身不重复名词，且传统解释中存在另一种关联方式，因此不在正文中消除张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙述体。“每逢……就……”突出本节描述的是摩西反复遵行的惯例；分号保留进入、揭面纱、出来、传达命令的动作层次。
