  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: zh_hans
  text: 摩西却呼唤他们；亚伦和会众的所有首领都回到摩西那里，摩西就向他们说话。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: 呼唤他们
  rationale: קרא 配合 אֶל 表示向人呼叫、招呼其前来。“呼唤他们”既保留动作方向，也不像“召见”那样过度强调权威。
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: 回到他那里
  rationale: שׁוב 的基本义是“返回”。上下文表明亚伦和众首领先因惧怕而退避，此后再回到摩西那里。
- source_word: הַנְּשִׂיאִים
  choice: 首领
  rationale: נָשִׂיא 在五经中常指支派或群体的领袖。“首领”庄重自然，也避免“王子”所带来的世袭王族含义。
- source_word: בָּעֵדָה
  choice: 会众
  rationale: עֵדָה 指作为整体、聚集在一起的以色列群体。“会众”保留其群体和集会意味。
- source_word: וַיְדַבֵּר
  choice: 说话
  rationale: דבר 的 piel 形式是普通的“说、讲话”。原文没有交代话语内容，因此不补作“吩咐”或“宣告”。
- source_word: וַ
  choice: 却／都／就（按语境处理）
  rationale: 希伯来叙事中的连接词 וַ־ 随语境表达连续、推进或轻微转折。句首用“却”承接前节众人的惧怕并显出转折，后两处分别用“都”“就”形成自然汉语叙事。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“会众所有的首领”依照马所拉文本的通常句法理解；不增添原文未明说的讲话内容。句首“却”体现与上一节的轻微对比。
