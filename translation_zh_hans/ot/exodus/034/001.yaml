  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה פְּסָל לְ/ךָ֛ שְׁנֵֽי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וְ/כָתַבְתִּי֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֥ר שִׁבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：“你要为自己凿出[b]两块石版，和先前的一样。我要把先前那些石版上的话写在这两块版上；先前那些石版是你打碎的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统译法为“耶和华”，有些译本译作“主”。
    reason: divine_name
  - marker: b
    text: “凿出”也可译作“凿制”或“刻制”。这里指把石材制成石版，并非指在版上刻写文字。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的现代汉语音译，不以“主”这一称号替代原文中的专名。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是希伯来叙事中引出直接引语的常用动词，译作“说”自然准确。
- source_word: פְּסָל
  choice: 凿出
  rationale: 该命令指把石材凿制成版；“凿出”具体而自然，也不至于像“雕刻”那样容易被理解为在版面上刻写文字。
- source_word: לְךָ
  choice: 为自己
  rationale: 明确保留原文的第二人称与格成分，表明摩西要为当前使命预备石版，但不将其强化为原文未必要求的“亲自”。
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: 两块石版
  rationale: “石版”是简洁自然的现代汉语表达，同时准确交代数量、材质和物件。
- source_word: כָּרִאשֹׁנִים
  choice: 和先前的一样
  rationale: 保留比较意义，并用“先前”清楚指向此前的两块石版。
- source_word: וְכָתַבְתִּי
  choice: 我要……写
  rationale: 按上下文表达雅威随后将要做的事；“要”自然体现第一人称未完成式在此处的将来意义。
- source_word: עַל הַלֻּחֹת
  choice: 写在这两块版上
  rationale: עַל表示书写所在的表面；补出“这两块”使汉语指代清楚，并未增加新的所指。
- source_word: הַדְּבָרִים
  choice: 话
  rationale: 原词本义宽泛，可指“话语”或“事项”；这里译作“话”，不提前限定为“诫命”，从而保留原文措辞。
- source_word: אֲשֶׁר הָיוּ עַל הַלֻּחֹת הָרִאשֹׁנִים
  choice: 先前那些石版上的话
  rationale: 自然表达关系从句，清楚说明将重写的内容就是原先石版上的话。
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: 是你摔碎的
  rationale: שׁבר表示打破或使破碎；结合摩西摔下石版的叙事背景，“摔碎”比泛泛的“打破”更具体，同时仍符合原词语义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以色列上帝的专名。译作“雅威”以音译保留专名性质；不以“主”替代，也不采用源于较晚混合读音传统的“耶和华”。
- issue: הַדְּבָרִים 是否明确译作“诫命”
  choice: 话
  alternative: 诫命
  rationale: 上下文确实指约版上的盟约内容，但本节原词是含义较宽的 דְּבָרִים。译作“话”保留其词汇宽度，避免把上下文解释直接写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。直接引语保持简洁有力；用“石版”而不用较书面的“石板碑版”。分号用于连接重写内容与被摔碎的先前石版，使较长的希伯来关系结构在汉语中清晰可读。
