  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: zh_hans
  text: 为成千上万的人存留慈爱[a]，赦免罪孽、过犯和罪；但他绝不以有罪的为无罪[b]；他追究父辈的罪孽，使之临到儿女和儿女的儿女[c]，直到第三、第四代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“向千代存留慈爱”。希伯来文直译只是“为数千者”，很可能与后文“直到第三、第四代”形成对照。
    reason: alternative_reading
  - marker: b
    text: 或译“但他绝不免除罪责”，也可理解为“绝不让罪不受惩罚”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“儿子和儿子的儿子”；这里按世代后裔的广义译为“儿女和儿女的儿女”。
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: 存留
  rationale: 该分词有守护、保存并持续施行之意；“存留慈爱”自然庄重，也体现持续性。
- source_word: חֶסֶד
  choice: 慈爱
  rationale: 此词兼具深厚的爱与忠贞信实；“慈爱”是现代中文圣经语境中易懂而有分量的对应词。
- source_word: לָאֲלָפִים
  choice: 为千万人
  rationale: 希伯来文仅说“为成千上万者”，没有明说“代”；正文不补入“千代”，以保留原文的宽泛表达。
- source_word: נֹשֵׂא
  choice: 赦免
  rationale: 本义为承担、除去；与三类罪恶并用时，惯用义是赦免。
- source_word: עָוֺן
  choice: 罪孽
  rationale: 可涵盖邪恶行为及其罪责；“罪孽”保留其道德与司法分量。
- source_word: פֶשַׁע
  choice: 过犯
  rationale: 该词含违背、反叛之意；“过犯”既准确又适合三项并列。
- source_word: חַטָּאָה
  choice: 罪
  rationale: 直接而通行的译法，与“罪孽、过犯”共同保留原文的三重累积。
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: 但他绝不以有罪的为无罪
  rationale: 原文以同根形式加强否定，具有司法性的“宣告无罪/免除罪责”含义；中文补出隐含对象，使句意完整，同时不把它缩窄为单纯刑罚。
- source_word: פֹּקֵד
  choice: 追究
  rationale: 在审判语境中指察看并处理罪责；“追究”保留司法意味，又不像“惩罚”那样过度限定其结果。
- source_word: עֲוֺן אָבוֹת
  choice: 父辈的罪孽
  rationale: 原文为阳性复数“父亲们”；“父辈”既保留男性措辞，也自然表达世代关系。
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: 使其影响儿女和儿女的儿女
  rationale: עַל 表示罪孽临到后代；中文用“使其影响”表达其施及范围，并避免误读为后代必然承担父辈个人的道德行为。
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: 直到第三、第四代
  rationale: “代”虽为希伯来文省略成分，却由家族序列明确暗示；补出后符合自然中文。
theological_decisions:
- issue: 如何保留赦免与绝不宣告有罪者无罪之间的张力
  choice: 同时直陈“赦免”与“绝不以有罪的为无罪”
  alternative: 译作“赦免……却绝不让罪不受惩罚”
  rationale: 原文刻意并置怜悯与公义；司法性的表达比只说“不惩罚”更贴近 נקה，也不消解两者之间的张力。
- issue: 是否在“千万人”处明确补出“代”
  choice: 正文不补“代”
  alternative: 译作“直到千代”或“向千代人”
  rationale: 本节在 אֲלָפִים 后并无“代”；不从平行经文引入正文，可能的世代含义放入脚注。
- issue: 父辈罪孽临到后代的表达
  choice: 译作“追究父辈的罪孽，使其影响……直到第三、第四代”
  alternative: 译作“把父亲的罪归到儿女身上”或“惩罚儿女”
  rationale: פקד 的范围比“归罪”或“惩罚”更宽；该译法保留罪恶后果跨代延伸的严肃含义，而不额外断言后代因父辈行为自动负有同等个人罪责。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。“慈爱、罪孽、过犯”保留经文宣告的神学分量；句法尽量清楚，同时避免借平行经文或特定宗派教义消解原文在赦免、公义与跨代后果之间的张力。
