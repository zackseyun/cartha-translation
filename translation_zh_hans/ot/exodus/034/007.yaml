  source_fidelity: “为千万人”在现代汉语中容易按字面理解为“为一千万人”，未能恰当表达希伯来文仅称“千千/数千”的宽泛复数。另将 פֹּקֵד 译为“使其影响”把上帝主动追究父辈罪孽的表述弱化为非人格化的后果；宜保留“追究”及罪孽临及后代的句法张力。
  naturalness: 原文总体庄重流畅；“为成千上万的人存留慈爱”比“为千万人存留慈爱”更不易误解。“使之临到”在本节庄重的宣告语体中自然，并较准确地承接“追究”。
  terminology: “慈爱、罪孽、过犯、罪”以及“以有罪的为无罪”均合乎现代中文圣经语体，也能保留原文的司法和神学张力。保留“父辈”对应原文阳性“父亲们”，并以脚注说明“儿女”的广义世代含义。
