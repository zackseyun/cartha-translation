base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: zh_hans
  text: 不可把我祭牲的血和有酵之物一同献上；逾越节的祭牲[a]也不可留到早晨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“逾越节节期的祭牲”。希伯来语的表达十分紧凑。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט
  choice: 献上
  rationale: 该动词本义是“宰杀”，在本句祭祀语境中与“血”搭配；汉语直译“宰杀血”不自然，因此译作“把……血……献上”，既表达祭献行为，也保留“血”为明确宾语。
- source_word: עַל חָמֵץ
  choice: 和有酵之物一同
  rationale: 介词短语在此表示献祭时不可伴有酵物；“一同”自然传达这种关联，同时不限定具体仪式方式。
- source_word: דַּם זִבְחִי
  choice: 我祭牲的血
  rationale: 保留“血”以及第一人称所属关系；זֶבַח在此指献作祭物的牲畜，译为“祭牲”比泛称“祭物”更贴合宰杀语境。
- source_word: יָלִין
  choice: 留到早晨
  rationale: 该词表示过夜或留宿；与לַבֹּקֶר“到早晨”合译为“留到早晨”，简洁且避免重复表达。
- source_word: זֶבַח חַג הַפָּסַח
  choice: 逾越节的祭牲
  rationale: 希伯来语名词链结构紧凑，可理解为逾越节节期所献的祭牲；汉语如此表达自然，并保留祭牲与节期的关系。
- source_word: הַפָּסַח
  choice: 逾越节
  rationale: 采用现代汉语圣经及一般宗教语境中通行的名称，准确指称以色列的该节期。
theological_decisions:
- issue: 如何处理逾越节祭祀术语而不加入后期教义联想
  choice: 逾越节的祭牲
  alternative: 逾越节节期的祭牲
  rationale: 按本节摩西律法的直接语境表达节期祭牲，不引入后来的神学解释。
- issue: זֶבַח חַג הַפָּסַח这一紧凑名词链的关系
  choice: 逾越节的祭牲
  alternative: 逾越节节期的祭牲；逾越节筵席的祭牲
  rationale: 正文采用简明自然的关系表达；脚注说明较展开的可能译法，以保留原文结构的紧凑性与一定歧义。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“有酵之物”比单说“酵”更符合禁令所涉及的实体范围；分号呈现两个并列禁令。脚注标记置于全节末尾，对第二分句中的紧凑名词链作说明。
