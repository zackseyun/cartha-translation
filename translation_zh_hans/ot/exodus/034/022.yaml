base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: zh_hans
  text: 你要守七七节，即小麦收成的初熟之物节；又要在一年更替之际[a]守收藏节。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在年终”。希伯来语字面指一年循环、转折之时。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: 节
  rationale: 此词指以色列人按时守的宗教节期；在“七七节”和“收藏节”两个固定名称中译作“节”，自然、简洁，也符合现代中文圣经语域。
- source_word: שָׁבֻעֹת
  choice: 七七
  rationale: 原文意为“若干个七日周期／周”，是该节期的专名。采用中文惯称“七七节”，既保留其按七计算的名称，也避免换用较晚形成的“五旬节”称谓。
- source_word: תַּעֲשֶׂה לְךָ
  choice: 你要守
  rationale: 字面为“你要为自己举行／办理”。与“节”连用时，意思是遵守、举行该节期；“守”准确表达约的义务，也比逐字译法自然。לְךָ在中文中无需机械另译，语义已包含在对主体的命令中。
- source_word: בִּכּוּרֵי קְצִיר חִטִּים
  choice: 麦收初熟之物
  rationale: 保留“初熟之物”这一祭礼与农业用语，并将构造短语自然表达为小麦收成中最先成熟、收获的部分。原文没有明说“献上”，因此正文不增补该动作。
- source_word: הָאָסִיף
  choice: 收藏
  rationale: 指农产品收聚入库，也构成节期名称。中文“收藏节”是准确而通行的名称；这里的“收藏”取收聚庄稼之义，并非现代汉语中鉴赏藏品之义。
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: 在岁序更替之际
  rationale: תְּקוּפָה表示转回、循环或周期的交替。“岁序更替”保留一年运行至转换节点的意象，避免把它过度限定为某一历法的最后一天。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“七七节”“收藏节”作为节期专名处理；用“也就是”显明“麦收初熟之物”与七七节的同位说明关系。分号呈现两个并列节期命令。
