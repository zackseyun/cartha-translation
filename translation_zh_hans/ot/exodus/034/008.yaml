  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: zh_hans
  text: 摩西急忙向地俯身，敬拜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俯伏下拜”；希伯来语动词可指以俯伏表达敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 急忙
  rationale: 该动词表示迅速、赶紧采取行动；“急忙”自然地保留了摩西立即回应的叙事重点。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代汉语圣经传统中通行的人名译法。
- source_word: וַיִּקֹּד
  choice: 俯伏
  rationale: 该动词指低头或俯身；与“在地”连用，简洁表达向地俯身的身体动作，同时不把它与后面的敬拜动作完全合并。
- source_word: אַרְצָה
  choice: 在地
  rationale: 该词带方向意义，表示朝向地面；“俯伏在地”是自然、庄重的现代汉语表达。
- source_word: וַיִּשְׁתָּחוּ
  choice: 敬拜
  rationale: 该词可指俯伏，也可指以俯伏表达敬奉。在此语境中，摩西回应耶和华的自我启示；前一动词已说明身体俯下，因此译作“敬拜”既避免重复，也保留其敬虔含义。
theological_decisions:
- issue: 末一动词应译作单纯的身体动作，还是敬拜行为
  choice: 敬拜
  alternative: 俯伏下拜
  rationale: 语境显示摩西是在耶和华宣告自己的名和属性后作出敬畏的回应。希伯来语动词本身包含俯伏致敬的身体意象，但前一动词已经描述俯身向地，故正文译作“敬拜”，并以脚注保留“俯伏下拜”这一可能表达。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准普通话。“急忙”体现动作的即时性；“俯伏在地，敬拜”区分身体姿态与敬拜意义，同时用脚注保存原文末一动词的动作性语义。
