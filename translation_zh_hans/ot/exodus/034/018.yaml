source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: zh_hans
  text: “你要守无酵饼节[a]。在亚笔月[b]所定的时候，要照我所吩咐你的吃无酵饼七天；因为你是在亚笔月从埃及出来的[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无酵饼节”也可译作“无酵饼的节期”。希伯来语חַג可指节庆或节期，尤其指按规定举行的神圣庆典。
    reason: lexical_alternative
  - marker: b
    text: “亚笔”是与以色列人出埃及相关的早春月份。
    reason: cultural_note
  - marker: c
    text: “从埃及出来”也可译作“出了埃及”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: 无酵饼节
  rationale: חַג指规定举行的宗教节期，מַצּוֹת指无酵饼。译作正式节期名称“无酵饼节”，既贴近原词，也符合现代汉语表达。
- source_word: תִּשְׁמֹר
  choice: 你要守
  rationale: שׁמר在盟约和节期语境中有遵守、持守之意；“守”简洁地保留了遵行规定和举行节期的双重意味。
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: 吃无酵饼七天
  rationale: 保留原文七天的时长和吃无酵饼的明确命令；汉语将时长置于动宾结构之后，自然清楚。
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: 照我所吩咐你的
  rationale: 原文关系从句可关联遵守方式和规定时间；“照我所吩咐你的”保留这种概括性，不把所吩咐的具体内容限定得过窄。
- source_word: לְמוֹעֵד
  choice: 在……所定的日期
  rationale: מוֹעֵד表示指定或约定的时间；结合节期语境译作“所定的日期”，庄重而易懂。
- source_word: חֹדֶשׁ הָאָבִיב
  choice: 亚笔月
  rationale: 将אָבִיב按古代月份名称音译为“亚笔”，避免只译成“春月”而抹去其历法称谓，同时以脚注补充文化背景。
- source_word: כִּי
  choice: 因为
  rationale: 明确呈现命令与出埃及事件之间的理由关系。
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: 你……从埃及出来
  rationale: 直接反映יצא与介词מִן的“从……出来”结构，并保留第二人称单数形式。
theological_decisions:
- issue: 盟约节期名称的表达
  choice: 采用正式名称“无酵饼节”
  alternative: “无酵饼的节期”或“无酵节”
  rationale: 本节所说的是上帝规定、与出埃及相关的神圣节期。正式名称能保留其盟约和礼仪分量，又不加入后来的教派解释。
- issue: 第二人称单数所指
  choice: 保留“你”
  alternative: 扩译为“你们”或“以色列”
  rationale: 希伯来文全节使用阳性单数第二人称，可将以色列整体作为一个受命者来称呼。汉语“你”保留原文形式，不擅自明说其范围。
- issue: 出埃及事件与守节命令的关系
  choice: 以“因为”明确表达理由
  alternative: 用“原来”或较弱的说明连接
  rationale: כִּי在这里自然引出守节的历史依据；译文只保留原文所述因果关系，不进一步阐释其救赎论意义。
translation_notes:
  register: 采用现代、庄重而口语可懂的经文体。用“你要”表达命令，以“守”保留盟约语境中的传统力度；句序略作汉语化调整，使“亚笔月所定的日期”和“七天”各自修饰清楚。所有脚注标记均置于相应词句之后。
