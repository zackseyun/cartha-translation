base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: zh_hans
  text: 谁也不可[a]和你一同上去；而且整座山上都不可有任何人出现[b]；连羊群和牛群也不可在那座山前吃草。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文“人”在语法上是阳性单数，但这里泛指任何人。
    reason: lexical_alternative
  - marker: b
    text: “出现”也可译作“被看见”；原文动词的这一形式可有这两种含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: 谁／任何人
  rationale: 该词在语法上为阳性单数，但此处泛指任何一个人。译作“谁／任何人”符合现代汉语禁令的自然表达，也不把禁令限于男性。
- source_word: יַעֲלֶה עִמָּךְ
  choice: 和你一同上去
  rationale: עלה表示向上行、登上；上下文所指是登山。“和你一同上去”既保留方向，也符合现代汉语。
- source_word: וְגַם
  choice: 而且
  rationale: 该组合承接并加强前一项禁令；“而且”体现递进和强调作用。
- source_word: אַל יֵרָא
  choice: 不可有任何人出现
  rationale: ראה的Niphal形式可表示“被看见”或“出现”。正文采用自然的汉语“出现”，脚注保留“被看见”这一可能译法。
- source_word: בְּכָל הָהָר
  choice: 整座山上都
  rationale: 该短语涵盖全山范围；“整座山上都”清楚表达无一处例外。
- source_word: הַצֹּאן וְהַבָּקָר
  choice: 羊群和牛群
  rationale: 分别指小型家畜群与牛等大型牲畜群；在本语境中“羊群和牛群”简洁、具体且自然。
- source_word: אַל יִרְעוּ
  choice: 不可……吃草
  rationale: רעה以牲畜为主语时指放牧、吃草；“吃草”是普通读者容易理解的现代汉语。
- source_word: אֶל מוּל
  choice: 在……前
  rationale: 该复合介词表示在某物前面或对面；此处译作“在……前”保留空间关系，同时避免增添原文未明说的距离。
- source_word: הָהָר הַהוּא
  choice: 那座山
  rationale: 保留定冠词与指示词所表达的特指意义。
theological_decisions:
- issue: 禁令所涵盖的人群
  choice: 用“谁／任何人”表达泛指
  alternative: 译作“男人”
  rationale: אִישׁ虽为阳性名词，但在这条禁令中泛指任何人；现代汉语用“任何人”能准确传达其适用范围，不引入性别限制。
- issue: אַל יֵרָא的语态与含义
  choice: 正文译“出现”，脚注列“被看见”
  alternative: 正文译“被看见”
  rationale: Niphal形式本身允许“被看见”和“出现”两种理解；正文选择较自然的语境表达，脚注保留原文的真实歧义，不将其作神学化解释。
translation_notes:
  register: 采用现代、庄重而易懂的命令语体。“不可”连续标示三项禁令；“而且”和“连……也……”分别传达原文两个גם的递进、强调作用。标点将三项相关禁令清楚分开。
