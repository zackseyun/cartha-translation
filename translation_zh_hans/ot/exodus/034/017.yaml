  yaml_path: translation/ot/exodus/034/017.yaml
  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: zh_hans
  text: 不可为自己铸造神像。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可为自己制造铸成的神。”原文为复数；“神像”在此指被当作神的铸造偶像。
    reason: 保留 אֱלֹהֵי מַסֵּכָה 的较直译表达及其复数形式，并澄清主文“神像”的偶像含义。
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: 神像
  rationale: 该词为“神”的复数附属形式，与后面的 מַסֵּכָה 构成一个词组；在禁止偶像制造的语境中，译作“神像”既指明所造之物是被当作神的像，又符合现代汉语表达。
- source_word: מַסֵּכָה
  choice: 铸造
  rationale: 该名词指以熔化金属浇铸而成之物。汉语用“铸造”修饰“神像”，可自然保留其制作工艺和金属铸像的含义，而不局限于较含混的“雕像”。
- source_word: לֹא תַעֲשֶׂה
  choice: 不可……铸造
  rationale: 否定词与第二人称阳性单数未完成式在律法语境中表达禁令；“不可”简洁、庄重，并准确传达命令语气。
- source_word: לָּךְ
  choice: 为自己
  rationale: 介词加第二人称单数后缀在此表示为自身而作；“为自己”保留原文的个人指向。
theological_decisions:
- issue: 所禁止制造之物的性质
  choice: 译为“铸造神像”，指以铸造方式制成、被视为神的偶像。
  alternative: “铸造的神”或“熔铸的神像”
  rationale: 原文将复数“神”与表示铸造物的名词结合。“铸造神像”在现代汉语中能同时保留偶像所代表的神祇含义和金属浇铸的制作含义，又不暗示人能制造真实的神。
translation_notes:
  register: 采用简洁庄重的现代标准汉语。“不可”符合律法禁令的语体；“铸造神像”比“铸造的神”更自然，也比单说“偶像”更充分保留原文的材料与制作工艺信息。
