  terminology: “主”“在你眼前蒙恩”“硬着颈项的百姓”“罪孽和罪”均恰当且庄重。“收我们作你的产业”比“以我们为你的产业”更直接体现原文动词对“我们”的动作，并保留盟约归属的意象。
