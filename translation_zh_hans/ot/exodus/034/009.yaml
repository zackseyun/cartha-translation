  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: zh_hans
  text: 他说：“主啊，我若在你眼前蒙恩，求主在我们中间行走[a]；虽然[b]我们是硬着颈项的百姓，求你赦免我们的罪孽和罪，并收我们作你的产业[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在我们中间行”或“与我们同行”。希伯来文直译为“在我们中间行走”。
    reason: lexical_alternative
  - marker: b
    text: “虽然”也可译作“因为”；希伯来语连词在此可按上下文理解为让步或原因。
    reason: source_ambiguity
  - marker: c
    text: 也可译作“以我们为你的产业”或“使我们成为你的所有”。
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן / בְּעֵינֶיךָ
  choice: 在你眼前蒙恩
  rationale: 采用现代汉语中自然且庄重的固定表达，保留希伯来语“在你眼中找到恩惠”的关系性意象。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文使用的是称谓 אֲדֹנָי，而非神名 יהוה；译作“主”既适合作直接称呼，也不把神名擅自引入正文。
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: 求主在我们中间行
  rationale: “求”表达 נָא 的恳请语气；“在我们中间行”保留 בְּקִרְבֵּנוּ 的空间意象，并表达神在百姓中间同路而行的临在。
- source_word: עַם קְשֵׁה עֹרֶף
  choice: 硬着颈项的百姓
  rationale: 保留希伯来语形象鲜明的惯用比喻，而不只概括为“顽固的百姓”。
- source_word: עָוֹן / חַטָּאת
  choice: 罪孽和罪
  rationale: 分别翻译这两个并列而含义相近的词，保留原文的重复、区分及道德分量。
- source_word: וּנְחַלְתָּנוּ
  choice: 以我们为你的产业
  rationale: 表达神把以色列收为自己所属产业的盟约性含义，同时避免把该动词仅理解为土地继承。
theological_decisions:
- issue: 祷告中 אֲדֹנָי 的译法
  choice: 两处均译作“主”
  alternative: “我的主”；“主耶和华”
  rationale: 原文两处都是 אֲדֹנָי。统一译作“主”保留称谓，又避免加入原文没有明说的神名。
- issue: כִּי 在“硬着颈项的百姓”前的逻辑关系
  choice: 正文译作“虽然”并加注说明歧义
  alternative: “因为”
  rationale: 上下文可支持让步理解：尽管百姓顽梗，摩西仍求主同行并赦免；但 כִּי 本身也可表示原因，因此不在译文体系中抹去另一种读法。
- issue: וּנְחַלְתָּנוּ 所表达的归属关系
  choice: 以我们为你的产业
  alternative: 使我们成为你的产业；收我们作你的所有
  rationale: 译文保留神收取百姓为自己产业的盟约意象，不进一步界定其法律或土地分配层面的细微语义。
translation_notes:
  register: 采用现代、庄重、可朗读的标准普通话。保留“硬着颈项”和“产业”等出埃及记中的核心意象；以脚注说明动词、连词及产业表述的真实语义幅度。
