source:
  edition: WLC
  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: zh_hans
  text: 这是我和以色列子孙之间永远的记号[a]，因为六日之内，雅威造了天和地；到第七日，他就停工[b]，得了舒畅[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列人”。
    reason: lexical_alternative
  - marker: b
    text: 或译“停止了”；这个希伯来语动词的基本意思是停止、歇下。
    reason: lexical_alternative
  - marker: c
    text: 或译“喘了口气”或“恢复了精神”；希伯来文在这里使用了鲜明的拟人说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: 我和……之间
  rationale: 用现代汉语自然表达希伯来语关联介词所标明的双方关系。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留原文的家族性表达，同时也是现代中文圣经语体中容易理解的说法。
- source_word: אוֹת
  choice: 记号
  rationale: 这是盟约语境中的常用词，指向一项表明双方关系的持久标志。
- source_word: לְעֹלָם
  choice: 永远的
  rationale: 直接表达持续不止的时间含义，并在中文中自然修饰“记号”。
- source_word: כִּי
  choice: 因为
  rationale: 引出安息日作为记号的根据或解释。
- source_word: שֵׁשֶׁת יָמִים
  choice: 六日之内
  rationale: 表达创造行动发生于六日这一时间框架，语言简洁庄重。
- source_word: עָשָׂה
  choice: 造了
  rationale: 在天地为宾语的语境中，“造”准确表达上帝的创造行动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名的通行学术重构 Yahweh 音译，保留专名性质。
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天和地
  rationale: 这是中文中自然、完整表达受造秩序的两极说法；希伯来语“天”为复数形态，但中文无需机械标示复数。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: 到第七日
  rationale: 自然呈现叙事的时间推进，不额外加入转折意味。
- source_word: שָׁבַת
  choice: 停工
  rationale: 该动词的基本意义是停止；结合创造工作的语境译作“停工”，比单译“休息”更能避免暗示因疲劳而休息。
- source_word: וַיִּנָּפַשׁ
  choice: 得了舒畅
  rationale: 保留原文鲜明的拟人化安息语言，同时比“喘了口气”更庄重，也不消除原文的神学张力。
theological_decisions:
- issue: 用安息语言拟人化地描述上帝
  choice: 他就停工，得了舒畅
  alternative: 他就休息，恢复了精神；他就停止，喘了口气
  rationale: 原文刻意使用具有人体经验色彩的措辞。译文保留这一形象，不将其抽象化；同时以“停工”凸显停止创造之工，而不暗示上帝因软弱疲劳而必须休息。
- issue: בְּנֵי יִשְׂרָאֵל 的家族性表达
  choice: 以色列子孙
  alternative: 以色列人；以色列民
  rationale: “以色列子孙”保留原文阳性复数家族称谓及其群体代表意义；脚注提供更符合日常中文的替代说法。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”直接音译学界通常重构的 Yahweh，保留原文专名；“耶和华”虽为中文传统译名，却反映较晚形成的混合读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“六日之内”“到第七日”略带经文语体，但不古奥；“得了舒畅”保留原文形象及神学张力。所有脚注标记均置于相应词语之后。
