  text: וַ/יִּתֵּ֣ן אֶל מֹשֶׁ֗ה כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֤ר אִתּ/וֹ֙ בְּ/הַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָ/עֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּ/אֶצְבַּ֥ע אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: zh_hans
  text: 上帝在西奈山同摩西说完话后，就把两块见证版交给摩西；那是两块石版，是用上帝的指头写的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上帝的指头”是原文的具体表达，强调这些字直接出于上帝的书写。
    reason: 保留并说明原文的拟人意象与神圣施事含义。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 就把……交给
  rationale: 该叙事动词表示随后发生的动作；“就”自然体现先后关系，“交给”准确表达 נתן 在此处的给予动作。
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: 说完话后
  rationale: כְּ 加 כלה 的不定式结构表示动作完成之时；译作“说完话后”既自然，也保留时间关系。
- source_word: אִתּוֹ
  choice: 同摩西
  rationale: 代词在上下文中最自然地指摩西。中文明确说出“摩西”，避免连续使用代词造成指代含混。
- source_word: בְּהַר סִינַי
  choice: 在西奈山
  rationale: 地点介词 בְּ 在此表示事情发生于西奈山；“在西奈山”符合现代汉语表达。
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: 两块见证版
  rationale: לֻחֹת 指版片，עֵדוּת 基本义为“见证”；“见证版”保留其盟约语境中的专门含义，而不扩译为“约书”或“法版”。
- source_word: לֻחֹת אֶבֶן
  choice: 两块石版
  rationale: 该短语说明版的材质，并与前面的“两块见证版”形成同位说明；“石版”简洁自然。
- source_word: כְּתֻבִים
  choice: 写的
  rationale: כתב 的被动分词表示已经写在版上；“写的”保留朴素的词义，不额外强化为“镌刻”。
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: 用上帝的指头写的
  rationale: 介词 בְּ 表示工具或方式；直译“用上帝的指头”保留原文鲜明、具体的拟人表达及上帝直接书写的强调。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 此处 אֱלֹהִים 为单数意义，指以色列的上帝。“上帝”是现代标准普通话中清楚、庄重的译法。
theological_decisions:
- issue: 以拟人表达描述上帝亲自书写
  choice: 用上帝的指头写的
  alternative: 由上帝直接写成；借着上帝的能力写成
  rationale: 原文使用具体的“上帝的指头”，强调书写直接出于上帝。译文保留这一意象，不把它抽象化为“能力”，也不对其形态作超出文本的解释。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“见证版”保留五经中的盟约术语；分号使“两块石版”作为同位补充清楚可读。首句明确使用“上帝”作主语，避免本节单独阅读时“他”的指代不清。
