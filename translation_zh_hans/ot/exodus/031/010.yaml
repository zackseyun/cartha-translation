  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: zh_hans
  text: 以及精工织成的衣服[a]、给祭司亚伦的圣衣，以及给他儿子们担任祭司时穿的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “精工织成的衣服”所对应的希伯来语含义不确定，也可译作“供事奉用的衣服”“供职用的衣服”或“织成的衣服”；它可能侧重衣服的制作工艺，也可能侧重其在会幕服事中的用途。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: 精工织成的衣服
  rationale: 该词组中的 שְׂרָד 含义有争议；结合祭司衣服及相关制作语境，正文采用较可能强调精细织造工艺的译法，同时以脚注保留强调服事用途等可能解释。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 圣衣
  rationale: 直译为“神圣的衣服”；“圣衣”在现代中文中简洁、庄重，也准确表达这些衣服分别为圣的性质。
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: 给祭司亚伦的
  rationale: לְ 表示归属或指定用途；הַכֹּהֵן 是亚伦的同位称号，译为“祭司亚伦”自然清楚。
- source_word: בִּגְדֵי בָנָיו
  choice: 他儿子们……穿的衣服
  rationale: 保留第三人称单数后缀所指的亚伦，并用“儿子们”清楚表达其众子；结合后面的目的成分，以自然中文重组。
- source_word: לְכַהֵן
  choice: 供祭司职分时穿的
  rationale: כהן 的不定式表示担任或履行祭司职分。此译法既交代衣服的用途，也避免仅译作泛义的“服事”。
- source_word: וְאֵת / וְאֶת
  choice: 以及／和
  rationale: אֵת 是直接宾语标记，不单独翻译；וְ 用连接词体现承接上文的列举结构。
