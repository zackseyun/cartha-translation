base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/008.yaml
  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: zh_hans
  text: 桌子及其器具，纯净的灯台[a][b]及其一切器具，以及香坛[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“梅诺拉”。希伯来语所指的是圣所中的灯台；正文译出这个普通名词，没有采用音译。
    reason: lexical_alternative
  - marker: b
    text: “纯净”可能指礼仪上的洁净；在会幕语境中，也可能令人联想到相关记载所说灯台是用纯金制成的。
    reason: cultural_note
  - marker: c
    text: 也可译作“焚香的坛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 该词通常指“桌子”；本节没有重复更完整的名称，具体所指由会幕语境说明。
- source_word: כֵּלָיו
  choice: 其器具
  rationale: כְּלִי 可泛指器皿、用具或器物；“器具”在圣所陈设的语境中自然，也不把范围过度限定为容器。
- source_word: הַמְּנֹרָה
  choice: 灯台
  rationale: 该普通名词指承托灯盏的灯台；正文采用意译，不采用音译名称。
- source_word: הַטְּהֹרָה
  choice: 纯净的
  rationale: טָהוֹר 可表示洁净或纯净；“纯净”既保留圣所语境中的洁净含义，也不排除与相关经文所说纯金材质的呼应。
- source_word: כָּל כֵּלֶיהָ
  choice: 其一切器具
  rationale: “一切”保留 כָּל 所表达的完整范围；“器具”涵盖灯台所属的各种配件。
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香坛
  rationale: 这是希伯来语组合词，意为焚香所用的坛；“香坛”是简洁自然的现代汉语表达。
- source_word: וְאֶת
  choice: 及；以及
  rationale: אֵת 是直接宾语标记，无须单独译出；连接词 וְ 依照汉语列举习惯译为“及”和“以及”。
theological_decisions:
- issue: הַטְּהֹרָה 所表达的“纯净”性质
  choice: 正文保留“纯净的”，脚注说明其可能指礼仪上的洁净，并可能呼应纯金材质
  alternative: 直接译作“纯金的”或只译作“洁净的”
  rationale: 原文此处是“纯净／洁净”，并未明说“金”；直接增译“纯金”会消除原文可能兼具的礼仪与材质联想，而只用“洁净”又较难传达相关经文中的材质呼应。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留原文逐项列举的结构。用“及其”“以及”避免连续重复“和”造成拖沓；不补入本节未明说的“陈设饼”或“纯金”。脚注标记均放在其所说明的词语之后。
