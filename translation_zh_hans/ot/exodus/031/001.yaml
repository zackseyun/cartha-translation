  yaml_path: translation/ot/exodus/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为 יהוה（YHWH），传统中文译作“耶和华”；也常音译为“雅威”。
    reason: 说明神名的原文形式及另一常见译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词配合叙事性的 וַ־ 推进叙事，表示正式开口讲话；汉语“说”自然简洁，而上下文已足以体现事件的接续。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 יהוה；“耶和华”是现代中文圣经传统中最通行、最易识别的专名形式，并以脚注说明原文及另一常见拟音。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中标明讲话的对象；现代汉语自然表达为“对摩西”。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式是引出随后话语内容的固定公式。汉语无需重复译作“说着说”，以“说：”并用冒号引出下文，既自然又保留其功能。
theological_decisions:
- issue: 四字神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用以色列上帝的专名，而非“主”这一称号。正文采用中文读者最熟悉的专名“耶和华”，脚注交代希伯来文形式及“雅威”这一较接近学术重构读音的译法，避免把专名改成称号。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。希伯来文的叙事连接词不机械译出；לֵאמֹר 以汉语引语冒号体现。脚注标记紧随“摩西说”之后，以对应整句中的神名译法说明。
