source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: zh_hans
  text: “至于我，看哪[a]，我已经指派但支派的亚希撒抹的儿子亚何利亚伯与他一起做工；我也把智慧放在一切心里有智慧的人心中[b]，使他们能做我吩咐你的一切[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”是原文用来提请注意的词；“至于我”也保留了原文对“我”的强调。
    reason: 语言说明
  - marker: b
    text: 原文直译为“在一切心里有智慧之人的心中”；这里的“智慧”也包括制作会幕所需的才智和技能。
    reason: 文化与词义说明
  - marker: c
    text: 也可译作：“他们就要做我吩咐你的一切。”
    reason: 句法异译
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: 至于我，看哪
  rationale: 用“至于我”体现独立人称代词的强调作用，用“看哪”保留 הִנֵּה 提请注意的语气；虽属较庄重表达，现代读者仍可理解。
- source_word: נָתַתִּי אִתּוֹ
  choice: 我已经指派……与他一起做工
  rationale: נתן 的基本义是“给、放置”，但本处以人为宾语并置于比撒列身旁，表示委派协作；“与他一起”明确保留 אִתּוֹ。
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: 亚希撒抹的儿子亚何利亚伯
  rationale: 采用现代简体中文圣经语境中通行的人名音译，并按自然汉语次序表达父子关系。
- source_word: לְמַטֵּה דָן
  choice: 但支派
  rationale: מַטֶּה 在这里指以色列的支派；置于人名前作归属修饰，简洁自然。
- source_word: וּבְלֵב כָּל חֲכַם לֵב נָתַתִּי חָכְמָה
  choice: 我也把智慧放在一切心里有智慧的人心中
  rationale: 保留原文两次出现“心”以及“智慧”的词汇联系，呈现希伯来语把内在领悟与工艺才能都归于“心”的观念，同时以“放在……心中”再现 נתן 的具体意象。
- source_word: וְעָשׂוּ
  choice: 使他们能做
  rationale: 在上文赐予智慧的语境中，此句可自然理解为目的或结果；“使他们能”表达神所赐智慧使工作得以完成，但不把它窄化为单纯的未来陈述。
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: 我吩咐你的一切
  rationale: 直接表达原文的全称范围，并保留对摩西的第二人称单数称呼。
theological_decisions:
- issue: 工艺语境中 חֲכַם־לֵב 与 חָכְמָה 的译法
  choice: 心里有智慧的人／智慧
  alternative: 有技艺的人／技艺
  rationale: 上下文确实涉及会幕工艺，因此“技艺”在语境上成立；但保留“心”和“智慧”更能反映原文把实际工艺视为神所赐智慧的表达，也避免用现代分类割裂智慧与技能。
- issue: וְעָשׂוּ 与前句赐智慧之间的关系
  choice: 使他们能做
  alternative: 他们就要做
  rationale: 所赐智慧与随后工作的关系可理解为目的或结果；正文采用目的性表达，同时用脚注保留并列或未来语气的可能，不把原文句法张力消除。
- issue: 人的工艺活动与神所赐智慧的关系
  choice: 神把智慧放在人心中，使他们能完成所吩咐的工作
  alternative: 神只作任命，工匠凭自身技能完成工作
  rationale: 原文明确把 חָכְמָה 的赐予归于神，并把它与执行命令相连；译文保留这种神赐能力与人的实际行动并存的关系，不作超出经文的教义推演。
translation_notes:
  register: 整体采用庄重而可理解的现代标准普通话。“至于我，看哪”刻意保留原文标记鲜明的强调与提请注意语气；人名采用通行音译。“心里有智慧……心中”的重复略显希伯来语色彩，但为保留原文的核心意象与神学张力而有意保留，并由脚注解释。
