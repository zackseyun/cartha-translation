  naturalness: 原译整体自然庄重。“聪明”在现代汉语中可用，但也常偏指天资；“理解力”更贴近 תבונה 的领悟与辨识能力，并与“智慧、知识”区分得更清楚。
  terminology: “上帝的灵”可准确表达 רוּחַ אֱלֹהִים，且脚注适当保留该构造短语较宽的语义可能。以“技艺”译 מְלָאכָה 在本段会幕制作的语境中自然、准确；不必将其限定为行动性的“能做”。
