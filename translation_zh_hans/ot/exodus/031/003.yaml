base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: zh_hans
  text: 我已用上帝的灵[a]充满他，赐给他智慧、理解力、知识和各样的技艺。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“属神的灵”或“神圣的灵”。这个希伯来短语可以有较宽泛的理解，但本处很可能是指上帝自己的灵赐给人能力。
    reason: 保留 רוּחַ אֱלֹהִים 的另一种语义可能，同时说明正文选择的语境依据。
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: 我也……充满了
  rationale: 动词 מלא 意为“充满”。结合前文连续的神谕，以及完成式所表达的已成事实和当前结果，译作“充满了”自然；连接词 וָ 依语境译作“也”。
- source_word: אֹתוֹ
  choice: 他
  rationale: 直接宾语代词，指上文所说的比撒列。
- source_word: רוּחַ אֱלֹהִים
  choice: 上帝的灵
  rationale: 构造短语可指“上帝的灵”，也可能较宽泛地表示“属神的灵”。本处描述上帝亲自赐能力，使比撒列承担会幕圣工，正文采用“上帝的灵”，但不借大小写强行加入希伯来文没有标明的区分，并以脚注保留语义幅度。
- source_word: בְּחָכְמָה
  choice: 使他有智慧
  rationale: 介词 ב 可表示充满时所赋予的内容或能力。汉语用“使他有”引出并列的恩赐，比逐项重复“用”更自然。
- source_word: וּבִתְבוּנָה
  choice: 聪明
  rationale: תבונה 表示理解力、辨别力或洞察力；“聪明”在此指明辨和领悟的能力，并与“智慧、知识”构成简洁自然的并列。
- source_word: וּבְדַעַת
  choice: 知识
  rationale: דעת 的基本意义是“知识”，保留原文三项并列结构。
- source_word: וּבְכָל מְלָאכָה
  choice: 能做各样的工艺
  rationale: מלאכה 可指工作、劳作或技艺；在制造会幕器物的语境中，“工艺”最能体现技术性和制作性。将介词关系译成“能做”，清楚表达这些禀赋所带来的工作能力。
theological_decisions:
- issue: רוּחַ אֱלֹהִים 是指上帝自己的灵，还是较宽泛的“属神之灵”
  choice: 上帝的灵
  alternative: 属神的灵；神圣的灵
  rationale: 叙事主体是上帝，且这里说他直接装备比撒列从事会幕圣工，因此“上帝的灵”最符合近距离语境。与此同时，希伯来短语本身可有较宽泛理解，故用脚注保留该可能，不把后期神学术语的全部精确含义强加于本节。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“智慧、聪明、知识”保留原文三项排比；末句以“能做各样的工艺”自然呈现会幕建造语境中的技能。脚注标记已在“上帝的灵”后以[a]出现。
