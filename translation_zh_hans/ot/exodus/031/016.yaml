base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: zh_hans
  text: 以色列人[a]要谨守安息日，世世代代遵守安息日[b]，作为永远的约[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”原文直译为“以色列的众子”；也可译为“以色列子孙”。
    reason: lexical_alternative
  - marker: b
    text: “遵守安息日”原文直译为“行安息日”或“做安息日”，意思是遵守安息日。
    reason: lexical_alternative
  - marker: c
    text: “永远的约”也可译为“永久的约”或“永恒的约”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: 所以……要谨守
  rationale: שׁמר在此有遵守、谨守之意；结合上一节的语境，将连接词译为“所以”，自然表达结论和吩咐的语气。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面是“以色列的众子”，但作为群体称谓指以色列民；现代汉语用“以色列人”准确而自然。
- source_word: הַשַּׁבָּת
  choice: 安息日
  rationale: 这是שַׁבָּת在本段作为圣约记号和特定制度的标准译法。
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: 守安息日
  rationale: 字面为“行／做安息日”；汉语“守安息日”自然传达实行、遵守这一习语含义，并保留与前句近义复沓的修辞。
- source_word: לְדֹרֹתָם
  choice: 世世代代
  rationale: 表达在接续的各代中持续遵守，简洁且符合现代汉语圣经语体。
- source_word: בְּרִית עוֹלָם
  choice: 永远的约
  rationale: 保留בְּרִית的圣约含义及עוֹלָם所表达的长久、恒常效力，不额外界定其系统神学范围。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 原文采用阳性亲属表达，但在这里作为全体圣约群体的惯用称谓。正文译成自然的现代汉语“以色列人”，脚注保留字面形式。
- issue: בְּרִית עוֹלָם的持续时间
  choice: 永远的约
  alternative: 永久的约／长存的约
  rationale: “永远的约”直接保留原文的圣约性和延续性，同时不借译文预先解决该约与后续启示之间的神学关系。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“谨守／守”的重复对应原文שׁמר与עשה短语的近义复沓；“以此作为”明确末尾名词短语与守安息日之间的述谓关系。
