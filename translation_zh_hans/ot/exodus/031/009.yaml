  text: and the altar of burnt offering[a], with all its utensils, and the basin with its stand,
translation:
  language: zh_hans
  text: 燔祭坛及其一切器具，洗濯盆及其盆座[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “盆座”或译“底座”。
    reason: כַּנּוֹ 可指承托器物的座或底座；两种译法都符合此处语境。
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: 该结构指与燔祭有关的祭坛。“燔祭坛”是准确、简洁且为现代中文读者熟悉的表达。
- source_word: כָּל כֵּלָיו
  choice: 其一切器具
  rationale: כָּל 表示全部，כֵּלָיו 指祭坛配套使用的器皿或用具；“器具”既涵盖较广，也符合礼仪设施的语境。
- source_word: הַכִּיּוֹר
  choice: 洗濯盆
  rationale: 此词指会幕院中供洗濯使用的盆。“洗濯盆”比单说“盆”更清楚地表明用途，同时保持庄重。
- source_word: כַּנּוֹ
  choice: 其盆座
  rationale: כֵּן 在此指承托洗濯盆的结构，可理解为座或底座；“盆座”简练自然，并清楚表明与洗濯盆的所属关系。
- source_word: וְאֶת
  choice: 及
  rationale: 原文以 וְאֶת 连接清单中的各项；中文用“及”自然地保留并列关系，无须翻出直接宾语标记。
