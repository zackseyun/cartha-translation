  text: 又能雕琢石头以供镶嵌[a][b]，雕刻木材，并从事各样的工作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雕琢石头以便装嵌”，也可理解为“从事石料加工以供镶嵌”。
    reason: lexical_alternative
  - marker: b
    text: “石头”在原文中是通称；按会幕制作的语境，可能包括宝石。
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: 雕琢／雕刻
  rationale: 该词表示技艺性的加工或工艺；根据所加工的材料分别译为石头的“雕琢”和木材的“雕刻”，既具体自然，也保留两处重复结构的联系。
- source_word: אֶבֶן
  choice: 石头
  rationale: 原词是“石头”的通称，本节并未明确限定为宝石，因此正文保留宽泛含义；会幕语境下可能包括宝石，另以脚注说明。
- source_word: לְמַלֹּאת
  choice: 以供镶嵌
  rationale: 在工匠制作的语境中，指把加工后的石头嵌入底座或镶座；“以供镶嵌”比直译为“填满”更符合现代汉语和实际工艺，同时不限定具体安装方式。
- source_word: עֵץ
  choice: 木材
  rationale: 指作为制作材料的木头；“木材”在本处的工艺语境中自然准确。
- source_word: לַעֲשׂוֹת
  choice: 做
  rationale: 保留עשה的宽泛意义，不把范围收窄为仅指制造成品。
- source_word: בְּכָל מְלָאכָה
  choice: 各样的工艺
  rationale: מְלָאכָה可指工作、劳作或技艺性工作；上下文讲工匠的技能，因此译为“各样的工艺”，既体现范围广泛，也符合语境。
