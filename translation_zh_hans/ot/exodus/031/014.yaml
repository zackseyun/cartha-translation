source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: zh_hans
  text: 你们要谨守安息日，因为这日对你们是圣的。凡亵渎这日的，必要被处死；凡在这日做工的，那人必从自己的民中被剪除[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从自己的民中被剪除”是希伯来语的法律用语；本节没有具体说明这种惩罚如何施行。
    reason: 保留原文法律公式的开放性，避免把它限定为处决、逐出群体或上帝直接施行的审判。
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: 所以你们要谨守
  rationale: שׁמר在此为盟约与律法语境中的遵守、守护；“谨守”自然而庄重，并保留命令力度。句首 וּ承接上文，译为“所以”体现语篇联系。
- source_word: הַשַּׁבָּת
  choice: 安息日
  rationale: 这是שַׁבָּת在现代汉语圣经语境中的标准对应，也准确指称该日及其制度。
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: 这日对你们是圣的
  rationale: 保留לָכֶם的关系性含义“对你们”，并以“是圣的”表达其被分别为圣的性质。
- source_word: מְחַלְלֶיהָ
  choice: 凡亵渎这日的
  rationale: חלל的Piel形表示使圣物失去神圣地位、加以亵渎；分词译作泛指的“凡……的”，符合律法通则语气。
- source_word: מוֹת יוּמָת
  choice: 必要被处死
  rationale: 不定式绝对形与同根限定动词构成强调；“必要”保留确定和强调语气，“被处死”体现Hophal被动式及司法语境。
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: 凡在这日做工的
  rationale: 直译其泛指结构，不额外加入原文没有明说的“任何”；“做工”在现代汉语中清楚自然。
- source_word: וְנִכְרְתָה
  choice: 必……被剪除
  rationale: כרת的Niphal在盟约和律法公式中通常表示“被剪除”。保留这一意象，不擅自断定其具体执行方式。
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: 那人
  rationale: נֶפֶשׁ在此指负法律责任的个人；译为“人”避免引入灵魂与身体二分的含义。
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: 从自己的族人中
  rationale: 表达从其所属群体之中被剪除。希伯来语阴性后缀与阴性名词נֶפֶשׁ保持语法一致，并不限定当事人为女性；汉语用“自己的”自然涵盖性别。
theological_decisions:
- issue: וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ这一刑罚公式的具体含义
  choice: 保留“从自己的族人中被剪除”的原文意象，并加脚注说明本节未具体交代执行方式。
  alternative: 明确译作被逐出群体、被处决、绝后，或遭受上帝直接审判。
  rationale: 该公式具有明确而严厉的法律和盟约分量，但本节没有说明具体机制；不应由译文替文本消除这一开放性。
- issue: 法律语境中的נֶפֶשׁ
  choice: 译为“人”。
  alternative: 译为“灵魂”或“性命”。
  rationale: 此处所指是犯罪的个体，而不是对人之构成的神学论述；“人”准确且不附加原文未表达的人论立场。
- issue: מוֹת יוּמָת与“被剪除”的并列张力
  choice: 分别保留“必要被处死”和“必……被剪除”，不将两者解释为完全相同或不同的刑罚。
  alternative: 把后者直接解释为前述死刑，或明确区分为另一种刑罚。
  rationale: 原文将两种表述并列，却未在本节说明二者关系；译文应保留这种法律与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“谨守”“亵渎”“处死”“剪除”兼顾原文力度与汉语可读性；不用性别化代词，并将唯一脚注标记置于其所解释的刑罚公式之后。
