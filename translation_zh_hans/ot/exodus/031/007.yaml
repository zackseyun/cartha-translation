base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/007.yaml
  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: zh_hans
  text: 会幕、见证柜[a]、柜上的施恩座[b]，以及会幕的一切器具——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“见证之柜”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“赎罪盖”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是现代中文圣经语境中通行而简洁的名称，指上帝与以色列人相会的帐幕；比逐字译作“相会的帐幕”更自然。
- source_word: הָאָרֹן לָעֵדֻת
  choice: 见证柜
  rationale: 保留“柜”与“见证”的核心语义，并以简洁的中文表达二者的从属或用途关系；ל 所表达的关系也可理解为“存放见证版的柜”，故在脚注中保留该译法。
- source_word: הַכַּפֹּרֶת
  choice: 施恩座
  rationale: 采用中文圣经传统中辨识度较高的圣所用语，所指为柜上面的金盖；脚注列出更直接体现遮罪、赎罪含义的“赎罪盖”。
- source_word: אֲשֶׁר עָלָיו
  choice: 柜上的
  rationale: 将代词所指的柜明确说出，使现代中文简洁自然，并准确表达施恩座位于柜上。
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: 会幕的一切器具
  rationale: כְּלֵי 是涵盖各种器物和用具的广义词；“器具”既适合圣所语境，也不过度限定具体种类。
theological_decisions:
- issue: 圣所语境中 כַּפֹּרֶת 的译法
  choice: 施恩座
  alternative: 赎罪盖
  rationale: 该词既指柜上的实体盖子，也带有遮罪、赎罪的祭仪关联。“施恩座”延续熟悉的圣所称谓而不在正文中限定其神学解释；“赎罪盖”作为较透明的词义选择列入脚注。
- issue: לָעֵדֻת 所表达的关系
  choice: 见证柜
  alternative: 存放见证版的柜
  rationale: 希伯来语介词 ל 可表达关联或用途。正文采用简洁称谓，脚注保留目的性较强的理解，不擅自加入“约”这一原文此处未出现的词。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。本节是承接上文的器物清单，因此保留列举结构及句末破折号。“会幕”“施恩座”沿用较易辨识的圣经用语，同时通过脚注说明较直译的可能表达。
