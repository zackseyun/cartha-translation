source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: zh_hans
  text: 六日可以做工[a]，但第七日是安息日，是完全安息、归雅威为圣的日子。凡在安息日做工的，必被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“六日要做工。”原文为被动式，意为工作可在六日之内进行；未完成式在此可表达许可或规范。
    reason: 保留原文语态和语气的另一种理解，同时使说明符合自然现代汉语。
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: 可以做工
  rationale: Niphal未完成式是被动表达，直译近于“工可以被做”；现代汉语用“可以做工”更自然，并符合律法语境，也不把它过度处理成单纯将来时。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: 但第七日
  rationale: ו基本义可作“而、和”，此处六日与第七日形成鲜明对照，译作“但”自然地传达这一关系。
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 完全安息的安息日
  rationale: 保留שַׁבַּת的“安息日”名称，同时用“完全安息”表达שַׁבָּתוֹן的强化作用，即彻底停止劳作、安息。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 归雅威为圣的
  rationale: קֹדֶשׁ表明神圣性质，ל表示归属或奉献；“归雅威为圣”兼顾两者，且符合庄重的现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名较通行的音译“雅威”，保留经文中的专名，不以称号替代。
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: 凡……做工的
  rationale: כָּל加分词表示普遍适用的法律类别；“凡……的”在现代汉语法规语体中自然，并保留其全称效力。
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: 在安息日
  rationale: “安息日”本身已包含“日”，中文不必重复为“安息日那一天”，即可自然体现原文的יום。
- source_word: מוֹת יוּמָת
  choice: 必被处死
  rationale: 不定绝对式加Hophal未完成式强化刑罚的确定性，并具有被动、执行死刑的含义；“必被处死”比“必死”更准确。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神盟约专名的性质，而不以“主”等称号替换。
- issue: שַׁבַּת שַׁבָּתוֹן的强调程度
  choice: 完全安息的安息日
  alternative: 安息日，严肃安息之日
  rationale: 译文既保留“安息日”这一名称，也传达重叠词组所强调的完全停止与安息，不引入后期宗派性的解释。
- issue: 死刑措辞的法律性质
  choice: 必被处死
  alternative: 必定死
  rationale: Hophal词形表明被动处决，而不只是死亡结果；译文保留原文法律刑罚的明确性，同时不额外说明执行者或程序。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“做工”与“安息日”沿用普通读者熟悉的圣经用语；“归雅威为圣”保留奉献与神圣归属的意味。正文中的[a]与脚注标记一致。
