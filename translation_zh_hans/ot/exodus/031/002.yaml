base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/002.yaml
  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: zh_hans
  text: “看哪，我已经按名召了犹大支派中户珥的孙子、乌利的儿子比撒列。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“看哪，我已经指名召了比撒列。”希伯来语“按名召”可含特意选定某人的意思。
    reason: 保留 קָרָאתִי בְשֵׁם 在“按名呼召”与“指名选定”之间的词义幅度。
lexical_decisions:
- source_word: רְאֵה
  choice: 看哪
  rationale: 该祈使词在这里用于引起注意；“看哪”保留原文的直接性，也符合庄重而易懂的现代汉语圣经语体。
- source_word: קָרָאתִי בְשֵׁם
  choice: 我已经按名召了
  rationale: קרא 与 בְּשֵׁם 连用，既可直指“按名呼召”，也含特意选定、指名委派的意味；译文保留“召”的开放语义，不径自译成“任命”。
- source_word: בְּצַלְאֵל
  choice: 比撒列
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: 户珥的孙子、乌利的儿子
  rationale: 原文连续使用“儿子”构成谱系链。汉语若直译为“乌利的儿子、户珥的儿子”容易误解为两人同为其父；按关系自然表达为“户珥的孙子、乌利的儿子”，未改变谱系信息。
- source_word: לְמַטֵּה יְהוּדָה
  choice: 犹大支派中
  rationale: לְ 在此表示归属，מַטֶּה 指支派；“犹大支派中”自然表达比撒列的支派归属。
