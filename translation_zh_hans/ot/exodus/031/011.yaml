base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: zh_hans
  text: 以及膏油，以及为圣所用的芬芳的香[a]。他们要照我所吩咐你的一切去做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为圣所用的、用香料制成的香。”
    reason: 保留 קְטֹרֶת הַסַּמִּים 较为形式对应的译法，表明这香由芳香料制成。
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 该结构短语指用于膏抹的油。“膏油”是现代中文圣经语体中简洁自然的表达，没有增添原文此处未明说的“圣”。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 芬芳之香
  rationale: 该短语字面指由芳香料制成的香。“芬芳之香”既传达其香料成分与香气，也保留礼仪用香这一所指；较直译的表达列于脚注。
- source_word: לַקֹּדֶשׁ
  choice: 圣所用的
  rationale: 介词短语可表示地点关联或神圣用途。在会幕语境中，“圣所用的”自然地保留这两方面，不把意思过度限定为仅仅放置在某一空间。
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: 照我所吩咐你的一切
  rationale: 保留כְּכֹל的全面含义，并保留上帝对摩西的第二人称单数直接称呼。
- source_word: יַעֲשׂוּ
  choice: 他们要……制作这些物品
  rationale: 第三人称复数主语承接上文的工匠；中文补出“这些物品”，使其清楚统摄本节及前文所列之物，同时保持指令语气。
theological_decisions:
- issue: לַקֹּדֶשׁ所表达的是地点还是用途
  choice: 圣所用的
  alternative: 在圣所里的；作圣用的
  rationale: 原文可关联“圣所”或神圣用途。“圣所用的”在中文中兼顾空间背景和礼仪用途，避免将原文的开放性缩窄。
translation_notes:
  register: 采用现代、庄重而易懂的指令性语体。本节承接前文列举，因此以“以及”起句；句末补出“这些物品”，使中文指代清楚。脚注标记置于其实际说明的“芬芳之香”之后。
