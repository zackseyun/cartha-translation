lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名译出四字神名，同时不采用英文层面的“大写 LORD”替代形式。
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: 对……说
  rationale: 希伯来语以“说……说”引出后文；中文若机械重复“说……说”不自然，因此用常规引语导入句式表达其功能，并以冒号提示下文。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 准确表达说话所指向的对象，符合现代汉语习惯。
theological_decisions:
- issue: 四字神名的呈现
  choice: 耶和华
  alternative: 上主／雅威
  rationale: “耶和华”在简体中文圣经传统中辨识度高，并明确保留此处为神的专名；原文不要求在本节中增添有关读音或称号的解释。
translation_notes:
  register: 采用庄重、简洁、自然的现代标准汉语。保留叙事衔接和引出下一段神谕的功能，不生硬复制希伯来语的同源动词结构。
