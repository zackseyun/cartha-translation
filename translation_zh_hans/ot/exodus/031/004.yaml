  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַחְשֹׁב מַחֲשָׁבֹת
  choice: 构思巧妙的设计
  rationale: 希伯来语同根动词与名词连用，表达有技巧、有创意地筹划设计，而不只是一般的“思考”。结合工匠语境，“构思……设计”自然地保留了这一表达；“巧妙的”点明此处的工艺性。
- source_word: לַעֲשׂוֹת
  choice: 制作各样器物
  rationale: 该词基本义为“做、制造”。在金属工艺语境中，“制作”最为自然；补出“各样器物”使中文句意完整，但不限定具体器物种类。
- source_word: בַּזָּהָב וּבַכֶּסֶף
  choice: 用金、银
  rationale: 介词 ב 在材料列表中表示以某种材料进行制作，现代汉语用“用”比直译为“在……中”自然，并保持两种材料的并列。
- source_word: וּבַנְּחֹשֶׁת
  choice: 和铜
  rationale: נְחֹשֶׁת 可指铜或青铜。正文采用较宽泛的“铜”，以保留原词在合金成分与成品材料之间的词义范围，并在脚注说明另一常见译法。
