id: EXO.31.13
reference: Exodus 31:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: zh_hans
  text: 你要吩咐以色列人说：“你们务要守我的安息日[a]，因为这是我与你们之间世世代代的记号，使你们知道，我是使你们成圣的耶和华[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “务要”所对应的希伯来词可表示强烈强调，也可带“唯独”或“不过”的限定意味。原文“安息日”为复数，指历次安息日。
    reason: 保留 אַךְ 的真实语义幅度，并说明汉语未显式标出的复数形式。
  - marker: b
    text: “耶和华”对应希伯来文神名 יהוה（YHWH）；其确切古代读音不能完全确定，也常拟音为“雅威”。“使你们成圣”也可译作“使你们成为圣洁”或“把你们分别为圣”。
    reason: 说明神名的原文形式与译名传统，并保留 מקדשכם 的主要语义选择。
lexical_decisions:
- source_word: וְאַתָּה
  choice: 你要
  rationale: 主语代词前置，承接上文并突出摩西；现代汉语用“你要”自然保留话语转折和命令语气。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是指以色列全体的固定群体称谓；“以色列人”准确、自然，也避免把希伯来语亲属表达机械译为现代汉语中容易误解的“以色列的儿子们”。
- source_word: אַךְ
  choice: 务要
  rationale: 该词在此带有限定或强烈强调色彩；“务要”突出不可忽视的命令力度，同时不武断地只取“唯独”之义。
- source_word: שַׁבְּתֹתַי
  choice: 我的安息日
  rationale: 希伯来语为复数，指反复临到的安息日；汉语“安息日”作周期性制度名称时通常不以复数标示，且所属关系由“我的”保留。
- source_word: תִּשְׁמֹרוּ
  choice: 守
  rationale: שׁמר在诫命和约的语境中表示遵守、谨守；“守安息日”是自然且简洁的现代汉语搭配。
- source_word: אוֹת
  choice: 记号
  rationale: “记号”适合表达安息日在约的双方之间所具有的识别和见证功能。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 准确表达跨越连续世代的持续性，且符合现代汉语习惯。
- source_word: לָדַעַת
  choice: 使你们知道
  rationale: 保留 ל 不定式所表达的目的或结果关系，而不排除两者在语境中的交叠。
- source_word: מְקַדִּשְׁכֶם
  choice: 使你们成圣
  rationale: 使役分词表达耶和华使以色列分别为圣、成为圣洁；“使……成圣”保留其动作性和神学张力。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的神名音译“耶和华”，明确呈现专名而不以“主”这一称号替代。
theological_decisions:
- issue: 安息日是“记号”的关系与功能
  choice: 这是我与你们之间世世代代的记号，使你们知道
  alternative: 这是我与你们世世代代之间的记号，好让人知道
  rationale: 希伯来语第二人称复数继续指向以色列群体；译文保留“我与你们之间”以及“使你们知道”，不把认知主体泛化，也不将目的与结果过度切割。
- issue: מְקַדִּשְׁכֶם 的表达
  choice: 使你们成圣
  alternative: 使你们成为圣洁／把你们分别为圣
  rationale: “使你们成圣”既保留使役结构，也容纳道德圣洁和归属上分别为圣的语义范围，不在本节中偏向其中一面。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 原文使用神的专名；正文保留专名功能。脚注提示其对应希伯来文四字神名及另一常见拟音，避免把中文传统音译误当作原始发音。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“吩咐……说”保留希伯来命令及引语公式；“务要守”“世世代代”“使你们成圣”具有经文语体的凝练感，但普通读者仍易理解。所有脚注标记均置于正文相应位置。
