  text: the table[a], all its utensils, and the bread of the Presence—
translation:
  language: zh_hans
  text: 桌子、其一切器具和陈设饼[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“面前之饼”或“临在之饼”；传统称“陈设饼”。
    reason: 保留希伯来语“面前／临在”的字面意象，并说明通行传统译名，而不将语境性补足写入原文。
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: שֻׁלְחָן在此直接指会幕中的桌子；上下文已明确是在列举会幕器物，无须增添原文没有的限定语。
- source_word: כָּל כֵּלָיו
  choice: 桌子的一切器具
  rationale: כְּלִי可指器皿、用具或器物；“器具”既自然，又能概括与桌子配套的各样物件。重复“桌子”比单用“它”更清楚，也符合现代汉语列举物品时的表达习惯。
- source_word: לֶחֶם הַפָּנִים
  choice: 陈设饼
  rationale: 该词组字面意为“面前／临在之饼”，指恒常陈设在耶和华面前的饼。“陈设饼”是简体中文圣经语境中简洁而通行的名称；脚注保留原文的字面意象。
- source_word: אֶת ... אֶת ... וְאֵת
  choice: 不单独译出
  rationale: 这些宾格标记用于协调清单中的各项；汉语以语序、顿号和“以及”表达其句法功能。
theological_decisions:
- issue: לֶחֶם הַפָּנִים中“面／临在”的所指
  choice: 正文采用传统名称“陈设饼”，脚注说明字面含义
  alternative: 译作“摆在耶和华面前的饼”或“临在之饼”
  rationale: 原文没有在本短语内明说“耶和华”，但会幕语境表明其所指。正文不把隐含对象直接补入，以免将解释写进经文；脚注则保留希伯来语的字面意象和含义张力。
translation_notes:
  register: 采用现代、庄重而简洁的清单式表达。“以及”承接本节列举；末尾破折号保留该节在更大句子中尚未完结的形式。脚注标记紧跟实际涉及词语“陈设饼”，而不置于“桌子”之后。
