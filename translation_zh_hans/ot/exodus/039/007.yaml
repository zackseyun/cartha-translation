  text: וַ/יָּ֣שֶׂם אֹתָ֗/ם עַ֚ל כִּתְפֹ֣ת הָ/אֵפֹ֔ד אַבְנֵ֥י זִכָּר֖וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他把它们安在以弗得的肩带上，作为以色列子孙的纪念石[a][b]，正如雅威吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“记念石”或“使人记念的石头”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“以色列的儿子们”；这是指以色列民的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 他把……安在
  rationale: שׂוּם意为“放置、安放”。在制作祭司衣服的语境中，“安在”既自然，又能表达将宝石固定于肩带上的具体动作。
- source_word: אֹתָם
  choice: 它们
  rationale: 宾格代词回指上一节所述的两块红玛瑙，按原文保留代词。
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: 在以弗得的肩带上
  rationale: כָּתֵף本义为“肩”，在以弗得的结构描述中指肩部的带子或部件；“肩带”符合现代汉语服饰用语，也准确交代其位置。
- source_word: אַבְנֵי זִכָּרוֹן
  choice: 纪念石
  rationale: 该组合词直指用于纪念或使人记起的石头；“纪念石”简洁自然，并保留其功能含义。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 作为以色列众子的
  rationale: 保留בְּנֵי יִשְׂרָאֵל字面上的男性复数表达，同时以脚注说明这是指以色列民的惯用语。介词לִ在此结合上下文译入“作为……的纪念石”。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威吩咐摩西的那样
  rationale: כַּאֲשֶׁר表达行动与先前命令相符，“正如……那样”清楚保留比较与遵行关系；雅威是יהוה的音译。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按其较通行的学术拟音音译，保留专名性质，而不以称号替代。
- issue: בְּנֵי יִשְׂרָאֵל的性别与群体指称
  choice: 以色列众子
  alternative: 以色列人
  rationale: 正文保留原文“众子”的男性复数形式，不把它无声地中性化；脚注同时说明该固定表达在这里泛指以色列民。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“以弗得”为已通行的祭司服饰专名；“肩带”帮助普通读者理解衣服结构。脚注标记按[a][b]置于相关短语之后。
