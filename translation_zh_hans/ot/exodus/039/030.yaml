  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: zh_hans
  text: 他们用纯金做了金牌，就是圣冠；又在上面刻了字，如同刻印章一般：“归雅威为圣。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“圣洁归于雅威。”
    reason: 原文 קֹדֶשׁ 是名词，既可按奉献公式理解为“归雅威为圣”，也可较直接地译为抽象名词短语“圣洁归于雅威”。
lexical_decisions:
- source_word: צִיץ
  choice: 牌
  rationale: 在祭司服饰的语境中，此词指系在礼冠前方的金牌，而非通常意义的花朵；“牌”简明自然，并与下文的纯金材质相符。
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: 圣冠
  rationale: נֵזֶר 指分别为圣的冠冕或冠饰；译作“圣冠”，并以“就是”与“牌”构成同位说明，保留原文的两个名词意象。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 准确表达材质，也保留原文对纯净和品质的强调。
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: 在上面刻上文字
  rationale: 动词本义为“写”，但对象是金牌，且紧接着说明其制作方式如印章雕刻；“刻上文字”在现代汉语中自然地综合呈现这一语境。
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: 像雕刻印章一样
  rationale: 该短语说明文字的制作方式；此译法保留比较意味，也清楚传达精细镌刻的工艺。
- source_word: קֹדֶשׁ לַיהוָה
  choice: 归雅威为圣
  rationale: 保留铭文简短、庄重的奉献语气，并表达该物被分别出来归给雅威；原文名词“圣”也容许抽象名词式理解，故在脚注保留另一译法。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的常见现代汉语音译，以呈现原文使用的专名，而不以称号替代。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并明确保留其专名性质。
- issue: 铭文 קֹדֶשׁ לַיהוָה 的句法与含义
  choice: 归雅威为圣
  alternative: 圣洁归于雅威
  rationale: 原文 קֹדֶשׁ 可表达“圣、圣洁”或“圣物”的观念，而 לַיהוָה 表示归属或奉献。“归雅威为圣”自然呈现奉献意义；脚注保留抽象名词式理解，不消除原文的简约与歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那面牌，就是圣冠”保留原文同位结构；分号区分制作金牌与镌刻铭文两个动作。铭文措辞简洁，以符合礼仪器物上刻文的风格。
