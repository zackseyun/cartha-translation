base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: zh_hans
  text: 他制作了胸牌[a]，采用巧匠设计的精巧工艺，做法如同以弗得；材料是金、蓝色线、紫色线、朱红色线和捻成的细麻。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“胸饰”。这是大祭司穿戴在胸前、与以弗得相连的织物，并非金属护甲。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……制作
  rationale: 该叙事时态推进制作会幕器物的过程；现代汉语用简单过去叙述即可，无须机械译出句首连接词。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: 这是与以弗得相连、佩戴在大祭司胸前的专门织物。采用通行且易识别的礼仪用语“胸牌”，并以脚注说明它不是金属护甲。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 以巧匠的手艺
  rationale: 该短语强调有构思、有图样的精巧工艺，不只是一般性的制作；“巧匠的手艺”自然传达技艺与艺术设计两方面。
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: 做法与以弗得相同
  rationale: 比较的是胸牌与以弗得的工艺和制作方式；此译比逐字的“如以弗得的工作”更符合现代汉语。
- source_word: אֵפֹד
  choice: 以弗得
  rationale: 这是没有完全对应现代物件的祭司礼服专名，保留传统音译可维持其礼仪上的特指性。
- source_word: זָהָב
  choice: 金
  rationale: 原文直接列举材料；上下文说明金被加工后用于纺织，但本节本身仅写“金”，故不在正文中限定为“金线”。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 蓝色线、紫色线、朱红色线
  rationale: 这些词在会幕纺织语境中指相应颜色的染色纱线；补出“线”使现代汉语清楚表明所列的是织物材料。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻的细麻
  rationale: שֵׁשׁ 指细麻，מָשְׁזָר 表示经过捻合；“捻的细麻”保留制作细节而不过度解释其具体纺纱方式。
theological_decisions: []
