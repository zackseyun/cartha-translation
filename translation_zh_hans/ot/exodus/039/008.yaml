  register: 采用现代、庄重而清楚的叙事语体；保留“以弗得”这一礼仪专名，以“胸牌”承接中文圣经传统，同时借脚注避免读者误解为护甲。材料清单按现代汉语补出“线”，但“金”仍依原文保持较宽泛的表达。
