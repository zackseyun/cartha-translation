base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: zh_hans
  text: 供在圣所服事用的衣服[a]，祭司亚伦的圣衣，以及供他儿子们担任祭司时穿的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“精工织成的衣服”。此处希伯来语词的确切含义有争议；也可理解为专为圣所服事制作或使用的衣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: 精工织成的衣服
  rationale: בִּגְדֵי 表示衣服；הַשְּׂרָד 在会幕物品的语境中很可能指专门制作的纺织品或精细织物。“精工织成的衣服”既保留制作工艺的含义，也不把它与后文“圣衣”混同。
- source_word: לְשָׁרֵת
  choice: 供职用的
  rationale: שׁרת 在此指正式的圣所服事。“供职”简洁自然，并带有履行神圣职务的语气。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣所
  rationale: קֹדֶשׁ 在这里指会幕中神圣的服事范围，而非抽象的“圣洁”；“圣所”符合上下文。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 圣衣
  rationale: 直译为“神圣的衣服”。“圣衣”是简洁、庄重且易懂的现代汉语表达，可指分别为圣、供祭司使用的衣服。
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的
  rationale: 该短语说明衣服归亚伦使用，并以“祭司”标明其职分；按自然汉语语序译为“祭司亚伦的”。
- source_word: בִּגְדֵי בָנָיו
  choice: 他儿子们……所穿的衣服
  rationale: 忠实表达复数“儿子们”及衣服与他们的所属关系；补出“所穿”使汉语句意自然，但不增加新的实质信息。
- source_word: לְכַהֵן
  choice: 供祭司职分
  rationale: 这是由 כֹּהֵן“祭司”构成的动词，意为履行祭司职务。“供祭司职分”保留其职分性含义，避免仅笼统译作“服事”。
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד 与 בִּגְדֵי הַקֹּדֶשׁ 的关系
  choice: 将前者译为圣所供职用的“精工织成的衣服”，后者译为亚伦的“圣衣”，在措辞上保持区分。
  alternative: 把两者视为近义表达，将前者译作“供职的衣服”或“礼服”。
  rationale: 希伯来文重复使用 בִּגְדֵי，却以不同限定语修饰。译文保留这种区别，但不进一步断定两类衣服在具体用途或形制上有何差异。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“供职”“圣所”“圣衣”“祭司职分”符合礼仪语境，又避免引入后世宗派性的专门术语。经文作为清单中的一项，保留原文并列结构。
