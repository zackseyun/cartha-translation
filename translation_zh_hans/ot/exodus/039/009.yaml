  text: רָב֧וּעַ הָיָ֛ה כָּפ֖וּל עָשׂ֣וּ אֶת הַ/חֹ֑שֶׁן זֶ֧רֶת אָרְכּ֛/וֹ וְ/זֶ֥רֶת רָחְבּ֖/וֹ כָּפֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/009.yaml
  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: zh_hans
  text: 胸牌是正方形的；他们把它做成双层[a]，长一拃[b]，宽一拃，是双层的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“对折”。希伯来语כָּפוּל表示胸牌做成重叠的两层，也可能指将材料对折。
    reason: 保留该词在“双层”和具体“对折”方式之间的词义开放性。
  - marker: b
    text: “拃”是古代长度单位，约为手掌张开后拇指尖到小指尖的距离。
    reason: 说明现代读者可能不熟悉的古代度量单位。
lexical_decisions:
- source_word: רָבוּעַ
  choice: 正方形的
  rationale: 该词在这里描述四边等长的方形；“正方形”是现代汉语中准确、自然的表达。
- source_word: הָיָה
  choice: 是
  rationale: 此处作系词，静态描述胸牌的形状。
- source_word: כָּפוּל
  choice: 双层
  rationale: 该词表示材料重叠成两层，也可能具体指对折；正文用“双层”保留结构意义，不把制作方式限定为对折。
- source_word: עָשׂוּ
  choice: 他们把它做成
  rationale: 忠实表达普通动词“做、制作”，并按现代汉语语序以“它”回指胸牌。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: 在祭司服饰语境中指大祭司佩戴在胸前的器物；“胸牌”简明自然，也不额外加入本节没有的“决断”等限定语。
- source_word: זֶרֶת
  choice: 一拃
  rationale: 保留希伯来古代长度单位；“拃”指手掌张开后拇指尖至小指尖的距离，较直译为现代数值更透明。
- source_word: אָרְכּוֹ
  choice: 长
  rationale: 用现代汉语尺寸表达“长一拃”，自然对应“它的长度”。
- source_word: רָחְבּוֹ
  choice: 宽
  rationale: 用现代汉语尺寸表达“宽一拃”，自然对应“它的宽度”。
- source_word: כָּפוּל־
  choice: 是双层的
  rationale: 保留原文末尾对“双层”的重复强调，同时避免译成“在折叠后”而加入原文没有明确表达的时间或条件关系。
