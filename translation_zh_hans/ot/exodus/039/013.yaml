  text: 'and the fourth row: beryl[a], onyx, and jasper[b], mounted in settings of gold in their mountings.'
translation:
  language: zh_hans
  text: 第四行是水苍玉、缟玛瑙和碧玉[a]；这些宝石镶在金质镶座中，按各自的位置安置[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 胸牌上若干宝石的确切种类无法确定；这里的“水苍玉”“缟玛瑙”和“碧玉”采用通行的传统译名。
    reason: lexical_alternative
  - marker: b
    text: 或译：“镶在金质镶座中，安在各自的镶嵌处。”希伯来语末尾是工艺性较强的表述，可能指宝石嵌入为它们指定的槽座或位置的方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: 第四行是
  rationale: טוּר在胸牌宝石清单中指横向排列的一行；中文以“第四行是”自然引出所列宝石。
- source_word: תַּרְשִׁישׁ
  choice: 水苍玉
  rationale: 这种古代宝石的确切种类无法确定；“水苍玉”是对应绿柱石一类的通行传统译名，同时在脚注中保留不确定性。
- source_word: שֹׁהַם
  choice: 缟玛瑙
  rationale: 该词在祭司衣饰语境中通常理解为玛瑙类宝石；“缟玛瑙”简明对应传统的 onyx，但确切矿物种类仍不确定。
- source_word: וְיָשְׁפֵה
  choice: 和碧玉
  rationale: “碧玉”是 יָשְׁפֵה 的通行对应词，并明确译出连接词。
- source_word: מֽוּסַבֹּת
  choice: 嵌在
  rationale: 被动形式表示宝石被围住、固定或镶嵌；“嵌在”符合现代中文珠宝工艺用语。
- source_word: מִשְׁבְּצֹת זָהָב
  choice: 金槽里
  rationale: מִשְׁבְּצֹת 指固定宝石的金质槽座或镶框；“金槽”简洁保留其工艺含义。
- source_word: בְּמִלֻּאֹתָם
  choice: 安在各自的镶座中
  rationale: 这是含义略有争议的工艺术语，可能指宝石被装入为其预备的固定位置；此译法保留与前句相近而不完全相同的技术含义。
