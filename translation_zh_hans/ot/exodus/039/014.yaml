base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: zh_hans
  text: 这些宝石是按以色列的众子[c]的名字[a]而定的，共十二块，按他们的名字，如刻制印章一般雕刻；每块都刻着相应的名字，为十二个支派所用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“刻着以色列众子的名字”。这里的希伯来语介词可以表示紧密关联或对应。
    reason: lexical_alternative
  - marker: c
    text: “以色列的众子”是指以色列（雅各）的后裔，是一个传统的盟约称谓。
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: 这些宝石
  rationale: 名词本义为“石头”，但在胸牌的具体语境中指镶嵌的贵重宝石；“这些宝石”在现代汉语中明确而自然。
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: 与以色列众子的名字相对应
  rationale: 介词 עַל 在这里表达关联或对应，而非单纯的空间位置；译文保留这种关系，同时在脚注中注明“刻着名字”的可能理解。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 贴近希伯来语的传统盟约称谓，又比逐字的“以色列的儿子们”更符合庄重的现代汉语。
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: 共有十二块
  rationale: 原文代词加数词强调宝石的总数；补出量词“块”使汉语自然，并未增添实质内容。
- source_word: עַל שְׁמֹתָם
  choice: 按着他们的名字
  rationale: 保留原文前后重复的对应结构；“他们”指前面的以色列众子。
- source_word: פִּתּוּחֵי חֹתָם
  choice: 像印章一样雕刻
  rationale: 该短语说明雕刻采用印章刻文的方式；此译法保留比喻形象，也符合现代汉语表达。
- source_word: אִישׁ עַל שְׁמוֹ
  choice: 每块各有一个名字
  rationale: אִישׁ 在此作分配用语，意为“各自、每一”；结合宝石语境补出“每块”，清楚表达每块宝石对应一个名字。
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: 代表十二个支派
  rationale: לְ 表示关系或用途；宝石上的十二个名字对应并代表十二支派。“代表”在汉语中简洁呈现这一关系。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列众子
  alternative: 以色列人
  rationale: 保留原文以祖先以色列为中心的亲属与盟约称谓，不把它简化为一般族群名称；脚注解释其群体性含义，避免读者误解为只强调个别男性。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“相对应”保留介词关系的开放性，以“共有十二块”和“每块各有一个名字”使省略较多的希伯来语结构在汉语中清晰；脚注保存可译作“刻着名字”的词义可能。
