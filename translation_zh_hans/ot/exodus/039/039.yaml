translation:
  language: zh_hans
  text: 铜祭坛和坛用的铜网、坛的杠和一切器具，以及洗濯盆和盆座；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: 铜祭坛
  rationale: מִזְבַּח意为“祭坛”，נְחֹשֶׁת在会幕器物语境中惯常译作“铜”；原文此处没有重复“燔祭坛”的完整名称，故不增补。
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: 铜网架
  rationale: מִכְבָּר指与祭坛配套的网格状构件；“网架”既体现其网格形态，也自然表明它是实体构件。
- source_word: אֲשֶׁר לוֹ
  choice: 坛上所用的
  rationale: 该关系短语说明铜网架与祭坛的所属或配套关系；此译保持关联而不具体断定其精确安装位置。
- source_word: בַּדָּיו
  choice: 坛的杠
  rationale: בַּדִּים是搬运圣所器具所用的长杠；补出“坛的”使中文指代清楚。
- source_word: כָּל־כֵּלָיו
  choice: 一切器具
  rationale: כֵּלִים泛指配套物件或用具；“器具”庄重、清楚，并适合祭坛语境。
- source_word: הַכִּיֹּר
  choice: 洗濯盆
  rationale: כִּיּוֹר指供祭司洗濯用的盆；“洗濯盆”比单说“盆”更明确，也比传统的“洗濯盘”更符合现代汉语对其形制的表达。
- source_word: כַּנּוֹ
  choice: 盆座
  rationale: כֵּן在此指支承洗濯盆的底座或座架；“盆座”简洁自然，且不超出原文。
