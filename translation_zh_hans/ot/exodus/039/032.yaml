  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: zh_hans
  text: 这样，会幕，即会面的帐幕，一切工程都完成了。以色列人照耶和华[a]吩咐摩西的一切去做；他们就是这样做的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是希伯来文神名YHWH的传统中文译法；也可译作“雅威”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: 都完成了
  rationale: 此处动词כלה表示整个建造工程告成；用“完成了”自然准确，并把焦点保留在工程本身。
- source_word: כָּל עֲבֹדַת
  choice: 一切工程
  rationale: “一切”保留כָּל的完整、全面之意；在制作会幕的语境中，“工程”比“服事”更明确。
- source_word: מִשְׁכַּן
  choice: 会幕
  rationale: “会幕”是现代中文圣经语境中对以色列移动圣所的通行称呼，兼顾可懂度和传统辨识度。
- source_word: אֹהֶל מוֹעֵד
  choice: 会面之帐
  rationale: 该名称指指定的相会场所；“会面之帐”比把它与“会幕”完全合并更能呈现原文的两个相连称谓。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该民族性集合称谓最自然的表达，所指包括整个以色列群体；直译“以色列的儿子们”在中文中容易误解为雅各的亲生儿子。
- source_word: כְּכֹל אֲשֶׁר
  choice: 照……的一切
  rationale: 表达以色列人的行动与所领受命令完全一致，保留原文的全面性。
- source_word: צִוָּה
  choice: 所吩咐
  rationale: “吩咐”适合上帝向摩西颁布命令的语境；“所”字结构也自然表明命令先于执行。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者最熟悉的专名形式，同时以脚注说明这是希伯来文神名YHWH及另一常见音译。
- source_word: כֵּן עָשׂוּ
  choice: 他们正是这样做的
  rationale: 保留原文末尾对“做”的重复，以强调他们确实完全遵行，而不为行文简洁将其删去。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名YHWH。正文采用中文圣经传统中辨识度最高的“耶和华”，脚注保留“雅威”这一更接近学界重构读音的译法，不以“主”这一称号代替专名。
- issue: בְּנֵי יִשְׂרָאֵל的群体所指
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该固定表达在此指作为整体的以色列群体，而非仅指男性或雅各的亲生儿子；“以色列人”在现代中文中准确且不生硬。
- issue: 末尾重复כֵּן עָשׂוּ
  choice: 保留为“他们正是这样做的”
  alternative: 省略重复，仅译作“都照着做了”
  rationale: 重复强化完全顺服这一叙事重点；保留它可避免削弱原文语势，但不进一步解释其神学含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这样”承接前文并引出工程告成；用破折性逗号结构“会幕，就是会面之帐”保留מִשְׁכַּן אֹהֶל מוֹעֵד两个紧密相连的称谓。末句刻意保留原文重复，以呈现强调语气。
