  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: zh_hans
  text: 他用金子、蓝色线、紫色线、朱红色线和捻制的细麻，做了以弗得[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以弗得”是大祭司礼服的一部分。
    reason: 文化背景说明
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: 该叙事形式承接上文并推进事件；现代汉语可用简单过去叙述，不必机械译出连接词。
- source_word: הָאֵפֹד
  choice: 以弗得
  rationale: 这是祭司所穿戴的一种特定礼服，采用现代中文圣经中通行的音译，并以脚注简要说明。
- source_word: זָהָב
  choice: 金子
  rationale: 本节原文仅列出“金”，未明说“金线”；译作“金子”保留本节措辞，下一节才具体说明如何把金子制成线。
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: 蓝色线、紫色线
  rationale: 这两个词指用于圣所织物的染色材料；中文在纺织语境中补出“线”，表达自然，也不改变所列颜色。
- source_word: תּוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该词组指染成鲜明朱红色的材料；在本节纺织语境中译作“朱红色线”准确而自然。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻制的细麻
  rationale: שֵׁשׁ指优质细麻，מָשְׁזָר说明经过捻合；此译兼顾材料和制作方式。
