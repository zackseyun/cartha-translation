  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: zh_hans
  text: 袍子中央有一个开口，像甲衣[a]的开口一样；开口周围有包边，免得撕裂。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译为“甲衣”的希伯来词很少见，也可理解为“铠甲”“锁子甲”或“胸甲”。
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי הַמְּעִיל
  choice: 袍子的领口
  rationale: פֶּה在衣服语境中指开口；此处具体是袍子的颈部开口，译作“领口”自然明确。מְעִיל指外袍，依祭司服饰语境译作“袍子”。
- source_word: בְּתוֹכוֹ
  choice: 开在中央
  rationale: 该词表示开口位于袍子中部；“开在中央”以现代汉语清楚表达其空间位置。
- source_word: כְּפִי תַחְרָא
  choice: 像铠甲的领口一样
  rationale: תַחְרָא是罕见词，指防护性的甲衣，具体形制不确定；正文用较宽泛的“铠甲”，避免过度限定为锁子甲或胸甲，并保留领口之间的比较。
- source_word: שָׂפָה לְפִיו סָבִיב
  choice: 领口周围有滚边
  rationale: שָׂפָה本义为“唇、边缘”，在制衣语境中指加固开口的边饰；“滚边”简洁传达围绕领口包边加固的做法。
- source_word: לֹא יִקָּרֵעַ
  choice: 使它不致撕裂
  rationale: Nifal未完成式在此结合前述加固结构表达目的或预期结果；“使它不致撕裂”自然保留被动受损的含义。
