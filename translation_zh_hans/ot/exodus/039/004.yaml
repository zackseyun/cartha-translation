  text: 他们为以弗得做了相连的两条肩带，接在以弗得的两端。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: 肩带
  rationale: 该复数名词本义与“肩”有关；在以弗得的制作语境中，指搭在肩上并连接各部分的构件。“肩带”符合现代汉语服饰用语；脚注保留“肩片”这一可能译法。
- source_word: עָשׂוּ
  choice: 做了
  rationale: עשה 的 Qal 完成式第三人称复数是常用的“做、制造”；“做了”直接承接本章制作圣衣的叙述。
- source_word: לוֹ
  choice: 给以弗得
  rationale: 阳性单数代词的所指依上下文是阳性名词“以弗得”，故明确译出所指，避免汉语“给它”含混或不自然。
- source_word: חֹבְרֹת
  choice: 相连的
  rationale: 该词源于 חבר“连接”，在此描述肩带彼此连接或起连接作用的状态；译作“相连的”保留其分词性质及连接意象，同时不强行判定具体缝接方式。
- source_word: עַל שְׁנֵי קצוותו
  choice: 以弗得的两端
  rationale: 该短语指以弗得的两个末端或边端；“两端”简洁自然。为使汉语指代清楚，将后缀所指明译为“以弗得”。
- source_word: חֻבָּר
  choice: 由此连接起来
  rationale: חבר 的 Pual 完成式第三人称阳性单数表达被动连接。汉语用“连接起来”呈现结果状态，并以“由此”自然说明肩带的连接作用；同时保留与前一“相连”同根复现的效果。
