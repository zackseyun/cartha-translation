    rationale: 原文的构造重点是肩部构件与以弗得在两端相接；改为“相连的两条肩带，接在以弗得的两端”可自然保留连接语义及复数信息。
  revised_text: 他们为以弗得做了相连的两条肩带，接在以弗得的两端。
