base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: zh_hans
  text: 他们把金子锤成薄片[a]，又切成细丝[b]，织进蓝色线、紫色线、朱红色线和细麻中，按巧工的织法制作[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “薄片”也可译作“薄金板”；希伯来语指锤打而成的薄金属片。
    reason: lexical_alternative
  - marker: b
    text: “切成细丝”也可译作“切成细条”；意思是把金子制成可织入布料的纤细丝条。
    reason: lexical_alternative
  - marker: c
    text: “按巧工的织法制作”译自一个表示精巧、设计性织作的技术用语；也可译作“按巧匠的工艺制作”或“以有图案的织工制作”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב
  choice: 把金子锤成薄片
  rationale: רקע在金工语境中指将金属锤打延展；פַּחִים指薄金属片。“锤成薄片”既保留工艺动作，也自然衔接下文切成细丝。
- source_word: וְקִצֵּץ פְּתִילִם
  choice: 再切成细丝
  rationale: 短语描述把薄金片切成可用于纺织的细长丝条。“细丝”体现פְּתִילִם的纺织用途，同时不把其具体形态过度限定为现代意义上的金线。
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: 用来织进
  rationale: 字面为“用来做在……之中”，在本节工艺语境中表示将金丝纳入各种纺织材料。“织进”清楚传达实际操作，但仍与末尾的专业纺织术语相呼应。
- source_word: הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: 蓝色线、紫色线、朱红色线
  rationale: 这些词指相应颜色的染色纺织材料。中文补出“线”，使金丝被织入其中的场景清楚，并保持三项并列一致。
- source_word: הַשֵּׁשׁ
  choice: 细麻
  rationale: שֵׁשׁ在会幕纺织语境中指优质细麻材料。“细麻”简洁保留其材质和精细程度。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧匠的作品
  rationale: 这是指精巧设计或图案纺织工艺的技术性表达。“巧匠的作品”保留技艺高超和成品性质，而不武断限定为设计师或织工。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的工艺叙述。“锤成薄片”“切成细丝”“织进”形成清晰的制作流程；补出三次“线”以符合现代汉语习惯。末句保留מַעֲשֵׂה חֹשֵׁב在具体工种上的一定含混性。
