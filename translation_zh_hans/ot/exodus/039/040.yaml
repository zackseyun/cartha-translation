base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/040.yaml
  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: zh_hans
  text: 院子的帷幔、柱子和柱座，院门的门帘、院子的绳索和橛子，以及会幕供会见帐幕服事所用的一切器具；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַלְעֵי הֶחָצֵר
  choice: 院子的帷幔
  rationale: 指围成院子的织物幔子；“帷幔”自然庄重，也与后文入口处的“门帘”有所区别。
- source_word: עַמֻּדֶיהָ
  choice: 柱子
  rationale: 指支撑院子围幔的直立构件；“柱子”是现代汉语中清楚自然的表达。
- source_word: אֲדָנֶיהָ
  choice: 柱座
  rationale: 指承接、固定柱子的底部构件；译作“柱座”比泛称“座”更明确。
- source_word: הַמָּסָךְ לְשַׁעַר הֶחָצֵר
  choice: 院门的门帘
  rationale: מָסָךְ 在此指入口处的遮帘；“门帘”既符合实物形态，也与四周的帷幔相区别。
- source_word: מֵיתָרָיו
  choice: 院子的绳索
  rationale: 指用于拉紧、固定结构的绳索。希伯来语阳性单数后缀的具体所指略有歧义，但按清单结构和相关经文，理解为院子的绳索最自然。
- source_word: וִיתֵדֹתֶיהָ
  choice: 橛子
  rationale: 指打入地面、用来固定绳索的构件；“橛子”准确而简洁。
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: 供职用的一切器具
  rationale: כְּלֵי 是涵盖性较广的器物、用具，עֲבֹדַת 在圣所语境中指服事或职务；“供职用的一切器具”保留其礼仪功能。
- source_word: הַמִּשְׁכָּן לְאֹהֶל מוֹעֵד
  choice: 会幕，就是会见帐幕中
  rationale: מִשְׁכָּן 与 אֹהֶל מוֹעֵד 是相连而不完全相同的称谓。以“会幕，就是会见帐幕”表达后一名称对前者的说明或限定，同时避免把 לְ 生硬译成另一个目的短语。
theological_decisions:
- issue: הַמִּשְׁכָּן 与 אֹהֶל מוֹעֵד 的关系
  choice: “会幕，就是会见帐幕中”
  alternative: “会幕、会见帐幕”或“为会见帐幕所用的会幕”
  rationale: 原文 לְאֹהֶל מוֹעֵד 可表示关联、归属或说明。采用同位说明式译法，保留两个圣所称谓而不把它们误作两件并列物品。
translation_notes:
  register: 采用现代、庄重、可朗读的清单体。此节承接上文，是句中成分而非独立完整句，因此以分号收束。代词所指在中文中适度明示为“院子的”，以减少歧义，但不添加原文没有的物件。
