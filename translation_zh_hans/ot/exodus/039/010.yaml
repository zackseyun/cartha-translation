  text: וַ/יְמַלְאוּ ב֔/וֹ אַרְבָּעָ֖ה ט֣וּרֵי אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/010.yaml
  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: zh_hans
  text: 他们在胸牌上镶了四行宝石：第一行是红玉髓[a]、黄玉和绿宝石。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里三种宝石的确切所指都不能确定。אֹדֶם 也可译作“红宝石”或泛指红色宝石；פִּטְדָה 可能是贵橄榄石一类；בָרֶקֶת 可能指一种闪亮的绿色宝石。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ בּוֹ
  choice: 他们在胸牌上镶了
  rationale: 动词字面义为“填满”，但在把宝石安置于胸牌的语境中，译作“镶了”最自然；代词所指的“胸牌”在中文中明确补出，以免指代含混。
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: 四行宝石
  rationale: טוּרֵי 指排列成行，אָבֶן 在此为集合用法；“四行宝石”简洁自然。
- source_word: טוּר ... הַטּוּר הָאֶחָד
  choice: 第一行
  rationale: 末语在四行依次列举的上下文中指第一行；中文不必重复“行”或补系词。
- source_word: אֹדֶם
  choice: 红玉髓
  rationale: 词义确切所指不明，但可能是一种红色宝石；“红玉髓”较“红宝石”更符合常见的现代词典判断，同时以脚注保留不确定性。
- source_word: פִּטְדָה
  choice: 黄玉
  rationale: 传统常译为“黄玉”或“黄宝石”，但其古代矿物所指并不确定，故在脚注说明。
- source_word: בָרֶקֶת
  choice: 绿宝石
  rationale: 传统常译“绿宝石”，该词可能与闪光、明亮有关，确切矿物种类不明，故不进一步限定为现代矿物学上的祖母绿。
