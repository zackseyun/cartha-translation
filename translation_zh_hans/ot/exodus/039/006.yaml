  text: וַֽ/יַּעֲשׂוּ֙ אֶת אַבְנֵ֣י הַ/שֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: zh_hans
  text: 他们加工红玛瑙[a]，把它们镶在金制的镶座中，并在上面按印章的刻法，刻上以色列众子的名字。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “红玛瑙”也可将原文音译为“绍罕石”；这种宝石的确切矿物鉴定尚不确定。
    reason: 保留שֹׁהַם在矿物鉴定上的不确定性，并说明“红玛瑙”为传统译名而非确证。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 他们又加工
  rationale: עָשָׂה含义宽泛；在制作祭司服饰的工艺语境中，“加工”比直译“制造石头”更自然，同时不具体限定为切割或琢磨。叙事连接词וַ以“又”表达。
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: 红玛瑙[a]
  rationale: שֹׁהַם所指宝石无法确定；“红玛瑙”是中文圣经传统中较为熟悉的译名，正文采用此称呼，并用脚注保留矿物鉴定的不确定性。
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: 用金框围镶起来
  rationale: מֻסַבֹּת表达被环绕，מִשְׁבְּצֹת指镶座、框槽一类的金属构件；“用金框围镶起来”兼顾环绕与镶嵌的工艺形象，而不贸然限定为金丝细工。
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: 仿照印章的刻法……雕刻
  rationale: 希伯来文以同根词强调雕刻，并以印章的刻纹说明其方式；中文用“仿照印章的刻法……雕刻”保留这一工艺比照，且行文自然。
- source_word: עַל שְׁמוֹת
  choice: 照着……名字
  rationale: 介词עַל在此可表达与名字相应或以名字为内容；“照着……名字”保留这种对应关系，避免把句法解释得过窄。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列众子
  rationale: 保留希伯来文明确的阳性复数及族长之子的语境；“众子”在庄重的现代中文中可理解，也避免泛化为全体以色列人。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的性别与圣约称谓
  choice: 以色列众子
  alternative: 以色列人；以色列的儿女
  rationale: 本节所刻的是以色列诸子的名字，原文明确使用阳性复数“众子”。译文保留这一表达，不将其性别中和，也不扩大为一般性的民族称谓。
translation_notes:
  register: 采用现代、庄重而可朗读的叙事语体。“加工”“围镶”“刻法”使工艺过程清楚易懂；避免使用过度古雅的“图书”来表示印章。
