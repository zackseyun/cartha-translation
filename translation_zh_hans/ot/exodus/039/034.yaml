  text: 染红的公羊皮罩盖、塔哈示皮罩盖[a]，以及屏障的幔子；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔哈示皮”中的希伯来词 תְּחָשִׁים 确切所指不明，可能指某种动物的皮。传统上有译作“海狗皮”“海豚皮”或“儒艮皮”的，也有采用音译“他哈示皮”的。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: 罩
  rationale: 指覆盖在会幕之上的覆盖物；用“罩”简洁保留名词形式，也符合本节清单的语境。
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: 染红的公羊皮
  rationale: הַמְאָדָּמִים 表示使之变红，译作“染红”比仅指天然颜色的“红色”更准确。
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: 海狗皮
  rationale: תְּחָשׁ 所指动物不确定；正文采用中文圣经语境中较为熟悉的传统译法“海狗皮”，并以脚注明确其不确定性，避免把该鉴定当作定论。
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: 遮掩用的幔子
  rationale: פָּרֹכֶת 是分隔至圣所的幔子；הַמָּסָךְ 在此表达遮掩、屏障的作用。此译法既自然，也保留该组合短语的功能含义。
