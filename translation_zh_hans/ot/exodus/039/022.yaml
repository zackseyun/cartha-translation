  yaml_path: translation/ot/exodus/039/022.yaml
  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: zh_hans
  text: 他又做了以弗得的外袍，是织工的作品，全是蓝色的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓝色”所对应的希伯来词指一种珍贵的蓝色染色纺织材料，用于会幕和祭司的礼服。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又做了
  rationale: 未完成式连瓦乌在叙事中承接前文，表示下一项制作行动；“又”自然体现连续关系，“做了”直接对应 עשה。
- source_word: מְעִיל הָאֵפֹד
  choice: 以弗得的外袍
  rationale: מְעִיל 指外穿的长袍；אֵפֹד 是祭司礼服的专门名称，沿用中文圣经中通行的音译“以弗得”，并保留原文的属格关系。
- source_word: מַעֲשֵׂה אֹרֵג
  choice: 织工的作品
  rationale: 直译为“织工的作品/工作”，强调该衣物由织造工艺制成；不加入原文未明说的“巧手”或“精工”。
- source_word: כְּלִיל תְּכֵלֶת
  choice: 全用蓝色线织成
  rationale: כְּלִיל 表示整体、全部；תְּכֵלֶת 在会幕纺织语境中指珍贵的蓝色染色纺织材料。中文补出“线织成”，使材料与织造语境自然衔接，同时以脚注说明原文表达较简略。
