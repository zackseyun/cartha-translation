  text: כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כָּל הָ/עֲבֹדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: zh_hans
  text: 以色列人就照着雅威吩咐摩西的一切，做了全部的工作。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”；这是对以色列百姓的惯用集体称谓，也可译作“以色列子民”。
    reason: 说明原文字面形式及可选译法，避免现代读者误以为这里只指男性。
lexical_decisions:
- source_word: כְּכֹל ... כֵּן
  choice: 凡……都照样
  rationale: 希伯来文以 כְּכֹל 和 כֵּן 前后呼应，表达完全依照命令而行。译作“凡……都照样”既保留对应结构，也符合现代汉语习惯。
- source_word: צִוָּה
  choice: 吩咐
  rationale: 此动词表示具有权威的命令；“吩咐”在本句中庄重自然，并清楚表明雅威向摩西下达指示。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是神的四字圣名，而非称号。采用“雅威”作为较贴近 YHWH 的现代汉语音译，以保留经文中的专名。
- source_word: אֶת מֹשֶׁה
  choice: 摩西
  rationale: 在 צוה 的句法结构中，摩西是领受命令的人；汉语“吩咐摩西”无需另加介词。
- source_word: עָשׂוּ
  choice: 完成了
  rationale: 上下文指以色列人执行并完成会幕相关的全部工作。“完成了”体现行动已经落实，同时不把含义局限为制造。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人[a]
  rationale: 字面为“以色列的众子”，在这里是对以色列全体百姓的惯用集体称谓。正文用现代汉语自然的“以色列人”，脚注保留字面信息。
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: 全部工作
  rationale: עֲבֹדָה 可指工作、劳作或服事；在会幕制作的语境中，“全部工作”最清楚地概括所有受命完成的事务。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名。译作“雅威”旨在音译该名，而不是以“主”等称号代替；“耶和华”虽是汉语基督教传统中更常见的形式，但其语音来源较间接。
- issue: בְּנֵי יִשְׂרָאֵל 的群体指称
  choice: 以色列人
  alternative: 以色列的众子／以色列子民
  rationale: 该短语形式上是阳性复数，字面为“以色列的众子”，但在本处惯常地指整个以色列群体。正文采用自然且不误导为仅限男性的群体称呼，并以脚注说明原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“凡……都照样”保留原文前后呼应；整体句式简洁，适合公开诵读。
