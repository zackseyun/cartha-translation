    rationale: עָשׂוּ 的基本义为“做、施行”；“全部的工作”已表达工作总体，宜译“做了”以避免把动词本身限定为“完成”。
  - severity: low
    issue: 开头结构及“都”的辖域略不自然
    rationale: “凡雅威所吩咐摩西的”宜补足为“雅威吩咐摩西的一切”；将“照着”置于动作前可清楚表达原文的依照关系，并避免“都”似乎分配给每一位以色列人的歧义。
  revised_text: 以色列人就照着雅威吩咐摩西的一切，做了全部的工作。[a]
