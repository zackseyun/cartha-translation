  text: 他们在胸牌上做了纯金的链子，按绳索式的编结工艺制作[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按捻合工艺制作”或“按绳索式工艺制作”。希伯来语描述这些链子具有编结、捻合或绳索般的制作样式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 他们……做了
  rationale: עָשָׂה在叙事中表示“制作”；译为“做了”简明自然，并保留连续叙事语气。
- source_word: עַל הַחֹשֶׁן
  choice: 在胸牌上
  rationale: עַל在此表示链子附着或设置于胸牌之上；“在胸牌上”保留空间及附着关系。חֹשֶׁן在祭司衣饰语境中指大祭司的胸牌。
- source_word: שַׁרְשְׁרֹת
  choice: 链子
  rationale: 该复数名词指链条；现代汉语用“链子”清楚自然，不必另加原文没有的尺寸说明。
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: 采用编结工艺制成绳索状
  rationale: 这一组合描述链子的制作形态，带有编结、捻合而如粗绳的意味。此译既表达工艺，也保留绳索般外形，而不把具体技法限定得过死。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 准确表达材料为洁净、精纯的金；“纯金”是现代汉语中简洁惯用的说法。
