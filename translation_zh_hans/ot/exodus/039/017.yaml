  text: 他们把两条金绳[a]安在胸牌两端的两个环上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金链”。希伯来语可指扭成的绳索，也可指绳状的链条；这里所说的物件由金制成，并连接在胸牌上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: 他们把……安在
  rationale: נתן在此表示把物件放置、安装在另一物件上；“安在”符合会幕器具制作的语境，也比单纯“放在”更自然。
- source_word: שְׁתֵּי הָעֲבֹתֹת הַזָּהָב
  choice: 两条金绳
  rationale: עֲבֹתֹת可指扭成的绳索或绳状链条；量词“条”和“金绳”保留其绳状形象，材质“金”也得到明确表达。
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: 在……两个环上
  rationale: עַל在这里表示安置或连接的位置；טַבָּעֹת直译为“环”。
- source_word: עַל קְצוֹת הַחֹשֶׁן
  choice: 胸牌两端的
  rationale: קְצוֹת表示末端或两端；חֹשֶׁן在祭司服饰语境中指胸牌。采用定语结构，清楚表明两个环位于胸牌两端。
