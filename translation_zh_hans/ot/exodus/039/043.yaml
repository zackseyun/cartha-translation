    rationale: 原文 יהוה 在英语 POB 审校决定中固定译为 Yahweh。草稿的“耶和华”虽为常见中文传统译名，但不符合本项目要求保留该神名的译法；应译为“雅威”。
  - severity: low
    issue: “完全照样做了”略增原文未明示的程度强调
    rationale: כֵּן 指“如此、照样”，强调与命令相符；“完全”可被理解为额外加入绝对程度。用“他们就这样做了”更贴近原文，并保留重复。
  - severity: low
