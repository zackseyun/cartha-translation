  rationale: 修订使神名与项目指定的 Yahweh 对应为“雅威”，并以“看哪”表达 וְהִנֵּה 的提示语气。保留“做成了……就这样做了”的重复，以反映原文对照雅威吩咐而实行的强调；未加入验收、认可或其他解释性内容。
