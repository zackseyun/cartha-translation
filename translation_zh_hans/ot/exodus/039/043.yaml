  source_fidelity: 草稿整体准确传达摩西看见工程完成、工匠遵照神命而做，以及摩西祝福他们的意思。但将 יהוה 译为“耶和华”与本项目英语审校轨迹所指定的“Yahweh”不一致；中文应相应采用“雅威”。此外，“完全”虽可表达强调，却比原文 כֵּן 的“如此／照样”更强化了程度。
  naturalness: “全部工程”“为他们祝福”自然庄重。“见他们已经完成了”中“完成了”的宾语在汉语里略显悬置；改为“他们都做成了”更清楚。以分号保留原文重复的两个分句，既自然也能体现强调。
  terminology: 神名统一译为“雅威”，对应项目对 יהוה 的既定译法。其余术语无须调整。
