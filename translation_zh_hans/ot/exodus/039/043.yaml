base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: zh_hans
  text: 摩西看见所有工程；看哪，他们都做成了，正如雅威所吩咐的；他们就这样做了。摩西便为他们祝福。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: 察看
  rationale: ראה的基本义是“看、看见”；本句语境是摩西查看已经完工的各项工程。“察看”自然体现此处有意查看的语境，又不额外加入正式验收或评定合格的含义。
- source_word: כָּל הַמְּלָאכָה
  choice: 全部工程
  rationale: מְלָאכָה可指工作、工程或制成之物。结合会幕制作的上下文，“全部工程”既涵盖施工与制作成果，也符合现代汉语表达。
- source_word: וְהִנֵּה
  choice: 见
  rationale: הִנֵּה在此引导摩西察看后所发现的情形，并带有提示注意和确认意味。汉语“见”简洁保留叙事推进，不采用较古奥的“看哪”。
- source_word: עָשׂוּ אֹתָהּ
  choice: 他们已经完成了
  rationale: עשה含义宽泛，可译“做、制作”。此处阴性代词回指מְלָאכָה，即全部工程；“已经完成了”在汉语中自然表达摩西所见的完工状态。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: 照耶和华所吩咐的
  rationale: כַּאֲשֶׁר表示与吩咐相符；“照……所吩咐的”准确而自然。יְהוָה按现代中文圣经中广为人知的专名形式译作“耶和华”。
- source_word: כֵּן עָשׂוּ
  choice: 完全照样做了
  rationale: 原文重复עשה并以כֵּן强调实际执行与命令相符。“完全照样做了”保留重复和精确遵行的强调，同时避免汉语生硬。
- source_word: וַיְבָרֶךְ אֹתָם
  choice: 摩西就为他们祝福
  rationale: ברך的皮勒式在此意为“祝福”。“为他们祝福”是自然、庄重的现代汉语；“就”体现叙事承接。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文目标文本采用读者最熟悉、并作为专名使用的“耶和华”，不以“主”这一称号替代神名；“雅威”则更接近当代学界对古代读音的重构，但在普通中文读者中辨识度较低。
translation_notes:
  register: 采用现代、庄重且易懂的叙事文体。保留原文两次“做”的强调结构，但以“已经完成了……完全照样做了”避免机械重复；不增添“验收合格”等原文未明说的判断。
