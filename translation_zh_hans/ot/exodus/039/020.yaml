base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: zh_hans
  text: 他们做了两个金环，把它们安在以弗得两条肩带的下方、正面，与其接合处[a]相对，在以弗得精工织成的带子[b]上方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“连接处”或“相接的位置”；希伯来语指以弗得各部分连接的地方。
    reason: lexical_alternative
  - marker: b
    text: 或译“以弗得的织带”或“以弗得的腰带”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: 环
  rationale: 该词在会幕器具和祭司服饰的语境中通常指用于连接的金属环；“环”简洁准确。
- source_word: כִתְפֹת
  choice: 肩带
  rationale: 这里指以弗得位于肩部、起连接作用的服饰部件，不只是人体的“肩”；“肩带”符合现代汉语服饰用语。
- source_word: אֵפֹד
  choice: 以弗得
  rationale: 这是大祭司特定礼服的专门名称，沿用通行音译可避免用现代服装名称作不准确的等同。
- source_word: מִלְמַטָּה
  choice: 位于下方
  rationale: 保留原文对金环所在较低位置的空间说明。
- source_word: מִמּוּל פָּנָיו
  choice: 在它的正面
  rationale: 原文直译涉及“它的面前/正面”；对衣物而言，“在它的正面”自然地表达其朝向。
- source_word: לְעֻמַּת
  choice: 对着
  rationale: 该词表示位置上的相对、对应或对齐；“对着”保留这种空间关系，而不把位置说得过于确定。
- source_word: מֶחְבַּרְתּוֹ
  choice: 接合处
  rationale: 该词指部件相接、连接之处；“接合处”比“接缝”更宽泛，避免武断认定具体结构。
- source_word: חֵשֶׁב
  choice: 精工织成的带子
  rationale: 在以弗得的语境中，该词指与衣服相连、具有束系作用的织制带状部件；此译兼顾材质、工艺和形态。
- source_word: וַיִּתְּנֻם
  choice: 安在
  rationale: 动词表示把金环放置并固定在指定位置；“安在”比单纯“放在”更符合服饰附件的语境。
