  text: 又用细麻布做头巾，用细麻布做华美的礼帽，又用捻成的细麻布做裤子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又做细麻布裤子，是用捻成的细麻布做的。”希伯来文的语序使末尾“细麻布，捻成的”尤其可与最后一项相连，但也呼应本段对祭司衣物材料的一贯描述。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: 礼冠
  rationale: 该词指大祭司所戴、以布缠裹而成的特定头饰；“礼冠”在现代中文中简洁庄重，也能与下文普通祭司的礼帽区分。
- source_word: שֵׁשׁ
  choice: 细麻布
  rationale: 该词在会幕与祭司衣服语境中指质地精细的麻布；译作“细麻布”既体现材料，也保留其品质含义。
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: 华美礼帽
  rationale: 该结构以“华美、装饰”为限定，指祭司所戴的帽子本身华美，并非帽子之外另有装饰；“华美礼帽”自然地保留这一修饰关系。
- source_word: מִכְנְסֵי הַבָּד
  choice: 内裤
  rationale: 该短语指祭司遮蔽下身的贴身衣物；“内裤”是普通现代读者最易理解且准确的称呼。הַבָּד 表明其麻布材质。
- source_word: מָשְׁזָר
  choice: 搓捻
  rationale: 该词描述纱线经过搓捻、合股的制作方式；“搓捻”比笼统的“织成”更准确地反映纺织工艺。
