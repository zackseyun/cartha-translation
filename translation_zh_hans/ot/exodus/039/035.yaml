  text: the ark of the testimony[a], its poles, and the mercy seat.
translation:
  language: zh_hans
  text: 见证柜、柜的杠和施恩座[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎罪盖”。这个希伯来语词指见证柜的盖，并与赎罪有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֹן
  choice: 柜
  rationale: 此词在会幕语境中指盛放见证版的神圣柜子。“柜”是现代汉语中自然、准确的器物名称；与“见证”组合后，所指明确。
- source_word: הָעֵדֻת
  choice: 见证
  rationale: עֵדוּת 的直接含义是“见证”，在这里指与柜中约版有关的见证。“见证柜”保留原文关系，避免将其直接解释为“约柜”。
- source_word: בַּדָּיו
  choice: 柜杠
  rationale: בַּדִּים 在会幕器具语境中指抬运圣物所用的杠。“柜杠”简洁清楚，并以“柜”补明所属关系。
- source_word: הַכַּפֹּרֶת
  choice: 施恩座
  rationale: 该词指柜上面的金盖，并带有赎罪礼仪含义。“施恩座”保留这一专门圣所器物的传统称呼及神学意蕴；脚注提供更具结构和功能色彩的译法。
theological_decisions:
- issue: 会幕器具 כַּפֹּרֶת 的译法
  choice: 施恩座
  alternative: 赎罪盖
  rationale: 原词既指见证柜的盖，也与赎罪礼仪相关。“施恩座”在中文中能辨认该特定器物并保留其礼仪意蕴，但不能充分显出它实际是柜盖，因此以脚注注明“赎罪盖”这一可能译法，不把词义限于单一解释。
translation_notes:
  register: 采用现代、庄重而简洁的清单式表达，与本节上下文列举会幕器具的句法相配。“见证柜”比单用传统称呼“约柜”更直接对应原文，同时普通读者仍能据上下文识别其所指。
