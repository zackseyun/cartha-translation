base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: zh_hans
  text: 他们把帐幕带到摩西那里，包括帐棚和它的所有器具：扣钩、竖板[a]、横闩、柱子和底座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竖板”也可译作“框架”；希伯来语指帐幕中直立的结构件。
    reason: lexical_alternative
  - marker: b
    text: “底座”也可译作“承窝”；指竖板或柱子嵌入其中的基础构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: 他们把……带到
  rationale: 该希斐使役形在叙事中推进下一项行动；现代汉语用“把……带到”自然表达将物件送至某人处的意思。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中指神圣居所整体结构的固定术语；“帐幕”准确且为中文读者熟悉。
- source_word: אֶל מֹשֶׁה
  choice: 到摩西那里
  rationale: 介词 אֶל 表示朝向或到达某人所在之处，这一译法保留其通常意义。
- source_word: הָאֹהֶל
  choice: 帐棚
  rationale: אֹהֶל 通常意为帐棚；此处进一步说明帐幕整体中的帐棚部分。“帐棚”也与前面的“帐幕”形成必要区分。
- source_word: כָּל כֵּלָיו
  choice: 其中的一切器具
  rationale: כֵּלִים 可泛指器物、用具或装备；“器具”保持其宽泛含义，并能统摄随后列举的结构配件。
- source_word: קְרָסָיו
  choice: 扣钩
  rationale: 该词在帐幕建造语境中指连接幔子的扣合件；“扣钩”兼顾其钩形和连接功能。
- source_word: קְרָשָׁיו
  choice: 竖板
  rationale: 该词指构成帐幕壁面的直立结构件；“竖板”比笼统的“板”更清楚，同时以脚注保留“框架”这一可能译法。
- source_word: בְּרִיחָיו
  choice: 横闩
  rationale: בְּרִיחַ 指穿连并固定竖板的横向杆件；“横闩”准确表达其方向和结构作用。
- source_word: עַמֻּדָיו
  choice: 柱子
  rationale: 该词指帐幕结构中的垂直支撑物；“柱子”是清楚自然的现代汉语。
- source_word: אֲדָנָיו
  choice: 底座
  rationale: 在帐幕语境中，该词指承托并嵌接竖板或柱子的基础构件；“底座”通俗清楚，较技术性的“承窝”留作脚注说明。
