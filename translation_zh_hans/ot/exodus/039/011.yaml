lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: 第二排
  rationale: טוּר 在胸牌宝石的语境中指一排或一列宝石；中文用“排”最自然。句首 וְ 承接上文，在连续列举中无需机械译作“和”。
- source_word: הַ/שֵּׁנִי
  choice: 第二
  rationale: 序数词，意为“第二”；与“排”组合为自然的现代汉语。
- source_word: נֹפֶךְ
  choice: 绿松石
  rationale: 这种古代宝石的确切种类不能确定；“绿松石”是合理的现代对应词，其他可能译法在脚注中保留。
- source_word: סַפִּיר
  choice: 蓝宝石
  rationale: 这是 סַפִּיר 通行且易懂的汉语译法，尽管古代所指矿物未必与现代矿物学定义完全相同。
- source_word: וְ/יָהֲלֹם
  choice: 和金刚石
  rationale: יָהֲלֹם 所指宝石并不确定；“金刚石”承接传统译法，并用“和”表达名单最后一项前的连接词。
