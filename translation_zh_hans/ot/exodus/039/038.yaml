  language: zh_hans
  text: 金坛、膏油、芬芳的香，以及帐幕入口的门帘；
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: 金坛
  rationale: 希伯来语直译为“金的坛”；“金坛”在现代汉语中简洁自然，也准确表达材质。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 该组合词指用于膏抹礼仪的油；“膏油”是清楚、庄重且通行的圣幕用语。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 芬芳的香
  rationale: קְטֹרֶת指焚烧的香，הַסַּמִּים指芳香材料或香料；“芬芳的香”自然传达其香料性质而不过度限定配方。
- source_word: מָסַךְ
  choice: 门帘
  rationale: 在圣幕语境中指设于入口处的悬帘；结合后面的“入口”，“门帘”比泛称“帘子”更清楚，并与内层幔子有所区别。
- source_word: פֶּתַח הָאֹהֶל
  choice: 帐幕入口
  rationale: פֶּתַח是入口或开口，הָאֹהֶל是帐幕；这里在上下文中指圣幕的帐幕主体。
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: 以顿号列举，末项用“以及”连接
  rationale: 重复的连词和宾格标记构成器物清单；现代汉语用顿号和末项连词可自然保留四项并列关系。
