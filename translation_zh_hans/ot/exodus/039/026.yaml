base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 铃铛和石榴，铃铛和石榴，在袍子的下摆四周，供事奉[a]时使用，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为服事之用”。希伯来语不定式表示用途，即用于事奉。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: 铃铛
  rationale: 该名词指铃铛。本节未明说材质，虽上下文表明是金铃铛，此处仍按原文不增补“金”。
- source_word: רִמּוֹן
  choice: 石榴
  rationale: 该词本义为石榴；在祭司袍服的语境中指石榴形装饰，但直译“石榴”清楚自然，也保留原文形象。
- source_word: פַּעֲמֹן וְרִמֹּן פַּעֲמֹן וְרִמֹּן
  choice: 铃铛和石榴，铃铛和石榴
  rationale: 保留原文重复而有节奏的排列说法，体现铃铛与石榴交替环列。
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: 环绕在袍子下摆上
  rationale: שׁוּלֵי 指袍服的下缘或下摆，סָבִיב 表示四周环绕；此译法在现代汉语中简洁自然。
- source_word: לְשָׁרֵת
  choice: 为供职之用
  rationale: 介词加不定式表达目的；在会幕与祭司语境中，“供职”能简洁表达履行祭司服事的用途。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，不用头衔替代原文中的专名。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: 忠实表达成品符合先前神圣命令的总结句式，同时采用自然的现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用较贴近学界通行重构读音的“雅威”，保留其作为专名的性质，而不以“主”等称号替代。
- issue: לְשָׁרֵת 的祭司职事含义
  choice: 为供职之用
  alternative: 为服事之用
  rationale: 不定式主要说明袍子的用途；“供职”体现祭司在会幕中履职的语境，但脚注保留较宽泛的译法，避免将词义限制过度。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“铃铛和石榴”的重复保留原文节奏；脚注标记置于其实际所解释的“供职”之后。
