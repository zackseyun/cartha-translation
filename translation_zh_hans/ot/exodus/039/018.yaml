  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: zh_hans
  text: 他们把两条编链的两端放在两个镶座上，再把这两个镶座安在以弗得前面的两条肩带上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: 两端
  rationale: 指物件的端点；结合“两条编链”，译为“两端”自然明确。
- source_word: הָעֲבֹתֹת
  choice: 编链
  rationale: 此词在会幕与首饰制作语境中指编结或扭成的链子；“编链”兼顾其链状材质和工艺特征。
- source_word: מִּשְׁבְּצֹת
  choice: 镶座
  rationale: 指用来镶嵌、承托胸牌构件的金制座托；“镶座”比泛称“座子”更能体现工艺语境。
- source_word: וַיִּתְּנֻם
  choice: 又把它们安在
  rationale: נתן的基本义为放置、安放；“安在”符合服饰部件装配语境，同时不具体断定固定方式。
- source_word: כִּתְפֹת
  choice: 肩带
  rationale: 在以弗得的制作语境中指衣服肩部的连接构件；现代中文以“肩带”简洁易懂。
- source_word: אֶל מוּל פָּנָיו
  choice: 位于以弗得的前面
  rationale: 表示朝向或处于其正面；明确补出先行词“以弗得”，避免中文代词所指含混。
