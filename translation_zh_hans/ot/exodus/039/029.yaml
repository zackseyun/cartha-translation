  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 又用捻制的细麻、蓝色线、紫色线和朱红色线[b]制成腰带[a]；这腰带是按绣工的手艺[c]制成的，正如雅威吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “腰带”也可译作“束带”或“带子”；指祭司服饰中束在腰间的带子。
    reason: lexical_alternative
  - marker: b
    text: “朱红色”也可译作“绯红色”或“深红色”；原文指染成这种颜色的纺织材料。
    reason: lexical_alternative
  - marker: c
    text: “绣工的手艺”也可理解为用不同颜色织出图案的彩织工艺；该词不必限于现代意义的针绣。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: 腰带
  rationale: 指祭司服饰中束在腰间的带子；“腰带”在现代汉语中自然明确，也保留了其服饰功能。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻制的细麻
  rationale: שֵׁשׁ表示细麻，מָשְׁזָר表示经过捻合；此译同时呈现材料与制作方式。
- source_word: תְכֵלֶת
  choice: 蓝色线
  rationale: 指会幕纺织品中以名贵蓝色染料染成的材料；上下文是制作腰带，因此明示“线”符合汉语表达。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 采用会幕纺织语境中的常规颜色译法，并以“线”明确其材料属性。
- source_word: תוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该词组指染成鲜红或朱红色的纺织材料；“朱红色线”既准确又适合现代汉语。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 绣工的手艺
  rationale: 保留原文“某类工匠的工作”这一结构，突出有技巧的彩色装饰纺织工艺。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文音译呈现四字神名，而不以“主”这一称号替代。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: 保留出埃及记反复出现的顺服公式；“正如”强调制作严格符合神的吩咐。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术重构音译其专名，避免以称号代替。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句首“以及”保留本节与前文清单的连接关系；材料顺序依照希伯来原文，不把“绣工”具体化为现代意义上仅用针刺绣的工匠。
