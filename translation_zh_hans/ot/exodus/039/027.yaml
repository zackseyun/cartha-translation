  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: zh_hans
  text: 他们为亚伦和他的儿子们做了由织工织制的细麻布内袍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“织工的作品”。这个希伯来语短语强调这些内袍是用织造工艺制成的。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 他们……做了
  rationale: 这是叙事中表示下一步行动的动词；中文不必机械译出句首连接词，译为“做了”自然清楚。
- source_word: הַכָּתְנֹת
  choice: 内袍
  rationale: 该词指贴身穿着的长衣；在祭司服饰语境中，“内袍”比泛称“衣服”更准确，也比现代汉语中的“外套”更合适。
- source_word: שֵׁשׁ
  choice: 细麻布
  rationale: 在会幕和祭司服饰的语境中，该词指质地精细的麻布；“细麻布”兼顾材料与品质。
- source_word: מַעֲשֵׂה אֹרֵג
  choice: 是织工织成的
  rationale: 该结构指由织造工艺完成的作品；这样译既自然，又保留原文对织工及织造方式的强调。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: 为亚伦和他的儿子们
  rationale: 保留“为”所表达的受益或用途关系；“他的儿子们”明确对应亚伦的众子。
