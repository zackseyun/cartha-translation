base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他们把一条蓝色线绳[a]系在牌上，好把牌安在礼冠上面，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蓝紫色线绳”或“蓝色绳子”。希伯来语“特客勒特”（תְּכֵלֶת）指会幕中所用的一种独特蓝色或蓝紫色染色材料。
    reason: 保留תְּכֵלֶת在具体色调及其指材料还是颜色方面的词义范围。
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: 系在牌上
  rationale: נתן与עַל连用在此表示把线绳固定在上一节的圣冠牌上；译作“系在牌上”既符合实际动作，也比直译“放在其上”自然。为使本节单独诵读时指代清楚，将代词所指明示为“牌”。
- source_word: פְּתִיל
  choice: 线绳
  rationale: 该词指捻成的线或绳；“线绳”兼顾其纺织材料性质和系固用途。
- source_word: תְּכֵלֶת
  choice: 蓝色
  rationale: 该词指会幕织物所用的一种独特蓝色或蓝紫色染料及染色材料；正文采用普通读者最易理解的“蓝色”，并以脚注保留色调与材料上的译法差异。
- source_word: לָתֵת
  choice: 好把牌安在
  rationale: 不定式在这里表达目的；“好把……安在”自然呈现线绳用于将金牌固定于礼冠的作用。
- source_word: הַמִּצְנֶפֶת
  choice: 礼冠
  rationale: 该词特指大祭司缠裹式的头饰。“礼冠”简洁、庄重，并能与普通帽子区别。
- source_word: מִלְמָעְלָה
  choice: 上面
  rationale: 该副词表示位于上方或上部；译作“礼冠上面”保留空间关系，不额外加入原文未明说的“正面”。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: “正如”体现遵照命令而行的对应关系；“雅威”按希伯来辅音神名YHWH的通行学术重构音译，保留专名而不以称号替代。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列神的四字神名。采用“雅威”旨在保留专名，并较贴近YHWH的通行重构读音；不将其默换为称号，也不采用源自后期元音组合的“耶和华”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“礼冠”体现祭司服饰语境；“牌”承接上一节的圣冠牌。句式保持希伯来原文的动作、目的和履行命令三层结构。
