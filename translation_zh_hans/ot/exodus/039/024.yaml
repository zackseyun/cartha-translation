  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: zh_hans
  text: 他们在袍子的下摆上，用蓝色、紫色和朱红色的捻线做了石榴形饰物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“石榴”，即以物体的形状来称呼这种装饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 他们……做了
  rationale: עשה的Qal叙事过去式第三人称复数，直接表示“他们做了”；按现代汉语叙事语序安排主语和谓语。
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: 在袍子的下摆上
  rationale: עַל表示位置；שׁוּלֵי是衣服下缘的复数附属形，现代汉语用“下摆”自然；מְעִיל指祭司所穿的袍子。
- source_word: רִמּוֹנֵי
  choice: 石榴形饰物[a]
  rationale: 原文直称“石榴”，在祭司服饰语境中指以石榴为造型的装饰。正文采用清楚的功能性表达，并以脚注保留原文简洁说法。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 蓝色、紫色和朱红色的……线
  rationale: 三项在会幕纺织语境中是染色材料；“蓝色、紫色和朱红色”符合现代汉语，结合מָשְׁזָר补出“线”以明确材质。
- source_word: מָשְׁזָר
  choice: 捻线
  rationale: 该词描述经搓捻、合股的纺织材料；译作“捻线”既保留制作特征，也比生硬的“被捻的”更自然。
theological_decisions: []
