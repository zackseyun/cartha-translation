  yaml_path: translation/ot/exodus/039/037.yaml
  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: zh_hans
  text: 纯净的灯台、灯台的灯盏，就是按次序摆列的灯盏[a]，以及灯台的一切器具和照明用的油；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“摆列的灯盏”。希伯来语“摆列”一词强调这些灯盏依规定安排、按次序陈列。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: 灯台
  rationale: מְנוֹרָה指承托多盏灯的圣所器物，而非单独一盏灯；“灯台”准确、自然，也保留了器物清单的语体。
- source_word: הַטְּהֹרָה
  choice: 纯净的
  rationale: טָהוֹר在此描述圣所器物的纯净性质。“纯净的”既贴近原文，又避免在本节没有明说时补入“金”这一材质。
- source_word: נֵרֹתֶיהָ
  choice: 灯台的灯盏
  rationale: נֵר在会幕器物清单中指灯台所属的各个灯盏。将代词明确译作“灯台的”，符合现代汉语，也避免“它的”指代含混。
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: 按次序摆列的灯盏
  rationale: מַעֲרָכָה含有安排、依次陈列之意；此译自然表达灯盏按规定秩序摆放，同时保留该短语对前文“灯盏”的同位说明作用。
- source_word: כָּל כֵּלֶיהָ
  choice: 灯台的一切器具
  rationale: כְּלִי可泛指器具、用具或器皿；“一切器具”适合圣所清单语境，而明确“灯台的”使所属关系清楚。
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: 照明用的油
  rationale: 该构造短语指供发光照明使用的油；“照明用的油”在现代汉语中简明自然，又不把意义缩窄为某种特定灯油。
