  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/חֵ֨שֶׁב אֲפֻדָּת֜/וֹ אֲשֶׁ֣ר עָלָ֗י/ו מִמֶּ֣/נּוּ הוּא֮ כְּ/מַעֲשֵׂ/הוּ֒ זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: zh_hans
  text: 以弗得上精巧织成的带子[a]，与以弗得连成一体，织法也相同；所用材料是金线、蓝色线、紫色线、朱红色线和捻成的细麻，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以弗得上那条装饰性的带子，出自以弗得本身，做工也与以弗得相同。”希伯来文强调这条带子与以弗得连为一体，做工也与它相配。
    reason: 保留 חֵשֶׁב、מִמֶּנּוּ הוּא 和 כְּמַעֲשֵׂהוּ 在带子性质、结构关系及工艺方面的译法差异。
lexical_decisions:
- source_word: חֵשֶׁב
  choice: 精巧织成的带子
  rationale: 在祭司服饰语境中指以弗得上的织带；此译兼顾其纺织性质与精巧工艺。
- source_word: אֲפֻדָּתוֹ
  choice: 以弗得
  rationale: 指大祭司所穿的专门礼服；采用现代中文圣经语境中通行的音译。希伯来语第三人称单数领属在中文上下文中无需生硬译出“他的”。
- source_word: אֲשֶׁר עָלָיו
  choice: 以弗得上
  rationale: 直接表达带子位于以弗得之上，不把原文未明说的连接方式提前加入此短语。
- source_word: מִמֶּנּוּ הוּא
  choice: 与以弗得连成一体
  rationale: 表达带子从以弗得本身而出、并非另行附加的结构关系。
- source_word: כְּמַעֲשֵׂהוּ
  choice: 织法也相同
  rationale: 指带子的制作工艺与以弗得相同；“织法”符合此处纺织品语境。
- source_word: זָהָב
  choice: 金线
  rationale: 上下文是纺织材料；参照本章前文金片被剪成线的说明，以“金线”自然呈现其实际用途。
- source_word: תְּכֵלֶת
  choice: 蓝色线
  rationale: 传统且清楚地呈现会幕织物的颜色材料，并由语境补明为线。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 标准呈现这种染色纺织材料，并补明为线。
- source_word: תּוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该词组表示朱红染色材料；“朱红色线”兼顾颜色与纺织语境。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻的细麻
  rationale: 保留细麻的品质及其经过搓捻的制作特征。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: 保留执行先前命令的惯用总结句，并直接呈现神名。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文明确使用四字神名；“雅威”以现代汉语常见形式直接音译，避免用称号替代专名。
- issue: 带子与以弗得的结构关系
  choice: 与以弗得连成一体
  alternative: 从以弗得而出；和以弗得是同一块料
  rationale: מִמֶּנּוּ הוּא 强调带子与以弗得本体的整体性；译文呈现此关系，但脚注保留更贴近字面的另一理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。材料清单用“金线、蓝色线、紫色线、朱红色线和捻的细麻”保持清晰平行；避免古奥的“巧工带”等表达，同时保留祭司服饰术语“以弗得”。
