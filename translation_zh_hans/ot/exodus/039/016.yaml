base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/016.yaml
  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: zh_hans
  text: 他们做了两个金镶座[a]和两个金环，又把两个环安在胸牌的两端。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金托座”或“金花丝镶座”；这个希伯来词所指金饰的具体形制或工艺并不完全确定。
    reason: 保留 מִשְׁבְּצֹת 的词义范围，避免把它所指的金工作法或形制限定得过于具体。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 他们做了
  rationale: 以自然的现代汉语表达复数主语和叙事中的连续动作；“又”移至后一个并列分句，以体现希伯来语的承接关系。
- source_word: שְׁתֵּי מִשְׁבְּצֹת זָהָב
  choice: 两个金镶座[a]
  rationale: “镶座”符合祭司服饰的金工作品语境，又不把具体工艺限定得过死；希伯来词的精确形制并不完全确定，故加注保留其他可能。
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: 和两个金环
  rationale: “金环”是 טַבְּעֹת 在会幕器物及祭司服饰连接构件语境中的清楚、常用译法，并保留原文再次说明材质的结构。
- source_word: וַיִּתְּנוּ
  choice: 又把……安在
  rationale: נתן 在此表示放置、装设；“安在”适合把金环固定于胸牌的制作语境，也较符合现代汉语习惯。
- source_word: עַל שְׁנֵי קְצוֹת
  choice: 在……的两端
  rationale: 准确保留“两端”的具体空间关系；介词 עַל 在此按汉语习惯译作“在”。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: 这是祭司服饰语境中该词的标准、简明译法；本节无需重复完整称谓“决断胸牌”。
theological_decisions: []
