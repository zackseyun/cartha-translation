  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他们用蓝色细带[a]把胸牌的环系在以弗得的环上，使胸牌位于以弗得巧工织成的带子[b]上，不致从以弗得上松脱，正如雅威吩咐摩西的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “蓝色”也可理解为蓝紫色；原词指一种以特定染料染成的颜色。
    reason: lexical_alternative
  - marker: b
    text: 或译“以弗得的织带”；原词指与以弗得相连的装饰性带子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: 系在
  rationale: 该动词表示把服饰部件牢固连接起来；“系在”既符合用细带固定的具体动作，也自然易懂。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: 此词指大祭司胸前镶有宝石的礼仪服饰部件，并非防护用的铠甲；“胸牌”准确而简洁。
- source_word: מִטַּבְּעֹתָיו אֶל טַבְּעֹת הָאֵפֹד
  choice: 把胸牌的环系在以弗得的环上
  rationale: 按上下文补出“胸牌”，清楚表达两组环之间的连接关系，同时保持原文的方向感。
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: 用蓝色细带
  rationale: פְתִיל 指线、绳或细带状的系物；在服饰连接语境中，“细带”比“线”更稳妥。תְּכֵלֶת 是由特定染料制成的蓝色或蓝紫色，正文采用通行的“蓝色”，脚注保留色调上的可能性。
- source_word: חֵשֶׁב הָאֵפֹד
  choice: 以弗得精工织成的带子
  rationale: חֵשֶׁב 在此指与以弗得相连的装饰性织带；“精工织成的带子”兼顾其工艺性质和服饰功能。
- source_word: וְלֹא יִזַּח הַחֹשֶׁן מֵעַל הָאֵפֹד
  choice: 不致从以弗得上松脱
  rationale: יִזַּח 表示脱离、移开或滑脱；“松脱”切合固定服饰部件的语境。מֵעַל 的“从……上”空间关系也予以保留。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用神的专名四字神名 YHWH；“雅威”按其通常拟音直接呈现专名，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文是专名 YHWH。“雅威”直接音译通常重构的读音，既保留其专名性质，也避免以“上主”等称号代替；“耶和华”则源于另一种传统读法。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“胸牌”“以弗得”沿用易识别的礼仪服饰术语；句式基本顺从希伯来文的动作与目的结构，但调整为自然汉语。
