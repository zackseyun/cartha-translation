  text: 'and the third row: jacinth[a], agate[b], and amethyst.'
translation:
  language: zh_hans
  text: 第三行是红锆石[a]、玛瑙[b]和紫水晶。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 胸牌上几种古代宝石的确切种类难以确定；“红锆石”也可译作“琥珀”，旧式英语译名作“利古列石”（ligure）。
    reason: lexical_alternative
  - marker: b
    text: 或译“缟玛瑙”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: 第三行是
  rationale: טוּר在胸牌宝石清单中指宝石的“行列”。希伯来语以连词承接上文；中文按连续列举的自然表达，不另译为“并且”。
- source_word: הַשְּׁלִישִׁי
  choice: 第三
  rationale: 该序数词明确表示宝石排列中的第三行。
- source_word: לֶשֶׁם
  choice: 红锆石
  rationale: 这种古代宝石的确切所指不能确定；“红锆石”对应常见的jacinth鉴定，同时用脚注保留“琥珀”等可能译法。
- source_word: שְׁבוֹ
  choice: 玛瑙
  rationale: “玛瑙”是此处较常见的鉴定，但也可能指缟玛瑙，故在脚注中说明。
- source_word: וְאַחְלָמָה
  choice: 和紫水晶
  rationale: אַחְלָמָה通常被鉴定为紫水晶；前缀连词在本行最后一项前自然译作“和”。
