base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他们用蓝色、紫色和朱红色线，做了在圣所供职用的精制衣服[a]；又为亚伦做了圣衣，正如雅威所吩咐摩西的那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“供职服装”。这个希伯来语短语是专门用语，可能强调衣服用于圣所服事，也可能强调其制作精细。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: 用蓝色、紫色和朱红色线料
  rationale: 这些词在会幕语境中指染色纺织材料；“线料”明确其纺织用途，又不对古代染料的确切色调作过度限定。
- source_word: בִגְדֵי שְׂרָד
  choice: 精制服装
  rationale: שְׂרָד是专门用语，可能强调服装用于礼仪职事，也可能强调精细的制作工艺。正文采用符合纺织语境的“精制服装”，并以脚注保留功能性的译法。
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: 在圣所供职时穿的
  rationale: “供职”自然表达正式的祭司礼仪服事；“圣所”在此指会幕中的神圣领域，不武断限定为某一间特定内室。
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: 圣衣
  rationale: 采用简洁而庄重的固定表达，保留这些衣服被分别为圣、用于祭司职分的性质。
- source_word: לְאַהֲרֹן
  choice: 为亚伦
  rationale: 介词表示这些圣衣是为亚伦制作、供他使用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的通行学术读音音译为“雅威”，保留其作为上帝专名的性质，而不以称号替代。
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 正如雅威吩咐摩西的
  rationale: “正如”体现制作工作严格依照先前命令；汉语语境已自然表明该命令在先，无须另加时态标记。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用以色列上帝的专名。采用“雅威”较贴近YHWH的通行重构读音，并避免用“主”等称号取代专名。
- issue: בִגְדֵי שְׂרָד的性质
  choice: 精制服装
  alternative: 供职服装
  rationale: 该短语可能指精细制作的衣服，也可能主要指其圣所职事用途。正文结合纺织制作语境采用前者，脚注保留后者，不把词义争议转化为神学定论。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“供职”体现礼仪职事语境；“圣衣”简练自然。分号保留本节两个相关制作动作之间的层次。
