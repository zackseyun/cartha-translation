base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: zh_hans
  text: 他们用纯金做了铃铛，又把铃铛安放在袍子下摆四周的石榴饰物中间[a]；铃铛是在石榴饰物中间的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在石榴饰物之间”。希伯来语直译为“在石榴中间”，说明铃铛与石榴饰物的相对位置。
    reason: 词义存在可保留的空间关系表达差异；脚注呈现“之间”这一自然且可能的译法。
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 他们……做了
  rationale: 以自然的现代汉语承接制作过程，同时保留复数主语和完成的动作。
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: 用纯金做了铃铛
  rationale: 明确表达铃铛的材质及金子的纯度；中文用“用纯金做”比直译为“纯金的铃铛”更顺畅地连接动词。
- source_word: וַיִּתְּנוּ
  choice: 又把……安放
  rationale: 此处 נתן 指将物件放置在规定位置；“安放”比泛泛的“放”更符合礼服制作的庄重语境。
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: 在石榴中间
  rationale: 保留 בְּתוֹךְ 的空间关系及原文的“石榴”意象，不在正文中擅自增添“饰物”；其可理解为“在……之间”的可能性收入脚注。
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: 围绕袍子的下摆
  rationale: שׁוּלֵי 指衣服下缘，译为“下摆”自然准确；结合 סָבִיב 表明装饰环绕整圈。
- source_word: סָבִיב
  choice: 围绕
  rationale: 简洁表达沿袍子下摆四周环列的布局。
- source_word: בְּתוֹךְ הָרִמֹּנִים（重复）
  choice: 都是在石榴中间
  rationale: 原文重复该短语以再次说明铃铛的位置；正文保留重复，不将其省略或完全润色掉。
theological_decisions: []
