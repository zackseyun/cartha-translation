  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: zh_hans
  text: 他们又做了两个金环，安在胸牌的两个端头，即胸牌朝向以弗得的内侧边缘上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “朝向以弗得”也可译作“面对以弗得”或“与以弗得相对”。“内侧”所译原文直译为“向屋内”，在这里指胸牌靠近以弗得的一侧。
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: 金环
  rationale: טַבָּעַת在此指祭司服饰上用于连接的环；“金环”自然简洁，并保留材质信息。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: חֹשֶׁן指大祭司所佩戴、与以弗得相连的礼仪物件；“胸牌”比容易让人联想到铠甲的“胸甲”更贴合此处。
- source_word: שְׂפָתוֹ
  choice: 那一边缘
  rationale: שָׂפָה本义可指唇、边或边缘；用于制成品时译作“边缘”清楚自然，指明金环安放的位置。
- source_word: שְׁנֵי קְצוֹת
  choice: 两端
  rationale: קָצֶה表示末端或尽头；“两端”保留原文空间表述，不擅自具体化为“两角”。
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד
  choice: 朝向以弗得
  rationale: 该短语描述胸牌边缘与以弗得的空间关系；עֵבֶר在这里可表达朝向、面对或相对的一侧，因此正文采用自然且不过度限定的“朝向”。
- source_word: בָּיְתָה
  choice: 向内
  rationale: 这是בַּיִת的方向形式，字面为“向屋内”，在此作副词表示朝里面；“向内”保留其方向意义，并与前面的空间说明结合。
- source_word: וַיָּשִׂימוּ עַל
  choice: 安在……上
  rationale: שׂוּם עַל意为放置、安放在某处；在服饰制作语境中，“安在……上”比一般性的“放在”更贴切。
theological_decisions: []
