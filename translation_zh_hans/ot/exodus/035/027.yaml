base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/027.yaml
  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: zh_hans
  text: 首领们带来了红玛瑙[a]和供镶嵌的宝石，供以弗得和胸牌[b]使用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“琐罕宝石”。希伯来语所指的宝石种类不能确定；“红玛瑙”是传统译法。
    reason: lexical_alternative
  - marker: b
    text: 或译“胸袋”。这里指祭司佩在胸前的礼仪饰物，并非护身的铠甲。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: 首领们
  rationale: נְשִׂיאִים在此指以色列群体中的领袖或族长；“首领们”自然、清楚，也不会像“王子们”那样暗示王室身份。
- source_word: הֵבִיאוּ
  choice: 带来了
  rationale: בוא的使役式在此表示把奉献之物带来；“带来了”符合现代汉语，也保留原文朴素的叙事语气。
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: 红玛瑙
  rationale: שֹׁהַם所指矿物不能确定；“红玛瑙”是中文圣经传统中较熟悉的译名，因此正文沿用，并以脚注说明不确定性。
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: 镶嵌用的宝石
  rationale: מִלֻּאִים在珠宝及礼仪器物语境中指供镶入或安置的宝石；此译法自然表达其用途，避免生硬直译为“填充之石”。
- source_word: לָאֵפֹד
  choice: 供以弗得……使用
  rationale: אֵפֹד是祭司所穿的特定礼服，现代汉语没有完全对应的普通名词；采用已经通行的音译“以弗得”。
- source_word: וְלַחֹשֶׁן
  choice: 和胸牌使用
  rationale: חֹשֶׁן指佩在祭司胸前并与以弗得相连的礼仪饰物；“胸牌”比“胸甲”更不容易使人误以为是防护盔甲。
theological_decisions: []
