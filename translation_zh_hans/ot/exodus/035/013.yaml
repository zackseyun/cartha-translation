base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/013.yaml
  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: zh_hans
  text: 桌子、桌子的杠、桌子的一切器具，以及陈设饼[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “陈设饼”也可译作“临在之饼”，字面意思是“面前的饼”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 原文仅称这件圣所器物为“桌子”；其用途由后面的“陈设饼”说明，不在此处增译。
- source_word: בַּדָּיו
  choice: 桌子的杠
  rationale: בַּד 在会幕语境中指搬运圣物所用的杠。“杠”简洁自然；重复“桌子的”可避免单说“它的”可能产生的指代含混。
- source_word: כָּל כֵּלָיו
  choice: 桌子的一切器具
  rationale: כְּלִי 可泛指器具、用具或器皿；此处“一切器具”既保留其宽泛含义，也符合桌子配套圣物的语境。
- source_word: לֶחֶם הַפָּנִים
  choice: 陈设饼
  rationale: 这是该礼仪用饼在现代中文圣经语境中清楚而庄重的惯用名称；脚注补出更贴近希伯来语字面的译法，以保留“面前／临在”的含义。
theological_decisions:
- issue: לֶחֶם הַפָּנִים 中“面／临在”的所指
  choice: 正文采用传统且易懂的“陈设饼”，不在正文中明说是谁的“面前”。
  alternative: 临在之饼；摆在耶和华面前的饼
  rationale: 希伯来语字面为“面之饼／临在之饼”，经文本身在本节没有明说“耶和华”。将其解释为“摆在耶和华面前”虽符合礼仪背景，却比本节原文更明确，因此仅在脚注中提供较直译形式，不把解释写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。保留原文并列列举的结构；为使本节作为较长清单中的片段读起来自然，使用顿号与“以及”。脚注标记置于“桌子”后，沿用所给咨询层的位置，但脚注内容说明本节较需要交代的礼仪术语“陈设饼”。
