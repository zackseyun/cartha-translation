base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: zh_hans
  text: 你们要从你们中间拿出奉献物，献给雅威[a]。凡心里甘愿的，就当把这献给雅威的奉献物带来：金、银和铜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自希伯来文神名יהוה；也常译作“耶和华”或“上主”。
    reason: 说明神名的原文形式及主要译法。
  - marker: b
    text: “铜”也可译作“青铜”；这个希伯来词可指铜或铜合金。
    reason: 保留古代金属名称在具体成分上的词义宽度。
lexical_decisions:
- source_word: קְחוּ מֵאִתְּכֶם
  choice: 你们要从自己中间收取
  rationale: קְחוּ是复数命令式，מֵאִתְּכֶם表示来源于群体内部。“从自己中间收取”既保留向会众发出的直接命令，也自然衔接下文各人自愿带来的材料。
- source_word: תְּרוּמָה
  choice: 礼物
  rationale: 此处指分别出来、献作圣所用途的物品。“礼物”适合随后列出的金属材料，也避免把该词窄化为金钱或某种特定礼仪动作。
- source_word: לַיהוָה / יְהוָה
  choice: 献给雅威／雅威的
  rationale: ל介词表示归属和奉献的对象；第二处为构造结构。采用“雅威”直接呈现四字神名，并分别按句法译作“献给雅威”和“雅威的”。
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: 凡心里甘愿的
  rationale: 保留“心”的意象，并自然表达נְדִיב在此所指的自愿、乐意的内在态度；不添加原文没有的性别限定。
- source_word: יְבִיאֶהָ
  choice: 都要把……带来
  rationale: 使役词干未完成式在命令语境中表达应有的行动，阴性后缀回指תְּרוּמָה。“带来”准确表达把奉献物送到指定地点，同时不把自愿奉献说成强迫。
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: 金、银和铜
  rationale: 前两项直译为“金、银”。נְחֹשֶׁת可泛指铜或铜合金；正文用较宽泛的“铜”，脚注说明“青铜”这一合乎古代器物语境的译法。
theological_decisions:
- issue: 如何译出神名יהוה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”旨在呈现这一盟约之名，而不是以称号替代；脚注交代希伯来文本形式及常见译法。
- issue: 奉献行为的自愿性与命令语气
  choice: 保留对会众的命令，同时将奉献者限定为“心里甘愿的”
  alternative: 把每个人都表述为必须奉献
  rationale: 经文一方面命令会众收取礼物，另一方面明确说带来礼物的是内心甘愿的人。译文保留这种并置，不把自愿性消解为普遍强制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“从自己中间收取”保留群体语境；“凡心里甘愿的”保留希伯来文的心灵意象和自愿意味。句式依照原文先命令、后说明奉献者与材料的推进方式。
