  rationale: 修订仅澄清中文中“收取”的方向性歧义，并以“奉献物”准确呈现本节的圣所贡献。保留原文的双重表达：会众被吩咐提出奉献，而实际带来者是心里甘愿的人；不将其扩展为所有人必须奉献。脚注锚点及内容均保留，并继续以脚注保存“铜／青铜”的不确定性。
