base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: zh_hans
  text: 凡有蓝色线、紫色线、朱红色线、细麻、山羊毛、染红的公羊皮和塔哈施皮[a]的人，都把这些带来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “塔哈施”音译自希伯来语；所指的动物或材料尚不能确定。有人译作“上等皮革”“海豚皮”或“儒艮皮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ אֲשֶׁר נִמְצָא אִתּוֹ
  choice: 凡有……的
  rationale: 原文直译近于“凡在他那里找到……的人”。中文用“凡有……的”自然表达逐一列举拥有这些材料之人，同时保留概括性，不必把语法阳性 אִישׁ 强化为只指男性。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 蓝色线、紫色线、朱红色线
  rationale: 在会幕材料的语境中，这几个词指染色的纺织材料；译作“线”使其具体清楚，并保持三项平行。
- source_word: שֵׁשׁ
  choice: 细麻
  rationale: 该词在祭司与会幕语境中通常指优质细麻；“细麻”是简洁、通行的中文表达。
- source_word: עִזִּים
  choice: 山羊毛
  rationale: 字面为“山羊”，但在此材料清单中指制作帐幕遮盖物所用的山羊毛；明确译出所指材料可避免误解为活羊。
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: 染红的公羊皮
  rationale: 准确表达公羊皮经过染红处理，并保留原文修饰关系。
- source_word: עֹרֹת תְּחָשִׁים
  choice: 塔哈施皮
  rationale: תְּחָשׁ 所指动物或皮革种类不能确定；音译可避免把有争议的鉴定当作定论，并由脚注说明。
- source_word: הֵבִיאוּ
  choice: 都拿了来
  rationale: 复数动词概括拥有上述材料之人的行动；“拿了来”在现代中文中自然，也符合把材料带到奉献地点的语境。
theological_decisions: []
