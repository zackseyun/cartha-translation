  yaml_path: translation/ot/exodus/035/006.yaml
  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: zh_hans
  text: 蓝色线、紫色线、朱红色线、细麻和山羊毛[a]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“山羊”；这里按会幕材料的语境理解为山羊毛。
    reason: 说明原文字面形式与语境所指之间的差别。
lexical_decisions:
- source_word: תְכֵלֶת
  choice: 蓝色线
  rationale: 该词指蓝色或蓝紫色的染色织料；在会幕材料清单中译作“蓝色线”，既交代颜色，也明确其纺织材料属性。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 该词指紫色染料染成的织料。与前后各项并列译作“紫色线”，符合现代汉语表达，也保留清单的对称性。
- source_word: תוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 这一词组指以虫源染料染成的鲜红色材料；“朱红色线”准确表达成色与纺织用途，而不把字面上的“虫”带入正文。
- source_word: שֵׁשׁ
  choice: 细麻
  rationale: 在会幕语境中通常指质地精细的麻织材料。“细麻”简洁自然，并避免在原文未明说成品布匹时限定为“麻布”。
- source_word: עִזִּים
  choice: 山羊毛
  rationale: 原文形式直译为“山羊”，但在这份建造会幕的材料清单中，所指是用于纺织的山羊毛；正文明确隐含的材料意义，以免误解为活羊。
- source_word: וְ
  choice: 顿号及“和”
  rationale: 希伯来文在每项前重复连接词。现代汉语列举通常以顿号连接，并在末项前用“和”；这样自然清楚，同时保留各项并列关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的材料清单用语。三个颜色词均补出“线”，使其与纺织语境相符；分号表明本节在句法上仍属于上下文延续的清单。
