lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香坛
  rationale: 该结构表示与焚香有关的坛。“香坛”是现代中文圣经语境中简洁、明确且自然的名称。
- source_word: בַּדָּיו
  choice: 坛的抬杠
  rationale: 此词在会幕语境中指搬运圣物所用的杠；补出“坛的”以避免中文代词指向含混，“抬杠”也准确表达其用途。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 这是礼仪用语，指用于膏抹的油；“膏油”简明且保留原文的礼仪含义。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 芬芳的香
  rationale: סַמִּים指芳香香料或香料成分；“芬芳的香”自然表达其香气特征，同时不把结构过度具体化为某一种配方。
- source_word: מָסַךְ הַפֶּתַח
  choice: 入口的门帘
  rationale: מָסָךְ在会幕描述中指悬挂于入口处、起遮隔作用的帘子；“门帘”比“屏风”更符合其织物形态。
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: 会幕入口的
  rationale: 介词ל在这里表明门帘所对应或服务的位置。整合为“会幕入口的门帘”，既自然又忠实于希伯来语关系。
- source_word: הַמִּשְׁכָּן
  choice: 会幕
  rationale: “会幕”是中文中对出埃及记圣所帐幕的通行称呼，能稳定、准确地指向同一建筑。
