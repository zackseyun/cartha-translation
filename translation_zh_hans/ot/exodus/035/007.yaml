lexical_decisions:
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: 染红的公羊皮
  rationale: עֹרֹת אֵילִם意为“公羊皮”；מְאָדָּמִים是表示处理结果的被动形式，指皮被染成或制成红色。“染红的”在现代汉语中自然且准确。
- source_word: עֹרֹת תְּחָשִׁים
  choice: 塔哈示皮
  rationale: תְּחָשׁ所指动物无法确定。采用音译可避免把“海牛”“儒艮”等有争议的鉴定写入正文，并由脚注说明主要译法。
- source_word: עֲצֵי שִׂטִּים
  choice: 金合欢木
  rationale: 该词组指皂荚类金合欢树的木材；“金合欢木”是清楚、通行的现代汉语表达。
