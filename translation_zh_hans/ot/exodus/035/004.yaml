  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: zh_hans
  text: 摩西对以色列子孙的全体会众[a]说：“这是耶和华[b]所吩咐的事[c]：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”是指以色列民整体；“会众”也可译为“集会”或“会集”。
    reason: 说明בְּנֵי יִשְׂרָאֵל作为以色列民的固定称谓，并保留עֲדָה的词汇替代。
  - marker: b
    text: “耶和华”对应希伯来文יהוה，即上帝的名字；也常拟音作“雅威”。
    reason: 说明四字神名的中文呈现及常见拟音。
  - marker: c
    text: “事”原文也可译为“话”或“事项”；句末冒号承接下一节所述的命令内容。
    reason: 说明דָּבָר的语义范围，以及לֵאמֹר在中文中以标点引出后文的处理。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；现代汉语不必另加“然后”，上下文即可表达承接关系。
- source_word: עֲדַת
  choice: 会众
  rationale: 指作为整体、并聚集在一起的以色列群体；“会众”既保留群体性，也符合现代中文圣经语体。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列
  rationale: 在“以色列全会众”中，בְּנֵי יִשְׂרָאֵל标明会众的归属。希伯来语这一固定表达指以色列民族整体，中文直译为“以色列众子”容易被误解为只包括男性；脚注保留“以色列子孙”这一形式对应较明显的译法。
- source_word: זֶה הַדָּבָר
  choice: 这是……的事
  rationale: דָּבָר可指“话、事、事项”。这里引出关于奉献之物的命令，译作“事”既保留词义宽度，也比单译“话”更贴合语境；脚注注明另一可能。
- source_word: צִוָּה
  choice: 所吩咐
  rationale: 表示耶和华已经发出的权威命令；“所吩咐”自然地构成关系分句。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以中文读者熟悉的专名音译来呈现四字神名，而不以“主”这一称号替代。
- source_word: לֵאמֹר
  choice: 冒号引出后文
  rationale: 句末לֵאמֹר引出下一节命令的具体内容；现代汉语用冒号比另译“说”更自然，并避免连续出现两个“说”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。正文保留专名而不以称号“主”替代；“耶和华”是现代中文读者最熟悉的专名形式，脚注说明其性质及另一常见拟音。
- issue: בְּנֵי יִשְׂרָאֵל是否限定男性
  choice: 按民族整体译为“以色列全会众”
  alternative: 以色列子孙的全会众；以色列众子
  rationale: 该短语虽为阳性复数形式，却是指以色列民族成员的惯用名称；本节又明确称“全会众”。译文不将其误限为成年男性，同时在脚注保留较形式对应的传统表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。句末以冒号承接下一节，功能上表达希伯来文לֵאמֹר；保留开引号，因为命令内容将在后文继续。
