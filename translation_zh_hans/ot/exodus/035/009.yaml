  text: onyx stones[a], and stones for setting, for the ephod and for the breastpiece.
translation:
  language: zh_hans
  text: 红玛瑙[a]和镶嵌用的宝石，用于以弗得和胸牌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语 שֹׁהַם（shoham）所指的宝石品种不能确定，传统上常译作“红玛瑙”；也可能是缟玛瑙或绿柱石。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: 红玛瑙
  rationale: שֹׁהַם 指一种宝石，确切品种不明。中文圣经传统多译作“红玛瑙”，正文沿用这一便于识别的名称，并以脚注保留不确定性。
- source_word: אַבְנֵי מִלֻּאִים
  choice: 镶嵌用的宝石
  rationale: מִלֻּאִים 在祭司服饰语境中指供嵌入或镶装的宝石；此译自然表达其用途。
- source_word: לָאֵפֹד
  choice: 用于以弗得
  rationale: אֵפֹד 是祭司礼服的专门名称；采用中文圣经中通行的音译“以弗得”，保留礼仪上的特指。
- source_word: וְלַחֹשֶׁן
  choice: 和胸牌
  rationale: חֹשֶׁן 指佩在胸前、镶有宝石的祭司礼仪物件。“胸牌”避免使人误解为军用护甲，并符合现代中文表达。
