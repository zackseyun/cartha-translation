  naturalness: “抬杠”虽可指抬运用的杠子，但在现代普通话中最常见的是“故意争辩、唱反调”的动词义，置于正文会造成明显歧义和不必要的口语联想。“柜的杠”是圣经汉语中自然且清楚的说法。
