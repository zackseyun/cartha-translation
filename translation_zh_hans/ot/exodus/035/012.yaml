  yaml_path: translation/ot/exodus/035/012.yaml
  text: the ark and its poles[a], the mercy seat, and the veil of the screen,
translation:
  language: zh_hans
  text: 约柜和柜的杠、施恩座[a]，以及遮隔的幔子；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎罪盖”。
    reason: 保留 הַכַּפֹּרֶת 的可行直释及其赎罪礼仪含义。
lexical_decisions:
- source_word: הָאָרֹן
  choice: 柜
  rationale: 在会幕语境中指神圣的约柜；原文此处只用“柜”而未出现“约”字，因此正文采用“柜”，既承接上下文，也避免增添原文没有的限定。
- source_word: בַּדָּיו
  choice: 柜的抬杠
  rationale: בַּדִּים 指搬运圣所器具所用的长杠。“抬杠”在现代汉语中清楚表达其搬运用途；加上“柜的”明确所属关系。
- source_word: הַכַּפֹּרֶת
  choice: 施恩座
  rationale: 该词指柜上的金盖，并具有赎罪礼仪含义。“施恩座”是中文圣经语境中成熟、可辨识的称呼；另将较直释的“赎罪盖”保留在脚注中。
- source_word: פָּרֹכֶת
  choice: 幔子
  rationale: 该词指会幕内部起分隔作用的帘幔。“幔子”既符合圣所语境，也保留其作为隔帘的性质。
- source_word: הַמָּסָךְ
  choice: 遮隔
  rationale: מָסָךְ 有遮蔽、隔断之物的意思；与 פָּרֹכֶת 构成短语时译作“遮隔的幔子”，既体现两个词的意义，又不武断判定为用途或同位关系。
- source_word: אֶת / וְאֶת
  choice: 不单独译出
  rationale: 这些词是希伯来语的定指直接宾语标记；其并列关系由汉语顿号、“以及”和标点表达。
theological_decisions:
- issue: הַכַּפֹּרֶת 在会幕礼仪语境中的译法
  choice: 施恩座
  alternative: 赎罪盖
  rationale: 该词既具体指柜盖，又承载赎罪礼仪关联。“施恩座”保留传统礼仪称谓及其神学分量；“赎罪盖”更直接显明物件形态和赎罪关联，因此列作脚注异译，不在正文中消除这层词义张力。
translation_notes:
  register: 采用现代、庄重而易懂的圣所用语。经文是清单中的片段，保留并列列举的节奏；“柜”忠实于本节原文，“抬杠”避免古雅难懂的“杠杆”或“扛抬之杠”，“遮隔的幔子”则保留希伯来语复合表达的含混度。脚注标记置于其实际说明的“施恩座”之后。
