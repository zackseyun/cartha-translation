base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: zh_hans
  text: 六日可以做工；但第七日对你们要成为圣日，是归雅威[b]的安息日，是完全安息的日子[a]。凡在这日做工的，必被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“是完全安息的安息日”或“是庄严安息的安息日”。希伯来语以同源词组合“安息日，完全安息”加强彻底停止工作的意思。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语也可理解为“向雅威”或“为雅威”，表示这安息日归属于他、奉献给他或以他为指向。
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: 可以做工
  rationale: 原文用尼法勒未完成式表达“工作可被做／得以进行”。“可以做工”在现代汉语律法语境中自然，也保留许可意味，没有改写成直接命令。
- source_word: קֹדֶשׁ
  choice: 圣日
  rationale: 原文意为“圣／分别为圣之物”。结合“第七日”的语境译作“圣日”，既自然又不削弱其分别为圣的性质。
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: 安息日，要完全歇工
  rationale: 这一同源词组合强化停止工作的含义。“完全歇工”清楚传达 שַׁבָּתוֹן 所强调的彻底停歇，同时以脚注保留更贴近形式的译法。
- source_word: לַיהוָה
  choice: 归雅威的
  rationale: 介词 ל 可表示归属、奉献或指向；“归雅威的”适合此处，并以脚注保留“向雅威／为雅威”的可能性。
- source_word: כָּל־הָעֹשֶׂה בּוֹ מְלָאכָה
  choice: 凡在这日做工的
  rationale: “凡……的”准确表达概括所有相关个案的律法结构；“在这日”明确 בּוֹ 回指第七日。
- source_word: יוּמָת
  choice: 必被处死
  rationale: מות 的使役被动式表示“被处死”；“必”表达确定的律法刑罚。原文此处没有加强语气的不定词绝对式，因此不另加“必要”一类双重强调。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名 יהוה。“雅威”以现代汉语音译呈现这一盟约之名，不以称号“上主”代替；“耶和华”是传统音译，但较不符合通常接受的古希伯来语发音重构。
- issue: לַיהוָה 所表达的关系
  choice: 归雅威的
  alternative: 向雅威；为雅威
  rationale: 介词 ל 在此可表达归属、奉献或朝向。正文采用自然的“归雅威的”，脚注说明其他可能，以免把原文语义范围限定得过窄。
translation_notes:
  register: 采用现代、庄重而易懂的律法表述。“六日可以做工”保留原文非人称被动所带的许可色彩；“对你们来说应当是圣日”对应 לָכֶם קֹדֶשׁ，避免把“圣”仅理解为主观敬虔。“完全歇工”比“庄严安息”更直接传达停止劳动的核心含义。
