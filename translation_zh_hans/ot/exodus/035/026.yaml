  text: And all the women whose hearts moved them with skill spun the goats' hair[a].
translation:
  language: zh_hans
  text: 凡心受感动的妇女，都凭着巧艺纺山羊毛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“山羊”；这里省略了“毛”，所指的是用来纺线的山羊毛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: 凡……的妇女，都
  rationale: כָּל与复数名词连用表示全体；汉语用“凡……都”自然呈现这一周遍意义。
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: 心里受感
  rationale: 原文直译近于“她们的心把她们举起”，是指内心受到激励、驱使的习语。“心里受感”简洁自然，并保留内在推动的意味。
- source_word: בְּחָכְמָה
  choice: 有巧艺
  rationale: 在制作会幕用品的语境中，חָכְמָה主要指实际的工艺才干，而非抽象智慧；“巧艺”符合手工纺织语境。
- source_word: טָווּ
  choice: 纺
  rationale: 该动词指把纤维纺成线；现代汉语“纺”准确而简洁。
- source_word: אֶת הָעִזִּים
  choice: 山羊毛
  rationale: 原文表面为“山羊”，但在纺织语境中省略了“毛”；正文补出隐含成分，以免读者误以为妇女在纺活山羊，同时用脚注说明原文形式。
