lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: 香料
  rationale: 该词指芳香物质、香料或香膏。此处处于会幕材料清单中，用“香料”自然、具体，也不把词义过度限定为某一种香膏。
- source_word: הַשָּׁמֶן
  choice: 油
  rationale: 原文只说“油”，并未在本节明确限定为橄榄油，因此不作增译。
- source_word: לְמָאוֹר
  choice: 点灯用的
  rationale: 原词可指光或发光之物；在会幕用品的语境中，说明油的用途。译作“点灯用的”符合现代汉语，也避免添加原文未明说的某一盏灯。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 这是指用于膏抹的油。“膏油”是简洁、庄重且在本语境中清楚的译法。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 香料制成的香
  rationale: 保留“香”与“香料”两个名词所表达的关系，表明这是由芳香材料制成、用于焚烧的香。
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: 、……、……，以及……
  rationale: 原文以多个连接成分延续上一节的供物清单。中文用顿号并在末项前加“以及”，既保留列举结构，也符合自然行文。
