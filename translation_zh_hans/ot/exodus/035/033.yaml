  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
translation:
  language: zh_hans
  text: 又能雕琢镶嵌用的宝石，雕刻木头，做各样经过精巧设计的工艺工作。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“做各样精巧的工艺工作”或“做各样艺术性的工艺工作”。希伯来语所用的词含有经过构思、设计或凭技巧制作的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: 雕琢／雕刻
  rationale: 同一名词分别与石和木连用，表示熟练加工材料的工艺；按汉语对不同材料的自然搭配，译为“雕琢”宝石和“雕刻”木头。
- source_word: אֶבֶן לְמַלֹּאת
  choice: 镶嵌用的宝石
  rationale: אֶבֶן在此泛指供工艺使用的石料；结合会幕工匠语境，לְמַלֹּאת指将宝石嵌入托座或饰件，故译为“镶嵌用的宝石”。
- source_word: עֵץ
  choice: 木头
  rationale: 此处指作为工艺材料的木材，而非活着的树；“木头”通俗自然。
- source_word: לַעֲשׂוֹת בְּכָל מְלֶאכֶת
  choice: 做各样……的工艺
  rationale: 保留עשה的宽泛动作义和בכל מלאכת所表达的各种工匠工作，同时使现代汉语顺畅。
- source_word: מַחֲשָׁבֶת
  choice: 精巧设计的
  rationale: 该词源于“构思、筹划”的语义范围，在工艺语境中强调经过设计、富有技巧的制作；“精巧设计的”兼顾设计性与技艺性，未将含义限缩为单纯“熟练”。
