  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: zh_hans
  text: 在圣所[b]里供职时穿的精工编织的衣服[a]、祭司亚伦的圣衣，以及他儿子们担任祭司所穿的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“供职用的衣服”；这里的希伯来语可能指特制的编织衣服，也可能强调其供职用途。
    reason: lexical_alternative
  - marker: b
    text: 或译：“圣处”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: 精工编织衣服
  rationale: הַשְּׂרָד在会幕语境中的确切含义不完全确定，可能指特制的编织衣物，也可能强调其供职用途。“精工编织衣服”表达其纺织制作的可能含义，同时以脚注保留“供职用的衣服”这一译法。
- source_word: לְשָׁרֵת
  choice: 供职时穿的
  rationale: 该动词在圣所语境中指履行礼仪职务；结合“衣服”，译成“供职时穿的”在现代汉语中自然，并保留其用途含义。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣所里
  rationale: קֹדֶשׁ在会幕语境中指神圣的场所或区域。“圣所”简明自然；脚注保留较具体的“圣处”这一可能译法。
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: 圣衣
  rationale: 该结构直译为“神圣的衣服”，在祭司服饰语境中用“圣衣”既简洁庄重，又不引入后世教会术语。
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: 祭司亚伦的
  rationale: 自然表达亚伦的职分及这些圣衣的归属。
- source_word: בִּגְדֵי בָנָיו
  choice: 他儿子们……所穿的衣服
  rationale: 清楚表达衣服属于亚伦众子，并与后面的祭司职务用途衔接。
- source_word: לְכַהֵן
  choice: 担任祭司
  rationale: 该动词表示履行祭司职分；“担任祭司”清楚保留其动词性质。
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד与בִּגְדֵי הַקֹּדֶשׁ之间的关系
  choice: 把前者译作一类在圣所供职时使用的精工编织衣服，后者则是祭司亚伦的圣衣，并另列其儿子们的衣服。
  alternative: 把前后两项视为同位表达，认为“精工编织衣服”只是对亚伦及其儿子祭司圣衣的另一种描述。
  rationale: 经文重复使用宾格标记אֶת，较支持把这些项目分别列出；但它们在神圣用途上可能有所重叠，因此不添加超出原文的功能细节。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“供职”保留圣所礼仪服务的语感；“担任祭司”避免含混，也不引入特定宗派术语。标点按清单式经文片段处理。
