  yaml_path: translation/ot/exodus/035/003.yaml
  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: zh_hans
  text: 安息日这一天，不可在你们的任何住处生火。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: 生火
  rationale: בער的Piel形在此指点燃、燃起火。“生火”是现代汉语中自然且准确的表达，既不同于范围较广的“焚烧”，也不暗示维持或使用既有火焰。
- source_word: אֵשׁ
  choice: 火
  rationale: 该单数名词指所点燃的火；汉语“生火”通常无需另加量词，表达自然并忠实于原意。
- source_word: בְּכֹל
  choice: 任何
  rationale: כֹּל在复数“住处”前具有逐一涵盖的分配意义；“任何”清楚表明禁令适用于每一个住处。
- source_word: מֹשְׁבֹתֵיכֶם
  choice: 你们……住处
  rationale: מוֹשָׁב可指居住之处。“住处”比“家里”范围更宽，也避免“定居点”可能带来的公共地域含义。
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: 安息日这一天
  rationale: 保留原文中“日”的明确成分，并以自然的现代汉语标明时间。
theological_decisions:
- issue: 安息日有关火的禁令范围
  choice: 直接译为不可生火
  alternative: 扩大译为不可用火、不可让火燃烧，或按后来的律法解释加以改写
  rationale: 希伯来文本明确禁止在安息日于住处生火。译文据此陈述，不把经文未明说的维持火焰、使用火或一切涉及热力的活动纳入译文，也不预先裁定后来的解释争议。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“不可”保持诫命语气；语序先标明时间，再陈述适用于所有住处的禁令，便于普通读者理解。
