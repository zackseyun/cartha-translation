  text: the tabernacle[a], its tent, and its covering; its clasps, its boards, its bars, its pillars, and its bases[b];
translation:
  language: zh_hans
  text: 帐幕、帐幕的帐棚和遮盖；帐幕的扣钩、板[a]、横闩、柱子和底座[b]；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “板”（קְרָשָׁיו）或译“框架”；若该词描述的是框架式结构，而不是实心木板，可作此译。
    reason: lexical_alternative
  - marker: b
    text: “底座”（אֲדָנָיו）或译“卯座”，强调它们是承接、固定结构构件的座体。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 在圣所语境中指耶和华住在以色列人中间的神圣居所；“帐幕”是现代中文圣经语体中准确而通行的名称。
- source_word: אָהֳלוֹ
  choice: 帐幕的帐棚
  rationale: אָהֶל意为“帐棚”；其第三人称阳性单数后缀在语法上回指帐幕。明确译出“帐幕的”，既保留原文中“帐幕”与其帐棚部分的区别，也避免连续使用“它的”造成含混。
- source_word: מִכְסֵהוּ
  choice: 遮盖
  rationale: מִכְסֶה指覆盖物，在此为帐幕的保护层；译作“遮盖”保留原文未明说材质的概括性。
- source_word: קְרָסָיו
  choice: 扣钩
  rationale: קֶרֶס指连接幔子或覆盖层的构件；“扣钩”自然地兼顾其扣合功能与钩状形态。
- source_word: קְרָשָׁיו
  choice: 板
  rationale: קֶרֶשׁ通常指帐幕结构中的板材；“板”直截了当，同时以脚注保留“框架”的结构性理解。
- source_word: בְּרִיחָיו
  choice: 横闩
  rationale: בְּרִיחַ指固定并连接帐幕板的横向杆件；“横闩”比泛称“闩”更清楚地表达其结构功能。
- source_word: עַמֻּדָיו
  choice: 柱子
  rationale: עַמּוּד指直立的支撑构件；“柱子”是现代中文自然、清楚的建筑用语。
- source_word: אֲדָנָיו
  choice: 底座
  rationale: אֶדֶן在帐幕语境中指承托或容纳柱、板等结构构件的基座或插座；“底座”清楚易懂，并以脚注保留“卯座”这一更强调承插功能的译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。按希伯来语逐项列举帐幕构件；为避免多个物主代词累赘，仅在“帐棚”处明确所属，后续并列名词依中文习惯共同隶属于“帐幕”。原文为承接上下文的名词清单，因此保留句末分号。
