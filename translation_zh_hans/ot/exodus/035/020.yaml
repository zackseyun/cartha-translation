lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: 于是……离开了
  rationale: 该叙事性动词形式推进事件；“于是”表达承接关系，“离开”自然传达 יצא 在此处“出去、离去”的含义。
- source_word: כָּל עֲדַת
  choice: 全体会众
  rationale: כָּל 强调整体，עֵדָה 指作为一个群体的以色列共同体；“全体会众”兼顾完整性与现代汉语的自然表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，但在此是民族共同体的固定称呼；现代汉语用“以色列人”准确、自然，也不误导为仅指男性。
- source_word: מִלִּפְנֵי
  choice: 从……面前
  rationale: 保留希伯来语的空间性惯用表达，表示他们离开摩西所在之处。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经传统中通行的人名译法。
