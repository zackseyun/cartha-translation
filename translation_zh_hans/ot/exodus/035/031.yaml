- from: 又使他充满神的灵[a]，有智慧、聪明、知识，以及从事各样工艺的才能[b]。
  to: 又以神的灵[a]充满他，使他有智慧、悟性、知识，并通晓各样工艺[b]。
  rationale: 修订以“以神的灵充满他”较直接对应原文动词及其后连续的介词短语。“使他有”将智慧、悟性、知识按现代汉语自然展开；“并通晓各样工艺”既反映会幕工艺的语境，也不把末项本身改成额外的抽象“才能”。脚注保留“神的灵”的解释余地和 מְלָאכָה 的较宽词义。
