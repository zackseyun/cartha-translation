  naturalness: “智慧、聪明、知识”虽可理解，但在庄重现代书面语中，“智慧、悟性、知识”更能对应三项抽象禀赋，也避免“聪明”偏口语化或偏性格评价。“使他充满……，使他有……”的重复不够凝练；以“以……充满他”可自然地让所有介词性成分统一受“充满”支配。
