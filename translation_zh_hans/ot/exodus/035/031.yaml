base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: zh_hans
  text: 又以神的灵[a]充满他，使他有智慧、悟性、知识，并通晓各样工艺[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神的灵”也可理解为“属神的灵”或“神所赐的灵”。这里很可能是指神自己的灵赐下能力。
    reason: alternative_reading
  - marker: b
    text: 也可译作“各样工作”或“各门手艺”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֹתוֹ
  choice: 又使他充满
  rationale: 将叙事性的连续动词译为“又使……充满”；主语承接上文的耶和华，宾语“他”指比撒列。这样的语序符合现代汉语，同时保留“充满”的核心意象。
- source_word: רוּחַ אֱלֹהִים
  choice: 神的灵
  rationale: 构造短语直译为“神的灵”。在本段语境中，它最自然地指神所赐、使人胜任圣所工作的灵；汉语不以大小写区分“灵／圣灵”，因此正文保留原文较宽的措辞，并用脚注说明歧义。
- source_word: בְּחָכְמָה
  choice: 有智慧
  rationale: חָכְמָה既可指一般智慧，也可在工艺语境中指受神赋予的巧思和能力；译作“智慧”保留其宽广含义。
- source_word: בִּתְבוּנָה
  choice: 聪明
  rationale: תְבוּנָה表示理解力、洞察力或明辨能力。“聪明”在此与“智慧、知识”组成自然且庄重的并列结构。
- source_word: וּבְדַעַת
  choice: 知识
  rationale: דַּעַת的基本意义是“知识”。虽处于工艺语境，仍不将其窄化为纯粹的技术或技巧。
- source_word: וּבְכָל מְלָאכָה
  choice: 以及从事各样工艺的才能
  rationale: מְלָאכָה可指工作、制作或工艺；结合会幕建造的语境，译为“各样工艺”最贴切。补出“从事……的才能”，使其与“使他充满”及前列恩赋在现代汉语中衔接自然。
theological_decisions:
- issue: רוּחַ אֱלֹהִים应理解为神自己的灵，还是较一般的属神之灵或神所赐的能力
  choice: 正文译作“神的灵”
  alternative: “属神的灵”或“神所赐的灵”
  rationale: 上下文强调神亲自装备比撒列承担圣所工作，因此“神的灵”最符合语境；但原文短语本身仍容许较一般的理解，故不直接改译为更具后期术语色彩的“圣灵”，并在脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而通顺的书面普通话。正文保留“智慧、聪明、知识”的三项并列，不将其合并为笼统的“技能”；末项按会幕工艺语境译得较具体，同时以脚注保留 מְלָאכָה 较宽的“工作／手艺”语义。
