  text: the hangings of the court[a], its pillars and its bases[c][b], and the screen for the gate of the court—
translation:
  language: zh_hans
  text: 院子的帷幔[a]、柱子和柱座[b]，以及院门的门帘[c]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“院子的幔子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“柱子的卯座”。
    reason: lexical_alternative
  - marker: c
    text: 或译“院子入口的帘子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: 帷幔
  rationale: 指构成会幕院子围障的织物幔子；“帷幔”自然庄重，也可与入口处专用的“门帘”有所区别。
- source_word: חָצֵר
  choice: 院子
  rationale: 指会幕外围起来的区域；“院子”是现代汉语中清楚自然的表达。
- source_word: עַמֻּדָיו
  choice: 柱子
  rationale: 指支撑院子帷幔的直立构件；“柱子”准确且通俗。
- source_word: אֲדָנֶיהָ
  choice: 柱座
  rationale: 指柱子下方起承托或固定作用的座；结合所属对象译作“柱座”，比笼统的“底座”更明确。
- source_word: מָסַךְ
  choice: 门帘
  rationale: 在会幕语境中指遮蔽入口的织物；“门帘”既说明其材质与功用，也与四周的“帷幔”区分。
- source_word: שַׁעַר
  choice: 院门
  rationale: 指院子的入口；合译为“院门”符合现代汉语习惯，并保留其作为门口的建筑含义。
