revisions:
- from: 于是，男人们和女人们一同前来[a]。凡甘心乐意的人，都带来了扣饰、耳环、戒指和其他饰物——各样金饰[b]。凡把金子作为摇祭献给雅威的男人，也都这样献上了。
  to: 男人和女人都前来[a]。凡甘心乐意的人，都带来了各样金饰：饰物、耳环、戒指和其他饰物[b]。每一个献上金子作为摇祭的人，都把这摇祭献给雅威。
  rationale: 修订避免把难解的 עַל 固定为“一同”，以“男人和女人都前来”自然表达两者参与，并由脚注保留关系的歧义。末句按语境将 אִישׁ 处理为泛指的“每一个……的人”，不把献金摇祭不必要地限制为男性；同时明确献上的对象与内容。首饰术语则维持宽泛译法并在脚注保留词义不确定性。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:27:05Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了自愿献上金饰以及向雅威献金摇祭的内容，也在脚注中保留了 עַל 的困难用法和若干首饰词的不确定性。但正文“男人们和女人们一同前来”把该短语处理为明确的共同前来，较原文的歧义更强；且“凡……的男人”在此处更适合作泛指的“每一个人”，因为上下文已明说男女皆参与，不能据此断定后一分句仅限男性。
  naturalness: 整体庄重、通顺。“扣饰”略显生造且不如“别针（或扣饰）”自然；采用较宽泛的“饰物”更稳妥。末句“也都这样献上了”中的“这样”在汉语里指代不清，宜直接说明“都献上了金子的摇祭”。
  terminology: “雅威”与 יהוה 相符；“摇祭”恰当地保留 תְּנוּפָה 的礼仪术语。טַבַּעַת 译“戒指”不作“印章戒指”的过度具体化，是合宜的。
