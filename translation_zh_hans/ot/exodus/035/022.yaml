  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: zh_hans
  text: 男人和女人都前来[a]。凡甘心乐意的人，都带来了各样金饰：饰物、耳环、戒指和其他饰物[b]。每一个献上金子作为摇祭的人，都把这摇祭献给雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译近似“男人在女人之上／随同女人”。这是一个难解的表达，可能指男人与女人一同前来，也可能指男人继女人之后或在女人之外也前来。
    reason: 保留原文介词结构的歧义，避免将其限定为单一的男女关系。
  - marker: b
    text: 这里几个首饰名称的确切含义并不确定：第一个“饰物”也可能指钩、环、别针或别扣；“耳环”也可能是鼻环；“其他饰物”可能特指坠饰、臂环或另一类首饰。
    reason: 原文中的 חָח、נֶזֶם 和罕见词 כוּמָז 的具体所指均不确定。
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 于是……前来
  rationale: 承接并推进叙事；“于是”符合现代汉语行文，“前来”准确表达朝献礼地点而来的动作。
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: 男人们和女人们一同前来
  rationale: עַל 在这里是较难直译的习语，语境中最可能表示男人与女人一同或继女人之后前来；正文采用自然且不排他的“一同前来”，并以脚注保留另一种可能。
- source_word: כֹּל נְדִיב לֵב
  choice: 凡甘心乐意的人
  rationale: 表达内心自愿且慷慨的倾向；“甘心乐意”是自然、庄重的现代汉语，也保留了献礼出于自愿的重点。
- source_word: הֵבִיאוּ
  choice: 带来了
  rationale: 在奉献物品的语境中直接表达携物而来，简洁自然。
- source_word: חָח
  choice: 扣饰
  rationale: 该词所指不确定，可能是钩、环或别扣一类饰物；“扣饰”既符合首饰清单语境，也避免断定为某一种现代首饰。
- source_word: נֶזֶם
  choice: 耳环
  rationale: 可指戴在耳朵或鼻子上的环；正文采用常见的“耳环”，脚注说明“鼻环”的可能。
- source_word: טַבַּעַת
  choice: 戒指
  rationale: 基本义为环、指环；原文并未明确说明是印章戒指，因此采用较中性的“戒指”。
- source_word: כוּמָז
  choice: 其他饰物
  rationale: 这是罕见词，具体所指不明，可能是坠饰、臂环等；采用概括说法避免虚假的精确性。
- source_word: כָּל כְּלִי זָהָב
  choice: 各样金饰
  rationale: כְּלִי 泛指器物或物件；结合前面的首饰清单，译作“各样金饰”符合语境且自然。
- source_word: וְכָל אִישׁ
  choice: 凡……的男人
  rationale: אִישׁ 是阳性单数“男人”；译文保留原文的性别表达，不将其泛化为中性“人人”。
- source_word: הֵנִיף
  choice: 献给
  rationale: 该动词指礼仪性的举起、摇动或呈献；与“摇祭”搭配时用“献给”表达实际献祭动作，避免汉语重复生硬。
- source_word: תְּנוּפַת זָהָב
  choice: 把金子作为摇祭
  rationale: תְּנוּפָה 是礼仪术语，指以举起或摇动方式呈献的祭物；保留“摇祭”以体现其礼仪特性。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 直接音译四字神名 יהוה，保留其作为盟约之名的专名性质。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近主流学界对其古代发音的重构，也避免以称号取代专名。
- issue: וְכָל אִישׁ 的性别表达
  choice: 凡……的男人
  alternative: 凡人；每个人
  rationale: 原文明确使用阳性名词 אִישׁ；正文保留这一形式，同时不否定本节前半句所说男女共同参与。
- issue: 摇祭语言是否表示完整的祭司礼仪动作
  choice: 把金子作为摇祭献给雅威
  alternative: 向雅威呈献金子的举献礼
  rationale: 原文使用礼仪术语 תְּנוּפָה 和动词 הֵנִיף，但没有详述具体动作如何执行；译文保留礼仪名称，不进一步断定献礼者亲自完成了怎样的仪式步骤。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“甘心乐意”“摇祭”保留圣经献礼语境；首饰名词则以普通读者可理解的词语表达。所有脚注标记均已置于正文相应位置。
