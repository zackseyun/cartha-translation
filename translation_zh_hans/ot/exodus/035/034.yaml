revisions:
- from: 他又把教导人的能力放在他心里[a]，就是他和但支派亚希撒抹的儿子亚何利亚伯。
  to: 他又把教导人的能力放在他们心里[a]——就是比撒列和但支派亚希撒抹的儿子亚何利亚伯。
  rationale: 修订消除了现代汉语中单数代词及“就是”结构引起的歧义，明示上下文中的比撒列，并以“他们心里”清楚表达比撒列和亚何利亚伯同获教导能力。保留“放在……心里”的意象、教导的宽泛含义、亲子称谓和支派归属。原文在“心里”处使用单数形式；中文复数是为使并列受领者清楚可辨的最小语法调整。
