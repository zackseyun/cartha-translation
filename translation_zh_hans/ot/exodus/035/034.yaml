base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: zh_hans
  text: 他又把教导人的能力放在他们心里[a]——就是比撒列和但支派亚希撒抹的儿子亚何利亚伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“指导人的能力”。希伯来语这个词可泛指教导、指点，也包括传授手艺。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: 教导人的能力
  rationale: 使役式不定词意为“教导、指导”。结合“放在心里”的希伯来语表达，补出“能力”可使现代汉语自然，并表明这是上帝所赐的内在才干；“教导人”也保留其传授技艺的宽泛含义。
- source_word: נָתַן בְּלִבּוֹ
  choice: 把……放在他心里
  rationale: 保留希伯来语以“心”为思想、意愿和才干所在的表达，同时在现代汉语中仍清楚可懂。
- source_word: הוּא
  choice: 就是他
  rationale: 显明原文独立人称代词所带的强调和补充说明作用，又不额外强化为“他本人”。
- source_word: וְאָהֳלִיאָב
  choice: 和……亚何利亚伯
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: בֶּן אֲחִיסָמָךְ
  choice: 亚希撒抹的儿子
  rationale: 按原文直译亲子关系，保留家谱式称谓。
- source_word: לְמַטֵּה דָן
  choice: 但支派
  rationale: 此处介词 לְ 表示归属；“但支派”是简洁、自然且准确的中文表达。
theological_decisions:
- issue: 教导能力的赐予者与承受者
  choice: 保留“他又把……放在他心里”的单数代词结构
  alternative: 明确译为“上帝又使他们都有教导人的能力”
  rationale: 原文依上下文可知赐予者是上帝，但本节只用第三人称单数；受领者的表达也先用单数“他心里”，随后并列比撒列和亚何利亚伯。正文尽量保留这种语法张力，不擅自改成明确的复数。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“把……放在他心里”有意保留圣经希伯来语的心灵观和原文单复数之间的张力；人名与支派名采用中文圣经通行译法。
