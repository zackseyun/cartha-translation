  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: zh_hans
  text: 燔祭坛、坛所配的铜网[a]、坛的杠和坛的一切器具，以及洗涤盆和盆座[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铜格栅”或“铜网架”。
    reason: lexical_alternative
  - marker: b
    text: “盆座”或译“盆的底座”。传统译法常称“洗濯盆和盆座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: 这是指献全燔祭所用的特定祭坛。“燔祭坛”沿用清楚而庄重的现代汉语圣经术语，也简洁保留其祭祀功用。
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: 铜网架
  rationale: מִכְבָּר指祭坛所配的网格状铜制构件。“铜网架”既表达其网格形态，也说明它是一个器物构件。
- source_word: אֲשֶׁר לוֹ
  choice: 坛上的
  rationale: 原文表示该铜网架与祭坛的所属或关联关系；结合本段器物描写，“坛上的”自然简洁，但不进一步限定具体安装位置。
- source_word: בַּדָּיו
  choice: 坛杠
  rationale: בַּדִּים是搬运会幕器物所用的杠。“坛杠”在汉语中明确指祭坛所配的抬杠，并避免重复使用领属代词。
- source_word: כָּל כֵּלָיו
  choice: 坛的一切器具
  rationale: כֵּלִים泛指祭坛配套的器皿、用具或装备。“器具”范围较宽，适合此处，且现代读者容易理解。
- source_word: הַכִּיֹּר
  choice: 洗涤盆
  rationale: 这里指会幕院中供洗濯用的盆。“洗涤盆”比传统的“洗濯盆”更符合现代汉语，同时交代其用途。
- source_word: כַּנּוֹ
  choice: 盆座
  rationale: כֵּן在此指支承洗涤盆的座或底座。“盆座”简洁，并清楚显示它与盆的配套关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的列举式表达，并保留原文作为上一节命令清单延续部分的片段结构和句末破折号。领属关系用“坛上的”“坛杠”“坛的一切器具”自然呈现，避免汉语中连续使用多个“它的”。脚注标记按其实际涉及的词语放置；英文咨询层中的标记位置与脚注内容不吻合，未机械照搬。
