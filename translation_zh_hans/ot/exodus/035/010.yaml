  text: וְ/כָל חֲכַם לֵ֖ב בָּ/כֶ֑ם יָבֹ֣אוּ וְ/יַעֲשׂ֔וּ אֵ֛ת כָּל אֲשֶׁ֥ר צִוָּ֖ה יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: zh_hans
  text: 你们中间凡有技艺的人[a][b]，都要来，制作雅威所吩咐的一切：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“心有智慧”，这是一个习语，在这里指有才干、精于工艺的人。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“你们中间所有有技艺的人”。希伯来语在语法上采用阳性单数形式，但在这里具有逐一涵盖的分配意义。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל
  choice: 凡
  rationale: כָל后接单数名词，在这里具有逐一涵盖的分配意义；现代汉语用“凡”自然表达“每一个……的人”。句首וְ承接上文，但汉语无需机械译出“并且”。
- source_word: חֲכַם לֵב
  choice: 有技艺的人
  rationale: 该短语字面为“心有智慧者”，在会幕建造的语境中是指具备实际才干、尤其精于工艺的人。“有技艺的人”既传达语境义，也避免把它误解为仅指一般性的聪明或属灵智慧。
- source_word: בָּ/כֶם
  choice: 你们中间
  rationale: 介词ב加第二人称阳性复数后缀，表示此人属于并处在以色列会众之中；“你们中间”准确而自然。
- source_word: יָבֹאוּ
  choice: 都要来
  rationale: 未完成式在摩西的召集话语中带有指令意味。“要来”保留其要求语气，“都”与前面的“凡”呼应，并反映单数集合主语后复数谓语的分配意义。
- source_word: וְ/יַעֲשׂוּ
  choice: 制作
  rationale: עָשָׂה可指“做”或“制造”；本段所说的是会幕及其器具的建造，译作“制作”更具体。
- source_word: אֵת כָּל אֲשֶׁר
  choice: 一切
  rationale: 宾格标记连同כָל及关系从句，表示雅威所吩咐之物的全部；“一切”简洁地保留其总括范围。
- source_word: צִוָּה יְהוָה
  choice: 雅威所吩咐的
  rationale: 完成式表示吩咐已先于工匠的行动发出；汉语“所吩咐的”自然体现这一关系。יהוה按其专名译作“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文以“雅威”音译，明确保留其作为立约神名的性质，而不以称号替代。
- issue: חֲכַם לֵב的性别与分配结构
  choice: 凡有技艺的人
  alternative: 每一个有技艺的男子；所有有技艺的人
  rationale: 希伯来语形式是阳性单数，但后接复数动词，具有代表性、分配性的力量。汉语“人”本身不标明性别，既不额外限定只有男性，也不抹去原文的语法形式；相关信息在脚注中说明。
- issue: “智慧”与“技艺”的语义张力
  choice: 正文采用语境义“有技艺”，脚注保留字面义
  alternative: 心里有智慧
  rationale: 在会幕制作语境中，该习语明显指实际的工艺才干，但“心”和“智慧”的原文意象具有神学与文学价值，因此不在正文中生硬直译，也不让字面信息消失，而以脚注保存。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“凡……都……”自然呈现原文的分配结构；“制作”配合随后列举的会幕器物。句末保留冒号，因为本节引出下文的制作清单。
