base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: zh_hans
  text: 凡心里有智慧的妇女都亲手纺线[a]，并把所纺的蓝色线、紫色线、朱红色线[b]和细麻带来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“心里有智慧……用双手纺”；这里的“智慧”也包括实际的技艺。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“并把所纺的带来，就是蓝色、紫色、朱红色的线和细麻。”希伯来语在“所纺的”之后列出这些材料。
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: 心里有智慧
  rationale: 保留希伯来语“心中有智慧”的表达，既指内在的智慧，也在本语境中包含实际技艺；比单译“手艺熟练”更完整。
- source_word: בְּיָדֶיהָ
  choice: 亲手
  rationale: 自然表达工具性的“用她的双手”，并突出妇女亲自劳作。
- source_word: טָוּוּ
  choice: 纺线
  rationale: 该动词指把纤维纺成线；“纺线”在现代汉语中明确、简洁。
- source_word: וַיָּבִיאוּ
  choice: 并把……带来
  rationale: 保留希伯来语从分配性的单数“凡……妇女”转为集体复数“她们”的语义；汉语借“都”及共享谓语自然体现群体行动。
- source_word: מַטְוֶה
  choice: 所纺的
  rationale: 指纺成的材料或线；与后面的材料清单衔接自然。
- source_word: תְּכֵלֶת
  choice: 蓝色线
  rationale: 在会幕纺织语境中指染成蓝色的贵重线料；明说“线”可避免汉语将其误解为抽象颜色。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 按会幕织物语境译作紫色染线，与并列材料保持一致。
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: 朱红色线
  rationale: 该固定表达指以相应染料染成的鲜红线料；“朱红色”庄重且为现代读者所懂。
- source_word: שֵׁשׁ
  choice: 细麻
  rationale: 在会幕经文中通常指优质细麻；原文此处列材料，“细麻”比加上未经明说的“布”更稳妥。
theological_decisions: []
