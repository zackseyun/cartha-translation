lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: 又能构思各种图样
  rationale: 动词 חָשַׁב 与同根名词 מַחֲשָׁבוֹת 连用，在工艺语境中表示有技巧地构思、设计，而不只是一般的思考。“构思各种图样”自然表达艺术设计之意；同根词的强调方式则在脚注中说明。
- source_word: לַ/עֲשֹׂת
  choice: 制作
  rationale: עָשָׂה 本义宽泛，可指“做、制造”；此处处于金属工艺清单中，译作“制作”既自然，也不过度限定具体工艺。
- source_word: בַּ/זָּהָב וּ/בַ/כֶּסֶף
  choice: 用金、银
  rationale: 介词 בְּ 在这里标示加工制作所用的材料；现代汉语以“用”连接材料最自然。זָהָב 与 כֶּסֶף 分别直译为“金”和“银”。
- source_word: וּ/בַ/נְּחֹשֶׁת
  choice: 和青铜
  rationale: נְחֹשֶׁת 可指铜或铜合金；在会幕器具的传统工艺语境中，“青铜”是合宜的主文译法，同时以脚注保留“铜”的可能性。
