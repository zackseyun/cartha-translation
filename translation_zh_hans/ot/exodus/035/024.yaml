source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: zh_hans
  text: 凡献上银子或铜作奉献物的[a]，都把献给雅威的奉献物带来了；凡有皂荚木[b]可供一切事奉工作使用的，也都把木料带来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“献上银子和铜作奉献物的。”希伯来语连接词可译为“和”；这里按分配意义译作“或”，表示各人把自己所有的金属材料献上。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“凡在他那里找到皂荚木的”，是指手头有皂荚木可用的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: 凡献上……的
  rationale: רוּם与תְּרוּמָה连用时，指把礼物呈上作为奉献；译为“献上”既自然，也保留其动作意味。
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: 银子或铜作奉献物
  rationale: תְּרוּמָה指分别出来奉献的礼物；נְחֹשֶׁת在会幕材料的语境中通常指铜或青铜。此处将连接词按分配意义译作“或”，表示各人按所有的献上其中一种材料，同时用脚注保留“和”的形式可能。
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: 都把献给雅威的奉献物带来了
  rationale: 构造短语可指“雅威的奉献物”，即归给或指定献给雅威之物；汉语用“献给雅威”更自然，并未改变归属和用途。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留原文直接使用上帝圣名的特点。
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: 凡有……的
  rationale: 原文直译为“凡在他那里找到……的”，是表示拥有或手头备有某物的习语；译为“凡有……的”清楚自然，脚注说明字面形式。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 这是现代中文圣经语境中对会幕所用金合欢属木材的通行名称，比音译树名更易理解。
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: 可用于各样服役工作的
  rationale: מְלָאכָה表示工作或工程，עֲבֹדָה表示劳作或服役；译文保留两个概念，不把上下文所暗示的会幕明写进正文。
- source_word: הֵבִיאוּ
  choice: 也都把木料带来了
  rationale: 补出宾语“木料”以明确指回皂荚木，使汉语句子完整自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的拟定读音，也避免以称号替代专名。
- issue: תְּרוּמַת יְהוָה所表达的关系
  choice: 献给雅威的奉献物
  alternative: 雅威的奉献物
  rationale: 希伯来语构造关系可表达归属或指定用途；正文采用自然汉语“献给雅威”，同时不把它限定为某一特定祭礼类别。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“奉献物”比礼仪色彩较强的“举祭”更容易为普通读者理解；句式保留原文两个“凡……的，都……”的平行结构。
