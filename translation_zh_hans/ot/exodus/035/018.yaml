  yaml_path: translation/ot/exodus/035/018.yaml
  text: the pegs of the tabernacle[a], and the pegs of the courtyard, and their ropes—
translation:
  language: zh_hans
  text: 帐幕的橛子、院子的橛子，以及帐幕和院子的绳索[a]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “绳索”也可译作“绳子”。
    reason: 词义可指绳、索；此替代保留原文的概括性，不将其限定为特定用途的拉绳。
lexical_decisions:
- source_word: יִתְדֹת
  choice: 橛子
  rationale: 指把帐幕及院子帷幔固定在地上的桩钉。“橛子”准确、简洁，并符合本段器物清单的语境。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן在《出埃及记》中是神圣居所的固定称谓；“帐幕”既保留其可移动帐篷结构的含义，也符合现代中文圣经语体。
- source_word: הֶחָצֵר
  choice: 院子
  rationale: 在帐幕语境中指帷幔围成的外院。“院子”自然易懂，又能准确表达这一空间。
- source_word: מֵיתְרֵיהֶם
  choice: 两者所用的绳索
  rationale: 后缀为阳性复数，最自然地回指前面的帐幕和院子，而不是阴性复数的“橛子”。译为“两者所用的绳索”使中文指代清楚，同时保留这些绳索与两部分结构的关联。
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: ……、……，以及……
  rationale: אֶת本身不译，但重复形式构成器物清单；中文用顿号和“以及”自然呈现其并列结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的清单式表达。“帐幕”“橛子”保留出埃及记器物术语；句末破折号表明本节仍属于前后相连的列举。
