language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: zh_hans
  text: 他使他们心中充满智慧，能从事各种工艺：雕刻工[a]、设计者、用蓝色、紫色、朱红色线和细麻刺绣的人，以及织工；他们能做各种工艺，也能设计图样。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雕刻工”也可泛译为“工匠”；这里的希伯来词可指一般的技术工匠，但在会幕制作的语境中可能指某一类专门工艺。
    reason: lexical_alternative
  - marker: c
    text: 原文末句以同一词根表达“设计图样”；这里按工艺语境译为“设计图样”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: 他使他们……充满
  rationale: 采用使役色彩自然的现代汉语表达，忠实传达 Piel 的“使充满”，并由上文明确的主语“他”承接。
- source_word: חָכְמַת לֵב
  choice: 心里充满智慧
  rationale: 保留“心/内心”这一希伯来表达的核心意象，同时让中文自然；这里的“智慧”包括内在的技艺、悟性和判断力。
- source_word: לַעֲשׂוֹת כָּל מְלֶאכֶת
  choice: 能做各样的工
  rationale: 目的性不定式与所得能力相连；“各样的工”传达 כל 的全面性及 מלאכה 的技艺、劳作含义。
- source_word: חָרָשׁ
  choice: 雕刻匠
  rationale: 在会幕工艺语境中取较具体的传统理解；该词也可泛指技术工匠，因此附注保留较宽泛的可能。
- source_word: חֹשֵׁב
  choice: 设计匠
  rationale: 在纺织和圣所工艺语境中指构思图样、进行艺术设计的人；“设计匠”既与工匠列表协调，也易于现代读者理解。
- source_word: רֹקֵם
  choice: 刺绣匠
  rationale: 准确表达纺织语境中的装饰性刺绣技艺。
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי וּבַשֵּׁשׁ
  choice: 蓝色线、紫色线、朱红色线和细麻
  rationale: 用“线”显明前三种染色材料在刺绣中的用途；שש 按会幕语境译为“细麻”。
- source_word: אֹרֵג
  choice: 织布匠
  rationale: 自然、明确地表达从事编织的人，并与前面的工匠称谓保持一致。
- source_word: עֹשֵׂי כָּל מְלָאכָה
  choice: 他们能做各样的工
  rationale: 将分词短语作为对前述众工匠的总结；“做”保留 עשה 的宽泛含义。
- source_word: חֹשְׁבֵי מַחֲשָׁבֹת
  choice: 构思各种巧妙的图样
  rationale: 体现 חשב 词根的重复和“筹划、构思”的含义；中文不生硬复制同源重复，而以“构思……图样”传达艺术设计语境。
theological_decisions:
- issue: 智慧的性质
  choice: 保留“心里……智慧”的意象，并说明其涵盖技艺和悟性
  alternative: 直接译作“技艺高超”或“有技能”
  rationale: 原文把工艺能力表述为内在的“心之智慧”；保留这一说法可呈现能力的源头和整体性，又不把它缩减为纯技术熟练。
- issue: 能力的赐予者
  choice: 保留单数主语“他”
  alternative: 为清楚起见直接写“上帝”
  rationale: 本节希伯来文仅有单数动词所含的“他”，所指由上文确定；不在本节自行补入神名，可保持原文的衔接方式。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。以冒号和分号整理原文密集的工种列表及总结语，同时不消除各类工艺之间的关系。避免过度古雅的“巧匠”“绣花”等词，也不引入宗派性解释。
