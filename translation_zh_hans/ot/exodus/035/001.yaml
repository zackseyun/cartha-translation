base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: zh_hans
  text: 摩西召集了以色列子孙[a]的全体会众，对他们说：“这些是耶和华吩咐要做的事[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的儿子们”；这是对以色列民的立约群体称谓，指整个会众，并非仅指男性。
    reason: lexical_alternative
  - marker: b
    text: “事”也可译作“话”或“事项”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: 召集了
  rationale: 该词是קהל的使役式，表示使众人聚集成会；“召集”既体现使役意义，也符合现代汉语表达。
- source_word: כָּל עֲדַת
  choice: 全体会众
  rationale: עֵדָה指以色列作为一个整体的会众或共同体；“全体会众”保留其群体性和正式语体，并明确表达כָּל。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 按原文保留这一立约群体称谓；在现代汉语中，“子孙”可统指后裔，并不只指男性。
- source_word: אֵלֶּה הַדְּבָרִים
  choice: 这些……事
  rationale: דְּבָרִים可指“话”“事”或“事项”；鉴于下文是要执行的命令，正文译作“事”，同时以脚注保留词义上的开放性。
- source_word: צִוָּה יְהוָה
  choice: 耶和华吩咐
  rationale: “吩咐”自然表达צוה的权威命令含义；原文完成式在这里指此前已经颁下、现仍须遵行的命令，汉语无需另加时态标记。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译四字神名，保留其作为上帝名字而非普通称号的性质。
- source_word: לַעֲשֹׂת אֹתָם
  choice: 要做的
  rationale: 原文直指这些命令事项须被实行；“吩咐要做的事”在汉语中自然简洁，也没有额外指定原文未明说的执行者。
theological_decisions:
- issue: 如何翻译神名יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。正文采用现代中文读者最熟悉的音译“耶和华”，将其作为专名处理，而不以“主”等称号替代。
- issue: 如何表达בְּנֵי יִשְׂרָאֵל的群体范围
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 选择“以色列子孙”以保留原文的亲属—立约称谓，同时脚注说明这里指整个群体，并非仅限男性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“召集了……全体会众”体现使役动作和共同体性质；引语简洁直接。“以色列子孙”保留原文称谓，并用脚注避免被误解为仅指男性。
