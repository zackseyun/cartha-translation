language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל אִ֣ישׁ וְ/אִשָּׁ֗ה אֲשֶׁ֨ר נָדַ֣ב לִבָּ/ם֮ אֹתָ/ם֒ לְ/הָבִיא֙ לְ/כָל הַ/מְּלָאכָ֔ה אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה לַ/עֲשׂ֖וֹת בְּ/יַד מֹשֶׁ֑ה הֵבִ֧יאוּ בְנֵי יִשְׂרָאֵ֛ל נְדָבָ֖ה לַ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: zh_hans
  text: 凡内心甘愿为雅威借着摩西所吩咐的一切工程带来物品的男女——以色列人都向雅威献上甘心的奉献。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“内心受推动”或“心促使他们甘愿”。希伯来语惯用语表达发自内心的乐意与推动。
    reason: lexical_alternative
  - marker: b
    text: 直译“借摩西的手”，是表示经由摩西传达或执行的惯用语。
    reason: lexical_alternative
  - marker: c
    text: 直译“以色列的子孙”；这里指“以色列人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: 凡……的男女
  rationale: 明确保留男人和女人都参与其中，也以“凡”表达 כָּל 的逐一、总括意味。
- source_word: נָדַב לִבָּם אֹתָם
  choice: 心里受到感动而甘愿
  rationale: 希伯来语以“心”为意志所在，表达内在推动所产生的自愿；此译兼顾“受到感动”与“甘愿”，不把它简化成外在命令。
- source_word: לְהָבִיא
  choice: 送来物品
  rationale: 原文动词是“带来”，宾语由上下文补足；“物品”自然点明他们为会幕工程带来材料，却不限定具体种类。
- source_word: לְכָל הַמְּלָאכָה
  choice: 为……全部工程
  rationale: מְלָאכָה 在此广指建造会幕及其器具的各项工作；“工程”比单纯“工作”更贴合此处建造语境。
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: 雅威藉着摩西吩咐要做的
  rationale: בְּיַד מֹשֶׁה 字面为“借摩西的手”，在此表示摩西是传达命令的中介；“藉着摩西”是自然且准确的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: 以色列人都带来了
  rationale: בְנֵי יִשְׂרָאֵל 是指以色列全体成员的族称；“以色列人”自然明白，“带来了”保留 הֵבִיאוּ 的动作。
- source_word: נְדָבָה
  choice: 甘心献给……的礼物
  rationale: נְדָבָה 强调出于自愿的奉献；这里所献的是建造会幕的物资，因此“甘心献……的礼物”比可能使人联想到祭牲的术语更合语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名，并避免用“主”这一称号取代原文的名字。
- issue: 百姓奉献的自愿性与内在推动
  choice: 心里受到感动而甘愿
  alternative: 心里自愿；心促使他们
  rationale: 原文把内心推动和甘愿行动连在一起；译文保留两方面，既不把奉献说成被迫，也不额外断定这感动的直接来源。
- issue: 摩西在命令传达中的角色
  choice: 藉着摩西
  alternative: 借摩西的手；由摩西
  rationale: 保留摩西作为传达雅威命令之中介的意思，同时不把命令的最终来源转移到摩西身上。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“男女”明确保留原文对两性的并列；破折号保留希伯来语先提出“凡……的男女”、随后以“以色列人”重新承接主句的结构。三个脚注标记均紧随相关措辞。
