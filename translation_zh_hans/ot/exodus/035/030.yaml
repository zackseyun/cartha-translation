  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: zh_hans
  text: 摩西对以色列的子孙[a]说：“你们看，雅威已经按名呼召了比撒列，就是乌利的儿子、户珥的孙子，属于犹大支派。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“以色列人”或“以色列的儿女”。希伯来文直译为“以色列的众子”。
    reason: 说明原文亲属用语及其群体意义，并列出现代汉语可采用的译法。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动情节；汉语依靠语序和上下文自然表达承接关系，无须机械补出“然后”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留原文的亲属和后裔表达，同时在现代汉语中可作为全体以色列人的群体称呼。
- source_word: רְאוּ
  choice: 你们看
  rationale: 复数命令式用于唤起听众注意；补出“你们”可自然体现复数受话者，且比“看哪”更符合现代汉语。
- source_word: קָרָא ... בְּשֵׁם
  choice: 按名召了
  rationale: 保留“呼召/选召”与“按名”这一希伯来语习语的个人性和特定指派意味，不弱化为单纯“命名”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名而非头衔的性质。
- source_word: בְּצַלְאֵל
  choice: 比撒列
  rationale: 采用现代中文圣经语境中通行、易辨识的人名译法。
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: 他是乌利的儿子、户珥的孙子
  rationale: 原文连续使用“儿子”标明父系谱系；汉语用“儿子、孙子”明确表达比撒列与乌利、户珥两代之间的关系，避免误读为两者都是其父亲。
- source_word: לְמַטֵּה יְהוּדָה
  choice: 属于犹大支派
  rationale: לְ在这里标明支派归属；“属于”是自然、准确的现代汉语表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”作为较贴近学界通常重构读音的中文音译，并保留其专名性质；“耶和华”是中文传统中广泛使用的另一音译。
- issue: בְּנֵי יִשְׂרָאֵל 的群体与性别表达
  choice: 以色列的子孙
  alternative: 以色列人
  rationale: 该短语字面带有男性复数亲属用语，同时在语境中指整个民族群体。“子孙”保留后裔意象而不把所指范围不必要地限定为当场的成年男子；脚注列出更地道的群体称呼。
- issue: קָרָא ... בְּשֵׁם 的含义
  choice: 按名召了
  alternative: 点名选召了
  rationale: 原文既可突出按名字明确指定，也带有为任务拣选、召用的意味。“按名召了”保留这种张力，不在正文中额外限定为某一种制度化的呼召观。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。正文保留“按名召了”的希伯来语表达力度，以分号和补出的“他是”清楚呈现家谱与支派归属。脚注标记[a]已置于对应短语之后。
