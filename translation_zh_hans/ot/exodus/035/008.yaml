  yaml_path: translation/ot/exodus/035/008.yaml
  text: oil for the light[a], and spices for the anointing oil and for the fragrant incense,
translation:
  language: zh_hans
  text: 点灯用的油，以及调制膏油和芬芳的香[a]所用的香料，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“香料制成的香”或“芳香的香”。
    reason: 原文קְטֹרֶת הַסַּמִּים可按构词关系理解为“香料之香”，也可自然表达为“芬芳的香”。
lexical_decisions:
- source_word: שֶׁמֶן
  choice: 油
  rationale: 原词泛指油；本节没有明说橄榄油，因此不增添原文未明示的限定。
- source_word: לַמָּאוֹר
  choice: 点灯用的
  rationale: מָאוֹר可指光或发光之物；在会幕物料清单中，此处表达油的照明用途。“点灯用的”比直译“给光的”更符合现代汉语。
- source_word: בְשָׂמִים
  choice: 香料
  rationale: 复数名词指用于圣所配制的芳香物质；“香料”通俗、准确，也不过度技术化。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 这是礼仪语境中的固定组合，指用于膏抹的油；“膏油”简洁，并符合现代中文圣经语体。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 在会幕语境中指焚烧的香；中文“香”自然地表达该礼仪用品。
- source_word: הַסַּמִּים
  choice: 芬芳的
  rationale: 该词与קְטֹרֶת构成“香料之香／芳香的香”；正文用“芬芳的香”传达其芳香性质，并用脚注保留较形式对应的理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的清单式表达。将用途短语处理为“点灯用的”和“调制……所用的”，使汉语流畅；保留原文末尾逗号，以符合该节在上下文中清单尚未结束的句法。
