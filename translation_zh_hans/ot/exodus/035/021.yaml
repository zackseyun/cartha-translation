  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: zh_hans
  text: 凡内心受感动的，和凡心灵甘心乐意的，都来了，带来献给雅威的奉献，为会幕的工程、其中一切相关的工作，以及圣衣的制作。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 都来了
  rationale: 保留 בוא 的普通叙事义“来”，不增添“上前”等原文未明说的动作色彩。
- source_word: כָּל אִישׁ אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: 凡内心受感动的人
  rationale: 希伯来语直译为“他的心把他举起”，是内在推动的习语；汉语以“内心受感动”自然表达其意义，同时保留这是由内心发动的行动。
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: 心甘情愿的人
  rationale: נדב 强调自愿与慷慨的意愿；“心甘情愿”简洁体现出于自愿而非勉强。
- source_word: הֵבִיאוּ
  choice: 带来
  rationale: 对应具体把捐献物带来的动作，符合叙事语境。
- source_word: תְּרוּמַת יְהוָה
  choice: 献给雅威的礼物
  rationale: תְּרוּמָה 指分别献出的礼物或捐献；属格可指归于或献给雅威，汉语用“献给雅威”避免“雅威的礼物”可能被误解为雅威所赠之物。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代。
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: 用于建造会幕
  rationale: מְלָאכָה 指相关工程或工作；上下文是制作会幕及其器物，“建造”在汉语中清楚自然。אֹהֶל מוֹעֵד 采用通行译名“会幕”。
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: 办理其中的一切事务
  rationale: עֲבֹדָה 可指工作、服事或职务；此处概括会幕相关的一切用途与事务，避免狭义限定为礼仪服事。
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: 并制作圣衣
  rationale: 指分别为圣的祭司衣服；由前面的“用于”统摄，补出汉语所需的“制作”，使并列结构自然。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；采用“雅威”音译可保留专名性质，不用头衔代替，也不把传统混合读音写入正文。
- issue: תְּרוּמַת יְהוָה 中属格关系
  choice: 献给雅威的礼物
  alternative: 雅威的礼物
  rationale: 希伯来语结构可以表达归属或指定对象；在奉献材料的语境中，“献给雅威”最清楚，但不主张该结构只能作这一种语法分析。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“内心受感动、心甘情愿”保留原文两个近义而不完全相同的内在推动表达；不机械复制希伯来语身体隐喻，以免现代读者误读。
