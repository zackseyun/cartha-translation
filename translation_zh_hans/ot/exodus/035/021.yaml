revisions:
- from: 凡内心受感动、心甘情愿的人都来了，把献给雅威的礼物带来，用于建造会幕，办理其中的一切事务，并制作圣衣。
  to: 凡内心受感动的，和凡心灵甘心乐意的，都来了，带来献给雅威的奉献，为会幕的工程、其中一切相关的工作，以及圣衣的制作。
  rationale: 修订保留原文两个并列、近义却不完全相同的内在动机表达，不把两者合并成单一资格。将“办理其中的一切事务”改为“其中一切相关的工作”，避免把会幕的 עֲבֹדָה 不当地限定为行政办理或实际礼仪执行；并以“奉献”对应 תְּרוּמָה。末项明示“圣衣的制作”，是为使汉语中三个奉献用途的并列关系明确，并符合本段制作会幕材料的语境。
  reviewer_model: gpt-5.6-terra
