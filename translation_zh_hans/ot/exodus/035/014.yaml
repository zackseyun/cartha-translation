  yaml_path: translation/ot/exodus/035/014.yaml
  text: and the lampstand for the light[a], and its utensils, and its lamps, and the oil for the light,
translation:
  language: zh_hans
  text: 照明用的灯台[a]、灯台的器具、灯盏，以及照明用的油；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “照明用的灯台”和“照明用的油”中的“照明用的”，按字面可分别译为“光的灯台”和“光的油”。
    reason: 说明两个不同的希伯来语组合共享 הַמָּאוֹר；该词可按字面理解为“光”，也可按功能理解为“照明”。
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: 照明用的灯台
  rationale: מְנוֹרָה指会幕中的灯台；הַמָּאוֹר可指“光”或“照明”。译作“照明用的灯台”既自然，也保留其用途及原文的结构关系。
- source_word: כֵּלֶיהָ
  choice: 灯台的器具
  rationale: כְּלִי可泛指器皿、用具或器具；此处不宜限定为某一种物件。“器具”简洁且范围适当。重复“灯台的”比单用“它的”更清楚。
- source_word: נֵרֹתֶיהָ
  choice: 灯盏
  rationale: נֵר在这里指装在灯台上的各盏灯。“灯盏”能清楚区别于整个灯台，也符合会幕器物的语境。
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: 照明用的油
  rationale: 原文直译可作“光的油”或“照明的油”。“照明用的油”在现代汉语中自然，并与前面的“照明用的灯台”呼应，保留מָאוֹר的重复。
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: 、……、……，以及……
  rationale: 原文以连续的连词和直接宾语标记构成清单。汉语用顿号并在末项前加“以及”，保留列举节奏，同时避免机械重复“和”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。经文是器物清单中的一个分句，因此保留句末分号；用“灯盏”指灯台上的单个灯具，用“灯台的器具”避免代词指向含混。
