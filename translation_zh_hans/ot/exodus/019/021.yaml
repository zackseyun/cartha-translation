  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“下去警告百姓，免得他们闯到雅威那里去观看[a]，以致他们中有许多人倒下[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“看见”。这个希伯来动词可表示“看”或“看见”；这里指企图观看雅威的显现。
    reason: lexical_alternative
  - marker: b
    text: 直译“他们中有许多人倒下”。在本语境中，“倒下”可能暗示死亡，但希伯来原文没有说得更明确。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译保留上帝的专名，不以“耶和华”或“主”等传统读法或称号代替。
- source_word: רֵד
  choice: 下去
  rationale: 准确表达祈使语气及从山上下去的方向，现代汉语自然明白。
- source_word: הָעֵד בָּעָם
  choice: 警告百姓
  rationale: עוד的使役式在此指郑重告诫；结合不可越界的语境，“警告”简洁准确。
- source_word: פֶּן
  choice: 免得
  rationale: 保留希伯来语所表达的负面目的或所防范的结果。
- source_word: יֶהֶרְסוּ אֶל־יְהוָה
  choice: 闯到雅威那里
  rationale: הרס在此指冲破限制、擅自接近；“闯到”传达越过禁限的意味，同时不把原文未明说的“界限”直接加入正文。
- source_word: לִרְאוֹת
  choice: 观看
  rationale: 保留ראה在此处“看、观看”的基本含义，并让其目的用法自然接在前句之后。
- source_word: וְנָפַל מִמֶּנּוּ רָב
  choice: 以致他们中有许多人倒下
  rationale: “倒下”保留נפל较宽泛的字面表达；“他们中有许多人”自然呈现מִמֶּנּוּ רָב的群体部分含义。
theological_decisions:
- issue: 如何译写神名יְהוָה
  choice: 雅威
  alternative: 耶和华；上主；主
  rationale: 原文直接使用四字神名。译作“雅威”既保留其专名性质，也避免以称号取代原文。
- issue: “倒下”是否明确译成死亡
  choice: 保留“倒下”并以脚注说明可能含义
  alternative: 死亡；倒毙
  rationale: 本语境中的נפל很可能暗示受审判而死，但希伯来文本没有使用更明确的死亡动词；正文保留其措辞可避免消除原有含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式保留命令与警告的紧迫感；不用文言色彩较重的“下山去”“恐怕”等表达。脚注标记按其实际所解释的词分别置于“观看”和“倒下”之后。
