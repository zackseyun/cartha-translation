  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: zh_hans
  text: 你们要归我，成为祭司的国度[a]和圣洁的国民。这就是你要对以色列的子孙[b]说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祭司般的国度”。这个希伯来语短语可理解为由祭司组成的国度，也可理解为具有祭司性质的国度。参彼得前书2:9，其中用了相关的表达“君尊的祭司”。
    reason: lexical_alternative
  - marker: b
    text: “以色列的子孙”是希伯来语对以色列全体百姓的称呼，并非只指男性。
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ לִי
  choice: 你们要归我，作
  rationale: 未完成式在盟约宣告中表达将来的身份与使命；“要归我，作”兼顾庄重语气，并保留לִי所表达的归属和关系。
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: 祭司的国度
  rationale: 按希伯来语连属结构直译，保留“国度”和“祭司”两个名词，也不以新约中的相关措辞取代本节原有表达。
- source_word: גּוֹי קָדוֹשׁ
  choice: 圣洁的国民
  rationale: “圣洁”保留其盟约与神学意味；“国民”在此自然表达作为整体的民族共同体，并与“国度”相协调。
- source_word: אֵלֶּה הַדְּבָרִים
  choice: 这些话
  rationale: 在吩咐摩西传话的语境中，דְּבָרִים最自然地指所要说的话。
- source_word: תְּדַבֵּר
  choice: 你要告诉
  rationale: 皮尔未完成式在此为对摩西的指示；汉语“你要告诉”比逐字的“你要说”更自然，并清楚表达向指定对象传达这些话。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留原文的亲属称谓和群体身份；脚注说明该惯用语指以色列全体百姓，并非只指男性。
theological_decisions:
- issue: 以色列在盟约中的群体身份与使命
  choice: 祭司的国度
  alternative: 祭司般的国度；君尊的祭司群体
  rationale: 原文短语既可理解为由祭司组成的国度，也可指具有祭司性质的国度。正文采用最贴近连属结构的表达，并用脚注保留其解释空间，避免把后来的新约措辞直接带入本节。
- issue: 盟约群体的性别化称谓
  choice: 以色列的子孙
  alternative: 以色列人；以色列百姓
  rationale: 原文形式是阳性复数亲属称谓，但在此惯用地指整个以色列群体。正文保留源语意象，脚注澄清其群体性所指。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你们要归我，作……”保留盟约宣告中的归属感和将来指向；正文尽量贴近希伯来语结构，同时用脚注说明真实存在的词义歧义和文化用法。
