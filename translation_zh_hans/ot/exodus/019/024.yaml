base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: zh_hans
  text: 雅威对他说：“去，下去吧；然后你要和亚伦一同上来。但祭司和百姓不可擅闯上来亲近雅威，免得他向他们发作[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “擅闯……发作”也可译作“强行突破……向他们爆发”。原文以两个不同但相关的“突破／爆发”意象，分别描述百姓越界闯入和雅威突然施行审判。
    reason: 说明הרס与פרץ的相关意象及可行译法，同时避免误称二者为同一词根。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译保留上帝向以色列启示的专名，而不以称号替代；“雅威”是现代汉语中通行且庄重的译法。
- source_word: לֶךְ רֵד
  choice: 下去
  rationale: 两个祈使动词连用，构成催促摩西离开并下山的命令；汉语“下去”自然表达整体意义。
- source_word: וְעָלִיתָ
  choice: 然后……上来
  rationale: 该完成式在祈使命令之后带有指令性的后续意义，指摩西下去后再次上山。
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: 你和亚伦一同
  rationale: 保留独立代词对“你”的强调，也表达亚伦与摩西同行。
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: 祭司和百姓
  rationale: 采用现代汉语中清楚、标准的群体称谓，并保留二者与摩西、亚伦之间的区分。
- source_word: אַל יֶהֶרְסוּ לַעֲלֹת
  choice: 不可强闯上来
  rationale: הרס在此指冲破所设界限；“强闯”既表达越界的强行动作，也符合汉语习惯。
- source_word: פֶּן יִפְרָץ בָּם
  choice: 免得他向他们冲击
  rationale: פרץ描绘突然爆发、冲出的审判行动；“冲击”尽量保留动态意象，并与前面的“强闯”形成呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 音译神名，保留其专名性质，不以称号代替，也不借此解决其古代精确读音的争议。
- issue: 警告中施行审判者的表达
  choice: 免得他向他们冲击
  alternative: 免得雅威向他们冲击；免得他击杀他们
  rationale: 原文以第三人称单数动词回指雅威；译文保留“他”，并保留冲出、爆发式审判的形象，不将其具体化为原文未明说的“击杀”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“然后”明确下山与再上山的次序；分号式对比改用句号加“但”，使口语命令清楚有力。保留雅威在引语中以第三人称“他”被指称的原文张力。
