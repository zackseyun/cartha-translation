  rationale: 修订消除了“到雅威这里”的不自然句法，并以“亲近雅威”自然表达上到雅威那里。将“冲击”改为“发作”，更准确表达原文所警告的突发性神圣审判；脚注相应澄清两个不同词根之间的意象呼应。
