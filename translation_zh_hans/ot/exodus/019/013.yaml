source:
  edition: WLC
  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: zh_hans
  text: 不可用手碰他[a]；他必须被石头打死，或被射死[b]。无论是牲畜还是人，都不得存活。公羊角号发出长音时[c]，他们可以上山。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可用手碰它。”这里的代词也可作较宽泛的理解；意思是不可直接碰触越界者，而要从远处将其处死。
    reason: alternative_reading
  - marker: b
    text: 或译：“刺死。”希伯来语动词可指射击；本处很可能是指用箭射死。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“当约贝勒被拉长时”；“约贝勒”在这里很可能指公羊角号，整句话指号声持续拉长。
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: 不可用手碰他
  rationale: 保留原文非人称式的法律措辞和阳性单数代词；其最自然的指向是越界触山者，也表达不得直接接触受刑者。
- source_word: סָקוֹל יִסָּקֵל
  choice: 必须被石头打死
  rationale: 不定式绝对式与限定动词连用，加强刑罚的确定性；“必须”体现其强制性。
- source_word: יָרֹה יִיָּרֶה
  choice: 被射死
  rationale: ירה在此语境中最可能指用箭等远射武器射击；与前面的石刑并列，表明须从远处处死。
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: 无论是牲畜还是人
  rationale: 自然传达两类对象均适用同一刑罚，并保留原文简洁的对举结构。
- source_word: לֹא יִחְיֶה
  choice: 都不可存活
  rationale: 保持司法宣告的简洁和强制语气，同时在汉语中自然涵盖前述牲畜与人。
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: 公羊角号声拉长时
  rationale: יובל在这里指公羊角或由其发出的号声；משך表达声音延长，译文既保留文化形象，也说明这是持续的号音。
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: 他们才可以上山
  rationale: 语境表明长号声响起后，先前的禁令解除；“才可以”自然表达许可及其时间条件。
theological_decisions:
- issue: “不可用手碰他”中阳性单数代词的所指
  choice: 指越界触山而成为受刑者的人或对象
  alternative: 泛指因接触圣山而成为禁忌、不可直接触碰的对象，甚至被理解为指山
  rationale: 紧邻语境讨论越界者须被处死，且不得直接触碰；按人称翻译最符合这段法律规定的逻辑，但以脚注保留较宽泛的可能。
- issue: 长号声之后“上山”的语气
  choice: 理解为禁令解除后的许可
  alternative: 理解为单纯的将来陈述“他们要上山”
  rationale: 前文设定不得上山的界限，因此此处最自然地表示特定信号之后可以上山；“才可以”也保留条件关系。
translation_notes:
  register: 采用现代、庄重而易懂的法律叙述语体。“牲畜”比“兽”更自然，也适合此处家畜或动物的泛称；“被石头打死／被射死”清楚表达两种远距离执行方式。脚注标记均紧随相关正文。
