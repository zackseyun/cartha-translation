  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: zh_hans
  text: 他们要为第三天预备好[a]，因为在第三天，雅威要在全体百姓眼前降临在西奈山上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在第三天以前预备好。”
    reason: 介词 לַ 可强调为指定日期作准备，也可理解为在该日以前达到预备妥当的状态。
lexical_decisions:
- source_word: וְהָיוּ
  choice: 他们要
  rationale: 该完成式承接上文的指示，具有命令性；“他们要”既保留句法形式，也自然表达要求。
- source_word: נְכֹנִים
  choice: 预备好
  rationale: 此处指百姓为神显现之日做好准备；“预备好”符合礼仪预备的语境，又是现代汉语常用表达。
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: 为第三天
  rationale: 介词 ל 表示预备所指向的日期；“为第三天”保留指定日期的意味，而不将其单纯处理为截止期限。
- source_word: כִּי
  choice: 因为
  rationale: כִּי 在此引出前一项要求的理由，“因为”清楚自然。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 到了第三天
  rationale: בְּ 表示事件发生的时间；“到了第三天”在叙事和指示语境中自然地表达“在第三天”。
- source_word: יֵרֵד
  choice: 要……降临
  rationale: ירד 的基本意思是“下来”；这里描写神显现，用“降临”既保留向下而来的意象，也符合庄重而通俗的汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中通行的音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: לְעֵינֵי כָל הָעָם
  choice: 在全体百姓眼前
  rationale: 较贴近“在……眼前”的形象表达，明确说明这次降临是全体百姓可见的。
- source_word: עַל הַר סִינָי
  choice: 到西奈山上
  rationale: עַל 与表示下降的动词连用，指向降临所到之处；“到西奈山上”自然呈现移动的终点。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神的专名；采用“雅威”作为较贴近学界通常复原读音的现代汉语音译，同时不以“主”等称号取代专名。
- issue: 神的降临是否为百姓所见
  choice: 在全体百姓眼前
  alternative: 让全体百姓亲眼看见
  rationale: 保留 לְעֵינֵי 的具象措辞，不额外界定百姓看见神的方式或程度，从而保存原文的神显现张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“预备好”适合指示语境；“在全体百姓眼前”保留原文的视觉意象；“降临到西奈山上”呈现神显现中由上而下的动态。
