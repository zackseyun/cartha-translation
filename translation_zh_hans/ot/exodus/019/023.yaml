id: EXO.19.23
reference: Exodus 19:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: zh_hans
  text: 摩西对雅威说：“百姓不能上西奈山，因为你亲自警告过我们[a]，说：‘要给这山划定界限，使它分别为圣[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“郑重告诫过我们”或“向我们作证”。这个希伯来动词可指正式地警告、告诫或作证。
    reason: lexical_alternative
  - marker: b
    text: “给这山划定界限，使它分别为圣”也可译作“为这山设立边界，使它成圣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，避免以“主”这一称号代替原文中的名字。
- source_word: לֹא יוּכַל
  choice: 不能
  rationale: 这里表达在既定限制下无能力或不可能上山；“不能”简洁自然，并保留原文语气。
- source_word: הָעָם
  choice: 百姓
  rationale: 所指是聚集的以色列民众；“百姓”符合叙事语境和现代中文圣经文体。
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: 上西奈山
  rationale: 保留עלה的向上移动含义，同时采用自然简洁的现代汉语表达。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出摩西所陈述的理由。
- source_word: אַתָּה
  choice: 你亲自
  rationale: 动词形式已含第二人称，另加独立代词אַתָּה带有强调作用；“你亲自”自然体现这种强调。
- source_word: הַעֵדֹתָה בָּנוּ
  choice: 警告过我们
  rationale: עוד的使役式在本语境中表示郑重警戒或告诫；“警告过我们”最切合西奈山边界禁令，同时脚注保留其正式作证或郑重告诫的语义可能。
- source_word: לֵאמֹר
  choice: 说
  rationale: 自然引出后面的直接引语。
- source_word: הַגְבֵּל אֶת הָהָר
  choice: 给这山划定界限
  rationale: גבל的使役命令式表示设立边界或限制；此译准确保留山为宾语，也符合现代汉语。
- source_word: וְקִדַּשְׁתּוֹ
  choice: 使它分别为圣
  rationale: קדשׁ的加强式在这里表示将山划归神圣、分别出来；此译保留礼仪和神圣层面的含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文明确使用四字神名。采用“雅威”作为较贴近YHWH常见学术重构的中文音译，以保留其专名性质，而不以称号“主”替代。
- issue: הַעֵדֹתָה בָּנוּ的语气
  choice: 警告过我们
  alternative: 郑重告诫过我们；向我们作证
  rationale: 上下文是禁止百姓越过界限，因此警告义最合语境；但原词也可带正式告诫或作证色彩，故在脚注中保留。
- issue: וְקִדַּשְׁתּוֹ所表达的神圣性
  choice: 使它分别为圣
  alternative: 使它成圣；将它分别出来
  rationale: 译文保留山被置于神圣用途或状态的礼仪含义，不进一步说明这种分别为圣的具体机制。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“百姓”“分别为圣”保留经文语域，但避免过度古雅；引语层次及摩西对雅威的直接陈述清晰自然。
