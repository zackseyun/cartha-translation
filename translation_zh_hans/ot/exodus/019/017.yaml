  text: וַ/יּוֹצֵ֨א מֹשֶׁ֧ה אֶת הָ/עָ֛ם לִ/קְרַ֥את הָֽ/אֱלֹהִ֖ים מִן הַֽ/מַּחֲנֶ֑ה וַ/יִּֽתְיַצְּב֖וּ בְּ/תַחְתִּ֥ית הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: zh_hans
  text: 于是，摩西带领百姓出营，去迎见上帝；他们就在山脚[a]站定。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“山的下部”。这里的希伯来语指山较低的部分，即山脚或山麓。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: 带领……出营
  rationale: 该词是יצא的使役形，表示摩西使百姓从营中出来。“带领……出营”在现代汉语中自然，也保留了摩西作为行动发起者的含义。
- source_word: לִקְרַאת
  choice: 去迎见
  rationale: 该表达表示朝着相遇或会面的方向前去。“去迎见”既体现移动，也符合百姓前往朝见上帝这一庄重语境，而不额外限定相遇的具体方式。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 这里有定冠词，但所指是西奈显现中的独一上帝；现代汉语以“上帝”自然、明确。
- source_word: מִן הַמַּחֲנֶה
  choice: 出营
  rationale: 介词短语标明离开的起点。与使役动词合译为“带领百姓出营”，简洁自然，并保留从营地出来的意思。
- source_word: וַיִּתְיַצְּבוּ
  choice: 站定
  rationale: 该词的反身形态常表示就位、站稳或摆好阵势。“站定”比单说“站着”更能体现有意识地就位，同时不加入列队等原文未明说的细节。
- source_word: בְּתַחְתִּית הָהָר
  choice: 在山脚
  rationale: 此处指山的下部或底部。“山脚”是现代汉语最自然的地理表达，不会让读者误以为百姓位于山体正下方。
theological_decisions:
- issue: 西奈显现中הָאֱלֹהִים的译法
  choice: 上帝
  alternative: 那位神
  rationale: 上下文明确指向以色列在西奈所迎见的上帝。“上帝”忠实而自然；“那位神”在汉语中可能造成与其他神明相区分的误解。
- issue: לִקְרַאת所表达的人神相遇
  choice: 去迎见上帝
  alternative: 去与上帝相会
  rationale: “迎见”保留百姓朝向上帝而去的动态和庄重意味，又不把相遇解释成对等双方约定的会面，因而避免消解西奈显现中的神圣张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“于是”承接叙事进程；分号对应原文两个连续动作。“站定”表达百姓到达指定位置后就位的意味。脚注标记置于其实际说明的“山脚”之后。
