  text: וַ/יִּסְע֣וּ מֵ/רְפִידִ֗ים וַ/יָּבֹ֨אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽ/יַּחֲנ֖וּ בַּ/מִּדְבָּ֑ר וַ/יִּֽחַן שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: zh_hans
  text: 他们从利非订起程，来到西奈旷野，就在旷野安营。以色列在那里，在山前安营。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“面对着山”。希伯来语介词可表示位于某物前面、对面，或面对某物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起程
  rationale: נסע在行程叙事中指拔营出发；“起程”自然地表达从一地动身前往下一站。
- source_word: מֵרְפִידִים
  choice: 从利非订
  rationale: 地名רְפִידִים按普通话圣经人名地名惯例音译为“利非订”，前缀מ־译为“从”。
- source_word: וַיָּבֹאוּ
  choice: 来到
  rationale: בוא可指来、进入或抵达；与后面的目的地连用时，“来到”最符合现代汉语叙事。
- source_word: מִדְבַּר סִינַי
  choice: 西奈旷野
  rationale: מִדְבָּר指荒野或旷野；“旷野”能表达未开垦、少人居住之地，又避免把此处限定为沙漠。构造短语在汉语中自然译作“西奈旷野”。
- source_word: וַיַּחֲנוּ
  choice: 就在旷野安营
  rationale: חנה意为安营；“安营”庄重而通俗。“就”连接抵达与驻扎的连续动作，并未增加实质信息。
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: 以色列在那里……安营
  rationale: 希伯来文以单数动词配合集体名词“以色列”，所指是以色列全体；汉语无需标明语法数。“在那里”保留שָׁם的地点指示。
- source_word: נֶגֶד הָהָר
  choice: 在山前
  rationale: נֶגֶד表示位于某物前面、对面或面对某物。“在山前”简洁自然，同时以脚注保留“面对着山”这一空间关系的可能表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文连续两次提到在旷野／山前安营的重复，没有为求简洁而合并；地名采用现代中文圣经中通行的音译形式。
