  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: zh_hans
  text: 整座西奈山都烟雾弥漫，因为雅威在火中降临山上；烟气如同炉[a]所冒的烟升腾，整座山剧烈震动。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “炉”也可译为“窑”。
    reason: כִּבְשָׁן可指炉或窑；本节不足以确定具体器物。
lexical_decisions:
- source_word: וְהַר סִינַי
  choice: 西奈全山
  rationale: הַר סִינַי意为“西奈山”；结合后面的כֻּלּוֹ，将“全”自然地并入“西奈全山”。句首וְ承接上文，汉语无需机械译成“并且”或添加原文没有的时间词。
- source_word: עָשַׁן כֻּלּוֹ
  choice: 全山烟雾弥漫
  rationale: עָשַׁן描写冒烟或被烟笼罩的状态，כֻּלּוֹ强调整座山；“烟雾弥漫”在现代汉语中自然，并保留全山处于烟中的景象。
- source_word: מִפְּנֵי אֲשֶׁר
  choice: 因为
  rationale: 该结构引出原因，用“因为”准确而自然。
- source_word: יָרַד עָלָיו יְהוָה
  choice: 雅威……降临山上
  rationale: יָרַד是“下来、降下”，在神显语境中译为“降临”庄重自然；עָלָיו指向西奈山，明译为“山上”可避免代词含混。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留原文使用专名而非称号的特点。
- source_word: בָּאֵשׁ
  choice: 在火中
  rationale: 介词בְּ在此描写雅威降临时的方式或显现环境；“在火中”不额外限定火与神显的关系。
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: 烟气上腾
  rationale: עָלָה表示向上升起，עֲשָׁנוֹ的阳性单数后缀回指山；汉语省去已明确的所属关系更流畅。
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: 仿佛熔炉的烟
  rationale: כִּבְשָׁן可指窑或炉；“熔炉”能传达高温炉火与浓烟的强烈景象，同时用脚注保留“窑炉”这一词义可能。
- source_word: וַיֶּחֱרַד
  choice: 震动
  rationale: חָרַד在此描写山体猛烈颤动；“震动”清楚表达物理现象，又不额外把人的恐惧情绪加给山。
- source_word: כָּל הָהָר מְאֹד
  choice: 全山剧烈震动
  rationale: כָּל הָהָר是“整座山”，מְאֹד强烈修饰动词；“剧烈”自然保留其强调力度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现该名，并避免以“主”这一称号代替；“耶和华”是汉语传统形式，但较不贴近通常重建的读音。
- issue: בָּאֵשׁ所表达的神显关系
  choice: 在火中
  alternative: 带着火／以火的形态
  rationale: “在火中”保留介词短语的宽度，不把火进一步解释为随同之物或神本身的形态。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以短句和分号呈现原文连续推进的神显景象；避免生硬复制希伯来语连词，也不添加原文没有的解释。
