base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你到百姓那里去，今天和明天使他们分别为圣[a]，并让他们洗衣服。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们成圣”或“使他们归为圣洁”。
    reason: 保留קדשׁ使役形式所涵盖的成圣、分别归圣及礼仪预备等含义。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译上帝的盟约之名，保留原文专名，而不以“主”这一称号代替。
- source_word: וַיֹּאמֶר
  choice: 对……说
  rationale: 希伯来语叙事形式承接上文并推进事件；现代汉语无需机械译出句首连接词，也能自然表达叙事顺序。
- source_word: לֵךְ אֶל־הָעָם
  choice: 你到百姓那里去
  rationale: 准确表达命令语气及前往百姓那里的方向；“百姓”在本段指以色列会众。
- source_word: וְקִדַּשְׁתָּם
  choice: 使他们分别为圣
  rationale: 该使役强化词干表示摩西要使百姓进入为迎见上帝而分别、预备的圣洁状态；此译保留礼仪和神圣归属的含义，避免仅理解为内在道德改变。
- source_word: הַיּוֹם וּמָחָר
  choice: 今天和明天
  rationale: 直接而自然地表达为期两天的预备时段。
- source_word: וְכִבְּסוּ
  choice: 并让他们洗净
  rationale: 复数动词的主语是百姓，与对摩西的命令相连；“让他们”自然传达摩西须促使百姓执行此事，同时不把原文过度改写为直接引语中的第二人称命令。
- source_word: שִׂמְלֹתָם
  choice: 衣服
  rationale: 该词泛指衣物或外衣；“衣服”是现代汉语中准确、自然且不失庄重的表达。
theological_decisions:
- issue: קדשׁ所表达的礼仪预备
  choice: 使他们分别为圣
  alternative: 使他们成圣；使他们洁净自守
  rationale: 上下文是百姓为雅威在西奈山显现而作预备。“分别为圣”保留礼仪、盟约及归属上帝的层面，不将其局限为内在道德更新，也不把使役形式改成反身动作。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为上帝向以色列启示之专名的性质，而不以称号替代。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“百姓”“分别为圣”符合西奈立约场景的正式语域；句法尽量贴近希伯来文，同时避免生硬照搬其叙事连接形式。
