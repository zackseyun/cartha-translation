base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: zh_hans
  text: 于是，摩西来了，召集百姓的长老[a]，把雅威吩咐他的这一切话[b]都摆在他们面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“叫来百姓的长老”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“这一切事情”或“这一切事项”。希伯来语词‘דברים’既可指所说的话，也可指谈论的事情；这里因摩西是在传达雅威的信息，正文译作“话”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来了
  rationale: בוא可按叙事视角译为“来”或“去”；此处采用“来了”，不额外加入原文没有明说的“回来”。
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: 召集百姓的长老
  rationale: קרא与介词ל连用，可表示呼唤、叫来或召集；上下文是把百姓的代表聚集起来传达信息，因此“召集”自然贴切，同时保留脚注中的词义选择。
- source_word: זִקְנֵי הָעָם
  choice: 百姓的长老
  rationale: זקנים指群体中受认可的年长代表或首领；“长老”既保留原词的社会称谓，也避免泛化为“领袖”。
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: 摆在他们面前
  rationale: 直译这一“放置在……面前”的希伯来语表达；用于话语时，中文仍可自然表达郑重陈明、呈示之意。
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: 这一切话
  rationale: דברים既可指“话”，也可指“事情、事项”；鉴于摩西在传达雅威先前所说的信息，正文采用“话”，并以脚注保留语义宽度。
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: 雅威吩咐他的
  rationale: 关系从句说明这些话的来源和权威；中文无需用显式过去完成时，也能从叙事次序看出吩咐在先。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中对YHWH的常见音译“雅威”呈现神的专名，与咨询文本采用Yahweh而非称号“主”的处理一致。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用音译“雅威”，保留其专名性质；“耶和华”是传统汉译音形，“上主”则将专名处理为称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“摆在他们面前”有意保留原文的具体表达，同时在中文中可理解为郑重陈明。脚注标记均紧随所说明的词语。
