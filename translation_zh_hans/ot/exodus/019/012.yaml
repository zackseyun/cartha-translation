base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: zh_hans
  text: 你要为百姓在四周划定界限，对他们说：‘你们务要当心，不可上山，也不可触碰山的边缘。凡触碰这山的，必被处死[a]。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“必定死亡。”希伯来语使用加强语气的死亡公式；这里依照动词的被动形式，并结合下一节由人执行刑罚的语境，译作“必被处死”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: 你要……划定界限
  rationale: גבל 的使役词形表示设立边界或限界；“划定界限”自然、明确，也保留了设置禁区边界的具体含义。
- source_word: אֶת־הָעָם סָבִיב
  choice: 在百姓四周
  rationale: סָבִיב 表示周围、四面；与“划定界限”连用，清楚表达环绕百姓所处区域设限，而不是泛指一道界线。
- source_word: לֵאמֹר
  choice: 告诫他们
  rationale: 该不定式引出所说的内容。结合后文严厉警告的语用，“告诫他们”比机械译作“说”更符合现代汉语，同时未增添实质内容。
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: 你们务要当心
  rationale: 这是“谨慎、自守”的惯用警戒表达；“务要当心”保留命令和警告的力度。
- source_word: עֲלוֹת בָּהָר
  choice: 不可上山
  rationale: עלה 与 בָּהָר 在这里指登上或进入山的范围；“上山”简洁自然，并与所设界限相呼应。
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: 也不可触碰山的边缘
  rationale: נגע 是“触碰”，קָצֵהוּ 是“它的边缘、尽头”；此译保留山体边缘也不可触及的空间含义。
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: 凡触碰这山的
  rationale: 该结构具有普遍、逐一适用的意思；“凡……的”准确传达无例外的警告。
- source_word: מוֹת יוּמָת
  choice: 必被处死
  rationale: 动词不定式绝对形与被动未完成式连用，加强死亡判决的确定性；“必”体现强调，“被处死”保留被动形式，并符合下一节由他人执行刑罚的语境。
theological_decisions:
- issue: מוֹת יוּמָת 是自然死亡还是被执行死刑
  choice: 正文译作“必被处死”
  alternative: “必定死亡”
  rationale: 希伯来语的被动词形支持“被处死”，下一节也说明刑罚由他人执行；但这一加强式死亡公式本身也可较宽泛地表达“必定死亡”，故以脚注保留该译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“划定界限”“务要当心”“必被处死”保持律法宣告的严肃性；直接引语简洁有力。
