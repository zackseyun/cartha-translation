  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: zh_hans
  text: 以色列人[a]出埃及地后的第三个月，就在这一天[b]，他们来到西奈旷野。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，也可译作“以色列子孙”。这里指以色列全体人民。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在这一天”。原文也可能强调确切的日子，即“正是在这一天”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: 第三个月
  rationale: חֹדֶשׁ在这种纪时表达中通常指“月”；“第三个月”自然、准确。
- source_word: לְצֵאת
  choice: 出……以后
  rationale: 带לְ的不定式构词在此标示计时的参照点，即“在……出去之后／自……出去算起”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文直译为“以色列的众子”，在这里是对整个立约民族的惯常称呼；“以色列人”在现代汉语中自然，并以脚注保留原文形式。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 出埃及地
  rationale: 保留אֶרֶץ“地、国土”这一成分；“出埃及地”符合现代汉语的庄重叙事表达。
- source_word: בַּיּוֹם הַזֶּה
  choice: 就在这一天
  rationale: הַזֶּה明确是“这”，而“就”传达该短语可能具有的确指或强调作用，同时脚注保留较弱的译法。
- source_word: בָּאוּ
  choice: 来到
  rationale: בוא的基本义为“来、进入”；“来到”适合以地点为终点的汉语句式，不额外引入“抵达”的完成色彩。
- source_word: מִדְבַּר סִינָי
  choice: 西奈旷野
  rationale: מִדְבָּר指荒野或旷野；“西奈旷野”简洁地保留原文的属格关系，也避免把地貌过度限定为沙漠。
theological_decisions:
- issue: 立约群体称谓בְּנֵי יִשְׂרָאֵל的译法
  choice: 以色列人
  alternative: 以色列的众子／以色列子孙
  rationale: 该阳性复数是全民族的惯常称谓，并非只指男性。正文采用现代汉语中自然且涵盖全体的“以色列人”，脚注则说明原文的字面形式，以兼顾可读性与源文透明度。
- issue: בַּיּוֹם הַזֶּה的强调程度
  choice: 就在这一天
  alternative: 在这一天
  rationale: 指示词“这”必须保留；原文是否着重强调确切日期存在语用上的余地，因此正文用“就”体现可能的强调，脚注保留不加强语气的译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“出埃及地后的第三个月”清楚表达以出埃及为计时起点；“西奈旷野”沿用通行地名和自然的圣经叙事用语。
