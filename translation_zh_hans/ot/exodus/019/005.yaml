id: EXO.19.5
reference: Exodus 19:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: zh_hans
  text: 如今，你们若确实听从我的声音[a]，遵守我的约，就必从万民中[c]归我作珍爱的产业[b]，因为全地都是我的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用加强语气的结构，直译近似“听了又听”；这里表示认真、确实地听，并含有听从之意。
    reason: lexical_alternative
  - marker: b
    text: “珍爱的产业”也可译作“特有的产业”或“专属的珍宝”。
    reason: lexical_alternative
  - marker: c
    text: 即从万民之中；下句说明全地仍都属于上帝。
    reason: clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: 如今
  rationale: 既保留承接上文的意味，也自然引出当前的盟约要求；现代汉语无需机械译出连接词“和”。
- source_word: שָׁמוֹעַ תִּשְׁמְעוּ
  choice: 确实听从
  rationale: 以“确实”表达不定式绝对形加未完成式的强调；“听从”兼顾聆听与顺服之意。
- source_word: בְּקֹלִי
  choice: 我的声音
  rationale: 保留希伯来文具体的“声音”意象，而不完全抽象化为“我”。
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: 遵守我的约
  rationale: שׁמר在盟约语境中指忠实持守、履行；“遵守”是清楚自然的现代汉语表达。
- source_word: וִהְיִיתֶם לִי
  choice: 就必……归我作
  rationale: “就”明确条件句的结果，“归我作”保留לִי所表达的归属关系。
- source_word: סְגֻלָּה
  choice: 珍爱的产业
  rationale: 该词指主人特别珍视、归其所有的财产；“珍爱的产业”同时传达珍贵与归属。
- source_word: מִכָּל הָעַמִּים
  choice: 从万民中
  rationale: 将מִן理解为从众民之中拣选，避免译成“高过万民”而额外引入等级含义。
- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: 因为全地都是我的
  rationale: כִּי在此说明前句的根据；“全地”与“万民”相应，表达上帝对整个世界的所有权。
theological_decisions:
- issue: 盟约语境中的שמע应译为“听”还是“顺服”
  choice: 确实听从我的声音
  alternative: 真正顺服我
  rationale: “听从”在自然汉语中包含服从意味，同时保留原文以“声音”和聆听为中心的具体表达；下文“遵守我的约”进一步表明顺服的实践层面。
- issue: סְגֻלָּה是否暗示以色列排除万民而成为上帝唯一所有
  choice: 从万民中归我作珍爱的产业
  alternative: 在万民之上作我特有的产业
  rationale: “从万民中”表达其独特的盟约身份，而“全地都是我的”继续维护上帝对全地的普遍所有权，不把经文张力化约为排他性或等级性命题。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听从我的声音”略带圣经语体，以保留原文意象；其余句法力求普通读者易懂。脚注标记均置于其所说明的词组之后。
