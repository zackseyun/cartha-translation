base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: zh_hans
  text: 他对百姓说：“你们要预备三天；不可亲近女人。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲近女人”是委婉说法；在这里指在预备期间不可发生性关系。
    reason: 说明原文委婉语在本段预备语境中的含义，同时避免在正文中加入更直白或更限定性的措辞。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他……说
  rationale: 这是希伯来叙事中常见的 wayyiqtol 形式；中文用“他……说”自然承接上文，不额外限定为单纯先后或因果关系。
- source_word: אֶל הָעָם
  choice: 对百姓
  rationale: עָם 在这里指聚集的以色列民众；“百姓”是自然、庄重且符合上下文的集体称呼。
- source_word: הֱיוּ נְכֹנִים
  choice: 要预备
  rationale: היה 的命令式与 נָכוֹן 连用，要求人处于准备妥当的状态；“要预备”简洁地表达这一劝令，也与本段分别为圣的语境相符。
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: 三天
  rationale: 介词 לְ 与“三天”构成时间表达。这里译作“预备三天”，保留原文简洁的时间措辞，不在正文中强行判定为“为期三天”或“到第三天”。
- source_word: אַל תִּגְּשׁוּ
  choice: 不可亲近
  rationale: אַל 加未完成式表达禁止；נגשׁ 的基本意思是靠近、接近。“不可亲近”既保留字面意象，也能承载此处的委婉含义。
- source_word: אֶל אִשָּׁה
  choice: 女人
  rationale: 原文直译为“女人”，并未明说“妻子”或直接使用表示性交的词。正文保留这一委婉说法，脚注说明其语境含义。
theological_decisions:
- issue: 是否在正文中明说这项禁令是暂时禁绝性关系
  choice: 保留原文的委婉表达“不可亲近女人”
  alternative: 不可与女人发生性关系；不可亲近自己的妻子
  rationale: 原文使用“亲近女人”这一委婉表达。保留它可避免把未明说的“妻子”加入正文，也不把委婉语改成直白陈述；脚注则使现代读者能够理解其在预备、洁净语境中的通常含义。
- issue: לִשְׁלֹשֶׁת יָמִים 的时间指向
  choice: 译作“预备三天”，保留简略表达
  alternative: 为这三天做好准备；为第三天做好准备；到第三天要预备好
  rationale: 该短语可被理解为一段三天的预备期，也可结合第11节理解为面向第三天的准备。正文不借中文扩写来完全消除这一张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“百姓”“预备”“不可亲近”与西奈山叙事的正式语体协调；正文保持简练，脚注只澄清现代读者可能无法直接识别的委婉含义。
