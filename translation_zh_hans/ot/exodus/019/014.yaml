  text: וַ/יֵּ֧רֶד מֹשֶׁ֛ה מִן הָ/הָ֖ר אֶל הָ/עָ֑ם וַ/יְקַדֵּשׁ֙ אֶת הָ/עָ֔ם וַֽ/יְכַבְּס֖וּ שִׂמְלֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: zh_hans
  text: 于是，摩西从山上下到百姓那里，使百姓分别为圣[a]；他们也洗了自己的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使百姓成圣”，也可译“将百姓分别出来”。
    reason: 词义兼具成为圣洁和分别出来的含义；脚注保留קדשׁ在礼仪语境中的译法幅度。
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 下到
  rationale: ירד表示向下移动；“从山上下到……那里”自然呈现摩西由山上前往百姓所在之处的叙事动作。
- source_word: מִן הָהָר
  choice: 从山上
  rationale: הַר在上下文中特指西奈山；汉语用“从山上”既明确起点，也自然配合“下到”。
- source_word: אֶל הָעָם
  choice: 到百姓那里
  rationale: עָם通常指“百姓”；“那里”使现代汉语中的移动方向表达更完整，不把百姓过度具体化为某种正式集会。
- source_word: וַיְקַדֵּשׁ
  choice: 使……分别为圣
  rationale: קדשׁ的Piel形式在此指为迎见上帝而作礼仪性的预备和分别。“使……分别为圣”保留圣洁语义与使役关系，又不暗示这里单指道德上的内在转变。
- source_word: הָעָם
  choice: 百姓
  rationale: 保留希伯来文重复出现的对象，与前句一致，并维持叙述清晰。
- source_word: וַיְכַבְּסוּ
  choice: 洗了
  rationale: כבס具体指洗涤衣物；与宾语“衣服”连用时，“洗了”是自然准确的现代汉语。
- source_word: שִׂמְלֹתָם
  choice: 自己的衣服
  rationale: שִׂמְלָה泛指衣物。“自己的衣服”自然表达第三人称复数领属关系，并避免“衣袍”可能造成的过度具体化。
theological_decisions:
- issue: 西奈显现前礼仪性圣洁用语的译法
  choice: 使百姓分别为圣
  alternative: 使百姓成圣；使百姓洁净；将百姓分别出来
  rationale: 本节描写百姓为迎见上帝所作的礼仪性预备。“分别为圣”同时保留קדשׁ的圣洁及分别含义，不把它缩减为一般清洁，也不将其静默解释为后来的特定教义范畴。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”衔接叙事进程；分号呈现摩西的行动与百姓洗衣之间紧密而有区别的关系。保留“百姓”的重复，并用脚注呈现圣洁术语的真实词义幅度。
