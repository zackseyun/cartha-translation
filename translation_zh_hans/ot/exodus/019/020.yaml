revisions:
- from: 雅威降临在西奈山上，就是山顶[a]。随后，雅威召摩西到山顶[b]，摩西就上去了。
  to: 雅威降到西奈山的山顶[a]。随后，雅威召摩西到山顶[b]，摩西就上去了。
  rationale: 将首句改为“降到西奈山的山顶”，以准确、自然地表达原文中雅威下降并抵达山顶的地点关系；保留神名、人名、上下移动的对照以及两处脚注锚点。脚注a调整为与该处空间表达直接相关的译法说明。
