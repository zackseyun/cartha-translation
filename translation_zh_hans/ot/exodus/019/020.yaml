base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: zh_hans
  text: 雅威降到西奈山的山顶[a]。随后，雅威召摩西到山顶[b]，摩西就上去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“雅威降临在西奈山上，到了山顶。”
    reason: 说明希伯来语中“降在西奈山上，至山顶”的空间表达可作较展开的译法。
  - marker: b
    text: 希伯来文直译为“山的头”，意思是山顶或峰顶。
    reason: 说明原文רֹאשׁ的字面意象及其语境含义。
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 降临
  rationale: ירד表示“下来、降下”。这里主语是雅威，“降临”既保留向下的移动，也符合庄重而自然的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号替代原文中的专名。
- source_word: הַר סִינַי
  choice: 西奈山
  rationale: 采用该地名在现代汉语中的通行译法。
- source_word: אֶל רֹאשׁ הָהָר
  choice: 到山顶
  rationale: רֹאשׁ本义为“头”，用于山时指山的顶部或峰顶；“山顶”简明自然。
- source_word: וַיִּקְרָא
  choice: 召
  rationale: קרא在此表示叫某人前来；“召”比单纯的“叫”更能体现呼召摩西上山的语境，同时未强化为带有制度色彩的“召见”。
- source_word: לְמֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代汉语圣经传统中的通行音译。
- source_word: וַיַּעַל
  choice: 上去了
  rationale: עלה表示“上去”。此译法与前面的“降临”形成原文所具有的上下移动对照，并保持叙事自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文以“雅威”音译该专名，避免用“主”等称号取代，同时在脚注保留汉语读者熟悉的另一传统音译。
- issue: 雅威降临与摩西上去的空间叙述
  choice: 保留雅威“降临”、摩西“上去”的对照
  alternative: 将前半句弱化为“雅威显现在山顶”
  rationale: 原文明确使用ירד与עלה两个方向相反的动词；保留这一对照，不把“降临”解释成单纯显现。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。保留原文先说“西奈山”、再具体说明“山顶”的复述结构；以“随后”和“就”使连续叙事自然流畅。
