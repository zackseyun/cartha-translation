  source_fidelity: 原文两次使用“到山的顶端”（אֶל־רֹאשׁ הָהָר）。草稿前句的“降临在西奈山上，就是山顶”将地点短语处理成解释性同位语，不能清楚表达“降到……山顶”的终点；改为“降到西奈山的山顶”可准确保留空间移动和目的地。后句“召摩西到山顶，摩西就上去了”符合原文的连续动作。
  naturalness: “在西奈山上，就是山顶”在现代汉语中不够自然，且容易被理解为“西奈山就是山顶”。“降到西奈山的山顶”清晰、庄重而自然。
  terminology: “雅威”“西奈山”“摩西”均合适；“降到”与“上去了”保留原文向下、向上的叙事对照。“召”在此可指召唤摩西前来，语体恰当。
