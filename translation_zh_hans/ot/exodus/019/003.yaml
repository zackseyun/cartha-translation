  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: zh_hans
  text: 摩西上到上帝那里。雅威从山上呼唤他，说：“你要这样对雅各家说，向以色列子孙[a]宣告：”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的儿子们”，在这里是指以色列的子孙或以色列民的集合性称呼。
    reason: 说明希伯来语阳性集合表达的字面形式及其语境含义。
lexical_decisions:
- source_word: עָלָה
  choice: 上到
  rationale: 保留动词所表达的向上移动，也符合摩西登山的语境；“上到……那里”在现代汉语中自然清楚。
- source_word: הָאֱלֹהִים
  choice: 上帝
  rationale: 定冠词在此指以色列的上帝；汉语不必逐字译出冠词。“上帝”是现代普通话中自然、庄重的对应词。
- source_word: וַיִּקְרָא אֵלָיו
  choice: 呼唤他
  rationale: קרא与אֶל连用表示朝某人呼喊或召唤；“呼唤他”既保留方向意味，又符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对四字神名的直接音译，而不以“主”这一称号替代；“雅威”较直接反映通常重构的读音。
- source_word: מִן הָהָר
  choice: 从山上
  rationale: הַר在上下文中指西奈山；“从山上”准确表达声音发出的地点。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出直接引语，汉语以“说”最自然。
- source_word: כֹּה תֹאמַר
  choice: 你要这样……说
  rationale: 保留正式传话公式的语气，同时采用自然现代汉语语序。
- source_word: לְבֵית יַעֲקֹב
  choice: 对雅各家
  rationale: “雅各家”保留原文以家族称呼整个群体的盟约性、集合性表达。
- source_word: וְתַגֵּיד
  choice: 向……宣告
  rationale: 该使役形动词有“使人知道、郑重告知”之意；“宣告”与前面的“说”形成适当的平行变化。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: “子孙”既保留בְּנֵי源于“儿子”的家族谱系意象，也能在现代汉语中自然指整个以色列群体。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用专有神名而非“主”这一称号，因此正文采用音译。“雅威”反映学界通常重构的读音；“耶和华”则是汉语传统中依据较晚合成读法形成的译名。
- issue: לִבְנֵי יִשְׂרָאֵל的集合性与性别表达
  choice: 以色列子孙
  alternative: 以色列的儿子们；以色列人
  rationale: 这里的阳性复数是对全体以色列民的家族性称呼，并非仅明确指男性。“子孙”保存其谱系和集合意味，且不把范围无根据地限制为成年男性；脚注说明其字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“雅各家”与“以色列子孙”的平行结构，并以冒号表明神谕在下一节继续。
