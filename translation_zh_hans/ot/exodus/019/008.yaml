base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: zh_hans
  text: 全体百姓一同回答说：“雅威所说的一切，我们必照着做。”于是，摩西把百姓的话回报[a]给雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“禀报”。
    reason: וַיָּשֶׁב在此可指把百姓的话带回禀告给雅威；“回报”保留其“带回／回转”语感。
lexical_decisions:
- source_word: וַיַּעֲנוּ כָל־הָעָם יַחְדָּו
  choice: 众百姓一同回答说
  rationale: 保留“全体百姓”的集体范围和יַחְדָּו所强调的一致回应；“回答说”自然呈现叙事中的对话关系。
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: 雅威所说的一切
  rationale: 按原文保留“所说的一切”的完整范围，并将神名יְהוָה作为专名音译，而不以头衔代替。
- source_word: נַעֲשֶׂה
  choice: 我们都要照着做
  rationale: 原动词的基本义是“做、实行”。“照着做”在现代汉语中自然，也避免直接译成解释性较强的“顺服”。其中“都”表达百姓共同承担这一承诺。
- source_word: וַיָּשֶׁב מֹשֶׁה אֶת־דִּבְרֵי הָעָם אֶל־יְהוָה
  choice: 于是，摩西把百姓的话回报给雅威
  rationale: 使役形态וַיָּשֶׁב在这里表示把话带回或回报；“回报给”既保留“返回”的语意，也符合现代汉语表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用以四个辅音字母构成的神名。正文采用较接近“Yahweh”的现代音译“雅威”，不以“主”这一头衔取代专名；同时以脚注说明读音及中文传统译法。
- issue: נַעֲשֶׂה是否译为明确的顺服用语
  choice: 我们都要照着做
  alternative: 我们都必顺服；我们都愿遵行
  rationale: 盟约语境确有顺服含义，但原文动词本身是“做、实行”。所选译法保留这一直白承诺，不额外加入“愿意”或把语义收窄为“顺服”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“众百姓一同”突出共同回应；“照着做”比生硬的“我们必做”更自然，同时仍紧贴原文。“于是”顺畅连接后续动作，但不赋予额外因果意义。
