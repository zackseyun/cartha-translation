base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: zh_hans
  text: 号角声越来越强烈[a]；摩西说话，上帝以声音回答他[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“号角声越来越响。”希伯来文直译为“号角声不断增强，变得极其强烈”。
    reason: lexical_alternative
  - marker: b
    text: 也可理解为“上帝在雷声中回答他”或“上帝出声回答他”。希伯来文只说“以声音”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: （融入）越来越
  rationale: 该叙事形式引出场景的发展；汉语无需直译为“事情是”，可与后面的持续增强表达自然结合。
- source_word: קוֹל הַשּׁוֹפָר
  choice: 号角声
  rationale: קוֹל 在此受 שׁוֹפָר 限定，指号角发出的声音；“号角声”简洁自然。
- source_word: הַשּׁוֹפָר
  choice: 号角
  rationale: שׁוֹפָר 指用作吹奏器具的角；“号角”既保留角制乐器的意象，也符合现代汉语。
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: 越来越强烈
  rationale: 该结构表示持续加剧。译作“越来越强烈”保留“增强”的宽泛意象，而不在正文中将其限缩为单纯音量变大。
- source_word: מֹשֶׁה יְדַבֵּר
  choice: 摩西说话
  rationale: 未完成式可描绘场景中持续或反复的动作；汉语以“说话”配合下句的“就”呈现相应关系，不强行判定为一次性动作。
- source_word: וְהָאֱלֹהִים
  choice: 上帝
  rationale: 此处定指以色列的上帝；现代汉语通常不另译希伯来语冠词。
- source_word: יַעֲנֶנּוּ
  choice: 就……回答他
  rationale: 动词意为“回答他”；“就”自然呈现摩西说话与上帝回应之间的对应关系。
- source_word: בְּקוֹל
  choice: 用声音
  rationale: 按字面保留“用／以声音”的宽泛措辞，不直接解释成雷声，也不弱化为仅仅“听得见”。
theological_decisions:
- issue: 西奈山上上帝回应的性质
  choice: 上帝就用声音回答他
  alternative: 上帝在雷声中回答他；上帝出声回答他
  rationale: בְּקוֹל 本身只说“用／以声音”，既可能被理解为声音，也有人按显现语境理解为雷声。正文保留原文的宽泛性，脚注列出较具解释性的可能译法。
- issue: 摩西说话与上帝回答的动作体
  choice: 以“说话……就……回答”呈现相应过程
  alternative: 摩西一再说话，上帝也一再回答他；摩西说了话，上帝便回答他
  rationale: 两个未完成式可以描绘持续或反复动作，但本节不足以明确限定次数。正文采用不标明次数的自然汉语，避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“号角”比“喇叭”更能保留 שׁוֹפָר 的角制器具意象；“强烈”保留原文未明确限定为音量的表达。所有脚注标记均置于正文相应位置。
