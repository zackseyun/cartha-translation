  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: zh_hans
  text: 连那些亲近雅威[a]的祭司也要使自己分别为圣，免得雅威向他们发作[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲近雅威”也可译作“走近雅威”或“到雅威面前来”。
    reason: lexical_alternative
  - marker: b
    text: “向他们发作”直译可作“冲破而出攻击他们”；原文描绘雅威的审判突然爆发。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 连……也
  rationale: 既承接上文，又突出祭司也不例外，准确表达附加兼强调的语气。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 这是该词在礼仪语境中的标准现代汉语译法；汉语不需另以定冠词标示其确定性。
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: 亲近雅威
  rationale: 分词 נגשׁ 表示走近、来到近前；在本节礼仪语境中含有来到上帝面前供职的意味。“亲近”简洁自然，并保留接近神圣临在的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为盟约之神专名的功能；末句再次出现时仍重复译出，不改作代词。
- source_word: יִתְקַדָּשׁוּ
  choice: 要使自己分别为圣
  rationale: Hitpael 形态具有反身意义，指祭司预备并洁净自己，使自己处于圣洁、可近前供职的状态。“分别为圣”保留礼仪色彩而不限定具体仪式。
- source_word: פֶּן
  choice: 免得
  rationale: 自然表达警告及所要避免的负面后果。
- source_word: יִפְרֹץ בָּהֶם
  choice: 向他们发作
  rationale: פרץ 的意象是突然冲破、爆发；结合介词 ב 和西奈山警告的语境，这里指雅威突然施行敌对性的审判。“发作”在现代汉语中自然，并保留突然而强烈的意味，脚注补明原文形象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近其通常学术重构读音的“雅威”，使其专名和盟约名称的性质清楚可见。
- issue: יִפְרֹץ בָּהֶם 所指后果的性质
  choice: 雅威向他们发作
  alternative: 雅威冲破而出攻击他们
  rationale: 上下文表明这是对未分别为圣者的危险警告，但原文没有说明惩罚的具体方式。正文保留突然爆发的审判意味，同时不擅自补入死亡或其他特定刑罚。
- issue: 祭司“分别为圣”的方式
  choice: 不说明具体仪式
  alternative: 解释为特定的洁净礼或献祭程序
  rationale: יִתְקַדָּשׁוּ 要求祭司使自己成为圣洁，但本节没有列出实施方式，因此不将某一特定仪式写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“连……也”呈现强调，“分别为圣”保留西奈山礼仪语境中的神圣性；正文避免过度解释审判的具体形式。
