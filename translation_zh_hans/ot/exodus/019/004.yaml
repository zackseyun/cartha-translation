  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: zh_hans
  text: 你们亲眼看见了我对埃及所做的事；我把你们背在鹰的翅膀上[a][b]，带到我这里来[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“在众鹰的翅膀上”。这是一个生动的比喻，描绘上帝以大能保护并拯救他们。
    reason: lexical_alternative
  - marker: b
    text: 译作“鹰”的希伯来词也可泛指大型猛禽。
    reason: lexical_alternative
  - marker: c
    text: 直译“带到我这里”；按上下文，也含有把他们带来归属上帝、与他建立关系的意味。
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם רְאִיתֶם
  choice: 你们亲眼看见了
  rationale: 独立人称代词 אַתֶּם 强调受话者；“亲眼”以自然汉语保留“你们自己看见”的强调意味。完成体动词指他们已经亲历、如今仍可作证的事件。
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: 我对埃及所做的事
  rationale: 介词 לְ 在此表示埃及是上帝行动所及的对象，并非受益者；“埃及”保留国家及其人民的集合意义。
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: 我把你们背在
  rationale: נשא 的基本义为承载、携带；“背在”既符合翅膀的意象，也以现代汉语表达保护性的承载。
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: 鹰的翅膀上
  rationale: 直译该生动比喻，表达迅速、有力而具保护性的拯救。נְשָׁרִים 在此按传统且符合语境译为“鹰”，同时以脚注保留其较宽泛的词义范围。
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: 带到我这里来
  rationale: 贴近 אֵלָי“到我这里／到我面前”的空间和关系表达，不在正文中把其中的盟约关系含义过度明确化。
theological_decisions:
- issue: 拯救终点所含的关系意义
  choice: 带到我这里来
  alternative: 带来归我
  rationale: 经文既可直接描述上帝把以色列带到自己所在之处，也在上下文中带有进入盟约关系的意味。“带到我这里来”保留两者之间的张力；“带来归我”虽突出归属关系，却比希伯来原文更明确。
translation_notes:
  register: 采用现代、庄重而口语可懂的表达。“亲眼看见”自然传达原文独立代词的强调；分号保留前半句见证与后半句拯救行动之间的推进。正文不添加“约”或“归属”等原文未明说的术语，而在脚注中说明关系层面的可能含义。
