  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: zh_hans
  text: 耶和华对摩西说：“看哪，我要在浓云中临到你那里，好让百姓听见我同你说话，也永远信任你[a]。”摩西就把百姓的话告诉了耶和华。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“相信你”。希伯来语可表示百姓信任摩西，承认他是上帝所认可的代言人。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示语的指示作用和庄重语气。
- source_word: אָנֹכִי בָּא אֵלֶיךָ
  choice: 我要……临到你那里
  rationale: 分词表达即将发生、近在眼前的行动；“临到”符合庄重叙事语域，“你那里”保留方向意义。
- source_word: בְּעַב הֶעָנָן
  choice: 在浓云中
  rationale: 自然呈现云层浓密的意象，同时避免生硬直译为“在云的浓厚中”。
- source_word: בַּעֲבוּר
  choice: 好让
  rationale: 在此引出目的，现代中文用“好让”清楚而自然。
- source_word: יִשְׁמַע הָעָם בְּדַבְּרִי עִמָּךְ
  choice: 百姓听见我同你说话
  rationale: 将介词加不定式结构按时间情境自然表达，并保留“同你”所体现的交谈关系。
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: 也……信任你
  rationale: אמן 的使役式与 ב 连用可表示相信或信赖某人；上下文强调摩西作为上帝认可的传言者具有可信性。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 简明保留持续长久、没有限定终点的表达。
- source_word: וַיַּגֵּד
  choice: 就……告诉了
  rationale: “就”推进叙事，“告诉”自然表达摩西向耶和华转述百姓的话。
- source_word: דִּבְרֵי הָעָם
  choice: 百姓的话
  rationale: 既保留“话”这一词义，又符合现代汉语习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名；译作中文读者熟悉的专名“耶和华”，避免用称号“主”取代专名。
- issue: בְּךָ יַאֲמִינוּ 所表达的百姓与摩西的关系
  choice: 信任你
  alternative: 相信你；信靠你
  rationale: 这里是在确立摩西作为上帝所认可之传言者的可信性。“信任”保留对摩西的信赖，同时避免“信靠”在中文神学语境中可能暗示敬拜性的信仰。脚注列出“相信你”，以保留原词的语义幅度。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“看哪”保留原文的郑重提示语；“浓云”“临到”维持西奈显现的叙事气氛。脚注明确处理“信任／相信”的词义空间，不将其强化为对摩西的敬拜性信仰。
