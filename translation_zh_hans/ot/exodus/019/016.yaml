base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: zh_hans
  text: 第三天，到了早晨，有雷声[a]和闪电，山上有浓云，号角声[b]极其响亮[c]；营中所有的百姓都颤抖起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“声音”或“说话声”；希伯来语这个词可指声音或说话声，但这里与“闪电”并列，最可能是指雷声。
    reason: lexical_alternative
  - marker: b
    text: 或译“公羊角的声音”。希伯来语 shofar 指一种角号，传统上常由兽角制成。
    reason: lexical_alternative
  - marker: c
    text: 直译“非常强”；这里形容号角声的强烈程度。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: 第三天早晨
  rationale: 两个时间结构共同定位事件发生于第三天的早晨；汉语无需机械重复“事情发生了……当早晨来到时”，简洁表达即可完整传达时序。
- source_word: קֹלֹת
  choice: 雷声
  rationale: 该词可指声音或嗓音，但与“闪电”并列，在西奈山显现的语境中最自然地指雷声；脚注保留其较宽的词义。
- source_word: וּבְרָקִים
  choice: 闪电交加
  rationale: 原文为复数，描绘接连出现的闪电；“闪电交加”既自然又保留场面的强烈动态。
- source_word: עָנָן כָּבֵד
  choice: 浓云
  rationale: כָּבֵד 字面为“沉重的”，修饰云时表示厚重、浓密；现代汉语以“浓云”最自然。
- source_word: עַל הָהָר
  choice: 山上
  rationale: 保留 עַל 在此处“在……上”的空间意义，不额外判定云是在山顶还是覆盖于山的上空。
- source_word: קֹל שֹׁפָר
  choice: 号角声
  rationale: שֹׁפָר 是以兽角制成的号角；“号角声”准确表达 קֹל 所强调的声音，也比泛称“喇叭声”更符合古代背景。
- source_word: חָזָק מְאֹד
  choice: 极其响亮
  rationale: 字面意为“非常强”，用于声音时表示强烈、宏亮；“极其响亮”是自然汉语，并以脚注注明字面表达。
- source_word: וַיֶּחֱרַד
  choice: 颤抖起来
  rationale: 动词表示因恐惧或震撼而战栗；“颤抖起来”兼顾身体反应和叙事中动作的开始。
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: 营中所有的百姓
  rationale: 自然而完整地传达“所有在营中的百姓”，无需在汉语中保留生硬的关系从句。
theological_decisions:
- issue: 西奈山神显中的感官现象
  choice: 按经文直接描写雷声、闪电、浓云和号角声，不加入其来源或象征意义
  alternative: 把 קֹלֹת 译作“众声音”，从而暗示天上的声音
  rationale: 上下文与“闪电”的并列支持“雷声”，但原词的广泛语义仍在脚注中保留；正文不引入经文没有明说的神学解释。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。以短句和分号呈现接连发生的神显现象；避免古雅的“是日”“有声”等表达，也不添加原文未明说的解释。
