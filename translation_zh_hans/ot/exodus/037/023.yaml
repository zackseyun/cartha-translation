  language: zh_hans
  text: 他用纯金做了灯台的七盏灯、灯剪[a]和火盘[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灯芯钳”；希伯来语指一种用来处理灯芯的器具。
    reason: lexical_alternative
  - marker: b
    text: 或译“托盘”；希伯来语指与灯台配用的盘状容器，其具体用途不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又……做了
  rationale: 以自然的汉语叙事承接上文；“又”体现וַ־的连续叙事作用，“做了”准确表达עשה。
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: 灯台的七盏灯
  rationale: נֵרֹת指灯而非灯台，阴性单数后缀回指上下文中的灯台；汉语按自然语序将数词置于名词前。
- source_word: מַלְקָחֶיהָ
  choice: 灯剪
  rationale: 该词在灯台器具的语境中指整理或夹取灯芯的工具；“灯剪”简洁，并避免普通“钳子”可能造成的语境不明。脚注保留“灯芯钳”这一较直白的译法。
- source_word: מַחְתֹּתֶיהָ
  choice: 灯花盘
  rationale: 该词通常指盘状容器；在灯台语境中，很可能是承接剪下灯芯残屑的小盘。“灯花盘”体现具体用途，同时以脚注保留“火盘”或“托盘”的词义可能。
- source_word: זָהָב טָהוֹר
  choice: 用纯金
  rationale: 自然表达制作材料，并按句末材料短语对前列灯具及器具的整体修饰来处理。
