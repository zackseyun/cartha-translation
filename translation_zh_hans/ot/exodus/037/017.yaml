base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: zh_hans
  text: 他用纯金做了灯台。他把灯台锤制而成[a]；灯台的底座、主干、杯、花蕾[b]和花朵，都与灯台本体浑然一体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“锤打而成”。原文所用的词指金属经过锤打而成形。
    reason: lexical_alternative
  - marker: b
    text: “花蕾”也可译作“球饰”。原文指球状的装饰凸起；这里依照灯台的植物造型译为“花蕾”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרָה
  choice: 灯台
  rationale: 指承托灯盏的礼仪器具，而非单独的一盏灯；“灯台”准确且符合现代汉语习惯。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 在材料描述中，טָהוֹר 表示纯净、精炼；“纯金”自然准确。
- source_word: מִקְשָׁה
  choice: 锤打成型
  rationale: 该词描述金属经锤打制成的工艺；此译法既保留制作方式，也避免误解为铸造或由零件拼接。
- source_word: יְרֵכָהּ
  choice: 底座
  rationale: 该词本义与“大腿、侧部”有关，在灯台结构中指下方起支撑作用的部分；“底座”最清楚。
- source_word: קָנָהּ
  choice: 主干
  rationale: 此处单数指灯台中央的结构部分；“主干”既符合器物结构，也与整体植物造型相协调。
- source_word: גְּבִיעֶיהָ
  choice: 杯
  rationale: 指杯状的装饰构件；直译为“杯”简洁，并保留原文的器形意象。
- source_word: כַּפְתֹּרֶיהָ
  choice: 花蕾
  rationale: 该词指球状或瘤状的装饰凸起；结合灯台的植物造型译为“花蕾”，同时以脚注保留“球饰”这一较形式化的可能译法。
- source_word: פְרָחֶיהָ
  choice: 花朵
  rationale: 该词指花形装饰；“花朵”与“花蕾”自然对应，保留植物意象。
- source_word: מִמֶּנָּה הָיוּ
  choice: 都与灯台连成一体
  rationale: 表示各部分由灯台本体而出，并非另行制作后附加；此译法清楚表达其一体性。
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: 做了……把……锤打成型
  rationale: 保留原文对制作动作的重复，同时第二处结合 מִקְשָׁה 自然表达具体工艺。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“底座、主干、杯、花蕾、花朵”兼顾器物结构和植物造型；避免生硬照搬“腿”等字面义。脚注标记均置于所解释的词语之后。
