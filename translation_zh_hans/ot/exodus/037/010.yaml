lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: 该叙事形式表示接续发生的过去动作；现代汉语无需逐字译出句首连接词，译作“做了”自然且忠实。
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 此词指会幕中的特定桌子；汉语在上下文中无需另用定冠词。
- source_word: עֲצֵי שִׁטִּים
  choice: 金合欢木
  rationale: 该短语指一种金合欢属树木的木材。“金合欢木”比传统的“皂荚木”更符合现代植物学用语；因具体树种不能完全确定，另加脚注说明传统译法。
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: 长二肘
  rationale: 保留古代长度单位“肘”，并按自然汉语将“它的长度”简洁表达为“长”。
- source_word: וְאַמָּה רָחְבּוֹ
  choice: 宽一肘
  rationale: 准确保留宽度数值，并采用自然、简练的汉语尺寸表达。
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: 高一肘半
  rationale: 原文直译为“它的高度是一肘又半肘”；“高一肘半”在现代汉语中自然，并准确保留数值。
theological_decisions: []
