  yaml_path: translation/ot/exodus/037/026.yaml
  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: zh_hans
  text: 他用纯金包裹这坛的顶、四面的侧壁和坛角，又在坛的四周做了金边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“金冠”。希伯来语这个词指环绕器物的装饰边缘或凸缘。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: 用……包裹
  rationale: 在会幕器具的制作语境中，צפה指在木制器物表面覆上金属；“用纯金包裹”自然清楚，也避免把工艺过度限定为现代电镀。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 准确表达金子的纯度和品质，且符合现代汉语常用说法。
- source_word: גַּגּוֹ
  choice: 坛的顶
  rationale: גג通常可指“屋顶”，但这里所说的是小型坛的顶部表面；译作“坛的顶”符合器物语境。
- source_word: קִירֹתָיו
  choice: 四周的侧面
  rationale: 该词字面可指“墙壁”，用于器具时译作“侧面”更自然；与סָבִיב合译为“四周的侧面”，保留环绕全部侧面的含义。
- source_word: קַרְנֹתָיו
  choice: 坛角
  rationale: 指祭坛四角凸起的角状部分。“坛角”是简洁明确的圣所器具用语，并保留原文意象。
- source_word: זֵר
  choice: 一圈金边
  rationale: זֵר在此指环绕器物的装饰性边饰或凸缘；“一圈金边”通俗自然，并由脚注保留传统的“金冠”译法。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“这坛”依上下文补明所指器物；分号对应原文两个连续动作。脚注标记置于其实际解释的“金边”之后，而不是置于“坛的顶”之后。
