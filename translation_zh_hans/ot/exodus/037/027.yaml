base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: zh_hans
  text: 他又为坛做了两个金环，安在坛的饰边[a]下方、坛的两个侧面构件上、坛的两边[b]，作杠的套环，以便用杠抬坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“边沿”。希伯来语 זֵר 指坛顶周围的装饰性边缘。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文连续用了两个相近的说法：“在它的两个侧面构件上，在它的两边。”正文保留这种重复，没有将两者合并。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: 又……两个金环
  rationale: וּ承接前文的制作叙述，现代汉语用“又”自然表达顺承；טַבְּעֹת זָהָב指用金制成的环。
- source_word: עָשָׂה לוֹ
  choice: 给坛做了
  rationale: 代词所指是上下文中的香坛；汉语明确说“坛”，可避免连续使用无生命代词造成生硬或歧义。
- source_word: מִתַּחַת לְזֵרוֹ
  choice: 在坛的饰边以下
  rationale: זֵר在会幕器具语境中指坛顶周围的装饰性边缘。“饰边”兼顾其结构位置和装饰性质；脚注保留“边沿”这一可行表达。
- source_word: עַל שְׁתֵּי צַלְעֹתָיו
  choice: 在坛的两个侧面构件上
  rationale: צלע可指侧面、肋部或侧边构件。此处采用较宽泛的“侧面构件”，既体现器具结构，又不把它过度具体化为确定样式的侧板或框架。
- source_word: עַל שְׁנֵי צִדָּיו
  choice: 在坛的两边
  rationale: צד是通常表示“边、侧”的词。正文保留它与前一短语的重复，不擅自合并。
- source_word: לְבָתִּים לְבַדִּים
  choice: 作为穿杠的环座
  rationale: בָּתִּים字面为“房屋”，在这里指容纳抬杠的套座或承托处；结合前述金环，译作“穿杠的环座”清楚自然。
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: 好用杠抬坛
  rationale: 不定式表达目的，בָּהֶם表达借助这些杠搬运；“好用杠抬坛”简洁呈现目的和工具关系。
