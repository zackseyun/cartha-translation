  register: 采用现代、庄重而清楚的叙述体。“又有”承接器具制作的连续描述；重复“灯台的枝子”在一定程度上保留原文的结构性重复，同时用“这一边……另一边”使汉语流畅。原文此处没有需要以脚注保留的实质歧义。
