  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: zh_hans
  text: 灯台的两边伸出六根枝子：一边伸出三根灯台的枝子，另一边也伸出三根灯台的枝子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: 枝子
  rationale: 在灯台的语境中，קנה指从主干向外伸出的枝状部分；“枝子”自然保留灯台的造型意象，也比“芦苇”或“臂”更切合上下文。
- source_word: יֹצְאִים
  choice: 伸出来 / 伸出
  rationale: 该分词描写六根枝子从灯台主体向外延伸；“伸出来”既保留动态描写，也符合现代汉语表达。
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: 从灯台两边 / 从这一边 / 从另一边
  rationale: צד意为“边、侧面”。首处复数概括两边，随后分别说明两侧；汉语用“这一边……另一边”清楚自然地呈现这种对应结构。
- source_word: מְנֹרָה
  choice: 灯台
  rationale: 该普通名词在会幕器具语境中指承托灯盏的灯台；“灯台”是准确、通行且易懂的中文译法。
- source_word: הָאֶחָד
  choice: 这一边
  rationale: 原文直译近于“它的一边”，并与“第二边”形成配对；“这一边”在中文中自然地保留对应关系。
- source_word: הַשֵּׁנִי
  choice: 另一边
  rationale: 字面为“第二边”，但在两边相对的语境中，现代汉语通常说“另一边”；此译法没有改变所指，且避免生硬表达。
theological_decisions: []
