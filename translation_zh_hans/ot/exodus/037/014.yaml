  language: zh_hans
  text: 这些环在边框旁边，供杠穿过，好用杠抬桌子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: 在边框旁边
  rationale: לְעֻמַּת 在空间关系中可表示相对、靠近或毗邻；结合器物结构及上下文，译作“在……旁边”自然清楚，同时不把位置关系过度具体化。מִסְגֶּרֶת 指桌面周围的框边，译作“边框”。
- source_word: בָּתִּים לַבַּדִּים
  choice: 作为穿杠的套座
  rationale: בָּתִּים 字面为“房屋”，在器物语境中指容纳、固定物件的座或套；此处说明环供杠穿入，译作“套座”准确而易懂。
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: 用来抬桌子
  rationale: לָשֵׂאת 表示抬、搬运；此处借杠抬运桌子，简洁译为“用来抬桌子”。
theological_decisions: []
