  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: zh_hans
  text: 他用一他连得纯金做了灯台和灯台的一切器具[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器具”也可译作“器皿”或“用具”。希伯来语 כֵּלִים 是一个含义宽泛的词，指与灯台配套的各类物件。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: 一他连得
  rationale: 在会幕建造的语境中，这个词指重量单位“他连得”，而不是其本义所涉及的圆形物体。保留古代计量单位，避免换算造成不必要的精确化。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 准确表达材料纯净、精炼的性质，也是现代汉语中自然简洁的说法。
- source_word: עָשָׂה
  choice: 做了
  rationale: 对应常用动词“制作、做”，在器物制作的语境中自然直接。
- source_word: אֹתָהּ
  choice: 灯台
  rationale: 希伯来语阴性单数代词回指上文的灯台；汉语若仅译“它”略显含混，因此明确重复所指对象。
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: 和灯台的一切器具
  rationale: כֵּלִים 是涵盖器皿、用具、配件等物件的宽泛词；“器具”在此既自然，也保留其概括性。重复“灯台”以清楚表达阴性后缀的所指。
