  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: zh_hans
  text: 他制作了圣膏油和纯净的香料制成的香[a]，都是按调香师的工艺制成的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“香料香”。希伯来语原指用芳香材料制成的香。
    reason: lexical_alternative
  - marker: b
    text: 或译“调香师的作品”或“由调香师调制”。原文强调由专业调配者制作的工艺。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又制作了
  rationale: 该叙事性动词表示接续发生并已完成的行动；“又”自然承接上文，“制作”适合膏油和香的配制语境。
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: 圣膏油
  rationale: “圣”表达קֹדֶשׁ所指分别为圣、供神圣用途；“膏油”是现代中文圣经语境中清楚而凝练的表达。
- source_word: קְטֹרֶת הַסַּמִּים
  choice: 香料之香
  rationale: 原文直指用芳香材料制成的香；此译法保留“香料”与“香”之间的构成关系，也避免仅译“香”而丢失材料信息。
- source_word: טָהוֹר
  choice: 纯净的
  rationale: 在礼仪和材料语境中表示纯正、洁净；“纯净”既可描述制品品质，也保留礼仪纯洁的意味。
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: 调香师的手艺
  rationale: 该名词短语强调专业调配者的技艺和成品；“调香师”比现代汉语中的“香水师”更宽泛，适用于膏油与香料的配制。
