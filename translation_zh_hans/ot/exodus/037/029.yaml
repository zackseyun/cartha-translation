  to: 他制作了圣膏油和纯净的香料制成的香[a]，都是按调香师的工艺制成的[b]。
  rationale: 修订以“香料制成的香”替换较生硬的“香料之香”，并将末句改为“按调香师的工艺制成”，使其既可统摄圣膏油和香，又更贴近原文所强调的专业制作。脚注锚点仍分别附于香料香和调香师工艺，且保留原文可有的词汇表达范围。
