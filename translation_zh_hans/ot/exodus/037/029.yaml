  source_fidelity: 译文准确传达了制作圣膏油、纯净香料香及调香师专业制作的基本内容。不过，“都是调香师的手艺”将原文的“调香师的制作／作品”较明显地转成抽象的“手艺”，且与前面的两个制品搭配不够严谨。
  naturalness: “香料之香”虽可理解，但在现代标准汉语中略显生硬；“纯净的香料制成的香”更自然，同时保留其由芳香材料制成的含义。
  terminology: “圣膏油”是恰当且通行的礼仪术语。“调香师”可用，避免了将其狭义现代化为香水制作人。将 מַעֲשֵׂה רֹקֵחַ 译为“按调香师的工艺制成”较好地表达专业调制的制作方式。
