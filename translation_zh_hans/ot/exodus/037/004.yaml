  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: עשה的Qal叙事形式，表示“做、制作”；现代汉语叙事中通常不必逐字译出句首连接词。
- source_word: בַּדֵּי
  choice: 杠
  rationale: בַּד在会幕器具的语境中指穿入环内、用于抬运器具的长杆；“杠”简洁，并符合中文圣经工艺语境。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 该结构指שִׁטָּה树的木材；“皂荚木”是现代中文圣经中通行且易于识别的名称。
- source_word: וַיְצַף
  choice: 并用……包裹
  rationale: צפה在制作器具的语境中表示以某种材料覆盖或包覆；“用金包裹”自然、清楚。
- source_word: אֹתָם
  choice: （隐含于“杠”及后句宾语中）
  rationale: 复数宾格代词回指“杠”；现代汉语可省略重复代词，仍不造成指代不清。
- source_word: זָהָב
  choice: 金
  rationale: 指包覆杠所用的材料；“用金”自然表达希伯来语中的材料关系。
