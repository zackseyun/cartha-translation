lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: 连续式叙事动词表示接续的动作；现代汉语可不另译连接词，使叙述自然流畅。
- source_word: הַבַּדִּים
  choice: 抬杠
  rationale: 此词指搬运圣所器具所用的杠；“抬杠”准确表达用途，也比古雅的说法更易懂。
- source_word: עֲצֵי שִׁטִּים
  choice: 金合欢木
  rationale: 该结构表示以金合欢属木材为材料；“金合欢木”是现代中文清楚而具体的表达。
- source_word: וַיְצַף אֹתָם זָהָב
  choice: 包上金
  rationale: צפה在制作器物的语境中指以金属覆盖表面；“包上金”自然、准确，并保留原文简洁的工艺描述。
- source_word: לָשֵׂאת
  choice: 用来抬
  rationale: 不定式表达目的；“用来抬”明确说明这些杠的用途。
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: שֻׁלְחָן直指前文所述的桌子；译文不添加原文没有明说的限定语。
