  yaml_path: translation/ot/exodus/037/022.yaml
  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: zh_hans
  text: 花苞[a]和枝子都与灯台本体连成一体[b]；整个灯台是用纯金锤制成的一件整体[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“球状装饰”。希伯来语所指的是圆形装饰构件；这里可能采用花卉造型，所以译作“花苞”。
    reason: lexical_alternative
  - marker: b
    text: 直译“是从它而出”，意思是这些花苞和枝子都由灯台本体锤出，并非另外接上。
    reason: lexical_alternative
  - marker: c
    text: 或译“全是锤成的一整件”或“由一整块锤制而成”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: 各枝的花苞
  rationale: כַּפְתּוֹר在灯台描述中指圆形的装饰构件，并与花卉造型相连。“花苞”既保留具体形象，也比“球”或建筑用语“柱头”更符合本段语境；复数附属关系用“各枝的”自然表达。
- source_word: וּקְנֹתָם
  choice: 和枝子
  rationale: קָנֶה本义可指芦苇、茎秆；在灯台语境中指向外伸展的灯台臂，译作“枝子”自然且能体现花木造型。
- source_word: מִמֶּנָּה הָיוּ
  choice: 都与灯台连成一体
  rationale: 直译为“是从它而出”，强调花苞和枝子并非另行接上，而是从灯台本体锤制出来。中文用“与灯台连成一体”清楚传达整体构造。
- source_word: כֻּלָּהּ
  choice: 整个灯台
  rationale: 阴性单数后缀回指灯台整体。中文明确说“整个灯台”，可避免代词所指含混，并保留全面性的强调。
- source_word: מִקְשָׁה אַחַת
  choice: 锤成的一件整体
  rationale: מִקְשָׁה指金属经锤打制成之物，אַחַת强调单一、整体。此译同时表达制作方式和一体性。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 这是会幕器具材料描述中的自然标准译法，准确表达未经杂质玷污、纯净的金。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“花苞—枝子”保留灯台的花卉意象；“连成一体”和“一件整体”分别表达 מִמֶּנָּה 与 מִקְשָׁה אַחַת 的构造含义，虽有语义呼应，但符合原文对整体锤制的强调。
