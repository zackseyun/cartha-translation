  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: zh_hans
  text: 他用金子做了两个基路伯；他用锤打的工艺，从施恩座[a]的两端做成这两个基路伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎罪盖”。希伯来语此词指约柜的盖，并与赎罪礼有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他做了
  rationale: 未逐字译出连接词וַ，以符合现代汉语叙事习惯，同时保留连续动作的语气。
- source_word: שְׁנֵי כְרֻבִים
  choice: 两个基路伯
  rationale: “基路伯”是现代中文圣经语境中对כְּרוּב的通行音译，能准确指向会幕器具上的特定形象。
- source_word: זָהָב
  choice: 用金子
  rationale: 明确表达金子是制作基路伯的材料，符合现代汉语习惯。
- source_word: מִקְשָׁה
  choice: 锤打出来
  rationale: 该词主要表示金属经捶打塑造成形；此译保留制作工艺的含义，不直接增译为“整块”。
- source_word: עָשָׂה אֹתָם
  choice: 他把它们……锤打出来
  rationale: 保留原文第二次使用“做”的动作含义，并用自然汉语突出制作方式。
- source_word: מִשְּׁנֵי קְצוֹת
  choice: 从……的两端
  rationale: 保留介词מִן所表达的来源或起点关系，表明两个基路伯是从盖的两端锤打出来的，而不只是摆放在那里。
- source_word: הַכַּפֹּרֶת
  choice: 施恩座
  rationale: “施恩座”是中文圣经传统中辨识度较高的专门用语；脚注同时提供更直观的“赎罪盖”，说明它是约柜的盖。
theological_decisions:
- issue: 会幕语境中הַכַּפֹּרֶת的译法
  choice: 施恩座
  alternative: 赎罪盖；柜盖
  rationale: “施恩座”保留中文圣经传统中的礼仪性专名，“赎罪盖”则更直接呈现该物件既是约柜的盖、又与赎罪礼相关的含义。正文采用前者，脚注保留后者，避免把词义所涉及的神学联系缩减为普通的“盖”，也不把某一神学解释强加给原文。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。分号对应原文动作的重复与展开；“锤打出来”兼顾金属加工方式及“从两端”这一来源关系。
