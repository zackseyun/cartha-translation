  yaml_path: translation/ot/exodus/037/020.yaml
  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: zh_hans
  text: 灯台上有四个杏花形的杯[a]，以及它的花蕾和花朵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“四个杏花形的杯，以及它的球饰和花朵。”
    reason: 原文末尾是并列、近似同位的结构；כפתור也可指球状或节状装饰，不一定专指花蕾。
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: 灯台上有
  rationale: 介词短语表示这些装饰构件位于并附着在灯台上；“灯台上有”符合现代汉语表达。
- source_word: אַרְבָּעָה
  choice: 四个
  rationale: 直接表达修饰“杯”的基数。
- source_word: גְבִעִים
  choice: 杯
  rationale: 指杯状的装饰构件；“杯”简洁、直观，也与本段灯台制作语境相称。
- source_word: מְשֻׁקָּדִים
  choice: 杏花形的
  rationale: 该词表示按杏花样式制作；“杏花形的”既保留形态含义，也避免误解为仅在表面绘有杏花。
- source_word: כַּפְתֹּרֶיהָ
  choice: 它的花蕾
  rationale: 原词指灯台上的球状或节状装饰；在杏花造型语境中译作“花蕾”自然，但其具体形制存在词义不确定性，故脚注保留“球饰”这一可能。
- source_word: וּ/פְרָחֶיהָ
  choice: 和花朵
  rationale: 原词意为花或花朵；与“花蕾”搭配清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的说明性语言。“连同”使原文简略的并列结构在汉语中通顺，同时不把花蕾和花朵明确限定为杯上的部件，以保留原文结构上的含混。
