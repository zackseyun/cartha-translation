  text: 他用皂荚木做杠，又用金包裹杠。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做
  rationale: עשה的Qal连续式叙事形式，表示承接上文的过去动作；汉语可不另译连接词，使叙述自然流畅。
- source_word: הַבַּדִּים
  choice: 杠
  rationale: 在会幕器具的语境中，בַּדִּים指抬运圣物所用的长杆；“杠”既简洁，也符合本段器具制作的传统语境。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 该结构表示制作材料；“皂荚木”是现代中文圣经语境中对שִׁטָּה木材的通行名称。
- source_word: וַיְצַף
  choice: 又……包裹
  rationale: צפה在工艺语境中指用某种材料覆盖器物表面；“包裹”自然表达以金覆面的动作。
- source_word: אֹתָם
  choice: 杠
  rationale: 该复数宾语代词回指前面的“杠”；汉语复述名词可消除单复数代词表达上的不自然。
- source_word: זָהָב
  choice: 用金
  rationale: 此处表示覆面的材料，现代汉语自然表达为“用金包裹”。
