  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: zh_hans
  text: 他把柜的内外都包上纯金，又在柜的四周做了一道金边。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金边”也可译作“金制边饰”或“金饰边”。希伯来语 זֵר 指环绕器物的装饰性边饰。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: 把柜……包上
  rationale: 此处是工艺语境，צפה 的强意形表示以金属覆贴物件表面；“包上”自然清楚，并以“柜”明确代词所指。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 准确表达金子的纯净性质，也符合现代汉语中圣所器物制作的常用说法。
- source_word: מִבַּיִת וּמִחוּץ
  choice: 里外都
  rationale: 简洁表达柜内外两面，保留希伯来文内外相对的空间含义。
- source_word: וַיַּעַשׂ לוֹ
  choice: 在柜……做了
  rationale: לֹו 表示所做之物归属或附着于柜；汉语用“在柜的四周做”比直译“为它做”更自然。
- source_word: זֵר זָהָב
  choice: 一道金边
  rationale: זֵר 在会幕器具语境中指环绕器物的装饰性边饰；“金边”通俗而不把它误解为王冠。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达边饰环绕器物各面的含义，符合现代汉语习惯。
