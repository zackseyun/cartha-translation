  yaml_path: translation/ot/exodus/037/021.yaml
  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: zh_hans
  text: 从灯台伸出的每两根枝子下面有一个球形饰物[a]；从灯台伸出的每两根枝子下面有一个球形饰物；从灯台伸出的每两根枝子下面有一个球形饰物：这是为从灯台伸出的六根枝子而设的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “球形饰物”或译“球状凸饰”；希伯来词 כפתר 指灯台上的圆形装饰构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפְתֹּר
  choice: 球形饰物
  rationale: 此词在灯台制作的语境中指圆球状的装饰构件。“球形饰物”既表达其可能的形状，也明确其构件性质；“花球”可能使人误解为花朵形装饰，“球结”则不够自然。
- source_word: תַּחַת
  choice: 下面
  rationale: 直接表达该装饰构件位于每对枝子的下方，符合现代汉语习惯。
- source_word: שְׁנֵי הַקָּנִים
  choice: 两根枝子
  rationale: קנה本义可指芦苇或杆状物，在灯台语境中指从主干伸出的支臂；“枝子”保留灯台的植物形象，也承接本段上下文。
- source_word: מִמֶּנָּה
  choice: 从灯台
  rationale: 阴性单数代词在语境中回指灯台。汉语若反复译作“从它”略显含混，因此首次和总结处明确为“从灯台”；中间重复句依上下文省略。
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: 正好对应……六根枝子
  rationale: לְ在此总结三个饰物与六根侧枝的对应关系。“正好对应”自然显明每个饰物位于一对枝子之下，而不将其误解为饰物归属于枝子。
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: 从灯台伸出的
  rationale: 分词描述六根枝子由灯台主体向外延伸；“伸出的”比直译“出来的”更符合器物构造的现代汉语表达。
theological_decisions: []
