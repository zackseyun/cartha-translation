  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: zh_hans
  text: 他从施恩座[a]的两端做成两个基路伯：一个在这一端，另一个在那一端。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“柜盖”或“赎罪盖”；希伯来语“卡波雷特”指约柜的金盖。
    reason: 说明礼仪专门用语的实体所指，并保留两个主要译法。
lexical_decisions:
- source_word: כְּרוּב
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，准确指称与约柜相关的特定护卫性天上活物，避免以“有翅膀的活物”等解释性说法缩窄其含义。
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: 在这一端……在那一端
  rationale: קָצֶה 指物体的端部；成对的指示语表示相对的两端。译文以自然简洁的中文呈现其空间关系。
- source_word: הַכַּפֹּרֶת
  choice: 施恩座
  rationale: 这是约柜金盖的专门用语，并具有礼仪和赎罪关联。“施恩座”保留传统、简洁的礼仪性称谓，同时以脚注列出较具实体描述或功能说明的译法。
- source_word: עָשָׂה
  choice: 做出
  rationale: 此处 עשה 是普通的“制作、做成”。“做出”既自然，也能配合介词 מִן 表达基路伯由施恩座两端制成。
- source_word: מִשְּׁנֵי קְצֹוֹתָיו
  choice: 从……的两端
  rationale: 保留介词 מִן 的来源意味，并让代词所指明确落在“施恩座”上；不额外加入“连成一体”等虽可由上下文推知、却未在本节明说的内容。
theological_decisions:
- issue: 会幕语境中 הַכַּפֹּרֶת 的译法
  choice: 施恩座
  alternative: 柜盖；赎罪盖
  rationale: 该词既指约柜实体上的金盖，也具有赎罪礼仪意义。“施恩座”保留其传统礼仪称谓，但不在正文中把词义单独限定为物件功能或赎罪解释；脚注呈现其他合理译法，以保留词义张力。
translation_notes:
  register: 采用庄重而浅白的现代标准汉语。“这一端……那一端”清楚呈现对称布局；后半句重复“施恩座”，避免中文代词指向不明。
