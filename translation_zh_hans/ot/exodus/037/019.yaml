base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: zh_hans
  text: 每一根枝子上都有三个杏花形的杯，配有球状饰件和花朵；从灯台伸出的六根枝子都是这样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבִעִים
  choice: 杯
  rationale: 指灯台上杯状的装饰构件；“杯”简明自然，也保留其形状意象。
- source_word: מְשֻׁקָּדִים
  choice: 杏花形的
  rationale: 该词源于“杏树”，在灯台制作语境中描述仿杏花造型的杯状装饰；译作“杏花形的”清楚而不失简洁。
- source_word: קָנֶה
  choice: 枝子
  rationale: 这里指从灯台主体向外伸出的臂；“枝子”符合灯台的植物造型意象，也易于现代读者理解。
- source_word: כַּפְתֹּר
  choice: 花苞
  rationale: 此词指圆鼓状的装饰构件；结合灯台的植物纹样译作“花苞”，既传达形态，也与下文“花朵”自然对应。
- source_word: פֶרַח
  choice: 花朵
  rationale: 指花形装饰；“花朵”是现代汉语中直观自然的表达。
- source_word: כֵּן
  choice: 都是这样
  rationale: 概括前述装饰样式适用于六个枝子；“都是这样”准确表达总结和类推关系。
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: 灯台伸出的
  rationale: 自然表达六个枝子从灯台主体向外延伸，同时保留原文的空间关系。
- source_word: מְנֹרָה
  choice: 灯台
  rationale: 采用通行且易懂的器物名称，不作音译。
theological_decisions: []
