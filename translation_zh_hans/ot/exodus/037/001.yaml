base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: zh_hans
  text: 比撒列用皂荚木造了约柜[a]。约柜长二肘半，宽一肘半，高一肘半。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约柜”的希伯来文也可泛指“柜”或“箱子”；这里按会幕的语境译为“约柜”。
    reason: 说明אָרוֹן的较广词义及本节语境中的特指用法。
  - marker: b
    text: “肘”是古代长度单位；其实际长度因时代、地区和所采用的标准而异。
    reason: 帮助现代读者理解所保留的古代度量单位，且不把不确定的换算数值加入经文。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造了
  rationale: עשה是普通的“做、制造”；用于器物时，“造了”自然直接，不额外加入雕琢等含义。
- source_word: בְּצַלְאֵל
  choice: 比撒列
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: הָאָרֹן
  choice: 约柜
  rationale: אָרוֹן本可泛指柜、箱，但在会幕语境中指承载圣约见证的特定圣物；“约柜”是现代中文中清楚且约定俗成的称呼。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 该结构意为“皂荚树的木材”；“皂荚木”是中文圣经传统中通行且简洁的材料名称。
- source_word: אַמָּתַיִם וָחֵצִי
  choice: 二肘半
  rationale: 保留古代长度单位“肘”，并按自然现代汉语表达数值。
- source_word: אָרְכּוֹ
  choice: 柜长
  rationale: 原文为“它的长度”；中文以“柜长”衔接明确、表达紧凑。
- source_word: וְאַמָּה וָחֵצִי
  choice: 一肘半
  rationale: 准确保留宽和高相同的古代度量数值。
- source_word: רָחְבּוֹ
  choice: 宽
  rationale: 在器物尺寸语境中，用现代汉语常用的“宽”表达横向尺寸。
- source_word: קֹמָתוֹ
  choice: 高
  rationale: 在器物尺寸语境中，“高”自然准确地表达垂直尺寸。
theological_decisions:
- issue: אָרוֹן在本节中是泛称“柜”还是特指圣约之柜
  choice: 正文译作“约柜”
  alternative: 柜／箱子
  rationale: 该词自身可指一般的柜或箱，但出埃及记会幕建造的上下文明确指特定圣物。采用“约柜”保留这一语境指称；尺寸句用“柜”作简洁回指，并以脚注说明词义范围。
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。正文保留古代单位“肘”，避免以不确定的现代数值取代原文；脚注说明其大致范围。
