base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: zh_hans
  text: 基路伯的翅膀向上展开，用翅膀遮盖施恩座[a]。他们的脸彼此相对；基路伯的脸朝向施恩座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“盖”或“赎罪盖”。
    reason: 说明 הַכַּפֹּרֶת 可较字面地指约柜的盖，也可按其赎罪礼仪关联译作“赎罪盖”。
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指约柜盖上两个有翅膀的天上活物形像；不以带有其他联想的普通名词替代。
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: 展开翅膀，向上伸展
  rationale: 既表达分词所描写的持续姿态，也明确保留 לְמַעְלָה 所指的向上方向，中文表达自然清楚。
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: 用翅膀遮掩
  rationale: סכך 在此描写翅膀从上方形成遮蔽；“遮掩”保留其空间意象，而“用”自然表达 בְּ 的工具意义。
- source_word: הַכַּפֹּרֶת
  choice: 施恩座
  rationale: 这是中文圣经传统中对此约柜盖的通行专称，也能提示其礼仪功能；由于希伯来词在物体层面亦可直译为“柜盖”，故以脚注保留该词义。
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: 他们的脸彼此相对
  rationale: 希伯来习语直译为“各自朝向他的弟兄”，在此表达两个基路伯相向而立；“彼此相对”准确且符合现代汉语。
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: 基路伯的脸朝向施恩座
  rationale: 保留原文再次提到基路伯的脸和施恩座所形成的强调与平行，不压缩成仅说“基路伯面向施恩座”。
theological_decisions:
- issue: הַכַּפֹּרֶת 在会幕语境中的译法
  choice: 施恩座
  alternative: 柜盖；遮罪盖
  rationale: “施恩座”是可辨识的礼仪专称，但包含对该物件功能的解释；原词也直接指约柜上的盖，且与赎罪礼仪相关。正文采用通行称谓，脚注注明较直译的选择，以免把词义范围悄然缩窄。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文后半句对“脸”和“施恩座”的重复，以呈现两个方向描述之间的空间关系；不用古雅的“二基路伯”或生硬的逐词句法。
