revisions:
- from: 基路伯展开翅膀，向上伸展，用翅膀遮掩施恩座[a]。他们的脸彼此相对；基路伯的脸朝向施恩座。
  to: 基路伯的翅膀向上展开，用翅膀遮盖施恩座[a]。他们的脸彼此相对；基路伯的脸朝向施恩座。
  rationale: 修订使“向上”明确修饰翅膀展开的姿态，采用更贴合原文空间意象的“遮盖”，并更新脚注中的替代术语。后半句保留原文对“脸”“基路伯”和“施恩座”的重复，以及“彼此相对”与“朝向施恩座”并列所呈现的描述。
