  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: zh_hans
  text: 他用纯金做了施恩座[a]，长二肘半，宽一肘半。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“赎罪盖”。这个希伯来词指约柜的金盖，并带有赎罪礼仪方面的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: 该叙事性连续式表示接续发生的过去动作；汉语无需机械译出句首连接词，也能自然承接上下文。
- source_word: כַּפֹּרֶת
  choice: 施恩座
  rationale: 此词指约柜的金盖，并与赎罪礼仪密切相关。“施恩座”保留了这一器物在经文中的礼仪和神学含义；另在脚注列出较具说明性的译法。
- source_word: זָהָב טָהוֹר
  choice: 用纯金
  rationale: 准确表达制作材料，符合现代汉语习惯。
- source_word: אַמָּתַיִם וָחֵצִי
  choice: 二肘半
  rationale: 忠实表达“两肘加半肘”，并采用自然简洁的汉语度量说法。
- source_word: אָרְכָּהּ
  choice: 长
  rationale: 阴性单数后缀所指为施恩座；汉语以“长”自然表达其长度，无须另译物主代词和系词。
- source_word: וְאַמָּה וָחֵצִי
  choice: 一肘半
  rationale: 准确表达“一肘加半肘”，符合现代汉语表达。
- source_word: רָחְבָּהּ
  choice: 宽
  rationale: 阴性单数后缀所指为施恩座；“宽”是现代汉语中表达器物宽度的自然用词。
theological_decisions:
- issue: 礼仪语境中כַּפֹּרֶת的译法
  choice: 施恩座
  alternative: 赎罪盖；盖
  rationale: 该词既指约柜上方的金盖，又承载与赎罪礼仪相关的含义。“施恩座”保留其传统礼仪名称及神学关联，但不把词义单纯限定为抽象的“怜悯”；脚注保留“赎罪盖”这一更直观的译法，以呈现原词的实物所指和语义张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“施恩座”为较熟悉的圣经礼仪用语；句式简洁，与本段制造圣物的叙事文体相符。脚注标记紧随其所说明的词语，避免误指度量单位。
