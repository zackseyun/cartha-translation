  language: zh_hans
  text: 他把杠穿进柜两侧的环里，用来搬运这柜。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 穿进
  rationale: בוא在此处描述把杠置入环中的动作；“穿进”自然、具体，符合杠穿过环的构造语境。
- source_word: הַבַּדִּים
  choice: 杠
  rationale: בַּדִּים指搬运圣所器具所用的长杆；“杠”简洁而符合现代汉语器物语境。
- source_word: בַּטַּבָּעֹת
  choice: 环里
  rationale: 介词ב与“环”连用，在这里表示杠进入并处于环内；“穿进……环里”准确表达这一空间关系。
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: 柜两侧的
  rationale: צְלָעוֹת可指侧面或侧板；此处用“两侧”自然清楚，又不对具体结构作过度限定。
- source_word: הָאָרֹן
  choice: 柜
  rationale: אָרוֹן本义为柜、箱；本节未出现“约”字，译作“柜”既贴近原文，也与会幕器具的语境相符。
- source_word: לָשֵׂאת
  choice: 用来抬
  rationale: 不定式在此表达目的；“用来抬”符合汉语表达，并表明这些杠的搬运用途。
theological_decisions:
- issue: 是否将הָאָרֹן明确译为“约柜”
  choice: 柜
  alternative: 约柜
  rationale: 原文仅用אָרוֹן，并未在本节加上“约”；保留“柜”避免把上下文中可推知但本节未明说的限定直接写入正文。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体；“穿进”“环里”“用来抬”便于普通读者理解具体动作。无脚注。
