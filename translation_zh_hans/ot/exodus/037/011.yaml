  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: zh_hans
  text: 他用纯金包上桌子，又在桌子四周做了一圈金边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金边”也可译作“金框”；传统译作“金冠”。
    reason: זֵר可指边饰、边框，也可按其常见字面意义译为“冠”；正文采用最符合此处器物制作语境的表达，同时保留其他译法。
lexical_decisions:
- source_word: וַיְצַף
  choice: 包裹
  rationale: צפה在会幕器具的制作语境中指用金属薄层覆盖物件；“包裹”在现代汉语中自然，并能表达以金覆盖表面的意思。
- source_word: אֹתוֹ
  choice: 桌子
  rationale: 宾语代词回指上一节的桌子。现代汉语在这里重复“桌子”比连续使用“它”更清楚自然。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 该词组指纯度高的金；“纯金”准确、简洁，也是现代汉语的惯常表达。
- source_word: וַיַּעַשׂ לוֹ
  choice: 在桌子……做了
  rationale: 保留介词ל所表达的关联，即所做的金边是为桌子而设；结合סָבִיב自然表达为“在桌子四周做了”。
- source_word: זֵר
  choice: 金边
  rationale: זֵר在此指围绕桌子的凸边或装饰性边饰。“金边”简明自然，同时以脚注保留“边框”和传统“冠”的词义可能。
- source_word: זָהָב
  choice: 金
  rationale: 直接表达制作边饰所用的材料。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达完整环绕桌子的范围；与“一圈”搭配，清楚传达环绕一周之意。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“一圈金边”符合当代汉语工艺描述；重复“桌子”以明确两个代词的所指。脚注标记置于其实际说明的“金边”之后。
