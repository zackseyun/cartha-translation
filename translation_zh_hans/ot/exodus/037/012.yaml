  yaml_path: translation/ot/exodus/037/012.yaml
  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: zh_hans
  text: 他又给桌子四周做了一掌宽的边框[a]，并在边框四周做了金饰边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “边框”或译“边缘”或“围边”。
    reason: lexical_alternative
  - marker: b
    text: 传统译作“金冠”；这里译作“金饰边”，指环绕边框的装饰性镶边。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: 边框
  rationale: 指桌子四周附设的结构性框边；“边框”在现代汉语中自然清楚，也保留“边缘、围框”的词义范围。
- source_word: טֹפַח
  choice: 一掌宽
  rationale: 该词是以手掌宽度为基础的长度单位；译作“一掌宽”既保留古代量度，也自然说明这里量的是边框宽度。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达环绕各面的意思；“四周”简洁自然，并与器物制作语境相称。
- source_word: זֵר
  choice: 饰边
  rationale: 在会幕器具的语境中，指环绕器物的凸起或装饰性镶边；“饰边”比传统的“冠”更不易使现代读者误解为王冠。
- source_word: זָהָב
  choice: 金
  rationale: 作为材料名修饰“饰边”，译为“金饰边”简洁地表达其由金制成。
- source_word: לְמִסְגַּרְתּוֹ
  choice: 在边框
  rationale: 介词与所属后缀表明金饰边同前述边框的关联；汉语用“在边框四周”自然表达饰边环绕或附着于边框。
