base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: zh_hans
  text: 他做了桌上的器具：盘子[a]、杯子、壶和用于浇奠的碗，都是纯金制成的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“碟子、小碗、罐和盆”。本节几个器皿名词较罕见，或具有特定礼仪语境，其确切形制难以确定。
    reason: 保留几个罕见或语境特定的希伯来语器皿名词所具有的词义不确定性。
lexical_decisions:
- source_word: הַכֵּלִים
  choice: 器具
  rationale: 该词泛指器皿或用具；“器具”既保留其宽泛含义，也适合桌上礼仪用品的语境。
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: 桌上的
  rationale: 直译希伯来语“在桌上的”，不进一步解释为专供桌子使用或归桌子所有。
- source_word: קְעָרֹתָיו
  choice: 桌子的盘子
  rationale: קְעָרָה通常指盘或碟；用“盘子”自然清楚，并以“桌子的”表达第三人称单数所属后缀。
- source_word: כַּפֹּתָיו
  choice: 杯子
  rationale: 本词本义与手掌、匙有关，在会幕器具清单中指小型容器；“杯子”保留容器概念，避免采用较古雅而未必确定的专名。
- source_word: מְנַקִּיֹּתָיו
  choice: 壶
  rationale: 这是罕见的器皿名，确切形制不明；“壶”可自然表达盛装或倾倒液体的器皿，又不过度限定其形状。
- source_word: הַקְּשָׂוֹת
  choice: 碗
  rationale: 该词在此指另一类与浇奠有关的容器；“碗”简明易懂，但确切器形仍在脚注中注明不确定性。
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: 用来浇奠的
  rationale: נסך在此为被动式，涉及倾倒奠祭；“用来浇奠”自然表达器具的用途，同时不强行补出希伯来文未明说的单数或复数祭物。
- source_word: זָהָב טָהוֹר
  choice: 用纯金做
  rationale: 把句末的材料说明前置，使现代汉语流畅，并明确所有列举的器具均由纯金制成。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“浇奠”是简洁且可理解的礼仪用语；全句保留希伯来文器具清单的结构，并以脚注说明器皿名词的真实不确定性。
