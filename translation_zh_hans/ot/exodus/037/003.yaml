base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/003.yaml
  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: zh_hans
  text: 他为柜铸了四个金环，安在柜的四只脚[a]上：一侧两个环，另一侧两个环。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“四角”或“四个支撑处”；希伯来语这个词可指脚，也可指器物下端或支撑点。
    reason: lexical_alternative
  - marker: b
    text: 直译“在柜的一侧有两个环，在柜的第二侧有两个环”。
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּצֹק
  choice: 铸了
  rationale: 在金属加工语境中，יצק指把熔化的金属浇铸成形；“铸”准确而自然。
- source_word: לוֹ
  choice: 为柜
  rationale: 代词所指是上下文中的约柜；汉语直说“为柜”比“为它”更清楚自然。
- source_word: טַבְּעֹת זָהָב
  choice: 金环
  rationale: 简洁对应“金制的环”，符合现代汉语器物描述。
- source_word: פַּעֲמֹתָיו
  choice: 柜的四只脚
  rationale: 该词可指脚、下端或支撑点；此处按器物下部承托结构译作“脚”，并以脚注保留其他可能。
- source_word: צַלְעוֹ
  choice: 一侧／另一侧
  rationale: צלע在器物描述中指侧面；结合האחת与השנית，用“一侧……另一侧”自然表达相对的两侧。
