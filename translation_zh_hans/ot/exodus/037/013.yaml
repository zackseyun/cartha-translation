  text: He cast four gold rings for it and put the rings on the four corners at its four feet[a].
translation:
  language: zh_hans
  text: 他为桌子铸了四个金环，把环安在桌子四只脚处的四角上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把环安在与桌子四只脚相对应的四角上。”
    reason: 原文介词 לְ 所表达的关系可按空间位置理解，也可理解为四角与四只脚的对应／关联。
lexical_decisions:
- source_word: וַיִּצֹק
  choice: 铸了
  rationale: 在制造会幕金属器件的语境中，此动词指将熔化的金属铸造成形；“铸”准确而简洁。
- source_word: לוֹ
  choice: 为桌子
  rationale: 代词回指上文的桌子。汉语明说“桌子”可避免“为它”指代不清。
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: 四个金环
  rationale: 直译其数目、器物类别和材质，也符合供杠穿过的环状配件这一语境。
- source_word: וַיִּתֵּן
  choice: 安在
  rationale: 这里表示把金环装置在桌子的特定位置；“安在”比泛泛的“放在”更切合器具制作。
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: 在……四角上
  rationale: פֵּאָה在家具描述中指边端或角；四个环对应四个位置，译作“四角”最自然。
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: 桌子四只脚所在的
  rationale: 该关系从句把四角与四只桌脚联系起来；此译保留空间关系，同时以“脚”对应原文 רֶגֶל。
