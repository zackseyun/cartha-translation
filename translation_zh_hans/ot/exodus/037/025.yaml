  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הַ/קְּטֹ֖רֶת עֲצֵ֣י שִׁטִּ֑ים אַמָּ֣ה אָרְכּ/וֹ֩ וְ/אַמָּ֨ה רָחְבּ֜/וֹ רָב֗וּעַ וְ/אַמָּתַ֨יִם֙ קֹֽמָת֔/וֹ מִמֶּ֖/נּוּ הָי֥וּ קַרְנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: zh_hans
  text: 他用金合欢木做了熏香坛[a]。坛长一肘，宽一肘，呈正方形，高二肘；坛角与坛本体是一体做成的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“香坛”。
    reason: 原文מִזְבַּח הַקְּטֹרֶת可表达为“熏香坛”，也可较简洁地译作“香坛”。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: 该叙事动词表示承接上文的过去行动；现代汉语可不直译句首的连接词，以保持自然流畅。
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 熏香坛
  rationale: 该词组指焚烧香料的坛；“熏香坛”简明自然，也与一般祭坛有所区别。
- source_word: עֲצֵי שִׁטִּים
  choice: 金合欢木
  rationale: 采用现代汉语中对该木材的通行名称，避免音译造成理解困难。
- source_word: אַמָּה / אַמָּתַיִם
  choice: 一肘 / 二肘
  rationale: 保留古代长度单位，不换算为现代单位，以免引入并非原文明确给出的精确数值。
- source_word: רָבוּעַ
  choice: 呈正方形
  rationale: 该形容词说明坛面的形状；这样表达符合现代汉语的尺寸描述习惯。
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: 坛的角与坛连成一体
  rationale: 原文直译为“它的角是从它而出的”，在制作语境中表示坛角不是另行安装，而是与坛本体一体制成。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。尺寸按原文顺序清楚陈述；“角”保留古代祭坛构造的专门含义，不作神学性扩释。
