base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: zh_hans
  text: 他在第一组相连的幔子中、位于末端的那幅幔子的边缘上，做了蓝色线制成的环；照样，他也在第二组相连的幔子中最外边那幅幔子的边缘上做了环。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֻלְאֹת
  choice: 钮环
  rationale: 指缝在幔子边缘、供连接之用的织物环。“钮环”能简洁表达其形状和扣接功能。
- source_word: תְּכֵלֶת
  choice: 蓝色线
  rationale: 在会幕制作语境中，指蓝色染制的纺织材料，而非抽象的颜色；“蓝色线”适合描述制作钮环的材料。
- source_word: שְׂפַת
  choice: 边缘
  rationale: 此处指幔子的边或沿，“边缘”是自然、准确的现代汉语表达。
- source_word: הַיְרִיעָה
  choice: 幔子
  rationale: 在会幕语境中，指构成覆盖物的单幅织物；“幔子”沿用庄重且易懂的圣幕建筑用语。
- source_word: הָאֶחָת
  choice: 那幅
  rationale: 字面为“那一幅”；其所在位置由“末端”界定。译作“末端那幅”比硬译为“第一幅”更贴近希伯来语，同时与后半句的第二组形成对应。
- source_word: מִקָּצָה
  choice: 末端
  rationale: 表示位于幔子组合的尽头；在汉语中与“那幅幔子”组合，可清楚说明钮环所在位置。
- source_word: בַּמַּחְבָּרֶת
  choice: 相连的幔子
  rationale: מַחְבֶּרֶת可指连接后的组合，也可指连接处或连接安排。正文按上下文译为一组相连的幔子，并以脚注保留另一种理解。
- source_word: כֵּן עָשָׂה
  choice: 照样，他也……做了
  rationale: 保留两组幔子制作方式相对应的平行结构，同时符合现代汉语表达。
- source_word: הַקִּיצוֹנָה
  choice: 最外边那幅
  rationale: 该词指位于组合最外端的幔子；“最外边那幅”清楚传达空间位置。
- source_word: הַשֵּׁנִית
  choice: 第二组
  rationale: 明确指第二个连接起来的幔子组合，与前半句由语境得出的第一组相对。
