  to: 他在第一组相连的幔子中、位于末端的那幅幔子的边缘上，做了蓝色线制成的环；照样，他也在第二组相连的幔子中最外边那幅幔子的边缘上做了环。
  rationale: 修改首句的定语层次，使“位于末端的那幅幔子”明确属于第一组相连幔子；将“钮环”改为“蓝色线制成的环”，更直接对应原文的织物环。为使脚注锚点与修订正文一致，脚注标记置于“相连的幔子”之后。
