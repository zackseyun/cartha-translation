  yaml_path: translation/ot/exodus/036/023.yaml
  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: zh_hans
  text: 他为帐幕做了竖板[a]：南面，就是朝南的一边[b]，共二十块竖板。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竖板”或译“框架”。
    reason: 说明希伯来文构件名称的可行词义选择。
  - marker: b
    text: 希伯来文连续使用两个表示南方的词，直译近似“南面，向南”；这种重复可作方位说明或强调。
    reason: 说明并保留原文双重南方表达的形式及其语义弹性。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: עשה的Qal叙事过去式承接上下文；按现代汉语叙事习惯省去句首连接词，单数主语由上下文确定。
- source_word: הַקְּרָשִׁים
  choice: 竖板
  rationale: קֶרֶשׁ在帐幕建造语境中指直立的结构构件。“竖板”具体、自然，也保留其板材性质；“框架”是可能的功能性译法。
- source_word: לַמִּשְׁכָּן
  choice: 为帐幕
  rationale: מִשְׁכָּן在《出埃及记》中是圣所结构的常用名称；“帐幕”是现代中文圣经语境中清楚而通行的译法。
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: 共二十块竖板
  rationale: 直译数量并重复“竖板”，保留原文清单式表达；“共”使中文数量说明更自然。
- source_word: לִפְאַת
  choice: 面
  rationale: פֵּאָה在此表示建筑的一侧；与“南”组合成“南面”，符合现代汉语建筑方位表达。
- source_word: נֶגֶב תֵּימָנָה
  choice: 南面，就是朝南的一边
  rationale: 原文连续使用两个南方表达。此译法既保留重复和方向强调，又避免汉语中生硬的“南面向南”。
