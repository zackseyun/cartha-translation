  language: zh_hans
  text: 他为帐幕做了一个用染红的公羊皮制成的覆盖物，又做了一个特哈示皮的覆盖物，放在上面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “特哈示皮”所指的皮革种类不能确定；也有译作“海牛皮”、“海豚皮”、“儒艮皮”或传统所称的“獾皮”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又……做了
  rationale: 该叙事性动词表示接续发生的过去动作；“又……做了”自然体现上下文中的动作推进。
- source_word: מִכְסֶה לָאֹהֶל
  choice: 为帐幕做了一个罩子
  rationale: מִכְסֶה指覆盖物或罩子，אֹהֶל本义为“帐幕”；此译法既贴近原文，也符合现代汉语表达。
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: 用染红的公羊皮制成
  rationale: 准确保留“公羊皮”及其经过染红处理的含义，并用自然汉语说明材料。
- source_word: וּמִכְסֵה
  choice: 又做了一个……罩子
  rationale: 原文重复“罩子”，连接词表明另加一层；中文补出受前一动词支配的“做了”，使句意完整，但不将其擅自改为“第二个”。
- source_word: עֹרֹת תְּחָשִׁים
  choice: 特哈示皮[a]
  rationale: תְּחָשִׁים所指动物或皮革种类无法确定。采用音译可避免把某一种有争议的动物认定为原文唯一所指，并由脚注交代主要译法。
- source_word: מִלְמָעְלָה
  choice: 在上面
  rationale: 表示这层罩子位于其他覆盖层之上；“在上面”简洁保留其空间关系。
