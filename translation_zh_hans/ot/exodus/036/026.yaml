  text: 又有四十个银座：每块板下有两个座，每块板下有两个座。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: 以及四十个
  rationale: 连词承接前文的建造清单；“以及”在本节片段中自然体现连续关系，数词“四十”直接译出。
- source_word: אַדְנֵי/הֶם כָּסֶף
  choice: 四十个银座
  rationale: אֲדָנִים 指支撑会幕框架的底座；“座”简洁并符合上下文。“银”作定语说明材质。
- source_word: שְׁנֵי אֲדָנִים
  choice: 两个座
  rationale: 与前面的“银座”保持术语一致；原文在两小句中重复此语。
- source_word: תַּחַת
  choice: 下面
  rationale: 表示底座位于每个框架之下；“下面”是自然、清楚的现代汉语。
- source_word: הַ/קֶּרֶשׁ
  choice: 框架
  rationale: קֶרֶשׁ 在会幕语境中指直立的结构构件；“框架”比“板”更能表达其结构功能，同时不过度解释。
- source_word: הָ/אֶחָד
  choice: 这一个
  rationale: 原文两次都是带定冠词的“一个”，并未在第二处明确写“另一个”；译文保留这种刻意重复。
