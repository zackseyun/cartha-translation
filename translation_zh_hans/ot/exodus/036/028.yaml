  text: And he made two boards for the corners of the tabernacle at the rear[a].
translation:
  language: zh_hans
  text: 他又为帐幕后部的两个拐角做了两块木板。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他又为帐幕后部两侧的转角构件做了两块木板。”希伯来语的用词描述帐幕后端的两个角，也可侧重这些角的位置，或侧重在该处特别连接的转角木板。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: 又……两块
  rationale: 连词承接前文的制作项目；汉语用“又”自然体现连续叙述，并明确保留数目“二”。
- source_word: קְרָשִׁים
  choice: 木板
  rationale: 该词在帐幕建造语境中指构成框架的木质板材；“木板”通顺明确，也与本段实物语境相符。
- source_word: עָשָׂה
  choice: 做了
  rationale: 忠实表达常用动词“制作、做”；现代汉语中简洁自然。
- source_word: לִ/מְקֻצְעֹת
  choice: 为……拐角
  rationale: 该词可指拐角的位置，也可能含特制转角构件之意；正文采用易懂的位置表达，另以脚注保留构件解释的可能。
- source_word: הַ/מִּשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中 מִשְׁכָּן 的传统且准确的汉语对应，既指上帝居住的圣所结构，也符合上下文。
- source_word: בַּ/יַּרְכָתָיִם
  choice: 后面的两个
  rationale: 该双数形式指结构后部的两侧或两个末端；与“拐角”合译为“后面的两个拐角”，既保留双数，也避免汉语重复。
