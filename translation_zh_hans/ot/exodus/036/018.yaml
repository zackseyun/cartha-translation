  yaml_path: translation/ot/exodus/036/018.yaml
  text: He made fifty bronze clasps to join the tent[a], so that it would be one.
translation:
  language: zh_hans
  text: 他又做了五十个铜扣，用来把帐幕[a]连接成一个整体。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帐棚”；这里指会幕的帐幕结构。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又做了
  rationale: 叙事性连续式推进前文制作过程；“又”自然体现承接关系，中文无需机械译出“和”。
- source_word: קַרְסֵי
  choice: 扣
  rationale: 指连接帐幕罩棚各部分的扣件；“扣”简洁、现代，也比“钩”更贴合其连接功能。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת可指铜或铜合金；现代中文圣经语境通常以“铜”作为不过度限定合金成分的统称。
- source_word: חֲמִשִּׁים
  choice: 五十个
  rationale: 准确表达基数，并按中文习惯为扣件加入量词“个”。
- source_word: לְחַבֵּר
  choice: 用来……连接
  rationale: 不定式表达制作这些扣件的目的；此译法自然清楚。
- source_word: אֶת הָאֹהֶל
  choice: 帐幕
  rationale: אֹהֶל字面为“帐棚”，此处在会幕建造语境中指由罩棚连接而成的帐幕结构；“帐幕”既保留帐棚意象，也明确所指。
- source_word: לִהְיוֹת אֶחָד
  choice: 成一个整体
  rationale: 表达连接后的结果，即各部分成为单一整体；比逐字译作“成为一个”更符合现代汉语，同时保留结构合一之意。
