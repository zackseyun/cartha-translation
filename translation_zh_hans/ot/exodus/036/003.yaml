source:
  edition: WLC
  text: וַ/יִּקְח֞וּ מִ/לִּ/פְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כָּל הַ/תְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִ/מְלֶ֛אכֶת עֲבֹדַ֥ת הַ/קֹּ֖דֶשׁ לַ/עֲשֹׂ֣ת אֹתָ֑/הּ וְ֠/הֵם הֵבִ֨יאוּ אֵלָ֥י/ו ע֛וֹד נְדָבָ֖ה בַּ/בֹּ֥קֶר בַּ/בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: zh_hans
  text: 他们从摩西面前[a]取走了以色列人[b]带来的一切奉献之物，用于圣所事奉的工程，好完成这项工程。他们却仍不断在每天早晨[c]把自愿献上的礼物带到摩西那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从摩西那里”或“从摩西所在之处”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“以色列的众子”；这是对以色列民众的集体称呼。
    reason: lexical_alternative
  - marker: c
    text: 直译：“早晨接早晨”，即一个早晨又一个早晨。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 取走了
  rationale: לקח的基本义是“拿、取”；这里指工匠从摩西保管之处取走建造所需的材料。“取走”既保留动作含义，也符合上下文。
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: 从摩西面前
  rationale: 近似直译为“从摩西面前／从摩西所在之处”，表明这些奉献之物原在摩西面前或由他经管；正文保留希伯来语的空间意象。
- source_word: הַתְּרוּמָה
  choice: 奉献之物
  rationale: תְּרוּמָה指分别出来献作神圣用途的供物或捐献；本节具体指会幕工程所用的各种材料，因此“奉献之物”比单纯“祭物”更合适。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在这里是指以色列全体民众的惯用集体称呼；现代汉语用“以色列人”自然且不误限于男性。
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: 用于圣所事奉的工程
  rationale: 原文叠用“工程／工作”“事奉”和“圣所”相关名词。“圣所事奉的工程”保留工程与事奉两层含义，也与会幕建造的语境相符。
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: 好完成这项工程
  rationale: עשה可指“做、制作、完成”；阴性代词最自然地回指前述工程或工作。汉语以“完成这项工程”明确衔接，但不另行指定具体对象。
- source_word: וְהֵם הֵבִיאוּ
  choice: 他们却仍不断……带来
  rationale: 独立人称代词הֵם带有强调作用，叙事语境又显示百姓在工匠领走材料的同时继续送来奉献。“却仍不断”表达这种持续和轻微对照，不把连接词本身机械处理成强转折。
- source_word: נְדָבָה
  choice: 自愿献上的礼物
  rationale: נְדָבָה强调出于自愿的奉献。这里所指是不断送来的各类材料，译作“自愿献上的礼物”自然并保留自愿性质。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 每天早晨
  rationale: “早晨”一词重复，表达逐日反复发生；“每天早晨”是自然的现代汉语，脚注另存原文的重复形式。
theological_decisions: []
