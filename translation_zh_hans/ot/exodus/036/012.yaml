base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: zh_hans
  text: 他在一幅幔子上做了五十个环；又在第二组相连幔子中那一幅幔子的边缘做了五十个环。这些环一一相对。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֻלָאֹת
  choice: 环
  rationale: 指缝制在幔子边缘、供连接之用的织物环；“环”简明准确，也不会与另行使用的金钩混淆。
- source_word: יְרִיעָה
  choice: 幔子
  rationale: 在会幕制作的语境中，指构成帐幕覆盖层的大幅织物；“幔子”符合圣所语境，又为现代读者所熟悉。
- source_word: בִּקְצֵה
  choice: 在……的边缘
  rationale: קָצֶה可指边缘或末端；这里描述连接环所在的位置，译作“边缘”最清楚。
- source_word: מַחְבֶּרֶת
  choice: 一组相连幔子
  rationale: 该词指若干幔子连接后形成的组合体；此译既表达连接关系，也自然呈现其成组结构。
- source_word: הַשֵּׁנִית
  choice: 第二组
  rationale: 保留希伯来文序数“第二”的明确含义，不泛化为“另一组”。
- source_word: מַקְבִּילֹת
  choice: 相对
  rationale: 该分词表示两边的环彼此对应、对齐；“相对”保留空间关系，并符合连接幔子的实际情境。
- source_word: אַחַת אֶל אֶחָת
  choice: 一一
  rationale: 直译为“一个对一个”，强调两边的环逐一对应；“一一相对”在中文中自然准确。
- source_word: עָשָׂה
  choice: 做了
  rationale: 常用动词在本节指制作连接环；“做了”朴实自然，并保留原文重复的施工叙述。
theological_decisions: []
