base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/032.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: zh_hans
  text: 又为帐幕第二面的板[a]做五根横闩[b]；为帐幕西面后部的板[c]也做五根横闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “板”或译“框架”。
    reason: 原词所指的木质结构单元可能理解为木板，也可能理解为框架。
  - marker: b
    text: “横闩”或译“闩木”。
    reason: 原词指穿连木板的横向构件，两种译法分别侧重其方向和材质。
  - marker: c
    text: “西面后部”或译“后部，向西”。
    reason: 原文以表示后部或尽头的词配合表示向西的方向词，中文可有不同组合方式。
lexical_decisions:
- source_word: בְרִיחִם
  choice: 横闩
  rationale: 指横向穿连帐幕木板、使结构稳固的构件。“横闩”既表达其横向用途，也比泛称“杠”更明确。
- source_word: קַרְשֵׁי
  choice: 板
  rationale: קֶרֶשׁ 指帐幕的木质结构单元；“板”简洁自然，并保留其究竟是实心板还是框架式构件的讨论空间。
- source_word: צֶלַע
  choice: 面
  rationale: 此处指帐幕的一侧；与“第二”搭配时，“第二面”符合现代汉语的建筑描述。
- source_word: הַשֵּׁנִית
  choice: 第二
  rationale: 按字面保留次序关系，不改译为较口语、但解释性更强的“另一”。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 在《出埃及记》的语境中，这是该圣所结构的固定称谓，现代中文读者也较熟悉。
- source_word: לַיַּרְכָתַיִם
  choice: 后端
  rationale: 该词指最里面、尽头或后部；在帐幕建筑语境中，“后端”自然表达其空间位置，同时不削弱其位于末端的含义。
- source_word: יָמָּה
  choice: 朝西
  rationale: 方向副词，字面与“海”有关，在这里明确表示向西；“朝西”适合描述帐幕的方位。
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: 又……五根……五根
  rationale: 保留希伯来文清单式的并列结构；第二分句在中文中无需机械重复“又”，仍清楚表达两组各五根。
