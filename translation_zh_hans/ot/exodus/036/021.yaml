lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת אֹרֶךְ
  choice: 长十肘
  rationale: 希伯来语以“十肘”配合“长度”说明尺寸；汉语用“长十肘”自然简洁，并保留古代计量单位“肘”。
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ הָאֶחָד
  choice: 每块框板
  rationale: קֶרֶשׁ 指会幕的直立结构构件，具体形制并不完全确定；“框板”兼顾其结构作用和板状性质。末尾“这一块框板”在尺寸说明中具有逐一分配的意义，因此译作“每块”。
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: 一肘半
  rationale: 原文直译近于“一肘和半肘”；现代汉语用“一肘半”准确而自然。
- source_word: רֹחַב
  choice: 宽
  rationale: 该词表示宽度；在汉语尺寸表达中用“宽”比名词性“宽度”更顺畅。
