  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל בְּצַלְאֵ֘ל וְ/אֶל אָֽהֳלִיאָב֒ וְ/אֶל֙ כָּל אִ֣ישׁ חֲכַם לֵ֔ב אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה חָכְמָ֖ה בְּ/לִבּ֑/וֹ כֹּ֚ל אֲשֶׁ֣ר נְשָׂא֣/וֹ לִבּ֔/וֹ לְ/קָרְבָ֥ה אֶל הַ/מְּלָאכָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: zh_hans
  text: 摩西召来比撒列、亚何利亚伯，以及所有心里有智慧、就是耶和华把智慧赐在他们心里的人[a]，也召来所有内心受到激励、愿意前来做这项工作的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心里有智慧”是希伯来语表达，指耶和华在人的心里赐下智慧；在这里包括完成这项工作所需的才智和技能。
    reason: lexical_alternative
  - marker: b
    text: “内心受到激励、愿意”直译可作“他的心抬起他”；这个习语指人内心受到推动而自愿前来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מֹשֶׁה אֶל
  choice: 摩西召来
  rationale: קרא אל 在这里表示召唤人前来承担工作。“召来”在现代汉语中自然，并保留了召集前来的方向感。
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: 比撒列、亚何利亚伯
  rationale: 按现代中文圣经人名的通行音译处理两个专名。
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: 所有心里有智慧的人
  rationale: 保留希伯来语“心里有智慧”的意象；在本段语境中，这种智慧也包括制作会幕所需的技能，不仅是抽象知识。
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: 就是耶和华把智慧放在他们心里的人
  rationale: 保留 נתן“放置、赐予”以及“在心里”的表达，明确智慧来自神；中文以复数代词承接集合性的“所有……的人”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的神名译法，作为四字神名的音译传统形式，而非改为称号“主”。
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: 凡心里受感动、愿意……的人
  rationale: נשא לב 是表达内在推动或自愿意愿的习语；“心里受感动、愿意”既保留内心推动，也自然传达主动参与之意。
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: 前来做这项工作
  rationale: קרב 表示靠近、前来；与“工作”连用时，中文“前来做”自然表达靠近并投入该任务，避免生硬的“靠近工作”。
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: 做这项工作
  rationale: עשה 与 מלאכה 搭配表示执行、完成工作；中文合并重复成分，使句子流畅而不损失语义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名。正文采用中文读者广泛熟悉的“耶和华”，保留其专名性质；“雅威”是更接近学界常见拟音的另一译法，故列入脚注。
- issue: 智慧与人的自愿行动之间的关系
  choice: 同时保留耶和华赐智慧与人心受感而自愿前来的表述
  alternative: 将两者合并解释为神直接驱使他们前来
  rationale: 原文分别陈述神赐智慧和人的心推动其前来，不明确规定二者之间更具体的因果方式，因此不作额外神学解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“心里有智慧”的希伯来语意象，并用脚注解释其技能含义；后半句调整为符合汉语习惯的复述结构，以清楚显示“凡……的人”也是摩西召来的对象。所有脚注标记均置于相关正文之后。
