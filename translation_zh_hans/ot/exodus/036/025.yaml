  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: zh_hans
  text: 他为帐幕的第二面，就是北面，做了二十块竖板。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“二十个框架”。希伯来语这个词可指结构用的板件或框架；这些帐幕构件的确切形制仍有争议。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: 为……面
  rationale: צֶלַע在帐幕建造语境中指结构的一面，而非人体的“肋骨”；连词与介词合译为“为……面”，符合现代汉语叙事。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן在此指旷野中的圣所；“帐幕”是准确且通行的中文译法。
- source_word: הַשֵּׁנִית
  choice: 第二面
  rationale: 原文形容词表示按建造次序所说的另一对应面；译作“第二面”比“另一面”更精确。
- source_word: לִפְאַת צָפוֹן
  choice: 就是北面
  rationale: פֵאָה与צָפוֹן共同标明方位；“就是北面”自然说明第二面所在的方向。
- source_word: עָשָׂה
  choice: 做了
  rationale: עשה是含义宽泛的“做、制造”；在建造报告中译作“做了”既贴近原文又自然。
- source_word: עֶשְׂרִים
  choice: 二十
  rationale: 忠实表达原文基数。
- source_word: קְרָשִׁים
  choice: 竖板
  rationale: 该词指帐幕的木质结构构件。“竖板”既沿用常见理解，也比单说“板”更清楚地体现其结构用途；其确切形制仍有争议，脚注保留“框架”这一可能。
