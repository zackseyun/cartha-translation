  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: zh_hans
  text: 它们在下端彼此相配[a]，在顶端也一同完全相合，直到同一个环子处[b]。他为二者、为两个拐角，都是这样做的[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“彼此对应”或“成双”。原文强调两个构件在结构上相互配合、相对应。
    reason: lexical_alternative
  - marker: b
    text: “完全相合”也可译作“完整”或“一同成为完整一体”。原文描述它们从下端到顶端、在那一个环子处的配合状态。
    reason: lexical_alternative
  - marker: c
    text: 直译：“他为二者这样做，为两个拐角。”这里的“二者”可能指两个拐角处相对应的构件；原文的具体所指未明说。
    reason: referent_ambiguity
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: 彼此配成一对
  rationale: 该词表示两个构件成对、彼此对应；这样既保留结构上的配合，也比“孪生”更符合现代汉语的建筑语境。
- source_word: מִלְּמַטָּה
  choice: 在下端
  rationale: 交代成对配合所在或开始的位置；“下端”比直译“从下面”更符合板架结构的描述。
- source_word: יַחְדָּו
  choice: 一同
  rationale: 直接保留原文“共同、一起”的副词意义及其强调作用。
- source_word: תַמִּים
  choice: 完整地连
  rationale: 原词基本义为“完整、完全”；结合构造语境补出“连”，使汉语可懂，同时用脚注保留“成为完整一体”的可能表达。
- source_word: אֶל רֹאשׁוֹ
  choice: 连到顶端
  rationale: 保留 אֶל 所表达的趋向和范围终点，并以“顶端”对应构件的上部。
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: 同一个环子
  rationale: 原文直指“那一个环”；“同一个”自然表达两部分在一个环处汇合，又不把数词解释成次序上的“第一个”。
- source_word: כֵּן עָשָׂה
  choice: 照样做
  rationale: 概括前述制作方式，符合叙事中的完成体语气，也保持简洁庄重。
- source_word: לִשְׁנֵיהֶם ... לִשְׁנֵי הַמִּקְצֹעֹת
  choice: 两个拐角都
  rationale: 将两个相邻短语合并为自然汉语；结合上下文，把“二者”理解为两个拐角，但以脚注说明较直译的表达。
