  text: וַ/יְצַ֣ו מֹשֶׁ֗ה וַ/יַּעֲבִ֨ירוּ ק֥וֹל בַּֽ/מַּחֲנֶה֮ לֵ/אמֹר֒ אִ֣ישׁ וְ/אִשָּׁ֗ה אַל יַעֲשׂוּ ע֛וֹד מְלָאכָ֖ה לִ/תְרוּמַ֣ת הַ/קֹּ֑דֶשׁ וַ/יִּכָּלֵ֥א הָ/עָ֖ם מֵ/הָבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: zh_hans
  text: 摩西下令，叫人在全营传令[a]，说：“无论男女，都不可再为圣所的奉献礼物[b]做工。”于是百姓就被制止，不再送来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “传令”所译的希伯来语惯用语直译为“使声音传过”。
    reason: lexical_alternative
  - marker: b
    text: “圣所的奉献礼物”也可译作“神圣的奉献礼物”或“献给圣所的礼物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 下令
  rationale: צוה在叙事形式中表示权威性的命令；“下令”简洁自然，并保留摩西命令的力度。
- source_word: וַיַּעֲבִירוּ קוֹל בַּמַּחֲנֶה
  choice: 叫人在全营传令
  rationale: 希伯来语惯用语直译为“使声音传过”，实际指让公开消息传遍营地；此译既体现使动意味，也符合现代汉语表达。
- source_word: אִישׁ וְאִשָּׁה אַל
  choice: 无论男女，都不可
  rationale: 明确保留原文对男人和女人的并列包括，同时用自然汉语表达全面禁止。
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: 不可再……做工
  rationale: מלאכה可指工作或制作；在本段语境中，是指为会幕奉献物继续制作或预备物件。“做工”保留其宽泛含义。
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: 为圣所的奉献礼物
  rationale: תרומה指分别献上的礼物或捐献，הקדש在本语境中可指圣所；此译表明这些工作是为圣所所收的奉献物而作，同时不把它限定为金钱。
- source_word: וַיִּכָּלֵא הָעָם מֵהָבִיא
  choice: 百姓就被制止，不再送来了
  rationale: כלא的尼法勒式含有“被阻止、受制止”的被动意味；译文保留被动语气，并以“不再送来”表达מן加不定式所表示的停止继续带来奉献物。
theological_decisions:
- issue: הַקֹּדֶשׁ在本节是指“圣所”还是形容奉献物为“圣”
  choice: 正文译为“圣所的奉献礼物”
  alternative: “神圣的奉献礼物”或“献给圣所的礼物”
  rationale: 上下文讨论建造会幕所需的材料，故“圣所”最贴合语境；脚注保留将该词理解为“神圣”的语法可能性，避免把原文张力完全抹平。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“下令”“传令”保持叙事的权威感；“无论男女”避免生硬直译；末句保留原文被动意味。
