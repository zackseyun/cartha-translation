  text: 他又为帐幕的后部，就是西面，做了六个框架[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“板”或“木板”。希伯来语所指的是帐幕的直立结构构件，其确切形制不能完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: 在……的后面
  rationale: 该词组引出帐幕最里面、最后端的部分；结合建筑语境，译作“在……的后面”既准确又自然，不机械保留希伯来语复数形式。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中指圣所结构的固定用语；“帐幕”是现代中文圣经语境中清楚且通行的译法。
- source_word: יָמָּה
  choice: 就是西面
  rationale: 字面含义为“向海”，在希伯来地理方位表达中指西方；此处是说明帐幕后面的方位，译作“就是西面”衔接自然。
- source_word: עָשָׂה
  choice: 他做了
  rationale: 直接对应常用动词“做、制造”，并保留建造叙事中简洁重复的行文风格。
- source_word: שִׁשָּׁה
  choice: 六块
  rationale: 准确表达基数“六”；量词“块”与框板类建筑构件搭配自然。
- source_word: קְרָשִׁים
  choice: 框板
  rationale: 该词指帐幕直立的结构构件，其具体形制可能是厚板，也可能具有框架性质。“框板”兼顾传统所译“板”和结构性含义，避免过度确定其形制。
