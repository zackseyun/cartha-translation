  yaml_path: translation/ot/exodus/036/020.yaml
  text: And he made the boards for the tabernacle of acacia wood[a], standing upright.
translation:
  language: zh_hans
  text: 他又用皂荚木做帐幕的竖板。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他又为帐幕做木板，是用皂荚木做的，直立安放。”
    reason: 原文“直立”可直接修饰木板；正文将其语义整合进“竖板”，脚注保留原文较显明的分列结构。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又……做
  rationale: 未完成式连续体推进叙事；“又”自然承接上文，“做”准确表达 עשה，主语按上下文译为“他”。
- source_word: הַקְּרָשִׁים
  choice: 竖板
  rationale: קֶרֶשׁ 在帐幕语境中指构成墙体的木板；结合 עֹמְדִים，以“竖板”简洁表达其结构用途和直立方向。
- source_word: לַמִּשְׁכָּן
  choice: 帐幕的
  rationale: לְ 表示这些板是为帐幕制作的；汉语用领属结构“帐幕的竖板”自然明确。“帐幕”也是《出埃及记》中 מִשְׁכָּן 的通行称呼。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 采用现代中文圣经语境中对 שִׁטָּה 木材的通行译名；不使用音译，以便普通读者理解。
- source_word: עֹמְדִים
  choice: 竖板
  rationale: 该阳性复数分词描述木板直立的状态。中文将这一语义整合进“竖板”，比逐字译作“站立着”更符合建筑用语；脚注保留按句法分译的可能。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“竖板”避免生硬地把木板拟人化为“站立”，同时保留其垂直安装的建筑含义。
