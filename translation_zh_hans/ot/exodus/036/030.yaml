  yaml_path: translation/ot/exodus/036/030.yaml
  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: zh_hans
  text: 共有八块竖板[a]，配有十六个银座[b]；每块竖板下面各有两个座。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竖板”也可译作“框架构件”；希伯来词指会幕直立的结构构件。
    reason: lexical_alternative
  - marker: b
    text: “座”也可译作“底座”或“卯座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: 共有
  rationale: 在这一建造清单的语境中，用现代汉语的存在、总数表达自然传达 היה；句首连接词不机械译出。
- source_word: קְרָשִׁים / הַקֶּרֶשׁ
  choice: 竖板
  rationale: 该词指会幕直立的木质结构构件。“竖板”既保留具体形态，也说明其安装方向，较单说“板”清楚。
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: 座
  rationale: 该词在会幕建造中指承托并固定竖板的金属底座或卯座；“座”简洁自然，具体形制则保留在脚注中。
- source_word: כֶּסֶף
  choice: 银
  rationale: 直接表达底座所用的材料。
- source_word: שִׁשָּׁה עָשָׂר
  choice: 十六个
  rationale: 按普通话量词习惯表达基数。
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: 每块竖板下面各有两个座
  rationale: 希伯来文以重复“两座、两座”和单数“那一块板”表达逐一分配。汉语用“每块……各有两个”清楚保留其分配意义，也避免误解为只谈一块或两块竖板。
