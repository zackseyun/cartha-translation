  text: 于是，所有从事圣所各项工作的巧匠，都各自离开自己正在做的工作前来[a]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“各人各自从他们正在做的工作而来”；这是分配式说法，意思是每个人都离开自己正在做的工作前来。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 前来
  rationale: 该动词为בוא的叙事性连续式，表示他们接续前来；“前来”自然承接上下文，并保留向相关地点或人物移动的意思。
- source_word: כָּל הַחֲכָמִים
  choice: 所有……巧匠
  rationale: חכמים在会幕建造语境中指具备工艺才干的人，并非泛指有智慧的人；“巧匠”简洁体现技能与职业语境。
- source_word: הָעֹשִׂים
  choice: 正在做
  rationale: 分词表达持续进行中的活动；“正在做”保留其进行体意味。
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: 圣所各项工作
  rationale: מלאכה指工程、作业或工艺劳动，הקֹדשׁ在此会幕语境中指圣所；“各项工作”自然表达כָּל的整体范围。
- source_word: אִישׁ אִישׁ
  choice: 都各自
  rationale: 名词重复构成分配式表达，意为每一个人；“都各自”在现代汉语中清楚保留逐一分配的语义。
- source_word: מִמְּלַאכְתּוֹ
  choice: 放下手头……的工作
  rationale: 介词מִן表示离开各自所从事的工作。直译“从他的工作而来”在汉语中生硬；此表达自然呈现他们暂离手中任务前来的场景，但“放下”仅表达离开当时工作的语用含义。
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: 所做的
  rationale: 原文虽用复数代词和分词，却受前面的分配式“各人”支配，意为每个人当时各自所做的工作；汉语以“各自……所做的”兼顾复数形式与逐一含义。
