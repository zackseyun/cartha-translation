base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: zh_hans
  text: 他又为帐幕的入口做了一幅门帘[a]，用蓝色、紫色和朱红色线，以及捻成的细麻制成，是绣工所做的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“帘幕”。希伯来语这个词指入口处悬挂的帘子，与里面的“幔子”（פָּרֹכֶת）不同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又……做了
  rationale: 叙事性未完成式承接上文并推进叙事；“又”在现代汉语中自然体现连续动作。阳性单数主语按上下文译为“他”。
- source_word: מָסָךְ
  choice: 门帘
  rationale: 该词指入口处悬挂的帘幕，与帐幕内部的幔子（פָּרֹכֶת）不同；“门帘”既符合入口语境，也能保留二者的区别。
- source_word: לְפֶתַח הָאֹהֶל
  choice: 为帐幕的入口
  rationale: פֶּתַח是入口或开口，אֹהֶל是帐幕；译文保留普通名词的具体意象，并用“为”表达用途。
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: 蓝色、紫色和朱红色线
  rationale: 这些词在本段指染色的纺织材料；统一补出“线”，使中文清楚自然。“朱红色”对应תוֹלַעַת שָׁנִי的鲜红染色材料。
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: 以及捻成的细麻
  rationale: שֵׁשׁ指优质细麻，מָשְׁזָר说明经过搓捻；此译同时保留材料和制作方式。
- source_word: מַעֲשֵׂה רֹקֵם
  choice: 是绣工的手艺
  rationale: 该结构表示专业绣工所作的工艺；译法贴近原文，同时符合现代汉语的庄重叙述。
