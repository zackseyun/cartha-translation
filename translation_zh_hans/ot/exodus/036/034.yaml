base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: zh_hans
  text: 他用金包覆竖板[a]，又用金做竖板的环，作横闩的座[b]；又用金包覆横闩。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“木板”。希伯来语这个词指会幕中直立的木质结构构件。
    reason: lexical_alternative
  - marker: b
    text: 直译“横闩的房屋”，指供横闩容纳或安置的部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: 竖板
  rationale: 该词在会幕建造语境中指直立的木质结构构件。“竖板”既保留其具体形态，也清楚表达其结构用途。
- source_word: צִפָּה / וַיְצַף
  choice: 用金包裹
  rationale: צפה在此表示在物件表面覆上一层材料；“用金包裹”自然、明确，并在两处采用相同译法。
- source_word: זָהָב
  choice: 金
  rationale: 这是明确的材料名称；原文三次提及金，译文均予以保留。
- source_word: טַבְּעֹתָם
  choice: 板上的环
  rationale: טַבַּעַת意为“环”；第三人称复数所属关系在汉语中自然表达为“板上的环”。
- source_word: עָשָׂה
  choice: 做成
  rationale: 该常用动词意为“制作、做”；结合材料补语，译作“做成金的”符合现代汉语习惯。
- source_word: בָּתִּים
  choice: 环座
  rationale: 字面义为“房屋”，此处比喻供横闩穿入并承托横闩的容纳部位；“环座”结合上下文表达其实际功能。
- source_word: לַבְּרִיחִם
  choice: 穿横闩
  rationale: בְּרִיחִים指连接并固定竖板的横向闩木；“横闩”准确简洁，而“穿”说明环座与横闩的关系。
