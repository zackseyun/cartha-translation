  text: And he joined five curtains by themselves[a], and six curtains by themselves.
translation:
  language: zh_hans
  text: 他把五幅幔子连成一组[a]，又把六幅幔子连成一组。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分别”或“分开”；意思是五幅幔子连接为一组，六幅幔子另连接为一组。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: 连成一组
  rationale: חָבַר表示连接、联结；结合两个לְבָד所表达的分组含义，“连成一组”自然地说明各幅幔子分别被连接为两组，又不具体限定连接方法。
- source_word: הַיְרִיעֹת
  choice: 幔子
  rationale: יְרִיעָה在会幕建造语境中指大型织物幅片；“幔子”符合本段礼仪建筑语境，也沿用较为通行而庄重的中文表达。
- source_word: לְבָד
  choice: 一组
  rationale: 此词表示分开、各自；在这里不是说每幅幔子彼此孤立，而是五幅构成一组、六幅另成一组。正文用两个“连成一组”清楚传达此结构，脚注保留“分别、分开”的词义角度。
- source_word: חֲמֵשׁ
  choice: 五幅
  rationale: 基数词“五”；中文为可展开的织物采用量词“幅”。
- source_word: שֵׁשׁ
  choice: 六幅
  rationale: 基数词“六”；中文为可展开的织物采用量词“幅”。
- source_word: אֶת ... וְאֶת
  choice: 把……又把……
  rationale: 重复的直接宾语标记构成两个并列宾语；中文以重复“把”并用“又”连接，保留平行结构。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“幅”使织物的计数自然；“连成一组”避免把“各自”误解为各幅互不相连，并保留原文两组分别连接的含义。
