  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: zh_hans
  text: 他用山羊毛做幔子，作盖在帐幕上的罩棚[a]；他做了十一幅幔子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “山羊毛”原文直译为“山羊”；也可译为“山羊的幔子”，不明说具体材料，但本段关于帐幕织物的上下文支持理解为山羊毛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: 做
  rationale: עָשָׂה是普通的“做、制作”；中文用“做”自然直接，并以“做了”保留原文重复动词的表达。
- source_word: יְרִיעֹת
  choice: 幔子
  rationale: 在会幕纺织物的语境中，指成幅的大型织物；“幔子”既符合圣所建造语境，也比“布料”明确。
- source_word: עִזִּים
  choice: 山羊毛
  rationale: 字面为“山羊”，但在本段纺织品语境中指山羊所出的织料，通常理解为山羊毛；正文采用明确而自然的表达，并以脚注保留字面歧义。
- source_word: לְאֹהֶל
  choice: 作为……罩棚
  rationale: 介词לְ在此表示用途或结果；“作为……罩棚”清楚表达这些幔子的功能，并避免把它误解为另一个独立帐篷。
- source_word: עַל
  choice: 上面的
  rationale: 表示覆盖层位于会幕之上；结合“罩棚”译作“上面的”最符合现代汉语。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: מִשְׁכָּן是出埃及记中圣所结构的专门称呼；“帐幕”是现代中文圣经语境中清楚、庄重且通行的对应词。
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: 十一幅
  rationale: 数词意为“十一”；量词“幅”适合成片的幔子。
- source_word: אֹתָם
  choice: （融入“做了十一幅幔子”）
  rationale: 宾语代词回指幔子；中文在数量短语中不需另译“它们”，其意义已自然包含在句内。
