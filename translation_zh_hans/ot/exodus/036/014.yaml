  register: 采用现代、庄重而易懂的普通话。“帐幕”与“罩棚”分别表达מִשְׁכָּן和אֹהֶל，以保留内层圣所结构与其上覆盖层之间的区别；分号和“一共”呈现后半句对数量的补充强调。
