  yaml_path: translation/ot/exodus/036/007.yaml
  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: zh_hans
  text: 材料足够完成全部工程，而且还有余。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“甚至绰绰有余。”希伯来语可着重表示超过工程所需，也可着重表示用后仍有剩余。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: 材料
  rationale: מְלָאכָה通常指“工作、工程”，但结合上文百姓所献之物已经足够且被制止继续带来，此处所指是供工程使用的材料；译作“材料”符合语境，也避免把“工程足够完成工程”译得生硬。
- source_word: הָיְתָה דַיָּם
  choice: 足够
  rationale: דַּי表示充足、够用，词尾代词回指语境中的材料；现代汉语以“材料足够”自然表达。
- source_word: לְכָל הַמְּלָאכָה
  choice: 完成全部工程
  rationale: 此处מְלָאכָה指需要进行的整个建造工程；将לַעֲשׂוֹת אֹתָהּ一并译入“完成”，既保留目的含义，也避免不自然的“做它”。
- source_word: וְהוֹתֵר
  choice: 而且还有余
  rationale: יתר的使役形在此表达超过所需、剩有余量；“还有余”简洁保留了剩余和富余两层含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“全部工程”承接会幕建造的整体任务；“完成”自然涵盖希伯来语“做它”的目的结构。主文中的[a]与脚注对应。
