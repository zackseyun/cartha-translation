  text: and its five pillars with their hooks[a]; and he overlaid their tops and their bands with gold[b], and their five bases were bronze.
translation:
  language: zh_hans
  text: 又做了帘子的五根柱子和柱上的钩子；并用金子包了柱顶和柱箍；五个柱座是铜的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “铜”也可译作“青铜”；这里的希伯来词可指铜或铜合金。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: 帘子的五根柱子
  rationale: עַמּוּד指直立的支撑物；在会幕建造语境中译作“柱子”自然准确。第三人称单数后缀承接上文的门帘，为避免中文指代含混，明说“帘子的”。
- source_word: וָוֵיהֶם
  choice: 柱上的钩子
  rationale: וָו在会幕语境中指装在柱子上、用来悬挂帘子的钩件；补出“柱上的”使所属关系在现代汉语中清楚。
- source_word: וְצִפָּה
  choice: 包上
  rationale: צפה在此指用金属覆盖器物表面；“包上金子”符合现代中文工艺表述，也保留覆贴金层的含义。
- source_word: רָאשֵׁיהֶם
  choice: 柱顶
  rationale: 原义为“它们的头部”，在柱子的建筑语境中即柱子顶部；“柱顶”准确且简明，不把它限定为特定样式的柱头。
- source_word: חֲשֻׁקֵיהֶם
  choice: 柱箍
  rationale: 该词指柱子上的箍带或连接构件，具体形制不确定；“柱箍”比传统但生僻的术语更易懂，同时保留构件性质。
- source_word: אַדְנֵיהֶם
  choice: 柱座
  rationale: אֶדֶן在会幕结构中指承托柱子的底座或插座；“柱座”在中文中兼顾功能与可读性。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: נְחֹשֶׁת可泛指铜或铜合金；“铜”不武断指定古代金属的确切合金成分，并符合中文圣经建筑语境。
