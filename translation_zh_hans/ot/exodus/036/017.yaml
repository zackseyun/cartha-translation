base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: zh_hans
  text: 他在第一组相连的幔子中最外面的那幅幔子的边缘做了五十个环；又在第二组相连的幔子中那幅幔子的边缘做了五十个环。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “相连的一组”也可译作“连接处”或“连成的部分”；原文所用的词可指幔子连接而成的一组或连接部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: 环
  rationale: 指缝在织物边缘、用来连接幔子的环。“环”简明自然；本节原文没有说明颜色，因此不增译“蓝色”。
- source_word: שְׂפַת
  choice: 边缘
  rationale: 本义为“唇”，用于织物时指边或边缘；“边缘”符合现代汉语表达。
- source_word: יְרִיעָה
  choice: 幔子
  rationale: 在会幕语境中指大幅织物。“幔子”既符合具体语境，也保持庄重而易懂的表达。
- source_word: הַקִּיצֹנָה
  choice: 最外边
  rationale: 表示处在尽头或外端的位置；“最外边”准确传达该幅幔子在一组中的位置。
- source_word: בַּמַּחְבָּרֶת
  choice: 在相连的一组中
  rationale: מַחְבָּרֶת可指连接、连接部分或连成的一组幔子。正文采用语境清楚的表达，同时用脚注保留词义范围。
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: 第二组相接的那幅幔子
  rationale: 保留חֹבֶרֶת的相接、连接意味，并让“第二”与上下文中的第二组相联系；避免把关系过度具体化为“与它相连”。
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: 做了……做了
  rationale: 保留原文重复使用עשה的结构和叙述节奏。
