    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: 相连
  rationale: חבר表示连接、接合；“相连”符合会幕制作的语境，又不额外限定具体连接方式。
- source_word: יְרִיעֹת
  choice: 幔子
  rationale: 在会幕语境中，该词指构成帐幕的大幅织物；“幔子”庄重自然，也能与普通帘子有所区别。
- source_word: חֲמֵשׁ
  choice: 五幅
  rationale: 数字直译为“五”，并按汉语中织物的习惯使用量词“幅”。
- source_word: אַחַת אֶל אֶחָת
  choice: 彼此相连
  rationale: 该表达描述同一组各幅幔子相互接合；“彼此相连”自然地传达这种关系。
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: 又把另外五幅幔子
  rationale: 希伯来文直译为“又把五幅幔子”；平行结构表明这是第二组五幅。“另外”使现代汉语意思清楚，并以脚注说明其为补足表达。
