  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: zh_hans
  text: 每块板有两个榫头[a]，彼此相接[b]；他把帐幕所有的板都这样制作。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “榫头”原文直译为“手”，这里比喻每块板上伸出的接合部分。
    reason: lexical_alternative
  - marker: b
    text: 或译：“彼此相对”，强调两个榫头相互对应、排列齐整。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: 两个榫头
  rationale: יָדֹת 字面意为“两只手”，在帐幕木构件的语境中比喻板上伸出的接合部分；“榫头”是准确、自然的现代建筑用语。
- source_word: קֶּרֶשׁ
  choice: 板
  rationale: 指构成帐幕框架的木质结构单元；“板”简明，并符合上下文。
- source_word: מְשֻׁלָּבֹת אַחַת אֶל אֶחָת
  choice: 彼此相接
  rationale: 表达两个榫头相互对应、配合的关系，同时不把原文未完全明确的具体排列方式说死。
- source_word: כֵּן עָשָׂה
  choice: 他都是这样做的
  rationale: 自然表达“照这种方式制作”，并承接后面的总体范围。
- source_word: מִשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中该圣所结构的通行中文名称，清楚且符合语境。
