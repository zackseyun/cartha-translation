  yaml_path: translation/ot/exodus/036/031.yaml
  text: He made five bars of acacia wood for the frames of one side of the tabernacle[a].
translation:
  language: zh_hans
  text: 他用金合欢木做了五根横闩，供帐幕一边的竖板[a]使用。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “竖板”或译“框架”，指构成帐幕墙面的直立结构件。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他……做了
  rationale: 该叙事性动词承接前文，表示接下来完成的动作；现代汉语不必逐字译出句首连接词。
- source_word: בְּרִיחֵי
  choice: 横闩
  rationale: 指连接并固定帐幕竖直构件的长条木件；“横闩”既表达其结构功能，也避免“门闩”所带来的狭义联想。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 指用שִׁטָּה树的木材制成；“皂荚木”是中文圣经语境中通行且易懂的名称。
- source_word: חֲמִשָּׁה
  choice: 五根
  rationale: 准确表达基数，并采用适合长条木件的现代汉语量词“根”。
- source_word: לְקַרְשֵׁי
  choice: 供……竖板使用
  rationale: קֶרֶשׁ指帐幕直立的结构构件；“竖板”清楚呈现其形态和用途，同时以脚注保留“框架”这一可能译法。
- source_word: צֶלַע
  choice: 一边
  rationale: 在建筑语境中指结构的一侧，而非字面的“肋骨”。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中该圣所结构的通行中文名称。
- source_word: הָאֶחָת
  choice: 一边
  rationale: 阴性单数与צֶלַע呼应，表示帐幕两侧中的一侧，并不明确表示次序上的“第一边”。
