    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又做了
  rationale: עשה是“做、制造”的常用动词；“做了”自然准确，“又”承接连续叙事。
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: 五十个金扣
  rationale: קֶרֶס指连接幔子的扣件；“金扣”简洁清楚，又不额外限定其具体形状。
- source_word: וַיְחַבֵּר אֶת הַיְרִעֹת אַחַת אֶל אַחַת בַּקְּרָסִים
  choice: 把幔子用扣子彼此连接起来
  rationale: חבר表示连接；אַחַת אֶל אַחַת表达相互连接，介词ב在此表示工具。“彼此连接起来”符合现代汉语并保留动作含义。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 在《出埃及记》的圣所语境中，מִשְׁכָּן指会幕建筑本身；“帐幕”是简明且传统的对应词。
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: 帐幕就合成了一个整体
  rationale: 直译为“帐幕就成为一个”；此处紧接连接幔子的行动，表达其结果。“合成了一个整体”清楚呈现结构上的合一，而不引入额外神学含义。
