base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/033.yaml
  text: He made the middle bar to pass through the midst of the boards from end to end[a][b].
translation:
  language: zh_hans
  text: 他又做了一根中间的横木，使它从这一头到那一头，穿过那些竖板的中部[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“中央的横木……从一端到另一端。”
    reason: lexical_alternative
  - marker: b
    text: 这里译作“穿过”的希伯来语动词，在这种建筑语境中也可理解为“贯通”或“延伸贯穿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他又做了
  rationale: עשה的Qal叙事过去式承接上文；“又”自然体现希伯来语叙事连接，而不使语气过重。
- source_word: הַבְּרִיחַ
  choice: 横木
  rationale: בְּרִיחַ在会幕构造语境中指连接、固定竖板的横向木件；“横木”比泛称“木闩”更能清楚表达其结构功能。
- source_word: הַתִּיכֹן
  choice: 中间的
  rationale: 该形容词表示位于中间或中央；保留空间意义，同时不进一步断定它是内置还是居中的哪一种具体构造。
- source_word: לִבְרֹחַ
  choice: 使它……穿过
  rationale: ברח的不定式在此描述横木贯通或延伸的状态与功能；“使它穿过”符合中文构造描述，也保留“贯穿”的动态意象。
- source_word: בְּתוֹךְ
  choice: 穿过……的中部
  rationale: בְּתוֹךְ可指在内部、在当中；与横木的延伸动作结合，译作“穿过……的中部”自然且保留空间关系。
- source_word: הַקְּרָשִׁים
  choice: 竖板
  rationale: קֶרֶשׁ是会幕墙体的板状构件；“竖板”既清楚说明构件形态和方向，也与横木形成易懂的结构对照。
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: 从这一头到那一头
  rationale: 该习语表示贯通全部长度；此译法自然，并比单说“从头到尾”更明确地保留两端之间的空间关系。
theological_decisions: []
