base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: zh_hans
  text: 他们对摩西说：“百姓带来的已经大大超过了完成耶和华所吩咐要做的工程所需的。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓为这工程带来的太多了。”原文强调所带来的超过了实际所需。
    reason: 说明 מַרְבִּים 与 מִדֵּי 合成表达的过量含义，并提供较简短的替代译法。
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: 他们对摩西说
  rationale: 这是叙事中引出直接引语的常用表达；汉语无需重复译出“说……道”，即可自然传达原意。
- source_word: מַרְבִּים ... לְהָבִיא מִדֵּי
  choice: 送来的，已经远远超过了……的需要
  rationale: מַרְבִּים与מִדֵּי合起来强调百姓持续送来的材料超过充足数量；此译法既表达过量，也保留“超过所需”的比较含义。
- source_word: הָעָם
  choice: 百姓
  rationale: 指以色列民这一集体；“百姓”符合出埃及记语境和庄重的现代汉语表达。
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: 完成……工程
  rationale: עֲבֹדָה与מְלָאכָה在此共同指向建造会幕所需进行的工作。汉语若机械并列两个近义词会显得累赘，因此以“完成……工程”自然呈现其具体任务含义。
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: 耶和华所吩咐之工程
  rationale: 关系从句说明这项工程出于耶和华的命令；“所吩咐之工程”简洁保留神圣命令与工程之间的关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者熟悉的专名“耶和华”呈现四字神名，同时不将其改写为称号。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且具有专名功能的“耶和华”；“雅威”是较接近学术重构读音的另一译法，但原始发音并不能完全确定。
- issue: לַעֲשֹׂת אֹתָהּ 的施事者
  choice: 以“所吩咐之工程”表达，不明说由谁完成
  alternative: 吩咐他们去做的工程
  rationale: 希伯来文表达“吩咐去做它”，本节未明说不定式的施事者。正文避免补入“他们”，以保留原文在施事者上的含蓄。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“远远超过……的需要”清楚表现捐献材料过量；“工程”结合上下文指会幕建造任务。脚注标记已置于整句引语末尾。
