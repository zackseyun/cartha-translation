  text: וַ/יַּעֲשׂ֨וּ כָל חֲכַם לֵ֜ב בְּ/עֹשֵׂ֧י הַ/מְּלָאכָ֛ה אֶת הַ/מִּשְׁכָּ֖ן עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב עָשָׂ֥ה אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: zh_hans
  text: 所有从事这项工作的巧匠[a]都制作了帐幕，就是十幅幔子。这些幔子用捻的细麻线、蓝色线、紫色线和朱红色线织成；他用精巧的织法，在幔子上织出基路伯。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巧匠”原文直译为“心里有智慧的人”，在这里是指有精湛手艺的人。
    reason: lexical_alternative
  - marker: b
    text: 本节开头用复数动词“他们制作”，末尾却用单数动词“他制作它们”。译文保留这一转换；有些译本将末尾顺译为“他们”。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: 巧匠
  rationale: 原文直译为“心里有智慧的人”，在此是指具备精湛手艺的工匠。“巧匠”自然、简洁，并保留工艺才能的含义；以脚注说明其字面意象。
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: 参与这项工作的
  rationale: 介词与分词的组合表明这些巧匠属于从事建造工作的人群；此译法保留“在做工的人当中”的关系。
- source_word: הַמִּשְׁכָּן
  choice: 帐幕
  rationale: 这是《出埃及记》中该圣所结构的通行中文名称，比泛指性的“居所”更明确。
- source_word: יְרִיעֹת
  choice: 幔子
  rationale: 在帐幕建造语境中指构成帐幕的大幅织物；“幔子”符合庄重的现代圣经用语。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻的细麻线
  rationale: 保留细麻与捻线的纺织细节，不将其笼统处理为“细麻布”。
- source_word: תְכֵלֶת
  choice: 蓝色线
  rationale: 该词在此指染成蓝色的纺织材料；补出“线”使中文明确，并与同列色线协调。
- source_word: אַרְגָּמָן
  choice: 紫色线
  rationale: 按帐幕织物语境译为紫色的线材。
- source_word: תוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该词组指用特定染料染成朱红色的纺织材料；“朱红色线”准确传达颜色与材料用途。
- source_word: כְּרֻבִים
  choice: 基路伯
  rationale: 采用现代中文圣经中对这种天上活物的通行音译，避免将其解释为其他类别。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 巧匠的工艺
  rationale: 该词组指经过精心构思、技术高超的织造工艺；此译法保留设计与工艺层面的含义。
- source_word: עָשָׂה אֹתָם
  choice: 他……做成
  rationale: 原文末尾使用阳性单数动词及复数宾语。译文以“他”保留这一单数形式，不把它顺改为“他们”。
theological_decisions:
- issue: חֲכַם לֵב在泛指工匠语境中的性别与习语表达
  choice: 巧匠
  alternative: 心里有智慧的人；有技能的人
  rationale: 希伯来语形式为阳性单数，但在“所有……的人”结构中作类别性、分配性泛指。现代汉语“巧匠”不额外标明性别，却准确表达原文在此强调的工艺能力；脚注保留“心里有智慧”的字面形式，避免丢失原文意象。
- issue: 句末单数动词与句首复数动词之间的不一致
  choice: 保留为“他”
  alternative: 顺译为“他们”
  rationale: 马所拉文本先用复数“他们做”，末尾却用单数“他做”。译文不替原文协调数的一致，而以脚注说明这种转换，保留其可能具有的分配性表达及文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“帐幕、幔子、基路伯”保持出埃及记圣所叙事的传统术语；色彩词统一补出“线”，使纺织场景清楚。以分句方式尽量保留希伯来语从复数主语转为单数动词的结构张力。
