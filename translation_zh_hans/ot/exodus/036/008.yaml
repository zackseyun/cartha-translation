  to: 所有从事这项工作的巧匠[a]都制作了帐幕，就是十幅幔子。这些幔子用捻的细麻线、蓝色线、紫色线和朱红色线织成；他用精巧的织法，在幔子上织出基路伯。[b]
  rationale: 修订避免将十幅幔子过度表述为“用来做成帐幕”的手段，而以“就是”表达原文紧邻的说明关系。末句明确以“他”及主动织造动作对应希伯来文句末的单数动词和复数宾语，并保留脚注说明，不试图协调原文的数不一致。
