base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: zh_hans
  text: 他为它[a]做了四根金合欢木柱，用金包裹它们；柱上的钩子是金的；又为柱子铸了四个银座[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “它”指上一节所说的幔子。
    reason: cross_reference
  - marker: b
    text: “银座”也可译作“银插座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שִׁטִּים
  choice: 金合欢木柱
  rationale: עַמּוּדִים指直立的结构支柱；שִׁטִּים指会幕建造所用的金合欢属木材。译作“金合欢木柱”准确而符合现代汉语。
- source_word: וַיְצַפֵּם
  choice: 包上金
  rationale: 该动词在会幕制作语境中指以金属包覆物件；“包上金”自然、清楚，并保留动作含义。
- source_word: וָוֵיהֶם
  choice: 柱上的钩子
  rationale: וָוִים在此最可能指柱上用于连接或悬挂的钩状配件。补出“柱上的”使复数所属关系在汉语中清楚。
- source_word: אַדְנֵי כָסֶף
  choice: 银座
  rationale: אַדְנִים指承接并固定柱子的金属底部构件；“银座”简洁庄重，“银插座”可作为更具结构说明性的替译。
- source_word: לָהּ
  choice: 为它
  rationale: 保留希伯来文阴性单数代词的回指形式，不在正文中直接改写为其所指对象；脚注说明它承接上一节的幔子。
- source_word: וַיִּצֹק
  choice: 铸了
  rationale: 在制作银质底座的语境中，该动词表示熔铸金属，而非一般意义的倾倒。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。分号保留原文三个制作动作的并列层次；“柱上的钩子”避免汉语“它们的钩子”可能造成的指代含混。英文咨询层的脚注标记与脚注内容明显错位，故按各脚注实际所释词语重新安放标记。
