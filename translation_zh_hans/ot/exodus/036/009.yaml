  register: 采用简洁、庄重的现代标准汉语。量词“幅”适合成片织物；后半句用“尺寸都一样”自然表达原文“一个量度”的统一性。原文不存在需要以注释保留的神学歧义；英文咨询层所列脚注与其标记位置明显不相符，因此未沿用。
