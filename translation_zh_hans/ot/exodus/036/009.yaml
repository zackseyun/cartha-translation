base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: zh_hans
  text: 每幅幔子长二十八肘，宽四肘；所有幔子的尺寸都一样。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרֶךְ
  choice: 长
  rationale: 在说明物体尺寸时，“长”是现代汉语中自然、准确的表达。
- source_word: יְרִיעָה
  choice: 幔子
  rationale: 此词在会幕语境中指成幅的织物覆盖物；“幔子”既符合上下文，也保留其柔性织物的性质。
- source_word: הָאַחַת / הָאֶחָת
  choice: 每幅
  rationale: 原文直译为“那一幅”，在尺寸说明中具有逐一分配的含义；译作“每幅”清楚表明这些尺寸适用于各幅幔子。
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: 二十八
  rationale: 按现代汉语数词习惯表达。
- source_word: אַמָּה
  choice: 肘
  rationale: 保留希伯来文古代长度单位，不擅自换算成现代单位。
- source_word: רֹחַב
  choice: 宽
  rationale: 作为“长”的对应尺寸，“宽”简明自然。
- source_word: אַרְבַּע
  choice: 四
  rationale: 直接对应原文数词。
- source_word: מִדָּה אַחַת
  choice: 尺寸都一样
  rationale: 原文意为“一个量度”，这里说明所有幔子的规格一致；“尺寸都一样”比直译“一个量度”更符合现代汉语，同时保留原意。
- source_word: לְכָל הַיְרִיעֹת
  choice: 所有幔子
  rationale: 准确表达统一尺寸所涵盖的全部幔子。
theological_decisions: []
