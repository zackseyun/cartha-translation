source:
  edition: WLC
  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: zh_hans
  text: 比撒列、亚何利亚伯和所有心中有智慧的人，就是耶和华赐给他们智慧和悟性，使他们知道怎样做圣所事奉的一切工作的人，都必照耶和华所吩咐的一切而行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה
  choice: 都要……去做
  rationale: 此处完成式承接前文指示，表达将要履行或应当履行之意；用“都要……去做”在现代汉语中自然，也保留指令意味。
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: 比撒列、亚何利亚伯
  rationale: 依照现代中文圣经常用音译处理两个人名。
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: 所有心里有智慧的人
  rationale: 保留希伯来语“心里有智慧”的意象；在本语境中，这种智慧包括工艺技能，但不把词义缩窄为单纯“技术高明”。中文“人”也可自然统指这一群工匠。
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: 就是耶和华赐予智慧和悟性……的人
  rationale: בָהֵמָּה字面为复数“在他们里面”；中文用复数关系结构统括比撒列、亚何利亚伯和其余有智慧的人，并以“赐予”自然表达 נתן。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的圣名传统音译，明确呈现专名而不以“主”替代。
- source_word: חָכְמָה וּתְבוּנָה
  choice: 智慧和悟性
  rationale: “智慧”保留 חָכְמָה 的广义，也涵盖神所赐的工艺才能；“悟性”表达 תְבוּנָה 的理解与洞察能力。
- source_word: לָדַעַת לַעֲשֹׂת
  choice: 使他们知道怎样做
  rationale: 两个不定式在语境中指实际操作能力；“知道怎样做”既自然又不超出原文。
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: 圣所各项事奉之工
  rationale: 保留 מְלֶאכֶת（工作）、עֲבֹדַת（事奉或劳作）与 הַקֹּדֶשׁ（圣所）的层叠关系，同时避免生硬重复。
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: 照耶和华所吩咐的一切
  rationale: 介词 לְ 在此表示依照或符合；“照……所吩咐的一切”准确表达施工须符合全部命令。
theological_decisions:
- issue: 圣名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。译文以中文读者广泛熟悉的专名“耶和华”呈现，不以称号“主”取代；“雅威”也是较贴近学术重建读音的可行译法。
- issue: “心里有智慧”与工艺技能的关系
  choice: 保留“心里有智慧”
  alternative: 译作“技艺高超”或“有技能”
  rationale: 本节语境确实指向工艺能力，但 חֲכַם־לֵב 同时强调内在由神所赐的智慧。保留原有意象可避免把神学和语义张力缩减为纯技术描述。
- issue: אִישׁ 的性别表达
  choice: 人
  alternative: 男人
  rationale: אִישׁ 为阳性单数，但在 כֹל אִישׁ 结构中可泛指群体中的每个人。现代汉语“人”不掩盖具体参与者，也避免加入原文在此未着重强调的性别对比。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句式按中文信息结构重组，以“就是……”明确关系从句所修饰的整个复数群体；保留“心里有智慧”和“事奉之工”等经文语域，但避免过度文言化。
