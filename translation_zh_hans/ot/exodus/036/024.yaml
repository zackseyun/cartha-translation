  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: zh_hans
  text: 他在二十块框板下面造了四十个银座：每块框板下面各有两个座，承接它的两个榫头。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: 银座
  rationale: אַדְנִים在此指承接框板榫头的底座；译作“银座”简洁、准确，也符合会幕构造语境。
- source_word: הַקְּרָשִׁים
  choice: 框板
  rationale: קֶרֶשׁ指会幕结构中的竖立构件；“框板”既保留板状构件的意义，也避免只译“木板”而忽略其结构功能。
- source_word: יְדֹתָיו
  choice: 榫头
  rationale: 该词字面为“手”，在本段建筑语境中指框板底部伸入座内的凸榫；“榫头”是自然且明确的现代汉语表达。
- source_word: הָאֶחָד ... הָאֶחָד
  choice: 每一块……另一块
  rationale: 原文先说“这一块/一块”，后说“另一块”；结合二十块框板逐块配置底座的语境，用“每一块……另一块”传达分配关系，同时保留后半句的逐项说明。
