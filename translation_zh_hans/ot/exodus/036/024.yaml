  source_fidelity: 原文说明二十块框板共配四十个银座，即每块框板各有两个座，对应其两个榫头。草稿前半句“每一块”准确，但随后“另一块框板”会在汉语中形成只谈两块板的歧义，未能清楚表达逐块配置的关系。
