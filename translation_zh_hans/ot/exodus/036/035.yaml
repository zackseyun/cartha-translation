base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: zh_hans
  text: 他用蓝色线、紫色线、朱红色线[b]和捻成的细麻做幔子[a]，按巧匠设计的工艺[c]织上基路伯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “幔子”也可译作“帷幔”；这里指会幕内起分隔作用的幔子。
    reason: lexical_alternative
  - marker: b
    text: “朱红色线”：希伯来语直译近于“朱红虫”，是对朱红染料或染成材料的表达；也可译作“猩红色线”。
    reason: lexical_alternative
  - marker: c
    text: “巧匠设计的工艺”也可译作“巧工”或“精巧的编织工艺”；希伯来语强调经过构思、带有纹样的工艺。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: 幔子
  rationale: 此词指会幕内起分隔作用的帘幔。“幔子”既符合具体器物语境，也比带有特定宗教传统色彩的译法更自然；“帷幔”可作较庄重的替代译法。
- source_word: תְּכֵלֶת
  choice: 蓝色
  rationale: 指会幕织物所用的蓝色染料或蓝色材料；在这一串织物颜色中译作“蓝色”简洁自然。
- source_word: אַרְגָּמָן
  choice: 紫色
  rationale: 通常指贵重的紫色染料或染色材料；上下文中的“线”统摄各颜色词。
- source_word: תוֹלַעַת שָׁנִי
  choice: 朱红色线
  rationale: 该复合表达指朱红或猩红染成的材料、线。“朱红色线”明确其纺织材料属性，同时保留鲜明的颜色意义。
- source_word: שֵׁשׁ מָשְׁזָר
  choice: 捻成的细麻
  rationale: שֵׁשׁ指优质细麻，מָשְׁזָר说明经过搓捻；此译保留材料和加工方式。
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: 以巧匠的手艺
  rationale: 该短语指经过构思、带有图案的精巧工艺；“巧匠的手艺”自然庄重，并不过度限定究竟是织造还是刺绣。
- source_word: כְּרֻבִים
  choice: 基路伯
  rationale: 采用现代中文圣经语境中通行的音译，指幔子上表现的天上活物。
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: 在上面织出基路伯
  rationale: 句法表明基路伯被纳入幔子的工艺和纹样中。“在上面织出”清楚表达这种结合，又与纺织语境相符。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。句式顺应中文表达，将材料列举置于主要动作之前；“织出”联系纺织语境，但脚注保留原文对具体工艺类型未完全限定的空间。
