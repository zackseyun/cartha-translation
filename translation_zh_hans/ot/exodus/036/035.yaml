revisions:
- from: 他用蓝色、紫色、朱红色线[b]和捻成的细麻做幔子[a]，以巧匠的手艺[c]在上面织出基路伯。
  to: 他用蓝色线、紫色线、朱红色线[b]和捻成的细麻做幔子[a]，按巧匠设计的工艺[c]织上基路伯。
  rationale: 修订仅澄清三种有色纺织材料的并列关系，并以更自然、贴近原文的中文表达呈现“精巧设计的工艺”。“织上基路伯”保留基路伯被纳入幔子纹样的含义，未额外断定具体技法。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:58Z'
