base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: zh_hans
  text: 她生了一个儿子；摩西给他起名叫革舜[a]，因为他说[b]：“我在异乡作寄居者。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “革舜”在希伯来语中与“在那里作寄居者”的说法音近；摩西以此说明这个名字。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“我曾在异乡作寄居者。”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: 她生了一个儿子
  rationale: 准确表达生育句式；现代汉语自然清楚，并保留“儿子”的亲属含义。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: 摩西给他取名叫
  rationale: 希伯来文主语仅为“他”，但汉语若直译容易误指刚出生的儿子；依据上下文明确为摩西，同时用自然的现代汉语保留命名公式。
- source_word: גֵּרְשֹׁם
  choice: 革舜
  rationale: 采用中文圣经传统中广为人知的人名译法；名字与后文 גֵּר 的希伯来语音义联系另以脚注说明。
- source_word: כִּי אָמַר
  choice: 因为他说
  rationale: כִּי 在此引出取名的理由；“因为”清楚保留解释关系。
- source_word: גֵּר
  choice: 寄居者
  rationale: 指居住在非本族土地上的外来居民；“寄居者”既准确又保留其寄寓、非本地人的意味，避免“外国人”可能带来的现代国籍色彩。
- source_word: הָיִיתִי
  choice: 我……作了
  rationale: 完成式可表达已成事实或延续至说话时的处境；正文用中文完成体“作了”，脚注保留较单纯过去时的可能。
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: 在异乡
  rationale: 自然凝练地表达“在外族之地／陌生土地”，并与“寄居者”共同呈现摩西离乡寄居的处境。
theological_decisions:
- issue: הָיִיתִי 的时态体意义
  choice: “我在异乡作了寄居者”
  alternative: “我曾在异乡作寄居者”
  rationale: 希伯来语完成式本身不强制区分英语式简单过去与现在完成；正文呈现已发生且可延续到命名时的状态，脚注保留单纯过去理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“革舜”沿用成熟中文人名传统；“寄居者”兼顾 גֵּר 的社会身份含义和命名双关。以“摩西”明示代词所指，避免现代汉语中的主语歧义。
