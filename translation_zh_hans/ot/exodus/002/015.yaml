  to: 法老听说这件事[a]，就想杀摩西。摩西却逃离法老，住在米甸地[b]；他坐在井旁。
  rationale: 修订仅删除原文未表达的“后来”，并将“躲避法老，逃到了”收束为“逃离法老，住在米甸地”。这保留了原文的语义、叙事顺序及同一动词两次使用的脚注说明，也使现代标准汉语更自然。
