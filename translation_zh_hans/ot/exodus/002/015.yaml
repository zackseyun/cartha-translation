base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: zh_hans
  text: 法老听说这件事[a]，就想杀摩西。摩西却逃离法老，住在米甸地[b]；他坐在井旁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“听见这事”或“得知这件事”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文在“住在”和“坐在”两处用了同一个动词；第一次指在米甸居住，第二次指实际坐在井旁。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听说了
  rationale: שׁמע的基本义是“听见”，但这里指法老得知先前发生的事；“听说了”既自然，也保留听闻之意。
- source_word: הַדָּבָר הַזֶּה
  choice: 这件事
  rationale: דבר在此指摩西杀死埃及人的事件；“这件事”是现代汉语中自然且不过度具体化的表达。
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: 想要杀
  rationale: בקש加不定式表达寻求、企图或意图做某事；“想要杀”保留其意图，而不把实际尝试说得过实。
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: 躲避法老，逃到了
  rationale: 该结构表示从某人面前逃走；中文用“躲避……逃到……”自然呈现逃离法老并前往米甸的动作。
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: 在米甸地住下
  rationale: ישׁב在这里表示居住、停留或安顿；“住下”不必然暗示永久定居，也符合上下文。
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: 坐在井旁
  rationale: 同一动词ישׁב第二次取具体的“坐”义；עַל在此按汉语习惯译为“在……旁”。
- source_word: הַבְּאֵר
  choice: 井
  rationale: 希伯来文带定冠词；汉语叙事中通常无需机械译出定指词，“井旁”自然且语义明确。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代中文圣经及一般汉语通行的王室称号译名。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文通行的人名译法。
- source_word: מִדְיָן
  choice: 米甸
  rationale: 采用现代中文圣经及一般汉语通行的地名译法。
