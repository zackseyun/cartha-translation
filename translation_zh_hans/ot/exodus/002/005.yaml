  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: zh_hans
  text: 那时，法老的女儿下到尼罗河边洗澡，她的侍女们正沿着河岸走。她看见芦苇丛中有一个箱子[a]，就派自己的女仆去取；她便把它取了过来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里译作“箱子”的希伯来词，与《创世记》6—9章中译作挪亚“方舟”的词相同。
    reason: cross_reference
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: 下到
  rationale: 保留ירד“下去、下降”的方向含义，同时符合现代汉语叙事表达。
- source_word: בַּת פַּרְעֹה
  choice: 法老的女儿
  rationale: 按希伯来语属格结构自然表达；“法老”作为埃及君王的称号处理。
- source_word: לִרְחֹץ עַל הַיְאֹר
  choice: 到尼罗河边洗澡
  rationale: רחץ在此处指沐浴；介词על为地点用法，“河边”避免误解为在河面上。
- source_word: וְנַעֲרֹתֶיהָ
  choice: 她的侍女们
  rationale: נערות本指年轻女子；在王女出行的语境中，她们显然是随行女子。“侍女们”在汉语中自然，并保留其女性身份。
- source_word: הֹלְכֹת
  choice: 正……走
  rationale: 分词表示相对于主线动作持续进行的背景动作，以“正”体现其进行状态。
- source_word: עַל יַד הַיְאֹר
  choice: 沿着河岸
  rationale: עַל יַד是“在旁边”的惯用语；结合行走动作，译为“沿着河岸”准确自然。
- source_word: הַתֵּבָה
  choice: 箱子
  rationale: תבה指盛载婴儿的容器。“箱子”比“方舟”更符合本处物件的大小和场景，也比“篮子”更少加入编织材质的暗示；该词与挪亚方舟的词汇联系收入脚注。
- source_word: בְּתוֹךְ הַסּוּף
  choice: 芦苇丛中
  rationale: סוּף指芦苇、灯心草一类水生植物；“芦苇丛中”简洁保留בְּתוֹךְ所表达的置身其中。
- source_word: אֲמָתָהּ
  choice: 她的女仆
  rationale: 按马所拉元音读作אָמָה“女仆”，也与שלח“派遣”在句法和语境上相合；“她的”明确所属关系。
- source_word: וַתִּקָּחֶהָ
  choice: 去把它取来
  rationale: 阴性单数宾语后缀指前面的箱子。汉语将“派遣”和“取来”合并表达，清楚传达女仆奉命取回箱子的动作，而不把逐词结构译得生硬。
theological_decisions:
- issue: 摩西叙事中תבה的译法及其与挪亚叙事的联系
  choice: 正文译作“箱子”，脚注说明与“方舟”为同一希伯来词
  alternative: 正文译作“方舟”或“篮子”
  rationale: 本处首先需要让读者明白这是容纳婴儿的小型器物，因此不在正文中使用通常指挪亚大船的“方舟”；同时以脚注保留《创世记》6—9章与本段之间真实存在的词汇呼应。
- issue: אֲמָתָהּ的文本理解
  choice: 女仆
  alternative: 手臂
  rationale: 马所拉文本的元音及שלח“派遣”的支配关系支持“女仆”；传统的“手臂”理解仍有文本史意义，故不在正文采用，但在脚注中保留。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“那时”承接上下文；以“正……走”区分背景动作与主要事件。“女仆”与“侍女们”分别对应אמה和נערות，既自然，也尽量保留原文用词差异。
