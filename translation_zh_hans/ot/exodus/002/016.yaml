base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: zh_hans
  text: 米甸的祭司[a]有七个女儿。她们来打水[b]，把水槽装满，要给父亲的羊群喝水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可理解为“米甸的一位祭司”。原文可以指一位特定的祭司，也可以泛指米甸的一位祭司。
    reason: lexical_alternative
  - marker: b
    text: “打水”所译的动词，指从井里把水汲取上来。
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: 米甸的祭司
  rationale: כֹהֵן意为“祭司”；מִדְיָן表明他与米甸的地域关联。汉语没有冠词，“米甸的祭司”可自然保留原文究竟指特定祭司还是一位祭司的歧义。句首וּ主要承接并转入新人物，不另加“现在”。
- source_word: שֶׁבַע בָּנוֹת
  choice: 有七个女儿
  rationale: 原文是表示领属的名词句，现代汉语自然表达为“有七个女儿”。
- source_word: וַתָּבֹאנָה
  choice: 她们来
  rationale: בוא在连续叙事中表示来到此处；补出阴性复数主语“她们”，使汉语清楚自然。
- source_word: וַתִּדְלֶנָה
  choice: 打水
  rationale: דלה指从井中汲取、提上水；“打水”是现代汉语中自然且符合场景的表达。
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: 把水槽装满
  rationale: מלא意为装满；רְהָטִים指供牲畜饮水的槽或水道，此处译“水槽”清楚具体。
- source_word: לְהַשְׁקוֹת
  choice: 要给……喝水
  rationale: שקה的使役式意为使之饮水；目的不定式用“要给……喝水”表达自然。
- source_word: צֹאן אֲבִיהֶן
  choice: 父亲的羊群
  rationale: צֹאן是绵羊、山羊等小型牲畜的集合称谓；叙事语境中“羊群”是简洁自然的汉语对应。אֲבִיהֶן明确表示“她们的父亲”。
theological_decisions: []
