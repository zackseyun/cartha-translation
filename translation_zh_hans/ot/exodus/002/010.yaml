base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: zh_hans
  text: 孩子长大后，她就把他带到法老的女儿那里；他便成了她的儿子[a]。法老的女儿给他起名叫摩西，说：“因为我把他从水里拉了出来。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他就作她的儿子”，也可理解为“他对她如同儿子”。
    reason: lexical_alternative
  - marker: b
    text: “摩西”这一名字在希伯来语中与“我把他从水里拉了出来”形成文字游戏。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל הַיֶּלֶד
  choice: 孩子长大后
  rationale: גדל在这里指孩子随年龄成长；译作“长大”自然地承接婴儿时期的叙事，不引入地位升高之意。
- source_word: וַתְּבִאֵהוּ
  choice: 她就把他带到
  rationale: 使役形态的בוא通常表示“带来、带到”。保留代词“她”，与上文孩子的母亲衔接。
- source_word: וַיְהִי לָהּ לְבֵן
  choice: 他便成了她的儿子
  rationale: 忠实表达经文所陈述的母子身份关系，同时不添加正式收养程序等原文未说明的细节。
- source_word: וַתִּקְרָא שְׁמוֹ מֹשֶׁה
  choice: 法老的女儿给他起名叫摩西
  rationale: 将希伯来语起名套语译成自然现代汉语；明确重复主语可避免连续多个“她”造成指代混乱。人名采用现代中文圣经通行译名“摩西”。
- source_word: מִן הַמַּיִם
  choice: 从水里
  rationale: מַיִם在希伯来语中形态为复数，但此处汉语自然表达是“水里”，无需机械译成复数。
- source_word: מְשִׁיתִהוּ
  choice: 我把他……拉了出来
  rationale: 该动词表示从水中拉出；“拉了出来”既清楚表达救出的动作，也便于脚注说明其与“摩西”在希伯来语中的语音联系。
theological_decisions:
- issue: וַיְהִי לָהּ לְבֵן所表达的关系性质
  choice: 他便成了她的儿子
  alternative: 他对她如同儿子；他作了她的儿子
  rationale: 原文以明确的亲子身份措辞叙述结果，可能指收养关系，但没有交代法律手续。因此正文保留较强的“成了她的儿子”，脚注提示希伯来语措辞也可较直译地表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“法老的女儿”在第二句再次明说，以消除“她”可能指孩子母亲还是法老女儿的歧义；这只澄清希伯来语动词主语，并未添加新人物或事件。脚注标记均放在相关正文之后。
