base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: zh_hans
  text: 她打开箱子，看见了他[a]——那个孩子。看哪，一个男孩正在哭。她怜悯他[b]，说：“这是希伯来人的一个孩子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文先用阳性单数后缀“他”，随后才明确说“那个孩子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“她很同情他。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: 她打开箱子
  rationale: 动词本身意为“打开”；宾语由上文的蒲草箱得出。中文补出“箱子”，使叙述自然清楚。
- source_word: וַתִּרְאֵהוּ אֶת הַיֶּלֶד
  choice: 看见了他[a]，就是那个孩子
  rationale: 保留希伯来文先用阳性单数后缀“他”、随后以“那个孩子”明确所指的特殊语序，避免抹平原文的指代结构。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 该提示词把读者的注意力鲜明地引向眼前所见；“看哪”保留其突显和惊讶效果。
- source_word: נַעַר
  choice: 一个男婴
  rationale: 该词可指男孩或青年，但此处所指是婴儿摩西；“男婴”既符合近景语境，也保留男性指称。
- source_word: בֹּכֶה
  choice: 正在哭
  rationale: 分词表达她看见他时持续进行的动作；“正在哭”自然体现进行状态。
- source_word: וַתַּחְמֹל עָלָיו
  choice: 她怜悯他
  rationale: חמל 与 עַל 在此表达怜惜、同情；“怜悯”保留情感力度，又不把后续的保全行动提前写入。
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: 这是希伯来人的孩子
  rationale: מן 结构表明这个孩子属于希伯来人的孩子之列。中文以“希伯来人的孩子”自然表达这一身份判断。
- source_word: הָעִבְרִים
  choice: 希伯来人
  rationale: 这是该族群称谓在现代汉语中的标准译法。
- source_word: זֶה
  choice: 这是
  rationale: 指示代词指向眼前的孩子；“这是”符合中文直接引语习惯。
theological_decisions: []
