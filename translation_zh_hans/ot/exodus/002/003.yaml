base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: zh_hans
  text: 可是，她再也藏不住他，就为他取了一个纸莎草箱[a]，在上面涂上沥青和焦油。她把孩子放在箱里，又把箱子放在尼罗河岸边的芦苇丛中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“纸莎草方舟”。这里的希伯来词תֵּבָה与《创世记》中指挪亚方舟的词是同一个词，形成借着水得救的文学呼应。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: 藏不住他
  rationale: צפן的使役式不定词加第三人称阳性单数后缀，意为“把他藏起来”。结合לֹא יָכְלָה עוֹד，译作“再也藏不住他”自然、简洁，并保留实际藏匿的动作。
- source_word: תֵּבַת
  choice: 箱
  rationale: תֵּבָה指可容纳并保护其中之物的箱状容器；此处按婴儿所用的小型容器译作“箱”，比“方舟”更符合即时语境，同时用脚注保留它与挪亚方舟的词语呼应。
- source_word: גֹּמֶא
  choice: 纸莎草
  rationale: גֹּמֶא特指纸莎草，而非一般芦苇；“纸莎草”准确体现材料及埃及背景。
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: 涂上沥青
  rationale: 动词在此表示涂抹或包覆，חֵמָר指天然沥青；“涂上沥青”准确且符合现代汉语表达。
- source_word: וּבַזָּפֶת
  choice: 和柏油
  rationale: זֶפֶת指用于密封防水的黏稠焦油或沥青类物质；译作“柏油”可与前面的חֵמָר有所区分，并保持原文并列的两种材料。
- source_word: הַיֶּלֶד
  choice: 孩子
  rationale: יֶלֶד可指孩子或男孩；上下文虽明确是男婴，但“孩子”既忠实于词义范围，也不额外强化年龄。
- source_word: בַּסּוּף
  choice: 芦苇丛中
  rationale: סוּף指河边的芦苇或水生植物；“芦苇丛中”自然表达容器被安置在植物之间。
- source_word: עַל שְׂפַת הַיְאֹר
  choice: 尼罗河岸边
  rationale: יְאֹר在出埃及记的埃及背景中通常指尼罗河；שָׂפָה用于水域时指岸或边缘，合译为“尼罗河岸边”。
- source_word: לֹא יָכְלָה עוֹד
  choice: 再也……不住
  rationale: 该结构表示能力达到极限而不能继续；汉语“再也藏不住”准确传达持续到此时已无法再做的含义。
- source_word: לּוֹ
  choice: 为他
  rationale: 保留原文的受益者与格代词，表明这个纸莎草箱是为孩子预备的。
theological_decisions:
- issue: תֵּבָה与创世记洪水叙事的互文联系
  choice: 正文按眼前器物译作“箱”，脚注说明也可译作“方舟”，并指出与挪亚方舟使用同一希伯来词。
  alternative: 正文直接译作“纸莎草方舟”。
  rationale: “箱”更符合现代汉语读者对婴儿容器的直观理解；但同一希伯来词仅见于挪亚和摩西相关叙事，这一借水得救的文学呼应具有解释价值，不应在翻译中消失，故以脚注保留，而不据此扩展成特定教义。
translation_notes:
  register: 采用现代、庄重而通俗的叙事语体。“纸莎草箱”兼顾材料的准确性和器物的可理解性；两次明说“箱”，使汉语指代清楚。脚注标记紧接其所说明的词语。
