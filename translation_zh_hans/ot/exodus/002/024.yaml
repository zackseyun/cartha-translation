base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: zh_hans
  text: 神听见了他们的呻吟[a]；神也记念他与亚伯拉罕、以撒和雅各所立的约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他们的哀声”。这个希伯来语名词可指人在压迫下发出的呻吟或哀号。
    reason: lexical_alternative
  - marker: b
    text: “记念”是立约语境中的用语，并不表示神曾经忘记，而是表明他信实地顾念自己的约。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见了
  rationale: שׁמע在此叙事形式中表示神听见以色列人在苦难中的声音；“听见”比“倾听”更直接，也不额外强调持续聆听的过程。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 该词虽在形式上为复数，却与单数动词搭配，在这里明确指以色列的独一神。
- source_word: נַאֲקָתָם
  choice: 他们的哀声
  rationale: נַאֲקָה指受压迫、受苦时发出的呻吟或哀号。“哀声”自然、凝练，既可涵盖呻吟，也保留痛苦呼声的意味。
- source_word: וַיִּזְכֹּר
  choice: 记念
  rationale: 保留זכר“记得、记念”的基本含义及其约的语境，不在正文中扩写为“采取行动”，以免把经文所暗示的后续行动直接译入。
- source_word: בְּרִיתוֹ
  choice: 他……所立的约
  rationale: בְּרִית是“约”的标准用语，三单阳性后缀表明这是神的约；中文以“他与……所立的约”自然表达其所属及关系。
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: 与亚伯拉罕、以撒和雅各
  rationale: 三个重复的宾格标记把三位先祖逐一与这约联系起来。中文列举三人即可清楚传达关系，避免机械重复“与”而造成生硬。
theological_decisions:
- issue: “神记念”所用的拟人化和立约语言
  choice: 正文保留“记念”
  alternative: 译作“神想起了他的约”或“神按照他的约采取行动”
  rationale: 原文采用普通的拟人化立约语言。“记念”在这里指向神忠于所立之约，并不必然暗示神先前遗忘；若直译成“采取行动”，便会把语境中的含义解释进正文，消解原文保留的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“哀声”兼顾受苦者的呻吟与呼号；“记念”和“约”保留经文核心的立约措辞。用一个“神”作主语并以“也”连接两个动作，符合现代汉语表达，同时没有改变两个希伯来叙事动词的顺序。
