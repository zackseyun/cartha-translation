base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: zh_hans
  text: 他向这边看看，又向那边看看，见没有人在场[a]，就打死了那个埃及人[b]，把他藏在沙中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“见没有一人。”这里也可能特指没有男人在场，但按语境可泛指现场没有任何人。
    reason: 保留אִישׁ的字面性别含义及其在此处可能具有的泛指用法。
  - marker: b
    text: 或译：“击打了那个埃及人。”原文动词的基本义是“击打”；本节藏匿身体的举动和下文表明这一击致人死亡。
    reason: 保留נכה的基本词义与语境所显示的致死结果之间的张力。
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: 他向这边看看，又向那边看看
  rationale: פנה与כֹּה וָכֹה连用，表示转向两边察看；此译自然呈现他环顾四周的动作。
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: 见没有人在场
  rationale: אִישׁ字面指“人、男人”，但אֵין אִישׁ在这里可泛指现场没有任何人；“没有人在场”符合现代汉语，也保留无人目击这一语境含义。
- source_word: וַיַּךְ
  choice: 打死了
  rationale: נכה基本义为“击打”，在本语境中，随后藏匿其身体以及下文对事件的表述表明这一击致死；“打死”以通顺现代汉语表达语境中的结果，同时用脚注保留较贴近基本词义的译法。
- source_word: הַמִּצְרִי
  choice: 那个埃及人
  rationale: 定冠词所指的是上文提到的埃及人；汉语用“那个”自然承接已知人物。
- source_word: וַיִּטְמְנֵהוּ
  choice: 把他藏
  rationale: טמן意为“隐藏、藏匿”；虽是在沙中掩埋身体，但原词着重于隐藏，故不直接译作“埋葬”。
- source_word: בַּחוֹל
  choice: 在沙里
  rationale: חוֹל意为“沙”；“藏在沙里”是简洁自然的现代汉语表达。
theological_decisions: []
