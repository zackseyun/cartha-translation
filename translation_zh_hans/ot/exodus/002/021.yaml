  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: zh_hans
  text: 摩西同意与那人同住[a]；那人就把他的女儿西坡拉给了摩西[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“摩西愿意与那人同住。”希伯来语动词可表示愿意、同意或乐意。
    reason: lexical_alternative
  - marker: b
    text: 意思是，那人把西坡拉嫁给摩西。
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: 答应
  rationale: 该动词在此表示愿意或同意做某事。“答应”符合现代汉语表达，并保留其同意之意；“愿意”这一可能含义列入脚注。
- source_word: לָשֶׁבֶת
  choice: 住在一起
  rationale: ישׁב在此不是单指“坐”，而是指居住；结合אֶת הָאִישׁ，译作“和这人住在一起”自然清楚。
- source_word: הָאִישׁ
  choice: 这人
  rationale: 原文使用普通名词“那人／这人”，在上下文中指前述米甸祭司；正文不以专名替代原文措辞。
- source_word: וַיִּתֵּן
  choice: 给了
  rationale: נתן直译为“给”；婚姻含义由语境表明，正文不把隐含信息直接扩写为“嫁给”。
- source_word: צִפֹּרָה
  choice: 西坡拉
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: בִּתּוֹ
  choice: 女儿
  rationale: 第三人称单数所属关系在汉语句式“把女儿……给了”中已由主语“这人”自然表达，无须重复“他的”。
- source_word: לְמֹשֶׁה
  choice: 给了摩西
  rationale: 介词לְ标明接受者；译文直接保留“给摩西”的结构，不在正文中补入“作妻子”。
