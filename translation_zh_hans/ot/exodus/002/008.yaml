base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/008.yaml
  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: zh_hans
  text: 法老的女儿对她说：“去吧。”那少女就去叫了孩子的母亲。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: 法老的女儿
  rationale: 忠实表达希伯来语的属格结构，且符合现代汉语的自然说法。
- source_word: לֵכִי
  choice: 去吧
  rationale: 这是对女性单数对象所说的简短命令；“去吧”自然传达命令语气，同时避免汉语中单说“去”的生硬感。
- source_word: הָעַלְמָה
  choice: 那少女
  rationale: עַלְמָה指年轻女子；上下文中是摩西的姐姐。“少女”简洁、庄重，也不额外断定其具体年龄或婚姻状况。
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: 就去叫了孩子的母亲
  rationale: קרא在这里表示叫来或召来某人；“叫了”贴近叙事的直接表达，“就”自然体现连续动作。
- source_word: הַיָּלֶד
  choice: 孩子
  rationale: יֶלֶד可指孩子或男孩；此处虽是婴儿摩西，但译作“孩子”保留原词的一般性，并符合上下文。
