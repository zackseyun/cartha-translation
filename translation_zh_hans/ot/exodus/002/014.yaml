base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: zh_hans
  text: 那人说：“谁立你作我们的首领和审判官？你是说[a]，要像杀那个埃及人一样杀我吗？”摩西害怕，说：“这事果然已经传开了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你想要像杀那个埃及人一样杀我吗？”
    reason: 原文“你是说要杀我”的结构也可理解为询问摩西是否意图杀人。
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: 谁立你
  rationale: שׂים在此表示设立或任命；“谁立你”自然地保留了对摩西权柄来源的质问。
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: 作……首领和审判官
  rationale: אִישׁ在此与后面的职分语形成同位表达，汉语不必机械译作“一个人”；שַׂר表示掌权的首领，שֹׁפֵט表示施行判断者。
- source_word: עָלֵינוּ
  choice: 我们的
  rationale: 原意是“在我们之上”，表达对说话者一方拥有权柄；汉语“我们的首领和审判官”自然传达这一关系。
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: 你是说：‘你要杀我……吗？’
  rationale: 尽量保留אֹמֵר“说”的字面成分以及原句不寻常的问句结构；也可能是“你想要杀我吗”。
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: 像杀那个埃及人一样
  rationale: 忠实表达比较关系；定冠词所指的是前文那名特定的埃及人，因此译作“那个埃及人”。
- source_word: וַיִּירָא מֹשֶׁה
  choice: 摩西就害怕
  rationale: 直接表达叙事动词所描述的恐惧反应。
- source_word: וַיֹּאמַר
  choice: 心里说
  rationale: 此处未明确指出听者，语境表明这是摩西因害怕而产生的自语或内心判断；“心里说”符合现代汉语叙事习惯，但略带解释性。
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: 这事果然已经传开了
  rationale: אָכֵן表达确认或推断；ידע的尼法勒式表示事情已为人所知。“传开了”比“被知道了”更自然，并切合秘密泄露的语境。
theological_decisions:
- issue: לְאִישׁ中阳性名词אִישׁ的处理
  choice: 不单独译出“一个男人”
  alternative: 谁立你这个男人作我们的首领和审判官
  rationale: 这里אִישׁ用于同位式职分表达，重点在“首领和审判官”，并非强调摩西的性别；汉语若逐词加上“男人”会生硬且可能误导。
- issue: אֹמֵר的语义张力
  choice: 保留为“你是说”
  alternative: 你想要杀我吗
  rationale: 原文明确使用“说”，但这一结构也可表达意图。正文保留其字面张力，脚注列出自然的意图性理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“首领和审判官”保留政治与司法两重职分；“果然已经传开了”自然表达摩西意识到事情已经败露。
