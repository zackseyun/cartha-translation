  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: zh_hans
  text: 他对女儿们说：“那他在哪里？你们怎么把那个人撇下了？叫他来吃饭吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: 那他在哪里？
  rationale: 疑问词意为“他在哪里”，前接的 וְ 在语境中承接女儿们的叙述，并带出叶忒罗追问的语气，译作“那”。
- source_word: עֲזַבְתֶּן אֶת־הָאִישׁ
  choice: 你们为什么把那人留在那里？
  rationale: עָזַב 可表示“离开、留下”；此处指女儿们没有把帮助她们的人带回来。“留在那里”以自然中文表达其语境含义，同时不额外说明具体地点。
- source_word: קִרְאֶן לוֹ
  choice: 去请他来
  rationale: קרא ל 在此是“召来、邀请”的意思；“请他来”符合待客语境，句首“去”体现阴性复数命令式所要求的行动。
- source_word: וְיֹאכַל לָחֶם
  choice: 来吃饭
  rationale: 字面为“让他吃饼/食物”；לֶחֶם 可泛指食物或一顿饭，现代汉语以“吃饭”最自然，并保留邀请款待之意。
