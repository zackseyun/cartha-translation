base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: zh_hans
  text: 她们回到父亲流珥那里，父亲问：“你们今天怎么这么快就回来了[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“你们今天为什么赶着来？”希伯来语用“赶快”与“来”两个词表达。
    reason: 说明原文“赶快＋来”的词语组合，并保留较形式对应的译法。
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: 她们回到
  rationale: 这是בוא的第三人称阴性复数叙事形式，主语是流珥的女儿们；结合她们从井边回家的语境，译作“回到”自然地表达移动方向。
- source_word: אֶל רְעוּאֵל אֲבִיהֶן
  choice: 父亲流珥那里
  rationale: אֶל表示朝向，רְעוּאֵל音译为“流珥”，אֲבִיהֶן直译为“她们的父亲”；现代汉语用“回到父亲流珥那里”清楚自然。
- source_word: וַיֹּאמֶר
  choice: 父亲问
  rationale: אמר本义为“说”，但其后是直接问句，汉语译作“问”更符合自然叙事；重复“父亲”可避免代词指向含混。
- source_word: מַדּוּעַ
  choice: 怎么
  rationale: 该疑问词询问原因；在带有惊讶意味的日常问句中，“怎么”比“为什么”更自然，同时仍保留询问缘由的功能。
- source_word: מִהַרְתֶּן בֹּא
  choice: 这么快就回来了
  rationale: מִהַרְתֶּן是“赶快、迅速行事”，בֹּא是不定式“来”；合起来按现代汉语习惯译为“这么快就回来了”，既表达速度，也符合回到父亲身边的语境。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 带定冠词的“这日”在此作时间副词，通常意为“今天”。
