  yaml_path: translation/ot/exodus/002/004.yaml
  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: zh_hans
  text: 他的姐姐站在远处[a]，想知道他会怎样被对待[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“远远地”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“想知道他会有什么遭遇。”希伯来文较直译为“想知道将会对他做什么”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: 站
  rationale: 此处是יצב的Hitpael叙事形式，表示采取并保持站立的位置；“站”自然简洁，也符合上下文。
- source_word: אֲחֹתוֹ
  choice: 他姐姐
  rationale: 该词为“姐妹”带第三人称阳性单数后缀；结合上下文，现代汉语用“他姐姐”比“他的姐妹”更自然。
- source_word: מֵרָחֹק
  choice: 在远处
  rationale: 表示空间上的距离；“在远处”准确、自然，并保留她没有靠近观看的场景。
- source_word: לְדֵעָה
  choice: 想知道
  rationale: ידע的不定式前有ל，表示目的；“想知道”在现代汉语中自然表达她站在远处的目的。
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: 他会有什么遭遇
  rationale: 希伯来文直译为“会有什么被做在他身上/会被怎样处置”。“他会有什么遭遇”以自然汉语表达未确定的结果，同时由脚注保留原文的被动形式。
theological_decisions:
- issue: מַה יֵּעָשֶׂה לוֹ中施事者未说明，且ל可按语境理解为“对他”或“为他”
  choice: 正文译为“他会有什么遭遇”，不补出施事者
  alternative: “他会被怎样处置”或“别人会怎样对待他”
  rationale: 原文使用无人称的被动表达，没有指明谁将采取行动；正文避免擅自补出“别人”，也不把结果限定为负面的“处置”，从而保留婴孩命运未定的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“在远处”简洁呈现场景；“有什么遭遇”比生硬的逐字被动句更符合现代汉语，同时借脚注交代原文形式及另一种译法。
