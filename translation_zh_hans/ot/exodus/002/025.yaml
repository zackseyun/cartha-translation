base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/025.yaml
  text: God saw the sons of Israel, and God knew.
translation:
  language: zh_hans
  text: 神看见以色列人，神也知道。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的众子”，在此指以色列民族；现代汉语用“以色列人”自然准确，也不误限于男性。
- source_word: וַיַּרְא
  choice: 看见
  rationale: 保留 ראה 的基本视觉动词意义，并与上文神听见、记念相呼应。
- source_word: וַיֵּדַע
  choice: 知道了
  rationale: 保留 ידע 的简洁与语义张力，不擅自补明为“关注”“眷顾”或“了解他们的苦情”；句末“了”使叙事推进在现代汉语中更自然。
theological_decisions:
- issue: “神知道”的宾语与具体含义均未明说
  choice: 也知道了
  alternative: 也关注他们／也知道他们的苦情
  rationale: 希伯来文末句没有明示宾语，含义凝练而开放；译文保留这一省略，避免把神的“知道”单一定义为留意、认可或采取行动。
- issue: 是否因神此前已经全知而弱化叙事中的“知道”
  choice: 保留事件性表达“知道了”
  alternative: 神素来知道／神留意到了
  rationale: 原文以连续叙事动词呈现神的回应。汉语“了”表达叙事进展，并不必然表示神此前无知。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。重复“神”以对应原文的强调结构，不合并为单一主语；全句保留原文突然而含蓄的收束效果。
