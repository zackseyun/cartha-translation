base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: zh_hans
  text: 法老的女儿对她说：“把这孩子带去，替我给他喂奶，我会付给你工钱。”那妇人就把孩子带去，给他喂奶。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: 法老的女儿
  rationale: 按原文的领属结构直译，清楚自然地表明说话者的身份。
- source_word: הֵילִיכִי
  choice: 带去
  rationale: 这是הלך的使役命令式，在本语境中指把孩子带走照料；“带去”既体现移动方向，也符合现代汉语表达。
- source_word: הַיֶּלֶד הַזֶּה
  choice: 这孩子
  rationale: יֶלֶד可指孩子或男孩；上下文已清楚其性别，这里保留原词较宽泛的称呼。
- source_word: וְהֵינִקִהוּ לִי
  choice: 替我奶养他
  rationale: ינק的使役形式在此指给婴儿喂奶、乳养；“奶养”准确表达哺乳并兼顾庄重和简明，“替我”保留לִי所表达的受托关系。
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: 我会付给你工钱
  rationale: שָׂכָר指劳务所得的报酬；“付给你工钱”是自然的现代汉语，也明确呈现雇佣报酬之意。
- source_word: הָאִשָּׁה
  choice: 那妇人
  rationale: 原文只称她为“那女人/妇人”，没有在本节明说“母亲”；译文不依据上下文替原文增添身份称谓。
- source_word: וַתְּנִיקֵהוּ
  choice: 奶养他
  rationale: 与前面的同根动词一致，表示妇人实际给孩子哺乳、乳养；重复“奶养”保留原文的词汇呼应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“奶养”比单说“喂奶”略宽，可涵盖持续哺乳照养，也避免现代汉语中“护理”可能引起的职业护理歧义。原文此处没有需要脚注才能保留的实质歧义，因此不设脚注。
