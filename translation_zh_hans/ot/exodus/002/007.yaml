  to: 他的姐姐对法老的女儿说：“要不要我去从希伯来妇女中给你找一位乳母来，让她替你给这孩子喂奶？”
  rationale: 修订只改善现代汉语的句法和用词精确度：以“乳母”对应能哺乳的妇女，以“替你给这孩子喂奶”明确哺乳动作及受益者关系。保留原文未明说名字的“他的姐姐”，也保留提议式问句和“这孩子”的现场指称。
