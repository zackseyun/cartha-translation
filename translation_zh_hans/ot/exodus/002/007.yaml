  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: zh_hans
  text: 他的姐姐对法老的女儿说：“要不要我去从希伯来妇女中给你找一位乳母来，让她替你给这孩子喂奶？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 说
  rationale: 连词与未完成式的叙事形式推进情节；中文按自然叙事承接，无须机械译出“然后”。
- source_word: אֲחֹתוֹ
  choice: 他的姐姐
  rationale: 第三人称阳性单数后缀在上下文中指这婴孩；保留原文代词表达，不直接补作“摩西的姐姐”。
- source_word: בַּת פַּרְעֹה
  choice: 法老的女儿
  rationale: 自然、准确地表达希伯来语附属结构。
- source_word: הַאֵלֵךְ וְקָרָאתִי
  choice: 要不要我去……给你叫……来
  rationale: 疑问词加第一人称未完成式表达主动提议；“要不要我去”符合现代汉语礼貌提议的语气，“叫……来”传达召来某人的意思。
- source_word: אִשָּׁה מֵינֶקֶת
  choice: 奶妈
  rationale: 此短语直指能够给婴儿哺乳的妇女；“奶妈”是现代中文简明自然、且符合场景的对应词。
- source_word: מִן הָעִבְרִיֹּת
  choice: 从希伯来妇女中
  rationale: 明确表达介词所标示的群体来源。
- source_word: וְתֵינִק לָךְ
  choice: 替你乳养
  rationale: 使役形在此意为给婴孩喂奶；“替你”保留重复出现的受益者表达，“乳养”既含哺乳之义，也保持庄重语体。
- source_word: הַיָּלֶד
  choice: 这孩子
  rationale: ילד在此指眼前的婴孩；“这孩子”符合中文指示语境，又不比原词更具体地限定为“男婴”。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事用语。译文保留姐姐身份及两次“给你/替你”的受益者关系，同时用“奶妈”自然表达哺乳妇女。英文咨询层的脚注似乎错置：其所谓另一译法对应的是“nursing woman”，而不是“Pharaoh’s daughter”，因此中文不沿用该脚注。
