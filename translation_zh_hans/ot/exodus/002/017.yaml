base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: zh_hans
  text: 这时，牧人们来了，把她们赶走。摩西却起来搭救[a]她们，又给她们的羊群饮水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“救了”。原文动词可表示拯救、解救；这里指摩西从牧人的欺压中救下这些女子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 这时……来了
  rationale: 未完成式连续体推动叙事向前；“这时”在现代汉语中自然表达事件接续，而不机械重复“于是”。
- source_word: הָרֹעִים
  choice: 牧人们
  rationale: רעה 的分词在此作名词，指照管牲畜的人；上下文涉及羊群和饮水，“牧人”准确自然。
- source_word: וַיְגָרְשׁוּם
  choice: 把她们赶走
  rationale: גרש 表示赶出、驱逐；此处指牧人以敌对方式赶走祭司的女儿们。“赶走”保留了动作的强制意味。
- source_word: וַיָּקָם
  choice: 起来
  rationale: קום 在此既描写摩西起身，也引出他采取行动；“起来”简洁保留原文动作。
- source_word: וַיּוֹשִׁעָן
  choice: 搭救她们
  rationale: ישׁע 的使役式表示拯救、解救。此处是从牧人的欺压中救下她们；“搭救”既保留较强的救援含义，也不过度暗示她们面临死亡。
- source_word: וַיַּשְׁקְ
  choice: 给……饮水
  rationale: שקה 表示使人或牲畜喝水、给其饮水；“给羊群饮水”是自然且准确的现代汉语表达。
- source_word: צֹאנָם
  choice: 她们的羊群
  rationale: צאן 是集合名词，可包括绵羊和山羊；“羊群”保留集合意义，又不把范围限定为单一羊种。依叙事焦点，所属关系自然译作“她们的”。
theological_decisions:
- issue: וַיּוֹשִׁעָן 的救援力度
  choice: 搭救她们
  alternative: 帮助她们；拯救她们
  rationale: 原词属于“拯救、解救”的语义范围，不能弱化为一般性的“帮助”；但本节语境明确是从牧人的驱赶和欺压中救出，因此“搭救”比可能让现代读者联想到终极或属灵救恩的“拯救”更贴合场景，同时不消除救援意味。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“却”呈现摩西与牧人行为之间的转折。“她们”明确承接上文祭司的女儿们。脚注标在“搭救”之后，因为其所说明的是 וַיּוֹשִׁעָן，而不是前面的“赶走”。
