  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: zh_hans
  text: 有一个出自利未家的人去娶了一个利未女子为妻[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“利未的女儿”，指利未的一名女性后裔。
    reason: 词义替代译法
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 去
  rationale: הלך在此叙事性连续形式中通常表示“去”。保留这个动作，不另加原文没有的时间标记。
- source_word: אִישׁ
  choice: 一个人
  rationale: אִישׁ指一名男子；中文结合“娶”已自然表明其为男性，同时保留人物起初未具名的叙事效果。
- source_word: מִבֵּית לֵוִי
  choice: 利未家的人
  rationale: בֵּית לֵוִי是带有宗族、谱系意味的表达。“利未家”既贴近原文，也比“利未支派”更准确地保留“家”的意象。
- source_word: וַיִּקַּח
  choice: 娶了
  rationale: לקח字面义为“取、带走”，在此婚姻语境中表示娶妻。现代汉语若直译“取了”容易误解，因此用自然且明确的“娶了”。
- source_word: אֶת
  choice: 不另译（直接宾语标记）
  rationale: אֶת只标示确定的直接宾语，现代汉语无需用独立词语对应。
- source_word: בַּת לֵוִי
  choice: 一个利未的女儿
  rationale: 原文直译为“利未的女儿”，是指利未的一名女性后裔。正文保留其谱系表达以及与“利未家”的呼应，脚注提供较自然的替代译法。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的叙事语言。“去娶了”既保留原文“去”的动作次序，也以现代汉语自然表达婚姻语境；正文保留“利未的女儿”这一具有谱系色彩的原文措辞，并用脚注防止读者误解为利未本人的亲生女儿。
