base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: zh_hans
  text: 那女人怀孕，生了一个儿子。她看这孩子很好[a]，就把他藏了三个月。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“俊美的”。希伯来文直译为“好”，在这里也可有美好、可喜或俊美的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: 怀孕
  rationale: הרה表示怀孕或受孕；“怀孕”是现代汉语中自然、清楚的表达，并保留叙事中的事件顺序。
- source_word: הָאִשָּׁה
  choice: 那女人
  rationale: 原文明确说“那女人”，本节没有使用“妻子”；采用“那女人”既承接上下文，也不增添原文此处未明说的关系称谓。
- source_word: וַתֵּלֶד בֵּן
  choice: 生了一个儿子
  rationale: ילד与בֵּן构成常见的生育表达；“生了一个儿子”符合自然的现代汉语叙事。
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: 她见他是好的
  rationale: 保留“看见/见”与判断从句的结构，表达母亲看到孩子并认定他为好；措辞略带庄重感，同时在现代汉语中仍然明白。
- source_word: טוֹב
  choice: 好
  rationale: טוֹב的基本义是“好”，也可依语境表示美好、俊美或可喜。正文采用“好”以保留其宽泛含义及其与《创世记》用语可能形成的呼应；“俊美”列入脚注。
- source_word: וַתִּצְפְּנֵהוּ
  choice: 就把他藏了
  rationale: צפן意为隐藏、藏匿；“把他藏了”直接自然。“就”体现前后叙事推进，但不把因果关系说得过强。
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: 三个月
  rationale: יֶרַח指月或月份；普通叙事中译作“三个月”准确自然，无须技术性地说明阴历月。
theological_decisions:
- issue: 婴孩被描述为טוֹב
  choice: 好的
  alternative: 俊美的；美好的
  rationale: “好”最贴近该词宽泛的基本义，也保留与较早经文、尤其创造叙事措辞之间可能存在的文学呼应。译作“俊美”会明确限定为外貌判断；这一传统且有根据的理解在脚注中保留，不在正文中排除。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那女人”忠实保留原文指称；“她见他是好的”有意保留טוֹב的语义张力，不以较顺口但更具体的“长得俊美”取代。脚注标记[a]已置于正文相应词后。
