base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: zh_hans
  text: 她们说：“有一个埃及人把我们从牧人的手中救了出来[a]，还特意为我们打水，又给牲畜群喝水。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从牧人的手中”也可译作“脱离牧人的势力”；希伯来语直译为“从牧人的手中”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语在“打水”一词上使用加强结构，直译近似“他确实为我们打了水”，强调打水这一行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: 她们说
  rationale: 这是אמר的第三人称阴性复数叙事式，主语是前文的众女儿；汉语不必另译连接词。
- source_word: אִישׁ מִצְרִי
  choice: 有一个埃及人
  rationale: אִישׁ受מִצְרִי限定，指一名埃及男子；现代汉语以“一个埃及人”自然表达，性别由上下文及称谓可知。
- source_word: הִצִּילָנוּ
  choice: 把我们……救了出来
  rationale: נצל的使役式表示从危险或控制中搭救；“救了出来”符合眼前遭牧人欺压的具体情境。
- source_word: מִיַּד
  choice: 从……的手中
  rationale: 保留希伯来语“从手中”的意象，同时现代汉语也自然地用它表示脱离他人的权势或控制。
- source_word: הָרֹעִים
  choice: 牧人
  rationale: רעה在此指看管牲畜并赶走众女子的人；“牧人”直接且不限定所牧牲畜的种类。
- source_word: וְגַם
  choice: 还
  rationale: 表示这人不仅搭救她们，更进一步替她们打水；“还”自然传达递进意味。
- source_word: דָּלֹה דָלָה
  choice: 亲自……打水
  rationale: 不定词绝对式与限定动词连用，加强打水这一行动；“亲自”在汉语中自然呈现他实际为她们做了这事的强调，但具体强化方式另以脚注说明。
- source_word: לָנוּ
  choice: 为我们
  rationale: 与格代词表示这项行动是为众女子的益处而做。
- source_word: וַיַּשְׁקְ
  choice: 给……喝
  rationale: שקה的使役式意为使牲畜饮水；“给羊群喝”是清楚自然的现代汉语。
- source_word: אֶת־הַצֹּאן
  choice: 羊群
  rationale: צאן是绵羊、山羊等小型家畜的集合称呼；“羊群”在此简洁自然，又不必硬分具体种类。
