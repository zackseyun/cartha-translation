base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: zh_hans
  text: 那些日子，摩西长大成人后，他出去，到他弟兄[a]那里去，看见他们所受的重担。他又看见一个埃及人正在殴打一个希伯来人，就是他的一个弟兄。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”也可译作“同族的人”或“同胞”。希伯来文在本节两次使用亲属称谓，表达摩西与希伯来人的认同和连带。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 以自然的现代汉语表达希伯来叙事中的时间转换公式，不添加原文没有的“如今”，也避免古雅的“事情发生在”。
- source_word: וַיִּגְדַּל
  choice: 长大成人后
  rationale: 此处指摩西已经成年，而非地位变得尊贵；“后”自然交代他成年与随后外出之间的时序。
- source_word: אֶל אֶחָיו
  choice: 到他的弟兄那里
  rationale: 保留原文的亲属称谓及摩西与希伯来人的认同关系；脚注说明“同族的人”“同胞”等语境性译法。
- source_word: בְּסִבְלֹתָם
  choice: 他们所受的重担
  rationale: 保留“重担、负重”的具体意象，同时在上下文中可自然指向受压迫的劳役，而不把含义限定为某一种苦工。
- source_word: אִישׁ מִצְרִי
  choice: 一个埃及人
  rationale: 现代汉语以“埃及人”已能自然表达 איש מִצְרִי，无须机械补出“男人”。
- source_word: מַכֶּה
  choice: 正在殴打
  rationale: 分词表示进行中的身体攻击；“殴打”比“打”更清楚地传达暴力行为，又不额外规定具体方式。
- source_word: אִישׁ עִבְרִי
  choice: 一个希伯来人
  rationale: 自然表达其族群身份；与前面的“一个埃及人”形成对应。
- source_word: מֵאֶחָיו
  choice: 就是他的一个弟兄
  rationale: 保留与前文 אֶחָיו 的词汇呼应，突出这个希伯来人与摩西之间的同族亲属关系。
theological_decisions:
- issue: אֶחָיו / מֵאֶחָיו 的亲属语言如何处理
  choice: 弟兄
  alternative: 同族的人；同胞
  rationale: 原文以阳性复数亲属称谓表达摩西与希伯来人的连带和认同。正文保留“弟兄”，不把这种修辞关系默默化约为一般族群称呼；脚注提供更明确的语境性译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那些日子”简洁承接上下文；“长大成人后”明确成年之意。“弟兄”保留原文的亲属意象，并以脚注防止读者误以为仅指亲生兄弟。
