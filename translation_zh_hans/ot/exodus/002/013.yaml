  text: וַ/יֵּצֵא֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וְ/הִנֵּ֛ה שְׁנֵֽי אֲנָשִׁ֥ים עִבְרִ֖ים נִצִּ֑ים וַ/יֹּ֨אמֶר֙ לָֽ/רָשָׁ֔ע לָ֥/מָּה תַכֶּ֖ה רֵעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: zh_hans
  text: 第二天[a]，他出去，看见两个希伯来人在打架，就对那有错的人[b]说：“你为什么打你的同伴？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第二天”直译“第二日”。
    reason: literal_rendering
  - marker: b
    text: 或译“那恶人”或“那作恶的人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 他出去
  rationale: 这是 יצא 的 Qal 叙事形式，表示动作顺次发生；主语“他”由上文的摩西承接而来。
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: 第二天
  rationale: 字面为“第二日”；在现代汉语叙事中，“第二天”自然、准确地表达相对于前一天的时间。
- source_word: וְהִנֵּה
  choice: 看见
  rationale: הִנֵּה 在这里引出摩西突然注意到的情景。译作“看见”把这种现场发现的作用自然融入汉语句子，避免使用较古雅的“看哪”。
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: 两个希伯来人
  rationale: 原文明确表示两名男性希伯来人；现代汉语中的“两个希伯来人”在此语境已自然包含人物性别，无须生硬增添“男人”。
- source_word: נִצִּים
  choice: 在打架
  rationale: 该分词描写正在发生的冲突；下文提到其中一人击打另一人，因此“打架”比仅指口头争执的“争吵”更贴合语境。
- source_word: לָרָשָׁע
  choice: 那有错的人
  rationale: רָשָׁע 可指邪恶者，也可指具体争端中理亏、有罪或做错的一方。这里摩西是在判定冲突中的施打者有错，译文保留这种情境性的道德判断，脚注列出较强的词义。
- source_word: לָמָּה תַכֶּה
  choice: 你为什么打
  rationale: 未完成式在直接问话中指向正在发生或眼前可见的击打行为；汉语用“为什么打”简洁自然。
- source_word: רֵעֶךָ
  choice: 你的同伴
  rationale: רֵעַ 可指同伴、同胞、邻舍或他人；在两个希伯来人彼此冲突的场景中，“同伴”既自然，又不预先限定为法律意义上的“邻舍”。
theological_decisions:
- issue: רָשָׁע 是描述固定品格，还是判定争端中有错的一方
  choice: 那有错的人
  alternative: 那恶人／那作恶的人
  rationale: 上下文清楚表明摩西责问施打者，却未必是在对其整个人格作全面定论；采用情境性译法，同时以脚注保存较强的传统词义，避免消解原词的道德分量。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看见”承载 הִנֵּה 的现场呈现功能；整体按汉语叙事习惯连接分句，避免不必要的古雅措辞，同时保留原文对冲突中责任归属的张力。
