base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: zh_hans
  text: 过了许多年，埃及王死了。[a]以色列人因所受的奴役而呻吟并呼喊；他们因所受的奴役发出的呼救声，上达于上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “过了许多年”也可译作“在那漫长的岁月中”。
    reason: 原文时间短语直译为“在那些漫长的日子里”，既可描述这段时期，也可在上下文中理解为多年以后。
lexical_decisions:
- source_word: וַיְהִי בַיָּמִים הָרַבִּים הָהֵם
  choice: 过了许多年
  rationale: 该短语直译可作“在那些漫长的日子里”，表示一段很长的时期。现代汉语用“过了许多年”自然地衔接叙事，但时间关系也可理解为“在那漫长的岁月中”，故加脚注保留歧义。
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: 埃及王死了
  rationale: 直接保留原文的主语和叙事陈述，表达简洁自然。
- source_word: וַיֵּאָנְחוּ
  choice: 叹息
  rationale: 该动词描述人在痛苦压迫下发出的呻吟或叹息；“叹息”庄重自然，并能传达苦楚。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是指以色列全体百姓的固定族群称谓。现代汉语“以色列人”比逐字的“以色列的儿子们”更自然，也不会误导为只包括男性。
- source_word: מִן הָעֲבֹדָה
  choice: 因所受的奴役
  rationale: עֲבֹדָה 可指劳役、服役或奴役；本段语境是埃及强加的压迫性苦工。“所受的奴役”兼顾其强制劳动与受奴役的处境，并在两处重复以保存原文的强调。
- source_word: וַיִּזְעָקוּ
  choice: 哀求
  rationale: 该动词表示因急难而大声呼喊。此处没有明说呼求对象；“哀求”传达求助意味，同时不补出对象。
- source_word: וַתַּעַל שַׁוְעָתָם אֶל הָאֱלֹהִים
  choice: 他们……发出的呼救声，上达于上帝
  rationale: “呼救声”反映 שַׁוְעָה 的求助含义；“上达”保留原文“上去”的垂直意象，并明确其到达上帝。
theological_decisions:
- issue: עֲבֹדָה 在以色列受压迫语境中的含义
  choice: 奴役
  alternative: 劳役／苦工／服役
  rationale: 上下文描述埃及对以色列人的强制压迫。“奴役”准确呈现其社会处境，不把它弱化为普通劳动；同时以“所受的奴役”保留被迫承受的意味。
- issue: בְּנֵי יִשְׂרָאֵל 的集体指称
  choice: 以色列人
  alternative: 以色列的儿子们／以色列子孙
  rationale: 该希伯来语惯用语在这里集体指以色列百姓，并非仅限男性。“以色列人”是现代汉语中准确、清楚且自然的族群称谓。
- issue: 呼求是否明确以神为直接对象
  choice: 不在“哀求”后补出对象，但译明呼救声上达于上帝
  alternative: 他们向上帝呼求
  rationale: 原文在 וַיִּזְעָקוּ 后没有明示对象，随后才说呼救声上达于上帝。译文维持这一叙事次序，避免把隐含关系改写成显式陈述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上帝”对应 הָאֱלֹהִים；“上达”略具书面色彩，用来保留原文呼救声“上去”的意象。句中重复“因所受的奴役”，保存希伯来文首尾呼应的强调。
