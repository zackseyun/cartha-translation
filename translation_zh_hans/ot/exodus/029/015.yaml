  text: וְ/אֶת הָ/אַ֥יִל הָ/אֶחָ֖ד תִּקָּ֑ח וְ/סָ֨מְכ֜וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/015.yaml
  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: zh_hans
  text: “你要取那一只公绵羊[a]；亚伦和他的儿子们要把手按在公绵羊的头上。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“那一只公绵羊”，是要把这只与承接圣职礼仪中的另一只公绵羊区别开来；有些译本译作“第一只公绵羊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: 你要
  rationale: 连词与宾语标记引出礼仪程序的下一步；现代汉语以承接性的指令句自然表达，无须机械译出“然后”。
- source_word: הָ/אַיִל
  choice: 公绵羊
  rationale: אַיִל指成年的雄性绵羊；“公绵羊”准确、通俗，也适合祭祀语境。
- source_word: הָ/אֶחָד
  choice: 那一只
  rationale: 原文直译为“那一只”，用于把这只公绵羊与仪式中的另一只区别开来，同时不直接解释为序数“第一只”。
- source_word: תִּקָּח
  choice: 你要取
  rationale: 第二人称阳性单数未完成式在指令语境中表达规定；“你要取”保留对摩西的直接吩咐及规范语气。
- source_word: וְ/סָמְכוּ
  choice: 要把手按在
  rationale: סמך在献祭礼仪中指将手放在或按在祭牲上；“按在”既自然，也保留可能带有施力意味的动作。
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: 亚伦和他的儿子们
  rationale: 此处指亚伦参与承接圣职的男性后代；“儿子们”在性别与上下文上都准确。
- source_word: אֶת יְדֵי/הֶם
  choice: 把手
  rationale: 原文为复数“他们的手”；汉语由复数主语自然表达多人各自按手，不译作“双手”，以免增加每人使用两只手的含义。
- source_word: עַל רֹאשׁ
  choice: 按在……的头上
  rationale: 准确表达动作所及的位置，符合现代汉语习惯。
- source_word: הָ/אָיִל
  choice: 公绵羊
  rationale: 重复名词以保持指代清楚，并与本节前半句一致。
theological_decisions:
- issue: 献祭承接圣职礼仪中的按手动作
  choice: 要把手按在公绵羊的头上
  alternative: 要把手放在公绵羊的头上；要把手压在公绵羊的头上
  rationale: 原文动词可含放置、倚靠或按压之意；“按在”能表达礼仪动作，并略微保留施力的可能性，却不加入本节未明说的代替、归属或罪责转移等神学解释。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪指令语体。“那一只”保留原文措辞及其指别功能；分号清楚连接摩西取羊与亚伦父子按手两个连续动作。
