base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: zh_hans
  text: 我要把会幕和祭坛分别为圣[a]；也要把亚伦和他的儿子们分别为圣，使他们作祭司侍奉我[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “分别为圣”也可译作“使……成为圣洁”；本节两处动词相同。
    reason: lexical_alternative
  - marker: b
    text: 原文直译可作“使他们为我担任祭司职分”或“使他们向我供祭司的职分”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: 我要使……成为圣洁／也要使……成为圣洁
  rationale: קדשׁ 的皮埃勒词干表示使某人或某物成为圣洁、分别归于神。译作“使……成为圣洁”既保留核心的圣洁含义，也适合本节礼仪性的语境；两处重复用同一表达，以反映原文的重复。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 该固定用语指神与以色列人相会的帐幕。“会幕”是现代中文圣经语境中自然、清楚且通行的名称。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 准确表达献祭所用的坛，是自然且通行的礼仪用语。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文中通行的圣经人名音译。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: 原文明确为复数“儿子”，且语境指亚伦担任祭司的男性后代，因此不泛化为“儿女”或“子孙”。
- source_word: לְכַהֵן לִי
  choice: 使他们作祭司侍奉我
  rationale: כהן 的不定式表达担任祭司、履行祭司职分；לִי 表明这服侍归向神。此译文自然地保留“作祭司”和“侍奉我”两层意思。
theological_decisions:
- issue: 礼仪语境中的圣洁用语
  choice: 使……成为圣洁
  alternative: 把……分别为圣／使……成圣
  rationale: 原文既可强调使之成为圣洁，也可强调分别归神。正文采用较直接透明的“使……成为圣洁”，脚注保留“分别为圣”的礼仪性表达，避免把含义限缩为单纯的任命或奉献。
- issue: 祭司身份的性别指称
  choice: 他的儿子们
  alternative: 他的儿女／他的后代
  rationale: בניו 在本节明确指亚伦的儿子们；按原文保留男性复数，不作中性化处理。
- issue: לְכַהֵן לִי 中祭司职分与服侍对象的关系
  choice: 使他们作祭司侍奉我
  alternative: 让他们归我作祭司／让他们为我供祭司的职分
  rationale: 正文同时表达祭司身份及其向神履职的关系，但不进一步解释祭司职分的神学性质。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“会幕”“祭坛”“祭司”保留通行的礼仪术语；句式维持原文两个并列分句及“使……成为圣洁”的重复。所有脚注标记均置于正文相关表达之后。
