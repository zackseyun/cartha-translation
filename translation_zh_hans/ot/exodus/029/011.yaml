  yaml_path: translation/ot/exodus/029/011.yaml
  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: zh_hans
  text: 你要在会幕门口，在雅威[a]面前宰杀那头公牛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），传统译作“耶和华”或“上主”；也常音译作“雅威”。
    reason: 说明神名的原文形式及主要译法。
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: 你要……宰杀
  rationale: 该形式在连续的礼仪指令中表达命令或应当执行的行动；“宰杀”准确体现献祭语境，比一般的“杀”更明确。
- source_word: הַפָּר
  choice: 那头公牛
  rationale: פַּר在献祭语境中通常指公牛；量词“头”符合现代汉语习惯，而“那”承接上文已经指定的公牛。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי表示“在……面前”，既保留空间意象，也保留在神临在之处举行礼仪的含义。
- source_word: פֶּתַח
  choice: 门口
  rationale: 该词指入口或门道；“会幕门口”是简洁、自然的现代汉语表达。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在中文圣经传统中通行且简明的译法，也传达作为相会之帐幕的功能。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה。正文采用“雅威”作为较接近其常见学术重构读音的音译，不以称号替代专名；脚注列出中文读者熟悉的传统译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“在会幕门口”先交代礼仪地点，“在雅威面前”保留原文的神圣临在表达；避免使用生硬的“相会之帐幕”。
