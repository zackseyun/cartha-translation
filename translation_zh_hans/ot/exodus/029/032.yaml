  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: zh_hans
  text: 亚伦和他的儿子们要在会幕门口吃那只公绵羊的肉和篮子里的饼。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָכַל
  choice: 要……吃
  rationale: 该形式在礼仪指示语境中带有规定性的将来或指令意味；“要……吃”自然表达这一语气，又不强化为直接命令。
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: 亚伦和他的儿子们
  rationale: 采用通行人名译法；“儿子们”准确反映此处参与承接圣职礼的男性后裔，而非泛指所有儿女。
- source_word: בְּשַׂר הָ/אַיִל
  choice: 那只公绵羊的肉
  rationale: בשר字面可指“肉体”，但在献祭后食用的语境中，现代汉语用“肉”最自然；אַיִל明确指公绵羊。
- source_word: הַ/לֶּחֶם אֲשֶׁר בַּ/סָּל
  choice: 篮子里的饼
  rationale: לחם在此承接前文篮中的无酵饼类，译作集合意义的“饼”；关系从句自然压缩为“篮子里的”。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 在会幕门口
  rationale: פתח指入口或门口；אֹהֶל מוֹעֵד采用现代中文圣经语境中清楚而通行的“会幕”，即相会之帐幕。
theological_decisions:
- issue: 祭司语境中的男性所指
  choice: 他的儿子们
  alternative: 他的儿女们
  rationale: 本节特指亚伦参与承接圣职礼的儿子，保留原文明确的男性所指。
- issue: 礼仪指示的动词语气
  choice: 要……吃
  alternative: 吃了；必须吃
  rationale: 原文在条例语境中具有规定性，但并非显式命令式；“要……吃”保留指令与将来陈述之间的张力。
- issue: אֹהֶל מוֹעֵד的译名
  choice: 会幕
  alternative: 相会之帐幕
  rationale: “会幕”是简洁、庄重且易懂的通行译名；其“相会”含义由既定术语承载，不额外解释为特定神学概念。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。调整地点短语至动词前，使句子符合自然汉语语序；以“那只”承接上下文中特定的公绵羊。原文בשר在本语境译为“肉”已无实质歧义，因此不设脚注。
