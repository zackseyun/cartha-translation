base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: zh_hans
  text: 但公牛的肉、皮和粪，你要在营外用火焚烧；这是赎罪祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“洁净祭”。希伯来语 חַטָּאת 既可指“罪”，也可指与罪有关的祭物；在这样的献祭语境中，通常译作“赎罪祭”，也有人译作“洁净祭”，以突出礼仪的洁净作用。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: 公牛的肉
  rationale: “肉”直接表达动物身体的肉，在现代汉语祭牲语境中自然清楚；פַּר译作“公牛”，不额外加入原文未明确要求的年龄信息。
- source_word: עֹרוֹ
  choice: 皮
  rationale: 指祭牲的皮；“皮”在现代汉语中简洁自然，无须增译为“兽皮”。
- source_word: פִּרְשׁוֹ
  choice: 粪
  rationale: 该词明确指排泄物，译作“粪”保留其具体含义，不弱化为可能被理解成内脏的“杂物”或“下水”。
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: 你要用火烧
  rationale: 未完成式在指令语境中表达命令；“你要”符合现代汉语律例文体，בָּאֵשׁ按工具意义译为“用火”。
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: 在营外
  rationale: 准确表达营地界线以外的地点，也是简洁自然的现代汉语说法。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 在本节献祭语境中，该词指与罪有关的祭物或祭礼；“赎罪祭”是中文读者熟悉且语境明确的译法，同时用脚注保留“洁净祭”的学术性替代译法。
- source_word: הוּא
  choice: 这是
  rationale: 以“这是”自然指认前述公牛及相关祭礼的性质。
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: 肉、皮和粪
  rationale: 汉语列举通常用顿号并在末项前加“和”；虽不机械重复连接词，仍完整保留三个并列对象。
theological_decisions:
- issue: 献祭律例中 חַטָּאת 的译法
  choice: 赎罪祭
  alternative: 洁净祭；罪
  rationale: 上下文表明这里不是单指抽象的“罪”，而是指相关祭物或祭礼。“赎罪祭”兼顾中文传统、可理解性和祭祀语境；“洁净祭”能突出礼仪洁净功能，故列入脚注，以保留该词的解释张力。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“你要”保留指令力度；“营外”“赎罪祭”使用普通中文读者熟悉的圣经祭祀用语。脚注标记置于对应术语之后。
