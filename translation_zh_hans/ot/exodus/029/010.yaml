  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: zh_hans
  text: 你要把那头公牛带到会幕前[a]，亚伦和他的儿子们要把手按在公牛头上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带到”或译“带近”或“呈上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: 你要……牵到
  rationale: 使役式在献祭语境中表示把祭牲带近或呈到指定地点；“牵到”符合公牛这一对象，也自然体现移动和带到近前的意思。
- source_word: הַפָּר
  choice: 那公牛
  rationale: פַּר指公牛，在献祭语境中也可指小公牛；此处用“公牛”准确而自然，定冠词结合上下文译为“那”。
- source_word: לִפְנֵי
  choice: 前
  rationale: 表示位于某处之前或其面前；“会幕前”简洁地保留空间和礼仪语境。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语境中的通行表达，简明且保留其作为相会之帐幕的礼仪含义。
- source_word: וְסָמַךְ
  choice: 要把手按在
  rationale: סמך与手和祭牲的头连用，指按手这一具体礼仪动作；“按在”比单纯“放在”更能体现该动词的动作感，同时不额外解释其象征意义。
- source_word: יְדֵיהֶם
  choice: 手
  rationale: 希伯来文为复数，指亚伦和众子共同实施按手礼；现代汉语以“他们把手按在”自然表达集体动作，无须机械译成“各人的双手”。
- source_word: עַל רֹאשׁ הַפָּר
  choice: 在公牛头上
  rationale: 直接保留动作所及的具体部位，并采用自然的现代汉语语序。
- source_word: אַהֲרֹן וּבָנָיו
  choice: 亚伦和他的儿子们
  rationale: בָנָיו在此指参与承接圣职礼的男性后裔；“儿子们”准确保留性别和复数信息。
theological_decisions:
- issue: 在祭牲头上按手的礼仪意义
  choice: 仅译明“把手按在公牛头上”这一具体动作
  alternative: 解释为把罪责转移给公牛或表明献祭者与祭牲认同
  rationale: 本节只陈述礼仪动作，并未明说其象征或神学机制；译文不引入经文本身没有解释的罪责转移等教义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“牵到”适合有生命的祭牲，也传达使役式“带近、呈上”的基本动作；脚注保留其祭祀语境中的其他可能表达。主文保持简洁，不增添按手礼的神学解释。
