  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: zh_hans
  text: 你要让他的儿子们近前来，给他们穿上内袍。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “让他的儿子们近前来”也可译作“把他的儿子们带上前来”。希伯来语动词在这里可表示使人走近，作礼仪上的呈现。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: 你要
  rationale: 句首连接词承接前一项礼仪命令；汉语中不必机械译出“并且”，直接用“你要”可自然延续命令序列。宾语标记 אֶת 不单独翻译。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: בֵּן 在此特指亚伦的男性后代；复数译作“儿子们”，既保留性别信息，也符合祭司承接礼的上下文。
- source_word: תַּקְרִיב
  choice: 让……近前来
  rationale: קרב 的使役式在礼仪语境中有使人走近、带到近前以供呈献之意。“让……近前来”保留了空间意象及礼仪色彩，同时比生硬的“带近”更符合现代汉语。
- source_word: וְהִלְבַּשְׁתָּם
  choice: 给他们穿上
  rationale: 该使役式表示给人穿衣。“给他们穿上”自然、明确，并保留摩西为他们穿戴礼服的动作。
- source_word: כֻּתֳּנֹת
  choice: 内袍
  rationale: כֻּתֹּנֶת 指贴身穿着、带袖的长衣，在祭司服饰语境中译为“内袍”可避免现代“衬衫”或外层“长袍”的误解，也与外袍类服饰有所区分。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙事用语。“近前来”保留原文 קרב 的核心意象；“内袍”作为祭司服饰名称，力求兼顾准确性与普通读者的可理解性。
