base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: zh_hans
  text: 你要从为亚伦的授职礼所用的公绵羊[a]中取胸肉，把它作为摇祭，在耶和华面前摇献；这要归你，作你的份。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“为亚伦承接圣职所献的公绵羊”或“为亚伦分别为圣所用的公绵羊”。希伯来语在这里使用祭司就职礼的专门用语。
    reason: 说明הַמִּלֻּאִים的礼仪术语性质，并保留“承接圣职／分别为圣”的可行译法。
lexical_decisions:
- source_word: הֶחָזֶה
  choice: 胸肉
  rationale: 在献祭条例中指牲畜胸部特定的一份肉；“胸肉”既准确，也符合现代汉语习惯。
- source_word: אֵיל הַמִּלֻּאִים
  choice: 授职礼公绵羊
  rationale: אַיִל指成年公绵羊；מִלֻּאִים在此是亚伦承接祭司职分之礼的专门用语。“授职礼公绵羊”清楚表达其礼仪和职分设立的含义，又避免采用字面但晦涩的“充满”。
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: 为亚伦预备的
  rationale: 保留介词לְ所表达的关联或指定关系，不将其过度解释为所有权。
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: 把它摇一摇，作为摇祭
  rationale: 动词נוּף与同根名词תְּנוּפָה构成固定礼仪表达；译文兼顾实际动作和“摇祭”这一祭礼术语。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: לִפְנֵי在敬拜礼仪语境中自然译为“在……面前”；神名יְהוָה按其专名译为“耶和华”。
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: 这要归你，作你的份
  rationale: מָנָה指分配所得的一份；此译法既保留归属，也明确这是礼仪中分给摩西的份。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。现代中文圣经读者最熟悉“耶和华”，此处保留为专名而不以“主”这一称号代替。
- issue: הַמִּלֻּאִים所指的祭司设立礼仪
  choice: 授职礼
  alternative: 承接圣职礼／分别为圣礼
  rationale: 上下文是亚伦被设立担任祭司职分。“授职礼”能清楚传达职分设立之意，同时不把该词限定为后世某一宗派的按立制度；传统的“承接圣职”作为脚注备选保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。用“授职礼”帮助普通读者直接理解祭司职分设立的语境，以脚注保存“承接圣职”的传统术语；句式保留原文连续指令及最后分配份额的结构。
