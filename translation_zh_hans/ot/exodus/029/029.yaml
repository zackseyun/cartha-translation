base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: zh_hans
  text: 亚伦的圣衣，在亚伦之后，要归给他的儿子们，好让他们穿着这些衣服受膏，也穿着这些衣服受任为祭司。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “受任为祭司”直译是“充满他们的手”，这是指祭司就职的一种惯用说法，也可译作“使他们就任”。
    reason: 说明希伯来语祭司就职惯用语的字面形式及功能含义。
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: 圣衣
  rationale: 该短语指分别出来供祭司圣职使用的衣服。“圣衣”简洁自然，也保留了其神圣、专用的含义。
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: 亚伦的
  rationale: 这里的介词 לְ 表示归属；译作“亚伦的”准确而简洁。
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: 在他以后要归他的儿子们
  rationale: 原文表达亚伦之后的祭司承继关系。“在他以后”保留时间与继任含义，“归他的儿子们”准确表达所属。
- source_word: לְמָשְׁחָה בָהֶם
  choice: 让他们穿着这些衣服受膏
  rationale: בָהֶם 在此最自然地表示受膏时穿着这些衣服，而不是用衣服作为膏抹工具。中文采用明确而自然的处境表达。
- source_word: וּלְמַלֵּא בָם אֶת־יָדָם
  choice: 也穿着这些衣服承接圣职
  rationale: מלא את־יד 是祭司就职礼的固定用语。正文用现代中文可理解的“承接圣职”表达其功能，脚注保留“使手充满”的希伯来语意象。
theological_decisions:
- issue: 祭司就职惯用语 מלא את־יד 的译法
  choice: 正文译作“承接圣职”，脚注说明其字面形式
  alternative: 使他们的手充满；授予圣职；使他们就任
  rationale: 直译“使手充满”在现代中文中难以自行传达祭司就职之意；“承接圣职”既符合本段祭司承继与就任的语境，也避免让读者误解为一般性的按立。脚注则保留原文独特意象，便于查考。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“圣衣”“受膏”“承接圣职”与祭司礼仪语境相称；重复“穿着这些衣服”以清楚保留原文两次 בָהֶם 的指向。
