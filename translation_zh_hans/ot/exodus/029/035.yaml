base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: zh_hans
  text: 你要为亚伦和他的儿子们这样做，照着我所吩咐你的一切。你要用七天的时间使他们承接祭司职分[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你要充满他们的手”；这是希伯来语惯用语，指授予人祭司职分，使其正式任职。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……行
  rationale: 在连续的礼仪指示中，带连接词的完成式具有指令作用；用“要”自然表达命令语气。
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: 为亚伦和他的儿子们
  rationale: 介词 ל 表示礼仪行动所关涉、施行于其身的人；“为”符合现代汉语表达。
- source_word: כָּכָה
  choice: 这样
  rationale: 指回上文所规定的礼仪程序，简明保留其指示作用。
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: 照我所吩咐你的一切
  rationale: 保留 כְּכֹל 所表达的完全遵照之意，同时使用自然、庄重的现代汉语。
- source_word: שִׁבְעַת יָמִים
  choice: 用七天
  rationale: 这是表示持续时间的宾格；“用七天”清楚说明授职礼仪历时七天。
- source_word: תְּמַלֵּא יָדָם
  choice: 使他们承接祭司职分
  rationale: מלא יד 字面为“使手充满”，在祭司礼仪语境中是授予、使人承接祭司职分的惯用语；正文译出其语境意义，字面形式收入脚注。
theological_decisions:
- issue: 如何翻译祭司授职惯用语 מלא יד
  choice: 使他们承接祭司职分
  alternative: 使他们的手充满；授予他们职分；使他们就任
  rationale: 此处指亚伦和众子正式进入祭司职分。“承接祭司职分”既说明礼仪所授予的身份，又不套用后世某一宗派的按立制度；脚注保留原文形象，便于核查。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“照……一切”“这样行”保留原文的全面遵行与回指关系；避免使用可能让普通读者误解为后世特定宗派仪式的专门术语。
