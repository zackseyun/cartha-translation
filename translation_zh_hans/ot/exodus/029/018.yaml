  text: וְ/הִקְטַרְתָּ֤ אֶת כָּל הָ/אַ֨יִל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֥ה ה֖וּא לַֽ/יהוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַ/יהוָ֖ה הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: zh_hans
  text: 你要把整只公绵羊在祭坛上焚烧。这是献给雅威的燔祭，是怡人的香气[a]，是献给雅威的火祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“安宁的香气”。这是希伯来文固定的祭祀用语，表示所献的祭蒙雅威悦纳。
    reason: 说明 רֵיחַ נִיחוֹחַ 的词义范围及其作为固定祭祀公式的功能。
  - marker: b
    text: “火祭”所对应的希伯来词含义不完全确定；也可理解为“供物”，传统上常译为“用火献的祭”。
    reason: 保留 אִשֶּׁה 的词义不确定性和主要译法。
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: 焚烧
  rationale: 该词在祭祀语境中指使祭物在坛上焚烧、化为烟气；“焚烧”在现代汉语中自然清楚，祭坛语境也保留了献祭含义。
- source_word: כָּל הָאַיִל
  choice: 整只公绵羊
  rationale: כָּל 强调整只牲畜全部献上；אַיִל 特指成年公羊，译作“公绵羊”比泛称“羊”更准确。
- source_word: הַמִּזְבֵּחָה
  choice: 放在祭坛上
  rationale: 原文带方向词尾，字面含有朝向祭坛的动作；结合焚烧行为，现代汉语以“放在祭坛上”表达最自然。
- source_word: עֹלָה
  choice: 燔祭
  rationale: 这是祭祀律法中的固定术语，指祭物整体焚烧献上的祭；“燔祭”准确、简洁，也为普通中文圣经读者熟悉。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词 לְ 表示祭物的归属和奉献对象；“献给”在汉语中明确表达这一关系。
- source_word: רֵיחַ נִיחוֹחַ
  choice: 悦人的香气
  rationale: 这是固定的祭祀表达，描述祭物所发出的、蒙神悦纳的香气；正文保留其香气意象，不将“悦纳”的神学含义完全替代原有比喻。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该词的具体词源和含义存在讨论，传统上理解为以火献上的祭物；“火祭”简洁地保留其与焚烧献祭的关联，同时以脚注提示另一种理解。
- source_word: הוּא
  choice: 这是／是
  rationale: 两处代词均起判断和确认作用；按现代汉语句法合并为连续的“这是……，是……，是……”。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较接近学界通常重构的读音，并保留这是神专名的特点。
- issue: רֵיחַ נִיחוֹחַ 是否直接解释为蒙悦纳
  choice: 正文译作“悦人的香气”，脚注说明其祭祀语用
  alternative: 蒙悦纳的馨香
  rationale: 正文保留原文具体的嗅觉意象及其可能的张力，不把固定表达完全改写为抽象的“悦纳”；脚注则帮助读者理解它通常表示祭物蒙雅威悦纳。
- issue: אִשֶּׁה 的祭祀含义
  choice: 火祭
  alternative: 供物／食物祭
  rationale: 该词在祭祀文本中的精确含义有争议。“火祭”延续其明显的焚烧语境，但不把神描绘为需要进食；脚注保留“供物”等可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“公绵羊”准确说明牲畜种类；“燔祭”和“火祭”保留必要的祭祀术语，并由上下文和脚注帮助理解。句式依照原文的连续判断结构，但作适度汉语化处理。
