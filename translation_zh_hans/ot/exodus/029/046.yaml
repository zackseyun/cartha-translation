base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: zh_hans
  text: 他们必知道，我是雅威[a]——他们的上帝，就是那位把他们从埃及地领出来、为要住在他们当中[b]的。我是雅威——他们的上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文神名 יהוה（YHWH）；传统上也译作“耶和华”。
    reason: 说明神名的音译及常见传统译法。
  - marker: b
    text: 直译“在他们中间”。
    reason: 交代 בְתוֹכָם 的字面空间表达。
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 他们就会知道
  rationale: 在前文应许的语境中，连接词加完成式表达将来的结果；“就会知道”既自然，又保留结果意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按神名四辅音所代表的专名 Yahweh 音译，避免以“主”这一称号代替原文中的专名。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 虽为复数形态，但与雅威连用并处于圣约语境，明确指单数的“他们的上帝”。
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: 把他们从埃及地领出来
  rationale: 符合希伯来语出埃及的惯用表达，也以现代汉语自然传达 מן 的起点含义。
- source_word: לְשָׁכְנִי
  choice: 为要住
  rationale: 带 לְ 的不定词在此表达目的；“为要”明确保留上帝领以色列出埃及的目的。
- source_word: בְתוֹכָם
  choice: 在他们当中
  rationale: 自然表达上帝临在于群体内部的意思，同时保留“在……中间”的空间意象。
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: 我是雅威他们的上帝
  rationale: 保留希伯来语郑重而强调的圣约宣告，并与本节前半句形成首尾呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名；正文采用较贴近 Yahweh 的现代汉语音译“雅威”，脚注交代传统译名，不以称号“主”取代专名。
- issue: 以色列出埃及之目的从句
  choice: 为要住在他们当中
  alternative: 住在他们当中
  rationale: לְשָׁכְנִי 最自然地表示目的。译出“为要”可保留原文所说的关系：领出埃及是为了上帝住在其子民当中，而不额外扩展其神学含义。
- issue: 关系从句所指
  choice: 就是把他们从埃及地领出来……的那一位
  alternative: 我把他们从埃及地领出来……
  rationale: אֲשֶׁר 引出关系从句，描述“雅威他们的上帝”。采用“就是……的那一位”保留这种修饰关系，也避免把句法改写成彼此独立的陈述。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“为要”略带经文语体，用来清楚保留目的关系；其余措辞避免古奥。“雅威他们的上帝”有意保留原文紧密的圣约称谓结构。
