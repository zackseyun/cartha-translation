source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ אֹתָ/ם֙ מִ/יָּדָ֔/ם וְ/הִקְטַרְתָּ֥ הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה לְ/רֵ֤יחַ נִיח֨וֹחַ֙ לִ/פְנֵ֣י יְהוָ֔ה אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: zh_hans
  text: 你要从他们手中接过这些祭物，放在祭坛上，在燔祭之上焚烧，使其在雅威面前成为蒙悦纳的香气。这是献给雅威的火祭[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用火献给雅威的祭物。”
    reason: 希伯来语 אִשֶּׁה 是献祭术语，传统上常译作“火祭”或“用火献的祭物”；其确切构词和范围存在讨论。
lexical_decisions:
- source_word: וְלָקַחְתָּ אֹתָם מִיָּדָם
  choice: 你要从他们手中接过这些祭物
  rationale: 连续指令中的完成式带连接词，表达下一步命令；“接过”自然呈现从他人手中取来的动作。“这些祭物”明确代词所指的是上文放在祭司手中的各部分，又不增添新的祭物类别。
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: 放在祭坛上……焚烧
  rationale: קטר 的使役式在献祭语境中指使祭物冒烟焚烧；方向词尾表示朝向并置于祭坛。“放在祭坛上……焚烧”以自然汉语保留动作与献祭场景。
- source_word: עַל הָעֹלָה
  choice: 在燔祭之上
  rationale: עַל 表示位于已经献上的燔祭上面；“之上”保留祭物叠放的空间关系。
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: 成为蒙悦纳的香气
  rationale: 固定献祭用语不仅描述气味，也表达祭物蒙神喜悦、接纳；此译保留“香气”的比喻，同时传达 ניחוח 的取悦含义。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在某者面前或临在中；以“雅威”音译四字神名，保留其专名性质。
- source_word: אִשֶּׁה הוּא לַיהוָה
  choice: 这是献给雅威的火祭
  rationale: אִשֶּׁה 是祭司文献中的献祭术语，与火中献上密切相关；“火祭”简洁而保留传统词义范围。לַיהוָה 表明祭物献给雅威。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；“雅威”按通常重构的发音音译，避免把专名改为称号，也不采用源自另一套元音组合的传统形式。
- issue: 献祭术语 אִשֶּׁה 的理解
  choice: 火祭
  alternative: 用火献的祭物；食物祭
  rationale: 该词的词源与具体语义仍有讨论。“火祭”保留其在本节焚烧语境中的明显火祭关联，不将其直接限定为神的“食物”；较展开的译法列入脚注。
- issue: רֵיחַ נִיחוֹחַ 所表达的神人关系
  choice: 蒙悦纳的香气
  alternative: 馨香的香气；使人舒畅的香气
  rationale: 本短语在献祭语境中表达祭物在神面前蒙喜悦，同时仍以气味为意象；译文保留两方面，不把它仅处理为感官上的芬芳。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪叙述。“燔祭”“祭坛”“火祭”保留普通中文读者可识别的圣经献祭术语；句法按仪式步骤展开，避免文言化。
