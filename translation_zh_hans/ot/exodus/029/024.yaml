base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: zh_hans
  text: 你要把这一切放在亚伦的手掌上，也放在他儿子们的手掌上[a]；你要在耶和华面前将这些摇动，作为摇祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在亚伦的手掌上，也在他儿子们的手掌上”；有些译本较宽泛地译作“手上”，但这里的希伯来词更具体地指手掌。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 你要……放在
  rationale: 连词加完成式在连续礼仪指令中表达命令；“你要……放在”自然且保留规定性语气。
- source_word: הַכֹּל
  choice: 这一切
  rationale: 回指上文汇集的各样祭物部分；“这一切”简洁地表达其总括和回指作用。
- source_word: עַל כַּפֵּי
  choice: 在……的手掌上
  rationale: כַּף可指手掌或手；此处祭物被放在手上用于呈献，“手掌”保留原文较具体的身体意象。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בָנָיו
  choice: 他儿子们
  rationale: 本处指参与承接圣职礼仪的亚伦诸子；明确译为“儿子们”符合语境及复数形式。
- source_word: וְהֵנַפְתָּ
  choice: 把这些摇一摇
  rationale: נוף的使役式在献祭语境中指以摇动方式呈献；“摇一摇”清楚呈现仪式动作，也与“摇祭”相呼应。
- source_word: אֹתָם
  choice: 这些
  rationale: 阳性复数宾语代词回指上文的多项祭物；中文用“这些”明确其复数回指。
- source_word: תְּנוּפָה
  choice: 作为摇祭
  rationale: 该名词表示摇动呈献的礼仪类别或结果；“摇祭”是准确而通行的祭祀术语。
- source_word: לִפְנֵי יְהוָה
  choice: 在耶和华面前
  rationale: לִפְנֵי表达在某位面前或其临在中；“在……面前”既贴近原文，也适合礼仪语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名形式呈现四字神名，同时避免将其改为称号。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且可辨识的专名“耶和华”，保留其作为名字而非称号的功能；“雅威”是按学术界常见重构发音形成的另一可行译法。
- issue: תְּנוּפָה 所指礼仪的表达
  choice: 作为摇祭
  alternative: 作为呈献祭
  rationale: “摇祭”保留与动词 וְהֵנַפְתָּ 的词根和动作联系，不把具体仪式动作泛化为单纯“呈献”。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“手掌”保留礼仪动作的具体画面；“摇一摇，作为摇祭”以自然中文同时呈现动作和祭礼名称。
