base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: zh_hans
  text: 又要把十分之一伊法的细面[a]，与四分之一欣的捣出的油[b]调和；再用四分之一欣的酒作奠祭，献给这只羊羔[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文只说“十分之一”，未重复说明“伊法”；在献祭的计量语境中，指十分之一伊法的细面。
    reason: lexical_alternative
  - marker: b
    text: “捣出的油”指由捣碎或击打的橄榄制成的油，也可译作“压榨的油”。
    reason: lexical_alternative
  - marker: c
    text: “这只羊羔”也可译作“一只羊羔”；按上下文，很可能指每日两只羊羔中的第一只。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עִשָּׂרֹן סֹלֶת
  choice: 十分之一伊法的细面
  rationale: עִשָּׂרוֹן在献祭计量中指一伊法的十分之一；为使现代读者明白所计量的单位，正文补明“伊法”，并用脚注说明原文仅说“十分之一”。סֹלֶת译为献祭用的“细面”。
- source_word: בָּלוּל בְּ/שֶׁמֶן
  choice: 与……油调和
  rationale: בָּלוּל是被动分词，表示细面与油混合；“调和”符合祭物制备语境，也比“搀和”更庄重自然。
- source_word: שֶׁמֶן כָּתִית
  choice: 捣制的油
  rationale: כָּתִית说明油由捣碎或击打橄榄而得。“捣制的油”保留制作方式，同时避免误解为油本身遭捶打；脚注进一步说明。
- source_word: רֶבַע הַ/הִין
  choice: 四分之一欣
  rationale: 保留古代液量单位“欣”，准确呈现四分之一的量值，不作不确定的现代容量换算。
- source_word: וְ/נֵסֶךְ
  choice: 再用……作奠祭
  rationale: נֶסֶךְ是把酒浇奠献上的祭，采用现代中文圣经语体中清楚而简洁的“奠祭”。
- source_word: רְבִעִית הַ/הִין יָיִן
  choice: 四分之一欣酒
  rationale: 按原文保留酒的种类和古代量值，并与前面的油量采用一致表达。
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: 献给这一只羊羔
  rationale: 定冠词加数词直指上下文所说两只羊羔中的一只。“这一只”保留指称性，却不在正文中直接将其解释成“第一只”。
theological_decisions:
- issue: הָאֶחָד是否应明确译为“第一只”
  choice: 这一只羊羔
  alternative: 第一只羊羔；一只羊羔
  rationale: 上下文很可能指每天所献两只羊羔中的第一只，但本节字面是“这一只／那一只”，不是序数词“第一”。正文保留措辞的指称性，脚注交代语境上的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀语体。保留“伊法”“欣”等古代计量单位，不作有争议的现代容量换算；以脚注说明原文省略的计量单位及“这一只”的语境含义。
