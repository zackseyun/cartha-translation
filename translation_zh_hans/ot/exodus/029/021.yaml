  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: zh_hans
  text: 你要取一些祭坛上的血和一些膏油，洒在亚伦和他的衣服上，也洒在他的儿子和他们的衣服上；他们和这些衣服都与亚伦一同受洒。这样，亚伦和他的衣服，以及他的儿子和他们的衣服，都将成为圣洁[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“将被分别为圣”。希伯来文直译为“将成为圣洁”，指这项礼仪之后所得的圣洁身份。
    reason: 说明 קדשׁ 的可选译法及其在本句中所表达的结果状态。
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要取
  rationale: 带连接词的完成式用于连续的礼仪指令，表达应当执行的下一步；“你要取”在现代汉语中自然保留其指令性。
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: 一些祭坛上的血
  rationale: מִן 表示从整体中取出一部分，因此译出“一些”；关系从句自然处理为“祭坛上的”。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 这是用于膏立礼仪的油；“膏油”是简洁、通行且符合祭司礼仪语境的现代中文表达。
- source_word: וְהִזֵּיתָ
  choice: 洒在
  rationale: נזה 的使役式在礼仪语境中指把液体洒在对象上；“洒”准确而自然，不额外规定液滴的形态或力度。
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: 他的衣服／他们的衣服
  rationale: בגד 是“衣服、衣裳”的一般用词；采用“衣服”既清楚自然，也避免加入原文未明说的后世宗教服饰术语。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: 原文为阳性复数，在本段明确指亚伦参与祭司礼仪的儿子们，故保留性别和亲属关系。
- source_word: אִתּוֹ
  choice: 同他一起的
  rationale: 直译为“与他一起”；置于“儿子们”之前，使中文关系清楚，同时保留他们与亚伦一同接受礼仪的含义。
- source_word: וְקָדַשׁ
  choice: 将成为圣洁
  rationale: קדשׁ 在此陈述洒血和膏油之后产生的圣洁状态。“成为圣洁”既保留词根的核心概念，也清楚表达结果。
- source_word: הוּא
  choice: 他
  rationale: 原文用代词回指亚伦；中文保留“他”即可明确承接上句。
theological_decisions:
- issue: 礼仪所产生结果的表述
  choice: 将成为圣洁
  alternative: 将被分别为圣／将被祝圣
  rationale: 原文用 קדשׁ 直接陈述圣洁的结果。“成为圣洁”保留原文自身的神学范畴及其结果意味，不把它缩窄为某一特定宗派或后世礼仪术语。
translation_notes:
  register: 采用现代、庄重且易懂的礼仪叙述语体。保留“血”“膏油”“圣洁”等原文核心词汇；调整重复结构以符合现代汉语习惯，但不删去亚伦、其衣服、其儿子们及其衣服这四组受礼对象。脚注标记置于实际涉及词“圣洁”之后。
