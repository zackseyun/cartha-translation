base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: zh_hans
  text: 你要给他们束上腰带，就是给亚伦和他的儿子们束上；又要给他们裹上头巾。祭司的职分要归他们；这要作他们永久的定例。你要按立亚伦和他的儿子们[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译是“使亚伦的手和他儿子们的手充满”；这是希伯来语的惯用表达，指授予他们祭司职分，使他们就职。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: 束上腰带
  rationale: חגר与אַבְנֵט连用，指把祭司的腰带束好。“束上腰带”既保留穿戴动作，也符合现代汉语表达。
- source_word: אַהֲרֹן וּבָנָיו
  choice: 就是给亚伦和他的儿子们
  rationale: 这是对前面“他们”的同位说明；加入“就是”可自然地表明所指，而不改变原文内容。
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: 给他们裹上头巾
  rationale: חבש表示在头上包裹或系戴，מִגְבָּעוֹת指普通祭司的头部服饰，与大祭司所戴的冠巾用词有别。“裹上头巾”保留了动作和服饰类别。
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: 祭司的职分要归他们
  rationale: 原文以לָהֶם表达归属；此译明确表示祭司职分被赋予亚伦及其众子。
- source_word: לְחֻקַּת עוֹלָם
  choice: 作为永久的定例
  rationale: חֻקָּה是固定的定例，עוֹלָם在律法和礼仪语境中表示持续长久、恒常有效。“永久”保留其力度，同时不额外断定超出上下文的哲学性永恒。
- source_word: וּמִלֵּאתָ יַד
  choice: 按立
  rationale: “使手充满”是授予祭司职分、使其就职的希伯来语专门表达。“按立”在正文中简明传达其功能，字面形式则收入脚注。
theological_decisions:
- issue: לְחֻקַּת עוֹלָם所表达的礼仪制度持续期限
  choice: 作为永久的定例
  alternative: 作为永远的定例
  rationale: “永久”表达该祭司制度在以色列盟约秩序中的恒常效力，同时避免由译文替上下文裁定绝对、无条件的哲学性永恒。
- issue: וּמִלֵּאתָ יַד这一祭司就职惯用语的译法
  choice: 按立亚伦和他的儿子们
  alternative: 使亚伦和他儿子们的手充满
  rationale: 直译在现代汉语中难以自行传达祭司就职之意，因此正文采用功能对等的“按立”，并在脚注中保存原文意象，以保持可核查性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“束上腰带”“裹上头巾”具体呈现祭司服饰的穿戴动作；句式保留原文命令、职分归属、永久定例和按立行动的顺序。
