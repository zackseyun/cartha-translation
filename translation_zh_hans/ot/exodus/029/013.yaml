base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: zh_hans
  text: 你要取包裹内脏的一切脂肪、肝脏上的附属部分[a]、两个肾和肾上的脂肪，在祭坛上焚烧这些。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肝叶”。希伯来语指附着于肝脏的某一特定部分，但确切的解剖部位不能确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要取下
  rationale: 连词加完成式在连续礼仪指令中表达命令；“你要”保留规程语气，“取下”切合从祭牲身上取出这些部分的语境。
- source_word: כָּל הַחֵלֶב
  choice: 一切脂肪
  rationale: חֵלֶב在献祭语境中指祭牲特定的肥脂部分；“脂肪”清楚、通行。
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: 包裹内脏的
  rationale: קֶרֶב在此指祭牲腹腔内的脏器；“包裹内脏”准确表达脂肪覆盖其上的关系，也符合现代汉语。
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: 肝上的叶状部分
  rationale: 该词指与肝脏相连的某一特定部分，但确切解剖对应存在争议；“叶状部分”既传达其传统理解，又避免断定为现代解剖学上的特定肝叶。
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: 两个肾
  rationale: 这是明确的解剖名称，直译自然。
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: 肾上的脂肪
  rationale: 代词所指为两个肾；汉语重复“肾”比“它们”更清楚，并直接保留“在……上”的空间关系。
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: 把这些放在祭坛上焚烧
  rationale: קטר的使役式在献祭语境中指在坛上焚烧，使祭物化为烟；此译自然表达实际礼仪动作，并保留祭坛这一语境。
