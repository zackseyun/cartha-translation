  text: וְ/אֵ֛ת אֵ֥יל הַ/מִּלֻּאִ֖ים תִּקָּ֑ח וּ/בִשַּׁלְתָּ֥ אֶת בְּשָׂר֖/וֹ בְּ/מָקֹ֥ם קָדֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: zh_hans
  text: 你要取那只承接圣职所用的公绵羊[a]，在圣洁的地方煮它的肉[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“授职礼所用的公绵羊”。这里的希伯来语是指祭司受职仪式的专门用语。
    reason: lexical_alternative
  - marker: b
    text: 或译：“在圣所里”；但希伯来语更直译为“在圣洁的地方”。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: 公绵羊
  rationale: 该词在献祭语境中通常指成年的雄性绵羊；“公绵羊”准确、自然，也比泛称“公羊”更明确。
- source_word: הַמִּלֻּאִים
  choice: 承接圣职礼
  rationale: 该词是祭司就职仪式的专门用语，源于“把手充满”的希伯来语礼仪表达。“承接圣职礼”既保留祭司受职的含义，也符合中文圣经礼仪语境。
- source_word: תִּקָּח
  choice: 你要取
  rationale: 第二人称阳性单数未完成式在连续礼仪指令中具有命令、规定的语气；“你要取”简洁地表达这一指令力度。
- source_word: וּבִשַּׁלְתָּ
  choice: 煮
  rationale: בשׁל在这里指以水煮制，而不只是泛泛的“烹调”；“煮”准确且为现代汉语常用词。
- source_word: בְּשָׂרוֹ
  choice: 它的肉
  rationale: בשר指动物的肉体或肉；在祭牲被宰后的烹煮语境中，“它的肉”比“它的身体”自然，并保持所指清楚。
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: 在圣洁之处
  rationale: 原文名词和形容词均无冠词，表示一处分别为圣的地方，不必特指会幕内名为“圣所”的房间。“圣洁之处”保留这种非特指性，同时语言庄重自然。
theological_decisions:
- issue: 祭司礼仪术语 הַמִּלֻּאִים 的表达
  choice: 承接圣职礼
  alternative: 授职礼；分别为圣礼
  rationale: 此词在本章具体指亚伦及其儿子被设立为祭司的仪式。“承接圣职礼”兼顾其职分授予和礼仪背景，又不把该词仅仅缩减为一般性的成圣。
- issue: בְּמָקוֹם קָדֹשׁ 是否特指会幕中的“圣所”
  choice: 在圣洁之处
  alternative: 在圣所里
  rationale: 希伯来语在此没有冠词，不能据此必然认定为会幕中技术意义上的“圣所”。译作“圣洁之处”避免加入原文未明确指定的地点，同时保留礼仪空间的神圣性质。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“承接圣职礼”保留祭司就职的技术含义；“圣洁之处”刻意不写成可能被理解为会幕特定内室的“圣所”。
