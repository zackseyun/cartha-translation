  rationale: 修订仅改善现代汉语表达并更贴近原文的状态性表述：以“祭坛”明确指称，以“一连七天”自然表达持续时间，并将“必成为至圣”改为“必为至圣之物”。正文继续采用接触带来成圣的直接读法；脚注保留有学术根据的替代理解，且不把歧义作教义化裁定。
