base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: zh_hans
  text: 一连七天，你要为祭坛行赎罪礼，使祭坛成圣；祭坛必为至圣之物。凡触及祭坛的，都必成圣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡触及祭坛的，都应当是圣洁的。”希伯来文既可理解为接触祭坛会使接触者成圣，也可理解为只有圣洁的人或物才可接触祭坛。
    reason: 保留יִקְדָּשׁ在礼仪语境中可作结果性或限制性理解的解释空间。
lexical_decisions:
- source_word: תְּכַפֵּר עַל הַמִּזְבֵּחַ
  choice: 为坛行赎罪礼
  rationale: 在祭司礼仪语境中，כפר表示施行赎罪兼洁净的礼仪；עַל标明礼仪所针对的对象。译作“为坛行赎罪礼”既符合希伯来语用法，也避免把动作误解为只发生在坛面上。
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: 使坛成圣
  rationale: קִדַּשׁ在此指借礼仪将坛分别为圣。“使……成圣”准确、庄重，又比“圣化”更符合现代普通话。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣
  rationale: 这是希伯来语表达最高程度的构式；“至圣”自然凝练，适合描述祭坛的神圣等级。
- source_word: כָּל הַנֹּגֵעַ
  choice: 凡触及坛的
  rationale: 带כָּל的分词可泛指任何接触坛的人或物。中文以“凡……的”保留其宽泛范围，不限定为人或物。
- source_word: יִקְדָּשׁ
  choice: 都必成圣
  rationale: 该动词在本句中可表达进入圣洁状态的结果。“必成圣”保留接触之后成为圣的直接读法，同时以脚注交代其也可能表达接触者必须为圣。
theological_decisions:
- issue: 接触祭坛与圣洁之间的关系
  choice: 正文按直接结果义翻译：凡触及坛的都必成圣。
  alternative: 凡触及坛的，都必须是圣洁的；即只有已经分别为圣或获准的人或物才可接触坛。
  rationale: יִקְדָּשׁ最直接可理解为接触祭坛后进入圣洁状态，但礼仪语境也容许规范性理解，即接触者必须具备圣洁资格。正文采用较直接的语法读法，脚注保留另一种理解，不消除经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“行赎罪礼”“成圣”“至圣”与本段祭司礼仪语境相称；句式简洁，避免教派化术语。
