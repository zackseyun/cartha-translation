base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: zh_hans
  text: 他儿子中接替他职分的祭司[a]，进入会幕、在圣所[c]供职时，要穿着[b]这些衣服七天。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他之下（或在他位置上）的祭司，出自他的儿子们”；这里指接替他职分的祭司。
    reason: lexical_alternative
  - marker: b
    text: 或译“穿上”。希伯来语动词按语境可指“穿上”或“穿着”；此处译为“穿着”以表达七天的持续时段。
    reason: lexical_alternative
  - marker: c
    text: 或译“在神圣的区域”。这里指会幕中用于祭司供职的圣洁空间。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: 七天
  rationale: 这是表示持续时间的宾格；汉语将“七天”置于句末，自然表达穿着这些衣服的持续时长。
- source_word: יִלְבָּשָׁם
  choice: 穿上这些衣服
  rationale: לבש 可指“穿上”或“穿着”；宾语后缀“它们”承接上文的祭司衣服，译明为“这些衣服”可避免汉语指代含混，同时保留具体动作。
- source_word: הַכֹּהֵן תַּחְתָּיו
  choice: 接替他的祭司
  rationale: תחתיו 字面为“在他的位置上”，本段语境涉及祭司职分的承接；“接替他的祭司”清楚表达职位继任，而不增添后来的制度性含义。
- source_word: מִבָּנָיו
  choice: 就是他儿子中的一位
  rationale: 介词 מִן 表示从一群人中选出一位；此处明确继任祭司出自他的众子。
- source_word: אֲשֶׁר יָבֹא
  choice: 进入……时
  rationale: 原文为关系结构；结合随后表目的的短语，汉语以时间结构表达该祭司进入会幕供职的情形，行文自然且不改变所指。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该固定圣所名称在现代中文圣经语境中准确、简洁且广为理解的译法。
- source_word: לְשָׁרֵת
  choice: 供职
  rationale: 该动词在祭司礼仪语境中表示正式履行圣职；“供职”比泛泛的“服侍”更能体现此处制度化的祭司职责。
- source_word: בַּקֹּדֶשׁ
  choice: 在圣所
  rationale: קֹדֶשׁ 在此指分别为圣、用于会幕礼仪的空间；“圣所”既保留具体地点含义，也避免过度限定为后来的技术性分区名称。
theological_decisions:
- issue: 祭司职分的承接
  choice: 接替他的祭司，就是他儿子中的一位
  alternative: 在他位置上的祭司，是他儿子中的一位
  rationale: 译文明确这是亚伦家系中的职分承接，同时没有引入超出本节的继承制度或神学主张。
- issue: בַּקֹּדֶשׁ 所指的礼仪空间
  choice: 在圣所
  alternative: 在圣地／在至圣之处
  rationale: 原词可泛指神圣区域或圣所；此处采用“圣所”保留礼仪空间的具体性，又不武断地把范围限定为至圣所。
- issue: 穿衣动作与持续状态
  choice: 要穿上这些衣服七天
  alternative: 要穿着这些衣服七天
  rationale: לבש 同时容许“穿上”和“穿着”；正文采用动作性较强的“穿上”，并以脚注保留持续状态的可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“会幕”“祭司”“圣所”保留出埃及记礼仪语境中的常用术语；句序按汉语习惯调整，使继任者身份、进入会幕供职的情形和七天期限层次清楚。
