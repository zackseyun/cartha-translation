  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: zh_hans
  text: 还要有无酵饼、用油调和的无酵面饼[a]，以及抹了油的无酵薄饼[b]；这些都要用精细的小麦粉做成。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “无酵面饼”也可译作“无酵饼”。希伯来语此词可指一块饼或面饼，但这里未说明其具体形状。
    reason: lexical_alternative
  - marker: b
    text: “抹了油”的希伯来语通常用于“膏抹”；这里是描述薄饼的制作方法。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: 无酵饼
  rationale: 该词组指不含酵的饼食；“无酵饼”是自然、明确且符合礼仪语境的现代汉语表达。
- source_word: חַלֹּת מַצֹּת
  choice: 无酵圆饼
  rationale: חַלָּה 可指一块或一个有一定形状的饼，可能为圆形；译作“圆饼”可与泛称的“饼”和后文较薄的“薄饼”区分，同时以脚注保留“饼块”等可能。
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: 用油调和的
  rationale: בלל 表示混合、调和；“用油调和”既准确表达制作方式，也保持礼仪指示的庄重语体。
- source_word: רְקִיקֵי מַצּוֹת
  choice: 无酵薄饼
  rationale: רָקִיק 指薄的饼食；“薄饼”自然呈现其形态，并保留与 חַלּוֹת 的区别。
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: 抹了油的
  rationale: משׁח 通常意为“膏抹”，但在此处描述薄饼的制作方法；“抹了油”符合具体语境，同时在脚注中保留其常用词义。
- source_word: סֹלֶת חִטִּים
  choice: 细麦粉
  rationale: סֹלֶת 指精细面粉，חִטִּים 指明原料是小麦；“细麦粉”简洁保留两层信息。
- source_word: תַּעֲשֶׂה אֹתָם
  choice: 这些都要……做成
  rationale: 未完成式在礼仪法规中表达指令；“都要……做成”清楚传达其规定性，并自然承接三类饼食。
theological_decisions: []
