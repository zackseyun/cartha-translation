  register: 采用现代、庄重而易懂的礼仪指示语体。“还要有”承接上下文的供物清单；三种饼食分别译为“无酵饼”“无酵圆饼”“无酵薄饼”，以呈现原文由泛称到具体形态的词汇差别。
