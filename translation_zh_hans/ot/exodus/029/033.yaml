  text: וְ/אָכְל֤וּ אֹתָ/ם֙ אֲשֶׁ֣ר כֻּפַּ֣ר בָּ/הֶ֔ם לְ/מַלֵּ֥א אֶת יָדָ֖/ם לְ/קַדֵּ֣שׁ אֹתָ֑/ם וְ/זָ֥ר לֹא יֹאכַ֖ל כִּי קֹ֥דֶשׁ הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: zh_hans
  text: 他们要吃那些用来行赎罪礼的祭物[a]，为使他们承接圣职[b]并被分别为圣；但未经授权的人不可吃这些祭物[c]，因为这是圣物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“借着这些祭物施行了赎罪”。原文强调这些祭物是行赎罪礼所用的媒介。
    reason: lexical_alternative
  - marker: b
    text: “承接圣职”原文直译为“使他们的手充满”，是授予祭司职分、使其就职的希伯来惯用语。
    reason: lexical_alternative
  - marker: c
    text: “未经授权的人”原文指无权参与这项祭司礼仪的人，并非特指异族人。
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: 他们要吃那些……祭物
  rationale: 未完成式在礼仪规条中表达指令；“祭物”依据前文明确代词所指，比直译“它们”更自然。
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: 用来行赎罪礼的
  rationale: כפר 的被动式配合介词 ב 表示这些祭物是行赎罪礼所用的媒介；此译保留工具含义，并避免把原文没有明说的受益者加入正文。
- source_word: לְמַלֵּא אֶת יָדָם
  choice: 好承接圣职
  rationale: 字面为“使他们的手充满”，在祭司礼仪中是授予、确立祭司职分的专门用语；“承接圣职”自然表达其就职含义。
- source_word: לְקַדֵּשׁ אֹתָם
  choice: 成为圣洁
  rationale: 此处指亚伦和他儿子借礼仪被分别为圣，供神圣职事；保留“圣”这一核心词义。
- source_word: וְזָר
  choice: 但非祭司
  rationale: זר 在祭司礼仪法规中指不属于获准参与者的人，并非主要指异族人；结合本节语境译为“非祭司”最清楚。
- source_word: לֹא יֹאכַל
  choice: 不可吃
  rationale: 直接表达律法禁令，宾语由上下文补明为祭物。
- source_word: כִּי קֹדֶשׁ הֵם
  choice: 因为这些祭物是圣的
  rationale: 说明禁止非祭司食用的原因；复数代词所指是前述祭物，明确补出可避免中文指代含混。
theological_decisions:
- issue: 祭祀语境中 כפר 的译法
  choice: 行赎罪礼
  alternative: 施行遮罪／用来赎罪
  rationale: “赎罪礼”既保留该词的祭祀与神学分量，也避免把其意义缩限为某一种赎罪理论。原文明确祭物是施行此礼的媒介，却未在本分句明说“为他们”，故不补入正文。
- issue: 祭司惯用语 מִלֵּא יָד 的译法
  choice: 承接圣职
  alternative: 使他们的手充满／授予他们圣职
  rationale: 这是祭司就职的技术性惯用语，不能按字面理解；“承接圣职”传达就任祭司职分的意义，又不引入后世宗派制度。
- issue: זר 的礼仪身份范围
  choice: 非祭司
  alternative: 外人／未经授权的人
  rationale: 本章讨论亚伦及其儿子的祭司承接礼，禁令针对不属于祭司群体的人；此处不是按族裔区分本地人与外邦人。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规语体。“祭物”“承接圣职”“成为圣洁”保持祭司语境的神圣色彩，同时避免生硬逐字翻译。所有脚注标记均置于对应正文词组之后。
