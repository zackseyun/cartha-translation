revisions:
- from: 他们要吃那些用来行赎罪礼的祭物[a]，好承接圣职[b]，成为圣洁；但非祭司不可吃[c]，因为这些祭物是圣的。
  to: 他们要吃那些用来行赎罪礼的祭物[a]，为使他们承接圣职[b]并被分别为圣；但未经授权的人不可吃这些祭物[c]，因为这是圣物。
  rationale: 修订明确两项礼仪目的均以“他们”为对象，并以“被分别为圣”反映原文的使役性。又将“非祭司”改为较不限定的“未经授权的人”，以保留זר的礼仪性范围。补出“这些祭物”使禁止的宾语在中文中明确；“这是圣物”自然表达原文“因为它们是圣的”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:46Z'
review_pass:
  verdict: revise
  source_fidelity: “用来行赎罪礼的祭物”较好地表达了בָּהֶם所示的工具性，且没有把“为他们”作为本分句明说的内容强加进正文。“承接圣职”可传达‘充满他们的手’这一祭司就职惯用语；但“成为圣洁”把使役性的לְקַדֵּשׁ אֹתָם弱化为状态变化，宜明确为“被分别为圣”。וְזָר的范围是礼仪上未经授权者，不应在正文直接收窄为“非祭司”。
