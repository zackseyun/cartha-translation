  terminology: 保留“赎罪礼”“承接圣职”和“分别为圣”，分别对应祭祀性的כפר、祭司就职惯用语和קדשׁ。将“非祭司”改为“未经授权的人”，避免将זר限定为身份类别；脚注说明其非族裔意义。
