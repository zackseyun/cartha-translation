  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: zh_hans
  text: 每天要献一头公牛作赎罪祭[a]，为赎罪之用；在为祭坛行赎罪礼时，要洁净祭坛；又要膏抹它，使它成圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭”也可译作“洁净祭”。希伯来语 חַטָּאת 在献祭语境中可指为除去罪或礼仪上的不洁而献的祭物。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: 一头公牛
  rationale: פַר 指公牛；本处词义本身不要求译出“幼”，故采用自然明确的“一头公牛”。
- source_word: חַטָּאת
  choice: 赎罪祭
  rationale: 在献祭语境中，חַטָּאת 指处理罪与不洁的祭物；“赎罪祭”是现代中文读者较熟悉的礼仪用语，同时以脚注保留“洁净祭”的可能译法。
- source_word: לַיּוֹם
  choice: 每天
  rationale: 结合连续多日举行的承接圣职礼，表达逐日重复的行动；“每天”简洁自然。
- source_word: עַל הַכִּפֻּרִים
  choice: 用来赎罪
  rationale: כִּפֻּרִים 为复数形式，指赎罪或除污的礼仪；中文以“用来赎罪”自然表达其目的，不生硬保留复数。
- source_word: וְחִטֵּאתָ
  choice: 洁净
  rationale: חטא 的皮埃勒式在祭仪语境中可指除去污秽、使之洁净；宾语是祭坛，因此不宜译成仿佛祭坛犯了罪，而译作“洁净”。
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: מִזְבֵּחַ 在会幕献祭语境中的标准中文对应词。
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: 你为祭坛赎罪时
  rationale: בְּ 加不定词可表时间或方式；译作“……时”保留时间关系。עָלָיו 在此最自然地回指祭坛，中文明确译出以避免代词歧义。
- source_word: וּמָשַׁחְתָּ
  choice: 膏抹
  rationale: מָשַׁח 指施用膏油的分别为圣仪式；“膏抹”保留具体礼仪动作。
- source_word: לְקַדְּשׁוֹ
  choice: 使它成圣
  rationale: קדשׁ 在此表示将祭坛分别出来归于神圣用途；“使它成圣”既贴近原文使役含义，也适合庄重的经文语体。
theological_decisions:
- issue: 如何表达祭仪中的罪、洁净与赎罪，而不引入后期教义范畴
  choice: 将 חַטָּאת 译为“赎罪祭”，将 וְחִטֵּאתָ 译为“洁净”，并保留“为祭坛赎罪”的祭仪表述
  alternative: 将 חַטָּאת 译为“洁净祭”，或将 וְחִטֵּאתָ 译为“除罪”；也可把 בְּכַפֶּרְךָ עָלָיו 理解为“在坛上行赎罪礼”
  rationale: 本节描述借献祭洁净并使祭坛成圣的礼仪。祭坛不是在道德意义上蒙赦免，因此用“洁净”表达祭仪除污；同时保留原文“赎罪”的张力，不把它扩展为某一特定系统神学解释。
- issue: בְּכַפֶּרְךָ עָלָיו 中 עָלָיו 的关系
  choice: 理解为“为祭坛赎罪”
  alternative: 理解为“在祭坛上行赎罪礼”
  rationale: 介词 עַל 配合 כפר 可表达为某对象行赎罪礼，且前文直接对象为祭坛；但“在其上”的空间理解在句法上并非全无可能，因此不作超出上下文的神学发挥。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“每天你都要”体现逐日反复；重复“祭坛”以消除中文代词可能造成的歧义。保留“赎罪—洁净—成圣”的祭仪词汇链，并用脚注呈现 חַטָּאת 的真实词义幅度。
