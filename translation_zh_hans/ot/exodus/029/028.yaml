  text: וְ/הָיָה֩ לְ/אַהֲרֹ֨ן וּ/לְ/בָנָ֜י/ו לְ/חָק עוֹלָ֗ם מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּ/תְרוּמָ֞ה יִהְיֶ֨ה מֵ/אֵ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִ/זִּבְחֵ֣י שַׁלְמֵי/הֶ֔ם תְּרוּמָתָ֖/ם לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: zh_hans
  text: 这要归亚伦和他的子孙，作为以色列人永远应当遵守的定例，因为这是奉献物；这要作为从以色列人所献的平安祭[a]祭物中取出的、献给耶和华的奉献物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。原词含有完整、安康以及关系和谐的意味。
    reason: 说明 שְׁלָמִים 的语义范围，避免传统术语“平安祭”被理解得过窄。
lexical_decisions:
- source_word: וְהָיָה לְאַהֲרֹן וּלְבָנָיו
  choice: 这要归亚伦和他的子孙
  rationale: 原文直译为“这要给亚伦和他的子孙”，在本节祭司所得份额的语境中表示归属；“归”自然地传达法律与礼仪上的分配关系。
- source_word: לְחָק עוֹלָם
  choice: 作为……永远当守的定例
  rationale: חָק 指规定、定例，也可涉及固定所得；עוֹלָם 在礼仪法规中表达长久持续。“永远当守的定例”保留传统法律措辞，同时不作哲学意义上的额外发挥。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对“以色列之子”的自然群体称谓。
- source_word: תְרוּמָה
  choice: 举献
  rationale: 该词指从所有物中分别出来、呈献给神的礼物，并与举起或提取的动作有关。“举献”比笼统的“供物”更能保留其礼仪术语特色，也比“举祭”更清楚地区别于祭牲本身。
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: 从……的平安祭中
  rationale: זִבְחֵי שַׁלְמִים 是祭牲类礼仪用语；“平安祭”是简明且通行的译法。介词 מִן 表明举献取自这些祭物，汉语用“从……中”表达最自然。
- source_word: תְּרוּמָתָם לַיהוָה
  choice: 作为他们献给耶和华的举献
  rationale: 保留第三人称复数所属关系及献礼指向；将יהוה音译为“耶和华”，是现代中文圣经语境中清楚、尊重原文专名性质的表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 上主；雅威
  rationale: 原文使用以色列神的专名。正文采用中文读者熟悉的“耶和华”，既区别于一般称号“主”，也避免把辅音形式的具体读音争议写入正文。
- issue: שְׁלָמִים 的礼仪含义
  choice: 平安祭
  alternative: 团契祭；和好祭；酬恩祭
  rationale: 该词的语义涉及完整、安康及共享团契，不能简单缩减为某一种祭礼动机。“平安祭”保留公认术语，并以脚注提示更宽的语义范围。
- issue: תְרוּמָה 的礼仪性质
  choice: 举献
  alternative: 举祭；奉献物；提献
  rationale: 此处所说的是从平安祭中划出、归给祭司而作为献给神的份额，不宜让“祭”字暗示它本身另为一次献祭。“举献”兼顾礼仪动作和所献份额。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪法规文体。保留原文两次出现“举献”的重复，以呈现其强调作用；调整第二句语序，使“从平安祭中献出”的来源关系在汉语中清楚。脚注标记置于相关“平安祭”信息所在句末。
