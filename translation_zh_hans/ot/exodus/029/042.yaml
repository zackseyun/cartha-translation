base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: zh_hans
  text: 这要在雅威面前、会幕门口，世世代代作为常献的燔祭[a]；我要在那里与你们相会，为要在那里对你说话[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “常献的燔祭”也可译作“经常献的燔祭”或“持续献的燔祭”。这里强调按规定不断延续，并不一定表示献祭动作毫无间断。
    reason: lexical_alternative
  - marker: b
    text: 原文先用复数“与你们”，随后转为单数“对你”；后一个“你”很可能特指摩西。
    reason: source_ambiguity
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: 常献的燔祭
  rationale: עֹלָה是全牲焚烧献上的祭，中文圣经传统及现代宗教语境通常称“燔祭”；תָּמִיד在这里表示按规定持续、定期献上，“常献的”既保留连续性，也避免让人误以为焚烧动作从不间断。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 这是表示规定延续于历代的惯用语；“世世代代”自然、庄重，并准确表达跨越 successive generations 的含义。
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: 会幕门口
  rationale: פֶּתַח指入口；אֹהֶל מוֹעֵד直译为“相会之帐幕”，但“会幕”是准确而通行的简洁名称。“会幕门口”自然表达祭物所在的位置。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי在礼仪和空间语境中表示“在……面前”；以“雅威”音译神圣四字名，保留原文所用的专名。
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: 我要在那里与你们相会
  rationale: יעד的Niphal形式在此表示按约定相会；לָכֶם为第二人称复数，译作“与你们”，并明确译出שָׁמָּה“在那里”。
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: 并在那里对你说话
  rationale: 不定式表达相会的目的；אֵלֶיךָ是第二人称阳性单数，因此用“你”而非“你们”，保留原文人称数的转换。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神圣四字名，而非“主”这一称号；“雅威”较贴近学界通常采用的发音重构，也保留其作为专名的性质。
- issue: “与你们”到“对你”的人称数转换
  choice: 保留复数“你们”和单数“你”的转换
  alternative: 两处都统一译作“你们”或“你”
  rationale: לָכֶם是复数，אֵלֶיךָ是单数。译文不替原文消除这一转换，使读者仍可看见相会对象与直接领受话语者之间可能存在的区别；上下文中单数很可能指摩西，但正文不额外补入其名。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“燔祭”“会幕”保留必要且已通行的礼仪术语；句法稍作调整，使地点、历代持续性和相会目的在中文中层次清楚。所有代词均按希伯来原文的单复数呈现。
