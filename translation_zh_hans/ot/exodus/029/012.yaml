base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: zh_hans
  text: 你要取一些公牛的血，用手指把血抹在祭坛的角上[b]，再把所有的血倒在祭坛的底座旁[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文也可理解为“倒至祭坛的底座处”或“倒向祭坛的底座”。
    reason: lexical_alternative
  - marker: b
    text: “祭坛的角”指祭坛四角上角状的凸起部分。
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 你要取
  rationale: 连词加完成式在连续的礼仪指令中表达命令；“你要取”自然保留程序性和命令语气。
- source_word: מִדַּם הַפָּר
  choice: 些公牛的血
  rationale: 介词 מִן 在此具有部分义，表示从公牛的血中取一部分；“些”在现代汉语中简明传达这一含义。
- source_word: וְנָתַתָּה עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: 抹在祭坛的角上
  rationale: נתן 基本义为“放、置”，但与血、指头和祭坛角连用时，“抹在”自然表达实际动作；保留“角”这一具体礼仪设施名称。
- source_word: בְּאֶצְבָּעֶךָ
  choice: 用指头
  rationale: 介词 בְּ 表示工具；“用指头”准确而自然。
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: 再把其余的血全都倒
  rationale: שׁפך 在此是“倒出、倾倒”。在已取出一部分之后，כָּל הַדָּם 按语境指剩余的全部血；“其余的血全都”避免误解为连已抹出的血也要倒出。
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: 在祭坛的底座旁
  rationale: יְסוֹד 指祭坛的根基或底座；אֶל 表示朝向或到达该处。“底座旁”以自然汉语表达把血倒向祭坛底部的位置，同时保留空间上的轻微不确定性。
theological_decisions:
- issue: 祭坛构造与礼仪动作的具体性
  choice: 保留“祭坛的角”和“底座”等具体称谓
  alternative: 译作“祭坛四角的凸起处”和“祭坛脚下”
  rationale: 原文描述具体的承接圣职礼仪。保留祭坛的实体构造和动作次序，既不把术语泛化，也不加入后来的教义解释。
- issue: “所有的血”与先前所取部分之间的关系
  choice: 按语境译为“其余的血全都”
  alternative: 直译为“所有的血都”
  rationale: 前半句已明确取出一部分血抹在坛角上，因此后半句自然指容器中剩余的全部血；此译法澄清实际礼仪顺序，不改变祭血须全部处理的含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你要……再……”清楚呈现连续礼仪指令；“指头”较“手指”略具经文语体但仍为现代读者熟悉。脚注标记均置于正文对应位置。
