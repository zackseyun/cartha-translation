base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/045.yaml
  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: zh_hans
  text: 我要住在以色列子民[b]中间[a]，作他们的上帝[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “中间”或译“当中”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“以色列的众子”；传统译作“以色列人”。
    reason: lexical_alternative
  - marker: c
    text: 或译“对他们作上帝”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: 我要住
  rationale: שׁכן表示居住、安居。译作“住”自然清楚，也保留上帝亲临并常住于其子民中的含义；不在正文中加入原文没有明说的“住在会幕里”。
- source_word: בְּתוֹךְ
  choice: 中间
  rationale: בְּתוֹךְ用于群体时表示身处他们当中。“在……中间”既自然，又保留空间及群体临在两方面的意味。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子民
  rationale: 该词组直译为“以色列的众子”，在这里指以色列群体。“以色列子民”保留其家族性表达，同时比“以色列的众子”更符合现代汉语。
- source_word: וְהָיִיתִי
  choice: 作
  rationale: היה在这一约的关系公式中表示“成为／作为某人的上帝”。汉语用“作他们的上帝”简洁自然，并非强调状态变化。
- source_word: לָהֶם לֵאלֹהִים
  choice: 他们的上帝
  rationale: 希伯来语字面结构为“对他们作上帝”。汉语所有格表达“他们的上帝”准确传达其关系和立约意味；此处 אֱלֹהִים 指说话的独一上帝，并非“一个神”。
theological_decisions:
- issue: 立约公式的表达
  choice: 作他们的上帝
  alternative: 对他们作上帝
  rationale: 正文采用自然、庄重的汉语立约用语，保留上帝与子民之间的归属关系；脚注列出更贴近希伯来语介词结构的译法。
- issue: 以色列群体的家族性称谓
  choice: 以色列子民
  alternative: 以色列的众子／以色列人
  rationale: “子民”既能指整体群体，也保留 בְּנֵי 的家族性意味；脚注说明原文的阳性复数形式，以免掩盖源语措辞。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我要住”直接有力；“以色列子民”保留源语的家族与群体色彩；“作他们的上帝”符合汉语立约语境。所有脚注标记均置于正文相应词句之后。
