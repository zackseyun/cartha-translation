base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: zh_hans
  text: 我要在那里与以色列子孙相会[a]；并且必因我的荣耀而成为圣洁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列子孙”是希伯来文的传统表达，指以色列人，并非只指男性。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“必因我的荣耀成为圣洁”；动词为阳性单数，但没有明说主语。按上下文，可泛指这里的圣所范围，也可能特指会幕或祭坛；也有少数理解为指亚伦。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: 我要……相会
  rationale: יעד 的尼法勒形在会幕语境中表示按约相会或会面；“相会”自然地保留双方相遇的含义，既不弱化为单纯“临在”，也不扩展为“显现自己”。
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 这是地点副词，回指上文所说的会幕及祭坛所在之处；译作“在那里”简洁自然。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 与以色列子孙
  rationale: 介词 לִ 与“相会”连用，在此表示相会的对象。“以色列子孙”保留 בְנֵי יִשְׂרָאֵל 的盟约性传统表达，同时脚注说明其通常泛指全体以色列人。
- source_word: וְנִקְדַּשׁ
  choice: 必……成为圣洁
  rationale: קדש 的尼法勒形为第三人称阳性单数，表达成为圣洁或被分别为圣。中文以“那里”为语境性主语，可保留原文未明说具体对象的特点。
- source_word: בִּכְבֹדִי
  choice: 因我的荣耀
  rationale: 介词 בְּ 在此可表示施行作用的凭借或原因；“因我的荣耀”表明使该处成为圣洁的是上帝的荣耀，又比“借着”更符合现代汉语表达。
theological_decisions:
- issue: וְנִקְדַּשׁ 的隐含主语
  choice: 以“那里必……成为圣洁”指向当前圣所范围，但不明确限定为会幕或祭坛。
  alternative: 明确译作“会幕必成为圣洁”或“祭坛必成为圣洁”；也有少数理解为亚伦成为圣洁。
  rationale: 希伯来文动词为阳性单数，却没有明说主语；上下文涉及会幕、祭坛以及会幕入口处。译作“那里”能使中文完整，同时最大限度保留所指对象的开放性。
- issue: בְּנֵי יִשְׂרָאֵל 的范围
  choice: 正文译作“以色列子孙”，并用脚注说明即以色列人。
  alternative: 直接译作“以色列人”。
  rationale: 该词组形式上是“以色列的众子”，但作为固定族群称谓通常包括以色列全体人民。正文保留原文意象，脚注交代实际范围，避免误解为仅指男性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“相会”“成为圣洁”保留圣所语境中的正式感；分号使两个并列的希伯来语分句层次清晰。所有脚注标记均置于正文相关语句之后。
