id: EXO.29.41
reference: Exodus 29:41
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: zh_hans
  text: 第二只羊羔要在黄昏[a]献上；要照早晨素祭和奠祭的样式，为它献上素祭和奠祭，作为献给耶和华、蒙悦纳的香气，是火祭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在两个晚上之间”，是指下午较晚或黄昏时分的习语。
    reason: lexical_alternative
  - marker: b
    text: “火祭”也可译为“经火献上的祭”；该希伯来词亦有“食物祭”的理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: 第二只羊羔
  rationale: כֶּבֶשׂ指适合作祭牲的幼羊；“第二只”承接前文早晨所献的第一只羊羔。
- source_word: תַּעֲשֶׂה
  choice: 献上
  rationale: עָשָׂה本义为“做、办理”，在献祭语境中译为“献上”更符合现代汉语，同时保留其礼仪功能。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 在黄昏
  rationale: 该希伯来语习语字面为“在两个晚上之间”，指傍晚至暮色时分；正文采用自然清楚的“在黄昏”，字面形式收入脚注。
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: 照早晨所献的素祭
  rationale: מִנְחָה在此为伴随燔祭献上的谷物祭，汉语传统且准确的礼仪用语是“素祭”。
- source_word: וּכְנִסְכָּהּ
  choice: 和奠祭
  rationale: נֶסֶךְ指倾倒酒液等所献的祭，译作“奠祭”简洁并符合献祭术语。
- source_word: תַּעֲשֶׂה לָּהּ
  choice: 为这只羊羔献上
  rationale: 明确表达希伯来文中的间接受词后缀，说明素祭和奠祭是为该羊羔配献的，避免汉语指代含混。
- source_word: לְרֵיחַ נִיחֹחַ
  choice: 成为悦纳的香气
  rationale: 保留献祭公式中的嗅觉意象及祭物蒙神悦纳的含义，同时避免过于古雅的表达。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该词是献祭类别术语，通常指经火献上的祭物；“火祭”比泛化为“祭物”更能保留原文的礼仪特征。
- source_word: לַיהוָה
  choice: 献给耶和华
  rationale: 以“耶和华”呈现原文中的神圣四字名יהוה，保留其作为盟约之名的专名性质。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 正文直接出现四字神名；采用现代简体中文读者最熟悉的专名“耶和华”，不以称号替代专名。
- issue: רֵיחַ נִיחֹחַ所表达的祭物功效
  choice: 悦纳的香气
  alternative: 馨香之气／令人愉悦的香气
  rationale: “悦纳的香气”既保留原文比喻，也表达祭物为神所接纳；不进一步解释其赎罪或功德机制，以免加入本节未明说的神学结论。
- issue: אִשֶּׁה的祭祀含义
  choice: 火祭
  alternative: 献给神的食物祭／经火献上的祭物
  rationale: 采用“火祭”保留祭物经火献上的礼仪特征，不将其解释为神实际需要食物，也不排除该词词源与具体祭类存在的讨论。
translation_notes:
  register: 采用现代、庄重而清楚的礼仪语体。“素祭、奠祭、火祭”保留《出埃及记》献祭制度所需的术语区分；句法稍作调整，使“为这只羊羔”明确修饰配献的素祭和奠祭。
