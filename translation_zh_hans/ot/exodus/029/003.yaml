base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: zh_hans
  text: 要把这些饼放在一个篮子里[a]，并把这一篮饼连同公牛和两只公绵羊一同带到近前来[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“放在一个篮子上”；在容器语境中，这里是指把饼放入一个篮子里。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“呈到近前”或“献上”。原文是献祭礼仪中常用的“使靠近／带近”一词。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ אוֹתָם עַל סַל אֶחָד
  choice: 要把这些饼放在一个篮子里
  rationale: נתן在此为“放置”；代词所指是上一节列出的饼类，中文明确为“这些饼”有助理解。על与容器连用时表达放入其中，译作“在一个篮子里”自然，并保留אחד的“一个”。
- source_word: וְהִקְרַבְתָּ אֹתָם
  choice: 一起牵到近前
  rationale: 使役词干קרב在礼仪语境中意为“使靠近、带到近前”。由于其后也以公牛和公绵羊为宾语，“牵到近前”适合牲畜，并借“一起”统摄篮中的饼；避免过早把动作限定为实际献上。
- source_word: בַּסָּל
  choice: 饼仍在篮子里
  rationale: ב表示饼被带到近前时仍装在篮中。中文补出“饼仍”以清楚表达希伯来语代词及容器关系，不把篮子误作独立伴随物。
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: 连同公牛和两只公绵羊一起
  rationale: 重复的宾格标记把公牛和两只公绵羊列为הקריב的附加宾语。“连同……一起”清楚呈现并列关系。
- source_word: הַפָּר
  choice: 公牛
  rationale: פר指公牛；此处不必额外限定为“牛犊”。
- source_word: שְׁנֵי הָאֵילִם
  choice: 两只公绵羊
  rationale: איל在献祭语境中为成年公绵羊；译作“公绵羊”比单说“公羊”更明确。
theological_decisions:
- issue: הקריב在献祭语境中的动作范围
  choice: 牵到近前
  alternative: 献上／呈献
  rationale: 本句宾语包括篮中的饼和活牲畜，原文重点是把它们带近；译为“献上”可能把后续宰杀、献祭步骤提前纳入本句，因此保留原词“使靠近”的张力。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。为避免“公羊”可能泛指雄性山羊，使用“公绵羊”。句式稍作重组，把原文“在篮子里”的信息置于分号后，以免中文误读为把公牛和公绵羊也放进篮子。
