  text: וְ/אֶ֨ת הָ/אַ֔יִל תְּנַתֵּ֖חַ לִ/נְתָחָ֑י/ו וְ/רָחַצְתָּ֤ קִרְבּ/וֹ֙ וּ/כְרָעָ֔י/ו וְ/נָתַתָּ֥ עַל נְתָחָ֖י/ו וְ/עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: zh_hans
  text: 要把公绵羊切成块，洗净它的内脏[a]和腿，然后把这些放在肉块和头上[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内脏”所译的希伯来词也可泛指动物的内部部分；在献祭语境中，通常具体指内脏。
    reason: lexical_alternative
  - marker: b
    text: 直译是“放在它的肉块上和它的头上”；也有人理解为“同肉块和头放在一起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: 公绵羊
  rationale: 在献祭语境中，אַיִל指成年的雄性绵羊；“公绵羊”是现代汉语中准确、易懂的表达。
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: 切成块
  rationale: נתח的加强词干在此指为献祭而分割牲畜；“切成块”自然地表达操作过程。
- source_word: קִרְבּוֹ
  choice: 它的内脏
  rationale: קֶרֶב可泛指内部，但在献祭规程中具体指需要清洗的内部器官；“内脏”准确且通俗。
- source_word: כְרָעָיו
  choice: 腿
  rationale: כְּרָעַיִם指牲畜的腿部，尤其可指小腿；“腿”是现代汉语最自然的概括表达。
- source_word: וְנָתַתָּ עַל
  choice: 把这些放在……上
  rationale: עַל的基本意义是“在……上”；这里保留其空间关系，不将之弱化为“与……放在一起”。
- source_word: נְתָחָיו
  choice: 肉块
  rationale: 该词指切割所得的各块；此处用“肉块”可避免汉语中“它的块”之类不自然表达，并明确所指。
- source_word: רֹאשׁוֹ
  choice: 头
  rationale: 直接对应动物的头部；上下文已明确所属，无须重复“它的”。
- source_word: וְ
  choice: 然后
  rationale: 连续的连词连接依次进行的礼仪步骤；在末一动作前译作“然后”，符合现代汉语程序性叙述。
theological_decisions:
- issue: 洗净后的内脏和腿与肉块、头的空间关系
  choice: 放在肉块和头上
  alternative: 同肉块和头放在一起
  rationale: 希伯来语两次使用עַל，字面和通常意义均为“在……上”；本译文保留这一措辞及其可能存在的具体摆放含义，不以礼仪推断将其解释为较宽泛的“与……一起”。
translation_notes:
  register: 采用现代、庄重而易懂的祭礼指令体。“要把……，洗净……，然后……”清楚呈现连续步骤；代词仅在必要处使用，以保持汉语自然流畅。
