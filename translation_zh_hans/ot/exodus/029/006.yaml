  yaml_path: translation/ot/exodus/029/006.yaml
  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: zh_hans
  text: 把头巾戴在他头上，再把圣冠[a]安在头巾上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “圣冠”也可译作“神圣的冠饰”。希伯来语 נֵזֶר 可指分别为圣的冠状标志或饰物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: 戴上
  rationale: שׂים意为“放置、安放”；因宾语是头上所戴的礼冠，汉语用“戴上”最自然，也准确表达礼仪动作。
- source_word: הַמִּצְנֶפֶת
  choice: 礼冠
  rationale: מִצְנֶפֶת指大祭司所戴、以布缠制的头饰。译作“礼冠”既表明其礼仪用途，又避免现代汉语“头巾”可能带来的日常或女性头饰联想；脚注保留“包头巾”这一较具体的形制译法。
- source_word: עַל רֹאשׁוֹ
  choice: 在他头上
  rationale: 直接保留介词短语的具体空间关系；与“戴”结合调整为自然汉语语序。
- source_word: וְנָתַתָּ
  choice: 再把……安在
  rationale: נתן在此表示把物件放置、固定在另一物件上。“安在”适合庄重的礼仪语境；“再”体现连续的操作步骤。
- source_word: אֵת
  choice: 不单独译出
  rationale: 希伯来语直接宾语标记，现代汉语没有对应词；以“把”字结构表达宾语关系。
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: 圣冠
  rationale: נֵזֶר可指因奉献分别为圣而佩戴的冠状标志；הַקֹּדֶשׁ表示其神圣、分别为圣的性质。“圣冠”简洁庄重，并保留“冠”与王权或圣职标志之间的语义张力。
- source_word: עַל הַמִּצְנָפֶת
  choice: 在礼冠上
  rationale: 保留עַל所表达的空间或附着关系，说明圣冠安置在头饰之上。
theological_decisions:
- issue: נֵזֶר הַקֹּדֶשׁ所指物件的性质
  choice: 圣冠
  alternative: 神圣的冠饰／分别为圣的冠冕
  rationale: 经文本身强调这是与圣职分别为圣相关的冠状标志，但未在本节详述其准确形制。正文不将它限定为完整王冠或普通装饰，脚注说明其可能是冠状饰牌。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“礼冠”与“圣冠”有意区分：前者是布制头饰，后者是安在其上的神圣冠饰。正文中的[a]与脚注标记一致。
