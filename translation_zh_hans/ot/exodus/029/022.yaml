source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ מִן הָ֠/אַיִל הַ/חֵ֨לֶב וְ/הָֽ/אַלְיָ֜ה וְ/אֶת הַ/חֵ֣לֶב הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֗רֶב וְ/אֵ֨ת יֹתֶ֤רֶת הַ/כָּבֵד֙ וְ/אֵ֣ת שְׁתֵּ֣י הַ/כְּלָיֹ֗ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן וְ/אֵ֖ת שׁ֣וֹק הַ/יָּמִ֑ין כִּ֛י אֵ֥יל מִלֻּאִ֖ים הֽוּא־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: zh_hans
  text: 你要从这公羊取出脂肪、肥尾、遮盖内脏的脂肪、肝脏的附属部分[a]、两个肾和肾上的脂肪，以及右腿，因为这是承接圣职所用的公羊[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“肝叶”。原文所指的确切解剖部位不能完全确定。
    reason: 保留原文对肝脏相关祭牲部位的真实解剖不确定性，避免正文将其定为特定肝叶。
  - marker: b
    text: 或译“授职礼所用的公羊”或“就职礼所用的公羊”。原文指祭司承接职分礼仪中所用的公羊。
    reason: 说明祭司就职礼仪术语的可行译法，避免读者把“承接圣职”误解为公羊本身具有某种职分。
lexical_decisions:
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 在献祭语境中，指特定取出献上的脂肪部分；“脂肪”直接、清楚，也符合本节逐项列举的表达。
- source_word: אַלְיָה
  choice: 肥尾
  rationale: 特指绵羊富含脂肪的尾部，不只是一般的“尾巴”；“肥尾”保留了解剖和礼仪上的具体性。
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: 遮盖内脏的脂肪
  rationale: 按希伯来语结构直译其覆盖关系；“内脏”是现代汉语中自然且准确的总称。
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: 肝叶
  rationale: 该词所指的确切解剖部位存在争议；正文采用简明而通行的“肝叶”，并以脚注保留不确定性。
- source_word: כְּלָיֹת
  choice: 肾
  rationale: 该名词在此为字面解剖意义，指两个肾。
- source_word: שׁוֹק הַיָּמִין
  choice: 右腿
  rationale: שׁוֹק 指腿部或大腿部的祭肉；“右腿”在现代汉语中自然，并避免把范围过度限定为现代解剖学上的大腿。
- source_word: אֵיל מִלֻּאִים
  choice: 承接圣职所用的公羊
  rationale: מִלֻּאִים 是使祭司就职的礼仪用语；“承接圣职”能表达进入祭司职分的含义，同时避免套用后世特定教会制度。
- source_word: וְלָקַחְתָּ
  choice: 你要……取出
  rationale: 在连续礼仪指令中，连接词加完成式具有命令性；汉语用“你要”自然呈现程序性吩咐。
theological_decisions:
- issue: אֵיל מִלֻּאִים 中祭司就职礼仪术语的表达
  choice: 承接圣职所用的公羊
  alternative: 授职礼所用的公羊；就职礼所用的公羊
  rationale: 本句所指是亚伦及其儿子进入祭司职分的礼仪。“承接圣职”保留其分别为圣并受任供职的语境，却不把后世宗派性的按立制度带入经文；可行的其他译法列入脚注。
- issue: יֹתֶרֶת הַכָּבֵד 的解剖指称
  choice: 肝叶
  alternative: 肝脏的附属部分
  rationale: 原词所指的精确部位并不完全确定。正文采用便于理解的传统性概括，脚注明确其也可泛指肝脏的附属部分，避免把有争议的解剖认定绝对化。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，以“取出……以及……”呈现礼仪清单。保留各脂肪部位的重复，不为追求简练而合并原文项目；“这公羊”承接上下文中已经指定的公羊。
