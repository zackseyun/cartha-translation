  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: zh_hans
  text: 再从摆在雅威[a]面前的无酵饼篮子里取一个圆饼、一个用油做的饼和一个薄饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：YHWH；也常译作“耶和华”。
    reason: 说明四字神名的希伯来文写法，并列出常见的中文替代音译。
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: 一个圆饼
  rationale: כִּכָּר在此指圆形的饼；译作“圆饼”既体现形状，也与后面的חַלָּה和רָקִיק有所区分。
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: 一个用油做的饼
  rationale: 该词组指与油有关的饼，但原文没有明说油是调入、抹上还是以其他方式使用；“用油做的饼”自然，并保留制作方式的适度含混。
- source_word: רָקִיק
  choice: 一个薄饼
  rationale: רָקִיק指薄的饼；“薄饼”比“薄片”更清楚地表明这是饼类食物。
- source_word: מִסַּל הַמַּצּוֹת
  choice: 从……无酵饼篮子里
  rationale: מִן表示来源，סַל是篮子，מַצּוֹת是无酵饼；汉语用“从……篮子里取”补足前文延续而来的动作，使本节片段自然可读。
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: 摆在雅威面前的
  rationale: לִפְנֵי保留“在……面前”的礼仪空间含义；“摆在”根据篮子所处状态自然表达，不改变其基本关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名YHWH，避免用称号代替专名；脚注列出中文传统中的另一常见译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名YHWH；正文采用较贴近“Yahweh”的音译“雅威”，同时用脚注保留读者熟悉的“耶和华”。
- issue: לִפְנֵי的礼仪含义
  choice: 在雅威面前
  alternative: 献在雅威面前
  rationale: 原文只说明篮子位于雅威面前，并未在本短语中明说“献”；因此不把献祭动作加入译文。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“又取”承接上下文中的命令句；“都是……取的”使三个并列食品与来源短语的关系清楚，同时保留原文逐项列举的礼仪精确性。
