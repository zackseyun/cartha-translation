  yaml_path: translation/ot/exodus/029/016.yaml
  text: And you shall slaughter the ram, and take its blood and throw it against the altar all around.
translation:
  language: zh_hans
  text: 你要宰杀这只公绵羊，取它的血，把血泼在祭坛四周。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: 你要宰杀
  rationale: 准确表达祭牲被宰杀的礼仪动作；第二人称单数用“你要”自然传达希伯来语指令形式。
- source_word: הָאָיִל
  choice: 这只公绵羊
  rationale: אָיִל在本段指作为祭牲的公绵羊；“这只”承接上文已经指定的祭牲。
- source_word: וְזָרַקְתָּ
  choice: 洒
  rationale: זָרַק本义涉及投掷、泼洒；在祭坛用血的礼仪语境中，“洒”既自然又能表达将血施于祭坛的动作，不过其动作力度可能强于现代汉语一般的“洒”。
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: 在祭坛四周
  rationale: 表达血被施于祭坛周围各面；不把עַל机械译为“在……上面”，以免误解为只倒在坛顶。
theological_decisions:
- issue: 祭血施用动作的具体方式
  choice: 洒在祭坛四周
  alternative: 泼在祭坛四周／把血甩在祭坛四周
  rationale: 原文זָרַק保留投掷或泼洒的动作感，但本节未进一步规定器具或手法；采用传统且易懂的礼仪表达“洒”，不额外补充细节。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“公绵羊”比单说“公羊”更明确；全句保持简洁，并按希伯来语动作顺序展开。
