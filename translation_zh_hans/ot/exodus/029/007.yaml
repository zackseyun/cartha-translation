  text: 然后，你要拿膏油，把油倒在他头上，膏立他。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 然后，你要拿
  rationale: 连词加完成式在礼仪指令中承接前文，译作“然后”自然体现步骤次序；“你要拿”保留命令语气。
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: 膏油
  rationale: 该组合指用于膏立礼仪的特定用油；“膏油”是简明、自然且具有礼仪含义的现代汉语表达。
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: 倒在他头上
  rationale: יצק在此指倾倒液体；“倒在他头上”直接传达动作及其位置。
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: 膏立他
  rationale: משׁח指以膏抹仪式使人承受职分；“膏立”既保留膏抹动作，也自然表达此处的礼仪性任立。
theological_decisions:
- issue: 倾倒与膏立是否应合并为一个动作
  choice: 分别译出“倒在他头上，膏立他”
  alternative: 译为“把油倒在他头上，借此膏立他”或压缩为“用油膏立他”
  rationale: 希伯来文使用两个并列动词，先叙述倾倒的具体动作，再陈述膏立；分别译出可保留仪式步骤及其意义，而不将二者解释性地合并。
translation_notes:
  register: 采用现代、庄重而易懂的指令体。“然后”体现礼仪程序的推进；句式简洁，保留原文两个并列动作。
