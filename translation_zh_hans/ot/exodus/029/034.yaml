source:
  edition: WLC
  text: וְֽ/אִם יִוָּתֵ֞ר מִ/בְּשַׂ֧ר הַ/מִּלֻּאִ֛ים וּ/מִן הַ/לֶּ֖חֶם עַד הַ/בֹּ֑קֶר וְ/שָׂרַפְתָּ֤ אֶת הַ/נּוֹתָר֙ בָּ/אֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי קֹ֥דֶשׁ הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: zh_hans
  text: 如果承接圣职所献的肉[a]或饼有一点留到早晨，就要把剩下的用火焚烧，不可吃，因为这是圣物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “承接圣职”也可译作“授职”或“分别为圣”。希伯来语此词指祭司就职的礼仪。
    reason: 说明祭司礼仪术语הַמִּלֻּאִים的语义范围，并保留可行译法。
lexical_decisions:
- source_word: יִוָּתֵר
  choice: 有一点留到
  rationale: 该词是יתר的尼法勒式，表示某物剩下或被留下；结合条件句译为“有一点留到”，自然表达任何剩余物留存至早晨的情形。
- source_word: בְּשַׂר
  choice: 肉
  rationale: 原义为“肉、肉体”；在祭物语境中，现代汉语用“肉”比“肉体”自然准确。
- source_word: הַמִּלֻּאִים
  choice: 承接圣职所献的
  rationale: 该词在本章指祭司就职、承接圣职的礼仪。这里修饰“肉”，译作“承接圣职所献的肉”，既说明礼仪背景，也避免生硬直译为“充满之礼的肉”。
- source_word: לֶּחֶם
  choice: 饼
  rationale: 在本章祭司承接圣职礼的献物语境中，所指是礼仪用的烘制饼食，译为“饼”比泛称“食物”更具体，也符合上下文。
- source_word: עַד הַבֹּקֶר
  choice: 留到早晨
  rationale: 保留עַד所表达的时间界限。
- source_word: וְשָׂרַפְתָּ
  choice: 就要……用火焚烧
  rationale: 连接词与完成式在条件句后引出结果；“就要”清楚表达条件—结果关系，并保留律法语气。
- source_word: הַנּוֹתָר
  choice: 剩下的
  rationale: 名词化分词，统指前述剩余的肉或饼；译法简洁自然。
- source_word: בָּאֵשׁ
  choice: 用火
  rationale: 介词在此表工具或方式，“用火焚烧”符合现代汉语习惯。
- source_word: לֹא יֵאָכֵל
  choice: 不可吃
  rationale: 被动未完成式在律法语境中表达禁令；汉语“不可吃”简练而庄重，不必机械保留被动形式。
- source_word: קֹדֶשׁ
  choice: 圣物
  rationale: 原文是名词“圣物/神圣之物”，不是形容词形式；译作“圣物”准确保留其礼仪类别含义，并与单数代词所统摄的剩余祭物相合。
theological_decisions:
- issue: 祭司礼仪术语הַמִּלֻּאִים的译法
  choice: 承接圣职所献的
  alternative: 分别为圣礼所献的；授职礼所献的
  rationale: 该词源于“充满”的词根，在祭司语境中涉及“把手充满”这一授职表达，实际指祭司就职、承接圣职的礼仪。正文采用现代中文圣经语境中易懂且较传统的“承接圣职”，脚注保留其他可行表述，不引入特定宗派的圣职观。
- issue: קֹדֶשׁ的名词性表达
  choice: 这是圣物
  alternative: 这是神圣的
  rationale: 原文使用名词קֹדֶשׁ，强调剩余祭物属于圣物范畴，因此不能食用；“圣物”比形容词式译法更贴近原文，但不进一步界定其圣洁等级。
translation_notes:
  register: 采用简洁庄重的现代标准汉语，保留律法条文的条件—结果结构。“饼”“焚烧”“圣物”等用语兼顾礼仪语境与普通读者的可理解性；脚注标记紧随其实际解释的术语，而非置于时间短语之后。
