  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּעֲשֶׂ֖ה עַל הַ/מִּזְבֵּ֑חַ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנַ֥יִם לַ/יּ֖וֹם תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/038.yaml
  text: 'This is what you shall offer on the altar: two one-year-old lambs each day continually[a][b][c].'
translation:
  language: zh_hans
  text: 这是你要献在祭坛上的：每天两只一岁的羊羔，恒常献上[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这是你要在祭坛上做的。”希伯来语动词的基本意思较宽，可译作“做、行”；这里按献祭语境译为“献”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“年之子”，意思是一岁的羊羔。
    reason: lexical_alternative
  - marker: c
    text: 或译：“每日恒常献上。”这里指每天有规律地持续献祭。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר
  choice: 这是……的
  rationale: 以自然的现代汉语引出下文规定；不另加原文没有的时间副词。“这”保留其指示和引介作用。
- source_word: תַּעֲשֶׂה
  choice: 你要献
  rationale: 该动词本义宽泛，可指“做、行”；在祭坛和祭牲的语境中译为“献”能准确表达献祭行为，同时在脚注保留较直译的可能。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 在祭坛上
  rationale: 准确、自然地表达祭坛是实施献祭的所在。
- source_word: כְּבָשִׂים
  choice: 羊羔
  rationale: 该词指幼羊；“羊羔”是现代汉语中自然且符合祭牲语境的表达。原文此处未另用词明确强调性别，故正文不增添“公”。
- source_word: בְּנֵי שָׁנָה
  choice: 一岁的
  rationale: 这是希伯来语年龄表达“年之子”的自然汉语对应，清楚保留祭牲年龄要求。
- source_word: שְׁנַיִם
  choice: 两只
  rationale: 直译数词，并采用适合动物的汉语量词。
- source_word: לַיּוֹם
  choice: 每天
  rationale: 自然表达其逐日、每日的分配意义。
- source_word: תָּמִיד
  choice: 恒常献上
  rationale: 在礼仪语境中表示持续而有规律地进行，并非每一刻不间断；补出“献上”使汉语语义归属清楚。
theological_decisions:
- issue: תָּמִיד 所表达的持续性
  choice: 恒常献上
  alternative: 不断地献上／每日常献
  rationale: 这里规定的是每天有规律地持续献祭，而非声称献祭动作昼夜每刻都不停止；“恒常”保留持续性，也避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“祭坛”“羊羔”“献上”符合经文礼仪语境，又不显古奥。正文保留三个脚注标记，并让“恒常献上”明确修饰每日献祭的持续惯例。
