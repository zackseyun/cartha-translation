base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: zh_hans
  text: 你要宰杀那只公绵羊，取些羊血，抹在亚伦的右耳垂[a]上，也抹在他儿子们的右耳垂上，以及他们右手的大拇指和右脚的大脚趾上；然后把血泼[b]在祭坛的四面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“耳尖”。希伯来语这个词可以泛指耳朵的末端，不过在这里的礼仪语境中，“耳垂”最为可能。
    reason: lexical_alternative
  - marker: b
    text: 或译“洒”。希伯来语动词表示把血有力地施到祭坛上，不是轻轻地撒几滴。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: 宰杀
  rationale: 在献祭语境中，“宰杀”比泛指的“杀死”更准确，也符合现代汉语的自然表达。
- source_word: אַיִל
  choice: 公绵羊
  rationale: 明确表达献祭牲畜的种类和性别，现代读者容易理解。
- source_word: מִדָּמוֹ
  choice: 取些羊血
  rationale: 介词 מִן 在此表示从羊血中取一部分；“取些羊血”自然传达这一含义。
- source_word: תְּנוּךְ אֹזֶן
  choice: 耳垂
  rationale: תְּנוּךְ 指耳朵的末端部位；在祭司礼仪语境中，“耳垂”最可能，也最符合现代汉语习惯，同时以脚注保留“耳尖”的可能。
- source_word: הַיְמָנִית
  choice: 右
  rationale: 该形容词分别限定耳、手和脚；汉语自然表达为“右耳垂”“右手”“右脚”。
- source_word: בֹּהֶן יָד
  choice: 大拇指
  rationale: בֹּהֶן 用于手时特指拇指；“大拇指”是清楚自然的现代汉语说法。
- source_word: בֹּהֶן רֶגֶל
  choice: 大脚趾
  rationale: בֹּהֶן 用于脚时指最大的脚趾；“大脚趾”准确且通俗。
- source_word: זָרַק
  choice: 泼
  rationale: 在献祭程序中，该动词表示把血有力地施到祭坛上，并非轻轻地“撒”；“泼”既保留动作力度，又简洁自然。
- source_word: סָבִיב
  choice: 四面
  rationale: 表示血施在祭坛周围各面；“祭坛的四面”避免被误解为祭坛周边的地面。
- source_word: וְ
  choice: 你要／也／以及／然后
  rationale: 连续的 וְ 推进礼仪步骤；按现代汉语句法分别处理，使程序清楚而不机械重复“并且”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“公绵羊”比单说“公羊”更明确；通过“也……以及……”清楚表明亚伦和他儿子们所抹的都是右侧肢体。脚注标记放在实际存在词义问题的“耳垂”和“泼”之后。
