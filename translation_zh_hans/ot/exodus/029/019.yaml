  yaml_path: translation/ot/exodus/029/019.yaml
  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: zh_hans
  text: 然后，你要取第二只公绵羊；亚伦和他的儿子们要把手按在这只公绵羊的头上。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: 然后，你要牵来
  rationale: 连词加完成式在连续的礼仪指示中表达下一步命令。“然后”体现程序推进；鉴于对象是活的公绵羊，用“牵来”比泛泛的“拿”更符合现代汉语习惯。
- source_word: הָאַיִל הַשֵּׁנִי
  choice: 第二只公绵羊
  rationale: אַיִל指公绵羊，הַשֵּׁנִי是序数“第二”，对应本章承接前一只公绵羊的献祭次序。
- source_word: וְסָמַךְ
  choice: 要把手按在
  rationale: סמך在献祭礼仪语境中指把手放在或按在祭牲身上。“按在”既保留动作的具体性，也不额外解释其象征意义。
- source_word: אַהֲרֹן וּבָנָיו
  choice: 亚伦和他的儿子们
  rationale: 这里指参与祭司承接圣职礼的亚伦男性后裔；“儿子们”在现代汉语中准确清楚。
- source_word: אֶת יְדֵיהֶם
  choice: 手
  rationale: 希伯来文为复数并配复数所有后缀，但汉语对多个主体各自所用的手通常自然地用集合性单数“手”；不改变每个人都参与动作的含义。
- source_word: עַל רֹאשׁ הָאָיִל
  choice: 在这只公绵羊的头上
  rationale: 直接表达空间关系；“这只”自然回指本句刚提到的第二只公绵羊。
theological_decisions:
- issue: 是否解释按手礼的神学含义
  choice: 仅译作“把手按在这只公绵羊的头上”
  alternative: 加入代罪、认同、转移罪责或授职等解释
  rationale: 原文只叙述礼仪动作，没有在本节说明其象征意义，因此译文不引入后来的神学解释，保留文本本身的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪指示语体。“牵来”适合活牲畜，“按在”保留原文动作力度，同时避免生硬的直译。
