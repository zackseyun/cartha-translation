  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: zh_hans
  text: 早晨要献一只羊羔；在两个傍晚之间[a]要献第二只羊羔。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在两个傍晚之间”。这是一个传统的时间用语，常被理解为“黄昏”或下午较晚至日落之间的一段时间；其准确所指仍有讨论。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: 羊羔
  rationale: 在献祭语境中指适合作祭物的幼羊；“羊羔”在现代汉语中自然、明确。
- source_word: הָאֶחָד
  choice: 第一只
  rationale: 原文直译为“那一只”，但与后文“第二只”配对时，汉语用“第一只”能自然表达次序，不改变所指。
- source_word: תַּעֲשֶׂה
  choice: 要献
  rationale: עָשָׂה本义为“做、办理”，在献祭指令中表示按礼仪献上祭物；译为“献”准确而自然。
- source_word: בַבֹּקֶר
  choice: 早晨
  rationale: 直接、自然地表达该时间短语。
- source_word: הַשֵּׁנִי
  choice: 第二只
  rationale: 保留原文的序数及其与前一只羊羔的对应关系。
- source_word: בֵּין הָעַרְבָּיִם
  choice: 黄昏
  rationale: 这是现代汉语中自然且较宽泛的时间表达；脚注保留其字面形式及解释上的不确定性。
