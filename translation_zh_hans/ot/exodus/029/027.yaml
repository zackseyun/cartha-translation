  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: zh_hans
  text: 你要将摇祭的胸和举祭[a]的腿分别为圣；它们是从为亚伦和他儿子们承接圣职所用的公羊[b]中取出的：胸是摇过的，腿是举起献上的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “举祭”也可译作“举献的祭物”；传统译法有“举祭”。
    reason: 说明תְּרוּמָה既可侧重被分别献出的供物，也可侧重举起献上的动作。
  - marker: b
    text: 希伯来文直译为“承接圣职的公羊”，指祭司承接圣职仪式中所用的公羊。
    reason: 解释מִלֻּאִים的字面意义与其固定礼仪含义之间的关系。
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: 分别为圣
  rationale: 该词为קדש的Piel形式，表示使某物成为圣、将其分别出来归于神；“分别为圣”在现代中文中既自然，也保留礼仪语境中的圣别含义。
- source_word: חֲזֵה הַתְּנוּפָה
  choice: 作摇祭的胸
  rationale: חֲזֵה指祭牲的胸部；תְּנוּפָה与本节的动词הוּנַף相呼应。“摇祭”保留具体礼仪动作及传统可辨识度。
- source_word: שׁוֹק הַתְּרוּמָה
  choice: 作举祭的腿
  rationale: שׁוֹק指祭牲的腿部，可能偏指大腿；תְּרוּמָה是举起并分别献出的供物。“举祭”保留其献祭类别及与后文“举过”的词语联系。
- source_word: הוּנַף
  choice: 摇过
  rationale: 这是נוּף的Hophal形式，表示被摇动或以摇动方式献上，与“摇祭”直接对应。
- source_word: הוּרָם
  choice: 举过
  rationale: 这是רוּם的Hophal形式，表示被举起，与תְּרוּמָה的举献含义相呼应。
- source_word: אֵיל הַמִּלֻּאִים
  choice: 承接圣职所献的公绵羊
  rationale: 字面为“充满之公绵羊”，是按立祭司仪式的固定习语；“承接圣职所献的公绵羊”自然说明其礼仪用途，并保留祭司就职语境。
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: 从归给亚伦和他儿子们的份中取出的
  rationale: 原文分别提到归亚伦与归其众子的部分。中文用“份”明确其分配意义；合并表达可避免生硬重复，同时不改变两方均有所得的意思。
theological_decisions:
- issue: 献祭礼仪术语的译法
  choice: 保留“摇祭”“举祭”“摇过”“举过”等具体礼仪用语
  alternative: 意译为“呈献的祭物”“特别献上的部分”等一般性说法
  rationale: 希伯来文刻意使两个名词与相应动作相互呼应。保留这些具体词语可呈现祭司礼仪的程序性，也避免用宽泛的奉献概念消解原文区别。
- issue: 末尾所属关系的理解
  choice: 译为从归给亚伦和他儿子们的份中取出
  alternative: 直译为“从属亚伦的和属他儿子们的”
  rationale: 上下文涉及祭物份额的分配；“份”使中文明确通顺，但不进一步断定亚伦与众子各自所得的具体比例。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。以“分别为圣”表达祭仪中的圣别，以“摇祭／摇过、举祭／举过”保存原文名词与动词的对应。末句适度调整语序，避免逐词直译造成歧义。
