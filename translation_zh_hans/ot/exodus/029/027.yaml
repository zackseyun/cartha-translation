revisions:
- from: 你要把作摇祭的胸和作举祭的腿分别为圣[a]；这胸和腿，就是从承接圣职所献的公绵羊[b]中摇过、举过的，是从归给亚伦和他儿子们的份中取出的。
  to: 你要将摇祭的胸和举祭[a]的腿分别为圣；它们是从为亚伦和他儿子们承接圣职所用的公羊[b]中取出的：胸是摇过的，腿是举起献上的。
  rationale: 修订保留原文礼仪术语及名词与动词的对应，同时移除“归给……的份”这一较具体的分配性补充。以“为亚伦和他儿子们承接圣职所用的公羊”自然表达原文在承接圣职礼仪中对二者的关联；用“胸是……，腿是……”明确各自所对应的摇与举。脚注a移至其实际解释的术语后。
