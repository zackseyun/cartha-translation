base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: zh_hans
  text: 然后你要拿这些衣服，给亚伦穿上内袍[a]、以弗得的外袍、以弗得和胸牌[b]，再用以弗得上精巧织成的带子，把以弗得束在他身上。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “内袍”指贴身穿的长衣，也可译作“长衣”。
    reason: lexical_alternative
  - marker: b
    text: 传统译法常作“胸牌”；这个希伯来词指佩在胸前、连于以弗得的物件，并不表示护身的盔甲。
    reason: lexical_clarification
  - marker: c
    text: “束在”所译的希伯来动词较少见，也可理解为“把以弗得固定在他身上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת הַבְּגָדִים
  choice: 然后你要拿来这些衣服
  rationale: 承接礼仪程序的连续指令，以“然后”自然表达句首 waw 的步骤推进；“衣服”清楚易懂，也不引入后世宗教服饰术语。
- source_word: וְהִלְבַּשְׁתָּ אֶת אַהֲרֹן
  choice: 给亚伦穿上
  rationale: 希伯来语使役形表示使亚伦穿戴；现代汉语用“给……穿上”自然保留使役意义。
- source_word: הַכֻּתֹּנֶת
  choice: 内袍
  rationale: 指贴身穿着的长衣；“内袍”既说明其穿着层次，又保持祭司服饰语境中的庄重感。
- source_word: מְעִיל הָאֵפֹד
  choice: 以弗得的外袍
  rationale: 保留原文领属结构，表明这是与以弗得配套的袍服；“外袍”与内袍形成清楚的穿着层次。
- source_word: הָאֵפֹד
  choice: 以弗得
  rationale: 这是特定祭司服饰的专门名称，汉语传统音译能够避免用解释性词语过度限定其具体形制。
- source_word: הַחֹשֶׁן
  choice: 胸牌
  rationale: 指佩在胸前并连于以弗得的礼仪物件；“胸牌”在现代汉语中比“胸甲”更不易让人误解为防护盔甲。
- source_word: וְאָפַדְתָּ לוֹ
  choice: 把以弗得束在他身上
  rationale: אפד 是罕见动词，与给人束上或固定以弗得有关；明说“以弗得”可消除汉语代词所可能产生的指代歧义，同时以“束在”保留其穿戴、固定的动作。
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: 用以弗得的精工腰带
  rationale: חֵשֶׁב 在本语境指以弗得本身的精细织制带子；“精工腰带”兼顾其制作特点和束系功能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的礼仪指令语体。祭司服饰按由内到外的次序列出；专名“以弗得”沿用通行音译。对罕见动词不加入“巧妙地”等原文未必直接表达的副词，而将制作精细的含义归于腰带。
