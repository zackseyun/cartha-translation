base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: zh_hans
  text: “你要这样做，使他们分别为圣，作祭司侍奉我：要取一头小公牛[a]和两只没有残疾的公绵羊[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一头公牛”。希伯来语直译为“一头公牛，牛群的儿子”，是指牛群中牛只的习语，可能带有较年轻的含义。
    reason: lexical_alternative
  - marker: b
    text: 或译：“无瑕疵的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: 这样做
  rationale: 这里的 דָּבָר 指下文所述之事或程序。汉语用“你要这样做”自然承接具体礼仪指示，也保留指令语气。
- source_word: תַּעֲשֶׂה
  choice: 你要……做
  rationale: 未完成式在此具有指令功能；“你要”符合现代汉语律例文体，庄重而不生硬。
- source_word: לְקַדֵּשׁ
  choice: 使他们分别为圣
  rationale: 在祭司礼仪语境中，קדשׁ 指将人分别出来归于神并用于神圣职分；“分别为圣”既清楚又保留其礼仪与神学内涵。
- source_word: לְכַהֵן לִי
  choice: 作祭司侍奉我
  rationale: כהן 的动词形式表示履行祭司职分；此译同时保留祭司身份、职能及侍奉对象。
- source_word: לְקַח
  choice: 取
  rationale: 直接表达命令所要求取得并预备祭牲的动作，符合礼仪指示的简洁文体。
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: 一头公牛犊
  rationale: פַּר 是公牛，בֶּן־בָּקָר 是指牛群中较幼的牛的习语。“公牛犊”简洁表达其性别和较年轻的含义，同时以脚注保留另一种较宽泛理解。
- source_word: אֵילִם שְׁנַיִם
  choice: 两只……公绵羊
  rationale: אֵיל 明指成年公羊；“公绵羊”在现代汉语中明确区别于山羊，数词“两只”对应原文。
- source_word: תְּמִימִם
  choice: 没有残疾的
  rationale: 在献祭语境中，תמים 指祭牲没有身体缺陷。“没有残疾”通俗清楚，并以脚注注明“无瑕疵”这一常见礼仪表达。
theological_decisions:
- issue: 祭司职分用语
  choice: 作祭司侍奉我
  alternative: 给我供祭司的职分
  rationale: 所用措辞直接表达这些人要在神面前履行祭司职分，不引入后期教会职制或宗派性观念。
- issue: 成圣用语
  choice: 使他们分别为圣
  alternative: 使他们成圣
  rationale: “分别为圣”凸显本节礼仪语境中的归属与设立，同时不把该词缩减为单纯的道德完善。
translation_notes:
  register: 采用现代、庄重而易懂的律例文体。“你要这样做”自然引出礼仪程序；“分别为圣”和“作祭司侍奉我”保留祭司设立的神圣归属与职能。脚注标记均置于正文相关词语之后。
