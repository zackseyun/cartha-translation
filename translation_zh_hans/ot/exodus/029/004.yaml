translation:
  language: zh_hans
  text: 你要把亚伦和他的儿子们带到会幕的入口处[a]，并用水洗他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使亚伦和他的儿子们近前来。”原文动词可指带人上前；在这里也可能带有使人上前接受礼仪行动的正式意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: 使……近前来
  rationale: 这是קרב的使役式，既表示把人带近，也可在祭司承接圣职的语境中带有使其上前、呈上的礼仪意味。“使……近前来”保留了动作方向和礼仪色彩。
- source_word: אֶל פֶּתַח
  choice: 到……门口
  rationale: אֶל表示朝向目的地的移动；פֶּתַח指入口或门口，并不特指有门扇的门。“到……门口”符合现代汉语表达。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 该词组直指指定与上帝相会之帐幕；“会幕”是简体中文圣经语境中准确、简洁而通行的名称。
- source_word: וְרָחַצְתָּ אֹתָם
  choice: 并用水洗他们
  rationale: רחץ表示洗或沐洗；连接词在礼仪程序中承接下一步行动，因此译作“并……”。
- source_word: בַּמָּיִם
  choice: 用水
  rationale: 介词ב在此说明洗涤所用的媒介或方式；“用水”比逐字译作“在水里”更自然，也不额外限定浸入水中的方式。
- source_word: אַהֲרֹן וְאֶת בָּנָיו
  choice: 亚伦和他的儿子们
  rationale: 采用通行人名“亚伦”；בנים在本段祭司承接圣职的语境中特指亚伦的男性后代，故译“儿子们”。
theological_decisions:
- issue: 祭司承接圣职语境中קרב的礼仪含义
  choice: 使亚伦和他的儿子们近前来
  alternative: 把亚伦和他的儿子们呈上
  rationale: 原文既可表达带近，也可能含有为礼仪行动而使人上前、呈到指定地点的意味。正文保留“近前”的空间意象，不把礼仪含义过度明确化；脚注列出“呈上”这一可能译法。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪指令语体。“近前来”略带庄重色彩，用以保留原文的空间方向及承接圣职语境；“会幕”采用通行术语。
