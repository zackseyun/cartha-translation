base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: zh_hans
  text: 亚伦对他们说：“把你们妻子、儿子和女儿耳朵上的金环摘下来[a]，拿到我这里来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“扯下……”。希伯来文这个动词可含有用力除下或掰下饰物的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם אַהֲרֹן
  choice: 亚伦对他们说
  rationale: 以自然的现代汉语推进叙事；保留希伯来文明确的复数代词“他们”，不将其解释性替换为“百姓”。
- source_word: פָּרְקוּ
  choice: 摘下来
  rationale: 该动词在这里指从耳朵上除下饰物。“摘下来”符合现代汉语习惯；其可能含有用力扯下或掰下的较强语气，收入脚注保存。
- source_word: נִזְמֵי הַזָּהָב
  choice: 金环
  rationale: נֶזֶם 泛指环状饰物，可指鼻环或耳环；下文已明确说在耳朵上，因此译作“金环”，既避免不必要的重复，也保留词义范围。
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: 耳朵上的
  rationale: 直译为“在耳朵里的”在现代汉语中较生硬；“耳朵上的”准确而自然地表达饰物所在之处。
- source_word: נְשֵׁיכֶם בְּנֵיכֶם וּבְנֹתֵיכֶם
  choice: 你们妻子、儿子和女儿
  rationale: 逐一保留原文的家庭成员类别和性别区分；此处 נָשִׁים 依家庭关系语境译作“妻子”。
- source_word: וְהָבִיאוּ אֵלָי
  choice: 拿到我这里来
  rationale: 自然表达“带到我这里”的趋向；宾语由上文“金环”承接，汉语无须重复代词。
theological_decisions: []
