- from: 于是，耶和华不再降下他所说要加给自己百姓的灾祸[a][b]。
  to: 于是，耶和华就转意[a]，没有把他所说要降在自己百姓身上的灾祸[b]施行出来。
  rationale: 修订使正文直接对应וַיִּנָּחֶם，同时以脚注保留该词可译为“改变心意”“后悔”等的语义张力。将灾祸改为“降在自己百姓身上”，使对象关系更自然、明确；“施行出来”对应“所说要做”，不将动词本身限定为“降下”。
