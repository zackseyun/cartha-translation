  text: וַ/יִּנָּ֖חֶם יְהוָ֑ה עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר לַ/עֲשׂ֥וֹת לְ/עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: zh_hans
  text: 于是，耶和华就转意[a]，没有把他所说要降在自己百姓身上的灾祸[b]施行出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转意”或译“改变心意”“后悔”或“收回原意”。希伯来文此处表示不再实行先前宣告的行动。
    reason: alternative_reading
  - marker: b
    text: “灾祸”：希伯来文也可译“祸患”或直译“恶”；这里指所宣告的灾难或伤害，并非指上帝在道德上作恶。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: 不再降下
  rationale: 该动词的尼法勒形在这里表示转离先前宣告的行动。结合后面的“灾祸”，译为“不再降下”在现代汉语中自然地表达撤回所宣告的惩罚，同时不过度界定这是“改变主意”还是“后悔”；其他可能译法见脚注。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的神圣名字译法“耶和华”，而非以“主”这一称号替代专名。
- source_word: עַל הָרָעָה
  choice: 所说要……的灾祸
  rationale: רָעָה 在审判语境中指将临的灾难或祸患，并非指上帝的道德邪恶。中文将介词关系融入关系从句，使句子自然。
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת
  choice: 他所说要……降下
  rationale: 保留“曾说要做”的宣告含义；用“降下”搭配“灾祸”符合现代汉语习惯，但脚注说明希伯来文直译为“做”。
- source_word: לְעַמּוֹ
  choice: 加给自己百姓
  rationale: 介词标明灾祸所影响的对象。“自己百姓”清楚指回耶和华，并保持原文所属关系。
theological_decisions:
- issue: נחם 用于上帝时所呈现的拟人化情感与行动转变
  choice: 正文译作“不再降下”，表达上帝确实没有实施先前宣告的灾祸。
  alternative: “回心转意”“改变心意”或“后悔”
  rationale: 原文叙事呈现摩西代求之后，上帝所宣告的行动发生真实转变。正文不借译词解决关于上帝是否改变的系统神学问题；脚注保留该动词更直接但神学张力更明显的译法。
- issue: רָעָה 是否暗示上帝施行道德上的恶
  choice: 译为“灾祸”。
  alternative: 直译为“恶”或译为“祸患”
  rationale: 此处指受威胁的灾难性审判，而非上帝的道德邪恶；脚注保留原词的语义范围，避免误解。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接摩西代求的上下文；正文简洁呈现行动结果，并以脚注保存 נחם 的多义性及 רָעָה 的词义张力。
