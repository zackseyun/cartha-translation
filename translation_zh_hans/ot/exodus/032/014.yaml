  naturalness: “加给自己百姓”在现代汉语中略显生硬；“降在自己百姓身上”是与“灾祸”自然搭配的表达。“施行出来”在此用于补足“所说要……的灾祸”的句法关系，语义仍对应原文“要做”。
  terminology: “耶和华”作为יהוה的既定中文专名可保留。“灾祸”准确表达此处הָרָעָה所指的威胁性灾难，不指道德意义的恶。
