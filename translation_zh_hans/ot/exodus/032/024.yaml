base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: zh_hans
  text: 我对他们说[a]：“谁有金子，就摘下来。”他们就交给了我；我把金子扔进火里，这头牛犊就出来了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我对他们说：‘谁有金子？摘下来！’”希伯来文直译为“谁有金子？取下来”。
    reason: 原句 לְמִי זָהָב הִתְפָּרָקוּ 可理解为不定条件式命令，也可按问句加命令来断句。
lexical_decisions:
- source_word: וָאֹמַר לָהֶם
  choice: 我对他们说
  rationale: 按叙事次序直译，同时用现代汉语自然表达说话对象。
- source_word: לְמִי זָהָב
  choice: 谁有金子
  rationale: 希伯来语字面为“金子归谁所有”，这里自然表示“谁有金子”；保留其可作问句或不定条件表达的空间。
- source_word: הִתְפָּרָקוּ
  choice: 就摘下来
  rationale: 该词在本语境指从自己身上取下金饰；“摘下来”自然清楚，又不额外补入原文未明说的“首饰”。
- source_word: וַיִּתְּנוּ לִי
  choice: 他们就交给了我
  rationale: “交给”准确表达 נתן 加间接受词“给我”；金子作为承前省略的宾语，在中文里无需重复。
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: 我把金子扔进火里
  rationale: 将阳性单数后缀按集合意义明确为前述金子；“扔进火里”符合现代汉语的动作方向表达。
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: 这牛犊就出来了
  rationale: 依原文直陈“出来”，不添加“奇迹般”“竟然”等解释，让亚伦说辞的推诿意味由上下文显出。
theological_decisions:
- issue: 亚伦对偶像来源的推诿性叙述
  choice: 不加解释，直译为“这牛犊就出来了”
  alternative: 在正文加入“竟然”“自己”或“奇迹般”等带解释色彩的词
  rationale: 原文只记录亚伦的话，并未明说其语气或评价；译文应保留叙事反讽和神学张力，不替读者裁定。
- issue: עֵגֶל 的指称
  choice: 牛犊
  alternative: 小公牛
  rationale: “牛犊”准确、通行，并与本段偶像的传统称谓一致；原词本身可指幼牛，但本节无须进一步限定性别。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“摘下来”贴合佩戴金饰的语境；末句保持简洁直陈，以保留亚伦辩解中原有的荒诞与推诿感。
