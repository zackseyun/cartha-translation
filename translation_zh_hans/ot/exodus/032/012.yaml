  source_fidelity: 主句“为什么要让埃及人说”把 לָמָּה יֹאמְרוּ 的反问式预期误作“为何允许”，宜改为“埃及人为什么要说”。末段原译将“转离烈怒”扩写为“回心转意，止住烈怒”，再另译 וְהִנָּחֵם 为“改变心意”，造成语义重复；应分别对应两个祈使语气。
  naturalness: “把他们从地面上彻底除灭”略显生硬；“把他们从地上灭尽”更符合现代汉语，也保留完全毁灭及“从地上”的意象。“转离你的烈怒”庄重、自然，且不增添原文未明说的“止住”。
  terminology: “埃及人”“领出来”“恶意”“烈怒”“灾祸”“百姓”均恰当。采用“改变心意”可如实保留对上帝所用的拟人化祈求语言，而不诉诸带有道德过失含义的“后悔”。
  issues:
