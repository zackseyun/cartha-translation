revisions:
- from: 为什么要让埃及人说[a]：‘他怀着恶意把他们领出来，是要在群山中杀死他们，把他们从地面上彻底除灭[b]’？求你回心转意，止住烈怒；求你改变心意，不把这灾祸降给你的百姓[c]。
  to: 埃及人为什么要说[a]：“他怀着恶意把他们领出来，是要在群山中杀死他们，把他们从地上灭尽[b]”呢？求你转离你的烈怒，改变心意，不把这灾祸降给你的百姓[c]。
  rationale: 修订反问句，除去“让”所引入的许可义；将“转离烈怒”和“改变心意”分别对应原文两个连续祈使语气；并以更自然的现代汉语表达完全毁灭。脚注锚点仍分别紧随相关译语，且保留原文在神人关系语言中的张力。
