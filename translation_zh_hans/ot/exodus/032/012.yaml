    rationale: 原文是“埃及人为什么要说”的反问式恳求，并非询问为何让或允许他们说话。
  - severity: medium
    issue: “回心转意，止住烈怒；求你改变心意”重复翻译转向／改变之意。
    rationale: שׁוּב 应对应从烈怒转离；וְהִנָּחֵם 则是就将临灾祸改变心意／收回。原译的“回心转意”已提前占用了后一动词的核心意思。
  - severity: low
