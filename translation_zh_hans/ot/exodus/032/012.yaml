base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: zh_hans
  text: 埃及人为什么要说[a]：“他怀着恶意把他们领出来，是要在群山中杀死他们，把他们从地上灭尽[b]”呢？求你转离你的烈怒，改变心意，不把这灾祸降给你的百姓[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “怀着恶意”也可译作“为要加害”或“出于恶意”；这是埃及人会归给上帝的动机。
    reason: lexical_alternative
  - marker: b
    text: “灭尽”也可译作“彻底除灭”。原文动词强调完全毁灭。
    reason: lexical_alternative
  - marker: c
    text: “改变心意，不把这灾祸降给”也可译作“回转，不降这灾祸”。原文以人的情感和行动语言表达摩西对上帝的恳求。
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: 为什么要让埃及人说
  rationale: 体现反问式恳求的语气；“埃及人”指埃及百姓，而非地名。
- source_word: בְּרָעָה
  choice: 怀着恶意
  rationale: 表达埃及人所归咎于上帝的恶意动机，而不只是行为造成的坏结果。
- source_word: הוֹצִיאָם
  choice: 把他们领出来
  rationale: 符合使役形在出埃及语境中的含义；中文“领出来”自然清楚。
- source_word: בֶּהָרִים
  choice: 在群山中
  rationale: 保留复数“山岭、群山”的地貌含义。
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: 把他们从地面上彻底除灭
  rationale: כלּה 的加强词干表示完全毁灭；同时保留“从地面上”的希伯来意象。
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: 回心转意，止住烈怒
  rationale: שׁוב 表示从当前的震怒与行动方向转回；“烈怒”自然传达原文怒气炽烈的比喻。
- source_word: וְהִנָּחֵם עַל הָרָעָה
  choice: 改变心意，不把这灾祸降给
  rationale: 保留摩西恳求上帝改变所宣告行动的拟人表达；רעה 在此指将临的灾害，而非上帝的道德邪恶。
theological_decisions:
- issue: וְהִנָּחֵם 对上帝所用的拟人化表达
  choice: 求你改变心意
  alternative: 求你后悔／求你收回成命
  rationale: “改变心意”直接保留恳求的真实张力，又不暗示上帝犯了道德错误；不以系统神学预先消解经文本身的表达。
- issue: הָרָעָה 用于上帝所宣告的行动
  choice: 这灾祸
  alternative: 这祸患／这恶事
  rationale: 此处指临到百姓的毁灭性灾害；“灾祸”避免让现代读者误解为上帝施行道德上的恶。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“求你”两次出现，使摩西迫切代求的语气清晰；分号划分两个并列祈求。脚注标记均置于相关主文之后。
