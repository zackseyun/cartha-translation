  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן מֶֽה עָשָׂ֥ה לְ/ךָ֖ הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי הֵבֵ֥אתָ עָלָ֖י/ו חֲטָאָ֥ה גְדֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: zh_hans
  text: 摩西对亚伦说：“这百姓对你做了什么，你竟使他们陷入大罪之中[a]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使他们陷入大罪之中”直译为“把大罪带到他们身上”。原文用单数代词回指作为整体的“百姓”；汉语按其复数含义译作“他们”。
    reason: 说明原文的使役表达及集合名词所对应的单数代词，同时保留“犯罪”与“罪责临到”之间的语义空间。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是希伯来叙事中常见的连续式动词；现代汉语通常无需逐字译出句首的“于是/并且”，用“说”即可自然承接上下文。
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: 这百姓对你做了什么
  rationale: 保留疑问词、指示语“这”和 עָשָׂה לְךָ“对你做”的基本含义；“这百姓”也传达摩西言语中略带疏离和责问的语气。
- source_word: כִּי
  choice: 竟
  rationale: 此处引出前面问题所追问的结果或缘由。汉语用“竟”自然表达摩西责问的力度，又不把关系过度限定为单纯因果。
- source_word: הֵבֵאתָ עָלָיו
  choice: 使他们陷入
  rationale: הֵבֵאתָ 是 בוא 的使役形，核心意思是“使来到、带来”；这里指亚伦使作为整体的百姓落入罪中。“他们”按集合名词“百姓”的实际所指处理。
- source_word: חֲטָאָה גְדֹלָה
  choice: 大罪
  rationale: חֲטָאָה 指罪或过犯，גְדֹלָה 表示重大；“大罪”简洁保留原文的道德分量，不额外强化。
theological_decisions:
- issue: 亚伦的责任以及“大罪”临到百姓的含义
  choice: 使他们陷入大罪之中
  alternative: 把大罪带到他们身上／使他们担当大罪
  rationale: 译文明确保留原文对亚伦责任的直接追究，但不进一步断定这里着重指诱使百姓犯罪、使罪责临到他们，还是两者兼有；脚注提供较贴近字面的表达，以保留语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你竟……”体现摩西严厉责问的语气；不使用生硬的逐字式“带罪到他们身上”，正文以自然汉语表达，脚注保留字面结构与潜在歧义。
