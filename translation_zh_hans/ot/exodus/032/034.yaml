  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: zh_hans
  text: 现在你去吧，带领这百姓到我所告诉你的地方。看哪，我的使者必走在你前面；到了我追讨的日子，我必追讨他们的罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 承接上文并转入当前命令；汉语不必机械译出连接词“而”。
- source_word: נְחֵה
  choice: 带领
  rationale: 准确表达使役、引导百姓前往目的地的命令，符合现代汉语圣经叙事语体。
- source_word: אֶל אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: 到我所告诉你的地方
  rationale: 原文省略明确的地点名词；补出“地方”使汉语自然，同时保留目的地未明说的特点。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示和强调功能，采用庄重而仍可理解的传统表达。
- source_word: מַלְאָכִי
  choice: 我的使者
  rationale: מַלְאָךְ 基本义为受差遣的使者，也可按语境指天使；“使者”避免超出本节所明说的身份。
- source_word: יֵלֵךְ לְפָנֶיךָ
  choice: 必走在你前面
  rationale: 保留空间意象及引导含义；未扩大为具体的护卫或同在承诺。
- source_word: בְּיוֹם פָּקְדִי
  choice: 到了我追讨的日子
  rationale: פקד 在此语境指监察后追究责任；“追讨”兼具追究和惩处意味，并保留其审判张力。
- source_word: וּפָקַדְתִּי עֲלֵיהֶם חַטָּאתָם
  choice: 我必追讨他们的罪
  rationale: 以同一词根对应“追讨”，保留原文 פקד 的重复；“他们的罪”明确追讨所针对的是其罪责。
theological_decisions:
- issue: מַלְאָכִי 的身份
  choice: 译作“我的使者”
  alternative: “我的天使”
  rationale: 原文词汇本身可指人间或天上使者，本节没有进一步界定；不在译文中预先解决其身份。
- issue: פקד 的审判含义
  choice: 两处均译作“追讨”
  alternative: “惩罚”或“叫……交账”
  rationale: “惩罚”容易把词义收窄为刑罚结果，“交账”则偏解释性；“追讨”更能保留查究罪责并施行审判的含义，也再现原文重复。
- issue: 延迟审判与赦免之间的张力
  choice: 保留“到了……日子，我必……”的延期表述
  alternative: 解释为罪已获赦但仍有暂时后果，或解释为完全未获赦
  rationale: 本节只宣告未来追讨，没有系统说明赦免与刑罚的关系，因此不替原文消解神学张力。
translation_notes:
  register: 采用现代、庄重、易懂的普通话。“看哪”略带经文语体，用以传达 הִנֵּה 的醒目提示；其余句式力求自然。没有需要设置脚注的文字异文或必须说明的歧义。
