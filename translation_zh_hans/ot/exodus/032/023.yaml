  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: zh_hans
  text: 他们对我说[a]：‘为我们造众神，让他们在我们前面引路；因为这个摩西，就是那个把我们从埃及地领上来的人，我们不知道他怎么样了。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为我们造一位神，让他在我们前面引路。”希伯来原文此处使用复数名词，并搭配复数动词（“众神……他们”）；但鉴于上下文聚焦于所造的一头牛犊，也有人按单数理解。
    reason: 保留原文语法所支持的复数读法，同时说明上下文为何可能促成单数译法。
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: 他们对我说
  rationale: 未完成式连续体推进叙事；中文无需机械加入“于是”，即可自然表达顺承。
- source_word: עֲשֵׂה לָנוּ
  choice: 为我们造
  rationale: 保留命令语气以及介词 לְ 所表达的受益关系；“造”适合制造神像的语境。
- source_word: אֱלֹהִים
  choice: 众神
  rationale: אֱלֹהִים 本身可表单数或复数，但本节搭配复数动词 יֵלְכוּ，正文采用复数，并以脚注保留按上下文理解为单数的可能。
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: 让他们走在我们前面
  rationale: 复数代词“他们”反映复数动词；“走在我们前面”保留引领、先行的空间性表达。
- source_word: כִּי
  choice: 因为
  rationale: 清楚表达后句为百姓提出要求的原因。
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: 这个摩西，就是……那个人
  rationale: “这个摩西”保留原文略带疏离或轻蔑色彩的指示表达；同位结构用“就是……那个人”在现代中文中较自然。
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: 把我们从埃及地领上来
  rationale: 使役词形表达“使上来、带上来”；“领上来”既保留 עלה 的方向感，也符合出埃及叙事语境。
- source_word: לֹא יָדַעְנוּ
  choice: 我们不知道
  rationale: 完成式在此表达延续至说话时的认知状态，现代中文用现在状态最自然。
- source_word: מֶה הָיָה לוֹ
  choice: 他遭遇了什么
  rationale: 自然表达询问其下落或命运的希伯来语惯用语，同时不额外断定他已死亡。
theological_decisions:
- issue: אֱלֹהִים 在亚伦转述中应译为单数还是复数
  choice: 正文译作复数“众神”
  alternative: “一位神”或“一尊神”
  rationale: 关系从句采用复数动词 יֵלְכוּ，语法证据支持复数。周围叙事聚焦于一头牛犊，形成真实的文本张力，因此不在正文中把复数协调成单数，而以脚注说明另一种理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“众神”明确呈现本节的复数语法；“这个摩西”保留原文的疏离语气；破折式同位关系改用“就是……那个人”，便于普通读者理解。
