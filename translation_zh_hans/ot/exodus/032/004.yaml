base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: zh_hans
  text: 他从他们手中接过来，用雕刻工具把它塑形[a]，又把它做成一头铸成的牛犊。众人说[b]：“以色列啊，这些是你的神明[c]，是把你从埃及地领上来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雕刻工具”所译的希伯来词确切含义有争议，也可理解为雕刻笔、尖笔或凿子。
    reason: lexical_alternative
  - marker: b
    text: 一些文本传统作“他说”，而不是“众人说”。
    reason: textual_variant
  - marker: c
    text: 希伯来文作复数：“这些是你的神明”；因这里只有一头牛犊，传统译本常译作“这是你的神”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: 他从他们手中接过来
  rationale: לקח可指“拿、接过”；“从他们手中接过来”自然表达直接动作，并以代词承接上文所交出的金饰，不在本节重复添加“金子”一词。
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: 用雕刻工具把它塑造成形
  rationale: יצר表达有意地塑造、成形；חֶרֶט所指的具体器具有争议，因此正文采用较宽泛的“雕刻工具”，脚注保留其他可能。
- source_word: עֵגֶל מַסֵּכָה
  choice: 一头铸造的牛犊
  rationale: עֵגֶל是“牛犊”，מַסֵּכָה指以金属浇铸而成之物；此译既保留制作方式，也避免只译成泛称“偶像”。
- source_word: וַיֹּאמְרוּ
  choice: 众人说
  rationale: 马所拉文本为复数，主语自然指众人；用“众人”明确呈现复数，同时在脚注说明部分文本传统的单数异文。
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: 这些是你的神明
  rationale: אֵלֶּה明确为复数“这些”，אֱלֹהֶיךָ在此形式上也是复数；正文保留这种与单一牛犊形象之间的张力，不按传统译法改成单数。
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: 是把你从埃及地领上来的
  rationale: עלה的使役形式直译为“使上去、领上来”；此处保留“上来”的希伯来表达及“埃及地”的完整措辞。
theological_decisions:
- issue: 偶像宣告中的复数与单数
  choice: 正文译作“这些是你的神明”
  alternative: “这是你的神”
  rationale: 马所拉文本的指示词和相关形式均为复数。尽管眼前只有一头牛犊，且传统译法常用单数，译文仍保留原文的复数及其修辞张力。
- issue: 亚伦在制作过程中的主动作用
  choice: 连续保留“塑造成形”和“做成”两个主动动作
  alternative: 弱化为亚伦仅收取金饰或监督制作
  rationale: 原文两个单数动词都直接归于同一主语；译文不借后文的辩解淡化其行动责任。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“他”紧随上下文，不在本节擅自补出“亚伦”；“这些是你的神明”刻意保留原文复数与单一形象之间的不协调。所有脚注标记均置于正文相应位置。
