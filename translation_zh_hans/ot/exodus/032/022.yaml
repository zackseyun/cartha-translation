  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: zh_hans
  text: 亚伦说：“我主，请不要发烈怒。你知道这百姓，他们一心向恶[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们专爱作恶”或“他们容易作恶”。希伯来语原文是习语，形容这百姓以恶为特征。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  choice: 亚伦说
  rationale: 以现代汉语自然的叙事形式表达连续式动词；此处无需机械译出连接词。人名按通行圣经译名译作“亚伦”。
- source_word: אַל יִחַר אַף אֲדֹנִי
  choice: 求我主不要发烈怒
  rationale: “发烈怒”保留希伯来语怒气如火燃烧的意象；“求……不要”符合亚伦对摩西恭敬劝止的语气。“我主”指人间的尊称，并非神的称号。
- source_word: אַתָּה יָדַעְתָּ אֶת הָעָם
  choice: 你知道这百姓
  rationale: 独立人称代词 אַתָּה 在此使主语明确并带自然强调；汉语“你知道”已足以表达，不另加原文没有的“亲自”。定冠词所指的是当前双方熟知的以色列百姓，译作“这百姓”自然明确。
- source_word: כִּי בְרָע הוּא
  choice: 他们一向作恶
  rationale: 原文直译近于“它／他在恶中”，以单数代词回指集合名词“百姓”，属习语性表达。“一向作恶”表达百姓具有作恶倾向或以恶为特征，同时以脚注保留其他可能理解。
theological_decisions:
- issue: אֲדֹנִי 在对摩西说话时的身份指向
  choice: 我主
  alternative: 主人；大人
  rationale: 这里的受话者是摩西，故作为对人的恭敬称呼处理，不译成专指上帝的神圣称号。“我主”较完整保留从属而恭敬的称谓语气。
- issue: בְרָע הוּא 对百姓道德状态的描述
  choice: 他们一向作恶
  alternative: 他们专爱作恶；他们容易作恶
  rationale: 希伯来语表达含义较宽，可指以恶为特征、倾向于恶或执意行恶。正文采用不生硬且不过度锁定心理状态的译法，脚注注明语义范围，以保留原文张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“发烈怒”保留原文火热之怒的比喻；“我主”在本节中是亚伦对摩西的尊称。脚注标记已在正文对应位置列出。
