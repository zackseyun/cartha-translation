  text: וַ/יִּתְפָּֽרְקוּ֙ כָּל הָ/עָ֔ם אֶת נִזְמֵ֥י הַ/זָּהָ֖ב אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יָּבִ֖יאוּ אֶֽל אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/003.yaml
  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: zh_hans
  text: 于是，全体百姓都摘下[a]他们耳中的金环[b]，拿来交给亚伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“扯下”或“硬取下来”。希伯来语动词可能强调较用力地取下。
    reason: lexical_alternative
  - marker: b
    text: 或译“金耳环”。这里的希伯来语词指环状饰物，结合“耳中”可特指耳环。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: 摘下
  rationale: 此处התפעל形式表达众人从自己身上除下饰物。“摘下”符合现代汉语习惯，也保留了动作的反身含义；原词可能带有用力取下的意味，另见脚注。
- source_word: כָּל הָעָם
  choice: 全体百姓
  rationale: 该短语把聚集的群体作为整体来指称。“全体百姓”自然、直接，并体现כָּל的整体性。
- source_word: נִזְמֵי הַזָּהָב
  choice: 金环
  rationale: נֶזֶם泛指佩戴的环状饰物，可依语境指耳环或鼻环。后面的“耳中”已明确佩戴位置，因此正文采用较宽泛的“金环”。
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: 他们耳中的
  rationale: 按希伯来文关系从句表达这些环的所在位置。“耳中的”简洁自然，也紧贴介词בְּ的表达。
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: 拿来交给亚伦
  rationale: 动词表示带来或拿来；“交给”自然体现目的对象אֶל אַהֲרֹן。宾语由上文的金环补足，无须重复明说。
