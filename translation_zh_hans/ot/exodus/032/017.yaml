  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: zh_hans
  text: 约书亚听见百姓呼喊的声音[a]，就对摩西说：“营中有争战的声音。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“百姓喧嚷的声音”。此处希伯来语可指百姓呼喊所发出的喧闹声。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 听见
  rationale: 此处是叙事中的听觉感知，用“听见”自然准确。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: קוֹל
  choice: 声音
  rationale: 该词在本节两次指可听见的响声；译作“声音”既保留原文重复，也适合上下文。
- source_word: הָעָם בְּרֵעֹה
  choice: 百姓呼喊的声音
  rationale: בְּרֵעֹה 表示百姓发出响亮喊声；原文单数后缀与集合名词“百姓”呼应，中文不必显明单复数。
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: 就对摩西说
  rationale: 符合希伯来叙事顺序，也符合现代汉语表达。
- source_word: קוֹל מִלְחָמָה
  choice: 争战的声音
  rationale: 较贴近原文的属格结构，并保留约书亚将响声判断为争战之声的表述。
- source_word: בַּמַּחֲנֶה
  choice: 营里
  rationale: 指以色列人的营地；“营里”简洁自然。
