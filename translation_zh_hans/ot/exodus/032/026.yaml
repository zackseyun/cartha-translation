  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: zh_hans
  text: 于是，摩西站在营门口，说[a]：“谁属耶和华，谁就到我这里来！”利未的众子孙都聚集到他那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“谁属耶和华？到我这里！”正文补出隐含的号召语气。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 站在
  rationale: עמד在叙事中表示站立或取站立的位置；“站在营门口”自然、准确，不额外强化为正式的“挺身而立”。
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: 在营门口
  rationale: שַׁעַר指门或门道；现代汉语用“营门口”既保留具体意象，也符合地点表达习惯。
- source_word: מִי לַיהוָה
  choice: 谁归耶和华
  rationale: 原文直译为“谁是属耶和华的？”介词ל可表达归属或效忠；“谁归耶和华”保留其简洁和归属意味，并与后面的号召自然衔接。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”音译四字神名，避免用头衔替代原文中的名字。
- source_word: אֵלָי
  choice: 就到我这里来
  rationale: 希伯来文仅作“到我这里”，是省略动词的号召；中文补出“来”，使句意完整。“就”明确承接前面的条件性挑战，但不增加实质内容。
- source_word: וַיֵּאָסְפוּ
  choice: 聚集
  rationale: Nifal形态在此表示众人集合到一处；“聚集”中性直接，不额外加入军事性的“集结”色彩。
- source_word: אֵלָיו
  choice: 到他那里
  rationale: אֶל加代词后缀表示朝向某人；“到他那里”准确呈现移动方向，不扩展为“围在他身边”。
- source_word: כָּל בְּנֵי לֵוִי
  choice: 利未的子孙全都
  rationale: 保留בְּנֵי לֵוִי的亲属—支派表达“利未的子孙”，同时按自然汉语语序把כָּל译为“全都”。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非“主”这一头衔。正文采用现代中文圣经传统中最通行、普通读者最易识别的“耶和华”；“雅威”是按学界常见重建读音形成的另一种音译。
- issue: מִי לַיהוָה所表达的关系
  choice: 谁归耶和华
  alternative: 谁站在耶和华一边
  rationale: “归耶和华”保留介词ל所含的归属与效忠张力；“站在……一边”更突出阵营选择，但会把语境含义说得更明，不宜直接写入正文。
- issue: בְּנֵי לֵוִי的群体称谓
  choice: 利未的子孙
  alternative: 利未人
  rationale: 正文保留原文“利未之子”的支派亲属措辞；“利未人”更简洁，却会抹平原文显式的子孙表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“营门口”具体清楚；摩西的话用简短有力的号召句式。正文保留“利未的子孙”，不简化为“利未人”。
