revisions:
- from: 百姓见摩西迟迟没有从山上下来，就聚集到亚伦那里，对他说：“起来，为我们造些神明[a]，好走在我们前面。因为这个摩西，就是把我们从埃及地领上来的那个人，我们不知道他遭遇了什么事。”
  to: 百姓见摩西迟迟没有从山上下来，就聚集到亚伦那里，对他说：“起来，为我们造些神[a]，让它们在我们前面引路。因为这个摩西，就是把我们从埃及地领上来的那个人，我们不知道他遭遇了什么事。”
  rationale: 修订仅消除“好走在我们前面”的现代汉语句法歧义，并以较中性的“神”替代“神明”。“让它们在我们前面引路”以自然汉语表达 יֵלְכוּ לְפָנֵינוּ 的“在前面行走、引领”功能，未改变复数主文本或脚注中的单数替代读法。
