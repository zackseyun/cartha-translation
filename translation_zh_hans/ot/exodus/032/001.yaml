id: EXO.32.1
reference: Exodus 32:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: zh_hans
  text: 百姓见摩西迟迟没有从山上下来，就聚集到亚伦那里，对他说：“起来，为我们造些神[a]，让它们在我们前面引路。因为这个摩西，就是把我们从埃及地领上来的那个人，我们不知道他遭遇了什么事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为我们造一位神，让它在我们前面引路。”有些人因下文集中叙述一只牛犊像，而把这里的 אֱלֹהִים 理解为单数；但该词的形式以及后面的动词都是复数。
    reason: 保留希伯来文语法所支持的复数读法与叙事语境所容许的单数读法之间的真实歧义。
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: 迟迟没有
  rationale: 表达摩西许久尚未下山以及百姓所感受到的耽延，符合现代汉语习惯，也不暗示摩西故意拖延。
- source_word: לָרֶדֶת מִן הָהָר
  choice: 从山上下来
  rationale: 准确保留方向和起点，在现代汉语中自然清楚。
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: 聚集到亚伦那里
  rationale: 保留众人聚集并向亚伦施压的场景，但不把介词明确强化为敌对性的“围攻”。
- source_word: קוּם
  choice: 起来
  rationale: 保留命令语气的突兀和紧迫感。
- source_word: עֲשֵׂה לָנוּ
  choice: 为我们造
  rationale: 明确保留受益者成分，并以自然汉语表达制造的动作。
- source_word: אֱלֹהִים ... יֵלְכוּ
  choice: 些神明……走
  rationale: 名词在形式上为复数，后接动词也是复数，因此正文采用复数意义；“些”使现代汉语中的复数明确可见。
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: 好走在我们前面
  rationale: 表达百姓要求这些神明在前方引领他们的目的，同时保留“走在……前面”的具体意象。
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: 这个摩西，就是……那个人
  rationale: 保留“这个摩西”所带的疏离甚至轻蔑口吻，也呈现 הָאִישׁ 的同位说明。
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: 把我们从埃及地领上来
  rationale: 保留使役动词“使上来”的出埃及用语；“领上来”在汉语中比生硬的“带上来”更适合群体迁移语境。
- source_word: מֶה הָיָה לוֹ
  choice: 他遭遇了什么事
  rationale: 自然表达对摩西下落和命运的疑问，同时避免把结果说得过于确定。
theological_decisions:
- issue: אֱלֹהִים 在此应译为单数还是复数
  choice: 正文译作复数“些神明”
  alternative: “一位神明”或“一尊神”
  rationale: 紧邻语法支持复数：אֱלֹהִים 形式为复数，关系从句中的 יֵלְכוּ 也是复数。后文虽集中于一只牛犊像，可能支持集合性或单数理解，但不应据此抹去本节真实的语法张力，故把单数读法列入脚注。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“迟迟没有”传达百姓眼中的耽延；“这个摩西”保留原文的疏离语气。正文中的脚注标记 [a] 紧随争议词语“神明”。
