base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: zh_hans
  text: 于是，摩西回到雅威那里，说：“请你看，这百姓犯了大罪；他们为自己造了金的众神[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“金的众神”（复数）。鉴于上下文，也有人理解为“一个金神”，即金牛犊。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: שׁוב在此表示摩西离开百姓后再次到雅威那里；“回到”自然并准确地表达这一方向。
- source_word: אֶל יְהוָה
  choice: 到雅威那里
  rationale: 介词אֶל表示趋向；神名יהוה音译为“雅威”，保留经文中的专名。
- source_word: אָנָּא
  choice: 唉
  rationale: 该语气词在这里引出迫切的恳求；“唉”既体现悲痛与恳切，也能自然衔接下文。
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: 这百姓犯了大罪
  rationale: 保留“犯罪—罪”的同源表达及其强调作用，同时采用现代汉语中庄重自然的说法。
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: 为自己造了
  rationale: לָהֶם具有为自身制作、供自身使用的含义；“为自己”保留这一反身意味。
- source_word: אֱלֹהֵי זָהָב
  choice: 金神像
  rationale: 原文形式为复数构造，但上下文所指是金牛犊。正文用汉语中数目未明、且适合人工制成之物的“金神像”，脚注交代可作复数或单数理解，避免无提示地消除原文张力。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为盟约专名的性质，不以称号替代。
- issue: אֱלֹהֵי זָהָב的数
  choice: 正文采用数目未明的“金神像”，脚注说明原文复数
  alternative: 金神；金神像们；一个金神像
  rationale: 语法形式为复数，但叙事上下文集中于一个金牛犊。汉语名词本身可不标数，因此能保留这种语法与语境之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“这百姓”保留原文集合名词的单数意味；“唉”表达摩西代求时的悲痛和恳切。
