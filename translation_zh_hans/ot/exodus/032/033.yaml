  naturalness: “耶和华对摩西说：‘谁得罪了我，我就把谁从我的册子上抹去。’”是自然、庄重且清楚的现代标准汉语。“谁……我就把谁……”充分表达原文的概括性条件／结果关系；“从……册子上抹去”也符合名册书写和涂抹的中文意象。
