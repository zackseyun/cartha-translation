base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“谁得罪了我，我就把谁从我的册子上抹去。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的册子”可能指神所看顾之人的名册；也有人更具体地理解为“生命册”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未机械译出叙事性连接词 וַ；现代汉语在连续叙事中省略“于是/又”更自然，而事件推进关系仍由上下文清楚表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法“耶和华”，将专名与称号“主”区分开来。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 自然表达说话的对象，并采用通行中文人名“摩西”。
- source_word: מִי אֲשֶׁר
  choice: 谁……就……谁
  rationale: 该结构引出不定关系从句；汉语关联式表达既自然，也保留“任何犯罪者”的概括含义。
- source_word: חָטָא לִי
  choice: 得罪了我
  rationale: חטא 与 לִי 表示针对神而犯的罪；“得罪了我”在现代汉语中简明自然，也保留已发生之罪的语境。
- source_word: אֶמְחֶנּוּ
  choice: 我就把谁……抹去
  rationale: מחה 在书册意象中指擦除、抹除；“抹去”保留原文的删除比喻。代词后缀为阳性单数，但汉语不必用带性别的第三人称代词，关联结构仍准确指向犯罪的人。
- source_word: מִסִּפְרִי
  choice: 从我的册子上
  rationale: סֵפֶר 可指书、册或卷；此处涉及记录和抹除，“册子”自然保留神所拥有之记录册的意象，但不具体断定其性质。
theological_decisions:
- issue: “我的册子”的性质
  choice: 保留“我的册子”这一未加限定的比喻
  alternative: 生命册；活人名册；盟约名册
  rationale: 希伯来文本只说“我的册子”，没有明确说明其为生命册、活人名录、盟约成员名册或永恒救恩的记录，因此正文不替原文作神学限定。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“谁……我就把谁……”适合普通读者，避免生硬仿照希伯来语句法；“册子”维持记录与抹除的整体意象。
