base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: zh_hans
  text: 但摩西向耶和华——他的上帝——恳求[a]，说：“耶和华啊，你为什么要向你的子民发烈怒呢？他们是你用大能和强有力的手从埃及地领出来的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“求耶和华的面”，是寻求恩惠或迫切恳求的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי
  choice: 恳求
  rationale: 该短语字面为“求……的面”，是寻求恩惠、迫切求告的习语；“恳求”自然传达其急切的人际诉求。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名专名译法，区别于“主”这一称号。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 单数所属形式指摩西的上帝；“他的上帝”保留原文所表达的关系。
- source_word: יֶחֱרֶה אַפְּךָ
  choice: 你为什么要……发烈怒
  rationale: 希伯来语以“怒气燃烧”表达强烈愤怒；“发烈怒”在现代汉语中自然，并保留怒气炽烈的意象。
- source_word: בְּעַמֶּךָ
  choice: 向你的子民
  rationale: 介词在愤怒语境中表示怒气所针对的对象；“你的子民”保留摩西诉诸盟约归属的意味。
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: 他们是你……领出来的
  rationale: 关系从句指向百姓；汉语用复指结构清楚自然。“领出来”符合出埃及语境中的拯救行动。
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: 从埃及地
  rationale: 保留原文“埃及之地”的完整地理表达，同时符合中文圣经文体。
- source_word: בְּכֹחַ גָּדוֹל
  choice: 用大能
  rationale: 介词具有工具意义；“用大能”准确表达上帝施行拯救所彰显的能力。
- source_word: וּבְיָד חֲזָקָה
  choice: 用强有力的手
  rationale: 较直接地保留“强壮的手”这一出埃及传统意象，同时让现代中文读者易于理解。
theological_decisions:
- issue: 上帝愤怒的拟人化表达
  choice: 发烈怒
  alternative: 怒气燃烧；动怒
  rationale: 既不逐字译成不自然的“鼻子燃烧”，也不完全削弱原文炽热的形象，保留其修辞力度和神学张力。
- issue: 神圣名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 以专名呈现四字神名，不用称号替代；“耶和华”是现代简体中文普通读者最熟悉且庄重的形式。
- issue: 摩西恳求上帝的表述
  choice: 恳求他的上帝耶和华
  alternative: 求耶和华施恩；使耶和华息怒
  rationale: “恳求”表达迫切代求，却不预先断定摩西是在操控上帝或已经使上帝改变决定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“耶和华啊”保留直接呼告的力度；整体句式略带圣经叙事的庄严节奏，但避免生硬直译。
