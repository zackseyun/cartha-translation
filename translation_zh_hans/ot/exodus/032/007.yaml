  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה לֶךְ רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“去，下去吧！因为你的百姓，就是你从埃及地领上来的那些人，已经败坏了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“行事败坏。”希伯来语动词既可侧重败坏的行为，也可侧重由此造成的败坏状态。
    reason: 保留שִׁחֵת在行为过程与败坏结果之间的词义张力。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 未完成式连续体推进叙事；现代汉语以“说”自然引出直接引语，无须机械添加“然后”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名形式呈现四字神名，保留其作为名字而非称号的性质。
- source_word: לֶךְ רֵד
  choice: 下去吧
  rationale: לֶךְ与רֵד构成惯用的命令组合，意为“去，下去”；汉语合译为“下去吧”自然且不造成重复命令的误解。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出命令的理由。
- source_word: שִׁחֵת
  choice: 已经败坏了自己
  rationale: 该动词在本语境指百姓因偶像崇拜而陷入道德败坏；反身表达传达其自取败坏的结果，同时脚注保留行为性译法。
- source_word: עַמְּךָ
  choice: 你的百姓
  rationale: 保留第二人称所属语气；这在叙事中凸显百姓犯罪后上帝对摩西所用的修辞性称呼。
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: 你……领上来的
  rationale: 保留使役动词“使上来”的方向性；“领上来”符合出埃及语境下的自然汉语。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: 从埃及地
  rationale: 完整反映“从埃及之地”的源语措辞，并保持简洁。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 源文直接使用四字神名；采用现代中文圣经传统中广为人知的专名“耶和华”，而不以“主”这一称号替代。
- issue: שִׁחֵת是否表达反身败坏
  choice: 已经败坏了自己
  alternative: 行事败坏
  rationale: 上下文支持百姓因自身行为而败坏的结果，但该形式也可侧重其败坏的行为，因此在正文采用结果性的反身表达，并以脚注保存另一种可能。
- issue: “你的百姓”的修辞意味
  choice: 保留为“你的百姓”
  alternative: 以色列百姓
  rationale: 不消解原文将百姓归于摩西的措辞，也不额外断定这表示上帝弃绝了他们。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；保留“你的百姓”及“从埃及地领上来”的叙事张力。正文脚注标记紧随存在词义歧义的短语。
