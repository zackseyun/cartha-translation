base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: zh_hans
  text: 摩西走近营地时，看见那牛犊和跳舞的场面[a]，就怒火中烧。他把版从手中扔下，在山脚下摔碎了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为复数名词，直译可作“舞蹈”或“各种舞蹈”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 一……就近营地
  rationale: 该叙事结构引出紧接发生的事件；用“一……就”自然表达 כַּאֲשֶׁר 在此的时间关系，同时避免生硬直译“事情发生，当……”。
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: 走近营地
  rationale: קָרַב 表示靠近、临近；“走近营地”在现代汉语中自然，并保留空间动态。
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: 看见那牛犊
  rationale: רָאָה 是普通的“看见”；定冠词表明这是上下文已知的特定牛犊偶像，因此译为“那牛犊”。
- source_word: וּמְחֹלֹת
  choice: 和人们跳舞
  rationale: מְחֹלֹת 是复数名词，指舞蹈、跳舞的活动。汉语在“看见”之后用“人们跳舞”比“看见舞蹈”更自然；“人们”是该动作必有的主体，并未把它扩释为较具评价色彩的“狂欢”。
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: 就怒火中烧
  rationale: 希伯来语惯用语以“燃烧”描写愤怒；“怒火中烧”既保留鲜明意象，也符合庄重自然的现代汉语。
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: 把石版从手中扔下
  rationale: שָׁלַךְ 表示扔、抛；“从手中扔下”保留原文单数“手”的表达，并与随后的摔碎动作连贯。
- source_word: הַלֻּחֹת
  choice: 石版
  rationale: לוּחֹת 指书写用的版；中文圣经语境中“石版”清楚指向约版。材质虽由上下文明确，但原文本节仅作“版”，选择“石版”是为使普通读者明辨所指。
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: 摔碎了
  rationale: שָׁבַר 表示打破、砸碎；结合先“扔下”的动作，“摔碎”准确有力而不口语化。
- source_word: תַּחַת הָהָר
  choice: 在山脚下
  rationale: תַּחַת 可指在下方；用于地形位置时，“在山脚下”是准确自然的汉语对应。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“怒火中烧”保留希伯来语的燃烧意象；将复数名词“舞蹈”转为“人们跳舞”，以符合汉语感知动词后的自然结构，并用脚注说明原文形式。
