id: EXO.32.8
reference: Exodus 32:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: zh_hans
  text: 他们很快就偏离了我吩咐他们走的道路。他们为自己造了一尊铸成的牛犊像，向它下拜，给它献祭，并且说：‘以色列啊，这些是你的神明[a]；他们把你从埃及地领上来。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这就是你的神，以色列啊。”希伯来文直译为“这些是你的神明”，尽管上下文所指的是一尊牛犊像。
    reason: 保留希伯来文复数语法与上下文单一所指之间的张力，并提供按语境采用单数的另一译法。
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: 很快就偏离了
  rationale: 保留动词“偏离道路”的比喻及 מַהֵר 所表达的迅速背离；现代汉语自然清楚。
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: 偏离了我吩咐他们走的道路
  rationale: 以“走的道路”使希伯来语“道路”的顺服隐喻在汉语中完整而自然，同时不把它泛化为抽象的“命令”。
- source_word: עָשׂוּ לָהֶם
  choice: 为自己造了
  rationale: 明确表达 לָהֶם 的受益／反身意味，突出偶像是他们为自己制作的。
- source_word: עֵגֶל מַסֵּכָה
  choice: 一尊牛犊铸像
  rationale: מַסֵּכָה 指铸造的像；“牛犊铸像”既交代形态，也保留金属铸造及偶像的含义。量词“一尊”符合汉语对塑像的通常用法。
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: 向它下拜
  rationale: 保留动词所指的身体俯伏动作，而不直接概括为“敬拜”，使下拜、献祭、宣告这一连串行为仍然分明。
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: 给它献祭
  rationale: 直接表达祭祀行为及其对象，简洁明白。
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: 这些就是你的神明
  rationale: 用复数指示词“这些”保留希伯来语 אֵלֶּה 的显著复数形式；“神明”可自然用于受崇拜对象，并避免把原文的数强行改成单数。
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: 把你从埃及地领上来的
  rationale: “领上来”保留 עלה 使役式的“带上来”方向意象，也维持出埃及叙事中的惯用表达。
theological_decisions:
- issue: 偶像宣告中 אֵלֶּה אֱלֹהֶיךָ 的数
  choice: 正文译作复数形式“这些就是你的神明”
  alternative: “这就是你的神”
  rationale: 希伯来语的指示词明确为复数，后面的动词 הֶעֱלוּךָ 也为复数；虽然上下文只提到一尊牛犊铸像，正文仍保留语法张力，并在脚注列出按单一所指理解的译法。
- issue: 礼仪动作 וַיִּשְׁתַּחֲווּ 的表达
  choice: 译作“向它下拜”
  alternative: “敬拜它”
  rationale: 原词直接描写俯伏下拜；保留具体动作，可避免把下拜与随后献祭的整个偶像崇拜行为合并成一个概括性术语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“道路”“下拜”“献祭”“埃及地”等词保留经文语境所需的尊严和互文性，同时避免古奥句式。引语中的“以色列啊”清楚标示呼语；“这些”刻意保留原文复数，不在正文中消解其与单一牛犊铸像之间的张力。
