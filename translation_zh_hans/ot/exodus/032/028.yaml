base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: zh_hans
  text: 利未的子孙就照摩西的话去做。那一天，百姓中约有三千名男子倒下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倒下”是希伯来语中常用来表示死亡或被击杀的说法；也可译作“被杀”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 做了
  rationale: עָשָׂה在这里是宽泛的行动动词；“做了”与“照摩西的话”自然搭配，并避免把原文进一步解释为“服从”或“执行命令”。
- source_word: בְנֵי לֵוִי
  choice: 利未的子孙
  rationale: 保留希伯来语“利未之子”的家族性表达；现代汉语中“利未的子孙”清楚自然，也不必直接改写为群体称谓“利未人”。
- source_word: כִּדְבַר מֹשֶׁה
  choice: 照摩西的话
  rationale: 贴近原文“按照摩西的话”；这里“话”在语境中具有吩咐、指示之意，但正文不必把这一含义明说。
- source_word: וַיִּפֹּל
  choice: 倒下
  rationale: 原文用“倒下”这一常见的死亡委婉语，而没有直接采用“杀”或“死”的动词；正文保留其叙事措辞，并以脚注说明。
- source_word: מִן הָעָם
  choice: 百姓中
  rationale: 准确表达介词מִן的部分含义，说明倒下的人出自全体百姓之中。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 完整而自然地表达原文的时间短语。
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: 约有三千人
  rationale: 前缀כְּ表示约数，译为“约”；这里的אִישׁ用于人数统计，现代汉语以“三千人”自然表达，且上下文已明确所指为参与事件者。
theological_decisions:
- issue: 审判语境中伤亡陈述的译法
  choice: 百姓中约有三千人倒下
  alternative: 百姓中约有三千人被杀；百姓中约有三千人死了
  rationale: 希伯来文使用“倒下”这一可指死亡或被击倒的叙事用语，而未直接使用“被杀”或“死”的动词。正文保留原文措辞及其庄重感，不把致死方式明说；脚注交代其语境含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“照摩西的话做了”尽量贴近希伯来语结构；“倒下”保留原文委婉而凝重的表达。英文咨询层的脚注标记位于“摩西的话”之后，但脚注内容实际解释“倒下”；本稿将[a]移至其所解释的词后。
