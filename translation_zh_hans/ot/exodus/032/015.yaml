base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: zh_hans
  text: 摩西转身下山，手里拿着两块见证版；每块版的两面都有字，这面那面都写着字[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一面和另一面”。
    reason: 原文מִזֶּה וּמִזֶּה是对称性的方位表达，可按汉语习惯译作“这面那面”，也可译作“一面和另一面”。
lexical_decisions:
- source_word: וַיִּפֶן
  choice: 转身
  rationale: פנה在连续叙事中表示摩西改变方向；“转身”自然、简洁，不额外强调完全转过身去。
- source_word: וַיֵּרֶד מֹשֶׁה מִן־הָהָר
  choice: 摩西……下山
  rationale: ירד意为“下去、下降”；“下山”符合现代汉语叙事习惯，也准确表达从山上下来的动作。
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: 两块见证版
  rationale: לֻחֹת译为“版”，不把本节未明说的“石”加入正文；עֵדוּת保留为“见证”，维持其盟约语境中的专门含义而不窄化成“律法”。
- source_word: בְּיָדוֹ
  choice: 手里拿着
  rationale: 原文为单数“在他手中”；现代汉语“手里拿着”既自然，也不必擅自改为复数“手中”。
- source_word: לֻחֹת כְּתֻבִים
  choice: 版……有字
  rationale: 被动分词כְּתֻבִים意为“写着的”；“有字”在汉语中自然表达版上已有书写内容。
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: 版的两面
  rationale: 该短语表示两块版的两个表面；“两面”准确且符合现代汉语。
- source_word: מִזֶּה וּמִזֶּה
  choice: 这一面和那一面
  rationale: 近距离保留希伯来语对称、逐面强调的表达，不将其简单省略为“两面”。
- source_word: הֵם כְּתֻבִים
  choice: 都写着字
  rationale: 保留原文末尾对书写状态的再次强调，同时用自然汉语避免生硬的被动结构。
theological_decisions:
- issue: עֵדוּת在“见证版”中的译法
  choice: 见证
  alternative: 约书；法版
  rationale: “见证”直接保留עֵדוּת的词义及其盟约性回响；“约书”解释性较强，“法版”则把此处没有明说的“律法”概念直接置入名称。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“见证版”保留原文的盟约术语；分号呈现原句中携版下山与版面书写情况之间的结构转折，并保留“两面”之后再次逐面强调的修辞重复。
