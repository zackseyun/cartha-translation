base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: zh_hans
  text: 第二天，他们清早起来，献上燔祭，又呈上平安祭。随后，百姓坐下吃喝，起来嬉闹[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“玩乐”或“庆祝”。这个希伯来语动词可表示玩耍、庆祝，也可指放纵的嬉闹；这里的语境暗示的是失序的欢庆，而非单纯无害的娱乐。
    reason: 词义存在多种可能，需保留原文的语义范围及上下文中的负面色彩。
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: 第二天，他们清早起来
  rationale: שׁכם的使役词形在此惯常表示“清早起来”，מִמָּחֳרָת表示前述事件的次日；此译保留时间重点，也符合现代汉语叙事习惯。
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: 献上燔祭
  rationale: עלה与עֹלָה连用时指献燔祭；“燔祭”准确保留这种祭礼类别。
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: 呈上平安祭
  rationale: נגשׁ在祭祀语境中表示带来或呈献，שְׁלָמִים是特定祭礼类别；“平安祭”兼顾传统术语及词汇连续性。
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: 百姓坐下吃喝
  rationale: 直译其连续动作，汉语简洁自然；“坐下”也清楚引入筵席场景。
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: 起来嬉闹
  rationale: צחק可指玩乐、欢庆或带有放纵意味的嬉闹。金牛犊事件的上下文带有负面色彩；“嬉闹”传达这种意味，却不擅自明确为性行为。
theological_decisions:
- issue: 金牛犊事件中לְצַחֵק的含义
  choice: 译作“嬉闹”
  alternative: 玩乐；庆祝；狂欢
  rationale: 献祭、宴饮以及随后审判的语境表明，这并非单纯无害的娱乐；但本节本身不足以明确断定为性行为。“嬉闹”保留道德上的负面暗示，也保留原词一定程度的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“燔祭”“平安祭”保留既有祭礼术语；句式简洁，并以“随后”自然衔接献祭与宴饮嬉闹。
