base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: zh_hans
  text: 现在，你不要拦阻我[a]，好让我的怒气向他们燃烧，把他们灭尽[b]；我要使你成为一个大国。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“由我去吧。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“让我的烈怒向他们发作，把他们吞灭。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语推进标记，引出眼前的命令；“现在”简洁自然。
- source_word: הַנִּיחָה לִּי
  choice: 你任凭我吧
  rationale: 使役形命令式在此惯用语中表示不再拦阻、任由对方行动。“任凭我吧”在现代汉语中自然，并保留直接命令的力度；脚注列出更贴近字面的译法。
- source_word: וְיִחַר אַפִּי
  choice: 好让我的怒气……发作
  rationale: חרה אף是怒气被点燃、变得炽烈的惯用表达。“怒气发作”保留动态和强烈程度，同时符合现代汉语表达；连接词按语境表达目的或结果。
- source_word: בָהֶם
  choice: 向他们
  rationale: 介词在怒气惯用语中标明怒气所针对的对象；“向他们发作”是自然汉语搭配。
- source_word: וַאֲכַלֵּם
  choice: 把他们灭尽
  rationale: כלה的加强词干表示使之完结、消灭殆尽。“灭尽”兼顾彻底性与审判语气；脚注保留“吞灭”这一较具意象的译法。
- source_word: וְאֶעֱשֶׂה אוֹתְךָ
  choice: 我要使你成为
  rationale: עשה加宾语及ל补语表示使某人成为某种身份或实体；此译法准确自然。
- source_word: לְגוֹי גָּדוֹל
  choice: 一个大国
  rationale: גוי指民族或国家性群体；“大国”直接对应原文，也保留与先祖应许相呼应的措辞，而不添加解释。
theological_decisions:
- issue: 关于上帝怒气的拟人化表达
  choice: 保留上帝怒气强烈发作的动态表达，不弱化为抽象的“不悦”。
  alternative: 译为“我要向他们生气”。
  rationale: 原文使用鲜明的怒气燃烧惯用语。译文保留其强烈性，以维持叙事中神圣审判的力度和神学张力。
- issue: “任凭我吧”与摩西代求之间的关系
  choice: 将其直译为真实的命令，不在正文中说明它是否暗含邀请摩西代求。
  alternative: 解释性地译成暗示或鼓励摩西代求的话。
  rationale: 本节明说的是命令、审判宣告和给摩西的应许；是否暗含代求邀请属于释经判断，不应加入正文。
- issue: 连接词 וְ 在命令之后的语义关系
  choice: 译作“好让”，呈现目的或结果关系，同时不进一步界定二者。
  alternative: 译作单纯并列的“我的怒气就会……”或明确目的性的“为了让……”。
  rationale: 此处连接可承载目的或结果色彩。“好让”在汉语中自然，并适度保留两者之间的语义开放性。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“任凭我吧”避免古奥，“怒气发作”和“灭尽”保持原文强度。正文中的[a]、[b]均与脚注对应。
