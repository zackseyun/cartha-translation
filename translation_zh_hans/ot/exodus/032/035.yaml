  yaml_path: translation/ot/exodus/032/035.yaml
  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: zh_hans
  text: 于是，耶和华击打了百姓，因为他们造了亚伦所造的那头牛犊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击打”也可译作“使……遭受灾祸”。希伯来语动词可泛指击打，也常用于表示使人受惩罚或遭灾；本节没有说明具体灾祸的种类。
    reason: 词义范围
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: 降灾击打
  rationale: נָגַף表示击打、使受灾，在审判语境中常带有灾祸或疫灾的意味。“降灾击打”兼顾动词的击打力度和此处可能含有的灾害性惩罚，同时不说明具体灾种，也不暗示所有人都死亡。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名“耶和华”译出四字神名，保留其作为以色列之神名字的性质，而不以称号替代。
- source_word: הָעָם
  choice: 百姓
  rationale: 这里指作为群体的以色列民；“百姓”是自然、庄重且符合叙事语境的现代汉语表达。
- source_word: עַל אֲשֶׁר
  choice: 因为
  rationale: 介词与关系从句在此表达原因；“因为”清楚保留因果关系。
- source_word: עָשׂוּ אֶת הָעֵגֶל
  choice: 他们造了……那牛犊
  rationale: עָשׂוּ为复数，且הָעֵגֶל是其直接宾语，直译为“他们造了那牛犊”。保留这一说法，可呈现经文把百姓的集体责任与亚伦实际制造牛犊并列的张力。
- source_word: הָעֵגֶל
  choice: 那牛犊
  rationale: עֵגֶל意为“牛犊”。本节本身未出现“金”字，因此不在正文中补入“金牛犊”。
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: 亚伦所造的
  rationale: 关系从句直接说明这牛犊是亚伦造的；采用简洁的“所”字结构，保留原文与前一“造了”之间有意或至少真实存在的重复。
theological_decisions:
- issue: וַיִּגֹּף所表达的神圣审判性质
  choice: 译作“降灾击打”，表达耶和华以灾祸惩治百姓
  alternative: 仅译作“击打”或译作“使百姓遭受灾祸”
  rationale: 该动词本身没有明说灾祸的具体种类，却常用于神以灾害击打人的语境。“降灾击打”在现代汉语中兼顾其一般的“击打”义和灾害性审判的语感；脚注保留较宽泛的译法。
- issue: 百姓与亚伦在造牛犊一事上的责任关系
  choice: 保留“他们造了亚伦所造的那牛犊”的表面重复
  alternative: 译为“因为他们对亚伦所造的牛犊所行的事”
  rationale: 希伯来文以复数“他们造”直接支配“牛犊”，随后又说牛犊是亚伦所造。译文不把这种张力消解为较含混的“所行的事”，也不擅自说明百姓具体如何参与制造。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“于是”承接叙事发展；保留“他们造了……亚伦所造的”这一略显重复的结构，以忠实呈现原文措辞及其责任张力。
