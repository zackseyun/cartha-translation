  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: zh_hans
  text: 摩西看见百姓已经失去约束——原来亚伦任由他们失去约束[a]，以致在那些起来敌对他们的人中遭受讥嘲[b]——
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “失去约束”也可译作“放纵不羁”或“被放任”。原文用同一词根描述百姓的状态和亚伦的作为。
    reason: lexical_alternative
  - marker: b
    text: “遭受讥嘲”也可译作“成为笑柄”或“蒙受羞辱”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא מֹשֶׁה
  choice: 摩西看见
  rationale: 承接叙事并引出摩西随后的行动；汉语无需机械译出连接词，也能自然表达希伯来叙事推进。
- source_word: כִּי פָרֻעַ הוּא
  choice: 百姓已经失去约束
  rationale: פרע在此表示约束被放松而陷入失序；“失去约束”兼顾社会混乱与行为放纵，又不把含义缩窄为“赤身”或某一种具体恶行。
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: 原来亚伦任由他们失去约束
  rationale: 再次使用“失去约束”，保留原文连续两次使用פרע词根的呼应；“任由”表明亚伦负有责任，但不额外断定他有意促成混乱。
- source_word: לְשִׁמְצָה
  choice: 以致……遭受讥嘲
  rationale: 该词可指羞辱、讥诮或成为嘲弄对象；此译在现代汉语中自然，并保留结果或目的色彩。
- source_word: בְּקָמֵיהֶם
  choice: 在那些起来敌对他们的人中
  rationale: 贴近קום分词“起来反对者”的动态意象；代词指百姓，即以色列人。
theological_decisions:
- issue: פרע所表达的道德与社会状态
  choice: 译为“失去约束”
  alternative: “放纵不羁”“任意妄为”“赤身露体”
  rationale: 上下文突出亚伦治理下约束失效和群体失序。译作“赤身露体”会过早锁定一个有争议且较狭窄的解释；“任意妄为”又可能弱化被动状态以及原文词根复现。
- issue: לְשִׁמְצָה与敌对者之间的句法关系
  choice: 译为“以致在……人中遭受讥嘲”
  alternative: “成为……人的笑柄”“在……人面前蒙羞”
  rationale: 原文短语简约，既可侧重羞辱状态，也可侧重敌人的嘲弄。正文采用自然的结果表达，脚注保留其他可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以破折号保留原文插入性解释，句末破折号显示本节语意继续至下一节；正文中的脚注标记均紧随相关表达。
