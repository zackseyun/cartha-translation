  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: zh_hans
  text: 他说：“这不是得胜的呼喊声，也不是战败的哀喊声；我听见的是歌唱声。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我听见的是喊叫声。”这里几个源自 ענה 的希伯来语形式可指回应、呼喊，也可能指应和歌唱；末句的确切含义不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹת / עַנּוֹת
  choice: 呼喊／哀喊／歌唱
  rationale: 这些形式在本节都指人发出的声音。前两处分别与“勇力、强盛”和“衰弱、失败”相连，宜按战争场景译为得胜的呼喊和战败的哀喊；末句在金牛犊宴乐的叙事背景下可理解为歌唱，但希伯来语也可能泛指喊叫，故以脚注保留歧义。
- source_word: גְּבוּרָה
  choice: 得胜
  rationale: 该词本义为勇力、强盛；在与 חֲלוּשָׁה 对举并描述营中声音时，语境指胜方的呼喊，译作“得胜”自然。
- source_word: חֲלוּשָׁה
  choice: 战败
  rationale: 该词与衰弱有关，在此与 גְּבוּרָה 构成军事语境中的对照，指败方被压倒的情形。
- source_word: קוֹל
  choice: 声
  rationale: “声”可自然涵盖本节三次出现的声音，既不限定为有明确言辞的嗓音，也不过早判断为杂音。
- source_word: אֵין
  choice: 不是
  rationale: 在重复的判断句式中译为“不是……声”，符合现代汉语表达并准确保留否定。
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: 我听见的是
  rationale: 独立代词加分词表达说话当下的感知；“我听见的是”也能自然呈现末句与前两句的对照焦点。
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 按希伯来叙事连续体简洁引出摩西的回答；汉语无需机械增添“于是”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事文体。前两分句保持整齐对举；末句用“我听见的是”突出摩西对声音性质的判断。脚注明确保留希伯来词义在“喊叫”与“歌唱”之间的真实歧义。
