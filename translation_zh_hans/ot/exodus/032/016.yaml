base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: zh_hans
  text: 这两块版是上帝的工作[a]，那文字是上帝的文字，刻在版上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这两块版是上帝所做的……那文字是上帝所写的。”原文重复“工作”和“文字／书写”，以强调二者都出于上帝。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: 这两块版
  rationale: 此处指上下文已经提到的两块法版；希伯来语本节未明说“石”，因此正文不增补“石版”。用“版”也能与后文三次出现的同一词保持呼应。
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: 上帝的作品
  rationale: 保留名词性结构“上帝的作品”，比改写成“上帝造的”更贴近原文，也凸显法版本身出于上帝。
- source_word: הַמִּכְתָּב מִכְתַּב אֱלֹהִים
  choice: 版上的字是上帝的字
  rationale: 原文重复“字／书写”一词以加强语气。中文用“字……字”保留这一修辞，同时借“版上的”明确所指，使表达自然。
- source_word: חָרוּת
  choice: 刻
  rationale: 该词表示刻入或镌刻；在法版的语境中，“刻”简洁、准确而自然。
- source_word: עַל הַלֻּחֹת
  choice: 在版上
  rationale: 按其位置义直译，清楚说明字刻于法版表面。
- source_word: וְ
  choice: （不单独译出）
  rationale: 句首连接词承接前文；现代汉语在此无需另加“如今”或“于是”，省略后叙事衔接仍然清楚。
theological_decisions:
- issue: 法版及其文字与上帝的关系
  choice: 以两个名词性判断句分别表明法版是上帝的作品、其字是上帝的字。
  alternative: 可动态译为“法版是上帝造的，字也是上帝写的”。
  rationale: 原文用“上帝的作品”和“上帝的字／书写”归属于上帝，却未使用两个明确的有限动词来细分制作和书写的方式。保留名词结构可避免过度解释，同时维持双重强调。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“作品”保留原文名词结构；“版上的字是上帝的字”刻意保留原文重复所形成的强调。脚注标记[a]已置于正文对应位置。
