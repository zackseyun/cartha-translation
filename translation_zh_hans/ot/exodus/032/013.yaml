  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: zh_hans
  text: 求你记念你的仆人亚伯拉罕、以撒和以色列[a]；你曾指着自己向他们起誓，对他们说：‘我要使你们的后裔增多，如同天上的星；我所说的这整片土地，我要赐给你们的后裔，他们要永远承受这地。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列”就是先祖雅各后来所得的名字；希伯来原文此处作“以色列”。
    reason: 说明人物身份，同时保留原文实际使用的名字，避免读者误以为这里另指他人。
lexical_decisions:
- source_word: זְכֹר
  choice: 求你记念
  rationale: 这是摩西向上帝发出的阳性单数祈使语。“记念”保留盟约语境中不只是想起、也据此施恩行动的意味；“求你”使汉语中的恳求语气自然明确。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: 亚伯拉罕、以撒和以色列
  rationale: 按希伯来原文保留“以色列”，不以“雅各”代换，以维持其获赐之名在盟约呼求中的意味。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 此处强调三位先祖与上帝之间的从属和盟约关系；“仆人”比“奴隶”更符合语境。
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: 你曾指着自己向他们起誓
  rationale: “指着自己”自然表达 בָּךְ 的反身含义，即上帝以自己作为誓言的保证。
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: 对他们说
  rationale: 在直接引语前，“对他们说”是现代汉语最自然的表达，同时准确传达“向他们说话”。
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: 我要使你们的后裔增多
  rationale: רבה 的使役形表示使之增多；זרע 在这里是集合性名词，“后裔”可自然涵盖众多子孙。
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: 如同天上的星
  rationale: 采用自然、庄重的汉语比喻，准确表达数量繁多的应许。
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: 这整片土地
  rationale: “整片”表达 כָל 的整体范围，也保留 הַזֹּאת 的指示意味。
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: 我所说的
  rationale: 按原文将这一关系分句独立译出，不把后面的“我要赐给”并入其中，从而避免将两个希伯来语分句融合。
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: 我要赐给你们的后裔
  rationale: 未完成式在引述的应许中表达将来；“赐给”符合上帝赐地的语境。
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: 他们要永远承受这地
  rationale: נחל 表示承受产业；汉语补出由上下文明确的宾语“这地”，并以“永远”表达 לְעֹלָם 的持续性。
theological_decisions:
- issue: 先祖之名应译作“以色列”还是“雅各”
  choice: 正文保留“以色列”
  alternative: 雅各
  rationale: 希伯来原文明写“以色列”。改作“雅各”会以解释取代翻译，并削弱更名与盟约身份的呼应。
- issue: 誓言公式 בָּךְ 的表达
  choice: 指着自己起誓
  alternative: 以自己起誓
  rationale: “指着自己起誓”是清楚自然的汉语圣约用语，保留上帝以自身作为誓言保证的含义，而不额外作教义解释。
- issue: אֲשֶׁר אָמַרְתִּי 与 אֶתֵּן 的分句关系
  choice: “我所说的这整片土地，我要赐给……”
  alternative: “这整片土地，就是我说过要赐给……”
  rationale: 正文保留原文中“我所说的”和“我要赐给”两个相邻但有区别的成分，不将后一分句的内容提前并入关系分句。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。以“记念、起誓、后裔、承受”等词维持盟约陈述的尊严，但避免生僻古语；直接引语的分句结构尽量贴近希伯来原文，同时保持汉语可读性。
