  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: zh_hans
  text: 第二天，摩西对百姓说：“你们犯了大罪[a]。现在我要上到雅威那里去，或许我能为你们的罪赎罪。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“你们犯了一个大罪”，动词“犯罪”和名词“罪”出自同一词根，用来加强对罪行严重性的表达。
    reason: 说明希伯来文同源宾语结构及其强调作用。
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: 第二天
  rationale: 希伯来叙事句式引出紧接着发生的事；现代汉语用“第二天”即可自然表达时间推进，无须生硬补出“事情发生了”。
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: 摩西对百姓说
  rationale: 准确保留说话者、受话者及普通言说动词的关系，符合现代汉语习惯。
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: 你们犯了大罪
  rationale: 保留显明的复数代词“你们”和罪行的严重性；汉语“犯了大罪”自然传达同源宾语结构的加强语气。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 标明从指控百姓转到摩西下一步行动；汉语不必机械译出连接词，语篇衔接仍然清楚。
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: 我要上到雅威那里去
  rationale: “上到”保留摩西登山、前往神面前的空间含义；“雅威”音译四字神名，保留其专名性质。
- source_word: אוּלַי
  choice: 或许
  rationale: 表达摩西对代赎结果的希望与不确定性，语气庄重而自然。
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: 我能为你们的罪赎罪
  rationale: 在此代求语境中，כפר指施行赎罪；“为你们的罪”表达בְּעַד的代表或受益关系。与“或许”连用，保留可能性而非保证。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译“雅威”保留其作为以色列之神盟约名字的性质，不以称号替代。
- issue: 摩西能否实现赎罪的语气
  choice: 或许我能为你们的罪赎罪
  alternative: 也许我可以为你们赎罪；或许我能为你们的罪求得赦免
  rationale: אוּלַי明确保留希望中的不确定性；译文不预先断定摩西的行动必然有效，也不把“施行赎罪”改释为单纯“求得赦免”。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“大罪”“赎罪”保留经文的神学分量；句式简洁，适合公开诵读。
