base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: zh_hans
  text: 亚伦见状，便在它面前[a]筑了一座坛。随后，亚伦宣告说：“明日要为雅威守节。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他面前”。希伯来文的代词在语法上也可能指亚伦，但上下文更可能是指牛犊。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: 亚伦见状
  rationale: 动词意为“看见”。希伯来文未明说宾语，语境指向上一节刚铸成的牛犊；“见状”在现代汉语中自然承接上文，又避免补入过于具体的宾语。
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: 筑了一座坛
  rationale: 准确表达“建造祭坛”；“筑坛”简洁、庄重，也是现代读者易懂的宗教叙事用语。
- source_word: לְפָנָיו
  choice: 在它面前
  rationale: 阳性单数后缀在语法上可指牛犊，也可能指亚伦；叙事语境更自然地指刚造出的牛犊，因此正文用“它”，并以脚注保留语法上的另一可能。
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: 宣告说
  rationale: קרא在此表示公开宣告，后接“说”；“宣告说”既保留两个动词的结构，也符合汉语表达。
- source_word: חַג
  choice: 守节
  rationale: חַג指宗教节期或节庆。结合介词短语译作“向雅威守节”，比直译为“宴席”更能体现敬拜与节期含义，同时不额外限定为朝圣节。
- source_word: לַיהוָה
  choice: 向雅威
  rationale: 介词ל在此表达节期所归向、所献给的对象；“向雅威守节”自然传达这一关系。יהוה按其专名音译为“雅威”。
- source_word: מָחָר
  choice: 明日要
  rationale: 原文以“明日”构成无明示系词的宣告；汉语补出“要”，自然表达预告将举行节庆。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近YHWH传统拟音的“雅威”，将其作为专名呈现，而不以“主”替代。
- issue: לְפָנָיו中代词的所指
  choice: 指牛犊，即坛筑在牛犊面前
  alternative: 指亚伦，即坛筑在他面前
  rationale: 阳性单数后缀在语法上可以回指亚伦，但紧接上一节所造的牛犊，场景上更自然是祭坛设在神像前；正文采用这一理解，脚注保留另一种语法可能。
- issue: חַג לַיהוָה的关系
  choice: 向雅威守节
  alternative: 雅威的节期
  rationale: 介词ל可表示归属、对象或奉献方向；“向雅威守节”保留这是亚伦声称献给雅威的庆典，而不替叙事判断该敬拜是否蒙悦纳。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“见状”“筑了一座坛”“宣告说”衔接自然；正文不替读者消解亚伦以牛犊敬拜雅威所形成的神学张力。
