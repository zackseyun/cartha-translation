source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: zh_hans
  text: 他对他们说：“以色列的上帝雅威如此说：你们各人要把刀佩在腰间，在营中从这门到那门来回穿行；各人要杀自己的弟兄，各人要杀自己的同伴，各人要杀自己亲近的人[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亲近的人”：希伯来文也可译作“近亲”或“关系亲近的人”。
    reason: 原词 קְרֹבוֹ 可指亲近者，也常指近亲；注释保留其词义范围。
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: 他对他们说
  rationale: 保留希伯来叙事中的第三人称指代，不从上下文补出人名；汉语不必机械译出句首连接词。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留宣告权威话语的固定使者公式，同时符合庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来四字神名的通行学术拟音处理，保留其专名性质，不以“主”这一称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的属格结构，并清楚标明雅威与以色列的关系。
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: 你们各人要把刀佩在腰间
  rationale: 该短语意为武装起来；“佩在腰间”比逐字的“放在大腿上”更自然，也不增加原文没有的动作细节。
- source_word: עִבְרוּ וָשׁוּבוּ מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: 在营中从这门到那门来回穿行
  rationale: “来回穿行”概括两个命令动词所表达的往返行动；“从这门到那门”保留营门之间的分布性范围。
- source_word: וְהִרְגוּ
  choice: 要杀
  rationale: 直译其使人死亡的普通含义，不以较含蓄的措辞弱化命令。
- source_word: אִישׁ אֶת אָחִיו וְאִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת קְרֹבוֹ
  choice: 各人要杀自己的弟兄，各人要杀自己的同伴，各人要杀自己亲近的人
  rationale: 保留三次 אִישׁ 的分配性重复及三类亲近关系；末项采用较宽泛的表达，以免把 קָרוֹב 未必唯一确定的亲属或近人含义缩窄。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；“雅威”较贴近现代学界对该名称的拟音，并避免用称号取代专名。“耶和华”是汉语传统形式，但反映的是较晚的混合读法。
- issue: 三次 אִישׁ 的保留
  choice: 三次译作“各人”
  alternative: 只在开头译一次，其后并列宾语
  rationale: 重复突出了每个人都必须执行命令，也保留原文令人震动的逐项列举，不将其平滑处理。
- issue: קְרֹבוֹ 所指关系的范围
  choice: 自己亲近的人
  alternative: 自己的近亲；自己的邻人
  rationale: 该词可指关系或血缘上亲近的人；正文保留其范围上的含混，不把它限定为近亲或地理上的邻居。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。命令语气明确；以“佩在腰间”“来回穿行”表达希伯来语习语，同时保留三次“各人”的修辞重复及末项关系称谓的真实歧义。
