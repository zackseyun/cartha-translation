source:
  edition: WLC
  text: וְ/עַתָּ֖ה אִם תִּשָּׂ֣א חַטָּאתָ֑/ם וְ/אִם אַ֕יִן מְחֵ֣/נִי נָ֔א מִֽ/סִּפְרְ/ךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: zh_hans
  text: 可是现在，倘若你肯赦免[a]他们的罪……若不然，求你从你所写的册[b]上把我涂去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赦免”所译的希伯来语惯用说法，字面是“举起／承担／带走罪”，也可译作“除去他们的罪”或“饶恕他们的罪”。
    reason: lexical_alternative
  - marker: b
    text: “册”可能指上帝所掌管的活人名册，也可能引申指生命册；希伯来原文本身没有进一步说明。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 可是现在
  rationale: 这一短语标志话语转折，并承接摩西先前的代求；“可是现在”既保留转折语气，也符合现代汉语表达。
- source_word: אִם תִּשָּׂא חַטָּאתָם
  choice: 倘若你肯赦免他们的罪
  rationale: נשׂא 字面有“举起、承担、带走”之意，以“罪”为宾语时是表示赦罪的希伯来语惯用法。“赦免”清楚自然；“倘若……肯”也保留条件句及恳求语气。
- source_word: וְאִם אַיִן
  choice: 若不然
  rationale: 这是省略了前述内容的否定条件句，意为“但如果你不赦免”；“若不然”简洁地保留原文的省略和转折。
- source_word: מְחֵנִי נָא
  choice: 求你……把我涂去
  rationale: מחה 表示擦除、涂抹；在册籍意象中，“涂去”贴切。נָא 是恳求语气词，以“求你”表达其迫切而谦卑的语气。
- source_word: מִסִּפְרְךָ
  choice: 从你的册上
  rationale: סֵפֶר 可指书卷、册籍或书面记录。“册”适合姓名被登记或涂去的语境，同时不擅自限定这册的具体性质。
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: 你所写的
  rationale: 直接保留关系从句，明确这册是上帝亲自写成的，而不增添原文没有说明的内容。
theological_decisions:
- issue: “你的册”的具体所指
  choice: 你所写的册
  alternative: 生命册；活人名册；你的记录
  rationale: 原文只说“你的册”，并未明确它是生命册、活人名册或其他神圣记录。因此正文保留较宽泛的“册”，不消除原文的神学张力。
- issue: 第一个条件句未说完的修辞停顿
  choice: 以省略号保留：“倘若你肯赦免他们的罪……”
  alternative: 补成“倘若你肯赦免他们的罪，就请赦免吧”
  rationale: 希伯来原文在第一个条件句后没有明说结果句，形成强烈的欲言又止。用省略号保留这一中断，避免替摩西补入原文没有的话。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“可是现在”体现语篇转折；“倘若”与“求你”保持摩西代求的郑重语气。用省略号再现原文第一个条件句悬而未决的表达，并以“册”保留所指的开放性。
