base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“我已经看见这百姓；看哪，他们是颈项刚硬的百姓[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“顽固的百姓”。希伯来语直译为“颈项刚硬的百姓”，比喻顽梗、抗拒。
    reason: 说明希伯来语习语的字面意象及其含义，并提供自然的中文替代译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，避免将其泛化为“主”。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 自然呈现希伯来叙事中的连续动作；中文无须机械补出句首连接词。
- source_word: רָאִיתִי
  choice: 我看
  rationale: 保留“看见、观察”的基本语义，并让其自然引出上帝对百姓的判断；不额外强化为“看透”或“看清”。
- source_word: הָעָם הַזֶּה
  choice: 这百姓
  rationale: 保留עָם的集合单数和指示语气，也符合中文圣经叙事的庄重表达。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意并加强下文判断的语篇功能，语体庄重而可懂。
- source_word: קְשֵׁה עֹרֶף
  choice: 硬着颈项
  rationale: 保留希伯来语“颈项刚硬”的鲜明身体隐喻，而不在正文中直接压平为“顽固”。
- source_word: הוּא
  choice: 他们是
  rationale: 原文代词与集合单数“百姓”呼应；现代汉语以复数人称回指群体更自然，不改变其集合意义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文因此采用中文传统中广为人知的专名“耶和华”，而不译作称号“主”；“雅威”是更贴近学界常见拟音的可行替代。
- issue: קְשֵׁה עֹרֶף隐喻的保留
  choice: 硬着颈项的百姓
  alternative: 顽固的百姓
  rationale: 原文以拒绝低头或受引导的身体意象表达顽梗、抗拒；保留隐喻可避免把其神学与修辞张力只化约为抽象性格描述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“看哪”略带经文式庄重感，用来保留וְהִנֵּה的强调作用；破折号标示观察与结论之间的推进。脚注标记置于其实际解释的习语之后。
