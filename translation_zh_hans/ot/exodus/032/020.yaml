  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: zh_hans
  text: 他取了他们所造的牛犊，用火焚烧，把它磨得极细，撒在水面上，让以色列人喝下去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列人”：希伯来语字面为“以色列的众子”，是对以色列百姓整体的常用称呼。
    reason: 说明原文称谓的字面形式及其群体用法。
lexical_decisions:
- source_word: הָעֵגֶל
  choice: 牛犊
  rationale: עֵגֶל指幼小的牛；本节所指是金牛犊偶像。“牛犊”既准确，也符合现代中文读者熟悉的称呼。
- source_word: אֲשֶׁר עָשׂוּ
  choice: 他们所造的
  rationale: 关系从句说明这牛犊是百姓先前造的；“所造的”简洁自然，也保留原文的指认作用。
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: 用火焚烧
  rationale: בָּאֵשׁ可表达以火为手段；“用火焚烧”贴近原文，又是庄重自然的现代汉语。
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: 磨得粉碎
  rationale: טחן是“磨”，דק表示细小。此处“磨得粉碎”传达磨到极细的结果，同时避免把名词“粉末”强加给原文。
- source_word: וַיִּזֶר
  choice: 撒
  rationale: 该动词在这里表示把磨碎之物散布出去；“撒”比“簸扬”等说法更自然，也不作不必要的具体化。
- source_word: עַל פְּנֵי הַמַּיִם
  choice: 在水面上
  rationale: פְּנֵי在此指表面；“在水面上”准确保留原文的空间图景。
- source_word: וַיַּשְׁקְ
  choice: 叫……喝下去
  rationale: 这是שׁקה的使役形，意为使人喝。“叫……喝下去”自然表达使役含义，而“下去”说明喝入，未增添液体之外的对象。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，但在这里是指以色列全体百姓的常用群体称谓。现代汉语以“以色列人”表达最自然，并在脚注保留字面形式。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל的群体范围与字面形式
  choice: 正文译作“以色列人”
  alternative: “以色列的众子”
  rationale: 此固定称谓在叙事中指以色列百姓整体，并非只强调男性后裔。中文“以色列人”既保留群体身份，也避免读者误以为这里只让男性喝；脚注交代希伯来语的字面形式，不以译文解决超出原文的问题。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。连续使用“拿来、焚烧、磨、撒、叫……喝”呈现希伯来语连续动作；不补出水的来源，也不解释这一行动的象征意义。
