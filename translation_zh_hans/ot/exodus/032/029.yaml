base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: zh_hans
  text: 摩西说：“今天你们要献身归给耶和华[a]；因为各人都反对自己的儿子和弟兄，今天就有福分赐给你们[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “献身归给”原文直译为“充满你们的手”，是表示授职或奉献的惯用语。
    reason: 说明希伯来语惯用语，避免读者以为原文直接使用“献身”一词。
  - marker: b
    text: 原文没有明说是谁赐下这福分。
    reason: 保留末句不定式结构中施予者未明的句法歧义。
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: 把自己分别出来归给
  rationale: 原文直译为“充满你们的手”，是表示授职、奉献或分别为圣的惯用语。此处用现代汉语表达其功能，同时避免把利未人在这一事件中的奉献过度限定为某种后世宗派性的圣职制度。
- source_word: לַיהוָה
  choice: 归给耶和华
  rationale: 介词 ל 表示归属、奉献的对象；采用“归给”与前面的分别出来自然衔接。神名 יהוה 按现代中文圣经通行方式译作“耶和华”。
- source_word: אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: 各人都与自己的儿子和弟兄为敌
  rationale: 希伯来文此处省略了谓语，字面结构为“各人在自己的儿子和弟兄中间／与他们相对”。结合上文利未人执行审判的行动，译作“与……为敌”既保留对立意味，也不额外补入“杀死”等原文此节未明说的动作。
- source_word: בְּרָכָה
  choice: 福分
  rationale: 该词是名词“祝福、福分”；“得着福分”在现代汉语中自然，并能与 לָתֵת（赐予、给予）的结果相应。
theological_decisions:
- issue: “分别出来归给耶和华”与暴力行动之间的关系
  choice: 保留原文以“因为”连接两者
  alternative: 弱化为一般性的忠诚宣告，或明确断言杀亲行为本身构成圣职授任
  rationale: 原文 כִּי 明确给出因由或说明，但句法高度凝缩。译文不消除这项令人不安的神学张力，也不超出本节断言某种普遍原则。
- issue: 末句赐福者的身份
  choice: 用“使你们今天得着福分”不明说施予者
  alternative: 译作“使耶和华／他今天赐福给你们”
  rationale: לָתֵת 是不定式，原文没有明示其逻辑主语。语境可使人理解为耶和华赐福，也可能将结构与摩西的宣告相连；译文保留这种未明确性。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“分别出来归给”比“承接圣职”更少制度化色彩；“与……为敌”保留原文凝缩而严峻的表达。分号帮助呈现命令、理由与结果之间的关系。
