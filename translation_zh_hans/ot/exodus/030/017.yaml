  yaml_path: translation/ot/exodus/030/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华对摩西说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该叙事性动词引出新的神谕。在现代汉语中，与后面的 לֵאמֹר 合并译为“对……说”最自然，避免生硬重复“讲话……说”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是神名四字母词。在现代简体中文圣经语境中，“耶和华”是广为人知且可直接作为专名使用的传统音译。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 在言说结构中标示话语对象，现代汉语自然译作“对”；מֹשֶׁה 采用通行译名“摩西”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出随后直接话语。汉语无需机械保留“讲话……说”的双重结构，与 וַיְדַבֵּר 合并为简洁的引语公式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非称号。正文保留中文读者最熟悉的专名形式“耶和华”；“雅威”更接近现代学界常见的拟定读音，但不宜据此把不确定的古代发音绝对化。
translation_notes:
  register: 采用现代、庄重且自然的叙事引语格式。希伯来语逐字结构近似“耶和华向摩西讲话，说”，正文按现代汉语习惯整合为“耶和华对摩西说：”，冒号提示下一节接续直接话语。
