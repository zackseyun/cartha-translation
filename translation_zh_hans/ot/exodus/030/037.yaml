  text: וְ/הַ/קְּטֹ֨רֶת֙ אֲשֶׁ֣ר תַּעֲשֶׂ֔ה בְּ/מַ֨תְכֻּנְתָּ֔/הּ לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם קֹ֛דֶשׁ תִּהְיֶ֥ה לְ/ךָ֖ לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: zh_hans
  text: 你所配制的香，不可按同样的配方[a]为自己配制[b]；你要把它视为圣物，归于雅威。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“按同样的成分比例”或“按同样的调制规格”。
    reason: lexical_alternative
  - marker: b
    text: 意思是，不可复制这种圣香供日常或私人使用。
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: 香
  rationale: 本节特指上文规定的圣香混合物；“香”是简洁自然的现代汉语表达，无须增译“芬芳”。
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: 你所配制的
  rationale: עשה在调制香料的语境中译作“配制”比泛泛的“制作”更自然，也保留关系从句的直接结构。
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: 按同样的配方
  rationale: מַתְכֹּנֶת在此可指规定的配方、成分比例或调制规格；结合前半句，补出“同样的”可自然表达其回指作用，同时脚注保留其他词义可能。
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: 不可……为自己配制
  rationale: 保留复数禁令及לָכֶם所表达的“供你们自己”的含义；中文以单数“你”承接本节后半句的לְךָ，并将群体性禁令理解为对以色列整体的吩咐。
- source_word: קֹדֶשׁ תִּהְיֶה לְךָ
  choice: 你要把它视为圣物
  rationale: 直译为“它对你要成为圣”在现代汉语中生硬；此译自然表达以色列应将它看作分别为圣之物，而不把“圣”弱化为仅仅“专用”。
- source_word: לַיהוָה
  choice: 归于雅威
  rationale: לְ可表达归属或奉献；“归于”贴合圣物专属于神的语境。按所给神名方针，将יהוה音译为“雅威”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为西奈之约中启示之名的性质，也符合所提供项目方针。
- issue: קֹדֶשׁ的圣别含义
  choice: 圣物
  alternative: 分别出来之物；至圣之物
  rationale: 原文仅为קֹדֶשׁ，表明神圣、归神的地位；“至圣”会加入本节没有的最高级含义，而只译“分别出来”则会削弱其神圣内涵。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“配制”贴合香料调合语境；分号保留禁令与圣别宣告之间的推进。正文中的[a]、[b]均与脚注对应。
