  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: zh_hans
  text: 你要用这油膏抹会幕和见证之柜[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统上常译作“约柜”；这里的希伯来原文是“见证”。
    reason: 说明传统译名与本节原文措辞的差异。
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: 你要膏抹
  rationale: Qal完成式第二人称阳性单数在连续的指示语境中表达命令；“膏抹”准确保留 משׁח 的礼仪含义。
- source_word: בּוֹ
  choice: 用这油
  rationale: 介词 בְּ 加第三人称阳性单数后缀表示工具，回指上文的膏油；中文明确为“这油”可自然呈现所指对象。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语体中自然、通行且简洁的表达，对应“相会之帐幕”。
- source_word: אֲרוֹן
  choice: 柜
  rationale: אָרוֹן 指盛放圣物的箱柜；“柜”在“见证柜”这一组合中清楚自然，也避免把 הָעֵדֻת 误释为“约”。
- source_word: הָעֵדֻת
  choice: 见证
  rationale: 直接对应“见证、证言”，保留原文用词，不以较熟悉但并非本节原词的“约”替代。
theological_decisions:
- issue: אֲרוֹן הָעֵדֻת 的译法
  choice: 见证柜
  alternative: 约柜
  rationale: 原文明确使用 הָעֵדֻת（见证），而非 בְּרִית（约）。正文保留这一词汇差异；脚注说明传统称法，以兼顾读者辨识。
translation_notes:
  register: 采用现代、庄重而易懂的指示语体。“会幕”沿用通行名称；“见证柜”忠实保留原文的“见证”，并用脚注交代读者更熟悉的“约柜”。
