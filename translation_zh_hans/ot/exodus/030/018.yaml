  text: וְ/עָשִׂ֜יתָ כִּיּ֥וֹר נְחֹ֛שֶׁת וְ/כַנּ֥/וֹ נְחֹ֖שֶׁת לְ/רָחְצָ֑ה וְ/נָתַתָּ֣ אֹת֗/וֹ בֵּֽין אֹ֤הֶל מוֹעֵד֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ וְ/נָתַתָּ֥ שָׁ֖מָּ/ה מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: zh_hans
  text: 你要造一个铜[a]盆[b]和一个铜盆座[c]，供洗濯用；要把它安放在会幕和祭坛之间，又要在那里放上水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铜”也可译作“青铜”；希伯来语这个词可指铜或铜合金，须按语境判断。
    reason: lexical_alternative
  - marker: b
    text: “盆”传统上也称“洗濯盆”，指会幕中盛水洗濯的大型器皿。
    reason: lexical_alternative
  - marker: c
    text: “盆座”也可译作“盆架”或“底座”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: 盆
  rationale: 指盛水供圣所洗濯使用的大型器皿。“盆”是现代汉语中清楚自然的对应词；传统名称“洗濯盆”可作说明，但正文不必增添原文未明说的用途成分。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜，也可按语境指铜合金。汉语“铜”既自然，又比明确译作“青铜”更能保留原词在材质上的宽泛性。
- source_word: כַנּוֹ
  choice: 铜盆座
  rationale: כַּן 指承托器皿的座或架。译作“盆座”明确表达它与铜盆的从属关系，也符合现代汉语器物名称的表达习惯。
- source_word: לְרָחְצָה
  choice: 供洗濯用
  rationale: 此目的不定式只说明洗濯用途，没有在本节明说洗什么或谁来洗。“供洗濯用”保留这种简洁和未限定性。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所名称在现代中文圣经语境中通行而简洁的译法，表达神与人相会之帐幕。
- source_word: מִזְבֵּחַ
  choice: 祭坛
  rationale: 在本段语境中指献祭所用的坛；“祭坛”比单称“坛”更便于普通读者理解。
- source_word: שָׁמָּה
  choice: 在那里
  rationale: 按副词本义译出“在那里”，不直接改写为“在盆里”，从而保留原文指称略为含蓄的表达；上下文自然使人理解水是为铜盆预备的。
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: 你要造……要把……又要……
  rationale: 这些形式在指示性语境中具有命令、规定的语气。汉语用“你要”自然传达持续的指令风格。
theological_decisions: []
translation_notes:
  register: 正文采用现代、庄重而易懂的指令体。“洗濯”略具礼仪语域，但仍属通行现代汉语，并可避免把原文未明说的受事擅自补成“自己”“手脚”或器物。保留“在那里”以贴近希伯来语地点副词，不在正文中消除其轻微的指称含蓄。
