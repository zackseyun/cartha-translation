base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: zh_hans
  text: 不可在这坛上献不合规定的香[a]、燔祭或素祭；也不可在这坛上倾倒奠祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“异香”或“外来的香”。这里的希伯来语形容词在礼仪语境中可指不合规定或未经许可的事物。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: 献
  rationale: 使役形字面为“使上升”，在献祭语境中惯用来表示把祭物献在坛上；译作“献”自然准确。
- source_word: עָלָיו
  choice: 在这坛上／在坛上
  rationale: 代词承接上文的香坛。中文明确补出“坛”，避免单用“其上”造成指代不清，同时保留空间关系。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 该名词指礼仪中焚烧的香；在本句献祭语境下，“香”简洁且清楚。
- source_word: זָרָה
  choice: 未经许可的
  rationale: 在祭司礼仪语境中，该形容词表示不合规定或未获准许的事物；“未经许可的”比现代汉语中的“奇异的”更准确，也不误导为民族意义上的“外来的”。
- source_word: וְעֹלָה
  choice: 也不可献燔祭
  rationale: עֹלָה是全烧于坛上的祭，采用通行且准确的礼仪术语“燔祭”；连接词在否定禁令中按汉语表达为“也不可”。
- source_word: וּמִנְחָה
  choice: 或素祭
  rationale: 在祭司文献的献祭语境中，מִנְחָה通常指谷物祭；“素祭”是中文圣经语域中简洁且较为人熟悉的对应词。
- source_word: וְנֵסֶךְ
  choice: 奠祭
  rationale: 该名词指倾倒液体所献的祭；“奠祭”准确表达这种礼仪类别。
- source_word: תִסְּכוּ
  choice: 浇
  rationale: 该动词在此指倾倒奠祭液体；与“奠祭”搭配译为“浇”既保留具体动作，也符合现代汉语。
theological_decisions:
- issue: זָרָה修饰“香”时的礼仪含义
  choice: 未经许可的香
  alternative: 异香／外来的香
  rationale: 本节规范香坛上获准进行的敬拜行为。译作“未经许可的”保留其不合规定、未获准许的祭礼含义，又不把它缩窄为单纯怪异或外族来源。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“这坛”明确承接上文的香坛；保留“燔祭、素祭、奠祭”等必要且通行的祭礼术语。分号体现原文由两项禁令构成的句法层次。
