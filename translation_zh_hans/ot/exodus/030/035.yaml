  text: וְ/עָשִׂ֤יתָ אֹתָ/הּ֙ קְטֹ֔רֶת רֹ֖קַח מַעֲשֵׂ֣ה רוֹקֵ֑חַ מְמֻלָּ֖ח טָה֥וֹר קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: zh_hans
  text: 你要把它制成香[a]，按调香师的手艺调制，掺盐[b]，纯净、圣洁[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“调和的香料”或“芳香混合物”。原文强调这是精心调制的芳香制品。
    reason: lexical_alternative
  - marker: b
    text: 或译“用盐调制”；也有人理解为“调和均匀”。原词通常与“盐”有关，但这里具体描述怎样调制，存在不同理解。
    reason: lexical_ambiguity
  - marker: c
    text: 或译“神圣”。原文只说“圣”，本节并没有说“至圣”。
    reason: lexical_and_theological_precision
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  choice: 你要把它制成
  rationale: 连词加完成式在本段指示语境中表达命令；“你要”保留律例式语气。“它”对应阴性单数宾语代词，并回指上一节所列材料形成的混合物。
- source_word: קְטֹרֶת רֹקַח
  choice: 香
  rationale: קְטֹרֶת 指供焚烧的香；רֹקַח 强调经过精心调和的芳香制品。正文用礼仪语境中自然简洁的“香”，并以脚注保留“调和香料”等词义层面。
- source_word: מַעֲשֵׂה רוֹקֵחַ
  choice: 按调香师的手艺调制
  rationale: 原文直指“调香师的作品/工艺”，既强调专业技艺，也说明这香经过调和；此译法在现代汉语中清楚而庄重。
- source_word: מְמֻלָּח
  choice: 掺盐
  rationale: 该被动分词源于与“盐”有关的词根，最直接表示加盐或用盐调制。“掺盐”比“加盐调味”更适合非食物的香料语境，同时脚注保留可能的不同理解。
- source_word: טָהוֹר
  choice: 纯净
  rationale: 在礼仪和材料语境中，该词兼有纯正与洁净之意；“纯净”比日常的“干净”更符合圣所用物的语域。
- source_word: קֹדֶשׁ
  choice: 圣洁
  rationale: 该词在此以谓语性用法表明这香被分别出来归于神圣用途。“圣洁”直接传达其性质，又不擅自加强为“至圣”。
theological_decisions:
- issue: 香的礼仪地位
  choice: 圣洁
  alternative: 神圣；至圣
  rationale: 原文仅为 קֹדֶשׁ（“圣”），没有表达“至圣”的加强结构。正文因此不把本节的措辞提升为“至圣”，同时以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语体。“按调香师的手艺调制”保留原文对专业工艺的强调；末尾“纯净、圣洁”维持两个并列性质词的简洁力度。
