  text: אַמָּ֨ה אָרְכּ֜/וֹ וְ/אַמָּ֤ה רָחְבּ/וֹ֙ רָב֣וּעַ יִהְיֶ֔ה וְ/אַמָּתַ֖יִם קֹמָת֑/וֹ מִמֶּ֖/נּוּ קַרְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: zh_hans
  text: 它长一肘，宽一肘，要呈正方形[a]；高二肘。坛角要与坛连成一体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “正方形”也可译作“四方形”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从它而出”，意思是坛角由坛本身延伸出来，与坛连成一体。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה / אַמָּתַיִם
  choice: 一肘 / 二肘
  rationale: 保留古代长度单位“肘”，对应单数和双数形式，避免换算成现代单位所造成的虚假精确。
- source_word: אָרְכּוֹ / רָחְבּוֹ / קֹמָתוֹ
  choice: 它长 / 宽 / 高
  rationale: 在制作规格的语境中，用现代汉语简洁表达长、宽、高，比逐字译作“它的长度、它的宽度、它的高度”更自然，同时完整保留尺寸信息。
- source_word: רָבוּעַ
  choice: 正方形
  rationale: 该词表示方形、四边形；此处长宽相同，译作“正方形”清楚自然。
- source_word: יִהְיֶה
  choice: 要呈
  rationale: 未完成式在会幕制作指示中表达规定或要求；“要呈”符合现代汉语的规格说明语体。
- source_word: קַרְנֹתָיו
  choice: 坛角
  rationale: 指祭坛上角状的突起。“坛角”保留礼仪器物的专门称谓及相关经文之间的联系。
- source_word: מִמֶּנּוּ
  choice: 要与坛连成一体
  rationale: 字面为“从它而出”。在器物制作语境中，表示坛角由坛本身延伸出来，并非另行装上；“与坛连成一体”自然表达这一结构关系。
