  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: zh_hans
  text: 你要把它制成圣膏油[a]，就是由调香师按其手艺配制的芳香油；它要成为圣膏油。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“分别为圣、用于膏抹的油”。原文也强调这是一种由熟练工匠配制的芳香制品。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要……制成
  rationale: 在连续训令语境中，带连接词的完成式表达命令；“你要”自然保留指令语气。
- source_word: אֹתוֹ
  choice: 把它
  rationale: 宾格代词回指上一节所列香料与油所构成的材料。
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: 圣膏油
  rationale: 该组合结构指分别为圣、用于膏抹的油；“圣膏油”简洁自然，并在本节两处保持一致。
- source_word: רֹקַח מִרְקַחַת
  choice: 调制成芳香的混合物
  rationale: 两个同源词共同突出芳香材料经过配制、混合而成；中文以“调制”和“混合物”体现这种重复语义。
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: 按调香师的手艺
  rationale: 直指专业配制芳香制品之人的工艺；“调香师”符合本段香料与香膏语境，也体现技术性。
- source_word: יִהְיֶה
  choice: 它要成为
  rationale: 未完成式说明制成后的结果或规定状态；“要成为”兼顾训令语气和结果意义。
