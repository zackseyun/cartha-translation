  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: zh_hans
  text: 你要做一座烧香的坛[a]，要用金合欢木做。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可较简洁地译作“香坛”。希伯来文较直译为“烧香的坛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 你要做
  rationale: 连词加第二人称阳性单数完成式出现在连续指示中，具有命令性；译作“你要做”既自然，也保留律法指示的语气。
- source_word: מִזְבֵּחַ
  choice: 一座……坛
  rationale: “坛”是该礼仪设施在现代汉语圣经语境中的标准称呼；量词“座”符合汉语习惯。
- source_word: מִקְטַר קְטֹרֶת
  choice: 烧香的
  rationale: 该结构指焚烧香料或献香的用途。“烧香的坛”清楚表达功能，并保留原文较展开的表达，而不直接压缩为专名。
- source_word: עֲצֵי שִׁטִּים
  choice: 金合欢木
  rationale: 原文是指金合欢属木材的惯用表达；“金合欢木”是现代、明确的植物材料名称。
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: 要用……做
  rationale: 原文再次使用“做”并以代词回指坛。汉语将材料置于“用……做”结构中，既保留重复的动作，又表达自然。
