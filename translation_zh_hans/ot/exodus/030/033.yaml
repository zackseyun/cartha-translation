base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: zh_hans
  text: 凡调制与这圣膏油相同的膏油[a]，或把其中一些抹在未经许可的人身上的人，必从自己的族人中被剪除。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“调制这样的膏油。”原文指与上述圣膏油相同或同类的制品。
    reason: lexical_alternative
  - marker: b
    text: “从自己的族人中被剪除”是盟约法律中的惯用说法；本节没有说明这种惩罚具体如何施行。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: 凡……的
  rationale: 该短语字面为“某人若”，在法律条文中泛指任何人；“凡……的”自然保留普遍适用的法律语气。
- source_word: יִרְקַח
  choice: 调制
  rationale: רקח 指配制香料或膏油；“调制”既体现技术性，也符合本段制作圣膏油的语境。
- source_word: כָּמֹהוּ
  choice: 与这相同的膏油
  rationale: 该词回指前文的圣膏油，表达制作同类或相同配方之物的禁令；补出“膏油”使中文指代清楚。
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: 或把其中一些抹在
  rationale: נתן על 在此指把部分膏油放于或施于某人身上；“抹在”贴合膏油用途，又不改变数量上的部分意义。
- source_word: עַל זָר
  choice: 在未经许可的人身上
  rationale: 祭司礼仪语境中的 זָר 主要指无权领受或使用圣物者，而非特指异族人；此译法明确表达礼仪资格界线。
- source_word: וְנִכְרַת
  choice: 都要……被剪除
  rationale: 保留 כרת 的盟约法律惯用语，不将其擅自具体化为处死、驱逐或神直接施罚。
- source_word: מֵעַמָּיו
  choice: 从自己的族人中
  rationale: 直译其从所属群体中被除去的关系；“族人”在现代中文中比“百姓”更能体现 מֵעַמָּיו 的归属含义。
theological_decisions:
- issue: 祭司圣洁法规中 זָר 的含义
  choice: 未经许可的人
  alternative: 外人；陌生人；非祭司
  rationale: 上下文所划定的是领受圣膏油的礼仪资格，而非族裔身份。“未经许可的人”避免让读者误解为外国人，也不把范围过度限定为所有非祭司者。
- issue: וְנִכְרַת מֵעַמָּיו 所指的惩罚方式
  choice: 从自己的族人中被剪除
  alternative: 从族人中被逐出；被处死
  rationale: 原文使用盟约法律公式，却未在本节说明执行方式；保留“剪除”可维护原文在司法、群体及神圣惩罚层面的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“调制”体现礼仪配方的技术语境；“未经许可的人”传达 זָר 在本段中的礼仪资格含义；“被剪除”有意保留希伯来法律公式及其未决含义。所有脚注标记均置于正文对应位置。
