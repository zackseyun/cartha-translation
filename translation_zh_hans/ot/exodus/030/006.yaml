base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: zh_hans
  text: 你要把它安放在幔子前面；这幔子在见证之柜[a]前面，也在见证上方的赎罪盖[b]前面；我要在那里与你相会。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “见证之柜”常被译作“约柜”；但这里的希伯来文是“见证”，不是“约”。
    reason: lexical_alternative
  - marker: b
    text: “赎罪盖”传统上也译作“施恩座”，指见证之柜上面的金盖。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: 你要把它安放
  rationale: נתן在此表示按指示放置器物；“安放”自然、庄重，也准确表达固定位置的语境。“它”保留原文对前述香坛的代词指称。
- source_word: לִפְנֵי
  choice: 在……前面
  rationale: 原文两次使用同一介词短语，主要表达空间位置；两处均译作“在……前面”，既清楚又保持重复。
- source_word: הַפָּרֹכֶת
  choice: 幔子
  rationale: 指分隔圣所与至圣所的内幔。“幔子”是现代汉语可懂且符合会幕语境的称呼。
- source_word: אֲרוֹן הָעֵדֻת
  choice: 见证之柜
  rationale: 原文直指“见证”而非使用“约”一词。“见证之柜”保留词汇对应，也避免以传统的“约柜”替换原文措辞。
- source_word: הַכַּפֹּרֶת
  choice: 赎罪盖
  rationale: 指见证之柜上方的金盖，并带有赎罪礼仪含义。“赎罪盖”既指出实体是盖，也保留该词的礼仪内涵；传统译法另见脚注。
- source_word: הָעֵדֻת
  choice: 见证
  rationale: 与本节前面的עֵדוּת一致译作“见证”，不擅自改成“约”或明确补成“法版”，从而保留原文表达。
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: 我要在那里与你相会
  rationale: יעד的尼法勒形在此表示约定的会面；“相会”自然传达上帝在指定地点与摩西会面的意思，同时明确译出שָׁמָּה“在那里”。
theological_decisions:
- issue: הַכַּפֹּרֶת这一礼仪术语的译法
  choice: 赎罪盖
  alternative: 施恩座
  rationale: 该词所指首先是柜上的盖，同时与赎罪礼仪相关。“赎罪盖”兼顾实体和礼仪语义，不把“座位”的形象强加给原文；脚注保留传统译法，以免遮蔽读者熟悉的称呼。
- issue: עֵדוּת在柜名和后续短语中的译法
  choice: 见证
  alternative: 约；法版
  rationale: 本节两处都是עֵדוּת，并非בְּרִית“约”。译作“见证”保持原文词汇透明度；不在正文中补成“法版”，也保留其所指表达的简约性。
- issue: 方位关系的重复表达
  choice: 保留两次“前面”，用“就是……也就是……”呈现同一位置的逐层限定
  alternative: 合并为一句较自由的方位说明
  rationale: 原文依次以幔子、柜和赎罪盖界定香坛的位置。保留这种重复可避免抹平礼仪空间关系，同时用现代汉语连接词使句意可读。
translation_notes:
  register: 采用现代、庄重而清楚的书面汉语。“安放”“幔子”“相会”符合会幕礼仪语境，又不显陈旧。正文保留希伯来文的方位重复和“见证”用语，并以脚注说明较熟悉的传统译名。
