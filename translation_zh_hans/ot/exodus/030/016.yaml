  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: zh_hans
  text: 你要从以色列子民[a]收取赎罪银，把它用于会幕的事奉；这银要在雅威面前作以色列子民的纪念，为你们的性命[b]赎罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列众子”；也可译“以色列人”。
    reason: 说明希伯来语惯用群体称谓的字面形式。
  - marker: b
    text: 原文为“你们的性命”（希伯来语נַפְשֹׁתֵיכֶם）；这里可指“你们的性命”或“你们自己”，并非特指与身体相对的“灵魂”。
    reason: 澄清נֶפֶשׁ在本节生命、本人语境中的含义，并准确呈现原文词形。
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: 赎罪银
  rationale: כֶּסֶף可指银或银钱；在本段中是人口登记时缴纳的银钱。הַכִּפֻּרִים源于כפר，带有赎罪、遮盖罪责的祭仪含义。“赎罪银”简洁自然，也与上下文相符。
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: 从以色列子民
  rationale: בְּנֵי יִשְׂרָאֵל字面为“以色列众子”，但在这里是对以色列群体的惯用称呼。“以色列子民”既保留其盟约群体色彩，又符合现代汉语表达；脚注注明字面形式。
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: 用于会幕的事奉
  rationale: עַל在此表示用途或拨归，עֲבֹדָה在圣所语境中指相关工作或服事。“用于会幕的事奉”准确表达银钱的指定用途。
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: 这银要……作……纪念
  rationale: זִכָּרוֹן可指纪念物或使人记念之物。以“作……纪念”保留原文没有进一步说明纪念如何发挥作用的开放性。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי是“在……面前”，在祭仪语境中也有“在……临在中”的意味；יְהוָה按其专名译为“雅威”。
- source_word: לְכַפֵּר עַל נַפְשֹׁתֵיכֶם
  choice: 为你们的性命赎罪
  rationale: כפר的Piel不定式在祭司传统中表示施行赎罪；נֶפֶשׁ在这里指人的生命或本人，而非与身体相对的非物质“灵魂”。“性命”保留生命受到保全的语境含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。采用“雅威”作为现代汉语中对该名的音译，保留西奈之约语境中的专名性质。
- issue: בְּנֵי יִשְׂרָאֵל的群体与性别表达
  choice: 以色列子民
  alternative: 以色列众子／以色列人
  rationale: 该短语形式上是阳性复数，字面为“以色列众子”，但也是称呼盟约群体的固定表达。正文用自然而庄重的“以色列子民”，脚注保留其字面形式，避免把希伯来语惯用表达误解为现代汉语中特别强调性别的称呼。
- issue: 赎罪银与人的赎罪之间的关系
  choice: 保留“为你们的性命赎罪”
  alternative: 使你们免受灾祸／作为你们的赎价
  rationale: 上下文涉及赎价、人口登记与免受灾祸，但本节明确使用כפר。正文不把它缩减为仅仅免灾，也不扩展为超出本节的系统性赎罪解释。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“把它用于”清楚承接单数的赎罪银；分号保留原文两个并列分句的推进关系。祭仪术语采用“赎罪”“会幕”“事奉”，不额外引入宗派性解释。
