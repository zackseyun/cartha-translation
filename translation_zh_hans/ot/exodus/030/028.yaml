  text: and the altar of burnt offering with all its utensils[a], and the basin with its stand.
translation:
  language: zh_hans
  text: 燔祭坛和坛的一切器具，以及洗濯盆和盆座。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: 燔祭坛
  rationale: מִזְבַּח意为“坛”，הָעֹלָה指全然焚烧的祭物。“燔祭坛”是简洁、庄重且已广为理解的现代中文祭祀术语。
- source_word: כָּל כֵּלָיו
  choice: 坛的一切器具
  rationale: כְּלִי可指器皿、用具或器械；此处指属于燔祭坛的各样器具。明确译出“坛的”，使代词所指清楚。
- source_word: הַכִּיֹּר
  choice: 洗濯盆
  rationale: כִּיּוֹר在会幕语境中指供祭司洗濯用的盆。“洗濯盆”既体现用途，也保持礼仪语体，比单译“盆”更明确。
- source_word: כַּנּוֹ
  choice: 盆座
  rationale: כֵּן在此指支承洗濯盆的座或台架；“盆座”简明自然，并清楚表达其与盆的所属关系。
- source_word: וְאֶת
  choice: 和；以及
  rationale: וְ连接清单中的各个受词，אֶת是受词标记，中文无需另译。分别用“和”“以及”自然呈现并列层次。
