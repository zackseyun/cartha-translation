  yaml_path: translation/ot/exodus/030/027.yaml
  text: and the table and all its utensils[a], and the lampstand and its utensils, and the altar of incense,
translation:
  language: zh_hans
  text: 桌子和它的一切器具，灯台和它的器具，以及香坛。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: 桌子
  rationale: 原文在此只用普通名词“桌子”，没有重复更完整的圣所专称；简洁译法忠实保留原文表达。
- source_word: כָּל כֵּלָיו
  choice: 桌子的一切器具
  rationale: כְּלִי 可指器皿、用具或器具；“器具”范围适当，也符合会幕陈设的语境。重复“桌子”比单用“它”更清楚自然。
- source_word: הַמְּנֹרָה
  choice: 灯台
  rationale: “灯台”直接表达 מְנוֹרָה 的用途，是现代中文圣经语境中自然且庄重的普通名词。
- source_word: כֵּלֶיהָ
  choice: 灯台的器具
  rationale: 阴性后缀回指“灯台”；明确重复所指，可避免中文代词可能产生的含混。
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: 香坛
  rationale: 该附属结构指与香相关、用于烧香的坛；“香坛”简洁、准确，也是自然的中文宗教用语。
theological_decisions: []
translation_notes:
  register: 采用现代、简洁而庄重的书面汉语。经文是上一节命令所列物件的续项，因此保留列举式结构，不补入原文没有的动词。英文咨询层的脚注标记位置与内容不相符；其所谓替代译法“incense altar”与“altar of incense”在中文均自然归入“香坛”，不构成需要脚注呈现的实质差异。
