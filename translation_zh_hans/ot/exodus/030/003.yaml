base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: zh_hans
  text: 要用纯金包覆坛的顶面、坛四周的壁和坛角；又要给坛四围做一道金边[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金边”也可译作“冠状金饰边”。希伯来语 זֵר 可指环绕器物的边、缘或冠状饰边。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: 要……包裹
  rationale: 此处צפה指在器物表面包覆金属；“包裹”是现代中文中自然且符合会幕器具语境的表达。
- source_word: זָהָב טָהוֹר
  choice: 纯金
  rationale: 准确表达高纯度的金，也是现代中文通行说法。
- source_word: גַּגּוֹ
  choice: 坛的顶面
  rationale: גג通常可指屋顶，但此处所指是香坛的上表面；“顶面”比“屋顶”更符合器物语境。
- source_word: קִירֹתָיו סָבִיב
  choice: 四围的壁
  rationale: קִירֹתָיו字面为“它的墙壁”；用“壁”既保留原文意象，也适合描述坛的竖直表面。סָבִיב译为“四围”，表达环绕各面的意思。
- source_word: קַרְנֹתָיו
  choice: 坛角
  rationale: קֶרֶן在祭坛语境中指四角伸出的角状部分。“坛角”是简洁、明确的礼仪器具术语，并保留“角”的形象。
- source_word: וְעָשִׂיתָ לּוֹ
  choice: 又要在坛……做
  rationale: לּוֹ表明这构件是为坛而设；中文按具体空间关系表达为“在坛的四围做”更自然。
- source_word: זֵר זָהָב
  choice: 一道金边
  rationale: זֵר可指环绕器物的边饰、缘或冠状镶边。“金边”清楚表达实体构件，又不过度引入君王冠冕的联想；量词“一道”符合环绕式边饰。
- source_word: סָבִיב
  choice: 四围
  rationale: 保留原文第二次出现的环绕含义，并与前半句形成自然重复。
theological_decisions:
- issue: 祭坛构件קַרְנֹתָיו的译法
  choice: 坛角
  alternative: 角；坛的角状突起
  rationale: 此处是会幕器具的具体构造，不宜抽象化或赋予额外象征意义。“坛角”保留传统礼仪术语，同时让现代读者明确其所属。
- issue: זֵר的形态与可能的冠冕意象
  choice: 正文译“金边”，脚注保留“冠状饰边”的可能
  alternative: 金冠；金牙边；金框
  rationale: 原词可表示边缘、镶边或冠状装饰。上下文首先描述祭坛的实体构造，故正文采用中性的“金边”；脚注保留其冠状外形这一真实词义幅度，不把经文解释成王权神学陈述。
translation_notes:
  register: 采用现代、庄重而易懂的说明性语体。以“坛”补明各所有格所指，避免连续使用“它”造成含混；保留原文两次“四围”的环绕意义。脚注标记[a]置于“金边”之后，与所释词直接对应。
