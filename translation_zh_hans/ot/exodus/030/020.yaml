source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: zh_hans
  text: 他们进入会幕时，要用水洗，免得丧命[a]；或是他们走近祭坛供职、为雅威焚烧火祭时[b]，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们就不至于丧命”或“他们也不会丧命”。
    reason: 原文形式上可理解为并列结果，语境中也可理解为目的或警戒。
  - marker: b
    text: 本句在下一节继续，下一节说明他们要洗手洗脚。
    reason: 原文第20节在句法和内容上延续到第21节，故正文以逗号收尾。
lexical_decisions:
- source_word: בְּבֹאָם
  choice: 他们进入……时
  rationale: 介词 בְּ 加带代词后缀的不定式构造表示时间；“进入……时”自然地表达进入会幕这一动作。
- source_word: אֹהֶל מוֹעֵד
  choice: 会幕
  rationale: 这是该圣所称谓在现代中文圣经语境中的通行译法，兼含相会之处与帐幕建筑的意义。
- source_word: יִרְחֲצוּ מַיִם
  choice: 要用水洗
  rationale: 保留原文明确提到的“水”；希伯来文未在本节明说洗什么部位，因此正文不提前补入下一节所说的手脚。
- source_word: וְלֹא יָמֻתוּ
  choice: 免得死亡
  rationale: 上下文使并列句带有警戒性的目的或结果意味；“免得死亡”简洁自然，也保留真实的死亡制裁。
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: 他们走近祭坛……时
  rationale: נגשׁ 表示靠近、走近，在祭司礼仪语境中也含有正式接近祭坛的意味。
- source_word: לְשָׁרֵת
  choice: 供职
  rationale: 此处指祭司履行圣职；“供职”比一般的“服事”更明确地传达正式礼仪职责。
- source_word: לְהַקְטִיר
  choice: 焚烧献上
  rationale: 该词的使役形在祭祀语境中指使祭物焚烧而烟气上腾；中文用“焚烧献上”兼顾动作和献祭功能。
- source_word: אִשֶּׁה
  choice: 火祭
  rationale: 该祭祀术语与火中献上的祭物相关；“火祭”简洁，并避免把有争议的词义直接限定为供神食用的“食物祭”。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 原文直接使用四字神名 יהוה；“雅威”以现代中文音译保留其专名性质，而不以称号替代。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用以色列之神的专名。音译“雅威”保留专名，并较贴近通常重构的读音；不以“上主”消解专名性质。
- issue: וְלֹא יָמֻתוּ 的句法关系
  choice: 免得死亡
  alternative: 他们就不至于死亡；他们不可死亡
  rationale: 形式上该句由连接词引出，但在命令语境中自然表达不洗所面临的死亡后果。“免得”保留警戒和目的／结果之间的张力。
- issue: אִשֶּׁה 的祭祀含义
  choice: 火祭
  alternative: 献作火焚的祭物；食物祭
  rationale: 词源和具体语义存在讨论。“火祭”保留与焚烧献祭的明显联系，不将其神学含义过度解释为神的食物。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“会幕”“祭坛”“火祭”保留必要的礼仪术语；句末逗号反映本节在希伯来文中尚未结束，并由脚注说明跨节延续。
