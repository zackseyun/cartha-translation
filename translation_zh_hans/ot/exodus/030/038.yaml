  source_fidelity: 原文的条件结构、仿制对象、闻香的目的，以及“从其民中被剪除”的未明确法律处罚，均应保留。草稿的整体理解正确；但“照这种配方”略趋向指完全遵照配方，而כָמֹהָ更直接是“与它相仿／像它”，宜避免在正文中收窄为配方完全一致。
  naturalness: “为要闻它香味”缺少结构助词，现代汉语不够自然。改为“为闻其香气”简洁、庄重，并准确表达目的。
  terminology: “被剪除”适宜保留כרת的法律公式及其解释上的开放性。“从其民中”比“从自己的族人中”更贴近原文的“从他的民中”，且在法律文体中自然。
  issues:
