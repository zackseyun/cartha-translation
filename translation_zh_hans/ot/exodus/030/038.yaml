  yaml_path: translation/ot/exodus/030/038.yaml
  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: zh_hans
  text: 凡制作与此相仿的香、为闻其香气的，必从其民中被剪除[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为闻其香气”也可译作“为享受它的香气”。希伯来文表示制作这种香是为了闻其香气或享受其香味。
    reason: lexical_alternative
  - marker: b
    text: “从其民中被剪除”是固定的法律用语；按不同语境，可能指死亡、被逐出共同体，或由上帝施行除灭。
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: 凡……的人
  rationale: אִישׁ在这一法律句式中泛指任何符合条件的人；“凡……的人”既自然，也保留概括性的条件结构。
- source_word: יַעֲשֶׂה
  choice: 制作
  rationale: עשה基本义为“做、制造”；此处承接前文配制香的语境，“制作”比泛泛的“做”更准确。
- source_word: כָמֹהָ
  choice: 照这种配方
  rationale: 该词指向前文规定的圣香；结合上下文译作“照这种配方”，清楚表达仿照该香制作，同时不武断限定必须完全相同。
- source_word: לְהָרִיחַ בָּהּ
  choice: 为要闻它香味
  rationale: 目的不定式说明制作这种香是为个人闻其气味；“闻它香味”自然表达动词与介词后缀的组合，并保留单纯闻香与享受香气之间的语义空间。
- source_word: וְנִכְרַת
  choice: 都要……被剪除
  rationale: נכרת是כרת的Niphal形式，构成严厉的法律处罚公式。“被剪除”保留原文意象和处罚的严重性，而不预先判定具体执行方式。
- source_word: מֵעַמָּיו
  choice: 从自己的族人中
  rationale: עם带第三人称单数后缀，表示此人所属的人民或亲族共同体；“自己的族人”保留归属关系，也符合现代汉语表达。
theological_decisions:
- issue: “从自己的族人中被剪除”这一处罚公式的具体含义
  choice: 在正文保留“被剪除”的正式表达，不确定其具体机制
  alternative: 处死；逐出共同体；由上帝施行除灭
  rationale: 希伯来文公式表明严重的盟约性惩罚，但单凭本节不能确定是死亡、驱逐，还是上帝直接施行的除灭；正文应保留这种法律与神学上的张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“照这种配方制作”承接前文圣香配方；“被剪除”保留原文法律公式及其未明确的处罚方式。两个脚注标记均已置于正文相关位置。
