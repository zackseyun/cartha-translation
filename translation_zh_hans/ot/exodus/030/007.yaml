base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: zh_hans
  text: 亚伦每天早晨要在坛上烧芬芳的香[a]；他整理灯盏的时候[b]，要烧这香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“早晨又早晨”。希伯来文重复“早晨”，强调每天例行进行。
    reason: lexical_alternative
  - marker: b
    text: 或译：“修整灯盏的时候”。这里的希伯来语动词可更具体地指把灯盏料理妥当。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: 要烧
  rationale: קטר 的使役式在祭仪语境中指使祭物焚烧而烟气上腾；“烧”在现代汉语中自然明确，并保留具体礼仪动作。
- source_word: עָלָיו
  choice: 在坛上
  rationale: 代词所指是上文的香坛。汉语若直译为“在它上面”较生硬，因此适度明示为“坛”，不增加原文语境之外的信息。
- source_word: קְטֹרֶת סַמִּים
  choice: 芬芳的香
  rationale: קְטֹרֶת 指礼仪所烧的香，סַמִּים 指其芳香香料成分；“芬芳的香”自然传达由芳香料制成的香。
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: 每天早晨
  rationale: 希伯来文重复“早晨”表达逐日、规律发生；“每天早晨”是现代汉语中清楚自然的对应表达。脚注保留较贴近形式的译法。
- source_word: בְּהֵיטִיבוֹ
  choice: 他整理……的时候
  rationale: יטב 的使役式在此指把灯盏料理妥当，可能包括修剪灯芯、添油和摆整；“整理”保留动作范围，不限缩为单一操作。
- source_word: הַנֵּרֹת
  choice: 灯盏
  rationale: 指圣所灯台上的各盏灯。“灯盏”比泛称“灯”更能体现器具含义，同时符合庄重而易懂的现代汉语。
- source_word: יַקְטִירֶנָּה
  choice: 要烧这香
  rationale: 阴性单数后缀回指 קְטֹרֶת。汉语用“这香”明确回指，避免“烧它”的生硬和可能歧义。
