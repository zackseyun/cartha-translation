revisions:
- from: 你要使这些物件分别为圣，它们就成为至圣。凡触碰它们的，都要成为圣。
  to: 你要使这些物件分别为圣；它们就成为至圣之物。凡触及它们的，必成圣[a]。
  rationale: 修订仅消除“要”可能造成的命令式误读，并使“至圣”的中文谓语表达完整。末句仍不说明接触所致的圣洁究竟是福祉、危险还是礼仪限制；脚注保留原文及英文审校轨迹所承认的词义空间。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:43Z'
review_pass:
  verdict: revise
  source_fidelity: 译文准确呈现了Piel“使……分别为圣”、结果性“成为至圣”，以及接触后“成圣”的简短陈述。末句的“都要成为圣”中“要”在现代汉语中较易读成命令或义务，弱化了希伯来文未完成式在此处所表达的结果/将来陈述；改为“必成圣”更贴切。
  naturalness: 整体庄重清楚。“至圣”可用，但在谓语位置补出“之物”使中文句法更完整；“触及”较“触碰”稍凝练，适合礼仪语境。
  terminology: “分别为圣”“至圣”“成圣”在中文圣经及礼仪语境中相互协调，并可分别体现使役性的Piel与末句较简短的状态变化。为保留末句词义及句法理解的余地，宜在“成圣”处设置脚注。
  issues:
  - severity: medium
    issue: “都要成为圣”带有较强的义务/命令色彩。
    rationale: יִקְדָּשׁ在本句是对触及者或物之结果的陈述，而非明确的命令。译作“必成圣”保留将来/结果意义，不暗示须履行的责任。
  - severity: low
    issue: “它们就成为至圣”作为中文谓语略显省略。
    rationale: “至圣”可作礼仪术语，但补作“至圣之物”能明确其为物件的神圣等级，且不改变原文意思。
  - severity: low
    issue: 草稿未给末句的词义歧义设置译注锚点。
    rationale: 英文审校轨迹对יִקְדָּשׁ保留“成为圣／为圣／被分别为圣”等理解空间；中文可用简短脚注说明，而不在正文中替原文决定神学后果。
  revised_text: 你要使这些物件分别为圣；它们就成为至圣之物。凡触及它们的，必成圣[a]。
  revised_footnotes:
  - marker: a
    text: 或译“必为圣”或“必被分别为圣”。希伯来文也可指因接触而成为圣。
    reason: lexical_alternative
  revision_rationale: 修订仅消除“要”可能造成的命令式误读，并使“至圣”的中文谓语表达完整。末句仍不说明接触所致的圣洁究竟是福祉、危险还是礼仪限制；脚注保留原文及英文审校轨迹所承认的词义空间。
