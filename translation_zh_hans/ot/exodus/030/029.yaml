  text: וְ/קִדַּשְׁתָּ֣ אֹתָ֔/ם וְ/הָי֖וּ קֹ֣דֶשׁ קָֽדָשִׁ֑ים כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִקְדָּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: zh_hans
  text: 你要使这些物件分别为圣；它们就成为至圣之物。凡触及它们的，必成圣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“必为圣”或“必被分别为圣”。希伯来文也可指因接触而成为圣。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: 你要使……分别为圣
  rationale: קדשׁ 的 Piel 形式在礼仪语境中指使某物成圣、将其分别出来归为神圣；“使……分别为圣”既保留使役含义，也适合现代中文。
- source_word: אֹתָם
  choice: 这些物件
  rationale: 该阳性复数宾语代词回指上文的会幕器具及相关物件；明确译出“这些物件”可避免中文代词指向不清。
- source_word: וְהָיוּ
  choice: 它们就成为
  rationale: 承接前面的成圣行动，表达其结果；“就成为”自然体现结果关系，同时不超出原文。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣
  rationale: 这是希伯来语以重复属格表达最高程度的结构，意为最高程度的圣；“至圣”是简洁、庄重且惯用的中文礼仪用语。
- source_word: כָּל הַנֹּגֵעַ
  choice: 凡触碰……的
  rationale: כָּל 加定冠词分词构成泛指，范围本身并未限定为人或物；中文“凡……的”保留这种开放性。
- source_word: בָּהֶם
  choice: 它们
  rationale: 回指刚刚被分别为圣、成为至圣的物件。
- source_word: יִקְדָּשׁ
  choice: 都要成为圣
  rationale: קדשׁ 的 Qal 未完成式可表达进入神圣状态；“成为圣”保留接触所带来的状态变化，而不将其解释为单纯被认可为圣或接受某种正式礼仪。
theological_decisions:
- issue: 接触至圣物件所产生之“圣”的性质
  choice: 直译为“成为圣”，不说明这种状态是有益的、危险的，还是伴随礼仪限制。
  alternative: 译成“也必须分别为圣”，将其理解为接触者须先具备或接受正式的分别为圣。
  rationale: 原文只陈述接触者或接触之物 יִקְדָּשׁ，并未解释这种神圣状态的后果。保留简洁陈述，可避免消解原文的礼仪与神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“分别为圣”用于主动使役动作，“成为圣”用于接触后的状态变化，以反映 Piel 与 Qal 的区别。“物件”明确复数代词所指，同时避免逐一重复上文清单。
