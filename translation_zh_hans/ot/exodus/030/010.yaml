revisions:
- from: 亚伦每年要在坛角上行赎罪礼。他要用赎罪礼所献赎罪祭的血[a]，每年为坛行一次赎罪礼；你们世世代代都要如此。这坛归耶和华为至圣。
  to: 亚伦每年要在坛角上行一次赎罪礼。他要用赎罪祭的血[a]，每年一次为坛行赎罪礼；这要延续到你们世世代代。这坛归耶和华为至圣。
  rationale: 修订仅消除两处不必要的释义：以“这要延续到你们世世代代”保留世代适用的范围而不转作全民命令；以中性的“赎罪祭的血”配合脚注，保留希伯来文“赎罪（复数）”构词及其关系歧义。其余礼仪术语、神名及“至圣”的译法维持原稿。
