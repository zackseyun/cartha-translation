  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: zh_hans
  text: 亚伦每年要在坛角上行一次赎罪礼。他要用赎罪祭的血[a]，每年一次为坛行赎罪礼；这要延续到你们世世代代。这坛归耶和华为至圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “赎罪祭的血”：也可译作“用于赎罪的赎罪祭之血”。希伯来文直译为“赎罪（复数）的赎罪祭之血”；其中各名词之间的具体关系可有不同理解。
    reason: 说明 הַכִּפֻּרִים 的复数形式，并保留原文短语的词汇与关系歧义。
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: 行赎罪礼
  rationale: 在祭司礼仪语境中，כפר指施行赎罪仪式。“行赎罪礼”既保留专门的祭祀含义，也比泛称“遮盖”更准确。
- source_word: קַרְנֹתָיו
  choice: 坛角
  rationale: 阳性单数后缀所指的是上文的香坛；现代汉语以“坛角”清楚表达祭坛的角，避免生硬的“它的角”。
- source_word: אַחַת בַּשָּׁנָה
  choice: 每年……一次 / 每年
  rationale: 准确表达一年一次的礼仪频率；首句按汉语习惯简作“每年”，次句明确为“每年……一次”。
- source_word: מִדַּם
  choice: 用……的血
  rationale: 介词字面为“从”，但在献祭语境中表示施行仪式所用的材料，译作“用……的血”自然且准确。
- source_word: חַטַּאת
  choice: 赎罪祭
  rationale: 此处与血和赎罪礼相连，指祭物而非抽象的罪；“赎罪祭”是清楚且通行的礼仪用语。
- source_word: הַכִּפֻּרִים
  choice: 赎罪礼所献
  rationale: 该词为复数形式，修饰赎罪祭；正文以自然汉语表达其礼仪关系，并用脚注说明原文形式及可能译法。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代都要如此
  rationale: 表达此规定持续适用于以色列后代；“都要如此”承接前述每年施行的仪式。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣
  rationale: 这是希伯来语表示最高程度的圣洁的结构；“至圣”简洁庄重，并避免误解为至圣所这一地点。
- source_word: לַיהוָה
  choice: 归耶和华
  rationale: 介词表示归属、奉献或与耶和华的关系；“归耶和华”在汉语中自然体现这种关系。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式“耶和华”，明确呈现盟约之名，而不以普通称号代替。
- issue: כפר 在祭坛上的作用
  choice: 行赎罪礼
  alternative: 洁净坛 / 为坛除罪
  rationale: 原文使用祭司传统中的 כפר，但本节没有单独说明其作用究竟侧重赦罪、洁净还是除污；译作“行赎罪礼”保留礼仪术语及其神学张力，不把含义限定为某一种解释。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪用语。“坛角”根据近处语境明确所指；分号和“世世代代都要如此”使重复的年度规定在汉语中清楚连贯，同时保留原文两次强调“一年一次”的结构。
