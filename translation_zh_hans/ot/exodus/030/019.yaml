  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: zh_hans
  text: 亚伦和他的儿子们要用盆里的水洗手洗脚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在“洗手洗脚”前直译为“从它”；“它”指上文所说的洗濯盆，意为用盆里的水洗。
    reason: 说明代词所指，并保留原文简略措辞与正文自然表达之间的差异。
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: 要……洗
  rationale: 该形式在指示性语境中表达规定或义务；“要”既保留律例语气，也符合现代汉语表达。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: וּבָנָיו
  choice: 和他的儿子们
  rationale: 此处指亚伦参与祭司职分的男性后代，因此保留明确的男性亲属称谓，不泛化为“孩子们”。
- source_word: מִמֶּנּוּ
  choice: 从盆里取水
  rationale: 字面为“从它”，其先行对象是上文的洗濯盆。汉语若直译“从它洗”不自然，故在正文中补明隐含的“取水”，同时用脚注注明原文的简略表达。
- source_word: אֶת יְדֵיהֶם
  choice: 洗手
  rationale: 直接宾语表示所洗的身体部位；汉语以“洗手”自然表达。
- source_word: וְאֶת רַגְלֵיהֶם
  choice: 洗脚
  rationale: 与“手”并列，是第二个被洗的身体部位；译作“洗脚”简洁自然。
theological_decisions:
- issue: 祭司家系的性别所指
  choice: 和他的儿子们
  alternative: 和他的孩子们
  rationale: 经文语境涉及亚伦及承担祭司职务的男性后代；译为“儿子们”准确保留原文的性别所指。
- issue: מִמֶּנּוּ所指及洗涤方式
  choice: 从盆里取水
  alternative: 从它洗／用其中的水洗
  rationale: 该代词回指上文的洗濯盆，而实际用来洗的是盆中的水。正文采用自然且语义明确的汉语，但以脚注保留原文仅说“从它”的简略性。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“要……洗”保留礼仪规定的指令语气；“洗手洗脚”符合普通读者习惯。正文将希伯来语隐含的水显化为“从盆里取水”，避免生硬的“从盆里洗”，并通过脚注交代字面形式。
