base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: zh_hans
  text: 他们要洗手洗脚，免得死亡。这要作他们永远的定例[a]：为亚伦[b]和他的后裔，直到他们的世世代代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “永远的定例”也可译作“永久的定例”或“恒久的定例”。希伯来语 חָק עוֹלָם 是表示长久有效之法规的固定用语。
    reason: lexical_alternative
  - marker: b
    text: 原文作“他”；按紧接的上下文，是指亚伦。
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: 他们要洗
  rationale: 连词加Qal完成式在律法指令中具有命令或规定的语气；“要洗”符合现代汉语法规性表达。
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: 手洗脚
  rationale: 按原文保留两个并列的身体部位；汉语用“洗手洗脚”自然简洁。
- source_word: וְלֹא יָמֻתוּ
  choice: 免得死亡
  rationale: 此处说明不遵守洁净规定所面临的致命后果；“免得”兼具目的和警告意味，保留原文关系可能具有的张力。
- source_word: וְהָיְתָה לָהֶם
  choice: 这要作他们
  rationale: 补出汉语所需的指示代词“这”，回指前述洗濯规定；“作……的”自然表达归属和规范效力。
- source_word: חָק עוֹלָם
  choice: 永远的定例
  rationale: חָק是规定、定例；עוֹלָם在律法公式中表示持续长久。采用传统而清楚的“永远的定例”，并以脚注保留“永久的定例”等理解。
- source_word: לּוֹ
  choice: 亚伦
  rationale: 原文为单数代词“他”，在紧接的上下文中指亚伦。正文明确所指以免汉语出现指代不清，同时脚注说明原文形式。
- source_word: וּלְזַרְעוֹ
  choice: 和他的后代
  rationale: זֶרַע在此指亚伦的后裔群体；“后代”是自然、庄重且不带生物学歧义的现代汉语。
- source_word: לְדֹרֹתָם
  choice: 世世代代当守的
  rationale: 表达该定例在连续各代中的约束力；“当守的”依律法语境补明其规范意义，而非把它仅译成时间状语。
theological_decisions:
- issue: חָק עוֹלָם所表达的礼仪法规期限
  choice: 永远的定例
  alternative: 永久的定例；恒久的定例
  rationale: 该固定法律用语强调持续有效的制度性义务。正文不把它解释为抽象哲学意义上的绝对无尽，也不预先限定其后续神学适用范围；脚注列出可行译法。
- issue: 单数代词לּוֹ的所指
  choice: 正文译明为“亚伦”
  alternative: 保留为“他”
  rationale: 上文最近且合乎语法的单数男性先行词是亚伦。译明所指提高汉语可读性，脚注同时保留原文使用代词这一事实。
translation_notes:
  register: 采用现代、庄重且易懂的律法叙述语体。“免得死亡”保留警告力度；“世世代代当守的”使句末在汉语中连贯自然。所有脚注标记均已置入正文。
