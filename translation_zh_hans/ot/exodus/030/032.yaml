source:
  edition: WLC
  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: zh_hans
  text: 不可把这油倒在人的肉身上[a]，也不可照它的配方调制同样的油。它是圣的，你们要以它为圣。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“人的肉身”；“人”在希伯来文中泛指人类。
    reason: 说明 בְּשַׂר אָדָם 的字面表达及 אָדָם 的泛指意义。
lexical_decisions:
- source_word: יִיסָךְ
  choice: 倒在
  rationale: 该动词在这里指把特制的膏油施于人身；“倒在”贴近被动形式所表达的具体动作，又不把它直接解释成较宽泛的礼仪结果“膏抹”。
- source_word: עַל בְּשַׂר אָדָם
  choice: 在人的身体上
  rationale: בָּשָׂר 字面为“肉身”，אָדָם 在此泛指人类。现代汉语用“人的身体”自然清楚，同时保留不得施用于普通人体的意思；字面形式见脚注。
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: 照它的配方
  rationale: מַתְכֹּנֶת 表示按规定比例构成的配制方法；“配方”在现代汉语中准确而自然。
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: 不可……调制同样的油
  rationale: 表达不得仿照该圣膏油的配方制造相同之物；补出“油”符合汉语指代习惯，所指由上下文明确。
- source_word: קֹדֶשׁ הוּא
  choice: 它是圣的
  rationale: 保留 קֹדֶשׁ 的核心圣洁用语及其宗教含义。
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: 你们要以它为圣
  rationale: 既保留该油相对于以色列人必须被视为圣物的关系含义，也比生硬的“它对你们将是圣的”更合乎现代汉语。
theological_decisions:
- issue: אָדָם 在泛指人类语境中的译法
  choice: 人
  alternative: 亚当；男人
  rationale: 这里的 אָדָם 泛指人，并非专名“亚当”，也不专指男性；译作“人”保存其普遍适用范围，不引入性别限制。
- issue: קֹדֶשׁ יִהְיֶה לָכֶם 的规范性语气
  choice: 你们要以它为圣
  alternative: 它对你们将是圣的
  rationale: 未完成式在禁令与圣物条例的语境中带有规范要求；此译法表达以色列人必须将其视为分别为圣之物，而不额外界定其礼仪机制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不可……也不可……”保持律法条文的语气；“配方、调制”清楚表达按比例复制膏油的禁令；末句保留“圣”的重复，以反映希伯来原文的强调。
