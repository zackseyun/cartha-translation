revisions:
- from: 你要取一些，把它磨得极细；再取一些，放在会幕里的见证之物前，就是我要在那里与你相会的地方。这香对你们来说是至圣的。[a]
  to: 你要把其中一些磨得极细，再把其中一些放在会幕中、见证前面；我将在那里与你相会。这香对你们要成为至圣的。[a]
  rationale: 修订删除“见证之物”中原文没有的“物”，以“见证”保留希伯来文礼仪术语的指称开放性；同时将“我将在那里与你相会”独立成句，清楚对应 אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה。两次“其中一些”保留原文两次部分性表达，“至圣的”及其脚注维持原有的最高级表达与审校轨迹。
