  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: zh_hans
  text: 你要把其中一些磨得极细，再把其中一些放在会幕中、见证前面；我将在那里与你相会。这香对你们要成为至圣的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“圣中之圣”。
    reason: 保留 קֹדֶשׁ קָדָשִׁים 的字面叠加结构及其最高级语气。
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  choice: 把它磨
  rationale: שׁחק在这里指把香料混合物研磨成粉；“磨”符合现代汉语表达，也比“打碎”更贴合制香语境。
- source_word: מִמֶּנָּה
  choice: 取一些
  rationale: 介词与代词在此表示从整体中取出一部分；译作“取一些”自然传达部分意义。
- source_word: הָדֵק
  choice: 极细
  rationale: 此形式加强研磨动作，表示磨成非常细的粉末；“磨得极细”简洁地表达其结果。
- source_word: וְנָתַתָּה
  choice: 放
  rationale: נתן含义宽泛，在礼仪摆放的语境中译作“放”清楚自然。
- source_word: לִפְנֵי הָעֵדֻת
  choice: 在见证之物前
  rationale: 原文只说“见证”，没有明确增补“约柜”或“法版”；“见证之物”保留该礼仪术语及其指称上的含蓄，同时比孤立的“见证前”更符合现代汉语。
- source_word: בְּאֹהֶל מוֹעֵד
  choice: 在会幕里
  rationale: “会幕”是 אֹהֶל מוֹעֵד 简洁而通行的汉语礼仪用语，并保留作为相会场所的含义。
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: 就是我要在那里与你相会的地方
  rationale: יעד的尼法勒词干在此表示约定的会面；该译法清楚传达上帝与摩西相会之意。
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: 至圣的
  rationale: 该希伯来语叠加结构表达最高程度的圣洁；“至圣”在现代中文中庄重、简洁，并适合描述此香。
- source_word: תִּהְיֶה לָכֶם
  choice: 对你们来说是
  rationale: 保留 לָכֶם 所表达的关系，说明这香在以色列人面前所具有的神圣地位，而不额外解释为所有权。
theological_decisions:
- issue: “见证”的具体所指
  choice: 正文译作“见证之物”，不直接替换为“约柜”或“法版”。
  alternative: “约柜前”或“法版前”
  rationale: 希伯来文只明说“见证”，其具体指称与约柜及约版有关，但本节没有进一步限定；保留较宽的表达可避免替原文作出单一解释。
- issue: 圣洁最高级的表达
  choice: 正文采用“至圣的”。
  alternative: “圣中之圣”
  rationale: “至圣”自然表达最高程度的圣洁；脚注保留较贴近希伯来语结构的译法，使读者看见原文的强调方式。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语体。“取一些……再取一些”呈现原文两次部分性表达；分号划分研磨与安放两个连续命令。
