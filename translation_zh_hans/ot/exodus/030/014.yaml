base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: zh_hans
  text: 凡年满二十岁及以上、归入被数点之人的，都要向雅威献上奉献。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在被数点的人中经过。”希伯来语按字面说人在与被数点者有关的情形中“经过”，可能指人口登记时的程序。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעֹבֵר
  choice: 凡是……的
  rationale: כֹּל支配后面的分词短语，具有逐一涵盖的意思；译成“凡是……的”符合现代汉语法规语体。
- source_word: הָעֹבֵר עַל הַפְּקֻדִים
  choice: 归入被数点之人
  rationale: עבר与עַל הַפְּקֻדִים在这里构成与人口登记程序有关的习语，字面含“经过”被数点者之意。“归入”传达进入受数点群体的程序性含义，脚注保留较直译的意象和另一种理解。
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: 年满二十岁
  rationale: 这是年龄下限公式；“年满二十岁”在现代汉语中自然、明确，也包含“二十岁及以上”的意义。
- source_word: יִתֵּן
  choice: 都要献上
  rationale: 未完成式在法律指令中带义务语气，“要”准确表达规定；加入“都”承接כֹּל的周遍意义。
- source_word: תְּרוּמַת
  choice: 奉献
  rationale: תְּרוּמָה指分别出来献给神的供物或款项。本处是人口登记相关的缴纳，“奉献”既保留宗教归属，也不局限于某种特定礼仪动作。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译直接呈现四字神名，不用称号替代专名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其专名性质。
- issue: 人口登记习语的明确程度
  choice: 归入被数点之人
  alternative: 从被数点的人中经过
  rationale: 正文以自然汉语说明登记归类的意义，但不直接简化成“被数点”，以免完全抹去עבר所含的经过或跨入意象；相关歧义在脚注中保留。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“凡是……的，都要……”保持律法条文的概括性和义务语气；避免生硬照搬希伯来语序，同时用脚注保存人口登记习语的具体意象。
