  text: and cassia[a], five hundred shekels by the sanctuary shekel, and a hin of olive oil.
translation:
  language: zh_hans
  text: 桂皮五百舍客勒，按圣所的舍客勒计算；橄榄油一欣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “欣”是古代的液量单位；许多人估计一欣约为3.5至4升。
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: 桂皮
  rationale: 该词指用于调制香料的芳香树皮，通常认定为桂皮；此译法简洁自然，也符合配料清单的语境。
- source_word: חֲמֵשׁ מֵאוֹת
  choice: 五百
  rationale: 直接表达原文的基数，修饰桂皮的重量。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所的舍客勒计算
  rationale: 介词短语说明称量所依据的标准；这样翻译既保留圣所标准的含义，也符合现代汉语表达。
- source_word: שֶׁמֶן זַיִת
  choice: 橄榄油
  rationale: 该属格结构惯常指橄榄油，采用现代汉语的自然名称。
- source_word: הִין
  choice: 一欣
  rationale: “欣”是古代液量单位；保留专名可避免把不确定的现代换算值写入正文。
- source_word: וְ
  choice: ；
  rationale: 原文的连接词承接前文并连接配料项目；中文借助经文连续语境和分号自然体现其并列关系，避免生硬重复“和”。
