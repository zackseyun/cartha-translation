id: EXO.30.15
reference: Exodus 30:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: zh_hans
  text: 富有的人不可多于半舍客勒，贫穷的人也不可少于半舍客勒；你们要献上归给耶和华的献款，为你们的性命赎罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “性命”也可译作“本人”或“生命”。希伯来语 נֶפֶשׁ 可指灵魂、自己、个人或生命；在这里的人口登记缴款语境中，很可能指被数点之人的生命或本人。“赎罪”在本段也带有以赎价保全性命的意味。
    reason: 说明 נֶפֶשׁ 的语义范围，并保留 כפר 在本段赎罪与赎价语境中的张力。
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: 富有的人
  rationale: 定冠词加形容词在此作名词，代表富有者这一类人；“富有的人”与下文“贫穷的人”自然对应。
- source_word: יַרְבֶּה / יַמְעִיט
  choice: 不可多出 / 不可少出
  rationale: 两词构成平衡的法律措辞，指所出金额不得高于或低于规定的半舍客勒；“多出／少出”简洁保留原文对称。
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: 都要按半舍客勒
  rationale: 介词 מִן 在否定比较结构中界定标准金额；汉语用“按”清楚表达富者与贫者都须依固定数额缴纳。
- source_word: תְּרוּמַת יְהוָה
  choice: 给耶和华的献款
  rationale: תְּרוּמָה 指分别出来献上的款项；在登记人口的缴款语境中，“献款”比祭牲意味较强的“祭物”更贴切。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，而不以普通称号取代专名。
- source_word: לְכַפֵּר
  choice: 赎罪
  rationale: כפר 在此为礼仪性用语；“赎罪”是简明而庄重的常用译法，同时不限定具体的赎罪理论。
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: 为你们的性命
  rationale: נֶפֶשׁ 在人口登记与赎价语境中主要指人的生命或本人，并非特指与身体相分离的灵魂；“性命”保留生命受到保全的具体意味。
- source_word: לָתֵת
  choice: 献上
  rationale: 不定式描述交付献款的行动；汉语“献上”自然连接奉献对象和神圣用途。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 使用中文圣经传统中广为人知的专名形式，保留原文是神名而非普通称号这一点。
- issue: נֶפֶשׁ 在赎罪语境中的含义
  choice: 性命
  alternative: 灵魂；本人
  rationale: 本段涉及人口登记及每个人所交的赎价，所指更可能是被数点之人的生命或整个人；避免把后期身心二分观念带入经文。
- issue: כפר 的表达
  choice: 赎罪
  alternative: 遮盖；赎回；施行赎罪
  rationale: 保留礼仪术语的神学广度，不把动词限定为某一种赎罪机制；脚注同时说明此处与生命赎价相关。
- issue: 固定金额的神学与社会含义
  choice: 富者与贫者所献数额相同
  alternative: 富者可多献、贫者可少献
  rationale: 原文明确以“不可多／不可少”规定同一半舍客勒金额；译文不进一步推演其神学意义，只忠实呈现法律要求。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“不可多出／不可少出”保留希伯来文的平行法律句式；“献款”切合人口登记缴款的上下文，又保留款项分别归给神的宗教性质。
