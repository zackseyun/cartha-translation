  yaml_path: translation/ot/exodus/030/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 雅威[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），是上帝的神名；其原有读音不能完全确定。这里译作“雅威”；中文传统常译作“耶和华”，也有译本以“主”表示。
    reason: 说明神名的原文形式、读音不确定性及主要中文译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 对……说
  rationale: 该形式推进叙事，并引出上帝的发言。现代汉语用“对……说”自然、庄重，也准确表达向特定对象讲话。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是上帝的四字神名 YHWH，不是“主”这一称号。“雅威”按通行的学术重构音译，保留其作为专名的性质；读音上的不确定性在脚注中说明。
- source_word: אֶל מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标明说话的对象；“摩西”是 מֹשֶׁה 的现代汉语标准译名。
- source_word: לֵּאמֹר
  choice: 说：
  rationale: 该不定式是引出下文直接引语的惯用公式。汉语以“说：”自然衔接下一节，不机械重复原文中两个言说词。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”以保留专名，而不以称号“主”替代；“耶和华”是中文传统译法，列入脚注，以兼顾传统及原名读音不能完全确定这一事实。
translation_notes:
  register: 采用自然、简洁而庄重的现代标准汉语。“对摩西说”避免“晓谕”等较古旧表达；句末冒号表明发言内容见下文。
