  yaml_path: translation/ot/exodus/030/022.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 耶和华[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文为“YHWH”（יהוה），是上帝的名；传统上常译作“主”，有些译本作“上主”。
    reason: 说明神名的原文形式及传统替代译法。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该动词连同叙事性前缀引出新的神谕段落。现代汉语中“说”自然、庄重，也符合反复出现的神圣发言公式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，同时用脚注说明其希伯来文形式及传统译法。
- source_word: אֶל־מֹשֶׁה
  choice: 对摩西
  rationale: 介词 אֶל 标示说话所指向的对象；“对摩西”是自然准确的现代汉语表达。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下文的直接话语。中文以“说：”配合冒号即可清楚表达其篇章功能，无须机械重复“说道”。
- source_word: וַ
  choice: 不单独译出
  rationale: 此处前缀主要推进希伯来叙事。在中文段落开头不必机械译作“然后”或“又”；省略可使行文自然而不损失事件次序。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用以色列上帝的专名。正文采用中文传统且广为人知的音译“耶和华”，不以纯头衔替代；脚注保留 YHWH 的原文信息，并提示传统替代译法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。以冒号承接下一节的发言内容；不机械翻译叙事连接词，也不重复表达 לֵאמֹר。
