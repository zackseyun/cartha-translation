revisions:
- from: 你登记以色列子孙、清点人数时[a]，每个男子在被登记时，都要把自己性命的赎价[b]献给雅威，免得他们在被登记时遭遇灾疫。
  to: 你统计以色列子孙的人数时[a]，他们各人被统计时，要为自己的性命向雅威交赎价[b]，免得他们被统计时遭遇灾殃。
  rationale: 修订消除了开头重复而不自然的行政动作表述，保留原文人口统计用语在全句中的三次重复，并使“各人”“赎价”“性命”与“雅威”的关系更符合现代标准汉语。将“灾疫”改为“灾殃”是为保留原文灾击/灾祸的语义范围，不预设其必为特定传染病。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:56Z'
