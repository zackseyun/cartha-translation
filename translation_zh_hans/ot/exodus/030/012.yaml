  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: zh_hans
  text: 你统计以色列子孙的人数时[a]，他们各人被统计时，要为自己的性命向雅威交赎价[b]，免得他们被统计时遭遇灾殃。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “统计以色列子孙的人数”原文直译为“抬起以色列子孙的头”，是进行人口统计的习语。
    reason: lexical_alternative
  - marker: b
    text: “为自己的性命……交赎价”也可译作“为自己交赎价”；这里的“性命”也可指“本人”，并非只指“灵魂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ……时
  rationale: 这里引出预期发生的人口登记情境；译作时间性的“……时”比开放性的“如果”更符合本段法律指示。
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: 清点人数
  rationale: 该短语直译为“抬起……的头”，在行政语境中是统计人口的习语；正文译出实际含义，直译保留在脚注。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 保留希伯来语的家族性称呼，同时采用现代中文中自然且庄重的传统表达。
- source_word: לִפְקֻדֵיהֶם / בִּפְקֹד אֹתָם
  choice: 登记／被登记
  rationale: פקד在本节指人口登记、编入名册；重复使用“登记”呼应原文三次出现的同一词根。
- source_word: וְנָתְנוּ אִישׁ
  choice: 每个男子……都要
  rationale: אִישׁ具有逐一分配的作用，且原文使用阳性单数，因此译作“每个男子”，不将其泛化为“每个人”。
- source_word: כֹּפֶר
  choice: 赎价
  rationale: 此词指为保全性命、避免灾祸而交付的补偿性款项；“赎价”简洁地保留其赎回含义。
- source_word: נַפְשׁוֹ
  choice: 自己性命的
  rationale: נפש在此指人的生命或本人，并非专指与身体分离的“灵魂”；“性命”最切合赎价与灾疫的语境。
- source_word: לַיהוָה
  choice: 献给雅威
  rationale: 介词表达交付对象；配合“赎价”，中文用“献给”自然。יהוה按其专名译作“雅威”。
- source_word: נֶגֶף
  choice: 灾疫
  rationale: 该词可指击打、灾祸，尤其指作为审判的致命疫病；“灾疫”既保留灾罚意味，也符合本节语境。
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: 免得他们……遭遇灾疫
  rationale: 该句说明交付赎价所要避免的后果；“免得”自然表达原文在上下文中的目的或结果关系。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其作为专名的性质，而不以称号替代。
- issue: נַפְשׁוֹ 在赎价公式中的含义
  choice: 自己性命的
  alternative: 为自己的灵魂／为自己
  rationale: 本节关注人口登记时为保全生命而交付赎价；译作“性命”避免把后期关于灵魂的观念带入原文，同时保留“生命”与“本人”之间的语义张力。
- issue: בְּנֵי יִשְׂרָאֵל 与 אִישׁ 的性别表达
  choice: 以色列子孙……每个男子
  alternative: 以色列人……每个人
  rationale: “以色列子孙”保留群体的家族称谓，“每个男子”反映 אִישׁ 的阳性单数和逐一分配作用，不将原文性别表达中性化。
- issue: 赎价与灾疫之间的关系
  choice: 免得……遭遇灾疫
  alternative: 这样他们中间就不会有灾疫
  rationale: 上下文表明赎价具有避免灾疫的作用；“免得”表达这一目的或结果，但不进一步界定其赎罪机制。
translation_notes:
  register: 采用现代、庄重而易懂的法律指示语体。用“登记”贯穿同一希伯来词根的重复，用“清点人数”说明首次出现时的具体行政行为；避免过度古雅的“数点”和过于技术化的现代户籍术语。
