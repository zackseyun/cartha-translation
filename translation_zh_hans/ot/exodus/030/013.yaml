base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: zh_hans
  text: 凡登记在册的，都要交纳这个：按圣所的舍客勒计算，半舍客勒（一舍客勒为二十季拉）；半舍客勒，作为献给雅威的奉献。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “登记在册的”直译为“经过／进入被登记者的”；这是人口普查语境中的惯用说法，指被列入正式登记的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: 都要交纳以下数目
  rationale: זֶה引出所规定的款项，未完成式יִתְּנוּ在律法语境中表达义务；“要交纳以下数目”既自然，也保留指令语气。
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: 凡列入登记人数的
  rationale: 该短语字面涉及“经过/进入被点数者”，在本段人口统计语境中是指进入正式登记的人；译文传达其惯用意义，避免生硬直译。
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: 半舍客勒
  rationale: 采用现代中文圣经语境中清楚而常见的重量兼货币单位音译。
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: 按圣所舍客勒的标准
  rationale: 介词בְּ在此表示计量标准；“圣所舍客勒”作为技术用语，比“神圣的舍客勒”更能表明圣所采用的标准单位。
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: 一舍客勒是二十季拉
  rationale: 将希伯来文的单位说明译为简明的解释性插语。
- source_word: תְּרוּמָה לַיהוָה
  choice: 献给雅威的奉献
  rationale: תְּרוּמָה在此指分别出来献给上帝的款项；“奉献”兼顾礼仪含义和现代可懂度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较贴近学界通常重构的读音，并明确保留原文中的专名；“耶和华”是传统汉译，但源于较晚的混合读法。
- issue: תְּרוּמָה的礼仪色彩
  choice: 奉献
  alternative: 捐项
  rationale: “奉献”保留献给上帝、分别为圣的意味；“捐项”虽突出款项性质，却会削弱原词的礼仪内涵。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。以“列入登记人数”表达人口统计惯用语；保留“舍客勒”“季拉”等古代计量单位，并用括号保存原文的解释性结构。
