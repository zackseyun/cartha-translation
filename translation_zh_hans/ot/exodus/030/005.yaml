translation:
  language: zh_hans
  text: 要用金合欢木做杠子，并把它们包上金。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “金合欢木”所指的精确树种仍不确定；希伯来文此词通常理解为适合当地干旱环境的金合欢类树木。
    reason: 保留 שִׁטָּה 的植物学辨识不确定性，并避免“皂荚木”与通常的金合欢类理解之间的名称混淆。
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: 要……做
  rationale: 此处为一连串礼仪器具制作指示中的连接式完成时，具有命令和规定的语力；“要……做”符合现代汉语指令体。
- source_word: הַבַּדִּים
  choice: 抬杠
  rationale: בַּד 在会幕器具语境中指穿入环内、用来抬运圣物的杠；“抬杠”比单说“杠”更清楚地表达用途。
- source_word: עֲצֵי שִׁטִּים
  choice: 皂荚木
  rationale: 该构造短语指 שִׁטָּה 树的木材；“皂荚木”是中文圣经传统中通行且易识别的名称，但树种的精确对应并不完全确定，故加注说明。
- source_word: וְצִפִּיתָ
  choice: 并……包裹
  rationale: צפה 在工艺语境中指以某种材料覆盖或贴覆器物；“包裹”自然清楚，也避免暗示现代电镀工艺。
- source_word: אֹתָם
  choice: （承前省略）
  rationale: 阳性复数宾语代词回指“抬杠”；现代汉语在并列分句中自然省略重复宾语，指代仍然明确。
- source_word: זָהָב
  choice: 用金
  rationale: 希伯来文以“金”表示覆盖所用的材料；汉语用介词“用”明确表达材料关系。
