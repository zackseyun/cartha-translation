  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: zh_hans
  text: 雅威对摩西说：“你要取来香料：香脂和香螺甲[a]、古蓬香，以及纯乳香；各种香料的分量要相等。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “香脂”和“香螺甲”所指的确切物质不能确定；希伯来语很可能指两种特定的制香原料，这里采用传统理解的名称。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用希伯来神名的常见现代汉语音译，保留其作为专名的性质，不以称号代替。
- source_word: וַיֹּאמֶר
  choice: 对……说
  rationale: 希伯来语叙事连续形式推进叙事；现代汉语无需机械译出句首连接词，也能自然表达顺承。
- source_word: קַח לְךָ
  choice: 你要为自己取
  rationale: 既表达命令语气，也保留介词短语 לְךָ 所带的为自己取用之意。
- source_word: סַמִּים
  choice: 香料
  rationale: 这是对制香所用芳香物质的宽泛称呼；“香料”简明自然，并保留原文两次出现该词的痕迹。
- source_word: נָטָף
  choice: 香脂
  rationale: 该词所指具体香料无法确定；“香脂”表达滴流或树脂类芳香物质的传统理解，同时以脚注注明不确定性。
- source_word: שְׁחֵלֶת
  choice: 香螺甲
  rationale: 传统上理解为取自某种螺贝厣甲的芳香材料，但确切所指不明；此译名兼顾传统辨识度和物质类别。
- source_word: חֶלְבְּנָה
  choice: 古蓬香
  rationale: 通常认定为 galbanum，即一种芳香树脂；“古蓬香”是现代汉语可用的专名。
- source_word: לְבֹנָה זַכָּה
  choice: 纯乳香
  rationale: לְבֹנָה 指乳香，זַכָּה 表示纯净；“纯乳香”准确且自然。
- source_word: בַּד בְּבַד יִהְיֶה
  choice: 各样都要等量
  rationale: 该习语表达各项按相等分量配取；汉语以“各样都要等量”清楚传达比例要求。
