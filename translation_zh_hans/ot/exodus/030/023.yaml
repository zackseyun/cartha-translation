base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: zh_hans
  text: 你要取上等香料：天然流出的没药[a]五百舍客勒，芬芳的肉桂二百五十舍客勒（即前者的一半），芬芳的香苇[b]二百五十舍客勒；
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“纯净的没药”。希伯来语很可能指没药树天然自行流出的树脂。
    reason: lexical_alternative
  - marker: b
    text: 传统译作“香菖蒲”。原文直译为“芬芳的苇”或“香苇”；这里所指的具体植物不能完全确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: 上等香料
  rationale: בְּשָׂמִים指芳香物或香料，רֹאשׁ在此表示首要、上好的品质；“上等香料”自然地传达这一习语含义。
- source_word: מָר דְּרוֹר
  choice: 自流的没药
  rationale: מָר是没药；דְּרוֹר本有自由、流出的意味，此处很可能指天然自行流出的没药汁。“自流的没药”保留了原文形象，也避免直接采用较具解释性的“纯净没药”。
- source_word: חֲמֵשׁ מֵאוֹת
  choice: 五百舍客勒
  rationale: 原文此处只列数字，但本配方的计量单位由近邻语境、尤其第24节明确为舍客勒；补出单位可避免把数字误解为件数。
- source_word: קִנְּמָן בֶּשֶׂם
  choice: 芬芳的肉桂
  rationale: קִנְּמָן是肉桂，בֶּשֶׂם强调其芳香；“芬芳的肉桂”比传统的“香肉桂”更符合现代汉语，也不暗示味道甘甜。
- source_word: מַחֲצִיתוֹ
  choice: 取一半
  rationale: 后缀回指前述五百的数量；“取一半，就是二百五十”保留原文先说比例、再明确数目的表达。
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: 二百五十舍客勒
  rationale: 准确表达原文数值，并依上下文补明计量单位。
- source_word: קְנֵה בֹשֶׂם
  choice: 芬芳的香菖蒲
  rationale: קָנֶה泛指茎秆状的芦苇或香草，בֹשֶׂם表示芳香；“香菖蒲”沿用读者较熟悉的传统植物名称，但以脚注保留较宽泛的“香苇”可能性。
