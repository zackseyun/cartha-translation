  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: zh_hans
  text: 你要对以色列人说：‘这在你们世世代代要作归我的圣膏油。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的儿子们”，在现代汉语中按民族共同体自然译为“以色列人”。
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: 圣膏油
  rationale: 这是会幕礼仪语境中的专用油，兼顾“油”“膏抹”与“圣”的含义；“圣膏油”简洁而庄重。
- source_word: יִהְיֶה זֶה לִי
  choice: 这要……作归我的
  rationale: 保留 לִי 的归属与专用于上帝之意，不弱化为泛指的“为我使用”。
- source_word: לְדֹרֹתֵיכֶם
  choice: 世世代代
  rationale: 自然表达“贯穿你们各代”的持续效力。
theological_decisions:
- issue: 圣膏油与上帝的关系
  choice: 归我的
  alternative: 为我的／对我而言
  rationale: 原文 לִי 简短而有一定语义张力；“归我的”在汉语中较自然地保留其归属、奉献和专属意味，且不额外界定具体神学机制。
translation_notes:
  register: 采用现代、庄重、易懂的规范汉语；以直接引语呈现命令内容，不添加原文没有的解释。
