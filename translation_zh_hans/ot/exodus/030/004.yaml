base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: zh_hans
  text: 要在香坛的饰边下做两个金环[a]；要把它们安在香坛两侧的侧板上[b]。这些环要供抬杠穿过[c]，以便用杠抬运香坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饰边”也可译作“边框”或“边缘”；希伯来语 זֵר 指环绕香坛的装饰性边饰。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译近似“在它的两个侧部……在它的两边”，以略显重复的说法强调金环安在两边。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“作杠的房屋”，意思是供抬杠穿入、容纳或承托的部位。
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: 金环
  rationale: 指金制的环；“金环”简洁自然，也准确保留材质和器件类别。
- source_word: מִתַּחַת לְזֵרוֹ
  choice: 饰边下面
  rationale: זֵר指前文所述环绕香坛的装饰性边缘；“饰边”比泛称“边”更能体现其制作特征，同时不把具体形状限定为现代意义的线脚。
- source_word: צַלְעֹתָיו
  choice: 侧板
  rationale: צֵלָע可指肋、侧面或结构性的侧部；在器物制作语境中，“侧板”自然且具体。
- source_word: עַל שְׁנֵי צִדָּיו
  choice: 两边
  rationale: 保留双侧安置之意；与前面的“侧板”形成原文略显重复的定位说明，但用自然汉语整合表达。
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: 这些环要作穿杠的环座
  rationale: בָּתִּים直译为“房屋”，此处是容纳、承托杠的构件。“环座”既说明金环的功能，又符合现代器物描述。
- source_word: בַדִּים
  choice: 杠
  rationale: 在会幕器具搬运语境中指抬运用的长杠；“杠”比“杆”更明确传达抬运功能。
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: 好用杠抬香坛
  rationale: 表达不定式的目的意义及בָּהֵמָּה的工具意义；以“香坛”明确代词所指，使中文清楚自然。
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: 要……做……；要把……做……
  rationale: 保留原文连续指令及动词重复，同时符合现代汉语规范说明语体。
theological_decisions: []
