base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/030.yaml
  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: zh_hans
  text: 你要膏亚伦和他的儿子们，使他们分别为圣，作祭司事奉我。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: 你要膏
  rationale: משׁח指以膏油施行设立圣职的仪式。“膏”简洁保留了礼仪和神学含义；此处未完成式在指令语境中译为“要”。
- source_word: וְקִדַּשְׁתָּ
  choice: 使他们分别为圣
  rationale: קדשׁ的Piel形态表示使之成圣、分别出来归于神。在祭司承职语境中，“使……分别为圣”既贴近原文，也比单用“圣化”更自然清楚。
- source_word: לְכַהֵן
  choice: 作祭司事奉
  rationale: כהן的动词形式表示履行祭司职分。“作祭司事奉”同时表达其身份与职务活动，避免只译成静态身份。
- source_word: לִי
  choice: 我
  rationale: 介词ל加第一人称后缀表明祭司事奉所朝向的对象。汉语“事奉我”自然直接地体现这一关系，无须机械译出介词。
- source_word: בָּנָיו
  choice: 他的儿子们
  rationale: 原文明确使用阳性复数“儿子们”，且语境所指为亚伦的男性祭司后裔，不宜中性化。
- source_word: וְאֶת ... וְאֶת
  choice: 亚伦和他的儿子们
  rationale: 重复的直接宾语标记分别引出两个并列宾语；现代汉语用“和”自然连接即可。
theological_decisions:
- issue: קדשׁ与כהן的祭司承职语境
  choice: 译作“使他们分别为圣，作祭司事奉我”
  alternative: “将他们分别出来，给我供祭司的职分”或“使他们成圣，担任祭司”
  rationale: 所述是亚伦及其儿子被设立进入神圣祭司职分。选译保留“分别为圣”的礼仪神学含义，并以“作祭司事奉”准确表达כהן的动态职务意义，不引入后世教会职制概念。
- issue: בָּנָיו的性别表达
  choice: “他的儿子们”
  alternative: “他的子女”或“他的后代”
  rationale: 希伯来文明确指“儿子们”，本段祭司承职语境也确指男性，因此保留原文的性别限定。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪语体。“你要”表达指令；“膏”承接上下文的圣膏油；“分别为圣”保留核心祭司术语；全节不需脚注。
