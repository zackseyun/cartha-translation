- from: 亚伦在黄昏[a]点上灯的时候，要焚烧这香，作为在雅威面前常献的香[b]，你们世世代代都要如此。
  to: 亚伦在黄昏[a]整理灯盏的时候，要在雅威面前焚烧这香；这是你们世世代代当常献的香[b]。
  rationale: 修订移除了不自然且可能改变关系的“作为”结构，明确“常献的香”是世世代代在雅威面前献上的礼仪香。将“点上灯”调整为“整理灯盏”，以保留原文在灯具礼仪操作上可能包含安置、整备或使灯火升起的较宽含义，避免过度限定为点燃动作。
