base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: zh_hans
  text: 亚伦在黄昏[a]整理灯盏的时候，要在雅威面前焚烧这香；这是你们世世代代当常献的香[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“在两个傍晚之间”，是指黄昏或傍晚时段的惯用语。
    reason: lexical_alternative
  - marker: b
    text: 或译“持续不断的香”。这里的希伯来词既可强调按规定经常献上，也可强调持续或长久。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: 在……点上……的时候
  rationale: 介词 בְּ 加不定式构成时间从句。עלה 的使役式与灯连用，指使灯火升起，即点灯；译作“点上”符合现代汉语，也保留使灯开始燃烧的礼仪动作。
- source_word: הַנֵּרֹת
  choice: 灯
  rationale: נֵרֹת 是会幕器具语境中通常表示油灯的词；汉语集合性名词“灯”自然清楚。
- source_word: בֵּין הָעַרְבַּיִם
  choice: 在黄昏
  rationale: 该固定表达字面为“在两个傍晚之间”，所指是傍晚或暮光时段；正文采用自然的现代汉语，字面形式在脚注说明。
- source_word: יַקְטִירֶנָּה
  choice: 要焚烧这香
  rationale: קטר 的使役式在献祭和香的语境中指焚烧、使之冒烟献上；阴性单数后缀指向 קְטֹרֶת。译出“这香”比汉语代词更清楚。
- source_word: קְטֹרֶת
  choice: 香
  rationale: 此词指礼仪中焚烧的香；献上的含义已由动词及“作为……常献的香”表达。
- source_word: תָּמִיד
  choice: 常献的
  rationale: 在礼仪规定中可表示持续性，也可表示按规定反复、恒常进行。因本仪式是在早晨和黄昏举行，“常献”既自然，也避免误解为每一刻不间断燃烧。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי 表示在上帝临在之处；יהוה 作为专名音译为“雅威”，不以称号替代。
- source_word: לְדֹרֹתֵיכֶם
  choice: 你们世世代代都要如此
  rationale: 该表达说明这项礼仪规定延续于以色列后来的各代；“世世代代”是自然、庄重的现代汉语表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名 יהוה。正文采用学界通行、较贴近其可能读音的“雅威”，以保留专名性质；“耶和华”是后期混合读法，“上主”则以称号替代专名。
- issue: תָּמִיד 所表达的持续性
  choice: 常献的香
  alternative: 不断的香；永远的香
  rationale: 这里的香按上下文在早晨和黄昏焚烧，重点可在规律而持续的礼仪实践，不必解释为每一刻都不间断；脚注保留“持续不断”的可能语感。
translation_notes:
  register: 采用现代、庄重而易懂的礼仪叙述。“焚烧这香”准确表达使香冒烟献上的动作；“常献”配合早晚礼仪的上下文，避免让读者误以为动作每时每刻都不间断。标点保持顺畅，不额外拆分原句的逻辑。
