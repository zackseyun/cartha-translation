base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: zh_hans
  text: 他说[a]：“有一只手在雅的宝座上；耶和华必与亚玛力世世代代争战。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文此处简略而难解，直译是“有一只手在雅的宝座上”。也可能理解为“有一只手反对雅的宝座”；较不可能的是把“宝座”译作“旌旗”。
    reason: 说明原文的省略结构及主要异读，避免正文武断消除歧义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 承接上文的叙事形式，希伯来文仅以第三人称单数指代说话者，不在本节重述其姓名。
- source_word: כִּי
  choice: 不另译
  rationale: 此处引出话语内容；鉴于下句省略而难解，直接用引号在现代汉语中更自然，也避免以“因为”或“的确”过度限定句法关系。
- source_word: יָד
  choice: 有一只手
  rationale: 原文无定冠词，也未说明是谁的手；如此译保留其不定性和简短、突兀的表达。
- source_word: עַל
  choice: 按在……上
  rationale: 以“在……上”的基本空间意义为主，并用“按在”构成自然汉语；“攻击、反对”属于可能但较具解释性的理解，列入脚注。
- source_word: כֵּס
  choice: 宝座
  rationale: 虽词形异常，最可能是与“宝座”כִּסֵּא相关的短式或残缺拼写；译作“旌旗”词义依据较弱。
- source_word: יָהּ
  choice: 雅
  rationale: 这是神名的短式“Yah”，与本节稍后的四字神名有别，故以音译“雅”保留原文差异。
- source_word: מִלְחָמָה לַיהוָה
  choice: 耶和华必……争战
  rationale: 原文是无动词名词句，表示战争属于耶和华或耶和华与之持续交战；汉语以“必……争战”自然表达上下文中的延续和将来意味。
- source_word: בַּעֲמָלֵק
  choice: 与亚玛力
  rationale: 介词ב在战争语境中可指敌对交锋；“与……争战”清楚表达敌对关系。
- source_word: מִדֹּר דֹּר
  choice: 世世代代
  rationale: 自然、凝练地表达一代接一代持续不断的希伯来习语。
theological_decisions:
- issue: 同一节中 יָהּ 与 יהוה 两种神名形式
  choice: 分别译为“雅”和“耶和华”
  alternative: 两者都译作“耶和华”或“主”
  rationale: 原文有意使用神名短式与完整四字神名；分别翻译能保留这一形式差异，同时采用现代中文读者熟悉的“耶和华”。
- issue: 难解的省略句 כִּי יָד עַל כֵּס יָהּ
  choice: 直译为“有一只手按在雅的宝座上”并以脚注说明歧义
  alternative: “有一只手攻击雅的宝座”或“有一只手按在雅的旌旗上”
  rationale: 希伯来文高度压缩，手的主人及动作含义均未明说。正文保留基本词义和神学张力，不擅自解释为起誓、攻击或举旗。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“按在”维持原句的具体意象，“世世代代”符合经文语体但仍属当代常用表达。
