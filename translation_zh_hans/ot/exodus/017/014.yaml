  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“把这事写在书卷[a]上作为纪念，也要讲给约书亚听[b]，因为我必定[c]从天下抹去亚玛力的记念。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“在那书卷中（或上）”；也可理解为“在一卷书上”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“放在约书亚耳中”，意思是使他听见，或向他宣读此事。
    reason: lexical_alternative
  - marker: c
    text: “我必定……抹去”在原文中采用强调句式，表明行动的确定性。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: כְּתֹב זֹאת זִכָּרוֹן
  choice: 把这事写……作为纪念
  rationale: 保留“写”这一直接命令及 זִכָּרוֹן 的纪念用途；“这事”在汉语中自然指向刚发生的事件。
- source_word: בַּסֵּפֶר
  choice: 写在书卷上
  rationale: “书卷”符合古代书写载体，也能表达 סֵפֶר；介词按自然汉语处理为“在……上”。定冠词的具体所指并不明确，故以脚注保留“那书卷／一卷书”的可能性。
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: 也要讲给约书亚听
  rationale: 这是直译为“放在约书亚耳中”的希伯来语表达；正文采用自然汉语传达使约书亚听见、将此事告诉他的意思，原有意象见脚注。
- source_word: מָחֹה אֶמְחֶה
  choice: 我必定……抹去
  rationale: 以“必定”表达不定词绝对式与限定动词连用所形成的强调和确定性。
- source_word: זֵכֶר עֲמָלֵק
  choice: 对亚玛力的记忆
  rationale: 尽量保留 זֵכֶר 的“记忆、被记得”含义，并与前文“纪念”形成刻意的语义对照，不擅自缩窄为“名字”或仅指亚玛力人本身。
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: 从天下
  rationale: 这是自然而庄重的现代汉语表达，保留“天之下”的全面范围。
theological_decisions:
- issue: 神名的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名 יהוה；音译“雅威”保留其作为以色列之神专名的功能，而不以“主”这一称号替换。
- issue: 抹去的对象
  choice: 对亚玛力的记忆
  alternative: 亚玛力的名号；亚玛力人
  rationale: 原文 זֵכֶר 可指记忆、名号或被记念的状态。正文采用较贴近词义且不限定具体实现方式的译法，保留神谕在群体消灭与无人记念之间的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“书卷”保留古代语境；“讲给……听”避免生硬照译希伯来语习语；“对亚玛力的记忆”略带形式对应，以保留本节“纪念／记忆”之间的重要对照。
