base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: zh_hans
  text: 看哪，我要站[a]在何烈的磐石上，在你面前。你要击打磐石，水就会从磐石中流出来，百姓就会喝。摩西就在以色列的众长老眼前这样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我要站”或译“我正站”。希伯来语这里使用分词，也可表达现在的状态。
    reason: 保留עֹמֵד在时态、体貌上的真实歧义。
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: הִנְנִי用于郑重地引人注意，并引出上帝即将采取的行动；“看哪”保留其庄重的指示语气。
- source_word: עֹמֵד
  choice: 站
  rationale: 原文为分词，结合上下文可表达临近将来的行动，因此与“我要”连用；其现在时理解见脚注。
- source_word: לְפָנֶיךָ
  choice: 在你面前
  rationale: 直接保留空间关系，也不削弱上帝显现在摩西面前的鲜明图景。
- source_word: הַצּוּר
  choice: 磐石
  rationale: צוּר指岩石或岩体；“磐石”自然、庄重，并在本节两次一致译出。
- source_word: בְּחֹרֵב
  choice: 在何烈
  rationale: 地名按现代中文圣经惯用形式音译，介词译作“在”符合地点表达。
- source_word: וְהִכִּיתָ
  choice: 你要击打
  rationale: 在指示语境中表达命令；“击打”准确保留动作力度。
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: 水就会从磐石中流出来
  rationale: 明确代词所指以符合汉语表达；“流出来”自然呈现水从岩石出来的情景，未改变结果关系。
- source_word: וְשָׁתָה הָעָם
  choice: 百姓便可以喝
  rationale: 表达前述出水所带来的结果，同时避免生硬直译为“百姓将喝”。
- source_word: וַיַּעַשׂ כֵּן
  choice: 就这样做了
  rationale: 符合希伯来叙事中的概括公式，也合乎现代汉语习惯。
- source_word: לְעֵינֵי
  choice: 在……眼前
  rationale: 保留“在眼中”的具象表达，强调众长老亲眼见证。
theological_decisions:
- issue: 上帝自我呈现中的分词时态
  choice: 看哪，我要……站在你面前
  alternative: 看哪，我正……站在你面前
  rationale: עֹמֵד在形态上是分词，既可作当前状态理解，也可在这段指示中指临近行动。正文采用更顺应命令与结果次序的将来表达，脚注保留现在时可能。
- issue: “在那里，在何烈的磐石上”所修饰的对象
  choice: 修饰上帝的站立：上帝在那里站在磐石上
  alternative: 上帝站在摩西面前，而磐石只是相邻地点
  rationale: 原文语序最自然地把地点短语与“站”相连。译文保留这一鲜明图景，不作额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“磐石”“何烈”“众长老”延续通行圣经语域；句式尽量自然，同时保留原文的命令—结果—执行结构。
