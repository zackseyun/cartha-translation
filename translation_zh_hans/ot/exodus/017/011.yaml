  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: zh_hans
  text: 每当摩西举起手[a]，以色列就占上风；每当他垂下手[b]，亚玛力人就占上风。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“当摩西举起手时……当他垂下手时。”原文形式上可译为“当……时”，但上下文描述战斗中反复出现的情形，因此正文译作“每当……就……”。
    reason: lexical_alternative
  - marker: b
    text: “垂下”所译的动词也可表示“使歇下”或“放下”。这里与“举起手”相对，因此译作“垂下”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַאֲשֶׁר
  choice: 什么时候……就……
  rationale: 这一结构在上下文中描述战斗期间反复出现的情形；用“什么时候……就……”自然表达这种反复对应关系，而不是一次性的时间顺序。
- source_word: יָרִים
  choice: 举起
  rationale: רום的使役式表示使之升高、举起；“举起”准确自然，也不额外加入持续举着的含义。
- source_word: יָדוֹ
  choice: 手
  rationale: 原文明确使用“手”，故不改译为“手臂”。
- source_word: וְגָבַר
  choice: 就占上风
  rationale: גבר表示强盛、胜过或占优势；在战斗语境中，“占上风”能表达当时战局的优势，又不夸大为已经彻底击败对方。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代中文通行的专名译法；此处指以色列一方。
- source_word: יָנִיחַ
  choice: 垂下
  rationale: נוח的使役式可指使其歇下、放下；与前面的“举起”相对时，“垂下”最自然地表现手降低下来，同时保留动作语境。
- source_word: עֲמָלֵק
  choice: 亚玛力人
  rationale: 此处在战斗中指亚玛力一方；中文用“亚玛力人”比只写地名式的“亚玛力”更清楚自然。
