  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: zh_hans
  text: 摩西筑了一座坛，给它起名叫“雅威是我的旌旗”[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“雅威，我的旌旗”；也可译作“雅威是我的旗号”。这里的“旌旗”可指召集众人、引领争战的旗帜。
    reason: 说明祭坛名称的希伯来文形式、可选译法及旌旗意象。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 筑了
  rationale: בנה在叙事形式中表示“建造”。与“坛”搭配时，现代汉语常说“筑坛”；加“一座”使表达自然清楚。
- source_word: מִזְבֵּחַ
  choice: 坛
  rationale: מִזְבֵּחַ指献祭或敬拜所用的坛。“坛”是简体中文圣经语境中准确、通行且简洁的对应词。
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: 给它起名叫
  rationale: 希伯来语直译为“称它的名”。“给它起名叫”保留命名动作，也符合现代汉语习惯，并明确所命名的是前述祭坛。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用四字神名יהוה。音译为“雅威”可保留其专名性质，不以称号代替。
- source_word: נִסִּי
  choice: 是我的旌旗
  rationale: נִסִּי由“旌旗、旗号”与第一人称单数所属后缀构成，即“我的旌旗”。汉语标题中补出判断词“是”，清楚表达无动词名词句；“旌旗”兼具集合、引领和争战的意象。
theological_decisions:
- issue: 祭坛名称中的神名יהוה如何译出
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文用的是神的专名，而非主、神等称号；采用“雅威”较直接地反映该专名，同时不把称号代入正文。
- issue: יהוה נִסִּי这一无动词短语的关系
  choice: 雅威是我的旌旗
  alternative: 雅威——我的旌旗
  rationale: 原文没有明写系词，因此语法上是名词句。正文补“是”以合现代汉语，但脚注保留较贴近形式的“雅威，我的旌旗”，避免掩盖原文的简约表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“筑了一座坛”简洁自然；祭坛名称以引号标明，并将脚注标记置于名称之后。
