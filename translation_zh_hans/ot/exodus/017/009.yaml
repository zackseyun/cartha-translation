  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: zh_hans
  text: 摩西对约书亚说：“你为我们选些人，出去与亚玛力人争战[a]。明天我要站在山冈顶上[b]，手里拿着神的杖。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向亚玛力人开战”。
    reason: הִלָּחֵם在军事语境中既可译为“争战”，也可表达“开战、作战”。
  - marker: b
    text: 希伯来文直译为“山冈的头”，是指山冈的顶部。
    reason: 说明原文עַל רֹאשׁ הַגִּבְעָה的形象性习语及正文采用的自然中文表达。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 摩西……说
  rationale: 以现代汉语自然的叙事方式承接上文；不机械译出连接词，以免句首“于是”或“然后”增添原文未明确规定的时序色彩。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: 你为我们选些人
  rationale: בְּחַר意为“选择”；לָנוּ译为“为我们”；אֲנָשִׁים字面为“人／男人”，语境指将要作战的人，但不把原文进一步具体化为“士兵”。
- source_word: וְצֵא
  choice: 出去
  rationale: 保留יצא“出去”的基本意义，也自然表达出营迎战的动作。
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: 与亚玛力人争战
  rationale: לחם的尼法勒命令式在军事语境中意为“作战、争战”；בַּעֲמָלֵק表示敌对对象。此处“亚玛力”是集体称谓，中文译作“亚玛力人”更自然。
- source_word: מָחָר
  choice: 明天
  rationale: 保留置于分句开头的时间副词及其强调位置。
- source_word: אָנֹכִי נִצָּב
  choice: 我要站
  rationale: נִצָּב形式上是分词，但受“明天”限定，在此具有将来意义；“我要站”既自然又不额外加入“驻守”等含义。
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: 站在山顶
  rationale: רֹאשׁ字面是“头”，在此与“山冈”连用，惯用义为最高处，即“山顶”。
- source_word: וּמַטֵּה הָאֱלֹהִים
  choice: 手里拿着神的杖
  rationale: 末尾无谓语短语自然附属于摩西“站”的动作；“神的杖”保留原文的属格结构，并与《出埃及记》前文用语呼应。
- source_word: בְּיָדִי
  choice: 手里拿着
  rationale: 将字面的“在我手中”译成自然的现代汉语动作表达，没有改变摩西持杖的画面。
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים中הָאֱלֹהִים的译法
  choice: 神的杖
  alternative: 上帝的杖
  rationale: 此处指以色列的神，并无多神歧义；“神的杖”简洁保留原文结构，也符合本段庄重而自然的语体，不引申出原文未明说的所有权或神学含义。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。命令句简洁有力；“争战”“神的杖”保留经文语感而不过度古雅。脚注标记均置于其实际说明的词组之后。
