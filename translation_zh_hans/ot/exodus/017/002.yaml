base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: zh_hans
  text: 于是，百姓跟摩西争吵，说：“给我们水喝！”摩西对他们说：“你们为什么跟我争吵？为什么试探[a]雅威[b]？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“考验”，或“把……置于考验之下”。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名יהוה（YHWH）的音译；传统上也译作“耶和华”或“上主”。
    reason: alternative_rendering
lexical_decisions:
- source_word: וַיָּרֶב
  choice: 争吵
  rationale: ריב表示争执、争讼或对抗；“争吵”是现代汉语中的自然表达，也保留了百姓与摩西对立的意味。
- source_word: הָעָם
  choice: 百姓
  rationale: 原文仅为带定冠词的“民众”；“百姓”符合叙事语体，不额外补入“以色列人”。
- source_word: עִם מֹשֶׁה
  choice: 跟摩西
  rationale: עִם本义为“与、跟”；汉语“跟摩西争吵”自然地表达双方的对立，无须强化为“攻击摩西”。
- source_word: תְּנוּ לָנוּ מַיִם וְנִשְׁתֶּה
  choice: 给我们水喝
  rationale: 将命令式与表示目的或期望结果的וְנִשְׁתֶּה合并为自然、简洁的汉语请求，同时保留命令口吻。
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: 你们为什么跟我争吵
  rationale: 此处מַה在责问中相当于“为什么”；重复“争吵”保留与前半节ריב的词汇呼应。
- source_word: מַה תְּנַסּוּן
  choice: 为什么要试探
  rationale: נסה的加强词干表示测试、考验；“试探”保留百姓以其行为挑战上帝是否同在、是否供应的严肃意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见中文音译呈现四字神名，而不以称号“主”取代原文专名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；正文以“雅威”保留其专名性质，脚注说明传统译法，以免把专名与称号混同。
- issue: 百姓对雅威所作之事的性质
  choice: 试探
  alternative: 考验；把雅威置于考验之下
  rationale: 原文将百姓与摩西的争执提升为对雅威的נסה。“试探”不将其弱化为一般抱怨，也不进一步解释其动机，从而保留经文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“给我们水喝”保留百姓直接、强硬的命令口吻；两次使用“争吵”呈现原文词根的重复。
