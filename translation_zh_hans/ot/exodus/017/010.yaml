lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 去做
  rationale: עשה在“照着……所说的”结构中表示照办、实行；“去做”自然承接后面的交战行动。
- source_word: כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: 照着摩西对他说的
  rationale: 保留原文“说”的措辞及依照先前指示而行的关系，同时符合现代汉语叙事。
- source_word: לְהִלָּחֵם בַּעֲמָלֵק
  choice: 与亚玛力交战
  rationale: לחם的尼法勒式在此意为交战；ב在该搭配中标示敌对对象。“亚玛力”依原文保留专名，不直接改作族称。
- source_word: עָלוּ
  choice: 上了
  rationale: 准确表达עלה所指向高处移动的动作，简洁自然。
- source_word: רֹאשׁ הַגִּבְעָה
  choice: 山顶
  rationale: 字面为“山丘的头”，是指顶部的惯用表达；“山顶”是自然、庄重的现代汉语。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: אַהֲרֹן
  choice: 亚伦
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: חוּר
  choice: 户珥
  rationale: 采用现代中文圣经人名的通行译名。
