id: EXO.17.1
reference: Exodus 17:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: zh_hans
  text: 以色列全会众[a]照着耶和华的吩咐[b]，从汛的旷野一站一站地起行，在利非订安营；可是，百姓没有水喝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以色列人全体会众”。
    reason: 原文בְּנֵי יִשְׂרָאֵל直译为“以色列的众子”，在这里是对以色列民整体的惯用称呼。
  - marker: b
    text: 原文直译为“照着耶和华的口”，意思是照着他的吩咐或指示。
    reason: 说明希伯来语习语עַל־פִּי的字面形式和语境含义。
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 起行
  rationale: נסע在迁营行程的语境中指拔营出发；“起行”既简洁自然，也保留了旷野叙事中的行程色彩。
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: 以色列全会众
  rationale: עֵדָה指作为整体聚集的群体；“全会众”保留其共同体含义。“以色列”在现代汉语中自然涵盖这里的以色列民。
- source_word: מִמִּדְבַּר סִין
  choice: 从汛的旷野
  rationale: מִדְבָּר译为“旷野”，符合本段环境；סִין是地名，采用中文圣经传统音译“汛”，并非“罪”的意思。
- source_word: לְמַסְעֵיהֶם
  choice: 一站一站地
  rationale: מַסָּע可指旅程中的一段或一站；这里的复数表达分段行进，译为“一站一站地”比字面上的“按他们的行程”更清楚。
- source_word: עַל פִּי יְהוָה
  choice: 照着耶和华的吩咐
  rationale: עַל־פִּי字面为“按……的口”，在此是服从权威命令或指示的习语；“照着……的吩咐”准确而自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 将四字神名作为专名呈现，而不以称号“主”取代；“耶和华”是现代中文读者最熟悉且可辨识的专名形式。
- source_word: וַיַּחֲנוּ
  choice: 安营
  rationale: חנה在旷野行程叙事中指扎营停驻；“安营”是自然、庄重的现代中文表达。
- source_word: בִּרְפִידִים
  choice: 在利非订
  rationale: רְפִידִים是地名，采用通行中文音译“利非订”。
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: 可是，百姓没有水喝
  rationale: 希伯来语连接词ו在这里引出与安营形成反差的新困境，译作“可是”体现语篇转折；“百姓没有水喝”自然表达原文“没有水供百姓饮用”的意思。
theological_decisions:
- issue: 如何翻译神名יהוה
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名，而非一般称号。“耶和华”使中文普通读者能够直接识别这一专名；不译作“主”，以免把专名改成称号。“雅威”更贴近常见的学术拟音，但在普通现代中文中辨识度较低。
- issue: “照着耶和华的吩咐”所表达的引领性质
  choice: 保留为“吩咐”，不具体说明借何种方式引领
  alternative: 照着耶和华的指引
  rationale: עַל־פִּי表明行程依照耶和华权威的话或命令，却没有在本节交代传达方式；“吩咐”保留这种权威性，也不增添原文未明说的机制。
translation_notes:
  register: 采用清楚、庄重的现代标准汉语；以“一站一站地”传达分段行进，以“可是”显明到达营地后无水可饮的叙事反差。地名使用中文圣经中通行且易辨识的音译。
