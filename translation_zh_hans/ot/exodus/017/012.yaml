base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: zh_hans
  text: 可是，摩西的手发沉，于是他们搬来一块石头，放在他下面，他就坐在上面。亚伦和户珥扶住他的手，一个在这边，一个在那边；这样，他的双手就一直保持稳定[a]，直到日落。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “稳定”或译“稳固”“坚定”。这里的希伯来词也可表示“忠信”，但在本节中主要指摩西的手保持稳定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה כְּבֵדִים
  choice: 摩西的手发沉
  rationale: 保留“沉重”的具体希伯来表达，同时用现代汉语“发沉”自然传达因疲劳而难以继续举手。
- source_word: וַיִּקְחוּ אֶבֶן
  choice: 他们搬来一块石头
  rationale: 动词是第三人称复数，主语未明；不擅自限定为亚伦和户珥。“搬来”符合取石供摩西坐下的场景。
- source_word: וַיָּשִׂימוּ תַחְתָּיו וַיֵּשֶׁב עָלֶיהָ
  choice: 放在他下面，他就坐在上面
  rationale: 贴合原文的位置关系与连续动作，并采用清楚自然的现代汉语。
- source_word: תָּמְכוּ בְיָדָיו
  choice: 扶住他的手
  rationale: תמך表示支撑、扶持；“扶住”准确呈现亚伦和户珥所作的身体支撑。
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: 一个在这边，一个在那边
  rationale: 保留原文的分配结构，表明二人分别位于摩西两侧。
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: 他的手一直稳固
  rationale: אֱמוּנָה在此身体疲乏和有人扶持的语境中主要指稳定、坚固；“一直”表达持续至日落的状态。
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: 直到日落
  rationale: 简洁自然地表达“直到太阳落下”这一时间终点。
theological_decisions:
- issue: אֱמוּנָה用于摩西双手时的含义
  choice: 身体上的“稳固”
  alternative: 忠信、坚定
  rationale: 上下文直接描述摩西的手发沉并由亚伦和户珥扶住，因此这里首先是身体保持稳定；脚注保留该词与“坚定、忠信”的语义联系，避免完全抹去原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“手发沉”“扶住”“一直稳固”既贴近希伯来原文，也符合普通话表达；保留未指明的复数主语“他们”。
