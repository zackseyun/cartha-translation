base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你要走到百姓前头去，带上以色列的几位长老[a]同行。你要把那根曾用来击打尼罗河[b]的杖拿在手中，去吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“从以色列的长老中”；表示从长老群体中选取一些人。
    reason: 说明 מִן 所表达的部分选取意义。
  - marker: b
    text: 或译“那河”；在《出埃及记》中，这个词通常特指尼罗河。
    reason: 保留 יְאֹר 可作一般性“河流”理解的词义可能，同时说明本处语境所指。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译保留上帝的专名，不用称号替代。
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: 走到百姓前面
  rationale: 既表达 עבר 的移动含义，也保留 לִפְנֵי 所表示的方位；在本段语境中比直译为“经过百姓面前”自然。
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: 从以色列的长老中带几个人与你同去
  rationale: מן 表示从一个群体中选取一部分；“几个人”以自然汉语明确其部分含义，但不限定具体人数。
- source_word: וּמַטְּךָ
  choice: 那根……杖
  rationale: מַטֶּה 在此指摩西所持、曾用于击打尼罗河的杖；“杖”简洁且符合叙事语境。
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: 曾用来击打尼罗河
  rationale: בּוֹ 表示工具；הַיְאֹר 在《出埃及记》的埃及背景中通常特指尼罗河。
- source_word: קַח בְּיָדְךָ
  choice: 拿在手中
  rationale: 保留第二个 קַח 的命令语气及“在手中”的具体动作，同时采用自然汉语语序。
- source_word: וְהָלָכְתָּ
  choice: 然后去吧
  rationale: 此处完成式承接一连串命令，具有命令性的延续作用；“去吧”自然表达其语用功能。
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事上下文中的 waw 连续式推进事件；汉语直接用“说”即可自然承接，不必机械译出“然后”。
theological_decisions:
- issue: 如何译出神名 יהוה
  choice: 雅威
  alternative: 耶和华
  rationale: “雅威”较直接地音译四字神名，保留其作为专名的性质，而不以“主”等称号替换；“耶和华”是传统汉译，但反映的是另一种读音传统。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。命令句使用“你要……”“去吧”，既保持权威语气，又避免生硬古奥；保留原文两次“拿”的命令结构所表达的行动次序。
