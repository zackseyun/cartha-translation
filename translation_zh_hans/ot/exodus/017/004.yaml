base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: zh_hans
  text: 于是，摩西向雅威呼求说：“我该拿这百姓怎么办呢？再过一会儿[a]，他们就会用石头打我了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“还一点儿，他们就会用石头打我。”这里表示只要再过一会儿，威胁就会发生，强调其迫在眉睫。
    reason: 说明希伯来习语 עוֹד מְעַט 所表达的时间迫近性，并保留“用石头打我”未明确说明结果是否死亡的语义空间。
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: 呼求
  rationale: צעק在这里表示人在危急中大声求助；“呼求”既体现紧迫感，也明确这是摩西向上帝发出的求助，而非一般的说话。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列之上帝专名的性质，不以称号代替。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出直接引语；现代汉语以“说”自然承接，同时保持希伯来文叙事结构。
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  choice: 我该拿这百姓怎么办呢
  rationale: עשה加介词ל在此询问摩西应当如何对待、处置眼前的百姓；“拿……怎么办”是自然现代汉语，并保留他的急迫与无奈。
- source_word: עֹד מְעַט
  choice: 再过片刻
  rationale: 字面为“还一点儿”，在语境中表示危险迫在眉睫；“再过片刻”自然传达时间极短而未把它改写成更强的确定表述。
- source_word: וּסְקָלֻנִי
  choice: 他们就要拿石头打死我了
  rationale: סקל指用石头击打，常含处死之意；“拿石头打死”比单说“用石头打”更清楚地表达生命威胁，“就要……了”传达此处迫近的结果。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名，而非普通称号；采用“雅威”以较直接地呈现专名，同时不把它替换为“主”。
- issue: 摩西所面临威胁的程度
  choice: 他们就要拿石头打死我了
  alternative: 他们会用石头打我
  rationale: 动词סקל在此不只是一般投掷石块，而是在群众冲突中构成致命的石刑或石击威胁；译文表达死亡危险，但不进一步断言这是正式司法处刑。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“呼求”保留危急求助的力度；“我该拿这百姓怎么办呢”适合普通读者理解，又不削弱摩西的无奈。“这百姓”依原文保留指示语气，不擅自强化为贬称。脚注标记置于其实际解释的“再过片刻”之后。
