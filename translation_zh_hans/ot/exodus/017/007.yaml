base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: zh_hans
  text: 他给那地方起名叫玛撒和米利巴[a]，因为以色列人争闹，又因为他们试探耶和华，说：“耶和华是否在我们中间？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “玛撒”与希伯来语“试探、考验”一词相关；“米利巴”与希伯来语“争执、争闹”一词相关。
    reason: 说明两个地名与本节所述试探和争执之间的希伯来语文字联系。
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: 他给那地方起名叫
  rationale: 这是希伯来语常见的命名表达。中文用“给……起名叫”自然清楚，也保留了命名行为。
- source_word: מַסָּה וּמְרִיבָה
  choice: 玛撒和米利巴
  rationale: 两者都是地名，正文采用音译；它们分别与“试探”和“争闹”相关的文字联系在脚注说明。
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: 因为以色列人争闹
  rationale: עַל在此说明命名缘由；רִיב表示争执、争闹。“以色列人”自然表达בְּנֵי יִשְׂרָאֵל在这里对整个群体的称呼。
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: 又因为他们试探耶和华
  rationale: נסה的强化词干在此指试验、考验；“试探”保留了人向上帝提出挑战的负面语义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，在正文中将专名与一般称号“主”区分开。
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: 耶和华究竟在不在我们中间？
  rationale: “在不在”自然对应希伯来语的是非问句及אִם אָיִן；“究竟”传达质疑的语气，而“在我们中间”贴近בְּקִרְבֵּנוּ。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号。正文保留专名性质；“耶和华”是现代中文最广为人知且庄重的传统音译，不以“主”替代原文神名。
- issue: בְּנֵי יִשְׂרָאֵל的群体含义
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语在此是对以色列群体的惯用称呼，并非特指男性后裔；“以色列人”准确、自然，不额外引入性别限制。
- issue: 百姓对神同在的质疑
  choice: 究竟在不在我们中间
  alternative: 是否在我们中间
  rationale: 保留原文尖锐的是非质问，不将其弱化为单纯求知，也不进一步解释为否认或不信，以维持叙事中的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“争闹”呼应前文百姓与摩西争执的叙事情境；问句用“究竟在不在”保持百姓挑战性的语气。正文中的脚注标记[a]与脚注完全对应。
