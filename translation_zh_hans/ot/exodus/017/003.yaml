base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: zh_hans
  text: 百姓在那里因没有水而口渴，就向摩西发怨言，说：“你为什么把我们从埃及领上来，要叫我、我的儿女和牲畜都渴死呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא שָׁם הָעָם לַמַּיִם
  choice: 百姓在那里因没有水而口渴
  rationale: 原文直指百姓“渴求水”；汉语补出“因没有水”可自然表达 לַמַּיִם 在此处所说明的口渴缘由，又不增加新的事件。
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: 向摩西发怨言
  rationale: לוּן 的使役式在旷野叙事中表示抱怨、发怨言；“向……发怨言”准确保留其针对摩西的意味。
- source_word: לָמָּה זֶּה הֶעֱלִיתָנוּ
  choice: 你为什么把我们……领上来
  rationale: לָמָּה זֶּה 是带责问语气的“为什么”；הֶעֱלִיתָנוּ 字面为“使我们上来”，按出埃及的固定叙事表达译为“领上来”。
- source_word: מִקְנַי
  choice: 牲畜
  rationale: 指个人所拥有的家畜群，“牲畜”在现代汉语中简洁且范围合适。
- source_word: בַּצָּמָא
  choice: 渴死
  rationale: 介词短语字面为“以口渴／因干渴”；与 לְהָמִית 连用，汉语自然表达为“渴死”。
theological_decisions:
- issue: 单数“我”与前文复数群体之间的转换
  choice: 保留“我、我的儿女和牲畜”
  alternative: 按群体意义统一译为“我们、我们的儿女和牲畜”
  rationale: 马所拉文本在“把我们领上来”后明确转为第一人称单数 אֹתִי、בָּנַי、מִקְנַי，可能是群体中一人的代表性发言；保留这种数的转换，避免抹平原文张力。
- issue: לְהָמִית 的目的或结果色彩
  choice: 译作“要叫……都渴死”
  alternative: 译作“以致……都渴死”
  rationale: 原文不定式可被抱怨者说成摩西领他们出来的目的，也可能是带指控色彩的预期结果；“要叫”保留其强烈指控语气，不判定摩西真实动机。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言；保留出埃及叙事中“领上来”的空间意象，并保留原文从复数“我们”转为单数“我／我的”的突变。
