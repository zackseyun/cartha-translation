  text: Then Amalek came and fought with Israel at Rephidim[a].
translation:
  language: zh_hans
  text: 那时，亚玛力人[a]来，在利非订与以色列人交战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“亚玛力”（单数专名）；此处用以统称亚玛力人。
    reason: 说明希伯来文以单数专名指称整个族群。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 那时……来到
  rationale: וַ־承接并推进叙事；“那时”自然引出下一事件，“来到”保留 בוא 的基本移动含义，并与地点“利非订”顺畅搭配。
- source_word: עֲמָלֵק
  choice: 亚玛力人
  rationale: 原文使用单数专名“亚玛力”，在这里以祖先或族名统称其族群；现代汉语用“亚玛力人”可清楚表达实际参与争战的是该族群。
- source_word: וַיִּלָּחֶם
  choice: 交战
  rationale: לחם 的尼法勒式在此表示作战、争战；“交战”简洁庄重，也自然容纳后接“与”。
- source_word: עִם
  choice: 与
  rationale: עִם 的基本义是“同、与”；在“与……交战”的汉语结构中，敌对关系已由“交战”明确表达，无须改译为“攻击”。
- source_word: יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这里指以色列群体，而非个人雅各；加“人”符合现代汉语表达，并避免指称含混。
- source_word: בִּרְפִידִם
  choice: 在利非订
  rationale: בְּ־标示事件发生的地点；“在利非订”是自然、准确的汉语地点表达。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代叙事语体。“与以色列人交战”既贴近希伯来文介词的字面关系，也在现代汉语中明确表达双方敌对作战。
