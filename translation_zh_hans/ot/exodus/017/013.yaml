  text: And Joshua overcame Amalek and his people with the sword[a].
translation:
  language: zh_hans
  text: 约书亚用刀剑击败了亚玛力和他的百姓[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“以刀剑的锋刃。”希伯来文直译为“按刀剑的口”；这是指以刀剑击杀或战胜的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: 击败了
  rationale: 该动词可表示“使衰弱、压倒、战胜”。在交战叙事中，“击败了”自然表达约书亚在战斗中占了上风，又不暗示将对方彻底消灭。
- source_word: יְהוֹשֻׁעַ
  choice: 约书亚
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
- source_word: עֲמָלֵק
  choice: 亚玛力
  rationale: 保留专名的单数形式；此处可指由亚玛力之名所代表的亚玛力军队或群体。
- source_word: עַמּוֹ
  choice: 他的百姓
  rationale: עַם通常意为“百姓、人民”。此处在战斗语境中实际可能指随亚玛力作战的人，但译作“他的百姓”较直接地保留原文表达。
- source_word: לְפִי חָרֶב
  choice: 用刀剑
  rationale: 原文直译为“按着刀剑的口”，是指借刀剑进行武装杀伤或击败的希伯来语惯用语；“用刀剑”在现代中文中清楚自然。
