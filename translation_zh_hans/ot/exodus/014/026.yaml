base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: zh_hans
  text: 雅威对摩西说：“你向海面伸出手，使海水回流，淹没埃及人、他们的战车和骑兵。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 该叙事形式承接并推进前文；现代汉语无需机械译出“然后”或“于是”，按上下文直接用“说”即可自然表达事件次序。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，不以“主”等称号替代。
- source_word: נְטֵה אֶת־יָדְךָ
  choice: 你……伸出手
  rationale: 准确表达第二人称阳性单数命令式及具体动作；“伸出手”自然、清楚，也符合本段反复出现的动作描写。
- source_word: עַל־הַיָּם
  choice: 向海
  rationale: עַל在此描述伸手所朝向或覆盖的空间；现代汉语说“向海伸出手”比“在海上伸出手”更自然，并未断定摩西的手实际位于海面上方。
- source_word: וְיָשֻׁבוּ
  choice: 使……回流
  rationale: 命令式之后的未完成式可表达预期或目的性结果；“使……回流”在汉语中清楚连接摩西的动作与海水返回，同时以脚注保留简单将来式的可能。
- source_word: הַמַּיִם
  choice: 海水
  rationale: 希伯来文直译为“水”；结合紧邻的“海”，汉语用“海水”可明确所指，且比复数式“众水”更符合现代标准汉语。
- source_word: עַל מִצְרַיִם
  choice: 淹过埃及人
  rationale: עַל描写海水回到埃及人之上；“淹过”自然保留水覆盖其上的图景，而不额外解释为攻击。
- source_word: עַל רִכְבּוֹ
  choice: 他们的战车
  rationale: רֶכֶב在此指战车；虽然后缀在形态上为阳性单数，但其先行词“埃及”具有集合意义，汉语按语义自然译为复数领属“他们的”。
- source_word: וְעַל פָּרָשָׁיו
  choice: 和骑兵
  rationale: פָּרָשָׁיו指骑马作战的人；“骑兵”是现代汉语简洁而准确的对应词，并与前面的“他们的”共同构成并列领属关系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列之神专名的性质；不以称号“主”替代，也不采用源自较晚混合读法的“耶和华”。
- issue: וְיָשֻׁבוּ与前述命令的关系
  choice: 译作目的或预期结果：“使海水回流”
  alternative: 译作简单将来：“海水就会回流”
  rationale: 该未完成式紧随命令式，可自然理解为摩西伸手所要带来的结果；正文采用符合汉语语境的结果表达，但脚注保留语法上可作简单将来的理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“向海伸出手”“海水回流”“淹过”形成清晰连贯的动作画面；并列项保持简洁，适合公开诵读。
