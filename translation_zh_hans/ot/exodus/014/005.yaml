base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: zh_hans
  text: 有人向埃及王报告说，百姓逃走了。法老和他臣仆的心就转而反对百姓。他们说：“我们这是做了什么，竟让以色列不再服事我们？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 有人报告
  rationale: 该动词为被动形式，原文没有说明报告者；汉语用“有人报告”自然地保留施事者不明确这一点。
- source_word: כִּי בָרַח הָעָם
  choice: 百姓逃走了
  rationale: ברח 表示逃离、逃走；“百姓”对应带定冠词的 הָעָם，并与出埃及叙事中的群体称呼相符。
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: 法老和他臣仆的心就转向
  rationale: 保留“心”的原文意象；单数“心”也依照希伯来文的集合式表达。“转向”体现内在态度的逆转。
- source_word: אֶל הָעָם
  choice: 反对百姓
  rationale: 介词本可表示“向着”，但在态度转变及随后追赶的语境中具有敌对方向，“反对”准确表达语境含义。
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: 我们做的是什么事？
  rationale: 保留原文“这是什么事，我们竟做了”的惊讶和懊悔语气，同时采用自然的现代汉语。
- source_word: שִׁלַּחְנוּ אֶת יִשְׂרָאֵל
  choice: 放走以色列人
  rationale: שׁלח 在本处指准许离去或释放；“放走”简洁自然，并延续出埃及记反复出现的行动主题。
- source_word: מֵעָבְדֵנוּ
  choice: 不再服事我们
  rationale: מן 加 עבד 的形式表达停止为埃及人效力；“不再服事我们”贴近原文，又不把本句明确化为“作我们的奴隶”。
theological_decisions:
- issue: לְבַב 的人论意象
  choice: 心
  alternative: 心意；想法
  rationale: 希伯来语的“心”可指思想、意志和态度的中心。保留“心”既忠于原文意象，也避免缩减为单纯的现代心理概念。
- issue: מֵעָבְדֵנוּ 所表达的以色列人身份
  choice: 不再服事我们
  alternative: 不再作我们的奴隶
  rationale: 上下文明示以色列人遭受奴役，但本短语直接表达的是停止服事；正文不额外强化词义，以保存原句措辞与历史语境之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“臣仆”既可涵盖法老的官员与侍从，也保留 עֲבָדָיו 的政治宫廷语感。将较长的希伯来语并列句分为三句，以符合现代汉语叙事节奏，同时保留事件推进关系。
