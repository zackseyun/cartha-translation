  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: zh_hans
  text: 以色列看见了耶和华向埃及施展的大能之手[a]，百姓就敬畏耶和华，并且信靠耶和华和他的仆人摩西。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “大能之手”直译为“大手”，是表示能力或权能的常见形象说法。也可译作“强有力的手”。“向埃及”也可译作“在埃及”或“对埃及”。
    reason: 保留 הַיָּד הַגְּדֹלָה 的字面意象与 בְּמִצְרַיִם 的介词歧义。
lexical_decisions:
- source_word: וַיַּרְא
  choice: 看见了
  rationale: 表示以色列亲眼目睹刚刚发生的事；“看见”直接保留叙事中的感知动作。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 保留希伯来文的单数集合称呼，并与后文“百姓”相呼应。
- source_word: הַיָּד הַגְּדֹלָה
  choice: 大能之手
  rationale: 既保留“手”这一贯穿《出埃及记》的意象，也以自然的现代汉语表达其能力、权能之义；“大能”在此比生硬的“大手”更清楚。
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: 耶和华向埃及施展的
  rationale: 动词 עשה 字面为“做”，但与“手”连用时，汉语用“施展”较自然；介词 בְ 在此可指针对埃及的行动，因此译作“向埃及”，同时在脚注保留“在埃及/对埃及”的可能。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者熟悉的神名音译，保留原文专名而不以称号替代。
- source_word: וַיִּירְאוּ
  choice: 敬畏
  rationale: 原词包含惧怕、震慑和尊崇；本处是百姓目睹拯救与审判后的回应，“敬畏”能自然保留其宗教语境中的复合含义。
- source_word: וַיַּאֲמִינוּ בַּיהוָה
  choice: 信靠耶和华
  rationale: אמן 的使役形配介词 בְ 表示相信并倚赖；“信靠”比单说“相信”更能呈现关系性的信任。
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: 和他的仆人摩西
  rationale: 同一介词结构使“信靠”同时管辖耶和华与摩西；“他的仆人”明确摩西从属于耶和华，而非与耶和华地位相等。
theological_decisions:
- issue: 百姓对摩西的回应性质
  choice: 译为百姓“信靠耶和华和他的仆人摩西”，保留同一动词和介词结构，同时以“他的仆人”表明摩西是耶和华所授权、从属于他的仆人。
  alternative: 译为“相信耶和华，也相信摩西”，或“信耶和华和摩西”。
  rationale: 希伯来文以 אמן + בְ 同样连接耶和华和摩西，不能把对摩西的信任从正文中删去；但“他的仆人”又阻止读者将二者理解为同等对象。
- issue: 百姓对耶和华的“惧怕”
  choice: 敬畏耶和华
  alternative: 惧怕耶和华；对耶和华心生敬畏
  rationale: ירא 的语义包括害怕、震慑和尊崇。上下文同时涉及埃及受审判与以色列蒙拯救；“敬畏”保留这种神学张力，而不将其化约为单纯恐惧。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“耶和华”呈现神名；“大能之手”保留原文意象而避免“大手”的现代歧义；句法略作汉语化，以“就……并且……”呈现连续叙事动作。
