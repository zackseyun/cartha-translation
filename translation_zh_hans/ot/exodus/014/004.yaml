  text: וְ/חִזַּקְתִּ֣י אֶת לֵב פַּרְעֹה֮ וְ/רָדַ֣ף אַחֲרֵי/הֶם֒ וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ וְ/יָדְע֥וּ מִצְרַ֖יִם כִּֽי אֲנִ֣י יְהוָ֑ה וַ/יַּֽעֲשׂוּ כֵֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: zh_hans
  text: 我要使法老的心刚硬[a]，他必追赶他们；我要在法老和他的全军身上得荣耀[b]，埃及人就知道我是耶和华。”于是，以色列人就这样做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我要使法老的心坚定（或坚强）。”希伯来语动词本义可指使之坚强、坚定；在本段叙事中，这种坚定表现为顽梗，因此译作“刚硬”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我要借着法老和他的全军彰显我的荣耀。”希伯来语表达耶和华要在随后临到法老及其军队的事上得荣耀，或显为有荣耀。
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי אֶת לֵב פַּרְעֹה
  choice: 我要使法老的心刚硬
  rationale: חזק 的使役形明确以上帝为行动主体；“使……刚硬”既保留直接因果，也按出埃及记语境表达法老意志的顽梗。“心”保留 לֵב 的圣经意象，指思想、意志和内在决定的中心。
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: 他就会追赶他们
  rationale: רדף אחרי 表示追逐、追赶；此处是军事追击，“追赶”自然清楚。
- source_word: וְאִכָּבְדָה בְּפַרְעֹה וּבְכָל חֵילוֹ
  choice: 我要借着法老和他的全军彰显我的荣耀
  rationale: כבד 的此种用法表示耶和华因随后发生在法老及其军队身上的事而得荣耀。“借着……彰显我的荣耀”在现代汉语中自然，并保留 בְּ 所容许的媒介或关联含义；脚注说明也可理解为在审判中从他们身上得荣耀。
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: 埃及人就知道
  rationale: 专名“埃及”搭配复数动词，在汉语中宜明确译为“埃及人”，突出全国之民的认识。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，而不以“主”这一称号代替。
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 于是，以色列人就照样做了
  rationale: 原文主语隐含，承接前节受命的摩西和以色列人；汉语补出“以色列人”以避免误以为埃及人是主语。“照样做了”自然表达执行前述命令。
theological_decisions:
- issue: 上帝使法老的心刚硬
  choice: 直接译作“我要使法老的心刚硬”
  alternative: “我要任凭法老的心刚硬”或“我要使法老的心坚定”
  rationale: 希伯来文第一人称使役形明确表达上帝主动施行；译成“任凭”会把直接因果弱化为许可，是原文没有明说的神学缓和。同时以脚注保留“使坚定／坚强”的词汇可能性。
- issue: 上帝借法老受荣耀
  choice: “我要借着法老和他的全军彰显我的荣耀”
  alternative: “我要在法老和他的全军身上得荣耀”
  rationale: 原文可表达耶和华在与法老及其军队有关的审判中显为有荣耀者。正文采用自然汉语表达彰显荣耀，脚注保留更具对抗和审判色彩的译法，不把 בְּ 的关系限定为单一语义。
translation_notes:
  register: 采用庄重、流畅的现代标准汉语。“刚硬”保留出埃及记反复出现的核心表达；末句补明“以色列人”，以消除中文中最近主语“埃及人”可能造成的歧义。所有脚注标记均已置于正文相应位置。
