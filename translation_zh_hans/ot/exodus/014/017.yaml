base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: zh_hans
  text: 我——看哪，我要使埃及人的心刚硬，使他们跟在他们后面进去；我要藉着法老和他的全军、他的战车和骑兵彰显我的荣耀。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: 至于我，看哪，我要
  rationale: 保留独立代词与 הִנְנִי 所形成的强调，同时用庄重而可懂的现代汉语表达。
- source_word: מְחַזֵּק אֶת לֵב מִצְרַיִם
  choice: 使埃及人的心刚硬
  rationale: מְחַזֵּק 是使役意味明显的 Piel 分词，直接表明上帝的行动；“心”依照希伯来文保留单数集合用法。
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: 使他们跟着以色列人进入海中
  rationale: 上下文表明埃及人将跟随以色列人进入海中；补出指代对象及场景，使现代汉语清楚，但不改变事件关系。
- source_word: וְאִכָּבְדָה
  choice: 我要……彰显我的荣耀
  rationale: 该形式表达耶和华借审判显出并获得尊荣；此译法比“得荣耀”更自然，也保留事件性的主动彰显。
- source_word: בְּפַרְעֹה וּבְכָל חֵילוֹ
  choice: 在法老和他的全军……身上
  rationale: 介词 בְּ 在此标示上帝彰显荣耀所借着或所临到的对象；“在……身上”保留一定的方式与对象歧义。
- source_word: בְּרִכְבּוֹ וּבְפָרָשָׁיו
  choice: 他的战车和骑兵
  rationale: רִכְבּוֹ 虽为单数形态，却可作集合名词；פָרָשָׁיו 在此指军事骑乘人员，译为“骑兵”简洁自然。
theological_decisions:
- issue: 上帝使埃及人的心刚硬
  choice: 直接译为“我要使埃及人的心刚硬”
  alternative: 我要任凭埃及人的心刚硬
  rationale: 原文明确把行动归于上帝，不应以“任凭”削弱直接施事关系；保留神圣主权与人的责任之间的张力。
- issue: כבד 在审判语境中的含义
  choice: “彰显我的荣耀”
  alternative: “得荣耀”或“显为荣耀”
  rationale: 译文表达上帝通过对法老军队的审判显出自己的荣耀，同时避免把原文限定为单一的抽象状态。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“至于我，看哪”保留原文突出的自我强调；“心”保留希伯来文单数集合表达。未设置脚注，因为正文已能自然承载关键语义，且所给英文脚注的标记与内容存在错配，不宜照搬。
