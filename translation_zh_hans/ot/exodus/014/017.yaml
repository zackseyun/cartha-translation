revisions:
- from: 至于我，看哪，我要使埃及人的心刚硬，使他们跟着以色列人进入海中；我要在法老和他的全军、他的战车和骑兵身上彰显我的荣耀。
  to: 我——看哪，我要使埃及人的心刚硬，使他们跟在他们后面进去；我要藉着法老和他的全军、他的战车和骑兵彰显我的荣耀。
  rationale: 修订以“我——看哪，我”更准确承载原文的强调；将“跟着以色列人进入海中”收束为“跟在他们后面进去”，保留原文代词及动词本身的语义开放性，同时不妨碍读者由上下文理解。以“藉着”表达 בְ 在此与上帝得/显荣耀相关的媒介或对象关系，语义自然而不过度限定。
