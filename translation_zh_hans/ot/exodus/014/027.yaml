base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: zh_hans
  text: 摩西向海伸出手；到了清晨，海水恢复原状[a]，埃及人却迎着海水逃跑。雅威把埃及人抛进海中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “原状”也可译作“原有的力量”或“通常的状态”。希伯来语表达海恢复了它稳定、正常的状态。
    reason: lexical_alternative
  - marker: b
    text: “抛进”所译的希伯来语动词本义是“抖落”或“甩出”，生动描绘雅威把埃及人甩进海中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: 伸出
  rationale: נטה与“手”连用，通常表示把手伸出；此译自然并保留具体动作。
- source_word: הַיָּם
  choice: 海
  rationale: 原文是普通名词“海”，本节本身没有要求把它处理为专名。
- source_word: וַיָּשָׁב הַיָּם
  choice: 海水恢复
  rationale: שׁוב在这里指回到先前的状态；汉语用“恢复”可自然衔接后面的לְאֵיתָנוֹ。
- source_word: לִפְנוֹת בֹּקֶר
  choice: 到了清晨
  rationale: 该短语表示清晨转来或破晓之际；“到了清晨”是自然、清楚的现代汉语表达。
- source_word: לְאֵיתָנוֹ
  choice: 原状
  rationale: אֵיתָן可表达恒常、稳固或力量；在海水分开后重新合拢的语境中，“恢复原状”保留其恢复正常稳定状态之意，同时不把含义局限为流速或位置。
- source_word: נָסִים לִקְרָאתוֹ
  choice: 迎着海水逃跑
  rationale: נָסִים表示持续逃跑，לִקְרָאתוֹ直指“朝向它／迎着它”；此译保留埃及人逃跑方向与回涌海水相对的张力。
- source_word: וַיְנַעֵר
  choice: 抛进
  rationale: נער本义有抖落、甩出之意；“抛进”在汉语中自然表达强烈动作，正文避免生硬直译，脚注说明其鲜明意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名，而不以称号代替；“雅威”是现代汉语中可辨识的形式。
- source_word: בְּתוֹךְ הַיָּם
  choice: 海中
  rationale: תּוֹךְ表示内部或当中；与带有动作方向的动词结合，“抛进海中”简洁地传达进入海的内部。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用较贴近学界通常拟音Yahweh的“雅威”，保留其专名性质；“耶和华”是传统汉语形式，但反映较晚的混合读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“迎着海水逃跑”刻意保留原文方向表达造成的反常张力，不改写成“逃离海水”。分号连接摩西的动作与清晨海水恢复，随后用“却”凸显埃及人逃跑与海水迎面回涌的对照。所有脚注标记均已置于正文对应位置。
