  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: zh_hans
  text: 法老逼近时，以色列人[a]抬眼一看，只见埃及人[b]正跟在他们后面行进。他们非常害怕，以色列人就向雅威呼求。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文字面是“以色列的众子”，在这里指以色列全体民众。
    reason: lexical_alternative
  - marker: b
    text: 原文作“埃及”，在这里以国名集合指追赶他们的埃及人或埃及军队。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: 逼近
  rationale: 此处是使役词形但意义不及物，以法老为主语，表示逐渐接近；“逼近”既自然，也传达追兵临近的紧张感。
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: 抬眼一看
  rationale: 这是希伯来语中表示举目观看的惯用语；此译保留动作形象，同时符合现代汉语叙事习惯。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: 该词引出突然映入眼帘的景象，具有现场感和戏剧性；“只见”自然传达这一叙事功能。
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 原文使用国名“埃及”，在此作集合称呼，指追赶以色列人的埃及军队；正文保留原文形式，并以脚注说明。
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: 正跟在他们后面行进
  rationale: נסע的核心意义是出发、迁行或行进；结合军事追赶的语境，此译表达持续向他们而来，又不把词义直接收窄为“追击”。
- source_word: וַיִּירְאוּ מְאֹד
  choice: 他们非常害怕
  rationale: 自然表达动词与加强语“极其”的组合，保留强烈的恐惧。
- source_word: וַיִּצְעֲקוּ
  choice: 呼求
  rationale: 该动词表示人在危急中高声求告；“呼求”兼顾紧迫感及向神求助的对象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，不以称号替代原文中的专名。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文字面为“以色列的众子”，在这里是全民族的固定集合称谓；“以色列人”在现代汉语中清楚自然，脚注保留其字面形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。正文采用“雅威”作为较贴近学界通常重构读音的现代汉语音译，同时不以“主”等称号代替专名。
- issue: בְנֵי יִשְׂרָאֵל 的群体指称
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该短语字面带有阳性亲属称谓，但在此作为民族整体的固定名称；采用自然的现代汉语群体称呼，并用脚注呈现字面结构，避免使读者误以为只指男性。
- issue: מִצְרַיִם 的集合用法
  choice: 埃及
  alternative: 埃及人／埃及军队
  rationale: 原文保留国名并以单数分词与之搭配，形成以国家代追兵的集合表达；正文保留这一修辞张力，脚注交代语境所指。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“抬眼一看，只见”保留希伯来叙事的现场感；重复“以色列人”以对应原文的重复主语。“正……行进”呈现分词所表达的进行状态。
