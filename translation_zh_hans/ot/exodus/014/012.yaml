base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: zh_hans
  text: “我们在埃及不是对你说过这话吗？我们说：‘不要管我们，让我们服事埃及人吧！’因为服事埃及人，总比死在旷野好。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא זֶה הַדָּבָר
  choice: 我们……不是……说过这话吗
  rationale: 保留反问语气；הַדָּבָר 在此指先前所说的话，译作“这话”比生硬的“这个话语”自然。
- source_word: חֲדַל מִמֶּנּוּ
  choice: 不要管我们
  rationale: 该短语直指“从我们这里停手、别干预我们”，现代汉语以“不要管我们”自然表达“别来干涉／任凭我们”的语气。
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: 让我们服事埃及人吧
  rationale: נַעַבְדָה 表达第一人称复数意愿；“埃及”在此转指统治他们的埃及人，中文明确为“埃及人”可避免误解为服事一个地名。
- source_word: כִּי טוֹב לָנוּ עֲבֹד אֶת־מִצְרַיִם מִמֻּתֵנוּ בַּמִּדְבָּר
  choice: 因为服事埃及人，总比死在旷野好
  rationale: 保留原文直接的比较结构；“总比……好”符合抱怨情境下的现代汉语表达，同时不额外把原文的简单评价限定为反事实过去。
theological_decisions:
- issue: 以色列人对奴役与死亡的比较
  choice: 保留“服事埃及人……比死在旷野好”的直接陈述
  alternative: 译为“我们当初还不如继续服事埃及人”
  rationale: 原文没有“当初”或明确的反事实标记；直接比较可保留其抱怨的即时性，以及他们对过去奴役的扭曲回顾。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。引语层次清楚，保留原文反问与抱怨语气；“服事”延续圣经语域，又能表达受役于埃及人的含义。
