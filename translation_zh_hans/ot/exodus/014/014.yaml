  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: zh_hans
  text: 雅威必为你们争战；你们要安静。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们必安静”、“你们要保持安静”或“你们要静默”。该动词形式可按语境理解为劝令，也可理解为对将来状态的陈述；其主要意思是保持安静、不作声。
    reason: 该未完成式可带劝令或将来陈述的语气；脚注保留这一可能性，并澄清词义的重点是静默。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文本直接音译上帝的专名，避免以称号代替其名；“雅威”是现代汉语中清楚而通行的译法。
- source_word: יִלָּחֵם
  choice: 必……争战
  rationale: לחם 的尼法勒未完成式在此表示将要发生且带有应许语气的行动；“争战”保留军事语义，也符合庄重的经文语体。
- source_word: לָכֶם
  choice: 为你们
  rationale: 介词 ל 加第二人称阳性复数词尾表达受益或代表关系，即雅威替以色列人争战。
- source_word: וְאַתֶּם
  choice: 你们
  rationale: 独立代词与前句形成鲜明对照；汉语用分号并省略生硬的“而”，自然呈现“雅威行动、百姓安静”的对比。
- source_word: תַּחֲרִישׁוּן
  choice: 只管安静
  rationale: חרשׁ 的使役词干形式在此可指保持安静、不作声；未完成式在语境中既可理解为命令，也可理解为结果或应许。“只管”自然表达劝令，同时脚注保留其他可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；正文采用较贴近其可能发音的现代汉语音译“雅威”，从而保留专名而不以“主”等称号替代。
- issue: תַּחֲרִישׁוּן 的语气
  choice: 只管安静
  alternative: 你们必安静不动
  rationale: 该未完成式在摩西劝勉百姓的上下文中可有命令或劝令力量，但形式本身也容许陈述将来结果。正文采用自然的劝令表达，脚注明确保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“争战”保留出埃及叙事中的军事场景；分号突出雅威的行动与百姓的安静之间的对照。脚注标记已置于正文相关句末。
