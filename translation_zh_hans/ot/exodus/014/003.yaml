base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: zh_hans
  text: 因为法老会论到以色列子孙[a]说：“他们在这地茫然失措[b]；旷野把他们困住了[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们在这地迷失了方向”，或“他们在这地进退无路”。原文可表示困惑、迷惘，也可含陷入困境之意。
    reason: lexical_alternative
  - marker: c
    text: 或译：“旷野把他们围困了。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: 因为……会……说
  rationale: 在上下文中，耶和华是在预告法老接下来的判断，因此用将来意义的“会……说”；句首的连接词在此带解释作用，译作“因为”自然地承接上文。
- source_word: פַּרְעֹה
  choice: 法老
  rationale: 采用现代汉语中通行的埃及王室称号译法。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 论到以色列子孙
  rationale: אמר与介词ל连用时，这里可指谈论的对象；“论到”表达“关于”，而“以色列子孙”保留原文的亲属称谓。
- source_word: נְבֻכִים
  choice: 迷失了方向
  rationale: 该分词表示困惑、茫然或不知该往何处去的状态；“迷失了方向”兼顾处境中的失措与方位上的迷惘，又不额外断定他们正在四处游荡。
- source_word: הֵם
  choice: 他们
  rationale: 明确呈现原文独立代词所标出的主语。
- source_word: בָּאָרֶץ
  choice: 在这地
  rationale: אֶרֶץ可指土地、地域；“这地”在本语境中自然，同时不武断限定为埃及全境或某一特定地区。
- source_word: סָגַר עֲלֵיהֶם
  choice: 把他们困住了
  rationale: 该表达描绘四周封闭、无路可出的处境；“困住”以自然现代汉语保留受围困的意象。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: מִדְבָּר通常指荒凉、未耕作的野地，不一定是沙漠；“旷野”符合出埃及叙事的地理语境和汉语圣经文体。
