  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
translation:
  language: zh_hans
  text: 他带上六百辆精选的战车，以及埃及所有的战车，并派军官统领所有这些战车。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “军官”所译的希伯来语军事称谓含义不完全确定，也可指与战车有关的高级随员、精锐武士或战车长官；原文可理解为这些人员负责统领整个战车部队。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 他带上
  rationale: 该叙事性连续式推动情节发展；“带上”自然表达法老调动战车随行出征，而不额外强化因果关系。
- source_word: שֵׁשׁ מֵאוֹת
  choice: 六百辆
  rationale: 直接译出数目，并按现代汉语为战车添加量词“辆”。
- source_word: רֶכֶב
  choice: 战车
  rationale: 此处既有明确数目，又处于军事追击语境，因此译作可数的“战车”，比泛指“车队”更准确。
- source_word: בָּחוּר
  choice: 精选的
  rationale: 该词表示经过挑选的优良或精锐单位；“精选的”保留被拣选之意，又不擅自规定具体装备或兵员等级。
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  choice: 以及埃及所有的战车
  rationale: 表达除六百辆精选战车以外，埃及其余战车也被调动；“所有的”自然呈现 כֹל 的整体范围。
- source_word: וְשָׁלִשִׁם
  choice: 军官
  rationale: שָׁלִשִׁים 是含义不完全确定的军事职称，可指战车上的高级随员、武士或长官；正文采用宽泛自然的“军官”，脚注保留词义的不确定性。
- source_word: עַל כֻּלּוֹ
  choice: 每辆车上都有
  rationale: 介词 עַל 与集合性单数后缀在此可表达人员配置于整个战车部队；译为“每辆车上都有”按分配意义处理，并保留“在车上”的空间关联。
