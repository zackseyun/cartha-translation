    reason: 保留לִפְנֵי在空间关系上的词义歧义。
  revision_rationale: 修订使军队清单仍作为“埃及人”的同位说明，恢复原文单一的追赶、追上叙事动作；同时将比·哈希录和巴力·洗分的地点定位直接连于“追上”，删除原文没有的“来到”和不够精确的“附近”。
