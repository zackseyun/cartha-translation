base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: zh_hans
  text: 埃及人追赶以色列人，在他们于海边扎营时，在比·哈希录、巴力·洗分前面[a]追上了他们——法老所有的战车和战马、骑兵和军队。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“巴力·洗分对面。”希伯来语可表示位于某地标前方，也可表示与该地标相对。
    reason: 保留לִפְנֵי在空间关系上的词义歧义。
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם אַחֲרֵיהֶם
  choice: 埃及人追赶以色列人
  rationale: מִצְרַיִם在复数动词语境中指埃及人或埃及军队；中文补出承接上文的“以色列人”，避免连续代词所指不清。
- source_word: וַיַּשִּׂיגוּ אוֹתָם
  choice: 追上了他们
  rationale: נשׂג在此指追赶者赶上目标；“追上”自然、准确，并保留叙事推进感。
- source_word: חֹנִים עַל הַיָּם
  choice: 在他们扎营的海边
  rationale: 分词חֹנִים描述以色列人被追上时正在驻营的状态；עַל在此为方位用法，译作“海边”。
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: 法老所有的战马和战车
  rationale: 原文是压缩的集合性军事表达；此译在现代中文中自然地呈现法老的战车部队及其马匹，并保留“所有”的整体性。
- source_word: וּפָרָשָׁיו
  choice: 马兵
  rationale: פָּרָשׁ指骑马作战的人员；“马兵”简明且符合本段古代军事语境。
- source_word: וְחֵילוֹ
  choice: 和军队
  rationale: חַיִל在这里指军事力量，译作“军队”最清楚自然。
- source_word: עַל פִּי הַחִירֹת
  choice: 比·哈希录附近
  rationale: 该介词结构在此标明地点；“附近”自然表达其方位关系，专名按音译处理。
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: 巴力·洗分对面
  rationale: לִפְנֵי在空间语境中可表示“在……前面”或“在……对面”；正文采用符合地标定位语境的“对面”，并以脚注保留另一可能。
theological_decisions: []
