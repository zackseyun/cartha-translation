revisions:
- from: 埃及人追赶以色列人，在他们扎营的海边追上了他们。法老所有的战马和战车、马兵和军队，都来到比·哈希录附近、巴力·洗分对面[a]。
  to: 埃及人追赶以色列人，在他们于海边扎营时，在比·哈希录、巴力·洗分前面[a]追上了他们——法老所有的战车和战马、骑兵和军队。
  rationale: 修订使军队清单仍作为“埃及人”的同位说明，恢复原文单一的追赶、追上叙事动作；同时将比·哈希录和巴力·洗分的地点定位直接连于“追上”，删除原文没有的“来到”和不够精确的“附近”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T04:26:15Z'
review_pass:
  verdict: revise
  source_fidelity: 草稿正确传达了埃及人追赶并追上以色列人的基本事件，也保留了扎营、海边及两处地名。然而后句改为追兵“都来到……附近”，将原文中埃及军队作为追赶、追上者的同位说明，改成了独立的“来到”事件；“附近”也弱化了原文的地点定位。
  naturalness: “马兵”在现代普通话中不如“骑兵”自然。“在他们扎营的海边”可理解，但“在他们于海边扎营时”更清楚表达分词所示的同时状态。修订后以破折号标示军队构成，并让地点直接修饰“追上”。
  terminology: “法老”“以色列人”“巴力·洗分”均可保留。“比·哈希录”按既有音译保留。将“马兵”改为“骑兵”，并以“战车和战马”自然表达原文的集合性军事清单。脚注保留לִפְנֵי的“前面／对面”空间歧义。
  issues:
  - severity: medium
    issue: “都来到比·哈希录附近”新增并改变了谓语事件。
    rationale: 原文的“法老所有的战车马匹、骑兵和军队”与“埃及人”同位，继续描述追赶并追上者；并没有另说他们“来到”。
  - severity: medium
    issue: “附近”不够对应地点表达。
    rationale: עַל־פִּי הַחִירֹת在此用于地点定位，宜译为“在/靠近比·哈希录”，不应以泛泛的“附近”取代；并且该地点应与巴力·洗分的空间关系一并表达。
  - severity: low
    issue: “马兵”较不合现代标准汉语军事用语。
    rationale: פָּרָשָׁיו指骑马作战者，“骑兵”更自然、清楚。
  revised_text: 埃及人追赶以色列人，在他们于海边扎营时，在比·哈希录、巴力·洗分前面[a]追上了他们——法老所有的战车和战马、骑兵和军队。
