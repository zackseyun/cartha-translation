base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: zh_hans
  text: 摩西向海伸出手，雅威[a]就用强劲的东风[b]使海整夜退去，使海成为干地，水也分开了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来语神名יהוה（YHWH）的拟音；传统上也译作“耶和华”，或以“主”代称。
    reason: 说明神名的译法及常见替代形式。
  - marker: b
    text: 也可译作“强大的东风”。
    reason: 保留עַזָּה的近义词汇译法。
lexical_decisions:
- source_word: וַיֵּט ... אֶת־יָדוֹ עַל־הַיָּם
  choice: 向海伸出手
  rationale: נטה与“手”连用，表示伸出或展开；עַל在此可表达动作朝向海面。“向海伸出手”符合现代汉语，也保留了动作及其对象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 这是四字神名YHWH；“雅威”按其较通行的学术拟音直接呈现神名，而不以“主”这一称号替代。
- source_word: וַיּוֹלֶךְ ... אֶת־הַיָּם
  choice: 使海……退去
  rationale: הלך在使役词形中基本义为“使……行进/移去”。结合海水分开的语境，“使海退去”自然表达其结果，同时脚注保留较直译的可能。
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: 用强劲的东风
  rationale: רוּחַ受“东”和“强劲”修饰，在此指风；介词ב表示手段。“强劲”自然传达עַזָּה的力度。
- source_word: כָּל־הַלַּיְלָה
  choice: 整夜
  rationale: 简洁准确地表达动作持续整个夜晚。
- source_word: וַיָּשֶׂם אֶת־הַיָּם לֶחָרָבָה
  choice: 使海成了干地
  rationale: חָרָבָה指干地或干燥之地；此译保留“海”为受事，也保留海成为干地的强烈表述。
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: 水就分开了
  rationale: בקע的尼פעל词形表示被劈开、裂开或分开；汉语“水就分开了”自然、具体，并不额外说明分开的方式。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主；主
  rationale: 原文直接使用以色列神的专名，而非普通称号。正文采用“雅威”以保留专名；脚注注明传统译名，方便读者辨认，但不把称号代入正文。
- issue: 海退去与东风之间的关系
  choice: 雅威用东风使海退去
  alternative: 东风本身使海退去
  rationale: 希伯来语明确以雅威为使役动词的主语，以东风为施行行动的手段；译文同时保留神的行动和风的媒介作用，不将二者对立。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“向海伸出手”“整夜”“成了干地”简洁有力；以分号衔接最后结果，使动作次序清楚。正文避免古奥词语，也不增添原文未说明的水墙、通道或自然机制。
