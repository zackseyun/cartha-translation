  yaml_path: translation/ot/exodus/014/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: zh_hans
  text: 随后，耶和华[a]对摩西说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文：יהוה（YHWH）；也常音译为“雅威”。
    reason: 说明神名的原文形式及常见的另一音译。
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: 该形式承接并推进叙事；现代汉语用“说”自然表达正式发言，而不必机械加入“然后”。
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 这是四字神名יהוה；“耶和华”是现代中文圣经传统中通行且可辨识的音译，同时以脚注说明其形式与另一常见拟音。
- source_word: אֶל
  choice: 对
  rationale: 在言说动词后标明受话者，现代汉语自然译为“对”。
- source_word: מֹשֶׁה
  choice: 摩西
  rationale: 采用该人名在现代中文中的通行译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该不定式用于引出直接话语；中文以“说：”自然承载其功能，无须重复译作“说着”。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉的传统音译“耶和华”，不以“主”替代专名；脚注保留其希伯来字母形式，并提示“雅威”这一常见拟音，以免把古代读音说成完全确定。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。将希伯来语“说……说”公式压缩为中文惯用的“对摩西说：”，既保留引语导入功能，也避免生硬重复。
