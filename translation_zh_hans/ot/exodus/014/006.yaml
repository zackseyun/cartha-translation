base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/006.yaml
  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: zh_hans
  text: 于是，法老套好他的战车[a]，带着他的民众一同出发[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“备好他的战车”。希伯来语动词字面意思是“捆绑、系住”，此处指套好牲畜、备妥战车。
    reason: lexical_alternative
  - marker: b
    text: “他的民众”很可能指跟随法老的队伍；希伯来原文说“他的民众”，没有明确说“他的军队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: 套好
  rationale: אָסַר本义为“捆绑、系住”；用于战车语境时，指把牲畜套上、将战车备妥。“套好”既保留具体动作，也符合现代汉语表达。
- source_word: רִכְבּוֹ
  choice: 他的战车
  rationale: רֶכֶב可泛指战车队，但此处为带第三人称单数后缀的单数形式，最自然地指法老自己的战车。
- source_word: עַמּוֹ
  choice: 他的民众
  rationale: עַם通常指“人民、民众”。此处在军事追赶的语境中，很可能指随法老出发的人员或军力，但原文没有明确使用“军队”，因此不作过度限定。
- source_word: לָקַח עִמּוֹ
  choice: 带着……一同出发
  rationale: 该组合直译为“带着……与他同去”。结合叙事中的出发行动，译作“带着……一同出发”自然清楚。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“套好”保留原文具体动作；“民众”避免把军事语境中可能所指的随行队伍直接窄化为“军队”。
