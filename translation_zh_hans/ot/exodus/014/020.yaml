  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: zh_hans
  text: 它来到埃及人的营和以色列人的营之间[a]。那里有云和黑暗，却照亮了黑夜；整个夜晚，两个营彼此没有接近。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它来到埃及人的营和以色列人的营之间；有云和黑暗，却在夜间发光。”希伯来原文十分简练；黑暗和光与两个营之间的关系如何理解，古代译本和后世译法并不一致。
    reason: 说明另一种句法理解，并保留原文没有明说光暗如何对应两营的不确定性。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 它来到
  rationale: 该动词为阳性单数，承接上文移动到以色列营后的上帝使者或云柱。用“它”贴近云柱这一显现，同时不在正文中另行补明主语。
- source_word: בֵּין ... וּבֵין
  choice: 在……和……之间
  rationale: 准确表达两营之间的空间位置，符合现代汉语习惯。
- source_word: מַחֲנֵה מִצְרַיִם / מַחֲנֵה יִשְׂרָאֵל
  choice: 埃及营 / 以色列营
  rationale: 保留原文“埃及的营”和“以色列的营”的简洁结构；“营”在上下文中兼指营地及其中的队伍。
- source_word: וַיְהִי הֶעָנָן וְהַחֹשֶׁךְ
  choice: 当时有云和黑暗
  rationale: 按存在句理解 וַיְהִי，并保留“云”与“黑暗”的并列。汉语不使用冠词，无须形式化呈现希伯来语定冠词。
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: 却又照亮了黑夜
  rationale: יאר 表示发光或使明亮；及物结构以“黑夜”为受事。“却又”呈现黑暗与照明之间的强烈转折，但不明确规定光照向哪一营。
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: 这一营都没有靠近那一营
  rationale: זה אל־זה 在此指前述两个营彼此没有接近。补出“营”使现代汉语指代清楚，而不改变双方对举的含义。
- source_word: כָּל־הַלָּיְלָה
  choice: 整夜
  rationale: 自然、准确地表达动作在整个夜间都未发生。
theological_decisions:
- issue: 本节单数动词的主语所指
  choice: 正文用“它”，不明确改写为上帝的使者或云柱
  alternative: 用“他”指上帝的使者，或直接补写“云柱”
  rationale: 上文同时提到上帝的使者和云柱，希伯来语的阳性单数形式本身不足以排除任何一项。正文沿用较中性的指代，避免把显现方式解释得过于确定。
- issue: 黑暗与光如何对应两个营
  choice: 保留“有云和黑暗，却又照亮黑夜”的紧凑并置
  alternative: 明确写成一边黑暗、另一边明亮
  rationale: 马所拉文本措辞简练，没有明说黑暗和光分别落在哪一边；古代译本和后世译法对此也有差异，因此不在正文中补足分配关系。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“埃及营”“以色列营”保持原文凝练的叙事风格；末句用“这一营……那一营”清楚表达两方整夜未曾接近。
