revisions:
- from: 它来到埃及营和以色列营之间[a]。当时有云和黑暗，却又照亮了黑夜；整夜这一营都没有靠近那一营。
  to: 它来到埃及人的营和以色列人的营之间[a]。那里有云和黑暗，却照亮了黑夜；整个夜晚，两个营彼此没有接近。
  rationale: 修订只改善汉语表达，并纠正脚注中无根据地把光暗分配给两边的问题。正文仍保留单数“它”的指称开放性，仍以紧凑并置呈现云、黑暗与照亮黑夜，也未在正文中判定光暗临到哪一营。
