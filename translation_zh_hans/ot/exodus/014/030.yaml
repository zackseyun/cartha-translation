  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: zh_hans
  text: 那一天，雅威从埃及的手中[a]拯救了以色列；以色列人看见埃及人的尸体在海边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“从埃及的手中”，意思是脱离埃及的权势或控制。
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: 拯救了
  rationale: ישׁע 的使役形在这里表示雅威使以色列脱离危难；“拯救”既自然，也保留神施行救援的分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见汉语音译处理，保留其作为专名的性质，不以称号代替。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 自然、准确地表达所指的特定日子。
- source_word: מִיַּד מִצְרָיִם
  choice: 从埃及的手中
  rationale: 保留希伯来语“从……手中”的权势隐喻，并以脚注说明其含义。
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: 埃及／埃及人
  rationale: 前一处指埃及这一国家势力，后一处指可见的埃及人，依上下文分别译出。
- source_word: מֵת
  choice: 尸体
  rationale: 原文形容埃及人“死了”；汉语若直译为“看见埃及人死在海边”，容易被理解为亲眼看见死亡过程，因此以“尸体”清楚表达所见的是死者，同时不改变所指。
- source_word: עַל שְׂפַת הַיָּם
  choice: 在海边
  rationale: שְׂפַת הַיָּם 字面为“海的边缘／唇边”，这里自然指海岸；“在海边”是简明、现代的表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为较贴近其学界通行重建读音的现代汉语音译，并保留专名性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“从埃及的手中”保留原文隐喻；第二分句用“尸体”避免现代汉语把“看见……死在海边”误解为目睹死亡发生。
source_grounding:
  english_pob_role: consult_only
