base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: zh_hans
  text: 摩西对百姓说：“不要害怕。要站稳，看耶和华今天要为你们施行的拯救；因为你们今天所看见的埃及人，你们必永远不再看见。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: 不要害怕
  rationale: 准确表达否定命令，采用现代汉语自然、庄重的说法。
- source_word: הִתְיַצְבוּ
  choice: 要站稳
  rationale: 该词在此要求百姓坚定站立、保持原位；“站稳”既简洁又符合危急处境中的语气。
- source_word: יְשׁוּעַת יְהוָה
  choice: 耶和华……施行的拯救
  rationale: יְשׁוּעָה 指解救、拯救；把神名译为“耶和华”，符合现代中文圣经传统，并在句法上与后面的作为关系自然衔接。
- source_word: אֲשֶׁר יַעֲשֶׂה לָכֶם הַיּוֹם
  choice: 今天要为你们施行的
  rationale: 保留“今天”“为你们”以及神主动成就拯救的意义；“施行”与“拯救”搭配庄重自然。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 虽与国名同形，但复数代词后缀 לִרְאֹתָם 及语境表明此处指追赶百姓的埃及人。
- source_word: לֹא תֹסִיפוּ לִרְאֹתָם עוֹד עַד עוֹלָם
  choice: 必永远不再看见了
  rationale: 保留“不再看见”与 עַד עוֹלָם 的持续、终局意味，同时避免生硬重复“再……永远”。
theological_decisions:
- issue: 拯救的施行者
  choice: 明确由耶和华为百姓施行拯救
  alternative: 把“拯救”处理成百姓自行争取的胜利
  rationale: 原文以 יְשׁוּעַת יְהוָה 和第三人称单数动词明确强调耶和华是行动者。
- issue: “永远不再看见”的范围
  choice: 保留原文绝对而带修辞力度的陈述，不补充解释
  alternative: 释义为“再也不会看见这些追兵”
  rationale: 原文可由叙事情境限定为眼前的埃及追兵，但措辞本身宽广；正文保留这种张力，不擅自缩窄。
translation_notes:
  register: 采用现代标准普通话，语气简洁、庄重而易懂。命令句保持紧迫感；避免古奥表达，也不加入原文没有的教派性解释。
