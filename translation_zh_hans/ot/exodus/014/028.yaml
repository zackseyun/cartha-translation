  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: zh_hans
  text: 海水回流，淹没了战车和骑兵[a]，就是法老所有追着他们进入海中的军队；连一个也没有剩下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “骑兵”也可译作“骑马的人”。
    reason: 希伯来词פָּרָשִׁים既可作为集合称谓指骑兵，也可较具体地指骑马作战的人。
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 回流
  rationale: שׁוב在这里指分开的海水返回原处；“回流”既自然，也保留了水恢复原状的动态画面。
- source_word: הַמַּיִם
  choice: 海水
  rationale: 希伯来文直译为“水”；结合本节明确的海中场景，汉语用“海水”指代清楚自然，并未增加事件内容。
- source_word: וַיְכַסּוּ
  choice: 淹没了
  rationale: כסה的基本意思是“遮盖、覆盖”；用于海水覆盖军队时，“淹没”是现代汉语中贴合语境的自然表达，同时不额外描述死亡过程。
- source_word: הָרֶכֶב
  choice: 战车
  rationale: רֶכֶב在此可集体指战车部队；“战车”简洁自然，并与后面的骑兵构成并列。
- source_word: הַפָּרָשִׁים
  choice: 骑兵
  rationale: פָּרָשִׁים可指骑马作战者或骑兵部队；正文采用现代汉语常用的“骑兵”，脚注保留“骑马的人”这一较直译的可能。
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: 法老所有……的军队
  rationale: חֵיל在本语境指军队或军事力量；“所有”保留לְכֹל的整体性，并由后置关系分句限定其范围。
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: 追着他们进入海中
  rationale: 这一分词结构描述埃及军队跟在以色列人后面进入海中；“追着……进入”兼顾追赶关系和进入海中的动作。
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: 连一个也没有剩下
  rationale: 该习语强调一个不剩；“连一个也没有剩下”在汉语中自然地传达其强烈的全称语气。
theological_decisions:
- issue: 法老军队覆灭的范围
  choice: “一个也没有剩下”指前文所限定的、追着以色列人进入海中的法老军队。
  alternative: 将此句理解为法老在各处的一切军队无一幸存。
  rationale: 希伯来文的关系分句限定了这里所说的“法老所有军队”，即进入海中追赶以色列人的那支军队；译文保留其彻底覆灭的强调，却不把范围扩大到经文未提及的所有埃及军人。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“回流”“淹没”形成清晰的叙事画面；以“就是”标明“法老所有……的军队”是对前述战车和骑兵的进一步说明，分号则保留末句总结性的强调。
