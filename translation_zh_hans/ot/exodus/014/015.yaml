id: EXO.14.15
reference: Exodus 14:15
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: zh_hans
  text: 耶和华对摩西说：“你为什么向我呼求？告诉以色列人[a]起行[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“以色列的众子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“向前走”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未机械译出连接词 וַ；汉语叙事依靠语序即可自然表达事件推进，无须另加“然后”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名的通行音译，以专名呈现，不以“主”这一称号替代。
- source_word: מַה תִּצְעַק אֵלָי
  choice: 你为什么向我呼求
  rationale: מַה 与动词连用在此表达“为什么”；צעק 指在危急中大声求告，“呼求”兼顾情境、对象和语气。
- source_word: דַּבֵּר אֶל
  choice: 告诉
  rationale: 该结构字面为“对……说”；结合后接的行动指示，译作“告诉”在现代汉语中自然，也不把语气强化为原文未明说的“命令”。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定族群称谓虽在形式上是“以色列的众子”，但在这里整体指以色列民众；“以色列人”准确、自然，字面形式收入脚注。
- source_word: וְיִסָּעוּ
  choice: 起行
  rationale: נסע 常指拔营后出发或继续行程；“起行”简洁地保留了开始移动的含义，并与当前叙事情境相符。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文读者最熟悉的专名形式，保留神名与“主”这一称号的区别；“雅威”是较接近学界重构发音的另一音译，但原文辅音本身不能确证完整古代读音。
- issue: בְּנֵי יִשְׂרָאֵל 的指称范围
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 此处是对全体百姓采取行动的指示，希伯来语惯用称谓并非刻意只限定男性；正文采用自然的群体称呼，同时用脚注保留其形式上的阳性亲属表达。
translation_notes:
  register: 采用简洁、庄重而现代的叙事语体。问句保留直接的质问语气，但不额外加入责备色彩；“呼求”“起行”略具经文庄重感，同时仍为普通现代读者所理解。
