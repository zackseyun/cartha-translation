  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: zh_hans
  text: 至于你，要举起你的杖，向海伸出手，把海劈开，使以色列的子孙[a]可以从海中走过，脚踏干地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“以色列的众子”，这里指以色列全体百姓；也可译作“以色列人”。
    reason: 说明原文的阳性复数亲属称谓及其群体所指。
lexical_decisions:
- source_word: וְאַתָּה
  choice: 至于你
  rationale: 独立代词带有强调和对比作用；承接上文百姓要前行的命令，转而突出摩西应采取的行动。
- source_word: הָרֵם אֶת־מַטְּךָ
  choice: 举起你的杖
  rationale: הָרֵם 是使役形命令式，表示抬高；מַטֶּה 在摩西叙事中自然译作“杖”。
- source_word: וּנְטֵה אֶת־יָדְךָ עַל־הַיָּם
  choice: 向海伸出手
  rationale: נטה 与“手”连用表示伸展；עַל 在动作方向语境中可表达“向着/朝向”，中文“向海伸出手”自然且不把姿势规定得过细。
- source_word: וּבְקָעֵהוּ
  choice: 把海劈开
  rationale: בקע 的核心义是裂开、劈开；宾语代词所指为海，中文明确重复“海”可避免代词含混。
- source_word: וְיָבֹאוּ
  choice: 使……可以……走过
  rationale: 在连续命令之后，该未完成式可表达预期结果；“使……可以”保留结果/目的关系，而不强化为绝对预言。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列的子孙
  rationale: 保留希伯来语“以色列之子”的亲属称谓意象，同时现代中文“子孙”可自然指以色列全体后裔，而非仅限男性。
- source_word: בְּתוֹךְ הַיָּם
  choice: 从海中走过
  rationale: בְּתוֹךְ 表示在内部或当中；结合过海语境，“从海中走过”兼顾空间意象与现代中文自然度。
- source_word: בַּיַּבָּשָׁה
  choice: 脚踏干地
  rationale: 该名词指与水域相对的干地；“脚踏干地”清楚表现他们行走时所处地面的干燥状态。
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל 的性别形式与群体所指
  choice: 以色列的子孙
  alternative: 以色列人；以色列的众子
  rationale: 原文形式直译为“以色列之子”，但在此指整个盟约群体。“子孙”保留血缘后裔意象，也避免让现代读者误以为只有男性过海；脚注交代原文字面形式。
- issue: וְיָבֹאוּ 的命令后续关系
  choice: 使……可以……走过
  alternative: 他们就要……走过；好让……走过
  rationale: 原文可理解为命令产生的结果或目的。正文采用兼容两者的中文表达，不把语法关系过度限定。
translation_notes:
  register: 采用庄重而现代的叙事命令语体。“至于你”体现对摩西的强调；“劈开”保留动作力度；句式简洁，适合普通现代读者朗读和理解。
