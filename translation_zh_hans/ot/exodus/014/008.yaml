  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: zh_hans
  text: 耶和华使埃及王法老的心刚硬[a]，法老就追赶以色列人；那时，以色列人正昂然地[b]出埃及。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使埃及王法老的心坚定”。希伯来语动词本义是“使强壮、坚固”，但在《出埃及记》中用于法老的心时，通常含有“使刚硬”的意思。
    reason: lexical_alternative
  - marker: b
    text: 直译“以高举的手”，也可译“大胆地”或“昂然地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名译法，直接对应四字神名；不以“主”替代专名。
- source_word: וַיְחַזֵּק ... אֶת לֵב
  choice: 使……的心刚硬
  rationale: חזק本义为使强壮、坚固；在出埃及记反复出现的“法老之心”语境中，译作“使心刚硬”最自然，同时以脚注保留“使心坚定”的词义可能。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老
  rationale: 自然、简洁地保留法老的王者身份。
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: 追赶
  rationale: 准确表达敌意性的追逐行动，符合军事叙事语境。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 此处指以色列民族整体；现代汉语用“以色列人”自然清楚，并保留原文前后重复的指称。
- source_word: יֹצְאִים
  choice: 正……出埃及
  rationale: 用“正”体现分词所表达的进行中状态；根据语境补出“埃及”，使中文表达完整而不改变所指。
- source_word: בְּיָד רָמָה
  choice: 昂然无惧地
  rationale: 这是字面为“用高举的手”的习语，表示公开、大胆、无所畏惧地行动；正文传达其语用含义，脚注保留具体意象。
theological_decisions:
- issue: 耶和华在法老心刚硬一事中的主动作用
  choice: 耶和华使……法老的心刚硬
  alternative: 耶和华使……法老的心坚定
  rationale: 原文直接以耶和华为使役动作的主语，译文不淡化或转移这一神学张力；同时通过脚注说明动词本身也可表达“使坚定、坚固”。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“昂然无惧地”避免生硬照译“用高举的手”，脚注则保存希伯来语的具体形象。分号呈现法老追赶与以色列人当时出行状态之间的对照。
