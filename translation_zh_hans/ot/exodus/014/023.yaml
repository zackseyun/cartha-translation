  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: zh_hans
  text: 埃及人追赶他们，跟在他们后面进入海的深处；法老所有的马[a]、他的战车和骑兵都进入了海中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“法老所有的马”，其中“马”为集合性单数，指法老的马匹。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: 埃及人追赶他们
  rationale: מִצְרַיִם在复数动词和叙事语境中指埃及人或埃及军队；רָדַף在军事追逐中自然译为“追赶”。
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: 跟着他们进入
  rationale: בוא表示进入，אַחֲרֵיהֶם表示跟在他们后面；“跟着他们进入”自然保留连续追入的动作。
- source_word: אֶל־תּוֹךְ הַיָּם
  choice: 海中
  rationale: תּוֹךְ强调海的内部；现代汉语“进入海中”既准确又简洁。
- source_word: כֹּל סוּס פַּרְעֹה
  choice: 法老所有的马
  rationale: סוּס虽为单数，在כֹּל之后作集合用法；汉语以“所有的马”自然表达。
- source_word: רִכְבּוֹ
  choice: 战车
  rationale: רֶכֶב可指战车或战车部队；此处军事装备清单中译作“战车”具体清楚，并可作集合名词。
- source_word: וּפָרָשָׁיו
  choice: 和骑兵
  rationale: פָּרָשׁ指骑马作战者或骑兵；“骑兵”符合现代汉语军事叙事，也可集合性地指整支骑兵。
