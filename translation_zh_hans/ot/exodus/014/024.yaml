  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: zh_hans
  text: 到了晨更，雅威从火与云的柱中[a]俯视埃及人的营地，使埃及人的营地陷入混乱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着火与云的柱”。
    reason: 介词בְּ在这里既可表示所在之处，也可表示行动所借助的媒介。
  - marker: b
    text: 或译：“惊慌失措”。
    reason: 希伯来语动词可指陷入骚乱、混乱或恐慌。
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: 到了晨更
  rationale: אַשְׁמֹרֶת指守更的时段；“晨更”简洁保留了黎明前后这一特定时段，“到了”自然表达叙事中的时间推进。
- source_word: וַיַּשְׁקֵף
  choice: 俯视
  rationale: שׁקף在此表示从较高处向外、向下观看；“俯视”兼顾方向感与简洁性。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名直接音译为“雅威”，保留经文中的专名，不以称号代替。
- source_word: מַחֲנֵה מִצְרַיִם
  choice: 埃及人的营地
  rationale: 该结构指埃及人的军营；此译自然，并保留原文对营地群体的指称。
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: 从火与云的柱中
  rationale: 介词בְּ可表位置或媒介；正文采用位置性理解。原文“柱”为单数，因此译作“火与云的柱”，避免改成两个柱子。
- source_word: וַיָּהָם
  choice: 使……陷入混乱
  rationale: הום的使役形式表示造成骚乱、混乱或惊慌；此译保留使役力度，又不提前表达后文才充分显出的溃败。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非称号；“雅威”更接近学界通常重构的读音，同时“耶和华”作为传统形式列为可知的另一译法。
- issue: 雅威与火云柱的关系
  choice: 从火与云的柱中俯视
  alternative: 借着火与云的柱俯视
  rationale: 介词בְּ既可作位置性理解，也可作工具或媒介性理解；正文采用“从……中”，脚注保留“借着”，不把原文的语义张力单一化。
- issue: 神对埃及营地行动的强度
  choice: 使……陷入混乱
  alternative: 使……惊慌失措
  rationale: וַיָּהָם可涵盖混乱与恐慌；正文采用较宽泛的“混乱”，避免把心理上的恐慌定为唯一含义。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“晨更”保留古代守更制度的时间色彩；“火与云的柱”刻意保留原文单数结构。句式顺畅，重复“埃及人的营地”以对应原文强调。
