base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: zh_hans
  text: 以色列人在干地上走进海中；海水在他们的右边和左边成了墙。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 走进
  rationale: בוא 在此连续叙事语境中表示进入某处；“走进”自然表达以色列人进入海中的动作。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该短语字面为“以色列的众子”，在这里是全体以色列民的族群称谓；现代汉语用“以色列人”准确、自然，也避免将代表性阳性复数误解为只指男性。
- source_word: בְתוֹךְ הַיָּם
  choice: 海中
  rationale: תּוֹךְ 表示内部或中间；“海中”简洁保留其空间意义，不额外加入“穿过”等后文层面的解释。
- source_word: בַּיַּבָּשָׁה
  choice: 从干地
  rationale: יַבָּשָׁה 指与水相对的干地，此处描写海床成为可行走的干地；介词 בְּ 可按行动所循的路径译作“从/沿着”。结合“走进海中”，“从干地”容易被误读为起点，故句法上仍忠实呈现地面状态，但可在修订时考虑“走在干地上，进入海中”。
- source_word: וְהַמַּיִם
  choice: 海水
  rationale: 希伯来语为复数形态“众水”，汉语通常以不可数的“水”表达；结合语境译作“海水”清楚且自然。
- source_word: חֹמָה
  choice: 成了墙
  rationale: חֹמָה 直接意为“墙”，原文没有明示比喻标记，因此不译作“像墙一样”；“成了墙”自然表达水对他们所形成的墙。
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: 在他们的右边和左边
  rationale: 保留原文左右两侧的对称空间描写，现代汉语表达自然。
theological_decisions:
- issue: 海水为墙的表述是否明示为比喻
  choice: 海水……成了墙
  alternative: 海水……像墙一样
  rationale: 原文使用名词性判断“是/成为墙”，没有比较词；直陈式译法保留叙事本身的力度，不对水墙的性质作额外神学或自然主义解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“以色列人”按现代汉语族群称谓处理；句式保留原文先行动、后描写两侧海水的结构。
