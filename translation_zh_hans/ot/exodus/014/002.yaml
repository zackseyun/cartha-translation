base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: zh_hans
  text: “你要吩咐以色列人[a]转回，安营在比哈希录[b]前面，在密夺和海之间。你们要安营在巴力洗分前面，正对着它[c]，靠海。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“以色列的子孙”。希伯来文直译为“以色列的儿子们”。
    reason: lexical_alternative
  - marker: b
    text: “比哈希录”、“密夺”和“巴力洗分”都是地名，因此采用音译。
    reason: cultural_note
  - marker: c
    text: 或译“面对着它”。“它”最可能指巴力洗分。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: 吩咐
  rationale: 该短语是对摩西的直接命令，要求他向百姓传达随后关于行程的指示。“吩咐”在现代汉语中自然地体现命令语气。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来文直译为“以色列的儿子们”。正文采用现代汉语中自然且涵盖全体百姓的“以色列人”，并以脚注保留原文的家族性表达。
- source_word: וְיָשֻׁבוּ וְיַחֲנוּ
  choice: 转回……安营
  rationale: 两个动词在命令之后带有指令意味。“转回”明确表示改变原来的行进方向，“安营”准确表达驻扎扎营。
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: 在比哈希录前面
  rationale: 将פִּי הַחִירֹת作为地名音译；לִפְנֵי按空间关系译为“在……前面”。
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: 也就是密夺和海之间
  rationale: בֵּין...וּבֵין界定两端的位置。“也就是”使该短语自然地说明比哈希录前面的具体位置，不增加新的语义。
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: 在巴力洗分前面
  rationale: 保留与前一个לִפְנֵי相同的空间表达，并把בַּעַל צְפֹן作为地名音译。
- source_word: נִכְחוֹ
  choice: 正对着它
  rationale: 该词表示“在其对面、面向它”，阳性单数后缀最自然地回指作为地点的巴力洗分；脚注保留指代上的说明。
- source_word: תַחֲנוּ
  choice: 你们要……安营
  rationale: 第二人称复数未完成式在此表达直接指令。明说“你们”保留原文从第三人称转向直接对百姓说话的形式变化。
- source_word: עַל הַיָּם
  choice: 靠海
  rationale: 介词עַל在此表示临近海边，而不是位于海面之上；“靠海”简洁自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“吩咐”和“安营”符合命令及旷野行程的语境；地名采用中文圣经传统中较熟悉的音译。正文保留原文后半句第二人称复数的直接指令，也保留“在……前面，正对着它”所形成的空间强调。
