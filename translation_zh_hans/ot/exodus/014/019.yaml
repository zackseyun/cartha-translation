base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: zh_hans
  text: 那时，那位一直走在以色列营前面的上帝的使者[a]移到他们后面；云柱也从他们前面移开，立在他们后面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“上帝的天使”。希伯来语原词既可指“使者”，也可指“天使”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 转移了位置／移开
  rationale: נסע本可指拔营、启程；本节强调上帝的使者和云柱由营前转到营后，因此按两个主语的自然搭配分别译为“转移了位置”和“移开”，清楚表达空间变换。
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: 上帝的使者
  rationale: מַלְאָךְ可指一般的“使者”，也可指超自然的“天使”。正文采用较贴近词义且不预断其本体身份的“使者”，并以脚注保留“天使”这一常见译法。
- source_word: הַהֹלֵךְ
  choice: 行进的
  rationale: 分词表示此前持续在营前引导、行进的动作；“行进的”在汉语中简洁自然，也不必以时态词过度明确原文未明说的时间关系。
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: 在以色列营前
  rationale: 保留לִפְנֵי的空间意义和“以色列营”的结构，现代汉语表达简洁清楚。
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: 到了他们后面
  rationale: מֵאַחֲרֵי在此表示位于后方，并非追随；“到了他们后面”自然表达位置变化的结果。
- source_word: עַמּוּד הֶעָנָן
  choice: 云柱
  rationale: 这是该具体意象在现代中文圣经语境中自然、透明且简洁的表达。
- source_word: מִפְּנֵיהֶם
  choice: 从他们前面
  rationale: 明确表达云柱原先在以色列人前方，并与后面的“在他们后面”形成空间对照。
- source_word: וַיַּעֲמֹד
  choice: 立在
  rationale: עמד基本义为“站立”；以云柱为主语时，“立在”既保留形象，也表达其停驻于固定位置。
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים的身份和性质
  choice: 译为“上帝的使者”，不说明其是受造天使、上帝的显现，还是其他特定身份。
  alternative: 译为“上帝的天使”，或采用明确的神显解释。
  rationale: 希伯来文在本节只称其为上帝的מַלְאָךְ，并未界定其本体。正文和脚注保留词义及神学张力，避免加入后来的教义结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“那时”衔接叙事；以“营前／前面／后面”的重复保留原文鲜明的空间对照。
