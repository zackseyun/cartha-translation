id: EXO.14.18
reference: Exodus 14:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: zh_hans
  text: 当我借着法老，借着他的战车和骑兵得荣耀时[b]，埃及人就会知道我是耶和华[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”代表希伯来文的神圣名字 YHWH；也常音译为“雅威”。
    reason: divine_name
  - marker: b
    text: 或译：“当我在法老、他的战车和骑兵身上彰显荣耀时。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: 就会知道
  rationale: 该形式在这里表达即将发生之事所带来的结果；“就会知道”自然地呈现埃及人因随后事件而认出耶和华。
- source_word: מִצְרַיִם
  choice: 埃及人
  rationale: 此词既可指埃及地，也可指埃及人；在本句中它是“知道”的主体，因此指埃及人。
- source_word: כִּי אֲנִי יְהוָה
  choice: 我是耶和华
  rationale: 保留本段反复出现的认知公式和上帝以圣名自我表明的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的神圣四字名传统音译，并用脚注说明其所代表的希伯来文圣名。
- source_word: בְּהִכָּבְדִי
  choice: 当我……得荣耀时
  rationale: בְּ 加不定式在这里具有时间意义；“得荣耀”保留尼法勒式可表达的受荣耀或显为尊荣之意，不擅自改成单纯主动的“彰显荣耀”。
- source_word: בְּפַרְעֹה
  choice: 借着法老
  rationale: 介词 בְּ 在此可表示上帝得荣耀所借的对象或场域；“借着”在中文中自然，并避免把意思过度限定为“被法老荣耀”。
- source_word: בְּרִכְבּוֹ
  choice: 借着他的战车
  rationale: רֶכֶב 在此为集合性军事用语；“战车”清楚传达法老的战车部队。
- source_word: וּבְפָרָשָׁיו
  choice: 和骑兵
  rationale: פָּרָשׁ 在军事语境中指骑马作战的人；“骑兵”比“骑马的人”更简洁准确。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名。正文采用中文读者最熟悉的传统音译“耶和华”，而非以“主”这一称号替代；脚注交代其希伯来文形式。
- issue: 上帝如何因法老及其军队“得荣耀”
  choice: 借着……得荣耀
  alternative: 在……身上彰显荣耀
  rationale: 原文可着重于上帝受到尊崇，也可指他的荣耀借审判显明。“得荣耀”较贴近尼法勒式，并让脚注保留另一种自然理解，避免消除神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。为使时间关系清楚，将原文后半句的时间成分前置；重复“借着”以保留希伯来文三个介词短语的强调，同时避免中文过于生硬。
