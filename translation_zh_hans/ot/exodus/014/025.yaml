revisions:
- from: 他使埃及的战车轮脱落，使他们艰难地前行。埃及说：“我要逃离以色列人，因为耶和华正在为他们攻打埃及。”[a]
  to: 他使埃及战车的轮子脱落，使战车艰难地前行。埃及[a]说：“我要从以色列人面前逃走，因为耶和华正在为他们与埃及争战。”
  rationale: 修正战车与埃及人之间的指代关系，并更完整保留“从以色列面前”及“为他们与埃及争战”的原文关系。保留“他”承接上文，也保留“埃及说：我要……”这一有意的集体人格化和单数表达。
