    text: 原文把“埃及”作为一个整体来表述，并用第一人称单数：“埃及说：‘我要逃走。’”
    reason: 说明源文本中保留的集体人格化称谓及第一人称单数，避免读者误以为正文的单数为误植。
  revision_rationale: 修正战车与埃及人之间的指代关系，并更完整保留“从以色列面前”及“为他们与埃及争战”的原文关系。保留“他”承接上文，也保留“埃及说：我要……”这一有意的集体人格化和单数表达。
