base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: zh_hans
  text: 他使埃及战车的轮子脱落，使战车艰难地前行。埃及[a]说：“我要从以色列人面前逃走，因为耶和华正在为他们与埃及争战。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文把“埃及”作为一个整体来表述，并用第一人称单数：“埃及说：‘我要逃走。’”
    reason: 说明源文本中保留的集体人格化称谓及第一人称单数，避免读者误以为正文的单数为误植。
lexical_decisions:
- source_word: וַיָּסַר
  choice: 使……脱落
  rationale: 该动词基本义为“移开、除去”；在战车轮的语境中译为“使……脱落”，既贴近原文，又符合现代汉语表达。
- source_word: בִּכְבֵדֻת
  choice: 艰难地
  rationale: 原词表达沉重、困难的状态；此处说明战车受阻后的行进方式。
- source_word: מִפְּנֵי
  choice: 逃离
  rationale: 原短语直译为“从……面前”；在逃跑语境中用“逃离”自然传达其空间和敌对含义。
- source_word: נִלְחָם לָהֶם בְּמִצְרָיִם
  choice: 正在为他们攻打埃及
  rationale: 保留“为他们争战”及“对抗埃及”的双重关系，也保留分词所表达的进行状态。
theological_decisions:
- issue: 动词主语“他”的指代
  choice: 保留“他”，承接上文的耶和华
  alternative: 直接译为“耶和华使……”
  rationale: 原文使用第三人称单数，指向上一节明确出现的耶和华；保留代词可维持原文衔接。
- issue: “埃及”作为集体人格及第一人称单数
  choice: 译为“埃及说：‘我要……’”并加注说明
  alternative: 译为“埃及人说：‘我们要……’”
  rationale: 希伯来文本有意使用单数集体称谓和第一人称单数。正文保留这一表达，避免将原文的集体人格化静默改写为复数。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“战车轮脱落”“艰难地前行”清楚呈现事件进展；对原文“埃及—我要”的单数集体表达则在正文保留，并以脚注帮助读者理解。
