  to: 他们对摩西说：“难道是因为埃及没有坟墓，你竟把我们带到旷野来死吗？[a]你把我们从埃及领出来，这到底是对我们做了什么？”
  rationale: 修订只调整责问语气和第二句的语序，避免将“领我们出埃及”误读为另一行为之前的背景；保留原文的反问、讥讽、旷野与死亡意象，不将“什么”解释性改写为“为什么”。
