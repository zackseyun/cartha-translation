  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: zh_hans
  text: 他们对摩西说：“难道是因为埃及没有坟墓，你竟把我们带到旷野来死吗？[a]你把我们从埃及领出来，这到底是对我们做了什么？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“难道是因埃及没有坟墓，你竟把我们带到旷野来死吗？”
    reason: 保留 הֲמִבְּלִי אֵין 所带讥讽意味的反问结构，并提示较形式对应的表达。
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: 他们对摩西说
  rationale: אמר在叙事中引出直接引语，译作“说”自然准确；אֶל表示说话所指向的对象。
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: 难道是因为埃及没有坟墓
  rationale: 保留原文反问和讥讽语气，同时用现代汉语自然表达“因没有坟墓”的希伯来语结构。
- source_word: לְקַחְתָּנוּ לָמוּת בַּמִּדְבָּר
  choice: 你才把我们带到旷野来死吗
  rationale: לקח译作“带”，并以“才……来死”表达上下文中的目的或结果；מִדְבָּר译作“旷野”，符合出埃及记的地理语境。
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: 究竟是对我们做了什么
  rationale: “究竟”传达责问的强烈语气，同时保留原文“什么”问句，不改写成单纯询问原因的“为什么”。
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: 你把我们从埃及领出来
  rationale: הוציא是使动意义的“使出来、领出来”；此不定式说明他们所指责的行为，汉语中前置该行为较为自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留百姓责怪摩西时的讥讽和强烈质问；不把“什么”解释性改译为“为什么”，也不淡化“来死”的尖锐措辞。
