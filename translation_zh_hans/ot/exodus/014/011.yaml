review_pass:
  verdict: revise
  source_fidelity: 首句准确保留了 הֲמִבְּלִי אֵין 所引出的讥讽性反问，以及“带我们到旷野死”的指控。第二句原稿将“把我们从埃及领出来”前置后，虽可理解，却较容易读成“领出来之后，你又对我们做了什么”；修订使该不定式更明确地说明所责难的行为本身。
  naturalness: “难道是因为……你才……”是自然且有力的现代汉语责问。第二句改为“你把我们从埃及领出来，这到底是对我们做了什么？”虽保留原文“什么／这事”的责问形式，也使“领出来”与所受的恶待直接关联。
  terminology: “摩西”“埃及”“旷野”及“领出来”均合乎现代汉语圣经叙事的常用、庄重表达。“坟墓”准确对应 קְבָרִים。
  issues:
  - severity: medium
    issue: 第二句的语序可能弱化不定式与“所做之事”的关系。
    rationale: 原文 לְהוֹצִיאָנוּ מִמִּצְרָיִם 说明他们质问的行动，即把他们带离埃及。原稿“你把我们从埃及领出来，究竟是对我们做了什么？”可能被理解为先领出来、再另行做了什么。改为“你把我们从埃及领出来，这到底是对我们做了什么？”能较清楚地将出埃及这一行动呈现为他们所控诉的“这事”。
  - severity: low
    issue: “才”不是原文所必需的逻辑成分。
    rationale: “才把我们带到……”在汉语中可用于强化反问，基本不改变含义；为更贴近原文直接的讥讽问法，修订为“竟把我们带到……”，避免额外的条件—结果色彩。
