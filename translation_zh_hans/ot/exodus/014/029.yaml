  text: וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֣וֹךְ הַ/יָּ֑ם וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: zh_hans
  text: 但以色列的子孙[a]却在海中的干地上行走；水在他们的右边和左边成了墙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以色列的子孙”也可译作“以色列人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“水对他们成了墙”；有些人理解为“水对他们像墙一样”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: 但以色列的子孙却
  rationale: בני ישראל 字面为“以色列的众子”，在这里指以色列全体民众。“以色列的子孙”保留其家族—民族表达；“但……却”体现本句与上文埃及人遭毁灭之间的对照。
- source_word: הָלְכוּ
  choice: 行走
  rationale: הלך 可指“走、行走、前行”；“行走”既保留徒步经过的叙事画面，也符合庄重而自然的现代汉语。
- source_word: בַיַּבָּשָׁה
  choice: 在干地上
  rationale: יבשה 指干地或旱地；此处描述海床成为可行走的干地。
- source_word: בְּתוֹךְ הַיָּם
  choice: 在海中
  rationale: בתוך 表示在某物中间或内部；“在海中”简洁保留其空间意义，不额外解释经过方式。
- source_word: וְהַמַּיִם
  choice: 水
  rationale: מים 在希伯来语中形态为复数，但现代汉语通常以集合名词“水”表达，较为自然。
- source_word: לָהֶם חֹמָה
  choice: 成了墙
  rationale: חומה 直接意为“墙”；希伯来文没有明示比喻词，因此正文保留断言式表达，不擅自弱化为“像墙一样”。
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: 在他们的右边和左边
  rationale: 按原文次序明确水位于他们两侧，并保留“右边—左边”的平衡结构。
theological_decisions:
- issue: בני ישראל 的族群称谓与亲属意象
  choice: 以色列的子孙
  alternative: 以色列人
  rationale: 所指是以色列全体民众，而原文同时保有源自共同祖先的亲属意象；正文保留这一意象，脚注给出自然的族群称谓。
- issue: חֹמָה 是直接陈述还是明喻
  choice: 成了墙
  alternative: 像墙一样
  rationale: 原文没有比较虚词，故正文直译为水“成了墙”；同时以脚注保存可按比喻理解的可能性，避免替读者消解文本张力。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“在海中的干地上行走”兼顾汉语自然度与原文“在干地上／在海中”的双重空间表达；句中保留右、左两侧的对称结构。
