base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: zh_hans
  text: 要远离虚假之事[a]；不可杀害无辜者和义人，因为我必不宣判恶人无罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要远离虚假的控告”或“要远离谎言”。希伯来语“话／事”含义宽泛，在此可包括假见证、诬告或弄虚作假的案件。
    reason: lexical_alternative
  - marker: b
    text: 或译“因为我必不宣判有罪者无罪”。这里的希伯来语动词用于司法语境，可表示“宣告为义”“判为无罪”或“开释”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדְּבַר שֶׁקֶר
  choice: 虚假的事
  rationale: דָּבָר 可指“话、事情、案件”，在司法语境中范围较广。“虚假的事”保留这种宽度，不把含义限定为假见证或诬告。
- source_word: תִּרְחָק
  choice: 要远离
  rationale: Qal 未完成式在此表达命令；“要远离”自然地体现主动保持距离的要求。
- source_word: וְנָקִי וְצַדִּיק
  choice: 无辜和正直的人
  rationale: נָקִי 指无罪、无辜者；צַדִּיק 在此司法语境中指正直或在理的人。分别译出两词，避免将其合并。
- source_word: אַל תַּהֲרֹג
  choice: 不可杀害
  rationale: הרג 是一般性的“杀死、杀害”，此处不宜窄化为带有特定动机的“谋杀”；“杀害”符合司法处死的语境。
- source_word: לֹא אַצְדִּיק
  choice: 我必不宣告……无罪
  rationale: צדק 的 Hiphil 在此具有法庭宣告的意义。“宣告无罪”比单说“称义”更便于现代读者理解，同时保留其司法性质。
- source_word: רָשָׁע
  choice: 恶人
  rationale: רָשָׁע 可指邪恶者或有罪者；“恶人”保留其法律与道德层面的广度，“有罪的人”作为脚注中的语境性替代。
theological_decisions:
- issue: 上帝陈述的司法含义
  choice: 因为我必不宣告恶人无罪
  alternative: 因为我必不判有罪的人无罪
  rationale: 本句以耶和华自身的司法判断为前述禁令的依据。正文明确表达法庭宣告的含义，同时不把 רָשָׁע 完全收窄为法律上的“有罪者”；脚注保存更强的司法性译法。
translation_notes:
  register: 采用现代、庄重而易懂的法律伦理用语。“要远离”保留希伯来语的形象表达；“不可杀害”避免将一般动词过度限定为“谋杀”；末句以“宣告……无罪”清楚呈现法庭语境。所有脚注标记均已置于正文。
