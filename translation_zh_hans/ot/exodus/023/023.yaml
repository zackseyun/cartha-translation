source:
  edition: WLC
  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: zh_hans
  text: 因为我的使者[a]要走在你前面，领你到亚摩利人、赫人、比利洗人、迦南人、希未人和耶布斯人那里；我要把他们除灭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的天使”。希伯来语מַלְאָךְ既可指人间的使者，也可指天上的使者；这里的语境是上帝亲自差遣、引导以色列人。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文直译为“我要除灭他／它”；这里用单数后缀集合性地指前面所列的各族。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为先前的命令与应许说明理由；现代汉语用“因为”自然保留其解释作用。
- source_word: יֵלֵךְ
  choice: 要走
  rationale: 未完成式在此表达将来的应许；“要走”清楚自然。
- source_word: מַלְאָכִי
  choice: 我的使者
  rationale: מַלְאָךְ本义为受差遣的“使者”，可指人间或天上的使者；正文采用涵盖面较广的译法，并以脚注说明“天使”这一合乎语境的可能译法。
- source_word: לְפָנֶיךָ
  choice: 在你前面
  rationale: 贴近原文，同时自然表达先行、引导之意。
- source_word: וֶהֱבִיאֲךָ
  choice: 领你到
  rationale: בוא的使役式意为使之来到，即“带领、领到”；与后面的民族名称连用时，“领你到……那里”符合现代汉语。
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: 亚摩利人、赫人、比利洗人、迦南人、希未人和耶布斯人
  rationale: 采用现代中文圣经传统中通行且易识别的族名音译；希伯来文虽用单数族称，意义上指各民族群体。
- source_word: וְהִכְחַדְתִּיו
  choice: 我要把他们除灭
  rationale: כחד的使役式表示使其消失、除灭；宾语后缀形式上为阳性单数，但集合性地回指前列各族，故正文按汉语习惯译为复数“他们”。
theological_decisions:
- issue: מַלְאָכִי所指对象及其性质
  choice: 译为“我的使者”，不进一步界定其身份
  alternative: “我的天使”；耶和华的显现；道成肉身以前的圣子
  rationale: 本节只称其为上帝的מַלְאָךְ，即受差遣者。正文不把后来的神学解释写入经文；脚注保留“天使”这一在神圣引导语境中很自然的译法。
- issue: וְהִכְחַדְתִּיו的宾语数
  choice: 按集合意义译为“他们”
  alternative: 按形式直译为“他／它”，或译作“将其除灭”
  rationale: 原文后缀虽为单数，却回指前面一连串以单数族称表达的民族集合；汉语用“他们”能准确自然地传达所指，同时由脚注注明原文形式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使者”保留原词的词义范围，脚注交代“天使”的可能译法；“除灭”较“消灭殆尽”简洁庄重，也准确表达使之不复存在的强烈含义。
