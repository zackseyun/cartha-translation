base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: zh_hans
  text: 凡我对你们说过的一切，你们都要谨慎遵守。别神的名，你们不可提起[a]；不可从你口中听见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “提起”也可译作“称念”；更具体地说，可译作“呼求”。
    reason: lexical_alternative
  - marker: b
    text: 直译：“不可在你口上被听见。”前半节用复数“你们”，这里转为单数“你”，把命令落实到群体中的每一个人。
    reason: literal_rendering
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: 凡我对你们说过的一切
  rationale: בְכֹל界定命令所涵盖的范围；“凡……一切”保留其全面性，并自然地回指此前已经颁布的条例。
- source_word: תִּשָּׁמֵרוּ
  choice: 你们都要谨慎遵守
  rationale: שׁמר的Niphal形式在此有谨慎自守、留意实行之意。“谨慎遵守”既体现警醒的语气，也符合律例语境，但不扩展具体遵守方式。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别神
  rationale: 直译为有别于以色列之上帝的其他神明；“别神”简洁、庄重，也是现代中文圣经语体中清楚易懂的表达。
- source_word: לֹא תַזְכִּירוּ
  choice: 不可提起
  rationale: זכר的Hiphil可指使人想起、提说或称念。“提起”保留较宽泛的言说含义，不在正文中将禁令限缩为宗教性的呼求。
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  choice: 也不可让人听见这名出自你口中
  rationale: 保留“被听见”的被动意象，并以自然中文表达עַל־פִּיךָ所指的口头说出；“这名”承接前句，避免中文歧义。
theological_decisions:
- issue: 禁止提说别神之名的具体范围
  choice: 正文采用较宽泛的“不可提起”，不把禁令限定为宗教仪式中的呼求。
  alternative: 译为“不可呼求别神的名”或“不可奉别神的名起誓”。
  rationale: 希伯来语זכר在此可泛指提说，也可能在盟约语境中带有称念或求告意味。经文本身没有明确限定其具体场合，因此正文保留较宽的语义，脚注提示较窄的可能解释。
- issue: “别神”是否承认其他神明真实存在
  choice: 按原文保留“别神”的称谓，不在译文中说明其本体地位。
  alternative: 加译为“所谓的神”或“假神”。
  rationale: 本节的直接重点是以色列人不可提说这些神明的名，并未在此对其存在性质作明确定义；译文不应替经文消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“谨慎遵守”使首句在中文中完整自然；后半句保留原文递进式的双重禁令。正文中的[a]、[b]均与脚注准确对应。
