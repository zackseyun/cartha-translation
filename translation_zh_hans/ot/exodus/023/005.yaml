  text: כִּֽי תִרְאֶ֞ה חֲמ֣וֹר שֹׂנַאֲ/ךָ֗ רֹבֵץ֙ תַּ֣חַת מַשָּׂא֔/וֹ וְ/חָדַלְתָּ֖ מֵ/עֲזֹ֣ב ל֑/וֹ עָזֹ֥ב תַּעֲזֹ֖ב עִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: zh_hans
  text: 如果你看见恨你的人的驴伏卧在重担之下[a]，你想不去帮助他，务必要同他一起帮忙[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“躺卧在所驮的重物之下”。原文只描述驴伏卧在重负之下，并未明确说明它是否已经被压倒。
    reason: 保留רֹבֵץ的基本姿态含义，避免把原因或结果过度确定化。
  - marker: b
    text: 这里两次译作“帮助”的希伯来语动词通常意为“离开”或“撇下”，但在本语境中指协助处理这头受重负所困的驴。末句“同他一起”的代词可指驴主，也可指驴。
    reason: 说明עזב的语境义，并保留עִמּוֹ所指的真实歧义。
lexical_decisions:
- source_word: כִּי תִרְאֶה
  choice: 如果你看见
  rationale: כִּי在这段律例中引出条件，译作“如果”；ראה直译为“看见”，保留原文的直接表达。
- source_word: חֲמוֹר שֹׂנַאֲךָ
  choice: 恨你的人的驴
  rationale: שֹׂנַאֲךָ是分词结构，直指“恨你的人”；不泛化为“仇敌”。
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: 被驮子压倒
  rationale: 原文描写驴伏卧在所驮重物之下；汉语用“被驮子压倒”自然呈现其因负载而倒卧的处境。“驮子”指牲口背负的货物。
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: 不可撇下不帮他
  rationale: 这是较难的结构。חדל表达停止或克制，עזב通常意为离开、撇下，但本语境涉及协助卸载或扶起；译文兼顾“撇下”的常见词义与上下文中的“不帮助”之意。
- source_word: עָזֹב תַּעֲזֹב
  choice: 一定要……帮忙
  rationale: 不定式绝对式与未完成式连用，加强命令语气；在本语境中עזב具有帮助、协助之义。
- source_word: עִמּוֹ
  choice: 和他一起
  rationale: 阳性单数后缀可指驴主，也可指驴；正文按人际律例的脉络理解为驴主，并以脚注保留另一种可能。
theological_decisions:
- issue: עִמּוֹ所指为何
  choice: 和他一起，即与恨你的驴主一起
  alternative: 和它一起，即帮助那头驴处理重驮
  rationale: 阳性单数代词在语法上既可回指驴主，也可回指阳性名词“驴”。正文采用更突出帮助对方这一社会伦理层面的读法，但脚注明确保留真实歧义。
- issue: עזב在本节中的语义张力
  choice: 正文以“撇下不帮／帮忙”呈现语境义
  alternative: 按常用义直译为“离开、撇下”或在末句译作“卸下”
  rationale: 该词通常指离开或撇下，但在此重复命令中传统上按帮助、协助理解。译文不把整句简化为单一动作，以脚注说明词义问题。
translation_notes:
  register: 采用现代、庄重而易懂的律例语体。“驮子”为普通汉语中牲口背负的货物；分号凸显禁止袖手旁观与积极协助之间的对照。所有脚注标记均已置于正文。
