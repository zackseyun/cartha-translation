  text: לֹ֥א תַטֶּ֛ה מִשְׁפַּ֥ט אֶבְיֹנְ/ךָ֖ בְּ/רִיבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: zh_hans
  text: 不可在穷人的诉讼中屈枉他的权利。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“不可在穷人的案件中歪曲他应得的公正。”
    reason: 保留 מִשְׁפָּט 可指司法权利或公正裁决，以及 רִיב 可译作案件、争讼的词义空间。
lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: 以现代汉语法律、诫命语体表达否定禁令，简洁而庄重。
- source_word: תַטֶּה
  choice: 歪曲
  rationale: 该词为 נטה 的使役式，在司法语境中指使审判偏离正道；“歪曲”既保留“使之弯曲、偏离”的意象，又自然表达枉法之意。
- source_word: מִשְׁפַּט
  choice: 他应得的公正
  rationale: 这里可指公正的裁决、司法权利或案件判决；译作“应得的公正”明确它是穷人在诉讼中理当获得的公平对待，同时不把词义缩限为单一判决。
- source_word: אֶבְיֹנְךָ
  choice: 穷人
  rationale: אֶבְיוֹן 指贫穷、困乏的人。中文“穷人”自然涵盖个体而不必添加原文未必着重的性别；希伯来语第二人称单数领属后缀若直译为“你的穷人”较生硬，且容易误解为所有关系，故按现代汉语习惯省略。
- source_word: בְּרִיבוֹ
  choice: 在……的诉讼中
  rationale: רִיב 在此法律语境可指争讼、案件或诉讼；“诉讼”突出经文的司法场景，并以“他的”所表达的关系自然整合进句式。
theological_decisions:
- issue: 本节禁止的是偏袒穷人，还是亏负穷人
  choice: 禁止在司法争讼中歪曲穷人应得的公正
  alternative: 概括译为“不可拒绝给穷人公正”，或误读为禁止偏袒穷人
  rationale: 希伯来文以 מִשְׁפַּט 为 תַטֶּה 的宾语，并以 בְּרִיבוֹ 限定司法争讼场景，重点是不可使穷人的正当司法权益偏离；译文保留这一具体法律焦点，不扩展成泛泛的社会口号，也不引入本节没有明说的“偏袒穷人”。
translation_notes:
  register: 采用现代、庄重而易懂的法律诫命语体。“不可”呼应约书中的禁令表达；主句保持简洁。脚注标记已在正文中出现。
