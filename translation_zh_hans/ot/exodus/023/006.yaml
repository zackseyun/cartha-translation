review_pass:
  verdict: revise
  source_fidelity: 译文正确把禁令置于司法争讼语境，并表达不可剥夺贫困者正当司法权益。将“מִשְׁפָּט”译为“权利”在此处能自然传达其“合法权利／应得裁断”的法律含义；“他的”保留了原文与该穷人相连的后缀关系。
  naturalness: “歪曲他应得的公正”虽可理解，但“歪曲公正”的搭配不如法律汉语中“屈枉……的权利”自然、明确。修订后语句简洁庄重，适合本段约法体裁。
  terminology: “诉讼”“权利”“屈枉”均保持司法语域。“穷人”自然对应 אֶבְיוֹן，且不在汉语中无必要地添加性别或生硬直译“你的”。
  issues:
