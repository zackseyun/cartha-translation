base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: zh_hans
  text: 我要把我所降下的惊恐[a]遣在你前面，使你所进入其中的所有民众全都陷入混乱[b]；我要使你所有的仇敌向你转背逃跑[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我的恐惧”；也可译“我的惊骇”或“我的威慑”。
    reason: lexical_alternative
  - marker: b
    text: 也可译“使……溃乱”或“使……骚动起来”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“把你所有的仇敌给你作后颈（或背面）”，意思是使他们转身逃跑。
    reason: hebrew_idiom
lexical_decisions:
- source_word: אֵימָתִי
  choice: 我所带来的恐惧
  rationale: אֵימָה表示强烈的恐惧、惊骇或令人胆寒的威势。这样译既保留第一人称所属关系，也避免现代汉语“我的恐惧”被误解为上帝自己感到害怕。
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: 先送到你前面
  rationale: לְפָנֶיךָ在这里表示走在以色列人前面、预先到达；“先送到你前面”自然保留了差遣和先行的方向感。
- source_word: וְהַמֹּתִי
  choice: 使……陷入混乱
  rationale: המם在争战语境中指使人惊慌、混乱或骚动。“陷入混乱”保留使役含义，又不提前把结果限定为彻底溃败。
- source_word: כָּל הָעָם אֲשֶׁר תָּבֹא בָהֶם
  choice: 你所到的各族民众全都
  rationale: 原文以单数集合名词עָם指将遇到的各地民众，介词ב表达来到他们中间。“各族民众”在现代汉语中比逐字的“你进入他们中的所有人民”更自然。
- source_word: וְנָתַתִּי אֶת כָּל אֹיְבֶיךָ אֵלֶיךָ עֹרֶף
  choice: 我要使你所有的仇敌在你面前转身逃跑
  rationale: 这是以“后颈、背面”描写敌人转身败逃的希伯来语表达；译文保留转身的画面，并明示该惯用语所表达的逃跑。
theological_decisions:
- issue: 上帝在敌军惊慌和败退中的直接作为
  choice: 连续使用“我要……”“使……”明确以上帝为行动主体
  alternative: 采用较间接的措辞，把惊慌和败退仅描述为自然发生的结果
  rationale: 原文三个第一人称动词都明确以上帝为主语；译文不弱化上帝在拯救与争战中的主动作用，也不对这种张力另作辩解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“我所带来的恐惧”避免“我的恐惧”在汉语中产生主体害怕的误读；“转身逃跑”保留原文后颈或背面的战争图像。
