  source_fidelity: 草稿准确保留了耶和华第一人称的直接行动、使人惊乱，以及仇敌转身败逃的基本意义。但“我所带来的恐惧”把原文单纯的第一人称所属形式“我的恐惧/惊骇”扩展为“我带来的”，且“各族”将集合名词“民众/人民”具体化为族群。修订以“我所降下的惊恐”在汉语中明确该惊恐出于上帝，同时避免把“人民”限定为“族”。
  naturalness: 修订后的“遣在你前面”“你所进入其中的所有民众”“向你转背逃跑”庄重而通顺，适合经文体；“向你转背”也较清楚地保留了原文“后颈/背”的意象。
  terminology: “惊恐”对应אֵימָה的恐惧、惊骇；“使……陷入混乱”对应使役动词הָמַם，未过度译作彻底击溃；“向你转背逃跑”保留עֹרֶף的惯用语画面及其败逃含义。
