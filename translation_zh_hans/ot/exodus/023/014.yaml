lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: 三次
  rationale: 该短语字面涉及“三只脚／三足”，但在这里是希伯来语习语，表示一年中三次前往守节的时机；正文用自然的汉语“三次”，并以脚注保留其字面形式和朝圣节期含义。
- source_word: תָּחֹג
  choice: 守节
  rationale: 动词 חגג 指庆祝节期、守节；“守节”简洁自然，也保留律法语境中的礼仪和节庆意味。
- source_word: לִי
  choice: 向我
  rationale: 介词 ל 表明这些节期是以耶和华为对象而举行；“向我守节”既贴近原文，也符合现代汉语表达。
- source_word: בַּשָּׁנָה
  choice: 一年之中
  rationale: 直译为“在这一年中／在一年中”；与“三次”搭配时，“一年之中”自然地表达每年规定的次数，而不过度改写为“每年”。
