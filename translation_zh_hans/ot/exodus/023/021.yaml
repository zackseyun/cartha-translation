base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: zh_hans
  text: 你要在他面前谨慎，听从他的声音；不可悖逆他，因为他不会赦免你们的过犯，因为我的名在他里面。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的名在他内”，也有人按其含义译作“他承载我的名”。这句话表明他具有上帝所授的权威，但本节没有明确界定这位使者的确切性质。
    reason: 保留בְּקִרְבּוֹ的译法选择，并避免把含蓄的神学表达解释得过满。
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: 你要在他面前谨慎
  rationale: הִשָּׁמֶר是שׁמר的尼法勒命令式，在这里发出郑重警告，要求人警醒自守；מִפָּנָיו直译涉及“在他面前／面对他”。此译既自然，也保留关系性和警告语气。
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: 听从他的声音
  rationale: שׁמע与בְּקוֹל连用兼有聆听和顺从之意。“听从他的声音”保留“声音”这一原文意象，同时自然传达遵从的含义。
- source_word: אַל תַּמֵּר בּוֹ
  choice: 不可悖逆他
  rationale: מרה表示反叛、抗命或公然违抗。“悖逆”符合盟约警告的郑重语域，又不把意思弱化为一般性的冒犯。
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: 他不会赦免你们的过犯
  rationale: נשא与罪过类名词连用时可表达担当、除去或赦免；这里按上下文译作“赦免”。פשע强调有意的越界或叛逆，“过犯”保留其法律与盟约色彩，并避免与前句“悖逆”机械重复。
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: 我的名在他里面
  rationale: בְּקִרְבּוֹ意为“在他里面／在他中间”。直译保留这句话强烈而含蓄的神学分量，不擅自界定“名”与这位使者之间关系的具体性质。
theological_decisions:
- issue: 使者的性质以及“我的名在他里面”的含义
  choice: 正文贴近原文，保留“我的名在他里面”，不界定这位使者的本体身份。
  alternative: 可理解为这位使者蒙上帝完全授权、承载上帝的名；也可理解为他是耶和华临在的一种显现。
  rationale: 本节明确赋予这位使者与上帝之名相关的重大权威，却没有直接说明其确切性质。译文因此保留原文的神学张力，不引入特定宗派结论。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“谨慎”“听从”“悖逆”“赦免”“过犯”形成郑重的盟约警告语气；句法尽量贴近希伯来文的递进结构，同时保持中文流畅。
