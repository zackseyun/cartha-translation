base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: zh_hans
  text: 不可随从众人去行恶；不可在诉讼中作证，随从众人而歪曲公正。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“也不可在争讼中回答，随从众人使（公正或判决）偏斜。”原文末尾未明说“使之偏斜”的宾语。
    reason: תַעֲנֶה可较字面译为“回答、陈述”；末尾的לְהַטֹּת在司法语境中可指使公正或判决偏斜。此译法保留原文简练的表达及其隐含宾语。
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: 随从众人
  rationale: היה אַחֲרֵי在这里表达跟随、依从之意；רַבִּים可指众人或多数人。“随从众人”既贴近原文，也保留因群体压力而作恶的含义，而不把它过度限定为正式表决中的“多数”。
- source_word: לְרָעֹת
  choice: 去行恶
  rationale: 介词לְ与此形式在句中表达趋向或目的；“行恶”保留原文较强的道德语气，“去”使现代汉语表达自然。
- source_word: תַעֲנֶה
  choice: 作证
  rationale: ענה本可指回答或陈述，但与诉讼语境中的רִיב连用时具有司法作证、出言陈述的意味。“作证”清楚呈现法庭背景；脚注保留“作出答复”这一较字面的可能译法。
- source_word: עַל רִיב
  choice: 在诉讼中
  rationale: רִיב可指争端、案件或诉讼。此处涉及作证和歪曲公正，司法语境明显，因此译作“在诉讼中”。
- source_word: לִנְטֹת
  choice: 偏离正道
  rationale: נטה基本义为倾斜、转向或偏离；在司法语境中表示离开正直的判断。“偏离正道”保留其方向性隐喻，同时在中文中明白自然。
- source_word: אַחֲרֵי רַבִּים
  choice: 随从众人
  rationale: 重复“随从众人”，对应希伯来文的重复，突出不可因众人的倾向而改变正直判断。
- source_word: לְהַטֹּת
  choice: 枉屈公正
  rationale: נטה的使役式在司法语境中指使判断偏斜、歪曲公正。原文未明说宾语，中文补出“公正”，使法律含义清楚，又不超出上下文。
theological_decisions:
- issue: 末句隐含的司法对象
  choice: 以致枉屈公正
  alternative: 使判决偏斜／歪曲判决
  rationale: 希伯来文末尾只用使役不定式“使之偏斜”，表达简练，并未明说被偏斜的对象；诉讼和作证的上下文表明所指是司法公正或判决。正文补出“公正”，同时由脚注保留“判决”这一具体理解，不引入额外教义。
- issue: רַבִּים所指的范围
  choice: 众人
  alternative: 多数人
  rationale: 该词既可侧重人数众多，也可在语境中指多数一方。“众人”保留这种范围上的张力，不把经文限制为正式的多数决定。
translation_notes:
  register: 采用庄重而通行的现代标准汉语。“诉讼”“作证”“枉屈公正”明确司法场景；两次使用“随从众人”对应原文重复，并避免把רַבִּים过度限定为制度意义上的“多数派”。
