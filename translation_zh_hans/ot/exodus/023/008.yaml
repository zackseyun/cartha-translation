  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: zh_hans
  text: 不可收受贿赂，因为贿赂能使眼明的人变瞎，并歪曲义人的话。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “义人的话”也可按司法语境理解为“占理之人的陈述”或“占理之人的案件”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: 贿赂
  rationale: 指为影响裁断而给予的腐化性财物；“贿赂”是现代汉语中最明确、自然的法律和道德用语。
- source_word: לֹא תִקָּח
  choice: 不可收受
  rationale: 未完成式第二人称单数在律法语境中表达禁令；“不可收受”既庄重又符合现代汉语对贿赂的常见搭配。
- source_word: כִּי
  choice: 因为
  rationale: 引出这项禁令的理由，清楚保留希伯来文的因果关系。
- source_word: יְעַוֵּר
  choice: 使……变瞎
  rationale: 使役含义明确，并保留原文有关视力的鲜明比喻。
- source_word: פִּקְחִים
  choice: 眼明的人
  rationale: 该词本指眼睛睁开、能看见的人，在此暗含判断明达；“眼明的人”保留视觉意象，而不把意义仅限于“有辨识力的人”。
- source_word: וִיסַלֵּף
  choice: 歪曲
  rationale: 表达弄弯、扭曲或败坏之意；“歪曲”自然地适用于言辞、陈述或案件。
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: דבר 的复数附属形可指话语、陈述或事情；译作“话”最贴近字面，也容许司法语境中的陈述或案情含义。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 既可指品行公义的人，也可指诉讼中占理的人；“义人”保留这种伦理与司法上的双重可能。
theological_decisions:
- issue: “义人”在本节中的所指
  choice: 保留“义人”，不限定为道德上的义者或诉讼中占理者
  alternative: 占理之人的陈述／案件
  rationale: 司法语境支持“占理者”的理解，但希伯来词本身也具有道德含义；正文不应消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法体。“不可”保留禁令语气；“收受贿赂”符合现代标准汉语。正文以“眼明的人变瞎”保留原文视觉意象，并用脚注说明司法语境中的词义空间。
