base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: zh_hans
  text: 他们不可住在你的地内，免得他们使你得罪我；因为你若事奉他们的神[a]，这就会成为你的网罗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为你会事奉他们的神。”原文的连接词可作解释性的“因为”，本句也可理解为预料会发生的结果，而不只是一个条件。
    reason: alternative_reading
  - marker: b
    text: “网罗”译自希伯来语 מוֹקֵשׁ，原指捕捉猎物的圈套，这里比喻使人陷入背道或败亡的事物。
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: 住
  rationale: ישׁב在此指在境内居住、定居；“住”自然简明，又不额外限定为永久定居。
- source_word: בְּאַרְצְךָ
  choice: 在你的地上
  rationale: אֶרֶץ在这里指赐给以色列的地域；“你的地”保留本段的土地语境。
- source_word: פֶּן
  choice: 免得
  rationale: פֶּן引出所要防止的不良后果；“免得”准确保留警戒和预防的语气。
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: 他们使你得罪我
  rationale: חטא的使役式表达“使……犯罪”；לִי在此表示罪所针对的对象，译作“得罪我”符合现代汉语。
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: 你若事奉他们的神
  rationale: עבד以神明为宾语时兼有服事、敬拜和效忠之意；“事奉”保留其盟约性用语。“若”把该句表达为警告中的条件，同时以脚注保留כִּי的另一种理解。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的神
  rationale: 直译复数神明；汉语中“神”本身不以词形标复数，所属语“他们的”已使意思清楚。
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: 这就会成为你的网罗
  rationale: מוֹקֵשׁ本指捕捉猎物的网罗或圈套，并在此比喻导致背道和败亡之物；“这”保留所指范围的一定开放性。
theological_decisions:
- issue: 所警告之罪的性质
  choice: 将警告明确关联于事奉别神，即对上帝的不忠
  alternative: 理解为外族居民带来的一般道德或文化败坏
  rationale: 紧接着的“事奉他们的神”具体说明了“得罪我”的核心内容；译文不把本节泛化为族群隔离的命令。
- issue: כִּי תַעֲבֹד的逻辑关系
  choice: 按条件理解为“因为你若事奉”
  alternative: 按预期结果理解为“因为你会事奉”
  rationale: כִּי可引出解释，而未完成式可在警告语境中表达可能或预期的结果。正文采用自然的汉语条件句，脚注保留另一种可行读法，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“事奉”保留宗教效忠的语义；“网罗”保留原文的捕猎隐喻。标点把禁令、理由和结果清楚连接起来。
