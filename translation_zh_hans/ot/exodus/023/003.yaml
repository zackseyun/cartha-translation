  text: וְ/דָ֕ל לֹ֥א תֶהְדַּ֖ר בְּ/רִיבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/003.yaml
  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: zh_hans
  text: 你也不可在穷人的案件中偏袒他[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偏袒”或译“抬举”。希伯来语动词较直译可作“尊重、抬举”，但在这里的司法语境中，是指给予优待或偏袒。
    reason: 词义替代
lexical_decisions:
- source_word: דָל
  choice: 穷人
  rationale: 该词指经济贫困、社会地位低下或弱势的人；此处用单数“穷人”，既保留具体个体，也符合现代汉语表达。
- source_word: תֶהְדַּר
  choice: 偏袒
  rationale: 该动词本可表示“尊重、抬举”，但在司法语境中指给予优待或徇情；“偏袒”准确传达不公正地优待一方的含义。
- source_word: בְּרִיבוֹ
  choice: 在……的案件中
  rationale: רִיב可指争讼、纠纷或诉讼案件；上下文属于司法条例，因此“案件”自然且明确，后缀所指的“他”也在译文中体现。
- source_word: וְ
  choice: 也
  rationale: 连接前后相邻的司法禁令；汉语用“也”自然表达承接关系，不额外强化转折。
- source_word: לֹא
  choice: 不可
  rationale: 未完成式与否定词在律法条文中构成禁令；“不可”符合庄重而易懂的现代汉语法规语体。
theological_decisions:
- issue: 关怀穷人与司法偏袒之间的张力
  choice: 本节禁止在审理穷人的案件时偏袒他。
  alternative: 将本节理解为一般性地吩咐人尊重穷人。
  rationale: “在他的案件中”及上下文的司法条例表明，这里要求公正审判，而不是否定对穷人的怜悯。译文保留经文本身的张力，不把更广泛的社会伦理主张强加于本节。
translation_notes:
  register: 采用现代、庄重而易懂的法律禁令语体。“穷人”比“贫穷的男人”更符合自然汉语；“案件”明确体现上下文的司法场景。脚注标记[a]已在正文中对应出现。
