base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: zh_hans
  text: 我要派黄蜂走在你前面[a]；它要把希未人、迦南人和赫人从你面前赶出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可能是比喻，指上帝所造成的恐慌，或上帝施加的其他压力；希伯来词通常意为“黄蜂”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: 我要派
  rationale: 连词加第一人称单数完成式在这一应许语境中表达将来的行动；“我要派”自然、明确，并保留上帝主动施行的含义。
- source_word: הַצִּרְעָה
  choice: 黄蜂
  rationale: 该词通常指黄蜂一类会蜇人的昆虫。希伯来文使用带定冠词的单数形式，可作集合性或代表性单数理解；正文按通常词义直译，不把可能的比喻解释直接写入正文。
- source_word: לְפָנֶיךָ
  choice: 在你前面
  rationale: 原义为“在你面前”，此处包含先行在前、为以色列开路的空间意义；该译法简洁自然，同时保留原文意象。
- source_word: וְגֵרְשָׁה
  choice: 把……赶出去
  rationale: גרשׁ意为“赶走、驱逐”。原文阴性单数动词与“黄蜂”一致；汉语无需另加代词即可清楚承接前面的主语。
- source_word: הַחִוִּי
  choice: 希未人
  rationale: 采用现代中文圣经中通行的族名音译。
- source_word: הַכְּנַעֲנִי
  choice: 迦南人
  rationale: 采用现代中文中通行的族名译法。
- source_word: הַחִתִּי
  choice: 赫人
  rationale: 采用现代中文圣经中通行的族名译法。
- source_word: מִלְּפָנֶיךָ
  choice: 从你面前
  rationale: 与本节前半句的空间表达相呼应，指从以色列人前方或所在之处被驱离；保留原文常见的“从……面前”表达。
theological_decisions:
- issue: הַצִּרְעָה应按字面还是按比喻解释
  choice: 正文译作“黄蜂”
  alternative: 译作“恐慌”，或理解为上帝使敌人惊慌、受灾或遭受其他压力的比喻
  rationale: 该希伯来词最通常的词义是黄蜂或会蜇人的昆虫。为避免把并非原文明确要求的解释写进正文，正文保留字面意义，并在脚注中说明可能的比喻性理解。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“我要派”体现应许语境；“在你前面／从你面前”保留原文前后呼应。族名采用简体中文圣经传统中通行的形式。
