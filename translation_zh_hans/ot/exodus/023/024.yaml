  text: לֹֽא תִשְׁתַּחֲוֶ֤ה לֵ/אלֹֽהֵי/הֶם֙ וְ/לֹ֣א תָֽעָבְדֵ֔/ם וְ/לֹ֥א תַעֲשֶׂ֖ה כְּ/מַֽעֲשֵׂי/הֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔/ם וְ/שַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: zh_hans
  text: 不可向他们的神下拜，也不可侍奉它们，不可照他们所行的去做；反倒要把它们彻底拆毁，把他们的石柱彻底打碎[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“祭柱”或“立石”。希伯来语指与敬拜活动有关的竖立石碑或柱石。
    reason: 说明 מַצֵּבֹת 的词义范围及其祭祀语境；标记置于对应的“石柱”之后。
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: 下拜
  rationale: 该动词具体指俯伏、躬身以示敬意；“下拜”保留可见动作，同时在本语境中自然传达敬拜含义。
- source_word: לֵאלֹהֵיהֶם
  choice: 向他们的神
  rationale: 介词 לֵ 与“下拜”搭配，现代汉语自然表达为“向……下拜”；“他们的神”指列国的神明。
- source_word: תָעָבְדֵם
  choice: 侍奉它们
  rationale: עבד 在此包含宗教礼仪上的服侍；“侍奉”既贴近词义，也不与前面的“下拜”合并。代词用“它们”表明所指并非真神。
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: 照他们所行的去做
  rationale: 对应“按他们的行为而行”，保留原文较宽的措辞；上下文表明尤其涉及其宗教习俗。
- source_word: כִּי
  choice: 反倒
  rationale: 这里引出与前三项禁令相反的正面命令；“反倒”自然表达强烈转折。
- source_word: הָרֵס תְּהָרְסֵם
  choice: 要把它们彻底拆毁
  rationale: 不定式绝对形与限定动词连用构成加强语气；“彻底”传达这一强调。“它们”保留原文宾语指代的张力，而“拆毁”显示实际对象是相关的有形崇拜物。
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: 把……彻底打碎
  rationale: 同样以重复句式加强命令；“彻底打碎”适合石质崇拜物，也清楚传达强调语气。
- source_word: מַצֵּבֹתֵיהֶם
  choice: 他们的石柱
  rationale: מַצֵּבָה 指竖立的石头或柱石，在本节是与崇拜有关的石质纪念物。“石柱”自然具体，祭祀性质由语境与脚注说明。
theological_decisions:
- issue: 对外邦神明所禁止之行为的性质
  choice: 分别译作“下拜”和“侍奉”，保留外在敬礼与持续宗教服侍两个层面。
  alternative: 将两个动词合并或都译为“敬拜”。
  rationale: 希伯来文使用两个不同动词；分别表达可保留其修辞力度，显示禁令涵盖敬礼与效忠，而不把两者压缩成同一概念。
- issue: 拆毁命令的宾语所指
  choice: 正文以“它们”承接原文代词，随后由“石柱”明确落到有形崇拜物上。
  alternative: 直接补译为“偶像”或把宾语理解为神明本身。
  rationale: 原文宾语后缀可在修辞上回指前述神明，却在实际行动上指向与其相关的崇拜设施；保留代词可避免过度释义，也不暗示神明本身是可被物理拆毁的实体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“不可……反倒要……”保留禁令转入正面命令的结构；两处“彻底”对应希伯来文重复形式的加强语气。
