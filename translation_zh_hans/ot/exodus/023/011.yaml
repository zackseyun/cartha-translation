  text: וְ/הַ/שְּׁבִיעִ֞ת תִּשְׁמְטֶ֣/נָּה וּ/נְטַשְׁתָּ֗/הּ וְ/אָֽכְלוּ֙ אֶבְיֹנֵ֣י עַמֶּ֔/ךָ וְ/יִתְרָ֕/ם תֹּאכַ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה כֵּֽן תַּעֲשֶׂ֥ה לְ/כַרְמְ/ךָ֖ לְ/זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: zh_hans
  text: 但第七年，你要让土地休耕，任其闲置[a]，好让你百姓中的穷人吃其中的出产；他们所剩下的，田野的野兽可以吃[b]。你的葡萄园和橄榄园也要这样处理。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“你要把地放开，撇下不管”。原文两个动词强调在第七年停止通常的耕作，任土地闲置。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“田野的兽”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: 但第七年
  rationale: 结合上一节六年耕种的规定，וְ在此带出对比；汉语用“但”自然呈现转折，省略原文按语境承接的“年”则会不够清楚，因此补出“年”。
- source_word: תִּשְׁמְטֶנָּה
  choice: 你要让地歇息
  rationale: שׁמט在这里指第七年停止耕作、放开土地；宾语阴性后缀回指上一节的土地。译为“让地歇息”清楚表达农业语境，又不把词义收窄为某一种具体耕作措施。
- source_word: וּנְטַשְׁתָּהּ
  choice: 不去耕作
  rationale: נטשׁ有离开、撇下之意；此处与前一动词并列，要求停止通常的土地经营。译为“不去耕作”符合现代汉语，也避免“抛弃”可能暗示永久弃置。
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: 你百姓中的穷人
  rationale: אֶבְיוֹן指贫穷、缺乏的人；“你百姓中的穷人”保留所属关系，并自然表达律法对贫困者的关顾。
- source_word: וְיִתְרָם
  choice: 他们吃剩的
  rationale: יתר表示余下之物，三复阳后缀指前述穷人。语境是他们取食之后所留下的出产；补出“吃”使中文关系明确，但不改变所指。
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: 田野的野兽可以吃
  rationale: חַיַּת הַשָּׂדֶה直译为“田野的兽”，在此泛指野生动物。“可以吃”体现这一规定所容许并产生的结果，同时保留原文单数集合表达的整体意义。
- source_word: כֵּן תַּעֲשֶׂה
  choice: 也要这样处理
  rationale: 该短语把同一规定应用于随后列出的种植园。“这样处理”在中文法律指令中自然，并保留命令语气。
- source_word: לְכַרְמְךָ
  choice: 你的葡萄园
  rationale: כֶּרֶם通常指葡萄园；介词在“也要这样处理”之后自然译入宾语关系。
- source_word: לְזֵיתֶךָ
  choice: 橄榄园
  rationale: זַיִת可指橄榄树或集合性的橄榄栽植地；与“葡萄园”平行时，“橄榄园”最自然地呈现农业经营单位，同时脚注提示字面形式。
theological_decisions:
- issue: 安息年土地命令的性质
  choice: 译为停止耕作并让土地歇息
  alternative: 译为永久“抛弃”土地
  rationale: 上下文限定在第七年，两个动词要求暂停正常耕作、把出产留给穷人和野兽，并非永久放弃所有权；译文不额外引入土地所有权或宗派性的安息年解释。
- issue: 野兽取食的语气
  choice: 译为“可以吃”
  alternative: 译为绝对预言式的“必吃”
  rationale: 未完成式在律法语境中可表达规定所允许或预期的结果；“可以吃”与前面穷人获准取食相称，又不排除其结果意味。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“让地歇息”承接农业安息语境，“不去耕作”避免“抛弃”在中文中产生永久弃置的误解；“地里的出产”为语境补足，说明穷人所吃的对象。所有脚注标记均已置于正文对应位置。
