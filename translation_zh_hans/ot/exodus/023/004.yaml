  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: zh_hans
  text: 如果你遇见仇敌的牛或驴走失，务要把它归还给他。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“正在游荡”。
    reason: תֹּעֶה可指牲畜走失，也可侧重其偏离道路、四处游荡的状态。
lexical_decisions:
- source_word: כִּי
  choice: 如果
  rationale: 在此律法条文中引出条件句；“如果”自然地表达个案律的条件结构，同时不排除事件实际发生时的含义。
- source_word: תִפְגַּע
  choice: 遇见
  rationale: פגע在此指偶然碰见、遇到；“遇见”简洁自然，并保留非刻意寻找的意味。
- source_word: שׁוֹר
  choice: 牛
  rationale: שׁוֹר泛指牛类牲畜；现代汉语中“牛”清楚自然，比限定为“公牛”或役用“阉牛”更少过度解释。
- source_word: אֹיִבְךָ
  choice: 仇敌的
  rationale: אֹיֵב明确指敌对者；保留“仇敌”所带来的伦理张力，不弱化为“邻舍”等中性关系。
- source_word: חֲמֹרוֹ
  choice: 驴
  rationale: חֲמוֹר是普通的驴；所属关系与前面的“仇敌的”一并自然表达。
- source_word: תֹּעֶה
  choice: 走失了
  rationale: תעה的分词描写牲畜偏离正路、游走离群；“走失了”符合现代汉语习惯，脚注保留“游荡”的词义可能。
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: 务要把它牵回去还给他
  rationale: 不定式绝对形与限定动词连用，加强命令语气；“务要”体现强调，“牵回去还给”也符合归还牲畜的具体情境。
- source_word: לוֹ
  choice: 给他
  rationale: 代词直接回指前述仇敌；不改写为“给主人”，以免加入原文未明说的解释。
theological_decisions:
- issue: 对待仇敌的伦理要求
  choice: 保留“仇敌”，并明确要求将其走失的牲畜归还给他
  alternative: 弱化为“邻舍”或“恨你的人”
  rationale: 希伯来文明确使用אֹיֵב“仇敌”。直译保留了即使面对敌对者仍须秉公并施以实际善意的张力。
translation_notes:
  register: 采用现代、庄重而通俗的律法语体。“务要”保留原文加强命令的力度；“牵回去还给他”比抽象的“归还”更贴合牲畜情境。
