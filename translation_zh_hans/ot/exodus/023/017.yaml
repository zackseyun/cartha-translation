  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶל פְּנֵ֖י הָ/אָדֹ֥ן יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: zh_hans
  text: 一年三次，你所有的男丁都要朝见主耶和华。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: 一年三次
  rationale: 按希伯来语指每年周期中的三次；“一年三次”在现代汉语中简洁自然，也完整保留次数和年度范围。
- source_word: יֵרָאֶה
  choice: 要朝见
  rationale: 该词是 ראה 的 Niphal 形式，字面可理解为“显现、被看见”，在到君王或上帝面前的语境中惯用来表示“朝见”。“朝见”既传达进入主面前的含义，也符合庄重语体。
- source_word: כָּל זְכוּרְךָ
  choice: 你所有的男丁
  rationale: זָכוּר 是指男性的集合性用语，后缀为第二人称阳性单数。“你所有的男丁”保留了原文的男性限定和对以色列整体作单数称呼的形式。
- source_word: אֶל פְּנֵי
  choice: 朝见
  rationale: 该短语字面涉及来到某人“面前”；与 יֵרָאֶה 合译为“朝见”，比“显现在……面前”更符合现代汉语，同时不增加原文没有的行动内容。
- source_word: הָאָדֹן
  choice: 主
  rationale: אָדוֹן 在此是上帝的尊称；“主”是自然、庄重且准确的汉语对应词。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 这是四字神名 YHWH，而非普通称号；采用汉语读者熟悉的专名“耶和华”，并与前面的称号“主”分别表达。
theological_decisions:
- issue: הָאָדֹן יְהוָה 中神圣称号与神名的并列
  choice: 主耶和华
  alternative: 主上帝；主雅威
  rationale: 原文同时包含称号 הָאָדֹן 和专名 יְהוָה。“主耶和华”保留二者，不把神名改写成普通称号，也避免因重复称号而模糊原文结构。
- issue: יֵרָאֶה 的语态及礼仪含义
  choice: 朝见
  alternative: 显现在……面前；被……看见
  rationale: 虽然 Niphal 形式在字面上容许“被看见”的分析，但在节期礼仪和来到神面前的固定语境中表示“出现、朝见”。译作“朝见”不对献礼方式或资格加入原文未明说的神学限定。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。“男丁”明确保留原文的男性范围；“朝见”适合宗教与君王临在语境，普通读者亦能理解。
