  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: zh_hans
  text: 在你的土地上，必没有流产或不生育的妇女[a]；我必使你年日的数目满全[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “流产的”所译的希伯来词也可泛指“丧失儿女的”。但本节将它与“不生育的”并列，较可能特指流产或生产时失去孩子。
    reason: lexical_alternative
  - marker: b
    text: 直译“我必使你年日的数目满全”，意思是使你一生的寿数达到足满。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: 流产的
  rationale: 该词源于 שׁכל，此处为阴性分词，与“不生育的”并列，并处于生育蒙福的语境中；译作“流产的”自然传达未能足月生下孩子之意，同时不把它泛化为一切丧子情形。
- source_word: עֲקָרָה
  choice: 不生育的
  rationale: 指不能生育的女性。现代汉语中“不生育的”比“不孕的”略少医学化，也适合与分词性的“流产的”并列。
- source_word: בְּאַרְצֶךָ
  choice: 在你的地上
  rationale: אֶרֶץ 在这里指以色列将居住的应许之地；“你的地”保留盟约土地语境，也比“你的国家”更贴近原文。
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: 你一生的年日
  rationale: 原文直译为“你日子的数目”，指所分定的一生年日；在汉语中加入“一生”可使含义清楚，同时保留“年日”的原文意象。
- source_word: אֲמַלֵּא
  choice: 使……满足
  rationale: מלא 的基本意象是“使满、充满”。“使你一生的年日满足”保留丰满、达到足数的隐喻，又比生硬的“填满日子的数目”自然。
- source_word: לֹא תִהְיֶה
  choice: 必没有
  rationale: 这是表达存在与否的否定句式；“必没有”在现代汉语中简洁自然，并体现此处应许性的将来语气。
theological_decisions:
- issue: 生育与寿命应许的适用范围
  choice: 将本节译为上帝对以色列在应许之地所赐的盟约福分，包括免受流产、不育之苦，以及享有足满的年日。
  alternative: 把它理解成脱离盟约及土地语境、对历世历代每一位信徒都绝无流产、不育或早逝的普遍保证。
  rationale: 上下文明确涉及以色列进入并居住之地的盟约应许。译文忠实呈现应许本身，却不额外扩大其适用范围，也不说明原文未交代的实现机制。
- issue: “满”与寿命的关系
  choice: 保留“使……满”的意象，同时用脚注说明其所指是使寿数达到足满。
  alternative: 直接意译为“使你长寿”或“使你活到高龄”。
  rationale: 原文强调的是年日达到其足数，并未明说具体年龄；保留这一表达可避免把“足满”窄化为某个现代意义上的高龄标准。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“流产的／不生育的”保持原文两个阴性单数形式的并列，但汉语不必重复“妇女”；“使你一生的年日满足”保留 מלא 的“满”之隐喻，并以脚注解释希伯来习语。脚注标记按相关词语分别置于[a]、[b]处。
