  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: zh_hans
  text: 又要守收割节[a]，就是你在田间所播种、劳作所得的初熟之物；又要在岁末[b]守收聚节[c]，那时你要从田间收聚你劳作所得的出产。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “节”也可译作“节庆”；原词指按期举行的庆典，常包括朝圣守节。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“在一年出去的时候”。
    reason: lexical_alternative
  - marker: c
    text: “收聚”指把田间的出产收集起来；“收聚节”是与收聚田间出产有关的节期。
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: 节
  rationale: 在本段指按期举行的宗教性节庆；“节”在现代汉语圣经语境中自然庄重，也能涵盖节期与庆典的意义。
- source_word: הַקָּצִיר
  choice: 收割
  rationale: 该词指收割或收获；用于节期名称时，“收割节”直接保留农业背景。
- source_word: בִּכּוּרֵי
  choice: 初熟之物
  rationale: 指最先成熟的出产，并含有献给上帝的礼仪背景；“初熟之物”比单纯的“最早收成”更能保留这一含义。
- source_word: מַעֲשֶׂיךָ
  choice: 你劳作所得
  rationale: 字面为“你的工作/作为”，在农业语境中兼指劳作及其成果；译作“劳作所得”既保留人的劳动，也自然指向田间出产。
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: 你在田间所播种
  rationale: 直接保留第二人称和田间播种的具体农业图景。
- source_word: הָאָסִף
  choice: 收藏
  rationale: 指把田间出产收集、储藏起来；“收藏节”可作为节期名称，并与后文收聚收成相呼应。
- source_word: בְּצֵאת הַשָּׁנָה
  choice: 在岁末
  rationale: 字面为“在一年出去的时候”，其时间意义是年末；“岁末”简洁、庄重且符合现代汉语。
- source_word: בְּאָסְפְּךָ
  choice: 那时你要……收聚起来
  rationale: 介词加不定式在这里表达时间关系；用“那时”引出动作，在汉语中清楚自然。
- source_word: מִן הַשָּׂדֶה
  choice: 在田间……所得
  rationale: 希伯来文强调所收聚之物来自田间；汉语以“在田间劳作所得”自然表达这一来源。
theological_decisions:
- issue: “初熟之物”与守节的关系
  choice: 用“献上”明确初熟之物在节期中的礼仪用途
  alternative: 仅作同位语直译为“收割节，即……初熟之物”
  rationale: 原文为紧缩的同位结构，未明说动词；结合“初熟之物”的礼仪用法和本段守节语境，“献上”能使现代汉语完整易懂，但不进一步规定献礼方式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“收割节”和“收藏节”作为对应的节期名称；重复“劳作所得”以保留原文两次出现的מַעֲשֶׂיךָ，同时在后半句补出“收成”，使农业所指在汉语中明确。
