  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: zh_hans
  text: 不可在有酵之物上献我祭牲的血[a]；我节期祭牲的脂油不可留到早晨[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在有酵之物上”按字面译作“在酵之上”。此处介词也可理解为“与有酵之物一同”或“与酵有关联”；经文禁止在献祭时将祭牲的血与有酵之物相连。
    reason: lexical_alternative
  - marker: b
    text: “我节期祭牲的脂油”，原文较直译为“我节期的脂油”；“节期”也可译作“节庆”。这里的“脂油”指节期祭祀中祭牲的脂肪部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: 献上
  rationale: זבח在祭祀语境中指宰献或献祭；这里的直接宾语是“我祭牲的血”，译作“献上”比生硬的“献祭……的血”更符合现代汉语，同时保留礼仪含义。
- source_word: עַל חָמֵץ
  choice: 和有酵之物一同
  rationale: עַל字面为“在……之上”，但在此祭祀禁令中更可能表示与有酵之物相伴或相关联；“和……一同”清楚自然，并以脚注保留字面可能性。
- source_word: דַּם זִבְחִי
  choice: 我祭牲的血
  rationale: 保留“血”以及第一人称单数所属后缀；“祭牲”能简洁表达זֶבַח作为祭祀中被献之牲的含义。
- source_word: יָלִין
  choice: 留到
  rationale: לין表示过夜、留宿；与עַד בֹּקֶר连用时，“不可留到早晨”自然且不重复表达“过夜”。
- source_word: חֵלֶב
  choice: 脂肪
  rationale: 原文明确为祭牲的脂肪；不扩译为“上好部分”，以保留具体祭祀用语。
- source_word: חַגִּי
  choice: 我节期祭牲的
  rationale: חַג指宗教节期或节庆。因“脂肪”通常属于节期所献的祭牲，正文用“我节期祭牲的脂肪”使汉语关系明确；脚注说明原文较简略。
- source_word: עַד בֹּקֶר
  choice: 到早晨
  rationale: 准确传达时间界限，且符合现代汉语习惯。
theological_decisions:
- issue: “我的祭牲”和“我的节期”中第一人称后缀的所指
  choice: 保留上帝第一人称的所属表达：“我祭牲的血”“我节期祭牲的脂肪”
  alternative: 译作“献给我的祭牲”或“耶和华节期的祭牲”
  rationale: 希伯来文两处第一人称单数后缀均明确，应保留神圣话语中的“我”，不将其解释性改写为“献给我”或以神名替代。
- issue: חַגִּי与“脂肪”的语法和祭祀关系
  choice: 正文译作“我节期祭牲的脂肪”，并以脚注交代较直译形式
  alternative: “我节期的脂肪”或“我筵席的脂肪”
  rationale: “我节期的脂肪”形式上更贴近原文，却在现代汉语中容易被误解为节期本身有脂肪；补出隐含的“祭牲”符合祭祀语境，同时通过脚注避免掩盖原文的简练与可能张力。
translation_notes:
  register: 采用现代、庄重而易懂的律法文体。“不可……；……不可……”保留禁令的对称结构。正文避免“祭牲的血和有酵之物一起献祭”这类可能误使“有酵之物”成为共同祭物的表达，并用脚注保存介词עַל的字面歧义。所有脚注标记均置于相关正文之后。
