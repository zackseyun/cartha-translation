  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: zh_hans
  text: 六天你要做自己的工；第七天要停工[a]，好让你的牛和驴得以歇息，也让你婢女的儿子和寄居者[b]得以恢复精力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“要安息”；希伯来语动词的基本意思是“停止、止息”。
    reason: lexical_alternative
  - marker: b
    text: “寄居者”指住在以色列人中、处于其社会和法律秩序之下的外来居民。
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: 六天
  rationale: 这是表示持续时段的时间用语；简洁译为“六天”，符合现代汉语，也保留命令所规定的时限。
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: 你要做你的工
  rationale: 未完成式在律法语境中表达命令；“做你的工”涵盖一般工作，不把范围限于体力劳动。
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: 但第七天
  rationale: 连接词在此承接并突出六天与第七天的对比，现代汉语用“但”表达自然。
- source_word: תִּשְׁבֹּת
  choice: 要停工
  rationale: שׁבת的核心意思是停止、止息；结合前文的“工”，译作“停工”既明确又避免只表达个人放松。
- source_word: לְמַעַן יָנוּחַ
  choice: 使……可以歇息
  rationale: לְמַעַן引出目的，נוח表示休息、安歇；该译法自然呈现牲畜因停工而得到休息。
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: 你的牛和驴
  rationale: שור在农耕语境中指牛类役畜；现代汉语以“牛”最自然，חמור则明确译为“驴”。
- source_word: וְיִנָּפֵשׁ
  choice: 可以恢复精神
  rationale: 该词在此有重新得力、恢复气息之意；“恢复精神”比字面化的“喘口气”更庄重，同时保留休息后复原的含义。
- source_word: בֶּן אֲמָתְךָ
  choice: 你婢女的儿子
  rationale: 按原文保留“你婢女的儿子”这一具体家庭与社会关系，不笼统改写为仆役或家属。
- source_word: הַגֵּר
  choice: 寄居者
  rationale: גר指居住在以色列人中、受其社会法律秩序约束的外来居民；“寄居者”简洁地保留这一法律社会类别。
theological_decisions:
- issue: 安息日律例中שׁבת的译法
  choice: 要停工
  alternative: 要安息；要停止
  rationale: 原词首先强调停止活动；“停工”承接前句的工作，并让后文牲畜得歇息、弱势者恢复精神的目的自然显明。
- issue: 社会身份词גר的译法
  choice: 寄居者
  alternative: 外侨；寄居的外族人；陌生人
  rationale: “寄居者”保留其在以色列社会中定居却非本族成员的法律身份，不把它弱化为一般陌生人，也不额外限定其族群。
- issue: בֶּן אֲמָתְךָ所表达的社会关系
  choice: 你婢女的儿子
  alternative: 你女仆的儿子；婢女之子
  rationale: 直译保留经文特指的从属家庭成员，并避免把古代受支配的身份现代化为一般雇佣关系。
translation_notes:
  register: 采用现代、清楚而庄重的律法语体。“停工”准确承接前句，又保留שׁבת“停止”的核心意义；“婢女”略带历史语感，用以避免现代“女仆”可能暗示普通雇佣关系；“恢复精神”自然表达休息后重新得力的含义。
