source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: zh_hans
  text: 我要划定你的疆界，从芦苇海[a]直到非利士海[b]，又从旷野直到那大河[c]；因为我要把那地的居民交在你们手中，你要把他们从你面前赶出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “芦苇海”是希伯来语名称的直译；传统常译作“红海”。
    reason: lexical_alternative
  - marker: b
    text: “非利士海”通常指地中海。
    reason: cultural_note
  - marker: c
    text: “那大河”指幼发拉底河。
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: 我要划定
  rationale: 该完成式在上帝应许的语境中表达将来的行动；与“疆界”搭配时，“划定”自然且准确。
- source_word: גְּבֻלְךָ
  choice: 你的疆界
  rationale: גְּבוּל指边界或疆域界线；“疆界”符合领土范围的语境。
- source_word: מִיַּם סוּף
  choice: 从芦苇海
  rationale: 按希伯来语名称直译为“芦苇海”，避免把其具体地理所指在正文中提前确定为现代所谓的红海；传统名称见脚注。
- source_word: יָם פְּלִשְׁתִּים
  choice: 非利士海
  rationale: 保留原文按非利士人命名海域的表达；通常指地中海，相关说明置于脚注。
- source_word: וּמִמִּדְבָּר
  choice: 又从旷野
  rationale: מִדְבָּר在此指荒野地带；“旷野”是自然且符合《出埃及记》语域的译法。
- source_word: הַנָּהָר
  choice: 那大河
  rationale: 带定冠词的“河”在此按惯用地理称谓指幼发拉底河；中文用“那大河”既保持称谓感，也由脚注说明所指。
- source_word: כִּי
  choice: 因为
  rationale: 引出前述划定疆界之应许的根据，中文“因为”关系清楚。
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: 我要把……交在你们手中
  rationale: 保留“交在手中”的希伯来语意象，同时在现代中文中清楚表达交付其掌控。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: 那地的居民
  rationale: 准确表达居住在该地的人；“那地”承接应许疆域。
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: 你要把他们……赶出去
  rationale: גרשׁ表示驱逐、赶走；“赶出去”直接而自然。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 保留原文“从你面前”的具体意象，也能自然表达将对方逐离。
theological_decisions:
- issue: יַם סוּף的地理名称
  choice: 正文译“芦苇海”
  alternative: 红海
  rationale: “芦苇海”直接反映希伯来语名称，并保留其地理辨识上的张力；“红海”作为传统译名列入脚注。
- issue: 应许与以色列行动之间的关系
  choice: 保留“我要交在你们手中”与“你要……赶出去”并列
  alternative: 将两者合并解释为上帝独自驱逐或以色列独自征服
  rationale: 原文同时陈述上帝的交付和以色列的驱逐行动，不应在翻译中消解二者的张力。
- issue: 第二人称单复数变化
  choice: “你们手中”后接“你要”
  alternative: 全句统一译为复数“你们”
  rationale: 原文在בְיֶדְכֶם使用复数“你们”，随后וְגֵרַשְׁתָּמוֹ与מִפָּנֶיךָ转为阳性单数“你”；正文保留这一变化，单数可把以色列作为整体来称呼。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文尽量贴近希伯来语的地理称谓和代词数的变化；脚注只补充必要的传统名称与地理辨识。
