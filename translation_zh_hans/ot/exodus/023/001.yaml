source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל תָּ֤שֶׁת יָֽדְ/ךָ֙ עִם רָשָׁ֔ע לִ/הְיֹ֖ת עֵ֥ד חָמָֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: zh_hans
  text: 不可散布虚假的传闻[a]；不可与恶人联手，作恶意的见证[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “散布”直译可作“携带”或“承受”；这里指把虚假的消息传开。“虚假的传闻”也可译作“虚妄的消息”。
    reason: 说明נָשָׂא与שֵׁמַע连用时的习语意义，并保留שָׁוְא的词义幅度。
  - marker: b
    text: “与……联手”直译为“把你的手与……放在一起”。“恶意的见证”也可理解为“强暴的见证”“不公的见证”或“恶毒的见证”；原文强调这种见证对人或公义所造成的伤害。
    reason: 保留希伯来语的手部意象，以及עֵד חָמָס在司法语境中的多重可能。
lexical_decisions:
- source_word: לֹא תִשָּׂא
  choice: 不可散布
  rationale: נָשָׂא本义为“举起、携带、承担”；与“传闻、消息”连用时，可指把所听见的事传开。“散布”在现代汉语中自然地表达传播虚假消息的意思，同时在脚注保留其较为直译的可能。
- source_word: שֵׁמַע שָׁוְא
  choice: 虚假的传闻
  rationale: שֵׁמַע指所听见的消息或传闻；שָׁוְא可表示虚假、空妄或无价值。在本段司法与群体伦理语境中，“虚假的传闻”准确而清楚，也没有把它限定为正式证词。
- source_word: אַל תָּשֶׁת יָדְךָ עִם
  choice: 不可跟……联手
  rationale: 希伯来语直译为“不可把你的手与……放在一起”，是共同参与或协助的形象说法。“联手”既保留“手”的意象，又符合现代汉语习惯。
- source_word: רָשָׁע
  choice: 恶人
  rationale: רָשָׁע在道德或司法语境中可指邪恶者、作恶者或有罪者。“恶人”简洁地保留其道德与法律色彩；汉语名词本身不必明示性别。
- source_word: לִהְיֹת עֵד חָמָס
  choice: 作恶意害人的见证
  rationale: עֵד是“见证、证人”；חָמָס涵盖暴力、伤害、恶行和不公。这里的司法语境表明，这种见证会恶意损害他人或公义。“恶意害人的见证”在汉语中通顺，并保留了חָמָס强于单纯“虚假”的伤害性；脚注说明其字面张力。
theological_decisions:
- issue: עֵד חָמָס究竟描述“暴力的见证”，还是指恶意、不公或害人的证言
  choice: 作恶意害人的见证
  alternative: 作强暴的见证／作不公正的见证／作假见证
  rationale: חָמָס的词义不只是假，也包括暴力、伤害与严重不公。正文采用自然汉语说明这种见证具有恶意伤害性，却不把它简化为一般的“假见证”；脚注保留其他理解。
- issue: 法律训令中的阳性单数形式
  choice: 以单数对象“恶人”表达，不额外标明男性
  alternative: 恶男子／作恶的人
  rationale: 希伯来语形式是阳性单数，但在此类法律训令中可作代表性用法。现代汉语的“恶人”既保持单数概念，也不需加入原文未特别强调的生理性别。
translation_notes:
  register: 采用现代、庄重而易懂的法律训令语体。两个分句都用“不可”形成平衡；“跟恶人联手”较口语化但不轻浮，“作恶意害人的见证”则保持司法语境。脚注标记均已在正文出现。
