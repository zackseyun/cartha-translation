base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: zh_hans
  text: 看哪，我要差遣一位天使[a]在你前面，在路上保护你，并把你带到我所预备的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一位使者”。希伯来语 מַלְאָךְ 既可指人的使者，也可指天使；这里按上下文译作“天使”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留希伯来语提示注意并赋予宣告庄重感的功能；“看哪”在现代中文中略显庄重，但用于神的直接宣告仍自然清楚。
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: 我要差遣
  rationale: 独立代词与分词结合，表达说话者强调自己并宣告即将采取行动；中文“我要差遣”自然呈现临近将来的语气，不过度强化为“我亲自”。
- source_word: מַלְאָךְ
  choice: 一位天使
  rationale: 该词可指一般使者或天使；本段中这位受神差遣、在以色列人前面保护并引导他们的使者更可能是超自然的天使，但词义上的另一可能保留在脚注中。
- source_word: לְפָנֶיךָ
  choice: 走在你前面
  rationale: 原文直译为“在你面前”，此处表示先行；补出“走”符合旅程语境，也使现代中文更自然。
- source_word: לִשְׁמָרְךָ בַּדָּרֶךְ
  choice: 在路上保护你
  rationale: שׁמר在旅程语境中有看守、护卫之意；“保护你”清楚表达其作用，“在路上”保留行程或沿途的含义。
- source_word: וְלַהֲבִיאֲךָ
  choice: 并把你带到
  rationale: בוא的使役形表示使之来到，即“带到”；这比“引导”更直接贴合词形含义。
- source_word: הַמָּקוֹם אֲשֶׁר הֲכִנֹתִי
  choice: 我所预备的地方
  rationale: כון的使役形可指预备、使就绪或设立；在目的地语境中，“预备”最自然，也保留神已为以色列安排该地的含义。
theological_decisions:
- issue: 本节中 מַלְאָךְ 的身份
  choice: 正文译为“一位天使”，不进一步界定其是否为受造天使或上主的特殊显现。
  alternative: 译作“一位使者”，或明确认定为具有独特神圣身份的“耶和华的使者”。
  rationale: 本节只称其为 מַלְאָךְ。后文确实引发有关其身份和权柄的神学问题，但翻译不应在本节中提前消除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留神谕式宣告的郑重语气；其余句式力求自然流畅。原文第二人称单数在中文中不另作标示。
