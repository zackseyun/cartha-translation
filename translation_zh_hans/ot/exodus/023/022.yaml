  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: zh_hans
  text: 但你若切实听从他的声音[a]，照着我所说的一切去做[b]，我就与敌对你的人为敌，与和你作对的人作对。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语以绝对不定式和同根限定动词连用来加强语气；“听从”也包含听而顺从的意思。
    reason: lexical_alternative
  - marker: b
    text: 本节从“他的声音”转为“我所说的”，保留了上下文中这位使者与耶和华之间的紧密联系。
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: 但你若
  rationale: 这一组合承接上文，带有鲜明的转折和条件意味；“但你若”在现代汉语中自然地表达这种语气。
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: 切实听从
  rationale: 希伯来语用绝对不定式配合同根限定动词加强语气；שׁמע 与“声音／话”连用时也包含听而顺从之意。“切实听从”兼顾强调和顺服的含义。
- source_word: בְּקֹלוֹ
  choice: 他的话
  rationale: 字面为“他的声音”。现代汉语中“听从他的话”更自然，同时保留说话者是上文那位使者这一人称指向。脚注注明较直译的表达。
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: 照着我所说的一切去做
  rationale: 保留原文从“他”转为神第一人称“我”的变化，并以自然汉语表达全面遵行的意思。
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: 我就与敌对你的人为敌
  rationale: 动词 איב 与名词 אֹיְבֶיךָ 同源；译文用“敌对……为敌”尽量重现同根呼应，并表达神对以色列仇敌采取敌对立场。
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: 与和你作对的人作对
  rationale: 动词 צרר 与其后的分词名词同源，含敌视、逼迫或攻击之意。重复“作对”既保留原文的同根修辞，也与前一分句形成平行。
theological_decisions:
- issue: “他的话”与“我所说的”之间的人称转换
  choice: 保留使者的第三人称与耶和华自称“我”之间的转换。
  alternative: 把两处都顺译为使者的话，或都改写成神直接说话。
  rationale: 原文把使者的声音与耶和华自己的话紧密相连，却没有明说二者应如何区分；译文不加以调和，以保留经文本身的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“切实听从”避免过度古雅；末尾两个平行分句适度保留希伯来语的同根反复和修辞力度。
