  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: zh_hans
  text: 不可欺压寄居者[a]；你们自己知道寄居者的心[b]，因为你们曾在埃及地寄居。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外来人”或“陌生人”。希伯来文指住在当地人中间的非本地人，常处于社会弱势，并非仅指过路旅客。
    reason: lexical_alternative
  - marker: b
    text: 直译“你们知道寄居者的生命（נֶפֶשׁ）”；这里是指亲身了解寄居者内在的感受和实际处境，也可意译为“你们知道作寄居者是什么滋味”。
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: 寄居者
  rationale: 指居住在本地人中间的外来人，往往处于社会弱势；“寄居者”既保留其居留身份，也能在全节中前后一致。
- source_word: תִלְחָץ
  choice: 欺压
  rationale: 在律法语境中表示施加压迫、剥削或苛待；“欺压”准确传达其社会伦理力度。
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: 你们自己知道
  rationale: 显明独立代词“你们”的强调，并表达以亲身经历而有的认识。
- source_word: נֶפֶשׁ
  choice: 心境
  rationale: 此处不是把人区分为肉体与灵魂，而是指寄居者内在的感受和亲历的处境；“心境”在现代汉语中自然，同时保留内在经验的意味。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出不得欺压寄居者的理由。
- source_word: גֵרִים הֱיִיתֶם
  choice: 你们也曾……寄居
  rationale: 延续 גֵר 的词根联系，并以“也曾”突出以色列人自身过去的相同经历。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: 在埃及地
  rationale: 保留原文“埃及之地”的表达和庄重的律法语体。
theological_decisions:
- issue: 盟约律法中 גֵר 的身份含义
  choice: 寄居者
  alternative: 外来人、外侨、陌生人
  rationale: 原词强调住在另一族群中间、没有本地身份保障的人，不只是短暂停留的旅客，也不单指族裔上的外国人；“寄居者”保留这一社会与法律层面的含义。
- issue: “知道寄居者的 נֶפֶשׁ”的理解
  choice: 知道寄居者的心境
  alternative: 知道寄居者的性命；知道作寄居者是什么滋味
  rationale: 保留“内在感受”的意象，同时让读者明白这是由亲身经历而来的体认；避免把 נֶפֶשׁ 限定为后期身心二分意义上的“灵魂”，也不把原文完全改写成解释性意译。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“不可”对应禁令；分号保留命令与理由之间的紧密联系。“心境”较“灵魂”更符合此处习语，又比完全意译更贴近原文意象。
