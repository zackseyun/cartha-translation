  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: zh_hans
  text: 你要守无酵节。在亚笔月所定的时候，要连续七天吃无酵饼，正如我吩咐你的；因为你是在这个月从埃及出来的。不可有人空手到我面前来[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到我面前”原文直译为“见我的面”；这是表示来到我面前、进入我临在的希伯来语习语。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译作：“他们不可空手到我面前来。”原文在这里由第二人称单数的称呼转为第三人称复数形式。
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: 无酵节
  rationale: חַג指宗教节期，并可含朝圣守节之意；“无酵节”是简明、通行且准确的汉语名称。
- source_word: תִּשְׁמֹר
  choice: 你要守
  rationale: שׁמר在礼仪和律法语境中表示遵守、守节；“守”保留命令的约束力，也符合现代汉语宗教节期的表达。
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: 连续七天吃无酵饼
  rationale: 明确表达七日的持续时段；“无酵饼”准确传达מַצּוֹת所指不经发酵的饼。
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: 照我所吩咐你的
  rationale: 保留比较关系及上帝直接命令的语气，汉语自然庄重。
- source_word: לְמוֹעֵד חֹדֶשׁ הָאָבִיב
  choice: 在亚笔月的指定日期
  rationale: מוֹעֵד在此指预定的节期时间；אָבִיב作为历月名称音译为“亚笔月”，避免将其仅释作农作物状态。
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: 因为你是在这个月从埃及出来的
  rationale: 将בוֹ的所指“亚笔月”明确化，以免汉语代词含混，同时保留出埃及的历史陈述。
- source_word: וְלֹא יֵרָאוּ פָנַי רֵיקָם
  choice: 不可有人空手到我面前来
  rationale: 按固定礼仪用语表达为来到上帝面前；רֵיקָם译作“空手”，既自然，也不擅自限定所应携带礼物或供物的具体种类。
theological_decisions:
- issue: פָנַי的神圣临在表达
  choice: 到我面前来
  alternative: 看见我的面
  rationale: “我的面”在此属于希伯来语固定表达，意为来到上帝面前；译作“到我面前来”既保留亲自朝见的含义，也避免把它误解为肉眼观看上帝的面。
- issue: 末句人称和数的表达
  choice: 不可有人
  alternative: 他们不可
  rationale: 前文以第二人称单数称呼以色列，末句的希伯来语形式转为复数表达。汉语以不定指的“不可有人”自然传达普遍禁令，并用脚注保留原文形式上的变化，不据此引入额外神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“你要”“不可”保留命令力度；调整时间成分次序，使汉语顺畅，同时不改变原文逻辑。所有必要的原文歧义与人称变化均以脚注说明。
