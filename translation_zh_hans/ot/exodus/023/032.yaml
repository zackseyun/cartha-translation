base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: zh_hans
  text: 不可与他们立约，也不可与他们的神立约。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: 不可
  rationale: 这是标准否定词；与未完成式动词连用，在本段律法语境中表达明确禁令。“不可”既简洁又保留法律语体的力度。
- source_word: תִכְרֹת
  choice: 立
  rationale: כרת 与 בְּרִית 构成固定搭配，字面为“割约”，实际指缔结盟约。现代汉语通常说“立约”，自然且准确。
- source_word: לָהֶם
  choice: 跟他们
  rationale: 在“立约”的语境中，介词 ל 标明立约的另一方。现代汉语“跟他们”清楚自然，也比“为他们”更符合此处关系。
- source_word: וְלֵאלֹהֵיהֶם
  choice: 或他们的神
  rationale: וְ 字面通常是“和／并且”，但在否定句列举两个禁止对象时，汉语用“或”能自然表达“两者都不可”的分配意义。复数 אֱלֹהִים 结合异教语境译为“神”。
- source_word: בְּרִית
  choice: 约
  rationale: “约”是 בְּרִית 在圣经语境中的标准译法，兼具关系、法律和宗教含义；此处不宜缩窄为仅具政治意义的“条约”。
theological_decisions:
- issue: כרת ברית 这一立约惯用语的译法
  choice: 立约
  alternative: 割约
  rationale: “割约”保留希伯来语的字面意象，却不是现代汉语通常的表达；“立约”既自然，又完整保留禁令的法律与神学分量。字面形式收入脚注。
- issue: “他们的神”之前连接词 וְ 的表达
  choice: 或他们的神
  alternative: 和他们的神
  rationale: 原文连接词通常意为“和”，但在否定禁令中连接两个对象，汉语用“或”更清楚地表达“不可与任何一方立约”，并不改变原文所禁事项。形式对应的译法收入脚注。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“不可”保持律法禁令的力度；“跟”在现代标准汉语中自然清楚，与“立约”搭配顺畅。保留“约”这一核心圣经术语，并以脚注呈现希伯来语惯用语及连接词的形式对应译法。
