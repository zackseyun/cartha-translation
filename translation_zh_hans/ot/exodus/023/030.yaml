base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: zh_hans
  text: 我要把他们[a]从你面前一点一点地赶出去，直到你繁衍增多，占有那地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他”；这个单数形式很可能把那地的居民或各族作为一个整体来指称。
    reason: lexical_alternative
  - marker: b
    text: “占有那地”也可译作“承受那地”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: 一点一点地
  rationale: 希伯来文重复“少量”一词，表示行动逐步进行；“一点一点地”既保留重复形式，也符合现代汉语表达。
- source_word: אֲגָרְשֶׁנּוּ
  choice: 我要把他们赶出去
  rationale: גרשׁ意为“赶出、驱逐”。宾语后缀在语法上是第三人称阳性单数，但结合上下文，所指是当地居民或各族的集合体；正文用“他们”使现代汉语自然清楚，并以脚注说明原文形式。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 直译为“从你面前”，在此表示从以色列人所在之处被赶走；这一表达既保留希伯来语意象，也能为现代读者理解。
- source_word: עַד אֲשֶׁר
  choice: 直到
  rationale: 此组合引出渐进驱逐持续到的时点或结果，“直到”简洁准确。
- source_word: תִּפְרֶה
  choice: 你繁衍增多
  rationale: פרה可表示“结果子、繁衍、增多”。此处重点是人口增加到足以占据那地；“繁衍增多”保留其生育与增长两方面的含义。
- source_word: וְנָחַלְתָּ
  choice: 占有
  rationale: נחל在此可指承受产业，也可指取得并占有土地。正文采用“占有”以贴合进入并居住那地的语境，同时用脚注保留“承受”的可能译法。
- source_word: אֶת־הָאָרֶץ
  choice: 那地
  rationale: 定冠词所指为上下文已经明确的应许之地；“那地”自然体现其特指性。
theological_decisions:
- issue: 驱逐对象所用宾语后缀的集合单数
  choice: 正文按上下文译为复数“他们”，脚注说明希伯来文在语法上为单数。
  alternative: 正文直译为“他”，把当地居民或各族视为一个集合体。
  rationale: 希伯来文宾语后缀是阳性单数，但其语境所指为当地居民或各族的集合体。汉语用“他”容易被误解为某一个人，因此正文采用集合意义明确的“他们”，同时在脚注中保持原文语法透明度。
- issue: נחל在土地应许语境中的含义
  choice: 译为“占有”，并注明也可译为“承受”。
  alternative: 正文译为“承受那地”。
  rationale: 该词兼有承受产业和取得产业的语义。此处语境涉及逐步赶出居民并居住其地，“占有”较清楚；脚注保留“承受”所表达的产业与赐予色彩，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“一点一点地”保留原文重复所表达的渐进性；“繁衍增多”明确人口增长的语境。脚注标记分别紧跟相关词语，避免歧义。
