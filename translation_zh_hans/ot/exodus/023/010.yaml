  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: zh_hans
  text: 六年间，你要播种你的土地，收集地里的出产[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“收成”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: 六年之内
  rationale: 句首的连词与时间短语共同构成持续时段；译为“六年之内”符合现代汉语表达，也为后续安息年条例铺设时间框架。
- source_word: תִּזְרַע
  choice: 你要耕种
  rationale: 该未完成式在律法语境中具有规定意味。“耕种”在汉语农业语境中自然，并能涵盖这里播种土地的行动；若直译“播种自己的土地”，表达稍显生硬。
- source_word: אֶת אַרְצֶךָ
  choice: 自己的土地
  rationale: 此处 אֶרֶץ 指归耕作者使用的农地，并非泛指大地；反身领属“自己的”自然对应第二人称单数后缀。
- source_word: וְאָסַפְתָּ
  choice: 收取
  rationale: אָסַף 表示收集、收取；此处指把土地所产的收进来。“收取”保留原文较宽泛的意义，未将其限定为某一种收割方式。
- source_word: אֶת תְּבוּאָתָהּ
  choice: 地里的出产
  rationale: תְּבוּאָה 指土地的农产或收成；“地里的出产”清楚表达阴性后缀回指土地，同时保持词义的概括性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的律法语体。“你要”表达规定性而不过度古雅；以“地里的”明确代词所指，避免汉语中“它的出产”不自然。
