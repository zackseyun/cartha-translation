base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: zh_hans
  text: 你们要事奉雅威你们的神；他必赐福给你的粮食[a]和水，我也必从你中间除去疾病[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “粮食”所译的希伯来词字面常指“饼”，也可泛指食物或生活供应。
    reason: lexical_alternative
  - marker: b
    text: 或译“病患”“病痛”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文先用复数“你们”，随后改用单数“你的”“你中间”；又先称雅威为“他”，继而由雅威以“我”自称。译文保留了这些转换。
    reason: source_form
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: 你们要事奉
  rationale: עבד在此盟约语境中兼有服事与敬拜之意。“事奉”既自然，又比单译“敬拜”更完整地保留其盟约性含义；“要”体现上下文中的吩咐语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的神
  rationale: 此处与雅威同位，明确是单数意义的“神”；复数第二人称后缀表达他与全体以色列的盟约关系。
- source_word: וּבֵרַךְ
  choice: 他必赐福
  rationale: 该形式在命令之后表达应许的结果，主语承接“雅威你们的神”。补出“他”既符合汉语，也保留原文随后转为第一人称“我”的人称变化。
- source_word: לַחְמְךָ
  choice: 你的粮食
  rationale: לֶחֶם字面常指“饼”，也可转指日常食物或供应。此处与水并列，“粮食”在现代汉语中较自然，又保留基本生活供应的具体意象。
- source_word: מֵימֶיךָ
  choice: 水
  rationale: מַיִם虽在形态上为复数形式，通常作集合名词；汉语用“水”最为自然。所属关系由并列结构中的“你的”同时管辖“粮食和水”。
- source_word: וַהֲסִרֹתִי
  choice: 我也必……除去
  rationale: 使役词形表示使某物离开，即“除去”。“必”传达应许语气；“我”照原文保留说话者从第三人称雅威转为第一人称的变化。
- source_word: מַחֲלָה
  choice: 疾病
  rationale: 该词可指疾病、病患或病痛。“疾病”是自然、宽泛且不失庄重的现代汉语表达。
- source_word: מִקִּרְבֶּךָ
  choice: 从你中间
  rationale: 直译保留群体性的空间含义，不把应许缩窄为仅从个人身体内部除去疾病。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留神在盟约中启示的专名，不以“主”这一称号代替。
- issue: 第二人称由复数转为单数
  choice: 保留“你们……你的……你中间”的转换
  alternative: 全部统一为复数“你们的……你们中间”
  rationale: 希伯来文开头的动词和“你们的神”是复数，随后“粮食、水、中间”的后缀均为单数。此转换可体现以色列既是众人又作为一个整体受 خطاب 的特点，因此不静默统一。
- issue: 指称雅威时由第三人称转为第一人称
  choice: 保留“他必……我也必……”
  alternative: 统一为“雅威必……也必……”或“我必……我也必……”
  rationale: 原文先以第三人称隐含雅威为“赐福”的主语，随后用第一人称“我”说“除去”。保留这一突变，避免替原文消解其话语张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“事奉”“赐福”保留经文语域但仍为当代读者熟悉。分号区分命令与两项应许，同时不改写原文的人称及数的转换。
