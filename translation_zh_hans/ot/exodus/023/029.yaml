  text: לֹ֧א אֲגָרְשֶׁ֛/נּוּ מִ/פָּנֶ֖י/ךָ בְּ/שָׁנָ֣ה אֶחָ֑ת פֶּן תִּהְיֶ֤ה הָ/אָ֨רֶץ֙ שְׁמָמָ֔ה וְ/רַבָּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: zh_hans
  text: 我不在一年之内把他们从你面前赶出去，免得那地荒凉，田野的野兽[a]增多，危害你。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “田野的野兽”也可译作“田野的野生动物”。“把他们……赶出去”的“他们”，希伯来原文在形式上为单数，可能集合性地指当地居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: 把他们……赶出去
  rationale: גרש意为“赶出、驱逐”。宾语后缀在形态上是阳性单数，但在上下文中很可能集合性地指当地居民；现代汉语用复数“他们”可清楚表达这一所指，脚注说明原文形式。
- source_word: מִפָּנֶיךָ
  choice: 从你面前
  rationale: 贴近希伯来语的空间性惯用表达，同时在现代汉语中自然可懂。
- source_word: בְּשָׁנָה אֶחָת
  choice: 在一年之内
  rationale: 表达不是在一个年度期限内一次性全部赶出；“之内”自然呈现该时间范围。
- source_word: פֶּן
  choice: 免得
  rationale: 准确传达否定目的或所要避免的结果。
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: 那地荒凉
  rationale: שְׁמָמָה指荒废、无人料理的状态；简洁保留结果含义。
- source_word: וְרַבָּה
  choice: 增多
  rationale: רבה意为变多、繁增。危害性的程度由后接的עָלֶיךָ在语境中表达，不必在动词中另加“过多”。
- source_word: עָלֶיךָ
  choice: 危害你
  rationale: על在此语境表示野兽的增加对以色列人造成不利影响；译作“危害你”比直译“在你之上”清楚自然。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 田野的野兽
  rationale: 保留构词“田野的”，并以“野兽”自然表达野生陆栖动物；也可译为“田野的野生动物”。
theological_decisions:
- issue: 单数宾语后缀的集合性所指
  choice: 正文译作“他们”
  alternative: 译作“他”或“它”
  rationale: 前文所指是将被逐出的当地诸族或居民，汉语使用“他们”能避免误解为单一个体，同时以脚注保留希伯来语形态上的单数。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“免得”保留警示和避免结果的语气；“从你面前”有意保留原文的空间性表达。
