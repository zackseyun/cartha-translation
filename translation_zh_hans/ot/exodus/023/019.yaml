  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: zh_hans
  text: 你土地所产初熟之物的头一份[a]，要带到雅威你神的殿中。不可把小山羊[b]煮在它母亲的奶里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你土地上初熟的果实。”
    reason: 原文“头一份”和“初熟之物”紧密相连；汉语可合并表达为“初熟的果实”。
  - marker: b
    text: 希伯来文作“山羊羔”；该词在某些语境中也可泛指幼小的牲畜。
    reason: 说明 גְּדִי 的通常含义，并保留其词义范围在少数语境中可能较宽的事实。
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: 初熟之物中最先的一份
  rationale: 保留原文两个相连词语的叠加表达：רֵאשִׁית 指最先的部分，בִּכּוּרֵי 指初熟的出产；不将其解释性地译成“最好的”。
- source_word: אַדְמָתְךָ
  choice: 你土地上
  rationale: 这里指产生农作物的土地；“土地上”在现代汉语中自然，也保留农业语境，避免仅理解为疆域。
- source_word: תָּבִיא
  choice: 要带到
  rationale: 未完成式在律法语境中表达命令；“要”清楚传达规范性要求，同时不过度加强语气。
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: 雅威你神的殿
  rationale: בַּיִת 本义为“房屋”，在此指敬拜场所；“殿”是自然庄重的汉语表达，且不必限定为后来耶路撒冷的石造圣殿。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现神的专名，区别于称号“主”。
- source_word: לֹא תְבַשֵּׁל
  choice: 不可……煮
  rationale: בשל 在此表示煮或烹煮；“煮”准确配合后面的“在奶里”，并保留禁令形式。
- source_word: גְּדִי
  choice: 山羊羔
  rationale: 该词通常指幼小的山羊；“山羊羔”比单说“羔子”更明确，也避免误解为绵羊羔。
- source_word: בַּחֲלֵב אִמּוֹ
  choice: 在它母亲的奶里
  rationale: 直接保留原文具体意象和所属关系，不添加对禁令目的的解释。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名；音译“雅威”保留其作为专名的性质，而不以称号代替。
- issue: 不可把山羊羔煮在母奶里的禁令如何理解
  choice: 按原文直译禁令，不说明其原因
  alternative: 解释为反对迦南仪式、禁止残酷行为，或概括为饮食分类规定
  rationale: 本节没有交代禁令的背景或目的；译文应保留这一开放性，不把后来的解释写入正文。
- issue: רֵאשִׁית בִּכּוּרֵי 是否含有“最好”的意思
  choice: 最先的一份
  alternative: 最好的一份
  rationale: 原文直接强调首先或起初的部分；虽可能连带有精选、上好之意，但译作“最好”会把含义明确化到超过原文。
translation_notes:
  register: 采用现代、庄重而易懂的律法语体。“要”与“不可”清楚表达正面命令和禁令；句式尽量贴近希伯来文的两个分句，同时避免生硬的逐词对应。
