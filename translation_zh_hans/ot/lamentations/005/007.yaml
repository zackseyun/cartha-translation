  text: אֲבֹתֵ֤י/נוּ חָֽטְאוּ֙ אינ/ם אנחנו עֲוֺנֹתֵי/הֶ֥ם סָבָֽלְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/007.yaml
  text: Our fathers sinned[a], and they are no more; but we bear their iniquities.
translation:
  language: zh_hans
  text: 我们的父辈犯了罪，如今已不在了；我们却担当他们的罪孽。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们却承受他们罪孽的惩罚／后果。”希伯来语“罪孽”一词也可指罪责，或罪所带来的重担和后果。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵינוּ
  choice: 我们的父辈
  rationale: “父辈”保留了希伯来语的亲缘和代际意味，也可涵盖先祖；比“祖先”更贴近原文“父亲们”的表达，同时符合现代汉语。
- source_word: חָטְאוּ
  choice: 犯了罪
  rationale: 准确表达 חטא 的完成式动作，并自然呈现哀歌对过去罪行的回顾。
- source_word: אֵינָם
  choice: 如今已不在了
  rationale: 原文字面为“他们不在”，语境中委婉表示他们已经去世；此译法庄重、自然。
- source_word: אֲנַחְנוּ
  choice: 我们却
  rationale: 独立人称代词带有强调和对比作用；以“却”明确呈现父辈已逝与后人承担之间的反差。
- source_word: עֲוֺנֹתֵיהֶם
  choice: 他们的罪孽
  rationale: עָוֹן 可指罪孽、罪责，也可延伸至罪所带来的惩罚或后果。正文采用较贴近词形且能保留多义性的“罪孽”，脚注说明其语义范围。
- source_word: סָבָלְנוּ
  choice: 担当
  rationale: סבל 表示承受、背负重担。“担当”保留了承担重负的意象，又比单纯译作“受苦”更贴近原文。
theological_decisions:
- issue: 本节是否断言后人直接承受先人的罪责，还是承受先人罪恶所造成的惩罚或后果
  choice: 正文译作“担当他们的罪孽”，保留原文在罪孽、罪责及其后果之间的张力。
  alternative: “承受他们罪孽的惩罚／后果”或“因他们的罪受苦”
  rationale: עָוֹן 的语义可涵盖罪本身、罪责及其结果；哀歌的措辞并未明确限定其中一种。翻译不应替原文作出特定教义判断。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“父辈”保留代际与亲缘色彩；分号和“却”呈现两句之间强烈的对照。脚注标记置于相关分句之后。
