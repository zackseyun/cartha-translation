  text: הֲשִׁיבֵ֨/נוּ יְהוָ֤ה אֵלֶ֨י/ךָ֙ ו/נשוב חַדֵּ֥שׁ יָמֵ֖י/נוּ כְּ/קֶֽדֶם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/021.yaml
  text: Restore us to yourself[a], O Yahweh, that we may return[b]; renew our days as of old.
translation:
  language: zh_hans
  text: 耶和华啊，求你使我们归向你，我们就会归回[a]；求你更新我们的日子，如同往昔[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我们就会归回”也可译作“好让我们归回”或“我们必归回”。
    reason: 原文连接结构可表示结果或目的，也可作为并列的将来陈述。
  - marker: b
    text: “如同往昔”也可译作“像从前一样”或“如同先前的日子”。
    reason: כְּקֶדֶם表示与从前或往昔的情形相同。
lexical_decisions:
- source_word: הֲשִׁיבֵנוּ
  choice: 使我们归向
  rationale: 这是שׁוב的使役式祈使形，带第一人称复数宾语后缀，意为“使我们回转、带我们归回”。结合אֵלֶיךָ，译为“使我们归向你”，保留向上帝回转的方向和关系含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文中通行且庄重的形式音译上帝的专名，不以一般性称号替代。
- source_word: אֵלֶיךָ
  choice: 你
  rationale: 介词אֶל加第二人称阳性单数后缀，直指“向你、到你那里”；与“归向”组合后自然表达其方向。
- source_word: וְנָשׁוּב
  choice: 我们就会归回
  rationale: Qal未完成式第一人称复数前有连接词וְ，可表达前一祈求所带来的结果，也可理解为并列的将来陈述。“就会”自然呈现结果关系，同时不把语气强化为绝对保证。
- source_word: חַדֵּשׁ
  choice: 更新
  rationale: חדש的Piel祈使形，意为“更新、使恢复如新”；“更新”直接而庄重，并与“我们的日子”搭配。
- source_word: יָמֵינוּ
  choice: 我们的日子
  rationale: 保留原文具体意象，不直接意译为“生活”或“岁月”。后文用“它们”照应复数含义。
- source_word: כְּקֶדֶם
  choice: 像从前一样
  rationale: 意为“像先前、像往昔”；此译法符合现代汉语，也保留对昔日光景的回望。
theological_decisions:
- issue: וְנָשׁוּב中上帝使人归回与人归回之间的关系
  choice: 译作“我们就会归回”，表达上帝行动所带来的结果
  alternative: “好让我们归回”或“我们必归回”
  rationale: 原文可理解为祈使句之后的结果、目的或并列陈述。正文采用自然的结果表达，脚注保留目的性理解，避免将经文的神学张力限定为某一种体系。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。两个“归”字有意保留原文同一词根שׁוב在使役式与普通式中的重复，以呈现诗句的呼应；使用“求你”明确汉语祈求语气。
