base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/006.yaml
  text: We have given the hand to Egypt and to Assyria[a], to get enough bread.
translation:
  language: zh_hans
  text: 我们向埃及和亚述伸手[a]，为要吃饱饭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“把手给埃及和亚述”，可表示向他们臣服、与他们结盟，或向他们求助。
    reason: 说明希伯来语惯用表达及其未完全确定的语义范围。
lexical_decisions:
- source_word: מִצְרַיִם
  choice: 埃及
  rationale: 专有地名，采用现代汉语通行译名。
- source_word: נָתַנּוּ
  choice: 伸手
  rationale: 这是完成体第一人称复数，结合 יָד 构成惯用表达；汉语用“伸手”保留手的意象，也自然表达已经转向他国求援的行动。
- source_word: יָד
  choice: 手
  rationale: 原文直译为“手”。与 נתן 连用时，可涉及臣服、结盟或求助；正文保留具体意象，不把多重含义限定为其中一种。
- source_word: אַשּׁוּר
  choice: 亚述
  rationale: 专有地名，采用现代汉语通行译名。
- source_word: לִשְׂבֹּעַ
  choice: 吃饱
  rationale: 不定式表示目的，基本义为“饱足、得到满足”；与“饼”连用时译作“吃饱”具体而自然。
- source_word: לָחֶם
  choice: 饼
  rationale: 保留原文表示饼或主食的具体名词，不泛化为“食物”；“有饼吃饱”在饥荒语境中清楚表达获得足够口粮。
theological_decisions:
- issue: “把手给”这一惯用语的具体含义
  choice: 正文译作“向……伸手”，并以脚注说明可能表示臣服、结盟或求助。
  alternative: 直接译作“投靠”“臣服于”或“向……求助”。
  rationale: 原文惯用语在本节可能兼含政治臣服、寻求联盟和求援等意思；不宜在正文中排除其他真实可能。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“向……伸手”保留原文意象和语义张力；“为求有饼吃饱”明确呈现目的关系，并保持饥荒处境中的具体画面。
