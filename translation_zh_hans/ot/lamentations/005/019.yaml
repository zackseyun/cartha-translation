  text: אַתָּ֤ה יְהוָה֙ לְ/עוֹלָ֣ם תֵּשֵׁ֔ב כִּסְאֲ/ךָ֖ לְ/דֹ֥ר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/019.yaml
  text: But you[a], O Yahweh, sit enthroned forever; your throne is from generation to generation.
translation:
  language: zh_hans
  text: 耶和华啊，你永远坐着为王[a]；你的宝座存到世世代代。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你永远长存”。原文动词的字面意思是“坐”，但与下句的“宝座”相呼应，在这里带有坐在宝座上掌权的意味。
    reason: 保留动词“坐”的字面义，并说明语境所显示的王权含义及“长存”的可选理解。
lexical_decisions:
- source_word: אַתָּה
  choice: 但你
  rationale: 独立人称代词置于句首，带有强调和对比意味；结合上下文，用“但你”自然传达这一语用力量。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行且可辨识的音译呈现四字神名，不以“主”这一称号替代。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 此处表示无尽的延续；“永远”简洁自然，并符合诗歌语体。
- source_word: תֵּשֵׁב
  choice: 坐着为王
  rationale: ישׁב的字面意思是“坐、居住”，而下半句的“宝座”表明这里具有登基掌权的王权含义；“坐着为王”既保留“坐”的意象，也表达语境中的王权意味。
- source_word: כִּסְאֲךָ
  choice: 你的宝座
  rationale: 直接对应“宝座”及第二人称阳性单数后缀。
- source_word: לְדֹר וָדֹר
  choice: 直到世世代代
  rationale: 希伯来语惯用语表示历代相继、绵延不绝；“直到世世代代”是自然庄重的现代汉语表达。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名，因此正文保留专名形式；采用现代汉语读者最熟悉的音译“耶和华”，而不以称号“主”替代。
- issue: 是否明确 תֵּשֵׁב 的王权含义
  choice: 坐着为王
  alternative: 坐着；长存
  rationale: 与下半句“你的宝座”平行，显示此动词在这里不只是静态的“坐”，而带有君王坐在宝座上掌权的意味；同时以脚注保留较字面的译法和可能的延续性理解。
- issue: 是否给第二分句补出“长存”
  choice: 你的宝座直到世世代代
  alternative: 你的宝座存到世世代代
  rationale: 希伯来文第二分句没有另一个表示“长存”的动词；采用汉语可成立的省略式表达，以免把推断出的动词写进正文。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“坐着为王”保留希伯来诗句的具体意象；第二分句不补入原文没有的“长存”一词。脚注标记[a]已在正文对应位置出现。
