  text: זְקֵנִים֙ מִ/שַּׁ֣עַר שָׁבָ֔תוּ בַּחוּרִ֖ים מִ/נְּגִינָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/014.yaml
  text: The elders have ceased from the gate[a], the young men from their music.
translation:
  language: zh_hans
  text: 城门口不再有长老，青年也不再奏乐[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“歌唱”；希伯来词可泛指音乐或音乐演奏，常尤指器乐。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  choice: 长老
  rationale: 此复数名词既指年长者，在城门这一公共与议事场景中也可能含有群体领袖的身份；“长老”兼顾年龄与社会职分。
- source_word: מִשַּׁעַר
  choice: 城门口
  rationale: 城门是城中公共生活和审断事务的场所。“城门口”符合现代汉语习惯，又不把这一背景意义明说进正文。
- source_word: שָׁבָתוּ
  choice: 不再有
  rationale: 该动词表示停止、止息；结合介词“从”和地点“城门”，译为“城门口不再有长老”自然表达长老已不再出现在惯常位置，同时避免增添原文没有的“坐”或“聚集”。
- source_word: בַּחוּרִים
  choice: 青年
  rationale: 该词指正值青春年华的年轻男子；“青年”简洁庄重，并与“长老”形成鲜明对照。
- source_word: מִנְּגִינָתָם
  choice: 不再奏乐
  rationale: נְגִינָה 可指音乐、演奏或歌唱，且常涉及器乐。“奏乐”在本句中自然凝练，并保留音乐活动止息的意象；其他可能含义列入脚注。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将希伯来语“长老从城门止息”重组为“城门口不再有长老”，既保留人物从公共生活场所消失的含义，也避免生硬直译；后半句以“也不再”呈现原诗的平行结构。
