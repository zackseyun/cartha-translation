base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/017.yaml
  text: Because of this our heart has become sick[a]; because of these things our eyes have grown dim.
translation:
  language: zh_hans
  text: '为此，我们的心病了；

    因这一切，我们的眼睛昏暗了。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为此，我们的心衰弱；因这一切，我们的眼睛变暗。”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֶה
  choice: 为此
  rationale: 介词 עַל 与指示词 זֶה 在此表示原因或缘由；“为此”简洁自然，并保留诗句的凝练语气。
- source_word: הָיָה דָוֶה
  choice: 病了
  rationale: היה 与谓语形容词 דוה 表示进入并处于病弱、衰残的状态；“病了”保留身体性的隐喻，也不把含义缩减为单纯的悲伤。
- source_word: לִבֵּנוּ
  choice: 我们的心
  rationale: “心”直接保留希伯来语关于人内在生命的传统意象，在现代汉语中也清楚可懂。
- source_word: עַל אֵלֶּה
  choice: 因这一切
  rationale: 重复的 עַל 再次表达原因；复数指示词 אֵלֶּה 指向前述诸般灾祸，“这一切”在汉语中自然且保留其概括性。
- source_word: חָשְׁכוּ
  choice: 昏暗了
  rationale: 该动词本义是“变暗”；与“眼睛”连用时，“昏暗了”既保留暗淡的意象，也可涵盖悲痛、衰弱造成的视力昏花。
- source_word: עֵינֵינוּ
  choice: 我们的眼睛
  rationale: 直译以保留哀歌中与“心”相呼应的身体意象。
