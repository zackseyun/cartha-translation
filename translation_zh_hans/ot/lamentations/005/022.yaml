  text: unless you have utterly rejected us and are exceedingly angry with us[a][b].
translation:
  language: zh_hans
  text: 除非你彻底弃绝了我们，向我们极其发怒。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为，如果你彻底弃绝了我们，向我们极其发怒。”这样理解时，本句较像一个相对独立的陈述，而不是对上一节祈求所加的例外条件。
    reason: alternative_reading
  - marker: b
    text: “向我们”直译可作“在我们之上”，在愤怒的语境中也可理解为“敌对我们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 除非
  rationale: 结合上一节的复兴祈求，此处自然可作例外或限制性从句；“除非”在现代汉语中简洁地保留这种衔接关系。
- source_word: מָאֹס מְאַסְתָּנוּ
  choice: 你彻底弃绝了我们
  rationale: 同根不定式绝对式与限定动词连用，强化“弃绝”的动作；“彻底”传达强调语气，“弃绝”也契合哀歌中的关系性与盟约性语境。
- source_word: קָצַפְתָּ
  choice: 大发烈怒
  rationale: 该动词表示强烈发怒；结合 עַד מְאֹד，以“大发烈怒”自然表达完成体所呈现的现实状态及其强度。
- source_word: עָלֵינוּ
  choice: 向我们
  rationale: על 与愤怒动词连用可表示怒气所针对的对象；“向我们”较贴近原有空间意象，同时符合现代汉语表达。
- source_word: עַד מְאֹד
  choice: 大…烈
  rationale: 该短语极力加强愤怒的程度；汉语用“大发烈怒”的整体结构表达“极其、非常”的诗性力度，避免生硬直译。
theological_decisions:
- issue: 本节应作承接上一节的例外从句，还是相对独立的陈述
  choice: 译作承接上一节祈求的例外从句：“除非你……”
  alternative: 译作较独立的条件或说明句：“因为，如果你彻底弃绝了我们……”
  rationale: כִּי אִם 在此可自然表达“除非”，使结尾继续上一节的复兴祈求，并保留上帝是否已最终弃绝百姓这一悬而未决的张力；脚注同时保留另一种句法理解。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体语言。“彻底弃绝”保留原文同根重复所表达的强调；“大发烈怒”凝练呈现强烈怒气。句首“除非”有意使本节在语法和思想上承接上一节，并以句号结束全诗，保留其开放而沉重的结尾。
