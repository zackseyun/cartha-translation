  yaml_path: translation/ot/lamentations/005/016.yaml
  text: The crown has fallen from our head[a]. Woe to us[b], for we have sinned.
translation:
  language: zh_hans
  text: 我们头上的冠冕已经坠落[a]。哀哉！我们有祸了[b]，因为我们犯了罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们头上的冠冕坠落了。”希伯来语直译为“我们头的冠冕”，是诗性的领属结构。
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们有祸了！”原文以加强语气的哀叹呼声表达此意。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָפְלָה
  choice: 已经坠落
  rationale: 这是נפל的Qal完成式阴性单数，与阴性主语“冠冕”一致；“已经坠落”既表达动作已经发生，也保留其后果延续至今的哀歌语气。
- source_word: עֲטֶרֶת רֹאשֵׁנוּ
  choice: 我们头上的冠冕
  rationale: 希伯来语直译为“我们头的冠冕”，其中“头”为带第一人称复数词尾的集合性单数。汉语译作“我们头上的冠冕”自然且保留冠冕所象征的尊荣或王权，不将象征意义明说。
- source_word: אוֹי נָא לָנוּ
  choice: 我们有祸了
  rationale: אוֹי是哀叹呼声，נָא在此加强语气；“我们有祸了”简洁地传达灾祸与悲痛，也保留呼号性质。
- source_word: כִּי
  choice: 因为
  rationale: 此处自然地引出哀祸的原因，保留明确的因果关系。
- source_word: חָטָאנוּ
  choice: 我们犯了罪
  rationale: 这是חטא的Qal完成式第一人称复数，明确表达群体认罪；“犯了罪”是现代汉语中清楚、庄重而不迂曲的说法。
theological_decisions:
- issue: 群体认罪与责任
  choice: 保留“因为我们犯了罪”这一明确的群体认罪及因果联系。
  alternative: 将本句处理为主要描述处境的哀叹，弱化认罪意味。
  rationale: 希伯来文本明确以第一人称复数承认犯罪，并用כִּי把犯罪与所哀叹的灾祸相连；译文不扩大这一联系，也不加以淡化。
- issue: 冠冕意象的具体所指
  choice: 保留“冠冕”的诗性意象，不在正文中限定为王权、尊荣或某一具体制度。
  alternative: 直接解释为“我们的荣耀”或“我们的王权”。
  rationale: 原文意象容许尊荣、地位或王权等联想，但本节没有把所指限定为其中之一；保留意象可避免过度释义。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体。“坠落”比“掉下”更符合诗歌语域；感叹号体现原文的强烈哀呼。保留集合性单数“头”及“冠冕”意象，同时用脚注说明可行的语序和哀叹译法。
