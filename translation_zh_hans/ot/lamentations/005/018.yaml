translation:
  language: zh_hans
  text: 因为锡安山荒凉了[a]，狐狸在山上行走。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “狐狸”也可译作“豺”；这里的希伯来词在某些语境中可能指较广义的犬科动物，但本处正文采用通常的译法“狐狸”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: 因为
  rationale: 此处承接上一节的哀叹，说明心中悲痛、眼目昏花的缘由；按语境译作因果连词“因为”，比直译“在……之上”更符合本句功能。
- source_word: הַר צִיּוֹן
  choice: 锡安山
  rationale: 这是该地名在现代汉语圣经语境中的自然、通行表达，准确保留专名和“山”的含义。
- source_word: שֶׁשָּׁמֵם
  choice: 荒凉了
  rationale: 该关系结构描述锡安山处于荒废无人、满目凄凉的状态；“荒凉了”既体现已发生的变故，也保留当前持续的结果。
- source_word: שׁוּעָלִים
  choice: 狐狸
  rationale: 这是 שׁוּעָלִים 最直接、常见的对应词；但该希伯来词在某些语境中也可能泛指豺类，故以脚注保留词义空间。
- source_word: הִלְּכוּ
  choice: 出没
  rationale: 原动词基本义为“行走、来往”。在荒废之地以野兽为主语时，“出没”是自然的现代汉语表达，传达来往其间的景象，同时不加入捕猎等额外含义。
- source_word: בוֹ
  choice: 在山上
  rationale: 代词所指为锡安山；汉语明确重述“山”，比“在其上”或“在它上面”更自然，也准确表达野兽在山上活动。
