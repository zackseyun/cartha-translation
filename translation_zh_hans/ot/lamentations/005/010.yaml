  text: Our skin is as hot as an oven because of the burning heat of famine[a].
translation:
  language: zh_hans
  text: 我们的皮肤因饥荒的灼热而像火炉般发烫[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的皮肤像火炉一样被烤焦，是因饥荒的灼热。”原文中译作“发烫”和“灼热”的词都很少见，可能着重描写灼烧般的热，也可能指饥饿所致如高热般的感觉。
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרֵנוּ
  choice: 我们的皮肤
  rationale: עוֹר指皮肤或兽皮；这里说人的身体，译作“皮肤”自然准确。
- source_word: כְתַנּוּר
  choice: 热得像火炉
  rationale: כְ表示比较；结合动词所表达的灼热状态，在汉语中补出“热得”，比直译“像火炉”更清楚自然。
- source_word: נִכְמָרוּ
  choice: 焦灼
  rationale: כמר的这个被动词形罕见，可指受热、灼烧或焦黑；“焦灼”保留身体被热力煎熬的意象，同时不把含义限定为变黑。
- source_word: מִפְּנֵי
  choice: 因
  rationale: 此处引出原因，简洁译作“因”。
- source_word: זַלְעֲפוֹת
  choice: 灼热
  rationale: 该罕见词可指炽热、热浪，也可能带有高热般的身体感受；“灼热”既贴合火炉意象，也避免擅自确定为“发烧”。
- source_word: רָעָב
  choice: 饥荒
  rationale: 此处处于全城灾难的哀歌语境，指造成饥饿与身体衰败的饥荒，而不只是个人的饥饿感。
