base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/008.yaml
  text: Slaves rule over us[b][a]; there is no one to rescue us from their hand.
translation:
  language: zh_hans
  text: 奴隶[a]统治我们；没有人能救我们脱离他们的手[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“仆人”。希伯来语 עֲבָדִים 可指奴隶或仆人；这里“奴隶”强调社会地位倒置所带来的羞辱。
    reason: lexical_alternative
  - marker: b
    text: “从他们的手中”是说脱离他们的权势或控制。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים
  choice: 奴仆
  rationale: עֶבֶד 可指奴隶或仆人。现代汉语“奴仆”兼具受役使者的身份和卑微色彩，能保留此处社会地位倒置所带来的羞辱感，同时不把原词在具体制度上的含义限定得过死。
- source_word: מָשְׁלוּ בָנוּ
  choice: 辖制我们
  rationale: משׁל 与介词 ב 连用，表示对人施行统治。“辖制”自然地传达此处压迫性的掌权，而不仅是中性的治理。
- source_word: פֹּרֵק
  choice: 救出
  rationale: פרק 的分词在这里作名词性用法，指把人从他者权势下解救出来的人；结合 מִיָּדָם，译作“从……手中救出”符合现代汉语习惯。
- source_word: אֵין
  choice: 无人能
  rationale: 存在否定词 אֵין 与名词性分词连用，表示没有施行解救的人；“无人能”简洁地表达这一绝望处境。
- source_word: מִיָּדָם
  choice: 从他们手中
  rationale: יָד 在此既保留“手”的意象，也惯用地表示权势或控制。“从他们手中”在汉语中同样通顺，并能兼顾字面意象与比喻意义。
theological_decisions: []
translation_notes:
  register: 采用庄重、简洁的现代标准汉语。“辖制”保留哀歌中的压迫感；分号呈现原文两个紧密相连的分句。脚注标记按其所解释的词语分别置于“奴仆”和“手中救出我们”之后。
