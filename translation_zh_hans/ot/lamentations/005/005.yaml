  yaml_path: translation/ot/lamentations/005/005.yaml
  text: We are pursued at our necks[a]; we are weary[b]; no rest is given to us.
translation:
  language: zh_hans
  text: 我们被追赶，追逼直抵我们的颈项[a]；我们疲惫不堪，得不到安歇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为：“在我们的颈项上，我们被追赶。”希伯来文以鲜明的意象描写追赶者紧紧逼近他们。
    reason: lexical_alternative
  - marker: b
    text: 末句也可译为：“我们不得安歇”或“安歇未赐给我们。”
    reason: alternative_reading
lexical_decisions:
- source_word: עַל צַוָּארֵינוּ
  choice: 紧逼我们的颈项
  rationale: 直译为“在我们的颈项上”在现代汉语中生硬；“紧逼我们的颈项”保留颈项受压、敌人迫近的具体意象，又符合汉语表达。
- source_word: נִרְדָּפְנוּ
  choice: 追赶我们
  rationale: 该词在此为被追赶、被追逐之意。借助前置主语“仇敌”，用主动式表达希伯来语被动含义，避免汉语“我们被……追赶”的拖沓。
- source_word: יָגַעְנוּ
  choice: 我们疲惫不堪
  rationale: 该动词描述劳苦或重压造成的疲乏状态；“疲惫不堪”自然传达持续追赶所导致的深度疲惫。
- source_word: לֹא הוּנַח לָנוּ
  choice: 得不到安歇
  rationale: הוּנַח 是 נוח 的使役被动式，表示获准或得到歇息。“得不到安歇”既保留被动结果，也采用自然、庄重的现代汉语。
