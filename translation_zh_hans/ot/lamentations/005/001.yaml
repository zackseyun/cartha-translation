id: LAM.5.1
reference: Lamentations 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זְכֹ֤ר יְהוָה֙ מֶֽה הָ֣יָה לָ֔/נוּ הביט וּ/רְאֵ֥ה אֶת חֶרְפָּתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/001.yaml
  text: Remember[a], O Yahweh, what has happened to us; look, and see our disgrace.
translation:
  language: zh_hans
  text: 雅威啊，求你记得我们遭遇了什么；求你垂顾，看看我们所受的凌辱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凌辱”或译“羞耻”“耻辱”；原词着重指在人前受辱、蒙羞。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: 求你记得
  rationale: 这是向雅威发出的阳性单数命令式。加“求你”符合汉语祈求语气；“记得”保留呼求上帝顾念并采取行动的含义，不将其弱化为单纯的心理回忆。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: מֶה הָיָה לָנוּ
  choice: 我们遭遇了什么
  rationale: 该短语指临到百姓身上的事或处境。“我们遭遇了什么”是自然、清楚的现代汉语，也保留哀歌对灾难经历的概括表达。
- source_word: הביט
  choice: 求你垂顾
  rationale: 该命令式要求上帝转眼关注。译作“垂顾”既保留恳求的庄重语气，也与下一个“看看”形成两个相连而不合并的动作。
- source_word: וּרְאֵה
  choice: 看看
  rationale: 保留 ראה 的命令式及其与前一动词的平行关系；重叠式“看看”在现代汉语祈求句中自然，并带有迫切呼吁对方亲自察看的意味。
- source_word: אֶת חֶרְפָּתֵנוּ
  choice: 我们所受的凌辱
  rationale: חֶרְפָּה 可指他人加于人的责难、羞辱和公开蒙羞。“所受的凌辱”自然地表达外在羞辱及失去尊荣的处境，避免只理解为内心羞耻。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，也较接近通常重构的希伯来语读音；不以“主”这一称号替代。
- issue: “记得”是否仅指心理回想
  choice: 保留“记得”，让祈祷语境表达顾念并行动的含义
  alternative: 顾念
  rationale: זכר 在向上帝祈求时常含有请他关注并介入的语用力量，但原词仍是“记得”。正文保留其基本意象，不把隐含的行动意义完全明说出来。
translation_notes:
  register: 采用现代、庄重而易懂的祈祷语体。“求你”呈现命令式在哀求中的功能；“垂顾，看看”保留原文连续两个察看动词的平行和迫切感。
