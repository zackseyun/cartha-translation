  text: 我们的产业已转到外人手中[a]，我们的房屋也归了外来人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们的产业已转给外人，我们的房屋也转给外来人。”希伯来语动词较直译为“被转变”或“被翻转”；在这里的语境中，很可能指产业转归他人占有。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתֵנוּ
  choice: 我们的产业
  rationale: נַחֲלָה可指继承所得的产业、土地或份额。“产业”既保留具体财产和土地的含义，也能承载以色列所得基业的背景；较“遗产”更不易让现代读者只联想到死后继承。
- source_word: נֶהֶפְכָה
  choice: 已转到……手中
  rationale: הפך的尼法勒式本义是“被转变、被翻转”。在土地和房屋被他人占有的语境中，“转到……手中”自然表达所有权或控制权易手，同时以脚注保留较直译的可能。
- source_word: לְזָרִים
  choice: 外人
  rationale: זָרִים指本群体以外、无亲属或共同体关系的人。“外人”简洁自然，并与下句较强调族属差异的נָכְרִים有所区别。
- source_word: בָּתֵּינוּ
  choice: 我们的房屋
  rationale: בָּתִּים基本义为实体房屋。“房屋”贴近原文，也与上句具体的“产业”相称。
- source_word: לְנָכְרִים
  choice: 异族人
  rationale: נָכְרִים强调外来、非本族身份。“异族人”在此比笼统的“外人”更能保留两个希伯来词之间的差别，并符合亡国哀歌的语境。
