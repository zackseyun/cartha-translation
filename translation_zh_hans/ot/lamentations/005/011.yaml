  text: נָשִׁים֙ בְּ/צִיּ֣וֹן עִנּ֔וּ בְּתֻלֹ֖ת בְּ/עָרֵ֥י יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/011.yaml
  text: Women in Zion were violated[a], virgins in the cities of Judah.
translation:
  language: zh_hans
  text: 在锡安，妇女遭到凌辱[a]；在犹大各城，处女也遭到凌辱。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“遭到强奸”。希伯来语动词也可较广泛地表示使人受辱或受苦，但本节提到妇女和处女，很可能是指性侵犯。
    reason: 词义存在范围较宽的可能，同时语境强烈指向性暴力。
lexical_decisions:
- source_word: נָשִׁים
  choice: 妇女
  rationale: 该复数名词可指“妇女”或“妻子”；这里与“处女”平行，泛指女性受害者，并非特指已婚妇女。
- source_word: בְּצִיּוֹן
  choice: 在锡安（译文中作“锡安的”）
  rationale: 介词 בְּ 表示事件发生的地点。汉语用“锡安的妇女”自然地表达身处锡安的妇女。
- source_word: עִנּוּ
  choice: 遭到凌辱
  rationale: ענה 的 Piel 词形可表示使人受辱、受苦或侵犯；用于妇女且与处女并列时，很可能指性暴力。“遭到凌辱”既传达这一严重含义，又保留原词本身较宽的语义范围。
- source_word: בְּתֻלֹת
  choice: 处女
  rationale: 该名词直接指处女或具有此身份的少女；“处女”保留了原文所强调的性与社会身份。
- source_word: בְּעָרֵי יְהוּדָה
  choice: 犹大各城
  rationale: 该结构意为“在犹大的城邑中”。“犹大各城”简洁自然，并与前半句的地点表达形成平行。
theological_decisions: []
translation_notes:
  register: 采用庄重、清楚的现代书面汉语。“凌辱”保留原文动词的语义张力；后半句补出“也遭此凌辱”，使希伯来语省略谓语的平行结构在汉语中清晰可读。
