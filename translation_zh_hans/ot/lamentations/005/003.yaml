id: LAM.5.3
reference: Lamentations 5:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יְתוֹמִ֤ים הָיִ֨ינוּ֙ אין אָ֔ב אִמֹּתֵ֖י/נוּ כְּ/אַלְמָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/003.yaml
  text: We have become orphans[a], without a father; our mothers are like widows.
translation:
  language: zh_hans
  text: 我们成了孤儿[a]，没有父亲；我们的母亲如同寡妇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无父的孩子”。
    reason: 词义既可泛指孤儿，也常特别指失去父亲及其保护的人。
lexical_decisions:
- source_word: יְתוֹמִים
  choice: 孤儿
  rationale: 该词指失去父母一方的孩子，在希伯来语语境中常侧重失去父亲及其保护。“孤儿”是自然、庄重的现代汉语表达；脚注保留“无父的孩子”这一较具体的词义可能。
- source_word: הָיִינוּ
  choice: 成了
  rationale: היה 的完成式可表示“是／曾是”，但在灾难所造成的处境中，“成了”自然地传达进入当前状态的结果意味。
- source_word: אֵין אָב
  choice: 没有父亲
  rationale: 原文是存在否定结构，直译为“没有父亲／父亲不在”。此译简洁地保留父亲缺失这一重点。
- source_word: אִמֹּתֵינוּ
  choice: 我们的母亲
  rationale: 忠实表达第一人称复数所属关系及复数名词。
- source_word: כְּאַלְמָנוֹת
  choice: 如同寡妇
  rationale: 前缀 כְּ 表示比较。“如同寡妇”保留明喻，不把所有母亲都明确断定为实际丧偶。
theological_decisions:
- issue: “我们的母亲如同寡妇”中比较语的效力
  choice: 保留“如同寡妇”的明喻
  alternative: 我们的母亲成了寡妇
  rationale: 希伯来文明确使用比较前缀 כְּ（如同／像）。保留比较既呈现其修辞张力，也避免超出经文而断言每一位母亲的丈夫都已死亡。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“成了”体现灾祸导致的结果状态；分号保留两组平行哀诉。“如同”清楚标示比较关系。
