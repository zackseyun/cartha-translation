base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/020.yaml
  text: Why do you forget us forever? Why do you abandon us for so many days?[a]
translation:
  language: zh_hans
  text: 你为何永远忘记我们？为何离弃我们这么多日子？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“长久的日子”，意思是“很长时间”或“许多日子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: 为何
  rationale: 疑问副词引出哀诉；“为何”自然、庄重，符合向上帝发问的语气。
- source_word: לָנֶצַח
  choice: 永远
  rationale: לְ与נֶצַח组合表示持续不止；“永远”保留哀歌中强烈的修辞张力，不将其弱化为单纯的“很久”。
- source_word: תִּשְׁכָּחֵנוּ
  choice: 忘记我们
  rationale: שׁכח的Qal未完成式第二人称阳性单数，带第一人称复数宾语；汉语不强制标明现在或将来，因而可自然保留原文时态体上的开放性。
- source_word: תַּעַזְבֵנוּ
  choice: 离弃我们
  rationale: עזב可指离开、撇下或遗弃；“离弃”既清楚表达关系上的弃置，也保持哀诉的庄重和情感力度。
- source_word: לְאֹרֶךְ יָמִים
  choice: 这么多日子
  rationale: 字面意象是“日子的绵长”，表示持续很长时间；“这么多日子”在现代汉语中自然，并保留“日子”的具体意象及哀诉语气。
theological_decisions:
- issue: “永远”与“这么多日子”之间的张力
  choice: 保留“永远”与“这么多日子”的并列
  alternative: 将两处都统一译为“长久”
  rationale: 原文先用לָנֶצַח，后用לְאֹרֶךְ יָמִים，既有强烈的“永远”之问，又有漫长时日的具体表达；不宜为求一致而消除这种诗性和神学张力。
- issue: 两个未完成式的时间指向
  choice: 不添加“将要”或“还要”
  alternative: 译为“你要忘记我们到永远吗？还要离弃我们多久？”
  rationale: 希伯来语未完成式在哀诉中可涉及持续状态或未来延续；现代汉语的无时态形式能较好保留这种开放性，避免把问题单限定为未来。
translation_notes:
  register: 采用现代、庄重而易懂的哀诉语体。第二句重复“为何”，虽原文只在首句明说一次，但汉语中有助于清楚呈现两个平行问句；不加入解释性主语或缓和语。
