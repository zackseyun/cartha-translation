  register: 采用现代、庄重而易懂的哀歌语体。“扛着”“踉跄”使强迫负重的画面具体可感；“青年人／少年人”保留原文两个年龄称谓之间的区别。正文适度明示负重关系，脚注则保存 טְחוֹן 与 בָּעֵץ 的真实词义歧义。
