  text: Young men carry millstones[b][a], and boys stagger under wood.
translation:
  language: zh_hans
  text: 青年人搬运磨石[a]，少年人在木料重压下踉跄[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“青年人承担碾磨的劳役”或“青年人搬运磨具”。这里的希伯来语词与碾磨有关，既可能指碾磨的劳役，也可能指碾磨所用的器具。
    reason: lexical_alternative
  - marker: b
    text: 原文直译近于“少年人因木头（木料）而绊跌”，也可理解为“少年人与木头（木料）在一起而绊跌”。这很可能是指他们负载木料，以致步履不稳。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרִים
  choice: 青年人
  rationale: 指正值壮年的年轻男子；“青年人”自然简洁，也保留其年富力强却遭受苦役的反差。
- source_word: טְחוֹן
  choice: 磨石
  rationale: 该词与磨碎、碾磨有关，在“扛着”之后可具体理解为磨具或磨石；正文采用“磨石”呈现沉重苦役的形象，同时以脚注保留“磨谷劳役”或“磨具”的可能。
- source_word: נָשָׂאוּ
  choice: 扛着
  rationale: 此动词可表示举起、携带或承受；“扛着”适合沉重器物的语境，并鲜明呈现负重苦役。
- source_word: וּנְעָרִים
  choice: 少年人
  rationale: 与前面的“青年人”有所区别，可能指年龄更小的男孩或少年；“少年人”既保留年龄差异，也符合庄重诗歌语体。
- source_word: בָּעֵץ
  choice: 在木柴重压下
  rationale: 原文介词短语直译近于“在木头之下／因着木头”；上下文很可能描写少年背负木柴，因此用“在木柴重压下”自然表达其负重处境，但以脚注说明原文的简约和歧义。
- source_word: כָּשָׁלוּ
  choice: 踉跄
  rationale: 该动词表示绊倒、失足或衰弱不支；“踉跄”准确表现负重之下脚步不稳，而不把动作强化为已经倒下。
