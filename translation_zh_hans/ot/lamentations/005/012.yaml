  text: Princes were hung up by their hands[b][a]; the faces of elders were not honored.
translation:
  language: zh_hans
  text: 首领被吊起[a]；年长者没有受到敬重[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“首领借着（或由）他们的手被吊起”。这里的“手”通常理解为首领身体被悬吊时所涉及的部位；但语法上也可理解为施害者的手。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“年长者的脸面没有受到尊荣”。这是希伯来语表达，意指年长者没有得到应有的敬重。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  choice: 首领
  rationale: 该词可指统治者、官长或贵族。“首领”既保留其社会地位，又不把具体身份限定为王室成员。
- source_word: בְּיָדָם
  choice: 吊着双手
  rationale: 介词短语最自然地表示悬吊身体时所吊住的部位。中文以“吊着双手”传达这一暴力羞辱的场景；原文用单数集合名词“手”，中文依通常表达采用“双手”。其指代和施事关系仍有一定歧义，故加注说明。
- source_word: נִתְלוּ
  choice: 被人吊着
  rationale: 该词为תלה的尼法勒复数，表示“被悬挂、被吊起”。译文采用被动表达，避免将其缩窄为司法处决意义上的“绞死”。
- source_word: פְּנֵי זְקֵנִים
  choice: 年长者的颜面
  rationale: 保留原文“年长者的脸面”这一具体意象，同时用现代汉语“颜面”表达其尊严和社会地位。זְקֵנִים在此未必专指正式宗教或行政职位，故译作“年长者”而非“长老”。
- source_word: לֹא נֶהְדָּרוּ
  choice: 不受尊重
  rationale: הדר的尼法勒在此表示没有得到应有的尊荣或敬重。“不受尊重”自然简明，并保留原文被动语态。
