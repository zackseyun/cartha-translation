base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/004.yaml
  text: We drink our water for silver[b][a]; our wood comes at a price.
translation:
  language: zh_hans
  text: 我们的水要付钱才能喝[a]；我们的木头要付价才能得到[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“我们用银子喝我们的水”。“银子”在此指用作付款的银或钱；“我们的水”强调连本应属于自己的水也须付费。
    reason: lexical_alternative
  - marker: b
    text: 或译“我们的木头是付价才来的”。原文动词为复数“它们来”，可指木头须付价才来到或取得；原文未说明运输方式，也未明确限定为木柴。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵימֵינוּ
  choice: 水
  rationale: 原文直译为“我们的水”。结合所有格所强调的反常处境——本应可取用的水如今也须付费——汉语正文采用自然的“有水喝”，并以脚注保留“我们的水”。
- source_word: בְּכֶסֶף
  choice: 花钱
  rationale: כֶּסֶף 字面为“银子”，介词短语在此表示支付手段或代价。现代汉语“花钱”最自然地传达“用银子／付钱”的意思，脚注保留字面表达。
- source_word: שָׁתִינוּ
  choice: 才有……喝
  rationale: 完成式在哀歌语境中可描述持续的现实处境，而非仅指一次过去行为。“才有水喝”呈现其当前、受限制的状态。
- source_word: עֵצֵינוּ
  choice: 我们的木柴
  rationale: עֵץ 可泛指木头；此处与生活物资和付价取得相连，“木柴”符合语境，又不采用更专门的“木料”。
- source_word: בִּמְחִיר
  choice: 要付代价
  rationale: 原短语意为“按价／付代价”。“付代价”保留价格与损失的意味；此处主要指付费，脚注予以说明。
- source_word: יָבֹאוּ
  choice: 才运来
  rationale: 原文是第三人称阳性复数“它们来”。按中文习惯，以集合性的“木柴”搭配“运来”，表达木柴只有付价才送达；脚注保留较直译的“才来到”。
