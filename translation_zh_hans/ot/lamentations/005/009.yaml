  yaml_path: translation/ot/lamentations/005/009.yaml
  text: At the risk of our lives we get our bread[b][a], because of the sword in the wilderness.
translation:
  language: zh_hans
  text: 我们冒着生命危险取得食物[a]，因为旷野中有刀剑的威胁[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们冒着生命危险把食物带回来。”希伯来语动词既可理解为“带来”，也可较广义地理解为“取得、获得”。
    reason: lexical_alternative
  - marker: b
    text: 直译“因为旷野的刀剑”，可能是指旷野中持刀剑者所造成的危险。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנַפְשֵׁנוּ
  choice: 冒着生命危险
  rationale: 该短语在这里表示性命受到威胁，并非指以生命作为工具；这一译法符合现代汉语习惯，也保留了处境的严重性。
- source_word: נָבִיא
  choice: 取得
  rationale: בוא的使役式可表示“带来”，也可在此语境中泛指“获得、弄到”；“取得”自然涵盖获取口粮之意，同时把“带来”的可能译法保留在脚注中。
- source_word: לַחְמֵנוּ
  choice: 食物
  rationale: 原词直译为“饼”，但在本节中泛指维持生命的口粮；“食物”在现代汉语中更自然清楚。
- source_word: מִפְּנֵי
  choice: 因为
  rationale: 此处介词短语说明他们冒险获取食物的原因。
- source_word: חֶרֶב
  choice: 刀剑的威胁
  rationale: “刀剑”是暴力和杀戮的具体形象；补出“威胁”使“因为旷野中有刀剑”在现代汉语中通顺，而不把刀剑仅理解为一件静态物品。
- source_word: הַמִּדְבָּר
  choice: 旷野
  rationale: 该词指荒凉、缺乏保护的野外地区；“旷野”既保留圣经语体，也能表达危险发生的地域。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“冒着生命危险”传达希伯来语习语；“食物”清楚表达此处“饼”所代表的基本口粮。主句补出“有……的威胁”以符合汉语表达，脚注保留“旷野的刀剑”这一较直译且有歧义的结构。
