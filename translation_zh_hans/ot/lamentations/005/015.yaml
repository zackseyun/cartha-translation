base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/015.yaml
  text: The joy of our heart has ceased[a]; our dancing has turned to mourning.
translation:
  language: zh_hans
  text: 我们心中的喜乐止息了；我们的舞蹈变成了哀恸。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַת
  choice: 止息了
  rationale: 该词为Qal完成式，表示停止、不再继续；“止息了”简洁庄重，并保留结果状态。
- source_word: מְשׂוֹשׂ
  choice: 喜乐
  rationale: 该名词表示欢喜、欣悦；“喜乐”适合哀歌的诗体语域，也与后半句的“哀恸”形成鲜明对照。
- source_word: לִבֵּנוּ
  choice: 我们心中的
  rationale: 原文为单数集合概念“我们的心”；译作“我们心中的”既保留共同一心的意象，又符合现代汉语表达。
- source_word: נֶהְפַּךְ
  choice: 变成了
  rationale: Niphal完成式在此表达状态的转变；“变成了”自然呈现从欢庆到悲哀的变化。
- source_word: לְאֵבֶל
  choice: 哀恸
  rationale: אֵבֶל指哀悼、悲恸，常用于丧亡或群体灾难的语境；“哀恸”保持庄重而强烈的哀歌色彩。
- source_word: מְחֹלֵנוּ
  choice: 我们的舞蹈
  rationale: 该词指欢庆时的舞蹈；“我们的舞蹈”直接保留原文具体意象，并与“哀恸”构成诗意反差。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语；保留原文两行之间由“喜乐”转为“哀恸”的平行与反差。原英文脚注所列内容实际对应后半句的译法差异，但中文正文“舞蹈变成了哀恸”已自然涵盖该含义，无需另设脚注。
