id: LAM.1.20
reference: Lamentations 1:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רְאֵ֨ה יְהוָ֤ה כִּֽי צַר לִ/י֙ מֵעַ֣/י חֳמַרְמָ֔רוּ נֶהְפַּ֤ךְ לִבִּ/י֙ בְּ/קִרְבִּ֔/י כִּ֥י מָר֖וֹ מָרִ֑יתִי מִ/ח֥וּץ שִׁכְּלָה חֶ֖רֶב בַּ/בַּ֥יִת כַּ/מָּֽוֶת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/020.yaml
  text: Look[a], O Yahweh, for I am in distress; my inward parts are churning; my heart is overturned within me, because I have been very rebellious[b]. Outside the sword bereaves[c]; inside the house it is like death.
translation:
  language: zh_hans
  text: 雅威啊，求你垂看，因为我陷在困苦中！我的肺腑翻腾[b]，我的心在我里面翻转，因为我实在悖逆了[a]。外面，刀剑使人丧亲；屋内，如同死亡[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“因为我大大悖逆了”或“因为我严重地悖逆了”。希伯来文用同根词连用来加强“悖逆”的语气。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“我的内脏”，是以身体内部的翻腾表达深切痛苦。
    reason: cultural_note
  - marker: c
    text: 也可理解为“屋内有死亡”。希伯来原句十分简短，并有所省略。
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה
  choice: 求你垂看
  rationale: 这是向雅威发出的命令式恳求；“垂看”既保留直接呼求，也符合现代汉语庄重而自然的祈求语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，保留专名性质，不以称号替代。
- source_word: צַר לִי
  choice: 我陷在困苦中
  rationale: 表达说话者正处于逼迫、窘迫和痛苦的境况；此译自然，并保留状态性的含义。
- source_word: מֵעַי חֳמַרְמָרוּ
  choice: 我的肺腑翻腾
  rationale: מֵעַי 指体内深处，חֳמַרְמָרוּ 表示强烈搅动或翻腾；“肺腑翻腾”保留具身意象，也能传达深切痛苦。
- source_word: נֶהְפַּךְ לִבִּי בְּקִרְבִּי
  choice: 我的心在我里面翻转
  rationale: 保留“心被翻转、倾覆”的诗性意象，不将其弱化为一般的“忧愁”或“不安”。
- source_word: כִּי מָרוֹ מָרִיתִי
  choice: 因为我实在悖逆了
  rationale: 同根不定式绝对形与限定动词连用，加强“悖逆”的程度；“实在”以自然汉语体现强调。
- source_word: מִחוּץ שִׁכְּלָה חֶרֶב
  choice: 外面，刀剑使人丧亲
  rationale: 保留“外面”与“屋内”的对照；שִׁכְּלָה 表示使人遭受丧失亲人、尤其丧子的痛苦，“使人丧亲”避免在正文中过度限定。
- source_word: בַּבַּיִת כַּמָּוֶת
  choice: 屋内，如同死亡
  rationale: כַּ־明确带有比较义“如同”；原句简短省略，译文也保持其凝练和不完全展开的诗意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名而非“主”这一称号；“雅威”较直接地按通行学术重构音译，同时不把专名改作称号。
- issue: 承认悖逆与受苦之间的关系
  choice: 保留“因为”所表达的因果关系
  alternative: 弱化为仅仅并列的自责
  rationale: 原文 כִּי 将内心翻腾与说话者严重悖逆联系起来；译文保留这一神学张力，但不进一步断定每一项灾祸的具体因果机制。
- issue: 屋内 כַּמָּוֶת 的理解
  choice: 如同死亡
  alternative: 屋内就是死亡／屋内有死亡
  rationale: 前缀 כַּ־通常表示比较，因此正文保留明说的比喻；同时以脚注说明原句省略而容许较强的理解。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。以“外面／屋内”维持平行对照，以“肺腑翻腾”“心在我里面翻转”保存希伯来诗歌的具身意象；标点帮助现代读者辨认呼求、原因和内外对照。脚注标记均置于所解释的对应短语之后。
