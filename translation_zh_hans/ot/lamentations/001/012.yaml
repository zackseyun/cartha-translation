id: LAM.1.12
reference: Lamentations 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ל֣וֹא אֲלֵי/כֶם֮ כָּל עֹ֣בְרֵי דֶרֶךְ֒ הַבִּ֣יטוּ וּ/רְא֗וּ אִם יֵ֤שׁ מַכְאוֹב֙ כְּ/מַכְאֹבִ֔/י אֲשֶׁ֥ר עוֹלַ֖ל לִ֑/י אֲשֶׁר֙ הוֹגָ֣ה יְהוָ֔ה בְּ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/012.yaml
  text: Is it nothing to you[a], all you who pass by on the road? Look and see whether there is any sorrow like my sorrow, which was dealt to me[b], with which Yahweh afflicted me in the day of his fierce anger.
translation:
  language: zh_hans
  text: '“所有过路的人哪，这与你们无关吗[a]？


    你们看一看，瞧一瞧：


    有没有痛苦像我的痛苦，


    那是雅威在他烈怒的日子使我受的、


    加在我身上的痛苦[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文开头是省略句，直译近于“不是对你们”。也可理解为：“所有过路的人哪，这不值得你们关心吗？”
    reason: 说明希伯来文省略式反问的歧义及另一种自然理解。
  - marker: b
    text: “加在我身上的”也可译作“严厉施于我的”或“使我遭受的”。这一分句没有明说施事者；下一分句明确说是雅威使说话者受苦。
    reason: 保留 עולל 的语义范围、该分句未直接标明主语的特点，并说明与后续分句的关系。
lexical_decisions:
- source_word: לֹוא אֲלֵיכֶם
  choice: 这与你们毫不相干吗
  rationale: 原文开头是省略式表达，直译近于“不是对你们”。在语境中，这是向过路者发出的反问和恳求；此译保留其突兀、责问的语气，而不把“关切”或“同情”明说出来。
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: 所有过路的人哪
  rationale: 保留“道路上经过的人”这一具体形象；句末“哪”自然体现直接呼告。
- source_word: הַבִּיטוּ וּרְאוּ
  choice: 你们要观看，仔细看看
  rationale: 两个并列命令都予以表达，并以“仔细”传达 הַבִּיטוּ 所含的专注察看之意，避免在中文中成为意义完全重复的生硬短语。
- source_word: אִם יֵשׁ
  choice: 可有
  rationale: 在命令语之后引出间接疑问和比较；“可有”简洁而有哀歌的修辞力度。
- source_word: מַכְאוֹב ... כְּמַכְאֹבִי
  choice: 痛苦……像我的痛苦
  rationale: מַכְאוֹב 可指身体或内心的疼痛、苦楚；“痛苦”保留这种宽度，并照原文重复关键词。
- source_word: אֲשֶׁר עוֹלַל לִי
  choice: 就是加在我身上的
  rationale: עולל 在此表示严厉对待或施加苦难。此处采用不明说施事者的表达，以保留原文这一分句在语法上未直接点明主语的特点。
- source_word: אֲשֶׁר הוֹגָה
  choice: 使我受的
  rationale: יגה 的使役式表示使人忧伤、受苦。中文结合前面的“痛苦”译作“使我受的”，自然表达因果关系，并避免不必要地重复“痛苦”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: בְּיוֹם חֲרוֹן אַפּוֹ
  choice: 在他烈怒的日子
  rationale: חֲרוֹן אַף 是表示怒气炽烈的固定表达；“烈怒”保留强度，“日子”保留审判发生的时间性。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用的是神的专名而非称号。正文采用中文传统且广为人知的专名“耶和华”，既不以“主”取代专名，也不借此加入任何宗派性解释。
- issue: 苦难的施事者
  choice: 先保留“加在我身上”未明说施事者，随后明确耶和华使我受苦
  alternative: 将两处分句都直接译成“耶和华加给我的”
  rationale: 第一个关系分句 אֲשֶׁר עוֹלַל לִי 本身没有明示主语，第二个分句才明确说出耶和华。译文保持这一推进，同时不回避经文明确把苦难归于耶和华在烈怒之日的作为。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体，并以分行呈现原文的呼告、命令、比较和解释性关系分句。“观看，仔细看看”增强直接恳求的节奏；不使用文言色彩较重的“ behold ”式表达。所有脚注标记均已置于正文相应位置。
