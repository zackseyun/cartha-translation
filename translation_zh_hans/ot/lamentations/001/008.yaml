  terminology: “耶路撒冷”“犯了大罪”“尊重”“轻视”“叹息”均合宜。对נִידָה，正文须保留礼仪不洁的语义而不物化；脚注可说明其亦可具体指经期不洁、并含隔离和遭弃绝的意象。
