base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/008.yaml
  text: Jerusalem has sinned grievously[a]; therefore she has become unclean. All who honored her despise her, because they have seen her nakedness[c][b]. She herself also groans and turns backward.
translation:
  language: zh_hans
  text: 耶路撒冷犯了大罪，因此成了礼仪上不洁的[a]。凡尊重她的，如今都轻视她，因为他们看见她赤身露体。她自己也叹息，转身向后退去[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“成了像经期中的妇人”或“成了污秽”。希伯来词兼有礼仪上不洁、被隔离和遭排斥的含义。
    reason: lexical_alternative
  - marker: b
    text: 直译：“转向后面”或“转回去”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵטְא חָטְאָה
  choice: 犯了大罪
  rationale: 同源名词与限定动词连用，加强“犯罪”的语意；译作“犯了大罪”既传达强调和严重性，也符合现代汉语表达。
- source_word: לְנִידָה
  choice: 成了不洁之物
  rationale: נִידָה可指经期所致的礼仪不洁，也可泛指污秽、被隔离或遭排斥的状态。正文保留礼仪与社会层面的“不洁”意象，具体含义列于脚注。
- source_word: מְכַבְּדֶיהָ
  choice: 尊重她的
  rationale: כבד在此指尊重、看重；“尊重”自然呈现从昔日受尊崇到如今被轻视的反差。
- source_word: הִזִּילוּהָ
  choice: 都轻视她
  rationale: 该词表达把她看为卑贱、无足轻重；“轻视”简洁地保留与“尊重”的鲜明对照。
- source_word: עֶרְוָתָהּ
  choice: 她的赤裸
  rationale: 正文保留“赤裸”的具体意象及其公开受辱、羞耻暴露的含义，不将其抽象化为单纯的“羞耻”。
- source_word: נֶאֶנְחָה
  choice: 叹息
  rationale: 该动词描写痛苦中发出的叹声；“叹息”在现代汉语中自然、庄重，也适合哀歌语境。
- source_word: וַתָּשָׁב אָחוֹר
  choice: 转身退后
  rationale: 短语直指向后转、退回；“转身退后”保留动作方向，也可让语境自然传达因羞辱而退缩的意味，而不将其解释写入正文。
theological_decisions:
- issue: 耶路撒冷受审判时的不洁意象
  choice: 正文译作“成了不洁之物”
  alternative: 成了像经期中的妇人／成了污秽
  rationale: 原词同时带有礼仪不洁、隔离和受排斥的语意。正文不把意象限定为经期，也不抹去其礼仪色彩；脚注保留更具体的可能译法。
- issue: 赤裸与羞辱的意象
  choice: 保留“她的赤裸”
  alternative: 她的羞耻／她的隐私部位
  rationale: 原文以身体暴露表达公开羞辱。直译意象可保留诗句张力，避免把具体比喻过早解释成抽象概念。
- issue: 末句退后的动作
  choice: 译作“转身退后”
  alternative: 转身离去／退缩
  rationale: 原文明确包含“向后”的方向，不确定它仅指离去、羞愧退缩还是地位倒退，因此正文保留可见动作，不替原文消除歧义。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“犯了大罪—不洁—轻视—赤裸—叹息—退后”依次保留原诗从罪、审判到公开羞辱的推进。代词持续使用“她”，对应原文将耶路撒冷人格化为女子的表达；“她自己也”保留גַּם הִיא的递进与强调。
