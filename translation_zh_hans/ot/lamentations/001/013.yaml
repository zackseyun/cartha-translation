  text: מִ/מָּר֛וֹם שָֽׁלַח אֵ֥שׁ בְּ/עַצְמֹתַ֖/י וַ/יִּרְדֶּ֑/נָּה פָּרַ֨שׂ רֶ֤שֶׁת לְ/רַגְלַ/י֙ הֱשִׁיבַ֣/נִי אָח֔וֹר נְתָנַ֨/נִי֙ שֹֽׁמֵמָ֔ה כָּל הַ/יּ֖וֹם דָּוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/013.yaml
  text: From on high he sent fire into my bones[a], and it prevailed against them; he spread a net for my feet; he turned me back; he made me desolate[b], faint all day long.
translation:
  language: zh_hans
  text: 他从高处把火送入我的骨头，这火制伏了它们[a]；他为我的脚布下网罗，使我退后；他使我成为荒凉之地，终日衰弱[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这火压倒了它们。”这个希伯来语动词可表示统治、制伏或压倒。
    reason: lexical_alternative
  - marker: b
    text: 或译：“终日患病”或“终日衰残”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּרוֹם
  choice: 从高天
  rationale: מָרוֹם指高处、高天；这里保留神从至高之处施行审判的诗歌意象，又不直接增添原文未出现的“天上”或神名。
- source_word: שָׁלַח אֵשׁ
  choice: 降下火来
  rationale: “降下”与“从高天”自然衔接，也忠实表达שׁלח“发送、差遣”的动作和火从上而来的意象。
- source_word: בְּעַצְמֹתַי
  choice: 进入我的骨头
  rationale: 介词ב在此可表达火侵入骨中的苦楚；“进入”既贴近原文，又是自然的现代汉语。
- source_word: וַיִּרְדֶּנָּה
  choice: 并制伏了它们
  rationale: רדה可指统治、制伏或压倒；阴性单数主语承接“火”，宾语后缀可按“骨头”理解。“制伏”保留该动词较具体的支配意味。
- source_word: פָּרַשׂ רֶשֶׁת לְרַגְלַי
  choice: 在我脚前张开罗网
  rationale: 保留捕捉猎物的意象；“脚前”自然表达网针对其脚步而设，避免误解为把网直接张在脚上。
- source_word: הֱשִׁיבַנִי אָחוֹר
  choice: 使我退后
  rationale: שוב的使役式与“向后”合用，表示迫使说话者后退或折返；“使我退后”简洁并保留使役关系。
- source_word: נְתָנַנִי שֹׁמֵמָה
  choice: 他使我荒凉
  rationale: שֹׁמֵמָה可表示荒凉、毁坏或惊骇；“使我荒凉”保留耶路撒冷拟人化哀诉及其受毁后的状态。
- source_word: כָּל־הַיּוֹם דָּוָה
  choice: 终日衰弱
  rationale: דָּוָה涵盖患病、虚弱、衰残等意思；“衰弱”在此能自然表达持续的困顿，同时不把词义限缩为具体疾病。
theological_decisions:
- issue: 连续动词的隐含主语
  choice: 全节以“他”为主语，但不在本节直接指明身份
  alternative: 译作“耶和华”或“主”
  rationale: 希伯来文使用第三人称阳性单数动词，主语由上下文领会。本节没有出现神名，因此以“他”承接语境，既保留神施行审判的含义，也不向正文增添原文没有的称谓。
- issue: 火与骨头之间的语法关系
  choice: 把“火”理解为“制伏”的单数主语，把“骨头”理解为复数宾语
  alternative: 将动词理解为火在骨中施行统治，或译成较笼统的“火胜过我”
  rationale: וַיִּרְדֶּנָּה的形式和语境容许“火制伏骨头”的理解；正文据此呈现，同时脚注保留“压倒”等语义可能，避免消除原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。保留“火、骨头、罗网、荒凉”等具体诗歌意象；分号呈现连续审判动作的节奏。所有代词均不超出本节语法所明示的范围。
