source:
  edition: WLC
  text: נִשְׂקַד֩ עֹ֨ל פְּשָׁעַ֜/י בְּ/יָד֗/וֹ יִשְׂתָּֽרְג֛וּ עָל֥וּ עַל צַוָּארִ֖/י הִכְשִׁ֣יל כֹּחִ֑/י נְתָנַ֣/נִי אֲדֹנָ֔/י בִּ/ידֵ֖י לֹא אוּכַ֥ל קֽוּם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/014.yaml
  text: The yoke of my transgressions is bound by his hand[a]; they are woven together, they have come up upon my neck; he has made my strength fail[c][b]. The Lord has given me into hands from which I cannot rise.
translation:
  language: zh_hans
  text: '我过犯的轭在他手中被缚紧[a]；


    我的过犯彼此交织[b]，压在我的颈项上。


    他使我的力量衰败；


    主把我交在手中，我不能再起来[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在他手中被看守（或留意）”。这里的希伯来语动词罕见，词义难定；按上下文，“被缚紧”较为可取。
    reason: lexical_alternative
  - marker: b
    text: 或译“彼此缠结”或“扭结在一起”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“交在手中”；没有说明这些手属于谁。“我不能再起来”也可按语境理解为无法从其控制下复起。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: נִשְׂקַד
  choice: 缚紧
  rationale: 此动词罕见且词义不确定。结合“轭”、交织和压上颈项的意象，译为“缚紧”最符合上下文，同时以脚注保留“看守／留意”的可能性。
- source_word: עֹל פְּשָׁעַי
  choice: 我过犯的轭
  rationale: 保留希伯来文以“轭”表现过犯所形成之重负和辖制的核心比喻；“过犯”兼具越界和悖逆的道德含义。
- source_word: בְיָדוֹ
  choice: 由他的手
  rationale: 既保留“手”的具体意象，也自然表达施事者；阳性单数代词按上下文指向后文的“主”。
- source_word: יִשְׂתָּרְגוּ
  choice: 彼此交织
  rationale: 该罕见动词很可能指缠绕、交错或编结；“彼此交织”与过犯形成轭的图像相称。
- source_word: עָלוּ עַל צַוָּארִי
  choice: 压上我的颈项
  rationale: “压上”自然传达重轭上到并落在颈项上的动态；“颈项”保持庄重而清楚的经文语体。
- source_word: הִכְשִׁיל כֹּחִי
  choice: 使我的力量衰败
  rationale: כשל的使役式本有“使绊跌、使倒下”之意，与“力量”连用时表示使力量失效或崩溃；“衰败”保留过程和结果感。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是对上帝的尊称；“主”是现代中文圣经语体中自然、明确的对应表达。
- source_word: בִידֵי לֹא אוּכַל קוּם
  choice: 交在我无力抗拒的手中
  rationale: 将“起来”按受制于敌手的语境表达为“抗拒”，并保留复数“手”的意象及压迫者身份未明的特点。
theological_decisions:
- issue: 本节阳性单数代词所指
  choice: 将“他的／他”理解为主作为审判的施行者
  alternative: 开头的代词可作较非人格化的理解，或部分指向那轭
  rationale: 本节后半明确说“主把我交在……手中”，上下文也把耶路撒冷的苦难归于上帝的审判；如此处理使全节连贯，却不进一步说明上帝如何缚轭。
- issue: 末句“不能起来”的含义
  choice: 译作无力抗拒交付她的那些手
  alternative: 可译作“我无法再起来”，强调受压后不能复起
  rationale: 希伯来文结构简约，既可能描述无法抵挡掌权者，也可能描述无法从其控制下起来。正文采用更自然且符合“交在手中”搭配的读法，脚注说明“手”所指仍未明确。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“颈项”保留诗歌性的身体意象；分行呈现哀歌的平行结构。正文不补明压迫者身份，并借脚注保留罕见动词及末句句法上的真实歧义。
