    rationale: 原文在敌人伸手于珍爱之物后以 כִּי 引出“她看见列国进入圣所”。“竟”可表达哀叹，却不能替代“因为/由于/原来”等连接；应在中文中明确保留这一关系。
  - severity: low
    issue: “夺取”“闯进”使原文措辞更具体、更具动作色彩。
    rationale: פָּרַשׂ יָדָיו 的字面意象是“伸/展开手”，而 בָּאוּ 是“进入/来到”。虽处于敌对亵渎的语境，这些强化语可作为解释，但不宜在正文中取代较开放的原文表达。
  - severity: low
    issue: “不可进入你会众的那些人”略显搭配不完整。
    rationale: 此处禁令涉及进入/加入 קָהָל；汉语加“中”可使结构完整，并避免“会众”被误作空间性地点而仍保留原文措辞。
