revisions:
- from: 敌人伸手夺取她一切珍爱之物[a]；她竟眼看着列国之人[b]闯进她的圣所，就是你曾吩咐不可进入你会众的那些人。[c]
  to: 敌人向她一切珍爱之物伸出手来[a]；因为她看见列国的人[b]进入她的圣所，就是你所吩咐不可进入你会众中的那些人。[c]
  rationale: 修订以“因为”恢复 כִּי 的说明性功能；以“伸出手来”和“进入”保留希伯来文本的动作意象与语义开放性，不把掠夺或强闯作为正文断言。“会众”与“圣所”继续分别对应 קָהָל 与 מִקְדָּשׁ；“进入你会众中”使中文通顺，并保留对上帝的第二人称呼告。脚注锚点均保留并与相应词语对应。
  reviewer_model: gpt-5.6-terra
