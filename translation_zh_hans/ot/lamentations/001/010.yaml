  text: יָד/וֹ֙ פָּ֣רַשׂ צָ֔ר עַ֖ל כָּל מַחֲמַדֶּ֑י/הָ כִּֽי רָאֲתָ֤ה גוֹיִם֙ בָּ֣אוּ מִקְדָּשָׁ֔/הּ אֲשֶׁ֣ר צִוִּ֔יתָה לֹא יָבֹ֥אוּ בַ/קָּהָ֖ל לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/010.yaml
  text: The enemy has stretched out his hand over all her precious things[c][b][a], for she has seen nations enter her sanctuary—those whom you commanded not to enter your assembly.
translation:
  language: zh_hans
  text: 敌人向她一切珍爱之物伸出手来[a]；因为她看见列国的人[b]进入她的圣所，就是你所吩咐不可进入你会众中的那些人。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她一切宝贵之物”或“她所有珍宝”。
    reason: lexical_alternative
  - marker: b
    text: “列国的人”也可译作“外族人”或“外邦人”。
    reason: lexical_alternative
  - marker: c
    text: 参申命记23章，其中规定某些族群不可进入耶和华的会众。
    reason: cross_reference
lexical_decisions:
- source_word: יָדוֹ ... פָּרַשׂ
  choice: 伸手夺取
  rationale: 保留“伸手”的希伯来语意象，并以“夺取”表达上下文中敌意侵占的含义。
- source_word: צָר
  choice: 敌人
  rationale: 在耶路撒冷遭毁的语境中，指敌对的压迫者；“敌人”清楚自然。
- source_word: מַחֲמַדֶּיהָ
  choice: 她一切珍爱之物
  rationale: 该词泛指令人喜爱、视为宝贵的事物，不限于金银财宝；此译保留其范围。
- source_word: כִּי
  choice: 她竟
  rationale: 此处既承接前句，也突出亲眼见证亵渎性侵入的痛楚；中文以分号和“竟”自然体现这一关系，而不把逻辑限定为单纯因果。
- source_word: רָאֲתָה
  choice: 她……眼看着
  rationale: 使“她看见”在现代中文中更具现场感，并传达无力目睹灾祸的哀叹语气。
- source_word: גוֹיִם
  choice: 列国之人
  rationale: 既保留复数“列国”的基本意义，又在中文中明确是人进入圣所；避免采用可能带入后期宗教分类的“外邦人”作为正文唯一译法。
- source_word: בָּאוּ מִקְדָּשָׁהּ
  choice: 闯进她的圣所
  rationale: “进入”本身中性，但语境是未经许可的亵渎性侵入；“闯进”自然体现敌对场景，“圣所”准确表达神圣区域。
- source_word: אֲשֶׁר צִוִּיתָה לֹא יָבֹאוּ
  choice: 就是你曾吩咐不可进入……的那些人
  rationale: 将关系从句明确地连回“列国之人”，同时保留第二人称直接呼告和禁令。
- source_word: בַקָּהָל לָךְ
  choice: 你的会众
  rationale: קָהָל可指聚集的群体或共同体；“会众”在此较自然，也保留其敬拜与盟约群体色彩，而不译成教会。
theological_decisions:
- issue: 第二人称所指
  choice: 按对上帝的直接呼告处理：“你曾吩咐”“你的会众”。
  alternative: 理解为泛指或非直接引语式的命令。
  rationale: 动词为第二人称阳性单数，而“你的”所附形式因 קָהָל 为阳性名词，辅音文本的 לָךְ 形式可能存在形式上的张力；上下文仍最自然地指向对上帝的直接呼告，不应据此改为无人称表达。
- issue: 禁入会众与禁入圣所的关系
  choice: 保留经文并置：被禁止进入“你的会众”的人如今进入“她的圣所”。
  alternative: 将两者同一化，译成“不可进入你的圣所”。
  rationale: 原文分别使用 קָהָל 与 מִקְדָּשׁ，不宜在翻译中消除二者差别。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌体。“伸手夺取”兼顾原文意象和敌意行动；“竟眼看着”加强哀叹的现场感。脚注标记按首次相关词语顺序置于正文，且全部在正文出现。
