  naturalness: 修订后的“向……伸出手来”“列国的人”“进入你会众中”是自然、庄重的现代汉语，也较清楚地保留哀歌语体。
  terminology: “圣所”对应 מִקְדָּשׁ 恰当；“会众”可对应 קָהָל，且“进入……中”表达加入/进入会众的禁令，不将其与“圣所”混同。第二人称仍按对上帝的直接呼告处理。
