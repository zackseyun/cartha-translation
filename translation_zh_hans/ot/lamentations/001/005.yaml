  text: הָי֨וּ צָרֶ֤י/הָ לְ/רֹאשׁ֙ אֹיְבֶ֣י/הָ שָׁל֔וּ כִּֽי יְהוָ֥ה הוֹגָ֖/הּ עַ֣ל רֹב פְּשָׁעֶ֑י/הָ עוֹלָלֶ֛י/הָ הָלְכ֥וּ שְׁבִ֖י לִ/פְנֵי צָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/005.yaml
  text: Her foes have become the head[a]; her enemies prosper, because Yahweh has afflicted her for the multitude of her transgressions[b]. Her children have gone away into captivity before the foe.
translation:
  language: zh_hans
  text: 她的敌手成了首领；她的仇敌安逸无忧[a]，因为耶和华因她众多的悖逆使她受苦。她的幼儿[b]在敌手面前被掳而去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亨通”或“安然居住”。这个希伯来语动词可指安逸、安稳，也可指兴盛。
    reason: lexical_alternative
  - marker: b
    text: 或译：“小孩子”或“婴孩”。这个希伯来语词指年幼的孩子，突显他们的脆弱无助。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֶיהָ
  choice: 她的敌手
  rationale: צַר 指敌对者或压迫者；“敌手”简洁自然，并与下句“仇敌”构成希伯来诗歌的平行表达。
- source_word: לְרֹאשׁ
  choice: 成了首领
  rationale: 原文直译为“成为头”，表达居首、占据优势或掌权；“成了首领”保留“头”的统领意象，同时符合现代汉语。
- source_word: אֹיְבֶיהָ
  choice: 她的仇敌
  rationale: אֹיֵב 在军事和敌对语境中通常指仇敌，与前半句“敌手”平行。
- source_word: שָׁלוּ
  choice: 安逸无忧
  rationale: שלה 表示安逸、安稳或兴盛。这里首先描述敌人处境安稳；“安逸无忧”保留其安适、安全的核心语义，而不将其限定为物质兴盛。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，避免用称号替代原文专名。
- source_word: הוֹגָהּ
  choice: 使她受苦
  rationale: יגה 的使役式表示使人忧伤、受苦或遭患难；“使她受苦”清楚保留神主动施加苦难的使役意义。
- source_word: עַל רֹב פְּשָׁעֶיהָ
  choice: 因她许多的悖逆
  rationale: רֹב 表数量众多，פֶּשַׁע 常含背叛、悖逆之意；“许多的悖逆”既表达数量，也保留其关系与盟约层面的严重性。
- source_word: עוֹלָלֶיהָ
  choice: 她的幼儿
  rationale: עוֹלָל 指年幼的孩子，有时可指婴孩；“幼儿”比泛称“孩子”更准确地体现其年龄与脆弱性，又不武断限定为婴儿。
- source_word: שְׁבִי
  choice: 被掳
  rationale: שְׁבִי 表示被俘或被掳的状态；结合 הָלְכוּ，用汉语被动式“被掳……离去”自然表达他们作为俘虏被带走。
- source_word: לִפְנֵי צָר
  choice: 在敌手面前
  rationale: 直译保留“在敌手面前”的空间图像，暗示幼儿在敌人的控制下被押走，而不增添原文未明说的动作细节。
theological_decisions:
- issue: 耶路撒冷受苦中的神圣行动与人的责任
  choice: 因为耶和华因她许多的悖逆使她受苦
  alternative: 因为耶和华为她许多的悖逆使她忧伤
  rationale: 原文明确以耶和华为使她受苦的行动者，并以她众多的悖逆说明缘由。译文同时保留神的主动行动与耶路撒冷的罪责，不淡化二者之间的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，并保留哀歌的诗性平行结构。“敌手／仇敌”体现近义平行；“成了首领”保留原文的统领意象。“安逸无忧”与“使她受苦”形成处境逆转。主文本中的脚注标记[a]、[b]均与脚注对应。
