  to: 耶路撒冷在困苦、漂泊[a]的日子里，想起了她在往日所拥有的一切珍贵之物。她的百姓落在敌人手中，无人帮助她；仇敌看见她，便讥笑她的倾覆[b]。
  rationale: 修订仅澄清“从往日而有”的时间关系，避免“自古以来”可能带出的持续占有含义；并将脚注a移至其实际注释的“漂泊”之后。“珍贵之物”保留原词可指各类所珍爱、所看重之物的广度。其余措辞、诗体和两处词义不确定性均予保留。
