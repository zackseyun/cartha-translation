  text: זָֽכְרָ֣ה יְרוּשָׁלִַ֗ם יְמֵ֤י עָנְיָ/הּ֙ וּ/מְרוּדֶ֔י/הָ כֹּ֚ל מַחֲמֻדֶ֔י/הָ אֲשֶׁ֥ר הָי֖וּ מִ֣/ימֵי קֶ֑דֶם בִּ/נְפֹ֧ל עַמָּ֣/הּ בְּ/יַד צָ֗ר וְ/אֵ֤ין עוֹזֵר֙ לָ֔/הּ רָא֣וּ/הָ צָרִ֔ים שָׂחֲק֖וּ עַ֥ל מִשְׁבַּתֶּֽ/הָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/007.yaml
  text: Jerusalem remembered in the days of her affliction and her wanderings all her precious things that were from days of old[a]. When her people fell into the hand of the foe, and there was no one to help her, foes saw her[b]; they laughed at her ruin.
translation:
  language: zh_hans
  text: 耶路撒冷在困苦、漂泊[a]的日子里，想起了她在往日所拥有的一切珍贵之物。她的百姓落在敌人手中，无人帮助她；仇敌看见她，便讥笑她的倾覆[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “漂泊”或译“无家可归”；希伯来语此词罕见，含义有争议。
    reason: lexical_alternative
  - marker: b
    text: “倾覆”或译“毁灭”“荒凉”；希伯来语此词可能指耶路撒冷的崩溃或被毁后的景况。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה
  choice: 想起了
  rationale: 该词为Qal完成式第三人称阴性单数，与拟人化的耶路撒冷一致；在哀歌的叙述语境中用过去完成的动作自然贴切。
- source_word: יְמֵי עָנְיָהּ
  choice: 困苦的日子
  rationale: עֳנִי表示困苦、苦难或悲惨处境；“困苦”庄重且为现代读者易懂。
- source_word: וּמְרוּדֶיהָ
  choice: 漂泊的日子
  rationale: 此罕见词可能与流离、漂泊或无家可归有关；“漂泊”保留流亡的具体意象，不把有争议的词义解释得过窄。
- source_word: כֹּל מַחֲמֻדֶיהָ
  choice: 一切珍宝
  rationale: 可泛指所珍爱、所看重之物；“珍宝”简洁自然，但不必仅限于金银财物。
- source_word: אֲשֶׁר הָיוּ מִימֵי קֶדֶם
  choice: 自古以来的
  rationale: מִימֵי קֶדֶם指从往昔、古时而来的事物；此译保留诗意和时间纵深。
- source_word: בִּנְפֹל עַמָּהּ
  choice: 她的百姓落在
  rationale: ב加不定词结构表达时间或伴随情形；中文按上下文直接承接，既流畅又保留“落入敌手”的意象。
- source_word: בְּיַד צָר
  choice: 敌人手中
  rationale: “在某人手中”在希伯来语中表示落入其权势之下，中文同样能自然表达这一惯用意象。
- source_word: וְאֵין עוֹזֵר לָהּ
  choice: 无人帮助她
  rationale: 直接表达耶路撒冷完全孤立无援的处境。
- source_word: רָאוּהָ צָרִים
  choice: 仇敌看见她
  rationale: 保留动词“看见”的具体措辞和复数敌对者的集合意义。
- source_word: שָׂחֲקוּ
  choice: 讥笑
  rationale: 该动词本义为笑，此处明显带嘲弄意味；“讥笑”在中文中自然传达这种敌意。
- source_word: עַל מִשְׁבַּתֶּהָ
  choice: 她的倾覆
  rationale: 此名词含义有争议，可能指止息、崩溃、荒凉或毁灭状态；“倾覆”概括城市败落崩毁的景象，同时以脚注保留其他可能。
theological_decisions: []
