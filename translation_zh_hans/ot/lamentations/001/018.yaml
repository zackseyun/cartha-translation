id: LAM.1.18
reference: Lamentations 1:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: צַדִּ֥יק ה֛וּא יְהוָ֖ה כִּ֣י פִ֣י/הוּ מָרִ֑יתִי שִׁמְעוּ נָ֣א כָל עמים וּ/רְאוּ֙ מַכְאֹבִ֔/י בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י הָלְכ֥וּ בַ/שֶּֽׁבִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/018.yaml
  text: 'Yahweh is righteous[a], for I have rebelled against his word. Hear, please, all peoples[b], and see my pain: my virgins and my young men have gone into captivity.'
translation:
  language: zh_hans
  text: '耶和华是公义的，


    因为我悖逆了他口中所说的话[a]。


    万民哪，请听！


    请看我的痛苦：


    我的童女[b]和青年男子


    都被掳去了。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的口”，这里指他所说的话或所下的命令。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“我的少女”或“我的年轻女子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: 公义的
  rationale: 作表语，承认耶和华施行审判在道德上正直无误；“公义”保留其神学与圣约语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，而不以称号“主”替代。
- source_word: כִּי
  choice: 因为
  rationale: 引出耶路撒冷承认耶和华公义的理由，中文因果关系清楚自然。
- source_word: פִיהוּ
  choice: 他口中所说的
  rationale: 原文直译为“他的口”，在此转指他所说或所命令的；此译既保留“口”的意象，又让现代汉语自然可懂。
- source_word: מָרִיתִי
  choice: 我违背了
  rationale: מרה 表示对权威的反抗、悖逆；“违背”能自然地与“口中所说的”搭配，并保留道德责任。
- source_word: שִׁמְעוּ נָא
  choice: 请听
  rationale: 命令式加恳求语气词；“请听”同时表达呼吁和哀求。
- source_word: כָל עַמִּים
  choice: 万民
  rationale: 准确涵盖“所有民族/万族”，且符合中文诗歌和先知文学的庄重语体。
- source_word: מַכְאֹבִי
  choice: 我的痛苦
  rationale: 该词指疼痛、苦楚或 suffering；“痛苦”兼顾身体与心灵层面，不作过度限定。
- source_word: בְּתוּלֹתַי
  choice: 我的少女
  rationale: בתולות 可指童女、处女或年轻女子；上下文侧重城中的年轻女性群体，“少女”自然且避免不必要地只强调性经历，脚注保留较直译的可能。
- source_word: וּבַחוּרַי
  choice: 青年男子
  rationale: 与“少女”平行，指处于盛年的年轻男子；“青年男子”明确而庄重。
- source_word: הָלְכוּ בַשֶּׁבִי
  choice: 都被掳去了
  rationale: 字面为“走入被掳之中”；中文用“被掳去了”自然表达他们作为俘虏离去的处境，而不增添原文没有的细节。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。中文正文采用广为人知的专名“耶和华”，保留其为名字而非头衔的性质。
- issue: פִיהוּ 的转喻表达
  choice: 他口中所说的
  alternative: 他的话；他的命令；他的口
  rationale: “他的口”在希伯来文中转指神所说或命令的。正文保留“口”的原文意象，同时避免生硬的“违背他的口”，并以脚注说明字面和语义范围。
- issue: 被掳事件中的主体表达
  choice: 被掳去了
  alternative: 走入被掳之中；成为俘虏去了
  rationale: 原动词本身是“去/走”，但 בַשֶּׁבִי 明确说明被掳状态。中文被动表达忠实呈现其非自愿处境，不进一步说明谁实施掳掠。
translation_notes:
  register: 采用现代、庄重而易懂的诗体中文，以短行呈现哀歌的呼告和节奏。“万民哪，请听”保留直接呼语；避免古奥的“忤逆”“被掳而去”等表达。所有脚注标记均置于正文对应词句之后。
