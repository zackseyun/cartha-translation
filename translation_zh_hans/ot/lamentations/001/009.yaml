base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/009.yaml
  text: Her uncleanness was in her skirts[a]; she did not remember her end. So she came down astonishingly; there was no comforter for her. Look, O Yahweh, my affliction[c][b], for the enemy has magnified himself.
translation:
  language: zh_hans
  text: '她的污秽沾在裙摆上；她未曾想到自己的结局[a]。她惊人地坠落；无人安慰她。


    “雅威啊，求你垂看我的苦难，因为仇敌自高[c]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “结局”也可译作“未来”或“后果”。
    reason: lexical_alternative
  - marker: c
    text: “自高”也可译作“夸大自己”或“使自己显为大”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתָהּ
  choice: 她的污秽
  rationale: 该词兼有礼仪不洁与道德污秽的含义；“污秽”保留强烈的玷污意味，不把语义限于某一方面。
- source_word: בְּשׁוּלֶיהָ
  choice: 沾在裙摆上
  rationale: שׁוּל 指衣服下缘或裙摆；“沾在裙摆上”自然呈现污秽附着并显露于衣边的意象。
- source_word: לֹא זָכְרָה אַחֲרִיתָהּ
  choice: 她未曾想到自己的结局
  rationale: אַחֲרִית 可指结局、后果或未来；“结局”保留原文的简洁和终局意味，其他可能含义列入脚注。
- source_word: וַתֵּרֶד פְּלָאִים
  choice: 她竟骤然败落，令人惊骇
  rationale: ירד 的下降意象在语境中指受辱败落；פְּלָאִים 表示非同寻常、令人震惊。此译兼顾自然中文和原文惊人的坠落意象。
- source_word: אֵין מְנַחֵם לָהּ
  choice: 无人安慰她
  rationale: 准确传达实词化分词“安慰者”的功能，并以自然中文保留本书反复出现的无人安慰主题。
- source_word: רְאֵה יְהוָה אֶת עָנְיִי
  choice: 雅威啊，求你垂看我的苦难
  rationale: 命令式在此是恳求上帝关注；“垂看”符合庄重哀歌语体。עֳנִי 指困苦、苦难或受压境况。
- source_word: כִּי הִגְדִּיל אוֹיֵב
  choice: 因为仇敌妄自尊大
  rationale: גדל 的使役形式在此表达仇敌自高、自夸或得意逞强；“妄自尊大”自然传达其狂傲意味，同时脚注保留较直译的表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；采用“雅威”音译，以区别于称号，并保留以色列之神的专名性质。
- issue: 耶路撒冷由第三人称转为第一人称发言
  choice: 以引号标出“雅威啊……”
  alternative: 不加引号，沿用诗行中的人称突转
  rationale: 原文从“她”突然转为“我的苦难”，体现拟人化的耶路撒冷亲自哀求；引号仅帮助现代读者识别说话者转换，不消除这一修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。保留耶路撒冷女性拟人形象、污秽附于裙摆的具象表达，以及从第三人称叙述突然转入第一人称祈求的结构。
