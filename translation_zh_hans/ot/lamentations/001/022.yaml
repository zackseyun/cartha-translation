  to: 愿他们所行的一切恶事都来到你面前[a]；求你照着你因我一切的过犯怎样对待我，也怎样对待他们[b]。因为我的叹息众多[c]，我的心患病。
  rationale: 将“恶行”微调为“所行的一切恶事”，使其既自然表达“他们的一切恶”，又不过度把原词限定为行为类别；更关键的是将“我的心病痛不堪”改为“我的心患病”，保留原文内心如患病的隐喻，不添加“不堪”的强化意味。其余措辞、祈愿语气、因果关系及脚注锚点均可保留。
