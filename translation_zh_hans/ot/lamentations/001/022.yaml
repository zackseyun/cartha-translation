  text: תָּבֹ֨א כָל רָעָתָ֤/ם לְ/פָנֶ֨י/ךָ֙ וְ/עוֹלֵ֣ל לָ֔/מוֹ כַּ/אֲשֶׁ֥ר עוֹלַ֛לְתָּ לִ֖/י עַ֣ל כָּל פְּשָׁעָ֑/י כִּֽי רַבּ֥וֹת אַנְחֹתַ֖/י וְ/לִבִּ֥/י דַוָּֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/022.yaml
  text: Let all their evil come before you[a], and deal with them as you have dealt with me because of all my transgressions; for my groans are many[c][b], and my heart is sick.
translation:
  language: zh_hans
  text: 愿他们所行的一切恶事都来到你面前[a]；求你照着你因我一切的过犯怎样对待我，也怎样对待他们[b]。因为我的叹息众多[c]，我的心患病。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “恶事”也可译作“邪恶”或“恶行”。原词有时也可指“灾祸”，但此处较可能指他们应受追究的罪恶。
    reason: lexical_alternative
  - marker: b
    text: 也可译作：“求你照着你向我所做的，也向他们这样做。”希伯来文前后重复使用同一个动词。
    reason: lexical_alternative
  - marker: c
    text: “叹息”也可译作“呻吟”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבֹא
  choice: 愿……来到
  rationale: 该未完成式在祈祷语境中带祈愿意味；“愿……来到”既表达请求，也保留原文的运动意象。
- source_word: כָל רָעָתָם
  choice: 他们的一切恶行
  rationale: רָעָה 可指道德上的恶，也可指灾祸；本节以锡安因过犯受审判为对照，较可能指敌人的罪恶行为，因此正文译作“恶行”，并以脚注保留其他可能。
- source_word: לְפָנֶיךָ
  choice: 来到你面前
  rationale: 这是进入上帝视野或临到其面前的惯用表达；译文保留祈求上帝察看并审断的意味。
- source_word: וְעוֹלֵל לָמוֹ
  choice: 求你对待他们
  rationale: עלל 在此指采取行动对付或处置某人；“对待”自然且不过度强化报复意味。
- source_word: כַּאֲשֶׁר עוֹלַלְתָּ לִי
  choice: 就像你……对待我一样
  rationale: 与前句同译“对待”，保留希伯来文对 עלל 的重复，并指向上帝先前对锡安的审判。
- source_word: עַל כָּל פְּשָׁעָי
  choice: 因我一切的过犯
  rationale: פֶּשַׁע 含有悖逆、冒犯之意；“过犯”庄重清楚，也适合本章认罪哀诉的语境。
- source_word: רַבּוֹת אַנְחֹתַי
  choice: 我的叹息众多
  rationale: אַנְחָה 指因悲痛发出的叹息或呻吟；“叹息众多”贴近原文谓语结构，同时保持庄重。
- source_word: לִבִּי דַוָּי
  choice: 我的心病痛不堪
  rationale: דַוָּי 表示患病、衰弱或受痛苦；“病痛不堪”保留内心如患病的强烈意象，又符合现代汉语表达。
theological_decisions:
- issue: 对仇敌施行审判的祈求性质
  choice: 译为祈求上帝察看敌人的恶行，并照他审判锡安的方式对待他们。
  alternative: 强化为明确要求报复性惩罚；或弱化为仅求上帝留意其恶行。
  rationale: 原文确实要求上帝采取相应行动，并以锡安因过犯受审判为类比；译文保留这一司法性诉求，但不在经文之外加重或淡化惩罚的性质。
- issue: 锡安受苦与自身过犯的关系
  choice: 明确保留“因我一切的过犯”，表明说话者承认所受对待与自己的过犯有关。
  alternative: 将该短语宽泛处理为一般苦难背景，不明确表达因果关系。
  rationale: 介词 עַל 在此最自然地表示审判的缘由；保留因果关系可维持本章中认罪与哀诉并存的张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“愿……；求你……”体现哀歌祷告的语气；正文保留“对待”的重复，以呈现原文修辞。“我的心病痛不堪”保留身体疾病用于内在痛苦的隐喻。
