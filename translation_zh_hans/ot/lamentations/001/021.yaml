source:
  edition: WLC
  text: שָׁמְע֞וּ כִּ֧י נֶאֱנָחָ֣ה אָ֗נִי אֵ֤ין מְנַחֵם֙ לִ֔/י כָּל אֹ֨יְבַ֜/י שָׁמְע֤וּ רָֽעָתִ/י֙ שָׂ֔שׂוּ כִּ֥י אַתָּ֖ה עָשִׂ֑יתָ הֵבֵ֥אתָ יוֹם קָרָ֖אתָ וְ/יִֽהְי֥וּ כָמֽוֹ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/021.yaml
  text: They have heard that I groan[a]; there is no one to comfort me. All my enemies have heard of my trouble; they rejoice that you have done it. You have brought the day you proclaimed[c][b]; let them become like me.
translation:
  language: zh_hans
  text: 他们听见我叹息，无人安慰我。我的仇敌全都听说了我的灾祸[a]；他们因你做了这事而欢喜。你使你所宣告[b]的日子来到；愿他们变得和我一样[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”或译“苦难”。希伯来语此词可指灾难、祸患或所受的痛苦。
    reason: lexical_alternative
  - marker: b
    text: “宣告”或译“宣布”。
    reason: lexical_alternative
  - marker: c
    text: 或译：“他们必和我一样。”希伯来语形式既可理解为愿望，也可理解为对将来的陈述；哀歌的语境更支持祈愿。
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ כִּי נֶאֱנָחָה אָנִי
  choice: 人都听见我叹息
  rationale: שָׁמְעוּ是复数完成式，主语未明说；译作“人都”既符合现代汉语，又不提前限定为后句的仇敌。נֶאֱנָחָה表示在痛苦中叹息、呻吟，“叹息”庄重自然。
- source_word: אֵין מְנַחֵם לִי
  choice: 却无人安慰我
  rationale: 保留存在句所强调的完全无人安慰，并以“却”自然呈现上下文中的反差。
- source_word: כָּל אֹיְבַי
  choice: 我的仇敌全都
  rationale: 准确保留“我的仇敌”和全称量词כָּל，语序符合现代汉语。
- source_word: רָעָתִי
  choice: 我的灾祸
  rationale: רָעָה在此指临到说话者的灾难或苦难，而非其道德上的恶；“灾祸”比“困难”更符合哀歌的强度。
- source_word: שָׂשׂוּ כִּי אַתָּה עָשִׂיתָ
  choice: 他们因你做了这事而欢喜
  rationale: 这里的כִּי自然表示原因；保留第二人称对上帝的直陈，也像希伯来文一样不另行明说“这事”的具体内容。
- source_word: הֵבֵאתָ יוֹם קָרָאתָ
  choice: 你使你所宣告的日子来到
  rationale: הֵבֵאתָ表达使某个日子临到；קָרָאתָ在此可指宣告或宣布该日子。“所宣告的日子”符合审判语境，同时不增添原文没有的细节。
- source_word: וְיִהְיוּ כָמוֹנִי
  choice: 愿他们也变得和我一样
  rationale: 未完成式在哀歌语境中可表达愿望；“愿”传达祈愿色彩，“变得”体现היה所指的状态转变。脚注保留将其理解为将来陈述的可能性。
theological_decisions:
- issue: 耶路撒冷灾祸中的上帝作为
  choice: 直译为“你做了这事”及“你使……日子来到”
  alternative: 弱化施事关系，如译成灾祸只是“临到”而不说明是谁使其临到
  rationale: 希伯来文以第二人称明确把所发生的事和那日的来到归于上帝。译文保留这一神学张力，不淡化上帝的作为，也不额外解释其原因。
- issue: 末句是祈愿还是将来陈述
  choice: 正文采用祈愿：“愿他们也变得和我一样”
  alternative: “他们也必和我一样”
  rationale: 形态上可作未完成式的将来陈述，但在向上帝发出的哀诉中，祈愿理解更贴合语境。脚注明确保留另一种读法。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留哀歌的短促推进与直接呼告；“仇敌”“灾祸”“宣告”等词兼顾诗歌分量和普通读者的可理解性。所有脚注标记均置于对应正文词句之后。
