  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בָּכ֨וֹ תִבְכֶּ֜ה בַּ/לַּ֗יְלָה וְ/דִמְעָתָ/הּ֙ עַ֣ל לֶֽחֱיָ֔/הּ אֵֽין לָ֥/הּ מְנַחֵ֖ם מִ/כָּל אֹהֲבֶ֑י/הָ כָּל רֵעֶ֨י/הָ֙ בָּ֣גְדוּ בָ֔/הּ הָ֥יוּ לָ֖/הּ לְ/אֹיְבִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/002.yaml
  text: She weeps bitterly in the night[a], with her tears on her cheeks; among all her lovers she has no comforter. All her companions have dealt treacherously with her[b]; they have become her enemies.
translation:
  language: zh_hans
  text: 她在夜间痛哭，泪水挂在双颊；她所有的情人中，没有一个安慰她。她所有的伙伴都背叛了她[a]，成了她的仇敌。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伙伴”也可译作“朋友”或“盟友”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּכוֹ תִבְכֶּה
  choice: 痛哭
  rationale: 不定式绝对式与未完成式连用，加强“哭”的语意；“痛哭”以自然、凝练的现代汉语传达强烈而持续的哀哭。
- source_word: בַּלַּיְלָה
  choice: 在夜间
  rationale: 保留原文的时间状语及诗歌语感。
- source_word: וְדִמְעָתָהּ עַל לֶחֱיָהּ
  choice: 泪水挂在双颊
  rationale: 原文直陈泪在脸颊上；汉语以“挂在”自然呈现泪痕未干的画面。“泪水”和“双颊”采用符合汉语习惯的集合表达。
- source_word: אֵין לָהּ מְנַחֵם
  choice: 没有一个安慰她
  rationale: 存在否定句加分词表示无人给予安慰；此译法比名词化的“没有安慰者”更自然，同时保留“一个也没有”的绝对性。
- source_word: מִכָּל אֹהֲבֶיהָ
  choice: 她所有的情人中
  rationale: 保留城被拟人化为女子及“情人”的关系隐喻，不将其直接解释为政治盟友；介词译作“中”，表达在这些人当中无人安慰她。
- source_word: כָּל רֵעֶיהָ
  choice: 她所有的伙伴
  rationale: רֵעַ 可指朋友、同伴或盟友；“伙伴”既自然，也保留人际与政治关联之间的开放性。
- source_word: בָּגְדוּ בָהּ
  choice: 都背叛了她
  rationale: בגד 表示背信、行诡诈；“背叛”在现代汉语中简洁有力，并与关系破裂的上下文相合。
- source_word: הָיוּ לָהּ לְאֹיְבִים
  choice: 成了她的仇敌
  rationale: 该结构表示关系或身份的转变；“成了”清楚传达从伙伴转为仇敌。
theological_decisions:
- issue: 耶路撒冷／锡安被拟人化为有“情人”的女子
  choice: 正文保留“情人”
  alternative: 盟友；爱她的人
  rationale: 原文延续城市女性化的诗歌拟人，也可能暗指政治依附或不忠关系。保留“情人”可呈现文学与神学张力，而不在正文中将隐喻单一化为政治解释。
- issue: רֵעֶיהָ 所指关系的性质
  choice: 伙伴
  alternative: 朋友；盟友
  rationale: 原词容许私人关系和政治关系两种理解；“伙伴”避免把语义过早限定为友谊或外交联盟。
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保持短句的哀歌节奏与女性拟人。正文中的脚注标记[a]对应“伙伴”的语义选择；“情人”本身保留原文隐喻，因此不另加可能误置的脚注。
