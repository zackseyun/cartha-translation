source:
  edition: WLC
  text: כָּל עַמָּ֤/הּ נֶאֱנָחִים֙ מְבַקְּשִׁ֣ים לֶ֔חֶם נָתְנ֧וּ מחמודי/הם בְּ/אֹ֖כֶל לְ/הָשִׁ֣יב נָ֑פֶשׁ רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה כִּ֥י הָיִ֖יתִי זוֹלֵלָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/011.yaml
  text: All her people groan[a], seeking bread; they have given their precious things for food to restore life. Look, O Yahweh, and see[c][b], for I have become despised.
translation:
  language: zh_hans
  text: 她的百姓都在叹息，寻找粮食；他们拿自己的珍贵之物换取食物，使生命恢复[a]。耶和华啊，求你察看，观看，因为我已成了可鄙的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使生命恢复”直译为“使生命（或自己）返回”；这里指恢复元气或维持生命。
    reason: lexical_alternative
  - marker: b
    text: “成了可鄙的”也可译作“成了卑贱的”或“成了受轻看的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָחִים
  choice: 叹息
  rationale: 表达饥荒与围困中百姓发出的痛苦叹声，既自然又保留原文的沉重感。
- source_word: מְבַקְשִׁים לֶחֶם
  choice: 寻找食物
  rationale: לֶחֶם 字面为“饼”，在这里泛指赖以生存的食物；现代汉语译作“食物”更自然，也避免让读者误以为只寻找某一种面饼。
- source_word: מחמודיהם
  choice: 自己的珍宝
  rationale: 指令人喜爱、贵重的所有物；“珍宝”保留其广义，不限于钱财。
- source_word: בְּאֹכֶל
  choice: 换取吃的
  rationale: 介词在语境中表示交换；此译明确呈现他们以贵重物品换取可吃之物。
- source_word: לְהָשִׁיב נָפֶשׁ
  choice: 好恢复气力
  rationale: נֶפֶשׁ 在此不是狭义的非物质“灵魂”，而指人的生命或自身；饥饿语境中的表达意为靠食物恢复体力、维持生命。
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: 求你察看、观看
  rationale: 保留两个并列祈使词所形成的加强语气，同时用“求你”自然表达向上帝发出的恳求。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的专名形式，明确呈现四字神名，而不以“主”替代。
- source_word: זוֹלֵלָה
  choice: 被人鄙视
  rationale: 该词在此描述耶路撒冷沦为可鄙、受轻看的境地，并非字面意义上的贪食；加入“被人”使现代汉语表达自然，但不改变社会性受辱的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用专有神名，应在译文中保留为专名；“耶和华”是现代普通中文读者最熟悉、最易识别的形式，不以称号“主”取代神名。
- issue: נֶפֶשׁ 在饥荒语境中的含义
  choice: 气力
  alternative: 生命／心灵
  rationale: 这里说的是以食物恢复人的生命活力，而不是建立灵魂与身体的教义区分；正文采用自然的语境义，脚注保留字面张力。
- issue: זוֹלֵלָה 的伦理或社会含义
  choice: 被人鄙视
  alternative: 卑贱／可鄙／贪食
  rationale: 上下文是锡安受辱后的哀诉，宜理解为她成为受轻蔑者；不按同形词常见的“贪食”义引入与本段无关的道德指控。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。前半节以第三人称叙述百姓，后半节保留耶路撒冷拟人化的第一人称哀求。两个观看动词均予保留，以呈现原文恳求的加强语气。
