    issue: “被人鄙视”将原文的状态性表述改成了带明确施事者的被动句。
    rationale: זוֹלֵלָה表达“我成了可鄙／卑贱的”的处境；其社会性轻蔑可为语境含义，但原文没有明说“人”作为施事者。
  - severity: low
    issue: “食物”较原文“饼／粮食”宽泛。
    rationale: לֶחֶם在此可泛指维生食粮，但正文宜以“粮食”保留其主食、口粮的具体性，同时保持现代汉语自然。
  - severity: low
    issue: “恢复气力”略收窄了“恢复生命／自身”的表达。
    rationale: 饥荒语境确实包含恢复体力，但נֶפֶשׁ主要指生命或自身；正文和脚注宜更明确保留生命存续的含义。
