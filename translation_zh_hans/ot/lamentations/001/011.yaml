- from: 她的百姓都在叹息，寻找食物；他们拿自己的珍宝换取吃的，好恢复气力。[a]耶和华啊，求你察看、观看，因为我已被人鄙视。[b]
  to: 她的百姓都在叹息，寻找粮食；他们拿自己的珍贵之物换取食物，使生命恢复[a]。耶和华啊，求你察看，观看，因为我已成了可鄙的[b]。
  rationale: 修订以保留原文的“粮食”意象、生命恢复的表达和末句“成为可鄙”的状态性语气。第一人称哀诉及两个连续的观看祈使语均予保留；未对有争议的词义作教义性或道德化延伸。
