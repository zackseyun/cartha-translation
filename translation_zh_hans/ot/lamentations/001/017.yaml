  text: פֵּֽרְשָׂ֨ה צִיּ֜וֹן בְּ/יָדֶ֗י/הָ אֵ֤ין מְנַחֵם֙ לָ֔/הּ צִוָּ֧ה יְהוָ֛ה לְ/יַעֲקֹ֖ב סְבִיבָ֣י/ו צָרָ֑י/ו הָיְתָ֧ה יְרוּשָׁלִַ֛ם לְ/נִדָּ֖ה בֵּינֵי/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/017.yaml
  text: Zion has spread out her hands; there is no one to comfort her[a]. Yahweh has commanded concerning Jacob that his enemies surround him; Jerusalem has become an unclean thing among them.
translation:
  language: zh_hans
  text: 锡安伸开双手，无人安慰她。耶和华已就雅各下令，让他的仇敌从四围围困他；耶路撒冷在他们中间成了不洁之物。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不洁之物”所译的希伯来词可更具体地指与经期有关的礼仪不洁或污秽；这里带有礼仪上不洁并遭人排斥的意象。
    reason: 说明 נִדָּה 的具体礼仪背景及其可能的语义范围，且不把该词限定为仅指人。
lexical_decisions:
- source_word: פֵּרְשָׂה צִיּוֹן בְּיָדֶיהָ
  choice: 锡安伸开双手
  rationale: פרשׂ表示展开、伸展；这里描写锡安以双手作出求助或哀求的姿态，但正文不把该动作进一步限定为祷告。
- source_word: אֵין מְנַחֵם לָהּ
  choice: 却无人安慰她
  rationale: 保留希伯来文的存在句式及《耶利米哀歌》中反复出现的“安慰”主题；“却”自然显出伸手与无人回应之间的反差。
- source_word: צִוָּה יְהוָה
  choice: 耶和华已吩咐
  rationale: צוה直译为“吩咐、命令”；完成式在此表达已经发出的命令。神名 יהוה按项目惯例译作“耶和华”。
- source_word: לְיַעֲקֹב סְבִיבָיו צָרָיו
  choice: 要让雅各四围的人成为他的敌人
  rationale: 原文是简洁的名词性内容：“关于/针对雅各，他四围的人是他的敌人。”中文补出“要让……成为”以清楚表达命令内容，同时保留 לְיַעֲקֹב 所容许的宽泛关联，不强译为“攻击雅各”。
- source_word: הָיְתָה יְרוּשָׁלִַם לְנִדָּה בֵּינֵיהֶם
  choice: 耶路撒冷在他们中间成了不洁之物
  rationale: היתה ל־表示进入某种状态。נדה含礼仪性不洁、尤其经期不洁的意象；正文采用易懂而不过度具体化的“不洁之物”，具体意象在脚注说明。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 直接呈现专名而非以“主”替代；“耶和华”是现代中文圣经读者最熟悉且可辨识的形式。
- issue: נִדָּה 的具体意象
  choice: 不洁之物
  alternative: 经期不洁的女人／经期的污秽
  rationale: 该词在此既可能唤起经期不洁的具体礼仪背景，也可泛指被视为污秽、遭人排斥之物。正文保留较宽的语义范围，脚注交代更具体的意象，避免消除原文张力。
- issue: לְיַעֲקֹב 的关系
  choice: 要让雅各四围的人成为他的敌人
  alternative: 耶和华已针对雅各下令，使他的敌人包围他
  rationale: 介词 ל 可表示命令所关涉或影响的对象。所选译文不把它过早限定为单纯敌对方向，也不额外加入原文没有的“包围”动词。
translation_notes:
  register: 采用现代、庄重而自然的书面普通话。“锡安”“雅各”“耶路撒冷”均按诗歌中的人格化处理使用代词“她／他”。句式保留哀歌的凝练与因果张力，避免加入“祷告”“弃绝”等解释性词语。
