  text: דַּרְכֵ֨י צִיּ֜וֹן אֲבֵל֗וֹת מִ/בְּלִי֙ בָּאֵ֣י מוֹעֵ֔ד כָּל שְׁעָרֶ֨י/הָ֙ שֽׁוֹמֵמִ֔ין כֹּהֲנֶ֖י/הָ נֶאֱנָחִ֑ים בְּתוּלֹתֶ֥י/הָ נּוּג֖וֹת וְ/הִ֥יא מַר לָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/004.yaml
  text: The roads of Zion mourn[a], because no one comes to the appointed feast; all her gates are desolate, her priests groan, her virgins grieve[b], and she herself is bitter.
translation:
  language: zh_hans
  text: 锡安的道路因无人前来参加节期而悲哀[a]；她的城门全都荒凉，她的祭司叹息，她的处女忧伤[b]，她自己也愁苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “节期”或译“规定的节期”“指定的时间”。希伯来语 mo'ed 可指指定的时间、节期或节期聚会。
    reason: lexical_alternative
  - marker: b
    text: “处女”或译“少女”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי צִיּוֹן
  choice: 锡安的道路
  rationale: דֶּרֶךְ的复数在此具体指通往锡安、昔日供朝圣者行走的道路；“道路”既自然，又保留道路人格化悲哀的诗意。
- source_word: אֲבֵלוֹת
  choice: 悲哀
  rationale: 该阴性复数形式描写道路如同居丧者；“悲哀”简洁地保留人格化和哀歌语气。
- source_word: מִבְּלִי בָּאֵי מוֹעֵד
  choice: 因为无人前来守节
  rationale: מִבְּלִי表示缺少或由于没有，בָּאֵי指前来的人；在锡安及圣所的语境中，מוֹעֵד主要指规定的节期。“前来守节”以自然汉语表达赴节期聚集之意，同时以脚注保留该词较宽的语义。
- source_word: כָּל שְׁעָרֶיהָ
  choice: 她所有的城门
  rationale: 直译名词及阴性单数后缀，并以“她”延续锡安作为女子的人格化形象。
- source_word: שׁוֹמֵמִין
  choice: 都荒凉
  rationale: 该词表达空寂、毁坏的状态；“荒凉”符合全章城邑遭毁后的哀歌图景。
- source_word: כֹּהֲנֶיהָ נֶאֱנָחִים
  choice: 祭司叹息
  rationale: 保留祭司这一明确身份；נֶאֱנָחִים表示因痛苦而叹息，“叹息”自然且庄重。
- source_word: בְּתוּלֹתֶיהָ נּוּגוֹת
  choice: 处女忧伤
  rationale: בְּתוּלָה通常指处女或未婚少女；正文采用词义较透明的“处女”，并在脚注列出更宽泛、较自然的“少女”。נּוּגוֹת表达受苦而悲伤的状态，译为“忧伤”。
- source_word: וְהִיא מַר לָהּ
  choice: 她自己也满心苦楚
  rationale: וְהִיא带强调，故译“她自己”；מַר לָהּ是表达自身处于苦痛中的习语，“满心苦楚”以自然汉语传达其强烈的苦涩哀痛。
theological_decisions:
- issue: 阴性后缀及独立代词所指与锡安的人格化
  choice: 用“她”和“她自己”把锡安呈现为人格化的女子。
  alternative: 把城市作为无生命地点，用“它”来指称。
  rationale: 希伯来文连续采用阴性形式，并在本章中将锡安人格化为受苦的女子；保留这一形象对诗歌修辞和全章结构都很重要。
translation_notes:
  register: 采用现代、庄重而清楚的普通话，保留希伯来哀歌的并列节奏及锡安的女性人格化。分号承接道路与城门、祭司、处女及锡安自身层层展开的悲况。
