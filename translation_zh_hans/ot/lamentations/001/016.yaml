source:
  edition: WLC
  text: עַל אֵ֣לֶּה אֲנִ֣י בוֹכִיָּ֗ה עֵינִ֤/י עֵינִ/י֙ יֹ֣רְדָה מַּ֔יִם כִּֽי רָחַ֥ק מִמֶּ֛/נִּי מְנַחֵ֖ם מֵשִׁ֣יב נַפְשִׁ֑/י הָי֤וּ בָנַ/י֙ שֽׁוֹמֵמִ֔ים כִּ֥י גָבַ֖ר אוֹיֵֽב־׀׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/016.yaml
  text: For these things I am weeping; my eye[a], my eye runs down with water, because the comforter who restores my soul is far from me. My children have become desolate, because the enemy has prevailed.
translation:
  language: zh_hans
  text: '因这些事，我在哭泣；


    我的眼，我的眼流泪如水。


    因为那安慰我、使我复苏的，


    离我很远。


    我的儿女已变得荒凉，


    因为仇敌占了上风。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֵלֶּה
  choice: 因这些事
  rationale: עַל与指示代词连用，指出哀哭所缘由或所针对的事；“因这些事”在现代汉语中自然，也保留因由与对象之间的语义空间。
- source_word: אֲנִי בוֹכִיָּה
  choice: 我不断哭泣
  rationale: 阴性分词与人格化的锡安／耶路撒冷相应，并表达持续进行的哀哭；“不断”自然传达其延续性。
- source_word: עֵינִי עֵינִי
  choice: 我的眼，我的眼
  rationale: 保留希伯来文单数名词的重复，不将其顺译为“我的双眼”，以保存原诗强烈、突兀的哀恸语气。
- source_word: יֹרְדָה מַּיִם
  choice: 流泪如水
  rationale: 原文直陈“流下水来”。汉语以“流泪如水”既能清楚表达哭泣，又保留“水”的夸张意象，避免生硬的“流水”。
- source_word: מְנַחֵם מֵשִׁיב נַפְשִׁי
  choice: 那安慰我、使我复苏的
  rationale: 两个分词共同描述所缺席的人。“使我复苏”表达恢复整个人的生命与精神，同时避免把נֶפֶשׁ限定为后世身心二分意义上的“灵魂”；脚注交代其词义幅度。
- source_word: רָחַק מִמֶּנִּי
  choice: 已经远离了我
  rationale: 表达安慰者如今不在身边的状态；“已经”也自然体现灾后失去扶助的结果。
- source_word: בָנַי
  choice: 我的儿女
  rationale: 字面为“我的众子”，在锡安人格化的言语中指其百姓；“儿女”比“儿子”更能自然表达集体后裔而不限定性别。
- source_word: שׁוֹמֵמִים
  choice: 落得凄凉
  rationale: 该词可表示荒凉、毁坏，也可涉及惊骇。“落得凄凉”适用于遭难的百姓，并保留灾祸造成的荒凉状态。
- source_word: גָבַר אוֹיֵב
  choice: 仇敌占了上风
  rationale: גָבַר表示变强、胜过或得势；“占了上风”在现代汉语中自然表达仇敌取得优势，而不额外断定最终结局。
theological_decisions:
- issue: 哀歌语境中נַפְשִׁי的译法
  choice: 使我复苏
  alternative: 使我的性命复苏；使我的心灵复苏
  rationale: נֶפֶשׁ可指生命、自我、整个人或内在心灵。正文采用动词化表达，不把含义收窄为抽象的“灵魂”，并以脚注保留可译范围。
- issue: “安慰者”的身份
  choice: 那安慰我……的
  alternative: 安慰者
  rationale: 原文是实词化分词，没有明确说明此人的身份。采用关系结构，保留其不确定性，不将其专指为神、君王或任何特定群体。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体汉语，按希伯来诗句分行。保留“我的眼，我的眼”的单数重复，以呈现原文的修辞强度；其余表达避免古奥词汇，也不为“安慰者”指定神学身份。
