  to: 主弃绝了我中间所有的勇士；他定了一个日期来摧毁我的青年男子。[a]主践踏童女犹大，如同在酒榨中践踏葡萄。[b]
  rationale: 修订删除原文没有的“人”“攻击”和“放在”，恢复“定下／宣告一个日期（或集会）……来摧毁”的句法关系。对 מוֹעֵד 采用“日期”并在脚注保留“集会”的词义可能。末句以中文可理解的明喻传达酒榨审判意象，且以“童女犹大”保留原文的拟人化称呼。
