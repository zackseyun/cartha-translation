  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: סִלָּ֨ה כָל אַבִּירַ֤/י אֲדֹנָ/י֙ בְּ/קִרְבִּ֔/י קָרָ֥א עָלַ֛/י מוֹעֵ֖ד לִ/שְׁבֹּ֣ר בַּחוּרָ֑/י גַּ֚ת דָּרַ֣ךְ אֲדֹנָ֔/י לִ/בְתוּלַ֖ת בַּת יְהוּדָֽה־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/015.yaml
  text: The Lord has rejected all my mighty men in my midst[a]; he has summoned an appointed time against me to crush my young men[b]. The Lord has trodden the winepress for the virgin daughter of Judah.
translation:
  language: zh_hans
  text: 主弃绝了我中间所有的勇士；他定了一个日期来摧毁我的青年男子。[a]主践踏童女犹大，如同在酒榨中践踏葡萄。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “一个日期”也可译作“一个约定的集会”；原文 מוֹעֵד 可指指定的时间，也可指指定的聚集。
    reason: lexical_alternative
  - marker: b
    text: 在酒榨中践踏葡萄，是严厉审判的比喻。
    reason: cultural_note
lexical_decisions:
- source_word: סִלָּה
  choice: 弃绝了
  rationale: 此处使役加强词形在战败哀歌的语境中表示摒弃、弃置；“弃绝”自然传达决定性的拒弃。
- source_word: אַבִּירַי
  choice: 我城中所有的勇士
  rationale: אַבִּירַי 指说话者所属的强壮者，语境尤其指战士；与 בְּקִרְבִּי 合译为“我城中”，明确拟人化的耶路撒冷所说的是城内的人。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号 אֲדֹנָי，而非四字神名；译作“主”保留称号性质。
- source_word: קָרָא עָלַי מוֹעֵד
  choice: 他召集人，在所定的时刻攻击我
  rationale: מוֹעֵד 可指约定的时间，也可指约定的聚集。正文借“召集人，在所定的时刻”尽量保留这两层可能，并以脚注说明歧义。
- source_word: לִשְׁבֹּר
  choice: 要摧毁
  rationale: 本义为打破、压碎；在军事审判语境中，“摧毁”准确而自然。
- source_word: בַּחוּרָי
  choice: 我的青年
  rationale: 指正值壮年、往往能够作战的年轻男子；“青年”简洁且不过度限定为军人。
- source_word: גַּת דָּרַךְ
  choice: 放在榨酒池中践踏
  rationale: 原文直译为“踩踏榨酒池”，实际把犹大少女比作池中被踩踏的葡萄；此译使汉语意象清楚，同时保留严厉审判的隐喻。
- source_word: לִבְתוּלַת בַּת יְהוּדָה
  choice: 犹大少女
  rationale: 这是把犹大人格化为未婚少女的诗性称呼；“犹大少女”比生硬的“犹大的处女女儿”更符合现代汉语，同时保留其年轻、未婚女性形象。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 主宰
  rationale: “主”是现代中文圣经语体中自然、庄重的神圣称号，也不会把此词误作四字神名。
- issue: מוֹעֵד 的时间与集会双重可能
  choice: 正文兼顾召集与所定时刻，并用脚注保留歧义
  alternative: 只译“定期”或只译“集会”
  rationale: 该词在本句中可指预定时刻或所召集的会众；不应以单一释义消除原文张力。
- issue: 榨酒池意象中受践踏者的表达
  choice: 主把犹大少女放在榨酒池中践踏
  alternative: 主为犹大少女踩踏榨酒池
  rationale: 上下文表明犹大是承受审判者；明确其处于榨酒池中能避免中文误解为主替她榨酒，同时不消除比喻。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。以分号保持希伯来诗句的推进；“我城中”显明说话者是被人格化的城。“犹大少女”保留诗性人格化，避免不自然的逐词硬译。
