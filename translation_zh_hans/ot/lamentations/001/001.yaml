  text: אֵיכָ֣ה יָשְׁבָ֣ה בָדָ֗ד הָ/עִיר֙ רַבָּ֣תִי עָ֔ם הָיְתָ֖ה כְּ/אַלְמָנָ֑ה רַּבָּ֣תִי בַ/גּוֹיִ֗ם שָׂרָ֨תִי֙ בַּ/מְּדִינ֔וֹת הָיְתָ֖ה לָ/מַֽס׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/001.yaml
  text: How she sits alone[a], the city once full of people! She has become like a widow, she who was great among the nations, a princess among the provinces; she has become subject to forced labor.
translation:
  language: zh_hans
  text: 怎么会这样！从前人口众多的城，竟孤零零地坐着！她已变得像寡妇；她从前在列国中为大，在各省中为公主，如今却被迫服劳役[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“被迫进贡”。希伯来语“מַס”可指征服者所征的贡赋，也可指强制劳役；正文采用后一个意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: 怎么会这样
  rationale: 这是哀歌开头的惊叹语，并非询问信息；“怎么会这样”以现代汉语表达哀痛、震惊和难以置信的语气。
- source_word: יָשְׁבָה בָדָד
  choice: 竟孤零零地坐着
  rationale: 保留“坐着”的具体形象，并用“孤零零”传达孤独、荒凉和被遗弃的处境；“竟”呼应开头的哀叹。
- source_word: הָעִיר רַבָּתִי עָם
  choice: 这座从前人口众多的城
  rationale: 原文只说“这城”，不在正文补入“耶路撒冷”；“人口众多”自然表达该城昔日居民繁盛的状态，“从前”凸显今昔反差。
- source_word: הָיְתָה כְּאַלְמָנָה
  choice: 她已变得好像寡妇
  rationale: “变得”呈现处境的逆转；“好像”保留 כְּ 所标明的比喻，不把城直接等同于寡妇。
- source_word: רַבָּתִי בַגּוֹיִם
  choice: 从前在列国中为大的
  rationale: 保留原文在列国中地位显赫的概括性表述，避免擅自限定为军事、政治或人口意义上的强大。
- source_word: שָׂרָתִי בַּמְּדִינוֹת
  choice: 在各省中为公主的
  rationale: “公主”直接表达女性尊贵者的形象；“各省”对应行政区域，也保持与“列国”相称的诗歌平行。
- source_word: הָיְתָה לָמַס
  choice: 如今竟服起苦役
  rationale: מַס 可指贡赋或强制劳役；正文采用强制劳役义，以清楚呈现她由“公主”沦为受辖制者的逆转，同时在脚注保留另一可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而可朗读的哀歌语体。“怎么会这样”表达 אֵיכָה 的哀叹和震惊；重复“竟”强化城从繁盛尊贵到孤独受役的剧烈逆转。保留“城”而不明说耶路撒冷，也保留“好像寡妇”的比喻性质及 מַס 的词义歧义。
