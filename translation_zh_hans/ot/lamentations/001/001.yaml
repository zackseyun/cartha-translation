revisions:
- from: 怎么会这样！这座从前人口众多的城，竟孤零零地坐着！她已变得好像寡妇；从前在列国中为大的，在各省中为公主的，如今竟服起苦役[a]。
  to: 怎么会这样！从前人口众多的城，竟孤零零地坐着！她已变得像寡妇；她从前在列国中为大，在各省中为公主，如今却被迫服劳役[a]。
  rationale: 修订仅调整末句及脚注，并略微理顺后半句句法。“被迫服劳役”避免“服起苦役”的不自然体貌与刑罚色彩，同时保留原文从尊贵地位沦为受辖制者的强烈反差；脚注继续保留מַס可能指贡赋的歧义。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T07:33:16Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实呈现了哀歌式惊叹、城的孤寂、如寡妇的比喻、昔日在列国与各省中的尊荣，以及沦为受役者的逆转。惟“服起苦役”含有不必要的起始体意味，且“苦役”在现代汉语中容易联想到刑罚性劳役；宜更直接表达מַס所指的强制劳役，并在脚注保留贡赋义。
  naturalness: 开头及前半节自然、庄重，也适合朗读。原句末尾“服起苦役”不够自然；改为“被迫服劳役”更符合现代汉语，且准确表达受强制的处境。将后半句的定语链改为明确的“她从前……”也使结构更清晰。
  terminology: “列国”“各省”“寡妇”均恰当；“公主”可保留，忠实表达女性尊贵者的诗歌形象。“劳役”比“苦役”更中性、贴近强制劳役的词义范围，也不排除脚注所示的“贡赋”解释。
