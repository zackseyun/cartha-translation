    rationale: 脚注宜简洁呈现词义替代项，并说明מַס可指贡赋或强制劳役，不应在替代译文中额外强化时态或情态。
  - severity: low
    issue: “从前在列国中为大的，在各省中为公主的”作为连续定语后接“如今竟……”略显悬置。
    rationale: 补出“她从前”不增加原文信息，却能使汉语句法清晰，维持诗歌的今昔对照。
