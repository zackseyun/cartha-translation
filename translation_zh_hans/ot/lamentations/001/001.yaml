    rationale: 原文הָיְתָה לָמַס描述她沦为受征服者支配、承担מַס的状态；“起”暗示开始从事某事，“苦役”又常指惩罚性的劳役。改作“被迫服劳役”更自然，也更准确保留强制性。
  - severity: low
