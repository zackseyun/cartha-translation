base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/006.yaml
  text: From daughter Zion all her splendor has departed[a]; her princes have become like deer that find no pasture[b]; they went without strength before the pursuer.
translation:
  language: zh_hans
  text: 锡安女子的一切荣美都已离她而去[a]；她的首领像找不到草场的鹿[b]，他们在追赶者面前无力地前行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的一切尊荣”；或“她的一切华美都从锡安女子离去了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“像找不到草场的雄鹿。”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מִן בַּת־צִיּוֹן
  choice: 都已离她而去
  rationale: 动词字面为“出去”，与介词“从”共同表达荣美从拟人化的锡安女子那里消逝；译作“离她而去”既自然，又保留离去的动态意象。
- source_word: בַּת־צִיּוֹן
  choice: 锡安女子
  rationale: 保留先知诗歌中把锡安人格化为女子的意象；“锡安女子”在现代汉语中比“锡安的女儿”更不易被误解为某个具体女儿。
- source_word: כָּל הֲדָרָהּ
  choice: 她的一切荣美
  rationale: הָדָר 可指华美、尊荣或威仪；“荣美”兼具美丽与尊贵，适合城邑昔日风华尽失的哀歌语境，也避免将其窄化为单纯外貌。
- source_word: שָׂרֶיהָ
  choice: 她的首领
  rationale: שַׂר 可指王侯、领袖或官长；“首领”保留统治阶层之义，同时不武断限定他们必为王族。
- source_word: כְּאַיָּלִים
  choice: 像……鹿
  rationale: אַיָּלִים 通常指鹿，也可具体理解为雄鹿；正文用通顺且不过度具体化的“鹿”，脚注保留“雄鹿”的可能。
- source_word: לֹא מָצְאוּ מִרְעֶה
  choice: 找不到草场
  rationale: מִרְעֶה 指牧草地或放牧之处；“找不到草场”自然呈现鹿因无处觅食而衰弱的原因。
- source_word: וַיֵּלְכוּ בְלֹא־כֹחַ
  choice: 无力地走去
  rationale: הלך 是中性的“走、去”，不直接译成“逃跑”；“无力地”准确表达 בְלֹא כֹחַ 的精疲力竭。
- source_word: לִפְנֵי רוֹדֵף
  choice: 在追赶者面前
  rationale: לִפְנֵי 在追逐语境中表示他们被追赶者逼在前面；保留单数“追赶者”，使其既可指代表性的敌人，也可作集合性理解。
