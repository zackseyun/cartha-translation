base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/019.yaml
  text: I called to my lovers[a]; they deceived me[b]. My priests and my elders perished in the city while they sought food for themselves to restore their lives.
translation:
  language: zh_hans
  text: 我呼唤我的情人[a]，他们却欺骗了我。我的祭司和长老都在城中气绝；他们为自己寻找食物，好让自己恢复活力。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的情人”是隐喻性说法，很可能指耶路撒冷的政治盟友，或她所错误倚赖的其他对象。
    reason: cultural_note
  - marker: b
    text: 也可译作：“因为他们为自己寻找食物，好让自己恢复活力。”原文的连接词也可更明确地表达原因。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרָאתִי
  choice: 我呼求
  rationale: קרא的Qal完成式第一人称单数可表示“呼叫、呼求”；此处是耶路撒冷向所倚赖者求助，“呼求”自然传达求援语境。
- source_word: לַמְאַהֲבַי
  choice: 我的情人
  rationale: 该词按字面是“爱我的人／我的情人”，在本书语境中隐喻耶路撒冷所倚赖的政治盟友等；正文保留原有亲密关系隐喻，不直接淡化为“盟友”。
- source_word: הֵמָּה רִמּוּנִי
  choice: 他们却欺骗了我
  rationale: רמה的Piel词干通常表示欺骗；“却”显明求助与受骗之间的反差，但不把含义强化为较具体的“背叛”。
- source_word: כֹּהֲנַי וּזְקֵנַי
  choice: 我的祭司和长老
  rationale: 保留两个带第一人称单数所属后缀的复数名词；“长老”在此指群体中的领袖，而不只是年长者。
- source_word: בָּעִיר גָּוָעוּ
  choice: 都在城中断了气
  rationale: גוע描写死亡、气绝；“断了气”保留其具体意象，也符合哀歌的沉重语体。“都”自然表达祭司与长老两类人共同遭遇死亡。
- source_word: כִּי בִקְשׁוּ אֹכֶל לָמוֹ
  choice: 他们为自己寻找食物
  rationale: בקשו表示寻找，אכל为食物，למו指为他们自己。正文以分号衔接，避免把多义的כִּי过度限定为纯粹因果或时间关系。
- source_word: וְיָשִׁיבוּ אֶת נַפְשָׁם
  choice: 好恢复生气
  rationale: שוב的Hiphil表示使返回、恢复；נפש在此指生命或活力，不宜译成抽象的“灵魂”。“恢复生气”自然表达他们靠食物挽回生命活力的目的，又避免说成已经死后“活过来”。
theological_decisions:
- issue: “情人”所指对象
  choice: 正文保留关系隐喻“我的情人”
  alternative: 译作“我的盟友”或“爱我的人”
  rationale: 原文没有明说政治盟友；保留隐喻可维持耶路撒冷对错误倚靠的控诉张力，脚注再说明其可能指向。
- issue: כִּי与祭司、长老死亡之间的关系
  choice: 正文用分号并列说明其寻食求生的处境
  alternative: 明确译为“因为”或“当……时”
  rationale: כִּי可作因果或解释性连接；不在正文中单一定义，可保留原文关系上的一定开放性。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“情人”刻意保留原文大胆而带控诉意味的隐喻；“断了气”具体呈现גוע的死亡意象。末句用分号保持诗歌的紧凑感，并借脚注交代כִּי可能具有的因果读法。
