  rationale: 修订仅处理语气和现代汉语搭配：“呼唤”较准确地对应“呼叫”而不预设更强的恳求语气；“气绝”维持死亡的具体意象和庄重语体；“恢复活力”自然表达寻食以挽回生命力。保留分号及脚注中的因果译法，以维持 כִּי 的句法关系开放性。
