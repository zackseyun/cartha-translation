base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/003.yaml
  text: Judah has gone into exile because of affliction and because of great servitude; she dwells among the nations and finds no rest[a]. All her pursuers have overtaken her in the narrow places.
translation:
  language: zh_hans
  text: 犹大因苦难和繁重的劳役而流亡；她住在列国之中，得不到安歇。所有追赶她的人都在狭窄的地方[a]追上了她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可直译为“在狭窄之处之间”；希伯来语可能同时使人联想到困境，描绘犹大被困、无路可逃。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְתָה
  choice: 流亡
  rationale: גלה的Qal在此表示离乡进入流亡状态；“流亡”自然简洁，并保留《耶利米哀歌》的核心主题，且不强行判定主动或被动。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 此专名指犹大人民或国土，并在上下文中被拟人化为女性；采用现代中文圣经常用译名。
- source_word: מֵעֹנִי
  choice: 因苦难
  rationale: 介词מִן可在此作原因解；עֹנִי涵盖困苦、患难或贫困，“苦难”保留较宽的语义范围。
- source_word: וּמֵרֹב עֲבֹדָה
  choice: 和繁重的劳役
  rationale: רֹב表示多或程度深，עֲבֹדָה在此语境带有受压迫、服苦役之意；“繁重的劳役”既表达强制与沉重，也避免仅理解为一般劳动。
- source_word: הִיא יָשְׁבָה בַגּוֹיִם
  choice: 她住在列国之中
  rationale: יָשַׁב可指坐下、居住；此处译作“住”符合流离后寄居异邦的情境。“她”保留对犹大的女性拟人。
- source_word: לֹא מָצְאָה מָנוֹחַ
  choice: 得不到安歇
  rationale: מָנוֹחַ兼有安息和安歇之处的含义；“得不到安歇”自然，并保留身体与处境上的不安。
- source_word: כָּל רֹדְפֶיהָ
  choice: 追赶她的人都
  rationale: רדף的分词指敌意追逐者；用动词性表达在现代中文中较自然，并保留追逐画面。
- source_word: הִשִּׂיגוּהָ
  choice: 追上了她
  rationale: נשׂג的Hiphil表示赶上、追及；“追上”与前面的追赶直接衔接，不额外加入抓获或擒拿之意。
- source_word: בֵּין הַמְּצָרִים
  choice: 在狭隘之地
  rationale: 该短语字面为“在狭窄之处之间”，描绘无路可逃的逼仄地势，也可能暗含困境之意；正文保留空间意象，脚注说明语义张力。
