base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/014.yaml
  text: They wandered blind through the streets[a], defiled with blood[b], so that they could not touch their garments.
translation:
  language: zh_hans
  text: 他们像瞎子一样在街上游荡[a]，被血玷污[b]，以致连自己的衣服也不能触碰。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们在街上游荡，像瞎子一样；他们被血玷污，以致人们不能触碰他们的衣服。”希伯来文十分凝练，“不能触碰”的主语并未明说。
    reason: alternative_reading
  - marker: b
    text: “被血玷污”很可能带有不洁的含义，不只是指沾了血。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָעוּ
  choice: 游荡
  rationale: 该动词表示摇摆、踉跄或漫无目的地移动；“游荡”自然地表现其迷失方向的行动，同时不排除步履不稳之意。
- source_word: עִוְרִים
  choice: 瞎着眼
  rationale: 原词直指“盲人”或“眼瞎的”；这里没有明示比喻词。“瞎着眼”保留直接的失明形象，也适合修饰其游荡状态。
- source_word: בַּחוּצוֹת
  choice: 在街上
  rationale: חוּצוֹת可指城中的街道或公共空地；结合移动动词，译作“在街上”简明自然。
- source_word: נְגֹאֲלוּ
  choice: 被……玷污
  rationale: 该被动形式在此含污秽、不洁之意，不只是外表沾染；“玷污”保留礼仪和道德层面的语感。
- source_word: בַּדָּם
  choice: 被血
  rationale: 介词说明造成污秽的物质或媒介；与“玷污”合译为“被血玷污”。
- source_word: בְּלֹא יוּכְלוּ
  choice: 以致不能
  rationale: 原文结构凝练，表达无力或不可能；“以致不能”呈现前述血污所导致的结果，又不额外指定新主语。
- source_word: יִגְּעוּ
  choice: 碰
  rationale: נגע通常意为触碰或接触；“碰”在现代汉语中清楚自然，并符合不洁可因接触而关联的语境。
- source_word: בִּלְבֻשֵׁיהֶם
  choice: 自己的衣服
  rationale: 原文是“他们的衣服”。在主句以“他们”为持续主语的译法中，“自己的衣服”能清楚表达回指关系；相关句法歧义另以脚注说明。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“瞎着眼”“游荡”保留原文突兀而压缩的诗歌形象；主文依连续动词的语法形式让“他们”作“不能碰”的主语，同时以脚注保存另一种常见句法理解。
