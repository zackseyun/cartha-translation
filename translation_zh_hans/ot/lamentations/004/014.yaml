revisions:
- from: 他们瞎着眼在街上游荡[a]，被血玷污[b]，以致不能碰自己的衣服。
  to: 他们像瞎子一样在街上游荡[a]，被血玷污[b]，以致连自己的衣服也不能触碰。
  rationale: 修订“瞎着眼”为自然的“像瞎子一样”，并将末句调整为“连自己的衣服也不能触碰”，使现代汉语通顺且保留主文按连续复数动词所作的“他们不能触碰”理解。脚注保留另一种将末句理解为他人不能触碰其衣服的可能性；未将该歧义强加于主文。
