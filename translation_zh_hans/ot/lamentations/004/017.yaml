  text: עוד/ינה תִּכְלֶ֣ינָה עֵינֵ֔י/נוּ אֶל עֶזְרָתֵ֖/נוּ הָ֑בֶל בְּ/צִפִּיָּתֵ֣/נוּ צִפִּ֔ינוּ אֶל גּ֖וֹי לֹ֥א יוֹשִֽׁעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/017.yaml
  text: Still our eyes failed[a], looking in vain for our help; in our watching we watched for a nation that could not save.
translation:
  language: zh_hans
  text: 我们的眼目仍因徒然等候援助而疲惫不堪；我们不断守望，等候一个不能施救的国家[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “等候”也可译作“守候”或“张望”；“不能施救”也可译作“没有施救”。希伯来语在这里既可着重无力施救，也可着重施救并未发生。
    reason: 保留צפה的语义范围，以及לֹא יוֹשִׁיעַ在能力与实际结果之间的歧义。
lexical_decisions:
- source_word: עוֹדֶינָה
  choice: 仍
  rationale: 表达动作或状态持续不止，与上下文中长久盼望却落空的情形相符。
- source_word: תִּכְלֶינָה עֵינֵינוּ
  choice: 我们的眼睛……昏花
  rationale: כלה用于眼睛，表示因长久等候、张望而耗损衰弱；“昏花”保留身体感受，也符合现代汉语表达。
- source_word: אֶל־עֶזְרָתֵנוּ הָבֶל
  choice: 因徒然盼望援助
  rationale: 原文结构凝练，הבל表明所盼援助终属虚空、无效；译文以“徒然”自然传达这种落空感，而不把“援助”本身过度实体化。
- source_word: בְּצִפִּיָּתֵנוּ צִפִּינוּ
  choice: 我们不断守望，等候
  rationale: 原文以同根名词和动词加强持续守望之意；汉语用“不断守望，等候”保留反复、持续的诗性力度，同时避免生硬重复。
- source_word: גּוֹי
  choice: 一个……国家
  rationale: 此处指被寄望提供军事或政治援助的外邦势力，“国家”比“民族”更贴合语境。
- source_word: לֹא יוֹשִׁעַ
  choice: 不能施救
  rationale: ישׁע的使役式意为拯救、解救；“不能施救”保留情境中的无力含义，但原文也可理解为事实上没有施救，故以脚注注明。
theological_decisions:
- issue: 所期待之外邦究竟无力拯救，还是事实上没有拯救
  choice: 不能施救
  alternative: 没有施救
  rationale: 未把该国描写成神学意义上的救主，只表达它无法带来所期待的现实解救；同时脚注保留希伯来语可指能力不足或结果未成的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“眼睛……昏花”保留因长久张望而衰弱的诗歌意象；“不断守望，等候”以自然汉语再现原文同根词反复所形成的强调。
