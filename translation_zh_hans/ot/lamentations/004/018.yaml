  text: צָד֣וּ צְעָדֵ֔י/נוּ מִ/לֶּ֖כֶת בִּ/רְחֹבֹתֵ֑י/נוּ קָרַ֥ב קִצֵּ֛י/נוּ מָלְא֥וּ יָמֵ֖י/נוּ כִּי בָ֥א קִצֵּֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/018.yaml
  text: They hunted our steps[a], so that we could not walk in our streets. Our end drew near; our days were fulfilled[c][b], for our end had come.
translation:
  language: zh_hans
  text: 他们窥伺着我们的脚步[a]，使我们不能在自己的街道上行走。我们的终局临近了；我们的日子满了[b]，因为我们的终局已经来到[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们追踪我们的脚步”或“他们埋伏等候我们的脚步”。原文动词含有敌意追逐、窥伺或伺机捕捉的意思。
    reason: lexical_alternative
  - marker: b
    text: “我们的日子满了”是希伯来语表达，意思是所定的时日已经届满。
    reason: cultural_note
  - marker: c
    text: “终局”指终结、尽头；在本节语境中含有毁灭、灭亡的意味，也可译作“尽头”。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוּ
  choice: 追捕
  rationale: 该动词在此表达带敌意的追逐、盯梢或埋伏；“追捕”保留了威胁和捕猎意味，同时符合现代汉语。
- source_word: צְעָדֵינוּ
  choice: 我们的脚步
  rationale: 直译为“我们的脚步”，既保留具体意象，也可自然表示他们的一举一动。
- source_word: מִלֶּכֶת
  choice: 使我们不能走
  rationale: 介词 מִן 与不定式在这里表示阻止；用明确的结果表达符合现代汉语，同时保留原句逻辑。
- source_word: בִּרְחֹבֹתֵינוּ
  choice: 在自己的街道上
  rationale: רְחֹבוֹת 可指街道、广场或城中的开阔处；语境中“街道”最自然，“自己的”对应第一人称复数所属关系。
- source_word: קָרַב קִצֵּינוּ
  choice: 我们的结局临近了
  rationale: קָרַב 表示临近，קֵץ 表示终局或尽头；“结局”保留词义，并让上下文传达毁灭意味。
- source_word: מָלְאוּ יָמֵינוּ
  choice: 我们的日子满了
  rationale: 保留希伯来语“日子满了”的意象；在此指所定的时日已经届满，不将其解释性含义直接替换进正文。
- source_word: כִּי בָא קִצֵּינוּ
  choice: 因为我们的结局已经来到
  rationale: כִּי 在此说明前句的原因；重复“结局”以对应原文重复的 קֵץ，并保留诗歌的强调。
