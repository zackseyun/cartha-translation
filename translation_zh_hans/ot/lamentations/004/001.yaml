base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/001.yaml
  text: How the gold has grown dim[b][a], how the fine gold has changed! The holy stones are poured out at the head of every street.
translation:
  language: zh_hans
  text: 黄金何竟黯淡，精金何竟变了样！圣石[a]被倾倒在每条街的街头[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“神圣的石头”或“圣所的石头”。希伯来语可能指分别为圣的圣殿石头，或诗歌意象中珍贵的圣石。
    reason: lexical_alternative
  - marker: b
    text: 直译“在每条街的头上”；可能指街口、街角或街道的起头处。
    reason: cultural_note
lexical_decisions:
- source_word: אֵיכָה
  choice: 何竟
  rationale: 以现代汉语中庄重而自然的感叹语气表达哀歌式的“怎么会如此”，保留惊痛与哀叹。
- source_word: יוּעַם
  choice: 黯淡
  rationale: 表达使之失去光泽、变暗的被动状态，又不把意象限定为金属锈蚀。
- source_word: זָהָב
  choice: 黄金
  rationale: 直接对应一般意义的“金”，并与下句更强调品质的“精金”形成层次。
- source_word: יִשְׁנֶא
  choice: 变了样
  rationale: 保留“改变、变得不同”的基本意义；汉语表达自然，也避免过度限定为单纯变色或变质。
- source_word: הַכֶּתֶם הַטּוֹב
  choice: 精金
  rationale: 简洁表达上好、贵重或精炼之金，并保留其与一般“黄金”的诗歌平行关系。
- source_word: תִּשְׁתַּפֵּכְנָה
  choice: 被倾倒
  rationale: 保留源于“倾倒、倒出”的鲜明意象，而不直接改释为“散落”。
- source_word: אַבְנֵי קֹדֶשׁ
  choice: 圣石
  rationale: 贴近“圣洁之石”的字面结构，避免断定是圣所建筑石、奉献的宝石，还是对锡安居民的比喻。
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: 在条条街头
  rationale: “街头”既自然地表达街道的端头或入口，也保留 רֹאשׁ“头”的空间意象；“条条”体现 כָּל 的周遍意义。
theological_decisions:
- issue: “圣石”的所指
  choice: 正文保留字面而开放的“圣石”
  alternative: 圣所的石头；分别为圣的宝石；借指锡安宝贵的居民
  rationale: 希伯来语诗句有意象上的多义性，下一节也可能引导读者联想到锡安的众子；译文不提前锁定其中一种解释。
translation_notes:
  register: 采用现代、庄重的哀歌语体。“何竟”承载惊叹与悲痛；两次“竟”使平行句和末句的惨状在汉语中连贯有力。正文保留“圣石”和“被倾倒”的陌生而鲜明的原文意象，并以脚注说明空间和所指上的歧义。
