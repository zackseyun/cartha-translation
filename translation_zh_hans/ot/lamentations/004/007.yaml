base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/007.yaml
  text: Her princes were purer than snow[a], whiter than milk; their bodies were more ruddy than corals[c][b], their form was like sapphire.
translation:
  language: zh_hans
  text: 她的显贵之人[a]比雪更纯净，比奶更洁白；他们的躯体比珊瑚[b]更红润，他们的形貌如蓝宝石[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“她的拿细耳人”或“她分别为圣的人”。原词可指因许愿而分别出来的人；在这里也可能指耶路撒冷身份显贵的人。
    reason: alternative_reading
  - marker: b
    text: 译作“珊瑚”的希伯来词所指不确定，也可能指红宝石、珍珠或另一种珍贵物质。
    reason: lexical_alternative
  - marker: c
    text: 这里的古代宝石名称可能指青金石，而非现代所说的蓝宝石。
    reason: cultural_note
lexical_decisions:
- source_word: נְזִירֶיהָ
  choice: 她的尊贵人
  rationale: 该词通常指分别出来或许愿归属的人，也可在此诗境中指耶路撒冷身份显贵者。正文采用不限定具体官职的“尊贵人”，既符合上下文对昔日精英的描写，也避免将争议词义直接定为“王子”；另在脚注保留“拿细耳人/分别为圣的人”。
- source_word: זַכּוּ
  choice: 比雪更纯净
  rationale: 动词表达纯净、洁净；与 מִן 构成诗意比较，译为“比雪更纯净”自然且贴近原文。
- source_word: צַחוּ
  choice: 比奶更洁白
  rationale: 动词有明亮、洁白之意；在“奶”的比较意象中，“洁白”最符合现代汉语表达。
- source_word: אָדְמוּ
  choice: 更红润
  rationale: 动词意为发红或呈红色；此处描写昔日健康华美的外观，“红润”比生硬的“更红”自然。
- source_word: עֶצֶם
  choice: 身体
  rationale: 本义为“骨头”，诗歌中可转指身体、躯体或体格。此处采用“身体”以传达整体外貌，同时避免过度解剖化。
- source_word: פְּנִינִים
  choice: 珊瑚
  rationale: 具体所指不确定，可能是珊瑚、红宝石、珍珠或其他珍贵物；因前面的动词强调红色，“珊瑚”较能维持意象，歧义在脚注说明。
- source_word: גִּזְרָתָם
  choice: 形貌
  rationale: 该名词指形状、体态或外观；“形貌”兼顾外形与诗体庄重感。
- source_word: סַפִּיר
  choice: 蓝宝石
  rationale: 保留传统而易懂的宝石名称；古代所指也可能是青金石，故在脚注注明。
theological_decisions:
- issue: נְזִירֶיהָ 所指群体的身份
  choice: 正文译作“尊贵人”，脚注保留“拿细耳人”与“分别为圣的人”
  alternative: 直接译作“她的拿细耳人”或“她的王子”
  rationale: 原词确有许愿分别者的常见词义，但本节也可能是在描写耶路撒冷昔日身份显赫的人。正文不把他们具体定为王族，也不抹去献身者的可能性，以保存原文张力。
translation_notes:
  register: 采用现代、庄重而清晰的诗体汉语，以两个分号对应原句层层推进的平行结构。正文保留雪、奶、珊瑚和宝石的鲜明意象；“尊贵人”避免现代政治职衔色彩过强，也不将有争议的身份解释绝对化。
