- from: 慈悲妇人的手竟煮了自己的儿女[a]；在我民之女遭毁灭时，他们成了母亲的食物[b]。
  to: 心地慈悲的妇人竟亲手煮了自己的儿女[a]；这些儿女在我民之女[b]的毁灭中成了她们的食物。
  rationale: 修订保留原文的直白与诗歌性：以“亲手”自然传达“妇人的手”，以“她们”对应原文复数代词，避免加入“母亲”这一额外称谓；并将文化说明脚注移至“我民之女”之后。“在……的毁灭中”保留其作为灾难背景的含义，而不把介词短语过度限定为单纯时间。
