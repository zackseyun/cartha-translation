base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/010.yaml
  text: The hands of compassionate women cooked their own children[b][a]; they became food for them in the destruction of the daughter of my people.
translation:
  language: zh_hans
  text: 心地慈悲的妇人竟亲手煮了自己的儿女[a]；这些儿女在我民之女[b]的毁灭中成了她们的食物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “煮了”也可译作“烹煮了”；希伯来语动词指烹煮，常可指水煮。
    reason: lexical_alternative
  - marker: b
    text: “我民之女”是希伯来诗歌中的人格化说法，指“我的人民”；在此类语境中也可特别关联耶路撒冷或锡安在灾难中的处境。
    reason: cultural_note
lexical_decisions:
- source_word: יְדֵי נָשִׁים רַחֲמָנִיּוֹת
  choice: 慈悲妇人的手
  rationale: 保留“手”这一具体而骇人的意象，也以“慈悲”呈现人物本性与行为之间的强烈反差。
- source_word: בִּשְּׁלוּ
  choice: 煮了
  rationale: 该动词指烹煮，语境中很可能特指水煮；“煮了”在现代汉语中自然直接，又不超出原词范围。
- source_word: יַלְדֵיהֶן
  choice: 自己的儿女
  rationale: “自己的”清楚表达希伯来语第三人称阴性复数所属关系；“儿女”不额外限定孩子的性别。
- source_word: הָיוּ לְבָרוֹת לָמוֹ
  choice: 他们成了母亲的食物
  rationale: 原文直译近于“他们成了她们的食物”。汉语若只说“她们”易产生指代混淆，故用“母亲”明确消费者就是前述妇人，同时保留原文的惨烈直陈。
- source_word: בְּשֶׁבֶר
  choice: 遭毁灭时
  rationale: שֶׁבֶר可指破碎、崩毁或灾难；此处描述耶路撒冷的毁灭，“遭毁灭时”自然表达事件背景。
- source_word: בַּת עַמִּי
  choice: 我民之女
  rationale: 保留希伯来诗歌中的人格化称谓，不将其平化为单纯的“我的人民”；“之女”具有庄重诗体色彩。
theological_decisions:
- issue: 是否保留בַּת עַמִּי的人格化表达
  choice: 我民之女
  alternative: 我的人民／我的同胞
  rationale: 原短语不仅指人民，也以女性形象人格化群体，尤其关联遭毁灭的耶路撒冷或锡安；保留隐喻可维护哀歌的诗性与神学张力。
- issue: 如何呈现母食其子的惨状
  choice: 煮了自己的儿女；他们成了母亲的食物
  alternative: 把自己的儿女煮来吃了
  rationale: 原文分成两个并列陈述，既写烹煮，也写孩子成为食物。译文不弱化其恐怖，也不把两个分句压缩成原文没有的单一动作表达。
translation_notes:
  register: 采用现代、庄重而直白的哀歌体。“慈悲妇人的手”保留原文突出的“手”；“我民之女”保留人格化隐喻。正文中的脚注标记均与脚注对应。
