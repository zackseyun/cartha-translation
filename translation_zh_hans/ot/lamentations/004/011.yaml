  to: 耶和华发尽了他的烈怒[a]，倾倒了他炽热的怒气；他在锡安点燃了火，火烧毁了她的根基。
  rationale: 修订区分了“发尽”（כלה）与“倾倒”（שפך），保留原文愤怒表达的诗歌性递进及“炽热”的意象；删去无明确依据的“大”，并保留锡安的女性拟人称谓。
