base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/011.yaml
  text: Yahweh has exhausted his wrath[a]; he has poured out his burning anger. He kindled a fire in Zion[b], and it consumed her foundations.
translation:
  language: zh_hans
  text: 耶和华发尽了他的烈怒[a]，倾倒了他炽热的怒气；他在锡安点燃了火，火烧毁了她的根基。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “发尽了”也可译作“使他的烈怒达到尽头”或“完全用尽了他的烈怒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּה
  choice: 倾尽了
  rationale: 该动词在这里表示使某物达到尽头、完全耗尽；“倾尽了”自然表达烈怒已充分发尽，同时保留“完成／耗尽”的语义空间。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”译出四字神名，而不以称号替代。
- source_word: חֲמָתוֹ
  choice: 他的烈怒
  rationale: חֵמָה表示强烈的愤怒或震怒；“烈怒”简洁庄重，并与下句的怒火意象呼应。
- source_word: שָׁפַךְ
  choice: 倒出了
  rationale: 保留“倾倒”的具体隐喻；与怒火搭配在现代汉语中清楚有力。
- source_word: חֲרוֹן אַפּוֹ
  choice: 他的怒火
  rationale: 该短语字面涉及怒气的燃烧或炽热；“怒火”既保留热力意象，也符合自然汉语。
- source_word: וַיַּצֶּת אֵשׁ
  choice: 燃起大火
  rationale: 准确传达点燃、使火烧起之意；加“大”体现无冠词希伯来语中此处火势的毁灭性，而不改变核心意象。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: 按介词ב的通常地点义，说明火在锡安燃起。
- source_word: וַתֹּאכַל
  choice: 烧毁了
  rationale: 动词以火为主语，意为吞吃、焚尽；“烧毁”在汉语中自然呈现火的彻底破坏。
- source_word: יְסוֹדֹתֶיהָ
  choice: 她的根基
  rationale: 阴性单数后缀指拟人化的锡安；采用“她”保留原文的城市拟人手法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且具有专名功能的“耶和华”，不以“主”这一称号替代；“雅威”是另一种可能的音译。
- issue: 神圣审判中的双重愤怒表达
  choice: 分别译作“烈怒”和“怒火”
  alternative: 合并为单一的“愤怒”表达
  rationale: 原文并列חֵמָה与חֲרוֹן אַף两个相关但不完全相同的表达；分别翻译保留诗歌的递进和燃烧意象，不削弱审判的张力。
- issue: כִּלָּה所表达的烈怒达到尽头
  choice: 倾尽了他的烈怒
  alternative: 完成了他的烈怒
  rationale: “倾尽”表达烈怒被完全发出，而不把原文机械化为不自然的“完成愤怒”；脚注保留“使……达到尽头／完全发尽”的语义说明。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。保留“倒出—怒火—燃起大火”的连续意象，以及锡安作为女性城市形象的“她”。避免把两个愤怒词组压缩为一个，也不将审判意象抽象化。
