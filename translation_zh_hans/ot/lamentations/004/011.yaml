  source_fidelity: “倾尽了他的烈怒”可以表达将怒气完全发出的结果，但“倾尽”本身带有倾倒意象，紧接“倒出了”会使两个不同的希伯来动词（כלה、שפך）在汉语中显得重复且界限不清。改为“发尽了”可更准确呈现“使其至尽／完全用尽”的意思，同时保留下一分句的“倾倒”隐喻。
  naturalness: 修订后“耶和华发尽了他的烈怒，倾倒了他炽热的怒气”庄重、自然，且保留原文并列递进。将“燃起大火”改为“点燃了火”，避免原文未明示的“大”字；明确以“火”为后句主语也使行文更清晰。
  terminology: “耶和华”“锡安”“烈怒”“炽热的怒气”均适合现代标准汉语的庄重经文语体。“她的根基”恰当保留锡安的阴性拟人化。
