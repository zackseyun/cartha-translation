  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: מֵֽ/חַטֹּ֣את נְבִיאֶ֔י/הָ עֲוֺנ֖וֹת כֹּהֲנֶ֑י/הָ הַ/שֹּׁפְכִ֥ים בְּ/קִרְבָּ֖/הּ דַּ֥ם צַדִּיקִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/013.yaml
  text: Because of the sins of her prophets[a], the iniquities of her priests, who poured out in her midst the blood of the righteous[b],
translation:
  language: zh_hans
  text: 这事是因她的先知所犯的罪和她的祭司的罪孽；他们在城中流了[a]义人[b]的血。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“倾倒了”。原文分词的基本意思是“倒出、倾倒”，用于血时通常可自然译作“流（血）”。
    reason: lexical_alternative
  - marker: b
    text: 或译“无辜者”。原文更直译为“义人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחַטֹּאת
  choice: 这是因……所犯的罪
  rationale: 介词 מִן 在本句中表示原因；译作“这是因”自然承接上下文所述耶路撒冷的遭遇。“所犯的罪”符合现代汉语搭配。
- source_word: נְבִיאֶיהָ
  choice: 她的先知
  rationale: 保留第三人称阴性单数后缀所体现的城市人格化指代。
- source_word: עֲוֺנוֹת
  choice: 所行的恶
  rationale: עָוֹן 可指罪孽、邪恶及其罪责。译作“所行的恶”既与前面的“罪”有所区别，也避免生硬的“罪孽”。
- source_word: כֹּהֲנֶיהָ
  choice: 她的祭司
  rationale: 按通常意义直译，并保留指向城市的领属关系。
- source_word: הַשֹּׁפְכִים
  choice: 他们……流了
  rationale: 分词为阳性复数，在句法上说明前述责任者。汉语用“他们”另起分句，清楚自然；“流……的血”保留 שפך 的倾倒意象。
- source_word: בְּקִרְבָּהּ
  choice: 在城中
  rationale: 后缀指向耶路撒冷；“在城中”自然表达“在她里面／在她中间”，并明确暴行发生于城内。
- source_word: דַּם
  choice: 血
  rationale: 作为 שפך 的宾语，按原义直译。
- source_word: צַדִּיקִים
  choice: 义人
  rationale: 保留该词所表达的道德与关系性类别，不将其缩窄为纯司法意义的“无辜者”。
theological_decisions:
- issue: צַדִּיקִים 应译为广义的道德类别，还是仅指司法上的无辜
  choice: 义人
  alternative: 无辜者
  rationale: “义人”更完整地保留希伯来词的伦理与盟约色彩；“无辜者”在流血语境中虽可成立，却会缩窄词义。
- issue: 复数分词 הַשֹּׁפְכִים 所指的责任者范围
  choice: 用“他们”承接先知和祭司
  alternative: 仅把关系分句连接于紧邻的“祭司”
  rationale: 阳性复数分词可概括前面并列的两类领袖；上下文也将先知与祭司的罪恶共同列为原因。译文用“他们”表达这一自然读法，但不另加更具体的罪责分配。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“这是因”承接哀歌上下文；分号保留原句由原因陈述转入罪行说明的结构。以“她”维持耶路撒冷被人格化为女性的表达。
