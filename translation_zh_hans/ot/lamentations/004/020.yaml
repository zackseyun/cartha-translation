  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ר֤וּחַ אַפֵּ֨י/נוּ֙ מְשִׁ֣יחַ יְהוָ֔ה נִלְכַּ֖ד בִּ/שְׁחִיתוֹתָ֑/ם אֲשֶׁ֣ר אָמַ֔רְנוּ בְּ/צִלּ֖/וֹ נִֽחְיֶ֥ה בַ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/020.yaml
  text: The breath of our nostrils[a], Yahweh’s anointed, was captured in their pits—he of whom we said, “Under his shadow we will live among the nations.”
translation:
  language: zh_hans
  text: 我们鼻孔中的气息——耶和华的受膏者——在他们的坑中被捉住了[a]；论到他，我们曾说：“我们要在他的荫下，活在列国之中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑”或译“圈套”或“罗网”。
    reason: 原词可指挖下的捕捉坑，也可表示用来捕获或毁灭人的圈套、罗网；各译法都符合此处敌人设法擒获君王的语境。
lexical_decisions:
- source_word: ר֤וּחַ אַפֵּ֨ינוּ֙
  choice: 我们鼻孔中的气息
  rationale: 直译这一具体而强烈的希伯来语意象，表达百姓视君王为赖以生存的气息；不淡化为“我们的生命”，也不误译作“风”或抽象的“灵”。
- source_word: מְשִׁ֣יחַ יְהוָ֔ה
  choice: 耶和华的受膏者
  rationale: מְשִׁיחַ在本节指犹大的受膏君王。“受膏者”保留王权与圣约背景，同时不把经文直接改写成末世性的“弥赛亚”。
- source_word: נִלְכַּ֖ד
  choice: 被捉住了
  rationale: 该动词的尼法勒式表示被捕获、被捉住；此译既适合敌人设坑捕捉的图像，也符合君王被擒的历史语境。
- source_word: בִּשְׁחִיתוֹתָ֑ם
  choice: 在他们的深坑中
  rationale: שְׁחִיתוֹת可指用来捕捉或毁灭猎物的坑，也可引申为圈套、罗网。正文保留具体的“坑”这一图像，其他可能译法列于脚注。
- source_word: אֲשֶׁ֣ר אָמַ֔רְנוּ
  choice: 论到他，我们曾说
  rationale: 关系从句回指“耶和华的受膏者”。“曾说”自然体现这话是在君王被捉以前所怀的指望，但不过度规定更细的时序。
- source_word: בְּצִלּ֖וֹ
  choice: 在他的荫下
  rationale: 保留“荫”这一保护与庇护的王权隐喻，不直接解释成“在他的保护下”。
- source_word: נִֽחְיֶ֥ה
  choice: 我们要……活
  rationale: 按动词基本义译作“活”，让上下文自然传达存活、安居的含义，而不收窄为“幸存”。
- source_word: בַגּוֹיִֽם
  choice: 在列国之中
  rationale: גּוֹיִם在此指外国列邦；“列国”符合旧约政治与流亡语境，也避免“外邦人”可能带来的后期宗教色彩。
theological_decisions:
- issue: מְשִׁיחַ יְהוָה是否应译成直接指向末世弥赛亚或基督的称号
  choice: 译作“耶和华的受膏者”，按直接语境指历史中的大卫王朝君王
  alternative: 译作“耶和华的弥赛亚”
  rationale: 本节哀叹犹大君王被敌人擒获。虽然מְשִׁיחַ与“弥赛亚”同源，但正文不应把历史王权称号直接改写为末世预言；“受膏者”仍完整保留该词的神学分量及其可能产生的正典关联。
- issue: “他的荫”是否应在正文中解释为政治保护
  choice: 保留“在他的荫下”的隐喻
  alternative: 译作“在他的保护下”
  rationale: 原文有意使用荫庇意象，既可表达君王的保护，也带有百姓依赖他的张力；直留隐喻可避免把丰富意涵缩减为单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“鼻孔中的气息”刻意保留原文突兀而有力的身体意象；破折号标明“耶和华的受膏者”是对该意象的同位说明。“荫下”和“列国之中”保留诗歌体的凝练与尊严。
