  text: קַלִּ֤ים הָיוּ֙ רֹדְפֵ֔י/נוּ מִ/נִּשְׁרֵ֖י שָׁמָ֑יִם עַל הֶ/הָרִ֣ים דְּלָקֻ֔/נוּ בַּ/מִּדְבָּ֖ר אָ֥רְבוּ לָֽ/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/019.yaml
  text: Our pursuers were swifter than the eagles of the heavens[a]; on the mountains they pursued us; in the wilderness they lay in wait for us.
translation:
  language: zh_hans
  text: 追赶我们的人比天上的鹰还快[a]；他们在山上穷追我们，在旷野埋伏着等候我们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “鹰”或译“秃鹫”；希伯来语 נֶשֶׁר 在某些语境中也可指秃鹫。
    reason: 保留原词所指鸟类的词义范围，避免正文消除真实的词汇歧义。
lexical_decisions:
- source_word: קַלִּים
  choice: 还快
  rationale: 在介词 מִן 所引出的比较结构中表达“更快”；“比……还快”符合现代汉语习惯，也保留诗句的速度感。
- source_word: רֹדְפֵינוּ
  choice: 追赶我们的人
  rationale: רדף 表示追赶、追逐；采用动词性短语比“追兵”更贴近原文分词名词化的表达，也不额外限定其身份。
- source_word: מִנִּשְׁרֵי שָׁמָיִם
  choice: 比天上的鹰
  rationale: נשר 通常可指鹰，也可能指大型秃鹫；正文采用传统且符合速度意象的“鹰”，“天上的”自然传达 שָׁמָיִם 的空间意象。
- source_word: עַל הֶהָרִים
  choice: 在山上
  rationale: 直接保留地点表达及山地意象，现代汉语自然清楚。
- source_word: דְּלָקֻנוּ
  choice: 穷追我们
  rationale: דלק 在此表示紧迫、猛烈地追赶；“穷追”既体现强度，也与前句“追赶我们的人”形成有意的词义呼应。
- source_word: בַּמִּדְבָּר
  choice: 在旷野
  rationale: מִדְבָּר 常指荒野、旷野地带，不一定是沙漠；“旷野”保留较宽泛的地貌含义和经文语体。
- source_word: אָרְבוּ לָנוּ
  choice: 埋伏等候我们
  rationale: ארב 指潜伏等候、伺机袭击；“埋伏等候”保留其持续守候和伏击意味，而不把尚未明说的袭击结果写入正文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的汉语；两分句以“在山上……在旷野……”构成诗歌式平行。“穷追”传达 דלק 的追逐强度，但不扩展为“追杀”等原文未明说的结果。
