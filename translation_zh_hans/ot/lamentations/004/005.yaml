base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/005.yaml
  text: Those who used to eat delicacies are desolate in the streets[a]; those who were brought up on scarlet embrace ash heaps.
translation:
  language: zh_hans
  text: 吃惯珍馐美味的人，如今在街头凄凉；在朱红色织物中养大的人，如今抱住垃圾堆[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“粪堆”或“灰烬堆”；希伯来语所指的是堆放废弃物的地方，突出他们如今所受的极大羞辱。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹכְלִים לְמַעֲדַנִּים
  choice: 吃惯珍馐美味的人
  rationale: 分词在这里作名词用；结合哀歌所描绘的今昔逆转，用“吃惯”自然表达他们从前长期享用奢华食物。מַעֲדַנִּים 指精美、奢华的食物，“珍馐美味”既准确又庄重易懂。
- source_word: נָשַׁמּוּ
  choice: 凄凉
  rationale: 该动词可表达荒凉、衰败或惊骇。此处主语是人，“凄凉”保留其处境惨败、孤苦的意味，又不把含义收窄为单纯的身体衰弱。
- source_word: בַּחוּצוֹת
  choice: 在街头
  rationale: 指城中的街道或公共空间；“街头”简洁地传达他们暴露于公众之中、失去昔日安逸的处境。
- source_word: הָאֱמֻנִים
  choice: 养大的人
  rationale: אמן 的被动分词在此指受照料、被抚养长大，并非“忠信的人”。
- source_word: עֲלֵי תוֹלָע
  choice: 在朱红锦缎上
  rationale: תולע 字面与制取红色染料的虫有关，此处借指昂贵的朱红色织物。“朱红锦缎”把原文含蓄的奢华织物意象自然传达给现代读者。
- source_word: חִבְּקוּ
  choice: 抱住
  rationale: 保留动词“拥抱、抱住”的具体动作，使昔日奢华与如今屈辱之间的反差更鲜明。
- source_word: אַשְׁפַּתּוֹת
  choice: 垃圾堆
  rationale: 该词指弃置废物之处，也可指粪堆或灰烬堆。“垃圾堆”在现代汉语中最自然，并清楚表现极度贫困和受辱的景象；其他可能含义收入脚注。
