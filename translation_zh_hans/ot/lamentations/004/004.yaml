  - severity: low
    issue: “无人掰给他们”省略“饼”，动作与受事关系略显压缩。
    rationale: 原文的分词与“饼”相连；补出“把饼掰开”能以自然现代汉语清楚呈现“无人为他们掰开／分饼”的意思。
  revised_text: 吃奶的婴孩的舌头因口渴紧贴上腭；孩童求饼，却无人把饼掰开给他们。
