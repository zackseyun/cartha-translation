  text: דָּבַ֨ק לְשׁ֥וֹן יוֹנֵ֛ק אֶל חכּ֖/וֹ בַּ/צָּמָ֑א עֽוֹלָלִים֙ שָׁ֣אֲלוּ לֶ֔חֶם פֹּרֵ֖שׂ אֵ֥ין לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/004.yaml
  text: The tongue of the nursing infant sticks to the roof of his mouth because of thirst[a]; children ask for bread[b], but no one breaks it for them.
translation:
  language: zh_hans
  text: 吃奶的婴孩的舌头因口渴紧贴上腭；孩童求饼，却无人把饼掰开给他们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּבַק
  choice: 紧贴
  rationale: 该动词表示黏附、紧贴；“紧贴”自然传达因极度口渴而舌头黏住上颚的情形。
- source_word: לְשׁוֹן
  choice: 舌头
  rationale: 保留原文直接的身体部位称谓。
- source_word: יוֹנֵק
  choice: 吃奶婴孩
  rationale: 指仍在吃奶的幼儿；此译简明易懂，也保留饥荒场景中的脆弱感。
- source_word: אֶל חִכּוֹ
  choice: 上颚
  rationale: חֵךְ 在此指口腔顶部或腭部；“上颚”在现代汉语中准确而简洁。
- source_word: בַּצָּמָא
  choice: 因口渴
  rationale: 介词短语在此表达原因；“因口渴”自然保留其因果关系。
- source_word: עוֹלָלִים
  choice: 孩童
  rationale: 该词指年幼的孩子；“孩童”简洁、庄重，并符合诗歌语体。
- source_word: שָׁאֲלוּ
  choice: 求
  rationale: 基本义为请求、索求；“求饼”既保留原义，也自然显出困境，而不额外强化为“乞讨”。
- source_word: לֶחֶם
  choice: 饼
  rationale: 保留具体食物意象；在圣经时代语境中，“饼”比泛译“食物”更贴近原文。
- source_word: פֹּרֵשׂ
  choice: 掰给
  rationale: 分词在语境中指掰开并分给孩子；“掰给”以简洁现代汉语同时表达掰饼和分配的含义。
- source_word: אֵין לָהֶם
  choice: 无人……给他们
  rationale: 原文直译为“没有给他们的”；结合分词，汉语自然表达为“无人掰给他们”。
theological_decisions: []
translation_notes:
  register: 采用现代、凝练而庄重的诗歌语言。两分句形成从吃奶婴孩到孩童的递进画面；保留“饼”的具体意象，并以“掰给”呈现原文所含掰开、分给之意。无需脚注，因为正文已能自然准确地表达相关词义。
