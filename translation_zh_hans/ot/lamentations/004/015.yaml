base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/015.yaml
  text: “Turn aside! Unclean!” they cried to them[a]. “Turn aside, turn aside, do not touch!” For they have fled; they have even wandered. Among the nations they said[b], “They will stay no longer.”
translation:
  language: zh_hans
  text: “走开！不洁净！”人们向他们喊道：“走开！走开！不要触碰！”因为他们已经逃散[a]，甚至四处漂泊。列国中有人说：“他们不再寄居了。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “逃散”所译的希伯来语动词较为罕见，此处也可理解为“被赶走”。
    reason: lexical_alternative
  - marker: b
    text: “寄居”指以外来者或暂居者的身份居住；原文没有明说“在我们这里”。
    reason: lexical_clarification
lexical_decisions:
- source_word: סוּרוּ
  choice: 走开
  rationale: 这是复数命令式，在此是公开发出的警告或驱离之声。“走开”自然、直接，并保留重复所形成的强烈语气。
- source_word: טָמֵא
  choice: 不洁净的
  rationale: 该词指礼仪和社会意义上的不洁，在此作为称呼或惊呼；“不洁净的”保留其圣经语境中的专门含义。
- source_word: קָרְאוּ לָמוֹ
  choice: 人们向他们喊道
  rationale: קרא 加 ל 表示朝某人发声；“喊道”体现公开呼喊的急迫性。希伯来文主语未明说，中文用泛指的“人们”使句子自然，同时不指定具体群体。
- source_word: אַל תִּגָּעוּ
  choice: 不要触碰
  rationale: נגע 的基本义是“触碰”。原文未明说触碰的对象，译文也不补出“他们”，以保留句法上的开放性。
- source_word: כִּי
  choice: 因为
  rationale: 按其常见解释性用法连接前后的呼喊与逃散状况；虽然上下文也可理解为时序或承接关系，但正文保留较形式对应的因果连接。
- source_word: נָצוּ
  choice: 已经逃散
  rationale: 这是较罕见且含义有争议的动词；“逃散”兼顾逃离与分散的语境，但不排除被驱逐的被动意味，故另加脚注。
- source_word: גַּם נָעוּ
  choice: 甚至四处漂泊
  rationale: נוע 在此适合表达流离、漂泊；גַּם 译为“甚至”，体现递进强调。
- source_word: אָמְרוּ בַּגּוֹיִם
  choice: 列国中有人说
  rationale: ב 表示言语发生的范围或地点。原文只说复数的“他们说”，所指并不完全明确；用“有人说”避免把发言者过度限定为某一群体。
- source_word: לֹא יוֹסִיפוּ לָגוּר
  choice: 他们不可再寄居了
  rationale: גור 指以外来者或暂居者身份居住；“寄居”保留这一重要语义。未补出“在我们这里”，因为原文没有明说地点或关系对象。
theological_decisions: []
