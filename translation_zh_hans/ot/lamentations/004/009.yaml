base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/009.yaml
  text: Better were those slain by the sword than those slain by hunger[a], who waste away, pierced through for lack of the produce of the field.
translation:
  language: zh_hans
  text: 死于刀剑的，比那些因饥饿而死、渐渐衰残的人更为幸好；他们因缺少田间的出产，身体被刺透[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来文含义较难确定，尤其是译作“渐渐衰残”的动词，以及“田间的出产”之前介词的作用。也可译作：“他们渐渐衰残，身体被刺透，因田间没有出产。”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבִים הָיוּ
  choice: 还好
  rationale: 这里表达处境上的相对优劣，并非道德意义上的“好”；“还好”自然地保留哀歌中惨烈的比较。
- source_word: חַלְלֵי חֶרֶב
  choice: 被刀杀死的
  rationale: חָלָל通常指被杀者；“被刀杀死”清楚表达构造短语中的工具意义。
- source_word: מֵחַלְלֵי רָעָב
  choice: 比被饥饿杀死的
  rationale: 前缀מ表示比较；“饥饿”突出受害者经历的死亡过程，同时符合饥荒背景。
- source_word: שֶׁהֵם
  choice: 后者
  rationale: 将关系从句明确承接“被饥饿杀死的”，避免现代汉语中指代含混，却不额外添加因果解释。
- source_word: יָזוּבוּ
  choice: 渐渐衰残
  rationale: 该动词在此语境中的确切含义有困难，可能含流尽、消耗或衰残之意；“渐渐衰残”表达长期饥饿下生命耗尽的过程。
- source_word: מְדֻקָּרִים
  choice: 身体被刺透
  rationale: 保留דקר“刺透”的强烈意象；“身体”使中文表达自然，但不把这一意象限定为真实武器所造成的伤口。
- source_word: מִתְּנוּבֹת שָׂדָי
  choice: 因田间没有出产
  rationale: 按上下文将מ理解为匮乏或原因，说明他们因缺少田地出产而衰残；原文介词的确切作用仍有争议，故以脚注注明。
