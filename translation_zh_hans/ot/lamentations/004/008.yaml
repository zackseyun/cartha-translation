base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/008.yaml
  text: Their appearance is darker than soot[a]; they are not recognized in the streets. Their skin has shriveled on their bones[b]; it has become dry like wood.
translation:
  language: zh_hans
  text: 他们的容貌比煤烟还黑[a]；在街上，人们认不出他们。他们的皮肤在骨头上紧缩[b]，干得像木头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“比黑暗更黑。”希伯来语“שְׁחוֹר”可泛指黑色或黑暗；正文译作“煤烟”，以呈现具体意象。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他们的皮肤紧贴着骨头。”这里的希伯来语动词可理解为皮肤收缩，紧紧贴在骨头上。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁךְ מִשְּׁחוֹר
  choice: 比煤黑更暗
  rationale: חָשַׁךְ描述变暗后呈现的状态，比较用的מִן引出שְׁחוֹר。译作“比煤黑更暗”保留比较结构和具体可见的黑色意象；שְׁחוֹר也可能泛指黑暗，故加脚注。
- source_word: תָּאֳרָם
  choice: 他们的面容
  rationale: תֹּאַר指外形、容貌或外观；此处涉及人在街上无法被认出，“面容”自然凝练，并符合可辨认的语境。
- source_word: לֹא נִכְּרוּ
  choice: 已无人认得
  rationale: נכר的尼法勒式表示不能被辨认。中文以主动式“无人认得”自然表达相同的被动结果，“已”突出当前惨状。
- source_word: בַּחוּצוֹת
  choice: 在街上
  rationale: חוּצוֹת在城市语境中通常指街道或公共场所；“街上”是现代汉语最自然的对应。
- source_word: צָפַד עוֹרָם עַל עַצְמָם
  choice: 他们的皮肤紧缩在骨头上
  rationale: 罕见动词צָפַד在此描写饥荒使皮肤收缩、紧贴骨头的状态；“紧缩在”既保留收缩意象，也不过度限定词义。另见脚注中的自然替代译法。
- source_word: יָבֵשׁ הָיָה כָעֵץ
  choice: 干枯得像木头
  rationale: היה加形容词表达成为或处于干燥状态；עֵץ在此以“木头”表达无生命、干硬的质感，比“树”更符合上下文。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。首句保留希伯来诗歌的强烈视觉对比；后半句用“紧缩”“干枯”呈现饥荒造成的消瘦与干硬，同时避免加入原文没有明说的因果解释。所有脚注标记均已置于正文相应位置。
