  text: וַ/יִּגְדַּל֙ עֲוֺ֣ן בַּת עַמִּ֔/י מֵֽ/חַטַּ֖את סְדֹ֑ם הַֽ/הֲפוּכָ֣ה כְמוֹ רָ֔גַע וְ/לֹא חָ֥לוּ בָ֖/הּ יָדָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/006.yaml
  text: For the iniquity of the daughter of my people has grown greater than the sin of Sodom[a], which was overthrown in a moment[b], though no hands labored against her.
translation:
  language: zh_hans
  text: 我民的女儿的罪孽，已比所多玛的罪更大[a]；所多玛顷刻间便被倾覆，没有人的手加害于她[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “罪孽”也可译作“罪责”，或理解为罪孽所招致的“惩罚”。
    reason: lexical_alternative
  - marker: b
    text: 本节末句的希伯来文含义艰深；也可理解为“没有手为她劳苦或扭动”，或“没有手临到她身上”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: 还大
  rationale: גדל在比较结构中表示“变得更大／更为重大”。汉语用“比……还大”自然表达比较，也保留其程度加深的意味。
- source_word: עֲוֺן
  choice: 罪孽
  rationale: עָוֹן可指罪恶、罪责，也可连带指罪的惩罚；此处与“所多玛的罪”比较，正文采用道德意义较直接的“罪孽”，并在脚注保留“罪责／惩罚”的可能。
- source_word: בַּת עַמִּי
  choice: 我民之女
  rationale: 保留希伯来哀歌中将耶路撒冷／犹大人格化为“女儿”的传统意象，不将其解释性改写为“我的百姓”。
- source_word: מֵחַטַּאת סְדֹם
  choice: 比所多玛的罪
  rationale: מִן在此标示比较；חַטָּאת按上下文取“罪”，而非“赎罪祭”。
- source_word: הַהֲפוּכָה
  choice: 被倾覆
  rationale: 采用被动表达，并保留与《创世记》中所多玛遭倾覆的互文联系。
- source_word: כְמוֹ רָגַע
  choice: 顷刻间
  rationale: 该短语强调灾变突然发生；“顷刻间”简洁、庄重，也符合现代汉语。
- source_word: וְלֹא חָלוּ בָהּ יָדָיִם
  choice: 并没有人的手加害于她
  rationale: 原文末句高度压缩且含义不确定。“人的手加害于她”较贴近“手”与介词בְּ的表面形式，同时避免断言具体是围攻、劳作或哀恸；其他读法列入脚注。
theological_decisions:
- issue: עָוֹן在与所多玛比较时的含义
  choice: 正文理解为罪孽／罪责
  alternative: 罪孽所招致的惩罚
  rationale: עָוֹן可兼指罪与罪罚，但紧接“所多玛的罪”使道德层面的比较较为顺畅；脚注保留惩罚义，避免消除原词的语义张力。
- issue: 末句所描述的情形
  choice: 所多玛被突然倾覆，并非人的手加害所致
  alternative: 没有人为她搓手哀恸；或没有人的手持续攻打／劳作于她
  rationale: 希伯来语措辞艰深。正文尽量按字面保留“手加害”的开放表达，不进一步指定为围城或长期攻击；脚注明示主要异读。
translation_notes:
  register: 采用现代、庄重而可懂的书面汉语。“我民之女”有意保留哀歌的拟人意象；分号呈现罪孽比较与所多玛突然倾覆之间的紧密关系。
