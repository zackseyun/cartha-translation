id: LAM.4.22
reference: Lamentations 4:22
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תַּם עֲוֺנֵ/ךְ֙ בַּת צִיּ֔וֹן לֹ֥א יוֹסִ֖יף לְ/הַגְלוֹתֵ֑/ךְ פָּקַ֤ד עֲוֺנֵ/ךְ֙ בַּת אֱד֔וֹם גִּלָּ֖ה עַל חַטֹּאתָֽיִ/ךְ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/022.yaml
  text: Your punishment is finished[a], daughter Zion; he will not exile you again. He has punished your iniquity, daughter Edom[c][b]; he has uncovered your sins.
translation:
  language: zh_hans
  text: 锡安的女子啊，你所受的惩罚已经结束了[a]；他不再把你放逐。以东的女子啊，他已追讨你的罪孽[b]，揭露你的罪恶[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的罪孽已经尽了”，或“你的罪责已经结束了”。希伯来语这个词可指罪孽、罪责，也可指罪所招致的惩罚。
    reason: lexical_alternative
  - marker: b
    text: “追讨”也可译作“追究”或“惩罚”；原文在审判语境中有临到罪上施行审判、追究责任的意思。
    reason: lexical_alternative
  - marker: c
    text: 或译：“显露你的罪恶”或“揭开你的罪恶”。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּם
  choice: 已经结束了
  rationale: 该词表示完成或终结；结合锡安流亡将止的语境，译作“已经结束了”自然清楚。
- source_word: עֲוֺנֵךְ（第一处）
  choice: 你所受的惩罚
  rationale: עָוֹן可指罪孽、罪责，也可指罪所招致的惩罚。下句说不再使锡安流亡，因此此处采用结果性的“惩罚”，并以脚注保留其他可能。
- source_word: בַּת צִיּוֹן
  choice: 锡安女子
  rationale: 保留希伯来诗歌中把锡安城及其居民人格化为女子的称呼，同时符合现代汉语圣经语体。
- source_word: לֹא יוֹסִיף לְהַגְלוֹתֵךְ
  choice: 他必不再使你流亡
  rationale: יָסַף加不定式在此表示不再做某事；הגלה是使人离乡、放逐。译作“使你流亡”兼顾使役含义与中文自然度。
- source_word: פָּקַד
  choice: 已追讨
  rationale: פקד在审判语境中表示临到、查究并追究责任。“追讨”保留其问责和施行审判的力度，避免只译成泛化的“惩罚”。
- source_word: עֲוֺנֵךְ（第二处）
  choice: 你的罪孽
  rationale: 在“追讨”的宾语位置上译作“罪孽”，突出以东被追究的罪，并与后面的“罪恶”形成诗意平行。
- source_word: בַּת אֱדוֹם
  choice: 以东女子
  rationale: 与“锡安女子”对应，保留对以东国家及其人民的诗性人格化称呼。
- source_word: גִּלָּה עַל חַטֹּאתָיִךְ
  choice: 揭露你的罪恶
  rationale: גלה的加强词干在此有揭开、显露之意；“揭露”自然表达罪被公开显明，也保留审判色彩。
- source_word: חַטֹּאתָיִךְ
  choice: 你的罪恶
  rationale: 该复数形式指所犯的罪。“罪恶”在现代中文中自然庄重，并避免与前面的“罪孽”机械重复。
theological_decisions:
- issue: 首句עָוֹן的语义范围
  choice: 按罪所招致的惩罚理解，译为“你所受的惩罚”
  alternative: “你的罪孽已经尽了”或“你的罪责已经结束了”
  rationale: 流亡不再继续的紧接语境支持惩罚或罪罚后果这一含义；脚注保留“罪孽、罪责”的真实歧义，避免把一种解释绝对化。
- issue: יוֹסִיף、פָּקַד、גִּלָּה的隐含主语
  choice: 译作“他”，不明确补出身份
  alternative: 补译为“耶和华”
  rationale: 希伯来文本本节没有明说主语。上下文可使读者理解为上帝，但直接补出“耶和华”会增加原文未明载的名词，因此保留“他”。
- issue: פקד עון的司法含义
  choice: 译作“追讨你的罪孽”
  alternative: “惩罚你的罪孽”或较直译的“察看你的罪孽”
  rationale: “追讨”既表达上帝使罪受审、要求交账的语境含义，也保留פקד不只是一般惩罚的较宽语义。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。以“锡安女子／以东女子”保留原文对城市和民族的诗性人格化；用“流亡”表达被迫离乡的放逐处境。标点体现本节由安慰锡安转向审判以东的对照结构。
