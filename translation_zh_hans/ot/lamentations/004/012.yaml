  text: לֹ֤א הֶאֱמִ֨ינוּ֙ מַלְכֵי אֶ֔רֶץ ו/כל יֹשְׁבֵ֣י תֵבֵ֑ל כִּ֤י יָבֹא֙ צַ֣ר וְ/אוֹיֵ֔ב בְּ/שַׁעֲרֵ֖י יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/012.yaml
  text: The kings of the earth did not believe[a], nor did any of the inhabitants of the world, that an adversary and an enemy would enter the gates of Jerusalem.
translation:
  language: zh_hans
  text: 地上的君王和世上所有的居民都不相信，敌手和仇敌会从耶路撒冷的城门进入。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ
  choice: 不相信
  rationale: 该词在此表示不认为后述之事可信；“不相信”直接保留原文含义，后面的内容从句说明他们不相信什么。
- source_word: מַלְכֵי אֶרֶץ
  choice: 地上的君王
  rationale: אֶרֶץ 在与“世上所有的居民”平行时指全地；“地上的君王”自然、庄重，并保留普世范围。
- source_word: וְכָל יֹשְׁבֵי תֵבֵל
  choice: 和世上所有的居民都不
  rationale: 原文连词承接前面的否定；汉语将否定置于两个并列主语之后，既自然又保留“所有居民”的整体范围。
- source_word: כִּי
  choice: （引出“不相信”的内容）
  rationale: 此处引出所不相信的内容，汉语无需另译连接词即可自然表达。
- source_word: יָבֹא
  choice: 竟会进入
  rationale: 基本义是“来”，与“城门”搭配时语境表示进入；“会”保留未然事件的表达，“竟”传达上下文中的难以置信，但不改成单纯的可能性。
- source_word: צַר
  choice: 敌手
  rationale: 该词指对敌、逼迫的一方；“敌手”与后面的“仇敌”有所区分，保留原文同义并列的强调。
- source_word: וְאוֹיֵב
  choice: 和仇敌
  rationale: אוֹיֵב 是常用的“敌人”一词；译作“仇敌”可与“敌手”构成庄重而清楚的并列。
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: 进入耶路撒冷的城门
  rationale: 介词与运动动词连用可表示进入；现代汉语用“进入……的城门”明确表达敌军突破城门而入的意思。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。将两个并列主语合并承接“都不相信”，符合汉语习惯；保留“敌手和仇敌”的双重称谓，不把原文的强调压缩为单一名词。
