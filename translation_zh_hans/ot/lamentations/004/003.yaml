base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/003.yaml
  text: Even jackals offer the breast[a]; they nurse their young. The daughter of my people has become cruel[b], like ostriches in the wilderness.
translation:
  language: zh_hans
  text: 连豺狼也露出乳房[a]，给幼崽喂奶；我百姓的女儿却变得残忍，如旷野中的鸵鸟[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “豺狼”也可译为“海怪”或“巨龙”；此处描述它们给幼崽喂奶，按上下文译作“豺狼”。
    reason: lexical_alternative
  - marker: b
    text: “鸵鸟”也可译为“猫头鹰”；这个希伯来词传统上多理解为“鸵鸟”，参《约伯记》39:13—17。
    reason: lexical_alternative
lexical_decisions:
- source_word: תנין
  choice: 豺狼
  rationale: 此处所述动物露出乳房、哺养幼崽，语境指向陆生哺乳动物；译作“豺狼”最符合饥荒场景中的对比。
- source_word: חָלְצוּ שַׁד
  choice: 露出乳房
  rationale: 保留希伯来文具体的母性意象，表达显露或伸出乳房以供幼崽吃奶。
- source_word: הֵינִיקוּ
  choice: 哺养
  rationale: 该使役形表示使幼崽吸奶，即给幼崽喂奶；“哺养”简洁、庄重且自然。
- source_word: גּוּרֵיהֶן
  choice: 自己的幼崽
  rationale: 泛指动物的幼小后代；“幼崽”适合前文所译的陆生动物。
- source_word: בַּת עַמִּי
  choice: 我民的女儿
  rationale: 保留先知诗歌中将群体人格化为女儿的表达，不将其解释性改写为“我的百姓”。
- source_word: לְאַכְזָר
  choice: 变得残忍
  rationale: 介词ל与形容词构成结果状态，表现人在灾难中转为残忍的变化。
- source_word: כִּי עֲנִים
  choice: 如……鸵鸟
  rationale: כִּי在此作比较；עֲנִים传统上理解为鸵鸟，也与《约伯记》39章所呈现的育雏意象相合。
- source_word: בַּמִּדְבָּר
  choice: 旷野中
  rationale: “旷野”既保留מִדְבָּר的广泛语义，也符合哀歌的诗体语域。
theological_decisions: []
