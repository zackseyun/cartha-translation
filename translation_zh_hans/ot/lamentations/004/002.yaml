base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/002.yaml
  text: The precious sons of Zion[a], weighed out against fine gold—how they are regarded as clay jars[b], the work of a potter’s hands.
translation:
  language: zh_hans
  text: 锡安那些宝贵的众子[a]，价值堪比精金[b]——怎会被看作陶匠亲手所造的瓦器[c]！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锡安宝贵的儿女”。原文为阳性复数表达；按上下文，也可能泛指锡安的居民。
    reason: lexical_alternative
  - marker: b
    text: 或译“用精金称量”或“被看得如精金一般”。原文可能侧重称量的具体意象，也可能侧重价值评定。
    reason: lexical_alternative
  - marker: c
    text: 或译“陶器”或“陶土罐”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי צִיּוֹן
  choice: 锡安的众子
  rationale: 直译为“锡安的众子”，保留希伯来语阳性复数和诗歌意象；在上下文中也可能泛指锡安的居民。
- source_word: הַיְקָרִים
  choice: 宝贵的
  rationale: 表达珍贵、高价值，也符合哀歌中疼惜哀痛的语气。
- source_word: הַמְסֻלָּאִים בַּפָּז
  choice: 其价值可与精金相比
  rationale: 该短语可能描写称量，也可能着重估价。中文采用自然的价值比较表达，同时以脚注保留较具体的“用精金称量”意象。
- source_word: פָּז
  choice: 精金
  rationale: 指优质或炼净的黄金；“精金”简洁庄重，适合诗体。
- source_word: אֵיכָה
  choice: 如今竟
  rationale: 在反问感叹句中传达惊愕与悲叹；以“竟”体现处境骤变带来的痛楚。
- source_word: נֶחְשְׁבוּ
  choice: 被看作
  rationale: 准确表达 נפעל 被动语态中“被认为、被算作”的意思。
- source_word: לְנִבְלֵי חֶרֶשׂ
  choice: 瓦器
  rationale: 指陶土制成的容器；“瓦器”简练且有庄重的经文语体，并与精金形成鲜明反差。
- source_word: מַעֲשֵׂה יְדֵי יוֹצֵר
  choice: 是陶匠亲手所造的
  rationale: 保留“陶匠之手的作品”这一具体意象；“亲手所造”使现代中文自然，也不省略原文的“手”。
theological_decisions: []
