  text: פְּנֵ֤י יְהוָה֙ חִלְּקָ֔/ם לֹ֥א יוֹסִ֖יף לְ/הַבִּיטָ֑/ם פְּנֵ֤י כֹהֲנִים֙ לֹ֣א נָשָׂ֔אוּ זקנים לֹ֥א חָנָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/016.yaml
  text: The face of Yahweh has scattered them[a]; he will no longer look on them. They showed no regard for priests[c][b]; they showed no favor to elders.
translation:
  language: zh_hans
  text: 雅威的面容将他们驱散[a]；他不再看他们。他们[b]不看重祭司，也不恩待长老[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威的面容”也可按其惯用含义译作“雅威的临在”；“将他们驱散”也可译作“将他们分散”。
    reason: 保留 פְּנֵי 和 חִלְּקָם 的词义范围及拟人化意象。
  - marker: b
    text: “他们”原文没有明说，只由复数动词表达；所指可能是敌人，也可能是百姓。
    reason: 说明后半节主语的指代存在歧义，避免在正文中武断确定。
  - marker: c
    text: “不看重祭司”字面为“没有抬起祭司的脸”，是表示看重、给予情面或优待的习语；“不恩待长老”也可译作“不怜悯年长者”。
    reason: 说明希伯来习语，并保留 זקנים 与 חנן 的其他合理译法。
lexical_decisions:
- source_word: פְּנֵי יְהוָה
  choice: 雅威的面
  rationale: פְּנֵי 字面为“面”，也可指“同在”。正文保留具体而鲜明的拟人化诗歌意象；“同在”列入注释。神名 יְהוָה 音译为“雅威”，不以称号代替。
- source_word: חִלְּקָם
  choice: 使他们四散
  rationale: חלק 的 Piel 形可表示分开、分散或分配；在审判与流散的语境中，“使……四散”最贴切，同时避免把具体去向加入正文。
- source_word: לֹא יוֹסִיף לְהַבִּיטָם
  choice: 他不再看他们
  rationale: יסף 加不定式在否定句中表示“不再”，נבט 表示“看、注视”。直译可保留原文简洁而严峻的关系性表达，不进一步解释为“眷顾”或“看顾”。
- source_word: פְּנֵי כֹהֲנִים לֹא נָשָׂאוּ
  choice: 不尊重祭司
  rationale: 字面为“没有抬起祭司的脸”；נשא פנים 是表示给予情面、重视或优待的习语。此处译作“不尊重”符合祭司与长老并列的社会语境，字面形式在注释说明。
- source_word: זקנים
  choice: 长老
  rationale: זקנים 可指年长者，也可指群体中的长老；与“祭司”并列时，“长老”较可能是社会身份，但“年长者”的可能性保留在注释中。
- source_word: לֹא חָנָנוּ
  choice: 不恩待
  rationale: חנן 可指施恩、厚待或怜悯。“恩待”保留恩惠语义，并与前句形成自然平行；“怜悯”作为较强的可能译法收入注释。
theological_decisions:
- issue: 关于上帝行动的拟人化表达
  choice: 保留“雅威的面”
  alternative: “雅威的临在”或“雅威亲自”
  rationale: 原文以“面”描写雅威施行审判，具有鲜明诗意。保留这一表达不等于断言上帝具有物质身体，也不把原文意象抽象化。
- issue: 后半节复数动词的主语
  choice: 以“他们”表达，但用注释保留所指的不确定性
  alternative: 明确译为“敌人”或“百姓”
  rationale: 希伯来文后两句没有明写主语，只以复数动词表达。直接指定某一群体会消除原文存在的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文保留“雅威的面”这一诗性意象，其余习语按现代汉语表达；句式简短，以呼应哀歌严峻、凝练的节奏。
