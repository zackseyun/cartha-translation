  text: שִׂ֤ישִׂי וְ/שִׂמְחִי֙ בַּת אֱד֔וֹם יושבתי בְּ/אֶ֣רֶץ ע֑וּץ גַּם עָלַ֨יִ/ךְ֙ תַּעֲבָר כּ֔וֹס תִּשְׁכְּרִ֖י וְ/תִתְעָרִֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/021.yaml
  text: Rejoice and be glad[a], daughter of Edom, you who dwell in the land of Uz[b]; the cup will also pass to you—you will become drunk and strip yourself bare.
translation:
  language: zh_hans
  text: 住在乌斯地的以东女儿啊，欢喜快乐吧！这杯也必临到你[a]；你必喝醉，赤身露体[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这杯也必传到你那里。”这里的“杯”是审判的比喻。
    reason: 说明“杯”转而临到受话者的动态表达，并保留正文的审判意象。
  - marker: b
    text: 或译：“脱去衣服”或“被显露出来”。原文表达羞辱性的裸露。
    reason: 保留该反身动词可指自行裸露或陷入被揭露之羞辱状态的语义张力。
lexical_decisions:
- source_word: שִׂישִׂי וְשִׂמְחִי
  choice: 欢喜快乐吧
  rationale: 两个阴性单数命令式彼此加强；用“欢喜快乐”保留平行与强化语气，也符合现代汉语表达。
- source_word: בַּת אֱדוֹם
  choice: 以东女儿
  rationale: 保留先知文学中把民族人格化为女子的比喻，并与本节连续的阴性形式相呼应。
- source_word: יושבתי בְּאֶרֶץ עוּץ
  choice: 住在乌斯地的
  rationale: 按语境将阴性分词理解为修饰“以东女儿”的持续居住状态；“乌斯地”是清楚自然的地名表达。
- source_word: גַּם עָלַיִךְ תַּעֲבָר כּוֹס
  choice: 这杯也必传到你那里
  rationale: 保留“杯”及其传递、临到的动态意象，不直接释为惩罚；“也”对应 גַּם。
- source_word: תִּשְׁכְּרִי
  choice: 你必喝醉
  rationale: 准确表达因饮杯而醉的结果，并保持审判意象的连贯性。
- source_word: וְתִתְעָרִי
  choice: 赤身露体
  rationale: 自然凝练地表达裸露及随之而来的羞辱；脚注保留其可理解为反身动作或被显露的语义张力。
theological_decisions:
- issue: “杯”的隐喻
  choice: 保留“杯”，并在脚注说明它在语境中象征审判
  alternative: 直接译作“惩罚也必临到你”
  rationale: 原文的杯之意象具有重要的诗歌和经文互文作用；正文不将隐喻释义化，可保留其文学与神学张力。
- issue: 命令以东欢喜的语气
  choice: 直译为“欢喜快乐吧”
  alternative: 明确增译为讥讽性的“尽管欢喜快乐吧”
  rationale: 上下文显示强烈反转，但原句没有表示“尽管”的显性词语，因此不在正文中替作者判定或强化讽刺语气。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“以东女儿”和“杯”的诗性人格化与审判意象；分号呈现从欢庆命令到审判宣告的转折性推进，但不增添原文没有的连接词。
