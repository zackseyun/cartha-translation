  text: He bent his bow and set me up as a target for the arrow[a].
translation:
  language: zh_hans
  text: 他张弓，把我立为箭靶。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他拉开弓，把我安置为箭的靶子。”
    reason: 保留 דָּרַךְ 在与“弓”连用时可译“拉开”的词汇选择，并较明确呈现 כְּ 的比较／设定关系及 לַחֵץ 所指向的“供箭射击”关系。
lexical_decisions:
- source_word: דָּרַךְ
  choice: 拉开
  rationale: 该动词本义可指“踩、踏”，与“弓”连用时表示张弓、拉弓。“拉开”在现代汉语中自然地呈现预备射箭的动作。
- source_word: קַשְׁתּוֹ
  choice: 他的弓
  rationale: 保留名词“弓”及第三人称阳性单数所属后缀。
- source_word: וַיַּצִּיבֵנִי
  choice: 把我立作
  rationale: 该形式源于 יצב，意为使某人站立、安置或设立；“把我立作”既保留使役和定位之意，也自然衔接后面的“箭靶”。
- source_word: כַּמַּטָּרָא
  choice: 箭靶
  rationale: כְּ 表示比拟，מַטָּרָא 指射击的靶或标的；结合“立作”译为“立作箭靶”，清楚传达“把我当作靶子”的意象。
- source_word: לַחֵץ
  choice: 箭
  rationale: 保留希伯来文单数“箭”；介词 ל 表明箭靶所针对或供其射击的对象，在汉语复合词“箭靶”中可自然体现。
