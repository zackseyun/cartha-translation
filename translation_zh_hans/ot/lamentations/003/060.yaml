  yaml_path: translation/ot/lamentations/003/060.yaml
  text: You have seen all their vengeance[a], all their schemes against me.
translation:
  language: zh_hans
  text: 你看见了他们的一切报复，也看见了他们针对我的一切图谋[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们有关我的一切计划。”希伯来语的这个短语也可作较中性的理解，但敌对的上下文支持译作“针对我的一切图谋”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: 你看见了
  rationale: 这是 ראה 的 Qal 完成式第二人称阳性单数，直接对上帝说话；“看见了”自然表达已经发生且与当前申诉相关的察看。
- source_word: כָּל
  choice: 一切
  rationale: 本节两次出现，表示总括；译作“一切”既准确又符合现代汉语。
- source_word: נִקְמָתָם
  choice: 他们一切的报复
  rationale: נְקָמָה 表示报复或复仇行动；“报复”在现代汉语中自然，并保留敌对行为的力度。
- source_word: מַחְשְׁבֹתָם
  choice: 他们……的一切图谋
  rationale: מַחֲשָׁבוֹת 可指思想、计划或谋算；上下文具有敌意，因此“图谋”既传达恶意策划，又不过度发挥。
- source_word: לִי
  choice: 对我的
  rationale: 介词 ל 可表示关系、指向或不利对象；结合报复与敌对语境，“对我的”保留指向性，并由“图谋”自然显出敌意。
