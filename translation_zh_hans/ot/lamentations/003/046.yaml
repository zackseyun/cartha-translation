  yaml_path: translation/ot/lamentations/003/046.yaml
  text: All our enemies have opened their mouths against us[a].
translation:
  language: zh_hans
  text: 我们所有的仇敌都向我们张开了嘴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“都冲着我们大张着嘴”，更突出这个说法所含的敌意或嘲弄意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצ֥וּ
  choice: 张开了
  rationale: פצה为Qal完成式第三人称复数，与“嘴”连用，指张口；语境常含敌意、讥讽或幸灾乐祸的意味。“张开了”保留动作本身，不把隐含语气过度明说。
- source_word: עָלֵ֛ינוּ
  choice: 向我们
  rationale: 介词עַל在此与敌对性的张口动作连用，表示动作所针对的对象。汉语“向我们张开了嘴”自然，也保留其敌对指向；脚注进一步说明可译为“冲着我们”。
- source_word: פִּיהֶ֖ם
  choice: 嘴
  rationale: 希伯来语名词为单数并带第三人称复数后缀，字面为“他们的嘴”。现代汉语在复数主体之后通常自然地使用单数类称“嘴”，无需机械复数化。
- source_word: כָּל
  choice: 所有的
  rationale: כָּל修饰复数“仇敌”，具有集合意义，译为“所有的”准确而自然。
- source_word: אֹיְבֵֽינוּ
  choice: 我们的仇敌
  rationale: אֹיֵב带第一人称复数后缀，直指“我们的仇敌”；“仇敌”符合哀歌庄重而强烈的语域。
