  yaml_path: translation/ot/lamentations/003/054.yaml
  text: Waters closed over my head[a]; I said[b], “I am cut off.”
translation:
  language: zh_hans
  text: 水漫过我的头[a]；我说：“我被剪除[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“水淹没了我的头。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我完了”或“我灭亡了。”希伯来文直译为“我被剪除”，保留了与生命或盼望断绝的意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוּ
  choice: 漫过
  rationale: 此处动词描绘水上涨并越过、淹没说话者；“漫过”既自然又保留水势吞没人的动态意象，也不把具体含义过度限定为静态的“盖住”。
- source_word: מַיִם
  choice: 水
  rationale: 希伯来语虽为复数形式，但现代汉语通常以集合名词“水”表达；译作“众水”会显得较古雅，不符合普通现代读者的自然表达。
- source_word: עַל רֹאשִׁי
  choice: 过了我的头
  rationale: 与“漫”组合为“漫过了我的头”，直接保留身体部位和濒临溺没的具体图景。
- source_word: אָמַרְתִּי
  choice: 我说
  rationale: 按 אָמַר 的通常意义直译，保留它可能是出声言说或内心自语的开放性，不擅自改为“我想”。
- source_word: נִגְזָרְתִּי
  choice: 我被剪除了
  rationale: 该词为 גזר 的 Niphal 形式，核心意象是“被割断、剪除”。“被剪除”保留与生命或盼望断绝的隐喻，同时不直接解释成“我完了”或“我必死”。
theological_decisions:
- issue: נִגְזָרְתִּי 所指的最终结果
  choice: 保留“我被剪除了”的割断意象
  alternative: 我完了／我灭亡了／我与生命隔绝了
  rationale: 原文没有明说是从生命、群体还是盼望中被剪除；直译可保存诗句的神学张力和语义开放性，避免把它单一定义为死亡或毁灭。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。“水漫过了我的头”保持原文简洁和强烈的溺水图景；“剪除”略带经文语体，但在现代汉语中仍可理解，并能保存原文隐喻。所有脚注标记均已置于正文相应位置。
