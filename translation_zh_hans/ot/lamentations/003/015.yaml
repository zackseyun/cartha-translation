  yaml_path: translation/ot/lamentations/003/015.yaml
  text: He has filled me with bitterness[a]; he has made me drink wormwood.
translation:
  language: zh_hans
  text: 他使我饱尝苦味，使我喝足苦艾[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我喝足苦艾”也可译作“用苦艾把我灌透”或“让我尽饮苦艾”。原文动词既可表示使人充分饮用，也可表示灌透、浸透。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׂבִּיעַנִי
  choice: 使我饱尝
  rationale: 使役形表示使人饱足、充满；在受苦语境中，“饱尝”自然地表达被迫充分经历苦楚，并保留“饱足”的意象。
- source_word: בַמְּרוֹרִים
  choice: 苦楚
  rationale: 该复数名词可指苦物或苦味；这里与人的患难经历相连，用“苦楚”既符合现代汉语，也不把意象过度限定为某种苦菜。
- source_word: הִרְוַנִי
  choice: 使我喝足
  rationale: 该使役形可表示使人畅饮、喝足，也可表示浸透或灌透；“使我喝足”保留饮用苦艾的具体图景，并与上句“饱尝”形成对应。
- source_word: לַעֲנָה
  choice: 苦艾
  rationale: 该词指一种味苦的植物，并可象征苦难或有毒之物；“苦艾”保留原文植物意象，避免将其抽象化为单纯的“苦”。
theological_decisions: []
translation_notes:
  register: 采用凝练、庄重而自然的现代汉语。“饱尝”与“喝足”再现两行之间的平行关系；保留“苦艾”这一具体而强烈的诗歌意象。
