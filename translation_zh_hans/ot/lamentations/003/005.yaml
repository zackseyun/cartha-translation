  yaml_path: translation/ot/lamentations/003/005.yaml
  text: He has built against me and surrounded me with bitterness and hardship[a][b].
translation:
  language: zh_hans
  text: 他筑垒来对付我[b]，又用苦毒[a]和患难围困我。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “苦毒”或译“毒物”；原文此词可指有毒或味苦之物，传统上也译作“苦胆”。
    reason: lexical_alternative
  - marker: b
    text: “筑垒来对付我”保留了“建造”的说法；原文亦可理解为“在我之上／针对我建造”，这里很可能采用围城的意象。
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: 筑垒
  rationale: 原义为“建造”；与“攻击我”连用时呈现敌对的修筑行动，并与下句“围困”共同构成围城意象。译作“筑垒”既保留建造隐喻，也比笼统的“围攻”更具体。
- source_word: עָלַי
  choice: 攻击我
  rationale: 该介词本可表示“在我之上”，但在敌对的修筑语境中具有“针对、攻击”的含义；这样表达符合现代汉语，同时不把它误解为单纯的空间位置。
- source_word: וַיַּקַּף
  choice: 围困我
  rationale: 该动词意为“环绕、包围”；结合筑垒和围城意象，“围困”自然传达敌意及受困状态。宾语“我”由上下文补出。
- source_word: רֹאשׁ
  choice: 苦毒
  rationale: 此词在本处指苦味或有毒之物，也可引申为痛苦经验。“苦毒”保留苦味意象及其诗性，并在脚注列明“毒物”的可能译法。
- source_word: וּתְלָאָה
  choice: 患难
  rationale: 该名词可指劳苦、困苦、艰难；“患难”在现代中文中庄重自然，适合哀歌语境，也不局限于身体疲乏。
