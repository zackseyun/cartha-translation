base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/038.yaml
  text: Do not both calamities and good come from the mouth of the Most High?[a]
translation:
  language: zh_hans
  text: 祸患[a]和福乐，不都是从至高者口中发出的吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “祸患”也可译作“恶事”或“灾祸”；希伯来语此词可广泛指邪恶、有害或不利的事。这里译作“祸患”，不把词义限定为道德上的邪恶。
    reason: 词义选择
lexical_decisions:
- source_word: מִפִּי
  choice: 从……口中
  rationale: 保留希伯来文“口”的具体意象，表达话语、命令或裁定由至高者而出；中文“从……口中发出”自然且贴近原文。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 这是该神圣称号在现代中文中准确、庄重而易懂的表达，也保留其“最高、至上”的含义。
- source_word: לֹא
  choice: 不都是……吗
  rationale: 原文形式上是否定词，但结合3:37—39的语境，宜理解为期待肯定答案的反问；中文用“不都是……吗”清楚传达这一修辞作用。
- source_word: תֵצֵא
  choice: 发出
  rationale: 该动词本义为“出去、出来”。与“从……口中”搭配时，“发出”既保留由某一源头而出的意思，也符合现代中文表达。
- source_word: הָרָעוֹת
  choice: 祸患
  rationale: 该词可泛指恶事、灾难或不利之事。此处与“福乐”相对，译作“祸患”能表达临到人的灾祸与苦难，同时不武断限定为道德上的邪恶。
- source_word: וְהַטּוֹב
  choice: 和福乐
  rationale: 原文是名词化使用的“好、善好之事”。在与“祸患”对举的语境中，“福乐”自然表达有利、美好的境遇，同时保留较宽泛的意义。
theological_decisions:
- issue: רָעוֹת是指道德上的邪恶，还是临到人的灾祸与逆境
  choice: 正文译作“祸患”，并以脚注保留“恶事、灾祸”等词义可能
  alternative: 译作“恶事”或“灾祸”
  rationale: 上下文讨论人的苦难、审判和际遇，重点在至高者对顺境与逆境的主权。“祸患”不否认原词较宽的语义范围，也避免将本节过度解释为至高者是道德邪恶的始作俑者。
- issue: לֹא תֵצֵא应译为陈述性否定还是反问
  choice: 译作期待肯定答案的反问：“不都是……吗？”
  alternative: 译作陈述性否定：“祸患和福乐不从至高者口中发出。”
  rationale: 紧接3:37所说若非主命定便无人能使事情成就，并与3:39对人的抱怨所作的回应相连，反问读法最符合篇章论证；同时保留了原文借否定形式形成的修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“从至高者口中发出”有意保留原文的身体意象；“不都是……吗”传达语境中的反问语气。正文简洁，对偶清楚，适合公开诵读。
