  yaml_path: translation/ot/lamentations/003/032.yaml
  text: For if he causes grief[b][a], he will also show compassion according to the abundance of his steadfast love.
translation:
  language: zh_hans
  text: 因为他若使人忧伤[a]，也必照着他丰盛的慈爱施怜悯[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他虽然使人忧伤，仍必照着他丰盛的慈爱施怜悯。”按上下文，希伯来语这一句也可带有让步语气。
    reason: alternative_reading
  - marker: b
    text: “慈爱”译自希伯来语ḥesed；这个词也可表达“忠贞的爱”“恩慈”或“怜爱”，具体含义取决于上下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: 因为……若
  rationale: כִּי承接上文，说明理由；אִם带有条件意味。译作“因为……若”保留解释与条件关系，同时在脚注中注明语境所容许的让步理解。
- source_word: הוֹגָה
  choice: 使人忧伤
  rationale: 该使役形表达“使……悲伤、受苦”。“使人忧伤”既保留使役意义，也符合《哀歌》的情感语域。
- source_word: וְרִחַם
  choice: 也必……怜悯人
  rationale: רחם表示怜悯、同情。结合前句的条件结构和上下文，未完成式在此自然表达随后的行动；“也必”体现连接词所承载的平衡和转折意味，但不把它强化为绝对对立。
- source_word: כְּרֹב
  choice: 照……丰盛的
  rationale: 介词כְּ与רֹב合用，表示衡量的标准或程度；“照……丰盛的”自然传达“按照其丰富程度”。
- source_word: חסדו
  choice: 他的慈爱
  rationale: חסד涵盖忠贞、恩慈和怜爱等含义。“慈爱”是现代中文圣经语境中自然而凝练的表达，并可与本句רחם所译的“怜悯”相区别。
theological_decisions:
- issue: כִּי אִם的条件与让步语气
  choice: 正文译为“因为……若”，脚注保留“虽然……仍”的让步理解
  alternative: 因为，他虽然使人忧伤，仍必照他丰盛的慈爱怜悯人。
  rationale: 这一组合在句法上可按条件理解，而在上下文中也可带让步意味。正文不消除其条件形式，脚注则保存语境中的真实歧义。
- issue: 区分רחם与חסד
  choice: 分别译作“怜悯”与“慈爱”
  alternative: 两者都采用“怜悯／怜爱”一类词语
  rationale: 希伯来文并用了两个相关但不同的词。分别翻译可保留原文层次：怜悯的行动与丰盛、忠贞的慈爱相关，而不把两者压缩成同一概念。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“使人忧伤”贴合哀歌的情感语域；“照他丰盛的慈爱”保留原文的度量结构。正文简洁，借脚注交代条件式与让步式之间的歧义，以及חסד的丰富语义。
