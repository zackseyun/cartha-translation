  text: the lips of those who rise against me[b][a], and their muttering against me all day long.
translation:
  language: zh_hans
  text: 那些起来反对我的人的嘴唇[a]，以及他们终日针对我的低声嘀咕[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “嘴唇”在这里可指“言语”或“话语”。
    reason: lexical_alternative
  - marker: b
    text: 或译“默想”或“低声私语”。原词既可指内心思量，也可指低声说话；这里的敌对语境较支持“低声嘀咕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: 嘴唇
  rationale: 原文直译为“嘴唇”，在这里借具体器官指言语；正文保留这一鲜明意象，并以脚注说明其转喻含义。
- source_word: קָמַי
  choice: 起来攻击我的人
  rationale: 源自动词קום，带第一人称单数词尾，字面意思是“起来反对我的人”；结合敌对语境译为“起来攻击我的人”，既贴近原文，也符合现代汉语。
- source_word: הֶגְיוֹנָם
  choice: 他们……低声嘀咕
  rationale: 该词可指内心思量、低声言语或喃喃自语；本节语境具有敌意，因此采用“低声嘀咕”，但不进一步解释成明确的“谋划”。
- source_word: עָלַי
  choice: 针对我
  rationale: 字面为“在我之上”，用于敌对言语时可表示“针对我”或“反对我”；“针对我”能自然修饰低声嘀咕。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁自然地表达整天持续不断的时间意义，并保持诗歌体的凝练。
