  text: שָׁמַ֤עְתָּ חֶרְפָּתָ/ם֙ יְהוָ֔ה כָּל מַחְשְׁבֹתָ֖/ם עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/061.yaml
  text: You have heard their reproach[a], O Yahweh, all their schemes against me.
translation:
  language: zh_hans
  text: 耶和华啊，你已经听见他们的辱骂，也听见他们一切针对我的谋划。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们一切关于我的想法。”希伯来语“谋划”也可指“想法”或“计划”；在这里的敌对语境中，很可能是指针对我的计谋。
    reason: 保留מַחְשְׁבֹתָם在“想法”和“计划、计谋”之间的词义幅度，并明确原文“针对我”的修饰关系。
lexical_decisions:
- source_word: שָׁמַעְתָּ
  choice: 你已经听见
  rationale: 这是שׁמע的Qal完成式第二人称阳性单数，直接对耶和华说话；“已经听见”既表达动作已发生，也保留其对当前祈求的意义。原文一个动词同时支配后面的两个宾语，汉语为清楚和自然补出第二个“听见”。
- source_word: חֶרְפָּתָם
  choice: 他们对我的辱骂
  rationale: חֶרְפָּה可指羞辱、辱骂或讥诮；这里描述敌人针对说话者的言语攻击，用“辱骂”自然且不过度限定具体形式。原文所有格“他们的”在汉语中结合语境表达为“他们对我的”。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 保留四字神名作为直接称呼；“啊”自然标示呼格。现代简体中文圣经语域中，“耶和华”是该名字通行而庄重的译法。
- source_word: כָּל מַחְשְׁבֹתָם
  choice: 他们谋划的一切
  rationale: מַחְשָׁבָה可指思想、意图、计划或谋划；敌对语境支持“谋划”，但“一切”仍完整保留כָּל的范围。
- source_word: עָלָי
  choice: 对我
  rationale: עַל在敌对计划的语境中可表示针对、反对；译作“对我”与“谋划”搭配自然，也较“攻击我”更少增添原文未明说的内容。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，不以“主”这一称号替代。正文采用现代中文读者最熟悉、且明确作为专名使用的“耶和华”；“雅威”是较贴近学界重建读音的另一种音译。
- issue: מַחְשְׁבֹתָם的敌对意味
  choice: 他们谋划的一切
  alternative: 他们对我的一切想法
  rationale: 上下文涉及辱骂和敌对行为，因此“谋划”较能传达这里可能含有的恶意计划；但该名词本身也可泛指思想，所以用脚注保留较中性的读法，不把敌意解释绝对化。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。原文只有一个“听见”，同时带两个宾语；正文重复“听见”，使汉语结构清楚流畅。脚注标记置于涉及词义选择的分句末尾。
