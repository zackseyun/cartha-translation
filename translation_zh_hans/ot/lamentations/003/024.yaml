base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/024.yaml
  text: “Yahweh is my portion,” says my soul[b][a]; “therefore I will hope in him.”
translation:
  language: zh_hans
  text: “雅威是我所得的份[a]，”我的心说，“因此，我要盼望他[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“雅威是我的份”或“雅威是我的产业”。
    reason: lexical_alternative
  - marker: b
    text: 或译“因此，我要等候他”或“因此，我要满怀期待地等候他”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקִי
  choice: 我的福分
  rationale: חֵלֶק指分得的一份、份额，也可延伸指所分得的产业。“我的福分”在现代汉语中自然庄重，并保留诗歌中以雅威为自己所得之份的含义；其他可能译法列入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用以色列上帝的专名四字神名；译作“雅威”以保留专名，而不以称号代替。
- source_word: אָמְרָה
  choice: 说
  rationale: 虽为完成式，但在引出直接引语时可表达当前、持续有效的宣认；汉语用“说”最自然，也无需强行限定为过去。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נֶפֶשׁ在此指说话者内在的自我。“我的心”符合现代汉语诗性表达，避免把经文处理成关于灵魂构成的技术性陈述。
- source_word: עַל־כֵּן
  choice: 因此
  rationale: 该惯用语表示由前述宣认所得出的结果或回应；“因此”简洁地保留逻辑关系。
- source_word: אוֹחִיל
  choice: 我要仰望
  rationale: יחל的使役式在此兼有盼望和期待等候的含义。“仰望”自然表达对雅威所怀的盼望与信靠，同时以脚注保留“等候”的词义可能。
- source_word: לוֹ
  choice: 他
  rationale: 与יחל连用时表示盼望或等候所指向的对象；“仰望他”是自然汉语搭配，并保留人称指向。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 经文使用的是上帝的专名，而非“主”这一称号；采用较贴近יהוה常见学术重构读音的“雅威”，保留其专名性质。
- issue: “我的福分”的盟约与产业意涵
  choice: 我的福分
  alternative: 我的份；我的产业
  rationale: 不把חֵלֶק限定为法律意义上的遗产，也不消除其“分得之份”的具体意象；正文采用自然的“福分”，脚注呈现较直译的可能。
- issue: יחל所含盼望与等候的张力
  choice: 我要仰望他
  alternative: 我要等候他；我要满怀期待地等候他
  rationale: 原词可同时涉及盼望和期待中的等候。正文选用兼具盼望与信靠意味的“仰望”，脚注保留时间性较强的“等候”，不把该词义张力单向化。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。句式保留原文由内心宣认转向盼望回应的结构；引号与停顿使“我的心说”清晰地作为引语插入语。所有脚注标记均置于相应词语之后。
