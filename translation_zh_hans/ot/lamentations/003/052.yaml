  yaml_path: translation/ot/lamentations/003/052.yaml
  text: My enemies hunted me like a bird[a], without cause.
translation:
  language: zh_hans
  text: 我的仇敌无缘无故地像追捕鸟一样追捕我[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文以不定式绝对形与同源限定动词连用，加强语气；直译近似“追捕，他们追捕我”。也可译作“我的仇敌确实无缘无故地像追捕鸟一样追捕我”。
    reason: 说明原文加强语气的语法结构及另一种译法。
lexical_decisions:
- source_word: צוֹד צָדוּנִי
  choice: 追捕我
  rationale: 词根 צוד 表示猎取、捕捉；不定式绝对形与限定动词连用，加强“追捕”的语气。正文采用自然简洁的“追捕我”，并在脚注中说明其强调作用，避免擅自加入表示持续时间的词。
- source_word: כַּצִּפּוֹר
  choice: 如同追捕一只鸟
  rationale: צִפּוֹר 在此泛指鸟，并未限定具体鸟种。这样表达既保留猎物的比喻，也符合现代汉语习惯。
- source_word: אֹיְבַי
  choice: 我的仇敌
  rationale: 该词直接指敌人或仇敌；“我的仇敌”庄重、清楚，也符合哀歌的诗体语域。
- source_word: חִנָּם
  choice: 无缘无故地
  rationale: 此处表示敌意毫无正当理由，而非“免费”。“无缘无故地”自然地传达受害者所申诉的不公。
