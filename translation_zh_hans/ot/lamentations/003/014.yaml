base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/014.yaml
  text: I have become a laughingstock to all my people[a], their song all day long.
translation:
  language: zh_hans
  text: 我成了我民众中所有人的笑柄，成了他们终日所唱的歌[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所唱的歌”或译“嘲弄我的歌”或“讥讽我的歌”。
    reason: נְגִינָתָם 可泛指歌曲，也可结合“笑柄”的平行语境理解为讥嘲之歌；正文保留较宽的词义，脚注列出语境所支持的明确译法。
lexical_decisions:
- source_word: הָיִיתִי
  choice: 我成了
  rationale: 这是动词 היה 的 Qal 完成式第一人称单数；在哀歌语境中表示先前遭遇造成并延续至今的处境。“成了”既保留状态变化，也符合现代汉语表达。
- source_word: שְּׂחֹק
  choice: 笑柄
  rationale: 该名词可指笑声、讥笑或被人取笑的对象；在“成了……的”这一结构中，“笑柄”准确而自然。
- source_word: לְכָל עַמִּי
  choice: 我众民的
  rationale: לְ 在此标示说话者成为众人取笑的对象；עַמִּי 直译为“我的民”。用“我众民”保留“我的民”与“全体”的含义，也不额外加入“自己人”等强调。
- source_word: נְגִינָתָם
  choice: 他们……所唱的歌
  rationale: 该词可指歌曲、乐曲，也可在讥嘲语境中指嘲弄人的歌。正文采用较宽泛的“所唱的歌”，由上句“笑柄”显明讥嘲语境，同时用脚注保留更明确的译法。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 这是表示持续整日的惯用时间短语；“终日”简洁、庄重，也符合现代书面汉语。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。两个“成了”再现希伯来诗句的平行关系；“终日”置于“所唱”之前，使语序自然，并保留嘲弄持续不断的意味。
