  text: 他用凿好的石头堵住[a]我的道路[b]，使我的路径弯曲[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “堵住”或译“筑墙围住”。
    reason: lexical_alternative
  - marker: b
    text: “凿好的石头”或译“修整过的石头”或“凿成的石头”。
