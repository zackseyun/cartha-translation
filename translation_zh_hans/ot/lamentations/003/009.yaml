lexical_decisions:
- source_word: גָּדַר
  choice: 堵住
  rationale: 该动词可指筑墙、围住或阻塞；结合“用凿好的石头”，译为“堵住”既保留人为砌筑障碍的具体画面，也符合现代汉语表达。
- source_word: דְּרָכַי
  choice: 我的道路
  rationale: “道路”可兼具实际道路和人生行程的含义，并与下句“我的路径”形成诗歌平行。
- source_word: בְּגָזִית
  choice: 用凿好的石头
  rationale: 该词指经过凿削、修整的石料；此译清楚呈现坚固且刻意修筑的阻碍，又避免较生僻的建筑术语。
- source_word: נְתִיבֹתַי
  choice: 我的路径
  rationale: 该名词指小路、路径或行迹；“路径”简洁自然，并保留与“道路”的近义平行。
- source_word: עִוָּה
  choice: 使……弯曲
  rationale: 该动词表示弄弯、扭曲；在道路意象中，“使……弯曲”保留空间含义，不额外引入道德败坏的意思。
