  text: תִּרְדֹּ֤ף בְּ/אַף֙ וְ/תַשְׁמִידֵ֔/ם מִ/תַּ֖חַת שְׁמֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/066.yaml
  text: You will pursue them in anger and destroy them from under the heavens of Yahweh[a][b].
translation:
  language: zh_hans
  text: 愿你在怒中追赶他们，将他们从雅威的诸天之下除灭。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “愿你……追赶……除灭”或译：“你必……追赶……除灭。”原文的未完成式在这里既可表达祈求，也可带将来或确定的语气。
    reason: alternative_reading
  - marker: b
    text: “从雅威的诸天之下”是诗歌表达，意为从上帝诸天所覆盖的世上彻底除去。
    reason: cultural_note
lexical_decisions:
- source_word: תִּרְדֹּף
  choice: 愿你……追赶
  rationale: 这是动词 רדף 的 Qal 未完成式第二人称阳性单数；在向上帝祈求的语境中可带愿望语气。“追赶”保留具体动作，也不将其解释得过窄。
- source_word: בְּאַף
  choice: 发怒
  rationale: אַף 本义为“鼻子”，在此为“怒气”的惯用义；בְּ 表示伴随状态或方式。译作“发怒”符合现代汉语表达，同时保留行动出于怒气的含义。
- source_word: וְתַשְׁמִידֵם
  choice: 将他们……除灭
  rationale: 这是 שׁמד 的 Hiphil 未完成式第二人称阳性单数，带第三人称阳性复数宾语后缀。“除灭”准确传达使之毁灭、消除的强烈含义，并适合庄重诗体。
- source_word: מִתַּחַת
  choice: 从……之下
  rationale: 保留原文“从下面、从下方”的空间意象，表达把他们从上帝诸天所覆盖的领域彻底除去。
- source_word: שְׁמֵי
  choice: 诸天
  rationale: 这是“天”的复数构造形式。“诸天”既保留希伯来语复数形式，也符合庄重的诗歌语域。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按音译呈现四字神名，而不以称号替代；“雅威”是现代汉语中清楚、常见的音译形式。
theological_decisions:
- issue: 未完成式在祷告语境中的语气
  choice: 愿望式祈求：“愿你……追赶……除灭”
  alternative: 将来或确定语气：“你必……追赶……除灭”
  rationale: 前文连续向上帝发出祈求，本节两个未完成式自然可理解为愿望式。由于形式本身也容许将来或确定语气，脚注保留这一歧义。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文采用音译“雅威”，以区别于“主”等称号，同时不为该名称附加教派性解释。
- issue: “从雅威的诸天之下除灭”的范围
  choice: 保留原文空间性诗歌意象
  alternative: 意译为“从世上彻底除灭”
  rationale: 直译保留“诸天之下”的宏阔诗意及其张力；脚注说明其总体意义，而不在正文中消解意象。
translation_notes:
  register: 采用现代、庄重而易懂的祷告诗体。“愿你”承接哀歌中的祈求语境；“诸天之下”保留原文的空间意象和诗歌高度。“雅威”按神名音译处理。
