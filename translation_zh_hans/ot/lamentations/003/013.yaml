  text: He drove the sons of his quiver into my kidneys[a].
translation:
  language: zh_hans
  text: 他将他箭袋之子[a]射入我的肾脏。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他箭袋之子”，即指他的箭。
