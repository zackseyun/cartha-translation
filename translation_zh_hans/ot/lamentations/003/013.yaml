lexical_decisions:
- source_word: הֵבִיא
  choice: 使……射入
  rationale: 此处是 בוא 的使役式，表达使箭进入身体。结合箭矢穿透的意象，“使……射入”比中性的“带入”更自然，也保留了强烈的暴力动作。
- source_word: בְּכִלְיוֹתָי
  choice: 我的肾脏
  rationale: כִּלְיָה 字面指“肾脏”，也可象征人的内在深处；此处描写箭射入身体，具体的身体含义最为突出，因此保留“肾脏”。
- source_word: בְּנֵי
  choice: ……之子
  rationale: 原文为“……之子”的构造，实际指箭袋所容纳的箭。正文保留这一突出的希伯来诗歌表达，并用脚注说明其所指。
- source_word: אַשְׁפָּתוֹ
  choice: 他的箭袋
  rationale: אַשְׁפָּה 指盛放箭矢的箭袋；“箭袋”是现代汉语中准确而自然的对应词。
theological_decisions: []
translation_notes:
  register: 采用庄重而简洁的现代标准汉语；正文有意保留“箭袋之子”这一陌生而鲜明的希伯来诗歌意象，以脚注帮助普通读者理解。“使……射入”明确呈现原文使役动词及穿透身体的语境。
