  naturalness: “他使箭袋之子射入我的肾脏”在现代汉语中句法不够自然。“他将他箭袋之子射入我的肾脏”既保留陌生而鲜明的希伯来意象，也更顺畅地表达暴力穿透的动作。
  terminology: “肾脏”准确保留具体解剖意象；“箭袋”也是恰当术语。“箭袋之子”可保留于正文，并以脚注说明其指箭。脚注须补足“他的”并改正不自然的“他箭袋之子”表述。
