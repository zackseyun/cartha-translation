  text: עַד יַשְׁקִ֣יף וְ/יֵ֔רֶא יְהוָ֖ה מִ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/050.yaml
  text: until Yahweh looks down and sees from heaven[a].
translation:
  language: zh_hans
  text: 直到耶和华从天上垂看、察看[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“垂看并看见”；两个相连的动词强调耶和华从天上留意观看。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: 直到
  rationale: 承接上一节持续的哀哭，标明这种状态结束的时点；“直到”简洁自然。
- source_word: יַשְׁקִיף
  choice: 垂看
  rationale: 该动词的使役形常指从高处向下观看；“垂看”既保留从天而下的空间意象，也符合庄重的诗歌语体。
- source_word: וְיֵרֶא
  choice: 察看
  rationale: ראה通常意为“看见”；这里与前一动词并列，译作“察看”可保留第二个动词及其留意、看清的意味，而不把两个动词合并。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中广为人知的神名音译，保留原文专名性质，不以“主”这一称号替代。
- source_word: מִשָּׁמָיִם
  choice: 从天上
  rationale: שָׁמַיִם虽具复数形态，此处惯用义指神所在的天；“从天上”自然，并明确修饰观看动作。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，应保留为专名。现代标准汉语中“耶和华”最为通行且普通读者易于识别；“雅威”更接近学界常见的拟音，但尚未完全取代传统译名。
- issue: 两个观看动词的关系
  choice: 分别译为“垂看、察看”
  alternative: 合并译为“垂察”或“留意”
  rationale: 原文并列 יַשְׁקִיף 与 וְיֵרֶא，具有诗性强化作用；分别翻译可保留原文形式和神从天上关注苦情的张力，不额外说明他将如何回应。
translation_notes:
  register: 采用简洁、庄重而可懂的现代标准汉语。“垂看”保留诗歌中的上下空间意象，“察看”避免机械重复，同时脚注交代原文直译。
