base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/064.yaml
  text: You will repay them[a], O Yahweh[b], according to the work of their hands.
translation:
  language: zh_hans
  text: 耶和华啊，你必照他们手所做的[a]回报他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华啊，愿你照他们手所做的回报他们。”希伯来语动词在此既可理解为祈愿，也可理解为对将来之事的确信。
    reason: alternative_reading
  - marker: b
    text: “他们手所做的”直译为“他们双手的作为”，指他们所做的事。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב
  choice: 你必……报应
  rationale: 使役词干的基本含义是“使返回、归还”，与“报偿”连用时表示按人的行为施以相应回报。未完成式在这里既可表达将来的确信，也可带祈愿语气；正文保留前者，脚注说明后者。
- source_word: לָהֶם גְּמוּל
  choice: 报应他们
  rationale: גְּמוּל指回报、报偿；结合לָהֶם，现代汉语用“报应他们”简洁自然，并在本语境中清楚表达向敌对者施行相称的回报。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的上帝专名音译“耶和华”，与原文直接使用四字神名相对应，而不改译为普通称号。
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: 照他们手所做的
  rationale: כ表示对应的尺度，即“照、按照”；“手所做的”保留希伯来语以“手”指人的行为或作为的具体意象，同时在现代汉语中仍可理解。
theological_decisions:
- issue: תָּשִׁיב在祷告语境中的语气
  choice: 你必……报应他们
  alternative: 愿你……报应他们
  rationale: 该未完成式既可作为对将来行动的确信，也可在祷告中表达祈愿。正文采用确信式，脚注保留祈愿式，避免消除原文的语气张力。
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用以色列上帝的专名。正文采用中文传统且广为人知的音译“耶和华”，以专名对应专名，不以称号取代。
- issue: 按行为施行报应
  choice: 照他们手所做的报应他们
  alternative: 按他们所做的回报他们
  rationale: 译文仅表达本节所求的相称回报，不进一步界定其具体形式或建立超出本节的系统性教义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊”保留呼告语气；“照他们手所做的”保留原文意象，但以“所做的”使句意对普通读者清楚。
