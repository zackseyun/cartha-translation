base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/001.yaml
  text: I am the man who has seen affliction under the rod of his wrath[a][b].
translation:
  language: zh_hans
  text: 我是那在他愤怒的杖下[a]见过苦难[b]的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“借着他愤怒的杖。”希伯来文介词在这里可有不同理解。
    reason: lexical_alternative
  - marker: b
    text: “苦难”也可译作“困苦”“患难”或“悲惨处境”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי הַגֶּבֶר
  choice: 我是……的人
  rationale: 希伯来文以独立代词“我”开头，带有强调性的自我指认；现代汉语用“我是……的人”自然地保留这一力量，也体现定冠词所指的特定人物。
- source_word: רָאָה
  choice: 亲眼见过
  rationale: 基本义是“看见”；在此也含亲历之意。“亲眼见过”既保留视觉表达，又使汉语读者自然理解为切身经历，而不直接改译成较解释性的“经历”。
- source_word: עֳנִי
  choice: 苦难
  rationale: 该词可指困苦、患难、悲惨处境，未必专指贫穷。“苦难”在现代汉语中涵盖面较广，也符合《耶利米哀歌》的庄重语域。
- source_word: בְּשֵׁבֶט
  choice: 在……的杖下
  rationale: שֵׁבֶט指杖、棍或权杖；这里带有惩治的意象。介词בְ可表达“在……之下”或“借着”，正文采用自然且保留意象的“在……的杖下”。
- source_word: עֶבְרָתוֹ
  choice: 他愤怒
  rationale: עֶבְרָה表示强烈的愤怒。译作“愤怒”庄重而清楚；三单阳性后缀仍译为“他”，不在正文补明上帝或耶和华。
theological_decisions:
- issue: “他愤怒”中代词的所指
  choice: 保留“他”，不在正文中补出“上帝”或“耶和华”
  alternative: 上帝的愤怒／耶和华的愤怒
  rationale: 本节希伯来文只有第三人称阳性单数后缀；上下文虽指向上帝，正文仍应保留原文含蓄的表达和文学张力。
- issue: 苦难与杖之间的关系
  choice: 译为“在他愤怒的杖下受苦”
  alternative: “因他愤怒的杖而受苦”或“被他愤怒的杖击打”
  rationale: 介词בְ的关系并不唯一；正文以“在……杖下”保留受制于惩治力量的图像，不明确限定为工具或原因。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以“我是那……的人”突出诗句开头的自我指认；“杖下”保留原文的惩治意象。脚注标记均置于正文相关句末。
