lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上下文，引出本节所述理由；“因为”在现代汉语中自然地保留其因果、解释作用。
- source_word: לֹא
  choice: 不会
  rationale: 与未完成式动词结合，在此表达对将来或持续情形的否定。
- source_word: יִזְנַח
  choice: 弃绝人
  rationale: זנח可指弃绝、抛弃或拒绝；“弃绝”兼具关系性和庄重语体。希伯来文宾语未明说，中文补出泛指的“人”，使句意完整，同时不把对象限定为某一个人或群体。
- source_word: לְעוֹלָם
  choice: 永远
  rationale: 表示无尽或长久的持续时间；与否定词连用，说明主的弃绝并非永久。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神圣称号אֲדֹנָי，而非四字神名；译作“主”准确且符合现代中文圣经语体。
theological_decisions:
- issue: 弃绝是否永久
  choice: 不会永远弃绝人
  alternative: 永不弃绝人
  rationale: 否定词直接与“永远”构成的表达，重点是弃绝不会永久持续，而不是否认任何暂时的弃绝或管教；此译保留上下文中的神学张力。
- issue: 神圣称号的译法
  choice: 主
  alternative: 上主
  rationale: אֲדֹנָי是称号“主”；采用简洁通行的“主”，不将其误作原文未出现的四字神名。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“弃绝”保留诗歌和神学语境所需的力度；补出的“人”为泛指，避免中文句子显得宾语残缺。
