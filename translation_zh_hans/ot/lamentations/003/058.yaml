base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/058.yaml
  text: You have defended the cause of my soul[a], O Lord; you have redeemed my life.
translation:
  language: zh_hans
  text: 主啊，你为我的性命申辩[a]；你救赎了我的生命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你为我辩护”，或“你为我争讼”。原文“性命”也可泛指“我自己”或“我”。
    reason: 原文ריב具有诉讼中申辩、争讼的含义；נֶפֶשׁ可指性命、生命或整个人。
lexical_decisions:
- source_word: רַבְתָּ
  choice: 你……申了冤
  rationale: ריב在此带有诉讼、争辩或代人处理案件的意味。“申了冤”是自然的现代汉语司法表达，表明主亲自维护说话者的案件，而不把它泛化为一般的帮助。
- source_word: אֲדֹנָי
  choice: 主啊
  rationale: 这是对上帝的尊称，并在句中作直接呼语；“主啊”既体现称谓，也自然传达呼告语气。
- source_word: רִיבֵי
  choice: 冤
  rationale: רִיב的复数在这里可作集合性表达，指说话者所涉的案件、争讼或冤情。汉语用单数集合概念“冤”更自然，并保留司法语境。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נֶפֶשׁ可指性命、生命、自我或整个人。“为我申冤”在汉语中自然涵盖“关乎我的案件”，并避免生硬的“我灵魂的案件”；其“性命”含义在脚注中保留。
- source_word: גָּאַלְתָּ
  choice: 救赎了
  rationale: גאל表示以救赎者的身份解救、赎回或收回。“救赎”保留原词独特的赎回意象和神学分量，又没有把它缩减为笼统的“帮助”。
- source_word: חַיָּי
  choice: 我的生命
  rationale: 该复数形式在此按希伯来语习惯表示“生命”。“我的生命”是准确自然的汉语，并与前半句的司法意象形成区别。
theological_decisions:
- issue: 是否分别保留两行中的司法意象和救赎意象
  choice: 前半句采用“申了冤”，后半句采用“救赎了我的生命”
  alternative: 将两句都概括为“你帮助了我、救了我”
  rationale: 原文先用ריב描写为人争讼、维护案件，继而用גאל描写救赎或赎回。分别保留两种意象，能维持诗句的张力和神学内涵，而不加入原文未明说的教义限定。
- issue: נַפְשִׁי在本句中的具体所指
  choice: 正文按汉语习惯译作“我”，脚注保留“我的性命”这一较形式对应的译法
  alternative: 正文直译为“我的灵魂”或“我的性命”
  rationale: נֶפֶשׁ语义范围包括生命、性命、自我和整个人；此处不能武断限定为非物质的“灵魂”。“为我申冤”自然表达整个人所涉的案件，同时由脚注呈现原文可能强调性命的理解。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“主啊”保留直接呼告；“申冤”与“救赎”分别承载司法和赎回意象。正文简洁，脚注说明原文中真实存在的词义幅度。
