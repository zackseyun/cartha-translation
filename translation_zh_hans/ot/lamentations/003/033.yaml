  text: כִּ֣י לֹ֤א עִנָּה֙ מִ/לִּבּ֔/וֹ וַ/יַּגֶּ֖ה בְנֵי אִֽישׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/033.yaml
  text: For he does not afflict from his heart or grieve the sons of men[a][b].
translation:
  language: zh_hans
  text: 因为他并非出于本心[a]使世人[b]受苦，使他们忧愁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“甘心”；原文直译为“从他的心”。
    reason: lexical_alternative
  - marker: b
    text: “世人”原文直译为“人的众子”，是泛指人类的希伯来语表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为前一句所述提供理由；“因为”自然保留了原文的解释和因果关系。
- source_word: לֹא
  choice: 并非
  rationale: 与“出于本心”搭配自然，明确否定苦待人的行为源于他的内在意愿。
- source_word: עִנָּה
  choice: 使人受苦
  rationale: 此处指使人遭受痛苦或困苦；这一译法比“谦卑”更符合上下文，也比“压迫”涵盖面更广。
- source_word: מִלִּבּוֹ
  choice: 出于本心
  rationale: 保留“从他的心”这一希伯来语意象，同时以自然的现代汉语表达并非出于内在意愿或喜好。
- source_word: וַיַּגֶּה
  choice: 叫……忧愁
  rationale: 表达使人悲伤、忧愁之意，并与前面的“使人受苦”有所区分，保留两个动词的并列张力。
- source_word: בְנֵי אִישׁ
  choice: 世人
  rationale: 该希伯来语表达字面为“人的众子”，实际泛指人类；“世人”在中文中庄重自然，并准确涵盖所有人。
theological_decisions:
- issue: 对上帝内在意向的拟人化表达
  choice: 出于本心
  alternative: 甘心；从他的心里
  rationale: “出于本心”既保留“心”的意象，也表达审判和苦难并非上帝所喜悦的内在倾向；不把经文扩展为关于上帝行为动机的系统性解释。
- issue: 代表全人类的阳性习语
  choice: 世人
  alternative: 人的众子；人类
  rationale: 原文的阳性复数习语泛指人类。中文若直译为“人的众子”会生硬且可能误导；“世人”准确传达其普遍所指，脚注同时保存字面形式。
- issue: 两个致苦动词之间的关系
  choice: 使人受苦，叫世人忧愁
  alternative: 使人受苦或使世人忧愁
  rationale: 原文以连接词并列两个动词；中文采用并列分句，不强行解释为二选一，同时保留“受苦”与“忧愁”的语义区别。
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“出于本心”保留原文的“心”之意象；“世人”避免生硬直译，同时由脚注交代希伯来语形式。两个脚注标记均紧随其所说明的词语。
