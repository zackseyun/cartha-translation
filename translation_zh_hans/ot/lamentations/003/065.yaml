base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/065.yaml
  text: You will give them hardness of heart[b][a]; your curse will be upon them.
translation:
  language: zh_hans
  text: 你必使他们心里刚硬[a]；你的咒诅必临到他们。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “心里刚硬”直译近于“心的遮盖”或“心的盾护”。原文表达罕见；按上下文，这里很可能指内心麻木、刚硬。
    reason: lexical_alternative
  - marker: b
    text: 本节也可译作：“愿你使他们心里刚硬，把你的咒诅降给他们。”希伯来语的未完成式在这里可以带有祈愿的语气。
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתֵּן
  choice: 你必使
  rationale: נתן的Qal未完成式第二人称阳性单数，所指对象是上帝。在祈求审判的语境中，既可表达带祈愿色彩的宣告，也可译为“愿你使”；正文用“必”保留庄严的将来／咒愿语气，另一可能见脚注。
- source_word: מְגִנַּת לֵב
  choice: 心里刚硬
  rationale: 字面近于“心的遮盖／盾护”，但该罕见表达在本节与“你的咒诅”并列，较可能指内心麻木、刚硬的状态。“心里刚硬”在现代汉语中自然，也保留其道德与属灵内涵；字面形式见脚注。
- source_word: תַּאֲלָתְךָ
  choice: 你的咒诅
  rationale: 该词在此表示咒诅或誓约性的诅咒。“你的咒诅”准确、庄重，并符合审判祈祷的语境。
- source_word: לָהֶם ... לָהֶם
  choice: 他们……临到他们
  rationale: 希伯来文两次用לָהֶם强调承受审判的人；中文第二处以“临到他们”自然表达咒诅落在其身上的意思。
theological_decisions:
- issue: 本节是祈愿还是预告
  choice: 正文译作“你必使……你的咒诅必临到……”，呈现向上帝发出的庄严审判祈求，并保留未完成式的将来色彩。
  alternative: “愿你使他们心里刚硬，把你的咒诅降给他们。”
  rationale: 希伯来语未完成式在此可有祈愿／命令式色彩，也可听作带咒愿意味的未来宣告。正文不把张力单一化，脚注保留明确的祈愿译法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“心里刚硬”比生硬的字面译法更清楚；分号呈现两行诗句的紧密平行关系。所有脚注标记均置于正文相应位置。
