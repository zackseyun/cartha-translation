  yaml_path: translation/ot/lamentations/003/042.yaml
  text: We have transgressed and rebelled[a]; you have not forgiven.
translation:
  language: zh_hans
  text: 我们犯罪，又悖逆；你没有赦免。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你并未饶恕。”这里的希伯来语动词常用于指上帝的赦免。
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: 我们
  rationale: 保留独立人称代词，体现希伯来文主语的强调，并与后句“你”形成鲜明对照。
- source_word: פָשַׁעְנוּ
  choice: 犯了过错
  rationale: פשע兼有越界、犯罪和反叛权威的意味；译为“犯了过错”，保留道德与盟约性的过犯含义，同时避免与下一个表示悖逆的动词完全重合。
- source_word: וּמָרִינוּ
  choice: 又悖逆了
  rationale: מרה表示悖逆、反抗；“悖逆”准确保留其较强语气，并与前一动词构成递进式并列。
- source_word: אַתָּה
  choice: 你
  rationale: 原文显式使用第二人称单数代词，指向上帝；译文保留，以呈现“我们……；你……”的强调和对照。
- source_word: לֹא
  choice: 没有
  rationale: 直接否定随后的完成式动词；现代汉语用“没有赦免”自然表达。
- source_word: סָלָחְתָּ
  choice: 赦免
  rationale: סלח是常用于上帝赦罪的动词，可译“赦免”或“饶恕”；“赦免”在此庄重自然，并保留神圣宽恕的语境。
theological_decisions:
- issue: 哀歌中上帝没有赦免的陈述
  choice: 你却没有赦免
  alternative: 你并未饶恕
  rationale: 译文直接保留对上帝的诉说及“没有赦免”这一神学张力，不以解释性措辞加以缓和或化解。“却”明确呈现原文中“我们”与“你”的对照，但不改变否定陈述本身。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号保留两个强调主语之间的对照；“犯了过错／悖逆”尽量区分两个近义动词，同时维持诗句的紧凑和力度。
