base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/030.yaml
  text: Let him give his cheek to the one who strikes him[a]; let him be filled with reproach.
translation:
  language: zh_hans
  text: 他当把脸颊交给那打他的人，饱受羞辱。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “饱受羞辱”直译为“被羞辱充满”；也可译作“受尽羞辱”或“饱尝羞辱”。
    reason: 说明希伯来语“饱足／充满”的比喻，并保留 חֶרְפָּה 所含羞辱、耻辱与责难的词义范围。
lexical_decisions:
- source_word: יִתֵּן
  choice: 当……转向
  rationale: 此处未完成式在上下文中带劝勉意味；用“当”表达劝勉语气，而非单纯将来时。与“脸颊”搭配时，“转向”比直译“给”更符合现代汉语，同时保留主动承受的画面。
- source_word: לְמַכֵּהוּ
  choice: 打他的人
  rationale: 介词 לְ 加 נכה 的使役分词及第三人称阳性单数后缀，指“击打他的人”；此译自然并保留分词所指的人。
- source_word: לֶחִי
  choice: 脸颊
  rationale: לֶחִי 可指脸颊或下颌；此处描写遭击打和羞辱，“脸颊”最贴合语境。
- source_word: יִשְׂבַּע
  choice: 饱受
  rationale: שׂבע 的基本意思是饱足、充满；“饱受”在现代汉语中自然地保留了被羞辱充满、受尽羞辱的比喻。
- source_word: בְּחֶרְפָּה
  choice: 凌辱
  rationale: חֶרְפָּה 涵盖羞辱、耻辱、辱骂和社会性的蒙羞；“凌辱”既可表达所受的侮辱，也符合本节受击打的语境。
theological_decisions:
- issue: 命令、劝勉与将来陈述之间的语气
  choice: 译作“当……”，表达上下文中的劝勉
  alternative: 译作“他必……”或“愿他……”
  rationale: יִתֵּן 与 יִשְׂבַּע 的形式本身可有未完成式或祈愿色彩，但本段连续劝勉人安静承受管教；“当”保留规范性而不强化为绝对命令或预言。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“把脸颊转向”保留原文的身体意象，又避免生硬的“把脸颊给”；“饱受凌辱”保留原文“饱足”的隐喻，并适合哀歌语境。
