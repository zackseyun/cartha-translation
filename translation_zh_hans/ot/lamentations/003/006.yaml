  yaml_path: translation/ot/lamentations/003/006.yaml
  text: He has made me dwell in darkness like those long dead[a].
translation:
  language: zh_hans
  text: 他使我住在幽暗中，像死去已久的人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他使我坐在黑暗之处，像久远以前死去的人。”
    reason: 词义与表达方式的另一种可能：הוֹשִׁיבַנִי 可较直译为“使我坐”，בְּמַחֲשַׁכִּים 可译作“在黑暗之处”，עוֹלָם 也可表示久远的过去。
lexical_decisions:
- source_word: בְּמַחֲשַׁכִּים
  choice: 在幽暗中
  rationale: 该词为复数名词加介词 ב，表示置身于黑暗之处或幽暗境域。“在幽暗中”符合现代汉语表达，也保留了受困于阴暗之境的意象。
- source_word: הוֹשִׁיבַנִי
  choice: 他使我住
  rationale: ישׁב 的使役形带第一人称单数宾语后缀，意为“使我坐下、居住”。在此处，“使我住”自然地表达被迫安置和持续处于其中的含义。
- source_word: כְּמֵתֵי
  choice: 像……死去的人
  rationale: 比较介词 כ 与“死人”的复数构词形式构成明喻；结合后面的 עוֹלָם，译文用“像死去已久的人”完整表达。
- source_word: עוֹלָם
  choice: 已久
  rationale: 此词可指久远的过去或绵延的时日。在“死人”之后，较可能指死去很久，而不是形而上的永恒；“死去已久”在现代汉语中自然且准确。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“幽暗”保留哀歌的诗性意象；“使我住”体现使役含义，却避免生硬直译。主句保留 עוֹלָם 在此处有关久远时间的解释，同时以脚注注明“古时”的可能译法。
