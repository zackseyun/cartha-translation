  yaml_path: translation/ot/lamentations/003/002.yaml
  text: He has driven me and made me walk in darkness and not light[a].
translation:
  language: zh_hans
  text: 他驱赶我，使我走在黑暗中，而不在光明中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他引领我，使我走在黑暗中，而不在光明中。”
    reason: 词义选择：נָהַג可指“驱赶、驱使”，也可较中性地指“引领”；此处采用“驱赶”以体现哀歌语境中可能的强制意味。
lexical_decisions:
- source_word: אוֹתִי
  choice: 我
  rationale: אֵת在此标示第一人称单数直接宾语；汉语自然译为“我”，无需另译宾语标记。
- source_word: נָהַג
  choice: 驱赶
  rationale: 该动词可表示“引领、赶着、驱使”。哀歌的受苦语境带有强迫意味，因此选“驱赶”，同时在脚注保留较中性的“引领”。
- source_word: וַיֹּלַךְ
  choice: 使我行
  rationale: הלך的使役形式表达“使……去/行走”；“使我行”既保留使役含义，也符合庄重凝练的诗歌语体。
- source_word: חֹשֶׁךְ
  choice: 黑暗
  rationale: 该名词直接指黑暗；“黑暗”准确、常用，并保持与“光明”的鲜明对照。
- source_word: וְלֹא אוֹר
  choice: 而非光明里
  rationale: 原文简短省略，直译近于“而不是光”。此译尽量保留突兀对照，并以“里”承接前面的空间表达，使现代汉语自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而凝练的汉语诗歌语体。“行在”保留经文式韵味但仍为普通读者所懂；“而非光明里”刻意保留希伯来文“黑暗／非光”的紧凑对照。
