base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/023.yaml
  text: They are new every morning[a]; great is your faithfulness.
translation:
  language: zh_hans
  text: 每天早晨都是新的[a]；你的信实何其广大！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“它每天早晨都是新的”，若将上一节所说的怜悯理解为一个整体。
    reason: alternative_reading
lexical_decisions:
- source_word: חֲדָשִׁים
  choice: 都是新的
  rationale: 该词是阳性复数形容词，意为“新的、新鲜的”。希伯来文省略了主语，译文承接上一节的复数概念，并以“都是新的”自然表达复数谓语。
- source_word: לַבְּקָרִים
  choice: 每早晨
  rationale: 介词 לְ 与“早晨”的复数形式构成反复性的时间表达；“每早晨”既保留逐晨反复之意，也符合庄重而易懂的现代汉语。
- source_word: רַבָּה
  choice: 何其广大
  rationale: 该阴性单数形容词与后面的 אֱמוּנָה 相配，表示“大、丰盛”。“何其广大”保留感叹语气，并自然描述信实的浩大丰盛。
- source_word: אֱמוּנָתֶךָ
  choice: 你的信实
  rationale: אֱמוּנָה 表示坚定、可靠、忠实；此处指上帝可靠不变的品格。“信实”是现代中文圣经语体中准确且通行的对应词，也不把含义窄化为主观的信心。
theological_decisions:
- issue: 本节省略主语，需从上一节补足
  choice: 按复数理解：“都是新的”
  alternative: 按集合性单数理解：“每早晨都是新的”所指为整体性的慈爱或怜悯
  rationale: 希伯来文以复数形容词 חֲדָשִׁים 开头，没有明说主语；最自然是承接3:22中的复数“怜悯”。中文可省略代词而保留衔接，因此正文不强加“它们”，脚注说明集合性理解的可能。
translation_notes:
  register: 采用现代、庄重而简明的汉语。首句利用中文可省略主语的特点，避免添加希伯来文没有的代词，同时以“都是”呼应复数；后半句用“何其广大”传达诗歌性的感叹和 רַבָּה 的强度。
