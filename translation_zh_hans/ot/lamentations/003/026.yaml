  text: ט֤וֹב וְ/יָחִיל֙ וְ/דוּמָ֔ם לִ/תְשׁוּעַ֖ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/026.yaml
  text: It is good to wait quietly for the salvation of Yahweh[a].
translation:
  language: zh_hans
  text: 静默等候耶和华的拯救，是好的。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“盼望耶和华的拯救，并且保持沉默，是好的。”原文动词含有怀着盼望等候的意思；“静默”也可译作“保持沉默”。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 是好的
  rationale: 该形容词在无动词句中作谓语，评价静默等候这一行动为美好、有益或合宜；中文用“是好的”自然保留其判断语气。
- source_word: יָחִיל
  choice: 等候
  rationale: יחל兼有盼望和怀着期待等候之意；在“耶和华的拯救”这一对象前，“等候”最简洁自然，期待与盼望的意味由语境承载。
- source_word: וְדוּמָם
  choice: 静默
  rationale: 该词表达安静、无声的状态；“静默”既贴近原文，也能自然修饰“等候”。连接词 וְ 在这里将等候与静默的姿态紧密结合，中文不必机械译作“并且”。
- source_word: לִתְשׁוּעַת
  choice: ……的拯救
  rationale: תְּשׁוּעָה可指拯救、解救或胜利；此处指来自耶和华的救助，“拯救”既符合上下文，也保留较宽的语义范围。希伯来介词 לְ 表示等候所指向的对象，中文用“等候……的拯救”表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”呈现四字神名，保留其作为以色列之神专名的功能，而不改译为一般称号“主”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用历史悠久、普遍可识别的“耶和华”，明确其为专名；“雅威”是依据常见学术重构的另一种音译。
- issue: יָחִיל 的盼望意味
  choice: 正文译“等候”，脚注说明也可理解为“盼望”
  alternative: 盼望
  rationale: 该动词同时包含期待与等候的语义。正文结合 לִתְשׁוּעַת 译作“等候……的拯救”较自然，但不把其中的盼望色彩排除，故在脚注保留另一译法。
translation_notes:
  register: 采用简洁、庄重而现代的普通话表达。“静默等候”凝练呈现两个并列而密切相关的要素；句末“是好的”保留希伯来文以“好”开头所表达的评价判断。
