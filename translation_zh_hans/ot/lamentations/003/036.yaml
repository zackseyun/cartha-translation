  text: to deny a man justice in his case—the Lord does not approve[a][b].
translation:
  language: zh_hans
  text: 在人的案件中屈枉他[a]，主并不看见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在人的诉讼中陷害他”或“歪曲人的案情”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“主没有看见。”这里的“看见”也可含有留意、认可或赞同的意思；也有人将这句话理解为反问：“主岂会看不见？”
    reason: alternative_reading
lexical_decisions:
- source_word: לְעַוֵּת
  choice: 屈枉
  rationale: 该词为 עוה 的 Piel 不定式，表示使正直之事变曲、歪曲或侵害；在诉讼语境中，“屈枉”自然地表达枉法损害当事人的意思。
- source_word: אָדָם
  choice: 人
  rationale: 此处指处于诉讼中的一个人；现代汉语以“人”即可兼顾单数个体和原文的泛指用法，无须限定为男性。
- source_word: בְּרִיבוֹ
  choice: 在诉讼中
  rationale: רִיב 可指争讼、案件或法律纠纷；结合本节司法语境，“在诉讼中”清楚而自然。原文后缀所指的“他的”在汉语中可由语境表达，不必生硬重复。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是用于上帝的称号 אֲדֹנָי，简体中文圣经语体通常译作“主”。
- source_word: לֹא רָאָה
  choice: 绝不认可
  rationale: רָאָה 字面为“看见”，在这里可延伸为看着而准许、认同或赞同。结合3:34–36所列的恶行，“绝不认可”传达这句总结性的评价；字面措辞及其张力保留在脚注中。
theological_decisions:
- issue: לֹא רָאָה 是单指视觉上的“没有看见”，还是表示不认可这种恶行
  choice: 主绝不认可
  alternative: 主没有看见／主岂会看不见
  rationale: 上下文列举践踏、屈枉和歪曲公理等恶行，末句说明主对这些事的态度。把“看见”理解为“认可”符合希伯来语在此处的语用含义，也避免让正文被误解为否认主知道这些不义；同时脚注明确保留原文字面表达和可能形成的修辞张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“屈枉”保留司法和道德色彩，“诉讼”明确法律语境；正文简洁，适合《耶利米哀歌》的诗体排比。所有脚注标记均已置于正文相应位置。
