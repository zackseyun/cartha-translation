  yaml_path: translation/ot/lamentations/003/035.yaml
  text: to deny a man justice before the face of the Most High—
translation:
  language: zh_hans
  text: 在至高者面前剥夺一个人的公道——
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַטּוֹת מִשְׁפַּט
  choice: 剥夺……的公道
  rationale: הטה מִשְׁפָּט 是使司法偏离正轨、屈枉或剥夺公正裁断；此处用现代汉语“剥夺……的公道”，自然表达受害者被拒绝公正的含义，同时保留司法语境。
- source_word: גָּבֶר
  choice: 一个人
  rationale: 这里泛指某个男子或个人；译作“一个人”在现代汉语中自然且不无必要地强化性别。
- source_word: נֶגֶד פְּנֵי עֶלְיוֹן
  choice: 在至高者面前
  rationale: 较为贴近原文“面对至高者／在至高者面前”，并保留行为发生在上帝鉴察之下的庄重意味。
- source_word: עֶלְיוֹן
  choice: 至高者
  rationale: 保留神圣称号的名词形式，不把它释义性改写为“至高的上帝”。
theological_decisions:
- issue: “在至高者面前”是否应解释为向至高者申诉
  choice: 保留“在至高者面前”
  alternative: 在至高者的审判庭前／不顾至高者的鉴察
  rationale: 原文介词短语本身未明确说明是申诉场景、神圣法庭还是上帝的鉴察；直译可保存其语义张力，避免过度解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。破折号保留本节在哀歌第三章长句结构中的未完连接感。
