  text: חַֽסְדֵ֤י יְהוָה֙ כִּ֣י לֹא תָ֔מְנוּ כִּ֥י לֹא כָל֖וּ רַחֲמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/022.yaml
  text: Because of Yahweh’s steadfast love we are not consumed[a], for his mercies never come to an end.
translation:
  language: zh_hans
  text: 因耶和华的慈爱，我们没有灭亡[a]；因为他的怜悯永不止息。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 有些希伯来文抄本和古代译本支持另一译法：“耶和华的慈爱永不止息。”这种读法以“慈爱”为主语，并对第一个动词采用不同读法。
    reason: textual_alternative
lexical_decisions:
- source_word: חַסְדֵי יְהוָה
  choice: 耶和华的慈爱
  rationale: 复数附属形式可指耶和华一次次忠贞守约的慈爱行动；中文用抽象单数“慈爱”自然凝练，并保留忠诚、恩爱的核心语义。
- source_word: כִּי לֹא תָמְנוּ
  choice: 因……我们没有灭亡
  rationale: 按所据WLC的马所拉读法，תָמְנוּ为第一人称复数。“没有灭亡”在哀歌语境中自然表达尚未被彻底消灭，同时保留“我们”作主语。
- source_word: כִּי לֹא כָלוּ
  choice: 因为……永不止息
  rationale: 第二个כִּי说明前句的缘由；否定式כָלוּ表示耶和华的怜悯没有耗尽或终止。
- source_word: רַחֲמָיו
  choice: 他的怜悯
  rationale: 希伯来文复数可表达丰富且屡次施予的怜悯；现代汉语以集合性的单数“怜悯”更自然庄重。
theological_decisions:
- issue: 首句的主语和句法
  choice: 因耶和华的慈爱，我们没有灭亡。
  alternative: 耶和华的慈爱永不止息。
  rationale: 所据马所拉文本的元音标注将תָמְנוּ读作第一人称复数，因此正文保留“我们”为主语。若干希伯来文抄本及古代译本支持另一读法，以“耶和华的慈爱”为主语；这一重要异文在脚注中明确保留。
translation_notes:
  register: 采用现代、庄重而易懂的诗体表达。“耶和华”沿用通行中文圣经对神名的音译；两个“因为”反映原文重复的כִּי及其因果推进。正文保留马所拉文本第一人称复数的读法，脚注呈现重要异文。
