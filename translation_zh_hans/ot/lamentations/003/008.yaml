  text: גַּ֣ם כִּ֤י אֶזְעַק֙ וַ/אֲשַׁוֵּ֔עַ שָׂתַ֖ם תְּפִלָּתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/008.yaml
  text: Even when I cry out and call for help[a], he shuts out my prayer.
translation:
  language: zh_hans
  text: 即使我呼喊求救，他仍阻挡我的祷告。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尽管我呼喊、求救，他还是阻挡我的祷告。”
    reason: גַּם כִּי可译作让步性的“尽管”；两个并列动词也可分别译出；שָׂתַם可译作“阻挡”。
lexical_decisions:
- source_word: גַּם כִּי
  choice: 即使
  rationale: 该组合在本节表达让步关系：尽管说话者呼求，后面的阻隔仍然发生。“即使”简洁自然，也保留哀歌中的张力。
- source_word: אֶזְעַק
  choice: 我呼喊
  rationale: זעק常指人在危难中强烈呼喊；“呼喊”保留了声音与急迫感。
- source_word: וַאֲשַׁוֵּעַ
  choice: 求救
  rationale: שׁוע的强化词干表达迫切求助；“求救”与前面的“呼喊”共同传达呼求援助之意，同时符合现代汉语习惯。
- source_word: שָׂתַם
  choice: 堵住
  rationale: 该动词本义为塞住、堵塞。以“堵住”修饰“祷告”，保留原文具体而强烈的阻隔意象，没有将其弱化为一般性的“不听”。
- source_word: תְּפִלָּתִי
  choice: 我的祷告
  rationale: 该名词直接指祷告；此译法准确、清楚，也适合上下文。
theological_decisions:
- issue: “堵住”的隐含主语
  choice: 保留第三人称单数“他”，不明确增补“上帝”或“耶和华”
  alternative: 明确译成“上帝堵住我的祷告”，或改用“我的祷告被堵住”
  rationale: 希伯来文动词为第三人称阳性单数，本句没有明说主语；上下文虽可确定所指，但保留“他”更贴近原文的简练表达，也避免添加本节没有出现的神圣称谓。
- issue: 是否把祷告受阻解释为祷告未蒙垂听
  choice: 保留“堵住”的空间性隐喻
  alternative: 译为“他不听我的祷告”
  rationale: 原文描写祷告被阻塞，而不是直接使用“听”或“不听”的措辞。保留隐喻可避免替原文解释其具体神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“呼喊求救”紧凑呈现两个相连的希伯来动词；“堵住我的祷告”略带陌生感，但有意保留原文鲜明的阻塞意象。
