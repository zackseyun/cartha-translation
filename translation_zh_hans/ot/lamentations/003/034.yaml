lexical_decisions:
- source_word: לְדַכֵּא
  choice: 踩
  rationale: דכא有压碎、压倒之意；与“在他的脚下”连用时，译作“踩”在现代汉语中自然，并保留具体而强烈的践踏意象。
- source_word: תַּחַת
  choice: 在……下
  rationale: 此介词表达空间位置，译文用“在他的脚下”准确而自然。
- source_word: רַגְלָיו
  choice: 他的脚
  rationale: 原文为复数并带第三人称阳性单数后缀；汉语习惯在这一表达中用单数形式“脚”，不损失原意。
- source_word: כֹּל
  choice: 所有
  rationale: 修饰复数群体，译作“所有”可清楚表达整体范围。
- source_word: אֲסִירֵי
  choice: 被囚的人
  rationale: 该词指囚犯或被拘禁者；“被囚的人”既自然易懂，也保留其受束缚的处境。
- source_word: אָרֶץ
  choice: 世上
  rationale: אָרֶץ既可指“大地、世界”，也可指“土地、国土”。此处用“世上”保留诗句较广的范围，同时在脚注中注明另一种可行理解。
