  text: 将大地上一切囚犯踏碎在他脚下，[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“将这地上一切囚犯踏碎在他脚下。”希伯来语“אֶרֶץ”既可指“大地、世界”，也可指“土地、国土”。
