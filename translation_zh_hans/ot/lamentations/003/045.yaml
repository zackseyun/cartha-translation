  yaml_path: translation/ot/lamentations/003/045.yaml
  text: You have made us scum and refuse in the midst of the peoples[a][b].
translation:
  language: zh_hans
  text: 你使我们在万民中成为污垢和渣滓[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“污物和弃物”；这两个罕见名词连用，表达极深的蔑视和屈辱。
    reason: lexical_alternative
  - marker: b
    text: “万民”或译：“列国”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סְחִי
  choice: 污秽
  rationale: 这是罕见名词，指卑污之物，也可能指刮除的污垢。“污秽”在现代汉语中自然、凝练，并能表达极度受辱的意味。
- source_word: וּמָאוֹס
  choice: 和渣滓
  rationale: 该词与厌弃、可憎相关，表示被人嫌恶并丢弃之物。“渣滓”既有废弃物的具体意象，也能自然表达社会性的蔑视。
- source_word: תְּשִׂימֵנוּ
  choice: 你使我们……成为
  rationale: שׂים本义为“放置、设立”，在此结构中表示使某人成为某种状态；完成式译为“使……成为”，保留已经造成的结果。
- source_word: בְּקֶרֶב
  choice: 在……中
  rationale: 直译为“在……当中”；“在万民中”简洁自然，同时保留身处众民之间的空间和社会含义。
- source_word: הָעַמִּים
  choice: 万民
  rationale: 复数עַמִּים指众民族或众国之民。“万民”是庄重而通顺的现代圣经语体；语境中也可理解为“列国”。
