base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/029.yaml
  text: Let him put his mouth in the dust—perhaps there is hope[a].
translation:
  language: zh_hans
  text: 愿他将口置于尘土中——或许有希望。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“愿他把口放在尘土中。”这个表达描绘深切的谦卑、自我降卑或默然顺服。
    reason: 词义替代及意象说明
lexical_decisions:
- source_word: יִתֵּן
  choice: 愿他把……贴在
  rationale: נתן本义为“给、放、置”；此处未完成式在27—30节的劝勉语境中带祈使或劝勉意味。“愿他……”保留这一语气；“贴在”自然表达身体伏低、口近尘土的具体姿态。
- source_word: בֶּעָפָר
  choice: 在尘土中
  rationale: עָפָר指尘土、干土。介词בְּ直译为“在……中”；保留“尘土”的圣经意象，不改作解释性的“卑微处境”。
- source_word: פִּיהוּ
  choice: 他的口
  rationale: 原文为单数“他的口”。译文保留具体身体意象，不将其解释性改写为“俯伏”或“默然”。
- source_word: אוּלַי
  choice: 或许
  rationale: אוּלַי表达可能性与审慎的期待。“或许”语体庄重自然，也保留希望尚未确定的张力。
- source_word: יֵשׁ
  choice: 还有
  rationale: יֵשׁ是存在词“有、存在”。中文在“希望”前用“还有”符合哀歌处境中的自然表达，并未把“或许”所限定的不确定性改成肯定。
- source_word: תִּקְוָה
  choice: 希望
  rationale: תִּקְוָה意为“希望、期待”；“希望”是现代汉语中最直接自然的对应词。
theological_decisions:
- issue: 口置于尘土中的谦卑与顺服姿态
  choice: 在正文保留“把口贴在尘土中”的具体意象
  alternative: 译为“谦卑俯伏”或“卑微地默然顺服”
  rationale: 这一表达可能包含深切谦卑、自我降卑或默然顺服等含义，但原文用身体姿态传达这些意义。正文不限定为某一种解释，以保存原文的意象及神学张力。
- issue: 希望的确定程度
  choice: 译为“或许还有希望”
  alternative: 译为“这样就会有希望”
  rationale: אוּלַי明确表达可能性，不能把审慎、未定的盼望强化为确定结果。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“贴在”使姿态在中文中清楚自然，同时脚注保留更贴近נתן的“放在”。破折号呈现前后动作与希望之间含蓄的关联。
