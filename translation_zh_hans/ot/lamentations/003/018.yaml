  text: וָ/אֹמַר֙ אָבַ֣ד נִצְחִ֔/י וְ/תוֹחַלְתִּ֖/י מֵ/יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/018.yaml
  text: So I said[a], “My endurance has perished[b], and my hope from Yahweh.”
translation:
  language: zh_hans
  text: 于是我说：“我的耐力已经消逝[a]，我从雅威而来的盼望也消逝了[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的耐力”或译“我的光彩”；希伯来词在这里的含义并不完全确定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“我从雅威的盼望”，是一个省略式表达；既可指从雅威而来的盼望，也可理解为对雅威所存的盼望。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: 于是我说
  rationale: ו־连接叙述进程，אָמַר表示“说”。“于是我说”自然地表达说话者在接连受苦之后所得出的悲观结论，同时保留叙事的推进。
- source_word: אָבַד
  choice: 已经消逝／没有了
  rationale: אָבַד可指灭亡、失落或消失。前半句译作“已经消逝”，保留强烈的失丧感；后半句因希伯来文省略了重复的谓语，按汉语习惯补作“也没有了”。
- source_word: נִצְחִי
  choice: 我坚持下去的力量
  rationale: נֵצַח在此可指持久、耐力，也可有尊荣或光彩之意。哀歌语境着重说话者已无力继续承受，因此用自然的现代汉语译为“我坚持下去的力量”，并以脚注保留“光彩／尊荣”的词义可能。
- source_word: וְתוֹחַלְתִּי
  choice: 我的盼望
  rationale: תּוֹחֶלֶת指盼望或期待；“盼望”符合本段哀歌的语域，也与下文重新燃起的盼望形成呼应。
- source_word: מֵיְהוָה
  choice: 从雅威而来的
  rationale: 介词מִן通常表示“从、来自”。正文优先保留来源义；但原文短语极为简练，也可能指向以雅威为对象的盼望，故在脚注中说明。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号代替。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用神的专名。译作“雅威”按其通常重构的读音音译，避免把专名改成称号；此选择不附加任何宗派性解释。
- issue: מֵיְהוָה与“盼望”的关系
  choice: 正文译作盼望“从雅威而来”
  alternative: “对雅威的盼望”
  rationale: מִן最直接的意义是“从”，但此处是省略而压缩的表达，既可理解为盼望的来源，也可能指以雅威为对象的盼望。正文保留较形式对应的来源义，脚注明确另一种可能，不消除原文张力。
- issue: נִצְחִי的语境义
  choice: 我坚持下去的力量
  alternative: 我的光彩／我的尊荣
  rationale: 上下文描写说话者在苦难中濒临崩溃，并与“盼望”并列，因此耐力、持久力之义较贴合；然而该词也可表示光彩或尊荣，故不将另一词义排除在注释之外。
translation_notes:
  register: 采用现代、庄重而易懂的哀歌语体。“已经消逝……也没有了”传达原句断然绝望的语气；后半句按汉语语法补出省略的谓语，但借脚注保留希伯来文的简约和歧义。
