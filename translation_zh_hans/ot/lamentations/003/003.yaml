  text: Surely against me he turns his hand again and again all day long[a].
translation:
  language: zh_hans
  text: 他实在终日一再转过手来攻击我。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他实在转回向我；他终日转动他的手。”希伯来文连续用了两个动词，可较形式地译为“转回”和“转动／翻转”；这组动词也可理解为表达反复的行动。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 实在
  rationale: 此处作加强断言的语气词，突出哀诉，并非限制性的“只有”。
- source_word: בִּי
  choice: 向我……攻击
  rationale: 介词בּ与第一人称单数代词在敌对行动的语境中表示行动针对“我”；将敌对意味自然融入谓语。
- source_word: יָשֻׁב יַהֲפֹךְ
  choice: 一次又一次……挥
  rationale: 相连的两个动词分别有“返回、再次”和“转动、翻转”之意；正文以迭代表达呈现反复行动，同时用脚注保留较形式对应的另一种理解。
- source_word: יָדוֹ
  choice: 手
  rationale: 保留希伯来文“手”的具体意象；“挥手攻击”使其敌对行动在现代汉语中清楚自然，而不抽象化为“能力”。
- source_word: כָּל הַיּוֹם
  choice: 终日
  rationale: 简洁、庄重地表达行动整日持续不断。
theological_decisions:
- issue: 施动者身份
  choice: 沿用阳性第三人称“他”，不在本节明说其身份
  alternative: 直接译作“上帝”或“耶和华”
  rationale: 希伯来文本本节只有代词；上下文虽指向上帝，正文仍保留原文此处的代词表达，避免添加明说的信息。
translation_notes:
  register: 采用现代、庄重而易懂的汉语。“终日”保持诗歌的凝练感；“一次又一次”传达持续反复的攻击。脚注标记已在正文中对应出现。
