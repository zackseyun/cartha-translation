  yaml_path: translation/ot/lamentations/003/007.yaml
  text: He has walled me in so that I cannot get out[a]; he has made my chain heavy.
translation:
  language: zh_hans
  text: 他筑墙围住我，使我无法出去；又使我的锁链沉重。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的铜镣”或“我的镣铐”。原文用词与“铜、青铜”有关，很可能指一种金属刑具。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר
  choice: 筑墙围住
  rationale: 该动词表示筑墙、围堵或圈禁；“筑墙围住”保留具体的墙垣意象，也符合现代汉语表达。
- source_word: בַּעֲדִי
  choice: 围住我
  rationale: 与גָּדַר连用时表示说话者被封闭围困；汉语以“围住我”自然传达其作用对象。
- source_word: וְלֹא אֵצֵא
  choice: 使我无法出去
  rationale: 原文直译为“而我不能出去”；结合围困语境，用“使我无法出去”清楚表达结果，又不强化为原文未明说的“逃脱”。
- source_word: הִכְבִּיד
  choice: 使……沉重
  rationale: כבד的使役式表示“使之沉重”；此译保留具体重量意象。
- source_word: נְחָשְׁתִּי
  choice: 我的锁链
  rationale: 该词与“铜、青铜”相关，在此很可能指金属镣铐或锁链；正文采用自然且概括的“锁链”，具体词源和可能译法置于脚注，以保留词义的不确定性。
