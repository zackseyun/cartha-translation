  text: ט֣וֹב לַ/גֶּ֔בֶר כִּֽי יִשָּׂ֥א עֹ֖ל בִּ/נְעוּרָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/027.yaml
  text: It is good for a man that he bear the yoke in his youth[a][b].
translation:
  language: zh_hans
  text: 人在年轻时负轭，是好的[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处为阳性单数，直译可作“对男人来说”；在这句格言式陈述中可泛指人。
    reason: lexical_alternative
  - marker: b
    text: “负轭”也可译作“背负轭”；“轭”在这里比喻所承担的重担或管教。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 是好的
  rationale: 保留句首评价性形容词的判断意义；按现代汉语语序置于句末，表达自然而庄重。
- source_word: לַגֶּבֶר
  choice: 人
  rationale: גֶּבֶר在形式上是阳性单数，可指男子，但本节作为智慧式通则，具有代表性、泛指作用；汉语“人”能自然保留这一泛指功能，性别形式差异另以脚注说明。
- source_word: כִּי
  choice: 若
  rationale: כִּי在此连接“好”与负轭的情形，可理解为内容性“……是好的”，也可带“当……时”的情境色彩。译作“若”使全句成为自然的汉语条件—评价结构，同时不把它强化为因果关系。
- source_word: יִשָּׂא
  choice: 负
  rationale: נשא与“轭”搭配时表示承担、背负；“负轭”既保留具体意象，也包含承受重担或管教的含义。
- source_word: עֹל
  choice: 轭
  rationale: 直译为套在牲畜颈上的“轭”，在此具有负担、约束或管教的比喻意义；不直接译成“重担”，以免抹去原文意象。
- source_word: בִּנְעוּרָיו
  choice: 在年轻时
  rationale: 该词指一个人的青年时期；“在年轻时”比“在他的青春期”更自然，也与泛指主语协调。
theological_decisions:
- issue: 阳性单数是否必须明译为“男人”
  choice: 正文译作泛指的“人”，脚注说明原文形式
  alternative: 男人若在年轻时负轭，是好的
  rationale: 希伯来文גֶּבֶר及后续第三人称阳性单数形式确为阳性，但此处格言式陈述可代表一般的人。现代汉语“人”并未排除男性含义，并能避免把本节不必要地限定为仅适用于男性；脚注保留原文的性别形式信息。
- issue: “轭”的神学与比喻范围
  choice: 保留“轭”，不指定为某一种特定管教或苦难
  alternative: 承担管教／背负苦难
  rationale: 上下文可使“轭”涉及苦难、约束或管教，但本节本身没有明说其施加者或唯一所指。保留意象可避免过早锁定神学解释。
translation_notes:
  register: 采用现代、简洁而庄重的格言式表达。“负轭”略带书面色彩，但意象清楚，并与《耶利米哀歌》的诗体语域相称。正文中的[a][b]与脚注一一对应。
