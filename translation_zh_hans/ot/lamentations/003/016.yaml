  text: He has ground my teeth with gravel[b][a]; he has pressed me down into the ashes.
translation:
  language: zh_hans
  text: 他用碎石磨碎我的牙齿[a]；又把我压倒在灰烬中[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“用小石子压碎我的牙齿。”
    reason: lexical_alternative
  - marker: b
    text: “压倒”所译的希伯来语动词十分罕见，也可理解为“使我蜷伏”、“使我降卑”，或类似地译作“使我卑伏在灰烬中”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגְרֵס
  choice: 磨坏
  rationale: 该动词表达碾压、磨碎或压碎；“磨坏”与“牙齿”和“碎石”的意象自然搭配，既保留强烈的身体痛苦，也不把词义过度限定为单纯“打断”。
- source_word: בֶּחָצָץ
  choice: 用碎石
  rationale: חָצָץ 指小石块、砂砾；“碎石”在现代汉语中清楚而有磨损感，并以“用”自然表达希伯来语介词在此处的工具意义。
- source_word: שִׁנָּי
  choice: 我的牙齿
  rationale: 原文为“牙齿”的复数形式，并带第一人称单数所属后缀，直译为“我的牙齿”。
- source_word: הִכְפִּישַׁנִי
  choice: 把我压倒
  rationale: 这是一个罕见且含义不完全确定的动词，语境指向被压低、屈辱或迫伏。“把我压倒”兼顾具体动作与受辱降卑的意味，同时不排除其他理解。
- source_word: בָּאֵפֶר
  choice: 在灰烬中
  rationale: אֵפֶר 明确指“灰烬”，不是一般的“尘土”。“压倒在灰烬中”在汉语中自然，也避免仅凭罕见动词把介词强解为方向性的“进到”。
