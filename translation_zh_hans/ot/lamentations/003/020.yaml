base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/020.yaml
  text: My soul continually remembers and is bowed down within me[a].
translation:
  language: zh_hans
  text: 你必定记念；我的心在我里面低沉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为：“你必定记念；我的心在我之上低沉。”首个动词以不定式绝对式连同未完成式，强调“记念”；“在我之上”按上下文可自然表达为“在我里面”。
    reason: 说明原文的加强结构、首分句的第二人称，以及介词短语的字面表达。
lexical_decisions:
- source_word: זָכוֹר תִּזְכּוֹר
  choice: 不断回想
  rationale: 不定式绝对式与未完成式同根连用，加强“记念、回想”的动作；“不断回想”既自然，也传达持续而强烈的意味。
- source_word: וְתָשִׁיחַ
  choice: 便……低沉
  rationale: 此词表达被压低、沉下的状态。“低沉”保留具体的下沉意象，又适合描述内心因回忆而消沉；“便”在汉语中自然体现两分句间的承接关系，但不把因果说得过强。
- source_word: עָלַי
  choice: 在我里面
  rationale: 字面为“在我之上”，在这里与“我的心”连用，表达人的内在生命低沉；译作“在我里面”符合现代汉语习惯，字面形式则在脚注说明。
- source_word: נַפְשִׁי
  choice: 我的心
  rationale: נפשׁ可指生命、自我或内在的人。汉语诗歌语境中“我的心”自然表达内在主体，也避免现代读者将“灵魂”误解为与整个人截然分离的实体。
- source_word: זכר
  choice: 回想这事
  rationale: 希伯来文动词在本节未明说宾语，但上下文承接前节所述苦难。“这事”是汉语为使表达完整而补出的指代，不另行限定其内容。
theological_decisions:
- issue: “我的心”与说话者本人的关系
  choice: 保留“我的心”作主语
  alternative: 译作“我不断回想”
  rationale: 保留原文 נַפְשִׁי 的诗性人格表达，不将其简化为普通第一人称，也不据此建立灵魂与身体分离的教义判断。
translation_notes:
  register: 采用现代、庄重而可懂的诗体汉语。“我的心”“低沉”保留哀歌的内在下沉意象；补入“这事”承接上文，避免汉语中的突兀。
