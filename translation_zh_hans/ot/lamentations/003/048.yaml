  yaml_path: translation/ot/lamentations/003/048.yaml
  text: Streams of water run down from my eyes over the destruction of the daughter of my people[a][b].
translation:
  language: zh_hans
  text: '我的眼泪如溪流般流下，


    为我百姓的女儿所遭的毁灭[a][b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “毁灭”也可译作“破败”或“崩毁”。
    reason: lexical_alternative
  - marker: b
    text: “我百姓的女儿”是希伯来诗歌中的人格化说法，将百姓（有时也连同其城市）称为“女儿”；在本书语境中通常与犹大或锡安的群体相关。
    reason: cultural_note
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: 泪水如河
  rationale: פַּלְגֵי מַיִם直指成股、成河的水流；结合“我的眼”，所指显然是泪水。译作“泪水如河”以自然汉语保留鲜明的诗歌意象，又不夸大为“洪流”。
- source_word: תֵּרַד
  choice: 流下
  rationale: ירד本义为“下去、降下”；用于眼泪时，“流下”既准确又符合现代汉语习惯。
- source_word: עֵינִי
  choice: 我的眼中
  rationale: 原文形态为单数“我的眼”，但可集合性地指双眼；“我的眼中”在汉语中无需明确单双数，并自然承接泪水意象。
- source_word: עַל
  choice: 因
  rationale: 此处介词表示哀哭的缘由。“因”明确表达因果关系，符合上下文，同时不增加原文没有的解释。
- source_word: שֶׁבֶר
  choice: 毁灭
  rationale: שֶׁבֶר在哀歌语境中可指破败、崩毁或灾难性的毁坏。“毁灭”清楚传达群体所遭的浩劫；脚注保留“破败、创伤”等可能译法。
- source_word: בַּת עַמִּי
  choice: 我同胞之女
  rationale: 保留希伯来诗歌将群体人格化为“女儿”的表达。“我同胞”比直译“我的人民”在现代汉语第一人称语境中更自然，也保留说话者与该群体的归属关系。
theological_decisions:
- issue: “我同胞之女”的所指
  choice: 正文保留人格化称谓，不直接替换为锡安、犹大或人民
  alternative: 译作“我的同胞”“锡安女子”或“犹大”
  rationale: 原文只写“我百姓/同胞之女”，其具体所指可由语境关联锡安或犹大，但本节没有明说；保留原有称谓可避免过度限定，并由脚注说明其诗歌功能。
translation_notes:
  register: 采用现代、庄重而可诵读的诗体。“泪水如河”使汉语读者自然理解水流是眼泪，同时保留原文的比喻强度；“我同胞之女”刻意保留陌生而重要的人格化意象，并以脚注辅助理解。
