base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/057.yaml
  text: You came near on the day I called to you; you said[a], “Do not fear.”
translation:
  language: zh_hans
  text: 我呼求你的那天，你临近我；你说：“不要惧怕。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרַבְתָּ
  choice: 你临近我
  rationale: קרב 的 Qal 完成式第二人称阳性单数，表示来到近处。结合上下文，受话者是上帝；补出中文所需的宾语“我”，自然表达说话者所经历的临近，同时不额外解释这种临近的方式。
- source_word: בְּיוֹם
  choice: ……的那天
  rationale: 介词 בְּ 与 יוֹם 构成时间表达。译作“……的那天”既保留“日”的具体意象，也符合现代汉语叙述。
- source_word: אֶקְרָאֶךָּ
  choice: 我呼求你
  rationale: קרא 第一人称单数形式带第二人称阳性单数宾语后缀，意为向受话者呼叫。哀歌祷告语境中的“呼求”能自然表达向上帝发声求告，又不必强化为更激烈的“哀号”。
- source_word: אָמַרְתָּ
  choice: 你说
  rationale: אמר 的第二人称阳性单数完成式，直接译为“你说”，简洁保留直接引语。
- source_word: אַל תִּירָא
  choice: 不要惧怕
  rationale: אַל 加未完成式/祈使语气形式表达禁止或劝止。“不要惧怕”准确而庄重，也保留 ירא 的核心含义。
theological_decisions:
- issue: 受话者及说话者的辨识
  choice: 把第二人称单数理解为诗人直接对上帝说话：“你临近我……你说”。
  alternative: 语法上可机械地保留未指明的阳性单数受话者，但在上下文中不自然。
  rationale: 两个第二人称阳性单数动词清楚指向同一受话者；周围祷告语境表明该受话者是上帝。译文维持这种直接、关系性的呼告，不增添进一步的教义说明。
- issue: 上帝“临近”的性质
  choice: 保留具体而开放的“临近”，不说明是空间上的、同在中的或施救性的临近。
  alternative: 译作“你来帮助我”或“你与我同在”。
  rationale: 原文只明确表达临近；进一步界定其性质会消除诗句本身的开放性，并加入原文未明说的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的诗体汉语。语序调整为“我呼求你的那天，你临近我”，避免“在我呼求你的日子”之类较生硬表达；直接引语保持简洁有力。
