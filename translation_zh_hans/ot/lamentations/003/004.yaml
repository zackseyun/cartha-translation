base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/004.yaml
  text: He has worn away my flesh and my skin[a]; he has broken my bones.
translation:
  language: zh_hans
  text: 他使我的肉和皮肤衰残[a]，折断了我的骨头。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使我的肉和皮肤消耗殆尽。”
    reason: 原词可指使某物逐渐磨损、衰败或耗尽；正文突出身体衰残，脚注保留“耗尽”的词义可能。
lexical_decisions:
- source_word: בִּלָּה
  choice: 使……衰残
  rationale: 此处为皮勒式，表达使身体逐渐损耗、衰败；“使……衰残”既保留持续耗损的意象，也适合哀歌的庄重语体。
- source_word: בְשָׂרִי
  choice: 我的肉
  rationale: 直接对应“肉、肉体”，并与“皮肤”和“骨头”共同构成鲜明的身体意象；不泛化为“身体”。
- source_word: וְעוֹרִי
  choice: 和皮肤
  rationale: 直译为“皮肤”，保留与“肉”的并列关系。
- source_word: שִׁבַּר
  choice: 折断了
  rationale: 该动词通常表示“打破、折断”；用于骨头时，“折断”自然准确，且不额外强化为“粉碎”。
- source_word: עַצְמוֹתָי
  choice: 我的骨头
  rationale: 直接保留原文具体而强烈的身体意象。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“肉和皮肤”保留希伯来诗歌由外在身体到骨头的具体意象；两个分句维持简洁有力的平行结构。
