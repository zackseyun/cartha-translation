  text: סַכֹּ֤תָה בָ/אַף֙ וַֽ/תִּרְדְּפֵ֔/נוּ הָרַ֖גְתָּ לֹ֥א חָמָֽלְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/043.yaml
  text: You covered yourself with anger and pursued us[b][a]; you killed without pity.
translation:
  language: zh_hans
  text: 你以怒气遮蔽自己[a]，追赶我们；你杀戮，毫不怜惜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以怒气”也可译作“在怒气中”。希伯来文“怒气”一词本义为“鼻子”，常用来表示发怒。
    reason: 说明希伯来习语及介词关系的译法。
  - marker: b
    text: “毫不怜惜”也可译作“没有顾惜”或“没有怜悯”。
    reason: 保留חמל兼有怜悯与顾惜、不加伤害之意的词义幅度。
lexical_decisions:
- source_word: סַכֹּתָה
  choice: 遮蔽自己
  rationale: 该动词在此没有明说宾语；结合下一节“你以密云遮蔽自己”的平行意象，补出反身意义“自己”最符合上下文，同时保留“遮蔽”的具体形象。
- source_word: בָאַף
  choice: 以怒气
  rationale: אַף本义为“鼻子”，常用作表示“怒气”的习语。介词ב可表达方式或处境；“以怒气”在中文中自然地与“遮蔽自己”相连，又不额外强化语气。
- source_word: וַתִּרְדְּפֵנוּ
  choice: 追赶我们
  rationale: רדף的基本义是“追赶、追逐”。“追赶我们”直接、自然，不加入“迫害”等较专门的含义。
- source_word: הָרַגְתָּ
  choice: 你杀戮
  rationale: הרג意为“杀、杀戮”。这里直指对方所行之事；“杀戮”保留哀歌中严峻、集体性的控诉语气。
- source_word: לֹא חָמָלְתָּ
  choice: 毫不怜惜
  rationale: חמל可指“怜惜、怜悯”或因怜悯而“顾惜、不杀”。接在“你杀戮”之后，“毫不怜惜”简洁地表达其伴随方式，并保留情感意味。
theological_decisions:
- issue: 哀歌以第二人称把追赶和杀戮直接归于上帝
  choice: 保留直接控诉：“你……追赶我们；你杀戮”
  alternative: 弱化为“你容许人追赶我们”或“你仿佛杀戮”
  rationale: 希伯来文明确使用第二人称动词，直接归因于受呼告者。哀歌容许人在审判中向上帝作尖锐陈诉；译文不应借意译消解这一神学张力。
translation_notes:
  register: 采用现代、庄重而直接的普通话。“遮蔽自己”保留原文意象；两个短句维持希伯来诗句紧凑而有力的控诉节奏。
