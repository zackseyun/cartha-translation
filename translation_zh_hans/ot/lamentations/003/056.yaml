  yaml_path: translation/ot/lamentations/003/056.yaml
  text: 'You heard my voice: do not hide your ear from my plea for relief[a], from my cry for help.'
translation:
  language: zh_hans
  text: 你听见了我的声音；求你不要对我的喘息和呼救掩耳不听[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“求你不要对我求得宽解的呼求、我的呼救掩耳不听。”希伯来语的两个介词短语含义和句法关系较难确定；“我的喘息”也可理解为“我的宽解”或“我求得宽解”。
    reason: 保留לְרַוְחָתִי的词义及其与前面动词的句法歧义，同时不把解释性的“求宽解的呼求”定为正文唯一含义。
lexical_decisions:
- source_word: קוֹלִי
  choice: 我的声音
  rationale: קוֹל通常指“声音”；在祷告语境中译作“我的声音”既自然，也保留了说话者亲自呼求的意味。
- source_word: שָׁמָעְתָּ
  choice: 你听见了
  rationale: 这是שׁמע的Qal完成式第二人称阳性单数；“你听见了”直接表达诗人回顾上帝已经垂听。
- source_word: אַל תַּעְלֵם אָזְנְךָ
  choice: 求你不要掩耳不听
  rationale: אַל表达恳切的否定请求；עלם的Hiphil形式与“耳”连用，字面意象是“隐藏耳朵”。汉语“掩耳不听”既保留身体意象，又清楚自然；加“求你”体现祷告中的恳求语气。
- source_word: לְרַוְחָתִי
  choice: 我求宽解的恳求
  rationale: רַוְחָה可指宽解、喘息或纾困；此处与“呼救”并列，主译文按寻求宽解的诉求理解。原文表达简略且介词关系困难，因此用脚注保留“喘息”的可能。
- source_word: לְשַׁוְעָתִי
  choice: 我的呼救
  rationale: שַׁוְעָה指困苦中的求助呼声；“呼救”简洁地传达急切性。介词ל在此按动词“掩耳不听”所指向的对象处理。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“掩耳不听”保留希伯来文的具体意象；分号呈现前半句回顾垂听、后半句继续恳求的张力。脚注标记[a]已置于相关短语之后。
