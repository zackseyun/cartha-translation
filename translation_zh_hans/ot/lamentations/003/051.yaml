base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/051.yaml
  text: My eye causes grief to my soul because of all the daughters of my city.
translation:
  language: zh_hans
  text: 我的眼[a]因我城所有的女子[b]，使我心中痛苦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我的眼”也可理解为“我眼中所见的”。
    reason: 说明原文以“眼”为主语所保留的转喻歧义。
  - marker: b
    text: “女子”原文直译为“女儿们”，可泛指城中的女性居民。
    reason: 保留希伯来语称谓的字面意象和语义范围。
lexical_decisions:
- source_word: עֵינִי
  choice: 我的眼
  rationale: 保留原文以“眼”为主语的鲜明表达；既可指眼睛本身，也可转指眼中所见，不在正文中擅自消解这一含义张力。
- source_word: עוֹלְלָה
  choice: 使……痛苦
  rationale: 该动词在这里表示严厉对待或造成伤痛；译作“使……痛苦”既符合句法，也避免加入原文未明确说明的具体情绪或行为。
- source_word: לְנַפְשִׁי
  choice: 我的心灵
  rationale: נפשׁ可指生命、自我或内在之人；此处“心灵”自然表达内里的痛苦，同时保留与单纯“心情”不同的广度。
- source_word: מִכֹּל
  choice: 因……所有的
  rationale: 介词מִן在此最自然地表示原因，即诗人因城中众女子的遭遇而痛苦；正文采用通顺的因果表达。
- source_word: בְּנוֹת עִירִי
  choice: 我城所有的女子
  rationale: 直译为“我城的女儿们”，在希伯来语中可指城中的女性居民；正文用现代汉语较自然的“女子”，并以脚注保留字面意象及可能范围。
theological_decisions:
- issue: “眼”与痛苦之间的关系
  choice: 保留“我的眼使我的心灵痛苦”的主谓结构
  alternative: “我眼中所见的使我心灵痛苦”
  rationale: 原文没有明说究竟是所见景象、持续流泪，还是眼睛本身使内心受苦；保留原有拟人化结构，可避免过度解释。
- issue: “我城的女儿们”的所指
  choice: 正文译为“我城所有的女子”，脚注说明字面形式及可能泛指
  alternative: “我城所有的女儿”或“我城的附属城镇”
  rationale: 上下文最自然地指城中的女性居民，但希伯来语的群体称谓具有一定宽度，因此不将其限定为亲生女儿，也不无依据地确定为附属城镇。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文简短而强烈的诗性结构；“我的眼使我的心灵痛苦”虽略带陌生感，却忠实呈现希伯来诗歌的拟人化表达。
