  text: רָאִ֤יתָה יְהוָה֙ עַוָּ֣תָתִ֔/י שָׁפְטָ֖/ה מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/059.yaml
  text: You have seen[a], O Yahweh, the wrong done to me[b]; judge my case.
translation:
  language: zh_hans
  text: 耶和华啊，你已经看见我所受的冤屈[a]；求你审断我的案件[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “我所受的冤屈”也可译作“对我的不公”；原文名词可指扭曲、不公或冤屈。
    reason: lexical_alternative
  - marker: b
    text: “审断我的案件”也可译作“为我的申诉作出裁决”或“为我申冤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: 你已经看见
  rationale: 这是 ראה 的 Qal 完成式第二人称阳性单数，直接对耶和华说话；“已经看见”既表达先前的察看，也保留其对当前申诉的意义。
- source_word: יְהוָה
  choice: 耶和华啊
  rationale: 以现代汉语中通行的专名“耶和华”呈现四字神名，并用“啊”自然表达呼告语气。
- source_word: עַוָּתָתִי
  choice: 人怎样屈枉我
  rationale: 该词可指扭曲、不公或冤屈；上下文是说话者因所受的不公向上帝申诉，而非承认自己的罪过。“屈枉我”简洁地表达受害方向。
- source_word: שָׁפְטָה
  choice: 求你审断
  rationale: 命令式请求上帝采取司法行动；加“求”符合汉语祈求语气，“审断”保留法律意象，又不预先断定裁决结果。
- source_word: מִשְׁפָּטִי
  choice: 我的案件
  rationale: מִשְׁפָּט 在此指诉讼事项或申诉；“我的案件”以自然现代汉语保留司法语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文读者熟悉的专名“耶和华”，而不以称号取代专名。
- issue: עַוָּתָתִי 所指的是谁的过错
  choice: 人怎样屈枉我
  alternative: 我的过错；对我的不公
  rationale: 本节的司法申诉及上下文表明，说话者诉说自己遭受的冤屈，并请求上帝审理；译作“我的过错”容易误解为认罪。
- issue: שׁפט 与 מִשְׁפָּט 的司法含义
  choice: 审断我的案件
  alternative: 为我申冤；判断我的案情
  rationale: 正文保留原文“审判/案件”的法律意象，不将结果直接解释为必然的平反；“为我申冤”作为可理解的语义方向列入注释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊”体现直接呼告；“屈枉我”和“审断我的案件”保留全节的司法申诉色彩。两个脚注标记均已置于正文对应位置。
