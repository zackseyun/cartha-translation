base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/040.yaml
  text: Let us examine our ways and search them out[b][a], and let us return to Yahweh.
translation:
  language: zh_hans
  text: 让我们省察自己的道路，深入查究[a]，并归向雅威[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“查究这些道路”；原文此处没有明说宾语。
    reason: syntactic_ambiguity
  - marker: b
    text: “归向”也可译作“归回”；这个动词在本语境中也带有悔改、回转之意。“雅威”传统上也译作“耶和华”。
    reason: lexical_and_name_alternative
lexical_decisions:
- source_word: נַחְפְּשָׂה
  choice: 让我们省察
  rationale: 该词是第一人称复数祈愿式，在此发出共同自勉的呼吁；“省察”既表达仔细搜寻、检视，也自然契合上下文中的道德反省。
- source_word: דְרָכֵינוּ
  choice: 自己的道路
  rationale: 保留“道路”这一希伯来语比喻，所指包括人的行事为人；不直接译成“行为”，以免失去原文意象。
- source_word: וְנַחְקֹרָה
  choice: 深入查究
  rationale: 第二个近义动词含彻底探查、考究之意；译文不补出原文未明说的宾语，同时让它自然承接“自己的道路”。
- source_word: וְנָשׁוּבָה
  choice: 并归向
  rationale: שׁוב的基本意象是转回、返回；“归向”在现代汉语中自然表达关系上的回转，又不把含义收窄为单纯内在的“悔改”。
- source_word: עַד
  choice: 向
  rationale: 与“归回”类动词连用时表示趋向的终点；汉语以“归向”整体表达这种方向关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译四字神名，保留其作为专名的性质，而不以“主”这一称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用较贴近YHWH通常拟音的“雅威”，借此保留专名；脚注列出汉语读者熟悉的传统译名。
- issue: שׁוב应译为“归向”还是“悔改”
  choice: 归向
  alternative: 归回；悔改
  rationale: 原词首先描写转身返回，语境确有悔改意味，但“归向”保留了行动、关系与盟约回转之间的张力，不将其只解释为内心悔悟。
- issue: 第二个查验动词是否补明宾语
  choice: 不在正文补出宾语
  alternative: 深入查究这些道路
  rationale: 原文第二个动词没有明说宾语，虽可自然承接“我们的道路”，但保持省略能避免把句法关系说得比原文更明确。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“让我们”连续统摄三个并列的祈愿式动词；“省察—深入查究—归向”保留原文由自我检视转向实际回归的推进。
