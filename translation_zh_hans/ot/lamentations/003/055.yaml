  text: קָרָ֤אתִי שִׁמְ/ךָ֙ יְהוָ֔ה מִ/בּ֖וֹר תַּחְתִּיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/055.yaml
  text: I called on your name[a], O Yahweh, from the depths of the pit.
translation:
  language: zh_hans
  text: 耶和华啊，我从坑的最深处[a]呼求你的名。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可较直译为“从坑的最低处”或“从坑的下层深处”。
    reason: 说明תַּחְתִּיּוֹת与בּוֹר之间较为压缩的希伯来语结构，以及“低处／下层深处”的可选表达。
lexical_decisions:
- source_word: קָרָאתִי
  choice: 我……呼求
  rationale: 该词是קרא的Qal完成式第一人称单数；与“你的名”连用并直接称呼耶和华时，表示在祷告中呼唤、求告。“呼求”既自然，也保留困境中发声求告的语气。
- source_word: שִׁמְךָ
  choice: 你的名
  rationale: 直译为“你的名”。这里“名”代表被呼求的那一位，但保留希伯来语表达，不简化为“你”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语圣经读者熟悉的专名“耶和华”表达四字神名，而不以“主”这一称号代替。
- source_word: מִבּוֹר
  choice: 从深坑
  rationale: בּוֹר可指坑、蓄水池或地牢般的坑穴；此处“坑”最能兼顾实际受困与濒临死亡的比喻意象。中文将深度修饰语整合为“深坑之底”，避免生硬重复。
- source_word: תַּחְתִּיּוֹת
  choice: 之底
  rationale: 该复数形式表示低处、最深处。译作“之底”与“深坑”搭配自然，并传达身处坑中极低之处的意思；其他可能的结构见脚注。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名，正文保留为专名，不用“主”替代。“耶和华”是现代标准汉语中最广为人知且庄重的传统音译；“雅威”更接近常见的学术拟音，但不必借此解决古代发音的不确定性。
- issue: “呼求你的名”的含义
  choice: 保留“你的名”这一希伯来表达
  alternative: 向你呼求
  rationale: “呼求某人的名”实际指向那位被呼求者，但直译可保留经文关于神之名的语言及其神学张力，同时在现代汉语中仍然可懂。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华啊”保留直接呼告；“深坑之底”凝练地呈现原文“坑的低处/最深处”，脚注则保留其句法和词义上的歧义。
