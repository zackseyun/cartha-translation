  text: זֹ֛את אָשִׁ֥יב אֶל לִבִּ֖/י עַל כֵּ֥ן אוֹחִֽיל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/021.yaml
  text: This I call to mind[a]; therefore I have hope.
translation:
  language: zh_hans
  text: 我想起这事[a]，因此我就有盼望。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或直译：“我使这事回到我心中；因此我盼望。”
    reason: 保留希伯来语“带回到我心中”的字面意象；该习语指重新在内心思量或想起。
lexical_decisions:
- source_word: זֹאת
  choice: 这事
  rationale: 阴性单数指示代词可回指前文，也可引出下文所记之事；译作“这事”自然，并保留指向上的开放性。
- source_word: אָשִׁיב
  choice: 我把……记在
  rationale: שׁוב 的使役式字面义为“使返回、带回”；与“到我心里”连用时，表达把某事重新带回内在意识，即铭记或重新想起。
- source_word: אֶל לִבִּי
  choice: 心里
  rationale: 希伯来语“心”涵盖思想、记忆与意志；现代汉语“记在心里”既自然，又比单纯译作“想起”更能保留原文的心之意象。
- source_word: עַל כֵּן
  choice: 因此
  rationale: 这是表示推论或结果的常用连接语，清楚呈现回想与盼望之间的逻辑关系。
- source_word: אוֹחִיל
  choice: 我仍有盼望
  rationale: יחל 的使役式可表示怀着期待而等候或盼望；“有盼望”体现持续的期待，“仍”则依哀歌语境自然显明苦难中盼望的延续，但不改变因果关系。
theological_decisions:
- issue: לֵב（心）的身体—心理意象
  choice: 保留为“心里”，置于自然汉语习语“记在心里”中
  alternative: 译作“我使这事回到心中”或“我想起这事”
  rationale: 原文的“心”不仅指情感，也包括思想、记忆和意志。所选译法避免把“心”窄化为情绪，同时保留原文的内在意象。
- issue: אוֹחִיל 所表达的是盼望还是期待等候
  choice: 译作“我仍有盼望”
  alternative: 译作“我要等候”或“我就盼望”
  rationale: 该动词兼有盼望和期待等候的语义。上下文强调在哀痛中重新产生盼望，正文采用自然的“有盼望”，脚注无需强行排除“等候”的语义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“记在心里”适合普通读者，也保留希伯来语“心”的意象；句式简洁，以配合哀歌中由痛苦转向盼望的转折。
