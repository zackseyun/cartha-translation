  text: He is a bear lying in wait for me[a], a lion in hiding places.
translation:
  language: zh_hans
  text: 他对我像一头伺机伏击的熊，像一头藏在隐蔽处的狮子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “隐蔽处”或译“隐秘之地”。
    reason: 保留 בְּמִסְתָּרִים 可指藏身处或隐秘地点的词义幅度。
lexical_decisions:
- source_word: דֹּב
  choice: 熊
  rationale: 该名词明确指熊；加上量词“一头”，自然表达此处不定、表语性的比喻。
- source_word: אֹרֵב
  choice: 伺机埋伏的
  rationale: 该分词表示潜伏等候、准备袭击；“伺机埋伏”保留了刻意伏击的捕食意象。
- source_word: הוּא
  choice: 他……是
  rationale: 独立代词明确作主语；中文用判断结构“是”表达无动词名词句，且保留原文的强调感。
- source_word: לִי
  choice: 对我
  rationale: 介词标明伏击所针对的对象；“对我”既贴近形式，也在上下文中自然带出敌对指向。
- source_word: אריה
  choice: 狮子
  rationale: 该词指狮子；用“一头”与前半句的“熊”形成平行。
- source_word: בְּמִסְתָּרִים
  choice: 藏在隐蔽处
  rationale: 复数形式指隐蔽、秘密的所在；“隐蔽处”具体呈现猛兽藏身伏击的场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的中文。两个“是”形成诗性平行，“伺机埋伏”强化原文分词所含的蓄意袭击意味；不额外指明“他”的身份，以保留上下文中的指代方式。
