  text: They silenced my life in the pit[a], and threw a stone at me.
translation:
  language: zh_hans
  text: 他们在坑中断绝我的性命，又向我扔了一块石头。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“又把一块石头扔在我身上。”原文也可能描绘他们用石头封住坑口，而不只是向他扔石头。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְתוּ
  choice: 断绝
  rationale: 该动词可表示使终止、剪除或毁灭。与“我的性命”搭配时，“断绝我的性命”既贴近原文，也自然表达置人于死地的含义，而不把较适合英语的“使……沉默”意象强加于汉语。
- source_word: בַבּוֹר
  choice: 在坑中
  rationale: בּוֹר 可指坑、蓄水池或类似地牢的深穴；“坑”保留其宽泛意义，不强行限定具体设施。定指成分依照上下文自然译出，无须在汉语中另加指示词。
- source_word: חַיַּי
  choice: 我的性命
  rationale: 该带第一人称后缀的复数形式在这里惯用地指“我的生命”。“性命”与“断绝”搭配自然，也保留生死攸关的力度。
- source_word: וַיַּדּוּ
  choice: 扔
  rationale: 该动词意为投、掷。“扔”是清楚自然的现代汉语，并不额外增强动作力度。
- source_word: אֶבֶן
  choice: 一块石头
  rationale: 原文为单数；汉语加量词“一块”自然明确地传达单数。
- source_word: בִּי
  choice: 在我身上
  rationale: 介词 ב 可表示接触、针对或位于其上。“扔在我身上”保留石头落在其上、甚至封住坑口的可能，也仍可理解为以石头攻击他；脚注列出另一种自然理解。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“断绝我的性命”保留原文的强烈表达；“在我身上”有意保留介词所容许的空间与敌对含义之间的歧义，并以脚注说明另一译法。
