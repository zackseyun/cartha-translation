  text: My eye runs down and does not cease[a], without interruption,
translation:
  language: zh_hans
  text: 我的眼泪流淌不止[a]，毫无间歇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“我的眼睛流淌，并不止息，毫无间歇。”原文译作“止息”的动词也可表示“静止”；末尾的名词可译作“间歇”“喘息”或“缓解”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינִי
  choice: 我的眼泪
  rationale: 希伯来文直译为“我的眼睛”，以流泪的器官代指所流的泪。中文若说“我的眼睛流淌”不够自然，因此采用“我的眼泪”，明确原文语境中隐含的所流之物。
- source_word: נִגְּרָה
  choice: 流
  rationale: 该动词表示向下流淌或倾流；与“眼泪”搭配时，“流”自然、简洁，并保留持续流淌的意象。
- source_word: וְלֹא תִדְמֶה
  choice: 不止
  rationale: דמה在此可表示停止、静止；“不止”贴合持续哭泣的上下文，同时简洁地保留“没有停止”的意义。
- source_word: מֵאֵין הֲפֻגוֹת
  choice: 片刻不停
  rationale: 该短语表示没有间歇、喘息或缓解。“片刻不停”符合现代中文诗歌表达，并传达完全没有停顿的强调语气。
