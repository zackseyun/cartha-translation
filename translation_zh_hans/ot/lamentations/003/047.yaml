  text: 惊恐和陷坑临到我们；荒凉和毁灭也临到我们。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחַד
  choice: 惊恐
  rationale: 表达突然而强烈的恐惧，也保留名词性，与下文并列。
- source_word: פַחַת
  choice: 陷阱
  rationale: 本义为坑、陷坑，在此与“惊恐”构成音近词语；译作“陷阱”能传达灾祸使人落入其中的意象。
- source_word: הַשֵּׁאת
  choice: 毁灭
  rationale: 此词在本节语境中指荒废、毁坏；“毁灭”自然且有力度。
- source_word: הַשָּׁבֶר
  choice: 破败
  rationale: 源于“打碎、破裂”的词根，表示崩毁或破坏；“破败”既与“毁灭”区别，又保留破碎的意味。
