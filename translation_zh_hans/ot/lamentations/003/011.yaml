base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/011.yaml
  text: He turned my paths aside and tore me apart[a]; he made me desolate.
translation:
  language: zh_hans
  text: 他使我的路径偏离，又将我撕裂[a]；他使我荒凉。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把我撕碎”。这个罕见动词很可能表示猛烈撕扯，也可能延续上下文的猛兽意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכַי
  choice: 我的路径
  rationale: 保留原文复数所呈现的具体道路意象，同时可自然指向说话者的人生行程。汉语“路径”本身不显明单复数，但不必生硬增添“条条”。
- source_word: סוֹרֵר
  choice: 使……偏离
  rationale: 与“我的路径”搭配，表达使道路转离原有方向；既保留方向性，也不将其过度解释为“弄弯曲”。
- source_word: וַיְפַשְּׁחֵנִי
  choice: 将我撕裂
  rationale: 该动词罕见，语境可能延续猛兽意象，指猛烈撕扯。“撕裂”保留暴力感，却不像“撕成碎片”或“咬伤”那样过度限定动作方式。
- source_word: שָׂמַנִי
  choice: 使我
  rationale: 这里与结果状态“荒凉”连用，译作“使我”符合现代汉语，也准确表达造成某种状态。
- source_word: שֹׁמֵם
  choice: 荒凉
  rationale: 表达被毁坏、成为荒废之境的状态，并保留原文将人的处境描写为空旷废墟般的强烈意象。
theological_decisions:
- issue: 施行动作的主语
  choice: 沿用上文所指的“他”，不在本节增补“上帝”或“耶和华”
  alternative: 明确译为“上帝”或“耶和华”
  rationale: 原文只用第三人称动词形式，指代由上下文确定；保留“他”可避免在本节中增添原文没有明说的名词，同时不削弱上下文的神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“路径—偏离”和“撕裂—荒凉”保存原文连续而强烈的诗歌意象；避免使用过于口语化的“扯烂”，也不以“咬伤”坐实原文仅可能暗示的猛兽动作。
