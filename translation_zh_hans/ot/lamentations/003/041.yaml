  yaml_path: translation/ot/lamentations/003/041.yaml
  text: Let us lift up our hearts with our hands to God in heaven.
translation:
  language: zh_hans
  text: 让我们把心连同双手举向天上的上帝。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשָּׂא
  choice: 让我们……举向
  rationale: 该词为第一人称复数形式，在语境中表达共同劝勉；用“让我们”自然传达这一语气，“举向”保留向上举起并朝向上帝的意象。
- source_word: לְבָבֵנוּ
  choice: 我们的心
  rationale: 原文用单数“心”加复数所属后缀，具有群体性的集合含义；汉语用“心”既自然，也保留内在生命与意志的整体意象。
- source_word: אֶל־כַּפָּיִם
  choice: 连同双手
  rationale: 字面结构较罕见，介词短语将“心”与举起的双手联系起来。译作“连同双手”保留心与手一同向上帝举起的画面，不把二者割裂为互不相关的动作。
- source_word: אֶל־אֵל בַּשָּׁמָיִם
  choice: 向天上的上帝
  rationale: 准确表达动作的对象以及上帝在天上的描述；“上帝”是现代普通话中自然、庄重且广泛可懂的称谓。
theological_decisions:
- issue: 内心归向与外在祷告姿态的关系
  choice: “把心连同双手举向”
  alternative: “举起我们的心和手”
  rationale: 所选译法体现原文中“心”与“双手”的紧密联系，既不将外在动作与内在归向分开，也不把经文解释成某种特定礼仪要求。
translation_notes:
  register: 采用现代、庄重而易懂的劝勉语体。“连同双手”较自然地呈现原文不寻常的介词关系，同时避免生硬直译为“把心举到手掌那里”。
