base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/019.yaml
  text: Remember my affliction and my wandering[b][a], the wormwood and the gall.
translation:
  language: zh_hans
  text: 求你记念我的困苦和漂泊[a]，以及苦艾和毒草[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “漂泊”也可译作“流离”；希伯来语所表达的是居无定所、四处辗转的处境。
    reason: lexical_alternative
  - marker: b
    text: “苦艾和毒草”是苦味与毒害的具体意象，也可比喻极深的痛苦。
    reason: cultural_note
lexical_decisions:
- source_word: זְכָר
  choice: 求你记念
  rationale: 这是阳性单数第二人称的祈使式，表达直接恳求；“求你”使现代汉语中的呼告语气自然清楚。
- source_word: עָנְיִי
  choice: 我的困苦
  rationale: 该词指患难、苦况或受苦；“困苦”既保留苦难的分量，又不把含义限于心理感受。
- source_word: מְרוּדִי
  choice: 我的漂泊
  rationale: 该名词含有居无定所、四处流离之意；“漂泊”保留其动态意象，也容纳流亡处境。
- source_word: לַעֲנָה
  choice: 苦艾
  rationale: 原文采用一种以强烈苦味著称的植物名称；“苦艾”保留具体植物意象，而不直接抽象化为“苦楚”。
- source_word: וָרֹאשׁ
  choice: 毒草
  rationale: רֹאשׁ可指有毒或极苦的植物，也可延伸指毒物；与“苦艾”并列时译作“毒草”，能保留植物性和毒性，同时避免过度确定具体品种。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“求你记念”保留祈使呼告；“困苦和漂泊”简洁对应两个并列名词；末尾保留“苦艾和毒草”的具体诗歌意象，不将其完全解释成抽象的“痛苦”或“苦毒”。
