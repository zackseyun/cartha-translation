base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/037.yaml
  text: Who is this who speaks and it happens[b][a], unless the Lord has commanded it?
translation:
  language: zh_hans
  text: 若不是主所吩咐的，谁说了，事情就成了呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי זֶה
  choice: 谁能
  rationale: מִי זֶה构成带强调意味的反问；汉语用“谁能”自然表达“究竟有谁可以”的语气，并与下文事件成就相衔接。
- source_word: אָמַר וַתֶּהִי
  choice: 说一件事，它就成了
  rationale: 两个动词在反问中表达普遍真理。将隐含的事件补为“一件事”，并用“成了”表达所说之事实际发生，同时保留“说……就成”的紧密关系。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 此处是神的称号אֲדֹנָי，并非四字神名；译作“主”准确且符合现代中文圣经语体。
- source_word: לֹא צִוָּה
  choice: 若不是……命定的
  rationale: צוה通常意为“吩咐、命令”；在此以事件为隐含宾语，语境义为主使其发生。中文“命定”能自然表达这一事件性的用法，但较字面的译法见脚注。
theological_decisions:
- issue: צוה所表达的神圣主权
  choice: 命定
  alternative: 吩咐／命令
  rationale: 经文断言事情的发生不离于主的指令，但不扩展为一套系统神学定义。“命定”在正文中表达事件受主决定的语境义，脚注保留动词较字面的意义。
translation_notes:
  register: 采用现代、庄重而易懂的反问句式。“说一件事，它就成了”保留希伯来文两个过去时形式在本句中所表达的普遍性陈述；不另加过去时间限定。
