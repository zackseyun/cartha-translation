base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/025.yaml
  text: Yahweh is good to those who wait for him[a], to the soul that seeks him.
translation:
  language: zh_hans
  text: 雅威对等候他的人是良善的；对寻求他的心灵也是如此[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“盼望他的人”；希伯来语动词包含怀着盼望等候的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: 善待
  rationale: 此处形容词“好”以雅威为主语，并由两个介词短语说明对象。汉语用“善待”能自然表达“雅威对……是良善的”，同时保留其施恩、赐福的宽泛含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，不以“主”这一称号替代。
- source_word: לְקֹוָו
  choice: 等候他的人
  rationale: קוה兼有等候和怀着盼望期待的意味；正文采用“等候”，贴合哀歌中在患难里耐心期待的语境，盼望之意见脚注。
- source_word: לְנֶפֶשׁ
  choice: 心灵
  rationale: נפש可指心灵、自身或人。这里采用“心灵”以保留诗歌表达和与阴性动词形式的呼应，但不据此引入特定的人论。
- source_word: תִּדְרְשֶׁנּוּ
  choice: 寻求他的
  rationale: דרש以神为宾语时常表示关系和信仰意义上的寻求；“寻求他”简洁自然，并与“等候他”形成平行。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常重构的读音，并保留其作为专名的性质。
- issue: קוה 的语义张力
  choice: 等候他
  alternative: 仰望他／盼望他
  rationale: 该动词同时包含等待和期待盼望；正文保留等待中的延迟感，脚注说明其盼望意味，不将二者强行合并。
- issue: נפש 的理解
  choice: 心灵
  alternative: 人／本人
  rationale: 原词在此可以整体指一个人，也保留内在生命的诗意色彩；采用“心灵”以维持诗歌语体，但不将其限定为与身体分离的实体。
translation_notes:
  register: 采用现代、庄重而易懂的诗歌语言。为呈现两个 לְ 短语的平行关系，第二分句补出“善待”；“心灵”保留希伯来诗歌色彩。
