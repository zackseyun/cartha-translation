  text: 求你察看他们坐下、起来；我成了他们的歌谣。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们嘲弄的歌谣”。这里的希伯来词可指“歌曲”或“音乐”；按上下文，很可能指他们所唱、用以嘲弄说话者的歌。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְתָּם
  choice: 他们坐下
  rationale: 与“起来”构成具体而概括性的配对，指他们日常的一举一动；保留希伯来语意象，不扩译为“居住”。
- source_word: וְקִימָתָם
  choice: 起来
  rationale: 与“坐下”平行，保留希伯来语的成对表达；现代汉语自然简洁。
- source_word: הַבִּיטָה
  choice: 求你察看
  rationale: 这是在上下文中向上帝发出的命令式恳求；“求你”体现祈求语气，“察看”保留要求留意其行为的力度。
- source_word: אֲנִי
  choice: 我
  rationale: 保留原文显式代词及其强调作用，突出说话者本人正成为对方歌唱的对象。
- source_word: מַנְגִּינָתָם
  choice: 他们的歌谣
  rationale: 该词可指歌曲或音乐；此处所有格结构直译为“他们的歌谣”，保留“我就是他们所唱的内容”及可能带有嘲弄意味的语境张力，而不在正文中过度限定。
