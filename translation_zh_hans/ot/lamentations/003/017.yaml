  text: וַ/תִּזְנַ֧ח מִ/שָּׁל֛וֹם נַפְשִׁ֖/י נָשִׁ֥יתִי טוֹבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/017.yaml
  text: You have thrust my soul away from peace[c][b][a]; I have forgotten goodness.
translation:
  language: zh_hans
  text: 你使我失去平安[a][b]；我已忘了福乐[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你弃绝我，使我失去平安。”这个动词形式也可理解为第三人称阴性单数，意为“我失去了平安”或“我的性命失去了平安”。
    reason: 保留动词可作第二人称阳性单数或第三人称阴性单数的句法歧义，并更正第三人称分析的主语说明。
  - marker: b
    text: “平安”所译的希伯来语也可指安康、福祉或完满。
    reason: 说明שָׁלוֹם较宽的语义范围。
  - marker: c
    text: “福乐”也可译作“美好”或“福祉”。
    reason: 说明טוֹבָה可兼指美好事物、幸福和顺境。
lexical_decisions:
- source_word: וַתִּזְנַח
  choice: 你使……远离
  rationale: זנח有“弃绝、抛弃”之意；结合介词短语“从平安”，译作“使……远离”能以自然中文表达被排除在平安之外的结果，同时在脚注保留更直译的选择。该动词形式既可理解为第二人称阳性单数，也可理解为第三人称阴性单数；上下文中对上帝的陈述支持这里译为“你”。
- source_word: נַפְשִׁי
  choice: 我
  rationale: נֶפֶשׁ在此指说话者本人及其生命、内在感受；现代汉语用“我”比“我的灵魂”自然，也避免把希伯来语的整体人格概念缩窄为非物质部分。
- source_word: מִשָּׁלוֹם
  choice: 远离平安
  rationale: שָׁלוֹם既指平安，也涵盖安康、完满的生活状态。“平安”保留核心词义和哀歌的诗性，较宽的语义在脚注说明。
- source_word: נָשִׁיתִי
  choice: 我已忘了
  rationale: 第一人称单数完成式直接表达“我忘了”；“已”自然传达已然状态，不额外加入“你使我忘记”的使役含义。
- source_word: טוֹבָה
  choice: 福乐
  rationale: טוֹבָה可指美好、福祉、顺境。“福乐”在中文中简洁而有诗意，既不限于物质昌盛，也比抽象的“良善”更符合遭受苦难而失去福祉的语境。
theological_decisions:
- issue: 首句动词主语及语态的歧义
  choice: 按第二人称理解，译为“你使我远离平安”
  alternative: 按第三人称阴性单数理解为“我的心失去了平安”，或更直译为“你弃绝我，使我远离平安”
  rationale: 希伯来语形式可作第二人称阳性单数或第三人称阴性单数。上下文把苦难归于上帝的作为，因此第二人称理解成立；但不把另一种句法可能性当作不存在，故收入脚注。
- issue: 是否把忘记解释为上帝使其忘记
  choice: 保留第一人称陈述“我已忘了”
  alternative: “你使我忘了”
  rationale: 动词形式本身是第一人称单数，并无明确使役形态；不因神学或上下文推论而补入使役主语。
translation_notes:
  register: 采用现代、庄重而简洁的哀歌语体。分号保留两个紧密相连的诗行之间的停顿。“我”比“我的灵魂”更符合נַפְשִׁי在本句中指整个自我的用法；“福乐”兼具可懂性与诗性。
