base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/039.yaml
  text: Why should a living man complain, a man, about his sins?
translation:
  language: zh_hans
  text: 活着的人为什么抱怨呢？人为什么因自己的罪[a]抱怨呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因自己的罪”也可译作“关于自己的罪”。上下文可能指罪所带来的苦果或惩罚，但原文没有明说“惩罚”。
    reason: 说明介词עַל在此可表达因由或所关涉的事，并避免把罪的后果或惩罚直接加入正文。
lexical_decisions:
- source_word: יִתְאוֹנֵן
  choice: 抱怨
  rationale: 该反身词形在此表示因遭遇不幸而发怨言；“抱怨”自然、准确，也符合上下文。
- source_word: אָדָם חָי
  choice: 活着的人
  rationale: אָדָם泛指人类个体，חָי强调仍然活着；译文保留这一强调，不限定为男性。
- source_word: גֶּבֶר
  choice: 人
  rationale: 原词本指男子，但本节论述具有普遍性；现代汉语用“人”可避免把教训不必要地局限于男性，同时保留与前句的平行。
- source_word: עַל חטאו
  choice: 为自己的罪
  rationale: עַל可表示“关于、为了、因着”；“为自己的罪”保留其关系上的宽度，不把它直接改释为“因罪所受的惩罚”。
theological_decisions:
- issue: 抱怨的对象究竟是罪本身，还是犯罪所招致的苦果或惩罚
  choice: 正文直译为“为自己的罪”，脚注说明介词可能表达“因自己的罪”
  alternative: 译作“因自己的罪所受的惩罚而抱怨”
  rationale: 希伯来正文只明确说“自己的罪”，没有明说“惩罚”；上下文可能使苦果或惩罚成为言外之意，但不应把这一解释直接写入正文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。以两个反问句呈现原文的简洁平行结构；第二句补出汉语所需的谓语“抱怨”，不增加新的命题内容。
