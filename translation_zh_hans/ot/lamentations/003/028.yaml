base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/028.yaml
  text: Let him sit alone and be silent[a], for he has laid it on him.
translation:
  language: zh_hans
  text: 让他独自坐着，默不作声，因为他把此事加在他身上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“因为他把重担加在他身上。”希伯来文没有明说“他”是谁，也没有明说加在他身上的是什么；正文的“此事”仅为汉语表达所作的补足。
    reason: 保留 נָטַל עָלָיו 的隐含主语和宾语；“重担”是合乎语境但较具体的译法，故置于脚注。
lexical_decisions:
- source_word: יֵשֵׁב
  choice: 让他……坐着
  rationale: 此处未完成式在上下文的劝勉序列中具有祈使或劝告意味；“让他……坐着”自然传达这一语气。
- source_word: בָּדָד
  choice: 独自
  rationale: 表达独处、孤单的状态；“独自”简洁自然，也保留哀歌语境中的情感力度。
- source_word: וְיִדֹּם
  choice: 默不作声
  rationale: דמם 可指静默或安静；这里与“独自坐着”并列，“默不作声”明确传达在苦难中沉默的含义。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出前述劝勉的理由；现代汉语用“因为”清楚自然。
- source_word: נָטַל
  choice: 把这担子加在
  rationale: 该动词本义涉及拿起、承担或举起，与 עַל 连用时在此语境中可表达把重担加于某人；这一译法与前文“轭”的意象相呼应，但不具体说明担子为何物。
- source_word: עָלָיו
  choice: 在他身上
  rationale: 直接表达介词短语“在他之上／身上”，符合现代汉语习惯。
theological_decisions:
- issue: נָטַל 的隐含主语和宾语
  choice: 正文以两个“他”和“这担子”补足汉语句法，但不明说施加者是耶和华，也不具体界定担子的内容。
  alternative: “因为耶和华把担子加在他身上”或“因为他独自担当了这担子”
  rationale: 希伯来文没有明说 נָטַל 的主语，宾语也只由语境暗示。正文采用较符合上下文的“施加担子”理解，同时用脚注保留主语、宾语未明以及“担当”这一可能读法，避免替原文消除歧义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“默不作声”比“静默”更通俗；“这担子”承接上下文的轭与苦难意象。脚注标记置于相关整句之后。
