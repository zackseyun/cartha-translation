base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/044.yaml
  text: You have covered yourself with a cloud so that prayer cannot pass through[a].
translation:
  language: zh_hans
  text: 你用云彩遮蔽自己，使祷告无法穿过。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更形式对应地译作：“你用云彩为自己遮蔽，以阻止祷告穿过。”
    reason: lexical_alternative
lexical_decisions:
- source_word: סַכּוֹתָה
  choice: 遮蔽
  rationale: 该词是סכך的Qal完成式第二人称阳性单数，带附加的ה；结合לָךְ，在这里表达上帝把自己遮蔽起来。译作“遮蔽”既保留覆盖、阻隔的意象，也符合庄重的现代汉语。
- source_word: בֶעָנָן
  choice: 用云彩
  rationale: 介词ב与单数名词עָנָן在此表示手段或包围性的媒介。“用云彩”自然地保留单数集体意象，并明确云彩是遮蔽、阻隔的媒介。
- source_word: לָךְ
  choice: 自己
  rationale: 形式上是“给你/为你”，但与סַכּוֹתָה连用时具有反身或受益格作用；现代汉语用“自己”清楚表达这一关系。
- source_word: מֵעֲבוֹר
  choice: 使……无法穿透
  rationale: 介词מִן加עבר的不定式附属形表达阻止或排除“经过”。译成结果/阻止结构“使……无法穿透”，既自然，也保留云层构成障碍的空间意象。
- source_word: תְּפִלָּה
  choice: 祷告
  rationale: 单数名词在此具有泛指意义。“祷告”在现代汉语中可作不可数或概括性表达，无须加“一次”或“一项”。
theological_decisions:
- issue: 上帝遮蔽自己并阻挡祷告的拟人化描写
  choice: 保留直接的第二人称称呼，以及上帝用云彩遮蔽自己、使祷告无法穿透的意象。
  alternative: 弱化为“你隐藏在云中”，或把祷告受阻解释成非人格化的障碍。
  rationale: 希伯来文直接向上帝说话，并以强烈的哀歌意象描写神的隐藏与审判。译文不淡化，也不试图消解其中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“云彩”保留经文诗歌语体；“穿透”传达祷告试图越过云层却被阻隔的具体意象。主文中的[a]与脚注相对应。
