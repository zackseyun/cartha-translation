base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/015.yaml
  text: 'All who pass along the road clap their hands at you[a]; they hiss and shake their heads over daughter Jerusalem: “Is this the city that they called the perfection of beauty[c][b], the joy of all the earth?”'
translation:
  language: zh_hans
  text: '凡从路上经过的人都向你拍掌；他们向耶路撒冷女子[b]发出嘘声[a]，摇着头，说：


    “这就是人们所说的


    ‘美丽的极致[c]，全地的喜乐’吗？”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“吹口哨”；希伯来语动词可指表示讥诮的尖锐声音，既可理解为嘘声，也可理解为口哨声。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“耶路撒冷的女儿”，是把这座城人格化的诗歌表达。
    reason: cultural_note
  - marker: c
    text: 或译“美丽无瑕”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סָפְקוּ ... כַּפַּיִם
  choice: 拍掌
  rationale: 该习语指双手相击；在本节语境中是嘲弄的动作。“拍掌”简洁自然，并保留具体形象。
- source_word: עָלַיִךְ
  choice: 向你
  rationale: 介词在嘲弄动作中表示动作所针对的对象；“向你拍掌”符合现代汉语表达。
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: 凡从路上经过的人
  rationale: 既表达所有过客，也明确保留 דֶרֶךְ“路”的含义。
- source_word: שָׁרְקוּ
  choice: 发出嘘声
  rationale: 该词可指尖锐的吹哨声或嘘声；审判与讥诮语境中，“发出嘘声”最能传达鄙夷，同时以脚注保留词义上的另一可能。
- source_word: וַיָּנִעוּ רֹאשָׁם
  choice: 摇头
  rationale: 这是表示嘲弄或惊愕的惯常动作；“摇头”是自然、准确的现代汉语。
- source_word: עַל בַּת יְרוּשָׁלָם
  choice: 向耶路撒冷女子
  rationale: 保留“女子”这一城市人格化意象；“向”表明嘘声和摇头所针对的对象。
- source_word: הֲזֹאת הָעִיר
  choice: 这就是……吗
  rationale: 用反问句重现过客讥讽、难以置信的语气。
- source_word: שֶׁיֹּאמְרוּ
  choice: 人们所说的
  rationale: 未明确主语的复数动词表示一般人的惯常说法；此译法自然地引出昔日对城的称誉。
- source_word: כְּלִילַת יֹפִי
  choice: 美丽的极致
  rationale: כְּלִילַת 表达完整、完美或极致；此译保留名词性称号和诗意，又不把它缩减为一般的“美丽”。
- source_word: מָשׂוֹשׂ לְכָל הָאָרֶץ
  choice: 全地的喜乐
  rationale: 保留原文的名词性称号以及“全地”的广泛范围，语言简洁庄重。
