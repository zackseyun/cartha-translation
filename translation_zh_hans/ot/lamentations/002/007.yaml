id: LAM.2.7
reference: Lamentations 2:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: זָנַ֨ח אֲדֹנָ֤/י מִזְבְּח/וֹ֙ נִאֵ֣ר מִקְדָּשׁ֔/וֹ הִסְגִּיר֙ בְּ/יַד אוֹיֵ֔ב חוֹמֹ֖ת אַרְמְנוֹתֶ֑י/הָ ק֛וֹל נָתְנ֥וּ בְּ/בֵית יְהוָ֖ה כְּ/י֥וֹם מוֹעֵֽד׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/007.yaml
  text: The Lord has rejected his altar[a]; he has abandoned his sanctuary. He has given the walls of her palaces into the hand of the enemy[c][b]. They raised a shout in the house of Yahweh as on the day of an appointed feast.
translation:
  language: zh_hans
  text: 主弃绝了自己的祭坛，厌弃了自己的圣所[a]；他把她宫殿的墙垣交在仇敌手中[b]。他们在雅威的殿中高声呼喊，如同在节期的日子[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “厌弃”也可译作“憎厌”或“鄙弃”；原文这个动词比前面的“弃绝”语气更强。
    reason: lexical_alternative
  - marker: b
    text: “交在仇敌手中”是希伯来语习语，意思是交给仇敌掌控。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“如同在节庆之日”或“如同在指定集会的日子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: 弃绝
  rationale: 表达拒斥、撇弃之意，符合审判语境，同时不把含义绝对化为永久遗弃。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是对上帝的称号；译作“主”自然、庄重，并与本节后面的神名区别开来。
- source_word: מִזְבְּחוֹ
  choice: 自己的祭坛
  rationale: 保留单数和第三人称所属关系；中文用“自己的”明确其回指主。
- source_word: נִאֵר
  choice: 厌弃
  rationale: 比前面的“弃绝”更带轻蔑、憎厌色彩，保留两个不同动词形成的诗意递进。
- source_word: מִקְדָּשׁוֹ
  choice: 自己的圣所
  rationale: “圣所”准确表达神圣的礼拜场所，并保留单数及所属关系。
- source_word: הִסְגִּיר בְּיַד אוֹיֵב
  choice: 交在仇敌手中
  rationale: 保留希伯来语“交在……手中”的形象，也能自然表达使其落入仇敌权势之下。
- source_word: חוֹמֹת אַרְמְנוֹתֶיהָ
  choice: 她宫殿的墙垣
  rationale: 保留复数“墙垣”和阴性单数后缀所体现的城市拟人；אַרְמוֹן可指宫殿，也可能带堡垒色彩。
- source_word: קוֹל נָתְנוּ
  choice: 他们……喧嚷
  rationale: 该习语直译为“他们发出声音”；“喧嚷”在中文中自然呈现仇敌在圣殿中的高声叫喊。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿里
  rationale: “殿”自然表达“雅威之家”的圣殿语境；“雅威”音译神名，而不以称号替代。
- source_word: כְּיוֹם מוֹעֵד
  choice: 如同在指定节期的日子
  rationale: מוֹעֵד可指指定的时间、节期或集会；正文兼顾“指定”与宗教节期含义，并保留仇敌喧嚷与昔日节庆声音之间的反讽。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以音译保留其作为专名的性质，不用“主”这一称号替代；“耶和华”是另一传统音译。
- issue: זָנַח 与 נִאֵר 的语气差别
  choice: 分别译作“弃绝”和“厌弃”
  alternative: 两处都译作“弃绝”；把 נִאֵר 译作“憎恶”
  rationale: 两个不同动词形成语势递进。“厌弃”保留后者较强的憎厌意味，又避免“憎恶”可能造成的过度强化。
- issue: 阴性后缀 אַרְמְנוֹתֶיהָ 的所指
  choice: 保留“她”，体现耶路撒冷的拟人化
  alternative: 明说“耶路撒冷”；译作“城中的”
  rationale: 上下文把城拟人化为女性；保留代词不替原文补明所指，也维持诗歌表达。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。句式保留希伯来诗歌的平行与反讽；“墙垣”略具文学色彩，但在圣经诗歌语境中清楚自然。“她”延续城市女性拟人，不擅自补明为耶路撒冷。
