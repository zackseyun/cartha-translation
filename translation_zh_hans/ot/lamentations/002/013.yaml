base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/013.yaml
  text: What can I testify for you? What can I compare you to[a], daughter Jerusalem? What can I liken to you, so that I may comfort you, virgin daughter Zion? For your fracture is as great as the sea[b]; who can heal you?
translation:
  language: zh_hans
  text: 我能为你作什么见证呢？我能拿什么与你相比呢[a]，耶路撒冷的女子？我能拿什么与你相提并论，好安慰你呢，锡安的童女？因为你的毁坏大如海[b]；谁能医治你呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “为你作什么见证”原文含义较难确定。也可理解为“向你作什么见证”，或较宽泛地译作“能对你说什么”。
    reason: lexical_alternative
  - marker: b
    text: “毁坏”也可译作“创伤”“破碎”或“破口”。原词表示破裂、崩毁或倾覆；这里采用“毁坏”，以表达城邑所受的惨重破坏，并呼应下文的“医治”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: 我能……什么呢？
  rationale: 保留三次反复的疑问语气，表达哀叹者找不到言语、类比或安慰之法；现代汉语中自然且不把疑问改释为单纯的“如何”。
- source_word: אֲעִידֵךְ
  choice: 我能为你作什么见证呢？
  rationale: 保留希伯来语动词可能具有的作证、见证意味，并用“为你”反映后缀前介词所可能带有的受益关系；因原句难解，在脚注保留其他理解。
- source_word: אֲדַמֶּה לָּךְ
  choice: 我能拿什么与你相比呢
  rationale: 采用 דמה 的通常比较义；“拿什么与你相比”符合现代汉语习惯，也保持寻找可比对象的疑问。
- source_word: הַבַּת יְרוּשָׁלִַם
  choice: 耶路撒冷女子
  rationale: 保留城市被人格化为女子的称呼；不加入原文没有的修饰语。
- source_word: אַשְׁוֶה לָּךְ
  choice: 我能拿什么与你相提并论
  rationale: 保留与上一比较动词近义而不完全相同的修辞叠加；“相提并论”在中文中自然，并体现寻找匹配对象之意。
- source_word: וַאֲנַחֲמֵךְ
  choice: 好安慰你呢
  rationale: 把连接词与未完成式理解为目的或结果：若能找到相当的例证，才可能给予安慰；“好”简洁表达这一逻辑。
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: 锡安的处女
  rationale: 保留 בְּתוּלָה 的基本词义及城市人格化意象，不将其淡化为较宽泛的“少女”；“女儿”未重复明译，以避免中文“处女女儿”的生硬重叠。
- source_word: שִׁבְרֵךְ
  choice: 你的破损
  rationale: שבר 可指破裂、创伤、崩毁或毁坏；“破损”兼顾具体破裂与整体受毁的意象，也能与下文“医治”衔接，其语义范围在脚注说明。
- source_word: גָדוֹל כַּיָּם
  choice: 浩大如海
  rationale: 保留海洋所表达的巨大、无边规模；“浩大如海”比逐字的“大如海”更符合庄重自然的中文。
- source_word: מִי יִרְפָּא לָךְ
  choice: 谁能医治你呢？
  rationale: רפא 直译为“医治”；“能”体现反问中对伤势极重、无人足以医治的强调，同时不绝对断定未来无人施治。
theological_decisions: []
translation_notes:
