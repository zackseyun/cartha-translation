  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כָּל֨וּ בַ/דְּמָע֤וֹת עֵינַ/י֙ חֳמַרְמְר֣וּ מֵעַ֔/י נִשְׁפַּ֤ךְ לָ/אָ֨רֶץ֙ כְּבֵדִ֔/י עַל שֶׁ֖בֶר בַּת עַמִּ֑/י בֵּֽ/עָטֵ֤ף עוֹלֵל֙ וְ/יוֹנֵ֔ק בִּ/רְחֹב֖וֹת קִרְיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/011.yaml
  text: My eyes are spent with tears[a]; my inward parts churn; my liver is poured out to the earth because of the destruction of the daughter of my people[d][c][b], because infant and nursing child faint in the streets of the city.
translation:
  language: zh_hans
  text: 我的双眼因泪水而耗尽；我的肺腑翻腾；我的肝倾倒在地[a]，因为我民之女遭到毁灭[b][c]，也因为婴孩和吃奶的孩子昏倒在城中的街道上。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文直译为“我的肝倾倒在地”。古代希伯来诗歌用内脏器官表达深切的情感和生命崩溃。
    reason: cultural_note
  - marker: b
    text: “遭到毁灭”也可译作“破碎”或“崩溃”。
    reason: alternative_reading
  - marker: c
    text: “我民之女”是希伯来诗歌对本族人民或其城邑的拟人称呼。
    reason: cultural_note
  - marker: d
    text: 末句也可理解为：“当婴孩和吃奶的孩子昏倒在城中的街道上时。”希伯来语介词结构容许情景性或时间性的理解。
    reason: alternative_reading
lexical_decisions:
- source_word: כָּלוּ בַדְּמָעוֹת עֵינַי
  choice: 我的双眼因泪水而耗尽
  rationale: “耗尽”表达 כָּלוּ 所含的用尽、衰竭之意；“因泪水”在现代汉语中自然地呈现持续哭泣造成的身体耗损。
- source_word: חֳמַרְמְרוּ מֵעַי
  choice: 我的肺腑翻腾
  rationale: 罕见动词 חֳמַרְמְרוּ 描写强烈的内在搅动；“肺腑翻腾”既保留希伯来诗歌的内脏意象，也能让现代读者理解为深重痛苦。
- source_word: נִשְׁפַּךְ לָאָרֶץ כְּבֵדִי
  choice: 我的肝倾倒在地
  rationale: 保留“肝”这一具体器官及“倾倒在地”的向下意象，不将古代身体情感语言泛化为“心碎”或“悲痛欲绝”。
- source_word: עַל שֶׁבֶר
  choice: 因为……遭到毁灭
  rationale: שֶׁבֶר 本义可指破裂、破碎，在耶路撒冷受灾的语境中也表示毁灭性灾难；正文采用自然明确的“遭到毁灭”，脚注保留“破碎/崩溃”的可能表达。
- source_word: בַּת עַמִּי
  choice: 我民之女
  rationale: 保留希伯来诗歌中将群体或城邑人格化为“女儿”的固定表达，并以脚注说明，避免正文直接消解这一重要意象。
- source_word: בְּעָטֵף
  choice: 因为……昏倒
  rationale: 该形式描写幼儿因匮乏而衰弱、昏厥；“昏倒”具体而自然。介词结构与前文灾难原因或灾难发生时的情景均可相连，正文按因果理解，脚注注明时间性译法。
- source_word: עוֹלֵל וְיוֹנֵק
  choice: 婴孩和吃奶的孩子
  rationale: 分别呈现年幼孩童与仍在哺乳期的孩子，保留两类弱小者并列所强化的悲惨情景。
- source_word: בִּרְחֹבוֹת קִרְיָה
  choice: 在城中的街道上
  rationale: 直接传达城邑公共街道这一场景，语言庄重而自然。
theological_decisions: []
