  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ק֣וּמִי רֹ֣נִּי ב/ליל לְ/רֹאשׁ֙ אַשְׁמֻר֔וֹת שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/019.yaml
  text: Rise[a], cry out in the night, at the beginning of the watches; pour out your heart like water before the face of the Lord. Lift up your hands to him for the lives of your little children, who are faint with hunger at the head of every street.
translation:
  language: zh_hans
  text: 起来，在夜间呼喊；在各夜更开始时，把你的心如水倾倒在主面前。为你幼小儿女的性命，向他举起双手；他们因饥饿昏厥在各个街口[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “各个街口”直译为“所有街道的头端”；此处也可理解为每条街道的入口或街角。
    reason: 说明希伯来语空间表达的字面形式，并保留其在具体地点上的解释余地。
lexical_decisions:
- source_word: ק֣וּמִי
  choice: 起来
  rationale: 阴性单数命令式，呼唤被人格化的锡安女子；“起来”自然、直接，保留紧迫语气。
- source_word: רֹ֣נִּי
  choice: 呼喊
  rationale: רן在哀歌语境中指高声发出哀痛的呼声；“呼喊”避免误解为欢唱，同时不把其意义收窄为某一种哭法。
- source_word: לְ/רֹאשׁ אַשְׁמֻר֔וֹת
  choice: 在每更开始的时候
  rationale: רֹאשׁ表示“开始”，אַשְׁמֻרוֹת是夜间各更次；此译既传达夜更制度，也保留复数所暗示的一更又一更。
- source_word: שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ
  choice: 倾心如水
  rationale: 保留“把心像水一样倾倒”的强烈比喻；“倾心”在现代汉语中自然表达毫无保留地吐露内心。
- source_word: נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י
  choice: 在主面前
  rationale: 准确表达面对主、处于主临在之中的意思；汉语不直译“面容”，以免生硬。
- source_word: שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ
  choice: 向他举起双手
  rationale: כַּפַּיִם为双数，字面涉及双掌；祷告语境中“举起双手”自然并保留动作形象。
- source_word: עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ
  choice: 为了你幼小儿女的性命
  rationale: עַל在此表示代求的对象，נֶפֶשׁ指生命，עוֹלָלִים指年幼孩童；此译保留危及性命的紧迫感。
- source_word: הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב
  choice: 因饥饿昏厥
  rationale: עטף在此描写因饥饿而衰弱、发昏；“昏厥”比笼统的“软弱”更能传达濒危状态。
- source_word: בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת
  choice: 在各个街口
  rationale: 字面为“在所有街道的头端”；现代汉语“各个街口”自然表达街道起点或交会处的公共地点。
theological_decisions:
- issue: אֲדֹנָי的译法
  choice: 主
  alternative: 耶和华；我的主
  rationale: 马所拉文本此处是אֲדֹנָי，并非四字神名יהוה；译作“主”保留神圣称号，又不把它误作上主的专名。
- issue: “倾心如水”中的祷告对象与情感表达
  choice: 保留向主毫无保留倾诉的比喻
  alternative: 解释为悔改认罪或特定礼仪动作
  rationale: 经文本身描写哀恸与代求，却未限定为某一宗派性的祷告形式或只指认罪，因此不作额外神学收窄。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。连续命令句保留先知式的急迫呼吁；以分号区分夜间哀求、向主倾心和为孩童代求三个紧密相连的动作。
