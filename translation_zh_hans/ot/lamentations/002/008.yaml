revisions:
- from: 雅威定意拆毁锡安女子的城墙[a]；他拉出准绳，不收回吞灭的手[b]。他使城垒和城墙哀哭；二者一同衰残。
  to: 雅威定意拆毁锡安女子的城墙[a]；他拉出准绳，没有收手，继续吞灭[b]。他使城垒和城墙哀哭；二者一同衰残。
  rationale: 将不自然且可能误解为“手在吞灭”的“ 不收回吞灭的手”改为“没有收手，继续吞灭”，以现代汉语清楚表达原文“没有收回手而停止吞灭”的意思。脚注b相应调整，使替代译法首先反映原文手的意象与“吞灭”的比喻；其余译文和脚注均可保留。
