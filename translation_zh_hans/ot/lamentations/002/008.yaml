id: LAM.2.8
reference: Lamentations 2:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: חָשַׁ֨ב יְהוָ֤ה לְ/הַשְׁחִית֙ חוֹמַ֣ת בַּת צִיּ֔וֹן נָ֣טָה קָ֔ו לֹא הֵשִׁ֥יב יָד֖/וֹ מִ/בַּלֵּ֑עַ וַ/יַּֽאֲבֶל חֵ֥ל וְ/חוֹמָ֖ה יַחְדָּ֥ו אֻמְלָֽלוּ׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/008.yaml
  text: Yahweh determined to destroy the wall of daughter Zion[a]; he stretched out a measuring line; he did not hold back his hand from swallowing up, and he made rampart and wall mourn[b]; together they languish.
translation:
  language: zh_hans
  text: 雅威定意拆毁锡安女子的城墙[a]；他拉出准绳，没有收手，继续吞灭[b]。他使城垒和城墙哀哭；二者一同衰残。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“锡安之女的城墙”。原文把锡安（即耶路撒冷）人格化为女子。
    reason: 说明希伯来语称谓的结构及其人格化意象。
  - marker: b
    text: 也可译作“他没有收回手，不再吞灭”。原文直译为“不使他的手从吞噬转回”，以吞噬描绘彻底的毁灭。
    reason: 保留原文的生动比喻，同时说明这一惯用表达的含义。
lexical_decisions:
- source_word: חָשַׁב
  choice: 定意
  rationale: 此处表示雅威对审判已有明确、坚定的旨意；“定意”既贴近原文，也符合现代中文的庄重语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: לְהַשְׁחִית
  choice: 拆毁
  rationale: 这里的宾语是城墙；“拆毁”自然表达主动施行的毁坏，也保留审判行动的具体性。
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: 锡安女子的城墙
  rationale: 保留“锡安女子”这一将锡安人格化为女子的诗歌表达，同时清楚呈现所属关系。
- source_word: נָטָה קָו
  choice: 拉出准绳
  rationale: 保留测量绳索的具体意象；在本段语境中，它表现毁灭是经过衡量、按定意施行的，但正文不额外解释该意象。
- source_word: לֹא הֵשִׁיב יָדוֹ מִבַּלֵּעַ
  choice: 不收回吞灭的手
  rationale: “不收回……的手”自然传达没有停止行动；“吞灭”保留 בלע 所含吞噬、席卷的强烈比喻。
- source_word: וַיַּאֲבֶל
  choice: 他使……哀哭
  rationale: 该动词在此为使役形式，主语承接雅威；译文明确表达他使防御工事如人一样哀哭。
- source_word: חֵל
  choice: 城垒
  rationale: 指与主城墙有别的外围防御设施；“城垒”简洁地保留军事建筑含义，并与“城墙”构成诗歌配对。
- source_word: וְחוֹמָה
  choice: 城墙
  rationale: 直接呈现城市的主要墙体，并与“城垒”区分。
- source_word: יַחְדָּו
  choice: 二者一同
  rationale: 明确指出城垒与城墙共同陷入同一状态，同时保留原文的并行结构。
- source_word: אֻמְלָלוּ
  choice: 衰残
  rationale: 该词表示衰弱、凋残；“衰残”简洁庄重，也能延续防御工事被人格化的诗意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用以色列上帝的专名，而非一般称号；“雅威”是按现代学界通常重构读音所作的汉语音译。脚注不把另一种音译说成原文的不同读法。
- issue: 城垒与城墙“哀哭”的人格化
  choice: 保留为“他使城垒和城墙哀哭”
  alternative: 他使城垒和城墙荒废
  rationale: 原文刻意把防御设施写成会哀哭、衰残的主体；保留这种人格化可呈现哀歌的诗性和审判带来的悲痛，不把它化约为单纯的建筑损毁。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“定意”“准绳”“城垒”“衰残”维持哀歌的诗体质感；句法适度简化，但保留原文中神主动施行审判、城防设施被人格化，以及“吞灭”这一强烈意象。所有脚注标记均置于相关正文之后。
