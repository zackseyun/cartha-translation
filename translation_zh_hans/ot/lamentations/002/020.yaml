  text: רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה לְ/מִ֖י עוֹלַ֣לְתָּ כֹּ֑ה אִם תֹּאכַ֨לְנָה נָשִׁ֤ים פִּרְיָ/ם֙ עֹלֲלֵ֣י טִפֻּחִ֔ים אִם יֵהָרֵ֛ג בְּ/מִקְדַּ֥שׁ אֲדֹנָ֖/י כֹּהֵ֥ן וְ/נָבִֽיא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/020.yaml
  text: Look[a], O Yahweh, and see—to whom have you done this? Should women eat their offspring[b], the children they have cared for? Should priest and prophet be killed in the sanctuary of the Lord?
translation:
  language: zh_hans
  text: 耶和华啊，求你察看，留意：你竟这样对待谁呢？妇人岂能吃自己所生、亲手抚育的幼儿[a][b]？祭司和先知岂能在主的圣所中被杀？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“她们的果实”，指自己所生的孩子。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“她们抱在怀中疼爱的幼儿”或“她们悉心养育的幼儿”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: 求你察看，留意
  rationale: 两个祈使动词构成加强语气的哀求；分别译出，以保留希伯来文的并列和迫切感，同时使用自然的现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，并与本节后面的 אֲדֹנָי“主”保持区别。
- source_word: לְמִי עוֹלַלְתָּ כֹּה
  choice: 你竟这样待了谁
  rationale: עוֹלַלְתָּ 在此指严厉地对待；“竟”传达哀歌中震惊、质问的语气，而不额外说明行动的神学含义。
- source_word: אִם ... תֹּאכַלְנָה
  choice: 岂能……吃
  rationale: 此处 אִם 引出惊骇的反问，而非普通条件句；“岂能”自然表达道德震惊。
- source_word: פִּרְיָם
  choice: 自己所生的孩子
  rationale: 字面为“她们的果实”，在此是母腹之果、后代的隐喻。正文采用清楚自然的意义译法，并以脚注保留原文意象。
- source_word: עֹלֲלֵי טִפֻּחִים
  choice: 她们亲手抚育的幼儿
  rationale: עֹלֲלֵי 指幼小的孩子，טִפֻּחִים 表明他们曾被抱弄、精心养育；“亲手抚育”保留亲密照料的意味。
- source_word: אִם יֵהָרֵג
  choice: 岂能……被杀
  rationale: 第二个 אִם 同样引出惊骇的反问；保留被动形式，不擅自补出杀害者。
- source_word: בְּמִקְדַּשׁ אֲדֹנָי
  choice: 在主的圣所中
  rationale: מִקְדָּשׁ 指分别为圣的圣所；אֲדֹנָי 是“主”，与前面的神名 יְהוָה 有意区分。
theological_decisions:
- issue: 同一节中两个不同神称的处理
  choice: 将 יְהוָה 译为“耶和华”，将 אֲדֹנָי 译为“主”
  alternative: 两者都译作“主”或“耶和华”
  rationale: 原文刻意使用不同称谓；分别译出，既忠于文本，也避免抹平其中的差异。
- issue: 灾祸与上帝行动之间的张力
  choice: 直译为“你竟这样待了谁”
  alternative: 弱化为“谁竟遭遇了这样的事”
  rationale: 原文直接把行动归于耶和华。译文保留哀歌对上帝发出的尖锐质问，不以神学解释缓和这种张力。
- issue: 两个 אִם 分句的句法功能
  choice: 译为两个惊骇的反问句
  alternative: 译为条件句“如果……”或将来疑问“会不会……”
  rationale: 上下文表明说话者不是提出条件，而是列举围城惨状，借反问向上帝申诉。
translation_notes:
  register: 采用庄重而现代的哀诉语体。“求你察看，留意”保留双重呼求；“竟”和“岂能”传达震惊与抗议。避免古奥的“视之”“眷顾”，也不使用过度口语化表达。所有脚注标记均置于相关正文之后。
