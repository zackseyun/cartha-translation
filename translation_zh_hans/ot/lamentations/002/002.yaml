id: LAM.2.2
reference: Lamentations 2:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: בִּלַּ֨ע אֲדֹנָ֜/י לא חָמַ֗ל אֵ֚ת כָּל נְא֣וֹת יַעֲקֹ֔ב הָרַ֧ס בְּ/עֶבְרָת֛/וֹ מִבְצְרֵ֥י בַת יְהוּדָ֖ה הִגִּ֣יעַ לָ/אָ֑רֶץ חִלֵּ֥ל מַמְלָכָ֖ה וְ/שָׂרֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/002.yaml
  text: The Lord has swallowed up[a], without pity, all the pastures of Jacob; in his wrath he has torn down the strongholds of daughter Judah; he has brought them down to the ground[c][b]; he has defiled the kingdom and its princes.
translation:
  language: zh_hans
  text: 主吞灭了雅各的一切居所[a]，毫不怜惜；他在烈怒中拆毁了犹大女子民[b]的堡垒，使它们倒在地上；他玷辱了王国和它的首领[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “居所”所译的希伯来词也可指“牧场”或宜于居住、牧放的地方。
    reason: lexical_alternative
  - marker: b
    text: “犹大女子民”直译为“女儿犹大”，是诗歌中将犹大人格化为女子的称呼。
    reason: cultural_note
  - marker: c
    text: “玷辱”也可译为“亵渎”或“使……蒙羞”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: 吞灭了
  rationale: 保留“吞下、吞噬”的强烈意象，同时“吞灭”在现代汉语中能自然表达彻底毁灭。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文是神的称号 Adonai，并非四字神名；译作“主”可准确区分。
- source_word: לֹא חָמַל
  choice: 毫不怜惜
  rationale: 兼顾“不怜悯”与“不留情、不宽惜”的含义，语气简洁有力。
- source_word: נְאוֹת יַעֲקֹב
  choice: 雅各的一切居所
  rationale: 本节语境涉及堡垒和国度，“居所”较自然地指雅各各处的住地；该词也可指牧场，故以脚注保留歧义。
- source_word: הָרַס
  choice: 拆毁了
  rationale: 准确表达拆除、摧毁建筑或防御工事的动作，比泛称“毁灭”更具体。
- source_word: בְּעֶבְרָתוֹ
  choice: 在烈怒中
  rationale: עֶבְרָה 表示强烈愤怒；“烈怒”庄重而通俗。
- source_word: מִבְצְרֵי
  choice: 堡垒
  rationale: 明确保留设防地点的军事含义。
- source_word: בַת יְהוּדָה
  choice: 犹大女子
  rationale: 保留希伯来诗歌将犹大人格化为女子的表达，不直接解释为城市或居民。
- source_word: הִגִּיעַ לָאָרֶץ
  choice: 使它们倒在地上
  rationale: 使役形式表示使前述堡垒落到地面；补出“它们”以符合现代汉语句法。
- source_word: חִלֵּל
  choice: 亵渎了
  rationale: 保留 חלל 强调使神圣者失去尊荣、遭到污损的语义，不将其弱化为一般的毁坏。
- source_word: מַמְלָכָה
  choice: 国度
  rationale: 在与首领并列的政治语境中，指王国或国家整体；“国度”兼具诗歌庄重感。
- source_word: וְשָׂרֶיהָ
  choice: 和其中的首领
  rationale: שׂרים 可指王公、统治者或官长；“首领”不强加具体爵位，并使代词所指清楚。
theological_decisions:
- issue: 神的称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 主宰
  rationale: 原文使用 Adonai，而非 YHWH；因此按称号翻译为“主”，不采用表示四字神名的特殊形式。
- issue: חִלֵּל 用于国度及首领时的语义
  choice: 亵渎了
  alternative: 使……蒙羞／辱没了
  rationale: 选择“亵渎”以保留原词可能含有的神圣—世俗张力，不把它仅仅解释成政治羞辱；脚注提供较宽泛的语义可能。
translation_notes:
  register: 采用现代、庄重而可朗读的哀歌体。分号呈现原文连续的毁灭动作；保留“吞灭”“犹大女子”“亵渎”等鲜明或带张力的意象，并用脚注说明真正存在的词义歧义。
