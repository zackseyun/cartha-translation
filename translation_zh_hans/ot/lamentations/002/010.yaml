  text: יֵשְׁב֨וּ לָ/אָ֤רֶץ יִדְּמוּ֙ זִקְנֵ֣י בַת צִיּ֔וֹן הֶֽעֱל֤וּ עָפָר֙ עַל רֹאשָׁ֔/ם חָגְר֖וּ שַׂקִּ֑ים הוֹרִ֤ידוּ לָ/אָ֨רֶץ֙ רֹאשָׁ֔/ן בְּתוּלֹ֖ת יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/010.yaml
  text: The elders of daughter Zion sit on the ground in silence[a]; they have thrown dust on their heads and put on sackcloth[b]; the virgins of Jerusalem have bowed their heads to the ground.
translation:
  language: zh_hans
  text: 锡安女儿[b]的长老坐在地上，默不作声；他们把尘土撒在头上，身披麻衣；耶路撒冷的少女[a]低头至地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用的词特指童贞或未婚的年轻女子；这里把她们作为共同哀悼的一个群体。也可译作“耶路撒冷的未婚少女”。
    reason: lexical_alternative
  - marker: b
    text: “锡安女儿”是把锡安或耶路撒冷人格化的诗歌称谓；这里依照原文保留，没有改写成“锡安城”。
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ לָאָרֶץ
  choice: 坐在地上
  rationale: ישׁב在此表示具体的坐姿，לָאָרֶץ结合上下文指地面；译文保留哀悼者席地而坐的画面。
- source_word: יִדְּמוּ
  choice: 默不作声
  rationale: דמם在本节表达悲痛中的沉默、静默；“默不作声”是自然庄重的现代汉语。
- source_word: זִקְנֵי
  choice: 长老
  rationale: 该词兼有年长者和群体中有地位者的含义；“长老”保留这两方面，不单纯解释为老人或领袖。
- source_word: בַת צִיּוֹן
  choice: 锡安女儿
  rationale: 保留希伯来诗歌将锡安人格化为女儿的称谓，不将其平直改写为“锡安城”或“锡安居民”。
- source_word: הֶעֱלוּ עָפָר עַל רֹאשָׁם
  choice: 把尘土撒在头上
  rationale: 按哀悼习俗所表达的实际动作翻译；“撒在头上”在现代汉语中清楚自然。
- source_word: חָגְרוּ שַׂקִּים
  choice: 身披麻衣
  rationale: 原文直指用粗麻布束身的哀悼举动；“身披麻衣”既保留服丧意象，也符合庄重的汉语表达。
- source_word: הוֹרִידוּ לָאָרֶץ רֹאשָׁן
  choice: 低头至地
  rationale: 保留“使头降到地面”的具体身体姿态，不额外说明其象征意义。
- source_word: בְּתוּלֹת יְרוּשָׁלִָם
  choice: 耶路撒冷的少女
  rationale: בְּתוּלוֹת具体指童贞或未婚的年轻女子；正文用自然的群体称呼“少女”，并以脚注说明原词更具体的语义。
theological_decisions:
- issue: “锡安女儿”的人格化表达
  choice: 保留“锡安女儿”
  alternative: 锡安城／锡安的居民
  rationale: 这是先知诗歌中的人格化称谓，也是本章神学与文学张力的一部分；不应在正文中消解。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。分号对应原文连续展开的三个哀悼画面；“坐在地上”“尘土撒在头上”“身披麻衣”“低头至地”共同保留具体的身体动作与哀悼意象。
