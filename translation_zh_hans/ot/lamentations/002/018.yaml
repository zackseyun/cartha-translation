base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/018.yaml
  text: 'Their heart cried out to the Lord[a], O wall of daughter Zion: let tears run down like a stream day and night; give yourself no relief[c][b]; let not the apple of your eye rest.'
translation:
  language: zh_hans
  text: 他们的心向主哀呼；锡安之女的城墙啊，让泪水如溪流般昼夜流下；不要让自己稍得喘息；不要让你眼中的瞳人停歇。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你眼中的瞳人”原文直译为“你眼睛的女儿”，是指瞳人或眼睛的习语；这里意指不要停止流泪。
    reason: lexical_alternative
lexical_decisions:
- source_word: צָעַק לִבָּם
  choice: 他们的心……呼喊
  rationale: 保留希伯来文“心”的单数集合表达，描绘众人同心发出的强烈呼求；“呼喊”体现动词的力度。
- source_word: אֶל אֲדֹנָי
  choice: 向主
  rationale: אֲדֹנָי 在此是对以色列之神的称谓；“主”自然、庄重，且不增添原文没有明示的第一人称领属意味。
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: 锡安之女的城墙啊
  rationale: 按呼格理解，保留“城墙”和“锡安之女”的拟人意象，不将其解释性改写为全城或居民。
- source_word: הוֹרִידִי כַנַּחַל דִּמְעָה
  choice: 要使眼泪如溪流般……流淌
  rationale: 使役命令式直译为“要使”，同时以自然汉语表达泪水不断向下流；נַחַל 可指溪流、河谷中的急流，此处正文取较宽泛的“溪流”。
- source_word: יוֹמָם וָלַיְלָה
  choice: 昼夜
  rationale: 简洁表达持续不断的时间范围。
- source_word: אַל תִּתְּנִי פוּגַת לָךְ
  choice: 不要让自己稍得喘息
  rationale: פּוּגָה 指暂停、缓息或舒缓；“稍得喘息”保留不让哀哭片刻中断的语义，不误解为睡眠。
- source_word: אַל תִּדֹּם בַּת עֵינֵךְ
  choice: 不要让你的眼眸停歇
  rationale: בַּת עַיִן 字面为“眼睛的女儿”，是指眼珠或眼睛的习语；“眼眸”在现代汉语中自然且保留诗意，“停歇”表达流泪不可止息。
theological_decisions:
- issue: 神圣称谓 אֲדֹנָי 的译法
  choice: 主
  alternative: 我主
  rationale: 上下文明确指以色列的神；马所拉读音为 אֲדֹנָי，但原文在此不要求译出第一人称领属，“主”既保留神圣称谓，也避免添加语义。
translation_notes:
  register: 采用现代、庄重而可朗读的哀歌体。“锡安之女的城墙啊”保留突兀而有张力的拟人呼告；不擅自判定开头“他们”具体指谁。标点将首句独立，以承认希伯来文中从复数领属的“他们的心”转向阴性单数呼语和命令的转换。
