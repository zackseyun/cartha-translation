base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/012.yaml
  text: They say to their mothers[a], “Where are grain and wine?” as they faint like the wounded in the streets of the city[c][b], as their life is poured out into their mothers’ bosom.
translation:
  language: zh_hans
  text: '他们对自己的母亲说：


    “粮食和酒在哪里？”


    他们在城中的街道上昏厥，

    如同被杀的人[a]；


    他们的生命倾泻到

    母亲的怀中[b]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“如同受重伤的人”。希伯来语 חָלָל 可指被杀、被刺或受致命伤的人；这里把孩子们的倒下描绘得如同战场上的伤亡者。
    reason: lexical_alternative
  - marker: b
    text: “生命”：希伯来语为 נֶפֶשׁ，常译“灵魂”，这里指逐渐流逝的生命。“怀中”也可译作“胸前”或“膝上”；希伯来语保留了亲密而悲痛的母子画面。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִמֹּתָם
  choice: 对母亲
  rationale: 介词 לְ 表示说话的对象；复数名词带第三人称复数后缀。中文用“对母亲”已能自然表达各自向母亲呼求，避免生硬的“对他们的母亲”。
- source_word: יֹאמְרוּ
  choice: 说
  rationale: 未完成式在此描绘哀歌中的鲜活场景；中文不必标明将来时，用“说”简洁自然。
- source_word: אַיֵּה דָּגָן וָיָיִן
  choice: 粮食和酒在哪里
  rationale: דָּגָן 指谷物或粮食出产；在饥荒语境中译为“粮食”比“谷物”更自然，同时保留与“酒”并列的具体生活物资。
- source_word: בְּהִתְעַטְּפָם
  choice: 他们……昏厥
  rationale: עטף 的 Hitpael 形式在此表示因饥饿衰弱、昏厥；“昏厥”清楚呈现孩子正在倒下的状态。
- source_word: כֶּחָלָל
  choice: 如同被杀的人
  rationale: חָלָל 可指被杀、被刺或受致命伤的人。此处“被杀的人”保留战场死亡意象；正文中的比喻并不断言孩子此刻已经死亡。
- source_word: בִּרְחֹבוֹת עִיר
  choice: 在城中的街道上
  rationale: רְחֹבוֹת 可指宽阔街道或广场；“街道”在现代中文中自然，也保留公开场所的惨状。
- source_word: בְּהִשְׁתַּפֵּךְ נַפְשָׁם
  choice: 他们的生命倾泻而尽
  rationale: נֶפֶשׁ 在此指生命；保留“倾泻”的原文隐喻，并以“而尽”表明生命正在流逝。
- source_word: אֶל חֵיק אִמֹּתָם
  choice: 倒在母亲的怀中
  rationale: חֵיק 可指胸怀或膝上。“怀中”保留亲密的母子图景；补出“倒在”使中文句法连贯，并表达生命倾泻所趋向的位置。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。以分行呈现诗歌意象；“昏厥”“倾泻而尽”兼顾清晰度与哀歌的力度。正文保留 חָלָל 在死亡与致命重伤之间的张力，并在脚注列出另一译法。
