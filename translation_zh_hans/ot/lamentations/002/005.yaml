  text: הָיָ֨ה אֲדֹנָ֤/י כְּ/אוֹיֵב֙ בִּלַּ֣ע יִשְׂרָאֵ֔ל בִּלַּע֙ כָּל אַרְמְנוֹתֶ֔י/הָ שִׁחֵ֖ת מִבְצָרָ֑י/ו וַ/יֶּ֨רֶב֙ בְּ/בַת יְהוּדָ֔ה תַּאֲנִיָּ֖ה וַ/אֲנִיָּֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/005.yaml
  text: The Lord became like an enemy; he swallowed up Israel. He swallowed up all her palaces; he destroyed his strongholds[a], and he multiplied mourning and lamentation in Daughter Judah.
translation:
  language: zh_hans
  text: 主变得如同仇敌；他吞灭了以色列，吞灭了她所有的宫殿，毁坏了他的堡垒[a]；他使犹大女子的哀恸和悲叹增多。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文作“他的堡垒”。有些译本为与前面的“她所有的宫殿”一致而译作“她的堡垒”，但马所拉文本这里使用阳性单数后缀。
    reason: textual_variant
lexical_decisions:
- source_word: אֲדֹנָי
  choice: 主
  rationale: 这是指上帝主权身份的称号；“主”是现代汉语圣经语体中自然、庄重且通行的译法。
- source_word: הָיָה ... כְּאוֹיֵב
  choice: 变得如同仇敌
  rationale: 保留比较词כ所表达的“如同”，不把比喻改成身份断言；“变得”也传达哀歌语境中关系姿态的转变。
- source_word: בִּלַּע
  choice: 吞灭
  rationale: 既保留“吞下”的鲜明意象，又自然表达彻底毁灭的含义；原文重复两次，译文也照样重复。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 采用现代汉语中通行的专名译法。
- source_word: כָּל אַרְמְנוֹתֶיהָ
  choice: 她所有的宫殿
  rationale: אַרְמוֹן可指宫殿或设防的宫堡；此处译作“宫殿”，并以“她”保留指向被人格化之城邦的阴性后缀。
- source_word: שִׁחֵת
  choice: 毁坏
  rationale: 准确表达使防御设施遭到破坏、败坏的动作，语气有力而不过度扩展。
- source_word: מִבְצָרָיו
  choice: 他的堡垒
  rationale: מִבְצָר指设防之地或堡垒；马所拉文本的后缀为阳性单数，故正文保留“他的”，不擅自顺改为“她的”。
- source_word: וַיֶּרֶב
  choice: 他使……增多
  rationale: 明确表达使役形式的因果含义，即主使哀恸与悲叹增加。
- source_word: בְּבַת יְהוּדָה
  choice: 在犹大女子中
  rationale: “犹大女子”保留בַת־יְהוּדָה对犹大群体或城邑的诗性人格化，而不平化为单纯的“犹大”。
- source_word: תַּאֲנִיָּה וַאֲנִיָּה
  choice: 哀恸和悲叹
  rationale: 用两个近义名词保留原文加强悲伤程度的并列结构，同时符合现代庄重汉语。
theological_decisions:
- issue: 应把主与仇敌的关系译为身份等同，还是明确的比较
  choice: 主变得如同仇敌
  alternative: 主成了仇敌／主如同仇敌
  rationale: 原文有比较词כ，必须保留“如同”，以免把审判中的行动姿态解释为本质身份；“变得”则保留叙事中状态转变的可能意味。
- issue: 宫殿与堡垒的代词性别是否应统一
  choice: 她所有的宫殿……他的堡垒
  alternative: 她所有的宫殿……她的堡垒
  rationale: 原文先用阴性单数后缀，随后使用阳性单数后缀。正文保留这一突变，并以脚注说明，避免替原文消除可能来自人格化对象或集合名词变化的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留“吞灭”的诗性意象、“犹大女子”的人格化表达及原文代词性别的突变；标点划分两个相连的毁灭动作与其造成的哀恸后果。
