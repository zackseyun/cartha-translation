base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/021.yaml
  text: Young and old lie on the ground in the streets[a]; my virgins and my young men have fallen by the sword. You killed them in the day of your anger[b]; you slaughtered without pity.
translation:
  language: zh_hans
  text: 年轻人和老人躺在街上；我的处女[a]和我的青年人都倒在刀下。你在发怒的日子杀了他们；你屠戮了他们，毫不怜惜[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“我的少女”；希伯来语此词更直译为“我的处女”。
    reason: lexical_alternative
  - marker: b
    text: 或译“你没有顾惜”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְבוּ לָאָרֶץ חוּצוֹת
  choice: 躺卧在街头
  rationale: 完成式在哀歌的鲜明场景中描写倒地者当前的状态；“躺卧”保留具体形象，“街头”自然表达城中的公共街道或空旷处。
- source_word: נַעַר וְזָקֵן
  choice: 少年人和老年人
  rationale: 这对词概括各年龄层；保留两端并列的修辞，同时采用现代汉语可懂的表达。
- source_word: בְּתוּלֹתַי
  choice: 我的处女
  rationale: 保留该词通常所含的未婚、童贞语义，也保留第一人称所属关系，反映锡安以人格化口吻谈论自己的人民。
- source_word: וּבַחוּרַי
  choice: 我的青年男子
  rationale: 指正值壮年的年轻男性；“青年男子”清楚而不误解为“被拣选的人”。
- source_word: נָפְלוּ בֶחָרֶב
  choice: 倒在刀下
  rationale: 保留希伯来语以刀剑指暴力死亡的惯用形象，不扩译为较具体的“战死”。
- source_word: הָרַגְתָּ
  choice: 你……杀了他们
  rationale: 保留第二人称直接指向上帝；宾语“他们”由上文补出，使现代汉语顺畅。
- source_word: בְּיוֹם אַפֶּךָ
  choice: 在你发怒的日子
  rationale: אַף在此表示怒气；这一译法兼顾现代可懂性与“日子”的先知性、审判性表达。
- source_word: טָבַחְתָּ
  choice: 你屠戮他们
  rationale: 该动词比一般的“杀”更强烈；“屠戮”保留原文刻意重复并加重暴力程度的效果。
- source_word: לֹא חָמָלְתָּ
  choice: 毫不怜惜
  rationale: 简洁表达没有怜悯、没有顾惜或宽免的意思，同时保留句末的强烈谴责语气。
theological_decisions:
- issue: 将耶路撒冷遭屠杀直接归于上帝
  choice: 保留对上帝的第二人称直述：“你……杀了他们；你屠戮他们”
  alternative: 改用被动句或非人格化表达，淡化上帝作为行动者
  rationale: 希伯来文本在哀诉中直接称上帝为行动主体；译文不缓和或解释这一神学张力。
translation_notes:
  register: 采用现代、庄重而清晰的哀歌语体。“躺卧”“倒在刀下”保留诗歌的具体画面；“杀了”与“屠戮”体现原文两个动词递进的力度。脚注标记紧随其所说明的词句。
