id: LAM.2.6
reference: Lamentations 2:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּחְמֹ֤ס כַּ/גַּן֙ שֻׂכּ֔/וֹ שִׁחֵ֖ת מוֹעֲד֑/וֹ שִׁכַּ֨ח יְהוָ֤ה בְּ/צִיּוֹן֙ מוֹעֵ֣ד וְ/שַׁבָּ֔ת וַ/יִּנְאַ֥ץ בְּ/זַֽעַם אַפּ֖/וֹ מֶ֥לֶךְ וְ/כֹהֵֽן׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/006.yaml
  text: He has laid waste his shelter like a garden[a]; he has destroyed his appointed meeting place. Yahweh has caused appointed feast and Sabbath to be forgotten in Zion[c][b], and in the indignation of his anger he has spurned king and priest.
translation:
  language: zh_hans
  text: 他毁坏自己的棚子[a]，如同毁坏园子一般；他毁坏他指定的聚会之处[b]。雅威使锡安忘却节期[c]和安息日；他在盛怒之下厌弃君王和祭司。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “棚子”也可译作“遮蔽处”或“帐棚”。希伯来语词可指棚子或遮蔽物；这里确切的诗歌意象仍有争议。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他指定的聚会地点”；另有理解为“他的会幕”。这里的希伯来语词与下文译作“节期”的词相同。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“指定的时间”或“节日”。这里与“安息日”并列，很可能是指规定的节庆日期。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹס
  choice: 摧残
  rationale: 该动词在此表达带有暴力意味的毁坏；“摧残”既保留其强烈语气，也与本节描写锡安圣所和制度遭破坏的语境相合。
- source_word: כַּגַּן
  choice: 像摧残园子一样
  rationale: 保留希伯来文明确的园子比喻。为使现代汉语通顺，补出比较结构中的动词，但不解释这一含混意象的具体所指。
- source_word: שֻׂכּוֹ
  choice: 自己的棚子
  rationale: 该词可指棚子、遮蔽处或帐棚。“棚子”保留具体而脆弱的诗歌意象，又避免直接采用可能带有后期专门含义的“帐幕”。
- source_word: שִׁחֵת
  choice: 毁坏
  rationale: 在审判与实体破坏的语境中，“毁坏”准确而自然。
- source_word: מוֹעֲדוֹ
  choice: 他指定的聚会之处
  rationale: מוֹעֵד既可指指定的时间，也可指指定的聚会地点。此处作“毁坏”的宾语，采用空间意义最合语境，同时借“指定”保留它与下文“节期”的词源联系。
- source_word: שִׁכַּח
  choice: 使……被人遗忘
  rationale: 保留使役意义；“被人遗忘”在汉语中自然表达节期和安息日不再被记念、遵守。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: בְּצִיּוֹן
  choice: 在锡安
  rationale: 按其地点意义直接翻译。
- source_word: מוֹעֵד
  choice: 节期
  rationale: 此词与“安息日”并列时，主要指规定的宗教节期；“节期”简洁并保留礼仪时间的含义。
- source_word: וְשַׁבָּת
  choice: 和安息日
  rationale: 采用现代中文圣经语境中清楚、通行的名称。
- source_word: וַיִּנְאַץ
  choice: 厌弃
  rationale: 该动词兼有蔑视和拒绝之意；“厌弃”可简洁表达带轻蔑意味的弃绝。
- source_word: בְּזַעַם אַפּוֹ
  choice: 在烈怒中
  rationale: 希伯来文以两个愤怒相关词语叠加强调。“烈怒”在自然汉语中浓缩并保留这种强化语气。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；以“主”代替神名
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，也避免以称号替换原文。
- issue: 首个מוֹעֵד（מוֹעֲדוֹ）的意义
  choice: 空间意义：“他指定的聚会之处”
  alternative: 时间意义：“他指定的时间／节期”；礼仪专称：“会幕”
  rationale: 该词在这里作“毁坏”的宾语，而下一分句又把同一词与安息日并列，明显采用节期意义。因此首处采用地点义较合适，同时以脚注保留其他可能。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。前半句保留原文“园子”比喻的突兀感，不擅自说明棚子为何像园子；后半句用“烈怒”自然传达希伯来语的强化表达。三个脚注标记均置于正文相应词语之后。
