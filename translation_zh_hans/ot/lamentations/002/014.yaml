revisions:
- from: 你的先知为你所见的，尽是虚假和荒谬；他们没有揭露你的罪孽，使你的境况复原[a]；反倒为你看见虚假的默示[b]和使人迷失的幻象。
  to: 你的先知为你所见的异象，尽是虚假和荒谬；他们没有揭露你的罪孽，好使你的境况复原[a]；反倒为你看见虚假的神谕[b]和使人迷失的幻象。
  rationale: 将“默示”改为“神谕”，避免把可属虚假的先知宣告误解为神的默示；调整首句语序，并补出由“看见”所隐含的“异象”，使汉语自然且保留原文先知性视觉意象。“好使”明确原文不定式的目的关系，未将隐含的反事实机制扩写。脚注锚点及内容均予保留。
