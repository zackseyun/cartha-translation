reference: Lamentations 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: נְבִיאַ֗יִ/ךְ חָ֤זוּ לָ/ךְ֙ שָׁ֣וְא וְ/תָפֵ֔ל וְ/לֹֽא גִלּ֥וּ עַל עֲוֺנֵ֖/ךְ לְ/הָשִׁ֣יב שבית/ך וַ/יֶּ֣חֱזוּ לָ֔/ךְ מַשְׂא֥וֹת שָׁ֖וְא וּ/מַדּוּחִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/014.yaml
  text: Your prophets saw for you falsehood and folly[a], and they did not uncover your iniquity to restore your fortunes; instead[b], they saw for you false oracles and delusions.
translation:
  language: zh_hans
  text: 你的先知为你所见的异象，尽是虚假和荒谬；他们没有揭露你的罪孽，好使你的境况复原[a]；反倒为你看见虚假的神谕[b]和使人迷失的幻象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使你脱离被掳”，或“使你被掳的人归回”。这个希伯来语惯用语常指一个民族从灾祸或流亡中得到恢复。
    reason: alternative_reading
  - marker: b
    text: 或译：“重担”。这是该先知术语的传统译法。
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאַיִךְ
  choice: 你的先知
  rationale: 复数名词带第二人称阴性单数后缀，所指是属于或向锡安女子说话的先知；现代汉语自然译作“你的先知”。
- source_word: חָזוּ / וַיֶּחֱזוּ
  choice: 所见的／看见
  rationale: חזה在先知语境中指异象性的“看见”。保留“看见”的意象，同时用“所见的”使首句符合自然汉语。
- source_word: לָךְ
  choice: 为你
  rationale: 介词可表达关联或受益，指先知为耶路撒冷、关于耶路撒冷所见；“为你”保留这种修辞关系。
- source_word: שָׁוְא וְתָפֵל
  choice: 虚假和荒谬
  rationale: שָׁוְא表示虚妄、虚假；罕见词תָפֵל本义可指淡而无味，转义为荒唐、无价值。“虚假和荒谬”在现代汉语中清楚传达两词并列的谴责。
- source_word: גִלּוּ עַל עֲוֺנֵךְ
  choice: 揭露你的罪孽
  rationale: 该表达指揭开、暴露过犯。“揭露”体现גלה的具体比喻，“罪孽”保留עָוֹן的道德分量。
- source_word: לְהָשִׁיב שְׁבִיתֵךְ
  choice: 使你的境况复原
  rationale: שׁוב שׁבית/שׁבות是恢复性惯用语，既可具体涉及被掳者或被掳状态，也可泛指从灾祸中恢复。正文采用自然而宽广的表达，较直译见脚注。
- source_word: מַשְׂאוֹת
  choice: 默示
  rationale: מַשָּׂא在先知语境中可指宣告或神谕，字面义为“重担”。“默示”能让现代读者识别其先知言论性质，同时脚注保留传统字面译法。
- source_word: מַדּוּחִים
  choice: 使人迷失的幻象
  rationale: 该词源于“驱赶、使偏离”的词根，表示使人受骗而走偏的事物。结合先知“看见”的语境译作“使人迷失的幻象”，既交代语境，也保留其误导作用。
theological_decisions:
- issue: לְהָשִׁיב שְׁבִיתֵךְ所指的恢复范围
  choice: 使你的境况复原
  alternative: 使你脱离被掳／使你被掳的人归回
  rationale: 此惯用语既可能直接涉及被掳，也常泛指扭转灾祸、恢复景况。正文不把语义限定于某一种具体机制，脚注保留较字面的被掳读法。
- issue: מַשְׂאוֹת的先知术语含义
  choice: 默示
  alternative: 重担
  rationale: “重担”反映字面义和传统译法，但现代读者不易由此明白是先知宣告；“默示”更清楚地传达语境，脚注保留另一读法。
- issue: 先知未揭露罪孽与复原之间的关系
  choice: 他们没有揭露你的罪孽，使你的境况复原
  alternative: 他们若揭露你的罪孽，本可使你的境况复原
  rationale: 保留原文目的结构，不把其中隐含的反事实关系扩写为明说，也不进一步界定悔改与复原的机制。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。以分号呈现原句的控诉和转折；“反倒”明确表达上下文中的对比。脚注标记均放在其所解释的词语之后。
