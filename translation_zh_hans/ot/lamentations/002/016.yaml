  naturalness: 整体庄重自然，但“他们发出嘘声，咬牙切齿”比“他们嗤笑，咬牙切齿”更贴近意象且仍符合现代汉语。“我们找到了，也看见了”保留原文简洁、递进的平行句式。
  terminology: “张开大口”“咬牙切齿”“吞灭”均能恰当传达诗歌性敌意与毁灭意象。保留“锡安”作为脚注中的上下文指称，不把未明说的宾语当作语法明示的人称。
