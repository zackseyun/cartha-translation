  text: פָּצ֨וּ עָלַ֤יִ/ךְ פִּי/הֶם֙ כָּל א֣וֹיְבַ֔יִ/ךְ שָֽׁרְקוּ֙ וַ/יַּֽחַרְקוּ שֵׁ֔ן אָמְר֖וּ בִּלָּ֑עְנוּ אַ֣ךְ זֶ֥ה הַ/יּ֛וֹם שֶׁ/קִּוִּינֻ֖/הוּ מָצָ֥אנוּ רָאִֽינוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/016.yaml
  text: All your enemies open their mouths against you[a]; they hiss and gnash their teeth. They say, “We have swallowed you up! Surely this is the day we hoped for; we have found it[b], we have seen it.”
translation:
  language: zh_hans
  text: 你的仇敌都向你张开大口；他们发出嘘声，咬牙切齿，说：“我们吞灭她了！[a] 这正是我们所盼望的日子；我们找到了，也看见了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“我们吞灭了”，没有明说吞灭的对象。这里按上下文补出“她”，指被人格化的锡安；也可按前文的直接称呼理解为“我们吞灭你了”。
    reason: 原文宾语省略，中文补足以求通顺，同时保留上下文容许的人称指向。
lexical_decisions:
- source_word: פָּצוּ ... פִּיהֶם
  choice: 大张其口
  rationale: 保留“张开嘴”的具体意象，并以现代中文可懂的表达呈现敌人公然嘲弄、攻击的姿态。
- source_word: עָלַיִךְ
  choice: 向你
  rationale: 介词在这里表示敌意所针对的对象；“向你”既贴近原文，也让上下文显明其敌对意味。
- source_word: שָׁרְקוּ
  choice: 嗤笑
  rationale: 该动词可指吹哨或发嘘声；此处是敌人讥诮锡安的举动。“嗤笑”自然传达其功能，避免“吹口哨”在现代中文中产生欣赏或召唤的误解。
- source_word: וַיַּחַרְקוּ שֵׁן
  choice: 咬牙切齿
  rationale: 采用现代中文的固定表达，准确传达原文磨牙、咬牙所表现的恶意和愤恨。
- source_word: בִּלָּעְנוּ
  choice: 我们吞灭她了
  rationale: 保留“吞下、吞没”的毁灭性比喻。原文没有明说宾语，中文为行文完整补出“她”，指被人格化的锡安；以脚注说明这一补足。
- source_word: אַךְ זֶה הַיּוֹם
  choice: 这正是……的日子
  rationale: “正是”表达 אַךְ 在此处的强调语气，也保留敌人得意确认的口吻。
- source_word: שֶׁקִּוִּינֻהוּ
  choice: 我们一直盼望的
  rationale: קוה 可兼有等候与期待之意；敌人的话中带着恶意的期待，因此“盼望”最为合适，“一直”自然表达持续期待。
- source_word: מָצָאנוּ רָאִינוּ
  choice: 我们终于等到了，也亲眼看见了
  rationale: 原文直译为“我们找到了，我们看见了”，所指承接前面的“这一天”。中文以“等到了”表达他们终于遇到所期待之日，以“亲眼看见”保留末句的递进和胜利叫嚣。
theological_decisions:
- issue: בִּלָּעְנוּ 未明说宾语，而上下文以第二人称称呼锡安
  choice: 正文补作“她”，并用脚注说明原文省略宾语
  alternative: “我们吞灭你了”或不补宾语
  rationale: 全章常把锡安人格化为女性；敌人的引语可由对锡安说话转为谈论她。然而希伯来文自身没有宾语后缀，不能据此断定“她”或“你”，故以脚注保留语法上的开放性，不把人称转换提升为神学结论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“大张其口”“咬牙切齿”保留诗歌的强烈形象；敌人的引语使用简洁、有力的短句，呈现其嘲弄和得意。
