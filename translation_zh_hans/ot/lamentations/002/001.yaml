  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אֵיכָה֩ יָעִ֨יב בְּ/אַפּ֤/וֹ אֲדֹנָ/י֙ אֶת בַּת צִיּ֔וֹן הִשְׁלִ֤יךְ מִ/שָּׁמַ֨יִם֙ אֶ֔רֶץ תִּפְאֶ֖רֶת יִשְׂרָאֵ֑ל וְ/לֹא זָכַ֥ר הֲדֹם רַגְלָ֖י/ו בְּ/י֥וֹם אַפּֽ/וֹ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/001.yaml
  text: How the Lord in his anger has clouded over daughter Zion! He has cast from heaven to earth the beauty of Israel[c][b][a], and he did not remember his footstool in the day of his anger.
translation:
  language: zh_hans
  text: 主竟在怒气中以阴云笼罩锡安的女儿[a]！他将以色列的华美[b]从天上抛到地上；在他发怒的日子，他没有记念自己的脚凳[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使锡安的女儿昏暗”或“以云遮蔽锡安的女儿”。希伯来语动词带有云层遮蔽、使之黯淡的意象。
    reason: lexical_alternative
  - marker: b
    text: “华美”也可译作“荣美”、“荣耀”或“光彩”。
    reason: lexical_alternative
  - marker: c
    text: “自己的脚凳”可能指锡安、圣殿，或与神在地上临在相关、被视为宝座脚凳的约柜。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיכָה
  choice: 竟
  rationale: 此处引出哀歌式的惊叹，并非真正询问“如何”。汉语用“竟”自然表达震惊、悲叹的语气，同时避免添加原文没有的独立感叹词。
- source_word: יָעִיב
  choice: 以阴云笼罩
  rationale: 该动词在此唤起云层遮蔽、使之昏暗的意象；译文保留“云”的图像，也不采用较具解释性的“视为仇敌”。
- source_word: בְּאַפּוֹ
  choice: 在怒气中
  rationale: אַף字面与鼻孔有关，在本语境中是“怒气、忿怒”的惯用义；“在怒气中”清楚并保留原文结构。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 作为神的称号，译为现代汉语惯用而庄重的“主”。
- source_word: בַּת צִיּוֹן
  choice: 锡安女子
  rationale: 保留希伯来语对锡安城及其居民的女性人格化表达；“锡安女子”比展开为“锡安的女儿”更紧凑，也较少使人误解为某一个具体女儿。
- source_word: הִשְׁלִיךְ
  choice: 抛到
  rationale: 表达用力投下的动作，并与“从天上……到地上”的巨大落差相配。
- source_word: מִשָּׁמַיִם אֶרֶץ
  choice: 从天上……到地上
  rationale: 直接保留由尊荣高处降至卑下之地的空间对照和诗歌张力。
- source_word: תִּפְאֶרֶת יִשְׂרָאֵל
  choice: 以色列的华美
  rationale: תִּפְאֶרֶת可指美丽、荣美、荣耀或光彩。“华美”保留诗意和所指对象的开放性，不限定为圣殿、耶路撒冷或某种抽象荣耀。
- source_word: וְלֹא זָכַר
  choice: 没有记念
  rationale: 直接对应זכר，并保留这个词可能具有的关系性和盟约性回响；不改译为较具解释性的“毫不顾惜”。
- source_word: הֲדֹם רַגְלָיו
  choice: 自己的脚凳
  rationale: 保留原文关于神之脚凳的隐喻，不在正文中指定其究竟是锡安、圣殿还是约柜。
- source_word: בְּיוֹם אַפּוֹ
  choice: 在他发怒的日子
  rationale: 保留时间短语以及本节首尾反复出现的怒气主题，语言自然且庄重。
theological_decisions:
- issue: “自己的脚凳”具体指什么
  choice: 正文保留“自己的脚凳”这一隐喻，不确定具体所指
  alternative: 直接译作“圣殿”、“锡安／耶路撒冷”或“约柜”
  rationale: 希伯来文本本身没有在本节内限定所指；它可能与锡安、圣殿或作为神宝座脚凳的约柜相关。保留隐喻可避免替文本消除其真实的多义性。
- issue: “以色列的华美”具体指什么
  choice: 保留概括性的“以色列的华美”
  alternative: 明确解释为“以色列的荣耀”、“耶路撒冷”或“圣殿”
  rationale: תִּפְאֶרֶת的语义范围包括华美、荣美和荣耀，且经文没有明说具体对象；译文不以神学推断替代原文的开放表达。
translation_notes:
  register: 采用现代、庄重而易懂的普通话诗体。“竟”承载אֵיכָה的哀叹和震惊语气；分号呈现两项审判行动之间的推进关系。正文保留“阴云”“从天上……到地上”“脚凳”等核心意象，并以脚注说明真实存在的词义与指涉歧义。
