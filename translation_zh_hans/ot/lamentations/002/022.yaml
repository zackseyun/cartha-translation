  text: תִּקְרָא֩ כְ/י֨וֹם מוֹעֵ֤ד מְגוּרַ/י֙ מִ/סָּבִ֔יב וְ/לֹ֥א הָיָ֛ה בְּ/י֥וֹם אַף יְהוָ֖ה פָּלִ֣יט וְ/שָׂרִ֑יד אֲשֶׁר טִפַּ֥חְתִּי וְ/רִבִּ֖יתִי אֹיְבִ֥/י כִלָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/022.yaml
  text: You summoned my terrors from every side as on an appointed day[a], and on the day of Yahweh’s anger there was no survivor or remnant. Those whom I nurtured and raised[b], my enemy destroyed them.
translation:
  language: zh_hans
  text: 你从四面召来使我惊恐的事[a]，如同在节期一样[b]；在雅威发怒之日，没有一个逃脱的，也没有一个存留的。我所抚育、养大的，我的仇敌把他们全都灭尽了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使我惊恐的事”也可理解为“从四面恐吓我的人”。
    reason: lexical_alternative
  - marker: b
    text: “如同在节期一样”也可译作“如同在约定的日子一样”。原文把恐怖之事的聚集，比作人们在节期或约定的聚集日会集。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרָא
  choice: 召来
  rationale: 该词是קרא的Qal未完成式第二人称阳性单数，此处是向雅威直接说话。“召来”既保留“呼召、召集”的动作，也自然表达灾祸仿佛奉召而聚集。
- source_word: כְיוֹם מוֹעֵד
  choice: 如同在指定的节期之日
  rationale: מוֹעֵד既可指指定的时间，也常指节期或会集的日子。译文同时保留“指定”与“节期”的含义，并呈现此处以灾祸聚集反衬节庆会集的讽刺意象。
- source_word: מְגוּרַי מִסָּבִיב
  choice: 从四面……使我惊恐的事
  rationale: מְגוּרַי在本语境中最可能指“我的恐怖、我所惧怕的事”，מִסָּבִיב表达四面包围。中文采用事件性表达以避免“召来我的恐怖”生硬，同时以脚注保留可指恐吓者的歧义。
- source_word: בְּיוֹם אַף יְהוָה
  choice: 在雅威发怒之日
  rationale: אַף在此指烈怒；יְהוָה按其专名译作“雅威”。此表达简洁保留原文的属格关系和审判语气。
- source_word: פָּלִיט וְשָׂרִיד
  choice: 没有一个逃脱的，也没有一个存留的
  rationale: 两个名词分别侧重逃脱者与存留下来的人。采用并列句式保留两者区别，并传达无人幸免的强化效果。
- source_word: טִפַּחְתִּי וְרִבִּיתִי
  choice: 我所抚育、养大的
  rationale: 两个动词在此描写对子女的温柔照料和养育。“抚育、养大”自然、庄重，并保留哀歌中的亲情痛楚。
- source_word: אֹיְבִי כִלָּם
  choice: 我的仇敌都灭尽了
  rationale: אֹיְבִי带第一人称单数后缀，故保留“我的仇敌”；כִלָּם表示将前述众人彻底毁灭，“都灭尽了”体现其完全性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较直接呈现其通行学术拟音，不以称号替代专名。
- issue: “逃脱者”与“存留者”的关系
  choice: 保留两个并列类别
  alternative: 合并译作“无人幸存”
  rationale: 原文以פָּלִיט和שָׂרִיד并列强化毁灭的彻底性；分别翻译避免抹平词义差别，同时不把二者解释成特定神学群体。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“召来”“发怒之日”“灭尽”等措辞保留哀歌的肃穆力度；通过分号划分灾祸被召集与无人幸免两个层次。所有脚注标记均已在正文中出现。
