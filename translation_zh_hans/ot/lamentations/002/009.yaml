source:
  edition: WLC
  text: טָבְע֤וּ בָ/אָ֨רֶץ֙ שְׁעָרֶ֔י/הָ אִבַּ֥ד וְ/שִׁבַּ֖ר בְּרִיחֶ֑י/הָ מַלְכָּ֨/הּ וְ/שָׂרֶ֤י/הָ בַ/גּוֹיִם֙ אֵ֣ין תּוֹרָ֔ה גַּם נְבִיאֶ֕י/הָ לֹא מָצְא֥וּ חָז֖וֹן מֵ/יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/009.yaml
  text: Her gates have sunk into the earth; he has destroyed and broken her bars[a]. Her king and her princes are among the nations; there is no law. Even her prophets have found no vision from Yahweh.
translation:
  language: zh_hans
  text: 她的城门沉入地中；他毁坏、折断了她的门闩。她的君王和首领在列国中；没有律法[a]。连她的先知也没有从耶和华得到异象。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法”也可译作“教导”；希伯来语“妥拉”可指律法、训诲或教导。
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ בָאָרֶץ
  choice: 陷入地中
  rationale: 保留城门下沉、没入土地的强烈诗歌意象；“陷入”在现代汉语中自然，也可表达毁坏后的结果状态。
- source_word: שְׁעָרֶיהָ
  choice: 她的城门
  rationale: 指城的门户；保留阴性后缀所体现的城市人格化，以“她”指锡安／耶路撒冷。
- source_word: אִבַּד וְשִׁבַּר
  choice: 他毁坏、折断了
  rationale: 两个单数动词共用未明说的主语。“毁坏”表达彻底破坏，“折断”维持门闩被破坏的具体图景；不把主语直接补作“耶和华”。
- source_word: בְּרִיחֶיהָ
  choice: 她的门闩
  rationale: 明确指固定城门的横闩，比单说“闩”更易懂，并与前面的城门自然衔接。
- source_word: מַלְכָּהּ וְשָׂרֶיהָ
  choice: 她的君王和首领
  rationale: מֶלֶךְ指君王；שָׂרִים可指统治阶层、官长或领袖。“首领”既保留政治领导含义，又避免把其范围限定为世袭王子。
- source_word: בַגּוֹיִם
  choice: 流落列国
  rationale: 原文直译为“在列国中”；结合城破与君臣离散的语境，用“流落”自然传达其身处异邦的悲惨状态，但不额外明确写成“被掳”。
- source_word: אֵין תּוֹרָה
  choice: 律法不复存在
  rationale: אֵין表达缺失或不存在；תּוֹרָה在此可指律法，也可泛指来自上帝的教导。“律法”保留其重要圣经术语地位，词义张力以脚注说明。
- source_word: גַּם נְבִיאֶיהָ
  choice: 连她的先知也
  rationale: “连……也”传达גַּם在这里的递进、加强作用：政治秩序崩溃之外，先知启示也沉寂了。
- source_word: לֹא מָצְאוּ חָזוֹן מֵיְהוָה
  choice: 得不到从耶和华而来的异象
  rationale: “得不到”自然表达先知未能获得异象的持续困境；“从耶和华而来”明确保留异象的来源。神名按本项目常用形式译为“耶和华”。
theological_decisions:
- issue: אִבַּד וְשִׁבַּר两个单数动词的隐含主语
  choice: 译作“他”，不在正文中明确补作“耶和华”
  alternative: 译作“耶和华毁坏、折断了”
  rationale: 上下文强烈暗示行动者是耶和华，但本节希伯来文本没有明说主语。保留“他”既符合原文句法，也让上下文确定所指，避免在译文中消除原有的含蓄。
- issue: תּוֹרָה在本节的意义
  choice: 正文译作“律法”并以脚注保留“教导”的可能
  alternative: 正文译作“教导”或音译为“妥拉”
  rationale: 此处可能兼有盟约律法、权威教导和社会宗教秩序的含义。“律法”简洁并保留关键词的一致性，而脚注防止读者把词义过度收窄。
- issue: 君王与首领“在列国中”的状态
  choice: 译作“流落列国”
  alternative: 直译“在列国中”或解释为“被掳到列国”
  rationale: “流落”符合哀歌语境并传达离散处境，却不明确加入原文未出现的“被掳”一词。
translation_notes:
  register: 采用现代、庄重而可朗读的标准普通话。以短句保留希伯来诗歌的沉重节奏；用“她”维持锡安城的人格化。避免古奥的“邑门”“列邦”，同时保留“君王、律法、先知、异象、耶和华”等关键圣经词汇。
