  to: '耶和华做成了他所谋定的；

    他成就了他的话[a]，

    就是他自古所吩咐的[b]。

    他拆毁，毫不怜惜；

    他使仇敌因你而欢喜，

    高举了你众敌人的角[c]。'
  rationale: 修订仅处理两处可安全判定的语义问题：以“吩咐”直译צִוָּה，避免“命定”加入原文未明说的预定论色彩；以“众敌人”明确复数。另以“成就他的话”改善中文搭配，并保留原文“使仇敌……欢喜”的使役结构、对“你”的直接称呼及“角”的比喻意象。
