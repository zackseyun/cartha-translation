id: LAM.2.17
reference: Lamentations 2:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עָשָׂ֨ה יְהוָ֜ה אֲשֶׁ֣ר זָמָ֗ם בִּצַּ֤ע אֶמְרָת/וֹ֙ אֲשֶׁ֣ר צִוָּ֣ה מִֽ/ימֵי קֶ֔דֶם הָרַ֖ס וְ/לֹ֣א חָמָ֑ל וַ/יְשַׂמַּ֤ח עָלַ֨יִ/ךְ֙ אוֹיֵ֔ב הֵרִ֖ים קֶ֥רֶן צָרָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/017.yaml
  text: Yahweh has done what he planned[a]; he has fulfilled his word, which he commanded from days of old. He has torn down and has not shown pity; he has made the enemy rejoice over you[c][b]; he has exalted the horn of your foes.
translation:
  language: zh_hans
  text: '耶和华做成了他所谋定的；

    他成就了他的话[a]，

    就是他自古所吩咐的[b]。

    他拆毁，毫不怜惜；

    他使仇敌因你而欢喜，

    高举了你众敌人的角[c]。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “成就”也可译作“执行”或“实行到底”。
    reason: lexical_alternative
  - marker: b
    text: “自古”即“从很久以前”。
    reason: lexical_alternative
  - marker: c
    text: “角”在圣经中常象征力量、权势或尊荣。
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式呈现四字神名，不以“主”这一称号替代。
- source_word: זָמָם
  choice: 谋定
  rationale: 表达经过筹划并决意实行，既保留审判的预定性，也符合哀歌的庄重诗体。
- source_word: בִּצַּע אֶמְרָתוֹ
  choice: 实现了自己的话
  rationale: בִּצַּע 在此指把先前宣告的话实行到底；“实现”自然地与“话”搭配，又不把 אֶמְרָה 限定为应许。
- source_word: צִוָּה
  choice: 命定
  rationale: 这里所涉及的是神很久以前所发出的判语或吩咐；“命定”在中文中比“吩咐自己的话”自然，同时保留权威性的决定与宣告。
- source_word: מִימֵי קֶדֶם
  choice: 从古时
  rationale: 保留希伯来文“从古时的日子以来”的诗性时间表达，意为很久以前。
- source_word: הָרַס
  choice: 拆毁
  rationale: 呈现城邑和建筑被毁坏的拆除意象，比泛称“毁灭”更贴近动词的具体画面。
- source_word: וְלֹא חָמָל
  choice: 毫不怜惜
  rationale: 简洁传达没有怜悯、没有顾惜的意思，并保持审判陈述的力度。
- source_word: וַיְשַׂמַּח עָלַיִךְ אוֹיֵב
  choice: 他使仇敌因你而欢喜
  rationale: 保留使役语态和神的主动作用；“你”延续对锡安或耶路撒冷的阴性单数拟人称呼。
- source_word: הֵרִים קֶרֶן
  choice: 高举了……的角
  rationale: 保留圣经中“角”象征力量、权势或尊荣的意象，并用注释帮助现代读者理解。
- source_word: צָרָיִךְ
  choice: 你敌人
  rationale: 反映原文复数，并与前句单数“仇敌”作自然而忠实的区分。
theological_decisions:
- issue: 神在耶路撒冷毁灭中的主动作用
  choice: 明确以耶和华为谋定、实现、拆毁、不怜惜、使仇敌欢喜并高举敌人之角的施事者。
  alternative: 将这些行动弱化为神仅仅容许敌人施行毁灭。
  rationale: 希伯来文连续以耶和华为这些动词的主语；译文保留神主动施行审判所带来的神学张力，不将其解释为单纯的许可。
- issue: “他的话”的性质
  choice: 译作宽泛的“自己的话”。
  alternative: 译作“应许”或明确称为“审判宣告”。
  rationale: אֶמְרָה 本身是宽泛的“话、言语”；上下文表明它涉及审判，但正文不额外缩窄其词义。
translation_notes:
  register: 采用现代、庄重而可朗读的诗体中文，按原文分行呈现平行结构。保留“角”的源语意象并加注说明；不弱化连续动词所表达的神圣审判与主动施事。
