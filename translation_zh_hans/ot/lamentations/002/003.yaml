revisions:
- from: 他在烈怒中砍断了以色列所有的角[a]；他在仇敌面前收回了自己的右手[b]。他又在雅各中间燃烧，如烈焰之火，吞噬四周。
  to: 他在炽烈的怒气中，砍断了以色列的一切角[a]；他从仇敌面前收回右手[b]；他在雅各中如烈焰般的火燃烧，吞噬四周。
  rationale: 修订保留原文的诗歌性比喻和句法推进，并将“从仇敌面前”置于正文，以反映希伯来文介词的方向性。对“右手”的能力或保护含义仅在脚注中说明，不取代正文意象；同时删去“中间”，并调整火焰短语使其更自然。
