  text: גָּדַ֣ע בָּֽ/חֳרִי אַ֗ף כֹּ֚ל קֶ֣רֶן יִשְׂרָאֵ֔ל הֵשִׁ֥יב אָח֛וֹר יְמִינ֖/וֹ מִ/פְּנֵ֣י אוֹיֵ֑ב וַ/יִּבְעַ֤ר בְּ/יַעֲקֹב֙ כְּ/אֵ֣שׁ לֶֽהָבָ֔ה אָכְלָ֖ה סָבִֽיב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/003.yaml
  text: In burning anger he has cut down every horn of Israel[a]; he has drawn back his right hand from before the enemy[b], and he has burned in Jacob like a flaming fire that devours all around.
translation:
  language: zh_hans
  text: 他在炽烈的怒气中，砍断了以色列的一切角[a]；他从仇敌面前收回右手[b]；他在雅各中如烈焰般的火燃烧，吞噬四周。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “角”在希伯来文中常比喻力量、权势或尊荣。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他在仇敌面前撤回右手”。这形象描绘上帝撤回其能力或保护。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַע
  choice: 砍断了
  rationale: 该动词表示猛烈地砍下或截断；“砍断”既保留破坏力度，也能自然搭配“角”的意象。
- source_word: בָּחֳרִי אַף
  choice: 在烈怒中
  rationale: חֳרִי 与 אַף 构成强烈愤怒的表达，也隐含灼热之感；“烈怒”符合现代汉语庄重文体，并与后文火焰意象呼应。
- source_word: כֹּל קֶרֶן יִשְׂרָאֵל
  choice: 以色列所有的角
  rationale: 保留希伯来文以“角”象征力量、权势或尊荣的比喻，并用脚注说明，避免在正文中把多义意象单一化。
- source_word: הֵשִׁיב אָחוֹר יְמִינוֹ
  choice: 收回了自己的右手
  rationale: 该表达描绘上帝撤回原本施展能力或保护的右手；“收回”自然地传达有意撤去，同时保存身体意象。
- source_word: מִפְּנֵי אוֹיֵב
  choice: 在仇敌面前
  rationale: 介词短语可直译为“从仇敌面前”，但与“收回”连用时，现代汉语用“在仇敌面前”更清楚地表达当敌人在场时撤回右手，且不排除方向性的理解。
- source_word: וַיִּבְעַר בְּיַעֲקֹב
  choice: 他又在雅各中间燃烧
  rationale: בער 描写燃烧，בְּיַעֲקֹב 指火势在雅各之中发生；译文保留主语与火的比喻相融合的强烈诗意。
- source_word: כְּאֵשׁ לֶהָבָה
  choice: 如烈焰之火
  rationale: 原文并列“火”与“火焰”以加强形象；“烈焰之火”在汉语中凝练而庄重，保留其强化作用。
- source_word: אָכְלָה סָבִיב
  choice: 吞噬四周
  rationale: “吞噬”保存希伯来文以“吃”为火焰毁灭作用的拟人表达；“四周”传达 סָבִיב 的全面范围。
theological_decisions:
- issue: 上帝审判的多重比喻
  choice: 正文保留“角”“右手”和烈火的意象
  alternative: 将其直接解释为“力量”“保护”和“毁灭”
  rationale: 原文借被砍断的角、被收回的右手和吞噬的烈火层层描写审判。保留这些意象能维持诗歌与神学张力，不把象征含义过早限定为单一解释。
- issue: “在仇敌面前”与撤回保护的关系
  choice: 译作“他在仇敌面前收回了自己的右手”
  alternative: 译作“他从仇敌面前收回了自己的右手”
  rationale: מִפְּנֵי 在此既保留空间方向感，也可表示面对仇敌时撤回行动。正文采用自然汉语，脚注保留较字面的方向性译法及右手所暗示的能力或保护。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。保留哀歌诗体的平行结构与核心意象；以分号和句号划分三幅连续画面，使朗读清晰。“雅各”沿用圣经传统专名，在此指其子民。
