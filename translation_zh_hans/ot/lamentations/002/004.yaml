revisions:
- from: 他像仇敌一样拉开弓；他的右手像敌手一样站定。他在锡安女子的帐棚中，杀尽一切悦目的[a]；他将烈怒如火倾倒出来。
  to: 他像仇敌一样拉开弓；他的右手如同敌手，站定待发。他在锡安女子的帐幕中，杀尽所有悦目可爱的人[a]；他把烈怒像火一样倾倒出来。
  rationale: 修订仅处理汉语句法与搭配问题，并保持原文的诗歌平行、敌对比喻和神学张力。以“所有悦目可爱的人”在正文中反映杀戮语境，以脚注保存该短语可泛指珍贵事物的词义可能；“站定待发”保留右手就位的战斗姿态而不增添具体战术；末句调整语序以明确“像火一样”是倾倒烈怒的比较。
  reviewer_model: gpt-5.6-terra
