  naturalness: “他的右手像敌手一样站定”虽逐词对应，但将“右手”直接说成“像敌手一样站定”在现代汉语中较生硬；改为“他的右手如同敌手，站定待发”可保留右手为主语、站立/就位及比较，不把它改写成明确的攻击行动。“把烈怒像火一样倾倒出来”也比“将烈怒如火倾倒出来”更合乎现代汉语语序。
  terminology: “锡安女子”可保留为诗歌性的拟人称谓；将“帐棚”改为“帐幕”较符合中文圣经及庄重诗歌语体，但不改变其居所意象。“烈怒”恰当传达חֵמָה。
