  text: דָּרַ֨ךְ קַשְׁתּ֜/וֹ כְּ/אוֹיֵ֗ב נִצָּ֤ב יְמִינ/וֹ֙ כְּ/צָ֔ר וַֽ/יַּהֲרֹ֔ג כֹּ֖ל מַחֲמַדֵּי עָ֑יִן בְּ/אֹ֨הֶל֙ בַּת צִיּ֔וֹן שָׁפַ֥ךְ כָּ/אֵ֖שׁ חֲמָתֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/004.yaml
  text: He bent his bow like an enemy; his right hand stood ready like a foe[a], and he killed all who were pleasing to the eye in the tent of daughter Zion; he poured out his wrath like fire.
translation:
  language: zh_hans
  text: 他像仇敌一样拉开弓；他的右手如同敌手，站定待发。他在锡安女子的帐幕中，杀尽所有悦目可爱的人[a]；他把烈怒像火一样倾倒出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一切眼中珍爱的人”或“一切悦目珍贵之物”。原文可指美好、可爱或珍贵的人或事物；但因这里作“杀尽”的宾语，较可能主要指所珍爱的人。
    reason: 保留מַחֲמַדֵּי עָיִן可泛指人物或珍贵事物的词义范围，同时使正文顺应“杀”的语境。
lexical_decisions:
- source_word: דָּרַךְ קַשְׁתּוֹ
  choice: 拉开弓
  rationale: 该搭配指为射击而张弓、拉弓；“拉开弓”在现代汉语中自然，并保留临战的武力意象。
- source_word: כְּאוֹיֵב
  choice: 像仇敌一样
  rationale: 保留כ的明喻作用，直接呈现他行动如同仇敌的震撼意象。
- source_word: נִצָּב יְמִינוֹ כְּצָר
  choice: 他的右手像敌手一样站定
  rationale: נִצָּב表示站立、就位或站定；保留“右手”作主语和第二个明喻，而不将其解释性改写为“准备攻击”。
- source_word: וַיַּהֲרֹג כֹּל
  choice: 杀尽一切
  rationale: “杀尽”兼顾הרג的杀戮含义与כֹּל的总体性。
- source_word: מַחֲמַדֵּי עָיִן
  choice: 一切悦目的
  rationale: 该短语可指眼中美好、可爱或珍贵的人或事物；采用中性、省略中心语的表达，以保留原文在人物与珍贵之物之间的真实歧义。
- source_word: בְּאֹהֶל בַּת־צִיּוֹן
  choice: 在锡安女子的帐棚中
  rationale: 保留“锡安女子”的拟人形象及“帐棚”的诗歌意象，不将其平化为耶路撒冷。
- source_word: שָׁפַךְ כָּאֵשׁ חֲמָתוֹ
  choice: 将烈怒如火倾倒出来
  rationale: 保留“倾倒”与“如火”的意象；“烈怒”传达חֵמָה强烈、灼热的愤怒。
theological_decisions:
- issue: 上帝对锡安的行动被比作仇敌
  choice: 直接译为“像仇敌一样”，并保留“像敌手一样”的平行表达
  alternative: 译作“攻击锡安”或“仿佛是仇敌”
  rationale: 原文明确使用两个比较结构；直译可保存哀歌中上帝竟以敌对姿态对待锡安的神学张力，不加缓和。
- issue: בַּת־צִיּוֹן的拟人表达
  choice: 锡安女子
  alternative: 锡安的女儿；锡安
  rationale: “锡安女子”在现代中文中较凝练，也保留城与群体被人格化为女子的诗性和哀悼语境。
- issue: מַחֲמַדֵּי עָיִן所指对象
  choice: 在正文中保留为“一切悦目的”
  alternative: 所有悦目的人；一切悦目珍贵之物
  rationale: 上下文中的“杀”倾向于指人，但该希伯来短语本身也可泛指美好或珍贵之物；正文不强行消除这一歧义，并以脚注说明。
translation_notes:
  register: 采用现代、庄重而可朗读的普通话。“仇敌／敌手”呈现希伯来诗句的平行变化；“站定”“帐棚”“烈怒”“倾倒”保留哀歌的战争、居所与审判意象。正文脚注标记[a]与脚注相对应。
