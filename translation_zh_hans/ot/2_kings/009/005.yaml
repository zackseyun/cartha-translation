base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: zh_hans
  text: 他来到那里，只见军队的将领们正坐着。他说：“将军，我有话对你说。”耶户问：“是我们当中的哪一位？”他说：“是你，将军。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 他进去
  rationale: 该叙事性动词承接上文，表示先知门徒进入众将领所在之处；中文用“进去”自然呈现动作和场景。
- source_word: וְהִנֵּה
  choice: 只见
  rationale: הִנֵּה引导眼前所见并使场景更鲜明；“只见”在现代汉语叙事中自然保留这一提示作用。
- source_word: שָׂרֵי הַחַיִל
  choice: 军队的将领们
  rationale: שָׂרֵי在此指军事领袖，הַחַיִל指军队；“将领们”既符合复数，也避免限定为某一具体军衔。
- source_word: יֹשְׁבִים
  choice: 正坐在那里
  rationale: 分词表示持续中的状态；“正坐在那里”清楚呈现进入时看到的情景。
- source_word: דָּבָר לִי אֵלֶיךָ
  choice: 我有话对你说
  rationale: 希伯来语字面结构近于“我有一句话给你”，是表示有信息要传达的习语；此译法自然、准确，也保留“话”而不预先限定为正式口信。
- source_word: הַשָּׂר
  choice: 将军
  rationale: 此处为对军事领袖的直接称呼。“将军”是自然且庄重的汉语称谓；不将其理解为严格对应现代军衔。
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: 我们当中的哪一位
  rationale: 耶户询问在场众人中受话的是谁；该译法自然表达介词短语的指向和部分关系。
- source_word: אֵלֶיךָ הַשָּׂר
  choice: 就是你，将军
  rationale: 回答明确指出耶户本人。“就是你”符合中文对答习惯，并保留直接称呼“将军”。
theological_decisions: []
