revisions:
- from: 耶户出来，回到他主人的臣仆那里，其中一人问他：“平安吗？这个疯子为什么到你这里来？”他回答他们：“你们知道那个人，也知道他说话的那一套。”
  to: 耶户出来，到他主人的仆人那里。其中一人问他：“平安吗？这个疯子为什么到你这里来？”他回答他们：“你们知道那个人，也知道他的话。”
  rationale: The revision removes the added implication of returning, uses a more natural and source-general term for the master's servants, and renders שִׂיחוֹ as “他的话” to preserve its broad, intentionally noncommittal sense. It retains the Hebrew's concise well-being greeting, the contemptuous designation, and the singular representative speaker.
