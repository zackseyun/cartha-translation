base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: zh_hans
  text: 耶户出来，到他主人的仆人那里。其中一人问他：“平安吗？这个疯子为什么到你这里来？”他回答他们：“你们知道那个人，也知道他的话。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: 他主人的臣仆
  rationale: “臣仆”既保留对上位者服事、隶属的含义，也适合此处王室军政人员的语境；不擅自把“主人”明说为“王”。
- source_word: הֲשָׁלוֹם
  choice: 平安吗？
  rationale: 保留希伯来语以“平安”询问状况是否安好的简洁习语，现代中文也自然可懂。
- source_word: מַדּוּעַ בָּא
  choice: 为什么到你这里来
  rationale: 按叙事对话表达来访缘由；中文无需明确标示完成体，仍可自然涵盖“为什么来了”。
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: 这个疯子
  rationale: 保留原文明确的轻蔑性称呼及阳性单数所指，不将侮辱语气弱化。
- source_word: וַיֹּאמֶר לוֹ
  choice: 其中一人问他
  rationale: 原文动词为单数，而前项“臣仆”为复数；译作“其中一人”体现群体中一人发言，避免中文指代含混。
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: 你们知道那个人
  rationale: 保留耶户闪烁、敷衍的回答语气；“那个人”在中文中比“这个人”更符合他对刚离开的来者所作的疏离指称。
- source_word: שִׂיחוֹ
  choice: 他说话的那一套
  rationale: 该词可泛指言谈、话语或谈吐；此译保留宽泛语义，并传达上下文略带贬抑和敷衍的口吻，而不把它限定为正式“信息”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对轻蔑称呼不作美化，并保留耶户回答中的含混与回避语气；未加入原文没有明说的“王”或先知身份。
