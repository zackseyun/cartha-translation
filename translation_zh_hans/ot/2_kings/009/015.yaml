revisions:
- from: 约兰王已经回到耶斯列，疗养亚兰人给他造成的伤；这些伤是他与亚兰王哈薛交战时受的。耶户说：“如果你们愿意，就不要让任何人逃出城，到耶斯列去报信。”
  to: 约兰王已经回到耶斯列养伤；他是在与亚兰王哈薛交战时被亚兰人打伤的。耶户说：“如果你们愿意，就不要让任何人逃出城去耶斯列报信。”
  rationale: 仅作汉语表达和句法衔接的轻微修订。“养伤”自然表达从战伤中恢复；“是在……时被亚兰人打伤的”保留原文中伤害者、受伤者及交战情境。末句取消逗号，使离城与前往耶斯列报信的目的关系明确。
