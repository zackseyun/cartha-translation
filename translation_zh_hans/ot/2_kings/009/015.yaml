base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: zh_hans
  text: 约兰王已经回到耶斯列养伤；他是在与亚兰王哈薛交战时被亚兰人打伤的。耶户说：“如果你们愿意，就不要让任何人逃出城去耶斯列报信。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 已经回到
  rationale: שוב在这里指返回；结合上下文，此事发生在耶户说话之前，用“已经回到”自然表达前时关系，又不添加原文没有的“现在”。
- source_word: לְהִתְרַפֵּא
  choice: 疗养
  rationale: רפא的Hitpael形式在此指因伤接受治疗、恢复健康；“疗养”符合现代汉语叙事，也不暗示自我医治。
- source_word: מִן הַמַּכִּים אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: 亚兰人给他造成的伤
  rationale: מַכִּים字面涉及击打，语境中是战伤；将נכה译入“造成”可避免汉语中“伤了这些伤”的生硬搭配。
- source_word: אֲרַמִּים
  choice: 亚兰人
  rationale: 保留古代民族与地域名称“亚兰”，避免使用可能引发现代地理联想的称呼。
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: 他与……哈薛交战时
  rationale: 介词ב加不定式结构表示事情发生的时间或情境；“交战时”自然呈现这一关系。
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: 如果你们愿意
  rationale: 这是表达意愿的习语；译为“如果你们愿意”比直译“如果有你们的心”清楚自然，同时保留对众人的复数称呼。
- source_word: אַל יֵצֵא פָלִיט מִן הָעִיר
  choice: 就不要让任何人逃出城
  rationale: פָלִיט在禁令中指成功逃脱、离开的人，并非特定身份的“逃亡者”；此译准确表达耶户封锁消息的命令。
- source_word: לָלֶכֶת לְהַגִּיד בְּיִזְרְעֶאל
  choice: 到耶斯列去报信
  rationale: 两个不定式表达出去并传报消息的行动；“去报信”简洁地符合军事叙事语境，ב在此按目的地点处理。
