base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: zh_hans
  text: 耶户把弓拉满，一箭射中约兰两臂之间[a]；箭从他的心脏穿出，他便倒在自己的战车里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“两肩之间”或“肩胛之间”。希伯来语直译为“两臂之间”，在这里可能指上背部或肩部一带。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: 把弓拉满
  rationale: 原文直译为“用弓充满他的手”，是拉弓至满的惯用表达；译文以自然、鲜明的现代汉语传达其动作。
- source_word: וַיַּךְ
  choice: 一箭射中
  rationale: נכה本义宽泛，可指“击打、击中”；上下文明确以箭为器，译作“一箭射中”自然地交代动作，但不增添原文没有的伤势细节。
- source_word: בֵּין זְרֹעָיו
  choice: 两臂之间
  rationale: זְרוֹעַ通常指“臂、手臂”。正文保留原文的身体部位表达及其可能的含混性，并在脚注说明上下文中可能指肩膀之间或肩胛之间。
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: 箭从他的心脏穿出
  rationale: 短语字面意为“箭从他的心出来”；致命中箭的语境表明箭贯穿心脏区域，“穿出”在汉语中清楚表达箭从身体另一侧出来。
- source_word: וַיִּכְרַע
  choice: 倒
  rationale: כרע可指屈身、跪下或倒下；此处描写约兰受致命伤后身体倒下，简洁译作“倒”最合叙事语境。
- source_word: בְּרִכְבּוֹ
  choice: 在自己的战车里
  rationale: 介词加第三人称单数所有格后缀，指约兰所在并属于他的战车；“自己的”可清楚避免与耶户的战车混淆。
