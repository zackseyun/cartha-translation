  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: zh_hans
  text: “我昨天确实[a]看见了拿伯的血和他儿子们的血，”这是雅威的宣告；“我必在这块地上报应你，”这是雅威的宣告。现在，你要把他抬起来，扔在这块地上，照着雅威的话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文开头是带誓言色彩的强调表达，也可译作“我昨天的确看见了……”。
    reason: 说明 אִם לֹא 在此不是普通条件句，而是强烈断言，并保留可接受的措辞差异。
lexical_decisions:
- source_word: אִם לֹא
  choice: 确实
  rationale: 此处不是普通条件句，而是带誓言色彩的强烈断言；“确实”自然地传达强调语气。
- source_word: דְּמֵי
  choice: 血
  rationale: 希伯来语复数“血”可指流血、血债或遭暴力杀害；汉语用单数“血”既自然，也保留原文意象。
- source_word: נָבוֹת
  choice: 拿伯
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: בָנָיו
  choice: 他儿子们
  rationale: 原文明确为复数“儿子”，不泛化为“儿女”或“孩子”。
- source_word: רָאִיתִי
  choice: 我……看见了
  rationale: 第一人称单数完成式与时间词“昨天”配合，译为已发生的看见。
- source_word: אֶמֶשׁ
  choice: 昨天
  rationale: 该词可指昨日或昨夜；本处译为较中性且符合上下文的“昨天”。
- source_word: נְאֻם יְהוָה
  choice: 雅威宣告说
  rationale: 保留正式、庄重的神谕公式，并以“雅威”呈现四字神名。
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: 我必……报应你
  rationale: 此处 piel 形态表达司法性的偿还或追讨；“报应”比一般“偿还”更清楚地体现惩罚语境。
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: 在这块地上
  rationale: חֶלְקָה 指一块划定的土地；此译简洁自然，也符合拿伯产业的叙事背景。
- source_word: וְעַתָּה
  choice: 所以现在
  rationale: 既标明转折到当前命令，也体现命令由前述神谕而来的结果关系。
- source_word: שָׂא
  choice: 把他抬起来
  rationale: 命令式字面为抬起或搬起；上下文所指是亚哈谢尸身，保留代词“他”。
- source_word: הַשְׁלִכֵהוּ
  choice: 扔在
  rationale: 使役命令式带第三人称宾语后缀，直译为把他扔下；“扔在这块地里”符合自然汉语。
- source_word: כִּדְבַר יְהוָה
  choice: 照雅威的话而行
  rationale: 原文意为按照雅威的话；补出“而行”使汉语命令完整，未增加实质含义。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神名，音译“雅威”保留其专名性质，不以头衔取代。
- issue: 司法语境中 בָנָיו 的具体所指
  choice: 他儿子们
  alternative: 他的儿女；他的孩子们
  rationale: 原文明确使用“儿子”的复数，应保留其性别和人数信息，不作泛化。
- issue: “拿伯及其儿子之血”的法律与神学张力
  choice: 保留“拿伯的血和他儿子们的血”
  alternative: 解释性译为“杀害拿伯和他儿子们的血债”
  rationale: 直陈“血”保留原文关于流血、血债和司法追讨的多重含义，不在正文中替读者选定单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与神谕语体。两次保留“雅威宣告说”，呈现原文重复的司法庄严感；命令部分用直接有力的现代汉语。
