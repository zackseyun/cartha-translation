  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: zh_hans
  text: 约兰一看见耶户，就说：“耶户，是平安吗？”耶户说：“只要你母亲耶洗别的淫行[a]和她众多的邪术还在，哪会有平安？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“淫乱”。希伯来语这个词既可有字面含义，也可有比喻含义，包括道德败坏和敬拜上的不忠。
    reason: lexical_alternative
  - marker: b
    text: 或译“什么平安？”原文重复约兰问题中的“平安”一词，以形成反问。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: 一看见……就……
  rationale: 这是希伯来叙事中“事情发生，当……看见时”的句式。汉语以“一……就……”自然表达紧接发生的动作，同时保留叙事推进感。
- source_word: הֲשָׁלוֹם
  choice: 是平安吗
  rationale: 保留“平安”这一名词，使它与耶户回答中的同词复现形成鲜明的修辞呼应；也可表达约兰对来意是否和平的询问。
- source_word: מָה הַשָּׁלוֹם
  choice: 哪会有平安
  rationale: 将简短的反问译成自然汉语，传达在当前情形下不可能有平安的语气，同时保留“平安”的重复。
- source_word: עַד
  choice: 只要……还在
  rationale: 这里表示一种持续存在、使平安不可能出现的情形；“只要……还在”比单纯译作“直到”更符合上下文。
- source_word: זְנוּנֵי
  choice: 淫行
  rationale: 保留原文刻意尖锐的性伦理隐喻，又不把它限定为单一的肉体行为；在本语境中也可涵盖道德及敬拜上的不忠。
- source_word: אִיזֶבֶל אִמְּךָ
  choice: 你母亲耶洗别
  rationale: 按原文直称其母亲及姓名，保留耶户责斥约兰时直接而尖锐的口吻。
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  choice: 和她众多的邪术
  rationale: “邪术”清楚表达被禁止的法术或巫术行为；“众多”保留复数及形容词所强调的数量。
theological_decisions:
- issue: זְנוּנֵי 应按具体性行为翻译，还是按宗教不忠解释
  choice: 正文译作“淫行”，脚注说明其可兼有字面和比喻含义
  alternative: 淫乱；娼妓行为；拜偶像
  rationale: 原词有意使用强烈而具冲击力的表达，在此历史与神学语境中可能同时涉及道德败坏和敬拜上的不忠。正文不窄化为“拜偶像”，以保留原文张力。
- issue: שָׁלוֹם 在两处是否都译作“平安”
  choice: 两处均译作“平安”
  alternative: 第一处译作“平安无事吗”或“你是为和平而来吗”，第二处译作“哪能相安无事”
  rationale: 一致译法保留约兰提问与耶户反问之间的关键词复现和修辞冲突，不将其泛化为安全或顺利。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名使用中文圣经传统通行译名“约兰、耶户、耶洗别”。正文保留“平安”的重复及“淫行”的尖锐语气，并以脚注保留词义范围和更贴近原文形式的反问译法。
