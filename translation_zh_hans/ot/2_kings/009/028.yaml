  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: zh_hans
  text: 他的臣仆把他运到耶路撒冷，葬在大卫城他自己的坟墓里，与他的列祖同葬[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “运到”也可译作“载到”；希伯来语动词字面意思是“使他乘坐”，在这里指把他的遗体载运过去。
    reason: lexical_alternative
  - marker: b
    text: “与他的列祖同葬”是希伯来语的安葬用语，意思是葬在他王室先祖中间。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: 运到
  rationale: 该使役形字面意为“使乘坐”，也可指使人或遗体被载运；本节对象已经死亡，因此“运到”自然表达将遗体送往耶路撒冷，同时不暗示他仍活着骑乘。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עבד 可指仆人，也可指王室臣属或侍从；“臣仆”既保留服侍关系，也符合君王身边人员的语境。
- source_word: יְרוּשָׁלָמָה
  choice: 到耶路撒冷
  rationale: 词尾的方向成分表示朝向耶路撒冷的移动，现代汉语自然译为“到耶路撒冷”。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 葬
  rationale: 直接表达“他们埋葬他”；汉语承接前句主语，可简洁译作“葬”。
- source_word: בִקְבֻרָתוֹ
  choice: 在他自己的坟墓里
  rationale: 该词指其埋葬之处；“坟墓”清楚自然。物主后缀译作“他自己的”，以保留原文“他的坟墓”与随后“列祖”之间的关系。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖同葬
  rationale: “与列祖同葬”保留希伯来文的安葬习语及王朝意味，又以“同葬”使现代读者容易理解，并不表示与祖先同时下葬。
- source_word: בְּעִיר דָּוִד
  choice: 在大卫城
  rationale: 这是该地名短语在中文中的直接而惯常的译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“臣仆”反映王室语境；“运到”避免让读者误以为死者仍自行骑乘；“列祖”保留原文的传统和王朝色彩，脚注解释其安葬习语。
