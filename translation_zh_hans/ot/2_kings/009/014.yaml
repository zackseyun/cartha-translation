base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: zh_hans
  text: 于是，耶户——约沙法的儿子，宁示的孙子——密谋反叛约兰。当时，约兰和全以色列[a]都驻守在基列的拉末，防备亚兰[b]王哈薛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“全以色列”；在这里指与王一同驻守的以色列军队。
    reason: 说明军事语境中的集合称谓，同时保留正文原有表达。
  - marker: b
    text: “亚兰”传统上也译作“叙利亚”。
    reason: 交代传统译名，并保留希伯来文的民族地理名称。
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר ... אֶל יוֹרָם
  choice: 密谋反叛约兰
  rationale: קשר的反身词干在此政治语境中表示结党谋反；אֶל标明阴谋所针对的对象。“密谋反叛”自然表达敌对的政治行动，同时不把具体策划细节加入正文。
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: 宁示的孙子、约沙法的儿子
  rationale: 按现代汉语家谱表达调整次序，清楚保留耶户与父亲约沙法及祖父宁示的关系。
- source_word: הָיָה שֹׁמֵר
  choice: 当时……都驻守
  rationale: 完成式הָיָה加分词שֹׁמֵר提供叙事背景，表示当时持续进行的守卫行动。“驻守”贴合军事处境，也适合地点介词בְּ。
- source_word: בְּרָמֹת גִּלְעָד
  choice: 在基列的拉末
  rationale: 采用中文圣经地名的自然结构，表明拉末位于基列地区。
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: 约兰和全以色列
  rationale: 正文保留希伯来文的国家整体称谓，不直接窄化为“全军”；脚注说明军事语境中的所指。
- source_word: מִפְּנֵי חֲזָאֵל
  choice: 防备……哈薛
  rationale: מִפְּנֵי在这里说明守卫行动所面对的威胁。“防备”以自然汉语交代军事关系，同时避免误解为单纯因果。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 按希伯来文民族地理名称אֲרָם译作“亚兰”，不以较晚的“叙利亚”取代。
