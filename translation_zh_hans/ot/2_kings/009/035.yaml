base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: zh_hans
  text: 于是他们去埋葬她，却只找到她的头骨、双脚和双手的手掌。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“却发现她身上除了头骨、双脚和双手的手掌以外，什么也没有。”原文直译为“在她里面（或身上）没有找到”，在本语境中指她身体所剩的部分。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 于是他们去
  rationale: 该叙事性连续式推动事件向前发展；“于是”自然表达承接和结果意味。
- source_word: לְקָבְרָהּ
  choice: 埋葬她
  rationale: קבר的不定式附第三人称阴性单数词尾，指耶洗别；现代汉语直接译作“埋葬她”。
- source_word: וְלֹא מָצְאוּ בָהּ כִּי אִם
  choice: 却只找到她的
  rationale: לֹא…כִּי אִם构成排除表达；בָהּ在此按语境指她身体所剩的部分。“却只找到她的……”既自然，也保留“除……之外什么也没有找到”的意思。
- source_word: הַגֻּלְגֹּלֶת
  choice: 头骨
  rationale: גֻּלְגֹּלֶת在此指颅骨而非整个头部；“头骨”保留原文鲜明而冷峻的身体意象。
- source_word: וְהָרַגְלַיִם
  choice: 双脚
  rationale: רַגְלַיִם为双数形式，在此通常指两只脚；“双脚”准确而自然。
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: 双手的手掌
  rationale: כַּפּוֹת具体指手掌，而יָדָיִם为双数；译作“双手的手掌”保留原文的解剖部位细节，避免泛化为“双手”。
