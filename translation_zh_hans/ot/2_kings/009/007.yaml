base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: zh_hans
  text: 你要击杀你主人亚哈的家族；我要为我仆人——众先知——的血，以及雅威的一切仆人的血，向耶洗别[a]报仇。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从耶洗别手中”；这是表示耶洗别应为这些人的流血负责的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: 你要击杀
  rationale: נכה在此指对王室家族施行致命审判；“击杀”既保留动作力度，也比古雅的“击打”更清楚地表达语境中的致命含义。
- source_word: בֵּית אַחְאָב
  choice: 亚哈的家族
  rationale: בַּיִת在王室语境中指家族、宗族乃至王朝。“家族”在现代汉语中自然，也避免把它误解为房屋。
- source_word: אֲדֹנֶיךָ
  choice: 你主人
  rationale: 这里指耶户在人间的君主或上级，而非上帝；“主人”能保留从属关系，并避免与神圣称号混淆。
- source_word: וְנִקַּמְתִּי
  choice: 我要……追讨
  rationale: נקם表达上帝为受害者施行报应和公正追究。“追讨”与“所流的血”搭配自然，保留司法性和报应力度，又不把经文扩写成解释。
- source_word: דְּמֵי
  choice: 所流的血
  rationale: 复数形式“血”在希伯来语中可表示流血罪或被杀者的血；“所流的血”在汉语中自然，并保留血债与追讨的意象。
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: 我仆人众先知
  rationale: 该短语把众先知认定为上帝的仆人；这一表达简洁地保留同位关系。
- source_word: כָּל עַבְדֵי יְהוָה
  choice: 雅威所有仆人
  rationale: 忠实保留“所有”的范围和所属关系，并以“雅威”音译上帝的专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以头衔替代。
- source_word: מִיַּד אִיזָבֶל
  choice: 向耶洗别
  rationale: 原文“从耶洗别手中”是表示施害者及责任归属的习语；结合“追讨”，译作“向耶洗别”在现代汉语中清楚自然。
theological_decisions:
- issue: 上帝施行报复的措辞
  choice: 我要向耶洗别追讨……所流的血
  alternative: 我要为……所流的血报仇
  rationale: 原文明确把公正报应归于上帝。“追讨”保留上帝追究流血之罪的宣告，同时没有淡化或额外解释这种神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“亚哈的家族”传达王室家族或王朝的含义；“击杀”和“追讨所流的血”保留审判及血债意象。脚注标记置于“耶洗别”之后，与所解释的希伯来习语准确对应。
