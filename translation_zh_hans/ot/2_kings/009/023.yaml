  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
translation:
  language: zh_hans
  text: 约兰便转向逃跑，对亚哈谢说：“有诈[a]，亚哈谢！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“诡诈”或“背叛”。希伯来文此处的呼喊也可理解为“欺骗”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ יָדָיו
  choice: 掉转双手
  rationale: 按希伯来文保留“转动/掉转”与“他的双手”这一具体表达；结合战车场景，很可能指他用手调转战车，但原文没有明说缰绳或战车。
- source_word: וַיָּנֹס
  choice: 逃跑
  rationale: נוס在叙事中表示因危险而逃离；“逃跑”自然、直接，也传达动作的紧迫感。
- source_word: מִרְמָה
  choice: 有诈
  rationale: מִרְמָה可指诡诈、欺骗或背叛。这里是约兰察觉敌意后的急切警告；“有诈”在现代汉语中简洁自然，同时不把含义限定为政治性的“谋反”。
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: 亚哈谢
  rationale: 采用现代中文圣经人名的通行译法，并保留原文在引语末尾再次直呼其名的急迫语气。
- source_word: וַיֹּאמֶר אֶל אֲחַזְיָהוּ ... אֲחַזְיָה
  choice: 对亚哈谢说：“有诈，亚哈谢！”
  rationale: 保留“对亚哈谢说”的引语结构和末尾呼语中的姓名重复，反映希伯来文直接而紧迫的表达。
