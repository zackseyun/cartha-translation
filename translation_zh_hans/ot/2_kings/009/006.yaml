    text: 或译：“我膏立你作王。”这里的希伯来语完成式也可理解为在膏立仪式中当场生效的宣告。
    reason: 保留מְשַׁחְתִּיךָ既可指已经完成的膏立动作、也可具有施为作用的歧义。
