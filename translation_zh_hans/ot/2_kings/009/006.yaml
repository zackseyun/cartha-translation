revisions:
- from: 耶户就起来，进了屋里。那年轻先知把油倒在他头上，对他说：“以色列的上帝雅威如此说：‘我已经膏立你作王[a]，统治雅威的子民以色列。’”
  to: 耶户便起身，进了屋里。年轻的先知把油倒在他头上，对他说：“以色列的上帝雅威如此说：‘我已经膏立你作王，统治雅威的子民，就是以色列。’”
  rationale: 修改仅改善现代汉语的句法与文体。“就是以色列”明确保留原文中“雅威的子民”与“以色列”的同位关系；“便起身”更自然地对应叙事动词。其余关键术语、时态歧义及脚注均维持原有处理。
