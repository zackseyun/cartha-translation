base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: zh_hans
  text: 耶户便起身，进了屋里。年轻的先知把油倒在他头上，对他说：“以色列的上帝雅威如此说：‘我已经膏立你作王，统治雅威的子民，就是以色列。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם וַיָּבֹא הַבַּיְתָה
  choice: 耶户就起来，进了屋里
  rationale: 两个连续叙事动词表示相继发生的动作；方位词尾表明是进入屋内。为避免现代汉语中连续使用“他”造成施受关系混乱，按上文明确此处行动者为耶户。
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: 那年轻先知把油倒在他头上
  rationale: יצק意为“倒、浇”；定冠词所指的是为膏立预备的油。按叙事语境补明行动者，以免误读成耶户把油倒在自己头上。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传达神谕的固定使者公式，同时符合庄重的现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，区别于称号“主”。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 按希伯来语组合结构直译，保留雅威与以色列的关系表述。
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: 我已经膏立你作王
  rationale: משׁח在此指以油设立君王；“膏立”兼顾实际仪式和任命含义。完成式与刚完成的倒油动作相应，但在仪式宣告中也可有当场生效的施为作用。
- source_word: אֶל עַם יְהוָה אֶל יִשְׂרָאֵל
  choice: 统治雅威的子民以色列
  rationale: 此处两个אֶל短语说明受膏者作王所面对的群体或权柄范围；“以色列”与“雅威的子民”构成同位说明。汉语用“统治”自然表达君王治理其民的含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此正文保留其专名性质，不以称号替代。
- issue: מְשַׁחְתִּיךָ的时态与施为作用
  choice: 我已经膏立你作王
  alternative: 我膏立你作王
  rationale: 完成式可对应刚刚完成的倒油行动；同时这句话本身也是膏立仪式的有效宣告。正文采用完成表达，脚注保留施为式理解。
- issue: אֶל在王权任命语境中的关系
  choice: 统治雅威的子民以色列
  alternative: 作王归于雅威的子民、归于以色列
  rationale: 若机械译作“向、到”，现代汉语难以表达这里的任王关系；结合לְמֶלֶךְ，译作治理范围最能传达语境，同时不把“雅威的子民”和“以色列”拆成两个群体。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“膏立”是理解君王受膏仪式所需的传统词，但其搭配“作王”可让普通读者直接明白。为避免原文连续男性单数形式在汉语中产生错误的反身理解，依上下文明确写出“耶户”和“那年轻先知”；未改变事件参与者。
