revisions:
- from: 他们就赶紧各自拿下自己的外衣，铺在他身下、台阶的裸面上[a]；又吹响号角[b]，喊道：“耶户作王了！”
  to: 他们就赶紧各自脱下外衣，铺在他身下的台阶裸露处[a]；又吹响角号[b]，喊道：“耶户作王了！”
  rationale: 将“拿下”改为“脱下”，并重组铺衣短语为“铺在他身下的台阶裸露处”，使动作和地点关系清楚，同时保留גרם一词所带来的不确定性及其脚注。将“号角”细化为“角号”，并修订脚注b的术语说明，以更贴近שופר的指称和现代汉语用法。
