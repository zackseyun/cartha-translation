base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: zh_hans
  text: 他们就赶紧各自脱下外衣，铺在他身下的台阶裸露处[a]；又吹响角号[b]，喊道：“耶户作王了！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“台阶顶上”或“楼梯平台上”。这里的希伯来语说法罕见，确切含义不能确定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为“绍法尔”（shofar），指用来发信号的角制乐器，传统上译作“号角”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: 他们就赶紧
  rationale: מהר表示迅速行动；“就赶紧”既体现叙事承接，也传达众人立即响应。
- source_word: אִישׁ בִּגְדוֹ
  choice: 各自拿下自己的外衣
  rationale: אִישׁ在此作分配用法，意为“各自”；בֶּגֶד泛指衣服，此处是可脱下铺陈的外层衣物，译作“外衣”符合场景。
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: 铺在他身下
  rationale: 直译为“放在他下面”；结合衣物和拥立场景，用“铺”较自然。“他”保留原文代词，语境中最可能指耶户。
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: 台阶的裸面上
  rationale: גֶּרֶם在此是罕见且含义不确定的词，可能指台阶裸露的表面、台阶顶部或楼梯平台；正文采用较贴近词面且适合铺衣动作的译法，并以脚注保留其他可能。
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: 吹响号角
  rationale: שׁוֹפָר是用于发信号的角制乐器；“号角”在现代汉语中清楚自然，也不把材质限定为原文未明说的“羊角”。
- source_word: מָלַךְ יֵהוּא
  choice: 耶户作王了
  rationale: 完成式在此宣告登基已经发生；“作王了”既保留事件性，也符合公开拥立时的呼喊语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“拿下自己的外衣”避免“拿自己的外衣”可能暗示从别处取来；分号划分铺衣与吹角宣告两个连续动作。脚注标记放在各自所解释的词语之后。
