  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: zh_hans
  text: 狗必在耶斯列的地段[a]吃耶洗别；没有人埋葬她。”随后，他打开门逃走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在耶斯列的那片土地上”或“在耶斯列的地块上”。希伯来语“חֵלֶק”指一片或一块土地。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: 吃掉
  rationale: 保留 אכל“吃”的直接含义；加“掉”使现代汉语表达自然，并呈现彻底吞食的结果，但不采用更强烈、更具解释性的“吞噬”。
- source_word: הַכְּלָבִים
  choice: 狗
  rationale: 希伯来语带定冠词；现代汉语通常不以对应冠词表达此类已知或特指的群体，“狗”已自然传达其所指。
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: 在耶斯列的地界
  rationale: חֵלֶק 可指一片、一区或一份土地。“地界”在此自然表达耶斯列范围内的土地，同时不把它过度限定为某一小块田地。
- source_word: וְאֵין קֹבֵר
  choice: 无人埋葬她
  rationale: 原文直译近于“没有埋葬者”；依上下文补出宾语“她”，以简洁现代汉语表达预言性的结果。
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: 说完，他就打开门
  rationale: 叙事形式推进事件。“就”自然表现紧接着发生的动作；“说完”根据引语结束和主语连续关系补明衔接。
- source_word: וַיָּנֹס
  choice: 逃走了
  rationale: נוס 的核心义是“逃、逃走”；此译保留动作的急迫与简洁。
- source_word: אִיזֶבֶל
  choice: 耶洗别
  rationale: 采用现代中文圣经传统中通行且易识别的人名音译。
