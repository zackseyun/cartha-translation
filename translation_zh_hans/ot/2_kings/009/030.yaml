base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: zh_hans
  text: 耶户到了耶斯列，耶洗别听见这消息，就用眼黛描画眼睛，妆饰了头部，然后从窗户向外张望。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 表示耶户抵达耶斯列；“来到”自然地传达叙事中的移动，不额外限定为进入城内。
- source_word: יִזְרְעֶאלָה
  choice: 耶斯列
  rationale: 词尾的方向词素表示朝向耶斯列；汉语在“来到”之后直接接地名即可表达这一方向。
- source_word: שָׁמְעָה
  choice: 听见了
  rationale: 原文未明说所听见的内容，由上下文可知是耶户来到的消息；译文保留这种简略表达。
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: 用眼黛描眼
  rationale: פּוּךְ指涂在眼部的深色化妆品。“眼黛”简洁、具体地保留古代描眼习俗，且不泛化为脸部化妆。
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: 妆饰头发
  rationale: 该表达直译为“使她的头美好”，在语境中指整理、妆饰头部或头发；正文采用自然汉语，并以脚注保留原文较宽泛的说法。
- source_word: וַתַּשְׁקֵף
  choice: 向外张望
  rationale: 该动词表示从较高处或开口向外、向下观看；“向外张望”符合窗口场景，又不加入原文未明说的目的。
- source_word: בְּעַד הַחַלּוֹן
  choice: 从窗户
  rationale: בְּעַד在此表示隔着或透过窗口观看；现代汉语以“从窗户向外张望”最为自然。
