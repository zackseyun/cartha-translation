  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: zh_hans
  text: 他说：“把她扔下来！”他们就把她扔了下来。她有些血溅到了墙上和马身上。[a]耶户便把她践踏了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“她的血溅到了墙上和马身上。”希伯来文直译为“有血从她那里溅到墙上和马身上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו
  choice: 把她扔下来
  rationale: 此处是命令使耶洗别从窗口坠下；“扔下来”在现代汉语中自然、有力，也保留暴力色彩。
- source_word: וישמטוה
  choice: 他们就把她扔了下来
  rationale: 与前一句命令采用同一动词，保留希伯来文词根重复及立即执行命令的连贯性。
- source_word: ויז מדמה
  choice: 她的一些血溅在
  rationale: מן与“血”在此具有部分含义；译作“一些血”既自然，又忠实表达并非抽象地说全部血液。“溅”准确呈现血液飞散并落到附近表面的画面。
- source_word: אל הקיר ואל הסוסים
  choice: 在墙上和马身上
  rationale: 汉语谈及液体溅到动物时，“马身上”比单说“马上”更清楚自然；重复的介词以并列结构表达。
- source_word: וירמסנה
  choice: 耶户便把她践踏了
  rationale: רמס意为践踏。希伯来文动词为阳性单数，语法主语回指耶户，而非复数的马；明确写出“耶户”可避免汉语误读。“践踏”保留原文的残酷力度，具体借何种方式践踏则不作补充。
theological_decisions:
- issue: וירמסנה的主语
  choice: 明确为“耶户”
  alternative: 译作“他便把她践踏了”
  rationale: 希伯来文以阳性单数动词承接先前发令者耶户；明确人名消除现代汉语中可能出现的指代含混，但不增添马匹或战车等原文未明说的工具。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。保留命令与执行之间的动词重复，也不弱化原文的暴力描写。正文中的“她的一些血”自然表达希伯来文“从她的血中”的部分意味。
