base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/029.yaml
  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: zh_hans
  text: 亚哈的儿子约兰在位第十一年[a]，亚哈谢登基作犹大王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 列王纪和历代志有关约兰与亚哈谢统治年份的记载较难彼此协调；本译文按希伯来文本所写翻译，不在正文中尝试解决纪年问题。
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת אַחַת עֶשְׂרֵה שָׁנָה
  choice: 在位第十一年
  rationale: 这是希伯来语纪年惯用表达；省略句首连接词，使现代汉语自然流畅，并以“在位”明确这里以约兰的统治年数为纪年依据。
- source_word: לְיוֹרָם בֶּן אַחְאָב
  choice: 亚哈的儿子约兰
  rationale: לְ在王朝纪年公式中标示所参照的君王；“亚哈的儿子”忠实保留父名称谓，用以辨明这位约兰。
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 此处动词在纪年语境中指开始作王，而非概括整个统治时期；“登基作王”准确传达即位义。
- source_word: אֲחַזְיָה
  choice: 亚哈谢
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: עַל יְהוּדָה
  choice: 作犹大王
  rationale: מָלַךְ עַל表示统治某国；汉语以“作犹大王”自然表达其对犹大的王权。
theological_decisions:
- issue: 约兰与亚哈谢纪年的协调问题
  choice: 按马所拉文本直译为“约兰在位第十一年”
  alternative: 在正文中依据其他经文调整或解释纪年
  rationale: 列王纪与历代志相关纪年较难协调；翻译不应在正文中擅自消解文本张力，因此保留希伯来文本所写的纪年，并用脚注说明。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。“登基作犹大王”比单说“作王”更清楚地表达即位含义；脚注标记紧接争议纪年。
