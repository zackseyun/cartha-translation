base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: zh_hans
  text: 你到了那里，就在那里找宁示的儿子约沙法的儿子耶户。你要进去，把他从弟兄们[a]中叫起来，领他进入内室[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄们”也可指同伴或同僚；本段语境中可能是与耶户同在的军官。
    reason: lexical_ambiguity
  - marker: b
    text: 希伯来文直译为“房间中的房间”，即里面较隐秘的房间。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: 你到了那里
  rationale: בוא 可按叙述视角表示来、去或到达；这里先交代抵达地点，再发出下一项指令，译作“到了那里”自然清楚。
- source_word: וּרְאֵה שָׁם
  choice: 就在那里找
  rationale: ראה 本义为“看、看见”，在后接特定人名的指令中有寻找并认出该人的意思；保留 שָׁם“在那里”，也体现原文对地点的重复强调。
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: 约沙法的儿子、宁示的孙子耶户
  rationale: 按现代汉语习惯表达连续家谱关系，同时准确保留耶户—约沙法—宁示三代关系。
- source_word: וּבָאתָ
  choice: 你要进去
  rationale: 第二个 בוא 位于找到耶户之后，语境指向进入他所在的聚集处；“进去”自然呈现这一步行动。
- source_word: וַהֲקֵמֹתוֹ
  choice: 把他……叫起来
  rationale: קום 的使役式表示使人起身或站起；“叫起来”符合当面吩咐某人离开座位或群体的场景。
- source_word: מִתּוֹךְ אֶחָיו
  choice: 从弟兄们中
  rationale: אחים 字面为“弟兄们”，在此也可能泛指同伴或同僚；正文保留源词的具体表达，并以脚注说明语境可能性。
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: 领他进入
  rationale: בוא 的使役式可表示带来、领去；按行动者与内室的空间关系，“领他进入”比单说“带来”更自然。
- source_word: חֶדֶר בְּחָדֶר
  choice: 内室
  rationale: 该叠合结构字面是“房间中的房间”，指较里面、较隐密的房间；正文采用简洁自然的“内室”，字面形式保留于脚注。
theological_decisions: []
translation_notes:
