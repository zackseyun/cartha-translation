  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: zh_hans
  text: 于是，那年轻人——就是那先知的年轻随从——往基列的拉末去了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 于是……去了
  rationale: 未完成式动词前的叙事性 וַ 推进事件次序；“于是”自然表达承接上文、随即行动的语气。
- source_word: הַנַּעַר
  choice: 那年轻人
  rationale: נַעַר 在此首先指受差遣的年轻男子；“年轻人”既贴近基本词义，也不预先限定他是仆人或随从。
- source_word: הַנַּעַר הַנָּבִיא
  choice: 那年轻人，那位年轻的先知
  rationale: 希伯来文重复 הַנַּעַר，随后以 הַנָּבִיא 同位说明其身份。译文保留重复和同位结构，不改写为原文未明说的“先知的仆人”。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 按中文圣经地名的通行形式音译该复合地名，并以“的”表明拉末位于基列。
theological_decisions:
- issue: 年轻人的先知身份
  choice: 译作“那位年轻的先知”，让 הַנָּבִיא 与年轻人构成同位关系
  alternative: “先知的仆人／随从”
  rationale: 马所拉文本没有表示所属关系的显式形式；译作“先知的仆人”会加入解释。正文依照现存希伯来语措辞，同时以脚注提示其不寻常的重复。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接上文命令，“往……去了”符合自然汉语；正文特意保留原文的重复感。
