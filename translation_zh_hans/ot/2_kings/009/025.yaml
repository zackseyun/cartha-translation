  terminology: “比德迦”“耶斯列人拿伯”“亚哈”及“雅威”一致且恰当。“军官”是对不确定职衔的可接受概括；脚注保留“第三人”的替代理解。“宣告”配合脚注对 מַשָּׂא 的说明，可接受。
