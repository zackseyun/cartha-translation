  to: 耶户对他的军官比德迦[a]说：“抬起他来，把他扔在耶斯列人拿伯那块田地上。因为你要记得，当年你我曾一同骑马，跟在他父亲亚哈后面时，雅威曾针对他发出这番宣告[c]。”
