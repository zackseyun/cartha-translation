source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: zh_hans
  text: 耶户对他的军官比德迦[a]说：“抬起他来，把他扔在耶斯列人拿伯那块田地上。因为你要记得，当年你我曾一同骑马，跟在他父亲亚哈后面时，雅威曾针对他发出这番宣告[c]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“他的第三人”。这可能是比德迦军阶或职务的专门称呼。
    reason: lexical_alternative
  - marker: c
    text: 或译“神谕”或“重担”。这个希伯来词指分量沉重的先知性宣告。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: 比德迦
  rationale: 按现代普通话常用的圣经人名音译方式处理专名。
- source_word: שלשה
  choice: 他的军官
  rationale: 结合书写与诵读传统及上下文，将其理解为比德迦的职衔；“军官”自然易懂，同时不把具体军阶限定得过死。
- source_word: שָׂא
  choice: 把他抬起来
  rationale: 命令式；此处指把约兰的尸体抬起，以便从车上移走并丢进田里。
- source_word: הַשְׁלִכֵהוּ
  choice: 扔到
  rationale: 保留命令直接而有力的语气，并与后面的地点短语自然衔接。
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: 那块田里
  rationale: חֶלְקָה 指划分出的一块地，שָׂדֶה 表明是田地；现代汉语以“那块田”自然表达二者。
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: 耶斯列人拿伯
  rationale: 按汉语习惯先称籍贯或族属，再称人名。
- source_word: זְכֹר
  choice: 你要记得
  rationale: 保留命令式，清楚引出耶户要求比德迦回想的往事。
- source_word: רֹכְבִים צְמָדִים
  choice: 并骑
  rationale: 原文直译近于“成对骑行”；“并骑”简洁表达两人一起随行，同时以脚注保留原文表达及其解释空间。
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: 跟在他父亲亚哈后面
  rationale: “他父亲”指被抛尸的约兰之父亚哈；译文保留原文代词指向，不额外改写成人名。
- source_word: וַיהוָה
  choice: 雅威
  rationale: 以音译呈现四字神名 יהוה。
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: 曾针对他发出这番宣告
  rationale: מַשָּׂא 在此指带有审判意味的沉重先知宣告；“针对他”保留 עָלָיו 的不利指向，“发出”则使汉语自然。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”音译，以明确呈现其专名性质。
- issue: מַשָּׂא 的先知性含义
  choice: 宣告
  alternative: 神谕；重担
  rationale: 该词兼有“重担”与庄严、沉重的先知话语之意；正文用普通读者易懂的“宣告”，脚注说明其可能译法，不把意象或语义范围静默缩窄。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。命令语气保持直接；叙事关系清楚，但对职衔、骑行方式和 מַשָּׂא 的多义性均以脚注保留，不在正文中过度判定。
