base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: zh_hans
  text: 你要拿那瓶油，倒在他头上，说：‘雅威如此说：我已经膏立你为以色列的王[a]。’然后打开门逃走，不要耽搁。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“作王，向（或到）以色列”；在这里的王权任命公式中，意思是“作以色列的王”。
    reason: 说明介词אֶל的字面形式与上下文中的实际关系。
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: 这瓶油
  rationale: פַךְ指盛液体的小容器；“瓶”在现代汉语中自然简洁。הַשֶּׁמֶן只明确说“油”，不擅自增译为“橄榄油”或“膏油”。
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: 倒在他头上
  rationale: יצק与עַל连用，表示把液体倒在某物之上；此译直接保留动作及落点。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重语气，并将神名יְהוָה音译为“雅威”。
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: 我已经膏你作……的王
  rationale: 完成式מְשַׁחְתִּיךָ按礼仪宣告的既成行动译为“已经膏你”；לְמֶלֶךְ表示任命担任王职，译作“作……的王”符合汉语习惯。
- source_word: אֶל יִשְׂרָאֵל
  choice: 以色列的王
  rationale: 介词אֶל字面通常有“向、到”之意，但在此王权任命公式中表达对以色列的统治关系；“以色列的王”是自然汉语，并以脚注保留原文形式。
- source_word: וּפָתַחְתָּ הַדֶּלֶת וְנַסְתָּה
  choice: 然后打开门逃走
  rationale: 连续动词构成依次执行的指令；“然后”清楚表达顺序，נוס译为“逃走”保留紧迫和避险意味。
- source_word: וְלֹא תְחַכֶּה
  choice: 不要耽搁
  rationale: חכה在此表示停留或等候；结合立即逃走的命令，“不要耽搁”比单纯“不要等候”更自然地传达紧迫性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”按较通行的学术拟音保留其专名性质，而不以“主”这一称号代替。
- issue: 膏立宣告中完成式מְשַׁחְתִּיךָ的时态
  choice: 我已经膏你
  alternative: 我膏你
  rationale: 译出希伯来语完成式的完成意味，同时不排除这句话本身具有施行膏立的宣告功能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“如此说”保留先知宣告的正式语体；末句用“不要耽搁”体现命令的紧迫感。脚注标记置于其实际所说明的“以色列的王”之后。
