revisions:
- from: 约兰吩咐说：“套车！”于是有人给他的战车套好了牲口。[a]以色列王约兰和犹大王亚哈谢就各自乘着战车出去迎见耶户；他们在耶斯列人拿伯的那块田地上遇见了他。
  to: 约兰说：“套车！”于是就把他的战车套好了。[a]以色列王约兰和犹大王亚哈谢各乘自己的战车出去迎见耶户；他们在耶斯列人拿伯的那块地上遇见了他。
