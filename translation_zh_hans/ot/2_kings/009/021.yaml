base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: zh_hans
  text: 约兰说：“套车！”于是就把他的战车套好了。[a]以色列王约兰和犹大王亚哈谢各乘自己的战车出去迎见耶户；他们在耶斯列人拿伯的那块地上遇见了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“他套了他的战车”；这里很可能是指侍从奉命把战车套好。
    reason: 保留动词第三人称阳性单数的形式，同时说明其在王室命令场景中的可能含义。
lexical_decisions:
- source_word: אֱסֹר
  choice: 套车！
  rationale: 这是动词 אסר 的单数命令式；在战车语境中，指把拉车的牲口套上。“套车”简洁自然，也保留命令的急迫感。
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: 于是有人给他的战车套好了牲口
  rationale: 希伯来文形式上是第三人称阳性单数“他套了他的战车”，紧接前面的命令，语境很可能指受命的侍从执行命令。译作“有人给……套好了牲口”避免误解为王亲自动手，并以脚注保留原文形式。
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: 各自乘着战车
  rationale: אִישׁ 在这里有逐一、分配意义，表示两位王分别乘坐自己的战车；“各自乘着战车”符合现代汉语。
- source_word: לִקְרַאת יֵהוּא
  choice: 出去迎见耶户
  rationale: לִקְרַאת 表示朝某人而去、与其会面。“迎见”既传达主动出去相会，也不预先规定会面的友敌性质。
- source_word: וַיִּמְצָאֻהוּ
  choice: 遇见了他
  rationale: מצא 在叙事中可指“找到”或“遇上”。此处双方相向而行，“遇见”比“找到”更自然，同时保留相遇之意。
- source_word: בְּחֶלְקַת נָבוֹת
  choice: 在……拿伯的那块田地上
  rationale: חֶלְקָה 指一块划定的土地或产业。“那块田地”自然易懂，并借指示词唤起前文拿伯产业的特定背景。
- source_word: הַיִּזְרְעֵאלִי
  choice: 耶斯列人
  rationale: 该族称表明拿伯是耶斯列人；采用简洁、通行的汉语表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“套车”保留原文命令的简短急促；“迎见”与“遇见”避免添加原文未明说的敌对意味。专名采用中文圣经中通行的译法。
