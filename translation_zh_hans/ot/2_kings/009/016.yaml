  text: וַ/יִּרְכַּ֤ב יֵהוּא֙ וַ/יֵּ֣לֶךְ יִזְרְעֶ֔אלָ/ה כִּ֥י יוֹרָ֖ם שֹׁכֵ֣ב שָׁ֑מָּ/ה וַֽ/אֲחַזְיָה֙ מֶ֣לֶךְ יְהוּדָ֔ה יָרַ֖ד לִ/רְא֥וֹת אֶת יוֹרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: zh_hans
  text: 于是，耶户登乘[a]，前往耶斯列，因为约兰正躺在那里；犹大王亚哈谢已经下去探望约兰[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“骑上去”或“骑行”。原文只说明耶户登乘／骑乘，没有说明所乘的是车、马或其他坐骑。
    reason: lexical_alternative
  - marker: b
    text: 直译“去看约兰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: 上了车
  rationale: רכב表示登乘或骑乘。上下文涉及耶户乘车，但本节原文没有明说所乘之物；正文采用自然的汉语表达，并以脚注保留“骑上坐骑”的可能。
- source_word: וַיֵּלֶךְ
  choice: 前往
  rationale: הלך是常用的“去、行走”；与目的地“耶斯列”连用时，“前往”自然庄重，也与前面的登乘动作有所区别。
- source_word: יִזְרְעֶאלָה
  choice: 前往耶斯列
  rationale: 地名后的方向词尾表示朝向耶斯列，汉语用“前往”表达。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出耶户前往耶斯列的原因，明确译出因果关系。
- source_word: שֹׁכֵב שָׁמָּה
  choice: 正躺在那里
  rationale: שֹׁכֵב是表示持续状态的分词，字面为“躺着”；不进一步解释为卧病或卧床，以免超出本节措辞。
- source_word: יָרַד
  choice: 已经下去
  rationale: ירד含“下去、下到”的方向意味；完成式在此表示相对于耶户出发已经发生的行动。
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: 探望约兰
  rationale: 字面是“去看约兰”，在探视受伤之王的语境中自然表达为“探望”；脚注保留直译。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 按现代汉语对王号与地域的惯常表达翻译该属格结构。
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: 耶户／约兰／亚哈谢／耶斯列／犹大
  rationale: 采用现代简体中文圣经传统中通行且易于辨识的人名、地名译法。
theological_decisions: []
