  source_fidelity: “宁示的孙子耶户”虽然与本章9:2所列家谱相协调，但本节希伯来文明确写作“耶户，宁示的儿子”（בן־נמשי）。在没有译注说明“儿子”可作后代称谓的情况下，将其直接改为“孙子”超出了本节字面措辞。其余主要信息——守望者的报告、使者到了他们那里却未返回、以及以狂乱的赶车方式辨认耶户——均得到保留。
  naturalness: “守望者”比“守望的人”更凝练自然。“他赶得像发狂一样”略显生硬；“他赶车赶得发狂似的”是现代标准汉语中自然、庄重且保留原文强烈语气的说法。
  terminology: “赶车”在此战车叙事中恰当；“宁示的儿子耶户”应按本节父子称谓直译。为保留בְּשִׁגָּעוֹן可译为“发狂似的／疯狂地／带着狂乱”的语义范围，宜在该短语处设置译注，而非附在“报告”上。
  issues:
