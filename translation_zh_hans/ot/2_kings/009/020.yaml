    rationale: 本节希伯来文的常规字面意义是“宁示的儿子”。跨节家谱可说明宁示是耶户祖父，但不能无注直接以“孙子”替换本节的称谓；应译“儿子”，并在注中说明该词在家谱称谓中也可泛指后代。
