base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: zh_hans
  text: 守望者报告说：“他已经到了他们那里，却没有回来。那赶车的样子，像宁示的儿子耶户赶车的样子，因为他赶车赶得发狂似的[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“因为他疯狂地赶车”或“因为他带着狂乱赶车”。“发狂似的”形容耶户赶车时狂乱、鲁莽的样子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 报告
  rationale: 在城楼守望和军情传递的语境中，“报告”自然地表达守望者向王传达观察结果。
- source_word: הַצֹּפֶה
  choice: 守望的人
  rationale: 指受命观察来者的人；这一表达通俗清楚，也符合叙事语境。
- source_word: בָּא עַד אֲלֵיהֶם
  choice: 他已经到了他们那里
  rationale: 表达使者已抵达那一队人所在之处；“已经”体现此事对当前情况的影响。
- source_word: וְלֹא שָׁב
  choice: 却没有回来
  rationale: “回来”准确表达 שוב，并以“却”呈现与预期相反的转折。
- source_word: וְהַמִּנְהָג כְּמִנְהַג
  choice: 那赶车的样子，像……赶车的样子
  rationale: 保留希伯来文对“赶车方式”的重复，同时用现代汉语可理解的“样子”表达 מִנְהָג。
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: 宁示的孙子耶户
  rationale: 按本章家系背景及希伯来圣经常见的祖先称谓处理；בֶן 字面可指“儿子”，但耶户在列王纪下9:2被称为宁示的孙子。
- source_word: כִּי בְשִׁגָּעוֹן יִנְהָג
  choice: 因为他赶得像发狂一样
  rationale: 既保留 כִּי 的解释作用，也传达 בְשִׁגָּעוֹן 所表示的狂乱、近乎失控的赶车方式，而不把它弱化为单纯“很快”。
