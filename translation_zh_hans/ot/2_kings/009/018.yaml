base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: zh_hans
  text: 骑马的人就去迎他，对他说：“王这样说：‘平安吗？’”[a] 耶户说：“平安与你有什么相干？转到我后面去！”[b] 守望者报告说：“使者已经到了他们那里，却没有回来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“一切都好吗？”希伯来文两处都使用“平安”一词。
    reason: lexical_alternative
  - marker: b
    text: 也可意译：“转过去，跟在我后面。”原文直译为“转到我后面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: 骑马的人
  rationale: 原文直译为“骑马者”；“骑马的人”在现代汉语中自然清楚，也符合军中使者的语境。
- source_word: לִקְרָאתוֹ
  choice: 去迎他
  rationale: 该结构表示朝某人而去、与其会面；“去迎他”简洁保留了动作方向。
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: 王这样说
  rationale: 保留原文正式的传话公式，同时采用现代汉语自然表达。
- source_word: הֲשָׁלוֹם
  choice: 平安吗
  rationale: שָׁלוֹם在此可问是否安好、局势是否平安；译作“平安吗”保留了本段反复出现的关键词及其含义张力。
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: 平安与你有什么相干
  rationale: 这是表示斥退或拒绝对方过问的惯用说法；译文既传达语气，也保留“平安”一词的重复。
- source_word: סֹב אֶל אַחֲרָי
  choice: 转到我后面去
  rationale: 贴近原文“转向我后面”的空间表达，不在正文中直接把可能隐含的军事动作解释为“跟在我后面”。
- source_word: הַצֹּפֶה
  choice: 守望的人
  rationale: 指从高处观察动静的人；此译法准确易懂，并符合叙事语境。
- source_word: הַמַּלְאָךְ
  choice: 使者
  rationale: 本历史叙事中指奉命传话的人，不是天使。
- source_word: בָּא ... עַד הֵם
  choice: 已经到了他们那里
  rationale: 表达使者抵达那群人所在之处；“到了他们那里”是自然的现代汉语。
- source_word: וְלֹא שָׁב
  choice: 却没有回来
  rationale: 从守望者当时观察所得的结果来叙述；“却”清楚呈现预期与实际情况的反差。
theological_decisions:
- issue: שָׁלוֹם在问话与耶户回答中的多义性和重复
  choice: 两处均译作“平安”
  alternative: 第一处译作“一切都好吗”，第二处译作“平安”
  rationale: 统一译词可保留希伯来文刻意重复的关键词，并让读者感受到它可同时涉及安好、和平与局势是否安定，而不替原文消除这种张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“王这样说”的正式传话语气，并以“平安”贯穿问答；正文贴近原文的空间措辞，脚注补充较具解释性的表达。
