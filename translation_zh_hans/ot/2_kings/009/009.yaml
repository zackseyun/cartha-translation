base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: zh_hans
  text: 我要使亚哈的家像尼八的儿子耶罗波安的家，又像亚希雅的儿子巴沙的家。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚哈的家……耶罗波安的家……巴沙的家”也可译作“亚哈王朝……耶罗波安王朝……巴沙王朝”。这里的“家”指王室或王朝。
    reason: 说明希伯来文“家”在王室语境中的含义及可选译法。
lexical_decisions:
- source_word: וְ/נָֽתַתִּי
  choice: 我要使
  rationale: נתן本义为“给、放置”，但在此处带直接宾语并接比较结构，表达“使……成为与……一样的结局”；译作“使”符合现代汉语，也保留其致使意味。句首连接词按中文篇章衔接不另译。
- source_word: בֵּית אַחְאָב
  choice: 亚哈家
  rationale: בַּיִת在这里指君王的家族、王室或王朝。“亚哈家”保留希伯来文“家”的比喻和经文之间的呼应，具体含义以脚注说明。
- source_word: כְּ/בֵית יָרָבְעָם בֶּן נְבָט
  choice: 像尼八的儿子耶罗波安家
  rationale: 前缀כְּ־表示比较，译作“像”；父子关系依原文直译，并保留“家”的王室意象。
- source_word: וּ/כְ/בֵית בַּעְשָׁא בֶן אֲחִיָּה
  choice: 又像亚希雅的儿子巴沙家一样
  rationale: וּ־与כְּ־合起来表达并列的第二项比较。“又像……一样”在现代汉语中自然，并清楚维持平行结构。
- source_word: אֶת
  choice: 不单独译出
  rationale: אֶת是确定直接宾语标记，现代汉语无需以独立词语表达。
theological_decisions:
- issue: 王室审判公式中“家”的译法
  choice: 亚哈家……耶罗波安家……巴沙家
  alternative: 亚哈王朝……耶罗波安王朝……巴沙王朝
  rationale: 原文以“家”指王族或王朝，并借先前覆灭的王室宣告审判。正文保留这一圣经意象和历史呼应，不把解释直接替代原文；脚注说明其语境含义。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“我要使……像……又像……一样”清楚表达审判性的比较；人名依简体中文圣经通行译名处理。
