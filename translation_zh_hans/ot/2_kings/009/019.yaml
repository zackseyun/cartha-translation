base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: zh_hans
  text: 他又派出第二个骑马的人。那人到了他们那里，说：“王如此说：‘平安吗？’[a]”耶户却说：“你与平安有什么相干？转到我后面去！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安”也可译作“安好吗？”希伯来语 שָׁלוֹם 可指和平、安好或福祉。
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: 第二个骑马的人
  rationale: 原文直译为“第二个骑马者”。此译法既保留其作为骑马信使的身份，也避免把原文未明说的军事身份限定为“骑兵”。
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: 王如此说
  rationale: 保留正式的王命传话格式，同时用现代汉语中庄重而易懂的表达。
- source_word: שָׁלוֹם
  choice: 平安
  rationale: 该词可指和平、安好或局势顺遂；译作“平安”既保留语义幅度，也维持问话与耶户回答中的词语重复。
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: 你与平安有什么相干
  rationale: 保留希伯来语质问句的结构和耶户拒斥信使所问之事的强硬语气，不把其含义过度解释为单一意思。
- source_word: סֹב אֶל אַחֲרָי
  choice: 转到我后面去
  rationale: 贴近原文“转向我的后面”，保留空间方位及加入耶户队伍这两层可能理解，不直接扩译为“跟随我”。
theological_decisions: []
