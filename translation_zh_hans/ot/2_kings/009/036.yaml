base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: zh_hans
  text: 于是他们回来告诉他；他说：“这是雅威的话，是他借着自己的仆人提斯比人以利亚所说的：‘在耶斯列的地界[a]，狗必吃耶洗别的肉。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “地界”也可译作“地段”或“一块地”；希伯来词可指划分出来的一片土地。
    reason: 保留 חֵלֶק 的词义范围，说明它既可能泛指地域，也可能指较具体的地块。
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: 于是他们回来告诉他
  rationale: 保留连续叙事动作及原文第三人称代词，不在正文中补出原文未明说的姓名；“于是”符合现代汉语叙事衔接。
- source_word: דְּבַר יְהוָה הוּא
  choice: 这是雅威的话
  rationale: 用自然汉语表达无动词判断句的强调，并保留“话”作为先知宣告的核心用语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其作为上帝专名的性质，而不以称号替代。
- source_word: בְּיַד עַבְדּוֹ
  choice: 借着自己的仆人
  rationale: ביד在此表示先知传话的媒介或代理；“借着”准确而自然。“自己的”清楚指回雅威，又不增加新的神学含义。
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: 提斯比人以利亚
  rationale: 按现代汉语圣经人名习惯音译，并以“提斯比人”表达其地域称谓。
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: 在耶斯列的地界
  rationale: חֵלֶק可指一片土地、地段或地域；正文采用较宽泛的“地界”，避免无依据地限定为某一块小田地，并以脚注保留其他可能。
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: 狗必吃
  rationale: 直译动词“吃”，保留预言简短、鲜明的语气；“必”自然表达此处未完成式的将来确定性。
- source_word: בְּשַׂר אִיזָבֶל
  choice: 耶洗别的肉
  rationale: בשר具体指“肉”，不弱化为“身体”，从而保留审判宣告中刻意呈现的惨烈意象。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留专名性质，不用称号“主”取代，也不把较晚形成的混合读音作为正文。
- issue: “这是雅威的话”所指的范围
  choice: 保留原文的概括性表达
  alternative: 改写为“这应验了雅威的话”
  rationale: 上下文确有应验之意，但本节原文只说“这是雅威的话”，没有明说“应验”；正文不替作者消除这种简洁表达所留下的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。句式保留先知叙事的简洁和引语层次；避免生硬照搬“借着……的手”这一希伯来习语，也不补出原文未明说的主语姓名。
