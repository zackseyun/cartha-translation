  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: zh_hans
  text: 耶洗别的尸体必像粪土一样，在耶斯列那片田地上，以致没有人能说：“这就是耶洗别。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: 必……
  rationale: 在先知宣告的语境中，带连接词的完成式承接上文，表达将来必然发生的事；“必”既自然，也保留宣告的确定语气。
- source_word: נִבְלַת אִיזֶבֶל
  choice: 耶洗别的尸体
  rationale: נִבְלָה指死尸或尸首；“尸体”是现代汉语中自然、庄重且仍保留原文惨烈意味的表达。人名按通行译名译作“耶洗别”。
- source_word: כְּדֹמֶן
  choice: 像粪土一样
  rationale: דֹּמֶן指粪便或粪肥；“粪土”直接保留贬抑而鲜明的比喻，也符合现代汉语表达。
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: 散在……田地的地面上
  rationale: 原文直译为“在田地表面上”。根据尸体如粪土的语境补出“散在”，使空间图景在汉语中清楚自然；“地面上”对应“在……表面”。
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: 耶斯列田地
  rationale: חֵלֶק可指一片地域、地段或具体田块。正文采用简洁的“田地”，同时以脚注保留“地界/地段”的词义可能。地名按通行译名作“耶斯列”。
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: 以致没有人能说
  rationale: 关系词在此可表达结果：尸体将被毁坏、散落到无法辨认。“以致”清楚呈现结果关系；非特指复数主语自然译为“没有人”。
- source_word: זֹאת אִיזָבֶל
  choice: 这就是耶洗别
  rationale: 保留原文简单直接的指认句式，并用“就是”表达汉语中的身份确认。
theological_decisions: []
