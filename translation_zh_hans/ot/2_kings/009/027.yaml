  to: 犹大王亚哈谢看见这情形，就从通往伯哈干[a]的路逃走。耶户追赶他，说：“也要击打他，就在战车上[b]，在靠近以伯莲的姑珥坡上！”亚哈谢逃到米吉多，死在那里。
