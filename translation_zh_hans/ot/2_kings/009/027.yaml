  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: zh_hans
  text: 犹大王亚哈谢看见这情形，就从通往伯哈干[a]的路逃走。耶户追赶他，说：“也要击打他，就在战车上[b]，在靠近以伯莲的姑珥坡上！”亚哈谢逃到米吉多，死在那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯哈干”可能意为“园子的房屋”，但这里很可能是地名，所以采用音译。
    reason: cultural_note
  - marker: b
    text: 或译“朝战车击打他”。这里的希伯来介词含义较灵活，既可表示所在之处，也可表示方向。
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: 看见了
  rationale: 希伯来文未明说宾语；中文可自然省略，使所见之事由上下文补足，不额外限定为某一具体场景。
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: 从通往伯哈干的路
  rationale: דֶּרֶךְ 表示道路；בֵּית הַגָּן 在此最可能是地名，采用传统而易辨认的音译“伯哈干”。
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: 追赶他
  rationale: 准确表达 רדף אַחַר 的追逐含义，同时符合现代汉语习惯。
- source_word: גַּם אֹתוֹ
  choice: 也……他
  rationale: 保留 גַּם 的追加意味，即亚哈谢也要受到攻击。
- source_word: הַכֻּהוּ
  choice: 击中他
  rationale: נכה 的语义范围是击打、击中；“击中”既符合追击战车的场景，也不把命令过度解释成明确的“杀死”。
- source_word: אֶל הַמֶּרְכָּבָה
  choice: 在战车上
  rationale: אֶל 通常有朝向之意，此处也可按上下文表示攻击发生的所在；正文采用较通顺的地点理解，并以脚注保留方向性解释。
- source_word: בְּמַעֲלֵה גוּר
  choice: 在……上姑珥的坡道那里
  rationale: מַעֲלֶה 指上坡处或坡道；此译保留地形信息，并将 Gur 音译为“姑珥”。
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: 靠近以伯莲
  rationale: 该短语说明姑珥坡与以伯莲的空间关系；“靠近”自然表达邻近位置，而不强定更精确的方位。
- source_word: וַיָּנָס מְגִדּוֹ
  choice: 他却逃到米吉多
  rationale: נוס 表示逃跑，地名在此自然理解为逃亡目的地；“却”体现受击后仍逃走的转折。
- source_word: וַיָּמָת שָׁם
  choice: 死在那里
  rationale: 直接保留事件结果和地点指示。
theological_decisions: []
