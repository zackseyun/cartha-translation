base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: zh_hans
  text: 以利沙先知叫一个先知门徒来[a]，对他说：“束紧腰带[b]，手里拿着这瓶油，到基列的拉末去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“先知们的儿子”；这是指先知群体的成员或门徒，不一定是先知的亲生儿子。
    reason: cultural_note
  - marker: b
    text: 原文直译为“束起你的腰”，指把长衣束好，准备行动或赶路。
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: 先知以利沙
  rationale: וְ承接叙事，在本节开头不必机械译作“然后”；定冠词所标明的身份称谓自然译为“先知以利沙”。
- source_word: קָרָא לְאַחַד
  choice: 叫来一个
  rationale: קרא的基本义为“叫、呼唤”；结合随后当面吩咐的语境，“叫来”符合现代汉语，又不强化为正式“召见”。
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: 先知门徒
  rationale: 字面是“先知们的儿子中的一个”，但该固定表达指先知群体的成员或受教者，并不必然指亲生儿子；正文采用清楚自然的功能性表达，脚注保留字面信息。
- source_word: חֲגֹר מָתְנֶיךָ
  choice: 束紧腰带
  rationale: 字面为“束起你的腰”，指束好长衣以便迅速行动或赶路。“束紧腰带”保留身体动作的具体意象，并由脚注说明其语用含义。
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: 这瓶油
  rationale: פַּךְ指盛油的小瓶或小壶；“这瓶油”是简洁自然的现代汉语，也保留了指示词。
- source_word: בְּיָדֶךָ
  choice: 手里拿着
  rationale: 保留原文“在你手中”的具体表达，同时按汉语习惯与“拿”连用。
- source_word: רָמֹת גִּלְעָד
  choice: 基列的拉末
  rationale: 地名按现代中文圣经常见形式处理，并把构词关系自然表达为“基列的拉末”。
