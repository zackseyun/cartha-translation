base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: zh_hans
  text: 耶户进去，吃了喝了，然后说：“请你们去料理这个受咒诅的女人[a]，把她埋葬，因为她是王的女儿。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这个被咒诅的人”。
    reason: 原文使用阴性单数形式指耶洗别，可以明确译作“女人”，也可较概括地译作“人”。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 耶户进去
  rationale: בוא在此指耶户进入屋内或宫中。中文补出叙事中明确的主语“耶户”，使单节独立阅读时清楚；“进去”自然保留方向意义。
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: 吃了喝了
  rationale: 原文两个动词均未带宾语，因此不增添“酒”等原文未明说的内容；此表达也保留简洁的连续叙事节奏。
- source_word: פִּקְדוּ נָא
  choice: 你们去料理一下
  rationale: פקד在这里表示留意并着手处置某事；结合下文安葬尸身，“料理”比“照看”更切合语境。“一下”自然体现נָא缓和命令语气的作用，而不是把它强化为严厉命令。
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: 这个受咒诅的女人
  rationale: 原词为阴性单数，语境明确指耶洗别；“女人”将希伯来语形态所表达的女性指称自然显明。“受咒诅”保留被咒诅的状态，不另行解释咒诅的来源。
- source_word: וְקִבְרֻהָ
  choice: 把她埋葬
  rationale: 直接表达带第三人称阴性单数后缀的命令，现代汉语自然清楚。
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: 因为她是王的女儿
  rationale: כִּי引出要求安葬她的理由；无冠词的מֶלֶךְ强调其王室身份，中文“王的女儿”不额外指定是哪一位王。
