base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: zh_hans
  text: 守望的人站在耶斯列的塔楼上，看见耶户的一队人前来，就说：“我看见一队人。”约兰说：“派一名骑马的人去迎接他们，让他问：‘平安吗？’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一切都好吗？”
    reason: 说明הֲשָׁלוֹם在此也可作为询问情况是否安好的惯用表达。
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: 守望的人
  rationale: 指负责警戒、瞭望的人；此译自然明确，也不引入先知含义。
- source_word: עֹמֵד עַל הַמִּגְדָּל
  choice: 站在……城楼上
  rationale: 分词表达持续的背景状态；מִגְדָּל基本义为“塔楼”，在城防场景中译作“城楼”符合现代汉语。
- source_word: בְּיִזְרְעֶאל
  choice: 在耶斯列
  rationale: 采用该地名在中文圣经传统中的通行音译。
- source_word: שִׁפְעַת
  choice: 一大队人
  rationale: 该词表示数量众多、聚成一片的人群；上下文是耶户率众赶来，译作“一大队人”既呈现可见群体，也保留数量感。
- source_word: בְּבֹאוֹ
  choice: 正赶来
  rationale: 介词加不定词结构表达耶户来到时的动态；“正赶来”自然呈现其正在接近耶斯列。
- source_word: קַח רַכָּב
  choice: 派一个骑兵
  rationale: 字面结构为“取一个骑乘者”，语境指派出一名骑马的使者；中文以“派一个骑兵”承接后面的“去迎接”更自然。
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: 去迎接他们
  rationale: 保留马所拉文本的复数后缀“他们”，所指是守望者看到的整队人。
- source_word: הֲשָׁלוֹם
  choice: 平安吗？
  rationale: 保留原文极简的询问形式和本段反复出现的“平安”主题，不明确限定为问候、状况或来意。
theological_decisions:
- issue: הֲשָׁלוֹם所问的具体含义
  choice: 正文译作“平安吗？”
  alternative: “一切都好吗？”或“你们是为和平而来吗？”
  rationale: 原文刻意简短，可询问情势是否安好，也可探问对方是否怀着和平意图；正文不替原文消除这种语用上的开放性，脚注给出较自然的意译。
translation_notes:
  register: 采用庄重而流畅的现代标准汉语。以“守望的人”避免生硬的“守望者”；以“一大队人”在两处重复对应原文重复的שִׁפְעַת；“平安吗”保留叙事中的关键词及其含义张力。
