  text: וְ/יֵה֖וּא בָּ֣א בַ/שָּׁ֑עַר וַ/תֹּ֣אמֶר הֲ/שָׁל֔וֹם זִמְרִ֖י הֹרֵ֥ג אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: zh_hans
  text: 耶户进城门时，耶洗别说：“心利[a]，你这杀害自己主人的人，平安吗？[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 耶洗别称耶户为“心利”，是在讥刺他，把他比作曾杀死自己君王并夺取王位的心利；参王上16:9—20。
    reason: cross_reference
  - marker: b
    text: “平安吗”也可译作“一切都好吗？”原文的问法很简短，在这里可能带有讥讽意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: 进城门时
  rationale: בּוֹא 表示“来、进入”，שַׁעַר 指城门或城门口；此处用“进城门时”简洁表达耶户向城内行进的场景。
- source_word: וַתֹּאמֶר
  choice: 耶洗别说
  rationale: 希伯来文只以阴性单数动词表示“她说”，所指承接上文的耶洗别；中文明确人名可避免指代含混。
- source_word: הֲשָׁלוֹם
  choice: 平安吗
  rationale: שָׁלוֹם 可指平安、安好或局势和平；“平安吗”保留原文简短而带讥刺意味的问法，不擅自限定为问候或求和。
- source_word: זִמְרִי
  choice: 心利
  rationale: 采用现代中文圣经中通行的人名译法。耶洗别并非误认耶户，而是借历史人物心利之名讥刺他。
- source_word: הֹרֵג אֲדֹנָיו
  choice: 你这杀害自己主人的人
  rationale: הֹרֵג 是名词性分词，意为“杀害者”；אֲדֹנָיו 是“他的主人”。中文用第二人称称呼自然表达当面对耶户的指责，同时以“自己主人”保留主从关系。
theological_decisions:
- issue: 耶洗别称耶户为“心利”的性质
  choice: 按讥讽性的历史类比处理，并以脚注说明
  alternative: 将“心利”当作对耶户的直接姓名称呼，不解释其历史指涉
  rationale: 上下文中的对象明确是耶户；心利曾杀死自己的君王并夺位（王上16:9—20），因此这里是将耶户比作心利的讥刺，而非人物身份混淆。
- issue: הֲשָׁלוֹם 的语气和含义
  choice: 译为“平安吗”，保留可作问安、询问局势或反讽质问的张力
  alternative: 译为“你是为和平而来吗”或“一切都好吗”
  rationale: 原文只有简短的“是否平安”，没有明说“来意”或“一切”；直译式的自然中文更能保留语义开放性及讽刺色彩。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“你这……的人”传达当面斥责的语气；正文不展开历史背景，以脚注说明“心利”的讥讽性典故。
