  text: וַ/יֹּאמְר֣וּ שֶׁ֔קֶר הַגֶּד נָ֖א לָ֑/נוּ וַ/יֹּ֗אמֶר כָּ/זֹ֤את וְ/כָ/זֹאת֙ אָמַ֤ר אֵלַ/י֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: zh_hans
  text: 众人说：“撒谎！请告诉我们吧。”他就说：“他对我说了这样那样的话[a]，说：‘雅威如此说：我已经膏你作以色列的王。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“如此如此”；这是概略或不明确转述内容的惯用语，也可译作“诸如此类的话”。
    reason: 说明希伯来语惯用表达及其可能译法，避免读者误以为“这样那样”含有轻蔑意味。
lexical_decisions:
- source_word: שֶׁקֶר
  choice: 撒谎！
  rationale: 原文是名词“谎言、虚假”，在这段突兀的对话中用作反驳或指控；译为“撒谎！”简洁自然，也保留众人认定对方有所隐瞒的语气。
- source_word: הַגֶּד נָא לָנוּ
  choice: 请告诉我们吧
  rationale: הַגֶּד是“告诉、说明”的使役命令式，נָא带请求或催促语气；“请……吧”在现代汉语中兼顾礼貌与催促。
- source_word: כָּזֹאת וְכָזֹאת
  choice: 这样那样的话
  rationale: 这是表示不确定内容或概略转述的惯用语，并不表示逐字引述；“这样那样的话”既贴近形式，又能让现代读者明白这里是概述。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式的庄重节奏，并将神名יהוה音译为“雅威”。
- source_word: מְשַׁחְתִּיךָ
  choice: 我已经膏你
  rationale: 动词完成式表明膏立行动已经实施；“膏”保留君王受立及其神学含义。
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: 作以色列的王
  rationale: לְמֶלֶךְ表示受任为王；אֶל יִשְׂרָאֵל在此指对以色列施行统治。汉语用“作以色列的王”自然表达这一任命关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地反映该名的通行学术拟音，也避免以称号替代专名。
- issue: “膏你作王”的时态与任命含义
  choice: 我已经膏你作以色列的王
  alternative: 我膏你作以色列的王
  rationale: 保留希伯来语完成式所呈现的已成事实，同时不把膏立扩展解释为任何特定宗派的君王论。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文简短、急促的问答节奏和先知传信公式；“这样那样的话”保留原文概略转述所具有的不确定性。
