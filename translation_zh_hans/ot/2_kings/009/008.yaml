base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: zh_hans
  text: 亚哈全家都必灭亡；我要剪除亚哈家在以色列中所有的男丁[a]，无论被拘束的还是被撇下的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“凡向墙撒尿的”，是一个粗俗的惯用语，指所有男性。
    reason: lexical_alternative
  - marker: b
    text: 这对希伯来语词的具体所指不确定，字面可作“被拘束的和被撇下的”。常被理解为涵盖各种身份或处境的人，也可译为“为奴的和自由的”。
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וְאָבַד
  choice: 都必灭亡
  rationale: 该完成式在先知审判宣告中表达将来的确定结果；“必灭亡”保留预告和审判的语气，而不额外限定施事方式。
- source_word: כָּל בֵּית אַחְאָב
  choice: 亚哈全家
  rationale: בֵּית在王室审判语境中指家族、家室或王朝；“全家”在现代汉语中自然，并保留家族整体受审判的含义。
- source_word: וְהִכְרַתִּי
  choice: 我要……剪除
  rationale: 使役词干的כרת在审判套语中常指彻底除掉；“剪除”保留原文意象及其经文间的审判色彩。
- source_word: לְאַחְאָב
  choice: 亚哈家的
  rationale: 介词ל在此表示归属关系；结合汉语句法译为“亚哈家的”，指亚哈家系中的成员。
- source_word: מַשְׁתִּין בְּקִיר
  choice: 所有男丁
  rationale: 该粗俗的希伯来语惯用语直指男性；正文用清楚自然的“男丁”，并在脚注交代字面表达。
- source_word: וְעָצוּר וְעָזוּב
  choice: 无论受管束的还是自由的
  rationale: 这一固定配对的确切含义存在争议，通常被理解为涵盖不同处境或身份的人。“受管束的……自由的”较贴近两个分词的基本对举，同时不把它们过度限定为严格的法律身份。
- source_word: בְּיִשְׂרָאֵל
  choice: 从以色列中
  rationale: 配合“剪除”的汉语表达，以“从……中”自然呈现审判所涉及的范围，即以色列境内的亚哈家系。
theological_decisions:
- issue: 如何呈现对亚哈王室的审判套语
  choice: 保留“亚哈全家”和“剪除”，正文将男性惯用语译为“所有男丁”
  alternative: 意译为“我要消灭亚哈整个家族”，或在正文直译为“所有向墙撒尿的”
  rationale: “全家”和“剪除”保留王室审判宣告的圣经语汇及神学张力；正文清楚表达惯用语所指，同时以脚注保存其粗俗的字面形式。
- issue: וְעָצוּר וְעָזוּב这一对语的含义
  choice: 译为“无论受管束的还是自由的”，并用脚注说明歧义
  alternative: 译为“为奴的和自由的”或“受保护的和被遗弃的”
  rationale: 原文这一对语的所指并不完全确定。正文采用与词形基本意义相近且可理解的对举，脚注列出主要解释，避免把某一社会或法律分类当作确定含义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“必灭亡”“剪除”保持先知审判宣告的力度；“男丁”避免把粗俗惯用语直接放入正文，同时脚注确保译文可核查。对含义有争议的配对不作过度确定的解释。
