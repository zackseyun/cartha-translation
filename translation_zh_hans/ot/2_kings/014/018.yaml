  text: וְ/יֶ֖תֶר דִּבְרֵ֣י אֲמַצְיָ֑הוּ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 亚玛谢其余的事，不都记在《犹大列王大事记》[a]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：《犹大列王年鉴》。
    reason: “大事记”和“年鉴”都可表达דִּבְרֵי הַיָּמִים在此处所指的王室编年档案；脚注保留这一词汇选择。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ
  choice: 亚玛谢其余的事
  rationale: יֶתֶר意为“其余、剩余”，דִּבְרֵי在王朝记述的固定结语中泛指君王的事迹和政务；译作“其余的事”自然简洁，也避免将其误解为单指言语。句首וְ在此承接上下文，无须另加“现在”。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗
  rationale: הֲלֹא引出期待肯定回答的反问；“不都……吗”保留这一语气。被动分词כְּתוּבִים在汉语中自然译为“记”。
- source_word: עַל סֵפֶר
  choice: 记在《……》上
  rationale: סֵפֶר指书面文献或卷册；在文献引用语境中，现代汉语用“记在……上”自然表达עַל的关系，并以书名号标明文献名称。
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王大事记》
  rationale: דִּבְרֵי הַיָּמִים在王室档案语境中指按时日记录的史事或编年记录；“大事记”既贴近该含义，也可避免读者将这部已佚王室资料误认为正典《历代志》或《列王纪》。לְמַלְכֵי יְהוּדָה表达该文献与犹大诸王的所属关系。
theological_decisions: []
