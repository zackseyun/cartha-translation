base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: zh_hans
  text: 王权一旦在他手中稳固[a]，他就击杀了那些曾击杀他父王的臣仆[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“王权在他手中确立以后”。这是指他的统治已经稳固。
    reason: lexical_alternative
  - marker: b
    text: 原文用同一个动词描述双方的行动：他“击杀”了那些曾“击杀”他父王的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 一……就……
  rationale: 这里引出紧接发生的事件；用现代汉语“一……就……”自然表达叙事推进和紧密的时间关系，不机械译出希伯来语的叙事起句格式。
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: 国权在他手中一稳固
  rationale: חזק在此指王权得到巩固；保留“在他手中”的希伯来意象，同时以“国权”避免让读者误以为疆域或国家本身变强。
- source_word: וַיַּךְ
  choice: 击杀
  rationale: נכה在本语境中指置人于死地。“击杀”既清楚表达结果，也可与后面的同词根分词保持词语呼应。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עבד可泛指仆人或臣属；此处处于王宫政治语境，“臣仆”既保留从属关系，也比单纯“仆人”更贴合身份。
- source_word: הַמַּכִּים
  choice: 那些曾击杀……的
  rationale: 分词用来指认曾杀害其父王的人；“曾”明确该行动先于本节所述的处置，并重复“击杀”以保留原文呼应。
- source_word: הַמֶּלֶךְ אָבִיו
  choice: 他父王
  rationale: 希伯来语直译近于“王、他的父亲”；现代汉语“父王”简洁自然，同时保留其父亲的君王身份。
