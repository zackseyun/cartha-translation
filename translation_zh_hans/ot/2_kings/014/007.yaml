  text: הוּא הִכָּ֨ה אֶת אֱד֤וֹם בְּ/גֵיא המלח עֲשֶׂ֣רֶת אֲלָפִ֔ים וְ/תָפַ֥שׂ אֶת הַ/סֶּ֖לַע בַּ/מִּלְחָמָ֑ה וַ/יִּקְרָ֤א אֶת שְׁמָ/הּ֙ יָקְתְאֵ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/007.yaml
  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: zh_hans
  text: 他在盐谷击杀了一万名以东人，又在战斗中攻取西拉[a]，给它起名叫约帖，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “西拉”也可按这个词的普通含义译为“磐石”或“峭壁”；这里很可能是地名。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: 击杀
  rationale: 该动词在军事语境中表示击打、击倒，常含致死之意；与一万人的数目连用时，“击杀”自然传达这里的杀敌含义。
- source_word: אֱדוֹם
  choice: 以东人
  rationale: 原文直译为“以东”，但与人数及击杀动作搭配时，所指显然是以东人；译出“人”符合现代汉语。
- source_word: בְּגֵיא הַמֶּלַח
  choice: 在盐谷
  rationale: 按地名结构直译，简洁并符合汉语圣经地名的通行表达。
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: 一万名
  rationale: 准确表达基数；量词“名”使现代汉语自然清楚。
- source_word: וְתָפַשׂ
  choice: 又……攻取
  rationale: תפשׂ在军事语境中指夺取并控制地点；“攻取”既体现战斗过程，也表达占领结果。
- source_word: הַסֶּלַע
  choice: 西拉
  rationale: 上下文很可能将该词作为地名使用，因此采用音译；其普通名词义“磐石、峭壁”保留在脚注中。
- source_word: בַּמִּלְחָמָה
  choice: 在战斗中
  rationale: 直接表达攻取该地的军事情境，不将其扩大解释为一整场战争。
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: 给它起名叫
  rationale: 保留希伯来语“称它的名为”的命名句式，同时采用自然的现代汉语表达。
- source_word: יָקְתְאֵל
  choice: 约帖
  rationale: 按通行的中文圣经地名译法音译。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 忠实保留原文的时间公式，表示这个名称延续到叙述者所处的时代。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留原文简洁的战争叙述及命名公式；对“西拉”既按地名处理，又借脚注保留其词义上的可能性。
