  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: zh_hans
  text: 犹大王约阿施的儿子亚玛谢在位第十五年，以色列王约阿施的儿子耶罗波安在撒玛利亚登基，作王四十一年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: 在位第十五年
  rationale: 这是列王纪常见的王年纪年格式；基数词结构在此具有序数意义，所指是亚玛谢在位的第十五年，而非十五年的时段。
- source_word: לַאֲמַצְיָהוּ בֶן־יוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: 犹大王约阿施的儿子亚玛谢
  rationale: 介词 ל 在纪年公式中标明以哪位君王的在位年数为参照；按现代汉语语序整合其国别、王位和父名。
- source_word: מָלַךְ
  choice: 登基
  rationale: 此处 Qal 形式在登基纪事中表示开始作王；“登基”可与随后说明统治年数的表达清楚区分。
- source_word: יָרָבְעָם בֶּן־יוֹאָשׁ מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王约阿施的儿子耶罗波安
  rationale: 按中文圣经人名惯例音译姓名，并以自然汉语呈现父子关系及王国身份。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 介词 ב 表示地点；撒马利亚是其作王所在的都城。
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: 统治了四十一年
  rationale: 数字加“年”说明其统治持续时间；补出“统治了”使现代汉语句法完整，并避免与前面的登基动作混淆。
