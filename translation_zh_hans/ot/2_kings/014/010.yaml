base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: zh_hans
  text: 你确实击打了以东，你的心便高傲起来[a]。你就以此为荣[b]，留在家中吧！何必自找祸患，以致你和犹大一同倾覆呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“你的心把你抬高了”，意思是你因此骄傲起来。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“你就享受这份荣耀”或“你就夸耀吧”。原文可能是叫他满足于已经取得的荣耀。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ אֶת אֱדוֹם
  choice: 你确实击败了以东
  rationale: 不定式绝对式与限定动词连用，强化“击打”的语气；军事语境中译作“确实击败”自然清楚，也保留强调作用。
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: 你的心便高傲起来
  rationale: 希伯来文直译近于“你的心把你抬高了”，是形容胜利使人骄傲自大的习语；正文采用自然的现代汉语表达，并以脚注保留原文意象。
- source_word: הִכָּבֵד
  choice: 你就以此为荣
  rationale: 这个尼法勒命令式在此可指从既有胜利中获得荣耀或以此夸耀；“以此为荣”符合上下文，又避免把语气强化为明确的责骂。
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: 安居家中吧
  rationale: 字面为“坐在你家中”，实际是在劝对方留在国内，不要继续寻衅；“安居家中”简洁而庄重。
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: 挑起祸患
  rationale: 动词表示挑动、招惹或卷入冲突，רָעָה 在此指由战争带来的灾祸，而非道德意义上的邪恶。
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: 以致你和犹大一同倾覆
  rationale: “倾覆”既保留“倒下”的形象，又适合君王与国家共同败落的政治军事语境；“一同”体现 עִמָּךְ 的连带后果。
