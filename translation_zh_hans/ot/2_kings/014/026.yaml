  naturalness: “以色列所受的苦难极其深重”自然庄重。“无论受拘束的还是自由的，一个也没有”比“受拘束的和自由的都没有了”更符合现代标准汉语，也更直接呈现原文的否定结构。以分号分隔并列分句，清楚而保留经文节奏。
