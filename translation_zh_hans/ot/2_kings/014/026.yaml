base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: zh_hans
  text: 因为耶和华看见以色列所受的苦难极其深重[a]；无论受拘束的还是自由的，一个也没有[b]；也没有人帮助以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“极其痛苦”“极其严重”。这里的希伯来语表达较难确定，但显然是在强调以色列苦难之深。
    reason: lexical_alternative
  - marker: b
    text: “受拘束的”和“自由的”是一个含义不完全确定的希伯来语成对说法，也可译为“被拘束的和被放开的”。这句话可能表示各类人都已耗尽，或根本无人留下来相助。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确保留希伯来文本中的上帝之名，而不以普通称谓代替。
- source_word: עֳנִי
  choice: 所受的苦难
  rationale: 此词指以色列全国所处的困苦、受压境况；“所受的苦难”在现代汉语中自然，也不把词义缩窄为经济贫穷。
- source_word: מֹרֶה מְאֹד
  choice: 极其深重
  rationale: 该短语在此处的词形和确切含义有困难，但语境显然是在加强以色列苦难的严重程度；“极其深重”自然传达这一点，并以脚注保留其他可能表达。
- source_word: אֶפֶס
  choice: 都没有了
  rationale: 在两个并列分词前表达彻底不存在或已经绝尽；合并为自然的中文结构，同时保留强调性的全然缺失。
- source_word: עָצוּר
  choice: 受拘束的
  rationale: 按字面保留“被限制、被拘束者”的含义，避免在语义不确定时径直具体化为“奴隶”。
- source_word: עָזוּב
  choice: 自由的
  rationale: 在固定配对中作为“受拘束的”的对应项处理；这一对词的确切所指有争议，故在脚注中说明其总体功能。
- source_word: עֹזֵר
  choice: 帮助……的人
  rationale: 忠实表达主动分词“施助者”，中文正文用“无人帮助以色列”更简洁自然。
theological_decisions:
- issue: 如何翻译难解短语 עָצוּר וְעָזוּב
  choice: 受拘束的和自由的都没有了
  alternative: 无人留下；被囚的和获释的都没有了；不论哪一类人都已耗尽
  rationale: 保留原文成对词语及其全称性效果，却不把它解释成特定社会阶层或神学范畴。脚注指出其确切所指不确定，整体意思则是无人存留或无人能提供援助。
- issue: 如何翻译 מֹרֶה מְאֹד
  choice: 极其深重
  alternative: 极其痛苦；极其严重；极其苦涩
  rationale: 原文词形和词义均较难确定；上下文明确强调以色列困境的严重性，因此正文采用通顺而不过度具体化的表达，并在脚注中保留歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“因为”承接上文因果关系；连续三个分句保留希伯来文的推进节奏。难解词组不在正文中作过度确定的解释，而借脚注说明其语义范围。
