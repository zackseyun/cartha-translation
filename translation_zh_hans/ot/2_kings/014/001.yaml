base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: zh_hans
  text: 以色列王约哈斯的儿子约阿施在位第二年，犹大王约阿施的儿子亚玛谢登基。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: 在位第二年
  rationale: 介词ב与年份表达构成王朝纪年公式；שְׁתַּיִם虽为基数词“二”，在此按希伯来语惯用法表达序数“第二”。加入“在位”使现代汉语纪年表达自然明确。
- source_word: לְ/יוֹאָשׁ
  choice: 约阿施……在位
  rationale: 介词ל在王年公式中标明按哪位君王的统治年数纪年，汉语自然表达为“某王在位第……年”。
- source_word: בֶּן יוֹאָחָז
  choice: 约哈斯的儿子
  rationale: 按父名结构直译，清楚标明约阿施的父系身份。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 名词组合表示君王的称号及其国域，采用现代中文圣经叙事中自然简洁的“以色列王”。
- source_word: מָלַךְ
  choice: 登基
  rationale: 此处完成式在王朝纪年语境中指开始作王；“登基”准确而简洁地表达即位事件，优于可能被理解为持续统治的“作王”。
- source_word: אֲמַצְיָהוּ
  choice: 亚玛谢
  rationale: 采用该希伯来人名在现代中文圣经中的通行译名。
- source_word: בֶן יוֹאָשׁ
  choice: 约阿施的儿子
  rationale: 按父名结构直译，用来识别亚玛谢。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 原文末尾的称号可与“登基”自然结合；译作“犹大王……登基”既保留国域信息，也符合现代汉语语序。
