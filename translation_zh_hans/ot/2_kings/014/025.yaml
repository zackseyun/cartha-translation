  naturalness: “正如以色列的上帝雅威借着他的仆人——先知亚米太的儿子约拿——所说的话”不成完整、自然的现代汉语比较结构。改为“正如……所说的那样”后，叙述庄重、清楚且自然。将“自己的仆人”用于雅威，可消除中文中“他的”可能的指代迟滞。
  terminology: “雅威”“疆界”“亚拉巴海”“仆人”“先知”均恰当，并与原文及英语审校轨迹一致。“利波哈马”保留为地名，脚注给出字面替代译法是稳妥的。“哈马的入口”比“哈马入口”更明确地反映原文属格关系。
