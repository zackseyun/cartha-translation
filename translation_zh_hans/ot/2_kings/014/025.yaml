revisions:
- from: 他恢复了以色列的疆界，从利波哈马[a]直到亚拉巴海[b]，正如以色列的上帝雅威借着他的仆人——先知亚米太的儿子约拿——所说的话。约拿来自迦特希弗。
  to: 他恢复了以色列的疆界，从利波哈马[a]直到亚拉巴海[b]，正如以色列的上帝雅威借着自己的仆人亚米太的儿子、先知约拿所说的那样；约拿来自迦特希弗。
  rationale: 修正中文比较结构，使“正如”与“所说的那样”完整对应；保留原文的行动、疆界范围、神名、先知身分和籍贯。脚注仍分别锚定“利波哈马”和“亚拉巴海”，且不将可能的死海认定写入正文。
