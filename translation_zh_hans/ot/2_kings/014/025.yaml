id: 2KI.14.25
reference: 2 Kings 14:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: zh_hans
  text: 他恢复了以色列的疆界，从利波哈马[a]直到亚拉巴海[b]，正如以色列的上帝雅威借着自己的仆人亚米太的儿子、先知约拿所说的那样；约拿来自迦特希弗。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译作“哈马的入口”。
    reason: lexical_alternative
  - marker: b
    text: 很可能指死海。
    reason: geographical_identification
lexical_decisions:
- source_word: הֵשִׁיב
  choice: 恢复了
  rationale: 此处使役形表达使以色列原有疆界恢复，采用“恢复了”既符合政治地理语境，也避免把意思扩大为一般性的征服。
- source_word: גְּבוּל
  choice: 疆界
  rationale: 该词在这里指领土的边界；“疆界”在现代中文中自然、庄重，并保留边界而非整个领土的重点。
- source_word: מִלְּבוֹא חֲמָת
  choice: 从利波哈马[a]
  rationale: 该短语在圣经地理用语中可作为固定地名理解，正文音译为“利波哈马”，同时在脚注保留较直译的“哈马入口”。
- source_word: יָם הָעֲרָבָה
  choice: 亚拉巴海[b]
  rationale: 按希伯来语地理称谓直译，不在正文中直接等同于死海；可能的地理所指留在脚注说明。
- source_word: כִּדְבַר
  choice: 正如……所说的话
  rationale: 表达事件依照先前神谕而成就；此译法在现代中文中通顺，并保留“话”的语义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以中文常见音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号替代。
- source_word: בְּיַד
  choice: 借着
  rationale: 该希伯来语习语表示中介或代理；中文若直译“借……的手”较生硬，“借着”准确传达其功能。
- source_word: עַבְדּוֹ
  choice: 他的仆人
  rationale: 在先知受差遣的语境中，“仆人”自然表达其归属和服事关系。
- source_word: הַנָּבִיא
  choice: 先知
  rationale: 作为同位称号，直接说明约拿的职分。
- source_word: מִגַּת הַחֵפֶר
  choice: 来自迦特希弗
  rationale: 介词表示出身或来源，“来自”是自然准确的现代中文表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 正文用音译“雅威”呈现神的专名，避免以“主”等称号替代；“耶和华”是中文传统译名，但较不贴近该名通常重建的读音。
- issue: יָם הָעֲרָבָה 的地理认定
  choice: 亚拉巴海
  alternative: 死海
  rationale: 正文保留希伯来语原有地理称谓，不把很可能的所指直接写成经文措辞；脚注说明其通常所指。
- issue: “利波哈马”是地名还是普通短语
  choice: 正文按固定地名音译
  alternative: 哈马入口
  rationale: 圣经地理语境支持将 לְבוֹא חֲמָת 视为固定地理名称，但其字面构成仍可理解为“哈马入口”，故在脚注保存这一可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以破折号清楚标示“先知亚米太的儿子约拿”与“他的仆人”的同位关系；不机械保留希伯来语“借……的手”这一在现代中文中较生硬的习语。脚注标记按其实际所注释的词语安放：利波哈马[a]、亚拉巴海[b]。
