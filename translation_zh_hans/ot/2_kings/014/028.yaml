revisions:
- from: 耶罗波安其余的事迹、他所做的一切和他的勇力，以及他怎样争战，怎样把大马士革和哈马归还给以色列中的犹大[a]，不都记在《以色列诸王大事记》上吗？
  to: 耶罗波安其余的事迹、他所做的一切、他的武功，以及他怎样争战，怎样使大马士革和哈马复归以色列中的犹大[a]，不都记在《以色列诸王大事记》上吗？
  rationale: 修订仅改善现代汉语的自然度，并避免“归还”所可能附带的明确原属关系。“使……复归以色列中的犹大”对应原文使役性的“恢复／使返回”，同时保留“犹大”和“以色列”之间未明的关系。
