source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 耶罗波安其余的事迹、他所做的一切、他的武功，以及他怎样争战，怎样使大马士革和哈马复归以色列中的犹大[a]，不都记在《以色列诸王大事记》上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“使大马士革和哈马复归以色列中的犹大”。这句话很难理解，可能是指为以色列收复了从前属于犹大的领土，也可能保留了较早的地缘政治称谓。正文尽量保留希伯来文的措辞，不确定其具体含义。
    reason: 说明原文中难解的历史地理短语，并保留其歧义。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: 其余的事迹
  rationale: 这是《列王纪》君王记述的惯用总结语；“事迹”在现代汉语中自然表达דִּבְרֵי在史书语境下的“事情、作为”，又不额外加入原文没有的时间副词。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 他所做的一切
  rationale: 保留עָשָׂה宽泛的含义，不把它限缩为成就或战功。
- source_word: וּגְבוּרָתוֹ
  choice: 他的勇力
  rationale: גְּבוּרָה可指力量、英勇或英勇事迹；下文以争战具体说明，故用凝练而庄重的“勇力”。
- source_word: אֲשֶׁר נִלְחָם
  choice: 他怎样争战
  rationale: 将关系从句按其说明作用译为“怎样”，与前面的“勇力”自然衔接。
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: 怎样……归还
  rationale: הֵשִׁיב的基本含义是使之返回、恢复；“归还”尽量保留方向关系，而不明确判定具体的历史领属。
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: 大马士革和哈马
  rationale: 采用现代中文圣经地名的通行译名。
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: 给以色列中的犹大
  rationale: 原文短语语法清楚度不足，历史地理关系也有争议；直译保留“给/归犹大”与“在以色列中”两层关系，不在正文中替读者作出和谐化解释。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗
  rationale: 保留反问式的王朝总结公式；汉语“记在……上”比逐字译作“被写在”自然。
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 记在《以色列诸王大事记》上
  rationale: “大事记”准确表达档案性编年记录，并避免让现代读者误以为这里直接指现存正典《历代志》。
theological_decisions:
- issue: “归还给以色列中的犹大”所指的政治或领土关系
  choice: 正文保留原文压缩而含混的表达，并加注说明
  alternative: 译成“为以色列收复了原属犹大的大马士革和哈马”，或依推测性校勘改为“归还给以色列”
  rationale: 马所拉文本明确包含“犹大”和“以色列”，但二者关系难解。直接消除其中之一或补出“原属”等关系，会把一种历史解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的史书语体。“其余的事迹”“不都记在……上吗”保留《列王纪》惯用的君王总结格式；难解的“以色列中的犹大”不作静默修正。
