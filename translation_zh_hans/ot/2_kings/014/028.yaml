    rationale: הֵשִׁיב意为“使返回、恢复”；本节的领属及政治关系正是争议所在。“归还给”虽可成立，却较易预设大马士革和哈马原本属于受词所指对象。改作“使……复归”更能保留原文的压缩性和歧义。
