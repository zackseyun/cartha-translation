base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: zh_hans
  text: 约阿施与他的列祖同睡，葬在撒马利亚，与以色列诸王同葬。他的儿子耶罗波安接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 在列王纪的王室讣告套语中，该动词与“列祖”连用，委婉表示死亡；译作“同睡”既保留希伯来语意象，也保留反复出现的程式性表达。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: “列祖”是现代中文圣经语体中清楚而庄重的固定表达，既指先祖，也与“同睡”的王室讣告公式相配。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 原文为被动式；中文无需机械加入“被”，用“葬在”即可自然表达安葬之意。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 介词在此表示地点，指安葬所在。
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: 与以色列诸王同葬
  rationale: 补出“同葬”使中文关系明确，表达他与以色列历代君王一同安葬，同时不超出上下文所给的信息。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 该动词在王位继承记载中表示执掌王权；“作王”自然、简洁，并符合叙事公式。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 此词表示取代前任、继承其位；“接替他”比单纯的“在他以后”更准确地呈现王位承继关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“与他的列祖同睡”保留原文王室讣告的传统意象；后半句用“接替他作王”自然传达 dynastic succession，避免生硬直译为“在他的位置上作王”。
