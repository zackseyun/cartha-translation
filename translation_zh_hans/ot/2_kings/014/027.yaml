base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: zh_hans
  text: 但耶和华并没有说要把以色列的名从天下抹去[a]，所以他借着约阿施的儿子耶罗波安的手[b]拯救了他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抹去”也可译作“擦去”或“除掉”；这里指使以色列不复存在。
    reason: lexical_alternative
  - marker: b
    text: “借着……的手”是希伯来语惯用语，表示借某人作为媒介或代理，也可译作“借着”或“通过”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确保留原文专名所指。
- source_word: דִבֶּר
  choice: 说
  rationale: דבר在此表示“说、宣告”；“并没有说要……”自然表达先于随后拯救行动的神圣意向，同时不把它过度解释为正式谕令。
- source_word: לִמְחוֹת
  choice: 抹去
  rationale: מחה表示除去、消灭；“抹去”与“名”搭配自然，也保留原文形象。
- source_word: שֵׁם יִשְׂרָאֵל
  choice: 以色列的名
  rationale: 贴近希伯来语表达，保留“名”代表以色列持续存在和身份的修辞力量。
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: 从天下
  rationale: 简洁保留“诸天之下”的空间意象，表达从人类生存的世界中彻底除去，而不直接释义为“从地上”。
- source_word: וַיּוֹשִׁיעֵם
  choice: 所以他……拯救了他们
  rationale: ישע的使役词干表示拯救或解救；“所以”自然呈现前后叙事逻辑，又不额外规定拯救的具体方式。
- source_word: בְּיַד
  choice: 借着……的手
  rationale: 保留希伯来语表示媒介或代理者的惯用语，表明耶罗波安是耶和华施行拯救的人间工具。
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: 约阿施的儿子耶罗波安
  rationale: 采用现代中文圣经中通行的人名音译，并清楚表达父子关系。
theological_decisions:
- issue: 神保存以色列的意向与行动
  choice: 耶和华没有说要除灭以色列，因此借耶罗波安拯救他们。
  alternative: 把两个分句仅以“并且”连接，不明确显示其逻辑关系。
  rationale: 原文先陈述耶和华未曾说要抹去以色列的名，继而叙述他的拯救行动。“所以”呈现语境中的结果关系，却不将“说”强化为特定形式的神学性“定旨”。同时保留神借一位有严重缺陷的君王施行拯救的张力，不作评价性化解。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。句式贴近原文但避免生硬；保留“以色列的名”“从天下”和“借着……的手”等关键意象，并以脚注解释可能不够直观的希伯来语表达。
