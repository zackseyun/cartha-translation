id: 2KI.14.6
reference: 2 Kings 14:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: zh_hans
  text: 可是，他没有处死那些杀人者的儿子[a]，而是照《摩西律法书》所记、雅威所吩咐的话而行：“父亲不可因儿子而被处死，儿子也不可因父亲而被处死；各人只因自己的罪而死。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那些杀人者的孩子”。希伯来文直译为“那些杀人者的儿子”。
    reason: lexical_alternative
  - marker: b
    text: 这段引文见《申命记》24:16。
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: 那些杀人者的儿子
  rationale: בְּנֵי直译为“儿子”，הַמַּכִּים在本段司法语境中指杀了王的人。译作“杀人者的儿子”既保留原文的阳性亲属称谓，也自然表达其所指。
- source_word: לֹא הֵמִית
  choice: 没有处死
  rationale: מות的使役式在司法语境中表示使人死亡，即依法处死；“处死”比泛指的“杀死”更准确。
- source_word: כַּכָּתוּב
  choice: 正如……上所记的
  rationale: 该惯用语表示行动符合成文律法；此译自然地保留对书面权威的诉诸。
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: 《摩西律法书》
  rationale: 保留סֵפֶר与תּוֹרָה的书卷及律法含义，并采用现代中文常见、清楚的书名形式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，而不以“主”这一称号替代。
- source_word: לֹא יוּמְתוּ
  choice: 不可……被处死
  rationale: 该使役动词的被动式在律法条文中表达禁止执行死刑，并非泛指自然死亡。
- source_word: אָבוֹת ... בָּנִים
  choice: 父亲……儿子
  rationale: 对应原文明确的阳性复数称谓，不将其泛化为“父母……儿女”。汉语以单数类称形式自然表达普遍法律原则。
- source_word: עַל
  choice: 因
  rationale: 此处表示施加刑罚的理由或根据；“因”简洁自然。
- source_word: כִּי אִם
  choice: 只
  rationale: 在否定句之后引出相反且受限定的原则；中文“只”准确表达“不是因别人，而只因自己”的排他对比。
- source_word: אִישׁ
  choice: 各人
  rationale: 原文单数在此具有逐一分配的意义；“各人”既体现每一个人的责任，也符合现代汉语司法表述。
- source_word: בְּחֶטְאוֹ
  choice: 因自己的罪
  rationale: 介词表示死亡所基于的缘由，第三人称后缀由“自己的”明确表达，并凸显与代人受刑的对比。
- source_word: יָמוּת
  choice: 而死
  rationale: 末句为מות的简单式“死”，不同于前面表示“被处死”的使役被动式；译文保留这一形式变化及其可能的语义张力。
theological_decisions:
- issue: 圣约律法中个人责任与家族责任的关系
  choice: 本节规定，不可因父亲的罪处死儿子，也不可因儿子的罪处死父亲；各人只因自己的罪而死。
  alternative: 将本节理解为全面否认罪会产生任何群体性或代际后果。
  rationale: 上下文和动词形式聚焦于司法处死及个人罪责，并未处理罪在其他层面可能造成的共同体或代际后果。译文保留这一法律焦点，不扩大其神学断言。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。法律禁令使用“不可……被处死”，末句则保留原文由使役被动式转为简单式“死”的区别。《摩西律法书》使用书名号以符合简体中文出版习惯；神名音译为“雅威”。
