  to: 可是，他没有处死那些杀人者的儿子[a]，而是照《摩西律法书》所记、雅威所吩咐的话而行：“父亲不可因儿子而被处死，儿子也不可因父亲而被处死；各人只因自己的罪而死。”[b]
