  source_fidelity: 译文准确传达了王没有处死行凶者之子的事实，并保留律法引文中“被处死”与末句“死”的动词形式差异。惟原文将王的作为明确归于《摩西律法书》中“雅威所吩咐”的话；草稿以句号拆开后，“雅威曾吩咐说”虽不致误译，却削弱了该书面律法与神命令之间的句法关联。
