  terminology: “雅威”“《摩西律法书》”“处死”“父亲／儿子”使用一致且恰当。“杀人者的儿子”可在此司法叙事中表达 הַמַּכִּים；脚注应提供真正有区分度的替代译法，而不应仅以“凶手”重复主文意思。
