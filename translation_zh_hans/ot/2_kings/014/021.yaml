base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: zh_hans
  text: 犹大的全体百姓拥立十六岁的亚撒利雅为王，接替他的父亲亚玛谢。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 亚撒利雅在别处也称为乌西雅；本节希伯来文作“亚撒利雅”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 把……立为王
  rationale: לקח本义为“取、带来”。在拥立君王的语境中，若孤立译作“带来”或“选取”会显得生硬或增加“选举”的含义；结合后面的使役式“立他作王”，译为“把……立为王”自然地表达百姓将他推上王位的行动。
- source_word: כָּל עַם יְהוּדָה
  choice: 犹大众民
  rationale: 原文明确指“犹大的全体百姓”，保留集体政治主体；“众民”比单译“全犹大”更准确地体现עַם。
- source_word: עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 按本节希伯来文本所用名字音译；这位王在别处也称乌西雅，另以脚注说明。
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: 那时他十六岁
  rationale: 以自然现代汉语表达年龄说明，并保留其补充性信息。
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: 把……立为王
  rationale: מלך的使役式表示“使他作王”。“立为王”准确而自然；不译作“加冕”或“宣告”，因为原文未明确具体礼仪或仅限于宣告。
- source_word: תַּחַת אָבִיו
  choice: 接替他父亲
  rationale: תחת在王位承继语境中表示代替、居于其位；“接替”既自然，又比单纯的“在……以后”更能表达继位关系。
- source_word: אֲמַצְיָהוּ
  choice: 亚玛谢
  rationale: 采用现代中文圣经人名的通行音译。
