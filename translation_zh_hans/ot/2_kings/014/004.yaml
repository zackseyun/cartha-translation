  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: zh_hans
  text: 只是，丘坛[a]并未废除；百姓仍在丘坛献祭、烧香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丘坛”指地方性的祭祀场所，常设在高地上；也可译作“祭祀场所”。
    reason: 说明希伯来词的文化含义，避免读者把它仅理解为普通的土丘或祭坛。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 此词在这里对前文关于君王的评价加以限制或补充；“只是”自然表达“虽有前述情况，但仍有例外”的语气。
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: 丘坛 / 在丘坛
  rationale: בָּמוֹת指地方性的祭祀场所，常设于高处；“丘坛”是简洁而沿用已久的对应词，脚注说明其实际含义，避免仅按地形理解。介词ב按处所义译为“在”。
- source_word: לֹא סָרוּ
  choice: 并未废除
  rationale: 动词סור本义涉及移开、除去；以“丘坛”为主语时，语境所指是这些祭祀场所没有被撤除或废止。“并未废除”符合现代汉语，也保留被动含义。
- source_word: עוֹד
  choice: 仍
  rationale: 表示相关祭祀活动持续进行。
- source_word: הָעָם
  choice: 百姓
  rationale: 自然表达作为整体的民众。
- source_word: מְזַבְּחִים
  choice: 献祭
  rationale: 分词表示持续或惯常的活动；汉语以“仍”配合动词即可表达这种延续性。
- source_word: וּמְקַטְּרִים
  choice: 烧香
  rationale: קטר在祭祀语境中可指焚烧香料或使祭物冒烟；与“献祭”并列时，“烧香”是最自然且较可能的表达，同时不额外规定香的种类。
theological_decisions:
- issue: 对丘坛敬拜性质的评价
  choice: 正文采用历史描述性的“丘坛”，不加“非法”“异教”等定性词。
  alternative: 地方祭祀场所；未经许可的敬拜场所
  rationale: 本节陈述丘坛未被废除以及百姓继续在那里献祭烧香；更广叙事语境含有负面评价，但本节没有用形容词明说其违法或异教性质，因此译文不作超出原文的神学判定。
- issue: 献祭和烧香的持续性
  choice: 用“仍”统摄“献祭、烧香”两个动作。
  alternative: 仍不断地献祭、烧香；仍在献祭并烧香
  rationale: 希伯来文以两个分词描述持续或惯常行为；“仍”已能在自然汉语中传达这种延续性，无须强化为“不断”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“只是”承接前文并引出限制；分号保留原文两个分句之间紧密的因果与延续关系。“献祭、烧香”简洁表达两个并列的惯常动作。
