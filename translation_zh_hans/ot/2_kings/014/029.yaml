base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: zh_hans
  text: 耶罗波安与他的列祖同睡[a]，与以色列诸王同眠[b]；他的儿子撒迦利雅接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这是希伯来文记述君王去世的惯用语；也可译作“与他的列祖一同躺下”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“列在以色列诸王中间”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 该动词与“列祖”连用，是君王去世的固定表达。“同睡”保留希伯来文的委婉意象，同时在中文圣经叙事语体中可理解；脚注说明其实际所指。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: “列祖”简洁地保留 אֲבֹתָיו 的家族先辈含义，也符合王朝纪事的庄重固定语体。
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: 与以色列诸王同在
  rationale: 保留重复介词 עִם 所表达的“与……一同”关系，同时避免中文中“与诸王同睡”可能产生的不自然或误解。原文也可理解为“在以色列诸王中间”，故加脚注保留歧义。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位承继语境中，“作王”自然、简洁，准确表达 מלך 的统治含义。
- source_word: זְכַרְיָה
  choice: 撒迦利雅
  rationale: 采用现代中文圣经传统中通行且易识别的人名译法。
- source_word: בְנוֹ
  choice: 他的儿子
  rationale: 直接表达原文的父子关系，不作扩充。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 在王位继承语境中，自然表达“取代他的位置”；与“作王”组合为流畅的现代汉语。
