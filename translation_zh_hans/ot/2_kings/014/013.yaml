  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: zh_hans
  text: 以色列王约阿施在伯·示麦擒住了犹大王亚玛谢，就是约阿施的儿子、亚哈谢的孙子。随后，他[a]来到耶路撒冷，拆毁了耶路撒冷的一段城墙，从以法莲门直到角门，共四百肘。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语辅音经文作“他们来到耶路撒冷”，但上下文以及后面使用的单数动词支持译作“他来到耶路撒冷”，所指为约阿施。
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: 擒住
  rationale: 该动词表示抓住、俘获；在战事中以“擒住”自然表达把敌王俘获。
- source_word: בְּבֵית שָׁמֶשׁ
  choice: 在伯·示麦
  rationale: 介词בְּ在地名之前表示事件发生的地点；采用现代中文常用处所表达。
- source_word: ו/יבאו
  choice: 随后，他来到
  rationale: 马所拉经文辅音形式是复数“他们来到”，但上下文叙事中心及紧接的单数动词支持按单数理解，所指为约阿施；“随后”自然呈现事件次序。
- source_word: וַיִּפְרֹץ
  choice: 拆毁
  rationale: 该词可指冲破、打开缺口；以城墙为对象时，“拆毁”准确而自然地表达毁坏一段城墙。
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: 耶路撒冷的一段城墙
  rationale: 介词字面为“在……中”，与破坏动词连用表示在城墙上打开缺口；译作“一段城墙”避免误解为整圈城墙均被拆毁。
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: 从以法莲门直到角门
  rationale: 此结构界定城墙被毁的范围；“从……直到……”清楚表达两端。
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: 共四百肘
  rationale: 保留古代长度单位“肘”，不作有争议的现代单位换算；“共”说明这是上述墙段的总长度。
- source_word: בֶּן יְהוֹאָשׁ בֶּן אֲחַזְיָהוּ
  choice: 约阿施的儿子、亚哈谢的孙子
  rationale: 希伯来语逐字重复“儿子”，但第二个关系在现代汉语中自然表达为“孙子”，且没有改变家谱关系。
theological_decisions: []
