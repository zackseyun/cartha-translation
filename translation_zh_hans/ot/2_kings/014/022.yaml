base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/022.yaml
  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: zh_hans
  text: 他重建了以拉他，并使它重新归属犹大；这发生在王与列祖同睡之后。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: 重建
  rationale: 该动词本义为“建造”，但以拉他是既有城邑；在此历史语境中译作“重建”更自然，也与其后“使它归回犹大”相符。
- source_word: אֵילַת
  choice: 以拉他
  rationale: 按希伯来语地名音译，并采用现代中文圣经中易于辨认的传统形式。
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: 使它归回犹大
  rationale: 保留使役结构及方向含义；“它”指以拉他，译文不额外断定具体行政方式。
- source_word: שְׁכַב ... עִם־אֲבֹתָיו
  choice: 与他祖先同睡
  rationale: 保留希伯来文表示死亡的固定委婉语及其历史叙事色彩，不直接改译为“死”。
theological_decisions:
- issue: “王”所指对象在本节中的省略与歧义
  choice: 保留“王”，不补出姓名
  alternative: 译作“他父亲亚玛谢王”或明确指定某位王
  rationale: 原文只写“王”，具体所指需由上下文判断；译文不应把解释直接写入正文。
translation_notes:
  register: 采用庄重而自然的现代标准汉语；保留“与祖先同睡”这一传统历史叙事表达，同时用“归回”体现恢复归属的动作。
