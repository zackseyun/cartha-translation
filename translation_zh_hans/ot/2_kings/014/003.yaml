id: 2KI.14.3
reference: 2 Kings 14:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为正的事，只是没有像他父亲大卫那样；凡他父亲约阿施所行的，他都照样行了。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里称大卫为“父亲”，是把他视为王朝的祖先，并不是说大卫是亚玛谢的亲生父亲。
    reason: cultural_note
  - marker: b
    text: “只是”也可译作“不过”；原文在此为前面的正面评价加上限制。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: 他行……看为正的事
  rationale: 保留列王纪评价君王行为的惯用表达，同时采用自然、庄重的现代汉语。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性习语，并按本项目惯例将四字神名译作“耶和华”。
- source_word: רַק
  choice: 只是
  rationale: 此词为前面的正面评价加上限制；“只是”既可表达转折，也保留“惟独、不过”的限定意味。
- source_word: לֹא כְּדָוִד אָבִיו
  choice: 没有像他父亲大卫那样
  rationale: 保留原文的比较结构和“父亲”这一王朝、祖先意义的称谓，不把未明说的具体行为补入正文。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: 凡……所行的，他都照样行了
  rationale: 表达 כְּכֹל 的全面对应关系，在汉语中比逐字译为“照着一切”更自然。
- source_word: יוֹאָשׁ אָבִיו
  choice: 他父亲约阿施
  rationale: 约阿施是亚玛谢的亲生父亲；按希伯来文 יוֹאָשׁ 音译为现代中文圣经中通行的“约阿施”。
theological_decisions:
- issue: 对亚玛谢的肯定与限制
  choice: 先明确肯定他行耶和华眼中看为正的事，随后以“只是”指出他不及大卫，并说明他效法约阿施。
  alternative: 弱化与大卫的对比，或把开头的肯定视为纯粹公式而译成负面评价。
  rationale: 希伯来文同时保留真实的正面评价和随后的限制；译文不应消解这种张力。
- issue: “父亲大卫”的身份
  choice: 正文保留“父亲”，脚注说明其王朝祖先含义。
  alternative: 正文直接译作“祖先大卫”。
  rationale: 原文两次使用同一称谓 אָבִיו：对大卫是王朝祖先意义，对约阿施则是直接父亲。保留原词并加注，能呈现其修辞对应，又避免读者误解。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“耶和华眼中看为正的事”保留原文惯用意象；分号呈现正面评价、限制及与约阿施比较之间的结构。
