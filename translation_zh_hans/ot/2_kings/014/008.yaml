  text: אָ֣ז שָׁלַ֤ח אֲמַצְיָה֙ מַלְאָכִ֔ים אֶל יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לְכָ֖/ה נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: zh_hans
  text: 那时，亚玛谢派使者去见以色列王约阿施，就是约哈斯的儿子、耶户的孙子，对他说：“来吧，让我们面对面相见[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“让我们见面”。这是要求直接会面的说法；按上下文，这里是向对方发出正面交锋、很可能诉诸武力的挑战。
    reason: 说明希伯来语习语及其语境含义，同时保留正文措辞的含蓄性。
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为叙事中的时间推进标记，自然承接下一事件。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处指奉命传话的人，不是天使；“使者”准确且符合历史叙事语体。
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז בֶּן יֵהוּא
  choice: 约阿施，就是约哈斯的儿子、耶户的孙子
  rationale: 保留完整谱系关系，同时按现代汉语习惯把第二个“儿子”表达为“孙子”，避免误解且不损失信息。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 采用现代汉语中自然、简洁的王室称号语序。
- source_word: לֵאמֹר
  choice: 对他说
  rationale: 希伯来语常规引语标记；结合“派使者去见”译为“对他说”，使汉语叙述连贯。
- source_word: לְכָה
  choice: 来吧
  rationale: 既可表达邀请，也可表达挑战；此处保留其带有挑衅意味的召唤语气。
- source_word: נִתְרָאֶה פָנִים
  choice: 让我们面对面相见
  rationale: 贴近字面“让我们彼此见面/见脸”，同时在上下文中自然带出直接交锋的意味，不在正文中把军事含义绝对化。
