  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: zh_hans
  text: 他们把他放在马匹上[a]运送；他被葬在耶路撒冷的大卫城，与他的列祖同葬[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在马匹上”。这里可能指用马匹，或用由马承载的运输工具运送遗体。
    reason: lexical_alternative
  - marker: b
    text: “与他的列祖同葬”是传统的安葬用语，表示他与王室先祖一同安葬。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: 众人把他驮
  rationale: נשׂא在此表示抬、载运；结合后面的“在马上”，译作“驮”既具体又符合现代汉语叙事，宾语“他”指亚玛谢。
- source_word: עַל הַסּוּסִים
  choice: 在马上
  rationale: 直译介词עַל及复数名词“马”，保留遗体以马匹或马载工具运送的表达，不擅自具体化为马车。
- source_word: וַיִּקָּבֵר
  choice: 他被安葬
  rationale: 该动词为被动式；“被安葬”保留希伯来语语态，也符合庄重的中文叙事。
- source_word: בִּירוּשָׁלִַם ... בְּעִיר דָּוִד
  choice: 在耶路撒冷的大卫城里
  rationale: 自然表达大卫城位于耶路撒冷，并保留专名“大卫城”。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖同葬
  rationale: “列祖”保留传统家族和王朝安葬用语的色彩；“同葬”明确此处的语境含义。
