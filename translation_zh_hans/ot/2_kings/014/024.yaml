    rationale: הֶחֱטִיא的核心是“使……犯罪”。应避免用“陷在”替代直接使役意义；同时正文不宜过度判定关系从句究竟修饰耶罗波安还是与其罪行相联，脚注可说明该歧义。
  revised_text: 他行耶和华眼中看为恶的事。他没有离开尼八的儿子耶罗波安所犯的一切罪[a]。
