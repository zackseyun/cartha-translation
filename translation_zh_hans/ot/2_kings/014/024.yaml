  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为恶的事。他没有离开尼八的儿子耶罗波安所犯的一切罪[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“耶罗波安使以色列人犯罪的罪。”希伯来语关系从句可理解为直接指耶罗波安，即“耶罗波安曾使以色列人犯罪”；也可理解为与这些罪行相关，即以这些罪使以色列人犯罪。
    reason: 保留原文关系从句所指及其与“罪”之间关系的歧义，并明确“使以色列人犯罪”的使役含义。
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 保留希伯来语“行恶”的道德判断，并按现代汉语补足“事”，使表达自然庄重。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 贴近原文“在耶和华眼中”的评价性习语，同时采用现代汉语圣经语体中清楚自然的表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者最熟悉的专名形式音译四字神名，不用称号替代。
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: 不离开……的一切罪
  rationale: סור表示离开或转离；否定词与מִכָּל合用，表达他完全没有脱离这一整套罪恶行径。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 采用通行中文人名，并自然呈现父子关系。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 耶罗波安曾使以色列人陷在这些罪中
  rationale: הֶחֱטִיא是使役式，意为“使……犯罪”。此处将关系从句理解为与前面的“罪”相关，并明示耶罗波安为使役者；“陷在这些罪中”在汉语中既自然，也保留这些罪行使以色列犯罪的工具性联系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经传统中广为人知的专名形式，可使普通读者明确这是以色列之神的名字，而不是一般称号。
- issue: 关系从句אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל的所指
  choice: 把关系从句与“耶罗波安的罪”相联系，同时明示耶罗波安是使以色列犯罪的人
  alternative: 直接修饰耶罗波安：“他曾使以色列人犯罪”
  rationale: 希伯来语关系代词אֲשֶׁר本身不标明性数，因此语法上可以回指耶罗波安，也可以关联他所行的罪。正文用“陷在这些罪中”体现罪行的媒介性，脚注保留直接修饰耶罗波安的传统理解。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“行……看为恶的事”保留列王纪中反复出现的评语格式；避免过度古雅，也不借译文解决原文关系从句的歧义。
