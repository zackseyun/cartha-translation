revisions:
- from: 他行耶和华眼中看为恶的事，不离开尼八的儿子耶罗波安的一切罪；耶罗波安曾使以色列人陷在这些罪中。[a]
  to: 他行耶和华眼中看为恶的事。他没有离开尼八的儿子耶罗波安所犯的一切罪[a]。
  rationale: 修订保留原文的叙事评语、神名和人名，并以“没有离开……所犯的一切罪”更清楚表达全面不转离。正文不把“使以色列人犯罪”的关系从句扩写为“陷在这些罪中”，而在脚注中保留其可直接指向耶罗波安、或与其罪行相关的歧义。
  reviewer_model: gpt-5.6-terra
