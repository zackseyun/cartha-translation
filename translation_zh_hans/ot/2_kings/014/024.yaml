    issue: “不离开……一切罪”未充分显出否定词与“从所有”结合所表示的毫无脱离。
    rationale: 可被读作“并非离开全部罪”，而非“没有离开其中任何一种罪”。加入“没有”并以“所犯的一切罪”组织宾语，可更自然地表达原文的全面否定。
  - severity: medium
