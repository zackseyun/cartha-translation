  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַֽחֲרֵ֣י מ֔וֹת יְהוֹאָ֥שׁ בֶּן יְהֽוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: zh_hans
  text: 犹大王约阿施的儿子亚玛谢，在以色列王约哈斯的儿子约阿施死后，又活了十五年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 又活了
  rationale: 该动词在这里说明亚玛谢在另一位王死后继续活了一段明确的年数。“又活了”自然表达这种延续，而不额外强化为“比……多活”。
- source_word: אֲמַצְיָהוּ
  choice: 亚玛谢
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: יוֹאָשׁ
  choice: 约阿施
  rationale: 本节中亚玛谢之父的希伯来文拼写为短式 יוֹאָשׁ；中文采用通行译名“约阿施”。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 简洁、自然地表达其王位和所属国度。
- source_word: אַחֲרֵי מוֹת
  choice: 死后
  rationale: 准确表达“在……死亡之后”，并使中文句式自然流畅。
- source_word: יְהוֹאָשׁ
  choice: 约阿施
  rationale: 以色列王之名在本节写作长式 יְהוֹאָשׁ；现代中文通行译名仍为“约阿施”。
- source_word: יְהוֹאָחָז
  choice: 约哈斯
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 简洁、自然地表达其王位和所属国度。
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: 十五年
  rationale: 直接表达原文的时间长度。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。依照希伯来文的身份关系调整中文语序，以“犹大王……的儿子”及“以色列王……的儿子”清楚区分人物。希伯来文用短式 יוֹאָשׁ 和长式 יְהוֹאָשׁ 区分两个相关名字，但二者在通行简体中文中通常都译作“约阿施”；本句借助完整身份说明避免混淆，因此不设置仅基于英文拼写差异的脚注。
