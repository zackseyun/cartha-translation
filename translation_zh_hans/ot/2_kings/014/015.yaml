base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 至于约阿施其余的事、他所做的一切、他的勇力，以及他怎样与犹大王亚玛谢交战，不都记在《以色列诸王编年史》上吗？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָשׁ
  choice: 至于约阿施其余的事
  rationale: 这是《列王纪》中常见的王朝纪事总结语。“事”在此指君王的行事和政绩，而非单指言语；“至于”自然承接上下文，又不增添时间意义。
- source_word: אֲשֶׁר עָשָׂה
  choice: 他所做的一切
  rationale: 明确保留原文关系从句，不将其完全并入“其余的事”，也与上下文的概括性表达相称。
- source_word: וּגְבוּרָתוֹ
  choice: 以及他的勇力
  rationale: גְּבוּרָה可指力量、英勇或武功；结合战争语境，“勇力”既保留其宽泛含义，也自然体现军事能力。
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: 并他怎样与……交战
  rationale: עִם字面为“与”，在军事语境中表达敌对交战。“与……交战”在现代汉语中自然，无须另加“对抗”来强化。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王记》
  rationale: 该短语指以色列诸王的王室编年记录。“诸王记”简洁、自然，并区别于正典书名《历代志》。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗？
  rationale: 保留原文反问形式；“记在……上”符合汉语对书面记录的通常表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语，保留王朝纪事总结句的反问结构。人名依常用中文圣经译名处理。原文 עִם 的字面义与军事语境可由“与……交战”同时体现，因此无需脚注。
