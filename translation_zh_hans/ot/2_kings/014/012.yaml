  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: zh_hans
  text: 犹大在以色列面前战败；众人各自逃往自己的帐棚。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“各自逃往自己的家”。原文直译为“各人逃往他的帐棚”；这是指众人各自散回住处的常用说法。
    reason: 说明“帐棚”的字面译法及该表达所含的“各自回到住处”之习语性语境，同时不将“回”加入正文。
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: 败
  rationale: נָגַף 的尼法勒式在此军事语境中表示战败；“败”简洁自然，也保留叙事的庄重感。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 指南国犹大，采用现代中文圣经通行译名。
- source_word: לִפְנֵי
  choice: 在……面前
  rationale: 保留希伯来语的空间性表达；在战争语境中意为被对方击败。
- source_word: יִשְׂרָאֵל
  choice: 以色列
  rationale: 指北国以色列，采用现代中文通行译名。
- source_word: וַיָּנֻסוּ
  choice: 逃回
  rationale: נוּס 表示逃跑；结合后接目的地“自己的帐棚”，译为“逃回”符合自然汉语。
- source_word: אִישׁ
  choice: 众人各自
  rationale: 单数 אִישׁ 在此具有逐一分配的意义；“众人各自”准确传达每个人分别逃走的意思，同时比逐字译作“各人”更自然。
- source_word: לְאָהֳלוֹ
  choice: 自己的帐棚
  rationale: 直译为“他的帐棚”；配合分配性主语，现代汉语宜作“自己的帐棚”。“帐棚”保留原文意象，而不直接释义为“家”。
