  text: וְ/לָקַ֣ח אֶת כָּל הַ/זָּהָב וְ֠/הַ/כֶּסֶף וְ/אֵ֨ת כָּל הַ/כֵּלִ֜ים הַ/נִּמְצְאִ֣ים בֵּית יְהוָ֗ה וּ/בְ/אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֵ֖ת בְּנֵ֣י הַ/תַּֽעֲרֻב֑וֹת וַ/יָּ֖שָׁב שֹׁמְרֽוֹנָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: zh_hans
  text: 他拿走了所有的金银、耶和华殿里和王宫各宝库里的一切器皿，以及人质[a]，然后返回撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文作“抵押之子”或“担保人之子”，可能是指被扣作保证的人，也就是人质。
    reason: 保留疑难短语בְּנֵי הַתַּעֲרֻבוֹת的字面形式及其语境释义。
lexical_decisions:
- source_word: וְלָקַח
  choice: 他拿走了
  rationale: 这是连续叙事中的动词形式；“拿走”既表达取走财物，也符合战胜者掳掠的语境。
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: 所有的金银
  rationale: 保留כָּל所表达的全部范围；现代汉语通常将“金和银”自然合称为“金银”。
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים
  choice: 所找到的一切器皿
  rationale: כֵּלִים泛指器具或物件；在圣殿和王室库存的语境中，“器皿”庄重而清楚。分词הַנִּמְצְאִים译作“所找到的”。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: 原文直译为“耶和华的殿（家）”；在此明确指圣殿。“耶和华”直接呈现神名。
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: 和王宫宝库里
  rationale: אֹצְרוֹת指储藏贵重物品的库房；בֵּית הַמֶּלֶךְ字面为“王的家”，现代汉语以“王宫”准确传达所指。
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: 人质
  rationale: 该短语字面意义含混，可能是“抵押之子”或“担保人之子”，在上下文中最可能指作为安全保证而被扣押的人，因此正文译为“人质”，并以脚注保留字面可能性。
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: 然后返回撒马利亚
  rationale: שׁוב表示返回，地名后的方向词尾表示“到撒马利亚”；“然后”自然承接叙事次序。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“耶和华殿”和“王宫宝库”既保留原文结构，也避免生硬的逐字翻译；用脚注呈现“人质”背后的词义不确定性。
