base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: zh_hans
  text: 亚玛谢却不肯听[a]。于是，以色列王约阿施上去；他和犹大王亚玛谢在属犹大的伯示麦面对面相见[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“没有理会”或“没有听从”。希伯来语这个动词可指听了以后作出相应行动，并非仅仅听见。
    reason: lexical_alternative
  - marker: b
    text: 字面为“彼此看见对方的脸（面）”。这是指双方直接相见的表达；在这里的语境中，也带有对阵的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: 却不肯听
  rationale: שׁמע在这里不只是听见，也包含听从、理会警告并作出回应的意思；“不肯听”自然地表达亚玛谢有意拒绝，同时不把对方的话强化为上级命令。
- source_word: וַיַּעַל
  choice: 上去
  rationale: עלה的基本意义是“上去”。语境具有军事行动色彩，但正文保留原文简洁措辞，不额外明说“出兵”或“进军”。
- source_word: וַיִּתְרָאוּ פָנִים
  choice: 面对面交锋
  rationale: 该短语字面涉及“彼此见面”，在两王对阵的军事语境中指直接相遇、交锋；此译既保留“面对面”的形象，也清楚传达场景。
- source_word: בֵּית שֶׁמֶשׁ
  choice: 伯示麦
  rationale: 采用现代中文圣经地名的通行音译，不按字面译作“太阳之家”。
- source_word: אֲשֶׁר לִיהוּדָה
  choice: 属犹大的
  rationale: לִיהוּדָה表示该城在领土或管辖上归犹大；“属犹大的”比单说“在犹大”更贴近原文。
- source_word: וְלֹא
  choice: 却
  rationale: 连接词在此承接前文警告并表达转折；“却”简洁呈现这种篇章关系。
theological_decisions: []
