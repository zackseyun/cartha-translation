base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: zh_hans
  text: 他登基时二十五岁，在耶路撒冷作王二十九年。他母亲名叫约阿丁[a]，来自耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “约阿丁”在一些传统译本中作“约阿但”。
    reason: 保留该人名在文本传承及传统音译中的另一形式。
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה הָיָה בְמָלְכוֹ
  choice: 他登基时二十五岁
  rationale: 希伯来语以“二十五岁之子”表达年龄，并用“在他作王时”构成登基年龄公式；译作“登基时二十五岁”准确而符合现代汉语习惯。
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: 作王二十九年
  rationale: מלך在王朝纪年公式中指执掌王权；“作王二十九年”既忠实又自然。
- source_word: בִּירוּשָׁלָם
  choice: 在耶路撒冷
  rationale: 介词ב在此表示地点，指其统治所在的都城。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 以简洁、庄重的现代汉语表达列王纪反复出现的母亲姓名公式。
- source_word: יהועדין
  choice: 约阿丁
  rationale: 按所给马所拉文本的辅音形式及读音音译为“约阿丁”；另有传统形式，收入脚注。
- source_word: מִן יְרוּשָׁלָם
  choice: 是耶路撒冷人
  rationale: מן基本义为“从”，在人物籍贯公式中自然译为“是耶路撒冷人”，表达其来源而非当时居所。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的王朝纪年表达。“登基”用于即位时点，“作王”用于在位年数，避免重复生硬。脚注标记置于相关人名之后。
