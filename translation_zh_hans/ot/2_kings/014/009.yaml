base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: zh_hans
  text: 以色列王约阿施派人给犹大王亚玛谢传话，说：“黎巴嫩的刺灌木[a]传话给黎巴嫩的香柏树，说：‘把你的女儿嫁给我的儿子。’有一只黎巴嫩的野兽[b]经过，践踏了那棵刺灌木。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“蒺藜”“荆棘”；原文所指带刺植物的具体种类不能确定。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“田野的兽”，即野生动物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去见
  rationale: 此处是君王向另一位君王传话；现代汉语用“派人去见”自然表达使者受差遣前往，同时不增添原文未明说的内容。
- source_word: הַחוֹחַ
  choice: 一棵刺灌木
  rationale: חוֹחַ泛指带刺的植物，具体种类不确定。“刺灌木”既保留其低矮、带刺的形象，也能与高大的香柏树形成鲜明对比。
- source_word: הָאֶרֶז
  choice: 一棵香柏树
  rationale: אֶרֶז通常指黎巴嫩香柏；译作“香柏树”符合现代中文圣经语域，也保留寓言中高大尊贵的形象。
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: 把你的女儿嫁给我的儿子
  rationale: 按现代汉语婚姻表达处理“把女儿给我儿子作妻子”，意思清楚，并保留联姻请求。
- source_word: חַיַּת הַשָּׂדֶה
  choice: 一只野兽
  rationale: 字面是“田野的兽”，在上下文中泛指野生动物；“野兽”简洁、有寓言色彩。
- source_word: וַתַּעֲבֹר
  choice: 经过
  rationale: 准确表达动物从旁经过的动作，且适合现代汉语叙事。
- source_word: וַתִּרְמֹס
  choice: 踩烂
  rationale: רמס表示践踏。“踩烂”生动表现弱小刺灌木被野兽踏毁的结果，又不显生硬。
