- from: 以色列王约阿施派人去见犹大王亚玛谢，说：“黎巴嫩的一棵刺灌木[a]派人去见黎巴嫩的一棵香柏树，说：‘把你的女儿嫁给我的儿子。’后来，黎巴嫩的一只野兽[b]经过，把那棵刺灌木踩烂了。”
  to: 以色列王约阿施派人给犹大王亚玛谢传话，说：“黎巴嫩的刺灌木[a]传话给黎巴嫩的香柏树，说：‘把你的女儿嫁给我的儿子。’有一只黎巴嫩的野兽[b]经过，践踏了那棵刺灌木。”
  rationale: 修订保留原文两次“差遣／传讯”的寓言平行，避免将未明说的使者实体化；同时删去“后来”的额外时间色彩，并把“踩烂”收敛为与原文相称的“践踏”。脚注锚点及内容均保留并与正文对应。
