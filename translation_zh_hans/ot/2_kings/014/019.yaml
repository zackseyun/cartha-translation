base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: zh_hans
  text: 他们在耶路撒冷密谋反对他；他逃往拉吉。他们派人到拉吉追赶他[a]，并在那里杀了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们差遣在他后面，往拉吉去”；原文没有明说所差遣的是谁。也可译作“他们派人随后到拉吉去”。
    reason: 说明 וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה 的简略表达，并保留“派人追赶”所作的语境性补足。
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: 他们……密谋反叛他
  rationale: 动词 קשׁר 与同根名词 קֶשֶׁר 构成强调性的政治密谋表达。“密谋反叛他”既传达针对君王的阴谋性质，也避免照搬同根词造成生硬重复。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 介词 ב 在此表示地点，按通常地名译法处理。
- source_word: וַיָּנָס
  choice: 他就逃往
  rationale: נוס 的基本义是逃跑、逃离；“逃往”与后面的目的地自然衔接。“就”承接叙事次序，不额外引入转折。
- source_word: לָכִישָׁה
  choice: 拉吉
  rationale: 词尾的方向性 ה 表示朝向该城；汉语通过“逃往”“追到”表达移动方向。地名采用现代中文常用圣经译名“拉吉”。
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: 他们派人追到
  rationale: 希伯来文直译为“他们差遣在他后面”，受差遣者没有明说。“派人追到”是自然汉语，并明确表达上下文中的追赶含义；所补出的“人”属语法和语义所隐含的成分，脚注保留原文措辞的简略性。
- source_word: וַיְמִתֻהוּ
  choice: 把他处死
  rationale: מות 的使役形表示使其死亡，即杀死或处死。“处死”体现有意将其杀害的使役语气，也符合王权叛乱的叙事语境。
- source_word: שָׁם
  choice: 在那里
  rationale: 地点副词回指拉吉；“在那里”在汉语中清楚自然。
theological_decisions: []
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。各叙事分句按希伯来文顺序推进，以分号划分逃亡与追杀两个阶段；不加入原文没有的转折关系。
