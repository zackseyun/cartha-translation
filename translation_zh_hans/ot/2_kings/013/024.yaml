  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: zh_hans
  text: 亚兰[a]王哈薛死了，他的儿子便·哈达接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”是希伯来文中的国名，旧译有时作“叙利亚”。
    reason: 说明历史国名的传统译法，避免读者将译名差异误认为不同国家。
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: מות的Qal叙事形式，直接表示过去发生的“死了”；句首וַ由汉语顺承语序自然体现，无须机械译作“然后”。
- source_word: חֲזָאֵל
  choice: 哈薛
  rationale: 采用现代中文圣经中通行且易辨识的人名音译。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: אֲרָם是古代国名“亚兰”；采用“亚兰王”既贴近希伯来文，也符合自然汉语。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在王位承继语境中表示登位作王，而非强调统治持续的时间。
- source_word: בֶּן הֲדַד
  choice: 便·哈达
  rationale: 按现代中文常见形式音译该人名，并以间隔号标明复合名称。
- source_word: בְּנוֹ
  choice: 他的儿子
  rationale: 保留原文明确的父子关系；“他”回指哈薛。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 王位承继公式中的תַּחַת表示取代前任、继承其位；“接替他作王”自然且准确。
theological_decisions: []
translation_notes:
  register: 采用简洁、庄重的现代标准汉语叙事体。“接替他作王”清楚表达王位承继；不额外加入原文没有的因果或时间信息。
