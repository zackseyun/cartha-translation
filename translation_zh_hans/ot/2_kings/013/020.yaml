  terminology: 人名“以利沙”正确且符合通行中文圣经用法。“劫掠队”恰当传达גְּדוּד的袭扰、掠夺性质，又不把它限定为正规军。“这地”保留原文所称土地的指称，避免将其释作特定现代意义的“境内”。
