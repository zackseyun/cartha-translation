  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: zh_hans
  text: 以利沙死了，人们埋葬了他。每到一年开始的时候[a]，摩押人的劫掠队就会进入这地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“每逢春季”。希伯来文直译为“在一年到来之时”，可指岁序转换之际，常与春季出征时节有关。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死了
  rationale: 该叙事形式推进事件次序；现代汉语以“死了”自然表达动作已经发生，无须另加“然后”。
- source_word: אֱלִישָׁע
  choice: 以利沙
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 人们埋葬了他
  rationale: 希伯来文是主动复数动词，带第三人称阳性单数宾语后缀，直译为“他们埋葬了他”；“人们”自然保留主语未特指的特点。
- source_word: גְדוּדֵי מוֹאָב
  choice: 摩押的袭击队
  rationale: גְדוּדֵי 指成群出动、进行劫掠或袭击的队伍，不一定是正规军；“袭击队”兼顾军事含义和现代汉语的自然表达。
- source_word: יָבֹאוּ
  choice: 就会进入
  rationale: 未完成式在这里表示过去反复发生的惯常行动；与“每逢”搭配，用“就会”清楚表达这一习惯性意义。
- source_word: בָאָרֶץ
  choice: 进入境内
  rationale: 介词短语与“来、进入”连用，语境指摩押袭击队进入以色列境内；“境内”比单说“地里”更符合现代汉语。
- source_word: בָּא שָׁנָה
  choice: 每逢年初
  rationale: 该短语字面为“一年到来时”，在语境中指岁序转换之际，并可能特指春季出征季节；正文用“年初”保留时间转折的表达，脚注说明另一种理解。
