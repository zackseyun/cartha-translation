base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: zh_hans
  text: 亚兰王没有给约哈斯留下兵力，只剩五十名骑兵、十辆战车和一万名步兵；因为亚兰王毁灭了他们，使他们如同打谷时的尘土[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “如同打谷时的尘土”也可译作“如同供践踏的尘土”。原文动词指打谷，也可唤起踩踏的意象。
    reason: 保留לָדֻשׁ在“打谷”与踩踏意象之间的词义张力，并将标记锚定于所解释的比喻。
lexical_decisions:
- source_word: הִשְׁאִיר לִיהוֹאָחָז עָם
  choice: 留给约哈斯的兵力
  rationale: הִשְׁאִיר表示“使留下、留存”；עָם本可指“人民”，但下文逐项列出骑兵、战车和步兵，语境明确指军事力量。“兵力”既贴合语境，也避免把“人”与战车并列所造成的不自然。
- source_word: כִּי אִם
  choice: 只剩下
  rationale: 该结构接在否定表达之后，限定唯一的余数；中文用“只剩下”自然传达“不再有，除了……”的意思。
- source_word: חֲמִשִּׁים פָּרָשִׁים
  choice: 五十名骑兵
  rationale: פָּרָשִׁים在军事清单中指骑马作战的人；“骑兵”是现代中文清楚、简洁的说法。
- source_word: עֲשָׂרָה רֶכֶב
  choice: 十辆战车
  rationale: רֶכֶב虽为单数形式，却可作集合名词；与数字十连用时，指十辆军事战车。
- source_word: עֲשֶׂרֶת אֲלָפִים רַגְלִי
  choice: 一万名步兵
  rationale: רַגְלִי指徒步作战的军士；“步兵”符合现代汉语军事用语。
- source_word: אִבְּדָם
  choice: 毁灭了约哈斯的军队
  rationale: אבד的Piel形式表达强烈的毁灭、消灭之意。希伯来文代词“他们”的所指依上下文是约哈斯原有的军队；中文明确补出所指，以免与紧接着的“亚兰王”产生歧义。
- source_word: וַיְשִׂמֵם כֶּעָפָר
  choice: 使他们如同……尘土
  rationale: שׂים与比较短语连用，表示“使之成为某种状况”；保留原文“如同尘土”的强烈比喻。
- source_word: לָדֻשׁ
  choice: 禾场上被践踏的
  rationale: דושׁ可指打谷，也可聚焦打谷时踩踏谷物的动作。此处兼具打谷场景和践踏意象，正文以“禾场上被践踏的尘土”自然呈现，并用脚注保留较直译的另一种理解。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。为使因果关系和代词所指清楚，将希伯来文后置的原因分句前置；不改变命题内容。脚注标记置于整节末尾，因为脚注解释的是末句比喻，而不是“骑兵”。
