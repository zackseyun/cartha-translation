  to: 亚兰王没有给约哈斯留下兵力，只剩五十名骑兵、十辆战车和一万名步兵；因为亚兰王毁灭了他们，使他们如同打谷时的尘土[a]。
  rationale: 修订使中文句法更贴近原文“没有留下……因为……”的结构，将尘土比喻改为自然且不预先限定解释的“打谷时的尘土”，并把脚注标记移至相关短语后。军事术语、数字、专名及“毁灭”的强度均予保留。
