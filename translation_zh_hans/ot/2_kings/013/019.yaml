  to: 神人向他发怒，说[a]：“你本该击打地面五次或六次；那样，你就会打击亚兰，直到彻底制伏亚兰[b]。可是现在，你只能打击亚兰三次。”
  rationale: 修订保留“击打”在象征行动与其军事后果之间的呼应；将“五六次”展开为“五次或六次”，准确呈现原文的选择连词；并以“彻底制伏”及脚注中的“使亚兰终结”表达 עַד כַּלֵּה 的完成性，而不把其限定为人口或国家意义上的彻底消灭。
