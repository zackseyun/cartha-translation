  text: וַ/יִּקְצֹ֨ף עָלָ֜י/ו אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּ֨אמֶר֙ לְ/הַכּ֨וֹת חָמֵ֤שׁ אוֹ שֵׁשׁ֙ פְּעָמִ֔ים אָ֛ז הִכִּ֥יתָ אֶת אֲרָ֖ם עַד כַּלֵּ֑ה וְ/עַתָּ֕ה שָׁלֹ֥שׁ פְּעָמִ֖ים תַּכֶּ֥ה אֶת אֲרָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: zh_hans
  text: 神人向他发怒，说[a]：“你本该击打地面五次或六次；那样，你就会打击亚兰，直到彻底制伏亚兰[b]。可是现在，你只能打击亚兰三次。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文此处只说“击打”；“地面”是根据上一节紧接着的动作补出的。
    reason: cross_reference
  - marker: b
    text: 或译：“直到使亚兰终结。”原文表达对亚兰的彻底结束；具体所指的方式未予说明。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף עָלָיו
  choice: 向他发怒
  rationale: קצף表示发怒；“向他发怒”自然、庄重，也不夸大其强度。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是该希伯来称谓在中文圣经语境中的简洁、稳定表达，保留其称号性质，不释为“先知”。
- source_word: לְהַכּוֹת
  choice: 击打地面
  rationale: 原文此处只有“击打”，宾语由上一节的动作补足；正文补出“地面”以使责备清楚，并以脚注说明。
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: 五六次
  rationale: 准确传达“五次或六次”，中文“ 五六次”自然，并保留约数式表达。
- source_word: הִכִּיתָ אֶת אֲרָם
  choice: 击败亚兰
  rationale: 在军事语境中，נכה指击打并战胜。中文若说“击打亚兰”较生硬；“击败”清楚表达结果，而上下文仍保留象征动作与胜利次数的对应。
- source_word: עַד כַּלֵּה
  choice: 直到将它彻底消灭
  rationale: כלה在此表达使亚兰走到尽头、完全结束其军事力量；“彻底消灭”传达完成性，同时脚注保留较宽的词义可能。
- source_word: וְעַתָּה
  choice: 可是现在
  rationale: 明确表现未实现的可能与实际结果之间的转折。
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: 你只能击败亚兰三次
  rationale: 未完成式在此为预告；“只能”将责备语境中隐含的限制自然表达出来。
theological_decisions:
- issue: 是否保留击打地面与战胜亚兰之间的象征联系
  choice: 正文用“击打地面”与“击败亚兰”，并保持次数上的直接对应
  alternative: 两处都直译为“击打”
  rationale: 中文“击打亚兰”不够自然；“击败”准确呈现军事含义，而重复的次数结构仍使先知性象征动作与胜利相连。
- issue: עַד כַּלֵּה所表达的完全程度
  choice: 译作“直到将它彻底消灭”，并用脚注给出较中性的替代译法
  alternative: 直到使亚兰终结／直到结束
  rationale: 原文明确带有完成、终结的力度，但具体是国家灭绝还是军事上的彻底制伏仍有语义空间，因此正文传达强度，脚注保留张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神人”为简洁的传统称谓；“你本该……那样……”自然表达希伯来文中未实现的可能；正文中的所有脚注标记均已对应列出。
