base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/022.yaml
  text: Hazael king of Aram oppressed Israel all the days of Jehoahaz[a].
translation:
  language: zh_hans
  text: 亚兰[a]王哈薛在约哈斯年间一直欺压以色列。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”在一些传统译本中译作“叙利亚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: 哈薛
  rationale: וַ־承接并推进叙事，中文无需机械译出“于是”或“现在”；人名按通行中文译名译作“哈薛”。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 按希伯来专名 אֲרָם 译作“亚兰”，而不以传统地理名称“叙利亚”替代；中文称号自然表达为“亚兰王”。
- source_word: לָחַץ
  choice: 一直欺压
  rationale: 该动词表示施加压迫或逼迫；结合后面的持续时间短语，以“一直欺压”清楚表达长期的政治与军事压迫。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: 直宾标记后的国名；本节语境指北国以色列。
- source_word: כֹּל יְמֵי
  choice: 年间一直
  rationale: 原文意为“所有的日子”，表示整个时期持续如此；中文用“年间一直”自然传达完整持续性。
- source_word: יְהוֹאָחָז
  choice: 约哈斯
  rationale: 采用通行的现代中文圣经人名译法。
theological_decisions:
- issue: כֹּל יְמֵי יְהוֹאָחָז 所指的时期
  choice: 约哈斯年间
  alternative: 约哈斯在位的所有日子／约哈斯一生的日子
  rationale: 上下文主要涉及约哈斯执政时期，但原文未明说“在位”或“一生”；“约哈斯年间”既符合语境，也避免把原文的时间范围限定得过死。
translation_notes:
  register: 采用现代、简洁而庄重的叙事体。“一直”与“年间”共同表达原文所强调的持续性；不另加显性的叙事连接词。
