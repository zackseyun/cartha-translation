  text: וֶֽ/אֱלִישָׁע֙ חָלָ֣ה אֶת חָלְי֔/וֹ אֲשֶׁ֥ר יָמ֖וּת בּ֑/וֹ וַ/יֵּ֨רֶד אֵלָ֜י/ו יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל וַ/יֵּ֤בְךְּ עַל פָּנָי/ו֙ וַ/יֹּאמַ֔ר אָבִ֣/י אָבִ֔/י רֶ֥כֶב יִשְׂרָאֵ֖ל וּ/פָרָשָֽׁי/ו־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: zh_hans
  text: 以利沙患了一场病，后来因这病去世。以色列王约阿施下到他那里，伏在他脸上哭泣，说：“我父啊！我父啊！以色列的战车和骑兵啊！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话呼应列王纪下2:12；当时以利沙曾用同样的话呼喊以利亚。
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ אֲשֶׁר יָמוּת בּוֹ
  choice: 患了那使他后来死亡的病
  rationale: 保留动词与同根名词形成的强调，并以自然中文表达该病后来导致以利沙死亡的叙事视角。
- source_word: וַיֵּרֶד אֵלָיו
  choice: 下来看他
  rationale: “下”保留ירד的方向信息；“来看他”在中文中自然表达王前去探望病中的以利沙，未额外说明具体地理原因。
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: 伏在他面前哭泣
  rationale: 原文直译近于“在他脸上方哭”；此处用“伏在他面前”保留身体趋近与面对病者哀哭的画面，同时避免中文误解为眼泪落在脸上。
- source_word: אָבִי אָבִי
  choice: 我父啊！我父啊！
  rationale: 保留第一人称所有格、重复和哀呼语气，也维持与列王纪下2:12的用语呼应。
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: 以色列的战车和马兵啊
  rationale: 直接保留军事意象和呼语形式，不把其隐喻意义解释性地写入正文；רֶכֶב为形态上的单数集合名词，中文“战车”可自然作类称。
theological_decisions:
- issue: “以色列的战车和马兵”所表达的隐喻
  choice: 保留为约阿施对以利沙发出的直接哀呼
  alternative: 解释为以利沙就是以色列真正的军事保障，或解释为约阿施看见天上的战车
  rationale: 原句呼应列王纪下2:12，但本节没有明说其隐喻的全部范围。直译意象可保留先知与以色列保障之间的张力，而不把某一种解释写进正文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。正文不添加原文没有的“那时/如今”等显性时间标记。“我父”略带庄重色彩，适合保留原文的敬爱与哀痛。
