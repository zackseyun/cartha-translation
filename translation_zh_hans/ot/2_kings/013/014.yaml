revisions:
- from: 以利沙患了那使他后来死亡的病。以色列王约阿施下来看他，伏在他面前哭泣，说：“我父啊！我父啊！以色列的战车和马兵啊！”[a]
  to: 以利沙患了一场病，后来因这病去世。以色列王约阿施下到他那里，伏在他脸上哭泣，说：“我父啊！我父啊！以色列的战车和骑兵啊！”[a]
  rationale: 修订首句以自然中文保留该病后来导致以利沙死亡的叙事信息；将“下来看他”收敛为“下到他那里”，避免补入探望这一未明说的目的；删除无原文依据的“伏在”，改为“伏在他脸上哭泣”以尽量保留原文“在他面上/脸上方哭”的生动而略带不确定的空间表述。保留交叉引文脚注及其锚点。
