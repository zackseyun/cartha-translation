  text: וַ/יֹּ֣אמֶר לְ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הַרְכֵּ֤ב יָֽדְ/ךָ֙ עַל הַ/קֶּ֔שֶׁת וַ/יַּרְכֵּ֖ב יָד֑/וֹ וַ/יָּ֧שֶׂם אֱלִישָׁ֛ע יָדָ֖י/ו עַל יְדֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: zh_hans
  text: 他对以色列王说：“把你的手放在弓上[a]。”王就把手放在弓上。以利沙把自己的双手放在王的双手上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译为“把你的手置于弓上”。
    reason: 说明命令式在现代汉语中的近义译法；不把词根意象误作本处的生硬直译。
lexical_decisions:
- source_word: הַרְכֵּב
  choice: 搭在
  rationale: 这是רכב的使役命令式；在此描写让手置于弓上的动作。“搭在”既自然，又保留手与弓接触、就位的具体画面，避免生硬直译为“使……骑上”。
- source_word: יָדְךָ עַל הַקֶּשֶׁת
  choice: 把手搭在弓上
  rationale: עַל表达位于其上、与之接触。“弓”带定指，但现代汉语在此无需另加“那把”。
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: 王就把手搭在弓上
  rationale: 希伯来文未重复“弓”，但汉语补明所指可避免“把手搭上去”的含混；补出“王”也使连续动作的主语清楚。
- source_word: וַיָּשֶׂם
  choice: 放在
  rationale: שׂים在此表示把手置于某处。“放在”准确而中性，不额外赋予按压、授权或祝福的含义。
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: 把自己的双手放在王的双手上
  rationale: 原文两处均为复数形式；译作“双手”保留以利沙的双手覆于或置于王双手之上的身体动作，同时不进一步解释象征意义。
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: 他对以色列王说
  rationale: 叙事连接词在现代汉语中可由语序自然表达，无须机械译出“于是”；“他”承接上文的以利沙。
theological_decisions:
- issue: 以利沙把双手放在王双手上的意义
  choice: 只如实叙述动作，不在正文中说明其象征意义
  alternative: 译成带有“赋予能力”或“引导作战”意味的表达
  rationale: 本节只记载动作，其意义由上下文逐步显明；译文不应预先限定为先知赋能、祝福或神圣引导。
- issue: 介词עַל所呈现的手部位置
  choice: 译为“放在……上”
  alternative: 译为“按住”或“覆在”
  rationale: “按住”加入了压力和控制意味，“覆在”则较明确地解释了覆盖方式；原文只确定双手位于王的双手之上，宜保留一定空间关系上的开放性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“搭在”用于王把手置于弓上的动作；“放在”用于以利沙的动作，以免重复用词造成机械感，也不加入“按手”可能带出的固定宗教联想。脚注标记紧跟其实际所说明的短语，而非置于“以色列王”之后。
