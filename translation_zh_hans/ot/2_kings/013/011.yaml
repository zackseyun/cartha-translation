source:
  edition: WLC
  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: zh_hans
  text: 他做了耶和华眼中看为恶的事。他没有转离尼八的儿子耶罗波安所犯的任何罪；耶罗波安曾使以色列人犯罪；他行在其中。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “其中”原文为阴性单数，前文“罪”则为复数；此处可能将耶罗波安的种种罪集合性地看作一条罪恶道路。
    reason: 说明原文单数代词与复数“罪”之间的数不一致，并保留其可能的集合性指代。
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: 他行……看为恶的事
  rationale: 采用《列王纪》中反复出现的评判公式，既保留“行”的表达，又使现代汉语自然清楚。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价意象；将神名 יְהוָה 译作现代中文通行的“耶和华”。
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: 不离开……任何罪
  rationale: 在否定句中，מִכָּל 表明他没有离弃其中任何一种罪；这样既准确表达范围，也符合现代汉语。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 按现代中文圣经人名的通行译法处理，并保留希伯来语父名结构。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 使以色列人陷入的
  rationale: הֶחֱטִיא 是使役形，表示使以色列犯罪；“陷入”自然表达被带入罪中的含义。关系从句按其最自然的先行词“罪”来理解。
- source_word: בָּהּ הָלָךְ
  choice: 他仍行在其中
  rationale: 保留 הלך 的“行走/行事”隐喻；בָּהּ 形式上是阴性单数，可集合性地指前述耶罗波安的罪恶道路。加入“仍”表达持续不改的语境，不增加新的命题内容。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文普通读者最熟悉且通行的专名形式是“耶和华”；不以“主”替代，从而保留专名性质。
- issue: אֲשֶׁר 的关系所指
  choice: 理解为耶罗波安借这些罪使以色列人陷入罪中
  alternative: 理解为“那使以色列人犯罪的耶罗波安”
  rationale: 关系代词可引出与“罪”相关的说明；本译文保留英文咨询层所采用的工具/方式关系，但不扩展具体罪行。
- issue: בָּהּ 的数与所指
  choice: 正文译作“其中”，集合性指前述罪恶模式
  alternative: 直译为“在它里面”
  rationale: 阴性单数后缀与前面的复数“罪”存在形式张力，可能集合性指耶罗波安的罪恶道路；“其中”在中文里不标明单复数，可较好保留这种含混。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语，保留《列王纪》的固定评判语式和“行在其中”的圣经性隐喻；避免过度古雅，也不补入宗派性解释。
