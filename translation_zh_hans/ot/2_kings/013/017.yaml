  text: וַ/יֹּ֗אמֶר פְּתַ֧ח הַ/חַלּ֛וֹן קֵ֖דְמָ/ה וַ/יִּפְתָּ֑ח וַ/יֹּ֤אמֶר אֱלִישָׁ֤ע יְרֵה֙ וַ/יּ֔וֹר וַ/יֹּ֗אמֶר חֵץ תְּשׁוּעָ֤ה לַֽ/יהוָה֙ וְ/חֵ֣ץ תְּשׁוּעָ֣ה בַֽ/אֲרָ֔ם וְ/הִכִּיתָ֧ אֶת אֲרָ֛ם בַּ/אֲפֵ֖ק עַד כַּלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: zh_hans
  text: 以利沙说：“打开朝东的窗户。”王就打开了。以利沙说：“射箭！”王就射了。以利沙说：“这是耶和华的得胜之箭[a]，是战胜亚兰的得胜之箭！你必在亚弗击打亚兰，直到把亚兰灭尽。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“从耶和华而来的拯救之箭，是战胜亚兰的拯救之箭。”希伯来语“得胜”一词也可表示“拯救”或“解救”。
    reason: 保留תְּשׁוּעָה在“得胜”“拯救”和“解救”之间的词义空间，并将第二短语中针对亚兰的关系正确译出。
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: 打开朝东的窗户
  rationale: פְּתַח是直接命令“打开”；קֵדְמָה表示方向“朝东”，保留希伯来语的方向含义，而不将其限定为窗户本身的名称。
- source_word: יְרֵה
  choice: 射箭
  rationale: 该动词在此为射箭语境中的命令。汉语单说“射”略显不完整，“射箭”自然清楚，虽补出隐含宾语，却没有改变动作含义。
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: 耶和华使人得胜的箭
  rationale: תְּשׁוּעָה可指拯救、解救或胜利；本节为军事象征行动，“使人得胜”最贴合即时语境。לַיהוָה在此表达胜利出于耶和华，译为“耶和华使人得胜”比生硬的所有格更符合现代汉语。
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: 是战胜亚兰的箭
  rationale: 第二短语解释前一短语；בַאֲרָם在军事语境中表示针对亚兰，译作“战胜亚兰”自然明确。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 采用希伯来地名的传统现代汉语音译，避免以现代国家名称“叙利亚”替代古代亚兰。
- source_word: וְהִכִּיתָ אֶת אֲרָם
  choice: 你必……击打亚兰
  rationale: נכה在此意为击打、打击；“击打”保留原文动作意象，不提前将其完全解释为“消灭”。
- source_word: בַּאֲפֵק
  choice: 在亚弗
  rationale: 介词ב与战场地名连用，汉语自然译为“在亚弗”。
- source_word: עַד כַּלֵּה
  choice: 直到把它灭尽
  rationale: 该结构表示一直到彻底结束或毁灭；“灭尽”保留完全击溃的强烈程度，“它”回指作为敌方势力的亚兰。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名译法，作为四字神名的专名表达。
theological_decisions:
- issue: 军事语境中תְּשׁוּעָה的含义
  choice: 得胜
  alternative: 拯救／解救
  rationale: 射箭的象征行动和随后对亚兰的打击表明此处直接指战场上的胜利；脚注保留该词较广的拯救含义，避免消除其神学张力。
- issue: לַיהוָה所表达的关系
  choice: 耶和华使人得胜
  alternative: 耶和华的得胜之箭／从耶和华而来的拯救之箭
  rationale: 该介词短语可理解为归属、来源或施行者。正文用“使人得胜”自然表达胜利来自耶和华，同时脚注保留“从耶和华而来的拯救”这一可能读法。
- issue: 四字神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是普通现代中文读者最熟悉的专名形式；不以“主”替代，可使神名在本节的宣告中保持可辨识性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。为消除连续男性代词在中文中的指代不清，依据紧邻上下文明确写出“以利沙”和“王”；命令句保持简洁有力。
