  to: 以利沙说：“打开朝东的窗户。”王就打开了。以利沙说：“射箭！”王就射了。以利沙说：“这是耶和华的得胜之箭[a]，是战胜亚兰的得胜之箭！你必在亚弗击打亚兰，直到把亚兰灭尽。”
  rationale: 修订仅处理可安全确定的语义与脚注问题：以较中性的“耶和华的得胜之箭”保留原文关系的开放性；将脚注中的“脱离亚兰”改为“战胜亚兰”；并将末句代词改为明确的“亚兰”。其余叙述、专名和军事意象均予保留。
