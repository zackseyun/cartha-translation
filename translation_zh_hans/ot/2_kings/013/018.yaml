base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/018.yaml
  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: zh_hans
  text: 以利沙又说：“拿起箭来。”王就拿了箭。以利沙对以色列王说：“击打地面。”王击打了三次，就停下了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “停下了”直译为“站立了”；这里指王击打三次之后便停止。
    reason: 保留וַיַּעֲמֹד的字面意义，同时说明其在本句中的语境用法。
lexical_decisions:
- source_word: קַח הַחִצִּים
  choice: 把箭拿来
  rationale: 命令式קַח与定冠词复数名词הַחִצִּים构成直接命令；“把箭拿来”符合现代汉语叙事中的自然口吻，也保留命令的直接性。
- source_word: וַיִּקָּח
  choice: 王就拿了箭
  rationale: 希伯来文仅说“他拿了”，但连续出现的男性代词在汉语中容易混淆说话者与受命者；依上下文明确为王，并补出宾语“箭”，不改变所指。
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: 对以色列王说
  rationale: 直接表达间接受词结构，采用现代而庄重的常用说法。
- source_word: הַךְ אַרְצָה
  choice: 击打地面
  rationale: הַךְ是נכה的命令式，表示击打；אַרְצָה带方向意味，指朝地面击打。“击打地面”既自然，也不擅自说明具体用箭的方式。
- source_word: וַיַּךְ שָׁלֹשׁ פְּעָמִים
  choice: 王击打了三次
  rationale: 按原文重复同一动词，并用“三次”自然表达次数；明确主语为王，以避免汉语代词歧义。
- source_word: וַיַּעֲמֹד
  choice: 就停下了
  rationale: 该动词字面义为“站立”，在连续击打的语境中惯用地表示停止；正文采用自然汉语，并以脚注保留字面可能。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。为避免连续男性代词造成歧义，依上下文将说话者明确为“以利沙”，将执行命令者明确为“王”；不具体说明王如何用箭击打地面，以保留原文未明说的动作方式。
