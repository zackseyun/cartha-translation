  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: zh_hans
  text: 约哈斯与他的列祖同睡；有人把他葬在撒马利亚。他的儿子约阿施[a]接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文使用这个名字的短式“约阿施”（יוֹאָשׁ）；另有较长形式“约阿施”（יְהוֹאָשׁ），两种形式在中文里通常译名相同。
    reason: 说明希伯来文名字存在长短两种形式，而中文通行译名无法体现其拼写差异。
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与列祖同睡
  rationale: 这是希伯来王室记载中惯用的死亡公式。译文保留“睡”的意象，同时采用现代中文读者熟悉的圣经表达；上下文中的安葬清楚表明这里指死亡。
- source_word: וַיִּקְבְּרֻהוּ
  choice: 人将他葬
  rationale: 原文是第三人称复数动词并带第三人称单数宾语后缀，主语未具体说明。用泛指的“人”保留主动结构和不定复数的含义。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 介词 בְ 在这里表示安葬地点；“在撒马利亚”是自然准确的现代中文表达。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך 在王位承接记载中表示登基并执掌王权。“作王”简洁地表达这一王权语义。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 原义是“在他的位置上”，这里表示王位继承。“接替他”自然地保留替代和承继的含义。
- source_word: יְהוֹאָחָז
  choice: 约哈斯
  rationale: 按现代中文圣经通行的人名译法音译。
- source_word: יוֹאָשׁ
  choice: 约阿施
  rationale: 按现代中文圣经通行的人名译法音译；原文在本节使用该名字的短式。
