  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ֠/יֵּלֶךְ אַחַ֨ר חַטֹּ֜את יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל לֹא סָ֥ר מִמֶּֽ/נָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为恶的事，跟随尼八的儿子耶罗波安使以色列陷入的那些罪；他没有转离这种罪恶行径[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“没有转离它”。这里的代词是阴性单数，可能概括指耶罗波安整套罪行或罪恶模式。
    reason: 保留原文阴性单数代词造成的指代含混，并说明正文以集合性表达处理。
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  choice: 他行耶和华眼中看为恶的事
  rationale: 保留《列王纪》中按耶和华评断君王行为的固定表达，同时采用自然、庄重的现代汉语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名音译呈现四字神名，不用一般性称号替代。
- source_word: וַיֵּלֶךְ אַחַר
  choice: 跟随
  rationale: 该希伯来语习语意为追随某种道路或行为模式；“跟随”在现代汉语中自然，也保留其效法、依从之意。
- source_word: חַטֹּאת יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安……的那些罪
  rationale: חַטֹּאת为复数，译作“那些罪”；父子称谓按希伯来语次序自然转为中文“尼八的儿子耶罗波安”。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 使以色列陷入的
  rationale: הֶחֱטִיא是使役式，表示耶罗波安使以色列犯罪；与“那些罪”组合时，“使以色列陷入的那些罪”比“使以色列犯的那些罪”更自然，并保留使役关系。
- source_word: לֹא סָר מִמֶּנָּה
  choice: 始终没有离开
  rationale: סוּר表示离开、转离；中文省略可由上文明确补出的宾语，避免把阴性单数后缀未经说明地改成复数，同时“始终”传达其持续不离的叙事含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文采用广为人知、具有专名功能的“耶和华”，既不以“主”替代，也不把一种有争议的现代复原读音确立为唯一形式。
- issue: מִמֶּנָּה 中阴性单数后缀的所指
  choice: 正文用省略宾语的“始终没有离开”，脚注说明原文为阴性单数“没有离开它”
  alternative: 没有离开那些罪
  rationale: 原文后缀是阴性单数，而前面的“罪”是复数形式；它可能概括指耶罗波安的整套罪行或罪恶模式。正文不强行把它改成复数，脚注保留形态与指代上的张力。
translation_notes:
  register: 采用现代标准普通话和庄重叙事语体。“耶和华眼中看为恶”保留经文的审判公式；其余语序作适度汉语化处理。正文脚注标记[a]与脚注对应。
