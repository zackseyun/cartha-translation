  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: zh_hans
  text: 耶和华赐给以色列一位拯救者[a]，他们就脱离了亚兰的辖制[b]。以色列人便像从前一样，住在自己的帐棚里[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拯救者”也可译作“施行拯救的人”。原文没有说明此人的身份。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“从亚兰手下出来”，意思是脱离亚兰的权势或控制。
    reason: cultural_note
  - marker: c
    text: “像从前一样”原文是“像昨天、前天一样”，是指往日或先前的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名号译法，明确对应希伯来文四字神名。
- source_word: מוֹשִׁיעַ
  choice: 一位拯救者
  rationale: 指带来解救的人；“拯救者”既保留原词的施救含义，也不把经文未说明的身份强加给此人。
- source_word: מִתַּחַת יַד אֲרָם
  choice: 脱离亚兰的辖制
  rationale: 原文直译为“从亚兰手下出来”，是脱离其权势或控制的惯用语；正文传达其自然含义，脚注保留具体意象。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 保留古代政权的历史名称，不以后来的地理名称“叙利亚”替代。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 原文为“以色列的众子”，在此是全体以色列民的固定称谓；现代中文以“以色列人”自然、准确地表达其群体所指。
- source_word: בְּאָהֳלֵיהֶם
  choice: 在自己的帐棚里
  rationale: 保留原文“帐棚”的具体用词；反身领属表达符合现代汉语习惯。
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: 像从前一样
  rationale: 这是表示昔日、先前的希伯来语惯用语；正文译出其意义，脚注说明字面形式。
- source_word: וַיֵּצְאוּ
  choice: 脱离了
  rationale: 动词本义是“出去”；与“从……手下”连用时，表示摆脱统治或控制。
- source_word: וַיֵּשְׁבוּ
  choice: 安居
  rationale: 该动词可表示坐、居住；上下文强调脱离压迫后恢复往日生活，“安居”自然传达这一语境含义，但不扩展为永久定居。
theological_decisions:
- issue: מוֹשִׁיעַ应译为“拯救者”还是“救主”
  choice: 拯救者
  alternative: 救主
  rationale: 本节所述是从亚兰辖制下得到历史性的解救。“拯救者”保留施救者这一含义，同时避免以“救主”预先赋予经文没有明说的弥赛亚身份。
- issue: 如何表达בְנֵי יִשְׂרָאֵל的家族性措辞
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 希伯来语固定称谓在此指以色列全体百姓。现代汉语直译“众子”容易被误解为仅指男性亲属，因此采用准确而自然的群体称谓。
- issue: 拯救者的身份是否应在译文中明确
  choice: 保持未指明
  alternative: 把拯救者认定为某位君王或特定人物
  rationale: 原文只说耶和华赐下“一位拯救者”，没有为其命名；译文保留这一有意或实际存在的不确定性。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“辖制”保留历史政治压迫的语感；“安居”流畅表达恢复正常生活。所有脚注标记均置于其所解释的正文成分之后。
