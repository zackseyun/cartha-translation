  yaml_path: translation/ot/2_kings/013/015.yaml
  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
translation:
  language: zh_hans
  text: 以利沙对他说：“拿一张弓和一些箭来。”他就拿着一张弓和一些箭到以利沙那里去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “到以利沙那里去”或可理解为“为自己取了弓和箭”；但希伯来文更自然地可理解为“到他那里去”，其中“他”指以利沙。
    reason: 说明 אֵלָיו 的较次要理解，同时保留其更自然的趋向义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 对……说
  rationale: 该叙事动词承接上文；现代汉语无需机械译出连接词，也能自然表达事件推进。
- source_word: לּוֹ
  choice: 对他说
  rationale: 介词 ל 加第三人称阳性单数词尾，在此标明以利沙说话的对象。
- source_word: אֱלִישָׁע
  choice: 以利沙
  rationale: 采用现代中文圣经语境中通行的人名译法。
- source_word: קַח
  choice: 拿……来
  rationale: לקח 的命令式意为“拿、取”；结合随后把物品带到以利沙那里的动作，“拿……来”在中文中自然，并保留命令语气。
- source_word: קֶשֶׁת וְחִצִּים
  choice: 弓箭
  rationale: 希伯来文直指一张弓和若干箭；中文“弓箭”是自然的集合性表达，并在命令和回应中照原文重复。
- source_word: וַיִּקַּח
  choice: 他就把……拿到
  rationale: 叙事式动词表示紧接命令而发生的行动；“就”自然体现顺承与回应。
- source_word: אֵלָיו
  choice: 到以利沙那里
  rationale: אֶל 加第三人称阳性单数词尾通常有明确的趋向义，最自然地指把弓箭拿到以利沙那里；正文明确所指，以避免现代汉语代词含混。
