- from: 有一次，人们正在埋葬一个死人，忽然看见一队匪兵，就把死人扔进以利沙的坟墓里。那人落下去，碰到以利沙的骸骨，就活了过来，站了起来。
  to: 有一次，人们正在埋葬一个死人，忽然看见一队匪兵，就把死人扔进以利沙的坟墓里。那人碰到以利沙的骸骨，就活了过来，站了起来。
