base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: zh_hans
  text: 有一次，人们正在埋葬一个死人，忽然看见一队匪兵，就把死人扔进以利沙的坟墓里。那人碰到以利沙的骸骨，就活了过来，站了起来。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגְּדוּד
  choice: 一队匪兵
  rationale: 该词指武装袭扰、劫掠的队伍；译作“一队匪兵”既表达其军事性质，也体现其劫掠活动，符合本章语境。
- source_word: בְּקֶבֶר אֱלִישָׁע
  choice: 进以利沙的坟墓里
  rationale: 介词 בְּ 在“扔”的语境中表示进入；中文用“进……里”自然明确。
- source_word: וַיֵּלֶךְ וַיִּגַּע
  choice: 落下去，碰到
  rationale: 字面近于“去/行而碰到”，但此处主语是被扔进墓中的死人。“落下去”按叙事情境表达其移动，同时保留随后碰到骸骨的动作次序，避免误示死人主动行走。
- source_word: בְּעַצְמוֹת אֱלִישָׁע
  choice: 以利沙的骸骨
  rationale: עֲצָמוֹת 是复数“骨头”；对已葬之人的遗骨，现代中文用“骸骨”庄重自然。
- source_word: וַיְחִי
  choice: 就活了过来
  rationale: 该动词表示恢复生命；“活了过来”清楚传达死人复生。
- source_word: וַיָּקָם עַל־רַגְלָיו
  choice: 站了起来
  rationale: 希伯来语字面为“起来，立在自己的脚上”；中文“站了起来”已自然包含这一含义。
theological_decisions:
- issue: 死人复活与以利沙骸骨之间的叙事关系
  choice: 按经文直接叙述：那人碰到骸骨，就活了过来
  alternative: 补明是上帝直接使他复活，或把能力归于骸骨本身
  rationale: 原文只陈述接触与复活的先后关系，没有在本节明说施行者或解释机制。译文不增添因果神学说明，也不暗示骸骨自身具有独立能力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“有一次”自然承接 וַיְהִי；“忽然”对应 וְהִנֵּה 的突发感。“死人”在本节比反复使用“一个人”更清楚，且符合埋葬与复活的语境。
