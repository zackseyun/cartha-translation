    issue: “那人落下去”增加了原文未明说的坠落方式。
    rationale: 希伯来文说死者“去/到而碰到”以利沙的骨头；该措辞本身略显突兀，但并未具体说明他是如何落下或移动的。译文宜保留为中性的“碰到”。
