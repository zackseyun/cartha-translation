  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: zh_hans
  text: 然而，他们没有离开耶罗波安家的那些罪，就是耶罗波安使以色列犯的罪，仍照样而行；连亚舍拉[a]也依旧立在撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”。希伯来语这个词可指迦南女神亚舍拉，也可指与其崇拜有关的祭祀物；此处较可能指后者。
    reason: 说明原词在女神名称与相关崇拜物之间的词义歧义。
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 承接上文的拯救，同时转入以色列仍持续犯罪的事实，表达明显的转折。
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: 没有离开……那些罪
  rationale: סור与介词מִן连用，表示离开、弃绝某事；保留חטאות的复数形式。
- source_word: בֵּית יָרָבְעָם
  choice: 耶罗波安家
  rationale: 保留希伯来语“家”的表达；此处既可涉及其王朝，也指其留下的宗教与政治体系，不收窄为单纯的“王朝”。
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: 就是耶罗波安使以色列犯下的罪
  rationale: חטא的使役形表示“使……犯罪”；用解释性同位结构使现代汉语清楚自然。
- source_word: בָּהּ הָלָךְ
  choice: 仍照样而行
  rationale: הלך ב表示按某种道路或行为模式生活、行事。希伯来语在前文复数主语之后使用单数动词和阴性单数后缀，所指略显含混；汉语省略明说主语，并以“照样”回指上述罪行，避免强行限定。
- source_word: וְגַם
  choice: 连……也
  rationale: 表达递进和强调：不但罪行持续，连相关的崇拜物也仍然存在。
- source_word: הָאֲשֵׁרָה
  choice: 亚舍拉
  rationale: 音译希伯来语名称，不在正文中武断判定它专指女神还是与其崇拜有关的祭祀物，并以脚注说明。
- source_word: עָמְדָה
  choice: 依旧立着
  rationale: 兼顾“站立”的具体形象和持续存在的含义。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 按城市地点作标准译法。
theological_decisions:
- issue: הָאֲשֵׁרָה所指的是女神还是崇拜物
  choice: 正文译作“亚舍拉”，不进一步限定
  alternative: 亚舍拉柱；亚舍拉女神
  rationale: 该词既可指迦南女神亚舍拉，也可指与其崇拜有关的物件。“立在撒马利亚”较可能指直立的祭祀物，但原文并无“柱”一词，因此正文保留歧义，脚注交代较可能的理解。
- issue: בָּהּ הָלָךְ的主语及单复数转换
  choice: 译作“仍照样而行”，不明说主语
  alternative: 他仍行在其中；他们仍行在其中；以色列仍行在其中
  rationale: 马所拉文本由复数“他们没有离开”转为单数“他行”，也以阴性单数后缀回指某种罪恶模式。省略显式主语既符合汉语习惯，也不把可能指集体以色列、君王或前述群体的语法张力武断消除。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“仍照样而行”避免生硬直译“行在其中”，同时保留原文主语转换所造成的含混；“耶罗波安家”保留原文历史叙事中的固定表达。
