  text: וַ/יָּ֜שָׁב יְהוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז וַ/יִּקַּ֤ח אֶת הֶֽ/עָרִים֙ מִ/יַּד֙ בֶּן הֲדַ֣ד בֶּן חֲזָאֵ֔ל אֲשֶׁ֣ר לָקַ֗ח מִ/יַּ֛ד יְהוֹאָחָ֥ז אָבִ֖י/ו בַּ/מִּלְחָמָ֑ה שָׁלֹ֤שׁ פְּעָמִים֙ הִכָּ֣/הוּ יוֹאָ֔שׁ וַ/יָּ֖שֶׁב אֶת עָרֵ֥י יִשְׂרָאֵֽל־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: zh_hans
  text: 约哈斯的儿子约阿施重新从哈薛的儿子便·哈达手中夺回那些城。这些城是便·哈达在战争中从约阿施的父亲约哈斯手中夺走的。约阿施[a]三次击败他[b]，收复了以色列的城邑。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文先用这个王名的长式“耶何阿施”（יְהוֹאָשׁ），后用短式“约阿施”（יוֹאָשׁ）；两者指同一人。正文依中文通行译名均作“约阿施”。
    reason: lexical_alternative
  - marker: b
    text: 或译“击打他”。这里的希伯来语动词在战争语境中可以表示击败敌人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיִּקַּח
  choice: 重新……夺回
  rationale: 两个动词连用，表达约阿施转而取回先前失去的城邑。汉语用“重新……夺回”既保留恢复之意，也避免“取回并夺回”的累赘。
- source_word: הֶעָרִים
  choice: 那些城／城邑
  rationale: עָרִים 指城镇或设防聚居地；前句用“那些城”自然指明特定对象，末句用庄重而常见的“城邑”。
- source_word: מִיַּד
  choice: 从……手中
  rationale: 保留希伯来语“从某人手中”的权势与控制权惯用语，在现代汉语中也自然可懂。
- source_word: בֶּן הֲדַד
  choice: 便·哈达
  rationale: 按现代中文圣经人名音译习惯处理，并以间隔号标示复合音译名。
- source_word: אֲשֶׁר לָקַח
  choice: 这些城是便·哈达……夺走的
  rationale: 该动作发生在约阿施收复城邑之前；汉语以独立句清楚呈现这一先后关系。
- source_word: בַּמִּלְחָמָה
  choice: 在战争中
  rationale: 准确保留军事背景，不把单数形式过度限定为某一场具体战役。
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: 三次
  rationale: 简明、自然地表达希伯来语次数结构。
- source_word: הִכָּהוּ
  choice: 击败他
  rationale: נכה 在战争语境中可指击打或战胜；“击败”符合连续三次军事行动的上下文，同时以脚注保留较字面的可能译法。
- source_word: וַיָּשֶׁב אֶת עָרֵי יִשְׂרָאֵל
  choice: 收复了以色列的城邑
  rationale: 使役性结构表示使城邑重归以色列控制；“收复”准确表达政治军事上的恢复。
- source_word: יְהוֹאָשׁ / יוֹאָשׁ
  choice: 约阿施
  rationale: 希伯来文先后采用同一王名的长式和短式；现代中文通行音译通常都作“约阿施”，差异在脚注中说明。
