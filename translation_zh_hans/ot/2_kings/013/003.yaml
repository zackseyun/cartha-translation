  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֗ם וּ/בְ/יַ֛ד בֶּן הֲדַ֥ד בֶּן חֲזָאֵ֖ל כָּל הַ/יָּמִֽים־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: zh_hans
  text: 于是，雅威向以色列发怒，把他们交在亚兰[c]王哈薛手中[a]，又交在哈薛的儿子便哈达手中；在那整个时期，一直如此[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”是希伯来语惯用语，意思是交由某人掌控或支配。
    reason: lexical_alternative
  - marker: b
    text: “在那整个时期”直译为“所有那些日子”。
    reason: lexical_alternative
  - marker: c
    text: “亚兰”是希伯来文地名；一些较早的译本译作“叙利亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 发怒
  rationale: 这是希伯来语表达愤怒的惯用语，字面含有怒气燃烧的意象；现代汉语用“发怒”自然、庄重，也不额外强化原文的程度。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的读音音译为“雅威”，保留其作为上帝专名的性质，而不以称号替代。
- source_word: בְּיִשְׂרָאֵל
  choice: 向以色列
  rationale: 介词与发怒用语连用，表示怒气所针对的对象；“向以色列发怒”符合现代汉语习惯。
- source_word: וַיִּתְּנֵם
  choice: 把他们交在
  rationale: נתן 的基本义为“给、交出”；在军事审判语境中，“交在……手中”既保留原文意象，也清楚表达受制于人的意思。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语“在某人手中”的权力与控制意象；该说法在现代汉语中自然可懂。
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: 亚兰王哈薛
  rationale: 采用现代中文圣经语境中通行且贴近希伯来语的地名和人名译法，并按自然汉语语序排列。
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: 哈薛的儿子便哈达
  rationale: 明确保留原文的父子关系，并采用通行中文音译。
- source_word: כָּל הַיָּמִים
  choice: 在那整个时期
  rationale: 该短语字面为“所有那些日子”，在上下文中表示贯穿所述时期；此译法自然传达持续时间，又不将其绝对化为永远。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，并较贴近学界通常重构的读音；不以“主”这一称号替代。
- issue: 上帝将以色列交在外邦君王手中
  choice: 保留上帝为行动主体的直接表述
  alternative: 以色列落入外邦君王手中
  rationale: 原文明说“他把他们交在……手中”，将此事呈现为雅威发怒后的审判行动；译文不弱化这一神学张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“于是”承接前文因果；分号保留两位亚兰君王与持续时期之间的结构关系。脚注标记均放在其实际说明的词语之后，并纠正咨询层中标记位置与脚注内容不相配的问题。
