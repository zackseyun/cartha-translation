  to: 约哈斯其余的事迹、他所做的一切和他的勇力[b]，不都记载在《以色列诸王记》[a]中吗？
  rationale: 仅作安全的文体与书名调整。“记载在……中”是对“写在书上”的自然现代汉语表达；“《以色列诸王记》”更适合作为所引王室档案的中文名称。保留“勇力”及其脚注，以维持גְּבוּרָה在力量、英勇和勇武作为之间的语义开放性。
