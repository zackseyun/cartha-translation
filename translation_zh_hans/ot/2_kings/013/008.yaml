base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 约哈斯其余的事迹、他所做的一切和他的勇力[b]，不都记载在《以色列诸王记》[a]中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：《以色列诸王年鉴》。
    reason: lexical_alternative
  - marker: b
    text: “勇力”也可译作“力量”、“英勇”或“英勇事迹”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז
  choice: 约哈斯其余的事迹
  rationale: 在列王纪的王朝总结套语中，דִּבְרֵי 指与君王有关的事迹或事项，并非仅指言语；“其余的事迹”准确而自然。句首 וְ 不必机械译成“至于”或“现在”。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 他所做的一切
  rationale: 保留原文概括性的关系从句，不把所做之事限定为某一类功业。
- source_word: וּגְבוּרָתוֹ
  choice: 他的勇力
  rationale: גְּבוּרָה 可指力量、英勇或大能的作为；“勇力”保持简洁，也保留其可涵盖个人能力与英勇事迹的语义张力。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 不都记……吗
  rationale: 以自然的汉语反问句重现 הֲלוֹא 所引出的王朝记述惯用公式；“记”符合文献记录语境。
- source_word: עַל סֵפֶר
  choice: 记在……上
  rationale: 按汉语书面表达，将字面的“在书卷之上”自然译为“记在……上”。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王纪》
  rationale: 这是所引王室史料的名称；“纪”简洁表达 דִּבְרֵי הַיָּמִים 的编年记录含义，且与“历代志”这卷正典书名有所区分。
