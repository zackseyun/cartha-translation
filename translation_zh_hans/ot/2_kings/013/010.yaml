base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: zh_hans
  text: 犹大王约阿施[a]在位第三十七年，约哈斯的儿子约阿施登基作以色列王；他在撒马利亚作王十六年。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文用不同拼法称呼两位王：犹大王是יוֹאָשׁ，以色列王是יְהוֹאָשׁ；中文传统通常都译作“约阿施”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֶׁבַע שָׁנָה
  choice: 三十七年
  rationale: 这是希伯来文常见的君王纪年格式，表示犹大王约阿施在位的第三十七年；中文纪年惯用“三十七年”。
- source_word: לְיוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: 犹大王约阿施
  rationale: 介词לְ标明纪年的参照对象；“犹大王”自然地限定这位约阿施，并与下文的以色列王区分。
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 在君王纪事格式中，此处的完成式具有起始含义，指开始作王；译作“登基作……王”也与后面的统治年数相区分。
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: 约哈斯的儿子约阿施
  rationale: 按现代中文圣经人名的通行音译处理；希伯来文此名写作יְהוֹאָשׁ，虽与前一个יוֹאָשׁ拼写有别，但中文传统通常都译为“约阿施”，故以脚注说明。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王
  rationale: עַל与מלך连用表示治理某个民族或疆域；中文用“作以色列王”最自然。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 介词בְּ表示地点；撒马利亚是北国王权所在的都城。
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: 统治了十六年
  rationale: 该数字短语说明在位期限；“统治了十六年”在现代中文中清楚自然，也避免与前面的“登基”重复使用“作王”。
