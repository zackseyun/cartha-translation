  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: zh_hans
  text: 约哈斯恳求雅威施恩[a]，雅威就听了他；因为他看见以色列所受的欺压，因为亚兰王欺压他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向雅威恳求”；原文直译近于“使雅威的脸柔和”，是求取恩惠的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: 恳求雅威施恩
  rationale: חלה את־פני 是求取某人恩惠、向其恳求的惯用语；译为“恳求……施恩”既自然，也保留向神求恩的关系意味，不把“脸”生硬直译出来。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现四字神名，区别于作为称号的“主”。
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: 就听了他
  rationale: שמע 与 אֶל 连用表示听取、垂听；“听了他”保留神回应其恳求的含义，又不额外说明回应的具体方式。
- source_word: כִּי רָאָה
  choice: 因为他看见
  rationale: כִּי 引出雅威听取恳求的原因；“看见”保留 ראה 的直接表达。
- source_word: לַחַץ יִשְׂרָאֵל
  choice: 以色列所受的欺压
  rationale: לַחַץ 在此指敌对政权造成的压迫；加入“所受的”使现代汉语自然，并明确以色列是受压迫者。
- source_word: כִּי לָחַץ אֹתָם
  choice: 就是……怎样欺压他们
  rationale: 第二个 כִּי 可解释前述“欺压”的具体情形；同根名词与动词均译作“欺压”，保留原文的词根呼应。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 按希伯来地名 אֲרָם 音译为“亚兰”，不以较晚的地理称呼“叙利亚”替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常采用的读音重构，并保留专名性质。
- issue: וַיְחַל אֶת־פְּנֵי יְהוָה 的神学与语义力度
  choice: 恳求雅威施恩
  alternative: 求雅威息怒／恳求雅威
  rationale: 原文惯用语重在求取恩惠或恳求，不明确说神已经发怒，也不宜把“安抚”这一较强推论写入正文；“施恩”则呈现 פְּנֵי 在该惯用语中的恩宠意味。
- issue: 雅威对恳求的回应
  choice: 听了他
  alternative: 应允了他
  rationale: 原文 שׁמע 表明听取或垂听，但本句本身没有明确使用“应允”一词；采用较克制的译法，避免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“约哈斯”“雅威”“亚兰”依原文专名音译；以“就是”连接末句，使第二个 כִּי 的解释作用清楚，同时保留其也可带原因意味的语义空间。
