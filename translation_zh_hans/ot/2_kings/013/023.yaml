id: 2KI.13.23
reference: 2 Kings 13:23
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: zh_hans
  text: 雅威向他们施恩，怜悯他们，并转向他们，因着他与亚伯拉罕、以撒、雅各所立的约。[a]他不愿毁灭他们，也没有把他们从自己面前丢弃，直到如今。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “因着他与亚伯拉罕、以撒、雅各所立的约”也可译作“为了他与亚伯拉罕、以撒、雅各所立的约的缘故”。
    reason: לְמַעַן可表明行动的缘由或依据，也可按“为了……的缘故”表达；两种译法都不改变雅威的行动与其所立之约的关联。
lexical_decisions:
- source_word: וַיָּחָן
  choice: 向他们施恩
  rationale: חנן表达施予恩惠、恩待之意；“施恩”简洁自然，也保留恩典性的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中较接近יהוה的音译呈现上帝的专名，而不以称号替代。
- source_word: וַיְרַחֲמֵם
  choice: 怜悯他们
  rationale: רחם表示深切的怜悯与慈悲；“怜悯”在现代汉语中庄重且易懂。
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: 转向他们
  rationale: 保留原文“转向”的具体意象，不把它进一步解释为“眷顾”或“垂顾”。
- source_word: לְמַעַן בְּרִיתוֹ
  choice: 因为他顾念……所立的约
  rationale: למען在这里说明雅威施恩、怜悯并转向他们的缘由；加入“顾念”使汉语通顺，同时表明行动以他的约为依据。
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: 与亚伯拉罕、以撒、雅各所立的
  rationale: 原文是紧凑的“他的约——亚伯拉罕、以撒和雅各”；汉语明确表达这是与列祖所立的约，不增添后期神学解释。
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: 他不愿毁灭他们
  rationale: אָבָה涉及意愿或同意；“不愿”保留原文的意志层面。
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: 也没有把他们从自己面前丢弃
  rationale: 尽量保留“丢弃”和“从他面前”这两个原文意象，同时用“自己”避免汉语代词指向不清。
- source_word: עַד עָתָּה
  choice: 直到如今
  rationale: 表示这种状况持续到叙述者所处的时间；“直到如今”兼具自然与庄重。
theological_decisions:
- issue: יהוה这一神名的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用上帝的专名，而非“主”这一称号；“雅威”较直接地按通行学术重构音译，保留其作为立约之神专名的功能。
- issue: 上帝施怜悯与列祖之约的关系
  choice: 因为他顾念自己与亚伯拉罕、以撒、雅各所立的约
  alternative: 为了他与亚伯拉罕、以撒、雅各所立的约
  rationale: למען可表达原因、依据或目的。正文以自然汉语表明这些行动以他的约为根据，脚注保留“为了……的缘故”这一可能的表达角度，不将其扩展成特定宗派教义。
- issue: “转向他们”的含义
  choice: 转向他们
  alternative: 眷顾他们
  rationale: 直译保留原文动作意象及其可能包含的有利关注，不在正文中将其完全解释为“眷顾”。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。三个连续动词译为“施恩、怜悯、转向”，保留希伯来文的推进与意象；后半句保留“不愿”所表达的意志，以及“从自己面前丢弃”的空间—关系性图像。
