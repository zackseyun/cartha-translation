  source_fidelity: 译文总体准确保留了王室死亡、继位和安葬的叙述。惟“耶罗波安坐上了他的王位”中的“他的”在现代汉语中指代不清，可能误读为耶罗波安自己的王位；原文在上下文中是指约阿施所留下的王位，宜明确。
  naturalness: “与他的列祖同睡”保留了庄重的传统死亡套语，脚注也足以避免按字面理解。“与以色列诸王同葬”可通，但“葬在一起”更直接呈现“与……同”的安葬关系。
  terminology: “约阿施”“耶罗波安”“撒马利亚”“以色列诸王”均恰当。“列祖同睡”作为王室死亡公式可保留；不应将其正文直接扁平化为“去世”。
