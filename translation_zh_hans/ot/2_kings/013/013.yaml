  to: 约阿施与他的列祖同睡[a]；耶罗波安坐上约阿施的王位。约阿施葬在撒马利亚，与以色列诸王葬在一起。
  rationale: 修订仅消除王位所属代词在现代汉语中的歧义，并使末句的安葬关系表达更直接。保留“与列祖同睡”的希伯来文死亡公式及其脚注说明。
