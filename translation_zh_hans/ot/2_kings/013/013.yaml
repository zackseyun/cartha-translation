  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: zh_hans
  text: 约阿施与他的列祖同睡[a]；耶罗波安坐上约阿施的王位。约阿施葬在撒马利亚，与以色列诸王葬在一起。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“与他的列祖一同躺下”；这是希伯来文中表示君王去世的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 这是王室去世记述中的固定用语；译作“同睡”既保留希伯来文意象，也借脚注说明其实际指死亡。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: “列祖”自然表达历代先祖，并保留王朝记述的传统语体；“他的”对应原文第三人称单数所属后缀。
- source_word: יָשַׁב עַל כִּסְאוֹ
  choice: 坐上了他的王位
  rationale: 保留原文“坐在其宝座上”的继位意象；现代汉语以“坐上王位”清楚表达登基承继。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 原文为被动式；汉语无须补出施事者，以“葬在”自然表达“被安葬”。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 介词在此表示地点，“在撒马利亚”准确而自然。
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: 与以色列诸王同葬
  rationale: 补出汉语语境中自然需要的“同葬”，明确表示约阿施与先前的以色列诸王葬在一起，而不改变原意。
