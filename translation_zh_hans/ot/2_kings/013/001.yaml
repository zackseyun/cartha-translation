base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: zh_hans
  text: 犹大王亚哈谢的儿子约阿施在位第二十三年，耶户的儿子约哈斯在撒马利亚登基作以色列王，在位十七年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 在王朝纪年公式中表示开始执政；“登基作以色列王”自然、准确，也保留其即位含义。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王
  rationale: 希伯来语直译为“统治以色列”；按现代汉语王室叙事习惯表达为“作以色列王”。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 保留原文地点信息，并使其自然修饰约哈斯登基执政。
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: 在位十七年
  rationale: 原文省略了第二个动词，语境明确指其统治时长；汉语以“在位十七年”简洁补足。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的史书体。以“在位第二十三年……登基作……王，在位十七年”呈现希伯来文的同步纪年公式，避免不必要的释义扩展。
