base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 约阿施其余的事迹、他所做的一切，以及他与犹大王亚玛谢交战[a]所显出的勇力，不都记在《以色列诸王记》[b]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与……交战”也可译作“对……作战”。希伯来文介词直译为“与”，在这里的军事语境中表示敌对交锋。
    reason: lexical_alternative
  - marker: b
    text: 这里的《以色列诸王记》是《列王纪》所引用的一部王室史料，并非圣经中的《历代志》。
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: 约阿施其余的事迹
  rationale: “דִּבְרֵי”在列王纪惯用的君王总结语中指其事迹，而非单指言语；“其余的事迹”自然保留该史书套语。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 他所做的一切
  rationale: 保留“כָל”的全面含义，并以现代汉语自然表达宽泛的“עשה”。
- source_word: וּגְבוּרָתוֹ אֲשֶׁר נִלְחַם עִם
  choice: 他与……交战时所显的勇力
  rationale: “גְבוּרָה”可指力量、英勇或勇武事迹；下接战争从句，译作“交战时所显的勇力”既保留抽象名词，也清楚表达其具体表现。
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: 犹大王亚玛谢
  rationale: 采用现代中文圣经人名和王号的自然次序。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗
  rationale: 保留希伯来文反问句式及“记载”的被动含义；“都”呼应前述各项。
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 记在《以色列诸王记》上
  rationale: 这是列王纪中引用王室史料的惯用书名表达；“记在……上”符合现代汉语书面语，同时脚注说明其并非正典《历代志》。
theological_decisions: []
