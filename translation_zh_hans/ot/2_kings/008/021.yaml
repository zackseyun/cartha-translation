base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: zh_hans
  text: 于是约兰渡往撒益[a]，所有战车都随同他。他在夜间起来，攻击包围他的以东人和战车长；众人却逃往各自的帐篷[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“西珥”。希伯来文此处的地名 צָעִירָה 含义不确定；有些人认为它是与西珥或以东有关的异体形式，而不是另一处名叫撒益的地方。
    reason: alternative_reading
  - marker: b
    text: “逃往各自的帐篷”是希伯来习语，意思是各自散去回家。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 渡到
  rationale: עבר在此表示军事行动中的越过或渡往某地；“渡到”既保留移动、跨越之意，也不擅自确定所跨越的地形。
- source_word: צָעִירָה
  choice: 撒益
  rationale: 按马所拉文本的元音与传统理解，将其作为地名音译；该词形存在困难，可能与西珥有关，故在脚注保留异读。
- source_word: וְכָל הָרֶכֶב עִמּוֹ
  choice: 率领所有战车
  rationale: 直译为“所有战车与他同在”；中文以“率领所有战车”自然表达随军出动的关系，同时保留רכב的战车含义。
- source_word: קָם לַיְלָה
  choice: 在夜间起来
  rationale: 保留“起来”及夜间行动的叙事次序，不进一步解释为突围或出征。
- source_word: וַיַּכֶּה
  choice: 攻击
  rationale: נכה可指击打、袭击；此处“攻击”符合军事语境，又不把结果过度明确为彻底击败。
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: 包围他的以东人
  rationale: 将集合性地名“以东”按语境表达为“以东人”，并保留分词所呈现的包围状态。
- source_word: שָׂרֵי הָרֶכֶב
  choice: 战车长
  rationale: שׂרים在军事语境中指首领或长官；“战车长”简洁表达战车部队的指挥者。
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: 众人却逃回自己的帐篷
  rationale: 保留“逃”和“帐篷”的希伯来原有意象；“却”体现叙事转折，而不将העם窄化为军队。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。专名按马所拉文本音译，并以脚注保留文本上的不确定性；军事词汇避免夸大战果。“战车长”简明自然，“逃回自己的帐篷”保留原文文化意象并加注说明。
