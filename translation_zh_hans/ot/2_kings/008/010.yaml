  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע לֵ֥ךְ אֱמָר לא חָיֹ֣ה תִחְיֶ֑ה וְ/הִרְאַ֥/נִי יְהוָ֖ה כִּֽי מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: zh_hans
  text: 以利沙对他说：“你去告诉他：‘你一定会康复。’[a] 但耶和华已经指示我，他必定会死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文按字面可译为“你一定不会活”。这里的希伯来文本较难理解；许多人根据上下文将其理解为“你一定会康复”，与下文所启示的“他必定会死”形成对照。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: 以利沙对他说
  rationale: 原文明确以“以利沙”为主语；中文按自然语序表达，并保留间接宾语“对他说”。
- source_word: לֵךְ אֱמָר
  choice: 你去告诉他
  rationale: 体现两个连续的命令式；“告诉他”在现代汉语中自然，也准确传达אמר在此处转告信息的含义。
- source_word: לא חָיֹה תִחְיֶה
  choice: 你一定会康复
  rationale: חיה的不定式绝对式加未完成式表示强调，在患病语境中译为“一定会康复”自然。马所拉文本的לא按字面为否定，造成“你一定不会活”的困难读法，因此在脚注中保留。
- source_word: וְהִרְאַנִי יְהוָה
  choice: 但耶和华已经指示我
  rationale: 连接词依上下文译为转折性的“但”，保留所传口信与先知所得启示之间的张力；完成式译为“已经指示”。神名יהוה音译为中文通行的“耶和华”。
- source_word: כִּי מוֹת יָמוּת
  choice: 他必定会死
  rationale: מות的不定式绝对式加未完成式具有强调确定性的作用；“必定会死”清楚保留其语气。
theological_decisions:
- issue: 如何翻译困难短语 לא חיה תחיה
  choice: 正文译作“你一定会康复”，并以脚注交代马所拉文本的字面否定读法。
  alternative: 按现有元音及辅音直译为“你一定不会活”；或将לא理解为文本问题，例如原为לוֹ，从而读作“告诉他：你一定会活”。
  rationale: 马所拉文本表面上是否定句，但这与随后“但耶和华已经指示我，他必定会死”的转折以及叙事语境衔接困难。正文采用语境中较可能的意旨，同时以脚注透明保留原文的真实疑难，不把文本问题或神学张力悄然消除。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“康复”贴合疾病语境；“必定”保留原文强调结构的确定语气。正文中的脚注标记[a]与脚注完全对应。
