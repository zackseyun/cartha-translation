base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: zh_hans
  text: 七年期满，那妇人从非利士人之地回来，便出去，向王为她的房屋和田地呼求[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “呼求”或译“申诉”或“恳求”。希伯来语此词可指大声呼求，也可在受屈或寻求裁断的语境中指申诉、求助。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: 七年期满
  rationale: 该短语表示一段时期到了尽头；“七年期满”简洁自然，也准确保留时间含义。
- source_word: וַתָּשָׁב
  choice: 回来
  rationale: שׁוּב在此指妇人结束寄居后从非利士人之地返回；“回来”符合现代汉语叙事习惯。
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: 非利士人之地
  rationale: 按原文直译为“非利士人之地”，比单用地名更清楚地保留希伯来语的表达。
- source_word: וַתֵּצֵא
  choice: 便去
  rationale: יָצָא本义为“出去”，但在此主要推动叙事，表示她前去见王；译作“便去”避免现代汉语中生硬或空间指向不明的“便出去”。
- source_word: לִצְעֹק
  choice: 申诉
  rationale: צָעַק本义是“呼喊、呼求”，在向君王请求纠正财产问题的语境中具有求助、申冤的含义；“申诉”既自然又体现其司法性语境，较字面的译法列入脚注。
- source_word: אֶל־הַמֶּלֶךְ
  choice: 向王
  rationale: אֶל表示行动和诉求所指向的对象；“向王”直接、自然。
- source_word: בֵּיתָהּ
  choice: 她的房屋
  rationale: בַּיִת可指房屋、家或家属；这里与田地并列并涉及产业，具体的“房屋”最合适。
- source_word: שָׂדָהּ
  choice: 她的田地
  rationale: שָׂדֶה通常指田地或耕地；“田地”保留其具体产业含义。
- source_word: אֶל בֵּיתָהּ וְאֶל שָׂדָהּ
  choice: 要求归还她的房屋和田地
  rationale: 原文直译是“为着／关于她的房屋和田地”，结合上文她离乡七年及本节向王求助的语境，所求是恢复其产业；“要求归还”以自然汉语表达这一语境含义。
