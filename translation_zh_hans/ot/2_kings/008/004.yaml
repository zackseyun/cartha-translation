base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: zh_hans
  text: 王正与神人的仆人基哈西[a]交谈，说：“请把以利沙所做的一切大事都讲给我听。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “仆人”或译“侍从”或“年轻人”；希伯来语נַעַר可按上下文指仆人、侍从或青年。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֵּר
  choice: 正在……说话
  rationale: 分词在叙事中描写当时持续进行的背景动作；用“正在”保留进行意味。
- source_word: גֵּחֲזִי
  choice: 基哈西
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: נַעַר
  choice: 仆人
  rationale: 该词可指年轻人、侍从或仆人；此处用来说明基哈西与神人的职分关系，“仆人”最符合上下文，同时以脚注保留其他可能。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留希伯来语中对先知的固定称号，不直接改释为“神的先知”。
- source_word: סַפְּרָה נָּא לִי
  choice: 请……讲给我听
  rationale: ספר的命令式表示讲述、述说，נָא带有请求语气；此译自然地兼顾命令与礼貌。
- source_word: כָּל הַגְּדֹלוֹת
  choice: 一切大事
  rationale: 阴性复数形容词在此作名词用，泛指非凡、重大的作为；“大事”保留其宽泛性。
- source_word: עָשָׂה
  choice: 所做的
  rationale: 希伯来语完成式指以利沙已经成就的事；中文定语结构无需额外标明英语式时态。
- source_word: וְהַמֶּלֶךְ
  choice: 王
  rationale: 句首连接词承接叙事；中文可由上下文自然衔接，不必机械译作“于是”或“现在”。
