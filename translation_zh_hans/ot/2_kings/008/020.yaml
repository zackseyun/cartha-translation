  yaml_path: translation/ot/2_kings/008/020.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: zh_hans
  text: 在他统治期间，以东反叛，脱离了犹大的统治[a]，并立了一位王统治自己。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从犹大手下反叛”；“在……手下”是表示受其权势或控制的习语。
    reason: 说明“从犹大手下”的具体希伯来语意象及其政治含义。
lexical_decisions:
- source_word: בְּיָמָיו
  choice: 在他统治期间
  rationale: 这是表示某位君王在位时期的时间用语；按上下文译明“统治期间”，比直译“在他的日子里”更符合现代汉语。
- source_word: פָּשַׁע
  choice: 背叛
  rationale: 此处指以东脱离犹大的政治控制，并非一般道德意义上的犯罪；“背叛”保留了主动反抗宗主权的含义。
- source_word: אֱדוֹם
  choice: 以东
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: 犹大的统治
  rationale: 希伯来语直译为“从犹大手下”，是表示权力和控制的习语；正文用自然汉语传达其政治含义，并在脚注保留原文意象。
- source_word: יְהוּדָה
  choice: 犹大
  rationale: 采用现代中文通行的国名译法；此处指犹大国。
- source_word: וַיַּמְלִכוּ
  choice: 立
  rationale: 该动词的使役形式表示使某人成为王；“立……为王”的中文表达简洁自然。
- source_word: עֲלֵיהֶם
  choice: 自己的
  rationale: 代词所指是以东人；结合“王”译作“自己的王”，自然表达他们设立统治自己的君王。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 指以东人所设立的一位君王；中文在“立了自己的王”中无需另加不定冠词。
