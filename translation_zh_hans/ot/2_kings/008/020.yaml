translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“在他统治期间”明确君王语境；“背叛了犹大的统治”既保留反叛意味，也清楚表达政治脱离。脚注标记置于整句末尾，所注内容对应前半句的希伯来习语。
