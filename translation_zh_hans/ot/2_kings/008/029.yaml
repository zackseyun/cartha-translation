revisions:
- from: 约兰王回到耶斯列，医治亚兰人在拉末给他造成的伤；这些伤是他与亚兰王哈薛交战时受的。犹大王约兰的儿子亚哈谢下到耶斯列，去看望亚哈的儿子约兰，因为他病了。
  to: 约兰王回到耶斯列，好从他在拉末与亚兰王哈薛交战时被亚兰人所伤的伤中康复。犹大王约兰的儿子亚哈谢下到耶斯列，去看望亚哈的儿子约兰，因为他病了。
  rationale: 将“医治……伤”改为“从……所受的伤中康复”，准确对应 לְהִתְרַפֵּא，并保留伤势由亚兰人在拉末、约兰与哈薛交战时造成的全部限定信息。其余译文无需改动。原文和草稿均无须在正文设置脚注锚点；因此不增设脚注。
