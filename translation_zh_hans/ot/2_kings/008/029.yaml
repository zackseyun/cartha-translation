base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: zh_hans
  text: 约兰王回到耶斯列，好从他在拉末与亚兰王哈薛交战时被亚兰人所伤的伤中康复。犹大王约兰的儿子亚哈谢下到耶斯列，去看望亚哈的儿子约兰，因为他病了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回到
  rationale: שׁוב在连续叙事中表示约兰从战场返回耶斯列；“回到”自然保留返回之意。
- source_word: לְהִתְרַפֵּא
  choice: 医治
  rationale: רפא的Hitpael形式在此指接受治疗、养伤；“医治”既贴近原文，也不暗示他自行疗愈。
- source_word: מִן הַמַּכִּים
  choice: ……造成的伤
  rationale: מַכִּים字面指击打，在军事和疗伤语境中指击打所造成的伤口。
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: 亚兰人……给他造成的
  rationale: 保留亚兰人为施动者，并以自然汉语表达击伤的结果；“亚兰人”准确反映古代族名אֲרַמִּים。
- source_word: בָּרָמָה
  choice: 在拉末
  rationale: 此处בְּ标明交战受伤的地点；地名按相关经文通常译作“拉末”，即基列的拉末。
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: 他与亚兰王哈薛交战时
  rationale: 介词בְּ加不定式结构说明受伤时的情形；“与……交战”符合现代汉语习惯。
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: 亚哈谢下到
  rationale: 保留ירד的方向含义，反映从犹大山区前往耶斯列的下降行程。
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: 去看望……约兰
  rationale: 原文直译为“去看约兰”，在探视病人的语境中，“看望”是自然且不增添额外含义的汉语表达。
- source_word: כִּי חֹלֶה הוּא
  choice: 因为他病了
  rationale: חֹלֶה描述约兰当时患病或身体不适的状态；保留“病了”，不将其范围缩窄为“受伤”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。人名和地名使用简体中文圣经常见译名；“亚兰”保留古代政治族群名称，避免使用容易与现代叙利亚混同的称呼。原文重复两位约兰的父子身份，正文照实保留，以免混淆以色列王约兰与犹大王约兰。
