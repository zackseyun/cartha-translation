  text: בִּ/שְׁנַת֙ שְׁתֵּים עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/יוֹרָ֥ם בֶּן אַחְאָ֖ב מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲחַזְיָ֥הוּ בֶן יְהוֹרָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: zh_hans
  text: 亚哈的儿子以色列王约兰在位第十二年，犹大王约兰的儿子亚哈谢登基了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在本节分别使用“约兰”（יוֹרָם）和“约兰”（יְהוֹרָם）两个相关的名字形式，前者指以色列王，后者指犹大王；中文通常将二者都译作“约兰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה לְ/יוֹרָם
  choice: 约兰在位第十二年
  rationale: 这是希伯来语常见的王年纪年格式；补出“在位”使现代汉语自然，并准确表明所数的是约兰的统治年份。
- source_word: בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: 亚哈的儿子以色列王约兰
  rationale: 保留父子关系和王号，同时依汉语习惯将修饰语置于人名前。
- source_word: מָלַךְ
  choice: 登基了
  rationale: 此处在即位记载中表示开始作王；“登基”简洁明确，避免译成“作王”时可能被理解为持续统治。
- source_word: אֲחַזְיָהוּ
  choice: 亚哈谢
  rationale: 采用现代中文圣经语境中通行的人名音译。
- source_word: בֶן יְהוֹרָם מֶלֶךְ יְהוּדָה
  choice: 犹大王约兰的儿子
  rationale: 直接保留父子关系与王号，并按自然汉语语序表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“登基了”清楚表达即位含义。因两个希伯来名字形式在中文惯例中同译为“约兰”，正文保留通行译名，并以脚注说明原文差异；脚注标记置于整句末尾，以免误以为只说明“亚哈谢”。
