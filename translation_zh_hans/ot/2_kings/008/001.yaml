source:
  edition: WLC
  text: וֶ/אֱלִישָׁ֡ע דִּבֶּ֣ר אֶל הָ/אִשָּׁה֩ אֲשֶׁר הֶחֱיָ֨ה אֶת בְּנָ֜/הּ לֵ/אמֹ֗ר ק֤וּמִי וּ/לְכִי֙ אתי וּ/בֵיתֵ֔/ךְ וְ/ג֖וּרִי בַּ/אֲשֶׁ֣ר תָּג֑וּרִי כִּֽי קָרָ֤א יְהוָה֙ לָֽ/רָעָ֔ב וְ/גַם בָּ֥א אֶל הָ/אָ֖רֶץ שֶׁ֥בַע שָׁנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: zh_hans
  text: 以利沙曾对他所救活的那个孩子的母亲说：“你和你全家起身离开；你能在哪里寄居，就在那里寄居[a]，因为雅威已经召来饥荒，这饥荒也必临到这地，持续七年。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”所译的希伯来语动词常指暂时住在某地，或以外来居民的身份居住；本节重复使用该动词。
    reason: 说明גור在本节重复出现时所含的临时居住和外来居民意味。
lexical_decisions:
- source_word: דִּבֶּר
  choice: 曾……说
  rationale: 希伯来语完成式结合上下文指向先前发生的讲话；“曾”自然地表明其先于当前叙事。
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: 他所救活的那个孩子的母亲
  rationale: 原文直译为“他使她儿子活过来的那个女人”。中文用“那个孩子的母亲”明确所指，并以“救活”表达使役动词的复生含义。
- source_word: קוּמִי וּלְכִי
  choice: 要动身离开
  rationale: קוּמִי常与后续行动命令连用，表示起身采取行动；现代汉语“动身离开”既保留紧迫感，也避免生硬的“起来，去”。
- source_word: אַתִּי וּבֵיתֵךְ
  choice: 你和你全家
  rationale: בַּיִת在这里指家中成员而非建筑；“全家”是自然、清楚的现代汉语表达。
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: 到可以寄居的地方去寄居
  rationale: 保留同根动词的重复，并以“寄居”传达גור所含暂住、以外来居民身份居住的意味。
- source_word: כִּי קָרָא יְהוָה לָרָעָב
  choice: 因为雅威已经命饥荒临到
  rationale: קרא ל在此表示召来或命某事发生；此译保留雅威对饥荒的主权及主动作用。
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: 而且这饥荒必临到这地七年
  rationale: 原文动词为完成式，但在预告语境中可表达确定将发生之事；“必临到”既符合中文预言语体，也保留事件的确定性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近其通常重建的希伯来语读音，不以称号“主”替代专名。
- issue: 饥荒与神的关系
  choice: 雅威已经命饥荒临到
  alternative: 雅威已经宣告要有饥荒
  rationale: קרא ל具有召来、命其来到的能动含义；正文不弱化为仅仅预告，同时也不添加原文没有说明的次级因果机制。
- issue: 完成式בָּא在未来语境中的时态
  choice: 必临到
  alternative: 也已经临到
  rationale: 讲话显然预告即将持续七年的饥荒。希伯来语完成式可从说话者角度把未来事件表述为确定；中文以“必”表达这种确定性，而非误导为饥荒已经开始。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“动身离开”自然表达连续命令；“寄居”保留关键社会语义，并借脚注解释。神名统一译作“雅威”。
