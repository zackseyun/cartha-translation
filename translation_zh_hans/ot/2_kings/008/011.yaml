  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: zh_hans
  text: 他定睛注视，目光不移，直至有人感到羞愧；神人哭了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: 他定睛凝视
  rationale: 原文直译近于“使自己的脸保持不动”，在此描写持续而专注地注视；“定睛凝视”既自然，也保留脸面朝向不移的意象。
- source_word: וַיָּשֶׂם
  choice: 目光不移
  rationale: שׂים的基本义为“放置、使固定”；与前句连用时延续凝视不动的动作。译为“目光不移”可避免生硬的“把它放定”。
- source_word: עַד־בֹּשׁ
  choice: 直到羞愧
  rationale: בוש表示羞愧、窘迫。原文没有明确说出感到羞愧的是谁，因此中文也不补明主语。
- source_word: וַיֵּבְךְּ
  choice: 哭了
  rationale: בכה意为哭泣；“哭了”是现代汉语中自然、庄重而不过度修饰的表达。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是旧约对先知的固定称谓；“神人”沿用简洁而为读者熟悉的圣经用语，不改写为“先知”。
theological_decisions:
- issue: עַד־בֹּשׁ中感到羞愧者的身份
  choice: 以“直到羞愧”保留主语未明的状态
  alternative: 直到哈薛感到羞愧／直到以利沙感到羞愧
  rationale: 希伯来文未明确指出此处的主语，语境容许不止一种理解；正文不指定哈薛或以利沙，以免替原文消除其歧义。
translation_notes:
  register: 采用现代、简洁而庄重的叙事语体。“定睛凝视，目光不移”自然表达持续注视；“直到羞愧”刻意保留原文在现代汉语中略显突出的主语歧义。脚注标记[a]已置于相应正文之后。
