base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: zh_hans
  text: 哈薛说：“你的仆人算什么，不过是一条狗，竟会做出这样的大事呢？”以利沙说：“雅威已经指示我，你必作亚兰的王[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“作王治理亚兰。”希伯来文直译为“作王在亚兰之上”。
    reason: 说明עַל的直译，并保留“亚兰的王”与“治理亚兰”两种表达。
lexical_decisions:
- source_word: כִּי מָה
  choice: 算什么
  rationale: 在此引出哈薛难以置信的反问；“算什么”符合现代汉语表达，也保留其自谦和反驳语气。
- source_word: עַבְדְּךָ
  choice: 你仆人
  rationale: 这是对尊长自称的谦辞；保留“仆人”既反映原词，也不把其法律身份过度限定为奴隶。
- source_word: הַכֶּלֶב
  choice: 不过是一条狗
  rationale: 保留“狗”的贬抑意象，并以自然汉语表达哈薛的自我贬低。
- source_word: כִּי יַעֲשֶׂה
  choice: 竟会做出
  rationale: 表达反问中的惊讶和难以置信，同时不武断限定为单纯的能力、意愿或将来事实。
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: 这样的大事
  rationale: “事”保留דָּבָר的宽泛含义；“大”也保留原文可能带有规模惊人而非道德褒义的张力。
- source_word: הִרְאַנִי
  choice: 已经指示我
  rationale: 使役式完成体表示雅威已让以利沙看见或知道此事；“已经指示我”自然表达先前启示及其当前效力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现神名YHWH，不以称号“主”替代，也不采用对应Jehovah的“耶和华”。
- source_word: מֶלֶךְ עַל אֲרָם
  choice: 作亚兰的王
  rationale: 正文采用自然汉语表达王权归属；脚注说明介词עַל更直译为“治理亚兰”，以保留原文措辞。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”可在简体中文中较直接地对应YHWH，并避免用头衔取代专名。
- issue: 以利沙启示内容的确定性
  choice: 你必作亚兰的王
  alternative: 我看见你作亚兰的王
  rationale: 原文说雅威使以利沙看见哈薛为王；依上下文自然表达为明确预告，但不进一步说明这是神的命定、许可还是仅仅预知，以保留经文的神学张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“你仆人算什么，不过是一条狗”保留宫廷自谦和强烈贬抑意象；“大事”按原文保留语义张力，在本段语境中指规模骇人的行为，并非赞许。
