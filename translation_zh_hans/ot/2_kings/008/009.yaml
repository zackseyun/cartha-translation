  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: zh_hans
  text: 于是，哈薛去迎接以利沙，手里带着礼物，就是大马士革各样上好的物品，足够装满四十匹骆驼。他来到以利沙面前站着，说：“你儿子[a]亚兰王便·哈达派我来见你，说：‘我能从这场病中活下来吗？’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你儿子”是对受尊敬的上位者所用的谦恭自称，并不一定表示真实的父子关系。
    reason: cultural_note
  - marker: b
    text: 也可译作：“我能从这病中康复吗？”原文直译为“我能从这场病中活下来吗？”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: 去迎接以利沙
  rationale: 该结构表示前去迎见某人；中文补出上文所指的“以利沙”，避免连续代词造成指代不清。
- source_word: מִנְחָה
  choice: 礼物
  rationale: 这里是王派人送给先知的馈赠，并非祭祀用的供物；“礼物”自然且不过度强调政治臣属关系。
- source_word: בְיָדוֹ
  choice: 手里带着
  rationale: 保留希伯来文“在他手中”的具体意象，同时用现代汉语自然表达携带之意。
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: 就是大马士革各样上好的物品
  rationale: 将连接词理解为对“礼物”的具体说明；טוּב在此指当地优良、贵重的物产或货品。
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: 足足装了四十峰骆驼
  rationale: 表达礼物数量相当于四十峰骆驼所驮的载荷；“足足”传达其规模，但不把骆驼本身误作礼物。
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: 来到以利沙面前站着
  rationale: 保留正式觐见场景中的站立姿态，并补明代词所指。
- source_word: בִּנְךָ
  choice: 你儿子
  rationale: 直译其尊卑交往中的自谦称谓，不改写为“仆人”，以保留原文的亲属隐喻。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 采用历史名称“亚兰”，不以较晚的地缘名称“叙利亚”替代。
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: 我能从这场病中活下来吗
  rationale: 较贴近字面“从这病活下来”，并保留问题可能涉及康复或存活的语义张力；脚注给出自然的康复译法。
theological_decisions:
- issue: 病王所问是“康复”还是“存活”
  choice: 正文译作“我能从这场病中活下来吗”
  alternative: “我的病能好吗？”
  rationale: חיה的基本意义是“活”，在疾病语境中可指康复。正文保留生死层面的措辞，脚注说明自然语境下也可译为康复，避免提前消解后文的叙事张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。人名按常用圣经译名处理：“哈薛”“以利沙”“便·哈达”；地名采用“亚兰”“大马士革”。量词用“峰”搭配骆驼。脚注标记均置于正文对应位置。
