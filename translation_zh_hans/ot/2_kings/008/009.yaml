- from: 于是，哈薛去迎接以利沙，手里带着礼物，就是大马士革各样上好的物品，足足装了四十峰骆驼。他来到以利沙面前站着，说：“你儿子亚兰王便·哈达派我来问你[a]：‘我能从这场病中活下来吗？’[b]”
  to: 于是，哈薛去迎接以利沙，手里带着礼物，就是大马士革各样上好的物品，足够装满四十匹骆驼。他来到以利沙面前站着，说：“你儿子[a]亚兰王便·哈达派我来见你，说：‘我能从这场病中活下来吗？’[b]”
  rationale: 修订仅处理载量表达、使者转述句法和脚注锚点。“足够装满四十匹骆驼”明确货物的规模而不把骆驼误作被装载物；保留“活下来”及其脚注中的“康复”替代译法，以维持原文在疾病语境下的语义余地。
