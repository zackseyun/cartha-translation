  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: zh_hans
  text: 然而，耶和华不愿毁灭犹大，为了他的仆人大卫；正如他曾对大卫说过[a]，要赐给他一盏灯[b]，使他的子孙常有灯火。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“应许过”。
    reason: lexical_alternative
  - marker: b
    text: “灯”是王室意象，表示大卫的世系或王朝得以延续。
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: 然而……不愿
  rationale: 连接词在前文审判背景中带有转折意味；אָבָה表达意愿或同意，因此译为“不愿”，而非单纯的“没有”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名的通行音译，保留其专名性质。
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: 毁灭犹大
  rationale: 使役式不定词在此指对犹大的毁灭性审判；“毁灭”准确而自然。
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: 这是为了他的仆人大卫
  rationale: לְמַעַן表达因顾念大卫而采取行动的动机；保留“他的仆人”这一具有盟约意义的称谓。
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: 正如他曾对大卫说过
  rationale: 正文保留אָמַר“说”的基本含义；中文明确“大卫”作为受话者，可避免连续代词造成歧义。盟约语境中的“应许”义列入脚注。
- source_word: לָתֵת לוֹ נִיר
  choice: 要赐给他一盏灯
  rationale: 保留“赐给他”的句法关系和“灯”的具体王室意象，不直接释作“王朝”或“后裔”。
- source_word: לְבָנָיו
  choice: 留给他的子孙
  rationale: בָּנִים在王位延续语境中指大卫的男性后代及后世子孙；“留给”自然表达该灯与其后裔的关联，同时避免将介词关系过度解释为“借着”。
- source_word: כָּל־הַיָּמִים
  choice: 直到永远
  rationale: 该短语直译为“所有的日子”，在此表示持续不绝；“直到永远”是自然庄重的现代中文表达。
theological_decisions:
- issue: נִיר的王朝意象
  choice: 一盏灯
  alternative: 王朝／世系
  rationale: 保留原文具体隐喻及其与大卫之约的互文联系，不在正文中把隐喻直接解释为王朝；脚注说明其含义。
- issue: 神圣四字名יהוה的译法
  choice: 耶和华
  alternative: 雅威／主
  rationale: “耶和华”是简体中文现代圣经语域中辨识度最高的专名形式，既不以称号替代原文专名，也保持庄重与可读性。
- issue: אָמַר在盟约语境中的语力
  choice: 说过
  alternative: 应许过
  rationale: 原文字面为“说”，但语境具有应许功能；正文保留字面表达，脚注提供“应许”的可行理解，以保存语义张力。
- issue: 大卫后裔之延续的表达
  choice: 留给他的子孙，直到永远
  alternative: 借着他的子孙永远延续
  rationale: 选择较贴近原文介词结构的表达，不把“灯”与后裔的关系完全释义为王朝借后裔延续。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。以分号呈现转折后原因说明，以“大卫”替代容易混淆的代词；保留“灯”的原文隐喻，并用脚注作必要说明。
