  terminology: “耶和华”“他的仆人大卫”“一盏灯”均合适，且脚注对“灯”的王室／王朝意象说明准确。将持续性改为“使他的子孙常有灯火”能在中文中保留该隐喻，并避免将“所有的日子”定性扩展为“永远”。
