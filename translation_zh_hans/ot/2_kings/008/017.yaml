- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: 三十二岁
  rationale: 这是希伯来语表达年龄的固定结构；现代汉语自然译为“三十二岁”，既准确又简洁。
- source_word: הָיָה בְמָלְכוֹ
  choice: 他登基时
  rationale: 该结构指开始作王时的年龄；“登基时”符合现代汉语王权语境，并准确表达即位这一时间点。
- source_word: וּשְׁמֹנֶה שנה
  choice: 八年
  rationale: 直接保留作王年数。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词表示担任并行使君王权柄；“作王”是中文圣经叙事中自然、庄重且易懂的表达。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词表示地点，说明其作王所在之处。
