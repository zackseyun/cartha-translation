base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: zh_hans
  text: 以色列王亚哈的儿子约兰第五年[a]，犹大王约沙法还在位时，约沙法的儿子约兰[b]登基作犹大王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或更直译：“还有犹大王约沙法。”希伯来文此处结构紧凑；有人认为这反映了一段共同执政时期。
    reason: alternative_reading
  - marker: b
    text: 希伯来文用两个略有不同的名字：以色列王是“约兰”（יוֹרָם），约沙法的儿子、犹大王是“约兰”（יְהוֹרָם）；两者关系密切，中文通常译成同一个名字。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ לְ/יוֹרָם
  choice: 约兰第五年
  rationale: 这是列王纪常见的王年纪年格式；希伯来语用基数词表达序数意义，汉语自然译作“第五年”。
- source_word: בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王亚哈的儿子
  rationale: 保留父子关系和王号，同时按现代汉语习惯调整语序，使所修饰的“约兰”清楚明确。
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: 犹大王约沙法还在位时
  rationale: 原文是无动词的压缩结构；译文以时间从句表达其自然语义，但用脚注保留更直译的形式及其歧义。
- source_word: מָלַךְ
  choice: 登基
  rationale: 在王朝纪年公式中，此动词指开始作王；“登基”简洁、庄重，也不会被误解为概括整个统治时期。
- source_word: יוֹרָם / יְהוֹרָם
  choice: 约兰 / 约兰
  rationale: 现代中文圣经人名惯例通常将这两个紧密相关的希伯来语名字都译作“约兰”；脚注说明原文拼写有别，以帮助读者分辨以色列王和犹大王。
- source_word: יְהוֹרָם בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: 约沙法的儿子、犹大王约兰
  rationale: 保留父名和最终的王号，并用顿号形成自然的同位结构，明确此处说的是犹大王。
theological_decisions:
- issue: 约沙法在位与约兰登基之间的压缩年代关系
  choice: 译作“犹大王约沙法还在位时”，只表达经文本身所呈现的时间重叠
  alternative: 直译为“还有犹大王约沙法”，或在正文中明确解释为共同执政
  rationale: 希伯来文没有明说“共同执政”。正文不替经文解决列王纪中的年代张力，脚注则保留较直译的读法，并指出有人据此理解为共同执政。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“还在位时”自然呈现无动词从句的时间意义；“登基”符合中文王朝叙事习惯。人名采用简体中文圣经中通行的“亚哈、约兰、约沙法、犹大、以色列”。
