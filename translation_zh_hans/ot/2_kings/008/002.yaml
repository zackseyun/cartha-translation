base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: zh_hans
  text: 于是，那妇人起来，照着神人的话行事。她和全家前往非利士人之地，在那里寄居了七年[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “寄居”也可译为“以外来居民的身份居住”。
    reason: 说明גור在此并非泛指居住，也含在异地作为外来居民居留的意味。
lexical_decisions:
- source_word: וַתָּקָם
  choice: 起来
  rationale: קום的叙事性连续式表示她随即采取行动；“起来”既保留原文动作顺序，也符合现代汉语叙事表达。
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: 照着……的话去做
  rationale: 该惯用语指按某人所说的指示行事；此译自然清楚，并保留“话”的意象。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经对先知或受神差遣者的固定称谓；“神人”简洁地保留原文头衔，不直接将其解释为“先知”。
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: 她和全家一起去了
  rationale: בַּיִת带所属后缀在此指她的家户成员，而非房屋；“全家”在现代汉语中自然表达共同出行的家户。
- source_word: וַתָּגָר
  choice: 以外来人的身份住
  rationale: גור不只是一般居住，还含有在异地以寄居者或外来居民身份生活的社会含义；正文用解释性表达使现代读者易懂，并以脚注保留传统译法。
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: 在非利士人的境内
  rationale: 准确传达“非利士人之地”的民族—地域含义，同时比直译“非利士人之地”更符合现代汉语。
- source_word: שֶׁבַע שָׁנִים
  choice: 七年
  rationale: 时长在汉语中可直接置于动词之后，无须另加介词。
