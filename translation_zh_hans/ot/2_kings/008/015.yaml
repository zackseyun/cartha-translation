base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: zh_hans
  text: 第二天，他拿起那块盖布[a]，把它浸在水中，铺在他的脸上；他死了[b]。随后，哈薛接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“床罩”“被子”或“编织的网状布”。这个希伯来词很少见，具体指哪一种布并不确定。
    reason: lexical_alternative
  - marker: b
    text: 希伯来原文没有明确说是谁做了这些事。根据上下文，许多人认为主语是哈薛；但本节直到最后一句提到哈薛的名字，此前只说“他”。
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: 第二天
  rationale: 这是承接前文的时间表达，指前述事件之后的一天；“第二天”自然简洁。
- source_word: הַמַּכְבֵּר
  choice: 那块盖布
  rationale: 该名词罕见，可能指覆盖用的织物；“盖布”表达其用途，又不武断认定为被子或床罩，具体所指的不确定性保留在脚注中。
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: 浸在水里
  rationale: 动词表示蘸入或浸入；此处用“浸在水里”清楚呈现动作，也符合后续将湿布蒙脸的叙事。
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: 蒙在他的脸上
  rationale: 动词本义为铺开、展开；结合覆盖脸面的对象，中文“蒙在……脸上”自然且准确。
- source_word: וַיָּמֹת
  choice: 他就死了
  rationale: 原文以连续叙事形式陈述随后死亡。“就”体现动作次序及语境中的结果关系，但不译成目的结构。
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: 随后，哈薛接替他作王
  rationale: 兼顾“作王”和“代替他”的含义，以自然中文表达王位承继。
theological_decisions:
- issue: “拿起、浸、蒙”等动词的主语没有明说
  choice: 正文只用“他”，不直接点名哈薛
  alternative: 译作“哈薛拿起……”，或把行动者理解为某位未具名的侍从
  rationale: 希伯来文的动词形式仅含第三人称男性单数主语，直到末句才明确提到哈薛。上下文通常使人理解行动者是哈薛，但正文应保留原文在本节中的未明说状态。
- issue: וַיָּמֹת与前述动作的逻辑关系
  choice: 译作“他就死了”
  alternative: 译作“他死了”或“使他死了”
  rationale: 原文直接推进叙事，没有显式的目的或使役标记；“他就死了”自然呈现结果，同时不把句法强化为明确使役。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“那块盖布”承接前文语境，并以脚注保留罕见词的词义不确定性；连续使用“他”则保留原文没有明说行动者姓名的特点。
