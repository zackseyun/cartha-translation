  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ בֵּ֣ית אַחְאָ֔ב וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּ֛י חֲתַ֥ן בֵּית אַחְאָ֖ב הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: zh_hans
  text: 他行亚哈家的道，像亚哈家一样在雅威眼中行恶；因为他与亚哈家有姻亲关系。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “有姻亲关系”或译“是亚哈家的女婿”；原文用词可以泛指由婚姻形成的亲属关系，也可特指女婿。
    reason: 说明חֲתַן的词义范围，并保留较具体的另一译法。
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: 行……的道
  rationale: 保留希伯来文“行走在道路上”表示生活方式和行为取向的比喻，同时采用现代中文圣经叙事中自然、庄重的表达。
- source_word: בֵּית אַחְאָב
  choice: 亚哈家
  rationale: בַּיִת在此可兼指亚哈的家族、王室和王朝；“亚哈家”保留了原文的涵盖范围，未缩窄为单纯的家庭或政治王朝。
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  choice: 做雅威眼中看为恶的事
  rationale: 保留《列王纪》常见的评断公式，并以自然中文表达“在……眼中为恶”的神圣评价。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，明确呈现原文所用的专名。
- source_word: כְּבֵית אַחְאָב
  choice: 像亚哈家一样
  rationale: 直接保留比较关系；结合前后文，自然表示他的恶行与亚哈家相同。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述行为和评价的原因，现代中文用“因为”关系清楚。
- source_word: חֲתַן בֵּית אַחְאָב
  choice: 与亚哈家有姻亲关系
  rationale: חֲתַן可特指女婿，也可较宽泛地指由婚姻形成的亲属关系；结合本节人物关系，宽译为“有姻亲关系”既准确又保留词义范围。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；音译“雅威”使读者看见这是神的专名，而不是普通称号。
- issue: 亚哈家对本节人物的关系
  choice: 与亚哈家有姻亲关系
  alternative: 是亚哈家的女婿
  rationale: 希伯来词חֲתַן可以指女婿，但也能泛指婚姻亲属。此处不把关系强行限定为“女婿”，从而保留原文词义的弹性，并避免与叙事中的家族关系产生不必要的冲突。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“行……的道”保留原文的伦理道路比喻；“亚哈家”兼容家族与王朝含义。脚注标记置于所说明的姻亲关系之后。
