base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 约兰[a]其余的事迹，以及他所行的一切，不都记在《犹大列王纪》[b]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文名为“约兰”（Yoram）；传统译名作“耶何兰”。
    reason: alternative_reading
  - marker: b
    text: 或译：“《犹大诸王史册》”。这里所指的是王室编年记录。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: 其余的事迹
  rationale: יֶתֶר意为“其余、剩下的”，דִּבְרֵי在君王生平的总结套语中指其事迹或政事；译为“其余的事迹”既自然，也符合史书语境。句首וְ的承接作用由中文语序自然体现，不另加“现在”。
- source_word: יוֹרָם
  choice: 约兰
  rationale: 按希伯来文יוֹרָם转写，并采用现代中文圣经人名的通行形式“约兰”。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所行的一切
  rationale: 保留原文“所有他所做的”这一概括性关系从句，同时使中文庄重流畅。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 不都记……吗
  rationale: הֲלוֹא引出预期肯定回答的反问；中文“不都……吗”保留这一修辞力量，并用“记”自然表达书面载录。
- source_word: עַל סֵפֶר
  choice: 记在……上
  rationale: 原文介词עַל字面为“在……上”；中文谈到载于书卷时，“记在……上”自然，并保留原文意象。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王纪》
  rationale: 这是指有关犹大诸王的王室史料。“列王纪”简洁体现君王编年记录；书名号表明它是所引文献的名称，而不是必然指现存正典中的某卷书。
