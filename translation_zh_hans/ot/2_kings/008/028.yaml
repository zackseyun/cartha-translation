  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: zh_hans
  text: 他跟亚哈的儿子约兰一同前往基列的拉末，与亚兰王哈薛交战；亚兰人击伤了约兰。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击伤”或译“击打”。希伯来文动词的含义较宽；这里据战事语境及后文所述的伤势译作“击伤”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אֶת יוֹרָם
  choice: 他跟……约兰一同前往
  rationale: הלך 后的 אֵת 表示伴随；译出同行关系，并以“前往”自然表达叙事中的移动。
- source_word: לַמִּלְחָמָה עִם חֲזָהאֵל
  choice: 与……哈薛交战
  rationale: 在战争语境中，עִם 指交战的对象；“交战”比逐字译作“去打仗”更符合现代汉语，同时保留军事行动的含义。
- source_word: מֶלֶךְ אֲרָם / אֲרַמִּים
  choice: 亚兰王 / 亚兰人
  rationale: 按希伯来文的民族地理名称译作“亚兰”，并用“亚兰人”对应其复数族称，不改用传统的“叙利亚”。
- source_word: בְּרָמֹת גִּלְעָד
  choice: 在基列的拉末
  rationale: בְּ 标明交战地点；“基列的拉末”是清楚自然的中文地名表达。
- source_word: וַיַּכּוּ
  choice: 击伤
  rationale: נכה 的基本义较宽，可指击打；结合战事语境及后文约兰因伤疗养，译作“击伤”最贴切，但以脚注保留较宽的词义。
