  to: 他正向王讲述以利沙怎样使死者复活[a]的时候，看哪[b]，那位儿子曾被以利沙救活的妇人，正在为自己的房屋和田地向王呼求。基哈西说：“我主我王，这就是那妇人，这就是她的儿子，就是以利沙所救活的。”
  rationale: 修订将脚注 b 移至“看哪”后，使锚点与注释对象一致；调整妇人关系从句的语序以提升自然度；并在末句恢复“她的儿子”这一明示归属。其余内容维持原有译法与语义范围，未增加解释性神学判断。
