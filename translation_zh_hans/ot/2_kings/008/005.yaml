  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: zh_hans
  text: 他正向王讲述以利沙怎样使死者复活[a]的时候，看哪[b]，那位儿子曾被以利沙救活的妇人，正在为自己的房屋和田地向王呼求。基哈西说：“我主我王，这就是那妇人，这就是她的儿子，就是以利沙所救活的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “使死者复活”也可译作“使死者恢复生命”。希伯来文使用“活”的使役形式（החיה）。
    reason: lexical_alternative
  - marker: b
    text: “看哪”突出一个突然且令人惊异的巧合：那妇人恰在基哈西讲述这件事时来到王面前。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ
  choice: 他正向王讲述……的时候
  rationale: 以自然的现代汉语表达叙事背景与分词所表示的持续动作，同时保留“向王讲述”的对象关系。
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: 以利沙怎样使死人复活
  rationale: הֶחֱיָה是“使活、使恢复生命”的使役式；“使死人复活”简明保留使役含义。依上下文补出“以利沙”，避免汉语代词所指不明。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留该叙事语气词所凸显的突然性和令人惊异的巧合，而不将其弱化为普通连接词。
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: 那位儿子被以利沙救活的妇人
  rationale: 原文关系结构直译在汉语中生硬，改用自然的修饰结构；补出施事“以利沙”以免误读。“救活”准确表达使恢复生命。
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: 正……向王呼求
  rationale: צעק在这里是为求援或求公断而急切呼喊；“呼求”兼顾声音力度与诉求语境。
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: 为自己的房屋和田地
  rationale: עַל在此引出申诉事项；结合产业归还的语境，“为”比单纯“关于”更能呈现她有所诉求，同时“田地”保留שָׂדֶה的具体意义。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王
  rationale: 保留古代宫廷中恭敬的称呼，措辞庄重且在现代中文圣经语体中可理解。
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: 这就是那妇人，这就是……儿子
  rationale: 两个指示词用于当面确认身份；重复“这就是”保留基哈西话语中的强调和现场感。
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: 以利沙救活的
  rationale: 自然表达关系从句，并与前文“救活”一致；此处原文明确以利沙为施事。
