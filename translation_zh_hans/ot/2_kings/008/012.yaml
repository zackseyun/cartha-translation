source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: zh_hans
  text: 哈薛说：“我主为什么哭？”以利沙回答：“因为我知道你将怎样恶待以色列人：你会放火焚烧他们的堡垒，用刀杀死他们的壮丁，摔碎他们的幼童，剖开他们的孕妇。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: 我主
  rationale: 这是哈薛对以利沙的尊称，并非对上帝的称呼；“我主”保留了原文的敬意和主从语气。
- source_word: בֹכֶה
  choice: 哭
  rationale: 分词表示正在哭泣；现代汉语问句用“为什么哭”自然、庄重，也不削弱场景的悲痛。
- source_word: כִּי יָדַעְתִּי
  choice: 因为我知道
  rationale: כִּי引出以利沙哭泣的原因，完成式在此具有当前认知意义，译作“我知道”最自然。
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: 你将怎样恶待
  rationale: 原文的宾语关系从“你将做的事”延伸至后置的“恶”；“怎样恶待”在汉语中自然地整合句法，同时保留行为的道德恶性。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 希伯来语惯用表达字面为“以色列的众子”，在此整体指以色列民；“以色列人”是现代汉语准确而自然的群体称谓。
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: 放火烧毁他们的堡垒
  rationale: 字面意象是“把他们的堡垒送入火中”；“放火烧毁”清楚表达纵火与毁灭的结果，“堡垒”保留军事设施的含义。
- source_word: וּבַחֻרֵיהֶם
  choice: 他们的壮丁
  rationale: 该词指正值壮年的青年男子，常含适合争战之意；“壮丁”比泛称“年轻人”更贴合战争语境。
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: 用刀杀死
  rationale: 保留原文的工具短语和直接、具体的暴力表述；“刀”是圣经语境中חֶרֶב的常用汉语对应词。
- source_word: עֹלְלֵיהֶם
  choice: 他们的幼童
  rationale: 该词指年幼儿童或幼儿；“幼童”保留受害者年幼脆弱的特征，同时不武断限定为婴儿。
- source_word: תְּרַטֵּשׁ
  choice: 摔碎
  rationale: 该动词表示猛烈摔击、砸碎；“摔碎”简洁而具体，保留原文刻意呈现的残酷。
- source_word: הָרֹתֵיהֶם תְּבַקֵּעַ
  choice: 剖开他们的孕妇
  rationale: 原文明言剖开怀孕妇女；直译保留预言的惨烈与道德重量，不以委婉说法淡化。
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל的群体称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 该希伯来语短语是指整个以色列群体的惯用语。现代汉语“以色列人”准确传达所指，避免让读者误以为只特指儿子或男性后裔。
- issue: 预言中暴力细节的呈现
  choice: 明确译出烧毁、杀死、摔碎和剖开
  alternative: 用“伤害”或“残害”等概括性表达加以弱化
  rationale: 原文有意逐项、具体地陈述战争暴行。保留这些细节既不等于认可暴行，也不把预知误写成命令，而是忠实呈现以利沙悲哭的原因和经文的道德震撼。
- issue: 预知与责任的关系
  choice: 保持“我知道你将……”的陈述形式
  alternative: 改写为上帝命定或命令哈薛施行这些事
  rationale: 本节只陈述以利沙对哈薛未来行为的认识，并将其称为恶；译文不额外解决预知、命定和行为责任之间的神学张力。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。保留原文直接而惨烈的战争描写，不作古奥化或委婉化处理；对希伯来语群体惯用语则使用自然的现代汉语。
