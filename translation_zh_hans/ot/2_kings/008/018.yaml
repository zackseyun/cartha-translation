  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: zh_hans
  text: 他行以色列诸王所行的道，正如亚哈家所行的，因为亚哈的女儿是他的妻子；他行耶和华眼中看为恶的事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: 他行……所行的道
  rationale: הלך与בדרך构成生活行为的隐喻，指依循某种行事方式。译文保留“行／道”的希伯来意象，同时用“所行的道”使现代汉语自然通顺。
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: 以色列诸王
  rationale: 直译该属格结构，所指是北国历代君王所代表的行为模式。
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: 正如亚哈家所行的
  rationale: 比较约兰的行为与亚哈王室一贯的行为；“亚哈家”保留王朝兼家族的表达，不把含义限缩为现代意义的家庭。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他效法亚哈家的原因；现代汉语用“因为”清楚表达因果关系。
- source_word: בַּת אַחְאָב
  choice: 亚哈的女儿
  rationale: 按原文从属结构直译，不在正文中补出原文未写的人名。
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: 作了他的妻子
  rationale: 该希伯来习语表示她是他的妻子；“作了他的妻子”兼顾原文结构和自然汉语，不强调婚姻开始的具体时间。
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 定冠词修饰的רַע在固定评价语中指“恶的事”；译为“行……看为恶的事”符合中文圣经叙事的庄重表达。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留“在……眼中”的神圣评价意象，并用汉语惯用结构完整表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文读者熟悉的专名“耶和华”音译四字神名，区别于称号“主”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用上帝的专名。中文正文采用广为人知且可明确识别为专名的“耶和华”；“雅威”更接近学界常见的拟音，但并非完全确定的古代发音。
- issue: 婚姻关系与恶行之间的因果表达
  choice: 保留“因为”所表达的叙事因果关系
  alternative: 弱化为“而亚哈的女儿是他的妻子”
  rationale: 原文כִּי明确引出解释或原因。译文保留这一联系，但不额外断定妻子个人如何影响他，也不超出文本分配道德责任。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语，保留“行道”和“耶和华眼中”的希伯来意象。句中以分号分隔原因说明与最终的神圣评价，使长句层次清晰。
