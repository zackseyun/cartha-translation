  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֱלִישָׁע֙ דַּמֶּ֔שֶׂק וּ/בֶן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם חֹלֶ֑ה וַ/יֻּגַּד ל֣/וֹ לֵ/אמֹ֔ר בָּ֛א אִ֥ישׁ הָ/אֱלֹהִ֖ים עַד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: zh_hans
  text: 以利沙来到大马士革。那时，亚兰[a]王便·哈达病了。有人告诉他说：“神人已经到这里来了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”也可译作“叙利亚”；希伯来文作“亚兰”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: 叙事中的连续式推动情节；汉语不必机械译出句首连接词。“来到”也自然表达以利沙抵达大马士革。
- source_word: אֱלִישָׁע
  choice: 以利沙
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: דַּמֶּשֶׂק
  choice: 大马士革
  rationale: 采用现代中文通行地名。
- source_word: וּבֶן־הֲדַד
  choice: 那时，……便·哈达
  rationale: 句首的连接词在此引入背景情况，“那时”自然显示叙事转向；人名采用通行音译，并以间隔号标明复合名称。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 直接保留希伯来文的民族地理名称“亚兰”，不在正文中解释性地改作“叙利亚”。
- source_word: חֹלֶה
  choice: 病了
  rationale: 谓语分词描述便·哈达当时患病的状态；“病了”简洁自然。
- source_word: וַיֻּגַּד לוֹ
  choice: 有人告诉他
  rationale: 希伯来文是不指明施事者的被动表达；现代汉语用泛指主语“有人”可自然保留施事者不明这一点。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来文引出直接引语的公式，同时符合现代汉语表达。
- source_word: בָּא
  choice: 已经……来了
  rationale: 完成式在报告话语中表示抵达已经发生且人目前在场；“已经……来了”传达这一完成及现存结果。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留希伯来文“神的人”这一固定称号，而不直接释义为“先知”；“神人”是简洁且通行的中文对应。
- source_word: עַד הֵנָּה
  choice: 到这里
  rationale: 该短语表示抵达说话者所在之处；“到这里”既自然，也比单译“在这里”更明确保留移动和抵达之意。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将脚注标记置于其实际说明的“亚兰”之后，而不沿用英文咨询文本中误置于“病了”之后的位置。
