base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: zh_hans
  text: 于是，哈薛离开以利沙，来到他主人那里。主人问他：“以利沙对你说了什么？”他说：“他告诉我：‘你一定会康复。’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你必定活下去。”希伯来文的字面结构为“活着，你必活着”，以同一动词的重复表示强调；在这里是指从疾病中康复。
    reason: 保留חָיֹה תִחְיֶה的字面“活”及其强调结构，并说明疾病语境下“康复”的正文译法。
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: 哈薛离开以利沙
  rationale: הלך与מֵאֵת合起来表示从以利沙那里离开。按上下文补出主语“哈薛”，使现代汉语叙事清楚自然。
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: 回到他主人那里
  rationale: בוא אֶל表示来到某人那里；结合哈薛奉王差遣后返回的语境，用“回到”自然表达其返回之意。אֲדֹנָיו在此指哈薛的人间君主便哈达，不是神圣称号，因此译为“他主人”。
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: 以利沙对你说了什么？
  rationale: 直接保留问句结构，符合现代汉语表达。
- source_word: אָמַר לִי
  choice: 他告诉我
  rationale: 在转述回答中，“告诉我”比逐字译作“对我说”更顺畅，且不增添原文信息。
- source_word: חָיֹה תִחְיֶה
  choice: 你一定会康复
  rationale: 不定式绝对形与未完成式同词根连用，表达强调，故译“一定”。חיה字面为“活”，但在询问疾病能否痊愈的语境中指康复；正文采用自然明确的“康复”，脚注保留字面形式。
theological_decisions:
- issue: אֲדֹנָיו在非神圣语境中的称谓
  choice: 他主人
  alternative: 他的主
  rationale: 这里指哈薛的君王和上级便哈达，并非对上帝的称呼；“主人”既反映从属关系，也避免产生神圣称号的误解。
- issue: חָיֹה תִחְיֶה是“活”还是“康复”
  choice: 正文译“你一定会康复”
  alternative: 你必定活着／你一定能活
  rationale: 原文措辞本身是“活”，但本段语境明确关乎疾病是否痊愈。正文传达语境义，同时以脚注保存其字面表达和强调结构，不借此解决上下文中预言与后续死亡之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。按上下文补明首句主语“哈薛”，避免连续代词造成歧义；对话简洁，保留原文直接问答的节奏。脚注标记紧随其实际说明的“康复”，而非置于“主人”之后。
