base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: zh_hans
  text: 亚哈谢登基时二十二岁；他在耶路撒冷作王一年。他母亲名叫亚她利雅，是以色列王暗利的女儿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“暗利的后裔”。希伯来语“女儿”有时可指女性后裔或某王朝的成员，不一定指亲生女儿。
    reason: 保留希伯来语亲属称谓可能具有的较广谱系或王朝含义。
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: 二十二岁
  rationale: 这是希伯来语表达年龄的固定说法，直译为“二十二岁之子”；现代汉语自然表达为“二十二岁”，并准确保留年龄。
- source_word: בְמָלְכוֹ
  choice: 登基时
  rationale: 这是君王登位年龄公式，指亚哈谢开始作王之时；“登基时”简洁、自然，也符合上下文。
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: 他……作王一年
  rationale: 直接保留在位时长，符合现代汉语叙述习惯。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按地点介词的通常意义翻译。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 自然呈现希伯来语的母亲姓名公式，同时保持庄重简明。
- source_word: עֲתַלְיָהוּ
  choice: 亚她利雅
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בַּת עָמְרִי
  choice: 暗利的女儿
  rationale: 正文保留 בַּת 最直接的亲属称谓“女儿”；其可能指女性后裔或王朝成员的较广含义在脚注说明。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 自然表达希伯来语属格结构，并说明暗利的君王身份。
theological_decisions:
- issue: “暗利的女儿”所表达的谱系关系
  choice: 正文保留“暗利的女儿”
  alternative: 暗利的后裔
  rationale: 希伯来语 בַּת 的基本意义是“女儿”，但在谱系和王朝语境中也可泛指女性后裔或王朝成员。正文保留字面亲属称谓，脚注呈现较广的可能含义，避免擅自消除原文的张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“登基时”和“作王一年”延续列王纪王位记述的简洁节奏；脚注标记紧接其所说明的“女儿”。
