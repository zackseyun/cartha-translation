base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: zh_hans
  text: 王对哈薛说：“你带上礼物，去迎见神人，借着他求问雅威，说：‘我这病能好吗？’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我能从这病中活下来吗？”希伯来文动词直译为“活”，这里指从疾病中存活或康复。
    reason: 词义另译
lexical_decisions:
- source_word: מִנְחָה
  choice: 礼物
  rationale: 本段所指是求问先知时随身带去的赠礼，并非祭祀中的供物；“礼物”自然且不引入祭仪含义。
- source_word: לִקְרַאת
  choice: 迎见
  rationale: 该不定式接在“去”之后表目的；“去迎见”既贴近希伯来语结构，也符合庄重的现代汉语。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来叙事中对先知的固定称谓。保留“神人”，而不直接释作“先知”，可保存原文的叙事与神学色彩。
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: 托他求问雅威
  rationale: דרשׁ 在此指向雅威求取谕示，מֵאֹתוֹ 表明以利沙是传达答复的中介；“托他求问”以自然汉语表达这层关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文使用四字神名；采用“雅威”音译，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: הַאֶחְיֶה
  choice: 我这病能好吗
  rationale: 该动词字面义为“活”，在疾病语境中询问的是能否活下来、病得痊愈；“病能好吗”是自然现代汉语，同时以脚注保留字面可能。
- source_word: מֵחֳלִי זֶה
  choice: 这病
  rationale: 简洁自然地指王眼下所患的疾病，并与“能好吗”构成地道问句。
- source_word: בְּיָדְךָ
  choice: 你手里带上
  rationale: 保留“在你手中”的具体意象，同时用“带上”使中文表达顺畅。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近通行的学术重构读音，并明确将其作为专名呈现。
- issue: הַאֶחְיֶה 的语义张力
  choice: 正文译作“我这病能好吗”，脚注保留“活下来”
  alternative: 我能从这病中活下来吗
  rationale: 疾病语境支持“痊愈”的惯用含义，但原动词本义为“活”。正文采用自然问法，脚注保存生存与康复之间的语义张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“神人”为有意保留的圣经叙事称谓；其余句式力求口语可懂而不过度现代化。脚注标记置于其所说明的问句之后。
