base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/022.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: zh_hans
  text: 于是，以东背叛犹大，脱离其统治，直到今日[a]。就在那时，立拿也背叛了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背叛”也可译作“反叛”或“脱离”。希伯来语动词在这里指政治上反抗统治。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: 背叛
  rationale: פשע在这里指政治上反抗既有统治；“背叛”简明自然，并保留其反叛性质。
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: 犹大的统治
  rationale: 希伯来语直译为“从犹大手下”，是表示受辖制的习语；译作“犹大的统治”可清楚传达政治隶属关系，避免现代汉语中生硬或可能误解的表达。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 保留希伯来叙事中从事件发生延续至叙述者当时的标准时间表达。
- source_word: אָז
  choice: 那时
  rationale: 此词把立拿的背叛与前述历史时刻相连；结合句末时间短语，在汉语中用“那时”自然承接。
- source_word: תִּפְשַׁע
  choice: 背叛
  rationale: 与本节前一个同源动词保持一致，表达政治上的反抗。
- source_word: לִבְנָה
  choice: 立拿
  rationale: 采用现代中文圣经语境中通行的地名音译。
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 表示立拿的背叛发生在同一历史时期；与אָז合并表达，可避免汉语重复成“那时……在那时”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这样”承接上文结果；将希伯来习语“从犹大手下”按其政治含义译为“犹大的统治”。原文אָז与בָּעֵת הַהִיא形成时间上的重复强调，汉语合并为一次“那时”，以保持自然流畅而不改变事件关系。
