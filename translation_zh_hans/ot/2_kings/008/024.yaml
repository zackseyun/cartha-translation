  text: וַ/יִּשְׁכַּ֤ב יוֹרָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: zh_hans
  text: 约兰与列祖同眠[a]，葬在大卫城，与列祖同葬。他儿子亚哈谢接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“与列祖一同躺卧”。希伯来文在这里使用王室讣告的惯用语，表示约兰去世。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同眠
  rationale: שׁכב本义为“躺卧”，在列王纪的王室讣告套语中委婉表示死亡。“同眠”既保留希伯来语意象，也不把套语直接释写为“死了”。
- source_word: עִם אֲבֹתָיו
  choice: 与列祖
  rationale: 这是列王纪常见的王朝讣告用语。“列祖”自然、庄重，并保留其宗族与世代含义。
- source_word: וַיִּקָּבֵר
  choice: 葬
  rationale: 尼法勒式在此表示被动意义；中文用“葬在”即可自然表达“被安葬”。
- source_word: בְּעִיר דָּוִד
  choice: 在大卫城
  rationale: “大卫城”是该专名在现代中文中的通行译法。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: מלך在王位继承套语中指执掌王权；“作王”简洁保留经文的登基与统治含义。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תַּחַת在继位语境中意为“取代、居其位”；“接替他”是自然且准确的现代汉语。
- source_word: יוֹרָם
  choice: 约兰
  rationale: 按希伯来文יוֹרָם音译，并采用中文圣经读者熟悉的人名形式。
- source_word: אֲחַזְיָהוּ
  choice: 亚哈谢
  rationale: 按希伯来文人名采用现代中文圣经中通行且易辨认的译名。
theological_decisions:
- issue: 王室死亡套语是否直接译为“死了”
  choice: 保留“与列祖同眠”的意象
  alternative: 译作“死了”
  rationale: 原文采用固定而含蓄的死亡表达；保留其意象可避免将措辞中的文学与神学张力提前解释掉，同时用脚注说明实际功能。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。“与列祖同眠……与列祖同葬”保留原文有意的重复；不另设英文译名传统所需的人名脚注，因为中文“约兰”已直接对应此处希伯来文יוֹרָם。
