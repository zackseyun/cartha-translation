base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: zh_hans
  text: 王询问那妇人，她就把事情告诉了王。于是王为她指派了一名宫廷官员[a]，吩咐说：“凡属于她的，都要归还给她；从她离开这地那天起直到现在，田里的一切出产也都要归还。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宦官”。这个王室职衔既可指实际受过阉割的宦官，也可泛指王室官员。
    reason: 保留 סָרִיס 在“宦官”与一般王室官员之间的真实词义歧义。
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: 王询问那妇人
  rationale: 补明希伯来文中的主语“王”，并将 אִשָּׁה 按上下文译为“妇人”，指前文的书念妇人，而非强调其婚姻身份。
- source_word: וַתְּסַפֶּר לוֹ
  choice: 她就把事情告诉了王
  rationale: ספר 的 Piel 词形在此表示讲述、陈说；“把事情告诉了王”符合现代汉语叙事，也明确了代词所指。
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: 王为她指派了一名宫廷官员[a]
  rationale: נתן 在此语境表示为她安排一人办理归还事宜；סָרִיס 可指宦官，也可泛指王室官员，正文采用较宽泛的“宫廷官员”，另以脚注保留歧义。אֶחָד 译作“一名”，自然表达个体官员。
- source_word: לֵאמֹר
  choice: 吩咐说
  rationale: 该不定式引出直接引语；结合君王向官员下令的语境，译为“吩咐说”既自然又保留其引语功能。
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: 凡属于她的，都要归还给她
  rationale: שוב 的 Hiphil 祈使式要求使财物回归原主；“凡……都……”保留 כָּל 的全面范围。
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: 田里的一切出产
  rationale: תְּבוּאָה 指田地的农产或收成；“出产”不将其过度限定为现金收入，并能涵盖这段时期积累的田地收益。
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: 从她离开这地那天起直到现在
  rationale: 保留原文起点至当前时刻的时间范围；“这地”按叙事视角自然表达 הָאָרֶץ，同时不武断限定为国家或某一行政区域。
