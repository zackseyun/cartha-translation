  text: וַ/יִּכְרֹ֨ת יְהוֹיָדָ֜ע אֶֽת הַ/בְּרִ֗ית בֵּ֤ין יְהוָה֙ וּ/בֵ֤ין הַ/מֶּ֨לֶךְ֙ וּ/בֵ֣ין הָ/עָ֔ם לִ/הְי֥וֹת לְ/עָ֖ם לַֽ/יהוָ֑ה וּ/בֵ֥ין הַ/מֶּ֖לֶךְ וּ/בֵ֥ין הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: zh_hans
  text: 于是，耶何耶大在雅威、王和百姓之间立了约[a]，要他们作雅威的子民[b]；又在王和百姓之间立了约。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“切约”，这是表示“立约”的固定说法。
    reason: lexical_alternative
  - marker: b
    text: 也可译为“成为属雅威的百姓”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: 立约
  rationale: 希伯来语直译为“切约”，是缔结盟约的固定表达。现代汉语以“立约”自然、准确地传达其正式的盟约含义。
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: 在雅威、王和百姓之间
  rationale: 重复的 בֵּין 标明立约各方；汉语用并列结构表达三方关系，既简洁，也不改变原文结构。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的现代汉语音译呈现上帝的专名四字神名，而不以称号替代。
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: 使百姓作雅威的子民
  rationale: 该不定式短语表达立约的目的或结果。“作雅威的子民”保留盟约归属关系，同时符合现代汉语表达。
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: 他又在王和百姓之间立约
  rationale: 原文另列王与百姓之间的关系。补出主语和动词是汉语为清楚起见所需的省略补足，“又”对应其附加关系。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: “雅威”直接呈现神的专名，保留本节盟约关系中的名称特色；不把专名改为称号。
- issue: לִהְיוֹת לְעָם לַיהוָה 所表达的归属关系
  choice: 使百姓作雅威的子民
  alternative: 使他们成为归雅威的一族／作属于雅威的百姓
  rationale: “作雅威的子民”自然表达归属含义，但不额外界定这种归属的具体神学机制，并保留目的与结果之间的语义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“耶何耶大”“雅威”“子民”等用语保持圣经叙事的正式语体；第二个“立约”在汉语中补出，以清楚呈现原文并列的两层盟约关系。
