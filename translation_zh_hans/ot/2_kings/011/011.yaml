base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: zh_hans
  text: 护卫兵[a]各人手持兵器，从殿的右边直到殿的左边[b]，在祭坛和殿旁边[c]，四面围着王站立。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“跑者”，即王室护卫兵。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“从殿的右边直到殿的左边”；按圣殿的朝向，也可理解为“从南边直到北边”。
    reason: alternative_reading
  - marker: c
    text: 这里的“殿”指圣殿建筑或其范围。
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: 护卫兵
  rationale: 该词字面源自“奔跑”，可指“跑者”，但在此王室武装保护的语境中指护卫人员；“护卫兵”清楚表达其职能，同时以脚注保留字面称呼。
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: 各人手持兵器
  rationale: אִישׁ 在此作分配用法，意为“各人”；כְּלִי 在武装护卫语境中宜译作“兵器”。“手持”自然保留了原文“在他手中”的戒备画面。
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: 从……右边直到……左边
  rationale: כֶּתֶף 字面为“肩”，用于建筑空间时指侧边；译为“边”符合现代汉语空间表达。
- source_word: הַבַּיִת
  choice: 殿
  rationale: 原词通常为“房屋”，但本节语境明确指耶和华殿的建筑或范围；汉语以“殿”既自然又保留其宗教建筑指向。
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: 右边／左边
  rationale: 保留希伯来文直接的左右方位；可能按古代朝向理解为南边／北边，置于脚注说明而不在正文中替换。
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: 在祭坛和殿那里
  rationale: 前缀 ל 在此压缩的空间描述中可表示位置或方向。“在……那里”表达邻近或所在区域，同时不把含义过度限定为精确接触或单纯朝向。
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: 四面围着王
  rationale: 该短语描绘护卫人员环绕王形成保护圈；“四面围着王”自然保留 סָבִיב 的周围、各面之意。
