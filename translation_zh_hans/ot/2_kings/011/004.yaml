  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: zh_hans
  text: 第七年，耶何耶大派人召集百夫长、迦利人[a]和跑者[b]，带他们到雅威的殿里来见自己。他与他们立约，又在雅威的殿里叫他们起誓，然后让他们见王的儿子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“基利提人”。这个希伯来称谓很可能指一支王室卫队，但其确切身份不能确定。
    reason: alternative_reading
  - marker: b
    text: “跑者”可能是王室卫兵或信使的称谓。
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: 第七年
  rationale: 自然表达叙事的时间背景；句首连接词不必机械译出。
- source_word: שָׁלַח וַיִּקַּח
  choice: 派人召来
  rationale: 原文直译为“派遣并带来/取来”；在此语境中表示耶何耶大派人把相关人员召到自己这里，合译可清楚传达动作关系。
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: 百人队的众军官
  rationale: 保留这些军官统领百人单位的含义，同时避免使用带有罗马军制色彩的“百夫长”。
- source_word: לַכָּרִי
  choice: 迦利人
  rationale: 按马所拉文本将该词视为群体名称音译，不武断确定其族属或具体职能。
- source_word: וְלָרָצִים
  choice: 跑差的人
  rationale: 保留词根“奔跑”的字面形象；该称谓在王室环境中可能指卫兵或信使，具体职能留待脚注说明。
- source_word: וַיָּבֵא אֹתָם אֵלָיו
  choice: 把他们带到……与自己会面
  rationale: 明确 אֵלָיו 所表达的“到耶何耶大这里”，又使现代汉语行文自然。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: “殿”自然指雅威的圣殿；既传达“雅威之家”的所指，也避免现代汉语中“房屋”可能造成的误解。
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: 他与他们立约
  rationale: “立约”是 כרת ברית 在汉语圣经语体中自然且庄重的对应，保留其政治和宗教分量。
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: 叫他们起誓
  rationale: 准确体现使役含义，即耶何耶大使他们宣誓，而不预先限定誓言的具体内容。
- source_word: וַיַּרְא אֹתָם אֶת בֶּן הַמֶּלֶךְ
  choice: 让他们见王的儿子
  rationale: 表达耶何耶大将王子显给他们看的动作，并保持原文简洁。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现该专名，不以称号替代。
- issue: בְּרִית 的性质
  choice: 约
  alternative: 协议
  rationale: 原文没有说明具体条款或只限于政治协议；译作“约”保留其正式、庄严及可能兼具宗教意义的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“百人队的众军官”兼顾军制含义与可读性；“跑差的人”保留原文称谓的形象，并以脚注交代其可能职能。脚注标记按其实际所释词语分别置于“迦利人”和“跑差的人”之后。
