revisions:
- from: 第七年，耶何耶大派人召来百人队的众军官、迦利人[a]和跑差的人[b]，把他们带到雅威的殿里与自己会面。他与他们立约，又在雅威的殿里叫他们起誓，然后让他们见王的儿子。
  to: 第七年，耶何耶大派人召集百夫长、迦利人[a]和跑者[b]，带他们到雅威的殿里来见自己。他与他们立约，又在雅威的殿里叫他们起誓，然后让他们见王的儿子。
  rationale: 修订仅处理汉语称谓和句法的自然性：“跑者”比“跑差的人”更符合现代汉语，同时保留原文的字面性及其职能不确定性；“来见自己”准确、自然地表达“带他们到他那里”。其余关键术语、专名、叙事顺序和脚注锚点均予保留。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:30Z'
review_pass:
  verdict: revise
  source_fidelity: 整体忠实地保留了人物、时间、立约、起誓及向众人展示王子的叙事。译作“迦利人”并以脚注保留“基利提人”的可能性，恰当地维持了该称谓的不确定性。不过，“与自己会面”把原文“带到他那里”的简单指向表达得不自然，且略显反身含混。
  naturalness: “跑差的人”不是现代标准汉语中自然、清楚的群体称谓；“跑者”既贴近原文字面，也可借脚注说明其可能的王室职能。“把他们带到……与自己会面”也不合自然叙事汉语，宜改为“带他们到……来见自己”。
  terminology: “雅威”“立约”“起誓”均恰当且保持庄重。“百夫长”在现代汉语中可泛指统领百人的军官，并不必然导入罗马军制；相较“百人队的众军官”更简洁自然。保留“迦利人”及其替代译法脚注是审慎的。
  issues:
  - severity: medium
    issue: “跑差的人”用语不自然且称谓性质不清。
    rationale: וְלָרָצִים字面为“跑者/奔跑者”，在此可能是王室卫队或传令人员的专称；“跑者”可保留字面与不确定性，具体功能应由脚注交代。
  - severity: low
    issue: “把他们带到雅威的殿里与自己会面”不合现代汉语表达。
    rationale: 原文仅表示耶何耶大把他们带到自己那里，即带进雅威的殿中来见他；“与自己会面”带有不必要的反身和正式会谈意味。
  - severity: low
    issue: “百人队的众军官”略显冗长。
    rationale: שָׂרֵי הַמֵּאוֹת指统领百人的军官；“百夫长”是简洁、通行的对应，未必限定为罗马军制。
  revised_text: 第七年，耶何耶大派人召集百夫长、迦利人[a]和跑者[b]，带他们到雅威的殿里来见自己。他与他们立约，又在雅威的殿里叫他们起誓，然后让他们见王的儿子。
  revised_footnotes:
