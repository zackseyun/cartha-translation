base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: zh_hans
  text: 那地所有的百姓都欢喜，城里也安静了。至于亚他利雅，他们在王宫[a]用刀杀死了她。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王宫”直译为“王的家”。原文末尾是一个简略的地点短语；也可译作“在王的宫中”或“在王的宫殿那里”。
    reason: 说明“王宫”对“王的家”的语境化表达，并保留原文简略地点短语在地点表述上的细微开放性。
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: 欢喜
  rationale: שׂמח 表示喜乐、欢欣；“欢喜”自然地保留了百姓庆贺的意味。
- source_word: כָּל עַם הָאָרֶץ
  choice: 全国民众
  rationale: 该短语直指“全地之民”，在本段政治叙事中指全国的民众；此译比“全地的百姓”更符合现代汉语，同时保留其集体和社会政治意味。
- source_word: וְהָעִיר שָׁקָטָה
  choice: 城里也平静了
  rationale: שׁקט 表示安静、安定、不再受扰；“平静了”既表达骚乱止息，也不额外断言长期和平。
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: 至于亚他利雅
  rationale: 带直接宾语标记的人名被前置，形成话题转换和轻微强调；“至于”在现代汉语中可自然体现这一结构。
- source_word: הֵמִיתוּ בַחֶרֶב
  choice: 众人用刀杀死了她
  rationale: המית 是 מות 的使役式，意为使之死、杀死；“用刀杀死”保留使役含义和 בַחֶרֶב 所指的器具，又避免将其过度解释为正式司法处决。
- source_word: בֵּית מלך
  choice: 地点就在王宫
  rationale: 该无介词地点短语字面为“王的家”；在王室语境中“王宫”是自然对等表达，而“地点就在”明确其通常所表达的地点关系。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“全国民众”避免古奥的“地上的众民”；“至于”保留原文宾语前置带来的话题强调。脚注标记置于其实际说明的末尾地点短语之后。
