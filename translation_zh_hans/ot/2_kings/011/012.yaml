base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: zh_hans
  text: 于是，耶何耶大领王子出来，把冠冕戴在他头上，又把那见证[a]交给他；他们立他为王，膏立他，又拍手说：“愿王万岁！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“约的文书”或“法令”。希伯来文作“那见证”，可能指与君王统治有关的书面凭证。
    reason: 保留 הָעֵדוּת 的基本语义及其在登基语境中具体所指的不确定性，不在正文断定其为某种特定文书。
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: 领……出来
  rationale: 使役形表示使人出来；“领……出来”在此自然地保留主动带出的含义。
- source_word: בֶּן־הַמֶּלֶךְ
  choice: 王子
  rationale: 原文直译为“王的儿子”；上下文特指合法继承人，现代汉语用“王子”简洁自然。
- source_word: הַנֵּזֶר
  choice: 冠冕
  rationale: 此词在王室语境中指象征王权的冠冕；该译法庄重且为普通读者所熟悉。
- source_word: הָעֵדוּת
  choice: 法定见证
  rationale: 原词基本义为“见证、证言”，在登基场景中似指与王权及其义务相关的书面凭证；加“法定”提示其制度性，却不将其确定为某一种具体文书。
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: 众人立他为王
  rationale: מלך 的使役形表示使某人成为王；“立他为王”准确而自然，也避免与戴冠冕重复。
- source_word: וַיִּמְשָׁחֻהוּ
  choice: 膏立他
  rationale: 保留以膏油施行王室就职礼的动作及正式意味；“膏立”比单说“膏他”更符合现代汉语。
- source_word: וַיַּכּוּ כָף
  choice: 拍手欢呼
  rationale: 该习语字面为击掌，在这里是公开拥立时的喝彩；“拍手欢呼”自然呈现动作及语境功能。
- source_word: יְחִי הַמֶּלֶךְ
  choice: 愿王万岁！
  rationale: 这是祝愿式的拥戴呼声；“愿王万岁”在现代汉语中庄重、自然，并保留祝愿语气。
theological_decisions:
- issue: 登基场景中 הָעֵדוּת 的含义
  choice: 正文译作“法定见证”
  alternative: “见证”“约书”“法令”
  rationale: 原词本身只明确表达“见证”之意，语境则暗示它可能是规定君王责任的书面文件。正文避免武断认定为某一种文书，脚注保留主要可能性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为明确本节单数主语，按上下文补出“耶何耶大”；其余参与仪式者用“众人”。脚注标记已在正文对应位置出现。
