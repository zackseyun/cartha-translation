base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: zh_hans
  text: 于是他们抓住她[a]；她沿着王宫的马匹入口通道走去，就在那里被处死。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“把手放在她身上”，即把她拿住。也有译本将这个短语理解为“给她让路”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: 他们抓住她
  rationale: 这个短语直译为“把手放在她身上”，在此处语境中表示将亚她利雅拿住。“抓住”用现代汉语自然表达拘捕之意，同时不采用缺乏明确形态标记的“给她让路”这一理解。
- source_word: וַתָּבֹא
  choice: 她……进了
  rationale: בוא可依叙事视角译为“来”或“去、进入”。这里描述她从圣殿区域移向王宫，译作“进了”自然；动词本身是主动形式，因此不译作“她被带到”。
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: 沿着马匹入口的通道
  rationale: דֶּרֶךְ表示道路、路径或经由之处，מְבוֹא הַסּוּסִים直指“马匹的入口”。合译为“沿着马匹入口的通道”，既保留路径含义，也避免无根据地把入口具体化为某一道门。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的家/房屋”，在此指王室宫殿范围。现代汉语以“王宫”准确、自然地传达所指。
- source_word: וַתּוּמַת
  choice: 被处死
  rationale: מות的Hophal形式具有使役被动意义，即“被使之死”。结合拘捕和执行命令的语境，“被处死”比单纯的“死了”更准确。
- source_word: שָׁם
  choice: 在那里
  rationale: 保留原文明确的地点副词，指出处死发生之处。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“抓住”清楚表达拘捕动作；“马匹入口的通道”保留原文较具体但位置不完全确定的表述；以分号呈现连续行动，并用“就”自然衔接最终结果。
