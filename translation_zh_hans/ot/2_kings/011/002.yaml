source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: zh_hans
  text: 但约兰王的女儿、亚哈谢的姐妹约示巴，把亚哈谢的儿子约阿施从正在被杀的王子中偷偷带走，又把他和他的乳母[a]带进卧房[b]。他们[c]把他藏起来，躲过亚她利雅，使他没有被杀。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乳母”指给幼儿哺乳的女子。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“床铺的房间”，也可译作“寝室”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来语动词是复数：“他们把他藏起来。”具体包括哪些人，原文没有明说。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: 把……带走
  rationale: לקח是常见的叙事动词；结合后续“偷偷带走”，用“把……带走”符合现代汉语表达，又不过度解释动作。
- source_word: יְהוֹשֶׁבַע
  choice: 约示巴
  rationale: 按《列王纪》中该名字的希伯来语形式音译，并与常用中文圣经人名保持可辨识性。
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: 约兰王的女儿
  rationale: 忠实表达结构链所指的亲属关系和王室身份，语序自然。
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: 亚哈谢的妹妹
  rationale: אֲחוֹת通常指亲生或家族意义上的姐妹；中文因相关人物性别和约示巴身份明确，采用自然的“妹妹”，不弱化为“亲属”。
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: 把……偷偷带走
  rationale: גנב本义与“偷”有关；这里是秘密救走孩子，“偷偷带走”既保留隐秘性，也避免现代汉语“偷孩子”可能产生的错误犯罪色彩。
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: 从……王子中
  rationale: בְּנֵי הַמֶּלֶךְ直译为“王的儿子们”；在中文王室语境中，“王子”简洁自然，并未添加超出原文的爵位含义。
- source_word: הַמּוּמָתִים
  choice: 正在被杀的
  rationale: מות的使役被动分词表示这些王子正遭人杀害；“正在被杀”保留过程性和被动意义。
- source_word: מֵינִקְתּוֹ
  choice: 他的乳母
  rationale: 该词特指给幼儿哺乳的女子；“乳母”比泛称“保姆”更准确，也属现代读者可理解的庄重用语。
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: 带进卧房
  rationale: 字面为“在床铺的房间里”；按动作语境用“带进卧房”，自然表达目的地，字面形式留在脚注。
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: 他们把他藏起来
  rationale: 马所拉文本的动词是第三人称阳性复数，译作“他们”以保留原文数的形式，不擅自改成单数。
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: 躲过亚她利雅
  rationale: מִפְּנֵי在此表示使孩子避开亚她利雅的视线和威胁；“躲过”符合中文隐匿语境。
- source_word: וְלֹא הוּמָת
  choice: 使他没有被杀
  rationale: 保留מות使役被动式的受害意义，并在中文中明确这是藏匿行动所产生的结果。
theological_decisions:
- issue: 是否为协调家谱资料而弱化约示巴与亚哈谢的关系
  choice: 保留“亚哈谢的妹妹”
  alternative: 译为“亚哈谢的亲属”
  rationale: 原文使用通常表示姐妹的אֲחוֹת；翻译不引入经文本身未要求的协调方案。
- issue: “把他藏起来”的主语数
  choice: 按马所拉文本译为复数“他们”
  alternative: 依上下文顺译为单数“她”
  rationale: 原文动词明确为复数。复数所包括的具体人物未完全明说，译文保留这一张力，不把主语限定为约示巴一人。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。人名使用现代中文圣经读者较熟悉的形式。以“偷偷带走”传达גנב的隐秘行动，以“乳母”准确保留古代育儿角色；同时借脚注说明卧房用语的字面形式及复数主语。
