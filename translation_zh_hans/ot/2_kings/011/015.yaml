  text: וַ/יְצַו֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י ה/מיאות פְּקֻדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הוֹצִ֤יאוּ אֹתָ/הּ֙ אֶל מִ/בֵּ֣ית לַ/שְּׂדֵרֹ֔ת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ הָמֵ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן אַל תּוּמַ֖ת בֵּ֥ית יְהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: zh_hans
  text: 于是，祭司耶何耶大吩咐那些奉派管理军队的百夫长，说：“把她带出去，带到队列之间[a]；凡跟随她的，都要用刀杀死。”因为祭司曾说：“不可在耶和华的殿里杀死她。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句希伯来文较难；也可理解为“带到队列外面”或“带到两列队伍之间”。大意是把她带离圣殿范围，并在排列好的军队队列处或经由其间带走。
    reason: 保留אֶל מִבֵּית לַשְּׂדֵרוֹת在介词关系、空间指向及“队列”具体所指上的文本歧义。
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: 百夫长
  rationale: 这是犹大军政语境中统领百人的军官称号；“百夫长”简洁自然，不在正文中引入罗马背景。
- source_word: פְּקֻדֵי הַחַיִל
  choice: 那些统领军队的
  rationale: פקד的被动分词在此表示被委派管理军队的人；译文保留其受任统领的行政和军事含义。
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: 把她从殿里带到
  rationale: 使役式命令表示把她带出去；结合后面的难解短语，明确她要被带离圣殿内部。
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: 从殿里带到卫兵的队列中间
  rationale: 马所拉文本的介词组合和句法较难，可能指从殿内带出，经由或进入排列整齐的卫兵队列；正文采用最符合军事现场的理解，并以脚注保留歧义。
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: 凡跟随她的
  rationale: 带冠词的单数分词具有泛指作用，指任何跟随或追随她的人。
- source_word: הָמֵת בֶּחָרֶב
  choice: 都要用刀杀死
  rationale: 绝对不定式在命令语境中表达强烈的处死命令；现代汉语用“都要……杀死”清楚传达其力度。
- source_word: אַל תּוּמַת
  choice: 不可……杀死她
  rationale: 被动未完成式配否定词表达禁令；汉语主动表达更自然，同时不改变受事对象。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בַּיִת在此指圣殿；译作“殿”比字面的“家”更符合现代汉语宗教建筑语境。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，将专名与“主”这一称号区别开来。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名而非称号；中文正文保留为专名。“耶和华”在现代中文圣经传统中辨识度最高，同时不把神名改译成“主”。
- issue: 跟随亚他利雅者的范围
  choice: 凡跟随她的
  alternative: 凡在她后面进来的
  rationale: אַחֲרֶיהָ既可描述空间上的跟随，也可含支持、追随之意；正文采用不限定动机的“跟随”，保留两者之间的张力。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“百夫长”作为古代近东军官称号使用；“卫兵”由上下文补明队列的军事性质。正文避免过度解释难解的方位短语，并用脚注呈现主要译法。
