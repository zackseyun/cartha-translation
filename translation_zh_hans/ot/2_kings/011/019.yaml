  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: zh_hans
  text: 于是，耶何耶大带着百夫长、迦利人[a]、侍卫[b]和这地所有的百姓。他们领王从雅威的殿下来，经过侍卫门进入王宫；王就坐在列王的宝座上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦利人”所对应的希伯来词含义不确定；也可译作“基利提人”或“护卫队”。
    reason: alternative_reading
  - marker: b
    text: “侍卫”原文直译为“奔跑者”，在王室中可能是护卫或传令人员；“侍卫门”中的称呼与此相同。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 于是，耶何耶大带着
  rationale: 希伯来文动词为单数，主语承接上文的耶何耶大；“带着”既保留“取、带”的基本意义，也自然表达他召集并带领这些人。
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: 百夫长
  rationale: 指统领百人的军官。“百夫长”在现代中文圣经语体中简明易懂，并不在此特指罗马军制。
- source_word: הַכָּרִי
  choice: 迦利人
  rationale: 该词所指不确定；正文采用音译，避免断定其族属或职能，其他可能见脚注[a]。
- source_word: הָרָצִים
  choice: 侍卫
  rationale: 字面为“奔跑者”，在王室语境中很可能指担任护卫或传令职责的人员。正文采用较自然的职能译法，并以脚注[b]保留字面意义及另一可能。
- source_word: כָּל עַם הָאָרֶץ
  choice: 这地所有的百姓
  rationale: 保留“地上的百姓”这一有特定历史语境但范围未完全确定的表达，不把它限定为平民阶层或武断扩大为全国每一个人。
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: 他们领王……下来
  rationale: 复数动词表明前述众人共同执行行动；“下来”保留从圣殿区域往王宫去的方向感。
- source_word: מִבֵּית יְהוָה
  choice: 从雅威的殿
  rationale: “殿”在此自然指圣殿；雅威直接音译神名יְהוָה，而不以称号替代。
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: 经过侍卫门
  rationale: 将该门按所属群体译作“侍卫门”，与前文同一词保持一致；字面信息见脚注[b]。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 希伯来文直译为“王的房屋”，在现代汉语中“王宫”最准确自然，也清楚区别于雅威的殿。
- source_word: וַיֵּשֶׁב עַל כִּסֵּא הַמְּלָכִים
  choice: 王就坐在列王的宝座上
  rationale: 保留动词单数与“列王”这一复数形式，呈现王朝传承和正式登基的语感，不将其简化为一般的“王位”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用“雅威”保留其专名性质；“主”会以称号替代专名，“耶和华”则是另一传统音译。
- issue: “列王的宝座”的王朝含义
  choice: 保留复数，译作“列王的宝座”
  alternative: 王位；王家的宝座
  rationale: 原文מְלָכִים为复数，可能突出犹大历代君王相承的宝座。正文不替原文明确其神学或王朝含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。以分号区分护送过程和登基动作；对两个不确定的王室人员称谓分别用音译和自然职能词处理，并用脚注保留原文的不确定性。
