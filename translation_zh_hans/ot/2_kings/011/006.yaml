base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/006.yaml
  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: zh_hans
  text: 三分之一要守在苏珥门，三分之一要守在奔跑者[a]后面的门；你们要严密守卫这座房屋，以防有人闯入[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “奔跑者”原文直译如此；在王室语境中，也可能指王室的传令人员或近卫人员。
    reason: lexical_alternative
  - marker: b
    text: “以防有人闯入”所译的希伯来语词含义不确定；也可能指“作为屏障”或“为防守”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: 三分之一
  rationale: 带冠词的阴性序数词在本段按分组使用，指三队中的一队；译作“三分之一”自然且准确。
- source_word: בְּשַׁעַר סוּר
  choice: 在苏珥门
  rationale: שַׁעַר意为“门”，סוּר在此最可能是专名，故音译为“苏珥”。
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: 在护卫兵后面的门
  rationale: אַחַר保留“在……后面”的空间关系；הָרָצִים字面为“奔跑者”，在王室语境中可指执行传令或护卫职责的人。正文采用自然的职能称谓，字面含义收入脚注。
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: 你们要把守
  rationale: 动词שמר与同根名词משמרת连用，强调警戒和守卫；“要把守”在现代汉语中简洁地传达这一强调。
- source_word: הַבַּיִת
  choice: 这殿宇
  rationale: בַּיִת基本义为“房屋、殿宇”，语境可能涉及王宫或圣殿范围；“殿宇”避免明确限定为其中之一，同时符合叙事场景和庄重语体。
- source_word: מַסָּח
  choice: 严防有人闯入
  rationale: 这是罕见且含义不确定的词；在此似乎说明把守的目的，即形成防护、阻止进入。正文采用自然的目的表达，并以脚注保留不确定性和其他可能译法。
theological_decisions: []
