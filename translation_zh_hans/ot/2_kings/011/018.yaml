id: 2KI.11.18
reference: 2 Kings 11:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: zh_hans
  text: 于是，国中所有的民众都到巴力庙去，将庙拆毁[a]；又把巴力的祭坛和神像彻底砸碎[b]，并在祭坛前杀了巴力的祭司玛坦。随后，祭司为雅威的殿委派了督管人员。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴力庙”原文直译为“巴力的房屋”。
    reason: lexical_alternative
  - marker: b
    text: “神像”也可译作“雕像”或“偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: 国中所有的民众
  rationale: 这是《列王纪》中常见的政治—社会用语；译文保留“国中”的范围，也避免把它过度限定为某一社会阶层。
- source_word: בֵּית הַבַּעַל
  choice: 巴力庙
  rationale: 字面为“巴力的房屋”，但在此明确指敬拜巴力的庙宇；现代汉语用“庙”自然清楚，脚注保留字面形式。
- source_word: וַיִּתְּצֻהוּ
  choice: 将庙拆毁
  rationale: 该动词表示拆下、摧毁建筑；“拆毁”准确而自然。
- source_word: מִזְבְּחֹתָיו
  choice: 巴力的祭坛
  rationale: 原文为阳性单数所属后缀，可指巴力；汉语明确重复“巴力”，避免“他的”指代不清。
- source_word: צְלָמָיו
  choice: 神像
  rationale: צֶלֶם 可指形像、雕像；在祭祀语境中“神像”自然，又不像“偶像”那样预先加入价值判断。
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: 彻底砸碎
  rationale: 动词与强化副词合用，表达完全击碎；“彻底砸碎”兼顾力度与完整性。
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: 巴力的祭司玛坦
  rationale: 直接呈现人名及其宗教职分，符合现代汉语语序。
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: 在祭坛前
  rationale: 保留 לִפְנֵי 的空间含义，不将其泛化为“在祭坛那里”。
- source_word: פְּקֻדּוֹת
  choice: 督管人员
  rationale: 该词可指职务、监管安排或受命监管者；此处在动词“委派”之后，按人员理解最顺畅，同时“督管人员”比单称“监督”更明确。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת 在宗教建筑语境中译作“殿”庄重自然；神名按辅音文本所指译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通常的复原读音，并避免用称号替代专名。
- issue: צְלָמָיו 是否译为带贬义的“偶像”
  choice: 神像
  alternative: 偶像；雕像
  rationale: 原词本身主要表示形像或雕像。上下文已清楚表明其属于巴力崇拜，故不必在词汇层面额外加入评价，以保留原文措辞的宽度。
- issue: פְּקֻדּוֹת 指人员还是职务安排
  choice: 督管人员
  alternative: 职务；守卫；监管安排
  rationale: 原词存在语义弹性；与“委派”及圣殿管理语境结合，指受命负责监管的人最符合上下文，但其他理解仍有词典依据。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“庙”用于巴力的敬拜场所，“殿”用于雅威的圣殿，符合汉语习惯；不以这种措辞差异添加原文之外的建筑等级判断。句法按希伯来文行动顺序推进，并用“随后”标示最后一项管理安排。
