  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: zh_hans
  text: 他在耶和华的殿里与她同在，藏匿了六年；亚她利雅统治这地。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִתְחַבֵּא
  choice: 藏
  rationale: 希伯来语为反身分词，表示约阿施持续躲藏；译作“藏”自然简洁，并保留主动躲避的意味，而非改译为被动的“被藏起来”。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: “殿”符合此处圣所语境；以现代中文常用的“耶和华”表达四字神名。
- source_word: מֹלֶכֶת
  choice: 统治着
  rationale: 女性单数分词表示亚她利雅当时持续掌权；“统治着”既体现进行状态，也不额外加入合法王权的判断。
- source_word: הָאָרֶץ
  choice: 这地
  rationale: 此处指相关国土或地域；译作“这地”保留原词的范围弹性，不擅自限定为“犹大国”。
theological_decisions:
- issue: 亚她利雅掌权的性质
  choice: 统治着这地
  alternative: 作这地的王
  rationale: 原文只陈述她在执掌统治，没有使用“王”这一名词；采用中性表达，避免对其王权合法性作出原文未明说的判断。
- issue: 约阿施藏匿状态的语态
  choice: 藏在
  alternative: 被藏在
  rationale: מִתְחַבֵּא 是反身形式，较直接地描写主体处于躲藏状态；不改成被动，以免把前文人物的保护行动强加进本节语法。
translation_notes:
  register: 采用简洁、庄重而自然的现代标准汉语。分号呈现两个同时延续的情形：约阿施在圣殿藏匿六年，而亚她利雅在境内掌权。代词“她”承接上文人物，保留原文的篇章衔接。
