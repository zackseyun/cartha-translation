  text: וּ/שְׁתֵּ֤י הַ/יָּדוֹת֙ בָּ/כֶ֔ם כֹּ֖ל יֹצְאֵ֣י הַ/שַּׁבָּ֑ת וְ/שָֽׁמְר֛וּ אֶת מִשְׁמֶ֥רֶת בֵּית יְהוָ֖ה אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: zh_hans
  text: 你们中间的两队人[a]，就是所有在安息日下值的人[b]，都要为王守卫耶和华的殿[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“你们中间的两只手”；这里的“手”很可能指“两队”或“两组”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“所有在安息日出去的”。按上下文，这很可能指在安息日换班时下值的人。
    reason: alternative_reading
  - marker: c
    text: 也可较直译为“要看守耶和华殿的警戒职责，向着王／为着王”。原文介词的含义较难确定；按上下文，守卫耶和华的殿是为了保护王。
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת
  choice: 两队人
  rationale: 原文直译为“两只手”或“两边”；在此守卫编组的语境中，יָד 指一个分队或一组人。“两队人”既清楚又符合上下文。
- source_word: בָּכֶם
  choice: 你们中间的
  rationale: 该介词短语表明这两队属于受话者或由他们当中组成；译作“你们中间的”自然明确。
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: 所有在安息日下值的
  rationale: 字面是“所有在安息日出去的”。结合前后文安息日换班的安排，此处指结束当班、离开岗位的人；“下值”保留守卫值勤的语境。
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: 都要……守卫
  rationale: 动词 שׁמר 与同根名词 מִשְׁמֶרֶת 连用，表示承担警戒、守卫之责。汉语合译为“守卫”，避免生硬重复，并保留命令语气。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: 原文是“耶和华的家”。此处明确指圣殿，现代汉语用“殿”自然庄重，也不会误解为普通住宅。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语读者熟悉的音译“耶和华”呈现四字神名，不用称号代替专名。
- source_word: אֶל הַמֶּלֶךְ
  choice: 为王
  rationale: 介词 אֶל 在此结构中的确切关系较难确定。结合保护约阿施的叙事语境，“为王”可自然表达守卫圣殿是为了王的安全，同时以脚注保留原文可能的方向性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用现代中文圣经传统中最广为人知的“耶和华”，将其作为专名呈现，而非以“主”等称号替代。
- issue: אֶל הַמֶּלֶךְ 所表达的守卫对象或目的
  choice: 为王守卫耶和华的殿
  alternative: 朝向王守住耶和华殿的警戒岗位
  rationale: 上下文的行动旨在保护幼王约阿施，但原文介词 אֶל 具有难以完全确定的方向或关联含义。正文采用合乎语境的受益、目的表达，脚注则保留语义张力。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“下值”简洁表达守卫换班语境；“殿”明确指圣殿。正文不强行展开希伯来语“手”的组织含义和介词 אֶל 的歧义，而用脚注如实说明。
