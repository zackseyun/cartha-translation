  text: וְ/הִקַּפְתֶּ֨ם עַל הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/שְּׂדֵר֖וֹת יוּמָ֑ת וִ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/צֵאת֥/וֹ וּ/בְ/בֹאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: zh_hans
  text: 你们要围在王四周，各人手持兵器。凡进入行列的，都要被处死。[a]王出入时，你们要陪伴在他身边。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“凡进入这些行列的。”希伯来语所用的词可能指卫兵排列成的行列。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译：“在他出去和进来的时候。”这是指在王的一切行动中都随行保护他。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  choice: 你们要在王的四周环绕护卫
  rationale: 该结构表达在王周围形成包围圈；结合军事保护的上下文，以“环绕护卫”自然传达其保护目的，同时保留“四周”的空间含义。
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: 各人手里拿着兵器
  rationale: אִישׁ在此为逐一分配用法；כְּלִי虽可泛指器具或装备，但在卫兵奉命护王的语境中指兵器最为合适。
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: 凡进入卫队行列的
  rationale: 带冠词的分词泛指任何这样做的人；שְׂדֵרוֹת指排列成行的队列，语境中即卫兵的警戒行列。
- source_word: יוּמָת
  choice: 都要被处死
  rationale: Hophal形态表达使其死亡的被动含义；“被处死”保留命令所具有的正式处罚意味。
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: 你们都要跟随他
  rationale: 此处继续前面的命令，היה与אֶת搭配表示与王同在、随行；“跟随他”在王出入的语境中自然表达贴身陪同。
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: 王出入时
  rationale: 直译为“在他出去和进来的时候”；汉语“出入时”简洁保留这一成对表达，并适合描述王的一切行动。
