base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: zh_hans
  text: 亚她利雅听见卫兵[a]和民众的喧嚷声[b]，就到耶和华的殿[c]里，来到民众那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“奔跑的人”；这里很可能指王室卫队或护卫人员。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“声音”或“呼喊声”。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“耶和华的家”；这里指圣殿区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: 听见
  rationale: שׁמע在此叙事链中表示听觉上的感知，并非刻意听从或倾听；“听见”准确自然。
- source_word: עֲתַלְיָה
  choice: 亚她利雅
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: קוֹל
  choice: 喧嚷声
  rationale: קוֹל可指声音、嗓音或响声；本节场景涉及卫兵和聚集的民众，用“喧嚷声”可自然表达多人发出的嘈杂声响，同时脚注保留较宽泛的可能译法。
- source_word: הָרָצִין
  choice: 卫兵
  rationale: 该词源自“奔跑”，字面可指“奔跑的人”；在王室语境中常指随侍君王、执行任务的护卫人员。正文采用现代读者易懂的功能性译法，脚注保留直译。
- source_word: הָעָם
  choice: 民众
  rationale: עָם通常指“人民、百姓”；此处是聚集在圣殿中的人群。“民众”既保留群体含义，也符合现代叙事语体。
- source_word: וַתָּבֹא אֶל הָעָם
  choice: 便来到……民众那里
  rationale: בוא אֶל表示来到或前往某人那里；“来到……那里”保留了移动目标，并符合中文叙事习惯。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: בֵּית字面为“家、房屋”，在此明确指敬拜场所，即圣殿；正文用简洁自然的“耶和华殿”，脚注说明字面形式。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用现代中文圣经读者最熟悉的专名“耶和华”，不将其泛化为称号；同时承认“雅威”更接近学界常见的拟音，而“上主”反映犹太诵读传统。
translation_notes:
  register: 采用自然、庄重而清楚的现代标准汉语。“便来到耶和华殿里的民众那里”保持原文的移动目标与地点关系；脚注依次交代“奔跑的人”、קוֹל的语义范围以及“耶和华的家”的字面表达。
