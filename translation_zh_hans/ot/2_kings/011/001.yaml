base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: zh_hans
  text: 亚哈谢的母亲亚他利雅见儿子死了，就起来除灭了王室所有的后裔[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“王国的一切种子”，即王室血脉或王室后裔。
    reason: 说明 זֶרַע 的字面意象及其在王朝语境中的含义。
lexical_decisions:
- source_word: וַעֲתַלְיָה
  choice: 亚她利雅
  rationale: 按现代中文圣经人名惯例音译；句首的叙事连接词不另译为“现在”，以免加入原文没有的显式时间含义。
- source_word: אֵם אֲחַזְיָהוּ
  choice: 亚哈谢的母亲
  rationale: 准确表达附属结构所说明的亲属关系，并以自然中文作为“亚她利雅”的同位说明。
- source_word: וַתַּרְא כִּי מֵת בְּנָהּ
  choice: 见自己的儿子死了
  rationale: “见……死了”保留 ראה 加 כִּי 所表达的事实认知，也自然传达 מֵת 的完成或结果状态。
- source_word: וַתָּקָם
  choice: 就起来
  rationale: קום 在叙事中引出果断行动；“就”自然表达前因后果及行动承接，“起来”保留原词意象。
- source_word: וַתְּאַבֵּד
  choice: 除灭
  rationale: 使役形在此表示使之灭亡；“除灭”保持庄重，并不额外限定具体杀害方式。
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: 王室所有的后裔
  rationale: זֶרַע 字面为“种子”，在王朝语境中指后代；“王室所有的后裔”清楚传达王位继承谱系，同时保留“所有”的范围。
theological_decisions:
- issue: “王国的种子”所指范围
  choice: 译作“王室所有的后裔”，保留其王朝血脉的整体指向。
  alternative: 所有可能继承王位的人／所有王子
  rationale: 原文没有明确限于男性或实际继承人；不应在正文中缩窄其范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“除灭”比“杀死”更贴近希伯来文的宽泛表达；脚注保留“种子”的原文意象。
