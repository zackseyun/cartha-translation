base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/005.yaml
  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
translation:
  language: zh_hans
  text: 他吩咐他们说：“你们要这样做：你们中在安息日进班的三分之一，要看守王宫[a]；”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译“王的房屋”；在此语境中可指王宫。
    reason: 保留 בֵּית הַמֶּלֶךְ 的字面表达，并将“王宫”说明为合乎语境的理解，而非排除其他字面可能。
lexical_decisions:
- source_word: וַיְצַוֵּם
  choice: 他吩咐他们
  rationale: צוה 的强调词干表示带权威地命令或吩咐；“吩咐”符合现代汉语历史叙事的庄重语体。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留希伯来语引出直接引语的常用公式，同时使汉语自然。
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: 你们要这样做
  rationale: 以自然汉语表达“这是你们所要做的事”，并保留命令语境中的指令力度。
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: 你们中……的三分之一
  rationale: 准确表达群体中的三分之一，并按汉语习惯把相关修饰语置于分数前。
- source_word: בָּאֵי הַשַּׁבָּת
  choice: 在安息日进班的
  rationale: 这里指在安息日轮班交接时前来值勤的人；“进班”比单纯“来到”更清楚地传达值勤语境，又未过度展开。
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: 要守卫
  rationale: 该结构表示承担警戒、守卫职责；“要守卫”简洁保留指令作用。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋/王的家”，在本段守卫部署的语境中指王宫；正文采用自然明确的现代汉语，脚注保留字面形式。
