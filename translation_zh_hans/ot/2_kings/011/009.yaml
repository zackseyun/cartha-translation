base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: zh_hans
  text: 百夫长们完全照祭司耶何耶大所吩咐的去做。各人都带着自己的部下[a]，就是安息日来当班的和安息日下班的，一同来到祭司耶何耶大那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“各人都带着自己的人，就是安息日进来的和安息日出去的。”希伯来文可以这样较直译；上下文表明，这里很可能是指来接班和下班的两班人员。
    reason: 保留希伯来文“进来／出去”的字面表达，以及其在轮班语境中的可能含义。
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: 百夫长们
  rationale: 这是古代军事编制中统领百人的长官；“百夫长”是简明、自然且为现代中文读者熟悉的对应表达。
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: 完全照……所吩咐的
  rationale: 既表达遵照命令，也保留“全都、无一遗漏”的全面意味。
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: 各人都带着自己的部下
  rationale: “各人”体现分配性的单数用法，所指是每一位百夫长；“部下”自然表达归其统领的人员。
- source_word: בָּאֵי הַשַּׁבָּת
  choice: 安息日来当班的
  rationale: 字面为“安息日进来的”，上下文指轮班进入岗位的人；正文采用自然的职务语境表达，并以脚注保留较字面的译法。
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: 安息日下班的
  rationale: 与“来当班的”形成对应，指交班离岗的一组；正文译出语境所示功能，同时不把这一解释说成唯一可能。
- source_word: עִם
  choice: 和……一同
  rationale: 清楚表明当班与下班的两组人员一起被带来。
- source_word: וַיָּבֹאוּ אֶל
  choice: 来到……那里
  rationale: 自然传达叙事中的趋向动作，即众人到耶何耶大面前集合。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 直接、准确地保留耶何耶大的职分称谓。
