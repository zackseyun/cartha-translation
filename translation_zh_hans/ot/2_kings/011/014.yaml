base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: zh_hans
  text: 她一看，只见王照着惯例站在柱旁[a]，王身边有众长官和号角；全国的百姓都欢庆，吹响号角。亚他利雅就撕裂衣服，喊道：“阴谋！阴谋！”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在柱上”或“在柱前”。这里的希伯来介词可表达不止一种位置关系。
    reason: lexical_alternative
  - marker: b
    text: 或译：“谋反！谋反！”或“叛乱！叛乱！”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: 她一看，只见
  rationale: 以自然的现代汉语重现叙事中突然看见眼前景象的效果；“只见”保留 הִנֵּה 的指示和戏剧性。
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: 王……站在
  rationale: 分词描绘当时正在持续的姿态；汉语在“一看，只见”的场景框架中无需另加进行标记。
- source_word: עַל הָעַמּוּד
  choice: 在柱旁
  rationale: עַל 在此可表示与礼仪性柱子相邻的位置；正文采用自然且符合场景的“柱旁”，脚注保留“柱前”等位置理解。
- source_word: כַּמִּשְׁפָּט
  choice: 照着惯例
  rationale: 此处 מִשְׁפָּט 指既定的王室礼仪或惯常做法，并非司法审判。
- source_word: וְהַשָּׂרִים
  choice: 众长官
  rationale: שָׂרִים 泛指有地位的官员或领袖；“长官”不武断限定其具体军衔。
- source_word: וְהַחֲצֹצְרוֹת
  choice: 号筒
  rationale: 希伯来文直接使用乐器名词，而非明确写“吹号的人”；因此保留为“号筒”，不把潜在的转喻解释写入正文。
- source_word: אֶל הַמֶּלֶךְ
  choice: 在王身边
  rationale: אֶל 在此按位置关系理解，表示长官和号筒在王附近、随侍于王。
- source_word: כָל עַם הָאָרֶץ
  choice: 国中众民
  rationale: 保留“这地的民”这一集体称谓，同时采用较自然、庄重的现代汉语。
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: 欢喜快乐，吹响号筒
  rationale: 表达群众正在公开庆贺并吹奏号筒的场面；集合名词在汉语中自然搭配复数性动作。
- source_word: וַתִּקְרַע ... אֶת בְּגָדֶיהָ
  choice: 撕裂衣服
  rationale: 准确表达因震惊和哀愤而撕衣的动作，措辞清楚庄重。
- source_word: קֶשֶׁר קָשֶׁר
  choice: 谋反！谋反！
  rationale: קֶשֶׁר 可指密谋、叛乱或反叛；在王权被夺的语境中“谋反”自然有力，同时脚注保留“阴谋”的词义可能。
