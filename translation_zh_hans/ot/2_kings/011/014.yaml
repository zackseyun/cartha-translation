- from: 她一看，只见王照着惯例站在柱旁[a]，众长官和号筒都在王身边；国中众民欢喜快乐，吹响号筒。亚他利雅就撕裂衣服，喊道：“谋反！谋反！”[b]
  to: 她一看，只见王照着惯例站在柱旁[a]，王身边有众长官和号角；全国的百姓都欢庆，吹响号角。亚他利雅就撕裂衣服，喊道：“阴谋！阴谋！”[b]
  rationale: 修订仅改善现代汉语的自然度，并更谨慎地保留原文词义范围：改写号角所在句的语序而不将乐器明确改作号手；以“欢庆”避免同义重复；将קֶשֶׁר译作“阴谋”，并用脚注保留其在政变语境中的“谋反／叛乱”含义。脚注a补足“在柱上”这一直接的介词可能性。
