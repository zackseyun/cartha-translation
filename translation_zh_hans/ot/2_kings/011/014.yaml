translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“她一看，只见”传达突见场景的张力；保留“号筒”这一原文中的乐器名词，不擅自改成“号手”；呼喊采用简短重复句式，以保持原文的急迫感。
