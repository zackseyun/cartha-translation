  terminology: “王”“长官”“照着惯例”“撕裂衣服”均合适。将“号筒”统一为较常用的“号角”。“阴谋！阴谋！”对应重复的קֶשֶׁר，脚注说明“谋反”的语境化译法，避免在正文中预先限定为实际叛乱。
