  text: וַ/יִּתֵּ֨ן הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י ה/מאיות אֶֽת הַ/חֲנִית֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑ד אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: zh_hans
  text: 于是，祭司把耶和华殿里那些曾属于大卫王的长矛[a]和盾牌交给百夫长们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作单数“长矛”；这里可能是集合用法，指多支长矛。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 于是……交给
  rationale: 叙事性连续式推动事件发展；“于是”自然表达先后承接，“交给”准确呈现给予并转交器械的动作。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 按带定冠词的单数名词直译；上下文已确定其身份，汉语无需另加指示语。
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: 给百夫长们
  rationale: 该短语指统领百人单位的军官。“百夫长”简洁、通行，并以“们”反映复数。
- source_word: הַחֲנִית
  choice: 枪
  rationale: 原文形态为单数，但在此可作集合名词，指分发给多位百夫长的枪械；汉语“枪”本身可表达集合意义，既保留形式上的含混，也符合语境。
- source_word: הַשְּׁלָטִים
  choice: 盾牌
  rationale: 此复数词在王室或圣殿武备语境中最可能指盾牌；不采用证据较弱的“箭袋”或泛化的“武器”。
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: 那些曾属于大卫王的
  rationale: 关系结构表达所有关系；“曾属于”自然说明这些器械属于历史上的大卫王而后存放于殿内。
- source_word: בְּבֵית יְהוָה
  choice: 耶和华殿里
  rationale: בֵּית יְהוָה直义为“耶和华的家／殿”；在本处指圣殿，正文用“殿”最清楚自然，同时直接音译神名。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”呈现四字神名，不用称号“主”替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文明确使用四字神名。中文正文保留专名而非改作“主”；“耶和华”在现代汉语圣经传统中辨识度高。
- issue: הַחֲנִית 是单数还是集合用法
  choice: 正文译“枪”，让汉语可作集合理解，并加注说明
  alternative: 枪矛／一杆枪
  rationale: 希伯来语形式为单数，而分发对象为多位百夫长，且与复数“盾牌”并列，集合解释很可能；但不把这种语境推断绝对化。
translation_notes:
  register: 采用现代、庄重而自然的叙事体。“耶和华殿里”比“耶和华的家里”更清楚地指圣殿；句序略作汉语化，将地点短语放入修饰武器的结构中。所有脚注标记均已置于正文。
