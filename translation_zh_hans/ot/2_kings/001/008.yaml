  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: zh_hans
  text: 他们对他说：“那人毛发浓密[a]，腰间束着皮制腰带。”他说：“他是提斯比人以利亚。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那人穿着毛制的衣服。”希伯来语字面为“毛发的主人”，既可形容那人毛发浓密，也可能指他穿着毛制的衣服。
    reason: 保留בַּעַל שֵׂעָר在外貌描写与服饰描写之间的词义歧义。
lexical_decisions:
- source_word: אִישׁ בַּעַל שֵׂעָר
  choice: 那人浑身多毛
  rationale: אִישׁ指成年男子；בַּעַל שֵׂעָר直译为“有毛发的人”，可自然理解为体毛浓密。译文用现代汉语表达这一较直接的理解，同时以脚注保留服饰方面的可能解释。
- source_word: וְאֵזוֹר עוֹר אָזוּר בְּמָתְנָיו
  choice: 腰间束着皮带
  rationale: אֵזוֹר是腰带，עוֹר说明材质为皮革；אָזוּר表示束上或系着，בְּמָתְנָיו指腰胯部。“腰间束着皮带”简洁、自然，并保留原文的材质和穿戴方式。
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: 提斯比人以利亚
  rationale: 按现代中文圣经人名惯例音译专名，并将族属或籍贯称谓הַתִּשְׁבִּי译为“提斯比人”。
- source_word: הוּא
  choice: 那是
  rationale: 此处代词用于根据描述确认人物身份；“那是提斯比人以利亚”符合现代汉语辨认某人的自然说法。
