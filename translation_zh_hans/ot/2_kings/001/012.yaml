id: 2KI.1.12
reference: 2 Kings 1:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֣עַן אֵלִיָּה֮ וַ/יְדַבֵּ֣ר אֲלֵי/הֶם֒ אִם אִ֤ישׁ הָֽ/אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ אֱלֹהִים֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: zh_hans
  text: 以利亚回答他们说：“我若是神人[a]，愿火从天上降下来，烧灭你和你那五十人[b]！”于是，神的火[c]从天上降下来，烧灭了他和他那五十人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “神人”也可理解为“那位神人”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“你的五十”，指这位五十夫长所率领的五十人。
    reason: cultural_note
  - marker: c
    text: “神的火”也可译作“从神那里降下的火”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: 以利亚回答他们说
  rationale: 保留希伯来叙事中“回答……说”的复合引语格式，同时符合现代汉语表达。
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: 我若是神人
  rationale: “神人”是中文圣经语境中简洁而庄重的先知称号；原文作表语，未明确要求译为特指，脚注保留“那位神人”的可能理解。
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: 愿火从天上降下来
  rationale: 未完成式在此具有祈愿或宣告性的语气；“愿”比单纯未来时更能体现以利亚的呼求，又不把它弱化为普通预测。
- source_word: וְתֹאכַל
  choice: 烧灭
  rationale: אכל以火为主语时意为吞噬、烧尽；“烧灭”在现代汉语中自然，并明确表达毁灭性结果。
- source_word: חֲמִשֶּׁיךָ
  choice: 你那五十人
  rationale: 原文直译为“你的五十”，实指百夫长率领的五十人；正文补出“人”以保证普通读者能够立即理解。
- source_word: וַתֵּרֶד אֵשׁ אֱלֹהִים מִן הַשָּׁמַיִם
  choice: 神的火从天上降下来
  rationale: 马所拉文本明确有 אֱלֹהִים。“神的火”直接保留其与神的联系；同时以脚注注明该结构也可理解为火从神而来。
- source_word: וַתֹּאכַל אֹתוֹ וְאֶת חֲמִשָּׁיו
  choice: 烧灭了他和他那五十人
  rationale: 重复前句动词以对应原文，并清楚区分领队“他”与所率的五十人。
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים 的先知称号与特指程度
  choice: 神人
  alternative: 那位神人
  rationale: 该词组是对先知身份的称谓。汉语“神人”保留称号而不额外解释其神学内涵；原句的表语结构对特指程度留有余地，故在脚注中保存另一可能。
- issue: אֵשׁ אֱלֹהִים 中火与神的关系
  choice: 神的火
  alternative: 从神那里降下的火
  rationale: 原文名词结构把火明确归联于神，但可表达所属、来源或性质。正文采用形式较贴近的“神的火”，脚注保留来源性的理解，不进一步界定火的机制或性质。
- issue: 以利亚话语的语气
  choice: 愿火从天上降下来
  alternative: 火必从天上降下来
  rationale: 上下文既可带有祈愿、命令式色彩，也含验证性宣告。选择“愿”保留其呼求性质，避免将其单纯定为预言。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神人”保留传统且简练的先知称号；“愿……降下来”体现原文的祈愿语气；“烧灭”前后一致。所有歧义均以脚注呈现，未在正文中加入宗派性解释。
