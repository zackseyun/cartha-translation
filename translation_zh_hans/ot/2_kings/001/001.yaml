lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: 背叛了
  rationale: פשע 在此政治语境中指附属国反抗宗主国，而非一般性的道德过犯；“背叛”自然表达摩押脱离以色列统治的行动。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: בְּיִשְׂרָאֵל
  choice: 以色列
  rationale: 介词 ב 与 פשע 连用时表示反抗的对象；中文动词“背叛”可直接带宾语，无须另译介词。
- source_word: אַחֲרֵי מוֹת
  choice: 死后
  rationale: 这是表示时间先后的结构；译为“死后”简洁、自然，并准确表达“在……死亡之后”。
- source_word: אַחְאָב
  choice: 亚哈
  rationale: 采用现代中文圣经传统中通行的人名译法。
