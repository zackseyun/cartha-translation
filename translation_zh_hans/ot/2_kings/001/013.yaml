  text: וַ/יָּ֗שָׁב וַ/יִּשְׁלַ֛ח שַׂר חֲמִשִּׁ֥ים שְׁלִשִׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֡עַל וַ/יָּבֹא֩ שַׂר הַ/חֲמִשִּׁ֨ים הַ/שְּׁלִישִׁ֜י וַ/יִּכְרַ֥ע עַל בִּרְכָּ֣י/ו לְ/נֶ֣גֶד אֵלִיָּ֗הוּ וַ/יִּתְחַנֵּ֤ן אֵלָי/ו֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים תִּֽיקַר נָ֣א נַפְשִׁ֗/י וְ/נֶ֨פֶשׁ עֲבָדֶ֥י/ךָֽ אֵ֛לֶּה חֲמִשִּׁ֖ים בְּ/עֵינֶֽי/ךָ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: zh_hans
  text: 王又派出第三位五十夫长和他的五十人[a]。他上去，来到以利亚那里；第三位五十夫长在以利亚面前屈膝跪下，向他恳求说：“神人啊，求你看我的性命和你这五十个仆人的性命为宝贵[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的五十”，指归他统领的五十人。
    reason: 说明希伯来文省略“人”的表达。
  - marker: b
    text: “性命”原文也可译作“生命”或“自身”；希伯来语נֶפֶשׁ可按语境指生命、自身或魂。本处按生命受威胁的语境翻译。
    reason: 保留נפש的词义范围，并说明本处的语境译法。
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: 王又派出
  rationale: וַיָּשָׁב在叙事中表示动作再次发生；中文用“又”自然呈现重复意义。主语按上下文补为“王”，避免代词指向不清。
- source_word: שַׂר חֲמִשִּׁים שְׁלִשִׁים וַחֲמִשָּׁיו
  choice: 第三个五十夫长，带着他的五十人
  rationale: 保留官衔、第三次派遣的次序，以及“他的五十人”；“人”虽为原文隐含成分，却是现代汉语表达人数所必需。
- source_word: וַיַּעַל וַיָּבֹא
  choice: 上到以利亚那里
  rationale: “上去并来到”在中文中显得机械；“上到……那里”兼顾עלה的上行意味与בוא的抵达意义。宾语“以利亚那里”由上下文明确补出。
- source_word: וַיִּכְרַע עַל בִּרְכָּיו לְנֶגֶד אֵלִיָּהוּ
  choice: 屈膝跪在以利亚面前
  rationale: 呈现כרע与“在双膝上”的身体姿态，并保留谦卑、恳求的场景。
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: 向他恳求
  rationale: חנן的Hitpael形式表达迫切求情；“恳求”庄重而自然。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: “神人”是简洁、传统且可理解的先知称号；不将其扩写为带额外解释的称谓。
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: 求你看……为宝贵
  rationale: 保留יקר“宝贵、有价值”的比喻，而不直接意译成“饶命”；实际求生含义由语境自然显明。
- source_word: נַפְשִׁי וְנֶפֶשׁ
  choice: 我的性命和……的性命
  rationale: 在面临死亡的语境中，נפש指人的生命；“性命”比“灵魂”更贴切，也保留恳求时的紧迫感。
- source_word: עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים
  choice: 你这五十个仆人
  rationale: 原文称这些人为以利亚的“仆人”，是五十夫长表示谦卑的说法；不改成解释性的“士兵”。
theological_decisions:
- issue: 生命受威胁语境中נפש的译法
  choice: 性命
  alternative: 灵魂
  rationale: 这里请求的是免于死亡，并非陈述灵魂与身体的教义关系；按语境译作“性命”可避免把后期人论概念带入经文。
- issue: תִּיקַר的请求含义
  choice: 看……为宝贵
  alternative: 饶过／保全
  rationale: 直译保留原文价值判断的意象以及以利亚如何回应的张力，不把实际含义提前化约为“饶命”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“五十夫长”保留圣经历史叙事中已通行的军职称谓；直接引语略带恭敬语气，但避免文言化。所有脚注标记均已置入正文。
