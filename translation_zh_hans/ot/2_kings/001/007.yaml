base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: zh_hans
  text: 于是他问他们[a]：“那上来迎见你们、对你们说这些话的人，是什么样子？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“那人是怎样的人？”“样子”所对应的希伯来词通常可指规例、惯常方式或情形；在这里可能指那人的形貌或可供辨认的特征。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט הָאִישׁ
  choice: 那……的人，是什么样子
  rationale: 该问句询问那人的可辨识特征。结合下一节对衣着和外在形貌的描述，译作“是什么样子”既自然，又保留“形貌、样式、情形”等可能范围。
- source_word: הָאִישׁ
  choice: 那……的人
  rationale: 指使者刚刚遇见的特定人物；汉语用“那……的人”能自然表达定指。
- source_word: עָלָה
  choice: 上来
  rationale: 保留希伯来文动词“上去／上来”的方向意味，并按使者的叙述视角译为“上来”。
- source_word: לִקְרַאתְכֶם
  choice: 迎见你们
  rationale: 准确表达主动走来相遇之意；“迎见”庄重而清楚，也符合圣经叙事语体。
- source_word: וַיְדַבֵּר אֲלֵיכֶם אֶת הַדְּבָרִים הָאֵלֶּה
  choice: 对你们说这些话
  rationale: 以现代汉语自然表达，同时保留“这些话”这一具体的言语指称。
