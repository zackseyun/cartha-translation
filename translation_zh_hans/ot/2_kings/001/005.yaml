base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: zh_hans
  text: 使者们回到他那里，他对他们说：“你们为什么回来了？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: 回到
  rationale: 源自动词שׁוב，在叙事次序中表示回到差遣他们的人那里；“回到”自然地保留了返回的方向。
- source_word: הַמַּלְאָכִים
  choice: 使者们
  rationale: 本段指王所差遣的人，而非天上的使者；“使者”准确表达其传令、受差遣的身份。
- source_word: אֵלָיו
  choice: 他那里
  rationale: 介词表示朝向前文所指的王；与“回到”连用，译作“回到他那里”清楚自然。
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: 他对他们说
  rationale: 保留希伯来语常用叙事动词“说”，不因后接问句而解释性地改译为“问”。
- source_word: מַה זֶּה
  choice: 为什么
  rationale: 字面近于“这是什么”，但在此是追问他们返回原因的惯用表达；现代汉语用“为什么”最能传达其语用功能。
- source_word: שַׁבְתֶּם
  choice: 你们回来了
  rationale: 该词为第二人称阳性复数完成式；“你们”保留复数对象，“回来了”符合当场询问已经发生之事的自然汉语表达。
