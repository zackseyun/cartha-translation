base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: zh_hans
  text: 王又派另一个五十夫长，带着他的五十人到以利亚那里。五十夫长对他说：“神人，王这样说：‘快下来！’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“快下去！”希伯来语动词只表示“下去、下降”；正文译作“下来”，是按山下的王使对上方以利亚说话的视角表达。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: 又派
  rationale: וַיָּשָׁב在此与后续动词连用，表示重复同一行动，并非实际返回；现代汉语以“又派”自然表达。
- source_word: שַׂר חֲמִשִּׁים
  choice: 五十夫长
  rationale: 指统领五十人的军官；“五十夫长”简洁、明确，也适合本段反复出现的军事称谓。
- source_word: וַחֲמִשָּׁיו
  choice: 带着他的五十人
  rationale: 原文直译为“和他的五十人”；按语境用“带着”清楚表达随行关系。
- source_word: וַיַּעַן וַיְדַבֵּר
  choice: 对他说
  rationale: 这是希伯来叙事中常见的复合引语公式；若逐字译作“回答并说”会使现代汉语显得冗赘，而且此处未必是在回答问题。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留以利亚在列王纪中的固定称号，兼顾简洁与经文传统用语。
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: 王这样说
  rationale: 保留使者传达王命的正式公式和权威语气，同时符合现代汉语表达。
- source_word: מְהֵרָה רֵדָה
  choice: 快下来
  rationale: מְהֵרָה表示紧迫，רֵדָה意为下去或下来；从山下说话者的视角译作“下来”最自然。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“五十夫长”和“神人”保留叙事中的固定称谓；王命使用简短直接的措辞，以呈现第二位军官催逼的语气。脚注标记置于整句引语之后，说明“下来／下去”的真实词义歧义。
