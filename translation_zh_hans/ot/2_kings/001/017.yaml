  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: zh_hans
  text: 亚哈谢就死了，正如雅威的话——就是以利亚所说的话。约兰接替他作王，是在犹大王约沙法的儿子约兰在位的第二年，因为亚哈谢没有儿子。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: 亚哈谢就死了
  rationale: 叙事式动词推动情节向前；“就死了”自然承接上文。为避免本节中多个男性人物造成代词所指不清，按上下文明确为亚哈谢。
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: 正如以利亚所说的雅威的话
  rationale: כִּדְבַר 表示事情与先前所说的话相符；关系从句直接说明这话是以利亚所说的，不增添“借着”等原文未明说的关系。
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: 约兰接替他作王
  rationale: מלך 在此叙事语境中指登位，תַּחְתָּיו 表示取代前王；此译兼顾自然中文与继位含义。
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: 那时是……约兰在位第二年
  rationale: 这是王朝纪年的常用表达；补出“在位”使现代中文清楚，同时不改变原文信息。
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: 犹大王约沙法的儿子约兰
  rationale: 按中文习惯重组同位修饰语，清楚区别犹大国的约兰与本节登位的以色列王约兰。
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: 因为亚哈谢没有儿子
  rationale: כִּי 表明继位原因。原文代词按语境指亚哈谢；译出姓名可避免读者误以为指紧邻出现的约兰。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近现今对该名读音的通行重建，并保留其专名性质。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。两位约兰同名，因此用“犹大王约沙法的儿子约兰”加以辨明；末句把代词明确为“亚哈谢”，避免中文歧义。
