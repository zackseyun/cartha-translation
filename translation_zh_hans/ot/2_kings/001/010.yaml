  text: וַ/יַּעֲנֶ֣ה אֵלִיָּ֗הוּ וַ/יְדַבֵּר֮ אֶל שַׂ֣ר הַ/חֲמִשִּׁים֒ וְ/אִם אִ֤ישׁ אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: zh_hans
  text: 以利亚回答五十夫长说：“但我若是神人，愿火从天降下，吞灭你和你的五十人。”于是，火从天降下，吞灭了他和他的五十人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: 五十夫长
  rationale: 指统领五十人的军官；“五十夫长”简洁、庄重，也符合上下文的军事身份。
- source_word: וְאִם
  choice: 但我若是
  rationale: 保留句首连接词 וְ 在回应语境中的转折意味，同时不把条件句解释成怀疑或断言。
- source_word: אִישׁ אֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经对奉神差遣者的固定称谓；采用简洁的传统表达，不扩释为“先知”。
- source_word: תֵּרֶד אֵשׁ מִן־הַשָּׁמַיִם
  choice: 愿火从天降下
  rationale: 未完成式在此表达祈愿或命令意味；“愿”自然传达其语气，又与随后事件的实际发生相区分。
- source_word: וְתֹאכַל
  choice: 吞灭
  rationale: אָכַל 字面为“吃、吞吃”，用于火时表示烧尽、毁灭；“吞灭”既保留意象，也清楚表达结果。
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: 你的五十人 / 他的五十人
  rationale: 这里是集合用法，指其所统领的五十名士兵；补出“人”符合现代汉语。
theological_decisions:
- issue: 条件句“我若是神人”的语气
  choice: 保留为开放形式的条件句“我若是神人”
  alternative: 译作“既然我是神人”或“如果我真是神人”
  rationale: 原文使用 אִם 条件结构，并未明说是假设、反讽还是证实身份的挑战；不额外加入“既然”或“真”来消除其张力。
- issue: 天火的来源与施行者
  choice: 直译为“火从天降下”
  alternative: 明确译成“神使火从天降下”
  rationale: 原文叙述火从天而降，却未在本节明说施行者；译文保留这一叙事表达，不补入解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“五十夫长”“神人”保留经文语域；前后重复“火从天降下，吞灭……”以反映希伯来原文的刻意复现。
