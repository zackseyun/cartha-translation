  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶל אֵ֣לִיָּ֔הוּ רֵ֣ד אוֹת֔/וֹ אַל תִּירָ֖א מִ/פָּנָ֑י/ו וַ/יָּ֛קָם וַ/יֵּ֥רֶד אוֹת֖/וֹ אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: zh_hans
  text: 雅威的使者对以利亚说：“你跟他下去，不要怕他[a]。”于是以利亚起来，跟他下到王那里。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“不要从他面前害怕”，意思是不要因他在场而害怕。
    reason: 说明מִפָּנָיו的字面表达及其在本句中的惯用含义。
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאַךְ的基本含义是“使者”，在本叙事中指奉雅威之命传话的天上使者；译作“使者”既符合上下文，也保留原词本身可指一般使者或天使的语义范围。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以通行的中文音译呈现四字神名，保留经文所用的专名，而不以称号代替。
- source_word: רֵד אֹתוֹ
  choice: 你跟他下去
  rationale: רֵד是“下去”的命令式；此处אֹתוֹ按伴随关系理解，指以利亚要与那位五十夫长一同下去。补出“你”使现代汉语命令句自然清楚。
- source_word: אַל־תִּירָא מִפָּנָיו
  choice: 不要怕他
  rationale: מִפָּנָיו字面涉及“从他面前／因他的临在”，在ירא之后自然表示惧怕的对象或缘由；“不要怕他”简洁地传达语境中的命令，字面意象收入脚注。
- source_word: וַיָּקָם
  choice: 于是以利亚起来
  rationale: 该叙事动词表示起身并随即行动；重述主语以避免现代汉语中的指代含混。
- source_word: וַיֵּרֶד אֹתוֹ אֶל־הַמֶּלֶךְ
  choice: 跟他下到王那里
  rationale: 再次将אֹתוֹ理解为伴随关系，并保留向下移动及目的地“王那里”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；译作“雅威”可在中文中明确呈现其为以色列之神的专名，而不是以称号“主”替代。
- issue: מַלְאַךְ יְהוָה的身份表达
  choice: 雅威的使者
  alternative: 雅威的天使
  rationale: 上下文显示这是传达神命令的超自然使者，但原词מַלְאַךְ本义为“使者”。采用“使者”可避免在正文中加入超出词面的分类，同时不否认其天上身份。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“跟他下去／跟他下到王那里”符合当代口语与书面叙事习惯；“于是”体现连续行动。脚注标记紧随其所解释的“不要怕他”。
