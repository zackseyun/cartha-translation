base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: zh_hans
  text: 因此，雅威[a]如此说：“你所上的那张床，你必不能从上面下来[b]，因为你必定死。”以利亚就走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”音译希伯来文神名יהוה；传统译本常译作“耶和华”或以“上主”等称号表示。
    reason: 说明神名的音译选择。
  - marker: b
    text: 希伯来文直译近于“你所上的那张床，你必不能从那里下来”，刻意以“上”和“下”形成对照。
    reason: 交代原文关系从句及其上下对照。
lexical_decisions:
- source_word: וְלָכֵן
  choice: 因此
  rationale: 表明本句判决是对前文责问所得出的结果；“因此”在现代汉语中清楚而庄重。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信的固定宣告格式，并直接呈现神名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按较可能的读音音译四字神名，避免以称号代替原文专名。
- source_word: הַמִּטָּה
  choice: 那张床
  rationale: מִטָּה通常指床或卧榻；“床”最自然，也不额外加入“病床”等原文未明说的信息。
- source_word: אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: 你既上了那张床，就必不能从床上下来
  rationale: 用现代汉语自然的“上床／从床上下来”保留עלה与ירד之间刻意形成的上下对照；将希伯来语关系从句顺译为汉语的承接结构。
- source_word: כִּי מוֹת תָּמוּת
  choice: 因为你必定死
  rationale: 以“必定”表达不定式绝对形与限定动词连用所加强的确定语气。
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: 以利亚就走了
  rationale: “就”自然推动叙事；“走了”保留הלך的普通含义，不擅自说明目的地或使命内容。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非“主”这一称号；“雅威”是按学界通常重构读音所作的现代汉语音译。
- issue: 死亡宣告的确定程度
  choice: 必定死
  alternative: 将会死
  rationale: 原文מוֹת תָּמוּת是加强结构，明确表达判决的确定性，但不进一步解释死亡的时间或方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“如此说”保留先知宣告公式的正式感；“上了那张床／从床上下来”符合自然汉语，同时保存原文的词语对照。
