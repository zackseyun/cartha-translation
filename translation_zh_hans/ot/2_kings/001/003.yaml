id: 2KI.1.3
reference: 2 Kings 1:3
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: zh_hans
  text: 但耶和华的使者对提斯比人以利亚说：“起来，上去迎见撒玛利亚王的使者，对他们说：‘难道是因为以色列中没有神，你们才去求问以革伦的神巴力·西卜吗？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: 但耶和华的使者
  rationale: 连接词按上下文译为“但”，突出与上一节王所采取行动的转折。מַלְאַךְ既可指“使者”也可指“天使”；“耶和华的使者”保留原词的身份张力，不额外判定其本体。神名直接译作“耶和华”。
- source_word: דִּבֶּר אֶל
  choice: 对……说
  rationale: 符合现代汉语叙事习惯，并准确表达向特定对象发言。
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: 提斯比人以利亚
  rationale: 按现代中文圣经人名惯例音译专名，并以“提斯比人”表达其地域称谓。
- source_word: קוּם עֲלֵה
  choice: 起来，上去
  rationale: 分别保留两个命令语气动词；“上去”保留עלה的方向意味。
- source_word: לִקְרַאת
  choice: 迎见
  rationale: 表达前去与对方相遇，不加入“拦截”或“对抗”等原文未明说的色彩。
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: 撒玛利亚王的使者
  rationale: 此处מַלְאָךְ明确指人的使者；照原文保留“撒玛利亚王”这一称呼。
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: 难道是因为以色列中没有神
  rationale: 以反问形式传达责备语气，同时保留“因为……没有”的希伯来语结构。
- source_word: אַתֶּם הֹלְכִים לִדְרֹשׁ
  choice: 你们才去求问
  rationale: “才”自然连接反问所提出的原因与行动；在神谕语境中，דרש译为“求问”比一般的“寻找”更准确。
- source_word: בַּעַל זְבוּב אֱלֹהֵי עֶקְרוֹן
  choice: 以革伦的神巴力·西卜
  rationale: 保留专名并按中文人名地名惯例音译；属格结构自然译为“以革伦的神”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 以中文读者广泛熟悉的专名“耶和华”直接呈现四字神名，而不以“主”替代。
- issue: מַלְאַךְ יְהוָה的身份
  choice: 耶和华的使者
  alternative: 耶和华的天使
  rationale: “使者”涵盖该希伯来词的基本语义，也避免在译文中预先解决这位使者本体身份的神学问题。
- issue: 反问中אֱלֹהִים的含义
  choice: 神
  alternative: 一位神
  rationale: 此处在以色列语境中指向以色列的神；不加“一位”，避免把反问误读为仅讨论某个不特定神明是否存在。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“起来，上去”两个命令以及原文反问的责备力度；区分叙事中的“耶和华的使者”和王所差遣的“使者”，但不借不同词汇强行界定前者的本体。
