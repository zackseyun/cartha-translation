base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: zh_hans
  text: 王就派一个五十夫长和他手下的五十人到以利亚那里去。五十夫长上到他那里；看哪，以利亚正坐在山顶上[a]。五十夫长对他说：“神人哪，王说[b]：‘下来！’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“山丘顶上”。希伯来语 הַר 可按语境指山或山丘。
    reason: lexical_alternative
  - marker: b
    text: 直译“王已经说了：‘下来！’”。这里采用传令的惯用表达，译作“王说”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 王就派
  rationale: 连续式动词推进叙事，用“就”自然表达事件的承接；根据上下文明确主语为王，避免现代汉语中悬空的“他”造成误解。
- source_word: שַׂר חֲמִשִּׁים
  choice: 一个五十夫长
  rationale: 该词组指统领五十人军队单位的军官；“五十夫长”简洁，并保留古代军事编制的特色。
- source_word: וַחֲמִשָּׁיו
  choice: 带着他手下的五十人
  rationale: 后缀表示隶属于这名军官的一队五十人；补出“手下”和“人”，使现代汉语清楚自然。
- source_word: וַיַּעַל אֵלָיו
  choice: 五十夫长上到他那里
  rationale: עלה表达朝以利亚所在高处向上移动；“上到”保留垂直方向，并补明主语以免歧义。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意、使场景鲜明呈现的叙事语气。
- source_word: יֹשֵׁב
  choice: 正坐着
  rationale: 分词描写当时持续的姿态，“正……着”自然体现进行中的状态。
- source_word: עַל רֹאשׁ הָהָר
  choice: 在山顶上
  rationale: רֹאשׁ表示顶端，הַר可指山或山丘；正文采用涵盖面较广且自然的“山”，脚注说明另一种可能。
- source_word: וַיְדַבֵּר אֵלָיו
  choice: 五十夫长对他说
  rationale: דבר引出直接引语；“对他说”符合现代汉语习惯，并补明说话者。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是对先知的固定称谓；“神人”沿用简洁庄重的汉语圣经用语，不把含义扩展为某一特定职分。
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: 王说
  rationale: 字面为“王已经说了”，在传令公式中用现代汉语“王说”自然引出王的原话，同时不增强为原词没有明说的“命令”。
- source_word: רֵדָה
  choice: 下来
  rationale: 这是ירד的阴性单数命令式；说话者身处下方，要求以利亚到他那里，因此“下来”最符合空间视角。
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים作为称谓的表达
  choice: 神人
  alternative: 属神的人／上帝的人
  rationale: “神人”保留该称谓的简洁与传统辨识度，又不额外界定以利亚的身份或神学职分。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“看哪”刻意保留原文鲜明的场景提示；“五十夫长”保留古代军事称谓。正文中的[a]、[b]均与脚注对应。
