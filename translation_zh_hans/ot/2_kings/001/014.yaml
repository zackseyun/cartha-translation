  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: zh_hans
  text: 看哪，有火从天上降下，烧灭了先前的两位五十夫长和他们各自的五十人。现在，愿我的性命在你眼中蒙看为宝贵！
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留原文引人注意并加强语气的功能；“看哪”庄重而清楚，也符合叙事中的恳求语境。
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: 从天上降下火来
  rationale: 按希伯来语的主语、动作和来源翻译，同时采用自然的现代汉语语序。
- source_word: וַתֹּאכַל
  choice: 烧灭了
  rationale: אָכַל字面为“吃”，但以火为主语时表示吞噬、烧毁；“烧灭”既自然，又准确传达毁灭性的结果。
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: 先前那两个五十夫长
  rationale: “五十夫长”准确体现军事编制；הָרִאשֹׁנִים在上下文中指此前出现的头两个，译作“先前那两个”比“最初的”更自然清楚。
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: 和他们各自的五十人
  rationale: 原文直指隶属他们的“五十”单位。译出“各自的五十人”，既保留人数和编制，也避免汉语“他们的五十”含混难懂。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 标明从回顾先前审判转入当前恳求；汉语凭上下文已能显出转折，无须强加“但是”。
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: 愿我的性命在你眼中看为宝贵
  rationale: יקר表达被看重、视为宝贵；נֶפֶשׁ在求生语境中指“性命”。“在你眼中看为宝贵”保留原文意象和恳求语气。
theological_decisions:
- issue: 求生语境中נֶפֶשׁ的译法
  choice: 性命
  alternative: 灵魂
  rationale: 说话者请求免遭前两队人的结局，焦点是保全生命。“性命”符合此处具体语义，也避免加入原文未要求的身心二分观念。
- issue: 祈愿式תִּיקַר的语气
  choice: 愿……看为宝贵
  alternative: 求你珍惜我的性命
  rationale: 采用“愿”保留希伯来语未完成式在恳求中的祈愿色彩，并保留“在你眼中”的原文表达；替代译法更口语，却增加了较直接的命令色彩。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“五十夫长”沿用读者熟悉的圣经军事称谓；“各自的五十人”说明原文“他们的五十队/五十人编制”的实际所指。末句保留“在你眼中看为宝贵”的希伯来表达，以维持恳求的力度与经文风格。
