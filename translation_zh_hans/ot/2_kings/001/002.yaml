  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: zh_hans
  text: 亚哈谢从他在撒马利亚的楼上房间的窗格子摔了下来，便病倒了。他派使者，对他们说：“你们去求问以革伦的神巴力·西卜[a]，看我能不能从这场病中活下来。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴力·西卜”是这一名称的希伯来语形式；较晚的希腊语形式通常作“别西卜”。
    reason: 说明原文名称与较熟悉的后期名称之间的关系。
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: 穿过窗格子
  rationale: בְּעַד与שְׂבָכָה在这里描写从有格子的开口穿过；“穿过窗格子”保留具体画面，也比笼统的“从窗户”更贴近原文。
- source_word: עֲלִיָּתוֹ
  choice: 他……楼上的房间
  rationale: עֲלִיָּה指楼上的房间或楼房；此译法是自然的现代汉语，并明确这是亚哈谢所在的上层房间。
- source_word: וַיָּחַל
  choice: 就病倒了
  rationale: 该动词表示患病；上下文说明这是坠落之后发生的结果，但原词本身没有明确限定为外伤，因此不译作“受了伤”。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 叙事中指王所派遣的人，不是天使；“使者”准确保留受差派者的身份。
- source_word: דִרְשׁוּ
  choice: 求问
  rationale: דרשׁ在这里指向神明寻求指示或神谕；“求问”保留宗教咨询的含义。
- source_word: בַּעַל זְבוּב
  choice: 巴力·西卜
  rationale: 按希伯来文本的名称形式音译，并用间隔号显示复合名称的两个成分；不以较晚的希腊语形式取代原文。
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: 以革伦的神
  rationale: 该构造短语直接表明巴力·西卜是以革伦所敬奉的神明。
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: 看我能不能从这场病中活下来
  rationale: 原文直指“是否会活下来”，不仅是一般意义的康复；此译法保留生死未定的语义力度，并以“能不能”自然表达间接问句。
- source_word: וַיִּפֹּל
  choice: 摔了下去
  rationale: 动词意为坠落；结合从楼上穿过窗格坠下的场景，“摔了下去”符合现代汉语叙事。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用该地名通行的现代中文圣经音译。
theological_decisions:
- issue: 异教神名的形式
  choice: 巴力·西卜
  alternative: 别西卜
  rationale: 希伯来文本写作בַּעַל זְבוּב，正文据此音译；“别西卜”反映较晚的希腊语形式，保留在脚注中供读者辨识，不用它覆盖原文形式。
- issue: 王所问的是康复还是存活
  choice: 能不能从这场病中活下来
  alternative: 这病能不能好
  rationale: אֶחְיֶה的核心意义是“我会活”，原文使康复与生死相连。正文保留这一较强且具有神学张力的说法，不将其弱化为单纯“病好”。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。叙事连接简洁，不添加原文没有的“那时”等时间标记；将脚注标记置于其实际说明的神名之后。
