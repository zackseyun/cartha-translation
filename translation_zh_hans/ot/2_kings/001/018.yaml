base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 亚哈谢其余所行的事，岂不记载在[a]《以色列诸王的年代记》[b]中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记载”也可译作“写”；希伯来文直译为“写着”，这是列王纪总结君王生平时常用的档案套语。
    reason: lexical_alternative
  - marker: b
    text: 《以色列诸王的年代记》指《列王纪》所引用的一部以色列王室编年史料，不一定是圣经中的《历代志》。
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲחַזְיָהוּ
  choice: 亚哈谢其余所行的事
  rationale: יֶתֶר表示“其余、剩下的”；דִּבְרֵי在列王纪的王朝总结套语中指君王的事迹，而非仅指言语。中文用“其余所行的事”既自然，又保留总结性表达。句首וְ在此承接上下文，不必机械译作“又”或“现在”。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所行的事
  rationale: 关系从句说明亚哈谢做过的事；合并入“其余所行的事”，避免生硬重复，同时完整传达原意。
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: 不都写在……上吗
  rationale: הֲלוֹא引出预期肯定回答的反问；כְתוּבִים本义为“写下的”。“不都……吗”保留原文反问语气。
- source_word: עַל סֵפֶר
  choice: 写在……上
  rationale: עַל与סֵפֶר构成书写于卷册的表达；中文“写在……上”既贴近原文，又符合档案记述语境。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王记》
  rationale: דִּבְרֵי הַיָּמִים在此指按时日编录的王室史料或编年记录；采用简洁、熟悉的中文书名，并以脚注说明其史料性质，避免与圣经中的《历代志》混同。
