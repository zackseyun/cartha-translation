source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: zh_hans
  text: 他对他说：“耶和华如此说：‘你派遣使者去求问以革伦的神巴力·西卜[a]，难道是因为以色列中没有上帝，以致你要去求问他的谕示[b]吗？所以，你所登上的床[c]，你必不能从上面下来；你必定死。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“巴力·西卜”；后来的传统中也见相关形式“巴力·西布勒”。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“求问他的话”；可能指向上帝寻求信息或神谕。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“你在那里上去的那张床”。原文的“在那里”在关系从句中有回指作用，正文未另行直译。
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: 他对他说
  rationale: 按原文保留第三人称代词及“说话”的基本意义，不在正文中补明所指人物。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传信公式的庄重语序，并将四字神名译为通行的“耶和华”。
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: 你派遣使者
  rationale: 此处 מַלְאָכִים 指受差派的人，而非天使；“使者”准确保留其角色。
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: 求问……巴力·西卜
  rationale: דרש 在这里指向神明寻求信息或谕示；“求问”简洁地保留宗教咨询意味。
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: 以革伦的神
  rationale: 直接表达原文所属关系，说明巴力·西卜是以革伦所敬奉的神明。
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: 难道是因为以色列中没有上帝
  rationale: 保留原文带责问意味的反问，并以单数称谓指以色列的上帝。
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: 可以求问他的话
  rationale: 保留原文明确出现的“他的话”，不将其径直改写成“求问他”，由脚注说明这里可能指神的消息或谕示。
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: 你所上去的那张床，你必不能从上面下来
  rationale: 保留“上去／下来”的对应关系及床被前置强调的句法，同时用现代汉语可理解的表达呈现。
- source_word: כִּי מוֹת תָּמוּת
  choice: 你必定死
  rationale: 以“必定”表达希伯来语不定式绝对式加强语气的确定性。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；正文采用现代中文圣经读者最熟悉且庄重的专名“耶和华”，不以“主”代替专名。
- issue: 反问句中 אֱלֹהִים 的所指
  choice: 上帝
  alternative: 神
  rationale: 此处不是泛指某位神明，而是责备王越过以色列的上帝去求问外邦神；“上帝”清楚表达其单数特指，同时不消除反问的力度。
- issue: בִּדְבָרוֹ 中“他的话”的含义
  choice: 正文保留“他的话”
  alternative: 求问他／求取他的谕示
  rationale: 原文明确含有 דָבָר（话、信息、事情），其具体所指可能是神谕或神所赐的信息；正文不替原文消解这一语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知宣告公式、反问责备、床的前置强调以及“上去／下来”的原文意象；避免把“他的话”过度解释为某一种特定启示形式。
