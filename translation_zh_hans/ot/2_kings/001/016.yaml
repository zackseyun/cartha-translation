revisions:
- from: 他对他说：“耶和华如此说：‘你派遣使者去求问以革伦的神巴力·西卜[a]，难道是因为以色列中没有上帝，可以求问他的话[b]吗？所以，你所上去的那张床[c]，你必不能从上面下来；你必定死。’”
  to: 他对他说：“耶和华如此说：‘你派遣使者去求问以革伦的神巴力·西卜[a]，难道是因为以色列中没有上帝，以致你要去求问他的谕示[b]吗？所以，你所登上的床[c]，你必不能从上面下来；你必定死。’”
  rationale: 修订仅处理汉语中“求问他的话”的句法歧义，并以“谕示”自然表达原文所指的神圣信息；脚注保留字面“话”及可能的“信息或神谕”，避免过度释义。另以“所登上的床”改善现代庄重汉语的流畅度，同时维持原文的床前置及“上去／下来”意象。
