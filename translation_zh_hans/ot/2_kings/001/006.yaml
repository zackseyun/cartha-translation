source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: zh_hans
  text: 他们对他说：“有一个人上来迎着我们，对我们说：‘你们去，回到差你们来的王那里，对他说：“雅威如此说：‘难道以色列没有上帝，你才派人去求问以革伦的神巴力·西卜吗？[a] 因此，你上去的那张床，你必不能从上面下来[b]，因为你必定死。’”’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“难道是因为以色列没有上帝，你才派人去求问……吗？”
    reason: 原文的介词结构可在汉语中显明译作原因关系；正文以较简洁的反问表达同一责问。
  - marker: b
    text: 直译：“你上去的那张床，你必不从上面下来。”
    reason: 原文在关系从句中带有方位副词，并以“上”与“下”构成鲜明对照；正文保留这一对照，同时使汉语句法更自然。
lexical_decisions:
- source_word: אִישׁ
  choice: 一个人
  rationale: 使者尚未认出或说出以利亚的名字；“一个人”保留叙事视角及阳性单数表达。
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: 上来迎着我们
  rationale: 保留עָלָה的上行含义，同时用现代汉语自然表达朝他们而来的动作。
- source_word: לְכוּ שׁוּבוּ
  choice: 你们去，回到
  rationale: 保留两个并列命令，而不将其合并为单一的“回去”。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信公式，并将四字神名按其专名音译为“雅威”。
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: 难道以色列没有上帝
  rationale: 以自然汉语传达原文带责问意味的反问，同时不把反问改写成直陈判断。
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: 派人去求问
  rationale: 这里的דרש指向神明寻求神谕或指示；“求问”保留宗教咨询的语义。
- source_word: בַּעַל זְבוּב
  choice: 巴力·西卜
  rationale: 作为神名采用音译，并以间隔号清楚呈现复合名称。
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: 以革伦的神
  rationale: 准确表达附属关系，即巴力·西卜是与以革伦相关的神明。
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  choice: 你所上的那张床
  rationale: 在汉语可理解的范围内保留“上床”的动作，并与下文“下不来”形成原文的上下对照。
- source_word: מוֹת תָּמוּת
  choice: 你必定死
  rationale: 以“必定”表达希伯来语同根不定式与限定动词组合所加强的确定语气。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留其专名性质，不以称号替代。
- issue: 反问是否暗示以色列实际没有上帝
  choice: 保留为责问性的反问
  alternative: 改写为“以色列明明有上帝”
  rationale: 原文以反问谴责王求问外邦神，并未采用直陈句；译文保留其修辞力度与表层形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。多层引语以中文单双引号区分；“雅威如此说”保留先知宣告的正式语气。正文刻意保留“上……下不来”的措辞呼应。
