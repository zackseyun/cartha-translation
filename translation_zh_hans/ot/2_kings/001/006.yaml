- from: 他们对他说：“有一个人上来迎着我们，对我们说：‘你们去，回到差你们来的王那里，对他说：“雅威如此说：‘难道以色列没有上帝，你才派人去求问以革伦的神巴力·西卜吗？[a] 因此，你所上的那张床，必下不来了[b]，因为你必定死。’”’”
  to: 他们对他说：“有一个人上来迎着我们，对我们说：‘你们去，回到差你们来的王那里，对他说：“雅威如此说：‘难道以色列没有上帝，你才派人去求问以革伦的神巴力·西卜吗？[a] 因此，你上去的那张床，你必不能从上面下来[b]，因为你必定死。’”’”
  rationale: 仅修订床榻预言的汉语表达及其对应脚注。修订保留希伯来文“上去”与“下来”的对照、否定预言和死亡确定性，避免把“不能下来”误解为单纯身体能力不足，也不改变段落含义或神学表述。
