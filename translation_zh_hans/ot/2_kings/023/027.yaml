source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: zh_hans
  text: 耶和华说：“我也必将犹大从我面前除去，正如我除去以色列一样；我必弃绝[a]我所拣选的这城——耶路撒冷，以及我曾说‘我的名必在那里’的那殿[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我已经弃绝”。希伯来语动词的形式可表示已经完成的行动；正文依据上下文的审判宣告译为将来意义。
    reason: alternative_reading
  - marker: b
    text: 原文直译为“那房屋”，这里指耶路撒冷的圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经中广为人知的专名译法，明确表达以色列上帝的立约之名，而不以“主”代替。
- source_word: אָסִיר / הֲסִרֹתִי（סור，Hiphil）
  choice: 除去 / 除去
  rationale: 使役形表达使之离开、移除；“除去”既自然，也保留犹大与以色列之间的平行。
- source_word: מֵעַל פָּנַי
  choice: 从我面前
  rationale: 保留希伯来语“从我面前”的具体意象及其关系性含义，避免过度解释为单纯空间意义的“离开我的同在”。
- source_word: גַּם
  choice: 也
  rationale: 表明犹大将遭遇与以色列相应的结局。
- source_word: כַּאֲשֶׁר
  choice: 正如……一样
  rationale: 清楚呈现犹大被除去与以色列先前被除去之间的比较。
- source_word: וּמָאַסְתִּי
  choice: 我也必弃绝
  rationale: מָאַס表示拒绝、弃绝；在审判宣告的语境中采用将来指向的“必弃绝”，并以脚注保留完成式的另一种理解。
- source_word: הָעִיר הַזֹּאת אֲשֶׁר בָּחַרְתִּי אֶת יְרוּשָׁלִַם
  choice: 我所拣选的这城——耶路撒冷
  rationale: 将“耶路撒冷”作为“这城”的同位说明，以破折号自然呈现原文结构。
- source_word: הַבַּיִת
  choice: 那殿
  rationale: 字面为“那房屋”，此处明确指耶路撒冷的圣殿；“那殿”在现代中文中自然清楚，同时脚注注明原文字面表达。
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: 我的名必在那里
  rationale: 直接保留“我的名”与“在那里”的措辞，不把“名”的神学意涵扩写成上帝本体居住。
theological_decisions:
- issue: וּמָאַסְתִּי在审判宣告中的时态意义
  choice: 译作将来指向的“我也必弃绝”
  alternative: “我也已经弃绝”
  rationale: 该动词形态是完成式，但上下文以“我也必将犹大……除去”宣告将临的审判。正文采用将来意义以保持话语连贯，同时用脚注保留完成式读法，不抹平原文的时态张力。
- issue: הַבַּיִת的所指与译法
  choice: 正文译作“那殿”
  alternative: “那房屋”
  rationale: 原词字面意为“房屋”，在此是耶路撒冷圣殿的常用称呼。现代中文以“殿”表达所指更自然明确；脚注保存字面措辞及其圣殿所指。
- issue: “我的名必在那里”的神学表达
  choice: 按原文保留“名”与“在那里”
  alternative: 解释性译为“我必住在那里”
  rationale: 原文谈的是上帝的名，而非直接说上帝居住；直译可保留申命记—列王纪传统中“名”的独特神学张力，避免把含义预先解释为某一种临在观。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“从我面前除去”保留原文意象；“必”体现审判宣告的确定性。破折号标明“耶路撒冷”是“这城”的同位说明。脚注标记均紧接相关词语。
