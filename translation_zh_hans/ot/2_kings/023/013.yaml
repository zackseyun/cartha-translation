  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: zh_hans
  text: 王又玷污了耶路撒冷前面的那些丘坛[a]，就是在毁灭山右边、以色列王所罗门为西顿人的可憎之物亚斯她录、摩押的可憎之物基抹，以及亚扪人的可憎之物米勒公[c]所建造的丘坛[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶路撒冷前面”也可按地理方位理解为“耶路撒冷东面”。
    reason: lexical_alternative
  - marker: b
    text: “右边”在希伯来语的方位观念中可能指“南边”。“毁灭山”可能是后来称为橄榄山的山地；“毁灭”也可译作“败坏”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文本作“米勒公”；这一神祇有时被人与“摩洛”联系起来。
    reason: alternative_reading
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: 该词指用于祭祀的高处或敬拜场所。“丘坛”保留其地势与宗教用途，是现代中文圣经语境中简洁而明确的表达。
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: 耶路撒冷前面
  rationale: 按希伯来语保留“在……面前／对面”的空间表述，不在正文中径直限定为“东面”；可能的地理含义以脚注说明。
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: 在毁灭山的右边
  rationale: מִימִין直指右手边或右侧。正文保留原文方向表达，而将可能表示“南边”的理解列入脚注。
- source_word: הַר הַמַּשְׁחִית
  choice: 毁灭山
  rationale: 直译其带贬斥色彩的名称，不以“橄榄山”替换，也不消除原文的神学修辞。
- source_word: עַשְׁתֹּרֶת
  choice: 亚斯她录
  rationale: 作为神祇专名音译，采用中文圣经传统中通行且可辨识的形式。
- source_word: שִׁקֻּץ
  choice: 可憎的神
  rationale: 该词是对偶像或异教神祇的强烈贬称。结合本句所列专名，译为“可憎的神”既自然，也保留谴责语气；“神”由上下文所指补明。
- source_word: כְמוֹשׁ
  choice: 基抹
  rationale: 音译摩押神祇的专名，采用通行中文形式。
- source_word: מִלְכֹּם
  choice: 米勒公
  rationale: 马所拉文本读作Milcom，正文据此音译，不与摩洛混同。
- source_word: תּוֹעֲבַת
  choice: 可憎的神
  rationale: 保留该词强烈的宗教谴责意味，并在中文中与前两个平行短语协调。
- source_word: טִמֵּא
  choice: 玷污
  rationale: 此处指王使非法祭祀场所成为不洁、不能继续用于敬拜。“玷污”简洁地保留礼仪和宗教层面的含义。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文只称“王”，上下文虽表明是约西亚，正文仍保留原文称谓。
theological_decisions:
- issue: 如何翻译对外族神祇的贬斥称呼 שִׁקּוּץ 与 תּוֹעֵבָה
  choice: 译作“可憎的神”
  alternative: 可憎之物；令人厌恶的偶像
  rationale: 原文有意采用强烈的谴责性称呼，不宜中性化为单纯的“神”。在明确列举神祇专名的语境中，“可憎的神”兼顾中文自然度与原文的神学批判。
- issue: 毁灭山的地理身份
  choice: 正文译作“毁灭山”
  alternative: 败坏山；橄榄山
  rationale: 原文使用带贬义的名称。正文翻译该名称，而不以推测的地理身份代替，以保存原文措辞及其对偶像崇拜的批判。
- issue: 米勒公与摩洛的关系
  choice: 正文按马所拉文本译“米勒公”
  alternative: 摩洛
  rationale: 本节希伯来文本明确为מִלְכֹּם。可能的历史或名称关联不应取代正文读法，故仅在脚注中提示。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。保留“丘坛”“玷污”等具有必要宗教含义且在中文中可理解的词；通过分号和并列结构化解希伯来语长句，同时维持三个神祇及其贬称的平行关系。所有脚注标记均置于其所说明的词句之后。
