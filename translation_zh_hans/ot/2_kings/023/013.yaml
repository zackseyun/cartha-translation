revisions:
- from: 王又玷污了耶路撒冷前面的那些丘坛[a]；它们在毁灭山的右边[b]，是以色列王所罗门为西顿人可憎的神亚斯她录、摩押可憎的神基抹和亚扪人可憎的神米勒公[c]建造的。
  to: 王又玷污了耶路撒冷前面的那些丘坛[a]，就是在毁灭山右边、以色列王所罗门为西顿人的可憎之物亚斯她录、摩押的可憎之物基抹，以及亚扪人的可憎之物米勒公[c]所建造的丘坛[b]。
  rationale: 修订将三个平行的贬斥称谓译为“某民族的可憎之物”，保留原文的名词性、论战性措辞，并消除“某民族所憎恶的神”这一可能误读。为使汉语句法连贯，将位置和所罗门建造行为整合为“丘坛”的连续定语；末尾重提“丘坛”以避免悬垂修饰。脚注a移至“耶路撒冷前面”之后，脚注b置于全句所说明的地点与名称之后，脚注c仍紧接“米勒公”。
