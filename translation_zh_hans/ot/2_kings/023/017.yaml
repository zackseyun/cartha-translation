  text: וַ/יֹּ֕אמֶר מָ֚ה הַ/צִּיּ֣וּן הַלָּ֔ז אֲשֶׁ֖ר אֲנִ֣י רֹאֶ֑ה וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אַנְשֵׁ֣י הָ/עִ֗יר הַ/קֶּ֤בֶר אִישׁ הָֽ/אֱלֹהִים֙ אֲשֶׁר בָּ֣א מִֽ/יהוּדָ֔ה וַ/יִּקְרָ֗א אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר עָשִׂ֔יתָ עַ֖ל הַ/מִּזְבַּ֥ח בֵּֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: zh_hans
  text: 他问：“我看见的那座碑[a]是什么？”城里的人回答他：“那是从犹大来的神人的坟墓；他曾宣告你对伯特利祭坛[b]所做的这些事。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “碑”也可译作“标记”“纪念碑”或“墓碑”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“对”也可译作“攻击”或“反对”；这句话回指那位神人先前针对这祭坛所作的先知性宣告（参王上13:1–2）。
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: 碑
  rationale: 该词指用来标示或纪念的可见标记；本处与坟墓相关。译作“碑”自然简洁，又不强行断定其具体形制。
- source_word: הַלָּז
  choice: 那座
  rationale: 这是指示可见物体的表达；现代汉语中以“那座碑”最自然，并与后面的“我看见的”相配。
- source_word: אֲנִי רֹאֶה
  choice: 我看见的
  rationale: 希伯来语分词表达眼前正在看见的情形；汉语定语结构简洁自然。
- source_word: הַקֶּבֶר
  choice: 坟墓
  rationale: 指有标记的埋葬之处；“坟墓”是庄重且通行的现代汉语表达。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留希伯来语固定称号，不将其解释性缩窄为“先知”。
- source_word: מִיהוּדָה
  choice: 从犹大来的
  rationale: 准确表达来源地，并符合现代汉语叙述习惯。
- source_word: וַיִּקְרָא
  choice: 宣告
  rationale: 此处回指那位神人针对祭坛所作的公开、先知性宣告；“宣告”传达其郑重性，又不增添原文没有的内容。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些事
  rationale: 既可涵盖所说的话，也可指所预告而如今发生的事情，保留原文语义宽度。
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: 你……所做的
  rationale: 直接对应第二人称完成式，并以自然汉语指向约西亚刚刚实施的行动。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 对……祭坛
  rationale: 介词在此可表达针对或反对。正文采用较自然且略具开放性的“对”，脚注说明也可理解为“攻击”。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用该地名在现代中文圣经传统中的通行译名。
theological_decisions:
- issue: 本节所回顾之言语的先知性质
  choice: 以“宣告”表达 וַיִּקְרָא，保留其公开而郑重的先知性发言
  alternative: 呼喊；大声宣告
  rationale: 本节回指列王纪上13章针对伯特利祭坛的预言；“宣告”足以呈现其先知性质，却不把前文细节扩写进本节。
- issue: עַל 与祭坛之间的关系
  choice: 译作“对伯特利祭坛所做的这些事”
  alternative: 在伯特利祭坛上所做的这些事；攻击伯特利祭坛所做的这些事
  rationale: 上下文含敌对和毁坏之意，但介词本身也可表达一般的针对关系；正文避免过度限定，脚注保留“攻击”的解释可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神人”保留原文称号；“碑”和“坟墓”清楚呈现可见标记与墓葬地点的关系。所有脚注标记均已置于正文相应位置。
