  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: zh_hans
  text: 至于犹大诸王在亚哈斯上层房间[a]的屋顶上所造的祭坛，以及玛拿西在雅威殿的两个院子里所造的祭坛，王都拆毁了，又把它们砸碎[b]，把它们的尘土抛进汲沦谷[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上层房间”也可译作“上层建筑”。希伯来语 עֲלִיָּה 可指楼上的房间、内室或上层建筑。
    reason: lexical_alternative
  - marker: b
    text: 此处的希伯来语动词及“从那里”的短语含义有争议。译文按上下文理解为把祭坛砸碎；也有人把该动词理解为“离开”或“跑”。
    reason: textual_ambiguity
  - marker: c
    text: “汲沦谷”也可译作“汲沦溪”或“汲沦河谷”。希伯来语 נַחַל 可指溪流、溪床、峡谷或河谷。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: 祭坛
  rationale: מִזְבֵּחַ通常指用于献祭的坛；两处复数在汉语中由“所造的祭坛”按语境自然表达。
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: 在亚哈斯楼房的屋顶上
  rationale: עֲלִיָּה指楼上的房间或楼房；译文保留屋顶与上层建筑之间的空间关系，并用脚注说明另一种理解。
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: 在雅威殿的两个院子里
  rationale: חָצֵר指院子或庭院；בֵּית יְהוָה在此指圣殿，译作“雅威殿”既自然简洁，也保留神名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，避免用称号代替原文的专名。
- source_word: נָתַץ
  choice: 拆毁
  rationale: 该动词常指拆除、毁坏建筑物或设施，“拆毁”符合祭坛这一对象。
- source_word: וַיָּרָץ מִשָּׁם
  choice: 又在那里把它们砸碎
  rationale: 上下文紧接着提到祭坛的尘土，故按与“压碎、砸碎”相关的理解翻译；该短语的词形和介词也容许不同分析，因此以脚注保留异译。
- source_word: עֲפָרָם
  choice: 其尘土
  rationale: עָפָר本义为尘土；这里描写祭坛被粉碎后的细碎残余，保留原文形象。
- source_word: נַחַל קִדְרוֹן
  choice: 汲沦谷
  rationale: נַחַל可指溪流、干河床或谷地；此处采用现代读者较易识别的地名表达，并在脚注中保留其他地貌含义。
- source_word: וְאֶת ... וְאֶת
  choice: 至于……以及……，王都……
  rationale: 用“至于”呈现两个前置直接宾语形成的话题结构，以“都”清楚显示主要动词同时支配两组祭坛。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的四字神名；“雅威”以专名形式呈现，不以称号替代，也不在经文中加入原文没有的神学解释。
- issue: וַיָּרָץ מִשָּׁם 的理解
  choice: 又在那里把它们砸碎
  alternative: 把它们从那里拆下来；随后从那里离开
  rationale: “砸碎”最符合随后“尘土”的叙事进程，但希伯来语形式和 מִשָּׁם（从那里／在那里）存在解释难点，故不把此处包装成毫无争议的读法，而用脚注保存替代方案。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“雅威殿”比逐字译作“雅威的房屋”更符合现代汉语，同时准确指向圣殿；“两个院子里”保持原文复数。句首“至于”重现希伯来语前置宾语的强调结构。
