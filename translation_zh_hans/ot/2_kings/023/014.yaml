  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: zh_hans
  text: 他打碎柱像，砍倒亚舍拉崇拜物[a]，又用人骨填满它们原来所在的地方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚舍拉木柱”。希伯来语词אֲשֵׁרִים可指与亚舍拉有关的崇拜物；仅凭这个词无法确定其具体形状。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: 打碎
  rationale: 该动词表示将物件破坏、碎裂；“打碎”自然地传达强力毁坏的动作。
- source_word: הַמַּצֵּבוֹת
  choice: 柱像
  rationale: מַצֵּבָה在此指用于宗教崇拜的立石或石柱。“柱像”简洁，并能体现其礼仪用途，而不额外加入“神圣”等评价性措辞。
- source_word: וַיִּכְרֹת
  choice: 砍倒
  rationale: כרת用于木质物件时可指砍伐、砍倒；此处与亚舍拉崇拜物搭配，“砍倒”符合具体动作。
- source_word: הָאֲשֵׁרִים
  choice: 亚舍拉崇拜物
  rationale: 该复数词指与亚舍拉有关的崇拜物，但词本身没有明确说明其具体形状。“亚舍拉崇拜物”保留这种不确定性；脚注列出较具体的传统译法。
- source_word: וַיְמַלֵּא
  choice: 填满
  rationale: 该动词的基本义是“使充满、填满”；这里描述用人骨填充这些崇拜物原来所在之处。
- source_word: מְקוֹמָם
  choice: 它们原来所在的地方
  rationale: 第三人称复数后缀回指前述被毁的崇拜设施。此译法在现代汉语中清楚自然，也保留回指关系。
- source_word: עַצְמוֹת אָדָם
  choice: 人骨
  rationale: אָדָם在这里泛指人类，并非特指男性。“人骨”是简洁、自然且性别准确的现代汉语表达。
theological_decisions:
- issue: אָדָם在עַצְמוֹת אָדָם中的所指
  choice: 人骨
  alternative: 男人的骨头
  rationale: 上下文泛指人的骨骸，并无成年男性这一限定；“人骨”准确保留其类属意义。
- issue: הָאֲשֵׁרִים所指崇拜物的具体形态
  choice: 亚舍拉崇拜物
  alternative: 亚舍拉木柱
  rationale: 希伯来词表明这些物件与亚舍拉有关，却未单独限定为木柱、树木或某种特定造型，因此正文不将具体形态定死，并以脚注提供传统译法。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“又”体现连续叙事动作；“它们原来所在的地方”明确表达希伯来语复数所属后缀的回指。脚注标记紧随“亚舍拉崇拜物”，与其解释对象一致。
