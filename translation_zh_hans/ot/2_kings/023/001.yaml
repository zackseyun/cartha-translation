  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: zh_hans
  text: 于是，王派人召集犹大和耶路撒冷的众长老；他们都聚集到王那里。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人传召
  rationale: שׁלח本义为“派出、差遣”；本句未明说受派者或传召对象，但下文众长老聚集到王那里，表明这里是派人召集。译作“派人传召”符合现代汉语，同时不把长老直接当作该动词明示的宾语。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文为带定冠词的“王”；上下文已明确其身份，汉语自然表达用“王”，不在本节擅自补出“约西亚”。
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: 都聚集到他那里
  rationale: 该动词是主动复数形式“他们聚集”，其主语由后面的“众长老”表达；אֵלָיו表示趋向“到他那里”。汉语采用主动句，既贴近原文句法，也自然清楚。
- source_word: כָּל זִקְנֵי
  choice: 众长老
  rationale: כָּל表示全体范围；זִקְנֵי在此指具有公共领导地位的长老，而非仅指年长男子。“众长老”简洁并保留制度性称谓。
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: 犹大和耶路撒冷
  rationale: 按现代中文圣经地名惯例音译，并保留原文所列地区与都城的并列关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接前文；“派人传召”以自然汉语表达上下文所暗示的召集行动，并用脚注保留原文动词宾语未明的特点。
