  to: 他的臣仆把他的遗体从米吉多运到耶路撒冷[a]，葬在他自己的坟墓里。随后，当地民众[b]选了约西亚的儿子约哈斯，膏立他，并立他接替他父亲作王。
  rationale: 修订仅收敛“拥立”所带的解释性，改以“选了”对应原文“取”在继位语境中的功能；并校正两则脚注，使其不增添“回去”的方向含义，且明确固定表达属于原文。其余措辞保留，因为能自然且准确地表达原文的王室、安葬及受膏语言。
