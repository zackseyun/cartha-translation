source:
  edition: WLC
  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: zh_hans
  text: 他的臣仆把他的遗体从米吉多运到耶路撒冷[a]，葬在他自己的坟墓里。随后，当地民众[b]选了约西亚的儿子约哈斯，膏立他，并立他接替他父亲作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “运到”所译的希伯来语动词，字面意思是“使他乘坐”；这里指运送已经死去的约西亚的遗体。
    reason: lexical_alternative
  - marker: b
    text: 原文“这地的民众”是希伯来语中的固定表达；这里指作为政治群体采取行动的本地民众。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ מֵת
  choice: 把他的遗体……运到
  rationale: רכב 的使役式直译为“使他乘坐”，这里结合 מֵת（死的）指运送约西亚的遗体。“运到”符合现代汉语习惯，又不暗示他当时仍活着。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: עבד 在王室语境中可指仆人、侍从或官员。“臣仆”既贴近原词，又体现王室背景而不过度限定其具体职务。
- source_word: וַיִּקְבְּרֻהוּ בִּקְבֻרָתוֹ
  choice: 葬在他自己的坟墓里
  rationale: קְבֻרָה 指埋葬之处；“坟墓”自然明确。“自己的”表达后缀“他的”，并保留其归属含义。
- source_word: עַם הָאָרֶץ
  choice: 当地民众
  rationale: 这是可具有政治行动含义的固定表达。现代中文“当地民众”比逐字的“地上的民”自然，也避免武断地缩窄为“平民”或特定阶层；脚注说明其群体政治性质。
- source_word: וַיִּקַּח
  choice: 拥立
  rationale: לקח 字面为“取、带走”，但在随后膏立和立王的语境中，指民众选取并支持约哈斯承继王位。“拥立”自然传达此处行动，同时不取代后文明确的膏立与立王。
- source_word: יְהוֹאָחָז בֶּן יֹאשִׁיָּהוּ
  choice: 约西亚的儿子约哈斯
  rationale: 按现代中文圣经人名惯例音译，并自然表达父子关系。
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: 膏立他
  rationale: משׁח 明确指用膏抹举行君王登基礼。“膏立”保留仪式和政治意义，不弱化为一般的“任命”。
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: 立他接替父亲作王
  rationale: מלך 的使役式表示“使其为王”；תחת 表示取代、接替。“立他接替父亲作王”清楚保留王位承继关系。
theological_decisions:
- issue: 君王受膏的仪式性语言
  choice: 膏立他
  alternative: 任命他
  rationale: 原文明确使用 משׁח，带有以色列王权承继中的礼仪和政治含义；不能将其泛化为普通任命。
- issue: “当地民众”在王位承继中的作用
  choice: 拥立……膏立……立他作王
  alternative: 选了……任命他作王
  rationale: 原文连续使用“取、膏、使作王”三个动作，显示该群体实际参与王权确立。译文保留动作层次，不把它解释成某种特定宪政程序。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“遗体”准确表达 מֵת 在运送语境中的状态；“臣仆”“膏立”“作王”保留王室叙事色彩。脚注标记均置于正文相应位置。
