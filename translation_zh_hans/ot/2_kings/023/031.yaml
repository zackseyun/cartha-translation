base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: zh_hans
  text: 约哈斯登基时二十三岁，在耶路撒冷作王三个月。他母亲名叫哈慕她，是立拿人耶利米的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: 二十三岁
  rationale: 这是希伯来语表达年龄的惯用语，译为现代汉语自然的年龄说法。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 介词ב与该形式共同标明即位的时间；“登基时”简洁而准确地表达开始作王之际。
- source_word: מָלַךְ
  choice: 作王
  rationale: 此处有限动词说明王位持续的时间；“作王三个月”符合中文列王纪年体例。
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: 三个月
  rationale: 作时间长度的宾格，与“作王”连用即可自然表达统治期限。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 直接表达作王地点的处所短语。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 保留列王纪常见的母系身份公式，同时采用自然、庄重的现代汉语。
- source_word: חֲמוּטַל
  choice: 哈慕她
  rationale: 按现代中文圣经人名的常见音译处理。
- source_word: בַּת יִרְמְיָהוּ
  choice: 耶利米的女儿
  rationale: בַּת明确表示父女关系；耶利米采用中文圣经通行译名。
- source_word: מִלִּבְנָה
  choice: 立拿人
  rationale: מן表示来源地；在中文身份说明中，“立拿人耶利米”比“来自立拿的耶利米”更简洁自然。
