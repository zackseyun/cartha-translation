  text: וַ/יַּמְלֵךְ֩ פַּרְעֹ֨ה נְכֹ֜ה אֶת אֶלְיָקִ֣ים בֶּן יֹאשִׁיָּ֗הוּ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יְהוֹאָחָ֣ז לָקָ֔ח וַ/יָּבֹ֥א מִצְרַ֖יִם וַ/יָּ֥מָת שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: zh_hans
  text: 法老尼哥立约西亚的儿子以利亚敬接替他父亲约西亚作王，又把他的名字改为约雅敬。他还把约哈斯带走；约哈斯来到埃及，死在那里。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来原文在“来到埃及，死在那里”两处都没有重提约哈斯的名字，只以动词形式表示“他”；按上下文，这人指约哈斯。
    reason: textual_clarity
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: 立……作王
  rationale: 该词是“作王”的使役形式，表示法老尼哥扶立以利亚敬为王；“立……作王”自然保留了使役含义。
- source_word: תַּחַת
  choice: 接替
  rationale: 在王位承继的语境中表示取代前任；“接替他父亲……作王”符合现代汉语习惯。
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: 把他的名字改为
  rationale: 这是更改名字的惯用表达，既贴近原文，又清楚说明“约雅敬”是以利亚敬的新名字。
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: 他还把约哈斯带走
  rationale: לקח的基本义为“拿、带走”。这里不擅自强化为“逮捕”或“掳走”，同时用“带走”表达人物被法老处置并离开原地。
- source_word: וַיָּבֹא מִצְרַיִם
  choice: 约哈斯来到埃及
  rationale: 原文动词直译为“来到”；汉语中“来到埃及”自然，也保留了希伯来文的视角。依上下文将省略的主语明确为约哈斯，但以脚注说明原文形式。
- source_word: וַיָּמָת שָׁם
  choice: 死在那里
  rationale: 简洁保留原文叙事的突兀结尾；“那里”明确回指埃及。
theological_decisions:
- issue: 末尾两个动词的主语
  choice: 正文明确为约哈斯
  alternative: 保持代词形式，译作“他来到埃及，死在那里”
  rationale: 希伯来文没有重复名词，只以动词形式表达“他”，形式上可能产生短暂歧义；但紧邻的受事“约哈斯”、叙事逻辑以及“死在那里”都表明所指是约哈斯。正文为可读性明确所指，同时用脚注保留原文信息。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依简体中文圣经通行译名处理：“法老尼哥、以利亚敬、约西亚、约雅敬、约哈斯”。避免把“带走”强化为原文未明说的“逮捕”或“掳走”。
