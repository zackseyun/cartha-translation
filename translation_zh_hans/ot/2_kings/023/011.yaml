  naturalness: 整体庄重自然。将密集方位语拆成说明句是可行的，但宜明确“从……到……”所表示的安置范围，避免中文读者误会为撤走动作的起点和终点。
  terminology: “雅威”“犹大诸王”“宫廷官员”“太阳的战车”均合适；“外围区域”对罕见建筑术语保持审慎。“房间”可译为更符合圣殿建筑语境的“房间／室”，此处保留“房间”亦可。
