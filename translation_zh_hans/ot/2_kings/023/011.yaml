source:
  edition: WLC
  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: zh_hans
  text: 他撤除了犹大诸王献给太阳的马；这些马原先从雅威殿的入口处一直安置到宫廷官员[a]拿单·米勒的房间附近，那房间位于外围区域[b]。他又用火焚烧了太阳的战车。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宦官”。希伯来语这个词既可指宦官，也可指王室或宫廷官员。
    reason: lexical_alternative
  - marker: b
    text: 译作“外围区域”的希伯来语词十分罕见，可能指圣殿建筑群外围或边缘的部分；也有人译作“郊区”或“柱廊”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: 撤走
  rationale: 该词的使役形表示使之停止、废止或不再使用。结合约西亚清除祭祀设施的语境，“撤走”既表达实际移除，也暗示终止其祭祀用途。
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: 犹大诸王献给太阳的
  rationale: נתן本义为“给”，在太阳崇拜的语境中译作“献给”自然地表达这些马的祭祀用途，同时不把“太阳”直接处理成专名神祇。
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: 从雅威殿入口处撤走；那些马原在……的房间旁
  rationale: 希伯来语以压缩的方位结构连接殿的入口和房间。中文通过分句说明马所在并被撤离的位置，避免误读为把马从入口运到房间。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，而不以称号代替。
- source_word: נְתַן מֶלֶךְ
  choice: 拿单·米勒
  rationale: 按马所拉读音音译人名，并用间隔号清楚呈现复合名称。
- source_word: הַסָּרִיס
  choice: 宫廷官员
  rationale: סָרִיס既可指宦官，也可泛指王室或宫廷官员；正文采用不武断断定其生理身份的职务性译法，并在脚注保留另一可能。
- source_word: בַּפַּרְוָרִים
  choice: 外围区域
  rationale: 这是罕见的建筑或地形用语，可能指圣殿建筑群边缘或外侧的区域；采用较宽泛的译法，并以脚注说明不确定性。
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: 太阳的战车
  rationale: 保留原文的属格表达和太阳崇拜意象，不将其弱化为一般车辆。
- source_word: שָׂרַף בָּאֵשׁ
  choice: 用火焚烧
  rationale: 原文明确提到火；这一略带强调的表达保留了希伯来语措辞。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以“雅威”音译，使其专名性质清楚可见。
- issue: 太阳是否作为神祇专名处理
  choice: 太阳
  alternative: 太阳神
  rationale: 原文使用普通名词“太阳”。上下文已清楚显示崇拜背景，因此不增添原文没有明说的“神”字，以保留措辞本身的开放性。
- issue: סָרִיס所指身份
  choice: 宫廷官员
  alternative: 宦官
  rationale: 该词可表示宦官，也可表示宫廷职官；经文没有足够线索确定生理身份，故正文采用较中性的职务称谓，脚注保留另一译法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“雅威殿”简洁呈现圣殿称谓；以分句化解原文密集的方位结构。正文中的[a]置于“宫廷官员”之后，以准确对应סָרִיס的词义歧义；[b]置于“外围区域”之后，对应罕见词פַּרְוָרִים。
