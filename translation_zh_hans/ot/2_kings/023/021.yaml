base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: zh_hans
  text: 于是，王吩咐全体百姓说：“你们要为雅威——你们的上帝——守逾越节[a]，照这约书上所写的去做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“举行逾越节”或“遵守逾越节”。希伯来文直译为“做／举行逾越节”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 吩咐
  rationale: צוה表示发出命令；“吩咐”既准确表达王的权威命令，也符合现代汉语叙事语体。
- source_word: כָּל הָעָם
  choice: 全体百姓
  rationale: עם在这里统指民众；“全体百姓”自然表达范围的完整性。
- source_word: עֲשׂוּ פֶסַח
  choice: 守逾越节
  rationale: 该短语直译为“做／举行逾越节”，实际是遵守、举行逾越节的希伯来语习惯表达；“守逾越节”简洁并保留其礼仪与盟约意味。
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: 向雅威你们的上帝
  rationale: ל表示行动所指向或归属的对象；“向”保留这一关系。“雅威”将四字神名作为专名音译，“你们的上帝”则明确保留第二人称复数所属关系。
- source_word: כַּכָּתוּב
  choice: 照……所写的
  rationale: 表达依照书面规定而行，比生硬的“如被写着”更符合现代汉语。
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: 这约书上
  rationale: עַל与书写用语连用时，汉语自然说“书上”；“这约书”保留定指和指示词，并与约西亚改革叙事中的盟约文书相称。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用“雅威”作为 Yahweh 的现代汉语音译，明确将其呈现为上帝的盟约之名，而不是以“主”这一称号代替；“耶和华”虽更为传统和熟悉，但其读音来源不同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“于是”承接前文事件；引语中保留命令语气。脚注标记置于真正涉及词义选择的“守逾越节”之后，而非置于“百姓”之后。
