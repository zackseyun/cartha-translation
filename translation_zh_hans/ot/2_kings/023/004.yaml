  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: zh_hans
  text: 王吩咐大祭司希勒家、第二等的祭司和守门槛的人，把所有为巴力、亚舍拉[a]和天上万象所造的器具，都从耶和华的殿里搬出来。他在耶路撒冷城外、汲沦的田野焚烧了这些器具，又把那些器具的尘土带到伯特利。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”；希伯来语“亚舍拉”既可指女神亚舍拉，也可指与她有关的崇拜物。
    reason: 保留אֲשֵׁרָה在神祇名称与崇拜物之间的真实词义歧义。
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: 王吩咐
  rationale: 保留君王命令的权威语气，也照原文使用称号而不补出名字。
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司希勒家
  rationale: “大祭司”是该职分自然且通行的现代汉语表达；人名采用常见圣经译名。
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: 第二等的祭司
  rationale: מִשְׁנֶה表示次一级或第二等级；此译法保留制度层级，但不武断具体化为副职。
- source_word: שֹׁמְרֵי הַסַּף
  choice: 守门槛的人
  rationale: 贴近“看守门槛者”的字面形象与圣殿职务，避免直接简化为普通守门人。
- source_word: מֵהֵיכַל יְהוָה
  choice: 从耶和华的殿里
  rationale: 本语境中的הֵיכָל明确指圣殿；将四字神名译作“耶和华”，作为现代汉语圣经中可辨识的专名。
- source_word: כָּל הַכֵּלִים
  choice: 所有……器具
  rationale: כֵּלִים涵盖礼仪用器物，“器具”自然且保持范围宽泛。
- source_word: לַבַּעַל וְלָאֲשֵׁרָה וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: 为巴力、亚舍拉和天上万象所造
  rationale: 保留三个并列对象；“天上万象”自然表达天体作为整体的含义。
- source_word: וַיִּשְׂרְפֵם
  choice: 焚烧了这些器具
  rationale: 明确复数代词回指器具，避免现代汉语中指代含混。
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: 在汲沦的田野
  rationale: שְׁדֵמוֹת指田野或田地；保留地点表述，不将其与汲沦谷完全等同。
- source_word: עֲפָרָם
  choice: 它们的灰尘
  rationale: עָפָר本义为尘土、粉尘；在焚烧语境中“灰尘”比单纯“灰烬”更贴近词义，也保留烧后残余物可能被碾碎成尘的表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。现代简体中文圣经传统中“耶和华”辨识度最高，同时作为专名呈现，不以“主”替代。
- issue: אֲשֵׁרָה的所指
  choice: 正文作“亚舍拉”，脚注说明也可指相关崇拜物
  alternative: 亚舍拉柱（或亚舍拉木偶）
  rationale: 该词既可指女神，也可指与她相关的崇拜物。本节介词结构把它与巴力和天上万象并列，正文采用专名可保留这种张力，脚注则呈现词义歧义。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。句法略作分句，以免首句过长；保留“第二等的祭司”“守门槛的人”等原文制度与空间意象，不作超出证据的具体解释。
