  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: zh_hans
  text: 他行了雅威眼中看为恶的事，效法他列祖[a]所行的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列祖”原文直译为“他的父亲们”，在这里也可指“他的祖先”或“他的先人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他行
  rationale: 未完成式带叙事性连接词，推进叙事；本节在中文中无需机械补出“于是”，以“他行”自然承接上下文。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: עשה הרע是君王评语中的固定表达；译作“行……看为恶的事”既符合现代汉语，也保留道德评价。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在……眼中”的视角隐喻，同时采用自然的现代汉语句式。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号替代其专名性质。
- source_word: כְּכֹל אֲשֶׁר
  choice: 照着……所行的一切
  rationale: 表达其行为与先辈过往行为完全相符，保留כְּכֹל的整体范围。
- source_word: עָשׂוּ
  choice: 所行的
  rationale: 在“列祖所行的”这一关系结构中，中文自然表达其先前所做的行为，无需另加过去完成时标记。
- source_word: אֲבֹתָיו
  choice: 他列祖
  rationale: 在王朝评语语境中通常指其父辈、祖先或先人；“列祖”简洁庄重，并保留群体性和历史延续感。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”作为现代汉语音译，以保留专名而不替换为“主”等称号。
- issue: 君王之恶的评价视角
  choice: 雅威眼中看为恶
  alternative: 行恶
  rationale: 保留בְּעֵינֵי יְהוָה，明确这里不是抽象或自主的道德判断，而是从雅威的评价视角作出的判定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“行……看为恶的事”承接《列王纪》常见的君王评语格式；“照着……所行的一切去行”避免生硬直译，同时保留完全仿效先辈行为的含义。
