  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: zh_hans
  text: 他把犹大各城的祭司都召来，又玷污了从迦巴直到别是巴、祭司曾在那里烧香的丘坛。他还拆毁了城门的丘坛[a]；那些丘坛在城长约书亚的城门入口处，位于城门那里一个人的左边[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城门的丘坛”原文直译为“众门的丘坛”，也可理解为“城门处的丘坛”。
    reason: lexical_alternative
  - marker: b
    text: 本句原文含义不十分明确，字面近于“在城门那里一个人的左边”；可能是指人进入城门时左手的一边。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 召来
  rationale: 这是בוא使役式，基本义为“使来、带来”。上下文是约西亚将犹大各城的祭司集中起来；“召来”在现代汉语中自然，也不必武断指定他们被带到何处。
- source_word: מֵעָרֵי יְהוּדָה
  choice: 从犹大各城
  rationale: עָרֵי可指各城市或城镇；“各城”简洁涵盖犹大境内不同聚落。
- source_word: וַיְטַמֵּא
  choice: 玷污了
  rationale: טמא的Piel式表示使之不洁、加以亵渎；“玷污”保留礼仪和宗教场所遭废弃处置的意味。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: במה在列王纪中指地方性的祭祀场所，不一定每处都位于天然高地；“丘坛”是准确而简练的经文用语。
- source_word: קִטְּרוּ שָׁמָּה
  choice: 曾在那里烧香
  rationale: קטר在此指焚烧香料或献烟祭；“烧香”符合本节祭祀语境，“曾”体现叙事所回顾的既往行为。
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: 从迦巴直到别是巴
  rationale: 直译地理范围，表示犹大由北至南的广阔区域，不把这一修辞意义写入正文。
- source_word: וְנָתַץ
  choice: 他还拆毁了
  rationale: נתץ意为拆除、毁坏建筑或设施；“拆毁”自然准确，“还”表达连接词的递进作用。
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: 城门旁的丘坛
  rationale: 字面为“众门的丘坛”，结构含义较压缩，较可能指设在城门附近的祭祀设施；正文作最低限度的自然化处理，并以脚注保留字面形式。
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ
  choice: 城长约书亚门的入口处
  rationale: 保留“入口”和以约书亚命名之“门”的构造关系，同时按汉语语序将约书亚的职衔前置。
- source_word: שַׂר הָעִיר
  choice: 城长
  rationale: שַׂר在此是城市行政官员；“城长”简练地传达其地方治理职分，又不暗示王室身份。
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: 在人进入城门时的左边
  rationale: 希伯来语字面近于“在城门那里一个人的左边”，表达省略且困难。正文采用最可能的空间意义，使现代读者可理解，同时脚注说明原文的不确定性。
