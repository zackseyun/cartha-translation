  text: וַ/יֹּ֨אמֶר֙ הַנִּ֣יחוּ ל֔/וֹ אִ֖ישׁ אַל יָנַ֣ע עַצְמֹתָ֑י/ו וַֽ/יְמַלְּטוּ֙ עַצְמֹתָ֔י/ו אֵ֚ת עַצְמ֣וֹת הַ/נָּבִ֔יא אֲשֶׁר בָּ֖א מִ/שֹּׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: zh_hans
  text: 他就说：“不要动他！谁也不可挪动他的骸骨。”于是他们保全了他的骸骨[a]，也保全了那位从撒马利亚来的先知的骸骨。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“于是他们没有动他的骸骨，也没有动那位从撒马利亚来的先知的骸骨。”
    reason: מלט 在本语境中可侧重“保全、使免受损害”，也可结合前一句具体表达为“不动”。
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: 不要动他
  rationale: 该命令在此语境中要求人停止处理或扰动死者；“不要动他”自然简明，并与下句不可挪动骸骨相衔接。
- source_word: אִישׁ אַל יָנַע
  choice: 谁也不可挪动
  rationale: אִישׁ 在否定命令中具有泛指作用，译作“谁也”；נוע 在此指移动或扰动骸骨，“挪动”保留具体动作。
- source_word: עַצְמֹתָיו
  choice: 他的骸骨
  rationale: 原文明确使用“骨头”而非笼统的遗骸；“骸骨”符合埋葬语境，也保持原文的具体性及重复。
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: 于是他们保全了他的骸骨
  rationale: מלט 的加强词干在此表示使之免遭破坏、予以保存；“保全”既体现免受损害，也不过度限定他们采取的具体方式。
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: 也保全了……先知的骸骨
  rationale: 第二个直接宾语与前一宾语并列；补出“也保全了”使现代汉语关系清楚，同时忠实表达两副骸骨都获保存。
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: 那位从撒马利亚来的
  rationale: 按叙事视角表达先知先前从撒马利亚而来；“撒马利亚”采用通行地名译法。
