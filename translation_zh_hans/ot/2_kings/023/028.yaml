base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 约西亚其余的事迹，以及他所做的一切，不都记载[a]在《犹大列王记》[b]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记载”直译为“写着”；这里指写入档案或史册。
    reason: lexical_alternative
  - marker: b
    text: 《犹大列王记》指《列王纪》所引用的一部王室记录，并不一定是现今正典中的《历代志》。
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: 约西亚其余的事迹
  rationale: יֶתֶר表示其余、剩余；דִּבְרֵי在列王生平总结的固定表达中指君王的事迹或政事，而不只是“言语”。译为“其余的事迹”既符合史书语境，也自然易懂。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所做的一切
  rationale: 忠实保留原文对约西亚全部作为的概括；“所做的一切”简明且范围宽广。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记载……吗
  rationale: הֲלֹא引出预期肯定回答的反问；中文“不都……吗”保留这一修辞力量。כְּתוּבִים本义为“写着”，在档案语境中译作“记载”更自然。
- source_word: עַל סֵפֶר
  choice: 在……上
  rationale: 原文介词עַל有“在……之上”的字面色彩；中文关于文字载于书卷的习惯说法是“记载在……上”。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王记》
  rationale: 这是《列王纪》反复引用的一部犹大王室史料或编年记录的名称。采用简洁而传统的中文书名形式，并以脚注防止读者将它误认作现存正典书卷。
