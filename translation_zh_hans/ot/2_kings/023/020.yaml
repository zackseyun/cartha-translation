source:
  edition: WLC
  text: וַ֠/יִּזְבַּח אֶת כָּל כֹּהֲנֵ֨י הַ/בָּמ֤וֹת אֲשֶׁר שָׁם֙ עַל הַֽ/מִּזְבְּח֔וֹת וַ/יִּשְׂרֹ֛ף אֶת עַצְמ֥וֹת אָדָ֖ם עֲלֵי/הֶ֑ם וַ/יָּ֖שָׁב יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: zh_hans
  text: 他在祭坛上宰杀了所有在那里、在丘坛供职的祭司[a]，又把人骨烧在坛上。随后，他回到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他在祭坛上把所有在那里、在丘坛供职的祭司献作祭物。”希伯来语动词可带献祭性宰杀的意味；但在清除非法崇拜的语境中，这里很可能着重指暴力的宰杀。
    reason: 保留וַיִּזְבַּח的祭祀性词义可能，同时避免正文暗示这是获认可的献祭。
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: 杀
  rationale: זבח可指献祭性宰杀，也可泛指宰杀。此处对象是丘坛祭司，语境是约西亚清除非法崇拜并污秽其祭坛；译作“杀”既传达暴力行动，又不把该行动明确说成蒙认可的献祭。脚注保留“献作祭物”的可能语感。
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: 丘坛供职的祭司
  rationale: במות在《列王纪》中通常指地方性的崇拜场所，常具有非法崇拜含义。“丘坛”承接其历史宗教用语；补入“供职的”自然地表明这些祭司与丘坛的从属关系，而未增加身份判断。
- source_word: אֲשֶׁר שָׁם
  choice: 在那里
  rationale: 保留关系从句的地点意义，指当时在那些丘坛所在地的祭司。
- source_word: עַל הַמִּזְבְּחוֹת
  choice: 在祭坛上
  rationale: עַל直接表示“在……上”；结合下句在坛上焚烧骨头的污秽行为，宜保留其具体空间意义。
- source_word: עַצְמוֹת אָדָם
  choice: 人的骨头
  rationale: אָדָם在此为泛指人类，并非专指男性；“人的骨头”是自然、准确的现代汉语。
- source_word: עֲלֵיהֶם
  choice: 在坛上
  rationale: 代词最自然地回指复数“祭坛”。汉语若直译为“在它们上面”较生硬，故明确重复“坛”，使指代清楚。
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: 之后，他回到耶路撒冷
  rationale: 叙事性连接词表达动作推进；“之后”自然呈现先后次序。
theological_decisions:
- issue: וַיִּזְבַּח是否应明确译为献祭
  choice: 正文译为“杀”，脚注注明也可理解为“献作祭物”
  alternative: 把所有丘坛祭司都献作祭物
  rationale: 该动词可能带献祭色彩，但正文若直接译成“献祭”，容易使读者以为这是献给耶和华且获认可的正规祭礼，原文并未明说。正文采用中性的暴力动词，同时由脚注保留其祭祀语感和经文中的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“丘坛”保留《列王纪》宗教历史语境中的关键术语；整体句式简洁，并明确坛上杀戮与焚骨的连续动作。
