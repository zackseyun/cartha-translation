  text: בְּ/יָמָ֡י/ו עָלָה֩ פַרְעֹ֨ה נְכֹ֧ה מֶֽלֶךְ מִצְרַ֛יִם עַל מֶ֥לֶךְ אַשּׁ֖וּר עַל נְהַר פְּרָ֑ת וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ יֹאשִׁיָּ֨הוּ֙ לִ/קְרָאת֔/וֹ וַ/יְמִיתֵ֨/הוּ֙ בִּ/מְגִדּ֔וֹ כִּ/רְאֹת֖/וֹ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: zh_hans
  text: 约西亚在位期间，埃及王法老尼哥[a]出兵攻打亚述王，往幼发拉底河去。约西亚王前去迎见他[b][c]；在米吉多，他见到对方时，便杀了对方。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尼哥”也常译作“尼科”。
    reason: 保留王名的常见汉语音译异体。
  - marker: b
    text: 原文连续使用第三人称单数代词，指代并不完全明确。按一种较明确的理解，可译作：“约西亚王前去迎见法老尼哥；法老尼哥在米吉多见到约西亚时，就杀了他。”
    reason: 说明原文代词歧义，并提供一种不纳入正文的解释性理解。
  - marker: c
    text: 另见《历代志下》35:20—24关于约西亚之死的平行记载。
    reason: 提供相关平行经文，同时不让平行记载取代本节自身的表达。
lexical_decisions:
- source_word: בְּיָמָיו
  choice: 约西亚在位期间
  rationale: 这是指约西亚统治时期的常见时间表达。中文明确补出上下文所指的约西亚，比直译“在他的日子”自然清楚。
- source_word: עָלָה
  choice: 出兵攻打
  rationale: עלה的基本义是“上去”，在军事叙事中可表示进军；结合后面的עַל，译为“出兵攻打”符合语境，也保持行动方向与敌对含义。
- source_word: פַרְעֹה נְכֹה
  choice: 埃及王法老尼哥
  rationale: 保留“法老”称号及王名，并用现代中文圣经读者较熟悉的音译“尼哥”。
- source_word: עַל מֶלֶךְ אַשּׁוּר
  choice: 攻打亚述王
  rationale: עלה后接עַל，在军事语境中最自然地表示向某人进军或与之敌对；虽有历史背景促使一些解释者理解为前去援助，但正文首先依从希伯来文本的通常句法。
- source_word: עַל נְהַר פְּרָת
  choice: 到了幼发拉底河
  rationale: 这里的第二个עַל表达所到地点；译文用“到了”自然呈现进军目的地。
- source_word: לִקְרָאתוֹ
  choice: 前去会他
  rationale: לִקְרַאת可指前去与某人相遇，既可能中性，也可能带对抗意味。“会他”不在正文中预先判定约西亚的具体意图。
- source_word: וַיְמִיתֵהוּ
  choice: 杀了他
  rationale: מות的使役式表示使人死亡。“杀了”是直接、自然的现代汉语，同时不额外说明实施方式。
- source_word: בִּמְגִדּוֹ
  choice: 在米吉多
  rationale: 准确表达事件发生地点，并采用通行中文地名。
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: 他一看见他
  rationale: 两个代词都是第三人称阳性单数。重复使用“他”保留原文指代压缩和歧义，不在正文中擅自点明主语与宾语。
theological_decisions:
- issue: 末句多个第三人称代词的指代
  choice: 正文保留“他一看见他，就……杀了他”的歧义。
  alternative: 明确译为“约西亚前去会法老尼哥；法老尼哥一看见约西亚，就在米吉多杀了他”。
  rationale: 希伯来文连续使用第三人称阳性单数形式，并未逐一重提人物姓名。历代志下35:20—24的平行记载有助于理解事件，但不应据此在正文中消除列王纪本身的语法张力。
- issue: 埃及王与亚述王之间关系的理解
  choice: 译作“攻打亚述王”。
  alternative: 译作“前往亚述王那里”或按历史背景理解为“援助亚述王”。
  rationale: עָלָה עַל在军事叙事中通常表达进军攻击。尽管历史重建可能支持不同关系，正文不以外部重建取代马所拉文本最自然的句法意义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“出兵攻打”“前去会他”适合历史叙事；末句刻意重复“他”，虽比一般汉语略显压缩，却有必要保留希伯来文真实的指代歧义。
