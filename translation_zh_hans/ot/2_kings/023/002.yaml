source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: zh_hans
  text: 王上到耶和华的殿[a]去；所有犹大人、耶路撒冷的全体居民、祭司、先知，以及所有百姓，无论大小[b]，都和他一同上去。王把在耶和华殿里发现的《约书》上的一切话，都读给他们听。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华的殿”也可译作“耶和华的圣殿”；原文直译为“耶和华的家”。
    reason: 说明希伯来语בֵּית的字面表达及语境性译法。
  - marker: b
    text: “无论大小”也可译作“从最卑微的到最尊贵的”，指各等人都包括在内。
    reason: 说明希伯来习语לְמִקָּטֹן וְעַד גָּדוֹל的可能含义，同时避免将其误限于年龄。
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上到
  rationale: 保留עלה“上去、登上”的方向含义；圣殿地势较高，现代汉语用“上到”自然明确。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: בֵּית字面为“家、殿宇”；在此指圣殿。译作“殿”既符合语境，也比“耶和华的家”更符合现代汉语宗教建筑用语。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名“耶和华”对应四字神名，区别于作为称号的“主”。
- source_word: כָל אִישׁ יְהוּדָה
  choice: 所有犹大人
  rationale: אִישׁ为阳性单数但在此作集合表达。汉语“犹大人”可指该群体，同时避免生硬的“所有犹大的男人”；原文形式上的男性措辞在脚注说明。
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלַם
  choice: 耶路撒冷的全体居民
  rationale: 准确表达分词יֹשְׁבֵי“居住者”，并以“全体居民”自然传达כָל的整体范围。
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: 祭司、先知
  rationale: 采用这两个职分在现代标准汉语中的通行对应词。
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: 无论大小
  rationale: 保留“小—大”的原文意象，并以自然汉语表达社会地位或重要程度涵盖所有人的惯用语；不把范围缩窄为年龄。
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: 都读给他们听
  rationale: 对象是书中文字，קרא在此为宣读；“读给他们听”自然传达字面“在他们耳中”的公开听闻含义。
- source_word: סֵפֶר הַבְּרִית
  choice: 《约书》
  rationale: סֵפֶר可指书卷，הַבְּרִית为“这约／该约”。“约书”简明保留其标题性质，以书名号标明文献名称。
- source_word: הַנִּמְצָא
  choice: 发现的
  rationale: 该被动分词指此前在殿中被找到；“发现的”在汉语叙事中自然，也与上下文相合。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名而非普通称号。中文稿保留专名，并采用普通现代中文圣经读者最熟悉的“耶和华”；“雅威”较接近学界常见的拟音，也是可行替代。
- issue: כָל אִישׁ יְהוּדָה中阳性集合表达的处理
  choice: 所有犹大人，并以脚注说明字面形式
  alternative: 所有犹大的男子
  rationale: 语境列举全民集会，אִישׁ虽为阳性形式，却可集合性地代表犹大众人。“犹大人”保留群体指称并避免将参与者无根据地限定为成年男性；脚注保留原文真实措辞及其歧义。
- issue: לְמִקָּטֹן וְעַד גָּדוֹל所指范围
  choice: 无论大小
  alternative: 从最卑微的到最尊贵的
  rationale: 原文只给出“小”与“大”的两极，没有明说年龄、财富或地位。正文保留宽泛意象，不替作者限定具体社会维度。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。为避免原文长串并列在汉语中造成指代不清，将经文分为两句，并在第二句重提“王”。“《约书》上的一切话”保持书卷内容与公开宣读的关系。
