source:
  edition: WLC
  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: zh_hans
  text: 约西亚转身，看见那山上的坟墓[a]，就派人从坟墓中取出骸骨，烧在祭坛上，玷污了祭坛；这是照着耶和华的话，就是那位神人所宣告[b]的话；他宣告的正是这些事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坟墓”也可译作“墓穴”或“埋葬之处”；原文并不限定为人工建造的墓室。
    reason: lexical_alternative
  - marker: b
    text: “宣告”也可译作“呼喊”或“高声宣告”；原词可强调公开出声的宣讲。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: 转身
  rationale: פנה通常表示转身或转向；此处先转身、后看见，保留了叙事中的动作次序。
- source_word: הַקְּבָרִים
  choice: 坟墓
  rationale: קבר可指坟墓、墓穴或埋葬之处；“坟墓”自然、宽泛，不限定其建筑形式。
- source_word: בָּהָר
  choice: 山上
  rationale: הַר可指山或丘陵；“山上”直接保留原文的地形表述。
- source_word: הָעֲצָמוֹת
  choice: 骸骨
  rationale: 原词直指骨头；“骸骨”在中文中清楚表明是人的骨殖，并符合庄重叙事语体。
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: 烧在祭坛上
  rationale: 保留骨骸是在祭坛上焚烧这一具体而具有污秽祭坛作用的行为。
- source_word: וַיְטַמְּאֵהוּ
  choice: 玷污了祭坛
  rationale: טמא在礼仪语境中表示使之不洁、亵污；明说“祭坛”可自然消除中文代词指向的含混，而其最近先行词正是祭坛。
- source_word: כִּדְבַר יְהוָה
  choice: 这正应验了耶和华的话
  rationale: 该短语标示行动与先前神谕相符；“应验”自然表达此处明显的预言实现关系。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，作为四字神名的专名表达，不以头衔替代。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来语对先知性人物的固定称谓；“神人”简洁保留原有称号，不增译为“先知”。
- source_word: קָרָא
  choice: 宣告
  rationale: קרא可指呼喊、宣告；此处是公开而带权威的预言性发言，“宣告”适合两个重复出现的动词。
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: 这些事
  rationale: דברים既可指话语，也可指事情；此处回指所预告并已发生之事，“这些事”保留其较广含义。
theological_decisions:
- issue: 约西亚的行动与先前神谕之间的应验关系
  choice: 译作“这正应验了耶和华的话，就是神人所宣告的”
  alternative: 较形式地译作“照着耶和华的话，就是神人所宣告的”
  rationale: 原文כדבר公式把行动明确联系于先前由神人传达的神谕；“应验”使现代中文读者自然把握这一关系，没有补入预言内容。
- issue: 末尾两个אֲשֶׁר קָרָא的重复及关系从句指向
  choice: 保留为“就是神人所宣告的；他曾宣告这些事”
  alternative: 合并为“就是神人对这些事所发出的宣告”
  rationale: 马所拉文本确有“宣告”的重复，且句法略显累赘。保留重复可尊重现存文本及其强调效果，不以润色方式删去可能具有文本史意义的措辞。
- issue: 神名יהוה的表达
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中最广为识别的专名形式；仍以名字而非“主”等称号来表达原文神名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事中文。以“骸骨”“玷污”“神人”保留礼仪与先知语境；通过重复“祭坛”避免代词歧义，并保留原文末尾“宣告”的重复及其张力。所有脚注标记均已置于正文。
