  to: 约西亚转身，看见那山上的坟墓[a]，就派人从坟墓中取出骸骨，烧在祭坛上，玷污了祭坛；这是照着耶和华的话，就是那位神人所宣告[b]的话；他宣告的正是这些事。
  rationale: 修订以“照着耶和华的话”直接对应כדבר יהוה，避免将上下文的应验含义提升为本节明说的断言；将地点短语调整为自然现代汉语；并保留原文末尾两个“宣告”的重复，同时补足中文所需的“话”，使两个关系从句的语义关系清楚。脚注标记及内容均予保留并对应正文锚点。
