  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/032.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: zh_hans
  text: 他行了在雅威眼中看为恶的事，效法他列祖一切所行的。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 这是希伯来语的固定表达，意为“做被视为恶的事”；采用现代汉语中自然、庄重的说法，而不生硬直译为“做那恶”。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象，同时使整句符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译四字神名，保留经文所用的上帝之名，不以称号替代。
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: 照着……所行的一切而行
  rationale: “照着”表达比较和依循，“一切”保留כֹּל的周全意味；末尾补出“而行”，使汉语句法完整。
- source_word: אֲבֹתָיו
  choice: 他列祖
  rationale: “列祖”既保留阳性先辈的含义，也符合君王叙事的庄重语体；脚注说明其语境范围可能包括先祖或前任君王。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用上帝的专名，因此以“雅威”音译，避免用称号“主”取代；“耶和华”是传统形式，但较不贴近该名通常重构的读音。
- issue: “他列祖”的指涉范围
  choice: 正文保留“列祖”，脚注说明
  alternative: 先祖；前任君王
  rationale: 原文אֲבֹתָיו字面为“他的父辈/父祖”，在王室评语中可能兼指祖先及先前的君王；正文不把这一语境含义限定为单一解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体；保留“雅威眼中”的希伯来语意象，并以“照着……所行的一切而行”兼顾原文结构与汉语流畅度。
