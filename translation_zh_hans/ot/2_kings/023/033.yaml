  text: וַ/יַּאַסְרֵ/הוּ֩ פַרְעֹ֨ה נְכֹ֤ה בְ/רִבְלָה֙ בְּ/אֶ֣רֶץ חֲמָ֔ת ב/מלך בִּ/ירוּשָׁלִָ֑ם וַ/יִּתֶּן עֹ֨נֶשׁ֙ עַל הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: zh_hans
  text: 法老尼哥在哈马境内的利比拉把他拘禁起来[a]，不让他在耶路撒冷作王[b]；又向全国征收贡赋[c]：银子一百他连得，金子一他连得。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把他捆绑起来”或“把他扣留在那里”。
    reason: lexical_alternative
  - marker: b
    text: 这处希伯来文也可理解为“使他不再在耶路撒冷作王”；按另一种读法，也可译作“当他在耶路撒冷作王时”。
    reason: alternative_reading
  - marker: c
    text: “贡赋”也可译作“罚金”或“罚款”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: 把他拘禁起来
  rationale: אסר的基本义是捆绑、拘禁；在君王被法老控制的政治语境中，“拘禁”自然表达其实际处境，同时以脚注保留“捆绑、扣留”的可能。
- source_word: פַרְעֹה נְכֹה
  choice: 法老尼哥
  rationale: 保留统治者称号“法老”，人名采用现代中文圣经中通行的音译“尼哥”。
- source_word: בְרִבְלָה
  choice: 在……利比拉
  rationale: 介词ב表示事件发生的地点；“利比拉”采用通行中文音译。
- source_word: בְּאֶרֶץ חֲמָת
  choice: 在哈马境内
  rationale: אֶרֶץ在此指哈马所属的地域；“境内”比逐字的“哈马地”更符合现代汉语地理表达。
- source_word: במלך בִּירוּשָׁלָם
  choice: 不让他在耶路撒冷作王
  rationale: 结合拘禁行动及叙事语境，将此短语理解为阻止他继续掌权；脚注保留希伯来文短语可作时间性理解的歧义。
- source_word: וַיִּתֶּן עֹנֶשׁ
  choice: 又……征收贡赋
  rationale: עֹנֶשׁ可指处罚、罚金或强制征款；这里款项由国家承担且以金银定额，主文用政治经济语境较自然的“贡赋”，脚注保留“罚金、罚款”。
- source_word: עַל הָאָרֶץ
  choice: 向全国
  rationale: הָאָרֶץ在此指犹大全地或国家；“向全国征收”自然传达负担加在该国之上的意思，不把所指缩窄为某一特定群体。
- source_word: מֵאָה כִכַּר כֶּסֶף וְכִכַּר זָהָב
  choice: 银子一百他连得，金子一他连得
  rationale: כִּכָּר是古代重量单位，采用中文圣经通行名称“他连得”，并保留原文银一百、金一的数目对比，不作可能造成虚假精确度的现代单位换算。
theological_decisions:
- issue: 拘禁与耶路撒冷作王之间的关系
  choice: 理解为法老借拘禁阻止他在耶路撒冷作王
  alternative: 理解为“当他在耶路撒冷作王时”或“使他不再在耶路撒冷作王”
  rationale: 上下文显示法老废黜并控制这位犹大王，因此预防或终止其统治最合叙事逻辑；但原短语的形式与传读存在解释空间，故不在脚注中抹去另一种读法。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。地名与人名使用中文圣经通行译名；句法避免生硬直译，以“不让……作王”和“向全国征收”清楚呈现政治行动，同时用脚注保留词义和读法上的真实歧义。
