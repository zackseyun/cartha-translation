id: 2KI.23.25
reference: 2 Kings 23:25
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/כָמֹ/הוּ֩ לֹֽא הָיָ֨ה לְ/פָנָ֜י/ו מֶ֗לֶךְ אֲשֶׁר שָׁ֤ב אֶל יְהוָה֙ בְּ/כָל לְבָב֤/וֹ וּ/בְ/כָל נַפְשׁ/וֹ֙ וּ/בְ/כָל מְאֹד֔/וֹ כְּ/כֹ֖ל תּוֹרַ֣ת מֹשֶׁ֑ה וְ/אַחֲרָ֖י/ו לֹֽא קָ֥ם כָּמֹֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: zh_hans
  text: 在他以前，没有一个王像他那样尽心、尽性、尽力[b]地转向雅威[a]，遵照摩西的一切律法；在他以后，也没有兴起一个像他那样的王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “转向雅威”也可译作“回转归向雅威”。原文动词可包含悔改并重新忠于盟约的意思。
    reason: lexical_alternative
  - marker: b
    text: “尽心、尽性、尽力”呼应《申命记》6:5。
    reason: cross_reference
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: 在他以前，没有一个王像他那样
  rationale: 保留句首比较所强调的独特性，并以自然的现代汉语表达时间关系；“他”按上下文指约西亚。
- source_word: שָׁב אֶל יְהוָה
  choice: 归向雅威
  rationale: שׁוּב 与 אֶל 连用，可指在悔改和盟约忠诚中转回、归向上帝；“归向”既自然，也不把含义收窄为单一的悔罪行为。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，保留其作为以色列之上帝专名的性质，而不以称号代替。
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: 尽心、尽性、尽力
  rationale: 采用简洁而为汉语读者熟悉的申命记式三联表达，保存其与申命记6:5的呼应；“力”在此概括 מְאֹד 所表达的全部能力和力量。
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: 照着摩西的全部律法
  rationale: כְּ 表示依照或符合；תּוֹרָה 在本节王权评价语境中指摩西律法整体。“全部律法”保留 כֹל 的全面性。
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: 在他以后，也没有兴起一个像他的王
  rationale: קָם 在这里表示后来出现、兴起；补出“王”使汉语指代清楚，同时与前半句形成对称。
theological_decisions:
- issue: 约西亚“归向雅威”的盟约和悔改意涵
  choice: 正文译作“归向雅威”
  alternative: “回转归向雅威”或“向雅威悔改”
  rationale: 原文动词可兼有转向、返回、悔改及恢复盟约忠诚等意味。“归向”保留这些意义空间，不将经文限定为某一种系统化解释。
- issue: 申命记6:5的呼应
  choice: 保留“尽心、尽性、尽力”的三联结构
  alternative: “全心、全人、竭尽所能”
  rationale: 原文刻意采用申命记传统中的固定式表达；熟悉的三联措辞能使互文关系清晰，又不过度解释希伯来人观。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华或“上主”
  rationale: 原文直接使用四字神名；音译可保留专名性质。“雅威”较贴近学界通常采用的复原读音。
- issue: 约西亚独特性的比较范围
  choice: 保留“以前……以后……”的绝对比较措辞
  alternative: 解释为仅限于归向雅威这一项评价
  rationale: 原句的比较由关系从句具体说明其归向雅威的彻底程度，但没有要求译文进一步界定或调和它与其他君王评价语的关系，因此保留原有张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“在他以前……在他以后……”形成清晰对称；“尽心、尽性、尽力”沿用普通读者熟悉的圣经表达。脚注标记均置于正文相关位置。
