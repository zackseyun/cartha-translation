revisions:
- from: 在他以前，没有一个王像他那样，照着摩西的全部律法，尽心、尽性、尽力归向雅威[a][b]；在他以后，也没有兴起一个像他的王。
  to: 在他以前，没有一个王像他那样尽心、尽性、尽力[b]地转向雅威[a]，遵照摩西的一切律法；在他以后，也没有兴起一个像他那样的王。
  rationale: 修订仅调整中文语序、比较结构和脚注锚点，未改变原文意义。“转向雅威”自然表达שׁוּב אֶל的转向／归回意涵；脚注保留其可能含有悔改与盟约忠诚的语义空间。
