source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: zh_hans
  text: 他取缔了犹大诸王所设立的祭司[a]；这些祭司在犹大各城和耶路撒冷周围的丘坛上焚香。他也取缔了那些向巴力、太阳、月亮、星座[b]和天上万象[c]焚香的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来词特指参与不合法祭祀或偶像崇拜的祭司，也可译作“异教祭司”或“偶像祭司”，并非指耶和华所认可的祭司。
    reason: lexical_alternative
  - marker: b
    text: 或译“黄道星宫”。这个希伯来词可能指星座或黄道上的星群。
    reason: lexical_alternative
  - marker: c
    text: 直译“天上的万军”。这里结合太阳、月亮和星座来看，指众天体。
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: 取缔了
  rationale: 该词是 שׁבת 的使役形，表示使某事停止。“取缔”自然表达约西亚终止这些祭司职事和非法祭祀活动的行动，同时不具体断定他采取了处死、罢免或驱逐中的哪一种方式。
- source_word: הַכְּמָרִים
  choice: 祭司[a]
  rationale: כְּמָרִים 在此指参与不合正统或偶像崇拜的祭司。正文采用简洁的“祭司”，脚注说明其特定贬义语境，以免正文添加希伯来词本身未明说的限定。
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: 犹大诸王所设立的
  rationale: 此处 נתן 表示任命或设置；“设立”既适合祭司职分，也保留原文较宽泛的措辞。
- source_word: וַיְקַטֵּר
  choice: 这些祭司……焚香
  rationale: קטר 在此指焚香或焚烧祭物使烟上腾。原文使用单数动词，但在关系结构中概括前面的祭司群体；汉语用复数承接语更自然。
- source_word: בַּבָּמוֹת
  choice: 在……丘坛上
  rationale: בָּמוֹת 是列王纪中地方性祭祀场所的常用名称；“丘坛”是简明且较为固定的中文对应。
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: 在犹大各城和耶路撒冷周围
  rationale: מְסִבֵּי 指环绕之地；“耶路撒冷周围”准确而自然。
- source_word: וְאֶת הַמְקַטְּרִים
  choice: 他也取缔了那些……焚香的人
  rationale: 分词表示以焚香行为为特征的另一组人。汉语另起一句并补出谓语，可清楚呈现其与前一宾语并列的关系。
- source_word: לַבַּעַל
  choice: 向巴力
  rationale: בעל 在此是神名，按现代中文圣经传统音译为“巴力”；介词 ל 表示祭祀行为所指向的对象。
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: 向……太阳、月亮
  rationale: 直译两个受崇拜的天体；汉语列表无需机械重复每一个“向”，仍清楚保留其祭祀对象身份。
- source_word: וְלַמַּזָּלוֹת
  choice: 星座[b]
  rationale: מַזָּלוֹת 很可能指星座或黄道星宫，但确切范围存在争议；正文用较宽泛的“星座”，脚注保留另一可能。
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: 天上万象[c]
  rationale: 该固定短语在本语境指被敬拜的众天体。“天上万象”是自然、庄重的现代汉语，并避免把“天军”误解为天使军队。
theological_decisions:
- issue: כְּמָרִים 是否应在正文明确译为“偶像祭司”或“异教祭司”
  choice: 正文译“祭司”，以脚注说明其非法或偶像崇拜背景
  alternative: 偶像祭司；异教祭司
  rationale: 该词在希伯来圣经中通常带有非法祭祀或异教祭司的色彩，且本节语境十分明确；但正文若直接加入“偶像”可能把词义解释完全写入译文。正文与脚注结合，既避免读者误认为是耶和华合法设立的祭司，也不抹平词语本身的表达方式。
- issue: צְבָא הַשָּׁמָיִם 在此指天体还是天使军队
  choice: 天上万象
  alternative: 天军；天上的万军
  rationale: 本节依次列出太阳、月亮和星座，显示该短语在此主要统称天体；“天上万象”保留集合意义，又不引入天使崇拜的特定解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“取缔”表达使非法职事和活动停止，不额外断定具体惩处方式；将较长的希伯来并列句分为两句，以提高中文可读性，同时保留两组对象的结构。
