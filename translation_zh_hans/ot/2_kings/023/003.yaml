source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: zh_hans
  text: 王站在柱旁，在雅威面前立约：要跟随雅威，全心全意地遵守他的诫命、法度和律例，实行写在这书[a]上的这盟约之言。全体百姓都接受了这盟约[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “书”也可译作“书卷”或“文书”；这里的希伯来词可以指卷轴或成文文件。
    reason: cultural_note
  - marker: b
    text: 直译“站在盟约中”，意思可能是全体百姓都接受这盟约，并承诺遵行。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: 站在柱旁
  rationale: עַל 可表示“在……上”，也可表示临近某物的位置。王室礼仪语境中，“柱旁”自然表达王站在指定位置，又不武断理解为站在柱顶。
- source_word: וַיִּכְרֹת אֶת הַבְּרִית
  choice: 立约
  rationale: כרת ברית 是“订立盟约”的固定表达；现代汉语以“立约”简洁、庄重，也保留原文定冠词所指的特定之约。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 直接表达“在……面前／临在中”的礼仪和盟约含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为以色列上帝之专名的性质，而不以称号替代。
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: 跟随雅威
  rationale: 希伯来语直译为“走在雅威之后”。汉语“跟随”自然地保留行动和忠诚的含义；若译“行在……之后”则较生硬。
- source_word: לִשְׁמֹר
  choice: 遵守
  rationale: 在法律和盟约语境中，שׁמר 指谨守、实行规定；“遵守”是现代汉语中清楚自然的对应。
- source_word: מִצְוֺתָיו ... עֵדְוֺתָיו ... חֻקֹּתָיו
  choice: 他的诫命、法度和律例
  rationale: 分别保留三个并列法律词类，不将其合并为泛称。“诫命、法度、律例”庄重而可懂。
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: 一心一意地
  rationale: 原文直译为“以他的全心和全性命／全人”。汉语“一心一意”自然表达毫无保留的全人投入，避免现代读者把“心”和“灵魂”误解为截然分离的两部分。
- source_word: לְהָקִים אֶת דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: 履行这约的一切话
  rationale: הקים 在此指使约言成立并付诸实行；“履行”符合盟约语境。“一切话”承接 כָל，并保留 דִּבְרֵי 的文本性。
- source_word: הַסֵּפֶר הַזֶּה
  choice: 这卷书
  rationale: סֵפֶר 可指书卷、文书或书；古代语境下“卷”较贴切，同时“书”保持普通读者可懂。
- source_word: וַיַּעֲמֹד כָּל הָעָם בַּבְּרִית
  choice: 全体百姓都立身于这约中
  rationale: 保留原文“站立”的意象和 בַּבְּרִית 的结构，表达百姓公开站定、委身于约；脚注说明其可意译为加入或接受这约。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名。采用“雅威”保留专名性质，并与源文本提供的翻译方针一致，不用称号取代。
- issue: 百姓回应盟约的公式 וַיַּעֲמֹד כָּל הָעָם בַּבְּרִית
  choice: 全体百姓都立身于这约中
  alternative: 全体百姓都接受了这约；全体百姓都加入这约
  rationale: 原文表达带有“站立”的具体意象，也可能蕴含坚定承担盟约的意思。正文保留这一张力，脚注提供较动态的理解，避免把语义只限定为某种正式仪式。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“立约、诫命、法度、律例”保留盟约和法律语域；“一心一意”使全心全人的承诺自然可懂。正文中的[a]、[b]与脚注逐一对应。
