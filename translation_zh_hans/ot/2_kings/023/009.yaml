base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: zh_hans
  text: 不过，丘坛的祭司[a]没有上到耶路撒冷雅威[b]的祭坛那里，却在他们的弟兄[c]中间吃无酵饼。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丘坛的祭司”也可译作“在丘坛任职的祭司”。丘坛是各地的敬拜场所。
    reason: lexical_alternative
  - marker: b
    text: “雅威”是希伯来文神名YHWH（יהוה）的译音，传统上常译作“耶和华”或以“主”代替。
    reason: alternative_reading
  - marker: c
    text: “他们的弟兄”很可能指其他祭司，或同属祭司家族的人。
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: 不过
  rationale: 在上下文中表示对前述改革行动的限制或转折；“不过”自然传达这种语气。
- source_word: יַעֲלוּ
  choice: 上
  rationale: עלה的基本义是“上去”；用于耶路撒冷及敬拜语境时，“上”既保留原文的空间意象，也符合现代汉语习惯。
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: 丘坛的祭司
  rationale: 按原文领属结构直译；“丘坛”指地方性的敬拜场所，是במות在本语境中的恰当译法。
- source_word: מִזְבַּח יְהוָה
  choice: 雅威的祭坛
  rationale: 保留原文的领属关系，并将神名作为专名表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，区别于作为称号的“主”。
- source_word: כִּי אִם
  choice: 却
  rationale: 承接前面的否定，转而说明他们实际所做的事；“却”在汉语中清楚表达对照。
- source_word: אָכְלוּ מַצּוֹת
  choice: 吃无酵饼
  rationale: מַצּוֹת指未发酵的饼；“无酵饼”是清楚且广为理解的译法。
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: 在他们的弟兄中间
  rationale: 贴近原文“在他们弟兄中间”，保留亲属称谓及其语境上的开放性，不在正文中径自补出“祭司”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，而非普通称号；“雅威”较直接地呈现该专名，脚注同时说明传统译法。
- issue: אֲחֵיהֶם所指的群体
  choice: 他们的弟兄
  alternative: 他们的祭司同伴；他们的族人
  rationale: 原文只明说“弟兄”，语境很可能指同属祭司群体的人，但正文不将这一推断明确化，以保留原文的含义范围。
- issue: 祭司没有上祭坛的性质
  choice: 没有上
  alternative: 不得上；不能上
  rationale: 原文陈述他们事实上没有上去，并未以显式禁令形式说明原因，因此不译成“不得”，避免增添法律或制度层面的断定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“丘坛”“祭坛”“无酵饼”等术语保持经文语域的辨识度；句式简洁，并保留原文在“弟兄”所指对象及祭司未上祭坛之原因方面的含混性。
