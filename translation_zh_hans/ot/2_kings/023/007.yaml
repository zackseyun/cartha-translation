base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: zh_hans
  text: 他拆毁了耶和华殿里男庙妓[a]的房屋；妇女们在那里为亚舍拉编织帐幔[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是阳性复数，字面可作“被奉献的人”；这里指参与异教性仪式中性行为的男子。
    reason: lexical_alternative
  - marker: b
    text: “帐幔”原文直译为“房屋”；这里可能指为亚舍拉编织的罩幔、帐棚式织物或织物小龛。
    reason: alternative_reading
  - marker: c
    text: “亚舍拉”既可能指亚舍拉女神，也可能指与她有关的崇拜物，常称“亚舍拉木柱”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: 拆毁
  rationale: נתץ在此指拆除或摧毁建筑；“拆毁”自然准确，并保留具体的破坏动作。
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: 男庙妓的房屋
  rationale: בָּתֵּי是“房屋”的复数构造式；הַקְּדֵשִׁים为阳性复数，在本段语境中指参与异教性仪式的男性。“男庙妓”简明传达其性别和祭祀背景。
- source_word: בְּבֵית יְהוָה
  choice: 耶和华殿里
  rationale: “殿”在现代汉语中自然表达圣殿建筑，同时保留地点关系；יְהוָה音译为“耶和华”，符合通行中文圣经用语。
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: 妇女们曾在那里编织
  rationale: 分词表示当时持续或惯常的活动；“曾……编织”符合叙事语境，并保留שָׁם“在那里”。
- source_word: בָּתִּים לָאֲשֵׁרָה
  choice: 为亚舍拉编织帐幔
  rationale: בָּתִּים字面为“房屋”，但既是被编织之物，此处很可能指帐幔、织物构成的罩棚或小龛。“帐幔”在正文中较易理解，字面意义与不确定性在脚注说明。
- source_word: לָאֲשֵׁרָה
  choice: 为亚舍拉
  rationale: אֲשֵׁרָה既可指女神，也可指与其崇拜有关的神像或木柱；音译“亚舍拉”避免在正文中武断消除歧义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代中文圣经读者最熟悉且庄重的专名形式；不以“主”替代专名。
- issue: אֲשֵׁרָה的所指
  choice: 亚舍拉
  alternative: 亚舍拉女神／亚舍拉木柱
  rationale: 原词可指女神本身，也可指其崇拜物；正文保留这一真实歧义，脚注列明两种可能。
- issue: הַקְּדֵשִׁים的性别与性质
  choice: 男庙妓
  alternative: 庙妓／被奉献的人
  rationale: 希伯来语为阳性复数，且上下文涉及被约西亚清除的异教祭祀活动；明确译出“男”较忠实，但对其具体角色保留脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“耶和华殿”比“耶和华的房屋”更符合自然汉语；分号清楚区分拆毁房屋与妇女编织帐幔两项相关信息。所有解释性补充均置于脚注，以免正文过度释义。
