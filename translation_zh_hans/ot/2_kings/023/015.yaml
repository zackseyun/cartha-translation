  text: וְ/גַ֨ם אֶת הַ/מִּזְבֵּ֜חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֗ל הַ/בָּמָה֙ אֲשֶׁ֨ר עָשָׂ֜ה יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל גַּ֣ם אֶת הַ/מִּזְבֵּ֧חַ הַ/ה֛וּא וְ/אֶת הַ/בָּמָ֖ה נָתָ֑ץ וַ/יִּשְׂרֹ֧ף אֶת הַ/בָּמָ֛ה הֵדַ֥ק לְ/עָפָ֖ר וְ/שָׂרַ֥ף אֲשֵׁרָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: zh_hans
  text: 此外，伯特利的那座祭坛，就是尼八的儿子耶罗波安所建、使以色列犯罪的丘坛；连那座祭坛和丘坛，他也拆毁了。他焚烧丘坛，把它碾成尘土，又焚烧了亚舍拉[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”；希伯来语此词可指与亚舍拉崇拜有关的礼仪物件。
    reason: 保留 אֲשֵׁרָה 在女神名称与相关崇拜物件之间的词义范围，同时说明本处很可能指后者。
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: 祭坛
  rationale: 这是 מִזְבֵּחַ 的标准译法，准确表达献祭用的坛，无须增译为“献祭坛”。
- source_word: בְּבֵית אֵל
  choice: 伯特利的
  rationale: 介词加地名表示位置；在此用领属式表达“位于伯特利的”，符合现代汉语习惯。
- source_word: הַבָּמָה
  choice: 丘坛
  rationale: בָּמָה 是古代敬拜场所的专门用语；“丘坛”兼顾其传统宗教含义与原词的空间意象，比泛化为“神龛”更准确。
- source_word: עָשָׂה
  choice: 所建的
  rationale: 原词基本义为“做、制造”；在祭祀场所的语境中译作“建”自然明确，但不额外引入设立崇拜制度等解释。
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: 使以色列犯罪
  rationale: 保留 חטא 的使役形态，直接表达耶罗波安使以色列陷入罪中的责任。
- source_word: גַּם אֶת הַמִּזְבֵּחַ הַהוּא וְאֶת הַבָּמָה
  choice: 连那祭坛和丘坛，他也拆毁了
  rationale: 用“连……也……”体现 גַּם 与指示词形成的强调，同时保留祭坛与丘坛两个并列宾语。
- source_word: נָתָץ
  choice: 拆毁
  rationale: 准确表达拆除、摧毁建筑物的动作，措辞自然而有力度。
- source_word: וַיִּשְׂרֹף אֶת־הַבָּמָה
  choice: 他焚烧丘坛
  rationale: 保持 בָּמָה 前后一致；这里可指丘坛及其实体设施，译文不进一步限定。
- source_word: הֵדַק לְעָפָר
  choice: 把它碾成尘土
  rationale: 表达彻底粉碎至尘土状态的结果；“它”承接前句的丘坛。
- source_word: אֲשֵׁרָה
  choice: 亚舍拉
  rationale: 音译保留该词可指女神或与其崇拜有关的礼仪物件这一词义张力；具体语境很可能指可焚烧的礼仪物件，另以脚注说明。
theological_decisions:
- issue: אֲשֵׁרָה 的所指
  choice: 亚舍拉
  alternative: 亚舍拉柱；神木
  rationale: 该词既可指迦南女神亚舍拉，也常指与其崇拜相关的木制礼仪物件。本节焚烧的语境更支持物件义，但正文采用音译，以免消除原文仍保留的词义关联和含混性。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。“就是……——……——连……也……”保留希伯来文的同位说明、插入关系从句与强调性重复；“丘坛”作为宗教专门词保持全节一致。脚注标记置于“亚舍拉”之后，与注释对象准确对应。
