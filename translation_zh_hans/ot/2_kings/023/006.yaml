  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: zh_hans
  text: 他把亚舍拉[a]从雅威的殿中搬出，运到耶路撒冷城外的汲沦谷，在那里焚烧，又捣成尘土，把尘土撒在平民的坟墓上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚舍拉柱”或“亚舍拉像”。希伯来语“亚舍拉”既可指迦南女神亚舍拉，也可指与她的崇拜有关的物件；本节指被搬出并毁掉的崇拜物。
    reason: 保留原词在神祇名称与相关崇拜物之间的词义范围，并避免武断确定物件形制。
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: 亚舍拉
  rationale: 保留专名，以呈现其与迦南女神亚舍拉及相关崇拜物的特定联系；本节所指是可被搬运、焚烧和捣碎的崇拜物，但希伯来语并未明确其具体形制。
- source_word: מִבֵּית יְהוָה
  choice: 从雅威的殿中
  rationale: בֵּית在此指耶路撒冷圣殿；译作“殿”比逐字的“家”自然准确，同时保留神名雅威。
- source_word: מִחוּץ לִירוּשָׁלַם אֶל נַחַל קִדְרוֹן
  choice: 运到耶路撒冷城外的汲沦谷
  rationale: 表达移出圣殿并运往城外地点的方向；נַחַל可指谷地或季节性水道，此处采用通行地名“汲沦谷”。
- source_word: וַיָּדֶק לְעָפָר
  choice: 又捣成尘土
  rationale: 动词表示打碎、碾细；“捣成尘土”既保留动作力度，也与后文“尘土”形成词汇衔接。
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: 在平民的坟墓上
  rationale: בְּנֵי הָעָם在此很可能指与社会显贵相对的一般民众；“平民”简洁自然地表达这一社会含义。
theological_decisions:
- issue: אֲשֵׁרָה所指是女神还是崇拜物
  choice: 正文音译为“亚舍拉”，脚注说明本节指相关崇拜物
  alternative: 亚舍拉柱；亚舍拉像
  rationale: 上下文明确这是能被搬出、焚烧并捣碎的实体，但原词本身不足以确定它是木柱还是神像；音译并加注可避免超出文本作出形制判断。
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 采用现代汉语中对四字神名的常见学术音译，保留其作为以色列之神专名的性质，而不以称号替代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“搬出，运到”清楚呈现连续移动；后半句适度合并重复地点，使汉语自然，同时保留焚烧、捣碎和撒尘的动作次序。
