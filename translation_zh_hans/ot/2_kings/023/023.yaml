  text: 只是在约西亚王第十八年，这次逾越节才在耶路撒冷为雅威举行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: 只是……才
  rationale: 结合上一节，这是带限制意味的转折表达；“只是……才”在现代汉语中自然地传达“唯独到……才”的语气。
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: 在约西亚王十八年
  rationale: 按希伯来语王年纪年法直译，同时符合现代中文圣经历史叙事的常用表达。
- source_word: נַעֲשָׂה
  choice: 举行
  rationale: 原义为“被做、被办理”；以逾越节为主语时，指礼仪被举行。“举行”自然清楚，并保留脚注说明字面形式。
- source_word: הַפֶּסַח הַזֶּה
  choice: 这逾越节
  rationale: 保留定冠词加指示词的特指意义；“逾越节”是通行且清楚的中文译名。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל在此表达敬奉、归属或奉献的方向；“为雅威”简洁保留这一关系，并直接译出神名。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 直接表达地点关系，采用现代中文通行地名。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文明确使用四字神名；“雅威”较贴近学界通常重构的读音，也与所给英语审校层的最终神学决定一致。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“只是在……才……”衔接上文的否定陈述；“举行”避免生硬的“被做”，脚注则保留希伯来语被动表达的字面信息。
