  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: zh_hans
  text: 他玷污了欣嫩子谷中的陀斐特，使人不可让自己的儿子或女儿为摩洛从火中经过。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “让……从火中经过”是祭祀用语，指把儿女用于与摩洛有关的仪式，很可能是儿童献祭。
    reason: 说明古代祭仪习语，同时不把正文没有明说的细节绝对化。
  - marker: b
    text: “摩洛”或可译作“王”，但按本节语境，理解为神祇摩洛更为可能。
    reason: 保留希伯来语辅音形式所容许的较不可能读法。
lexical_decisions:
- source_word: וְטִמֵּא
  choice: 他又玷污了
  rationale: טמא 的加强词干表示“使不洁、污秽”。这里指约西亚使该祭祀场所不再适合宗教用途；“玷污”既准确，也比“亵渎”少一层解释。
- source_word: הַתֹּפֶת
  choice: 陀斐特
  rationale: 这是一个地名，采用现代中文圣经传统中易于辨认的音译。
- source_word: בְּגֵי בני הִנֹּם
  choice: 欣嫩子谷里
  rationale: גֵי 意为“谷”；בני הִנֹּם 是传统地名，直译为“欣嫩众子之谷”。“欣嫩子谷”保留其构词形式，也符合中文地名表达。
- source_word: לְבִלְתִּי לְהַעֲבִיר
  choice: 使任何人都不能再让……从火中经过
  rationale: לְבִלְתִּי 引出阻止性的目的；העביר 是使役形式，意为“使……经过”。“不能再”自然表达约西亚采取行动杜绝此事的目的，而不是单指能力。
- source_word: אִישׁ
  choice: 任何人
  rationale: 这里的阳性单数名词具有泛指作用；现代汉语用“任何人”最自然，也不误导读者以为禁令只涉及男性。
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: 自己的儿子或女儿
  rationale: 希伯来语用“和”连接，但在否定范围内，中文用“或”能自然表达两者中的任何一个。
- source_word: בָּאֵשׁ
  choice: 从火中经过
  rationale: 与使役动词 עבר 搭配，保留原文“使……从火中经过”的祭仪用语，不在正文中直接改写为“焚烧献祭”。
- source_word: לַמֹּלֶךְ
  choice: 归给摩洛
  rationale: 在此祭祀语境中，מֹלֶךְ 最可能是神祇名称“摩洛”；介词 ל־ 可表示对象或归属。“归给”既表现其指向，又避免在正文中过早把仪式完全释义为献祭。
theological_decisions:
- issue: 如何表达涉及儿童的“经火”祭仪
  choice: 正文保留“让……从火中经过”这一原文用语，并以脚注说明其祭祀含义
  alternative: 译作“把儿女用火献给摩洛”或“焚烧儿女献给摩洛”
  rationale: 上下文表明这是与摩洛有关、以儿童为对象的祭仪，很可能是儿童献祭；但原文本身采用“使……从火中经过”的习语。保留该措辞可避免把可能性直接写成原文未明说的细节。
- issue: מֹלֶךְ 的理解
  choice: 译作神名“摩洛”
  alternative: 译作“王”
  rationale: 本节的祭仪语境以及该词在相关经文中的通常用法都支持神名；不过，仅按辅音也可理解为“王”，因此在脚注中保留这一较不可能的读法。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“陀斐特”“欣嫩子谷”“摩洛”保留可识别的传统专名形式；句法避免文言化，同时保留原文祭仪用语的含混性。
