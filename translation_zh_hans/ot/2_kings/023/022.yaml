  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: zh_hans
  text: 因为自从治理以色列的士师的日子起，在以色列诸王和犹大诸王在位的一切日子中，从未守过像这逾越节一样的逾越节。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译为“像这逾越节一样”；这里指“像这一次所守的逾越节一样”。
    reason: 说明比较结构כַּפֶּסַח הַזֶּה，避免读者误以为经文声称此前从未守过任何逾越节。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上文，为约西亚所守的逾越节作解释，保留原文的因果、说明作用。
- source_word: נַעֲשָׂה
  choice: 守过
  rationale: עָשָׂה字面为“做、举行”；与“逾越节”搭配时，现代汉语用“守逾越节”自然且符合礼仪语境。
- source_word: כַּפֶּסַח הַזֶּה
  choice: 像这一次这样的逾越节
  rationale: 明确表达比较前缀כְּ与“这逾越节”的组合，避免误解为此前完全没有人守过逾越节。
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: 从……士师的日子以来
  rationale: 保留מִן所标示的时间起点及原文“日子”的表达，同时使中文通顺。
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: 那些治理以色列的
  rationale: 在中文中“士师审判以色列”容易被理解为司法定罪；“治理”较自然地表达士师在以色列中施行判断和领导的职分。
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: 乃至以色列诸王和犹大诸王在位的所有日子
  rationale: 在否定句中用“乃至”延展历史范围；补出“在位”使“诸王的日子”成为自然的现代汉语，并保留以色列与犹大两组君王的区分。
theological_decisions:
- issue: 历史比较的范围
  choice: 经文说，自士师时期至以色列和犹大诸王时期，都没有守过可与约西亚这一次相比的逾越节。
  alternative: 理解为此前根本没有守过任何逾越节，或将此句视为不作严格比较的夸张说法。
  rationale: כַּפֶּסַח הַזֶּה含有明确的比较意义，即“像这一次这样的逾越节”。译文保留这一限定，不对其历史性质作经文以外的裁定。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“士师”沿用通行的圣经历史称谓；“治理”避免“审判以色列”在现代汉语中可能造成的司法定罪误读。脚注标记置于整句末尾，对全句核心比较表达作说明。
