reference: 2 Kings 23:26
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: zh_hans
  text: 然而，耶和华仍没有转离他那熊熊燃烧的烈怒[a]——这怒气曾向犹大发作[b]，是因玛拿西所行的一切惹他发怒的事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “熊熊燃烧的烈怒”原文是一个形象的说法，字面涉及“鼻子／怒气的燃烧”，表示极其强烈的愤怒。
    reason: 说明希伯来语愤怒惯用语及其燃烧意象。
  - marker: b
    text: “向犹大”也可译作“在犹大中”；原文所用介词的字面意思是“在……中”，这里按发怒对象译为“向”。
    reason: 保留介词בְּ在此处的真实语义歧义。
lexical_decisions:
- source_word: אַךְ
  choice: 然而
  rationale: 承接约西亚改革的上文，表达强烈的转折关系。
- source_word: שָׁב
  choice: 仍没有转离
  rationale: 保留“转回、转离”的基本意象；“仍”结合上下文体现让步后的持续状态，而不直接解释为“息怒”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的神圣名译法。
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: 他的熊熊烈怒
  rationale: חֲרוֹן אַף是强烈怒气的惯用语；“熊熊烈怒”既保留燃烧意象，也自然表达הַגָּדוֹל所强调的强烈程度。
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: 他的怒气曾……发作
  rationale: 保留原文再次提到怒气的重复，并用自然中文表达怒气燃起、爆发的意象。
- source_word: בִּיהוּדָה
  choice: 向犹大
  rationale: ב字面可作“在……中”，但与发怒用语连用时在此指怒气所针对的对象；“向”既自然，又避免过度强化为“攻击”。
- source_word: עַל כָּל הַכְּעָסִים
  choice: 因为……所做的一切事
  rationale: 复数名词在语境中指惹动怒气的种种行为；中文以关系结构与下文同根动词衔接，比生硬的“激怒之事”更通顺。
- source_word: הִכְעִיסוֹ
  choice: 惹他发怒
  rationale: 准确体现使役词形“使他发怒”，并保留前后怒气词汇的呼应。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用通行的中文圣经人名译法。
theological_decisions:
- issue: 对上帝愤怒的拟人化表达
  choice: 保留“熊熊烈怒”和“怒气发作”的鲜明意象
  alternative: 译作较抽象的“极其不悦”或解释性更强的“没有息怒”
  rationale: 原文两次使用与鼻息、燃烧相关的愤怒惯用语；保留这种张力，不以系统神学解释削弱或改写经文。
- issue: 神圣名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文普通读者最熟悉且可直接识别的专名译法；正文不以头衔“主”取代专名。
- issue: 约西亚改革与审判未止之间的关系
  choice: 以“然而……仍没有”呈现对比，不补充审判为何不可逆的解释
  alternative: 增译为“尽管如此，耶和华仍不肯息怒”
  rationale: 原文强调改革之后怒气仍未转离，并把原因指向玛拿西的种种激怒行为；译文不额外断定上帝的意愿、悔改的效力或审判机制。
translation_notes:
  register: 采用庄重而现代的标准普通话。“熊熊烈怒”保留希伯来语燃烧意象，“怒气曾向犹大发作”保留原文对怒气的重复；后半句避免“激怒之事……激怒他”这类生硬重复，改用自然关系结构，同时维持因果关系。
