  terminology: “约雅敬”“耶路撒冷”“西布大”“比大雅”“鲁玛”均可用；“登基时”“作王”恰当，无须脚注。
  issues:
  - severity: low
    issue: “是鲁玛人比大雅的女儿”可能将鲁玛表述为族群身份，且其修饰关系在现代汉语中略显生硬。
    rationale: 原文的 מִן（“从、出自”）紧随“比大雅”，最稳妥的中文处理是将鲁玛作为比大雅的籍贯/来源表达为“鲁玛的比大雅”。这也避免无根据地把鲁玛理解成民族。
