  register: 采用现代、庄重而易懂的历史叙事语体。“登基时……作王……”准确再现希伯来王朝纪年公式。原文没有实质性歧义需要脚注；英文关于 Zebidah/Zebudah 的脚注属于英语转写传统差异，不适用于中文正文。
