base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: zh_hans
  text: 约雅敬登基时二十五岁，在耶路撒冷作王十一年。他母亲名叫西布大，是鲁玛的比大雅的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: 二十五岁
  rationale: 这是希伯来语表达年龄的惯用语；用现代汉语自然表达其确切含义。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 介词短语表示即位的时间；“登基时”简洁、自然，也符合列王纪的王朝记载语体。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词指施行王权；“作王”在中文圣经历史叙事中自然庄重。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 忠实表达其作王所在地。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 以自然现代汉语保留原文的母系姓名记载公式。
- source_word: זבידה
  choice: 西布大
  rationale: 按希伯来辅音与常见中文圣经人名译法音译。
- source_word: בַת פְּדָיָה
  choice: 比大雅的女儿
  rationale: 直接表达父女关系。
- source_word: מִן רוּמָה
  choice: 是鲁玛人
  rationale: מִן 在此表示籍贯或来源；结合中文语序，将地名归属自然地置于人名之前。
