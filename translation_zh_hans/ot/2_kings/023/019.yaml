base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: zh_hans
  text: 约西亚也除掉了撒马利亚各城中所有丘坛的殿宇；这些殿宇是以色列诸王为激起怒气[a]而建造的。他照着他在伯特利所做的一切来处置它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 根据上下文，所激起的是耶和华的怒气；原文在本句没有明说。
    reason: 说明原文省略但可从上下文辨认的对象，避免在正文中无标记地增补。
lexical_decisions:
- source_word: וְגַם
  choice: 也
  rationale: 承接上文，保留附加另一项行动的语气，现代汉语简洁自然。
- source_word: בָּתֵּי הַבָּמוֹת
  choice: 丘坛的庙宇
  rationale: בָּתֵּי 本义为“房屋、殿宇”，בָּמוֹת 指用于祭祀的“丘坛”；此译既保留建筑物的具体含义，也采用中文圣经语境中易懂的“丘坛”。
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: 撒马利亚各城中
  rationale: 这里的“撒马利亚”指原北国所属的地域，“各城中”准确表达复数及地域关系。
- source_word: לְהַכְעִיס
  choice: 为惹动怒气
  rationale: 保留目的含义，也保留原文未明说被激怒者的特点；“惹动怒气”在中文中可以不明列其所属者。
- source_word: הֵסִיר
  choice: 除掉
  rationale: 符合使役形在宗教改革语境中的含义，既可指废除，也可涵盖拆毁、清除。
- source_word: וַיַּעַשׂ לָהֶם
  choice: 也照样处置这些庙宇
  rationale: 希伯来语直译为“对它们做”，中文用“处置”表达其惯用含义，同时由“这些庙宇”明确代词所指。
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשָׂה
  choice: 他怎样……行了这一切，也照样
  rationale: 以自然的汉语对应结构表达比较关系，并保留“全部行动”的总体含义。
- source_word: בְּבֵית אֵל
  choice: 在伯特利
  rationale: 按地点短语直译，承接前文约西亚在伯特利所采取的行动。
theological_decisions:
- issue: לְהַכְעִיס 中被激怒者没有明说
  choice: 正文译为“为惹动怒气”，不补出对象
  alternative: 为惹动耶和华的怒气
  rationale: 上下文清楚暗示所指是耶和华，但本句希伯来原文省略对象；正文保留这种省略，脚注说明上下文含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“丘坛的庙宇”保留原文具体意象；后半句调整为汉语常见的“怎样……也照样……”结构，以避免生硬直译，同时不增加具体毁坏方式。
