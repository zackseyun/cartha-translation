base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: zh_hans
  text: 约雅敬把银子和金子交给法老，却向全国征税[a]，好照法老的命令[b]交出银子。他向国中的百姓强征银子和金子，各人按所核定的数额[c]缴纳，好交给法老尼哥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “向全国征税”也可译作“核定全国应纳的数额”或“向全国征收税赋”。希伯来语动词可指为缴款而核定数额、课税。
    reason: lexical_alternative
  - marker: b
    text: 直译“照法老的口”，意思是照法老的命令。
    reason: lexical_alternative
  - marker: c
    text: 也可译作“各人按所评定的数额”；较具解释性的译法是“各人按自己的财力”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: 向全国征税
  rationale: 该动词在使役形中以“地”为宾语，且上下文涉及交纳银子，表示对全国课以税赋或核定应纳款项。“向全国征税”以自然中文表达其财政含义；脚注保留“核定全国应纳的数额”这一较贴近词根的可能译法。
- source_word: הָאָרֶץ
  choice: 全国
  rationale: 这里指约雅敬统治下的地域及其居民；与“征税”搭配时，“全国”比直译“土地”更符合现代汉语，同时未将其限定为某个社会阶层。
- source_word: עַל פִּי פַרְעֹה
  choice: 照法老的命令
  rationale: 希伯来语字面为“照法老的口”，是表示按某人吩咐或命令行事的惯用语。
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: 各人按所核定的数额
  rationale: 该短语表明款额按个人分别核定。此译法保留“核定、估定”的词义，不进一步解释为按个人财力。
- source_word: נָגַשׂ
  choice: 强征
  rationale: 该动词含催逼、强行索取款项的意味；“强征”比中性的“收取”更能体现其强制色彩。
- source_word: עַם הָאָרֶץ
  choice: 当地的百姓
  rationale: 保留该词组指境内百姓的基本含义，又避免“地上的民”这类生硬表达，也不贸然把它限定为“平民”或特定政治群体。
- source_word: פַרְעֹה נְכֹה
  choice: 法老尼哥
  rationale: 采用现代中文圣经人名的常见音译“尼哥”。
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: 银子和金子
  rationale: 原文直接指银与金两种贵金属；“银子”在中文中兼能自然表达作为款项的白银，并保留与“金子”的对举。
- source_word: נָתַן
  choice: 交给
  rationale: 基本含义是“给”。在贡款语境中，“交给”自然且保持中性，没有把动作过度解释为正式偿付。
