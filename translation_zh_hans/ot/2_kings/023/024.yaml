id: 2KI.23.24
reference: 2 Kings 23:24
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: zh_hans
  text: 此外，约西亚还清除了招魂者、通灵者、家神、偶像，以及在犹大地和耶路撒冷所见到的一切可憎之物，为要实行祭司希勒家在耶和华的殿里找到的那卷书[a]上所记的律法。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “卷书”也可译作“书卷”。希伯来文此词指书写文献，古时常采用卷轴形式。
    reason: 说明该词可指书写文献及其常见的古代物质形式。
lexical_decisions:
- source_word: וְגַם
  choice: 此外……还
  rationale: 保留附加语气，并自然承接上文所述的改革行动。
- source_word: הָאֹבוֹת וְאֶת הַיִּדְּעֹנִים
  choice: 招魂的、行巫术的
  rationale: 两词在本处与受清除的人和物并列，指从事求问亡灵等禁忌术法的人；译文保留二者的并列，同时避免使用生僻旧称。
- source_word: הַתְּרָפִים
  choice: 家神
  rationale: 指家庭祭祀中使用的神像或神祇；“家神”简洁且能表达其宗教功能。
- source_word: הַגִּלֻּלִים
  choice: 偶像
  rationale: 这是对偶像带有鄙夷色彩的称呼；“偶像”在现代中文中清楚自然，但原词的贬斥意味难以完全复现。
- source_word: כָּל הַשִּׁקֻּצִים
  choice: 一切可憎之物
  rationale: 保留该词广泛的宗教和道德厌恶意味，不把它限缩为某一种偶像。
- source_word: נִרְאוּ
  choice: （犹大地和耶路撒冷的）
  rationale: 希伯来文直译为“被看见的”，在此表示这些事物存在于当地；中文采用地点定语表达，避免生硬的“被看见”。
- source_word: בִּעֵר
  choice: 清除了
  rationale: 该动词可指烧除或彻底除去；因宾语既包括人也包括物，“清除”既表达彻底性，又不武断指定同一种处理方式。
- source_word: לְמַעַן הָקִים
  choice: 为要实行
  rationale: 表达使律法的话得以确立并付诸实施的目的；“实行”比“应验”更符合本段律法改革的语境。
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: 律法条文
  rationale: דְּבָרִים 可指话语或事项；此处是书卷中记载并要付诸实行的律法内容，“条文”自然且具体。
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: 写在那卷书上的
  rationale: 保留介词“在……上”的表述，并用“卷书”提示古代书写载体可能是卷轴。
- source_word: בֵּית יְהוָה
  choice: 耶和华的殿
  rationale: 字面为“耶和华的家”，语境明确指圣殿；“殿”是现代中文圣经语体中清楚而庄重的表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用简体中文读者最熟悉且具专名功能的传统译名；不以“主”替换，从而保留原文神名与称号之间的区别。
- issue: לְמַעַן הָקִים 所表达的律法关系
  choice: 为要实行
  alternative: 为要确立／成全
  rationale: 本句强调约西亚借改革使书中律法付诸实践；“实行”避免把该短语误解为预言的应验，同时保留其目的关系。
- issue: 对招魂者和术士的处理方式
  choice: 清除了
  alternative: 烧尽了／杀掉了
  rationale: 原动词强调彻底除去，但并未说明所有列举对象都以同一具体方式处理；译文不额外断定杀戮或焚烧。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“招魂的、行巫术的”以动作者称谓呈现成对术语；“清除”适合同时统摄人员、祭祀物件和其他可憎之物。脚注标记已置于正文相关词语之后。
