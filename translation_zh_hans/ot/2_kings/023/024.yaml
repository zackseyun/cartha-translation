  naturalness: “招魂的、行巫术的”以“……的”作名词，在庄重现代叙事中略显悬置；改为“招魂者、通灵者”更自然。将长定语前置并收束为“那卷书上所记的律法”，句法更顺畅。
  terminology: “家神”“偶像”“可憎之物”“耶和华”均可保留。“通灵者”在此作为יַדְּעֹנִים的现代、宽泛对应语，避免把该词不必要地限定为泛义“巫术”。
