base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/040.yaml
  text: But they did not listen; instead[a], they kept acting according to their former custom.
translation:
  language: zh_hans
  text: 可是，他们不听，反而仍照着自己从前的习俗[a]行事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“仍照着自己从前的规例（或惯例）去做。”希伯来语 מִשְׁפָּט 可指规例、条例或惯常做法；这里指他们从前既有的敬拜方式。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: 可是……不
  rationale: 承接上文并带有轻微转折；“可是”比单纯的“并不”更自然地表达此处的对比。
- source_word: שָׁמֵעוּ
  choice: 不听
  rationale: שׁמע 在此兼有听从、理会的意味；“不听”保留了“听”与“回应”之间的张力，避免直接强化为“不服从”。
- source_word: כִּי אִם
  choice: 反而
  rationale: 该结构表达“不是如此，而是那样”的对比；“反而”简洁自然。
- source_word: כְּמִשְׁפָּטָם
  choice: 照着自己的……习俗
  rationale: מִשְׁפָּט 可指判例、规例或惯常做法；本节谈其持续的宗教行为，因此“习俗”最符合语境，同时脚注保留“规例、惯例”等词义。
- source_word: הָרִאשׁוֹן
  choice: 从前的
  rationale: 这里指他们先前已有的行事或敬拜方式；“从前的”比字面的“最初的”更符合现代汉语。
- source_word: הֵם עֹשִׂים
  choice: 仍……行事
  rationale: 分词结构表达持续或惯常的行为；“仍……行事”既体现延续性，也使中文表达自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不听”保留原文既可指没有听从、也隐含没有顺服的语义空间；“习俗”贴合宗教实践语境，但不把该词限定为正式法令。
