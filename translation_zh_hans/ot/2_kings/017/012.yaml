  text: וַ/יַּֽעַבְד֖וּ הַ/גִּלֻּלִ֑ים אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם לֹ֥א תַעֲשׂ֖וּ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: zh_hans
  text: 他们侍奉偶像[a]，雅威曾就这事对他们说：“你们不可这样做。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所用的词是对偶像的蔑称，带有“污秽的偶像”，甚至“粪偶像”一类的贬斥意味。
    reason: 保留 הַגִּלֻּלִים 在正文“偶像”一词中难以充分呈现的强烈贬义。
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: 他们侍奉
  rationale: עבד 的基本义是“服侍、事奉”，在宗教语境中指敬拜和效忠。“侍奉”既保留其词汇意义，也自然表达宗教崇拜。
- source_word: הַגִּלֻּלִים
  choice: 偶像
  rationale: 该词是对偶像的强烈蔑称，可能带有“污秽之物”甚至与“粪”相关的贬义联想。正文译作现代汉语中清楚自然的“偶像”，贬斥色彩见脚注。
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: 雅威曾论到这些偶像对他们说
  rationale: 关系词 אֲשֶׁר 在此把此前提到的偶像与随后引述的禁令联系起来；“曾”体现该命令先于他们的违犯。补出“这些偶像”使汉语指代清楚。
- source_word: לֹא תַעֲשׂוּ
  choice: 你们不可做
  rationale: 未完成式在此表达直接禁令；“不可”庄重而自然，保留命令的明确力度。
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: 这事
  rationale: דָּבָר 在这里泛指受禁止的行为或做法；“这事”准确、简洁，也符合现代汉语表达。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”以音译方式保留其作为以色列之神盟约名字的性质，不以称号替代。
- issue: עבד 在偶像崇拜语境中的表达
  choice: 侍奉
  alternative: 敬拜
  rationale: “敬拜”能直接说明宗教行为，但“侍奉”更完整地保留 עבד 所包含的服事、效忠和崇拜意涵，也维持经文中侍奉真神与偶像之间潜在的盟约张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“侍奉”保留宗教及盟约语境；引语中的“不可”体现神圣禁令的力度。
