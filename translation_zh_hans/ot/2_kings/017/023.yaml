  text: עַ֠ד אֲשֶׁר הֵסִ֨יר יְהוָ֤ה אֶת יִשְׂרָאֵל֙ מֵ/עַ֣ל פָּנָ֔י/ו כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד כָּל עֲבָדָ֣י/ו הַ/נְּבִיאִ֑ים וַ/יִּ֨גֶל יִשְׂרָאֵ֜ל מֵ/עַ֤ל אַדְמָת/וֹ֙ אַשּׁ֔וּרָ/ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: zh_hans
  text: 直到耶和华将以色列从他面前除去[a]，正如他借着[b]他所有的仆人——众先知所说的。于是，以色列被流放，离开自己的土地，到亚述去，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使以色列离开他的临在”。希伯来文直译为“从他的面前”。
    reason: 保留该希伯来习语较字面的表达，并提供较抽象而自然的替代译法。
  - marker: b
    text: 希伯来文直译为“借着……的手”，意思是“通过”。
    reason: 说明表示媒介或代理的希伯来语习语；标记紧接其在正文中的对应译词“借着”。
lexical_decisions:
- source_word: הֵסִיר
  choice: 除去
  rationale: 该词为סור的使役形，表示“使离开、除去”；“除去”保留使役含义，也符合本节审判语境，而不额外强化为“驱逐”。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对神圣四字名YHWH最通行、最易识别的音译。
- source_word: מֵעַל פָּנָיו
  choice: 从自己面前
  rationale: 希伯来文直译近于“从他的脸面前”；中文“从自己面前”自然地保留空间性和关系性的表达，并清楚表明反身所指是耶和华。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 正如他……所说的
  rationale: “正如”表达比较与应验关系；“所说的”在中文中自然承接先知传言的内容。
- source_word: בְּיַד
  choice: 借着
  rationale: “借着……的手”是表示媒介或代理的希伯来语习语；正文用自然中文“借着”，字面形式收入脚注。
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: 自己所有作先知的仆人
  rationale: 既保留先知是耶和华仆人的身份，也避免中文“仆人众先知”的生硬结构。
- source_word: וַיִּגֶל
  choice: 被流放
  rationale: 本语境中的גלה指强制迁移、放逐；被动表达符合亚述掳迁以色列的历史背景，也不必在正文补出未明说的施事者。
- source_word: אַדְמָתוֹ
  choice: 自己的土地
  rationale: “土地”保留领土和故土含义；“自己”与作为集合性民族名称的“以色列”自然呼应。
- source_word: אַשּׁוּרָה
  choice: 到亚述
  rationale: 词尾方向形式表示朝向亚述的移动，“到亚述”简洁准确。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是该希伯来时间套语在庄重现代中文中的自然表达。
theological_decisions:
- issue: מֵעַל פָּנָיו所表达的神圣审判与临在关系
  choice: 从自己面前
  alternative: 离开他的临在
  rationale: 所选译法保留原文具体的“面前”意象及其审判意味，却不把该短语抽象化为某种特定的临在教义。
- issue: 先知话语的媒介性
  choice: 借着自己所有作先知的仆人所说的
  alternative: 藉他众仆人先知之手所说的
  rationale: 正文明确耶和华是说话者、先知是传达者，同时不对默示方式作超出原文的界定；字面“手”的习语另见脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“直到……于是……”保留本节与前文相连的句法关系；“以色列”按原文作为集合性民族名称处理，不擅自改成“以色列人”。脚注标记均置于所解释的短语之后。
