revisions:
- from: 直到耶和华将以色列从自己面前除去[a]，正如他借着自己所有作先知的仆人所说的[b]。于是，以色列从自己的土地被流放到亚述，直到今日。
  to: 直到耶和华将以色列从他面前除去[a]，正如他借着[b]他所有的仆人——众先知所说的。于是，以色列被流放，离开自己的土地，到亚述去，直到今日。
  rationale: 修订不改变经文含义：保留“直到”引出的承接结构、神圣审判中“从他面前除去”的意象、先知作为传话媒介，以及从本土至亚述的流放方向。调整了中文措辞和脚注锚点，以提升自然度与结构对应性。
