base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: zh_hans
  text: 巴比伦人[b]造了疏割比讷[a]，古他人造了匿甲，哈马人造了亚示玛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “疏割比讷”可能是外邦神祇或崇拜物的名称；名称的含义并不确定，因此按音译处理。
    reason: cultural_note
  - marker: b
    text: 原文直译为“巴比伦的男人们”；后面的“古他人”和“哈马人”也使用同一说法。这里可泛指这些地方的居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: ……人
  rationale: 这是 אִישׁ（人、男人）的复数构造式，直译为“……的男人们”。在这里指各地的居民；现代汉语用“巴比伦人、古他人、哈马人”既自然，也不必把所指限定为男性。
- source_word: עָשׂוּ
  choice: 造了
  rationale: עָשָׂה 的基本义是“做、制造”。上下文涉及神像或崇拜物，但原文没有明确说“立”或“奉为神”，故保留较直接的“造了”。
- source_word: סֻכּוֹת בְּנוֹת
  choice: 疏割·比讷
  rationale: 此处看来是外邦神祇或崇拜物的专名，其词源和确切所指并不确定，因此按希伯来语音译，不把字面成分解释性地译出。间隔号表明这是一个由两部分组成的名称。
- source_word: כּוּת
  choice: 古他
  rationale: 地名音译；采用现代中文圣经读者较易辨认的传统译名。
- source_word: נֵרְגַל
  choice: 匿甲
  rationale: 美索不达米亚神祇的专名，采用中文传统音译，不另加“神”或“偶像”。
- source_word: חֲמָת
  choice: 哈马
  rationale: 地名音译，采用通行中文形式。
- source_word: אֲשִׁימָא
  choice: 亚示玛
  rationale: 外邦神祇的专名，按音译处理，以免加入原文没有明说的解释。
theological_decisions:
- issue: 是否在三个专名之前增添“神”“偶像”或“神像”
  choice: 正文只保留专名，不增添类别词
  alternative: 译作“造了疏割·比讷神”“造了匿甲偶像”等
  rationale: 原文只是“造了”加直接宾语。上下文表明这些名称与外邦崇拜有关，但本节没有明确使用“神”或“偶像”一词；不增译可保留神祇名称与崇拜物之间的真实歧义。
translation_notes:
  register: 采用简洁、庄重的现代标准汉语。三个分句保持原文重复而平行的结构；以“……人”自然表达地域群体，同时用脚注交代希伯来语的阳性复数形式。专名采用易辨认的中文传统音译。
