base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: zh_hans
  text: 于是，亚述王进军全国各地，又进攻撒马利亚a，围困那城三年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 进军
  rationale: עלה本义为“上去”，在军事叙事中常表示出兵推进；此处上下文是亚述王席卷国境并围城，因此译为“进军”既自然，也传达军事语境。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 这是希伯来语组合结构的标准、简洁中文表达，语境指一位特定的亚述君王。
- source_word: בְּכָל הָאָרֶץ
  choice: 整个国境
  rationale: 介词ב与“全地”连用，在此表示军队行经或遍及该地；“整个国境”表达其行动范围，同时避免增添原文未明说的具体军事方式。
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: 又上到撒马利亚
  rationale: 保留עלה“上去”的地理表达；在前文“进军”和后文“围困”的军事语境中，敌对推进的含义已清楚，无须在此重复增译“攻打”。
- source_word: וַיָּצַר עָלֶיהָ
  choice: 围困那城
  rationale: צור在此结构中指围城；阴性代词所指为撒马利亚，中文以“那城”明确指代并避免城市名与代词搭配生硬。
- source_word: שָׁלֹשׁ שָׁנִים
  choice: 三年
  rationale: 中文在“围困”之后直接用时长短语即可自然表达持续时间。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。首个עלה按军事语境译为“进军”，第二个则保留地势性较强的“上到”，兼顾上下文清晰度与原文词语重复。无需脚注，因为中文正文能够保留“上到”的基本意象，同时由“围困”明确其敌对背景。
