base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: zh_hans
  text: 这事发生，是因为以色列人得罪了他们的上帝雅威；他曾把他们从埃及地、从埃及王法老手下领上来，他们又敬畏别的神明。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏别的神明”也可译作“敬拜别的神明”。这里的希伯来语动词本义是“惧怕、敬畏”，用于神明时可包含敬拜和效忠之意。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: 这事发生，是因为
  rationale: 保留כי在此处的因果解释作用，并以现代汉语自然承接上文所述事件。
- source_word: חָטְאוּ בְנֵי יִשְׂרָאֵל לַיהוָה אֱלֹהֵיהֶם
  choice: 以色列人得罪了雅威他们的上帝
  rationale: חטא与ל连用表示“得罪、犯罪得罪”；“以色列人”自然表达民族整体，雅威则音译神圣四字名。
- source_word: הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: 雅威曾把他们从埃及地……领上来
  rationale: 分词回指雅威并描述其既往的拯救行动；“领上来”保留עלה的方向性和出埃及叙事色彩。
- source_word: מִתַּחַת יַד פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: 从埃及王法老的手下
  rationale: 保留希伯来语“在某人手下”的支配意象；现代汉语也能自然表达受其权势辖制。
- source_word: וַיִּירְאוּ אֱלֹהִים אֲחֵרִים
  choice: 他们却敬畏别的神明
  rationale: ירא的词义核心是惧怕或敬畏，在此包含宗教尊崇；“敬畏”保留原文宽度，“却”显明其与雅威救赎之恩的反差。
theological_decisions:
- issue: 神圣四字名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名；“雅威”以通行的学术音译保留其专名性质，不以称号取代。
- issue: ירא用于“别的神明”时是否直接译作“敬拜”
  choice: 敬畏
  alternative: 敬拜；畏惧
  rationale: 上下文确实涉及偶像崇拜，但原词的语义比“敬拜”更宽；译作“敬畏”可保留敬惧、尊崇乃至宗教效忠之间的张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“手下”保留原文权势辖制的意象；分号和“却”使救赎行动与以色列人的背叛形成清晰对照。
