source:
  edition: WLC
  text: וְ/אֶת הַ/חֻקִּ֨ים וְ/אֶת הַ/מִּשְׁפָּטִ֜ים וְ/הַ/תּוֹרָ֤ה וְ/הַ/מִּצְוָה֙ אֲשֶׁ֣ר כָּתַ֣ב לָ/כֶ֔ם תִּשְׁמְר֥וּ/ן לַ/עֲשׂ֖וֹת כָּל הַ/יָּמִ֑ים וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: zh_hans
  text: 他为你们写下的律例、典章、律法和诫命[a]，你们要永远谨守遵行[b]；不可敬畏[c]别神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律例、典章、律法和诫命”也可分别理解为“法规、裁决、训诲和命令”。原文连用四个含义重叠却各有侧重的盟约法律术语。
    reason: lexical_alternative
  - marker: b
    text: “谨守遵行”直译为“守着去行”，既强调持守，也强调实际实行。
    reason: lexical_alternative
  - marker: c
    text: 这里的“敬畏”不只是害怕，也包括对神祇的尊崇、敬拜性畏惧和效忠。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: 律例
  rationale: 指颁定的法规或条例；“律例”保留正式的盟约法律语体，并与下列法律术语有别。
- source_word: הַמִּשְׁפָּטִים
  choice: 典章
  rationale: 可指判例、裁决或法令；“典章”在庄重而易懂的中文法律—盟约语境中，能与“律例”形成适当区分。
- source_word: הַתּוֹרָה
  choice: 律法
  rationale: 本义可涵盖“教导、训诲”，但在此法律术语并列中，“律法”最能体现其盟约性用法。
- source_word: הַמִּצְוָה
  choice: 诫命
  rationale: 原文为单数集合性用法；“诫命”既保留单数形式，也符合本节庄重语体。
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: 他为你们写下的
  rationale: 保留原文隐含的第三人称单数主语“他”，不在本节正文中增添“耶和华”；其所指可由上下文确定。
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: 谨守遵行
  rationale: 原文把“守”与“行”结合；汉语固定搭配“谨守遵行”自然表达留心持守并付诸实行的双重含义。
- source_word: כָּל הַיָּמִים
  choice: 永远
  rationale: 直译为“所有的日子”，在此是持续时间的希伯来语惯用表达；“永远”以自然中文传达持续不断的义务。
- source_word: תִירְאוּ
  choice: 敬畏
  rationale: יָרֵא兼有惧怕、尊崇和敬虔效忠之意；在对待神祇的语境中，“敬畏”比单纯“害怕”更完整地保留其含义。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别神
  rationale: 这是指耶和华以外诸神的常见表达；“别神”简洁、庄重，并符合圣经语域。
theological_decisions:
- issue: 是否保留四个并列的盟约法律术语
  choice: 分别译作“律例、典章、律法和诫命”
  alternative: 合并为“律法和命令”等概括性说法
  rationale: 原文有意叠加四个彼此重叠却不完全相同的词；逐一保留可维持其修辞分量，避免抹平盟约义务的层次。
- issue: “写下”这一动作的主语
  choice: 正文保留“他”
  alternative: 明确译作“耶和华”
  rationale: 上下文表明所指是耶和华，但本节希伯来文只以动词形式隐含第三人称单数主语；保留“他”可避免把本节未明说的名词加入正文。
- issue: 对“别神”的“敬畏”应如何理解
  choice: 保留“敬畏”，兼具畏惧、尊崇和效忠的张力
  alternative: 直接译作“崇拜”或“侍奉”
  rationale: 语境确实涉及宗教效忠，但原词并不只等同于礼仪性的“崇拜”；“敬畏”更能保留原文语义范围而不替读者消解张力。
translation_notes:
  register: 采用现代、庄重而通顺的标准普通话。“谨守遵行”保留原文“守”与“行”的组合；“永远”自然表达希伯来语“所有的日子”的持续义。句末用分号突出正面命令与禁令之间的对照。
