base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: zh_hans
  text: 亚述王把人从巴比伦、古他、亚瓦[a]、哈马和西法瓦音迁来，安置在撒马利亚各城，取代以色列人[b]。他们占据了撒马利亚，住在其中的各城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚瓦”也可音译为“亚哇”。
    reason: lexical_alternative
  - marker: b
    text: “以色列人”原文直译为“以色列的子孙”或“以色列众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 迁来一些人
  rationale: 使役形在此表示王把人从所列各地带来；原文未明说宾语，但上下文清楚指被迁徙安置的人。“迁来一些人”既补足现代汉语所需宾语，也体现人口迁置的语境。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 以现代中文常用的国名加王号表达希伯来语属格结构，简洁自然。
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: 从巴比伦、古他、亚瓦、哈马和西法瓦音
  rationale: 均按传统且易辨识的中文圣经地名音译；עַוָּא 的音译形式另以脚注说明。
- source_word: וַיֹּשֶׁב
  choice: 把他们安置
  rationale: ישׁב 的使役形表示使这些迁来的人居住于当地；“安置”自然保留使役意义。
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: 在撒马利亚各城
  rationale: 保留“城”的复数；此处“撒马利亚”涵盖拥有多座城的地区，而不只指首府。
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: 取代以色列人
  rationale: תַּחַת 表示“代替、取代”；בְּנֵי יִשְׂרָאֵל 在此是民族整体称谓，现代汉语用“以色列人”准确且不误限于男性。
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: 他们占据了撒马利亚
  rationale: ירשׁ 在征服和移民语境中表示取得并持有土地；“占据”符合此处历史语境，避免“继承”可能引出的法律或神学联想。
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: 住在其中的各城
  rationale: 此处 ישׁב 是简单的居住；阴性单数后缀指回撒马利亚，“其中”在中文中清楚表达这一指代。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל 的性别形式与民族指称
  choice: 以色列人
  alternative: 以色列的子孙／以色列众子
  rationale: 该短语字面为阳性复数“以色列的儿子们”，但在此代表整个以色列民族，并非只指男性。“以色列人”保留民族指称范围，脚注列出较贴近形式的译法，以免掩盖原文表达。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“迁来—安置—占据—居住”清楚呈现亚述王实施迁民及移民定居的动作链。英文咨询层的脚注标记与内容疑似错位；本稿依据希伯来原文，将[a]用于亚瓦的音译异体，将[b]用于“以色列人”的字面表达。
