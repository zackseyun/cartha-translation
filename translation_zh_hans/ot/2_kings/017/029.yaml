base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: zh_hans
  text: 各族不断制造自己的神明，并把它们安放在撒玛利亚居民所建的丘坛的庙宇中；各族都在自己居住的城中如此安放。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: 仍不断制造
  rationale: “היה + 分词”在过去时叙事中表示持续或惯常的行动；“仍不断”体现这种反复进行的意味。
- source_word: גּוֹי גּוֹי
  choice: 各族
  rationale: 名词重复具有逐一分配的作用，表示每一个迁入当地的族群分别行动。
- source_word: אֱלֹהָיו
  choice: 自己的神明
  rationale: 保留原文所说各族制造各自之神的表达，不直接改释为“偶像”，以免提前加入评价性解释。
- source_word: וַיַּנִּיחוּ
  choice: 安放
  rationale: 此处指把所造的神明置于祭祀场所；“安放”自然且符合宗教设施语境。
- source_word: בְּבֵית הַבָּמוֹת
  choice: 在……丘坛庙宇里
  rationale: 字面为“丘坛之屋”，所指是与丘坛相连的祭祀建筑；“丘坛庙宇”兼顾原文形式和现代汉语可懂度。
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: 撒玛利亚居民所建的
  rationale: 这里首先指撒玛利亚地区的居民；如此表达可避免读者误以为必然是后世具有特定宗教身份的“撒玛利亚人”。
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: 在自己居住的城中
  rationale: 简洁表达“在他们居住于其中的各城”，并保留各族与其定居城市之间的归属关系。
theological_decisions:
- issue: הַשֹּׁמְרֹנִים 的历史身份
  choice: 撒玛利亚居民
  alternative: 撒玛利亚人
  rationale: 上下文指撒玛利亚地方的居民，并不要求读成后世宗派意义上的撒玛利亚人；正文采用地域性称呼，脚注保留较直接的译法。
- issue: אֱלֹהָיו 是否解释为偶像
  choice: 自己的神明
  alternative: 自己的偶像／神像
  rationale: 原文使用“神”而非专指偶像的词。正文保留叙事措辞及其神学张力，不在翻译中先行作出评价。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“仍不断”呈现惯常行动；末句“这样做”补足汉语所需的谓语，概括原文分配式结构，而不增加新的事件内容。
