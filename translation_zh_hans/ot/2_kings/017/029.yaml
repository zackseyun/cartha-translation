revisions:
- from: 各族仍不断制造自己的神明，把它们安放在撒玛利亚居民[a]所建的丘坛庙宇里；各族都在自己居住的城中这样做。
  to: 各族不断制造自己的神明，并把它们安放在撒玛利亚居民所建的丘坛的庙宇中；各族都在自己居住的城中如此安放。
  rationale: 删去可能过度限定时间关系的“仍”，并把末尾分配性地点短语明确关联到“安放”这一动作。“丘坛的庙宇”更清晰地呈现“丘坛之屋／与丘坛有关的祭祀建筑”的结构；历史称谓和脚注处理维持不变。
