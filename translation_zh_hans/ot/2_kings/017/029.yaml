    rationale: 原文的וַיִּהְיוּ עֹשִׂים表达过去的持续或惯常行为，但并未明确以“仍”对照某个此前阶段。
  - severity: medium
    issue: “各族都在自己居住的城中这样做”使末句的指向略宽。
    rationale: 原文末尾的分配性短语紧接在“安放”之后，最自然是说明各族在所居城市安放这些神明；“这样做”在汉语中可回指制造和安放的整体。
  revised_text: 各族不断制造自己的神明，并把它们安放在撒玛利亚居民所建的丘坛的庙宇中；各族都在自己居住的城中如此安放。
  revised_footnotes:
