  revision_rationale: 删去可能过度限定时间关系的“仍”，并把末尾分配性地点短语明确关联到“安放”这一动作。“丘坛的庙宇”更清晰地呈现“丘坛之屋／与丘坛有关的祭祀建筑”的结构；历史称谓和脚注处理维持不变。
