  text: וַ/יִּמְאַ֨ס יְהוָ֜ה בְּ/כָל זֶ֤רַע יִשְׂרָאֵל֙ וַ/יְעַנֵּ֔/ם וַֽ/יִּתְּנֵ֖/ם בְּ/יַד שֹׁסִ֑ים עַ֛ד אֲשֶׁ֥ר הִשְׁלִיכָ֖/ם מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: zh_hans
  text: 雅威厌弃了以色列所有的后裔[a]，使他们受苦，把他们交在掠夺者手中[b]，直到将他们从他面前赶走[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“以色列所有的种子”；这里的“种子”指后裔。
    reason: lexical_alternative
  - marker: b
    text: 或译：“把他们交给掠夺者掌控。”
    reason: idiom_clarification
  - marker: c
    text: 原文直译：“将他们从他面前抛出去。”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: 厌弃
  rationale: מָאַס表示拒绝、弃绝；“厌弃”既体现坚决拒绝，也符合本节审判语境，同时不把含义缩减为单纯的情绪性轻蔑。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: 以色列所有的后裔
  rationale: זֶרַע本义为“种子”，用于群体时指后代、后裔；“所有的后裔”自然清楚，并保留“所有”的全面措辞，不在译文中限定其范围。
- source_word: וַיְעַנֵּם
  choice: 使他们受苦
  rationale: ענה的Piel形式可表示使人受苦、苦待或压制；此处采用涵盖面较广的“使他们受苦”，避免仅限于社会压迫。
- source_word: וַיִּתְּנֵם בְּיַד
  choice: 把他们交在……手中
  rationale: נתן ביד是交付某人、使其落入另一方权势之下的惯用语；中文保留“在……手中”的意象，也自然易懂。
- source_word: שֹׁסִים
  choice: 抢掠者
  rationale: 该分词指实施掠夺、劫掠的人；“抢掠者”准确传达其暴力掠夺的含义。
- source_word: עַד אֲשֶׁר
  choice: 直到
  rationale: 引出前述行动持续到的终点；“直到”简洁自然。
- source_word: הִשְׁלִיכָם מִפָּנָיו
  choice: 将他们从自己面前赶走
  rationale: השליך本义为投、掷，结合מִפָּנָיו表达从神面前除去；“赶走”自然呈现驱逐结果，同时脚注保留更贴近字面的表达。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，因此以“雅威”音译，保留其专名性质，而不以“主”这一称号替代。
- issue: “以色列所有的后裔”的范围
  choice: 保留原文全面措辞，不在正文中限定范围
  alternative: 明确解释为仅指北国；解释为雅各每一个血缘后裔
  rationale: 原文说“以色列所有的后裔”。上下文涉及以色列国，但本节措辞本身具有张力，译文不应擅自缩小或绝对扩大其范围。
- issue: “从自己面前赶走”的含义
  choice: 保留空间性与关系性兼具的表达
  alternative: 解释为完全终止圣约关系；仅解释为迁离本地
  rationale: מִפָּנָיו可表达从神面前或临在中被除去。正文呈现这一意象，不进一步断定其全部神学后果。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“厌弃”“抢掠者”保持审判语境的力度；句式沿用原文连续动作的推进，并以“直到”明确终点。所有脚注标记均置于相应正文词组之后。
