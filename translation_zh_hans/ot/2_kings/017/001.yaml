  yaml_path: translation/ot/2_kings/017/001.yaml
  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: zh_hans
  text: 犹大王亚哈斯在位第十二年，以拉的儿子何细亚在撒马利亚登基作以色列王，共九年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 该动词在王朝纪年公式中表示开始执掌王权；中文用“登基作……王”自然地表达其即位，同时保留“作王”的含义。
- source_word: בְ/שֹׁמְרוֹן עַל יִשְׂרָאֵל
  choice: 在撒马利亚登基作以色列王
  rationale: “撒马利亚”是执政所在地，“以色列”是统治对象；此译法清楚保留两者关系。
- source_word: תֵּשַׁע שָׁנִים
  choice: 共九年
  rationale: 这是王朝纪年公式中的在位年数；“共九年”符合现代汉语简洁庄重的表达。
