  to: 他们厌弃他的律例、他与他们列祖所立的约[a]，以及他曾用以警戒他们的见证[b]。他们追随虚空之物，自己也变得虚空[c]；又随从他们周围的列国，就是耶和华曾吩咐他们不可效法的。
