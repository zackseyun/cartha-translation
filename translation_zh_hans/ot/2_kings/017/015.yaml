  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּמְאֲס֣וּ אֶת חֻקָּ֗י/ו וְ/אֶת בְּרִית/וֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת אֲבוֹתָ֔/ם וְ/אֵת֙ עֵֽדְוֺתָ֔י/ו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑/ם וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י הַ/הֶ֨בֶל֙ וַ/יֶּהְבָּ֔לוּ וְ/אַחֲרֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔/ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔/ם לְ/בִלְתִּ֖י עֲשׂ֥וֹת כָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: zh_hans
  text: 他们厌弃他的律例、他与他们列祖所立的约[a]，以及他曾用以警戒他们的见证[b]。他们追随虚空之物，自己也变得虚空[c]；又随从他们周围的列国，就是耶和华曾吩咐他们不可效法的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们的父辈”；“列祖”是合乎本处盟约历史语境的表达，指他们的先辈。
    reason: lexical_alternative
  - marker: b
    text: “他曾用以警戒他们的见证”也可译作“他向他们作证警告的话”或“他对他们的告诫”。
    reason: alternative_reading
  - marker: c
    text: 原文用同根词形成双关：他们追随“虚空”，自己也“变得虚空”，即变得空洞、徒然、毫无价值；在本语境中，“虚空之物”也可能暗指偶像。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: 厌弃
  rationale: 既表达主动拒绝，也保留 מָאַס 所含的轻视、摒弃意味；比单纯“拒绝”更符合盟约背叛的语境。
- source_word: חֻקָּיו
  choice: 他的律例
  rationale: “律例”准确保留法律与盟约规定的语义，并与“约”和“见证”相协调。
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: 他……所立的约
  rationale: כרת ברית 字面为“切约”，现代汉语惯用“立约”；此处转为“所立的约”，自然且忠实。
- source_word: אֲבוֹתָם
  choice: 他们列祖
  rationale: 原文是阳性复数“父辈”；“列祖”保留以色列盟约用语中的历史承继意味。
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: 他用来警戒他们的见证
  rationale: “见证”保留 עֵדוֹת 的盟约和作证含义，“警戒”表达 הֵעִיד 在此处的告诫功能；脚注注明另一种顺畅译法。
- source_word: הַהֶבֶל וַיֶּהְבָּלוּ
  choice: 虚空之物……变得虚空
  rationale: 以重复“虚空”再现名词 הֶבֶל 与同根动词的双关：人追随空虚、无价值之物，结果自己也成为同样空虚、无价值。
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: 周围的列国
  rationale: 简洁表达周边各民族国家；“列国”符合历史叙事语域。
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: 不可效法这些列国
  rationale: 表达字面的“不可像他们那样做”，又避免现代汉语中“不可像他们”所产生的残句感。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经读者最熟悉的专名形式音译四字神名，同时不将其改写为称号“主”。
theological_decisions:
- issue: “虚空之物”是否直接明确为偶像
  choice: 保留“虚空之物”
  alternative: 偶像／虚无的神明
  rationale: 本语境很可能指偶像，但 הֶבֶל 本身首先表示气息、空虚、无价值之物。保留较宽的表达，可维持原文的隐喻及“追随什么，就变成什么”的神学张力。
- issue: עֵדוֹתָיו 与 הֵעִיד בָּם 的关系
  choice: 他用来警戒他们的见证
  alternative: 他向他们作证警告的话／他对他们的告诫
  rationale: 原文兼有“见证”和“郑重警告”的可能；正文保留两层语义，不把它单一化为律法条款或普通劝告。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 使用中文公共圣经传统中广为人知的专名，不以一般称号代替原文专名；“雅威”是较接近学术重构发音的可选形式。
translation_notes:
  register: 采用庄重但可理解的现代标准汉语。“律例、立约、列祖”保留历史—盟约语域；句法则避免过度仿照希伯来语。正文以“虚空之物……变得虚空”重现原文刻意的同根词双关，并用脚注说明其偶像语境。
