  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: zh_hans
  text: 他们离弃了雅威他们上帝的一切诫命，为自己铸造了两个牛犊像，又造了亚舍拉[a]；他们向天上的万象下拜，并事奉巴力。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉”可指迦南女神，也可指与她相关的崇拜用物件；这里说“造了”，较可能是指这样的物件。
    reason: 保留希伯来词 אֲשֵׁירָה 在女神与相关崇拜用物件之间的词义歧义，同时避免“祭祀物”可能引起的祭品联想。
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: 离弃
  rationale: 此处指背弃与上帝的约，不只是一般意义的离开；“离弃”自然且保留其强烈含义。
- source_word: כָּל מִצְוֺת
  choice: 一切诫命
  rationale: 明确保留“全部”以及盟约语境中的“诫命”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名音译，保留上帝的专名，而不以称号替代。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 保留人称后缀，突出雅威本是与他们有盟约关系的上帝。
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: 为自己……铸造
  rationale: 保留间接受词所表达的为自身用途或敬拜而制作之意。
- source_word: מַסֵּכָה שנים עֲגָלִים
  choice: 铸造了两个牛犊像
  rationale: 马所拉正文表面上是单数“铸像”后接复数“两个牛犊”；中文合译为“两个牛犊像”，既保留铸造材质与两个牛犊的所指，也避免生硬的数不一致。
- source_word: אֲשֵׁירָה
  choice: 亚舍拉
  rationale: 采用音译，以保留该词可能指迦南女神或其祭祀物的歧义，并由脚注说明。
- source_word: וַיִּשְׁתַּחֲווּ
  choice: 下拜
  rationale: 保留俯伏敬拜的具体动作，不与后面的“事奉”合并。
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: 向天上的万象
  rationale: 该短语在此指天体群；“天上的万象”是现代中文自然而庄重的表达。
- source_word: וַיַּעַבְדוּ
  choice: 事奉
  rationale: 在偶像崇拜语境中表示宗教性的服事；与前面的“下拜”保持词义区分。
- source_word: הַבָּעַל
  choice: 巴力
  rationale: 按该迦南神祇的通行中文名称翻译；希伯来语冠词不必在中文中另行表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，音译“雅威”能保留其作为以色列上帝盟约之名的性质。
- issue: אֲשֵׁירָה 的所指
  choice: 正文音译“亚舍拉”，脚注保留两种可能
  alternative: 亚舍拉柱；亚舍拉女神
  rationale: “造了”使祭祀物较为可能，但该希伯来词本身也可指女神；正文不应擅自消除这种歧义。
- issue: מַסֵּכָה 与“两个牛犊”的数不一致
  choice: 译为“铸造了两个牛犊像”
  alternative: 造了一个铸像，就是两个牛犊；造了铸像——两个牛犊
  rationale: 原文单数名词与复数同位成分形成语法张力；中文采用意义上的复数表达，使经文可读，同时不引入原文没有的额外对象。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“离弃、诫命、下拜、事奉”保留经文的盟约与敬拜语域；并以分号梳理连续动作。
