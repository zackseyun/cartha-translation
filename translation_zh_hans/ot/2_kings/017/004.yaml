  text: וַ/יִּמְצָא֩ מֶֽלֶךְ אַשּׁ֨וּר בְּ/הוֹשֵׁ֜עַ קֶ֗שֶׁר אֲשֶׁ֨ר שָׁלַ֤ח מַלְאָכִים֙ אֶל ס֣וֹא מֶֽלֶךְ מִצְרַ֔יִם וְ/לֹא הֶעֱלָ֥ה מִנְחָ֛ה לְ/מֶ֥לֶךְ אַשּׁ֖וּר כְּ/שָׁנָ֣ה בְ/שָׁנָ֑ה וַֽ/יַּעַצְרֵ֨/הוּ֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּאַסְרֵ֖/הוּ בֵּ֥ית כֶּֽלֶא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: zh_hans
  text: 亚述王发现何细亚图谋反叛[a]，因为何细亚曾派使者去见埃及王梭[b]，又没有像往年一样向亚述王进贡[c]。于是亚述王拘押他，随后把他捆绑起来，关在监牢里[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译近于“在何细亚身上发现密谋”，意思是发现他有不忠的反叛图谋。
    reason: lexical_alternative
  - marker: b
    text: “梭”是希伯来名字的音译。这位埃及王在历史上的确切身份不能确定。
    reason: cultural_note
  - marker: c
    text: “进贡”也可译作“把贡物送上去”；希伯来文保留了向上呈送的表达。
    reason: lexical_alternative
  - marker: d
    text: 希伯来文区分两个动作：亚述王先拘押何细亚，随后把他捆绑起来，关进监牢。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: 发现
  rationale: 此动词本义为“找到”，在揭露隐秘政治行动的语境中译作“发现”自然准确。
- source_word: קֶשֶׁר
  choice: 图谋反叛
  rationale: 该名词指政治性的密谋或叛乱计划；“图谋反叛”既表达密谋，也明确其背叛宗主国的性质。
- source_word: בְּהוֹשֵׁעַ
  choice: 何细亚图谋
  rationale: 介词结构直译近于“在何细亚身上发现密谋”，中文以主谓结构自然表达，同时不把密谋误解为针对何细亚。
- source_word: שָׁלַח מַלְאָכִים
  choice: 曾派使者
  rationale: מַלְאָכִים 可指一般使者或外交使节；“使者”保留较宽的词义，而上下文足以显明外交性质。
- source_word: סוֹא
  choice: 梭
  rationale: 按希伯来名称音译，不采用任何存在争议的历史人物鉴定。
- source_word: מִנְחָה
  choice: 贡
  rationale: 该词可泛指礼物或供物，但在附庸与亚述王的国际政治关系中指贡物；与“进”组合成现代汉语常用的“进贡”。
- source_word: הֶעֱלָה
  choice: 进贡
  rationale: 动词字面有“使上去、带上去”之意；中文“进贡”既自然，又在一定程度上保留向君王呈上的方向感。
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: 像往年一样
  rationale: 该习语表示逐年惯常发生；此译符合现代汉语，并准确表达本年中断了以往按年进贡的惯例。
- source_word: וַיַּעַצְרֵהוּ
  choice: 拘押他
  rationale: 此动词可指扣留、限制或拘禁；“拘押”与下文捆绑关入监牢区分开，保留动作次序。
- source_word: וַיַּאַסְרֵהוּ
  choice: 把他捆绑起来
  rationale: 该动词的基本义是“捆绑”；直译可保留它与前一动词“拘押”的词义区别。
- source_word: בֵּית כֶּלֶא
  choice: 监牢里
  rationale: 该短语字面为“拘禁之屋”，现代汉语自然对应为“监牢”。
