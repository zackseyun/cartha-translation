base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: zh_hans
  text: 他们为自己竖立柱像和亚舍拉像，在各高冈上、各青翠树下[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉像”也可译作“亚舍林”，指与女神亚舍拉有关的祭祀物；其具体形制并不确定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: 竖立
  rationale: 使役形在此表示把祭祀物立起来；“竖立”自然、庄重，也适用于柱像和亚舍拉像。
- source_word: לָהֶם
  choice: 为自己
  rationale: 保留与主语相关的受益与自用意味。
- source_word: מַצֵּבוֹת
  choice: 柱像
  rationale: 指立起用于祭祀的石柱；“柱像”比单纯“柱子”更能传达其宗教用途，同时不额外指定形制。
- source_word: וַאֲשֵׁרִים
  choice: 亚舍拉像
  rationale: 希伯来语复数指与亚舍拉有关的祭祀物，其具体形制未必都是杆柱；“亚舍拉像”保持关联，也避免过度确定材质与形状。
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: 在各高冈上
  rationale: 准确保留地点意象和原文“每一”的遍布意味；“各”在现代汉语中更简洁自然。
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: 各青翠树下
  rationale: רַעֲנָן 描写枝叶繁茂、鲜绿；“青翠”自然地保留这种视觉意象。
theological_decisions:
- issue: אֲשֵׁרִים 的所指与形制
  choice: 亚舍拉像
  alternative: 亚舍拉柱；亚舍拉木偶；亚舍林
  rationale: 该词最稳妥地指与亚舍拉有关的祭祀物，但原文未明确限定其材质和具体形状。“亚舍拉像”便于普通读者理解，同时用脚注保留术语及其不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体；保留原文成对地点短语的节奏。“柱像”与“亚舍拉像”明确其祭祀语境，但不把亚舍拉祭祀物过度具体化为木杆。
