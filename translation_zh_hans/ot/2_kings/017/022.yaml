  text: וַ/יֵּֽלְכוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/כָל חַטֹּ֥אות יָרָבְעָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה לֹא סָ֖רוּ מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/022.yaml
  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: zh_hans
  text: 以色列人随从耶罗波安所犯的一切罪，从未脱离[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“没有离开它”；这里的阴性单数代词可能集体指上文所说的罪，或指由这些罪构成的罪恶行事方式。
    reason: 说明原文末尾为阴性单数代词，并保留其所指的解释空间；正文以汉语省略宾语，避免将其不必要地具体化。
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 行
  rationale: הלך与介词ב连用，在这里指遵行或持续采取某种行为方式；“行……罪”既保留希伯来语“行走”的表达色彩，也符合现代汉语的经文语体。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 指以色列民族整体。“以色列人”比直译“以色列的儿女”更自然清楚，同时不损失民族与群体含义。
- source_word: בְּכָל חַטֹּאות
  choice: 一切罪
  rationale: 直接表达原文复数所指的各种具体罪行；“一切”体现כָל的全面性。
- source_word: יָרָבְעָם אֲשֶׁר עָשָׂה
  choice: 耶罗波安所犯的
  rationale: עָשָׂה本义为“做”，但与“罪”搭配时，现代汉语自然说“犯罪”，准确传达语境中的道德含义。
- source_word: לֹא סָרוּ
  choice: 始终没有离开
  rationale: סור意为离开、偏离或转离；结合上下文，“始终”自然表达他们持续不肯离开的状态，并未增添新的事件。
- source_word: מִמֶּנָּה
  choice: 这条罪路
  rationale: 原文为阴性单数代词，可能把前述诸罪统摄为一种罪恶道路或行为模式。译为“这条罪路”使现代汉语指代清楚，同时用脚注保留其语法形式和解释空间。
theological_decisions:
- issue: 末尾阴性单数代词מִמֶּנָּה的所指
  choice: 正文译作“没有离开这条罪路”，将前述耶罗波安的一切罪理解为整体性的罪恶道路或行为模式。
  alternative: 译作“没有离开这些罪”，使代词直接呼应前面的复数“罪”。
  rationale: 希伯来语使用阴性单数后缀，而前面的“罪”为复数，因此不宜在正文中无说明地改成复数指代。“罪路”保留“行”的道路隐喻，也体现单数的集合性，但脚注说明原文形式及其可能所指，避免把解释绝对化。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“行……罪”略带经文语体，用来保留原文的道路隐喻；“这条罪路”使末尾单数代词在汉语中有明确而自然的落点。
