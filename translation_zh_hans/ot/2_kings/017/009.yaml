id: 2KI.17.9
reference: 2 Kings 17:9
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: zh_hans
  text: 以色列人暗中做了得罪耶和华、他们上帝的错事[a]，又在他们各城为自己建造丘坛[b]，从瞭望塔到坚固城[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “暗中做了”所译的希伯来语动词十分罕见，也可理解为“掩盖了”；整句也可能译作“掩盖了有关耶和华他们上帝的不当之事”。
    reason: lexical_alternative
  - marker: b
    text: “丘坛”原文指地方性的敬拜场所，通常与高处有关，常与未经认可的敬拜有关。
    reason: cultural_note
  - marker: c
    text: “从瞭望塔到坚固城”是首尾兼举的说法，表示遍及各地，从小型守望据点到坚固城邑。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: 暗中做了
  rationale: 该动词罕见，可能表示暗中行事，也可能表示掩盖。正文采用符合上下文且自然的“暗中做了”，并以脚注保留“掩盖”的可能。
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: 错事
  rationale: 这是带有道德评判的习语；译作“错事”简洁自然，又不具体限定这些行为的性质。
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: 得罪耶和华他们的上帝
  rationale: 此处 עַל 在背约与非法敬拜的语境中具有敌对意味；“得罪”比生硬的“反对”更符合现代汉语，并保留行为针对上帝的道德含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中广为人知的神名音译。
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: 为自己修筑祭坛
  rationale: בָּמוֹת 指地方性的敬拜场所，常与不蒙许可的敬拜有关。“祭坛”便于普通读者理解；脚注说明其范围不一定仅指单一坛体。
- source_word: בְּכָל עָרֵיהֶם
  choice: 在他们所有的城邑
  rationale: “城邑”可涵盖大小聚落，适合下文从瞭望塔到设防城的范围表达。
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: 从瞭望塔
  rationale: 该短语直指守望者使用的塔楼，也是首尾兼举表达中的较小据点。
- source_word: עַד עִיר מִבְצָר
  choice: 直到设防城
  rationale: 准确表达有防御工事的城市，并与“瞭望塔”共同表示遍及全境。
theological_decisions:
- issue: 以色列隐秘行为的性质
  choice: 译为暗中实施得罪上帝的具体错事
  alternative: 掩盖有关耶和华他们上帝的不实之事
  rationale: 罕见动词既可涉及隐秘行动，也可涉及遮掩；下文修筑敬拜场所支持具体行为的理解，但脚注保留词义歧义。
- issue: עַל 的关系含义
  choice: 得罪耶和华
  alternative: 关于耶和华
  rationale: 全段描述背约和不正当敬拜，敌对或冒犯义较合语境；不过不把它扩展为更具体的神学判断。
- issue: בָּמוֹת 的敬拜性质
  choice: 正文译“祭坛”并用脚注解释为地方敬拜场所
  alternative: 邱坛／高处
  rationale: 原词可能涵盖建在高处或高台上的地方性敬拜设施；现代读者通常难以直接理解“邱坛”，故正文采用功能性表达，同时避免在脚注中断言每一处都只是一座祭坛。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“暗中做了……错事”保留隐秘性与道德评价；“城邑”“设防城”略具经文体色彩但仍易懂。所有脚注标记均置于相应正文词组之后。
