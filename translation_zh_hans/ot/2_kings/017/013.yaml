source:
  edition: WLC
  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: zh_hans
  text: 耶和华曾借着他的每一位先知和每一位先见，郑重警告[a]以色列和犹大，说：“你们要离开你们的恶道，谨守我的诫命和律例，遵照我吩咐你们列祖[b]、又借着我的仆人众先知传给你们[c]的一切律法。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “郑重警告以色列和犹大”也可译作“向以色列和犹大郑重作证”或“郑重指控以色列和犹大”。希伯来语动词兼有庄严警告、作证的含义。
    reason: lexical_alternative
  - marker: b
    text: “列祖”也可理解为“祖先”。
    reason: lexical_alternative
  - marker: c
    text: “借着我的仆人众先知传给你们”也可译作“通过我的仆人众先知传给你们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: 郑重警告
  rationale: 该动词在使役词干中可表示严正作证、告诫或警告；上下文随后是悔改呼召，并处于审判叙事之中，因此“郑重警告”自然地体现其庄严力度，同时以脚注保留“作证指控”的可能性。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的形式音译四字神名，不用称号“主”代替其专名。
- source_word: בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: 以色列和犹大
  rationale: 在“警告”之后作为受事处理，清楚表达警告所针对的两个国度；希伯来介词所容许的对抗或指控意味收入脚注。
- source_word: בְּיַד כָּל נביאו כָל חֹזֶה
  choice: 借着他所有的先知和每一位先见
  rationale: “借……的手”是表示媒介的习语，译作“借着”；保留两次כָּל的周遍、分配意味，并区分“先知”和“先见”。
- source_word: חֹזֶה
  choice: 先见
  rationale: 该词指领受异象的人；“先见”是中文圣经历史叙事中准确且可识别的对应词。
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: 你们要离开自己的恶道
  rationale: שׁוּב在此与“从……道路”连用，表示转离；“离开恶道”在现代中文中自然，并保留道德道路的隐喻。
- source_word: וְשִׁמְרוּ
  choice: 谨守
  rationale: שׁמר在盟约和律法语境中表示遵守、持守；“谨守”兼有服从与慎重持守之意。
- source_word: מִצְוֺתַי חֻקּוֹתַי
  choice: 我的诫命和律例
  rationale: 分别保留两个法律术语，不将其合并；“诫命”和“律例”庄重、明确且为现代中文读者所熟悉。
- source_word: כְּכָל הַתּוֹרָה
  choice: 遵照……一切律法
  rationale: 在诫命、律例和盟约的语境中，תּוֹרָה译作“律法”最贴切；“一切”保留כָּל的完整范围。
- source_word: אֲשֶׁר צִוִּיתִי אֶת אֲבֹתֵיכֶם
  choice: 我吩咐你们列祖
  rationale: אָבוֹת在此指以色列先前世代的父祖；“列祖”保留盟约历史色彩，脚注说明也可泛指祖先。
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: 又借着我的仆人众先知传给你们的
  rationale: 将“借……的手”自然译为“借着”，并使关系从句主要修饰“一切律法”；“传给”表达律法或训示经先知媒介送达，脚注保留较直译的“差送”。
theological_decisions:
- issue: “又传给你们的”所指为何
  choice: 语序使关系从句主要承接“一切律法”，即上帝借先知把同一盟约训示传给百姓。
  alternative: 该从句也可较宽泛地指先知所传的一切信息，或承接前面的“离开恶道、谨守”这一命令整体。
  rationale: 希伯来句法最自然地让关系从句继续描述“律法”，但其表达仍容许较宽的语义关联；正文不增添解释性限定，避免排除这种张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“郑重警告”“谨守”“诫命和律例”“一切律法”保留盟约语境的力度；“先见”保留与“先知”不同的称谓。句法尽量贴近希伯来语，同时调整为自然中文。
