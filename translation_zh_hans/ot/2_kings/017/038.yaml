source:
  edition: WLC
  text: וְ/הַ/בְּרִ֛ית אֲשֶׁר כָּרַ֥תִּי אִתְּ/כֶ֖ם לֹ֣א תִשְׁכָּ֑חוּ וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: zh_hans
  text: 你们不可忘记我与你们所立的约[a]，也不可敬畏别的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“我与你们所切的约”；“切约”是希伯来语表示“立约”的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִית
  choice: 约
  rationale: “约”是现代汉语圣经语境中自然且准确的对应词，保留了上帝与百姓之间正式、具有约束力的关系含义。
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: 我与你们所立的
  rationale: 希伯来语字面为“我与你们所切的”，其中“切约”是立约惯用语；汉语用“立约”自然传达其意义。
- source_word: לֹא תִשְׁכָּחוּ
  choice: 你们不可忘记
  rationale: לֹא 加未完成式在此表达禁令；“不可”兼具清楚的命令语气和庄重的盟约语体。
- source_word: וְלֹא תִירְאוּ
  choice: 也不可敬畏
  rationale: יָרֵא 在涉及神明的盟约语境中不只指情绪上的害怕，也可指宗教性的敬畏与效忠；“敬畏”保留这种语义张力。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直接表达以色列的上帝以外的神明，符合本段排他性盟约忠诚的语境，也不额外限定为外族神。
theological_decisions:
- issue: 禁令的语气
  choice: 采用“不可……也不可……”的命令式表达
  alternative: 采用“你们必不……”的陈述式表达
  rationale: 希伯来语形式既可呈现为禁令，也可在某些译法中呈现为“必不”；上下文是盟约训令，因此“不可”在现代汉语中更清楚自然。
- issue: יָרֵא 在“别的神”之前的含义
  choice: 译为“敬畏”
  alternative: 译为“惧怕”或“崇敬”
  rationale: “敬畏”既保留畏惧的成分，也能表达宗教性的尊崇和效忠；“惧怕”可能过度收窄为情绪，“崇敬”则可能消除原词的畏惧色彩。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“我与你们所立的约”前置后以“你们不可忘记”承接，保留原文强调“约”的语序；“也不可”自然连接两项禁令。
