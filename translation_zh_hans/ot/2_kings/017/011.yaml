  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: zh_hans
  text: 他们在那里，在各丘坛上烧香，仿效那些雅威曾从他们面前赶走的列国[a]；他们又行恶事，惹雅威发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威曾从他们面前迁走的列国。”这个希伯来语动词可指使人迁走或放逐；这里指那些列国被逐离这片土地。
    reason: 保留 הֶגְלָה 的词义选择及其在征服语境中的具体含义。
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: 烧香
  rationale: קטר 的强意形在祭祀语境中表示使祭物烟气上升，常特指焚香；本节涉及丘坛敬拜，译作“烧香”自然且准确。
- source_word: שָׁם
  choice: 在那里
  rationale: 直接保留地点副词，承接上文所说的敬拜场所。
- source_word: בְּכָל בָּמוֹת
  choice: 在各丘坛上
  rationale: במות 是列王纪中指祭祀场所的专门用语；“丘坛”保留其宗教含义，“各”自然表达“所有、每一处”。
- source_word: כַּגּוֹיִם
  choice: 仿效……列国
  rationale: 这里比较的是以色列人的敬拜行为与先前居住在当地的列国；“仿效”清楚表达比较及行为上的效法，而不引入后期“外邦人”的术语色彩。
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: 雅威曾从他们面前赶走的
  rationale: גלה 可表示迁移、放逐或使人离开；在征服土地的语境中，“赶走”自然表达这些民族被移出土地的意思，同时以脚注保留“放逐”的词义可能。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中常见的音译呈现四字神名，而不以称号替代。
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: 他们又行恶事
  rationale: 简明保留原文宽泛的道德定罪，不将其限定为某一类罪行。
- source_word: לְהַכְעִיס
  choice: 惹……发怒
  rationale: כעס 的使役形表示使对方生气；“惹雅威发怒”在现代汉语中清楚、自然，并完整表达使役含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；采用音译“雅威”保留其专名性质，避免以称号取代。
- issue: 征服语境中 הֶגְלָה 的含义
  choice: 赶走
  alternative: 放逐；迁走
  rationale: 上下文指列国在以色列人面前失去土地。“赶走”贴合此历史语境；脚注同时保留该动词可指放逐或迁离的词义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“丘坛”作为列王纪祭祀场所的专门用语予以保留；句式维持叙事的紧凑并列结构。
