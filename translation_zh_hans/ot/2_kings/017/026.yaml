source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: zh_hans
  text: 于是有人向亚述王禀告说：“你掳来并安置在撒玛利亚各城的那些民族，不知道这地方之神[a]的规矩[b]；所以他派狮子到他们中间。看哪，狮子正在杀害他们，因为他们不知道这地方之神的规矩。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地方之神”在叙事语境中所指为以色列的神；这里的说法保留了禀告者把他看作地方神明的视角。也可译作“这地方的上帝”。
    reason: 保留引语中异教视角与实际所指之间的神学张力；汉语无法用英文大小写呈现这一区别。
  - marker: b
    text: “规矩”也可译作“律法”“定例”或“规定的做法”；这里指这地方之神所要求的敬拜方式。
    reason: 说明 מִשְׁפָּט 在此处的礼仪规范含义及可行译法。
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: 那些民族
  rationale: 这里指亚述强制迁入的多个族群；“民族”保留其群体含义，也避免“外邦人”可能带来的后期宗教色彩。
- source_word: הִגְלִיתָ וַתּוֹשֶׁב
  choice: 你迁来并安置
  rationale: 两个使役动词分别表达强制迁移和安置定居；从撒玛利亚的叙述视角用“迁来”，在现代汉语中自然，并保留亚述王是行动施行者。
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: 在撒玛利亚各城
  rationale: “各城”准确表达复数，且表明撒玛利亚在此是一个地区，不只指首府。
- source_word: מִשְׁפַּט
  choice: 规矩
  rationale: 此处不是司法判决，而是当地神明所要求的敬拜规范或惯例。“规矩”兼顾规范性和宗教实践含义；“律法”容易显得过度法典化。
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: 这地方之神
  rationale: 保留说话者把神理解为地方性神明的视角；“这地方”自然表达定冠词所指的当地。汉语没有大小写之分，故以脚注说明其所指与视角。
- source_word: וַיְשַׁלַּח בָּם אֶת־הָאֲרָיוֹת
  choice: 所以他派狮子到他们中间
  rationale: 以“所以”呈现话语中的因果关系；“到他们中间”贴合 בָּם，主语“他”承接“这地方之神”。
- source_word: וְהִנָּם
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意和增强现场感的功能，并维持庄重的经文语体。
- source_word: מְמִיתִים אוֹתָם
  choice: 狮子正在咬死他们
  rationale: 分词表示持续发生的行动；明说“狮子”避免汉语代词指向含混，“咬死”自然表达猛兽致人死亡。
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: 因为他们不知道
  rationale: 上下文表明该短语说明狮子杀人的原因，“因为”清楚呈现其因果作用。
theological_decisions:
- issue: “这地方之神”所指及说话者的视角
  choice: 正文译作“这地方之神”，脚注说明所指可能是以色列的神
  alternative: “这地方的上帝”
  rationale: 引语中的人按照地方神明的观念描述以色列的神。正文保留这种异教视角，不把叙述者的神学判断直接放进说话者口中；同时脚注说明实际所指，以免汉语没有英文大小写区别而掩盖张力。
- issue: מִשְׁפַּט 的宗教含义
  choice: 规矩
  alternative: 律法；定例；敬拜规矩
  rationale: 本节强调人们不知道当地神明所要求的敬拜方式。“规矩”保留“规范、惯例、要求”之间的语义空间，不把它限定为成文律法，也不在正文中增添“敬拜”一词。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“禀告”符合臣民向君王报告的场景；“看哪”保留原文的强调。“这地方之神”刻意保留引语中的地方神观念，不以现代汉语中通常指独一真神的“上帝”直接消解其张力。
