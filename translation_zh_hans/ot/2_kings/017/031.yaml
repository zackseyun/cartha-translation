  text: וְ/הָ/עַוִּ֛ים עָשׂ֥וּ נִבְחַ֖ז וְ/אֶת תַּרְתָּ֑ק וְ/הַ/סְפַרְוִ֗ים שֹׂרְפִ֤ים אֶת בְּנֵי/הֶם֙ בָּ/אֵ֔שׁ לְ/אַדְרַמֶּ֥לֶךְ וַֽ/עֲנַמֶּ֖לֶךְ אלה ספרים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: zh_hans
  text: 亚瓦人[a]造了尼伯哈斯和他珥他克；西法瓦音人常用火焚烧自己的儿子[b]，献给西法瓦音的神亚得米勒和亚拿米勒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或作“亚文人”。
    reason: 族名的另一种音译。
  - marker: b
    text: 意思是，他们把自己的儿子用火焚烧，作为祭物献给这些神。
    reason: 说明这里所描述的是以焚烧方式献上的儿童祭。
lexical_decisions:
- source_word: הָעַוִּים
  choice: 亚瓦人
  rationale: 这是复数族群称谓，指亚瓦的居民；采用音译，并用“人”构成现代汉语族群名称。
- source_word: עָשׂוּ
  choice: 造了
  rationale: 原文直接以两位神祇之名作宾语。“造了”保留原文简洁的表达，并含蓄表明所造的是敬拜用的形像，不在正文中额外添加“偶像”。
- source_word: נִבְחַז וְאֶת־תַּרְתָּק
  choice: 尼伯哈斯和他珥他克
  rationale: 二者均为神祇专名，按希伯来语形式音译。
- source_word: הַסְפַרְוִים
  choice: 西法瓦音人
  rationale: 这是指西法瓦音居民的复数族称，用地名加“人”自然表达。
- source_word: שֹׂרְפִים
  choice: 常……焚烧
  rationale: 分词在本段列举各族惯常宗教行为的语境中具有持续或习惯性意味；“常”使这种意味在现代汉语中清楚自然。
- source_word: אֶת־בְּנֵיהֶם בָּאֵשׁ
  choice: 把自己的儿子放在火中焚烧
  rationale: 保留 בנים 的性别限定“儿子”，并把“在火中”按汉语语序自然嵌入焚烧动作。
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: 献给……亚得米勒和亚拿米勒
  rationale: 介词 לְ 表示祭献的对象或归属；“献给”准确传达献祭语境，又不改变受祭者的身份。
- source_word: אלה ספרים
  choice: 西法瓦音的神
  rationale: 这组词把亚得米勒和亚拿米勒说明为与西法瓦音相关的神；按原文复数所指，以汉语集合式“神”自然表达。
theological_decisions:
- issue: 是否明确说尼伯哈斯和他珥他克是偶像或神像
  choice: 正文保留“造了尼伯哈斯和他珥他克”
  alternative: “造了尼伯哈斯和他珥他克的偶像（或神像）”
  rationale: 原文只有“造”加专名。上下文虽指向祭祀形像，正文仍不添加原文未明说的名词，以保留其简练和含蓄。
- issue: 是否将 בְּנֵיהֶם 泛化为“孩子”
  choice: 儿子
  alternative: 孩子
  rationale: 原词为阳性复数“儿子”；没有充分语境理由将其泛化，因此保留性别信息。
- issue: 是否把焚烧仅译作一次性的过去事件
  choice: 常把……焚烧
  alternative: 把……焚烧了
  rationale: 原文使用分词，并处于描述各族惯常祭祀活动的段落中；译出习惯性较能保存其语法和语境作用。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语；专名以常见圣经汉语形式为基础，同时尽量贴近希伯来语。分号区分两个族群的祭祀行为，“常”表达分词所含的惯常性。
