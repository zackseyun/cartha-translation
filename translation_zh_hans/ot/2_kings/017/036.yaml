source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: zh_hans
  text: 但你们要敬畏那位曾以大能和伸展的膀臂把你们从埃及地领上来的雅威[a]；要向他下拜，向他献祭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 开头也可译作：“惟有那位……的雅威，你们要敬畏他。”希伯来语在这里把雅威与上文所说的别神相对照。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: 但
  rationale: 该短语承接上文不可敬畏别神的禁令，形成鲜明对比；“但”自然地表达“不是那些神，而是雅威”的转折关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的常见汉语音译处理，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: הֶעֱלָה אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: 把你们从埃及地领上来
  rationale: 保留עלה使役式“使上来、领上来”的空间意象，也保持出埃及叙事的固定表达。
- source_word: בְּכֹחַ גָּדוֹל
  choice: 以大能
  rationale: 介词ב在此表凭借或方式；“以大能”简洁、庄重，并准确传达神施行拯救的力量。
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: 和伸出的膀臂
  rationale: 直译这一出埃及传统用语，保留神以可彰显之能力施行拯救的具象表达。
- source_word: אֹתוֹ תִירָאוּ
  choice: 你们要敬畏他
  rationale: ירא在本段同时涉及畏惧、尊崇和忠于盟约；“敬畏”保留这种丰富含义，避免缩减为单纯害怕或泛化为敬拜。
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: 要向他下拜
  rationale: שׁחה指俯伏、下拜；译作“下拜”保留敬拜行为的身体意象，比单译“敬拜”更贴近原文。
- source_word: וְלוֹ תִזְבָּחוּ
  choice: 向他献祭
  rationale: זבח指宰牲献祭；“献祭”是自然准确的现代汉语表达，并保留לוֹ所强调的唯一对象。
theological_decisions:
- issue: 如何处理神名יהוה
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用神的专名。译作“雅威”保留专名性质，不以“主”这一称号替代；“耶和华”虽有悠久汉语传统，但较不贴近该名通常重建的读音。
- issue: 盟约敬拜语境中ירא的含义
  choice: 敬畏
  alternative: 惧怕；尊崇；敬拜
  rationale: 此词在上下文中不只是恐惧，也包含敬重与盟约忠诚。“敬畏”既保留“畏”的张力，也不把词义完全化约为“敬拜”。
- issue: 敬拜对象的排他性
  choice: 借助“但”以及反复的“他”保留对比和强调
  alternative: 增译“只可”或“惟独”
  rationale: 上下文和原文前置、重复的代词已经表达雅威与别神之间的排他对比；不额外增添“只可”，以免把语义强调改写成原文未明说的限定词。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“伸出的膀臂”“下拜”“献祭”保留原文的具象敬拜语言；用较长的关系修饰语再引出“雅威”，尽量重现希伯来语将敬拜对象置于显著位置的结构。
