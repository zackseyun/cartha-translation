base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: zh_hans
  text: 亚述王撒缦以色上来攻打何细亚；何细亚就臣服于他[a]，向他进贡。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“作他的仆人”，在这里是政治上的从属用语，也可译作“成为他的属臣”。
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: 上来攻打何细亚
  rationale: 该短语在军事语境中表示向某人进军、与之为敌。“上来攻打”保留“上来”的希伯来语表达，同时自然传达敌对军事行动；补出“何细亚”以避免中文代词指向不清。
- source_word: שַׁלְמַנְאֶסֶר
  choice: 撒缦以色
  rationale: 采用现代中文圣经读者较熟悉的人名音译。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 简洁、自然地表达附加于人名的王号与国名。
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: 臣服于他
  rationale: 原文直译为“作他的仆人”，在此国际政治语境中指何细亚成为亚述王的属臣。“臣服”清楚表达地位转变和政治隶属，避免被误解为私人奴隶关系。
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: 向他进贡
  rationale: 在君王与附属国的语境中，מִנְחָה 指贡物；整个短语自然译为持续或履行性的“进贡”。
theological_decisions:
- issue: עֶבֶד 在政治语境中的含义
  choice: 正文译为“臣服于他”
  alternative: “作他的仆人”或“成为他的属臣”
  rationale: 此处描述君王之间的政治从属关系，不宜让现代读者误以为是私人奴役；脚注保留原文字面措辞及“属臣”的对应说法，不额外引入特定神学解释。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语言。“上来攻打”保留原文军事惯用语的形象；“臣服”和“进贡”准确呈现古代国际政治关系。
