  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: zh_hans
  text: 连犹大也[a]没有遵守他们的上帝雅威的诫命，反而遵循以色列所制定的规例[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“犹大也没有……”。句首的“也”带强调意味，表明犹大和以色列一样有罪。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“以色列所遵行的规例”或“以色列所形成的习俗”。原文既可指以色列制定这些规例，也可指他们实行这些规例。
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: 连……也
  rationale: 该词位于句首并带强调意味，指出不只是北国以色列，连犹大也同样有罪；“连……也”比单用“也”更能传达语境中的强调。
- source_word: שָׁמַר
  choice: 遵守
  rationale: 在诫命和盟约语境中，该动词表示谨守、实行；“遵守诫命”是自然、庄重的现代汉语搭配。
- source_word: מִצְוֺת
  choice: 诫命
  rationale: 保留该词在盟约和律法语境中的正式含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以保留经文所用的上帝专名，而不以称号代替。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的上帝
  rationale: 希伯来文带第三人称阳性复数后缀；“犹大”在这里代表其人民，因此译作“他们的上帝”，保留原文复数指向。
- source_word: וַיֵּלְכוּ בְּ
  choice: 反而遵循
  rationale: הלך与介词ב连用时可表示按某种准则行事。现代汉语不宜硬译为“行走在……中”；“遵循”自然传达行为模式，“反而”体现与前句之间的对比。
- source_word: חֻקּוֹת
  choice: 规例
  rationale: 该词可指律例、规定或既定习俗；“规例”既保留制度性和宗教性，又不预先断定这些是合法律法还是民间习俗。
- source_word: אֲשֶׁר עָשׂוּ
  choice: 所制定的
  rationale: עשה与规例连用可表示制定、施行或遵行。正文采用“制定”，使“以色列”的集体复数含义在汉语中清楚；脚注保留“所遵行的”等可能。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用接近YHWH传统学术复原读音的汉语音译“雅威”，保留专名性质，不用称号“主”替代。
- issue: 关系从句אֲשֶׁר עָשׂוּ的主语和含义
  choice: 以色列所制定的
  alternative: 他们所遵行的；以色列所实行的
  rationale: 原文动词为复数，既可把“以色列”理解为集合性的复数主语，也可译作未明说的“他们”；עשה在此还可能表示制定或实行。正文按上下文以北国以色列为主语，但以脚注保留动作含义的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“连……也”传达句首强调；“反而遵循”避免生硬直译希伯来语的“行走”隐喻，同时保留行为上的鲜明对比。
