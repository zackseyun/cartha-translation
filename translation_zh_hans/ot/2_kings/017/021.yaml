source:
  edition: WLC
  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: zh_hans
  text: 因为他把以色列从大卫家撕裂出来[a]，他们就立尼八的儿子耶罗波安为王；耶罗波安使以色列不再跟从雅威[b]，并使他们犯下大罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可理解为：“以色列从大卫家撕裂出去。”希伯来语动词为第三人称阳性单数；上下文较自然地将未明说的主语理解为雅威。
    reason: 句法歧义
  - marker: b
    text: “使……不再跟从”也可译作“把……赶离”。这个希伯来语动词既可表示赶走，也可表示使人走入歧途。
    reason: 词义选择
lexical_decisions:
- source_word: קָרַע יִשְׂרָאֵל מֵעַל בֵּית דָּוִד
  choice: 以色列从大卫家撕裂出去
  rationale: קָרַע本义为“撕裂”，在这里描写以色列脱离大卫王朝的统治。“撕裂出去”保留原文鲜明的分裂意象；同时用脚注说明希伯来语句法容许另一种主语理解。
- source_word: וַיַּמְלִיכוּ אֶת יָרָבְעָם בֶּן נְבָט
  choice: 立尼八的儿子耶罗波安为王
  rationale: מלך的使役式表示使某人作王或拥立某人为王；“立……为王”简洁自然，并保留“尼八的儿子”这一身份说明。
- source_word: וַיַּדַּח
  choice: 使……偏离
  rationale: נדח可指赶离，也可指引入歧途。结合מֵאַחֲרֵי יְהוָה，“使……偏离，不再跟从”自然表达耶罗波安促成以色列背离雅威，同时脚注保留动词较强的“赶离”含义。
- source_word: מֵאַחֲרֵי יְהוָה
  choice: 不再跟从雅威
  rationale: 字面方向性表达“从雅威后面离开”，在此是停止跟从他的惯用说法。“不再跟从”准确传达其关系和行动含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按其通行学术读音音译为“雅威”，保留这是以色列之神的专名，而不以称号替代。
- source_word: וְהֶחֱטֵיאָם חֲטָאָה גְדוֹלָה
  choice: 使他们犯了大罪
  rationale: חטא的使役式明确表示耶罗波安使他们犯罪；“犯了大罪”保留原文对罪之严重程度的直接强调。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。音译“雅威”保留专名性质，不用传统音译或称号取代。
- issue: 以色列与大卫家的分裂由谁发动
  choice: 以色列从大卫家撕裂出去
  alternative: 他把以色列从大卫家撕裂出去
  rationale: 马所拉文本中יִשְׂרָאֵל可直接理解为קָרַע的主语，因而正文采用“以色列……撕裂出去”；但上下文也可能使读者把省略的“他”理解为主语、把以色列理解为宾语，故以脚注保留。
- issue: 耶罗波安使以色列背离雅威的方式
  choice: 使以色列偏离，不再跟从雅威
  alternative: 把以色列赶离，使其不再跟从雅威
  rationale: 原动词兼有“赶离”和“使走迷、使偏离”的语义。正文避免把具体方式说死，脚注保留较强的驱赶意味。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“撕裂出去”有意保留原文的政治分裂隐喻；分号呈现两个紧密相连的历史行动。“大罪”直白凝练，不额外界定罪的具体性质。
