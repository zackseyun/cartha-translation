base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: zh_hans
  text: 他们敬畏雅威，也为自己从他们中间[a]选立丘坛祭司[b]；这些祭司在丘坛的庙宇里为他们供职。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“从他们各阶层中”。希伯来语这一习语也可能表示从全体民众中选人，并不区分他们是否具备适当资格。
    reason: lexical_alternative
  - marker: b
    text: “丘坛祭司”指在各地祭祀场所供职的祭司，而不是在中央圣所供职的祭司。
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: 敬畏雅威
  rationale: “敬畏”保留 ירא 的基本含义及其敬拜、效忠色彩，也保留本节中敬畏雅威与参与丘坛崇拜并存的张力。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现神的专名，不以“耶和华”或“主”等传统译法替代。
- source_word: מִקְצוֹתָם
  choice: 从自己人中选立了一些人
  rationale: 该表达字面涉及“他们的边端”，在这里是从群体中选人的习语；此译法自然表达从本族民众中取人任职，同时不武断译成“最低微的人”。
- source_word: כֹּהֲנֵי בָמוֹת
  choice: 丘坛祭司
  rationale: “丘坛”是《列王纪》中 בָמוֹת 的常用文化对应词，指地方性的祭祀场所；“祭司”保留其宗教职分。
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: 为自己……选立
  rationale: עשה 与担任职分的人连用时可表示设立或任命；“为自己”体现 לָהֶם 的受益、归属意味。
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: 这些祭司……为他们供职
  rationale: 迂回式结构表示持续履行职务；明确承接前句的祭司为主语。“供职”保留祭祀服务的语境，又不添加原文没有明说的具体仪式。
- source_word: בְּבֵית הַבָּמוֹת
  choice: 在丘坛的庙宇里
  rationale: בֵית 与复数“丘坛”构成集合性表达，所指是附属于丘坛的祭祀建筑；“庙宇”比生硬的“丘坛之屋”更符合现代汉语。
theological_decisions:
- issue: 敬畏雅威与不合规范的丘坛崇拜之间的张力
  choice: 以“也”连接两项行为，不解释为虚假的敬畏，也不把丘坛行为淡化为正当敬拜
  alternative: 译作“虽敬畏雅威，却……”或“自称敬畏雅威”
  rationale: 希伯来文仅用普通连接词 וַ，并列两种行为。直译式并列让上下文自身显出张力，避免额外断定其敬畏只是伪装，或强化原文未明说的转折。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威”保留神的专名；“丘坛祭司”“丘坛的庙宇”维持《列王纪》的祭祀语境。分号用于清楚表明末句主语是刚刚选立的祭司。
