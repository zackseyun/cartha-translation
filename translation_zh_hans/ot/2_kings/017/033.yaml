  text: אֶת יְהוָ֖ה הָי֣וּ יְרֵאִ֑ים וְ/אֶת אֱלֹֽהֵי/הֶם֙ הָי֣וּ עֹֽבְדִ֔ים כְּ/מִשְׁפַּט֙ הַ/גּוֹיִ֔ם אֲשֶׁר הִגְל֥וּ אֹתָ֖/ם מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: zh_hans
  text: 他们敬畏耶和华，却事奉自己的神，照着那些他们从中被迁来的民族的习俗。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“他们敬畏耶和华，又事奉自己的神。”连接词本身是“和／又”；“却”把上下文所显出的张力表达出来。末句的迁移行动施事者在原文中未明说，也可译作“他们从那里被掳迁来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式“耶和华”，使四字神名作为名字呈现，而不以“主”这一称号替代。
- source_word: הָיוּ יְרֵאִים
  choice: 他们敬畏
  rationale: היה加分词表示持续或惯常状态；“敬畏”自然表达对神兼具畏惧与尊崇的态度。
- source_word: אֱלֹהֵיהֶם
  choice: 自己的神明
  rationale: “自己的”明确表达第三人称复数词尾的所属关系；“神明”在此清楚指各民族所供奉的诸神，并与耶和华形成区别。
- source_word: הָיוּ עֹבְדִים
  choice: 供奉
  rationale: עבד用于神祇时指宗教性的服事或敬拜；“供奉”适合本段异教崇拜的语境，同时保留持续、惯常实践的含义。
- source_word: כְּמִשְׁפַּט
  choice: 照着……的习俗而行
  rationale: מִשְׁפָּט在这里不是司法判决，而是惯例、做法；该译法符合现代汉语表达。
- source_word: הַגּוֹיִם
  choice: 民族
  rationale: 本处指被迁来居民原先所属的各民族；“民族”比带有特定宗教色彩的“外邦人”更贴合历史叙述。
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: 那些把他们从原居地迁走的
  rationale: 希伯来文直译近于“那些从那里迁走他们的”，主语在语境中可指前述民族或其政权；用主动结构保留原文关系，并以“原居地”自然表达מִשָּׁם“从那里”。
theological_decisions:
- issue: 敬畏耶和华与供奉别神两句之间的关系
  choice: 正文用“却也”表达并存中的张力，并加注说明原文连接词
  alternative: 译作单纯的“又／并且”
  rationale: 原文וְ形式上只是“和／又”，但上下文突出这种混合敬拜的矛盾。“却也”使现代读者看出张力；脚注保留原文较为中性的连接方式，避免把解释冒充唯一语法意义。
- issue: 关系从句中实施迁移者的所指
  choice: 译为“那些把他们从原居地迁走的民族”
  alternative: 译为“他们被迁离的那些民族／地方”或采用无人称被动句
  rationale: 马所拉文本的复数主动动词הִגְלוּ与先行词“民族”在形式上相合，故正文保留主动句；同时不进一步指明具体政治主体，以保存原文可能存在的概括表达。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“敬畏”保留传统神学语汇且普遍可懂；“供奉神明”“照着……的习俗而行”符合历史宗教语境。正文避免古奥句式，并以脚注保存希伯来连接词的真实歧义。
