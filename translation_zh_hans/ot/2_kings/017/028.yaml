revisions:
- from: 于是，他们从撒马利亚掳走的祭司中，有一个来到伯特利，住在那里，教导他们该怎样敬畏耶和华[a]。
  to: 于是，有一位被从撒马利亚掳去的祭司来到伯特利，住在那里，教导他们该怎样敬畏耶和华[a]。
  rationale: 修订仅澄清“掳去”的流放含义并使句式更自然；保留原文未指明的复数施事，不增添历史细节或神学解释。脚注锚点继续置于“耶和华”之后，并与脚注内容相符。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:33Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了叙事推进、祭司来自被迁离的撒马利亚、其在伯特利居住并教导众人如何敬畏耶和华。惟“他们从撒马利亚掳走的”在现代汉语中较易理解为一般性的掳掠或绑走；改为“被……掳去的”更清楚交代流放／迁徙语境，同时仍不指定原文未明示的施事。
  naturalness: 原句基本自然，但“祭司中，有一个”可更凝练为“祭司中有一位”。“住在那里”虽无误，改用“住在伯特利”可避免指代词并使句子更顺畅。
  terminology: “敬畏”恰当保留 ירא 在此宗教语境中畏惧与尊崇的涵义；“耶和华”是现代中文中广为识别的神名译法。原脚注称“传统上也常译作‘上主’”不够准确且容易将不同中文译本传统混同，宜仅说明原文神名及可见的音译差异。
  issues:
  - severity: medium
    issue: “掳走”未充分显明此处是从撒马利亚被迁至外地的流放语境。
    rationale: הגלה 的使役义在此指使人流亡／迁离；“被从撒马利亚掳去”在不补出施事的前提下更准确、自然。
  - severity: low
    issue: 脚注对“上主”的传统译法说明不够严谨。
    rationale: “上主”是部分中文译本的译法，不能笼统作为该神名的传统通行译法；脚注应避免不必要且可能误导的译本传统概括。
  revised_text: 于是，有一位被从撒马利亚掳去的祭司来到伯特利，住在那里，教导他们该怎样敬畏耶和华[a]。
  revised_footnotes:
