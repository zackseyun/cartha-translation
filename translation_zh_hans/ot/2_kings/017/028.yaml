    text: 原文为“YHWH”（希伯来文四字神名）；也常音译为“雅威”。
    reason: 说明“耶和华”所译的原文神名及另一常见音译，避免对中文译本传统作不够准确的概括。
  revision_rationale: 修订仅澄清“掳去”的流放含义并使句式更自然；保留原文未指明的复数施事，不增添历史细节或神学解释。脚注锚点继续置于“耶和华”之后，并与脚注内容相符。
