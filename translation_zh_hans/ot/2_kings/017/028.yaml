base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: zh_hans
  text: 于是，有一位被从撒马利亚掳去的祭司来到伯特利，住在那里，教导他们该怎样敬畏耶和华[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“YHWH”（希伯来文四字神名）；也常音译为“雅威”。
    reason: 说明“耶和华”所译的原文神名及另一常见音译，避免对中文译本传统作不够准确的概括。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是……来到
  rationale: 连续式叙事动词推进事件；“于是”自然表达承接关系，“来到”保留其移动含义。
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: 祭司中，有一个
  rationale: 准确表达从一群祭司中选出一人的希伯来语结构。
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: 他们从撒马利亚掳走的
  rationale: הגלה 的使役形表示掳走、放逐；译文保留原文未明确交代的复数施事“他们”。
- source_word: וַיֵּשֶׁב בְּבֵית אֵל
  choice: 来到伯特利，住在那里
  rationale: ישב 在此表示居住；补出“在那里”使现代汉语流畅，同时清楚指回伯特利。
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: 教导他们
  rationale: “成为/持续作教导者”的结构在叙事中自然译为其持续承担的行动“教导”。
- source_word: אֵיךְ יִירְאוּ
  choice: 该怎样敬畏
  rationale: 既表达“如何”的方式，也保留教学语境中的规范意味；“敬畏”兼顾惧怕与尊崇，不把含义缩减为单纯恐惧。
- source_word: אֶת יְהוָה
  choice: 耶和华
  rationale: 以现代中文通行形式音译四字神名，并用脚注说明原文及传统译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用四字神名。正文采用中文读者熟悉的专名“耶和华”，脚注交代其希伯来文形式及其他常见处理，不将专名无说明地改为称号。
- issue: יִירְאוּ 的语义范围
  choice: 敬畏
  alternative: 惧怕
  rationale: 该词在此涉及人对耶和华应有的宗教态度；“敬畏”保留惧怕与尊崇并存的张力，避免只强调恐惧。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“掳走”贴合列王纪下流放与迁徙的历史语境；句式保持清楚，适合普通读者朗读。脚注标记置于其实际说明的“耶和华”之后，而非置于地名“伯特利”之后。
