    rationale: 原文将“他们的儿女和儿女的儿女”与“他们的祖先”置于“正如……，他们也……”的比较关系中。改为直接的“正如他们的祖先所做的，他们直到今日也照样行”，可更清楚对应原文，同时不限定“所行”的具体范围。
