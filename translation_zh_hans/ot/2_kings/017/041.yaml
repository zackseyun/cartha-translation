base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: zh_hans
  text: 这些民族敬畏雅威，却又供奉他们雕刻的神像[a]。他们的儿女和孙辈也如此行；正如他们的祖先所做的，他们直到今日也照样行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雕刻的神像”也可译作“偶像”；希伯来语特指雕刻制成的神像。
    reason: 说明原词的具体制作方式及常见意译。
lexical_decisions:
- source_word: וַיִּהְיוּ הַגּוֹיִם הָאֵלֶּה
  choice: 这些民族
  rationale: וַיִּהְיוּ承接并总结前文；现代汉语无需机械译出“于是成为”。הַגּוֹיִם הָאֵלֶּה指被迁入撒马利亚的各外族群体，译作“这些民族”准确自然。
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: 敬畏雅威
  rationale: 该表达是宗教语境中的固定搭配，兼有惧怕与尊崇之意；“敬畏”在现代汉语中能保留这两层含义。神名四字母译作“雅威”，以保留其专名性质。
- source_word: וְאֶת־פְּסִילֵיהֶם הָיוּ עֹבְדִים
  choice: 却又供奉他们雕刻的神像
  rationale: פְּסִילֵיהֶם特指经雕刻制成的祭祀神像；עֹבְדִים在此表示持续、惯常的宗教侍奉。“供奉”符合汉语宗教语境；“却又”呈现敬畏雅威与供奉神像并存的张力。
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: 他们的儿女和孙辈也
  rationale: 原文逐代列出“儿女”和“儿女的儿女”；“儿女和孙辈”自然地保留两代相承的意思，不把בנים限制为男性。
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם הֵם עֹשִׂים
  choice: 祖先怎样行，他们……仍怎样行
  rationale: 保留原文前后呼应的比较结构，并以“行”概括其持续的宗教行为。אֲבֹתָם在这里指前代祖先，译作“祖先”较自然。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 这是该希伯来时间套语简洁、庄重且自然的汉语表达。
theological_decisions:
- issue: 敬畏雅威与供奉雕刻神像并存
  choice: 保留两项陈述，以“敬畏雅威，却又供奉……”呈现其张力
  alternative: 解释为他们只是假装敬畏雅威，或把“敬畏”直接译成“敬拜”
  rationale: 希伯来文并未明确判断这种敬畏是否真诚、外在或混合宗教式的，也没有将“敬畏”与“敬拜”完全等同。译文不替原文消解这种神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“却又”凸显上下文中的反差，但不判定其敬畏是否真实；“儿女和孙辈”清楚表现信仰实践代代延续。脚注标记置于其实际说明的“雕刻的神像”之后。
