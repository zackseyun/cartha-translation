  source_fidelity: 首句准确呈现这些外族一面敬畏雅威、一面持续供奉雕刻神像的并存张力；“供奉”可恰当表达此处对神像的宗教性侍奉。末句虽基本传达代际延续，但“也照样行；祖先怎样行”结构重复，且“照样”的所指不够明确；应使比较结构直接对应希伯来文“正如他们的祖先所做的，他们也在做”。
  naturalness: “这些民族”“敬畏雅威”“雕刻的神像”均自然且庄重。修订末句后，代际关系和“直到今日”的持续性会更清楚、更合乎现代标准汉语。
