base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: zh_hans
  text: 何细亚在位第九年，亚述王攻取了撒马利亚，把以色列人掳到亚述[a]，安置在哈腊、歌散的哈博河边[b]，以及米底的城邑中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掳到”也可译作“流放到”或“迁徙到”。希伯来语动词表示强行迁离，使人流亡异地。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“在哈博，即歌散的河边”。希伯来语可理解为与歌散有关的哈博河；该表达也可指沿这条河安置。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: 何细亚在位第九年
  rationale: לְהוֹשֵׁעַ在王国纪年语境中表示何细亚执政的年份；补出“在位”符合现代汉语历史叙事，也不增加原文以外的实质信息。
- source_word: לָכַד
  choice: 攻取
  rationale: 该动词以城为宾语时指军事夺取；“攻取”自然、庄重，并保留征服的语义。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 简洁对应希伯来语属格结构，并符合中文圣经历史叙事的常用表达。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: וַיֶּגֶל אֶת־יִשְׂרָאֵל אַשּׁוּרָה
  choice: 把以色列人掳到亚述
  rationale: גלה的使役形式表示强制迁离、流放；“掳到”通俗而具有被迫迁徙之意。将集体名称“以色列”按汉语习惯译作“以色列人”。
- source_word: וַיֹּשֶׁב אֹתָם
  choice: 安置
  rationale: ישׁב的使役形式意为使其居住于某处；“安置”既自然，也未过度明确是否永久定居。
- source_word: בַּחְלַח
  choice: 在哈腊
  rationale: 按专名音译，并保留地点介词。
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: 歌散河边的哈博
  rationale: 将נְהַר גּוֹזָן理解为说明哈博的河流或地域关系；中文采用“歌散河边的哈博”以自然表达沿河安置，同时用脚注保留另一种句法理解。
- source_word: וְעָרֵי מָדָי
  choice: 以及米底的城邑中
  rationale: 保留复数“城邑”和米底这一地域名称；“以及”清楚连接末项地点。
