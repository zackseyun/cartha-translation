id: 2KI.17.17
reference: 2 Kings 17:17
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַֽ֠/יַּעֲבִירוּ אֶת בְּנֵי/הֶ֤ם וְ/אֶת בְּנֽוֹתֵי/הֶם֙ בָּ/אֵ֔שׁ וַ/יִּקְסְמ֥וּ קְסָמִ֖ים וַ/יְנַחֵ֑שׁוּ וַ/יִּֽתְמַכְּר֗וּ לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: zh_hans
  text: 他们使自己的儿子和女儿经火[a]，又行占卜、观兆，并且出卖自己，去做耶和华眼中看为恶的事，惹他发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可更明确地译作“把自己的儿子和女儿在火中献祭”。希伯来语直译为“使……从火中经过”。
    reason: 说明希伯来惯用语的字面形式及其很可能所指的献儿女仪式，同时避免正文过度限定具体做法。
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: 使……经火
  rationale: 保留希伯来语“使……从火中经过”的祭仪性表达及其经文互文联系，不在正文中把具体仪式形式说得超过原文；脚注说明其很可能指以火献儿女。
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: 自己的儿子和女儿
  rationale: 原文分别点明儿子和女儿；逐项保留可呈现其强调和行为的骇人性质。
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: 行占卜
  rationale: 以自然简洁的现代汉语表达同源动词与宾语的结构，保留其反复从事占卜活动的含义。
- source_word: וַיְנַחֵשׁוּ
  choice: 观兆
  rationale: 该词指观察并解释征兆；“观兆”简明自然，也与前面的泛称“占卜”有所区分。
- source_word: וַיִּתְמַכְּרוּ
  choice: 出卖自己
  rationale: 保留 מכר 的反身性比喻，突出他们主动把自己交付给恶、仿佛自我奴役的强烈意味。
- source_word: לַעֲשׂוֹת הָרַע
  choice: 去做……看为恶的事
  rationale: 按现代汉语惯用表达处理带冠词的“恶”，并与后面的评价性短语自然衔接。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的神圣评价意象，同时使中文句法通顺。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语域中对四字神名最通行、易识别的音译，不以“主”这一称号替代专名。
- source_word: לְהַכְעִיסוֹ
  choice: 惹他发怒
  rationale: 表达使役形式所含“使他发怒”的意义，并保留百姓行为对神造成冒犯的关系性含义。
theological_decisions:
- issue: 儿女经火之仪式的性质
  choice: 正文保留“使自己的儿子和女儿经火”这一原文惯用语。
  alternative: 把正文明确译为“把自己的儿子和女儿在火中献祭”或“焚烧自己的儿子和女儿”。
  rationale: 上下文强烈指向献儿女的受谴责仪式，但希伯来语本身说的是“使……经火”。正文保留该表达，脚注交代很可能的明确含义，可避免无声消除原文在具体仪式形式上的余地。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: “耶和华”是现代普通中文读者最熟悉的专名形式，能保留其作为神之名字而非称号的功能；同时不借此加入任何宗派性解释。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“经火”保留祭仪语感，脚注负责释义；“行占卜、观兆”用并列短语区分两个相关但不完全相同的术语；整体依照希伯来语动作链推进，保持控诉的力度。
