  text: וַ/יְצַ֨ו מֶֽלֶךְ אַשּׁ֜וּר לֵ/אמֹ֗ר הֹלִ֤יכוּ שָׁ֨מָּ/ה֙ אֶחָ֤ד מֵ/הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר הִגְלִיתֶ֣ם מִ/שָּׁ֔ם וְ/יֵלְכ֖וּ וְ/יֵ֣שְׁבוּ שָׁ֑ם וְ/יֹרֵ֕/ם אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: zh_hans
  text: 于是，亚述王下令说：“把你们从那里掳走的祭司中的一个带到那里去[a]，让他去住在那里[b]，并教导他们那地之神的规矩[c][d]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “带到那里去”也可译作“送到那里去”或“送回那里”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文本这里的“去”和“住”采用复数形式，直译为“让他们去，让他们住在那里”；但上下文的主语是“一个祭司”，下一个动词也用单数，因此正文按单数语意翻译。
    reason: textual_variant
  - marker: c
    text: “规矩”也可译作“律法”“要求”或“礼仪”。
    reason: lexical_alternative
  - marker: d
    text: “那地之神”也可理解为“那地的上帝”。正文保留亚述王把神视为地域性神明的说话视角。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: 下令
  rationale: צוה表示发出命令；“下令”自然、庄重，也符合君王颁令的语境。
- source_word: הֹלִיכוּ שָׁמָּה
  choice: 送回那里
  rationale: הלך的使役式表示使某人前往，可译“带去”或“送去”。结合祭司先前从当地被掳走的背景，“送回那里”清楚表达目的地，同时脚注保留其他可能。
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: 你们从那里掳走的
  rationale: גלה的使役式常指掳走、流放或迁徙人口；“掳走”符合列王纪的战争与流亡语境。
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: 让他去住在那里
  rationale: 希伯来文本两个动词均为复数，但前项“一个祭司”和后续单数动词表明语意指单数。正文按语意译为“他”，并以脚注说明形式上的复数。
- source_word: וְיוֹרֵם
  choice: 教导当地的人
  rationale: ירה的使役式意为教导、指教，-ם为复数宾语“他们”。为使中文所指清楚，按上下文译作“当地的人”。
- source_word: מִשְׁפַּט
  choice: 怎样按……所要求的去做
  rationale: 此处מִשְׁפַּט指某神明所规定的礼仪、规矩或要求，不必局限为成文“律法”。这一表达在现代中文中自然，并保留实践层面的含义。
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: 那地之神
  rationale: 短语直指“那地的神”。中文“神”没有英文大小写差异；“那地之神”保留亚述王把神视为地域性神明的说话视角，同时不替叙事者断定其神学含义。
theological_decisions:
- issue: אֱלֹהֵי הָאָרֶץ所指的身份与说话视角
  choice: 那地之神
  alternative: 那地的上帝
  rationale: 上下文反映亚述人对地域神明的理解。正文不直接采用明确指向以色列独一真神的“上帝”，以免消除说话者视角与叙事神学之间的张力；脚注说明另一种理解。
- issue: וְיֵלְכוּ / וְיֵשְׁבוּ的复数形式与单数所指不一致
  choice: 按上下文译成单数“让他去住在那里”
  alternative: 形式对应地译为“让他们去住在那里”
  rationale: 先行词是“祭司中一个”，后面的וְיוֹרֵם也是单数主语，说明语意指这一个祭司。正文采用通顺的单数表达，脚注保留原文形式异常。
translation_notes:
  register: 采用现代、清楚而庄重的叙事语体。“于是，亚述王下令说”保留希伯来叙事推进与引语公式；引语内部避免古奥的“居住”“典章”等措辞，以“住在那里”“所要求的去做”传达普通读者容易理解的意义。
