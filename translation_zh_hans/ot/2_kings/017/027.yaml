  to: 于是，亚述王下令说：“把你们从那里掳走的祭司中的一个带到那里去[a]，让他去住在那里[b]，并教导他们那地之神的规矩[c][d]。”
  rationale: 修订避免把“送回”所蕴含的返还方向作为唯一正文读法，并以“规矩”直接对应מִשְׁפָּט；同时保留原文“他们”的开放指代。原有的复数形式说明及“那地之神”的视角说明均予以保留。
