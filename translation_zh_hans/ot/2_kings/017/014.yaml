  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּקְשׁ֤וּ אֶת עָרְפָּ/ם֙ כְּ/עֹ֣רֶף אֲבוֹתָ֔/ם אֲשֶׁר֙ לֹ֣א הֶאֱמִ֔ינוּ בַּֽ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: zh_hans
  text: 但他们不肯听从，反而使自己的颈项刚硬，像他们祖先的颈项一样；他们的祖先不信靠[a]雅威——他们的神。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “信靠”也可译作“相信”。这里的希伯来语动词可指相信，也可指在盟约关系中信赖。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: 不肯听从
  rationale: שׁמע本义为“听”，在盟约语境中也含顺从之意；“不肯”体现上下文中的执意拒绝，“听从”则自然保留听与服从两层意味。
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: 硬着颈项
  rationale: 原文直陈“使自己的颈项刚硬”。中文圣经语体中的“硬着颈项”既保留身体隐喻，也清楚表达顽梗抗拒。
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: 像他们祖先一样
  rationale: 若逐字译为“像他们祖先的颈项”，现代中文较生硬；结合前句已经保留的颈项意象，以“像他们祖先一样”自然表达比较关系，不改变所指。
- source_word: הֶאֱמִינוּ בַּיהוָה
  choice: 信靠雅威
  rationale: אמן的使役词干与介词ב连用，可表示相信、倚靠或信赖。“信靠”在现代中文中兼顾相信与信赖的盟约关系意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名直接音译，表明这是以色列之神的专名，而非普通称号。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的神
  rationale: 保留第三人称复数属格，明确雅威与他们之间本应存在的盟约关系。
- source_word: וְלֹא
  choice: 但
  rationale: 连接词在本段承接此前的警告并引出相反反应，译作“但”可自然呈现转折。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名；“雅威”较直接地音译该名，避免以称号替代专名。
- issue: הֶאֱמִינוּ的“相信”与“信靠”之别
  choice: 信靠
  alternative: 相信；信
  rationale: 该动词与ב连用，语义可涵盖相信与倚赖。“信靠”较完整呈现关系性的信任，同时以脚注保留“相信”的可能译法。
- issue: 是否逐字保留“像他们祖先的颈项”
  choice: 像他们祖先一样
  alternative: 像他们祖先的颈项一样
  rationale: 中文直译会显得拗口；前句已明确保留“硬着颈项”的意象，此处自然化比较并未消除原文对祖先顽梗的指涉。
translation_notes:
  register: 采用现代、庄重而易懂的中文。“不肯听从”传达主动抗拒；“硬着颈项”保留原文鲜明的希伯来语意象。脚注标记置于相关分句之后。
