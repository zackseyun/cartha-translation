base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: zh_hans
  text: 他们按雅威在以色列人[b]面前逐出的列国的规例行事[a]，也按以色列诸王所制定的规例行事[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们行走在列国的规例中”；“行走”在这里指生活、行事。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“以色列的儿子们”，即以色列人。
    reason: lexical_alternative
  - marker: d
    text: 原文末句较为省略，字面近似“以及以色列诸王所做的”；“规例”由上文补出。
    reason: textual_or_syntactic_clarification
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 按……行事
  rationale: הלך的字面义是“行走”，在伦理与盟约语境中指生活方式或行为。“按……行事”在现代汉语中自然表达这一引申义；脚注保留“行走”的希伯来语比喻。
- source_word: בְּחֻקּוֹת
  choice: 按……规例
  rationale: חֻקּוֹת可指规定、法令或固定惯例。这里所指的是以色列仿效列国的既定宗教和社会做法；“规例”既保留正式意味，也不把含义限缩为单纯习俗。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 此处指迦南地非以色列的各民族。“列国”是庄重而通行的译法，也避免“外邦人”可能带入的后期神学色彩。
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: 雅威曾把这些列国从……面前赶走
  rationale: הוֹרִישׁ的使役形可表示赶走、逐出或剥夺土地。“赶走”清楚自然；“从……面前”保留מִפְּנֵי的空间表达。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 字面为“以色列的儿子们”，但这里是全民族的固定称谓；现代汉语以“以色列人”表达最准确自然。
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: 也按以色列诸王所制定的规例行事
  rationale: 原文末句省略了前文“规例”一词，字面结构近似“以及以色列诸王所做的”。译文补出上下文隐含的“规例”，并以“制定”表达עָשׂוּ在此处的“做出、设立”之意。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界通常复原读音的“雅威”，而不以“主”替代，从而保留经文中的盟约之名。
- issue: 末句是否特指诸王引入的宗教制度
  choice: 译作“诸王所制定的规例”
  alternative: “诸王所做的事”
  rationale: 原文句法省略，既可理解为承接前文的“规例”，也可较宽泛地指诸王所做之事。正文按最近的先行成分补足“规例”，脚注说明其字面形式，避免进一步限定为某种特定宗教制度。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“按……行事”避免生硬照搬“行走”的比喻，同时用脚注保存原文意象；破折号标明关系从句，避免读者误以为“列国的规例”与“雅威赶走”是两个并列宾语。
