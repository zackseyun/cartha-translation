id: 2KI.17.39
reference: 2 Kings 17:39
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: zh_hans
  text: 惟要敬畏耶和华你们的上帝；他必救你们脱离所有仇敌的手[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “脱离……的手”是希伯来语习语，意思是脱离对方的权势或控制。
    reason: 解释保留在正文中的希伯来语形象，避免现代读者把“手”只按字面理解。
lexical_decisions:
- source_word: כִּי אִם
  choice: 惟要
  rationale: 这个连词组合承接上文不可敬畏别神的禁令，兼有转折和排他意味。“惟要”自然地表达“反倒只应当”的语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式音译四字神名，保留原文所用的上帝之名，而不以头衔替代。
- source_word: אֱלֹהֵיכֶם
  choice: 你们的上帝
  rationale: 这里指耶和华，语义明确为单数；“你们的上帝”也保留了圣约关系中的第二人称复数。
- source_word: תִּירָאוּ
  choice: 要敬畏
  rationale: ירא 在此指对上帝怀有带着畏惧与尊崇的态度。“敬畏”保留两方面含义，“要”则体现该未完成式在训令中的命令力量。
- source_word: וְהוּא
  choice: 他
  rationale: 原文明确使用第三人称代词；中文以“他”自然承接“耶和华你们的上帝”，无需另加“亲自”而强化原文。
- source_word: יַצִּיל
  choice: 必救
  rationale: נצל 的使役式表示从危险或控制中解救。“必救”简洁表达应许性的将来语气。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留希伯来语以“手”表示权势或控制的形象，同时用“脱离”使中文句法自然。
- source_word: כָּל אֹיְבֵיכֶם
  choice: 所有仇敌
  rationale: 直接表达量词与复数名词；所属关系已由“你们”明确标出。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名。正文采用现代中文圣经传统中最通行、普通读者最易识别的音译“耶和华”，不以“主”等称号取代专名。
- issue: תִּירָאוּ 所表达的态度
  choice: 敬畏
  alternative: 惧怕
  rationale: 语境既含不可转移给别神的畏惧，也含对以色列之上帝的尊崇与忠诚；“敬畏”比单纯“惧怕”更完整，同时没有消除“畏”的分量。
- issue: יַצִּיל 的语气
  choice: 他必救
  alternative: 他会救
  rationale: 此处是与命令相连的确定陈述；“必”保留应许般的确定性，但不额外说明其条件结构。
translation_notes:
  register: 采用简洁、庄重而现代的普通话。“惟要”与上文形成清楚对照；分号保留命令与应许之间紧密而有区别的关系。脚注标记置于其实际解释的“手”之后。
