source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/תְחִלַּת֙ שִׁבְתָּ֣/ם שָׁ֔ם לֹ֥א יָרְא֖וּ אֶת יְהוָ֑ה וַ/יְשַׁלַּ֨ח יְהוָ֤ה בָּ/הֶם֙ אֶת הָ֣/אֲרָי֔וֹת וַ/יִּֽהְי֥וּ הֹרְגִ֖ים בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: zh_hans
  text: 他们刚开始住在那里时，并不敬畏耶和华[a]；于是耶和华差遣狮子到他们中间，狮子不断杀死他们中的一些人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬畏”也可译作“尊崇”。原文所指不只是害怕，也包括对耶和华的尊崇和应有的忠诚。
    reason: 说明 ירא 的语义范围，避免读者将其仅理解为恐惧。
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: 他们刚开始住在那里时
  rationale: 以自然的现代汉语表达“在他们居住于那里的起初”，既保留定居初期的时间含义，也避免生硬的名词化结构。
- source_word: יָרְאוּ אֶת־יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”保留希伯来语 ירא 对上帝既有畏惧、又有尊崇和信仰忠诚的复合含义；“害怕”过窄，“敬拜”则过度限定其意义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，而不以“主”这一称号替代。
- source_word: וַיְשַׁלַּח ... בָּהֶם אֶת הָאֲרָיוֹת
  choice: 差遣狮子到他们中间
  rationale: בָּהֶם 在此表示进入他们当中；“到他们中间”比“攻击他们”更直接保留原文的空间表达，同时上下文已清楚表明敌对后果。
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: 狮子不断咬死他们中的一些人
  rationale: היה 加分词表示持续或反复发生的行动，故用“不断”；בָּהֶם 具有部分性，不宜译成所有人都被杀。“咬死”在狮子作主语的汉语语境中比泛称“杀死”更自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文直接使用神的专名，正文应保留专名而非以称号取代；“耶和华”是现代简体中文圣经语境中最通行且易识别的形式。
- issue: “敬畏”所表达的关系
  choice: 保留“敬畏”的多义张力
  alternative: 敬奉；害怕
  rationale: 此处既可能涉及对神威严和审判的惧怕，也涉及宗教上的尊崇与应有的忠诚；不将其缩减为单纯恐惧或礼仪性敬拜。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“刚开始住在那里时”符合普通话习惯；后半句明示“狮子”为动作主体，并用“不断”体现希伯来语迂回式结构的持续或反复意味。
