  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: zh_hans
  text: 他行了雅威眼中看为恶的事，却[a]不像他以前的以色列诸王那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“只是，不像他以前的以色列诸王那样。”希伯来语 רַק 的字面意思可译为“只是”，在这里引出对前述判语的限定。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他做了
  rationale: 未完成式连续体在这里推进叙事；汉语自然译作“他做了”，不必机械补出句首连接词。
- source_word: הָרַע
  choice: 恶的事
  rationale: 带冠词的形容词在此作名词使用，指道德上邪恶的行为；“恶的事”符合现代汉语表达。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在……眼中”的评价意象，同时用“看为”使汉语句义清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名音译为“雅威”，保留经文所用的专名，不以称号替代。
- source_word: רַק
  choice: 可是
  rationale: 此处引入对前述负面评价的限定或缓和性对比；“可是”自然传达转折，同时脚注保留更贴近字面的“只是”。
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: 不像……以色列诸王
  rationale: 忠实表达否定词与比较介词的组合；“诸王”简洁地表示多位君王。
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: 在他以前的
  rationale: 这里指时间上先于他的历代君王；“在他以前的”在现代汉语中清楚自然，也保留原文关系从句的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用较贴近学界通行重构读音的“雅威”，以专名而非“主”等称号来呈现。
- issue: 何西阿作恶程度的比较
  choice: 译为“可是，不像在他以前的以色列诸王”
  alternative: 译为“只是，不像在他以前的以色列诸王”
  rationale: רַק 对“行恶”的判语加以限定，但经文本身没有说明具体在哪一方面或何种程度上不同，因此不补入“没有那么恶”等解释，以保留原文的概括性与张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。保留“雅威眼中”的希伯来语评价意象；不把比较扩展为原文未明说的“罪较轻”或具体行为差异。脚注标记置于“可是”之后，使其准确对应 רַק 的译法。
