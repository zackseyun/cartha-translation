id: 2KI.17.18
reference: 2 Kings 17:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: zh_hans
  text: 因此，雅威向以色列大发烈怒，把他们从自己面前除去[a]；唯独犹大支派还存留下来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他们离开他的临在”。希伯来文直译为“把他们从他面前除去”。
    reason: 说明原文关于神之“面”的具体表达，并提供较抽象的现代汉语译法。
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: 大发烈怒
  rationale: התאנף表示怒气发作，מְאֹד加强程度；“大发烈怒”自然、庄重，也保留了原文强烈的审判语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: בְּיִשְׂרָאֵל
  choice: 向以色列
  rationale: 介词ב与发怒动词连用时标明怒气所针对的对象；“向以色列”在现代汉语中清楚自然。
- source_word: וַיְסִרֵם
  choice: 把他们……除去
  rationale: סור的使役义表示使之离开、移除；“除去”保留行动本身，不直接把其含义限定为“掳走”或“流放”。
- source_word: מֵעַל פָּנָיו
  choice: 从自己面前
  rationale: 原文具体地说“从他面前”；汉语用反身代词明确主语仍是雅威，并保留这幅关于神临在的形象。
- source_word: לֹא נִשְׁאַר רַק
  choice: 唯独……还存留下来
  rationale: 以自然汉语表达否定句后的例外结构，同时保留רַק所强调的唯一性。
- source_word: שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: 犹大支派
  rationale: שֵׁבֶט יְהוּדָה是“犹大支派”；לְבַדּוֹ的独存强调已由“唯独”表达，避免汉语累赘而不损失语义。
theological_decisions:
- issue: מֵעַל פָּנָיו中关于神之“面”的拟人表达
  choice: 从自己面前
  alternative: 离开他的临在
  rationale: 正文保留原文具体的空间与关系意象，不把它完全抽象化为“临在”；脚注说明较抽象、流畅的译法。
- issue: 本节“以色列”的所指
  choice: 不在正文增补限定语，按原文译作“以色列”
  alternative: 北国以色列
  rationale: 上下文主要指向北国及其人民，但本节本身只写“以色列”；保留原称谓，避免在译文中加入解释性限定。
- issue: וַיְסִרֵם是否明确指被掳流放
  choice: 除去
  alternative: 掳走／流放
  rationale: 历史语境指向北国被掳，但动词本身表达“使离开、移除”；译文不把上下文推论直接写进该词。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“大发烈怒”传达强烈神怒；分号保留原文审判行动与仅余犹大支派之间的结果关系。正文中的脚注标记[a]与脚注完全对应。
