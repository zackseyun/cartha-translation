source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: zh_hans
  text: 雅威[a]与他们立约，吩咐他们说：“你们不可敬畏别的神，不可向它们下拜，不可侍奉它们，也不可向它们献祭。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝之名 יהוה（YHWH）的音译，传统上也译作“耶和华”。
    reason: 帮助熟悉传统中文译名的读者辨认此专名，同时说明译名依据。
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: 立约
  rationale: 希伯来语“切割盟约”是固定表达；现代汉语以“立约”自然、准确地传达缔结盟约之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用对四字神名的现代汉语音译，保留经文中的专名，而不以称号替代。
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: 吩咐他们说
  rationale: 既保留“命令”的直接性，也保留引出下文直接引语的叙事结构。
- source_word: לֹא תִירְאוּ
  choice: 你们不可敬畏
  rationale: “不可”体现盟约命令的郑重语气；“敬畏”保留 ירא 的词义，并避免与后面具体的崇拜行为混同。
- source_word: אֱלֹהִים אֲחֵרִים
  choice: 别的神
  rationale: 直译“其他的神”；“别的神”符合现代汉语，也保留盟约禁令的传统表达。
- source_word: תִשְׁתַּחֲווּ
  choice: 下拜
  rationale: 保留俯伏敬拜这一具体动作，不笼统译作“敬拜”，以维持并列动词间的区别。
- source_word: תַעַבְדוּם
  choice: 侍奉它们
  rationale: עבד 在宗教语境中指事奉或服侍；译作“侍奉”既自然，也不与“下拜”合并。
- source_word: תִזְבְּחוּ לָהֶם
  choice: 向它们献祭
  rationale: 准确表达 זבח 所指的祭献行为，并清楚标明祭献的对象。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用上帝的专名；“雅威”较直接反映学界通常重构的读音，并避免以“主”等称号取代专名。脚注说明传统译名，便于读者辨识。
- issue: 盟约语境中否定命令的力度
  choice: 你们不可……
  alternative: 不要……
  rationale: “不可”在现代汉语中自然体现郑重、规范性的禁令，适合本节“立约、吩咐”的语境。
- issue: יִרְאוּ 的宗教含义
  choice: 敬畏
  alternative: 敬拜
  rationale: 原词可包含畏惧与尊崇；保留“敬畏”可维护其语义张力，也不把它与随后下拜、侍奉、献祭等行为混为一谈。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“立约、不可、敬畏、下拜、侍奉、献祭”保留盟约命令的郑重感和四个并列禁令之间的语义区分。
