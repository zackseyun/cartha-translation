id: 2KI.17.34
reference: 2 Kings 17:34
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: zh_hans
  text: 直到今日，他们仍照着从前的惯例[a]行事。他们不敬畏耶和华[b]，也不遵行他们的律例和典章，也不遵行耶和华吩咐雅各子孙[c]遵守的律法和诫命；耶和华曾给雅各起名叫以色列[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “惯例”也可译作“典章”或“规矩”。这里指他们从前沿袭的做法。
    reason: lexical_alternative
  - marker: b
    text: “敬畏耶和华”也含有尊崇耶和华、忠于他的意思。
    reason: lexical_alternative
  - marker: c
    text: 原文直译“雅各的众子”，这里泛指雅各的后裔。
    reason: lexical_alternative
  - marker: d
    text: 即雅各；参创世记32:28；35:10。
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: 照着从前的规矩
  rationale: מִשְׁפָּט在此指前文所述延续下来的宗教惯例或做法；“规矩”既保留规范性，也比“审判”更符合上下文。
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: 敬畏耶和华
  rationale: “敬畏”是自然且庄重的汉语圣经用语，可同时承载畏惧、尊崇和盟约忠诚的含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名“耶和华”表达四字神名，而不以称号“主”替代。
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: 他们的律例和典章
  rationale: 保留第三人称复数后缀“他们的”，并用“律例和典章”体现两个法律—规范性词语的并列。
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: 律法和诫命
  rationale: 保留两个单数集合名词的盟约性语域；汉语中无需强行标明单数。
- source_word: בְּנֵי יַעֲקֹב
  choice: 雅各子孙
  rationale: 这里群体性地指雅各的后裔；“子孙”比字面的“众子”更自然，也不误导为仅指雅各的亲生儿子。
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: 耶和华曾给雅各起名叫以色列
  rationale: 将关系从句的先行词明确为雅各，以自然汉语表达改名事件，避免误读为给“子孙”整体命名。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文使用神的专名。中文正文保留专名，并采用现代汉语圣经传统中辨识度最高的“耶和华”，不以称号“主”取代。
- issue: “他们的律例和典章”的所指
  choice: 保留“他们的”，不在正文中明确其归属
  alternative: 明确解释为这些民族自己的规范；解释为耶和华给以色列的律例典章
  rationale: 希伯来语确有第三人称复数后缀，但本节论述转折及所指存在解释张力；直译代词可保存原文歧义，避免把一种解释写进正文。
- issue: 雅各与以色列的关系
  choice: 明确为耶和华给雅各起名叫以色列
  alternative: “他给他起名叫以色列”
  rationale: 原文关系从句指雅各；补出名字仅为消除汉语代词歧义，不增加新的神学判断。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“仍照着……行事”传达持续至今的状态；后半句重复“也不遵行”，使连续否定在汉语中清楚自然。保留“他们的”所具有的指代张力，并以分号拆开改名从句，避免长句歧义。
