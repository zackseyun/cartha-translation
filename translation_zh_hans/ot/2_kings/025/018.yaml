base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: zh_hans
  text: 护卫长带走了为首的祭司西莱雅[a]、副祭司西番雅，以及三名守门人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“祭司，为首的”；也可译作“大祭司”或“祭司长”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“看守门槛的人”；可能指守卫圣殿入口的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦官员尼布撒拉旦的职衔；字面涉及“屠宰者之长”，但在王室军事语境中指护卫部队的统领。“护卫长”自然简洁，也符合上下文。
- source_word: וַיִּקַּח
  choice: 拿住了
  rationale: לקח 基本义为“拿、带走”；此处是敌军官员拘捕并带走这些人。“拿住”保留较宽泛的动词色彩，同时自然传达强制意味。
- source_word: כֹּהֵן הָרֹאשׁ
  choice: 大祭司
  rationale: 字面为“为首的祭司”。在此历史语境中指最高等级的祭司职分；现代汉语《圣经》语体通常以“大祭司”准确表达，脚注保留较贴近字面的译法。
- source_word: כֹּהֵן מִשְׁנֶה
  choice: 副祭司
  rationale: מִשְׁנֶה 表示居第二位或副手身份。“副祭司”比生硬的“第二祭司”更符合现代汉语，并明确表达其职级。
- source_word: שֹׁמְרֵי הַסַּף
  choice: 守门人
  rationale: 字面为“看守门槛的人”，在此指圣殿入口的守卫或门吏。“守门人”自然明白；脚注保留希伯来语的具体意象和可能含义。
- source_word: שְׁלֹשֶׁת
  choice: 三名
  rationale: 该数词与后面的定指复数结构连用，指三位已知职员；汉语用“三名”自然得体。
- source_word: שְׂרָיָה
  choice: 西莱雅
  rationale: 按现代汉语圣经人名惯例音译。
- source_word: צְפַנְיָהוּ
  choice: 西番雅
  rationale: 按现代汉语圣经人名惯例音译。
theological_decisions:
- issue: כֹּהֵן הָרֹאשׁ 的职衔表达
  choice: 大祭司
  alternative: 为首的祭司／祭司长
  rationale: “大祭司”准确表达此人位居祭司体系首位，但原文措辞本身是“为首的祭司”，因此以脚注提示字面译法，避免掩盖词语形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“拿住”体现拘捕语境而不过度强化原动词；两个脚注分别说明祭司职衔和圣殿守门职分的字面含义。
