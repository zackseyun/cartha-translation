  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: zh_hans
  text: 所有军队的首领和他们的人听说巴比伦王已经委任了基大利[a]，就到米斯巴的基大利那里去：尼探雅的儿子以实玛利、加利亚的儿子约哈难、尼陀法人单户篾的儿子西莱雅、玛迦人的儿子雅撒尼亚，以及他们的人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“让基大利负责管理”；希伯来语动词可指委任某人负责监督或管理。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: 众军队的首领
  rationale: שָׂרֵי 指首领或长官，הַחֲיָלִים 在此指军事队伍；译文保留军事含义，但不强定具体军阶。
- source_word: הֵמָּה וְהָאֲנָשִׁים / וְאַנְשֵׁיהֶם
  choice: 和他们的人／以及他们的人
  rationale: 前后呼应的表达把首领与随从他们的人区别开来；“他们的人”自然且不把这些人过度限定为正规士兵。
- source_word: הִפְקִיד
  choice: 委任
  rationale: 该动词表示委派、任命或交托管理职责；“委任”保留其宽泛含义，不擅自补出“省长”等具体官职。
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: 到米斯巴去见他
  rationale: הַמִּצְפָּה 表明基大利所在地点；按现代汉语语序调整，并用“他”避免重复人名。
- source_word: הַנְּטֹפָתִי
  choice: 尼陀法人
  rationale: 以地名族称形式保留其地域身份，与中文圣经专名传统相协调。
- source_word: הַמַּעֲכָתִי
  choice: 玛迦人
  rationale: 保留原文的地域或族属称谓，不将其解释性改写为“来自玛迦”。
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן ...
  choice: 就到……去见他。他们是……
  rationale: 原文先述众人来到，随后以同位结构列出姓名；中文分句呈现可保持逻辑并提升可读性。
theological_decisions: []
