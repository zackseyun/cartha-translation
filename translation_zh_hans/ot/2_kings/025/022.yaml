base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: zh_hans
  text: 至于留在犹大地的百姓[a]，就是巴比伦王尼布甲尼撒所留下的；他任命亚希甘的儿子、沙番的孙子基大利管理他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“被留在犹大地的百姓”。希伯来语分词既可强调他们仍留在那里，也可强调他们是被留下的。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: 人
  rationale: 这里是集合意义，指被掳之后仍在当地的民众；结合“留在犹大地”译为“人”，现代汉语自然清楚。
- source_word: הַנִּשְׁאָר
  choice: 留在
  rationale: שׁאר 的尼法勒分词可指“留下的”或“剩下的”。正文用“留在”避免把描述性表达神学化为“余民”，并在脚注保留被动理解。
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: 在犹大地
  rationale: 保留 אֶרֶץ 的地域含义，并采用现代中文圣经地理名称的自然表达。
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: 所留下的
  rationale: שׁאר 的使役形在此表示尼布甲尼撒使这些人留下，即没有将他们掳走。
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: 巴比伦王尼布甲尼撒
  rationale: 按现代汉语习惯将王号置于人名前，同时完整保留身份说明。
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: 他委派……管理他们
  rationale: פקד 与 עַל 在行政语境中表示任命某人负责管理；“委派……管理”比直译“立在他们之上”更自然，并保留官方授权之意。
- source_word: גְּדַלְיָהוּ
  choice: 基大利
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: 沙番的孙子、亚希甘的儿子
  rationale: 希伯来文直为“亚希甘的儿子，沙番的儿子”；中文按亲属关系展开，可避免误读，同时保留完整谱系。
- source_word: וְ
  choice: 至于
  rationale: 句首连接词在此引入新的叙述焦点；“至于”自然体现话题转换。
theological_decisions:
- issue: הַנִּשְׁאָר 是否译作带有神学色彩的“余民”
  choice: 译作“留在……的人”
  alternative: 余民
  rationale: 此处分词首先描述被掳后仍在当地的人群，没有必要引入“余民”这一可能带有特定神学含义的术语。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“至于”标示叙事焦点转换；亲属链按中文关系明确译为“沙番的孙子、亚希甘的儿子”。
