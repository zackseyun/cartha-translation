  yaml_path: translation/ot/2_kings/025/015.yaml
  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: zh_hans
  text: 至于火盘[a]和碗[b]，无论是金的还是银的[c]，护卫长[d]都拿走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“香炉”。
    reason: lexical_alternative
  - marker: b
    text: 或译“盆”。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“金的，金；银的，银”，重复材质名称，以强调按材质分类。
    reason: lexical_alternative
  - marker: d
    text: 或译“行刑者之长”或“王室卫队长”。这是巴比伦的一种官衔。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: 火铲
  rationale: מַחְתָּה指圣殿礼仪中盛取或搬运火炭的器具；“火铲”自然简明，又不限定为专门焚香之用。
- source_word: הַמִּזְרָקוֹת
  choice: 碗
  rationale: מִזְרָק指盛放或洒献祭液体的器皿；“碗”符合器皿语境，同时在脚注保留“盆”这一可能译法。
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: 金的归金，银的归银
  rationale: 原文重复“金”和“银”，按材质分类并带有简短清单式强调；此译法以自然汉语保留分类与重复效果。
- source_word: לָקַח
  choice: 拿走了
  rationale: לָקַח基本义为“拿、取”；上下文涉及掳掠，“拿走了”既贴近词义，也自然传达物品被带走。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 该组合在此是巴比伦官衔；“护卫长”简洁自然，并在脚注保留其字面及其他职衔理解。
