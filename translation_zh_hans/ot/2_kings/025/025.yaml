base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: zh_hans
  text: 到了七月，王室后裔以实玛利[a]——他是尼探雅的儿子、以利沙玛的孙子——带着十个人来到米斯巴。他们击杀了基大利，基大利就死了；他们也击杀了在米斯巴同他在一起的犹大人和迦勒底人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“王室的种子”，意思是出自王室血统。
    reason: lexical_alternative
  - marker: b
    text: “迦勒底人”在这里也可译作“巴比伦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: 到了七月
  rationale: 以现代汉语自然的叙事时间句式表达希伯来语事件引入语，同时保留“第七月”的时间信息；按中文历月习惯简洁译为“七月”。
- source_word: בָּא
  choice: 来到米斯巴
  rationale: 希伯来语动词意为“来、到达”；将句末地点提前与动词连用，符合现代汉语语序，不改变事件关系。
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: 王室后裔
  rationale: 准确表达王朝血统含义，又比直译“王室的种子”自然庄重；脚注保留原文的字面意象。
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: 带着十个人
  rationale: 自然表达随行关系，并保留确切人数。
- source_word: וַיַּכּוּ
  choice: 击杀了
  rationale: נכה表示击打、击倒，此处上下文明确造成死亡；“击杀”既保留暴力动作，也适合历史叙事。后接“基大利就死了”，保留原文动作与结果并列的表达。
- source_word: וַיָּמֹת
  choice: 基大利就死了
  rationale: 单数动词最自然地指向基大利。中文补出姓名以避免代词指向含混，同时保留原文另述其死亡结果的结构。
- source_word: הַיְהוּדִים
  choice: 犹大人
  rationale: 在王国覆亡及被掳初期的历史语境中，主要指犹大地区或犹大国的人；“犹大人”比可能带有后期宗教族群色彩的译法更贴切。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留希伯来语的族名称谓；在本语境中所指为巴比伦方面的人，另以脚注说明。
- source_word: בַּמִּצְפָּה
  choice: 在米斯巴
  rationale: 采用该地名通行的中文音译，并自然表达地点关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的历史叙事语体。为使中文清楚，将地点“米斯巴”移到“来到”之后，并在后半句用“在那里”回指；原文连续列出的受害者关系则通过补出第二个“击杀”清楚表达。
