  text: שְׁמֹנֶה֩ עֶשְׂרֵ֨ה אַמָּ֜ה קוֹמַ֣ת הָ/עַמּ֣וּד הָ/אֶחָ֗ד וְ/כֹתֶ֨רֶת עָלָ֥י/ו נְחֹשֶׁת֮ וְ/קוֹמַ֣ת הַ/כֹּתֶרֶת֮ שָׁלֹ֣שׁ אמה וּ/שְׂבָכָ֨ה וְ/רִמֹּנִ֧ים עַֽל הַ/כֹּתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י עַל הַ/שְּׂבָכָֽה׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: zh_hans
  text: 这一根柱子高十八肘，柱上有铜柱头；柱头高三肘。柱头周围有网状饰带[a]和石榴装饰，全都是铜的。第二根柱子也有同样的配置，包括网状饰带。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “网状饰带”也可译作“网饰”，指柱头上像网一样的装饰结构。
    reason: lexical_alternative
  - marker: b
    text: 本句希伯来文较为省略，直译近于：“第二根柱子也有像这些的，在网状饰带上。”其意通常是第二根柱子也有与第一根相同的装饰配置，包括网状饰带；句法上未明确逐一指明哪些装饰与“网状饰带上”相连。
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  choice: 高
  rationale: 在建筑尺寸的语境中表示高度；用“高”简洁自然，并准确表达构造关系。
- source_word: עַמּוּד
  choice: 柱子
  rationale: 指圣殿前的巨型铜柱；“柱子”是现代普通读者容易理解且符合语境的说法。
- source_word: כֹתֶרֶת
  choice: 柱头
  rationale: 指柱子顶部的装饰性构件；“柱头”是准确而通行的现代汉语建筑术语。
- source_word: נְחֹשֶׁת
  choice: 铜
  rationale: 该词可指铜或铜合金；古代圣殿器物的具体合金成分未必能够确定，因此采用较宽泛、自然的“铜”，不强行限定为青铜。
- source_word: שְׂבָכָה
  choice: 网状饰带
  rationale: 该词指柱头上像网一样的装饰结构；“网状饰带”兼顾其形态和装饰功能。
- source_word: רִמֹּנִים
  choice: 石榴装饰
  rationale: 此处指石榴形的装饰物，而非可食用的果实；补出“装饰”可避免误解，同时保留原文意象。
- source_word: סָבִיב
  choice: 周围
  rationale: 准确表达装饰环绕柱头的空间关系。
- source_word: הַכֹּל נְחֹשֶׁת
  choice: 全都是铜的
  rationale: 自然地概括前述柱头装饰构件的材质。
- source_word: וְכָאֵלֶּה לַעַמּוּד הַשֵּׁנִי עַל הַשְּׂבָכָה
  choice: 第二根柱子的网状饰带上也有同样的装饰
  rationale: 原文末句省略了若干可由上下文补足的成分；译文以最少增补说明第二根柱子的网状饰带具有相同装饰，同时用脚注保留原文句法的含混性。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙述语体。保留“肘”这一古代长度单位，不在正文中加入未经原文表达的换算。“柱头”“网状饰带”兼顾建筑准确性与普通读者的可理解性。英文咨询层的脚注[a]位置与内容不相符，因此按希伯来文词项将该词汇脚注放在“网状饰带”之后。
