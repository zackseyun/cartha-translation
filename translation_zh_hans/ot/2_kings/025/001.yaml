  text: וַ/יְהִי֩ בִ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/מָלְכ֗/וֹ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִי֮ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֒ בָּ֠א נְבֻכַדְנֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֜ל ה֧וּא וְ/כָל חֵיל֛/וֹ עַל יְרוּשָׁלִַ֖ם וַ/יִּ֣חַן עָלֶ֑י/הָ וַ/יִּבְנ֥וּ עָלֶ֖י/הָ דָּיֵ֥ק סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: zh_hans
  text: 西底家作王第九年十月十日，巴比伦王尼布甲尼撒和他的全军前来攻打耶路撒冷；他们在耶路撒冷城外安营，又在城的四周修筑围城工事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “围城工事”：希伯来语所指可能包括围城墙、土垒或其他攻城设施。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出）
  rationale: 这是希伯来叙事中承接并引入事件的常用形式。现代汉语可直接从时间状语起句，避免生硬的“事情发生在”。
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: 西底家作王第九年
  rationale: 原文只有“他作王第九年”，所指由上文确定为西底家。为使单节阅读清楚，正文补出其名，同时保留标准纪年表达。
- source_word: בַחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: 十月初十日
  rationale: 准确保留原文的月份和日期，不换算为现代月份；“初十日”是自然、明确的现代汉语日期表达。
- source_word: נְבֻכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: 巴比伦王尼布甲尼撒
  rationale: 采用现代中文圣经及历史叙述中通行的人名和王号次序。
- source_word: הוּא וְכָל חֵילוֹ
  choice: 亲自率领全军
  rationale: 原文直译为“他和他的全军”，其中独立代词强调君王本人也在场。“亲自率领全军”自然表达这一强调，但不额外指定军队构成。
- source_word: עַל יְרוּשָׁלַםִ
  choice: 前来攻打耶路撒冷
  rationale: 在军事与围城语境中，עַל 表示敌对行动；“攻打”比单纯“来到”更清楚地传达其方向与目的。
- source_word: וַיִּחַן עָלֶיהָ
  choice: 安营围困城
  rationale: חנה 表示扎营；结合 עַל 和围城上下文，“围困城”自然表达军营对城的敌对部署。
- source_word: דָּיֵק
  choice: 围城工事
  rationale: 该词泛指攻城时针对城邑修建的军事设施，具体形态并不完全确定。“围城工事”既准确又保留其语义范围。
- source_word: סָבִיב
  choice: 在城的四周
  rationale: 直接表达军队所筑工事环绕耶路撒冷。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留古代纪年方式，以短句呈现连续军事行动。英文资料中的脚注标记与内容明显错配：其[a]实际解释דָּיֵק，[b]实际说明王名拼写；中文稿据原文重新配置，只为语义确有范围的דָּיֵק设置脚注，不为中文已有稳定译名的尼布甲尼撒另设音译脚注。
