base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: zh_hans
  text: 他换下囚服，终身常在王面前[a]吃饭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“在他面前”。这句话也可能指他在王的席上用餐。
    reason: 保留 לְפָנָיו 的字面含义，并说明宫廷语境下可能包含在王席前用餐的意思。
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: 他换下
  rationale: שׁנה 的皮勒式意为“更换、改变”。与“囚服”连用时，语境表明他脱去并更换了监禁期间所穿的衣服；“换下”是自然的现代汉语表达。
- source_word: בִּגְדֵי כִלְאוֹ
  choice: 囚服
  rationale: 该词组直译为“他被囚禁时的衣服”。“囚服”简洁自然，并保留其与监禁状态的关联。
- source_word: וְאָכַל לֶחֶם
  choice: 吃饭
  rationale: 字面为“吃饼/吃食物”，在希伯来语中是进餐的常用说法。现代汉语用“吃饭”最自然，不必机械译作“吃饼”。
- source_word: תָּמִיד
  choice: 常
  rationale: תָּמִיד 表示持续或有规律地不断进行；“常”与随后涵盖余生的时间表达配合自然。
- source_word: לְפָנָיו
  choice: 在王面前
  rationale: 字面是“在他面前”。根据上文，此人指巴比伦王；明说“王”可避免汉语代词指向含混，同时保留“面前”这一较宽泛的原文措辞，未直接限定为“同席”。
- source_word: כָּל יְמֵי חַיָּיו
  choice: 终身
  rationale: 该固定表达字面为“他一生所有的日子”，意为在其余生持续如此；“终身”准确而简洁。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而简洁的叙事体。“吃饭”比字面直译“吃饼”更符合现代汉语习惯；“在王面前”则保留原文可能仅指在王面前进餐、也可能指在王席上用餐的含义范围。
