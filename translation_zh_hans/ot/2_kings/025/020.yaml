base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: zh_hans
  text: 护卫长尼布撒拉旦把他们带走，押到在利比拉的巴比伦王面前。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们带到在利比拉的巴比伦王那里。”
    reason: lexical_alternative
  - marker: b
    text: “护卫长”希伯来文直译为“屠宰者（或行刑者）之长”，很可能是王室军务或安全官员的官衔。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 把他们带走
  rationale: לקח在此叙事语境中表示把这些已经受拘押的人带走；不译作“抓住”或“俘虏”，以免增添原文未明说的武力或再次俘获之意。
- source_word: נְבוּזַרְאֲדָן
  choice: 尼布撒拉旦
  rationale: 采用现代中文圣经传统中通行且易辨认的人名音译。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 该词组字面涉及“屠宰者／行刑者之长”，但在新巴比伦宫廷语境中是军政或王室安全官衔；“护卫长”自然、庄重，并避免把官职误解为普通屠夫。
- source_word: וַיֹּלֶךְ
  choice: 押到
  rationale: 使役形在带人物宾语及目的地时意为使其前往。因对象是囚犯，“押到”符合语境，但不把前一动词本身强化为“抓获”。
- source_word: עַל
  choice: 到……那里
  rationale: 与移动动词连用时表示来到某人面前或所在之处；正文采用自然中文“到……那里”，并在脚注保留“带到……面前”的司法或觐见色彩。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 按希伯来语属格结构直接、自然地翻译。
- source_word: רִבְלָתָה
  choice: 在利比拉
  rationale: 带方向词尾的地名在整句中既可理解为前往利比拉，也可修饰王当时所在的位置；正文按后者译为“在利比拉的巴比伦王”，另一种句法理解见脚注。
