  text: וַ/אֲרֻחָת֗/וֹ אֲרֻחַ֨ת תָּמִ֧יד נִתְּנָה לּ֛/וֹ מֵ/אֵ֥ת הַ/מֶּ֖לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ כֹּ֖ל יְמֵ֥י חַיָּֽ/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: zh_hans
  text: 他的供给[a]，就是持续不断的供给，是王每天按当天的份额赐给他的，直到他终身。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “供给”也可译作“口粮”、“份额”或“生活供应”。原文指分配给他的生活所需。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: 供给
  rationale: 该词指王为约雅斤所分配并持续提供的生活所需；“供给”既可涵盖食物，也保留所分配之供应的较广含义。
- source_word: תָּמִיד
  choice: 持续不断的
  rationale: 此处修饰“供给”，表示这种供应是连续、恒常的；“持续不断的”准确表达其延续性。
- source_word: נִתְּנָה
  choice: 赐给
  rationale: 这是 נתן 的被动式；因施予者是王，“赐给”在现代中文中自然地表达君王给予，同时没有增添额外制度含义。
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: 由王
  rationale: 该短语表示供给的来源；“由王赐给他”在中文中自然，并保留供应出自王的意思。
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: 每天的份额，都按日供应
  rationale: 希伯来语直译近于“每日之事，在其当日”，具有逐日分配的习语含义；此译既表达每日应得的份额，也保留按日供应的分配性。
- source_word: כֹּל יְמֵי חַיָּו
  choice: 直到他终身
  rationale: 表达供应贯穿他一生；中文“直到他终身”简洁地保留终身持续的时间范围。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“供给”避免把原文范围过度限定为单纯的膳食；“每天的份额，都按日供应”以自然中文传达希伯来语习语的逐日分配意味。
