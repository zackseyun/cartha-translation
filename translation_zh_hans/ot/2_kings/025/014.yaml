base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: zh_hans
  text: 他们又把锅、铲子、灯芯剪[a]、盘子，以及一切用来事奉的铜器，都拿走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“刀”或“修枝刀”。希伯来语这个词可能指切剪用的器具；在圣殿器具的语境中，通常理解为修剪灯芯的工具。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: 锅
  rationale: סִירוֹת通常指锅或容器；在圣殿器具清单中，“锅”自然、简洁，也不过度限定具体用途。
- source_word: הַיָּעִים
  choice: 铲子
  rationale: יָעִים指清除灰烬或搬动炭火的器具；“铲子”符合祭祀器具的语境。
- source_word: הַמְזַמְּרוֹת
  choice: 剪灯芯的剪刀
  rationale: 该词本义与切剪工具有关；在圣殿器具清单中通常理解为修剪灯芯的器具。正文采用功能明确的自然汉语，并以脚注保留“刀具”等词义可能。
- source_word: הַכַּפּוֹת
  choice: 盘子
  rationale: כַּף在这里可指小型盛器、盘或匙状器具；“盘子”可读性强，同时不把形制限定得过窄。
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: 一切铜器
  rationale: כְּלִים泛指器具或容器；נְחֹשֶׁת在古代器物语境中常指铜或青铜。“铜器”是现代中文圣殿器物清单中自然且不过度技术化的表达。
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: 供殿中服事用
  rationale: שרת在礼仪语境中指圣殿中的职事或礼仪服务。“供殿中服事用”保留其祭祀含义，并避免原文复数动词的未明主语在中文中造成突兀。
- source_word: לָקָחוּ
  choice: 拿走了
  rationale: 该动词基本义是“拿”；在掠走圣殿器具的上下文中译作“拿走了”，自然地表达物品被移走。
theological_decisions: []
