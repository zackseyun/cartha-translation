revisions:
- from: 雅威殿里的铜柱、支架[a]和铜海，迦勒底人[b]都打碎了，并把这些物件的铜运到巴比伦。
  to: 迦勒底人[b]打碎了雅威殿中的青铜柱、支架[a]和青铜海，并把这些器物的青铜运往巴比伦。
  rationale: 仅作必要的术语校正：将 נְחֹשֶׁת 统一译为“青铜”，以符合原文在圣殿器物语境中的金属含义及英文审校轨迹。句序略作调整，使主语先行并符合现代汉语叙述习惯，意义未变。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:39Z'
