base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: zh_hans
  text: 迦勒底人[b]打碎了雅威殿中的青铜柱、支架[a]和青铜海，并把这些器物的青铜运往巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “支架”或译“底座”，指承托圣殿洗濯盆的结构。
    reason: lexical_alternative
  - marker: b
    text: 这里的“迦勒底人”指巴比伦军队。
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: 铜柱
  rationale: עַמּוּדִים指柱子；נְחֹשֶׁת在圣殿器物语境中通常指青铜。译作“铜柱”自然简洁，也符合上下文。
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: 雅威殿里的
  rationale: 希伯来语关系从句省略了系词和方位介词；上下文表明是在说明这些器物位于雅威的殿中。
- source_word: הַמְּכֹנוֹת
  choice: 支架
  rationale: 指承托圣殿洗濯盆的结构。“支架”比“底座”更直观，同时保留其支承功能。
- source_word: יָם הַנְּחֹשֶׁת
  choice: 铜海
  rationale: 直译为“铜海”，是圣殿中大型铜盆的专称；保留“海”的源文意象，避免直接释义为“铜盆”。
- source_word: שִׁבְּרוּ
  choice: 打碎了
  rationale: 此处指把大型铜制器物拆毁成块，以便搬运；“打碎”准确体现动作结果。
- source_word: כַשְׂדִּים
  choice: 迦勒底人
  rationale: 按原文族称直译；在本段历史语境中指巴比伦军队。
- source_word: וַיִּשְׂאוּ
  choice: 并把……运到
  rationale: נשא在这里指搬走、运走，后接目的地巴比伦；“运到”符合现代汉语表达。
- source_word: נְחֻשְׁתָּם
  choice: 这些物件的铜
  rationale: 第三人称复数后缀回指前述铜柱、支架和铜海。若直译为“它们的铜”略显生硬，因此明示为“这些物件的铜”。
- source_word: בָּבֶלָה
  choice: 到巴比伦
  rationale: 方向词尾表示朝向巴比伦的移动，汉语自然译作“到巴比伦”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”旨在以音译保留神的专名；“耶和华”是汉语传统译名，但反映的是较晚形成的读音。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。调整了希伯来语宾语前置的结构，使句子符合汉语习惯，同时用“都”维持前列三类器物共同受“打碎”支配的关系；保留“铜海”这一圣殿器物专称及其源文意象。
