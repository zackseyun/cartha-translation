  naturalness: 原译整体庄重、清楚。“雅威殿里的”可保留，但“雅威殿中的”在经文体和书面现代汉语中更凝练。为避免“把这些器物的青铜运到”在口语中略显拗口，改为“把这些器物的青铜运往巴比伦”，仍保留原文的方向和运输含义。
  terminology: “雅威”“迦勒底人”“支架”“青铜海”均合适。“青铜海”保留 יָם 的既定器物名称及意象，不将其解释性改作“盆”。脚注中的“底座”是可接受的词汇替代；“洗濯盆”可作为圣殿器物的说明。
