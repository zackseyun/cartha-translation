  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם הָֽ/אֶחָד֙ וְ/הַ/מְּכֹנ֔וֹת אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֹ֖שֶׁת כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: zh_hans
  text: 那两根柱子、那一个“海”和那些底座，都是所罗门为雅威的殿所造的；这一切器物的铜多得无法称量[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作：“这一切器物的铜没有重量。”按上下文，这句话通常是说铜的数量极多，因而没有称量。
    reason: 原文“没有重量／称量”的名词表达可有不同译法；脚注保留其字面形式，并说明正文的语境性理解。
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: 两根柱子
  rationale: עַמּוּדִים指圣殿中的两根大型铜柱；“柱子”自然、明确，也符合上下文中的建筑陈设。
- source_word: הַיָּם הָאֶחָד
  choice: 一个铜海
  rationale: יָם在此是圣殿大型铜盆的专名；译作“铜海”既承接本书前文的具体材质，又保留希伯来文的形象和礼仪器物名称。
- source_word: וְהַמְּכֹנוֹת
  choice: 那些底座
  rationale: מְכֹנוֹת指承托洗濯盆的座架；“底座”是现代中文中具体易懂的表达。
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה לְבֵית יְהוָה
  choice: 都是所罗门为雅威的殿造的
  rationale: 保留关系从句的归属说明；בֵית按圣殿语境译作“殿”，而不是较生硬的“家”。
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֹשֶׁת
  choice: 所用的铜多得无法称量
  rationale: מִשְׁקָל可指“重量”或“称量”；本句是说铜数量极大，以自然中文表达为“多得无法称量”，同时以脚注保留较直译的可能。
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: 这一切器物
  rationale: כֵּלִים在此概括前述圣殿陈设；“器物”比“器皿”更能涵盖柱子、铜海和底座。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”在现代汉语中较贴近该名通常重构的读音，并将其作为专名保留，不以称号代替。
- issue: “没有重量／没有称量”的理解
  choice: 铜多得无法称量
  alternative: 这些器物的铜没有重量；这些铜没有经过称量
  rationale: 上下文强调被掠圣殿铜器数量巨大。正文采用合乎汉语习惯的数量性表达，但不把它解释为铜在物理上没有重量；脚注保留希伯来语名词结构的歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“铜海”保留圣殿器物的传统专名感；分号呈现前述器物与重量说明之间的转折推进。
