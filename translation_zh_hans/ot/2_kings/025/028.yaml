base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/028.yaml
  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: zh_hans
  text: 他亲切地对他说[a]，又把他的宝座[b]置于在巴比伦与巴比伦王同在的众王的宝座之上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“对他说好话”，这是表示以善意或恩惠对他说话的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: “宝座”也可具体理解为“座位”；这里的意思是，约雅斤的席位和品级被置于在巴比伦的其他王之上。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: 他亲切地对他说话
  rationale: 希伯来语直译为“对他说好话”，在此是表示友善、优待的惯用表达；译作“亲切地对他说话”自然地传达其语用意义。
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: 使他的座位
  rationale: נתן与כִּסֵּא连用，在此指安排或确立约雅斤的席位及地位，并非把一件座具赠给他；“使……高过”也与后面的比较结构自然衔接。
- source_word: כִּסְאוֹ
  choice: 他的座位
  rationale: כִּסֵּא既可指宝座，也可指座位。这里的宫廷场景侧重获赐较高席位及相应品级；“座位”保留具体意象，并由脚注说明其王权和身份含义。
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: 高过……众王的座位
  rationale: מֵעַל表达位置或品级在上；希伯来语虽以单数“座位”构成属格，但现代汉语用“众王的座位”更自然，且不改变比较含义。
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: 与他同在的众王
  rationale: 贴近关系从句的字面结构；语境中的“他”指巴比伦王，所说的是在其宫廷中的其他诸王。
- source_word: בְּבָבֶל
  choice: 在巴比伦
  rationale: 按标准地点用法直译。
