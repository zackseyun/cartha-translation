  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: zh_hans
  text: 他从城中带走一名官员[a]，这人负责管理作战人员；又带走五名在城中找到的、得以朝见王的人[b]，以及军队统帅的书记官，他负责征召当地百姓[c]；还有六十名在城中找到的当地百姓。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“宦官”。希伯来语这个词既可指宦官，也可指宫廷或行政官员。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“见王面的人”，是指有资格直接朝见王的人，可能是王的近臣或宫廷官员。
    reason: cultural_note
  - marker: c
    text: “征召”也可译作“登记”或“召集入伍”。
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: 官员
  rationale: 该词既可指宦官，也可泛指王室或行政官员；上下文强调其军事管理职务，译作“官员”可避免断定其身体身份。
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: 负责管理战士
  rationale: פָקִיד表示受委任掌管某事的人；此译自然表达其对作战人员负有管理职责。
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: 可以朝见王的人
  rationale: 保留“见王的面”这一宫廷用语的核心意象，同时用现代汉语表明这些人有直接觐见王的资格。
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: 军队书记官
  rationale: 希伯来语结构紧凑，可理解为军队中的书记官，也可能涉及“军队统帅”的称谓；按平行经文耶利米书52:25的较完整措辞及其征兵职能，译作“军队书记官”最为通顺，但不扩写为两个明确人物。
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: 负责征召当地百姓
  rationale: צבא的使役分词在此指为军事用途召集、登记或征募人员；“征召”准确传达军事行政语境。
- source_word: עַם הָאָרֶץ
  choice: 当地百姓
  rationale: 该短语指这片土地上的民众，并可能带有与宫廷精英相对的社会意味；“当地百姓”在现代汉语中自然，又不武断限定为特定阶层。
- source_word: לָקַח
  choice: 带走
  rationale: 基本义为“拿、取”；在城破后拘押人员的上下文中，“带走”自然表达其被押离城中的结果，而不过度强化为“抓获”。
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  choice: 找到的
  rationale: 保留מצא的被动语义，表明这些人在城中被发现。
theological_decisions: []
