  text: וְ/אֶת בְּנֵי֙ צִדְקִיָּ֔הוּ שָׁחֲט֖וּ לְ/עֵינָ֑י/ו וְ/אֶת עֵינֵ֤י צִדְקִיָּ֨הוּ֙ עִוֵּ֔ר וַ/יַּאַסְרֵ֨/הוּ֙ בַֽ/נְחֻשְׁתַּ֔יִם וַ/יְבִאֵ֖/הוּ בָּבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: zh_hans
  text: 他们当着西底家的面宰杀了他的众子；他又弄瞎了西底家的双眼[a]，用青铜镣铐捆住他，把他带到巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使西底家失明”。希伯来动词意为“使失明”；这里以“双眼”为宾语，指他的视力被毁。
    reason: 说明原文动词的基本含义，并避免把“弄瞎”误解为原文明确交代了具体手段。
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: 宰杀
  rationale: 该动词常指屠宰、杀戮；“宰杀”保留了叙事中的残酷力度，比一般的“杀死”更贴近原文。
- source_word: לְעֵינָיו
  choice: 当着西底家的面
  rationale: 这是表示亲眼目睹的惯用表达；译为“当着……的面”自然、清楚，并保留原文的强烈画面。
- source_word: עִוֵּר
  choice: 弄瞎了……双眼
  rationale: 该动词意为“使失明”。原文以“西底家的双眼”为宾语，在暴力叙事中译作“弄瞎了……双眼”既具体自然，也不擅自断定所用手段。
- source_word: וַיַּאַסְרֵהוּ
  choice: 锁住他
  rationale: 该动词意为捆绑或囚禁；与后面的铜制刑具连用时，“用铜镣锁住他”准确而符合现代汉语。
- source_word: בַנְחֻשְׁתַּיִם
  choice: 用铜镣
  rationale: 该形式指铜制的成对或复数拘束刑具。“铜镣”简洁庄重，也比泛称“铜链”更能表达束缚犯人的器具。
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: 把他带到巴比伦
  rationale: 直译原文常用的“带来／带去”动词；按中文叙事视角译为“带到”最自然。
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: 西底家的……众子
  rationale: “众子”保留复数含义，并以自然的中文领属结构表达原文的构词关系。
theological_decisions:
- issue: 动词主语由复数转为单数
  choice: 前句用“他们”，后句另起“他”
  alternative: 后句明确译作“巴比伦王”
  rationale: 希伯来文先用第三人称复数“他们宰杀”，随后转为第三人称单数“他弄瞎、锁住、带到”。译文保留这一语法转换，不把上下文中的身份说明直接增入本节。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“宰杀”保留暴力力度；“弄瞎了……双眼”比“使……失明”更具叙事现场感，却不增加挖眼、刺眼等原文未明说的细节。分号清楚标示复数主语转为单数主语。
