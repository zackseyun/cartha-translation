base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: zh_hans
  text: 巴比伦王在哈马地的利比拉击打他们，并杀死他们。[a]于是，犹大被掳离开本土。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “击打他们”也可译为“杀了他们”。希伯来原文连续使用两个动词：“击打他们”和“杀死他们”。
    reason: lexical_alternative
  - marker: b
    text: 或译：“犹大离开本土，流亡去了。”希伯来语动词可按主动方式表达，也可依语境译成被动；被动译法更突出这是被迫迁徙。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ אֹתָם
  choice: 击打他们
  rationale: נכה通常表示“击打、击杀”。这里后接“将他们处死”，因此保留“击打”，避免把原文相继使用的两个动词合并为一个“杀死”。
- source_word: וַיְמִיתֵם
  choice: 将他们处死
  rationale: מות的使役形表示“使其死亡”。“处死”既清楚表达使役意义，又不必像“处决”那样额外强调正式司法程序。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 这是自然、简洁的现代汉语属格表达。
- source_word: בְּרִבְלָה בְּאֶרֶץ חֲמָת
  choice: 在哈马地的利比拉
  rationale: 忠实保留地点名称及利比拉位于哈马地域内的关系，表达符合现代汉语习惯。
- source_word: וַיִּגֶל יְהוּדָה
  choice: 犹大……被掳走了
  rationale: 在亡国流徙的语境中，גלה表示离开本土进入流亡状态；“被掳走”自然传达迁离并非自愿，同时保留“犹大”以整体指其国民的简洁转喻。
- source_word: מֵעַל אַדְמָתוֹ
  choice: 从自己的土地上
  rationale: אדמה可指地土或土地；这里是国家被掳的语境，“土地”最合适。“自己的”清楚对应指向犹大的第三人称词尾。
theological_decisions:
- issue: 犹大流亡的语态与强制性
  choice: 译作“犹大从自己的土地上被掳走了”
  alternative: “犹大从自己的土地上流亡了”
  rationale: 希伯来语动词形式可直述犹大进入流亡，但上下文表明这是强制迁徙。正文采用被动式呈现这一语境，同时以脚注保留较主动的译法。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。正文保留原文“击打—处死”的双动词结构，并以“被掳走”表达亡国后遭强制迁离的语境；地名使用通行的《圣经》汉语译名“哈马”和“利比拉”。
