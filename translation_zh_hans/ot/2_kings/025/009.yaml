  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: zh_hans
  text: 他放火烧了雅威的殿[a]、王宫、耶路撒冷所有的房屋，以及一切高大的房屋[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“雅威的房屋”，即雅威的圣殿。
    reason: lexical_alternative
  - marker: b
    text: “高大的房屋”也可译作“显贵的房屋”或“重要的房屋”；希伯来语可指规模宏大，也可指地位显要。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: 他放火烧了
  rationale: שׂרף的Qal叙事形式表示焚烧；“放火烧了”在现代汉语中自然，并与句末בָּאֵשׁ所强调的用火焚烧相呼应。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 字面为“雅威的房屋”；在此历史叙事语境中明确指圣殿。“殿”既自然庄重，也保留宗教建筑含义；字面表达列入脚注。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现神的专名，并采用现代中文可读的音译。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋”，语境所指是王的宫殿；“王宫”是现代汉语准确自然的对应。
- source_word: כָּל בָּתֵּי יְרוּשָׁלַםִ
  choice: 耶路撒冷所有的房屋
  rationale: 直接表达该组合结构的整体范围，避免把房屋类型进一步限定。
- source_word: כָּל בֵּית גָּדוֹל
  choice: 一切高大的房屋
  rationale: כָּל加单数名词具有逐一或总括意义；גָּדוֹל可指体量大或地位显要。正文采用“高大”保留主要空间意义，显贵、重要之义在脚注说明。
- source_word: שָׂרַף בָּאֵשׁ
  choice: 放火烧了
  rationale: 希伯来文末尾再次使用“烧”并加“用火”，带有强调作用；中文将其融入句首谓语，避免生硬重复，同时保留用火焚毁的力度。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名而非称号。正文以“雅威”音译，保持专名性质；其他传统译法虽为中文读者熟悉，但会采用不同的发音传统或以称号替代专名。
- issue: בֵּית יְהוָה所指建筑的表达
  choice: 雅威的殿
  alternative: 雅威的家；雅威的圣殿
  rationale: 此处所指是耶路撒冷圣殿。“殿”清楚自然，又不额外加入原文没有的“圣”字；脚注保留字面形式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“殿”与“王宫”避免字面直译造成的含混；“高大的房屋”及脚注共同保留גָּדוֹל在大小与显要程度之间的语义张力。
