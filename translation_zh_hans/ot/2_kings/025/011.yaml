  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: zh_hans
  text: 护卫长[b]尼布撒拉旦把城里剩下的百姓、那些投奔巴比伦王的人[a]，以及其余的民众[c]都掳走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “投奔”原文直译为“倒向”或“落到……那里”，在这里指归附巴比伦王。
    reason: lexical_alternative
  - marker: b
    text: “护卫长”原文直译为“屠宰者之长”，很可能是王室卫队统领的官衔。
    reason: cultural_note
  - marker: c
    text: “民众”也可译作“人群”或“人口”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: 城里剩下的百姓
  rationale: 忠实表达围城之后仍留在城中的其余居民；“百姓”自然对应 עָם。
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל הַמֶּלֶךְ בָּבֶל
  choice: 那些投奔巴比伦王的人
  rationale: נפל על 在军事政治语境中是归附、投奔一方的惯用表达，并非字面上的“跌倒”；译文不额外断定他们原有的军事身份。
- source_word: יֶתֶר הֶהָמוֹן
  choice: 其余的民众
  rationale: הָמוֹן 在此泛指一大群人；“民众”保留其宽泛集体含义，又比“群众”更适合庄重历史叙事。
- source_word: הֶגְלָה
  choice: 掳走了
  rationale: 使役形表达强制迁移、放逐；“掳走”简洁自然，并与战败后被迁徙的语境相合。
- source_word: נְבוּזַרְאֲדָן
  choice: 尼布撒拉旦
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是巴比伦官衔；按职能译作“护卫长”，避免将字面“屠宰者之长”误解为普通职业或单纯的刽子手。
