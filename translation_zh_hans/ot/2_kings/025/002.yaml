    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: 一直被围困
  rationale: בוא字面为“来、进入”，但在“城进入围困”这一希伯来语表达中，所指是城处于被围困的持续状态；结合עַד所引出的时间终点，译作“一直被围困”自然且准确。
- source_word: הָעִיר
  choice: 这城
  rationale: עִיר带定冠词，指上下文已经明确的城市；现代汉语用“这城”衔接自然。
- source_word: בַּמָּצוֹר
  choice: 被围困
  rationale: מָצוֹר指围城或围困状态；与בוא构成表达时，译为“被围困”符合现代汉语习惯。
- source_word: עַד
  choice: 直到
  rationale: 表示围困状态持续至某一时间终点。
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: 第十一年
  rationale: 在君王纪年公式中，希伯来语基数表达应按汉语惯例译为序数“第十一年”。
- source_word: לַמֶּלֶךְ
  choice: 王在位
  rationale: 此处介词ל用于君王纪年，表示其统治期间；译作“王在位”明确传达纪年意义。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代中文圣经传统中通行的人名音译。
