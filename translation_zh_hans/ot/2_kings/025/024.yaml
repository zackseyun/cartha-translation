  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: zh_hans
  text: 基大利雅向他们和他们的人起誓，并对他们说：“不要惧怕迦勒底人的臣仆[a]。你们要住在这地，服事巴比伦王；这样，你们就会过得好。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”在这里也可译作“巴比伦人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: 起誓
  rationale: נפעל形式的שׁבע通常表示“起誓”。“向他们……起誓”简洁自然，也保留了郑重保证的语气。
- source_word: וּלְאַנְשֵׁיהֶם
  choice: 和他们的人
  rationale: אַנְשֵׁי字面意为“……的人”。此处可能指随从、部下或士兵；正文采用较宽泛的表达，避免过度限定。
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: 怕迦勒底人的臣仆
  rationale: 介词מִן接在“怕”之后，表示所惧怕的对象；עֲבָדִים字面是“仆人、臣仆”，在这里可能指巴比伦政权的官员或代理人。
- source_word: הַכַּשְׂדִּים
  choice: 迦勒底人
  rationale: 保留希伯来文的族名称谓；在本段历史语境中，这一称呼通常指巴比伦人或巴比伦政权。
- source_word: שְׁבוּ בָאָרֶץ
  choice: 住在这地
  rationale: ישׁב可表示居住、留居或定居。“住在这地”符合语境，也不排除“留在这地”的含义。
- source_word: וְעִבְדוּ אֶת־מֶלֶךְ בָּבֶל
  choice: 服事巴比伦王
  rationale: עבד以人为宾语时通常表示“服事”。此处带有臣服于巴比伦统治的政治含义，但正文不将其解释性地改写为“归顺”。
- source_word: וְיִטַב לָכֶם
  choice: 你们就会过得好
  rationale: 这是表示境况良好的惯用说法。译文采用自然的现代汉语，传达将有良好结果的应许。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“他们的人”的宽泛含义以及“臣仆”在普通仆役、官员或政权代理人之间的语义张力；政治上的臣服含义由上下文呈现，不在正文中额外强化。
