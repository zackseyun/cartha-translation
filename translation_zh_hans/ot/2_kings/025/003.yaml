base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: zh_hans
  text: 四月初九[a]，城中的饥荒越发严重，当地百姓[b]没有粮食了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “四月”根据上文补出；原文直译为“该月的第九日”。
    reason: contextual_clarification
  - marker: b
    text: 原文直译为“这地的百姓”；也可指当地民众，在某些语境中可特指普通百姓。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“饼”或“面包”；在这里可泛指维生的食物。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: 四月初九
  rationale: 希伯来文直译为“本月初九”，月份须由上文（王下25:2）补明为四月；现代中文在连续叙事中补出月份更清楚。
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: 饥荒越发严重
  rationale: חזק本义涉及“强盛、加剧”；以饥荒为主语时，译作“越发严重”自然地表达其加剧。
- source_word: בָּעִיר
  choice: 城里
  rationale: 直接表达地点；上下文已明确是耶路撒冷，因此保留原文的泛称“城”。
- source_word: וְלֹא הָיָה לֶחֶם
  choice: 已经没有粮食了
  rationale: לֶחֶם字面为“饼、食物”，此处在围城饥荒语境中泛指维生的粮食；“粮食”比“饼”更符合现代中文，同时保留食物匮乏的具体含义。
- source_word: לְעַם הָאָרֶץ
  choice: 境内的百姓
  rationale: עַם הָאָרֶץ字面为“这地的人民”，也可能指普通民众或本地居民；“境内的百姓”保留地域含义而不武断限定其社会阶层。
