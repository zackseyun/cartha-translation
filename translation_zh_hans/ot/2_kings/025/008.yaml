base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: zh_hans
  text: 五月初七日，就是巴比伦王尼布甲尼撒在位第十九年，巴比伦王的臣仆、护卫长[a]尼布撒拉旦来到耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护卫长”原文直译为“宰杀者之长”，可能指王室护卫或行刑人员的统领。
    reason: 说明该宫廷职衔的字面意义及可能的语境含义，保留原词的词义范围。
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי בְּשִׁבְעָה לַחֹדֶשׁ
  choice: 第五月初七日
  rationale: 按希伯来日期格式直陈月份和日期；“初七日”是现代中文中清楚自然的月内日期表达。
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: 就是巴比伦王尼布甲尼撒在位第十九年
  rationale: הִיא引出补充说明；לַמֶּלֶךְ在此表示君王纪年，译作“在位第十九年”符合中文纪年习惯。
- source_word: נְבֻכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בָּא
  choice: 来到
  rationale: 忠实表达普通叙事动词בוא，同时与目的地“耶路撒冷”自然搭配。
- source_word: נְבוּזַרְאֲדָן
  choice: 尼布撒拉旦
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 该宫廷职衔字面涉及“宰杀者”，在此语境中通常指王室护卫或行刑人员的统领；正文用“护卫长”清楚表达其官职，字面意义收入脚注。
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: 巴比伦王的臣仆
  rationale: עֶבֶד可指奴仆、臣属或官员；“臣仆”在宫廷语境中既表达隶属于王，又不武断限定其法律身份。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用标准中文地名译法。
