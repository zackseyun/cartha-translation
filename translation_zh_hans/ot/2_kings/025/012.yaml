id: 2KI.25.12
reference: 2 Kings 25:12
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ הִשְׁאִ֖יר רַב טַבָּחִ֑ים לְ/כֹֽרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/012.yaml
  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: zh_hans
  text: 但护卫长[a]从当地最贫穷的人中留下一些，让他们作葡萄园工人和耕田的人[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护卫长”原文直译为“屠宰者之长”；在这里是巴比伦王室或军队的职衔。
    reason: lexical_alternative
  - marker: b
    text: “耕田的人”也可译作“农夫”或“田间工人”。原文这个罕见词大概泛指耕作土地的农业劳动者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלַּת הָאָרֶץ
  choice: 但……从当地最贫穷的人中
  rationale: וּ承接上文并形成转折，译作“但”；מִן表示从这一群体中选取一部分；דַּלַּת在本段驱逐与留置的对比中指社会底层最贫穷的人；הָאָרֶץ在此指犹大当地，而非全地。
- source_word: הִשְׁאִיר
  choice: 留下一些
  rationale: 使役词形表达“使其留下、留下”；原文未明说宾语数量，汉语补出“一些”，清楚表达部分留置之意。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是尼布撒拉旦在巴比伦王室与军队中的职衔；按上下文译为“护卫长”，比照字面译作“屠宰者之长”更准确自然。
- source_word: לְכֹרְמִים
  choice: 作葡萄园工人
  rationale: כֹּרֵם指栽培、照料葡萄园的人；“葡萄园工人”准确且为现代读者易懂。
- source_word: וּלְיֹגְבִים
  choice: 和耕田的人
  rationale: יֹגְבִים是罕见的农业用语，所指大概是耕作土地的人；译文保留其宽泛农业含义，不把具体工作限定得过窄。
theological_decisions: []
