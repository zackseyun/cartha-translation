revisions:
- from: 犹大王约雅斤被掳后第三十七年，十二月二十七日，巴比伦王以未米罗达[b]在他登基的那一年[c]抬举了犹大王约雅斤[a]，将他从监狱中释放出来。
  to: 犹大王约雅斤被掳第三十七年，十二月二十七日，巴比伦王以未米罗达[b]在他作王的那一年[c]抬举[a]犹大王约雅斤，使他离开监牢。
  rationale: 修订将习语脚注移至“抬举”处，避免错误锚定；将“登基”改为“作王”，不在正文中预断该年必为即位年；并以“使他离开监牢”传达经文结果，同时由脚注说明该习语所包含的施恩和获释含义。
