  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: zh_hans
  text: 犹大王约雅斤被掳第三十七年，十二月二十七日，巴比伦王以未米罗达[b]在他作王的那一年[c]抬举[a]犹大王约雅斤，使他离开监牢。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “抬举”所译的希伯来语习语，字面意思是“抬起……的头”；在这里表示提升约雅斤的地位、向他施恩，并包括使他离开监牢。
    reason: lexical_alternative
  - marker: b
    text: “以未米罗达”在历史资料中也称“阿梅尔-马尔杜克”。
    reason: cultural_note
  - marker: c
    text: “在他作王的那一年”也可能理解为“在他作王第一年”；原文没有明说“第一”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: （以时间状语直接起句）
  rationale: 这是叙事性 wayyiqtol，用来引入新一幕。现代汉语以“……第三十七年”直接起句，比机械译作“事情发生在”更自然，同时保留叙事推进功能。
- source_word: לְגָלוּת
  choice: 被掳后
  rationale: גָּלוּת 指被迁离本土而处于流亡、被掳的状态；“被掳后”符合本节纪年公式，也沿用中文圣经读者熟悉而清楚的表达。
- source_word: יְהוֹיָכִין
  choice: 约雅斤
  rationale: 采用该犹大王名字通行的中文圣经译名。
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: 十二月
  rationale: 按希伯来日期公式译为自然的现代汉语。这里指一年中的第十二个月，并非公历十二月。
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: 二十七日
  rationale: 与前面的“十二月”合并为中文惯用日期表达，完整保留日期信息。
- source_word: אֱוִיל מְרֹדַךְ
  choice: 以未米罗达
  rationale: 采用中文圣经传统中较为通行的音译；其历史上所知的阿卡德语名字另见脚注。
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: 在他登基的那一年
  rationale: 字面为“在他作王的年间／那一年”。上下文很可能指登基年或第一年，但希伯来文本没有明说“第一”，因此正文不将其明确化。
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: 抬举了
  rationale: 该希伯来习语字面是“抬起……的头”，在此表示使约雅斤恢复尊荣、蒙受恩待；“抬举”既自然，又保留了地位被提升的意象。
- source_word: מִבֵּית כֶּלֶא
  choice: 将他从监狱中释放出来
  rationale: בֵּית כֶּלֶא 是拘禁之处。结合“抬起头”的语境，此介词短语表明约雅斤获释出监；如此翻译在现代汉语中清楚自然。
