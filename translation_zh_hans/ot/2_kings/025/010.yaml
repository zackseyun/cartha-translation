  text: And all the army of the Chaldeans who were with the captain of the guard tore down the walls of Jerusalem all around[a].
translation:
  language: zh_hans
  text: 随护卫长而来的迦勒底人的全军，拆毁了耶路撒冷四周的城墙。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “护卫长”所译的希伯来语职衔，也可译作“行刑官长”或“近卫军长”。
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹת
  choice: 城墙
  rationale: 该词是复数，指耶路撒冷环城的墙垣或防御工事；“城墙”在现代汉语中自然且符合军事语境。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用这一地名的现代汉语标准译名。
- source_word: סָבִיב
  choice: 四周
  rationale: 表达城墙环绕城市的范围，比单说“周围”更简洁自然。
- source_word: נָתְצוּ
  choice: 拆毁
  rationale: נתץ表示拆除、摧毁建筑物；“拆毁”准确传达军队毁坏城墙的行动。
- source_word: כָּל חֵיל
  choice: 全军
  rationale: כָּל修饰集合名词חֵיל，合译为“全军”既简洁，也保留全部军力参与的含义。
- source_word: כַּשְׂדִּים
  choice: 迦勒底
  rationale: 原文使用族名“迦勒底人”而非“巴比伦人”；在“全军”前用定语形式“迦勒底”最自然。
- source_word: אֲשֶׁר רַב טַבָּחִים
  choice: 跟随护卫长的
  rationale: 关系词后的表达在希伯来文中较为省略，语境表明这支军队隶属或随同护卫长；“跟随”自然表达这种关联，同时避免过度界定具体军阶关系。
- source_word: רַב טַבָּחִים
  choice: 护卫长
  rationale: 这是王室高级官员的职衔，在语境中可指统领护卫、并可能负责处决事务的人；正文采用通顺且常见的“护卫长”，其他可能含义收入脚注。
