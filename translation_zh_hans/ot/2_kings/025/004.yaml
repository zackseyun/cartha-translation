base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: zh_hans
  text: 城被攻破，所有战士就在夜间从那座靠近王园、位于两道城墙之间的城门逃走；迦勒底人[a]正从四面包围着城。王[b]沿着通往亚拉巴[c]的路离去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “迦勒底人”在这里指巴比伦人。希伯来原文作“迦勒底人”。
    reason: lexical_alternative
  - marker: b
    text: 原文只用单数动词“他去了”，没有明说主语；上下文表明是王。
    reason: textual_clarity
  - marker: c
    text: “亚拉巴”指约旦河谷并向南延伸的裂谷地区，传统上也译作“平原”。
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: 城被攻破了
  rationale: בקע的尼פעל形式在围城语境中表示城防被突破；“城被攻破”既准确又符合现代汉语军事叙事。
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: 所有战士
  rationale: 直译为“所有争战的人”；“所有战士”自然简洁，并保留军事身份。
- source_word: הַלַּיְלָה דֶּרֶךְ שַׁעַר
  choice: 在夜间从……城门逃走
  rationale: 原文以名词性路线短语承接“所有战士”，未明说逃走的动词；根据句法、省略现象及上下文补出“逃走”，使汉语完整，同时不增加行动细节。
- source_word: בֵּין הַחֹמֹתַיִם
  choice: 位于两道城墙之间
  rationale: חֹמֹתַיִם是双数，明确指两道城墙，故不泛化为“城墙之间”。
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: 靠近王园
  rationale: 介词עַל在此表示地理上的邻近；“靠近王园”比字面“在王园之上”更符合地形语境。
- source_word: וְכַשְׂדִּים
  choice: 迦勒底人
  rationale: 保留希伯来原文的族群称谓，而不在正文中直接改作解释性的“巴比伦人”。
- source_word: עַל הָעִיר סָבִיב
  choice: 正从四面围住城
  rationale: 表达סָבִיב所强调的全方位包围；“正”也体现该背景状态与夜间出逃同时发生。
- source_word: וַיֵּלֶךְ
  choice: 王便……去了
  rationale: 希伯来文只用第三人称阳性单数动词，主语未明说；上下文表明所指为王，正文补明以避免现代汉语歧义，并以脚注保留原文形式。
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: 往亚拉巴方向
  rationale: דֶּרֶךְ在此表示行进路线或方向；亚拉巴是地理名称，采用音译并以脚注说明，不笼统译作“平原”。
