  - severity: low
    issue: “那时”属于不必要的显性时间补充。
    rationale: 原文以并列句描述迦勒底人包围全城的背景；不加“那时”可避免额外限定，同时使叙述更简洁贴近。
  - severity: low
    issue: 脚注b将原文概括为“他便去了”。
    rationale: 原文动词的主语确实未明说，但“便”是译文连接语气，不是原文词汇。应改为说明原文仅用“他去了”这一类未明示主语的单数动词。
