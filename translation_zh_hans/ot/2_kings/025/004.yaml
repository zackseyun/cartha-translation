  to: 城被攻破，所有战士就在夜间从那座靠近王园、位于两道城墙之间的城门逃走；迦勒底人[a]正从四面包围着城。王[b]沿着通往亚拉巴[c]的路离去。
  rationale: 修订保留原译的主要词汇选择和脚注架构，同时更明确地表达“取道亚拉巴”的路线意味，删去非必要的时间补充，并使城门的关系定语和主语省略脚注更精确。
