  text: וַ/יָּקֻ֨מוּ כָל הָ/עָ֜ם מִ/קָּטֹ֤ן וְ/עַד גָּדוֹל֙ וְ/שָׂרֵ֣י הַ/חֲיָלִ֔ים וַ/יָּבֹ֖אוּ מִצְרָ֑יִם כִּ֥י יָרְא֖וּ מִ/פְּנֵ֥י כַשְׂדִּֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: zh_hans
  text: 于是，所有百姓，无论大小，连同军队的将领[a]，都起身前往埃及，因为他们害怕迦勒底人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“军官”或“部队的统领”。
    reason: 原文שָׂרֵי הַחֲיָלִים可用不同的现代军事称谓表达；脚注保留这些词汇选择。
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: 起身
  rationale: 该词为קום的Qal连续式，表示采取行动；“起身”既保留叙事动作，也不把含义局限为单纯站立。
- source_word: כָל הָעָם
  choice: 所有百姓
  rationale: 保留希伯来语集合性表达的完整范围，符合现代汉语叙事习惯。
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: 无论大小
  rationale: 这是涵盖全体的惯用表达，可涉及地位、重要性等差别；“无论大小”避免把它明确限定为年龄。
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: 连同军队的将领
  rationale: שָׂרֵי指首领或长官，חֲיָלִים在本段语境中指军事力量；“军队的将领”清楚自然。“连同”显明他们与所有百姓一同行动。
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: 前往埃及
  rationale: בוא本可表示“来”或“去”，此处从叙述者视角译作“前往埃及”更符合现代汉语的指向习惯。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出他们前往埃及的原因，译作“因为”直接清楚。
- source_word: יָרְאוּ
  choice: 害怕
  rationale: 该动词在此表达恐惧；“害怕”是自然、准确的现代汉语。
- source_word: מִפְּנֵי כַשְׂדִּים
  choice: 迦勒底人
  rationale: 与“害怕”连用时，מִפְּנֵי所表达的是恐惧的对象；“迦勒底人”沿用《列王纪》历史语境中的标准族名。
theological_decisions: []
