base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: zh_hans
  text: 他们擒住王，把他押到利比拉的巴比伦王那里，并向他宣判[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“与他讲判决”，这是指向人宣布司法判决的表达。
    reason: 说明希伯来语司法惯用语，并保留其较直译形式。
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: 擒住
  rationale: תפשׂ在此指捉住逃亡中的君王；“擒住”既表达成功抓获，也符合叙事语体。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用带定冠词的称谓，指上文已知的西底家，却没有在本节重提姓名；译作“王”保留原文的篇章形式。
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: 把他押到
  rationale: עלה使役式可表示带上去或带到某处。此处王是俘虏，因此“押到”自然表达受拘押转送的情境；不机械译出“上”，以免在现代汉语中造成不必要的地势含义。
- source_word: אֶל מֶלֶךְ בָּבֶל רִבְלָתָה
  choice: 到利比拉的巴比伦王那里
  rationale: אֶל表示朝向某人，地名的方向词尾表明目的地是利比拉。“利比拉的巴比伦王那里”在现代汉语中自然说明巴比伦王当时位于利比拉，又不把地名误解为修饰王的所属关系。
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: 向他宣判
  rationale: 字面结构近于“与他讲判决”，在本语境中是司法惯用语，指对他宣布判决。“向他宣判”保留审判含义，同时简洁自然。
theological_decisions:
- issue: 末句复数动词的主语
  choice: 保留“他们”所指的篇章连续性，不明确增补为巴比伦王或巴比伦官员
  alternative: 译作“巴比伦王向他宣判”或“他们在他身上执行审判”
  rationale: 希伯来文动词为复数，且未另行明说主语；明确改成巴比伦王会消除原文的语法信息，译成“执行审判”则可能误指刑罚实施而非判决宣告。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“押到”体现俘虏被解送的情境；“宣判”准确传达法律语境。脚注置于所解释的“宣判”之后。
