base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: zh_hans
  text: 迦勒底人的军队[a]追赶王，在耶利哥的平原[b]追上了他；他的全军都从他身边四散而去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“巴比伦人的军队。”希伯来文作“迦勒底人”，本段以此称呼巴比伦的军队。
    reason: lexical_alternative
  - marker: b
    text: 或译：“耶利哥的旷野。”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: 迦勒底人的军队
  rationale: חֵיל在军事叙事中指军队或兵力；כַּשְׂדִּים直译为“迦勒底人”，既贴近希伯来文，也与本段对巴比伦军队的称呼一致。
- source_word: וַיִּרְדְּפוּ אַחַר הַמֶּלֶךְ
  choice: 追赶王
  rationale: רדף与אַחַר合用表示追赶、追击；现代汉语用“追赶王”自然表达，不必逐字译出אַחַר。
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: 追上了他
  rationale: נשׂג在追击语境中指赶上、追上；“追上了他”清楚自然，并保留尚未明说抓获的叙事层次。
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: 在耶利哥的平原
  rationale: עֲרָבוֹת可指平原、旷野或干旱草原；正文采用普通读者易懂的“平原”，并以脚注保留“旷野”的可能译法。
- source_word: וְכָל חֵילוֹ
  choice: 王的全军
  rationale: חֵיל在此仍指军队；将代词明确为“王的”，符合汉语指代习惯，且没有增加原文之外的身份信息。
- source_word: נָפֹצוּ מֵעָלָיו
  choice: 都离开他四散了
  rationale: נפץ表示分散、四散；מֵעָלָיו表示从他身边离散。“离开他四散了”同时传达军队溃散及与王分离的含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“迦勒底人”保留原文的族群／政治称谓；“追上”避免把后文才明确发生的抓获提前写入本节。脚注标记均置于相应词语之后。
