  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הַעֲל֤וֹת יְהוָה֙ אֶת אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָ֑יִם וַ/יֵּ֧לֶךְ אֵלִיָּ֛הוּ וֶ/אֱלִישָׁ֖ע מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: zh_hans
  text: 雅威将要在旋风中[a]把以利亚接到天上[b]去的时候，以利亚和以利沙从吉甲出发了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “在旋风中”也可译作“在暴风中”或“借着旋风”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“诸天”；这里按现代汉语习惯译作“天上”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ……的时候，……
  rationale: 这是叙事性的连接结构，与后面的时间从句合成自然的现代汉语句式；不另加原文没有明确表达的“现在”。
- source_word: בְּהַעֲלוֹת
  choice: 将要……接……去的时候
  rationale: 介词 בְּ 加不定词构造表示时间背景；本章随后才叙述这件事发生，因此用“将要”自然体现其前瞻意味。“接……去”同时保留 עלה 的向上运动。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名的常用汉语音译处理，保留其作为上帝专名的性质，不以称号替代。
- source_word: אֶת אֵלִיָּהוּ
  choice: 以利亚
  rationale: 直接宾语标记后接人名，采用现代中文圣经中通行的译名。
- source_word: בַּסְעָרָה
  choice: 在旋风中
  rationale: סְעָרָה 可指暴风、风暴或旋风；结合本章语境译作“旋风”，而介词 בְּ 保持为“在……中”，避免无须确定其纯粹为工具用法。
- source_word: הַשָּׁמָיִם
  choice: 天上
  rationale: 该词形式上为复数，但在此表示向上的目的地；“到天上去”是自然汉语，同时不对其宇宙观或确切空间性质作额外判定。
- source_word: וַיֵּלֶךְ
  choice: 出发了
  rationale: הלך 在这里叙述二人从吉甲开始行程；“从吉甲出发了”比直译“走了”更符合现代汉语。
- source_word: וֶאֱלִישָׁע
  choice: 和以利沙
  rationale: 连词加人名，采用现代中文圣经中通行的译名。
- source_word: מִן הַגִּלְגָּל
  choice: 从吉甲
  rationale: מִן 表示起点或来源，地名采用通行译名“吉甲”。
theological_decisions:
- issue: 如何翻译神名 יהוה
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；正文以“雅威”音译，保留专名而不改成“主”等称号。
- issue: הַשָּׁמָיִם 应译作“天上”还是“诸天”
  choice: 天上
  alternative: 诸天
  rationale: 希伯来文形式虽为复数，但本处重点是以利亚被接上去的方向和目的地；“天上”符合现代汉语，并不借此断定具体宇宙结构。
- issue: בַּסְעָרָה 中介词 בְּ 的含义
  choice: 在旋风中
  alternative: 借着旋风
  rationale: 该介词既可表达所处情境，也可能带有方式或工具意味；正文选择较少解释性的“在……中”，脚注保留其他可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。时间从句置于主句之前，符合汉语叙事习惯；避免古雅的“事情成就了”等表达。人名、地名采用中文圣经通行译法，神名则按原文作为专名音译为“雅威”。
