  yaml_path: translation/ot/2_kings/002/013.yaml
  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: zh_hans
  text: 他拾起从以利亚身上掉下来的外衣[a]，然后回去，站在约旦河岸边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“外袍”。希伯来语所指的是一件显眼而有特色的外层衣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: 拾起
  rationale: רום的基本含义是“举起、抬起”；在本节衣服已经落下的语境中，“拾起”自然、准确地表达从地上拿起的动作。
- source_word: אַדֶּרֶת
  choice: 外衣
  rationale: 该词指一种显著的外层衣服；“外衣”是现代普通话中清楚、自然的表达，并避免“斗篷”可能带来的特定式样联想。脚注保留传统译法“外袍”。
- source_word: אֵלִיָּהוּ
  choice: 以利亚
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: 从以利亚身上掉下来的
  rationale: 按中文习惯将关系从句前置修饰“外衣”；“从……身上”直接表达מֵעָלָיו，也明确代词所指，避免误读为从以利沙身上掉下。
- source_word: וַיָּשָׁב
  choice: 然后回去
  rationale: שׁוב表示返回或回转；“回去”符合叙事动作的自然顺序，“然后”体现连续叙事关系。
- source_word: וַיַּעֲמֹד
  choice: 站在
  rationale: 直接表达עמד的站立动作，不额外加入姿态或目的。
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: 在约旦河岸边
  rationale: שׂפה在河流语境中指边缘或河岸；“约旦河岸边”是自然、明确的现代汉语表达。
