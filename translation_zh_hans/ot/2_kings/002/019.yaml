  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל אֱלִישָׁ֔ע הִנֵּה נָ֞א מוֹשַׁ֤ב הָ/עִיר֙ ט֔וֹב כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י רֹאֶ֑ה וְ/הַ/מַּ֥יִם רָעִ֖ים וְ/הָ/אָ֥רֶץ מְשַׁכָּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: zh_hans
  text: 城里的人对以利沙说：“请看，这城的地势很好，正如我主所见；可是水质不好，土地也使人失去后代[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土地不结果实”。“使人失去后代”所译的希伯来语可指造成流产或丧失后代；在这里也可能泛指牲畜或土地的生育、出产受损。
    reason: 说明מְשַׁכָּלֶת的具体“造成丧失后代”含义，以及在水源和土地语境中可能涉及的较广不育／不结果实含义，同时不在正文中限定对象。
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי הָעִיר
  choice: 城里的人对……说
  rationale: וַיֹּאמְרוּ承接并推进叙事；אַנְשֵׁי הָעִיר可直译为“城里的人”，现代汉语无需另加“于是”，上下文已能表达顺序。
- source_word: הִנֵּה נָא
  choice: 请看
  rationale: הִנֵּה用于引起注意，נָא使语气较为委婉；“请看”简洁地保留二者的功能。
- source_word: מוֹשַׁב הָעִיר
  choice: 这城的地势
  rationale: מוֹשַׁב在此指城市所处的位置或环境；结合说话者让以利沙亲眼察看，“地势”比抽象的“状况”更贴合场景，也比“所在地”自然。
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: 正如我主所见
  rationale: 保留רֹאֶה的“看见”意象；אֲדֹנִי是对以利沙的尊称，并非神圣称号。
- source_word: וְהַמַּיִם רָעִים
  choice: 可是水质不好
  rationale: וְ在语境中表达转折；מַיִם虽为形态复数，此处指当地水源。“水质不好”是自然且明确的现代汉语。
- source_word: וְהָאָרֶץ מְשַׁכָּלֶת
  choice: 土地也使生灵流产
  rationale: מְשַׁכָּלֶת是שׁכל的使役性分词，核心意义是使后代丧失、流产；补入“生灵”使汉语句法完整，同时不把对象限定为人，也保留该词可能涉及牲畜及土地不育的语境张力。
theological_decisions:
- issue: אֲדֹנִי用于称呼以利沙
  choice: 我主
  alternative: 主人；先生
  rationale: 这是社会性的敬称，不是对以利沙神化。“我主”保留原文古代敬语的庄重感，并与指称上帝的专名或神圣称号有别。
- issue: מְשַׁכָּלֶת所表达的损失范围
  choice: 使生灵流产
  alternative: 不出产；使人丧子；贫瘠
  rationale: 原词具体涉及失去后代，但在水源和土地的语境中也可能延伸到牲畜、农作物或整体不育。正文保留具体而宽泛的生殖损失意象，脚注说明其语义范围，不将其缩减为单纯农业歉收。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我主”保留古代尊称色彩；“水质不好”符合现代汉语表达。“使生灵流产”刻意保留希伯来语的具体意象及对象上的歧义，并以脚注交代较宽的农业含义。
