  text: וַ/יֵּצֵא֙ אֶל מוֹצָ֣א הַ/מַּ֔יִם וַ/יַּשְׁלֶךְ שָׁ֖ם מֶ֑לַח וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה רִפִּ֨אתִי֙ לַ/מַּ֣יִם הָ/אֵ֔לֶּה לֹֽא יִהְיֶ֥ה מִ/שָּׁ֛ם ע֖וֹד מָ֥וֶת וּ/מְשַׁכָּֽלֶת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: zh_hans
  text: 他走到水源[a]那里，把盐撒在那里，说：“耶和华如此说：‘我已经医治了这水；从此，死亡和流产不再从那里而来[b]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水源”也可译作“泉源”，即水流出的地方。
    reason: lexical_alternative
  - marker: b
    text: “流产”所译的希伯来语也可指“使人失去后代”，或指（土地、牲畜等）“不结果”。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: 水源
  rationale: מוֹצָא指水流出的地方；结合城中供水的语境，“水源”自然、准确，又不把所指过度限定为某一类泉眼。
- source_word: מֶלַח
  choice: 盐
  rationale: 直接对应原词，原文没有要求增译其象征意义或功用。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知宣告常用的使者公式，并以“耶和华”呈现四字神名。
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: 我已经医好了这水
  rationale: רפא基本义为“医治”；这里把水拟人化。直译“医好”保留原文鲜明意象，现代汉语也可理解为使水恢复良好。
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: 从此……必不再由此而来
  rationale: מִשָּׁם可指“从那里”，在上下文中指有害后果不再从这水源或水中产生；“由此而来”保留来源含义，“从此”表达עוֹד所涉及的今后不再发生。
- source_word: מָוֶת
  choice: 死亡
  rationale: 采用直接对应词，不擅自缩窄为某一种由坏水导致的死亡。
- source_word: מְשַׁכָּלֶת
  choice: 流产
  rationale: 该词来自שׁכל，在此涉及失去后代或不结果；“流产”呈现最具体、常见的语境理解，同时以脚注保留“不结果”等可能含义。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用读者最熟悉且明确作为专名的“耶和华”，不以“主”这一称号替代；“雅威”是另一种较接近学术重构读音的音译。
- issue: 盐与水得医治之间的关系
  choice: 不解释盐本身具有医治能力
  alternative: 把盐明说为神迹媒介或象征
  rationale: 原文叙述以利沙撒盐，随后宣告耶和华已经医好水，却没有说明盐如何发挥作用；译文保留这一叙事张力，不加入因果或象征解释。
- issue: מְשַׁכָּלֶת所指的灾害
  choice: 正文译“流产”，脚注保留“不结果”的可能
  alternative: 只译“荒芜”或“不生育”
  rationale: 该词既可涉及丧失胎儿，也可延伸至土地或生物不结果。上下文同时提到城邑宜居而水恶劣、土地不产，故不应完全排除较宽含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“耶和华如此说”保留先知宣告的正式语体；“医好了这水”有意保留希伯来文的拟人表达。脚注标记均置于相关正文之后。
