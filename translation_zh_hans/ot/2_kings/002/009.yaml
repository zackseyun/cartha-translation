  source_fidelity: 译文整体准确反映了叙事顺序、以利亚被动地“被接走”、以及以利沙所求的是“你之灵的双份”。不过，“求你让你灵的双份归给我”在汉语中搭配生硬，且“归给”较易使“灵”本身而非其“双份”成为归属转移的对象。改为“请让我得着你之灵的双份”更清楚地保留原文的请求／愿望语气与所属关系。
  naturalness: “他们过了河以后”及前半段对话自然、庄重。“你灵的双份归给我”不符合现代汉语的通常表达；“你之灵的双份”在经文语体中自然且易懂。
  terminology: 人名“以利亚”“以利沙”规范。“灵”不应擅自改为“圣灵”或“先知能力”。“双份”恰当地保留了 פִּי שְׁנַיִם 的份额／继承意象，而不把含义定为两倍能力。
