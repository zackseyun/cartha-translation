base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: zh_hans
  text: 他们过了河以后，以利亚对以利沙说：“在我从你身边被接走以前，你要我为你做什么，只管求吧。”以利沙说：“请让我得着你之灵的双份[a][b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “双份”也可译作“两个份额”。这个希伯来语说法可能呼应长子所得的双份产业。
    reason: lexical_alternative
  - marker: b
    text: “你之灵”指与以利亚及其先知职分相关的灵；也有人把这句话理解为以利沙请求得到以利亚两倍的先知能力。
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: 他们过了河以后
  rationale: 该形式指以利亚和以利沙二人已经过去；结合上文所指的约旦河，用“过了河以后”自然交代先后次序。
- source_word: שְׁאַל
  choice: 就求吧
  rationale: 保留直接命令的语气，同时以现代汉语自然表达以利亚允许以利沙提出请求。
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: 你要我为你做什么
  rationale: 准确传达以利亚询问自己可以为以利沙做什么，不把请求是否必然实现说得过满。
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: 在我从你身边被接走以前
  rationale: “被接走”保留尼פעל式的被动含义，不明说施事者；“从你身边”体现二人即将分离的关系含义。
- source_word: וִיהִי נָא
  choice: 求你让……归给我
  rationale: “求你”表达 נָא 所带的恳求、缓和语气；“让……归给我”自然承接未完成式的愿望用法。
- source_word: פִּי שְׁנַיִם
  choice: 双份
  rationale: 该习语表示两份或加倍的一份，并可能呼应长子所得的产业份额；“双份”简洁保留这种含义，而不直接解释为能力加倍。
- source_word: בְּרוּחֲךָ
  choice: 你灵的
  rationale: 保留第二人称所属关系，不擅自加上“先知的”或将其明确技术化为对圣灵位格的称呼。
- source_word: אֵלָי
  choice: 归给我
  rationale: 原文直译为“到我这里”；与“份”搭配时，“归给我”是自然汉语，也保留领受这一份的含义。
theological_decisions:
- issue: 以利沙请求“你灵的双份”是什么意思
  choice: 译为请求得到以利亚之灵的“双份”，保留可能的长子产业继承意象。
  alternative: 理解为以利沙请求获得以利亚两倍的先知能力。
  rationale: פִּי שְׁנַיִם 通常表示双份，最自然地令人想到产业份额；正文不把它明确解释成能力是以利亚的两倍，以保留原文的张力。
- issue: “你的灵”所指为何
  choice: 保留“你的灵”，指与以利亚本人及其先知职分相关的灵或属灵恩赐。
  alternative: 把它直接明确为三一论技术意义上的“圣灵”，或明译为“先知的灵”。
  rationale: 希伯来文使用第二人称所属后缀，正文没有进一步界定；直译可避免加入经文本身未明说的教义判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“被接走”保留原文被动表达；“双份”兼顾可懂性与产业继承的潜在意象。两个脚注标记均置于相关请求之后，分别说明“双份”和“你的灵”的解释空间。
