base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: zh_hans
  text: 那时，伯特利的先知门徒出来见以利沙，对他说：“你知道吗？今天雅威要把你的老师从你头上带走[a]。”以利沙回答：“我也知道。你们不要作声。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他不再居于你之上”。希伯来语直译为“从你头上”，这里指把一位居于他人之上的师长或权威人物移走。
    reason: 说明希伯来语权柄隐喻，并提供较解释性的译法。
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: 先知门徒
  rationale: 希伯来语直译为“先知的儿子们”，在此是关系性称谓，指跟随先知受教的群体；译作“先知门徒”既自然，也避免被误解为血缘上的儿子。
- source_word: אֲשֶׁר בֵּית אֵל
  choice: 伯特利的
  rationale: 这个省略系词的关系从句按所在地辨认该先知群体；简洁译作“伯特利的”符合现代汉语叙事。
- source_word: הֲיָדַעְתָּ
  choice: 你知道吗
  rationale: 以现代汉语的一般现在时问句表达希伯来语完成式在此所指的现有认知。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名作音译，以保留经文中的上帝专名，而不以称号替代。
- source_word: לֹקֵחַ
  choice: 要……接走
  rationale: 分词在“今天”的语境中表示即将发生的行动；“要……接走”自然表达临近性，也保留 לקח 的“取走、接走”含义。
- source_word: אֲדֹנֶיךָ
  choice: 你的老师
  rationale: 此处指以利亚作为以利沙的师长和上位者，并非指上帝；“老师”能在现代汉语中清楚表达这层师承关系。
- source_word: מֵעַל רֹאשֶׁךָ
  choice: 从你头上
  rationale: 保留原文空间隐喻；该说法在此暗示以利亚将不再作为居于以利沙之上的师长，具体含义由脚注说明。
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: 我也知道
  rationale: 明确保留 גַּם אֲנִי 的“我也”之意，回应对方同样拥有的认知。
- source_word: הֶחֱשׁוּ
  choice: 你们不要作声
  rationale: 原文是对多人发出的复数命令；补出“你们”以呈现数的区别，“不要作声”保留其庄重而直接的语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。采用较贴近现代学界复原读音的中文音译“雅威”，既保留专名性质，也避免用“主”这一称号取代原文神名。
- issue: “从你头上接走”的权柄隐喻
  choice: 正文保留原文隐喻，并以脚注说明
  alternative: 译作“使他不再作你的老师”或“从你身边接走”
  rationale: 原文既描写接走，也以“在头上”表达师长居于其上的关系。直改为解释性译文会消除原有意象，而“从你身边”则会遗漏权柄层面。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“先知门徒”比直译“先知的儿子们”更易懂；对话保持简洁。“你们不要作声”显明原文复数命令。脚注标记紧接所解释的“从你头上接走”。
