base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: zh_hans
  text: 他们正一路走着说话的时候，看哪，有火焰的战车和火焰的马匹，把二人分开了[b]；以利亚便借着旋风[a]升上天去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在旋风中”。这里的希伯来语介词可以表示方式、伴随或所在之处。
    reason: lexical_alternative
  - marker: b
    text: 原文说火焰的战车和马匹把以利亚与以利沙分开，又说以利亚借着（或在）旋风升上天去；原文没有明确说以利亚坐在战车上。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר
  choice: 他们正一路走着说话的时候
  rationale: 用“正……的时候”表达叙事推进及两个持续、同时发生的动作；“一路走着”自然传达 הֹלְכִים הָלוֹךְ 的延续意味。
- source_word: וְהִנֵּה
  choice: 看哪，忽然
  rationale: “看哪”保留原文唤起注意的文学功能，“忽然”则自然传达场景突现的即时感，而不取代“看哪”。
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: 火焰的战车和火焰的马匹
  rationale: 保留两个“火”的平行结构与鲜明意象；采用“战车”避免现代汉语“火车”被误解为铁路列车。
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: 把二人分开了
  rationale: 明确保留 שְׁנֵיהֶם 所指的两个人；复数动作主体按上下文理解为战车与马匹这一组合。
- source_word: וַיַּעַל אֵלִיָּהוּ
  choice: 以利亚便……升上……去
  rationale: “升上……去”直接表达 עלה 的向上运动，“便”顺畅承接叙事结果。
- source_word: בַּסְעָרָה
  choice: 借着旋风
  rationale: “借着”表达介词 ב 可能具有的方式或工具含义；脚注保留“在旋风中”这一位置或伴随性的理解。
- source_word: הַשָּׁמָיִם
  choice: 天
  rationale: 在本叙事语境中，“升上天去”是自然、庄重而不过度解释的现代汉语表达；不额外判定其仅指可见天空或特定神学意义上的天界。
theological_decisions:
- issue: 火焰的战车是否直接载着以利亚升天
  choice: 正文只说战车和马匹把二人分开，以利亚借着旋风升上天去。
  alternative: 以利亚乘坐火焰的战车升天。
  rationale: 希伯来文把战车和马匹的分隔作用与以利亚在旋风中的上升分别陈述，并未明说以利亚坐在战车上；译文不补入这一常见但非明文的信息。
- issue: בַּסְעָרָה 所表达的是方式、伴随还是位置
  choice: 借着旋风
  alternative: 在旋风中／随着旋风
  rationale: 介词 ב 在此可有方式、伴随或位置等理解。正文采用符合动作语境的方式义，同时以脚注明示其真实歧义。
translation_notes:
  register: 采用现代、庄重且易懂的叙事语体。“看哪”保留经文突显异象的文学力度；“火焰的战车”既贴近原文构词，也避免“火车”的现代歧义。脚注标记放在各自实际说明的词句之后。
