base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/022.yaml
  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: zh_hans
  text: 水就得了医治，直到今日，正如以利沙所说的那样。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得了医治”也可译作“恢复了”或“变得良好”。希伯来语所用的动词通常表示“医治”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: 治好了
  rationale: 源自动词 רפא，通常表示“医治”。这里以拟人化方式描述原本有害的水恢复良好；保留“治好”的意象，同时符合现代汉语表达。
- source_word: הַמַּיִם
  choice: 水
  rationale: 希伯来语 מַיִם 形态上为复数，但现代汉语通常用不可数名词“水”，无需机械体现复数。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 表达这一状态持续到叙述者所处的时代；“直到今日”庄重、自然，也贴近原文结构。
- source_word: כִּדְבַר
  choice: 正如……所说的话
  rationale: דָּבָר 在此指上一节以利沙宣告的话。“正如……所说的话”保留“话”这一具体概念及预言之言与应验之间的联系。
- source_word: אֱלִישָׁע
  choice: 以利沙
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: אֲשֶׁר דִּבֵּר
  choice: 所说的
  rationale: 关系从句指明那一句具体宣告；中文以“以利沙所说的话”自然整合，避免生硬重复。
theological_decisions:
- issue: 用医治语言描述水的变化
  choice: 正文保留医治隐喻，译为“水就治好了”
  alternative: 水就恢复了；水就变得洁净可用了
  rationale: 原文采用通常表示“医治”的 רפא。保留这一隐喻，可呈现先知所说之话带来恢复的叙事表达，而不额外解释神迹的性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“水就治好了”有意保留希伯来语的医治隐喻；“直到今日”维持经文的历史叙述视角。
