source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הִקְשִׁ֣יתָ לִ/שְׁא֑וֹל אִם תִּרְאֶ֨ה אֹתִ֜/י לֻקָּ֤ח מֵֽ/אִתָּ/ךְ֙ יְהִֽי לְ/ךָ֣ כֵ֔ן וְ/אִם אַ֖יִן לֹ֥א יִהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: zh_hans
  text: 他说：“你所求的是一件难事。你若看见我从你身边被接走[a]，你所求的就会为你成就；否则，就不会成就。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你若在我被接走时看见我。”
    reason: 原文结构可理解为看见“我被接走”这一过程，也可表达在被接走之时仍看见我；正文与此译法都符合被动分词的句法可能性。
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: 你所求的是一件难事
  rationale: 希伯来语使役式动词与不定式连用，在此表示所提出的请求难以应允，而不是说“询问”这个动作本身困难。此译自然保留了请求艰难、重大的含义。
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: 你若看见我从你身边被接走
  rationale: לֻקָּח是לקח的被动形式，表示“被带走、被接走”。“看见我……被接走”保留条件性和被动语态，不擅自指明施事者。
- source_word: יְהִי לְךָ כֵן
  choice: 你所求的就会为你实现
  rationale: 原文直译近于“愿/会如此为你”，在上下文中指以利沙所求之事得到成就。补出“你所求的”使现代汉语所指清楚，又不增添具体内容。
- source_word: וְאִם אַיִן
  choice: 不然
  rationale: אַיִן在此为省略表达，意为“若不是这样”，即若以利沙没有看见以利亚被接走。“不然”简洁体现与前项条件的对照。
- source_word: לֹא יִהְיֶה
  choice: 就不会实现
  rationale: 原文为“就不会成就/发生”，隐含主语是此前所求之事；汉语补出语义所需的“实现”，与前句形成清楚对应。
theological_decisions:
- issue: 以利沙所求之事能否成就的条件
  choice: 按原文保留为：是否看见以利亚被接走
  alternative: 解释为以利亚本人授予或拒绝所求恩赐
  rationale: 经文本身只陈明所求之事与以利沙是否目睹以利亚被接走之间的条件关系，并未明确说明以利亚是恩赐的施予者，因此不作额外神学推断。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“被接走”承接本章语境，也保留原文被动表达；正文中的脚注标记[a]与脚注对应。
