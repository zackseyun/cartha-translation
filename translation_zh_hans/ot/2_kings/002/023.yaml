base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: zh_hans
  text: 以利沙从那里上伯特利去。他正沿路上行时，有些年幼的男孩[a]从城里出来，嘲笑他，对他说：“上去吧，秃头！上去吧[b]，秃头！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“少年”或“青年人”；这个希伯来语词组可以较宽泛地指年轻男性，不一定是年龄很小的儿童。
    reason: lexical_alternative
  - marker: b
    text: 这里反复说“上去”，可能只是讥嘲，也可能暗指以利亚被接升天。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上……去
  rationale: 该动词表示叙事中的连续动作“上去”。译文保留“上”的方向含义，也与后文反复出现的עלה形成呼应。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用该地名通行的现代中文音译。
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: 他正沿路上行时
  rationale: 代词加分词表示正在进行的动作；“沿路上行”自然地表达בדרך，并保留עלה与嘲语“上去吧”之间的词语重复。
- source_word: נְעָרִים קְטַנִּים
  choice: 年幼的男孩
  rationale: קטנים限定נערים，表明他们是年纪较小的男性；但整词组也可能泛指少年或青年人，因此在脚注保留较宽的理解。
- source_word: יָצְאוּ מִן הָעִיר
  choice: 从城里出来
  rationale: 准确表达“从城中出来”，也符合现代汉语叙事习惯。
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: 嘲笑他
  rationale: 该词的Hitpael词形表示讥讽、嘲弄；“嘲笑”简洁而有分量。
- source_word: עֲלֵה
  choice: 上去吧
  rationale: 保留命令式עלה的基本意义及其重复，同时以语气词“吧”自然传达讥嘲口吻，不在正文中断定其具体暗指。
- source_word: קֵרֵחַ
  choice: 秃头
  rationale: 该词指秃发者，在此直接称呼中带有侮辱性；“秃头”能自然体现嘲骂语气。
theological_decisions:
- issue: 嘲语中重复“上去”的潜在暗示
  choice: 正文直译为“上去吧”，不明确解释其所指
  alternative: 译成“滚开”之类的驱赶语，或明确译成“像以利亚那样升上去”
  rationale: 希伯来文明确使用עלה“上去”，但究竟只是嘲语，还是暗指以利亚被接升天，并不确定。正文保留原文措辞及张力，脚注说明两种可能。
- issue: נְעָרִים קְטַנִּים所暗示的年龄
  choice: 正文译为“年幼的男孩”，脚注保留“少年”或“青年人”的可能
  alternative: 只译作“少年”“青年人”或“年轻男子”
  rationale: 该词组指年纪较小的男性，但נער的年龄范围较宽。正文体现קטנים的限定作用，同时避免借翻译断定他们必是非常幼小的儿童。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。“上伯特利去—沿路上行—上去吧”的重复有意保留原文עלה的词语呼应。脚注标记[a]置于相关年龄词组之后，避免把年龄说明误系于地名。
