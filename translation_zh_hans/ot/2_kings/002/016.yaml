id: 2KI.2.16
reference: 2 Kings 2:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: zh_hans
  text: 他们对他说：“你看，你的仆人中有五十个能干的人。请让他们去寻找你的师父。也许耶和华的灵[a]把他带走，抛到某座山上或某个山谷里了。”他说：“不要派他们去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“耶和华的风把他卷走。”希伯来语中译作“灵”的词也可指“风”。
    reason: 保留 רוּחַ 的词义歧义，不把“灵”与“风”之间的可能解释在正文中完全消除。
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: 你看
  rationale: 这是引出提议的礼貌性提示语；“你看”自然传达其功能，而后文的“请”表达请求语气。
- source_word: יֵשׁ אֶת עֲבָדֶיךָ חֲמִשִּׁים אֲנָשִׁים
  choice: 你的仆人中有五十个……的人
  rationale: 保留希伯来语存在句所表达的意思，即这些人就在以利沙的仆人当中。
- source_word: בְּנֵי חַיִל
  choice: 能干的人
  rationale: 该习语在这里指有能力、适合承担搜寻任务的人，并不必然具有军事含义。
- source_word: יֵלְכוּ נָא
  choice: 请让他们去
  rationale: 祈愿式配合 נָא 表达礼貌请求；听话人以利沙被请求准许这些人出发。
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: 去寻找你的师父
  rationale: בקשׁ 在此指寻找；אדון 表示以利亚相对于以利沙的主导者身份，结合先知门徒关系译作“师父”比现代汉语中的“主人”更自然。
- source_word: פֶּן
  choice: 也许
  rationale: 这里引出众人对以利亚失踪原因的不确定推测，并非表示要避免的结果。
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: 耶和华的灵把他带走
  rationale: 叙事语境倾向于把行动主体理解为耶和华的灵；רוּחַ 也可指“风”，故将该可能性保留在脚注中。
- source_word: וַיַּשְׁלִכֵהוּ
  choice: 抛到
  rationale: 传达“投、抛”的动作力度，并与山上、山谷里的方向性地点自然衔接。
- source_word: בְּאַחַד הֶהָרִים אוֹ בְּאַחַת הַגֵּאָיוֹת
  choice: 某座山上或某个山谷里
  rationale: 准确保留两类可能地点；“山谷”是 גיא 在现代汉语中通俗而适切的表达。
- source_word: לֹא תִשְׁלָחוּ
  choice: 不要派他们去
  rationale: 保留复数命令所针对的众人，并在汉语中补明被派遣的人，使指代清楚。
theological_decisions:
- issue: רוּחַ יְהוָה 的理解
  choice: 耶和华的灵
  alternative: 耶和华的风
  rationale: 上下文谈到以利亚非同寻常地离去，众先知门徒猜测是耶和华亲自施行的行动，因此正文采用“灵”；但 רוּחַ 确有“风”的词义，且“风把人卷走”在本句中也可成立，所以用脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“能干的人”避免把 בְּנֵי חַיִל 过度军事化；“师父”体现以利亚与以利沙的师徒关系；直接引语简洁自然。
