  text: וַ/יִּקַּח֩ אֵלִיָּ֨הוּ אֶת אַדַּרְתּ֤/וֹ וַ/יִּגְלֹם֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֵּחָצ֖וּ הֵ֣נָּה וָ/הֵ֑נָּה וַ/יַּעַבְר֥וּ שְׁנֵי/הֶ֖ם בֶּ/חָרָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: zh_hans
  text: 于是，以利亚拿起自己的外衣[a]，把它卷起来，用它击打水面；水就左右分开[b]，他们二人便在干地上走了过去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“斗篷”。希伯来文指以利亚穿在外面的衣物。
    reason: lexical_alternative
  - marker: b
    text: 直译“这边和那边”，意思是水向两侧分开。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: 自己的外衣
  rationale: אַדֶּרֶת在此指以利亚披在身上的外层衣物；“外衣”是现代汉语中自然、清楚的表达，也符合拿起、卷起并用来击水的动作。
- source_word: וַיִּגְלֹם
  choice: 卷起来
  rationale: 该动词在本句描述把衣物卷拢起来；“卷起来”准确呈现动作，也比“折起来”更符合语境。
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: 击打水面
  rationale: נכה的基本义为“击打”。汉语说“击打水面”自然地表达用卷起的外衣击水，同时不添加动作之外的解释。
- source_word: וַיֵּחָצוּ
  choice: 水就……分开
  rationale: 希伯来文动词为复数，与作为复数概念的“众水”相应；现代汉语用单数集合名词“水”并说“分开”，可自然保留被分向两侧的结果。
- source_word: הֵנָּה וָהֵנָּה
  choice: 左右
  rationale: 字面为“这边和那边”，在此表示水向相对的两侧分开；“左右”简洁明确，并避免“到处”可能造成的误解。
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: 他们二人便……走了过去
  rationale: “他们二人”保留שְׁנֵיהֶם对两个人的明确强调；“走了过去”自然表达穿越到对岸的动作。
- source_word: בֶּחָרָבָה
  choice: 从干地上
  rationale: חָרָבָה在过水叙事中指水分开后显出的干地；“从干地上”清楚表达他们穿越时脚下是干的。
- source_word: וַיִּקַּח
  choice: 于是，以利亚拿起
  rationale: 叙事性连续式推动情节发展；“于是”在现代汉语中自然体现动作的承接与先后。
theological_decisions:
- issue: 水奇迹般分开
  choice: 按叙事直述水在击打之后分开，使二人从干地过去
  alternative: 将“水分开”处理为自然现象，或增添神学解释
  rationale: 希伯来文直接叙述击水、水分开和从干地经过这一连串事件。译文既不淡化其非凡性质，也不加入原文未明说的原因或阐释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“外衣”避免生僻的宗教术语；“左右分开”简洁呈现希伯来语空间表达。句中保留两个脚注标记，并使连续动作清楚流畅。
