language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: zh_hans
  text: 在耶利哥的先知门徒从远处看见他[a]，就说：“以利亚的灵停留在以利沙身上[b]。”他们便来迎接他，在他面前俯伏于地[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从远处”也可译作“从对面”；原文表示他们处在相对、彼此可望见的位置，也可含有隔着一段距离的意思。
    reason: lexical_alternative
  - marker: b
    text: “以利亚的灵”在这里指与以利亚相联的先知之灵或先知性能力，如今被看出停留在以利沙身上；这并不必然表示以利亚个人的魂灵转移给他。
    reason: cross_reference
  - marker: c
    text: “俯伏于地”也可译作“伏地向他下拜”。这个动作表示尊敬和顺服，在这里不一定指把以利沙当作神来敬拜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֻהוּ
  choice: 看见他
  rationale: 按叙事语境直译 ראה 及其第三人称阳性单数宾语后缀，表达普通的视觉感知。
- source_word: בְנֵי הַנְּבִיאִים
  choice: 先知门徒
  rationale: 希伯来习语直译为“先知之子”，这里指跟随先知、属于先知群体的人；“先知门徒”在现代汉语中更自然，也避免被误解为亲生儿子。
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: 在耶利哥的
  rationale: 限定这里所说的是位于耶利哥的先知门徒群体。
- source_word: מִנֶּגֶד
  choice: 从对面远远
  rationale: 兼顾该词所含的相对、面对位置及一定距离感；正文保留空间关系，脚注说明也可译作“从远处”。
- source_word: נָחָה
  choice: 停留
  rationale: 完成式在这里表示已经落下并处于安驻状态；“停留在……身上”保留这一结果状态，又不额外解释其机制。
- source_word: רוּחַ אֵלִיָּהוּ
  choice: 以利亚的灵
  rationale: 直接保留原文属格结构及“灵”的语义张力，不在正文中将其窄化为能力、职分或个人魂灵。
- source_word: עַל אֱלִישָׁע
  choice: 在以利沙身上
  rationale: 自然表达 רוח 与 עַל 搭配所表示的灵临到并停留于某人身上。
- source_word: לִקְרָאתוֹ
  choice: 来迎接他
  rationale: 准确表达前去与来者相会、迎接他的惯用义。
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: 在他面前俯伏于地
  rationale: 既呈现 שחה 的俯伏动作，也保留 אָרְצָה 所强调的朝向地面的姿态；不把动作直接定性为敬拜。
theological_decisions:
- issue: “以利亚的灵”的含义
  choice: 正文保留“以利亚的灵”，脚注说明语境指与以利亚相联的先知之灵或先知性能力如今在以利沙身上。
  alternative: 理解为以利亚个人的魂灵转移给以利沙，或仅是一般性的赞许。
  rationale: 上下文与以利沙求得以利亚之灵的双份有关，并描写先知门徒承认他的继承地位；但原文本身用语简洁，正文不应把“灵”完全改写为“能力”。
- issue: 向以利沙俯伏的性质
  choice: 译作“在他面前俯伏于地”，呈现尊敬与顺服的动作，而不直接称作敬拜。
  alternative: 译作“敬拜他”。
  rationale: שחה 可用于向人或向上帝俯伏，具体性质由语境决定；这里是承认以利沙作为以利亚继承者的权柄，不能仅凭动词断定为神圣敬拜。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“先知门徒”传达 בְנֵי הַנְּבִיאִים 的群体身份，避免“先知之子”在汉语中被自然理解为血缘关系；“从对面远远”保留 מִנֶּגֶד 的空间画面；“停留”较“降在”更贴近 נוח 所表达的安驻状态。所有解释性内容均置于脚注，正文保留原文的简洁和神学张力。
