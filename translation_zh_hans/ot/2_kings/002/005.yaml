  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: zh_hans
  text: 在耶利哥的先知门徒走近以利沙，对他说：“你知道吗？今天雅威要把你的师父从你头上带走。”[a] 他说：“我也知道。不要作声。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “从你头上”也可理解为“不再在你之上”；希伯来原文直译为“从你头上”，可能指那位居于你之上、对你有权威的人将被带走。
    reason: 说明希伯来习语的可能含义，同时保留原文意象与解释空间。
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: 走近
  rationale: 准确表达 נגשׁ 朝某人靠近的动作，现代汉语自然简洁。
- source_word: בְנֵי הַנְּבִיאִים
  choice: 先知门徒
  rationale: 该希伯来习语指与先知群体有关的成员或受教者；直译“先知的儿子们”在现代汉语中容易被误解为亲生子嗣，因此采用功能清楚而不过度具体化的译法。
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: 住在耶利哥的
  rationale: 关系从句说明这群人的所在地；“住在”符合此处叙事语境和自然汉语表达。
- source_word: אֱלִישָׁע
  choice: 以利沙
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: הֲיָדַעְתָּ
  choice: 你知道吗
  rationale: 希伯来语完成式在此询问对方当前是否知情，汉语用现在时问句最自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: לֹקֵחַ
  choice: 要……接走
  rationale: 分词在“今天”的语境中表示即将发生的行动；“接走”既保留 לקחת 的取走含义，也适合本段超自然离去的语境，但不说明具体方式。
- source_word: אֲדֹנֶיךָ
  choice: 你的师父
  rationale: 这里指以利亚与以利沙之间兼具权威和教导性质的关系；“师父”比“主人”更符合现代汉语语境，也避免神学化的“主”。
- source_word: מֵעַל רֹאשֶׁךָ
  choice: 从你头上
  rationale: 保留希伯来原文具体而略显异常的空间意象，不在正文中直接将其解释为权柄或师徒关系的终止。
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: 我也知道
  rationale: 自然保留 גַּם 的附加语气和独立代词 אֲנִי 的强调。
- source_word: הֶחֱשׁוּ
  choice: 不要作声
  rationale: 以复数命令式要求众人保持沉默；该译法简短有力，符合以利沙回应的语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。音译“雅威”保留其专名性质，不以传统音译或称号代替。
- issue: 是否在正文中解释 מֵעַל רֹאשֶׁךָ
  choice: 保留“从你头上”的具体表达
  alternative: 不再作你的师父；从你上面；离开你
  rationale: 该短语可能暗示以利亚将不再居于以利沙之上、对他具有权威，但原文保留了空间意象。正文不把这一潜在含义固定为单一解释，另以脚注说明。
- issue: לקח 在本段中的含义
  choice: 接走
  alternative: 取走；带走
  rationale: 上下文指雅威使以利亚离去，但本节本身尚未明说方式。“接走”表达由雅威主动带离，同时不提前加入“升天”等更具体措辞。
translation_notes:
  register: 采用庄重、清楚的现代标准普通话。叙事句式简洁；对话保持直接。正文保留“从你头上”的陌生意象，并用脚注解释。
