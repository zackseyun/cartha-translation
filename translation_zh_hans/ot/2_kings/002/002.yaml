  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: zh_hans
  text: 以利亚对以利沙说：“请你留在这里，因为雅威差我到伯特利[a]去。”以利沙却说：“我指着永活的雅威和你的性命起誓[b]，我绝不离开你。”于是二人下到伯特利去了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文也可直译为“差我直到伯特利”或“差我远至伯特利”。
    reason: lexical_alternative
  - marker: b
    text: 这是希伯来语的誓言格式，字面为：“雅威永活，你的性命也活着；如果我离开你……”意思是：“我绝不离开你。”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: 请你留在这里
  rationale: ישׁב在此语境中不是单指“坐下”，而是请以利沙不要继续随行；“留在这里”自然表达这一含义，נָא则由“请”体现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文本将四字神名作为专名音译，不以“主”这一称号替代。
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: 差我到伯特利去
  rationale: עַד可表示“直到、远至”；在这里指受差遣所到的目的地。正文采用自然的现代汉语“到……去”，脚注保留“直到/远至”的字面方向色彩。
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: 我指着永活的雅威和你的性命起誓
  rationale: 这是庄严的希伯来誓言格式。汉语用“指着……起誓”传达其功能，并保留雅威“永活”及“你的性命”两个誓言成分。
- source_word: אִם אֶעֶזְבֶךָּ
  choice: 我绝不离开你
  rationale: 誓言后的אִם引出省略了惩罚后果的否定誓言，字面是“如果我离开你……”，实际断言绝不会离开；正文明确表达其语用含义。
- source_word: וַיֵּרְדוּ
  choice: 于是二人下到
  rationale: 保留ירד“下去、下行”的方向含义；补出“二人”使汉语指代清楚，并未增加新参与者。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用该希伯来地名在现代中文圣经传统中的通行音译。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名。译作“雅威”保留其作为以色列上帝专名的性质，避免以称号“主”替代；“耶和华”是另一传统音译。
- issue: 以利沙誓言中省略式条件句的处理
  choice: 正文译明为“我绝不离开你”，脚注保留字面结构
  alternative: 直译为“如果我离开你……”
  rationale: אִם在誓言之后构成省略咒诅后果的否定誓言。只译“如果”会使现代读者误解为未说完的普通条件句；正文表达实际誓言力度，脚注保留原文张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“请你留在这里”清楚表达劝阻随行的语境；誓言用现代读者易懂的“指着……起誓”表达，同时通过脚注保存希伯来原句的省略结构和语义张力。
