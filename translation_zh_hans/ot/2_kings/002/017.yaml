  text: וַ/יִּפְצְרוּ ב֥/וֹ עַד בֹּ֖שׁ וַ/יֹּ֣אמֶר שְׁלָ֑חוּ וַֽ/יִּשְׁלְחוּ֙ חֲמִשִּׁ֣ים אִ֔ישׁ וַ/יְבַקְשׁ֥וּ שְׁלֹשָֽׁה יָמִ֖ים וְ/לֹ֥א מְצָאֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: zh_hans
  text: 他们再三催逼他，直到他觉得难为情[a]，他才说：“派人去吧。”于是，他们派了五十个人去寻找，找了三天，却没有找到他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“直到他感到羞愧”。希伯来文直译为“直到羞愧”，描述他们不断催逼所造成的难堪或窘迫。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: 他们再三催逼他
  rationale: פצר表示持续而强烈地催促、施压；“再三催逼”既体现反复坚持，也符合现代汉语叙事表达。
- source_word: עַד בֹּשׁ
  choice: 直到他觉得难为情
  rationale: בוש的核心语义涉及羞愧、难堪或窘迫；此处强调反复催逼造成的社会压力。“难为情”自然地保留这种语义，同时不把它强化为道德罪疚。
- source_word: שְׁלָחוּ
  choice: 派人去吧
  rationale: 这是שלח的第二人称阳性复数命令式。上下文表明以利沙终于准许他们派出搜寻队；“吧”传达勉强应允的语气，宾语“人”按汉语需要补出。
- source_word: חֲמִשִּׁים אִישׁ
  choice: 五十个人
  rationale: 原文只说“五十人”，本节不重复他们的群体身份，因此不从上下文增添“先知门徒”等说明。
- source_word: וַיְבַקְשׁוּ
  choice: 去寻找，找了
  rationale: בקש在此指寻找。译文先说明派人的目的，再以“找了三天”自然表达持续的搜寻行动。
- source_word: שְׁלֹשָׁה יָמִים
  choice: 三天
  rationale: 这是表示持续时长的时间用法；现代汉语在“找了三天”中无需另加介词。
- source_word: וְלֹא מְצָאֻהוּ
  choice: 却没有找到他
  rationale: מצא意为“找到”；连接词译作“却”，突显搜寻三天而无结果的转折。代词“他”照原文保留，由上下文指向以利亚。
