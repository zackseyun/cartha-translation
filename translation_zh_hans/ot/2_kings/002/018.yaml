  text: וַ/יָּשֻׁ֣בוּ אֵלָ֔י/ו וְ/ה֖וּא יֹשֵׁ֣ב בִּ/ירִיח֑וֹ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם הֲ/לֽוֹא אָמַ֥רְתִּי אֲלֵי/כֶ֖ם אַל תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: zh_hans
  text: 他们回到他那里时[a]，他仍在耶利哥。他对他们说：“我不是告诉过你们‘不要去’吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式对应地译作：“他们回到他那里；当时他正留在耶利哥。”
    reason: 词汇及句法上的另一种译法，保留希伯来文以并列结构推进叙事的形式。
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: 他们回到他那里时
  rationale: וַיָּשֻׁבוּ推进叙事，基本义为“回来”；结合后面的背景分句，以“……时”自然表达两者的时间关系。אֵלָיו直译为“到他那里”，上下文所指是以利沙。
- source_word: וְהוּא יֹשֵׁב
  choice: 他仍在
  rationale: יֹשֵׁב可指坐着、居住或停留；此处重在说明众人外出寻找期间，以利沙一直留在耶利哥。“仍在”简洁自然地传达持续停留之意，同时避免无根据地强调身体姿势。
- source_word: בִּירִיחוֹ
  choice: 在耶利哥
  rationale: 按现代汉语通常译法处理介词及地名。
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: 他对他们说
  rationale: 透明地对应常用言说动词אָמַר及其间接宾语。
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: 我不是告诉过你们……吗
  rationale: הֲלוֹא引出预期肯定回答的反问；“不是……吗”保留责备意味。“告诉过”自然表达此前已经说过的话。
- source_word: אַל תֵּלֵכוּ
  choice: 不要去
  rationale: אַל加未完成式表达禁止；“不要去”直接、清楚地保留命令语气。
