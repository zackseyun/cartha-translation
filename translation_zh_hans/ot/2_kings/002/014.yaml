id: 2KI.2.14
reference: 2 Kings 2:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: zh_hans
  text: 他拿起从以利亚身上掉下来的外衣，击打水，说：“雅威——以利亚的神在哪里呢？”[a] 他又击打水，水就向左右分开，以利沙便过了河。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文在这句话之后还有一个十分简略的短语，直译近似“他也”或“连他也”。它可能强调那位与以利亚同在的神如今仍然在场，也可能与下文“他又击打水”相连；原文的确切句法不明确。
    reason: 保存 אַף הוּא 的文本难点及主要解释，不在正文中强行消除歧义。
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: 外衣
  rationale: 指以利亚那件具有标志性的外层衣服；“外衣”现代、清楚，也保留了具体物象，避免“圣袍”等带入原文没有的宗教含义。
- source_word: נָפְלָה מֵעָלָיו
  choice: 从以利亚身上掉下来的
  rationale: 关系从句回指以利亚升天时落下的衣服；用“掉下来”自然表达已经发生的动作。
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: 击打水
  rationale: 保留 נכה 的有力动作和神迹叙事的庄重语气，不另加原文未明说的“水面”。
- source_word: אַיֵּה
  choice: 在哪里呢
  rationale: 直接保留对所在或临在的询问，不把它解释性改写为求神显能的祷告。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，区别于称号“主”。
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: 以利亚的神
  rationale: 直接保留希伯来语属格关系，表达自然清楚。
- source_word: אַף הוּא
  choice: 正文不扩写，脚注说明
  rationale: 该短语极为简略，句法及所指存在争议；若硬译成“他也”或“连他也”，中文会暗中确定其与前句或后句的关系。正文维持可读性，脚注保存原文的难点和可能读法。
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: 水就向左右分开
  rationale: 用自然汉语表达水朝两个方向分开，保留 הֵנָּה וָהֵנָּה 的成对方向感。
- source_word: וַיַּעֲבֹר
  choice: 过了河
  rationale: 上下文是渡过约旦河；汉语用“过了河”比单说“过去了”更明确自然。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；正文采用音译“雅威”，既保留其专名性质，也不将它化为称号。
- issue: 以利沙问“在哪里”所表达的语气
  choice: 保留直接问句，不解释为怀疑、挑战或单纯祈求
  alternative: 意译为“求雅威显明同在”或“雅威怎么不在这里”
  rationale: 原文只明确提出“在哪里”；其情感和神学语气应由上下文呈现，不在译文中替读者判定。
- issue: אַף הוּא 的处理
  choice: 正文不作确定性扩写，以脚注交代原文短语
  alternative: “他也……”；“连他也在哪里呢？”；“他也击打水”
  rationale: 该短语压缩且有争议，可能加强前面的疑问，也可能与后面的动作相连。脚注保存这种张力，避免把某一种解释写成唯一正文。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。人名用通行译名“以利亚、以利沙”，神名译作“雅威”。“雅威——以利亚的神”用破折号呈现同位关系；脚注标记放在相关疑问句之后。
