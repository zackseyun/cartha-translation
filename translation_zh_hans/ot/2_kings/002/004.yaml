base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: zh_hans
  text: 以利亚对以利沙说：“请你留在这里，因为雅威[a]派我到耶利哥去。”以利沙说：“我凭雅威的生命，也凭你的性命起誓：我绝不离开你！”于是二人到了耶利哥。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文יהוה（YHWH）这一神名的音译。
    reason: 帮助现代汉语读者识别原文中的上帝专名，并与“主”等称号区分。
lexical_decisions:
- source_word: שֵׁב נָא
  choice: 请你留在这里
  rationale: שֵׁב在此不是要求坐下，而是请以利沙不要继续同行；נָא带有请求、缓和语气，以“请”表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名יהוה作现代汉语音译，保留其作为上帝专名的性质，而不以称号替代。
- source_word: שְׁלָחַנִי
  choice: 差我……去
  rationale: 该完成式在语境中表示雅威已经托付以利亚前往耶利哥；汉语“差我……去”简洁表达使命和当前关联。
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: 我指着永活的雅威和你的性命起誓
  rationale: 这是郑重的起誓公式。נֶפֶשׁ在此指人的生命或性命，并非专指与身体相对的“灵魂”；译文显明汉语中需要补出的起誓含义。
- source_word: אִם אֶעֶזְבֶךָּ
  choice: 我绝不离开你
  rationale: אִם在起誓公式中引出省略了惩罚语的条件句，实际表达强烈否定；“绝不离开你”既传达誓言力度，也符合同行语境。
- source_word: וַיָּבֹאוּ
  choice: 于是二人到了
  rationale: 连续叙事形式推进情节；主语虽仅为复数动词，汉语补出“二人”可清楚自然地指以利亚和以利沙。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的四字神名。译作“雅威”保留专名，并采用较接近学界通行重构读音的现代汉语音译；脚注说明其文字形式，避免读者将其误解为普通称号。
- issue: 以利沙誓言中נפש的含义
  choice: 你的性命
  alternative: 你的灵魂；你自己活着
  rationale: 此处属于生命起誓公式，重点是以利亚本人活着这一事实，并不对“灵魂”的构成作神学断言；“性命”保留生命含义和誓言的庄重感。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“请你留在这里”自然表达请求；誓言部分略带正式色彩，以保留原文的郑重力度。标点和引语结构按现代简体中文规范处理。
