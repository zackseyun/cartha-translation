revisions:
- from: 以利亚对以利沙说：“请你留在这里，因为雅威[a]差我到耶利哥去。”以利沙说：“我指着永活的雅威和你的性命起誓：我绝不离开你！”于是二人到了耶利哥。
  to: 以利亚对以利沙说：“请你留在这里，因为雅威[a]派我到耶利哥去。”以利沙说：“我凭雅威的生命，也凭你的性命起誓：我绝不离开你！”于是二人到了耶利哥。
  rationale: 修订仅调整两处措辞：“派我到……”使奉差表达更合现代汉语；将“永活的雅威”改为“雅威的生命”，避免把起誓公式中的“活着”强化为永恒性断言，同时保留与“你的性命”相应的平行结构。其余译文无需改动。
