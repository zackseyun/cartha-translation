source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי הַ/יַּרְדֵּ֔נָ/ה וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּלְכ֖וּ שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: zh_hans
  text: 以利亚又对他说：“请你留在这里，因为雅威差我到约旦河去[a]。”他却说：“我指着永活的雅威和你的性命起誓[b]，我绝不离开你。”于是二人继续前行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文作“约旦”，这里指约旦河。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语的起誓套语直译为：“雅威活着，你的性命也活着，我若离开你……”末句省略了违誓所受的惩罚，意思是“我绝不离开你”。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: 请你留在这里
  rationale: שֵׁב在此不是单指“坐下”，而是要对方停留、不再随行；נָא带有请求语气，因此译为“请你留在这里”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来语四字神名的读音译出其专名，避免以称号代替原文中的名字。
- source_word: שְׁלָחַנִי
  choice: 差我……去
  rationale: 该完成式表示雅威已经交付使命，而使命在当前仍然有效；现代汉语用“差我……去”自然表达这一差遣。
- source_word: הַיַּרְדֵּנָה
  choice: 到约旦河去
  rationale: 词尾的方向性־ָה表示朝向、前往；“约旦”在这里指约旦河，译作“到约旦河去”清楚自然。
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: 我指着永活的雅威和你的性命起誓
  rationale: 这是郑重的希伯来语起誓套语。“性命”表达נֶפֶשׁ在此所指的人的生命，而不将其误解为与身体分离的“灵魂”。
- source_word: אִם אֶעֶזְבֶךָּ
  choice: 我绝不离开你
  rationale: אִם在这种誓言中引出省略了惩罚后果的自咒句，实际表达强烈否定；“绝不”保留其郑重语气。
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: 于是二人继续前行
  rationale: שְׁנֵיהֶם强调两人一同上路；结合连续旅程的语境，“继续前行”比单纯“走了”更自然。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列之神的专名，而非普通称号；音译“雅威”保留这一点。
- issue: 誓言אִם אֶעֶזְבֶךָּ的省略结构
  choice: 我绝不离开你
  alternative: 我若离开你……
  rationale: 原文保留了未说完的自咒形式。正文译出其实际否定含义，脚注同时保留原句的省略结构及其郑重张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“请你留在这里”体现恳请语气；“永活的雅威”和“起誓”保留誓言的肃穆感。第二个说话者按原文仍用“他”，由上下文明确指以利沙，不额外补入姓名。
