  naturalness: “马兵”在现代标准汉语中不如“骑兵”自然、清楚。“正看着，一面呼喊”可以理解，但“正在观看，呼喊着说”更顺畅地表达两个分词的同时进行。“后来”不必加入，改为叙事性的“随后”更自然。
  terminology: 人名“以利沙”“以利亚”正确。“我父啊”适合庄重叙事语体，且不误作生父称谓。将“马兵”改为“骑兵”，是对 פָּרָשָׁיו 的自然现代汉语对应；不在正文判定这句话究竟是称以利亚为以色列的保障，还是指向天上车马的异象。
