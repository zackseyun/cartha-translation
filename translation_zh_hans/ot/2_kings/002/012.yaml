base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: zh_hans
  text: 以利沙正在观看，呼喊着说：“我父啊！我父啊！以色列的战车和骑兵啊！”[a] 随后，他再也看不见以利亚了。以利沙就抓住自己的衣服，把衣服撕成两片。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话可理解为称以利亚是以色列真正的力量和保障；也可理解为以利沙对他所见的天上车马景象的呼喊。
    reason: 保留“以色列的战车和骑兵”究竟指称以利亚，还是指向所见天上异象的句法及隐喻歧义。
lexical_decisions:
- source_word: רֹאֶה
  choice: 正看着
  rationale: 分词表示当时持续进行的观看；“正看着”自然地保留这一动态过程。
- source_word: מְצַעֵק
  choice: 一面呼喊
  rationale: 分词与前面的观看同时发生，带有持续和强烈的情感色彩；“一面呼喊”既体现同步性，也不夸大音量。
- source_word: אָבִי אָבִי
  choice: 我父啊！我父啊！
  rationale: 保留第一人称单数后缀和重复呼语的悲痛强度；这里表达师徒般的亲密关系，并非生身父子关系。
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: 以色列的战车和马兵
  rationale: 按希伯来文保留“战车”单数和“马兵”复数，并维持呼喊本身的隐喻与指向歧义，不在正文中解释。
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: 后来，他再也看不见以利亚了
  rationale: “再也看不见”准确表达观看终止；明确宾语为以利亚，可避免现代汉语代词连续出现所造成的含混。
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: 抓住自己的衣服
  rationale: “抓住”自然对应牢牢拿住的动作；“自己的”明确衣服属于以利沙，符合上下文中的哀悼举动。
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: 把衣服撕成两片
  rationale: 以自然现代汉语表达结果结构，同时保留衣服被撕为两片这一细节。
theological_decisions:
- issue: “我父啊……以色列的战车和马兵啊”所指为何
  choice: 正文直译为呼语，不判定它是在称以利亚为以色列真正的保障，还是在描述所见的天上车马。
  alternative: 将其解释性译为“你是以色列的战车和马兵”，或明确说这是以利沙眼前所见的天上车马。
  rationale: 希伯来文没有明示系词或明确的指称关系，两种理解都具有文本依据；直译并以脚注说明，可保存原文真实的神学张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正看着，一面呼喊”保留两个分词的持续和同步意味；重复“我父啊”呈现原文的哀痛，不使用古奥措辞。
