revisions:
- from: 以利沙正看着，一面呼喊：“我父啊！我父啊！以色列的战车和马兵啊！”[a] 后来，他再也看不见以利亚了。以利沙就抓住自己的衣服，把衣服撕成两片。
  to: 以利沙正在观看，呼喊着说：“我父啊！我父啊！以色列的战车和骑兵啊！”[a] 随后，他再也看不见以利亚了。以利沙就抓住自己的衣服，把衣服撕成两片。
  rationale: 修订仅改善现代汉语表达并纠正脚注功能：“骑兵”替代不自然的“马兵”；以“正在观看，呼喊着说”自然保留分词的同步持续意味；重写脚注以实际呈现原文和英文审计记录所承认的两种可能指向，而不在正文中作解释性裁定。
