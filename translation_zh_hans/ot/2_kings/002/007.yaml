  text: וַ/חֲמִשִּׁ֨ים אִ֜ישׁ מִ/בְּנֵ֤י הַ/נְּבִיאִים֙ הָֽלְכ֔וּ וַ/יַּעַמְד֥וּ מִ/נֶּ֖גֶד מֵ/רָח֑וֹק וּ/שְׁנֵי/הֶ֖ם עָמְד֥וּ עַל הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: zh_hans
  text: 有五十个先知门徒[a]前去，远远地站在他们对面[b]；以利亚和以利沙二人则站在约旦河边。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“先知的儿子们”，指与先知事奉有关的一个群体。
    reason: cultural_note
  - marker: b
    text: “在他们对面”也可译作“面对着他们”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: 有五十个
  rationale: 希伯来语是“有五十人”；中文量词“个”自然简洁。“人”的男性含义可由后面的群体称谓与语境承载，无须译作生硬的“五十名男子”。
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: 先知门徒
  rationale: 字面是“先知的儿子们”，但这是对参与先知群体之人的固定称谓，并非强调血缘关系；“先知门徒”在现代中文中自然清楚，同时用脚注保留原文形式及群体性质。
- source_word: הָלְכוּ
  choice: 前去
  rationale: הלך在此是普通叙事动词，表示他们去了现场；“前去”符合中文叙事表达。
- source_word: וַיַּעַמְדוּ
  choice: 站
  rationale: עמד在此直接表示站立，不额外加入“列队”或“站定”等原文未明说的意味。
- source_word: מִנֶּגֶד
  choice: 在他们对面
  rationale: 表示处在相对、面对的位置；“在他们对面”保留空间关系，也不武断断定是否隔河相望。
- source_word: מֵרָחוֹק
  choice: 远远地
  rationale: 明确表达空间距离，现代中文自然，也保留“从远处／在远处”的语义。
- source_word: וּשְׁנֵיהֶם
  choice: 以利亚和以利沙二人则
  rationale: 原文为“他们二人”。中文明确补出前文所指的以利亚和以利沙，可避免“他们”与五十人的指代混淆；“则”体现两组人的场景对照。
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: 站在约旦河边
  rationale: 介词עַל与河流连用时可表示“在……旁／边”；译作“河边”符合过河前的场景，避免误解为站在水面上。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“先知门徒”避免把固定群体称谓误读为血缘上的儿子，同时以脚注保留希伯来语的字面形式。标点用分号清楚呈现五十人远观与二人临河而立的对照。
