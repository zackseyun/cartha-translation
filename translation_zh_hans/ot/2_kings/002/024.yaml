base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: zh_hans
  text: 他转过身来，看见他们，就奉耶和华的名咒诅他们。随后，两只母熊从树林里出来，撕裂了他们中的四十二个少年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: 咒诅他们
  rationale: 准确表达 קלל 在此处宣告咒诅的含义，并保留先知奉耶和华之名施行审判的严肃语气。
- source_word: בְּשֵׁם יְהוָה
  choice: 奉耶和华的名
  rationale: “奉……的名”自然表达凭其名义与权柄行事；יהוה 按中文圣经通行方式译作“耶和华”。
- source_word: שְׁתַּיִם דֻּבִּים
  choice: 两只母熊
  rationale: 数词使用阴性形式，与 דֻבִּים 配合，表明是两只雌熊。
- source_word: וַתְּבַקַּעְנָה
  choice: 抓伤了
  rationale: בקע 的基本意象是劈开、撕裂；在猛兽袭击的语境中表示造成严重撕裂伤。“抓伤”比“撕碎”少作死亡推断，但语势较为克制。
- source_word: יְלָדִים
  choice: 少年
  rationale: 该词可泛指儿童、少年或年轻人；上下文的 נְעָרִים קְטַנִּים（23节）未必专指幼童，因此用“少年”避免过度限定年龄。
theological_decisions:
- issue: 咒诅与耶和华之名的关系
  choice: 直译为“奉耶和华的名咒诅他们”
  alternative: “求耶和华降祸给他们”
  rationale: 原文明确说先知“奉耶和华的名”咒诅，却没有记录具体措辞；译文不补充祈求形式或具体灾祸。
- issue: 熊袭击的结果
  choice: 不明说死亡
  alternative: “撕死”或“撕碎”
  rationale: 原文描述熊将他们劈开、撕裂，但没有明确说四十二人死亡；译文保留这一信息边界。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“随后”呈现连续事件；保留原文审判场景的强烈感，不额外解释事件缘由或受害者结局。
