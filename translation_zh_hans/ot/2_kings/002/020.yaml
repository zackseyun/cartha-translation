  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: zh_hans
  text: 他说：“给我拿一个新的小器皿[a]来，并在里面放上盐。”他们就把器皿拿来给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
