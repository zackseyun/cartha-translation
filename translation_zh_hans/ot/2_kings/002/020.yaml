lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 未显明主语承接上文，按希伯来叙事体自然译为“他说”；不另加连接词，以符合现代汉语叙事习惯。
- source_word: קְחוּ לִי
  choice: 拿……来给我
  rationale: לקח本义为“拿、取”，与לִי连用并结合后文送到他面前的动作，此处自然表达为“拿……来给我”。
- source_word: צְלֹחִית
  choice: 小器皿
  rationale: 该词泛指较小的盛物器具，具体形状并不确定；“小器皿”既保留其泛义，也避免把它过早限定为碗、罐或瓶。
- source_word: חֲדָשָׁה
  choice: 新的
  rationale: 直接保留形容词“新”的含义，并按现代汉语语序置于名词前。
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: 里面放上盐
  rationale: שָׁם字面为“那里”，所指是刚提到的器皿；译作“里面”清楚自然。שׂים译作“放上”，保留命令中的实际动作。
- source_word: וַיִּקְחוּ אֵלָיו
  choice: 他们就拿来给他
  rationale: 再次出现的לקח在语境中指按吩咐取来并交到他那里；“就”体现叙事上的紧接与执行，宾语按汉语习惯省略，由上文可知。
