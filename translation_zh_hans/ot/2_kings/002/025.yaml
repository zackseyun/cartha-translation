  text: 以利沙从那里往迦密山去，又从那里回到撒玛利亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 去
  rationale: 叙事性连续式推动情节，表示简单的过去行动；中文用“去”自然承接上文，不额外赋予因果或时间色彩。
- source_word: מִשָּׁם
  choice: 从那里
  rationale: 表示离开先前提到的地点；“从那里”准确、自然，并保留原文两次重复的表达。
- source_word: אֶל
  choice: 往
  rationale: 表示朝向目的地的移动；与“去”搭配时，“往”符合现代汉语行程叙述。
- source_word: הַר הַכַּרְמֶל
  choice: 迦密山
  rationale: 这是具名山岳，采用中文圣经传统中通行且易识别的地名译法“迦密山”。
- source_word: וּמִשָּׁם
  choice: 又从那里
  rationale: 连接下一段行程，并保留原文重复“从那里”的叙述结构；“又”在现代汉语中自然表示动作继续。
- source_word: שָׁב
  choice: 回到
  rationale: שׁוּב在行程语境中指返回；“回到”与目的地搭配自然，也清楚表达返回之意。
- source_word: שֹׁמְרוֹן
  choice: 撒玛利亚
  rationale: 采用现代中文圣经中通行的地名译法；本节行程语境通常指撒玛利亚城，但原文地名本身未另加“城”。
- source_word: 隐含主语（第三人称阳性单数）
  choice: 以利沙
  rationale: 希伯来语动词仅表达“他”；根据紧接的上文，所指为以利沙。中文在独立经节中明示姓名，可避免指代不清而不改变所指。
