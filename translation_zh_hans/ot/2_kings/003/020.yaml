base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: zh_hans
  text: 到了早晨，献上素祭的时候[a]，看哪，有水从以东的方向[b]流来，那地就被这水充满了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“素祭上升的时候”；这是献祭用语，指素祭被献上。也可译作“素祭献上的时候”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“从以东那条路来”或“经由以东而来”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: 到了早晨
  rationale: 承接叙事次序，并自然表达事件发生的时间；不采用文言式“事情发生了”。
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: 献上素祭的时候
  rationale: עלה在祭祀语境中指祭物被呈献；מִנְחָה在此指素祭。该译法自然保留祭祀含义及时间关系。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来文提示读者注意突发景象的鲜明叙事作用。
- source_word: מַיִם בָּאִים
  choice: 有水……流来
  rationale: בָּאִים为分词，呈现水正在涌来的可见动态；中文以“流来”表达水的运动，比泛称“来”更自然。
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: 从以东的方向
  rationale: דֶּרֶךְ本义为道路、路径，此结构可表示来源方向；正文采用自然且不把它缩减为单纯“从以东”的译法。
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: 遍地都被这水淹满了
  rationale: הָאָרֶץ在局部场景中指当地地面或地域；“这水”体现定冠词对前述水的回指。“淹满”自然表达地面充满水的结果。
