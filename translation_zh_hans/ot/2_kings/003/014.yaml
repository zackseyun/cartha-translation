base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: zh_hans
  text: 以利沙说：“我指着永活的万军之耶和华起誓，就是我侍立在他面前的那一位：若不是我顾及犹大王约沙法的情面[a]，我必不看你，也不见你。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“抬起犹大王约沙法的脸”；这是表示顾及某人的情面、看重或优待某人的习语。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: 我指着……万军之耶和华——永活的上帝——起誓
  rationale: 这是希伯来语常见的起誓格式。汉语用“指着……起誓”明确其言语功能，并以“永活的上帝”保留“耶和华是活的”这一誓言依据；“万军之耶和华”保留称号的广义，不限定为某一种军队。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，保留四字神名作为专名，而不以“主”这一称号替代。
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: 我所侍立在他面前的
  rationale: “侍立在……面前”既保留站在神面前的形象，也自然传达先知事奉神的含义。
- source_word: פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: 我顾念犹大王约沙法的情面
  rationale: 原文由“面”和“抬起”构成习语，表示因某人而施以情面、看重或优待。“顾念……的情面”在现代汉语中自然，并保留关系性的意象。
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: 我必不看你，也不理会你
  rationale: 誓言结构中的两个 אִם 带有隐含否定。前一动词直译为“看”，后一动词在此有“注意、理会”之意；这样既保留两个并列动词，也避免中文中“看你、见你”的生硬重复。
- source_word: יְהוֹשָׁפָט / יְהוּדָה
  choice: 约沙法 / 犹大
  rationale: 采用现代中文圣经通行的专名译法。
theological_decisions:
- issue: 四字神名的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 正文将 יהוה 作为神的专名处理，不以称号取代；“耶和华”是简体中文圣经语境中最易识别且庄重的传统音译。
- issue: 先知站在神面前的表达
  choice: 侍立在他面前
  alternative: 站在他面前；事奉他
  rationale: “侍立”兼顾原文的身体意象与职分含义，不把它完全化约为抽象的“事奉”。
- issue: 以利沙对约沙法的态度
  choice: 顾念……的情面
  alternative: 看重约沙法；因约沙法的缘故
  rationale: 原文习语可能强调尊重、顾及或施恩；译文保留这种关系性的宽度，不进一步断定以利沙的内在动机。
translation_notes:
  register: 采用庄重而可懂的现代标准汉语。“万军之耶和华”“侍立”保留经文的正式语域；用“顾念……的情面”和“不理会”使希伯来习语及并列动词在现代汉语中自然。正文唯一脚注标记[a]与脚注对应。
