  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: zh_hans
  text: 那一天，约兰王从撒马利亚出发，召集全以色列人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“数点全以色列人”或“检阅全以色列人”。希伯来语动词可指清点人数，也可指召集或检阅军队；这里的上下文较支持军事含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出发
  rationale: יצא在叙事中表示“出去、启程”。“出发”自然地表达约兰离开撒马利亚展开行动，又不单凭此词添加“进军”的军事含义。
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: 约兰王
  rationale: 按现代汉语人名与称号的通常次序表达，既准确又自然。
- source_word: בַּיּוֹם הַהוּא
  choice: 那一天
  rationale: 直接保留该短语的时间指向，并置于句首，使现代汉语行文流畅。
- source_word: מִשֹּׁמְרוֹן
  choice: 从撒马利亚
  rationale: 介词מִן表示起点或来源；“从撒马利亚”准确呈现地理出发点。
- source_word: וַיִּפְקֹד
  choice: 召集
  rationale: פקד语义范围包括数点、检阅和召集军队；本节处于出征背景中，“召集”最自然地体现军事动员，同时以脚注保留“数点、检阅”的可能。
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: 全以色列军队
  rationale: “全以色列”在此语境中指北国以色列为战事召集的人员；补出“军队”可使现代读者明确军事所指，但不表示全国每一个居民都亲自参战。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“出发”避免在第一个动词中提前加入过强的军事色彩；“召集全以色列军队”则清楚传达上下文中的军事行动。脚注保留希伯来语动词的真实多义性。
