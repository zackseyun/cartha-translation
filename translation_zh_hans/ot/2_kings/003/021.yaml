base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: zh_hans
  text: 摩押众人听说诸王上来要与他们交战，就从所有能束腰带的人起，连年龄更大的，都被召集起来[a][b]；他们便站在边境上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“就被征召起来”或“就被集合起来”。这里的希伯来语动词按上下文很可能指动员，而不只是呼喊。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译为“从每一个束腰带的人起，以及以上的人”，是指从达到服役年龄的人起，连同年龄更大的人。
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: 摩押众人
  rationale: “摩押”在这里是集合称谓，指摩押全国的人民；译作“摩押众人”既保留民族名称，也符合现代汉语表达。
- source_word: שָׁמְעוּ
  choice: 听说
  rationale: שׁמע在报道语境中指听到消息；“听说”比单纯“听见”更自然。
- source_word: כִּי עָלוּ הַמְּלָכִים
  choice: 那些王已经上来
  rationale: 保留עלה“上来、上去”的方向性，并用“已经”表达相对于“听说”已经发生的军事行动。
- source_word: לְהִלָּחֶם בָּם
  choice: 要攻打他们
  rationale: 该结构表示与他们交战；“攻打”切合诸王进军摩押的军事语境，又不额外扩展为全面战争。
- source_word: וַיִּצָּעֲקוּ
  choice: 就被召集起来
  rationale: 此处语境是面对入侵而动员人员，不只是“呼喊”；被动表达保留原文被召集、被征召的意味，同时不把它过度限定为正式军事编制。
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: 凡到了能束腰带的年纪以及年龄更大的男子，全都应召
  rationale: 保留“束腰带”的具体意象，并明确“以上”表示以某一年龄门槛为起点；“男子”由军事动员语境及该习语所指的人群得出。
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: 他们站在边境上
  rationale: 直译עמד“站立”和גבול“边境、边界”，让上下文自然传达军事驻守的意味，而不增添原文未明说的“列阵”。
