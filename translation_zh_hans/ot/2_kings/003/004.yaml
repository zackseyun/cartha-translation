base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: zh_hans
  text: 摩押王米沙以养羊为业，常向以色列王进贡十万只羊羔，以及十万只公绵羊的羊毛[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“十万只公绵羊，羊毛”。这是一种省略式表达，可能指“十万只带着羊毛的公绵羊”，但按上下文，更可能指“十万只公绵羊的羊毛”。
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: 经营牧羊业
  rationale: 该词指从事饲养、繁育羊群的人。结合米沙的王者身份和本节的贡赋背景，译作“经营牧羊业”比“牧羊人”更自然，也避免让人误以为他亲自放牧。
- source_word: וְהֵשִׁיב
  choice: 常向……进贡
  rationale: 使役形在这里指向宗主交纳贡物；未完成式结合上下文表达惯常行为，因此用“常……进贡”。
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: 十万只羊羔
  rationale: כָּרִים可指羊羔或年轻的公羊；贡物清单中译作“羊羔”简明自然。
- source_word: מֵאָה אֶלֶף אֵילִים צָמֶר
  choice: 十万只公绵羊的羊毛
  rationale: 原文末尾“公绵羊，羊毛”是省略式表达。正文按语境理解为取自十万只公绵羊的羊毛，同时用脚注保留其句法歧义。
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: 摩押王／以色列王
  rationale: 按希伯来语领属结构译为现代汉语中自然、庄重的王号。
