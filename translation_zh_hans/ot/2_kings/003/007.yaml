base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: zh_hans
  text: 于是，他动身后，派人向犹大王约沙法传话，说：“摩押王背叛了我[a]。你愿意同我去攻打摩押吗？”约沙法说：“我愿意去[b]。你我不分彼此；我的人民就是你的人民，我的马匹就是你的马匹。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “背叛”也可译作“脱离”。原文动词可指政治上的反叛或毁弃效忠关系；这里指摩押反抗以色列的统治。
    reason: lexical_alternative
  - marker: b
    text: “我愿意去”原文直译为“我愿意上去”。这个动词常用于前往作战，也可能反映向较高地势行进。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיִּשְׁלַח אֶל
  choice: 于是，他去派人向……传话
  rationale: 连续叙事动词推进情节；结合后面的直接引语，שׁלח אֶל 表示差人传递口信。
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: 犹大王约沙法
  rationale: 按现代汉语自然语序表达人物姓名和王位身份。
- source_word: פָּשַׁע בִּי
  choice: 背叛了我
  rationale: 在藩属政治语境中，该动词指反叛或脱离宗主统治；“背叛”自然且保留关系破裂的含义。
- source_word: הֲתֵלֵךְ אִתִּי אֶל מוֹאָב לַמִּלְחָמָה
  choice: 你愿意同我去攻打摩押吗
  rationale: 忠实表达同行前往摩押作战的邀请；“攻打”使 לַמִּלְחָמָה 的军事目的在汉语中清楚自然。
- source_word: אֶעֱלֶה
  choice: 我愿意去
  rationale: עלה 字面为“上去”，此处指参与军事行动；汉语用“去”较自然，而将字面意象置于脚注。
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: 你我不分彼此
  rationale: 希伯来语为省略式团结誓言，字面近于“我如同你”；此译传达彼此完全站在同一阵线的语用力量。
- source_word: כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: 我的人民就是你的人民，我的马匹就是你的马匹
  rationale: 保留两组平行结构，表达人民与军力都供对方共同调遣的坚定承诺。
