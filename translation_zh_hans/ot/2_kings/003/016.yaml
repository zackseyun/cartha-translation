  yaml_path: translation/ot/2_kings/003/016.yaml
  text: 'And he said[c][b][a], “Thus says Yahweh: Make this wadi full of pits.”'
translation:
  language: zh_hans
  text: 他就说：“雅威[a]如此说：‘要使这条河谷[b]到处都是坑[c]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”译自神名 יהוה；传统中文译本常译作“耶和华”。
    reason: alternative_reading
  - marker: b
    text: “河谷”所译的希伯来词可指季节性水道、干涸河床、溪谷或溪流。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文重复“坑”一词，直译为“使这条河谷成为坑、坑”，表示有许多坑或坑遍布其中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他就说
  rationale: 以“就”自然承接希伯来叙事中的 wayyiqtol 形式，不额外限定为强烈的时间先后关系。
- source_word: כֹּה אָמַר יְהוָה
  choice: 耶和华如此说
  rationale: 保留先知传达神谕时庄重而固定的使者公式；在现代中文中简洁自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者最熟悉的神名音译，并以脚注说明另一常见拟音“雅威”。
- source_word: עָשֹׂה
  choice: 要使
  rationale: 此处以不定式绝对形发挥命令作用；“使”贴近 עשה 的宽泛含义，避免把原文未明说的动作直接限定为“挖”。
- source_word: הַנַּחַל הַזֶּה
  choice: 这条河谷
  rationale: נחל 在本语境中指季节性水道或干涸河床；“河谷”兼顾地形与水道含义，又比音译地理术语更易懂。
- source_word: גֵּבִים גֵּבִים
  choice: 到处都是坑
  rationale: 原文重复复数名词，表达数量多或遍布其间；中文用“到处都是”自然传达这种分布和强调，同时脚注保留其字面形式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉、已成为专名的“耶和华”，而脚注交代按现代学界常见重构发音也可译作“雅威”，不以“主”这一称号替代原文神名。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“耶和华如此说”保留先知神谕公式的正式语气；命令句避免生硬照搬名词重复，正文以自然中文表达，原文形式则由脚注说明。
