  terminology: “以利沙”“以色列王”“摩押”“雅威”均一致且恰当。“先知”与“交在……手中”准确。脚注a恰当说明习语；脚注b适当地保留 אַל כִּי 可作恳求的可能性，未把争议读法当作定论。
