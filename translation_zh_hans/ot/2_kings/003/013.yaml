  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: zh_hans
  text: 以利沙对以色列王说：“我跟你有什么关系？[a]去找你父亲的先知和你母亲的先知。”以色列王对他说：“不！[b]因为雅威召集了这三个王，要把他们交在摩押手中。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“我与你有什么？”这是表示疏远或拒绝的惯用语。
    reason: 说明希伯来习语的字面形式与语用含义。
  - marker: b
    text: 或译：“请不要这样！因为雅威召集了这三个王，要把他们交在摩押手中。”原文表达较难确定，也可能是恳求，而不只是直接反驳。
    reason: 保留 אַל כִּי 的语法和语气歧义。
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: 我跟你有什么关系？
  rationale: 这是表示疏远或拒绝的希伯来习语。此译法是自然的现代汉语，同时保留以利沙强硬的反问语气。
- source_word: לֵךְ
  choice: 去找……吧
  rationale: 命令式直译为“去”；结合介词 אֶל，在汉语中译作“去找”更自然。“吧”表达语境中的冷峻打发，并未改变命令性质。
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: 你父亲的先知和你母亲的先知
  rationale: 保留对父母双方所属先知的分别指称，也保留其针对王室宗教背景的尖锐意味，不具体补出经文未明说的人名。
- source_word: אַל כִּי
  choice: 不！是……
  rationale: 原文短促且难解；此处可视为王对以利沙拒斥的抗议。用“不！”保留直接反驳，同时以脚注注明也可能是恳求。
- source_word: קָרָא
  choice: 召集了
  rationale: 此处指雅威使三王聚集并一同出征。“召集”比单独的“召”在现代汉语中更清楚，又不预断这是单纯的呼召还是安排他们聚合。
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: 这三个王
  rationale: 按现代汉语语序准确保留数目、指示词和“王”的称号。
- source_word: לָתֵת אוֹתָם
  choice: 要把他们交在
  rationale: 不定式可表达目的或结果；“要把他们交在”保留两者之间的张力，未明确改写成已实现的结果。
- source_word: בְּיַד מוֹאָב
  choice: 摩押手里
  rationale: 保留“手”的希伯来意象；现代汉语“交在……手里”自然表达落入对方权势之下。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见汉语音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此正文采用其现代汉语常见音译“雅威”，避免以称号代替专名。
- issue: 王回答中的 אַל כִּי
  choice: 理解为抗议：“不！是雅威……”
  alternative: 理解为恳求：“请不要这样！因为雅威……”；或理解为哀叹
  rationale: 该结构简短而有歧义。上下文支持王反驳以利沙的拒斥，但也不能排除恳求语气，因此正文采用抗议式译法，并以脚注保留另一读法。
- issue: 雅威“召集”三王的目的或结果
  choice: 要把他们交在摩押手里
  alternative: 结果把他们交在摩押手里
  rationale: לָתֵת 在此可表示目的或结果。正文使用“要”保持原句的因果与意图色彩，却不进一步断定这是神最终旨意还是王在危机中的理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话保持短促有力；“我跟你有什么关系”通俗易懂但不失严肃。“去找……吧”传达打发之意。正文所有脚注标记均置于相关短语之后。
