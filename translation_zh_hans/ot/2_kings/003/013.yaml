  to: 以利沙对以色列王说：“我跟你有什么关系？[a]去找你父亲的先知和你母亲的先知。”以色列王对他说：“不！[b]因为雅威召集了这三个王，要把他们交在摩押手中。”
  rationale: 修订仅调整安全且必要的汉语表达：“因为”明确对应主要理解下的 כִּי，避免“是雅威”所引入的对比性强调；删除“吧”以保留命令的直接性；“手中”提升书面语庄重度。脚注保留原有的替代读法与歧义说明。
