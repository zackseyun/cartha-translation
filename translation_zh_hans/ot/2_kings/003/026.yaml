  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: zh_hans
  text: 摩押王见战事对他不利，就带着七百名拔剑的士兵，企图突围到以东王那里[a]，却没能成功。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向以东王攻去。”这里的希伯来语介词既可表示方向（“到、向”），在这一军事语境中也可表示敌对方向（“攻击、对抗”）。
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: 战事对他不利
  rationale: 该习语直指战局强过摩押王、令他难以抵挡；此译自然表达其军事劣势，同时不扩充具体战况。
- source_word: אֹתוֹ שְׁבַע מֵאוֹת אִישׁ
  choice: 带着七百名……士兵
  rationale: 这里表示摩押王带上一支七百人的队伍；按军事语境将 אִישׁ 译作“士兵”，比单译“人”更清楚。
- source_word: שֹׁלֵף חֶרֶב
  choice: 拔刀的
  rationale: 保留希伯来文“拔出刀剑”的军事意象；现代汉语在此以“拔刀”简洁自然。
- source_word: לְהַבְקִיעַ
  choice: 企图突围
  rationale: 该词的使役形式在此指冲破敌军阵线；“突围”准确而自然，“企图”体现后文所述行动未能成功。
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: 到以东王那里
  rationale: אֶל 首先保留为方向性的“到、向”；军事语境也容许理解为敌对性的“攻向”，故以脚注保留歧义。
- source_word: וְלֹא יָכֹלוּ
  choice: 却没能成功
  rationale: 复数动词指王与随行士兵未能完成突围；此译在汉语中明确承接前述尝试。
theological_decisions:
- issue: 突围行动与以东王的关系
  choice: 正文译为方向性的“到以东王那里”
  alternative: “向以东王攻去”或“从以东王那边突围”
  rationale: 介词 אֶל 可表示“到、向”，在军事语境中也可能带有“攻击、对抗”的含义。正文不武断判定摩押王是要抵达以东王所在处还是攻破其阵地，并用脚注提示另一理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“战事对他不利”传达战局压倒摩押王的含义；“拔刀的士兵”和“突围”保留军事场景。脚注明确保留介词的真实歧义。
