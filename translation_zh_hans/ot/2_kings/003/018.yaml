  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: zh_hans
  text: 这在雅威眼中算是小事[a]；他还要把摩押交在你们手中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这在雅威眼中是容易的。”
    reason: 原词可表示轻微、无足轻重，也可表示容易；正文采用“小事”，脚注保留另一种合理理解。
lexical_decisions:
- source_word: וְנָקַל
  choice: 算是小事
  rationale: 该词表达分量轻、无足轻重或容易之意。“算是小事”在现代汉语中自然地保留了评价意味；“容易”这一可能含义列入脚注。句首的连接词通过上下文衔接体现。
- source_word: זֹאת
  choice: 这
  rationale: 指向上文所说的供水之事，使用近指代词“这”准确自然。
- source_word: בְּעֵינֵי
  choice: 在……眼中
  rationale: 保留希伯来语表示判断或评价的惯用比喻，现代汉语也能自然理解。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留原文所用的专名，而不以称号替代。
- source_word: וְנָתַן
  choice: 他还要……交
  rationale: 在先知预告的语境中表达将来的行动；“还要”体现这是继供水之后进一步施行的事。
- source_word: אֶת מוֹאָב
  choice: 摩押
  rationale: 按原文保留国家或民族的集合名称“摩押”，不扩译为“摩押人”。
- source_word: בְּיֶדְכֶם
  choice: 交在你们手中
  rationale: 保留“交在某人手中”这一圣经惯用表达，意思是使其落入对方的权势或控制之下。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；译作“雅威”旨在以现代常见音译保留其专名性质，而不是改用“主”等称号。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“算是小事”兼顾希伯来语的重量隐喻和汉语可读性；分号呈现供水与交付摩押这两项相关但递进的行动。
