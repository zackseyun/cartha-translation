base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: zh_hans
  text: 现在，给我找一位乐手来。[a]乐手弹奏的时候，耶和华的手[b]就临到他身上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “乐手”指演奏乐器的人；原文没有说明所用的是哪一种乐器。
    reason: lexical_alternative
  - marker: b
    text: “耶和华的手”是希伯来语的形象说法，表示神的能力或促使人说预言的感动；正文保留原有意象。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 该表达引出眼前的新行动；现代汉语用“现在”即可自然呈现话语转折，不必机械补出“而”。
- source_word: קְחוּ לִי
  choice: 给我找……来
  rationale: 祈使式加受益者代词在这里表示为说话者找来某人；“给我找……来”比直译“为我拿”准确自然。
- source_word: מְנַגֵּן
  choice: 一位乐手
  rationale: 该分词指演奏乐器的人，但原文没有说明具体乐器；“乐手”既简明，又避免擅自具体化为琴师或竖琴手。
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: 乐手弹奏的时候
  rationale: 这一结构交代随后事件发生时的情境；译文保留时间关系，同时省去在汉语中显得生硬的叙事套语“事情是这样”。
- source_word: יַד יְהוָה
  choice: 耶和华的手
  rationale: 保留希伯来语“手”的形象表达，不径直解释为能力、感动或先知灵感，以免缩窄其含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中广为人知的神圣名字译法，作为四字神名的音译性表达，而不以“主”这一称号替代。
- source_word: וַתְּהִי עָלָיו
  choice: 就临到他身上
  rationale: 动词形式在叙事中表示这影响随即发生；“临到……身上”自然保留神圣力量或先知性影响来到某人身上的表达。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神的名字，而非“主”这一称号。正文采用汉语读者最熟悉的专名“耶和华”；“雅威”是另一种较接近学界拟音的形式，但不改变此处指向以色列之神专名的事实。
- issue: “耶和华的手”所表达的神圣作用
  choice: 保留身体意象：“耶和华的手就临到他身上”
  alternative: 耶和华的能力临到他；耶和华感动他
  rationale: 上下文表明这与以利沙随后说预言有关，但原文没有在本句中明确界定其作用方式。保留“手”的意象，既传达神主动施力，也不把含义限定为某一种神学解释。
- issue: עָלָיו 的指代
  choice: 他
  alternative: 以利沙
  rationale: 原文使用第三人称男性单数代词。正文保留代词，不把上下文所指的以利沙直接代入，以维持形式与叙事衔接。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“给我找一位乐手来”符合口语命令的自然语序；“临到他身上”保留圣经叙事语体，但普通读者仍易理解。脚注标记分别紧跟其所解释的“乐手”和“耶和华的手”相关句子，避免英文咨询层中标记位置与注释内容错位的问题。
