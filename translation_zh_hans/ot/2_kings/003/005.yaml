  yaml_path: translation/ot/2_kings/003/005.yaml
  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: zh_hans
  text: 亚哈死后[a]，摩押王就背叛了以色列王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚哈死时”。希伯来语的时间表达可作这两种理解。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 就
  rationale: 该叙事形式承接上文并推进事件；现代汉语无需机械译为“事情发生了”，用“就”自然表达随后的事态发展。
- source_word: כְּמוֹת אַחְאָב
  choice: 亚哈死后
  rationale: 介词כ与מות的不定式组合构成时间表达，可指“亚哈死时”或“亚哈死后”。结合汉语叙事习惯译作“亚哈死后”，同时用脚注保留较贴近形式的另一种理解。
- source_word: אַחְאָב
  choice: 亚哈
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: וַיִּפְשַׁע
  choice: 背叛了
  rationale: פשע在此政治语境中指附庸反抗宗主、脱离臣服；“背叛”清楚自然，并保留其关系性和政治意味。
- source_word: מֶלֶךְ מוֹאָב
  choice: 摩押王
  rationale: 以简洁自然的现代汉语表达希伯来语属格结构，同时保留正式君王称谓。
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 介词ב与פשע连用，标明背叛所针对的对象；汉语“背叛以色列王”无需另加介词即可准确表达。
theological_decisions: []
