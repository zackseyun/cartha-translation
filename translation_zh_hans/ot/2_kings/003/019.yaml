base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: zh_hans
  text: 你们要攻打每一座设防的城和每一座上好的城[a]，砍倒一切好树，堵住所有水泉，并用石头毁坏每一块上好的田地[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “上好的城”也可译作“精选的城”或“最好的城”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“用石头使……痛苦”，指把石头扔撒在田地里，使其难以耕种，从而毁坏农田。
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: 你们要攻打
  rationale: נכה的使役形在军事语境中表示击打、攻击；“攻打”自然地搭配“城”，同时不额外译成“攻占”。
- source_word: עִיר מִבְצָר
  choice: 设防的城
  rationale: מִבְצָר指防御工事或坚固之处；“设防的城”准确表达城市具有防御设施。
- source_word: עִיר מִבְחוֹר
  choice: 上好的城
  rationale: מִבְחוֹר指被选中的、上好的或最好的；此译法保留其评价意味，而不具体断定所指是规模、战略地位还是富庶程度。
- source_word: תַּפִּילוּ
  choice: 砍倒
  rationale: נפל的使役形在这里指使树倒下；“砍倒”符合汉语习惯和具体语境。
- source_word: כָּל עֵץ טוֹב
  choice: 一切好树
  rationale: טוֹב基本义为“好”；虽可能指有价值或能结果子的树，正文不将这一含义限定为“果树”。
- source_word: מַעְיְנֵי מַיִם
  choice: 所有水泉
  rationale: 该词组指涌水的泉源；“水泉”简洁地保留其自然水源之义。
- source_word: תִּסְתֹּמוּ
  choice: 堵住
  rationale: 该动词表示封闭、堵塞，用于水泉时“堵住”准确自然。
- source_word: הַחֶלְקָה הַטּוֹבָה
  choice: 每一块良田
  rationale: חֶלְקָה指一块地或田地；结合农业破坏的语境，“良田”自然表达“好的田地”，但不进一步限定其作物。
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: 用石头毁坏
  rationale: כאב的使役形字面含“使……痛苦”，这里异常地用于土地，语境所指是以石头破坏田地；“毁坏”传达实际效果，脚注保留字面张力。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“攻打”避免生硬的“击打城市”；“上好的城”和“一切好树”保留原文较宽泛的评价词，不擅自解释为战略重镇、富庶城市或果树。脚注[b]置于“良田”之后，以对应其实际解释的希伯来语短语。
