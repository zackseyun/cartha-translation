base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: zh_hans
  text: '[a]亚哈的儿子约兰在撒玛利亚登基作以色列王，是在犹大王约沙法在位第十八年；他作王十二年。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较形式化地译作：“亚哈的儿子约兰……”；希伯来语句首有连接词，也可译作“并且”。
    reason: 保留句首希伯来语连接词的可选译法；现代汉语正文不机械译出该连接词。
lexical_decisions:
- source_word: וִ/יהוֹרָם
  choice: 约兰
  rationale: 按现代中文圣经人名惯例音译；句首连接词 ו־ 在叙事延续中不必机械译作“并且”，其连接作用由上下文自然体现。
- source_word: בֶּן אַחְאָב
  choice: 亚哈的儿子
  rationale: 直接表达父子关系，符合现代汉语语序。
- source_word: מָלַךְ
  choice: 登基
  rationale: 此处的完成式动词指开始作王，即即位，与后文说明统治年数的 וַיִּמְלֹךְ 区分。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王
  rationale: 将字面的“统治以色列”按中文王朝纪年语体自然表达。
- source_word: בְּ/שֹׁמְרוֹן
  choice: 在撒玛利亚
  rationale: 介词 בְּ 表地点；此处撒玛利亚指以色列王国的都城和施政所在地。
- source_word: בִּ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: 十八年
  rationale: 与“犹大王约沙法”组合为汉语惯用的在位纪年格式。
- source_word: לִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: 犹大王约沙法十八年
  rationale: 纪年公式中的 לְ 表示约沙法在位年次，采用简洁自然的中文史书式表达。
- source_word: וַ/יִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: 统治了十二年
  rationale: 此处 מלך 概述在位时长；“统治了”清楚区别于前面的即位动作。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“登基”表达即位，“统治了十二年”表达在位时长，避免同一汉语动词造成含义混淆。正文中的脚注标记置于所涉及的首个王权与地点分句之后。
