  to: '[a]亚哈的儿子约兰在撒玛利亚登基作以色列王，是在犹大王约沙法在位第十八年；他作王十二年。'
  rationale: 修订重组语序，使“在撒玛利亚登基作以色列王”完整对应即位、统治对象和地点，并明确“约沙法在位第十八年”是同步纪年。“作王十二年”保留王表式庄重语体。脚注改为忠实说明句首连接词，不再给地点短语增添‘驻于’的含义。
