  text: וַ/יֵּלֶךְ֩ מֶ֨לֶךְ יִשְׂרָאֵ֤ל וּ/מֶֽלֶך יְהוּדָה֙ וּ/מֶ֣לֶךְ אֱד֔וֹם וַ/יָּסֹ֕בּוּ דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא הָיָ֨ה מַ֧יִם לַֽ/מַּחֲנֶ֛ה וְ/לַ/בְּהֵמָ֖ה אֲשֶׁ֥ר בְּ/רַגְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: zh_hans
  text: 于是，以色列王同犹大王和以东王出发了。他们绕道走了七天；营地和随行的牲畜[a]都没有水。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“在他们脚边的牲畜”；指跟随他们同行的牲畜。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 出发了
  rationale: הלך在叙事中引出这次远征；“出发了”自然表达启程之意，而不把上下文中的军事色彩强加给动词本身。
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: 以色列王同犹大王和以东王
  rationale: 保留三个王的称号及并列关系，采用现代汉语自然的连接方式。
- source_word: וַיָּסֹבּוּ
  choice: 他们绕道走了
  rationale: סבב在此表示迂回、绕行；“绕道走了”既保留方向含义，也符合现代汉语表达。
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: 七天
  rationale: 原文直译近于“七天的路程”，与前面的绕行连用，表示他们沿迂回路线行进了七天；正文简洁处理为“绕道走了七天”。
- source_word: וְלֹא הָיָה מַיִם
  choice: 却没有水
  rationale: 直接呈现希伯来文存在句，同时用“却”表达叙事中的转折。
- source_word: לַמַּחֲנֶה
  choice: 给营中的人
  rationale: מַחֲנֶה本义为“营、营地”，这里与牲畜并列，实际指营中队伍的用水；译为“营中的人”可避免汉语“给营地水”的生硬表达。
- source_word: וְלַבְּהֵמָה
  choice: 给……牲畜
  rationale: בְּהֵמָה为集合意义，指随军的家畜、驮畜等；“牲畜”比“动物”更贴合语境。
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: 随行的
  rationale: 字面为“在他们脚边的”，在此指跟随队伍同行；正文采用自然的功能对等表达，并以脚注保留字面意象。
theological_decisions: []
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。分成两句以避免王名并列和行程、缺水信息挤在一个长句中；不额外明确具体路线，也不把“七天的路程”解释成确定的距离。
