  text: וַ/יַּעֲשֶׂ֤ה הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֥א כְ/אָבִ֖י/ו וּ/כְ/אִמּ֑/וֹ וַ/יָּ֨סַר֙ אֶת מַצְּבַ֣ת הַ/בַּ֔עַל אֲשֶׁ֥ר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: zh_hans
  text: 他做了雅威眼中看为恶的事，只是没有像他的父亲和母亲那样[a]；他除掉了他父亲所造的巴力柱像[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“不过不像他的父亲和母亲”。希伯来语在这里对前面的负面评价加以限定，但没有明说所比较的是恶行的方式还是程度。
    reason: lexical_alternative
  - marker: b
    text: “柱像”也可译作“巴力的祭柱”或“巴力的立石”，指与巴力崇拜有关的竖立石柱。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: 他做了……看为恶的事
  rationale: “עשה + הרע”是列王纪常用的评价性表达；译为“做了……看为恶的事”既符合现代汉语，也保留了原文对行为的道德判断。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来语“在……眼中”的意象，同时用“看为”自然表达这是雅威所作的评价。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译神的专名，而不以“主”这一称号代替。
- source_word: רַק
  choice: 只是
  rationale: 此处引出对前一句负面评价的限定；“只是”既贴近原词，也保留其承接和转折功能。
- source_word: לֹא כְאָבִיו וּכְאִמּוֹ
  choice: 没有像他的父亲和母亲那样
  rationale: 直接保留与父母二人的比较；“那样”所指的程度或方式由上下文决定，不额外限定。
- source_word: וַיָּסַר
  choice: 他除掉了
  rationale: 该动词表示移走、除去；译文以分号连接，保留叙事推进，而不把原文连接词明确解释为因果关系。
- source_word: מַצְּבַת הַבַּעַל
  choice: 巴力祭柱
  rationale: מַצֵּבָה指竖立的石柱，在此与巴力崇拜有关。“祭柱”简洁表达其礼仪用途，又避免误译为一般雕像。
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: 他父亲所造的
  rationale: 自然表达关系从句，并清楚说明这根祭柱是其父亲先前造的。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用四字神名。译作“雅威”旨在以现代汉语音译保留其专名性质，不以称号取代。
- issue: 王与其父母作比较的范围
  choice: 保留“没有像他的父亲和母亲那样”的开放表达
  alternative: 没有像他的父母那样邪恶；没有坏到他父母那种程度
  rationale: 原文明确作出限定，却未明说比较的是恶行的种类还是程度；正文不替原文消除这一含混。
- issue: 除去祭柱与前句之间的逻辑关系
  choice: 用分号并列承接
  alternative: 因为他除掉了；可是他除掉了
  rationale: 希伯来文以普通叙事连接形式承接。上下文可能带有解释或对比意味，但正文不把其中一种逻辑关系定死。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“雅威眼中看为恶”保留原文意象；“只是”与分号使句法自然，同时避免把原文潜在的比较范围和逻辑关系解释得过死。
