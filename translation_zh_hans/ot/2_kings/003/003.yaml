  source_fidelity: 译文正确传达了本节的限制性评价、对耶罗波安罪恶模式的依附、使役性的“使以色列犯罪”，以及没有离开的意思。惟“所犯的罪”容易将“耶罗波安的罪”限缩为其个人已犯的罪行，未充分保留该短语作为其所建立并使人随从之罪恶模式的含义；“仍”也不是本节明示的词义。
