revisions:
- from: 只是，他仍紧随尼八的儿子耶罗波安所犯的罪；耶罗波安曾使以色列人陷入这些罪中。他没有离弃这些罪。
  to: 只是，他紧随尼八的儿子耶罗波安的罪，就是耶罗波安使以色列人犯罪的那些罪；他没有离开这些罪。
  rationale: 修订删除“所犯的”和“仍”，避免不必要的语义增补与限缩；以“就是……那些罪”在自然现代汉语中保留原文关系从句所表达的关联，并明确使役动词的主语为耶罗波安，避免误解为本节所述之王使以色列犯罪。无需脚注。
