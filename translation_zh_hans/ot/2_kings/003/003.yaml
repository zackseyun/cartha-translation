base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: zh_hans
  text: 只是，他紧随尼八的儿子耶罗波安的罪，就是耶罗波安使以色列人犯罪的那些罪；他没有离开这些罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 承接上一节对王较为正面的评价，引出限制和例外；“只是”简洁自然，保留希伯来叙事中的转折功能。
- source_word: בְּחַטֹּאות
  choice: 所犯的罪
  rationale: 与דבק连用，表示持续依附某种罪恶道路；译为“紧随……所犯的罪”符合现代汉语，也保留道德和宗教判断。
- source_word: חַטֹּאות
  choice: 罪
  rationale: 原文复数指耶罗波安的宗教罪行及其所形成的模式；汉语“罪”可作集合性表达，无须弱化为中性的“做法”。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 采用现代中文圣经人名的通行译法，并保留父名身份公式。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 耶罗波安曾使以色列人陷入这些罪中
  rationale: הֶחֱטִיא是使役形，明确表示耶罗波安使或引导以色列犯罪；重复主语可避免汉语关系从句指代含混。
- source_word: דָּבֵק
  choice: 仍紧随
  rationale: 该词表达牢牢依附、坚持不离；“紧随”与后句“没有离弃”配合，传达持续遵行罪恶模式之意，“仍”体现上下文中的持续性。
- source_word: לֹא סָר מִמֶּנָּה
  choice: 他没有离弃这些罪
  rationale: סר מן是离开、转离某条道路的常见表达；“离弃”自然庄重。阴性单数后缀在此回指集合性的“罪”，汉语明确译作“这些罪”。
theological_decisions:
- issue: 对王背道行为的评价公式
  choice: 保留“罪”以及“使以色列人陷入这些罪中”的明确道德语言
  alternative: 弱化为“做法”“偏差”或仅描述为宗教政策
  rationale: 原文以חטא及其使役形作明确的神学评价；直陈“罪”忠实保留列王纪叙事自身的判断，而不另加宗派性解释。
- issue: 关系从句的所指
  choice: 把אֲשֶׁר理解为关联耶罗波安的罪，并以独立分句说明他使以色列陷入这些罪中
  alternative: 直接译成“他使以色列犯罪”，不明确“罪”与使役行为之间的关联
  rationale: 这种表达保留原文关系结构所容纳的关联，又以自然汉语避免误以为本节主语约兰是使以色列犯罪的人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“罪”的神学力度；通过重复“耶罗波安”澄清主语。未设脚注，因为译文已在正文中清楚呈现使役意义，且没有必须另注才能保留的实质歧义。
