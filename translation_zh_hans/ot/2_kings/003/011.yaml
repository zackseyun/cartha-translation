  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: zh_hans
  text: 约沙法说：“这里没有耶和华的先知吗？我们好借着他求问耶和华。”[a] 以色列王的一个臣仆回答说：“这里有沙法的儿子以利沙；他曾把水倒在以利亚手上。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求问耶和华”也可较直译为“借着他寻求耶和华”。意思是借先知求得耶和华的指示。
    reason: lexical_alternative
  - marker: b
    text: “把水倒在他手上”很可能指为以利亚洗手倒水，表明以利沙曾贴身侍候他。
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: 这里没有……吗
  rationale: 以现代汉语的否定疑问句保留原文询问的语气，也自然表达说话者希望得到肯定答复的意味。
- source_word: נָבִיא לַיהוָה
  choice: 耶和华的先知
  rationale: לַיהוָה 表明先知与耶和华的归属或代表关系；此译简洁自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中广为人知的神名音译，直接对应四字神名。
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: 我们可以借着他求问耶和华
  rationale: דרשׁ 在此指寻求神谕、求问耶和华；מֵאוֹתוֹ 表示以先知为求问的中介。“借着他”既自然，又不把先知说成启示的源头。
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王的一个臣仆
  rationale: עֶבֶד 在王室场景中可指臣仆或侍从；“臣仆”兼顾宫廷身份与服事关系，避免误解为奴隶。
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: 他从前侍候以利亚，倒水在他手上
  rationale: 保留“倒水在手上”的希伯来具体形象，同时用“侍候”交代该举动所显示的服事关系；“从前”自然表达背景性的既往服事。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文两次直接使用四字神名。中文正文采用读者最熟悉且庄重的传统音译“耶和华”，不以“主”替代专名。
- issue: 求问耶和华与先知的中介角色
  choice: 借着他求问耶和华
  alternative: 向他求问耶和华
  rationale: 原文 מֵאוֹתוֹ 在此语境中表示由先知传达神谕。“借着他”清楚表明求问的对象是耶和华，先知是媒介，且不超出原文。
- issue: 以利沙倒水的含义
  choice: 正文兼保留动作与服事含义
  alternative: 只译作“服事以利亚”
  rationale: 原文明确描写倒水在以利亚手上；不宜完全抽象化为“服事”。但现代读者可能不明其社会含义，因此正文以“侍候”补明关系，脚注解释文化背景。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。对话简洁，保留否定疑问句、先知中介求问以及“倒水在手上”的原文意象；“臣仆”“侍候”帮助普通读者理解宫廷与师徒服事场景。
