revisions:
- from: 约沙法说：“这里没有耶和华的先知吗？我们可以借着他求问耶和华。”[a] 以色列王的一个臣仆回答说：“沙法的儿子以利沙在这里；他从前侍候以利亚，倒水在他手上。”[b]
  to: 约沙法说：“这里没有耶和华的先知吗？我们好借着他求问耶和华。”[a] 以色列王的一个臣仆回答说：“这里有沙法的儿子以利沙；他曾把水倒在以利亚手上。”[b]
  rationale: 修订以“我们好”保留原文求问的目的性和共同意愿；删除正文中解释性的“侍候”，仅保留倒水的具体形象，并以脚注交代其可能表示的贴身服事。另调整语序，使中文更自然。
