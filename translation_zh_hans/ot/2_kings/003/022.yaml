  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: zh_hans
  text: 清早，他们起来，太阳照在水面上；摩押人看见对面的水红得像血。〔a〕
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: 清早，他们起来时
  rationale: שׁכם的使役式在此表示早起；与בַבֹּקֶר合译为“清早……起来”，既保留时间重点，也符合现代汉语叙事习惯。“时”使后续日照与观看的场景衔接自然，但不额外指定主语身份。
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: 太阳照在水面上
  rationale: זרח可指升起或照耀；上下文强调阳光照到水面所造成的视觉效果，因此译作“照在水面上”。
- source_word: וַיִּרְאוּ מוֹאָב
  choice: 摩押人……看见
  rationale: 专名“摩押”在希伯来文中集合性地指摩押百姓。现代汉语译为“摩押人”更清楚自然，同时保留群体含义。
- source_word: מִנֶּגֶד
  choice: 从对面
  rationale: 该空间短语表示在相对、相向的位置观看；“从对面”简明保留这一空间关系。
- source_word: אֶת הַמַּיִם אֲדֻמִּים
  choice: 看见水红得
  rationale: אֲדֻמִּים是复数形容词，与复数形态的מַיִם呼应，描述所见之水呈红色；汉语用“看见水红得……”自然表达宾语补足关系。
- source_word: כַּדָּם
  choice: 像血
  rationale: כְּ引出明喻，דָּם意为“血”；直译为“像血”，保留鲜明意象。
