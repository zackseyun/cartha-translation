  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט יֵ֥שׁ אוֹת֖/וֹ דְּבַר יְהוָ֑ה וַ/יֵּרְד֣וּ אֵלָ֗י/ו מֶ֧לֶךְ יִשְׂרָאֵ֛ל וִ/יהוֹשָׁפָ֖ט וּ/מֶ֥לֶךְ אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: zh_hans
  text: 约沙法说[a]：“他那里有耶和华的话。”于是，以色列王、约沙法和以东王都下去见他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他有从耶和华来的话。”
    reason: 原文 יֵשׁ אֹתוֹ 可表示某物“在他那里”或“他有”某物；此处表明可从他那里得到耶和华的启示。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 这是叙事中常见的 wayyiqtol 形式，由 אמר 而来；用“说”自然引出后面的直接引语。
- source_word: יֵשׁ אֹתוֹ
  choice: 在他那里
  rationale: יֵשׁ 与 אֹתוֹ 构成表示存在或持有的表达；“在他那里”既可表示耶和华的话临到或与以利沙同在，也保留“他有从耶和华来的话”的可能含义。
- source_word: דְּבַר יְהוָה
  choice: 耶和华的话
  rationale: 保留常见的先知性表达“耶和华的话”，既指来自耶和华的启示，也不把原文不定或确定的细微歧义过度限定。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经传统中对四字神名最通行、最易识别的音译“耶和华”。
- source_word: וַיֵּרְדוּ
  choice: 下到
  rationale: 保留 ירד 的向下移动含义；“下到他那里”在现代汉语中清楚表达他们前往先知所在之处。
- source_word: אֵלָיו
  choice: 他那里
  rationale: אֵלָיו 表示朝向“他”；与“下到”连用译作“他那里”自然，并明确以利沙是目的地。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 按现代中文常用方式简洁保留王的正式身份。
- source_word: וִיהוֹשָׁפָט
  choice: 约沙法
  rationale: 采用该人名在简体中文圣经中的通行译名。
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: 和以东王
  rationale: 保留原文三个并列主语的结构及以东王的正式身份。
theological_decisions:
- issue: דְּבַר יְהוָה 与以利沙的先知身份之关系
  choice: 译作“耶和华的话在他那里”，表示真实的神圣启示可从他那里得着。
  alternative: “他有从耶和华来的话”或“耶和华的话与他同在”。
  rationale: 原文的存在句可表达临在或持有。正文保留这种张力，不进一步断定以利沙当时已经领受了一则具体信息。
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代标准中文中最广为普通读者识别的专名形式，并明确呈现原文的神名，而非以“主”替代。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“耶和华的话”保留先知传统用语；“下到他那里”保留原文的方向性。脚注标记置于“说”之后，对应整句引语的另一种译法。
