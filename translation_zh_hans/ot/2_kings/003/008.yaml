base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: zh_hans
  text: 他问：“我们从哪条路上去？”他说：“走以东旷野的路[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“经由以东旷野。”
    reason: דֶּרֶךְ מִדְבַּר אֱדוֹם既可较具体地表达为“走以东旷野的路”，也可理解为说明行程所经的路线，即“经由以东旷野”。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他问／他回答
  rationale: אמר的连续叙事形式本义为“说”。根据直接引语在本节中的交际功能，分别自然地译为“问”和“回答”，既推进叙事，也不增添原文没有明说的人名。
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: 哪条路
  rationale: אֵי זֶה与“路”连用时，是询问在若干路线中选择哪一条；“哪条路”符合现代汉语习惯。
- source_word: נַעֲלֶה
  choice: 我们……上去
  rationale: עלה在行军或出行语境中可指“上去、进军”。译作“上去”保留原词的方向意味，又避免加入未明说的军事色彩。
- source_word: דֶּרֶךְ
  choice: 路
  rationale: 该词可指道路、路径或路线。“路”简洁自然，并在问句与答句中保持词汇呼应。
- source_word: מִדְבַּר אֱדוֹם
  choice: 以东旷野
  rationale: מִדְבָּר指人烟稀少的荒野地带，不一定是沙漠；“旷野”准确而符合圣经地理语境。אֱדוֹם按通行译名译为“以东”。
theological_decisions:
- issue: 两次“他说”的指代对象
  choice: 保留为两个未具名的“他”，并借“问／回答”呈现对话
  alternative: 明确译为“以色列王问／约沙法回答”
  rationale: 上下文可帮助读者判断说话者，但本节希伯来文本本身只使用第三人称单数形式，没有在此重述姓名；因此不在正文中明确补入人物身份，以保留原文的指代方式。
translation_notes:
  register: 采用现代、庄重而口语自然的叙事表达。“问／回答”避免机械重复“说”，同时不补出原文未明说的人名；“旷野”比“沙漠”更能涵盖该希伯来词的地理范围。
