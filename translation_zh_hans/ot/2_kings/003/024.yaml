base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: zh_hans
  text: 他们来到以色列的营地时，以色列人奋起击打摩押人；摩押人从他们面前逃跑。以色列人便进入其中[a]，继续击打摩押人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“进入那地”，也可能意为“攻入摩押境内”。希伯来文直译为“进入其中”；其中的阴性单数后缀很可能指那片土地或疆域，而不是直接指摩押人。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲנֵה
  choice: 营
  rationale: 在军事叙事中指军营；“营”简洁自然，并保留战场背景。
- source_word: וַיָּקֻמוּ
  choice: 起来
  rationale: 保留קום所表达的起身采取果断行动之意，不直接把它解释成“进攻”。
- source_word: וַיַּכּוּ
  choice: 击杀
  rationale: נכה在战争语境中表示击打、杀伤；“击杀”比“打败”更贴近具体行动，也不预先断定战役的最终结果。
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: 从他们面前逃跑
  rationale: 较直接地保留希伯来语“从……面前逃走”的表达，同时符合现代汉语。
- source_word: וַיָּבֹאוּ בָהּ
  choice: 进入其中
  rationale: בָּהּ的阴性单数后缀所指没有明说；“其中”保留原文的简约和一定歧义，脚注说明其很可能指那地或摩押境内。
- source_word: וְהַכּוֹת
  choice: 继续击杀
  rationale: 连词加不定式承接前面的叙事动词，表达伴随或持续进行的攻击；“继续击杀”在汉语中清楚体现其延续性。
- source_word: מוֹאָב
  choice: 摩押人
  rationale: 原文用国族名称“摩押”作集合称谓；汉语译为“摩押人”可自然表达参战群体，避免误解为击打一片土地。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。前两次“他们”按上下文分别指来犯并逃跑的摩押人；随后明说“以色列人”以避免主语转换造成混乱。末句保留原文后缀所指的含蓄性，并用脚注交代较可能的地理含义。
