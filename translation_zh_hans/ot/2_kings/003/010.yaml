base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: zh_hans
  text: 以色列王说：“唉！耶和华召来[a]这三个王，竟要把他们交在摩押手中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“呼叫”“召唤”；原文动词的字面意思是“呼叫、召唤”。
    reason: lexical_alternative
  - marker: b
    text: “交在摩押手中”是希伯来语惯用语，意思是“交在摩押的权势之下”。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 未另译连接词 וַ，以自然的现代汉语叙事承接上下文；动词仍明确引出以色列王的话。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 按希伯来语属格结构直译，并保留本节没有点明姓名的称号形式。
- source_word: אֲהָהּ
  choice: 哀哉！
  rationale: 表达惊惧、悲叹，语气庄重，且不流于口语化。
- source_word: כִּי
  choice: 竟是
  rationale: 这里承接感叹并引出以色列王对困境的悲观判断；“竟是”在自然汉语中兼顾其说明意味和惊愕语气，而不生硬添加“因为”。
- source_word: קָרָא
  choice: 召集
  rationale: 保留“呼召、召来”的基本词义，并贴合三王聚集同行的语境，不扩译为更强的神学解释。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，保留专名，不以“主”这一称号替代。
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: 这三个王
  rationale: 准确表达数词、定指和指示词，所指是上下文中的三王联盟。
- source_word: לָתֵת אֹתָם
  choice: 要把他们交在
  rationale: 表达不定式所表示的目的，并在中文中自然呈现把他们交付敌方权下的含义。
- source_word: בְּיַד מוֹאָב
  choice: 摩押手中
  rationale: 保留希伯来语“在……手中”的惯用表达及其经文色彩，实际含义是落入摩押的权势或控制之下。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 主
  rationale: 原文直接使用四字神名；中文采用通行音译“耶和华”，既作为专名呈现，也避免以称号“主”取代。
- issue: קָרָא 是指召集，还是泛指借护理使三王聚在一起
  choice: 召集
  alternative: 使……聚在一起
  rationale: 原动词本义是“呼叫、召来”；译文保留这一措辞，不把以色列王对事件的解释扩展成更明确的护理论陈述。
- issue: 以色列王是否在断言耶和华有意使三王战败
  choice: 保留其话语中的目的表述：“竟是要……”
  alternative: 淡化为结果：“以致……”
  rationale: לָתֵת 是目的性不定式；这是王在危机中的判断，译文应忠实保留其神学张力，而不把他的话改成中性的结果陈述。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“哀哉”保留悲叹力度；“竟是要”自然呈现王的惊惧和判断。脚注标记均紧随所说明的正文词语。
