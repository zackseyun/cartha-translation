  rationale: 修订使前后两个希伯来语谓语在汉语中各有对应：前者表达摩押人对联军彼此交战并遭毁灭的强烈推断，后者表达“各人击打其同伴”的相互军事行动。脚注保留强调结构的较形式化译法及其语义歧义，不将其限定为某一种神学或解释传统。
