  source_fidelity: “自相残杀，彼此击倒了”基本传达了摩押人的误判，但“自相残杀”已包含杀伤义，而“击倒”又弱于נכה在此军事语境中所表达的击杀，形成语义重复且力度不协调。改为“彼此相斗，互相击杀了”可分别对应前一强调性毁灭／交战判断和后一相互击打、击杀的陈述，同时不把争议性的强调结构僵化为单一字面解释。
  naturalness: 修订后的句子更符合现代汉语的叙事与战场呼喊节奏。“去夺取战利品吧”比“去抢掠吧”更准确表现לַשָּׁלָל所指向的战利品，且避免将其泛化为任何形式的抢劫。脚注标记移至所注词语之后，范围更清楚。
