base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: zh_hans
  text: 他们说：“这是血！众王一定已经彼此相斗[a]，互相击杀了。现在，摩押人哪[b]，去夺取战利品吧！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作：“众王已经彻底败亡了。”希伯来语用同根词的强调结构，意为“彻底毁坏／败亡”；按上下文，摩押人以为众王彼此相斗、互相攻击。
    reason: lexical_alternative
  - marker: b
    text: 原文作“摩押”，在这里用作呼语；也可译作：“摩押啊！”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: 这是血！
  rationale: 希伯来语为无系词的惊叹句；“这是血”保留指示词זֶה，并以感叹号传达突如其来的判断。
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: 一定是自相残杀
  rationale: 不定式绝对形与同根限定动词连用，表达强烈肯定。חרב的基本意象是遭毁坏、败亡；结合下句“彼此击倒”，这里是摩押人认定众王彼此争战而同归于败亡。“一定是自相残杀”在现代汉语中自然地表达其语境意义，同时以脚注保留较贴近形式的译法。
- source_word: הַמְּלָכִים
  choice: 众王
  rationale: 定冠词复数指前文组成联军的几位君王；“众王”简洁而庄重。
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: 彼此击倒了
  rationale: אישׁ את־רעהו表达相互动作；נכה在军事语境中可指击打、击杀或击倒。译作“彼此击倒”不把死亡程度说得超过原文，并与前句形成解释关系。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 标志从判断局势转入急切号召；“现在”符合现代汉语战场呼喊的节奏。
- source_word: לַשָּׁלָל
  choice: 去抢掠吧
  rationale: 介词ל带方向或目标意味，שׁלל指战利品或掳掠所得；“去抢掠吧”自然表达冲向敌营夺取战利品的号召。
- source_word: מוֹאָב
  choice: 摩押人哪
  rationale: 原文以国名“摩押”作呼语，实际召唤摩押军民；汉语用“摩押人哪”更自然，并以脚注说明原文形式。
