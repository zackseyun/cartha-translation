  rationale: 修订以“头生儿子”准确对应בְּכוֹר；调整献祭短语的语序，使“在城墙上”清楚表示献祭地点；并将“返回本国”改为“回到他们的土地”，避免引入现代国家概念或将联军的去向不必要地单一化。正文和脚注继续不判定“极大的愤怒”的来源或性质。
