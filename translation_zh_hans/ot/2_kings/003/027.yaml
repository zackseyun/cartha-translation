  text: וַ/יִּקַּח֩ אֶת בְּנ֨/וֹ הַ/בְּכ֜וֹר אֲשֶׁר יִמְלֹ֣ךְ תַּחְתָּ֗י/ו וַ/יַּעֲלֵ֤/הוּ עֹלָה֙ עַל הַ֣/חֹמָ֔ה וַ/יְהִ֥י קֶצֶף גָּד֖וֹל עַל יִשְׂרָאֵ֑ל וַ/יִּסְעוּ֙ מֵֽ/עָלָ֔י/ו וַ/יָּשֻׁ֖בוּ לָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: zh_hans
  text: 于是，他把自己的头生儿子，就是那将要接替他作王的，献上为燔祭，放在城墙上。随后，有极大的愤怒临到以色列[a]；他们便从他那里撤兵，回到他们的土地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文没有说明这“极大的愤怒”来自谁。有人认为这是上帝的震怒，有人认为是摩押人的激愤，也有人认为是这次献祭使以色列人惊惧沮丧。
    reason: 保留原文对愤怒来源与性质的歧义。
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: 他的长子
  rationale: בְּכוֹר指头生的儿子；现代汉语以“长子”自然表达其家族身份，并与下文的王位继承相呼应。
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: 那将要接替他作王的
  rationale: 保留该子是指定继承人的含义；“接替他作王”自然传达תַּחְתָּיו所表达的继位关系。
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: 献……作为燔祭
  rationale: 这是明确的献祭用语；“燔祭”保留עֹלָה的祭祀含义，也不淡化献人为祭的骇人事实。
- source_word: עַל הַחֹמָה
  choice: 在城墙上
  rationale: הַחֹמָה在此指城墙；补出“城”符合汉语习惯，也未增加实质信息。
- source_word: קֶצֶף גָּדוֹל
  choice: 极大的愤怒
  rationale: קֶצֶף可指烈怒、愤怒；此译保留强烈程度，同时不指明愤怒的主体或来源。
- source_word: עַל יִשְׂרָאֵל
  choice: 临到以色列
  rationale: עַל表示这愤怒以以色列为对象；“临到”既传达其针对性，又避免擅自说明愤怒来自谁。
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: 他们便从他那里撤兵
  rationale: נסע本义涉及拔营起行，在军事语境中译作“撤兵”最自然；“从他那里”保留原文代词，而不在正文中明说所指。
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: 返回本国
  rationale: 语境中的主语是联军；“返回本国”以自然汉语表达他们回到自己土地的含义。
theological_decisions:
- issue: “有极大的愤怒临到以色列”的来源和性质
  choice: 正文保留“极大的愤怒”这一未指明来源的说法。
  alternative: 明确译为上帝向以色列发怒、摩押人向以色列大发愤怒，或以色列人因献祭而惊惧沮丧。
  rationale: 希伯来文没有说明是谁发怒。各种解释分别涉及神的震怒、摩押人的激愤，或献祭对以色列军队造成的心理与军事影响；正文不应替读者裁定。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“燔祭”是普通圣经读者可识别的祭祀术语；句式力求清楚直接。脚注标记置于真正存在释义争议的“以色列”之后，而非置于“长子”之后。
