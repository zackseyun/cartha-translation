  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: zh_hans
  text: 他们拆毁城邑；每一块良田[a]，他们各自投上一块石头，把田地填满。他们堵塞所有水泉，砍倒所有好树[b]，直到在基珥·哈列设[c]只留下它的石头[d]。投石手包围那城，攻击它[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “良田”也可译作“好地”或“一块块好地”。希伯来语指划分出来的一块土地；在这里的农业毁坏语境中，可能指有价值或适宜耕作的土地。
    reason: lexical_alternative
  - marker: b
    text: 原文直译“好树”，可能指有价值或有出产的树，但并未明确限定为果树。
    reason: lexical_alternative
  - marker: c
    text: 基珥·哈列设是地名；在本段语境中，很可能是摩押的一座主要坚城。
    reason: cultural_note
  - marker: d
    text: 原文直译近于“直到在基珥·哈列设留下它的石头”。这里的句法较为压缩，主语也由前文复数转为单数；可理解为毁坏持续到该城只剩石头，或指在那里留下该城的石头。原文没有明确说“石墙”。
    reason: textual_ambiguity
  - marker: e
    text: “攻击”所译的希伯来语动词字面意思是“击打”或“击中”；在这里指对该城发动军事攻击。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: 他们拆毁各城
  rationale: עִיר可指城或城镇；הר这处具体指拆毁建筑和城防。“拆毁各城”自然并保留其具体动作。
- source_word: וְכָל חֶלְקָה טוֹבָה
  choice: 每一块肥沃的田地
  rationale: חֶלְקָה是划分出来的一块土地；农业毁坏的语境表明טוֹבָה指良好、出产丰盛的土地。“肥沃的田地”传达语境意义，脚注保留较宽泛的词义。
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: 人人都扔一块，直到把田地填满
  rationale: 保留אִישׁ אַבְנוֹ的逐人分配意味，并把阴性宾语后缀所回指的田地明说出来。“直到”表达反复投石造成填满土地的结果；原文形式也可直译为“并把它填满”。
- source_word: וְכָל מַעְיַן מַיִם יִסְתֹּמוּ
  choice: 他们堵住所有水泉
  rationale: מַעְיַן מַיִם指泉水或水源，סתם在此指堵塞。“堵住所有水泉”简洁清楚。
- source_word: וְכָל עֵץ טוֹב יַפִּילוּ
  choice: 砍倒所有佳木
  rationale: עֵץ טוֹב直译为“好树”，可能特指有价值或有出产的树，但原文没有限定为果树。“佳木”保留较宽的范围；יַפִּילוּ是使其倒下，在此自然译为“砍倒”。
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: 最后，只有基珥·哈列设还留下石墙
  rationale: 此句语法压缩且数有转换，重点是其他城邑遭毁后，基珥·哈列设的石造防御仍存。“石墙”按围城语境表达אֲבָנֶיהָ（字面“它的石头”）所指，但用脚注保留字面表达和句法歧义。
- source_word: הַקַּלָּעִים
  choice: 用投石索的士兵
  rationale: 该名词指战场上使用投石索的人。释义式表达比“投石兵”更易被普通现代读者准确理解，也避免误解为操作大型投石机的人。
- source_word: וַיָּסֹבּוּ ... וַיַּכּוּהָ
  choice: 包围那城，向它发起攻击
  rationale: סבב在这里指环绕、包围；נכה字面是“击打”，军事语境中表示攻击。“发起攻击”自然呈现对城发动袭击的意思，脚注注明字面义。
