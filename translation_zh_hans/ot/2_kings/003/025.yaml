translation_notes:
  register: 采用庄重而通顺的现代标准普通话。“佳木”略带书面色彩，但语义透明，能避免把原文过度限定为果树。地名写作“基珥·哈列设”，以间隔号显示复合音译。对于“留下石头”的压缩句法，正文按围城语境译为“留下石墙”，脚注明示字面形式与另一种可能理解，不把原文歧义隐藏起来。
