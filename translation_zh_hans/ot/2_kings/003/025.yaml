  to: 他们拆毁城邑；每一块良田[a]，他们各自投上一块石头，把田地填满。他们堵塞所有水泉，砍倒所有好树[b]，直到在基珥·哈列设[c]只留下它的石头[d]。投石手包围那城，攻击它[e]。
  rationale: 修订删除无明示根据的“石墙”，以“只留下它的石头”保留希伯来文的具体词汇和压缩句法，并在脚注中说明可行理解而不强定其一。又将“投石—填满”恢复为原文的并列叙述。其余用语调整为更直接的现代普通话，同时保留地名、军事术语和词义范围。
