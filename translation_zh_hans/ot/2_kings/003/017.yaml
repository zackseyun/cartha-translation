  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: zh_hans
  text: 因为雅威如此说：“你们不会看见风，也不会看见雨；但那条溪谷[a]必被水充满，你们和你们的畜群、牲口都必喝这水。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “溪谷”也可译作“河谷”或“干河床”。希伯来语 נחל 常指季节性水道，平时可能没有流水。
    reason: 说明 נחל 的地理词义及其可能译法。
lexical_decisions:
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，避免用称号替代，也不采用“耶和华”这一传统拼读。
- source_word: כִּי כֹה אָמַר
  choice: 因为……如此说
  rationale: 既保留כִּי承接上文的解释作用，也保留先知宣告的庄重格式。
- source_word: לֹא תִרְאוּ רוּחַ וְלֹא תִרְאוּ גֶשֶׁם
  choice: 你们看不见风，也看不见雨
  rationale: 两个未完成式在语境中指将发生的事；רוּחַ与“雨”并列，明确指自然界的风。重复“看不见”保留原文平行结构。
- source_word: הַנַּחַל הַהוּא
  choice: 那条溪谷
  rationale: נחל在干旱地区常指季节性水道或通常无水的河谷；“溪谷”较自然，并由脚注说明其地理含义。
- source_word: יִמָּלֵא מָיִם
  choice: 必充满水
  rationale: 保留尼法勒式的结果状态，并用“必”表达此处应许的将来确定性。
- source_word: מִקְנֵיכֶם וּבְהֶמְתְּכֶם
  choice: 你们的牲畜和其他动物
  rationale: מִקְנֶה指归人所有的畜群，בְּהֵמָה是更宽泛的动物用语；加“其他”使中文避免把两者误读为完全同义，同时不武断限定为役畜。
- source_word: וּשְׁתִיתֶם
  choice: 都必有水喝
  rationale: 中文用结果式表达比逐字译作“都必喝”自然，也清楚表明水将供人和动物饮用。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近通常重构的希伯来语读音，并保留其作为专名的性质，不以称号代替。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留“看不见风／看不见雨”的平行句式，以及“牲畜／其他动物”的词义区分；标点仅用于使宣告与结果层次清楚。
