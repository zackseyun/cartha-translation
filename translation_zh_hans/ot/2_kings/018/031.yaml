  source_fidelity: “向我求和”把行动主体表述为犹大一方的乞和，较原文“与我讲和／同我缔结和约”更强；“归向我”也超过了“出来到我这里来”的明示动作。应以较中性的中文保留围城语境所隐含而未明说的投降意味。其余内容，包括“各人”、葡萄树和无花果树以及水窖，基本忠实于希伯来文。
  naturalness: “与我讲和，出来到我这里来”是自然、庄重的现代汉语，也保留了命令式宣传言辞的直接性。将后续三个动词译为“各人要……”能清晰反映原文连续的命令／许诺式表达，无须加入“这样，你们就可以”的推论关系。
  terminology: “希西家”“亚述王”“无花果树”“水窖”均合宜。“讲和”在此比“求和”更准确地表达עֲשׂוּ אִתִּי בְרָכָה这一政治习语；脚注保留其不寻常的“祝福”字面措辞及其和约含义。
