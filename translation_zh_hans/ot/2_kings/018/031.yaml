source:
  edition: WLC
  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר מֶ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵֽנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵֽי בוֹרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: zh_hans
  text: “不要听希西家的话，因为亚述王这样说：‘你们要与我讲和[a]，出来到我这里来；各人要吃自己葡萄树和无花果树的果子，喝自己水窖里的水。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“与我做一个祝福”，这是表示讲和或达成协议的习语。
    reason: 保留原文不寻常的字面表达，并说明其在本节政治语境中的含义。
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: 听……的话
  rationale: שׁמע与אֶל连用可表示“听从、理会”。“听……的话”在现代汉语中既保留“听”的直接意义，也自然包含听从之意。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: כִּי כֹה אָמַר מֶלֶךְ אַשּׁוּר
  choice: 因为亚述王这样说
  rationale: 直接保留引出宣告的希伯来语公式，同时符合现代汉语表达。
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: 你们要向我求和
  rationale: 该短语字面涉及“祝福”，在围城劝降的语境中是要求对方议和、接受条件。“求和”自然传达其政治含义；字面形式保留在脚注中。
- source_word: וּצְאוּ אֵלַי
  choice: 出来归向我
  rationale: 保留יצא“出来”的具体动作，也以“归向我”表达אֵלַי的方向性；不在正文中直接增译为“投降”，以免消除原文较含蓄的措辞。
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: 各人吃自己葡萄树和无花果树的果子
  rationale: “各人”体现אִישׁ的分配用法；补出“果子”符合汉语搭配，因为所吃的是树上的出产，而不是树本身。
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: 各人喝自己水窖里的水
  rationale: בּוֹר在此指储水的窖池，而非天然泉水或一般水井；“水窖”准确且易懂。
theological_decisions:
- issue: 分配用法的阳性名词אִישׁ反复出现
  choice: 各人
  alternative: 每个男人
  rationale: אִישׁ在这里用于逐一分配，并非特别强调只限男性。“各人”在汉语中准确传达其代表性和分配意义，同时避免不自然地强化生理性别。
- issue: 政治性习语עֲשׂוּ אִתִּי בְרָכָה
  choice: 向我求和
  alternative: 与我立约／与我达成协议
  rationale: 上下文是亚述王借使者提出有利条件，要求城中居民出来归顺。“求和”传达其语用效果，却不把“出来”直接解释成“投降”；原文异常的“祝福”措辞另见脚注。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。引语层次以中文单双引号区分；用“这样，你们就可以”表达命令之后所承诺的结果，但不把亚述使者的宣传承诺当作叙述者的认可。
