base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/008.yaml
  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: zh_hans
  text: 他攻打非利士人，直到迦萨和迦萨所属的地区[b]，从守望楼直到坚固城[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从守望楼直到坚固城”，意思是从最小的守卫据点到有坚固防御的城邑。
    reason: cultural_note
  - marker: b
    text: 或译“和迦萨的边界”。这里的希伯来词既可指边界线，也可指一座城所属的地区。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: 他
  rationale: 保留希伯来文显明的主语代词，承接上下文中的希西家，并体现叙事中的强调。
- source_word: הִכָּה
  choice: 攻打
  rationale: נכה 可表示击打，也可用于军事攻击；“攻打”自然贴合此处战事语境，同时不把结果过度明确为彻底击败。
- source_word: פְּלִשְׁתִּים
  choice: 非利士人
  rationale: 采用现代中文圣经及历史语境中通行的族名。
- source_word: עַד עַזָּה
  choice: 直到迦萨
  rationale: עַד 表示行动所达到的范围；“直到”简洁自然。
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: 和属迦萨的地区
  rationale: גְּבוּל 可指边界，也可指辖属地域；正文依语境采用地域义，并以注释保留“边界”的可能。
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: 从守望楼
  rationale: מִגְדַּל נוֹצְרִים 直指供守望者使用的塔楼；用“守望楼”简明保留原文单数形式。
- source_word: עַד עִיר מִבְצָר
  choice: 直到设防城
  rationale: עִיר מִבְצָר 指具有防御工事的城；“设防城”准确、凝练，并与“守望楼”构成范围表达。
theological_decisions: []
