  register: 采用现代、庄重而易懂的叙事语言。“攻打”保留军事行动本身，不强行断定战果；“属迦萨的地区”在正文中表达较可能的地域义，同时借脚注保留原文词义歧义。脚注标记按相关词语就近安放。
