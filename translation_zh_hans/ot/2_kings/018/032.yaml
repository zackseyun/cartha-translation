revisions:
- from: 直到我来，把你们带到一个像你们本土一样的地方[a]，一个盛产五谷和新酒、饼和葡萄园、橄榄油和蜂蜜的地方，使你们可以活着，不至死亡。不要听希西家的话，因为他诱导你们说：“雅威必救我们。”
  to: 直到我来，把你们带到一片与你们本土相似的土地[a]，那里盛产谷物和新酒、面饼和葡萄园、橄榄油和蜂蜜；这样你们就可以活下去，不至于死。不要听希西家的话，因为他对你们说‘雅威必救我们’，是在诱导你们。
  rationale: 修订将“雅威必救我们”明确为希西家借以诱导百姓的言语内容，消除原译的句法歧义和角色倒置；并以“土地”对应 אֶרֶץ、“谷物”对应泛称的 דָּגָן。其余清单、劝诱口吻和神名译法均予保留。
