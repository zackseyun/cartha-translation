source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: zh_hans
  text: 直到我来，把你们带到一片与你们本土相似的土地[a]，那里盛产谷物和新酒、面饼和葡萄园、橄榄油和蜂蜜；这样你们就可以活下去，不至于死。不要听希西家的话，因为他对你们说‘雅威必救我们’，是在诱导你们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“像你们土地一样的土地”。这里指将要迁往之地与他们自己的故土相似。
    reason: 说明希伯来文重复“土地”并保留比较关系；正文用自然汉语表达。
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: 直到我来
  rationale: 保留“直到”所标明的未来时点，并以自然直接的现代汉语表达 בוא。
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: 把你们带到
  rationale: לקח 基本义为“取、带走”；结合流放语境，“带到”既交代迁移，也避免添加原文未明说的强烈措辞。
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: 到一个像你们本土一样的地方
  rationale: 保留 כְ 的比较意义；“本土”体现对听众故土的指称，并传达劝降言辞中的诱人承诺。
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: 一个盛产五谷和新酒……的地方
  rationale: דגן 泛指谷物，译作“五谷”；תירוש 特指新酿或新出的酒，译作“新酒”。汉语用“盛产”自然表达反复出现的“某物之地”。
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: 饼和葡萄园
  rationale: 保留 לחם 的具体意象“饼”，也保留 כרמים 所指的“葡萄园”，不泛化为食物或葡萄。
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: 橄榄油和蜂蜜
  rationale: זֵית יִצְהָר 是涉及橄榄及其油的紧缩结构；按整体语义译作“橄榄油”，避免生硬地拆成额外并列项。
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: 使你们可以活着，不至死亡
  rationale: 在语境中表达劝诱所许诺的结果或目的，同时保留“活”与“死”的鲜明对照。
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: 不要听希西家的话
  rationale: שמע אל 在此意为听从；现代汉语加“的话”更自然，且没有把意义过度收窄为正式服从。
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: 因为他诱导你们说
  rationale: Hiphil 形式 יַסִּית 可表示引诱、煽动或误导；“诱导”保留说话者对希西家劝说行为的负面定性，又不武断判定其为欺骗。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译直接呈现四字神名，而不以称号代替。
- source_word: יַצִּילֵנוּ
  choice: 必救我们
  rationale: נצל 的 Hiphil 在军事危难语境中表示解救；“救”简洁自然，“必”体现未完成式在引语中的确信语气。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译作“雅威”保留专名性质，不用称号替换，也避免把传统音译当作原始读音。
- issue: 亚述使者对希西家言论的定性
  choice: 诱导
  alternative: 误导；欺骗；煽动
  rationale: סות 的使役式语义范围较宽。采用“诱导”保留其负面劝引色彩，不替说话者断定希西家的话客观上必为虚假。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“盛产”将原文连续三次“……之地”的结构合并为汉语易懂的列举，同时保留五谷、新酒、饼、葡萄园、橄榄油和蜂蜜等全部意象。引语保持亚述使者的宣传和施压口吻。
