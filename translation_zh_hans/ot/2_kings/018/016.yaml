  text: בָּ/עֵ֣ת הַ/הִ֗יא קִצַּ֨ץ חִזְקִיָּ֜ה אֶת דַּלְת֨וֹת הֵיכַ֤ל יְהוָה֙ וְ/אֶת הָ/אֹ֣מְנ֔וֹת אֲשֶׁ֣ר צִפָּ֔ה חִזְקִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַֽ/יִּתְּנֵ֖/ם לְ/מֶ֥לֶךְ אַשּֽׁוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: zh_hans
  text: 那时，犹大王希西家把耶和华的殿中他曾加以包覆的门和门柱[a]都砍下，交给了亚述王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“门框”或“柱子”；这个希伯来词很少见，也可能泛指与殿门相连的支撑构件。
    reason: 保留罕见建筑术语 הָאֹמְנוֹת 的词义不确定性。
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 这是叙事中常见的时间短语；“那时”简洁、自然，并保留其承接上下文的作用。
- source_word: קִצַּץ
  choice: 砍下来
  rationale: 该动词表示砍断、削去；“砍下来”保留具体而强烈的拆除动作，也符合将殿门及其构件取下作为贡物的语境。
- source_word: דַּלְתוֹת
  choice: 门
  rationale: 该词通常指门或门扇；现代汉语用“门”最清楚自然。
- source_word: הֵיכַל יְהוָה
  choice: 耶和华殿
  rationale: הֵיכָל 在此明确指耶路撒冷圣殿；将神名 יְהוָה 音译为“耶和华”，保留专名性质。
- source_word: הָאֹמְנוֹת
  choice: 门柱
  rationale: 这是罕见的建筑术语，可能指门柱、门框或相关支撑构件；正文采用与“门”搭配自然的“门柱”，并以脚注保留词义的不确定性。
- source_word: צִפָּה
  choice: 包覆过
  rationale: 该动词指在表面包覆或镶覆材料，常涉及金属；“包覆”不擅自补出本节原文未明说的材料。
- source_word: וַיִּתְּנֵם
  choice: 把它们交给了
  rationale: 在向亚述王缴纳贡物的语境中，“交给”比单纯“给”更自然，同时不额外解释其政治性质。
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: 给了亚述王
  rationale: 准确表达“给亚述之王”，符合现代汉语对君王称谓的习惯。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者广泛熟悉的专名“耶和华”，而不以称号“主”替代，从而保留其圣约专名的性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将较长的希伯来句子分为两句，以避免“希西家”重复造成汉语结构累赘，同时清楚保留包覆者是犹大王希西家、交付对象是亚述王。
