  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: zh_hans
  text: 犹大王希西家就派人去见在拉吉的亚述王[a]，说：“我有罪了。请从我这里撤退。无论你加给我什么[b]，我都愿意承担。”于是，亚述王规定犹大王希西家须缴纳三百他连得[c]银子和三十他连得金子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“派人到拉吉去见亚述王”。希伯来语的形式可表示朝拉吉而去；但在这里较可能说明亚述王当时所在的地方。
    reason: lexical_alternative
  - marker: b
    text: 或译：“无论你把什么负担放在我身上，我都愿意背负（或缴纳）。”原文以“承担、背负”表达接受所规定的负担或贡赋。
    reason: lexical_alternative
  - marker: c
    text: “他连得”是古代重量单位，实际重量因时代和地区而有所不同。
    reason: historical_measure
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人
  rationale: 在这段叙事中，动词表示差派使者；中文若只说“派”，宾语不完整，因此用“派人”，而后面的直接引语交代了所传的信息。
- source_word: לָכִישָׁה
  choice: 到拉吉去见
  rationale: 词尾的方向标记通常表示朝向拉吉。译成“到拉吉去见亚述王”既贴近该形态，也自然表达亚述王当时在拉吉；另一种句法理解列入脚注。
- source_word: חָטָאתִי
  choice: 我有罪了
  rationale: חטא是“犯罪、犯错”的常用词。政治交涉语境可使其具有“我错了、我得罪你了”的意味，但正文保留其较强的道德用语，不把含义缩窄为纯粹外交失误。
- source_word: שׁוּב מֵעָלַי
  choice: 请从我这里撤退
  rationale: 该短语字面上是“从我身上转回去”，在军事压力的语境中指撤回、停止进逼；“从我这里撤退”自然且不过度增添具体军事行动。
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: 无论你加给我什么
  rationale: נתן על描写把某种负担加在某人身上。正文保留宽泛措辞，不预先限定为贡金或罚款。
- source_word: אֶשָּׂא
  choice: 我都愿意承担
  rationale: נשא本义为“背负、承担”。此处实际涉及缴付所规定的负担，但“承担”保留原文意象和范围。
- source_word: וַיָּשֶׂם ... עַל
  choice: 规定……须缴纳
  rationale: 这里表示把具体的银、金数额加在希西家身上，即核定并征收贡赋。中文用“规定……须缴纳”清楚交代其实际含义。
- source_word: כִּכַּר
  choice: 他连得
  rationale: 这是古代重量单位的传统音译。因其实际重量会随时代和地区而异，不在正文中换算为现代重量。
- source_word: כֶּסֶף / זָהָב
  choice: 银子 / 金子
  rationale: 原文明确指按重量计算的银与金，而非泛指货币。
theological_decisions:
- issue: 希西家认错用语的道德分量
  choice: 我有罪了
  alternative: 我错了；我得罪你了
  rationale: 原文使用通常表示“犯罪”的חטא，但在宗主政治交涉中也可表示承认冒犯或叛逆。正文保留较强语义，脚注说明语境化译法，避免把它限定为对上帝认罪或仅仅外交失策。
- issue: 所加负担的性质
  choice: 无论你加给我什么，我都愿意承担
  alternative: 无论你征收多少贡金，我都愿意缴纳
  rationale: 原文先用宽泛的“加给、承担”，随后才说明银金数额。保留这一推进，不提前将其明确限定为贡金或罚款。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我有罪了”保留原文的强烈措辞，“撤退”“须缴纳”则使军事和贡赋语境清楚。正文中的[a]、[b]、[c]均与脚注对应。
