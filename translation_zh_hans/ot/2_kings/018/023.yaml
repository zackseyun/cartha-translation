base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: zh_hans
  text: 现在，请你同我主——亚述王——打个赌吧[a]！我就给你两千匹马，如果你能为自己配备骑手骑在它们上面。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “打个赌”也可译作“同我主作个约定”或“同我主订立协议”。这里的希伯来语动词可以指达成约定或以自己作担保；结合上下文，很可能指带着嘲讽意味的赌约或挑战。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: 请你……打个赌吧
  rationale: 该动词在此嘲讽性的外交语境中，不只是一般的约定，更带有下注挑战之意；加上“请……吧”保留 נָא 表面的礼貌语气，也传达反讽。
- source_word: אֶת אֲדֹנִי אֶת מֶלֶךְ אַשּׁוּר
  choice: 跟我主亚述王
  rationale: אֶת 在这里随 התערב 表示共同参与的一方，译为“跟”；“我主”指说话者的君王，不是神圣称号，“亚述王”自然简洁。
- source_word: וְאֶתְּנָה לְךָ
  choice: 我可以给你
  rationale: 此处是挑战中的提议；“可以给你”比单纯的将来式更自然地表现说话者提出条件的口吻。
- source_word: אַלְפַּיִם סוּסִים
  choice: 两千匹马
  rationale: 直接保留原文数目和名词。
- source_word: אִם תּוּכַל
  choice: 只要你能
  rationale: 原文 אִם 表条件；本句是在讥讽对方无力配备骑手，现代汉语用“只要你能”能自然连接前面的提议，同时保留挑战意味。
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: 为自己找出骑手来骑它们
  rationale: 较直译为“给自己安排骑手在它们上面”；“为自己找出骑手来骑它们”在现代汉语中自然，并保留 לְךָ 的受益指向以及“骑在其上”的具体含义。
theological_decisions: []
