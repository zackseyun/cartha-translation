base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: zh_hans
  text: 拉伯沙基对他们说：“请你们对希西家说：‘大王、亚述王如此说：你所倚仗的这份把握，究竟是什么？’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 保留这一亚述宫廷头衔的传统音译，避免将其职能过度限定为某一种现代官职。
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: 大王
  rationale: 准确传达亚述君王自称中的尊号语气，同时符合简洁庄重的汉语表达。
- source_word: הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: 你所倚仗的这份把握
  rationale: 用“把握—倚仗”体现原文同根词重复所形成的修辞关联，并保留其带有质问和轻蔑色彩的含义。
theological_decisions:
- issue: 质问对象所倚仗的具体内容
  choice: 不补明是埃及、军事力量或耶和华
  alternative: 明确译作“你倚靠的究竟是谁/什么”
  rationale: 本节原文只泛指“这份把握”，具体所指在后文展开；译文保留此处的开放性，不提前解释。
translation_notes:
  register: 采用现代、庄重而自然的叙事与外交宣告语体；引语层次清晰。“请”保留נָא的礼貌语气，但整句仍呈现使者居高临下的口吻。
