base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: zh_hans
  text: 但如果你们对我说：‘我们倚靠耶和华我们的神’，他不就是那位吗？希西家拆除了他的丘坛和祭坛，又对犹大和耶路撒冷说：‘你们要在耶路撒冷这座祭坛前敬拜。’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטָחְנוּ
  choice: 我们倚靠
  rationale: 表达完成式在引语中的现时信赖状态；“倚靠”自然且保留宗教语境中的信靠意味。
- source_word: בָּמוֹתָיו
  choice: 他的丘坛
  rationale: במות指设于高处或地方性的祭祀场所；译作“丘坛”比笼统的“高处”更明确，并保留其作为祭祀设施的含义。
- source_word: מִזְבְּחֹתָיו
  choice: 他的祭坛
  rationale: 直译所属关系。这里是亚述使者误将希西家拆除的地方祭坛理解为属于耶和华，故不替说话者纠正。
- source_word: תִּשְׁתַּחֲווּ
  choice: 你们要……敬拜
  rationale: 该词本义为俯伏，在祭坛语境中指敬拜；中文用“敬拜”自然清楚。
- source_word: לִפְנֵי הַמִּזְבֵּחַ הַזֶּה
  choice: 在这座祭坛前
  rationale: 保留介词“在……前”及指示词“这座”，不扩展为“只在”。
theological_decisions:
- issue: 亚述使者对希西家宗教改革的描述
  choice: 按说话者的措辞保留“他的丘坛和祭坛”
  alternative: 解释为“献给耶和华的丘坛和祭坛”或指出这些是非法敬拜场所
  rationale: 原文呈现拉伯沙基的论证及其误解或讥讽，并未在本节中加以纠正；译文不应替叙述者解决这一张力。
- issue: 耶路撒冷祭坛的排他性
  choice: 译作“你们要在耶路撒冷这座祭坛前敬拜”
  alternative: 译作“你们只能在耶路撒冷这座祭坛前敬拜”
  rationale: 语境暗示敬拜集中于耶路撒冷，但希伯来文本没有明示“只”；因此不把隐含的排他性写入正文。
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用现代简体中文圣经语域中普通读者最熟悉的专名形式，同时将其与一般称号“神”区分。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留拉伯沙基反问的讥讽语气和神学误判，不在译文中补充解释。将原文连续的关系从句与“说”调整为中文较清楚的两句；“希西家还吩咐”明确第二个动词的主语，所表达的仍是原文同一人的连续行动。
