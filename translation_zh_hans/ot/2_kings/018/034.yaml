language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: zh_hans
  text: 哈马和亚珥拔的神在哪里？西法瓦音、希拿和以瓦[a]的神在哪里？它们救了撒玛利亚脱离我的手吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “以瓦”的音译也有作“伊瓦”或“亚瓦”的。
    reason: 专名 עִוָּה 在不同译名传统中有不同音译。
lexical_decisions:
- source_word: אַיֵּה
  choice: 在哪里
  rationale: 这是询问所在之处的疑问词；重复译出，以保留说话者讥诮式的反问。
- source_word: אֱלֹהֵי
  choice: ……的神
  rationale: 原文为“神”的复数构造形式，指各城所敬奉的神祇。现代汉语以集合性的“……的神”表达更自然，也不预先断定每城神祇的具体数目。
- source_word: חֲמָת וְאַרְפָּד
  choice: 哈马和亚珥拔
  rationale: 按现代中文圣经中较通行的地名音译处理。
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: 西法瓦音、希拿和以瓦
  rationale: 均按专名音译；עִוָּה 的音译传统不一，因此在脚注中保留异译信息。
- source_word: כִּי הִצִּילוּ
  choice: 它们救了……吗
  rationale: כִּי 在这里衔接前面的讥诮，并引出反问；译成直接问句符合现代汉语。הִצִּילוּ 表示从危险或控制中救出。代词“它们”回指前述诸神。
- source_word: שֹׁמְרוֹן
  choice: 撒玛利亚
  rationale: 采用通行中文地名。
- source_word: מִיָּדִי
  choice: 脱离我的手
  rationale: 保留原文“从我的手中”的具体权势意象；“脱离我的手”在现代汉语中清楚自然。
theological_decisions:
- issue: 说话者对异族神祇的挑战所表达的含义
  choice: 保留为亚述王的夸口：前述诸神未能使撒玛利亚脱离他的控制。
  alternative: 把末句泛化为对所有民族神祇的笼统嘲讽。
  rationale: 原文明列若干地方的神，随即反问它们是否救了撒玛利亚。译文保留这种修辞关系，不借此断言或否定这些神祇的真实存在及能力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。两个“在哪里”保留原文反复讥诮的语势；末句使用直接反问。所有地名采用简体中文中较通行的圣经音译。
