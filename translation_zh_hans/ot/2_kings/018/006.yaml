base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: zh_hans
  text: 他紧紧依附雅威[a]，未曾放弃跟随他；又谨守雅威吩咐摩西的诫命。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “紧紧依附”也可译作“紧紧持守”或“紧紧跟随”；此动词在盟约语境中表达坚定的忠诚。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק בַּיהוָה
  choice: 紧紧跟随雅威
  rationale: דבק 的基本意象是紧贴、紧紧依附；在盟约语境中表示坚定不移的归属与忠诚。“紧紧跟随”在现代汉语中自然，并与下句“不偏离他”相衔接。
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: 不偏离他
  rationale: סור מן־אחרי 表示不再跟随或偏离所追随者；“不偏离他”简洁保留了持续忠诚的含义。
- source_word: וַיִּשְׁמֹר מִצְוֺתָיו
  choice: 谨守……的诫命
  rationale: שׁמר 与“诫命”连用时意为遵守、持守；“谨守”符合汉语圣经法律与盟约语域，也表达认真遵行。
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: 雅威吩咐摩西的
  rationale: 关系从句修饰“诫命”，表明这些诫命是雅威吩咐摩西的；汉语采用前置定语更自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现四字神名，以通行的现代汉语音译“雅威”保留其专名性质。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名；译作“雅威”直接保留以色列之神的盟约专名，不以称号替代。
- issue: דבק 的盟约含义
  choice: 紧紧跟随
  alternative: 紧紧依附；持守
  rationale: 该词兼有依附和忠诚的意味；“紧紧跟随”既保留关系性的力度，也避免额外加入原文未明说的神学术语。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。以“紧紧”表达 דבק 的强烈程度，以“谨守诫命”维持申命记史书常见的盟约与律法语域；代词“他”按现代简体中文常规书写，不使用特殊尊称字形。
