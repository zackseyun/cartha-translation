base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: zh_hans
  text: 亚述王把以色列[a]流放到亚述，把他们安置在哈腊、歌散的哈博河边[b]，以及米底人的各城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“以色列”指北国以色列及其被流放的人。
    reason: cultural_note
  - marker: b
    text: 原文直译为“哈博，歌散的河”；此语进一步标明哈博这条河与歌散的关联。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: 掳到
  rationale: 该动词的使役式在这里指强制迁徙、流放。“掳到”既体现非自愿性质，也自然衔接目的地“亚述”。
- source_word: אֶת יִשְׂרָאֵל
  choice: 以色列
  rationale: 原文以国家整体为受词，指北国及其被掳的人民；保留“以色列”可维持其政治共同体含义，而不改写为单指个体的“以色列人”。
- source_word: אַשּׁוּרָה
  choice: 到亚述
  rationale: 词尾的方向形式表达朝向亚述的移动，译作“到亚述”简明自然。
- source_word: וַיַּנְחֵם
  choice: 把他们安置在
  rationale: 此处使役用法表示让被掳者住在指定地点；“安置”符合帝国迁徙人口的语境，又不额外暗示他们自愿定居。
- source_word: בַּחְלַח
  choice: 在哈腊
  rationale: 作为地名音译，并用介词“在”表达安置地点。
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: 歌散的哈博河边
  rationale: “哈博”由后面的“歌散之河”进一步说明；因其为河流，地点介词在汉语中自然表达为“河边”。脚注保留原文结构可能产生的另一种表述。
- source_word: וְעָרֵי מָדָי
  choice: 以及米底人的各城
  rationale: 直译该属格结构，保留“米底”既可指民族、也与其地域相关的表达，不直接改写为“米底地区”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“掳到”突出强制流放，“安置”则准确表达被迁徙者被安排居住在指定地点。地名依常见中文形式音译；正文保持原文将“哈博”与“歌散河”相联的结构，并以脚注提示另一种自然理解。
