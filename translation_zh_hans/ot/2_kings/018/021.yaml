revisions:
- from: 看哪，你所倚靠的埃及，不过是这根折断的芦苇杖[a]；人若倚在上面[b]，它就会刺进他的手掌，把手掌刺穿。埃及王法老对所有倚靠他的人，正是这样。
  to: 看哪，你倚靠的是埃及，就是这根折断的芦苇杖[a]；人若倚在上面[b]，它就会刺入他的手掌，刺穿手掌。埃及王法老对所有倚靠他的人，正是这样。
  rationale: 以“就是”替代“不过是”，避免增添原文未明示的限制性语气，同时清楚表达埃及与折断芦苇杖的比喻同位关系。微调刺伤句的措辞，使现代汉语更流畅，且保留原文“刺入／刺穿”的连续意象。脚注标记及内容均完整保留。
