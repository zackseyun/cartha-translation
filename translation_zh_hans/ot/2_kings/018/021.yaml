  text: עַתָּ֡ה הִנֵּ֣ה בָטַ֣חְתָּ לְּ/ךָ֡ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: zh_hans
  text: 看哪，你倚靠的是埃及，就是这根折断的芦苇杖[a]；人若倚在上面[b]，它就会刺入他的手掌，刺穿手掌。埃及王法老对所有倚靠他的人，正是这样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “折断”也可译作“压伤”或“压碎”。这个希伯来词可表示受压、受伤或破裂；这里的芦苇不仅不能支撑人，反而会裂开伤手。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“一个人倚在上面”，这里的阳性单数是泛指。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ עַל מִצְרַיִם
  choice: 你所倚靠的埃及
  rationale: בטח表示信赖、依靠；这里指当前把埃及当作政治与军事依靠。中文用“倚靠”也与下文身体倚杖的意象形成自然呼应。
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: 折断的芦苇杖
  rationale: מִשְׁעֶנֶת指供人倚靠之物，译作“杖”切合比喻；רָצוּץ可指压伤、压碎或折断，此处该杖会裂开伤手，“折断”最清楚。
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: 人若倚在上面
  rationale: Nifal动词יִסָּמֵךְ表示倚靠以获得支撑；关系从句在语境中含条件意味。אִישׁ为泛指单数，中文“人若”自然保留其普遍性。
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: 它就会刺进他的手掌，把手掌刺穿
  rationale: כַּף在此具体指手掌；בוא描写芦苇进入手掌，נקב表示刺穿。译文保留先刺入、再刺穿的递进画面，并明确后缀所指。
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: 埃及王法老……正是这样
  rationale: כֵּן明确把法老与伤人的断芦苇相比较；将比喻结论置于句末，符合现代汉语表达，同时保留原文判断。
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: 对所有倚靠他的人
  rationale: 介词לְ表达法老对于倚靠者而言是什么；分词הַבֹּטְחִים概括所有持续以他为依靠的人。
theological_decisions: []
