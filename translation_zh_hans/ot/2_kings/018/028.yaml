base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: zh_hans
  text: 于是，拉伯沙基站立，高声用犹大语[a]呼喊，说：“你们要听大君王、亚述王的话！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“用希伯来语”。原文所用的词更具体地指犹大地区的语言。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: 站着
  rationale: 按叙事顺序直译 עמד；“站着”自然清楚，不额外加入“站起来”或“站定阵脚”的含义。
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 保留亚述官衔的传统音译，符合本段把它作为特定人物称号使用的方式；若径译为某一具体官职，可能过度确定其职能。
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: 高声喊叫
  rationale: 自然表达公开大声呼喊的动作，同时保留 קרא 与“洪亮声音”所传达的力度。
- source_word: יְהוּדִית
  choice: 用犹大语
  rationale: 该词特指犹大地区或犹大国所用的语言，较笼统的“希伯来语”更贴近历史语境。
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: 他开口说
  rationale: 希伯来文连用“讲说”和“说”；中文以“开口说”自然体现双重引语公式，而不生硬重复。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 明确表达复数命令式，并保持使者公开宣告的庄重语气。
- source_word: דְּבַר
  choice: 话
  rationale: 这里指君王正式发布的言辞；“话”在现代中文中自然，也仍能保持正式宣告的意味。
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: 这位大君王
  rationale: 直译亚述王室称号“大王”；用“这位大君王”既保留 titulary 的夸张庄严，也使与后置同位语“亚述王”的关系自然。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 简洁、正式地表达“亚述的王”，符合现代汉语圣经叙事习惯。
