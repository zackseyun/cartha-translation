base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: zh_hans
  text: 他们呼叫王；希勒家的儿子以利亚敬，就是王宫总管[a]，出来见他们；同来的还有书记舍伯那[b]和亚萨的儿子、史官约亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “王宫总管”原文直译为“管理那家（或宫室）的人”，是一个行政职衔。
    reason: cultural_note
  - marker: b
    text: “书记”也可译作“秘书”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: 他们向王呼喊
  rationale: קרא与אֶל连用，直指“向……呼喊”。上下文虽可能含有请王出面的意思，但原文未使用明确表示召见的动词，因此保留较宽的表达。
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: 出来见他们
  rationale: יצא表示“出来”，אֶל表示朝向对方；“出来见他们”符合城上官员出面交涉的场景，也比单纯“到他们那里去”自然。
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: 希勒家的儿子以利亚敬
  rationale: 按现代中文圣经人名的通行音译处理，并保留希伯来父子称谓结构。
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: 就是王宫总管
  rationale: 这是宫廷行政职衔，字面为“管理那家/宫室的”；在王国叙事中译作“王宫总管”既自然，又传达其官职性质。
- source_word: הַסֹּפֵר
  choice: 书记
  rationale: סֹפֵר在此指宫廷文书官；“书记”兼顾传统用语和行政职能，不把职位过度具体化为现代秘书。
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: 亚萨的儿子、史官约亚
  rationale: 保留父子关系，并按中文自然次序将职衔置于名字之前；顿号标明“亚萨的儿子”与“史官”共同修饰约亚。
- source_word: הַמַּזְכִּיר
  choice: 史官
  rationale: 该词指负责记录、备忘或奏报的王室官员；“史官”是简洁且为中文读者熟悉的对应语，但不限定其全部职责。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。人名沿用简体中文圣经常见译名；官职以普通读者可理解的传统称谓表达。原文连续以“和”连接人物，中文用分号和“同来的还有”梳理句法，但不改变三位官员共同出面的内容。
