base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: zh_hans
  text: 于是，掌管王宫的希勒家之子以利亚敬、书记舍伯那和亚萨之子史官约亚，衣服已经撕裂，来见希西家；他们把拉伯沙基[a]的话告诉了他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉伯沙基”是亚述官员的头衔，可能指高级官员，例如酒政长或发言人。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 于是……来到
  rationale: 叙事性连接词用“于是”自然承接上文；希伯来文动词虽为单数，但后接复合主语，中文按全体主语自然表达。
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: 管理王宫的
  rationale: 这是王室行政职衔，指掌管王宫或王室事务；“管理王宫”既清楚又保留官职意味。
- source_word: הַסֹּפֵר
  choice: 书记
  rationale: 该词在宫廷语境中指负责文书的官员；“书记”比单纯的“文士”更能体现行政职务。
- source_word: הַמַּזְכִּיר
  choice: 史官
  rationale: 指负责记录、呈报或保存王室事务的官员；“史官”是简明而庄重的中文职衔，不过其具体职责未必只限于编史。
- source_word: קְרוּעֵי בְגָדִים
  choice: 撕裂衣服
  rationale: 保留撕裂衣服这一表达悲痛、震惊或屈辱的具体动作；在句中作为他们来到时的状态。
- source_word: וַיַּגִּדוּ לוֹ
  choice: 把……告诉了他
  rationale: 自然表达正式转述的行为，又不额外强化为宣告或奏报。
- source_word: דִּבְרֵי
  choice: ……的话
  rationale: 贴近原文“言语、话语”的复数表达，表明他们转述拉伯沙基所说的话。
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 保留亚述官衔的音译，避免武断地限定为某一种具体职务，并用脚注说明。
