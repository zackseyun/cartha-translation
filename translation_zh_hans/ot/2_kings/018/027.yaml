  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם רַב שָׁקֵ֗ה הַ/עַ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חרי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: zh_hans
  text: 拉伯沙基对他们说：“我主差我来讲这些话，难道只是对你主和你说吗？不也是对那些坐在城墙上的人说吗？他们将要和你们一起吃自己的粪，喝自己的尿[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本在这里使用粗俗的围城意象：“吃自己的粪，喝自己的尿。”马所拉诵读传统以委婉语替代这些表达；后一语常译作“喝自己脚间的水”。
    reason: 说明原文粗俗措辞，并准确交代马所拉写法与诵读传统中的委婉表达。
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: 军长
  rationale: 这是亚述高级官员的头衔；此处此人作为统军使者发言。采用“军长”比音译更便于现代普通读者理解，同时避免按该词较早的字面来源译作“酒政”。
- source_word: הַעַל ... וְאֵלֶיךָ
  choice: 难道只是对你主和你们说吗
  rationale: 两个介词短语与下一问形成“只是……吗？不也是……吗？”的鲜明反问。虽然“只是”并非独立词项，却自然表达希伯来句法中的排他性对比。
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: 你主 / 我主
  rationale: 这里所指的是犹大王和亚述王，属于政治隶属关系，不是神的称号；“主”简洁保留双方臣属口吻。
- source_word: הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: 那些坐在城墙上的人
  rationale: 贴近原文，指城墙上的守军和听众；“坐在”保留分词的具体画面。
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: 他们将要……吃……喝
  rationale: 不定式在语境中指围城将造成的可怕后果；“将要”自然传达其前瞻性，而不额外引入命定含义。
- source_word: חרי/הם
  choice: 自己的粪
  rationale: 保留围城恫吓中故意粗俗而强烈的措辞；“粪”直接、清楚，也符合现代汉语。
- source_word: שיני/הם
  choice: 自己的尿
  rationale: 按语境表达该措辞所指的排泄物，不以委婉语遮蔽围城辱骂的冲击力；文本传统的措辞差异在脚注交代。
- source_word: עִמָּכֶם
  choice: 和你们一起
  rationale: 明确城墙上的人与受话者将共同遭受围城困境，保留原文的伴随关系。
