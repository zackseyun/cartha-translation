  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: zh_hans
  text: 以色列王以拉的儿子何细亚在位第三年，亚哈斯的儿子希西家登基作犹大王[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“开始作犹大王”。这里的希伯来语动词用于王表公式，指希西家即位开始统治。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 不单独译出
  rationale: 此处主要承接叙事、引入新的王朝纪年段落；现代汉语无需添加并非原文显式时间词的“那时”或采用生硬的“事情发生了”。
- source_word: בִּשְׁנַת שָׁלֹשׁ לְהוֹשֵׁעַ בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王以拉的儿子何细亚在位第三年
  rationale: 按现代汉语的王朝纪年习惯重组语序，清楚表达何细亚的身份及其在位年次。
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 王表公式中的该动词在此指开始执政、即位，而非概括整个统治时期；“登基作王”自然并保留其起始义。
- source_word: חִזְקִיָּה בֶן אָחָז
  choice: 亚哈斯的儿子希西家
  rationale: 采用中文圣经人名的通行译法，并自然表达父子关系。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 作犹大王
  rationale: 与“登基”组合，以自然汉语表达希伯来文中希西家开始作犹大王的含义。
