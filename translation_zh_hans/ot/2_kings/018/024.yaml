  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: zh_hans
  text: 这样，你怎能击退[a]我主那些地位最低的臣仆中连一位长官[b]呢？你却倚靠埃及，指望得到战车和骑兵。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使……的脸转回”；这是希伯来语习语，意为“击退”或“抵挡”。
    reason: lexical_alternative
  - marker: b
    text: “长官”也可译作“总督”或“军官”；原词可指行省统治者或军政官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: 击退
  rationale: 该使役式动词与“脸面”构成习语，意为使对方退却、抵挡或击退对方；本节是军事嘲讽，用“击退”自然明确，同时以脚注保留原文意象。
- source_word: פַחַת
  choice: 长官
  rationale: 该词可指行省统治者或军政官员。上下文虽有军事色彩，但具体职衔并不确定，因此采用范围较宽的“长官”，不限定为纯军事官阶。
- source_word: אַחַד
  choice: 哪怕一个
  rationale: 原文“一”在反问中带有加强语气的作用；“哪怕一个”自然传达对方连最低阶官员中的一人也无法抵挡的嘲讽。
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: 我主最微小的臣仆中
  rationale: “我主”按一人称单数词尾指说话者的主人，并非神圣称号；“最微小”表示地位低微而非体形小。“臣仆”适合亚述王权语境。
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: 你却倚靠埃及
  rationale: בטח על 表示信赖、依靠；连接词在反问中形成讽刺性对照，故译作“却”。
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: 以求战车和骑兵
  rationale: 两个介词短语说明倚靠埃及所求的军事资源。“骑兵”在此比单纯的“骑马者”更符合军队语境。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的普通话。保留原文反问与嘲讽力度；“哪怕一个”强化 אַחַד 的修辞作用。“最微小”指职位或地位低微，不指身体大小。
