    rationale: 原文 כִּי 在此连接前面的挑战与后面的讥讽性结果／设问；“既然如此”虽可通，却比原文更明确地加入论证性推论。“以致……又怎能／竟能”更能保留原句连续反问的修辞关系。
  revised_text: 各国所有的神明中，有谁曾从我手中救出自己的国土，以致雅威又怎能从我手中救出耶路撒冷呢？
