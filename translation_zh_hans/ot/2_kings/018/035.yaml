base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: zh_hans
  text: 各国所有的神明中，有谁曾从我手中救出自己的国土，以致雅威又怎能从我手中救出耶路撒冷呢？
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: 列国所有的神明中，有谁
  rationale: מִי 是疑问代词；בְּכָל 在此为范围、部分关系，宜译作“……中”；הָאֲרָצוֹת 指各国或各地，而非整个世界。“神明”在现代汉语中自然地指列国所敬奉的诸神，也避免与独一上帝的称谓混淆。
- source_word: הִצִּילוּ אֶת אַרְצָם
  choice: 曾……救出自己的国土
  rationale: נצל 在军事语境中表示“救出、解救”。אַרְצָם 的复数后缀按分配意义理解，即各神所对应的国土，因此用“自己的国土”表达最自然。完成式在这番回顾性的挑战中译为“曾……”。
- source_word: מִיָּדִי
  choice: 从我手中
  rationale: 保留希伯来语以“手”表示权势和控制的形象，在汉语中也通顺明确。
- source_word: כִּי יַצִּיל
  choice: 既然如此，……又怎能救出
  rationale: 此处 כִּי 把前一反问与针对耶路撒冷的挑战联系起来；未完成式 יַצִּיל 表达被嘲讽、被质疑的可能行动。分成两个相连的反问，更自然地传达原文的讥诮语气。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文读者最熟悉的四字神名音译，明确保留专名，而不以“主”等称号代替。
- source_word: יְרוּשָׁלַםִ
  choice: 耶路撒冷
  rationale: 采用该地名通行的现代汉语译名。
theological_decisions:
- issue: 如何翻译神名 יְהוָה
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名，应以专名呈现。中文传统中“耶和华”最为通行、易懂；“雅威”更接近部分学界所重构的读音，但该读音并非毫无争议。
- issue: 是否把亚述使者的反问改写为事实陈述
  choice: 保留两个讥讽性的反问
  alternative: 译成“没有一个……所以耶和华也不能……”
  rationale: 原文是人物发言中的修辞挑战，并未直接作出陈述。保留反问，既呈现说话者的傲慢，也不让译文替叙事者认可其神学判断。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“列国”“国土”“从我手中”等词保留历史与军事语境；两个相连的反问准确传达亚述使者夸张、轻蔑的挑战口吻。
