    rationale: 英文 POB 审校轨迹将 יהוה 的既定译名定为 Yahweh，并明确不采用 Jehovah。中文“耶和华”对应传统 Jehovah 读法；为跨语言术语一致性，应改为“雅威”。
  - severity: low
