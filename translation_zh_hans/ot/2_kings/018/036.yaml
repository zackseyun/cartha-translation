  text: וְ/הֶחֱרִ֣ישׁוּ הָ/עָ֔ם וְ/לֹֽא עָנ֥וּ אֹת֖/וֹ דָּבָ֑ר כִּי מִצְוַ֨ת הַ/מֶּ֥לֶךְ הִ֛יא לֵ/אמֹ֖ר לֹ֥א תַעֲנֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: zh_hans
  text: 百姓却保持沉默，一句话也不回答他[a]，因为王曾吩咐说：“不要回答他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“一句话也不回答他”，意思是完全不作回应。
    reason: 说明原文的强调性习语，同时保留正文中的源语意象。
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: 却保持沉默
  rationale: 此处使役词干表达保持安静、不作声；“保持沉默”既体现持续克制，也自然承接前文。连接词按语境译作“却”，突出对方发言后百姓不回应的反差。
- source_word: הָעָם
  choice: 百姓
  rationale: 指城墙上听见喊话的犹大民众；“百姓”符合王国叙事语境，又不额外限定其身份。
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: 一句话也不回答他
  rationale: 保留原文“没有回答他一个字/一件话”的否定强化结构，同时用现代汉语自然表达完全没有回应。
- source_word: כִּי
  choice: 因为
  rationale: 在此引出百姓沉默的原因，明确表达因果关系。
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: 王曾吩咐
  rationale: מִצְוָה表示命令、吩咐；结合后接直接引语，汉语用动词结构更顺畅。“曾”表明命令先于当时的沉默，但不增加实质信息。
- source_word: הִיא לֵאמֹר
  choice: 说
  rationale: 原文直译近于“（命令）是说”；在汉语中以“吩咐说”自然引出命令内容。
- source_word: לֹא תַעֲנֻהוּ
  choice: 不要回答他
  rationale: 第二人称阳性复数的禁止表达；现代汉语不标复数，“不要回答他”准确保留直接命令及与前句 ענה 的词语呼应。
theological_decisions: []
translation_notes:
  register: 采用自然、庄重的现代标准汉语。“百姓”“吩咐”适合历史叙事；正文保留“一句话也不回答他”的希伯来式强调，并以脚注说明其含义。
