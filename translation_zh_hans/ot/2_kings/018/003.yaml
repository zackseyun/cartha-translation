  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为正直的事，效法他的祖先大卫所行的一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他做
  rationale: 叙事性连续式引出希西家的行为；现代汉语无需另译连接词“于是/并且”。
- source_word: הַיָּשָׁר
  choice: 正的事
  rationale: 带冠词的形容词在此名词化，指在道德判断上正确、正直的事；“正的事”与“看为”搭配自然。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华看为
  rationale: 希伯来语直译为“在耶和华眼中”，表达从耶和华的角度作出的评价；转为现代汉语惯用的“耶和华看为”以保持意义和庄重感。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译“耶和华”，明确保留专名而不以“主”这一称号替代。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: 凡……所做的，他都照着做了
  rationale: 比较介词כ与כֹל和关系词אֲשֶׁר共同表示全面依照某一榜样；此句式在现代汉语中清楚自然，也保留“全然照着”的范围。
- source_word: דָּוִד אָבִיו
  choice: 他祖先大卫
  rationale: אָב在王室谱系语境中指先祖，并非希西家的直接父亲；正文直接译明亲属关系，避免现代读者误解，同时保留大卫之约谱系的联系。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文使用四字神名而非普通称号。中文采用广为人知的专名“耶和华”，既保留其专名性质，也便于普通读者识别。
- issue: “他父亲大卫”中אָבִיו的含义
  choice: 他祖先大卫
  alternative: 他父亲大卫[a]
  rationale: 希西家的直接父亲是亚哈斯，此处אָבִיו按大卫王朝公式指祖先。译作“祖先”准确传达原文在该语境中的语义，避免把谱系称谓误读为直接父子关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“耶和华看为正的事”沿用中文宗教语体中透明易懂的评价表达；后半句通过“凡……都……”体现כְּכֹל的全面性。
