source:
  edition: WLC
  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: zh_hans
  text: 这是因为他们不听从雅威他们的上帝的话[a]，违背了他的约[b]，就是雅威的仆人摩西所吩咐的一切；他们既不听从，也不遵行[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “听从……的话”也可译作“顺服”。希伯来语这一说法通常不只指听见，也包含服从。
    reason: lexical_alternative
  - marker: b
    text: “违背”也可译作“破坏”或“违反”。这里指违反上帝与他们所立的约。
    reason: lexical_alternative
  - marker: c
    text: 原文再次使用“听”字，并以两个否定句并列，强调他们持续拒绝听从和实行。另有一种句法理解是把“摩西所吩咐的一切”看作“违背”的另一个宾语。
    reason: textual_or_syntactic_note
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: 这是因为
  rationale: 承接上一节所述的结局并引出原因；“这是因为”在现代汉语中自然、清楚。
- source_word: שָׁמְעוּ בְּקוֹל
  choice: 听从……的话
  rationale: 希伯来语习语兼有聆听与顺服之意；“听从……的话”既保留听的意象，也自然表达服从的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，保留其作为以色列上帝专名的性质，而不以头衔代替。
- source_word: וַיַּעַבְרוּ אֶת בְּרִיתוֹ
  choice: 违背了他的约
  rationale: עבר与“约”连用时指破坏、违犯盟约；“违背了他的约”是自然且具盟约含义的汉语表达。
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: 就是……所吩咐的一切
  rationale: 将这一短语理解为对“他的约”的同位说明，并用“就是”显明原文略显紧缩的关系。
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: 雅威的仆人摩西
  rationale: “仆人”在此是摩西的尊称和职分称谓，比“奴隶”更符合语境。
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: 他们既不听从，也不遵行
  rationale: 保留两个并列否定和“听”的重复，同时用“遵行”自然表达实行所吩咐之事。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；音译“雅威”较直接地保留专名性质，避免用“主”这一头衔取代。
- issue: שׁמע 是否明确译为“顺服”
  choice: 听从
  alternative: 顺服；听
  rationale: “听从”同时承载聆听与服从两层含义，保留原文意象及首尾重复，而不把语义单一化。
- issue: אֵת כָּל אֲשֶׁר צִוָּה 与“他的约”的关系
  choice: 以“就是”作同位说明
  alternative: 理解为另一个并列宾语：又违背摩西所吩咐的一切
  rationale: 原文的 אֵת 短语可自然理解为解释“他的约”的内容；译文以“就是”呈现该关系，同时脚注提示句法上的可能理解。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“雅威的仆人摩西”保留圣经称谓的正式感；分号呈现末句的总结与强调作用。
