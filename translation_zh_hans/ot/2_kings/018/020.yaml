id: 2KI.18.20
reference: 2 Kings 18:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: zh_hans
  text: 你说：“这不过是嘴上的话而已。”[a]然而，作战需要谋略和力量。现在你倚靠谁，竟敢背叛我？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本句希伯来语十分简略，也可理解为：“你以为嘴上的话就是作战的谋略和力量吗？”
    reason: 保留原文前半句句法上的真实歧义，避免将一种解释绝对化。
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: 嘴上的话
  rationale: 直译为“嘴唇的话”，是指仅停留在口头上的言辞；“嘴上的话”在现代汉语中自然，并保留其轻蔑意味。
- source_word: עֵצָה וּגְבוּרָה
  choice: 谋略和力量
  rationale: עֵצָה 指谋划、策略，גְבוּרָה 指能力、实力或勇力；结合战争语境译为“谋略和力量”。
- source_word: בָטַחְתָּ
  choice: 倚靠
  rationale: 该动词表示信赖、依仗；此处涉及军事或政治依靠，“倚靠”比单纯“相信”更贴合语境。
- source_word: מָרַדְתָּ
  choice: 背叛
  rationale: 该词指反叛统治者或宗主；“背叛”自然表达亚述王使者指控希西家不再臣服之意。
theological_decisions:
- issue: 前半句省略而含混的希伯来语句法
  choice: 正文译作两个相对照的陈述，并用“然而”显明语意关系
  alternative: “你以为嘴上的话就是作战的谋略和力量吗？”
  rationale: 原文可理解为轻蔑地称希西家的话只是空谈，继而指出战争实际需要谋略和力量；也可整体读成反问。正文沿用原文“你说”的形式，不把它直接改成“你以为”，同时以脚注保留另一种合理理解。
- issue: כִּי 所表达的关系
  choice: 译为带责问意味的“竟敢”
  alternative: “以致你背叛我”或“因为你背叛了我”
  rationale: 此处 כִּי 可引出对倚靠对象的质问，其逻辑近于“你凭什么依靠谁而反叛我”；“竟敢”在汉语中自然传达亚述使者的责问口吻，而不增添神学判断。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“嘴上的话而已”保留对空谈的轻蔑语气；“倚靠谁”“背叛我”符合政治与军事对峙场景。
