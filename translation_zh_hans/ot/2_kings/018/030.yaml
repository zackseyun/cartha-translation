source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: zh_hans
  text: 不要让希西家使你们信靠雅威，说：‘雅威必定会拯救我们[a]，这城也不会被交在亚述王手中。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“拯救，他必拯救我们”，这是加强语气的表达，意思是“必定会拯救我们”。
    reason: 说明原文同根不定式绝对形与限定动词连用所产生的强调作用。
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: 不要让……使你们倚靠
  rationale: בטח的使役式带宾语后缀，表示希西家使百姓信靠；译文保留使役含义，同时采用自然的现代汉语句式。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אֶל יְהוָה
  choice: 倚靠雅威
  rationale: 介词אֶל本义为“向、朝向”，与בטח连用时表达信靠的对象；“倚靠”符合现代汉语习惯。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按其专名性质音译为“雅威”，不以称号替代。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是引出所述话语的常用引语形式。
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: 必定会拯救我们
  rationale: 不定式绝对形与同根限定动词连用，具有强调作用；“必定会”自然表达其加强语气。
- source_word: וְלֹא תִנָּתֵן
  choice: 也不会被交在
  rationale: 保留נתן被动式所表达的“被交付、落入控制”之意；“也”承接前一项宣称。
- source_word: הָעִיר הַזֹּאת
  choice: 这城
  rationale: 简洁、自然地对应名词加指示词的结构。
- source_word: בְּיַד
  choice: 在……手中
  rationale: 保留希伯来语“在某人手中”的具体意象，在军事语境下也清楚表达受其控制。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 采用该古代帝国及其君王的通行中文称法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名；译作“雅威”旨在保留其专名性质，不以称号替代，也不在此处加入原文没有的解释。
- issue: 希西家宣告中的强调语气
  choice: 必定会拯救我们
  alternative: 拯救，他必拯救我们
  rationale: 原文同根不定式绝对形加强限定动词。正文以自然汉语传达强调，脚注保留其形式信息；这句话仍是亚述使者转述希西家的宣告，并不替叙事者判定其真假。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“使你们倚靠”保留原文使役结构；“被交在……手中”保留被动语态及希伯来语的具体意象。脚注标记置于其实际说明的强调短语之后。
