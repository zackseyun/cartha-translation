  text: וַֽ/יִּלְכְּדֻ֗/הָ מִ/קְצֵה֙ שָׁלֹ֣שׁ שָׁנִ֔ים בִּ/שְׁנַת שֵׁ֖שׁ לְ/חִזְקִיָּ֑ה הִ֣יא שְׁנַת תֵּ֗שַׁע לְ/הוֹשֵׁ֨עַ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל נִלְכְּדָ֖ה שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/010.yaml
  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: zh_hans
  text: 三年期满时[a]，他们攻取了它。希西家在位第六年，也就是以色列王何细亚在位第九年，撒马利亚被攻取了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“过了三年，他们攻取了它。”希伯来语习语较直译为“三年期满时”。
    reason: 说明时间习语可采用的自然译法，并保留其较字面的时间边界含义。
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: 他们攻取了它
  rationale: 将לכד的Qal叙事形式译为主动复数“他们攻取”，保留3阴性单数宾语后缀“它”，所指承接上文的撒马利亚。
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: 三年期满时
  rationale: 该时间习语表示一段三年时期结束之际；“三年期满时”既贴近原文，也符合现代汉语表达。
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: 希西家在位第六年
  rationale: 按希伯来语君王纪年公式明确译出“在位”，使中文自然清楚。
- source_word: הִיא
  choice: 也就是
  rationale: 该代词把两套君王纪年并列对应起来；“也就是”准确表达其同位、同步说明的功能。
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王何细亚在位第九年
  rationale: 完整保留第二个君王纪年及“以色列王”的身份说明，并按自然汉语调整语序。
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: 撒马利亚被攻取了
  rationale: 以被动结构对应Niphal完成式，并重复“攻取”这一核心词义，以保留原文与前句לכד的词汇呼应。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用该城名通行的现代中文译名。
theological_decisions: []
