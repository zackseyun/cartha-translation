source:
  edition: WLC
  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: zh_hans
  text: “难道我现在上来攻打这地方、要毁灭它，是不凭雅威[a]吗？雅威对我说：‘上去攻打这地，毁灭它。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “不凭雅威”直译“离开雅威”或“没有雅威”；也可译“不独立于雅威”。原文未进一步说明所指是许可、帮助还是差遣。
    reason: 说明מִבַּלְעֲדֵי的可容许语义范围，避免把其关系限定为单一的神学或行动含义。
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: 难道是撇开……而来的吗
  rationale: 疑问词הֲ与מִבַּלְעֲדֵי构成反问，意为“没有、离开、独立于”。“撇开……而来”在现代汉语中较自然，同时保留说话者声称自己并非独立于雅威而行动的含义，不直接增添“许可”或“奉命”等解释。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留原文所用的上帝之名，不以称号替代。
- source_word: עָלִיתִי
  choice: 我来攻打
  rationale: עלה本义为“上去、上来”，语境是军事行动；“来攻打”既符合说话者身处目标地点附近的视角，也自然表达军事推进。
- source_word: הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: 按מָקוֹם的宽泛含义译为“地方”，不擅自具体化为耶路撒冷或城。
- source_word: לְהַשְׁחִיתוֹ
  choice: 要毁灭它
  rationale: שׁחת的使役形在此表示毁坏目标；“毁灭”直接传达其强烈程度，代词指回“这地方”。
- source_word: אָמַר אֵלַי
  choice: 对我说
  rationale: 自然、直接地表达常见的说话公式。
- source_word: עֲלֵה
  choice: 上去攻打
  rationale: 保留עלה的方向性，并按军事语境补出“攻打”，使现代汉语清楚自然。
- source_word: הָאָרֶץ הַזֹּאת
  choice: 这地
  rationale: אֶרֶץ在入侵语境中指一片土地或国土；译为“这地”，并与前面的“这地方”保持原文两种名词的区别。
- source_word: וְהַשְׁחִיתָהּ
  choice: 毁灭它
  rationale: 重复同一词根שׁחת的译法，保留前后呼应；“它”指“这地”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名，音译为“雅威”能明确保留专名性质，避免改作称号。
- issue: “撇开雅威”是否明确解释为未经许可或奉雅威差遣
  choice: 保留“撇开雅威”的宽泛表达
  alternative: 未经雅威许可；不是奉雅威之命
  rationale: מִבַּלְעֲדֵי表明并非离开或独立于雅威，但单凭该短语未明确限定为“许可”或“差遣”；保留其张力，并由后句说话者自称得到雅威命令。
- issue: 是否把“这地方”和“这地”明确替换为耶路撒冷与犹大
  choice: 保留原文的泛称
  alternative: 耶路撒冷；犹大
  rationale: 原文分别使用מָקוֹם和אֶרֶץ；不在正文中把可能的所指直接代入，以免缩窄文本。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。反问句保留说话者宣称有神圣授权的语气；引语中的“上去攻打”体现军事语境。保留“这地方／这地”的词汇差异，并将脚注标记置于产生歧义的短语之后。
