base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: zh_hans
  text: 希西家王第四年，也就是以色列王以拉的儿子何细亚第七年，亚述王撒缦以色上来攻打撒马利亚，围困了这城。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: （不单独译出，以时间句承接叙事）
  rationale: 这是希伯来叙事中常见的承接形式。现代汉语直接以纪年短语起句更自然，也保留了事件接续发生的叙事功能。
- source_word: בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: 希西家王第四年
  rationale: 这是标准的君王在位纪年表达；简洁、自然地译出 לְ 所表示的纪年参照关系。
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית לְהוֹשֵׁעַ בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: 也就是以拉的儿子以色列王何细亚第七年
  rationale: הִיא 将两个君王的在位年份对应起来；“也就是”清楚而自然地表达这一纪年同步关系。
- source_word: עָלָה ... עַל שֹׁמְרוֹן
  choice: 上来攻打撒马利亚
  rationale: עָלָה 在军事语境中指挥军进犯，עַל 表明敌对目标。“上来攻打”兼顾原文的移动意象和军事含义。
- source_word: וַיָּצַר עָלֶיהָ
  choice: 围困了这城
  rationale: צור 在此指围城；代词 עָלֶיהָ 回指撒马利亚。汉语用“这城”可避免城市名与代词“她/它”搭配的不自然。
