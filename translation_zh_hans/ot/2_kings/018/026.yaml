  to: 希勒家之子以利亚敬、舍伯那和约亚对拉伯沙基说：“求你用亚兰语对你的仆人说话，因为我们听得懂。不要用犹大话[a]跟我们说，免得城墙上的百姓听见。”
  rationale: 仅将“跟仆人们说话”改为“对你的仆人说话”，以更自然、庄重的现代汉语表达原文在外交场合的复数自谦称谓；其余文字和脚注均可保留。
