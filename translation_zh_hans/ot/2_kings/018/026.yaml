base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: zh_hans
  text: 希勒家之子以利亚敬、舍伯那和约亚对拉伯沙基说：“求你用亚兰语对你的仆人说话，因为我们听得懂。不要用犹大话[a]跟我们说，免得城墙上的百姓听见。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“希伯来语”。原文 יְהוּדִית 直译为“犹大话”，指犹大地区所说的语言。
    reason: 说明语言名称的字面意义及常见替代译法，避免赋予现代语言学术语过高的精确性。
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 保留这个亚述官衔的传统音译，避免在其具体职务尚不完全确定的情况下，过度具体地译为某一种官职。
- source_word: דַּבֶּר נָא
  choice: 求你……说话
  rationale: 命令式加语气词 נָא 表示礼貌请求；“求你”既体现恳请语气，也适合正式外交场景。
- source_word: עֲבָדֶיךָ
  choice: 仆人们
  rationale: 这里是臣属在外交场合自谦的称呼，译作“仆人们”保留其谦卑语气，而不强化奴隶身份。
- source_word: אֲרָמִית
  choice: 用亚兰语
  rationale: 该词在此表示所使用的语言；“用亚兰语”符合现代汉语习惯。
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: 因为我们听得懂
  rationale: שׁמע 可指“听见”或“理解”；上下文谈语言能力，因此“听得懂”兼顾听觉表达和理解之意。
- source_word: יְהוּדִית
  choice: 犹大话
  rationale: 原词直指犹大地区的语言或方言。“犹大话”比技术性的“希伯来语”更贴近原文，也更自然易懂。
- source_word: בְּאָזְנֵי
  choice: 免得……听见
  rationale: 原文直译为“在……耳中”，强调让城墙上的百姓听到；汉语用“免得……听见”自然表达禁令所要避免的结果。
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: 城墙上的百姓
  rationale: 保留 הָעָם 的宽泛含义“百姓”，不擅自限定为士兵；同时以简洁的汉语表达其所在位置。
- source_word: וַיֹּאמֶר ... אֶל
  choice: ……对……说
  rationale: 按汉语叙事习惯表达说话人与对象；上下文已足以显示事件推进，无须机械译出句首连接词。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。三位官员的自称保留外交场合的谦辞；“拉伯沙基”保留传统官衔音译；句式适度顺应汉语表达，同时保持原文关于语言选择与公开听闻之间的对比。
