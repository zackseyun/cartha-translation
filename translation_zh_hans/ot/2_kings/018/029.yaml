base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: zh_hans
  text: 王如此说：“不要让希西家欺骗[a]你们，因为他不能救你们脱离他的手中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“误导”。这个希伯来语动词可指使人走入歧途或使人受骗。
    reason: lexical_alternative
  - marker: b
    text: “从他的手中”指脱离他的权势。《以赛亚书》36:14的平行记载作“从我的手中”。
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 这是使者转达正式宣告的惯用表达。“这样说”在现代汉语中自然、庄重，也保留了原文宣告公式的语气。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 原文只用确定称号“王”，语境所指为亚述王；译文不增补其名字。
- source_word: אַל יַשִּׁיא
  choice: 不要让……欺骗
  rationale: יַשִּׁיא在此表示使人受骗、被引入歧途。“欺骗”贴合讲话者指控希西家给予虚假信心的语境；“误导”也是可能译法，列入脚注。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: כִּי לֹא יוּכַל
  choice: 因为他不能
  rationale: כִּי引出前述禁令的理由；יוּכַל表达能力上的否定，在此译为简洁自然的“不能”。
- source_word: לְהַצִּיל אֶתְכֶם
  choice: 把你们……救出来
  rationale: הציל指从危险或权势下解救；“救出来”符合军事威胁的语境，并在现代汉语中清楚自然。
- source_word: מִיָּדוֹ
  choice: 从他的手中
  rationale: 按所给马所拉文本保留第三人称单数“他的”，并保留“手”表示权势、控制的希伯来语意象；不据平行经文改成“我的”。
theological_decisions:
- issue: מִיָּדוֹ（“他的手中”）的所指及平行经文异文
  choice: 正文按WLC译作“从他的手中”，在语境中指王的权势。
  alternative: 按《以赛亚书》36:14的平行记载译作“从我的手中”，或释义为“脱离他的权势”。
  rationale: 所给希伯来文本明确使用第三人称阳性单数后缀，因此不与《以赛亚书》的第一人称形式调和。正文保留原文措辞，脚注说明其惯用意义和平行经文的差异。
translation_notes:
  register: 采用现代、庄重而易懂的宣告语体。“王这样说”保留正式传令的语气；正文直译“从他的手中”，以脚注解释其惯用意义及平行经文差异。
