source:
  edition: WLC
  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: zh_hans
  text: 他信靠雅威[a]——以色列的神。在他以后，在犹大所有的君王中，没有一个像他；在他以前的君王中也没有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文所记的神名 יהוה（YHWH）。
    reason: 说明神名的原文形式与正文译法。
lexical_decisions:
- source_word: בַּיהוָה
  choice: 信靠耶和华
  rationale: 介词 ב 标明信靠的对象；神名 יהוה 音义惯例译为“耶和华”，并以脚注注明其希伯来形式。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的神
  rationale: 这是附加说明，明确耶和华就是以色列的神；中文紧接神名表达自然。
- source_word: בָּטָח
  choice: 信靠
  rationale: בטח 的 Qal 完成式表示倚赖、信任；“信靠”简洁庄重，并保留其宗教语境中的主动倚赖意味。
- source_word: וְאַחֲרָיו
  choice: 在他以后
  rationale: 保留时间比较的方向；中文无需机械译出连接词 ו。
- source_word: לֹא הָיָה כָמֹהוּ
  choice: 没有一个像他
  rationale: 自然表达希伯来文的独特性比较，不把“像他”的具体方面擅自补明。
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: 犹大历代君王中
  rationale: ב 在群体比较中译为“中”；“历代”自然涵盖君王序列。
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: 在他以前的也没有
  rationale: 关系从句补充前代君王；中文承接前句，省略重复的“一个像他”，意思仍清楚。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用读者最熟悉且庄重的“耶和华”，脚注说明其为希伯来神名，不以“主”替代。
- issue: “没有一个像他”的比较范围
  choice: 保留概括性的比较，不注明具体德行
  alternative: 解释为只在信靠耶和华方面无人可比
  rationale: 上下文很可能使比较聚焦于希西家的信靠，但希伯来文句法本身没有再次明说比较维度；正文保留这一张力，避免缩窄原文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。“他信靠耶和华”保持简洁有力；后半句用分号呈现前后两组君王的平行比较。所有脚注标记均已置于正文。
