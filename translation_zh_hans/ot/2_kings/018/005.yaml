  naturalness: 修订后采用现代庄重书面语。“雅威——以色列的神”清楚呈现同位语；末句补出“君王中”，使平行比较完整而不累赘。
  terminology: 将YHWH统一译为“雅威”，并在脚注保留希伯来文及转写说明；“信靠”“以色列的神”“犹大君王”均符合现代中文圣经语域并忠实对应原文。
