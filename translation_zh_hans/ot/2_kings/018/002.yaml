base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: zh_hans
  text: 他登基的时候二十五岁，在耶路撒冷作王二十九年。他母亲名叫亚比，是撒迦利雅的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: 二十五岁
  rationale: 这是希伯来语表达年龄的惯用语；现代汉语自然地译为“二十五岁”。
- source_word: הָיָה בְמָלְכוֹ
  choice: 登基的时候
  rationale: 此结构说明即位时的年龄。“登基的时候”简洁、自然，并保留开始作王的时间含义。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词表示施行王权、统治；“作王”符合现代中文圣经叙事的庄重语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词表示作王所在之地，直译即可。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 自然地呈现希伯来语介绍王母姓名的固定句式。
- source_word: אֲבִי
  choice: 亚比
  rationale: 按常见中文圣经人名译法音译此专名。
- source_word: בַּת זְכַרְיָה
  choice: 是撒迦利雅的女儿
  rationale: 结构明确表示亲子关系；补出“是”使现代汉语顺畅清楚。
