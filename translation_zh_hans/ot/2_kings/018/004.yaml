source:
  edition: WLC
  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: zh_hans
  text: 他除掉了丘坛，打碎了神柱，砍倒了亚舍拉[a]，又把摩西所造的铜蛇砸得粉碎，因为直到那时，以色列人一直向它烧香；它被称为“尼忽士但”[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉”在这里可能指与亚舍拉女神有关的祭祀木柱或神木；其具体形制不能确定。
    reason: lexical_alternative
  - marker: b
    text: “尼忽士但”与希伯来语“铜”一词构成文字游戏，可能含有“不过是一件铜器”之类的贬抑意味。
    reason: cultural_note
  - marker: c
    text: 也可译为“他称它为‘尼忽士但’”或“人称它为‘尼忽士但’”；希伯来语在此没有重新明说主语。
    reason: alternative_reading
lexical_decisions:
- source_word: הֵסִיר
  choice: 废除了
  rationale: 在宗教改革的语境中，该动词不只是把物件移开，也表示取缔相关设施；“废除”自然地传达希西家终止丘坛崇拜的行动。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: 这是古代以色列地方性祭祀场所的常用译名，既保留“高处”的背景，也明确其宗教设施性质。
- source_word: שִׁבַּר אֶת הַמַּצֵּבֹת
  choice: 打碎了神柱
  rationale: מַצֵּבָה 指竖立作祭祀用途的石柱；“神柱”简洁而能体现其礼仪性质，“打碎”对应强力毁坏。
- source_word: כָרַת אֶת הָאֲשֵׁרָה
  choice: 砍倒了亚舍拉
  rationale: 保留古代宗教专名“亚舍拉”，不武断限定为女神或木制象征物；“砍倒”表明这里首先涉及可被砍伐的祭祀物件。
- source_word: כִתַּת
  choice: 砸得粉碎
  rationale: 该动词表示彻底击碎，比一般的“打破”力度更强。
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: 铜蛇
  rationale: 准确而自然地表达由铜或铜合金制成的蛇，也与《民数记》的叙事背景相呼应。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 这是现代汉语对该群体表达最自然、准确的译法；希伯来语的亲属式群体称呼在此并非要排除女性。
- source_word: מְקַטְּרִים לוֹ
  choice: 还一直向它烧香
  rationale: 未完成式分词结构体现延续至当时的惯常行为；“向它烧香”清楚表达敬拜对象是铜蛇。
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: 他称它为“尼忽士但”
  rationale: 希伯来语动词为阳性单数，最直接的语法承接是希西家；同时以脚注保留主语可能不明确的理解。专名采用传统且易辨认的音译。
theological_decisions:
- issue: אֲשֵׁרָה 所指为何
  choice: 正文音译为“亚舍拉”
  alternative: “亚舍拉柱”或“神木”
  rationale: 该词可能指亚舍拉女神，也可指与她相关的祭祀物件；本节因使用“砍倒”而偏向物件义，但仅据上下文无法确定其具体形制，故正文保留专名并以脚注说明。
- issue: וַיִּקְרָא 的主语
  choice: 译作“他称它为”，以希西家为最自然的语法主语
  alternative: “人称它为”或“它名叫”，不明确指出命名者
  rationale: 希伯来语使用阳性单数主动动词，通常可回指本节开头的希西家；然而叙述转换较简略，也存在非特指主语的理解，故不掩盖这一歧义。
- issue: “尼忽士但”的语气
  choice: 正文保留音译
  alternative: 意译为“不过是一块铜”之类
  rationale: 该名称与“铜”和“蛇”的希伯来语词形形成文字游戏，并可能带贬抑意味；具体词源和语气并不完全确定，因此不在正文中将一种解释定为唯一意义。
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。“丘坛”“神柱”“烧香”等用语兼顾普通读者的理解与古代祭祀语境；专名“亚舍拉”“尼忽士但”保留历史文化特征，并用脚注说明无法在正文中充分呈现的词义与语法歧义。
