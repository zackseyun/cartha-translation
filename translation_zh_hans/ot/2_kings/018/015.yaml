  text: וַ/יִּתֵּן֙ חִזְקִיָּ֔ה אֶת כָּל הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בֵית יְהוָ֑ה וּ/בְ/אֹצְר֖וֹת בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: zh_hans
  text: 于是，希西家把雅威的殿[b]里和王宫[c]府库里所能找到的一切银子[a]都交了出去。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“钱财”；希伯来文直译“银子”。
    reason: lexical_alternative
  - marker: b
    text: 或译“雅威的圣殿”；希伯来文直译“雅威的家”。
    reason: lexical_alternative
  - marker: c
    text: “王宫”希伯来文直译“王的家”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 交了出去
  rationale: נתן的基本义是“给、交出”。结合上一节向亚述王缴纳贡银的语境，“交了出去”自然表达移交之意，同时不像“支付”那样过度限定交易形式。
- source_word: חִזְקִיָּה
  choice: 希西家
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: כָּל
  choice: 所有的……都
  rationale: 以“所有的……都”完整传达该量词的周遍意义，也符合现代汉语表达习惯。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף既可指银这种金属，也可引申为钱财；正文采用较具体、贴近希伯来文的“银子”，脚注保留“钱财”的可能理解。
- source_word: הַנִּמְצָא
  choice: 所有的
  rationale: 原文直译为“被找到的”，在此表示这些场所中现有、可取得的银子。中文用“里所有的”自然传达其实际语义，避免“找到的”被误解为偶然发现。
- source_word: בֵית יְהוָה
  choice: 雅威殿
  rationale: בֵית יְהוָה字面是“雅威的家／殿宇”，语境明确指圣殿；“雅威殿”既自然简洁，又保留神名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，不以称号替代。
- source_word: וּבְאֹצְרוֹת
  choice: 和……府库里
  rationale: אֹצָר可指库房或宝库；在王宫财物的语境中，“府库”准确而简洁。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 该短语字面为“王的家”，在此指王室宫殿；译作“王宫”符合现代汉语，也与其府库的语境相称。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用神名。正文采用较贴近学界通常重构读音的“雅威”，以专名呈现，不改用“主”等称号；脚注不另行展开读音争议，以免给本节添加原文没有的论题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“于是”承接上文；“交了出去”保留动作的宽泛性。“雅威殿”和“王宫府库”形成清楚的地点并列。脚注标记紧随各自所说明的词语。
