  yaml_path: translation/ot/2_kings/018/013.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: zh_hans
  text: 希西家王十四年，亚述王西拿基立上来攻打犹大所有的坚城，并把它们攻取了。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּה
  choice: 希西家王十四年
  rationale: 这是君王在位年数的纪年格式。句首的וּ承接上文，现代汉语叙事中无需机械译作“又”或“而”；“希西家王十四年”简洁自然。
- source_word: עָלָה ... עַל
  choice: 上来攻打
  rationale: עלה本义为“上去、上来”，在军事语境中与עַל连用表示进军攻击。“上来攻打”既保留希伯来语的空间意象，也清楚传达军事行动。
- source_word: סַנְחֵרִיב
  choice: 西拿基立
  rationale: 采用现代中文圣经传统中通行且易辨识的亚述王名译法。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 该组合说明西拿基立的王号和国属；汉语自然表达为“亚述王”。
- source_word: כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: 犹大所有的坚城
  rationale: הַבְּצֻרוֹת指设防、筑有防御工事的城。“坚城”凝练而庄重，在军事叙事中含义明确。
- source_word: וַיִּתְפְּשֵׂם
  choice: 并把它们攻取了
  rationale: 动词表示在征战中夺取、占领；复数后缀指前述各城。“攻取”比泛指的“拿下”更符合庄重的军事叙事，“它们”保留原文明确的代词回指。
