  to: 亚述王从拉吉派遣他珥探、拉伯撒利和拉伯沙基[a]，带着大军[b]前往耶路撒冷，到希西家王那里。他们上去，来到耶路撒冷；他们上去，来到，站在上池的引水渠旁；这引水渠在洗衣人的田地[c]的大路上。
