  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: zh_hans
  text: 亚述王从拉吉派遣他珥探、拉伯撒利和拉伯沙基[a]，带着大军[b]前往耶路撒冷，到希西家王那里。他们上去，来到耶路撒冷；他们上去，来到，站在上池的引水渠旁；这引水渠在洗衣人的田地[c]的大路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他珥探”“拉伯撒利”和“拉伯沙基”很可能是亚述官衔，而不是人名；其职能可能分别相当于“统帅”“内廷总管（或太监长）”和“酒政长（或另一种高级军政官员）”。
    reason: cultural_note
  - marker: b
    text: “大军”也可译作“大队军兵”或“强大的军队”。
    reason: lexical_alternative
  - marker: c
    text: “洗衣人的田地”传统译作“漂布地”。这里可能是洗涤、漂白布料之人的作业地点。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן / רַב סָרִיס / רַב שָׁקֵה
  choice: 他珥探、拉伯撒利、拉伯沙基
  rationale: 这三项很可能是亚述官衔，而非人名；正文采用汉语圣经传统中较易辨认的音译，以免对各官职的具体职能作过度确定的解释，并在脚注说明可能含义。
- source_word: בְּחֵיל כָּבֵד
  choice: 率领大军
  rationale: חַיִל在此指军事力量，כָּבֵד表示规模庞大或力量雄厚。“率领大军”符合现代汉语叙事习惯，也准确传达其军事语境。
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ ... וַיַּעֲלוּ וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: 他们上去，来到……；他们上去，来到那里，站在……
  rationale: 保留希伯来文刻意重复的动词链和上耶路撒冷的方向感，不将两组动作压缩合并。第二处补出“那里”，只为使汉语句法完整。
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: 上池的水渠
  rationale: תְעָלָה指输水的沟渠或水道，בְּרֵכָה指水池或蓄水池；“上池的水渠”简明并保留地理指称。
- source_word: מְסִלַּת
  choice: 大路
  rationale: 该词指修筑的道路或干道；“大路”在现代汉语中自然，也不必过度指定为堤道。
- source_word: שְׂדֵה כוֹבֵס
  choice: 洗衣人田地
  rationale: כּוֹבֵס指清洗、漂洗布料的人。“洗衣人田地”比传统的“漂布地”更便于现代读者理解，同时保留职业和地点的关系。
