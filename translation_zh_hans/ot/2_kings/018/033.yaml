  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: zh_hans
  text: 列国的神中，有哪一个果真救过自己的国脱离亚述王的手呢？[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文采用加强语气的结构，直译近于：“列国的神果真救过各自的国吗？”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: 真能救
  rationale: 不定式绝对形与限定动词连用，加强“救”的语气；在反问中译作“真能救”，自然传达带有挑战意味的强调，同时避免生硬重复。
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: 列国的神
  rationale: 保留复数附属结构，指各国、各民族所敬奉的神；“列国的神”简洁、庄重，也符合本段亚述使者的对比语境。
- source_word: אִישׁ
  choice: 有哪一个
  rationale: 此处 אִישׁ 为逐一、分配用法，不是指男性；结合反问译作“有哪一个”，既体现逐个考察，也传达预期否定的语气。
- source_word: אֶת אַרְצוֹ
  choice: 自己的国
  rationale: 单数后缀与分配用法的 אִישׁ 呼应，意为各神所对应的国家；“自己的国”比直译“他的地”更符合现代汉语，同时保留逐一对应关系。
- source_word: מִיַּד
  choice: 脱离……的手
  rationale: 保留希伯来语以“手”表示权势、控制的意象；此表达在现代中文圣经语体中清楚可懂。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 准确、自然地表达附属结构“亚述的王”。
