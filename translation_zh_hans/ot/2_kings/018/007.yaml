  text: וְ/הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ בְּ/כֹ֥ל אֲשֶׁר יֵצֵ֖א יַשְׂכִּ֑יל וַ/יִּמְרֹ֥ד בְּ/מֶֽלֶךְ אַשּׁ֖וּר וְ/לֹ֥א עֲבָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: zh_hans
  text: 耶和华与他同在；他无论到哪里[a]，都亨通。他背叛亚述王，也不臣服于他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无论他所从事什么，都成功”；也可理解为“他所做的一切都明智而顺利”。希伯来语在此兼含行事明智和取得成功之意。
    reason: 保留 בְּכֹל אֲשֶׁר יֵצֵא 的“出去”表述及其可泛指所从事事务的惯用义，并反映 יַשְׂכִּיל 所含明智与成功的词义范围。
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式呈现四字神名，不以“主”替代原文专名。
- source_word: וְהָיָה ... עִמּוֹ
  choice: 与他同在
  rationale: 自然表达持续的神圣临在与眷顾，并保留希伯来语惯用语。
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: 无论他出兵到哪里
  rationale: 字面涉及“出去”；在君王叙事中可指外出行动或征战。正文按语境译为“出兵”，脚注提示较宽泛的理解。
- source_word: יַשְׂכִּיל
  choice: 都亨通
  rationale: 该词使役词干兼有行事明智与成功顺利之意；叙事语境突出行动的成功，同时脚注保留其词义张力。
- source_word: וַיִּמְרֹד בְּמֶלֶךְ אַשּׁוּר
  choice: 他背叛亚述王
  rationale: 政治语境中的 מרד 指反叛宗主权；“背叛”直接且符合现代汉语。
- source_word: וְלֹא עֲבָדוֹ
  choice: 不再臣服于他
  rationale: עבד 字面为“服事”，在亚述宗主—附庸关系中指臣服、效忠和承担附庸义务；“臣服”比一般的“服事”更清楚地传达政治语境。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；上主
  rationale: 原文明确使用四字神名。中文正文采用广为人知的专名“耶和华”，既保留其专名性质，也避免以称号取代。
- issue: 神同在与成功之间的关系
  choice: 并列呈现“耶和华与他同在”及“都亨通”
  alternative: 明确增译为因果关系，如“所以他凡事亨通”
  rationale: 原文用连续叙述表达紧密关联，却没有显式因果连接词；译文不额外强化为明说的因果命题。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“出兵”贴合君王与亚述宗主关系的历史语境；“亨通”为普通中文读者熟悉的圣经叙事用语。脚注标记已在正文中对应出现。
