  rationale: 修订删除“果然”和“只卖”，以避免添加原文未明示的语气或交易视角；以“价钱是一舍客勒”自然且准确地表达希伯来文的价格公式。“约”保留כָּעֵת所含的近似意味。脚注标记移至相应术语之后，并使城门脚注专注于其位置表达及历史功能。
