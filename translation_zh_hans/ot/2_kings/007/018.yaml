base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: zh_hans
  text: 事情正如神人对王所说的那样发生了；他说：“明天约这个时候，在撒马利亚的城门口[b]，两细亚[a]大麦的价钱是一舍客勒，一细亚细面的价钱也是一舍客勒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细亚”是古代的干量单位；原文直接说“两细亚大麦”和“一细亚细面”。
    reason: cultural_note
  - marker: b
    text: “在撒马利亚的城门口”也可译作“在撒马利亚城门内”。古代城门是进行交易和审判的公共场所。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: 事情果然照……所说的发生了
  rationale: כְּ与不定式在此表达事情与先前话语相符；“果然照……发生了”自然地呈现预言应验的叙事作用，而不把它弱化为单纯的时间关系。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留希伯来文的固定称号，不直接解释为“先知”。
- source_word: סָאתַיִם
  choice: 两细亚
  rationale: 双数形式，指两份名为“细亚”的古代干量；保留原单位，以维持价格陈述的具体性。
- source_word: שְׂעֹרִים
  choice: 大麦
  rationale: 该词通常指大麦。
- source_word: בְּשֶׁקֶל
  choice: 只卖一舍客勒
  rationale: 价格用法中的בְּ表示交换价格；“卖一舍客勒”符合现代汉语市场语境，加入“只”自然体现低价，但不改变数值。
- source_word: וּסְאָה סֹלֶת
  choice: 一细亚细面
  rationale: 明确呈现单数“一细亚”与前面的“两细亚”对照；סֹלֶת指精细面粉，译为“细面”。
- source_word: כָּעֵת מָחָר
  choice: 到明天这个时候
  rationale: 自然表达次日大约同一时刻；希伯来文כְּ含近似意味，详见脚注。
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: 在撒马利亚城门口
  rationale: בְּ可译为“在……内/处”；“城门口”符合汉语表达，也传达古代城门作为交易公共空间的场景。
