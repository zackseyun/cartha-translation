base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: zh_hans
  text: 那军官回答神人说：“雅威若在天上开窗户[a]，这事岂能发生呢？”神人说：“你看，你必亲眼看见，却不得吃其中的食物。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在天上开水闸”。希伯来文直译为“在天上开窗户”，描绘天上出现通道、供应或审判由此降下的景象。
    reason: 说明 אֲרֻבּוֹת 的词义范围及原文意象。
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: 军官
  rationale: 该词指高级军事或王室官员；“军官”符合上下文，又不武断限定其具体军衔或宫廷职务。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经对先知的固定称谓；“神人”简洁保留其正式称号。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留经文所用的上帝圣名，而不以称号替代。
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: 在天上开窗
  rationale: 保留“窗”的原文意象，同时用现代汉语中自然的“开窗”表达；“水闸”这一可能含义列入脚注。
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: 这事岂能发生呢？
  rationale: 以反问句自然传达军官对预言能否实现的怀疑。
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: 你看，你必亲眼看见
  rationale: “你看”体现提示语气，“必亲眼看见”按上下文表达分词的预告作用及“用你的眼睛”的强调。
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: 却一点也吃不到
  rationale: 原文直译为“却不能从那里吃”；汉语省去指向不明的“那里”，以“吃不到”自然指回所应许的供应，同时不额外限定具体食物。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译，以区别于“主”等称号，并保留其专名性质。
- issue: 军官反问中的假设语气
  choice: 雅威若在天上开窗，这事岂能发生呢？
  alternative: 即使雅威在天上开窗，这事也能发生吗？
  rationale: 采用较贴近条件结构的“若”，不额外加入“即使……也……”的让步强调；反问仍清楚保留其不信与怀疑。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“神人”作为固定先知称号予以保留；对话简洁有力。脚注标记紧随其所解释的“开窗”。
