    rationale: “一点也”并非原文明确表达；“吃不到”较易表示客观不能，而原文是神人所宣告的“不得吃”的结果。补出上下文明确的供应对象，可使汉语自然且不误指“窗户”为可吃之物。
  - severity: low
    issue: “在天上开窗”措辞略省略
    rationale: 补为“在天上开窗户”在现代汉语中更完整，仍忠实对应“在天上的窗／闸口”这一比喻性表达。
