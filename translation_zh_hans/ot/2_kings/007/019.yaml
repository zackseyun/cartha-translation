  to: 那军官回答神人说：“雅威若在天上开窗户[a]，这事岂能发生呢？”神人说：“你看，你必亲眼看见，却不得吃其中的食物。”
  rationale: 修订仅使“窗”的译法更完整自然，并将末句恢复为较贴近原文禁令性预告的表达；“其中的食物”由紧邻上下文所预言、次日将可取得的食物供应确定，避免汉语中“从中吃”可能误指窗户，同时不改变原文意义。
