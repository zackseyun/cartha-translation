  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: zh_hans
  text: 于是以利沙说：“你们要听雅威的话！雅威如此说：明天约在这个时候，在撒马利亚城门口，一细亚[a]的细面粉售价一舍客勒，两细亚大麦售价一舍客勒。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细亚”是古代的干量单位；希伯来原文使用的是这个具体单位。
    reason: 文化与度量衡说明
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 以利沙说
  rationale: 叙事性连词推动情节；现代汉语无需机械译出“于是”，直接用“说”更自然，前后次序仍由语境清楚表达。
- source_word: שִׁמְעוּ
  choice: 你们要听
  rationale: 复数命令式，既保留对众人的正式召唤，也符合先知宣告的庄重语气。
- source_word: דְּבַר יְהוָה
  choice: 雅威的话
  rationale: “话”直接对应 דָּבָר，并保留先知宣告惯用语的形式与分量。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，保留其专名性质，不以称号替代。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知使者公式的正式结构和辨识度。
- source_word: כָּעֵת מָחָר
  choice: 明天约在这时候
  rationale: כְּ 表示大约、相近；此译既自然，也避免将时间说成精确时刻。
- source_word: סְאָה / סָאתַיִם
  choice: 一细亚 / 两细亚
  rationale: 保留具体的古代干量单位及其单数、双数数量差异，不泛化为“若干量”。
- source_word: סֹלֶת
  choice: 细面粉
  rationale: 该词指精细的面粉；“细面粉”比泛称“面粉”更准确，也符合现代汉语。
- source_word: בְּשֶׁקֶל
  choice: 只卖一舍客勒
  rationale: 此处介词表示市场价格。“卖一舍客勒”自然表达交易价；“只”凸显在围城饥荒背景下预告的低价，但不改变数量。
- source_word: שְׂעֹרִים
  choice: 大麦
  rationale: 准确对应这种谷物在市场交易语境中的名称。
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: 在撒马利亚城门口
  rationale: 古代城门是交易和公共活动场所；“城门口”在现代汉语中自然清楚。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。音译为“雅威”可保留其作为以色列之神专名的性质，而不以称号代替；“耶和华”是传统形式，“上主”则属于称号性替代。
- issue: 预言中价格变化的语气
  choice: 将只卖一舍客勒
  alternative: 卖一舍客勒
  rationale: 上下文涉及围城导致的极端粮价；“只”自然传达所预告价格之低，但没有把原因或应验方式补入本节。
translation_notes:
  register: 采用庄重而易懂的现代标准普通话。“你们要听……雅威如此说”保留先知宣告的正式节奏；度量衡名称用音译，并以脚注解释。脚注标记置于“细亚”首次出现处，以便读者准确对应说明。
