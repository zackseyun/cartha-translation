- from: 王的一个臣仆回答说：“请让人从剩下的马中牵五匹来，就是城里仅存的马。[a]看哪，它们的命运和城里剩下的以色列众人一样；看哪，也和已经灭亡的以色列众人一样。[b]我们派人去察看吧。”
  to: 王的一个臣仆回答说：“请从仍留在城里的余下的马中选取五匹。[a]看哪，它们就如城里剩下的以色列全体；看哪，它们又如已经灭亡的以色列全体。[b]我们差人去察看吧。”
  rationale: 修订避免将“五匹”误读为全城仅存的全部马，并撤除“命运”这一合理但非原文明确表达的解释性补足。保留“城里”作为对代词所指的语境性表达，同时以脚注说明原文并未重述该名词。
