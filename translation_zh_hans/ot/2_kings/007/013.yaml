  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/עֲבָדָ֜י/ו וַ/יֹּ֗אמֶר וְ/יִקְחוּ נָ֞א חֲמִשָּׁ֣ה מִן הַ/סּוּסִים֮ הַֽ/נִּשְׁאָרִים֮ אֲשֶׁ֣ר נִשְׁאֲרוּ בָ/הּ֒ הִנָּ֗/ם כְּ/כָל ה/המון יִשְׂרָאֵל֙ אֲשֶׁ֣ר נִשְׁאֲרוּ בָ֔/הּ הִנָּ֕/ם כְּ/כָל הֲמ֥וֹן יִשְׂרָאֵ֖ל אֲשֶׁר תָּ֑מּוּ וְ/נִשְׁלְחָ֖ה וְ/נִרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: zh_hans
  text: 王的一个臣仆回答说：“请从仍留在城里的余下的马中选取五匹。[a]看哪，它们就如城里剩下的以色列全体；看哪，它们又如已经灭亡的以色列全体。[b]我们差人去察看吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从那些剩下的、仍留在其中的马中”；“其中”的阴性单数代词很可能指撒马利亚城，但本节没有再次说出“城”这个名词。
    reason: lexical_alternative
  - marker: b
    text: 这里的希伯来文比较既重复又难解，直译近似：“看哪，它们如同留在其中的以色列全体；看哪，它们如同已经灭亡的以色列全体。”译文保留两重比较，未在正文规定“它们”与以色列人具体比较的是命运、人数或其他方面。
    reason: textual_difficulty
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: 王的一个臣仆回答说
  rationale: עֶבֶד 在王宫语境中可指臣仆或侍从；“臣仆”既体现其服侍君王的身份，也不武断限定为奴隶。中文叙事以“回答说”自然对应重复的发言引介。
- source_word: וְיִקְחוּ נָא חֲמִשָּׁה מִן הַסּוּסִים
  choice: 请让人从剩下的马中牵五匹来
  rationale: נָא 表示恳请；第三人称祈愿式以“请让人……”表达。对马使用“牵”符合现代汉语习惯，מן 的部分意义由“从……中”保留。
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: 剩下的马……就是城里仅存的马
  rationale: 原文连续重复 שׁאר，译文用“剩下／仅存”保留强调而避免生硬同词复沓。阴性单数后缀 בָהּ 很可能回指撒马利亚城，中文若直译“在她里面”无法成立，故按语境明确为“城里”，并以脚注说明原文没有重述名词。
- source_word: הִנָּם כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: 看哪，它们的命运和以色列众人一样
  rationale: 两次 הִנָּם 均译为“看哪”，保留指示和强调；כְּ 的比较在语境中涉及这些马若留下或出城都面临死亡，补出“命运”使中文比较对象清楚，同时不消除原文的难解性。הֲמוֹן 译为“众人”，自然表达群体总数。
- source_word: אֲשֶׁר תָּמּוּ
  choice: 已经灭亡的
  rationale: תמם 表示终结、耗尽；在饥荒与死亡的语境中，“灭亡”准确而庄重，并保留死亡或彻底消亡的语义张力。
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: 我们派人去察看吧
  rationale: 两个第一人称劝勉式表达共同提议；中文以“……吧”传达商议语气，“派人去察看”比逐字的“我们差派并看”自然。
theological_decisions:
- issue: 马匹与以色列众人的比较所指
  choice: 以“命运一样”表达比较关系，并保留两组重复对照
  alternative: 解释为即使探马被杀，损失也无关紧要，或把马匹视为骑马出行的人
  rationale: 希伯来文比较结构重复且语义困难，可能涉及马匹、执行任务的人或其共同命运。正文只补足中文必需的比较范畴，不把某一种解释写成唯一含义；脚注明确原文的困难和重复。
translation_notes:
  register: 采用现代、庄重而可朗读的叙事语体。“臣仆”“看哪”“灭亡”保持经文庄重感；“牵五匹来”“派人去察看吧”则符合当代普通话。所有脚注标记均置于相关正文之后。
