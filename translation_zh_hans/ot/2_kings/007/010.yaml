base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: zh_hans
  text: 于是他们来到城门，呼叫城门守卫，向他们报告说：“我们到了亚兰人的营地，看哪，那里没有一个人，也没有人声，只有马拴着，驴也拴着，帐篷还是原来的样子。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: 城门守卫
  rationale: שֹׁעֵר 在形态上是单数，但下文用复数代词和动词，表明这里具有集合意义，指负责守城门的人员。“城门守卫”自然、清楚，也避免使用较陈旧的“守门人”。
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: 向他们禀报说
  rationale: נגד 的使役形在此指告知、报告；“禀报”符合他们向城内守卫传递紧急消息的叙事场景，“说”保留希伯来语引语公式。
- source_word: מַחֲנֵה אֲרָם
  choice: 亚兰人的营地
  rationale: 直接保留专名 אֲרָם（亚兰），并以自然汉语表达其所属关系；不以较晚的地缘名称“叙利亚”替代。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: הִנֵּה 用于鲜明地引出意外景象；“看哪”保留其叙事强调和庄重语气。
- source_word: אֵין שָׁם אִישׁ
  choice: 那里一个人也没有
  rationale: אִישׁ 在此泛指任何人，并非特指男性；此译法准确且符合现代汉语习惯。
- source_word: וְקוֹל אָדָם
  choice: 也听不见人的声响
  rationale: קוֹל 可指“声音”或更广义的“声响”。结合营中毫无人迹的场景，“人的声响”保留较宽泛的语义；补出“听不见”使汉语通顺，但不改变所述的听觉缺失。
- source_word: כִּי אִם
  choice: 只有
  rationale: 该短语引出前述无人、无声情形中的唯一例外；“只有”简洁自然。
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: 只有马和驴还拴着
  rationale: אָסוּר 指被绑住或拴住，在牲畜语境中译作“拴着”最自然。单数的“马”和“驴”在此具有集合意义，汉语无需强制标复数；“还”传达它们被遗留在原状的语境。
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: 帐篷也都保持原样
  rationale: 直译为“帐篷照它们原来的样子”，意指帐篷未被收走或扰动。“保持原样”简洁地传达这一含义，而不过度说明细节。
- source_word: אָדָם
  choice: 人
  rationale: 此处泛指人类发出的声音，不涉及性别；“人的声响”准确表达其修饰关系。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“禀报说”和“看哪”保留经文的报告公式与鲜明呈现功能；其余表达避免古奥。“原封未动”虽较生动，但可能比原文多出受扰动的判断，因此正文采用较贴近 כַּאֲשֶׁר הֵמָּה 的“保持原样”。
