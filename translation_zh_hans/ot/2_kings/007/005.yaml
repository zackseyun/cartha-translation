  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: zh_hans
  text: 于是，他们在黄昏时起身，往亚兰营去。他们来到亚兰营的边缘；看哪，那里一个人也没有。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: 于是，他们……起身
  rationale: 该叙事性连续式推进事件；“于是”自然表达承接关系，“起身”保留 קום 的动作色彩。
- source_word: בַנֶּ֔שֶׁף
  choice: 在黄昏时
  rationale: נֶשֶׁף 在本段语境中指暮色降临之时；“黄昏时”准确、自然，也不把时段过度限定为天完全黑下来的时候。
- source_word: לָב֖וֹא אֶל
  choice: 往……去
  rationale: 不定式表达起身的目的；按中文叙事视角，以“往……去”表达朝营地移动最为自然。
- source_word: מַחֲנֵ֣ה אֲרָ֑ם
  choice: 亚兰营
  rationale: 保留专名“亚兰”，并以简洁自然的中文结构表达“亚兰的营地”。
- source_word: עַד קְצֵה֙
  choice: 来到……的边缘
  rationale: עַד קְצֵה 表示抵达营地的外缘；“边缘”比“外围”更贴近原文空间界限，同时中文通顺。
- source_word: וְהִנֵּ֥ה
  choice: 看哪
  rationale: הִנֵּה 引出人物突然发现的意外景象；“看哪”保留其提示和惊异功能，并符合庄重的圣经叙事语体。
- source_word: אֵֽין שָׁ֖ם אִֽישׁ
  choice: 那里一个人也没有
  rationale: אִישׁ 虽为阳性单数形式，此处按惯用法泛指任何人；“一个人也没有”准确表达全然无人，且比“没有一个男人”更符合现代汉语及本句语义。
theological_decisions:
- issue: אִישׁ 的阳性单数形式在本语境中是否应译作特指男性
  choice: 一个人也没有
  alternative: 没有一个男人
  rationale: 这里的否定存在句以 אִישׁ 泛指任何人，重点是营中全然无人，并非强调没有男性。译作“一个人也没有”既保留单数泛指的力度，也避免在原文没有此意时缩窄为男性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”推进情节，“看哪”保留原文突显意外发现的语用作用；分号使突转清楚而不添加解释。
