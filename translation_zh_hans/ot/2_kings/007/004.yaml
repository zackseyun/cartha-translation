source:
  edition: WLC
  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: zh_hans
  text: “我们若说：‘进城去吧’，城里正有饥荒，我们会死在那里；我们若坐在这里，也会死。现在，来吧，我们去投奔[a]亚兰[b]的营地。他们若让我们活着，我们就活；他们若处死我们，我们就死。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “投奔”所译的希伯来语习语字面可作“倒向”或“落到”；在军事语境中可指转投或归降另一方。
    reason: lexical_alternative
  - marker: b
    text: “亚兰”是希伯来语名称，常另译为“叙利亚”或“亚兰人”。
    reason: cultural_note
lexical_decisions:
- source_word: נָבוֹא
  choice: 进城去吧
  rationale: 第一人称复数未完成式置于“我们若说”所引出的拟议话语中，具有提议语气；“进城去吧”比单纯的将来时更符合现代汉语。
- source_word: הָעִיר
  choice: 城里／城
  rationale: עִיר是普通名词，语境虽指撒马利亚，正文仍保留原文的泛称，不直接补出城名。
- source_word: הָרָעָב
  choice: 饥荒
  rationale: 此处指围城造成的整体粮荒，而非个人的饥饿感。
- source_word: וָמַתְנוּ / וָמָתְנוּ
  choice: 我们会死／我们就死
  rationale: 这些形式在条件推论中表达预期结果；按现代汉语语流分别译作“会死”和“就死”，意义一致。
- source_word: יָשַׁבְנוּ פֹה
  choice: 坐在这里
  rationale: 保留ישב“坐、居留、停留”的具体意象，同时在本段处境中自然表达原地不动。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 标示从权衡各种选择转向采取行动；汉语无需额外添加强推论词。
- source_word: לְכוּ
  choice: 来吧
  rationale: 字面为“去”，但与随后第一人称复数劝勉式连用时是号召同伴行动；“来吧”是自然且不过分口语化的汉语表达。
- source_word: וְנִפְּלָה אֶל
  choice: 我们去投奔
  rationale: נפל אל字面带有“倒向、落到”的意象，在军事语境中可表示转投、归降另一方；正文采用自然的“投奔”，并以脚注保留该习语的字面色彩和其他可能译法。
- source_word: מַחֲנֵה אֲרָם
  choice: 亚兰营
  rationale: 构造短语自然译为“亚兰营”；אֲרָם按希伯来名称译作“亚兰”，不以现代地名替代。
- source_word: יְחַיֻּנוּ
  choice: 他们若让我们活着
  rationale: חיה的Piel形在此意为使人存活、饶人性命；“让我们活着”贴近原文，并保留下句“我们就活”的重复。
- source_word: נִחְיֶה
  choice: 我们就活
  rationale: 直译条件句的结果，并与上一分句形成原文刻意的词根重复。
- source_word: יְמִיתֻנוּ
  choice: 他们若处死我们
  rationale: מות的Hiphil形有使之死亡、处死之意；“处死”保留其使役意味，也符合投奔敌营后可能遭遇的处置。
theological_decisions: []
