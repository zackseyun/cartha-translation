  register: 采用现代、庄重而易懂的叙事汉语。保留原文反复出现的“我们会死／我们就死”和“让我们活着／我们就活”，以呈现人物在绝境中的简短推断。引号承接上一节人物的商议语气；脚注标记均置于其实际说明的词语之后。
