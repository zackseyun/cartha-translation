  to: 王曾委派王所倚靠的那位高级军官[a][b]负责城门。百姓在城门处践踏他，他就死了；正如神人在王下到他那里时所说的。
  rationale: 修订以自然的“王所倚靠的那位”表达该官员与王的亲近、倚靠关系，同时在脚注中保留希伯来语“手”的具体意象。脚注锚点移至相关短语之后。“正如神人在王下到他那里时所说的”保留原文的时间从句和重复说话结构所表达的回指，不额外在正文中解释其为“应验”。
