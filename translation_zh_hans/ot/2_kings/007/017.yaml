source:
  edition: WLC
  text: וְ/הַ/מֶּלֶךְ֩ הִפְקִ֨יד אֶת הַ/שָּׁלִ֜ישׁ אֲשֶׁר נִשְׁעָ֤ן עַל יָד/וֹ֙ עַל הַ/שַּׁ֔עַר וַ/יִּרְמְסֻ֧/הוּ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/רֶ֥דֶת הַ/מֶּ֖לֶךְ אֵלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: zh_hans
  text: 王曾委派王所倚靠的那位高级军官[a][b]负责城门。百姓在城门处践踏他，他就死了；正如神人在王下到他那里时所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “高级军官”也可译作“王室侍从”或“副官”；希伯来语所指的是一位接近君王的高级官员。
    reason: lexical_alternative
  - marker: b
    text: 直译为“王倚在他的手上”；这是描述君王近身侍从的说法。
    reason: cultural_note
lexical_decisions:
- source_word: הִפְקִיד
  choice: 派了……负责
  rationale: 使役词形在此表示委派职责；结合叙事语境，以“派了……负责”自然表达王先前作出的任命。
- source_word: הַשָּׁלִישׁ
  choice: 高级军官
  rationale: 该词指接近君王的高级军政人员，但确切官阶不明；“高级军官”既交代地位，也避免过度具体化为某一固定军衔。
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: 那位供他倚手的
  rationale: 保留“倚手”这一希伯来语具体形象，并在注释中说明它所暗示的近身侍从身份。
- source_word: עַל הַשַּׁעַר
  choice: 负责城门
  rationale: 与“委派”连用时，介词短语表示管辖或监督职责，并非单指站立地点。
- source_word: וַיִּרְמְסֻהוּ
  choice: 把他踩在脚下
  rationale: 直接传达 רמס 的践踏含义，同时保持现代汉语的自然表达。
- source_word: בַּשַּׁעַר
  choice: 在城门口
  rationale: 指城门通道或城门区域；“城门口”在现代汉语中比“在城门里”自然，且不把地点缩窄为门外。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 这正应验了……所说的话
  rationale: 原文明确把死亡事件与先前话语相连；“正应验了”表达叙事中的实现关系，而不增加其内容。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经中的固定称谓，宜保留，而不直接改释为“先知”。
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: 王下到他那里时
  rationale: ב 加不定式表示时间；“下到”保留原文的空间方向，而代词所指维持原文表述。
theological_decisions:
- issue: 预言应验的叙事公式
  choice: 译作“这正应验了神人所说的话”
  alternative: “正如神人所说的”
  rationale: 原文以 כַּאֲשֶׁר דִּבֶּר 明确联系事件和先前宣告；“应验”清楚呈现此处的叙事功能，同时没有增添有关应验机制的教义解释。
- issue: 末尾两个“说”字的关系
  choice: 保留为“所说的话，就是……时他说的”
  alternative: 压缩为“正如王下到神人那里时神人所说的”
  rationale: 希伯来文重复 דִּבֶּר，并以关系从句进一步界定先前的话；正文适度保留重复，以反映原文强调，同时用“就是”使现代汉语连贯。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“供他倚手的”有意保留希伯来语意象，借脚注帮助普通读者理解；整体句法略作拆分，以免长句晦涩。
