  text: וַ/יֹּאמְרוּ֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ לֹֽא כֵ֣ן אֲנַ֣חְנוּ עֹשִׂ֗ים הַ/יּ֤וֹם הַ/זֶּה֙ יוֹם בְּשֹׂרָ֣ה ה֔וּא וַ/אֲנַ֣חְנוּ מַחְשִׁ֗ים וְ/חִכִּ֛ינוּ עַד א֥וֹר הַ/בֹּ֖קֶר וּ/מְצָאָ֣/נוּ עָו֑וֹן וְ/עַתָּה֙ לְכ֣וּ וְ/נָבֹ֔אָה וְ/נַגִּ֖ידָה בֵּ֥ית הַ/מֶּֽלֶךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: zh_hans
  text: 于是他们彼此说：“我们这样做不对。今天是传来好消息的日子，我们却默不作声。要是等到晨光出现，罪责就会追上我们[a]。现在来吧，我们去向王室[b]报信。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“罪孽（或罪责）会找到我们”；也可理解为“惩罚会临到我们”或“我们就要担当罪责”。
    reason: lexical_alternative
  - marker: b
    text: “王室”原文直译为“王的家”，也可译作“王家”或“王宫”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: 我们这样做不对
  rationale: 贴近“我们所做的并非如此/不对”这一希伯来语表达，同时以自然汉语保留明确的道德判断。
- source_word: יוֹם בְּשֹׂרָה
  choice: 有好消息的日子
  rationale: בְּשֹׂרָה 在此指解围、得救的喜讯；“好消息”清楚自然，也避免使用可能带入后期专门神学含义的固定术语。
- source_word: מַחְשִׁים
  choice: 默不作声
  rationale: 该使役词形在此表示有意保持沉默；“默不作声”体现持续而主动隐瞒消息的意味。
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: 要是等到晨光出现
  rationale: 按语境将连接词与完成式理解为条件句，并具体保留 אוֹר הַבֹּקֶר 的“晨光”，不只笼统译作“早晨”。
- source_word: וּמְצָאנוּ עָוֹן
  choice: 罪责就会追上我们
  rationale: 原文直译为“罪孽/罪责会找到我们”。“罪责追上我们”保留拟人化表达及道德责任，同时不排除随之而来的惩罚。
- source_word: לְכוּ וְנָבֹאָה
  choice: 来吧，我们去
  rationale: 两个动词合用是在催促众人立即行动；“来吧，我们去”符合现代汉语习惯，又没有把 בוא 过度限定为进入某座建筑。
- source_word: וְנַגִּידָה
  choice: 报信
  rationale: נגד 的使役式表示告知、报告；本处是把紧急消息正式传给王室，“报信”简洁贴切。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王室
  rationale: 原文是“王的家”，既可指王宫，也可指王的家室或宫廷机构；“王室”保留较宽泛的制度与人员含义，不武断限定为建筑。
theological_decisions:
- issue: עָוֹן 在本句指罪责还是惩罚
  choice: 正文译作“罪责”，脚注注明也可理解为“惩罚”
  alternative: 惩罚就会临到我们
  rationale: עָוֹן 首先可表示罪孽、罪责，也能转指罪所招致的刑罚。正文保留原文道德责任的核心，脚注呈现语境中可能突出的惩罚义，避免消除原有张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“于是”承接前文行动；“晨光出现”保留原文意象；脚注标记均紧跟其所说明的词语。
