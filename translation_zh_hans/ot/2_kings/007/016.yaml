  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: zh_hans
  text: 百姓就出去，掠夺了亚兰的营地[b]。一细亚[a]细面值一舍客勒，两细亚大麦也值一舍客勒，正如雅威所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “细亚”是古代的干量单位。
    reason: cultural_note
  - marker: b
    text: 也可译作“亚兰人的营地”或“亚兰军营”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: 百姓就出去
  rationale: 叙事性的连续式推动情节发展；“就”自然表达先后承接，“百姓”准确传达集合名词 הָעָם。
- source_word: וַיָּבֹזּוּ
  choice: 掠夺了
  rationale: בזז 指夺取敌方财物或战利品；“掠夺”保留军事语境，且符合现代汉语。
- source_word: מַחֲנֵה אֲרָם
  choice: 亚兰人的营地
  rationale: 该构造短语直指亚兰一方的营地；译作“亚兰人的营地”自然明确，同时保留“亚兰”这一古代族群及地域名称。
- source_word: וַיְהִי
  choice: 于是……卖
  rationale: 本句在语境中说明粮食实际达到先前预告的价格；补出“卖”符合汉语价格表达，也没有超出上下文含义。
- source_word: סְאָה / סָאתַיִם
  choice: 一细亚 / 两细亚
  rationale: 保留希伯来特定干量单位，并准确表达后者的双数形式；以脚注说明其性质，避免换算造成虚假的精确度。
- source_word: סֹלֶת
  choice: 细面
  rationale: סֹלֶת 指精细的面粉；“细面”简洁、准确，并符合圣经语体。
- source_word: בְּשֶׁקֶל
  choice: 卖一舍客勒
  rationale: 介词短语在这里表示售价；“舍客勒”保留古代重量及货币单位名称，“卖一舍客勒”是清楚自然的汉语表达。
- source_word: שְׂעֹרִים
  choice: 大麦
  rationale: 该复数名词在交易语境中表示作为商品的大麦，用汉语集合名词“大麦”最自然。
- source_word: כִּדְבַר יְהוָה
  choice: 正如雅威所说的
  rationale: 该短语表明先前神谕得到应验；“正如……所说的”自然传达 כִּדְבַר 的符合关系，并以“雅威”呈现神名。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”按通常重构的读音音译，保留其作为专名的性质，而不以称号替代。
- issue: כִּדְבַר יְהוָה 所表达的应验关系
  choice: 正如雅威所说的
  alternative: 照着雅威的话
  rationale: 本节回指先前的预言，强调事件与神所说的话相符；所选译文显出应验关系，但不额外说明其实现方式。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“百姓就出去”保持情节推进；“于是”引出市场价格这一结果。古代度量衡名称采用音译并加简短脚注，不作可能造成误解的现代换算。脚注标记按其实际所解释的词语放置。
