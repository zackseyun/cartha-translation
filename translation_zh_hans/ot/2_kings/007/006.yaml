id: 2KI.7.6
reference: 2 Kings 7:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: zh_hans
  text: 因为主使亚兰军营听见战车的声音、马的声音和大军的声音[a]，他们彼此说[b]：“看哪，以色列王雇了赫人的众王和埃及的众王前来对付我们！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文三次重复“声音”：战车的声音、马的声音、大军的声音。
    reason: 说明希伯来文重复的修辞结构。
  - marker: b
    text: 直译：“各人对自己的弟兄说。”
    reason: 保留希伯来语相互表达的字面形式。
lexical_decisions:
- source_word: וַאדֹנָי
  choice: 主
  rationale: 此处 אֲדֹנָי 是指以色列之神的神圣称号；译作“主”既准确又符合现代中文圣经语体，同时不把原文改作四字神名。
- source_word: הִשְׁמִיעַ
  choice: 使……听见
  rationale: 保留 שׁמע 的使役形含义，表明声音是主使亚兰营中听见的，并非普通的听觉行为。
- source_word: מַחֲנֵה אֲרָם
  choice: 亚兰营中
  rationale: “亚兰”直接对应原文专名，避免“叙利亚”的现代地缘含义；“营中听见”在中文里自然地表达军营人员听见声音。
- source_word: קוֹל רֶכֶב
  choice: 战车声
  rationale: רֶכֶב 在军事语境中指战车或战车队；“战车声”简洁而具体。
- source_word: קוֹל סוּס
  choice: 马蹄声
  rationale: 原文直译为“马的声音”；中文用“马蹄声”自然呈现军马逼近的听觉意象，但略作了具体化。
- source_word: קוֹל חַיִל גָּדוֹל
  choice: 大军的声音
  rationale: חַיִל 在此指军队；保留“大军”以及第三个“声音”，呈现原文递进的军事声势。
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: 他们就彼此说
  rationale: 这是表示相互交谈的希伯来语习用语；中文“彼此说”自然传达其意义，字面形式另见脚注。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 传达引人注意和突然判断的语气；“看哪”庄重、清楚，也适合叙事中的直接引语。
- source_word: שָׂכַר עָלֵינוּ
  choice: 雇了……来攻击我们
  rationale: שׂכר 是“雇用”，עַל 在此有敌对含义；结合句末 לָבוֹא עָלֵינוּ，译文自然表达雇请诸王前来敌对他们，未增添“雇佣兵”等原文没有的宾语。
- source_word: מַלְכֵי הַחִתִּים
  choice: 赫人的众王
  rationale: 保留原文复数“众王”，不将其化约为单一统治者；“赫人”是 חִתִּים 的常用中文名称。
- source_word: מַלְכֵי מִצְרַיִם
  choice: 埃及的众王
  rationale: 忠实保留原文颇为醒目的复数形式，不因历史推断而改成“埃及王”。
- source_word: לָבוֹא עָלֵינוּ
  choice: 来攻击我们
  rationale: 字面为“来对付／反对我们”；军事语境下“来攻击我们”是清楚自然的表达。
theological_decisions:
- issue: 神圣称号 אֲדֹנָי 的译法
  choice: 主
  alternative: 主人／主宰
  rationale: 上下文明确指以色列之神。“主”准确保留称号性质，也不把 אֲדֹנָי 与四字神名混同。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“因为”表明本节是在解释前文亚兰军逃跑的原因；直接引语使用“看哪”保留突然而惊惧的判断语气。
