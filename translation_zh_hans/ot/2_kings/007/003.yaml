  text: וְ/אַרְבָּעָ֧ה אֲנָשִׁ֛ים הָי֥וּ מְצֹרָעִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מָ֗ה אֲנַ֛חְנוּ יֹשְׁבִ֥ים פֹּ֖ה עַד מָֽתְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: zh_hans
  text: 有四个患皮肤病的人[a]在城门入口处。他们彼此说：“我们为什么坐在这里等死呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“麻风病人”。这里的希伯来语指患有צָרַעַת（察拉阿特）一类病症的人，不一定等同于现代医学所说的麻风病（汉森病）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: 有四个……的人
  rationale: 希伯来语以连接词引入新场景，并用存在句介绍四名人物。现代汉语用“有四个”自然表达，不额外加入原文没有的显性时间词。
- source_word: מְצֹרָעִים
  choice: 患皮肤病的人
  rationale: 该词指患有与צָרַעַת相关病症的人，未必等同于现代医学所说的麻风病（汉森病）；正文采用较宽泛且易懂的表达，传统译法放入脚注。
- source_word: פֶּתַח הַשָּׁעַר
  choice: 在城门入口处
  rationale: 该结构直指门的开口或入口；上下文中的שַׁעַר为城门，译作“城门入口处”清楚自然。
- source_word: וַיֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: 他们彼此说
  rationale: 单数分配式习语表达群体成员互相说话，“彼此说”简洁保留其相互性。
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: 我们为什么坐在这里
  rationale: 疑问词מָה在此为反问性的“为什么”；分词יֹשְׁבִים表示持续坐着、留在原地的状态，正文保留“坐”的具体形象。
- source_word: עַד מָתְנוּ
  choice: 等死
  rationale: 字面意思是“直到我们死”；在汉语反问句中，“坐在这里等死”自然准确地表达留在原处直至死亡的结果。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“皮肤病”避免不当锁定现代病名；“坐在这里等死”保留原文的坐姿意象，同时符合自然汉语。
