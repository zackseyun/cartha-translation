  text: Then the gatekeepers called out and reported it inside the king’s house[a].
translation:
  language: zh_hans
  text: 守城门的人就高声呼喊，把消息报到王宫里面[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把消息报给王的家里的人。”希伯来文直译为“把消息报到王的家里面”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 高声呼喊
  rationale: קרא在这里表示出声传递消息；“高声呼喊”符合守门人从城门处向内通报的场景。希伯来文动词虽为单数，主语“守城门的人”具有集合意义，中文无需刻意体现数的不一致。
- source_word: הַשֹּׁעֲרִים
  choice: 守城门的人
  rationale: שֹׁעֲרִים指在城门处值守的人。“守城门的人”比“门房”更贴合古代城门语境，也比“守卫”更直接保留其岗位含义。
- source_word: וַיַּגִּידוּ
  choice: 报信
  rationale: נגד意为使人知道、禀报；本句所报内容由上下文补足。“报信”自然表达消息被逐级传入王宫。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的家／房屋”，在叙事语境中可指君王的宫殿或王室内部。“王宫”是现代中文中自然简洁的对应，但脚注保留其可能指王室人员的歧义。
- source_word: פְּנִימָה
  choice: 里面
  rationale: 该方向副词表示“向内、到里面”；“向王宫里面”保留消息由城门向内部传递的方向感。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“高声呼喊”呈现通报动作，“向王宫里面报信”保留原文略显浓缩的空间方向，同时用脚注说明“王的家”也可能侧重王室人员。
