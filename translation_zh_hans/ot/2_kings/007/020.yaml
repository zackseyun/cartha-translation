  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: zh_hans
  text: 事情果然这样临到他：百姓在城门处[a]践踏他，他就死了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在城门口”或“在城门通道内”。希伯来语可指城门处、门道，或整个城门区域。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: 事情果然这样临到他
  rationale: 该表达由“发生／成为”、介词 ל 加代词及 כֵן 构成，表明事情照先前所说的临到他。“果然这样临到他”既自然，也保留预言应验的含义，而不另加神学解释。
- source_word: וַיִּרְמְסוּ
  choice: 踩死
  rationale: רמס 指践踏、踩踏；本句随即说明他死亡。现代汉语用“把他踩死了”自然地表达踩踏动作及其明确结果，并避免生硬的“践踏他”。
- source_word: הָעָם
  choice: 百姓
  rationale: עַם 通常指“人民、百姓”。此处虽是在城门处涌动的人群，仍采用与原文名词对应的“百姓”，不改译为较具场景解释性的“人群”。
- source_word: בַּשַּׁעַר
  choice: 在城门口
  rationale: שַׁעַר 可指城门、门道或整个城门区域。“在城门口”符合现代汉语习惯，同时保留地点范围上的一定弹性。
- source_word: וַיָּמֹת
  choice: 死了
  rationale: 原文直接叙述“他死了”。汉语将其与前面的踩踏动作合为“把他踩死了”，清楚而自然地传达原文所述结果。
theological_decisions:
- issue: 审判与预言应验的措辞
  choice: 以“事情果然这样临到他”表明先前所说之事确实应验，但不在正文中明说这是神的审判。
  alternative: 可作“于是审判临到他”，直接凸显神圣审判。
  rationale: 上下文已表明这是以利沙所说之话的应验，但本节本身采用叙事陈述。译文保留这种叙事方式，不加入原句未明说的神学说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“果然”承接上下文中的预言，“临到他”略带经文语体但仍属现代通行表达。脚注标记已置于正文相关地点。
