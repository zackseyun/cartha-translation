    rationale: וַיִּרְמְסוּ ... וַיָּמֹת 依次为“践踏他”与“他死了”。合并译法虽符合情境，却将后一句独立叙述压缩为使役结果；分句翻译可更完整保留原文表达。
  - severity: low
