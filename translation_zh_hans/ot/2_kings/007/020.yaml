  naturalness: “事情果然这样临到他”自然且有适度经文叙事色彩。“百姓在城门处践踏他，他就死了”在现代标准汉语中清楚、庄重，也比“把他踩死了”更贴近原文句法推进。
  terminology: “百姓”对应 הָעָם 合宜；“践踏”对应 רמס 准确。“城门处”可涵盖城门区域，避免将地点限定为单纯的门口或城门内部。脚注应以自然汉语说明“城门”一词可指门口、门道或整个城门区域。
