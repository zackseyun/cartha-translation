  naturalness: 整体庄重自然。“王倚着他的手的那位军官”虽较字面，仍可懂，并比“倚重”更忠实；其余对话流畅。
  terminology: “军官”“神人”“雅威”均可取。“看哪”适合本段庄重、带讥诮与宣告色彩的语体。
