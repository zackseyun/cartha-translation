base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: zh_hans
  text: 王倚着他的手的那位军官回答神人说：“看哪，即使雅威在天上开窗，这事岂能发生呢？”神人说：“看哪，你必亲眼看见，却不能吃其中的。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: 军官
  rationale: 该词指高级军事或王室官员；“军官”在现代汉语中清楚自然，又不武断限定具体军衔。
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: 王所倚重的
  rationale: 原文直译为王倚靠其手；结合宫廷语境，该表达既描绘近身扶持，也暗示受信任的身份。汉语用“倚重”自然传达这层关系，避免生硬的“倚在他手上”。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留希伯来语对先知的固定称谓，不直接释为“先知”。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为引人注意并带强调意味的话语标记，“看哪”庄重而易懂，也适合本句的讥诮和回应语气。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按其辅音形式转写上帝的专名，而不以“主”这一称号替代。
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: 在天上开窗
  rationale: 保留原文“天上的窗”这一超常供应自上而下倾注的形象；汉语以“开窗”表达比“造窗”更自然。
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: 这事岂能发生呢
  rationale: 反问句准确传达军官对事情可能性的怀疑和讥诮。
- source_word: רֹאֶה בְּעֵינֶיךָ
  choice: 亲眼看见
  rationale: 以自然汉语保留“用你的眼睛看见”的强调。
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: 却一点也吃不到
  rationale: 语境所指是前文预告的粮食供应；该译法自然表达虽见却不得分享的结局，同时避免将 מִשָּׁם 生硬直译为“从那里”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用较贴近学界通行重构发音的“雅威”，保留其作为专名的性质，不用称号替代。
- issue: 军官的话是假设还是断言
  choice: 即使雅威在天上开窗，这事岂能发生呢？
  alternative: 看哪，雅威在天上开窗，这事会发生吗？
  rationale: 原文没有明示“如果”的条件词，但句法和反问语境表达不可置信的设想；“即使”自然呈现其怀疑，同时不把话解释为雅威实际正在开窗。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事体。“看哪”保留经文语体和双方话语的针锋相对；正文仅设置一处确有必要的脚注，并已在相应位置标出[a]。
