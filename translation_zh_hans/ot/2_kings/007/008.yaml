  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: zh_hans
  text: 这些麻风病人[a]来到营地边缘，进了一顶帐篷，吃喝之后，从那里拿走金银和衣服，便把这些东西藏起来。随后，他们回来，又进了另一顶帐篷，从那里拿走东西，也把拿走的东西藏起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文所称的是患有一种皮肤病的人，传统上译作“麻风病人”；这种古代病名可能包括比现代医学所说的麻风病更广的一类病症。
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: 麻风病人
  rationale: 沿用汉语圣经传统中简洁、易懂的叙事称呼；希伯来词所指的皮肤病范围可能广于现代医学所称的麻风病，因此用脚注说明。
- source_word: קְצֵה הַמַּחֲנֶה
  choice: 营地边缘
  rationale: 准确表达 קָצֶה 的空间含义，现代汉语自然清楚。
- source_word: אֹהֶל אֶחָד
  choice: 一顶帐篷
  rationale: 保留原文明确出现的数词“一”，也符合具体而连续的叙事语境。
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: 又吃又喝
  rationale: 简洁传达两个连续动作，并保留原文叙事的明快节奏。
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: 从那里拿走
  rationale: נשא 在此表示将财物带走；“拿走”在现代汉语中自然，也不额外强化为抢掠。
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: 金银和衣服
  rationale: “金银”是自然的汉语并列表达；“衣服”比“衣裳”更现代，同时忠实表达 בְּגָדִים。
- source_word: וַיַּטְמִנוּ
  choice: 藏了起来
  rationale: 该动词表示隐藏、藏匿；原文没有明确说明埋入地下，因此不译作“埋藏”。
- source_word: וַיָּשֻׁבוּ
  choice: 随后，他们回来
  rationale: 表达叙事动作的继续和先后次序，不给“回来”增加原文没有说明的具体目的地。
- source_word: אֹהֶל אַחֵר
  choice: 另一顶帐篷
  rationale: 自然、准确地表达 אַחֵר 的“另一个”含义。
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: 从那里拿走东西
  rationale: 第二处原文省略宾语；汉语补出泛指的“东西”，使句意完整，同时不擅自限定物品种类。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文连续动作的节奏，并以“一顶帐篷／另一顶帐篷”呈现具体次序；对古代皮肤病术语的范围用脚注交代，避免将其等同于单一的现代医学诊断。
