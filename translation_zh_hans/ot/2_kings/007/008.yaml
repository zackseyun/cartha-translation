revisions:
- from: 这些麻风病人[a]来到营地边缘，进了一顶帐篷，又吃又喝，并从那里拿走金银和衣服，去藏了起来。随后，他们回来，又进了另一顶帐篷，从那里拿走东西，去藏了起来。
  to: 这些麻风病人[a]来到营地边缘，进了一顶帐篷，吃喝之后，从那里拿走金银和衣服，便把这些东西藏起来。随后，他们回来，又进了另一顶帐篷，从那里拿走东西，也把拿走的东西藏起来。
  rationale: 修订仅澄清两处“藏”的隐含宾语，准确反映原文中先拿取、后藏匿物品的动作链。第一处用“这些东西”回指金银和衣服；第二处用“拿走的东西”对应原文保留的宾语省略，未擅自指定物品。其余译文及脚注均可保留。
