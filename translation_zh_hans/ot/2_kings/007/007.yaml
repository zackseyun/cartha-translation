base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: zh_hans
  text: 于是他们在暮色中起身逃走[a]，撇下帐篷、马匹、驴和照原样留下的营地[b]；他们逃命而去[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“在黄昏时”或“在昏暗时”。原词可指昼夜交替时的昏暗，具体是黄昏还是黎明有争议；这里按上下文译作“暮色”。
    reason: lexical_alternative
  - marker: b
    text: 直译“营地照原样”，即营地保持他们离开时原有的样子。
    reason: lexical_alternative
  - marker: c
    text: 直译“向着自己的性命逃跑”，意思是为保全性命而逃。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: 趁暮色
  rationale: נֶשֶׁף指昼夜交替时的昏暗时段；本叙事语境通常理解为黄昏。“趁暮色”自然简洁，同时不过度限定具体时刻。
- source_word: וַיַּעַזְבוּ
  choice: 撇下
  rationale: עזב在仓促逃亡的语境中有丢下、弃置之意；“撇下”比中性的“留下”更能体现仓皇逃走。
- source_word: אָהֳלֵיהֶם
  choice: 帐篷
  rationale: 按军事营地语境直译复数名词及其所属关系；汉语列举中不必逐项重复“他们的”。
- source_word: סוּסֵיהֶם
  choice: 马
  rationale: סוּס的常用现代汉语对应词。
- source_word: חֲמֹרֵיהֶם
  choice: 驴
  rationale: חֲמוֹר指家养驴，采用现代汉语常用称呼。
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: 营地原封未动
  rationale: 该短语直义为“营地照原样”；“原封未动”自然表达他们仓促离去、营地保持原状的意思。
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: 他们逃命去了
  rationale: אֶל־נֶפֶשׁ在此表达为保全性命而逃；“逃命”是准确、自然且有紧迫感的汉语习语。
- source_word: וַיָּקוּמוּ
  choice: 他们起来
  rationale: 保留קום作为连续叙事动作开端的意义和节奏。
- source_word: וַיָּנ֣וּסוּ ... וַיָּנֻסוּ
  choice: 逃跑了……逃命去了
  rationale: 以两个同根的汉语逃亡表达保留原文动词重复所形成的紧迫感，同时使现代汉语行文自然。
