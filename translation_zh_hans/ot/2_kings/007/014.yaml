base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/014.yaml
  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: zh_hans
  text: 于是，他们取了两辆配有马匹的战车[a]；王派他们去追查亚兰营地的去向，说：“你们去看看。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文近似“两个马匹的战车”，是一种压缩的说法；可能指两辆由马拉的战车，也可能指两组战车和马匹。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 于是，他们套好
  rationale: 叙事性连续式推动情节；结合战车和马的搭配，“套好”自然表达备妥马车出发，同时不改变行动主体。
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: 两辆马拉的战车
  rationale: 原文是压缩且略显省略的表达，字面近似“两〔个〕马的战车/车队”。译作“两辆马拉的战车”符合上下文，也保留具体的战车图景；以脚注说明原文形式及其他理解。
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: 王派他们
  rationale: 原文“王派出”未明说宾语；中文依紧接的上下文补出“他们”，清楚指执行侦察任务的人。
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: 去追寻亚兰人的营地
  rationale: אַחֲרֵי在此表示循着已经撤离之营军的去向而去；“追寻”比静态的“在……后面”更自然，又避免强化为军事追击。מַחֲנֶה保留为“营地”。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 此处“亚兰的营地”自然指亚兰军队的营地；中文以“亚兰人的营地”表达属格关系，不采用可能引发现代地理联想的“叙利亚”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 保留引出直接引语的希伯来语叙述结构，现代中文简洁自然。
- source_word: לְכוּ וּרְאוּ
  choice: 你们去看看
  rationale: 两个复数命令语气简短直接；补出“你们”体现复数对象，“看看”自然传达侦察、查明情况之意，而不把含义收窄为正式“察看”。
theological_decisions: []
