  text: וַ/יָּ֨קָם הַ/מֶּ֜לֶךְ לַ֗יְלָה וַ/יֹּ֨אמֶר֙ אֶל עֲבָדָ֔י/ו אַגִּֽידָה נָּ֣א לָ/כֶ֔ם אֵ֛ת אֲשֶׁר עָ֥שׂוּ לָ֖/נוּ אֲרָ֑ם יָדְע֞וּ כִּי רְעֵבִ֣ים אֲנַ֗חְנוּ וַ/יֵּצְא֤וּ מִן הַֽ/מַּחֲנֶה֙ לְ/הֵחָבֵ֤ה ב/ה/שדה לֵ/אמֹ֔ר כִּֽי יֵצְא֤וּ מִן הָ/עִיר֙ וְ/נִתְפְּשֵׂ֣/ם חַיִּ֔ים וְ/אֶל הָ/עִ֖יר נָבֹֽא־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: zh_hans
  text: 王在夜里起来，对臣仆说：“让我告诉你们，亚兰[a]对我们做了什么。他们知道我们正挨饿，就从营地出去，藏在田野间，说：‘等他们出城，我们就活捉他们，进城。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”也可译为“亚兰人”；原文以地名“亚兰”指亚兰人或亚兰军。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הַמֶּלֶךְ לַיְלָה
  choice: 王夜里起来
  rationale: קום在此指王从睡卧或休息中起身；“夜里起来”自然、具体，并保留时间背景。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: 在王宫语境中指服侍王的人，也可能包括近臣；“臣仆”兼顾其王室身份与宽泛含义。
- source_word: אַגִּידָה נָּא לָכֶם
  choice: 让我告诉你们
  rationale: 意愿式加נָא表达提议或带急切意味的请求；汉语用“让我……”自然体现这一语气，无须生硬加入“请”。
- source_word: אֵת אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: 亚兰人对我们使了什么计谋
  rationale: 原文直译为“亚兰对我们所做的事”；上下文明确是王推断敌军设下埋伏，补出“计谋”使现代汉语清楚，而“亚兰人”表达地名代指其人民或军队。
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: 他们知道我们正挨饿
  rationale: “正挨饿”既表达持续饥饿的状态，也贴合围城饥荒的语境。
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: 就离开营地
  rationale: 指亚兰军已经撤出军营；“离开营地”比逐字的“从营地出去”更符合现代汉语。
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: 藏到野外
  rationale: 反身含义由“藏”在汉语中自然表达；שדה在此是城外可供伏兵藏身的旷野地带，“野外”比单数“田里”更合语境。
- source_word: לֵאמֹר
  choice: 心想
  rationale: 这里引出王所推测的亚兰人计划，而非必然是公开说出的话；“心想”自然呈现内心谋划，同时不把内容当作叙事者确认的事实。
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: 等他们出城
  rationale: כִּי在所设想的埋伏计划中引出预期时机；“等……出城”自然表达等待该条件发生。
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: 我们就活捉他们
  rationale: תפשׂ表示抓住、捕获，חיים表示活着；“活捉”准确而简洁。
- source_word: וְאֶל הָעִיר נָבֹא
  choice: 然后进城
  rationale: 保留行动次序；汉语无需重复主语，“然后”清楚连接活捉出城者与攻入城内。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。将“亚兰”这一地名代指的军队译作“亚兰人”，避免现代国家名称造成时代错置；王的话整体保留为其推测，而非叙事者对敌军意图的确认。
