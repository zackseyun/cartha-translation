  text: וַ/יֵּלְכ֣וּ אַחֲרֵי/הֶם֮ עַד הַ/יַּרְדֵּן֒ וְ/הִנֵּ֣ה כָל הַ/דֶּ֗רֶךְ מְלֵאָ֤ה בְגָדִים֙ וְ/כֵלִ֔ים אֲשֶׁר הִשְׁלִ֥יכוּ אֲרָ֖ם ב/החפז/ם וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יַּגִּ֖דוּ לַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: zh_hans
  text: 他们便跟在他们后面，直到约旦河。看哪，整条路上满是亚兰人[b]仓促中丢弃的衣服和器具[a]。使者[c]回来，把情况报告给王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “器具”所译的希伯来词含义宽泛，也可指物件、用具、装备或补给品。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“亚兰”，在这里以国名指亚兰人这一群体。
    reason: alternative_reading
  - marker: c
    text: 或译“侦察的人”。希伯来词直译为“使者”，这里指奉命出去查探的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: 他们便随后追去
  rationale: 表达叙事的连续推进，也保留“跟在他们后面、追随而去”的含义；不强化为交战式的追击。
- source_word: עַד הַיַּרְדֵּן
  choice: 一直到约旦河
  rationale: עַד表示所到范围的终点；“一直到”在现代汉语中清楚自然。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示读者注意眼前景象的鲜明话语标记。
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: 沿途到处都是
  rationale: 自然表达整条追踪路线遍布物品的景象，比逐字译作“全路充满”更符合现代汉语。
- source_word: בְגָדִים
  choice: 衣服
  rationale: 准确、通俗地表达遗弃的衣物；语体庄重而不过分古雅。
- source_word: וְכֵלִים
  choice: 器具
  rationale: כֵלִים是涵盖物件、用具和装备的宽泛词；“器具”保留其概括性，不限定为容器或纯军事装备。
- source_word: אֲשֶׁר הִשְׁלִיכוּ
  choice: 丢弃的
  rationale: 清楚表达这些物品是亚兰人在此前逃离过程中扔下的。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 原文以国名“亚兰”作集合性主体；汉语加“人”可自然表达其群体含义，同时不改换为后世地名。
- source_word: בְחָפְזָם
  choice: 仓促中
  rationale: 传达受压力之下匆忙行动的意思，但不额外断定为“惊慌”或“恐慌”。
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: 使者回来
  rationale: מַלְאָכִים基本义为受差遣传信的人；上下文中他们也承担侦察任务，但译作“使者”更贴近词义。
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ
  choice: 把情况报告给王
  rationale: “报告”符合受差遣者返回复命的语境；补出“情况”是汉语所需的自然宾语，并未增加具体内容。
