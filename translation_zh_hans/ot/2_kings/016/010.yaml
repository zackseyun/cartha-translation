  to: 亚哈斯王到大马士革去迎接亚述王提革拉毗列色。他看见了在大马士革的那座祭坛，就把那祭坛的样式和详细图样，标明它一切的做法，送给祭司乌利亚。
  rationale: 修订仅收紧末句对“按其全部做工”的表达：仍保留祭坛外形资料与图样这两个相邻概念，也表达图样涵盖全部制作细节，但不把原文解释成另行附送“各部分的制作方法”。其余叙事顺序、人名和未明说祭坛宗教归属的含蓄均予保留。
