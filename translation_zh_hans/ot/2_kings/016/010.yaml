base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: zh_hans
  text: 亚哈斯王到大马士革去迎接亚述王提革拉毗列色。他看见了在大马士革的那座祭坛，就把那祭坛的样式和详细图样，标明它一切的做法，送给祭司乌利亚。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: 迎接
  rationale: 该词表示前去会见或迎接某人；此处译作“迎接”自然，也保留亚哈斯主动前往会晤亚述王的含义。
- source_word: דְּמוּת הַמִּזְבֵּחַ
  choice: 祭坛的样式
  rationale: דמות在此指可供仿制的形状、式样或模型；“样式”既贴近原义，也避免误解为已制成的立体模型。
- source_word: תַּבְנִיתוֹ
  choice: 构造图
  rationale: תבנית可指形制、设计或图样；结合亚哈斯将资料送去供制作的语境，译作“构造图”清楚而不把两项近义表达合并。
- source_word: לְכָל־מַעֲשֵׂהוּ
  choice: 连同各部分的制作方法
  rationale: 直译近于“按着它全部的做工”。这里指祭坛整体及细部如何制作；该表达在现代汉语中较清楚地传达原文信息。
theological_decisions:
- issue: 是否说明该祭坛属于异教或亚述宗教
  choice: 不在正文中补明
  alternative: 译作“异教祭坛”或“亚述祭坛”
  rationale: 本节原文只称其为“大马士革的那座祭坛”，没有明说其宗教归属；应保留叙事本身的含蓄，不作神学性增补。
- issue: 如何表达亚哈斯所发送的资料
  choice: 保留“样式”和“构造图”两个相邻概念
  alternative: 合并为“祭坛的模型”
  rationale: 原文使用דמות和תבנית两个词；分别表达可保留其强调祭坛外形与构造细节的效果，同时不强行判定所送之物必为立体模型。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。调整希伯来语连续叙述中的多个“于是/又”连接，使中文流畅，同时完整保留事件顺序。人名依通行圣经译名处理。
