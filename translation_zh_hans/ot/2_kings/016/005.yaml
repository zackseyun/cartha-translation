  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: zh_hans
  text: 那时，亚兰王利汛和利玛利的儿子、以色列王比加上到耶路撒冷开战。他们围攻亚哈斯，却不能交战[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“却不能争战／交战”。“交战”后没有明说所针对的是亚哈斯还是耶路撒冷。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为叙事中的时间推进标记，自然承接前文，也可表达“于是/那时”的语义。
- source_word: יַעֲלֶה
  choice: 上到
  rationale: 保留עלה前往高处的空间意象；在前往耶路撒冷的语境中，“上到”符合圣经叙事常用表达。
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: 亚兰王利汛
  rationale: “亚兰”直接对应希伯来文地名אֲרָם；按现代汉语习惯将王号置于人名前。
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: 和利玛利的儿子、以色列王比加
  rationale: 保留父名与王号两个同位说明，并用顿号使修饰关系清楚自然。
- source_word: יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: 到耶路撒冷开战
  rationale: 同时表达目的地和军事目的，比直译“为战争”更符合现代汉语。
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: 他们围困亚哈斯
  rationale: צור在军事语境中指围攻、围困；עַל אָחָז明确把亚哈斯表述为围困所针对的对象。
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: 却不能攻克
  rationale: 字面为“却不能争战/作战”，但若译作“不能作战”会与已经围困的情节产生误导；“不能攻克”自然表达进攻未能成功，同时借脚注保留宾语不明的原文张力。
theological_decisions:
- issue: לְהִלָּחֵם未明说争战所针对的宾语
  choice: 正文译为“不能攻克”，不明说攻克亚哈斯还是耶路撒冷
  alternative: “不能与他交战”或“不能攻打这城”
  rationale: 希伯来文在“争战”之后没有重述宾语；上下文既可使读者联想到亚哈斯，也可联想到耶路撒冷。正文避免擅自确定指代，脚注说明歧义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。人名使用常见中文圣经译名；句式简洁，保留军事叙事力度，并通过脚注呈现末句在希伯来文中的宾语省略。
