base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: zh_hans
  text: 他把自己的燔祭和素祭焚烧献上，又倾倒了自己的奠祭，并把自己平安祭牲的血洒在祭坛上。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “平安祭”也可译作“团契祭”或“福祉祭”。希伯来语指一种特定的祭（שְׁלָמִים）。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: 焚烧献上
  rationale: 该动词在献祭语境中指使祭物在坛上焚烧、化为烟而献上；“焚烧献上”既体现动作，也保留礼仪含义。
- source_word: עֹלָתוֹ
  choice: 自己的燔祭
  rationale: עֹלָה是特定祭类，现代中文圣经语汇通常称“燔祭”；物主后缀译作“自己的”。
- source_word: מִנְחָתוֹ
  choice: 素祭
  rationale: מִנְחָה在此祭祀语境中特指以谷物为主的祭物；“素祭”是简洁且通行的中文祭类名称。
- source_word: וַיַּסֵּךְ אֶת נִסְכּוֹ
  choice: 浇上自己的奠祭
  rationale: נסך表示浇奠，נֶסֶךְ指奠祭；“浇上”自然表达祭液倾倒在坛上的礼仪动作。
- source_word: וַיִּזְרֹק
  choice: 洒
  rationale: זרק指把血泼、掷或洒向祭坛，并非细微喷撒；中文祭祀语境中“洒在祭坛上”自然且能表达其动作方向。
- source_word: דַּם הַשְּׁלָמִים
  choice: 平安祭牲的血
  rationale: שְׁלָמִים是特定祭类，传统且易懂的中文名称为“平安祭”；补出“祭牲”使“血”的来源在中文中更清楚。
- source_word: אֲשֶׁר לוֹ
  choice: 自己的
  rationale: 该短语最自然地表明这些平安祭属于亚哈斯；依本节主语用反身物主形式表达。
- source_word: עַל הַמִּזְבֵּחַ
  choice: 在祭坛上
  rationale: עַל与זרק连用时可指把血洒到或泼向祭坛；“在祭坛上”符合自然中文，同时不把具体接触方式规定得过细。
theological_decisions:
- issue: שְׁלָמִים祭类名称
  choice: 平安祭
  alternative: 团契祭；福祉祭
  rationale: 原词的词源和祭礼功能允许不同侧重；正文采用通行且可理解的“平安祭”，脚注保留其他可能译法，避免把其神学意义限于单一解释。
translation_notes:
  register: 采用现代、庄重而易懂的祭祀用语。“燔祭、素祭、奠祭、平安祭”保留各祭类的区分；句式按希伯来文连续动作展开，同时用自然中文衔接。脚注标记置于全句末，所注释对象在正文中明确可辨。
