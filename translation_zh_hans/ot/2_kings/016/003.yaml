source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: zh_hans
  text: 他走以色列诸王的道路，甚至使自己的儿子经火[a]，照着耶和华从以色列人面前赶出的列国的可憎行径而行。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把自己的儿子献在火中。”希伯来文直译为“使自己的儿子经火”，这是与受谴责的异教仪式有关的表达。
    reason: 保留原文惯用语的歧义，并说明一种较明确的理解。
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: 行……所行的道
  rationale: 这是描述行为方式的希伯来语惯用表达；译文保留“行道”的比喻，同时用汉语重叠结构自然地表达效法前人的行为。
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: 以色列诸王
  rationale: 指北国以色列历代君王；“诸王”简洁表达复数及群体性的道德参照。
- source_word: וְגַם
  choice: 甚至
  rationale: 该词在此具有递进和加强语气，不只是简单的“也”。
- source_word: אֶת־בְּנוֹ
  choice: 自己的儿子
  rationale: 保留原文单数；“自己的”在汉语中清楚表明主语与其子的关系。
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: 使自己的儿子从火中经过
  rationale: 保留使役形式和“经火”的原文意象，不在正文中断定这一仪式的全部具体方式；脚注说明可能的祭献含义。
- source_word: כְּתֹעֲבוֹת הַגּוֹיִם
  choice: 照着……列国所行的可憎之事而行
  rationale: כְּ表示依照或仿效；补出“所行”和末尾“而行”，使汉语句法完整，并清楚表达他仿效列国的恶俗。
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: 所……赶出去的
  rationale: הורישׁ在此指从土地上逐出、剥夺其居所；“赶出去”准确且易懂。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的神名形式，作为四字神名的专名表达，而非以“主”这一称号代替。
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: 从以色列人面前
  rationale: 保留“从……面前”的空间意象；בני ישראל在此是民族称谓，现代汉语以“以色列人”表达最自然准确。
theological_decisions:
- issue: הֶעֱבִיר בָּאֵשׁ是否应明确译为把儿子焚烧献祭
  choice: 正文保留“使自己的儿子从火中经过”这一原文惯用语
  alternative: 把自己的儿子献在火中；把自己的儿子用火焚烧
  rationale: 上下文明确谴责一种异教仪式，但本节的希伯来措辞本身没有交代仪式的所有细节。保留原有表达可避免在正文中作过度断定，同时借脚注提示献祭的可能解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“行……所行的道”保留原文的道德行为隐喻；其余句式尽量避免生硬直译。脚注标记置于其实际说明的“从火中经过”之后。
