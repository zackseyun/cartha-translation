  naturalness: 行文庄重、清楚，符合现代标准汉语的经文语域。“晚间的素祭”较“晚上的素祭”稍更凝练；“全地民众”比“全国民众”更贴近“这地的全体人民”，且不额外强化现代国家概念。
  terminology: “燔祭、素祭、奠祭、铜祭坛”均为稳定且恰当的祭祀术语。“焚献”可准确传达使祭物焚烧升腾的献祭动作。脚注对לְבַקֵּר的多种可能及不确定性处理适当。
