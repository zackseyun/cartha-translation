  text: ו/יצו/הו הַ/מֶּֽלֶךְ אָ֠חָז אֶת אוּרִיָּ֨ה הַ/כֹּהֵ֜ן לֵ/אמֹ֗ר עַ֣ל הַ/מִּזְבֵּ֣חַ הַ/גָּד֡וֹל הַקְטֵ֣ר אֶת עֹֽלַת הַ/בֹּקֶר֩ וְ/אֶת מִנְחַ֨ת הָ/עֶ֜רֶב וְֽ/אֶת עֹלַ֧ת הַ/מֶּ֣לֶךְ וְ/אֶת מִנְחָת֗/וֹ וְ֠/אֵת עֹלַ֞ת כָּל עַ֤ם הָ/אָ֨רֶץ֙ וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֔ם וְ/כָל דַּ֥ם עֹלָ֛ה וְ/כָל דַּם זֶ֖בַח עָלָ֣י/ו תִּזְרֹ֑ק וּ/מִזְבַּ֧ח הַ/נְּחֹ֛שֶׁת יִֽהְיֶה לִּ֖/י לְ/בַקֵּֽר־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: zh_hans
  text: 亚哈斯王吩咐乌利亚祭司说：“你要在大祭坛上焚献早晨的燔祭和晚间的素祭，也要献王的燔祭和素祭，以及全地民众的燔祭、素祭和奠祭；所有燔祭的血和所有祭牲的血，你都要洒在这坛上。至于铜祭坛，我要留作求问之用[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求问”或译“察看”、“考察”，也可能指“借此寻求指引”。希伯来原文含义不明确，因此无法确定亚哈斯为铜祭坛保留的确切用途。
    reason: 保留לְבַקֵּר在此处难以确定的语义及相应的神学张力。
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז אֶת אוּרִיָּה הַכֹּהֵן
  choice: 亚哈斯王吩咐乌利亚祭司
  rationale: “吩咐”保留王命的权威语气，又符合现代汉语叙事；王号与人名按自然汉语次序表达。
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: 在大祭坛上
  rationale: 直译形容词“大的”，并在上下文中将新祭坛与铜祭坛区别开来，不擅自解释为“主祭坛”。
- source_word: הַקְטֵר
  choice: 焚献
  rationale: 该使役式动词指使祭物在坛上焚烧升腾；“焚献”兼顾实际动作与献祭语境。
- source_word: עֹלַת הַבֹּקֶר וְאֶת מִנְחַת הָעֶרֶב
  choice: 早晨的燔祭和晚上的素祭
  rationale: 采用现代中文圣经语域中清楚而稳定的祭祀术语；保留早晚的对应结构。
- source_word: עֹלַת הַמֶּלֶךְ וְאֶת מִנְחָתוֹ
  choice: 王的燔祭和素祭
  rationale: 希伯来语后项的代词指王；中文省去重复的“他的”，所指仍明确且更自然。
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: 全国民众的燔祭
  rationale: 这里的עם הארץ泛指本地全体民众；“全国民众”自然传达集合意义，同时避免将其限定解释为某一社会阶层。
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: 素祭和奠祭
  rationale: 两个复数后缀均指民众；汉语用集合性祭名即可自然涵盖多人所献之祭。
- source_word: וְכָל דַּם עֹלָה וְכָל דַּם זֶבַח
  choice: 所有燔祭的血和其他祭牲的血
  rationale: 保留燔祭与זבח所指其他祭牲之间的区别；补入“其他”可避免中文误以为燔祭不属于祭祀。
- source_word: עָלָיו תִּזְרֹק
  choice: 你都要洒在这坛上
  rationale: זרק指将祭牲之血泼洒于坛上；“洒”是自然的中文祭祀用语，“这坛”明确回指大祭坛。
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת יִהְיֶה לִּי לְבַקֵּר
  choice: 至于铜祭坛，我要留作求问之用
  rationale: 句式突出铜祭坛与大祭坛用途的对比；“求问”保留可能的咨询、寻求指引之意，并以脚注说明原文的不确定性。
theological_decisions:
- issue: לְבַקֵּר所表示的铜祭坛用途
  choice: 留作求问之用
  alternative: 留作察看之用／留作考察之用／借此寻求指引
  rationale: 该短语含义困难，可能表示察看、考察，也可能指某种求问或寻求指引。正文采用与祭祀语境相称的“求问”，但不把它具体化为某种占卜仪式；脚注保留其他真实可能。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言；保留“燔祭、素祭、奠祭、祭坛”等必要且通行的祭祀术语。长串祭物按中文节奏分组，并以分号呈现献祭与洒血两个命令。
