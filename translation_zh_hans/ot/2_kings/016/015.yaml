  rationale: 修改“其他祭牲的血”，以免加入原文未明说的排除性限定；将“全国民众”调整为“全地民众”，更直接对应עַם הָאָרֶץ；并微调“晚间”以改善中文节奏。其余译文和脚注均可保留。
