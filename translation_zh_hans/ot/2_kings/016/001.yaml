    issue: “利玛利”未完整对应人名רְמַלְיָהוּ。
    rationale: 原文人名含神名成分词尾־יָהוּ；译作“利玛利雅”可避免无依据地省略该部分。
  - severity: medium
    issue: “犹大王约坦的儿子亚哈斯”可能在中文中被理解为约坦是犹大王。
    rationale: 希伯来文的“犹大王”与“约坦的儿子亚哈斯”同位，指亚哈斯。改为“约坦的儿子亚哈斯登基为犹大王”可清楚呈现其修饰关系。
  revised_text: 利玛利雅的儿子比加在位第十七年，约坦的儿子亚哈斯登基为犹大王。
