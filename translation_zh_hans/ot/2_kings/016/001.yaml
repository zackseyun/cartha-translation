base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: zh_hans
  text: 利玛利雅的儿子比加在位第十七年，约坦的儿子亚哈斯登基为犹大王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: 在位第十七年
  rationale: 这是列王纪常见的君王纪年格式；结合后面的 לְפֶקַח，表示按比加在位年数计算的第十七年。中文用“在位第十七年”既准确又自然。
- source_word: לְ/פֶקַח בֶּן רְמַלְיָהוּ
  choice: 利玛利的儿子比加
  rationale: 介词 לְ 标明纪年所依据的君王；“利玛利的儿子比加”保留希伯来文的父子称谓，并符合现代汉语语序。
- source_word: מָלַךְ
  choice: 登基
  rationale: 在君王纪年公式中，此处的完成式表示开始作王，而非概述整个统治时期。“登基”简洁地表达即位之始。
- source_word: אָחָז בֶּן יוֹתָם
  choice: 约坦的儿子亚哈斯
  rationale: 按现代中文自然语序表达父子关系，并采用通行的圣经人名译法。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 该称号与“约坦的儿子亚哈斯”构成同位关系；置于其前，中文更流畅，也清楚表明亚哈斯所登的是犹大王位。
