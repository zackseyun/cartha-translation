reference: 2 Kings 16:7
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: zh_hans
  text: 于是亚哈斯派使者到亚述王提革拉·毗列色那里，说：“我是你的仆人，也是你的儿子[a]。请上来，救我脱离亚兰王[c]的手，也脱离以色列王的手[b]；他们正在攻击我。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “你的仆人，也是你的儿子”是表示臣服的外交用语；其中“仆人”也可按其外交含义译为“臣属”，但正文保留原文措辞。
    reason: lexical_alternative
  - marker: b
    text: “脱离……的手”是希伯来语习语，意思是脱离某人的权势或控制。
    reason: lexical_alternative
  - marker: c
    text: “亚兰”传统上也译作“叙利亚”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 差遣
  rationale: 这是叙事中常见的动词；“差遣”自然地表达君王派出人员执行任务。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处指承担外交使命的人，不是天使；“使者”既准确又不把其正式身份限定得过窄。
- source_word: תִּגְלַת פְּלֶסֶר
  choice: 提革拉·毗列色
  rationale: 采用现代中文圣经人名中常见的音译，并以间隔号清楚标示复合音译名。
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: 你的仆人，也是你的儿子
  rationale: 保留原文的臣服与亲属隐喻；“也是”使现代汉语句子顺畅，却不把二者合并为单一政治术语。
- source_word: עֲלֵה
  choice: 请上来
  rationale: 保留עלה“上来”的空间意象；上下文已显明这是请求亚述王出兵干预，无须在正文中增添“进军”。
- source_word: וְהוֹשִׁיעֵנִי
  choice: 救我
  rationale: 忠实呈现ישע使役式的“拯救、解救”含义；本节语境清楚表明所指是军事和政治上的解救。
- source_word: מִכַּף
  choice: 脱离……的手
  rationale: 保留希伯来语以“手”表示权势或控制的具体比喻，同时以“脱离……的手”构成自然中文。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 按原文的古代族国名称翻译，避免使用可能令人联想到现代国家的“叙利亚”。
- source_word: הַקּוֹמִים עָלָי
  choice: 他们正起来攻击我
  rationale: “正”体现分词所表达的持续状态；“起来攻击”兼顾原文“起来反对”的意象和敌对行动的语境。
theological_decisions:
- issue: 亚哈斯求援时自我降卑的外交措辞
  choice: 正文直译为“你的仆人，也是你的儿子”
  alternative: 意译为“你的臣属”或“你的附庸”
  rationale: 原文同时使用服役和亲属关系的语言，表明政治臣服。保留两重隐喻，可避免把古代外交关系过早归入单一现代术语。
- issue: “救我”的军事政治含义
  choice: 保留“救我”
  alternative: 译作“解救我”或“援救我”
  rationale: 此处直接指从敌国君王的权势下获救，但原词在经文其他地方也有更广泛的“拯救”用法；“救我”既符合本节语境，也保留词汇联系。
- issue: “手”的权势隐喻
  choice: 正文保留“手”
  alternative: 直接译为“权势”或“控制”
  rationale: 具体意象是原文修辞的一部分；脚注说明其含义，可兼顾透明度和现代读者理解。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。句法保留原文外交请求的直接语气和“仆人／儿子”“上来”“手”等核心意象；借助少量脚注解释古代外交语言和希伯来语习语，不在正文中加入解释性神学术语。
