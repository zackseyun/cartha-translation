  text: וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּעַל֩ מֶ֨לֶךְ אַשּׁ֤וּר אֶל דַּמֶּ֨שֶׂק֙ וַֽ/יִּתְפְּשֶׂ֔/הָ וַ/יַּגְלֶ֖/הָ קִ֑ירָ/ה וְ/אֶת רְצִ֖ין הֵמִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: zh_hans
  text: 亚述王就听了他的话[a]。亚述王上去攻打大马士革，攻取了那城，把城中居民掳到吉珥[b]，又处死了利汛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“听从了他”。希伯来文动词可指听取并采取相应行动。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译“把它掳到吉珥”，这里以城指代城中居民。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: 听了他的话
  rationale: שׁמע与אֶל连用，可指听取并作出回应。译作“听了他的话”既自然，也由下文的军事行动表明亚述王采纳了亚哈斯的请求。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 这是直接的属格结构。两次重复“亚述王”，对应希伯来文的重复并保留叙事强调。
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: 上去攻打大马士革
  rationale: עלה与אֶל在军事叙事中可表示向某城进军；结合随后“攻取、掳走、处死”等动作，“攻打”准确呈现敌对含义。
- source_word: וַיִּתְפְּשֶׂהָ
  choice: 攻取了那城
  rationale: תפשׂ在此指夺取并控制一座城；“那城”明确指大马士革，也自然承接中文语境。
- source_word: וַיַּגְלֶהָ קִירָה
  choice: 把城中居民掳到吉珥
  rationale: 希伯来文直译为“把它掳到吉珥”，以城代指居民。中文把隐含的居民明说出来，更合乎习惯；“掳到”保留强制迁徙的含义。
- source_word: קִירָה
  choice: 吉珥
  rationale: 地名קִיר采用《圣经》中文传统中通行的音译“吉珥”；词尾方向性成分由“到”表达。
- source_word: וְאֶת רְצִין הֵמִית
  choice: 又处死了利汛
  rationale: המית意为使其死亡；“处死”在此自然地表达对被征服君王的杀戮，并保留执行死刑般的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文两次重复“亚述王”的强调；在不改变所指的前提下，将城市代指居民的转喻显明为“城中居民”。
