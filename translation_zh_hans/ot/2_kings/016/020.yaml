base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: zh_hans
  text: 亚哈斯与他的列祖同睡[a]，也与列祖同葬在大卫城。他的儿子希西家接续他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与他的列祖同睡”是希伯来文中常见的王室去世通告，意思是亚哈斯死了，归到他的祖先那里。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 与“与他的列祖”合成王室去世通告中的固定表达；保留希伯来文的委婉说法和公式化特征，而不直接释作“死了”。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: “列祖”既贴近原文“父辈”，也自然表达祖先及王朝世系，比单说“父亲们”更符合现代汉语。第二次出现时省去“他的”，避免中文累赘而不损失所指。
- source_word: וַיִּקָּבֵר
  choice: 同葬
  rationale: 原文为被动式，意为“被安葬”；在“与列祖”这一结构中译作“同葬”更自然，并保留共同安葬的含义。
- source_word: בְּעִיר דָּוִד
  choice: 在大卫城
  rationale: 采用这一地名在现代中文圣经语境中的通行、简明表达。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位继承通告中，该动词表示登基并执掌王权；与“接续他”连用，准确自然。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: בְנוֹ
  choice: 他的儿子
  rationale: 明确保留原文的父子关系。
- source_word: תַּחְתָּיו
  choice: 接续他
  rationale: 在王位继承语境中表示取代前王、继位；“接续他作王”是自然且准确的现代汉语表达。
