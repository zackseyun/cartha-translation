  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: zh_hans
  text: 祭司乌利亚建造了那座坛，完全照着亚哈斯王从大马士革送来的一切；祭司乌利亚就这样做，直到亚哈斯王从大马士革来到。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 建造了
  rationale: בנה是“建造”的常用动词；此处指实际筑造祭坛。
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: 祭司乌利亚
  rationale: 按现代汉语自然语序表达，并保留原文两次出现的身份称谓，以维持强调。
- source_word: הַמִּזְבֵּחַ
  choice: 那座坛
  rationale: מזבח指献祭用的坛；定冠词在上下文中指前一节所描述的特定祭坛，因此译作“那座坛”。
- source_word: כְּכֹל אֲשֶׁר שָׁלַח
  choice: 完全照着……送来的一切
  rationale: 保留“照着全部所送之物”的符合关系，也保留原文未明说所送内容究竟是图样、模型还是指示的省略，不擅自补定。
- source_word: מִדַּמֶּשֶׂק
  choice: 从大马士革
  rationale: מִן表示来源；两处均直译，并保持重复。
- source_word: כֵּן עָשָׂה
  choice: 就照样做了
  rationale: 该表达强调乌利亚按亚哈斯所传来的内容执行；“照样”自然地传达对应和遵从。
- source_word: עַד בּוֹא
  choice: 在……回来以前
  rationale: עַד加不定式结构标示王到达这一时间界限；结合叙事语境，此译清楚表达祭坛在王返回前已按样完成。
- source_word: הַמֶּלֶךְ אָחָז
  choice: 亚哈斯王
  rationale: 符合现代汉语对王号加专名的惯常语序。
