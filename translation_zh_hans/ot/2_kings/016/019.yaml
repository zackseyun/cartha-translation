  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָחָ֖ז אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/019.yaml
  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 亚哈斯其余所行的事，不都记在《犹大列王纪》[a]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：《犹大列王年鉴》。
    reason: 原文דִּבְרֵי הַיָּמִים可指按日或按年编录的史事，因此“年鉴”也是合适的译法。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: 其余……的事
  rationale: יֶתֶר意为“其余、剩下的”，דִּבְרֵי在列王纪的君王总结套语中指其事迹或政事；译为“其余……的事”自然且符合史书语境。句首וְ在此承接上下文，现代汉语不必机械译成“又”。
- source_word: אָחָז
  choice: 亚哈斯
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所行的
  rationale: 保留原文关系从句“他所做的”，并以简洁庄重的现代汉语表达。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记……吗
  rationale: הֲלֹא引出预期肯定回答的反问；“不都记……吗”准确传达这一语气。כְּתוּבִים直义为“写着”，在文献语境中译作“记”更自然。
- source_word: עַל סֵפֶר
  choice: 记在……上
  rationale: 保留עַל的表面意象，同时符合汉语提及书面记载时的惯用表达。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王纪》
  rationale: 该短语指与犹大诸王有关的编年记录；“列王纪”简洁、庄重，并保留其标题性质。另以脚注给出“年鉴”这一更明确体现档案性质的译法。
theological_decisions:
- issue: 文献名称是否等同于正典《历代志》
  choice: 译作《犹大列王纪》，不直接认定为现存正典书卷
  alternative: 《犹大列王年鉴》
  rationale: 原文只是列王时期史料的标题式称呼，不能据此断定它就是现存的《历代志》；正文保留传统史书标题风格，脚注呈现“年鉴”的词义可能。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以简洁反问句保留希伯来文君王总结套语的结构和语气；书名使用书名号，脚注标记紧随存在词义差异的文献名称。
