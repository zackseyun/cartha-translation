base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: zh_hans
  text: 王从大马士革回来，看见了那座祭坛；王便走近祭坛，登上坛去。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“走近祭坛，在坛上献祭。”有些人认为“登上坛去”是开始献祭的简略说法；不过，希伯来文更直接地描述登上祭坛。
    reason: 说明וַיַּעַל עָלָיו既可按字面理解为登上祭坛，也可能在祭祀语境中简略指开始献祭。
lexical_decisions:
- source_word: וַיָּבֹא ... מִדַּמֶּשֶׂק
  choice: 从大马士革回来
  rationale: בוא与表示来源的מִן构成“从……而来”；结合上下文，现代汉语用“回来”自然表达王从大马士革返回，但不增添具体行程细节。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词名词在希伯来文中重复三次。汉语首句明确主语“王”，后半句再次保留“王”，既反映原文对王亲自行事的强调，也避免逐次重复造成生硬。
- source_word: וַיַּרְא ... אֶת־הַמִּזְבֵּחַ
  choice: 看见了那座祭坛
  rationale: ראה在此表示直接看见；“那座”自然表达定指，也呼应上下文中已经制成的祭坛。
- source_word: וַיִּקְרַב ... עַל־הַמִּזְבֵּחַ
  choice: 走近祭坛
  rationale: קרב在Qal词干中指靠近；其后的עַל在这一搭配中表示趋向祭坛，译作“走近祭坛”符合现代汉语。
- source_word: וַיַּעַל עָלָיו
  choice: 登上坛去
  rationale: עלה配合עַל及代词后缀，字面上最自然地表示登上祭坛；“坛”明确承接前面的祭坛。献祭的动作在下一节才明说，因此正文不提前补入。
theological_decisions:
- issue: וַיַּעַל עָלָיו是指实际登上祭坛，还是省略表达在坛上献祭
  choice: 正文译作“登上坛去”
  alternative: “在坛上献祭”
  rationale: 希伯来文עלה与עַל的组合首先表达向上并到其上的动作。虽可按祭祀语境理解为开始献祭，但本句没有明说“献”，而下一节才具体叙述献祭，故正文保留字面动作，并以脚注说明另一种理解。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“回来”“走近”“登上坛去”简洁自然；适度保留“王”的重复，以呈现原文强调，同时避免不合汉语习惯的三次全量重复。脚注标记置于相关争议短语之后。
