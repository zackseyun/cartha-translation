  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: zh_hans
  text: 亚哈斯登基时二十岁；他在耶路撒冷作王十六年。他没有行在他的上帝雅威眼中看为正的事[b]，不像他父亲大卫[a]那样。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的“父亲”指王室祖先；大卫并不是亚哈斯的生父。
    reason: 文化与谱系说明
  - marker: b
    text: 也可译作“做他的上帝雅威看为正直的事”。
    reason: 词语与句式替代译法
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: 二十岁
  rationale: 这是希伯来语表达年龄的惯用说法；现代汉语自然表达为“二十岁”。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 该形式标明亚哈斯开始作王的时间；“登基时”简洁地传达王位继承语境。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词指执掌王权；“作王”在现代汉语历史叙事中自然清楚。
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: 没有……行……看为正的事
  rationale: 保留《列王纪》中反复出现的道德评判公式，同时调整语序，使汉语通顺。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 既保留希伯来语“在……眼中”的形象，也清楚表达从雅威的判断标准来看。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按四字神名 YHWH 的通常学术拟音译出其专名性质，不以称号代替。
- source_word: אֱלֹהָיו
  choice: 他的上帝
  rationale: 保留第三人称单数所属后缀，体现原文“他的上帝”的关系性措辞。
- source_word: כְּדָוִד אָבִיו
  choice: 像他父亲大卫那样
  rationale: 保留原文“父亲”的亲属称谓及比较关系；此处在王室谱系中是祖先之意，由脚注说明。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用以色列上帝的四字神名。正文采用接近 YHWH 的专名拟音“雅威”，避免把专名无提示地改成称号。
- issue: “他父亲大卫”的含义
  choice: 正文保留“父亲”，脚注说明为王室祖先
  alternative: 他的祖先大卫
  rationale: אָבִיו 可指父亲，也可泛指祖先；在亚哈斯的王室谱系中，大卫并非其生父。保留原词并加注，兼顾文本形式与实际所指。
- issue: 对亚哈斯的评判与大卫的比较范围
  choice: 保留“没有像……那样”的概括性比较
  alternative: 将比较明确限定为某一类行为
  rationale: 原文只作总体王权评价，并未在本节限定具体行为；不应额外缩小或扩张比较范围。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“登基时”“作王”符合王朝纪年语境；保留“眼中看为正”的希伯来语评价意象，但通过汉语语序使句子自然。
