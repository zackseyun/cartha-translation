  text: וַ/יְזַבֵּ֧חַ וַ/יְקַטֵּ֛ר בַּ/בָּמ֖וֹת וְ/עַל הַ/גְּבָע֑וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: zh_hans
  text: 他在丘坛上、山冈上和每一棵青翠的树下[a]献祭烧香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“枝叶茂盛的树下”，也可译作“繁茂的树下”。希伯来语形容词可表示青绿、新鲜或繁茂。
    reason: 保留רַעֲנָן的词义幅度，避免把它仅限于颜色。
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: 献祭
  rationale: זבח指献上祭牲或祭物；“献祭”简洁自然，并且没有补入原文未明说的祭物种类。
- source_word: וַיְקַטֵּר
  choice: 烧香
  rationale: קטר的皮埃勒式在祭祀语境中常指焚香，也可泛指使祭物化为烟；此处“烧香”符合这一反复出现的敬拜批判用语，同时保持动作的具体性。
- source_word: בַּבָּמוֹת
  choice: 在丘坛上
  rationale: במות指地方性的高处祭祀场所；“丘坛”既保留其高处含义，也明确它是祭祀地点，并与下文纯地形意义的“山冈”区分。
- source_word: וְעַל הַגְּבָעוֹת
  choice: 山冈上
  rationale: גבעות意为山冈；直译可保留它与作为祭祀场所的“丘坛”之间的区别。
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: 和每一棵青翠的树下
  rationale: רענן可形容青绿、新鲜或繁茂之物。“青翠的树”保留希伯来文的具体意象，在现代汉语中也自然易懂；其他可能含义列入脚注。
theological_decisions:
- issue: 如何翻译对不当敬拜的固定批判用语
  choice: 保留原文具体的祭祀行为和地点：“在丘坛上、山冈上和每一棵青翠的树下献祭烧香”
  alternative: 解释性地译为“他在山丘的神庙和树下从事异教崇拜”
  rationale: 本节列出行为和地点，却没有直接使用“异教”一词。保留原文措辞，可让上下文表达其负面评价，避免把解释写进正文。
- issue: קטר所指祭祀动作的范围
  choice: 译为“烧香”
  alternative: 译为“焚烧祭物，使其化为烟”
  rationale: 该动词在此类列王纪祭祀语境中通常指烧香，但其词义可以涵盖使祭物冒烟。正文采用最合乎固定表达的译法，同时不据此推断具体敬拜对象或祭物。
translation_notes:
  register: 采用现代、庄重而通顺的普通话。“丘坛”是较凝练的圣经祭祀术语；“山冈”和“青翠的树”则保持具体地貌与自然意象。脚注标记紧随其所说明的短语。
