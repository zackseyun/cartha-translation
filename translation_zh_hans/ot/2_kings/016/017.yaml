base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: zh_hans
  text: 亚哈斯王把盆座的框架割掉，又从盆座上取下水盆[a]；他还把铜海[b]从托在它下面的铜牛[c]上搬下来，放在石铺的地面上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “水盆”指圣殿礼仪中使用的洗濯盆；传统上也译作“洗濯盆”。
    reason: lexical_alternative
  - marker: b
    text: “铜海”是所罗门圣殿中那座大型铜盆的名称（见列王纪上7:23–26）。
    reason: cross_reference
  - marker: c
    text: 或译“铜公牛”。希伯来语在此可泛指牛类。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: 割掉
  rationale: 该动词表示割下、砍除；“割掉”既保留实际切除的动作，也符合拆改圣殿器物的语境。
- source_word: הַמִּסְגְּרוֹת
  choice: 镶板
  rationale: 此词在盆座的构造描写中指有框的板面或边板；“镶板”比笼统的“框架”更能体现这些构件，同时保留一定的结构含义。
- source_word: הַמְּכֹנוֹת
  choice: 盆座
  rationale: 此处指承托圣殿水盆的活动座架；“盆座”简洁说明其功能，也与后文水盆从其上取下相呼应。
- source_word: וַיָּסַר מֵעֲלֵיהֶם וְאֶת הַכִּיּוֹר
  choice: 又从盆座上取下水盆
  rationale: 希伯来语表明水盆原在这些座架之上；中文补出“盆座”而不用代词，使所指清楚自然。
- source_word: הַכִּיּוֹר
  choice: 水盆
  rationale: 指圣殿礼仪中使用的洗濯盆。“水盆”是现代读者容易理解的表达，又不额外限定具体用途。
- source_word: הַיָּם
  choice: 铜海
  rationale: “海”是所罗门圣殿大型铜盆的专称；中文惯称“铜海”，既标明所指器物，也保留其名称。
- source_word: הוֹרִיד
  choice: 搬下来
  rationale: 使役形表示使其从支座上降下；“搬下来”自然传达大型器物被移离支撑物的动作。
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: 铜牛
  rationale: בָּקָר可泛指牛类；在承托铜海的铸像语境中，“铜牛”是简明而传统的表达，不强行断定性别。
- source_word: אֲשֶׁר תַּחְתֶּיהָ
  choice: 下面的
  rationale: 关系从句说明铜牛位于铜海之下；中文以定语表达更自然。
- source_word: וַיִּתֵּן אֹתוֹ עַל מַרְצֶפֶת אֲבָנִים
  choice: 放在石铺的地面上
  rationale: מַרְצֶפֶת指以石材铺成的表面。“石铺的地面”避免把它误解为经文未明确提到的高台。
