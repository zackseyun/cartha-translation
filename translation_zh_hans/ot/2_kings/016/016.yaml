  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: zh_hans
  text: 乌利亚祭司就照亚哈斯王所吩咐的一切而行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做了
  rationale: עָשָׂה可表示“做、制造、行事”。本句后接表示完全依从的短语 כְּכֹל אֲשֶׁר，因此译作“做了”最自然，也保留原文宽泛而直接的叙事表达。
- source_word: אוּרִיָּה
  choice: 乌利亚
  rationale: 按现代中文圣经人名的通行音译处理该专名。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 定冠词加职分名词，指明乌利亚的身份；中文在专名之后用“祭司”即可自然表达其确定性。
- source_word: כְּכֹל אֲשֶׁר
  choice: 照……的一切
  rationale: 该组合表示行动完全符合随后所述的命令；“照……所吩咐的一切”既贴近原文结构，又符合现代汉语表达。
- source_word: צִוָּה
  choice: 所吩咐
  rationale: צוה意为“命令、吩咐”。在王对祭司的语境中，“吩咐”保留权威性，同时比“命令”更符合自然、庄重的中文叙事语体；“所”字结构也清楚表明命令先于执行。
- source_word: הַמֶּלֶךְ אָחָז
  choice: 亚哈斯王
  rationale: 希伯来文为“王亚哈斯”；现代汉语惯常将称号置于姓名之后，译作“亚哈斯王”。
theological_decisions:
- issue: 对乌利亚服从行为的叙事评价
  choice: 只作描述，不在译文中加入明确的道德褒贬。
  alternative: 采用暗示赞同或谴责的措辞。
  rationale: 原文只说乌利亚完全照亚哈斯王的吩咐而行。上下文虽可引导读者作负面判断，本节本身却没有明说，因此译文保留其克制的叙事语气。
translation_notes:
  register: 采用现代、自然而庄重的简体中文。“于是”承接前文叙事，“照……所吩咐的一切做了”清楚呈现乌利亚对王命的完全遵行，不额外解释或评价。
