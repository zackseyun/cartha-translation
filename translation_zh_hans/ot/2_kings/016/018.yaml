  text: וְ/אֶת מיסך הַ/שַּׁבָּ֜ת אֲשֶׁר בָּנ֣וּ בַ/בַּ֗יִת וְ/אֶת מְב֤וֹא הַ/מֶּ֨לֶךְ֙ הַֽ/חִיצ֔וֹנָ/ה הֵסֵ֖ב בֵּ֣ית יְהוָ֑ה מִ/פְּנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: zh_hans
  text: 亚哈斯因为亚述王[d]，把他们在殿内建造的安息日有顶廊道[a]和王的外入口[b]从雅威的殿挪移开了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “安息日有顶廊道”也可译作“安息日有顶建筑”“安息日亭”或“安息日门廊”。希伯来语所指的确切建筑形制不详。
    reason: lexical_alternative
  - marker: b
    text: “王的外入口”也可译作“王的外通道”或“供王使用的外通道”。
    reason: lexical_alternative
  - marker: c
    text: “挪移开了”也可译作“改动了”“使之转向”或“移除了”。原文动词可指使某物转向或改变其位置，不一定表示将它彻底拆除。
    reason: lexical_alternative
  - marker: d
    text: “因为亚述王”也可译作“由于亚述王”，并可能含有“因惧怕亚述王”的意思。
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: 安息日有顶廊道
  rationale: מיסך是罕见的建筑用语，确切形制不明；“有顶廊道”自然地表达有遮盖的建筑设施，又不把它过度限定为华盖、亭子或门廊。
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: 他们在殿里建造的
  rationale: 保留בָּנוּ未指明身份的复数主语“他们”；语境中的“这殿”指雅威的殿，汉语简作“殿里”更自然。
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: 王的外通道
  rationale: מְבוֹא可指入口、进入处或通道；此处与王有关并位于外侧。“外通道”保留其作为王室出入设施的可能性，脚注列出其他译法。
- source_word: הֵסֵב
  choice: 转移了
  rationale: 使役式动词可表达使之转向、改动或迁移；“转移”比“拆除”少作推断，也较“转开”适合建筑语境。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בית在此按语境指圣殿；יְהוָה作为上帝的专名音译为“雅威”。
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: 因为亚述王
  rationale: מִפְּנֵי可泛指原因、压力或畏惧；正文采用涵盖面较广的“因为”，不确定的动机在脚注说明。
theological_decisions:
- issue: 亚哈斯更改圣殿设施的具体方式及动机
  choice: 以“转移了”和“因为亚述王”保留原文宽泛含义
  alternative: 译为“拆除了”及“由于惧怕亚述王”
  rationale: 经文没有明确说明设施被彻底拆除，也没有明说亚哈斯出于恐惧；不应把可能的历史推断写入正文。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。句首补出上下文明确的主语“亚哈斯”，以避免希伯来语宾语前置结构在汉语中生硬难解；分号显示末语是整项行动的原因。所有不确定的建筑术语、动作方式和动机均以脚注保留。
