revisions:
- from: 亚哈斯把他们在殿里建造的安息日有顶廊道[a]，以及王的外通道[b]，从雅威的殿转移了[c]；这是因为亚述王[d]。
  to: 亚哈斯因为亚述王[d]，把他们在殿内建造的安息日有顶廊道[a]和王的外入口[b]从雅威的殿挪移开了[c]。
  rationale: 修订仅改善汉语句法并收紧“入口”这一词汇对应：原因短语前置；以“把……从雅威的殿挪移开了”表达建筑设施的变更／移置，而不将其定为拆毁；脚注继续明确保留建筑形制、动作方式和原因动机的不确定性。
