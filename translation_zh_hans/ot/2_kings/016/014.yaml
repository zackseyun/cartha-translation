id: 2KI.16.14
reference: 2 Kings 16:14
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: zh_hans
  text: 至于那座在雅威面前的青铜祭坛[a]，他把它从殿前，也就是从祭坛和雅威的殿[b]之间移开，放在那座祭坛的北侧。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “青铜”或译“铜”。
    reason: 希伯来词נְחֹשֶׁת可指铜，也可指青铜；圣殿器物语境中通常译作青铜。
  - marker: b
    text: “殿”原文直译为“家”，这里指圣殿。
    reason: 说明בֵּית יְהוָה的字面表达及其在本节中的所指。
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: 青铜祭坛
  rationale: נְחֹשֶׁת可指铜或青铜；在圣殿器物的语境中，“青铜”较符合传统理解，也符合现代汉语习惯，同时以脚注保留“铜”的可能。
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: לִפְנֵי具有“在……面前”的空间意义，也保留敬拜场所处于雅威临在之前的意味；יְהוָה音译为“雅威”。
- source_word: וַיַּקְרֵב
  choice: 移开
  rationale: קרב本义与“使靠近、移近”有关，但本句描述亚哈斯把祭坛从原位置搬走；结合后面的安放地点，“移开”自然表达其迁移，而不额外规定搬运方式。
- source_word: מֵאֵת פְּנֵי הַבַּיִת
  choice: 从殿前
  rationale: פְּנֵי הַבַּיִת在此是空间表达，指建筑物前方；按上下文，הַבַּיִת指圣殿，译作“殿前”简洁自然。
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: 从祭坛和雅威的殿之间
  rationale: 保留重复介词所表达的明确空间关系；“雅威的殿”既符合汉语圣殿语境，也较贴近希伯来文“雅威的家／殿”。
- source_word: וַיִּתֵּן אֹתוֹ
  choice: 放
  rationale: נתן在物体安置的语境中可译为“放置”；“放”是清楚、自然的现代汉语。
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: 在那座祭坛的北侧
  rationale: יֶרֶךְ指侧面或侧边，צָפוֹנָה表示朝北或北边；“北侧”准确而自然。指示语“那座”帮助读者区分本节的青铜祭坛与此前另立的祭坛，但不进一步消除原文中定冠词所保留的篇章指代。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以通行的现代汉语音译呈现这一盟约之名，而不以称号替代。
- issue: “在雅威面前”的空间与敬拜含义
  choice: 保留“在……面前”
  alternative: 在雅威的临在中；摆在雅威面前
  rationale: 原文首先说明祭坛的位置，同时可能带有敬拜与神临在的意味；直译式表达保留两层可能，不将其限定为抽象神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“殿前”“北侧”等表达简洁清楚；保留“雅威的殿”这一近源语结构，并用脚注解释“殿”原文字面为“家”。所有脚注标记均置于相关词语之后。
