base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: zh_hans
  text: 那时，亚兰王利汛把以拉他收归亚兰[a]，又把犹大人赶出以拉他[b]。亚兰人来到以拉他，住在那里，直到今日。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“亚兰人”。一些解经者及古代文本见证倾向于读作“以东人”，这可能更符合上下文以及《历代志下》28:17的相关记载。
    reason: textual_variant
  - marker: b
    text: 本节希伯来文在这里使用了这个地名的另一种拼写形式，可音译为“以罗特”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: 收归
  rationale: 此处使役形表示使以拉他重新归入某方控制；“收归”自然地表达政治和军事上的控制权转移，同时不额外补入原文没有明说的细节。
- source_word: אֵילַת / אֵילוֹת
  choice: 以拉他
  rationale: 同一地名在本节出现两种拼写形式；正文统一采用现代中文圣经地名常用译法“以拉他”，并以脚注说明希伯来文的异拼。
- source_word: לַאֲרָם
  choice: 归亚兰
  rationale: 介词短语表示所有权或控制权转归亚兰；保留“亚兰”这一原文专名，不以较晚的地缘名称替代。
- source_word: וַיְנַשֵּׁל
  choice: 赶出
  rationale: 该动词表示使人失去对地方的占有并将其逐出；“赶出”清楚、有力且符合现代汉语。
- source_word: הַיְהוּדִים
  choice: 犹大人
  rationale: 在王国时期的历史语境中，指属于犹大国的人；“犹大人”比可能带有后期民族宗教含义的译法更准确。
- source_word: וארמים
  choice: 亚兰人
  rationale: 马所拉文本的辅音读作“亚兰人”；虽有“以东人”的重要异文或推定，正文依现存希伯来文本翻译，并在脚注保留该问题。
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: 住在那里，直到今日
  rationale: 直译并自然传达从叙述事件起延续到作者当时的居住状态。
theological_decisions:
- issue: 末句族名的文本校勘难题
  choice: 亚兰人来到以拉他
  alternative: 以东人来到以拉他
  rationale: 马所拉文本读作“亚兰人”，故正文以此为准；但“以东人”有若干古代见证和历代志下28:17的相关背景支持，因此在脚注中明确保留，避免悄然消除历史与文本张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“收归”体现控制权转移；“犹大人”符合王国时期背景。正文保留马所拉文本的“亚兰人”，并以脚注呈现“以东人”异读。
