base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: zh_hans
  text: 亚哈斯取走雅威的殿中和王宫的府库中所有的金银，作为贿赂[a]送给亚述王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“贡物”或“礼物”；这个希伯来词通常含有“贿赂”的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 拿来
  rationale: 叙事体中表示亚哈斯取走这些财物；“拿来”既自然，也与后面的“送给”衔接。
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: 金银
  rationale: 希伯来文具体说“银和金”；现代汉语习惯合称“金银”，没有改变所指。
- source_word: הַנִּמְצָא
  choice: 能找到的
  rationale: 保留מצא被动分词所表达的“在那里可找到、现有”的意思，避免把它无根据地强化为绝对意义上的“所有”。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בֵּית直译为“家、殿”，在此指圣殿；“雅威殿”在现代汉语中清楚自然，并保留神的专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，保留其作为专名的性质，而不以称号替代。
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: 和王宫府库中
  rationale: אֹצְרוֹת为复数，指储藏贵重财物的库房；בֵּית הַמֶּלֶךְ在此自然指王宫。“王宫府库”简洁地表达两者关系。
- source_word: וַיִּשְׁלַח לְמֶלֶךְ אַשּׁוּר
  choice: 送给亚述王
  rationale: 准确表达“送往亚述王那里”，符合汉语叙事习惯。
- source_word: שֹׁחַד
  choice: 贿赂
  rationale: 该词通常带有以财物收买对方的负面含义；“贿赂”保留这种政治与道德色彩，但以脚注列出语境中可能的较中性译法。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文以“雅威”音译，保留其专名性质；不把专名默默改为“主”这一称号。
- issue: שֹׁחַד的道德色彩
  choice: 贿赂
  alternative: 贡物；礼物
  rationale: 原词通常具有负面含义，正文不将亚哈斯的行为中性化；同时用脚注承认在外交政治语境中可理解为贡物或礼物。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“雅威殿”和“王宫府库”清楚区分圣殿与王室财库；“能找到的”保留原文关于现有财物的表达。脚注标记紧接“贿赂”，使其与所说明的词准确对应。
