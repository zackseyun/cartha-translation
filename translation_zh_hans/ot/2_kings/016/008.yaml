- from: 亚哈斯把雅威殿里和王宫府库中能找到的金银都拿来，送给亚述王作贿赂[a]。
  to: 亚哈斯取走雅威的殿中和王宫的府库中所有的金银，作为贿赂[a]送给亚述王。
  rationale: 修订避免将原文“现有的／在场的”表述成动态搜寻，删去“拿来”不必要的趋向意味，并使地点结构和施事行为更符合现代标准汉语。神名、地名以及שֹׁחַד的负面语义均予保留；脚注锚点继续准确对应“贿赂”。
