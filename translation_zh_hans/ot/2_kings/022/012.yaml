base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: zh_hans
  text: 王就吩咐祭司希勒家[c]、沙番的儿子亚希甘、米该雅的儿子亚革波、书记官沙番[a]和王的臣仆亚撒雅[b]，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“秘书沙番”。这里的希伯来词可指抄写文书的书记，也可指王室行政秘书。
    reason: lexical_alternative
  - marker: b
    text: 或译“王的官员亚撒雅”。原文直译为“王的仆人”，在王室语境中也可指为王效力的官员。
    reason: lexical_alternative
  - marker: c
    text: 原文称希勒家为“祭司”，并未明确称他为“大祭司”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: 就吩咐
  rationale: 该动词表示君王带有权威的命令；“吩咐”自然庄重，并以“就”承接希伯来叙事时序。
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: 祭司希勒家
  rationale: 原文仅称其为“祭司”，没有明确使用“大祭司”的称号；中文按自然语序处理。
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: 沙番的儿子亚希甘
  rationale: 准确表达父子身份，并符合现代汉语的人名说明方式。
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: 米该雅的儿子亚革波
  rationale: 按希伯来文表达父子关系，人名采用中文圣经中通行且易辨识的译写。
- source_word: שָׁפָן הַסֹּפֵר
  choice: 书记官沙番
  rationale: סֹפֵר在王室语境中可指负责文书的书记或秘书；“书记官”既保留文书职能，又表明这是宫廷职衔。
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: 王的臣仆亚撒雅
  rationale: עֶבֶד字面为“仆人”，在王室语境中也可指服侍君王的官员；“臣仆”兼顾字面意义与宫廷身份。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式引出下一节命令的内容；冒号清楚保留向后承接的作用。
theological_decisions:
- issue: 希勒家的祭司职衔
  choice: 祭司
  alternative: 大祭司
  rationale: 本节希伯来文只有הַכֹּהֵן“那祭司／祭司”，没有明确写“大祭司”；不根据上下文补入更高职衔。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名依中文圣经通行译名；名单结构保持清晰。“说：”保留本节与下一节命令内容之间的未完连接。
