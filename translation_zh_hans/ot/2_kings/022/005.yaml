base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: zh_hans
  text: 要把银子交在耶和华殿里受委派负责工程的人手中[a]，让他们交给在耶和华殿里做工的人，用来修补殿宇破损之处[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “交在……手中”也可译作“交给……”。原文用“给”与“手”构成惯用表达，意思是交由他们掌管。
    reason: lexical_alternative
  - marker: b
    text: “修补殿宇破损之处”直译为“加固殿宇的破损”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְנֵה עַל יַד
  choice: 要把……交在……手中
  rationale: נתן本义为“给、交”，与עַל יַד连用表示把财物交由某人掌管；中文“交在……手中”既保留原文意象，也自然表达托付之意。该动词在上下文中具有指令语气，译作“要把”。
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  choice: 受委派的监工
  rationale: 字面为“受委派的做工者”。הַמֻּפְקָדִים是פקד的被动形式，表示被指派或被置于负责位置；结合他们负责接收并转交银子的职能，译作“受委派的监工”可清楚区分后文实际做工的人。
- source_word: בְּבֵית יְהוָה
  choice: 在耶和华殿里
  rationale: בֵּית יְהוָה字面是“耶和华的家”，在此明确指圣殿；现代中文以“耶和华殿”简洁、清楚，并保留神名יהוה。介词ב译作“在……里”。
- source_word: וְיִתְּנוּ אֹתוֹ
  choice: 让他们转交
  rationale: 原文仍用נתן“给、交”，复数主语回指前述受委派者。中文用“转交”自然呈现银子从祭司交给监工、再给工人的流转关系，而不改变动作本身。
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר בְּבֵית יְהוָה
  choice: 在耶和华殿里做工的人
  rationale: עֹשֵׂי הַמְּלָאכָה字面为“做这工作的人”。将地点关系从句自然整合为“在……里做工的人”，不额外限定其具体工种。
- source_word: לְחַזֵּק בֶּדֶק הַבָּיִת
  choice: 用来修补殿宇破损之处
  rationale: חזק本义为“使坚固、加强”，与בֶּדֶק הַבָּיִת搭配时指修复建筑物的裂损。译文采用符合现代建筑语境的“修补……破损之处”，同时以脚注保留字面表达。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名יהוה。简体中文圣经语域中“耶和华”辨识度高，并作为专名呈现，而不以“主”代替，从而保留原文的神名。
translation_notes:
  register: 采用现代、庄重而易懂的叙事用语。“银子”承接上文所收取的款项；原文代词“它”在本节内没有明说所指，中文为避免指代生硬而复现“银子”。以“监工”表达第一组受委派且负责款项转交的工作人员，以“做工的人”表达第二组实际参与修缮者。所有脚注标记均已置于正文相应位置。
