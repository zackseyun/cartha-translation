  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为正的事；他走在他祖先大卫所走的一切道路上[a]，没有偏左偏右。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译“他父亲大卫”；这里的“父亲”是广义用法，指祖先或王朝先祖。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: 他行……看为正的事
  rationale: 保留“行”这一动作和定冠词形容词名词化所表达的“正的事”，同时符合现代汉语表达。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评判意象；加入“看为”使汉语句法自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代简体中文圣经语境中通行的专名音译直接呈现四字神名。
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: 完全遵行……的道路
  rationale: “遵行道路”保留行走与道路的行为隐喻；“完全”表达 כָּל 在此指对整条道路的全面遵循，避免生硬直译为“行在所有道路中”。
- source_word: דָּוִד אָבִיו
  choice: 他祖先大卫
  rationale: אָב 可广指先祖；大卫并非约西亚的生父。正文用“祖先”准确传达此处的王朝先祖关系，并用脚注提示原文形式。
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: 不偏左右
  rationale: 采用自然凝练的汉语固定表达，保留道路隐喻及向两个方向都不偏离的含义。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名；中文正文采用读者最熟悉且可明确识别为专名的“耶和华”，不以“主”替代。
- issue: דָּוִד אָבִיו 中 אָבִיו 的关系含义
  choice: 他祖先大卫
  alternative: 他父亲大卫
  rationale: 列王纪下22:1说明约西亚的生父是亚们，因此此处“父亲”具有更广的先祖、王朝奠基者之义。译作“祖先”避免现代读者误认亲子关系，同时脚注保留原文字面信息。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“行……看为正的事”“道路”“不偏左右”保留原文彼此呼应的行为与道路意象；句式简洁，适合普通读者及公开诵读。
