  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: zh_hans
  text: 雅威如此说：“看哪，我正要使灾祸[a]临到这地方和其中的居民，就是犹大王所读的这书上的一切话。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “灾祸”也可译作“祸患”；这里指审判所带来的灾难，不是道德意义上的邪恶。
    reason: 说明 רָעָה 在本节语境中的词义，并保留其可译范围。
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知传信的固定公式和庄重语气；用“雅威”直接呈现圣名 יְהוָה。
- source_word: הִנְנִי
  choice: 看哪
  rationale: 表达郑重提醒与行动迫近的语气，符合先知宣告的文体。
- source_word: מֵבִיא
  choice: 我正要使……临到
  rationale: 该分词表示即将发生、已迫近的行动；“正要”比单纯的将来时更能传达这一体貌。
- source_word: רָעָה
  choice: 灾祸
  rationale: 在本节审判语境中指降临的祸患，而非道德意义上的邪恶。
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: 临到这地方和其中的居民
  rationale: 自然呈现灾祸所指向的地点与居民，并保留两个介词短语的并列关系。
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: 就是……这书上的一切话
  rationale: 保留原文把“书上的一切话”置于“灾祸”宣告之后的同位或补充关系，不擅自改写为较明确的“照着……实现”。
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: 犹大王所读的
  rationale: 忠实保留关系从句；原文动词本身不明确表示“朗读”，因此不增译。
theological_decisions:
- issue: רָעָה 在神施行审判的语境中的含义
  choice: 灾祸
  alternative: 邪恶；祸患
  rationale: 这里所说的是雅威将降下的审判性灾难。“灾祸”既符合该词在本语境中的语义，也避免让读者误以为经文称神施行道德上的邪恶。
- issue: 圣名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字圣名；音译“雅威”能保留其作为盟约之神专名的性质。
- issue: “书上的一切话”与“灾祸”的句法关系
  choice: 用“就是”保留补充说明式结构
  alternative: 译作“照着书上的一切话”或“使书上的一切话都应验”
  rationale: 原文用直接宾语标记引出“书上的一切话”，句法较为突兀，可理解为进一步界定所降之灾。正文保留这种张力，不加入原文没有明说的“照着”或“应验”。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“如此说”“看哪”保留先知宣告的正式语体；其余句法尽量自然，同时保留末句同位结构所具有的原文张力。
