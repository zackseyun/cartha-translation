base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: zh_hans
  text: 约西亚登基时八岁，在耶路撒冷作王三十一年。他母亲名叫耶底大，是波斯加人亚大雅的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: 八岁
  rationale: 这是希伯来语表达年龄的惯用语，直译为“八岁之子”；现代汉语自然表达为“八岁”，准确保留年龄。
- source_word: בְמָלְכוֹ
  choice: 登基时
  rationale: 此处介词与动词形式构成时间表达，指约西亚开始作王之时；“登基时”符合汉语王朝叙事的自然用语。
- source_word: מָלַךְ
  choice: 统治了
  rationale: 该动词表示施行王权、作王；“统治了”在现代汉语中清楚表达实际执政，并与前面的“登基”避免重复。
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: 三十一年
  rationale: 按现代汉语数字习惯表达，完整保留原文年数。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 直接表达统治所在地；地名采用现代中文圣经中通行的音译。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 自然、简洁地传达希伯来语姓名介绍公式。
- source_word: יְדִידָה
  choice: 耶底大
  rationale: 人名按中文圣经通行形式音译，不翻译其词义。
- source_word: בַת עֲדָיָה
  choice: 亚大雅的女儿
  rationale: 准确表达父女关系；人名采用中文圣经通行音译。
- source_word: מִבָּצְקַת
  choice: 波斯加人
  rationale: 前缀 מִן 表示来源；“波斯加人”自然表达亚大雅来自该地，同时不误将地点来源归于耶底大之外的其他人物。
