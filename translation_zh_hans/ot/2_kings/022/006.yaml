  yaml_path: translation/ot/2_kings/022/006.yaml
  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: zh_hans
  text: 交给工匠、建筑工人和砌墙工人，并用来购买木料和采石场开出的石料[a]，以加固殿宇[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“凿成的石料”。
    reason: lexical_alternative
  - marker: b
    text: 原文为“那房屋”，在上下文中指耶和华的殿。
    reason: cross_reference
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: 交给工匠
  rationale: חָרָשִׁים泛指有专门技能的手艺人；此处不宜限缩为木匠。“工匠”既自然，也保留其较宽泛的含义。
- source_word: וְלַבֹּנִים
  choice: 建筑工人
  rationale: בנה的分词在这里名词化，指从事建造的人。“建筑工人”直接清楚，并能与前后的工种区分。
- source_word: וְלַגֹּדְרִים
  choice: 砌墙工人
  rationale: גדר的基本意象是筑墙、围墙或修补墙垣。“砌墙工人”比笼统的“石匠”更贴近原词，同时符合修缮工程的语境。
- source_word: וְלִקְנוֹת
  choice: 并用来购买
  rationale: 带ל的独立不定式延续款项用途。汉语用“并用来购买”可自然表达目的，而无需机械重复“交给”。
- source_word: עֵצִים
  choice: 木料
  rationale: 在建筑材料清单中，עֵצִים指用于施工的木材；“木料”比“木头”庄重，也不会被理解为活树。
- source_word: וְאַבְנֵי מַחְצֵב
  choice: 采石场开出的石料
  rationale: מַחְצֵב与采掘、采石相关。此译明确表达石料来自采石场，并在脚注保留“凿成的石料”这一可能侧重。
- source_word: לְחַזֵּק
  choice: 以加固
  rationale: חזק的使役形式基本义为使坚固、加强；“加固”既保留词义，又自然契合殿宇修缮语境，而不直接泛化为“修理”。
- source_word: אֶת־הַבָּיִת
  choice: 殿宇
  rationale: הַבָּיִת字面为“那房屋”，上下文所指是耶和华的殿。“殿宇”在现代汉语中自然庄重，并由脚注说明原文措辞。
theological_decisions:
- issue: הַבָּיִת所指的宗教建筑
  choice: 正文译作“殿宇”，脚注说明原文为“那房屋”，在上下文中指耶和华的殿。
  alternative: 直译“那房屋”或直接译“圣殿”
  rationale: “殿宇”能让现代读者清楚理解所指，又不像“圣殿”那样完全隐去原文使用普通名词“房屋”的表达。
translation_notes:
  register: 采用现代、庄重且易懂的书面普通话。职业名称具体但不过度技术化；款项用途以顺畅汉语串联。正文中的[a]、[b]均有对应脚注。
