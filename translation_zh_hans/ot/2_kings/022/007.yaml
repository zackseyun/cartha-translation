  text: אַ֚ךְ לֹא יֵחָשֵׁ֣ב אִתָּ֔/ם הַ/כֶּ֖סֶף הַ/נִּתָּ֣ן עַל יָדָ֑/ם כִּ֥י בֶ/אֱמוּנָ֖ה הֵ֥ם עֹשִֽׂים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: zh_hans
  text: 但交在他们手里的银子[a]，不必向他们查账[b]，因为他们办事忠实可靠。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“钱”。希伯来语“银子”在财务语境中常指钱财。
    reason: lexical_alternative
  - marker: b
    text: 较直译：“不用同他们核算这银子”；意思是经手款项的人无须被要求交账。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 但
  rationale: 承接上文并引出例外或限制，现代汉语用“但”简洁自然。
- source_word: יֵחָשֵׁב אִתָּם
  choice: 不必向他们查账
  rationale: חשׁב 的尼法勒式在这一财务语境中指核算、查验账目；结合 אִתָּם，表达无需要求经手人交代账目。此译法传达实际含义，同时以脚注保留较贴近字面的可能译法。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף 字面指银，也常指货币；“银子”兼顾古代历史语境和财务含义。
- source_word: הַנִּתָּן עַל יָדָם
  choice: 交在他们手里的
  rationale: 保留希伯来语“交在手中”的具体意象，也自然表达将款项托付给他们经管。
- source_word: כִּי
  choice: 因为
  rationale: 明确引出无需查账的理由，符合此处因果关系。
- source_word: בֶאֱמוּנָה
  choice: 忠实可靠
  rationale: 此处 אֱמוּנָה 指办事可信、诚实尽责，并非教义意义上的信心；“忠实可靠”能自然表达其行为品质。
- source_word: הֵם עֹשִׂים
  choice: 他们办事
  rationale: 原文直译为“他们做”，语境涉及经手款项和工程事务；“办事”在现代汉语中简洁地表达其履职行为。
theological_decisions: []
