base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: zh_hans
  text: 书记官沙番又禀告王说：“祭司希勒家给了我一部书[a]。”沙番就在王面前把它读了出来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“书卷”或“文书”。希伯来语这个词泛指书面文献，本身并未说明其具体形态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 禀告
  rationale: 使役词干在这里表示“告知、报告”。“禀告”自然体现臣属向君王报告的宫廷语境，又不把语气强化为正式宣告。
- source_word: הַסֹּפֵר
  choice: 书记官
  rationale: סֹפֵר可指抄写者，也可指王室书记或秘书。“书记官”保留其文字职务和宫廷官员身份，并避免“文士”可能带来的后期宗教身份联想。
- source_word: סֵפֶר
  choice: 一部书
  rationale: סֵפֶר泛指书、卷册或书面文献，本身不限定载体形态。“一部书”在现代汉语中自然，也不明确断定是装订本或卷轴；希伯来文无定冠词，故译作“一部”而非“那部”。
- source_word: נָתַן לִי
  choice: 给了我
  rationale: 希伯来语完成式表示已经完成的给予行为；汉语“给了我”简洁自然，并能由语境体现其当前关联。
- source_word: וַיִּקְרָאֵהוּ
  choice: 把它读了出来
  rationale: קרא以书面材料为宾语时通常指诵读或宣读。“读了出来”明确表达有声阅读，同时不把行为过度正式化为“宣读”。
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: 在王面前
  rationale: 忠实表达“在王的面前、在王所在之处”，是自然简洁的现代汉语。
- source_word: חִלְקִיָּה
  choice: 希勒家
  rationale: 采用中文圣经传统中通行且易辨认的人名译法。
- source_word: שָׁפָן
  choice: 沙番
  rationale: 采用中文圣经传统中通行且易辨认的人名译法。
