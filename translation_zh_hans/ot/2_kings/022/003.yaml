  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: zh_hans
  text: 约西亚王在位第十八年，王差派书记沙番，就是亚萨利雅的儿子、米书兰的孙子，到雅威的殿[a]去，吩咐说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“雅威的家”。
    reason: 说明 בֵּית יְהוָה 的字面表达；正文按上下文译为“雅威的殿”。
lexical_decisions:
- source_word: וַיְהִי בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: 约西亚王在位第十八年
  rationale: 这是君王纪年的常用表达；补出“在位”可在现代汉语中清楚传达其统治的第十八年，也自然承接叙事。
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: 王差派
  rationale: 保留原文在纪年之后再次使用“王”的重复；“差派”符合君王委派官员执行任务的语境。
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: 米书兰的孙子、亚萨利雅的儿子……沙番
  rationale: 按现代汉语习惯调整谱系次序，同时完整保留沙番的父亲和祖父信息。
- source_word: הַסֹּפֵר
  choice: 书记
  rationale: 该词可指抄写员或王室书记官；“书记”保留较宽泛的官职含义，不把具体行政职能说得过于确定。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 在此语境中指敬拜场所，译作“殿”自然明确；脚注保留字面的“家”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，而不以“主”这一称号代替。
- source_word: לֵאמֹר
  choice: 吩咐说：
  rationale: 此处引出王差派沙番时交付的命令；“吩咐说”在汉语中自然衔接下一节的直接引语。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”以专名形式呈现，并与将其替换为称号“主”的做法区分开来。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。谱系按汉语由祖父到父亲再到本人排列；保留原文重复的“王”。句末冒号表明王的话延续到下一节。
