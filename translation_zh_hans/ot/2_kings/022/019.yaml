id: 2KI.22.19
reference: 2 Kings 22:19
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: zh_hans
  text: 因为你的心柔软[a]，你听见我论到这地方和其中居民所说的话，要使他们成为荒凉和咒诅，就在耶和华面前谦卑自己，撕裂衣服，在我面前哭泣；所以我也听见了。这是耶和华的宣告。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柔软”也可译为“柔和”或“易受感动”，指内心不刚硬、愿意回应。
    reason: 解释רַךְ לְבָבְךָ这一希伯来语比喻，避免按现代汉语将其误解为性格软弱。
lexical_decisions:
- source_word: יַעַן
  choice: 因为……所以
  rationale: 希伯来语以原因从句开头，直到后半句才出现神的回应；汉语采用“因为……所以……”保持因果关系并使长句清楚。
- source_word: רַךְ לְבָבְךָ
  choice: 你的心柔软
  rationale: 保留“心柔软”的原文比喻，表达约西亚内心并不刚硬，而是敏锐、愿意回应。
- source_word: וַתִּכָּנַע מִפְּנֵי יְהוָה
  choice: 在耶和华面前谦卑自己
  rationale: 动词的反身语态表示主动自卑；“在……面前”自然表达 מִפְּנֵי 的临在含义。
- source_word: בְּשָׁמְעֲךָ
  choice: 你听见……便
  rationale: 将时间情状关系译为汉语“听见……便”，自然连接听见审判之言与随后的自卑行动。
- source_word: אֲשֶׁר דִּבַּרְתִּי עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: 我所说攻击这地方和其中居民的话
  rationale: 审判语境使 עַל 带有不利、敌对意味；“攻击”保留宣告针对他们而发的力度。
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: 他们必成为荒凉和咒诅
  rationale: “他们”概括这地方及其中居民；“荒凉”适合审判语境，同时以脚注保留 שַׁמָּה 的另一可能含义。
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: 又撕裂衣服
  rationale: 直译这一哀恸和悔改的外在行动；“衣服”是现代汉语自然用语。
- source_word: וַתִּבְכֶּה לְפָנָי
  choice: 在我面前哭泣
  rationale: 保留神第一人称的直接话语和“在我面前”的临在表达。
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: 所以我也听见了
  rationale: “也”体现 גַם 与强调代词 אָנֹכִי 所表达的回应关系；不补出明确宾语，以免消除原文省略。
- source_word: נְאֻם יְהוָה
  choice: 耶和华宣告
  rationale: 以庄重、简洁的现代汉语呈现标准先知宣告公式。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经语境中最广为人知的专名形式，保留其作为神名而非普通称号的功能；“雅威”更接近常见学术重构的读音，但普通读者熟悉度较低。
- issue: “我也听见了”的对象
  choice: 保留原文未明说的宾语
  alternative: 我也听见你了／我也听见你的祷告了
  rationale: 希伯来文此处没有明示宾语；上下文可理解为神听见约西亚或垂听其哭求，但译文不补入“祷告”等解释，以保留原文含蓄。
translation_notes:
  register: 采用现代、庄重而易懂的叙事—先知语体。主句以“因为……所以……”梳理希伯来语长句。“谦卑自己”“撕裂衣服”“哭泣”等关键动作保持直陈。
