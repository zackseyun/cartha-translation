revisions:
- from: 书记沙番来到王那里，向王回报说：“你的臣仆已经把殿里所得的银子倒出来[a]，交在负责耶和华殿工程的工人手中[b]。”[c]
  to: 书记沙番来到王那里，向王回报说：“你的臣仆已经把在殿里找到的银子倒出来[a][c]，交在那些受派管理耶和华殿的工人手中[b]。”
  rationale: 修订仅恢复原文“在殿中被找到”的表达，并将“受派管理耶和华殿”从“工程”这一上下文性解释中还原出来；其余保留原译庄重自然的措辞、神名译法及“倒出来”“交在……手中”的具体意象。脚注[c]移至其所解释的“殿”之后。
