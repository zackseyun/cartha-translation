  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: zh_hans
  text: 书记沙番来到王那里，向王回报说：“你的臣仆已经把在殿里找到的银子倒出来[a][c]，交在那些受派管理耶和华殿的工人手中[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “倒出来”也可译作“清点取出”；原文动词的字面意象是把银子倾倒出来。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“放在工人手中”，意思是交给他们掌管、使用。
    reason: lexical_alternative
  - marker: c
    text: 本节的“殿”原文字面为“房屋”，在这里指圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: 书记
  rationale: 该词在王室语境中可指负责文书事务的官员；“书记”既保留其文字职务色彩，也符合宫廷场景。
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: 向王回报
  rationale: 这是“带回话、作出报告”的希伯来语表达；“回报”自然简洁，并保留返回报告的含义。
- source_word: הִתִּיכוּ
  choice: 倒出来
  rationale: 此处谈的是处理所收银子，不是熔化金属；该动词在语境中指把银子从盛放之处倒出或清出，以便移交。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: כֶּסֶף本义为银，也常指钱财；“银子”既保留原词意象，也适合古代圣殿款项的语境。
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: 殿里所得的
  rationale: 这里的“房屋”按上下文特指圣殿；“所得的”可表达款项在那里收集、汇集而来的语境含义，同时不暗示偶然发现。
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: 交在……手中
  rationale: 保留“放在某人手中”的希伯来语意象，同时清楚表达把银子交付给相关人员掌管。
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: 工程的工人
  rationale: 该短语指实际承办修缮工作的人；结合上下文译为“工程的工人”明确自然。
- source_word: הַמֻּפְקָדִים בֵּית יְהוָה
  choice: 负责耶和华殿工程的
  rationale: 被动分词表示受委派、被派负责；中文用“负责”自然表达其受托管理或监督圣殿工程的职分。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接音译四字神名，在现代中文圣经语境中通行，并保留其作为专名的性质。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用神的专名，而非“主”这一称号；“耶和华”是简体中文读者最熟悉的专名形式，同时不把专名改成头衔。
- issue: בַּבַּיִת所指的“殿”
  choice: 按语境译为圣殿性的“殿”
  alternative: 直译为“房屋”
  rationale: 上下文及句末“耶和华殿”明确表明所指为圣殿；译作“殿”避免中文读者误解为普通房屋，但脚注保留原文的字面表达。
translation_notes:
  register: 采用庄重而自然的现代标准普通话。“书记”体现宫廷官职，“回报”避免生硬复制希伯来语习语；正文保留“倒出来”和“交在……手中”的具体意象，并用脚注说明可选理解。
