    issue: “殿里所得的银子”未保留“被找到的”措辞。
    rationale: הַנִּמְצָא意为“被找到的”。“所得的”可暗示收入、征集或收取，属于从上下文引入的解释，且正文不应取代本节原有的“找到”表述。
  - severity: low
    issue: “负责耶和华殿工程的工人”略收窄原文的管理对象。
    rationale: הַמֻּפְקָדִים修饰做工者，后接“耶和华的殿”，字面为“被委派管理耶和华殿的”。本节未明说“工程”；虽上下文涉及修缮，但宜不在正文增添限定。
  - severity: low
    issue: 文化脚注[c]的锚点置于整句末尾，离其所说明的首次“殿”较远。
    rationale: 脚注说明的是בַּבַּיִת，宜紧贴“殿里”标注，以免读者误以为其专指句末“耶和华殿”。
