  text: וַ֠/יֹּאמֶר חִלְקִיָּ֜הוּ הַ/כֹּהֵ֤ן הַ/גָּדוֹל֙ עַל שָׁפָ֣ן הַ/סֹּפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֨ן חִלְקִיָּ֧ה אֶת הַ/סֵּ֛פֶר אֶל שָׁפָ֖ן וַ/יִּקְרָאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: zh_hans
  text: 大祭司希勒家对书记官沙番说：“我在雅威的殿[c]里找到了律法书[a]。”希勒家把书交给沙番，他就读了这书[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “律法书”也可译作“律法书卷”；希伯来语סֵפֶר可指书卷或成文文献。
    reason: lexical_alternative
  - marker: b
    text: 或译：“他就从书中宣读。”原文未重述动词的主语；按上下文，最可能指沙番。
    reason: lexical_alternative
  - marker: c
    text: “雅威的殿”原文直译为“雅威的家”，这里指圣殿。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事性连续式推动事件发展；现代汉语依靠语序即可自然表达先后，不必机械译出“于是”。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该祭司首长职分在现代汉语圣经语境中的明确、通行称谓。
- source_word: הַסֹּפֵר
  choice: 书记官
  rationale: 该词可指负责书写及行政事务的官员；“书记官”既保留书写职能，也体现其宫廷或行政身份。
- source_word: סֵפֶר הַתּוֹרָה
  choice: 律法书
  rationale: 在本段盟约与律法文本的语境中，תּוֹרָה译作“律法”合适；סֵפֶר可指书卷或成文文献，正文用自然且通行的“书”，并以脚注保留“书卷”这一可能表达。
- source_word: מָצָאתִי
  choice: 找到了
  rationale: 完成式表示已经发生、且与当前宣告密切相关的发现；“找到了”自然传达这一结果。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿里
  rationale: 字面为“在雅威的家中”，在此明确指圣殿；正文译作“殿”可避免现代读者误解，同时脚注保留原文意象。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其专名性质，而不以称号代替。
- source_word: וַיִּתֵּן ... אֶת הַסֵּפֶר
  choice: 把书交给
  rationale: נתן基本义为“给”；在递交文书的场景中，“把书交给”准确而自然。
- source_word: וַיִּקְרָאֵהוּ
  choice: 沙番就读了这书
  rationale: 带宾语后缀的קרא最自然表示“读它”；沙番是最近且符合语境的阳性单数先行对象，因此在汉语中明说主语以免误解。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。译为“雅威”可清楚保留盟约神名的专名性质，不用称号代替。
- issue: וַיִּקְרָאֵהוּ的主语与宾语关系
  choice: 沙番读了这书
  alternative: 希勒家读了这书；沙番从书中宣读
  rationale: 希伯来语动词本身只标明阳性单数主语，未重复姓名；按最近先行者和叙事进程，沙番最可能是主语。宾语后缀通常表示“读它”，但“从其中读”也有可能，故以脚注保留。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“书记官”兼顾古代行政职分与普通读者的可理解性；人名采用通行汉译“希勒家、沙番”，神名译作“雅威”。正文明确重复“沙番”，避免汉语代词造成不必要的主语歧义，同时用脚注保留读法上的次要可能。
