source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: zh_hans
  text: “你们去[a]，为我、为百姓和全犹大，就这本发现的书上所记的话求问耶和华；因为耶和华向我们燃起的烈怒极大，我们的先祖[b]没有听从这书上的话，也没有照着书上一切为我们所写的去行。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “求问”也可译作“寻求”或“请示”；这里的语境偏重正式求取耶和华的指示。
    reason: lexical_alternative
  - marker: b
    text: “先祖”原文直译为“父辈”，这里指民族的前代。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: 求问耶和华
  rationale: 在本语境中，דרשׁ以耶和华为宾语，指为获得神的指示而正式求问；“求问”既自然，也比泛指敬虔追求的“寻求”更切合约西亚的命令。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经语体中广为人知的专名形式，明确呈现四字神名，而不以“主”替代。
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: 为我、为百姓和全犹大
  rationale: בְּעַד表示代表或为了某人而求问；“为”简洁自然，并保留代理性的含义。
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: 有关这本刚发现的书上的话
  rationale: עַל引出求问的事项；“书上的话”保留דִּבְרֵי的文本焦点，分词הַנִּמְצָא按上下文自然译作“刚发现的”。
- source_word: חֲמַת יְהוָה
  choice: 耶和华……的烈怒
  rationale: חֵמָה带有炽烈、审判性的愤怒；“烈怒”比一般的“怒气”更充分传达其强度。
- source_word: נִצְּתָה בָנוּ
  choice: 向我们发出
  rationale: 原词具有被点燃、燃烧起来的意象；汉语常说怒气“向……发作/发出”。此处以“发出”表达敌对指向，并避免生硬直译为“在我们身上点燃”。
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: 我们的先祖没有听从
  rationale: שׁמע在此包含听见并顺服的意思，后接“去行”进一步说明顺服层面；“听从”比单纯“听”更符合汉语表达。“先祖”自然指以色列民族前代，并不抹去源语阳性形式。
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: 没有照着其中一切……所写的去行
  rationale: “照着”保留比较介词כְּ，“一切”保留整体性；在汉语中补出第二个“没有”，清楚呈现未听从所导致的未遵行。
- source_word: עָלֵינוּ
  choice: 关乎我们
  rationale: 原介词短语可指所写内容适用于、涉及当前群体；“关乎我们”保留其开放性，不武断限定为“攻击我们”或“为我们”。
theological_decisions:
- issue: 四字神名יהוה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用神的专名。中文正文保留专名而非以“主”代替；“耶和华”是现代普通读者最熟悉且庄重的中文形式。
- issue: אֲבֹתֵינוּ所指的前代群体
  choice: 我们的先祖
  alternative: 我们的父辈
  rationale: 这里指民族的前代，并非仅指直接父亲一代。“先祖”准确传达历史与群体延续性，同时不加入特定教派解释。
- issue: עָלֵינוּ的神学指向
  choice: 关乎我们
  alternative: 针对我们
  rationale: 上下文虽强调审判，介词本身仍可泛指适用于或涉及群体的记载；采用较开放的译法，保留原文张力，不把全部所写内容预先限定为定罪。
translation_notes:
  register: 采用现代、庄重而易懂的普通话书面语。“求问”“烈怒”“先祖”“关乎”保留经文语体的尊严，但避免过度古雅。句法按汉语信息结构调整，同时保留原文因果关系和“听从—遵行”的紧密联系。
