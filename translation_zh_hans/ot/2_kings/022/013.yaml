- from: “你们去[a]，为我、为百姓和全犹大，求问耶和华有关这本刚发现的书上的话。因为耶和华向我们发出的烈怒甚大；我们的先祖[b]没有听从这书上的话，没有照着其中一切关乎我们所写的去行。”
  to: “你们去[a]，为我、为百姓和全犹大，就这本发现的书上所记的话求问耶和华；因为耶和华向我们燃起的烈怒极大，我们的先祖[b]没有听从这书上的话，也没有照着书上一切为我们所写的去行。”
  rationale: 修订仅处理两处安全且必要的问题：以“燃起”恢复耶和华烈怒被点燃的意象，并重组末句以消除汉语歧义。其余主要词汇、神名译法、代求范围及脚注锚点均予保留。
