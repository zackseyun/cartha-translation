base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: zh_hans
  text: 她对他们说：“雅威——以色列的上帝——如此说：你们要对那位差遣你们来见我的人说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: 她对他们说
  rationale: 按希伯来叙事体的连续动作自然译出；阴性单数动词明确指户勒大，介词短语表明她向使团发言。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信的固定公式；汉语“如此说”庄重而简洁。
- source_word: יְהוָה
  choice: 雅威
  rationale: 将四字神名按其专名音译，不以称号替代。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达构词链，说明雅威是以色列的上帝。
- source_word: אִמְרוּ
  choice: 你们要……说
  rationale: 译出复数命令式，受命者是整个使团。
- source_word: לָאִישׁ
  choice: 对……人
  rationale: אִישׁ在此指差遣使团的特定男性，即上下文中的王；为避免在本节中添加原文未明说的身份，正文仍译“人”。
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: 那差你们来见我的
  rationale: 自然表达关系从句；“来见我”在汉语中清楚呈现使团被差到户勒大这里。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；以“耶和华”或“主”等传统形式替代
  rationale: 原文直接使用以色列上帝的专名；音译“雅威”保留专名性质，也避免把它改成称号。
- issue: אִישׁ所指对象的表达
  choice: 人
  alternative: 男人；王
  rationale: 该词为阳性单数，语境明确所指是男性约西亚王；现代汉语中“那……的人”已可自然指特定男性，而译作“王”虽符合语境，却会把上下文信息直接加入正文。
- issue: 引语在本节末尾并未完成
  choice: 以冒号和未闭合的内层引号承接下一节
  alternative: 在本节末以句号并闭合引号
  rationale: “你们要对……说”所引出的信息从下一节开始；保留开放结构，忠实呈现跨节延续的先知话语。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留先知公式“如此说”，并以“上帝雅威”自然表达同位关系。由于本节语法和引语均延续至下一节，末尾不作完整收束。
