source:
  edition: WLC
  text: לָ/כֵן֩ הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ עַל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁר אֲנִ֥י מֵבִ֖יא עַל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: zh_hans
  text: 所以，看哪，我必使你归到你列祖那里；你必平安地[a]归入你的坟墓。你的眼睛必看不见我将要降在这地方的一切灾祸。”他们就把这话带回去禀告王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“在平安中”。这里的“平安”可能是说约西亚会在将临的审判以前去世，因而看不见那场灾祸，并不一定说明他死亡的具体方式。
    reason: 说明 בְּשָׁלוֹם 的语义范围，并保留其与王下23:29之间不应由译文消除的张力。
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文约西亚自卑并回应上帝话语所带出的结论，保留推论关系，同时符合现代汉语表达。
- source_word: הִנְנִי
  choice: 看哪，我必
  rationale: “看哪”保留神谕宣告中庄严的提示和强调；与后面的将来行动合译为自然而郑重的汉语。
- source_word: אֹסִפְךָ / נֶאֱסַפְתָּ
  choice: 使你归到……你必……归入
  rationale: 两个形式同出于 אסף。中文用重复的“归”尽量呈现呼应；按死亡语境处理为归到列祖、归入坟墓，而不直译成生硬的“聚集”。
- source_word: עַל אֲבֹתֶיךָ
  choice: 归到你列祖那里
  rationale: 这是与已故先祖同归的死亡惯用语。“列祖”简洁、庄重，并保留家族历史色彩。
- source_word: קִבְרֹתֶיךָ
  choice: 你的坟墓
  rationale: 希伯来文为复数，可能指属于其祖先家族的诸墓穴；现代汉语在此用集合意义的“坟墓”更自然，相关形式信息置于脚注说明。
- source_word: בְּשָׁלוֹם
  choice: 平安地
  rationale: 自然表达“在平安中”的状态；不把它进一步解释为死亡方式，并借脚注保留与约西亚后来战死之间的张力。
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: 你的眼睛必看不见
  rationale: 保留原文以“你的眼睛”为主语的鲜明表达和强调。
- source_word: הָרָעָה
  choice: 灾祸
  rationale: 在审判语境中指将临的灾难，而非道德意义的邪恶；“灾祸”庄重且清楚。
- source_word: מֵבִיא עַל
  choice: 将要降在
  rationale: 表达分词所含的迫近行动，并以“降在”自然呈现灾祸临到某地的审判语气。
- source_word: הַמָּקוֹם הַזֶּה
  choice: 这地方
  rationale: 保留原文宽泛指称，不擅自限定为圣殿、耶路撒冷或犹大全境。
- source_word: וַיָּשִׁיבוּ אֶת־הַמֶּלֶךְ דָּבָר
  choice: 他们就把这话带回去禀告王
  rationale: 自然呈现使者返回并向王复命的希伯来叙事公式；“禀告”符合王室语境而不过度古雅。
theological_decisions:
- issue: “在平安中”与约西亚后来在战事中死亡（王下23:29）的关系
  choice: 正文译作“平安地”，并用脚注说明它可能重在约西亚不会亲眼见到将临的审判，而不必限定死亡的具体方式。
  alternative: 把它明确解释为“安详地死去”，或为消除张力而改译成“在灾祸临到以前”。
  rationale: 原文只说 בְּשָׁלוֹם，紧接着又以“你的眼睛必看不见……灾祸”加以说明。翻译应保留这两句话及其张力，不应借译文强行协调后续叙事。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“看哪”“列祖”“禀告”保留神谕和王室叙事的郑重感；句法总体顺畅，不以解释性改写消除原文歧义。
