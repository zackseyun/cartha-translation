  yaml_path: translation/ot/2_kings/022/011.yaml
  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: zh_hans
  text: 王听见律法书[a]中的话，就撕裂了自己的衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“律法卷轴”。希伯来语 סֵפֶר 可指卷轴形式的书卷，也可泛指成文的书籍或文献。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 听见……就
  rationale: וַיְהִי承接叙事，כ加不定式构造表示时间背景；汉语用“听见……就……”自然表达紧接发生的动作，无须生硬译出“事情发生了”。
- source_word: הַמֶּלֶךְ
  choice: 王
  rationale: 定冠词所指的王在上下文中明确；现代汉语叙事中译作“王”简洁自然。
- source_word: דִּבְרֵי
  choice: ……上的话
  rationale: דָּבָר在此指书卷中写下并被宣读的言语；“话”保留了原文的言语表达，而“上的”符合汉语说明文本载体的习惯。
- source_word: סֵפֶר הַתּוֹרָה
  choice: 律法书
  rationale: סֵפֶר可指书卷或成文文献，תּוֹרָה在此语境指具有盟约权威的律法；“律法书”清楚、庄重，并保留传统称谓。脚注注明“律法书卷”这一可能译法。
- source_word: וַיִּקְרַע
  choice: 就撕裂了
  rationale: קָרַע指撕开；“撕裂”准确而庄重，并与圣经中表达悲痛、震惊或悔悟的动作相符。“就”体现叙事动作的紧接。
- source_word: בְּגָדָיו
  choice: 自己的衣服
  rationale: בֶּגֶד为衣服、衣裳；复数在现代汉语中不必另加复数标记。“自己的”明确反身所属，避免“他的”可能造成的指代歧义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“听见……就……”自然呈现希伯来语的时间从句和连续动作；保留“律法书”这一清楚且语境恰当的称谓，同时以脚注呈现סֵפֶר在载体形式上的词义空间。
