base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: zh_hans
  text: 你上去见大祭司希勒家，让他清点送进雅威殿里的银子，就是守门人[a]从百姓那里收集来的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“看守门槛的人”；或译“守门槛的人”。
    reason: 保留שֹׁמְרֵי הַסַּף的字面表达，同时正文采用现代汉语中自然的职分名称“守门人”。
lexical_decisions:
- source_word: עֲלֵה
  choice: 你上到……那里去
  rationale: 保留עלה的上行方向含义；结合王宫与圣殿场景，用现代汉语“上到……那里去”自然表达命令。
- source_word: חִלְקִיָּהוּ
  choice: 希勒家
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 这是该祭司职分在现代汉语中的固定、准确称呼。
- source_word: וְיַתֵּם
  choice: 让他清点
  rationale: 此处使役式在圣殿款项语境中指完成核算；“清点”兼顾计数和核清款项，较“完成”更明确，又不过度解释。
- source_word: הַכֶּסֶף
  choice: 银子
  rationale: 保留希伯来文“银”的具体表达，同时中文读者可自然理解其作为钱款的用途。
- source_word: הַמּוּבָא
  choice: 送进……里的
  rationale: 被动分词修饰银子，表示款项已被带入圣殿；“送进”在中文中简洁自然。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: “殿”自然表示雅威的圣殿，并避免“雅威的家”在现代汉语中可能产生的误解；神名按音译呈现。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见形式音译四字神名，保留专名性质，不以称号替代。
- source_word: אָסְפוּ
  choice: 收集来的
  rationale: 准确表达从百姓那里汇集款项的已成事实，并与后文中文句式顺畅衔接。
- source_word: שֹׁמְרֵי הַסַּף
  choice: 守门槛的人
  rationale: 正文保留“门槛”的源语意象和职务表述；脚注给出功能性的“守门人”。
- source_word: מֵאֵת הָעָם
  choice: 从百姓那里
  rationale: 直接对应源语，既不缩小也不扩大所指群体。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神专名的性质，不以称号替代，也不将传统混合读音置于正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。句子保持王命的直接语气；“银子”保留古代款项的具体形态，“雅威殿”则以自然中文表达“雅威的殿宇”。
