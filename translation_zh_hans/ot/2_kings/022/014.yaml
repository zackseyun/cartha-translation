  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: zh_hans
  text: 于是，希勒家祭司、亚希甘、亚革波、沙番和亚撒雅去见女先知户勒大。户勒大是沙龙的妻子；沙龙是提克瓦的儿子、哈珥哈斯的孙子，掌管衣服。她住在耶路撒冷的第二区[a]；他们便同她谈话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “第二区”也可译作“第二街区”；希伯来文可能指耶路撒冷一个特定城区。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 于是……去见
  rationale: 连续式叙事动词推进情节；“于是”自然表达承接关系，“去见”符合后接人物宾语的现代汉语习惯。
- source_word: הַכֹּהֵן
  choice: 祭司
  rationale: 原文只称希勒家为“祭司”，没有明确写“大祭司”，因此不从上下文补入更高头衔。
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: 女先知户勒大
  rationale: נְבִיאָה 是明确的阴性名词；“女先知”准确而自然地保留性别信息。
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: 哈珥哈斯的孙子、提克瓦的儿子
  rationale: 按汉语亲属链条重排，使沙龙与父亲及祖父的关系清楚，同时保留全部谱系信息。
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: 掌管衣服的
  rationale: 字面为“看守衣服者”，在此很可能是职务称谓；“掌管衣服”既贴近原文，也能传达职责，而不额外限定为王室衣橱。
- source_word: וְהִיא יֹשֶׁבֶת
  choice: 当时她住在
  rationale: יֹשֶׁבֶת 在地点说明中表示居住；“当时她住在”是自然的现代汉语表达。
- source_word: בַּמִּשְׁנֶה
  choice: 第二区
  rationale: 该词很可能指耶路撒冷一个特定城区；译作“第二区”保留“第二”之义，并以脚注说明不确定性。
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: 他们向她请示
  rationale: 字面是“他们对她说话”；结合王命差遣他们求问耶和华的语境，“请示”自然传达此次谈话的咨询性质，但不增添她回答的内容。
theological_decisions:
- issue: 是否把希勒家的称号强化为“大祭司”
  choice: 祭司
  alternative: 大祭司
  rationale: 本节原文只有定冠词加“祭司”，没有“大”或等同词；遵循原文优先，不把别处提供的身份信息写进本节。
- issue: 如何表达户勒大的先知身份
  choice: 女先知
  alternative: 先知
  rationale: 希伯来文使用明确的阴性形式；译文保留这一信息，不将性别特征抹平。
- issue: 末句是否只按字面译为“对她说”
  choice: 向她请示
  alternative: 对她说话
  rationale: 上下文显示此行目的是求问神谕；“请示”体现语用功能，但仍不把后文的神谕内容提前写入。
translation_notes:
  register: 采用庄重、清晰的现代标准汉语。人名按常见中文圣经音译处理；谱系依汉语习惯重排。正文仅设置一个与真实词义不确定性相关的脚注，且标记已在正文出现。
