base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: zh_hans
  text: 不过，对于那差你们去求问雅威的犹大王，你们要这样对他说：“以色列的上帝雅威如此说：至于你所听见的那些话——[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文在这里留下一个未完的句子，要到下一节才接续完成。
    reason: 说明希伯来语的悬置句法，避免读者误以为译文残缺。
lexical_decisions:
- source_word: וְאֶל
  choice: 不过，对于
  rationale: 介词短语转向另一个受话对象，并与上文形成话语上的转折；“不过，对于”在现代汉语中自然地保留这一转换。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 简洁、自然地表达希伯来语的属格结构。
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: 那差你们……的
  rationale: 将作定语的分词译为汉语关系结构，明确指认这位王；“你们”保留原文复数。
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: 去求问雅威
  rationale: 本语境是借先知寻求神的指示，“求问”比泛义的“寻求”更准确。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神圣四字名的音译，保留其作为以色列之神专名的性质，而不以称号代替。
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: 你们要这样对他说
  rationale: 自然表达传信公式的指令语气，并保留复数主语与单数间接受词。
- source_word: כֹּה אָמַר יְהוָה
  choice: 雅威如此说
  rationale: 保留先知书中正式、庄重的传信公式。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接表达原文的构造关系，并保留盟约群体的身份指向。
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: 至于你所听见的那些话——
  rationale: “至于”体现话题前置；破折号保留原文悬置未完、要到下一节才接续完成的句法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名；“雅威”按较通行的学术拟音呈现该名，避免将专名默默替换为称号。
- issue: 本节末尾悬置句法的处理
  choice: 保留“至于……——”的未完结构
  alternative: 依据下一节补足为完整句
  rationale: 希伯来文本在本节末尾有意悬置，并在下一节完成。保留未完结构可忠实呈现原文的篇章推进，不提前解释或补足。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“差”保留王命派遣的正式色彩；引语中先说“以色列的上帝”，再接专名“雅威”，既符合原文语序，也保持先知宣告的庄严语体。
