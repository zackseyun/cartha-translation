  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: zh_hans
  text: 因为他们离弃了我，向别的神献上祭物[a]，为要因他们手所做的一切惹我发怒。所以，我的烈怒已经在这地方燃起，必不熄灭。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“向别的神烧香。”此处动词也可泛指以焚烧方式献上祭物。
    reason: קטר在此常可指焚香，但其语义未必限于焚香；脚注保留较具体的可能译法。
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: 因为
  rationale: 这一复合表达在此引出审判的原因；“因为”准确而自然。
- source_word: עֲזָבוּנִי
  choice: 他们离弃了我
  rationale: “离弃”保留了עזב所含的关系与盟约意味，也符合庄重的现代汉语。
- source_word: וַיְקַטְּרוּ
  choice: 焚烧祭物
  rationale: קטר的强意词干指以焚烧方式献上祭物，常特指烧香，但未必只限于香；正文采用较宽的表达，脚注保留较具体的译法。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别的神
  rationale: 直接表达他们敬拜耶和华以外的神明，不额外加入“外邦”等解释。
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: 为要……惹我发怒
  rationale: 既保留לְמַעַן的目的或结果色彩，也明确呈现הכעיס的激怒含义。
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: 借着他们双手所做的一切
  rationale: 保留“手所做的”这一希伯来语意象及其对偶像崇拜的讽刺意味，同时不把所指限定为偶像。
- source_word: וְנִצְּתָה חֲמָתִי
  choice: 我的烈怒因此……燃起
  rationale: “烈怒”体现חֵמָה的强烈程度；“燃起”保留原文火焰隐喻，并与后面的“熄灭”呼应。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: 向这地方
  rationale: 介词字面可作“在”，但此处烈怒以这地方为对象；“向这地方”在汉语中清楚表达审判的指向。
- source_word: וְלֹא תִכְבֶּה
  choice: 必不熄灭
  rationale: 保留火焰隐喻；“必不”表达这一判断的确定性和庄严语气。
theological_decisions:
- issue: 对上帝发怒的拟人性表达
  choice: 保留“惹我发怒”和“我的烈怒”
  alternative: 弱化为非人格化的审判或惩罚
  rationale: 原文明确以关系性、情感性的语言描述上帝的审判；翻译不应将这种张力抽象化。
- issue: 审判的火焰意象
  choice: 保留“燃起”与“熄灭”的对应
  alternative: 意译为惩罚已经确定，无法撤销
  rationale: 原文刻意用不可熄灭的火描绘烈怒；保留隐喻可传达其文学和神学力度，而不引入经文未明说的后世教义。
- issue: “双手所做的一切”的所指范围
  choice: 保留可兼指偶像和其他行为的开放表达
  alternative: 明确译为“他们亲手制造的一切偶像”
  rationale: 上下文强烈涉及偶像崇拜，但原文本身使用较宽的“手所做的一切”；不应在正文中消除这一语义余地。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“离弃”“烈怒”保持经文的严肃语气；“燃起／熄灭”保存原文连续的火焰意象。脚注标记[a]已置于正文对应位置。
