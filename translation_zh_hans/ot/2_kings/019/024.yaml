base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: zh_hans
  text: 我亲自掘井，喝外邦的水；我以脚掌使埃及所有的河道[a]干涸。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “河道”也可译作“尼罗河的水道”或“运河”；这里的希伯来词常特指尼罗河及其相关水道。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: 我亲自
  rationale: 希伯来文显式主语带有强调意味；“我亲自”保留君王自夸的语气。
- source_word: קַרְתִּי
  choice: 挖井
  rationale: 此处动词指挖掘取水；汉语若只说“挖”宾语不明，译作“挖井”自然地表达语境隐含的水源。
- source_word: מַיִם זָרִים
  choice: 外邦的水
  rationale: זָרִים意为陌生、外来的；在征服语境中，“外邦的水”既自然，也保留异域水源的含义。
- source_word: וְאַחְרִב
  choice: 踏干了
  rationale: 使役形在水道语境中表示使之干涸；与脚掌意象结合译为“踏干了”，保留夸张而强势的军事自夸。
- source_word: בְּכַף פְּעָמַי
  choice: 用脚掌
  rationale: כַּף用于脚时指脚掌；“用脚掌”具体、自然，表现轻易制服之意。
- source_word: יְאֹרֵי
  choice: 河道
  rationale: יְאֹר可指河流，尤其是尼罗河及其支流、渠道；“河道”能涵盖天然与人工水道。
- source_word: מָצוֹר
  choice: 埃及
  rationale: 与יְאֹרֵי连用时，מָצוֹר宜理解为埃及的诗体称呼；正文直译为地名较清楚。
theological_decisions:
- issue: 第一人称话语的所指与修辞力量
  choice: 保留亚述君王傲慢、夸张的第一人称自夸，不在正文中加入评价或说话者说明。
  alternative: 明确增译“亚述王说”，或把话语弱化为一般军事宣传。
  rationale: 上下文已交代说话背景；本节应保存原文鲜明的自我夸耀及其神学张力，而不把解释写进正文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“挖井，喝了”保持原文简短并列的节奏；“踏干”凝练地结合使水干涸与脚掌践踏的意象。脚注标记置于相关分句之后。
