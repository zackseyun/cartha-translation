  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: zh_hans
  text: 那一夜，雅威的使者出去，在亚述的军营中击杀了十八万五千人。清早，人们起来时[a]，看哪，只见尽都是死尸[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他们清早起来”；“他们”所指何人没有说明。
    reason: 保留希伯来语主语所指不明确这一点。
  - marker: b
    text: 原文为“尸体，死的”，是强调死亡状态的表达。
    reason: 说明原文叠加名词和分词所形成的强调意味。
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: 那一夜
  rationale: 希伯来语叙事公式直译为“事情发生在那一夜”；现代汉语用“那一夜”即可自然保留时间衔接，不必机械译出“事情发生”。
- source_word: מַלְאַךְ יְהוָה
  choice: 雅威的使者
  rationale: מַלְאַךְ可指“使者”或“天使”；这里是执行超自然审判的使者。译作“使者”保留原词的语义范围，同时上下文已清楚表明其来自雅威。
- source_word: וַיֵּצֵא
  choice: 出去
  rationale: 忠实对应יצא的基本意义，并符合叙事中的行动推进。
- source_word: וַיַּךְ
  choice: 击杀了
  rationale: נכה本义为“击打”，在此审判和军事语境中结果显然是死亡；“击杀”兼顾动作和致死结果。
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: 在亚述营中
  rationale: 简洁对应“在亚述的营中”；此处“亚述”借指亚述军队。
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: 十八万五千人
  rationale: 按现代汉语数字表达准确翻译；补出量词“人”使句子自然，所指数目由上下文确定为人员。
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: 清早，人们起来时
  rationale: 原文为未明确所指的第三人称复数“他们清早起来”。用泛指的“人们”避免武断认定具体人物，“时”则自然连接随后所见的情景。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留הִנֵּה引人注意、突显惊人景象的修辞作用；“看哪”符合庄重的现代圣经文体。
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: 他们全都成了死尸
  rationale: “全都”保留כֻלָּם的总体性；“死尸”自然传达“尸体，死的”这一带强调意味的希伯来语组合。“成了”在汉语中清楚表达眼前所见的结果。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。译作“雅威”较贴近学界通常重构的读音Yahweh，并保留其作为专名的性质；“耶和华”是中文传统形式，但其语音源流更接近Jehovah。
- issue: מַלְאַךְ在本节中的身份表达
  choice: 使者
  alternative: 天使
  rationale: 原词本身兼有“使者”和“天使”的意义。选择“使者”不超出词义，也不预先界定这位执行神圣审判者的本体身份；上下文足以显示其超自然职能。
translation_notes:
  register: 采用自然、庄重而易懂的现代标准汉语。叙事公式作适度压缩；保留“看哪”的修辞突显作用。正文中的[a]、[b]均与脚注对应。
