- from: 那一夜，雅威的使者出去，在亚述营中击杀了十八万五千人。清早，人们起来时[a]，看哪，他们全都成了死尸[b]。
  to: 那一夜，雅威的使者出去，在亚述的军营中击杀了十八万五千人。清早，人们起来时[a]，看哪，只见尽都是死尸[b]。
  rationale: 修订仅为消除汉语代词回指歧义，并使“亚述的军营”更自然。以“看哪，只见尽都是死尸”对应הִנֵּה及“全都／尸体，死的”的突现与强调，不额外指定清早起来者的身份，也不改变叙事意义。
