  yaml_path: translation/ot/2_kings/019/027.yaml
  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: zh_hans
  text: 但你坐下[a]、出去、进来，我都知道；你向我发怒[b]，我也知道。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坐下、出去、进来”是希伯来语的整体性表达，指一个人的一切行动和举止。
    reason: cultural_note
  - marker: b
    text: “发怒”也可译作“激动”或“向我狂怒”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: 你坐下
  rationale: 源自ישׁב；与“出去、进来”并列，保留希伯来语具体表达，不先将其解释为“居住”或“停留”。
- source_word: וְצֵאתְךָ
  choice: 出去
  rationale: 源自יצא，与“进来”构成惯用配对；“出去”是自然、贴近原文的现代汉语。
- source_word: וּבֹאֲךָ
  choice: 进来
  rationale: 源自בוא，与“出去”相配，保留原文所指日常行动整体的表达。
- source_word: יָדָעְתִּי
  choice: 我都知道／我也知道
  rationale: ידע的Qal完成式第一人称单数，在此表达上帝确实而全面的知晓；汉语用现在时“知道”最自然。为使两个宾语的统辖关系清楚，后半句复现谓语。
- source_word: הִתְרַגֶּזְךָ
  choice: 你发怒
  rationale: רגז的Hitpael形式可表示激动、震怒或狂怒；“发怒”保留敌对情绪的力度，同时避免过度解释为“傲慢”或“亵渎”。
- source_word: אֵלָי
  choice: 向我
  rationale: אֶל基本义为“向、朝着”；结合“发怒”，现代汉语“向我发怒”自然表达敌对指向，也保留介词本身的方向性。
- source_word: וְאֵת
  choice: 也
  rationale: 连词加直接宾语标记引出“我知道”的另一个宾语；汉语以“也”并列承接，避免生硬直译宾语标记。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的简体中文。保留“坐下、出去、进来”的具体希伯来语意象，并用脚注说明其整体性含义；后半句复现“我也知道”，以符合汉语信息结构，同时不改变原文中两个宾语同受יָדָעְתִּי支配的关系。
