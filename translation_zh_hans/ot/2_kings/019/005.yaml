  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 于是……来到
  rationale: 未完成式连续体在叙事中推进下一事件；“于是”自然承接上文，而不额外强化因果关系。“来到”准确表达 בוא 的基本意义。
- source_word: עַבְדֵי
  choice: 臣仆
  rationale: עבד 的复数构造式可指仆人，也可指王室侍从或官员。此处是奉王差遣的人；“臣仆”既保留服事君王的含义，也符合宫廷语境，避免将其过度限定为正式官员。
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: 希西家王
  rationale: 原文为带定冠词的“王”与专名“希西家”相连；现代汉语以“希西家王”自然表明其王室身份。
- source_word: אֶל
  choice: 到……那里
  rationale: 该介词表示朝向某人的移动；汉语用“来到以赛亚那里”自然表达抵达其所在之处。
- source_word: יְשַׁעְיָהוּ
  choice: 以赛亚
  rationale: 采用现代中文圣经传统中通行的人名译法。
