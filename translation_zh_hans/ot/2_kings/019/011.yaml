  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: zh_hans
  text: 看哪，你已经听说亚述诸王怎样对待各地，把它们交付毁灭[a]；难道你还能逃脱吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把它们置于禁毁之下”；即将它们交付彻底毁灭。
    reason: 说明希伯来语 חרם 的专门含义，并提供较形式对应的译法。
lexical_decisions:
- source_word: הִנֵּה
  choice: 看哪
  rationale: 作为强调性的引语词，唤起听者注意；“看哪”庄重而清楚，也保留了原文的强烈语气。
- source_word: שָׁמַעְתָּ
  choice: 你已经听说
  rationale: 第二人称阳性单数完成式，表示对方早已得知、且此事与当前处境相关。
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: 怎样对待
  rationale: 自然表达“所做的事”，并引出随后说明其具体行为的分句。
- source_word: מַלְכֵי אַשּׁוּר
  choice: 亚述诸王
  rationale: 保留复数和领属关系；“诸王”符合庄重的历史叙事语体。
- source_word: לְכָל הָאֲרָצוֹת
  choice: 对待各地
  rationale: אָ֫רֶץ 的复数在此指各片疆土或各国；“各地”简洁地保留政治地理含义，不误解为全地球。
- source_word: לְהַחֲרִימָם
  choice: 把它们尽行毁灭
  rationale: חרם 的使役式在战争语境中指使对象归于毁灭；“尽行毁灭”既表达彻底性，又避免在正文中使用难懂的专门术语。
- source_word: וְאַתָּה תִּנָּצֵל
  choice: 难道你还能得救吗
  rationale: 独立代词 אַתָּה 突出“你”的对比；反问句保留威吓嘲讽的语气，נצל 的被动式译作“得救”。
theological_decisions:
- issue: 军事审判语境中 חרם 的表达
  choice: 尽行毁灭
  alternative: 使它们归于毁灭／把它们置于禁毁之下
  rationale: 原词不只是一般意义的破坏，而有将对象完全交付毁灭的含义。正文采用自然可懂的“尽行毁灭”，脚注说明其较专门的词义，避免额外引入宗派性解释。
- issue: 末句的语气
  choice: 译为反问：“难道你还能得救吗？”
  alternative: 陈述式：“而你将得救。”
  rationale: 上下文是亚述王的威吓；连接词、强调代词和未完成式共同形成明显的讥讽性反问。该译法保留其修辞力量，而不改变“得救”本身的被动含义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“看哪”保留经文语体的强调感；“亚述诸王”“尽行毁灭”与历史战争语境相称。末句用“难道……吗”呈现原文的威吓性反问。
