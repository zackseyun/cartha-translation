  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר יָבֹ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָבֹ֖א נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: zh_hans
  text: 他从哪条路而来，就必从那条路返回；他必不到这城来。这是雅威的宣告。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ יָשׁוּב
  choice: 他从哪条路来，也必从原路返回
  rationale: 希伯来文直译近似“他从所来的那条路，必由它返回”。中文用“从哪条路来……从原路返回”自然地表达同一路线，并保留返回、折返之意。
- source_word: יָבֹא
  choice: 来
  rationale: 虽为未完成式，此处关系从句描述敌军已经采取的来路；现代汉语用“来”即可由语境表达，不必强加明确的过去时标记。
- source_word: יָשׁוּב
  choice: 必……返回
  rationale: שׁוּב表示返回或折返；“必”传达此处预告的确定性。
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: 他必不到这城来
  rationale: 保留“到这城来”的基本意义，不把 יָבֹא 加强解释为“进入”或“攻入”。
- source_word: נְאֻם יְהוָה
  choice: 这是雅威的宣告
  rationale: נְאֻם是庄重的先知宣告公式；以“这是……的宣告”在现代中文中兼顾准确与庄严。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来神名的常见学术拟音译出专名，不以称号替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；译作“雅威”保留其专名性质，也较贴近通常重构的读音。
- issue: 敌军是否会进入此城
  choice: 不到这城来
  alternative: 不进入这城；不攻入这城
  rationale: 原文只用一般动词 בוא“来、到”，本节不宜自行加入“进入”或军事性的“攻入”，以免缩窄其表达范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“从原路返回”是对希伯来语照应结构的自然表达；分号呈现返回与不到城中这两个彼此相关的宣告。
