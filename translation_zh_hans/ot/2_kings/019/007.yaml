  text: הִנְ/נִ֨י נֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב לְ/אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: zh_hans
  text: “看哪，我要使灵进入他里面；他必听见一个消息[b]，就返回本国。我要使他在本国倒在刀剑之下。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 或译“一个报告”或“一个传闻”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: 看哪，我要
  rationale: “看哪”保留宣告开头唤起注意的语气；“我要”结合其后的分词，表达即将采取的行动，也符合现代汉语的预告语境。
- source_word: נֹתֵן בּוֹ רוּחַ
  choice: 把一种灵放在他里面
  rationale: 贴近原文“在他里面放置一种灵”的结构，既表达上帝主动施行影响，也不把רוּחַ的具体性质限定为心理状态、风或气息。
- source_word: שְׁמוּעָה
  choice: 一个消息
  rationale: 该词可指消息、传闻或报告；“消息”在现代汉语中自然且保持中性，不预断其是否已经证实。
- source_word: וְשָׁב לְאַרְצוֹ
  choice: 就返回本国
  rationale: “返回”准确表达שׁוב的回转义；“本国”自然体现第三人称所有关系，并与后句重复形成呼应。
- source_word: וְהִפַּלְתִּיו בַּחֶרֶב
  choice: 我要使他……倒在刀下
  rationale: “使他倒下”保留הִפִּיל的使役含义；“倒在刀下”自然表达בַּחֶרֶב所指的刀剑致死，而不过度具体化死亡方式。
- source_word: בְּאַרְצוֹ
  choice: 在本国
  rationale: 保留原文对“他的国土”的重复，突出他回国后将在那里灭亡。
theological_decisions:
- issue: 审判宣告中רוּחַ的含义
  choice: 一种灵
  alternative: 一种意念／心态；一阵风；一口气息
  rationale: 上下文表明耶和华将影响亚述王，使他听见消息后返回，但没有明确说明这种作用的机制。“一种灵”保留该词的语义广度，以及上帝主导事件却未详述如何施行的张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“看哪”保留先知性宣告的注意标记；分号呈现上帝行动及其后果的连续关系。脚注标记按其实际所注释的词分别置于“灵”和“消息”之后。
