base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: zh_hans
  text: 你难道没有听见吗？很久以前我就造作了它[a]；自古以来我塑造了它[b]。如今我使它实现，以致你把坚固城夷为废墟堆[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “很久以前”所译的希伯来语也可按空间理解为“从远处”。在这里，它与“自古以来”并列，较可能表示久远的时间。
    reason: lexical_alternative
  - marker: b
    text: “塑造”也可译作“形成”；按上下文亦可理解为“预先定意”。
    reason: lexical_alternative
  - marker: c
    text: “废墟堆”所译的原文短语含义较难确定，直译近于“堆垒、荒墟”，也可能理解为“耸立的堆垒”。
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: 你难道没有听见吗
  rationale: 保留期待肯定回答的反问语气；“听见”在此也含有获知之意。
- source_word: לְמֵרָחוֹק
  choice: 早已
  rationale: 该表达字面可指空间上的“从远处”，但与“从古时”并列时，更可能表示久远的时间。
- source_word: אֹתָהּ עָשִׂיתִי
  choice: 这事我早已做成
  rationale: 阴性单数代词的具体先行词未明，译为“这事”保留概括性；עשה采用宽泛的“做成”，避免过度限定为创造或计划。
- source_word: לִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: 从古时我就已定意
  rationale: יצר本义为塑造、形成；在本句论及久远筹定之事的语境中，“定意”自然表达预先构定，同时以脚注保留较形式对应的译法。
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: 如今我使它实现
  rationale: 直译为“如今我把它带来”，语境指使先前所定之事成为现实。
- source_word: וּתְהִי לַהְשׁוֹת
  choice: 使你将……毁为
  rationale: 按上下文将隐含的受话者亚述王明确为“你”，并表达其行动在上帝使计划实现之下所产生的结果或目的，不替文本裁定二者。
- source_word: גַּלִּים נִצִּים
  choice: 荒废的土堆
  rationale: 该短语罕见且困难；“荒废的土堆”传达城被毁后成为废墟堆的图景，同时脚注说明其他可能理解。
theological_decisions:
- issue: 上帝对亚述征服行动的主权
  choice: 译文表明亚述王的军事成就是上帝久远所定、如今使之实现的事
  alternative: 弱化为上帝只是预知此事，或强化为对亚述暴行的道德认可
  rationale: 希伯来文明确使用“做成／形成”及“使之来到”的第一人称神圣行动语言；译文保留这种主权张力，却不加入有关哲学决定论或道德赞同的结论。
- issue: וּתְהִי所表达的目的或结果
  choice: 用“使你……”保留目的与结果相交的语气
  alternative: 明确译成“为要使你……”或“结果你便……”
  rationale: 该结构可按目的或结果理解，中文不作不必要的单一裁定。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“你难道没有听见吗”保留先知话语中的反问力度；“坚固城”“荒废的土堆”保持历史叙事和诗性宣告的语域。所有脚注标记均置于相关正文之后。
