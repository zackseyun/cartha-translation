  rationale: 修订以“造作／塑造”保留原文两个并列动词的形塑语汇及其与“如今我使它实现”的时序差别；以“以致”表达 וּתְהִי 可兼具结果与目的的连接，而不把其语法功能过度定死；以“废墟堆”较自然地表达毁城后的堆垒，同时通过脚注保留原文短语的不确定性。
