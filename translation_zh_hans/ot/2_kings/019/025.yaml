  - severity: medium
    issue: “定意”对 וִיצַרְתִּיהָ 的解释性较强。
    rationale: “定意”可表达上下文中的预定含义，却没有保留 יצר“形成、塑造”的形象性；正文宜采用较直接的“塑造”，将“定意”留作可选解释。
  - severity: low
    issue: “荒废的土堆”不够准确自然。
    rationale: גַּלִּים 指堆垒，语境中是毁城所成的废墟；“土堆”可能误指未受破坏的泥堆。
