  source_fidelity: 草案整体把握了神对亚述行动早已筹定、如今使之发生的宣告，也保留了结尾短语的困难性。不过，“做成”容易与后文“使它实现”重叠，并把前一句过早译为实现；“定意”则将 יצר 的“塑造／形成”意象解释得过强。
  naturalness: 原文中文总体庄重通顺，但“从古时我就已定意”略显生硬，“荒废的土堆”在现代汉语中容易联想到普通泥土堆，而非城邑毁坏后的废墟。修订后保持现代而庄重的表达。
  terminology: “坚固城”恰当。“塑造”较好保留 יצר 的形塑意象；“夷为废墟堆”对应毁坏城邑成为堆垒的画面，并以脚注保留该困难短语的其他理解。
