  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: zh_hans
  text: 希西家王听见这话，就撕裂衣服，披上麻布，进入雅威的殿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 听见这话，就
  rationale: 希伯来语叙事句式承接上文并引出随后的行动。现代汉语用“……就……”自然表达时间先后；“这话”补出原文语境中所听见的信息，但不增添具体内容。
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: 希西家王
  rationale: 现代汉语通常将君王称号置于人名之后，既自然又准确。
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: 撕裂衣服
  rationale: 准确保留古代人在哀痛、惊惧或谦卑中撕裂衣服的动作，同时采用普通读者易懂的表达。
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: 披上麻布
  rationale: 动词为反身意义，指他使自己以麻布遮身；“披上麻布”在现代汉语中简洁自然，并保留哀悼与降卑的文化动作。
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: 进入雅威的殿
  rationale: בוא 与地点结构在此表达进入。“殿”在该历史语境中清楚指雅威的圣殿，也比直译“房屋”更符合现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: שָּׂק
  choice: 麻布
  rationale: 该词指古代用于哀悼、降卑的粗糙织物；“麻布”是简体中文圣经语境中准确且易懂的对应词。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用神的专名。译作“雅威”较直接地保留专名性质，避免用“上主”这一称号替代；“耶和华”虽有悠久中文传统，但其读音源于较晚的混合形式。
- issue: בֵית יְהוָה 的表达
  choice: 雅威的殿
  alternative: 雅威的家；雅威的圣殿
  rationale: 这里所指是耶路撒冷圣殿。“殿”既保留“雅威之殿”的圣经惯用意象，又不必添加原文没有的“圣”字。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文连续动作的紧凑节奏，以“就”引出希西家的三项回应；不另加解释性神学判断。
