source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: zh_hans
  text: 希西家在雅威面前祷告说：“雅威，以色列的上帝，坐在基路伯之上[a]的那一位，惟有你是上帝，统管地上万国。天和地都是你造的。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“在基路伯之上坐着为王的那一位”。希伯来文意为“坐着／住在基路伯那里的”，未明确说明空间关系；在圣所语境中，这一表达带有雅威登基掌权的王座意象。
    reason: 更正原脚注把“之上”误称为希伯来文直译的说法，并保留原文未明示的空间关系。
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: 祷告
  rationale: 该词的基本义是“祷告”；此处描述希西家向上帝陈明祈求，用“祷告”直接自然。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 保留“在……面前／临在中”的关系与空间意象，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，以区别于“主”等称号。
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: 以色列的上帝
  rationale: 直接呈现原文的属格结构，并适合作为祷告中的呼语。
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: 坐在基路伯之上的那一位
  rationale: יֹשֵׁב可指坐着、居住或坐在宝座上；正文采用自然且较贴近字面的表达，并以脚注说明其王权与敬拜语境。
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: 惟有你是上帝
  rationale: 将代词强调和לְבַדְּךָ的排他意义合并为自然汉语，保留独一神性的宣告。
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: 统管地上万国
  rationale: 介词לְ本身较宽泛；上下文是在宣告雅威相对于万国的普世主权，“统管”清楚传达此关系。
- source_word: עָשִׂיתָ
  choice: 造
  rationale: 对应עָשָׂה“制作、造”的常用义，不改译成更专门对应בָּרָא的“创造”。
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: 天和地
  rationale: 这是现代汉语中自然、庄重的整体受造界表达；希伯来语שָׁמַיִם虽为复数形式，汉语通常用“天”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用专有神名而非称号；音译“雅威”保留这一文本区别。
- issue: 独一神性与普世主权的关系
  choice: 惟有你是上帝，统管地上万国
  alternative: 你是上帝，惟有你是地上万国的上帝
  rationale: 原文语序可使לְכֹל מַמְלְכוֹת הָאָרֶץ与“上帝”紧密相连，也可在语义上表达对万国的主权。正文采用自然汉语表达其普世统治，同时保留“惟有你”的排他性。
- issue: יֹשֵׁב הַכְּרֻבִים的王权意象
  choice: 坐在基路伯之上的那一位
  alternative: 在基路伯之上坐着为王的那一位；住在基路伯中间的那一位
  rationale: 原文未明说“为王”，也未明确使用“中间”；正文保留较为开放的空间表达，脚注交代其宝座意象。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“惟有”保留经文的庄严感；“基路伯”沿用常见圣经专名。脚注标记[a]已置于对应短语之后。
