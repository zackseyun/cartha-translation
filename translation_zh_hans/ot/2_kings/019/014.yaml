source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חִזְקִיָּ֧הוּ אֶת הַ/סְּפָרִ֛ים מִ/יַּ֥ד הַ/מַּלְאָכִ֖ים וַ/יִּקְרָאֵ֑/ם וַ/יַּ֨עַל֙ בֵּ֣ית יְהוָ֔ה וַ/יִּפְרְשֵׂ֥/הוּ חִזְקִיָּ֖הוּ לִ/פְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: zh_hans
  text: 希西家从使者手中接过那些文书[a]，读了以后，就上到雅威的殿里，把文书摊开在雅威面前。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “文书”也可译作“信件”“书卷”或“书面材料”；原词的含义比私人信件更宽。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: 那些文书
  rationale: 该词可泛指书写材料、文书或书卷；本段指使者送来的书面信息。“文书”既符合历史语境，也保留了比私人“信件”更宽的词义。
- source_word: מִיַּד הַמַּלְאָכִים
  choice: 从使者手中
  rationale: 保留希伯来语“从……手中”的具体表达；מַלְאָכִים 在此指传递信息的人类使者，并非天使。
- source_word: וַיִּקְרָאֵם
  choice: 读了以后
  rationale: 动词带复数宾语后缀，与前面的复数“文书”相应；用顺承结构自然呈现希伯来叙事链。
- source_word: וַיַּעַל
  choice: 上到
  rationale: 保留 עלה 的“上去”含义，符合前往圣殿的实际和惯用空间表达。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בֵּית 字面为“家、房屋”，在此明确指圣殿；汉语用“殿”自然、庄重，同时准确表达所指。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名，保留经文使用的专名，而不以称号替代。
- source_word: וַיִּפְרְשֵׂהוּ
  choice: 把文书摊开
  rationale: 动词表示展开或铺陈。其宾语后缀在马所拉文本中为单数，可能把前述复数文书视为一份整体书面信息；汉语不显式标数，可保留这种张力。
- source_word: לִפְנֵי יְהוָה
  choice: 在雅威面前
  rationale: 忠实呈现“在……面前”的惯用语，表达希西家在神临在之处陈明此事。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／主
  rationale: 原文直接使用四字神名；音译为“雅威”能保留其专名性质，避免改成称号。
- issue: 将文书摊在雅威面前的含义
  choice: 保留具体动作，不在正文中增补“祷告”
  alternative: 解释为“在雅威面前祷告”
  rationale: 上下文显示这一动作与祷告有关，但本节原文只叙述希西家摊开文书；正文保留动作本身，不把解释写入经文。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。以“使者”避免误解为天使；“雅威的殿”比字面的“雅威的家”更符合现代汉语中的圣殿语境。主文用“文书”而不加复数量词于末句，使希伯来文前置复数名词与后置单数代词之间的形式张力不被过度消解。
