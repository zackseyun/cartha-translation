base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: zh_hans
  text: 所以，雅威论亚述王这样说：“他必不进入这城，也不在那里射箭；不拿着盾牌逼近这城[a]，也不筑起攻城坡来攻打这城[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“拿着盾牌来到城前”。希伯来语可能描写攻城军在盾牌掩护下逼近城池。
    reason: lexical_alternative
  - marker: b
    text: “攻城坡”也可译作“攻城土垒”，指围城时堆筑的土石工事。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: 所以
  rationale: 承接上文的神谕并引出结论；“所以”在现代汉语中自然保留推论语气。
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 保留先知宣告中固定的使者公式，同时符合现代汉语表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接呈现神的专名，而不以称号替代。
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: 论亚述王
  rationale: 这里的 אֶל 引出神谕所针对或论及的对象；“论”既自然，也避免误解为这番话直接对亚述王说。
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: 他必不能进入这城
  rationale: 表达带否定的预告；“进入”清楚呈现向城内移动的含义。
- source_word: יוֹרֶה שָׁם חֵץ
  choice: 在那里射箭
  rationale: 准确保留军事行动及地点副词的含义。
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: 拿着盾牌逼近这城
  rationale: קדמ 的具体军事画面可能是来到城前或在盾牌掩护下逼近；正文采用符合围城语境、又不过度具体化的表达。
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: 筑起攻城坡来攻击它
  rationale: יִשְׁפֹּךְ 与 סֹלְלָה 连用，指堆筑土石形成围城工事；“攻城坡”让现代读者容易理解其用途。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接反映其通行学术拟音，并保留专名性质。
- issue: 预言否定句的力度
  choice: 必不能
  alternative: 不会
  rationale: “必不能”保留神谕中确定的预告语气，但不额外说明这种不能实现的机制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。四个否定分句按希伯来文逐项保留；后两项略作汉语句法调整，以清楚呈现围城场景。脚注标记依其实际所解释的词组放置。
