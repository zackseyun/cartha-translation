  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: zh_hans
  text: 又将他们的神投入火中[a]，因为那些并不是神，只是人手所造的木头和石头；所以就把它们毁掉了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“把他们的神放进火里。”希伯来语动词直译为“给、放置”，这里指把东西投入火中。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: 又把……扔进
  rationale: נָתַן的基本义是“给、放置”，但与“火里”连用并处于毁灭偶像的语境中，意为把东西投入火中。“扔进”符合现代汉语，也保留了动作方向。
- source_word: אֱלֹהֵיהֶם
  choice: 他们的神
  rationale: 原文直译为“他们的神”。虽然所指是偶像，但下文随即否定其神性；保留“神”可呈现原文“被称为神，却并不是神”的修辞张力。
- source_word: בָּאֵשׁ
  choice: 火里
  rationale: 介词与动作语境结合，表达投入火中；汉语用“扔进火里”自然清楚。
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: 因为那些并不是神
  rationale: 按原文直接否定这些对象的神性，不增添“真神”等解释性限定。
- source_word: כִּי אִם
  choice: 只是
  rationale: 此处引出排他性的反向说明，即它们不是神，只是人造之物；“只是”简洁体现这一对比。
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: 人手所造的
  rationale: 准确表达这些对象是人制造的，也以自然汉语传达אָדָם在此泛指人类的意义。
- source_word: עֵץ וָאֶבֶן
  choice: 木头和石头
  rationale: 直接保留原文对偶像材质的朴素描述。
- source_word: וַיְאַבְּדוּם
  choice: 所以就把它们毁掉了
  rationale: 将动词按及物用法理解，主语承接前文施事者，对象为那些所谓的神；“所以”在汉语中自然表现前句理由与毁灭结果之间的联系。
theological_decisions:
- issue: 如何表达对列国之神的否定
  choice: 并不是神
  alternative: 并不是真神
  rationale: 原文直接说“它们不是神”。译作“并不是神”不额外加入“真”这一限定，从而保留原文鲜明而直接的神学断言。
- issue: אָדָם在“人手所造”中的泛指意义
  choice: 人
  alternative: 男人／人类
  rationale: 此处指一般的人，并非特定男性。“人手所造”是自然、准确且无不必要性别限定的现代汉语。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“那些”回指“他们的神”，“它们”则维持无生命造物的指称；末句省略重复主语，使其自然承接前文施事者，又不在正文中增添原文未明说的名称。
