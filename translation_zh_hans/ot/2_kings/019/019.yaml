source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֥/נוּ נָ֖א מִ/יָּד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּ֥י אַתָּ֛ה יְהוָ֥ה אֱלֹהִ֖ים לְ/בַדֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: zh_hans
  text: 现在，耶和华我们的上帝啊，求你救我们脱离他的手[a]，使地上万国[b]都知道，惟有你耶和华是上帝。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“从他的手中”；这是指脱离他的权势或控制。
    reason: cultural_note
  - marker: b
    text: “地上”也可译为“那地的”；这里涉及列国，译作“地上”较符合上下文的国际范围。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 既保留祷告转入核心祈求时的时间标记，也以现代汉语自然承接上文；句首语境足以体现连接作用。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名音译来呈现四字神名，不用“主”这一称号替代。
- source_word: אֱלֹהֵינוּ
  choice: 我们的上帝
  rationale: 准确表达带第一人称复数后缀的形式，并自然构成直接称呼。
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: 求你救我们
  rationale: “求你”自然表达祈求语气词 נָא 所带的恳切意味，“救我们”直接对应使役式命令。
- source_word: מִיָּדוֹ
  choice: 脱离他的手
  rationale: 保留希伯来文“手”的意象；中文也可借此表示脱离某人的掌控，并以脚注说明。
- source_word: וְיֵדְעוּ
  choice: 使……都知道
  rationale: 在命令式祈求之后，这一未完成式在语境中表达目的或结果；“使”符合自然汉语。
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: 地上万国
  rationale: 本段涉及亚述和列国，具有国际范围；“地上万国”简洁表达所有王国，并保留 הָאָרֶץ 也可指“那地”的词义余地于脚注。
- source_word: כִּי
  choice: （知道的内容，无需另译连接词）
  rationale: 汉语“知道”可直接带分句作宾语，不必机械加入“即”或“就是”。
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: 惟有你耶和华是上帝
  rationale: 把 לְבַדֶּךָ 的排他强调自然地置于句首，同时保留“耶和华”与“上帝”的谓语认定关系。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用神名，因此采用中文传统且广为人知的专名“耶和华”，不以称号“主”替换；“雅威”更接近部分现代学界的拟音，但中文接受度较低。
- issue: לְבַדֶּךָ 的排他性
  choice: 惟有你耶和华是上帝
  alternative: 你耶和华是上帝，只有你是
  rationale: “惟有”清楚保留原文关于耶和华独一为上帝的强调，又不增加原文以外的系统神学表述。
- issue: וְיֵדְעוּ 的语义关系
  choice: 目的或结果：“使……知道”
  alternative: 并且……就会知道
  rationale: 祈求之后的前缀动词可表达目的或结果；正文用“使”呈现最符合语境的祈求目的，同时不把它扩写成额外断言。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语言。“啊”标明直接呼告，使“耶和华我们的上帝”在汉语中不致被误读为陈述。脚注标记分别紧跟其所说明的“他的手”和“地上万国”，并全部出现在正文中。
