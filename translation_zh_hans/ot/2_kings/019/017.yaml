base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: zh_hans
  text: 雅威啊，亚述诸王确实[a]毁坏了列国和它们的国土[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “确实”也可译作“的确”或“果真”。
    reason: lexical_alternative
  - marker: b
    text: “国土”原文为单数形式，但带复数所属后缀；可指列国整体所涉及的土地，也可按各国分别理解为“各自的国土”。
    reason: source_form
lexical_decisions:
- source_word: אָמְנָם
  choice: 确实
  rationale: 该词在此确认前述说法属实，并带有强调语气；“确实”自然、庄重，也不额外限定其逻辑关系。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，而不以称号替代；“雅威”是现代汉语中通行且易懂的音译。
- source_word: הֶחֱרִיבוּ
  choice: 使……荒凉
  rationale: חרב 的使役形在军事征服语境中表示使某地沦为废墟、遭到破坏；“使……荒凉”既体现使役形式，也保留毁坏后的荒废状态。
- source_word: מַלְכֵי אַשּׁוּר
  choice: 亚述诸王
  rationale: 准确表达附属结构，并以简洁、庄重的现代汉语呈现历代或多位亚述君王。
- source_word: הַגּוֹיִם
  choice: 列国
  rationale: 此处指亚述所征服的各国；“列国”符合地缘政治语境，也保持经文体裁所需的庄重感。
- source_word: אַרְצָם
  choice: 它们的国土
  rationale: 原文为单数名词“地、国土”加复数所属后缀，可作集合或分配理解；汉语“它们的国土”自然承接“列国”，同时不必把所指强行改成复数名词。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用专有神名，而非“主”这一称号；采用“雅威”保留专名性质，并避免以称号取代原文。
- issue: אָמְנָם 的语气关系
  choice: 译作“确实”，保留其确认和强调作用
  alternative: 译作“果真”或“的确”，或明确补成“事实的确如此”
  rationale: 本词可表示“确实、的确”，上下文中也可能略带让步意味。正文不补入原文未明说的逻辑连接，以免过度解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事祷告语体。“雅威啊”保留呼语；“亚述诸王”“列国”简洁凝练。“都”使“列国和它们的国土”共同受动的关系在汉语中更清楚，但不增加新的事件内容。
