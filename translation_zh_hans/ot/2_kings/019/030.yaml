  yaml_path: translation/ot/2_kings/019/030.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: zh_hans
  text: 犹大家中逃脱而存留的余民，必再向下扎根，向上结果子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大家所剩的余民。”
    reason: 词汇和表达方式的另一种译法；此译法简洁表达原文所指犹大家中余留下来的群体。
lexical_decisions:
- source_word: וְיָסְפָה
  choice: 必再次
  rationale: יסף在这里与后续意象连用，表示动作重新发生或延续；上下文强调劫后复兴，因此译作“再次”，并以“必”表达预言语气。
- source_word: פְּלֵיטַת בֵּית יְהוּדָה הַנִּשְׁאָרָה
  choice: 犹大家逃脱而存留的人
  rationale: פְּלֵיטָה指从灾祸中逃脱、幸存的群体，הַנִּשְׁאָרָה进一步说明他们是留下来的人。译文保留两层意义，同时避免生硬重复；“犹大家”保留בֵּית יְהוּדָה的家族—群体称谓。
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: 向下扎根
  rationale: 原文以“根”构成农业意象；现代汉语用“扎根”自然表达，并保留向下的方向。
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: 向上结果
  rationale: עָשָׂה与“果子”搭配表示结出果实；“结果”保留农业比喻，并与“向下扎根”形成整齐的上下对照。
theological_decisions:
- issue: 复兴预言中的余民观念
  choice: 犹大家逃脱而存留的人
  alternative: 犹大家所剩的余民
  rationale: 选择具体呈现“逃脱”和“存留”两层词义，表达审判之后仍蒙存留的群体，但不把经文扩展为后来的特定教义体系。
translation_notes:
  register: 采用现代、庄重而清楚的普通话。“向下扎根，向上结果”保留原文简洁、平衡的诗性结构；“犹大家”沿用圣经历史语境中的群体称谓。
