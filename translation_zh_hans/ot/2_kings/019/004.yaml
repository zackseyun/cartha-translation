revisions:
- from: 也许雅威你的上帝会听见拉伯沙基[a]的一切话；他的主人亚述王派他来辱骂永活的上帝。雅威你的上帝既听见了这些话，也许会加以斥责。因此，请为现今剩下的余民献上祷告[b]。
  to: 也许雅威你的上帝会听见拉伯沙基[a]所说的一切话；他的主人亚述王派他来辱骂永活的上帝。雅威你的上帝也许会因所听见的这些话施行责罚。因此，请为仍然存留的余民献上祷告[b]。
  rationale: 修订仅处理中文衔接和原文的受词含混：“也许会因所听见的这些话施行责罚”将神的行动与所听见的侮辱之言相连，却不把被责备/惩治者武断补为拉伯沙基，也不将“话”硬作直接受词。其余关键术语和两个脚注均可保留。
  reviewer_model: gpt-5.6-terra
