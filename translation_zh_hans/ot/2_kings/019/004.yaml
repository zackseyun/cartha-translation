id: 2KI.19.4
reference: 2 Kings 19:4
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: zh_hans
  text: 也许雅威你的上帝会听见拉伯沙基[a]所说的一切话；他的主人亚述王派他来辱骂永活的上帝。雅威你的上帝也许会因所听见的这些话施行责罚。因此，请为仍然存留的余民献上祷告[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拉伯沙基”很可能是亚述官衔；也有人译作“酒政长”。
    reason: 说明有争议的亚述官衔，避免正文过度确定其具体职务。
  - marker: b
    text: “献上祷告”按希伯来语直译是“举起祷告”，意思就是祈祷或代求。
    reason: 交代原文惯用语的具体意象及自然汉语含义。
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: 也许……会听见
  rationale: 保留 אוּלַי 所表达的可能和盼望，不把结果说成确定事实；“听见”也保留原文用词。
- source_word: יְהוָה
  choice: 雅威
  rationale: 音译四字神名，保留其作为以色列之上帝专名的功能。
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 该词很可能是亚述官衔，但具体职务仍有争议，因此正文采用音译，并以脚注说明。
- source_word: לְחָרֵף
  choice: 辱骂
  rationale: 表达该动词针对上帝的侮辱、毁谤意味；比单纯“嘲笑”更能体现语境中的冒犯。
- source_word: אֱלֹהִים חַי
  choice: 永活的上帝
  rationale: 自然保留“活着的上帝”这一称谓及其与无生命偶像的隐含对照。
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: 也许会加以斥责
  rationale: הוכיח 可指责备、判明或纠正；这里不明说受词，以避免加入希伯来文未明确提供的“他”。重复“也许”使中文清楚地将未完成式置于 אוּלַי 的可能语气之下。
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: 献上祷告
  rationale: 这是自然现代汉语，同时传达希伯来语“举起祷告”这一惯用语的敬虔语域；直译见脚注。
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: 现今剩下的余民
  rationale: 兼顾“余民”这一关键概念和 הַנִּמְצָאָה 所指仍然存留、尚在的人。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名，正文以现代汉语常见音译“雅威”保留专名性质，不以称号替代。
- issue: הַשְּׁאֵרִית 的译法
  choice: 余民
  alternative: 幸存者／剩下的人
  rationale: “余民”既准确表达剩余群体，也保留该词在圣经中的语义关联；“现今剩下的”防止读者把它读成超出本节语境的完整神学定义。
- issue: 斥责的对象
  choice: 不补出明确受词
  alternative: 斥责他／斥责这些话
  rationale: 希伯来文 וְהוֹכִיחַ בַּדְּבָרִים אֲשֶׁר שָׁמַע 可理解为因所听见的话而责罚、判明或作出回应，并未明确写出“他”；译文保留这一张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“也许”保留希西家请求中的不确定语气；“因此，请”使从盼望到代求请求的逻辑自然。“永活的上帝”“余民”“献上祷告”保持经文语体，但避免生硬古奥。
