  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: zh_hans
  text: '这是雅威论到他所说的话：


    “锡安的处女[a]藐视你，嘲笑你；

    耶路撒冷的女子在你背后摇头[b]。”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译可作“处女女子（女儿）锡安”；这是把锡安人格化为女子的诗歌称呼。
    reason: lexical_alternative
  - marker: b
    text: “摇头”在这里是表示轻蔑或嘲弄的动作。
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: 话
  rationale: 在先知宣告的引介语中指雅威所发出的言语或信息；“话”自然简明，也保留神谕作为言语的性质。
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: 雅威论到他所说
  rationale: עַל在这里标明神谕所论及的对象，译作“论到他”既保留中性语义，也不因上下文的审判性质而擅自译成“攻击他”。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见的音译呈现四字神名，保留其专名性质，而不以“主”这一称号代替。
- source_word: בָּזָה
  choice: 藐视
  rationale: 准确表达轻看、鄙弃之意，并适合庄重的诗歌语体。
- source_word: לָעֲגָה
  choice: 嘲笑
  rationale: 清楚传达讥诮、取笑之意，与“藐视”构成自然的诗句并行。
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: 处女锡安
  rationale: 将锡安作为女性人格化形象来表达，并保留בְּתוּלָה“处女”的意象；紧凑形式较能呈现希伯来诗歌中称号式的结构。
- source_word: אַחֲרֶיךָ
  choice: 在你背后
  rationale: 保留空间意象，描绘敌人离去时，耶路撒冷在其背后作出轻蔑动作。
- source_word: רֹאשׁ הֵנִיעָה
  choice: 摇头
  rationale: 直译希伯来语动作，同时由脚注说明其在此处表达轻蔑和嘲弄。
- source_word: בַּת יְרוּשָׁלִָם
  choice: 耶路撒冷女子
  rationale: 这是对城市的女性人格化称呼；“女子”在现代汉语中比机械的“女儿耶路撒冷”自然，同时保持与“处女锡安”的诗歌平行。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。译作“雅威”旨在保留专名，并避免用称号“主”替代；“耶和华”虽为汉语传统译名，但其语音形式源于较晚期的混合读法。
- issue: “处女锡安”的人格化意象
  choice: 保留“处女”及城市的女性人格化
  alternative: 锡安的居民；美丽的锡安
  rationale: 原文明确包含“处女”和“女儿/女子”的意象。保留这一张力，不把它解释性地化约为居民，也不将“处女”弱化为单纯的美貌。
translation_notes:
  register: 采用现代、庄重而易懂的汉语，以分行保留神谕的诗歌并行结构。“藐视—嘲笑”与“处女锡安—耶路撒冷女子”形成对应；避免古奥措辞，也不把原文的城市人格化意象解释掉。
