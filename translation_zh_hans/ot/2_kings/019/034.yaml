  text: וְ/גַנּוֹתִ֛י אֶל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: zh_hans
  text: 因为我必保护这城，拯救它[a]，为我自己的缘故，也为我仆人大卫的缘故。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“解救它”。希伯来语动词在脱离危险的语境中可表示“拯救”或“解救”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: 我必保护
  rationale: 源自动词 גנן，有遮护、保护之意；“保护”自然庄重，也符合耶路撒冷面临军事威胁的语境。
- source_word: אֶל הָעִיר הַזֹּאת
  choice: 这城
  rationale: 介词 אֶל 与 גנן 连用时指保护行动所指向的对象；现代汉语直接说“保护这城”，不必生硬译出介词。
- source_word: לְהוֹשִׁיעָהּ
  choice: 拯救它
  rationale: ישע 在危难语境中可指拯救、解救；“拯救”简洁而贴合本句语境，同时以脚注保留“解救”的词义可能。
- source_word: לְמַעֲנִי
  choice: 为我自己的缘故
  rationale: לְמַעַן 表示行动的缘由或所顾念的对象；“我自己”传达原文第一人称所带的强调。
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: 也为我仆人大卫的缘故
  rationale: 保留与前一分句并列的第二项理由，并清楚呈现“大卫”作为“我的仆人”的称谓。
theological_decisions:
- issue: 上帝拯救耶路撒冷的缘由
  choice: 同时保留“为我自己的缘故”和“为我仆人大卫的缘故”这两个原文明确陈述的理由。
  alternative: 把大卫仅解释为对过去应许的简略指涉，或在正文中扩展为完整的圣约神学说明。
  rationale: 希伯来文以两个 לְמַעַן 并列陈述理由；译文不削弱任何一项，也不加入原文未明说的教义解释。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“这城”比“这座城”略为凝练，符合先知叙事中的宣告语气；保留重复的“缘故”，以显明原文两个并列的行动理由。
