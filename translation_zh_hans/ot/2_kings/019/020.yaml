base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: zh_hans
  text: 亚摩斯的儿子以赛亚就派人到希西家那里去，说：“耶和华——以色列的上帝如此说：你为亚述王西拿基立向我所作的祷告，我已经听见了。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל
  choice: 就派人去见
  rationale: 希伯来语字面为“差遣到”，未明说使者；现代汉语需补出隐含的受差者，表达以赛亚传递口信的动作。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名译法，明确区别于称号“主”。
- source_word: אֲשֶׁר
  choice: 因
  rationale: 此处引出上帝回应祷告的缘由；虽然该词也可理解为“你所……的”，上下文中因果表达自然，并与后面的“我已经听见了”衔接。
- source_word: אֶל סַנְחֵרִיב
  choice: 因……西拿基立的事
  rationale: 介词短语表示祷告所针对或涉及的对象，译为“因……的事”符合现代汉语，也不把它误解为向西拿基立祷告。
- source_word: שָׁמָעְתִּי
  choice: 我已经听见了
  rationale: 保留完成式所表达的既成回应，并保留原文未明说“什么”的简洁结构。
theological_decisions:
- issue: אֲשֶׁר在祷告分句中的功能
  choice: 按因果关系译为“因……向我祷告”
  alternative: 译为“你就……向我所作的祷告，我已经听见了”
  rationale: 两种句法均有可能；当前译法紧随直接神谕的逻辑，即上帝因希西家的祷告而作出回应，同时没有增添回应的具体内容。
- issue: “听见”是否解释为“应允”
  choice: 保留“听见”
  alternative: 译为“垂听”或“应允”
  rationale: 原文使用普通的“听”字根；“垂听”可能暗示恩准，“应允”则更进一步解释结果，因此保留原文简洁及其神学张力。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留先知传信公式“耶和华……如此说”，人名使用中文圣经传统通行译名；不加脚注，因为本节的歧义可在正文中以自然译法处理。
