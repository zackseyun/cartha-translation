  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: zh_hans
  text: 他派主管王宫的以利亚敬[a]、书记舍伯那和祭司中的长老，身披麻衣[b]，去见亚摩斯的儿子以赛亚先知。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “主管王宫的”是王室高级官职，指负责王宫或王室事务的人。
    reason: cultural_note
  - marker: b
    text: 或译“披上麻衣”。希伯来文分词既可强调披麻衣的动作，也可强调身披麻衣的状态。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 他派
  rationale: 该叙事性连续式推动情节发展；中文用“他派”自然承接上文，不额外强化时间关系。
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: 主管王宫的
  rationale: 这是王室官职用语，指掌管王宫或王室事务的高级官员；“主管王宫”既传达职能，也避免直译“在房屋之上”的生硬。
- source_word: הַסֹּפֵר
  choice: 书记
  rationale: 该词可指抄写员或王室文书官；“书记”保留官职的宽泛性，不将其过度限定为秘书或史官。
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: 祭司中的长老
  rationale: 保留“祭司”与“长老”两个概念，表示祭司群体中的资深代表，不简化为“主要祭司”。
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: 身披麻衣
  rationale: 该分词可侧重披上麻衣的动作，也可描述已穿着麻衣的状态；正文采用自然庄重、并能体现哀恸与谦卑意象的表达。
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: 以赛亚先知
  rationale: 按希伯来文的同位结构直接表达其姓名与身份，符合现代中文圣经语体。
- source_word: בֶּן אָמוֹץ
  choice: 亚摩斯的儿子
  rationale: 直接保留父子身份说明；此处“亚摩斯”音译的是 אָמוֹץ（Amoz），并非先知阿摩司。
