  text: וַ/יִּשְׁמַ֗ע אֶל תִּרְהָ֤קָה מֶֽלֶך כּוּשׁ֙ לֵ/אמֹ֔ר הִנֵּ֥ה יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יָּ֨שָׁב֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: zh_hans
  text: 他听到有关古实王特哈加[a]的消息：“看哪，他已经出兵，要与你交战。”于是，他再次派使者去见希西家，说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “古实”也有译作“埃塞俄比亚”的；这是古代埃及以南的地区。
    reason: 说明地名的传统译法及历史地理范围，避免读者将其简单等同于现代国家。
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: 他听到有关……的消息
  rationale: שׁמע与אֶל在这里引出所听见的内容；译作“听到有关……的消息”既符合现代汉语，也保留叙事中的传闻性质。
- source_word: תִּרְהָקָה
  choice: 特哈加
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: מֶלֶךְ כּוּשׁ
  choice: 古实王
  rationale: כּוּשׁ是原文地名；采用“古实”比直接译作现代国家名“埃塞俄比亚”更能避免时代错置。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 该指示语用于提醒听者注意突发消息；“看哪”庄重而简洁，也保留原文的强调语气。
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: 他已经出兵，要与你交战
  rationale: יָצָא本义为“出去”，在军事语境中译作“出兵”自然且不过度具体化；אִתָּךְ在交战语境中表示敌对关系，译作“与你交战”。
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: 于是，他再次派
  rationale: שׁוב接续另一个动词时常表示动作重复，即“又、再次”；这里译作“再次派”比理解为先在空间上“返回”更符合希伯来语结构及上下文。
- source_word: מַלְאָכִים
  choice: 使者
  rationale: 此处指奉命传话的人类使节，而非天使。
- source_word: חִזְקִיָּהוּ
  choice: 希西家
  rationale: 采用现代中文圣经人名的通行译名。
- source_word: לֵאמֹר
  choice: 说
  rationale: 句末的不定式引出下文直接引语，汉语以“说：”自然衔接。
theological_decisions:
- issue: 首句及后半句主语未在本节原文中明说
  choice: 保留代词“他”，不在正文补出“亚述王”
  alternative: 明确译为“亚述王听见……亚述王再次派……”
  rationale: 主语可由上文确定，但本节希伯来文本只以动词形式承接；保留“他”可避免把上下文信息写成该节明文。
- issue: וַיָּשָׁב的理解
  choice: 按辅助性用法译为“再次”
  alternative: 译为“他转回去，又派……”或“他返回后派……”
  rationale: שׁוב与后续动作动词连用，常表示重复该动作；原文并未明确交代一个独立的返回地点或撤退行动，因此不宜强加空间移动。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“看哪”保留原文提示注意的语气；“出兵”符合军事语境。“再次派”体现希伯来语שׁוב加动作动词的常见表达。正文中的脚注标记[a]与脚注相对应。
