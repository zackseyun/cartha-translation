source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: zh_hans
  text: 以赛亚对他们说：“你们要这样告诉你们的主人：‘雅威如此说：不要因你所听见的那些话而害怕；亚述王的臣仆[a]用那些话亵渎了我。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“亚述王的年轻人”或“少年”。这里的希伯来词可指年轻人，但在此很可能指王室侍从或官员。
    reason: 保留该词按年龄理解的字面替代译法，同时说明正文按王室语境采用“臣仆”的理由。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 希伯来叙事中常见的 wayyiqtol 形式；现代汉语以“说”自然表达顺承发生的言语动作。
- source_word: אֲדֹנֵיכֶם
  choice: 你们的主人
  rationale: 这里指使者们所侍奉的希西家。“主人”既表达上下属关系，也避免与对上帝的称呼混淆。
- source_word: יְהוָה
  choice: 雅威
  rationale: 直接音译四字神名，保留原文所用的上帝之名。
- source_word: אַל תִּירָא
  choice: 不要……害怕
  rationale: 自然表达否定祈使或劝止语气，保留雅威安慰并命令希西家的语力。
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: 因……那些话
  rationale: מִפְּנֵי 在此表示引发惧怕的原因；דְּבָרִים 结合上下文指所听见的言语。
- source_word: שָׁמַעְתָּ
  choice: 你所听见的
  rationale: 关系分句自然承接“那些话”，并保留第二人称单数，指希西家。
- source_word: גִּדְּפוּ
  choice: 亵渎了
  rationale: 该动词以雅威为宾语，表示以言语辱骂、藐视上帝；“亵渎”保留其宗教与神学分量。
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: 亚述王的臣仆
  rationale: נְעָרִים 可指年轻人，也可在王室语境中指侍从或臣属；这里所指是亚述王派来的代表，“臣仆”较符合其身份。
- source_word: אֹתִי
  choice: 我
  rationale: 明确保留雅威作为亵渎行为直接对象的第一人称表达。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；采用“雅威”音译，以区别于普通称号“主”，并保留经文中的立约之名。
- issue: גִּדְּפוּ 用于冒犯上帝时的强度
  choice: 亵渎了我
  alternative: 辱骂了我／嘲弄了我
  rationale: 本句的受词是雅威本人，因此不只是一般侮辱；“亵渎”准确传达对上帝不敬、冒犯的严重性，同时不额外扩写其含义。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。引语层次以双引号和单引号区分；保留“如此说”这一先知宣告公式。将脚注标记置于其实际说明的“臣仆”之后。
