base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: zh_hans
  text: “这要作为给你的记号：今年要吃自生的庄稼[a]，第二年要吃从中再长出来的庄稼[b]；第三年要撒种、收割，栽种葡萄园，吃园中的果子。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “自生的庄稼”指没有经过播种而自行长出的作物。
    reason: lexical_alternative
  - marker: b
    text: 译作“从中再长出来的庄稼”的希伯来语词十分罕见，也可理解为“第二年的自生作物”，即由前一年未经播种的作物再次长出的收成。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: 兆头
  rationale: אוֹת在先知宣告中指作为印证的标志；“兆头”自然地表达可见、可经历的印证，且适合本段语境。
- source_word: אָכוֹל
  choice: 要吃
  rationale: 此不定词绝对式在这里带有指示或预告意味；“要吃”保留这两方面的语气，不强行限定为单纯命令或单纯未来陈述。
- source_word: סָפִיחַ
  choice: 自生的庄稼
  rationale: 该词指未经播种而自行长出的农作物；此译清楚、自然，也保留农业语境。
- source_word: סָחִישׁ
  choice: 从中再长出来的庄稼
  rationale: 这是罕见词，可能指第二年由前一年自生作物再次长出的收成；该译传达连续生长的意思，同时以脚注保留词义的不确定性。
- source_word: זִרְעוּ וְקִצְרוּ
  choice: 撒种收割
  rationale: 两个复数祈使式构成简洁的农业行动次序；汉语省略主语，可自然涵盖对群体的吩咐。
- source_word: וְנִטְעוּ כְרָמִים
  choice: 栽种葡萄园
  rationale: 直译农业用语，现代汉语自然易懂。
- source_word: וְאִכְלוּ פִרְיָם
  choice: 吃园中的果子
  rationale: 复数后缀回指葡萄园；“园中的果子”既保留“果实”的一般表达，也避免加入原文没有的“享用”等含义。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“给你的”保留原文第二人称单数，随后各项行动不显明补出主语，以便自然承接原文后半节的复数命令形式。分号突出前两年依靠自生作物与第三年恢复正常耕作之间的阶段推进，但未加入原文没有的转折词。
