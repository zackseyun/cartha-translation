  text: וַ/יָּ֨שָׁב֙ רַב שָׁקֵ֔ה וַ/יִּמְצָא֙ אֶת מֶ֣לֶךְ אַשּׁ֔וּר נִלְחָ֖ם עַל לִבְנָ֑ה כִּ֣י שָׁמַ֔ע כִּ֥י נָסַ֖ע מִ/לָּכִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/008.yaml
  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
translation:
  language: zh_hans
  text: 于是，拉伯沙基回去，发现亚述王正在攻打立拿，因为他听说亚述王已经从拉吉拔营了。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “拔营”或译“离开”或“启程”。这个希伯来语动词在军事语境中可指拔营出发。
    reason: 保留 נָסַע 的词义范围；正文采用较具军事色彩的译法，但其他译法也成立。
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 回去
  rationale: 此处 שׁוּב 表示返回先前所在的一方或地点；“回去”自然地推进叙事，也保留返回之意。
- source_word: רַב שָׁקֵה
  choice: 拉伯沙基
  rationale: 这是亚述官衔，在本段叙事中具有近似专名的用法；采用音译可避免用现代职务名称造成误解。
- source_word: וַיִּמְצָא אֶת
  choice: 发现
  rationale: מָצָא 加直接宾语标记基本义为“找到、发现”；这里指他回去后发现亚述王身在另一战场。
- source_word: מֶלֶךְ אַשּׁוּר
  choice: 亚述王
  rationale: 简洁、自然地表达希伯来语属格结构。
- source_word: נִלְחָם עַל
  choice: 正在攻打
  rationale: 分词表示持续中的行动；与 עַל 及城名连用时，表示针对该城的军事行动。“正在攻打”比笼统的“交战”更符合语境。
- source_word: לִבְנָה
  choice: 立拿
  rationale: 采用现代中文圣经中常见的地名译法。
- source_word: כִּי שָׁמַע
  choice: 因为他听说
  rationale: כִּי 引出解释性原因；“听说”符合 שׁמע 在获悉消息语境中的含义。
- source_word: כִּי נָסַע
  choice: 亚述王已经……拔营了
  rationale: נָסַע 在军事行军语境中常指拔营、启程；“拔营”保留具体的军事色彩。“亚述王”明确表达上下文中最自然的主语，避免连续“他”造成中文指代含混。
- source_word: מִלָּכִישׁ
  choice: 从拉吉
  rationale: 采用现代中文圣经中常见的地名译法，并直接表达前缀介词 מִן 的离开义。
theological_decisions: []
