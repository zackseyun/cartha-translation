lexical_decisions:
- source_word: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב
  choice: 拔营离去，返回
  rationale: וַיִּסַּע本义为拔营、启程；与וַיֵּלֶךְ、וַיָּשָׁב连续使用，形成叙事性的动作链。中文以“拔营离去，返回”保留主要动作及“返回”之义，同时避免机械重复。
- source_word: וַיֵּשֶׁב
  choice: 住在那里
  rationale: 此处表示定居或居住；补出“在那里”自然承接“尼尼微”，比重复地名更符合现代汉语。
- source_word: נִינְוֵה
  choice: 尼尼微
  rationale: 采用该古城在现代中文圣经传统中通行的音译。
