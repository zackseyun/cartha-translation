  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: zh_hans
  text: 你辱骂、亵渎的是谁[a]？你向谁扬声，又傲然抬眼[b]？是向以色列的圣者！
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辱骂、亵渎”也可译作“羞辱、毁谤”。原文两个动词意义相近，都指轻蔑、恶意的言语；第二个词用于针对上帝时，可特指“亵渎”。
    reason: lexical_alternative
  - marker: b
    text: 原文近于“把你的眼目抬向高处”。这是表现高傲自大的习语；末尾“向以色列的圣者”既回答前面的“向谁”，也表明这种傲慢所针对的对象。
    reason: cultural_and_syntactic_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: 辱骂
  rationale: 该动词在这里指带着蔑视的侮辱性言语。“辱骂”自然、清楚，并与后面的“亵渎”形成递进。
- source_word: גִדַּפְתָּ
  choice: 亵渎
  rationale: 该词可指辱骂、毁谤，尤其可用于针对上帝的亵渎之言；本节最终明确受攻击者是“以色列的圣者”，因此译作“亵渎”保留其神学分量。
- source_word: הֲרִימוֹתָ קּוֹל
  choice: 扬声
  rationale: 直译为“抬高声音”。“扬声”既保留原文意象，也适合庄重的反问语气；敌意由上下文表达。
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: 高傲地抬起眼来
  rationale: 原文近于“把你的眼睛举向高处”，是表现傲慢自高的说法。正文点明“高傲”，同时脚注保留字面意象。
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: 以色列的圣者
  rationale: 这是固定的神圣称号；直译能够保留其称号性质及与以赛亚传统的呼应。
- source_word: עַל
  choice: 向／敌对
  rationale: 前一处表示声音所针对的对象，译作“向”；末一处带有明显敌对意味，结合修辞高潮译作“敌对”。
- source_word: מִי
  choice: 谁
  rationale: 现代汉语用“谁”自然表达反问中的宾语，不需另设宾格形式。
theological_decisions:
- issue: 如何保留针对上帝之言的亵渎性质
  choice: 将 גִדַּפְתָּ 译作“亵渎”，并保留末尾“以色列的圣者”这一称号
  alternative: 译作“毁谤”或“辱骂”
  rationale: 上下文表明这不只是政治上的挑衅，也是对以色列之上帝的冒犯；“亵渎”符合该词在此处的语义力度，却不添加原文以外的教义。
- issue: 末句 עַל קְדוֹשׁ יִשְׂרָאֵל 的句法与修辞功能
  choice: 译作独立的高潮反问：“你竟敢敌对以色列的圣者！”
  alternative: 直接接在前句后面：“向以色列的圣者高傲地抬起眼来”
  rationale: 希伯来文末尾短语既可与邻近动作相连，也在修辞上回答前面的“谁”。独立处理能呈现其高潮和敌对方向，但脚注说明原文结构，以免掩盖句法上的关联。
translation_notes:
  register: 采用现代、庄重而易懂的反问句。以“辱骂、亵渎”形成语义递进，以“扬声”保存希伯来语意象；末句加强为修辞高潮，但以脚注交代原文较贴字面的结构和可能关联。
