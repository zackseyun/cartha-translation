  to: 所以，他们的居民力量微弱[a]，惊惶失措，蒙受羞辱。他们如同田野的草、青绿的草木、房顶上的草，以及尚未长成便焦枯的禾苗[b]。
  rationale: 修订保留“他们的居民”的原有指代弹性，删除末句中原文未明说的“焦风”，并以“尚未长成便焦枯的禾苗”自然表达焦枯与庄稼尚未挺立／长成之间的紧凑关系。脚注也相应避免添加“吹”的动作。
