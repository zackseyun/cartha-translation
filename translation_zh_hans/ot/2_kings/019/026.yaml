base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: zh_hans
  text: 所以，他们的居民力量微弱[a]，惊惶失措，蒙受羞辱。他们如同田野的草、青绿的草木、房顶上的草，以及尚未长成便焦枯的禾苗[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“手短”，是指无力、缺乏能力。
    reason: lexical_alternative
  - marker: b
    text: 原文末句十分凝练，也可译作“尚未长成的焦枯庄稼”或“在庄稼挺立以前的焦枯植物”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: 城中的居民
  rationale: 代词后缀承接上文被攻取的城邑；中文补出“城中”，使所指清楚自然。
- source_word: קִצְרֵי יָד
  choice: 力量微弱
  rationale: 原文直译为“手短”，是表示无力、缺乏能力的习语；正文译出实际含义，并以脚注保留字面形象。
- source_word: חַתּוּ
  choice: 惊惶失措
  rationale: 该动词可表示因打击而崩溃、惊惶或丧胆；此译保留心理受挫的力度，又符合现代汉语。
- source_word: וַיֵּבֹשׁוּ
  choice: 蒙受羞辱
  rationale: 表达陷入羞耻、受辱的结果，比单纯“羞愧”更能体现外在败亡所造成的羞辱。
- source_word: הָיוּ
  choice: 如同
  rationale: 在连续比喻中用自然汉语表达“他们是/成了”的比较功能，不强行判定状态或变化。
- source_word: עֵשֶׂב שָׂדֶה
  choice: 田野的草
  rationale: 直接保留田野草木脆弱易逝的诗歌意象。
- source_word: וִירַק דֶּשֶׁא
  choice: 嫩绿的植物
  rationale: 表示新鲜青绿的草木；译文自然且保留其柔嫩、容易受损的特点。
- source_word: חֲצִיר גַּגּוֹת
  choice: 房顶上的草
  rationale: 保留古代平顶房屋上浅土中草木迅速枯萎的具体意象。
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: 尚未长成就被焦风吹枯的禾苗
  rationale: 原文末句高度凝练，涉及焦枯与尚未成为直立庄稼；此译明确农业图景，同时用脚注说明可能的理解。
