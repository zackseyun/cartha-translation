  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: zh_hans
  text: 他们对他说：“希西家这样说：‘今天是患难、责备和凌辱[a]的日子。儿女已经到了要出生的时候[b]，却没有力量生产。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “凌辱”也可译作“蔑视”或“亵渎”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语“生产关口”的确切含义难以确定；也可能具体指生产之处或产凳。这里描绘分娩已到紧要时刻，却无力完成生产。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: 这样说
  rationale: 保留希伯来语传话公式的庄重语气，同时符合现代汉语表达。
- source_word: יוֹם צָרָה
  choice: 患难的日子
  rationale: צָרָה表示在重压下的困苦、危难；“患难”简洁而庄重。
- source_word: וְתוֹכֵחָה
  choice: 责罚
  rationale: 该词可指责备、申斥或管教；“责罚”既保留严厉意味，也不明确限定责罚者。
- source_word: וּנְאָצָה
  choice: 凌辱
  rationale: 该词涉及蔑视、侮辱或亵渎；此处“凌辱”能自然表达国家所受的公开羞辱，同时以脚注保留其他可能。
- source_word: הַיּוֹם הַזֶּה
  choice: 今天
  rationale: 自然表达指示语的强调作用，避免生硬的“这日”。
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: 孩子已经到了临盆的关头
  rationale: 保留原文的生产比喻，并以现代读者容易理解的方式表达危机已到决定性时刻。
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: 却没有力量把他们生下来
  rationale: 准确呈现生产已到关头、力量却告枯竭的比喻高潮；“却”显明语义转折。
- source_word: בָנִים
  choice: 孩子
  rationale: 虽然词形为阳性复数，但比喻重点在所生的儿女，并非强调男性，故译为泛指的“孩子”。
theological_decisions:
- issue: וּנְאָצָה是否专指对上帝的亵渎
  choice: 正文译作“凌辱”
  alternative: “亵渎”或“蔑视”
  rationale: 上下文可使该词包含敌人对上帝的亵渎，也可描述百姓所受的羞辱。正文不将含义收窄为单一神学解释，脚注保留歧义。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“患难、责罚和凌辱”保留原文三项并列的节奏；后半句保留完整的生产意象，不将其解释性地改写为军事或政治危机。
