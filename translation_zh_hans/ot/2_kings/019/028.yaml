  text: יַ֚עַן הִתְרַגֶּזְ/ךָ֣ אֵלַ֔/י וְ/שַׁאֲנַנְ/ךָ֖ עָלָ֣ה בְ/אָזְנָ֑/י וְ/שַׂמְתִּ֨י חַחִ֜/י בְּ/אַפֶּ֗/ךָ וּ/מִתְגִּ/י֙ בִּ/שְׂפָתֶ֔י/ךָ וַ/הֲשִׁ֣בֹתִ֔י/ךָ בַּ/דֶּ֖רֶךְ אֲשֶׁר בָּ֥אתָ בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: zh_hans
  text: 因为你向我所发的狂怒和你的自满，都上达我耳中[a]，所以我要把我的钩子放在你鼻中，把我的嚼子放在你唇间，使你从原路返回。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的傲慢”或“你的自信”。这个希伯来词表示安逸或自以为安稳，在这里的敌对语境中含有自恃的意味。
    reason: 说明שַׁאֲנַנְךָ的词义范围及语境色彩。
lexical_decisions:
- source_word: יַעַן
  choice: 因为……所以
  rationale: 引出审判的原因；汉语用“因为……所以”清楚表达因果关系，也适合本节较长的句式。
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: 你向我大发狂怒
  rationale: 保留该词所表达的激烈躁怒及其敌对方向；“大发狂怒”自然有力，又不过度释义为傲慢或亵渎。
- source_word: שַׁאֲנַנְךָ
  choice: 你的自满
  rationale: 该词本指安逸、安稳或自以为安稳；敌对语境使这种安然带有负面的自恃意味。“自满”兼顾基本词义和责备语气，其他可能译法列入脚注。
- source_word: עָלָה בְאָזְנָי
  choice: 上达我耳中
  rationale: 保留希伯来文“上到耳中”的鲜明拟人意象，同时采用庄重而可懂的现代汉语表达。
- source_word: חַחִי בְּאַפֶּךָ
  choice: 把我的钩子钩在你鼻子上
  rationale: חַח指用于制伏牲畜或俘虏的钩子；“钩在你鼻子上”清楚呈现控制与羞辱的具体图像。
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: 把我的嚼环放在你嘴唇间
  rationale: מֶתֶג是驾驭牲畜所用的嚼环；“嘴唇间”既忠实于复数“嘴唇”，又比生硬的“嘴唇里”更符合汉语。
- source_word: וַהֲשִׁבֹתִיךָ
  choice: 使你……返回
  rationale: 使役形明确表达上帝使对方退回，保留神主动制伏侵略者的语义。
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: 从原路返回
  rationale: 用自然简洁的汉语表达“沿着你来时的路返回”，保留来路即退路的对称审判意味。
theological_decisions:
- issue: 上帝听见并制伏亚述王的拟人化语言
  choice: 保留“上达我耳中”“我的钩子”“我的嚼环”等具体意象
  alternative: 意译为“我已经听见，并要制服你”
  rationale: 原文以身体和驭兽图像表现上帝知晓敌王的狂妄并拥有主权；保留这些意象可维持先知宣告的力度，而不对上帝的本性作额外推论。
- issue: שַׁאֲנַנְךָ的负面语气
  choice: 正文译为“你的自满”
  alternative: 你的安逸；你的傲慢；你的自信
  rationale: 原词核心是安逸、自以为安全，语境则赋予其可责的自恃色彩。“自满”较好地保留两者之间的张力，不把词义完全收窄为“傲慢”。
translation_notes:
  register: 采用现代、庄重且易懂的普通话。“上达我耳中”保留原文意象和先知文体；“嚼环”准确呈现驭兽器具，并与“钩子”构成平行图像。
