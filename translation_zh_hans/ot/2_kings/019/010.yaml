base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: zh_hans
  text: 你们要这样对犹大王希西家说：‘不要让你所倚靠的神[a]借着这样说来欺骗你：“耶路撒冷不会被交在亚述王手中。”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或可按说话者轻蔑的语气译为“你的神明”。希伯来文此处不以大小写标示；亚述说话者正在嘲讽希西家对神的信靠。
    reason: 保留אֱלֹהֶיךָ可作轻蔑性泛指理解的文体可能，同时说明正文“神”所指为何。
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: 你们要这样……说
  rationale: כֹּה引出使者传话的固定表达，תֹאמְרוּן是第二人称阳性复数、带指令意味；译文保留复数对象和正式传令语气。
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: 犹大王希西家
  rationale: 采用现代汉语圣经语境中通行的人名、地名和王号表达，简洁自然。
- source_word: אַל יַשִּׁאֲךָ
  choice: 不要让……欺骗你
  rationale: נשׁא在此表示欺骗或误导；这一表达保留亚述说话者对希西家信仰的直接讥讽。
- source_word: אֱלֹהֶיךָ
  choice: 你的神
  rationale: 保留第二人称单数领属关系；汉字本身不以大小写区分，此处按现代中文惯例写作“神”。
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: 你所倚靠的
  rationale: בָּטַח בְּ表示信赖、倚靠；“所倚靠的”在中文中自然地作“神”的修饰语，并保留依赖之意。
- source_word: לֵאמֹר
  choice: 说
  rationale: 第二个לֵאמֹר引出所谓欺骗的具体话语；直译为“说”既紧凑，也保留原文引语层次。
- source_word: לֹא תִנָּתֵן
  choice: 必不会交在
  rationale: נתן的Nifal形式为被动，表示被交付；“交在……手中”保留这一被动含义及希伯来语习语。
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: 在亚述王手中
  rationale: 保留“在……手中”这一控制、权势的隐喻，现代中文读者仍易理解。
theological_decisions:
- issue: 亚述说话者口中的אֱלֹהֶיךָ如何处理
  choice: 你的神
  alternative: 你的神明
  rationale: 所指是希西家所信靠的以色列之神，故正文用“神”；同时不淡化说话者敌对、讥讽的语气。希伯来文无英文式大小写区别，中文也无需借助大小写作神学判定。
- issue: 是否缓和“神欺骗你”的冒犯性表达
  choice: 保留“不要让……神欺骗你”
  alternative: 不要被你所倚靠的神误导
  rationale: 原文刻意把“欺骗”归于希西家所倚靠的神，这是亚述王的嘲讽而非叙述者的神学断言；应保留其张力，不改写为较温和的表述。
translation_notes:
  register: 采用庄重而清楚的现代标准普通话。“你们要这样……说”保留正式传令口吻；嵌套引语清晰呈现亚述王使者的信息。
