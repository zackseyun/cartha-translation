base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: zh_hans
  text: 有一次，他正在他神尼斯洛[a]的庙中敬拜时，亚得米勒和沙利色用刀杀了他，随后逃到亚拉腊地。他的儿子以撒哈顿接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “尼斯洛”按希伯来文音译；传统译名作“尼斯洛甲”。
    reason: 说明神名的音译选择及传统异译。
lexical_decisions:
- source_word: וַיְהִי הוּא מִשְׁתַּחֲוֶה
  choice: 他正在……敬拜时
  rationale: הוּא加分词构成进行中的背景情景；在神祇庙宇的祭祀语境中，מִשְׁתַּחֲוֶה表示敬拜。汉语以“正在……时”自然呈现该时态关系，无须机械译出וַיְהִי。
- source_word: בֵּית נִסְרֹךְ אֱלֹהָיו
  choice: 自己的神尼斯洛的庙里
  rationale: בֵּית字面为“殿、房屋”，在神祇语境中指庙宇；אֱלֹהָיו为“他的神”，译作“自己的神”可清楚回指被杀者。נִסְרֹךְ按希伯来文读音音译为“尼斯洛”。
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: 用刀杀了他
  rationale: נכה本义为击打，此处由后文王位继承可知结果是死亡；בַחֶרֶב表示以刀剑为凶器。现代汉语“用刀杀了他”准确而自然。
- source_word: נִמְלְטוּ אֶרֶץ אֲרָרָט
  choice: 逃到亚拉腊地
  rationale: נִמְלְטוּ表示成功逃脱；地点名词前虽无显式方向介词，语境表达逃往目的地，故译“逃到”。
- source_word: וַיִּמְלֹךְ אֵסַר חַדֹּן בְּנוֹ תַּחְתָּיו
  choice: 他的儿子以撒哈顿接替他作王
  rationale: מלך在王位承继叙事中表示作王；תַּחְתָּיו表示代替他、居其位。“接替他作王”清楚表达王位继承。
