base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: zh_hans
  text: 我列祖毁灭的那些邦国的神，曾救过他们吗？就是歌散、哈兰、利色，以及住在提拉撒的伊甸人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“伊甸之子”，可能指伊甸的子民或居民。
    reason: 保留בְנֵי עֶדֶן（“伊甸之子”）的字面表达，并说明其在此可泛指相关族群或居民。
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: 救了……吗
  rationale: 这是נצל的使役形完成式，用于反问；译为“救了……吗”自然表达历史语境中的讥讽，也保留“搭救、解救”的基本意义。
- source_word: אֹתָם
  choice: 他们
  rationale: 直接宾语代词指后面列出的地方及其居民；汉语中以“他们”承接“那些邦国”，并在后句具体列举。
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: 那些邦国……的神
  rationale: 该组合词组指各邦国所敬拜的神明；调整语序以符合现代汉语，同时保留复数所表达的多国诸神含义。
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: 我列祖所毁灭的
  rationale: שׁחת的加强形在军事语境中表示毁灭、摧毁；אֲבוֹתַי直译“我的父辈”，此处指亚述王的先王，采用庄重而常见的“我列祖”。
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: 歌散、哈兰、利色
  rationale: 按中文圣经地名的通行音译处理这些专名。
- source_word: וּבְנֵי עֶדֶן
  choice: 伊甸人
  rationale: בְנֵי字面为“……之子”，在这里很可能指与伊甸相关的族群或居民；正文以自然的“伊甸人”表达，脚注保留字面译法。
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: 在提拉撒的
  rationale: 介词ב加地名表示所在地点，关系从句修饰“伊甸人”；译为“在提拉撒的”简洁自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的反问句式。“我列祖”保留君王谈论先王的历史语气；“邦国”比“国家”更贴合古代政治实体。正文脚注标记[a]与脚注对应。
