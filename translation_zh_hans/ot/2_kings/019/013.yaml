base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: zh_hans
  text: 哈马王、亚珥拔王，以及西法瓦音城、希拿[a]和以瓦的王，都在哪里呢？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希拿”是地名音译，也可译作“希纳”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיּוֹ
  choice: 都在哪里呢
  rationale: 这是带第三人称阳性单数后缀的疑问词，在本节的讥讽语境中追问这些王如今的下落或结局。汉语以“都在哪里呢”统摄整串并列对象，自然保留反问语气。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 这是该词的常规译法。原文出现三次；译文在“哈马王”“亚珥拔王”和末项“……的王”中保留三重结构及其修辞力度。
- source_word: חֲמָת
  choice: 哈马
  rationale: 按现代汉语圣经地名的通行形式音译。
- source_word: אַרְפָּד
  choice: 亚珥拔
  rationale: 按现代汉语圣经地名的通行形式音译。
- source_word: לָעִיר
  choice: 西法瓦音城
  rationale: 保留原文中的“城”（עִיר）。前缀ל在这里表示王与该城的所属关系，汉语调整为“西法瓦音城……的王”。
- source_word: סְפַרְוָיִם
  choice: 西法瓦音
  rationale: 采用现代汉语圣经地名的通行音译，并与“城”组合。
- source_word: הֵנַע
  choice: 希拿
  rationale: 按希伯来语辅音形式音译；中文亦可能写作“希纳”，故加注说明。
- source_word: וְעִוָּה
  choice: 和以瓦
  rationale: 连词将“以瓦”接入同一地名系列；译文让它与“西法瓦音城、希拿”共同受末尾“的王”支配，避免无根据地增添另一个明说的“王”。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将疑问语置于句末，以符合汉语长并列句习惯；同时保留原文所列各王与各地名。末尾一个“王”统摄“西法瓦音城、希拿和以瓦”，反映希伯来语中第三个מֶלֶךְ之后的连续地名结构，但不把这种句法关系解释得超过原文本身。
