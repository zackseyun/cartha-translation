base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: zh_hans
  text: 因为必有余民从耶路撒冷出来，必有逃脱的人从锡安山出来。雅威的热忱[a]必成就这事。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“嫉妒”。希伯来语这个词既可指“热忱”，也可指“嫉妒”；这里指雅威满怀热切之情，定意要拯救耶路撒冷。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处引出前述应许得以实现的根据；“因为”自然承接上下文。
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: 必有余民从耶路撒冷出来
  rationale: 保留“从……出来”的来源和移动意象；“余民”传达危难或审判后剩余之人的先知性含义。
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: 必有逃脱的人从锡安山出来
  rationale: 原文为省略谓语的平行分句，中文补出“必有”和“出来”，使两句对称清楚；“逃脱的人”兼顾幸存与脱险之义。
- source_word: קִנְאַת
  choice: 热忱
  rationale: 该词可指热忱或嫉妒；本处强调雅威必促成拯救的强烈投入，“热忱”较切合语境，同时以脚注保留另一义项。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，区别于“主”这一称号。
- source_word: תַּעֲשֶׂה זֹּאת
  choice: 必成就这事
  rationale: 表达雅威将使所应许的结果实现；“成就”比直译“做”更符合现代汉语搭配。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，正文以“雅威”保留其专名性质，而不改作称号。
- issue: קִנְאַת יְהוָה 的语义
  choice: 雅威的热忱
  alternative: 雅威的嫉妒
  rationale: 语境着重雅威为耶路撒冷施行拯救的强烈决心，因此正文取“热忱”；但原词确有“嫉妒”义，脚注予以保留，避免消除词义张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。两行平行句在第二句补出原文省略的谓语，以符合汉语表达，同时保持来源结构和诗性对称。
