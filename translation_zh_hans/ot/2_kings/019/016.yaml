  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שֲׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖י/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שְׁלָח֔/וֹ לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: zh_hans
  text: 耶和华啊，求你侧耳垂听；耶和华啊，求你睁眼察看；也求你听听西拿基立所派来辱骂[a]永活的上帝之人的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “辱骂”也可译作“讥诮”或“挑衅”；希伯来语动词可指嘲弄、辱骂或蔑视性地挑衅。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: 侧耳垂听
  rationale: 这是希伯来语表示专心听取的惯用表达；“侧耳垂听”既保留祷告的庄重语气，也符合现代汉语表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文读者熟悉的专名形式译出四字神名，不用称号替代。
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: 睁眼察看
  rationale: 保留“睁开眼睛并看”的命令式意象和与“侧耳垂听”相应的平行结构；“察看”符合祈求上帝留意此事的语境。
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: 西拿基立所传来的话
  rationale: דִּבְרֵי 是复数“话语”；结合后面的 שְׁלָחוֹ，译成“所传来的话”，自然表达这些话借使者传达而来。
- source_word: סַנְחֵרִיב
  choice: 西拿基立
  rationale: 采用现代简体中文圣经传统中通行的亚述王名译法。
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: 他派人来用这些话
  rationale: 原文后缀使句法略显压缩，可指他所差来的人或所传来的信息；此译结合上下文显明话语由使者带来，同时不把使者误作话语本身。
- source_word: לְחָרֵף
  choice: 辱骂
  rationale: חרף 表示以言语羞辱、嘲弄或公然挑衅；“辱骂”直接保留言语攻击的核心含义，其他可能语气列入脚注。
- source_word: אֱלֹהִים חָי
  choice: 永活的上帝
  rationale: “永活的上帝”自然、庄重，并突出他与无生命偶像的对比；חָי 的基本意思是“活着的”。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名。中文正文保留专名，并采用普通中文读者最熟悉且庄重的形式“耶和华”，不以“主”替代。
- issue: לְחָרֵף 针对上帝时的语气
  choice: 辱骂永活的上帝
  alternative: 公然挑衅永活的上帝／讥诮永活的上帝
  rationale: 此动词兼有辱骂、讥诮和挑衅的语义范围。正文以“辱骂”呈现核心言语行为，脚注保留其可能带有的公然挑衅意味，避免把语义收窄。
- issue: “永活的上帝”的神学对比
  choice: 保留该称谓，不作解释性扩写
  alternative: 活着的上帝
  rationale: 原文称上帝为“活的”，在上下文中与偶像形成对比；“永活的上帝”是自然庄重的中文称谓，但不在正文中额外加入对偶像的解释。
translation_notes:
  register: 采用现代、庄重而易懂的祷告语体。“求你”补出希伯来语命令式在祷告中的恳求语气；分号维持三重祈求的节奏和平行结构。
