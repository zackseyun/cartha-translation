  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: zh_hans
  text: 你借着使者辱骂主，说：‘我凭众多战车，亲自登上群山的高处，到了黎巴嫩最偏远之处；我要砍下其中高大的香柏树和上好的柏树[a]，进入它最深处的歇息之所，进入它繁茂如园林的森林。’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “柏树”所译的希伯来语树名具体指哪一种针叶树，不能完全确定；也可译作“枞树”等。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: 借着使者
  rationale: בְּיַד在此表示施事或媒介；现代汉语用“借着”自然表达这一意义。מַלְאָכֶיךָ在政治军事语境中指亚述王派出的使者，而非天使。
- source_word: חֵרַפְתָּ
  choice: 辱骂
  rationale: חרף含有以言语羞辱、讥诮并公然蔑视之意；“辱骂”比单纯“嘲笑”更能传达对主的冒犯。
- source_word: אֲדֹנָי
  choice: 主
  rationale: 原文为אֲדֹנָי，并非四字神名יהוה，因此译作“主”，保留两者的区别。
- source_word: בְּרֹב רִכְבִּי
  choice: 我凭众多战车
  rationale: רֹב表示众多，突出说话者夸耀其庞大军力；“凭”表达战车是其倚仗的军事手段。
- source_word: אֲנִי עָלִיתִי
  choice: 亲自登上
  rationale: 独立代词אֲנִי带强调意味，以“亲自”再现说话者自夸的语气。
- source_word: מְרוֹם הָרִים
  choice: 高山之巅
  rationale: מְרוֹם指高处；“高山之巅”简洁保留登临山岭高处的意象。
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: 黎巴嫩极深之处
  rationale: יַרְכְּתֵי可指尽头、深处或偏远部分；“极深之处”保留深入黎巴嫩腹地的空间意象，而不把它单纯解释为边远地区。
- source_word: קוֹמַת אֲרָזָיו
  choice: 其中高大的香柏树
  rationale: קוֹמָה表示高度或身量，在此自然形容香柏树高大；后缀所指为黎巴嫩。
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: 上好的柏树
  rationale: מִבְחוֹר指精选、上好者。בְּרוֹשׁ是具体树种不确定的针叶树名称；正文采用传统且易懂的“柏树”，并以脚注说明不确定性。
- source_word: מְלוֹן קִצֹּה
  choice: 它最远的歇脚处
  rationale: מָלוֹן通常指住宿或停歇之处，קִצֹּה指其尽头；译文保留较具体但略显奇特的原文图像，避免擅自改成“最隐秘之处”。
- source_word: יַעַר כַּרְמִלּוֹ
  choice: 它茂密如园的森林
  rationale: יַעַר是森林，כַּרְמֶל可指园地、果园或繁茂之地；“茂密如园”兼顾森林与繁茂园地的复合意象。
theological_decisions:
- issue: אֲדֹנָי与יהוה的译名区别
  choice: 主
  alternative: 耶和华
  rationale: 本节马所拉文本写作אֲדֹנָי，意为“主”，不是四字神名；译作“主”可忠实保留原文用词的区别。
- issue: 亚述王夸口中的第一人称强调
  choice: 亲自登上
  alternative: 已经登上
  rationale: אֲנִי的显式出现强化自我夸耀；译出“亲自”保留其傲慢语气，却不额外判定该行动究竟是本人实施还是由军队代行。
- issue: 黎巴嫩图像是否寓指被征服的领袖或国家
  choice: 保留树木、森林和园地的字面图像
  alternative: 解释为其领袖、精英或坚城
  rationale: 上下文允许这些意象带有政治军事象征，但本节本身没有明说对应对象；正文不将可能的隐喻解释固定为特定神学或历史含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留亚述王连串夸口的推进感，并用“亲自”呈现原文第一人称的强调。对מְלוֹן קִצֹּה和יַעַר כַּרְמִלּוֹ等罕见组合不过度释义，使原文的空间与园林意象仍可见。
