base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: zh_hans
  text: 埃及王不再从本国出兵，因为巴比伦王已经夺取了从埃及溪[a]直到幼发拉底河之间原属埃及王的一切。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “埃及溪”也可译作“埃及干河谷”。希伯来语所用的词可指季节性水道、溪流或干河谷；这里不大可能指尼罗河。
    reason: 说明地理名称中נחל的词义范围，避免读者误以为这是尼罗河。
lexical_decisions:
- source_word: הֹסִיף עוֹד ... לָצֵאת
  choice: 不再……出兵
  rationale: הוסיף与不定式连用，在לא和עוד的否定结构中表示不再继续或再次做某事；结合君王及疆域争夺的语境，译作“不再出兵”自然地表达军事行动，同时不额外指定某次战役。
- source_word: מֵאַרְצוֹ
  choice: 从本国
  rationale: 直译为“从他的国土”；这里所指是埃及王自己的国家，现代汉语用“本国”简洁清楚。
- source_word: כִּי
  choice: 因为
  rationale: 引出埃及王不再出兵的原因。
- source_word: לָקַח
  choice: 已经夺取了
  rationale: לקח基本义为“拿、取”；在两国疆域争夺的语境中，“夺取”准确而自然。“已经”体现该行动在埃及王停止出兵以前已经发生。
- source_word: מִנַּחַל מִצְרַיִם
  choice: 从埃及溪
  rationale: נחל通常指溪流、季节性水道或干河谷，并非通常称为יאור的尼罗河。“埃及溪”保留传统地名形式，脚注说明其地貌含义。
- source_word: עַד נְהַר פְּרָת
  choice: 直到幼发拉底河
  rationale: נהר明确指河流，פרת即幼发拉底河；“直到”自然表达疆域范围的终点。
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: 一切原属埃及王之地
  rationale: 希伯来文直为“一切属于埃及王的”；上下文用两个地理界标划定范围，主要所指是埃及控制的领土。加入“之地”使中文所指明确，“原属”体现这些地方已被夺取。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“出兵”贴合君王越境军事行动的语境；“一切原属埃及王之地”则按地理范围明确其主要指领土，同时不引入具体行政或政治术语。
