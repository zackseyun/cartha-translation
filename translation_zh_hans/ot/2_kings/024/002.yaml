id: 2KI.24.2
reference: 2 Kings 24:2
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: zh_hans
  text: 雅威派迦勒底人的队伍[c]、亚兰[b]人的队伍、摩押人的队伍和亚扪人的队伍攻击他；他派这些队伍袭击犹大，为要毁灭它[a]；这是照着雅威借着他仆人众先知所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“为要毁灭他”，指约雅敬，而不是犹大。
    reason: alternative_reading
  - marker: b
    text: 希伯来文为“亚兰”，传统上也译作“叙利亚”。
    reason: lexical_alternative
  - marker: c
    text: “队伍”或译“劫掠队”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 派
  rationale: 这是叙事中 שׁלח 的常用对应词，简洁自然，并保留雅威主动差派这些队伍的含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语中贴近希伯来文四字神名的音译来呈现专名。
- source_word: בּוֹ
  choice: 攻击他
  rationale: 在敌对军事语境中，介词 בּ 表示行动针对约雅敬；“攻击他”比直译“在他身上”自然明确。
- source_word: גְּדוּדֵי
  choice: 队伍
  rationale: 该词指从事袭扰的小股武装，而未必是正规大军；“队伍”既不过度限定，也能自然重复原文的排比。另以脚注保留“劫掠队”的具体译法。
- source_word: כַשְׂדִּים
  choice: 迦勒底人
  rationale: 保留原文的族群名称，不以历史上相关但范围更宽的“巴比伦人”代替。
- source_word: אֲרָם
  choice: 亚兰
  rationale: 直接音译希伯来地名；传统译名“叙利亚”置于脚注。
- source_word: מוֹאָב
  choice: 摩押
  rationale: 采用现代中文圣经读者熟悉的标准音译。
- source_word: בְנֵי עַמּוֹן
  choice: 亚扪人
  rationale: 原文直译为“亚扪之子”，在此是族群称谓，译作“亚扪人”符合现代汉语习惯。
- source_word: וַיְשַׁלְּחֵם
  choice: 他派这些队伍
  rationale: 保留原文重复的“派”，并将代词明示为“这些队伍”，使汉语指代清楚。
- source_word: בִּיהוּדָה
  choice: 袭击犹大
  rationale: 介词本可表示“在、进入”，但结合敌对军事行动和后接目的语，“袭击犹大”最自然地传达语境中的方向和敌意。
- source_word: לְהַאֲבִידוֹ
  choice: 为要毁灭它
  rationale: 阳性单数后缀可指约雅敬，也可指作为政治实体的犹大；正文依直接语境取犹大为所指，并用脚注保存另一可能。
- source_word: כִּדְבַר יְהוָה
  choice: 正如雅威……所说的话
  rationale: 表达事件与雅威先前所宣告之话相符；“正如”在现代汉语中自然呈现 כִּדְבַר 的规范、应验关系。
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: 借着他的仆人众先知
  rationale: “借着……之手”是希伯来语表达媒介的习语；汉语译作“借着”更自然，同时保留先知是雅威仆人的身份。
theological_decisions:
- issue: לְהַאֲבִידוֹ 中单数代词所指
  choice: 正文译作“毁灭它”，理解为毁灭犹大。
  alternative: “毁灭他”，理解为毁灭约雅敬。
  rationale: 前一句刚出现“犹大”，而上下文着重雅威照先知之言审判犹大，因此正文以犹大为所指；但希伯来文的阳性单数后缀在语法上也可能回指约雅敬，故不将此歧义静默消除，而在脚注中保留。
- issue: 雅威差派外族武装与先知预言的关系
  choice: 保留“雅威派……正如雅威……所说”的直接因果与应验表述。
  alternative: 弱化为雅威仅容许这些事件发生，或只说事件碰巧符合预言。
  rationale: 原文两次使用“派”，又明确说这事照雅威借先知所说的话发生；译文应保留其强烈的神圣审判与预言应验表达，而不额外加入系统神学解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留原文两次“派”的推进和四组“……人的队伍”的排比；用“袭击”交代军事敌意，但不把 גְּדוּדֵי 一概扩大为正规“大军”。所有脚注标记均置于正文相应词句之后。
