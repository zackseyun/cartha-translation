base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: zh_hans
  text: 那时，巴比伦王尼布甲尼撒的臣仆上来攻打耶路撒冷[a]，城便陷入围困[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“上到耶路撒冷。”原文的“上来”既可反映耶路撒冷的地势，也可用于军事进发。
    reason: lexical_alternative
  - marker: b
    text: 或译：“城被围困了。”原文较直译为“城进入围困之中”，可能着重表示围城的开始。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: 那时
  rationale: 自然、简明地保留希伯来语指示当时历史情境的时间短语。
- source_word: עָלָה
  choice: 上到
  rationale: 保留原文“上去、上到”的空间与行军意象；耶路撒冷地势较高，而上下文表明这是敌对的军事行动。
- source_word: עַבְדֵי
  choice: 臣仆
  rationale: 原词泛指受王权支配、奉命行事的人；此处很可能包括军事人员，但原文没有明确说“军队”，故不作过度具体化。
- source_word: נְבֻכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经与读者较熟悉的通行译名。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 直接表达原文的王室头衔，并符合现代汉语语序。
- source_word: יְרוּשָׁלִָם
  choice: 耶路撒冷
  rationale: 采用现代中文通行地名译法。
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: 城便开始被围困
  rationale: 原文近似“城进入围困之中”，带有进入某种状态的起始意味；“开始被围困”既自然，又保留这一动态语气。
- source_word: מָצוֹר
  choice: 围困
  rationale: 准确表达针对城邑的军事包围状态；比“封锁”更贴合古代攻城语境。
