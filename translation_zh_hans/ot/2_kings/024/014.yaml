base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: zh_hans
  text: 他把耶路撒冷所有的人、所有官员、所有勇猛的战士，以及所有工匠和铁匠[a]都掳去，共一万名被掳者；除了当地最贫穷的人以外，没有人留下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “铁匠”所译的希伯来语词确切所指的工种不确定，也可能泛指金属工匠。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  choice: 掳走
  rationale: 该词是 גלה 的使役式，表示强迫人离乡流亡。“掳走”在历史叙事中自然明确，同时体现强制迁移。
- source_word: כָּל יְרוּשָׁלִַם
  choice: 耶路撒冷全城的人
  rationale: 原文以城市代指居民；中文补出“人”，避免误解为城池本身被搬走，同时保留“全城”的概括语气。
- source_word: הַשָּׂרִים
  choice: 官员
  rationale: שׂרים 可指首领、贵族或官员；此处指耶路撒冷的统治阶层，“官员”不把范围限于王族或军官。
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: 勇猛的战士
  rationale: 这一固定表达在本语境中指英勇善战、具备作战能力的人；译文兼顾军事含义与原文的庄重语气。
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: 被掳的共有一万人
  rationale: גולה 是集合名词，指遭迁徙流放的人群。这样译清楚表达人数，并将“一万人”理解为前述被掳群体的总数。
- source_word: הֶחָרָשׁ
  choice: 工匠
  rationale: חָרָשׁ 泛指有专门技艺的手艺人，“工匠”保留其宽泛含义。
- source_word: הַמַּסְגֵּר
  choice: 铁匠
  rationale: 传统上理解为从事金属加工者，译作“铁匠”简洁自然；其确切工种并不确定，故以脚注说明。
- source_word: לֹא נִשְׁאַר
  choice: 没有人留下
  rationale: 该被动式表示无人留在原处；此译符合现代汉语叙事表达。
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: 除了当地最贫穷的人以外
  rationale: דַּלַּת 指贫困、弱势的一群人；“当地”自然表达 עַם הָאָרֶץ 在此处所指的本地居民，而不赋予后期术语含义。
