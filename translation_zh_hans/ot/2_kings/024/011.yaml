base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/011.yaml
  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: zh_hans
  text: 巴比伦王尼布甲尼撒来攻打这城；当时，他的臣仆正在围困这城。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“当时，他的臣仆正在围攻这城。”
    reason: lexical_alternative
  - marker: b
    text: “臣仆”可指巴比伦王手下的官员、代理人或服役于王的军队。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא的叙事形式表示“来、到达”；结合עַל及围城语境，译作“来到城下”自然地表达敌军逼近城池。
- source_word: נְבוּכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经及一般中文语境中通行的巴比伦王名译法。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 准确而自然地表达希伯来语属格结构，即巴比伦的君王。
- source_word: עַל הָעִיר
  choice: 城下
  rationale: עַל在军事进逼和围城语境中带有敌对趋向；“来到城下”既符合现代汉语习惯，也不必生硬直译为“来到城上”。
- source_word: וַעֲבָדָיו
  choice: 他的臣仆
  rationale: עֲבָדָיו字面为“他的仆人”，王室语境中可泛指臣属、官员、代理人或军队；“臣仆”保留隶属君王的含义，同时避免径直限定为官员或士兵。
- source_word: צָרִים
  choice: 正在围困
  rationale: צור的分词在此表示持续进行的围城行动；“正在围困”清楚传达与尼布甲尼撒到来同时发生的动作。
- source_word: עָלֶיהָ
  choice: 这城
  rationale: 阴性代词回指הָעִיר“城”；中文重述“这城”比直译介词和代词更清楚自然。
