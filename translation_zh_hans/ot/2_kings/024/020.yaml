  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: zh_hans
  text: 因为雅威发怒，耶路撒冷和犹大的景况到了这个地步，直到他把他们从自己面前赶出去[a]。西底家反叛巴比伦王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“雅威的怒气临到耶路撒冷和犹大，直到他把他们从自己面前赶出去。”希伯来文的前半句十分紧缩，也可较形式对应地这样翻译。
    reason: 保留原文首句在隐含主语和介词关系上的真实歧义。
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 此处引出对前文的解释和原因。现代汉语用“因为”即可自然承载这一因果关系，无须机械叠加两个连接词。
- source_word: עַל אַף יְהוָה
  choice: 因为雅威发怒
  rationale: עַל אַף 表示因愤怒而起的行动或后果；译成“因为……发怒”自然且保留神施行审判的力度。专名 יְהוָה 译为“雅威”。
- source_word: הָיְתָה
  choice: 景况竟到了这个地步
  rationale: 该阴性单数动词没有明示主语，希伯来文表达紧缩；此译以汉语惯用方式呈现局势发展至这一结局的含义，同时用脚注保留较形式对应的另一种理解。
- source_word: בִירוּשָׁלִַם וּבִיהוּדָה
  choice: 耶路撒冷和犹大的景况
  rationale: 介词 ב 在主译中按地点或范围理解。为使汉语完整自然，将无明确主语的结构表达为两地的“景况”。
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: 直到他把他们……赶出去
  rationale: עַד 加不定式表示持续状况的终点；“赶出去”准确传达 השליך 在这里所含的驱逐意味。
- source_word: מֵעַל פָּנָיו
  choice: 从自己面前
  rationale: 较直接地保留希伯来语“从他面前”的意象，并表达被逐离神面前的意义。反身代词清楚指回雅威。
- source_word: וַיִּמְרֹד
  choice: 背叛了
  rationale: מרד 指反叛统治者；“背叛”符合现代汉语对君王关系的自然表达。
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 介词 ב 与 מרד 连用表示反抗的对象，汉语“背叛巴比伦王”已自然包含“反对、反抗”之意。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 首句中神的愤怒、两地的景况与被逐之间的关系
  choice: 雅威发怒，使耶路撒冷和犹大的景况发展到被赶出他面前的地步
  alternative: 雅威的怒气临到或针对耶路撒冷和犹大，直到他把他们赶出去
  rationale: 原文句法紧缩，הָיְתָה 的主语没有明说。主译表达原因和结果的发展关系，但不具体增添历史事件；脚注保留把神的怒气视作该动词隐含主语的读法。
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较直接地按其可能发音呈现这一专名，同时不以称号代替。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“景况竟到了这个地步”使无明示主语的希伯来语在中文中可读，又避免把具体灾祸擅自补入正文；“从自己面前赶出去”保留原文鲜明的驱逐意象。
