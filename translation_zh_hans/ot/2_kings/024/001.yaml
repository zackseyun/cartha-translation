base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: zh_hans
  text: 约雅敬在位的时候，巴比伦王尼布甲尼撒前来。约雅敬臣服于他[a]三年，随后转而[b]背叛他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“作他的仆人”，在这里是政治用语，指一位君王受另一位君王管辖；也可译作“作他的附庸”。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“随后回转，背叛他”。“回转”可能表示约雅敬在发动背叛前改变了效忠对象。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: 他在位期间
  rationale: 这是表示时间的惯用语，所指是前文人物作王的时期；译作“在位期间”比直译“在他的日子里”更符合现代汉语。
- source_word: עָלָה
  choice: 进军而来
  rationale: 该动词本义为“上去／上来”，在此王国交战的语境中表示率军前来；“进军而来”既传达军事含义，也不擅自补明经文未说出的目的地。
- source_word: נְבֻכַדְנֶאצַּר
  choice: 尼布甲尼撒
  rationale: 采用现代中文圣经读者熟悉的通行人名译法。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 自然、准确地表达希伯来语的属格结构。
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: 约雅敬臣服于他
  rationale: 原文直译近于“作他的仆人”，这里是君王受制于宗主国的政治表达；“臣服于他”清楚传达进入从属状态，又避免套用特定封建制度术语。
- source_word: שָׁלֹשׁ שָׁנִים
  choice: 三年
  rationale: 在“臣服于他三年”中自然表达持续时间。
- source_word: וַיָּשָׁב
  choice: 后来却转而
  rationale: שׁוב有“转回、返回”之意；在这里标示约雅敬改变效忠方向。“转而”保留这种逆转，并与下文“背叛”自然衔接。
- source_word: וַיִּמְרָד בּוֹ
  choice: 背叛了他
  rationale: מרד搭配ב表示反抗上级统治者；“背叛了他”在本句政治语境中清楚自然。
