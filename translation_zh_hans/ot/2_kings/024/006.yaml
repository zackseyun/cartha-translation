base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: zh_hans
  text: 约雅敬与他列祖同睡[a]；他儿子约雅斤接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或意译“死了”。希伯来原文直译为“与他的列祖同睡”，是记述君王死亡的固定说法。
    reason: 说明希伯来语死亡惯用语，并提供较直白的现代汉语释义。
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与他的列祖同睡
  rationale: 这是希伯来语记述君王死亡的固定表达。译作“与他的列祖同睡”既保留原文意象，也不添加本节未明说的安葬细节；脚注说明其含义。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 此处指约雅斤登基继位；与“接替他”连用，清楚表达王位承继，而不侧重统治年限。
- source_word: בְּנוֹ
  choice: 他的儿子
  rationale: 直接表达父子关系，符合原文。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 在王位承继语境中表示取代前任、继承其位；现代汉语中“接替他”自然清楚。
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: 约雅敬／约雅斤
  rationale: 采用现代中文圣经人名的通行译法，便于读者辨认。
theological_decisions:
- issue: 如何翻译君王死亡的固定表达，同时不增添安葬信息
  choice: 正文保留“与他的列祖同睡”
  alternative: 意译为“死了”，或扩写为“死了，葬在他的列祖那里”
  rationale: 原文明确使用“与列祖同睡”的死亡惯用语，却没有在本节明说安葬。保留该表达可忠实呈现原文，并避免把未明确陈述的埋葬细节带入译文。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“列祖同睡”保留原文的传统死亡意象；“接替他作王”自然表达登基承位。
