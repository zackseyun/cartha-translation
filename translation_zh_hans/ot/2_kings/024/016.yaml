  text: וְ/אֵת֩ כָּל אַנְשֵׁ֨י הַ/חַ֜יִל שִׁבְעַ֣ת אֲלָפִ֗ים וְ/הֶ/חָרָ֤שׁ וְ/הַ/מַּסְגֵּר֙ אֶ֔לֶף הַ/כֹּ֕ל גִּבּוֹרִ֖ים עֹשֵׂ֣י מִלְחָמָ֑ה וַ/יְבִיאֵ֧/ם מֶֽלֶךְ בָּבֶ֛ל גּוֹלָ֖ה בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: zh_hans
  text: 所有能征善战的人，共七千名；工匠和金属工匠[a]，共一千名。他们全都是能上阵作战[b]的勇士。巴比伦王把他们掳到巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“铁匠”。
    reason: 希伯来语 הַמַּסְגֵּר 的具体工种并不完全确定，可能泛指从事金属加工的人。
  - marker: b
    text: 直译“从事战争”。
    reason: 保留 עֹשֵׂי מִלְחָמָה 的字面表达，同时说明正文“能上阵作战”所依据的希伯来语习语。
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: 能征善战的人
  rationale: 该短语指强健、有能力且可供军事使用的人；译法在现代汉语中自然，并保留其军事含义。
- source_word: שִׁבְעַת אֲלָפִים
  choice: 共七千名
  rationale: 准确表达人数；“共”使本组人数的统计关系清楚。
- source_word: הֶחָרָשׁ
  choice: 工匠
  rationale: חָרָשׁ 泛指掌握木、石或金属等技艺的手艺人，不宜限定为某一种行业。
- source_word: הַמַּסְגֵּר
  choice: 铁匠
  rationale: 该词在本处很可能指从事锻造或金属加工的人；正文采用简洁传统的“铁匠”，脚注保留较宽泛的可能。
- source_word: אֶלֶף
  choice: 共一千名
  rationale: 表示工匠与铁匠合计的人数；“共”明确这一统计关系。
- source_word: הַכֹּל
  choice: 他们全都
  rationale: 承接并总括前述被掳人员，现代汉语中指代清晰。
- source_word: גִּבּוֹרִים
  choice: 勇士
  rationale: 该词指强壮有力的人，在此明显带有军事意味；“勇士”简洁庄重。
- source_word: עֹשֵׂי מִלְחָמָה
  choice: 能上阵作战
  rationale: 字面为“从事战争”，在语境中指具备服役和作战能力的人；该译法自然表达这种能力而不过度解释为受过专门训练。
- source_word: וַיְבִיאֵם
  choice: 把他们掳到
  rationale: 动词本义为“带去”，但与 גּוֹלָה 连用时表达强制迁徙；“掳到”在此准确、简洁。
- source_word: גּוֹלָה
  choice: 掳
  rationale: 此名词在句中表示被放逐、被迁徙的状态或结果，与动词合译为“掳到”符合汉语习惯。
- source_word: בָּבֶלָה
  choice: 到巴比伦
  rationale: 词尾方向成分表示朝向巴比伦，译作“到巴比伦”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“共七千名”“共一千名”清楚呈现两组人数；用“掳到”自然表达强制放逐。避免把工匠的类别和军事人员的训练程度说得超过原文。
