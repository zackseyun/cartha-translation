  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: zh_hans
  text: 他行雅威眼中看为恶的事，完全照着他父亲所行的一切而行。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他行
  rationale: Qal叙事式未完成时推进叙事；汉语在独立经节中不必机械译出连接词וַ，译作“他行”简洁自然。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: 带冠词的形容词在此作名词用；结合בְּעֵינֵי译成汉语惯用表达“眼中看为恶的事”。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在……眼中”的评价视角，同时使现代汉语通顺。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者最熟悉的专名形式音译四字神名，保留其作为名字而非称号的性质。
- source_word: כְּכֹל
  choice: 完全照
  rationale: כְּ表示依照或比较，כֹל强调全部范围；“完全照”自然表达其全面一致的语气。
- source_word: אֲשֶׁר עָשָׂה
  choice: 所行的
  rationale: 关系词与完成时动词合译为汉语“所”字结构；上下文已表明是父亲先前的行为，无须另加时态标记。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 直接表达名词及第三人称阳性单数后缀。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文采用广为通行的专名“耶和华”，不以“主”这一称号替代，同时避免在正文中加入原文没有的解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言，并保留《列王纪》中“行耶和华眼中看为恶的事”这一反复出现的评价公式。句首וַ未单独译作“于是/并且”，以符合现代汉语独立经节的自然表达；“完全照”保留כְּכֹל的整体性强调。
