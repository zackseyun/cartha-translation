revisions:
- from: 也因他所流的无辜之人的血[a]；他使无辜者的血充满了耶路撒冷，耶和华不肯赦免。
  to: 又因他所流无辜人的血[a]，因为他使耶路撒冷充满无辜人的血；耶和华不肯赦免。
  rationale: 本次仅作安全的汉语表达和术语一致性修订。译文仍保留本节承接上文的“又因”、血债的重复强调，以及耶和华“不肯”赦免的意愿性措辞。英文审校轨迹所列第二脚注“Or ‘the LORD would not forgive’”并非本节第二个脚注锚点的适当词汇替代，且与希伯来文的分句对应不当，因此不增设该脚注。
