base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: zh_hans
  text: 又因他所流无辜人的血[a]，因为他使耶路撒冷充满无辜人的血；耶和华不肯赦免。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“无辜的血”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 也因
  rationale: 承接上文所列审判的缘由，并增添一项原因；中文用“也因”自然表达连接和递进关系。
- source_word: דַּם הַנָּקִי
  choice: 无辜之人的血
  rationale: 该短语指无辜者被杀所造成的流血罪；这样译既体现定指，也比“无辜的血”更清楚地表明血属于无辜者。
- source_word: אֲשֶׁר שָׁפָךְ
  choice: 他所流的
  rationale: שׁפך与“血”连用，是“流血”的常见表达；关系结构“所流的”贴近原文且符合现代汉语。
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: 他使无辜者的血充满了耶路撒冷
  rationale: 保留原文“使……充满”的强烈图像，同时用“无辜者的血”清楚表达 דָּם נָקִי 的含义。
- source_word: וְלֹא אָבָה
  choice: 不肯
  rationale: אָבָה表示愿意、同意；“不肯”简洁而准确地保留意志层面的拒绝，比单纯“不”更充分。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中对四字神名最广为人知的音译，保留其专名性质，不以“主”这一称号替代。
- source_word: לִסְלֹחַ
  choice: 赦免
  rationale: סלח在上帝宽赦罪责的语境中译为“赦免”准确、庄重，也为普通读者熟悉。
theological_decisions:
- issue: 上帝因玛拿西所负流无辜人血之罪而拒绝赦免
  choice: 直译为“耶和华不肯赦免”
  alternative: 耶和华不赦免／耶和华不愿宽恕
  rationale: 原文明确使用表示意愿的 אָבָה，并将这一拒绝与累积的流血罪相连。译文保留其严厉程度和神学张力，不把赦免对象擅自限定为玛拿西、犹大或某一具体刑罚。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“无辜之人的血”在首处较明确，第二处用“无辜者的血”避免累赘；“不肯赦免”保留原文关于意愿的措辞。原英文第二个脚注内容与其正文及希伯来文不相符，故未沿用。
