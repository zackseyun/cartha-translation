base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: zh_hans
  text: 巴比伦王立约雅斤的叔叔玛探雅[a]接替他作王，并把玛探雅的名字改为西底家。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“任命玛探雅……作王。”原文动词为使役式，表示巴比伦王扶立他为王。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: 立……作王
  rationale: 该词是מלך的使役式，表示巴比伦王扶立或任命玛探雅作王；“立……作王”自然且保留使役含义。
- source_word: מֶלֶךְ בָּבֶל
  choice: 巴比伦王
  rationale: 简洁、清楚地表达希伯来语的属格结构，也是现代中文圣经叙事的自然说法。
- source_word: מַתַּנְיָה
  choice: 玛探雅
  rationale: 按中文圣经人名的通行音译处理。
- source_word: דֹדוֹ
  choice: 约雅斤的叔叔
  rationale: 原文直译为“他的叔叔”；结合紧接的上文，代词所指是约雅斤。为避免现代中文中的指代歧义，在正文中明确其所指，同时保留具体亲属关系。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 在立王语境中表示替代、继位；“接替他作王”比字面式的“在他的位置上”更符合现代中文。
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: 把玛探雅的名字改为
  rationale: סבב与“名字”连用时表示改名；重述人名可避免连续两个“他”产生指代不清。
- source_word: צִדְקִיָּהוּ
  choice: 西底家
  rationale: 采用现代中文圣经中已经确立的通行译名。
theological_decisions: []
