base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: zh_hans
  text: 他把约雅斤、王的母亲[a]、王的妻子们、他的宫廷官员[b]和国中的权贵[c]从耶路撒冷掳到巴比伦。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“王太后”；原文直译为“王的母亲”。
    reason: lexical_alternative
  - marker: b
    text: 或译“他的宦官”；原词既可指宦官，也可泛指王室或宫廷官员。
    reason: lexical_alternative
  - marker: c
    text: 或译“国中的有权势者”或“国中的显贵”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: 掳到
  rationale: 该动词在使役意义上表示使人离乡、进入被掳状态；“掳到”既体现强制迁移，也自然衔接目的地“巴比伦”。
- source_word: בָּבֶלָה
  choice: 到巴比伦
  rationale: 词尾的方向性 ה 表示朝向巴比伦，现代汉语自然译作“到巴比伦”。
- source_word: אֵם הַמֶּלֶךְ
  choice: 王的母亲
  rationale: 按原文亲属表达直译，不直接将其处理为正式宫廷称号“王太后”。
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: 王的妻子们
  rationale: 保留复数及原文重复出现的“王的”，不以“妃嫔”额外限定其宫廷身份或等级。
- source_word: סָרִיסָיו
  choice: 他的宫廷官员
  rationale: סָרִיס既可专指宦官，也可泛指王室官员；正文采用语境中自然且不过度限定身体状况的“宫廷官员”，另以脚注保留另一可能。
- source_word: אֵילֵי הָאָרֶץ
  choice: 国中的权贵
  rationale: 该表达指国内有势力、有地位的人；“权贵”兼顾其权势和社会显要地位，比字面化的“勇士”更符合此处被掳人员名单的语境。
- source_word: הוֹלִיךְ גּוֹלָה
  choice: 带到……使他们被掳
  rationale: 保留使人前往并进入流亡、被掳状态的复合含义，也与前半句的“掳到”形成对应。
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: 从耶路撒冷带到巴比伦
  rationale: 清楚呈现迁移的起点与终点。
theological_decisions: []
