  rationale: 将名单合并为“掳到巴比伦”的并列宾语，并保留“从耶路撒冷”这一出发地。这自然表达全句的放逐行动，避免重复和不自然的使役结构，且不改变原文所列人物、方向或被掳含义。脚注锚点及其词义备选均予保留。
