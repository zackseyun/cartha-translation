base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: zh_hans
  text: 西底家登基时二十一岁，在耶路撒冷作王十一年。他母亲名叫哈慕她[a]，是立拿人耶利米的女儿。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 辅音文本在这里写作“哈米她”（חמיטל），传统读法为“哈慕她”；另见列王纪下23:31。
    reason: textual_or_orthographic_detail
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: 二十一岁
  rationale: 这是表示年龄的希伯来语惯用语；译为现代汉语常用的年龄表达，意义准确而不拘泥于字面。
- source_word: בְמָלְכוֹ
  choice: 登基时
  rationale: 介词 בְּ 加不定式结构表示开始作王之时；“登基时”简洁、自然地表达即位的时间。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词指以君王身份统治；“作王”符合中文圣经历史叙事的庄重语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 在此表示地点。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 以自然的现代汉语呈现列王纪常见的王室资料公式。
- source_word: חמיטל
  choice: 哈慕她
  rationale: 采用现代中文中清楚标示女性的音译；脚注说明辅音文本拼写与传统读法之间的情况。
- source_word: בַּת יִרְמְיָהוּ
  choice: 耶利米的女儿
  rationale: 直接表达父女关系，不增加原文没有的信息。
- source_word: מִלִּבְנָה
  choice: 立拿人
  rationale: 介词 מִן 表示来源地；原文语序最自然地修饰紧邻的耶利米，因此译作“立拿人耶利米”。
