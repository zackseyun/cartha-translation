id: 2KI.24.13
reference: 2 Kings 24:13
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: zh_hans
  text: 他把耶和华殿里的一切珍宝和王宫里的一切珍宝都从那里搬走了[a]，又把以色列王所罗门在耶和华圣殿里制造的一切金器都砍成碎片[b]，正如耶和华所说的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “搬走了”也可译作“从那里取出来了”或“从那里带走了”。
    reason: lexical_alternative
  - marker: b
    text: 本节前面的“耶和华殿”直译为“耶和华的房屋”；这里译作“耶和华圣殿”的希伯来词不同，通常更具体地指圣殿建筑或圣所。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: 从那里搬走了
  rationale: 使役形表达将物品从某处移出；结合劫掠语境，“搬走”自然地兼顾移出和带走之意。
- source_word: אוֹצְרוֹת
  choice: 珍宝
  rationale: 这里是被搬走的贵重财物，而不是主要指存放财物的库房。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: 既保留“耶和华的殿”这一基本意义，也符合现代汉语圣经叙事的庄重表达；并与后文 הֵיכַל 的“圣殿”略作区分。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代汉语中通行的专名形式直接译出四字神名。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋”；在此指王的宫殿，译作“王宫”自然清楚。
- source_word: וַיְקַצֵּץ
  choice: 砍成碎片
  rationale: 该加强词干表示切砍、截成片段；此译保留具体而强烈的破坏动作。
- source_word: כְּלֵי הַזָּהָב
  choice: 金器
  rationale: כְּלִי 泛指器具或物件；在圣殿语境中，“金器”简洁且准确。
- source_word: עָשָׂה
  choice: 制造
  rationale: 指所罗门先前命造或制作这些器物；汉语无需另用形式标明先时关系。
- source_word: בְּהֵיכַל יְהוָה
  choice: 在耶和华圣殿里
  rationale: הֵיכַל 在这里较具体地指圣殿建筑或圣所；译为“圣殿”并与前面的 בֵּית 略作词汇区分。
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: 正如耶和华所说的
  rationale: 保留先前神谕得到应验的呼应，同时采用自然、庄重的现代汉语。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。简体中文读者最熟悉且通行的专名形式是“耶和华”；同时不以“主”替代，从而保留专名性质。
- issue: “正如耶和华所说的”所指的应验关系
  choice: 保持概括表达，不补明具体预言
  alternative: 增译为“正如耶和华预先所说的”或注明某一具体经文
  rationale: 原文只陈述与耶和华先前所说的话相符，没有在本节明确指定某一条预言；不应在正文中替作者消除这一开放性。
translation_notes:
  register: 采用自然、庄重的现代标准普通话。“王宫”避免生硬直译“王的房屋”；“砍成碎片”保留原文具体的破坏动作。所有脚注标记均置于正文相关语句之后。
