base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: zh_hans
  text: 他行在耶和华眼中看为恶的事，完全仿效约雅敬所行的一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他行
  rationale: 叙事中的连续式动词表达接续发生的行动；中文无需机械译出句首连接词，隐含主语按上文译为“他”。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: עשה הרע是固定表达，意为做被判定为恶的事；这样译比生硬的“行那恶”更符合现代汉语。
- source_word: בְּעֵינֵי
  choice: 眼中看为
  rationale: 保留希伯来语“在……眼中”的视角隐喻，同时用“看为”清楚表达评价含义。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的专名形式音译四字神名，避免用“主”这一称号取代原文的专名。
- source_word: כְּכֹל אֲשֶׁר
  choice: 完全照着
  rationale: “完全”体现כֹּל的全面范围，“照着”表达行为模式上的对应，组合起来简洁自然。
- source_word: עָשָׂה
  choice: 所行的
  rationale: 中文“所行的”自然指向约雅敬先前的全部行为，不必借助显式的过去完成时。
- source_word: יְהוֹיָקִים
  choice: 约雅敬
  rationale: 采用该希伯来人名在现代中文圣经中的通行音译。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威；主
  rationale: 原文直接使用四字神名。译作“耶和华”既保留其专名性质，又采用现代中文读者最熟悉的传统音译；不以称号“主”替代。
- issue: 恶的判定视角
  choice: 耶和华眼中看为恶
  alternative: 他作恶
  rationale: 保留בְּעֵינֵי所强调的评价视角，表明这里的道德判断来自耶和华，而不只是叙述者未加说明的断言。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。保留“在……眼中”的希伯来语意象，但调整为中文惯用的“眼中看为”；句式简洁，适合正文朗读。
