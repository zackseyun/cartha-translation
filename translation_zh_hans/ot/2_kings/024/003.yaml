revisions:
- from: 这事临到犹大，确实是出于耶和华的命令，为要把他们从自己面前[a]除去；这是因玛拿西所犯的罪，就是他所做的一切。
  to: 这事临到犹大，确实是出于耶和华的命令，为要把他们从他面前[a]除去；这是因玛拿西所犯的一切罪。
  rationale: 修订仅消除末句将“一切所做的事”与“罪”直接等同所造成的语义与表达问题，并将“自己”改为指向更明晰的“他”。审判事件和被除去者仍按上下文作必要补足，且保留“面前”的原文意象与脚注替代译法。
