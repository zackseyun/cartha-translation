  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: zh_hans
  text: 这事临到犹大，确实是出于耶和华的命令，为要把他们从他面前[a]除去；这是因玛拿西所犯的一切罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“离开他的临在”。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: 确实
  rationale: 此处用于加强断言，而非表示“只是”的限制义；“确实”自然承接上下文对审判原因的说明。
- source_word: עַל פִּי יְהוָה
  choice: 出于耶和华的命令
  rationale: עַל־פִּי 字面为“照……的口”，在此表达依照命令或话语而发生；该译法既自然，也保留耶和华作为审判发令者的意义。
- source_word: הָיְתָה בִּיהוּדָה
  choice: 这事临到犹大
  rationale: 原文省略了所发生之事的明确名词，语境指上一节所述的灾祸与审判；补出“这事”可使中文通顺，同时不把具体灾祸限定得过窄。
- source_word: לְהָסִיר
  choice: 除去
  rationale: סור 的使役式在此表示使某对象离开、将其移除；“除去”符合审判和逐离的语境。
- source_word: מֵעַל פָּנָיו
  choice: 从自己面前
  rationale: 保留希伯来文“面前”的具体意象，同时用“自己”清楚回指耶和华；脚注列出较抽象而流畅的译法。
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  choice: 因玛拿西所犯的罪
  rationale: 介词 בְּ־ 在此表示原因；“所犯的罪”在现代汉语中自然表达玛拿西的罪责，也容许“罪”具有集合意义。
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: 就是他所做的一切
  rationale: 该短语说明玛拿西之罪与他全部恶行相对应。中文以“就是”承接前面的“罪”，清楚表达所指范围，同时避免生硬的“按照他所做的一切”。
theological_decisions:
- issue: 审判事件及“除去”的宾语均为省略成分
  choice: 以“这事”指前文所述的审判，并补出“他们”作为被除去的人。
  alternative: 较形式化地译为“这事发生在犹大，为要从他面前除去”，不补明确宾语。
  rationale: 希伯来文在两处都有省略，但上下文指审判临到犹大，并指犹大居民被赶逐。中文若完全保留省略会语意残缺；所补内容由近接语境支持，并未增添新的神学主张。
- issue: 上帝临在的具象表达
  choice: 正文保留“从自己面前”，以保存原文“脸面/面前”的意象。
  alternative: 译为“离开他的临在”。
  rationale: 具象措辞体现被逐离耶和华面前的审判含义，现代读者也能理解；较抽象的解释列入脚注，不在正文中消解原文意象。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“耶和华”沿用中文圣经对四字神名的通行译法；整体保留原文的因果关系、审判主体及“面前”的具象表达。
