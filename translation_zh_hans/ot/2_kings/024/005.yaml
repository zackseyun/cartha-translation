  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְהוֹיָקִ֖ים וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 约雅敬其余的事，以及他所做的一切，不都记在《犹大诸王纪事》[a]中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“犹大诸王年鉴”。希伯来文书名指《列王纪》中屡次引用的一份王室记录文献，未必是正典中的《历代志》。
    reason: 说明书名的另一种译法，并避免把所引王室档案与正典《历代志》直接等同。
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: 约雅敬其余的事
  rationale: יֶתֶר 表示“其余、剩下的”，而王朝纪事套语中的 דִּבְרֵי 泛指君王的事迹或相关事项；译作“其余的事”既贴近原文，又符合现代汉语表达。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所做的一切
  rationale: 保留关系从句的宽泛含义，不限定这些行为的性质。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……吗
  rationale: 以自然的汉语反问句保留 הֲלֹא 的修辞疑问语气；“记在”准确传达书面记录这一语境。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大诸王纪事》
  rationale: דִּבְרֵי הַיָּמִים 在档案语境中指按时日记录的纪事；“纪事”既自然，也避免让读者误以为这里必然指正典《历代志》。
- source_word: יְהוֹיָקִים
  choice: 约雅敬
  rationale: 采用现代中文圣经传统中通行的人名译法。
theological_decisions:
- issue: 所引文献是否就是正典《历代志》
  choice: 正文译为《犹大诸王纪事》，脚注说明其为王室记录文献，未必是正典《历代志》
  alternative: 直接译为《犹大诸王历代志》而不加说明
  rationale: 原文只给出该文献的档案性名称，不能据此断定它与现存正典《历代志》相同；译文应保留这种历史文献身份上的开放性。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留原文的反问结构；不添加原文没有的时间或篇章标记。脚注标记置于其实际说明的文献名称之后。
