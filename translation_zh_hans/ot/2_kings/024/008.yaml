base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: zh_hans
  text: 约雅斤登基时十八岁，在耶路撒冷作王三个月。他母亲名叫尼护施她，是耶路撒冷人以利拿单的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: 十八岁
  rationale: 这是希伯来语表达年龄的惯用语；采用自然的现代汉语说法。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 介词 בְּ 加不定式结构表示约雅斤开始作王的时间；“登基时”简洁自然，也符合君王纪年的语境。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词意为“作王、统治”；“作王”保留了列王纪登基公式的庄重语体。
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: 三个月
  rationale: 在作王的语境中明确表示在位时长，无须另加“共”或“长达”。
- source_word: בִּירוּשָׁלָם
  choice: 在耶路撒冷
  rationale: 忠实表达地点介词及城名。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 以自然、庄重的现代汉语再现常见的母系身份介绍公式。
- source_word: נְחֻשְׁתָּא
  choice: 尼护施她
  rationale: 采用中文圣经传统中通行且易辨认的人名译法。
- source_word: בַת אֶלְנָתָן
  choice: 是以利拿单的女儿
  rationale: 准确表达希伯来语附属结构所指的父女关系。
- source_word: מִירוּשָׁלָם
  choice: 来自耶路撒冷
  rationale: מִן 的基本意义是来源；按原文次序直译，同时以脚注保留它可能修饰以利拿单的句法理解。
