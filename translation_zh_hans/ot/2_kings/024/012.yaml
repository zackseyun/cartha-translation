base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: zh_hans
  text: 犹大王约雅斤和他的母亲、臣仆、官长、宦官[a]一同出去见巴比伦王。巴比伦王在位第八年，把约雅斤带走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “宦官”一词也可泛指王宫里的官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא ... עַל מֶלֶךְ בָּבֶל
  choice: 出去见巴比伦王
  rationale: יצא的基本义是“出去”，在围城语境中表示约雅斤出去到巴比伦王那里；译作“出去见”既符合现代汉语，也不直接把隐含行动解释为“投降”。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: עבד可指仆人或王室臣属；“臣仆”适合宫廷语境，同时保留较宽泛的含义。
- source_word: שָׂרָיו
  choice: 官长
  rationale: שׂרים指有地位的领袖或官员；“官长”与后面的סָרִיס区分开来，又不局限为军事将领。
- source_word: סָרִיסָיו
  choice: 宦官
  rationale: סָרִיס可指受阉割的宦官，也可泛指宫廷官员；正文采用较直接的传统词义，并以脚注保留较宽泛的职务含义。
- source_word: וַיִּקַּח אֹתוֹ
  choice: 拿住了约雅斤
  rationale: לקח基本义为“拿、取”；“拿住”在此表达巴比伦王将他置于控制之下，而没有强化为原文未明说的“俘虏”。为避免汉语代词指向不清，重述“约雅斤”。
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: 巴比伦王在位第八年
  rationale: 附属代词最自然地回指紧邻的“巴比伦王”，且符合本章年代框架；汉语明确补出所指，以免误解为约雅斤在位第八年。
theological_decisions:
- issue: 末句“他在位第八年”所指
  choice: 巴比伦王在位第八年
  alternative: 约雅斤在位第八年
  rationale: 句法上最近的阳性单数先行词是巴比伦王，列王纪下24章的历史年代框架也支持这一理解；这是历史语法判断，不涉及宗派性解释。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。把同行者并入主句，避免照搬希伯来语复指结构造成汉语拖沓；保留“出去”而不直接译成“投降”，并用“一同”清楚表达全组同行。
