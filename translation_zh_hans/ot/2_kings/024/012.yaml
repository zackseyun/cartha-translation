  terminology: “犹大王”“约雅斤”“巴比伦王”“臣仆”“官长”均适当。“宦官”可作为סָרִיס的直接译法，保留说明其亦可泛指王宫官员的脚注即可；不应在正文中把该词与前面的“官长”混同。
