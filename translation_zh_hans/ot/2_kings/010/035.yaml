  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: zh_hans
  text: 耶户与他的列祖同眠，人们把他葬在撒马利亚。他儿子约哈斯接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与他的列祖同眠
  rationale: 这是王朝记事中表示死亡的固定委婉语。“与他的列祖同眠”既保留希伯来语的意象和礼庄语气，也能让现代汉语读者从上下文理解其死亡含义；“列祖”比泛化的“祖先”更能体现这一传统王室公式。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 人们把他葬在
  rationale: 原文是第三人称复数主动式，但没有说明施事者。译作“人们把他葬在”保留主动表达，同时不擅自指定安葬者。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 介词 בְּ 在此表示地点；“在撒马利亚”是自然准确的现代汉语表达。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位继承公式中，此词指登上王位。结合“接替他”，译作“作王”自然地表达即位，而非概述整个统治时期。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该词组表示继承其职位或位置。“接替他”在现代汉语中清楚表达王位承继关系。
- source_word: יֵהוּא
  choice: 耶户
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: יְהוֹאָחָז
  choice: 约哈斯
  rationale: 采用现代中文圣经传统中通行的人名译法。
