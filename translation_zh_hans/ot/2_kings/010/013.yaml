base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: zh_hans
  text: 耶户遇见犹大王亚哈谢的弟兄[a]，就问：“你们是什么人？”他们回答：“我们是亚哈谢的弟兄。我们下来，是要探问王的众子和太后的众子是否平安[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “弟兄”在这里也可能泛指亚哈谢的近亲或同族亲属，不一定只指亲兄弟。
    reason: lexical_alternative
  - marker: b
    text: “太后”所译的希伯来语是王室宫廷称号，指君王的母亲。
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: 遇见
  rationale: 此处指耶户碰见或遇上这些人；“遇见”比直译为“找到”更符合现代汉语叙事，同时保留偶遇或发现的语意空间。
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: 亚哈谢的弟兄
  rationale: 保留希伯来文的亲属称谓“弟兄”；在王室叙事中也可能泛指近亲，因此以脚注说明较宽的可能含义。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 简洁、自然地表达亚哈谢的王室头衔。
- source_word: מִי אַתֶּם
  choice: 你们是什么人？
  rationale: 现代汉语中询问一群人身份的自然说法，比“你们是谁”更贴合此处盘问身份的语境。
- source_word: וַנֵּרֶד
  choice: 我们下来
  rationale: 保留原文表示下行的地理动作，也符合说话者从出发地来到此处的视角。
- source_word: לִשְׁלוֹם
  choice: 向……问安
  rationale: 该表达在此指探问对方是否安好；“问安”简洁地保留了问候与探询平安两层语意。
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 保留原文明确的复数“儿子”，不用较宽泛的“儿女”或“孩子”；“众子”适合庄重的历史叙事语体。
- source_word: הַגְּבִירָה
  choice: 太后
  rationale: 在犹大王室语境中，这是指王母的宫廷称号；“太后”是简体中文读者最易理解的对应称谓。
- source_word: וּבְנֵי הַגְּבִירָה
  choice: 太后的众子
  rationale: 维持与“王的众子”的平行结构，不擅自消除两组称谓在所指对象上可能存在的重叠。
