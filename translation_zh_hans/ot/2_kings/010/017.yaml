base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: zh_hans
  text: 他来到撒马利亚，就击杀了亚哈在撒马利亚所剩下的人全都，直到把亚哈家灭尽[a]；这是照着雅威对以利亚所说的话。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “把亚哈家灭尽”：原文宾语为阳性单数，直译为“把他灭尽”。该单数可能集合性地指亚哈家，或指亚哈及与他相关者作为整体；正文按上下文译为“亚哈家”。
    reason: 保留原文单数宾语后缀的形式，并避免将其所指的集合性解释表述为无争议结论。
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: 他来到撒马利亚
  rationale: 叙事性连续式推动情节；现代汉语用“来到”自然表达抵达该地，不必机械保留句首的“于是”。
- source_word: וַיַּךְ
  choice: 击杀了
  rationale: נכה在此指致命打击；“击杀”既明确死亡结果，也保留叙事的庄重和暴力色彩。
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: 亚哈……所有剩下的人
  rationale: לְאַחְאָב表示与亚哈的归属或关联；此处指亚哈一方或亚哈家系中尚存的人。“剩下的人”忠实呈现שׁאר，又不额外赋予“余民”的神学含义。
- source_word: עַד הִשְׁמִידוֹ
  choice: 直到将亚哈家彻底灭尽
  rationale: שׁמד表示毁灭、灭尽；单数宾语后缀直译为“他”，但语境中集合性地指亚哈及其家系。正文采用自然且语境明确的“亚哈家”，并以脚注保留原文形式。
- source_word: כִּדְבַר יְהוָה
  choice: 正如雅威……所说的话
  rationale: כִּדְבַר表示事件依照先前的神谕而成就；“所说的话”在现代汉语中自然，并保留“话语”的先知性关联。
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: 对以利亚所说的话
  rationale: 介词אֶל通常表示言说所指向的对象，因此译为“对以利亚”，不改写为含义不同的“借以利亚”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较贴近现今学界对其读音的通行重构，也明确保留专名性质。
- issue: הִשְׁמִידוֹ中单数宾语所指
  choice: 正文译作“亚哈家”，脚注说明其集合性
  alternative: 直译为“把他灭尽”或按近义复数译为“把他们灭尽”
  rationale: “把他灭尽”在汉语中容易误指早已死去的亚哈本人；“把他们灭尽”则抹平希伯来文的单数形式。以“亚哈家”表达语境中的集合指称，同时用脚注保存形式上的张力。
translation_notes:
  register: 采用现代、庄重而清晰的叙事语体。“击杀”“彻底灭尽”准确传达原文的暴力与终结性；保留两次“撒马利亚”，对应希伯来文的重复，并避免不必要的修辞润饰。
