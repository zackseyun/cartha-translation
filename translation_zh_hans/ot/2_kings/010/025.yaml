  - severity: medium
    issue: “内殿”对עִיר作了偏确定且偏狭的建筑解释。
    rationale: עִיר的通常义为“城”，此处可能指庙宇建筑群的内层、防卫区或圣域，但具体所指不确定。“内区”较中性，脚注应保留字面“城／城堡”及各可能解释。
