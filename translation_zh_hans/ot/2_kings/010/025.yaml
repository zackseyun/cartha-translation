base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: zh_hans
  text: 他献完燔祭后，耶户对护卫和军官说：“进去，击杀他们！一个也不许出来！”他们就用刀刃击杀了他们。护卫和军官把他们扔出去，随后进入巴力庙的内区[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“直到巴力庙的城（或城堡）”。这里可能指庙宇建筑群中有防护的内区，或内部的圣域；具体所指并不确定。
    reason: 原文עִיר通常意为“城”，在此处的具体建筑含义有争议。脚注保留字面意义及可能解释，避免将“内区”视为唯一确定的理解。
lexical_decisions:
- source_word: כְּכַלֹּתוֹ
  choice: 他献完……以后
  rationale: כְּ加不定式结构表达先后时间关系；“献完……以后”自然呈现献祭结束后随即下令的叙事顺序，同时保留阳性单数后缀所指的“他”。
- source_word: לַעֲשׂוֹת הָעֹלָה
  choice: 献完燔祭
  rationale: עָשָׂה与עֹלָה连用是献祭用语；“献燔祭”是现代汉语中准确、简明的礼仪表达。
- source_word: לָרָצִים
  choice: 护卫
  rationale: רָצִים字面为“奔跑者”，在王室语境中常指随侍君王、执行命令的卫士；此处他们奉命进入并杀人，“护卫”比直译“跑者”更清楚。
- source_word: לַשָּׁלִשִׁים
  choice: 军官
  rationale: שָׁלִישׁ可指高级随从、战车军官或其他军职人员；“军官”保留其军事身份而不武断限定具体军阶。
- source_word: בֹּאוּ
  choice: 进去
  rationale: בוא基本义为“来、进入”；按耶户命执行者进入庙宇范围的场景译作“进去”，符合现代汉语的空间视角。
- source_word: הַכּוּם
  choice: 把他们杀倒
  rationale: נכה本义为击打，在本处明确指致命攻击；“杀倒”既表达结果，也保留“击倒”的动作力度。
- source_word: אִישׁ אַל יֵצֵא
  choice: 一个也不许出来
  rationale: 单数אִישׁ配否定祈使具有逐一、无一例外的分配意义；此译自然表达禁令的绝对性。
- source_word: לְפִי חָרֶב
  choice: 用刀刃
  rationale: 该习语字面为“用刀剑之口”，指刀剑锋刃；“用刀刃”保留原文形象，又符合汉语表达。
- source_word: וַיַּשְׁלִכוּ
  choice: 把他们扔出去
  rationale: שׁלך意为投掷、抛出。原文未明说宾语，但上下文自然承接被杀的人；“他们”保留这种语境指向，不额外明说“尸体”。
- source_word: עַד עִיר בֵּית הַבָּעַל
  choice: 一直进到巴力庙的内殿
  rationale: עִיר通常意为“城”，但在此建筑语境中可能指庙宇建筑群内受防护或更内层的区域；结合下一节继续深入庙内的动作，“内殿”给普通读者较清楚的空间意义，字面和其他可能含义则收入脚注。
