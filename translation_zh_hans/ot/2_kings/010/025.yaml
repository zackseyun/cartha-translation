revisions:
- from: 他献完燔祭以后，耶户对护卫和军官说：“进去，把他们杀倒，一个也不许出来！”他们就用刀刃杀了众人。护卫和军官把他们扔出去，又一直进到巴力庙的内殿[a]。
  to: 他献完燔祭后，耶户对护卫和军官说：“进去，击杀他们！一个也不许出来！”他们就用刀刃击杀了他们。护卫和军官把他们扔出去，随后进入巴力庙的内区[a]。
  rationale: 修订以“击杀”替换不自然的“杀倒”，并在叙述句中保留原文的代词宾语“他们”，不额外具体化为“众人”。末句将较确定的“内殿”调整为中性的“内区”，同时以脚注保存原文“城／城堡”的字面及其可能指向。
  reviewer_model: gpt-5.6-terra
