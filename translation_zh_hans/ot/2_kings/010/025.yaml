translation_notes:
  register: 采用庄重而易懂的现代标准汉语。命令句简洁有力；“燔祭”保留既有的圣经祭祀术语。对末句罕见且含义有争议的建筑用语，在正文中按语境译为“内殿”，并以脚注明确保存原文的字面形式及歧义。
