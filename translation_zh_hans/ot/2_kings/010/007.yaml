  rationale: 修订避免“抓来”所附加的拘捕含义，以“带来”对应原文“取／带”的叙事动作；调整时间从句和末句语序，使现代汉语自然通顺。“送往耶斯列给他”保留原文对耶户的代词指称及朝耶斯列的方向。保留“筐子”及其词义不确定性的脚注。
