base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: zh_hans
  text: 信送到他们那里以后，他们就把王的众子带来，宰杀了七十人；又把他们的首级放在筐子[a]里，送往耶斯列给他。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“锅里”或“坛子里”。希伯来语这个词指容器，不能确定是编织的筐子。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: 信
  rationale: 上下文指耶户先前送出的书面通信；现代汉语用“信”自然明确。
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: 王的众子
  rationale: 保留原文的亲属及王朝含义；“众子”也与随后“七十人”的复数群体相称。
- source_word: וַיִּשְׁחֲטוּ
  choice: 宰杀
  rationale: שׁחט 比一般的“杀死”更具屠杀色彩；“宰杀”保留这场暴行的强烈程度，而不加添原文没有的评价。
- source_word: שִׁבְעִים אִישׁ
  choice: 七十人
  rationale: אִישׁ 在此用于计数这些男性；汉语“七十人”自然，并由“王的众子”清楚限定其身份与性别。
- source_word: רָאשֵׁיהֶם
  choice: 他们的首级
  rationale: 这里明确指被砍下的头；“首级”比一般的“头”更准确地传达语境，且符合庄重叙事语体。
- source_word: בַּדּוּדִים
  choice: 装在筐子里
  rationale: דּוּדִים 泛指某类容器，具体材质和形制不能确定；正文采用传统且合乎搬运场景的“筐子”，脚注保留“锅”或“坛子”等可能。
- source_word: אֵלָיו
  choice: 送到……他那里
  rationale: 保留原文代词，不直接补出“耶户”；用汉语目的地结构表达送到他所在之处。
- source_word: יִזְרְעֶאלָה
  choice: 耶斯列
  rationale: 词尾方向性־ה表示朝向耶斯列；在“送到耶斯列他那里”中，目的方向已自然体现。
