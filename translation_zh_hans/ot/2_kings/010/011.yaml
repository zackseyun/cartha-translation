base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: zh_hans
  text: 于是，耶户击杀了在耶斯列亚哈家所有剩下的人，也杀了亚哈所有的显要人物[a]、亲信[b]和祭司，以致耶户没有给他留下一个幸存者。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “显要人物”也可译作“贵族”或“权贵”。
    reason: lexical_alternative
  - marker: b
    text: “亲信”也可译作“熟识的人”或“亲近的人”。
    reason: lexical_alternative
  - marker: c
    text: 直译是“以致他没有给他留下幸存者”；后一个“他”可指亚哈，也可指亚哈家。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: 击杀了
  rationale: 此处 נכה 指致命攻击；“击杀”既保留动作力度，也清楚表达这些人被杀。
- source_word: הַנִּשְׁאָרִים לְבֵית אַחְאָב
  choice: 亚哈家……所有剩下的人
  rationale: 保留 שׁאר 所表达的“仍然留下、尚存”之意，并以自然汉语呈现其王朝归属。
- source_word: בְּיִזְרְעֶאל
  choice: 在耶斯列
  rationale: 按地点用法直译，表明这些亚哈家余众所在之处。
- source_word: גְּדֹלָיו
  choice: 他的显要人物
  rationale: 该词指亚哈身边具有社会或政治地位的人；“显要人物”比直译“大人物”更庄重自然，同时不把范围限定为世袭贵族。
- source_word: מְיֻדָּעָיו
  choice: 他的亲信
  rationale: 该词本义涉及“为他所认识的人”，在此政治清洗的语境中很可能指关系亲近的随从或同党；“亲信”自然简洁，脚注保留较字面的可能译法。
- source_word: כֹהֲנָיו
  choice: 他的祭司
  rationale: 按希伯来文普通含义直译，不进一步限定其具体宗教职分或机构归属。
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: 直到没有给他留下一个幸存者
  rationale: 保留原文的结果结构、单数代词“他”和“幸存者”这一余民用语，表达彻底剪除之意而不明说代词所指。
theological_decisions:
- issue: 结尾 לוֹ（“给他”）所指为何
  choice: 正文保留单数“他”
  alternative: 明确译作“亚哈”或将亚哈家视为整体而译作“这个家族”
  rationale: 希伯来文代词表达紧缩，可能指亚哈本人，也可能以亚哈代表其王室家族。保留“他”并用脚注说明，可避免在正文中消除原有的指代张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“击杀”“显要人物”“幸存者”保持历史叙事的力度；正文不擅自确定结尾代词的具体所指。
