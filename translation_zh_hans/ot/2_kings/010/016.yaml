base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: zh_hans
  text: 于是耶户说：“你跟我来，看看我对雅威的热心[a]。”他们便让约拿达坐上耶户的战车。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“嫉妒”。希伯来词可指热心，也可指嫉妒；本处语境指耶户所宣称的对雅威的热心。
    reason: 保留קִנְאָה在“热心”与“嫉妒”之间的词义范围，同时不把对耶户动机的评价加入正文。
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: 你跟我来
  rationale: לְכָה是הלך的命令式，在这里用作邀请或召唤；与אִתִּי合译为自然直接的现代汉语“你跟我来”。
- source_word: וּרְאֵה
  choice: 看看
  rationale: 保留ראה命令式的直接性；“看看”符合汉语口语中的邀请语气，又不增添“亲眼见证”等解释性含义。
- source_word: בְּקִנְאָתִי
  choice: 我……所发的热心
  rationale: קִנְאָה既可表示“热心、热忱”，也可表示“嫉妒、妒爱”。本处描述耶户自称对雅威的强烈忠诚，以“热心”为正文最自然，同时用脚注保留词义张力。
- source_word: לַיהוָה
  choice: 为雅威
  rationale: 介词ל־标明热心所指向的对象；יהוה作为上帝的盟约之名，音译为“雅威”。
- source_word: וַיַּרְכִּיבוּ אֹתוֹ בְּרִכְבּוֹ
  choice: 众人便让约拿达坐上耶户的战车
  rationale: רכב的使役形表达“使某人乘坐”。希伯来文以复数主语和代词表达参与者；依紧接的上文明确为“众人、约拿达、耶户”，使现代汉语清楚自然，而不改变事件关系。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名יהוה；正文以“雅威”保留其作为专名的性质，不以称号替代。
- issue: קִנְאָה在耶户自我陈述中的含义
  choice: 正文译“热心”，脚注保留“妒爱”的可能
  alternative: 嫉妒；妒爱
  rationale: 语境首先指耶户宣称自己为雅威大发热忱，但该词本身兼有嫉妒或排他性妒爱的色彩；正文不预先判断耶户动机是否纯正，脚注则保留原词的语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“你跟我来，看看……”保留直接引语的力度；末句按上文明确代词所指，避免现代汉语连续使用“他／他的”造成歧义。
