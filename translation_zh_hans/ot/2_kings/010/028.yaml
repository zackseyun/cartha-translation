base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/028.yaml
  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: zh_hans
  text: 这样，耶户把巴力从以色列除灭了[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“消灭”“清除”。希伯来语动词表示使之毁灭或被除去。
    reason: lexical_alternative
  - marker: b
    text: 原文作“那巴力”；这里的“巴力”也可在上下文中理解为以巴力及其崇拜为整体。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: 除灭
  rationale: שׁמד 的使役形表达使之毁灭、将其消除；“除灭”既保留动词的强烈力度，也自然地与表示分离的“从以色列”搭配。
- source_word: יֵהוּא
  choice: 耶户
  rationale: 采用现代中文圣经中通行的人名音译。
- source_word: הַבַּעַל
  choice: 巴力
  rationale: 原文带定冠词，直译可作“那巴力”；但现代汉语称这位神祇通常不加指示成分。“巴力”保留原文对象，不解释性地扩写为“巴力崇拜”。
- source_word: מִיִּשְׂרָאֵל
  choice: 从以色列
  rationale: 介词 מִן 表示分离或移除；“从以色列”直接保留这一空间及群体关系。
- source_word: וַ
  choice: 这样
  rationale: 句首连接成分推进叙事，并在上下文中带有结果或总结意味；“这样”自然呈现该承接关系。
theological_decisions:
- issue: “巴力”的所指
  choice: 按神祇之名译作“巴力”，由上下文表明这也涉及清除其崇拜
  alternative: 译作“巴力崇拜”或“对巴力的崇拜”
  rationale: 希伯来文直接宾语是“巴力”，并未明说“崇拜”；正文不作解释性扩写，以保留原文简洁而带转喻可能的表达。
- issue: 除灭程度
  choice: 采用力度较强但不额外断言永久、绝对根除的“除灭”
  alternative: “彻底根除”或较弱的“除去”
  rationale: 使役形动词具有毁灭、消除的力度，但本节本身不要求加入“彻底”或“永久”等限定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“除灭”保留原文力度；正文简洁，脚注交代定冠词及“巴力”可能具有的转喻范围。
