  to: 耶户和利甲的儿子约拿达进了巴力庙[a]。耶户对敬拜巴力的人说：“你们务要搜查察看，免得你们中间有耶和华的仆人；只准有敬拜巴力的人。”
  rationale: 修订避免把防范性的“免得有”具体化为“混有”，以保留原文的表达限度；同时以自然的现代汉语重现搜查、警戒和排他命令。脚注更完整地交代“巴力庙”所依据的字面表达。
