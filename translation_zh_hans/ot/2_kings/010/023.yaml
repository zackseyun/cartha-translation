base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: zh_hans
  text: 耶户和利甲的儿子约拿达进了巴力庙[a]。耶户对敬拜巴力的人说：“你们务要搜查察看，免得你们中间有耶和华的仆人；只准有敬拜巴力的人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴力庙”原文直译为“巴力的房屋”或“巴力的殿”。
    reason: 原文的“房屋”在此指供奉巴力的宗教建筑；正文采用自然的语境译法。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 进了
  rationale: בוא在以建筑物为目的地时表示进入；“进了”自然、简洁。
- source_word: בֵּית הַבָּעַל
  choice: 巴力庙
  rationale: 字面为“巴力的殿／房屋”，语境明确指供奉巴力的宗教建筑；正文用现代汉语常用的“庙”，脚注保留字面形式。
- source_word: עֹבְדֵי הַבַּעַל
  choice: 敬拜巴力的人
  rationale: עבד可指服侍者，也可在宗教语境中指敬拜者；此处是聚集在巴力庙中的信众，译为“敬拜巴力的人”最清楚。
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: 仔细搜查，看看
  rationale: 保留两个命令动词所表达的搜查与核实；加入“仔细”使现代汉语表达顺畅，也体现警戒意味。
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: 看看你们中间是否混有
  rationale: פֶּן表达防范某种不应发生的情况；“是否混有”自然呈现有人潜藏其中的语境，同时不把它弱化为普通询问。
- source_word: מֵעַבְדֵי יְהוָה
  choice: 耶和华的仆人
  rationale: 这里的עבד是常见的归属于耶和华之人的称谓；用“仆人”保留其较宽泛含义，并与对巴力的宗教敬拜用语有所区别。
- source_word: כִּי אִם ... לְבַדָּם
  choice: 必须只有
  rationale: 该排除结构强调在场者不得有例外；“必须只有”在命令语境中清楚表达排他性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 采用现代中文圣经读者最熟悉的专名形式“耶和华”，在本节中清楚保留以色列之神与巴力之间的对比，而不以泛称“主”替代。
- issue: עבד用于耶和华与巴力时是否统一译法
  choice: 分别译为“仆人”和“敬拜……的人”
  alternative: 两处都译为“仆人／服侍者”
  rationale: 同一词根在两处都含效忠、服侍之意，但巴力一方的具体语境明显是宗教礼拜者，而“耶和华的仆人”是较宽泛且固定的身份称谓；按语境分别处理，既保留张力，也避免误以为仅指庙役。
- issue: 说话者וַיֹּאמֶר的指代
  choice: 明确为“耶户”
  alternative: 译作“他”
  rationale: 希伯来文用阳性单数“他说”，在两个男性人物之后形式上可能产生短暂歧义；上下文表明命令的发出者是行动主导者耶户。中文直称姓名可避免不必要的指代含混。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“仔细搜查”“是否混有”“必须只有”使命令与防范语气清晰；人名采用通行译名“耶户、约拿达、利甲”。
