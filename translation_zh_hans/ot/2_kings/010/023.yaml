    rationale: פֶּן יֶשׁ表达的是“免得有／唯恐有”的防范，并未描述耶和华的仆人如何在场。
  - severity: low
    issue: “这里必须只有”不够自然，且“必须”略强化原文的排他陈述。
    rationale: כִּי אִם…לְבַדָּם要求场内仅有巴力的敬拜者；“只准有”在直接命令中更自然地表达这一限制。
  - severity: low
    issue: 脚注把“巴力庙”的字面表达仅写作“巴力的殿”。
    rationale: בֵּית字面为“房屋／家”，在此语境指宗教建筑；脚注宜同时交代“巴力的房屋（殿）”。
