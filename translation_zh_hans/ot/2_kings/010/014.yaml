  text: וַ/יֹּ֨אמֶר֙ תִּפְשׂ֣וּ/ם חַיִּ֔ים וַֽ/יִּתְפְּשׂ֖וּ/ם חַיִּ֑ים וַֽ/יִּשְׁחָט֞וּ/ם אֶל בּ֣וֹר בֵּֽית עֵ֗קֶד אַרְבָּעִ֤ים וּ/שְׁנַ֨יִם֙ אִ֔ישׁ וְ/לֹֽא הִשְׁאִ֥יר אִ֖ישׁ מֵ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: zh_hans
  text: 耶户说：“把他们活捉起来。”众人就活捉了他们，并在伯·伊基得的坑旁[a][b]把他们全都宰杀了，共四十二人；耶户一个也没有留下[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坑旁”也可译作“坑边”或“坑里”。这里的希伯来语介词可以表达不止一种空间关系。
    reason: lexical_alternative
  - marker: b
    text: “伯·伊基得”是地名；其希伯来语名称可能含有“捆绑之处”或“聚集之处”等意思，但这里作为专名使用。
    reason: cultural_note
  - marker: c
    text: 希伯来文直译为“他没有留下他们中的一个人”，强调无人幸存。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: 把他们……捉起来
  rationale: תפשׂ在此指奉命抓住一群人；“捉起来”自然表达扣押之意，并与“活”搭配为“活捉”。
- source_word: חַיִּים
  choice: 活捉／活捉了
  rationale: חַיִּים在两处均作方式性补语，强调先活着抓住，而非当场杀死；现代汉语以“活捉”最简洁自然。
- source_word: וַיִּשְׁחָטוּם
  choice: 把他们全都宰杀了
  rationale: שׁחט比一般的“杀死”具体而强烈，常指宰杀；此译保留叙事中的残酷力度。“全都”结合后句表达对象无一幸免，并不改变动作本身。
- source_word: אֶל־בּוֹר
  choice: 在……坑旁
  rationale: 介词אֶל通常有“向、到”之意，但此处与处决地点连用，可指在坑边、坑旁或投入坑中；正文采用自然且不过度限定动作方向的“在……坑旁”，脚注保留其他可能。
- source_word: בֵּית עֵקֶד
  choice: 伯·伊基得
  rationale: 这是地名，采用音译，不把可能的词源含义直接写入正文，以免将不确定的名称解释当作明义。
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: 共四十二人
  rationale: 数词后接אִישׁ，指四十二名男性；汉语叙述中“共四十二人”自然，并由上下文清楚指向前述男子群体。
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: 耶户一个也没有留下
  rationale: 单数动词的主语承接耶户，故明确译出“耶户”，避免误解为执行者；“一个也没有留下”保留彻底无人幸存的强调。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。“宰杀”保留原文שׁחט的强烈色彩，不用较弱的“杀死”。正文重复“活捉”以对应原文的刻意复现。明确以“耶户”为末句主语，使中文指代清楚，同时忠实于希伯来文单数动词。脚注标记均置于相关正文之后。
