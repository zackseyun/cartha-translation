base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: zh_hans
  text: 他们进去献祭和燔祭。耶户在外面布置了八十人，对他们说：“我交在你们手里的这些人中，若有一人逃脱，放他逃脱的人必以自己的性命偿那逃脱者的性命。”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“他的性命代替他的性命”；按上下文，前一个“他的”指放人逃脱者，后一个指逃脱者。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 他们进去
  rationale: בוא在叙事中可表示来、去或进入；这里指进入殿内献祭，译作“进去”自然且符合场景。
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: 献祭和平安祭，并献燔祭
  rationale: עשה与祭物连用时表示献上；זְבָחִים通常指宰杀后共享祭肉的一类祭，现代中文可译“平安祭”，而עֹלוֹת指全然焚烧的祭，译作“燔祭”。“献祭和平安祭”中的首个“祭”会造成重复，故正文实际采用“献祭和平安祭”并不理想；更准确应理解为“献平安祭和燔祭”。
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: 耶户在外面部署了八十人
  rationale: שׂים本义为安置；此处八十人负责警戒，译作“部署”符合语境。לוֹ表示此安排由耶户为自己的计划而作，在中文中不必生硬直译。
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: 若有人让其中一个逃走
  rationale: 希伯来文形式上是“那人，从这些人中有人逃脱”，责任关系由语境表达；中文明确为守卫“让”人逃走，保留警告的实际含义。
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: 我交在你们手里的这些人
  rationale: “带到你们手上”是交在某人控制之下的惯用表达，中文用“交在你们手里”既保留意象又清楚自然。
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: 就要以他的命偿那人的命
  rationale: נפש在此指性命；תחת表达替代或偿还关系。分别用“他的”指失职者、“那人的”指逃脱者，消除两个同形代词在中文中的歧义。
