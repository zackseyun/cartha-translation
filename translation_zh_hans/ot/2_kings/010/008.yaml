  to: 有报信的人来禀告他，说：“他们把王的儿子们的首级送来了。”他说：“把首级堆成两堆[a]，放在城门口，直到早晨。”
  rationale: 修订“王众子”为自然现代的“王的儿子们”，并将“分成两堆”改为“堆成两堆”，以避免添加原文未明说的分配动作；其余内容、语气、地点和时间限定均予保留。
