base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: zh_hans
  text: 有报信的人来禀告他，说：“他们把王的儿子们的首级送来了。”他说：“把首级堆成两堆[a]，放在城门口，直到早晨。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“两垛”。
    reason: 词语 צִבֻּרִים 可指堆或垛；正文采用较自然、通用的“两堆”。
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: 报信的人
  rationale: 这里指传递消息的人，而非超自然的天使；“报信的人”符合叙事语境，也能避免误解。
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: 来告诉他说
  rationale: 保留希伯来叙事中“告诉……说”的表达，同时采用现代汉语可自然理解的句式。
- source_word: הֵבִיאוּ
  choice: 他们把……送来了
  rationale: 该完成式表示行动已经完成，且其结果当前已经呈现；“送来了”准确传达首级已被带到此处。
- source_word: רָאשֵׁי
  choice: 首级
  rationale: 上下文明确指被砍下的头；“首级”在现代汉语中庄重而清楚，适合这一叙事场景。
- source_word: בְנֵי הַמֶּלֶךְ
  choice: 王众子
  rationale: 保留“王的儿子们”这一构词关系和复数含义；“众子”简洁、庄重，且不扩大为性别不明的“儿女”。
- source_word: שִׂימוּ אֹתָם
  choice: 把首级……放在
  rationale: 原文代词所指是首级；汉语中重述“首级”比单用“它们”更清楚自然。
- source_word: שְׁנֵי צִבֻּרִים
  choice: 分成两堆
  rationale: צִבֻּרִים 指堆积而成的堆；“分成两堆”自然表达把这些首级摆放为两堆的命令。
- source_word: פֶּתַח הַשַּׁעַר
  choice: 在城门口
  rationale: 该短语指城门入口处；在这一历史叙事语境中，“城门口”是准确、自然的现代汉语表达。
- source_word: עַד הַבֹּקֶר
  choice: 直到早晨
  rationale: 准确表达持续至次日早晨的时间界限。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而清楚的叙事语言。“报信的人”避免把人间使者误读为天使；“首级”明确但不过度渲染暴力。脚注标记置于其实际对应的“两堆”之后。
