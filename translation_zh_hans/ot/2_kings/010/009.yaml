base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: zh_hans
  text: 到了早晨，耶户出来，站在那里，对众百姓说：“你们是无罪的[a]。看，我曾密谋反对我的主人，并杀了他；可是这些人全是谁杀的呢？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“你们是公义的”或“你们是有理的”。这里的希伯来语既可表示公义，也可表示没有罪责；按公开申辩、判定责任的语境，译作“无罪的”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: 到了早晨
  rationale: 以自然的现代汉语表达希伯来叙事推进公式；不机械译出“事情发生了”，同时保留时间转换。
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: 出来，站在那里
  rationale: 保留两个连续动作；“站在那里”自然呈现耶户公开站立发言的场景，又不额外加入“站定”等解释。
- source_word: כָּל הָעָם
  choice: 众百姓
  rationale: 准确表达面向全体民众的公开讲话，语体庄重而通俗。
- source_word: צַדִּקִים אַתֶּם
  choice: 你们是无罪的
  rationale: צַדִּיק 在此公开申辩、归责的语境中具有司法性的“无罪、无可归咎”之意；脚注保留“公义／有理”的词义可能。
- source_word: הִנֵּה
  choice: 看
  rationale: 用现代汉语的注意提示词表达强调，比“看哪”更自然，又保留话语力度。
- source_word: קָשַׁרְתִּי עַל
  choice: 我背叛了
  rationale: 该结构指针对君主的结党谋反或密谋；“背叛”在此语境简洁自然，但“密谋反对”也是较形式对应的译法。
- source_word: אֲדֹנִי
  choice: 我的主人
  rationale: 指耶户原先效忠的君王，而非神圣称号；“主人”保留从属关系并避免与“主”混淆。
- source_word: וָאֶהְרְגֵהוּ
  choice: 把他杀了
  rationale: 直截了当地表达 הרג 及其第三人称男性单数宾语，符合现代汉语口吻。
- source_word: וּמִי הִכָּה אֶת כָּל אֵלֶּה
  choice: 可是这一切人是谁杀的呢
  rationale: 上下文表明 נכה 是致死性的击杀，“杀”比“击打”准确自然；וּ 按修辞对比译为“可是”。原文“这一切”略含开放性，中文为避免把人误解为事物而补出“人”。
theological_decisions:
- issue: צַדִּקִים 的司法性与道德性含义
  choice: 正文译作“无罪的”
  alternative: “公义的”或“有理的”
  rationale: 耶户在公开场合将亚哈众子被杀之责与百姓区分，重点是免除其罪责，而不是宣告其整体道德品格；脚注保留希伯来词较宽的语义范围。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。保留耶户话语中“我杀一人／谁杀众人”的修辞对比，不替读者判定他的陈述是否真诚。
