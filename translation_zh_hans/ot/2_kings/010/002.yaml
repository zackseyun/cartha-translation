base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: zh_hans
  text: 现在，这封信送到你们那里时[a]，你们主人的儿子们[b]在你们那里，战车、马匹、一座坚固城[c]和兵器也都在你们那里，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“这份文书一送到你们那里。”
    reason: lexical_alternative
  - marker: b
    text: “你们主人的儿子们”指收信人所侍奉之王的儿子们。
    reason: cultural_note
  - marker: c
    text: 或译：“一座设防的城”。原文所指的是一座可供收信人据守的城。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 作为话语标记，引出耶户书信中的下一步要求；“现在”自然地传达其承接和推进作用。
- source_word: כְּבֹא הַסֵּפֶר הַזֶּה
  choice: 这封信一到
  rationale: כְּ加不定式表达时间关系；סֵפֶר在王室通信语境中指书信而非书卷或书籍。“一到”符合现代汉语，并保留事情发生后随即行动的语气。
- source_word: אֲלֵיכֶם
  choice: 你们那里
  rationale: 原文为第二人称复数；汉语用“你们那里”自然表达书信送达收信群体。
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: 你们主人的众子
  rationale: אֲדֹנֵיכֶם在此是政治和臣属关系中的“主人”，并非神圣称号；“众子”保留复数及王族后裔的语境。
- source_word: הָרֶכֶב וְהַסּוּסִים
  choice: 战车、马匹
  rationale: רֶכֶב为集合意义的战车力量，סוּסִים为马匹；采用直接、清楚的军事资源用语。
- source_word: עִיר מִבְצָר
  choice: 坚固城
  rationale: 该结构指设防、可据守的城；“坚固城”简洁且符合圣经历史叙事语体，不额外断定具体城名。
- source_word: הַנָּשֶׁק
  choice: 兵器
  rationale: 此处泛指武器装备；“兵器”比“铠甲”范围更准确，也适合军事语境。
- source_word: וְאִתְּכֶם
  choice: 在你们那里
  rationale: 原文以介词短语列举收信人所拥有或可支配的人员与军事资源；译文补足汉语所需的述语，同时避免过度解释为法律意义上的所有权。
theological_decisions: []
translation_notes:
