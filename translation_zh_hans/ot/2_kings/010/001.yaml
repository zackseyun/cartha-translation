base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: zh_hans
  text: 亚哈在撒马利亚有七十个儿子。耶户写了信，把信送到撒马利亚，给耶斯列的首领[a]、长老和负责养育亚哈众子的人[b]，信上说：
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文本作“耶斯列的首领”。由于这些信是送往撒马利亚的，有人理解这是指住在那里的耶斯列相关官员；一些古译本和解释者则采用“撒马利亚的首领”。正文保留马所拉文本的读法。
    reason: textual_variant
  - marker: b
    text: “负责养育亚哈众子的人”也可译作“养父”或“照管者”。希伯来语指负责抚养或照管亚哈众子的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: 亚哈……有
  rationale: 前缀结构在这里引出背景情况，表达亚哈拥有七十个儿子；汉语直接用“亚哈……有”自然清楚，无须另加时间副词。
- source_word: שִׁבְעִים בָּנִים
  choice: 七十个儿子
  rationale: בָּנִים直指男性后代；在王位继承与王室清洗的语境中，性别含义重要。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 介词בְּ表示所在地；此处撒马利亚是这些王子居住的地方。
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: 写了信
  rationale: סְפָרִים在此指书面通信。现代汉语用“写了信”即可自然表达希伯来语复数所指的一批书信。
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: 送到撒马利亚
  rationale: 目的地是撒马利亚；所送之物承接上文的信件，汉语不必重复宾语。
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: 交给耶斯列的首领
  rationale: שָׂרֵי指掌权的官长或首领；译作“首领”兼顾其领导地位与普通读者的可懂度，并保留马所拉文本中“耶斯列”这一难解读法。
- source_word: הַזְּקֵנִים
  choice: 长老
  rationale: 这里指具有公认地位的地方领袖，并非泛指年长者。
- source_word: הָאֹמְנִים אַחְאָב
  choice: 抚养亚哈众子的监护人
  rationale: אֹמְנִים指受托养育或照管王室子弟的人。“监护人”表达其责任，“抚养”补明其具体职能；“亚哈众子”是语境中明确的关系。
- source_word: לֵאמֹר
  choice: 信上说：
  rationale: 该词引出下一节的书信内容。用“信上说”比逐字译作“说道”更符合现代汉语书信叙事。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而顺畅的叙事体。保留原文“送到撒马利亚”却“交给耶斯列的首领”这一文本张力，不在正文中擅自协调；用冒号自然衔接下一节的信件内容。
