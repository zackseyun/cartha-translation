base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: zh_hans
  text: 你们就从你们主人的众子中，选出一个最好、最正直的[a]，拥立他继承他父亲的王位，并为你们主人的王室[b]争战。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “选出”直译为“看”；这里是察看、权衡后选定的意思。也可译作“从你们主人的众子中，看看谁又好又正直”。
    reason: lexical_alternative
  - marker: b
    text: “王室”原文为“家”，这里指王族家室或王朝，不只是房屋。
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: 选出
  rationale: 该动词字面义为“看”，但在这里指经过察看、权衡后选定人选；“选出”符合上下文，也使现代汉语自然清楚。
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: 一个最好、最正直的
  rationale: 两个带定冠词的形容词在“从众子中”这一选择语境里指最合宜的人选。“最好”表达相对众人而言的优越性，“最正直”保留 יָשָׁר 的品格含义；补出“一个”以符合汉语表达。
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: 从你们主人的众子中
  rationale: 介词 מִן 表明从一群人中选择；אֲדֹנֵיכֶם 在本叙事中指人的君主，而非上帝，因此译为“你们的主人”。
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: 立他坐上他父亲的王位
  rationale: 该表达指拥立某人继承父亲为王。“立他坐上”既体现安置的动作，也清楚传达登位含义。
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: 并为你们主人的王室争战
  rationale: 介词 עַל 在此表示为……而战；בֵּית 指统治者的家室或王朝。“王室”避免误解为实体房屋，同时保留家族政权的含义。
theological_decisions:
- issue: אֲדֹנֵיכֶם 的称谓
  choice: 你们的主人
  alternative: 你们的主／你们的君王
  rationale: 此词在上下文中指亚哈王家的那位人间上级，并非耶和华；译作“主人”可避免与神圣称号“主”混淆，也保留臣属关系。
- issue: בֵּית אֲדֹנֵיכֶם 的范围
  choice: 你们主人的王室
  alternative: 你们主人的家／你们主人的王朝
  rationale: 这里既涉及统治家族，也涉及其政权。“王室”在不把含义限于建筑物的同时，避免过度断定仅指抽象的朝代。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“争战”保留历史叙事的正式色彩；句中各命令均以复数“你们”为对象。“一个”及后文的“他”依照上下文补明候选者为单数，但脚注保留希伯来语表面的表达方式。
