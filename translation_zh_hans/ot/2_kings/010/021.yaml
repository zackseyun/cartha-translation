  text: וַ/יִּשְׁלַ֤ח יֵהוּא֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֨אוּ֙ כָּל עֹבְדֵ֣י הַ/בַּ֔עַל וְ/לֹֽא נִשְׁאַ֥ר אִ֖ישׁ אֲשֶׁ֣ר לֹֽא בָ֑א וַ/יָּבֹ֨אוּ֙ בֵּ֣ית הַ/בַּ֔עַל וַ/יִּמָּלֵ֥א בֵית הַ/בַּ֖עַל פֶּ֥ה לָ/פֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: zh_hans
  text: 耶户就派人到全以色列各地传令。所有敬拜巴力的人都来了，没有一个没来。他们进了巴力庙，庙里从这头到那头都挤满了人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“口到口”，是表示整座庙从一头到另一头全都挤满的说法。
    reason: 说明希伯来语惯用语的字面形式及其语境含义。
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: 耶户就派人到全以色列各地传令
  rationale: שׁלח本义为“派遣”，与בְּכָל יִשְׂרָאֵל连用，表示行动遍及全以色列。结合上下文，所派之人是去传达召集令；译文适度补明，使现代汉语自然，同时保留覆盖全境的含义。
- source_word: עֹבְדֵי הַבַּעַל
  choice: 敬拜巴力的人
  rationale: עבד可指“服事”，在祭祀语境中指对神明的事奉和敬拜；“敬拜巴力的人”能清楚表达其宗教含义。
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: 没有一个没来
  rationale: 原文以否定套否定强调全员到场。现代汉语用“没有一个没来”简洁自然，也保留这一强调。
- source_word: וַיָּבֹאוּ בֵּית הַבַּעַל
  choice: 他们进了巴力庙
  rationale: בוא与建筑物连用时可表示“进入”。בֵּית הַבַּעַל字面是“巴力之家”，实际指供奉巴力的庙宇，译作“巴力庙”清楚而自然。
- source_word: וַיִּמָּלֵא בֵית הַבַּעַל
  choice: 庙里……都挤满了人
  rationale: מלא的Niphal形式表示“被充满、满了”。上下文所充满的是前来的人，汉语补出“人”并用“挤满”，准确呈现拥挤满员的场景。
- source_word: פֶּה לָפֶה
  choice: 从这头到那头
  rationale: 该短语字面为“口到口”，在这里是表示整个空间全部满了的惯用语。“从这头到那头”既保留空间两端的意象，也符合现代汉语表达。
theological_decisions:
- issue: אִישׁ的阳性单数代表性用法
  choice: 没有一个没来
  alternative: 没有一个男人没来
  rationale: 此处אִישׁ用于否定结构，重点是无一例外，并非特意强调性别。中文“一个”可自然指任何相关的人，也不改变关于出席者范围的陈述。
- issue: “巴力之家”的指称
  choice: 巴力庙
  alternative: 巴力之家
  rationale: 这里明确指巴力崇拜的宗教建筑。译作“庙”传达实际所指，不额外引入任何宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“传令”“敬拜”“巴力庙”均为普通读者容易理解的表达；保留原文连续推进和强调全员到场、庙内满员的节奏。
