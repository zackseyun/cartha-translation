- from: 耶户说：“要为巴力宣告举行圣会。”于是他们就宣告了。
  to: 耶户说：“要为巴力设立一次严肃会。”于是他们便宣布了这事。
  rationale: 以“设立”对应正式指定/使其成圣的命令，以“宣布”对应随后的公开宣告；“一次”使汉语事件表达自然，不改变原文所指的一次特定集会。
