  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: zh_hans
  text: 耶户说：“要为巴力设立一次严肃会。”于是他们便宣布了这事。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 说
  rationale: 叙事中的连续式推动事件发展；现代汉语无需机械译出连接词，语序已自然表达承接。
- source_word: יֵהוּא
  choice: 耶户
  rationale: 采用现代中文圣经传统中通行的人名音译。
- source_word: קַדְּשׁוּ
  choice: 宣告举行
  rationale: 该复数祈使式本义为使之分别为圣、指定为圣；与עֲצָרָה连用时可表达正式指定并召集宗教集会。译作“宣告举行”与后句“他们就宣告了”形成命令与执行的呼应，同时避免把集会本身拟人化为被祝圣之物。
- source_word: עֲצָרָה
  choice: 圣会
  rationale: 指正式的宗教集会；“圣会”简洁保留礼仪和分别为圣的色彩，比泛称“大会”更准确。
- source_word: לַבַּעַל
  choice: 为巴力
  rationale: 介词ל在此表示归属或目的，即为敬奉巴力而举行；“为巴力”在现代汉语中自然且不额外限定具体仪式。
- source_word: וַיִּקְרָאוּ
  choice: 于是他们就宣告了
  rationale: קרא在此指公开发布召集令。“宣告”体现正式公布；宾语按汉语习惯省略，由上文补足。
