  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: zh_hans
  text: 此后，耶户起身，出发往撒马利亚去；在路上，他来到牧人之伯特-埃刻[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “伯特-埃刻”可能意为“聚集之家”；也有人认为这个地名与牧人剪羊毛或捆绑有关。其确切含义不能确定，因此正文按地名音译。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起身
  rationale: קום的Qal叙事连续式常表示叙事中的下一个动作；“起身”既保留动作形象，也符合现代汉语叙事表达。
- source_word: וַיָּבֹא וַיֵּלֶךְ שֹׁמְרוֹן
  choice: 出发，往撒马利亚去
  rationale: בוא可依叙事视角表示“来”或“去”，הלך加地名则指向撒马利亚行进。译文以“出发，往……去”保留两个连续动作，同时避免生硬重复。
- source_word: הוּא בֵּית עֵקֶד הָרֹעִים בַּדָּרֶךְ
  choice: 途中，他到了牧人的伯特·埃刻
  rationale: 原文以独立代词הוּא引出途中所在之处，省略的方位关系需由上下文补足；“途中，他到了”用自然汉语表达这一场景转换，但不把地名含义直接写入正文。
- source_word: בֵּית עֵקֶד
  choice: 伯特·埃刻
  rationale: 该词组在此用作地名，而עֵקֶד的确切含义并不完全确定，因此正文采用音译。
- source_word: הָרֹעִים
  choice: 牧人的
  rationale: רֹעִים通常指牧人或牧羊人；“牧人的”直接保留其与地名之间的属格关系。
- source_word: בַּדָּרֶךְ
  choice: 途中
  rationale: 该短语说明地点位于耶户前往撒马利亚的路上；“途中”简洁自然。
