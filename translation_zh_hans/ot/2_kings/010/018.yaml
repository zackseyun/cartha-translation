base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: zh_hans
  text: 耶户召集了所有百姓，对他们说[a]：“亚哈事奉巴力[b]不多；耶户要多多事奉他。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 从上下文看，耶户这番话带有反讽意味：他声称自己要多多事奉巴力，实际上这是为召集巴力敬拜者而设的计谋。
    reason: cross_reference
  - marker: b
    text: “事奉”也可译作“敬拜”；这里的希伯来语动词用于对神祇的宗教性服事。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: 召集
  rationale: קבץ在叙事中表示把人聚集起来；“召集”自然地表达耶户主动使众人聚集。
- source_word: כָּל הָעָם
  choice: 全体民众
  rationale: 保留“所有百姓/民众”的广泛所指，同时符合现代汉语表达。
- source_word: עָבַד אֶת הַבַּעַל
  choice: 事奉巴力
  rationale: עבד用于神祇时可指宗教性的服事或敬拜；“事奉”既贴近原词，也保留其宗教含义。
- source_word: מְעָט
  choice: 不多
  rationale: 该词在此表示程度，与后面的הַרְבֵּה形成对照；“不多”在汉语中自然，并避免生硬的“事奉一点”。
- source_word: יַעַבְדֶנּוּ
  choice: 要事奉他
  rationale: 未完成式在直接引语中表达将来的行动；“他”保留希伯来文指回巴力的代词。
- source_word: הַרְבֵּה
  choice: 多多
  rationale: 该词作程度副词，并与מְעָט构成简短鲜明的对照；“多多”保留这种修辞力度。
- source_word: יֵהוּא
  choice: 耶户
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: הַבַּעַל
  choice: 巴力
  rationale: 按中文通行译名处理为专名，不另译希伯来文冠词。
theological_decisions:
- issue: 耶户宣称要事奉巴力
  choice: 正文按其话语的表面意思直译，不加入“假装”或“声称”等提示。
  alternative: 在正文中明说耶户是假意事奉巴力。
  rationale: 本节希伯来文本只记述耶户所说的话；其欺骗意图由后续叙事显明。正文保留这种叙事张力，脚注说明其上下文中的反讽。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“不多……多多……”尽量保留原文מעט与הרבה的简洁对照；分号呈现两句之间鲜明的平行和转折。
