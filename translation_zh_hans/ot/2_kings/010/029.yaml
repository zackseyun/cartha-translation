base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: zh_hans
  text: 只是，耶户没有离弃尼八的儿子耶罗波安的罪——他曾使以色列人犯罪——就是在伯特利和但的金牛犊。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “没有离弃”或译“没有停止跟随”；希伯来文直译为“没有从它们后面转离”。
    reason: 保留希伯来语习语的字面形象及可行译法。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 在上下文中引出限制性的转折，指出耶户虽除灭巴力崇拜，却仍保留耶罗波安所设的敬拜制度。
- source_word: חֲטָאֵי
  choice: 那些罪
  rationale: 保留复数，并由后文“金牛犊”具体说明所指。
- source_word: הֶחֱטִיא
  choice: 使……陷入罪中
  rationale: 明确表达希伯来语使役式的因果意义，同时符合现代汉语表达。
- source_word: לֹא סָר יֵהוּא מֵאַחֲרֵיהֶם
  choice: 耶户没有离开……那些罪
  rationale: 按该习语的实际语义表达未曾弃绝或停止追随；脚注保留其较直译的形象。
- source_word: עֶגְלֵי הַזָּהָב
  choice: 金牛犊
  rationale: 直接、具体地表达相关祭祀物，并与“那些罪”构成解释关系。
- source_word: בֵּית אֵל
  choice: 伯特利
  rationale: 采用现代中文圣经传统中通行的地名译法。
- source_word: דָּן
  choice: 但
  rationale: 采用现代中文圣经传统中通行的地名译法。
theological_decisions:
- issue: “耶罗波安的罪”与“金牛犊”的关系
  choice: 用“就是”将“金牛犊”作为对“那些罪”的具体说明
  alternative: 将后半句理解为句法停顿后的重述或补充
  rationale: 希伯来文由抽象的“罪”转向具体的祭祀物；“就是”自然保留其同位解释作用，而不额外判定金牛犊是否穷尽这些罪的全部内涵。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“只是”承接上下文的限制性转折；句子保留“那些罪—就是金牛犊”的解释结构。所有专名使用简体中文圣经常见译名。
