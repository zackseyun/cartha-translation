revisions:
- from: 只是，耶户没有离开尼八的儿子耶罗波安使以色列陷入罪中的那些罪，就是伯特利和但的金牛犊。[a]
  to: 只是，耶户没有离弃尼八的儿子耶罗波安的罪——他曾使以色列人犯罪——就是在伯特利和但的金牛犊。[a]
  rationale: 修订只消除中文定语链造成的指向歧义，并使动词搭配更自然。破折号中的“他曾使以色列人犯罪”对应原文修饰“耶罗波安”的关系从句；“就是”继续保留原文由“罪”转至“金牛犊”的同位说明，未将其扩展为额外的神学判断。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:14Z'
review_pass:
  verdict: revise
  source_fidelity: 原译文基本忠实保留了 רַק 的限制性语气、חטאֵי 的复数、“使以色列犯罪”的使役意义，以及金牛犊与伯特利、但之间的对应关系。但“耶罗波安使以色列陷入罪中的那些罪”在中文中会临时造成修饰关系不清，可能被读成“使以色列陷入罪中的罪”，而非“曾使以色列犯罪的耶罗波安”。
  naturalness: “没有离开……那些罪”可理解，但“离弃……的罪”更符合现代汉语中放弃某种罪行或罪恶做法的表达。以破折号明确插入对耶罗波安的说明，可在不增加解释的前提下使句法自然清晰。
  terminology: “耶户”“尼八”“耶罗波安”“以色列”“伯特利”“但”及“金牛犊”均为通行且合适的译名。将“陷入罪中”改为“犯罪”更贴近原文的简洁使役表达，且避免把原文未明说的状态性含义加重。
  issues:
  - severity: medium
    issue: 关系从句的中文指向不够清楚
    rationale: 原文的 אֲשֶׁר הֶחֱטִיא 指单数的耶罗波安；草稿的连续定语结构容易令读者误判“使以色列陷入罪中”修饰“那些罪”。应明确该行为的施事是耶罗波安。
  - severity: low
    issue: “离开……罪”的搭配略生硬
    rationale: 中文用“离弃罪”或“停止随从这些罪”更自然，同时仍可表达希伯来语“没有从它们后面转离”的习语意义。
  revised_text: 只是，耶户没有离弃尼八的儿子耶罗波安的罪——他曾使以色列人犯罪——就是在伯特利和但的金牛犊。[a]
  revised_footnotes:
