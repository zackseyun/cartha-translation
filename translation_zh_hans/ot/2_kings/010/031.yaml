id: 2KI.10.31
reference: 2 Kings 10:31
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: zh_hans
  text: 然而，耶户没有尽心谨守遵行以色列的上帝耶和华[a]的律法；他没有离弃耶罗波安使以色列犯罪的那些罪[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “耶和华”是以色列上帝的名字，希伯来文为יהוה（YHWH）。
    reason: divine_name
  - marker: b
    text: 指与耶罗波安相关、借以使以色列犯罪的罪；这是《列王纪》中反复出现的说法。
    reason: cross_reference
lexical_decisions:
- source_word: וְיֵהוּא
  choice: 然而，耶户
  rationale: 上下文把耶户先前除灭巴力崇拜的行动与他未能完全忠于圣约相对照，因此用转折词“然而”。
- source_word: לֹא שָׁמַר לָלֶכֶת
  choice: 没有……谨守遵行
  rationale: שׁמר与不定式连用，强调留心、谨慎地实行；“谨守遵行”既保留这种慎重遵守的含义，也自然表达希伯来语“行走”的行为隐喻。
- source_word: בְּתוֹרַת
  choice: 律法
  rationale: 此处是圣约语境中的תורה，既有教导之意，也突出以色列应当遵守的规范，译作“律法”最贴合本句。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确这是以色列上帝的名字，而非仅译作称号“主”。
- source_word: בְּכָל לְבָבוֹ
  choice: 尽心
  rationale: 自然、凝练地表达“用他的全心”，指完整而专一的内在委身。
- source_word: לֹא סָר מֵעַל
  choice: 没有离弃
  rationale: סור מן表示从某事转离；“离弃罪”是自然且庄重的现代中文表达。
- source_word: חַטֹּאות יָרָבְעָם
  choice: 耶罗波安……的那些罪
  rationale: 保留复数“罪”，并用“那些”使后接关系从句在中文中清楚自然。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 使以色列陷入罪中的
  rationale: 保留החטיא的使役意义。“陷入罪中”避免中文“使以色列犯罪”可能产生的生硬重复，同时不削弱耶罗波安引人犯罪的责任。
theological_decisions:
- issue: 对耶户圣约忠诚的评价
  choice: 译文表明，耶户虽曾打击巴力崇拜，却没有全心遵行耶和华的律法，也没有离弃耶罗波安的罪。
  alternative: 把本节仅理解为对不彻底政治改革的批评，而不涉及耶户个人的内在忠诚。
  rationale: “尽心”和“没有离弃……罪”共同构成道德与圣约层面的评价。译文保留他先前热心改革与此处不完全顺服之间的张力，不作超出原文的判断。
translation_notes:
  register: 采用现代、庄重而易懂的简体中文。“谨守遵行”保留原文שׁמר לכת所含的留心遵守与行为实践两层意思；分号呈现两个相互补充的负面评价。所有脚注标记均已置于正文。
