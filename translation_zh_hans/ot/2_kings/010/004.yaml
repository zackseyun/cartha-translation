base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/004.yaml
  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: zh_hans
  text: 他们极其惧怕，说：“看，两个王都不能在他面前站立，我们又怎能站立呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: 他们……害怕
  rationale: 该词源于 ירא，在叙事中表达他们因眼前局势而惧怕；“害怕”是自然、准确的现代汉语。
- source_word: מְאֹד מְאֹד
  choice: 非常非常
  rationale: 保留希伯来文副词的重复，传达强烈的恐惧及原文的修辞力度。
- source_word: הִנֵּה
  choice: 看
  rationale: 用于提醒听者注意随后提出的事实；“看”简洁自然，也保留了指示和强调作用。
- source_word: שְׁנֵי הַמְּלָכִים
  choice: 两个王
  rationale: 指上文已经提到的两位王；汉语在此不需另加定冠意义的词。
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: 不能在他面前站立
  rationale: 既保留 עמד לפני 的“站在……面前”意象，也按语境表达无法抵挡他的含义。
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: 我们又怎能站立呢
  rationale: “又怎能”自然表达由前句推出的反问，并以“站立”对应前句同一个希伯来动词 עמד，保留修辞平行。
theological_decisions: []
