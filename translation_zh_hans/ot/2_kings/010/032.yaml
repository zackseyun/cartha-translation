base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: zh_hans
  text: 那些日子，雅威开始削减以色列的疆土[a]；哈薛在以色列全境[b]攻击他们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “削减以色列的疆土”也可译作“开始削减以色列”或“开始从以色列削去一些部分”。原文动词有切去、削减之意；结合下文，可能指以色列开始丧失部分领土。
    reason: lexical_alternative
  - marker: b
    text: “全境”也可译作“整个边界一带”。原词既可指边界，也可指疆域。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 保留希伯来语复数时间短语的表达，同时符合现代汉语叙事语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译四字神名，不以称号替代。
- source_word: הֵחֵל
  choice: 开始
  rationale: 准确表达使役词形在此所标明的行动开端。
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: 割削以色列的疆土
  rationale: “割削”保留原文切割、削减的意象；补出“疆土”使汉语自然，并根据下半句的地理语境表达以色列领土逐步缩减，而非一次被彻底消灭。
- source_word: וַיַּכֵּם
  choice: 击败了他们
  rationale: נכה在军事语境中可指击打或击败；“他们”保留第三人称复数宾语，指以色列人。
- source_word: חֲזָאֵל
  choice: 哈薛
  rationale: 采用现代中文圣经人名的通行译法。
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: 在以色列全境
  rationale: גְּבוּל既可指边界，也可指疆域；此处军事地理语境较适合译作整个疆域，同时以脚注保留“边界”的可能。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；正文以较贴近通常学术重构读音的“雅威”音译，保留其作为专名的性质。
- issue: 雅威开始割削以色列与哈薛行动之间的关系
  choice: 并列陈述雅威开始削减以色列疆土，随后说明哈薛击败他们
  alternative: 明说雅威借哈薛施行审判
  rationale: 原文将两件事相接，却没有明确写出“借着”或“审判”；译文不额外说明因果工具关系，以保留叙事本身的神学张力。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“割削”略带文学色彩，用来保留原文的切割意象；其具体含义由“疆土”和脚注加以说明。
