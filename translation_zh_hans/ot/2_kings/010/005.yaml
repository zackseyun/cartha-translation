base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: zh_hans
  text: 于是，王宫总管、城中主事的人、众长老和王子们的监护人[a]派人去见耶户，说：“我们是你的仆人；凡你吩咐我们的，我们都必照办。我们不会立任何人为王。你看怎样好，就怎样做吧。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “监护人”也可译作“养育者”或“照料者”；希伯来词指受托照管王室众子的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: 王宫总管
  rationale: 这是指掌管王室或宫廷事务的官员；译为“王宫总管”既符合王室语境，也自然简明。
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: 城中主事的人
  rationale: 希伯来文描述其职能，却未明确给出固定官衔；此译保留这种开放性，避免过度具体化为“城长”或“总督”。
- source_word: הַזְּקֵנִים
  choice: 众长老
  rationale: 保留该词在古代以色列社会中兼具年长者与地方领袖的政治社会含义。
- source_word: הָאֹמְנִים
  choice: 王子们的监护人
  rationale: 该词指受托照料亚哈家众王子的人；补出上下文中的“王子们”，使现代读者清楚其职责对象。
- source_word: עֲבָדֶיךָ
  choice: 你的仆人
  rationale: 这里是政治书信中表示臣服的自称，并非着重说明奴隶身份。
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: 凡你吩咐我们的，我们都必照办
  rationale: 自然表达他们无条件服从的承诺，同时保留原文“凡……都……”的完整范围。
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: 我们不会立任何人为王
  rationale: “立……为王”准确体现使役词形所表达的拥立或使人作王之意。
- source_word: הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: 你看怎样好，就怎样做吧
  rationale: 以自然现代汉语保留“在你眼中为好”的主观判断意味，并传达末尾命令式的许可与顺服语气。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。官职称谓不过度具体化；对上下文所指的王子，仅在“监护人”前补明，以消除中文歧义。结尾用“你看怎样好，就怎样做吧”传达希伯来习语，同时保持臣服书信的语气。
