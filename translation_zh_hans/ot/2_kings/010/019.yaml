  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/עַתָּ֣ה כָל נְבִיאֵ֣י הַ/בַּ֡עַל כָּל עֹבְדָ֣י/ו וְ/כָל כֹּהֲנָי/ו֩ קִרְא֨וּ אֵלַ֜/י אִ֣ישׁ אַל יִפָּקֵ֗ד כִּי֩ זֶ֨בַח גָּד֥וֹל לִ/י֙ לַ/בַּ֔עַל כֹּ֥ל אֲשֶׁר יִפָּקֵ֖ד לֹ֣א יִֽחְיֶ֑ה וְ/יֵהוּא֙ עָשָׂ֣ה בְ/עָקְבָּ֔ה לְמַ֥עַן הַאֲבִ֖יד אֶת עֹבְדֵ֥י הַ/בָּֽעַל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: zh_hans
  text: “现在，把巴力的所有先知、所有敬拜他的人和所有他的祭司都召到我这里来，一个也不可缺席，因为我要为巴力献上一场盛大的祭祀。凡缺席的，必不能活。”但耶户是用诡计这样做的，为要消灭敬拜巴力的人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: 现在
  rationale: 原文有明确的时间／话语推进词 וְעַתָּה；在耶户命令的开头译作“现在”，既忠实于原文，也符合现代汉语表达。
- source_word: נְבִיאֵי הַבַּעַל
  choice: 巴力的所有先知
  rationale: 保留属格结构及巴力崇拜的宗教指向；“先知”是 נביא 的标准译法。
- source_word: עֹבְדָיו
  choice: 所有敬拜他的人
  rationale: עבד 在此为宗教崇拜语境；译作“敬拜他的人”比“他的仆人”更清楚地表达对巴力的宗教事奉，代词“他”指巴力。
- source_word: כֹּהֲנָיו
  choice: 所有祭司
  rationale: כהן 指宗教礼仪人员；依汉语语境可省略重复的“他的”，而“所有”对应原文 כָל。
- source_word: קִרְאוּ אֵלַי
  choice: 召到我这里来
  rationale: 复数命令式 קִרְאוּ 配合 אֵלַי 表示召集众人到说话者面前；此译自然地体现命令和趋向。
- source_word: אִישׁ אַל יִפָּקֵד
  choice: 一个也不可缺席
  rationale: פקד 的被动形在此表示点名或召集时缺席；אִישׁ 是逐一个体化的单数阳性泛称，汉语“一個也”自然保留“不许少一人”的强调。
- source_word: זֶבַח גָּדוֹל
  choice: 盛大的祭
  rationale: זבח 指祭牲或献祭，גדול 在此可指规模盛大；“盛大的祭”避免误解为祭物本身体积巨大。
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: 凡缺席的，必不能活
  rationale: 重复用“缺席”对应同一动词 פקד，并以“必不能活”贴近 לֹא יִחְיֶה 的直接、严厉威胁。
- source_word: בְעָקְבָּה
  choice: 出于诡诈
  rationale: 该名词表示欺骗、诡计或奸诈；“出于诡诈”保留叙述者对耶户策略的评价，同时不额外说明其道德或神学正当性。
- source_word: לְמַעַן הַאֲבִיד
  choice: 为要消灭
  rationale: לְמַעַן 引出目的，אבד 的使役式表示使之灭亡；“为要消灭”直接保留目的关系。
- source_word: עֹבְדֵי הַבָּעַל
  choice: 所有敬拜巴力的人
  rationale: 与前文 עֹבְדָיו 保持一致，并明确宾语是巴力；“所有”体现受事群体的整体性。
theological_decisions:
- issue: 叙述者对耶户行动方式的评价
  choice: 其实，耶户这样做是出于诡诈
  alternative: 耶户这样做是用计
  rationale: 原文明确指出耶户以欺骗手段行事。“出于诡诈”保留其负面或至少强烈警示性的叙事张力，不将之淡化为纯粹中性的谋略，也不替叙述者进一步裁定其神学正当性。
- issue: אִישׁ 的单数阳性泛称
  choice: 一个也不可缺席
  alternative: 任何男人都不可缺席
  rationale: 原文以单数阳性 אִישׁ 逐一指向应到场者，但上下文所强调的是全体巴力崇拜者不可有人缺席。现代汉语“一個也”既保留逐一强调，又避免无依据地把范围限定为生理男性。
- issue: 耶户所宣称之祭与其真实目的之间的张力
  choice: 保留“我要为巴力献上盛大的祭”与“为要消灭”之间的直接反差
  alternative: 在引语内明说这是诱骗
  rationale: 原文先完整呈现耶户的宣称，随后才由叙述者揭示其真实目的；译文维持这一叙事次序，不提前化解欺骗与毁灭之间的张力。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“召到我这里来”“一个也不可缺席”体现公开命令的口吻；“盛大的祭”适合宗教仪式语境；叙述转折用“其实”揭示耶户先前言辞背后的真实意图。引号沿用本节作为耶户发言延续部分的形态。
