  text: Then they brought out the pillars of the house of Baal and burned them[a][b][c].
translation:
  language: zh_hans
  text: 于是，他们把巴力殿[a]里的柱像[b]搬出来，焚烧了[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “巴力殿”或译“巴力的庙”。
    reason: lexical_alternative
  - marker: b
    text: 或译“祭祀用的石柱”或“立石”。希伯来语所指的是与祭祀崇拜有关的竖立石柱。
    reason: lexical_alternative
  - marker: c
    text: 希伯来文直译为“焚烧了它”；宾语后缀是阴性单数，但前面的“柱像”是复数。这里可能是集合用法。
    reason: textual_grammar
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: 于是……搬出来
  rationale: 该词是 יצא 的使役形，意为“使出来、搬出”；句首的叙事连接形式推进事件发展，译作“于是”自然体现先后次序。
- source_word: מַצְּבוֹת
  choice: 柱像
  rationale: מַצֵּבָה 指竖立的石柱，常用于祭祀或崇拜。“柱像”既保留柱状实体，也在现代汉语中提示其宗教用途；脚注列出“神柱、立石”等可能译法。
- source_word: בֵּית הַבַּעַל
  choice: 巴力殿
  rationale: בַּיִת 本义为“房屋”，在敬拜场所的语境中指庙宇；“巴力殿”简洁自然，也保留“殿/房屋”的对应关系。
- source_word: וַיִּשְׂרְפוּהָ
  choice: 焚烧了
  rationale: 希伯来文动词带第三人称阴性单数宾语后缀，但前面的 מַצְּבוֹת 是复数。汉语可省略宾语代词，既清楚承接“柱像”，又不强行消除原文数的不一致；以脚注说明。
