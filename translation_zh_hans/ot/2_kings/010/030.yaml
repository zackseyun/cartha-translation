revisions:
- from: 耶和华对耶户说：“因为你做得好，行了我眼中看为正的事，照我心中所定的一切待了亚哈家，所以你的子孙必接续四代[a]坐以色列的王位。”
  to: 耶和华对耶户说：“因为你做得好，行了我眼中看为正的事，照着我心中所定的一切对待亚哈家；你的子孙必有四代坐在以色列的王位上。”
  rationale: 修订只处理汉语搭配与句法清晰度：以“对待亚哈家”准确表达原文对亚哈家所施行的行动，以“必有四代坐在……王位上”清楚传达四代王朝继承的应许。保留原文对耶户在此事上的明确嘉许，不扩大为对其全部行为的认可。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:18Z'
review_pass:
  verdict: revise
  source_fidelity: 译文总体准确保留了耶和华对耶户的嘉许、对亚哈家的行动，以及四代王朝延续的应许。惟“待了亚哈家”缺少介词搭配且表达生硬；“接续四代坐以色列的王位”句法黏连，王位应许的范围不够清楚。
  naturalness: “行了我眼中看为正的事”自然且符合经文庄重语体。“照我心中所定的一切待了亚哈家”不合现代汉语惯用搭配；改为“照着我心中所定的一切对待亚哈家”既通顺又保持原文的行动对象与神意依据。将末句调整为“你的子孙必有四代坐在以色列的王位上”，可清楚表达王朝延续。
  terminology: “耶和华”“耶户”“亚哈家”“以色列的王位”均恰当。“心中所定”能传达לֵבָב在此处的意愿／旨意，且不额外扩展神学含义。
  issues:
  - severity: medium
    issue: “待了亚哈家”搭配不自然，且“照……待了……”结构别扭。
    rationale: 汉语“待”在这里通常需要“对”构成“对待”；原文是耶户对亚哈家所做的事符合神心中的一切，应明确行动对象与“照着”的修饰关系。
  - severity: medium
    issue: “你的子孙必接续四代坐以色列的王位”句法含混。
    rationale: “接续四代”可被理解为子孙连续四代而非四代子孙登位，且“坐王位”前缺少自然的结构连接。改为“必有四代坐在……王位上”更清楚保留王朝性应许。
  - severity: low
    issue: 正文中的“所以”可省略。
    rationale: 原文以“因为”引出神宣告的依据，但未使用与之对应的显性结果连词。省略“所以”可更贴近原句结构，同时汉语仍然通顺。
  revised_text: 耶和华对耶户说：“因为你做得好，行了我眼中看为正的事，照着我心中所定的一切对待亚哈家；你的子孙必有四代坐在以色列的王位上。”
  revised_footnotes:
  - marker: a
    text: 原文直译近似“第四代的子孙”。这是王朝延续的习语，指耶户之后有四代子孙坐以色列的王位。
    reason: 说明希伯来语“子孙／第四代”的王朝习语，并澄清“四代”指耶户之后的四代承继者。
  revision_rationale: 修订只处理汉语搭配与句法清晰度：以“对待亚哈家”准确表达原文对亚哈家所施行的行动，以“必有四代坐在……王位上”清楚传达四代王朝继承的应许。保留原文对耶户在此事上的明确嘉许，不扩大为对其全部行为的认可。
