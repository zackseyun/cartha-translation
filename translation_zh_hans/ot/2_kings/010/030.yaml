  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: zh_hans
  text: 耶和华对耶户说：“因为你做得好，行了我眼中看为正的事，照着我心中所定的一切对待亚哈家；你的子孙必有四代坐在以色列的王位上。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确保留上帝的立约之名。
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 自然、清楚地表达此处引出应许依据的因果关系。
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: 你做得好，行了我眼中看为正的事
  rationale: 既保留“做得好”的明确嘉许，也保留“我眼中看为正”这一希伯来语评价公式。
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: 照我心中所定的一切
  rationale: לבב在这里主要指意愿和旨意；“心中所定”保留心的意象，同时避免被误解为单指情感。
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: 待了亚哈家
  rationale: “待”自然表达对亚哈王朝所采取的行动，又不在正文中额外说明其具体性质。
- source_word: בְּנֵי רְבִעִים
  choice: 你的子孙必接续四代
  rationale: 将希伯来语直译近似“第四代之子”的王朝用语转成清楚的现代中文，表达耶户之后有四代承继王位。
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: 坐以色列的王位
  rationale: 保留“坐在王位上”的君王登位意象；领属性的 לְךָ 已由“你的子孙”及“接续”自然体现。
theological_decisions:
- issue: 上帝对耶户行为的认可范围
  choice: 明确译出上帝称许耶户照其旨意处置亚哈家，但不把这种称许扩大为对耶户全部统治和品格的认可。
  alternative: 弱化本节的称许，或将其扩大为对耶户整段统治的全面肯定。
  rationale: 原文的嘉许明确限定在耶户对亚哈家所做之事；译文应保留这一神学张力，不以本节未说的话消解上下文。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“做得好”保留直接嘉许；“心中所定”传达意志与旨意；“王位”比“宝座”更直接显示此处指以色列王权。
