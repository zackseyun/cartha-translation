  text: וַֽ/יִּתְּצ֔וּ אֵ֖ת מַצְּבַ֣ת הַ/בָּ֑עַל וַֽ/יִּתְּצוּ֙ אֶת בֵּ֣ית הַ/בַּ֔עַל וַ/יְשִׂמֻ֥/הוּ ל/מחראות עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: zh_hans
  text: 他们拆毁了巴力的柱像，又拆毁了巴力庙，把它改作厕所，直到今日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: 拆毁
  rationale: נתץ表示强力毁坏建筑或祭祀物；“拆毁”自然、准确，也适用于柱像和庙宇。
- source_word: מַצְּבַת הַבָּעַל
  choice: 巴力的柱像
  rationale: מַצֵּבָה在此指为巴力设立的祭祀性立石或柱；“柱像”既保留柱状实体，也体现其宗教用途，避免被误解为普通建筑柱。
- source_word: הַבָּעַל
  choice: 巴力
  rationale: 此处בעל是迦南神祇的专名或称号，采用现代中文圣经中通行的音译“巴力”。
- source_word: בֵּית הַבַּעַל
  choice: 巴力庙
  rationale: בַּיִת字面为“房屋”，在祭祀语境中指神庙；“巴力庙”在现代中文中清楚自然，且不造成普通住宅的误解。
- source_word: וַיְשִׂמֻהוּ
  choice: 把它改作
  rationale: שׂוּם加ל在此表示使某物成为某种用途；“改作”准确表达用途被改变。
- source_word: למחראות
  choice: 厕所
  rationale: 该词指排泄之处；“厕所”是普通现代读者最直接易懂的表达，并保留蓄意亵渎原祭祀场所的意味。
- source_word: עַד הַיּוֹם
  choice: 直到今日
  rationale: 这是希伯来文惯用语，表示该状况延续到叙述者当时；“直到今日”庄重而自然。
theological_decisions:
- issue: 巴力圣所名称的译法
  choice: 巴力庙
  alternative: 巴力的殿／巴力的房屋
  rationale: 原文בֵּית הַבַּעַל字面是“巴力的房屋”，但祭祀语境明确指神庙。“巴力庙”清楚传达所指，不额外引入宗派性解释。
- issue: למחראות所表达的污辱性用途
  choice: 厕所
  alternative: 茅厕／粪坑
  rationale: 原文强调巴力祭祀场所遭到彻底毁坏和污辱。“厕所”直白、现代，不以委婉语削弱原文力度，也不采用过于古旧或比原文更具体的说法。
- issue: 单数代词וַיְשִׂמֻהוּ的所指
  choice: 把它改作厕所
  alternative: 把那里改作厕所
  rationale: 阳性单数后缀最自然地回指紧邻的“巴力庙”。中文保留“它”，不把所指扩大为整个地点，也不消除原文的语法衔接。
translation_notes:
  register: 采用现代、庄重、易懂的叙事文体。“柱像”说明其为祭祀性柱石；“巴力庙”按语境自然表达“巴力的房屋”；“厕所”保留原文直接而带有贬抑性的措辞。本节无需脚注。
