  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: zh_hans
  text: 他对掌管衣物库房的人说：“拿出衣服来，给所有敬拜巴力的人[a]。”那人就为他们拿出了衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “敬拜巴力的人”原文直译为“服事巴力的人”或“巴力的仆人”，这里指献身于巴力崇拜、事奉巴力的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: 衣库
  rationale: 该词指存放或管理衣物的场所或部门；“衣库”简洁、自然，也与下文取出衣服相呼应，且避免“圣衣室”等词可能带来的后世宗教联想。
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: 对掌管衣库的人
  rationale: 介词结构直译为“在衣库之上的人”，实际表达负责管理衣库者；译文保留其职掌含义，同时符合现代汉语表达。
- source_word: הוֹצֵא
  choice: 拿出……来
  rationale: 这是 יצא 的使役命令式，指将衣物从库中取出；“拿出……来”在现代汉语中自然清楚。
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: 衣服
  rationale: 两个名词都可泛指穿戴之物，并在此具有集合意义；统一译作“衣服”既自然，也避免生硬地区分单复数。
- source_word: עֹבְדֵי הַבָּעַל
  choice: 敬拜巴力的人
  rationale: עבד 基本义为服事或作仆人，在祭祀语境中指投身于巴力崇拜、事奉巴力的人；“敬拜巴力的人”清楚传达此处的宗教含义。
theological_decisions:
- issue: עֹבְדֵי הַבָּעַל 的身份表述
  choice: 敬拜巴力的人
  alternative: 巴力的仆人／事奉巴力的人
  rationale: 上下文聚焦巴力崇拜仪式，因此采用现代读者易懂的“敬拜”；脚注保留原词“服事、作仆人”的语义张力，避免把词义完全限缩为单一宗教动作。
translation_notes:
  register: 采用现代、庄重而通顺的叙事语体。“掌管衣库的人”明确表达行政职掌；“衣服”符合普通现代汉语，并保留原文集合名词的用法。
