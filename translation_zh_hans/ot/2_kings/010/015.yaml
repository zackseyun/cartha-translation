  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֡ם וַ/יִּמְצָ֣א אֶת יְהוֹנָדָב֩ בֶּן רֵכָ֨ב לִ/קְרָאת֜/וֹ וַֽ/יְבָרְכֵ֗/הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/יֵ֧שׁ אֶת לְבָבְ/ךָ֣ יָשָׁ֗ר כַּ/אֲשֶׁ֤ר לְבָבִ/י֙ עִם לְבָבֶ֔/ךָ וַ/יֹּ֨אמֶר יְהוֹנָדָ֥ב יֵ֛שׁ וָ/יֵ֖שׁ תְּנָ֣/ה אֶת יָדֶ֑/ךָ וַ/יִּתֵּ֣ן יָד֔/וֹ וַ/יַּעֲלֵ֥/הוּ אֵלָ֖י/ו אֶל הַ/מֶּרְכָּבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: zh_hans
  text: 耶户从那里继续前行，遇见利甲的儿子约拿达迎面而来，就向他问候[a]，对他说：“你的心是否正直，像我的心与你的心相合一样？”[b]约拿达说：“是。”耶户说：“若是，就把手给我。”[c]约拿达便把手给他，耶户就把他带上了自己的战车。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“就祝福他”。这里的希伯来语动词通常意为“祝福”，在相遇的场景中也可表示问候、致意。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译：“你的心是否正直，像我的心与你的心同在一样？”这句话可表达彼此忠诚或目标一致。
    reason: lexical_alternative
  - marker: c
    text: 依马所拉重音，或理解为约拿达说“是”，耶户接着说“若是，就把手给我”。另一种句读把前半句译作约拿达强调回答：“是，是的。”原文没有在命令前再次写出说话人的名字。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: 从那里继续前行
  rationale: 表达叙事中的连续行进，也保留“从那里”这一出发点。
- source_word: וַיִּמְצָא אֶת־יְהוֹנָדָב בֶּן־רֵכָב
  choice: 遇见利甲的儿子约拿达
  rationale: מצא的基本义是“找到、遇见”；在路上相逢的语境中，“遇见”最自然，又不暗示事先约定会面。
- source_word: לִקְרָאתוֹ
  choice: 迎面而来
  rationale: 表示约拿达正朝耶户而来与他相遇；“迎面而来”符合现代汉语叙事。
- source_word: וַיְבָרְכֵהוּ
  choice: 向他问候
  rationale: ברך基本可指“祝福”，但在相遇场景中可作致意、问候解；正文采用语境义，并以脚注保留“祝福”的可能。
- source_word: הֲיֵשׁ אֶת־לְבָבְךָ יָשָׁר
  choice: 你的心是否正直
  rationale: 保留“心”和“正直”的原文意象，涵盖内在态度、忠诚和关系上的坦诚，不缩减为单一政治立场。
- source_word: כַּאֲשֶׁר לְבָבִי עִם־לְבָבֶךָ
  choice: 像我的心与你的心相合一样
  rationale: 保留两次“心”的对应关系；“相合”自然传达 עִם 所表示的共同立场或彼此一致，同时脚注列出更贴近字面的形式。
- source_word: יֵשׁ וָיֵשׁ תְּנָה אֶת־יָדֶךָ
  choice: “是。”……“若是，就把手给我。”
  rationale: 马所拉重音支持将第一个 יֵשׁ 视为约拿达的回答，并把 וָיֵשׁ 与随后的命令连读为“若是，就……”。这种理解比把两个 יֵשׁ 都作为重复肯定更符合重音分组；脚注保留另一种句读。
- source_word: וַיִּתֵּן יָדוֹ
  choice: 约拿达便把手给他
  rationale: 直译握手或伸手的动作；补出约拿达的名字以免现代汉语中的代词所指含混。
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל־הַמֶּרְכָּבָה
  choice: 耶户就拉他上了自己的战车
  rationale: עלה的使役式表示使人上去；“拉他上了”与前文把手交给耶户的动作自然衔接，אֵלָיו 表明是上到耶户所在的车上。
theological_decisions:
- issue: “心正直”所指的忠诚性质
  choice: 保留“心是否正直”及双方内心相合的比喻
  alternative: 意译为“你是否真心支持我”或“你是否忠于我”
  rationale: 原文可涉及个人诚信、相互忠诚或目标一致；不把它限定为政治支持或道德无罪，以保留叙事中的张力。
- issue: יֵשׁ וָיֵשׁ 的句读与说话人
  choice: 译作约拿达回答“是”，随后耶户说“若是，就……”
  alternative: 把 יֵשׁ וָיֵשׁ 都归给约拿达，译作“是，是的”，再补出耶户发出命令
  rationale: 马所拉重音将第二个 וָיֵשׁ 与“把手给我”结合，支持条件式理解；但辅音文本和简短对话容许另一种分析，因此以脚注说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名按中文圣经通行形式译为“耶户、约拿达、利甲”。“战车”比泛称“车”更符合王国时期的军事与王室语境。正文为清晰起见适度补出人物姓名，但以脚注交代原文在对话句读和说话人标示上的简略与歧义。
