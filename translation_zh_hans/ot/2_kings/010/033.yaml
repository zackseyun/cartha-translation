base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: zh_hans
  text: 约旦河东边的基列全地，即迦得人、流便人和玛拿西人的地区；从亚嫩谷[a]旁的亚罗珥起，及基列和巴珊。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “谷”所译的希伯来语可指河流、干河床或溪谷。
    reason: 保留 נַחַל 在“亚嫩谷”这一地理名称中的词义范围。
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: 从约旦河以东
  rationale: מִן 表示疆域起点；מִזְרַח הַשֶּׁמֶשׁ 字面为“日出之向”，在地理语境中自然译为“以东”。
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: 包括基列全地
  rationale: אֵת 所标出的宾语承接上一节“侵占/割取”的动作；“包括”使本节作为中文片段衔接自然，同时保留“全地”的范围。
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: 迦得人、吕便人和玛拿西人的地
  rationale: 三个族称在这里统指居住于约旦河东的支派群体；补出“的地”说明它们与“基列全地”的同位关系。
- source_word: מֵעֲרֹעֵר
  choice: 从……亚罗珥起
  rationale: מִן 标明南面的疆界起点；“亚罗珥”采用通行中文音译。
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: 亚嫩河谷旁的
  rationale: עַל 在此为方位关系，译作“旁”；נַחַל 可指河道、季节性河床或河谷，正文采用自然的地理称呼“河谷”，并以脚注保留词义范围。
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: 以及基列和巴珊
  rationale: 保留连接词的附加作用，不额外把它明确解释为递进、总结或同位，以保存原文略显压缩的疆域列举方式。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的地理叙述。经文在句法上承接上一节，因此不擅自补入新的谓语；用“包括”维持中文可读性。保留末尾“以及基列和巴珊”的并列张力，不强行消解其与前文“基列全地”的关系。
