  yaml_path: translation/ot/2_kings/010/036.yaml
  text: The time that Jehu reigned over Israel was twenty-eight years in Samaria.
translation:
  language: zh_hans
  text: 耶户在撒马利亚作以色列王，共二十八年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר
  choice: 共……年
  rationale: 希伯来语直译为“而……的日子”，在君王纪年公式中表示在位时长。现代汉语用“共……年”自然、准确地传达这一含义。
- source_word: מָלַךְ
  choice: 作……王
  rationale: 该动词在君王纪年公式中指担任君王、在位；“作以色列王”既保留君王身份，也符合现代汉语表达。
- source_word: יֵהוּא
  choice: 耶户
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王
  rationale: 介词עַל与“作王”连用，表示统治的对象；汉语将其自然整合为“作以色列王”。
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: 二十八年
  rationale: 按现代汉语基数词习惯直接表达在位年数。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: בְּ表示地点；这里的撒马利亚是耶户执政所在的王城，译作“在撒马利亚”准确自然。
