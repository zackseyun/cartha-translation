id: 2KI.10.10
reference: 2 Kings 10:10
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: zh_hans
  text: 所以，你们要知道：耶和华论亚哈家所说的话，没有一句会落到地上[a]。耶和华已经成就了他借着自己仆人以利亚所说的[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “落到地上”是希伯来语习语，意思是“落空”或“没有实现”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“借他仆人以利亚的手”。
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: 所以，你们要知道
  rationale: 复数命令式 דְּעוּ 是对在场众人的直接呼吁；אֵפוֹא 在这里带有推论和承接作用，译为“所以”符合现代汉语表达。
- source_word: לֹא יִפֹּל ... אַרְצָה
  choice: 没有一句会落到地上
  rationale: 保留希伯来语“落到地上”的鲜明意象；此习语表示所说的话不会失效或不能实现，并以脚注说明。
- source_word: מִדְּבַר יְהוָה
  choice: 耶和华……所说的话，没有一句
  rationale: 介词 מִן 带部分意义，表示耶和华所说的话中没有任何一句落空；此句式在中文中清楚自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经语境中通行的神圣四字名音译，保留其作为专名而非称号的性质。
- source_word: עַל בֵּית אַחְאָב
  choice: 论亚哈家
  rationale: עַל 在审判语境中可有“针对、反对”之意；“论亚哈家”既保留关系表达，也由上下文显出审判含义，避免过度解释。
- source_word: בֵּית אַחְאָב
  choice: 亚哈家
  rationale: “家”保留希伯来语的家族、王朝意象及其经文互文联系。
- source_word: וַיהוָה עָשָׂה
  choice: 耶和华已经成就了
  rationale: 这里指耶和华使先前宣告的事实际发生；“已经成就”表达行动已经完成及预言得到实现。
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: 借着自己仆人以利亚
  rationale: בְּיַד 是借中介传达的惯用表达；正文采用自然中文“借着”，脚注保留“借……的手”这一原文形式。
- source_word: עַבְדּוֹ
  choice: 自己仆人
  rationale: 在先知受差遣侍奉上帝的语境中，“仆人”比“奴隶”更准确自然。
theological_decisions:
- issue: 神圣四字名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用上帝的专名；“耶和华”是简体中文读者最熟悉且仍作为专名使用的传统音译，不以“主”等称号替代。
- issue: 预言必然应验的习语
  choice: 没有一句会落到地上
  alternative: 没有一句会落空
  rationale: 正文保留原文的具体比喻，同时以脚注解释其含义，不把神的话必然实现这一宣告扁平化为纯解释性措辞。
- issue: עַל 在审判宣告中的关系
  choice: 论亚哈家
  alternative: 针对亚哈家
  rationale: 语境确有不利于亚哈家的审判意味，但介词本身可表达“关于”或“针对”；选择较开放的“论”，保留原文关系词的语义幅度。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留“落到地上”的希伯来语意象和“亚哈家”的家族／王朝表达；用脚注解释可能不够直观的习语与中介表达。
