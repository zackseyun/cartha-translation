base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 耶户其余的事迹、他所做的一切，以及他所显出的一切勇力[a]，不都记在《以色列诸王编年史》[b]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他所显出的一切勇力”也可译作“他一切英勇的事迹”。
    reason: lexical_alternative
  - marker: b
    text: 这里指以色列诸王的王室编年史料，不一定是正典中的《历代志》。
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: 耶户其余的事
  rationale: 这是《列王纪》中总结君王生平的固定表达；דִּבְרֵי 在此指所行的事或事迹，而非单指言语。句首 וְ 依现代汉语叙事习惯不机械译作“并且”。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 他所做的一切
  rationale: 直接保留 כָל 的周全含义和关系从句的结构，现代汉语自然清楚。
- source_word: וְכָל גְּבוּרָתוֹ
  choice: 以及他全部的勇力
  rationale: גְּבוּרָה 可指力量、勇武，也可指彰显力量的英勇事迹。“勇力”保留其凝练性与词义张力，不把它单一定为抽象能力或具体功绩。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗
  rationale: 保留 הֲלוֹא 所引出的反问形式及其预期肯定回答；“记在”在文献记载语境中比逐字的“写在”更自然。
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 记在《以色列诸王记》上
  rationale: 按王室史料标题理解该短语；עַל 与 ספר 搭配时用汉语惯用的“记在……上”。书名号清楚标示所引文献。
