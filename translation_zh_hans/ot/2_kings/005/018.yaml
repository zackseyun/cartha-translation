id: 2KI.5.18
reference: 2 Kings 5:18
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: zh_hans
  text: “愿雅威在这件事上饶恕你的仆人：我主人进临门庙[b]，在那里屈身下拜[a]时，他倚着我的手臂，我也随之在临门庙屈身下拜。当我在临门庙屈身下拜时，愿雅威在这件事上饶恕你的仆人。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “屈身下拜”也可译作“敬拜”；希伯来语动词既可指身体俯伏的动作，也可指敬拜。
    reason: lexical_alternative
  - marker: b
    text: “临门庙”指亚兰神明临门的庙宇或神殿。
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח
  choice: 但愿……饶恕／求……饶恕
  rationale: 该动词在这里表达祈愿和请求；“饶恕”自然地传达乃缦针对某一具体行为求神赦免的意思。
- source_word: יְהוָה
  choice: 雅威
  rationale: 保留希伯来文四字神名所代表的专名，而不以“主”等称号代替。
- source_word: לְעַבְדֶּךָ
  choice: 你的仆人
  rationale: 这是乃缦在恳求中谦称自己；“仆人”符合宫廷语境，也适合现代中文。
- source_word: בְּבוֹא אֲדֹנִי
  choice: 我主人进……时
  rationale: 介词加不定式结构表示时间情境；“我主人”明确指乃缦所服侍的君王。
- source_word: בֵית רִמּוֹן
  choice: 临门庙
  rationale: 希伯来文直译为“临门之家”，在此显然指临门的庙宇；“临门庙”兼顾语义准确与现代中文的自然表达。
- source_word: לְהִשְׁתַּחֲוֺת / וְהִשְׁתַּחֲוֵיתִי / בְּהִשְׁתַּחֲוָיָתִי
  choice: 屈身下拜
  rationale: 该词既可表示身体俯伏，也可表示敬拜。“屈身下拜”保留外在动作，不预先断定乃缦内心是否在敬拜临门。
- source_word: נִשְׁעָן עַל יָדִי
  choice: 他倚着我的手臂
  rationale: 原文直译是“倚在我的手上”；中文用“倚着我的手臂”更自然，也清楚表现乃缦搀扶主人的职责。
- source_word: שָׁמָּה
  choice: （由“进临门庙……时”的结构体现）
  rationale: 地点副词“那里”在中文中已由紧邻的地点短语充分表达，若再译“在那里”会显得累赘。
- source_word: נָא
  choice: 求
  rationale: 礼貌语气词强化恳求；“求”在庄重而现代的中文中表达自然。
theological_decisions:
- issue: הִשְׁתַּחֲוָה 在异教庙宇语境中应译为身体下拜还是敬拜
  choice: 屈身下拜
  alternative: 敬拜／俯伏敬拜
  rationale: 原词可兼指身体动作和宗教敬拜。这里乃缦所求赦免的，至少包括他因扶持主人而随之下拜的外在动作；译作“屈身下拜”保留他外在职责与内在效忠之间的神学张力，不替文本判定他的内心。
- issue: וְהִשְׁתַּחֲוֵיתִי 所表达的随行情境
  choice: 我也不得不……屈身下拜
  alternative: 我也屈身下拜
  rationale: 上下文说明主人倚着乃缦，因此主人下拜时乃缦也随之俯身。“不得不”使中文读者看清这种由搀扶动作造成的情境，但并不否认这仍是乃缦自己求饶恕的行为。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。保留原文开头和结尾重复求饶恕的结构，以体现乃缦恳求的强调；用“屈身下拜”避免消除原文在外在礼仪动作与内心敬拜之间的含混。
