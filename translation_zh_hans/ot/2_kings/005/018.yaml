  to: “愿雅威在这件事上饶恕你的仆人：我主人进临门庙[b]，在那里屈身下拜[a]时，他倚着我的手臂，我也随之在临门庙屈身下拜。当我在临门庙屈身下拜时，愿雅威在这件事上饶恕你的仆人。”
  rationale: 修订仅解决末句的句法和“不得不”所添加的情态：以“在这件事上饶恕你的仆人”准确对应原文介词短语，并用“随之”说明乃缦与主人动作相连而不判定其受迫程度。脚注锚点仍分别附于首次“屈身下拜”和“临门庙”，且脚注内容完整保留。
