base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: zh_hans
  text: 但他说：“我指着永活的雅威[a]——我侍立在他面前[b]——起誓：我决不收下！”乃缦再三催他收下，他却不肯。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文采用希伯来语的起誓格式，直译近似：“雅威是永活的……如果我收下。”誓言中的“如果”在这里表示强烈否定，即“我决不收下”。
    reason: lexical_alternative
  - marker: b
    text: 或译“我站在雅威面前”；这里含有在君王面前侍立、事奉的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: 我指着永活的雅威起誓
  rationale: 这是希伯来语的庄严起誓格式。用现代汉语明确表达起誓功能，同时保留“雅威是永活的”这一核心含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按音译呈现四字神名，保留经文所用的上帝专名，而不以称号代替。
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: 我侍立在他面前的那一位
  rationale: “侍立在……面前”保留原文的宫廷—先知性表达，既可传达身处其面前，也暗含事奉之意，而不把含义简化为单纯“服事”。
- source_word: אִם אֶקָּח
  choice: 我决不收下
  rationale: אִם在誓言格式中构成省略式的强烈否定；现代汉语需明说为“决不”。“收下”自然地指接受上文乃缦所献的礼物。
- source_word: וַיִּפְצַר בּוֹ לָקַחַת
  choice: 乃缦再三催他收下
  rationale: פצר表示强力催促或坚持劝说；“再三催”体现其持续而恳切的力度。根据上下文补出主语“乃缦”，避免连续代词造成歧义。
- source_word: וַיְמָאֵן
  choice: 他却不肯
  rationale: 直接表达以利沙拒绝接受的意志，并与前面的催促形成自然转折。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名，因此采用现代汉语音译“雅威”，保留其作为以色列之上帝专名的性质。
- issue: “侍立在他面前”的含义
  choice: 保留空间与事奉双重意象
  alternative: 译作“我所服事的”
  rationale: 原文措辞既可描绘站在上帝面前，也带有臣仆侍奉君王的意味；直译式表达保留这种神学与语义张力，不只落实为“服事”。
- issue: 誓言中אִם的省略式否定
  choice: 译为“我决不收下”
  alternative: 字面译为“如果我收下”
  rationale: 希伯来誓言省略了咒诅后果，אִם在此表达强烈否定。汉语若只译“如果”会成为残句，因此显明其实际语用力度。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“侍立”保留先知在上帝面前事奉的经文语域；“再三催”使פצר的强烈程度清楚易懂。破折号标出誓言中插入的关系从句，使长句层次清晰。
