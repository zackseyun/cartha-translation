- from: 他说：“都好。[a]我主人派我来，说：‘看哪，刚刚有两个年轻人从以法莲山区来找我；他们是先知门徒中的人。[b]请给他们一他连得银子[c]和两套替换的衣服。’”
  to: 他说：“一切都好。[a]我主人派我来，说：‘你看，刚刚有两个来自以法莲山区、属于先知门徒[b]群体的年轻人，来到我这里。请给他们一他连得银子[c]和两套衣服。’”
  rationale: 修订以更自然的现代汉语表达答语和身份说明，并将“来到我这里”限于原文所表达的到来事实，避免“来找我”的额外目的含义。脚注[b]移至“先知门徒”之后，准确对应所注释的原文术语；其余术语与注释内容予以保留。
