    rationale: בָּאוּ אֵלַי仅说“来到我这里/到我这里来了”；改为“来到我这里”可避免添加他们特意寻访的含义。
  - severity: medium
    issue: 脚注[b]的锚点没有置于所释的“先知门徒”词语之后。
    rationale: 现有[b]置于“人”之后，所解释的术语却在其后一句；应将锚点紧随“先知门徒”以确保注释对应明确。
  - severity: low
    issue: “先知门徒中的人”及“两套替换的衣服”不够自然。
    rationale: 前者可简化为“属于先知门徒群体的年轻人”；后者以“两套衣服”即可自然表达两套供更换的服装，且不改变含义。
