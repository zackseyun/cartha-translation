base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: zh_hans
  text: 他说：“一切都好。[a]我主人派我来，说：‘你看，刚刚有两个来自以法莲山区、属于先知门徒[b]群体的年轻人，来到我这里。请给他们一他连得银子[c]和两套衣服。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“平安”或“没事。”希伯来语“沙龙”在这里是表示一切安好的惯用答语。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语直译“先知之子”，是指先知群体或团体成员的固定说法。
    reason: cultural_note
  - marker: c
    text: “他连得”是衡量贵金属的大重量单位。
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: 都好
  rationale: 此处是对乃缦询问的回应，惯用意义是安抚对方，表示没有出事；“都好”比字面的“平安”更自然地传达语用功能，同时以脚注保留字面可能。
- source_word: אֲדֹנִי
  choice: 我主人
  rationale: 基哈西以仆人身份向乃缦提到以利沙；“我主人”清楚表达主仆关系，也避免被理解为神圣称号。
- source_word: שְׁלָחַנִי
  choice: 派我来
  rationale: 该完成式表示差派已经发生，而基哈西现已来到乃缦面前；现代汉语用“派我来”自然贴合叙事场景。
- source_word: הִנֵּה עַתָּה זֶה
  choice: 看哪，刚刚
  rationale: “看哪”保留引人注意的语篇功能，“刚刚”体现 עַתָּה זֶה 所表达的即时性。
- source_word: נְעָרִים
  choice: 年轻人
  rationale: 该词可指少年、青年或侍从；这些人被说成属于先知群体，译作“年轻人”最少添加未经明说的身份信息。
- source_word: מֵהַר אֶפְרַיִם
  choice: 从以法莲山区
  rationale: 此地理表达通常指以法莲的山地地区，而不是一座名为“以法莲山”的单独山峰。
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: 先知门徒中的人
  rationale: “先知之子”是列王纪中指先知群体成员的固定表达；“先知门徒”以现代汉语传达其群体和受教身份，并以脚注说明希伯来语原文。
- source_word: תְּנָה נָּא
  choice: 请给
  rationale: 祈使式加 נָא 构成较为客气的请求，“请给”准确而自然。
- source_word: כִּכַּר כֶּסֶף
  choice: 一他连得银子
  rationale: כִּכָּר 是按重量衡量贵金属的大单位；保留传统音译“他连得”较精确，并用脚注解释。
- source_word: חֲלִפוֹת בְּגָדִים
  choice: 替换的衣服
  rationale: 该短语指可供更换的成套衣物；结合数词译作“两套替换的衣服”，符合现代汉语。
