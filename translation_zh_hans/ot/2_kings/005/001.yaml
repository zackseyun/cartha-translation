id: 2KI.5.1
reference: 2 Kings 5:1
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: zh_hans
  text: 亚兰[c]王的军队统帅乃缦，在他主人眼中是个大人物，备受尊崇，因为雅威曾借着他使亚兰得胜[a]。他是个英勇的战士，却患有麻风病[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “得胜”也可译作“获救”或“蒙拯救”；原词含义较广，在这里指军事上的成功。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“是麻风病人”。这个词指古代语境中的一种严重皮肤疾患，未必完全等同于现代医学所说的麻风病（汉森病）。
    reason: cultural_note
  - marker: c
    text: “亚兰”传统上也译作“叙利亚”；希伯来原文为“亚兰”。
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַעֲמָן
  choice: 乃缦
  rationale: 采用该人名在现代中文圣经语境中通行且易辨认的音译；句首的 וְ 在这里承接并引入新一段叙事，中文无需机械译作“并且”或添加具有时间意味的“现在”。
- source_word: שַׂר צְבָא מֶלֶךְ אֲרָם
  choice: 亚兰王的军队统帅
  rationale: שַׂר צְבָא 指军队的最高指挥官；“军队统帅”既准确表达其官职，也符合现代汉语。אֲרָם 按原文译为“亚兰”，不以传统称呼“叙利亚”替代。
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו
  choice: 在他主人眼中是个大人物
  rationale: אִישׁ גָּדוֹל 在此指社会地位和影响力显赫；לִפְנֵי 表示“在……面前／眼中”。“主人”在此指乃缦所服侍的君王，并非神圣称号。
- source_word: וּנְשֻׂא פָנִים
  choice: 备受尊崇
  rationale: 这个希伯来语惯用表达字面涉及“脸被抬起”，实际表示受到尊重、礼遇或重视；“备受尊崇”自然传达其宫廷地位。
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: 因为雅威曾借着他使亚兰得胜
  rationale: בוֹ 在此表示媒介，译作“借着他”；תְּשׁוּעָה 可指拯救、解救或胜利，在军事语境中译作“得胜”最贴切，同时用脚注保留较宽的词义范围。
- source_word: יְהוָה
  choice: 雅威
  rationale: 原文直接使用神名四字母词，故以中文音译“雅威”呈现其专名性质，而不以“主”这一称号替代。
- source_word: גִּבּוֹר חַיִל
  choice: 英勇的战士
  rationale: 该词组在本段军事语境中描述力量、勇武和作战能力；“英勇的战士”既保留军事含义，又符合自然现代汉语。
- source_word: מְצֹרָע
  choice: 患有麻风病
  rationale: 该词表示患有古代所称 צָרַעַת 的人。“患有麻风病”保留传统叙事用语，但以脚注说明它未必等同于现代医学所界定的汉森病。
theological_decisions:
- issue: 如何译出神名 יְהוָה
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用以色列之神的专名。译作“雅威”直接呈现神名，并避免以称号取代专名。
- issue: 雅威使外邦亚兰得胜
  choice: 因为雅威曾借着他使亚兰得胜
  alternative: 因为雅威曾借着他拯救亚兰
  rationale: 原文明言亚兰的军事成功出于雅威，并以乃缦为媒介。译文不淡化这一关于雅威统管列国的神学张力，也不另行说明胜利针对何国。
translation_notes:
  register: 采用庄重而清晰的现代标准汉语。“在他主人眼中”“备受尊崇”体现宫廷语境；“大人物”保留 אִישׁ גָּדוֹל 的显赫地位含义，同时普通读者容易理解。转折词“却”突出乃缦的勇武显赫与疾病之间的叙事反差。脚注标记均放在其实际所解释的词语之后，而非沿用咨询层中错置的标记位置。
