base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: zh_hans
  text: 他的仆人上前来，对他说：“我父啊，先知若吩咐你做一件大事，你岂不去做吗？何况他对你说：‘洗一洗，就洁净[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“洗一洗，就得洁净。”原文可指变得洁净；在此处也带有得洁净的含义。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: 上前来
  rationale: 准确表达靠近、走近之意，在现代汉语叙事中自然，也体现仆人们趋前劝说的动作。
- source_word: עֲבָדָיו
  choice: 他的仆人们
  rationale: 此处指乃缦的下属或随从；“仆人”保留从属关系，又不武断强调其法律上的奴隶身份。
- source_word: אָבִי
  choice: 我父啊
  rationale: 保留希伯来文以“父亲”尊称上级的比喻和恭敬语气，并不表示亲生父子关系。
- source_word: דָּבָר גָּדוֹל
  choice: 一件大事
  rationale: 可涵盖重大、艰难或非凡的要求；“大事”保留原文概括性，不把含义缩窄为单纯的困难。
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: 你岂不会去做吗
  rationale: “岂不……吗”自然呈现预期肯定回答的反问语气。
- source_word: וְאַף כִּי
  choice: 何况
  rationale: 简明表达从较难之事推到较容易之事的加强论证。
- source_word: רְחַץ
  choice: 洗一洗
  rationale: 直接表达洗涤的命令；叠用形式符合现代汉语口吻，并突出命令的简单。
- source_word: וּטְהָר
  choice: 就洁净了
  rationale: 表达洗后成为洁净的结果，同时保留身体痊愈与洁净观念的双重余韵。
theological_decisions:
- issue: טהר在乃缦得医治语境中的含义
  choice: 就洁净了
  alternative: 就得洁净；就清洁了
  rationale: 原词可表示成为洁净或得到洁净，兼有身体病患消除和洁净状态恢复的含义。“洁净”保留这种张力，不限定为礼仪洁净，也不预先赋予后期神学含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“我父啊”刻意保留原文的尊称比喻；“何况”使由重到轻的反问逻辑清楚。脚注标记已置于相关短语之后。
