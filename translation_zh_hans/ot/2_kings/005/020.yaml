source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: zh_hans
  text: 但上帝之人以利沙的仆人基哈西说：“你看，我主人竟没有从乃缦这个亚兰人手中收下他带来的东西，放过了他。我指着永活的耶和华起誓[a]，我一定要追赶他，从他那里拿点东西。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“耶和华永活。”这是以耶和华的生命起誓的固定说法。
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: 仆人
  rationale: 这里指基哈西在以利沙身边的职分和从属关系；重点不在年龄，因此译作“仆人”比“年轻人”更贴切。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 上帝之人
  rationale: 这是先知的固定称号，直译既保留原文形式，也能让现代读者理解。
- source_word: הִנֵּה
  choice: 你看
  rationale: 保留基哈西说话时带有不满和强调的提示语气，且符合现代汉语。
- source_word: חָשַׂךְ ... מִקַּחַת
  choice: 没有……收下……就这样放过了
  rationale: 原结构既可突出“克制、不取”，也可表示因此“放过”乃缦；此译在自然汉语中同时呈现两层意思。
- source_word: אֲדֹנִי
  choice: 我主人
  rationale: 所指是基哈西的人间主人以利沙，不是上帝；“主人”准确体现主仆关系。
- source_word: הָאֲרַמִּי
  choice: 亚兰人
  rationale: 按希伯来文的族群名称翻译，避免使用容易带入后世地缘概念的“叙利亚人”。
- source_word: מִיָּדוֹ
  choice: 从……手里
  rationale: 保留原文具体意象，在中文中也可自然表示从某人那里接收东西。
- source_word: חַי יְהוָה
  choice: 永活的耶和华为证
  rationale: 这是以耶和华的永生起誓的固定公式；意译为现代中文誓言，正文脚注说明其直译。
- source_word: רַצְתִּי אַחֲרָיו
  choice: 我一定要追上他
  rationale: 完成式在誓言语境中表达坚决而即将采取的行动；“追上”比逐字译作“跑在他后面”自然。
- source_word: וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה
  choice: 从他那里拿点东西
  rationale: מְאוּמָה在肯定语境中指“某样东西”；“拿点东西”自然传达基哈西索取财物的意图。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 正文采用现代中文圣经读者熟悉的专名“耶和华”，而不以“主”这一称号替代神名；这也保留了原文起誓所直接呼求的对象。
- issue: חַי יְהוָה 的誓言功能
  choice: 永活的耶和华为证
  alternative: 耶和华永远活着
  rationale: 本句不是单纯陈述，而是起誓公式；正文明确其誓言功能，脚注保留较直译的形式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“这个亚兰人乃缦”略带基哈西轻蔑、不满的口吻；“没有……就这样放过了”兼顾原文“克制不取”和“饶过”的语义张力。
