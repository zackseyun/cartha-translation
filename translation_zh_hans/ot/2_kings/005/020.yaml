revisions:
- from: 但上帝之人以利沙的仆人基哈西说：“你看，我主人没有从这个亚兰人乃缦手里收下他带来的东西，就这样放过了他。永活的耶和华为证[a]，我一定要追上他，从他那里拿点东西。”
  to: 但上帝之人以利沙的仆人基哈西说：“你看，我主人竟没有从乃缦这个亚兰人手中收下他带来的东西，放过了他。我指着永活的耶和华起誓[a]，我一定要追赶他，从他那里拿点东西。”
  rationale: 修订不改变本节叙事意义：保留主人没有接受乃缦所带之物、因此饶过他的含义；以更自然且明确的汉语誓言表达对应“永活的耶和华”；并将“追上”改为不预断结果的“追赶”。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:15Z'
review_pass:
  verdict: revise
  source_fidelity: 译文整体准确传达了基哈西作为以利沙仆人的身分、对乃缦的称呼、以耶和华起誓，以及追赶并取些东西的意图。惟“追上他”比原文“跑/追在他后面”更明确地断言会赶上，宜改为“追赶他”。“没有……就这样放过了他”也使原文的“克制不取／饶过”关系略显累赘，并加入“就这样”的语气。
  naturalness: 正文总体庄重自然。“我指着永活的耶和华起誓”是现代标准汉语中清楚而自然的誓言表达，也比“永活的耶和华为证”更直接呈现该固定公式的言语功能。
  terminology: “上帝之人”“仆人”“亚兰人”“耶和华”均恰当。“乃缦这个亚兰人”的语序既可保留原文同位语结构，也可在语境中带出基哈西不满、轻蔑的指称口吻。
  issues:
  - severity: medium
    issue: “追上他”强化了原文动作的结果。
    rationale: רַצְתִּי אַחֲרָיו 表示跑着追赶他；上下文固然随后会追到，但本节动词本身不必明说成功赶上。
  - severity: low
    issue: “没有……就这样放过了他”表达稍显累赘，且“就这样”并非原文明确内容。
    rationale: חָשַׂךְ……מִקַּחַת 表示主人克制而没有收取所带来的礼物，因而饶过乃缦；汉语宜以“竟没有……，放过了他”简洁呈现该关系。
  - severity: low
    issue: 脚注的“耶和华是永活的”不如“耶和华永活”贴近希伯来语固定誓言公式。
    rationale: חַי־יְהוָה 字面是“耶和华活着／永活”；脚注可同时说明其为起誓用语。
  revised_text: 但上帝之人以利沙的仆人基哈西说：“你看，我主人竟没有从乃缦这个亚兰人手中收下他带来的东西，放过了他。我指着永活的耶和华起誓[a]，我一定要追赶他，从他那里拿点东西。”
  revised_footnotes:
  - marker: a
    text: 直译：“耶和华永活。”这是以耶和华的生命起誓的固定说法。
    reason: cultural_note
  revision_rationale: 修订不改变本节叙事意义：保留主人没有接受乃缦所带之物、因此饶过他的含义；以更自然且明确的汉语誓言表达对应“永活的耶和华”；并将“追上”改为不预断结果的“追赶”。
