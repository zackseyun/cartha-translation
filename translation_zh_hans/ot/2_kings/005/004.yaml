  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֹ֕א וַ/יַּגֵּ֥ד לַ/אדֹנָ֖י/ו לֵ/אמֹ֑ר כָּ/זֹ֤את וְ/כָ/זֹאת֙ דִּבְּרָ֣ה הַֽ/נַּעֲרָ֔ה אֲשֶׁ֖ר מֵ/אֶ֥רֶץ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/004.yaml
  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: zh_hans
  text: 于是，他进去禀告他的主人，说：“从以色列地来的那个女孩如此这般说了[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语惯用语，直译近似“如此又如此”或“这样那样”，表示概述她所说的话，并非逐字重复。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 他进去
  rationale: בוא可表示来、去或进入；此处叙事语境是他前去见主人并禀报，因此译为“进去”，既保留进入的意味，也不增添原文未明说的地点。
- source_word: וַיַּגֵּד
  choice: 禀告
  rationale: נגד的使役式表示告诉、报告、使人知道；对象是他的主人，现代汉语用“禀告”自然体现下属向上位者报告的语境。
- source_word: לַאדֹנָיו
  choice: 他的主人
  rationale: אָדוֹן可指主、主人或上位者。这里指乃缦的上位者；“他的主人”直接保留原文关系，又不把身份进一步具体化为原文此处未明说的“王”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 该固定引语公式用于引出直接话语，汉语译作“说”最自然。
- source_word: כָּזֹאת וְכָזֹאת
  choice: 如此这般
  rationale: 这是概述先前话语而不逐字复述的希伯来语惯用语。“如此这般”既保留其概述功能和重复形式，也符合庄重而可懂的现代汉语。
- source_word: דִּבְּרָה
  choice: 说了
  rationale: דבר是普通的“说、讲话”；“说了”在引述所报告的既往话语时自然。
- source_word: הַנַּעֲרָה
  choice: 那个女孩
  rationale: נַעֲרָה指女孩或年轻女子。本节词本身没有明说其婢女身份，因此不把该身份加进正文；“那个”使特指在汉语中更清楚。
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: 从以色列地来的
  rationale: 保留关系从句及אֶרֶץ“地、国土”的表达；汉语将修饰语前置，更为自然。
theological_decisions:
- issue: וַיָּבֹא的主语身份
  choice: 保留为“他”
  alternative: 明确译为“乃缦”
  rationale: 希伯来文只有隐含的阳性单数主语，虽可由上下文理解为乃缦，但正文用“他”避免把上下文推断写成此节明示内容。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体。“禀告”体现上下级关系；“如此这般”略带正式色彩，但仍是普通读者可理解的现代汉语，并能保留原文惯用语的形式与功能。
