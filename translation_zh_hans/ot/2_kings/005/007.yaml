  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: zh_hans
  text: 以色列王读了那封信，就撕裂衣服，说：“难道我是上帝，能使人死、使人活吗？他竟把一个人送到我这里，要我医好他的麻风病[a]！你们务要留意，看他分明是在向我寻衅[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语צָרַעַת可泛指严重的皮肤病，不一定专指现代医学所说的汉森病（麻风病）。
    reason: 说明原词较广的语义范围，避免过度确定具体病症。
  - marker: b
    text: 也可译作“他是在找借口对付我”或“他是在找机会攻击我”。
    reason: 原词可指寻找事端、机会或口实来敌对对方；具体侧重点并不完全确定。
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: 那封信
  rationale: 上下文指亚兰王送来的书面信息；现代汉语用“信”比“文书”或“卷册”更自然。“那”承接前文已经提到的信。
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: 就撕裂衣服
  rationale: 保留表示震惊、悲痛或恐慌的古代动作；“撕裂衣服”庄重而易懂。
- source_word: הַאֱלֹהִים אָנִי
  choice: 难道我是上帝
  rationale: 反问语气清楚地表达王自认没有掌管生死的神圣权能；“上帝”在此指独一的神，而非泛称某一神明。
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: 能使人死、使人活
  rationale: 保留希伯来文对称结构及掌管生死的庄严语气；补出“能”以符合汉语反问句法。
- source_word: שֹׁלֵחַ אֵלַי
  choice: 派人到我这里
  rationale: 结合本段情境，所派来的是乃缦；此译自然表达原文省略宾语的遣送动作，又不把动作误解为单指送信。
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: 要我治好一个人的麻风病
  rationale: אָסַף与表示脱离某种病况的介词结构连用，在这里意为使人摆脱疾病；汉语以“治好……病”表达最清楚。
- source_word: צָּרַעַת
  choice: 麻风病
  rationale: 沿用这一叙事中读者熟悉的传统译名，同时用脚注说明该希伯来词的范围比现代医学所称的汉森病更广。
- source_word: אַךְ דְּעוּ נָא וּרְאוּ
  choice: 你们务要留意，看
  rationale: “务要留意”传达אַךְ的强调作用和两个命令词要求仔细察看的语气；无需机械保留“请”，以免王的警告显得过于客套。
- source_word: מִתְאַנֶּה הוּא לִי
  choice: 他是在怎样找借口对付我
  rationale: 表达对方正在寻找事端、机会或口实来敌对自己的含义；“找借口对付我”符合现代汉语，又由脚注保留“寻衅”等可能语气。
theological_decisions:
- issue: 王的反问中הָאֱלֹהִים的所指
  choice: 难道我是上帝
  alternative: 难道我是神明
  rationale: 上下文把使人死、使人活视为神独有的权能；译作“上帝”保留以色列叙事中的独一神语境，但不扩展王所说的话。
- issue: צָּרַעַת的医学范围
  choice: 麻风病
  alternative: 严重皮肤病
  rationale: 正文保留传统且便于叙事连贯的名称，脚注则避免把古代希伯来词与现代医学的汉森病完全等同。
- issue: 生死权能的表述
  choice: 能使人死、使人活
  alternative: 能杀人、救活人
  rationale: 所选译法保存原文平行结构与神圣权能的张力，不把“使人活”限定为医治或复活中的某一种。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事体。“撕裂衣服”“使人死、使人活”保留经文的仪式感和对称性；王的直接引语则用自然的反问和警告语气。所有脚注标记均置于所说明的正文词组之后。
