revisions:
- from: 以色列王读了那封信，就撕裂衣服，说：“难道我是上帝，能使人死、使人活吗？这人竟派人到我这里，要我治好一个人的麻风病[a]！你们务要留意，看他是在怎样找借口对付我[b]。”
  to: 以色列王读了那封信，就撕裂衣服，说：“难道我是上帝，能使人死、使人活吗？他竟把一个人送到我这里，要我医好他的麻风病[a]！你们务要留意，看他分明是在向我寻衅[b]。”
  rationale: 修订仅澄清“送来一人并要求医治该人”的句法关系，并将末句改为更自然、且更贴近原文敌对性含义的“向我寻衅”。保留原有的神学用语、传统病名及医学语义范围脚注。
