  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: zh_hans
  text: 亚兰人的袭击队曾出动，从以色列地掳走了一个年幼的小姑娘[a]；这女孩就侍候乃缦的妻子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“一个小女孩”。希伯来语“年幼的小姑娘”强调她年纪幼小。
    reason: lexical_alternative
  - marker: b
    text: 字面为“她就在乃缦妻子的面前”，意思是她随侍、服侍乃缦的妻子。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם יָצְאוּ גְדוּדִים
  choice: 亚兰人曾成群出外劫掠
  rationale: “亚兰”在这里指亚兰人或其军队；复数动词和“队伍、袭击队”表明是多人行动。“成群出外劫掠”自然表达他们以袭击队形式出动的含义，也为掳人作俘虏的下文提供语境。
- source_word: וַיִּשְׁבּוּ
  choice: 掳走了
  rationale: 该动词特指掳获、带走俘虏；“掳走”比一般的“抓住”更准确，也符合现代汉语叙事。
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: 从以色列地
  rationale: 保留原文“地”的地理表达，而不简化为“从以色列”。
- source_word: נַעֲרָה קְטַנָּה
  choice: 一个年幼的小姑娘
  rationale: נַעֲרָה指女孩或少女，קְטַנָּה强调幼小；“年幼的小姑娘”保留两个词共同突出的年龄和弱小意味，不把她在乃缦家的仆役身份提前加入这个名词短语。
- source_word: וַתְּהִי לִפְנֵי
  choice: 她就侍候
  rationale: 字面为“她在……面前”，在此是随侍、服侍的惯用表达。“侍候”准确传达其实际职分，同时脚注保留字面形式。
- source_word: אֵשֶׁת נַעֲמָן
  choice: 乃缦的妻子
  rationale: 以自然的现代汉语所有格表达原文的构造关系。
