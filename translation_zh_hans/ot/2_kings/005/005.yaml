source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ אֲרָם֙ לֶךְ בֹּ֔א וְ/אֶשְׁלְחָ֥ה סֵ֖פֶר אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יֵּלֶךְ֩ וַ/יִּקַּ֨ח בְּ/יָד֜/וֹ עֶ֣שֶׂר כִּכְּרֵי כֶ֗סֶף וְ/שֵׁ֤שֶׁת אֲלָפִים֙ זָהָ֔ב וְ/עֶ֖שֶׂר חֲלִיפ֥וֹת בְּגָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: zh_hans
  text: 亚兰王说：“你去吧[a]，我会给以色列王送一封信。”于是，他去了，随身带着十他连得银子、六千枚金子[b]和十套衣服。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文是两个命令式，字面可译作“去，来”；这里很可能表示准许并催促他立即动身。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“六千金子”，没有明说所数的单位；正文为使汉语通顺而补出量词“枚”。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: 你去吧
  rationale: 原文连续使用两个命令式，直译为“去，来”，在此是准许并催促对方启程的惯用说法。正文采用自然的现代汉语表达，并以脚注保留其特殊形式。
- source_word: סֵפֶר
  choice: 一封信
  rationale: 在两国君王交涉的语境中，该词指书面信函；“一封信”准确而自然。
- source_word: בְּיָדוֹ
  choice: 随身带着
  rationale: 原文字面为“在他手中”，这里表达携带、持有；“随身带着”符合现代汉语，又不改变所携物品的含义。
- source_word: כִּכְּרֵי כֶסֶף
  choice: 他连得银子
  rationale: כִּכָּר 是古代的大重量单位。保留传统音译“他连得”，避免以不确定的现代重量换算代替原文。
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: 六千枚金子
  rationale: 原文只有“六千”和“金子”，未明说所数的单位。“枚”使汉语通顺，但不把单位具体判定为舍客勒。
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: 十套衣服
  rationale: 该短语指可替换的整套衣服；“十套衣服”比逐字译法自然，并保留礼物按套计数的含义。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 按希伯来地名 אֲרָם 译为“亚兰”，不以较后的地理名称“叙利亚”替代。
