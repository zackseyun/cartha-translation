base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: zh_hans
  text: 于是，基哈西追赶乃缦。乃缦看见他在后面跑来，就从战车上下来迎接他，说：“一切都好吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译可作“平安吗？”“平安”（shalom）在这里是问候或询问是否安好、事情是否顺利的惯用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: 追赶
  rationale: רדף表示在后追逐、追赶；此处突出基哈西有意赶上乃缦，但不额外赋予敌意。
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: 看见他在后面跑来
  rationale: 保留“看见”与正在进行的“跑”两个要素；“在后面跑来”符合现代汉语叙事，也明确基哈西正追着乃缦而来。
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: 从战车上下来
  rationale: נפל本义可指“落下”，但与车辆连用时可表示迅速下车；译作“下来”避免误解为意外摔落，同时不擅自强化为“跳下”。מֶרְכָּבָה译作“战车”。
- source_word: לִקְרָאתוֹ
  choice: 迎接他
  rationale: 该词组表示向某人而去与其相会；在此情境中，“迎接他”自然表达乃缦下车上前相见的动作。
- source_word: הֲשָׁלוֹם
  choice: 一切都好吗？
  rationale: שָׁלוֹם在这里是询问是否安好、事情是否顺利的惯用语；“一切都好吗？”在现代汉语中自然，并保留其概括性。
- source_word: וַ
  choice: 于是
  rationale: 句首连续式连接词推动叙事发展；“于是”自然承接上文行动。
theological_decisions: []
