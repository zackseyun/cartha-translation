  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: zh_hans
  text: 她对女主人说：“但愿我主人去见撒马利亚的那位先知！那位先知必会治好[a]我主人的麻风病[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “治好”所译的希伯来语动词基本意象是“收聚”；在这里与疾病连用，指使人脱离疾病、恢复健康。
    reason: lexical_alternative
  - marker: b
    text: “麻风病”所译的希伯来语 צָרַעַת 是传统称呼，所指范围可能比现代医学所说的汉森病更广，也可包括其他严重皮肤病。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: 女主人
  rationale: 指家中地位高于这名以色列少女的女性，即乃缦的妻子；“女主人”在现代汉语中清楚自然，也保留其社会关系。
- source_word: אַחֲלֵי
  choice: 但愿
  rationale: 表达强烈的愿望或期盼；“但愿”自然、庄重，并保留希伯来语的祈愿语气。
- source_word: אֲדֹנִי
  choice: 我的主人
  rationale: 少女以敬称指乃缦；“主人”既体现从属关系，也符合本段的家庭与奴仆语境。
- source_word: לִפְנֵי
  choice: 到……面前
  rationale: 保留“在某人面前”的希伯来语空间意象，同时以“到”表达所期盼的前往与会面。
- source_word: הַנָּבִיא
  choice: 那位先知
  rationale: 原文使用带定冠词的称号而没有直呼以利沙之名；“那位”符合少女向女主人提及特定人物的汉语表达。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 按标准地名译法处理；此处可指撒马利亚城或相应地点，正文不额外限定。
- source_word: אָז
  choice: 那样……就
  rationale: 清楚表达祈愿条件实现后所带来的结果，符合现代汉语句法。
- source_word: יֶאֱסֹף
  choice: 治好
  rationale: אָסַף的基本义与“收聚、除去”有关，此处与介词מִן及疾病连用，语境义是使人脱离疾病、得以痊愈。正文用自然的“治好”，脚注保留其字面意象。
- source_word: מִצָּרַעְתּוֹ
  choice: 他的麻风病
  rationale: 采用读者熟悉的传统圣经译称，同时用脚注说明צָרַעַת未必专指现代医学所称的汉森病，也可能泛指严重皮肤病。
theological_decisions:
- issue: 医治行动的施事者
  choice: 明确译作“先知就会治好”
  alternative: 仅用代词“他就会治好”
  rationale: 希伯来语动词的主语按近邻及语境是“先知”；明确名词可避免现代汉语中把代词误解为乃缦，同时没有把原文改成上帝直接施治的表述。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。“但愿”保留少女恳切的愿望；“到……面前”保留源文意象而不显生硬。正文不采用“把他从麻风病中收聚回来”之类字面译法，因为现代汉语难以理解，相关词义纹理放入脚注说明。
