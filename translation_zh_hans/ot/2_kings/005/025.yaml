base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: zh_hans
  text: 他进去，站在主人面前。以利沙问他：“基哈西，你从哪里来？”他回答：“仆人哪里也没有去。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּא
  choice: 他
  rationale: 希伯来语连词加代词承接叙事；中文无需机械译出“而/但”，上下文的转折可自然显现。
- source_word: בָא
  choice: 进去
  rationale: 该动词基本义为“来/进入”；结合基哈西回到以利沙面前的场景，译作“进去”自然地表达进入所在之处，但不额外指定房屋或房间。
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: 站在主人面前
  rationale: 保留侍立在上级面前的关系和动作，比“到主人那里站着”更符合现代汉语。
- source_word: אֲדֹנָיו
  choice: 主人
  rationale: 这里指基哈西在人际服侍关系中的上级以利沙，并非神圣称号；“主人”能准确反映该关系。
- source_word: מֵאָן
  choice: 你从哪里来
  rationale: 直译为“从哪里”，在此询问基哈西刚才的来处；中文“你从哪里来”既自然，也保留原文对来源的明确问法，避免将问题扩展为泛指行踪。
- source_word: גֵּחֲזִי
  choice: 基哈西
  rationale: 采用现代中文圣经中通行的人名译法。
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: 仆人……没有去
  rationale: 保留基哈西以“仆人”自称的谦卑、从属说法，不扁平化为“我”。
- source_word: אָנֶה וָאָנָה
  choice: 哪里也
  rationale: 该成语字面近于“这里或那里”，实际表示任何地方；“哪里也没有去”是自然中文，并保留全面否认的语气。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留“主人—仆人”的社会关系用语；对 מֵאָן 采取较贴近原文的“从哪里来”，对 אָנֶה וָאָנָה 则以自然汉语成语化表达。此节无需脚注。
