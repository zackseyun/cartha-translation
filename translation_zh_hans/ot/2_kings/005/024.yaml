base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: zh_hans
  text: 他来到山冈[a]，就从他们手中[b]接过那些东西，存放在屋里[c]。随后，他打发那些人离开，他们就走了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“土丘”或“设防的山冈”；希伯来文为“俄斐勒”。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文直译为“从他们的手”。
    reason: lexical_alternative
  - marker: c
    text: 或译“安放在屋里”或“收在屋里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: 山冈
  rationale: עֹפֶל可指高起之地、土丘或设防的山冈。此处依叙事语境取地形意义；“山冈”自然清楚，同时不把它无根据地当作专名。
- source_word: מִיָּדָם
  choice: 从他们手中
  rationale: 希伯来文直译为“从他们的手”，是表示直接从对方那里接取东西的惯用说法。“从他们手中”既保留原文意象，也符合现代汉语表达。
- source_word: וַיִּפְקֹד
  choice: 存放
  rationale: פקד语义范围较广，此处指把刚接过来的物品安置在屋内保管。“存放”贴合上下文，又不额外说明藏匿方式。
- source_word: בַּבָּיִת
  choice: 在屋里
  rationale: בית在此最自然地指作为存放地点的实体房屋；“在屋里”是简明自然的处所表达。
- source_word: הָאֲנָשִׁים
  choice: 那些人
  rationale: 原文用一般名词“人／男人”，没有在本节明确称他们为仆人；“那些人”保留这一概括称呼，并与前文所指人员自然衔接。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“接过那些东西”补出宾语所指，使汉语通顺；“随后”清楚呈现连续动作。保留原文笼统的第三人称“他”，不在本节正文中额外补入姓名。
