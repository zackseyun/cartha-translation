id: 2KI.5.8
reference: 2 Kings 5:8
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: zh_hans
  text: 神人以利沙听说以色列王撕裂了衣服，就派人去对王说：“你为什么撕裂衣服呢？请让那人到我这里来[a]，他就会知道以色列有先知。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “那人”指乃缦，不是以色列王。
    reason: 代词在中文中需明确其上下文所指，避免读者误以为以利沙请王前来。
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: 听说……就
  rationale: 希伯来语叙事结构交代以利沙听见消息后随即采取行动；现代汉语用“听说……就”自然呈现时间与事件推进，不另加原文没有的“现在”。
- source_word: אֱלִישָׁע
  choice: 以利沙
  rationale: 采用现代中文圣经传统中通行的人名译法。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经中指神之先知代表的固定称号；“神人”简洁且沿用已确立的中文表达，不把它弱化为仅指敬虔的人。
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: 撕裂了衣服
  rationale: קָרַע意为撕裂；这里指王因震惊、悲愤或忧 distress 而采取的惯常举动。中文直译清楚，且上下两处保持一致。
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ לֵאמֹר
  choice: 就派人去对王说
  rationale: 原文直说“差遣到王那里，说”；汉语需补出隐含的受差遣者，译为“派人去”属必要的语法明示，并未限定其具体身份。
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: 你为什么撕裂衣服呢？
  rationale: 保留直接质问；句末“呢”使现代汉语语气自然，同时不增添责备程度。
- source_word: יָבֹא נָא אֵלַי
  choice: 请让那人到我这里来
  rationale: 第三人称单数动词所指是乃缦，不是以色列王；נָא体现请求语气，译作“请”。“那人”自然明确隐含指代，同时脚注说明。
- source_word: וְיֵדַע
  choice: 他就会知道
  rationale: 未完成式在此表达预期的结果；“就会知道”自然保留行动与结果的关系。
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: 以色列有先知
  rationale: יֵשׁ表达存在；中文存在句“以色列有先知”简明自然，并保留以色列中确有神的先知这一重点。
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים的先知称号及神学含义
  choice: 译作“神人”，作为以利沙的既定先知称号。
  alternative: 属神的人；敬虔的人
  rationale: 该词组不只是描述个人品格，而是标明以利沙作为神之代表的先知身份。“神人”保留其称号性质，避免将含义缩减为一般敬虔。
- issue: “他就会知道”中第三人称的所指
  choice: 理解为前来求医治的乃缦。
  alternative: 理解为以色列王
  rationale: 紧邻的“请让他来”指乃缦，后续同一第三人称主语最自然地继续指乃缦；此处不把“知道”改写成特定的信仰宣认，以保留原文表述。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“神人”保留传统先知称号；“派人去对王说”符合现代汉语表达。唯一脚注标记[a]已置于相关指代之后。
