  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: zh_hans
  text: 但以利沙对他说[a]：“那人从车旁转身来迎接你时，我的心岂没有去吗？现在是收取银子、衣服、橄榄园、葡萄园、牛羊、男仆和女仆[b]的时候吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译：“我的心岂没有去吗？”也可理解为：“那人从车旁转身来迎接你时，我的心神不是也在那里吗？”
    reason: 说明希伯来语习语，并保留其对以利沙内在知悉或临在方式的含混性。
  - marker: b
    text: 也可译为“男奴和女奴”。
    reason: 原文用语可指仆役，也可强调其受奴役或受辖制的身份；保留这一词汇可能性。
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: 我的心岂没有跟着去吗
  rationale: 保留希伯来语“我的心去了”的鲜明意象，同时用“跟着”使现代汉语读者能自然理解这是以利沙内在的知悉或临在，而不把具体机制解释得过满。
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: 那人从车上转身迎接你的时候
  rationale: הָפַךְ 的基本意义是“转身、转向”；“从车上转身”贴近原文，并避免明确译成原文未直说的“下车”。“那人”保留 אִישׁ 的指称方式，不直接补出乃缦的名字。
- source_word: הָעֵת
  choice: 现在是……的时候吗
  rationale: 上下文具有责问语气；补出“现在”和疑问形式，符合现代汉语表达，并传达这个时机不宜求取财物的含义。
- source_word: לָקַחַת אֶת הַכֶּסֶף
  choice: 收取银子
  rationale: “收取”适合接受财物的语境；“银子”既保留 כֶּסֶף 的具体词义，也能自然表示钱财。
- source_word: בְּגָדִים
  choice: 衣服
  rationale: 现代汉语自然清楚，又准确表达一般性的衣物。
- source_word: זֵיתִים
  choice: 橄榄园
  rationale: 在与葡萄园、牲畜和仆婢并列的产业清单中，此词宜理解为橄榄树园，而非橄榄果实。
- source_word: כְרָמִים
  choice: 葡萄园
  rationale: 这是该词表示农业产业时的标准自然译法。
- source_word: צֹאן וּבָקָר
  choice: 牛羊
  rationale: 以汉语惯用的并列次序简洁表达小牲畜与大牲畜两类；语义范围得到保留。
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: 仆婢
  rationale: 简洁保留男性与女性役使者的区别，并符合庄重的叙事语体；其身份也可能译作奴仆，故以脚注说明。
theological_decisions:
- issue: “我的心去了”所表达的先知知悉方式
  choice: 保留“我的心……跟着去”的意象
  alternative: 意译为“我的心神不是也在那里吗”或“我在心里岂不知道吗”
  rationale: 原文没有解释以利沙如何得知此事。保留身体—内心意象，可避免把它固定解释为异象、灵魂离体或单纯推断。
- issue: עֲבָדִים וּשְׁפָחוֹת 的社会身份
  choice: 仆婢
  alternative: 男奴和女奴／奴仆
  rationale: 这些词可指受辖制的仆役乃至奴隶。正文采用自然而保留性别配对的“仆婢”，脚注提示较强调受奴役身份的译法，以免掩盖语义范围。
- issue: 责问所涵盖的清单范围
  choice: 将银子、衣服及其后所有产业都置于“现在是……的时候吗”的责问之下
  alternative: 把后半清单理解为基哈西打算用所得银子进一步购置的产业
  rationale: 希伯来语连续使用“收取”，随后列举多项财富；句法容许清单整体受责问支配，但未明确交代每项取得的具体方式，因此不额外补入“购买”。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“但以利沙对他说”补明说话者以避免汉语代词歧义；“收取”与连续产业清单保留先知责问的力度。正文中的脚注标记均与脚注对应。
