  terminology: “银子”“衣服”“橄榄园、葡萄园”“牛羊”均合适。“男仆和女仆”对应 עֲבָדִים וּשְׁפָחוֹת，并以脚注保留“男奴和女奴”的词汇替代，避免抹去其可能的受奴役含义。
