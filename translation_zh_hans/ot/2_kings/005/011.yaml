  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקְצֹ֥ף נַעֲמָ֖ן וַ/יֵּלַ֑ךְ וַ/יֹּאמֶר֩ הִנֵּ֨ה אָמַ֜רְתִּי אֵלַ֣/י יֵצֵ֣א יָצ֗וֹא וְ/עָמַד֙ וְ/קָרָא֙ בְּ/שֵׁם יְהוָ֣ה אֱלֹהָ֔י/ו וְ/הֵנִ֥יף יָד֛/וֹ אֶל הַ/מָּק֖וֹם וְ/אָסַ֥ף הַ/מְּצֹרָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: zh_hans
  text: 可是乃缦发怒，转身走了。他说：“我原以为：‘他一定会出来见我，站着求告雅威他上帝的名，并在患处上方挥动他的手，治好这个患麻风病的人[a]。’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “患麻风病的人”：原词也可按语境理解为“患这种皮肤病的人”。这里的“麻风病”是传统译法，所指不一定等同于现代医学所说的汉森病。前面的“治好”所译的希伯来语动词本义为“聚拢、收回”，在这里指除去病患、使人痊愈。
    reason: 说明הַמְּצֹרָע指患者，并保留אסף的特殊用词及疾病类别的不确定性。
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: 发怒
  rationale: קצף表示动怒、发怒；“发怒”自然凝练，又不额外强化为“暴怒”。
- source_word: וַיֵּלַךְ
  choice: 转身走了
  rationale: 这里指乃缦因生气而离去；“转身走了”体现离开的语境，比单说“走了”更清楚。
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: 我原以为
  rationale: 希伯来语直译近于“看哪，我对自己说”；现代汉语用“我原以为”自然表达他先前笃定而如今落空的预期。
- source_word: יֵצֵא יָצוֹא
  choice: 他一定会出来
  rationale: 不定式绝对形与限定动词并用，加强语气；“一定会”保留这种强调。
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: 求告雅威他上帝的名
  rationale: קרא בשם在此指呼求、求告神名；保留“名”的圣经表达，并将四字神名译作“雅威”。
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: 在患处上方挥动他的手
  rationale: הניף表示挥动；הַמָּקוֹם在语境中是患病之处。“上方”传达乃缦所设想的医治动作，同时不把动作具体化得过度。
- source_word: וְאָסַף הַמְּצֹרָע
  choice: 治好这个患麻风病的人
  rationale: הַמְּצֹרָע按其有定冠词的阳性单数形式，最直接指“患麻风病的人”；אסף本义为聚拢、收回，在此语境中表示除去其病患、使其痊愈。正文采用自然的功能性表达，脚注保留词义与句法上的说明。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”在现代汉语中较直接地音译该专名，不用称号取代它。
- issue: הַמְּצֹרָע所指的人与疾病类别
  choice: 患麻风病的人
  alternative: 麻风病；患严重皮肤病的人
  rationale: 该词的形态更自然地指患病者，而不是疾病本身；但圣经所谓“麻风病”不应自动等同于现代医学所称的汉森病，因此以脚注提醒其范围。
- issue: אסף在医治语境中的表达
  choice: 治好
  alternative: 除去；收回
  rationale: 直译“聚拢/收回患病者”在现代汉语中难以理解；上下文所指是使患者的病患消除，故正文译为“治好”，同时不据此增添具体医治机制。
translation_notes:
  register: 采用现代、庄重而口语顺畅的叙事语言。“我原以为”呈现乃缦落空的预期；引号层级清楚。避免把圣经疾病名称武断地等同于特定现代诊断。
