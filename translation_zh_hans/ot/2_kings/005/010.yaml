base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: zh_hans
  text: 以利沙就派一个使者去见他，说：“你去约旦河里洗七次，你的肌肤就会复原[a]，你也会洁净[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你的肉身就会恢复原状。”希伯来文直译为“你的肉身会回到你这里”，是恢复到原先健康状态的惯用表达。
    reason: lexical_alternative
  - marker: b
    text: 或译：“你也会被洁净。”这个动词可指变得洁净或得到洁净，在这里既有身体康复的含义，也可能带有礼仪洁净的意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派
  rationale: 叙事中表示差派某人前去；“派”简洁自然，准确表达动作。
- source_word: אֵלָיו
  choice: 去见他
  rationale: 介词和代词表示朝向乃缦；结合“派使者”，译作“去见他”符合现代汉语表达。
- source_word: מַלְאָךְ
  choice: 使者
  rationale: 本段明确指传话的人，而非天使；“使者”保留其受差遣传达信息的身份。
- source_word: לֵאמֹר
  choice: 说
  rationale: 这是希伯来语引出直接引语的常用公式，汉语以“说”自然承接。
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: 你去……洗
  rationale: 这一结构在此具有命令语气；译文保留“去”和“洗”的动作次序。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 直接保留明确的次数。
- source_word: בַּיַּרְדֵּן
  choice: 约旦河里
  rationale: 专名指约旦河；补出“河”符合现代汉语习惯，“里”表达在河水中洗。
- source_word: וְיָשֹׁב
  choice: 就会复原
  rationale: 基本义是“返回”，与“肌肤”连用时表达恢复到原先健康状态；“复原”自然传达这一惯用意义。
- source_word: בְּשָׂרְךָ לְךָ
  choice: 你的肌肤
  rationale: בשר本义为肉身、肉体；在皮肤病的语境中，“肌肤”保留具体的身体意象，也比逐字译作“肉身回到你这里”更自然。表示归还于本人的לְךָ，其语义已由“复原”体现。
- source_word: וּטְהָר
  choice: 你也会洁净
  rationale: טהר可表示变得洁净或纯净；“洁净”既能指身体上的病症消除，也保留礼仪洁净的潜在意味。
theological_decisions:
- issue: בשר应保留具体的“肉身”意象，还是按皮肤病语境译作“肌肤”
  choice: 肌肤
  alternative: 肉身
  rationale: “肌肤”在本段医治语境中自然明确，同时仍保留希伯来文具体的身体性表达；脚注注明更贴近字面的说法及其惯用含义。
- issue: טהר应译作状态性的“洁净”，还是被动性的“被洁净”
  choice: 你也会洁净
  alternative: 你也会被洁净
  rationale: 原文形式可表达进入洁净状态；采用“会洁净”不限定施事，既适合身体康复语境，也不排除礼仪洁净的含义。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“派一个使者去见他”符合汉语差遣场景；引语保持简明命令语气。以“肌肤复原”和“洁净”区分身体恢复与洁净状态，同时借脚注保留希伯来文的字面表达和语义张力。
