base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: zh_hans
  text: 于是他下去，照着神人的话，把自己浸在约旦河里七次[a]。他的肌肤恢复了，像小孩子的肌肤一样，他就洁净了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“把自己浸入水中”。希伯来语动词可指浸入或浸没。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 于是他下去
  rationale: 叙事性连接词推进情节，同时承接上文乃缦最终听从劝告的结果；“下去”保留具体的移动方向。
- source_word: וַיִּטְבֹּל
  choice: 浸了
  rationale: טבל表示蘸入或浸入；“浸”自然地表达他亲自在河水中反复进行的动作，又不额外规定动作的具体方式。
- source_word: בַּיַּרְדֵּן
  choice: 在约旦河里
  rationale: 采用现代汉语通行地名“约旦河”，并以“里”明确动作发生于河水中。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七次
  rationale: 直接保留重复动作的确切次数。
- source_word: כִּדְבַר אִישׁ הָאֱלֹהִים
  choice: 照着神人的话
  rationale: “照着……的话”既贴近כדבר，又表达乃缦依照先知所说的去做；“神人”保留希伯来圣经中的先知称号。
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: 他的肉复原了
  rationale: שׁוב本义为返回，在此表示身体恢复原状；保留“肉”以对应בשר及下句重复出现的具体身体意象。
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: 像幼童的肉一样
  rationale: נער קטן强调年幼；“幼童”不武断限定到比原文更窄的年龄或性别，同时保留鲜明的比较。
- source_word: וַיִּטְהָר
  choice: 他就洁净了
  rationale: 该动词表达变得洁净或得到洁净的结果；“洁净了”兼顾身体恢复与洁净观念，而不单纯改写为医学性的“痊愈”。
theological_decisions:
- issue: 乃缦恢复的性质
  choice: 同时保留身体复原与成为洁净这两个层面
  alternative: 仅译为“痊愈”，或用更强的礼仪术语突出礼仪洁净
  rationale: 原文先说他的肉复原，继而说他洁净了；译文不把这两层含义归并为纯医学或纯礼仪性的陈述。
- issue: 洁净动词的语态与结果性
  choice: 译作“他就洁净了”
  alternative: “他被洁净了”或“他是洁净的”
  rationale: וַיִּטְהָר可表示变得洁净，也可从结果角度理解。中文“洁净了”保留结果和状态变化，不强行指定外在施事者。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“神人”保留传统且准确的圣经称号；“肉复原了”有意保存原文的具体身体意象。主文中的[a]与脚注对应。
