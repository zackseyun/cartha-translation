  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ נַעֲמָן֒ וָ/לֹ֕א יֻתַּן נָ֣א לְ/עַבְדְּ/ךָ֔ מַשָּׂ֥א צֶֽמֶד פְּרָדִ֖ים אֲדָמָ֑ה כִּ֡י לֽוֹא יַעֲשֶׂה֩ ע֨וֹד עַבְדְּ/ךָ֜ עֹלָ֤ה וָ/זֶ֨בַח֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים כִּ֖י אִם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: zh_hans
  text: 乃缦说：“若不然，求你让人给你仆人一对骡子所能驮的土[a][c]；因为你仆人从今以后不再向别神献燔祭和祭物，只向耶和华献祭[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“给你仆人一对骡子所能驮的一载土”。原文所说的是一对骡子能够驮运的土量。
    reason: lexical_alternative
  - marker: b
    text: “耶和华”所对应的希伯来文是神的名字YHWH，也常拟音为“雅威”。
    reason: alternative_reading
  - marker: c
    text: 乃缦索取以色列的土，可能反映古代人把神明与特定土地联系起来的观念，也可能是想在以色列的土上敬拜耶和华；经文本身没有明说原因。
    reason: cultural_note
lexical_decisions:
- source_word: וָלֹא
  choice: 既然你不肯收
  rationale: 这是对上一节以利沙拒收礼物的省略式回应。中文补出语境中隐含的“收”，比直译为“若不”更自然清楚，同时没有改变条件性回应的含义。
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: 求让人给你仆人
  rationale: 保留被动、委婉的请求语气以及乃缦自称“你仆人”的谦敬表达，避免改成直接命令“请给我”。
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: 一些土，数量是一对骡子所能驮的
  rationale: אֲדָמָה在这里指可以运走的土；מַשָּׂא צֶמֶד פְּרָדִים说明其数量，即一对骡子所能负载的量。这样的译法比生硬的“一对骡子的驮载”更符合现代汉语。
- source_word: עֹלָה וָזֶבַח
  choice: 燔祭或祭物
  rationale: “燔祭”准确对应עֹלָה；זֶבַח是较广义的祭牲或祭献，译为“祭物”既清楚，也不把它过度限定为某一种祭。
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: 向别神
  rationale: 介词ל表示祭献的对象；“向别神献”是自然且准确的现代汉语表达。
- source_word: כִּי אִם לַיהוָה
  choice: 只献给耶和华
  rationale: כִּי אִם表达强烈的排他关系；“只……给……”清楚传达乃缦以后专一敬拜YHWH的承诺。
- source_word: יהוה
  choice: 耶和华
  rationale: 采用现代中文圣经读者最熟悉的神名音译“耶和华”，并在脚注说明原文为四字神名YHWH及另一常见拟音“雅威”。
theological_decisions:
- issue: 如何处理神名יהוה
  choice: 正文译作“耶和华”
  alternative: “雅威”或“上主”
  rationale: 原文直接使用四字神名YHWH。正文保留专名而不以称号取代；“耶和华”在简体中文读者中辨识度最高，其他形式在脚注交代。
- issue: 乃缦索取以色列泥土的动机
  choice: 正文只陈述请求，不解释动机
  alternative: 明确解释为搭建祭坛，或认为只能在以色列土地上敬拜耶和华
  rationale: 经文把索取泥土与以后只向耶和华献祭并列，却没有明确说明泥土的具体用途或乃缦的观念；因此不应在正文中替作者消除这一含混之处。
- issue: 乃缦专一献祭的宣告
  choice: 译为“不再向别神……只献给耶和华”
  alternative: 将其扩展解释为完整、成熟的以色列信仰告白
  rationale: 译文保留原文明确表达的祭祀专一性，但不额外断定乃缦此时对信仰的一切理解与实践。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。“你仆人”保留古代谦敬自称；“燔祭”作为必要的祭祀术语予以保留。句法适度顺应中文，但没有把泥土的用途或乃缦的神学认识写进正文。
