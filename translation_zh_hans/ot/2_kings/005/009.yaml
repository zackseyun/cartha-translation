  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: zh_hans
  text: 于是，乃缦带着他的车马[a]来到，站在以利沙家的门口。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“带着他的马和他的车”；两个词都是单数形式，但在这里很可能具有集合意义，因此译作“车马”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来到
  rationale: בוא在连续叙事中表示乃缦抵达以利沙所在之处；“来到”自然保留了叙事的移动与到达意味。
- source_word: נַעֲמָן
  choice: 乃缦
  rationale: 采用现代中文圣经读者熟悉的人名译法。
- source_word: בְסוּסוֹ וּבְרִכְבּוֹ
  choice: 带着他的车马
  rationale: 原文“马”和“车”均为单数形式，但在此语境中很可能具有集合意义。“车马”既符合现代汉语习惯，也能表现随行阵势，同时由脚注保留原文形式。
- source_word: וַיַּעֲמֹד
  choice: 站在
  rationale: עמד的基本义为“站立”；此处描写乃缦停身于屋外的位置，“站在”比“停在”更能保留原文的画面感。
- source_word: פֶּתַח הַבַּיִת
  choice: 家的门口
  rationale: פֶּתַח指开口、入口；用于房屋时，“门口”是自然准确的现代汉语表达。
- source_word: לֶאֱלִישָׁע
  choice: 以利沙家
  rationale: 此处介词ל表达房屋与以利沙的归属或关联关系，中文以“以利沙家”自然呈现。
