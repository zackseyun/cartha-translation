id: 2KI.5.6
reference: 2 Kings 5:6
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: zh_hans
  text: 他把信带到以色列王那里。信上说：“现在，这封信送到你那里时，你要知道，我已派我的仆人乃缦到你那里，好让你治好他的皮肤病。[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “治好他的皮肤病”原文用了一个不寻常的说法，直译近似“把他从他的皮肤病中收回来”。“皮肤病”也常译作“麻风病”，但原词所指不一定是现代医学所说的汉森病。
    reason: 说明异常的希伯来表达，并保留传统疾病名称这一词义选择。
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 他把……带到
  rationale: 使役式以“信”为宾语，表示把信带到王那里；这样既贴近原文，也符合现代汉语表达。
- source_word: הַסֵּפֶר
  choice: 信
  rationale: 此处指一国君王送交另一国君王的书面信息，译作“信”最自然。
- source_word: לֵאמֹר
  choice: 信上说
  rationale: 按外交书信语境自然呈现引语公式，同时避免生硬直译为“说”。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 保留书信中推进话语的正式标记；汉语无需机械添加“而”。
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: 这封信送到你那里时
  rationale: כְּ 加不定式在此表达时间关系；“送到”符合信件抵达收信人的汉语习惯。
- source_word: הִנֵּה
  choice: 你要知道
  rationale: 在王室书信中起提示、强调下文的作用；“你要知道”比“看哪”更符合现代汉语书信语体。
- source_word: שָׁלַחְתִּי
  choice: 我已派
  rationale: 完成式在书信情境中表示已经差派且其结果与收信时相关；对人用“派”比“送”自然。
- source_word: נַעֲמָן
  choice: 乃缦
  rationale: 采用中文圣经传统中通行且易辨识的人名译法。
- source_word: עַבְדִּי
  choice: 我的仆人
  rationale: 保留王室语境中对臣属的称呼，不武断限定为奴隶或官员。
- source_word: וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: 好让你治好他的皮肤病
  rationale: אָסַף 的通常意义是“收聚、收回”，但此处与 מִן 加疾病连用，是不寻常的表达，语境所指为使乃缦脱离疾病。正文译出自然语义，脚注保留原文的具体措辞与异常性。
- source_word: צָרַעַת
  choice: 皮肤病
  rationale: 该希伯来词涵盖的病症不等同于现代医学所说的汉森病；“皮肤病”避免造成过度精确的医学判断。
theological_decisions:
- issue: צָרַעַת 的疾病范围
  choice: 皮肤病
  alternative: 麻风病
  rationale: 原词所指范围比现代汉森病更广。正文采用较宽泛的称谓，既避免时代错置，也不改变叙事中需要医治的严重病况。
- issue: אָסַף מִן 的异常表达
  choice: 正文按语境译为“治好……”，脚注说明字面措辞
  alternative: 把他从他的皮肤病中收回来
  rationale: 直译在现代汉语中难以理解，却不宜完全掩盖原文的特殊表达；正文与脚注结合，兼顾可读性和原文张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事与王室书信语体。“你要知道”传达 הִנֵּה 的提示功能；不使用较古雅的“看哪”。脚注标记紧接其所说明的病症与医治表达。
