  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יָּשָׁב֩ אֶל אִ֨ישׁ הָ/אֱלֹהִ֜ים ה֣וּא וְ/כָֽל מַחֲנֵ֗/הוּ וַ/יָּבֹא֮ וַ/יַּעֲמֹ֣ד לְ/פָנָי/ו֒ וַ/יֹּ֗אמֶר הִנֵּה נָ֤א יָדַ֨עְתִּי֙ כִּ֣י אֵ֤ין אֱלֹהִים֙ בְּ/כָל הָ/אָ֔רֶץ כִּ֖י אִם בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּ֛ה קַח נָ֥א בְרָכָ֖ה מֵ/אֵ֥ת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: zh_hans
  text: 于是，乃缦和他所有的随从都回到神人那里；他来到神人面前，站在那里，说：“现在我确实知道，在全地上，除了在以色列以外，再没有神。现在，请收下你仆人的一份礼物[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “礼物”直译为“祝福”；这里指赠送的礼物。
    reason: 保留 בְרָכָה 的字面义，同时说明其在本语境中的惯用含义。
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来文对先知或神之使者的固定称谓。“神人”保留原文惯用语及其叙事呼应，不将其解释性扩写为“神的先知”。
- source_word: מַחֲנֵהוּ
  choice: 跟随他的全队人马
  rationale: 本义为“他的营队”，此处指随乃缦同行的一整队随从；这一译法自然地表达集体和随行之意，也避免让人误以为这里只是在说营地。
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: 来到神人面前，站着
  rationale: 保留原文“来到”与“站在他面前”的连续动作；为避免现代汉语代词指向含混，重复“神人”。
- source_word: הִנֵּה נָא
  choice: 现在我确实知道
  rationale: 该组合用于强调并引起注意。汉语不宜机械译作“看哪，现在”；以“现在……确实”结合后面的动词，表达乃缦此刻郑重确认的语气。
- source_word: יָדַעְתִּי
  choice: 我确实知道
  rationale: 完成式表达由新近经历而形成的当前认识；“确实知道”既自然，又传达领悟后的确认。
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: 普天下除了以色列，再没有神
  rationale: “普天下”体现 הָאָרֶץ 在此处的广泛范围；译文直接保留原文强烈的排他性宣告，不加以弱化或系统化。
- source_word: בְּיִשְׂרָאֵל
  choice: 除了以色列
  rationale: 原文直说“在以色列”，并未说“除了以色列的神”；因此保留其地点表达，不补入原文没有的限定语。
- source_word: בְרָכָה
  choice: 一份礼物
  rationale: 该词字面义为“祝福”，但在赠送物品的语境中惯指礼物或赠礼。正文采用现代汉语中清楚自然的语境义，字面义收入脚注。
- source_word: עַבְדֶּךָ
  choice: 你仆人
  rationale: 此处是乃缦在直接对话中的谦称，并不突出受奴役的身份；“你仆人”保留恭敬、自谦的语体。
- source_word: קַח נָא
  choice: 请收下
  rationale: 原义为“请拿取”，在献礼语境中表示请求对方接受，因此“请收下”最合现代汉语表达。
theological_decisions:
- issue: 乃缦宣认除了以色列以外再没有神
  choice: 按原文直译为“普天下除了以色列，再没有神”
  alternative: 译作“普天下除了以色列的神，再没有别的神”或用较弱的泛称处理
  rationale: 原文作出强烈而直接的独一神宣认，同时使用地点短语“在以色列”。译文保留这两点，不削弱其宣认，也不补写成“以色列的神”，以免消除原文表达中的张力。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“神人”保留列王纪中的传统称谓；“全队人马”表现随行队伍而不显生硬。引语保持乃缦郑重宣认和谦恭献礼的语气。
