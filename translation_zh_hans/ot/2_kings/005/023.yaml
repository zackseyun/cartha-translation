  text: וַ/יֹּ֣אמֶר נַעֲמָ֔ן הוֹאֵ֖ל קַ֣ח כִּכָּרָ֑יִם וַ/יִּפְרָץ בּ֗/וֹ וַ/יָּצַר֩ כִּכְּרַ֨יִם כֶּ֜סֶף בִּ/שְׁנֵ֣י חֲרִטִ֗ים וּ/שְׁתֵּי֙ חֲלִפ֣וֹת בְּגָדִ֔ים וַ/יִּתֵּן֙ אֶל שְׁנֵ֣י נְעָרָ֔י/ו וַ/יִּשְׂא֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: zh_hans
  text: 乃缦说：“请收下两他连得[a]吧。”他再三催促基哈西收下，就把两他连得银子装在两个袋子里，扎好，并附上两套衣服，交给自己的两个仆人；他们在基哈西前面搬运这些东西。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “他连得”是古代重量单位；其实际重量因地区和时期的标准而异。
    reason: cultural_note
  - marker: b
    text: 原文直译为“他们在他前面搬运”；按上下文，这里的“他”指基哈西。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: 请收下……吧
  rationale: הוֹאֵל在命令式קַח之前表达恳请、劝请；“请收下……吧”既体现礼貌催促，也符合现代汉语赠礼语境。
- source_word: כִּכָּרָיִם
  choice: 两他连得
  rationale: כִּכָּר是古代重量单位；采用中文圣经读者较熟悉的音译“他连得”，并以脚注解释其性质和大致重量。
- source_word: וַיִּפְרָץ בּוֹ
  choice: 他再三催促基哈西收下
  rationale: 该表达指乃缦竭力劝基哈西接受；“再三催促”自然传达持续施压之意，补出基哈西及“收下”以避免汉语代词含混。
- source_word: וַיָּצַר
  choice: 装进……袋子，扎好
  rationale: 动词表示包裹、捆扎或牢牢收好；结合后面的חֲרִטִים，以“装进……袋子，扎好”清楚呈现动作。
- source_word: חֲרִטִים
  choice: 袋子
  rationale: 该词指盛放钱财的袋或囊；“袋子”宽泛、自然，不对容器的大小和形制过度限定。
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: 两套衣服
  rationale: 此短语指两份可供更换的整套衣物；“两套衣服”是简明自然的现代汉语。
- source_word: שְׁנֵי נְעָרָיו
  choice: 自己的两个仆人
  rationale: נַעַר可指年轻人、侍从或仆人；此处二人受乃缦差遣搬运礼物，译作“仆人”最贴合其职分。
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: 他们就在基哈西前面替他扛着
  rationale: לְפָנָיו直译为“在他前面”；上下文表明仆人在基哈西前面搬运礼物。“扛着”符合银子和衣物较重、需由人搬运的场景。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“再三催促”呈现乃缦坚持让基哈西多收银子的语气；计量单位保留传统音译并加文化脚注。为使动作关系清楚，正文明确写出基哈西，同时用脚注保留原文代词形式。
