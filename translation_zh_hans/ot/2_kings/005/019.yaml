  yaml_path: translation/ot/2_kings/005/019.yaml
  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: zh_hans
  text: 以利沙对他说：“你平安地去吧。”乃缦离开他，走了一段路[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“一程”。希伯来语这一表达指一段行程或距离，并未说明确切长度。
    reason: 说明原文距离用语并非精确计量，并保留可行的译法。
lexical_decisions:
- source_word: וַיֹּאמֶר לֹו
  choice: 以利沙对他说
  rationale: 希伯来文直译为“他对他说”；按上下文明确说话者是以利沙，补出姓名可避免现代汉语中连续代词造成的混淆，并未增加新的解释。
- source_word: לֵךְ לְשָׁלוֹם
  choice: 你平安地去吧
  rationale: 这是带有祝愿意味的惯用送别语。“平安地去吧”既保留שָׁלוֹם的词义，也不把这句话扩展为对乃缦先前所述行为的明确赞同或反对。
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: 乃缦离开他，走了
  rationale: 叙事动词表示乃缦从以利沙那里离去并继续前行；补出“乃缦”使指代清楚，“离开他”保留מֵאִתּוֹ所表达的离开其所在之处。
- source_word: כִּבְרַת־אָרֶץ
  choice: 一段路
  rationale: 该词组表示一段行程或距离，但没有给出精确长度。“一段路”是自然的现代汉语，也避免用“很远”等措辞夸大距离。
theological_decisions:
- issue: 以利沙对乃缦所提临门庙之事的回应是否构成明确认可
  choice: 仅译作“你平安地去吧”
  alternative: 译成明确准许或明确谴责乃缦所述行为的话
  rationale: 希伯来文只有惯用的祝福兼送别语，没有明说认可或反对。译文保留这种简洁及其神学张力，不替经文作出判定。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。为避免“他对他说……他离开他”的代词歧义，依据上下文补出以利沙和乃缦的姓名；送别语保持简洁，不作神学扩写。
