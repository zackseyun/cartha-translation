  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: zh_hans
  text: “亚罢拿[a]和法珥法这两条大马士革的河，不比以色列一切的水都好吗？我岂不能在其中洗而洁净吗？”于是他转身离去，怒气冲冲。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚罢拿”另有传统形式作“亚玛拿”。
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: 不……吗？／不能……吗？
  rationale: 这是期待肯定回答的反问语气；按两个分句的汉语习惯分别表达。
- source_word: טוֹב ... מִכֹּל
  choice: 比……所有的水都好
  rationale: מִן构成比较，טוֹב在此需译出比较义；同时保留“所有”的总体表达。
- source_word: אבנה
  choice: 亚罢拿
  rationale: 依马所拉文本所保存的地名形式音译；另一传统形式在脚注说明。
- source_word: וּפַרְפַּר
  choice: 和法珥法
  rationale: 按希伯来语专名音译，并以自然汉语连接两个并列河名。
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: 大马士革的河
  rationale: 自然表达其属格关系，也明确两个名称都是河名。
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: 比以色列所有的水
  rationale: 保留原文较宽泛的“水”，不擅自缩窄为“河流”。
- source_word: אֶרְחַץ בָּהֶם
  choice: 在那些河里洗一洗
  rationale: רחץ表示洗或沐浴；“洗一洗”符合乃缦带有不满的反问口吻。“那些河”清楚回指两条河。
- source_word: וְטָהָרְתִּי
  choice: 就洁净了
  rationale: 保留身体痊愈与洁净观念的重叠，不限定为礼仪性或神学性的“得洁净”。
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: 于是他转身离去
  rationale: 逐一体现“转身”和“走去”，同时符合现代汉语叙事表达。
- source_word: בְּחֵמָה
  choice: 怒气冲冲
  rationale: 体现חֵמָה的强烈愤怒，比一般的“生气”更有力度。
theological_decisions:
- issue: 洁净用语的性质
  choice: 洁净
  alternative: 痊愈／得洁净／被洁净
  rationale: 上下文涉及乃缦的皮肤病，但טהר也可带有更广的洁净含义。“洁净”保留身体状况与洁净观念之间的张力，不把经文限定为单纯医疗痊愈或礼仪净化。
translation_notes:
  register: 采用现代、庄重而口语可懂的叙事语言。两个反问句保留乃缦自信且愤怒的语气；“怒气冲冲”自然传达强烈怒意。主文中的脚注标记[a]与脚注相对应。
