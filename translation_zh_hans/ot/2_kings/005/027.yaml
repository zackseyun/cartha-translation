  text: וְ/צָרַ֤עַת נַֽעֲמָן֙ תִּֽדְבַּק בְּ/ךָ֔ וּֽ/בְ/זַרְעֲ/ךָ לְ/עוֹלָ֑ם וַ/יֵּצֵ֥א מִ/לְּ/פָנָ֖י/ו מְצֹרָ֥ע כַּ/שָּֽׁלֶג־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/027.yaml
  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: zh_hans
  text: “因此，乃缦的皮肤病必缠上你和你的后代，直到永远。”他就从以利沙面前出去，患着这种皮肤病[a]，白得像雪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 传统译作“乃缦的大麻风必缠上你……他长了大麻风，白得像雪”。希伯来语 צָרַעַת 和 מְצֹרָע 指一类皮肤病或皮肤状况，不一定是现代医学所说的麻风病（汉森病）。
    reason: 说明传统译法及原文词义范围，避免读者将其误解为一种确定的现代医学诊断。
lexical_decisions:
- source_word: צָרַעַת
  choice: 皮肤病
  rationale: 该词泛指一类严重的皮肤疾患或礼仪上使人不洁的皮肤状况，并不等同于现代医学所说的麻风病；“皮肤病”既避免误诊式的精确化，也符合现代汉语。
- source_word: נַעֲמָן
  choice: 乃缦
  rationale: 采用现代中文圣经读者熟悉的人名音译。
- source_word: תִּדְבַּק
  choice: 必缠上
  rationale: דבק表示紧贴、附着；“缠上”保留咒诅中疾病持续附着的鲜明意象，“必”体现未完成式在此处的确定预告。
- source_word: וּבְזַרְעֲךָ
  choice: 和你的后代
  rationale: זֶרַע在这里指人的后裔；“后代”比字面的“种子”自然，也准确表达群体延续。
- source_word: לְעוֹלָם
  choice: 直到永远
  rationale: 在审判宣告中表示持续不止；此译法自然、庄重，并保留原文强烈而未加限定的措辞。
- source_word: וַיֵּצֵא מִלְּפָנָיו
  choice: 他就从以利沙面前出去
  rationale: 原文直译为“他从他面前出去”；中文明确补出上下文所指的以利沙，避免代词指向含混，同时保留离开其面前的具体动作。
- source_word: מְצֹרָע
  choice: 患着这种皮肤病
  rationale: 该词与צָרַעַת同属一个词义范围；“这种”清楚回指前句乃缦的皮肤病，并避免使用可能被理解为现代汉森病的“大麻风”。
- source_word: כַּשָּׁלֶג
  choice: 白得像雪
  rationale: 原文为“像雪”；结合皮肤病的可见表现，汉语用“白得像雪”自然地表达隐含的比较点，没有改变其内容。
theological_decisions:
- issue: צָרַעַת／מְצֹרָע所指疾病的性质
  choice: 正文译作“皮肤病／患着这种皮肤病”
  alternative: 传统译作“大麻风／长了大麻风”
  rationale: 经文明确把它描述为上帝施行的惩罚，并宣告将延及基哈西的后代，却没有把这种病等同于现代医学的汉森病。采用范围较宽的译法，避免把原文没有给出的特定诊断带入经文；传统说法在脚注中保留。
- issue: לְעוֹלָם在后代受罚宣告中的力度
  choice: 保留“直到永远”
  alternative: 意译为“世世代代”或加以时间限制
  rationale: 原文采用强烈且未限定的持续性表述。译文不替经文解决这项审判宣告所带来的神学张力，也不擅自缩小其范围。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。“必缠上”保留审判宣告的力度和原文附着意象；“患着这种皮肤病，白得像雪”兼顾前后词汇关联与自然汉语。脚注标记[a]已置于正文相应词语之后。
