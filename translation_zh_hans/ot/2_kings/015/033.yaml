  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְרוּשָׁ֖א בַּת צָדֽוֹק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: zh_hans
  text: 他登基时二十五岁，在耶路撒冷作王十六年。他母亲名叫耶路沙，是撒督的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: 二十五岁
  rationale: 这是希伯来语表达年龄的惯用语；现代汉语无需直译为“二十五岁之子”。
- source_word: הָיָה בְמָלְכוֹ
  choice: 登基时
  rationale: 该王室纪年句式说明即位时的年龄；“登基时”简洁、自然，并准确传达其功能。
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: 作王十六年
  rationale: 保留统治年数的直接陈述，同时采用自然的现代汉语语序。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 采用该地名通行的现代汉语译名，并保留介词意义。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 以自然现代汉语表达希伯来语的姓名介绍公式，不损失信息。
- source_word: יְרוּשָׁא
  choice: 耶路沙
  rationale: 按希伯来语人名 Yerusha 音译，并采用中文圣经语境中自然、易辨识的形式。
- source_word: בַּת צָדוֹק
  choice: 是撒督的女儿
  rationale: 直接保留亲属关系；“撒督”采用通行的中文圣经人名译法。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语，保留列王纪王室纪年公式的简洁性。英文脚注所述 Jerusha/Jerushah 只是英语拼写差异，在简体中文译文中没有对应的实质性异文，故不设脚注。
