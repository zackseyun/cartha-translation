source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: zh_hans
  text: 他在耶和华眼中行恶。他一生没有转离尼八的儿子耶罗波安[a]的那些罪；耶罗波安藉着这些罪使以色列犯罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“尼八的儿子耶罗波安，就是那使以色列犯罪的人。”希伯来语的关系从句也可理解为修饰“耶罗波安”，而不是“那些罪”。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 采用《列王纪》中常见的君王评语表达；“行……恶的事”既保留“行”的动作性，也符合现代汉语习惯。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性比喻，并以自然汉语表达神的判断。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代简体中文圣经读者熟悉的神名音译，而不以“主”这一称号代替专名。
- source_word: לֹא סָר מֵעַל
  choice: 没有转离
  rationale: סור表示转开、离开；“转离”保留方向性隐喻，并在本语境中表达没有弃绝罪恶道路。
- source_word: חַטֹּאות
  choice: 那些罪
  rationale: 直接保留复数含义；指与耶罗波安相关、使以色列陷入罪中的罪。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 按现代中文惯例音译人名，并清楚表达父子关系。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 用来使以色列犯罪的
  rationale: החטיא为使役式，故译出“使……犯罪”；正文把关系从句与前述“罪”紧密相连，同时保留耶罗波安为使役者。
- source_word: כָּל יָמָיו
  choice: 他一生都
  rationale: 表达整个在世期间持续如此；前置后可自然修饰“没有转离”，避免句末归属不清。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 两者均为四字神名的中文音译传统；正文采用普通现代中文读者最熟悉的“耶和华”，并保留其专名性质，不改译为称号“主”。
- issue: 关系从句 אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל 的所指
  choice: 在正文中与“那些罪”连接：耶罗波安用这些罪使以色列犯罪
  alternative: 把关系从句直接修饰耶罗波安：“尼八的儿子耶罗波安，就是那使以色列犯罪的人”
  rationale: 希伯来语既可让关系从句说明紧邻的耶罗波安，也可从语义上说明前述那些罪。正文选择后者，并用脚注保留另一种真实可行的句法理解。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“转离”略带经文语体，用以保留原文的方向性隐喻；句法经过调整，使“一生都”清楚修饰本节君王持续不离弃罪的行为。
