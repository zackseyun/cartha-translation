  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: zh_hans
  text: 他行了雅威[a]眼中看为恶的事，没有离开那使以色列犯罪的尼八的儿子耶罗波安所犯的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文上帝专名 יהוה（YHWH）的音译，传统常译作“耶和华”。
    reason: 说明神名的音译及传统译法。
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行了……看为恶的事
  rationale: 这是列王纪中常见的君王评语。“行了……看为恶的事”既保留原文“行恶”的结构和评价意味，也符合现代汉语表达。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性习语，并将四字神名 יְהוָה 音译为“雅威”。
- source_word: לֹא סָר
  choice: 始终没有转离
  rationale: סוּר 在这里指没有离开既有的罪恶道路或行为模式。“转离”保留其方向性比喻；“始终”表达否定式完成时在君王一生评语中的持续意味。
- source_word: מֵחַטֹּאות יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安的那些罪
  rationale: 直译所属关系和父名结构；“那些罪”指耶罗波安所开创并延续的犯罪行为，不额外限定其具体性质。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 耶罗波安曾使以色列犯罪
  rationale: הֶחֱטִיא 是 חטא 的使役形，明确表达“使……犯罪”。在汉语中重提主语，可避免关系从句所指不清。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用的是上帝的专名，而不是“主”这一称号；“雅威”较直接地按通常重构的读音音译，同时用脚注交代汉语传统译名。
- issue: 耶罗波安对以色列犯罪所负的责任
  choice: 使以色列犯罪
  alternative: 引诱以色列犯罪
  rationale: 原文使役形只明确表示耶罗波安导致以色列犯罪，并未说明具体手段；因此不加入“引诱”等更具体的解释。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。保留列王纪君王评语的固定语气，并用分号拆开关系从句，以清楚呈现“耶罗波安使以色列犯罪”的因果责任。
