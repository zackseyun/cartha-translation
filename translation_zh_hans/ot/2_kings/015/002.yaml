  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְכָלְיָ֖הוּ מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: zh_hans
  text: 他登基时十六岁，在耶路撒冷作王五十二年。他母亲名叫耶可利雅，是耶路撒冷人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“来自耶路撒冷。”
    reason: 原文介词 מִן 表示来源，可直译为“来自”；正文“是耶路撒冷人”按汉语习惯表达籍贯。
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: 十六岁
  rationale: 这是希伯来语表示年龄的惯用语，直译为“十六岁之子”；现代汉语自然表达为“十六岁”。
- source_word: הָיָה בְמָלְכוֹ
  choice: 登基时
  rationale: 此结构说明他开始作王时的年龄；“登基时”简洁、自然，并准确表达即位之际。
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: 五十二年
  rationale: 按现代汉语规范表达原文的确切年数。
- source_word: מָלַךְ
  choice: 作王
  rationale: 在列王纪的君王纪年套语中，该动词表示执掌王权；“作王”庄重易懂，也保留原文的王权含义。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 ב 在这里表示作王的地点。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 以自然的现代汉语表达列王纪常见的母亲姓名公式，同时完整保留信息。
- source_word: יְכָלְיָהוּ
  choice: 耶可利雅
  rationale: 采用中文圣经传统中通行且易辨认的希伯来人名音译。
- source_word: מִירוּשָׁלִָם
  choice: 是耶路撒冷人
  rationale: 介词 מִן 可表示来源；在人物籍贯说明中，“是耶路撒冷人”比逐字译法更符合现代汉语。
theological_decisions: []
