base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: zh_hans
  text: 他做了雅威眼中看为正的事；他父亲乌西雅[a]所做的一切，他都照着做了。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本节希伯来文本作“乌西雅”；这位王在别处也称为“亚撒利雅”。
    reason: 说明本节使用“乌西雅”这一名称，并提示同一位君王在别处所用的另一名称。
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: 他行……看为正的事
  rationale: 保留希伯来语“行正事”的惯用表达，同时用自然的现代汉语传达道德评价。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留“在……眼中”的希伯来语意象，表明评价的标准来自雅威。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按专名音译四字神名，不以“主”这一称号替代。
- source_word: כְּכֹל אֲשֶׁר
  choice: 凡……所行的，他都照样
  rationale: “凡……都……”体现כֹל的周全含义，“照样”表达比较与效法关系。
- source_word: עֻזִיָּהוּ אָבִיו
  choice: 他父亲乌西雅
  rationale: 依本节马所拉文本保留“乌西雅”，不与其他经文中的别名“亚撒利雅”强行统一；אָבִיו在此指亲生父亲。
- source_word: עָשָׂה ... עָשָׂה
  choice: 所行的，他都照样行了
  rationale: 适度保留原文动词重复，使约坦的行为与父亲乌西雅的行为形成明确对应。
theological_decisions:
- issue: 四字神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名，故以现代汉语常见的近似音译“雅威”呈现，而不改作称号；“耶和华”是另一传统音译。
- issue: 对君王行为的正面评价范围
  choice: 保留“凡……都照样行了”的全面比较措辞
  alternative: 弱化为“效法了他父亲”
  rationale: כְּכֹל具有周全语气；译文保留这一点，不在本节内加入其他经文对其统治的限定或调和。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“雅威眼中看为正”保留原文意象；分号呈现评价与效法父亲之间的结构关系。脚注标记紧随其实际说明的“乌西雅”之后。
