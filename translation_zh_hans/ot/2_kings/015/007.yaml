  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: zh_hans
  text: 亚撒利雅与他的列祖同睡[a]。人把他与他的列祖一同葬在大卫城。他儿子约坦接续他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“与他的祖先同睡”。“与列祖同睡”是希伯来文指死亡和归葬先人的惯用委婉说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同睡
  rationale: 保留希伯来文指死亡的委婉表达，并与王室记述中“与列祖同睡”的固定套语相符。
- source_word: עִם אֲבֹתָיו
  choice: 与他的列祖
  rationale: “列祖”既贴近原文，也自然传达归到先祖之列的代际含义；脚注补充现代常用的“祖先”。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 人将他葬
  rationale: 原文为主语未明的复数主动式；汉语用泛指的“人”保留这一点，避免擅自指定安葬者。
- source_word: בְּעִיר דָּוִד
  choice: 在大卫城
  rationale: 采用现代中文中清楚、通行的专名表达。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位承继公式中自然表达“统治、为王”的含义。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 准确表达继承其王位，而不只表示时间上在他之后。
