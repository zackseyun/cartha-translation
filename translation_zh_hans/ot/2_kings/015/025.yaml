  to: 利玛利的儿子比加是比加辖的一名将领[a]。他阴谋背叛比加辖，在撒玛利亚王宫的堡垒[b]里，与亚珥歌伯和亚利耶[c]一同将他击倒；比加身边还有五十名基列人。比加杀死了比加辖，接替他作王。
