  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: zh_hans
  text: 利玛利的儿子比加是比加辖的一名将领[a]。他阴谋背叛比加辖，在撒玛利亚王宫的堡垒[b]里，与亚珥歌伯和亚利耶[c]一同将他击倒；比加身边还有五十名基列人。比加杀死了比加辖，接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “将领”所译的希伯来词指高级军官，但确切军衔不明；也可译作“统领”。
    reason: lexical_alternative
  - marker: b
    text: “堡垒”所译的希伯来词也可指“宫殿”或设防的王室住所。
    reason: lexical_alternative
  - marker: c
    text: “亚利耶”在希伯来语中也可意为“狮子”，但这里与亚珥歌伯并列，较适合作人名。原句也可能被理解为亚珥歌伯和亚利耶是与比加辖一同被击杀的人。
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: 阴谋背叛比加辖
  rationale: קשר在《列王纪》的政治语境中指结党谋反或策划叛乱；译为“阴谋背叛”既表达密谋，也点明对君王的反叛。为避免连续代词造成歧义，正文补出比加辖的名字。
- source_word: שָׁלִישׁוֹ
  choice: 比加辖的将领
  rationale: שָׁלִישׁ指高级军职人员，但确切军衔不明；“将领”自然、庄重，又不把职位限定得过细。
- source_word: וַיַּכֵּהוּ
  choice: 将他击倒
  rationale: נכה可指击打、攻击或击倒；后文另用使役式וַיְמִיתֵהוּ明确说杀死，因此这里不用“杀死”，以保留两个动作的递进。
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: 在撒玛利亚王宫的堡垒里
  rationale: אַרְמוֹן可指宫殿、堡垒或设防的王室建筑。“王宫的堡垒”既保留防御性含义，也符合בֵּית מֶלֶךְ所指的王室建筑群。
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: 与亚珥歌伯和亚利耶一同
  rationale: 此处אֵת按伴随用法理解；两个词在叙事中最适合作人名，表示二人与比加一同行动。
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: 跟随比加的还有五十名基列人
  rationale: 无动词的伴随分句说明比加身边另有五十名来自基列人群体的人；补出“比加”可消除汉语中“他”可能指比加辖的歧义。
- source_word: וַיְמִיתֵהוּ
  choice: 比加杀死了比加辖
  rationale: מות的使役式表示使人死亡，即杀死。补出双方名字，使行动者和受害者清楚，并与前面的“击倒”区分。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: 接替他作王
  rationale: 这是《列王纪》常见的王位继承公式；“接替他作王”在现代汉语中简洁自然。
theological_decisions:
- issue: 亚珥歌伯和亚利耶在句中的角色
  choice: 按伴随者理解，译为与比加一同行动
  alternative: 把二人理解为与比加辖一同被击杀的人
  rationale: אֵת既可作直接宾语标记，也可表伴随；此处传统句法及其与后面“跟随比加的还有五十名基列人”的衔接，更支持伴随解释，但原文形式仍存在句法上的另一种可能，故在脚注中说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。为避免本节多次使用“他”所造成的指代混乱，适度补出“比加”和“比加辖”，不增加原文没有的事件信息；保留“击倒”与“杀死”的用词区别。
