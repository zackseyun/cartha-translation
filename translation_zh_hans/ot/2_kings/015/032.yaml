base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: zh_hans
  text: 以色列王利玛利的儿子比加在位第二年，犹大王乌西雅的儿子约坦登基[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“开始作王”。希伯来语动词既可指登上王位，也可指开始统治。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/פֶקַח
  choice: 比加在位第二年
  rationale: 这是希伯来语王朝纪年公式；שְׁתַּיִם虽为基数词“二”，在此按惯用法表达序数“第二”，לְ指按比加的统治年数计算。
- source_word: בֶּן רְמַלְיָהוּ
  choice: 利玛利的儿子
  rationale: 按希伯来语父名结构直译，并采用现代中文圣经人名的通行译法。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 保留比加的王号和所属国，并按自然中文置于姓名及父名之前。
- source_word: מָלַךְ
  choice: 登基
  rationale: 此动词可指作王或开始统治；在登基纪事中，“登基”自然表达取得王位的起始意义。
- source_word: יוֹתָם
  choice: 约坦
  rationale: 采用现代中文圣经人名的通行音译。
- source_word: בֶּן עֻזִיָּהוּ
  choice: 乌西雅的儿子
  rationale: 本节原文明确使用עֻזִיָּהוּ，故译作“乌西雅”，不以他处所用的另一名字“亚撒利雅”替换。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 保留原文对约坦所属王国的明确说明，并按自然中文置于父名之前。
theological_decisions: []
translation_notes:
  register: 采用庄重而自然的现代标准汉语。将两个王号前置，使人物关系清楚，并保留原文的王朝纪年结构。英文咨询层关于乌西雅又名亚撒利雅的注释属于跨经文补充，并非本节词义歧义；本稿从本节希伯来文出发，不另加该注。
