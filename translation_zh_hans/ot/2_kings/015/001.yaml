  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: zh_hans
  text: 以色列王耶罗波安在位第二十七年，亚玛谢的儿子亚撒利雅登基，作犹大王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: 在位第二十七年
  rationale: 这是君王纪年公式；现代汉语通常用“在位第……年”表达，不按希伯来语字面译作“二十又七年”。
- source_word: לְיָרָבְעָם מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王耶罗波安
  rationale: לְ在此标明以谁的统治年数纪年；“以色列王耶罗波安在位第二十七年”符合现代汉语史书式表达。
- source_word: מָלַךְ
  choice: 登基
  rationale: 在登基记载中，此动词表示开始作王；“登基”比单译“作王”更清楚地体现统治的开始。
- source_word: עֲזַרְיָה
  choice: 亚撒利雅
  rationale: 按中文圣经人名的通行音译处理。
- source_word: בֶן אֲמַצְיָה
  choice: 亚玛谢的儿子
  rationale: 直接表达父子谱系关系。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 该称号与“亚玛谢的儿子”共同修饰亚撒利雅；调整为自然的汉语语序。
