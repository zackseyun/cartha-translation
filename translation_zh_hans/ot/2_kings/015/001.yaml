  source_fidelity: 原文的王位称号“犹大王”在句法上同位限定亚撒利雅，而非其父亚玛谢。现译“犹大王亚玛谢的儿子亚撒利雅”会将亚玛谢读作犹大王，改变了原文所表达的关系。纪年、人物、父子关系及登基动作其余均忠实。
