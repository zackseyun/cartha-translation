base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: zh_hans
  text: 雅比的儿子沙龙在犹大王乌西雅第三十九年登基，在撒玛利亚作王一个月[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“一个月的日子”，即约一个月。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלַךְ
  choice: 登基
  rationale: 此处完成式用于记述沙龙即位，并以乌西雅的在位年数标明时间；“登基”比单说“作王”更清楚地表达即位。
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: 在……第三十九年
  rationale: 这是列王纪常见的君王纪年格式；现代汉语自然表达为“在某王第三十九年”。
- source_word: לְעֻזִיָּה מֶלֶךְ יְהוּדָה
  choice: 犹大王乌西雅
  rationale: 介词 לְ 在君王同步纪年中表示按乌西雅的在位年数计算；合并为自然的汉语纪年短语。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 叙事从即位推进到统治期限；“作王”准确而简洁。
- source_word: יֶרַח יָמִים
  choice: 一个月
  rationale: 原文是希伯来语时间习语，字面为“一个日子的月”；正文采用自然汉语“一个月”，脚注保留原文形式。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒玛利亚
  rationale: 介词 בְּ 表示地点；撒玛利亚是沙龙短暂作王之处。
theological_decisions: []
