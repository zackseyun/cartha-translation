base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: zh_hans
  text: 那时，雅比的儿子沙龙密谋反叛他，当着众人[a]击打他，又把他杀死，接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这个希伯来语短语含义不易确定，也可译作“公开地”或“在会众面前”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: 谋反
  rationale: קשר在王位更替的政治语境中指针对君王的密谋或叛乱。“谋反”简洁自然，并保留其敌对、夺权的政治含义。
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: 雅比的儿子沙龙
  rationale: 人名采用现代中文圣经中通行的音译形式；בן按谱系关系译为“……的儿子”。
- source_word: וַיַּכֵּהוּ
  choice: 击倒了他
  rationale: נכה意为击打、击倒；下一个动词另行明确其死亡，因此这里不直接译作“杀死”，以保留原文连续的动作。
- source_word: קָבָל־עָם
  choice: 当着众人
  rationale: 这是一个含义不易确定的短语；按上下文理解为事情发生在民众面前。“当着众人”既自然，也保留公开发生的含义。
- source_word: וַיְמִיתֵהוּ
  choice: 又将他杀死
  rationale: מות的使役形表示使人死亡，即杀死。单独译出这一动作，避免与前面的击打合并。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: 接替他作王
  rationale: מלך与תחתיו合用表示继承其王位；“接替他作王”清楚、自然地表达这一含义。
