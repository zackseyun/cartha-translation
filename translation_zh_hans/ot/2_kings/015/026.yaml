  naturalness: 整体为自然、庄重的现代书面汉语，适合本段公式化的史书叙述。“看哪”虽带文学/经文色彩，但与原文的强调提示功能及本段体裁相称；“记在……上”亦是中文圣经传统中通顺的档案表达。
