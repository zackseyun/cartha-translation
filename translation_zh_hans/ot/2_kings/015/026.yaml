base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: zh_hans
  text: 比加辖其余的事，以及他所做的一切，看哪[a]，都记在《以色列诸王记》上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “看哪”也可译为“确实”。原文在这里特意引人注意下文。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פְקַחְיָה
  choice: 比加辖其余的事
  rationale: 在列王纪反复出现的王朝总结格式中，יֶתֶר דִּבְרֵי 指君王其余的事迹或政务，而不是单指他说过的话。“其余的事”自然、宽泛，也不把内容限缩为政绩。句首的 וְ 在中文中无须机械译作“并且”。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所做的一切
  rationale: 保留 עָשָׂה 的宽泛含义，不具体化为“成就”或“功业”；“以及”清楚连接前一并列成分。
- source_word: הִנָּם
  choice: 看哪
  rationale: 该形式由提示语气词与复数代词后缀构成，用来引人注意后面的记载。“看哪”保留原文显著的提示语气；代词所指的复数事项则由后文“都”自然体现。
- source_word: כְּתוּבִים עַל סֵפֶר
  choice: 都记在……上
  rationale: כְּתוּבִים 是“写下、写着”，但在档案公式中译为“记在”更符合现代汉语；עַל סֵפֶר 按中文习惯译作“在书上”。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王记》
  rationale: דִּבְרֵי הַיָּמִים 在此指按年代编排的王室史料或年鉴；采用简洁且熟悉的档案名称《以色列诸王记》，不暗示它就是正典中的《列王纪》。
- source_word: פְקַחְיָה
  choice: 比加辖
  rationale: 采用现代中文圣经传统中通行的人名音译。
theological_decisions: []
