base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: zh_hans
  text: 他做了雅威眼中看为恶的事，正如他列祖所行的。他没有离开尼八的儿子耶罗波安的罪——耶罗波安曾使以色列犯罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  choice: 他行雅威眼中看为恶的事
  rationale: 保留申命记史书中反复出现的评价公式；“眼中看为恶”既贴近希伯来语意象，也符合庄重而易懂的现代汉语。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译呈现四字神名，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: 正如他列祖所行的
  rationale: “正如”表达比较关系；王朝语境中的“列祖”比泛指的“祖先”更贴切，也保留阳性复数亲属称谓。
- source_word: לֹא סָר מֵחַטֹּאות
  choice: 他没有离开……的罪
  rationale: סור在此表示不脱离、不停止某种罪恶道路；“没有离开”简洁地保留原文的方向性比喻，复数“罪”在汉语中可作集合表达。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 采用通行的中文圣经人名译法，并按希伯来语保留父子关系。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 就是他使以色列所犯的罪
  rationale: 自然表达使役动词החטיא“使……犯罪”，同时把关系从句紧接在“耶罗波安的罪”之后；脚注说明关系词所指可能产生的两种理解。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文使用神的专名而非称号；音译“雅威”较直接地保留这一点。
- issue: אֲשֶׁר关系从句的指向
  choice: 正文将其表达为耶罗波安使以色列所犯的罪
  alternative: “那使以色列犯罪的耶罗波安”，即把从句直接修饰耶罗波安
  rationale: 希伯来语关系词本身不标明性数，既可紧承“耶罗波安”，也可联系前面的“罪”。正文兼顾耶罗波安的使役行为及这些罪的内容，脚注保留句法上的另一种分析。
- issue: אֲבֹתָיו的王朝含义
  choice: 他列祖
  alternative: 他的祖先；他的父辈
  rationale: 此处评价以色列王所承袭的恶行传统；“列祖”保留男性先辈和王朝语域，不将其泛化。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语；保留“雅威眼中”“列祖”等经文语体，但避免艰涩文言。脚注标记置于存在歧义的关系从句之后。
