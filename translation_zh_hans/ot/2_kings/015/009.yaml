revisions:
- from: 他行雅威眼中看为恶的事，正如他列祖所行的。他没有离开尼八的儿子耶罗波安的罪，就是他使以色列所犯的罪[a]。
  to: 他做了雅威眼中看为恶的事，正如他列祖所行的。他没有离开尼八的儿子耶罗波安的罪——耶罗波安曾使以色列犯罪。
  rationale: 修订明确了“使以色列犯罪”的施事为耶罗波安，反映希伯来文阳性单数使役动词的句法；以破折号保留原文关系从句对耶罗波安的补充说明功能。首句仅作轻微现代汉语润饰，未改变公式化经文语体、神名或王朝称谓。
