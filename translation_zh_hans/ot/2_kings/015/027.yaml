  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: zh_hans
  text: 犹大王亚撒利雅五十二年，利玛利的儿子比加在撒玛利亚登基作以色列王，在位二十年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: 五十二年
  rationale: 这是希伯来文记载君王纪年的固定表达；汉语以“某王五十二年”自然、准确地表达在位纪年。
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: 犹大王亚撒利雅
  rationale: 保留君王姓名和所属国，采用现代汉语史书式的简洁语序。
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 此处的完成式用于王朝纪事，表示开始作王；译作“登基作……王”可与后面的在位年数区别开来。
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: 利玛利的儿子比加
  rationale: 明确保留希伯来文父子关系，并采用通行的中文圣经人名译法。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王
  rationale: 介词עַל与מלך连用表示统治某一人民或国度；汉语用“作以色列王”自然表达此义。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒玛利亚
  rationale: 该地点短语指出比加施政和登基为王的都城所在地。
- source_word: עֶשְׂרִים שָׁנָה
  choice: 在位二十年
  rationale: 准确表达统治持续的年数，同时符合汉语君王纪事的惯用说法。
