  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: zh_hans
  text: 沙龙其余的事，以及他所策划的阴谋[a]，看哪[b]，都记在《以色列诸王记》上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译近于“他所图谋的阴谋”，以同根名词和动词相接，带有强调作用。
    reason: lexical_alternative
  - marker: b
    text: “看哪”是指向所引王室档案的惯用提示语；《以色列诸王记》指列王纪多次引用的一部王室史料。
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שַׁלּוּם
  choice: 沙龙其余的事
  rationale: 在列王纪反复出现的王朝总结套语中，דִּבְרֵי 指君王的事迹或事务，而不只是言语；译作“其余的事”自然、准确，也保留了原文的概括性。
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: 以及他所策划的阴谋
  rationale: קֶשֶׁר 在此指政治阴谋；原文以同根名词和动词相接来加强语气。中文用“策划的阴谋”既保留名词—动词结构，也避免生硬重复。
- source_word: הִנָּם
  choice: 看哪……都
  rationale: הִנָּם 兼有指示语气和复数代词成分；“看哪”保留档案引证套语中的提示强调，“都”承接复数所指。
- source_word: כְּתֻבִים
  choice: 记在……上
  rationale: 原词是“写下”的被动分词；在中文档案语境中，“记在……上”比直译“被写在……上”更自然。
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 在《以色列诸王记》上
  rationale: 这是列王纪所引王室史料的惯用名称。译作《以色列诸王记》简洁庄重，并避免将其误认作正典《历代志》。
