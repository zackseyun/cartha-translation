base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/022.yaml
  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
translation:
  language: zh_hans
  text: 米拿现与他的列祖同睡[a]，他儿子比加辖接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“归到他的列祖那里”。希伯来文原意为“与他的列祖躺卧”，是记述君王去世和王位承继的固定用语。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与他的列祖同睡
  rationale: 这是希伯来文记述君王去世及王位承继的固定表达。“与列祖同睡”保留原文“躺卧/睡下”的意象及王朝语境，同时在中文圣经叙事中庄重而可理解；死亡之意由整个惯用语表达。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位承继公式中，该动词表示登基并执掌王权；与“接替他”连用，现代中文自然清楚。
- source_word: פְּקַחְיָה
  choice: 比加辖
  rationale: 采用现代中文圣经中通行的专名音译。
- source_word: בְנוֹ
  choice: 他儿子
  rationale: 明确保留原文的父子关系，说明王位承继关系。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 准确表达“取代他的位置、继承其位”的含义，比直译“在他之下”更符合现代中文王位承继叙事。
theological_decisions: []
