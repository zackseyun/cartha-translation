  text: וַ/יְנַגַּ֨ע יְהוָ֜ה אֶת הַ/מֶּ֗לֶךְ וַ/יְהִ֤י מְצֹרָע֙ עַד י֣וֹם מֹת֔/וֹ וַ/יֵּ֖שֶׁב בְּ/בֵ֣ית הַ/חָפְשִׁ֑ית וְ/יוֹתָ֤ם בֶּן הַ/מֶּ֨לֶךְ֙ עַל הַ/בַּ֔יִת שֹׁפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: zh_hans
  text: 耶和华击打王，王就患了麻风[a]，直到他死的日子。他住在一处隔离的住所[b]。王的儿子约坦掌管王宫，审判国中的民众。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这里的希伯来词也可泛指严重的皮肤病，不一定专指现代医学所说的麻风病。
    reason: lexical_alternative
  - marker: b
    text: 原文含义不完全确定；也可译作“分别出来的房子”或“单独居住的房子”，很可能指隔离住所。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名译法，明确保留原文专名所表达的立约之神身份。
- source_word: וַיְנַגַּע
  choice: 击打
  rationale: 此处 נגע 表示耶和华使王遭受病患，并非普通的身体触碰；“击打”简洁地保留神主动施行打击的语气，又不臆定具体方式。
- source_word: מְצֹרָע
  choice: 患了麻风
  rationale: 保留传统且易懂的对应语，同时用脚注说明该希伯来词的范围不必等同于现代医学所称的麻风病。
- source_word: עַד יוֹם מֹתוֹ
  choice: 直到死的那一天
  rationale: 贴近希伯来语表达，保留叙事中庄重而明确的时间界限。
- source_word: בְּבֵית הַחָפְשִׁית
  choice: 住在一所隔离的房子里
  rationale: 该罕见短语在本语境中很可能指因病与人群分隔的住所；“隔离的房子”自然传达其功能，同时避免把词根表面的“自由”之义误带入译文。
- source_word: עַל הַבַּיִת
  choice: 掌管王宫
  rationale: 该表达在王室语境中指负责宫廷或王室行政；“掌管王宫”比直译“在房屋之上”清楚自然。
- source_word: שֹׁפֵט
  choice: 断事
  rationale: 保留 שׁפט 所含的审判、裁决和施政意味；“为国民断事”在中文中简洁而庄重。
- source_word: עַם הָאָרֶץ
  choice: 国民
  rationale: 此处泛指国中的百姓；“国民”简洁传达整体民众，不预先将其限定为某个政治阶层。
theological_decisions:
- issue: מְצֹרָע 所指病症的性质
  choice: 正文译作“患了麻风”，脚注说明也可能泛指严重皮肤病。
  alternative: 译作“患了严重的皮肤病”或“患了使人不洁的皮肤病”。
  rationale: 原文使用古代疾病分类，不能确定就是现代医学所定义的汉森病。正文保留传统用语以维持经文术语的可辨识性，脚注则避免作过度精确的医学判断。
- issue: 耶和华与王患病之间的因果关系
  choice: 译作“耶和华击打王，王就患了麻风”。
  alternative: 译作“耶和华使王患了麻风”。
  rationale: 原文先说耶和华击打王，继而说王成为患病者；所选译法保留清楚的神圣施事者，也尽量维持两个分句的叙事结构，而不把它压缩成单一使役句。
translation_notes:
  register: 采用现代、庄重而易懂的叙事体。“王就患了麻风”保留原文前后分句关系；“掌管王宫，为国民断事”以自然中文表达约坦持续承担的宫廷行政和司法治理职责。所有脚注标记均置于所解释的词语之后。
