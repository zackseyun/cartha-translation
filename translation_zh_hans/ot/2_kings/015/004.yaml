source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/004.yaml
  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: zh_hans
  text: 只是丘坛还没有废去；百姓仍在丘坛献祭，并焚烧祭物[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“烧香”。希伯来语动词可专指烧香，也可泛指焚烧祭物，使其化为烟。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 在列王纪惯用的君王评语中标明例外，与前文的正面评价形成转折；“只是”简洁自然。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: 指设于各地、常与高处相关的祭祀场所；“丘坛”是中文圣经历史语境中准确而简练的用语，避免笼统译成“神庙”。
- source_word: לֹא סָרוּ
  choice: 还没有废去
  rationale: 动词字面涉及移除或离去，以丘坛为主语时表示这些祭祀场所未被废除；“废去”符合中文表达。
- source_word: עוֹד
  choice: 仍
  rationale: 表示百姓的祭祀活动持续进行。
- source_word: הָעָם
  choice: 百姓
  rationale: 自然表达该国民众这一集合概念。
- source_word: מְזַבְּחִים
  choice: 献祭
  rationale: 保留 זבח 所指的祭牲或献祭行为，措辞简洁。
- source_word: וּמְקַטְּרִים
  choice: 并焚烧祭物
  rationale: קטר 在祭祀语境中可专指烧香，也可较广义地指使祭物焚烧成烟；正文采用较宽泛的译法，并以脚注保留较窄的可能。
- source_word: בַּבָּמוֹת
  choice: 在丘坛
  rationale: 自然表达祭祀行为发生的地点；不必以“在……上”机械对应介词。
theological_decisions:
- issue: 丘坛祭祀活动的性质
  choice: 只陈述百姓继续在地方性丘坛献祭和焚烧祭物，不指明其敬拜对象，也不把每次活动明确判为偶像崇拜。
  alternative: 将其明确译为拜偶像，或断定他们只是在不合规定的地点敬拜耶和华。
  rationale: 本节希伯来文本没有说明祭祀所针对的神明；译文应保留这种克制与神学张力，不从上下文之外加入结论。
- issue: וּמְקַטְּרִים 所指祭物
  choice: 正文采用可涵盖各类焚烧祭物的“焚烧祭物”。
  alternative: 译作“烧香”。
  rationale: 该动词在祭祀语境中既可能专指烧香，也可能泛指使祭物化为烟；对象未明，故正文保留较宽含义，脚注注明另一译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“丘坛”保留列王纪的历史宗教语境；分号对应本节两个紧密相连的陈述。脚注标记已置于相关短语之后。
