base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: zh_hans
  text: 米拿现其余的事迹，以及他所做的一切，不都记载在《以色列诸王大事记》[a]中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：《以色列诸王年鉴》。
    reason: “大事记”与“年鉴”都可表达סֵפֶר דִּבְרֵי הַיָּמִים所指的官方编年记录；脚注保留这一词义选择。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַחֵם
  choice: 米拿现其余的事
  rationale: יֶתֶר意为“其余、剩余”，דִּבְרֵי在君王纪事的固定表达中指其事迹或相关事件，而不只指言语；中文用“其余的事”自然、简洁，并保留概括性。וְ的承接作用由中文语境自然体现，不另加“现在”。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所做的一切
  rationale: 直接保留原文与前一短语并列且略有重复的公式化表达。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 不都写在……上吗
  rationale: הֲלוֹא引出期待肯定回答的反问；“不都……吗”符合现代汉语习惯，也保留原文的反问语气。
- source_word: עַל סֵפֶר
  choice: 写在……上
  rationale: 原文介词עַל本义为“在……上”；用于书面记录时，中文“写在某书记载上”自然，并较透明地反映原文。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王大事记》
  rationale: דִּבְרֵי הַיָּמִים在此指按时日编录的王室纪事或史料；“大事记”既体现编年记录性质，也避免与圣经正典书名《历代志》混同。לְ表示该文献与以色列诸王的归属或关联。
