  text: וְ/יֶ֥תֶר דִּבְרֵי פֶ֖קַח וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: zh_hans
  text: 比加其余的事，以及他所行的一切，看哪，都写在《以色列诸王大事记》[a]上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：《以色列诸王年鉴》。
    reason: “דִּבְרֵי הַיָּמִים”可指编年记录或年鉴；“年鉴”更突出按年代记事的性质。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פֶקַח
  choice: 比加其余的事
  rationale: יֶתֶר意为“其余、剩下的”，דִּבְרֵי在君王生平总结套语中指其事迹或政事；译作“其余的事”自然简明，也不把范围限于某类功业。句首וְ在此承接上下文，中文无需机械译出“和”或添加时间性的“现在”。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所行的一切
  rationale: 保留כָל的周全范围和עָשָׂה的普通动词意义；“所行的一切”符合庄重而通顺的现代汉语。
- source_word: הִנָּם
  choice: 看哪，都
  rationale: הִנֵּה带复数代词后缀，具有指示、提示和强调作用；保留“看哪”以呈现希伯来文公式化的强调，“都”则与前面的复数事项相呼应。
- source_word: כְּתוּבִים עַל סֵפֶר
  choice: 写在……上
  rationale: כְּתוּבִים是“写下”的被动分词，עַל סֵפֶר字面为“在书卷上”；中文“写在……上”既具体又自然。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: 《以色列诸王大事记》
  rationale: דִּבְרֵי הַיָּמִים在王朝总结语中指按时记载的史事或编年记录；“大事记”是清楚自然的文献名称。לְמַלְכֵי יִשְׂרָאֵל表示该记录属于或关乎以色列诸王。
