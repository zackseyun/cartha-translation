  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: zh_hans
  text: 以色列王比加在位的时候，亚述王提革拉·毗列色前来，攻取了以云、亚伯伯玛迦、亚挪、基低斯、夏琐、基列和加利利——就是拿弗他利全地——并把这些地方的居民掳到亚述[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “掳到”也可译作“放逐到”或“强制迁徙到”。
    reason: 原词表示使人离开本地；在此军事语境中指强制迁移至亚述。
lexical_decisions:
- source_word: בִּימֵי
  choice: 在位的时候
  rationale: 这是引出历史背景的时间表达；结合“以色列王比加”，译为“在位的时候”比直译“在……的日子”更符合现代汉语，同时保留统治时期之意。
- source_word: בָּא
  choice: 前来
  rationale: 原义为“来”；军事入侵由下文“攻取”表明，因此不在此处增译为“入侵”。
- source_word: וַיִּקַּח
  choice: 攻取了
  rationale: 动词基本义为“拿、取”；在君王攻占一连串城邑和地区的军事语境中，“攻取”自然准确。
- source_word: עִיּוֹן
  choice: 以云
  rationale: 采用现代中文圣经地名的常见音译。
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: 亚伯·伯·玛迦
  rationale: 按复合地名音译，并用间隔号标明名称内部组成。
- source_word: יָנוֹחַ
  choice: 亚挪
  rationale: 采用中文圣经地名的常见音译。
- source_word: קֶדֶשׁ
  choice: 基低斯
  rationale: 采用中文圣经地名的常见音译。
- source_word: חָצוֹר
  choice: 夏琐
  rationale: 采用中文圣经地名的常见音译。
- source_word: הַגִּלְעָד
  choice: 基列
  rationale: 作为专有地域名处理；希伯来语冠词无需在中文中另行表达。
- source_word: הַגָּלִילָה
  choice: 加利利
  rationale: 指加利利地区；用现代中文通行名称。
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: 就是拿弗他利全地
  rationale: 保留原文对前述征服地区所作的同位概括；“全地”直接对应“整个土地/地域”。
- source_word: וַיַּגְלֵם
  choice: 又把那里的人掳到
  rationale: 该词为גלה的使役形，表示使人离乡、放逐或迁徙。原文宾语是复数代词，而前文所列多为地点；中文明确为“那里的人”，自然表达实际所指，同时“掳到”保留战败后被强制迁移的叙事色彩。
- source_word: אַשּׁוּרָה
  choice: 亚述
  rationale: 词尾方向形式表示“到亚述去”；中文介词“到”已表达方向。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。君王名号按自然汉语语序排列；地名使用中文圣经传统中较通行的形式。破折号式插说改用“就是”，清楚表达“拿弗他利全地”对前列地区的概括。
