  - severity: low
    issue: “那里的人”所指稍泛
    rationale: 原文的“他们”在汉语中需要补足实际被迁移者；“这些地方的居民”既清晰又限于前列城邑和地区。
  - severity: low
    issue: 脚注中的“迁徙到”可能弱化强制性
    rationale: 原词在此为使役式，语境指强制迁移、放逐；脚注应保持这一语义特征。
