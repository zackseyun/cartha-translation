  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: zh_hans
  text: 米拿现从以色列人中所有有财势的人[a]那里征收了这笔钱，每人五十舍客勒银子，好交给亚述王。于是亚述王回去了，没有留在那地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文这一词组也可译作“所有英勇的战士”或“所有有实力、有地位的人”；这里征收钱财的语境较支持“有财势的人”。
    reason: 保留גִּבּוֹרֵי הַחַיִל在军事能力、社会地位和经济实力之间的词义幅度。
lexical_decisions:
- source_word: וַיֹּצֵא אֶת־הַכֶּסֶף עַל־יִשְׂרָאֵל
  choice: 从以色列人……那里征收了这笔钱
  rationale: יָצָא的使役形式本义为“使出来”，但与“钱”和表示负担对象的עַל连用时，语境是强制征取款项；“征收”既准确又符合现代汉语。
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: 所有有财势的人
  rationale: 该词组可指勇士，也可指有能力、有地位或有财富的人。此处按人头征收巨额款项，财政语境较支持“有财势的人”，同时以脚注保留其语义幅度。
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף לְאִישׁ אֶחָד
  choice: 每人五十舍客勒银子
  rationale: 保留原文的重量单位和金属名称，并自然表达每名被征收者应付的数额。
- source_word: לָתֵת לְמֶלֶךְ אַשּׁוּר
  choice: 好交给亚述王
  rationale: 忠实表达目的从句；在款项语境中，“交给”比字面的“给”更自然，且不额外限定为贡金或赎金。
- source_word: וַיָּשָׁב מֶלֶךְ אַשּׁוּר
  choice: 于是亚述王回去了
  rationale: שׁוּב表示返回或回转；“回去了”保留原文简洁叙述，不额外加入“撤兵”等原文未明说的军事细节。
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: 没有留在那地
  rationale: עָמַד在此不是字面的“站立”，而是停留、继续驻留；译文采用自然的现代汉语表达。
theological_decisions: []
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“有财势的人”兼顾财富与社会实力；句式按汉语习惯重组，但保留征收对象、每人数额、付款目的及亚述王离开的叙事次序。
