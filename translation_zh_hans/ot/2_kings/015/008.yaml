  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: zh_hans
  text: 犹大王亚撒利雅在位第三十八年，耶罗波安的儿子撒迦利雅在撒马利亚登基作以色列王，共六个月。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה לַעֲזַרְיָהוּ
  choice: 亚撒利雅在位第三十八年
  rationale: 这是列王纪常见的君王纪年格式；希伯来语以基数形式表达序数意义。译为“在位第三十八年”既准确又符合现代汉语习惯。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 简洁保留其王位与统治地域，符合汉语历史叙事习惯。
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 此处动词在纪年公式中表示开始执政，而非笼统描述整个统治期；“登基作王”清楚表达即位义。
- source_word: זְכַרְיָהוּ בֶן יָרָבְעָם
  choice: 耶罗波安的儿子撒迦利雅
  rationale: 按现代汉语自然语序表达父子关系，并采用通行圣经人名译法。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王
  rationale: עַל与מלך连用表示统治以色列；汉语以“作以色列王”自然传达其义。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 保留地点信息；该短语指出其执政所在地。
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: 共六个月
  rationale: 这是表示时长的宾格结构；“共六个月”明确说明其统治持续时间，同时行文简洁。
