  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为正的事，照着他父亲亚玛谢所行的一切。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他行
  rationale: 未完成式连续式推进叙事；中文无需机械译出句首连接词，译为“他行”自然且忠实。
- source_word: הַיָּשָׁר
  choice: 看为正的事
  rationale: 带冠词的形容词在此作名词性用法，指“正的事”；与“在……眼中”合译为现代汉语常用的圣经评语表达。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留“在眼中”的希伯来语意象，同时按汉语语序表达从耶和华角度所作的评价。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经及普通读者最熟悉的神名音译“耶和华”，明确保留专名，而不以“主”这一称号代替。
- source_word: כְּכֹל אֲשֶׁר
  choice: 完全照……所……的
  rationale: כְּ 表示依照、符合，כֹל 强调全部范围；“完全照”简洁体现全面效法的意思。
- source_word: עָשָׂה
  choice: 所行的
  rationale: 关系结构“所行的”自然表达亚玛谢先前行为作为参照标准；上下文已足以显示其先于主句行为，无需额外标明过去完成。
- source_word: אֲמַצְיָהוּ
  choice: 亚玛谢
  rationale: 采用该人名通行的现代中文圣经译法。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 近处家谱语境表明这里是字面意义上的父亲，而非泛指祖先。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文保留为专名；“耶和华”是现代普通中文读者最熟悉且可直接识别的传统音译，避免以称号“主”取代神名。
- issue: “行正事”的评价视角
  choice: 耶和华眼中看为正
  alternative: 他本身是正直的
  rationale: 原文评价的是君王所做之事，并明确限定为耶和华的判断视角；译文不把它扩大为对人物全部品格的绝对评价。
- issue: 效法亚玛谢的范围
  choice: 完全照他父亲亚玛谢所行的
  alternative: 在某些方面效法亚玛谢
  rationale: 原文 כְּכֹל 明说“照一切/全部”，应保留其全面性；本节自身不加入后文可能提供的限制。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“行……的事”保留列王纪君王评语的正式语体；“完全照”清楚传达 כְּכֹל 的范围。句中不设脚注，因此正文无脚注标记。
