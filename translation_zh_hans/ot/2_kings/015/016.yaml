  text: אָ֣ז יַכֶּֽה מְ֠נַחֵם אֶת תִּפְסַ֨ח וְ/אֶת כָּל אֲשֶׁר בָּ֤/הּ וְ/אֶת גְּבוּלֶ֨י/הָ֙ מִ/תִּרְצָ֔ה כִּ֛י לֹ֥א פָתַ֖ח וַ/יַּ֑ךְ אֵ֛ת כָּל הֶ/הָ֥רוֹתֶ֖י/הָ בִּקֵּֽעַ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: zh_hans
  text: 当时，米拿现攻打提斐萨、城中的一切[a]和其自得撒起的境域[b]；因为那城没有向他开门[c]，他就把城中所有怀孕的妇人都剖开了[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “城中的一切”也可译作“城里所有的人”。原文表达宽泛，在这里很可能包括城中居民。
    reason: 保留כָּל אֲשֶׁר בָּהּ可指人或泛指城中一切的词义空间。
  - marker: b
    text: “自得撒起的境域”按此短语与“境域”相连的理解翻译；“从得撒”在句法上也可能指米拿现发动进攻的出发点。
    reason: 说明介词短语מִתִּרְצָה的修饰对象存在句法歧义。
  - marker: c
    text: “开门”指打开城门接纳米拿现，也就是向他投降；原文直译为“因为没有打开”。
    reason: 交代古代城防语境，并注明译文所补出的宾语关系。
  - marker: d
    text: “剖开”也可译作“劈开”或“撕开”；原文动词表示用暴力破开。
    reason: 呈现בִּקֵּעַ的强烈暴力含义及可行译法。
lexical_decisions:
- source_word: אָז
  choice: 当时
  rationale: 作为叙事中的时间承接语，既可表示“那时”，也自然引出接下来的事件。
- source_word: יַכֶּה / וַיַּךְ
  choice: 攻打 / 击打
  rationale: נכה可指击打、攻击。前者涉及城市和地域，用“攻打”较自然；后者重申对该城施暴，用“击打”保留原文重复及具体暴力色彩。
- source_word: תִּפְסַח
  choice: 提斐萨
  rationale: 按希伯来语地名音译，不将其与其他相似地名混同。
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: 城里的一切
  rationale: 原文表达宽泛，既可着重指城中所有人，也可能包括城中所有事物；正文不把含义限定为居民。
- source_word: גְּבוּלֶיהָ
  choice: 那城的四境
  rationale: גְּבוּל可指边界或所辖地域；此处“四境”简洁地表达城市周边或辖属地域，而不局限于边界线。
- source_word: מִתִּרְצָה
  choice: 从得撒出兵
  rationale: מִן表示“从”。结合军事叙事，最自然理解为米拿现由得撒发动进攻；脚注保留其句法关联的可能歧义。
- source_word: כִּי לֹא פָתַח
  choice: 因为那城没有向他开门
  rationale: 字面为“因为没有打开”；在围城语境中指城方没有开门接纳他，即拒绝投降。以“那城”为集合主体符合希伯来语单数表达。
- source_word: הֶהָרוֹתֶיהָ
  choice: 城里所有孕妇
  rationale: 直接准确表达הָרוֹת“怀孕的妇女”，并体现阴性单数后缀与该城的关系。
- source_word: בִּקֵּעַ
  choice: 把……肚腹都剖开了
  rationale: בקע的加强词干表示以暴力劈开、剖开；中文直陈原文所记暴行，不作弱化。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。“攻打”“开门”“剖开”均为普通读者易懂的词语；不以委婉语淡化经文中的战争暴行。正文保持原文对“城里的一切”的宽泛表达，并用脚注说明句法与词义歧义。
