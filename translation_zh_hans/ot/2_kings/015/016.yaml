revisions:
- from: 当时，米拿现从得撒出兵[b]，攻打提斐萨、城里的一切[a]和那城的四境。因为那城没有向他开门[c]，他就击打那城，把城里所有孕妇的肚腹都剖开了[d]。
  to: 当时，米拿现攻打提斐萨、城中的一切[a]和其自得撒起的境域[b]；因为那城没有向他开门[c]，他就把城中所有怀孕的妇人都剖开了[d]。
  rationale: 修订纠正了第二个“击打”的受事对象，避免将其误解为再次攻击城市；将“那城的四境”改为“其……境域”，以准确表达城市的边界或辖属范围而不引入“四方”含义；并删除正文中无明示依据的“出兵”，通过脚注保留“从得撒”的句法歧义。
