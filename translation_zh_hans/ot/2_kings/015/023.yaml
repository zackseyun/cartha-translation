  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: zh_hans
  text: 犹大王亚撒利雅在位第五十年，米拿现的儿子比加辖在撒马利亚登基作以色列王，在位两年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים שָׁנָה לַעֲזַרְיָה
  choice: 亚撒利雅在位第五十年
  rationale: 这是希伯来王年纪事的固定表达；用现代汉语“在位第五十年”清楚表明以亚撒利雅的统治年数为纪年基准。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 按自然简洁的现代汉语表达其王职和所辖国度。
- source_word: מָלַךְ
  choice: 登基作……王
  rationale: 此处位于登基纪事中，表示开始作王；后文另述在位年数，因此译为“登基作……王”可避免语义重复。
- source_word: פְּקַחְיָה בֶן מְנַחֵם
  choice: 米拿现的儿子比加辖
  rationale: 保留人物姓名及父子关系，并采用简体中文圣经人名的通行译法。
- source_word: עַל יִשְׂרָאֵל
  choice: 作以色列王
  rationale: 介词עַל与מלך连用表示统治对象；汉语以“作以色列王”自然传达“治理以色列”。
- source_word: בְּשֹׁמְרוֹן
  choice: 在撒马利亚
  rationale: 地点介词בְּ表明王权所在地；此处指北国首都撒马利亚。
- source_word: שְׁנָתָיִם
  choice: 在位两年
  rationale: 双数形式明确表示“两年”；依汉语王年纪事习惯补出“在位”，使句意完整。
