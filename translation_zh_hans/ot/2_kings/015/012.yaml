source:
  edition: WLC
  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: zh_hans
  text: 这就是雅威对耶户所说的话：“你的子孙，直到第四代，必坐在以色列的王位上。”事情果然如此。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא דְבַר יְהוָה
  choice: 这就是雅威……所说的话
  rationale: הוּא 回指前述事件，带有指示和确认作用；“这就是”既贴近原文，也自然表明该事件与先前神谕相对应。דְבַר 保留为“所说的话”，不直接释作“应许”，以免缩窄其含义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其作为专名的性质，不以称号替代。
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא לֵאמֹר
  choice: 对耶户所说的话：“……”
  rationale: 用汉语引语结构表达关系从句及 לֵאמֹר；省去生硬的“说”，同时完整保留说话对象和直接引语。
- source_word: בְּנֵי רְבִיעִים
  choice: 你的子孙，直到第四代
  rationale: בָּנִים 在王朝延续语境中指后裔；“子孙”比仅指亲生儿子的“儿子”准确。“直到第四代”保留世代范围，避免改写成笼统的长期统治。
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: 必坐在以色列的王位上
  rationale: 保留“坐在王位上”的具体王权意象；לְךָ 所表达的家系归属已由“你的子孙”自然体现，无须另译成不自然的“为你”。
- source_word: וַיְהִי כֵן
  choice: 事情果然如此
  rationale: 该短语宣告先前话语确已实现；“果然如此”是自然、庄重的现代汉语，也保留其应验意味。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；采用“雅威”保留专名性质，并避免以称号代替。
- issue: 王朝延续应许中 בְּנֵי רְבִיעִים 的范围
  choice: 你的子孙，直到第四代
  alternative: 你的第四代子孙；你的子孙必接连四代
  rationale: 原文强调耶户后裔延续至第四代。“直到第四代”保留范围表达，不把它误解为只有第四代一代登位，也不额外明确四代是否包含耶户本人。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“这就是”紧扣上文，“事情果然如此”清楚表达神谕应验；整体避免古奥的“坐以色列的国位”等表达。
