  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: רַ֤ק הַ/בָּמוֹת֙ לֹ֣א סָ֔רוּ ע֗וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמ֑וֹת ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: zh_hans
  text: 只是那些丘坛还没有废除，百姓仍在丘坛上献祭、烧香[a]。约坦建造了耶和华殿的上门。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “烧香”也可译作“焚烧祭物”。希伯来语这个动词既可特指烧香，也可较广泛地指焚烧供物，使烟上升。
    reason: 保留 מְקַטְּרִים 的词义范围，避免正文把它过度限定为香料。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 承接上文对王的正面评价，引出一个保留性的例外；“只是”自然传达这种限制和转折。
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: 丘坛／在丘坛上
  rationale: “丘坛”是《列王纪》中对当地祭祀场所的传统而明确的译法，不把词义局限为单纯的地势高处。
- source_word: לֹא סָרוּ
  choice: 还没有废除
  rationale: 原文直义为“没有除去”；在此处主语是丘坛，汉语用“废除”可自然表达这些祭祀设施仍被保留。
- source_word: עוֹד
  choice: 仍
  rationale: 表示百姓献祭和焚烧之举持续未改。
- source_word: מְזַבְּחִים
  choice: 献祭
  rationale: 分词表示持续或惯常行为；与“仍”连用即可自然体现这一点。
- source_word: וּמְקַטְּרִים
  choice: 烧香
  rationale: 符合该动词在祭祀语境中的常见用法，同时以脚注保留其也可泛指焚烧祭物、使烟上升的较宽含义。
- source_word: הוּא
  choice: 约坦
  rationale: 独立代词回指本段所述之王约坦。汉语补出专名可避免跨句后代词指向不清，并未增添新的身份信息。
- source_word: בָּנָה
  choice: 建造了
  rationale: 按动词基本义翻译；原文不足以确定是新建还是重建。
- source_word: שַׁעַר בֵּית יְהוָה הָעֶלְיוֹן
  choice: 耶和华殿的上门
  rationale: 保留“耶和华的殿”与“上门”的结构；“上门”表示按位置区分的上方门。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，直接呈现原文专名而非以称号替代。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。中文正文采用广为人知且庄重的“耶和华”，保留其专名性质；“雅威”是另一种可能的音译。
- issue: 丘坛的性质
  choice: 丘坛
  alternative: 高处／祭祀场所
  rationale: 此词在《列王纪》的语境中指当地敬拜设施；译作“丘坛”既体现其礼仪用途，也不在本节中额外判定每一处敬拜的具体神学性质。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“献祭、烧香”保留经文的礼仪措辞；补出“约坦”以符合现代汉语跨句指代习惯。所有脚注标记均已置于正文相应位置。
