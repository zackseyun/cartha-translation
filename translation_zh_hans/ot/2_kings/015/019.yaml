base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: zh_hans
  text: 亚述王普勒来攻打这地[a]。米拿现给了普勒一千他连得银子[b]，为要得到他的支持，好巩固自己手中的王权。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “这地”很可能指以色列地。
    reason: cultural_note
  - marker: b
    text: “他连得”是古代的重量单位；各时期、各地区的实际重量可能有所不同。
    reason: cultural_note
  - marker: c
    text: 原文直译：“使他的手与他同在，好巩固他手中的王国（或王权）。”前一个“他的”指普勒，后一个“他”及“他手中”指米拿现。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא פוּל מֶלֶךְ אַשּׁוּר עַל הָאָרֶץ
  choice: 亚述王普勒来攻打这地
  rationale: בוא接עַל在此军事语境中表示敌对进军，译为“来攻打”比逐字的“来到……之上”自然；הָאָרֶץ保留为“这地”，不在正文中补明所指。
- source_word: וַיִּתֵּן מְנַחֵם לְפוּל
  choice: 米拿现给了普勒
  rationale: נתן的基本义是“给”；正文保持原文简洁，不直接解释为纳贡或贿赂。
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: 一千他连得银子
  rationale: כִּכָּר是古代重量单位，采用中文圣经语境中通行的音译“他连得”，并用脚注说明。
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: 为要得到他的支持
  rationale: 原文直译为“使他的手与他同在”，是表示援助、撑腰的习语；正文按现代汉语自然表达为“得到他的支持”。
- source_word: לְהַחֲזִיק הַמַּמְלָכָה בְּיָדוֹ
  choice: 好巩固自己手中的王权
  rationale: חזק的使役形表示使之坚固；ממלכה在此语境可指王权或统治。“自己手中的王权”既保留“在他手中”的意象，也清楚表达米拿现要稳固其统治。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。正文自然传达希伯来语的政治支持习语，脚注保留其“手”的原文意象及ממלכה在“王国／王权”之间的语义空间；人名采用通行译名“普勒、米拿现”。
