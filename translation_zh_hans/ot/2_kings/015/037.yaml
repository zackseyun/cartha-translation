base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: zh_hans
  text: 那些日子，雅威开始差遣亚兰王利汛和利玛利的儿子比加来攻击犹大。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “来攻击犹大”也可译作“进入犹大”；希伯来语介词本身可表示“在、进入”，但这里的语境显然带有敌对意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: 那些日子
  rationale: 保留希伯来语常见的历史时段表达，同时符合现代汉语叙事语体。
- source_word: הֵחֵל
  choice: 开始
  rationale: 准确表达该使役词形在此所标示的行动起始。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，保留其专名性质，不以称号替代。
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: 差遣……来攻击犹大
  rationale: 动词本义是“差遣”；结合所差遣者及军事政治语境，介词短语带有敌对指向。“来攻击”自然传达此意，同时用脚注保留“进入”的形式可能。
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: 亚兰王利汛
  rationale: 按中文自然语序表达王号；“亚兰”直接对应希伯来地名，不沿用传统的“叙利亚”。
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: 和利玛利的儿子比加
  rationale: 保留第二位受差遣者与第一位并列的句法关系，并清楚呈现父子身份。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译为“雅威”可保留其作为以色列之神专名的性质，而不以称号消解。
- issue: 雅威“差遣”敌国君王与攻击行为的关系
  choice: 保留“雅威开始差遣……来攻击犹大”的直接陈述
  alternative: 弱化为“容许……攻击犹大”
  rationale: 原文使用使役形“差遣”，明确将事件的发动归于雅威；译文不将其神学张力改写为仅仅许可。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“差遣”保留叙事与神学语体；人名、地名采用常见圣经汉语形式。脚注标记置于相关分句之后。
