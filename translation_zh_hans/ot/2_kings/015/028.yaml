- from: 他做耶和华眼中看为恶的事，不离开尼八的儿子耶罗波安使以色列人陷入的那些罪。
  to: 他行耶和华眼中看为恶的事；他没有离开尼八的儿子耶罗波安的那些罪。耶罗波安曾使以色列人犯罪。
  rationale: 修订保留原文两项相连但有区别的信息：此王没有离开耶罗波安的罪，以及耶罗波安使以色列人犯罪。以分句呈现关系分句的内容，避免中文长定语造成属格关系模糊；未添加任何具体罪行或解释。
