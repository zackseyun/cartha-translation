  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: zh_hans
  text: 他行耶和华眼中看为恶的事；他没有离开尼八的儿子耶罗波安的那些罪。耶罗波安曾使以色列人犯罪。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他做……看为恶的事
  rationale: 这是列王纪中惯用的君王评语；译为自然现代汉语，同时保留“做恶事”的明确判断。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价隐喻；补出“看为”使中文句法自然。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 以现代中文圣经读者熟悉的形式音译四字神名，保留其专名性质。
- source_word: לֹא סָר מִן
  choice: 不离开
  rationale: סוּר 与 מִן 连用，表示不偏离或不脱离某种罪恶道路；“不离开”简洁并贴近原文。
- source_word: חַטֹּאות
  choice: 那些罪
  rationale: 保留复数含义，并用“那些”自然限定后接关系分句所说明的罪。
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: 尼八的儿子耶罗波安
  rationale: 按现代汉语自然次序表达希伯来父名结构。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 使以色列人陷入的
  rationale: הֶחֱטִיא 是使役形，表明耶罗波安使以色列犯罪；“使……陷入罪”在中文中自然，也保留其责任归属。
theological_decisions:
- issue: 四字神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: “耶和华”是现代简体中文圣经传统中最广为人知的专名形式；它不以“主”替代原文专名。
- issue: 耶罗波安与以色列犯罪之间的因果关系
  choice: 使以色列人陷入……罪
  alternative: 使以色列人犯罪
  rationale: 保留希伯来语使役形所表达的因果和责任；“陷入”避免把关系分句误读为只描述耶罗波安个人所犯的罪。
translation_notes:
  register: 采用庄重而清楚的现代标准汉语。保留列王纪君王评语的简洁、定式语气；“耶和华眼中”保留原文隐喻，没有添加原文未明说的具体罪行。
