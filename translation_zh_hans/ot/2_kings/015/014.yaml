revisions:
- from: 迦底的儿子米拿现从得撒上到撒马利亚，在那里击杀了雅比的儿子沙龙，将他处死，随后接替他作王。
  to: 迦底的儿子米拿现从得撒上到撒马利亚，在撒马利亚击打雅比的儿子沙龙，把他杀死，并接替他作王。
  rationale: 将首个暴力动词译为“击打”，并将死亡结果保留给随后使役动词“把他杀死”，以维持原文的叙事层次；恢复重复出现的地点“在撒马利亚”。其余措辞保留草稿的现代、庄重语体及通行专名。
  reviewer_model: gpt-5.6-terra
