base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: zh_hans
  text: 迦底的儿子米拿现从得撒上到撒马利亚，在撒马利亚击打雅比的儿子沙龙，把他杀死，并接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上到
  rationale: עלה的基本义是“上去、上到”。“上到”保留原文的方位表达，同时不把行动过度解释为军事进军。
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: 迦底的儿子米拿现
  rationale: 采用中文圣经传统中通行的人名音译，并自然保留父子关系。
- source_word: מִתִּרְצָה
  choice: 从得撒
  rationale: 介词מן表示出发地或来源，“从得撒”直接传达其地点功能。
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: 到撒马利亚
  rationale: בוא接地点名表示来到或进入该地；“到撒马利亚”符合现代汉语叙事。
- source_word: וַיַּךְ אֶת
  choice: 击杀了
  rationale: נכה在王位政变和刺杀语境中指以暴力击倒；后续וַיְמִיתֵהוּ明确结果是死亡，因此“击杀”既传达暴力动作，也与下句有所呼应。
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: 雅比的儿子沙龙
  rationale: 采用中文圣经传统中通行的人名音译，并保留父子身份。
- source_word: בְּשֹׁמְרוֹן
  choice: 在那里
  rationale: 原文再次明说“在撒马利亚”。现代汉语若紧接前句重复地名稍显累赘，用“在那里”仍明确保留地点指涉。
- source_word: וַיְמִיתֵהוּ
  choice: 将他处死
  rationale: מות的使役式表达“使他死、将他杀死”。“将他处死”保留使役色彩，并与前面的暴力击打区分开来。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: 随后接替他作王
  rationale: מלך表示作王或统治，תחתיו表示取代他的位置。“接替他作王”自然准确地表达王位更替。
theological_decisions: []
