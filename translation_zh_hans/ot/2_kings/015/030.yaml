base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: zh_hans
  text: 以拉的儿子何细亚密谋反叛利玛利的儿子比加[a]，击打他，杀死他，并接替他作王。这事发生在乌西雅的儿子约坦在位第二十年[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译作“密谋了一场阴谋”，以同根词重复加强语气，指策划反叛君王。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语作“乌西雅的儿子约坦第二十年”。这与本书其他王位纪年资料存在年代上的难题；有些解释尝试将它与亚哈斯在位期间协调，但这里按希伯来文本翻译。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: 密谋反叛
  rationale: 希伯来语采用同根动词与名词连用的强调结构，意思是策划叛乱。中文若机械重复为“密谋一个阴谋”并不自然；“密谋反叛”既体现有预谋的敌对行动，也符合王权政变语境。脚注说明原文的强调形式。
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: 以拉的儿子何细亚
  rationale: 按现代中文圣经人名惯例音译，并保留父子关系以明确人物身份。
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: 反叛利玛利的儿子比加
  rationale: 在谋反语境中，עַל 表示行动所针对的对象；中文以“反叛”自然表达这种敌对方向。
- source_word: וַיַּכֵּהוּ
  choice: 袭击他
  rationale: נכה 表示击打或击倒；后一句另有使其死亡的动词，因此译为“袭击他”，保留行动顺序，避免在此提前合并为“杀死”。
- source_word: וַיְמִיתֵהוּ
  choice: 把他杀死
  rationale: מות 的使役式明确表示使对方死亡；“把他杀死”自然且保留使役意义。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: 接替他作王
  rationale: מלך 与 תחתיו 合用表达王位继承；“接替他作王”比逐字的“在他的位置上作王”更自然，同时完整保留含义。
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: 那时是乌西雅的儿子约坦第二十年
  rationale: 忠实保留马所拉文本的纪年公式，不因上下文中的年代难题而擅自改为亚哈斯年间或校改数字。
theological_decisions:
- issue: 王位纪年的年代张力
  choice: 正文照马所拉文本译为“乌西雅的儿子约坦第二十年”
  alternative: 暗中协调为亚哈斯在位年间，或校改年份
  rationale: 列王纪其他经文所记约坦在位年数与这里形成明显年代难题，但翻译不应在缺乏正文依据时替读者消除张力；正文保留原文，脚注提示问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。人名沿用简体中文圣经常见译名；以“密谋反叛”自然表达政变语境，并用脚注保留同根重复的原文特征。将较长的连续希伯来叙事链分成两句，以提高中文可读性而不改变事件次序。
