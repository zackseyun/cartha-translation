base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/011.yaml
  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: zh_hans
  text: 撒迦利雅其余的事，看哪，这些事都记在《以色列诸王历代志》上[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “《以色列诸王历代志》”也可译作“《以色列诸王史册》”。
    reason: 原文 דִּבְרֵי הַיָּמִים 可指按年代编录的史事或王室年鉴；两种译法都能表达其作为史料名称的含义。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: 其余的事
  rationale: 这是《列王纪》中概述君王生平资料的固定表达；“事”自然涵盖其作为、经历和相关事项，而不限于言语。句首的 וְ 在此承接上下文，现代汉语无需另加“现在”。
- source_word: זְכַרְיָה
  choice: 撒迦利雅
  rationale: 采用现代中文圣经传统中通行且易于辨认的人名译法。
- source_word: הִנָּם
  choice: 看哪，都
  rationale: הִנָּם 是带复数指代的指示语气，指向前述“其余的事”；“看哪”保留原文刻意唤起注意的庄重语气，“都”体现其复数所指。
- source_word: כְּתוּבִים
  choice: 记在
  rationale: 该被动分词本义为“写着”；在史料出处公式中，“记在”既忠实表达书面记录，也符合现代汉语习惯。
- source_word: עַל סֵפֶר
  choice: 在……上
  rationale: 保留 עַל 的基本关系，同时“记在书上”是自然的现代汉语表达。
- source_word: דִּבְרֵי הַיָּמִים
  choice: 历代志
  rationale: 该词组在此指王室年代记录或史册；“历代志”保留其标题式、编年史式色彩。
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: 以色列诸王
  rationale: לְ 在此标明该史料与以色列诸王的所属或相关关系；置于书名中译作“以色列诸王”简洁自然。
theological_decisions: []
