base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 亚撒利雅其余的事迹，以及他所行的一切，不都写[a]在《犹大列王大事记》[b]中吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “写”也可译作“记载”。
    reason: lexical_alternative
  - marker: b
    text: 《犹大列王大事记》指《列王纪》中屡次引用的一份犹大王室史料或编年记录，并非现存圣经中的《历代志》。
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי עֲזַרְיָהוּ
  choice: 亚撒利雅其余的事迹
  rationale: יֶתֶר 表示本段未叙述的其余部分；在列王纪的君王总结套语中，דִּבְרֵי 指相关事迹或事项，并非单指言语。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 以及他所行的一切
  rationale: 保留原文范围广泛的关系从句；“所行”符合庄重的历史叙事语体，又不把内容局限为某类功业。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都写……吗
  rationale: 保留 הֲלֹא 所引出的反问形式，并以“写”直接对应 כְּתוּבִים；汉语中由“不都……吗”自然表达预期肯定答案。
- source_word: עַל סֵפֶר
  choice: 在……上
  rationale: 贴近希伯来语“在书卷上”的表达，同时在现代汉语中仍自然可懂。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王大事记》
  rationale: דִּבְרֵי הַיָּמִים 在此指按时日编录的王室史料；“大事记”自然传达编年纪事性质，也避免让读者误以为这是正典《历代志》。לְמַלְכֵי יְהוּדָה 在书名中译作“犹大列王”。
