  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹתָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 约坦其余所行的事，不都记载[a]在《犹大列王纪》[b]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “记载”直译为“写着”或“写在”。这里指这些事迹被写入文献记录。
    reason: lexical_alternative
  - marker: b
    text: 《犹大列王纪》指记载犹大诸王事迹的王室编年资料，不一定是圣经中现存的某卷书。
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם אֲשֶׁר עָשָׂה
  choice: 约坦其余所行的事
  rationale: יֶתֶר意为“其余”，דִּבְרֵי在君王生平总结的固定表达中指所行的事迹，而非单指言语。将关系从句אֲשֶׁר עָשָׂה自然合并为“所行的”，既保留原意，也符合现代汉语表达。句首וְ在此承担承接作用，汉语无需另加“现在”等时间副词。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记载……吗
  rationale: הֲלֹא引出预期肯定回答的反问，因此译作“不都……吗”。כְּתוּבִים字面为“写下”，在官方文献语境中译作“记载”更自然；脚注保留其字面表达。
- source_word: עַל סֵפֶר
  choice: 在……上
  rationale: עַל字面为“在……之上”；与记载文献搭配时，汉语“记载在……上”自然，也保留了原文介词意象。סֵפֶר在此指书卷或文献。
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王纪》
  rationale: דִּבְרֵי הַיָּמִים在王室资料引文中指按时日记录的史事或编年纪事；לְמַלְכֵי יְהוּדָה说明该文献关乎犹大诸王。以书名号标示其作为资料名称，并在脚注说明其性质，避免误认作现存圣经书卷。
theological_decisions:
- issue: 所引文献的身份
  choice: 将其作为犹大王室编年史料的名称处理
  alternative: 将其等同于圣经中的《历代志》或《列王纪》
  rationale: 经文本身只表明这是记录犹大诸王事迹的文献，并未断定它就是现存正典中的某一卷书；译文与脚注不作超出原文的认定。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。保留原文反问句式及其预期肯定的语气；人名按通行中文圣经译名译作“约坦”。
