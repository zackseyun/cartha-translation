base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: zh_hans
  text: 约坦与他列祖同眠，也与他列祖一同葬在他先祖大卫的城里[a]。他的儿子亚哈斯接续他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“大卫、他的父亲的城。”这里的“父亲”指先祖或王朝祖先，并非生父。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: 同眠
  rationale: 这是与“列祖”连用的王室死亡套语；“同眠”保留希伯来文的意象，而下文的安葬明确表明其死亡含义。
- source_word: עִם אֲבֹתָיו
  choice: 与他列祖
  rationale: “列祖”是现代中文圣经语体中自然、庄重的祖先称谓，也保留王朝讣告公式的形式感。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 用中文自然的被动含义表达希伯来文被动式，并清楚承接死亡与安葬的事件次序。
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: 在他祖先大卫的城里
  rationale: אָבִיו字面为“他的父亲”，此处因大卫并非约坦的生父，必指王朝祖先；译作“祖先”避免现代读者误解，同时保留亲属与大卫王朝的关系。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 这是中文王位继承叙事中简洁自然的表达，对应מלך的统治含义。
- source_word: תַּחְתָּיו
  choice: 接续他
  rationale: 准确表达继位、取代其王位的意思，比字面“在他之下”更符合现代汉语。
theological_decisions:
- issue: “大卫，他的父亲”（דָּוִד אָבִיו）中“父亲”的含义
  choice: 译为“大卫，他的祖先”这一王朝性亲属关系
  alternative: 字面译作“大卫，他的父亲”，另加注说明并非生父
  rationale: 约坦的生父是乌西雅（亚撒利雅），所以这里的אָב必是“先祖、王朝祖先”的广义用法。正文译明可避免事实性误读，并不加入宗派解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“同眠”“列祖”适度保留希伯来王室讣告公式的意象和语感；“接续他作王”则按自然汉语表达王位继承。
