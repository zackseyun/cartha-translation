  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: zh_hans
  text: 犹大王亚撒利雅在位第三十九年，迦底的儿子米拿现登基统治以色列，在撒玛利亚作王十年。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה לַעֲזַרְיָה
  choice: 犹大王亚撒利雅在位第三十九年
  rationale: 这是君王纪年同步公式。中文补出“在位”，自然清楚地表达希伯来语介词结构所指的亚撒利雅执政年份。
- source_word: מֶלֶךְ יְהוּדָה
  choice: 犹大王
  rationale: 简明、自然地表达“犹大的王”这一王号。
- source_word: מָלַךְ
  choice: 登基统治
  rationale: 此处动词表示米拿现开始执掌王权；下文另述其执政年数，因此用“登基统治”避免把它误解为单纯概述整个统治期。
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: 迦底的儿子米拿现
  rationale: 按现代中文圣经人名习惯音译专名，并保留父子身份说明。
- source_word: עַל יִשְׂרָאֵל
  choice: 统治以色列
  rationale: עַל 与君王动词连用，表示对人民或国土行使统治权；中文以“统治以色列”最自然。
- source_word: עֶשֶׂר שָׁנִים בְּשֹׁמְרוֹן
  choice: 在撒玛利亚作王十年
  rationale: 准确表达执政时长与王都所在地；“作王”符合中文历史叙事语体。
theological_decisions: []
