  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: zh_hans
  text: 有一个人正在砍伐木材时，铁头[a]掉进了水里。他便喊道：“哎呀，我主啊！这铁头是借来的！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“铁”，这里指斧头的铁制部分，也就是斧头的铁头。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל הַקּוֹרָה
  choice: 正砍木料
  rationale: מַפִּיל字面为“使……倒下”，在伐木语境中指砍伐；הַקּוֹרָה可指梁木或木料。译作“砍木料”既符合上下文，也避免中文“砍倒一根梁”所造成的误解。
- source_word: הַבַּרְזֶל
  choice: 铁头
  rationale: 原文直译为“铁”，在这里以材质代指工具的铁制部分，即斧头的铁头；“铁头”自然清楚，同时用脚注保留原文措辞。
- source_word: וַיִּצְעַק
  choice: 喊道
  rationale: 表达因借来的铁头落水而突然发出的焦急呼喊。
- source_word: אֲהָהּ
  choice: 哎呀
  rationale: 这是表示惊慌、懊恼的感叹语；“哎呀”是现代汉语中自然且不失庄重的对应表达。
- source_word: אֲדֹנִי
  choice: 我主啊
  rationale: 这是对以利沙这位尊长的敬称；保留“我主”可传达说话者与其师长之间的从属关系，而不是将其误作对上帝的称呼。
- source_word: שָׁאוּל
  choice: 借来的
  rationale: 该词在此表示物件是借用的，并非说话者所有；补出“这铁头”可使中文指代清楚。
theological_decisions: []
