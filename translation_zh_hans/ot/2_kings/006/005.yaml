- from: 有一个人正砍木料时，铁头[a]掉进了水里。他便喊道：“哎呀，我主啊！这铁头是借来的！”
  to: 有一个人正在砍伐木材时，铁头[a]掉进了水里。他便喊道：“哎呀，我主啊！这铁头是借来的！”
  rationale: 仅将“正砍木料”改为“正在砍伐木材”，以避免汉语中“砍木料”偏向加工木料的歧义，并更好反映原文在伐木语境中“使其倒下”的动作。其余措辞及脚注均可保留。
