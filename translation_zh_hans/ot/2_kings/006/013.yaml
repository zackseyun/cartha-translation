base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: zh_hans
  text: 他说[a]：“你们去查看他在哪里，我好派人去捉拿他。”有人向他禀报说：“看哪，他在多坍[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你们去查看他在哪里，我就派人去抓住他。”这里的希伯来语连续结构可较形式化地译为并列动作，也可按语境理解为目的。
    reason: lexical_alternative
  - marker: b
    text: 多坍是撒马利亚以北的一座城；约瑟的故事也提到此地（创世记37:17）。
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 以现代汉语常用的叙事表达承接上文；保留原文代词，不在本节擅自补明身份。
- source_word: לְכוּ וּרְאוּ
  choice: 你们去查看
  rationale: 两个动词都是复数命令式；“你们”显明复数对象，“查看”既保留“看”的基本意义，也符合派人查明所在之处的语境。
- source_word: אֵיכֹה הוּא
  choice: 他在哪里
  rationale: 直接表达地点疑问，简明自然。
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: 我好派人去捉拿他
  rationale: 连续的第一人称未完成式在命令之后自然表达目的；“派人”将希伯来语“派遣”在汉语中所需的隐含受差者明说，“捉拿”体现敌对语境中 לקח 的抓捕含义。
- source_word: וַיֻּגַּד לוֹ לֵאמֹר
  choice: 有人禀报他说
  rationale: 原文采用被动式且不说明报告者；汉语用泛指的“有人”保持报告者不确定，“禀报”符合向君王报告的语境。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 保留提示听者注意新信息的语篇功能，同时采用庄重而仍可理解的现代圣经语体。
- source_word: בְדֹתָן
  choice: 在多坍
  rationale: 介词作地点用；地名按通行中文圣经形式音译为“多坍”。
