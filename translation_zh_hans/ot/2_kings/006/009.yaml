  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: zh_hans
  text: 神人传话给以色列王，说：“你要小心，不要经过这个地方，因为亚兰人正在那里下行[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“亚兰人正往那里下来。”
    reason: נְחִתִּים是“下行、下来”的分词形式；可按中文语境译为“正在那里下行”或“正往那里下来”。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人去告诉
  rationale: 原文直译为“差遣／发送”，但未明说所差遣的对象；上下文表明神人是在传递警告。“派人去告诉”符合现代汉语，也不过度说明传信方式。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 保留这一固定称号，不将其解释性地改为“先知”；本处所指是以利沙，但经文使用的是称号。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 按希伯来语王号和国名直接翻译，汉语中无需加入“的”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 作为引出直接引语的常用表达。
- source_word: הִשָּׁמֶר
  choice: 你要小心
  rationale: 该词在此为警告语气；“你要小心”自然、清楚，并保留命令的力度。
- source_word: מֵעֲבֹר
  choice: 不要经过
  rationale: 与前面的警告动词及介词连用，表示应避免从该处经过；“不要经过”比逐字译法更符合现代汉语。
- source_word: הַמָּקוֹם הַזֶּה
  choice: 这个地方
  rationale: 直接传达定冠词、地点名词和指示词的组合。
- source_word: כִּי שָׁם
  choice: 因为……那里
  rationale: כִּי说明警告的原因，שָׁם指明亚兰人行动所向的地点。
- source_word: אֲרָם
  choice: 亚兰人
  rationale: 原文为“亚兰”，在军事语境中借国名指亚兰军队或亚兰人；译作“亚兰人”比容易产生时代错置的“叙利亚人”准确。
- source_word: נְחִתִּים
  choice: 正往那里下来
  rationale: 该阳性复数分词表示正在下行或下来；译文保留其进行意义和方向性，不把它解释为“埋伏”或“驻扎”。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“神人”保留列王纪中的传统称号；警告语用“你要小心，不要经过”表达，既自然又保持原文的命令语气。脚注标记置于所解释的“下来”之后。
