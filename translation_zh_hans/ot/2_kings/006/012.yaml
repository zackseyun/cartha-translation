base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: zh_hans
  text: 他的一名臣仆说：“不，我主我王！在以色列的先知以利沙，会把你在卧房里所说的话告诉以色列王。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 在王室语境中指服侍亚兰王的属员；“臣仆”既保留从属含义，也比单用“仆人”更符合宫廷场景。
- source_word: לֹוא ... כִּי
  choice: 不是这样。是……
  rationale: 这里不是简单的“不是……而是……”句式，而是先否定王先前关于内奸的推测，再提出真正原因；分句表达更符合现代汉语。
- source_word: יַגִּיד
  choice: 告诉
  rationale: 该未完成式在上下文中表达以利沙反复或一贯向以色列王通报情报；汉语不必强加时态副词。
- source_word: חֲדַר מִשְׁכָּבֶךָ
  choice: 你的卧房
  rationale: 字面为“你睡卧的内室”，指极私密的寝室；“卧房”自然且保留私密场所的意味。
theological_decisions:
- issue: 以利沙获知秘密言语的方式
  choice: 仅陈述以利沙把王的隐秘话语告诉以色列王
  alternative: 明确说这是上帝启示或超自然知晓
  rationale: 本节没有明说信息如何临到以利沙；译文保留叙事含蓄，不额外补入神学解释。
- issue: כִּי 的语气关系
  choice: 译作纠正性说明“是……”
  alternative: 译作因果性的“因为”
  rationale: 臣仆先否定存在泄密者的推断，随后指出真正原因；此处更接近反驳后的说明，但不改变以利沙通报情报这一核心陈述。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“我主我王”保留对君王的双重敬称；“臣仆”“卧房”契合宫廷叙事，又便于普通读者理解。
