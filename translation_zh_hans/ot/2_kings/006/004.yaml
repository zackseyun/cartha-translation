  text: So he went with them[a], and they came to the Jordan and cut down the trees.
translation:
  language: zh_hans
  text: 于是他跟他们一起去了。他们来到约旦河，就砍伐树木[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “树木”或译“木材”。希伯来语这个词可指树，也可指木料；在这里砍伐的语境中，译为“树木”较为贴切。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 于是他……去了
  rationale: 连续式叙事动词推进情节；“于是”自然承接上文，并保留先后关系。
- source_word: אִתָּם
  choice: 跟他们一起
  rationale: 直接表达同行之意；“一起”使现代汉语行文自然。
- source_word: וַיָּבֹאוּ
  choice: 他们来到
  rationale: בוא在这里表示抵达目的地；“来到”符合汉语叙事习惯。
- source_word: הַיַּרְדֵּנָה
  choice: 约旦河边
  rationale: 词尾的方向性־ָה表示朝约旦而去；地名在此指约旦河，“河边”结合砍伐场景自然表达抵达该处，但不限定具体岸点。
- source_word: וַיִּגְזְרוּ
  choice: 砍伐
  rationale: גזר在此语境中指为取建材而砍树；“砍伐”比泛泛的“砍”更准确、庄重。
- source_word: הָעֵצִים
  choice: 树木
  rationale: עֵץ复数既可指树，也可指木材；在现场砍取建材的语境中，“树木”优先保留其作为被砍伐对象的含义。
