base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/028.yaml
  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: zh_hans
  text: 王对她说：“你有什么事？”她说：“这个妇人对我说：‘把你的儿子交出来，我们今天吃他；明天再吃我的儿子。’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָךְ
  choice: 你有什么事？
  rationale: 这是询问对方出了什么事或有何诉求的常用表达；译文自然简洁，也不额外限定为痛苦、烦恼等特定含义。
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: 把你的儿子交出来
  rationale: תְּנִי 字面为“给出”，在此语境中是要求对方交出儿子供二人食用；“交出来”准确传达这一动作，又保持叙述的强烈程度。
- source_word: וְנֹאכְלֶנּוּ
  choice: 我们……吃他
  rationale: 保留第一人称复数和阳性单数宾语，清楚表达两个妇人共同吃掉儿子的骇人提议。
- source_word: וְאֶת־בְּנִי נֹאכַל מָחָר
  choice: 明天再吃我的儿子
  rationale: 按希伯来语语序和语义表达时间对照；“再”自然体现先吃一个、翌日吃另一个的安排。
theological_decisions:
- issue: 围城饥荒中的食人叙述
  choice: 直译并保留其骇人内容
  alternative: 采用委婉说法弱化“吃儿子”
  rationale: 原文明确陈述这一行为，且其震撼性属于上下文对围城惨况的刻画，不应出于敏感性而淡化。
translation_notes:
  register: 采用现代、庄重而直接的叙事语言。引语层级清楚；不添加原文没有的解释，也不把“你有什么事”窄化为某一种困扰。
