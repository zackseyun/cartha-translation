  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: zh_hans
  text: “请让我们到约旦河去；每人从那里取一根梁木，我们在那里为自己造个住处，以便住在那里。”他说：“你们去吧。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: 请让我们……去
  rationale: 第一人称复数祈愿式配合 נָא，表达带礼貌语气的请求；此译法兼顾共同意愿与请求意味。
- source_word: עַד הַיַּרְדֵּן
  choice: 到约旦河
  rationale: עַד 在行程语境中表示“到、直至”；补出“河”符合现代汉语对该地理名称的通常表达。
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: 每人从那里取一根木料
  rationale: אִישׁ…אֶחָת 具有逐一分配的意思；קוֹרָה 指建筑用的梁木或木料。“木料”既符合取材建造的语境，也避免限定其已经加工成梁。
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: 在那里为自己建一个住处
  rationale: עשה 本义宽泛，可指“做、建造”；结合取木料的上下文译作“建”自然。“为自己”保留 לָנוּ 的受益含义。
- source_word: לָשֶׁבֶת שָׁם
  choice: 住处
  rationale: ישב 在此指居住。将目的短语自然整合为“一个住处”，避免汉语中重复说“在那里……在那里住”，同时保留原意。
- source_word: וַיֹּאמֶר לֵכוּ
  choice: 他说：‘你们去吧。’
  rationale: 简洁保留叙事回应和复数命令；句末“吧”自然表达许可语气，而非严厉命令。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“木料”保留 קוֹרָה 在此处可指梁木或建筑木材的语义范围；不增添经文未明说的建筑类型。
