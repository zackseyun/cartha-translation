base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: zh_hans
  text: 先知的门徒[a]对以利沙说：“请看，我们在你面前[b]所住的地方，对我们来说太挤了。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文直译为“先知之子”，这里可能指先知群体的成员或受教者。
    reason: lexical_alternative
  - marker: b
    text: “在你面前”也可能表示“在你的带领或监管之下”。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: 先知的门徒
  rationale: 希伯来语直译为“先知之子”，在此是指先知群体中的成员或受教者。现代汉语若直译为“先知的儿子们”容易误解为血缘关系，因此正文采用语境清楚、不过度限定组织形式的“先知的门徒”，并以脚注保留原文习语。
- source_word: הִנֵּה נָא
  choice: 请看
  rationale: הִנֵּה用于引起注意，נָא使语气较为委婉；“请看”简洁自然地兼顾两者。
- source_word: הַמָּקוֹם
  choice: 地方
  rationale: 原词泛指地点；上下文虽可能涉及住处或聚集处，但不宜在本节过早具体化。
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: 我们在你面前居住
  rationale: יָשַׁב在此结合空间不足的语境取“居住”；שָׁם在汉语关系结构中不必机械译作“那里”。לְפָנֶיךָ保留为“在你面前”，既可表达实际同处，也可能暗示在以利沙的带领或监管之下。
- source_word: צַר מִמֶּנּוּ
  choice: 对我们来说太挤了
  rationale: צַר具有狭窄、局促之意；“太挤了”符合多人共处而空间不足的语境，也比“太小”更贴近词义。
- source_word: וַיֹּאמְרוּ
  choice: 对……说
  rationale: 叙事性连续形式推进情节；现代汉语无需另加“现在”，也不必机械补出“于是”。
theological_decisions:
- issue: “先知之子”的群体身份
  choice: 正文译为“先知的门徒”，脚注说明直译及群体含义
  alternative: 先知之子／先知的儿子们／先知团体的成员
  rationale: 经文没有明确界定其组织制度或每个人与以利沙的关系；此译避免血缘误读，同时不把该群体规定为某种后世宗派制度。
- issue: לְפָנֶיךָ与以利沙的关系
  choice: 保留“在你面前”的开放表达
  alternative: 在你的带领下／与你同住／在你跟前
  rationale: 原短语可能表示在场于以利沙面前，也可能含受其监督或教导之意；正文不消除这一歧义，脚注予以说明。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“门徒”在此按一般意义表示受教者，并非引入后世宗派身份；“太挤了”自然传达空间狭窄。脚注标记均置于其所说明的正文成分之后。
