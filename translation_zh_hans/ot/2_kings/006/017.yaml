  text: וַ/יִּתְפַּלֵּ֤ל אֱלִישָׁע֙ וַ/יֹּאמַ֔ר יְהוָ֕ה פְּקַח נָ֥א אֶת עֵינָ֖י/ו וְ/יִרְאֶ֑ה וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵינֵ֣י הַ/נַּ֔עַר וַ/יַּ֗רְא וְ/הִנֵּ֨ה הָ/הָ֜ר מָלֵ֨א סוּסִ֥ים וְ/רֶ֛כֶב אֵ֖שׁ סְבִיבֹ֥ת אֱלִישָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: zh_hans
  text: 以利沙祷告说：“耶和华啊，求你开他的眼睛，使他能看见。”耶和华就开了那年轻人[a]的眼睛，他便看见：看哪，山上遍布马匹和火战车，四面围绕着以利沙。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “年轻人”也可译作“侍从”或“仆人”；希伯来语 naʿar 可指年轻人，也可按语境指随从或侍从。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: 祷告
  rationale: 此处 פלל 的 Hitpael 形式指向上帝祈求；“祷告”在现代汉语叙事中自然、准确。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 直接呈现四字神名所指的专名；“耶和华”是现代中文圣经语境中通行且易懂的形式。
- source_word: פְּקַח נָא
  choice: 求你开
  rationale: פקח 是“打开”，用于眼睛；נא 在祈祷中表达恳求语气，“求你”比时间性的“现在”更符合上下文。
- source_word: וְיִרְאֶה
  choice: 使他能看见
  rationale: 承接祈使句，表达目的或结果；该译法自然呈现这一句法关系。
- source_word: הַנַּעַר
  choice: 那年轻人
  rationale: נער 可指少年、年轻人或侍从；正文保留年龄称谓的宽度，不把其身份单一化为“仆人”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הנה 引导注意、凸显突然发现的叙事作用。
- source_word: הָהָר מָלֵא
  choice: 山上遍布
  rationale: 自然表达“山满了……”的景象，同时保留其覆盖范围之广。
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: 火马和火战车
  rationale: “火”在希伯来语表面上紧接“战车”，但整体意象可理解为由火所显现的马与战车；中文并列为“火马和火战车”简洁自然，同时以脚注保留句法上的另一可能。
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: 四面围绕着以利沙
  rationale: 准确传达 סביבות 的环绕含义和保护性阵势，而不额外界定这些军队的本体性质。
theological_decisions:
- issue: 神名 יהוה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文直接使用四字神名。正文采用中文读者最熟悉的专名形式“耶和华”，而不是以称号“主”替代；“雅威”是另一种较接近学术重构的音译。
- issue: 所见景象的性质
  choice: 只陈述眼睛被开启后看见火马和火战车
  alternative: 明确解释为实体天使军队或纯象征性异象
  rationale: 原文没有说明这些马和战车在本体上是实体、异象还是天使的象征；译文不替文本作出裁决。
- issue: “火”修饰范围
  choice: 正文译为“火马和火战车”，脚注保留“马和火战车”
  alternative: 马和火战车
  rationale: 希伯来语 אֵשׁ 在句法上直接修饰 רֶכֶב“战车”，但火的意象也可能自然笼罩整个天军场景；以脚注保留形式上更严格的读法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“看哪”有意保留原文突显惊奇发现的语用效果；不把所见景象进一步解释为天使、幻象或物质军队。
