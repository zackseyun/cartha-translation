    rationale: 原文为“马匹和战车的火／火战车”（סוּסִים וְרֶכֶב אֵשׁ）；אֵשׁ直接置于“战车”之后。尽管整体异象具有火的意象，正文应采用较直接、较少解释性的“马匹和火战车”。
