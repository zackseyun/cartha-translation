revisions:
- from: 以利沙祷告说：“耶和华啊，求你开他的眼睛，使他能看见。”耶和华就开了那年轻人的眼睛，他便看见：看哪，山上遍布火马和火战车，四面围绕着以利沙。[a]
  to: 以利沙祷告说：“耶和华啊，求你开他的眼睛，使他能看见。”耶和华就开了那年轻人[a]的眼睛，他便看见：看哪，山上遍布马匹和火战车，四面围绕着以利沙。
