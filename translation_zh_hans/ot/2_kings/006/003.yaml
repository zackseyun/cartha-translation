  yaml_path: translation/ot/2_kings/006/003.yaml
  text: Then one said[a], “Please be willing to go with your servants.” And he said, “I will go.”
translation:
  language: zh_hans
  text: 其中一人说：“请你答应和你的仆人们一起去[a]。”他说：“我去。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“请你肯与仆人们一同去。”
    reason: 原文 הוֹאֶל נָא 是礼貌而恳切的请求，可表达“答应、应允”或“肯、愿意”。
lexical_decisions:
- source_word: הָאֶחָד
  choice: 其中一人
  rationale: 原文直译为“那一个”，在此指这群人中的一人；“其中一人”既明确语境，又符合现代汉语表达。
- source_word: הוֹאֶל נָא
  choice: 求你肯
  rationale: הוֹאֶל 表示愿意、肯或应允，נָא 加强恳求和礼貌语气；“求你肯”保留了请求的郑重与意愿色彩。
- source_word: וְלֵךְ
  choice: 去
  rationale: 该动词与前面的 הוֹאֶל 连用，说明所请求之事；汉语用“肯……去”自然地表达这一结构。
- source_word: אֶת עֲבָדֶיךָ
  choice: 和你的仆人一同
  rationale: 这里的 אֶת 表示伴随；עֲבָדֶיךָ 是说话者谦称自己及同伴为以利沙的仆人，因此译作“和你的仆人一同”。
- source_word: אֲנִי אֵלֵךְ
  choice: 我去
  rationale: 原文显式使用第一人称代词，略带强调；简洁的“我去”在现代汉语中自然表达同意前往。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而自然的叙事语言。“求你肯”略带古雅但仍通俗，适合表达原文郑重的恳求语气；对话保持简洁。
