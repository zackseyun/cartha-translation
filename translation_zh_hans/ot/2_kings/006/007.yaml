  yaml_path: translation/ot/2_kings/006/007.yaml
  text: And he said, “Pick it up for yourself.” So he reached out his hand and took it.
translation:
  language: zh_hans
  text: 他说：“你自己把它拿起来[a]。”他就伸手把它拿了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“你自己把它举起来。”希伯来语命令词的基本意思是“举起、使升起”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 以简洁的叙事承接表达希伯来语 wayyiqtol；汉语不必机械加入“于是”，上下文已清楚显示动作次序。
- source_word: הָרֶם
  choice: 把它捞起来
  rationale: 该使役命令式的核心义是“举起、使升起”；结合铁斧落水并浮起的语境，“捞起来”是现代汉语中自然且明确的说法，同时脚注保留较直译的可能。
- source_word: לָךְ
  choice: 你自己
  rationale: 保留介词加第二人称单数后缀所强调的亲自参与之意，比单纯省略更能体现原文语气。
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: 那人就伸手
  rationale: “伸手”自然传达原文“伸出他的手”的动作；补出“那人”可避免连续代词在汉语中指代含混。
- source_word: וַיִּקָּחֵהוּ
  choice: 把它拿了起来
  rationale: לקח 的基本义为“拿、取”；这里用“拿了起来”既符合从水中取回斧头的场景，也避免与前一命令完全重复。
theological_decisions: []
translation_notes:
  register: 采用现代、清楚而庄重的叙事语言。“捞起来”贴合从水中取物的具体语境；以脚注保留“举起来”这一更接近词形核心义的译法。
