  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם אֱלִישָׁ֗ע לֹ֣א זֶ֣ה הַ/דֶּרֶךְ֮ וְ/לֹ֣א זֹ֣ה הָ/עִיר֒ לְכ֣וּ אַחֲרַ֔/י וְ/אוֹלִ֣יכָה אֶתְ/כֶ֔ם אֶל הָ/אִ֖ישׁ אֲשֶׁ֣ר תְּבַקֵּשׁ֑וּ/ן וַ/יֹּ֥לֶךְ אוֹתָ֖/ם שֹׁמְרֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: zh_hans
  text: 以利沙对他们说：“这不是那条路，也不是那座城。跟我来[a]，我会领你们到你们要找的那个人那里。”于是，他领他们到了撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“走在我后面。”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: 那条路
  rationale: דֶּרֶךְ可指道路、路径；结合指示词זֶה，译作“那条路”能自然表达特指的、眼前所谈的路线。
- source_word: הָעִיר
  choice: 那座城
  rationale: עִיר是“城”的常用词；结合זֹה及上下文，译为“那座城”，与前句“那条路”形成自然对应。
- source_word: לְכוּ אַחֲרַי
  choice: 跟我来
  rationale: 字面为“走在我后面／跟在我后面”。现代汉语中“跟我来”最自然地表达命令和随行移动；脚注保留较直译的表达。
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: 我会领你们
  rationale: הלך的使役式在此表示带领、使人前往；“领你们”简明自然，也与后文同一动词的叙述用法保持一致。
- source_word: הָאִישׁ
  choice: 那个人
  rationale: אִישׁ通常指“男人”或“人”；此处以利沙间接指自己。“那个人”既保留单数具体所指，也较符合现代汉语叙事。
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: 你们要找的
  rationale: בקשׁ在此表示寻找；“你们要找的”自然表达当下搜寻的对象，不额外限定动作时态。
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: 他领他们
  rationale: 再次出现הלך的使役式，译为“领”，与前句“领你们”保持词汇呼应。
- source_word: שֹׁמְרוֹנָה
  choice: 到了撒马利亚
  rationale: 词尾方向性-ה表示朝向撒马利亚移动；汉语以“领他们到了撒马利亚”自然表达抵达目的地。
theological_decisions:
- issue: 以利沙对亚兰人的误导性陈述
  choice: 按原文直译为“这不是那条路，也不是那座城”
  alternative: 用释义说明这话部分真实、属于计谋或明确称为欺骗
  rationale: 原文只直接记述以利沙的话，没有作伦理评断。译文保留其表面陈述及叙事张力，不替读者化解其中的伦理或神学问题。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“跟我来”符合自然口语命令，“于是”清楚衔接后续行动；不增添对以利沙行为的道德评价。
