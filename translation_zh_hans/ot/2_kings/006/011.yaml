base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: zh_hans
  text: 亚兰王因这事心里大为烦乱，就召来臣仆，对他们说：“你们不告诉我，我们中间谁是以色列王那边的人吗？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我们中间谁是向着以色列王的？”这句希伯来文十分简略，可能指站在以色列王一边，或与他暗中串通。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר
  choice: 大为烦乱
  rationale: 该动词描写如风暴般的内在激荡，可包含不安、愤怒等情绪；“大为烦乱”既符合上下文，也不把含义限于发怒。
- source_word: לֵב
  choice: 心里
  rationale: 希伯来语“心”指人的内在思想和情感；译作“心里”保留意象，同时符合现代汉语表达。
- source_word: עַל הַדָּבָר הַזֶּה
  choice: 因这事
  rationale: עַל在此表原因或所针对的事情；“因这事”简洁自然，并衔接上文的军情屡次泄露。
- source_word: עֲבָדָיו
  choice: 臣仆
  rationale: 在王室语境中，此词指服事君王的人，可能包括臣僚或军政人员；“臣仆”比一般的“仆人”更符合宫廷场景，同时不过度限定具体官职。
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: 你们不告诉我……吗
  rationale: 保留带否定词的反问形式，体现君王急切而带责问意味的要求。
- source_word: מִי מִשֶּׁלָּנוּ
  choice: 我们中间谁
  rationale: 自然表达君王怀疑己方内部有人通敌的意思。
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: 是以色列王那边的人
  rationale: 原文表达极简，介词短语暗示归附、支持或与以色列王串通；此译法在现代汉语中清楚表达阵营归属，又以脚注保留其字面形式与语义张力。
