base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: zh_hans
  text: 王听见那妇人的话，正沿着城墙行走时，就撕裂了自己的衣服；百姓看见，原来他贴身穿着麻衣[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“从里面”，表示麻衣穿在外衣下面。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: 听见……就
  rationale: כ 加不定式构成时间从句；“听见……就”自然表达先后关系，同时保持叙事的紧凑感。
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: 那妇人的话
  rationale: דְּבָרִים 在这里指妇人刚才所说的话；用“话”直接对应上下文，不将其解释为“事情”或“陈述”。
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: 撕裂了自己的衣服
  rationale: 保留表示悲痛或震惊的具体动作；“衣服”比“衣袍”更通俗，也未限定衣物种类。
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: 他正从城墙上经过
  rationale: 分词结构表示当时正在发生的伴随情形；“从城墙上经过”保留其沿城墙行进的空间含义。
- source_word: וַיַּרְא הָעָם
  choice: 百姓一看
  rationale: ראה 基本义为“看见”；“一看”在中文中自然引出随后突然显明的情景。
- source_word: וְהִנֵּה
  choice: 原来
  rationale: הִנֵּה 用来引人注意一个出人意料或此前不明显的事实；“原来”在本句中自然传达发现之意。
- source_word: הַשַּׂק
  choice: 麻衣
  rationale: 指以粗糙材料制成、用于哀悼或自卑的衣物；“麻衣”是现代中文圣经语境中清楚而简洁的表达。
- source_word: עַל־בְּשָׂרוֹ
  choice: 贴身穿着
  rationale: 字面为“在他的肉身上”；结合衣服被撕开后显露的场景，“贴身穿着”自然表达麻衣直接覆在身上的意思。
- source_word: מִבָּיִת
  choice: 衣服里面
  rationale: 字面意思是“从里面”；上下文表明麻衣藏在外衣之下。正文作明确但克制的表达，并以脚注保留原文措辞。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语言。“百姓一看，原来……”再现原文 וְהִנֵּה 的现场发现感；不额外说明王穿麻衣的动机，以免超出本节明说的内容。
