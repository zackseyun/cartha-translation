revisions:
- from: 王听见那妇人的话，就撕裂了自己的衣服。他正从城墙上经过，百姓一看，原来他衣服里面贴身穿着麻衣[a]。
  to: 王听见那妇人的话，正沿着城墙行走时，就撕裂了自己的衣服；百姓看见，原来他贴身穿着麻衣[a]。
  rationale: 将“正沿着城墙行走时”置入王撕裂衣服的时间框架，明确原文的伴随情形，并将“从城墙上经过”调整为更自然的现代汉语。其余内容及脚注维持原意；不说明麻衣所表达的动机。
