base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: zh_hans
  text: 以色列王看见他们时，就对以利沙说：“我可以击杀他们吗？我可以击杀他们吗？[a]我父啊！[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“要我击杀他们吗？要我击杀他们吗？”原文重复同一词根，以加强语气。
    reason: lexical_alternative
  - marker: b
    text: “我父”是以色列王对以利沙的尊称，并不是说以利沙是他的生父。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 就……说
  rationale: 叙事中的连续式推动事件发展；结合前面的时间从句译为“就……说”，符合现代汉语叙事习惯。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 按原文的属格结构直译，所指在上下文中明确。
- source_word: אֶל אֱלִישָׁע
  choice: 对以利沙
  rationale: 介词 אֶל 在此引出说话对象；不添加原文没有的“先知”。
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: 一看见他们
  rationale: 带介词 כְּ 的不定词结构表达时间关系，后缀所指的主语依上下文为以色列王；“一看见”自然表达随即发生的语气。
- source_word: הַאַכֶּה אַכֶּה
  choice: 我可以击杀他们吗？我可以击杀他们吗？
  rationale: 疑问形式加同词根的绝对不定词构成强调。重复完整问句，既保留希伯来文的重复，也呈现王请求许可的语境；“击杀”体现军事场景中的致命含义。
- source_word: אָבִי
  choice: 我父啊
  rationale: 原文直译为“我父”，在此是对以利沙的尊称，并非生父之意；保留亲属称谓，避免释义为“先生”或“主人”而削弱原文形象。
theological_decisions:
- issue: 以“父”称呼以利沙的含义
  choice: 正文保留“我父啊”，脚注说明这是尊称。
  alternative: 释译为“我主”“老师”或“先生”。
  rationale: 原文使用亲属称谓 אָבִי，既表达尊敬，也呈现王与先知之间的关系；直译并加注可避免误解，同时不把某种特定身份观念强加于经文。
- issue: 王的问句是请求许可还是表示意图
  choice: 译为“我可以……吗”，呈现向以利沙请求许可的自然语境。
  alternative: 译为“要我……吗”或“我该……吗”。
  rationale: 希伯来语疑问未把情态限定得完全单一；“我可以……吗”贴合上下文，但脚注保留“要我……吗”这一可能表达。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“击杀”比单纯的“打”更符合军事语境；连续两次问句保留原文的强调效果。“我父啊”略带古雅色彩，但为保存原文的亲属称谓及尊敬意味而保留，并用脚注解释。
