  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: zh_hans
  text: 亚兰王正与以色列交战。他和臣仆商议说：“我的营地要设在某处某地[a]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译：“我的营地在某处某地。”希伯来语这里用的是不指明具体地点的惯用说法。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: אֲרָם按地名译作“亚兰”，不以较后期的地域名称“叙利亚”替代；句首连接词在本节中文叙事中无需机械译出。
- source_word: הָיָה נִלְחָם בְּיִשְׂרָאֵל
  choice: 正与以色列交战
  rationale: היה加分词表达过去时段中持续或反复进行的行动；“正……交战”保留其延续意味。ב在נלחם之后标明交战对象，现代汉语自然表达为“与……交战”。
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: 他和臣仆商议
  rationale: 动词表示征询意见、共同谋议；עבדים在王室语境中指王的属员，“臣仆”既保留其服事关系，也不把范围过度限定为军官。
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: 在某处某地
  rationale: פלני אלמני是故意不指明地点的成对惯用语；“某处某地”在中文中保留这种含混且略带复沓的表达。
- source_word: תַּחֲנֹתִי
  choice: 我要……安营
  rationale: 该形式可表达“我的营地／驻营处”，语境是王筹划军事部署；译作动词性“我要……安营”符合自然汉语，同时以脚注保留较直译的名词性理解。
