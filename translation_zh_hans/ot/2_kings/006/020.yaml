id: 2KI.6.20
reference: 2 Kings 6:20
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יְהִי֮ כְּ/בֹאָ֣/ם שֹׁמְרוֹן֒ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע יְהוָ֕ה פְּקַ֥ח אֶת עֵינֵֽי אֵ֖לֶּה וְ/יִרְא֑וּ וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵ֣ינֵי/הֶ֔ם וַ/יִּרְא֕וּ וְ/הִנֵּ֖ה בְּ/ת֥וֹךְ שֹׁמְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: zh_hans
  text: 他们来到撒马利亚时，以利沙说：“雅威啊，求你开这些人[a]的眼睛，使他们能看见。”雅威就开了他们的眼睛，他们便看见了；看哪，他们竟在撒马利亚城中。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译为“这些”；这里所指的是亚兰军兵。为使汉语自然，正文补出“人”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: 他们来到……时
  rationale: 该叙事结构加时间性不定式表示事件承接和时间背景；译为“来到……时”自然地保留其时间关系，无须机械译出“事情发生了”。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用该地名通行的现代汉语译法；本处上下文所指为撒马利亚城。末句加“城中”，明确表达 בְּתוֹךְ 所呈现的身处城内之意。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接出现的四字神名，以现代汉语音译“雅威”呈现，而不以称号替代。
- source_word: פְּקַח אֶת עֵינֵי
  choice: 开……的眼睛
  rationale: 保留希伯来文“开眼睛”的具体意象；本处指神除去先前造成的视而不见或认知受阻。
- source_word: אֵלֶּה
  choice: 这些人
  rationale: 原文直译为“这些”；汉语需要中心语才能表达自然，故依上下文所指的亚兰军兵补出“人”，并以脚注说明。
- source_word: וְיִרְאוּ
  choice: 使他们能看见
  rationale: 命令式后的未完成式在此表达祈求的目的或结果；“使他们能看见”自然传达此关系。
- source_word: וַיִּפְקַח יְהוָה אֶת עֵינֵיהֶם
  choice: 雅威就开了他们的眼睛
  rationale: “就”体现以利沙祈求之后随即发生的应验，同时保留原文的叙事推进。
- source_word: וַיִּרְאוּ
  choice: 他们便看见了
  rationale: 保留“看见”的字面表达，不提前解释为“意识到”，让下一分句说明他们所看见或发现的处境。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留 הִנֵּה 引人注意、突出突然发现的语篇作用；“看哪”庄重而简洁。
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: 在撒马利亚城中
  rationale: בְּתוֹךְ 表示“在……里面／当中”；结合上下文明确为城，译文呈现他们已身处撒马利亚城内的戏剧性发现。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文两次直接使用四字神名。译作“雅威”旨在呈现其专名性质，而不是改用“主”等称号；“耶和华”是汉语传统中常见的另一音译。
- issue: “开眼睛”的性质
  choice: 保留“开……的眼睛”的意象
  alternative: 使他们恢复视力／使他们认清处境
  rationale: 上下文涉及神所造成并解除的特殊感知状态。原文既使用视觉语言，也带有认知层面的张力；直译该意象可避免将其仅仅限定为生理失明或纯粹心理领悟。
translation_notes:
  register: 采用自然、庄重的现代标准汉语。以“看哪”保留叙事突转和惊觉感，以“竟”自然强化他们突然发现自己身处敌城中心的意味，但不扩展事件内容。
