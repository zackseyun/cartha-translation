  text: עוֹדֶ֨/נּוּ֙ מְדַבֵּ֣ר עִמָּ֔/ם וְ/הִנֵּ֥ה הַ/מַּלְאָ֖ךְ יֹרֵ֣ד אֵלָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּֽה זֹ֤את הָֽ/רָעָה֙ מֵ/אֵ֣ת יְהוָ֔ה מָֽה אוֹחִ֥יל לַ/יהוָ֖ה עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: zh_hans
  text: 他还在和他们说话的时候，看哪，那使者正下到他那里来；他就说：“看哪，这灾祸是从雅威那里来的。我为什么还要等候雅威呢？”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我还能从雅威那里盼望什么呢？”希伯来语动词既可表示“等候”，也可表示“盼望”。
    reason: 保留 יחל 的词义歧义，以及 מָה 可引出的另一种自然句法理解。
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: 他还在和他们说话的时候
  rationale: 用“还在……的时候”表达 עוֹדֶנּוּ 与分词构成的持续动作，并自然保留“和他们说话”的关系。
- source_word: הַמַּלְאָךְ
  choice: 那使者
  rationale: 本段语境指王所差派的人，并非天使；“使者”既符合词义，也避免误导。定冠词译作“那”，承接上文已知人物。
- source_word: יֹרֵד אֵלָיו
  choice: 下到他那里来
  rationale: 保留 ירד 的向下运动及 אֵלָיו 的趋向；“来”以以利沙所在位置为叙事视点。
- source_word: הִנֵּה
  choice: 看哪
  rationale: 两处均保留其提示注意和加强语气的作用；用略庄重但仍易懂的“看哪”。
- source_word: זֹאת הָרָעָה
  choice: 这灾祸
  rationale: רָעָה 在围城与饥荒语境中指临到的灾难。“灾祸”比“邪恶”更符合所指，同时保留负面和审判色彩。
- source_word: מֵאֵת יְהוָה
  choice: 从雅威那里来的
  rationale: מֵאֵת 表示来源；按所给神名方针，将四字神名译为“雅威”。
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: 我为什么还要等候雅威呢
  rationale: 将疑问词 מָה 按语境表达为“为什么”，עוֹד 译作“还”；יחל 可兼有等候与盼望之意，正文采用“等候”，另一可能见脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”较直接地呈现其专名性质，并与所提供的审定层保持一致。
- issue: יחל 在抱怨中的语义
  choice: 等候雅威
  alternative: 还要从雅威那里盼望什么
  rationale: 该动词可指等候，也可指盼望。上下文中的话表达不愿继续期待神施行拯救；正文采用自然的“等候”，脚注保留“盼望”的另一读法，不消除原文张力。
- issue: 说话者的识别
  choice: 不在正文中明确补出是谁说的
  alternative: 明确译作“王说”或“使者说”
  rationale: 原文 וַיֹּאמֶר 仅为阳性单数“他说”，其主语可能按最近名词理解为使者，也可能结合上下文理解为王。中文沿用“说”，不额外指定身份，以保留原文可能存在的指代张力。
translation_notes:
  register: 采用现代、庄重且口语可懂的叙事文体。“看哪”保留原文两次 הִנֵּה 的修辞力度；“灾祸”适合围城饥荒的具体语境。正文不补明“他说”的主语，避免替原文解决潜在指代问题。
