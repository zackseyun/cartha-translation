  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: zh_hans
  text: 此后，亚兰王便·哈达召集了他的全军[a]，上去围困撒马利亚。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他的全部军队”；原文也可指“他的全营”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: 此后
  rationale: 这是希伯来叙事中承接后续事件的表达。译作“此后”自然简洁，同时保留与上文的时间顺序关系。
- source_word: וַיִּקְבֹּץ
  choice: 召集
  rationale: 该动词意为聚集、集合；军事语境中“召集”准确自然，又不额外加入“征召”等技术含义。
- source_word: בֶּן הֲדַד
  choice: 便·哈达
  rationale: 按现代中文圣经人名音译习惯处理，并以间隔号标示名字构成。
- source_word: מֶלֶךְ אֲרָם
  choice: 亚兰王
  rationale: 原文地名是“亚兰”，故不用传统但较具解释性的“叙利亚”；中文以“亚兰王”自然表达所属关系。
- source_word: כָּל מַחֲנֵהוּ
  choice: 他的全军
  rationale: מַחֲנֶה 可指营地、军营或军队；此处是围城军事行动，“全军”最能清楚表达语境中的所指。
- source_word: וַיַּעַל
  choice: 上来
  rationale: 保留希伯来语表示向某地进军时常用的“上去/上来”表达，也未擅自增添“进军”等原文没有明说的细节。
- source_word: וַיָּצַר עַל
  choice: 围困
  rationale: 该结构表示围攻、围城。“围困”简明自然，适合此处对撒马利亚实施围城的语境。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用该地名通行的现代中文圣经译名。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“此后”避免过度古雅；“召集了他的全军，上来围困”保持原文连续动作的推进感。亚兰无需脚注，因为正文已直接按原文地名翻译，并不存在需要在本节正文中保留的实质歧义。
