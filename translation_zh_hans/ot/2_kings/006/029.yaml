base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: zh_hans
  text: 于是我们煮了我的儿子，把他吃了[a]。第二天，我对她说：‘把你的儿子交出来，好让我们吃他[b]。’她却把自己的儿子藏了起来。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“烹煮了我的儿子，把他吃了。”
    reason: lexical_alternative
  - marker: b
    text: 或译：“我们就要吃他。”希伯来语形式也可较直接地理解为将来时，不过在“把你的儿子交出来”之后，上下文支持目的或结果的意思。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: 我们煮了
  rationale: בשׁל在这里指用煮的方式烹制；“煮了”具体、自然，也保留围城惨剧的直白冲击力。
- source_word: בְּנִי
  choice: 我的儿子
  rationale: בן明确指“儿子”，第一人称单数后缀表达“我的”，不泛化为“孩子”。
- source_word: וַנֹּאכְלֵהוּ
  choice: 把他吃了
  rationale: אכל的基本义是“吃”；宾语后缀明确指男性单数，译出“他”，并用“把”字结构使现代汉语自然。
- source_word: וָאֹמַר אֵלֶיהָ
  choice: 我对她说
  rationale: 准确保留说话者、女性间接宾语及叙事推进；前面的“第二天”已自然呈现时序，无须另加“然后”。
- source_word: בַּיּוֹם הָאַחֵר
  choice: 第二天
  rationale: 该短语在此指前一事件之后的那一天；“第二天”是简洁自然的现代汉语表达。
- source_word: תְּנִי
  choice: 交出来
  rationale: נתן的命令式本义是“给”；在要求对方提供其儿子的语境中，“交出来”比生硬的“给出”自然，同时不增加“带来”等动作。
- source_word: בְּנֵךְ
  choice: 你的儿子
  rationale: 保留בן的男性亲属称谓和第二人称阴性单数所属关系。
- source_word: וְנֹאכְלֶנּוּ
  choice: 好让我们吃他
  rationale: 命令式之后带וְ的未完成式在语境中可表达目的或结果；“好让”自然呈现这一关系，同时以脚注保留简单将来义的可能。
- source_word: וַתַּחְבִּא
  choice: 她却……藏了起来
  rationale: 动词意为“藏匿”；“却”把上下文中拒不照办的转折显明出来，“藏了起来”符合现代汉语叙事习惯。
- source_word: בְּנָהּ
  choice: 自己的儿子
  rationale: 原文是“她的儿子”；在主语同为“她”时，汉语用“自己的儿子”可清楚避免所属关系歧义，仍准确表达第三人称阴性单数后缀。
