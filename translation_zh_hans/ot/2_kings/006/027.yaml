source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַל יוֹשִׁעֵ֣/ךְ יְהוָ֔ה מֵ/אַ֖יִן אֽוֹשִׁיעֵ֑/ךְ הֲ/מִן הַ/גֹּ֖רֶן א֥וֹ מִן הַ/יָּֽקֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: zh_hans
  text: 王说：“如果雅威不救你[a]，我又能从哪里救你呢？难道从禾场，或从榨酒池吗？”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “救”也可译作“帮助”或“解救”。首句的希伯来文结构不寻常，也可按祈愿语气理解为：“愿雅威不要救你”；但按上下文，正文采用条件式理解。
    reason: 说明 ישע 的词义范围，并准确保留 אַל יוֹשִׁעֵךְ יְהוָה 的句法歧义。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 王说
  rationale: 承接上文明确说话者是王；汉语叙事中补出“王”比直译“他”更清楚，也无需机械译出连接词 וַ。
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: 如果雅威不救你
  rationale: 把 אַל 与后面的未完成式理解为省略条件关系的否定前提，符合下句反问及王在饥荒中无力施援的语境；原文句法不寻常，其他理解保留在脚注中。
- source_word: יוֹשִׁעֵךְ / אֹשִׁיעֵךְ
  choice: 救你／救你
  rationale: ישע 在此可表示救助、解救或施以援手。统一译作“救”，既保持两个分句的平行，也符合围城饥荒中脱离困境的实际语境。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，而不以称号替代专名。
- source_word: מֵאַיִן
  choice: 从哪里
  rationale: 准确表达援助来源的疑问，并与后面的禾场和榨酒池自然衔接。
- source_word: הֲמִן הַגֹּרֶן
  choice: 难道从禾场
  rationale: הֲ 标示疑问；“难道”传达反问语气。“禾场”是处理、扬净谷物之处，在此代表粮食来源。
- source_word: מִן הַיָּקֶב
  choice: 或从榨酒池
  rationale: יֶקֶב 可指榨酒设施或承接汁液的池；“榨酒池”具体、易懂，并与“禾场”并列为物资来源。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用以色列之神的专名；音译“雅威”保留专名性质，不用称号取代，也不把本节的救助语言额外灵意化。
- issue: אַל יוֹשִׁעֵךְ יְהוָה 的句法与语气
  choice: 如果雅威不救你
  alternative: “不！愿雅威救你”或“愿雅威不要救你”
  rationale: 原文结构简短且不寻常。按上下文，王是在说明自己没有粮食来源，条件式读法使其推理连贯；但 אַל 通常是否定词，而 יוֹשִׁעֵךְ 也可作祈愿语，因此不应掩盖其他可能读法，故以脚注说明。
- issue: ישע 在本节中的含义
  choice: 救
  alternative: 帮助／解救
  rationale: 这里主要指在围城饥荒中提供实际援助，不必理解为专门的属灵救恩；“救”能同时覆盖脱困和援助，并保持原文两次同词的对应。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“我又能……呢？难道……”自然呈现连续反问；“禾场”和“榨酒池”保留古代农业场景。脚注标记置于整句之后，因为所注内容涉及前半句的句法和全句中的重复动词。
