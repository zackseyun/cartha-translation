source:
  edition: WLC
  text: וֶ/אֱלִישָׁע֙ יֹשֵׁ֣ב בְּ/בֵית֔/וֹ וְ/הַ/זְּקֵנִ֖ים יֹשְׁבִ֣ים אִתּ֑/וֹ וַ/יִּשְׁלַ֨ח אִ֜ישׁ מִ/לְּ/פָנָ֗י/ו בְּ/טֶ֣רֶם יָבֹא֩ הַ/מַּלְאָ֨ךְ אֵלָ֜י/ו וְ/ה֣וּא אָמַ֣ר אֶל הַ/זְּקֵנִ֗ים הַ/רְּאִיתֶם֙ כִּֽי שָׁלַ֞ח בֶּן הַֽ/מְרַצֵּ֤חַ הַ/זֶּה֙ לְ/הָסִ֣יר אֶת רֹאשִׁ֔/י רְא֣וּ כְּ/בֹ֣א הַ/מַּלְאָ֗ךְ סִגְר֤וּ הַ/דֶּ֨לֶת֙ וּ/לְחַצְתֶּ֤ם אֹת/וֹ֙ בַּ/דֶּ֔לֶת הֲ/ל֗וֹא ק֛וֹל רַגְלֵ֥י אֲדֹנָ֖י/ו אַחֲרָֽי/ו׀־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: zh_hans
  text: 以利沙正坐在自己家里，长老们也和他一同坐着。王派了一个人先行；但使者还没有到以利沙那里，以利沙就对长老们说：“你们看，这个杀人凶手的儿子竟派人来取我的头[a]！注意，使者一到，你们就关上门，在门口拦住他。他主人的脚步声不是紧随在他后面吗？”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “取我的头”是指要把以利沙斩首处死；希伯来文直译为“除去我的头”。
    reason: lexical_alternative
  - marker: b
    text: 这里的“使者”是王派来的人，并非天使。
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: 正坐着 / 也……坐着
  rationale: 分词描绘正在持续的场景；“正”自然体现进行状态，第二处用“也”连接同一画面。
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: 王派了一个人先行
  rationale: 根据上文将省略的主语明确为王；מִלְּפָנָיו 在此表示那人从王面前奉派先走，即先于王而行。
- source_word: הַמַּלְאָךְ
  choice: 使者
  rationale: 此处指王所派的人间使者；“使者”既保留词义，也符合王室差遣的语境。
- source_word: הֲרְאִיתֶם
  choice: 你们看
  rationale: 这里是引人注意的反问式话语；现代汉语用“你们看”自然传达说话者的愤慨和警告。
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: 这个杀人凶手的儿子
  rationale: 保留“……的儿子”这一带有蔑视的称呼及其血债关联，不改写成对王本人直接称作凶手。
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: 来取我的头
  rationale: 贴近希伯来文“除去／取走我的头”的表达，同时现代中文能自然理解为斩首处死。
- source_word: רְאוּ
  choice: 注意
  rationale: 该命令语用于引出紧急应对措施；“注意”比重复“看”更符合现代汉语话语衔接。
- source_word: סִגְרוּ הַדֶּלֶת
  choice: 关上门
  rationale: 清楚表达紧急关闭门户的防御行动。
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: 用门把他挡在外面
  rationale: לָחַץ 表示挤压、逼住或制住；结合门口情境，此译表达用门顶住使者、不让他进入，同时不武断描写具体夹压方式。
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: 他主人的脚步声不是紧随在他后面吗
  rationale: 保留反问形式以及“主人”“脚／脚步之声”“在后面”等意象，并自然表明王正紧跟使者而来。
theological_decisions:
- issue: וַיִּשְׁלַח 的隐含主语
  choice: 王派了一个人
  alternative: 他派了一个人
  rationale: 上文明确涉及以色列王，且本节末称差遣者为使者的“主人”；在中文中补明“王”可避免误以为以利沙是主语。
- issue: “杀人凶手的儿子”所指
  choice: 保留原文带蔑视的亲属称谓
  alternative: 将其解释性译为“这个凶手”或明确点名其父亲
  rationale: 原文可能指向其父家血债并构成侮称；不在正文中确定具体历史指涉，以保留文本张力。
- issue: 使者与王到来的先后关系
  choice: 王派使者先行，并亲自紧随其后
  alternative: 只笼统译作王从面前派人，不说明先后
  rationale: מִלְּפָנָיו 与末句 אַחֲרָיו 相互照应，支持使者走在王前面的场景。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“正坐着”呈现背景中的持续动作；引语保留以利沙话语中的愤怒、急迫和反问。脚注标记均置于正文：词义说明标在“取我的头”之后，身份说明标在整段引语之后，避免打断紧急命令。
