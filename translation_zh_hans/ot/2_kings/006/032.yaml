revisions:
- from: 以利沙正坐在自己家里，长老们也和他一同坐着。王派了一个人先行；但使者还没有到以利沙那里，以利沙就对长老们说：“你们看，这个杀人凶手的儿子竟派人来取我的头[a]！注意，使者一到，你们就关上门，用门把他挡在外面。他主人的脚步声不是紧随在他后面吗？”[b]
  to: 以利沙正坐在自己家里，长老们也和他一同坐着。王派了一个人先行；但使者还没有到以利沙那里，以利沙就对长老们说：“你们看，这个杀人凶手的儿子竟派人来取我的头[a]！注意，使者一到，你们就关上门，在门口拦住他。他主人的脚步声不是紧随在他后面吗？”[b]
  rationale: 仅作两项安全修订：以“在门口拦住他”避免将门口制止动作过度具体化为“用门把他挡在外面”；并明确脚注a中斩首行动的对象。其余措辞忠实且自然，予以保留。
