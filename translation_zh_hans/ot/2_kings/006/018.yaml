  naturalness: “眼目昏迷”不属现代标准汉语中自然的视觉障碍表达，读者容易理解为眼睛疲乏、头昏或意识昏迷。“使……失明”简洁、庄重，符合叙事和祷告语境。
  terminology: “雅威”“以利沙”“祷告”“击打”均合宜。将הַגּוֹי הַזֶּה译为“这群人”在本节所指的敌军语境中可接受，且避免把实际出动的部队误等同整个民族。
