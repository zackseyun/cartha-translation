revisions:
- from: 他们下来攻击以利沙时，以利沙向雅威祷告说：“求你击打这群人，使他们眼目昏迷[a]。”雅威就照以利沙的话击打他们，使他们眼目昏迷。
  to: 他们下来攻击以利沙时，以利沙向雅威祷告说：“求你使这群人失明[a]。”雅威就照以利沙的话，使他们失明。
  rationale: 修订仅替换不自然且语义不够明确的“眼目昏迷”为“失明”，并相应使末句直接表达雅威对祈求的应允。脚注保留原词可能含有视觉昏乱、目眩而未必永久全盲的含义。其余措辞保留，以维持原文的敌对行动、祷告、神的回应和“照以利沙的话”的结构。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T05:51:15Z'
