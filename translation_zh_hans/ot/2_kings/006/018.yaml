  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: zh_hans
  text: 他们下来攻击以利沙时，以利沙向雅威祷告说：“求你使这群人失明[a]。”雅威就照以利沙的话，使他们失明。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“使他们视觉昏乱”或“使他们目眩”。这里的希伯来词可指神所造成的视觉障碍，使人无法正确看清或辨认，未必指完全或永久的失明。
    reason: 说明罕见词סַנְוֵרִים的语义范围，同时保留“失明”这一正文译法。
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: 他们下来攻击以利沙时
  rationale: יָרַד表示“下来”，אֵלָיו本义为“到他那里”；结合亚兰军队逼近的敌对语境，译作“攻击以利沙”自然表达其军事行动。“时”使希伯来叙事承接关系符合现代汉语。
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: 以利沙向雅威祷告
  rationale: הִתְפַּלֵּל是“祷告”的常用动词；יְהוָה按其专名译为“雅威”。
- source_word: הַךְ נָא
  choice: 求你击打
  rationale: נכה保留“击打”的力度，נָא在祷告中表达恳求，故以“求你”体现。
- source_word: הַגּוֹי הַזֶּה
  choice: 这群人
  rationale: גּוֹי可指民族或一群人；此处具体指逼近以利沙的亚兰军队，译作“这群人”比“这个民族”更符合汉语语境，同时保留其集体所指。
- source_word: בַּסַּנְוֵרִים
  choice: 使他们眼目昏迷
  rationale: סַנְוֵרִים指神所造成的视觉障碍，使人不能正确辨认；“眼目昏迷”保留其可能不是完全或永久失明的含混性。
- source_word: וַיַּכֵּם
  choice: 雅威就……击打他们
  rationale: 上下文中的主语是雅威；汉语明确补出主语可避免与以利沙混淆。“就”表达祷告随即蒙应允的叙事结果。
- source_word: כִּדְבַר אֱלִישָׁע
  choice: 照以利沙的话
  rationale: 保留דָּבָר“话、言语”的希伯来表达，并体现神照先知所求而行。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名；“雅威”较贴近学界通行的希伯来语拟音，并将其作为专名呈现。
- issue: סַנְוֵרִים所指障碍的性质
  choice: 眼目昏迷
  alternative: 失明
  rationale: 该词可指神所降、使人无法正确看清或辨认的视觉障碍，未必表示完全且永久的失明；正文保留这一张力，脚注列出常见译法。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“击打”保留祷告和应验中的重复结构；“眼目昏迷”既自然，又避免把原文罕见词的含义过度限定为全盲。
