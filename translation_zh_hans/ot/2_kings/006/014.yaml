base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/014.yaml
  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: zh_hans
  text: 于是，他派战马、战车和一支庞大的军队[a]到那里。这些部队在夜间来到，包围了那城。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“大军”。希伯来文直译为“沉重的军队”，是指一支规模可观的军事力量。
    reason: 保留חַיִל כָּבֵד在表示兵力规模庞大、可观这一语义范围中的表达差异，避免‘强大’可能引入的战力含义。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 他派
  rationale: 该动词在连续叙事中表示亚兰王派出军事力量；“派”简洁自然。
- source_word: שָׁמָּה
  choice: 到那里
  rationale: 这是表示方向和目的地的副词，具体地点由上文交代。
- source_word: סוּסִים
  choice: 战马
  rationale: 原词直指“马”；结合军事语境译作“战马”，既保留具体意象，也避免改译成原文未明说的“骑兵”。
- source_word: וְרֶכֶב
  choice: 战车
  rationale: 该词可指战车或战车部队；此处采用具体且通俗的“战车”。
- source_word: וְחַיִל כָּבֵד
  choice: 和一支庞大的军队
  rationale: חַיִל在此指军事力量，כָּבֵד字面为“沉重的”，在这一搭配中形容兵力规模可观；“庞大的军队”自然传达其惯用含义。
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: 他们在夜间来到
  rationale: 忠实表达部队于夜间抵达，不额外断定其行动方式或动机。
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: 包围了那城
  rationale: 该动词表示环绕、围住；军事语境中“包围”最清楚自然。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通俗的叙事语体。“战马、战车”保留原文具体的军事意象；“在夜间来到”避免把夜间行动过度解释为偷袭。脚注标记紧随其所说明的“庞大的军队”。
