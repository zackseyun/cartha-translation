  text: וַ/יֹּ֥אמֶר אִישׁ הָ/אֱלֹהִ֖ים אָ֣נָה נָפָ֑ל וַ/יַּרְאֵ֨/הוּ֙ אֶת הַ/מָּק֔וֹם וַ/יִּקְצָב עֵץ֙ וַ/יַּשְׁלֶךְ שָׁ֔מָּ/ה וַ/יָּ֖צֶף הַ/בַּרְזֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: zh_hans
  text: 神人问：“掉在哪里了？”那人就把地方指给他看。神人砍下一根木棍，扔在那里，那铁就浮了起来。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文为“那铁”；按上文，指掉进水里的铁斧头。
    reason: 说明原文字面表达及其上下文所指。
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来语对先知或属神之人的固定称谓；“神人”在中文圣经语体中简洁、惯用，也比直接释作“先知”更贴近原文。
- source_word: אָנָה נָפָל
  choice: 掉在哪里了？
  rationale: אָנָה询问地点，נָפָל指刚刚发生的坠落；此译符合现代汉语问法，并保留完成事件的语感。
- source_word: וַיַּרְאֵהוּ אֶת־הַמָּקוֹם
  choice: 那人就把地方指给他看
  rationale: ראה的使役式表示“使看见、指给……看”。补出“那人”可避免连续代词在中文里造成指代不清。
- source_word: וַיִּקְצָב עֵץ
  choice: 神人砍下一根木棍
  rationale: קצב在此表示砍下或截取，עֵץ可指树木、木材或木棍；结合随后将其扔入水中的动作，“砍下一根木棍”具体而不作过度解释。
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: 扔在那里
  rationale: 直译动作和方位副词，不额外补入原文未明说的“水里”。
- source_word: וַיָּצֶף
  choice: 浮了上来
  rationale: 该动词表示漂浮或浮上来；现代汉语中“浮了上来”自然地表达铁器从水下出现，同时不解释其机制。
- source_word: הַבַּרְזֶל
  choice: 铁器
  rationale: 原文直称“铁”，上下文指前一节掉落的铁斧头。“铁器”既保留简略指称，又比中文单说“铁”更自然；脚注说明具体所指。
theological_decisions:
- issue: 叙事中的神迹行动
  choice: 直陈“铁器就浮了上来”
  alternative: 将其解释性地译为“铁斧头被弄得浮出水面”或作自然化说明
  rationale: 原文平实叙述超常事件，并未交代具体机制。译文应照实保留神迹性质，不将其自然化，也不增添因果解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。以“神人”保留传统且准确的称谓；通过补出“那人”“神人”消除中文代词歧义。叙事句式简明连续，不添加原文没有的地点或神迹机制。
