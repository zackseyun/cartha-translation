base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: zh_hans
  text: 他说：“不可击杀他们。难道你会击杀那些你用刀和弓所掳来的人吗？[a] 要把饼和水摆在他们面前[b]，好让他们吃喝，然后回到他们的主人那里。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 这句话也可译作：“你岂可击杀那些你用刀和弓所掳来的人？”希伯来文是反问语气，用来加强不可杀他们的命令。
    reason: alternative_reading
  - marker: b
    text: “饼和水”也可概括地指基本的饮食供应；希伯来文明确说的是这两样。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: 击杀
  rationale: נכה 可指击打，也可依语境指杀死。本节关乎是否处死被掳的人；“击杀”既保留动词的击打色彩，也清楚传达可能致命的含义，并在禁令与反问中保持同词复现。
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: 那些……掳来的人
  rationale: שבה 是战争语境中的“掳获、俘虏”，译文保留其军事含义，同时采用自然的现代汉语表达。
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: 用你的刀和弓
  rationale: 逐项保留原文的两种兵器，因为反问的论点在于这些人并不是王凭自己的武力掳来的。
- source_word: לֶחֶם וָמַיִם
  choice: 饼和水
  rationale: 原文明确列出“饼”和“水”；虽然“饼”可泛指食物，正文仍保留具体名词，并以脚注提示其可能的概括用法。
- source_word: לִפְנֵיהֶם
  choice: 摆在他们面前
  rationale: 这是为人陈设饮食的自然汉语表达，准确对应原文空间性措辞。
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: 让他们吃喝，然后回到
  rationale: 承接命令，表达预期结果；“然后”自然呈现吃喝之后离去的次序。
- source_word: אֶל אֲדֹנֵיהֶם
  choice: 回到他们的主人那里
  rationale: אָדוֹן 在此指这些亚兰人所服从的上级或君王。“主人”不强行限定其具体身份；汉语本身也不必明示单复数，因而保留原文在所指范围上的一定弹性。
theological_decisions:
- issue: 以利沙反问句的力度与范围
  choice: 译为反问：“难道你会击杀……吗？”
  alternative: 译为陈述句，或译作“你岂可击杀……？”
  rationale: 禁令之后的希伯来语自然构成反问，用以强化不可杀这些俘虏的命令，并点出王并非凭自己的刀弓俘获他们。译文不把这句话扩展为超出本节叙事处境的普遍战争法规。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“不可”保留命令的严肃性；“难道……吗”自然传达反问；“击杀”避免古雅的“杀戮”，同时保留原文 נכה 在两处的重复。脚注标记均置于其所说明的正文之后。
