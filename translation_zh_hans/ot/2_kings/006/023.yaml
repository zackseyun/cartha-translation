  to: 于是，他为他们预备了丰盛的筵席[a]；他们吃喝完毕。随后，他遣他们回去；他们就到他们的主人[b]那里。此后，亚兰的袭击队不再进入以色列地。
  rationale: 修订避免“自己的主人”所带来的分配性歧义，并以“到……那里”贴近原文的方向表达；“遣他们回去”保留遣送、释放的语境含义而不失庄重叙事语体；“吃喝完毕”使现代汉语更顺畅。脚注保留原文对主人称谓的含混性，同时仅以“很可能”说明其语境所指。
