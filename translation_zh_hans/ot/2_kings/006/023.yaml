base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: zh_hans
  text: 于是，他为他们预备了丰盛的筵席[a]；他们吃喝完毕。随后，他遣他们回去；他们就到他们的主人[b]那里。此后，亚兰的袭击队不再进入以色列地。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“盛大的宴席”。原文以同根的动词和名词构成惯用表达，指预备一顿丰盛的饭食。
    reason: lexical_alternative
  - marker: b
    text: 也可译作“他们的主”。这里很可能指亚兰王。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֶה לָהֶם כֵּרָה גְדוֹלָה
  choice: 他为他们预备了丰盛的筵席
  rationale: 动词 כרה 与同根名词 כֵּרָה 构成预备宴席的希伯来语表达；“丰盛的筵席”自然传达 גְדוֹלָה 所强调的规模。
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: 他们吃了喝了
  rationale: 简洁保留两个并列动作，符合现代汉语叙事习惯。
- source_word: וַיְשַׁלְּחֵם
  choice: 他放他们回去
  rationale: 上下文表明这些被俘者获释离开；此译法兼顾“遣走”和“释放”的语境含义。
- source_word: אֶל אֲדֹנֵיהֶם
  choice: 回到自己的主人那里
  rationale: אֲדֹנֵי 虽带复数形态，但在此很可能是表示尊位的单数用法，指亚兰王；正文保留“主人”，避免把解释直接写入经文。
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: 从此……不再
  rationale: 自然表达 יסף 与 עוד 所构成的停止重复之意。
- source_word: גְּדוּדֵי אֲרָם
  choice: 亚兰的袭击队
  rationale: גְּדוּדֵי 指进行袭扰的队伍，并非正式全军；“亚兰”直接对应原文地名 אֲרָם。
- source_word: לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל
  choice: 进入以色列地
  rationale: בוא 配合介词 ב 在此表示进入某一地域，译文保留其方向性和领土表述。
theological_decisions:
- issue: אֲדֹנֵיהֶם 的所指
  choice: 正文译“自己的主人”，脚注说明可能指亚兰王
  alternative: 直接译“他们的王”
  rationale: 原文使用“主人／主上”而非“王”；保留原词可避免将高度可能的语境判断当作明说内容。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“筵席”保留经文语体的庄重感；“袭击队”则清楚区别于正规军队。脚注标记均置于相应正文词语之后。
