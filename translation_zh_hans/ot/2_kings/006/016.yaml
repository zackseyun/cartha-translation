  text: וַ/יֹּ֖אמֶר אַל תִּירָ֑א כִּ֤י רַבִּים֙ אֲשֶׁ֣ר אִתָּ֔/נוּ מֵ/אֲשֶׁ֖ר אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/016.yaml
  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: zh_hans
  text: 他说：“不要害怕，因为与我们同在的，比与他们同在的更多。”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 他说
  rationale: 该连续式叙事动词推进情节；现代汉语中省略句首“于是／并且”更自然，而“他说”完整保留动作和叙事功能。
- source_word: אַל תִּירָא
  choice: 不要害怕
  rationale: אַל加未完成式在此表达禁止；“不要害怕”是自然、简明且准确的现代汉语。
- source_word: כִּי
  choice: 因为
  rationale: 此处引出不要害怕的理由；“因为”清楚表达因果关系。
- source_word: רַבִּים
  choice: 更多
  rationale: רַבִּים与后面的比较结构מֵאֲשֶׁר连用，表达数量上的“更多”，而不只是“许多”。
- source_word: אֲשֶׁר אִתָּנוּ
  choice: 与我们同在的
  rationale: 关系词与介词短语共同名词化，指“那些与我们同在的”；汉语可自然省略“那些”。
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: 比与他们同在的
  rationale: מִן引出比较对象；末尾虽为省略结构，但上下句平行，补出“同在”可准确而自然地呈现其含义。
theological_decisions:
- issue: “与我们同在的”较大一方的身份
  choice: 正文依照希伯来文保持含蓄，不明确说是天使或天军。
  alternative: 根据下文明确理解并译作天上的军队。
  rationale: 本节本身没有点明其身份，虽然后文揭示了相关背景；译文不把上下文解释提前写入正文，以保留原文的克制。
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“与……同在”保留原文的关系表达及其语境张力；句式略带经文庄重感，但不生硬。
