  naturalness: 整体通顺，庄重而现代。“看哪”与“我主啊”适合较正式的经文叙事语体。“走到外面”不如“出去”简洁自然；“城被……围住”更符合此处所见的状态。
  terminology: “神人”是对אִישׁ הָאֱלֹהִים的恰当固定译法；“侍从”与后文“仆人”可反映两个不同希伯来词并保持人物关系。“我主啊”在此作为对主人的敬称合适，不应理解为神圣称号。
