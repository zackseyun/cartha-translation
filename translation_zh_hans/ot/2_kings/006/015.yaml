base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: zh_hans
  text: 神人的侍从清早起来，出去一看，看哪，有军队带着战马和战车，正围住这城。他的仆人对他说：“哎呀，我主啊！我们怎么办呢？”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: 清早起来
  rationale: 该词的使役词干在此表示早起或一早开始行动；“清早起来”自然地保留了时间含义。
- source_word: מְשָׁרֵת
  choice: 侍从
  rationale: 指在个人身边服侍的人；“侍从”既体现服务身份，也适合先知叙事的语境。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来圣经中对先知的固定称谓；采用简洁、传统且具有互文辨识度的“神人”。
- source_word: לָקוּם
  choice: 起来
  rationale: 与前面的“清早”动词结合，构成“清早起来”，符合汉语叙事习惯。
- source_word: וַיֵּצֵא
  choice: 走到外面
  rationale: 表示从里面出去；“走到外面”清楚呈现侍从出门后看见城被围困的场景。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留原文提示突然发现、令人惊讶之景象的话语标记及叙事生动性。
- source_word: חַיִל
  choice: 军队
  rationale: 在战马、战车和围城的军事语境中，指武装部队。
- source_word: סוֹבֵב
  choice: 包围了
  rationale: 分词描绘侍从看见时城已处于包围之中；汉语用“包围了城”自然呈现当时的持续状态。
- source_word: וְסוּס וָרָכֶב
  choice: 带着战马和战车
  rationale: 将该短语理解为说明军队的军事配备；“战马”比单说“马”更明确贴合军事语境。
- source_word: נַעֲרוֹ
  choice: 他的仆人
  rationale: נַעַר可指年轻人、仆人或侍从；此处前文已用מְשָׁרֵת确认其服侍身份，译作“仆人”自然，也不额外断定年龄。
- source_word: אֲהָהּ
  choice: 哎呀
  rationale: 表达惊恐和苦恼；现代汉语“哎呀”自然传达突发危机中的惊呼，同时不显轻佻。
- source_word: אֲדֹנִי
  choice: 我主啊
  rationale: 这是仆人对主人或上级的尊称，并非对神的称呼；“我主”保留身份关系和庄重语气。
- source_word: אֵיכָה נַעֲשֶׂה
  choice: 我们怎么办呢
  rationale: 原文形式直译近于“我们将怎样做”；汉语惯用问法“我们怎么办呢”准确表达惊慌中的询问。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事汉语。“神人”保留固定先知称谓；首处称“侍从”、后处称“仆人”，反映原文使用的两个不同词，同时明确二者是同一人物。未根据נַעַר补入“年轻”，以免把可能但不确定的年龄含义写入正文。
