base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: zh_hans
  text: 他说：“今天若沙法的儿子以利沙的头还在他身上[a]，愿上帝这样待我，并且加倍！”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“今天若沙法的儿子以利沙的头仍站立在他身上。”意思是：若以利沙的头当天仍留在他的身体上。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: 愿上帝这样惩罚我，并且惩罚得更重
  rationale: 这是希伯来语固定的自我咒诅式誓言。译文保留“这样……并且更重”的递进结构，并用“惩罚”明确其咒诅语力，使现代汉语读者能够自然理解。
- source_word: אֱלֹהִים
  choice: 上帝
  rationale: 该词形态上是复数形式，但在此誓言套语中指独一的上帝，语境中的意义为单数。
- source_word: אִם
  choice: 如果
  rationale: 在誓言中，此词可引出省略结论的否定性誓言，实际语力是断言所说之事绝不会发生；译作“如果”既保留希伯来语的条件结构，也让前面的自我咒诅表达其威胁。
- source_word: יַעֲמֹד
  choice: 还留在
  rationale: 该动词字面义为“站立”，但以“头”为主语时，语境所指是头继续留在身体上；“还留在”准确传达斩首威胁，同时保留原文鲜明的身体意象。
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: 沙法的儿子以利沙的头
  rationale: 按希伯来语修饰关系译出以利沙的父名，并保留“头”作为句子主语所形成的突兀、强烈效果。
- source_word: עָלָיו
  choice: 在他身上
  rationale: 代词最自然地回指以利沙。此译法保留原文简练而形象的说法，没有直接在正文中增补“身体”。
- source_word: הַיּוֹם
  choice: 今天
  rationale: 自然、明确地表达誓言的即时性和期限。
theological_decisions:
- issue: 誓言套语的所指与语力
  choice: 说话者以自己为咒诅对象，求上帝在他未能于当天处死以利沙时重重惩罚自己。
  alternative: 把这句话理解为一般的愤怒感叹，而非正式誓言。
  rationale: “愿上帝这样待我，并且加倍”是希伯来圣经中常见的自我咒诅式誓言，不宜弱化为普通的情绪表达。
- issue: אִם在誓言中的条件与否定含义
  choice: 正文保留“如果”的条件形式，让誓言整体传达“若不斩首便受罚”的决绝语力。
  alternative: 直接意译为“今天我非砍下……不可”或“……绝不能留到今天”。
  rationale: 直接改成断言虽能说明隐含意义，却会消除原文以自我咒诅和条件从句表达威胁的修辞张力。
translation_notes:
  register: 采用现代、庄重而易懂的标准普通话。句序调整为汉语更自然的“如果……愿……”结构；“惩罚得更重”保留誓言的递进力度。脚注说明“站立”这一字面表达及其斩首语境，正文则避免生硬直译。
