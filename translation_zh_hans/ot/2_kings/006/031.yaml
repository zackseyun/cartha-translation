- from: 他说：“如果今天沙法的儿子以利沙的头还留在他身上[a]，愿上帝这样惩罚我，并且惩罚得更重！”
  to: 他说：“今天若沙法的儿子以利沙的头还在他身上[a]，愿上帝这样待我，并且加倍！”
  rationale: 修订仅校正脚注对“在他身上”的字面表达，并以较贴近希伯来文固定誓言公式的“这样待我，并且加倍”取代较明确的“惩罚”。正文仍保留条件从句和自我咒诅式誓言的张力，也不把隐含的处决威胁改写为直接断言。
