revisions:
- from: 以色列王就派人到神人所告诉他并警告他要提防的地方[a]，在那里严加防备[b]。这样的事不止一两次。
  to: 以色列王就派人到神人曾告诉他、又警告过他的那个地方去；王在那里谨慎防备。这样的事不止一两次。
  rationale: 修订保留“派人”这一为符合汉语而作的最小补足，并保留其脚注。将长关系定语调整为“曾告诉他、又警告过他的那个地方”，避免为“警告”增添未明示的内容；在第二分句明确“王”，使其与原文单数动词及上下文的主语一致。
  reviewer_model: gpt-5.6-terra
