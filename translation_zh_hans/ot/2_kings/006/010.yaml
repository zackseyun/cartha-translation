base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: zh_hans
  text: 以色列王就派人到神人曾告诉他、又警告过他的那个地方去；王在那里谨慎防备。这样的事不止一两次。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 派人到
  rationale: 原文直译为“派出／差遣”，受事者没有明说。结合“到……地方”的结构，现代汉语需补出隐含的“人”，但不进一步限定为探子或士兵。
- source_word: הַמָּקוֹם
  choice: 地方
  rationale: 直接保留该词的一般空间含义，并由关系从句限定为神人所指出的特定地点。
- source_word: אִישׁ הָאֱלֹהִים
  choice: 神人
  rationale: 这是希伯来文对属上帝之人的固定称谓；“神人”简洁保留原文称号，不直接解释为“先知”。
- source_word: וְהִזְהִירֹה
  choice: 警告他要提防
  rationale: 使役形在此表示警戒、提醒；补出“要提防”使它与所说的危险地点自然衔接，同时保留警告对象为王的理解。
- source_word: וְנִשְׁמַר
  choice: 严加防备
  rationale: 该词在此有谨慎自守、采取防范措施之意。“严加防备”符合军事叙事语境，也避免生硬直译为“保守自己”。
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: 不止一两次
  rationale: 保留希伯来习语的形式和反复发生的含义，表明这类预警及防范多次出现。
theological_decisions: []
