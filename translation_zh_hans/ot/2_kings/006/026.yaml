base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/026.yaml
  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: zh_hans
  text: 以色列王正在城墙上经过时，一个妇人向他呼喊说：“我主我王啊，救救我！”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“我主我王啊，帮帮我！”希伯来语的祈使词直译为“救”，在这里用作迫切求助。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: 正……经过时
  rationale: וַיְהִי配合分词עֹבֵר构成叙事背景，表示当时正在进行的动作；译作“正……经过时”自然地保留时间框架和进行意味。
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: 以色列王
  rationale: 这是标准的属格结构；现代汉语用“以色列王”简洁、庄重，也符合上下文中的特指。
- source_word: עַל הַחֹמָה
  choice: 从城墙上
  rationale: עַל基本义为“在……上”；与“经过”连用时，“从城墙上经过”既表明王位于城墙之上，也符合自然汉语，且不额外限定其沿墙行走的方向。
- source_word: וְאִשָּׁה
  choice: 有一个妇人
  rationale: 该人物在此首次出现，为不定指；“有一个妇人”符合汉语叙事习惯。“妇人”比“女人”略显庄重，适合经文语体。
- source_word: צָעֲקָה אֵלָיו
  choice: 向他呼喊
  rationale: צעק表示因危急或求助而大声呼叫；“呼喊”保留声音强度和迫切感，אֵלָיו译为“向他”。
- source_word: לֵאמֹר
  choice: 说
  rationale: 标准引语标记；汉语以“说”引出直接引语最自然，无须机械译成分词形式。
- source_word: הוֹשִׁיעָה
  choice: 救救我
  rationale: 这是ישׁע的祈使式，基本义为“拯救、搭救”。原文未明说宾语，但语境显然是妇人求王施救；“救救我”保留“救”的词义及急切语气。
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: 我主我王啊
  rationale: 保留אֲדֹנִי“我主”和הַמֶּלֶךְ“王”并列的尊称性质；加语气词“啊”明确呼格并传达恳求语气。
