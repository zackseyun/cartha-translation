revisions:
- from: 撒马利亚发生了严重的饥荒。看哪，敌军正围困这城，以致一个驴头卖到八十块银子，四分之一卡布的鸽子粪[a]卖到五块银子。
  to: 撒马利亚发生了严重的饥荒。看哪，这城正遭围困，以致一个驴头要八十块银子，四分之一卡布的鸽子粪[a]要五块银子。
  rationale: 修订仅删除原文未明说的‘敌军’，并调整价格表达及脚注替代译法，使之更自然、准确且不扩大原文信息；其余内容维持原有的忠实译法。
