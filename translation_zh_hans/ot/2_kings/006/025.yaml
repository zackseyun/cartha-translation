    text: 或译“鸽粪”。有人认为这里确指鸽子的粪便；也有人认为这是饥荒期间出售的某种廉价食物或植物产品的名称。
    reason: 原文短语 חרי יונים 的字面意义是“鸽子粪”，但具体所指存在词义争议。
  revision_rationale: 修订仅删除原文未明说的‘敌军’，并调整价格表达及脚注替代译法，使之更自然、准确且不扩大原文信息；其余内容维持原有的忠实译法。
