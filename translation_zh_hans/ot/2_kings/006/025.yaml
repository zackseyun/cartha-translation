  text: וַ/יְהִ֨י רָעָ֤ב גָּדוֹל֙ בְּ/שֹׁ֣מְר֔וֹן וְ/הִנֵּ֖ה צָרִ֣ים עָלֶ֑י/הָ עַ֣ד הֱי֤וֹת רֹאשׁ חֲמוֹר֙ בִּ/שְׁמֹנִ֣ים כֶּ֔סֶף וְ/רֹ֛בַע הַ/קַּ֥ב חרי יונים בַּ/חֲמִשָּׁה כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: zh_hans
  text: 撒马利亚发生了严重的饥荒。看哪，这城正遭围困，以致一个驴头要八十块银子，四分之一卡布的鸽子粪[a]要五块银子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“鸽粪”。有人认为这里确指鸽子的粪便；也有人认为这是饥荒期间出售的某种廉价食物或植物产品的名称。
    reason: 原文短语 חרי יונים 的字面意义是“鸽子粪”，但具体所指存在词义争议。
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  choice: 发生了严重的饥荒
  rationale: 用现代汉语自然表达叙事背景；“严重”传达 גָּדוֹל 在“饥荒”语境中的强烈程度。
- source_word: בְּשֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 此处指撒马利亚城；汉语中与“发生”连用时不必另加“在……中”。
- source_word: וְהִנֵּה
  choice: 看哪
  rationale: 保留希伯来语引人注意、凸显惊人情势的语篇标记。
- source_word: צָרִים עָלֶיהָ
  choice: 敌军正围困这城
  rationale: 分词表示持续进行的围城行动；“正”体现延续性，“这城”明确阴性代词所指的撒马利亚。
- source_word: עַד הֱיוֹת
  choice: 以致……卖到
  rationale: 该结构在这里表达围困造成的极端结果；“卖到”符合汉语报价语境。
- source_word: רֹאשׁ חֲמוֹר
  choice: 一个驴头
  rationale: 直接保留饥荒中令人震惊的食物形象。
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: 八十块银子
  rationale: 原文只说“八十银子”，没有明说货币或重量单位；“块银子”既通俗可懂，也避免擅自补出“舍客勒”。
- source_word: רֹבַע הַקַּב
  choice: 四分之一卡布
  rationale: 准确保留比例及古代干量单位，不以不确定的现代容量换算替代。
- source_word: חרי יונים
  choice: 鸽子粪
  rationale: 按该短语最直接的字面意义翻译；它也可能是某种廉价食物或植物产品的名称，因此加注说明。
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: 卖到五块银子
  rationale: 与前一价格短语保持平衡，也不擅自补出原文未明说的具体单位。
theological_decisions: []
