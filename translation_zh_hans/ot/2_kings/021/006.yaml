base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: zh_hans
  text: 他使自己的儿子经火[a]，又观兆、占卜，并与交鬼的和通灵的打交道[b]。他多行耶和华眼中看为恶的事，惹他发怒。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译“使自己的儿子经火”；这句话很可能是指把儿子在火中献为祭。
    reason: alternative_reading
  - marker: b
    text: 这里所译的希伯来语表达较难确定，也可理解为“求问”或“使用”交鬼的和通灵的人。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: 使自己的儿子经火
  rationale: 保留希伯来语“使……经过火”的祭仪性表达，不在正文中把具体行为直接解释为焚烧或献祭；“经火”在中文中简洁而庄重。
- source_word: וְעוֹנֵן
  choice: 观兆
  rationale: 此词指借征兆预测吉凶；“观兆”既与后面的广义“占卜”有所区分，也符合现代中文宗教语境。
- source_word: וְנִחֵשׁ
  choice: 占卜
  rationale: נחשׁ通常指藉征兆等方式进行占卜；采用通行中文词语，同时保留其与前一术语可能重叠但并不完全相同的关系。
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: 招用交鬼的和通灵的
  rationale: עשה与这两类人的搭配较难直译。“招用”自然表达君王使这些术士为己所用，但不把动作限定为单纯咨询；“交鬼的和通灵的”分别表达 אוֹב 与 יִדְּעֹנִים。
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: 一再行
  rationale: 该结构表达行为的增多或加剧。“一再行”比生硬的“多多地行”自然，并保留反复、加重作恶的意味。
- source_word: הָרַע
  choice: 恶的事
  rationale: 把名词化形容词自然译为“恶的事”，保留明确的道德判断。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象，并按项目政策将神名译为“耶和华”。
- source_word: לְהַכְעִיס
  choice: 惹他发怒
  rationale: 自然表达使役含义；“他”明确回指耶和华，同时保留目的或结果之间的语义开放性。
theological_decisions:
- issue: 使儿子经火这一习语的明确程度
  choice: 正文保留“使自己的儿子经火”
  alternative: 把自己的儿子在火中献为祭／焚烧自己的儿子
  rationale: 上下文强烈涉及献儿女的祭仪，但希伯来语本身采用“使……经过火”的习语。正文保留其形式，脚注说明可能的明确含义，以免超出原文措辞。
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威／上主
  rationale: 采用普通简体中文读者最熟悉且能明确表示专名的传统音译，同时不以称号取代原文神名。
- issue: עשה אוב וידענים 所指参与方式
  choice: 译为“招用”，但不限定为单纯求问
  alternative: 求问交鬼的和通灵的／设立交鬼的和通灵的
  rationale: 原语搭配含义不寻常，可能泛指制作、设置、使用或求助于这些灵媒。正文采用较宽的“招用”，脚注保留其不确定性。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“经火”有意保留原文祭仪习语；“观兆、占卜”并列以呈现两个相关但有区别的术语；“交鬼的和通灵的”沿用读者可辨识的宗教用语，同时用脚注说明动词搭配的不确定性。所有脚注标记均置于相关正文之后。
