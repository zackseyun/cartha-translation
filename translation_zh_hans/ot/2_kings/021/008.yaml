  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: zh_hans
  text: 我必不再使以色列人的脚迁离我赐给他们列祖的土地[a]；只要他们谨慎遵行我所吩咐他们的一切，以及我仆人摩西吩咐他们的全部律法[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“使以色列人的脚漂流。”也可译作“使以色列人迁离”或“把以色列人从这土地上移走”。这里的形象表示被迫离开这片土地。
    reason: lexical_alternative
  - marker: b
    text: “律法”也可译作“训诲”；这里指借摩西吩咐以色列人的妥拉。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: 不再
  rationale: לֹא与יסף连用表示不再重复某行动；现代汉语用“不再”自然准确。
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: 使以色列人的脚……漂流
  rationale: 保留希伯来文单数“脚”的具体意象，同时借“离开……而漂流”表明这是被迫迁离土地，而非普通走动。
- source_word: הָאֲדָמָה
  choice: 土地
  rationale: 上下文指赐给列祖、供以色列居住的地域，“土地”兼顾领土与地土含义。
- source_word: נָתַתִּי לַאֲבוֹתָם
  choice: 我赐给他们列祖的
  rationale: “列祖”是现代中文圣经语域中清楚而庄重的盟约性表达，指以色列的先祖。
- source_word: רַק אִם
  choice: 只要
  rationale: 表达限制性的真实条件；在这一肯定式应许句中，“只要”比生硬的“唯独若”更自然。
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: 谨慎遵行
  rationale: 同时传达שמר的留心谨守和עשה的实行之意。
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִים
  choice: 遵行我所吩咐他们的一切
  rationale: 中文以“遵行”自然表达כ的依照、符合之义，并保留命令范围的全面性。
- source_word: וּלְכָל הַתּוֹרָה
  choice: 以及……全部律法
  rationale: 在摩西之约语境中，תורה指借摩西颁布的律法；“全部”对应כָּל。
- source_word: עַבְדִּי מֹשֶׁה
  choice: 我仆人摩西
  rationale: 直接保留该尊称，语序符合庄重的现代汉语。
theological_decisions:
- issue: 以色列继续安居应许之地的条件性
  choice: 用“只要他们谨慎遵行”明确呈现真实条件
  alternative: 将条件弱化为劝勉，或处理成纯粹修辞
  rationale: רַק אִם明确引出限制条件。译文保留顺服与安居之间的盟约性张力，不以其他应许传统消解本节措辞。
translation_notes:
  register: 采用现代、庄重且易懂的标准普通话。“列祖”“律法”保留经文的盟约语域；正文保留“脚……漂流”的希伯来意象，并以脚注说明其迁离含义。
