  to: 我必不再使以色列人的脚迁离我赐给他们列祖的土地[a]；只要他们谨慎遵行我所吩咐他们的一切，以及我仆人摩西吩咐他们的全部律法[b]。
  rationale: 修订仅处理中文搭配和脚注中略超出本节明示内容的解释。“迁离”对应此处使以色列离开所赐之地的位移含义；保留“以色列人的脚”以反映希伯来文单数、集体性的身体意象。条件句、列祖、律法和“我仆人摩西”等关键表达均不改变。
