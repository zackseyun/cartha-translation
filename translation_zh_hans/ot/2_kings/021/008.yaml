  naturalness: 原文庄重自然，但“使以色列人的脚离开……而漂流”略显生硬，且“脚漂流”在现代汉语中容易联想到水上漂浮。修订后保留“脚”这一源语意象，同时以“迁离”使句法和语义更清楚。
  terminology: “列祖”“律法”“我仆人摩西”“谨慎遵行”均合乎现代中文圣经语域，也准确对应原文。脚注中“应许之地”虽与更广泛圣经语境相符，却非本节明说；为避免添加解释性术语，改作“这片土地”。
