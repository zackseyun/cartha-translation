  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: zh_hans
  text: 亚们的臣仆密谋反对他，在他自己的家中杀死了王。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“策划反叛。”
    reason: 原文“密谋”一词在政治语境中可指策划反叛；正文则明确保留其针对亚们的敌对方向。
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: 密谋反叛
  rationale: קשר在宫廷政治语境中指结党或策划反叛；“密谋反叛”既表达秘密策划，也明确其敌对方向。
- source_word: עַבְדֵי אָמוֹן
  choice: 亚们的臣仆
  rationale: עבדים在王室叙事中可指君王身边的仆役或臣属；“臣仆”既保留从属关系，也符合宫廷语境，而不武断限定为正式官员。
- source_word: עָלָיו
  choice: 他
  rationale: 与“密谋反叛”连用时，על表示敌对行动所针对的对象；中文直接说“反叛他”自然清楚，所指为亚们。
- source_word: וַיָּמִיתוּ
  choice: 杀死了
  rationale: מות的使役式表示使其死亡；“杀死了”准确表达致死行为，也避免“处死”可能带入合法审判或正式刑罚的含义。
- source_word: אֶת־הַמֶּלֶךְ
  choice: 王
  rationale: 原文使用称号“王”而非重复亚们的名字，因此保留这一叙事称谓。
- source_word: בְּבֵיתוֹ
  choice: 在他自己的宫中
  rationale: בַּיִת带第三人称单数后缀，直义为“他的房屋”；在君王遇刺的宫廷语境中，“宫中”自然表达其王室居所，“自己的”凸显原文所属关系而不改变所指。
