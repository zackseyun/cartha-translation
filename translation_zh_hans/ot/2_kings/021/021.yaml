base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/021.yaml
  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: zh_hans
  text: 他凡事都照着他父亲所走的道路而行，侍奉他父亲所侍奉的偶像[a]，并向它们下拜。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来词带有蔑视意味；也可译作“粪偶像”或“可憎的偶像”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ אָבִיו
  choice: 他完全走他父亲所走的道路
  rationale: 保留“走……道路”的行为隐喻；בְּכָל 表示他在父亲所行的整条道路上亦步亦趋，译作“完全”较符合现代汉语表达。
- source_word: וַיַּעֲבֹד
  choice: 侍奉
  rationale: עבד 的基本义是“服侍、侍奉”；此处指宗教性服事，同时与下句表示俯伏敬拜的动词保持区别。
- source_word: הַגִּלֻּלִים
  choice: 偶像[a]
  rationale: 该词指偶像，并带有强烈蔑称色彩。正文采用清楚自然的“偶像”，其贬斥意味由脚注说明。
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: 并向它们下拜
  rationale: 保留俯身下拜的具体动作及复数代词，不将其笼统译为“敬拜”，以免与前面的“侍奉”合并。
theological_decisions:
- issue: 贬称 גִּלֻּלִים 的译法
  choice: 偶像
  alternative: 粪偶像；可憎的偶像
  rationale: “偶像”准确、自然地表达所指对象；原文刻意贬斥这些偶像的语气则在脚注中保留，避免正文使用生硬且可能喧宾夺主的直译。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“走……道路”保留圣经中以道路喻生活行为的表达；“侍奉”与“下拜”分别对应原文两个不同动作。
