  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֥ה אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: zh_hans
  text: 他行了雅威眼中看为恶的事[a]，正如他父亲玛拿西所行的。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来文直译：“行了雅威眼中的恶。”
    reason: 说明原文惯用语的字面形式，并展示正文为符合现代汉语而补出“看为……的事”。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 他行了
  rationale: 该叙事形式推动情节发展；汉语无需另译句首连接词，过去时态由上下文及“了”自然表达。
- source_word: הָרַע
  choice: 看为恶的事
  rationale: עשה הרע是“行恶”的惯用表达；结合后面的“在……眼中”，译为“眼中看为恶的事”既自然，又保留评价含义。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中
  rationale: 保留希伯来语“在……眼中”的评价性比喻，表示按雅威的判断；现代汉语表达清楚自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名作音译，以专名而非称号呈现。
- source_word: כַּאֲשֶׁר
  choice: 正如
  rationale: 准确表达亚们与其父行为之间明确的比较关系。
- source_word: עָשָׂה
  choice: 所行的
  rationale: 汉语用“所行的”自然指向玛拿西先前的行为，无需额外标明过去完成时。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用该人物在现代中文圣经传统中通行的译名。
- source_word: אָבִיו
  choice: 他父亲
  rationale: 直接表达名词及第三人称阳性单数所属后缀。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语音译保留其专名性质，不用称号替代。
- issue: “恶”的评价主体
  choice: 雅威眼中看为恶
  alternative: 他行了恶事
  rationale: 保留原文“在雅威眼中”的限定，明确道德判断来自雅威的评价，而不是省略这一神学重点。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行了……的事”保留历史叙事和经文语体；“正如”清楚连接父子二人的行为。
