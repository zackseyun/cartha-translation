base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 亚们其余所行的事[a]，不都记在《犹大列王纪》[b]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “所行的事”也可译作“事迹”。希伯来语דִּבְרֵי字面可指“话”或“事情”，在这里的君王生平总结套语中，指君王所做的事。
    reason: lexical_alternative
  - marker: b
    text: 这里的“纪”指古代的书面记录，载体很可能是卷轴；《犹大列王纪》也可译作《犹大列王大事记》。
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  choice: 其余
  rationale: יֶתֶר意为“剩余、其余”；前缀וְ在此承接上下文，现代汉语无需另加“现在”等时间副词。
- source_word: דִּבְרֵי ... אֲשֶׁר עָשָׂה
  choice: 所行的事
  rationale: דִּבְרֵי本义可指“话、事情”，在君王生平总结套语中，结合“他所做的”，指君王的行事或事迹；“所行的事”既自然，也保留原文所指。
- source_word: אָמ֖וֹן
  choice: 亚们
  rationale: 按现代中文圣经人名的通行音译处理。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗
  rationale: הֲלֹא引出预期肯定回答的反问；保留反问形式。“记”在中文中自然表达“写下、载录”，而“都”体现复数主语及肯定预期。
- source_word: עַל סֵפֶר
  choice: 记在《……》上
  rationale: עַל字面为“在……之上”，中文谈及书面记载时惯用“记在……上”；סֵפֶר在此指书面文献，实际载体很可能是卷轴。
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王纪》
  rationale: 该短语是所引王室史料的名称，意为关于犹大诸王的年代记或大事记；“犹大列王纪”简洁、庄重，并符合中文书名表达。
