base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: zh_hans
  text: 玛拿西登基时十二岁；他在耶路撒冷作王五十五年。他母亲名叫希弗细巴[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “希弗细巴”这个名字大意是“我的喜悦在她身上”。
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: 十二岁
  rationale: 这是希伯来语表达年龄的惯用语；现代汉语自然表达为“十二岁”。
- source_word: בְמָלְכוֹ
  choice: 登基时
  rationale: 介词 בְּ 与该形式共同标明开始作王的时间；“登基时”简洁、自然，并符合列王纪的君王纪年语境。
- source_word: מְנַשֶּׁה
  choice: 玛拿西
  rationale: 采用现代简体中文圣经语境中通行的人名音译。
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: 五十五年
  rationale: 按现代汉语数词习惯合并表达，准确保留原文数值。
- source_word: מָלַךְ
  choice: 作王
  rationale: 在君王纪年公式中，מלך 指执掌王权；“作王”准确且为普通读者熟悉。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 在此表示地点，译为“在”；地名采用通行音译。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 自然地传达希伯来语“他母亲的名字是”的记述公式。
- source_word: חֶפְצִי בָהּ
  choice: 协西巴
  rationale: 采用现代简体中文圣经语境中通行的人名音译；其名称含义另以脚注说明。
