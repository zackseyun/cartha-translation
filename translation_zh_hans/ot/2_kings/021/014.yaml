base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: zh_hans
  text: 我要撇弃[a]我产业中所剩下的人[b]，把他们交在仇敌手中；他们必成为所有仇敌的掠物和抢夺之物。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “撇弃”或译“离弃”。
    reason: lexical_alternative
  - marker: b
    text: “产业”也可译作“基业”，指归属于上帝的份。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: 我要撇弃
  rationale: נטשׁ表示离弃、抛下；“撇弃”保留审判与关系断裂的力度，同时用语庄重而易懂。句首连接词按上下文以连贯语气体现，不机械译出“并且”。
- source_word: שְׁאֵרִית נַחֲלָתִי
  choice: 我产业中的余民
  rationale: שְׁאֵרִית译作“余民”，保留经历审判后剩余之人的经文用语；נַחֲלָתִי译作“我的产业”，保留属于上帝之份的盟约性和归属含义。结合后续阳性复数代词，“余民”明确这里所指的是人。
- source_word: וּנְתַתִּים בְּיַד אֹיְבֵיהֶם
  choice: 把他们交在仇敌手中
  rationale: 直译希伯来语“给在……手中”的控制权隐喻；“交在……手中”是自然、清楚的现代汉语经文表达。
- source_word: וְהָיוּ
  choice: 他们必成为
  rationale: היה在此表示被交给仇敌之后产生的结果，因此译作“成为”而非静态的“是”。
- source_word: לְבַז וְלִמְשִׁסָּה
  choice: 掳掠抢夺之物
  rationale: 两个近义词共同描写落入敌手、任人劫掠的处境；“掳掠抢夺之物”保留原文的并列强化，又比生硬重复“掠物和掠物”自然。
- source_word: לְכָל אֹיְבֵיהֶם
  choice: 所有仇敌
  rationale: 保留כָל的周全范围，并使其自然地修饰实施掳掠抢夺的仇敌。
theological_decisions:
- issue: “我的产业”的盟约归属含义
  choice: 译作“我产业中的余民”，不进一步限定为土地、犹大国或某一神学概念
  alternative: 我的基业中剩下的人；我所拥有之民中的余民
  rationale: נחלה可指产业、基业或所得之份；此处复数代词表明所指为人，但原文仍以“产业”表达他们属于上帝。译文保留这种归属语言，不超出原文加以神学窄化。
translation_notes:
  register: 采用现代、庄重而通俗的普通话。“余民”“产业”“交在仇敌手中”保留关键经文意象；末句以“掳掠抢夺之物”传达希伯来语近义并列的修辞力度。
