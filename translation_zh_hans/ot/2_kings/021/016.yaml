id: 2KI.21.16
reference: 2 Kings 21:16
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וְ/גַם֩ דָּ֨ם נָקִ֜י שָׁפַ֤ךְ מְנַשֶּׁה֙ הַרְבֵּ֣ה מְאֹ֔ד עַ֛ד אֲשֶׁר מִלֵּ֥א אֶת יְרוּשָׁלִַ֖ם פֶּ֣ה לָ/פֶ֑ה לְ/בַ֤ד מֵֽ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יְהוּדָ֔ה לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: zh_hans
  text: 此外，玛拿西还流了极多无辜人的血，多到使耶路撒冷全城都充满了血[a]；这还不包括他使犹大犯罪、去行耶和华眼中看为恶之事的罪。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 希伯来语直译为“充满耶路撒冷，从口到口”；这是指遍及全城、从一头到另一头的习语。
    reason: 说明原文习语的字面形式及正文所采用的意义译法。
lexical_decisions:
- source_word: וְגַם
  choice: 此外……还
  rationale: 既承接上文，又突出这是先前罪行之外追加的控罪，符合希伯来语的附加和强调作用。
- source_word: דָּם נָקִי
  choice: 无辜人的血
  rationale: 保留该希伯来语固定表达所含的法律与道德意义，指无罪之人遭杀害。
- source_word: שָׁפַךְ
  choice: 流了
  rationale: 汉语“流人的血”可自然表达杀人流血，也贴近原文“倾倒、流出”的意象。
- source_word: הַרְבֵּה מְאֹד
  choice: 许多
  rationale: 结合“甚至……到处都充满”传达原文双重强化所强调的巨大规模，避免生硬的“非常多”。
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: 甚至使耶路撒冷到处都充满了无辜人的血
  rationale: 原文直译为“从口到口充满耶路撒冷”，是表示遍及全城的习语；正文传达其意义，并以脚注保留字面形态。
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: 这还不包括……这项罪
  rationale: 保留“除此之外”的区分作用及原文单数“罪”，使句中两项控罪的关系清楚。
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: 他使犹大犯罪
  rationale: “使……犯罪”直接保留 חטא 使役形的强度，明确玛拿西的主动责任。
- source_word: לַעֲשׂוֹת הָרַע
  choice: 做……看为恶的事
  rationale: 将不定式理解为犹大所犯之罪的内容或结果，保留原文的道德判断。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留希伯来语“在……眼中”的评价性意象，同时采用自然的现代汉语句式。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代汉语圣经传统中对四字神名最通行、最易识别的专名译法，而不以头衔替代。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 耶和华
  alternative: 雅威
  rationale: 原文使用四字神名。中文正文以广泛通行的专名“耶和华”表达，既不替换为“主”这一头衔，也避免在缺乏项目明确中文神名规范时引入较不普及的形式。
- issue: הֶחֱטִיא 所表达的玛拿西责任强度
  choice: 使犹大犯罪
  alternative: 引诱犹大犯罪
  rationale: 原文是使役形；“使……犯罪”较直接地保留其语法力度，同时不额外说明玛拿西所采用的具体方式。
- issue: לְבַד מֵחַטָּאתוֹ 与流无辜人血的关系
  choice: 将流无辜人血视为另一项追加控罪
  alternative: 把“他的罪”泛指玛拿西全部罪行
  rationale: “除此之外”最自然地把本节的流血罪与使犹大犯罪之罪区分开来；单数仍可概括后者的罪责，不把其具体内容收窄到原文未说明的程度。
translation_notes:
  register: 采用现代、庄重而易懂的书面普通话。“无辜人的血”保留圣经法律—道德语感；拆为两句以清楚呈现追加控罪和“除此之外”的逻辑关系。
