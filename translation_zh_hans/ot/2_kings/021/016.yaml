revisions:
- from: 此外，玛拿西还流了许多无辜人的血，甚至使耶路撒冷到处都充满了无辜人的血[a]。这还不包括他使犹大犯罪、做耶和华眼中看为恶的事这项罪。
  to: 此外，玛拿西还流了极多无辜人的血，多到使耶路撒冷全城都充满了血[a]；这还不包括他使犹大犯罪、去行耶和华眼中看为恶之事的罪。
  rationale: 将程度结果明确译为“多到”，避免正文重复“无辜人的血”，并重组末句以更自然地表达“除他使犹大犯罪、行耶和华眼中恶事的罪以外”。脚注保留“口到口”的字面语序及其遍及全城的意义。
