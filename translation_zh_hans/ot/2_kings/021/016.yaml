    rationale: 此处是“流血极多，以致／多到充满耶路撒冷”的结果关系；“多到”在现代汉语中更直接。
  - severity: medium
    issue: 末句“这还不包括他使犹大犯罪、做耶和华眼中看为恶的事这项罪”结构略显笨重，且“做”的施事可有瞬时歧义。
    rationale: 原文的“他的罪”是对使犹大犯罪、行恶这一罪责的概括。改作“这还不包括他使犹大犯罪、去行……的罪”能保留使役关系、罪的单数概括及不定式所表明的行为内容。
  revised_text: 此外，玛拿西还流了极多无辜人的血，多到使耶路撒冷全城都充满了血[a]；这还不包括他使犹大犯罪、去行耶和华眼中看为恶之事的罪。
