base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: zh_hans
  text: 但当地的民众杀了所有密谋反对亚们王的人；当地的民众又立他的儿子约西亚接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: 杀了
  rationale: נכה在本段报复谋杀者的语境中指致命击杀；“杀了”在现代汉语中直接、自然，也准确表达结果。
- source_word: עַם הָאָרֶץ
  choice: 当地的民众
  rationale: 此固定表达在这里指作为社会政治群体采取行动的本地民众；译作“当地的民众”既保留“地／当地”的成分，又比生硬的“地之民”清楚自然。两处重复采用同一译法。
- source_word: כָּל הַקֹּשְׁרִים
  choice: 所有谋害……的人
  rationale: קשר的分词表示参与密谋者；结合上一节亚们被臣仆杀害的语境，“谋害”自然表达针对君王的敌对阴谋及其致命目的。
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: 亚们王
  rationale: קשר与עַל连用表示针对某人密谋；汉语将对象直接置于“谋害”之后，形成“谋害亚们王的人”。
- source_word: וַיַּמְלִיכוּ
  choice: 立……作王
  rationale: מלך的使役形表示使某人成为王；“立……作王”准确且符合汉语王位承继叙事，不额外加入加冕仪式。
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: 他的儿子约西亚
  rationale: 采用自然的现代汉语定中次序，同时清楚保留约西亚是亚们之子的关系。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该表达表示在某人原有位置上继任；“接替他作王”简洁自然地传达王位承继。
- source_word: וַ
  choice: 但；又
  rationale: 句首的连续式ו在上下文中带出与上一节臣仆弑君相对的反制，故译“但”；第二处用“又”承接当地民众随后拥立新王的行动。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而通顺的叙事语言。“当地的民众”保留该希伯来社会政治称谓的一定开放性，不将其限定为“平民”“地主阶层”或全国全体人民。原文两次重复עַם הָאָרֶץ，译文也重复，以保留强调。
