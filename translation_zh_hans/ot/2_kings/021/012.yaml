  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: zh_hans
  text: 因此，以色列的神耶和华如此说：“看哪，我要使灾祸[a]临到耶路撒冷和犹大，以致凡听见这事的人，无不耳鸣[b]。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“灾难”。这里的希伯来词指审判所带来的灾祸，并非道德意义上的邪恶。
    reason: lexical_alternative
  - marker: b
    text: 希伯来语习语，直译为“他的两只耳朵都必发鸣”，形容人听见消息后深感震惊或恐惧。
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: 因此
  rationale: 保留本句承接上文、引出后果的推论作用。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文读者熟悉的神圣名字译法，将四字神名作为专名呈现，而不以“主”这一称号替代。
- source_word: כֹּה אָמַר
  choice: 如此说
  rationale: 保留先知传信公式的庄重语气，同时符合现代中文表达。
- source_word: הִנְנִי מֵבִיא
  choice: 看哪，我要使……临到
  rationale: “看哪”表达 הִנְנִי 的提示与强调作用；“我要”传达该结构所表现的迫近行动。
- source_word: רָעָה
  choice: 灾祸
  rationale: 这里指审判所带来的灾难，而非道德意义上的邪恶。
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: 临到耶路撒冷和犹大
  rationale: 自然表达灾祸落在这两个地方之上的审判含义。
- source_word: אֲשֶׁר כָּל שֹׁמְעָיו
  choice: 以致凡听见这事的人
  rationale: 将 אֲשֶׁר 理解为引出结果；后缀所指的是将要发生并被传闻的灾祸。
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: 双耳都必嗡嗡作响
  rationale: 既保留“两只耳朵”的原文形象，也用自然中文表达听闻骇人消息后的强烈震撼。
theological_decisions:
- issue: 神使 רָעָה 临到的含义
  choice: 灾祸
  alternative: 邪恶
  rationale: 上下文所说的是神施行审判而带来的灾难，并非说神施行道德上的邪恶；“灾祸”准确保留审判含义。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“如此说”和“看哪”保留先知宣告的正式感；其余措辞力求普通现代读者易懂。
