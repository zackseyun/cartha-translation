base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: zh_hans
  text: 他重新建造他父亲希西家所拆毁的丘坛，又为巴力筑起祭坛，造了亚舍拉[a]，仿效以色列王亚哈所行的；他还跪拜天上的万象，事奉它们。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉”是与古代迦南宗教崇拜有关的名称；此处因“造了”而指一种祭祀物件，但其确切形制（如柱、木桩或像）不能确定。
    reason: 说明该术语在本节所指为可制作的崇拜物件，同时避免将其形制断定为“柱”。
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: 指设于高处或其他地点的祭祀场所；“丘坛”是简洁、庄重且较为通行的圣经用语。
- source_word: מִזְבְּחֹת לַבַּעַל
  choice: 为巴力筑起祭坛
  rationale: 保留复数“祭坛”，并以“为巴力”自然表达希伯来语介词所指的奉献或用途。
- source_word: אֲשֵׁרָה
  choice: 一根亚舍拉柱
  rationale: 此处指与亚舍拉崇拜有关的实体宗教物件；加“柱”使普通读者不至于误以为只是人名，同时不把它泛化为“偶像”。
- source_word: כָּל צְבָא הַשָּׁמַיִם
  choice: 天上的万象
  rationale: 该短语指天体整体；“万象”在现代中文中自然，并保留其集合性。
- source_word: וַיִּשְׁתַּחוּ
  choice: 跪拜
  rationale: 表达俯伏敬拜的动作及宗教含义，比单用“敬拜”更保留原文的身体动作。
- source_word: וַיַּעֲבֹד אֹתָם
  choice: 事奉它们
  rationale: 保留宗教性服事的含义，并使复数代词明确承接“天上的万象”。
theological_decisions:
- issue: “亚舍拉”指女神还是祭祀物件
  choice: 译为“一根亚舍拉柱”
  alternative: 译为“亚舍拉”或“亚舍拉像”
  rationale: 动词“造”及本段语境更倾向于实体崇拜物，但原词仍与亚舍拉神祇密切相关；“亚舍拉柱”既便于理解，也避免断言其必定是雕像。
- issue: “天上的万象”的性质
  choice: 不具体列为日月星辰或天使
  alternative: 译为“天上的星宿”
  rationale: 原文使用涵盖性的集合表达，可能主要指天体；直译为“天上的万象”可保留其广度，不额外限定对象。
translation_notes:
  register: 采用现代、庄重而清楚的叙事语体；以“重新修建”体现 וַיָּשָׁב וַיִּבֶן 的恢复性含义，用“仿效……所行的”避免连续多个“又”造成生硬，同时保持原文各项恶行的递进。
