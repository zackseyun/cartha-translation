base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 玛拿西其余的事迹、他所做的一切，以及他所犯的罪，不都记载在《犹大列王年鉴》[a]里吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译《犹大列王记》。原文指记载犹大诸王事迹的王室档案，并非现存的《历代志》。
    reason: 说明书名的词义范围和文献性质，避免与现存正典书卷混淆。
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: 玛拿西其余的事迹
  rationale: “דִּבְרֵי”在列王纪的王朝总结套语中指君王的事迹或政事，并非仅指言语；“其余的事迹”既符合原文，也符合现代汉语表达。句首的וְ不机械译作“现在”或“又”。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 他所做的一切
  rationale: 直接保留全称范围和关系从句，表达自然清楚。
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: 和他所犯的罪
  rationale: 原文以同根名词和动词构成强调表达，并带第三人称所有格；“他所犯的罪”在自然汉语中保留了归属与行为含义，避免生硬重复为“他犯罪所犯的罪”。
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗
  rationale: 保留原文预期肯定回答的否定反问形式；“记”符合档案语境，也自然传达“写下、记载”。“都”承接前列的多项内容。
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 记在《犹大列王记》上
  rationale: 将该王室文献名称简洁译为《犹大列王记》；“记在……上”保留עַל与书面记录的意象。脚注说明它是王室档案，并提供“年鉴”这一译法，以免误解其文献性质。
