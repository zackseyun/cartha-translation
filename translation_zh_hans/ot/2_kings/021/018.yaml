base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: zh_hans
  text: 玛拿西与他的列祖同睡，葬在他住处的园子里，就是乌撒园。他儿子亚们接替他作王。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: 与他的列祖同睡
  rationale: 这是《列王纪》中君王去世的惯用语。译作“与他的列祖同睡”既保留希伯来语的委婉表达和经文传统语感，也让上下文表明其死亡；“列祖”在现代中文圣经语体中仍通顺，并比单译“死了”更贴近原文。
- source_word: וַיִּקָּבֵר
  choice: 葬在
  rationale: 准确表达קבר的Nifal被动含义；中文无须形式化添加“被”，句义仍清楚自然。
- source_word: בְּגַן בֵּיתוֹ
  choice: 在自己宫中的园子里
  rationale: בֵּיתוֹ字面为“他的房屋”，但在君王叙事中指其王室住所；“自己宫中”以自然中文传达语境所指，同时不扩展为特定建筑名称。
- source_word: בְּגַן עֻזָּא
  choice: 就是乌撒园
  rationale: 第二个介词短语与前语构成同位说明；用“就是”清楚表明这座园子名为乌撒园，并保留原文重复说明的关系。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位承继公式中表示登上王位；“作王”简洁自然，并与“接替他”共同准确表达继位。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: תַּחְתָּיו在继位语境中表示取代前王的位置。中文“接替他作王”比机械直译“在他之下”自然，也明确保留王位承继关系。
theological_decisions:
- issue: 君王死亡公式是否直接释为死亡
  choice: 保留“与他的列祖同睡”的委婉惯用语
  alternative: 译作“死了”或“与他的祖先长眠”
  rationale: 原文以惯用语表达死亡，并未在此明说其死后的状态；保留这一表达可避免加入超出文本的神学解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“列祖同睡”和“作王”保留《列王纪》王室记载的公式化语感；专名按简体中文圣经常用形式译为“玛拿西、乌撒、亚们”。
