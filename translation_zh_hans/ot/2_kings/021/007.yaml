base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: zh_hans
  text: 他把自己所造的亚舍拉雕像[a]安放在殿中。耶和华曾对大卫和他儿子所罗门说：“在这殿和我从以色列众支派中拣选的耶路撒冷，我必永远安置我的名。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚舍拉雕像”：原文把“雕像”与“亚舍拉”连用，指与亚舍拉有关或代表亚舍拉的雕刻偶像；有些译本译作“亚舍拉柱”，但本节明确说是“雕像”。
    reason: 说明原文中פֶּסֶל与אֲשֵׁרָה的组合，并保留常见替代译法。
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 安放
  rationale: 表示把特定物件放置在某处；“安放”自然庄重，也不额外推断设立仪式。
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: 亚舍拉雕像
  rationale: פֶּסֶל明确指雕刻而成的像，הָאֲשֵׁרָה表明它与亚舍拉相关；此译比“亚舍拉柱”更贴近本节措辞。
- source_word: בַּבַּיִת
  choice: 在殿里
  rationale: בַּיִת字面为“房屋”，在此明确指耶和华的殿；中文用“殿”既自然，也可在后文保留重复。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神圣名字译法，而非以称号替代。
- source_word: אָשִׂים אֶת שְׁמִי
  choice: 我要把我的名永远安置
  rationale: 保留“安置我的名”这一圣殿拣选用语，不将其解释性改写为“居住”或“彰显同在”。
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: 从以色列众支派中
  rationale: 准确表达从众支派之中作出拣选的含义。
theological_decisions:
- issue: 亚舍拉相关物件的性质
  choice: 亚舍拉雕像
  alternative: 亚舍拉柱
  rationale: 原文将“雕像”与“亚舍拉”连用，明确突出了雕刻形象；不宜把它缩窄为某种柱状祭祀物。
- issue: “安置我的名”的表述
  choice: 保留“把我的名……安置”
  alternative: 使我永远住在那里
  rationale: 原文谈的是神安置自己的名；直译保留其圣约与圣殿神学的张力，不把“名”直接等同于神的居住。
- issue: 拣选的句法所指
  choice: 将“我从以色列众支派中拣选的”明确关联耶路撒冷
  alternative: 让关系从句含混地修饰“这殿和耶路撒冷”整体
  rationale: 希伯来语关系从句紧随“耶路撒冷”，且阴性单数动词形式与该城名相合；中文拆分可清楚呈现这一关系。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“殿”按语境翻译בַּיִת，并在引语中重复，以保留原文呼应；神名译作“耶和华”。
