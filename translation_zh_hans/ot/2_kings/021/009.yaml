source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּתְעֵ֤/ם מְנַשֶּׁה֙ לַ/עֲשׂ֣וֹת אֶת הָ/רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: zh_hans
  text: 他们却不听从；玛拿西使他们误入歧途，行恶比雅威从以色列子孙[b]面前灭绝的列国更甚[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“使他们作恶，比雅威从以色列子孙面前灭绝的列国更甚。”希伯来文以“从／比列国”表达比较。
    reason: 说明比较结构可修饰“行恶”这一整体，并保留原文以“从／比”表达比较的形式。
  - marker: b
    text: 或译：“以色列人”。希伯来文直译为“以色列的儿子们”。
    reason: 说明原文的群体称谓及其自然汉语替代译法。
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: 听从
  rationale: 该动词在这里不只是听见，也含有听而回应、顺服的意思；“听从”在现代汉语中自然地兼顾这两层含义。
- source_word: וַיַּתְעֵם
  choice: 使他们走入歧途
  rationale: 这是 תעה 的使役形式，表示玛拿西主动使百姓在道德和信仰上偏离正路。
- source_word: לַעֲשׂוֹת אֶת הָרָע מִן הַגּוֹיִם
  choice: 所行的恶甚至超过……列国
  rationale: מִן 在此表示比较。该译法以自然汉语表达百姓所行之恶超过列国，同时以脚注保留希伯来语比较结构可能产生的另一种表述。
- source_word: הִשְׁמִיד
  choice: 所灭的
  rationale: 该词表示毁灭、除灭；“灭”简洁有力，也符合历史叙事语体。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文直接音译上帝的专名，不以称号替代。
- source_word: מִפְּנֵי
  choice: 从……面前
  rationale: 保留征服叙事中的希伯来语空间性惯用表达，意指把列国从以色列人所在之地除去。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列子孙
  rationale: 较贴近原文“以色列的儿子们”这一传统群体称谓，同时现代中文仍能自然理解；脚注列出更通顺的替代译法。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文使用四字神名；正文采用较贴近学界通行重构读音的“雅威”，同时承认“耶和华”是中文传统译名。
- issue: בְּנֵי יִשְׂרָאֵל 的群体指称
  choice: 以色列子孙
  alternative: 以色列人
  rationale: 正文保留原文的亲属与后裔表达，不将其理解为只指男性个体；脚注提供现代汉语中更概括的群体称谓。
- issue: 比较结构 מִן הַגּוֹיִם 的范围
  choice: 所行的恶甚至超过……列国
  alternative: 使他们作恶，超过……列国
  rationale: 希伯来语明确存在比较，但比较可在汉语中理解为恶的程度或作恶行为整体；正文采用最自然的程度比较，脚注保留较形式对应的表达。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“听从”“走入歧途”清楚表达经文的伦理与信仰语境；保留“从……面前所灭”的历史叙事色彩。脚注标记均放在相关正文成分之后。
