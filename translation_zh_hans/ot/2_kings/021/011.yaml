  text: יַעַן֩ אֲשֶׁ֨ר עָשָׂ֜ה מְנַשֶּׁ֤ה מֶֽלֶךְ יְהוּדָה֙ הַ/תֹּעֵב֣וֹת הָ/אֵ֔לֶּה הֵרַ֕ע מִ/כֹּ֛ל אֲשֶׁר עָשׂ֥וּ הָ/אֱמֹרִ֖י אֲשֶׁ֣ר לְ/פָנָ֑י/ו וַ/יַּחֲטִ֥א גַֽם אֶת יְהוּדָ֖ה בְּ/גִלּוּלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: zh_hans
  text: 犹大王玛拿西既行了这些可憎之事，比在他以前的所有亚摩利人所行的一切更为邪恶，又用他的偶像[a]使犹大犯罪，
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “偶像”所译的希伯来词含有强烈的轻蔑意味，也可译作“污秽的偶像”；更形象地说，可译作“粪偶像”。
    reason: 保留 גִּלּוּלִים 的贬义色彩及可供查考的词义选择。
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 既
  rationale: 引出下一节审判宣告的缘由；本节句末未完，用“既…… ”自然保留因果从句结构。
- source_word: מְנַשֶּׁה מֶלֶךְ יְהוּדָה
  choice: 犹大王玛拿西
  rationale: 采用现代汉语自然的头衔加人名次序，并保留其王国身份。
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: 这些可憎之事
  rationale: 既传达宗教与道德上的强烈厌恶，也比“可憎之物”更贴合这里所指的行为。
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: 所行的恶胜过……所行的一切
  rationale: 保留比较结构及“行恶”的动词意味；中文主文稍作省略以避免累赘。
- source_word: הָאֱמֹרִי
  choice: 所有亚摩利人
  rationale: 希伯来语为集合性单数，按群体意义译为复数；כֹּל 以“所有”表达。
- source_word: אֲשֶׁר לְפָנָיו
  choice: 在他以前的
  rationale: 保留时间上的先后关系，不擅自补出“住在这地”等原文未明说的信息。
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: 又使犹大陷入罪中
  rationale: 准确表达 חטא 的使役词形，表明玛拿西引致犹大犯罪，而非仅与犹大一同犯罪。
- source_word: בְּגִלּוּלָיו
  choice: 用他的偶像
  rationale: בְּ 取工具意义；主文采用清楚通行的“偶像”，其强烈贬义另在脚注说明。
theological_decisions:
- issue: גִּלּוּלִים 的蔑称意味
  choice: 偶像
  alternative: 污秽的偶像；粪污般的偶像
  rationale: “偶像”最清楚自然，而脚注保存该词刻意轻蔑、厌弃的语气，避免主文采用可能显得过度解释或突兀的表达。
- issue: 玛拿西与犹大犯罪之间的因果关系
  choice: 使犹大陷入罪中
  alternative: 使犹大犯罪；引诱犹大犯罪
  rationale: 原文使役形明确表示玛拿西导致犹大犯罪；“陷入罪中”保留此因果关系，又不额外规定他所用的具体诱导方式。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。本节在希伯来文中是下一节审判宣告的原因从句，因此以“既”开头并以逗号收束，不补成独立完整句。
