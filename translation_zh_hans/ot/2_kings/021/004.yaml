  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: zh_hans
  text: 他又在雅威的殿[a]中筑了多座祭坛。雅威曾说：“我要把我的名安置在耶路撒冷。”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿”直译为“家”，即“雅威的家”。
    reason: lexical_alternative
  - marker: b
    text: “安置我的名”是与圣殿和立约有关的表达，指雅威拣选一处，使那地方与他的名及临在相联。
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָה
  choice: 他又……筑了
  rationale: 该词是带连接词的 Qal 连续式，承接上文叙事；“又”自然表达事件的推进。
- source_word: מִזְבְּחֹת
  choice: 祭坛
  rationale: מִזְבֵּחַ 的复数形式；现代汉语中“筑了祭坛”可按集合性理解为不止一座，无须使用不自然的“祭坛们”。
- source_word: בְּבֵית יְהוָה
  choice: 在雅威的殿中
  rationale: בֵּית יְהוָה 直译为“雅威的家”，在此指耶路撒冷圣殿；“殿”既清楚又庄重，脚注保留其字面表达。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常用音译呈现四字神名，而不以称号“主”代替。
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: 雅威曾论到这殿说
  rationale: 关系从句回指“雅威的殿”；“曾”表明这话先于本节所叙事件，“论到这殿”比生硬照译关系代词更自然。
- source_word: בִּירוּשָׁלִַם
  choice: 在耶路撒冷
  rationale: 介词 בְּ 表示地点；保留原文在引语中的前置位置。
- source_word: אָשִׂים אֶת שְׁמִי
  choice: 我要把我的名安置
  rationale: 保留“安置我的名”这一圣殿—立约惯用语，不将它解释性改写为“建立我的同在”，也不增添本节未明说的“在那里”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名；音译“雅威”保留其作为以色列之神立约名字的性质，不以称号代替。
- issue: “安置我的名”的圣殿神学含义
  choice: 保留原文惯用语“把我的名安置在耶路撒冷”
  alternative: 在耶路撒冷建立我的同在；使我的名住在那里
  rationale: 原句蕴含神拣选一处与其名及临在相联的意义，但没有在本节中明说全部内涵；直译该惯用语可保留其神学张力，脚注仅提供必要背景。
- issue: 关系从句所指
  choice: 理解为雅威曾“论到这殿”说
  alternative: 理解为雅威曾“在这殿中”说
  rationale: אֲשֶׁר 在此最自然地回指“雅威的殿”，引出雅威先前关于这殿的宣告；译文不把它处理成神发言的地点。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“筑祭坛”保留圣经语境中的固定搭配；以两个句子避免关系从句过长。“安置我的名”略带礼仪性，但仍是普通读者可理解的现代汉语，并能保留原文惯用语。
