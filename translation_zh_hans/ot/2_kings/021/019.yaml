base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: zh_hans
  text: 亚们登基时二十二岁，在耶路撒冷作王两年。他母亲名叫米舒利密，是约提巴人哈鲁斯的女儿。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: 二十二岁
  rationale: 这是希伯来语表达年龄的固定句式；译为现代汉语常用的“二十二岁”，准确而自然。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 介词 בְּ 加不定式附属形在此标明即位的时间；“登基时”符合汉语君王纪年语境。
- source_word: מָלַךְ
  choice: 作王
  rationale: 该动词表示施行王权、统治；“作王”既贴近原文，也符合圣经历史叙事的庄重语体。
- source_word: בִּירוּשָׁלִָם
  choice: 在耶路撒冷
  rationale: 按地点义自然翻译，并采用现代汉语通行地名。
- source_word: וְשֵׁם אִמּוֹ
  choice: 他母亲名叫
  rationale: 保留母系谱籍信息，同时采用自然的现代汉语表达。
- source_word: מְשֻׁלֶּמֶת
  choice: 米舒利密
  rationale: 按希伯来语人名音译，并采用中文圣经中较通行的形式。
- source_word: בַּת חָרוּץ
  choice: 哈鲁斯的女儿
  rationale: 准确表达希伯来语谱系结构“某人的女儿”。
- source_word: מִן יָטְבָה
  choice: 约提巴人
  rationale: 介词 מִן 表示来源；结合紧邻的父名，在汉语中译作“约提巴人哈鲁斯”自然地说明哈鲁斯的籍贯，同时不改变原文关系。
