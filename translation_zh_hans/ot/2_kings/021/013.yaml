source:
  edition: WLC
  text: וְ/נָטִ֣יתִי עַל יְרוּשָׁלִַ֗ם אֵ֚ת קָ֣ו שֹֽׁמְר֔וֹן וְ/אֶת מִשְׁקֹ֖לֶת בֵּ֣ית אַחְאָ֑ב וּ/מָחִ֨יתִי אֶת יְרוּשָׁלִַ֜ם כַּֽ/אֲשֶׁר יִמְחֶ֤ה אֶת הַ/צַּלַּ֨חַת֙ מָחָ֔ה וְ/הָפַ֖ךְ עַל פָּנֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: zh_hans
  text: 我必把撒马利亚的准绳和亚哈家的铅垂线[a]拉在耶路撒冷之上；我必擦净耶路撒冷，就像人擦盘子[b]，擦拭着，把它翻过来，面朝下。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “准绳”也可译作“测量线”，“铅垂线”也可译作“线锤”。这里的图像是：耶路撒冷将按衡量撒马利亚和亚哈家的同一尺度受审判。
    reason: lexical_alternative
  - marker: b
    text: “盘子”也可译作“碗”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: 我必……拉在……之上
  rationale: נָטָה意为伸展、拉开；与“准绳”和介词עַל连用，描绘把量线拉在耶路撒冷之上的具体动作。
- source_word: קָו
  choice: 准绳
  rationale: קָו在此指测量或施工所用的线；“准绳”既保留具体工具意象，也自然承载衡量审判的比喻。
- source_word: מִשְׁקֹלֶת
  choice: 铅垂线
  rationale: 该词指带重物的垂直测量工具；“铅垂线”是现代汉语中清楚而准确的名称，并与“准绳”构成对应。
- source_word: בֵּית אַחְאָב
  choice: 亚哈家
  rationale: 这是王朝或家族的惯用表达；“亚哈家”简洁保留原文，并可自然理解为亚哈的王室家族。
- source_word: וּמָחִיתִי
  choice: 我必擦净
  rationale: מָחָה可表示擦去、除灭；下文以擦盘子作比喻，因此用“擦净”保留贯穿上下文的具体动作和审判意味。
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: 就像人擦盘子
  rationale: 原文第三人称阳性单数在这里作泛指；“人”不限定具体主体。צַלַּחַת可指盘、碗一类器皿，此处译“盘子”自然明白。
- source_word: מָחָה
  choice: 擦净以后
  rationale: 原文重复מָחָה，强调并推进擦拭动作；汉语用“擦净以后”既保留重复的语义，又清楚连接下一步动作。
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: 把盘子面朝下扣过来
  rationale: 字面为“把它翻在它的面上”；对盘子而言，“面朝下扣过来”比机械直译更自然，也准确呈现彻底倒空并翻扣的图像。
- source_word: שֹׁמְרוֹן
  choice: 撒马利亚
  rationale: 采用现代中文圣经语境中通行的地名译法。
- source_word: יְרוּשָׁלִַם
  choice: 耶路撒冷
  rationale: 采用现代中文圣经语境中通行的地名译法。
theological_decisions:
- issue: 撒马利亚的准绳和亚哈家的铅垂线所表达的审判性质
  choice: 保留测量工具的具体比喻，让上下文表明耶路撒冷将按对待撒马利亚和亚哈家的尺度受审判。
  alternative: 将其直接意译为“我必用审判撒马利亚和亚哈家的标准来审判耶路撒冷”。
  rationale: 测量意象在别处可能与建造或复兴有关，但本节擦净并翻扣盘子的比喻明确指向毁灭性审判。正文保留原有意象，不把解释直接写进经文。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“我必”保持宣告审判的语气；“拉在……之上”保留原文的空间图像；末句用“面朝下扣过来”自然呈现希伯来语的器皿动作。所有脚注标记均置于相关词语之后。
