  yaml_path: translation/ot/2_kings/021/026.yaml
  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: zh_hans
  text: 人们把他葬在乌撒园中他的坟墓里[a]。他的儿子约西亚接替他作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “坟墓”也可译作“墓穴”或“葬地”。原文动词形式直译为“他把他葬了”，但上下文没有明说安葬者；这里按语境译作“人们把他葬在……里”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: 众人把他葬在
  rationale: 希伯来语形式上是第三人称阳性单数“他埋葬了”，但没有明说主语；结合亚们被杀后的叙事语境，现代汉语用不定复数“众人”表达负责安葬的人，较为自然。脚注保留原文的单数形式。
- source_word: קְבֻרָתוֹ
  choice: 他自己的墓穴
  rationale: 该名词指安葬之处，可译为“坟墓、墓穴、葬地”。“墓穴”清楚表达具体埋葬地点；“自己的”体现第三人称所有格，并避免连续两个“他”造成歧义。
- source_word: גַן עֻזָּא
  choice: 乌撒园
  rationale: 保留希伯来语的属格结构含义，以现代汉语简洁自然的专名形式表达“乌撒的园子”。
- source_word: וַיִּמְלֹךְ
  choice: 作王
  rationale: 在王位继承公式中，此动词表示登上王位。与“接替他”连用，既表达即位，也符合《列王纪》的庄重叙事语体。
- source_word: תַּחְתָּיו
  choice: 接替他
  rationale: 该习语表示取代前任、承继王位；“接替他作王”是自然清楚的现代汉语表达。
theological_decisions: []
