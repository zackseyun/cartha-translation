    issue: “他的仆人众先知”同位关系不清，表达不自然。
    rationale: הַנְּבִיאִים 是对“他的仆人”的同位说明，不是修饰“仆人”的所属结构。中文以“他的仆人——众先知——”或“他的仆人，就是众先知”表达更准确。
  - severity: low
