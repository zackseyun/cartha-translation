  yaml_path: translation/ot/2_kings/021/010.yaml
  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: zh_hans
  text: 雅威借着他的仆人——众先知——说：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 说
  rationale: דבר 的皮勒式在这里表示“说话”。现代汉语用“说”自然承接下一节的直接引语，也保留叙事推进作用。
- source_word: יְהוָה
  choice: 雅威
  rationale: 按希伯来文四字神名 יְהוָה 音译为“雅威”，保留其作为以色列之神专名的性质，而不以称号替代。
- source_word: בְּיַד
  choice: 借
  rationale: 该短语字面为“借……的手”，在此是表达媒介或代理的惯用语。正文译作自然的现代汉语“借”，脚注保留其希伯来语字面形态。
- source_word: עֲבָדָיו
  choice: 他的仆人
  rationale: עבד 可指奴仆或仆人；这里描述先知受雅威差遣、服事雅威的身份，译作“仆人”最合语境。
- source_word: הַנְּבִיאִים
  choice: 众先知
  rationale: 定冠词加复数名词指这一群先知；他们与“他的仆人”构成同位关系。汉语以“他的仆人众先知”简洁表达这一关系。
- source_word: לֵאמֹר
  choice: 说：
  rationale: 该不定式用于引出后续直接话语。汉语用“说：”自然地标示下一节将开始引语，不机械重复“说话……说”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华
  rationale: 原文直接使用四字神名。采用较贴近学界通常重构读音 Yahweh 的“雅威”，保留专名，不改换为“主”等称号。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“借……说”符合普通话表达；冒号提示神谕内容将在下一节展开。
