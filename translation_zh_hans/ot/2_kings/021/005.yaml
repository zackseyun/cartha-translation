  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: zh_hans
  text: 他在雅威的殿的两个院子里，为天上的众军[a]筑了祭坛。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“天上的全军”。希伯来语“天上的众军”可指天上的军队或众天体；在这里很可能指在星辰崇拜中受到敬奉的天体或天上势力。
    reason: 保留希伯来语习语的另一种直译，并说明其在本段语境中可能的所指。
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 他……筑了
  rationale: 这是בנה的Qal叙事过去式；中文以“筑了”自然表达连续叙事中的已完成动作，不必机械译出句首连接词。
- source_word: מִזְבְּחוֹת
  choice: 祭坛
  rationale: 该词为复数，指供献祭使用的坛；现代汉语中“祭坛”本身不标示单复数，语境已表明所筑不止一座。
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: 为天上的万象
  rationale: צְבָא הַשָּׁמַיִם是指天上众军或众天体的固定表达；在本段星辰崇拜的语境中，“天上的万象”自然且保留集合性，同时用脚注保留“天上的全军”这一较形式对应的译法。
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: 在……两个院子里
  rationale: שְׁתֵּי明确表示两个；חַצְרוֹת在圣殿语境中指殿的院子。“两个院子”比单说“两院”更适合普通现代读者。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בֵּית在此指圣殿；将神名יְהוָה音译为“雅威”，并用简洁自然的“雅威殿”表达“雅威的殿”。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以现代汉语常见形式音译该名，避免用称号替代专名。
- issue: צְבָא הַשָּׁמַיִם所指对象
  choice: 天上的万象
  alternative: 天上的全军；天上所有的星辰
  rationale: 该短语可泛指天上的众军，并在此语境中很可能指受敬拜的天体或天上势力。正文不把它缩窄为“星辰”，脚注则保留原文的军事集合意象与语义张力。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“筑祭坛”保留经文语体，但不显古奥；“两个院子里”明确原文数目，并使空间关系自然清楚。
