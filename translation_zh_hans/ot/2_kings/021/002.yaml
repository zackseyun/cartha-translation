source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: zh_hans
  text: 他做了雅威[a]眼中看为恶的事，仿照雅威从以色列人[c]面前赶出去的列国所行的可憎之事[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名 יהוה（YHWH）的音译；传统汉语常译作“耶和华”或以“主”代替。
    reason: divine_name
  - marker: b
    text: 或译：“照着列国那些可憎之事而行。”
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“以色列的众子”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: 他行……看为恶的事
  rationale: 这是《列王纪》中常见的评价用语；译成“行……看为恶的事”既保留原文表达，又符合现代汉语习惯。
- source_word: בְּעֵינֵי יְהוָה
  choice: 雅威眼中看为
  rationale: 保留“在……眼中”的希伯来语意象，同时用“看为”使汉语表达自然。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以常见的现代汉语音译呈现四字神名，而不以称号替代专名。
- source_word: כְּתוֹעֲבֹת הַגּוֹיִם
  choice: 效法那些列国可憎的行径
  rationale: כְ 表示相似或依循；תּוֹעֵבוֹת 在此不仅指抽象的“可憎之物”，也指列国的宗教与道德行径。“效法……可憎的行径”准确而自然。
- source_word: הַגּוֹיִם
  choice: 那些列国
  rationale: 这里指迦南地非以色列的各族群；“列国”保留其复数和群体含义。
- source_word: הוֹרִישׁ
  choice: 赶出去
  rationale: ירש 的使役形在此表示使对方失去土地、将其逐出；“赶出去”清楚表达上下文中的驱逐行动。
- source_word: מִפְּנֵי
  choice: 从……面前
  rationale: 保留原文空间性的习语表达，指这些列国从以色列人所到之处被逐出。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: 以色列人
  rationale: 该固定族群称谓直译为“以色列的众子”；现代汉语通常以“以色列人”表达同一所指，字面形式收入脚注。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文直接使用四字神名。正文采用“雅威”以保留专名性质；“耶和华”是传统汉语形式，“主”则以称号替代了专名。
- issue: כְּתוֹעֲבֹת 所表达的比较与行为含义
  choice: 效法……可憎的行径
  alternative: 如同列国那些可憎之事；照着列国的可憎之事
  rationale: 原文既作道德评价，也指出行为模式的仿效。译文不把“可憎”弱化为单纯文化差异，同时避免擅自限定为某一种具体罪行。
- issue: בְּנֵי יִשְׂרָאֵל 的群体称谓
  choice: 以色列人
  alternative: 以色列的众子
  rationale: 在此是全体以色列民的惯用称谓，并非仅强调男性后裔；正文采用自然的现代汉语，脚注保留字面形式。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“行……看为恶的事”保留经文的正式评价语气；分号和复指句式使较长的希伯来关系从句在汉语中清楚自然。
