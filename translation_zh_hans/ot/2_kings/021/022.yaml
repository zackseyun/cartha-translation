  text: וַ/יַּעֲזֹ֕ב אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑י/ו וְ/לֹ֥א הָלַ֖ךְ בְּ/דֶ֥רֶךְ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: zh_hans
  text: 他离弃了雅威[a]，就是他列祖的上帝[b]，也没有走在雅威的道路上。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威”是希伯来文神名יהוה的音译；中文传统也常译作“耶和华”，或以“上主”代称。
    reason: lexical_alternative
  - marker: b
    text: 希伯来文为“他父亲们的上帝”；“列祖”是合乎中文经文语体的译法。也可译作“他祖先的上帝”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: 离弃了
  rationale: עזב表示离开、舍弃或弃绝；“离弃”在现代中文中清楚自然，也保留了此处对上帝不忠的意味。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以“雅威”音译四字神名יהוה，保留其作为以色列上帝之专名的性质，而不以称号替代。
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: 他列祖的上帝
  rationale: 构造短语直指“他众父祖的上帝”；“列祖”保留希伯来文的男性祖辈表达及家族、圣约色彩，“上帝”则自然表达אֱלֹהֵי。
- source_word: וְלֹא הָלַךְ
  choice: 没有行
  rationale: הלך在这里是生活行止的比喻；译作“行”可与后面的“道”配合，保留原文“行走”的圣经意象。
- source_word: בְּדֶרֶךְ יְהוָה
  choice: 在雅威的道上
  rationale: דרך在此比喻生活方式或当走的路径；“在……的道上”既保留路径意象，也能让现代读者理解为遵行雅威的旨意。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。正文采用较贴近学界通常重构读音的“雅威”，以保留专名；“耶和华”是中文传统形式，“上主”则属于以称号代替神名。
- issue: אֲבֹתָיו的祖辈称谓
  choice: 他列祖
  alternative: 他的祖先；他的父辈
  rationale: “列祖”保留原文阳性复数及其家族与圣约关联；“祖先”更现代但淡化了性别形式，“父辈”较直译却可能被误解为仅上一代。
- issue: “行在雅威的道上”的比喻
  choice: 保留行路意象
  alternative: 遵行雅威的道路；按雅威的旨意生活
  rationale: 原文以הלך和דרך构成行走于道路的意象。正文不把它完全解释为“生活”或“遵行”，从而保留原文的比喻张力。
translation_notes:
  register: 采用现代、庄重而易懂的书面语。“离弃”表达强烈的不忠意味；“列祖”略具圣经语体，但在上下文中清晰，并准确保留原文的祖辈表达。破折号标明“他列祖的上帝”是对“雅威”的同位说明。
