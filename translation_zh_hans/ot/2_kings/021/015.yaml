  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר עָשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינַ֔/י וַ/יִּהְי֥וּ מַכְעִסִ֖ים אֹתִ֑/י מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבוֹתָ/ם֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: zh_hans
  text: 因为他们做了我眼中看为恶的事；从他们的先祖出埃及的那一天起，直到今日，他们不断惹我发怒。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: 因为
  rationale: 引出上一节所宣告审判的原因；“因为”是现代汉语中自然、明确的因果连接词。
- source_word: עָשׂוּ אֶת־הָרַע בְּעֵינַי
  choice: 他们做了我眼中看为恶的事
  rationale: 既保留“在我眼中”的希伯来语评价意象，又以自然汉语表达“做恶”的惯用结构。
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: 他们不断惹我发怒
  rationale: היה加分词表示持续或惯常的行动；“不断惹我发怒”清楚传达其延续性以及使上帝发怒的含义。
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: 从……的那一天起
  rationale: 准确标明持续行为的时间起点，并与“直到今日”自然呼应。
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: 他们的先祖出埃及
  rationale: “出埃及”是现代中文圣经语境中自然且准确的固定表达；אֲבוֹתָם在此指以色列先前的世代，用“先祖”比字面“父亲们”更符合现代汉语且不缩窄所指。
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: 直到今日
  rationale: 简洁保留该希伯来语时间表达的持续意味。
theological_decisions:
- issue: 从出埃及世代延续至当代的群体性悖逆
  choice: 保留经文跨世代、群体性的历史表述
  alternative: 仅理解为对近期君王罪行的修辞概括
  rationale: 原文明确把惹上帝发怒的行为追溯到出埃及之日，并延续至“今日”；译文不将这种圣约历史中的连续性弱化为个人或近期的罪。
- issue: אֲבוֹתָם所指的先前世代
  choice: 他们的先祖
  alternative: 他们的父辈
  rationale: 该阳性亲属词在本处泛指以色列过去的世代。“先祖”准确呈现实际所指，也避免现代汉语将“父辈”误解为仅上一代男性。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。调整后半句语序，使“从……起，直到今日”紧接持续性谓语，清楚呈现长期反复惹怒上帝的含义。
