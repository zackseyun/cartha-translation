base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: zh_hans
  text: 示米押的儿子约撒拔和朔默的儿子约萨拔，他的臣仆[a]，击打他，他就死了。他们把他葬在大卫城，与列祖同葬；他的儿子亚玛谢继位作王。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “臣仆”也可译作“仆人”或“官员”；希伯来语 עֲבָדָיו 可按上下文指仆役、宫廷侍从或官员。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד בֶּן שִׁמְעָת
  choice: 示米押的儿子约撒拔
  rationale: 按希伯来语人名音译，并保留“某人的儿子”这一家系表达；句首连词在汉语并列结构中由“和”统一承接。
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: 和朔默的儿子约萨拔
  rationale: 按希伯来语音译两个人名，并以自然的现代汉语连接两个并列主语。
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 该词可指仆人、侍从或王室官员；此处涉及宫廷谋杀，“臣仆”既符合君王语境，也不把其身份限定为奴隶。
- source_word: הִכֻּהוּ וַיָּמֹת
  choice: 他们把他击倒，他便死了
  rationale: 分别表达“击打”和“死亡”两个连续动作，不将前一动词直接译成“杀死”，从而保留希伯来叙事的推进。
- source_word: וַיִּקְבְּרוּ אֹתוֹ עִם אֲבֹתָיו
  choice: 众人将他与列祖同葬
  rationale: “与列祖同葬”自然保留王室葬于先祖之中的传统表达；动词主语为复数，但原文未明确是否仍专指两名臣仆，故用不限定具体身份的“众人”。
- source_word: בְּעִיר דָּוִד
  choice: 在大卫城
  rationale: 采用这一固定地名在现代汉语圣经语境中的通行形式。
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: 他儿子亚玛谢接续他作王
  rationale: 在王位继承通告中，מלך结合 תחתיו表示继位统治；“接续他作王”清楚传达这一含义。
