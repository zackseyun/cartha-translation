base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: zh_hans
  text: 赎愆祭和赎罪祭的银钱[a]，不送进雅威的殿[b]；这些银钱归祭司所有。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “银钱”原文为“银子”。
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“雅威的家”，即圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: 款项
  rationale: 该词本义为“银子”，在本节圣殿财务与祭物收入的语境中指作为支付或收入的钱财；“款项”既自然，也能体现其专门用途。
- source_word: אָשָׁם
  choice: 赎愆祭
  rationale: 在献祭语境中指处理罪责并常涉及赔偿的祭物；“赎愆祭”是中文圣经传统中明确而稳定的名称。
- source_word: חַטָּאוֹת
  choice: 赎罪祭
  rationale: 这里的复数指祭祀类别，不是抽象的“罪”；译为“赎罪祭”符合上下文及通行中文术语。
- source_word: לֹא יוּבָא
  choice: 不送进
  rationale: 希伯来语是否定的未完成式被动，可陈述惯常或规定性的处理方式。中文“不送进”保留这种简洁表达，不额外强化为绝对禁令。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: 字面为“雅威的家”，在本节指圣殿；正文用“殿”使现代读者立即明白所指，同时脚注保留原文意象。
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: 这些款项归祭司所有
  rationale: 该分句说明这些钱财的归属。补出“这些款项”使中文指代清楚，“归……所有”准确表达分配给祭司之意。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名。采用“雅威”作为其现代汉语音译，保留这是专名的性质，而不以称号替代。
- issue: 赎罪祭名称的功能含义
  choice: 赎罪祭
  alternative: 洁净祭
  rationale: חַטָּאת 在祭司文献中也可依其礼仪功能译为“洁净祭”，但本节只是列举祭物收入类别，并未展开其功能；采用较通行的“赎罪祭”，同时不在正文中加入原文未明说的理论解释。
translation_notes:
  register: 采用现代、庄重而简明的叙述语体。“赎愆祭”“赎罪祭”保留通行的祭祀术语；“款项”比单用“钱”更符合圣殿财务语境。分号呈现原文两分句之间的对照：这些款项不纳入圣殿款项，而归祭司所有。
