  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹאָ֖שׁ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: zh_hans
  text: 约阿施其余的事迹和他所做的一切，不都记在《犹大列王大事记》[a]上吗？
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“犹大列王年鉴”。希伯来语这一名称可指王室的官方记录或编年史。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: 约阿施其余的事迹
  rationale: יֶתֶר指其余、剩下的部分；דִּבְרֵי在列王纪常见的君王纪事总结套语中，指有关君王的事或事迹，并非单指言语。译作“其余的事迹”既符合语境，也自然简洁。
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: 和他所做的一切
  rationale: 保留כָל的周全含义及原文关系从句的表达，不缩减其范围。
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: 不都记在……上吗？
  rationale: הֲלוֹא引出期待肯定回答的反问；“不都……吗”准确传达其语用功能。“记”在文献记录语境中比直译“写”更自然。
- source_word: עַל סֵפֶר
  choice: 记在《……》上
  rationale: עַל字面为“在……之上”，与סֵפֶר连用时表示写入书卷或文献；现代汉语用“记在……上”自然，并保留原有介词意象。
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: 《犹大列王大事记》
  rationale: דִּבְרֵי הַיָּמִים在王室史料引文公式中指按时日记录的史事、编年纪事或年鉴；“大事记”适合此处文献名称，且不将其误认作正典《历代志》。
- source_word: יוֹאָשׁ
  choice: 约阿施
  rationale: 采用现代中文圣经中对此犹大王通行且易辨认的译名。
