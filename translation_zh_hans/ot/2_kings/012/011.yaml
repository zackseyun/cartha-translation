base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: zh_hans
  text: 每逢他们看见箱里有许多银子，王的书记和大祭司就上来，把在耶和华殿里找到的银子捆好，并清点。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִרְאוֹתָם
  choice: 每逢他们看见
  rationale: 不定式结构在这里带时间和反复发生的意味；结合后续动词所述程序，译为“每逢”自然地表达重复情形。
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: 王的书记
  rationale: סֹפֵר在王室行政语境中指负责文书、账务等事务的官员；“书记”简明且符合历史语域。
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: 大祭司
  rationale: 直译该固定称号，指居首位的祭司。
- source_word: וַיָּצֻרוּ
  choice: 包扎起来
  rationale: 该词在此可能指把银子装束、包裹或捆扎成包；“包扎起来”保留具体动作，也避免擅自补出原文没有明说的“袋子”。
- source_word: וַיִּמְנוּ
  choice: 清点数目
  rationale: 表达对所收银子的计数核定；“清点数目”符合现代汉语财务场景。
- source_word: בֵּית יְהוָה
  choice: 耶和华殿
  rationale: 保留神名יהוה，并将“房屋”按圣殿语境译为“殿”。
theological_decisions:
- issue: יהוה的译法
  choice: 耶和华
  alternative: 上主
  rationale: 采用现代中文圣经读者熟悉的专名形式，明确对应原文神名，而不把它泛化为称号。
- issue: וַיָּצֻרוּ所述银钱处理方式
  choice: 包扎起来
  alternative: 装袋／捆起来
  rationale: 原词所指具体操作存在词义空间；正文不补明容器，用“包扎”保留把银子整理成包的基本意象。
translation_notes:
  register: 采用庄重而通顺的现代标准普通话。句式保留经文叙事的程序感；“每逢……就……”呈现反复执行的行政流程。
