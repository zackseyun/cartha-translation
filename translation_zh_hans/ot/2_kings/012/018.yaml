  text: אָ֣ז יַעֲלֶ֗ה חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יִּלָּ֥חֶם עַל גַּ֖ת וַֽ/יִּלְכְּדָ֑/הּ וַ/יָּ֤שֶׂם חֲזָאֵל֙ פָּנָ֔י/ו לַ/עֲל֖וֹת עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: zh_hans
  text: 那时，亚兰[a]王哈薛上去攻打迦特，并攻取了那城。随后，哈薛定意[b]上去攻打耶路撒冷。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “亚兰”是希伯来文的名称，传统上也常译作“叙利亚”。
    reason: cultural_note
  - marker: b
    text: 原文直译为“使自己的脸朝向”，意思是下定决心、决意前往。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: 那时
  rationale: 作为叙事中的时间标记，承接前文并引出下一事件；“那时”自然保留了希伯来文的时间推进作用。
- source_word: יַעֲלֶה
  choice: 上去
  rationale: עלה的基本义是“上去、登上”；在军事语境中也可指进军。“上去”保留原文意象，也符合迦特与耶路撒冷相关叙事的表达。
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: 亚兰王哈薛
  rationale: 采用现代中文圣经人名、地名的通行译法；“亚兰”直接对应希伯来文אֲרָם。
- source_word: וַיִּלָּחֶם עַל
  choice: 攻打
  rationale: לחם与עַל连用，在军事语境中指与某地或某方交战；“攻打”简洁明确，同时不额外增添战事细节。
- source_word: גַּת
  choice: 迦特
  rationale: 采用该地名的通行中文音译。
- source_word: וַיִּלְכְּדָהּ
  choice: 并攻取了那城
  rationale: לכד在征战语境中意为夺取或占领；阴性代词所指为迦特，用“那城”在中文中指代清楚。
- source_word: וַיָּשֶׂם חֲזָאֵל פָּנָיו
  choice: 随后，哈薛定意
  rationale: 字面为“哈薛使自己的脸朝向”，是表示坚定趋向或决意采取行动的希伯来习语；“定意”自然传达其意，同时用脚注保留原文意象。
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: 上去攻打耶路撒冷
  rationale: עלה与עַל在军事语境中表示向一座城进军；译作“上去攻打”兼顾上行意象和敌对目的，但没有断言攻击已经发生。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“上去”保留希伯来文反复出现的עלה；“定意”则以自然中文表达希伯来习语，并在脚注中说明其字面形态。
