  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: zh_hans
  text: 约阿施王召来祭司耶何耶大和众祭司，对他们说：“你们为什么不修缮殿宇[a]的破损之处[b]？现在，不要从你们所认识的人那里收钱[c]，而要把钱用于修缮殿宇。”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文直译为“房屋”，这里指圣殿。
    reason: cultural_note
  - marker: b
    text: “破损之处”也可译为“裂口”或“需要修缮的地方”。
    reason: lexical_alternative
  - marker: c
    text: “你们所认识的人”所译的希伯来语词含义不易确定；按筹款语境，也可能指“捐献者”或“出资者”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 召来
  rationale: 在本叙事语境中，קרא表示召唤某人前来；“召来”比单纯“叫”更符合君王召见祭司的庄重语境。
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: 约阿施王
  rationale: 按现代汉语习惯将王号置于人名之后，并采用通行圣经译名。
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: 祭司耶何耶大和众祭司
  rationale: 保留希伯来文先单列耶何耶大、再提众祭司的结构，不擅自加入“其他”。
- source_word: אֵינְכֶם מְחַזְּקִים
  choice: 你们为什么不修缮
  rationale: חזק本义为“使坚固”，与建筑物的破损搭配时指加固、修复；“修缮”在汉语中自然且适用于殿宇。
- source_word: בֶּדֶק הַבָּיִת
  choice: 殿宇的破损之处
  rationale: בֶּדֶק可指裂口、破损或需要修理之处；此处保留其作为修缮对象的含义。“殿宇”明确这里的“房屋”是圣殿，同时保持庄重自然。
- source_word: וְעַתָּה
  choice: 现在
  rationale: 简洁表达从责问转入命令的语篇转折。
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: 不要再……收钱
  rationale: כֶּסֶף在行政和奉献语境中指钱款。“再”体现命令要求停止此前做法，虽非独立词项，却由否定命令的语境自然引出。
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: 从与你们熟识的人那里
  rationale: מַכָּרֵיכֶם字面上指“你们所认识的人／熟人”，但此词在本节语境中的具体职能不确定。正文采用较贴近词形的译法，并以脚注列出按筹款语境理解的可能译法。
- source_word: כִּי
  choice: 而
  rationale: 此处引出与前一禁令相对的正面指示；“而”自然表达纠正或转折关系，同时不作过强解释。
- source_word: לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: 要把钱交出来，用来修缮殿宇
  rationale: 动词后缀所指为前面的钱款；“交出来”体现将所收款项转交作修缮用途，目的关系由“用来”清楚表达。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“殿宇”避免把圣殿误解为普通住宅；对于 מַכָּרֵיכֶם 则在正文保留较字面的关系性表达，并用脚注呈现语境性解释，以免消除原文的不确定性。
