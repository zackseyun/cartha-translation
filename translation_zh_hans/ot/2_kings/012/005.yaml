id: 2KI.12.5
reference: 2 Kings 12:5
language:
  code: zh_hans
  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: zh_hans
  text: 约阿施对祭司们说：“凡带进雅威殿的圣物银钱，就是每个被数点之人所交的银钱[a]、按各人估价所交的银钱[b]，以及任何人心里愿意带进雅威殿的一切银钱[c]——”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或较直译为“每个经过之人的银钱”；这里很可能指受数点者按规定缴纳的钱（参出埃及记30:13—16）。
    reason: lexical_alternative
  - marker: b
    text: 或译“为人估价所交的银钱”；可能指与许愿估价有关的款项（参利未记27:2—8）。
    reason: cross_reference
  - marker: c
    text: 原文直译为“升到某人心上的”，意思是人从心里自愿定意奉献。
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: 凡……的圣物银钱
  rationale: “圣物银钱”保留了原文“圣物之银”的结构，也让后文可以进一步列举这类圣所收入；“凡”自然表达 כֹּל 的总括意义。
- source_word: יוּבָא בֵית יְהוָה
  choice: 带进雅威殿
  rationale: “带进”体现 בוא 的使役被动语义及方向性；“雅威殿”在现代汉语中自然指圣殿，并保留神名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 采用神名的通行汉语音译，不以称号替代原文专名。
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: 每个被数点之人所交的银钱
  rationale: עוֹבֵר 字面有“经过”之意，但在此财政与礼仪语境中很可能指经过数点的人；正文表达其语境意义，脚注保留直译可能。
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: 按各人估价所交的银钱
  rationale: 该压缩短语涉及对人的估价及相应款项；此译保持法律礼仪含义，同时避免在正文中额外补入“许愿”。
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: 任何人心里愿意……的一切银钱
  rationale: 原文直译为“升到某人心上”，表示内心自愿定意；汉语用“心里愿意”自然传达该习语，脚注说明原有意象。
- source_word: לְהָבִיא בֵּית יְהוָה
  choice: 带进雅威殿
  rationale: 不定式表明内心意愿的目的；“带进”与本节前半句呼应。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用四字神名，正文以现代汉语常见音译“雅威”保留其专名性质，而不改译为称号。
- issue: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ 是否明确解释为许愿款
  choice: 正文仅译作“按各人估价所交的银钱”
  alternative: 为许愿之人估价所交的银钱
  rationale: 利未记27章的背景支持许愿估价，但本节本身没有明说“许愿”；因此正文保留较宽的法律礼仪表述，脚注仅提示可能背景。
translation_notes:
  register: 采用庄重而易懂的现代标准汉语。“银钱”既贴近 כֶּסֶף 的银质货币含义，也适合圣殿收入语境。保留句末破折号，以反映希伯来文在本节列举后尚待下一节续完的句法。所有脚注标记均置于其实际说明的短语之后。
