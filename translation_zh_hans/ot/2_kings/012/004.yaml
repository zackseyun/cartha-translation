  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: zh_hans
  text: 只是，丘坛[a]没有废除；百姓仍在丘坛献祭、烧香。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “丘坛”指地方性的高处祭祀场所；也可译作“祭祀场所”。
    reason: 说明希伯来语宗教术语所含的地形与祭祀意义，并保留较宽泛的译法。
lexical_decisions:
- source_word: רַק
  choice: 只是
  rationale: 此词承接上文并引出限制或例外；“只是”在现代汉语中自然地表达这种转折限定作用。
- source_word: הַבָּמוֹת
  choice: 丘坛
  rationale: בָּמוֹת指设在高处或称为“高处”的地方性祭祀场所；“丘坛”保留其地形与宗教双重含义，也是简明庄重的传统译法。
- source_word: לֹא סָרוּ
  choice: 还没有废去
  rationale: 字面可指“没有离去”，但以丘坛为主语时，实际表示这些场所未被撤除；“废去”既涵盖拆除，也涵盖停止其宗教用途。
- source_word: עוֹד
  choice: 仍
  rationale: 表示相关行为持续未止，与丘坛未被废去相呼应。
- source_word: הָעָם
  choice: 百姓
  rationale: 自然表达指民众的集合名词，并符合历史叙事的庄重语体。
- source_word: מְזַבְּחִים
  choice: 献祭
  rationale: 分词表示持续或惯常进行的祭祀活动；“献祭”简洁准确。
- source_word: וּמְקַטְּרִים
  choice: 烧香
  rationale: קטר在祭祀语境中可指焚香或使祭物冒烟；与“献祭”并列时，“烧香”是最自然且很可能的理解，同时不在正文中过度解释。
- source_word: בַּבָּמוֹת
  choice: 在丘坛
  rationale: 介词标明这些祭祀活动发生的地点；现代汉语用“在”最自然。
theological_decisions:
- issue: 对丘坛敬拜的评价
  choice: 正文保留历史描述性的“丘坛”，不另加“非法”或“偶像”等评语。
  alternative: 译作“地方祭祀场所”，或明说这些场所不合律法。
  rationale: 本节通过“还没有废去”暗含对这些场所持续存在的负面评价，却没有在句中明确说明其敬拜对象或性质。保留这种含蓄的神学张力，避免加入原文未明说的判断。
- issue: קטר所指的祭祀行为
  choice: 译作“烧香”。
  alternative: 译作“焚烧祭物”或“使祭物冒烟”。
  rationale: 该词在祭祀语境中的范围可以较宽，但与“献祭”并列时通常理解为烧香。采用自然且可能性最高的译法，同时承认词义本身并非绝对排除其他焚烧供物的行为。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语体。“只是”自然引出限制；分号呈现丘坛未废与百姓继续祭祀之间的紧密关系。
