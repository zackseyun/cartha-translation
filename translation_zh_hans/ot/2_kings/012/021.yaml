  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: zh_hans
  text: 他的臣仆起来，结成阴谋，在伯·米罗，在通往西拉的下坡路上击杀了约阿施。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: 他的臣仆
  rationale: 在王室语境中指王的属员或臣下；“臣仆”既保留“仆人”的字面色彩，也避免让现代读者误解为一般家仆。
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: 结党谋反
  rationale: 动词与同根名词连用，表示策划叛乱或阴谋；汉语用“结党谋反”自然表达其叛逆性质，而不机械复制同根结构。
- source_word: וַיַּכּוּ
  choice: 击杀了
  rationale: נכה本义为击打、击倒；本节及上下文表明这次袭击致命，“击杀”兼顾动作及结果。
- source_word: בֵּית מִלֹּא
  choice: 米罗宫
  rationale: בֵּית可指房屋、建筑；מִלּוֹ在此作为地点名称音译。“米罗宫”体现其为特定建筑或王室地点，但具体性质并不完全确定，故加注说明。
- source_word: הַיּוֹרֵד סִלָּא
  choice: 下往西拉的路上
  rationale: 带冠词的分词יֹרֵד描述向下延伸的通道或下坡方向；译文保留地点关系，同时采用自然汉语。
- source_word: סִלָּא
  choice: 西拉
  rationale: 专有地名，按音译处理。
