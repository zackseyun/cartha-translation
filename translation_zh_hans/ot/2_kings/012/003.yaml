  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: zh_hans
  text: 约阿施在祭司耶何耶大教导他的日子里，一直行耶和华眼中看为正的事[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直译：“约阿施行耶和华眼中看为正的事，他所有的日子，就是祭司耶何耶大教导他的（日子）。”希伯来文关系从句最自然地限定前述的日子；也可理解为说明他行正与耶何耶大的教导有关。
    reason: 保留אֲשֶׁר引导的关系从句对“他所有的日子”的时间限定，以及其可被理解为带有说明性关联的余地。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 做
  rationale: 与后面的“看为正的事”自然搭配，表达行为表现，同时贴近希伯来语常见的君王评语公式。
- source_word: הַיָּשָׁר
  choice: 看为正的事
  rationale: 该形容词在此作名词性用法；结合“耶和华眼中”，译成“看为正的事”符合现代汉语表达。
- source_word: בְּעֵינֵי יְהוָה
  choice: 耶和华眼中看为
  rationale: 保留“在……眼中”的希伯来语评价意象，又以自然汉语句式表达。
- source_word: יְהוָה
  choice: 耶和华
  rationale: 采用现代中文圣经读者熟悉的神名音译，不以称号替代专名。
- source_word: כָּל יָמָיו
  choice: 一生都
  rationale: 自然表达“他所有的日子”，同时用脚注保留后续关系从句可能限定这些日子的句法歧义。
- source_word: אֲשֶׁר
  choice: 因为
  rationale: 关系词的具体语义在此并不明确；正文按因由关系理解，表示约阿施行正与耶何耶大的教导相关，同时以脚注保留更贴近字面的读法。
- source_word: הוֹרָהוּ
  choice: 教导了他
  rationale: 使役词干在此表示教导、指导；“教导”准确而自然，不额外强化为命令。
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: 祭司耶何耶大
  rationale: 按自然汉语将职衔置于人名前，同时完整保留姓名与身份。
theological_decisions:
- issue: 约阿施行正的时间范围及其与耶何耶大教导的关系
  choice: 正文将后半句表达为原因：“因为祭司耶何耶大教导了他。”
  alternative: 可按更贴近希伯来语表层句法理解为：“在祭司耶何耶大教导他的那些日子里。”
  rationale: 希伯来语 אֲשֶׁר 是关系词，本身未明确标示因果或时间关系。正文采用通顺的因由读法，但脚注保留关系从句可能限制“他所有日子”的解释，避免消除原文歧义或断言其终身始终忠信。
translation_notes:
  register: 采用庄重、清楚的现代标准汉语。“耶和华眼中看为正”保留列王纪惯用的评价意象；正文流畅，脚注承担真实句法歧义。
