source:
  edition: WLC
  text: וְ/לַ/גֹּֽדְרִים֙ וּ/לְ/חֹצְבֵ֣י הָ/אֶ֔בֶן וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת בֶּ֣דֶק בֵּית יְהוָ֑ה וּ/לְ/כֹ֛ל אֲשֶׁר יֵצֵ֥א עַל הַ/בַּ֖יִת לְ/חָזְקָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: zh_hans
  text: 又用于支付砌墙工匠[a]和凿石匠的工钱，购买木料和采石场开采的石料[b]，修补雅威的殿的破损[c]，并用于支付修缮这殿的一切费用[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译“建筑工人”或“修墙工人”。原词可泛指从事砌筑、筑墙或修墙的人。
    reason: lexical_alternative
  - marker: b
    text: 或译“凿好的石料”或“切割过的石料”。原文指采石场的石料。
    reason: lexical_alternative
  - marker: c
    text: 原文直译为“使雅威的殿的破损之处坚固”，意思是把殿的裂口或损坏之处修好。
    reason: lexical_alternative
  - marker: d
    text: 原文直译为“以及一切为这殿出去的”，指为修缮这殿而支出的各项费用。
    reason: idiom_clarification
lexical_decisions:
- source_word: גֹּדְרִים
  choice: 砌墙工匠
  rationale: 该词源于“围住、筑墙”，在修缮圣殿的语境中指从事砌筑或修墙工作的人；“砌墙工匠”比笼统的“建筑工人”更具体，同时以脚注保留较宽泛的可能。
- source_word: חֹצְבֵי הָאֶבֶן
  choice: 凿石匠
  rationale: 该短语指凿取、切割石料的人；“凿石匠”简洁自然，也与前面的砌墙工匠相称。
- source_word: לִקְנוֹת עֵצִים
  choice: 购买木料
  rationale: 在建筑修缮语境中，עֵצִים 指施工所用木材；“木料”比泛称“木头”更准确。
- source_word: אַבְנֵי מַחְצֵב
  choice: 采石场的石料
  rationale: 原文直指从采石场取得的石头；此译保留来源含义，不强行限定为已经凿整成形的石块。
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: 修补……的破损
  rationale: חזק 本义为“使坚固”，与 בֶּדֶק“裂口、破损”连用时表达通过修补使建筑恢复坚固；中文若直译“加固破损”不自然，因此正文按语境译作“修补……的破损”，脚注保存字面意象。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בַּיִת 字面为“房屋、殿”，此处明确指圣殿；“雅威殿”在现代中文中简洁自然，并保留神的专名。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语常见音译呈现四字神名，避免用称号取代原文专名。
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: 并支付为修缮这殿而有的一切费用
  rationale: 字面“以及一切为这殿出去的”是支出的惯用表达；译为“支付……一切费用”清楚传达其经济含义。
- source_word: לְחָזְקָה
  choice: 为修缮这殿
  rationale: 该不定式说明各项支出的目的，即使建筑恢复坚固；“修缮”自然涵盖修理和加固。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文使用神的专名，而非称号；“雅威”较直接地音译该名，也不引入特定宗派解释。
- issue: “使坚固”与“修补”之间的表达
  choice: 正文按建筑语境译作“修补……的破损”和“修缮”
  alternative: 使雅威殿的破损坚固；加固这殿
  rationale: 直译在中文中容易形成“把破损加固”的错误联想。语境明确涉及修复建筑，故正文采用自然表达，并在脚注说明 חזק 的字面意义，以保留原文的加固意象。
translation_notes:
  register: 采用现代、庄重而易懂的书面汉语。由于本节语法承接上文，正文以“又用于”保留其连续性，并补出汉语表达所需的“工钱”和“支付”；不把工匠类别或石料加工程度说得过死。
