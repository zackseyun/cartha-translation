  text: כִּֽי לְ/עֹשֵׂ֥י הַ/מְּלָאכָ֖ה יִתְּנֻ֑/הוּ וְ/חִזְּקוּ ב֖/וֹ אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/015.yaml
  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: zh_hans
  text: 因为他们把银子交给做工的人，做工的人就用这些银子修缮雅威的殿[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “雅威的殿”原文直译为“雅威的房屋”，指雅威的圣殿。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 因为
  rationale: 承接上一节，说明不必要求经手人交账的原因；在现代汉语中用“因为”自然表达因果关系。
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: 交给做工的人
  rationale: 直译为“给做这工作的人”；“做工的人”保留分词结构的含义，也避免添加原文没有明说的具体工种。
- source_word: יִתְּנֻהוּ
  choice: 他们把银子交给
  rationale: 该形式为未完成式第三人称复数，并带第三人称阳性单数宾语后缀；叙事语境中表示惯常的过去行动。宾语依上下文是银子，明说“银子”可使汉语指代清楚。
- source_word: וְחִזְּקוּ
  choice: 修缮
  rationale: 动词基本义为“使坚固”，用于建筑物时指修复、加固；“修缮”兼顾建筑语境和庄重文体。
- source_word: בּוֹ
  choice: 由他们用来
  rationale: 介词与代词合起来指用前述银子进行修缮。“用来”自然表达工具或手段；“由他们”帮助呈现做工者实施修缮这一语境关系。
- source_word: בֵּית יְהוָה
  choice: 雅威的殿
  rationale: בַּיִת 字面为“房屋、家”，在此指敬拜场所，即圣殿；主文用“殿”最符合现代汉语语境，并以注释保留原文措辞。神名 יְהוָה 音译为“雅威”。
theological_decisions:
- issue: 神名 יְהוָה 的译法
  choice: 雅威
  alternative: 耶和华；上主
  rationale: 原文直接使用四字神名；“雅威”以通行的现代汉语音译保留其专名性质，不以称号替代。
- issue: בֵּית יְהוָה 的表达
  choice: 雅威的殿
  alternative: 雅威的房屋
  rationale: “殿”准确传达此处所指的圣殿；脚注注明字面形式，以保留“房屋”这一希伯来语意象。
translation_notes:
  register: 采用现代、庄重而易懂的叙事语言。“修缮”适合建筑语境；通过“把……交给……，由他们用来……”清楚呈现银子的流向和用途，同时不增添具体工种等原文未明说的信息。
