- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: 七岁
  rationale: 这是希伯来语表达年龄的固定结构；现代汉语自然译作“七岁”，不按字面译为“七年之子”。
- source_word: יְהוֹאָשׁ
  choice: 约阿施
  rationale: 按希伯来语 יְהוֹאָשׁ 的完整形式音译为“约阿施”；另有简称形式“约阿书”，宜在脚注中说明。
- source_word: בְּמָלְכוֹ
  choice: 登基时
  rationale: 介词 בְּ 加 מלך 的不定式构造及第三人称单数后缀构成时间表达，指他成为王、开始统治之时；“登基时”简洁自然，并符合君王纪年语境。
