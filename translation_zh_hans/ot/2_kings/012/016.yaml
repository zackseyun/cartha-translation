  text: וְ/לֹ֧א יְחַשְּׁב֣וּ אֶת הָ/אֲנָשִׁ֗ים אֲשֶׁ֨ר יִתְּנ֤וּ אֶת הַ/כֶּ֨סֶף֙ עַל יָדָ֔/ם לָ/תֵ֖ת לְ/עֹשֵׂ֣י הַ/מְּלָאכָ֑ה כִּ֥י בֶ/אֱמֻנָ֖ה הֵ֥ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/016.yaml
  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: zh_hans
  text: 他们不向那些受托管理银钱[b]、交给做工之人的人查账[a]，因为他们办事可靠[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 或译：“他们不要求那些人交账。”
    reason: lexical_alternative
  - marker: b
    text: 原文直译为“把银钱交在他们手中”，意为将银钱托付给他们掌管。
    reason: cultural_note
  - marker: c
    text: “可靠”也可译作“忠实”、“诚实”或“有诚信”。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: 查账
  rationale: 此处 חשׁב 的皮埃勒词干指核算或结算账目；“查账”在现代汉语中自然简明，也符合上下文。
- source_word: הָאֲנָשִׁים
  choice: 那些……的人
  rationale: 指受托管理并转交修殿款项的特定人员；汉语用“人”即可自然表达，未擅自扩大或缩小所指。
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: 受托经手
  rationale: 原文直译为把银钱交在他们手中，是委托其掌管的惯用表达；“受托经手”既传达委托关系，也符合现代汉语财务语境。
- source_word: הַכֶּסֶף
  choice: 银钱
  rationale: כֶּסֶף 可指银子或钱财；“银钱”保留银的物质背景，同时清楚表达其作为修殿经费的功能。
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: 给做工之人
  rationale: 贴近原文分词结构，指从事修缮工程的人；用语庄重而易懂。
- source_word: בֶאֱמֻנָה
  choice: 忠实
  rationale: אֱמוּנָה 在此描述可靠、诚实、值得信赖的办事方式；“忠实”保留较宽的伦理含义，不仅限于财务上的诚实。
- source_word: הֵם עֹשִׂים
  choice: 他们办事
  rationale: 原文概括这些人行事的方式；“办事忠实”在汉语中自然，并与经手款项的语境相合。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重且易懂的书面汉语。“查账”“受托经手”清楚呈现财务管理语境；“做工之人”略带经文体色彩，但不古奥。脚注标记均置于相关表达之后。
