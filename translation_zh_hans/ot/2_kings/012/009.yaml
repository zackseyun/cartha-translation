revisions:
- from: 祭司们同意不再从百姓那里收取银钱，也不再修补圣殿的破损。[a][b]
  to: 祭司们同意不从百姓那里收取钱财，也不修补圣殿的破损。[a][b]
  rationale: 删除原文未明确表达的“不再”，使两个否定不定式得到不增译的对应。修正脚注b对希伯来语定冠词的说明，同时保留“圣殿”这一符合上下文且自然清楚的正文译法。
