  text: וַ/יֵּאֹ֖תוּ הַ/כֹּֽהֲנִ֑ים לְ/בִלְתִּ֤י קְחַת כֶּ֨סֶף֙ מֵ/אֵ֣ת הָ/עָ֔ם וּ/לְ/בִלְתִּ֥י חַזֵּ֖ק אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/009.yaml
  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: zh_hans
  text: 祭司们同意不从百姓那里收取钱财，也不修补圣殿的破损。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “修补”直译为“使……坚固”；这里是指修缮破损之处。
    reason: lexical_alternative
  - marker: b
    text: “圣殿”原文直译为“殿”或“房屋”；在这里指耶和华的殿。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: 同意
  rationale: אבה在此表示同意、情愿；结合后面的两个否定不定式，用“同意”自然准确。
- source_word: הַכֹּהֲנִים
  choice: 祭司们
  rationale: 符合圣殿事务语境中כֹּהֲנִים的常规译法。
- source_word: לְבִלְתִּי קְחַת
  choice: 不再……收取
  rationale: לְבִלְתִּי加不定式表示不做某事；上下文是改变原有收款安排，因此“不再收取”在现代汉语中清楚自然。
- source_word: כֶּסֶף
  choice: 银钱
  rationale: כֶּסֶף可指银子，也可指作为支付手段的钱财；“银钱”兼顾其物质含义和行政收款语境。
- source_word: מֵאֵת הָעָם
  choice: 从百姓那里
  rationale: 直接表达介词短语的来源含义，且符合现代汉语习惯。
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: 也不再修补
  rationale: חזק字面为“使坚固”，与בֶּדֶק הַבָּיִת搭配时指修缮破损；“修补”保留对破损处进行加固修复的具体感。
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: 圣殿的破损
  rationale: בֶּדֶק指裂缝、破口或损坏之处；הַבָּיִת在本段明确指耶和华的殿，正文译为“圣殿”可避免现代读者误解为普通房屋。
theological_decisions:
- issue: הַבָּיִת所指为何
  choice: 正文译作“圣殿”
  alternative: 译作“殿”或字面译作“房屋”
  rationale: 上下文明确指耶和华的殿；“圣殿”是现代普通读者最清楚的表达，不涉及额外的宗派解释。
translation_notes:
  register: 采用庄重而自然的现代标准汉语。“银钱”兼顾原文“银子”和实际“钱款”的含义；“修补圣殿的破损”清楚呈现希伯来语搭配，同时由脚注保留其字面表达。
