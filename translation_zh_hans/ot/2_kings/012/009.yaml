    issue: 正文两处加入“不再”
    rationale: 原文的两个否定不定式表达同意不收取、不同意修缮，并未在本节明说“停止原先持续的行为”。为保留原文的限定范围，应删去“不再”。
  - severity: low
    issue: 脚注b称原文作“这殿（房屋）”
    rationale: הַבָּיִת是“那房屋／这房屋”语境中的定指“房屋、殿”，并无“这”这一指示词。脚注宜直接说明其字面义及本段所指。
  revised_text: 祭司们同意不从百姓那里收取钱财，也不修补圣殿的破损。[a][b]
