base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: zh_hans
  text: 耶户在位第七年，约阿施登基。他在耶路撒冷作王四十年。他母亲名叫洗比亚，是别是巴人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: 耶户在位第七年
  rationale: 这是列王纪常见的纪年格式；译文明确以耶户的统治年数为时间参照，并符合现代汉语表达。
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: 约阿施登基
  rationale: 此处动词用于即位公式，具有起始意义；“登基”清楚表达开始作王，也与下文统治年限相区别。
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ בִּירוּשָׁלִָם
  choice: 他在耶路撒冷作王四十年
  rationale: 此处 מָלַךְ 表示统治持续的时间；“作王”自然、庄重，并保留地点与年限。
- source_word: וְשֵׁם אִמּוֹ צִבְיָה
  choice: 他母亲名叫西比亚
  rationale: 采用自然的现代汉语语序，准确保留母亲姓名的记载。
- source_word: מִבְּאֵר שָׁבַע
  choice: 是别是巴人
  rationale: 介词 מִן 表示来源地；在人物籍贯说明中，“是别是巴人”比直译“来自别是巴”更符合汉语习惯。
