  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: zh_hans
  text: 他们把称量好的银子[a]交在受派管理雅威殿[c]工程的人手中[b]；这些人再把银子付给在雅威殿做工的木匠和建筑工人。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 也可译作“量定的银子”或“点算好的钱”。
    reason: lexical_alternative
  - marker: b
    text: “交在……手中”是原文的直译，意思是交由他们掌管。
    reason: lexical_alternative
  - marker: c
    text: “雅威”对应希伯来文的四字神名 YHWH；中文传统上也译作“耶和华”。
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: 称量好的银子
  rationale: מְתֻכָּן在这里表示经过量定、称定的钱银；圣殿工程款的语境尤其适合译作“称量好的”，同时保留“量过”而非笼统“预备好”的含义。
- source_word: עַל יַד
  choice: 交在……手中
  rationale: 保留希伯来语“在……手中”的表达，同时以“交”自然传达把银子托付给负责人掌管之意。
- source_word: עֹשֵׂי הַמְּלָאכָה הַפְּקֻדִים בֵּית יְהוָה
  choice: 受派管理雅威殿工程的人
  rationale: עֹשֵׂי הַמְּלָאכָה指承办工程的人，הַפְּקֻדִים表示他们受委派、负有管理责任；此译法避免把他们仅仅理解为一般劳工。
- source_word: וַיּוֹצִיאֻהוּ
  choice: 再把银子付给
  rationale: 该动词字面可指“拿出”，但在款项交付的语境中表示支出或拨付；“付给”是自然、准确的现代汉语。
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: 木匠
  rationale: 该词组直指从事木材加工的工匠，“木匠”在建筑语境中简洁明确。
- source_word: וְלַבֹּנִים
  choice: 建筑工人
  rationale: בֹּנִים泛指建造者；原文此处没有限定为石匠，故不采用较窄的“泥瓦匠”或“石匠”。
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: 在雅威殿做工的
  rationale: 按原文保留“在殿上做工”的宽泛说法，不凭上下文直接增译为“修缮”，从而避免缩窄语义。
- source_word: יְהוָה
  choice: 雅威
  rationale: 以现代汉语音译神名YHWH，表明原文使用的是专名而非“主”这一称号；注释同时交代传统中文形式“耶和华”及古代读音的不确定性。
theological_decisions:
- issue: 神名יְהוָה的译法
  choice: 雅威
  alternative: 耶和华；主
  rationale: 原文两次使用四字神名YHWH。“雅威”较直接地呈现通常重构的读音，并保留专名性质；不以称号“主”取代。鉴于确切古代读音无法完全确定，脚注列出传统中文音译“耶和华”。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。“称量好的银子”保留古代按重量核算贵金属货币的背景；“受派管理……工程的人”与后文实际领款做工的木匠、建筑工人形成清楚区分。需在正文首次出现“雅威”后补出脚注标记[c]，以确保所有脚注标记均见于正文。
