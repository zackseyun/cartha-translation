  text: וַ/יְהִ֗י בִּ/שְׁנַ֨ת עֶשְׂרִ֧ים וְ/שָׁלֹ֛שׁ שָׁנָ֖ה לַ/מֶּ֣לֶךְ יְהוֹאָ֑שׁ לֹֽא חִזְּק֥וּ הַ/כֹּהֲנִ֖ים אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/007.yaml
  text: It happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
translation:
  language: zh_hans
  text: 到了约阿施王第二十三年，祭司还没有修缮殿宇的破损之处[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “殿宇”原文直译为“房屋”；这里指圣殿。“破损之处”也可译为“裂口”。
    reason: 说明原文字面表达及בֶּדֶק的词义选择。
lexical_decisions:
- source_word: וַיְהִי
  choice: 到了
  rationale: 该叙事形式引出事情发展到一个新的时间节点；结合后面的在位纪年，译作“到了”自然地表达“及至……年”的推进作用，不另加原文没有的“现在”。
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: 约阿施王第二十三年
  rationale: 这是标准的君王在位纪年格式，现代汉语自然表达为“某王第二十三年”。
- source_word: לֹא חִזְּקוּ
  choice: 还没有修缮
  rationale: חזק本义为“使坚固”，但与בֶּדֶק הַבָּיִת搭配时指进行建筑修复；“修缮”既准确又符合殿宇语境。“还没有”呈现截至该纪年时工程仍未完成的状态。
- source_word: הַכֹּהֲנִים
  choice: 祭司
  rationale: 直接对应原文所指的宗教职分群体；汉语中类属复数通常无需另加“们”。
- source_word: בֶּדֶק הַבָּיִת
  choice: 殿宇的破损之处
  rationale: בֶּדֶק指裂缝、缺口或需要修复的损坏；“破损之处”保留具体的建筑损坏含义。הַבָּיִת字面为“这房屋”，但本段明确指圣殿，正文用自然且庄重的“殿宇”，脚注说明字面表达。
theological_decisions:
- issue: הַבָּיִת在本节中的所指
  choice: 正文译作“殿宇”
  alternative: 译作“房屋”并仅在脚注说明是圣殿
  rationale: 上下文明确指耶和华的殿；“殿宇”能让现代读者准确理解所指，同时脚注保留原文字面为“房屋”的信息，不引入宗派性解释。
translation_notes:
  register: 采用现代、庄重而易懂的叙事文体。“到了……年”符合汉语历史叙事中的纪年表达；“修缮殿宇的破损之处”兼顾原文结构与自然汉语。
