  name: Mandarin Chinese
  native_name: 简体中文
  variant: Modern Standard Mandarin in Simplified Chinese
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: zh_hans
  text: 犹大王约阿施取了他列祖[a]，即犹大诸王约沙法、约兰和亚哈谢所献的一切圣物，又取了自己所献的圣物，以及雅威殿和王宫库房里所有的金子，把这些都送给了亚兰王哈薛。随后，哈薛从耶路撒冷撤离了。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “列祖”在这里指约阿施王室中的先辈，并非只指他的父亲。
    reason: cultural_note
  - marker: b
    text: 原文直译为“他从耶路撒冷上去”。在这里的军事语境中，是指哈薛停止进逼并离开耶路撒冷；也可译作“哈薛离开了耶路撒冷”。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 把……都送给了（句法中以“把”引出所取之物）
  rationale: לקח本义为“拿、取”。本句所取财物最终被送给哈薛；汉语用“把”字结构统摄长宾语，既保留动作链条，又避免生硬重复“拿了……送去”。
- source_word: הַקֳּדָשִׁים / קֳדָשָׁיו
  choice: 圣物／自己所献的圣物
  rationale: קדשים指分别为圣、供神圣用途之物。“圣物”简洁保留礼仪含义；后者的代词后缀结合上下文表明是约阿施自己奉献的物品。
- source_word: הִקְדִּישׁוּ
  choice: 所献的
  rationale: 使役形表示把物件分别出来献作神圣用途。现代汉语“所献的”自然贴合圣殿财物语境，而不额外限定具体奉献仪式。
- source_word: אֲבֹתָיו
  choice: 列祖
  rationale: 这里不是仅指约阿施的生父，而是指其王室先辈；“列祖”既保留亲属称谓，也符合历史叙事语体。
- source_word: הַנִּמְצָא בְּאֹצְרוֹת
  choice: 库房里所有的
  rationale: 分词字面为“在库房中找到的／存在的”。汉语“库房里所有的”表达现存于其中的全部金子，不引入“偶然发现”的含义。
- source_word: בֵּית יְהוָה
  choice: 雅威殿
  rationale: בית יהוה在此指圣殿；译作“雅威殿”是自然、明确的现代汉语，并直接呈现专名יהוה。
- source_word: בֵּית הַמֶּלֶךְ
  choice: 王宫
  rationale: 字面为“王的房屋”，此处指王室宫殿。“王宫”符合现代汉语，也与其库房语境吻合。
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: 都送给了……哈薛
  rationale: 动词表示差送或送交；“都”概括前列全部圣物和金子，使长句关系清楚。
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: 随后，哈薛从耶路撒冷撤军了
  rationale: 该短语字面含“上去、离开耶路撒冷之上”，在军事上下文中表示哈薛停止进逼并离开。用“随后”反映叙事顺序，不把简单连接词强化成明确因果。
theological_decisions:
- issue: 神名יהוה的译法
  choice: 雅威
  alternative: 耶和华／上主
  rationale: 原文直接使用四字神名。采用“雅威”作为其音译，保留专名性质，不以称号取代，也不借此加入宗派性解释。
- issue: 约阿施交出圣物的性质
  choice: 按叙事事实陈述“送给了”
  alternative: 献贡／赎城
  rationale: 上下文可能使读者理解为以财物换取退兵，但本节动词仅说“送”。译文不把未明说的政治或神学评价写入正文。
- issue: 末句与送礼之间的逻辑关系
  choice: 随后
  alternative: 于是／所以
  rationale: 连接词是普通叙事性וַ־，并未明确标示因果。译作“随后”保留事件次序，同时让上下文中的可能因果关系保持开放。
translation_notes:
  register: 采用庄重而通顺的现代标准汉语。长串财物以“把……连同……以及……都……”组织，使原文列举关系清楚；人名采用中文圣经中通行的简体译名。
