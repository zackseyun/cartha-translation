base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: zh_hans
  text: 祭司各人要从与自己相识的人那里收取款项[a]；他们要修缮殿宇[b]中凡发现的破损之处。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “与自己相识的人”也可理解为“与自己有往来的人”。希伯来文此处未明说所收取的物品；“款项”是按本段收款语境补足，可能指各祭司从交款者那里收到的献款。
    reason: lexical_alternative
  - marker: b
    text: “殿宇”指耶和华的圣殿；希伯来文直译为“那房屋”。
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם הַכֹּהֲנִים
  choice: 祭司要……收取银子
  rationale: 未完成式在上下文中带指令意味。“要……收取”自然表达规定性语气；“银子”由本段收款语境补出，使汉语语义完整，但不把 לָהֶם 过度解释为祭司私人占有。
- source_word: אִישׁ מֵאֵת מַכָּרוֹ
  choice: 各自从与自己相识的人那里
  rationale: אִישׁ 表示逐一分配，译作“各自”；מַכָּר 基本义是相识者或有往来者。正文保留这一较直接且含义开放的表达，不武断限定为“捐献者”。
- source_word: וְהֵם יְחַזְּקוּ
  choice: 由他们修缮
  rationale: 独立代词 וְהֵם 强调祭司是负责行动的人；חזק 的加强式用于建筑维护时表示加固、修复，现代汉语以“修缮”最贴切。
- source_word: בֶּדֶק הַבַּיִת
  choice: 殿宇的破损之处
  rationale: בֶּדֶק 指裂口、损坏或需要修复的缺陷；הַבַּיִת 字面是“那房屋”，在此语境指圣殿，正文采用自然且庄重的“殿宇”。
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: 凡发现有破损的地方，都要修缮
  rationale: 该短语说明修缮范围涵盖所有查出的损坏。此译法保留“凡……都……”的周遍意义，并以自然汉语表达地点和损坏两方面。
theological_decisions: []
translation_notes:
  register: 采用现代、庄重而易懂的普通话。“修缮”适合圣殿建筑维护语境；用“殿宇”自然呈现上下文所指，同时以脚注交代原文的字面表达。
